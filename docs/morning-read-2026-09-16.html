rs and could be increased further in a bid to slow rising prices.\nRates were hiked to 3.75%-4% from 3.5%-3.75% by the Federal Reserve in a unanimous decision, despite fierce opposition from President Donald Trump, who had called for rates to be cut.\nFed Chair Kevin Warsh said the move was because \"inflation is too high and has been for too long\", adding that it was a \"sober\" and \"responsible decision\".\nHowever, Trump said rates \"should be 1%, or less, because we are the Best Credit in the World - BY FAR\".\nHigher interest rates make borrowing more expensive for people wanting to secure loans, mortgages, and credit cards, but can lead to better returns on savings.\nWarsh said during a press conference on Wednesday following the decision that, while there was \"an attitude of optimism\" within the Fed leadership, inflation remained a problem.\nLike many central banks, the Fed has a target of keeping inflation at 2% or below. Warsh noted that US inflation has been above the target \"for more than five years\".\nThat has helped make affordability one of the top concerns of American voters, who have seen fuel prices surge in response to soaring wholesale oil prices since the start of the US-Israel war with Iran. This has driven up the cost of many goods and services, as well.\nWhile the Fed \"cannot affect any individual price – whether it be oil prices, whether it be food stuffs at the grocery store\", Warsh said, the central bank can work to keep price rises from broadening across the economy.\nHe added that strength in the jobs market and wider economy meant the Fed was staying focused on stabilising prices, and that those least well off had the most to gain from lower inflation.\nCentral banks tend to increase rates when inflation is high to discourage spending and encourage saving, in the hope this will reduce the pace of price rises. But it's a balancing act, as higher rates can also encourage businesses to hold off on investing and hurt economic growth.\nWhat the higher rate means for Americans\nWhen he was confirmed, Democratic lawmakers had said Warsh would be Trump's \"sock puppet\" and many Fed watchers expected him to carry out Trump's persistent demands to slash rates. Trump had been heavily critical of Warsh's predecessor Jerome Powell for not cutting them.\nAsked on Wednesday about the message the rate hike sent to Trump, Warsh chuckled before saying: \"I have got nothing for you on a discussion with the president.\"\nSoon after, Trump said on social media: \"LOWER THE INTEREST RATES FOR THE UNITED STATES OF AMERICA, AND FAST!\"\nDemocrats on Capitol Hill said the rate increase would make loans costlier and, in turn, more Americans would go into debt.\n\"This is going to make everything become more expensive,\" said Chuck Schumer, the top Democrat in the Senate. \"This is because Donald Trump does not know how to manage the economy.\"\nThe Fed's hike is the first rate move in any direction since they were cut in December 2025. The last time they were raised was in July 2023.\nThe increase could help push up mortgage rates for home buyers and lead to Americans paying more on other types of debt.\nMajor US banks JP Morgan, KeyCorp, and BNY all raised their prime lending rate on Wednesday to 7% from 6.75%, which will affect rates charged on credit cards and personal loans.\nMortgage costs have climbed over the past year but remain below peaks seen in 2023. A 30-year fixed deal is 6.76% on average, while a 15-year deal is 6.09%, according to figures from Freddie Mac.\nMany US homeowners have 30-year and 15-year fixed-rate mortgages, and changes to interest rates will not impact their monthly repayments. But higher rates could affect those looking to secure a new mortgage or refinance.\nWarsh declined to provide his own view on where he saw the Fed's rates going, but the majority of his fellow policymakers said they believe rates would be hiked again before the end of this year to between 4-4.25%.\nA small majority also said rates could rise further to the 4.25-4.5% next year, before cuts begin in 2028 and 2029.\nThe forecast suggested price rises will ease in the coming years, with inflation, the measure used to assess the cost of living, predicted to fall steadily to the Fed's target by 2029.\nThe US Fed is not alone in facing rising inflation since the Iran war, with the European Central Bank raising rates last week and the Bank of England set to make its own decision on Thursday.\nRelated topics\n  - Published1 day ago\n  - Published5 days ago\n  - Published5 days ago", "translation_ja": "", "vocab": [{"word": "hike", "definition": "金利や価格などを引き上げること。特に金融用語として使用され、段階的または急激な上昇を意味します。"}, {"word": "inflation", "definition": "物価の継続的な上昇を指す経済現象。消費者が支払う商品やサービスの価格が時間とともに増加する状況です。"}, {"word": "monetary policy", "definition": "中央銀行が経済をコントロールするため、金利や通貨供給量を調整する政策。インフレやデフレに対処するために使用されます。"}, {"word": "refinance", "definition": "既存のローンを新しい条件のローンに置き換えること。通常、より低い金利を取得するために行われます。"}, {"word": "unanimous", "definition": "グループのすべてのメンバーが同じ意見に同意していることを意味します。本記事では、連邦準備制度理事会のすべてのメンバーが金利引き上げに同意したことを示します。"}, {"word": "persistently", "definition": "何かが継続的かつ固執的に続くこと。インフレが長期間にわたって高い水準を保つことを表現する際に使用されます。"}]}, {"title_ja": "イラン攻撃による米軍基地への広範な被害が写真で明らかに", "title_en": "Photos reveal extensive damage to US military bases from Iranian strikes", "summary_ja": "BBCが入手した写真により、サウジアラビアとクウェートの米軍施設がイラン攻撃で大きな被害を受けたことが判明しました。破壊されたレーダー航空機や損傷した建造物を含む広範な被害が映っています。国防総省の監察官報告書は、中東全域の数百の建造物が破壊され、装備損失が37億ドルに達したことを確認しました。", "summary_en": "Photographs obtained by BBC show significant damage to US military facilities in Saudi Arabia and Kuwait from Iranian attacks, including a destroyed radar aircraft and damaged structures. A Pentagon watchdog report confirmed that hundreds of buildings across multiple Middle East bases have been damaged or destroyed, with equipment losses totaling $3.7 billion. Military analysts suggest the damage reveals inadequate US defensive preparations and raises concerns about broader military readiness.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8g49e0gwxeno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Photos show widespread damage at US sites from Iranian attacks\n- Published\nImages showing widespread damage to multiple US sites in the Middle East from Iranian strikes have been obtained by the BBC's US partner CBS.\nThe photos, provided by active military personnel, show a severed radar jet, flattened trailers and severely damaged buildings.\nThe undated photos were taken at US bases and sites in Saudi Arabia and Kuwait.\nOne member of the military, who was not named by CBS, said: \"This is major damage to our bases that hasn't been communicated to the American public.\n\"We're standing there with our eyes closed getting punched in the face.\"\nThe White House referred the BBC to US Central Command. Centcom did not immediately respond to a request for comment.\nThe photos, which have not been independently verified by the BBC, were published the day after a report from the Pentagon's watchdog confirmed hundreds of buildings and structures at US bases in the Middle East have been damaged and destroyed by Iran.\nOne of the photos showed a destroyed Boeing E-3 Sentry at Prince Sultan Air Force Base in Saudi Arabia that has been ripped in half, its tail section crumpled into a tangled mess of metal.\nWhile the photo is undated, BBC Verify previously confirmed a similar photo, apparently of the same radar aircraft in March.\nThe Boeing E-3 Awacs are used to detect and track potential targets at long ranges to provide an early warning of possible threats.\nAt the time, a US official told Reuters that 12 US personnel had been wounded, two of them seriously, in an Iranian attack on the air base.\nA pair of undated images reportedly from Camp Beuhring, Kuwait, show crumpled trailers, and a large tent-like structure that had been reduced to shreds as smoke billowed from the site.\nAnother image shows a four-storey building damaged by an Iranian strike at Camp Arifjan, in Kuwait.\nDamage to the site was reported in March, including on satellite communications hardware, though it is not clear whether this image is from the same attack.\nBrian Katulis, a former national security official under both Democratic and Republican administrations, said that the damage visible in the images showed that \"America had not adequately prepared its defences\".\n\"And there is strong evidence that US adversaries like China and Russia may have helped Iran in targeting,\" added Katulis, now a senior fellow at the Middle East Institute. \"The Trump administration has done nothing to address these vulnerabilities.\"\nThe images were published on the heels of a report from the Pentagon's watchdog, which found Iranian strikes had \"damaged and destroyed hundreds of buildings and structures at US bases in Kuwait, Bahrain, Qatar, UAE, Saudi Arabia, Iraq, Oman, and Jordan during the conflict\".\nIt also noted that equipment losses have totalled $3.7bn (£2.8bn). Overall, the US spent $33.4bn (£24.7bn) on the war up to 29 June, the report said.\nIn the months after the war began, \"dozens of US aircraft were destroyed or damaged\", the report continues.\nThe document lists several of the aircraft damaged, including five refuelling aircraft which were \"damaged or destroyed on the ground in Saudi Arabia by Iranian munitions\".\nA separate report , externalfrom the Congressional Budget Office (CBO) notes that the E-3 aircraft is no longer in production and would have to be replaced with a more modern equivalent, the E-7.\nThe CBO noted that the E-3 aircraft alone costs $500m (£371m), and the estimated total cost of equipment lost in battle - including planes, drones and a terminal high altitude area defence system - amounts to $1.9b (£1.4b).\nCBO said that its review was subject to \"uncertainty\" because the defence department did not respond to its requests for information, requiring the agency to rely on government databases and public reports.\nAdditionally, the extent of repairs and rebuilding that the US military plans to do remains unclear, according to the report.\nBrian Katulis of the Middle East Institute said that while \"these costs show how the Trump administration burned through precious military resources without having much to show for it\", the greater damage had been to broader US military readiness.\n\"The United States had to divert military assets from Asia to the Middle East, leaving America and its partners in Asia more exposed and vulnerable to China,\" he said.\n\"In addition, the depletion of US munitions makes Russia more willing to probe vulnerabilities with America's NATO allies and continue its aggressive war against Ukraine.\"\nWhile the US has the financial resources to address the equipment losses, it is already facing budgetary problems and may not be able to do so fast enough to prepare for potential flare-ups in the Middle East or elsewhere in the world, he added.\nPublic and political pressure has mounted on the White House to find an end to the conflict with Iran, which began on 28 February when the US and Israel launched joint attacks on the country.\nSince", "translation_ja": "", "vocab": [{"word": "watchdog", "definition": "監視・監察機関。政府や企業の不正や非効率を監視・報告する独立した組織を指す。"}, {"word": "munitions", "definition": "弾薬・軍需品。戦争や武力紛争で使用される爆発性武器や弾薬の総称。"}, {"word": "vulnerabilities", "definition": "脆弱性・弱点。攻撃や被害を受けやすい弱い部分を意味する。"}, {"word": "divert", "definition": "転用する・逸らす。本来の目的から別の目的に変更・移動させること。"}, {"word": "depletion", "definition": "枯渇・減少。資源やリソースが徐々に減少し、不足すること。"}, {"word": "readiness", "definition": "準備態勢・即応能力。すぐに行動や対応ができる状態の度合い。"}]}, {"title_ja": "EU首脳、米国との緊張の中でカナダを初の「準加盟国」として支持", "title_en": "EU Chief Backs Canada as First 'Associate Member' Amid US Tensions", "summary_ja": "欧州委員会のウルスラ・フォン・デア・ライエン委員長は、カナダがEUの初の「準加盟国」となることを支持する提案を承認しました。防衛、技術、AI等の分野での緊密な関係を提供するものです。この動きはカナダが米国との貿易紛争およびトランプ大統領の併合脅迫により悪化する関係に直面している中で生じています。フォン・デア・ライエン委員長は、このパートナーシップは他国への対抗ではなく、共有する民主的価値観と共通利益に基づくものであると強調しました。", "summary_en": "European Commission President Ursula von der Leyen has endorsed proposals for Canada to become the EU's first 'associate member,' offering closer ties on sectors including defence, technology, and AI. The move comes as Canada faces deteriorating relations with the US over trade disputes and Trump's threats of annexation. Von der Leyen emphasized the partnership would be based on shared democratic values and common interests rather than opposition to any other nation.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cjwyzrr9d3dko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "EU chief backs plan for Canada to become 'associate member'\n- Published\nThe president of the European Commission has backed proposals for Canada to become the EU's first \"associate member\".\nUrsula von der Leyen told the European Parliament on Wednesday she wanted to work on \"opening the door\" for Canada, which would involve closer ties on various key sectors.\nCanadian Prime Minister Mark Carney last week spoke of seeking a \"unique alliance\" with the EU. The country currently faces tense relations with the US, compounded by an intensifying dispute over trade.\nWithout mentioning US President Donald Trump by name, von der Leyen said offering Canada some sort of EU membership was \"not a partnership against anyone else, but for our common strength\".\nShe added: \"Partnerships are a strategic choice for Europe. But they also respond to the fracture in the international rules-based system\".\nCarney was in attendance at the annual key note speech in Strasbourg, and is due to address the parliament on Thursday.\nTrade talks between Canada and the US collapsed last month, sparking a series of new tariff measures. Trump's repeated talk of making Canada a \"51st state\" has also helped to fuel the feud between the North American neighbours.\n- Carney's new love-in with EU has everything to do with Trump \n  - Published12 hours ago\nVon der Leyen told the EU's State of the Union address that the bloc and Canada \"see the world with the same eyes\", including on topics ranging from AI, to climate change and geopolitics.\n\"And we have stood together: on Ukraine, on defence, on raw materials and on supply chains. But above all... Europe and Canada believe in democracy.\"\nShe did not give specific details on how any Canadian membership would work, but listed manufacturing, technology, AI, defence, energy, critical minerals and economic security as key areas for cooperation.\nBoth she and other European leaders have found a reliable ally in Carney as they deal with similar problems.\nIn particular, they have faced Trump's aggressive use of tariffs and his threat to annex Greenland which is a sovereign territory of EU member Denmark.\nBut \"associate membership\" of the EU does not currently exist and the process, if agreed, could take years.\nEarlier this year, Germany's Chancellor Friedrich Merz suggested - to a mixed reaction - that Ukraine could be granted this new status.\nSome countries in the western Balkans including Albania, Bosnia and Herzegovina, Montenegro, North Macedonia, and Serbia are already on the long road towards full EU membership.\nIn Eastern Europe, Georgia and Moldova are also applying.\nTen of the bloc's 27 members are yet to ratify a free-trade agreement struck with Ottawa nearly a decade ago, and some capitals would prefer to build on existing defence and trade agreements rather than create a new form of membership for Canada.\nSetting out the EU's political and policy priorities for year ahead, von der Leyen also proposed the formation of a European Security Council, which would include the UK and Ukraine, amid an ongoing threat to the continent from Russia.\n\"For a long time, we have discussed a leaders' format focused on the security of our continent, with partners like Canada, Norway, Ukraine, the United Kingdom and others involved,\" she said in the wide-ranging address.\n\"This is even more urgent now, given the nature and scale of the risks at play. This is why we will set out our ideas to make a European Security Council a reality.\"\nCalls for such a body have been growing since Russia's full-scale invasion of Ukraine in 2022.\nIt was initially a French-German conception but more countries have shown support, particularly as Trump has questioned the Nato military alliance. Other nations worry such a council could unhelpfully rival Nato.\nVon der Leyen said the EU was \"strengthening our work with Nato\" and that expanded defence spending would be \"fully aligned\" with the alliance.\nBut at the core of such a security council would be the ability to trigger an emergency meeting if one member felt under threat, similar to Nato's Article 4.\nThe EU chief said it would be a \"mechanism to flank\" Article 4, a term that could be interpreted as complementing Nato functions or - if taken in a military context - bypassing them.\nAlongside global threats, von der Leyen also said many European families were worried about the cost of living, and the \"dizzying speed of change\" of technology and its impacts on jobs and society.\nOther proposals included inviting the world's largest AI labs for talks on how to support industry efforts to pace the frontier, as well as slashing bureaucracy for businesses in the EU.\nPlans to curb social media use among children, including banning platforms for under 13s, were also put forward. Under the proposal, children aged 13 to 15 would only be able to set up social media accounts which are supervised by parents.\nA new emergency tool to help countries better deal with mass migration movements following the d", "translation_ja": "", "vocab": [{"word": "associate member", "definition": "正式な加盟ではなく、限定的な権利と特権を持つ国家的地位。通常、段階的な統合プロセスの前段階として機能します。"}, {"word": "tariff", "definition": "政府が輸入商品に課す税金。国際貿易紛争において経済的圧力ツールとして使用されます。"}, {"word": "ratify", "definition": "国家が正式に条約や協定を承認し、法的に拘束力を持たせるプロセス。議会などの公式な手続きが必要です。"}, {"word": "geopolitics", "definition": "地理的位置が国家間の権力関係と政策に与える影響を研究する分野。国際関係の戦略的側面を分析します。"}, {"word": "annex", "definition": "ある国が別の領土を武力または権力により自国に併合する行為。国際法上、通常違法とみなされます。"}, {"word": "fracture", "definition": "システムやグループの亀裂や分裂。特に国際秩序の弱体化や一体性の喪失を意味します。"}, {"word": "flank", "definition": "側面から支援する、または補完する。軍事戦略では側面から攻撃または防御することも意味します。"}]}, {"title_ja": "行方不明の3歳児ノア・ウッズ君の捜索で遺体発見", "title_en": "Body Found in Search for Missing Three-Year-Old Noah Woods", "summary_ja": "火曜日にサフォーク州ブランサムで行方不明になった3歳のノア・ウッズ君の捜索中に、近くの池から遺体が発見されました。警察は死亡は不審なものではなく、原因不明として扱われていると確認しました。公式な身元確認は進行中です。この捜索には1,300人以上の市民が参加しました。", "summary_en": "A body has been recovered from a pond near Brantham, Suffolk, in the search for three-year-old Noah Woods who went missing on Tuesday. Police confirmed the death is being treated as unexplained but not suspicious, with formal identification pending. Over 1,300 members of the public participated in the extensive search effort.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm93v1573vqro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Body found in search for missing Noah Woods, 3\n- Published\nA body has been found in the search for missing three-year-old boy Noah Woods, police have confirmed.\nNoah disappeared at about 15:00 BST on Tuesday from a playground in Brantham, Suffolk, after becoming separated from a relative.\nSupt Tom Pearse of Suffolk Police said dive teams recovered the body of a child from a nearby pond.\nHe said the death was being treated as unexplained but not suspicious.\nSupt Pearse said formal identification had yet to take place, but Noah's family had been informed.\n\"Our thoughts are with Noah's family and all those who knew him,\" he said.\n\"We have been overwhelmed by the outpouring of public support and people putting on their boots to help.\"\nPolice said at least 1,300 members of the public had helped in the search for the missing boy, who was non-verbal and partially deaf.\nPeople from as far afield as Birmingham and Hampshire had turned up to help.\nHelicopters, dog units and members of the public had been scouring the area, close to the estuary of the River Stour on the Essex border.\nVolunteer efforts had been co-ordinated from Brantham Leisure Centre and the village hall, which ran out of hi-vis vests due to the number of volunteers.\nThose looking for Noah had been told he would not respond to shouting.\nMichael Crowley, who was working opposite the playground on Tuesday and was one of the last people to see Noah before he went missing, said: \"He looked happy and healthy as anything.\"\nJessica Gammons, a mother-of-two from Kelvedon, in Essex, was among the many volunteers who went out to look for the toddler.\nShe said she felt compelled join the search, despite being heavily pregnant, because her son, like Noah, is three years old.\n\"I kept thinking to myself 'If this was my son, I'd want everyone possible to help,'\" she said.\n\"It's such a sad situation. I can't stop thinking about him.\"\nSearches had widened to include East Bergholt and Manningtree, over the Essex border, on Wednesday.\nDivers from the Metropolitan Police were called in to search Decoy Pond, a nearby fishing lake.\nThe pond is about 350 yds (320m) away from the playground where Noah was last seen.\nSupt Pearse continued: \"Since Noah was reported as missing, a vast number of our officers and staff have been deployed in numerous functions in the search for Noah and support for his family.\n\"We've been supported by Suffolk HART (Hazardous Area Response Team), SULSAR (Suffolk Lowland Search and Rescue), Environment Agency, HM Coastguard, Fire and Rescue Service and the ambulance service.\n\"As a parent myself, I completely understand why people would want to help and such a response is one that typifies the strong sense of community and the heart-warming nature of Suffolk people that make the county such a special place.\n\"I am sure you appreciate the family now need time, space and privacy and I thank you for your understanding in this.\"\nRelated topics\n  - Published16 hours ago", "translation_ja": "", "vocab": [{"word": "estuary", "definition": "河川が海に流入する地点で、海水と淡水が混在する地域。地理学や環境用語として使用されます。"}, {"word": "deployed", "definition": "戦略的に人員や資源を配置・展開すること。軍事用語から広く組織運営で使われます。"}, {"word": "outpouring", "definition": "感情や支持などが大量に流れ出ること。強い感情や行動の急激な表現を示します。"}, {"word": "scouring", "definition": "場所を徹底的に探索・捜索すること。細かく丹念に調べることを意味します。"}, {"word": "compelled", "definition": "強い力や義務感に駆られて何かをすること。心理的に強制される状態を表します。"}, {"word": "typifies", "definition": "特定の特性や特徴を代表・象徴すること。典型的な例として機能することを示します。"}]}, {"title_ja": "ダイアナ妃の死後、チャールズ国王に関するアールスペンサーの主張に対して宮殿が応答", "title_en": "Palace Responds to Earl Spencer's Claims About King Charles After Diana's Death", "summary_ja": "バッキンガムパレスは、ダイアナ妃の死後数日でチャールズ国王が「やがて彼女を忘れるだろう」と述べたというアールスペンサーの主張に応答しました。この主張はスペンサーの近刊回顧録に掲載されており、チャールズがダイアナの死に対する国民の反応に怒っていたことを示唆しています。宮殿は、悲しみは記憶と判断に影響を与える可能性があると述べました。", "summary_en": "Buckingham Palace has responded to allegations by Earl Spencer that King Charles said \"we'll forget her soon enough\" days after Princess Diana's death. The claims appear in Spencer's upcoming memoir and suggest Charles was angry about the public's reaction to Diana's death. The Palace stated that grief can affect memory and judgment.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8e3rk47r4ego?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'Grief can colour memory': Palace responds after Earl Spencer's claim in Diana book\n- Published\nBuckingham Palace has responded after a claim by Earl Spencer, the brother of Diana, Princess of Wales, that King Charles said \"we'll forget her soon enough\" days after her death.\nEarl Spencer alleged the then-Prince of Wales subjected him to a \"stream of anger\" after he insisted Diana would not have wanted Princes William and Harry, then aged 15 and 12, to walk in her funeral procession.\nThe claim was made in an extract from his upcoming memoir, published by the Daily Mail.\nA Palace spokesperson said: \"While we do not comment on books as a matter of principle, His Majesty is mindful that the pain of fraternal grief can cloud reason, affect judgment and colour memory in ways others do not recognise, even many years after such a loss.\"\nSwan Song: Diana, My Sister is due to be published next week and is expected to be highly critical of the Royal Family. BBC News has not seen the book in full.\nIn the first extract, external from it to be made public, Earl Spencer claims to have been informed by a senior Palace aide that the young princes would walk alongside Princess Diana's coffin, which he objected to.\nHe claims to have received a phone call from Charles shortly after.\nEarl Spencer wrote in the book: \"He [Charles] unleashed down the phone what I have always taken to be his pent-up contempt for Diana, and his horror that the world was so bowled over by her death. 'Rest assured,' he hissed, 'we'll forget her soon enough'.\"\nEarl Spencer's book about his sister seems set to open a very difficult time in the recent history of the Royal Family.\nThe death of Diana, a hugely popular figure, in a car crash in 1997, had created a volatile atmosphere, in which the royals were accused of failing to show feeling and empathy, and had seemed out of touch with the public mood.\nEarl Spencer's emotional and defiant speech at her funeral added to that cloud of grievance hanging over Diana's untimely death.\nPrince Harry has previously said that walking behind his mother's coffin aged 12 was something no child \"should be asked to do\".\nIn 2017, he told the BBC he didn't \"have an opinion whether that was right or wrong\", but \"looking back on it\", he was glad to have been part of the day.\nEarlier on Wednesday, it emerged that copies of Earl Spencer's unreleased book had been stolen from a truck in the Netherlands.\nBBC News understands four copies of the Dutch language edition were taken from a truck while it was en route from the Dutch publisher's printers to their warehouse.\n  - Published6 days ago", "translation_ja": "", "vocab": [{"word": "fraught", "definition": "緊張した、危険な状態にある。この場合、感情的に複雑で難しい状況を表します。"}, {"word": "volatile", "definition": "不安定な、変わりやすい。特に感情や状況が急激に変化する傾向があることを意味します。"}, {"word": "contempt", "definition": "軽蔑、侮辱。相手を非常に低く評価し、尊重しない感情のことです。"}, {"word": "pent-up", "definition": "抑圧された、押さえ込まれた。長い間表現されなかった感情やエネルギーが溜まった状態です。"}, {"word": "empathy", "definition": "共感、感情移入。他者の気持ちや経験を理解し、共有する能力のことです。"}, {"word": "grievance", "definition": "不満、苦情。不公正または不適切な扱いに対する不満や怨恨です。"}]}, {"title_ja": "「プットニー・プッシャー」容疑者、自宅で遺体で発見", "title_en": "'Putney pusher' suspect found dead at home", "summary_ja": "2017年にロンドン西部のプットニー橋でバスに押し出された女性事件の容疑者ニコラス・ブランドラム（44歳）が自宅で遺体で発見された。彼は6月に重大暴行未遂容疑で逮捕され、捜査継続中の身で釈放されていた。警察は彼の死亡は予期しないものだが、不審な点はないと確認した。", "summary_en": "Nicholas Brandram, 44, a suspect in the 2017 'Putney pusher' case where a woman was pushed toward a bus on Putney Bridge in west London, has been found dead at his home. He was arrested in June on suspicion of attempted grievous bodily harm and was released under investigation. Police confirmed his death was unexpected but not believed to be suspicious.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6783ekp0yn8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'Putney pusher' suspect found dead at home\n- Published\nThe man suspected of pushing a woman into the path of a bus during a run on Putney Bridge in west London in 2017, has been found dead at his home.\nNicholas Brandram, 44, was under investigation in the so-called \"Putney pusher\" case, after CCTV went viral showing just how close the woman came to being run over by the 430 bus, in a seemingly unprovoked attack.\nHe was arrested in June this year on suspicion of attempted grievous bodily harm. Last week, the Metropolitan Police confirmed he had been released under investigation.\nThe banker was found dead in his home on Tuesday evening. The Met said his death was being treated as \"unexpected, but is not believed to be suspicious\".\nA spokesperson for the force said officers attended the property in Chiswick alongside paramedics \"after a man was found unresponsive\".\n\"Sadly, a 44-year-old man was pronounced dead at the scene. His next-of-kin have been informed,\" they said.\nBrandram, who served as a Captain in the Scots Guards in Afghanistan, was working more recently in private banking for HSBC.\nHe is a relative of European royalty - a direct descendant of Queen Victoria, his great grandfather was King Constantine I of Greece, his grandmother was Princess Katherine of Greece, and the late Duke of Edinburgh, Prince Philip, was his father's godfather.\n'Quick reactions'\nWhile in police custody in June over the Putney Bridge incident, Brandram was also arrested on suspicion of drug possession.\nShortly after the incident in 2017, investigating officer Sgt Mat Knowles said: \"It was only due to the superb quick reactions of the bus driver that she was not hit by the vehicle.\"\nBus driver Oliver Salbris told the Sunday Times following the incident: \"If I hadn't swerved, I would have smashed her head.\n\"It was reflex. The consequences would have been terrible for her – and for me.\"\nDetectives identified more than 50 people of interest following the incident.\nThe Met had initially closed its investigation in 2018 after three men had been arrested and released without charge.\nListen to the best of BBC Radio London on Sounds and follow BBC London on Facebook, external, X, external and Instagram, external. Send your story ideas to hello.bbclondon@bbc.co.uk, external", "translation_ja": "", "vocab": [{"word": "unprovoked", "definition": "理由や原因のない、突然の。攻撃や行為が明らかな理由なく起こることを意味し、ニュースや法的文脈でよく使われる。"}, {"word": "grievous bodily harm", "definition": "重大な身体危害。法律用語で、他人に対する深刻な傷害罪を指す。"}, {"word": "unresponsive", "definition": "反応しない、意識がない。医学的または緊急時の文脈で、人が刺激に応答しない状態を表す。"}, {"word": "suspended", "definition": "一時停止、中断。調査や手続きが一時的に止められている状態を意味する。"}, {"word": "reflex", "definition": "反射、反射的反応。意識的な判断なく自動的に起こる反応や行動を指す。"}]}, {"title_ja": "気候変動がネパールの致命的な山崩れを悪化させた", "title_en": "Climate Change Worsened Nepal's Deadly Mountain Collapse", "summary_ja": "2026年8月、氷河と岩石なだれがネパールとチベットで大規模な洪水を引き起こし、約1,400人が死亡しました。科学者らは、気候変動が氷河の後退、永久凍土の融解、極端な気温を通じて、数十年にわたって山の斜面を不安定化させ、この稀な災害の条件を作ったと判定しました。この事象はネパールの早期警戒システムを上回る能力で発生し、このような複雑な連鎖災害は地域的な適応だけでは完全に防ぐことができないことを示しています。", "summary_en": "Nearly 1,400 people died when a glacier and rock avalanche triggered catastrophic floods in Nepal and Tibet in August 2026. Scientists determined that climate change—through glacier retreat, permafrost thawing, and extreme temperatures—destabilized the mountain slope over decades, creating conditions for the rare disaster. The event exceeded Nepal's early warning capabilities, highlighting how such complex cascading disasters cannot be fully prevented through local adaptation alone.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/how-climate-change-worsened-nepal-s-deadly-mountain-collapse/a-79293578?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "How climate change worsened Nepal's deadly mountain collapse\nSeptember 17, 2026\nNearly 1,400 people have died after a mountain slope collapsed and flash floods swept through the valleys of Nepal and Tibet. More than 5,000 people remain missing.\nThe collapse was initially thought to have been caused by an earthquake. Now, glaciologists and climate scientists have determined that a complex series of factors led to the disaster, with climate change laying the groundwork several times over: Warming temperatures receded the glacier, thawed permafrost and increased meltwater, destabilizing the slope until it gave way on August 26.\n\"This was not a single trigger event,\" Walter Immerzeel, a mountain hydrologist at Utrecht University in the Netherlands, told journalists on a press call. \"The failure occurred at an elevation of about 5150 meters (about 16,896 feet) and there were several processes acting together over time scales of years to decades, rather than one factor acting alone.\"\nHow the disaster unfolded\nThe floods began upstream with a large rock avalanche on the north face of Langtang Lirung. That caused a section of the glacier to collapse at the same time, sending roughly 110 million cubic meters of rock and glacier ice, the size of 44,000 Olympic swimming pools, hurtling downward. That type of rock avalanche is rare, occurring at this size only once every 1,000-10,000 years.\nThe material fell about 1,400 meters (4,593 feet) from the mountain to the valley floor, picking up debris, water, ice, rock and sediment as it descended. The impact released as much energy as a magnitude 5.2 earthquake. As it crashed into the valley, it also tore up buried glacier ice, adding up to 30 million more cubic meters of debris and water to the flow.\nWithin about seven minutes, the flood reached Nepal and China's Rasuwagadhi border, 20 kilometers (about 12 miles) downstream, moving at an average speed of 170 kilometers per hour (about 106 miles per hour). The flood continued downstream, traveling 200 kilometers in under seven hours.\nHow did this happen?\nIt was a complex combination of conditions, exacerbated by climate change, that allowed the slope to collapse in the first place. That's according to researchers with World Weather Attribution, an international collaboration of scientists that looks at the role of climate change in extreme weather and disaster events.\nRising temperatures, due to the burning of fossil fuels, have reshaped this stretch of the Himalayas for decades.\nNear the failure site, the glacier's edge had retreated just 75 meters between 1964 and 2000. But between 2010 and 2026, it dramatically accelerated, retreating another 373 meters. That stripped away the ice supporting the rock wall above it.\nPermafrost — or permanently frozen ground within the rock — had also started to thaw. That took place between 4,500 and 5,500 meters of elevation, a critical band that's most sensitive to warming. As it thawed, the mountain walls became more and more unstable.\nIn the immediate run-up to the collapse, conditions were extreme. July and August overall were the warmest on record in the area, with climate change adding about 1.5 degrees Celsius (2.7 degrees Fahrenheit) to the region. On August 24 and 25, temperatures ran roughly 2.5 to 2.7 degrees Celsius above the 10-year average. A day before the catastrophe unfolded, the maximum temperature was approximately 7 degrees Celsius above the reference mean.\nAn unusually snowy October in 2025 likely also played a role, generating more meltwater.\nResearchers also believe a 2015 earthquake played a role. That magnitude-7.8 quake triggered an earlier avalanche at Langtang Lirung, which may have weakened the rock mass in the years since, priming the slope for failure.\nA disaster beyond adaptation\nResearchers also tried to find out whether this was a disaster the region could have prepared for and adapted to. They determined it was uniquely hard to detect, as Nepal's early warning systems are designed for forecastable rainfall-driven floods, not quickly developing, cascading events like this one.\nEssentially, this kind of complex threat exceeds the limits of adaptation.\nThe flood outran Nepal's early warning systems and destroyed several monitoring gauges in its wake. The first mass SMS warning was sent about 38 minutes after the initial collapse, but the flood had already reached the border 7 minutes in.\n\"When warming destabilizes the roof of the world, no amount of local adaptation can fully shield vulnerable people downstream from this scale of destruction,\" Friederike Otto, professor of climate science at Imperial College London, said.\n\"Without much faster action to transition to zero fossil fuel emissions we will inevitably see more disasters of this scale occurring in the years to come.\"\nEdited by: Sarah Steffen", "translation_ja": "", "vocab": [{"word": "exacerbate", "definition": "悪化させる、より深刻にすることを意味します。気候変動が災害を悪化させるなど、既存の問題を増幅させる場合に使用されます。"}, {"word": "permafrost", "definition": "永年凍土、または永遠に凍結した地盤のことです。気候温暖化によって融解することで地盤が不安定になるため、山地災害に関連する重要な用語です。"}, {"word": "destabilize", "definition": "不安定にする、バランスを崩すことを意味します。物理的な構造や体制の安定性を損なわせる場合に使用されます。"}, {"word": "cascading", "definition": "段階的に広がる、連鎖的に起こることを意味します。一つの事象が次々と他の事象を引き起こす状況を表現します。"}, {"word": "adaptation", "definition": "適応、または対応策を意味します。環境変化や災害に対して地域社会が講じる対策や適応能力を指します。"}, {"word": "magnitude", "definition": "規模、大きさ、または地震の強度を表す単位です。災害や地震の深刻さを数値で表現する際に使用されます。"}]}, {"title_ja": "米国議会、ロシア制裁法案を可決", "title_en": "US Congress Passes Russia Sanctions Bill", "summary_ja": "米下院がウクライナ侵攻に関するロシアへの包括的な制裁法案を262対159で可決しました。先月の上院での承認に続く今回の可決は、トランプ大統領第2期における最も強力な立法措置と見なされています。この法案は大統領の署名を待っており、トランプ大統領は署名することを約束しています。", "summary_en": "The US House of Representatives passed a comprehensive sanctions package against Russia over its invasion of Ukraine with a 262-159 vote, following Senate approval last month. The bill is considered the strongest legislative action against Russia during President Trump's second term and awaits his signature to become law, which Trump has committed to providing.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-congress-passes-russia-sanctions-bill/a-79299088?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "PoliticsUnited States of America\nUS Congress passes Russia sanctions bill\nSeptember 17, 2026\nAdvertisement\nThe US Republican-led House of Representatives passed on Wednesday a package of broad new sanctions against Russia over its war in Ukraine.\nThe bill passed 262-159, after breezing through the Senate in an 86-11 vote last month.\nThe bill, considered the toughest legislative effort against Russia during US President Donald Trump's second term, awaits the president's signature to come into law. Trump has said he will sign it.\nThis is a developing story. Please refresh for updates.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "sanctions", "definition": "国家が他国に対して経済的・政治的圧力を加えるために実施する制限措置。貿易禁止、資産凍結などが含まれます。"}, {"word": "legislative", "definition": "法律の制定や改正に関する、または法律を作る権限を持つことを意味します。立法の、立法上のという形容詞です。"}, {"word": "package", "definition": "複数の関連する政策や提案をまとめたもの。この文脈では制裁措置をセットで提示することを指します。"}, {"word": "breezed through", "definition": "何かを容易に成し遂げる、または簡単に通過させるという意味の慣用表現。困難なく承認されたことを示します。"}, {"word": "awaits", "definition": "何かが起こるのを待つ、または誰かを待つという意味です。ここでは大統領の署名を待っている状態を表します。"}]}, {"title_ja": "スウェーデン中道左派ブロック、選挙でわずかな差で勝利", "title_en": "Sweden's Center-Left Bloc Narrowly Wins Election", "summary_ja": "スウェーデンの中道左派野党ブロックが、99%の票が開票された時点で、わずか26,169票の差で最多得票を獲得した。社会民主党のマグダレーナ・アンデルソン率いるこのブロックの勝利は、クリステルソン首相率いる中道右派政権の交代をもたらす。連立交渉は困難が予想され、新首相の投票は9月29日以前には行われない。", "summary_en": "Sweden's center-left opposition bloc, led by Magdalena Andersson of the Social Democrats, has won the most votes in the parliamentary election with 99% of ballots counted, ahead by just 26,169 votes. The result would end the center-right government of Prime Minister Ulf Kristersson. Coalition negotiations are expected to be challenging, with Parliament unable to vote on a new prime minister before September 29.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/sweden-s-center-left-bloc-set-to-win-election-stv-reports/a-79299076?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Sweden's center-left bloc set to win election, STV reports\nSeptember 17, 2026\nSweden's center-left opposition bloc looks set to win the most votes in the country's parliamentary election, albeit by the slimmest of margins, public broadcaster SVT said on Wednesday with 99% of the votes counted.\nAs of 1647 GMT, with fewer than 1% of votes left to count, the center-left bloc was ahead by just 26,169 votes.\nThe bloc is led by Magdalena Andersson of the Social Democrats, the party that ruled Sweden for most of the 20th century.\nIf the results are confirmed, it would usher in a change in government from the right-wing bloc led by Prime Minister Ulf Kristersson.\nWhat do we know about the Swedish election results so far?\nData from Sweden's election authority shows Kristersson's bloc was on track to win 174 seats, against 175 seats for the center-left. Both Kristersson and Andersson have said they would be open to exploring coalition options.\n\"The likelihood of a turnaround at this stage is so low that we can confidently state that the opposition will secure the most seats in this election,\" SVT said.\nThe election authority was counting late incoming ballots from home and overseas, a process expected to continue until Thursday.\nEven with Andersson's slim lead, her bloc is bracing for tough negotiations before forming any government, especially amid deep divisions between the liberal Center Party and the socialist Left Party.\nAfter the 2022 elections, it took 37 days to form a government, which was considerably shorter than in 2018, when the process took 134 days.\nParliament cannot vote in a new prime minister before September 29.\nEdited by: Sean Sinico\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "bloc", "definition": "政治的または戦略的な目的で結合した複数の国やグループ。選挙や国際関係の文脈で用いられる用語。"}, {"word": "albeit", "definition": "『ただし』『とはいえ』という意味の接続詞。前の文を弱める修飾語として使用され、例外や限定を示す。"}, {"word": "usher in", "definition": "『〜をもたらす』『〜の時代を開く』という意味の句動詞。新しい時期や変化の到来を表現する。"}, {"word": "turnaround", "definition": "『逆転』『回復』という意味の名詞。状況が劇的に改善または悪化することを指す。"}, {"word": "coalition", "definition": "政治目的を達成するために複数の政党や勢力が一時的に結合すること。政府形成で重要な概念。"}, {"word": "bracing for", "definition": "『〜に備える』『〜に心構えする』という意味の句。困難や課題が来ることを予期して準備する。"}]}, {"title_ja": "下院がリンゼイ・グラハム上院議員が主導したロシア・イラン制裁法案を可決", "title_en": "House Passes Russia and Iran Sanctions Bill Championed by Sen. Lindsey Graham", "summary_ja": "米下院は水曜夜、故リンゼイ・グラハム上院議員が主導したロシアとイランを対象とした制裁法案を可決した。この法案は両国に対する経済的圧力を強化する議会の継続的な取り組みを示している。可決は、これらの国がもたらす外交政策上の課題に対する超党派的な懸念を反映している。", "summary_en": "The House of Representatives passed a sanctions bill targeting Russia and Iran on Wednesday night, following the advocacy of late Senator Lindsey Graham. The legislation represents continued congressional efforts to impose economic pressure on both nations. The bill's passage reflects bipartisan concern over foreign policy challenges posed by these countries.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/house-passes-russia-iran-sanctions-bill-championed-sen/story?id=136510615", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースは、世界中で発生する速報ニュースと主要なイベントについて、24時間体制で継続的なライブ報道を提供しています。最新の情報で発展途上のストーリーについて最新情報を得ることができます。", "summary_en": "ABC News provides continuous live coverage of breaking news and major events around the clock. Stay informed with up-to-the-minute reporting on developing stories from around the world.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ダイアナ妃の死後、チャールズ国王に関する主張に対し王宮が応答", "title_en": "Palace Responds to Claims About King Charles Following Princess Diana's Death", "summary_ja": "バッキンガム宮殿は、ダイアナ妃の死後に浮上したチャールズ国王に関する疑惑について、異例の公開声明を発表した。宮殿は声明を通じてこの主張に直接対応している。具体的な疑惑の詳細については広く明かされていない。", "summary_en": "Buckingham Palace has issued a rare public response to allegations involving King Charles that emerged following Princess Diana's death. The palace statement addresses the claim directly in an unusual move. Details of the specific allegation have not been widely disclosed.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Culture/buckingham-palace-rebuts-claim-book-princess-dianas-brother/story?id=136502673", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヨハネスブルク空港近くで8人の女性の遺体が発見、南アフリカの女性殺害危機が深刻化", "title_en": "Discovery of eight women's bodies near Johannesburg airport fuels femicide crisis in South Africa", "summary_ja": "ヨハネスブルク国際空港周辺で過去数週間に8人の女性の遺体が発見され、南アフリカの深刻な女性殺害問題への怒りが再燃している。同国の女性殺害率は人口10万人当たり12.2人で、世界平均の約6倍となっている。女性や活動家らは、個人の安全対策を取るよう指示されるのではなく、政府の具体的な行動を求めている。", "summary_en": "Eight women's bodies have been discovered around Johannesburg's international airport in recent weeks, reigniting outrage over South Africa's severe femicide epidemic. The country has one of the world's highest femicide rates at 12.2 per 100,000 people, nearly six times the global average. Women and activists are demanding concrete government action rather than being told to take personal safety precautions.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/16/discovery-women-bodies-anger-femicide-south-africa", "state_media": false, "category": "政治", "full_text": "The discovery of the bodies of eight women around Johannesburg’s international airport, including five in the past week, has prompted an outpouring of fear, grief and anger over a lack of progress in tackling femicide.\nWhen Elizabeth “Tsontso” Moselakgomo did not return after going for a run on 9 September, her eight-year-old daughter alerted relatives, who contacted police. The 38-year-old’s body was found on Saturday and identified by relatives on Monday. The news of her disappearance had gone viral.\nPolice said in a statement on Saturday that four women’s bodies had been found since 15 July in Kempton Park, across the highway from OR Tambo international airport. All were half-naked and with visible bruising.\nOn Monday and Tuesday, two more bodies were found in the town of Olifantsfontein about 15 miles north of Kempton Park. On Tuesday, police said another woman’s body had been found 25 miles to the south-east, naked and decomposed. The acting police minister, Firoz Cachalia, said on Wednesday that another woman’s body found in Olifantsfontein on 7 September, was being added to the investigation.\n“In this country we are prey,” Sakane Mokoena posted on Instagram after confirmation of the death of her friend and fellow runner Moselakgomo.\nSouth Africa has one of the highest rates of femicide in the world. Women were killed at a rate of 12.2 per 100,000 people in 2022, nearly six times the global rate, according to the UN Office on Drugs and Crime.\nFor years, women have called on the South African government to take gender-based violence seriously. After hundreds of women protested on the eve of the G20 summit in Johannesburg in November 2025, President Cyril Ramaphosa declared it a national crisis.\nHowever, the lack of a concrete plan or action has frustrated campaigners – and women keep being killed.\nThe latest deaths are being investigated by specialist officers, who said on Saturday: “Women in and around Kempton Park are urged not to walk or run alone, particularly in isolated areas. They should avoid secluded spaces, remain vigilant and, where possible, travel or exercise in groups.”\nSouth African women responded with anger at the idea that they had to be responsible for their own safety, with many runners noting they already took precautions, such as sharing routes. “We are tired of being told to be vigilant when women are already doing everything possible to stay alive,” said the advocacy group Women For Change.\n“It should not take a missing woman, a desperate family, runners and communities searching, and a case going viral, before an area is searched with this intensity,” the group said.\nDetectives said on Saturday that they were examining a serial killer angle. However, on Monday, a police spokesperson, Athlenda Mathe, told reporters: “For now, nothing tells us that we’ve got a serial killer.”\nMathe added that a suspect in the killing in July of the first woman, her boyfriend, was in custody.\nRamaphosa said on Tuesday that he had directed police authorities to prioritise the ongoing murder investigations.\nAlthough the gender of the suspect or suspects in the other killings has not been confirmed, campaigners called on men to take responsibility for violence against women and children.\n“When some of these things happen in our presence, most of us men tend to look the other way,” said Bafana Khumalo, a co-executive director of Sonke Gender Justice.\n“You have excuses like ‘No, it’s not my business’. We feel strongly that violence against women is our business. We need, as men, to begin to face each other squarely and hold each other accountable.”\nThe identification of Moselakgomo’s body has triggered an outpouring of grief.\nMokoena met her about two years ago, when Moselakgomo joined a running club so she did not have to train alone on Saturdays.\n“She’s an amazing woman,” said Mokoena. “She always spoke about her daughter. Tsontso always said ‘Bye guys, I have to go, I have to go to my child’.\n“That’s just an example of how close she was with her baby girl. And she was a really light-spirited, funny and joyful woman, who was kind – very, very kind.”\nRunning clubs around South Africa organised events to remember Moselakgomo and Mokoena said she hoped this would help push the government and police to do more to protect women.\nShe added: “I’m just happy that the world, or at least our country, was standing still for a moment to acknowledge what is happening. Let’s get this out there and figure out exactly what is happening to women.”", "translation_ja": "", "vocab": [{"word": "femicide", "definition": "女性であることを理由に女性を殺害する行為。ジェンダーに基づく暴力の極端な形態を指す用語。"}, {"word": "outpouring", "definition": "感情や反応が大量に急速に表現されることを意味する。この場合、悲しみや怒りが広範囲に広がった状況を指す。"}, {"word": "vigilant", "definition": "危険や問題に対して常に注意深く警戒している状態を表す。セキュリティ意識の高さを示す形容詞。"}, {"word": "campaigners", "definition": "特定の社会的・政治的問題について積極的に活動する人々。この文脈では女性の権利や安全のために活動する人達を指す。"}, {"word": "accountability", "definition": "自分の行動や決定に対して責任を持つこと。この場合、男性が暴力に対して責任を取ることを求めている。"}, {"word": "triggered", "definition": "何かのきっかけによって感情や反応が引き起こされること。この記事では悲しみや怒りが引き起こされた状況を表す。"}]}, {"title_ja": "米国、反白人差別疑惑を理由に南アフリカ人のビザ制限を実施", "title_en": "US Imposes Visa Restrictions on South Africans Over Alleged Racial Discrimination Claims", "summary_ja": "トランプ政権は、南アフリカ政府がアファーマティブ・アクションと土地没収政策を通じて白人アフリカーナーを差別していると主張して、一部の南アフリカ人のビザ制限を発表した。南アフリカの外務省は、アパルトヘイト時代の人種不平等に対処する取り組みとしてこれらの非難を否定した。米国はまた援助を削減し、アフリカーナーのための難民プログラムを創設し、戦争難民のための庇護プログラムを廃止した。", "summary_en": "The Trump administration has announced visa restrictions targeting some South Africans, claiming the government discriminates against white Afrikaners through affirmative action and land expropriation policies. South Africa's foreign ministry rejected these accusations as misrepresentation of its efforts to address centuries of racial inequality from apartheid. The US has also cut aid and created a refugee program for Afrikaners while dismantling asylum programs for war refugees.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/16/us-visa-restrictions-south-africans-trump-claims-anti-white-discrimination", "state_media": false, "category": "政治", "full_text": "The US has announced visa restrictions on some South Africans as Donald Trump’s administration continues to claim that South Africa’s government racially discriminates against white minority Afrikaners.\nThe announcement did not specify individuals who were barred from the US. Trump has spent his second term falsely claiming there is a “white genocide” in South Africa and railing against its affirmative action policies.\nSince the start of last year, the US has cut aid to South Africa, barred it from this year’s G20 summit in Miami and set up a refugee programme for Afrikaners and other South African racial minorities. Meanwhile, the Trump administration has been dismantling refugee and asylum programmes for people fleeing war and persecution.\n“The South African people are being failed by a government that is destroying its economy through an obsessive pursuit of racial grievance against the Afrikaner minority,” the US secretary of state, Marco Rubio, said in a post on X.\n“The South African government has consistently failed to adequately address rural crime, violent and dehumanising rhetoric, and race-based discriminatory policies against Afrikaners and other minority populations.”\nThe US visa restrictions would target “foreign nationals who enact or enable policies that promote race-based discrimination, incite violence, or enable land confiscation without compensation in South Africa”, Rubio added.\nThe US ambassador to South Africa, the conservative media activist Leo Brent Bozell III, said on X: “As has been made absolutely clear, the time for endless ‘dialogue’ has run its course … This visa restriction policy is only the first step in a series of escalatory measures that will show America’s firm resolve in this matter.”\nSouth Africa’s foreign ministry said in response that its policies were being misrepresented. “The announcement, once again, aligns with the mischaracterisation of South Africa’s domestic policies by fringe groups who wrongly portray themselves as representatives of “minorities” and Afrikaners in general,” the ministry spokesperson Chrispin Phiri said in a statement that was first published in Afrikaans.\nPhiri added: “It is our sovereign right to put in place laws that address the nation’s concern over centuries of racial injustice … South Africa respects that the United States may hold different views regarding particular measures and their implementation.”\nAfrikaners, who are descended from Dutch and French settlers, ruled South Africa during apartheid. The regime discriminated against and repressed the country’s black majority, while keeping white people safe and wealthy.\nSince Nelson Mandela took office as South Africa’s first black president in 1994, South African governments have tried to redress the country’s racial inequality, including through Black economic empowerment policies and buying land to redistribute.\nThese efforts have had limited impact. White South Africans typically have 20 times the wealth of Black people, according to a 2023 article in the Review of Political Economy, an economic journal.\nNonetheless, some white South Africans claim they are now the victims of racial discrimination, allegations that US conservatives have long promoted.\nRubio’s visa restrictions announcement criticised land expropriation without compensation. South Africa introduced a law last year that allows the government to seize land without paying for it in specific circumstances, including if it is abandoned or only held for speculation. There is no large-scale expropriation of land.\nAmong white South Africans who think they are discriminated against, many cite the far-left opposition leader Julius Malema’s repeated use of apartheid-era chant “Kill the Boer”, Boer being another word for Afrikaner. A video featuring the chant was played by Trump when he met South Africa’s president, Cyril Ramaphosa, in the Oval Office last year.\nThe ruling African National Congress party has disavowed the chant, which South African courts have ruled is not meant literally and is therefore not hate speech.", "translation_ja": "", "vocab": [{"word": "affirmative action", "definition": "社会的少数派に対する優遇措置で、採用や入学など機会均等を目的とした政策。米国では特に教育機関で論争の対象となっている。"}, {"word": "expropriation", "definition": "政府が公共の利益のため個人の財産を強制的に買収または没収する行為。補償の有無によって合法性が争われることがある。"}, {"word": "apartheid", "definition": "1948年から1994年まで南アフリカで実施された人種隔離政策。白人支配下で黒人など有色人種を抑圧した体制。"}, {"word": "redress", "definition": "過去の不公正や害に対する補償や改善。動詞として「～に対処する」や「～を正す」という意味で使われる。"}, {"word": "disavow", "definition": "公式に否定する、認めない、関係を断つという意味。組織や個人が自らの立場や行為と距離を置く際に使用される。"}]}, {"title_ja": "アフリカ・サヘル地域でアルカイダとIS関連の暴力が過去最高水準に到達", "title_en": "Al-Qaida and IS-linked violence in Africa's Sahel region reaches record levels", "summary_ja": "アフリカのサヘル地域におけるイスラム過激派暴力は2025年に過去最高を記録する見通しで、2016年の63件から3,000件以上の事件に急増している。アルカイダおよびイスラム国関連の勢力がマリ、ブルキナファソ、ニジェール全域で勢力を拡大し、これら3か国で9,000人以上が殺害されている。しかし専門家は、これらのグループはアフリカに地理的に限定されており、米国とヨーロッパへの直接的な脅威ではないと指摘している。", "summary_en": "Islamist extremist violence in Africa's Sahel region is set to reach historic highs in 2025, with incidents soaring from 63 in 2016 to over 3,000 events. Groups linked to al-Qaida and Islamic State have expanded control across Mali, Burkina Faso, and Niger, with over 9,000 deaths recorded in these countries. However, experts note these groups remain geographically concentrated in Africa with no direct threat to the US or Europe.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/16/al-qaida-and-is-linked-violence-in-africas-sahel-belt-set-to-hit-record-levels-this-year", "state_media": false, "category": "社会", "full_text": "Islamist extremist violence in Africa’s Sahel region is set to reach historic highs after a series of sweeping offensives by groups linked to al-Qaida and Islamic State, according to new figures compiled by the conflict monitor Acled.\nAs the US marks the 25th anniversary of the 9/11 attacks launched by al-Qaida against targets in Washington and New York, the statistics underline the continued expansion of the veteran organisation in parts of Africa – in stark contrast with its relative weakness elsewhere.\nCompiled by Acled, which stands for Armed Conflict Location and Event Data, the statistics focus on the centre of Islamic militancy in three countries – Mali, Burkina Faso and Niger – which together comprise a huge and hotly contested zone at the heart of the strategic Sahel region.\nAccording to the respected non-profit organisation, incidents of violence with jihadist groups present in the three countries have soared from 63 in 2016 to 2,845 in 2025. So far this year, 2,145 events have already been logged. If current trends continue in coming months, an annual total of well over 3,000 events appears likely.\nThough total deaths from terrorism globally have fallen to their lowest level since 2008, those in the Sahel have risen sharply.\n“Terrorism has become more geographically concentrated: the Sahel continued to record some of the world’s highest terrorism death tolls, with the UN recording more than 9,000 deaths from security incidents across Burkina Faso, Mali and Niger in 2025,” the 2026 report of the Global Peace Index noted earlier this year.\nIn April, a joint offensive in Mali launched by the al-Qaida-linked group Jama’at Nusrat ul-Islam wa al-Muslimin (JNIM) and the Tuareg-dominated rebel group Azawad Liberation Front (FLA) targeted strategic towns, government forces and their Russian auxiliaries with ambushes, car bombs, drones and raids, inflicting significant casualties.\nMali’s defence minister died in a suicide attack on his residence in the garrison town of Kati, 9 miles north-west of the capital, Bamako, and the head of military intelligence was killed.\nOther attacks hit Mali’s international airport, while rebels seized control of the strategic city of Kidal, a former stronghold of the FLA, after soldiers fled and a force of Russian mercenaries surrendered. The defeat reversed a key symbolic victory won by the junta in Mali three years ago.\nSince then, JNIM has continued to expand areas under its control in Mali, killing more soldiers and Russian mercenaries in recent weeks, and broadening its operations in some neighbouring countries.\nMuch of the violence involves fighting with rival groups. The conflict has also included multiple killings by government armed forces and Russian mercenaries.\nIn Burkina Faso, JNIM has claimed more than 130 attacks in 2026, striking closer to Ouagadougou, the capital. In Niger, the group claimed at least 17 attacks but remained significantly less active than its rival Islamic State in the Greater Sahara, according to a recent United Nations report based on intelligence supplied by member states.\nExperts said JNIM had distanced itself from al-Qaida’s historic objectives of striking the US and its allies.\n“In the Sahel, Islamic State and al-Qaida now command big areas but these are very localised groups. Not a single attack in Europe or the US has been planned in the Sahel,” said Ulf Laessing, a senior analyst at the Konrad Adenauer foundation in Berlin.\nThe other main group in sub-Saharan Africa with links to al-Qaida is al-Shabaab, which has dominated much of Somalia’s rural areas for many years.\n“In east Africa, al-Shabaab remains one of the continent’s deadliest groups, with Acled recording more than 10,000 reported deaths in al-Shabaab-related violence over the past 18 months,” said Peter Bofin, Acled’s senior analyst for south-east Africa. “Despite some degradation of its extortion in Mogadishu, its revenue streams stretch across the country, and the region.”\nMilitant groups linked loosely to IS are active in the Democratic Republic of Congo, Mozambique, Chad and Nigeria, where they were targeted by US airstrikes last year.\nThe continuing expansion in sub-Saharan Africa has been welcomed in al-Qaida’s propaganda, but experts point out the continent barely featured in the group’s strategic planning until recent years. “Twenty-five years ago it was all about Afghanistan and then Iraq … Africa wasn’t really of interest then. Now its the main area of operations,” said Laessing.\nThough sectarian and ethnic conflict, bitter competition over resources, poor governance, endemic instability and other factors make Africa a fertile ground for Islamic militant recruiters, territory in places like Mali and Somalia has major limitations as a base for campaigns elsewhere in the world or for long-range terrorist attacks.\nAt its peak in the years after the 9/11 attacks, al-Qaida affiliates posed a significant threat to authorities across much of the Middle East, with thousan", "translation_ja": "", "vocab": [{"word": "militant", "definition": "武装した過激派や反政府勢力を指す。テロ活動や暴力的な活動に従事する戦闘員を意味する。"}, {"word": "offensive", "definition": "攻撃的な軍事作戦または戦略を指す。敵に対して主導的に仕かける攻撃の局面を表す。"}, {"word": "degradation", "definition": "低下、劣化、または衰退を意味する。組織や勢力の力や影響力が減少すること。"}, {"word": "endemic", "definition": "特定の地域や集団に固有の、または常に存在する状態を表す。風土的な問題や慢性的な状況を指す。"}, {"word": "affiliates", "definition": "親組織と関連する下位組織や提携組織を意味する。メイングループと共通の目標を持つ関連集団。"}, {"word": "extortion", "definition": "恐喝や強要で金銭や財産を無理やり奪い取る犯罪行為。テロ組織の資金源となることが多い。"}]}, {"title_ja": "パレスチナ人がイスラエルの検問所と入植者による攻撃に対応するためにラジオ局を利用", "title_en": "Palestinians Use Radio Station to Navigate Israeli Checkpoints and Settler Attacks", "summary_ja": "ヨルダン川西岸のパレスチナ人は、イスラエル軍の検問所、道路閉鎖、入植者による攻撃についてのリアルタイム情報を得るためにバスマFMラジオ局に頼っている。2023年10月以降、同局はエンターテインメント番組から1時間に3回の交通情報提供へとシフトし、7人の職員が急速に変化する道路状況について情報を検証している。強化された制限によりヨルダン川西岸全域のバリアが43パーセント増加し、パレスチナンコミュニティが分断され、識別しやすい白いナンバープレートの車両で移動するため危険な経路の使用を余儀なくされている。", "summary_en": "Palestinians in the West Bank rely on Basma FM radio station for real-time updates on Israeli military checkpoints, road closures, and settler attacks that make daily travel unpredictable and dangerous. Since October 2023, the station has shifted from entertainment programming to providing three traffic updates per hour, with seven employees verifying information about rapidly changing road conditions. The intensified restrictions have increased barriers across the occupied West Bank by 43 percent, fragmenting Palestinian communities and forcing residents to use dangerous routes while traveling in easily identifiable white-plated vehicles.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/16/for-checkpoint-and-settler-attack-news-palestinians-tune-into-the-radio?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "For checkpoint and settler attack news, Palestinians tune into the radio\nPalestinians in the West Bank navigate Israeli road closures and attacks with help from a local radio station.\nPalestinians in the occupied West Bank know they shouldn’t ask what time their loved ones are going to make it home.\nThere’s simply no way to give an accurate answer. What used to be a short ride from one place to another could now take hours, or it might not happen at all.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Israeli checkpoints in the West Bank are choking the Palestinian economy\n- list 2 of 3Israel working to eliminate Palestinian presence from West Bank, NGO warns\n- list 3 of 3Israel must protect West Bank’s Palestinians amid settler pogroms: US envoy\nBefore driving, Palestinians check dedicated WhatsApp and Telegram groups and channels where people share updates on road conditions. But this isn’t typical traffic news: Instead, chats focus on which Israeli military checkpoints are open, which roads are off limits to Palestinians and whether Israeli settlers are attacking Palestinians as they drive their vehicles.\nSometimes pins are sent to warn people driving near towns where Israeli forces are conducting raids.\nAnd if there’s no time to check the groups, then there’s always Basma FM. The Palestinian radio station, based in Rawabi near Ramallah, carries three traffic updates per hour.\nThe channel started broadcasting on October 2, 2023 – just days before the Hamas-led attack on Israel on October 7 and the start of Israel’s genocidal war on Gaza, and what has become a pogrom against Palestinians in the West Bank.\n“Our idea was to target young people. We wanted to offer entertainment and culture news. But five days later, we realised we couldn’t,” said Fatima Barqawi, Basma FM’s news and traffic director.\nThe team had originally planned traffic updates as part of their programming. “We thought we could tell parents picking up their children from school to know where there was traffic, but after the war on Gaza started, we had to shift focus,” Barqawi said.\nHer department has seven employees who verify information with their sources and provide updates on roadblocks.\n“Things change each second. We could say there’s a closed checkpoint and Israeli soldiers decide to reopen it. Or vice versa,” Barqawi explained.\nDangers on the roads\nThe issue for Palestinians driving through the West Bank isn’t simply being late for appointments or held up for hours – it’s that there is an inherent danger to travelling in the occupied territory.\nPalestinians in the West Bank drive white-plated vehicles, making them easily identifiable compared to the yellow-plated cars driven by Israeli settlers.\nIsraeli soldiers have killed Palestinians near checkpoints after claiming they were conducting ramming attacks, and Israeli settlers often attack Palestinian cars or block them from using certain highways.\nThese attacks are increasing as illegal Israeli settlements grow at a record pace.\nIt is hard to miss the large infrastructure projects Israel is implementing, expanding highways to connect Israeli settlements to one another and to Israel. This ends up isolating Palestinian communities, often forcing Palestinians to use poorly paved roads or dangerous mountainous routes to avoid Israeli settlers and roadblocks.\nIt’s a journey of fear and anxiety, a young Palestinian woman who did not wish to be named told Al Jazeera. “I used to blast my music and drive, now I’m on high alert. Always on edge.”\nThe woman recounted how Israeli soldiers assaulted her fiancé near a checkpoint in Hebron, in the southern occupied West Bank, because they mistakenly thought he had passed without stopping. A year later, she said, a soldier pointed his rifle at her.\n“He was shouting at me. The sun was blocking my view, and I was careful crossing the checkpoint but that wasn’t enough. I saw the green beam [from the gun] and thought that was the end,” she said.\nAttacks at checkpoints\nMany Palestinians report being assaulted, humiliated and sometimes arrested at these checkpoints and roadblocks.\nIsrael has long imposed movement restrictions on Palestinians, controlling the road system and Palestinians’ access to the wider world. But since the war on Gaza began, these restrictions have intensified.\nAs of December 2025, the United Nations documented 925 barriers across the occupied West Bank including East Jerusalem, a 43 percent increase over the 20-year annual average of 647, the UN’s humanitarian affairs agency, OCHA, reported.\nAlmost all of of the villages and cities in the West Bank have iron gates at their entrances, and Israeli forces close them arbitrarily. Some of the gates are only open during certain hours.\nA new report by the Israeli human rights group B’Tselem said the restrictions are used to deliberately fragment Palestinian life, with roadblocks and military checkpoints cutting off people from their work, schools, hospitals and one another.\nThe report, ti", "translation_ja": "", "vocab": [{"word": "checkpoints", "definition": "検査地点、特に軍隊や警察が人員や物資を検査するために設置された関所のこと。この記事では、イスラエル軍がパレスチナ人の移動を制限するために設置した検問所を指している。"}, {"word": "fragmenting", "definition": "細切れにする、分断する、という意味の動詞。ここでは、検問所や道路制限によってパレスチナンコミュニティが分裂させられていることを表現している。"}, {"word": "pogrom", "definition": "特定の民族やグループに対する計画的で暴力的な迫害や虐殺。この記事ではイスラエルによるパレスチナ人への暴力的行為を指す。"}, {"word": "ramming attacks", "definition": "突進攻撃、衝突攻撃のこと。車両を使って人や施設に衝突させる暴力行為を意味する用語。"}, {"word": "intensified", "definition": "強化された、激化した、という意味の過去分詞。ここでは、パレスチナ人に対する移動制限がより厳しくなったことを表している。"}, {"word": "arbitrarily", "definition": "恣意的に、気まぐれに、という意味の副詞。ここでは、イスラエル軍が理由なく一方的に道路を遮断することを指している。"}]}, {"title_ja": "マックルモア、パレスチナ支援団体に100万ドルのツアー収益を寄付すると表明", "title_en": "Macklemore Pledges $1M in Tour Earnings to Palestinian Support Groups", "summary_ja": "ラッパーのマックルモアは、パレスチナ支持の立場からツアーから外されてから数日後に、エド・シーランのループツアーで得た100万ドルをパレスチナを支援する団体に寄付すると発表した。彼は億万長者のロバート・クラフトに寄付金と同額の寄付を呼びかけ、クラフトは地域への200万ドルの人道支援を約束して応じた。シーランの米国ツアーの全サポートアーティストがその後、マックルモアとの連帯を示して撤退している。", "summary_en": "Rapper Macklemore announced he will donate $1 million earned from Ed Sheeran's Loop Tour to organizations supporting Palestinians, days after being removed from the tour due to his pro-Palestine advocacy. He challenged billionaire Robert Kraft to match the donation, while Kraft responded by pledging $2 million in humanitarian aid to the region. All supporting acts for Sheeran's US tour have since withdrawn in solidarity with Macklemore.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/16/macklemore-pledges-1m-in-tour-earnings-to-palestinian-groups?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Macklemore pledges $1m in tour earnings to Palestinian groups\nThe rapper also challenged Robert Kraft to match the donation as fallout from his removal from Ed Sheeran’s tour grows.\nRapper Macklemore says he will donate the entire $1m he earned from singer Ed Sheeran’s Loop Tour to organisations supporting Palestinians, days after he was dropped from the tour over his support for Palestine.\nMacklemore, whose real name is Ben Haggerty, announced the donation on Instagram on Wednesday, saying the money would go to six groups working directly to support Palestinians. He also called on pro-Israel billionaire Robert Kraft, owner of the New England Patriots, to match it after Kraft confirmed on Tuesday that he had barred Macklemore from performing at Gillette Stadium in the US state of Massachusetts.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Macklemore cut from Ed Sheeran tour for pro-Palestine stance\n- list 2 of 4Who is Robert Kraft, pro-Israel billionaire who cancelled Macklemore?\n- list 3 of 4Ed Sheeran blames US tour promoter for dropping Macklemore\n- list 4 of 4Which artists have pulled out of Ed Sheeran’s tour over Palestine?\n“Whatever we disagree about, perhaps we can agree on this: Palestinian lives are worth protecting,” Macklemore wrote. “A Palestinian life is no less valuable than any other life on this earth.”\nIn a statement on Wednesday evening, Kraft said that before Macklemore issued the challenge, Sheeran had called and asked him to commit $2m in humanitarian aid to the region. Kraft said Sheeran now planned to approach other venue owners in an effort to raise more money.\n“I believe deeply that all lives are worth protecting,” Kraft said.\nMacklemore’s announcement comes as the fallout over his removal from Sheeran’s tour continues to grow. Macklemore said on Monday that he was dropped from the remaining United States dates after using his performances at MetLife Stadium in New Jersey to speak in support of Palestinians.\nAll of the supporting acts for Sheeran’s upcoming US Loop Tour have now pulled out in solidarity with the rapper. Some of the artists are Irish and pointed to their own country’s history of occupation in explaining their decision to withdraw.\nSheeran has said the decision to remove Macklemore was ultimately made not by him but by the tour promoter.\nKraft later said he had opposed allowing the rapper to perform, citing what he described as Macklemore’s history of “antisemitic rhetoric and imagery”.\nKraft, in a statement to Al Jazeera, said the decision to ban Macklemore from his venue wasn’t about “diminishing the suffering of innocent Palestinians” but argued that “advocacy should not come at the expense of the Jewish community or obscure the responsibility of Hamas”.\nIn his latest statement on Wednesday, Macklemore said he wanted to pull the conversation away from himself and the controversy surrounding the tour.\n“That is what this has always been about. Not me. Not a tour. Not the headlines or the controversy,” he wrote. “It is about Palestinians’ right to freedom, dignity and safety in their own homeland.”\nHe also acknowledged that donating money carried far less risk than the work being done by people in Gaza and those organising in support of Palestinians.\n“Writing a check is one of the least costly forms of solidarity available to me,” he wrote. “I am doing it because I can, and because these organizations are doing the work while much of the world debates it.”\nHe ended with a call for people to keep paying attention.\n“When the news cycle moves on, which it will, don’t move with it. Free Palestine.”", "translation_ja": "", "vocab": [{"word": "solidarity", "definition": "共通の目的や価値観に基づいて他者を支持すること。政治的または社会的な運動において、仲間意識を持って行動することを意味します。"}, {"word": "advocacy", "definition": "特定の立場や主張を積極的に支持・推進すること。社会変化や権利のために公的に主張することを指します。"}, {"word": "rhetoric", "definition": "説得力を持たせるための言葉遣いや論法。特に政治的な文脈で、効果的だが必ずしも誠実でない表現方法を指すことがあります。"}, {"word": "fallout", "definition": "事件や行動の悪い結果や影響。特に否定的な結果として生じる争いや問題を意味します。"}, {"word": "diminish", "definition": "何かの重要性や価値を減らす、または低く見なすこと。ある事象の深刻さを軽視することを指します。"}, {"word": "humanitarian", "definition": "人間の苦痛を軽減し、人道的価値に基づいて人々を支援すること。災害や紛争地域での援助活動を指すことが多いです。"}]}, {"title_ja": "マンチェスター・ユナイテッドがブライトンに2点リードから逆転され、リーグカップから敗退", "title_en": "Manchester United Crash Out of League Cup After Blowing 2-0 Lead to Brighton", "summary_ja": "マンチェスター・ユナイテッドはオールド・トラッフォードでのリーグカップ3回戦でブライトンに3-2で敗北し、2点のリードを失った。ユナイテッドが2-0でリードした状態でホームで敗れるのは50年ぶりのことであり、マイケル・カーリック監督へのプレッシャーがさらに高まった。ユナイテッドはプレミアリーグ最初の4試合で1勝しか挙げられていない中、今週末のフラムとの重要な試合を控えている。", "summary_en": "Manchester United suffered a stunning 3-2 defeat to Brighton in the League Cup third round at Old Trafford, squandering a two-goal advantage. The loss marked the first time in 50 years that United had lost after leading 2-0 at home and piled more pressure on manager Michael Carrick. United face a crucial match against Fulham this weekend with only one win from their first four Premier League games.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/16/manchester-united-lose-3-2-to-brighton-crash-out-of-league-cup?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Manchester United lose 3-2 to Brighton, crash out of League Cup\nBrighton come from two goals down to win 3-2 at Old Trafford, to shock Manchester United as slow start continues.\nManchester United’s problems mounted as they crashed out of the League Cup after blowing a two-goal lead in a stunning 3-2 defeat against Brighton.\nMichael Carrick’s side slumped to their second successive home defeat following a wretched collapse in the third round at Old Trafford.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Manchester derby VAR error caused by ‘tunnel vision’: Pro Ref chief Webb\n- list 2 of 4Eto’o could face Cameroon probe over alleged Russia payment\n- list 3 of 4Champions League final venues revealed: Munich 2028, Barcelona 2029\n- list 4 of 4VAR error admitted in Haaland goal, but will referees be held accountable?\nUnited led through goals from Shea Lacey and Mason Mount inside just 10 minutes on Wednesday.\nBut Charalampos Kostoulas sparked Brighton’s revival and Pascal Gross equalised before Maxim De Cuyper grabbed the winner to leave Carrick shell-shocked as his team were booed off.\nIt was another brutal blow for United after their controversial 1-0 home defeat against Manchester City on Sunday.\nThe referees’ governing body admitted that VAR officials were wrong to allow City striker Erling Haaland’s winner, which left United with only one win from their first four Premier League matches.\nHaving led United to third place last season in his spell as interim boss, Carrick was expected to oversee a title challenge this term after being appointed on a permanent basis.\nBut United have already lost three of the six games in all competitions, putting Carrick under pressure to turn the tide at Fulham in the top-flight on Sunday.\nA defeat in west London at the weekend would leave United in a full blown crisis barely a month into the new campaign.\nAmid criticism of United’s close-season transfer recruitment, Carrick’s decision to make eight changes exposed the lack of depth in his squad.\nAt least Lacey offers hope for the future at United, unlike fellow highly-rated teenager JJ Gabriel, who has reportedly expressed his wish to leave Old Trafford.\nThe 19-year-old midfielder showed why Carrick has put his faith in him after eight minutes.\nTaking possession just inside the Brighton penalty area, Lacey bagged his first ever goal for United as he lashed a clinical finish into the bottom corner.\nMount doubled United’s lead two minutes later, pouncing to fire into the roof of the net after Marcus Rashford’s shot was saved by Jason Steele.\nBut United’s defensive issues resurfaced in first half stoppage-time when Kostoulas punished poor marking from Ayden Heaven to drill past Karl Darlow.\nThat setback unnerved United and they conceded a 65th minute equaliser as Gross controlled Luka Vuskovic’s header and fired home from close-range.\nCarrick’s men were in disarray and Brighton struck again in the 70th minute when De Cuyper swept Kostoulas’s pass into the net from six yards after sloppy United defending.\nCarrick sent on Bruno Fernandes and Matheus Cunha in the closing stages but United were unable to find an equaliser.\nBrighton have now knocked United out of two cups in the space of nine months after winning in the FA Cup at Old Trafford in January.\nIt was the first time in 50 years that United had lost after being 2-0 up at home.\nTammy Abraham starred as Aston Villa won for just the second time this season, beating Coventry 3-1 at the CBS Arena.\nVilla and Coventry are both in the Premier League relegation zone after dismal starts to the season.\nUnai Emery’s men, beaten three times in four league games, showed signs of stopping th
