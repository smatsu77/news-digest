eportedly covered up several incidents of its models breaking out, disclosing them only after independent investigators discovered them. It freely admits that its latest model, GPT-6 Astra, is hard to monitor and control, warning users that the model might “[act] outside the user’s intended instructions” and take “harmful actions”. Anthropic, meanwhile, downplayed reports of its own AI’s problems when asked about it by a congressmember.\nSituations like this are exactly why government exists: to set a floor on acceptable corporate behavior. And that is why Trump and Johnson ought to use this sudden interest in AI safety to pass concrete laws. The US government should require independent audits of the largest AI companies’ practices. It should force companies to disclose safety incidents to prevent cover ups. It should set minimum safety standards for new AI models. And the government should have the power to block the deployment of a model that does not meet those standards.\nPutting all this into legislation is much easier said than done, but we need not start from scratch. Good bills already exist, most notably representatives Jay Obernolte and Lori Trahan’s Frontier act. If the government was serious in its duties to protect Americans, it would make passing that bill – or a version of it – a priority in the coming weeks.\nTrump’s argument against doing any of this is that the US is in a race with China on AI, and it must not lose. But China does not want its citizens to have their bank accounts hacked by rogue AIs, either. Rather than throw his hands up, the feted dealmaker should do what he does best: make a deal. An international treaty on minimum safety standards will not be easy – but it is still worth trying, and doing so should be the president’s highest priority at his talks with Xi Jinping this month.\nNo company – or country – wants to cause an AI-driven catastrophe. Despite what Trump may think, it’s the government’s job to make sure they can’t.", "translation_ja": "", "vocab": [{"word": "prisoner's dilemma", "definition": "複数の当事者が個別の利益を優先すると集団全体が損失を被る状況。各参加者が独立して最適な判断をしても、協力した場合より悪い結果になるゲーム理論の概念です。"}, {"word": "defect", "definition": "約束や合意から逃れる、または他者の期待に反して自己利益を優先する行動。ここではAI企業が安全基準への合意から離脱して開発を進めることを指します。"}, {"word": "collective action problem", "definition": "個々の行為が理性的でも、集団全体の利益に反する状況。全体的な協力が必要だが、個別の利益が協力を阻害する社会的ジレンマです。"}, {"word": "rogue AI", "definition": "制御不能になった、またはテスト環境から逃脱したAIシステム。本来の目的に反して独立して行動するAIを指します。"}, {"word": "set a floor", "definition": "最低基準や最小限の基準を設定すること。ここでは政府が企業行動の最低限の許容レベルを法律で定めることを意味します。"}, {"word": "throw his hands up", "definition": "努力を放棄する、または対応をやめる。困難な問題に直面して解決しようとしない姿勢を表すイディオムです。"}]}, {"title_ja": "トランプと習近平は米中の悪循環を止められない", "title_en": "Trump and Xi Can't Stop the U.S.-China Spiral", "summary_ja": "著者は、米中間の過去の外交的ブレークスルーの先例にもかかわらず、現在のトランプ大統領と習近平主席には根本的な戦略的対立を解決するために必要な外交手腕と相互信頼が欠けていると主張している。両指導者は交渉能力に自信を示しているが、習近平の妥協を弱さと見なす姿勢とトランプの矛盾した衝動性により、真の突破口は難しく、首脳会談は緊張を管理するだけで解決することはできない可能性が高い。", "summary_en": "The author argues that despite historical precedents of successful U.S.-China diplomatic breakthroughs, current leaders Trump and Xi lack the necessary diplomatic acuity and mutual trust to resolve fundamental strategic rivalries. While both leaders project confidence in their ability to negotiate transformative deals, their personal characteristics—Xi's equation of compromise with weakness and Trump's contradictory impulsiveness—make genuine breakthroughs unlikely, leaving summits to merely manage rather than resolve tensions.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/trump-and-xi-cant-stop-us-china-spiral-orville-schell", "state_media": false, "category": "オピニオン", "full_text": "The United States’ epic twentieth-century successes in diplomacy set dangerously high expectations. Germany and Japan surrendered unconditionally in 1945; U.S. President Harry Truman created NATO in 1949; President John F. Kennedy resolved the Cuban missile crisis in 1962 through secret diplomatic exchanges with the Soviet premier; and in the 1980s, President Ronald Reagan, with Soviet leader Mikhail Gorbachev, negotiated landmark arms-control agreements to wind down the Cold War. Such victories accustomed many Americans to imagining that their skilled leaders could break seemingly intractable political deadlocks in decisive ways.\nThis hope runs especially deep in China watchers. Their sense of how diplomacy between the United States and China can unfold at its best was shaped by that game-changing moment in 1972 when U.S. President Richard Nixon and his national security adviser, Henry Kissinger, redrew the world’s geopolitical map in the course of a weeklong visit with Chinese Chairman Mao Zedong and Premier Zhou Enlai, transforming the Cold War from a largely bipolar contest into a triangular one. Then, in 1979, U.S. President Jimmy Carter threw the door open to China in a theatrical way by welcoming the country’s paramount leader, Deng Xiaoping, to the White House and restoring formal diplomatic relations with Beijing.\nToday, as U.S.-Chinese relations spiral into an ever more adversarial state, the longing for another breakthrough delivered by “great men” is especially acute. U.S. President Donald Trump has egged on that desire by boastfully insisting that he alone can cut the kinds of deals the United States needs through force of personality. Even seasoned foreign policy hands who consider themselves realistic have been prone to entertaining unrealistic visions of success. When a Beijing summit between Trump and Xi was announced for the spring of 2026, the meeting was sanguinely billed in Foreign Affairs as “a geopolitical heavyweight matchup” that could “change the course of U.S.-China competition.”\nSadly, no such breakthrough came to pass. The May summit in Beijing, which I attended as a member of the press corps for this magazine, may have helped sustain a cryptic peace—a “constructive strategic stability,” as Xi euphemistically termed it. But it did not change the fundamentally adversarial nature of the relationship between the two countries. They remain locked in a dynamic of strategic ambiguity marked by endless bouts of punitive “chokehold” diplomacy, with each exploiting its control over critical supply chains to pressure the other.\nNow, another Trump-Xi summit is scheduled to begin in Washington on September 23, and yearnings for a conclusive breakthrough are resurfacing. They should be tempered. The same limitations that crimped the May summit will constrain the upcoming one. The problem is not simply that the United States and China have different ideologies and political systems. It is also that neither of their leaders is suited to the kind of bargaining their current rivalry demands. Xi equates compromise with weakness and has a hard time understanding the give-a-little-to-get-a-little logic that is the heart and soul of diplomacy. And Trump is so contradictory and impetuous that his pandering, “tech bro” side is in such an uncomfortable state of tension with his belligerent side that effective diplomacy becomes almost impossible.\nIn the past, the United States and China achieved breakthroughs when conditions were just right and leaders with great diplomatic acuity were in charge. The circumstances today are less favorable. Despite Trump’s simulacrum of camaraderie, he and Xi simply do not have the symmetries to build the kind of genuine fraternity and trust needed to resolve deep structural problems. As long as these two men lead their respective countries, the likelihood is that their summits will barely be able to manage the rivalry at best. At worst, they may exacerbate it by letting push come to shove.\nTHE TRUST FACTOR\nHistorically, successful U.S.-Chinese summits have relied heavily on leaders’ ability to break through the barriers of distrust. But the kind of superficial flattery and bonhomie in which Trump can excel when he is trying to make nice does not generate the deeper confidence that has assured Chinese leaders in the past. And for Beijing and Washington it has never been easy to establish that kind of trust: Chinese leaders are steeped in paranoid fears about foreigners’ ambitions to bring regime change to communist systems. Nixon understood this; before he went to China, he laid the groundwork in Foreign Affairs, saying it was time to welcome China into “the family of nations.” Such a framing suggested that at least for the moment, he was willing to accept China’s system for the sake of uniting behind the common interest of opposing Soviet expansionism.\nTo increase transparency and trust ahead of their meeting, Nixon sent Kissinger and Kissinger’s deputy, Winston Lord, t", "translation_ja": "", "vocab": [{"word": "intractable", "definition": "解決が困難な、対処しがたい。政治的な問題や対立などが簡単には解決できない状態を指す。"}, {"word": "acuity", "definition": "鋭敏さ、洞察力。特に知的能力や判断力の優れた状態を表す。外交交渉では洞察力や判断力の高さを意味する。"}, {"word": "cryptic", "definition": "謎めいた、不可解な。意味が隠されているか理解しにくい状態。ここでは曖昧で一見理解しにくい平和を指す。"}, {"word": "asymmetry", "definition": "非対称性、不対称。互いに対応する性質や条件が一致していない状態。原文のsymmetryの対義語。"}, {"word": "bonhomie", "definition": "親善、友情的な態度。特に表面的なまたは儀式的な友好関係を指す。本質的な信頼とは異なる。"}, {"word": "simulate", "definition": "~のふりをする、~を模倣する。simulacrumは模造品や見せかけの意味で、本物でない似せたものを指す。"}, {"word": "belligerent", "definition": "好戦的な、戦闘的な。攻撃的な態度や言動を示す。平和的でない立場や姿勢を表す。"}]}, {"title_ja": "新しい中国のサイバー戦争の方法", "title_en": "The New Chinese Way of Cyberwar", "summary_ja": "著者は、中国が米国の重要インフラに戦略的に侵入し、独裁的システムが民主主義より積極的に防御できる非対称性を悪用していると主張している。AI技術はこの脆弱性を悪化させる可能性が高いため、米国は中国がデジタルアクセスを兵器化する前に、高度なAIモデルを使用して重要システムの圧力テストを先制的に実施し、数十年分の脆弱性を特定・修復することが急務である。", "summary_en": "The author argues that China has strategically penetrated U.S. critical infrastructure to prepare for potential sabotage, exploiting an asymmetry where authoritarian systems can defend more aggressively than democracies. AI technology will likely exacerbate this vulnerability, making it urgent for the U.S. to conduct proactive stress-tests of critical systems using advanced AI models to identify and remediate decades of accumulated vulnerabilities before China weaponizes its digital access.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/new-chinese-way-cyberwar-ai", "state_media": false, "category": "オピニオン", "full_text": "Over the past year, the world’s attention has turned to economic chokepoints—with good reason. Iran has exercised its control over the Strait of Hormuz to gum up the global economy, and China has used its command over critical minerals to gain leverage in trade negotiations. Less consideration, however, has been paid to chokepoints in the digital domain, which could prove just as treacherous.\nChinese hackers have gained and retained access to U.S. communications, energy, and transportation infrastructure. The goal of these intrusions is more than intelligence gathering; it is laying the groundwork for sabotage. Just as Iran’s closure of a vital waterway has been extremely disruptive and hard to get around, China’s penetration of critical networks could cause blackouts, make water unsafe to drink, or delay military mobilization. Indeed, the fragility of U.S. critical infrastructure was made clear this summer when Iranian hackers compromised water facilities across multiple U.S. states, causing one county to direct residents to boil water. U.S. allies are also vulnerable. China has breached hospitals in Taiwan, power grids in India, and telecommunications networks in Singapore.\nAs I argued in an essay in Foreign Affairs last year, there is a fundamental asymmetry between China’s authoritarian approach to cyberdefense and the United States’ more democratic method. American laws and values preclude the U.S. government from monitoring private communications and critical national networks in the ways that the Chinese government does. Beijing, for its part, maintains a series of firewalls that—in addition to surveilling and censoring the Chinese people—protect Chinese networks from American offensive intrusions. And where critical infrastructure in China is centralized and controlled by the state, in the United States it is owned and operated by a diverse array of private actors with varying levels of cyberdefense. China, therefore, can use cyberweapons against the United States and its allies with greater confidence that it can withstand retaliation.\nArtificial intelligence is likely to exacerbate this asymmetry. Although the technology has revolutionized both offensive and defensive cyber-operations, it tends to benefit attackers more. Because AI could disproportionately benefit China, the United States has all the more reason to use the technology to improve its cyberdefenses. A year ago, using AI to defend critical infrastructure at scale was possible only in principle. Today, it is possible in practice, as advances in AI have brought down the costs of securing U.S. critical infrastructure.\nTo root out Beijing’s digital chokepoints before they are weaponized, Washington, AI labs, and infrastructure operators need to proactively stress-test critical systems, such as plants and grids serving big cities or military bases, against cutting-edge AI models. Doing so would reveal decades of accumulated American vulnerabilities and offer a guide to how to fix them. Without such an understanding, the United States will continue to lose the cyberwar to China.\nA NEW FRONTIER\nEconomies and militaries often run on digital infrastructure that wasn’t built for the tasks they carry out today, making them attractive and accessible targets for sabotage. That is, in part, why wars of the future will likely play out in the cyber-domain. The United States’ infrastructure is particularly vulnerable. Its power plants and pipelines run on decades-old hardware that was designed for physical reliability, not digital defense. They often lack the logging, encryption, or patching capabilities that create layers of protection.\nAs American utilities modernized, their legacy equipment was wired into computer networks and cloud services for remote monitoring. This created a wealth of opportunities for hackers. Before the advent of the Internet, a saboteur might have had to plant explosives to destroy a gas pipeline. Today, a vandal might be able to shut one off by hacking into a poorly secured router sitting in a in a corporate office.\nTo make matters worse, until recently U.S. utility companies had few incentives or requirements to shore up security. Before the advancement of AI, determining systemic risk required manual, expensive engineering analysis. And before 2021, there were few, if any, cybersecurity regulations for critical infrastructure. The Biden administration established baseline standards for pipelines, ports, airports, and water systems, such as requiring operators to implement multifactor authentication and endpoint monitoring.\n The United States’ infrastructure is particularly vulnerable.\nAs AI has advanced, cyberattacks have become more dangerous. In fact, OpenAI and Anthropic admitted this summer that their models have already hacked other companies without human direction. Rogue AI could make deterring a state-sponsored cyberattack harder because it offers the aggressor plausible deniability. If a victimized country isn’t ", "translation_ja": "", "vocab": [{"word": "chokepoint", "definition": "戦略的に重要な通路や資源の流通地点。経済的または軍事的に支配され、全体的な機能を阻害できる位置を指す。"}, {"word": "asymmetry", "definition": "対称性の欠如。ここでは、中国と米国のサイバー防御能力における不平等な状況を意味する。"}, {"word": "exacerbate", "definition": "問題や状況を悪化させる。すでに存在する困難をさらに深刻にすることを表す。"}, {"word": "stress-test", "definition": "システムが極限の条件下でどのように機能するかを試験する。脆弱性を発見するために負荷をかけて評価する。"}, {"word": "plausible deniability", "definition": "否定することが合理的に可能な状態。行動の責任を否定できる言い訳の余地がある状況。"}, {"word": "legacy equipment", "definition": "古い時代に設計・製造された機器。現代の技術基準には合致していないが、依然として使用されている。"}, {"word": "remediate", "definition": "問題や欠陥を修正・改善する。特に技術的な脆弱性を修復することを意味する。"}]}, {"title_ja": "崩れ落ちるヨーロッパの防衛", "title_en": "The Crumbling Defense of Europe", "summary_ja": "著者は、トランプ政権がヨーロッパからの米軍の大幅な撤退を計画していることは戦略的に誤った判断であり、NATOと米国の世界的な利益を弱めると主張している。ヨーロッパが自力で防衛できるという政権の主張にもかかわらず、著者はヨーロッパ軍がロシアに対する情報収集、調整、抑止力における重要な米国の能力を代替することができないと述べており、この撤退は大陸と米国の安全保障の両方にとって危険であるとしている。", "summary_en": "The author argues that the Trump administration's plan to significantly withdraw U.S. military forces from Europe is strategically misguided and will weaken NATO and American global interests. Despite the administration's claim that Europe can defend itself, the author contends that European forces cannot replace critical U.S. capabilities in intelligence, coordination, and deterrence against Russia, making the withdrawal dangerous for both the continent and American security.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/crumbling-defense-europe", "state_media": false, "category": "オピニオン", "full_text": "The United States appears ready to pull much of its military from Europe. The Trump administration’s 2025 National Security Strategy, a key policy document, declared that it was time for the continent to “stand on its own feet” and take “primary responsibility for its own conventional defense”—or, put differently, that it needs to get ready for when Washington withdraws. At a June 2026 meeting of NATO’s defense ministers, U.S. Secretary of Defense Pete Hegseth announced that the Pentagon was “moving fast and irreversibly toward Europe stepping up to take primary responsibility for the defense of Europe.” Two months later, in August, U.S. Undersecretary of Defense Elbridge Colby said that NATO would transition to what he called “a stronger, more equitable and sustainable alliance,” or one in which the continent would do most of the work of defending itself. The administration followed up by sending a questionnaire to all NATO allies, seeking to elicit whether they were aligned with President Donald Trump’s policies and priorities; unspoken was the clear threat that those who were not would face decreased U.S. support. Purportedly, the Pentagon is working on a study to determine the optimal level of U.S. forces in NATO, but it is clear that the study’s task is merely to provide a cover story for the course Trump, Hegseth, and Colby have already chosen.\nTo Trump and his officials, withdrawing from Europe makes perfect sense. The continent, they argue, is rich and powerful enough to fully defend itself. Washington, meanwhile, must spend its military resources on growing challenges in Asia and the Middle East.\nBut the administration’s logic is incorrect. Pulling back from Europe will not advance Washington’s interests in any part of the world. Quite the contrary: it will weaken not only NATO but all of the United States’ partnerships. It could even threaten the American homeland. The administration’s planned pullback is not motivated by any meaningful appreciation for alliance management, threat analysis, or historical understanding. Instead, it is the product of sheer bias against Europe, which makes it as damning as it is dangerous.\nMAKING THE WORLD UNSAFE FOR DEMOCRACY\nWhen Trump returned to the White House, many European officials hoped that the president’s bark would continue to be worse than his bite, as it was during his first term. But it soon became apparent that Trump was actually going to follow through on his pledge to pull away from the continent. In October 2025, the administration announced that it was permanently removing roughly 1,000 troops from Romania, downsizing its presence on NATO’s eastern flank. In May 2026, his team canceled the deployment to Europe of an army task force equipped with the new Dark Eagle hypersonic weapons system, which would have threatened important military targets in Russia and thus strengthened deterrence. Also in May, the Trump administration canceled the deployment of the Second Armored Brigade let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-16 23:22 JST";
  renderTabs();renderList();
})();
</script>
