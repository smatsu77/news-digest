l gateway and an investment agreement into a broader platform for diversification, export growth and sustainable economic expansion. The post Significance of Ogun’s $7bn Deep Seaport and Blue", "summary_en": "For Nigeria, it is the possibility of turning a coastline into an economic corridor, a port into an industrial gateway and an investment agreement into a broader platform for diversification, export growth and sustainable economic expansion. The post Significance of Ogun’s $7bn Deep Seaport and Blue", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/912610-significance-of-oguns-7bn-deep-seaport-and-blue-marine-sez-by-kayode-akinmade.html", "state_media": false, "category": "経済", "full_text": "The signing in Paris may have taken place around a table, with documents exchanged and signatures appended, but the significance of what Ogun State and its partners have set in motion extends far beyond the ceremony.\nThe Memoranda of Understanding signed by the Ogun State Government and DP World for the development of the Gateway Deep Sea Port and the Ogun State Blue Marine Special Economic Zone represent the emergence of a new economic architecture with implications not only for Ogun but for Nigeria’s industrial, maritime and export future.\nWith an initial investment of more than $7 billion and more than 50,000 direct jobs projected, the initiative has the potential to become one of the most significant private-sector-backed infrastructure and industrial investments in the country.\nBut the real significance lies beyond the headline figures.\nIt is the deliberate integration of a deep-sea port with a 10,000-hectare special economic zone that gives the project its transformative character. As President Bola Ahmed Tinubu put it, “A port moves cargo; a port integrated with a special economic zone helps to build an economy.”\nThat distinction is central to understanding what Ogun is seeking to achieve.\nA conventional port primarily provides a gateway for the movement of goods. But a port connected to an industrial and export-processing zone can become the centre of an entire production ecosystem—bringing together manufacturing, logistics, warehousing, processing, technology, agriculture, energy and international trade.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe Gateway Deep Sea Port, with its proposed four-kilometre berth and 18-metre draft, is designed to accommodate larger vessels, ease pressure on the Lagos port corridor and reduce some of the logistics costs and delays associated with moving goods through congested facilities.\nThe Blue Marine Special Economic Zone gives that infrastructure a productive destination.\nWithin the zone, imported inputs can be transformed into finished products, while agricultural and other Nigerian raw materials can be processed for export. This means that value that might otherwise be created outside Nigeria can increasingly be captured within the country.\nFor Ogun, the multiplier effect could be substantial.\nThe first impact would be industrial expansion. A functioning deep port and integrated economic zone can make the state more attractive to manufacturers seeking efficient access to raw materials, machinery and export markets. Existing industries can expand, while new industrial clusters can emerge around logistics, food processing, petrochemicals, light manufacturing, engineering, packaging and other value-added activities.\nThe second is job creation beyond the headline figure.\nThe projected 50,000-plus direct jobs represent only the immediate employment potential. Around those jobs will emerge additional opportunities in transportation, haulage, warehousing, construction, security, catering, maintenance, financial services, professional services, technology and other areas.\nThe third is the expansion of Ogun’s small and medium-sized enterprise economy.\nLarge infrastructure projects create markets for smaller businesses. Local suppliers will have opportunities to provide goods and services to manufacturers, logistics operators, construction companies and other businesses within the corridor. If properly integrated into emerging value chains, Ogun’s SMEs could become suppliers and producers within the new economic ecosystem.\nThe fourth is agricultural transformation.\nOgun has a substantial agricultural base, but production alone does not guarantee prosperity. The real opportunity comes when agricultural commodities are processed, packaged, stored and exported competitively. The Blue Marine Special Economic Zone could provide the industrial and logistics platform for moving agricultural production further up the value chain, creating greater income for farmers and businesses while reducing the export of raw commodities without value addition.\nThe fifth is logistics and supply-chain development.\nThe port, the Blue Marine Special Economic Zone, the Gateway International Airport, dry ports and the coastal highway can collectively create a multimodal transportation network. Rather than isolated infrastructure projects, they can operate as interconnected economic assets, allowing goods, people, raw materials and finished products to move more efficiently.\nThe proposed 28-kilometre Ogun section of the Lagos-Calabar Coastal Highway is particularly important in this regard. President Tinubu described the highway as central to the commercial viability of the emerging corridor, linking the port and industrial zone with Lagos, the Nigerian hinterland and wider African markets.\nThere is also a fiscal multiplier.\nAs more businesses establish operations, the economic ", "translation_ja": "", "vocab": []}, {"title_ja": "2027: Umahi says Wike’s Rainbow Coalition not in Ebonyi", "title_en": "2027: Umahi says Wike’s Rainbow Coalition not in Ebonyi", "summary_ja": "Mr Umahi’s comment follows controversies and disagreement between Mr Wike and some members of the All Progressives (APC), particularly Nigerian governors under the party's platform over the coalition. The post 2027: Umahi says Wike’s Rainbow Coalition not in Ebonyi appeared first on Premium Times Ni", "summary_en": "Mr Umahi’s comment follows controversies and disagreement between Mr Wike and some members of the All Progressives (APC), particularly Nigerian governors under the party's platform over the coalition. The post 2027: Umahi says Wike’s Rainbow Coalition not in Ebonyi appeared first on Premium Times Ni", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-east/912607-2027-umahi-says-wikes-rainbow-coalition-not-in-ebonyi.html", "state_media": false, "category": "社会", "full_text": "Minister of Works David Umahi has rejected claims that the Rainbow Coalition Movement was plotting to wrestle power from Governor Francis Nwifuru of Ebonyi State, saying the movement does not exist in the state.\nMr Umahi, the immediate past governor of Ebonyi State, spoke during an inspection of the Calabar-Abuja Superhighway in Benue State on Friday.\nA video clip which showed the minister making the remarks has been circulating on Facebook.\nMinister of the Federal Capital Territory (FCT) Nyesom Wike runs the Rainbow Coalition, a multi-party political arrangement, to support President Bola Tinubu’s 2027 re-election bid.\nMr Umahi’s comment follows controversies and disagreement between Mr Wike and some members of the All Progressives (APC), particularly Nigerian governors under the party’s platform over the coalition.\nMr Wike has said the coalition will back candidates of his party, the People Democratic Party (PDP) for other elective positions whilst supporting APC’s Mr Tinubu re-election as president in 2027.\nThe FCT minister is officially a national leader of the PDP faction recognised by the court and the Independent National Electoral Commission.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHowever, he works in the administration of Mr Tinubu, who is a member of the ruling APC.\nHe has continued to openly express support for the re-election of the president in 2027.\n‘No Rainbow Coalition in Ebonyi’\nBut reacting, Mr Umahi, also a member of the ruling APC, said he was unaware if Mr Wike has a governorship candidate in Ebonyi State.\n“Wike is my good friend and brother, (but) there is no (Rainbow) Coalition in Ebonyi State. There is none. And if Wike has (a governorship) candidate here, he has not told me.”\n“And his candidates cannot break our relationship. But his candidate is not part of our relationship,” he said.\nThe works minister, who exited PDP in 2020, jokingly said he did not know that the PDP was still in existence in Ebonyi State.\n“I killed PDP when I left PDP. Whether they are alive again, (I don’t know). And if they are alive, we have to unalive them because PDP did not treat the people of South-east well.\n“We supported the PDP. We voted for presidents in the PDP. when it was our time for them to, you know, honour us (with presidential ticket), they did not honour us. We have hope in APC,” he said.\n‘We’ll fight’\nMr Umahi said his position and that of Governor Nwifuru is that opposition candidates and politicians are free to campaign in Ebonyi State without causing “troubles.”\n“But if you think you can foment (a) crisis, we will run you out of the state. Nobody can foment crisis in Ebonyi State.\n“Anybody that wants to campaign, come and campaign. But don’t dish out hate speeches. And you want to dish out hate speeches and you want us to make a red carpet for you. We will not do that. And If you want (to) fight, we will fight,” he said.\n‘Nwifuru, Tinubu’s second term bids guaranteed’\nMr Umahi then boasted that there are no threats against the victory of Mr Nwifuru and President Tinubu in Ebonyi State in 2027.\n“I don’t think we have any threat either for the president or for the governor or for any of the APC candidates in this Ebony State.\n“I fought the battle alone before. Today, I have the governor. He has me. And there are so many leaders that are with us. So there is nothing to fear (other) than to calculate our votes ahead of time,” the minister claimed.\nREAD ALSO: Wike to lead Tinubu 2027 re-election campaign in FCT, Rivers\n“If we win 95 percent (of votes), that will be our dream come true.”\nBackground\nMessrs Wike and Nwifuru appeared to be fighting cold war in June this year when the Ebonyi governor threatened to “consume” the FCT minister if he dared to challenge him in the south-eastern state ahead of the state’s governorship election in 2027.\nThe governor’s outburst followed claims by Mr Wike’s unnamed allies that Mr Tinubu had handed over Ebonyi to the FCT minister and his PDP faction.\nIn recent times, the friction between Mr Wike and APC governors has also heightened tension and fears that the FCT minister might use the Rainbow Coalition Movement against the governors in the 2027 elections.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Nigeria demands fairer pandemic financing, vaccine access at UN meeting", "title_en": "Nigeria demands fairer pandemic financing, vaccine access at UN meeting", "summary_ja": "Nigeria has urged the international community to make pandemic preparedness financing more accessible to low- and middle-income countries and ensure equitable access to vaccines, diagnostics and therapeutics. The post Nigeria demands fairer pandemic financing, vaccine access at UN meeting appeared f", "summary_en": "Nigeria has urged the international community to make pandemic preparedness financing more accessible to low- and middle-income countries and ensure equitable access to vaccines, diagnostics and aign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Seven Palestinians killed in Gaza Strip during Israeli attacks — Health Ministry", "title_en": "Seven Palestinians killed in Gaza Strip during Israeli attacks — Health Ministry", "summary_ja": "Most of the victims were brought from the Sheikh Radwan neighborhood and the Nuseirat refugee camp, where Israeli forces had been conducting intense fire", "summary_en": "Most of the victims were brought from the Sheikh Radwan neighborhood and the Nuseirat refugee camp, where Israeli forces had been conducting intense fire", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2193499", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Israeli aircraft launch series of strikes on mountainous areas in southern Lebanon", "title_en": "Israeli aircraft launch series of strikes on mountainous areas in southern Lebanon", "summary_ja": "Intense airstrikes targeted underground shelters, command posts, and depots belonging to the Shiite organization Hezbollah on the heights of Jebel al-Rafi, Rayhan, and Sajoud", "summary_en": "Intense airstrikes targeted underground shelters, command posts, and depots belonging to the Shiite organization Hezbollah on the heights of Jebel al-Rafi, Rayhan, and Sajoud", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2193497", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Ukrainian forces launched 31 attacks on DPR settlements over past 24 hours", "title_en": "Ukrainian forces launched 31 attacks on DPR settlements over past 24 hours", "summary_ja": "Three residential buildings, passenger cars, specialized machinery, and three civilian infrastructure facilities sustained damage", "summary_en": "Three residential buildings, passenger cars, specialized machinery, and three civilian infrastructure facilities sustained damage", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2193495", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Oligarchy Is a Symptom, Not a Cause", "title_en": "Oligarchy Is a Symptom, Not a Cause", "summary_ja": "The deepening political dysfunction plaguing the US can be traced not to wealth inequality, as some argue, but to the fact that different groups of voters believe different facts. A political strategy that takes this into account might eventually lead to wealth redistribution, but it must begin with", "summary_en": "The deepening political dysfunction plaguing the US can be traced not to wealth inequality, as some argue, but to the fact that different groups of voters believe different facts. A political strategy that takes this into account might eventually lead to wealth redistribution, but it must begin with", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/inequality-is-not-the-root-cause-of-us-political-dysfunction-by-jeffrey-frankel-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Oligarchy Is a Symptom, Not a Cause\nThe deepening political dysfunction plaguing the US can be traced not to wealth inequality, as some argue, but to the fact that different groups of voters believe different facts. A political strategy that takes this into account might eventually lead to wealth redistribution, but it must begin with improved critical-thinking skills.\nCAMBRIDGE—It has become a common refrain among Americans that the US political system is broken. The question is how it reached this point—and how to get US politics back on track.", "translation_ja": "", "vocab": []}, {"title_ja": "The Immigrants Leading the Anti-Immigrant Far Right", "title_en": "The Immigrants Leading the Anti-Immigrant Far Right", "summary_ja": "Right-wing populists have turned hypocrisy into a successful electoral strategy. But those voting for nativism in Europe and the United States should be careful what they wish for: They may end up expelling their own family members, if not their own political leaders.", "summary_en": "Right-wing populists have turned hypocrisy into a successful electoral strategy. But those voting for nativism in Europe and the United States should be careful what they wish for: They may end up expelling their own family members, if not their own political leaders.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/immigrants-leading-anti-immigrant-right-by-slawomir-sierakowski-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Immigrants Leading the Anti-Immigrant Far Right\nRight-wing populists have turned hypocrisy into a successful electoral strategy. But those voting for nativism in Europe and the United States should be careful what they wish for: They may end up expelling their own family members, if not their own political leaders.\nWARSAW—Earlier this month, Germany’s far-right Alternative für Deutschland (AfD) won 43.8% of the vote in Saxony-Anhalt, a state where foreign nationals make up 7.9% of the population—roughly half the national average. Yet because it fell three seats short of a majority, it needs to secure the support of another anti-immigrant party, the Sahra Wagenknecht Alliance, which is led by a woman whose father came from Iran.", "translation_ja": "", "vocab": []}, {"title_ja": "The Great AI Gamble", "title_en": "The Great AI Gamble", "summary_ja": "As the two world leaders in AI development and adoption, the United States and China are each operating under assumptions that justify ever-faster progress, regardless of the risks. The current thinking is not unlike the rationale once given for Stalinist brutality in the name of rapid modernization", "summary_en": "As the two world leaders in AI development and adoption, the United States and China are each operating under assumptions that justify ever-faster progress, regardless of the risks. The current thinking is not unlike the rationale once given for Stalinist brutality in the name of rapid modernization", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-china-both-betting-everything-on-ai-regardless-of-risks-by-harold-james-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Great AI Gamble\nAs the two world leaders in AI development and adoption, the United States and China are each operating under assumptions that justify ever-faster progress, regardless of the risks. The current thinking is not unlike the rationale once given for Stalinist brutality in the name of rapid modernization.\nPRINCETON—The summit between US President Donald Trump and Chinese President Xi Jinping comes at a time when both are gambling everything on AI—or “superintelligence,” as Trump now insists on calling it. Both leaders, viewing the technology as the key to economic, political, and military dominance, are trapped in a dangerous zero-sum logic.", "translation_ja": "", "vocab": []}, {"title_ja": "Kamala Harris is belatedly courting progressives. Is it too little, too late? | Arwa Mahdawi", "title_en": "Kamala Harris is belatedly courting progressives. Is it too little, too late? | Arwa Mahdawi", "summary_ja": "As she mulls another presidential run, the former VP is building bridges with progressive and Arab American leaders Does Donald Trump secretly want Republicans to get annihilated in the midterms? Because he’s certainly acting that way . He continues to brush off concerns about the cost of living, sa", "summary_en": "As she mulls another presidential run, the former VP is building bridges with progressive and Arab American leaders Does Donald Trump secretly want Republicans to get annihilated in the midterms? Because he’s certainly acting that way . He continues to brush off concerns about the cost of living, sa", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/26/kamala-harris-progressives-arab-americans", "state_media": false, "category": "オピニオン", "full_text": "Does Donald Trump secretly want Republicans to get annihilated in the midterms? Because he’s certainly acting that way. He continues to brush off concerns about the cost of living, saying last week that high gas prices are a very “inexpensive price to pay” for the war on Iran.\nAnd, of course, the president seems to have no plans to end that disastrous war, apart from making vague threats about blowing the entire country up. Trust me, he keeps saying, everything will get better after the midterms. But by the looks of his dismal polling numbers, not many people are swallowing his empty promises anymore.\nStill, despite the mess the Republicans have made of the country, I wouldn’t feel too optimistic about the Democrats returning to power: the party is famous for snatching defeat from the jaws of victory. Instead of evolving, it has a tendency to do the same thing over and over again, expecting different results.\nSee, for example, the fact that there are once again loud murmurings that Kamala Harris plans to run for president in 2028. The former vice-president hasn’t made any sort of official announcement yet – she told voters in Detroit this week that she’s still deciding what to do – but she seems to be testing the political waters through midterm campaigning.\nThis week she flew to Michigan, one of the states she lost to Trump in 2024, to join the Senate candidate Abdul El-Sayed at a roundtable focused on Black maternal health. Harris will also be campaigning with the senator Jon Ossoff in Georgia next month and attending an event in Las Vegas with the Nevada attorney general, Aaron Ford, for his gubernatorial bid.\nHarris’s appearance in Michigan wasn’t some spur-of-the-moment attempt to be helpful; it was a highly calculated move designed to put her back on the national political stage.\nThe New York Times reported this week that Harris’s aides had circulated a donor prospectus in July “that showed how she would try to maintain her influence atop the Democratic Party as she considered another run for president in 2028”. The document, which solicited funds for campaign travel, explained how Harris could boost midterm candidates. It also asserted that the current moment is “uniquely suited to Vice President Harris and a broad coalition already in motion”.\nBut not everyone agrees it’s Harris’s time to shine. Numerous Democratic candidates have publicly stated that they don’t want Harris’s toxic brand anywhere near their elections.\nEl-Sayed, meanwhile, seems to have decided that an alliance with Harris is mutually beneficial. It gives the progressive candidate an inroad into the establishment and might help him win more support with Black voters.\nHarris, who alienated many progressives and Arab Americans by her stance on Gaza, clearly thinks that associating with El-Sayed might improve her reputation among that cohort of voters. El-Sayed has said he opposes military aid to Israel and termed the situation in Gaza a genocide – as have numerous human rights groups and genocide experts.\nEl-Sayed isn’t the only progressive that Harris appears to be trying to build bridges with. Last year, Harris offered only the most lukewarm of endorsements for Zohran Mamdani, stating: “He’s the Democratic nominee, and he should be supported.” Now that it’s clear that Mamdani embodies the political zeitgeist, she’s a lot more keen to be besties. In early July, Axios reported that Harris called up the New York mayor a couple of days after three leftwing candidates he’d endorsed won their primaries over establishment-backed candidates.\nIn fact, Harris has been working the phones pretty hard. The same Axios piece noted that she’d reached out to a number of pro-Palestinian activists and Arab American leaders including James Zogby, founder and president of the Arab American Institute. He told Slate this week that the two had had a “long talk”, which he felt good about.\nIn 2024, the Democrats took progressives for granted. They assumed that young progressives would show up to vote blue no matter who, even when the party treated them with disdain. Instead many of these voters stayed home.\nThe Democrats are still loath to admit that Gaza was a factor in their defeat: a 2024 autopsy report released by the Democratic National Committee did not mention the issue once. However, it looks like Harris is waking up to the realization that her almost unconditional support for Israel hurt her in the previous election and is something she will have to rectify if she wants to run again. Particularly since polls show a record 60% of US adults now have an unfavourable view of Israel and the vast majority of Democrats support an arms embargo.\nIs all this too little too late for the former nominee’s brand? I don’t know. But it’s certainly too late for the tens of thousands of Palestinians the Biden-Harris administration were complicit in killing.\nThe murder of nine women causes a reckoning in South Africa\nThe bodies of nine women have been found across the ", "translation_ja": "", "vocab": []}, {"title_ja": "ICE has abducted a college athlete. What are the NCAA and universities going to do about it?", "title_en": "ICE has abducted a college athlete. What are the NCAA and universities going to do about it?", "summary_ja": "Aminata Seck’s detention shows the bargain facing international college athletes: universities eagerly recruit them, but support can disappear when their immigration status becomes precarious Earlier this week, news broke for the first time that Senegalese Division II Kentucky State women’s basketba", "summary_en": "Aminata Seck’s detention shows the bargain facing international college athletes: universities eagerly recruit them, but support can disappear when their immigration status becomes precarious Earlier this week, news broke for the first time that Senegalese Division II Kentucky State women’s basketba", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/sport/2026/sep/26/aminata-seck-ice-international-college-athletes", "state_media": false, "category": "オピニオン", "full_text": "Earlier this week, news broke for the first time that Senegalese Division II Kentucky State women’s basketball player Aminata Seck was abducted by Immigration and Customs Enforcement (ICE) at Louisville’s Muhammad Ali International Airport on 7 August during a trip to attend the HBCU All-Star game in New York. Seck is listed as a Kentucky State senior and last year started 20 of 26 games, earning third-team all-conference honors and an SIAC Elite 16 award for academic achievement. According to a lawyer involved with her case, Sadiqa Reynolds, Seck has been moved through four different ICE facilities since her initial apprehension: Clay County, Chicago, Clark County and Grayson County. Reynolds noted that the reason for Seck’s imprisonment was a missed student visa deadline – what she characterized as “a paperwork situation” – due to back surgery. Reynolds also said that Seck has been suffering from an ACL injury while detained and has received only ibuprofen but no proper medical care.\nICE arrests in Kentucky have risen by 70% this year.\nThe Department of Homeland Security told USA Today on 23 September that Seck “chose to overstay her welcome in violation of our nation’s laws”, adding, “To be clear: a pending application or work authorization does not confer legal status in the United States.” DHS also claimed that an immigration judge issued a final order of removal for Seck on 8 September 2025, after she purportedly “failed to show up for her immigration hearing”, Notably, they emphasized that “she will remain in ICE custody pending removal proceedings”,\nMargaret Fleming of Front Office Sports reported that a DHS spokesperson told her, “Upon entrance examination, medical personnel noted Seck was wearing a leg brace to support a knee injury that occurred prior to detention. On 21 September, she was referred to the local hospital, where she is receiving treatment for knee pain.” Yet, in the same statement, DHS remarks that it is “longstanding practice to provide comprehensive medical care from the moment an alien enters ICE custody”. This strongly suggests that Seck was denied appropriate medical care for approximately one and a half months in direct contravention of DHS policy until the case became public, at which point, after additional days passed, she was finally provided treatment.\nAdditionally, Hishem Alsalman, lawyer for Seck in her federal habeas corpus petition, told Fleming that the Kentucky State player “never received notice of the hearing that resulted” in her removal order and that, “far from knowingly ignoring her immigration obligations, she was actively taking steps to ensure that her student status remained intact while continuing her education at Kentucky State University.”\nMoreover, Alsalman also shared with Fleming that Seck has experienced seizures during her time in detention and is currently in hospital as of 23 September.\nWhile Reynolds reported that Seck has been receiving considerable support from Kentucky State coach Amani Williams – saying that “she has treated her like a mother would treat their child” – Williams’s response should be commended, but the safety of an international athlete cannot depend on the extraordinary efforts of an individual coach. Institutions that recruit international athletes and benefit from their athletic labor must build systems capable of supporting them when their immigration status places them at risk, rather than leaving coaches to shoulder that responsibility alone.\nThis case raises significant questions about the safety of international college athletes (ICAs) during a moment when the White House has more than doubled the ICE complement, claims to have deported some 605,000 people, and operates with the goal of deporting one million people per year. Indeed, just before the Seck case entered the news cycle, the official US Department of Education X account posted a photo of white fans in the crowd at the University of Texas under the banner “Make College Football Great Again” in reference to recent viral images of South Asian fans in the crowd at a Texas game. This after Ohio Senator Jon Husted introduced legislation on 14 September calling for a cap on ICAs at no more than 20% per team on the grounds that “foreign interference” is stealing opportunities from American student-athletes. The foghorn-volume insinuation of these developments is evidently that non-white, international-coded students are no longer welcome in the world of college sport.\nThat is a rather stunning slap in the face of ICAs given that it has previously been demonstrated beyond a reasonable doubt that they are a “cash cow” for universities in the United States through the contribution of tuition, fees and housing to institutional revenue. While this is less true for profit-generating sports (which includes Division I women’s basketball at some schools), it certainly applies to Division II, where scholarship limitations are in effect such that, for instance, a school can o", "translation_ja": "", "vocab": []}, {"title_ja": "In his final UN speech, Macron may have given other leaders a valuable parting gift: the guts to stand up to Trump | Steve Bloomfield", "title_en": "In his final UN speech, Macron may have given other leaders a valuable parting gift: the guts to stand up to Trump | Steve Bloomfield", "summary_ja": "The French president’s resolve seems to have rubbed off on the leaders of other ‘middle powers’ On the first day of the United Nations general assembly this week, two world leaders outlined competing visions for the future. Donald Trump’s speech was disturbingly familiar to those he’s given before: ", "summary_en": "The French president’s resolve seems to have rubbed off on the leaders of other ‘middle powers’ On the first day of the United Nations general assembly this week, two world leaders outlined competing visions for the future. Donald Trump’s speech was disturbingly familiar to those he’s given before: ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/26/un-speech-macron-parting-gift-stand-up-to-trump", "state_media": false, "category": "オピニオン", "full_text": "On the first day of the United Nations general assembly this week, two world leaders outlined competing visions for the future. Donald Trump’s speech was disturbingly familiar to those he’s given before: a litany of false boasts and odd tangents, peppered with grim military threats against a variety of nation states. Discussing his seven-month war with Iran, he mused over whether to “annihilate the Islamic Republic and do it quickly”.\nIn Trump’s eyes, the world is there to be ruled – and ruled only by the US, whose economy is “the envy of the world” and military is “the most powerful on Earth”.\nA couple of hours later, Emmanuel Macron took to the podium to offer an alternative. In a full-throated defence of international law, multilateralism and the rules-based order, the French president said we were living in a “new era of barbaric acts”. He directly criticised Russia and Israel, but much of it was clearly aimed at Trump. “They say might is right … but we will not yield,” he argued. “We cannot simply accept this new order of impunity which some are trying to erect … Do we want to live under … the law of the jungle or do we want to live in a civilised international society?”\nImportantly, he also acknowledged the west’s “permanent temptation to espouse double standards”. “How many times have we heard that people’s sovereignty has value in Europe, but if we look at the Middle East and Africa, it is less valuable,” he asked. “No, that is unacceptable … A life is a life. Peace and security are indivisible, and everyone has a right to them.”\nOver the past decade, Macron has consistently been one of the only western leaders with a morally intelligent analysis of what Europe and the world should look like. As Trump, Vladimir Putin and Benjamin Netanyahu have ushered us into an age of impunity, he has defended the rules-based order and, in recent months, been at the forefront of attempts to forge new alliances to support the crumbling old ones.\nHe has pushed the idea of European strategic autonomy more than anyone else, understanding that while Europe is an economic power, it is yet to fully realise its potential as either a military or geopolitical force. During Trump’s first term, Macron was the only major leader willing to publicly acknowledge that Nato could no longer rely on the US, leaving the alliance all but dead.\nAnd yet the big speeches have rarely led to any substantial change. His ambitious call for EU reform in 2017 went nowhere, in essence scotched by Angela Merkel, who praised his “passion” and “verve” but failed to back the substance. Likewise, in New York this week, while his analysis was sound, the solutions were slight.\nThis isn’t necessarily all Macron’s fault. He came to power in May 2017 as the new world order was crumbling. The EU was in crisis: one of its largest members had just voted to leave, while the remaining member states were still fatally split over the fallout from the eurozone crisis earlier in the decade and the migration wave in the summer of 2015. France’s two biggest European allies have been on the slide during his time in office. He has had to work with three German chancellors, the most recent two less popular than their predecessors, and is now on his sixth British prime minister.\nMore urgently, Trump had taken office four months earlier, signalling the start of the break up of the rules-based order that had guided the west since the end of the second world war. Had Macron had the chance to work with Barack Obama, Angela Merkel at the peak of her popularity and a British prime minister committed to the EU, things might have turned out differently.\nMacron’s domestic woes have increased his impotence on the world stage. He has in effect been a lame duck for the past two years, since his disastrous snap election in 2024 left him without a majority.\nBut his speech in New York, his final UN address before he steps down as president next spring, may have a more lasting impact. It certainly set the tone for the week. Over the following days, a procession of leaders of the so-called middle powers defended the principles of the UN and offered coded criticisms of Trump. Many of those who would have been scared of speaking out last year feel more emboldened now.\nThe Australian prime minister, Anthony Albanese, warned that “the UN mission cannot be entrusted solely to the great powers, or the biggest countries, or even the loudest voices alone”, while Spain’s PM, Pedro Sánchez, said he sought to “defend what so many are trying to destroy” and called for countries to come together to fight “political actors and governments that want to take us back to a dark past”.\nThe middle powers are united in their opposition. The question is whether they can agree on what they’re for. The events of the past few weeks suggest that process is under way. New alliances based on values, not geography or size, are being formed – a reinvention of multilateralism, rather than a simple defence of the old ", "translation_ja": "", "vocab": []}, {"title_ja": "How Iran Changed War", "title_en": "How Iran Changed War", "summary_ja": "The lessons of Tehran’s use of precise mass.", "summary_en": "The lessons of Tehran’s use of precise mass.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/how-iran-changed-war-united-states-michael-horowitz", "state_media": false, "category": "オピニオン", "full_text": "When the United States began bombing Iran, it expected to quickly overwhelm the country’s government. In the war’s first 24 hours, American and Israeli forces hit roughly 1,000 targets. Over the following 37 days, they blew up 12,000 more, laying waste to much of Iran’s military infrastructure. The strikes killed Iranian Supreme Leader Ali Khamenei, Iran’s minister of defense, and the head of the Islamic Revolutionary Guard Corps.\nBut more than six months later, the Iranian regime not only remains intact; it is perhaps stronger than before. It immediately replaced lost officials and struck back at Washington and its regional partners. And it shuttered the Strait of Hormuz, driving up energy prices around the world and winning newfound political leverage—all to the great frustration of U.S. officials.\nThere are several reasons why Iran performed surprisingly well. For one, the country had long planned for American and Israeli attacks, so it was prepared to reconstitute its government when top leaders were killed. It was also able to import enough goods to keep its economy from completely collapsing despite a U.S. naval blockade. But one of the most significant factors is that the Islamic Republic had built up a large arsenal of cheap yet accurate drones and missiles. These munitions made Iran’s counterattacks effective and allowed it to close the strait—and thus deter American escalation.\nIn doing so, Iran has demonstrated something broader. The age of what I called precise mass—or high-volume, low-cost, precision-guided weapons—is well underway. It is no longer possible for the U.S. military, or any military, to win a full-blown war simply by using small numbers of exquisite weapons to dazzle opponents. Weaker countries can match stronger ones through offensive barrages. Offense is currently cheaper than defense: the price of effective interceptors has yet to fall to the level of attack drones and missiles, which means defending against precise mass is extremely costly. After all, militaries cannot endlessly block salvos of $35,000 Shahed-136 attack drones with $4 million Patriot missiles.\nTo be sure, the war in Iran also shows that advanced technology remains essential. The United States, for example, had great success hitting valuable Iranian sites because it has artificial intelligence systems that can identify and recommend targets faster than ever before. American exquisite weapons are still much harder to stop than cheaper ones, and they are more likely to destroy targets in a single strike. But the world is learning from Iran, building on what Ukraine had already made clear: the future of war lies in part in precise mass. Everyone will now embrace the imperative of producing and using hosts of cheap and disposable weapons systems, changing warfare and the military balance.\nSET IN ONE’S WAYS\nIn war, it might seem as if wealthy states always benefit from new military capabilities. But the reality is more complicated. If a new system is expensive, it indeed favors rich incumbents. But if it is cheap and demands large organizational changes to adopt, other countries can take advantage just as quickly—if not faster. In fact, the most powerful militaries in the world often struggle in the face of required disruptive organizational change, as their prior success has created bureaucracies and organizational biases that make adaption harder. As a result, they have a hard time integrating new capabilities that cannot be plugged into their existing structures.\nPrecise mass is just such a capability. The most conventionally powerful militaries are organized around small numbers of exquisite, expensive, hard-to-produce weapons and platforms such as Tomahawk missiles and F-35s. Their units train and plan around these systems. They thus cannot easily adjust to precise mass capabilities, which require different kinds of training and entirely new conceptions of how to fight. Exquisite systems, for instance, are scarce, so units must take great care not to waste systems and to minimize the risk of destruction. With precise mass, by contrast, units are supposed to move quickly and not make the perfect the enemy of the good. This helps explain why the United States has struggled to adapt to precise mass—even though the country invented precision guidance and boasts the best military in the world.\nIran, meanwhile, has been broadly locked out of some more advanced military capabilities. As a result, it had to invest heavily in long-range, one-way attack systems and cheap ballistic missiles. The result is a war where Iran has dramatically outperformed expectations. Tehran could not go blow-for-blow with the U.S. military’s exquisite weapons, but it did not need to, because it could rapidly fire relatively accurate drones and cheap missiles at U.S. bases and the region’s critical infrastructure. The United States has dealt billions of dollars of damage to Iran in turn, but only by burning through its stockpiles of Tomahawks", "translation_ja": "", "vocab": []}, {"title_ja": "The Coming Taiwan Crisis", "title_en": "The Coming Taiwan Crisis", "summary_ja": "Use today’s calm to prepare for the next perfect storm.", "summary_en": "Use today’s calm to prepare for the next perfect storm.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/taiwan/coming-taiwan-crisis-china-jonathan-czin", "state_media": false, "category": "オピニオン", "full_text": "As U.S. President Donald Trump and Chinese leader Xi Jinping meet in Washington this week, the Taiwan Strait, the waterway that has long been a flashpoint between the two countries, has seemed remarkably quiet. Chinese fighter jets regularly cross the centerline between Taiwan and the mainland. Chinese warships maneuver to the east of the island. And Beijing uses its coast guard to continually harass ships in the area. Yet for nearly a year, Beijing has avoided the large-scale military exercises that had become a regular feature of its coercion of Taiwan after former U.S. Speaker of the House Nancy Pelosi’s visit to the island, in 2022.\nThat shift stems in large part from renewed optimism in Beijing. Although the Trump administration has not formally changed its policy toward Taiwan, Trump’s statements after his prior meeting with Xi in May undermined Taipei’s confidence in the United States’ commitment to the island. “I’m not looking to have somebody go independent,” he said at the time. “And, you know, we’re supposed to travel 9,500 miles to fight a war. I'm not looking for that.”\nFor years, many in Washington and across the Asia-Pacific region assumed that 2027 would be the next potential pivot point for Beijing’s Taiwan policy, because Xi had directed the People’s Liberation Army to be prepared for a cross-strait military confrontation by that date. Yet as 2027 approaches, it appears exceedingly unlikely that Xi is gearing up to employ lethal force any time soon. Xi has been willing to conduct systematic purges of his military high command, in part because he is not worried about a cross-strait crisis in the near future. For now, Xi seems to feel confident that he can effectively manage both Washington and Taipei.\nBut Xi remains deadly serious about organizing his force for a conflict over Taiwan in the coming years. The next pivotal date will not be 2027, when Xi is expected to begin a fourth term, but 2028, when both the United States and Taiwan will hold presidential elections that will determine the future trajectory of the cross-strait dynamic. In all likelihood, Xi will find himself frustrated by the outcome of Taiwan’s next election, which will make the situation more fraught than it is now. The coming two years are thus a crucial window for Washington to work with Taipei to prepare for what will likely be a far more turbulent period in the Taiwan Strait after 2028.\nRather than let doubts about its support for Taipei deepen, Washington should lean into its relationship with the island. In many ways, Taiwan has refashioned itself into a model partner, both by reorienting its economy toward the United States and away from China and by boosting investments in its own defense. At the very least, Trump should approve the $14 billion arms package that is on his desk, even if that means dividing the sale into smaller tranches to avoid escalating tensions with Beijing.\nChina will not welcome a series of U.S. arms sales, but historically Beijing has shown far more concern for high-profile gestures of political support for Taiwan, such as Pelosi’s visit, than over the bureaucratic details of U.S. weapons transfers. And leaving arms sales in abeyance carries its own long-term costs. By forgoing this minimum step, the administration will be complicit in Beijing’s bid to establish a veto over U.S. arms sales and, by extension, over the cross-strait dynamic. After 2028, the diplomatic price of such support for Taipei is likely to rise, as an aging Xi may conclude that further delay on Taiwan no longer works in his favor.\nSOONER OR LATER\nXi’s optimism is predicated on the hope that the opposition Kuomintang party (KMT) will regain power in 2028 after a dozen years of rule by the Democratic Progressive Party, which the mainland reviles as separatist. Beijing has had no visible engagement with the government since the DPP came to power in 2016—a marked departure from Xi’s approach to the previous administration. In 2015, Xi became the first Chinese leader since Mao Zedong to shake hands with his Taiwanese counterpart, a precedent he must have relished. Yet rather than becoming part and parcel of what Xi and his propagandists call the “new era” for China under his rule, Taiwan has steadily drifted away from the mainland, frustrating his ambitions to begin the political process of annexing the island. Annexation, not a costly and likely catastrophic military invasion, is his ultimate goal.\nXi’s hopes rose in November 2025, when Cheng Li-wun unexpectedly became chair of the KMT. Cheng has advocated a much softer line toward China, emphasizing the common Chineseness of citizens on both sides of the strait and the need for cross-strait dialogue. In April 2026, she traveled to Beijing to meet with Xi just weeks before he hosted Trump. The meeting positioned Xi to depict his Taiwan policy as conciliatory and reasonable, despite his hard-line approach to the ruling party over the past decade. His willingness to receive C", "translation_ja": "", "vocab": []}, {"title_ja": "The Price of Arctic Ambition", "title_en": "The Price of Arctic Ambition", "summary_ja": "The Greenland deal proves self-reliance is not an option.", "summary_en": "The Greenland deal proves self-reliance is not an option.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/arctic-antarctic/price-arctic-ambition-greenland-iris-ferguson", "state_media": false, "category": "オピニオン", "full_text": "In 2016, a crack in the ice opened beneath the site of the U.S. Navy’s flagship Arctic exercise several hundred miles north of Prudhoe Bay, Alaska, forcing experiments to end early and leaving researchers scrambling to evacuate. Five years later, an early freeze trapped roughly two dozen commercial vessels in the East Siberian Sea; some had to wait weeks for Russian icebreaker assistance. And during a Canadian-led multinational military exercise in 2025, allied forces encountered a difficult combination of conditions: extreme cold grounded helicopters, broke snowmobiles, and knocked out communications equipment even as thinning sea ice forced U.S. pilots to search 25,000 miles of coastline for a location thick enough to land on.\nThese were not failures by unprepared or inexperienced Arctic actors. They involved three of the region’s most proficient nations, each operating in territory it knew well. But there was a common thread: the Arctic has a way of humbling those who operate there. Its distances, darkness, extreme weather, and sparse infrastructure expose the limits of even the most capable governments and militaries.\nThis fact creates a paradox. The Arctic is a main approach to the U.S. homeland and a platform for projecting power at the top of the world. That is precisely why, as geopolitical competition intensifies, Washington is becoming increasingly focused on protecting sovereignty and securing its interests in the region. Yet no single country, not even the United States, can see, maneuver, and sustain itself across the Arctic. Effective sovereignty there relies on building networks of dependence.\nThis week’s agreement between Greenland, Denmark, and the United States illustrates the point. After months of negotiation, the three parties struck a symbiotic deal codifying U.S. military access while affirming Danish and Greenlandic self-governance. U.S. President Donald Trump has called it a win for American interests; Denmark and Greenland a win for sovereignty. Both are true, as nearly every mission that makes Greenland strategically valuable—missile warning, submarine detection, basing, and resupply—works because the United States is embedded in an alliance system.\nThe agreement could mark a turning point in how Washington approaches Arctic security. Trump’s early talk of acquiring Greenland or making Canada the 51st U.S. state cast self-reliance as the goal and strained relations with key Arctic partners. This agreement signals a more productive direction. Working with allies preserves the advantages the United States already holds and closes the gaps, in both presence and allied political unity, that adversaries are eager to exploit.\nBut fully embracing the role that allies and partners must play for the United States to achieve its goals in the Arctic will const FOCUS = null;
let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-26 23:11 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
