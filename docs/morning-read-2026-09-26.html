ation, told the BBC there was no appetite for restarting the conversation around the MOU as it is seen as a bad deal in the US and Iran was \"pushing against a very closed door\".\nThe MOU was designed to bring about a ceasefire and at least partly reopen the Strait of Hormuz.\nThe 14-point agreement said Iran would never have a nuclear weapon. It noted that the US, Iran and their allies would end military operations on \"all fronts\" and contained provisions including ending a US naval blockade and other sanctions.\nBut the deal fell apart after both sides resumed strikes. Iran has attacked vessels it says have attempted to cross the strait without authorisation.\nThe US has attacked Iranian sites in the strait - as well as Iranian tankers off the country's coast. It has also maintained a blockade of Iranian ports, causing huge disruption to the Iranian economy.\nTrump has since claimed the US has been successful in getting oil out through the Strait of Hormuz.\nShipping data shows a recent 10-day average of about 18 transits per day, with numbers dropping as low as nine vessels on certain days, according to Kpler, a commodities analytics firm cited by Reuters.\nThe situation has been exacerbated by Houthi attacks on Saudi oil installations.\nYemen's Houthis - allied to Iran - have recently intensified attacks aimed at disrupting Saudi oil exports via the Red Sea, on the other side of the Arabian peninsula to the Strait of Hormuz.\nThe group seized strategic stretches of Yemen's Red Sea coast this month, including the port of Mokha, which overlooks the Bab al-Mandab Strait, another chokepoint for global shipping.\nOn Saturday, the Saudi-led coalition in Yemen said it had intercepted two ballistic missiles and drones launched by the Houthis towards Saudi Arabia. US media report Saudi leadership has requested military support from Trump.\nThe US president told the UN General Assembly this week that he believed a deal with Iran would come after November's elections, while pondering whether he \"annihilate the Islamic Republic\" to rebuild it \"quickly\".\nAraghchi said on Friday that \"peace cannot be built through threats of annihilation\".\n  - Published11 September\n  - Published3 days ago\n  - Published18 June", "translation_ja": "", "vocab": []}, {"title_ja": "Pope praises young people's 'energy and commitment' at huge open-air Mass in Paris", "title_en": "Pope praises young people's 'energy and commitment' at huge open-air Mass in Paris", "summary_ja": "Around 700,000 people gathered in central Paris to hear the Catholic leader speak and offer prayer.", "summary_en": "Around 700,000 people gathered in central Paris to hear the Catholic leader speak and offer prayer.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm4gjjwvvlzro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Pope praises young people's 'energy and commitment' at huge open-air Mass in Paris\n- Published\nPope Leo XIV has praised the \"enthusiasm, energy and commitment\" young people bring to the Catholic Church as dense crowds attended an open-air Mass in Paris.\nAn estimated 700,000 people had gathered for the Mass celebrated by the Pope from a special altar on the Place de la Concorde, on the second day of his four-day visit to France.\nIt began after the pontiff rode down the Champs-Élysées Avenue waving to crowds from his open-topped popemobile.\nMany senior politicians attended the Mass. On Friday, the Pope met French President Emmanuel Macron.\nDuring Saturday's Mass, the Pope told worshippers that Catholics should not keep their faith to themselves but \"let it overflow so that those you meet may be refreshed\".\nThe leader of the Catholic Church also addressed young people in his speech, describing them as \"today's Church\".\n\"How beautiful it is to see your enthusiasm, energy and commitment, and the joy you bring to Christian communities,\" he said.\nAfter being welcomed ildings damaged and debris scattered across the road.\nLocal media reported people were injured by material scattered across nearby streets and some buildings needed to be evacuated.\nExcavators and thermal imaging cameras have been used at the scene to search for survivors.\nThe explosion happened on a small road situated between two of Athens' most visited sites - the Acropolis and the Temple of Olympian Zeus.\nA UK Foreign Office spokesperson said: \"We are aware of a suspected explosion in Athens and are in touch with the local authorities.\"\nGet in touch\nAre you in the area? If it is safe to do so you can share your experiences here", "translation_ja": "", "vocab": []}, {"title_ja": "Heathrow Airport warns third runway could be delayed by four years", "title_en": "Heathrow Airport warns third runway could be delayed by four years", "summary_ja": "The UK's busiest airport cautions it may miss the government target of 2035 as ministers say the deadline has \"always been ambitious\".", "summary_en": "The UK's busiest airport cautions it may miss the government target of 2035 as ministers say the deadline has \"always been ambitious\".", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crx2zz401935o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Heathrow Airport warns third runway could be delayed by four years\n- Published\nHeathrow Airport has warned that its planned third runway might be delayed by four years due to planning and regulatory issues.\nThe government had hoped the new runway at the UK's busiest airport, estimated to cost £33bn, would open by 2035.\nBut Heathrow sees this deadline as increasingly difficult to deliver without further steps to simplify the planning process. It said on Saturday that it hoped to secure planning permission by 2029 and then open the runway \"within a decade\".\nThe Department for Transport (DfT) said the project's timeline had \"always been ambitious\" and that it would continue to work with stakeholders \"at pace\" on the matter.\nThe airport said its \"core scenario\" had always been to open a new runway within a decade of securing planning permission.\nIt said it was encouraged by the chancellor's efforts to streamline infrastructure and remove regulatory bottlenecks, and promised to continue to work with ministers, airlines and stakeholders to \"progress the planning application with pace\".\nFormer chancellor Rachel Reeves announced the government's support for the project in January 2025 as a means to grow the economy, and Prime Minister Andy Burnham - who was previously critical - said he was \"open-minded\" about the scheme when he came to office.\nDespite attracting wide opposition from environmental campaigners and local resident groups, the project is expected to create around 100,000 jobs and provide a major boost to the economy as part of a wider £49bn modernisation of the airport.\nThe expansion would mean demolishing hundreds of homes, diverting rivers, and rerouting the M25 motorway between junctions 14 and 15 through a tunnel under the new runway.\nThe number of flights from the site, currently capped at 480,000 a year, could go up to 720,000 - or nearly 2,000 a day on average.\nLondon Mayor Sadiq Khan has always opposed the new runway, warning of the impact on noise, air pollution and climate change.\nThe government's climate advisers warned last week that the expansion should only go ahead if airlines were required to pay for cleaner flying, which could push up the cost of flights.\nTransport Secretary Heidi Alexander said the advisers had set out \"one view\" but there was \"more than one pathway to meeting our climate change obligations\", in an interview with the Daily Telegraph published on Friday.\nA draft of the planning framework for the expansion was published in June this year for consultation. Once finalised, it then needs to be put to a parliamentary vote, which could reportedly be delayed until 2027.\n- What's the plan for a third runway at Heathrow Airport? \n  - Published30 January 2025\n- Heathrow expansion an 'outdated' risk, mayor says \n  - Published3 September\nA DfT spokesperson said: \"There is currently no live planning application for a third runway, and we cannot comment on ongoing consultation processes or prejudice them in a way that will only delay progress.\n\"The timeline has always been ambitious. We'll continue to work with promoters, including Heathrow, and all other stakeholders at pace to ensure the right framework is in place for which a planning application for a third runway could be considered.\"\nA spokesperson for Heathrow said: \"It's right that ambitious targets were set; the sooner expansion begins, the sooner the whole UK will benefit.\"\nThey said the benefits would involve \"at least 108,000 new jobs and billions of pounds invested in supply chains in every part of the country\".\n\"This is a national project, 100% privately financed which will support growth today and secure the UK's position in the global economy once the runway opens.\"\nHeathrow is the UK's busiest airport, serving more than 80 million travellers a year with its four passenger terminals and two runways.\nCorrection 26 September: An earlier version of this story said the runway was estimated to cost £49bn. It has been updated to reflect that this figure is the total amount of investment planned for the airport, including £33bn for the runway.", "translation_ja": "", "vocab": []}, {"title_ja": "Man City chairman confident club will prove innocence", "title_en": "Man City chairman confident club will prove innocence", "summary_ja": "Manchester City chairman Khaldoon Al Mubarak says he is still confident of proving the club's innocence after they were found guilty of breaking Premier League financial rules.", "summary_en": "Manchester City chairman Khaldoon Al Mubarak says he is still confident of proving the club's innocence after they were found guilty of breaking Premier League financial rules.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/sport/football/articles/c6d944ylqkkeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Man City chairman confident club will prove innocence\n- Published\nManchester City chairman Khaldoon Al Mubarak says he is still confident of proving the club's innocence after they were found guilty of breaking the Premier League's financial rules.\nCity were accused of a wide range of rule breaches, centring around claims they inflated sponsorship revenue from connected companies and made other \"off the books\" payments to circumvent financial regulations.\nOn Friday, it was announced City had been found guilty of the vast majority of the 115 charges brought against them and Al Mubarak has responded with a letter to fans on the club's website.\n\"Following Friday's media reporting, many of you will have spent your evening answering questions and responding to messages from friends, family and colleagues. So have I,\" Al Mubarak said.\n\"Here's what I said to my family: The Premier League process still has a long way to run, and our confidence and intent in proving the club's innocence is just as strong as when this began.\n\"There are so many things that I would like to be able to share with you to help you understand why we feel so confident in our position.\n\"But the strict confidentiality of the legal process and our determination to respect it means I cannot do that at the moment. Even this letter underwent several legal checks to make sure it complies.\"\nPremier League clubs are seeking legal advice about compensation relating to the charges, while BBC Sport has been told City will appeal.\nSanctions on the club are yet to be announced, but repercussions could include a points deduction, expulsion from the Premier League or a huge fine.\nAl Mubarak, who was appointed as City's chairman after their 2008 takeover, also said his club was being \"undermined\".\n\"While some people have been quick to reach their own conclusions, and there is so much noise swirling around us, nothing has changed. We have faced challenges together before and have prevailed,\" he added.\n\"There remain many who want to undermine the momentum of our club. We will not give them that opportunity.\"\nMore on Man City charges\n- Man City and the 115 charges - key questions answered \n  - Published1 day ago\n- Man City fans face up to reality of guilty verdict \n  - Published1 day ago\n- Everton told to pay Burnley £35m over PSR breach \n  - Published10 June\nMeanwhile, Christian Purslow, a former Liverpool managing director and Aston Villa chief executive, who also held a senior role at Chelsea, said the City case could begin a chain of events that would be \"appalling for the game\".\nSpeaking on Radio 4's Today programme, Purslow appeared alongside football law expert Paul Gilroy KC, who described the case as a \"seismic moment for world football\".\nPurslow said: \"It's a sort of 'where does this end?' because if you look at every single season - the nine seasons which we now know Manchester City breached rules - then all of their 19 Premier League rivals in that season, to differing extents, suffered easy-to-compute loss. Whether it was a place in the Premier League - every place was worth £3m.\n\"Teams that came fifth who didn't make the Champions League maybe lost tens of millions of pounds - and of course teams that were relegated. Let's say the team that finished 18th would've finished 17th if Manchester City weren't there. And they, of course, suffered huge loss.\n\"If you add all those claims up, over nine years, and that's just in the Premier League, you can see that the potential here for this to spiral out of control is huge.\"\nGilroy added that, so far, four clubs have put in protective claims \"reserving the right to claim compensation if City are found guilty\".\n'Very unsettling for football fans'\nThe news, broken by the Athletic,, external came 1,327 days after City were charged by the Premier League in February 2023 following a four-year investigation, and 22 months after a hearing by an independent commission concluded.\nNo official announcement has been made by the Premier League, which has declined to comment.\nManchester City declined to comment on whether they had been found guilty, instead providing a statement which read: \"Premier League process remains ongoing with significant elements to be completed, and subject to strict confidentiality.\n\"The club has diligently respected due process for eight years on the basis that the Premier League board and executive would behave as an independent, impartial and fair-minded regulator, free from partisan influence.\"\nCulture Secretary Lisa Nandy has urged the Premier League to come to a quick resolution.\nShe told BBC Radio 5 Live: \"I think most football fans will be feeling that this is not a good moment for football as a whole and I think Manchester City fans will be feeling very, very anxious about what happens next.\n\"It's very unsettling for football fans and I hope that it can be resolved as swiftly as possible.\n\"I will obviously look very closely as what comes out of this but we can't apply those rules for", "translation_ja": "", "vocab": []}, {"title_ja": "British national among six dead in building explosion close to Acropolis in Athens", "title_en": "British national among six dead in building explosion close to Acropolis in Athens", "summary_ja": "Four Americans and a Greek national are among those killed in a suspected gas explosion, officials said.", "summary_en": "Four Americans and a Greek national are among those killed in a suspected gas explosion, officials said.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6p3kk78l4l1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "British national among six dead in building explosion close to Acropolis in Athens\n- Published\nSix people have died, including a British national, in an explosion that destroyed a building containing a holiday rental property in the historic centre of Athens.\nThe blast on Friday happened in the Plaka area of the Greek capital, a neighbourhood close to tourist sites such as the Acropolis.\nFour American holidaymakers were among the dead, along with a UK national and Greek national - reportedly an elderly couple who lived in the same building.\nPictures from the scene on Saturday showed emergency service workers searching through rubble, with a gas leak the suspected cause of the blast.\nAll six bodies had been recovered by Saturday afternoon. Athens Mayor Haris Doukas said: \"We are talking about an incredible disaster.\"\nThe tourists were confirmed to be missing when they did not arrive for their flight at Athens airport later on Friday, news agency Reuters reported citing local police.\nThe three-storey building completely collapsed due to the force of the blast, with neighbouring buildings damaged and debris scattered across the road.\nLocal media reported people were injured by material scattered across nearby streets and some buildings needed to be evacuated.\nExcavators and thermal imaging cameras have been used at the scene to search for survivors.\nThe explosion happened on a small road situated between two of Athens' most visited sites - the Acropolis and the Temple of Olympian Zeus.\nA UK Foreign Office spokesperson said: \"We are aware of a suspected explosion in Athens and are in touch with the local authorities.\"\nGet in touch\nAre you in the area? If it is safe to do so you can share your experiences here", "translation_ja": "", "vocab": []}, {"title_ja": "Germany news: EU ministers meet for migration showdown", "title_en": "Germany news: EU ministers meet for migration showdown", "summary_ja": "European interior ministers hold migration talks in Munich as the bloc plans to strengthen borders and speed up deportations. Meanwhile, trade unions staged nationwide demos against health and welfare cuts. DW has more.", "summary_en": "European interior ministers hold migration talks in Munich as the bloc plans to strengthen borders and speed up deportations. Meanwhile, trade unions staged nationwide demos against health and welfare cuts. DW has more.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/germany-news-eu-ministers-meet-for-migration-showdown/live-79441034?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Germany news: EU ministers meet for migration showdown\nPublished September 26, 2026last updated September 27, 2026\nWhat you need to know\n- European interior ministers gather in Munich to tighten EU migration policy\n- Germany's Olympic committee decides Munich will bid to host the Games in 2036, 2040 or 2044\n- Trade unions stage protests in 15 cities against health, welfare cuts\n- Former Chancellor Angela Merkel, a Protestant, wins top Catholic charity's prize\nFollow our blog for the latest news and analysis from across Germany for the weekend of September 26-27, 2026.\nTired of missing our real-time updates? Click here to add DW as a Preferred Source on Google.\nWe are pausing our coverage\nWe will be back on Sunday morning to bring you more of what's happening in Germany this weekend.\nSee you then!\nGermany Olympic bid: Munich named candidate city\nThe German Olympic Sports Confederation (DOSB) announced on Saturday that Munich has been chosen as Germany's candidate city to host the Summer Olympics and Paralympics in either 2036, 2040 or 2044.\nThe Bavarian capital beat a rival Cologne-led bid from the western Rhine-Ruhr region.\nBerlin had withdrawn its bid earlier in the week, while the residents of Hamburg voted against a bid in a referendum earlier this year.\nMass protests against cuts to social services\nHundreds of thousands of people took to the streets of cities across Germany on Saturday to voice their opposition to planned government spending cuts and call for a stronger welfare state.\nTrade unions said a total of 175,000 took part in the protests, including in Nuremberg (over 20,000), Stuttgart (16,000), Frankfurt (15,000), Hanover (13,000), Essen (12,000), Berlin (5,500) and elsewhere under the slogan: \"Hard-earned! Your work. Your health. Your pension.\"\nSpeaking in the western city of Essen, German Trade Union Confederation (DGB) leader Yasmin Fahimi criticized plans by Chancellor Friedrich Merz's coalition government to reform working hours and pensions, and warned against cuts to social security benefits.\n\"We will not simply allow what we have built up over many years in terms of social standards to be taken away from us,\" she said.\nPension reform has been the focus of attention for months in Germany, while automobile giant Volkswagen has also announced sweeping job cuts.\nThe issues played a central role in the recent state elections in Berlin and the eastern states of Saxony-Anhalt and Mecklenburg-Western Pomerania, which resulted in disastrous defeats for Merz's conservative Christian Democratic Union (CDU).\nNevertheless, the chancellor insisted earlier this month: \"The reforms must go ahead.\"\nChristiane Benner, leader of the trade union IG Metall, warned in Nuremberg against scaling back social security in times of restructuring and job cuts, for example in the automotive sector.\n\"Economic change can only succeed with confidence in the future and with solidarity,\" she said.\nGerman employers, however, accused the trade unions of a \"ritual refusal to reform.\"\nSteffen Kampeter, chief executive of the Confederation of German Employers' Associations (BDA), told the DPA news agency that \"the trade unions say 'no' to almost every change\" and accused them of \"dreaming of the world of yesterday.\"\nMigration: Dobrindt calls for expanded Frontex role\nGerman Interior Minister Alexander Dobrindt has called for an \"expanded mandate\" for the European Union's border protection agency Frontex when it comes to the deportation of illegal migrants.\n\"We are of the belief that we can strengthen the use of Frontex in deportation cases,\" he said ahead of a meeting of EU interior ministers in Munich on Saturday, calling for Frontex's area of operation to be expanded to \"transit countries\" outside the bloc.\n\"Of course, only with the agreement of these countries,\" he added.\nDobrindt said he also wanted to expand Frontex's responsibilities to \"Dublin Regulations\" – referring to the rules which determine which EU member state is responsible for the processing of an asylum application.\n\"A new European migration mechanism is needed,\" he said.\nPolice close 2 autobahns to free giant wind-turbine\nA wide-load truck carrying a nearly 100-meter-long (328-feet-long) wind turbine blade forced the closure of two motorways in western Germany after it got stuck along a narrow section of the carriageway.\nThe daily Bild newspaper reported that the truck was traveling along the A43 autobahn near the Recklinghausen interchange in the state of North Rhine-Westphalia when the dramatic incident unfolded on Wednesday evening.\nPolice said the driver ignored warning signs that the highway was unsuitable for heavy-load vehicles.\n\"The highway is not permitted for heavy transport vehicles in that area. They have to exit because the route crosses the Rhine-Herne Canal a little further on,\" a spokesperson for Münster Police's highway patrol told Bild.\nAn automatic barrier and weighing system is meant to prevent loads over 3.5 tons from crossing an old b", "translation_ja": "", "vocab": []}, {"title_ja": "Backlash over data centers tests Europe's AI ambitions", "title_en": "Backlash over data centers tests Europe's AI ambitions", "summary_ja": "Massive data centers needed to run AI are triggering protests across Europe. Their operators counter that they boost digital sovereignty and energy independence.", "summary_en": "Massive data centers needed to run AI are triggering protests across Europe. Their operators counter that they boost digital sovereignty and energy independence.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/backlash-over-data-centers-tests-europe-s-ai-ambitions/a-79419800?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "Backlash over data centers tests Europe's AI ambitions\nSeptember 26, 2026\nLike coal-fired power plants and wind turbines, few people actually want a data center in their backyard. But they do want to use their services. As a global debate rages about the potential dangers of artificial intelligence, there are also many local discussions about where exactly the data centers needed to train and run AI should be built.\nThis is currently a major issue in Europe, where many governments and companies have decided that they would prefer to store data in Europe rather than in the United States, which is the global leader in computing. But more digital sovereignty in Europe will mean more consumption of the continent's resources.\nAccording to the German Ministry for Economic Affairs, for every kilowatt-hour of electricity consumed, an average of between 0.4 and 4.4 liters (0.8 and 9.3 pints) of water is used to cool data centers, with the water either evaporating or being diverted back to tanks in a warmed state.\nMassive water consumption\nThe summer that just ended was the hottest on record in Europe — in some areas, water use was restricted for residents, agriculture and even nuclear power plants. The summers are expected to get warmer, so many are wondering about the potential water consumption of data centers in the future.\nThey are also worried about the high electricity consumption of the centers. Fingrid, Finland's national grid operator, recently forecast that electricity consumption would rise by almost 40% if all projects with signed connection agreements were implemented in full.\nThis week, the European Commission announced a new scheme for data centers to increase transparency on their energy and water use. Those with a capacity of more than 500 kW will receive an efficiency grade that will also take into account their contribution to the grid, such as the reuse of waste heat. \"Tripling our data center capacity cannot mean tripling the pressure on our grids, our water and our energy bills,\" said Teresa Ribera, the Executive Vice-President of the European Commission for a Clean, Just and Competitive Transition.\nData centers in urban hubs and rural areas\nEurope's most powerful data centers have primarily been built near the major cities of Frankfurt, London, Amsterdam, Paris and Dublin (FLAP-D) because of high connectivity, proximity to users and businesses, and well-established ecosystems with specialized engineers and secure supply chains.\nHowever, according to a report by the investment group CBRE, the situation is changing as these markets face power and grid infrastructure constraints. New data centers are being built in the Dutch city of Groningen, Barcelona in Spain or the Belgian capital Brussels, as well as in more rural areas.\nAnd as this happens, there are more and more protests taking place, both on and offline. Earlier this month, hundreds turned up for a protest in front of tech giant Google's offices in the Austrian city of Linz, demonstrating against its already advanced plans to build a data center in the small town of Kronstorf.\nEarlier this month, bestselling Irish author Sally Rooney successfully led a campaign to overturn planning permission for a proposed data center in the village of Killala, arguing that it would breach national climate policy.\nIn central France, meanwhile, several elected officials in the village of Etrechet have resigned over Google's plans to build a massive data center, which, at full capacity, would require between 880 megawatts and 1.1 gigawatts of electricity or the equivalent of the total output of a nuclear power plant. Etrechet mayor Florence Laurent told the French daily Le Monde that she was resigning out of a \"sense of powerlessness, since the village has no decision-making power\" regarding the project.\nSome operators of data centers argue that the facilities can be built in such a way that they save energy. A large data center currently being built in Marseille will reportedly use a cooling system that requires 30% less power and consumes no water.\nOther data centers, in Scandinavia, for example, use waste heat from the servers and route it into district heating networks via heat exchangers and pumps.\nThis spring, the German energy company E.ON published the results of a survey that found nearly three-quarters of people would be more likely to welcome data centers near residential areas if they fed their waste heat into the heating network.\nData center operators also argue that the facilities can serve the public by connecting the batteries that usually provide backup power to local grids so that there is uninterrupted service in the event of power outages or at times of peak demand.\nFor proponents of building more data centers in Europe, the facilities not only contribute to the continent's digital sovereignty but also help to strengthen energy independence.\nMonir Ghaedi contributed to this article, which was translated from German.", "translation_ja": "", "vocab": []}, {"title_ja": "China, US agree to set up channel for AI safety incidents", "title_en": "China, US agree to set up channel for AI safety incidents", "summary_ja": "Following the summit between US President Donald Trump and Chinese President Xi Jinping, the two superpowers pledged to set up a \"communication channel\" for AI incidents and boost coordination on military matters.", "summary_en": "Following the summit between US President Donald Trump and Chinese President Xi Jinping, the two superpowers pledged to set up a \"communication channel\" for AI incidents and boost coordination on military matters.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/china-us-agree-to-set-up-channel-for-ai-safety-incidents/a-79443351?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "China, US agree to set up channel for AI safety incidents\nSeptember 26, 2026\nBeijing and Washington promised to expand dialogue on AI safety and between the countries' militaries while also cutting tariffs on about $30 billion (€26.3 billion) of \"non-sensitive goods.\"\nThe pledges follow the three-day summit between Donald Trump and Xi Jinping in the US.\nUS President Trump described the summit in an online post as \"one of Friendship, Strength, and Success\" for both nations.\nChina's President Xi was more constrained, saying the two sides agree on \"strategic stability on the basis of respect, fairness, and reciprocity.\"\nBeijing and Washington to improve military communication\nOn Saturday, with Xi back in Beijing, China said the two sides agreed to a mutual tariff reduction on roughly $30 billion of \"non-essential\" goods. This applies to exports such as agricultural products or holiday decorations.\nThe Chinese statement also confirmed that the two side will be setting up a \"communication channel\" for AI incidents.\n\"Artificial intelligence technologies are continuously developing, all parties can strengthen exchanges, discuss in-depth and seek consensus in light of the latest situation,\" the Chinese Foreign Ministry said.\nA new round of AI-focused dialogue is due to be held in November.\nThe two nations will also accelerate their work on military crisis communications, Beijing said, without providing details.\nXi to travel to the US again in December\nThe US had previously announced that Beijing and Washington agreed to extend their \"trade truce\" agreed by Trump and Xi in Busan last October. The agreement, which saw China suspending its controls on rare earths and the US cutting back on some of its tariffs, was due to expire on November 10. According to US Treasury Secretary Scott Bessent, the deal will remain in effect until January.\nThe White House also said the two sides addressed American concerns about rare earths supply \"with the goal of ensuring shipment levels return to appropriate levels.\" China also agreed to import at least 10 million metric tons of coal from the US in 2027 and 2028, according to the Trump administration.\nWhile Donald Trump confirmed the Iran war was also on the agenda during the US talks, no major breakthroughs were reported on the issue. However, the Chinese Foreign Ministry said both sides agreed that Iran should not have nuclear weapons, and no country should impose transit tolls on international waterways, in reference to the Strait of Hormuz.\nTrump and Xi are due to meet twice more by the end of the year, with Trump expected to attend the Asia-Pacific Economic Cooperation summit in China in November and Xi expected back in the US for a G20 summit in December, which is due to be hosted in Trump's National Doral Miami golf club.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Iran live updates: Trump rejects Iran offer to reopen Strait of Hormuz", "title_en": "Iran live updates: Trump rejects Iran offer to reopen Strait of Hormuz", "summary_ja": "President Donald Trump said Saturday morning that he rejected Iran’s seven-day plan to reopen the Strait of Hormuz.", "summary_en": "President Donald Trump said Saturday morning that he rejected Iran’s seven-day plan to reopen the Strait of Hormuz.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates-irgc-ready-counteroffensive-us-attacks/?id=136611503", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Nor'easter brings strong winds, coastal flooding and high waves to East Coast", "title_en": "Nor'easter brings strong winds, coastal flooding and high waves to East Coast", "summary_ja": "The early-season nor’easter hit the East Coast Saturday bringing in torrential rain, high winds and flood warnings for millions of people.", "summary_en": "The early-season nor’easter hit the East Coast Saturday bringing in torrential rain, high winds and flood warnings for millions of people.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/noreaster-brings-strong-winds-coastal-flooding-high-waves/story?id=136777903", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Rebel offensive against Ethiopian army stokes fears of return to civil war", "title_en": "Rebel offensive against Ethiopian army stokes fears of return to civil war", "summary_ja": "Fighting escalates after Tigrayan rebels form new coalition aimed at overthrowing Abiy Ahmed government There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance ai", "summary_en": "Fighting escalates after Tigrayan rebels form new coalition aimed at overthrowing Abiy Ahmed government There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance ai", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/24/fears-return-to-war-tigray-rebels-launch-offensive-against-ethiopian-army", "state_media": false, "category": "政治", "full_text": "There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance aimed at overthrowing the government of the prime minister, Abiy Ahmed.\nAbout 600,000 people died between 2020 and 2022 during a devastating war between the Ethiopian army and the political party and paramilitary group the Tigray People’s Liberation Front (TPLF). Both sides are now accusing the other of triggering a return to open conflict.\nOn Sunday, seven armed groups from around the country, including the TPLF, announced the formation of the Ethiopian Peoples’ Forces Alliance for Survival, aimed at deposing the government in Addis Ababa. Then, on Wednesday, the TPLF seized control of three airports from federal police. The state-owned carrier, Ethiopian Airlines, said it had suspended flights to the region “due to the current situation”.\nThe TPLF also launched attacks into Afar and Amhara. A humanitarian source in Afar told Agence France-Presse there were heavy artillery attacks by the group on Thursday as they attempted to take control of the town of Yallo, near the Tigrayan border.\nFlights to the historic Ethiopian town of Lalibela were also suspended on Thursday because of nearby fighting, while people in Tigray stocked up on food and cash, with one resident telling Reuters that people there feared they could face siege conditions similar to those during the previous war.\nA resident of Adigrat, a city close to the Eritrean border, described panic-buying and shops emptying. “Food shortages are worsening as market shelves sit empty … Essential medicines remain scarce and astronomically expensive,” he told Reuters. “Daily survival has become a constant calculation.”\nThe TPLF’s vice-president, Amanuel Assefa, told AFP: “We are in the situation of full-blown war now.” He confirmed Tigrayan forces were fighting alongside local armed groups in Afar and Amhara.\nThe group took control of Abala, also on the Tigray-Afar border, on Wednesday, a foreign security source based in Ethiopia told AFP, while a TPLF source said they had seized several other towns in Afar. The foreign security source also said there was fighting around the Amhara town of Weldiya – one of the few routes to the capital.\nIn its first public comments on the fighting, Ethiopia’s army said on Thursday it had foiled the attacks and killed, wounded or captured more than 500 enemy fighters.\nAnalysts say the TPLF has support from Ethiopia’s neighbour and historic adversary Eritrea, which fears landlocked Ethiopia is planning to invade its territory to gain access to the Red Sea. The TPLF’s Assefa told AFP “we have no information about Eritrea’s plan”. Asked if they would request Eritrean intervention, he said: “Not yet.”\nThe current fighting reflects shifting dynamics from the civil war, when Eritrea and Fano, an insurgent group that is now part of the new alliance, both fought with the government against the Tigrayans.\nSpeaking at the UN general assembly on Wednesday, the Ethiopian president, Taye Atske-Selassie Amde, decried “the forces of destruction and mayhem” and “interference in our internal affairs by adversarial elements”. He said Ethiopia had exercised “immense restraint” and made progress with its neighbours.\nAbiy’s spokesperson, Billene Seyoum, said members of the alliance had been collaborating for a while with the financial backing of Eritrea. Eritrea has repeatedly denied similar accusations.\nThe TPLF ruled Ethiopia from 1991 to 2018 before being sidelined by the rise of Abiy, eventually triggering the civil war.\nThe renewed fighting marks the most serious challenge yet to the 2022 Pretoria agreement, which ended the civil war and maintained an uneasy calm until late last year, when clashes resumed.\nIt raises fears of a broader regional conflict that could draw in armed groups from across and further destabilise a region already strained by war in neighbouring Sudan and tensions along the Red Sea.\nOn Wednesday, the African Union chair, Mahmoud Ali Youssouf, urged “utmost restraint” from the warring parties and resumption of direct talks. An EU spokesperson called for “immediate de-escalation” and a recommitment to the Pretoria agreement.\nIn the 2020-22 war, Tigray was largely cut off from the outside world as communications were severed, and access to food, cash and medicines was severely restricted, pushing hundreds of thousands of people into famine-like conditions.\nAFP and Reuters contributed reporting", "translation_ja": "", "vocab": []}, {"title_ja": "Indian billionaire’s payments firm plots biggest London flotation in years", "title_en": "Indian billionaire’s payments firm plots biggest London flotation in years", "summary_ja": "Sunil Bharti Mittal’s Airtel Money targets $9bn IPO in boost for ailing UK stock market Nils Pratley: Does this mark the end of London’s listing drought? Not yet A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float", "summary_en": "Sunil Bharti Mittal’s Airtel Money targets $9bn IPO in boost for ailing UK stock market Nils Pratley: Does this mark the end of London’s listing drought? Not yet A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/business/2026/sep/23/indian-billionaire-payments-firm-london-flotation-airtel-money", "state_media": false, "category": "経済", "full_text": "A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float on the struggling London Stock Exchange.\nAirtel Money, the mobile money arm of Airtel Africa, is planning one of the biggest UK listings in years, in a boost for the shrinking London market that has faced a string of recent departures.\nThe company is understood to be hoping to raise about $800m (£601m) from the initial public offering (IPO) and is targeting a valuation of $8bn to $9bn, which would make it one of London’s largest listings in recent years.\nAirtel Money has 53 million monthly active users across 13 countries in sub-Saharan Africa, including Uganda, Zambia and the Democratic Republic of Congo.\nIt operates through a network of branches and kiosks, which enable customers to load money on to their phones, withdraw cash and access other money services, and the company generated revenues of just under $1.4bn in the last financial year.\nAirtel Money’s parent company is Airtel Africa, a telecoms provider that is part of the Indian conglomerate Bharti Enterprises, which is ultimately controlled by the billionaire Sunil Bharti Mittal. Airtel Africa is already listed on the FTSE 100 but said it wanted Airtel Money to be listed separately.\n“From a company perspective, [the listing] gives us flexibility for the future,” said Airtel Money’s chief executive, Ian Ferrao.\n“We evaluated multiple [stock] exchanges, including the Middle East because we’ve got a headquarters in Dubai, along with European and North American exchanges. Ultimately, shareholders felt that London was the right choice. We still believe there is deep capital available … all the global institutional investors are here.”\nFerrao added: “Most importantly there’s a deep understanding of emerging markets in the London market and Africa specifically.”\nAirtel Money said it would announce more details about the float in early October, including the indicative price range and number of shares to be offered, with final pricing to follow later in the month.\nAirtel Africa had originally targeted a listing in the first six months of 2026 but delayed it to the second half of the year, blaming unfavourable market conditions as a result of the US-Israeli war on Iran. Several other companies also pushed back planned IPOs amid the market volatility caused by the conflict.\nAirtel Africa owns just under 78% of Airtel Money and will remain a long-term investor after the IPO. Minority stakes are held by TPG, Mastercard, the Qatar Investment Authority and Chimetech Holding.\nRevenue in Airtel Money’s most recent quarter to 30 June climbed 38% to £399m, according to Airtel Africa.\nThe decision to float Airtel Money in the UK could mark a turning point for the City, which has struggled to attract listings in recent times and has also been hit by departures, partly as a result of overseas takeovers of UK companies.\nAirtel Money’s planned listing could be one of the biggest debuts since the international payments company Wise floated in 2021 with a valuation of £8.75bn. Wise has since moved its main listing from London to New York.", "translation_ja": "", "vocab": []}, {"title_ja": "Top South African police officer charged with raping woman, 18, and grooming 16-year-old girl", "title_en": "Top South African police officer charged with raping woman, 18, and grooming 16-year-old girl", "summary_ja": "Arrest of Shadrack Sibiya comes as country reels from cases of femicide and alleged police corruption and criminality One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corru", "summary_en": "Arrest of Shadrack Sibiya comes as country reels from cases of femicide and alleged police corruption and criminality One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corru", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/23/south-africa-top-police-officer-shadrack-sibiya-charged-rape-grooming", "state_media": false, "category": "政治", "full_text": "One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corruption and failing to tackle violence against women and girls.\nShadrack Sibiya, who was already suspended from his role as deputy national police commissioner over allegations he interfered with political killings investigations, was arrested on Monday. He is facing charges of rape, people trafficking, promoting the sexual grooming of a child and two counts of grooming a child.\nSibiya appeared briefly in a Johannesburg court on Tuesday. He was then taken to prison in the capital, Pretoria, before a bail hearing on 29 September, as prosecutors had argued he was an escape risk.\nSouth Africa is reeling after the discovery of nine women’s bodies across Ekurhuleni, the municipality east of Johannesburg, in September. Meanwhile, the Madlanga Commission judicial inquiry has been examining allegations of corruption and criminality within the police for the last year.\nPuleng Dimpane, the acting national police commissioner, said: “Police officers are entrusted with protecting women and children. They cannot themselves be implicated in conduct that undermines this responsibility. As the country continues to confront the scourge of gender-based violence and femicide, there can be no room for anyone within the police service who is alleged to abuse their position or violate the rights of women and children.”\nSibiya is accused of raping an 18-year-old woman at a hotel in May in the Sandton business district of Johannesburg. The alleged rape took place “whilst she was passed out due to intoxication administered by the accused”, according to a copy of the charge sheet.\nThe alleged grooming of the 16-year-old girl took place over WhatsApp between 20 July and 3 August, according to the charge sheet. This allegedly included Sibiya sending the girl naked photos of herself, which she had not sent to him.\nSibiya did not enter a plea at the hearing on Tuesday. His lawyer told the court that they needed more time to consult with and get instructions from him, according to News24.\nFiroz Cachalia, the acting police minister, said: “We strongly condemn the alleged conduct.\n“Where allegations of sexual offences are made against a member of the service, they must be investigated without fear or favour.”\nWhen Sibiya appeared before the Madlanga Commission in February he denied allegations that he had moved 121 political killings investigations from KwaZulu-Natal province to the national head office without explanation.\nSibiya also denied that he had received a gift of 20 impalas from Vusimuzi ‘Cat’ Matlala, a businessman who received an allegedly fraudulent 360m rand (£16.7m) police health services contract soon after the alleged gift.\nMatlala, who has been charged with attempted murder, alongside several other charges including fraud and money laundering, declined to comment on the impalas when he appeared at the Madlanga Commission in August. He said he did not want to incriminate himself as the matter was under investigation.", "translation_ja": "", "vocab": []}, {"title_ja": "Student protesters disrupt NVIDIA AI climate panel", "title_en": "Student protesters disrupt NVIDIA AI climate panel", "summary_ja": "Student protesters have interrupted an NVIDIA panel during NYC Climate Week.", "summary_en": "Student protesters have interrupted an NVIDIA panel during NYC Climate Week.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/26/student-protesters-disrupt-nvidia-ai-climate-panel?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Student protesters disrupt NVIDIA AI climate panel\nNewsFeed\nStudent protesters disrupt NVIDIA AI climate panel\nStudent protesters have interrupted an NVIDIA panel during NYC Climate Week, shouting about the environmental impact of data centres and the company’s business ties with Israel.\nPublished On 26 Sep 2026", "translation_ja": "", "vocab": []}, {"title_ja": "Trump says he is rolling back Biden-era US fuel economy rules for cars", "title_en": "Trump says he is rolling back Biden-era US fuel economy rules for cars", "summary_ja": "The US president said he would end a so-called &#039;EV mandate&#039; that steered consumers to electric vehicles.", "summary_en": "The US president said he would end a so-called &#039;EV mandate&#039; that steered consumers to electric vehicles.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/26/trump-says-he-is-rolling-back-biden-era-us-fuel-economy-rules-for-cars?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Trump says he is rolling back Biden-era US fuel economy rules for cars\nThe US president said he would end a so-called ‘EV mandate’ that steered consumers to electric vehicles.\nUnited States President Donald Trump has announced new fuel economy standards that roll back requirements adopted under his predecessor, arguing they will lower automobile prices and encourage manufacturers to expand production in the US.\nIn a social media post on Saturday, Trump said the new standards would “TERMINATE” what he called former US President Joe Biden’s “EV (electric vehicle) mandate”, accusing the previous administration of imposing costly requirements on carmakers and steering consumers towards electric vehicles.\nRecommended Stories\nlist of 3 items\n- list 1 of 3What would a US diesel export ban mean for global fuel prices?\n- list 2 of 3Iran war squeezes Iraq’s economy as oil revenues fall and prices rise\n- list 3 of 3US transport dept says Biden fuel economy rules exceeded legal authority\n“These new Standards will take the waste out of building cars in America. That means LOWER PRICES, saving families thousands on a new, beautiful, and safe car,” Trump wrote.\nThe changes form part of a broader Trump administration effort to reverse Biden-era policies supporting lower-emission vehicles, increasing the gap between US policy and global trends favouring electric vehicles.\nWhile Trump and US Republicans have used the term “EV mandate” to describe higher fuel efficiency requirements instituted under Biden, a Democrat, there are no federal guidelines or laws that require Americans to buy electric cars or bar the sale of ones powered by petrol.\nAt the centre are Corporate Average Fuel Economy (CAFE) standards. This system, established by the US Congress in 1975, requires automakers to meet average fuel economy targets across all cars and light trucks they sell, meaning that a brand that sells an inefficient vehicle would also have to sell a more efficient one to help comply with the government’s standards.\nUnder rules finalised by the Biden administration in 2024, the required fleetwide fuel economy was scheduled to rise from 39.1 miles per gallon (mpg) to about 50.4mpg by 2031. The administration said then the measures would reduce fuel consumption and emissions to combat climate change while helping motorists save money at the pump.\nAs a result, auto manufacturers have ramped up production of EVs to help meet the Biden-imposed fuel economy requirements. The Republican-controlled US Congress, however, gutted consumer tax incentives last year for electric vehicles as part of Trump’s One Big Beautiful Bill Act.\nTrump did not provide details regarding what the new fuel economy standards would be. But in December 2025, he announced a proposal that would set the industry fleetwide average for light-duty vehicles at roughly 34.5mpg by 2031, more than 30 percent lower than the Biden-era rule.\nIn a reposting of Trump’s announcement, US Transportation Secretary Sean Duffy said an announcement would be “COMING MONDAY”.\nAl Jazeera has reached out to the White House for comment.", "translation_ja": "", "vocab": []}, {"title_ja": "Yamal nets in Spain’s 3-2 comeback win against England in Nations League", "title_en": "Yamal nets in Spain’s 3-2 comeback win against England in Nations League", "summary_ja": "Lamine Yamal goal opens the scoring, but Spain made to comeback in Nations League win as Harry Kane misses penalty.", "summary_en": "Lamine Yamal goal opens the scoring, but Spain made to comeback in Nations League win as Harry Kane misses penalty.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/26/yamal-nets-in-spains-3-2-comeback-win-against-england-in-nations-league?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Yamal nets in Spain’s 3-2 comeback win against England in Nations League\nLamine Yamal goal opens the scoring, but Spain made to comeback in Nations League win as Harry Kane misses penalty.\nWorld champions Spain came from behind to beat England 3-2 in an entertaining Nations League encounter at Wembley on Saturday, denying the hosts a cathartic win after their painful World Cup exit.\nVictory for Luis de la Fuente’s men extends Spain’s astonishing unbeaten run to 39 matches – a record for a European team.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Manchester City confident they can prove ‘innocence’ over charges: Chairman\n- list 2 of 4What next for Man City as fallout from 115 charges rumbles – all to know\n- list 3 of 4Timeline: Man City’s Premier League financial charges to reported verdict\n- list 4 of 4Man City found guilty on almost all 115 Premier League charges: Report\nThomas Tuchel’s men got off to a nightmare start when Lamine Yamal pounced on a gaffe by defender Marc Guehi, and they could easily have been three goals down as silky Spain created multiple chances.\nBut England, criticised for their ultra-defensive tactics in their World Cup semifinal defeat to Argentina, showed adventure of their own and got their reward in the 36th minute when Barcelona winger Anthony Gordon finished a fine team move.\nFour minutes later, the home side were ahead after Kane headed home Nico O’Reilly’s cross via a Marc Cucurella deflection.\nKane had a golden chance to give England a two-goal cushion from the penalty spot 10 minutes into the second half but slipped slightly, crashing his shot against the bar.\nSpain, who beat England in the Euro 2024 final, took full advantage, with substitutes Alex Baena and Mikel Oyarzabal putting their side ahead, taking advantage of more sloppy defensive play from the home side.\nEngland boss Thomas Tuchel was adamant ahead of the match that it did not signal a new start, but he will have been dismayed by his team’s nervy start.\nManchester City’s Guehi, with a chance to clear in the second minute, inexplicably turned back towards goalkeeper James Trafford, apparently unaware that Yamal was just behind him.\nThe teenager collected the ball and curled a left-footed effort off the inside of the post.\nFerran Torres was in the thick of the action, with an effort ruled out for offside and another shot saved by Trafford, in for longtime number one Jordan Pickford.\nHe also squandered a golden opportunity with just the goalkeeper to beat.\nYamal then set up Dani Olmo, who flashed wide as Spain rued yet another miss.\nEngland, who had shown plenty of promise down the wings, made the visitors pay with an incisive counter-attacking goal after winning the ball back deep in their own half.\nGordon was involved early in the move and surged forward, collecting Jude Bellingham’s pass to steer the ball decisively past goalkeeper Unai Simon.\nAnd, with the atmosphere now totally changed, England were in front when Kane rose to head home.\nTuchel’s men started the second half brightly and had a chance to extend their lead from the spot when they were awarded a penalty for a Rodri foul on Bellingham following a VAR check.\nBut Kane crashed his shot against the bar, and England paid the price when Baena steered home on the hour mark after O’Reilly had given the ball away to Olmo.\nWorse was to come for the home side when Baena turned provider for Oyarzabal, who dinked the ball over Trafford.", "translation_ja": "", "vocab": []}, {"title_ja": "Helicopter crash near Canadian city of Montreal leaves 4 dead, police say", "title_en": "Helicopter crash near Canadian city of Montreal leaves 4 dead, police say", "summary_ja": "The spokesperson said the helicopter seems to have been a private aircraft", "summary_en": "The spokesperson said the helicopter seems to have been a private aircraft", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/helicopter-crash-near-canadian-city-of-montreal-death-toll/article71514203.ece", "state_media": false, "category": "社会", "full_text": "A helicopter crashed on Saturday (September 26, 2026) southeast of the Canadian city of Montreal, killing all four people on board, police said.\nAudrey-Anne Bilodeau, a spokesperson for Sûreté du Québec provincial police, said the helicopter reportedly experienced difficulties before crashing around 2.30 pm in the municipality of Sainte-Brigide-d'Iberville, which is roughly 50 kilometres (31 miles) southeast of Montreal.\nFirefighters managed to extinguish the blaze within an hour of the crash, but the four occupants were pronounced dead at the scene, Ms. Bilodeau said.\nThe provincial police have not yet identified the victims or the cause of the crash.\nThe spokesperson said the helicopter seems to have been a private aircraft.\nThe Transportation Safety Board of Canada has sent investigators to the crash site.\nPublished - September 27, 2026 03:37 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "Trump rejects Iran proposal for deal to reopen Hormuz", "title_en": "Trump rejects Iran proposal for deal to reopen Hormuz", "summary_ja": "\"They want to make a deal where they open the Strait immediately because they're losing so badly. They want to make a deal and I think that's fine. I like making a deal too,\" the U.S. President said.", "summary_en": "\"They want to make a deal where they open the Strait immediately because they're losing so badly. They want to make a deal and I think that's fine. I like making a deal too,\" the U.S. President said.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-rejects-iran-proposal-for-deal-to-reopen-hormuz/article71514089.ece", "state_media": false, "category": "政治", "full_text": "U.S. President Donald Trump on Saturday (September 26, 2026) rejected a truce deal proposed by Iran that Tehran said could have reopened the Strait of Hormuz to shipping within a week.\nThe waterway is key to the world's energy supply and is now central to the conflict between the US and Iran, which is at a stalemate after nearly seven months.\n\"I reject their proposal,\" Mr. Trump told reporters outside the White House. \"They made a proposal but I've rejected it.\"\n\"They want to make a deal where they open the Strait immediately because they're losing so badly. They want to make a deal and I think that's fine. I like making a deal too.\"\nIran's President Masoud Pezeshkian, who was on his way back to Tehran after attending the UN General Assembly in New York, told CBS News the proposal had been developed \"in coordination\" with supreme leader Mojtaba Khamenei, according to an excerpt from the video interview shared by Iranian media.\nIran's plan calls for a cessation of all hostilities in West Asia, including in Lebanon, according to Foreign Minister Abbas Araghchi, who met earlier in the week with Trump's envoy Steve Witkoff.\nHe said the conditions were the same as those laid out in a memorandum of understanding signed with the U.S. earlier this year, which called for the release of frozen Iranian assets, the lifting of sanctions on Iranian oil and an end to the U.S. naval blockade.\nOn the seventh day of the truce, Iran would reopen Hormuz, Mr. Pezeshkian told CBS that the \"process will begin from the very day they accept it\".\nAt the UN, Saudi Arabia's Foreign Minister Faisal bin Farhan complained that the \"international community has been absent\" and failing to live up to the responsibility to keep the Strait of Hormuz and the Bab al-Mandab open.\n\"The kingdom rejects any party's use of these vital passages as a tool for pressure, threat, or harm to the interests of states,\" he said, stressing the waterways' importance to global energy security.\nHis Russian counterpart, Sergei Lavrov, told member states that \"Russia, together with other responsible states, stands ready to constructively contribute to stabilizing this strategically important region.\"\nIn New York, Mr. Pezeshkian met with UN Secretary-General Antonio Guterres, according to his office, and said: \"Iran has not walked away from the negotiating table but, given past experiences, it no longer trusts the United States.\"\nMr. Araghchi said at the UN: \"Iran has conveyed to the United States, through Qatar, a concrete seven-day plan. If the necessary conditions are met, the strait can be reopened, and normal maritime passage restored within seven days.\"\n\"The choice now rests with the United States. Iran does not accept coercion, threats or intimidation, and Iran will not surrender its sovereign rights under pressure,\" he added.\nHowever, within hours of his comments, The Wall Street Journal reported that Mr. Trump was sceptical that Tehran would meet his demands and expects to renew the U.S. bombing campaign.\nMr. Trump also posted an image to his Truth Social platform of a map showing the Strait of Hormuz circled and labelled \"Trump Strait\".\nHossein Mohebi, a spokesman for Iran's Revolutionary Guards, was quoted by Tasnim news agency as saying: \"We will not cease punishing the U.S. until Iran's seven conditions are met.\"\nHostilities in Yemen\nMr. Mohebi had told AFP in an exclusive interview on Tuesday (September 22, 2026) that ending hostilities in Yemen was also among Tehran's demands.\nWashington and Tehran signed a memorandum of understanding in June that aimed to end the war, to reopen the strait and to launch talks on Iran's nuclear programme.\nBut the deal broke down shortly afterwards when Iran fired on commercial ships in Hormuz that it accused of deviating from its approved route through the waterway.\nIran requires ships to obtain authorisation before passage, citing security and sovereignty reasons.\nShips that refuse to comply are regularly targeted, while the United States sporadically bombs Iranian coastal areas in retaliation.\nPublished - September 27, 2026 01:26 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "At UNGA, Jaishankar hits back at Pakistan PM on terrorism, Indus Waters Treaty", "title_en": "At UNGA, Jaishankar hits back at Pakistan PM on terrorism, Indus Waters Treaty", "summary_ja": "EAM Jaishankar told world leaders that a persistent threat to peace has been the scourge of terrorism.", "summary_en": "EAM Jaishankar told world leaders that a persistent threat to peace has been the scourge of terrorism.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/arguments-by-serial-practitioner-of-terrorism-will-not-stand-eam-jaishankar-slams-pakistan-at-unga/article71514019.ece", "state_media": false, "category": "政治", "full_text": "Delivering India’s National Statement at the United Nations General Assembly (UNGA), External Affairs Minister S. Jaishankar on Saturday said the country would exercise its right to defend itself against terrorism. He also highlighted the impact of ongoing conflicts on the Global South.\nIn a response from the podium to Pakistan Prime Minister Shehbaz Sharif’s speech on Friday, where he had criticised India for launching Operation Sindoor last year, Mr. Jaishankar said that there could be “no dilution” of the world’s zero-tolerance approach to terrorism.\n“Yesterday, a serial practitioner of terrorism misrepresented facts before this Assembly. Arguments were invoked to normalise terrorism and claim immunity from its consequences,” said Mr. Jaishankar, attacking Mr. Sharif’s speech, in which the Pakistan PM had called Kashmir Pakistan’s “jugular vein” and accused India of human rights violations in the region. Mr. Sharif had also claimed that the BJP government in India unleashed a “reign of terror” against minorities in the country.\nMr. Jaishankar said, “Our right to defend ourselves against terrorism will be exercised.” He added that governments indulging in state-sponsored terrorism with a “cross-border purpose” must be held to account.\nMr. Jaishankar also responded to Mr. Sharif’s statement that India is “weaponising water” by holding the Indus Waters Treaty in abeyance. “Friendship and goodwill cannot co-exist with terrorism. Understandings premised on that will naturally be called into question,” Mr. Jaishankar said in his speech.\nEarlier in the day, Indian and Pakistani diplomats also exchanged sharp words as India exercised its right to reply to the Pakistan PM’s speech.\nOn global conflicts\nBriefing the UNGA regarding India’s position on global conflicts, including the wars in Ukraine and West Asia, Mr. Jaishankar said that countries far from the conflicts were being “penalised for no fault of theirs”, referring to the impact on the “Four Fs” of Food, Fuel, Fertilizers and Finance.\n“Those most impacted often have the least say. This Assembly must face up to the true state of affairs,” he added, also referring to the attacks on seafarers in both conflicts, in which 18 Indians have been amongst those killed.\n“This is completely unacceptable. India has joined Liberia and 23 other partners in an initiative to rally global public opinion against such unwarranted targeting,” he said.\nSpeaking about Israel’s war in Gaza, Mr. Jaishankar said that India believes peace requires a two-state solution and that New Delhi is continuing with its humanitarian efforts and providing relief supplies to Palestinians.\nMultipolar world\nMr. Jaishankar, who spoke on the fifth day of the General Assembly, said that a multi-polar world was on its way, and that the post-1945 order would have to give way to “new realities”. He called for “an intrinsically diverse world with a more democratic future”.\nHe also made a pitch for reformed multilateralism, a reference to expanding the UN Security Council to become more representative.\nIt was for the fifth time that Mr. Jaishankar delivered India’s National Statement, with Prime Minister Narendra Modi deciding to skip the UNGA this year. In the past 12 years, Mr. Modi has travelled to New York to deliver India’s National Statement thrice, in 2014, 2019 and 2021, while also delivering the statement in 2020 virtually in the midst of the COVID-19 pandemic.\nPublished - September 26, 2026 11:50 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "The end of the Harold Ballard curse? Home of controversial ex-Maple Leafs owner is demolished in Etobicoke - thestar.com", "title_en": "The end of the Harold Ballard curse? Home of controversial ex-Maple Leafs owner is demolished in Etobicoke - thestar.com", "summary_ja": "The end of the Harold Ballard curse? Home of controversial ex-Maple Leafs owner is demolished in Etobicoke thestar.com", "summary_en": "The end of the Harold Ballard curse? Home of controversial ex-Maple Leafs owner is demolished in Etobicoke thestar.com", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilwJBVV95cUxNRjhKYVpHcF9rMkd5QU12NlBKdzhCRXFCYWwtN3ZXcEJMT2tnYWhXelZaUG12WlI5NEVHVTN6YVp3NkQ4SVVENC1qbTRJblFpTFVNVExjYURKTFN4NDk1Z1JDcl9objVfckdZTnhRQWkwWVNNeWZKSnhVMFRzS3A3eU5pYUlUVlFId1RsbzNxLXB0bFFnZlVrQmtleTI5b3lnSjlkaUEtTWVMSkk5ZGktMThPMG9ZeG9tc1VwMjlzMW1JWUJ3MUxtTUo3dzRkaTRQejVlNHRWWW5XbkhmWklaaU12dkdUaWVhN
