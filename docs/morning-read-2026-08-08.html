ther conditions including removal of naval blockades and release of frozen assets. Despite progress in talks, disagreements persist over shipping fees and full reopening conditions.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c934j5y2lq9o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Hormuz talks positive, Oman says, as Iran warns deal would not open strait\n- Published\nOman has said positive talks have been taking place with Iran over an agreement to secure a shipping route through the Strait of Hormuz, as Tehran warned that any deal would not see an immediate reopening of the vital waterway.\nBoth sides suggested on Saturday that discussions were progressing, but a timeline on any deal being finalised remained unclear. Oman's foreign ministry warned against attacks on shipping that could hamper that.\nIranian Foreign Minister Abbas Araghchi said talks were in their final stages but the reopening of the strait remained \"subject to other conditions\".\nTehran has effectively blockaded the waterway, through which around a fifth of the world's oil and natural gas usually flows, since the US and Israel began attacking it in February.\nTalks in recent days have focused on the possibility of a deal between Iran and Oman on a new route through the strait, which they would both have responsibility for and is hoped would lead to progress in resuming shipping traffic.\nBut Araghchi said a full reopening of the typically busy maritime route depended on other conditions being met, of which he provided a cursory appraisal.\nHe said the conditions included Iran receiving compensation from the US for what Tehran described as violations of the deal both sides signed in June to cease fighting and advance talks to end the war.\nThat deal - called a Memorandum of Understanding (MoU) - quickly fell through, as did diplomatic talks, with tit-for-tat attacks resuming just days after it was signed.\nSeparately, Mohammad Baqer Zolqadr, Iran's security chief, told the semi-official news agency Tasnim that the Strait of Hormuz would not reopen until the US \"corrects\" its behaviour.\nHe said the US needed to meet six Iranian demands, including a halt to threats against Iran, removal of its naval blockade of Iranian ports and release of Iran's frozen assets.\nAnother blockade, on Saudi Arabia's ports in the Red Sea, had been imposed by Yemen's Iran-backed Houthis since 20 July.\nEarlier this week, US President Donald Trump said a deal with Iran \"could be soon\", but Vice-President JD Vance appeared to be more sceptical on Saturday, telling Fox News that work remained to be done even if progress was being made.\n\"We're really in the middle of the game here,\" he said. \"This thing is not over.\"\nVance added that \"we're applying a whole host of tools - diplomatic, economic [and] military tools - to ensure that we get the best outcome for the American people\".\nAdditionally, he claimed that the \"same amount of oil\" will emerge from the Gulf as did before the US military operation began on 28 February, although he offered no details.\n\"What we're really working through now is how you can actually set up a traffic scheme so that the ships can pass through safely,\" he added.\nOne of the main points of disagreement between Tehran and Washington has been Iran's reported threat to impose a fee on vessels wishing to cross the strait.\nReuters - citing an Iranian official - previously reported that Tehran was seeking fees of between 5% and 7% of the price of cargoes from vessels who travel through it.\nVance downplayed those reports, saying: \"The Iranians have told us they have no plans to toll the Strait of Hormuz.\"\nOman's warning against attacks on ships in the strait came as the United Arab Emirates (UAE) said on Saturday that Iran had targeted a tanker affiliated with Adnoc, its state-owned oil company, as it passed through.\nThe UAE's foreign ministry said in a y": "社会", "full_text": "Trump's ex-lawyer Todd Blanche narrowly confirmed as US attorney general\n- Published\nUS President Donald Trump's former personal lawyer Todd Blanche has been narrowly confirmed as attorney general - the nation's top law enforcement official.\nThe vote brings to an end a lengthy standoff between Senate Republicans and the Trump administration over Blanche, who has served as acting attorney general since April.\nBlanche won confirmation in a 50-49 vote overnight, with two Republican senators, Susan Collins and Lisa Murkowski, joining all Democrats to oppose his nomination.\nSenator Bill Cassidy cast the deciding vote, a decision closely watched in Washington given the years of acrimony between the Louisiana Republican and Trump.\nAfter the vote, Blanche said he was \"deeply honoured by the trust and confidence President Trump has placed in me\".\nSome Republican senators had raised concerns about Blache's handling of the release of Jeffrey Epstein-related documents and his role in establishing Trump's $1.8bn (£1.3bn) \"anti-weaponisation\" fund.\nThe fund was planned to provide compensation to individuals who alleged government persecution but critics including Murkowski feared it would go to individuals who were prosecuted for participating in the 6 January attack on Congress in 2021.\nBlanche eventually pledged to walk back the fund after blowback from Republican senators during his confirmation hearings.\nIt remains unclear whether the commitment is legally binding or whether Trump could later persuade Blanche, his former personal attorney, to revive a similar scheme under another name.\nThe issues surrounding Blanche meant Senators Collins and Murkowski held off from backing Blanche, with the latter citing her lack of confidence in Blanche to \"check the worst impulses of this administration\".\nMurkowski announced on Friday she would oppose Blanche, citing concerns over the \"politicisation\" of the justice department.\nCollins also raised concerns about Blanche's role in settling Trump's $10bn lawsuit with the Internal Revenue Service (IRS), but said he ultimately trusted Blanche to give the president candid legal advice.\nBefore casting the deciding vote, Cassidy announced that he believed Blanche was the best option the president would put forward.\n\"This is not a referendum on President Trump, it is a decision regarding Mr Blanche, in very specific circumstances,\" said Cassidy on Friday. \"All considered, I will vote for Mr Blanche.\"\nCassidy acknowledged Trump is the ultimate decider on the direction of the justice department, but that Senate confirmation would give Blanche \"greater leverage to push for things that should be pushed for.\"\nDuring Trump's second impeachment in 2021, Cassidy voted to convict Trump over the 6 January 2021 Capitol riot. The vote did not pass, and when Trump returned to office, he successfully forced Cassidy into retirement by backing a primary challenger for his Louisiana Senate seat earlier this year.\nIn a post on X, Senate Democratic leader Chuck Schumer expressed concern that Blanche's appointment would be an \"excuse on a silver platter to keep up his pervasive, breathtaking corruption\".\n\"Todd Blanche has no intention of stopping Trump's corruption. He advanced his career enabling it,\" he wrote. \"Every senator who voted to confirm him has now branded themselves as an enabler, too.\"\nBut most Republicans swiftly celebrated the victory.\nIowa Republican Senator Chuck Grassley - chairman of the Senate Judiciary Committee - wrote on X that Blanche had shown \"extraordinary patience, compassion [and] tenacity\" throughout the appointment process.\n\"There's no doubt he's qualified,\" Grassley wrote.\nBlanche was already deputy attorney general when he took up the interim leadership role in April, after Pam Bondi was fired.", "translation_ja": "", "vocab": [{"word": "acrimony", "definition": "激しい対立や憎悪を伴う状態。長年の苦い感情や敵意を指す。"}, {"word": "weaponisation", "definition": "何かを武器として使用すること、または政治的な目的で利用すること。ここでは政府権力の不正使用を指す。"}, {"word": "politicisation", "definition": "本来は非政治的であるべき機関や問題を政治的な目的で利用されること。"}, {"word": "candid", "definition": "率直で正直な、ぶっきらぼうな意見や助言。隠さない、偽りのない状態。"}, {"word": "blowback", "definition": "ある行動や政策に対する予期しない悪い反応や強い反発。"}, {"word": "leverage", "definition": "影響力や交渉力を使って他者を説得したり、行動させたりする力。"}, {"word": "impeachment", "definition": "公職者の職務怠慢や犯罪を理由に弾劾すること。米国では大統領の弾劾を指すことが多い。"}]}, {"title_ja": "米国、コロンビアの新右派大統領就任初日に10億ドルを約束", "title_en": "US Pledges $1bn to Colombia's New Right-Wing President on Inauguration Day", "summary_ja": "米国はコロンビアの右派ポピュリスト大統領アベラルド・デ・ラ・エスプリエラの就任直後、治安対策として10億ドルの支援を約束しました。トランプ大統領を支持するデ・ラ・エスプリエラ氏は、前任者の交渉中心のアプローチとは対照的に、麻薬カルテルに対する強硬政策を実施する予定です。この動きは、トランプ大統領の第2期における中南米の右派指導者との関係強化を反映しています。", "summary_en": "The US has committed $1 billion in security aid to Colombia following the inauguration of right-wing populist president Abelardo de la Espriella, who promised an 'all-out war' on drug cartels. De la Espriella, an admirer of Donald Trump, plans to adopt hardline policies contrasting sharply with his predecessor's negotiation-focused approach. The move reflects Trump's strengthened engagement with Latin American right-wing leaders during his second term.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy9wy3y0e5wo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "US offers $1bn to Colombia on new right-wing president's first day of office\n- Published\nThe US has pledged $1bn (£740m) to Colombia hours after the country's new right-wing populist president was sworn in.\nAbelardo de la Espriella, an admirer of Donald Trump who echoed many of the US president's policies on the campaign trail, used his maiden speech to promise an \"all-out war\" on drug cartels.\nThe US state department said the \"security package\" would help him achieve \"our shared goals\", which include fighting organised crime and illegal immigration. Trump repeatedly criticised de la Espriella's left-wing predecessor over his approach to both.\nThe inauguration is the latest in a wider trend of Latin American nations shifting rightwards on a backdrop of economic hardship and concerns about gang violence.\nTrump has taken a greater interest in Latin America during his second term, courting politically aligned leaders and spurning those with whom he disagrees.\nBefore the election, Trump said de la Espriella had the \"total support and strength of the United States behind him\", predicting a \"much better relationship\" with Colombia after he was elected in June.\nA lawyer and businessman by trade, de la Espriella has cast himself as maverick outsider, vowing to combat crime with an \"iron fist\".\nIn a fiery first official speech - addressing troops at a nearby military base - de la Espriella pledged to crush armed insurgents, rebuild Colombia and defend democracy \"by reason or by force\".\nHe said in \"the age of the Tiger\" - a reference to his self-styled nickname - the state would be forceful and decisive against crime, adding: \"There will not be a single place in our territory where criminals can feel safe.\"\nComparisons have been drawn between de la Espriella's plans and similar crackdowns by similar right-wing populists Nayib Bukele and Daniel Noboa in El Salvador and Ecuador, respectively.\nThis is in stark contrast to his predecessor, Gustavo Petro, who pursued what he called a \"total peace\" strategy to the country's internal armed conflict between guerrilla groups, the state and cartels, which prioritised negotiation and incentivising farmers to stop planting coca.\nCritics say the method failed. Membership of armed groups has expanded in recent years, and a brutal conflict between rival rebel groups along the Colombia-Venezuela border displaced tens of thousands of people last year.\nColombia - and Petro's policies - have been among targets Trump has repeatedly blamed for the flow of drugs and illegal migrants into the US.\nPetro, for his part, was highly critical of Trump's influence on the region, as well as his administration's seizure of Venezuela's socialist President Nicolás Maduro and his wife, Cilia Flores, to stand trial on drug charges in the US, clearing the way for US firms to tap Venezuela's oil reserves.\nPetro, who could not stand for another term, and Iván Cepeda, the left-wing candidate he backed, had insisted Colombia should not become another \"vassal\" of the US.\nIn one of his first acts as president, de la Espriella said Colombia would join the \"Shield of the Americas\" security partnership founded by Trump.\nThe US state department welcomed the move, saying de la Espriella's \"pro-growth agenda\" had created an opportunity to \"increase trade and deepen economic ties between our countries\".\nIt also brings Colombia into league with other right-wing governments that have sought closer ties to the Trump administration, such as Argentina, whose libertarian President Javier Milei de le Espriella has said he admired.\nArgentina was the recipient of a $20bn US Treasury bailout, while Trump has said he would feel \"a lot differently\" about supporting the country if Milei was replaced by a left-wing president.\nIn contrast, Trump has repeatedly threatened to give Cuba's Communist government similar treatment to Maduro's in Venezuela.\nDe la Espriella's ascension - along with that of Keiko Fujimori in Peru - means that Brazil's Luiz Inácio Lula da Silva now has fewer political allies in the region as the number of left-wing leaders dwindles.\nHowever, he will face Flávio Bolsonaro, the son of jailed former President Jair Bolsonaro - a far-right populist friendly with the US president - in October.\nDe la Espriella has also promised a strong military alliance with the US and Israel, in stark contrast to Petro, who cut ties with the Israeli government over its offensive in Gaza and was a vocal advocate for the Palestinian cause.\nWho is Abelardo de la Espriella?\nHe calls himself \"El Tigre\" - the tiger.\nA media-savvy lawyer and millionaire businessman, he cast himself as an \"outsider\" who refused to govern with \"the usual suspects\" - a reference to Colombia's pre-Petro political elite.\nThe hardliner chose to take the oath of office not in Colombia's capital, Bogotá, but in the western city of Cali - signalling his desire to cast himself as apart from the centralised politics of the past.\nBefore entering politics, he had a ", "translation_ja": "", "vocab": [{"word": "populist", "definition": "大衆の支持を得るために、既得権益層や既成政治に対抗する政治家や政治運動のこと。人気取りや大衆迎合的な政治姿勢を指します。"}, {"word": "insurgent", "definition": "政府や権力に対して武装反乱を起こす反政府勢力のこと。叛乱者や反乱軍を意味します。"}, {"word": "crackdown", "definition": "違法行為や反政府活動に対して厳しく取り締まること。政府による強硬な弾圧を指します。"}, {"word": "vassal", "definition": "中世ヨーロッパの従属関係を指す言葉で、現代では政治的・経済的に大国に支配される国や従属国を意味します。"}, {"word": "libertarian", "definition": "個人の自由と市場経済を重視し、政府の介入を最小限にすべきという政治的立場。小さな政府を主張する思想家や政治家を指します。"}, {"word": "ascension", "definition": "地位や権力への昇進、特に高い権力を持つ立場への就任のこと。政治的な地位の獲得を指します。"}]}, {"title_ja": "警察の失態を批判、シモン・レヴィ容疑者の被害者に通報を呼びかけ", "title_en": "Police Face Scrutiny Over Simon Levy Failures as Victims Urged to Come Forward", "summary_ja": "ロンドンの被害者委員は、監視下にあった有罪判決を受けた性犯罪者シモン・レヴィが2人の女性を殺害し、1人を強姦することを可能にした警察の「一連の失態」を非難した。メトロポリタン警察、英国交通警察、検察庁を含む複数の機関が、2021年の有罪判決から2025年の逮捕までレヴィの監視方法の失態を認めている。当局は追加の被害者に通報を呼びかけており、事件に関わった警察官の調査が進行中である。", "summary_en": "London's victims' commissioner has condemned a 'litany of failures' by police that allowed convicted sex offender Simon Levy to murder two women and rape a third while under monitoring. Multiple agencies including the Met Police, British Transport Police, and Crown Prosecution Service have admitted failings in how Levy was supervised between his 2021 conviction and 2025 arrest. Authorities are urging additional victims to come forward, with investigations underway into officers involved in the case.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cewr8egkelwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Simon Levy victims urged to come forward as police accused of 'litany of failures'\n- Published\nPolice have urged more victims of Simon Levy to come forward, as London's victims' commissioner said a \"litany of failures\" had allowed him to kill two women and rape a third.\nAndrea Simon called for a review on the \"failure to monitor him appropriately\" when the 40-year-old was known to police as a sexual predator.\nBritish Transport Police said women who recognised Levy as their attacker should report it, while the Met Police said it had investigated whether he had more victims, including further murders.\nMeanwhile, the Independent Office of Police Conduct (IOPC) said a police constable is under investigation for gross misconduct, and a detective sergeant is facing a misconduct investigation.\nOn Friday, Levy was found guilty of murdering two women and raping a third in London while he was being monitored by the Met Police for being a convicted sex offender. He had previously committed a string of sex attacks.\nThe BBC reported how a series of grave failings by police, prosecutors and the courts left Levy free to murder, rape and sexually assault women.\nLevy is due to be sentenced on Wednesday.\nThe Met, British Transport Police (BTP) and Crown Prosecution Service (CPS) have all admitted failures in how Levy was monitored between his first conviction in September 2021 on sexual assault charges and his arrest for murder in September 2025.\nOn Saturday, Simons told BBC Breakfast a \"multi-agency review\" was needed, saying: \"There was a lack of restrictions that could have been placed on him and a failure to monitor him appropriately - so all of those things, I think, we need answers to now.\"\nSimons said public services \"have to get better at recognising patterns of offending\" before attackers become \"emboldened\".\nThe Met said its detectives had \"exhausted numerous lines of enquiry - including working with coroners – to identify whether Levy is responsible for any similar, unsolved incidents, including deaths\".\nNo further victims have been identified so far but the force urged \"anyone who believes they may be a victim of his to contact police\".\nLevy is known to have attacked at least 10 women on public transport in London, seeking out busy carriages to assault passengers.\nBTP said more women \"may recognise [Levy] and have not yet reported what has happened to them\".\nLevy was on bail and being monitored by police when he committed a violent rape in January 2025.\nHe went on to kill Carmenza Valencia-Trujillo, 53, in March of that year and Sheryl Wilkins, 39, five months later.\nEarlier this year he was found guilty by a jury at Inner London Crown Court of groping 10 women on the Tube and an 11th while in prison, but details of that case could only be reported this week at the conclusion of his murder trial.\nThe offence in the prison took place on April 2022. The Tube assaults then occurred between 24 October 2023 and May 2025.\nHe had already been convicted of sexually assaulting two women in 2018, which he was jailed for in 2021.\nBTP has confirmed two officers have been moved to other roles due to \"incompetence\" in handling investigations into Levy's transport assaults.\nLisa Ramsarran, chief crown prosecutor for the CPS, said: \"Our actions fell short of the standards that victims, families and the public are entitled to expect.\"\nLisa Squire, whose daughter Libby was murdered by a man who had previously committed a string of sex crimes, told the BBC that a \"catalogue of disasters\" had led to Levy's murders.\nShe told BBC Radio 4's Today programme \"the patterns were there, he was flying those red flags\", and said there were \"precursor offences\" for which he could have stopped by police.\n\"At the moment, the message going out, in my opinion, is that women's safety is not important,\" she continued.\nZoë Billingham, a former independent police inspector who pushed for reforms on how violence against women in girls is policed, said that \"too often in cases like this the dots aren't being joined up\".\nShe added: \"It's not one or two missed opportunities that could have brought him to justice, that could have had him locked up and behind bars and no longer a threat to women and girls. It was an extraordinary succession.\"\n  - Published12 hours ago\n  - Published1 day ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "litany", "definition": "長い悪いことの連続リスト。ここでは警察の失態が次々と続いていることを強調する表現。"}, {"word": "predator", "definition": "獲物を狩る動物のように人間を害する者。特に性犯罪者などの危険な人物を指す。"}, {"word": "gross misconduct", "definition": "深刻な職務違反。公務員や警察官が職務を著しく怠った場合に適用される。"}, {"word": "exhausted", "definition": "可能なすべてを試し尽くした。ここでは警察が徹底的に調査を行ったことを意味する。"}, {"word": "emboldened", "definition": "勇気づけられた、大胆になった。犯罪者が罰を受けないことで更に悪質な犯行に走ること。"}, {"word": "precursor", "definition": "前兆、先触れ。より重大な犯罪に先立つ小さな警告信号や初期兆候。"}]}, {"title_ja": "ウィデコム殺人事件に関連するファラージ自宅事件の捜査を再開", "title_en": "Police Reopen Farage Home Incident Inquiry Linked to Widdecombe Murder", "summary_ja": "テロ対策警察は、元下院議員アン・ウィデコムの殺人事件に関連して、ナイジェル・ファラージの南ロンドンの自宅での事件調査を再開した。この事件は2025年4月にファラージが説明した「点火した焼夷装置」が郵便受けに押し込まれたものである。警察はまた、初期捜査の対応方法に関して独立した監視機関に自らを付託した。", "summary_en": "Counter-terrorism police have reopened an investigation into an incident at Nigel Farage's south London home in connection with the murder of former MP Ann Widdecombe. The incident involved what Farage described as a lit incendiary device pushed through his letterbox in April 2025. Police have also referred themselves to the independent watchdog over how the initial investigation was handled.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c62qrvd9303o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Widdecombe police reopen investigation into incident at Farage's home, BBC understands\n- Published\nCounter-terrorism police investigating the killing of Ann Widdecombe have reopened an inquiry into an incident at Nigel Farage's south London home, the BBC understands.\nIt is understood to relate to what the Reform UK leader described as a \"lit incendiary device\" being pushed through his letterbox in April 2025.\nCounter Terrorism Policing (CTP) London said it was looking into an \"attempted burglary\" at a property as part of the Widdecombe murder investigation, but did not confirm the home was linked to Farage or why it might be connected to the killing of the former MP.\nCTP London has also referred itself to the police watchdog over how the initial investigation into the Farage incident was handled.\nPolice said at the time that \"damage was caused to a door but nothing was stolen\".\nBoth CTP London and the Metropolitan Police were involved in enquiries. No arrests were made and the investigation was closed.\nBut on Friday, CTP London said a new line of inquiry had been identified that was not \"pursued by them at the time\".\nThe Independent Office for Police Conduct (IOPC) said it had \"decided to independently investigate the conduct of a Counter Terrorism Policing London staff member following a referral received earlier [on Friday]\".\nA statement continued: \"The conduct relates to an allegation the individual failed to identify and pursue a line of enquiry relating to an attempted burglary reported in April 2025.\"\nCTP London said it would \"full engage\" with the watchdog's investigation, adding: \"The victims and families in both investigations have been updated today, and we continue to support them.\"\nAnn Widdecombe, the 78-year-old former Conservative minister and Reform UK spokeswoman, was found dead at her home in Devon last month with serious injuries.\nJoshua Kerry, from Rotherham in South Yorkshire, was later charged with her murder.\nKerry was initially arrested on suspicion of murder on 11 July, before being additionally arrested on 13 July on suspicion of the commission, preparation or instigation of acts of terrorism.\nWiddecombe had served as Tory MP for Maidstone in Kent for 23 years and was appointed to ministerial roles in Sir John Major's government in the 1990s.", "translation_ja": "", "vocab": [{"word": "incendiary device", "definition": "放火や爆発を目的とした爆発装置のこと。テロ行為やテロ関連の犯罪で使用される可能性のある危険な物品を指す。"}, {"word": "counter-terrorism", "definition": "テロ行為を防止・阻止する活動や取り組みのこと。政府機関が行う特別な捜査や対策を意味する。"}, {"word": "reopen", "definition": "一度閉じたり終了した案件や調査を再び開始することを意味する。新しい証拠や情報が発見された場合に用いられる。"}, {"word": "watchdog", "definition": "不正や違法行為を監視・監督する独立した機関のこと。政府機関や企業の行動を監視する役割を担う。"}, {"word": "conduct", "definition": "個人や組織の行動や振る舞いのこと。特に調査対象となる個人の職務遂行上の行動や態度を指す。"}, {"word": "referral", "definition": "第三者や上位機関に対する事件や問題の提付や紹介のこと。特に正式な調査や審査に回すことを意味する。"}]}, {"title_ja": "トラベロッジでのナンキンムシ被害により女性が苦しむ", "title_en": "Woman's Travelodge Stay Ruined by Bed Bug Infestation", "summary_ja": "ハンナ・スティーブンソンはケンブリッジのトラベロッジでの宿泊後、深刻なナンキンムシ刺されに苦しみ、約2週間にわたって持続的なかゆみと腫れを経験しました。ホテルの対応に不満を感じた彼女がTikTokで経験を投稿したことで、トラベロッジが対応し、最終的に2,000ポンドの補償を提供しました。この事件は、より暖かい時期における害虫駆除の警戒の重要性を強調しています。", "summary_en": "Hannah Stephenson suffered severe bed bug bites after staying at a Travelodge hotel in Cambridge on 26 July, experiencing persistent itching and swelling that affected her social life for nearly two weeks. After initially feeling ignored by the hotel, she posted about her experience on TikTok, which prompted Travelodge to respond and eventually offer her £2,000 in compensation. The incident highlights the importance of vigilance against pest infestations during warmer months.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cgewxl759r5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Woman attacked by bed bugs during Travelodge stay\n- Published\nThirteen days after Hannah Stephenson stayed a night in a Travelodge hotel, she is still itching with red lumps over her body - a nightmare she would not wish on her \"worst enemy\".\nThe 31-year-old from Bassingbourn had been out with friends in Cambridge and decided to book a one-night stay at the hotel on Newmarket Road on 26 July to save money instead of getting a taxi home.\nThe next morning, she woke up to a \"horrible realisation\", feeling itchy with red lumps over her body and blood spots smeared on the bedding — the tell-tale signs of bed bugs, she said.\nA Travelodge spokesperson said: \"We are deeply sorry for Ms Stephenson's experience and how distressing an incident like this can be.\"\nStephenson said a lovely evening with friends had turned into a horrible morning.\n\"It was just a lovely wholesome time of Cambridge sightseeing and pubs, and now it is tarnished by these bedbug bites,\" she said.\n\"It wasn't until I saw the blood and the bugs that I realised what had happened.\"\nShe said it got worse, spreading to her face and causing swelling to her arms.\n\"It's been difficult. I've had to take a lot of antihistamines, which have made me quite drowsy. I've been waking up in the night itching,\" she said.\n\"I have felt very self-conscious. There are certain social events I haven't gone to, as I was so embarrassed at the way my arms were looking and the way my face looked.\"\nAfter she was left feeling \"ignored\" when she initially complained to the hotel, she posted a series of pictures, external of the red bites on TikTok, which she believes prompted the hotel to get in touch.\n\"I don't think I would be at this point at the moment if I didn't take it to TikTok,\" she said.\nAccording to the British Pest Control Association, external, during the warmer months of the year bedbugs thrive due to being more active, feeding and mating.\nIt said the tell-tale signs of bedbugs include red, irritating bites and small blood smears on bed linen; and small brown insects in or around the sleeping area.\nIf bedbugs are found, it recommends washing everything at a high temperature before putting items in a plastic bag and deep freezing for at least three days.\nStephenson has lived across the world in Asia, Africa and South America and never experienced bedbug bites before.\nShe said: \"I would never expect this in Cambridge of all places. I am just hoping these bites will go as soon as possible and I will look normal and get on with my life.\"\nStephenson has accepted £2,000 in compensation from Travelodge; however, she hopes the company will be more vigilant in the future and that people will have the courage to speak out.\nA spokesperson for Travelodge said: \"The safety of our customers is our priority; and we maintain stringent, expert-led measures to prevent and manage pest issues.\n\"In the rare instance that an issue is reported in one of our hotels, we immediately take affected and surrounding rooms out of service for inspection and treatment by independent pest control experts.\"\nDo you have a story suggestion for Cambridgeshire? Contact us below.\nGet in touch\nYour Voice\nFollow Cambridgeshire news on BBC Sounds, Facebook, external, Instagram, external and X, external.\nRelated topics\nMore stories on bed bugs\n  - Published22 June\n  - Published20 November 2024\n  - Published12 September 2023", "translation_ja": "", "vocab": [{"word": "stringent", "definition": "厳格で厳密な、という意味の形容詞。基準や規制が非常に厳しく、細部まで監視されることを表します。"}, {"word": "vigilant", "definition": "警戒心が強い、油断しない、という意味の形容詞。危険や問題に注意深く対処する姿勢を示します。"}, {"word": "infestation", "definition": "害虫や害獣の大量発生、という意味の名詞。ある場所に有害な生物が多数存在する状態を指します。"}, {"word": "compensation", "definition": "損害賠償、補償金、という意味の名詞。被害や損失に対して提供される金銭的な償いを表します。"}, {"word": "tarnished", "definition": "汚された、台無しにされた、という意味の形容詞。名声や評判が傷つけられた状態を表します。"}, {"word": "self-conscious", "definition": "自意識過剰な、気が気でない、という意味の形容詞。他人の目を気にして自分の外見や行動に不安を感じることを表します。"}]}, {"title_ja": "政治危機の中、コソボのクルティ首相が議会で卵を投げつけられる", "title_en": "Kosovo PM Kurti Egged in Parliament Amid Political Crisis", "summary_ja": "野党議員がコソボ議会でクルティ暫定首相に卵を投げつけたため、議会が中断された。新大統領選出に関する交渉中のこの事件は、クルティ左翼政党が必要な3分の2多数派を獲得できず、合意した候補者がいない状況を浮き彫りにしている。バルカン半島の国は2年以上で3回の選挙を実施しており、継続的な政治的混乱を示している。", "summary_en": "Kosovo's parliament was suspended after an opposition lawmaker threw eggs at caretaker PM Albin Kurti during heated negotiations over electing a new president. Kurti's left-wing party requires a two-thirds majority to elect a president, but negotiations have stalled with no agreed candidate. The incident highlights ongoing political turmoil in the Balkan country, which has held three elections in over two years.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/kosovo-pm-kurti-egged-in-parliament-amid-political-crisis/a-78291171?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Kosovo PM Kurti egged in parliament amid political crisis\nAugust 8, 2026\nKosovo's parliament was suspended on Saturday after an opposition lawmaker threw eggs at caretaker Prime Minister Albin Kurti.\n\"Shame on you!\" Time Kadrijaj of the conservative opposition Alliance for the Future of Kosovo (AAK) party shouted in parliament before hurling eggs at Kurti.\nIn response, Kurti said that he was \"happy to pay this price\" if it was the cost of dialogue.\nKurti's left-wing Vetevendosje (VV) party is known for its own parliamentary disruptions, with party representatives launching tear gas in the chamber in 2018 and also on multiple occasions in 2015.\nWhat is the political situation in Kosovo?\nThe incident comes after days of negotiations as Kurti attempts to gain enough opposition support to elect a new president amid Kosovo's broader political crisis.\nThe Balkan country has held three elections in over two years.\nKurti achieved his parliamentary majority with ethnic minority MPs in a December election that followed an inconclusive vote in February 2025.\nHis VV party's share of the vote fell from 51% to 43% in a snap election in June, but it maintained a parliamentary majority alongside ethnic minority allies.\nHowever, Kurti requires a two-thirds majority in parliament to elect a president.\nThe current negotiations seem to have ground to another stalemate, with neither side having agreed to a candidate.\nA constitutional deadline to elect a speaker of parliament expired on Friday. Opposition lawmakers have threatened legal action over Kurti's request for more time to negotiate.\nKosovo declared independence from Serbia in 2008 after the 1998-99 war, which ended with Serbia's withdrawal following a NATO bombing campaign.\nKosovo has been recognized by over half of the world's countries, including the United States and most European Union countries.\nBelgrade considers Kosovo to be part of Serbia.\nEdited by: Louis Oelofse\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "caretaker", "definition": "一時的に職務を代行する人。通常、正式な後任者が決まるまでの間、責任を持つ立場の人を指します。"}, {"word": "inconclusive", "definition": "明確な結果や決定に至らない。選挙や投票で決定的な結果が出ていない状態を表します。"}, {"word": "stalemate", "definition": "交渉や対立が膠着状態に陥ること。どちらかが譲歩できず、進展がない状況を指します。"}, {"word": "constitutional", "definition": "憲法に関する、または憲法に基づく。法的な根拠となる憲法上の規定に関連することを意味します。"}, {"word": "ethnic minority", "definition": "民族的少数派。国家内で数的に少ない民族グループを指す政治用語です。"}, {"word": "parliamentary majority", "definition": "議会内で過半数の議席を占めること。法案成立などに必要な権力を持つ状態を表します。"}]}, {"title_ja": "プラハプライドパレードに数万人が参加、厳戒態勢で実施", "title_en": "Tens of thousands march in Prague Pride parade with enhanced security", "summary_ja": "チェコの首都プラハで土曜日に数万人がプライドパレードに参加し、1週間続くイベントは「時代は変わっている」というテーマで開催されました。2週間前のベルリンプライドイベントでの車突撃事件を受け、強化されたセキュリティ対策が導入されました。", "summary_en": "Tens of thousands of people participated in Prague Pride on Saturday, with the week-long festival themed \"Times are changing.\" The march included enhanced security measures following a van attack at a Berlin Pride event two weeks earlier that killed one person and injured around 31 others.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/thousands-attend-prague-pride-parade/a-78290467?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Thousands attend Prague Pride parade\nAugust 8, 2026\nTens of thousands of people marched through Czech capital of Prague on Saturday as part of LGBTQ+ Pride celebrations.\nThe festival is to last for a week. The theme of this year's event is \"Times are changing.\"\nAt the start of the parade, participants observed a minute of silence in memory of the victims of a van ramming near the Cristopher Street Day (CSD) parade in Berlin two weeks ago.\nThe July 25 attack killed one person and injured around 31 others.\nThe Saturday march in Prague was accompanied by enhanced security measures, including the deployment of hundreds of police officers and a de-escalation team.\nParticipants were also told to carry banners by hand or to use plastic poles rather than wooden poles.\n\"As every year, the aim of the festival is to raise awareness of LGBT+ issues, to show how this community lives in the Czech Republic and that it is still waiting for equal rights,\" the director of Prague Pride, Kamila Frohlichova, was cited by Germany's DPA news agency as saying.\nWhat else do we know about the Pride march in Prague?\nAccording to police reports, there were no major incidents.\nA group of counter-demonstrators also gathered along part of the march's trajectory.\nThe march began at Wenceslas Square in central Prague around noon (10:00 UTC/GMT) and arrived at Stvanice island in the Vltava River that passes through the city at around 2:30 p.m. local time, according to Czech media.\nA musical program was held once the march reached its terminus and the festivities continued into the night.\nDon't let the algorithm hide the news. Please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "trajectory", "definition": "物体や事象が進む道筋や経路のこと。ここではパレードの通路経路を指しています。"}, {"word": "de-escalation", "definition": "緊張や対立の激化を緩和し、沈静化させることを目的とした行動や戦略のこと。"}, {"word": "counter-demonstrators", "definition": "デモ参加者に対抗する立場から集まった人々のこと。反対派の示威者を指します。"}, {"word": "terminus", "definition": "路線やルートの終点や到着地点のこと。ここではパレードの終了地点を意味します。"}, {"word": "ramming", "definition": "何かを意図的に激しくぶつけることで、車を群衆に突っ込ませる攻撃を指します。"}]}, {"title_ja": "米上院、トランプ側近トッド・ブランシュを司法長官に承認", "title_en": "US Senate Narrowly Confirms Trump Loyalist Todd Blanche as Attorney General", "summary_ja": "米上院は50対49の僅差でトッド・ブランシュを司法長官に承認し、共和党議員ビル・キャシディが決定票を投じた。民主党のダーク・ダービン議員を含む批評家らは、ブランシュがトランプの独立した法務担当者ではなく個人弁護士として機能するのではないかと懸念を表明した。", "summary_en": "The US Senate voted 50-49 to confirm Todd Blanche as attorney general, with Republican Bill Cassidy providing the decisive vote after two GOP senators joined Democrats in opposition. Critics, including Democratic Senator Dick Durbin, expressed concern that Blanche would serve as Trump's personal lawyer rather than an independent attorney general committed to the rule of law.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-senate-confirms-trump-loyalist-todd-blanche-as-new-ag/a-78289397?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US Senate confirms Trump loyalist Todd Blanche as new AG\nAugust 8, 2026\nThe US Senate has narrowly approved President Donald Trump's nominee for the job of attorney general, making Todd Blanche the nation's top law enforcement officer in an early morning vote on Saturday.\nThe Republican-controlled body delivered a 50-49 vote to confirm the controversial Trump loyalist.\nLouisiana Republican Bill Cassidy was the last-minute convert this time, supplying the crucial deciding vote after his colleagues Lisa Murkowski of Alaska and Susan Collins of Maine jumped ship to join the chamber's Democrats in voting against Blanche's appointment.\nIn explaining her opposition, Murkowski said the country was in need of an attorney general \"who will check the worst impulses of this administration.\"\nOn the Senate floor, Cassidy outlined his own conversion, saying he believed Blanche's relationship with Trump would make him effective at pushing back against Trump's demands.\nBlanche, a former federal prosecutor who was Trump's personal defense lawyer and had been serving as acting attorney general since April, wrote on X, \"I am deeply honored by the trust and confidence President Trump has placed in me to lead the Department of Justice as our great nation's 88th attorney general.\"\nSenators question whether Blanche will be nation's lawyer, or Trump's\nThere is great concern that Trump sees Blanche as \"his lawyer,\" something that he has often openly expressed the need for in the position of attorney general, which is supposed to be independent.\n\"The attorney general is supposed to be the people's lawyer,\" Illinois Democratic Senator Dick Durbin said during a Senate Judiciary Committee hearing on Tuesday.\n\"Mr. Blanche,\" added Durbin, the Committee's ranking Democrat, \"continues to operate as the president's personal lawyer, treating the Justice Department like a law firm serving one client — the president.\"\nOn Saturday, Durbin said it would be a \"serious mistake\" to give Blanche control at the DOJ, \"If there is ever a moment in history when we need an attorney general above reproach, who is clearly dedicated to ending corruption, even at the highest level of our government, it's right now.\"\nDuring his time in office, Trump has often railed against attorneys general for not being aggressive enough in pursuing his agenda — most often when it is tied to retribution against his political opponents.\nJeff Sessions, Bill Barr and Pam Bondi all fell out of the president's good graces for failing to fully satisfy his legal desires.\nBlanche is seen as a staunch ally who has no qualms doing the president's bidding.\nBlanche won votes by promising to scrap '1776 fund' and Trump tax immunity scheme\nBlanche previously defended Trump against criminal charges over the falsification of business records with the intent of hiding an affair with an adult movie actress, as well as another for the mishandling of classified documents in his attempt to overturn the results of the 2020 presidential election.\nBoth cases were dropped after Trump won reelection in 2024.\nDuring his time at the DOJ, Blanche has handled portions of the case against deceased sex offender and presidential friend Jeffrey Epstein — most prominently overseeing the release of millions of documents tied to the case, as well as the transfer of Epstein associate Ghislaine Maxwell to a more comfortable, minimum-security federal prison in Texas after he personally met with her.\nUnder Blanche and his predecessor Bondi, the DOJ has lost thousands of employees through firing, resignation or voluntary departure.\nBlanche's candidacy was vehemently opposed by Democrats, and even some Republican lawmakers had qualms with his avoidance of forthright answers about a dubious $1.776 billion (€1.5 billion) compensation fund for presidential political allies — including those who stormed the US Capital on January 6, 2021 — accusing the federal government of unfair treatment; and DOJ directives that would see the president, his two eldest sons and the Trump Organization shielded from tax audits and penalties for life.\nTwo retiring Republican senators, John Cornyn (Texas) and Thom Tillis (North Carolina), had loudly proclaimed that they would vote against Blanche's appointment unless the compensation fund was dropped.\nHe assured them that it would be, while also saying that the Trumps' tax immunity would only be applied \"retroactively\" and not to future filings, clearing the way for Saturday's confirmation vote.\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "loyalist", "definition": "政治的指導者や主義を強く支持し、忠実に従う人のこと。この文脈では、トランプ大統領に絶対的な忠誠を誓う者を指す。"}, {"word": "vehemently", "definition": "強い感情や確信を持って激しく表現・反対することを意味する副詞。民主党がブランシュの指名に強く反対したことを表す。"}, {"word": "retroactively", "definition": "過去にさかのぼって適用・遡及することを意味する副詞。この場合、過去の税務申告にのみ適用されることを示す。"}, {"word": "immunity", "definition": "法的責任や処罰から免除される権利や状態。この文脈では、大統領やその家族が税務監査から保護されることを指す。"}, {"word": "mishandling", "definition": "物や情報を不適切に、または不注意に扱うこと。ここではトランプが機密文書を不正に扱ったことを指す。"}, {"word": "dubious", "definition": "疑わしい、信頼できないという意味の形容詞。この基金の正当性や透明性に対する疑念を表現する。"}]}, {"title_ja": "トランプ大統領の4億ドル規模のボールルーム計画が国家安全保障上の優先事項に", "title_en": "Trump's $400M Ballroom Project Deemed National Security Priority", "summary_ja": "トランプ大統領は、建設を差し止める裁判所の判決にもかかわらず、提案されている4億ドルのボールルーム計画を推し進めている。トランプ氏は、このボールルームは国家安全保障上不可欠であると主張している。法的課題が続く中でも、この計画は物議を醸し続けている。", "summary_en": "President Trump continues to push forward with his proposed $400 million ballroom project despite a court ruling blocking its construction. Trump argues that the ballroom is essential for national security purposes. The project remains controversial even as legal challenges persist.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/makes-trumps-ballroom-matter-national-security/story?id=135478473", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報と生中継", "title_en": "ABC News Live: 24/7 Breaking News and Live Events Coverage", "summary_ja": "ABCニュース ライブは、世界中で発生するニュース速報と重要な生中継イベントについて、24時間体制で継続的な報道を提供しています。プラットフォームは、主要なストーリーが展開する際のリアルタイムアップデートと詳細な報告を配信します。", "summary_en": "ABC News Live provides continuous, around-the-clock coverage of breaking news and significant live events happening worldwide. The platform delivers real-time updates and in-depth reporting on major stories as they develop.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ニューヨーク州北部の殺人・放火事件 容疑者の逃亡を追う", "title_en": "Manhunt Underway for Suspect in Upstate New York Homicide and House Fire", "summary_ja": "ニューヨーク州当局は、父親を殺害した後に家に火をつけたと考えられる容疑者の逮捕に向けた捜索を展開している。土曜日に捜査が開始され、法執行機関は逃亡者の発見に全力を注いでいる。この事件は殺人と放火の両方を含む。", "summary_en": "New York authorities are conducting an active manhunt for a suspect believed to have killed his father and then set a house on fire. The investigation began on Saturday as law enforcement intensified efforts to locate the fugitive. The case involves both a homicide and arson in upstate New York.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/manhunt-continues-suspect-accused-killing-father-setting-home/story?id=135484639", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン、移民問題でイタリアへの報復措置として一時的な国境検査を導入", "title_en": "Spain Introduces Reciprocal Border Checks on Italy Over Migration Row", "summary_ja": "スペインは、モロッコからセウタへの大量移民流入を受けてイタリアが実施した措置への対抗措置として、イタリア訪問者への一時的な国境検査を発表した。EU同盟国間の稀な紛争は7月30～31日にスペイン領北アフリカ地域への数万人の越境から生じており、イタリアが検査を実施し、スペインは報復措置を脅迫している。両国は不規則な移民管理をめぐる意見の相違の中で、相互的な国境管理を実施している。", "summary_en": "Spain has announced temporary border checks on Italian visitors in response to Italy's similar measures following a mass migration surge from Morocco into Ceuta. The rare dispute between EU allies stems from tens of thousands crossing into Spain's North African territory on July 30-31, with Italy imposing checks and Spain threatening countermeasures. Both countries are now implementing reciprocal border controls amid disagreements over irregular migration management.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/07/spain-to-introduce-temporary-border-checks-on-visitors-from-italy", "state_media": false, "category": "社会", "full_text": "Spain has announced it will introduce temporary border checks on visitors from Italy in response to Rome imposing similar measures after a mass rush of people from Morocco into Ceuta.\nThe checks, which come “amid the persistent irregular migration pressure” facing Italy, will start at midnight on Saturday and last until 7 September, Spain’s interior ministry said in a statement.\nHours earlier, Spain threatened Italy with countermeasures if it did not swiftly lift its own border checks, drawing a rebuff from Rome.\nThe rare spat between the EU and Nato allies came after tens of thousands of people crossed from Morocco to Spain’s north African territory on 30-31 July in an unprecedented, deadly rush.\nThe scenes infuriated EU members that back a hard line on irregular immigration, including Italy, which imposed border checks on people arriving from Spain for one month.\nThe Spanish government criticised the measure on Friday as “unfair, contrary to the EU’s interests and discriminatory for the Spanish population”.\nForeign minister José Manuel Albares described it as “a torpedo fired at the hull of European unity”.\n“We urge the government of Italy to rectify, put an end to the checks and treat Spaniards like other European citizens,” he added.\nHe threatened “proportional measures” in response by Sunday if Italy failed to comply.\nWithin hours, the government of Italy’s far-right prime minister, Giorgia Meloni, said it “had no intention of revising the decision” before 15 August, when it said Spanish authorities “expected a new wave of migration” to hit Ceuta.\nMeloni’s office said in a statement: “Italy does not accept ultimatums or impositions from abroad regarding national security and border control.\n“Only when there is certainty that there are no security or terrorism risks to Italy, that no new wave is occurring, and that no irregular migrants are heading toward European territory, will the decision be reconsidered.”\nSpain’s interior ministry announced the reciprocal measures within hours.\nSpanish police have been monitoring online rumours and social media about possible fresh arrivals in Ceuta in mid-August, according to local media. But authorities have not expressly said they expect a repeat of last week’s rush.\nBorder authorities would in the meantime “do their utmost to ensure maximum ease of movement for Spanish and European citizens” who are not affected by border checks, the Italian statement added.\nItaly, which does not share a land border with Spain, introduced border controls at maritime and air entry points for third-country nationals arriving from Spain.\nThe move, announced on 31 July, was an “extraordinary measure” intended to “safeguard national security and prevent possible repercussions for our nation”, Meloni said at the time.\nShe was among several EU leaders who called for Spain to be suspended from the visa-free Schengen travel zone after the Ceuta incident, despite such a move being legally impossible.\nItaly’s coalition government has sought to stop the tens of thousands of people who land in small boats on the country’s shores each year.\nThe Spanish government warned against “creating rifts and sterile conflicts driven by internal electoral motives” and said “we trust that pro-European sentiment, common sense and good faith prevail”.\nOf the 72,000 people who entered Ceuta, 70,000 have returned to Morocco, according to official Spanish figures.\nSpanish authorities said 80 people died in the crossings.\nMoroccan rights groups, however, estimate the figure to be higher. The Moroccan Association for Human Rights and the European Coordination for Human Rights in Morocco on Friday said at least 141 deaths were recorded and that the toll was likely to rise.\nMorocco’s interior ministry has said 11 people died on its side of the border, all but one by drowning.\nThose who remain in Ceuta – including hundreds of unaccompanied children – face dire living conditions with little access to food, water and shelter.", "translation_ja": "", "vocab": [{"word": "countermeasures", "definition": "相手方の行動に対抗するための対策や措置のこと。ここではスペインがイタリアの国境検査に対抗する行為を指す。"}, {"word": "reciprocal", "definition": "相互的な、互いに同等の関係を示す形容詞。一方が行った行為に対して、相手方も同じ行為を返すことを意味する。"}, {"word": "proportional", "definition": "比例した、適切な程度の形容詞。状況に見合った相応の対応を指す。"}, {"word": "spat", "definition": "短時間の言い争いや軽い喧嘩を表す名詞。ここでは国家間の一時的な対立を指す。"}, {"word": "surge", "definition": "急激な増加や波状の流入を表す名詞。大量の人や物が一度に押し寄せることを意味する。"}, {"word": "unprecedented", "definition": "かつてないほどの、前例のない形容詞。今まで経験したことのない規模や出来事を描写する。"}, {"word": "infuriated", "definition": "激怒させた、非常に怒らせたという過去分詞形。強い憤りや怒りを引き起こすことを意味する。"}]}, {"title_ja": "裁判官、トランプ政権によるスーダン南部TPS保護廃止を認可", "title_en": "Judge Approves Trump Effort to End South Sudan TPS Protections", "summary_ja": "連邦裁判官は、トランプ政権がスーダン南部国籍者の一時保護地位（TPS）廃止を進めることができると判決を下し、数百人の移民に影響を与えます。この判決は、ハイチとシリア国籍者のTPS廃止を認めた最高裁判所の判決に続くものです。移民支援団体は、スーダン南部の継続的な内戦と人道危機を理由に、この判決を非難しています。", "summary_en": "A federal judge has ruled that the Trump administration can proceed with terminating Temporary Protected Status (TPS) for South Sudanese nationals in the US, affecting hundreds of immigrants. The decision follows a Supreme Court ruling that allowed the removal of TPS for Haitians and Syrians. Immigrant advocacy groups have condemned the ruling, citing South Sudan's ongoing civil war and humanitarian crisis.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/07/judge-trump-south-sudan-tps", "state_media": false, "category": "政治", "full_text": "Temporary protected status (TPS) for hundreds of South Sudanese nationals in the United States is set to end after a federal judge ruled that the Trump administration can move forward with stripping their protections.\nOn Friday, US district judge Patti Saris of the district of Massachusetts rejected an attempt by immigrant rights organizations including the New York-based African Communities Together to keep TPS for South Sudanese nationals living in the US.\nSaris’s decision follows a 6-3 supreme court ruling in June allowing the Trump administration to strip hundreds of thousands of Haitians and Syrians of TPS, which granted them permission to work and live legally in the US.\nThe supreme court’s conservative majority overturned lower court rulings in New York and Washington DC, which had blocked the administration from ending TPS for more than 350,000 Haitians and about 6,100 Syrians.\nA TPS designation allows eligible people from certain countries facing crises including civil war and environmental disasters to remain in the US temporarily, protects them from deportation and allows them to work legally.\nIn her 15-page ruling, Saris wrote that “as a logical matter, plaintiffs’ arguments rest upon a self-contradictory, self-defeating foundation”.\nAccording to Saris, the plaintiffs’ argument undermined itself, because if the homeland security department (DHS) lacked the authority to terminate South Sudan’s TPS designation, it also would have lacked the authority to issue the designation initially.\n“South Sudan’s original TPS designation would thus be invalid by the same token as its termination,” Saris wrote.\nIn response to the ruling, James Percival, a DHS general counsel said on X: “Every other TPS judge must do the same! Every day these ‘administrative stays’ are in effect is a day the American people are denied what they voted for.”\nThe Guardian has contacted African Communities Together for comment.\nMeanwhile, in a statement to the Guardian on Friday, the immigrant advocacy organization Global Refuge condemned the ruling. The CEO, Krish O’Mara Vignarajah, said: “The reality of the situation is that South Sudan is on the brink of a return to an all-out-civil war. Roughly two-thirds of the population, some 10 million people, now depend on humanitarian aid to survive.\n“With only several hundred South Sudanese holding TPS in the US right now, this isn’t a policy forced by scale or strain on our system. To the contrary, this is the administration’s deliberate choice to send a small group of vulnerable individuals and families back into a country where civilians are bearing the brunt of intensifying violence and displacement,” Vignarajah added.\nThe Trump administration’s effort to strip TPS protections from hundreds of thousands of immigrants comes despite the US government’s own highest-level travel warnings for Americans to several countries affected, including South Sudan, Haiti and Syria.\nIn the case of South Sudan, the country has been ravaged by years of civil war and political instability that have displaced millions. Since gaining independence in 2011, more than 400,000 people have been killed in conflict, with fighting and ethnic violence continuing to claim civilian lives.\nThe DHS moved in November to terminate TPS for South Sudan, saying the country no longer met the conditions for the designation, which was first issued in 2011. The department’s action would have led to the end of protections for more than 232 South Sudanese and at least 73 South Sudanese with pending applications. An earlier order by Saris had blocked that from happening.\nAfter the supreme court’s ruling, lawyers for a group of South Sudanese nationals and the non-profit African Communities Together urged Saris to once again block the end of TPS on new grounds that the justices had not addressed.\nThat included an argument that the DHS lacked authority to terminate TPS because the statute that created the TPS program in 1990 referred only to the attorney general as the official who had authority to extend and terminate the deportation protections.\nThe DHS was established later, in 2002, after the September 11 attacks.\nMost of the justice department’s immigration-related functions were transferred to it at that time. Saris, who was appointed by Bill Clinton, concluded Congress had likewise transferred authority over TPS to the DHS.\nSince 2001, TPS holders have paid $7.8bn annually in taxes and contributed $262bn to the US economy, according to the advocacy organization Fwd.us. Many TPS holders are employed in critical industries already facing worker shortages across the country, including construction, hospitality and healthcare.\nLosing TPS can leave immigrants without legal status vulnerable to arrest, detention, and deportation, even with pending asylum or green card applications.\nSome may face immigration court proceedings with limited options to stay in the US. Those ordered removed could be deported and barred from returning f", "translation_ja": "", "vocab": [{"word": "Temporary Protected Status", "definition": "戦争や環境災害などの危機に直面している特定の国からの人々が、米国に一時的に滞在でき、強制送還から保護され、合法的に働くことを許可する移民制度。"}, {"word": "terminate", "definition": "公式に何かを終わらせる、または中止するという意味。ここでは政府が法的保護を廃止することを指します。"}, {"word": "overturned", "definition": "高等裁判所が下級裁判所の判決を無効にし、逆転させることを意味します。"}, {"word": "designation", "definition": "公式に何かを特定の目的や地位として指定すること。ここでは国がTPS対象として指定されることを指します。"}, {"word": "humanitarian aid", "definition": "戦争や自然災害などの危機の影響を受けた人々を支援するために提供される食料、医療、その他の必須サービス。"}, {"word": "vulnerable", "definition": "危害や負の影響を受けやすい状態にあること。ここでは保護がない移民が逮捕や強制送還のリスクにさらされていることを指します。"}, {"word": "statute", "definition": "議会によって制定された正式な法律。特定の権限や規制を定める公式な法的文書。"}]}, {"title_ja": "コンゴ民主共和国のエボラ出血熱、変異の可能性 当局が警告", "title_en": "Ebola Outbreak in DRC Could Be Mutating, Officials Warn", "summary_ja": "コンゴ民主共和国の保健当局は、ブンディブギョ株エボラウイルスが変異している可能性があると懸念しており、確認患者数は4,000人を超え、記録上2番目の大規模流行となっています。アフリカCDCは対応を強化する計画を発表し、接触者追跡から地域社会での能動的な患者探索へシフトしています。当局はまた、抗ウイルス治療の使用と異なるエボラ株向けに開発されたワクチンの試験を検討しています。", "summary_en": "Health officials in the Democratic Republic of the Congo fear the Bundibugyo strain of Ebola may be mutating as confirmed cases exceed 4,000, making it the second-largest outbreak on record. The Africa CDC announced plans to intensify response efforts, shifting from contact tracing to active case searches in communities. Officials are also considering using antiviral treatments and testing a vaccine developed for a different Ebola strain.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/06/ebola-virus-drc-mutating", "state_media": false, "category": "社会", "full_text": "The virus causing a massive outbreak of Ebola in the Democratic Republic of the Congo could be mutating, health officials fear, as confirmed cases pass 4,000.\nAfrica’s public health watchdog said the time for incremental action was over as they announced plans to scale up every aspect of the response and go “door to door” looking for patients.\nThe Ebola outbreak, caused by the Bundibugyo strain of the virus, was first reported on 15 May, although there are suspicions the disease could have been spreading since January.\nThere have been 3,973 cases and 1,801 deaths recorded as of 4 August, according to the DRC’s national public health institute. Speaking on Thursday, Dr Jean Kaseya, director general of the Africa Centres for Disease Control and Prevention (Africa CDC), told a press briefing cases had topped 4,000.\nThe outbreak is now the second-largest Ebola outbreak on record. There are eight times more cases, and six times more deaths than were recorded 11 weeks into the West Africa Ebola outbreak in 2014-18, which infected more than 28,000 people and killed at least 11,000.\nKaseya said he had spoken to the director general of the World Health Organization, Dr Tedros Adhanom Ghebreyesus, and they planned studies “to check if there is no additional issue, or maybe if the virus is not mutating. Because the level of severity of this Bundibugyo outbreak is unprecedented.”\nMore than two-thirds of Ebola deaths are happening in the community rather than in treatment centres. In a treatment centre run by MSF in Bunia, the capital of Ituri province, 90% of admitted patients do not appear on authorities’ lists of contacts of known cases. Both factors indicate high levels of untracked transmission.\nKaseya said contact tracing in the DRC was insufficient, with only 10 contacts identified for every Ebola patient, when about 40 would be the expected number.\nEbola is a viral haemorrhagic fever that can cause vomiting, diarrhoea, organ damage and internal bleeding. The outbreak is centred on the conflict-affected mining province of Ituri, but has spread to Nord-Kivu, Sud-Kivu, Haut-Uele and Tshopo. There were 20 cases recorded in neighbouring Uganda before it brought its outbreak under control.\nDr Wessam Mankoula, acting head of emergency preparedness and response at Africa CDC, said response teams planned a shift “from contact tracing to active case search”, which would mean community health workers “moving from door to door” asking households if they had anyone sick with Ebola symptoms.\nHe added: “I think the time for incremental action is over and we’re starting now the phase for scaling up.”\nKaseya promised a “village-centered response” that would involve communities, more use of digital tools and greater action in the camps for people who have been internally displaced by conflict in affected provinces.\nOfficials also said they planned to begin using antiviral remdesivir on a compassionate use basis to treat patients. They will also start testing whether Ervebo, a vaccine licensed for use against a different strain of Ebola, should be offered in the affected province, after receiving data suggesting that Bundibugyo caused less serious disease and “zero death” among people who had received that jab.\n“Seeing the expansion of this outbreak, only the public health measure will not be enough to quickly control or stop this outbreak,” said Dr Placide Mbala Kingebeni, Africa CDC director of research, clinical trials and innovation.\nDRC authorities said they were investigating a suspected Ebola death on a boat heading to the capital, Kinshasa, from the north-east of the country, and that the other passengers on board would be quarantined and tested.\nUnicef warned that essential healthcare was being disrupted by the outbreak as fear of infection and service disruptions kept families away from clinics. In the outbreak’s centre, the mining town of Mongbwalu, the proportion of children receiving their first measles dose has fallen 69%.", "translation_ja": "", "vocab": [{"word": "viral haemorrhagic fever", "definition": "ウイルス性の出血熱で、臓器障害と内部出血を引き起こす感染症。エボラウイルスはこのカテゴリーに属する病原体です。"}, {"word": "contact tracing", "definition": "感染者と接触した人々を特定し、追跡する公衆衛生対策。感染症の拡大防止に重要な役割を果たします。"}, {"word": "untracked transmission", "definition": "当局が記録していない経路での感染拡大。追跡できない伝播は疾病管理を困難にします。"}, {"word": "compassionate use basis", "definition": "まだ正式認可されていない医療品を、やむを得ない状況で患者治療に用いること。通常の承認手続きを迂回する特例措置です。"}, {"word": "incremental action", "definition": "段階的で小刻みな行動や対策。対して大規模で急速な対応が必要な状況では不十分と見なされます。"}, {"word": "strain", "definition": "ウイルスや細菌の亜種または変種。同じ種のウイルスでも異なる特性を持つ系統を指します。"}]}, {"title_ja": "メッカ協定が直面する課題：サウジアラビアの防衛関係の多角化", "title_en": "Challenges Facing the Mecca Agreement: Saudi Arabia's Defence Diversification", "summary_ja": "サウジアラビア、パキスタン、トルコが共同防衛協定に署名し、リヤドが米国を超えた軍事パートナーシップの多角化を目指していることを示しました。この三国間メッカ協定は、イランとフーシ派との緊張の高まりの中で、湾岸地域における数十年にわたる米国の軍事的存在の有効性に疑問を投げかけています。", "summary_en": "Saudi Arabia, Pakistan, and Turkey have signed a joint defence pact, signaling Riyadh's effort to diversify its military partnerships beyond the United States. The trilateral Mecca agreement raises questions about the effectiveness of decades-long US military presence in the Gulf region amid escalating tensions with Iran and the Houthis.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/inside-story/2026/8/8/challenges-facing-mecca-agreement?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "What are the challenges facing the Mecca agreement?\nSaudi Arabia turns to Turkiye and Pakistan for defence ties, raising questions overreliance on the US.\nSaudi Arabia, Pakistan and Turkiye have signed a joint defence pact.\nIt is an alliance that analysts say highlights Riyadh’s desire to diversify its defence partnerships, expanding to Ankara and Islamabad.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Yemen’s government forces attack Houthis amid renewed shelling of Marib\n- list 2 of 3Iran deliberates Hormuz arrangement amid uncertain prospects with US\n- list 3 of 3Saudi-Pakistan-Turkiye pact: A new shield or strategic signal?\nThe pact was announced at a time of increased regional tension.\nYemen’s Saudi-backed government has launched a military operation against the Iran-aligned Houthis following a series of attacks, while Iran and the US have yet to reach a final deal to end the war.\nThe trilateral Mecca pact raises questions about the effectiveness of the decades-long US military presence in the Gulf. Does this alliance offer a viable alternative to the security umbrella promised by Washington?\nPresenter: Anna Burns-Francis\nGuests:\nAbdulaziz Alghashian – Senior non-resident fellow at the Gulf International Forum\nDavid Des Roches – Professor at the Thayer Marshall Institute\nZaid M Belbagi – Managing partner at Hardcastle Advisory", "translation_ja": "", "vocab": [{"word": "trilateral", "definition": "3つの国または団体が関わる、または3者間の関係を示す形容詞。政治や経済の協定で頻繁に使用されます。"}, {"word": "diversify", "definition": "リスク軽減や選択肢拡大のため、投資や関係を複数の分野や対象に分散させること。ビジネスや外交で重要な戦略です。"}, {"word": "pact", "definition": "2つ以上の国や団体が合意した正式な協定や条約。国際関係では重要な法的文書を指します。"}, {"word": "security umbrella", "definition": "ある国が別の国に提供する軍事的保護と安全保障。米国が同盟国に提供する防衛保証を表す慣用句です。"}, {"word": "viable", "definition": "実現可能であり、実際に機能できる状態を示す形容詞。政策や計画の実行可能性を評価する際に使用されます。"}, {"word": "escalating", "definition": "段階的に増加または悪化することを示す動詞の現在進行形。紛争や緊張が高まる状況を説明する際に使用されます。"}]}, {"title_ja": "イタリア・ガルダ湖近くの山火事、少なくとも200人が避難", "title_en": "At least 200 people evacuated as wildfire rages near Lake Garda", "summary_ja": "イタリアのガルダ湖近くで山火事が発生し、湖の西岸にあるティニャーレ自治体から少なくとも200人が避難を余儀なくされた。ガルダ湖はイタリアで最も人気のある観光地の一つであり、この事態は同地域にとって大きな懸念となっている。", "summary_en": "A wildfire has broken out near Lake Garda in Italy, forcing the evacuation of at least 200 people from the municipality of Tignale on the western shore. Lake Garda is one of Italy's most popular tourist destinations, making the incident a significant concern for the region.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/8/at-least-200-people-evacuated-as-wildfire-rages-near-lake-garda?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "At least 200 people evacuated as wildfire rages near Lake Garda\nAt least 200 people have been evacuated after a wildfire broke out near Italy’s Lake Garda. Authorities said the fire started in the municipality of Tignale on the western shore of the lake. Lake Garda is one of the country’s most popular tourist destinations.\nPublished On 8 Aug 2026", "translation_ja": "", "vocab": [{"word": "evacuated", "definition": "危険地域から人々を安全な場所へ移動させること。緊急事態や災害時に使用される。"}, {"word": "wildfire", "definition": "制御されていない野火のこと。森林や草地で急速に広がる火災を指す。"}, {"word": "municipality", "definition": "地方自治体や市町村を指す行政単位。特定の地域を統治する行政組織。"}, {"word": "rages", "definition": "激しく猛威を振るうこと。火災が勢いよく広がる状況を表現する。"}, {"word": "destination", "definition": "旅行者が訪れることを目的とする場所。観光地を指すことが多い。"}]}, {"title_ja": "レバノン兵がイスラエル軍の不発弾処理中に負傷、南部村落で", "title_en": "Lebanese soldiers wounded defusing ordnance as Israeli troops breach southern village", "summary_ja": "レバノン兵3名がザウタル・ガルビーヤ村で不発弾を撤去中に負傷した。数時間前、イスラエル軍が同村に侵入し土製の障壁を構築したとされている。この事件は6月の停戦合意に違反するもので、同合意ではレバノン軍が地雷除去と国境地域の再建を進める予定だった。", "summary_en": "Three Lebanese soldiers were injured while removing unexploded ordnance in Zawtar al-Gharbiyah, hours after Israeli troops allegedly entered the village and constructed an earth barrier overnight. The incident violates a June ceasefire agreement under which Lebanon's army was deploying to clear mines and rebuild the border region. Israel denied awareness of the incursion while escalating military operations across the frontier.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/8/lebanese-soldiers-injured-while-israeli-troops-intrude-on-southern-town?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Lebanese soldiers injured while Israeli troops intrude on southern town\nSoldiers disarm unexploded ordnance in Zawtar al-Gharbiyah, near where residents say Israeli forces built an earth barrier.\nThree Lebanese soldiers have been wounded while trying to defuse unexploded ordnance in the southern village of Zawtar al-Gharbiyah, the Lebanese army said.\nHours earlier on Saturday, the village mayor and Lebanon’s state-run National News Agency (NNA) said Israeli troops had entered and built an earth barrier overnight.\nRecommended Stories\nlist of 3 items\n- list 1 of 3How fragile is Lebanon’s uneasy peace?\n- list 2 of 3‘No red line’: South Lebanon residents outraged as Israel resumes strikes\n- list 3 of 3Lebanon points to ‘positive progress’ on borders, prisoners in Israel talks\nMayor Abed Ezzeddine told the AFP news agency that residents were surprised to see the barrier, around 100 metres from the village square. The village had been placed under the control of Lebanon’s army as part of a June agreement with Israel.\nA Lebanese military source called the move a violation of the framework accord, but the Israeli military told the AFP agency that it was “not aware of such an event in this area”.\n“An Israeli occupation army force advanced into the village of Zawtar al-Gharbiyah shortly after midnight … and erected a new earthen barrier near the town square,” NNA reported. An AFP correspondent confirmed seeing the barrier blocking a road at the eastern entrance.\nThe Lebanese army had deployed to Zawtar al-Gharbiyah on July 21 and around 50 families have since returned to the village, Mayor Ezzeddine said. Israeli troops were on the outskirts of the village before the deployment.\nThe village is one of two “pilot zones” where the Lebanese army is deploying under a US-sponsored framework agreement signed with Israel on June 26 . It envisions a phased Israeli withdrawal in return for the disarmament of Hezbollah.\nShelling and incursions in several towns\nAl Jazeera’s correspondent in Tyre in southern Lebanon, Ihab al-Aqadi, said Israel had escalated the pace of its attacks over the past few days, in parallel with negotiations between Beirut and Tel Aviv in Rome.\nHe described Zawtar al-Gharbiyah as a pilot area that the Lebanese army was trying to clear of mines, with teams also removing rubble to pave the way for residents to return.\nAl-Aqadi said the nearby town of Mansouri was shelled by Israeli artillery on Saturday. It had effectively remained sealed off by gunfire, with residents unable to return after evacuation orders and intermittent shelling. A bulldozer clearing roads there had been damaged by a bomb explosion the day before, he added.\nHe said the shelling and incursions extended across the frontier: Israeli bulldozing in occupied Zawtar al-Sharqiyeh towards the Ali al-Taher area of Nabatieh al-Fawqa; two drone strikes on open ground in Mayfadoun; and continued ground incursions in Kfar Shouba, in the Hasbaya district and Haddatha in Bint Jbeil district.\nVillages along the line of contact had become uninhabitable, among them Nabatieh al-Fawqa and Mansouri, al-Aqadi said.\nHe added that Lebanon was holding firm on the ceasefire and pressing Israel to halt the destruction of border villages, while preparing for a new round of talks in September.\nIsrael said a soldier was wounded in southern Lebanon on Saturday. The military, cited by Israel’s Channel 12, said the soldier sustained moderate injuries in an “operational incident” and was evacuated to hospital for treatment. Israel Army Radio reported that he was a combat engineer from the 607th Engineering Battalion who was hit by shrapnel from Israeli fire in the border village of Tayri.\nLebanon and Israel concluded a seventh round of direct, US-mediated talks in Rome on Thursday. President Joseph Aoun said Beirut had made “positive progress” on border and prisoner issues.", "translation_ja": "", "vocab": [{"word": "ordnance", "definition": "火砲や爆弾などの軍事兵器、特に爆発物のこと。不発弾や地雷の除去作業で用いられる専門用語。"}, {"word": "incursion", "definition": "領土への侵入や侵犯のこと。軍事的な侵攻や越境行為を指す。"}, {"word": "framework accord", "definition": "基本的な枠組みを定めた合意書。詳細な条件よりも全体的な基本方針を取り決めた国際協定。"}, {"word": "escalated", "definition": "段階的に増加・悪化させること。紛争や攻撃の頻度や激しさが高まる状況を表す。"}, {"word": "phased withdrawal", "definition": "段階的な撤退。一度にではなく、複数の段階を経て軍隊などが領土から撤去されることを意味する。"}, {"word": "disarmament", "definition": "兵器の放棄や軍備削減のプロセス。特に武装勢力が武器を手放すことを指す。"}]}, {"title_ja": "アテネ近郊の山火事をめぐる放火罪で市長を含む3人が起訴される", "title_en": "Greek Mayor Charged with Arson Over Athens Wildfire", "summary_ja": "ギリシャ当局は電気会社を所有する町長を含む3人を2026年7月の山火事放火容疑で起訴し、公判前拘留を決定した。捜査官らは火災が風力発電所の電力ケーブルの火花に由来すると考えており、強い風により急速に広がり森林、住宅、建物が破壊された。3被告人が有罪となった場合、10年以上の懲役に直面する可能性がある。", "summary_en": "Greek authorities have placed a town mayor who owns an electrical company and two others in pre-trial detention, charging them with arson over a wildfire near Athens in late July 2026. Investigators believe the fire started from a spark in power cables at a wind farm, which spread rapidly due to high winds and destroyed forests, homes, and buildings. The three defendants could face over 10 years in prison if convicted.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/greek-mayor-among-three-charged-over-wildfire-near-athens/article71318905.ece", "state_media": false, "category": "社会", "full_text": "Greek authorities placed a town Mayor who owns an electrical company and two others in pre-trial detention on Friday (August 7, 2026) after charging them with arson over a wildfire that ravaged large areas near Athens last week.\nInvestigators believe the blaze started on July 31 with a spark from power cables at a wind farm near Agios Vasileios, a seaside village at the foot of a mountain 85 kilometres (50 miles) northwest of Athens.\nGiannis Apostolou, Mayor of the small town of Stylida around 140 kilometres northwest of the capital, owns an electrical installation company linked to the wind farm.\nInvestigators are accusing him, a contractor for his company and the owner of the wind farm itself of arson and damaging public utilities, Greek media reported.\nAll three could face more than 10 years in jail if convicted.\nGreece's ANA news agency reported Friday (August 7) that the authorities had decided to suspend operations at the wind farm, which is on the border between the regions of Boeotia and Attica.\nFanned by wind gusts of up to 130 kilometres per hour, the fire quickly spread from an overhead medium-voltage power line towards the southern slopes of Mount Kithairon and reached a town about 40 kilometres from Athens.\nThe owner of the wind turbines is accused of failing to clear the vegetation. A fire had already broken out on the same power line on June 27, according to ANA.\nAt the time of the wind farm's installation more than 10 years ago, residents had unsuccessfully attempted to block it through legal action.\nIn addition to the forest, scrubland and olive groves ravaged by the fire, more than 120 buildings and homes were damaged in the seaside resort of Porto Germeno, on the shores of the Gulf of Corinth.\nSince the end of July, Greece has suffered dozens of blazes that have left five people dead, including three firefighters.\nTwo crew members of a helicopter fighting the flames also perished in a collision with another aircraft.\nScientists have long warned that man-made climate change is making periods of extreme heat and drought longer-lasting, more frequent and more intense, creating tinderbox-like conditions for wildfires to spread in.\nPublished - August 07, 2026 09:24 pm IST", "translation_ja": "", "vocab": [{"word": "arson", "definition": "意図的に建物や森林などに火をつける犯罪行為。放火罪として法的に厳しく罰せられる。"}, {"word": "pre-trial detention", "definition": "裁判前に被告人を拘束する法的措置。逃亡のリスクや証拠隠滅の危険がある場合に適用される。"}, {"word": "vegetation", "definition": "ある地域に生育する植物全般を指す。この文脈では火災が広がりやすい環境を作る植物群を意味する。"}, {"word": "overhead", "definition": "頭上または建物の上方に位置することを意味する。ここでは空中を通る電力線を指す。"}, {"word": "tinderbox", "definition": "火がつきやすい乾燥した材料が多い場所。比喩的には紛争が起きやすい危険な状況を表す。"}, {"word": "ravaged", "definition": "大きな被害や破壊をもたらす。自然災害などが広範な地域に甚大な損害を与える状態を描写する。"}]}, {"title_ja": "カーニー首相、トランプ大統領のカナダ批判後に米国との貿易交渉を「不愉快」と表現", "title_en": "Carney says U.S. trade talks 'nasty' after Trump criticises Canada's leadership", "summary_ja": "カナダのマーク・カーニー首相は、トランプ大統領がカナダと指導部を批判し関税の拡大を脅迫した後、米国との貿易交渉を「不愉快」と説明しました。交渉はカナダの雇用と事業を保護することが中心であり、米国はすでに鉄鋼、アルミニウム、自動車に関税を課しており、8月19日からカナダ製品の追加関税を50%に引き上げると脅迫しています。", "summary_en": "Canadian Prime Minister Mark Carney described trade negotiations with the United States as \"nasty\" following President Trump's criticism of Canada and threats to expand tariffs. The talks center on protecting Canadian jobs and businesses, with the U.S. already imposing tariffs on steel, aluminum, and automobiles, and threatening 50% tariffs on additional Canadian goods starting August 19.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/carney-says-us-trade-talks-nasty-after-trump-criticises-canadas-leadership/article71318315.ece", "state_media": false, "category": "政治", "full_text": "Canadian Prime Minister Mark Carney said Thursday (August 6, 2026) that trade negotiations with the United States had turned “nasty” after President Donald Trump derided America's neighbour and its leadership while threatening to expand tariffs.\nMr. Carney said Canada remained engaged in the negotiations despite Mr. Trump's comments, describing the talks as a fight to protect Canadian workers and businesses.\nAlso Read | Canada cancels joint bridge-opening event with U.S. after President Trump announces tariffs\n“This is a tough negotiation,” Mr. Carney said in French. “You can say nasty.' But this is a question of Canadian jobs. It's a question of the future of Canadian businesses.” Mr. Trump criticised Canada during a speech Wednesday (August 5, 2026) in Las Vegas.\n“Canada's nasty. They are. They're nasty,” Mr. Trump said. “I love the people, but they're nasty. Nasty leadership.”\nMr. Carney said “we are in the middle of a tariff war with the Americans” but laughed when asked about Mr. Trump's description. He said Canadian negotiators were in Washington this week and that he expected further conversations with Mr. Trump after speaking with him last week.\nThe United States already has tariffs on Canadian steel, aluminum and automobiles. Mr. Trump has threatened to impose 50 per cent tariffs on more Canadian goods beginning August 19.\nTariffs are taxes on imports, which companies can then pass along to consumers in the form of higher prices. The President maintains that the costs created by tariffs will cause manufacturing to relocate to the U.S., though there is little evidence of that in the economic data.\nMr. Trump's tariff threats and repeated suggestions that Canada should become the 51st U.S. state have angered many Canadians, prompting many Canadians to cancel trips to the United States.\nU.S. Trade Representative Jamieson Greer has argued that Canada and China are the only two countries to retaliate against Mr. Trump's tariffs, citing restrictions on U.S. alcohol sales in some Canadian provinces among his concerns. Canadian officials say their countermeasures were a response to existing U.S. tariffs.\nCanada is one of the United States' largest trading partners, and the move threatens to push prices higher at a time when Americans are already frustrated with the high cost of living ahead of the November 3 midterm elections.\nMr. Carney
