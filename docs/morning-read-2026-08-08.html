ted States’ wartime ascent allowed it to marshal those domestic capacities into building U.S.-centric international rules and institutions. Washington helped shape the UN Charter, the General Agreement on Tariffs and Trade, and the Bretton Woods system, embedding U.S. influence into institutions governing international security, trade, and finance.\nThe United States continued to accumulate legal power over the second half of the twentieth century. Its law schools, law firms, and government agencies helped develop a pipeline of talented lawyers expert in national security law, cross-border disputes, and international law. Today, the State Department’s Office of the Legal Adviser employs roughly 200 attorneys—nearly three times the approximately 70 lawyers employed by its British counterpart—and divides them among more than 20 specialized units that handle treaty negotiations and cases before international tribunals. At the Justice Department, the Office of Foreign Litigation protects American interests in thousands of proceedings around the world. These and other offices have given Washington unusual capacity to advance its interests abroad, in both courts and diplomatic forums.\nA combination of legal credibility and economic leverage has also cemented the United States’ global legal reach. Washington has built on these advantages over decades, ", "translation_ja": "", "vocab": [{"word": "extraterritoriality", "definition": "ある国の法律が自国の領土外で適用される権利。国際法において、強力な国家が他国の領土内でも自国民や企業に対して法的管轄権を行使する能力を指す。"}, {"word": "jurisdictional", "definition": "ある法域が特定の事件や人物に対して法的権限を行使する範囲に関する。国際紛争において、どの国の裁判所がケースを扱う権利があるかを決定する際に重要な概念。"}, {"word": "indispensability", "definition": "なくてはならない状態、必須性。グローバル経済において、特定の国家や機関の存在や機能が他者にとって必要不可欠であることを示す。"}, {"word": "credibility", "definition": "信頼性、信用。国際関係において、法制度や機関が公平で有効であると認識される程度。これが高いほど、その国は法的権力を行使しやすくなる。"}, {"word": "leverage", "definition": "影響力、交渉上の優位性。特定の強みや資源を利用して、他者に対して圧力をかけたり、有利な条件を作り出す力。"}, {"word": "cadre", "definition": "訓練された専門家や指導者の集団。特に組織や政府が目標達成のために育成した人材グループを指す。"}, {"word": "dismantle", "definition": "段階的に解体する、廃止する。制度や機構を意図的に取り壊したり、その機能を失わせたりすることを意味する。"}]}, {"title_ja": "プーチン後のロシア：後継者危機", "title_en": "After Putin: Russia's Succession Crisis", "summary_ja": "著者は、プーチンが明確な後継者を指定せず、指導者交代のための制度的メカニズムを確立していない中で高齢化していくため、ロシアは深刻な後継者危機に直面していると主張している。プーチンの高齢の忠実な側近に依存しながら若い世代を排除するシステムは、彼が最終的に権力を去る際に混乱、権力闘争、不安定性の可能性を生み出しており、スターリン死後の危険な後継者交代の時期を反映している。", "summary_en": "The author argues that Russia faces a critical succession crisis as Putin ages without designating a clear heir or establishing institutional mechanisms for leadership transition. Putin's system of relying on aging loyalists while excluding younger generations has created conditions for potential chaos, power struggles, and instability when he eventually leaves office, mirroring the dangerous succession period following Stalin's death.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/after-putin", "state_media": false, "category": "オピニオン", "full_text": "A specter is haunting Russia—the specter of succession. Russian President Vladimir Putin, who is 73 years old, has built a powerful personalist regime, but one that has no real plan for what comes next. Putin will eventually leave office, whether by death, illness, or—against all observable inclinations—stepping aside. But what happens then is unclear. It could be a rushed passing of the guard, a chaotic power struggle among elites long denied the highest political offices, or continued decay under the gerontocracy that currently runs the country alongside Russia’s dictator.\nRegime succession in Russia is therefore more than just a question of Putin himself. It is also about the eventual passing of an entire generation of elites who surround the Russian autocrat and still cling to most of the highest positions in the state. Many figures close enough to power to influence the choice of the next leader are as old as Putin is. Their own departure from the political scene is critical, because they still disproportionately control the institutions that determine who matters when succession eventually takes place.\nPutin’s tight-knit network has helped him consolidate power and maintain regime stability. Yet the system that has kept these reliable allies in office has also excluded subsequent generations from participating in high politics, gaining trust from other power holders, and learning leadership skills that they would need to effectively govern in the future. By preventing natural generational turnover, Putin’s system has created such a blockage that much younger generations—including the relatives of current elites in Putin’s inner circle—may leapfrog officials currently in their 50s and 60s who picture themselves as the autocrat’s natural heirs. As Russia’s highest elites age alongside Putin, there is no guarantee they will be able to manage a succession process or prevent the long-delayed ambitions of their younger colleagues from escalating into internal conflict.\nRussia’s succession process will flow through the country’s formally democratic constitutional architecture, which requires a transitional election within three months of the president leaving office. But the constitution does not determine who can position themselves to win that election or who will eventually emerge as Russia’s next leader. Instead, as was the case during the political transition in the Soviet Union after the death of Joseph Stalin, the decisions and dealmaking of a small cohort of insiders will determine who takes charge.\nWhat is distinct now is that many of the analogous power brokers and contenders for leadership today are significantly older than the candidates to succeed Stalin were, which suggests that they may not have the energy or lucidity to manage a contested succession. If Putin’s graying allies are still in place when he departs the presidency, they will have missed an opportunity to train a new elite generation and ensure a peaceful transition, just as Putin has missed an opportunity to groom his own successor.\nRECIPE FOR SUCCESSION\nPutin has consistently decided against designating a successor or institutionalizing a clear process for choosing one. United Russia, the country’s nominal ruling party, was never built to designate an heir; rather, it was meant to ensure that elections produced reliably pro-regime seat-fillers in institutions such as parliament. Russia’s constitution also excludes a position of vice president, which avoids forcing the leader to dub a chosen inheritor.\nAccording to the constitution, if the presidential office becomes vacant, the prime minister will become acting president until an election is held. But Putin has carefully chosen prime ministers who do not have a strong power base and cannot overshadow him. This also means that they are not obvious successors. The current prime minister, Mikhail Mishustin, for example, lacks his own network of loyal supporters, meaning that if he were to become acting president he would struggle to convert his position into a victory in a presidential election.\nPutin’s only experiment in potential succession, when he endorsed Dmitry Medvedev to be president, also ended with Putin asserting his unrivaled power. In 2008, having reached the constitutional limit of two consecutive terms as president, Putin supported Medvedev as presidential candidate while he would serve as prime minister. This could have been a trial run for a more permanent handoff of power. During Medvedev’s term, however, Putin maintained significant power and then announced his return to the top role in 2011, ahead of the end of Medvedev’s four-year term. Putin’s move became known in Russia as “castling,” in reference to the chess move in which the king and a rook move past each other, and since then the Kremlin has gradually sidelined Medvedev.\n Putin is surrounded by aging allies. \nPutin’s effort to avoid clear succession plans at all costs is not foreordained. Many other persona", "translation_ja": "", "vocab": [{"word": "personalist regime", "definition": "一人の指導者の個人的な権力と判断に大きく依存する独裁体制。制度や法律よりも指導者の個人的な意思が優先される政治体制を指す。"}, {"word": "gerontocracy", "definition": "高齢の指導者たちによって支配されている政治体制。老年層が権力を握り続ける統治形態を意味する。"}, {"word": "consolidate power", "definition": "権力をしっかり握り、支配を強化する。政治的な立場や権威を確固たるものにするプロセスを指す。"}, {"word": "succession process", "definition": "権力や地位が一人の人物から次の人物へ移行する過程。特に政治的リーダーシップの継承を意味する。"}, {"word": "institutionalizing", "definition": "何かを正式な制度や組織的な仕組みとして確立する。一時的なものではなく、永続的な制度化を指す。"}, {"word": "lucidity", "definition": "明晰さ、判断力。精神的な明確性と思考の清晰さを意味し、意思決定能力に関連する。"}]}, {"title_ja": "パウエル・ドクトリン：レバノンの失敗が現代軍事戦略をどう形作ったか", "title_en": "The Powell Doctrine: How a Lebanon Disaster Shaped Modern Military Strategy", "summary_ja": "本論説は、1983年のレバノン介入の失敗がいかにしてカスパー・ワインバーガー国防長官に軍事行動の基準を定めさせ、後にコリン・パウエル統合参謀本部議長によって洗練されたパウエル・ドクトリンへと導いたかを追跡している。このドクトリンは、軍事力の使用は最後の手段であるべきであり、明確な目的、十分なリソース、国民の支持、そして出口戦略を備えるべきであることを強調し、別のベトナム戦争のような泥沼を防ぐことを目的としている。", "summary_en": "This opinion piece traces how the failed 1983 Lebanon intervention led Defense Secretary Caspar Weinberger to establish criteria for military action, later refined by Colin Powell into the Powell Doctrine. The doctrine emphasizes that military force should be a last resort with clear objectives, sufficient resources, public support, and an exit strategy—principles designed to prevent another Vietnam-like quagmire.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/why-we-should-fight-kori-schake", "state_media": false, "category": "オピニオン", "full_text": "In foreign policy, good ideas often emerge from bad decisions. Such was the case with the Powell Doctrine, a term typically associated with the American triumph over Iraq in the 1990–91 Gulf War. The doctrine did not, in fact, originate with its namesake, Colin Powell, who as chairman of the Joint Chiefs of Staff helped make sure the United States went into the war with a coherent military strategy. And the doctrine’s roots lay not in a success in Iraq, but in a disaster in Lebanon.\nIn 1982, after Israel invaded the civil war–torn country, a rift opened inside the Reagan administration. On one side were Secretary of State George Shultz and civilian officials on the National Security Council, who backed the idea of contributing U.S. troops to a multinational force that would stabilize Lebanon. On the other side were Defense Secretary Caspar Weinberger and the generals on the Joint Chiefs of Staff, who were far less enthusiastic, fearing that an ill-defined mission would drag the United States into an escalatory spiral not unlike the one that had proved calamitous in Vietnam. The hawks won the debate, casting dovish concerns as reflecting a lack of faith in American military power that President Ronald Reagan had himself disparaged as “Vietnam syndrome.”\nBut it didn’t take long for Weinberger’s fears to be realized. Far from stabilizing Lebanon, the multinational forces soon became targets and combatants in the widening war. In October 1983, militants linked to Hezbollah used truck bombs to attack U.S. service members in a barracks at the Beirut airport, killing 241 of them. Inside the administration, the two camps once again split. This time, the doves prevailed. The United States refrained from hitting back against Hezbollah and its Iranian and Syrian sponsors, and in February 1984, Reagan withdrew American forces altogether.\nWeinberger was determined to prevent a repeat of what he saw as an avoidable tragedy, especially as factions within the administration pushed for a more aggressive U.S. military response to Soviet-backed movements in Central America. He decided to give a major speech laying out his vision. For feedback on the draft, he turned to a young army major general who was serving as his principal military assistant: Powell, who later remarked that he had thought the Lebanon mission “never did serve a purpose” and was “goofy from the beginning.”\nIn his speech, delivered in November 1984, Weinberger declared that any plan to use military force should pass six tests. Vital national interests must be at stake. Washington must be willing to commit the resources it would take to achieve victory. Policymakers must have clearly defined political and military objectives. They must also be willing to continually reassess deployments and spending as conditions (and even their objectives) change. Policymakers must gain the support of the American people and Congress through candor and consultation. Finally, as Weinberger put it, “the commitment of U.S. forces to combat should be a last resort.” Reagan soon endorsed what became known as the Weinberger Doctrine, and later wrote in his memoir that its guidelines came to serve as a pillar of his administration’s foreign policy.\nThe doctrine faced its first real test in 1990, when Iraq invaded Kuwait and President George H. W. Bush had to decide whether to intervene militarily. By that time, Powell had risen to become chairman of the Joint Chiefs of Staff. Once Bush decided to use force, Powell set about making sure the plan passed Weinberger’s tests—and that it met two other conditions that Powell added to his former boss’s list: a clear exit strategy and international support. Ideally, the exit strategy would be victory: the adversary conceding the political objectives for which the war was being fought. And because chance shapes outcomes in war to a high degree, ensuring victory requires a wide margin for error. Translated into military terms, that meant using what Powell termed “decisive force.” Powell’s public briefings during the war and the military’s success catapulted him to prominence; the Weinberger Doctrine was now the Powell Doctrine.\nPowell’s formulation was designed to restrain civilian leaders from resorting to military force simply to “do something.” He wanted to ensure that military force was rarely employed and that when it was, it was part of a strategy that integrated other elements of national power. This line of thinking had its critics. Some complained that the criteria unduly restricted American power. Others objected to a military officer’s setting criteria for civilian superiors. But Powell was adamant about his right to set such parameters. As he put it in an essay in these pages in 1992, “We owe it to the men and women who go in harm’s way to make sure . . . that their lives are not squandered for unclear purposes.”\nIn the years after the Gulf War, Powell took a dim view of the Clinton administration’s drift toward intervention in t", "translation_ja": "", "vocab": [{"word": "doctrine", "definition": "政策や原則の体系。特に、政治や軍事の方針として公式に採用された信条や教義を指す。"}, {"word": "escalatory spiral", "definition": "紛争が段階的にエスカレートしていく悪循環。一方の行動が相手の報復を招き、それがさらなる報復を招くという連鎖反応。"}, {"word": "vital national interests", "definition": "国家の存続、安全保障、または重大な経済・政治的利益に関わる最重要事項。"}, {"word": "candor", "definition": "率直さ、正直さ。特に政府が国民に対して透明性を持って情報を伝えることを意味する。"}, {"word": "decisive force", "definition": "紛争を確実に終わらせるために必要な圧倒的な軍事力。曖昧さや長期化を避けるための十分な戦力。"}, {"word": "quagmire", "definition": "泥沼、膠着状態。特に軍事的に抜け出せない状況や、終わりの見えない紛争を比喩的に指す。"}, {"word": "namesake", "definition": "同じ名前を持つ人。ここではドクトリンがコリン・パウエルの名前を冠していることを指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-08 21:18 JST";
  renderTabs();renderList();
})();
</script>
</body>
