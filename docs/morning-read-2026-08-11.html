 World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c20dqd9qwq4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Rescuers scramble for survivors with 180 dead in Colombia earthquake\n- Published\nRescue workers in Colombia are working against the clock to free survivors trapped in buildings and under rubble following Monday's powerful earthquake.\nMore than 180 people have been confirmed dead - most in the cities of Cali and Pereira.\nThe magnitude 7.4 quake struck at 07:34 (12:34 GMT) on Monday and was felt across an enormous area, stretching for hundreds of miles across western Colombia - with fresh aftershocks still being felt on Tuesday.\nWhile the official death toll remains 181, an aggregated figure gathered from local officials puts it higher - potentially at more than 240. A state of emergency has been declared by President Abelardo de la Espriella.\nGiving an update on Tuesday from Pereira, one of the worst hit cities, President Espriella said as well as those killed, almost 2,600 had been injured, and almost 200 people remain missing.\nHe also reported that more than 1,100 homes had been destroyed, and more than 8,000 had been damaged.\nOvernight on Monday into Tuesday, several people several people spent the night outdoors in cities like Pereira and Cali - either due to their homes being destroyed, or fear of further collapses.\nAcross the country, dozens of larger buildings have also collapsed.\nIn Cali, a city of 2.2 million people where there have been 95 deaths, a unified command post has been set up to co-ordinate the rescue effort.\nOn Tuesday, Cali Mayor Alejandro Eder said that 239 people remained trapped, with 949 injured and 45 buildings which have either completely or partially collapsed.\nSeveral of the upper floors of one of the city's hospitals, some dedicated to paediatric care, collapsed, leaving some patients trapped.\nIn Calima, a neighbourhood in the north of Cali, four children died after a section of the Gimnasio Calima school collapsed.\nThe mayor of the municipality, Antonio Cadavid, stated that other children ended up with serious injuries, with a total of 30 children were referred to care centres.\nTo combat threats of looting, he has also ordered a curfew, coming into effect at 20:00 local time, and lasting until 06:00 on Wednesday morning.\nFurther tremors were felt in Cali on Tuesday - part of a pattern of aftershocks across the country, with more than 70 having taken place since Monday's earthquake, according to Colombia's geological service.\nAccording to the agency, two earthquakes of magnitude 3.6 occurred early on Tuesday. The first was in San José del Palmar and the second in Santander.\nIn Pereira, 79 people have died according to the city's fire department.\nThe city has implemented a car-free day to allow the search to go ahead, with citizens urged to comply.\nFootage from the city has shown the massive scale of the rescue effort, with hundreds of volunteers working to remove rubble and free trapped survivors.\nHours after the earthquake hit Pereira, a resident of the Parque Industrial neighborhood, near the city's airport, told BBC Mundo about the shock being experienced in the area.\n\"It's impossible to get around the city center. In Bolívar Square (the city's main square), at least one building collapsed. Furthermore, there are structures where buses and trucks are trapped, and people are afraid those structures will collapse as well,\" he said.\n\"We're all in shock. It was really awful.\"\nJorge Eduardo Rojas, mayor of Manizales, said five people had been killed in the city.\nSixty buildings in Manizales had partially or totally collapsed.\nCautioning about further aftershocks, Rojas urged the public not to share chain messages or social media posts from unknown sources, as they \"may contain false or unverified information... which could cause greater concern and alarm among the public\".\nOn Tuesday, help and support continued to be offered to Colombia from the international community.\nA statement from a spokesperson for UN Secretary-General, António Guterres, stated that he \"expresses his solidarity with the people and government of Colombia\" and that it working to support the government's response.\nSpain's Foreign Minister, José Manuel Albares, reported that 164 Spaniards were still missing.\nAt the moment, he added, there are no reports of injuries or deaths of its citizens.\nThe Donald Trump administration, which backed President Abelardo de la Espriella in his successful election earlier this year, announced this afternoon a donation of $15.5m (£11.5m) to Colombia.\nOffers of help have also come from Ecuador, Brazil, El Salvador, and Venezuela.\nRelated topics\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "magnitude", "definition": "地震の規模を表す数値。地震が放出するエネルギーの大きさを示し、数値が大きいほど揺れが強い。"}, {"word": "aggregate", "definition": "複数の情報源から集めた合計値。個別のデータを組み合わせて全体像を把握する際に使用される。"}, {"word": "aftershock", "definition": "主要な地震の後に続く、より小さな地震。本震の後に断層の調整により発生する。"}, {"word": "curfew", "definition": "夜間の外出禁止令。治安維持やパニック防止のため、特定時間帯の屋外活動を制限する措置。"}, {"word": "solidarity", "definition": "共通の目的や困難に基づいた、団結や支援の感情。国際協力や支援を表現する際に用いられる。"}, {"word": "unverified", "definition": "真実性や正確性が確認されていない状態。信頼できる情報源から確認されていない情報を指す。"}]}, {"title_ja": "米軍ヘリコプター、イラン封鎖に違反する船舶を無力化するためにミサイルを発射", "title_en": "US Helicopter Fires Missiles to Disable Ship Defying Iran Blockade", "summary_ja": "米軍のMH-60ヘリコプターが、米国の海上封鎖に違反してイラン港への到達を試みたパナマ船籍の貨物船に対し、2発のヘルファイアミサイルを発射しました。乗組員が米軍の警告を繰り返し無視したため、M/V Vela Nova号への攻撃が実行されました。この事件は、米国、イスラエル、イランの間で停戦が失敗した後の湾岸地域における継続的な緊張を反映しています。", "summary_en": "The US military used an MH-60 helicopter to fire two Hellfire missiles at a Panama-flagged cargo ship attempting to reach Iranian ports in violation of the American blockade. The attack on M/V Vela Nova occurred after the vessel's crew ignored repeated warnings from US forces. This incident reflects ongoing tensions in the Gulf region following the failed ceasefire between the US, Israel, and Iran.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cvg8lyyyjedo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "US says helicopter fired missiles to disable ship breaking Iran blockade\n- Published\nThe US military says one of its helicopters has fired missiles to disable \"the steering gear\" of a cargo ship attempting to violate the US blockade of Iranian ports.\nIn a statement, US Central Command (Centcom) says its MH-60 aircraft on Tuesday fired two hellfire missiles into the engine room of the Panama-flagged M/V Vela Nova vessel, as it attempted to transit the Gulf of Oman.\nCentcom said it acted after \"the ship's civilian crew ignored repeated warnings from American forces\". The vessel \"is no longer transiting to Iran\", it added.\nIran has not commented. The US has been enforcing a blockade of Iranian ports, following failed attempts to end the war it and Israel started on 28 February.\nTehran retaliated by launching attacks on Israel and US-allied states across the Gulf. It has also effectively closed the Strait of Hormuz - a key oil shipping waterway.\nA fifth of the world's oil and liquefied natural gas used to transit the strait before the war and prices have fluctuated wildly since then.\nMediators have so far failed to bring the sides to an agreement on reopening the strait - and, since the latest ceasefire collapsed in June, both the US and Iran have exchanged fire intermittently.\nIn its statement on X, Centcom said M/V Vela attempted to sail to an Iranian port without naming it. It also did not say whether there were any casualties or injuries.\nIt says the US blockade \"remains in full effect\", adding that as of 11 August Centcom has \"redirected 55 commercial vessels attempting to run the blockade, disabled 3 non-compliant vessels, and boarded 2\".\nIn a separate development on Tuesday, Yemen's internationally recognised government said six people were killed and 10 injured in strikes by Yemen's Iran-backed Houthis on a cargo ship in the Red Sea.\nThe Houthis said they hit a vessel carrying Saudi military equipment. It appears to be the first deadly attack by the group on a ship since the war began.\nRelated topics\n  - Published6 hours ago", "translation_ja": "", "vocab": [{"word": "blockade", "definition": "ある国や地域への物資やサービスの出入りを軍事的に制限する行為です。通常、戦争中に敵国を経済的に圧迫するために使用されます。"}, {"word": "disable", "definition": "機械や船舶などを機能しない状態にする、または操作不能にすることを意味します。この記事では、ミサイル攻撃で船の操舵装置を破壊することを指します。"}, {"word": "transit", "definition": "ある場所から別の場所へ通過または移動することです。海上輸送の文脈では、船舶が特定の海域を通航することを意味します。"}, {"word": "enforce", "definition": "法律や規則を厳格に実施・遵守させることです。ここでは米軍が海上封鎖の遵守を強制していることを表します。"}, {"word": "retaliate", "definition": "相手からの攻撃や危害に対して反撃または報復することです。この場合、イランが米国への反撃を行ったことを指します。"}, {"word": "strait", "definition": "二つの陸地に挟まれた狭い水路で、海上交通の重要な通路です。ホルムズ海峡は世界の石油輸送の約20%が通る戦略的に重要な海域です。"}]}, {"title_ja": "シークレットサービスの「シェルゲーム」戦術：米大統領の移動を秘密裏に保護", "title_en": "Secret Service 'Shell Game' Strategy Conceals US Presidents During Travel", "summary_ja": "米シークレットサービスは、航空機の切り替え、デコイリムジン、位置を変える複数のヘリコプター編隊など、大統領を保護するための高度な欺瞞戦術を採用しています。トルコでのNATO首脳会談中にトランプ大統領がエアフォースワンから秘密裏にケータリングトラックで別の航空機に移されたという報道は、複数の機関による深刻な脅威評価を示唆しています。", "summary_en": "The US Secret Service employs sophisticated deception tactics to protect presidents, including aircraft switches, decoy limousines, and helicopter formations that change positions en route. Recent reports suggest President Trump was secretly transferred from Air Force One via a catering truck during a NATO summit in Turkey, indicating a serious threat assessment by multiple agencies.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c9d84874dzjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Inside the Secret Service 'shell game' to hide US presidents in plain sight\n- Published\nOn 8 July, US President Donald Trump boarded Air Force One in plain sight of television cameras as he departed the Nato summit in Turkey.\nBut when the mighty Boeing aircraft left Ankara, the president had reportedly already been secretly spirited away via a catering truck to a C-32A, a military version of the Boeing 757, which flew the president to RAF Mildenhall in the UK.\nThose left on board were unwitting decoys and had no indication that Trump was no longer travelling with them.\nBut deception of this kind is not unusual.\n\"That's very common,\" said Ronald Kessler, an author who has written extensively on the agency. \"There's a long history of strategies to mislead anybody who might be trying to harm the president.\"\nRobert McDonald, a former high-ranking Secret Service agent with experience working on presidential security details, told the BBC that smaller-scale deceptions are used frequently during motorcade operations.\nThese motorcades - which often include dozens of security and support vehicles, as well as ambulances and vans carrying White House reporters - typically include two \"Beasts\", as the enhanced limousine carrying the president is known.\nWhile one vehicle carries the president, the other travels nearby as a decoy, switching locations while en route to the destination.\n\"It's what we call a shell game,\" said McDonald, who drove one of the vehicles during the Bush administration. \"Even in DC if we headed to Andrews [Joint Base Andrews - where Air Force One flies from], those two limousines would change position, like under a highway overpass.\"\n\"But that would happen out of sight of anybody other than those in the motorcade or in that tunnel,\" he added. \"Different things are used to mix up the bad guy.\"\nSimilarly, Marine One - the president's helicopter - routinely flies in groups of three, changing positions so that potential threats are not sure which is carrying the US leader.\nEven more elaborate deceptions are carried out for complex, high-risk trips abroad.\n\"I would say it does not happen often,\" former Secret Service agent Paul Eckloff told the BBC World Service's Newshour programme of the aircraft switch. \"But it is an option that the Secret Service and others in executive protection always have.\"\n\"When the president travels to war zones, there are frequently tactics and techniques used to create doubt in an adversary of which aircraft or which movement that he's going to make,\" he added.\nIn March 2000, for example, then-President Bill Clinton flew from India to the Pakistani capital of Islamabad on an unmarked executive jet that landed after a decoy jet with all the livery of Air Force One.\nThree years later, the White House claimed that President George W Bush would spend Thanksgiving in Texas, only to arrive in Baghdad in a blacked-out Air Force One.\nIn 2023, Joe Biden also was secretly taken to Ukraine with a slimmed down press pool of one reporter and one photographer.\nIn all three of those cases, the media on board was aware of the deception but had been asked to not report it in real time.\nThe exact nature of the perceived threat to the aircraft in this latest case remains unclear.\nThe Secret Service has so far not commented on the incident, while the White House has neither confirmed nor denied it, saying only that it uses every tool available to protect the president.\nWhile contingency plans for a variety of scenarios are developed ahead of time, experts say that the Secret Service needs to maintain flexibility and remain poised to improvise in the face of new threats as they emerge, particularly overseas.\nBut according to McDonald, the extraordinary measure of secretly moving President Trump from the aircraft suggests that the potential danger was deemed, likely by multiple agencies, to be serious.\n\"That tells me that the threat level in Turkey was relatively substantial and quite high,\" he said, adding that the president's staff, the Secret Service and the White House Military Office were almost certainly immediately alerted.\n\"Those people likely got together in a room and were presented with this intelligence,\" McDonald explained. \"And a plan was put together to negate the threat from whatever intelligence was received.\"\nMcDonald's assessment was echoed by Marc Polymeropoulos, a 26-year veteran of the CIA who served in both Iraq and Afghanistan and oversaw clandestine missions around the world.\n\"The key part of this is the nature of the threat, and what was so severe that the Secret Service would put forth such a deception operation,\" he said.\nA key question going forward, according to Polymeropoulos, is whether the government and intelligence community then had a duty to warn those on the aircraft.\n\"Let's say the plane was blown out of the sky, and we knew about it,\" he said. \"We don't do that…we can't. If we know ISIS is going to attack a target in Moscow, we warn the Russians. Why do we", "translation_ja": "", "vocab": [{"word": "decoy", "definition": "本物と区別つかないように見せかけて敵をだますための模造品または替え玉。大統領の警備では、本当の移動手段と思い違いさせるために使われます。"}, {"word": "contingency plan", "definition": "予期しない事態や緊急時に備えて事前に立てられた計画。シークレットサービスは様々なシナリオに対応するための綿密な計画を準備しています。"}, {"word": "clandestine", "definition": "秘密裏に、極秘のうちに行われることを意味します。大統領の移動や情報活動でよく使われる専門用語です。"}, {"word": "threat assessment", "definition": "潜在的な危険や攻撃の可能性を評価し、そのレベルを判断するプロセス。セキュリティ決定の基礎となります。"}, {"word": "deception operation", "definition": "敵対者を騙すために意図的に虚偽の情報や行動を実行する軍事・セキュリティ作戦。大統領保護の重要な手段です。"}, {"word": "improvise", "definition": "事前の計画なしに、現場の状況に応じて即興的に対応すること。新たな脅威への柔軟な対応が求められます。"}]}, {"title_ja": "2026年の夏は英国の観測史上最高気温に向かっている、気象庁が発表", "title_en": "Summer 2026 on course to be UK's hottest on record, says Met Office", "summary_ja": "英国の今夏の平均気温は16.48℃となり、昨年の記録である16.10℃を上回っています。複数の熱波が発生し、気温は38℃に達し、イングランドの3分の2とウェールズ全域で干ばつが宣言されています。科学者らは、この極端な気象は気候変動によるものであり、世界気温の上昇に伴ってそのような激しい夏がより頻繁に発生するようになると警告しています。", "summary_en": "The UK is experiencing its hottest summer on record with a mean temperature of 16.48°C, surpassing last year's record of 16.10°C. The summer has been marked by multiple heatwaves, with temperatures reaching 38°C and drought declared across two-thirds of England and all of Wales. Scientists attribute this extreme weather to climate change, warning that such intense summers will become increasingly common as global temperatures rise.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/weather/articles/cn8n9pg54m1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Summer 2026 on course to be UK's hottest on record, says Met Office\n- Published\nThis summer is on course to be the UK's hottest since records began, according to the Met Office.\nOnly average conditions are needed for the remainder of August to surpass the record set just last year.\nProvisional Met Office statistics show that the UK's mean temperature for meteorological summer so far (1 June to 10 August) currently stands at 16.48C (61.66F), which is 1.88C above the 1991-2020 average.\nIn summer 2025, the mean temperature across the country - which includes overnight lows as well as daytime highs - was 16.10C (60.98F).\nIt is in line with evidence that summers are getting hotter and are likely to become drier because of climate change.\nA summer of heatwaves\nThe summer of 2026 has already been extraordinary.\nA late-spring heatwave that set a new May temperature record was followed by another heatwave in June, and a third in July which lasted for two weeks in places.\nFurther heatspikes have followed, with many places reaching their heatwave thresholds multiple times throughout the summer.\nWe have seen 37 consecutive heatwave days somewhere in the UK this year.\nThe highest temperature of the summer so far was 38C recorded at Lingwood in Norfolk on 26 June.\nIt is possible that this could be equalled or even exceeded later this week, with the Met Office issuing an amber extreme heat warning for some parts of England on Thursday.\nThe last time we saw temperatures above 36C in August was 2020 when 36.4C was recorded at Heathrow and Kew Gardens.\nRecords smashed\nLong-standing heat records have been toppling throughout the summer.\n- This year is the first on record when 35C or above has been reached in three separate calendar months - May, June and July. With 38C predicted later in the week, a fourth calendar month will be added to that total.\n- It was the driest July in both England and Wales since records began in 1836. Southern England had its driest calendar month on record.\n- By 15 July, the UK had already recorded more days above 30C than in the whole of 1976 - a year that is remembered by many for its iconic and long-lasting heatwave.\nDry season\nThe remarkably warm and sunny summer has led to drought being declared in more than two-thirds of England and all of Wales.\nA total of 45 million people are now living in a drought area in England, with more than 27 million facing water use restrictions.\nThere is no rain in the forecast through most of this week across England and Wales.\nForecasts for Sunday suggest there are some signs of rain coming into the UK from the Atlantic.\nLow pressure bringing rain-bearing weather fronts will move in across Wales and southern England and could bring a spell of rain for some.\nWhile this does not currently look to be particularly heavy or persistent, there could be the first bit of proper rain for many in nearly two months.\nWhat is causing this summer heat?\nThe persistence of high-pressure weather systems over recent months has been unusual but this is the type of summer that scientists have long warned about due to climate change.\nAs average temperatures rise – mainly due to the burning of fossil fuels around the world – hot weather becomes much more likely and more intense.\nThis week's heatwave is forecast to see temperatures once again surpass 35C. This would mean that May, June, July and August will all have passed that threshold this year.\nIn the late 20th Century, it was very rare for temperatures in any year to reach 35C even once.\nWhile temperatures will continue to vary from year to year, scientists warn that summers will keep getting hotter on average as carbon emissions continue to heat up the planet.\nThis means that future heatwaves will be able to reach even higher temperatures than the same weather systems of the past.\nAdditional reporting by Becky Dale\nGet in touch\nHow are you coping with the hot weather? Have you had to make adjustments at home or work? Have the heatwaves impacted on an event you have planned?\n  - Published1 day ago\n  - Published5 days ago\n  - Published5 days ago", "translation_ja": "", "vocab": [{"word": "provisional", "definition": "正式決定や最終確定ではなく、一時的または暫定的な状態を示す。気象データなどの現在進行中の観測値を表す際に用いられます。"}, {"word": "meteorological", "definition": "気象学に関する、または気象学的な意味を持つ形容詞。気象学的な夏（6月1日から8月31日）など、天気や気候に関する専門的な用語です。"}, {"word": "threshold", "definition": "一定の基準値に達する点、または境界線を意味します。気象用語では、特定の気温に達する条件（熱波の基準など）を指します。"}, {"word": "persistence", "definition": "ある状態や現象が継続すること、または粘り強く続く性質を表します。気象学では、高気圧などが長期間続く状況を説明する際に使用されます。"}, {"word": "fossil fuels", "definition": "石炭、石油、天然ガスなどの化石燃料を指す用語です。燃焼時に二酸化炭素を排出し、地球温暖化の主要な原因とされています。"}, {"word": "emissions", "definition": "大気中に放出される物質、特に温室効果ガスを指す。炭素排出（カーボンエミッション）などの文脈で、環境問題に関連して使用されます。"}]}, {"title_ja": "被害者が警察を非難：二重殺人犯による連続攻撃を防げなかった", "title_en": "Assault Survivor Blames Police for Allowing Double Murderer to Continue Attacks", "summary_ja": "2018年にサイモン・レヴィに襲撃された女性は、警察の失敗により登録性犯罪者である彼が14人以上の女性を襲撃し2人を殺害することを許したと主張している。レヴィは金曜日に2件の殺人と2023年から2025年の間の複数の性的暴行で有罪判決を受けた。被害者は、彼を野放しにした刑事司法制度全体を批判している。", "summary_en": "A woman assaulted by Simon Levy in 2018 says police failures allowed him to attack 14 more women and murder two, despite being a registered sex offender. Levy was convicted Friday of two murders and multiple sexual assaults between 2023-2025. The victim criticizes the entire criminal justice system for disastrous decisions that kept him on the streets.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/czjlwlkw1m4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Woman assaulted by double murderer says nightmare became 'real life' when police let him attack again\n- Published\nA woman who was attacked by double murderer Simon Levy eight years ago has told the BBC the police made her nightmare \"real life\" by letting him go on to kill and attack more women.\nLaura, whose surname we are not using, said she had been trying to protect other women by reporting Levy in 2018, but feels betrayed by what he was later allowed to do after being released from jail.\nLevy was convicted on Friday of murdering Carmenza Valencia-Trujillo and Sheryl Wilkins and raping another woman in London in 2025. He will be sentenced on Wednesday.\nHe was also convicted earlier this year of sexually assaulting 11 other women, 10 of them on trains and the Tube in London between 2023 and 2025.\nPolice, prosecutors and the courts made a series of disastrous decisions that left Levy free. He went on to attack 14 more women before being taken off the streets, despite being a sex offender who was monitored by the Met Police.\nLevy was a registered sex offender because he sexually assaulted Laura – and a separate victim - in summer 2018.\nLaura says that Levy is \"evil\" and that his attack \"completely changed my life\".\nBut she now realises that what she would \"think about, dream about, have nightmares about was actually happening - he was actually still out preying on vulnerable women\".\nWaiving her anonymity, she said she had been trying to protect other women by ensuring that Levy was jailed.\n\"I feel like when I reported it, I was doing the right thing and I thought I was doing it to protect other women.\n\"I feel absolutely devastated for all of those women that have been affected by him – and the families.\"\nLaura says she feels let down by the whole criminal justice system including the Met Police, the courts and judges who bailed Levy, as well as the Crown Prosecution Service.\n\"They're all as guilty for allowing him to continue to do what he was doing\", she says.\n\"They could have prevented so many women from being hurt.\n\"They could have prevented two women from losing their lives.\"\nLaura encountered Levy while with a friend travelling to the Notting Hill Carnival on the London Underground in August 2018. He latched onto them and followed them to the carnival. He then subjected her to a serious sexual assault.\nLaura says she forced Levy off and became \"hysterical\" and started \"crying\". With her friend, they tried to escape Levy but he kept following them. Eventually, a group of men chased him off after she told people what had happened.\nBut when she tried to report the crime to police officers, she was turned away.\nShe says two Met officers told her that they \"were busy with other, more urgent, things\".\nA third, female officer eventually took her details, but Laura says the officer didn't make sure she was safe, or look for Levy that day, despite Laura and her friend having a photo of him.\n\"There was a lot more things they could have done to make me feel supported\", she says.\nChallenged on the response to Laura at the carnival, the Met Police said: \"We are sorry the victim felt unsupported in this case and don't underestimate the impact this incident had on her.\n\"A crime report was created the following day with a wide range of enquiries carried out. Levy was identified, arrested and later convicted.\"\nAfter later being contacted by officers, Laura gave a statement 15 days after the attack, and attended an ID parade the next year.\nIt took three years for Levy to go to court. In 2021 he was convicted of sexually assaulting her, as well as another woman he had assaulted a month before Laura.\nHe was jailed for three years, but released on licence despite sexually assaulting a prison officer.\nLaura found out Simon Levy was going to be on trial for two murders when she Googled his name earlier this year.\n\"My heart dropped in my stomach when I read that\", she says.\nLaura says she was also shocked to discover out that Levy had already been investigated for allegedly sexually assaulting another woman in 2017.\nHe was not charged at the time, something now viewed as a mistake by the CPS and the Met.\n\"Had they charged him in 2017, I may not have even ever had to go to court. I may never have been assaulted, ever\".\nShe says there should be a societal change in the approach to male violence against women and girls.\n\"They need to look at everything, all of it, because they could have prevented so many women from being hurt.\n\"They could have prevented two women from losing their lives.\"\nShe adds: \"I hope that other victims in the future will be believed, will be dealt with differently, will be listened to straightaway, and I just hope that there's change\".\nBBC Action Line: If you have been affected by issues in this story, find out what support is available here.\n  - Published4 days ago", "translation_ja": "", "vocab": [{"word": "waiving", "definition": "（権利・特権などを）放棄する、手放すという意味。ここでは被害者が匿名保護を放棄して名前の公表を許可したことを表す。"}, {"word": "disastrous", "definition": "悲劇的な、大変な悪影響を与える、という意味の形容詞。この場合、警察と司法制度の判断が非常に悪い結果をもたらしたことを強調している。"}, {"word": "conviction", "definition": "（裁判での）有罪判決という意味。複数回の犯罪で有罪と判断されたことを表す法律用語。"}, {"word": "registered sex offender", "definition": "性犯罪者として公式に登録された人物。当局に監視対象として記録されている犯罪者を指す用語。"}, {"word": "preying", "definition": "（弱い者に対して）捕食する、狙い撃ちにするという意味。ここでは犯人が無防備な女性たちを意図的に標的にしていたことを表現している。"}, {"word": "jeopardized", "definition": "危険にさらす、危機に陥れるという意味の動詞。この文脈では警察の行動が被害者の安全を危険にさらしたことを示す。"}]}, {"title_ja": "大規模日食を前に安全なメガネ不足で買い求める人々が殺到", "title_en": "Eclipse Chasers Face Shortage of Safety Glasses Ahead of Major Event", "summary_ja": "英国が27年ぶりの重大な日食に向けて準備する中、認定された日食メガネの需要が供給をはるかに上回り、大手小売業者が品切れになっている状況が続いている。オンライン在庫は急速に枯渇し、日食観測に熱心な人々はベーカリーや小型店舗などの非従来型の販売地を探すことを余儀なくされている。同時に、保健当局はISO 12312-2認定メガネの重要性を強調し、恒久的な眼の損傷を防ぐよう警告している。", "summary_en": "As the UK prepares for its most significant solar eclipse in 27 years, demand for certified eclipse glasses has far exceeded supply, with major retailers selling out and safety experts warning against using uncertified alternatives. Online stockpiles have depleted rapidly, forcing eager eclipse watchers to search unconventional outlets like bakeries and corner shops, while health authorities stress the importance of ISO 12312-2 certified glasses to prevent permanent eye damage.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyqxx27620o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Eclipse chasers scramble for glasses as stocks run low\n- Published\nAt a bakery in central London, stock has been flying off the shelves.\n\"I've sold, like, 100 this morning,\" a staff member tells the BBC. But it's not baked goods driving queues out of the door - customers are here to buy eclipse glasses.\nThey are among those hoping to catch a safe glimpse of Wednesday's solar eclipse - the UK's most significant since 1999 - but struggling to get their hands on the right gear.\nExperts have urged eclipse enthusiasts not to look directly at the Sun - with even brief exposure causing lasting damage - and to seek out specialist glasses instead.\nBut online, pairs that meet safety specifications have all but sold out. Those still available either require a hefty next-day delivery fee or simply cannot arrive on time.\nEven the Royal Museums Greenwich - recommended as a reputable retailer by UK health officials - has sold out, citing an \"unprecedented volume\" of orders.\nMeanwhile, eclipse glasses have been turning up for sale in unexpected places as retailers try to capitalise on the demand.\n\"I Googled 'where can I get eclipse glasses but not through the post', because I realised I was too late,\" one customer waiting to buy three pairs at the bakery on Monday tells BBC Radio 4's PM programme.\n\"People have been struggling to find them all over,\" says another.\nWith around 90% of the Sun set to be obscured by the Moon, the UK is expecting its most significant eclipse in 27 years.\nThe right glasses should have the international safety standard ISO 12312-2 printed on them, the UK Health Security Agency (UKHSA) has advised, and the lenses should not be scratched, torn or damaged.\nIt has also advised buying a new pair rather than using ones from 1999, and to take caution when it comes to glasses being sold online as the scramble for safe spectacles has prompted eclipse chasers to trawl social media for tips.\n- Solar eclipse 2026 weather forecast – where and when will the best view be? \n  - Published6 hours ago\n- Watch safely says man with eye damage from eclipse \n  - Published10 hours ago\nA WhatsApp channel which advertises stock in corner shops - including some offering delivery - has attracted thousands of followers in a matter of days.\nElsewhere, hopeful buyers in Reddit and Facebook threads are directed to online marketplaces, including for more expensive bulk purchases.\nLily, 27, \"posted on Instagram like everyone else did\" after the glasses she ordered from Ebay failed to turn up.\n\"I had like three or four people replying saying, 'if you find out where to get some, let me know'.\"\nShe said her best hope was a newsagents rumoured to be selling stock late on Tuesday evening - but hundreds of hopeful buyers were expected to turn up.\n\"I was like, I don't want to go to World War Three to find a pair of cardboard and plastic glasses. I accepted defeat.\"\nLuckily, a friend managed to get hold of some at the last minute on Tuesday in what she described as a \"miracle\".\nThe UKHSA advises caution around products sold online. \"If you're unsure whether a product is certified, don't use it.\"\nUKEclipse, an initiative set up by UK astronomers, also warns that major eclipses often attract \"counterfeit and substandard\" glasses and advises going through specialist retailers and organisations instead.\nThe American Astronomical Society (AAS) urges eclipse chasers to check its list of manufacturers which it has confirmed test their glasses properly in a lab.\nThose who have managed to find a pair can try them ahead of time, it says, by testing them both inside and outside on a sunny day.\nIn both settings, you should not be able to see anything other than perhaps very bright lights, including the Sun's reflection off a shiny surface, \"which should appear very faint\".\nIf they pass that test, you can glance at the Sun - only for less than a second - and should only be able to see \"a sharp-edged, round disk... that's comfortably bright, with a dark background all around it\".\n\"If your viewers pass all three tests, they are probably safe,\" it says.\nEven just a small part of the Sun breaking through the glasses can harm your eyes, the Royal College of Ophthalmologists has warned, adding that the safest way to watch the event is indirectly - such as through a livestream or broadcast.\n\"Crucially, the retina has no pain receptors, so people will not feel the damage as it happens,\" explains the college's president Mohamed Elalfy.\nThe college reported around 70 cases of people experiencing vision problems after watching 1999's eclipse - around 40% of those affected had looked at it for less than a minute.\nAnyone who notices a change in their vision after looking at the Sun should seek advice from an eye-care professional.\nYou should not use binoculars, telescopes or the viewfinder of a camera even with your eclipse glasses on, because their magnifying effect can nullify the protection of the glasses and damage your sight.\nI don't have eclipse glasses - wh", "translation_ja": "", "vocab": [{"word": "unprecedented", "definition": "これまでに例のない、前例のない状態を指す形容詞。「unprecedented volume of orders（前例のない大量の注文）」のように、極めて異例で予測不可能な規模や状況を表現する際に使用される。"}, {"word": "capitalise on", "definition": "機会や状況を最大限に活用して利益を得る、という意味の句動詞。「retailers capitalise on demand（小売業者が需要を利用して利益を得る）」のように、有利な状況を上手く活かす際に用いられる。"}, {"word": "obscured", "definition": "隠す、覆う、不明確にするという意味の動詞の過去分詞。「90% of the Sun obscured by the Moon（月に覆われた太陽の90%）」のように、視界や光が遮られる状態を表現する。"}, {"word": "substandard", "definition": "基準以下の、規格に満たないという意味の形容詞。品質や安全性が要求される基準に達していない製品やサービスに対して使用される表現。"}, {"word": "nullify", "definition": "効力を失わせる、無効にするという意味の動詞。「their magnifying effect can nullify the protection（拡大効果は保護機能を無効にしうる）」のように、何かの効果や機能を完全に打ち消す状況で用いられる。"}, {"word": "retina", "definition": "目の内側にある網膜という光に反応する組織のこと。眼科学や医学用語として使用され、視力に直結する重要な部位を指す。"}]}, {"title_ja": "エボラ出血熱：コンゴ民主共和国で2000人以上が死亡、ウイルス感染が急速に拡大", "title_en": "Ebola: Over 2,000 dead in DR Congo as virus gathers pace", "summary_ja": "コンゴ民主共和国で発生したブンディブギョエボラウイルスのアウトブレイクにより、5月以来4,380件以上の感染者のうち2000人以上が死亡し、致死率は45.9%に達しています。当局は、治療法やワクチンの不足と治安悪化により接触者追跡が追いつかない中、過去最大規模のアウトブレイクになる可能性を警告しています。抗ウイルス薬とエルベボワクチンの臨床試験が進行中で、当局は3ヶ月以内にアウトブレイクを制御できることを期待しています。", "summary_en": "A Bundibugyo Ebola outbreak in the Democratic Republic of Congo has killed more than 2,000 people out of over 4,380 infections since May, with a case fatality rate of 45.9% that exceeds previous outbreaks. Health authorities warn the outbreak could become the largest ever recorded, as the virus spreads faster than contact tracing efforts can manage due to security challenges and lack of approved vaccines for this strain. Clinical trials for antiviral treatments and the Ervebo vaccine are underway, with health officials hopeful these interventions can help control the outbreak within three months.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ebola-over-2-000-dead-in-dr-congo-as-virus-gathers-pace/a-78327706?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ebola: Over 2,000 dead in DR Congo as virus gathers pace\nAugust 11, 2026\nHealth authorities in the Democratic Republic of Congo (DRC) said on Tuesday that an outbreak of a particularly virulent strain of the Bundibugyo Ebola virus currently raging in the east and northeast of the country has killed more than 2,000 people since the first case was confirmed.\nIn all, more than 4,380 infections have been recorded.\nThe current outbreak is the 17th ever recorded in the DRC, with Sania Nishtar of the Gavi global vaccine alliance warning it could become \"the largest outbreak ever.\"\nUntil now, the worst outbreak recorded in the DRC was the one that took place from 2018 to 2020 when some 3,500 infections led to 2,300 deaths.\nThe pace of death is gathering momentum this time around, with the virus spreading faster and exhibiting a higher mortality rate than the 2014-2016 West African outbreak — the worst outbreak on record, which logged 28,000 infections and more than 11,000 deaths.\nThe current DRC outbreak was declared on May 15, but health authorities say the first transmissions likely took place in February of earlier still.\nThe 1,000-death mark was not reached until nine weeks in, now — in just three-weeks' time — that figure has doubled again.\nThe case fatality rate of the current outbreak is 45.9% compared to 39.6% in the 2014-2016 West African outbreak.\n'We haven't reached the peak yet,' says DRC health minister\nThough there are vaccines against some strains of the Ebola virus, there are currently none approved for the rare Bundibugyo strain that is spreading across the DRC faster than health authorities can trace it.\nMoreover, health authorities face massive logistics challenges due to the volatile security situation in the country, where bad roads and rebel violence coupled with lack of healthcare worker pay and mass strikes make it increasingly difficult to keep tabs on the illness.\n\"We haven't reached the peak yet,\" said Health Minister Samuel Roger Kamba in an interview shared by the ministry on X. \"Within the next three months, we expect to have already brought the spread under control and to start seeing it decline,\" he added.\nEbola, which is transmitted through physical contact with bodily fluids, causing a hemorrhagic fever, has killed more than 15,000 people in Africa over the past half century.\nAuthorities in the DRC have placed restrictions on public gatherings as well as closing the airport in Ituri Province, the epicenter of the outbreak. Still, fighting and disease have forced the displacement of masses of people in the DRC, Rwanda and South Sudan.\nOn Monday, the World Health Organization's (WHO) regional director told reporters that authorities are \"chasing the virus… the virus is ahead of us.\"\nWhat's the latest on bids to treat or vaccinate this Ebola strain?\nClinical trials for two antiviral treatment methods have been ongoing since early July and on Friday the WHO recommended undertaking a full-scale human trial of the Ervebo vaccine.\nAlthough Ervebo has proven effective against the Zaire strain of Ebola, its efficacy in fighting the Bundibugyo strain is unproven. WHO officials are hopeful that it can offer some protection against the DRC strain.\nVaccine alliance Gavi says it has made some 500,000 doses of Ervebo in its stockpiles available for the trial.\nVirologists say the new Bundibugyo strain appears to have been transmitted from animals to humans and has changed from previous outbreaks in 2007 and 2012.\nResearchers from Congo, Uganda, Belgium and other countries published findings in the journal Nature Medicine on Monday, suggesting the outbreak began with an animal-to-human transmission event and was then spread between people.\nGiven the severity of the outbreak, authorities are looking into the possibility that the pathogen may have mutated.\nJean Kaseya, the head of the Africa CDC, last week warned that fewer and fewer new cases could be traced back to contacts of existing confirmed patients, with researchers falling well below the WHO's targets of tracking 95% of potential contacts to contain the spread.\nEdited by: Rebecca Staudenmaier\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "virulent", "definition": "非常に危険で有害性が高い（ウイルスなどについて）。病気の進行が急速で重篤であることを示します。"}, {"word": "case fatality rate", "definition": "確定患者のうち死亡に至った者の割合を示す医学統計用語。パンデミック対応で重要な指標です。"}, {"word": "hemorrhagic fever", "definition": "出血を伴う高熱性疾患の総称。エボラやデング熱などの感染症で、出血症状が顕著な病態を指します。"}, {"word": "contact tracing", "definition": "感染者と接触した可能性のある人物を特定し追跡する公衆衛生的介入。感染拡大を防ぐための重要な手段です。"}, {"word": "antiviral", "definition": "ウイルスの増殖を抑制または阻害する薬剤または物質。ウイルス感染症の治療に使用されます。"}, {"word": "stockpile", "definition": "緊急事態に備えて医薬品やワクチンなどを大量に備蓄すること。戦略的な準備を意味します。"}, {"word": "zoonotic transmission", "definition": "動物からヒトへの病原体の感染伝播。この論文では動物からのウイルス流出イベントを指しています。"}]}, {"title_ja": "元海兵隊員、ロシアの獄中から解放され米国に帰還", "title_en": "Ex-Marine Released from Russian Prison, Returning to US", "summary_ja": "32歳の元米海兵隊員ロバート・ギルマンが、4年以上ロシアの獄中で過ごした後に釈放された。トランプ大統領は、この釈放は人道的理由によるもので、捕虜交換ではないと発表した。獄中での虐待により健康状態が著しく悪化したギルマンは、米国の軍事病院で医療支援を受ける予定である。", "summary_en": "Robert Gilman, a 32-year-old former US Marine, has been released from Russian prison after spending over four years detained on disputed assault charges. President Trump announced the release was on humanitarian grounds and not part of a prisoner exchange. Gilman's health had severely deteriorated during his imprisonment, and he will receive medical treatment at a US military hospital.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ex-marine-released-and-returning-to-us-from-russian-prison/a-78327699?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Ex-Marine released and returning to US from Russian prison\nAugust 11, 2026\nRussia on Tuesday released Robert Gilman, a former US Marine who had spent more than four years in prison on disputed charges, according to a group advocating for him and US officials.\nUS President Donald Trump and the State Department both said the release was on \"humanitarian grounds\" and that it was not part of an exchange or prisoner swap with Russia.\nWho is Robert Gilman?\nThe 32-year-old former service member had been working as a teacher in Russia when he was first detained in 2022, accused of assaulting a police officer after being ejected from a train for causing a disturbance.\nHe was later accused of other violent offenses while incarcerated and was given a longer jail sentences, ultimately reaching a total of roughly 10 years.\nAdvocacy group Global Reach had warned of Gilman's deteriorating health condition in detention. His mother was in Russia trying to secure his release as the news developed.\nWhat did Trump and the State Department say about the release?\nTrump posted about the release on his Truth Social platform, also including what appeared to be a photo of a sedentary Gilman, his mother and others on a plane, holding an American flag.\n\"After my discussions with President Vladimir Putin, Russia has agreed to release him, very much on a Humanitarian Basis,\" Trump wrote. \"We appreciated the decision, and the fact that Russia asked for no one in return — No exchange took place.\"\nHe said that Gilman and others would land at Andrews Air Force Base in Washington later on Tuesday to be welcomed back to the US.\nThe State Department, meanwhile, issued a statement attributed to Secretary of State Marco Rubio.\n\"We thank Russia for working with Special Envoy Steve Witkoff to release Mr. Gilman and allowing him to receive the necessary medical treatment here in the United States,\" Rubio said. \"While we appreciate this positive step, we are still seeking the immediate return of all other unjustly detained Americans, including wrongful detainee Stephen Hubbard.\"\nThe statement lauded Trump's efforts to free US-Americans from foreign detention during his second term and concluded that Trump \"will not stop until all unjustly detained Americans are home.\"\nGilman's sister credits Trump, Democrat senator with her brother's release\nGilman's sister Lexie Hudson said in a statement from advocacy group Global Reach that Trump hearing about the case and taking action was the \"reason that Robert is alive today.\"\nShe also thanked Democrat Massachusetts Senator Ed Markey \"for leading our advocacy efforts in Congress.\"\n\"The Russians treated my brother so badly,\" Hudson said. \"They hurt him for no reason, other than that he was both an American and a Marine. What did they get out of this? Why did they do this to such a wonderful person?\"\nAccording to Global Reach's chief strategy officer Eric Lebson, Gilman had been in a \"dissociative stupor\" for 47 days, attributing this to abuse he suffered in prison.\nHe had been moved to a civilian hospital prior to his release, and would soon be medically and psychologically assessed and treated at a US military hospital, Lebson said.\nGilman's mother had traveled to Russia amid the reports of her son's deteriorating health to try to see him.\n\"It is a tragedy that it took Robert's near-death condition for his case to receive the attention that it required for his release to be negotiated,\" Massachusetts Senator Markey said in the statement from Global Reach. \"Throughout his detention, Robert was subjected to physical torture, forced medication, and provocations by Russian authorities. There is no doubt that his treatment by Russian authorities is the reason Robert is in this precarious state today.\"\nGilman was arrested in January 2022, a few weeks before Russia's full-scale invasion of Ukraine. His prosecution proceeded as relations between Putin's Russia and NATO members deteriorated markedly.\nEdited by: Rebecca Staudenmaier\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "humanitarian grounds", "definition": "人道的理由に基づく状況。人命救助や人権保護などの人道的な目的で行動する場合に用いられる表現。"}, {"word": "wrongful detainee", "definition": "不当に拘留された人。正当な法的根拠なく監禁された被害者を指し、国際法の文脈でよく使用される。"}, {"word": "dissociative stupor", "definition": "解離性昏迷。精神的なトラウマや虐待により、意識が低下した状態。心理学的な症状。"}, {"word": "deteriorating health condition", "definition": "悪化する健康状態。時間とともに身体的または精神的な状態が徐々に悪くなる過程。"}, {"word": "precarious state", "definition": "危険で不安定な状態。不確定で危機的な境遇を表す形容詞。"}, {"word": "full-scale invasion", "definition": "全面的な侵攻。完全規模での軍事侵略行為。限定的でない大規模な攻撃を意味する。"}]}, {"title_ja": "トルコの新PKK法は平和をもたらすことができるか？", "title_en": "Can Turkey's New PKK Law Bring Peace?", "summary_ja": "トルコ議会は、PKKが完全に解散し武装解除すれば、PKK構成員の刑罰執行を猶予する「国民連帯と社会統合強化法」を可決した。与党AKPと親クルド系DEM党に支持されているが、超国家主義者とPKK自体から批判を受けており、PKKはさらなる民主化改革と投獄されたクルド系政治指導者の釈放を要求している。", "summary_en": "Turkey's parliament has passed the 'Law on Strengthening National Solidarity and Social Integration,' which offers sentence suspensions for PKK members if the organization completely disbands and disarms. While supported by the ruling AKP and pro-Kurdish DEM party, the law faces criticism from ultranationalists and the PKK itself, which demands further democratization reforms and the release of imprisoned Kurdish political leaders.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/can-the-new-pkk-law-bring-peace-to-turkey/a-78326063?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Can the new PKK law bring peace to Turkey?\nAugust 11, 2026\nOne year ago, the outlawed Kurdistan Workers' Party (PKK) burned its weapons in a symbolic ceremony. The move was seen as a sign of its willingness to disband. Since then, the Kurdish side has been calling on the Turkish government to take political steps.\nNow, parliament has passed a bill submitted by the conservative Islamic ruling party AKP and its ultranationalist ally. Officially called the \"Law on Strengthening National Solidarity and Social Integration,\" it is intended to provide the legal framework for the ongoing peace process.\nAccording to official figures, 467 out of 592 MPs voted in favor of the bill. The ruling party and its ally see this as the beginning of a new era: Under certain conditions, the bill provides for a suspension of sentences for PKK members — but only after the PKK and its affiliated groups have been confirmed to have disbanded and disarmed, so that peace, brotherhood and solidarity can prevail throughout the entire country.\nThe pro-Kurdish DEM party also supports the bill, but it views it only as a first step that must be followed by further reforms.\nPKK law divides society and parliament\nFierce opposition came from the ultranationalist opposition party IYI. Even during consultations, its delegate Ayyuce Turkes, daughter of the founder of the ultranationalist and right-wing extremist Grey Wolves, accused the government of rushing a landmark bill through parliament.\nShe also criticized what she felt was an overly conciliatory stance toward PKK founder Abdullah Ocalan. She avoided using his name, calling him a \"baby killer\" instead, just as government agencies and media have done for decades. There was even a physical altercation.\nThe debate highlights just how deep the divides are within Turkish society. While the ultranationalist IYI party rejects the process, the MHP, from which the Grey Wolves emerged, is now among its most important supporters — even though it had, previously, vehemently opposed earlier peace initiatives.\nObservers believe this shift in course and the progress in the peace process are also a result of the changed security situation in the region. Among other things, they mention the fall of the Assad regime in Syria, the war in Gaza and the conflict between Israel, the United States and Iran. Syria and Iran are also home to large Kurdish populations that are supported by various regional actors.\nAccording to the prevailing view, a more stable relationship with the Kurds who live within Turkey's own borders could provide Ankara with more leeway in domestic and foreign policy.\nWhat's in the law?\nThe law applies to convictions for PKK membership, propaganda, financing or intentional support of the organization and its structures. For prison sentences of up to 15 years, enforcement is to be suspended for five years; for longer or life sentences, the suspension is to last ten years. Ongoing investigations are to be put on hold. According to pro-government media, up to 3,600 prisoners could benefit from this.\nThe prerequisite is the complete disbanding of the PKK and the surrender of all its weapons and ammunition. Both of these conditions have to be verified by Turkish authorities and, subsequently, officially confirmed by the National Security Council, chaired by Turkey's President Recep Tayyip Erdogan.\nExcluded are PKK members who were convicted prior to June 1, 2005 — the date on which the current penal code came into force — as well as those convicted of homicide and whose convictions are final. That means the regulation does not apply to PKK founder Ocalan either. In February 2025, the 77-year-old had called on the PKK to disband, declared an end to the armed struggle and spoke out in favor of a political solution.\nPKK views law as a mere first step\nThe PKK also calls the bill a first step; it criticizes, however, wording and content. Its key demand remained unfulfilled: As long as Ocalan cannot directly coordinate the peace process under conditions of freedom, the issue of disarmament could not be resolved either.\nThey said penal code regulations alone did not go far enough, more comprehensive democratization reforms were needed. The message was that as long as returning fighters or exiled politicians continued to be criminalized and were unable to engage in political activities legally, hardly any of them would leave the mountains where they've been staying.\nEven legal pro-Kurdish political activity has ben restricted in Turkey for decades: parties were banned, politicians were arrested or barred from political activity. To this day, elected mayors are being removed from office, and numerous politicians and activists are in prison. Among them are two former co-chairs of the Peoples' Democratic Party (HDP) that mainly represented Kurds, Selahattin Demirtas and Figen Yuksekdag.\nPeace without democratization?\nPolitical scientist Berk Esen criticizes the law for failing to offer concrete democratic so", "translation_ja": "", "vocab": [{"word": "disband", "definition": "組織や団体を解散させる、または解散するという意味。ここでは武装勢力が正式に活動を終了することを指す。"}, {"word": "ultranationalist", "definition": "過度に民族主義的な、または極端な愛国心を持つ政治的立場。国家の利益を他のあらゆるものより優先する傾向。"}, {"word": "conciliatory", "definition": "対立や紛争を和らげるための和解的な態度や行動。敵対者との関係改善を目指す姿勢。"}, {"word": "prerequisite", "definition": "ある行動や結果が実現するために必要とされる条件や要件。前提条件のこと。"}, {"word": "democratization", "definition": "より民主的な制度や実践へと転換するプロセス。市民の権利や自由を拡大する改革。"}, {"word": "enforce", "definition": "法律や規則を強制的に実施または遵守させること。また、制度や決定を実行に移すことを意味する。"}]}, {"title_ja": "ACLU、トランプ大統領の出生地市民権に関する2番目の大統領令をブロックするよう裁判所に請求", "title_en": "ACLU Seeks Court Block of Trump's Second Executive Order on Birthright Citizenship", "summary_ja": "アメリカ自由人権協会（ACLU）は、トランプ大統領の出生地市民権を標的とした最新の大統領令をブロックするため、連邦裁判所に動議を提出しています。この法的異議申し立ては、米国で生まれた非市民の親の子どもに対する市民権を制限する大統領令の実施を阻止することを目的としています。", "summary_en": "The American Civil Liberties Union is filing a motion in federal court to block President Trump's latest executive order targeting birthright citizenship. The legal challenge aims to prevent the implementation of the order, which would restrict citizenship rights for children born to non-citizen parents in the United States.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/federal-court-asked-block-trumps-2nd-executive-order/story?id=135553699", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース配信", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、速報ニュースと生中継イベントを24時間体制で配信しています。世界中の主要なニュースをリアルタイムで更新し、視聴者に提供しています。継続的なニュース報道と分析にいつでもアクセスできます。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events as they happen. The platform delivers real-time updates on major stories from around the world. Viewers can access continuous news reporting and analysis throughout the day.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "元米海兵隊員ロバート・ギルマン、ロシアでの長年の拘留後に釈放", "title_en": "Former US Marine Robert Gilman Released After Years of Detention in Russia", "summary_ja": "米国務省によると、米国市民で元海兵隊員のロバート・ギルマンがロシアでの拘留から人道的理由により釈放された。この釈放は、ギルマンのロシアでの長期拘留に終止符を打つものとなる。", "summary_en": "Robert Gilman, a U.S. citizen and former Marine, has been freed from detention in Russia on humanitarian grounds, according to the State Department. The release marks the end of a lengthy detention period for Gilman in the country.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/former-us-marine-robert-gilman-released-detention-russia/story?id=135549706", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン、イタリア訪問者への一時的な国境検査を導入へ", "title_en": "Spain to introduce temporary border checks on visitors from Italy", "summary_ja": "モロッコからのセウタへの大量移民事件を受けてイタリアが実施した同様の措置に対抗して、スペインはイタリア訪問者への一時的な国境検査を実施すると発表しました。この検査は9月7日まで続き、不規則な移民への対処方法をめぐるEU加盟国間の緊張を反映しています。イタリアの極右政府は国家安全保障上の懸念を理由に、8月15日前の検査廃止を拒否しました。", "summary_en": "Spain announced temporary border checks on Italian visitors in retaliation for Italy's similar measures imposed after a mass migration incident in Ceuta. The checks will last until September 7, amid tensions between the two EU allies over how to handle irregular migration from Morocco. Italy's far-right government refused to lift its checks before August 15, citing national security concerns.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/07/spain-to-introduce-temporary-border-checks-on-visitors-from-italy", "state_media": false, "category": "社会", "full_text": "Spain has announced it will introduce temporary border checks on visitors from Italy in response to Rome imposing similar measures after a mass rush of people from Morocco into Ceuta.\nThe checks, which come “amid the persistent irregular migration pressure” facing Italy, will start at midnight on Saturday and last until 7 September, Spain’s interior ministry said in a statement.\nHours earlier, Spain threatened Italy with countermeasures if it did not swiftly lift its own border checks, drawing a rebuff from Rome.\nThe rare spat between the EU and Nato allies came after tens of thousands of people crossed from Morocco to Spain’s north African territory on 30-31 July in an unprecedented, deadly rush.\nThe scenes infuriated EU members that back a hard line on irregular immigration, including Italy, which imposed border checks on people arriving from Spain for one month.\nThe Spanish government criticised the measure on Friday as “unfair, contrary to the EU’s interests and discriminatory for the Spanish population”.\nForeign minister José Manuel Albares described it as “a torpedo fired at the hull of European unity”.\n“We urge the government of Italy to rectify, put an end to the checks and treat Spaniards like other European citizens,” he added.\nHe threatened “proportional measures” in response by Sunday if Italy failed to comply.\nWithin hours, the government of Italy’s far-right prime minister, Giorgia Meloni, said it “had no intention of revising the decision” before 15 August, when it said Spanish authorities “expected a new wave of migration” to hit Ceuta.\nMeloni’s office said in a statement: “Italy does not accept ultimatums or impositions from abroad regarding national security and border control.\n“Only when there is certainty that there are no security or terrorism risks to Italy, that no new wave is occurring, and that no irregular migrants are heading toward European territory, will the decision be reconsidered.”\nSpain’s interior ministry announced the reciprocal measures within hours.\nSpanish police have been monitoring online rumours and social media about possible fresh arrivals in Ceuta in mid-August, according to local media. But authorities have not expressly said they expect a repeat of last week’s rush.\nBorder authorities would in the meantime “do their utmost to ensure maximum ease of movement for Spanish and European citizens” who are not affected by border checks, the Italian statement added.\nItaly, which does not share a land border with Spain, introduced border controls at maritime and air entry points for third-country nationals arriving from Spain.\nThe move, announced on 31 July, was an “extraordinary measure” intended to “safeguard national security and prevent possible repercussions for our nation”, Meloni said at the time.\nShe was among several EU leaders who called for Spain to be suspended from the visa-free Schengen travel zone after the Ceuta incident, despite such a move being legally impossible.\nItaly’s coalition government has sought to stop the tens of thousands of people who land in small boats on the country’s shores each year.\nThe Spanish government warned against “creating rifts and sterile conflicts driven by internal electoral motives” and said “we trust that pro-European sentiment, common sense and good faith prevail”.\nOf the 72,000 people who entered Ceuta, 70,000 have returned to Morocco, according to official Spanish figures.\nSpanish authorities said 80 people died in the crossings.\nMoroccan rights groups, however, estimate the figure to be higher. The Moroccan Association for Human Rights and the European Coordination for Human Rights in Morocco on Friday said at least 141 deaths were recorded and that the toll was likely to rise.\nMorocco’s interior ministry has said 11 people died on its side of the border, all but one by drowning.\nThose who remain in Ceuta – including hundreds of unaccompanied children – face dire living conditions with little access to food, water and shelter.", "translation_ja": "", "vocab": [{"word": "reciprocal", "definition": "相互的な、応報的なという意味。一方の行動に対して同じ方法で返すこと。本文ではスペインがイタリアの措置に対して同様の対抗措置を講じることを指しています。"}, {"word": "unprecedented", "definition": "前例のない、未曾有のという意味。これまでに起こったことのない規模や状況を表します。本文では大量移民の規模が史上最大であることを強調しています。"}, {"word": "extraordinary measure", "definition": "通常の方法では対応できない緊急事態に対して取られる特別な措置のこと。本文ではイタリアが国家安全保障を理由に採用した臨時的な国境検査を指します。"}, {"word": "proportional", "definition": "相応の、均衡のとれたという意味。何かに対して相応しい程度や量であることを表します。本文ではスペインが報復措置の規模がイタリアの措置と同等であることを示唆しています。"}, {"word": "ultimatum", "definition": "最後通告という意味。相手に対して条件を示し、従わなければ戦争や制裁を行うという警告。本文ではスペインがイタリアに期限付きで要求を突きつけた状況を指します。"}, {"word": "persist", "definition": "継続する、存続するという意味。問題や状況が継続して存在し続けることを表します。本文では不規則移民の圧力がイタリアに対して継続的な課題であることを示しています。"}]}, {"title_ja": "トランプ政権、南スーダン国民の一時保護資格廃止を裁判官が承認", "title_en": "Judge Approves Trump Effort to End South Sudan TPS Protections", "summary_ja": "マサチューセッツ州の連邦判事は、トランプ政権が南スーダン国民の一時保護資格（TPS）廃止を進めることを認める判断を下しました。これは6月の最高裁判決に従うもので、ハイチとシリア国民のTPS廃止も認めています。この決定は数百人の南スーダン国民に影響を与え、彼らは米国での就業と居住の権利を失う可能性があります。移民権利団体は、南スーダンの継続的な内戦と人道危機を理由に、この判決を非難しています。", "summary_en": "A federal judge in Massachusetts has ruled that the Trump administration can proceed with ending Temporary Protected Status (TPS) for South Sudanese nationals in the US, following a June Supreme Court decision allowing similar action against Haitian and Syrian TPS holders. The ruling affects several hundred South Sudanese who currently hold TPS, which permits them to work and live legally in the country. Immigrant advocacy groups have condemned the decision, citing South Sudan's ongoing civil war and humanitarian crisis.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/07/judge-trump-south-sudan-tps", "state_media": false, "category": "政治", "full_text": "Temporary protected status (TPS) for hundreds of South Sudanese nationals in the United States is set to end after a federal judge ruled that the Trump administration can move forward with stripping their protections.\nOn Friday, US district judge Patti Saris of the district of Massachusetts rejected an attempt by immigrant rights organizations including the New York-based African Communities Together to keep TPS for South Sudanese nationals living in the US.\nSaris’s decision follows a 6-3 supreme court ruling in June allowing the Trump administration to strip hundreds of thousands of Haitians and Syrians of TPS, which granted them permission to work and live legally in the US.\nThe supreme court’s conservative majority overturned lower court rulings in New York and Washington DC, which had blocked the administration from ending TPS for more than 350,000 Haitians and about 6,100 Syrians.\nA TPS designation allows eligible people from certain countries facing crises including civil war and environmental disasters to remain in the US temporarily, protects them from deportation and allows them to work legally.\nIn her 15-page ruling, Saris wrote that “as a logical matter, plaintiffs’ arguments rest upon a self-contradictory, self-defeating foundation”.\nAccording to Saris, the plaintiffs’ argument undermined itself, because if the homeland security department (DHS) lacked the authority to terminate South Sudan’s TPS designation, it also would have lacked the authority to issue the designation initially.\n“South Sudan’s original TPS designation would thus be invalid by the same token as its termination,” Saris wrote.\nIn response to the ruling, James Percival, a DHS general counsel said on X: “Every other TPS judge must do the same! Every day these ‘administrative stays’ are in effect is a day the American people are denied what they voted for.”\nThe Guardian has contacted African Communities Together for comment.\nMeanwhile, in a statement on Friday, the immigrant advocacy organization Global Refuge condemned the ruling. The CEO, Krish O’Mara Vignarajah, said: “The reality of the situation is that South Sudan is on the brink of a return to an all-out-civil war. Roughly two-thirds of the population, some 10 million people, now depend on humanitarian aid to survive.\n“With only several hundred South Sudanese holding TPS in the US right now, this isn’t a policy forced by scale or strain on our system. To the contrary, this is the administration’s deliberate choice to send a small group of vulnerable individuals and families back into a country where civilians are bearing the brunt of intensifying violence and displacement,” Vignarajah added.\nThe Trump administration’s effort to strip TPS protections from hundreds of thousands of immigrants comes despite the US government’s own highest-level travel warnings for Americans to several countries affected, including South Sudan, Haiti and Syria.\nIn the case of South Sudan, the country has been ravaged by years of civil war and political instability that have displaced millions. Since gaining independence in 2011, more than 400,000 people have been killed in conflict, with fighting and ethnic violence continuing to claim civilian lives.\nThe DHS moved in November to terminate TPS for South Sudan, saying the country no longer met the conditions for the designation, which was first issued in 2011. The department’s action would have led to the end of protections for more than 232 South Sudanese and at least 73 South Sudanese with pending applications. An earlier order by Saris had blocked that from happening.\nAfter the supreme court’s ruling, lawyers for a group of South Sudanese nationals and the non-profit African Communities Together urged Saris to once again block the end of TPS on new grounds that the justices had not addressed.\nThat included an argument that the DHS lacked authority to terminate TPS because the statute that created the TPS program in 1990 referred only to the attorney general as the official who had authority to extend and terminate the deportation protections.\nThe DHS was established later, in 2002, after the September 11 attacks.\nMost of the justice department’s immigration-related functions were transferred to it at that time. Saris, who was appointed by Bill Clinton, concluded Congress had likewise transferred authority over TPS to the DHS.\nSince 2001, TPS holders have paid $7.8bn annually in taxes and contributed $262bn to the US economy, according to the advocacy organization Fwd.us. Many TPS holders are employed in critical industries already facing worker shortages across the country, including construction, hospitality and healthcare.\nLosing TPS can leave immigrants without legal status vulnerable to arrest, detention and deportation, even with pending asylum or green card applications.\nSome may face immigration court proceedings with limited options to stay in the US. People ordered removed could be deported and barred from returning for years.\nReuter", "translation_ja": "", "vocab": [{"word": "Temporary Protected Status (TPS)", "definition": "一時的に特定国からの国民に米国での就業と居住を認める移民保護資格。紛争や自然災害などの危機的状況にある国の国民が対象になります。"}, {"word": "designation", "definition": "正式に指定または認定することを意味します。ここではTPSの対象国として公式に指定することを指しています。"}, {"word": "terminate", "definition": "正式に終了させることを意味する法律用語です。ここでは政府がTPS保護を廃止することを指しています。"}, {"word": "humanitarian aid", "definition": "戦争や災害などの危機的状況にある人々を支援するために提供される援助。食糧、医療、避難所などが含まれます。"}, {"word": "advocacy organization", "definition": "特定の原因や立場を支持・推進するために活動する非営利組織です。ここでは移民の権利を守るために活動する団体を指しています。"}, {"word": "statute", "definition": "議会によって制定された法律を意味する正式な法律用語です。ここでは1990年に制定されたTPS関連法を指しています。"}, {"word": "deportation", "definition": "政府の命令により、外国人が自分の国に強制的に送還されることです。移民が法的地位を失った場合の結果となります。"}]}, {"title_ja": "コンゴ民主共和国のエボラ流行、ウイルス変異の可能性　感染者4,000人超える", "title_en": "Ebola Outbreak in DRC Could Be Mutating as Cases Exceed 4,000", "summary_ja": "コンゴ民主共和国のエボラ出血熱流行で、ブンディブギョ株ウイルスが変異している可能性があると保健当局が懸念している。確認された感染者が4,000人を超え、死亡者は1,801人に達し、現在は過去2番目の規模となっている。アフリカCDCは接触者追跡から戸別訪問による能動的な患者探索への転換を発表し、抗ウイルス治療とワクチン試験の規模拡大を計画している。", "summary_en": "Health officials fear the Bundibugyo strain of Ebola causing a massive outbreak in the Democratic Republic of Congo may be mutating, with confirmed cases surpassing 4,000 and deaths reaching 1,801. The outbreak is now the second-largest on record, with unprecedented severity levels, prompting Africa CDC to shift from contact tracing to active door-to-door case searches. Officials plan to scale up response efforts, including antiviral treatments and vaccine trials, while addressing challenges in disease tracking and community transmission.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/06/ebola-virus-drc-mutating", "state_media": false, "category": "社会", "full_text": "The virus causing a massive outbreak of Ebola in the Democratic Republic of the Congo could be mutating, health officials fear, as confirmed cases pass 4,000.\nAfrica’s public health watchdog said the time for incremental action was over as they announced plans to scale up every aspect of the response and go “door to door” looking for patients.\nThe Ebola outbreak, caused by the Bundibugyo strain of the virus, was first reported on 15 May, although there are suspicions the disease could have been spreading since January.\nThere have been 3,973 cases and 1,801 deaths recorded as of 4 August, according to the DRC’s national public health institute. Speaking on Thursday, Dr Jean Kaseya, director general of the Africa Centres for Disease Control and Prevention (Africa CDC), told a press briefing cases had topped 4,000.\nThe outbreak is now the second-largest Ebola outbreak on record. There are eight times more cases, and six times more deaths than were recorded 11 weeks into the West Africa Ebola outbreak in 2014-18, which infected more than 28,000 people and killed at least 11,000.\nKaseya said he had spoken to the director general of the World Health Organization, Dr Tedros Adhanom Ghebreyesus, and they planned studies “to check if there is no additional issue, or maybe if the virus is not mutating. Because the level of severity of this Bundibugyo outbreak is unprecedented.”\nMore than two-thirds of Ebola deaths are happening in the community rather than in treatment centres. In a treatment centre run by MSF in Bunia, the capital of Ituri province, 90% of admitted patients do not appear on authorities’ lists of contacts of known cases. Both factors indicate high levels of untracked transmission.\nKaseya said contact tracing in the DRC was insufficient, with only 10 contacts identified for every Ebola patient, when about 40 would be the expected number.\nEbola is a viral haemorrhagic fever that can cause vomiting, diarrhoea, organ damage and internal bleeding. The outbreak is centred on the conflict-affected mining province of Ituri, but has spread to Nord-Kivu, Sud-Kivu, Haut-Uele and Tshopo. There were 20 cases recorded in neighbouring Uganda before it brought its outbreak under control.\nDr Wessam Mankoula, acting head of emergency preparedness and response at Africa CDC, said response teams planned a shift “from contact tracing to active case search”, which would mean community health workers “moving from door to door” asking households if they had anyone sick with Ebola symptoms.\nHe added: “I think the time for incremental action is over and we’re starting now the phase for scaling up.”\nKaseya promised a “village-centered response” that would involve communities, more use of digital tools and greater action in the camps for people who have been internally displaced by conflict in affected provinces.\nOfficials also said they planned to begin using antiviral remdesivir on a compassionate use basis to treat patients. They will also start testing whether Ervebo, a vaccine licensed for use against a different strain of Ebola, should be offered in the affected province, after receiving data suggesting that Bundibugyo caused less serious disease and “zero death” among people who had received that jab.\n“Seeing the expansion of this outbreak, only the public health measure will not be enough to quickly control or stop this outbreak,” said Dr Placide Mbala Kingebeni, Africa CDC director of research, clinical trials and innovation.\nDRC authorities said they were investigating a suspected Ebola death on a boat heading to the capital, Kinshasa, from the north-east of the country, and that the other passengers on board would be quarantined and tested.\nUnicef warned that essential healthcare was being disrupted by the outbreak as fear of infection and service disruptions kept families away from clinics. In the outbreak’s centre, the mining town of Mongbwalu, the proportion of children receiving their first measles dose has fallen 69%.", "translation_ja": "", "vocab": [{"word": "haemorrhagic", "definition": "出血を特徴とする病気のことを指す医学用語。ウイルス感染により内部器官から出血する症状を伴う疾患を説明する際に用いられる。"}, {"word": "incremental", "definition": "段階的、漸進的という意味で、小さな段階を重ねて進める行動や改善を表す。ここでは急速な対応が必要な状況での不十分な対策を示唆している。"}, {"word": "remdesivir", "definition": "抗ウイルス薬の一種で、エボラなどウイルス感染症の治療に用いられる医療用医薬品。臨床試験で有効性が確認された治療薬である。"}, {"word": "compassionate use", "definition": "治験未了の医薬品を、緊急時に患者の人道的配慮に基づいて特例的に使用することを指す医学用語。"}, {"word": "surveillance", "definition": "病気の発生状況を継続的に監視・追跡する公衆衛生活動。感染症対策における感染者の検出と追跡を意味する。"}, {"word": "strain", "definition": "病原体の種類や亜型を指す医学用語。同じウイルスでも異なる特性を持つ複数の種類が存在する場合に使用される。"}]}, {"title_ja": "パキスタンの雪崩被害者を悼む遺族たち", "title_en": "Relatives Mourn Victims of Pakistan Avalanche", "summary_ja": "パキスタンのブロードピークでの雪崩により、ネパール人登山家3名が亡くなりました。遺体が回収され、カトマンズのトリブバン国際空港に到着し、遺族たちが追悼に集いました。", "summary_en": "Three Nepali mountaineers—Kili Pemba Sherpa, Gyalu Sherpa, and Nima Sherpa—died in an avalanche on Broad Peak in Pakistan. Their bodies have been recovered and arrived at Kathmandu's Tribhuvan International Airport, where relatives gathered to pay their respects.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/11/relatives-mourn-victims-of-pakistan-avalanche?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Relatives mourn victims of Pakistan avalanche\nNewsFeed\nRelatives mourn victims of Pakistan avalanche\nRelatives gathered to mourn the three Nepali mountaineers, Kili Pemba Sherpa, Gyalu Sherpa, and Nima Sherpa, lost days ago to a deadly avalanche on Broad Peak in Pakistan, as their recovered bodies arrive at Kathmandu’s Tribhuvan International Airport.\nPublished On 11 Aug 2026", "translation_ja": "", "vocab": [{"word": "avalanche", "definition": "大量の雪が山から急速に落下する現象。登山や冬山での危険な自然災害を指します。"}, {"word": "mountaineer", "definition": "高い山に登ることを専門とする人。登山技術と経験を持つプロフェッショナルです。"}, {"word": "mourn", "definition": "死者の死を悲しむ、または哀悼する行為。葬儀や追悼式などで行われます。"}, {"word": "recovered", "definition": "失われた、または遺体などを見つけ出す、取り戻すという意味の過去分詞形です。"}, {"word": "tribhuvan", "definition": "ネパールの首都カトマンズにある国際空港の名称。アジア地域の重要な交通拠点です。"}]}, {"title_ja": "パキスタン内相、ホルムズ海峡再開に向けたテヘラン協議に参加", "title_en": "Pakistan Interior Minister Holds Tehran Talks on Hormuz Strait Reopening", "summary_ja": "パキスタンのモフシン・ナクヴィ内相がイランのアッバス・アラグチ外相とテヘランで会談し、米国とイスラエルとイランの紛争を終わらせるための仲介努力について協議した。この協議は、緊張関係を解決し、戦略的に重要なホルムズ海峡を国際航行のために再開することを目的とした広範な外交努力の一環である。", "summary_en": "Pakistan's Interior Minister Mohsin Naqvi met with Iranian Foreign Minister Abbas Araghchi in Tehran to discuss mediation efforts aimed at ending the US-Israeli conflict with Iran. The talks are part of broader diplomatic efforts to resolve tensions and reopen the strategically critical Strait of Hormuz for international shipping.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/11/pakistan-interior-minister-in-tehran-amid-talks-to-reopen-hormuz?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Pakistan interior minister in Tehran amid talks to reopen Hormuz\nNewsFeed\nPakistan interior minister in Tehran amid talks to reopen Hormuz\nPakistan’s interior minister Mohsin Naqvi has held talks with Iranian Foreign Minister Abbas Araghchi in Tehran amid mediation efforts to end the US-Israeli war on Iran and reopen the Strait of Hormuz.\nPublished On 11 Aug 2026", "translation_ja": "", "vocab": [{"word": "mediation", "definition": "紛争当事者の間に入って和解や合意を促す行為。外交交渉において、第三国が仲介役となることを指す。"}, {"word": "strait", "definition": "二つの大陸や島々の間の狭い水路。国際貿易における重要な通路となることが多い。"}, {"word": "interior minister", "definition": "国家の内政と治安を担当する閣僚。国内の警察や安全保障を統括する役職。"}, {"word": "tensions", "definition": "国家間や勢力間における政治的・軍事的な緊張状態。対立や衝突の可能性が高い状況。"}, {"word": "diplomatic efforts", "definition": "国家間の問題を交渉や合意を通じて解決しようとする活動。武力以外の手段による国際関係の調整。"}]}, {"title_ja": "ガザの未亡人たち：戦争が奪った全てとともに一人きりで生き残りをかける", "title_en": "Gaza's Widows Face Survival Alone After War Takes Everything", "summary_ja": "戦争後、ガザの5万人以上の未亡人が失業と避難生活の中で家族を一人で支えるために必死に闘っている。経済的困窮に加えて、深刻な心理的トラウマと必要な社会的、法的、医療支援の欠如に直面している。専門家は、未亡人と子どもたちの生活再建を支援するために、包括的なエンパワーメントプログラムと継続的な人道支援が重要であると強調している。", "summary_en": "Over 50,000 widows in Gaza struggle with displacement and loss following the war, forced to support their families single-handedly. Beyond financial hardship, these women face severe psychological trauma and lack access to essential social, legal, and healthcare support. Experts emphasize that comprehensive empowerment programs and sustained humanitarian aid are critical to help widows and their children rebuild their lives.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/11/in-gazas-tents-widows-face-wars-harshest-realities-alone?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "In Gaza’s tents, widows face war’s harshest realities alone\nWidows in Gaza struggle alone under displacement, burdened by loss, insecurity, and daily battles for survival.\nGaza City, Gaza Strip – Under the scorching heat inside a displacement tent in northern Gaza, Mona al-Masri tries to plan for each day as it comes.\nMona is a widow, and the mother of four children, ranging in age from nine to two. Her husband, Mohammed, was killed in an Israeli strike in September 2024.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Iran, US set new conditions during Hormuz talks: What does this mean?\n- list 2 of 3Palestine weekly: Netanyahu hedges on Gaza roadmap\n- list 3 of 3Colombia’s far-right government recognises Israeli claim over Golan Heights\nBetween fabric walls that provide little protection, Mona carries the responsibilities of a family burdened by displacement brought on by Israel’s genocidal war on Gaza, and the accompanying loss of security.\nMona begins each morning trying to secure her family’s basic needs, searching for water, arranging food, and attempting to protect her children from a reality that no longer resembles the life they knew before the war began in 2023. She says that what hurts her most is not only the harshness of their living conditions, but also the feeling that she has been forced to confront every detail of daily life alone.\n“There is no normal life inside the tent. Every day begins with the same questions: how will we secure our needs, and how will we get through another day surrounded by this exhaustion?” Mona says. “The war did not only take away our homes; it took away our sense of safety and stability and made even the simplest things require enormous effort.”\nRising numbers\nMona is one of thousands of women in the Gaza Strip who have found themselves facing new roles imposed by the war, taking care of their families by themselves.\nAccording to data from the Ministry of Social Development in Gaza, the total number of widows in the Gaza Strip has r
