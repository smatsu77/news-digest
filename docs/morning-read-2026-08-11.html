": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/11/tuskegee-university-bans-bonnets-durags", "state_media": false, "category": "オピニオン", "full_text": "In anticipation of the coming school year, the president of Tuskegee University, Dr Mark A Brown, sent welcome letters to students and their parents last month. Part of the message focused on the university’s policy for student attire. A newly enforced dress code prohibits students from wearing “revealing clothing in class, to the cafeteria or in official settings like Convocation. They are also not able to wear bedroom shoes, bonnets, or durags to class or the cafeteria.” Dr Brown goes on to let the students know: “Faculty will be empowered to respond to students who are inappropriately dressed based on these guidelines.”\nThe policy has produced polarized responses. Supporters believe that since the university is a private school, and Historically Black Colleges and Universities (HBCUs) have often been places where Black people learn discipline and earn entrance into the professional world, this dress code is simply reinforcing a tradition that calls for students to exhibit professionalism during their training. It harkens back to WEB DuBois’s idea of a “Talented Tenth”, which would consist of upwardly mobile Black leaders such as teachers and other professionals whose example of hard work and social standing would uplift the entire race.\nDissenters like me largely concede that as a private HBCU, Tuskegee has the institutional authority to require dress codes, as any similarly situated institution does. But we believe the policy is ultimately rooted in politics of respectability, a set of assumptions I’ve grappled with throughout my own academic career. One of the damaging implications of such a dress code is the reinforcement of anti-Black standards that have been externally and internally imposed on Black people in the United States for decades and have never equaled success or safety.\nIn fact, debates about “proper attire” have polarized the country throughout its history. This has been especially true when the conversations have been tied to violence. Black men returning to the US from war were lynched in their US military uniforms because white folks thought them “uppity” for trying to claim the honor and valor supposedly synonymous with military service.\nMore recently, debates about clothing became a primary focus after Trayvon Martin was killed by George Zimmerman in 2012. The fact that the 17-year-old was wearing a hoodie apparently justified his killing: for some people, the outfit was enough to provoke the fear and apprehension Zimmerman claimed to feel.\nWhen Zimmerman was on trial, I was a high school teacher in Illinois. In that job, I usually wore a tie and a jacket to work. I fondly remember teaching many young students how to tie a half windsor or a bowtie. In 2013, I left that job to go back to school for a PhD. The week I arrived on Clemson University’s campus in South Carolina, George Zimmerman was found not guilty.\nAt the university, things seemed different from when I was in Illinois. The classes were less diverse, and almost everyone assumed the formal way I chose to dress had more to do with religion than professionalism. For a person who isn’t very religious at all, it was strange to suddenly be asked if I was on my way to or from church on a weekday morning when I was teaching. Eventually, I decided that, if I was going to be misread, I would rather be comfortable.\nMy work and research are about how arguments appeal to people. I believe that people are almost always engaging with the world in rhetorical ways. From how we choose to speak to our eye contact to the ways we dress, we are making and responding to appeals. To emphasize how these rhetorics work, I wrote my doctoral dissertation as a rap album titled Owning My Masters: The Rhetorics of Rhymes & Revolutions. I decided the project had to be a rap album, in part, to highlight how Blackness is read as a set of appeals that are offered through music, speech, form and more.\nRap music was the most effective way to demonstrate the kinds of appeals I was interested in exploring. The project highlights how sometimes our commitments to “tradition” and our unquestioning adherence to notions of what is “proper” or “improper” might limit our ability to identify and resist some of the mundane versions of this violence. If I were a professor at Tuskegee, it would be brazenly hypocritical of me to enforce such a dress code given the work I do and how I do it. Because of this, I empathize with the students who have sounded off in response to the public discourse.\nMore generally, though, my professional investment in eschewing what’s considered “traditional” has created similar pushback that I can’t help but experience as personal in some ways. To take seriously the position of the supporters of policies like Tuskegee’s dress code, to me, seems to be a concession to self-harm. I experienced this as a graduate student at Clemson as the assumptions about religious fervor shifted to assumptions that I was a trespasser or interloper when I stoppe", "translation_ja": "", "vocab": [{"word": "respectability politics", "definition": "黒人が白人の期待に合わせて行動や外見を変えることで社会的受け入れを求める戦略。歴史的に黒人コミュニティ内で議論となる概念である。"}, {"word": "eschewing", "definition": "何かを意図的に避けたり、拒否したりすること。「敬遠する」「避ける」という意味で使用される。"}, {"word": "rhetoric", "definition": "人々を説得するための言語や表現の技術。言葉、動作、服装など様々な手段を通じたコミュニケーション手法を指す。"}, {"word": "mundane", "definition": "日常的で平凡な。特に重要でないように見えるが実は害を及ぼす日常的な暴力や差別を指すこともある。"}, {"word": "adherence", "definition": "何かに厳密に従うこと、または守ること。規則や伝統に対する堅い執着を示す。"}, {"word": "polarized", "definition": "意見や見方が2つの対立する立場に分かれること。対極的な意見が対立している状態を表す。"}]}, {"title_ja": "援助後の世界における発展への道", "title_en": "The Path to Development in a Post-Aid World", "summary_ja": "著者は、トランプ政権下での米国と西側ドナー国による外国援助の大幅削減により、脆弱国家が外部権力への脆弱性を露呈したと論じている。援助の削減に頼る代わりに、弱い国家は天然資源、海外送金、地域貿易、統治改善を活用した自立的発展戦略を追求する必要があると主張している。", "summary_en": "The author argues that massive cuts to foreign aid by the US and other Western donors under Trump have exposed fragile states' vulnerability to external powers. Rather than relying on dwindling aid, weak states must pursue self-reliant development strategies leveraging natural resources, diaspora remittances, regional trade, and improved governance to build sustainable economic growth.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/path-development-post-aid-world", "state_media": false, "category": "オピニオン", "full_text": "Fragile states, almost by definition, never have it easy. But for the roughly 60 poor countries that lack the capacity to perform basic responsibilities for their citizens, the last year and a half have been especially tough. For decades, these countries have subsisted on a lean diet of foreign aid from major donor governments and the United Nations, the World Bank, and other multilateral institutions. Yet under President Donald Trump, the United States—traditionally the world’s largest aid provider—has slashed its assistance. Other major donor states have followed suit, as have multilateral organizations.\nThe cuts are causing serious damage. Foreign aid has done a great deal of good, including by helping poorer governments meet the basic needs of millions of people, and the reductions have already resulted in the deaths of over 500,000 children, according to an estimate by Brooke Nicols at Boston University. But for all its merits, the existing system has always been quite limited. Relying on foreign aid did not provide fragile states with a pathway to meaningful economic growth. It did not advance state capacity. Instead, it left recipient countries vulnerable to the whims of faraway powers, as the cuts have now made evident. For weak states to become strong, they need a new strategy, one that depends mostly on themselves.\nCreating such a strategy will not be easy, nor will implementing it. Weak states are weak for a reason. But this task is not impossible. Fragile countries typically possess a wealth of natural resources and receive huge diaspora remittances. Managed right, these streams can provide governments with billions of dollars in revenue and help each country build a robust middle class. These states can create better systems of trade, and they can work across borders to promote internal and external stability. After all, countries typically suffer when their neighbors descend into chaos and thus have a shared stake in ensuring the region’s collective success.\nTHE GREAT WITHDRAWAL\nWhen Trump returned to office in January 2025, he immediately laid waste to the existing system of economic development. On the very day of his inauguration, he dismantled the U.S. Agency for International Development, the body that accounted for the lion’s share of U.S. development and humanitarian assistance. He also promptly slashed or outright canceled Washington’s annual contributions to the Global Climate Fund, the World Health Organization, and over a dozen other UN agencies. The result has been the end of all kinds of development initiatives. Closing USAID, for example, resulted in the termination of well over 5,000 projects. Washington’s cuts to multilateral bodies, to which it was the largest contributor, has shuttered many other programs. Meanwhile, Trump’s heavy-handed use of tariffs has gutted long-standing provisions that gave vulnerable states advantageous trade terms.\nThe United States is not alone in pulling back. According to the Organization for Economic Cooperation and Development, other Western governments have slashed assistance grants and development loans to their lowest level since 2016. Belgium, France, the Netherlands, Sweden, Switzerland, and the United Kingdom have all slashed foreign aid in favor of defense spending and other domestic expenditures. These countries have traditionally been among the world’s leading providers of humanitarian aid, after the United States. The United Kingdom’s humanitarian assistance in the social sector, for instance, has fallen below pre-COVID levels, leading to cuts in health programs in dependent countries in West and East Africa, notably Gambia, Kenya, and Eritrea.\nWestern donors are not the only game in town. China, India, and Russia also provide assistance to weaker states, and they are increasingly positioning themselves as alternative sources. Although China is the only one to have increased its development spending—aid by India and Russia has been static and constrained by domestic pressures—all three have seen demand for new partnerships and have thus expanded their presence in Africa and the global South. The New Development Bank, which is seeded by China, India, and Russia along with other countries in the BRICS consortium, is mobilizing resources for infrastructure and sustainable development in emerging markets and developing countries. Beijing and Moscow are also leading an effort to de-dollarize the international economy—or to make it easier to trade without relying on the United States’ currency—which could help developing states reduce their geopolitical exposure. Weaker states’ reliance on the dollar has not only constrained trade and investment options, including intraregional trade, but has also rendered them easy prey for unfavorable tariffs.\nBut relying on these countries has serious drawbacks. For starters, there are limits to their generosity. India’s and Russia’s aid budgets remain fixed despite growing demand. China’s budget has expa", "translation_ja": "", "vocab": [{"word": "fragile states", "definition": "基本的な市民サービスを提供する能力が欠如している脆弱な国家。国際関係や開発論において、政治的・経済的に不安定で外部支援に依存する国を指す用語。"}, {"word": "diaspora remittances", "definition": "海外に移住した国民が母国に送金する資金。発展途上国の重要な外貨収入源となり、経済発展に貢献する。"}, {"word": "de-dollarize", "definition": "米ドルへの依存を減らし、国際取引においてドル以外の通貨をより多く使用すること。経済的独立性を強化するための戦略。"}, {"word": "geopolitical exposure", "definition": "国際政治や大国の政策変化に対する脆弱性や危険性。経済や安全保障が外部の政治的影響を受けやすい状態を指す。"}, {"word": "multilateral institutions", "definition": "複数の国家によって構成される国際機関。世界銀行やIMF、国連など、国際的な協力と支援を行う組織。"}, {"word": "robust middle class", "definition": "安定した経済基盤を持つ中産階級。社会的安定と経済成長の指標となり、国家発展の重要な要素。"}]}, {"title_ja": "中国の飢饉ゲーム：食料市場を地政学的な武器として利用", "title_en": "China's Hunger Games: Using Food Markets as Geopolitical Leverage", "summary_ja": "中国は膨大な農産物輸入市場を地政学的な武器として利用し、関税や政治的紛争に対応して購入を停止している。しかし、国内需要の増加と耕作地の縮小により食料輸入への依存が高まっており、北京はこの脆弱性に対処するため農業バイオテクノロジーの発展に注力している。", "summary_en": "China leverages its massive agricultural import market as a geopolitical weapon against trading partners, suspending purchases in response to tariffs and political disputes. However, China's heavy dependence on food imports—driven by rising domestic demand and shrinking arable land—creates a significant vulnerability that Beijing seeks to address through advances in agricultural biotechnology.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinas-hunger-games", "state_media": false, "category": "オピニオン", "full_text": "Among the many sectors shaping China’s economic strategy toward the United States and other Western countries, few are as important as food and agriculture. As one of the world’s largest importers of agricultural products, China has frequently used access to its vast markets as leverage in trade negotiations. In 2025, for instance, it suspended soybean imports from the United States for several months—a major setback for U.S. farmers—in response to U.S. President Donald Trump’s “Liberation Day” tariffs. As part of Trump and Chinese leader Xi Jinping’s fragile trade truce in May of this year, China agreed to purchase at least $17 billion per year of U.S. agricultural goods for the remainder of Trump’s presidential term, and it restored market access for U.S. beef and poultry imports from certain U.S. states.\nThe United States is not China’s only target for this strategy. In 2026, China similarly stopped importing a variety of Canadian agricultural products in retaliation for Canadian tariffs on Chinese electric vehicles. And in other cases, Beijing has gone further, wielding its market for food products as a weapon in political disputes. When, in late 2025, Japanese Prime Minister Sanae Takaichi signaled the potential for Japan to intervene in a conflict over Taiwan, China suspended more than $86 million in purchases of Japanese seafood and sake.\nYet Beijing’s enormous market for agricultural products also reflects a precarious reality: China is heavily dependent on imports to meet domestic demand. As Chinese people’s incomes have grown, so has their appetite for meat, dairy, and other goods. Despite major efforts to shore up domestic food production, China has grown more reliant on imports—for animal products as well as feed to produce them. China’s food imports reached $215 billion in 2023, the world’s largest at the time, with nearly 85 percent of its soybeans, more than 67 percent of its oil crops and nuts, and nearly 25 percent of its beef coming from foreign suppliers. China’s food-import bill has receded slightly in recent years but has remained above $200 billion, a figure greater than the total imports of most countries.\nGiven China’s shrinking labor force and the effects of overproduction and climate change on its arable land, Beijing is likely to remain reliant on foreign food products in the coming years. Although its strategy of leveraging its import market for geopolitical influence has served it well so far, Beijing also seems to recognize its great vulnerability. As a result, it is taking steps to become a leader in agricultural biotechnology, such that China could ultimately wield not only its vast food import markets but also select agricultural exports for political gain.\nFEEDING THE PEOPLE\nThe threat of food insecurity looms large in the minds of Chinese Communist Party officials. Uprisings over food have contributed to political crises throughout China’s history. As many as 25 million Chinese starved in the famine of 1906–7, an event that accelerated efforts to overthrow the Qing dynasty, China’s last imperial dynasty. Even worse was the Great Chinese Famine of 1959–61, which was brought on by severe mismanagement amid Mao Zedong’s revolutionary zeal. It claimed the lives of roughly 30 million people and is widely considered the deadliest famine in history. In the late 1980s, surging food prices inflamed the popular discontent behind the Tiananmen Square protests, which resulted in the massacre of protesters in 1989.\nGiven this dark history, Beijing has long sought to shore up the national food supply, and in recent decades has made enormous gains in its ability to feed its population. Economic reforms launched by Deng Xiaoping in the late 1970s ushered in market-oriented policies that ended the food rationing system and provided new incentives to increase agricultural yields. The transition from collective production to a “household responsibility system” brought about rapid marketization and shifting dietary patterns, and China’s accession to the World Trade Organization in 2001 flung open the doors of China’s economy to global food and agriculture trade. China also put in place several regulations to promote and protect agricultural production and manage consumption. In 1996, for instance, the government called for a self-sufficiency rate of 95 percent for staple grains, and in 2006 it established a minimum threshold of farmland that must remain in agricultural use.\nUnder Xi, these efforts have intensified. Chinese state media is replete with stories of a young Xi experiencing hunger as one of Mao’s “sent down” youths during the tumultuous years of the Cultural Revolution. Xi’s own mother even turned him in when he escaped his school one night to beg for food. As a young official in the CCP, Xi then traveled to Iowa in 1985 as part of an agricultural delegation from Hebei Province and returned to Iowa as China’s vice president in 2012, famously impressed by advanced U.S. food producti", "translation_ja": "", "vocab": [{"word": "leverage", "definition": "相手に有利な条件を強制するために使用できる影響力や力。交渉や政治的対立の文脈で、優位性を活用することを意味します。"}, {"word": "precarious", "definition": "不安定で危険な状態にあること。ここでは中国の食料輸入依存という脆弱な立場を指しています。"}, {"word": "reliant", "definition": "～に頼っている、依存している状態。中国が食料輸入に大きく依存していることを表現しています。"}, {"word": "arable", "definition": "耕作可能な土地。農業に適した土地を指し、気候変動や過度な生産により減少しています。"}, {"word": "accession", "definition": "国際組織や協定に加盟すること。2001年の中国のWTO加盟を指しています。"}, {"word": "marketization", "definition": "計画経済から市場経済へ転換するプロセス。中国の経済改革における重要な政策転換を意味します。"}, {"word": "biotechnology", "definition": "生物学的過程を利用した技術。中国が食料自給率向上のために推進している農業分野の先端技術です。"}]}, {"title_ja": "中国が北朝鮮を懸念する理由", "title_en": "Why China Worries About North Korea", "summary_ja": "中国は北朝鮮の予測不可能性と核兵器プログラムが地域の安定を脅かし、危機の際に北京が周辺化される恐れがあることにますます懸念を抱いています。習近平主席の戦略的転換は、平壌との通信チャネルをより良く確立し、非核化を関係改善の前提条件とするのではなくリスク管理を目指すものです。北京は、不安定な隣国に対する影響力を維持しながら、北朝鮮の崩壊を防ぎたいと考えています。", "summary_en": "China is increasingly concerned about North Korea's unpredictability and nuclear program, which threaten regional stability and risk marginalizing Beijing in any crisis. Xi Jinping's strategic shift aims to establish better communication channels with Pyongyang and manage risks rather than insist on denuclearization as a precondition for engagement. Beijing seeks to prevent North Korea's collapse while maintaining influence over its volatile neighbor amid rising global uncertainty.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/why-china-worries-about-north-korea", "state_media": false, "category": "オピニオン", "full_text": "For China, Northeast Asia remains the weak spot in its attempt to secure its immediate borders. Tensions between North Korea and South Korea are mounting, which raises the possibility of conflict that could spill beyond the Korean Peninsula. Security coordination among Japan, South Korea, and the United States is also becoming stronger, putting pressure on China, and North Korea’s entrenched nuclear status has made Japan and South Korea anxious about their own security and could even motivate them to eventually pursue nuclear weapons themselves.\nChina is increasingly worried about North Korea’s role in creating and intensifying these risks—and about the need to adjust its North Korea strategy to manage them without inflaming tensions and further destabilizing the region. Pyongyang has grown more unpredictable as it has become emboldened by its nuclear program. Decades of international sanctions, condemnations, and isolation have not forced Pyongyang to denuclearize. Instead, they have made North Korea even more determined to hold on to its nuclear weapons program. And although North Korea still depends on China for economic support, Pyongyang’s expanding security relationship with Russia has made it less exclusively dependent on Beijing than in the past. If a crisis involving North Korea were to break out, China fears that it could be marginalized as conflict spirals out of control.\nFor nearly eight decades, Beijing’s relationship with Pyongyang has leaned on historical ties, symbolic friendship, and informal coordination. But Pyongyang’s unpredictability has made such an approach inadequate. China’s new strategy, symbolized by Chinese leader Xi Jinping’s visit to North Korea in June, aims to draw Pyongyang back into its orbit and make the bilateral relationship more stable and manageable. Beijing does not want North Korea—one of the world’s few remaining communist states and a potential showcase for how China can effectively manage its relationships with allies—to fail. Nor does Beijing want to abandon its push for long-term denuclearization on the Korean Peninsula. But it realizes that it needs better ways to avoid surprises from Pyongyang, which could be destabilizing for China or trigger expanded military deployments by Japan, South Korea, and the United States.\nBeijing is working to establish structured high-level communication channels so it can receive earlier warnings about potential North Korean provocations, have greater opportunities to intervene before a crisis escalates, and improve its ability to predict North Korean behavior. It is also shifting its approach from treating denuclearization as a precondition for engagement with Pyongyang to reducing risks that might lead to conflicts. With global uncertainty on the rise, China hopes that closer contact and clearer communication with North Korea can serve its most important goal—keeping its immediate neighborhood calm.\nSETTING BOUNDARIES\nAlthough China and North Korea share a border and are both communist states, their relationship has fluctuated over the nearly eight decades since the two countries were founded. China’s connection with North Korea has traditionally relied on diplomatic friendship, shared revolutionary memories, and the personal networks of elder leaders. During the Korean War, for example, the two countries drew close. But at other times, tensions have pushed them apart. After Kim Jong Un became North Korea’s leader, in late 2011, the country’s relations with China plummeted because of disagreements over Pyongyang’s actions, including Kim’s pursuit of nuclear weapons and the arrest and execution of Kim’s uncle.\nBeijing’s frustration with Pyongyang reached new heights in 2017, when North Korea conducted a nuclear test and many missile tests that revealed that it had mastered hydrogen bomb technology and was rapidly improving its nuclear capabilities. The test not only flew in the face of China’s stated opposition to North Korean nuclearization but was also politically embarrassing for Beijing: it occurred while China was hosting a summit for BRICS leaders. That year, China voted for five UN Security Council resolutions to impose crippling sanctions on North Korea and tighten monitoring requirements. China’s concern about a potential escalation of conflict between North Korea and the United States even led Beijing to invite U.S. Chairman of the Joint Chiefs of Staff Joseph Dunford to China for discussions about the North Korean nuclear program and regional security.\nSoon after, when a U.S.–North Korean rapprochement appeared possible, China changed course. In early 2018, after U.S. President Donald Trump and Kim started discussing a potential summit, China worried about being excluded from discussions about how to manage tensions on the Korean Peninsula. In the run-up to Kim’s meeting with Trump, which ultimately took place in Singapore in June 2018, the North Korean leader wanted to consult Xi about his experiences dealing with ", "translation_ja": "", "vocab": [{"word": "emboldened", "definition": "勇気づけられた、大胆になった。核兵器の所有により国家が強気になり、挑発的な行動をとるようになった状態を表す。"}, {"word": "denuclearization", "definition": "非核化。核兵器を放棄またはなくすプロセス。朝鮮半島の核兵器廃絶に関する国際協議の中心的な用語。"}, {"word": "marginalized", "definition": "周辺化された、排除された。政治的な影響力や重要性が低下した状態を意味し、中国が朝鮮半島の問題から除外されることへの懸念を表す。"}, {"word": "precondition", "definition": "前提条件、先決条件。交渉や関係改善の前に満たされるべき必須の条件。"}, {"word": "provocation", "definition": "挑発、刺激的な行為。北朝鮮がミサイル発射や核実験を行うなどの威嫌的な行動を指す。"}, {"word": "rapprochement", "definition": "関係改善、和解。敵対的または緊張した関係にある国家間の関係が改善されるプロセス。米国と北朝鮮の接近を表す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-11 21:36 JST";
  renderTabs();renderList();
})();
</script>
