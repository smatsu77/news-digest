anian border and landing in Tabuk about an hour later, according to Flightradar24.\nAs the plane began to dive, a passenger and a crew member broke into the cockpit, Mr. Netanyahu said, citing a passenger he spoke to. Other crew members took over flying the plane.\nAmong the passengers who intervened were members of the Israeli security forces and air marshals, according to a person familiar with a probe by Saudi Arabia and regional partners. The person was not authorized to comment publicly and spoke on condition of anonymity.\nflydubai confirmed that an “altercation occurred in the flight deck” and the aircraft was secured by on-duty crew “who diverted and landed the aircraft safely.”\nAn official confirmed that Israel had scrambled warplanes, fearing a hijacking. The official spoke on condition of anonymity because the incident was under investigation.\nYasmin Abukasis said her daughter, who was on the plane, told her in a phone call that she could hear someone screaming “Help!”\nHer daughter said the crew started to lose control of the jet, causing passengers to scream, but eventually two people were able to wrest control of the plane while others attempted to subdue the attacker.\nPassengers told Israel’s Channel 12 by phone they heard shouts from those sitting near the front of the plane who heard the altercation between the pilots.\nThe airport in Tabuk reported that a flydubai flight made a distress call at 8:44 a.m. local time, before landing safely at 9:45 a.m.\nFormer United Airlines pilot and aviation safety expert Steve Arroyo said he was surprised that the plane was able to land safely after most of the rudder was ripped off the tail during the extreme descent.\n“That was a serious descent and strong aerodynamic forces on that rudder for that to happen. I’m just amazed the aircraft didn’t come apart,” Mr. Arroyo said.\nIsraelis were targeted in a string of hijackings and airplane attacks by Palestinian militants in the 1960s and 1970s. Israel has not experienced a hijacking in decades but maintains some of the strictest airport security in the world, including on Israel-bound flights.\nThe emergency landing in Saudi Arabia was not the first for a plane carrying Israelis home. The kingdom does not have formal diplomatic ties with Israel, but ended its longstanding ban on Israeli flights overflying its territory in 2022.\nSince then, Saudi Arabia has coordinated emergency land", "translation_ja": "", "vocab": []}, {"title_ja": "Opinion | Mark Carney says he’s protecting Canadian workers. It’s Orwellian doublespeak - Toronto Star", "title_en": "Opinion | Mark Carney says he’s protecting Canadian workers. It’s Orwellian doublespeak - Toronto Star", "summary_ja": "Opinion | Mark Carney says he’s protecting Canadian workers. It’s Orwellian doublespeak Toronto Star", "summary_en": "Opinion | Mark Carney says he’s protecting Canadian workers. It’s Orwellian doublespeak Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMigAJBVV95cUxObFRvQWx0eXEyYUNYREZ0SmI1aGs2dUZxSEF1VjVZUlVmT2hTaUxHcGxVS053a3BUbVF4WkhVbGFndW5mVk1vWTBxNURnZlFnYW9jQlBMWGdtMUJiakwtQUdQeXd1UjduOVU4eGpLWXlYYk5tTE1sdFp6aDZqbk1CN2dMbDVQVXhuNjNHeWhVQXlXV2RLTDFqTEhyeTJtUnBFV3R6NHlfbTBkS2l5YWNEZ1JZTEJrSmowN2dXNXVNN1hSX1VWVXJObmhJT2FSeTVXQ3Q4dGVuYklEVlN4a3lESjVIbGRfR1ExYVZvWl9TUjJGODg5MjRLYWczWFJjb1d6?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Donald Trump’s tariff war on Canada won’t achieve what the president promised — and it was never meant to - Toronto Star", "title_en": "Donald Trump’s tariff war on Canada won’t achieve what the president promised — and it was never meant to - Toronto Star", "summary_ja": "Donald Trump’s tariff war on Canada won’t achieve what the president promised — and it was never meant to Toronto Star", "summary_en": "Donald Trump’s tariff war on Canada won’t achieve what the president promised — and it was never me n (Amendment) (No. 4) Bill, 2025, into law, extending the implementation period of the capital component of the 2025 budget from 30 September to 31 December 2026.\nBayo Onanuga, a presidential spokesperson, announced this in a statement on Wednesday.\nMr Tinubu assented to the amendment bill barely 24 hours after both chambers of the National Assembly passed it.\n“President Bola Ahmed Tinubu has signed into law the Appropriation (Amendment) (No.4) Bill, 2025, extending the implementation period of the 2025 budget from September 30, 2026 to December 31, 2026.\n“The assent followed the amendment’s swift passage by both the Senate and the House of Representatives on Tuesday, September 29, 2026.\n“The extension gives Ministries, Departments and Agencies more time to complete ongoing capital projects. It ensures that funds already appropriated are fully put to work for Nigerians, without disrupting critical programmes.\nThe President commended the leadership and members of the National Assembly for their prompt consideration of the bill, a further sign of the cooperation between the Executive and the Legislature in the service of the nation,” Mr Onanuga said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nFourth extension\nWith the president’s assent, Nigeria has officially extended implementation of the capital component of the 2025 budget for a fourth times—the budget which ought to have ended two years ago.\nThe implementation period was initially scheduled to end on 31 December 2025 but was first extended to 31 March 2026 to allow the federal government to complete ongoing projects captured in the budget.\nWhen that deadline expired on 31 March, lawmakers extended the implementation period to 30 June 2026 for the same reason.\nIn June, when the second extension expired, the lawmakers again extended the implementation period to 30 September.\nRepeated extension of the capital component of budgets has been a source of concern since the Bola Tinubu administration assumed office. Lawmakers and economic analysts have repeatedly criticised the practice.\nOn 9 October 2025, the former Minister of Finance and Coordinating Minister of the Economy, Wale Edun, while appearing before the Senate Committee on Finance during its consideration of the 2025 budget performance, pledged that the government would end the practice of extending budget implementation beyond the fiscal year.\nIn December 2025, President Bola Tinubu also promised to end the practice of operating overlapping budgets while presenting the 2026 budget before a joint session of the National Assembly.\nMr Tinubu assured Nigerians that by 31 March 2026, all capital liabilities would have been fully funded and closed.\n“We’re terminating the habit of running three budgets in one flow. By March 31, 2026, all capital liabilities from previous years will be fully funded and closed. From April, Nigeria will operate on a single budget,” the president promised.\nThe latest extension, however, means that the capital component of the 2025 budget will remain open until the end of 2026, indicating that the government has not met the timeline outlined by the president.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Mambilla: Adesanya denies political ties with Atiku, Dasuki", "title_en": "Mambilla: Adesanya denies political ties with Atiku, Dasuki", "summary_ja": "“I am a Yoruba man and more Tinubu than Atiku,” the businessman, Mr Adesanya said, affirming his disconnection with Atiku. The post Mambilla: Adesanya denies political ties with Atiku, Dasuki appeared first on Premium Times Nigeria .", "summary_en": "“I am a Yoruba man and more Tinubu than Atiku,” the businessman, Mr Adesanya said, affirming his disconnection with Atiku. The post Mambilla: Adesanya denies political ties with Atiku, Dasuki appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/913681-mambilla-adesanya-denies-political-ties-with-atiku-dasuki.html", "state_media": false, "category": "政治", "full_text": "Leno Adesanya, Chief Executive Officer of Sunrise Power and Transmission Company Limited, has denied any political ties to former Vice President Atiku Abubakar and former National Security Adviser Sambo Dasuki.\nThe Sunrise promoter said the attempts to link him to the politicians misrepresent his interest in the long-running Mambilla Hydroelectric Power Project dispute.\nAccording to a report by The Punch, Mr Adesanya made this known in a statement on Monday, adding that his involvement in the dispute was driven by his desire to see the Mambilla project completed, rather than by political patronage.\nLinks with Atiku\nMr Adesanya said his career had brought him into contact with individuals across different political and professional circles, stressing that such relationships should not be construed as evidence of political allegiance.\n“I am a Yoruba man and more Tinubu than Atiku,” Mr Adesanya said, affirming his disconnection with Atiku.\nMr Adesanya said his support for President Bola Tinubu was based not only on their shared Yoruba background but also on his longstanding relationship with the President.\nThe Sunrise CEO said he wanted the Tinubu administration to succeed and had made several attempts to resolve the Mambilla dispute amicably.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“I wrote several times, even against the advice of my lawyers, to settle amicably towards the development of the project,” the businessman said.\nMr Adesanya described attempts to link him with Atiku and Mr Dasuki as the work of “mischief-doers and political detractors,” arguing that his relationships with individuals across the political divide should not be used to create a false narrative about his role in the project.\n“Some of the dates of association have no significant relevance to the Mambilla hydro project,” Mr Adesanya claimed.\nTribunal’s verdict\nHis intervention came amid PREMIUM TIMES’ extensive reports on the Final Award rendered by the International Chamber of Commerce (ICC) in Paris on 17 September, which revealed that Mr Adesanya paid $500,000 to Jennifer Douglas Abubakar, the then-wife of former Vice President Atiku Abubakar.\nSunrise and Mr Adesanya maintained that the payment was a foreign-exchange transaction carried out by Mr Adesanya for Atiku.\nHowever, although the Tribunal stated that there was no evidence showing that Atiku used his official position to facilitate the contract award, it rejected Mr Adesanya’s explanation that the $500,000 was a bona fide foreign-exchange transaction.\nSimilarly, the ICC tribunal raised concerns over a $1.74 million payment made by Mr Adesanya to Abubakar Dasuki, one of the sons of former National Security Adviser Sambo Dasuki, in December 2014 in connection with the long-running Mambilla dispute.\nThe tribunal said both dealings between the former public officials’ relatives and Mr Adesanya contained significant red flags that were not dispelled by other evidence before it.\nMeanwhile, this newspaper, in 2021, had investigated into a secret offshore arrangement involving the family of Mr Dasuki and businessman Leno Adesanya.\nThe investigation formed a key part of the evidence presented by the Nigerian government and its lawyers during arbitration at the ICC.\nMambilla project\nThe Mambilla Hydroelectric Power Project has been embroiled in contractual, financial and legal disputes for decades.\nIn 2003, then Minister of Power and Steel Olu Agunloye awarded Sunrise Power a build-operate-transfer (BOT) contract to develop a 3,050MW plant, estimated at about $6 billion.\nThe agreement required Sunrise to finance and develop the project and recover its investment through long-term electricity sales.\nREAD ALSO: Mambilla: How PREMIUM TIMES investigation helped Nigeria defeat Leno Adesanya at Paris Tribunal\nThe legality of the 2003 contract later became central to the dispute. In 2025, an EFCC investigator testified that former President Olusegun Obasanjo and the Federal Executive Council had not approved the contract and that Mr Agunloye awarded it on 22 May 2003. Mr Agunloye has pleaded not guilty to the resulting criminal charges.\nBy then, Sunrise had commenced ICC arbitration against Nigeria in October 2017, seeking about $2.354 billion over an alleged breach of the agreement.\nA subsequent settlement provided for a $200 million payment, while Sunrise later pursued a separate $400 million claim that grew to about $680 million with interest.\nOn 17 September, the ICC tribunal rejected Sunrise’s claims.\nThe tribunal ruled that Sunrise is unable to enforce the $400 million settlement against Nigeria, both because the agreements lacked the required presidential approval and because the tribunal found them to be a product of corruption.\nMr Tinubu, in his reaction, said the ruling removed what he called the “single biggest legal hurdle” that had stalled the Mambilla project", "translation_ja": "", "vocab": []}, {"title_ja": "How Lafarge tried to ‘frustrate’ Dangote’s cement expansion in Africa – Obasanjo", "title_en": "How Lafarge tried to ‘frustrate’ Dangote’s cement expansion in Africa – Obasanjo", "summary_ja": "“The people who really didn't want Aliko to succeed in cement production is a French company called Lafarge, and they put every obstacle on Aliko's way, just as they are still doing to us today,” Mr Obasanjo said. The post How Lafarge tried to &#8216;frustrate&#8217; Dangote’s cement expansion in Af", "summary_en": "“The people who really didn't want Aliko to succeed in cement production is a French company called Lafarge, and they put every obstacle on Aliko's way, just as they are still doing to us today,” Mr Obasanjo said. The post How Lafarge tried to &#8216;frustrate&#8217; Dangote’s cement expansion in Af", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/913678-how-lafarge-tried-to-frustrate-dangotes-cement-expansion-in-africa-obasanjo.html", "state_media": false, "category": "社会", "full_text": "Former Nigerian President Olusegun Obasanjo has revealed how cement company Lafarge allegedly put obstacles in the way of Aliko Dangote’s efforts to expand cement production across Africa.\nMr Obasanjo made the allegation in Nairobi, Kenya, while speaking at the groundbreaking ceremony of a $16 billion oil refinery project in Lamu, Kenya.\nThe meeting with Kenyan and other East African institutional investors is part of activities surrounding the ongoing initial public offering of Dangote Petroleum Refinery and Petrochemicals FZE.\nMr Obasanjo governed Nigeria between 1999 and 2007.\nExpansion obstacles\nMr Obasanjo said Lafarge was particularly opposed to Mr Dangote’s expansion into cement production and described the company’s actions in Senegal as a “traumatic” experience for the Nigerian businessman.\n“The people who really didn’t want Aliko to succeed in cement production is a French company called Lafarge, and they put every obstacle on Aliko’s way, just as they are still doing to us today,” Mr Obasanjo said.\nHe recalled that after Mr Dangote completed a 5-million-tonne cement plant in Senegal, local residents, allegedly instigated by Lafarge, challenged his ownership of the land on which the factory was built.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“I took Aliko to President Wade and he gave us everything, and Aliko completed the 5 million tonnes cement project in Senegal for two years, they could not do anything.\n“Lafarge instigated some local people and said the land on which he built the cement factory is their land. They went to court. Aliko won.\n“They still didn’t leave him. We won, and Aliko had to pay $12 million. Am I correct? $12 million to be able to operate his cement factory two years after it has been completed,” he said.\nAccording to the former Nigerian president, the dispute was part of efforts by Lafarge to prevent Dangote from challenging its position in Africa’s cement market.\n“Lafarge, who wanted Aliko not to produce cement in Africa, they want to monopolise. Lafarge is out of Africa today. Aliko dominates cement production in Africa,” he said.\nCement factory establishment\nMr Obasanjo used the account to illustrate how Nigerian government policy and private-sector investment combined to start Dangote Group’s cement production in Nigeria.\nHe recalled that in 2003, while Nigeria was still importing cement despite having produced it for decades, he summoned Mr Dangote to discuss why he was importing rather than producing the commodity locally.\nAccording to Mr Obasanjo, Mr Dangote told him that importing cement was more profitable than producing it. He said he subsequently introduced a policy linking cement import licences to plans for domestic production.\nMr Obasanjo said Dangote Group’s chairman initially submitted plans to produce five million tonnes of cement, despite Nigeria having produced less than three million tonnes annually for decades.\nHe said the policy eventually helped Mr Dangote establish large-scale cement plants in Nigeria before expanding into other African countries, including Tanzania, Ethiopia and Senegal.\n“Just a few days before I left the government, we commissioned the first 5 million tonnes cement project in Nigeria.\n“Then Aliko didn’t stop there. He went on and did another 5 million tonne project. I had to take him out. We went to Tanzania. We went to Ethiopia. We went to Senegal,” Mr Obasanjo said.\nRefinery production\nMr Obasanjo also linked Dangote’s success in cement manufacturing to the development of his oil refinery, saying the experience provided the businessman with the confidence and inspiration to undertake the refinery project.\nHe said he recently visited the refinery and recalled that Mr Dangote publicly credited him for the policies that helped his cement business.\n“Without this man, I would not have been in cement production. And it is the cement production that provided the encouragement, the inspiration for the refinery,” Mr Obasanjo quoted Dangote as telling refinery workers.\nREAD ALSO: Dangote, Ruto to launch $16 billion Kenya refinery amid land protests\nMr Obasanjo said the Dangote Group’s expansion beyond Nigeria demonstrated the potential of African economic integration and urged the continent to take integration seriously.\n“I am particularly happy that I see this day where and when we in Africa are taking integration very, very seriously. Where East Africa and West Africa are being brought together with the commitment of our leaders, and with the courage and commitment and enterprise of one man, Aliko Dangote,” he said.\nMr Obasanjo said the same approach was now being applied to the refinery, with the project expected to strengthen trade and economic ties between Nigeria and other African markets.\nEarlier in September, Dangote Petroleum Refinery launched the public share sale, offering 4.1 billion ordinary shares at N525", "translation_ja": "", "vocab": []}, {"title_ja": "Plane to Israel Narrowly Averts Disaster After Pilot Stabbing", "title_en": "Plane to Israel Narrowly Averts Disaster After Pilot Stabbing", "summary_ja": "Passengers said that they entered the cockpit and subdued the attacker, who Israeli officials said was one of the pilots. The motive for the attack was not clear.", "summary_en": "Passengers said that they entered the cockpit and subdued the attacker, who Israeli officials said was one of the pilots. ll countries to build shared future", "summary_ja": "Chinese Vice President Han Zheng on Saturday called on the international community to uphold multilateralism, promote common development and safeguard peace and justice, in a speech at the General Debate of the 81st session of the United Nations General Assembly.", "summary_en": "Chinese Vice President Han Zheng on Saturday called on the international community to uphold multilateralism, promote common development and safeguard peace and justice, in a speech at the General Debate of the 81st session of the United Nations General Assembly.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-27/Chinese-VP-China-to-work-with-all-countries-to-build-shared-future-1QMFxmk073G/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Musk to co-lead Pentagon’s new initiative tasked with studying 'the future of warfare'", "title_en": "Musk to co-lead Pentagon’s new initiative tasked with studying 'the future of warfare'", "summary_ja": "Project Meridian is a new Pentagon initiative meant to identify new capabilities and technologies to deploy in the US military", "summary_en": "Project Meridian is a new Pentagon initiative meant to identify new capabilities and technologies to deploy in the US military", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2195349", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Putin to speak at Valdai Discussion Club annual plenary session", "title_en": "Putin to speak at Valdai Discussion Club annual plenary session", "summary_ja": "The club’s flagship conference brings together 120 participants from 40 countries", "summary_en": "The club’s flagship conference brings together 120 participants from 40 countries", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2195347", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "125 vessels redirected by US military since resumption of blockade of Iran — CENTCOM", "title_en": "125 vessels redirected by US military since resumption of blockade of Iran — CENTCOM", "summary_ja": "CENTCOM said that the US ensures strict compliance with the restrictions", "summary_en": "CENTCOM said that the US ensures strict compliance with the restrictions", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2195345", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Trump’s Vanity Summit With Xi", "title_en": "Trump’s Vanity Summit With Xi", "summary_ja": "While expectations for the summit between US President Donald Trump and Chinese President Xi Jinping were low, it was disappointing to watch them prioritize pageantry over substance. Trump’s cringe-worthy declarations of heartfelt admiration for Xi reflect his twisted sense that the trappings of pow", "summary_en": "While expectations for the summit between US President Donald Trump and Chinese President Xi Jinping were low, it was disappointing to watch them prioritize pageantry over substance. Trump’s cringe-worthy declarations of heartfelt admiration for Xi reflect his twisted sense that the trappings of pow", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trump-vanity-summit-with-xi-washington-by-stephen-s-roach-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Trump’s Vanity Summit With Xi\nWhile expectations for the summit between US President Donald Trump and Chinese President Xi Jinping were low, it was disappointing to watch them prioritize pageantry over substance. Trump’s cringe-worthy declarations of heartfelt admiration for Xi reflect his twisted sense that the trappings of power are power itself.\nNEW HAVEN—Long on ceremony but short on substance, the eagerly anticipated summit between US President Donald Trump and Chinese President Xi Jinping was a disappointment. Perhaps not a major disappointment, as expectations were generally low, and as some talk is certainly better than no talk. But on the major issues of trade, AI, Taiwan, and addressing China’s role in two theaters of war, there was little or no progress. Instead, ceremonial flourishes substituted for substance, unmasking the summit as yet another Trump vanity project.", "translation_ja": "", "vocab": []}, {"title_ja": "Human Rights and Populist Wrongs", "title_en": "Human Rights and Populist Wrongs", "summary_ja": "For the first time, all the UK’s political parties on the right favor withdrawing from the European Convention on Human Rights. But the story of the Hillsborough Law shows how human-rights laws, not least the ECHR, help ordinary people hold the state accountable for its costliest failings.", "summary_en": "For the first time, all the UK’s political parties on the right favor withdrawing from the European Convention on Human Rights. But the story of the Hillsborough Law shows how human-rights laws, not least the ECHR, help ordinary people hold the state accountable for its costliest failings.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/hillsborough-law-shows-how-human-rights-legislation-can-help-ordinary-people-by-murray-hunt-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Human Rights and Populist Wrongs\nFor the first time, all the UK’s political parties on the right favor withdrawing from the European Convention on Human Rights. But the story of the Hillsborough Law shows how human-rights laws, not least the ECHR, help ordinary people hold the state accountable for its costliest failings.\nOXFORD—The international order that emerged in the aftermath of World War II is confronting a legitimacy crisis, and the system for protecting human rights is no exception. Nationalist-populist narratives portraying human-rights treaties and the institutions that uphold them as examples of foreign interference in domestic politics, and thus undemocratic assaults on sovereignty, are taking hold even in countries that led the world in creating them.", "translation_ja": "", "vocab": []}, {"title_ja": "Is Another Eurozone Debt Crisis Looming?", "title_en": "Is Another Eurozone Debt Crisis Looming?", "summary_ja": "At a time when the cost of servicing sovereign debt is rising globally, France stands out as an especially fragile case. Its public debt-to-GDP ratio is edging up toward that of Greece on the eve of its sovereign-debt crisis, and the French political system seems unable to do anything about it.", "summary_en": "At a time when the cost of servicing sovereign debt is rising globally, France stands out as an especially fragile case. Its public debt-to-GDP ratio is edging up toward that of Greece on the eve of its sovereign-debt crisis, and the French political system seems unable to do anything about it.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/french-debt-crisis-problem-for-eurozone-and-global-economy-by-desmond-lachman-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Is Another Eurozone Debt Crisis Looming?\nAt a time when the cost of servicing sovereign debt is rising globally, France stands out as an especially fragile case. Its public debt-to-GDP ratio is edging up toward that of Greece on the eve of its sovereign-debt crisis, and the French political system seems unable to do anything about it.\nWASHINGTON, DC—In 2010, a Greek sovereign-debt crisis roiled world financial markets. Now, France threatens to do the same, but on a larger scale. Not only is its public debt-to-GDP ratio edging up toward that of Greece on the eve of its crisis, but the French political system seems unwilling or unable to address the country’s gaping fiscal deficit.", "translation_ja": "", "vocab": []}, {"title_ja": "Ken Paxton’s Christian identity politics obscure a history of scandal | Sidney Blumenthal", "title_en": "Ken Paxton’s Christian identity politics obscure a history of scandal | Sidney Blumenthal", "summary_ja": "The Texas Senate candidate rose to power as a culture warrior. His record is a marriage of hypocrisy and cynicism Ken Paxton’s political career, more than that of any other Republican candidate campaigning in this cycle, charts the arc of the religious right. The most influential of its activists an", "summary_en": "The Texas Senate candidate rose to power as a culture warrior. His record is a marriage of hypocrisy and cynicism Ken Paxton’s political career, more than that of any other Republican candidate campaigning in this cycle, charts the arc of the religious right. The most influential of its activists an", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/30/ken-paxton-christian-scandal", "state_media": false, "category": "オピニオン", "full_text": "Ken Paxton’s political career, more than that of any other Republican candidate campaigning in this cycle, charts the arc of the religious right. The most influential of its activists and donors engineered his rise as a culture warrior at each of its phases from his creation through every disgrace. His race for the Senate, the culmination of his ambition, has become not only his last stand, but also the Alamo for Christian nationalists in Texas.\nPaxton’s rap sheet explains his Christian identity politics as a shield to distract from the liability of his own record of financial and sexual scandals scrolling back decades. The 20 articles of impeachment against Paxton, adopted by the Republican-controlled Texas house of representatives in May 2023, were double the Ten Commandments that Paxton insists should be displayed in every Texas classroom.\nPaxton had allegedly engaged in bribery when a campaign contributor, Nate Paul, secured a job for Paxton’s alleged mistress, a former senate aide, at World Class Holdings, a real estate firm owned by Paul. Paul allegedly created a fake Uber account for Paxton to travel secretly for liaisons with his mistress and paid for renovations at Paxton’s house. In exchange, Paxton allegedly interfered with a federal inquiry into accusations of financial fraud against Paul involving $172m in loans by passing on sealed FBI documents, installing a special prosecutor in his office as the state’s attorney general to target and harass the federal agents and judges investigating Paul’s crimes, and halting foreclosures on Paul’s properties. In April 2025, Paul took a plea deal of four months of home confinement, five years of supervised release, and a $1m fine.\nThe Republican-dominated Texas senate by a 16-to-14 vote acquitted Paxton in his impeachment trial in September 2023. After Paxton’s federal indictment in 2015 on felony counts of financial securities fraud, he avoided trial by copping a plea under which he would perform 100 hours of community service, take 15 hours of legal ethics courses, and pay $271,000 in restitution to the fleeced investors.\nPaxton’s wife, the state senator Angela Paxton, attended the impeachment trial, but was barred from voting. She had been instrumental in advancing his career, a political force in her own right, a crucial conduit to Christian nationalist leaders and funders. They had met as students at Baylor University, had four children, and she presented their “sacred covenant” as a faith-based partisan calling. “I’m a pistol-packing mama, and my husband sues Obama,” she told cheering crowds. He financed her election with a $2m loan from his campaign fund, and once in office she filed bills to increase his office and salary.\nIn July 2025, Angela Paxton filed for divorce on “biblical grounds”. This July, Paxton was photographed on a trip to Iceland and London with the Christian influencer Tracy Duhon.\nThe religious right that raised up Paxton has cared little about his transgressions so long as they could prop him up to wield power. The alliance has been a perfect marriage of hypocrisy and cynicism in the name of traditional values.\nThe origin story begins at New Orleans’ legendary Café du Monde in 1967, where Paul Pressler and Paige Patterson forged a pact to take over the Southern Baptist Convention to transform it into a political machine for a “Conservative Resurgence” and to purge moderates. Both had been duly anointed for their holy task.\nPressler’s grandfather and hero, EE Townes, an oil industry lawyer, was a leader of the Texas Regulars movement in favor of “white supremacy”, as Townes explained, and the lifting of wartime price controls on oil and gas. The Regulars sought to defeat President Franklin D Roosevelt’s re-election in 1944. Four years later, the Regulars folded into the segregationist Dixiecrat party. Townes leveraged the election of his grandson, young Pressler, to the Texas house, where he sponsored pro-segregationist legislation.\nPressler sought out Paige Patterson, an apostle of WA Criswell, fundamentalist pastor of the mammoth First Baptist Church of Dallas, who denounced civil rights activists as “infidels” and John F Kennedy’s candidacy for president in 1960 on the basis that he was a stalking horse for the pope. Criswell would appoint Patterson the head of his Criswell Center for Biblical Studies, a power base of 14 churches.\nIn 1979, Pressler, by then appointed a Texas state judge, and Patterson applied their clout within the SBC to elect its president. “It was like Gettysburg,” said Pressler. “But this time the right side won.” Moderates were systematically fired from Southern Baptist seminaries and bureaucracy. “We are going for the jugular,” Pressler said.\nPressler and Patterson begat Kelly Shackelford, who in 1997 founded the First Liberty Institute, a Christian conservative legal organization, around which he created a powerful political machine, raising tens of millions from a handful of billionaire oilmen, mobilizi", "translation_ja": "", "vocab": []}, {"title_ja": "Burnham has a clear vision for Britain – but not for how it fits into a troubled world | Rafael Behr", "title_en": "Burnham has a clear vision for Britain – but not for how it fits into a troubled world | Rafael Behr", "summary_ja": "The Labour leader has set out his plans with passion and ambition, but the story he tells lacks a vital chapter on managing global chaos Andy Burnham is at home at Labour conference , and not only because it is in Liverpool and he has Merseyside roots. The prime minister is native to his political t", "summary_en": "The Labour leader has set out his plans with passion and ambition, but the story he tells lacks a vital chapter on managing global chaos Andy Burnham is at home at Labour conference , and not only because it is in Liverpool and he has Merseyside roots. The prime minister is native to his political t", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/29/andy-burnham-labour-conference-speech-vision-britain-world-trump", "state_media": false, "category": "オピニオン", "full_text": "Andy Burnham is at home at Labour conference, and not only because it is in Liverpool and he has Merseyside roots. The prime minister is native to his political tribe wherever it gathers. He is fluent in its sentimental vocabulary and indigenous to its folk traditions.\nKeir Starmer had solid Labour bona fides. He joined the party as a teenager. His parents named him after Keir Hardie. But he didn’t have Burnham’s knack for turning those red-team credentials into an emotional connection.\nStarmer liked to remind Labour that it had been unelectable when he took over and that the changes he enforced brought victory for the first time in a generation. It was true. But there’s a limit to the gratitude available to a leader who tells party members that their ideological instincts are the enemy of success. Tony Blair managed it for a decade because he kept winning. Starmer blew his credit almost immediately because he turned out not to have any instincts at all, or none that could set a coherent direction in government.\nNo one says that of Burnham. In the buildup to conference, ministers found it unnerving to have a leader who mused aloud on all kinds of things that might or might not be official policy, allowing beer back on to football terraces, for example, or a national care service free at the point of use.\nBut mostly it is refreshing to have a prime minister with clear priorities and a gift for narrating them, who tells a story about the country Britain could be and why only Labour could make it that way. It is energising for the party to be told they do not have to sneak up on power; that victory might be achieved without the submersion of ideological impulse.\nIn the preamble to his speech in Liverpool, Burnham warned of discomforting candour to follow. Most of what he then said came as a blessed relief to the faithful. It was an argument for social democracy rooted in the view that Britain took a disastrous wrong turn in the 1980s; that the ideological impetus of Thatcherism was socially atomising and economically disempowering. The party has wanted to hear that judgment delivered by a serving prime minister, without caveat and with a commitment to throwing the gears of privatisation into reverse, for a long time.\nIt was an argument for collective prosperity seeded by collective contributions made from a spirit of collective solidarity. Party lore counsels against fighting elections on such an unsqueamish left prospectus. Burnham is betting that he brings something special, a charismatic sway, that will break the curse.\nThere was a marked difference between this Burnham, open-collared, emotional, ardent, playing to his home crowd, and the one who looked nervous, face clenched with concentration, in a televised encounter with Donald Trump in New York last week. The first bilateral meeting with the US president was a tricky away game. Trump can be friendly but also ungracious and vindictive.\nThe prime minister came away largely unscathed. He had to endure a rebuke over British plans to transfer the Chagos Islands to Mauritius, but transatlantic relations were declared better than they had been under Starmer. Trump declared that the new guy “gets it” and “understands what he has to do”.\nThat is an ambiguous formula. It could imply appreciation for Burnham’s own agenda. It could also be a boss’s recognition that tribute has been received from a subordinate, and orders given.\nThe complexity of Trump-handling is an aspect of the job Burnham may not fully have grasped before entering No 10. The imbalance of power is obvious from the outside, but the way it operates through the machinery of national security – the finer points of technical dependency – are conveyed in classified briefings that an incoming prime minister gets from his military and intelligence officials.\nThat knowledge makes a compelling case for cosiness with whoever sits in the Oval Office. It was an easier task when US presidents honoured treaties and respected democratic allies. It is time-consuming to navigate around one who prefers corrupt despots.\nThat is one reason why so much of Starmer’s energy in office was consumed by foreign affairs, although he developed a dependency on international travel. The analgesic of summit protocol soothed an ego bruised by failure at home.\nBurnham is determined not to get sidetracked in the same way. He is happy for Ed Miliband to be a globe-trotting foreign secretary so he can be a stay-at-home prime minister. There were only glancing references to the rest of the world in his speech: a friendly nod to Ukraine, a stern eye on Russia and Iran. No mention of Trump.\nThere is logic to this domestic focus. Voters want to feel that the government is applying itself to their immediate problems, which tend not to be expressed in geopolitical terms. The promised change needs to materialise in people’s pockets. The improvement has to be visible on their high streets. Burnham can’t afford to lose that focus.\nThe proble", "translation_ja": "", "vocab": []}, {"title_ja": "Donald Trump's Maga cult is finally crumbling | Arwa Mahdawi", "title_en": "Donald Trump's Maga cult is finally crumbling | Arwa Mahdawi", "summary_ja": "With the midterms looming, and after the Epstein files and the war on Iran, Trump superfans are losing faith in their lame duck president It took a dead child sex offender and a disastrous war to do it, but it looks as though the Maga faithful are slowly beginning to lose confidence in their dear le", "summary_en": "With the midterms looming, and after the Epstein files and the war on Iran, Trump superfans are losing faith in their lame duck president It took a dead child sex offender and a disastrous war to do it, but it looks as though the Maga faithful are slowly beginning to lose confidence in their dear le", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/29/donald-trump-maga-cult-finally-crumbling", "state_media": false, "category": "オピニオン", "full_text": "It took a dead child sex offender and a disastrous war to do it, but it looks as though the Maga faithful are slowly beginning to lose confidence in their dear leader. As Donald Trump’s approval ratings drop to record lows, some of his most fervent supporters are turning on him.\nSee, as exhibit one, Trisha Hope, who was once a proud member of the Front Row Joes, a group of Trump superfans who follow the president to rallies around the country. They have custom-made T-shirts! They have branded baseball caps! They even have the attention of Trump himself, who frequently shouts out the group. He did once accidentally call them the “front row Jacks and Joes”, but who can expect a man of his calibre to pay attention to the plebs, eh?\nDuring Trump’s first impeachment, in 2019, Hope stationed herself in Washington DC for weeks, trying to drum up support for the president. But she’s not doing that again. In an interview with Politico published on Monday, Hope declared: “If we do lose the midterms and [Trump] is impeached again, I will be walking the halls of Congress in support of that impeachment.”\nWhat caused this change of heart? Hope cites the Iran war and the Epstein files as significant factors. So too does Rick Frazier, another defector from the Front Row Joes interviewed by Politico. “Epstein crimes and feeding the industrial military complex … those are big nos for me,” Frazier said.\nHope and Frazier are just two people with limited influence, but there’s another, much more powerful, Joe who has soured on Trump. Earlier this month the podcaster Joe Rogan, whose endorsement of Trump in 2024 is widely credited with helping him win the election, distanced himself from the president and his “rabid” supporters. “Trump supporters are fucking nuts, man,” Rogan said on his podcast. In the same episode, Rogan admitted that “I did kind of help Trump”, but insisted it was because he thought he’d drain the swamp. “Obviously, it’s not been ideal in that regard,” Rogan added.\nIt’s very satisfying to watch people wake up to the fact that the convicted felon in the White House is out for himself and nobody else. But Trump is a lame duck now. With the end of his very lucrative reign in sight, does it really matter that people like Hope are calling him “a fraud and liar”?\nIn the long term, the answer to that question is complicated. But growing disgust with the president certainly matters for the November midterm elections. Trump has asked voters to “pretend I’m on the ballot” and many have taken that advice to heart. A recent PBS News/NPR/Marist poll found that 45% of voters overall said their largest motivating factor for the midterms was voting against Trump. While he still has a loyal following, the midterms are likely to be a rebuke to his presidency, with Democrats now on a path to flipping the Senate as well as retaking the House.\nTrump’s desperate gimmicks and grandiose assurances aren’t landing the way they used to. This month, the president promised a $5,000 (£3,775) “Trump dividend” if Republicans retain control of Congress after the midterms. According to one poll, only 13% of voters believed him.\nIf Trump is worried about the midterms – and the possibility of a third impeachment that comes with a Democratic victory – he’s not letting it show. But Republicans more broadly are clearly stressed, not just about the midterms, but also about what sort of trouble they may be in when Trump 2.0 comes to an end. “After the first Trump administration, my family spent money we did not have on lawyers because of multiple partisan Democrat-led investigations into President Trump,” Katie Miller, the podcasting wife of Trump’s right-hand man, Stephen Miller, tweeted earlier this month. “You can’t convince me Democrats won’t do this again.”\nI hope they do. And this time I hope they do it properly, so that Trump and his enablers are at last held accountable. People who are finally leaving the Maga cult are angry at Trump, certainly, but they’re also angry at a world in which the powerful seem to get away with everything. To stop that anger from propelling another Trump-like figure into the White House, there needs to be a reckoning with the systems that created him. Let’s make Maga’s legal bills high again.\nArwa Mahdawi is a Guardian columnist", "translation_ja": "", "vocab": []}, {"title_ja": "The Scramble for the Open Seas", "title_en": "The Scramble for the Open Seas", "summary_ja": "Over the last half millennium, societies around the globe competed to divide up the world’s land. Nearly every square inch of soil outside Antarctica is now owned and tucked within national borders. But the oceans have largely been spared that fate. There were times throughout history when countries", "summary_en": "Over the last half millennium, societies around the globe competed to divide up the world’s land. Nearly every square inch of soil outside Antarctica is now owned and tucked within national borders. But the oceans have largely been spared that fate. There were times throughout history when countries", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/oceans-seas/scramble-open-seas", "state_media": false, "category": "オピニオン", "full_text": "Over the last half millennium, societies around the globe competed to divide up the world’s land. Nearly every square inch of soil outside Antarctica is now owned and tucked within national borders. But the oceans have largely been spared that fate. There were times throughout history when countries tried to gate and regulate the seas, but they were too vast to be controlled for long periods. During the Cold War, as technology made it far easier to imagine partitioning the world’s waterways and seabeds, great powers avoided an unrestrained race to grab the oceans. Most governments agreed to deal with them through a patchwork of treaties and multilateral bodies that sought to guarantee freedom of navigation in international waters and assign coastal seabeds to adjacent littoral states.\nThat order is now collapsing. The Houthis are disrupting shipping in the Bab el Mandeb Strait, the gateway to the Red Sea. Iran and Oman are planning to charge ships fees for using the Strait of Hormuz, a chokepoint for global energy supplies and fertilizers. In July, U.S. President Donald Trump even floated the idea that the United States could impose its own toll on Hormuz, only to later drop the plan.\nOther governments, too, are jockeying to claim international waters and marine resources for themselves. Russia is trying to assert control over vast swaths of Arctic waters and seabeds, China is building artificial islands in the South China Sea, the United States has expanded its claims to seabeds beyond its exclusive economic zone, and many countries are laying the groundwork to mine the ocean floor for critical minerals.\nThe institutions that have kept the oceans free and open are failing, and great powers have, in key areas, stopped abiding by the rules that have held for decades. States are already making moves to control the seas. If governments rush to claim the world’s waters, as they did its land, they will make global commerce more difficult and encourage a new era of seaborne conflict. A world in which the oceans are carved up will invariably be poorer and more dangerous.\nFOR WHOM THE STRAIT TOLLS\nGovernments around the globe are taking note of the success of the maritime blockades in the Middle East. Just as Iran announced that it intended to introduce a toll in Hormuz, Indonesia’s finance minister suggested that Indonesia might follow suit in the Strait of Malacca, a critical shipping lane in Southeast Asia that carries roughly 29 percent of global maritime oil flows. (He eventually walked back the idea.)\nThe closures of the Strait of Hormuz and the Bab el Mandeb Strait are just the latest in a series of violations of the norms and rules governing oceans. China, for instance, has routinely flouted a binding 2016 ruling under the UN Convention on the Law of the Sea (UNCLOS) that rejected China’s expansive claims in the South China Sea. Beijing contravenes the decision by continuing to build artificial islands on disputed reefs, infringe on the Philippines’ exclusive economic zone, and encircle Taiwan. Russia, for its part, is suspected of breaking UNCLOS rules by using ships with concealed identities to cut undersea cables as part of a broader campaign to unsettle European countries.\nThis aggression is possible in large part because the institutions responsible for managing the oceans are ineffectual. The International Tribunal for the Law of the Sea, the body that is supposed to mediate maritime disputes, is slow and lacks an enforcement mechanism. The same is true of the Permanent Court of Arbitration, which makes binding rulings on treaty violations. The UN Security Council, which could levy economic penalties or even greenlight military action to protect shipping, is almost always paralyzed by a veto from China, Russia, or the United States. Punishing undersea saboteurs is further complicated by the rules of jurisdiction. Only the country in which the ship is registered has prosecutorial authority, so perpetrating states can protect troublemaking crews by not pursuing cases.\nMIGHT MAKES RIGHT\nClimate change will spur new disputes over the oceans. Over the next two decades, as Arctic ice melts, the Northern Sea Route that connects Europe and Asia along Russia’s Arctic coast will see dramatic growth in commercial shipping. It is difficult to imagine Moscow allowing free access to that route. Russia already forces foreign vessels to submit to a complicated and suffocating system of permissions and permits to operate within its exclusive economic zone. It also treats corridors, such as the Vilkitsky Strait off the Siberian coast, as domestic waterways subject to Russian jurisdiction rather than international straits that grant the right of passage.\nFights over the oceans are not limited to controlling transit. As China has come to dominate and weaponize the existing global supply of land-based critical minerals, other countries are exploring the possibility of mining deep ocean seabeds. Areas such as the Clarion-C", "translation_ja": "", "vocab": []}, {"title_ja": "The Two Shocks Upending Latin America", "title_en": "The Two Shocks Upending Latin America", "summary_ja": "Why the region must brace for a new wave of turbulence.", "summary_en": "Why the region must brace for a new wave of turbulence.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/latin-america/two-shocks-upending-latin-america", "state_media": false, "category": "オピニオン", "full_text": "Across Latin America and the Caribbean, voters worried about rising crime have elected populists who promise to impose order and security in their countries. Some observers have read this development as a sign of a regional swing to the right, but there is little evidence of a durable shift in that direction. Rather than ideology, what seems to be driving voters is a frustration with traditional politicians’ failure to solve everyday problems. In the latest electoral cycle, voters rebelled against the breakdown of law and order; in the next, they may push back on rising costs and the region’s persistent social and economic inequalities.\nLatin American and Caribbean governments, already operating with limited fiscal space, must now grapple with two external shocks: the prolonged closure of the Strait of Hormuz and this year’s El Niño, a warming of sea surface temperatures in the Pacific Ocean that upends normal weather patterns. Both are fueling inflation, disrupting supply chains, and forcing cash-strapped, indebted governments to make hard choices.\nFor voters across the region, these twin crises have brought the economy back to center stage. Leaders such as Chilean President José Antonio Kast and Ecuadorian President Daniel Noboa, who won office on security-focused platforms, have seen their public standing plummet as economic woes deepen. Argentine President Javier Milei, who in 2023 ran an outsider campaign against economic mismanagement, faces an uphill 2027 reelection bid as Argentines struggle with day-to-day economic challenges despite the country’s macroeconomic improvements.\nAll this sets the stage for more political swings in the coming years, as climate change and geopolitical shifts generate shocks at a pace difficult for any government to contend with. That turbulence could fuel further polarization and reward populists whose promised solutions are unlikely to fix the structural flaws holding back growth.\nBut chaos is not inevitable. The region has the resources to adapt to a more unstable environment. Its critical minerals, abundant renewable energy, and strong agricultural sector are exactly what the world needs for food security, advanced technology, and the energy transition. To harness those resources, however, the region will have to overcome profound infrastructure deficits, strengthen the rule of law, and accelerate regional integration. Multilateral development banks and outside actors, such as the United States and Europe, can help by bringing in private investment for shared infrastructure, promoting intraregional trade and regulatory harmonization, and creating value chains where economic benefits are broadly shared. The alternative is a region that lurches from crisis to crisis, and from one extreme to another.\nSHOCK WAVES FROM HORMUZ\nDisruptions to energy and fertilizer markets stemming from the prolonged effective closure of the strait have already reshaped Latin American politics. In March, Kast saw his approval rating drop 14 points after he declined to issue consumer subsidies to soften the blow of rising energy prices. In April, Peruvians, upset by the sharpest monthly inflation spike in the country in more than 30 years, showed how economic anxiety can upend politics and open the door to populists. The leftist Roberto Sánchez unexpectedly surged in the first round of presidential elections but ultimately lost narrowly in the runoff to the right-wing candidate, Keiko Fujimori. In Argentina, despite a burgeoning hydrocarbon sector, higher energy costs have renewed inflation concerns and created a headache for Milei, whose disapproval rating spiked to 63 percent in late April, up from 49 percent at the start of the year.\nGiven the region’s dependence on imported gasoline and diesel, the economic toll of sustained high oil prices is only growing. The governments of the Dominican Republic, Nicaragua, and several small Caribbean countries have subsidized energy costs—a costly proposition as high prices persist. Elsewhere, governments cannot afford such relief, and consumers have been hit hard. The price of maize, a staple across Central America, rose by more than 60 percent in Honduras from 2025 to 2026. In Guatemala, soaring gasoline prices led to public protests.\nTo be sure, some countries have benefited from the turbulence in the energy sector. Chief among them is Guyana, whose oil revenues have grown more than 50 percent so far this year. Venezuela has also profited, although the long-term viability of its oil and gas sector remains in question in the absence of a meaningful democratic transition. The Trump administration’s deal with Interim President Delcy Rodríguez already faces congressional scrutiny that will only intensify if the U.S. midterm elections shift control of either chamber to the opposition Democrats. In Argentina, expanding shale oil and gas production has turned the country from a net energy importer into an exporter, boosting its dollar export revenues. Braz", "translation_ja": "", "vocab": []}, {"title_ja": "Russia’s Plan to Break Ukraine", "title_en": "Russia’s Plan to Break Ukraine", "summary_ja": "What Kyiv needs to survive.", "summary_en": "What Kyiv needs to survive.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/russias-plan-break-ukraine-dmytro-kuleba", "state_media": false, "category": "オピニオン", "full_text": "Since the beginning of July, Russian drones and missiles have been terrorizing Kyiv with exceptional intensity. Air raid sirens blare day and night, warning residents of oncoming fire and sending people running underground. Many of the drones have been shot down, but not all, and the ballistic missiles have largely gotten through, destroying buildings and killing civilians; so far, roughly 100 have died. The bombardments have become so intense that, in recent weeks, Ukrainians have been posting a grim joke on Instagram and TikTok: “Thank God I live in Kyiv, so I do not have to plan for the future.”\nKyiv has now endured almost five years of war, so its residents are used to hardship. But this kind of pessimism is new. For the first half of 2026, observers were celebrating what looked like a turning point in the conflict. After a year of grinding Russian progress, Ukraine learned how to better conduct precise middle- and long-range strikes, allowing it to hit Russian targets far behind the frontlines. As a result, Moscow’s progress came to a halt. The country, which was already losing too many troops, began incurring casualties that seemed unsustainable. Many analysts began to speculate that the Kremlin might soon have no choice but to settle.\nBut Ukraine’s new capabilities could not deliver victory. And this summer, Russia sharply increased its use of ballistic missiles and deployed fast, long-range, jet-powered drones at newfound scale. It also widened its set of targets. Before, the Russian military concentrated almost all its firepower on cities and towns near the frontlines, particularly in Ukraine’s eastern Donbas region. But now it has started mass bombing cities in the interior—particularly Kyiv. It is even reaching places along Ukraine’s western border.\nTogether, these changes are indicative of Russia’s new theory of victory. Moscow no longer hopes to win by merely capturing cities, or even by degrading Ukraine’s energy infrastructure. Instead, it wants to disrupt Ukraine’s whole economy and break the population’s morale by terrorizing urban centers. It aims to make city life so intolerable that residents and businesses flee, and it wants to sever the logistical connections between metropolitan areas. Moscow calculates that this will make Ukrainians increasingly angry at their own government for failing to protect them, weakening the country’s long-admired cohesion and internal resolve.\nThere is no guarantee that this plan will succeed. Ukraine is large, decentralized, and considerably more capable and resilient than even many of its supporters think. But the country’s economy is in dire straits, and its government is facing budget shortfalls that it needs outside help to fill. Moscow is betting that such help won’t soon arrive. Instead, it thinks that the price Washington and Europe are willing to pay to support Kyiv is limited, whereas the price Russia is prepared to pay to conquer Ukraine is not. Russia’s principal target, then, is not Ukraine’s territory or infrastructure. It is the will of the Ukrainian people and of their partners.\nHOLDING ON FOR DEAR LIFE\nNo one in Ukraine has ever been safe from the consequences of Russia’s invasion. People from every city and region have fought and died to protect their state. Stores everywhere suffer from shortages, and the economy has contracted. Still, the invasion has not affected the whole country equally. People living near the frontlines have faced constant bombardments and the imminent threat of occupation, whereas those in the rear can, at times, tune out the conflict.\nThat is changing now that Russia is targeting places far from the battlefield. In Kyiv, for example, residents used to face a few drone and missile barrages a week—disruptive, but not enough to stop city residents from going about their lives. Now Russia is continuously sending projectiles toward the capital, day and night. On August 27, Kyiv registered a record 13 air raid alerts in a single day. On the night of September 8, a single alert stretched for ten hours, from 7:39 PM until 5:40 AM. Two weeks later, nothing had changed: Kyiv had 11 alerts on September 23 and a nine-hour alert the next morning. A month ago, those of us living in the city would go to sleep expecting a large overnight attack but knowing that it would probably be followed by a normal workday. Today we live with constant sirens and chaos.\nSo far, Kyiv has borne the brunt of Moscow’s increased bombings. But Russia’s attacks are beginning to hit other relatively protected cities, as well. On the night of July 30, Russia fired more than 20 cruise missiles at Lviv, a city just 45 miles from the Polish border, killing a 35-year-old police officer and injuring 38 people. In mid-September, drones reached the western Ukrainian city of Lutsk, setting a passenger railway carriage on fire. Russia has attacked Ivano-Frankivsk, Ternopil, and Stryi—all cities in Ukraine’s interior. And across the country, Moscow’s forces are d", "translation_ja": "", "vocab": []}];
const FOCUS = null;
let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-01 00:12 JST";
  renderTabs();renderList();
})();
</script>
</body>
