e official statements from police, emergency services, or investigators regarding any motive.\nHere's what we know.\nWhat happened to the flight?\nFlydubai's flight FZ1073 took off from Dubai International Airport in the United Arab Emirates at 03:05 GMT (07:05 local time) en route to Ben-Gurion Airport in Israel.\nThe flight was carrying at least 150 people, with Netanyahu saying \"almost all\" passengers were Israeli.\nData from flight tracking website Flightrader24 shows a rapid descent for the plane over Saudi Arabia around two and a half hours after take-off, dropping more than 17,000 feet (over 5,000m) in less than two minutes at around 05:21.\nMinutes later, the plane signalled an emergency code - squawk 7700 - before switching it to a squawk 7500 code reporting a hijacking.\nAt 05:40, the plane - which had briefly entered Jordanian airspace - looped back into Saudi Arabia, where it later started its manual descent for landing.\nLess than an hour later, the plane returned to squawk 7700.\nInitial local media reports cited Israeli officials as saying a fight had broken out between two pilots.\nBut, speaking on Wednesday following the incident, Netanyahu confirmed later reports that one pilot had stabbed the other before \"apparently trying to crash\" the plane.\nHe said an Israeli passenger told him \"the plane went into a spin and began to descend\" before the passenger and a crew member broke into the cockpit and overpowered the \"pilot who had carried out the stabbing\".\nThe plane was diverted to Tabuk Airport in northwestern Saudi Arabia and touched down at 06:58, according to location data.\nThe stabbed pilot, who is in a stable condition according to the Indian embassy in Saudi Arabia, was later identified as Indian national Capt Smit Machchhar.\nPaying tribute to Machchhar, Netanyahu hailed him as a \"true hero\" and said \"he saved the lives of 174 people, including Israeli citizens and other nationals\".\nWhat have passengers said?\nPassenger Yaniv H trol,\" she told Israeli newspaper Israel Hayom.\n\"There are people here with shirts covered in blood,\" she said, adding: \"Now we are fine and want to return home.\"\nWhat has the response been so far?\nShortly after the incident, the Israeli and Saudi Arabian air forces dispatched fighter jets, while Netanyahu held urgent consultations.\nSpeaking later on Wednesday, Netanyahu called the situation a \"a", "translation_ja": "", "vocab": []}, {"title_ja": "Putin shows no sign of stopping the war as Russia doubles down on Ukraine", "title_en": "Putin shows no sign of stopping the war as Russia doubles down on Ukraine", "summary_ja": "A foreign policy speech by the Russian president will be keenly watched, but all signs point to the full-scale invasion continuing.", "summary_en": "A foreign policy speech by the Russian president will be keenly watched, but all signs point to the full-scale invasion continuing.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqx2ze420kpyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Putin shows no sign of stopping the war as Russia doubles down on Ukraine\n- Published\nWhen Vladimir Putin arrived to address Russia's parliament on Wednesday, a warm welcome was guaranteed.\n\"The Special Election Operation\", as one Russian newspaper dubbed last month's legislative vote, has produced a State Duma even more pro-Putin than anything before it.\nThe ruling party, United Russia, now has more MPs than ever.\nIt allows the Kremlin to claim it has been handed a huge mandate from the Russian people.\nBut for what? How will Putin use it?\nAre there any signs he is prepared to halt what he calls the special military operation? Or should we brace for further escalation in Ukraine and in tensions with Europe?\nOn Thursday I'll be watching to see whether Russia's leader sheds light on his plans during an appearance at the Valdai Discussion Club in Moscow. Traditionally the president's speech at this annual foreign policy forum provides insight into Putin's world view.\nRight now, everything points to Putin continuing Russia's full-scale invasion of Ukraine: despite his country's huge battlefield losses to date and the damage being done to Russia's economy.\nPutin's speeches and statements suggest he remains confident that Russia can secure a military victory.\nJudging by what is being reported in Russian media, Moscow is encouraged by the shortage of air defence missiles in Ukraine, as well as the expectation that Russian strikes this winter will increase pressure on Ukrainians. Kyiv has spoken of its difficulty in shooting down Russia's ballistic missiles and new jet-powered drones, which have been targeting Ukraine every day.\nAnd further afield?\nThe Kremlin has made no secret of the fact it wants European states to slash their military and financial backing for Ukraine: the kind of support Moscow says is prolonging the war - or, rather, getting in the way of a Russian victory.\nTo achieve this, Western officials believe Russia has been sending not so subtle signals.\nThey accuse Moscow of waging an escalating hybrid war on European countries through cyber-attacks, acts of sabotage, and Russian drones violating European airspace. In Germany, a drone carrying an explosive device was found close to Ukrainian cargo planes at Leipzig airport.\nA covert campaign in the \"grey zone\", that space between peace and war.\nThis week I asked Russia's foreign minister, Sergei Lavrov, does he admit that his country is waging a hybrid war against European countries?\n\"Do you mean when we destroy drones and missiles that Britain and continental Europe are supplying Ukraine with, and which are used to attack us?\" Lavrov replied.\n\"If you admit your weapons are being used to strike us and we destroy them, call it whatever you want. But I have no doubt this is a war Europe is waging against us. We've been saying so for a long time.\"\nThat, indeed, has been the official Russian stance for some time: that what is happening in Ukraine amounts to a European war on Russia. It is a narrative that skips over the fact that in 2022 it was the Kremlin that launched a full-scale invasion of Ukraine, and that Russia continues to wage war there.\nHow far would Russia go to sever European support for Kyiv?\nIs Moscow, for example, actively preparing to initiate military conflict in Europe with a Nato member state? That seems unlikely. After more than four-and-a-half years of war Russia's army has not yet managed to occupy the whole of Ukraine's eastern Donbas region, right next door to Russia.\nFighting Europe may not be the plan, but freaking it out, to reduce support for Kyiv, could well be the intention.\nListen to the messaging.\n\"If they continue this war, a European war with American help, against Russia, on Ukrainian territory, sooner or later we'll feel the need to escalate,\" warns prominent foreign policy strategist Sergei Karaganov, honorary chairman of Russia's Council for Foreign and Defence Policy.\n\"According to my scenarios, the first series of blows will be conventional,\" he told me. \"But if Europe does not surrender, unfortunately, we will have to go nuclear. There will be little left of some European countries.\"\nBut if Russia went nuclear there would be a response from Europe, and nothing would be left of Russia, I suggest.\n\"No, there will be no response from Europe,\" said Karaganov. \"What, Britain will attack Russia with nuclear weapons? I hope you're not that crazy. I'm sure the Americans are not that crazy.\"\nI asked him if he agreed the last four-and-a-half years had been disastrous for Russia, in terms of casualties and the worsening security and economic situation.\n\"We've lost a lot of people, yes,\" he admitted, \"and I criticise my government for not being rough enough. But now we are getting rough enough in Ukraine. We're doing away with Ukraine as a viable state.\"\nIf \"doing away with Ukraine as a viable state\" is Moscow's goal, it is hard to imagine the war ending soon.\nMeanwhile, Russia continues to rail against what it sees as the d", "translation_ja": "", "vocab": []}, {"title_ja": "US Supreme Court allows execution of Christa Pike to go ahead", "title_en": "US Supreme Court allows execution of Christa Pike to go ahead", "summary_ja": "The death by lethal injection was scheduled to happen earlier on Wednesday before a lower court paused the execution.", "summary_en": "The death by lethal injection was scheduled to happen earlier on Wednesday before a lower court paused the execution.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq8r6rjdvlx6o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "US Supreme Court allows execution of Christa Pike to go ahead\n- Published\nThe US Supreme Court has cleared the way for Tennessee inmate Christa Pike to be executed, overturning a last-minute reprieve.\nThe killing by lethal injection was scheduled for Wednesday morning before judges from the Sixth Circuit Appeals court halted the execution. Tennessee's attorney general then immediately requested the Supreme Court to overrule the lower court's stay.\nPike, 50, has been awaiting execution since she was convicted and sentenced to death in 1996 for the murder of Colleen Slemmer.\nIf the execution proceeds, Christa Pike will be the first woman to be executed in Tennessee in more than 200 years. It was not immediately clear when the execution would take place.\nSupreme Court Justice Brett Kavanaugh granted the application to vacate the stay of the execution. No explanation for lifting the stay was provided in the order.\nThe top court's three liberal justices - Justices Sonia Sotomayor, Elena Kagan and Ketanji Brown Jackson - dissented in Wednesday evening's order.\nSotomayor wrote that she dissents because the decision cleared the way for Tennessee to execute Pike before her pending legal challenges to her conviction \"can be properly considered\".\n\"Tennessee's desire to expedite Pike's execution by a few days or even weeks cannot outweigh her 'fundamental interest in [her] own life,\" she said.\nThe latest ruling from the Supreme Court came just before 18:00 local time, hours before the state's execution order is set to expire at midnight. If time runs out the Tennessee Supreme Court will need to set a new execution date, the Associated Press reports.\nIn a ruling earlier on Wednesday, judges from the Sixth Circuit Appeals court paused the execution saying they needed more time to consider the arguments in Pike's case.\nPike's lawyers said that for years, the state of Tennessee argued in court that she had lied about being sexually abused as a child.\nBut at a recent hearing about her execution method, the state said it did not dispute she suffered sexual abuse and rape.\nPike's legal team asked the appeals court to send her motion back to the district court, arguing that if the federal courts based their ruling on the state's earlier claim that she was lying, then the federal review was affected.\nEarlier this week, the Supreme Court refused to hear a different appeal from Pike.\nTennessee governor also denied a clemency request this week from the death row inmate.\nPike was 18 when she and her then-boyfriend, Tadaryl Shipp, beat, tortured and murdered Colleen Slemmer, a 19-year-old they met at a job training camp for troubled teens.\nRelated topics\n  - Published8 hours ago\n  - Published3 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "Veteran broadcaster Dame Esther Rantzen dies aged 86", "title_en": "Veteran broadcaster Dame Esther Rantzen dies aged 86", "summary_ja": "Rantzen, who fronted the BBC's That's Life for two decades, went on to found Childline, and in recent years had been a campaigner for assisted dying.", "summary_en": "Rantzen, who fronted the BBC's That's Life for two decades, went on to found Childline, and in recent years had been a campaigner for assisted dying.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4g4z255y30o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Veteran broadcaster Dame Esther Rantzen dies aged 86\n- Published\nDame Esther Rantzen, who presented BBC show That's Life! for 21 years and launched the charity Childline, has died at the age of 86.\nPrime Minister Andy Burnham said the veteran broadcaster and campaigner had \"changed countless lives\".\nDame Esther hosted and produced That's Life! during its run from 1973 to 1994. It regularly attracted 20 million viewers for its mixture of serious consumer investigations and light-hearted items.\nShe launched Childline, a British counselling service for children and young people, in 1986, and in 2013 she launched Silver Line to help elderly people suffering from isolation and loneliness. Later in life, she became a prominent campaigner for the legalisation of assisted dying.\nShe had been terminally ill with lung cancer. In December 2023, she revealed she had joined Dignitas, the Swiss assisted dying clinic.\nBut in a statement given to the Press Association earlier this month, she said that despite having \"spent the money and made the plans\" to go to Dignitas, she had since reached the point where she was \"too physically fragile to make the journey\".\nShe added that the law must \"change and change quickly\", as she renewed her plea ahead of the latest debate and vote on the Terminally Ill Adults (End of Life) Bill, which failed to pass through the Commons.\nThe broadcaster revealed her cancer diagnosis in January 2023, saying the news had prompted her to express \"profound thanks to everyone who has made my life so joyful\".\nIn a statement announcing her death on Wednesday, Dame Esther's family paid tribute to the \"most wonderful mother\" and \"cherished grandmother\" whose compassion would live on through her charities.\n\"We hope the humour, ingenuity and audacity she brought to her work may continue to inspire you as it will do us.\"\nRantzen joined BBC radio as a sound effects assistant before becoming a TV researcher, and in 1968 she trained as a producer and director.\nThe young broadcaster became a researcher and reporter for Bernard Braden's consumer affairs programme, Braden's Week.\nWhen That's Life! launched in 1973, she was its figurehead and became a popular fixture on screens as the show's formidable and fun-loving presenter and producer.\nThe consumer show's notable items, according to her website, external, included \"talking dogs, Jobsworth Awards and campaigns on behalf of abused children, organ transplants, safe playgrounds, and to provide justice for consumers\".\nIts most-viewed episode featured Sir Nicholas Winton being introduced for the first time to survivors he had saved from the Holocaust, during a 1988 instalment of the show.\nLater in her career, she also appeared on Strictly Come Dancing, First Dates and I'm a Celebrity... Get Me Out of Here!\nDame Esther was married to documentary film-maker Desmond Wilcox from 1977 until he died in 2000. They had three children.\nShe was made a dame in 2015 for her services to children and older people.\nDame Esther went on to become a vocal campaigner for the legalisation of assisted dying.\nIn December 2024, she spoke of her \"great relief\" after MPs backed proposals to legalise assisted dying in England and Wales, before they ultimately stalled in the House of Lords.\nIn an interview with the Sunday Times, external in November 2025, before the bill ran out of time, she said that \"as long as others in the future will be able to ask for help to die as they choose, I will die happy\".\nShe expressed her disappointment after MPs voted against a fresh attempt to introduce the legislation in September. Some disability campaigners described the result as a \"victory\", while Dame Esther said it was \"deeply sad that it won't come soon enough for many of the people who need it\".\n\"I am sure a change in the law will come,\" she added.\n'Strength and feistiness'\nFigures from politics, broadcasting and the charity sector have paid tribute to Dame Esther for her impact on public life.\nThe prime minister said he would \"always admire the characteristic courage and openness with which she spoke about her illness, making us all think about the difficult questions we face at the end of life\".\nBBC director-general Matt Brittin paid tribute to Dame Esther as a \"legend of British broadcasting\" whose contribution to public life was \"immeasurable\".\n\"Her warmth, spirit and fight for justice and action that we saw on our screens continued long after the programme ended, with a lifetime of campaigning where she changed the lives of millions,\" he said.\nKim Leadbeater, the Labour MP who sponsored the assisted dying bill, told the BBC that Dame Esther was a \"wonderful mix of strength and feistiness, but also really deep compassion and kindness\" - and that she would continue to inspire campaigners.\nChris Sherwood, the chief executive of the NSPCC, which runs the Childline helpline, said Dame Esther had gone to \"exceptional lengths to ensure children and young people across the UK had somewhere to turn whe", "translation_ja": "", "vocab": []}, {"title_ja": "Employers should teach primary-age children about work, says Milburn", "title_en": "Employers should teach primary-age children about work, says Milburn", "summary_ja": "The author of a major report into youth activity in the UK says children as young as four should be learning about careers.", "summary_en": "The author of a major report into youth activity in the UK says children as young as four should be learning about careers.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr2kwlw0p3v9o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Employers should teach primary-age children about work, says Milburn\n- Published\nChildren should be introduced to the world of work at the start of primary school, says the author of a major report into youth activity in the UK.\nFormer minister Alan Milburn says children as young as four should be learning about different careers, with work experience placements made mandatory for 14- to 16-year-olds.\nHowever, teaching unions warn of the \"significant pressure\" already facing primary schools and say practical considerations must ensure all schools have access to the support.\nThe latest data from the Office for National Statistics (ONS) suggests 981,000 people aged 16 to 24 in the UK were not in education, employment or training (known as Neet), between April and June 2026.\nMilburn told the BBC \"in primary school, it's really about opening their eyes and giving them a sense about what is possible\".\nDespite a push towards apprenticeships and work experience in Years 10 and 11, for many the journey towards becoming Neet starts well before their 16th birthday.\nAs a result, Milburn says children should be introduced to the world of work much earlier in their school journey, with dedicated space in the curriculum to \"broaden horizons\".\nHe told the BBC this could be achieved by employers giving talks in primary schools and offering taster sessions to children.\n\"It'd be good if employers came into schools and said, 'Look, this is what's going on, these are things that are possible.'\"\nMilburn says that for Key Stage 4 pupils - aged between 14 and 16 - experience must be given in a real workplace with employer feedback.\n\"Work experience needs to be mandatory. It makes a big difference,\" he told the BBC.\nMilburn also emphasised the difficulty some young people face when trying to find work experience placements.\n\"There are about four in ten people aged 14-16 who aren't getting any work experience at all,\" he said. \"In other schools, students are told to go off and find their own work experience and that often relies on the network of Mum and Dad.\"\nThese recommendations are due to be published in the final instalment of his government-commissioned report into the issue, which is expected to be published in the autumn.\nEducation is devolved in the UK, so while Milburn's review looks at the picture in all four nations, his recommendations regarding education are specific to England.\nCurrently in England, careers guidance must be offered to students aged 11-18 and work experience is not statutory.\nThe government has said its vision, external is to \"guarantee two weeks' worth of work experience for every young person\" in England.\nIn both Scotland and Wales, career-based learning is already a requirement in schools for students as young as three.\nEmma, from Kirklees, has grandchildren in Years 1, 2 and 4 and thinks primary school is too young to be introducing careers talks.\n\"In primary school, there is too much trying to get little kids to grow up too quickly,\" she says.\n\"Just let them be little kids. I know they have to learn and the world's changing, but still, give them a chance to be kids.\"\nBut Zoe, another parent, disagrees.\n\"I think it's a good idea,\" she says. \"It's something that everyone has to do, so if you learn early, it's something they don't have to learn later on.\"\nTeaching unions have responded positively to the idea of introducing career-based learning into schools at a younger age, but have warned about the burden this could place on primary schools in particular.\nPaul Whiteman, general secretary of school leaders' union National Association of Head Teachers (NAHT), warns of the \"significant pressure\" already facing primary schools.\n\"Whenever new mandatory requirements are proposed, it is important to be clear about what might have to give way to make room for them,\" he says.\nWhiteman also highlights the value of existing programmes such as \"Primary Futures\", which bring in volunteers from different professions into schools to \"challenge stereotypes and raise aspirations\".\n\"The earlier young people can begin to make connections between what they learn in school and the possibilities that lie ahead, the better,\" Whiteman says.\nPepe Di'Iasio, general secretary of the Association of School and College Leaders (ASCL), says having someone come into the classroom can really \"enlighten [children's] motivation... and give them that sense of passion for all the opportunities beyond the classroom\". Although he acknowledges that finding opportunities in rural areas could be more challenging.\nGet in touch\nAre you affected by issues covered in this story?\nRelated topics\n  - Published17 September", "translation_ja": "", "vocab": []}, {"title_ja": "Vape prices to rise as new tax takes effect", "title_en": "Vape prices to rise as new tax takes effect", "summary_ja": "Vaping is about to becoming more expensive due to a new tax on products.", "summary_en": "Vaping is about to becoming more expensive due to a new tax on products.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6j4jrjgv2j7o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Vape prices to rise as new tax takes effect\n- Published\nThe price of vapes is set to rise as a new tax comes into effect, with the aim of making vaping less attractive to children and young people.\nThe Vaping Product Duty will be imposed at a rate of £2.20 per 10ml of e-liquid. However, many customers will not see a jump in prices immediately, as sellers have six months to sell old stock at the pre-duty price.\nThe government wants to reduce the appeal of vapes by making them more expensive, as more evidence of its adverse effect on health comes out, particularly on children and young people.\nThe vaping industry has lobbied against the new tax, saying that affordable vapes help people to quit smoking.\nThe duty will apply to all vaping products regardless of whether they contain nicotine.\nTobacco rates were also raised on Thursday, by £2.20 per 100 cigarettes or 50g of tobacco. HMRC said this maintains the financial incentive for smokers to switch to vaping.\nStocking up v cutting down\nThe BBC spoke to vapers in Reading who had mixed views on whether the new tax would encourage people to quit.\nMackenzie Bird, 19, has been a regular vaper for three years. She said she was \"fine\" with the duty and it wouldn't stop her from vaping.\n\"I don't know how many people it'll actually deter,\" she said.\n\"I'll probably just stock up.\"\nHowever, Cara Lewis-Rimes and Dylan Killner said they might reconsider the habit in light of higher prices.\nCara said she thinks the changes will force vapers to cut down because of the cost of living.\nDylan said he might be inclined to quit altogether.\n\"I don't think it's doing me any favours... the health factor around it as well is not great.\"\nFighting illegal trade\nHMRC is also launching a stamp for vaping products which are traceable throughout the supply chain.\nAll vapes sold in the UK must carry this stamp from April.\nThe new tax is also an effort to combat illicit trade, which is a growing problem on UK high streets. Last month, the prime minister announced new powers for councils that will address the decline of the high street, including the amount of vape shops.\nChanges to planning law in England mean every new shop selling e-cigarettes, or vapes, would need to apply to their local council for permission to open.\nHealth Minister Karin Smyth said: \"These measures are an important step in our ambition to tackle youth vaping by reducing the affordability of vaping products, which goes hand-in-hand with the work we are already doing to tackle the appeal and availability of vapes on our high streets.\"\nJames Murray, the Financial Secretary to the Treasury, said the government was \"backing all those retailers who play by the rules\".\nBut Jordan Apap, a sales assistant in Berkshire Vapers, said the new tax would \"put a lot of strain on legitimate vape shops\" that provide more specialist advice and services than convenience stores and phone shops that sell vapes.\n\"There is a real and genuine risk that we will cease to exist within a year or two,\" he said.\n- Vaping rates for schoolchildren appear to drop - is it falling out of favour? \n  - Published22 September\n- Police raid barbers and vape shops suspected of being fronts for crime gangs \n  - Published10 April 2025\nJohn Dunne, the director general of the UK Vaping Industry Association, said: \"This is nothing short of a tax on public health.\"\nHe said vapes had helped \"millions of adults cut down on or stop smoking\".\n\"Protecting young people is essential. But that means stronger enforcement against illegal and rogue traders, not making legal vaping more expensive for adults trying to stay away from cigarettes.\"\nExperts say vaping is much safer than smoking, but it is not risk free and the long-term effects are less clear.\nA recent review of vaping studies found that it had an association with problems in children and young people including wheezing and coughing, poor oral and dental health, poor sleep, mental health problems and eye symptoms.\nThe NHS has said that children and non-smokers should never vape.\nAdditional reporting by Neranjana Elapatha", "translation_ja": "", "vocab": []}, {"title_ja": "France: Hundreds arrested as student protests escalate", "title_en": "France: Hundreds arrested as student protests escalate", "summary_ja": "Student protests have grown in scale and intensity, with violent clashes in some places leading to hundreds of arrests and dozens of injuries.", "summary_en": "Student protests have grown in scale and intensity, with violent clashes in some places leading to hundreds of arrests and dozens of injuries.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/france-hundreds-arrested-as-student-protests-escalate/a-79495633?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "France: Hundreds arrested as student protests escalate\nOctober 1, 2026\nSecurity forces in France on Wednesday detained over 600 people as protests at high schools in parts of the country have intensified.\nAuthorities said violent clashes and arson attacks have also left dozens of security personnel wounded.\nInterior Minister Laurent Nunez condemned what he called an \"escalation of violence\" outside certain schools.\nThe violence left 83 police officers and gendarmes wounded on Wednesday, he said, adding that 32 teachers and pupils were also injured. The protests affected 356 schools, the minister noted.\nHe slammed the \"targeting of law enforcement officers, the throwing of projectiles, acts of violence, verbal abuse, attempted arson, and what amounts... to urban violence.\"\nWhy are students protesting?\nTeenagers at French lycées (equivalent to US high schools) have been blockading their schools since last week.\nThey are protesting overcrowded classes, heavy workloads, poor-quality learning materials and teacher shortages.\n\"There are cockroaches and rats everywhere in the school,\" Fadila, a 17-year-old student, told the Reuters news agency. She said temperatures in classrooms could swing from sweltering to below freezing, depending on the weather.\nThe movement began in the Ile-de-France region around the capital, Paris, but has since spread to other regions.\nThe cities worst affected Wednesday include Paris, Bordeaux in the southwest and Lyon in the southeast, and the northern city of Lille, where police again used tear gas in clashes, the AFP news agency reported.\nWhat did the government say?\nPresident Emmanuel Macron said the young people's concerns were legitimate but could in no way justify violence and attacks on police officers and teachers, among others.\n\"High schools are meant to be open and to share knowledge. They are not meant to be blockaded or to have trash cans set on fire,\" he told reporters in Madrid.\nBoth Macron and Nunez accused far-left groups of inciting violence during the protests.\n\"We observed that, in certain places, there were individuals acting as agitators — people who, moreover, moved from one school to another to stir up high school and other students and incite them to commit acts of violence,\" Nunez said.\nOver the past few days, officials and politicians have denounced the left-wing La France Insoumise (France Unbowed or LFI) party and its presidential candidate Jean-Luc Melenchon for rhetoric they said was stoking students' anger.\nOn Monday, Melenchon had accused the government of implementing a \"crackdown\" with \"obvious racist undertones.\"\n\"Hands off our youth!\" he wrote on social media, while encouraging LFI activists and officials to support the protests wherever they could.\nPrime Minister Sebastien Lecornu called the accusation of racism \"an insult\" and accused Melenchon of \"racializing a debate about student security and adding to division where a responsible politician should be looking to restore calm.\"\nEdited by: Sean Sinico\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Gaza: NGO reports dire camp conditions, says Israel is moving 'Yellow Line'", "title_en": "Gaza: NGO reports dire camp conditions, says Israel is moving 'Yellow Line'", "summary_ja": "The Danish Refugee Council alleges that Israel is employing \"a policy of protracted displacement\" in Gaza. It says the so-called \"Yellow Line\" is creeping west toward the coast, preventing many from returning home.", "summary_en": "The Danish Refugee Council alleges that Israel is employing \"a policy of protracted displacement\" in Gaza. It says the so-called \"Yellow Line\" is creeping west toward the coast, preventing many from returning home.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/gaza-ngo-reports-dire-camp-conditions-says-israel-is-moving-yellow-line/a-79488777?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Gaza: NGO reports moving 'Yellow Line,' dire camp conditions\nOctober 1, 2026\nA new report on conditions in the Gaza Strip says that the roughly 1.8 million Palestinians in Gaza, or 86% of the population, living in displacement sites often face inhumane living conditions.\nThe Danish Refugee Council (DRC) published its findings on Thursday, almost three years after the October 7 terror attacks against Israel that triggered the war in Gaza, and a year after the phased October 10 ceasefire plan that was supposed to usher in the war's end.\n\"The October 2025 ceasefire in Gaza was supposed to end civilians' suffering. Nearly a year on, it exists largely in name only. Displacement in Gaza has not ended; it has changed shape,\" the report says.\nThe findings are based on group discussions with 195 people living in internal displacement camps across five governorates in Gaza.\nWhat did the DRC say about the Yellow Line?\nEntitled \"Confined by Design: The Human Cost of Protracted Displacement in Gaza,\" the report accuses Israel of \"a policy of protracted displacement\" since the ceasefire deal was reached.\nOne means of ensuring this, the DRC says, is the so-called \"Yellow Line,\" which demarcates the area of eastern Gaza near the border that is controlled by the Israeli military and is, according to the report, creeping toward the coast.\n\"In addition to protracted displacement for hundreds of thousands of people, the defining feature of the so-called ceasefire is the Yellow Line which continues expanding westward and swallowing up more land, effectively squeezing families into 30% of Gaza's territory,\" said the NGO's country director for the occupied Palestinian territories, Alan Moseley.\nOther groups, including the UN, have also reported the westward movement of the Yellow Line, as has the Israeli government, although some details differ.\nLast month, Israeli Prime Minister Benjamin Netanyahu put the share of Gaza's territory inside the Yellow Line at 60% rather than 70%, but he also said the plan was to expand the area.\nThe DRC report also said aid organizations \"describe being unable to operate within several kilometers of the line, either due to access constraints or security concerns.\"\nIt said that this led to crucial aid and supplies failing to reach displacement camps nearer the boundary.\nWhat did the report say about living conditions in displacement camps?\nThe DRC and the Agricultural Development Association (PARC) highlighted a series of major shortcomings in the often informal tent shelters and makeshift camps that have sprung up amid Gaza's rubble, where more than eight in 10 residents are believed to be living.\nThese included but were not limited to:\n- 80% of respondents reporting shortages of water both for washing and drinking\n- Displaced households relying on outdoor cesspits\n- Multiple families sharing single latrines, increasing the risk of gender-based violence and abuse\n- Rat and rodent infestations exacerbated by the unsanitary conditions\n- Food scarcity and lacking infrastructure for cooking, increasing risks of burns or injury preparing meals\n- Rapid localized spread of illnesses and infections. For instance, more than 4,000 chickenpox cases were recorded in Khan Younis displacement camps in July alone\n- Lacking and overburdened medical facilities with only half of hospitals and just over a third of primary healthcare centers still operational\n- Lacking or non-existent formal education provision for young people, now lasting almost three years in some cases\n- Reports of security concerns, particularly among men, because of the continued presence of artillery strikes, drones and stray gunfire\n- Safety risks posed by unexploded and undiscovered ordnance, particularly when trying to clear rubble or return to areas where people originally lived\nThe Danish Refugee Council also laid particular emphasis on lacking site management mechanisms at displacement camps.\nIt said only 36% of sites currently had a designated site manager, typically a national NGO, coordinating services and managing conditions.\nSites with such partners \"have a structured community channel through which a gap, such as a collapsing cesspit, a missing water delivery, or an unsafe walkway, can be identified, escalated, and resolved,\" the report said.\nIsrael has not yet commented on the newly released report.\nWhat actions did the DRC recommend?\nThe DRC and PARC issued a number of appeals and recommendations, some to \"all parties to the conflict,\" most to \"the Government of Israel, as the occupying power of Gaza\" and others to \"the international community\" and \"donors and humanitarian actors.\"\nThese included:\n- Completely upholding pledges to cease hostilities\n- Ending attacks against civilians, humanitarian workers and medical personnel\n- Guaranteeing humanitarian access and medical evacuation pathways\n- Supporting the establishment of a UN mechanism to monitor ceasefire violations.\nThe groups called on Israel to \"halt the further expansion ", "translation_ja": "", "vocab": []}, {"title_ja": "Five EU states plan first deportation center in Africa for 2027", "title_en": "Five EU states plan first deportation center in Africa for 2027", "summary_ja": "Greece, Germany, Austria, Denmark and the Netherlands are moving forward with plans to establish deportation centers outside the EU. An African partner country has reportedly already been selected.", "summary_en": "Greece, Germany, Austria, Denmark and the Netherlands are moving forward with plans to establish deportation centers outside the EU. An African partner country has reportedly already been selected.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/five-eu-states-plan-first-deportation-center-in-africa-for-2027/a-79490162?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "EU states plan first deportation center in Africa for 2027\nSeptember 30, 2026\nDeportation centers are legally contentious, expensive and the subject of political controversy: For years, Brussels has been grappling with the issue of establishing such centers outside the EU for rejected asylum seekers. Previous attempts have failed due to legal objections, but now, a \"group of five\" consisting of Greece, Germany, Austria, Denmark and the Netherlands believes it has overcome these hurdles.\nDuring an interview with the Greek television channel ANT1, Greece's Minister of Migration, Thanos Plevris, stated that the first of these so-called \"return hubs\" is scheduled to begin operations as early as the second half of 2027 — just in time for Greece to assume the EU Council Presidency.\nPlevris said Greece had chosen an African country but could not reveal its name yet. Diplomatic circles and media outlets close to the EU have repeatedly cited Rwanda or Uganda, but neither country has been confirmed as the location.\nNo sealed detention centers\n\"We are not talking about centers in the sense that someone whose asylum application is rejected is sent to a closed facility in a third country,\" Plevris said.\nThe plan was rather to establish \"open facilities\" while the final return to the actual country of origin is being organized, he added.\nThe responsibility for the transferred individuals will not be transferred to the African partner country in order to prevent legal action for human rights violations, but will remain with the five participating EU member states. The EU \"group of five\" will also finance the project entirely on its own.\nThere are also plans for international organizations such as the United Nations High Commissioner for Refugees (UNHCR) or the International Organization for Migration (IOM) to monitor operations to ensure that international human rights standards and principles of international law are upheld.\nVarious attempts have been made in recent years to outsource asylum proceedings or deportations to countries outside the EU. None of these models worked as planned. All failed due to legal impediments, changes in government, or high costs. Below are some of the best-known precedents.\nThe British \"Rwanda Model\" (2022–2024)\nThe United Kingdom, under the Conservative government of Boris Johnson — and later under Rishi Sunak — sought to permanently deport migrants who had entered the country irregularly via the English Channel to Rwanda so they could undergo their asylum proceedings there.\nHowever, the British Supreme Court ruled the plan illegal, finding that there were substantial grounds for believing that asylum seekers sent to Rwanda faced a real risk of refoulement — being returned to countries where they could face persecution or other inhumane treatment.\nPrior to that, the British government had spent £715 million (€835 million/$966 million) in taxpayer funds on the Rwanda partnership and related implementation costs. In return, a total of four people had voluntarily relocated to Rwanda\nItaly's Albania model (in place since 2024)\nUnder Prime Minister Giorgia Meloni, Italy signed an agreement with Albania to transport migrants intercepted in the Mediterranean directly to Italian-run centers established in Albania where expedited asylum proceedings could be conducted.\nHowever, immediately after the camps opened, Italian courts halted the relocation. Judges argued that countries of origin such as Bangladesh or Egypt should not be classified as \"safe\" outright if certain groups face persecution there. These first migrants had to be returned to Italy immediately.\nItaly is now using one of the camps solely as a deportation center for men whose asylum applications in Italy have been definitively rejected. Since the facility was converted in March 2025, only about 500 people have been sent there. By 2028, this comes at an estimated total cost of more than €670 million ($775 million).\nDenmark's stand-alone initiatives (2021–2023)\nIn 2021, Denmark passed a law intended to allow asylum seekers to be flown to third countries outside the EU. Copenhagen engaged in intensive negotiations with Rwanda regarding a dedicated reception center. However, the European Commission and human rights organizations sharply criticized the initiative. In early 2023, the Danish government put the negotiations with Rwanda on hold. It became clear that the Danish plan was virtually impossible to implement legally and logistically. The government subsequently moved toward pursuing third-country return arrangements in cooperation with other European countries.\nChanging legal framework\nAccording to previous EU law, deportations to third countries often failed as courts required that a migrant have a personal connection to that third country, whether through language skills, relatives living there or a previous stay. The revised European asylum law, however, now allows individuals required to leave the EU to be transferred to a safe ", "translation_ja": "", "vocab": []}, {"title_ja": "Cornell agrees to outside review of how it handled alleged sexual assault: Governor", "title_en": "Cornell agrees to outside review of how it handled alleged sexual assault: Governor", "summary_ja": "New York Gov. Kathy Hochul called for the outside review, saying what happened raised \"serious questions about Cornell campus culture.\"", "summary_en": "New York Gov. Kathy Hochul called for the outside review, saying what happened raised \"serious questions about Cornell campus culture.\"", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/cornell-agrees-independent-review-handled-fraternity-sexual-assault/story?id=136901598", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Tel Aviv flight passengers recount harrowing moments during mid-air attack", "title_en": "Tel Aviv flight passengers recount harrowing moments during mid-air attack", "summary_ja": "Passengers aboard FlyDubai Flight 1073 recounted frightening moments after a suspect allegedly attacked a pilot and attempted to bring down the plane.", "summary_en": "Passengers aboard FlyDubai Flight 1073 recounted frightening moments after a suspect allegedly attacked a pilot and attempted to bring down the plane.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/tel-aviv-flight-passengers-recount-harrowing-moments-mid/story?id=136895547", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Trump administration diverts human rights funds to push far-right agenda abroad", "title_en": "Trump administration diverts human rights funds to push far-right agenda abroad", "summary_ja": "Support such as for white Afrikaners and anti-communism reveals how US is redefining what qualifies as human rights With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that", "summary_en": "Support such as for white Afrikaners and anti-communism reveals how US is redefining what qualifies as human rights With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/30/trump-state-department-human-rights-fund", "state_media": false, "category": "政治", "full_text": "With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that includes a huge $40m grant for an anti-communism fund, support for a group advancing white Afrikaner rights in South Africa, a campaign against Brazil’s supreme court and programs that would reward ideological allies in Europe who protect “western civilizational norms”.\nOn Wednesday, the state department obligated the funds to the grantees hours before the deadline despite congressional concerns and requests not to do so, according to a source familiar with the negotiations. The state department declined to comment on questions from the Guardian specifically on whether it had obligated the funds and had “blown” holds from Congress due to concerns about the money’s use.\nCritics have focused on 43 awards of a combined $176.9m that will bolster rightwing and conservative causes around the world while probably angering US allies over interference in internal politics. The Guardian has seen a sample of the controversial grants, which make up most of the $205m in funding that Congress has appropriated for the entire Human Rights and Democracy Fund (HRDF).\nSources with knowledge of the grant process have told the Guardian that the awards were personally lobbied for by members of the Trump administration, and reflect interests that include JD Vance’s warnings of the collapse of traditional western values in Europe and Stephen Miller’s push against immigration and to support white minorities in countries like South Africa.\n“The story for me is the high-level – including White House-directed – attention on these programs,” said a person familiar with the discussions over the democracy awards. “These awards have been briefed at the highest levels of the department and have buy-in from the White House.”\nThe proposed awards represent a significant shift in US support for dissidents, human rights defenders and civil society groups under authoritarian governments. The new slate includes projects in wealthy nations, and those focused on opposition to regulation, Brexit, immigration, anti-communism, Christian protection and opposition to “gender ideology”, offering a window into how the Trump administration is redefining what qualifies as human rights and merits tens of millions of dollars in US foreign assistance.\n“Congress appropriated money for the democracy fund on a bipartisan basis to support defenders of human rights, to assist victims of human rights violations and to instead promote the growth of democracy abroad,” said Jeanne Shaheen, the top Democrat on the US Senate committee on foreign relations.\n“The Trump administration’s proposals would use taxpayer funds to promote far-right organizations and programs in established democracies. This is a waste of resources and undermines United States values and relations with democratic partners, including allies in Europe.”\nA Democratic congressional aide said Shaheen had maintained 10 holds on $22m of awards focusing on Brazil, South Africa, Nigeria, and the promotion of a rightwing ideology in the United Kingdom and in Europe. According to the aide, secretary of state Marco Rubio had personally signed a memo to disregard the holds and obligate the funds.\nThe largest award, of $40m, was directed to a consortium led by the Victims of Communism Memorial Foundation (VOC), an anti-communist non-profit that has received far smaller grants in the past. A state department vetting document seen by the Guardian records $96,997 in previous contracts in the last five years between the foundation and the department, all in the 2022 fiscal year, and notes that it had been vetted in 2019 in connection with tickets to the foundation’s gala. The vetting document also identifies Andrew Bremberg, a former Trump White House domestic policy adviser and US ambassador to the UN European office, as a “senior leader” of the foundation.\nIn July, ProPublica reported that Samuel Samson, a 27-year-old deputy assistant secretary overseeing the new grants, was linked to senior members of VOC through his studies at the Christian conservative Hillsdale College graduate program. (A state department official then told the outlet that the relationship had nothing to do with the grant).\nSamson has described the US and Europe as partners in a shared civilizational struggle. Samson toured Austria, the Czech Republic, Hungary and Slovakia last December – all countries that were floated to receive a $2m grant to counter migration weaponized by Russia and Belarus – and criticized NGOs that previous administrations had worked with for promoting what he called radical concepts, including gender theory and DEI.\nThe state department did not comment on individual grants but said the programs were still in “active deliberation”, that awardees would meet guidelines for federal grants, and that all programming would undergo a “standard ", "translation_ja": "", "vocab": []}, {"title_ja": "South African leader urges men to speak up on gender-based violence after series of killings", "title_en": "South African leader urges men to speak up on gender-based violence after series of killings", "summary_ja": "President announces measures amid anger at authorities over recent murders of women South Africa’s president has called on men to take more responsibility for violence against women as he announced measures to tackle the problem, amid anger at authorities over a recent wave of murders. Cyril Ramapho", "summary_en": "President announces measures amid anger at authorities over recent murders of women South Africa’s president has called on men to take more responsibility for violence against women as he announced measures to tackle the problem, amid anger at authorities over a recent wave of murders. Cyril Ramapho", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/30/south-africa-gender-based-violence-women-killings", "state_media": false, "category": "政治", "full_text": "South Africa’s president has called on men to take more responsibility for violence against women as he announced measures to tackle the problem, amid anger at authorities over a recent wave of murders.\nCyril Ramaphosa acknowledged that not enough had been done to protect women. He said police would be reviewing unsolved murders, attempted murders and serious sexual offences against women and children, as well as producing a funded plan to reduce the forensic backlog for such cases, both within 60 days.\nIn a televised speech on Tuesday night, the president said local governments would have five months to address issues that compromised women’s safety, from broken streetlights to overgrown public spaces and abandoned buildings. He added that he had tasked five ministers to come up with a plan within 60 days to reduce alcohol-fuelled violence.\n“Alcohol does not cause gender-based violence and it can never excuse it. Responsibility always lies with the perpetrator,” Ramaphosa said. “But harmful alcohol use is a significant aggravating factor in interpersonal violence and it must be addressed as part of our wider prevention effort.\n“Women should not have to live in fear because government has failed to repair a light, clear a public space, process evidence or enforce a law.”\nSouth Africa has been gripped by grief and fury after the discovery of 11 women’s bodies dumped across Ekurhuleni, the municipality adjoining Johannesburg to the east, since 15 July. Eight of the women were found in the last three weeks, including Elizabeth “Tsontso” Moselakgomo, who was discovered on 12 September after she went missing when she went for a run after work.\nRamaphosa said suspects had been arrested in connection with three of the killings and that the other cases would not be left to go cold. He added that police had not found evidence that a serial killer was responsible for all 11 killings, but that all possibilities were still being investigated.\nHe directly addressed South African men, urging them to challenge relatives, friends and colleagues who harassed, humiliated or abused women. “It is time for good men to stop being silent men,” he said.\n“For too long, gender-based violence has been treated as a woman’s problem to solve. Women march, the women of our country organise, they speak out, they protest, they confront and they comfort survivors,” Ramaphosa said.\n“Women change their routes home. Avoid going out at night and warn one another about dangerous places and dangerous men. We have placed the burden of male violence on women. That must change.”\nActivists expressed their frustration that solid policy actions had not been taken years ago and scepticism that the measures Ramaphosa had announced would work.\nShenilla Mohamed, the executive director of Amnesty International South Africa, said: “These are not new issues and as a country we have been talking about ways to tackle the high numbers of [gender-based violence and femicide], especially since 2019 when women took to the streets to protest, and yet here we are again in the face of continued attacks against women.\n“Amnesty International South Africa also notes the timelines put in place by the president, but this will only mean something if it results in action, and if there are consequences for inaction.”\nMpiwa Mangwiro-Tsanga and Bafana Khumalo, of Sonke Gender Justice, an NGO, said: “Our concern … is that the response remains heavily weighted towards what happens after violence has already occurred.”\nThey added: “Investigating unresolved cases, processing forensic evidence and repairing unsafe public spaces are necessary, but they do not constitute a comprehensive prevention strategy. It is concerning that the president is asking municipalities to do what is actually their mandate and yet they do not deliver on these.”", "translation_ja": "", "vocab": []}, {"title_ja": "Burundi agrees to receive ‘third-country’ migrant deportees from US", "title_en": "Burundi agrees to receive ‘third-country’ migrant deportees from US", "summary_ja": "Burundi joins several other African nations in accepting people deported under Trump’s hardline policy Burundi has agreed to join a clutch of ⁠other African nations in receiving migrants from other countries deported from the US under ⁠ Donald Trump ’s hardline ⁠ immigration ​policy . However, Burun", "summary_en": "Burundi joins several other African nations in accepting people deported under Trump’s hardline policy Burundi has agreed to join a clutch of ⁠other African nations in receiving migrants from other countries deported from the US under ⁠ Donald Trump ’s hardline ⁠ immigration ​policy . However, Burun", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/30/burundi-third-country-deportations-trump-immigration", "state_media": false, "category": "社会", "full_text": "Burundi has agreed to join a clutch of other African nations in receiving migrants from other countries deported from the US under Donald Trump’s hardline immigration policy.\nHowever, Burundi will only accept those not accused of crime or terrorism links, said Nancy Ninette Mutoni, a spokesperson for the country’s president, Évariste Ndayishimiye. Tuesday’s announcement gave no details of numbers, timing or financial details.\nWashington has sent so-called “third-country deportees” to about half a dozen African nations as well as many other countries, often where they have no ties, have never been and find themselves detained indefinitely, under opaque deals that Senate Democrats say have cost tens of millions of dollars.\nIn many cases, deportees had secured legal protections from immigration courts in the US against repatriation. But rights groups say the third-country deals allow the US to circumvent those protections.\nMutoni said preparations were under way to arrange accommodation, living conditions and integration into local communities in Burundi. “Receiving them requires serious planning – where they will stay, what they will eat and how they will live alongside the local population,” she said.\n“If they choose to join Burundian citizens and make a valuable contribution to national development, the law will be respected,” she said, regarding potential citizenship.\nBurundi aimed to both strengthen diplomatic relations and provide hospitality to people in need, the spokesperson added.\nThe US state department did not immediately respond to requests for comment while a spokesperson for the Burundi foreign ministry said details of the agreement were not yet available.", "translation_ja": "", "vocab": []}, {"title_ja": "Pennsylvania confirms fifth measles-associated death as US outbreak grows", "title_en": "Pennsylvania confirms fifth measles-associated death as US outbreak grows", "summary_ja": "Cases have more than doubled since August as a dispute with federal health officials over the death count continues.", "summary_en": "Cases have more than doubled since August as a dispute with federal health officials over the death count continues.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/30/pennsylvania-confirms-fifth-measles-associated-death-as-us-outbreak-grows?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Pennsylvania confirms fifth measles-associated death as US outbreak grows\nCases have more than doubled since August as a dispute with federal health officials over the death count continues.\nPennsylvania has confirmed a fifth measles-associated death this year, as the number of infections approaches 1,000 amid a rapidly growing outbreak across the state.\nThe Pennsylvania Department of Health announced on Wednesday that an unvaccinated resident of Lancaster County who tested positive for measles had died.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Republican US senator slams Trump vaccine policy amid rising measles deaths\n- list 2 of 3Pennsylvania seeks CDC help amid dispute over US measles deaths\n- list 3 of 3CDC reports two measles deaths in US as cases hit 35-year high\nThe department said the death was reported to the United States Centers for Disease Control and Prevention (CDC).\nThe state has recorded 943 confirmed measles cases across 39 counties so far in 2026, including 40 new cases since September 28. At least 176 people have been hospitalised.\nThe US is currently seeing the worst measles outbreak in the country since 1991, with several deaths reported over the last couple of years.\nMeasles was declared eliminated in the US in 2000, but the highly infectious disease has made a comeback in recent years, a trend some experts have linked to a rise in vaccine scepticism.\nThe latest death is the third associated with measles reported in Lancaster County this year.\nLocated in the south-central part of the state, Lancaster County is considered the centre of Pennsylvania Dutch Country, home to the nation’s oldest Amish and Mennonite communities. Both communities have under-vaccinated populations.\nPennsylvania announced its first two measles-associated deaths in August, the first measles-related deaths recorded in the state in 35 years. Since then, the number of confirmed infections has more than doubled.\nThe growing outbreak has prompted the administration of Governor Josh Shapiro to expand vaccination efforts and public health outreach.\nProtection is most commonly conferred through a combination injection known as the measles, mumps and rubella vaccine, or the MMR shot.\nAccording to Pennsylvania’s Department of Health, more than 53,000 MMR vaccine doses were administered statewide in September, more than twice the number given during a typical month. Health experts say that two doses of the MMR vaccine are about 97 percent effective at preventing measles.\nOn Tuesday, the CDC confirmed two measles-related deaths in its national tally, though the agency did not identify where the deaths occurred.\nThe federal count has been at the centre of a dispute between Shapiro and US Health Secretary Robert F Kennedy Jr over how measles deaths are classified.\nPennsylvania has reported five “measles-associated” deaths, a designation used when a person with confirmed measles dies within 30 days of developing symptoms, unless the death resulted from an unrelated event.\nBut Kennedy, a vaccine sceptic, has accused Shapiro of politicising the deaths and initially questioned whether two deaths reported by the state in August were linked to measles.\n“The announcement appears to have been premature, and the deaths may even have been altogether fabricated by one of the Governor’s hopeful staffers,” Kennedy wrote on the social media platform X on August 26.\nInfectious disease experts warn that the dispute over how to classify the deaths puts the CDC at odds with a longstanding approach to tracking the consequences of measles. Epidemiologists have told Al Jazeera that tracking “measles-associated” deaths has long been a standard used by the World Health Organization and the CDC.\nThe latest death comes as Pennsylvania officials continue to seek additional federal assistance with the outbreak.\nIn its push for greater epidemiological support, the state requested an Epi-Aid investigation – used for urgent disease outbreaks and other disasters – from the CDC earlier this month, as cases continue to spread.", "translation_ja": "", "vocab": []}, {"title_ja": "US judge approves settlement allowing Paramount to acquire Warner Bros", "title_en": "US judge approves settlement allowing Paramount to acquire Warner Bros", "summary_ja": "Mammoth deal has raised questions about corporate consolidation and editorial independence in media.", "summary_en": "Mammoth deal has raised questions about corporate consolidation and editorial independence in media.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/30/us-judge-approves-settlement-allowing-paramount-to-acquire-warner-bros?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US judge approves settlement allowing Paramount to acquire Warner Bros\nMammoth deal has raised questions about corporate consolidation and editorial independence in media.\nA United States judge has entered an order giving the green light for the media giant Paramount to complete its $110bn acquisition of entertainment company Warner Bros., despite fears about the long-term impacts of media consolidation.\nOn Wednesday, US District Court Judge Araceli Martinez-Olguin approved a settlement between Paramount, Warner Bros, and a group of 12 states that had sued to block the merger.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Paramount settles with US states, union to win Warner Bros takeover\n- list 2 of 3Twelve US states sue Paramount to block Warner Bros merger\n- list 3 of 3US broadcaster CBS fires 60 Minutes’s Scott Pelley after clash with bosses\nIn her ruling, Martinez-Olguin described the proposed deal as a “fair, reasonable, and good faith approach to address the competitive harms”.\nAnalysts have long raised concerns about the acquisition, one of the largest media mergers in history.\nThe coalition of states that sued to block the deal, led by California, had argued that combining Paramount with Warner Bros would effectively stifle media competition. They estimated that nearly one-third of all theatrical releases and basic cable programming would be consolidated under the merger.\nBut the states abandoned their lawsuit in favour of a settlement on September 21.\nThe five-year agreement requires Paramount to abide by theatrical film release quotas, committing to 30 releases per year in the US.\nIt also mandates that the combined company must keep negotiations with cable providers for Warner-owned channels separate from its deals for Paramount-owned channels.\nThe settlement approved on Wednesday also includes the creation of a five-member panel meant to safeguard the editorial independence of CNN and CBS, two major news networks.\nBut sceptics have pointed out that the merger puts a large swath of US media under the control of David Ellison, who leads Paramount.\nUnder Wednesday’s agreement, Ellison is in charge of appointments to the board that would oversee news independence.\nThe Paramount CEO is the son of billionaire Oracle founder Larry Ellison, a strong backer of pro-Israel causes who has close ties to the administration of President Donald Trump.\nThe founder of the film production company Skydance, David Ellison acquired Paramount last year as part of another controversial merger.\nThe 2025 Paramount-Skydance deal brought CBS under Ellison’s control. Ahead of the merger, sceptics questioned the abrupt cancellation of the CBS comedy show The Late Show with Stephen Colbert, which had been critical of Trump.\nEllison later installed Bari Weiss, a pro-Israel media figure, as the head of CBS News in a move that also raised questions about diminished independence within major journalism outlets.\nSome critics depicted Wednesday’s settlement as a further capitulation to powerful corporate interests.\n“Allowing one Trump-aligned, foreign-owned conglomerate to dominate American news and entertainment is a disastrous outcome,” Senator Elizabeth Warren of Massachusetts said in the wake of the settlement’s announcement.\nBut public officials like California Governor Gavin Newsom had called on his state’s Attorney General Rob Bonta to scrap the 12-state effort to block the deal and to pursue a settlement instead.\nParamount emerged victorious from a bidding war with the streaming giant Netflix in February to win control of Warner Bros’s holdings.\nThat includes a series of media and entertainment services, including the film studio Warner Bros Pictures, CNN and HBO Max. The Trump administration approved the deal without alterations in June.", "translation_ja": "", "vocab": []}, {"title_ja": "US Senate rejects bill targeting AI data centre electricity costs", "title_en": "US Senate rejects bill targeting AI data centre electricity costs", "summary_ja": "Democrats criticise bill as lacking &#039;teeth&#039; and push for mandatory measures to address soaring electricity bills.", "summary_en": "Democrats criticise bill as lacking &#039;teeth&#039; and push for mandatory measures to address soaring electricity bills.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/30/us-senate-rejects-bill-targeting-ai-data-centre-electricity-costs?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US Senate rejects bill targeting AI data centre electricity costs\nDemocrats criticise bill as lacking ‘teeth’ and push for mandatory measures to address soaring electricity bills.\nThe United States Senate has thwarted a bill that would have required state regulators to consider forcing data centres and other major electricity users to bear the costs of the infrastructure built to serve them.\nThe measure failed by a vote of 57 to 43 on Wednesday. The proposal needed to pass by at least 60 votes to prevent a filibuster, a procedural hurdle in the Senate that can stymie a bill indefinitely.\nRecommended Stories\nlist of 3 items\n- list 1 of 3What’s the US–China AI ‘hotline’ that Trump plans to pitch to Xi Jinping?\n- list 2 of 3China vs US: Who is winning the AI race, in four charts\n- list 3 of 3How an OpenAI ‘agent’ hacked Australia’s Medicare and what that means\nOnly four Democrats — Maggie Hassan, Amy Klobuchar, Jon Ossoff and Raphael Warnock — joined Republicans to support the bill, which proponents argue would have eased the burden of rising energy costs on individual households.\nThe artificial intelligence (AI) boom has led to increasing demand for data centres, which provide computing power for the new technology.\nThere are as many as 5,400 data centres currently in the US, according to some estimates. Critics argue the facilities require substantial amounts of energy to operate, contributing to higher electricity costs.\nThe Ratepayer Protection Act, a first-of-its-kind bipartisan bill, was aimed at addressing the economic concerns linked to the expansion of data centres.\nIt passed the House of Representatives earlier this month in a landslide vote of 417 to three.\nBut Democrats in the Senate argued the bill does not go far enough to protect consumers from high electricity bills. Rather than requiring states to “consider” a federal utility rate standard, some senators advocated instead for mandatory enforcement to guarantee consumer relief.\nOther critics described the bill as a last-ditch Republican effort to secure a legislative victory ahead of the November midterm elections.\nSenate Democratic Party leader Chuck Schumer, for instance, dismissed the legislation as “toothless”. He noted that the bill failed to require data centres to cover the costs they incur in upgrades to electricity infrastructure.\n“We need real action on data centres, and what do Republicans decide all of a sudden to push forward? A bill that is totally optional,” said Schumer.\nHe challenged Republicans to prove their commitment to the issue by passing a Democratic alternative that “has teeth”.\nDespite widespread pushback, thousands of data centres already span the US, with construction underway for dozens more. While the states of Virginia and Texas lead the nation in operating facilities, California, Ohio and New York follow behind closely as top digital infrastructure hubs.\nAccording to a September poll, 53 percent of Americans are “extremely” or “very” concerned about the impact of data centres on electricity prices or water supplies in the communities where they are built.", "translation_ja": "", "vocab": []}, {"title_ja": "flydubai pilot 'a hero', plumber steadied plunging aircraft: Trump", "title_en": "flydubai pilot 'a hero', plumber steadied plunging aircraft: Trump", "summary_ja": "However, Mr. Trump said that he was merely recounting an account he had received rather than independently confirmed facts.", "summary_en": "However, Mr. Trump said that he was merely recounting an account he had received rather than independently confirmed facts.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international//article71530421.ece", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "U.K. PM says 'strong indications' Iran involved in airbase incident", "title_en": "U.K. PM says 'strong indications' Iran involved in airbase incident", "summary_ja": "Mr. Burnham's comments are the first official confirmation from U.K. authorities that Iran may have had a hand in the incident, which saw three white vans appearing to head towards RAF Fairford in the early hours of Sunday.", "summary_en": "Mr. Burnham's comments are the first official confirmation from U.K. authorities that Iran may have had a hand in the incident, which saw three white vans appearing to head towards RAF Fairford in the early hours of Sunday.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/uk-pm-says-strong-indications-iran-involved-in-airbase-incident/article71530409.ece", "state_media": false, "category": "政治", "full_text": "British Prime Minister Andy Burnham on Wednesday (September 30, 2026) said there were \"strong indications\" that Iran was involved in suspicious activity at a U.K. airbase that triggered a major security incident this weekend.\n\"There are strong indications that Iran played a part in what happened over the weekend at RAF Fairford,\" Mr. Burnham told the BBC, referring to Sunday's bomb scare near the airbase in southwest England, which is used by the U.S. military in its war against Iran.\n\"Of course it remains an ongoing, complex, and serious police investigation,\" said Mr. Burnham.\nIran's embassy in London earlier said it \"categorically rejects and strongly condemns\" speculation it was involved in the incident, while Foreign Minister Abbas Araghchi posted on X that Mr. Burnham was \"barking up the wrong tree\".\nPolice said on Tuesday (September 29, 2026) that no explosives were found at the scene. The nature of the threat has not been explained by officials.\nMr. Burnham's comments are the first official confirmation from U.K. authorities that Iran may have had a hand in the incident, which saw three white vans appearing to head towards RAF Fairford in the early hours of Sunday.\nA local resident who rang the police said she saw a group of masked men near the vans, which were blocking a road in a village next to the military base.\nGrowing confusion\nThe case was plunged into confusion when U.K. police released on bail five British men it had arrested on Sunday (September 27, 2026) on suspicion of explosives and terrorism offences.\nAfter three days of investigations, including using a bomb disposal team, police said Tuesday they had found no explosives in the vehicles, but they had retrieved a \"quantity of petrol\".\nThen on Wednesday (September 30, 2026), The Times newspaper reported that the incident had been foiled after one of the five suspects tipped off the police before the group was apprehended.\nU.S. President Donald Trump and his Secretary of State Marco Rubio had previously indicated that intelligence bodies were aware of the suspects and that a foreign state could be involved, but U.K. officials had not weighed in.\n\"We have been waiting to confirm what we could say, but we can now confirm our belief that Iran played a part,\" Mr. Burnham told Sky News.\nSpeculation was rife that Iran or another hostile state could have been involved, after Tehran previously warned London against allowing its military bases to be used by Washington.\nBritain gave the U.S. the greenlight to use RAF Fairford for defensive strikes against Iran, drawing Tehran's ire and unease from some residents in the Gloucestershire countryside where the base is located.\nPublished - October 01, 2026 03:23 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "Pilot stabbed colleague in bid to crash Israel-bound flydubai plane: Netanyahu", "title_en": "Pilot stabbed colleague in bid to crash Israel-bound flydubai plane: Netanyahu", "summary_ja": "‘The naive notion that our enemies cherish life and that we should pity them received another reminder this morning in the form of a terrorist who planned to crash a plane and murder the 180 Israelis on board,’ Itamar Ben Gvir said", "summary_en": "‘The naive notion that our enemies cherish life and that we should pity them received another reminder this morning in the form of a terrorist who planned to crash a plane and murder the 180 Israelis on board,’ Itamar Ben Gvir said", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/israel-bound-commercial-plane-from-dubai-diverted-to-saudi-arabia-after-distress-call/article71527429.ece", "state_media": false, "category": "社会", "full_text": "A pilot on a flight from the United Arab Emirates to Israel stabbed another pilot on Wednesday (September 30, 2026) and then apparently tried to crash the jetliner carrying around 170 people, Israel’s Prime Minister said. Passengers and crew subdued the attacker, and the plane landed safely in Saudi Arabia.\nWhile some passengers screamed, the flydubai flight issued an emergency alert and abruptly descended thousands of feet (meters). Israel scrambled warplanes amid concerns about a possible hijacking.\nAs a plane carrying passengers from the flight landed on Wednesday (September 30, 2026) evening in Israel, to cheers at the airport, it was not clear what motivated the attack.\nPassengers recall ordeal\n“We’re going to die,” passenger Naama Bershadski recalled of the ordeal. She said she closed her eyes and prayed for a good ending.\nVideo footage circulating on social media and reviewed by The Associated Press showed two men on the plane’s floor, bloodied and wounded. Two people appeared to be providing medical treatment, while two others guarded the cockpit.\n“We are guarding the pilot,” one person said in Hebrew. In another video, passengers wept and cried out as the aircraft shook.\nThose who intervened “saved many lives and prevented a major disaster,” Israeli Prime Minister Benjamin Netanyahu said, adding that Saudi Arabia arrested a pilot whose identity was not immediately shared by authorities. Saudi Arabia had no immediate comment.\nThe plane’s captain and first officer were injured, according to a statement by Prince Sultan bin Abdulaziz International Airport in Tabuk, carried by state-run Alekhbariya television. Passengers received medical attention from local authorities, according to a regional official, who spoke on condition of anonymity because the official was not authorized to brief the media.\nMr. Netanyahu warned in recent days of unspecified, heightened security threats. The country is a week away from the anniversary of the Hamas-led Oct. 7, 2023, attack on Israel, which has triggered a series of wars, and is weeks away from an election.\nA spokesperson for Mr. Netanyahu’s office said around 160 people on the plane were from Israel.\nAn Israeli official said a fight broke out between two pilots, one of whom was armed with a knife. The official spoke on condition of anonymity because the incident was under investigation.\nAround two and a half hours after leaving Dubai, the flight descended from 33,000 feet to 17,000 feet (around 10,000 meters to 5,100 meters) in about a minute, before making an erratic circle close to the Jord
