land China in renminbi. This allowed them to settle debts at home while picking up currency abroad, facilitating capital flight on a large scale.\n China’s industrial overcapacity has lowered the costs of building and operating illicit enterprises.\nThe same underg", "translation_ja": "", "vocab": [{"word": "illicit", "definition": "違法な、不正な経済活動や商取引。特に暗黙のうちに行われている非合法な行為を指す。"}, {"word": "circumvent", "definition": "法律や規制を巧妙に回避する、または迂回する。直接的に違反せず、抜け穴を利用する行為。"}, {"word": "capital controls", "definition": "政府が国外への資金流出を制限する政策。外国為替取引や資産移動に制限を設ける措置。"}, {"word": "overcapacity", "definition": "生産能力が需要を大幅に超過した状態。製造業などで過剰な生産設備を持つことを指す。"}, {"word": "underpin", "definition": "何かの基礎となる、支える。根底にある重要な要素や理由となることを意味する。"}, {"word": "junket operators", "definition": "カジノへの富裕顧客の送客や金銭取引を仲介する業者。マカオなどのギャンブル地で資金移動を手助けする仲介者。"}]}, {"title_ja": "AIがいかに米国軍を空洞化させる可能性があるか", "title_en": "How AI Could Hollow Out the U.S. Military", "summary_ja": "著者は、AIが自律型兵器の暴走というリスクをもたらす一方で、より深刻な脅威は、オートメーション偏向とスキルの劣化を通じてAI使用が人間の認知能力を低下させることだと主張しています。軍要員がAIシステムに依存することで、経験豊富な司令官や分析官でさえ独立した判断と創造的な意思決定能力を失う可能性があり、国防総省は慎重な訓練プロトコルとAI導入の遅延を実装する必要があります。", "summary_en": "The author argues that while AI poses risks of autonomous weapon malfunctions, the greater threat to military effectiveness is how AI use degrades human cognitive abilities through automation bias and skill atrophy. Military personnel relying on AI systems may lose their capacity for independent judgment and creative decision-making, even among experienced commanders and analysts, requiring the Pentagon to implement careful training protocols and potentially slower AI adoption.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/how-ai-could-hollow-out-us-military", "state_media": false, "category": "オピニオン", "full_text": "When people think about the risks of mixing AI and armed forces, their thoughts often drift to one famous film franchise: The Terminator. Its premise is simple. American scientists invent a superintelligent computer system, called Skynet. The Department of Defense then integrates it into the military and embodies its intelligence into lethal robots. Skynet soon becomes self-aware, and American military leaders attempt to unplug it. In response, the AI starts a nuclear war and deploys its robots—the terminators—to eliminate the human race.\nThere is no doubt that people need to maintain control over AI systems, and so it is essential for analysts and engineers to think about how to avert a Skynet-style outcome—particularly after models from OpenAI, Anthropic, and Meta escaped their testing environments and hacked into outside companies, including an escape that took place during an exam run by the United Kingdom’s premier AI safety institute. But focusing on escaped models and imagining killer robots can drive discussions about how the military should use AI exclusively toward questions of engineering and thus miss a more pernicious threat to human control of the armed forces. According to a growing body of research, AI use is affecting people’s cognitive capacity to evaluate evidence, make independent judgments, and even do their basic jobs. In other words, policymakers should be as worried about how troops and commanders use AI as they should be about AI’s independent capabilities.\nThat does not mean the U.S. military should forgo the use of AI, which could do wonders to improve its efficiency and reduce errors in conflicts. But it does mean that the Pentagon will need to more carefully train soldiers how to use AI and monitor how such systems affect people’s thinking. To be sure humans are always capable of overseeing AI, it may even require adopting certain models more slowly.\nLOSING OUR MINDS\nFor years, scientists have embarked on systematic research to illuminate how human-machine interactions affect cognition. The findings are complicated, but often worrying. For example, people can suffer from what is called automation bias: the tendency to defer to machine judgments over their own. This was true before the advent of AI; simply search for videos of people who blindly followed their navigation systems and drove their cars into lakes. But AI could make automation bias worse. Analysts have found that relying on AI can impair skill development for new learners while degrading knowledge among experts. When researchers gave computer scientists and oncologists AI assistance and later took it away, both groups performed worse at their jobs than they did before using it.\nThese findings should be particularly concerning to the U.S. military as it seeks to foster what Secretary of Defense Pete Hegseth calls an “AI-first warfighting force.” Some commanders hope to use AI to support war game analysis and to help develop military courses of action. Such integration could lead to tactical and strategic breakthroughs, given how powerful AI models have become. But it also risks diminishing the ability of commanders and soldiers to independently evaluate or develop creative military options.\nIt is easy to imagine how this might happen. Sailors, for example, are often tired and overworked when reviewing images of potential threats. If they are evaluating an image of a nearby object, they might already be ready to accept the verdict of a computer that deems it an enemy warship—even when their own eyes suggest it is more likely a cargo tanker or a fishing boat. Likewise, battlefield commanders often need urgent response plans to enemy attacks, something AI can help with. But if commanders overrely on what computers suggest, they might lose their own tactical edge and blindly adopt the algorithm’s plan. This possibility is particularly concerning given that, in some experiments, AI models have been prone to make unnecessarily aggressive and escalatory recommendations.\n Relying on AI can impair skill development.\nTo some, these fears may seem outlandish. The U.S. military, after all, invests tremendous amounts of resources on making sure its members exercise good judgment. The process by which it selects senior combat leaders, for example, is designed to weed out all but the most experienced and discerning candidates. And once selected, these leaders adhere to a strict code of conduct and undergo intensive training and certification requirements, all of which prize discipline and self-regulation. Finally, the American military bureaucracy has been focused on safely operating automated (if not autonomous) weapons since at least the 1940s.\nBut AI is more capable than earlier technologies, and it is already overwhelming workers in other similarly disciplined fields. In medicine, for instance, evidence is accumulating that even experienced doctors struggle to reliably catch incorrect AI recommendations. Sycophantic AI chatbots ", "translation_ja": "", "vocab": [{"word": "automation bias", "definition": "機械やAIの判断を自動的に信頼し、人間の判断よりも優先させる傾向。特にAIが高度になるほど、ユーザーが自分の専門知識や直感を無視しやすくなる現象。"}, {"word": "degrade", "definition": "品質や能力が低下する、劣化する。ここでは、AI使用により軍要員の判断力や技能が低下することを指す。"}, {"word": "pernicious", "definition": "一見して害が明らかでないが、実は非常に危険で有害な。潜在的に深刻な悪影響をもたらす傾向。"}, {"word": "tactical edge", "definition": "戦術的な優位性や利点。競争相手より優れた戦術的能力や判断力を持つこと。"}, {"word": "escalatory", "definition": "状況や紛争が段階的に悪化・激化する方向を向いている。軍事的文脈では、緊張や対立をさらに高める傾向。"}, {"word": "forgo", "definition": "何かを自発的に放棄する、控える。利益や便利さがあっても、それを使用しない選択をすること。"}]}, {"title_ja": "長期的に機能する対中戦略", "title_en": "A China Strategy That Lasts", "summary_ja": "著者は、中国の戦略的な貿易政策に対抗し米国の製造業を保護するため、議会が耐久的な貿易枠組みを確立すべきだと主張しています。議会は執行措置を法制化し、税関システムを近代化し、デミニマス規則などの抜け穴を閉じることで、大統領任期を超えた一貫性を作り出し、中国の長期的な経済戦略に効果的に対抗できるようにすべきです。", "summary_en": "The author argues that the United States must establish a durable, congressionally-mandated trade framework to counter China's strategic use of trade policy and protect American manufacturing. Congress should codify enforcement measures, modernize customs systems, and close loopholes like the de minimis rule to create consistency that outlasts presidential administrations and effectively competes with China's long-term economic strategy.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/china-strategy-lasts-bill-cassidy", "state_media": false, "category": "オピニオン", "full_text": "For decades, Beijing has used trade not only as a means to generate economic growth but also as a geopolitical tool to attract investment, strengthen its industrial base, expand its economy, and support its military. It has done so by integrating national security, economic security, energy policy, and environmental policy. In sectors as varied as automobiles, chemicals, and solar panels, the Chinese government’s policies have led to overproduction at home, which pushes companies to export at low prices, flooding international markets and undermining the manufacturing bases of rival economies. The erosion of those countries’ industrial capacity ultimately weakens their ability to compete with and resist China economically, diplomatically, and militarily. And the United States cannot win a long-term competition with China when Beijing controls global manufacturing and supply chains.\nIn Washington, policymakers of both parties recognize the China challenge. Yet the United States’ approach to addressing this challenge has shifted with each presidential administration and, at times, even within a single presidency. Long-term challenges require long-term solutions, and Congress is the branch best suited to crafting such solutions. Congress can provide the consistency and predictability needed to align U.S. economic, trade, and national security goals into the future. If the United States hopes to compete successfully with China in the coming decades, Congress—not the executive branch alone—must establish a durable framework that can outlast political cycles.\nTo counter China’s trade policy and protect U.S. national security, Congress should pass legislation to permanently strengthen enforcement of existing trade laws, modernize customs authorities to better track goods coming from China, deepen partnerships in the Western Hemisphere, and address the advantage that China derives from weak enforcement of environmental standards. Many such pieces of legislation have already been introduced. Now, Congress needs to move forward and make them law. This will ensure that the United States can rebuild and protect its industrial base and win the competition with its biggest geopolitical rival.\nCLOSING LOOPHOLES\nA long-term trade strategy to counter China must first have permanent trade enforcement. One positive step came in July 2025, when Congress closed the de minimis loophole, which allowed goods costing less than or equal to $800 to be imported without a tariff. Because of this loophole, in 2024, approximately four million packages a day—mostly from China—entered the United States duty free and largely unscreened. Counterfeit products, goods containing hazardous chemicals such as fentanyl, and cheap consumer products were pouring into the United States. Meanwhile, American exporters sending goods to China faced tariffs on any products for individual use costing more than $6.90 and on commercial products worth more than $690.00.\nRepealing the de minimis threshold will help level the playing field for American manufacturers and create a more stable framework going forward—one that cannot be changed by a future executive order. But other legislation is needed to further bolster enforcement. Currently, U.S. trade strategy relies on a June 2026 executive order that increases the bond on high-risk goods that is required to guarantee duties get paid in full, places restrictions on repeat violators of customs rules, establishes minimum penalty floors, and expands reporting requirements that provide Customs and Border Protection with the ownership and supply chain information necessary to identify bad actors. Together, these changes make it harder for Chinese companies to exploit gaps in U.S. customs enforcement.\nCongress should codify the June 2026 executive order to make these changes permanent. Such a bill warrants bipartisan support because protecting U.S. manufacturers and rebuilding the manufacturing job base is a shared priority for policymakers. Furthermore, such a bill would protect American businesses and ensure that trade rules are enforced more consistently.\nGET WITH IT\nEnforcement alone will be insufficient, however, if customs authorities continue relying on systems designed for an earlier era of global commerce. Although recent executive actions, including the June 2026 customs enforcement order, authorize the destruction of counterfeit goods, expand electronic filing, and move the United States toward a better trade-processing system, Congress should pursue a broader effort to bring customs into the twenty-first century.\nThe Customs Modernization Act, which I introduced in 2023, aims to replace paper-based customs processes with comprehensive electronic filing. It also requires online marketplaces to provide verified seller and transaction data. The Trump administration has since built on these reforms by requiring importers of record—the entities legally responsible for imported goods—to maintain sufficient do", "translation_ja": "", "vocab": [{"word": "de minimis", "definition": "税関手続きにおいて、一定額以下の低額商品に対して関税や検査が免除される制度。記事ではこの制度により中国からの低価格商品が大量に流入していたことが問題とされています。"}, {"word": "codify", "definition": "法律や規則として成文化する、明文化する。行政命令を議会の法律として永久的に定着させるプロセスを指しています。"}, {"word": "durable", "definition": "長期間にわたって持続する、耐久性のある。政権交代による政策変更の影響を受けない長期的な枠組みを表しています。"}, {"word": "erosion", "definition": "段階的な衰退や減少。ここでは製造能力が徐々に失われることを指しており、国家競争力の低下につながります。"}, {"word": "bolster", "definition": "強化する、支援する。執行手段や規制を強くしてより効果的にすることを意味しています。"}, {"word": "geopolitical", "definition": "地政学的な、国家間の権力関係に関わる。国際的な政治・経済競争における戦略的な側面を表しています。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-22 21:07 JST";
  renderTabs();renderList();
})();
</script>
