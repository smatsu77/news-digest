ght, even if that meant going against the party.”\nShe was elected to the U.S. Senate in 1978 and served three terms. Her modest demeanour endeared her to voters of all political stripes, though she shared the moderate, progressive Republican politics of her father, Gov. Alf Landon, the unsuccessful 1936 GOP nominee for president. Even after leaving the Senate early in 1997, she continued taking on public service roles.\nShe married former Senator Howard Baker, a Tennessee Republican, in 1996. He died in 2014.\nKassebaum Baker remained an icon for Kansans generally. She could work with Senate colleagues of all political philosophies, and a 1996 health insurance law bore her name, along with that of liberal Massachusetts Senator Ted Kennedy.\nA centrist politician from America's heartland\nHer election to the Senate brought her immediate national attention. When she announced her retirement, she was among eight women senators and the only one to chair a Senate committee, the Labour and Human Resources panel.\nShe was also in a dwindling bloc of moderate-to-liberal Republicans, having supported for example a ban on assault weapons championed by President Bill Clinton, a Democrat.\nYet she never polarised Kansas conservatives as other GOP moderates did. She connected with voters because she never seemed caught up in the trappings of power, and when she retired, she acknowledged, “I'd rather cuddle up and do needlepoint all day.”\nShe was born on July 29, 1932, as her father, an oilman from Independence, was running for the first of his two terms as governor. She earned a political science degree from the University of Kansas and a master's degree in diplomatic history from the University of Michigan in the mid-1950s.\nShe was a radio-station executive, spent a year in the 1970s on the staff of Kansas Sen. James Pearson and served on the school board in the Wichita suburb of Maize. She had four children with her first husband, Phil Kassebaum, including Bill, who served a term in the Kansas House. The marriage ended in divorce in 1979.\nA moderate who sought sensible solutions\nWhen Kassebaum Baker decided to run for the U.S. Senate, she figured that “a woman with a background different from a man might be appealing” to people growing weary of politics. Pundits at the time estimated a Senate race would require the then-huge-for-Kansas sum of $1 million.\nIn the first quarter of 1978, she spent less than $12,000 on her campaign and saw herself “at the bottom of the totem pole.” However, nine candidates crowded the primary field, including three state senators and a prominent Wichita businessman. Kassebaum Baker won the GOP nomination with less than 31% of the vote.\nRunning as Nancy Landon Kassebaum, she won almost 54% of the vote that November against former two-term Democratic congressman Bill Roy.\nHer moderate politics quickly came to the fore, when only months later, she refused to endorse an amendment to the U.S. Constitution to require a balanced budget.\n“We should be wary of the seemingly simple solution,” she said.\nHer father, who would die at age 100 in 1987, still cast a long political shadow during her first years in office. Though he'd overwhelmingly lost the 1936 presidential race to Democratic incumbent Franklin Roosevelt, he later became an elder statesman for the party. A lecture series named for him at Kansas State University attracted presidents and foreign leaders.\nKassebaum Baker became even more popular in her time. She won re-election in 1984 with 76% of the vote and in 1990 with 74% of the vote.\nBut she frustrated conservative activists, despite her popularity. She said her vote in favour of the assault weapons ban inspired the angriest mail of her career.\nA public servant to the end\nShe'd contemplated not seeking a third term, but Republican leaders had prevailed upon her to run one more time. In 1996, when she decided not to seek re-election, she said she would return to a ranch and a 90-year-old farmhouse in Kansas' scenic Flint Hills and babysit her grandchildren — she had seven, as well as two great-grandchildren.\nWhen there briefly was talk of naming a new highway in Topeka after her, she said, “Oh, goodness. Absolutely not — no.” She and Baker kept their romance low-key, and speculation about a possible marriage didn't emerge until mid-1996, in a Washington Post story. They married that December.\nIt was the first time a man and a woman who had both served in the Senate had wed. Baker was elected to three ", "translation_ja": "", "vocab": [{"word": "endeared", "definition": "人々に好感を持たれるようにする、愛される状態になるという意味。文脈では彼女の謙虚な態度が有権者に好かれたことを表す。"}, {"word": "centrist", "definition": "政治的スペクトルの中央に位置する人物、左右の極端な立場を避ける穏健派。カッセバウム・ベイカーのような中道派政治家を指す。"}, {"word": "polarised", "definition": "対立する二つの立場に分かれさせる、社会や集団を分極化させるという意味。保守派と自由派の間で対立を生み出すことを表す。"}, {"word": "dwindling", "definition": "徐々に減少する、数が減り続けているという意味。穏健派共和党議員の数が少なくなっていたことを表現している。"}, {"word": "pundits", "definition": "特定の分野の専門知識を持つ評論家、評論員。政治分析家など、意見を述べる権威者を指す。"}, {"word": "contemplate", "definition": "深く考える、検討する、考慮するという意味。彼女がある決断について真剣に考えていたことを表す。"}]}, {"title_ja": "ダイアン・サックスがトロント・ダンフォースで立候補、マイク・レイトンとの対決を回避", "title_en": "Dianne Saxe switches wards to run in Toronto-Danforth, avoiding showdown with Mike Layton", "summary_ja": "ダイアン・サックスは選挙区を変更し、トロント・ダンフォースで立候補することを決定した。この決定により、現職議員マイク・レイトンとの直接対決を回避することになる。トロント市政の政治情勢が再編成されることになる。", "summary_en": "Dianne Saxe has changed electoral ridings to run in Toronto-Danforth, a decision that avoids a direct contest with incumbent councillor Mike Layton. The move reshuffles the political landscape in Toronto's municipal politics ahead of the upcoming election.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijAJBVV95cUxPSzNTUUtqNUpjaVkxeE9aeEl2VVdwNUI5cTZ0LWIwUi1icEd2RnFPaldPVjRGbWMwOXRmSi1yakZkRlpzTHV3TXlVWm9hbkYteTExeUZLRVJVTHozbkREYVFiaTBVVkU5MXQ3ZlQxMUhpZE5mSDFwUzc2N2xPbjVlSHNIcURiNldXT1hvemsxb3BWaTFLV2oyUzFxZ0I3ak5wbzl1MkVsN2RhN3RFc2 VNEY4RG5GSjRDUWpWc3N6eWVzS3gtMkdkYi1kU1pn0gHwAUFVX3lxTE5mTnRybnZhQWpFUWpqZTloM0lHcjA5UFZQWWZyX05SclVVTXFxRU9lQnJnYVRLTkd5Z1FYOHgtOHNZV0I2dlZsRTBwZVdDVlFETkFuTWQxRFdTZE5mZXVjMXZPdEVQSjZIamJzWkdZX3ZXUFo3TEZfYm9ISzJjUFZ2eUVsaVhGTktPQkg2UlkwZEh5M3dRU2xZQUtBVkh6NEV2UmpOQ2Q4aC10TW9pdldLdUJieXVLaU1NWEZqbVhXYW52UUdIWjcya3c4WWMtb1VBUGI0OVk4bUlnZHo3cEtILVFRVS0ybUYtYmoyVVNWNg?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グルーポ・グローボ、創立100周年に向けた企画を準備", "title_en": "Grupo Globo Prepares Special Initiatives for Centennial Year", "summary_ja": "ブラジルの大手メディア企業グルーポ・グローボが創立100周年を記念した特別企画の準備を進めている。同社は今後、この重要な節目を祝うための様々なプロジェクトを展開する予定だ。", "summary_en": "Grupo Globo is gearing up to celebrate its 100th anniversary with a series of planned initiatives. The media conglomerate is developing special projects to mark this significant milestone in its history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ますます狂気に満ちた世界で正気を保つ", "title_en": "Remaining Sane in an Increasingly Insane World", "summary_ja": "オウェイ・ラケムファ氏は、ホルムズ海峡の再開についてオマーンを脅迫することからグリーンランドとパナマ運河の押収を試みることまで、トランプ政権の不安定な外交政策決定を批判している。著者は、ベネズエラの石油資源の軍事的押収とマドゥロ大統領の投獄を国際的無政府主義の行為と見なし、それらを植民地統治と武装強盗を外交的パートナーシップとして偽装したものと比較している。", "summary_en": "Owei Lakemfa criticizes the Trump administration's erratic foreign policy decisions, from threatening Oman over the Hormuz Strait reopening to attempting to seize Greenland and the Panama Canal. The author argues that the US military seizure of Venezuela's oil resources and imprisonment of President Maduro represent acts of international anarchism, comparing them to colonial exploitation and armed robbery disguised as diplomatic partnership.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/904723-remaining-sane-in-an-increasingly-insane-world-by-owei-lakemfa.html", "state_media": false, "category": "政治", "full_text": "It appears the re-opening of the Strait of Hormuz, through which one-fifth of world oil passed before the US–Iran war, was one of the most urgent tasks of humanity. The United States has, for six months, been unable to re-open this vital artery, which handled 100–140 commercial ships daily. Then, like magic, Oman and Iran reached a consensus to reopen the strait. Oman, a tiny country of 5.4 million people spread over a 309,500 square kilometre area, is one of the closest allies of the US. It was the first Arab nation in the Arabian Peninsula to sign a trade and diplomatic agreement with the US. That was 193 years ago. In the on-going US–Iran conflict, Oman has suffered many Iranian strikes, including on the ports of Duqm and Salalah, the industrial areas of Sohar, Mina Al Fahal and Bukha, radar and ship-detection infrastructure, and hits on commercial and oil tankers navigating the Gulf of Oman.\nSo, ordinarily, the US should have been elated that a breakthrough was being reached to re-open Hormuz, reduce oil prices and wars. But President Donald Trump was furious at the Oman–Iran breakthrough. He threatened to annihilate its ally. He declared: “If Oman gets in the way, we’ll bomb the shit out of them.” Beyond being angry at the breakthrough where the US has failed in the last six months to reopen Hormuz, I can only attribute the threat to a streak of insanity that has been visible since the return of the Make America Great Again (MAGA) regime in Washington.\nWhen, on 20 January, 2025, Trump signed an executive order unilaterally renaming the ancient Gulf of Mexico as the “Gulf of America,” some thought he was being territorial. But I reasoned that a name change that has no international binding status could not have come from a rational mind. It is like the US unilaterally changing the name of the United Nations; that can be reflected in its own documents, but cannot be binding on the rest of the world. A similar trait was visible when Trump imposed ridiculous tariffs on various countries of the world. The increased tariff imposed on China was 104–125 per cent and 50 per cent on countries such as Brazil, Cambodia and Canada. Just this Wednesday, 19 August, Trump paused the 50 per cent tariffs on Canadian goods. The US basically needed to have realised that it is not the only country that can impose crazy tariffs; other countries can equally reciprocate.\nThere are also the repeated Trump talks of converting Canada into the 51st state of the US. Similarly, he had, in January, threatened world peace by deciding to seize Greenland, a Danish colony. He told the Europeans to allow him to do so either the “easy way or the hard way.” This had led to some European nations sending troops to the territory.\nThis strain of insanity had also been visible when Trump threatened to seize the Panama Canal based on his false claims that it was being run by the Chinese, who were imposing exorbitant fees on the US. The truth is that the facility is being run by the Panama Canal Authority, an agency wholly owned and run by the Panamanian government. Perhaps the greatest acts of insanity, and the pushing of the world back into the Stone Age of international anarchism, are those he is perpetuating in Venezuela, where he had seized its President Nicolás Maduro, locked him in a US prison, and seized that country’s oil and gas resources, which he is selling and giving that country some stipends out of its legitimate resources. It is like bandits occupying the home of a victim, abducting the family leaders and continuously stealing the wealth of their victims.\nThe US under Trump, having militarily seized Venezuela since January 2026, is sending more than 500,000 of that country’s 1.25 million barrels-per-day stolen oil to its refineries in Texas, Mississippi and Louisiana. US Under Secretary of Energy Kyle Haustveit unashamedly said that those US refineries were “built specifically for that (Venezuelan) crude.” Sure, the US would not readily admit the theft of Venezuelan oil, so Haustveit described it as “a beautiful energy partnership.” The same thing Europeans did when they colonised African countries and stole their human and natural resources in the name of evangelising and civilising them.\nUsually, thieves try to hide their intentions and would not ordinarily admit they are armed robbers. But Trump has been truthful. Immediately after US troops seized Venezuela, he told the world: “This (Venezuelan) oil will be sold at its market price, and that money will be controlled by me, as President of the United States of America, to ensure it is used to benefit the people of Venezuela and the United States!” It doubtlessly is benefiting the US, but not Venezuelans. US Secretary of State Marco Rubio later clarified this system of extortion. He told the US Congress that Venezuela is required to submit a monthly budget request against whatever money the US will pay for its oil and that the US will specify to what use Venezuela can put such a", "translation_ja": "", "vocab": [{"word": "unilaterally", "definition": "一方的に、他方と協議や同意なしに行動すること。国際関係では、一国が独自の判断で行動することを指す。"}, {"word": "exorbitant", "definition": "法外に高い、不当に高いという意味。特に価格や費用が不合理なほど高いときに使用する。"}, {"word": "anarchy", "definition": "政府や統治機構がない混乱した状態。国際関係では、各国が法的拘束力なく行動する秩序なき状態を指す。"}, {"word": "legitimacy", "definition": "正当性、法的根拠があることを意味する。政治や統治に関して、その権威が正当であるかどうかの問題。"}, {"word": "extortion", "definition": "脅迫や強要によって金銭や利益を奪い取る行為。犯罪行為として認識される非合法な活動。"}, {"word": "stipends", "definition": "給付金、定期的な手当。特に学生や労働者に対して支払われる一定額の金銭。"}]}, {"title_ja": "UBA大学院訓練生の顧客サービス改善案がエルメル会長に高く評価される", "title_en": "UBA Graduate Trainee's Customer Service Ideas Impress Chairman Elumelu", "summary_ja": "UBA大学院訓練生のデボラ・モーゼスは、顧客体験を改善するための革新的なソリューション（「UBA旅程ガイド」とリアルタイム顧客追跡システムなど）を提案した後、会長トニー・エルメルの注目を集めました。エルメルは彼女のアイデアを称賛し、銀行でのキャリア継続を励まし、キャリアのどの段階でもイニシアティブと発言がインパクトを生み出すことができることを示しました。", "summary_en": "Deborah Moses, a UBA graduate trainee, gained attention from Chairman Tony Elumelu after proposing innovative solutions to improve customer experience, including a \"UBA journey guide\" and real-time customer tracking system. Elumelu praised her ideas and encouraged her future career at the bank, demonstrating how initiative and speaking up can create impact regardless of career stage.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/904717-celebrated-uba-graduate-trainee-speaks-about-handshake-with-elumelu.html", "state_media": false, "category": "社会", "full_text": "Deborah Moses, a graduate trainee at United Bank for Africa Plc (UBA), has described her interaction with the UBA chairman Tony Elumelu as a long-cherished dream.\nMs Moses attracted the attention of the bank’s Chairman, Tony Elumelu, after she shared observations and ideas on how the lender could address recurring problems faced by its customers.\nMs Moses made the observations on Thursday during a question-and-answer session at UBA’s Graduate Management Accelerated Programme (GMAP), where she spoke about her experience during her on-the-job training (OJT).\nShe told Mr Elumelu, who is finishing his tenure as the bank’s chairman in August, that many UBA customers repeatedly encounter similar problems but often do not know the documentation required to resolve them before visiting a branch.\nAccording to her, this often leaves customers having to return home to obtain the required documents before their complaints can be addressed, creating frustration and discouraging some from returning to the bank.\n“During my OJT, I observed that our customers all have repetitive problems. They will come back for the same complaints, and then most of them do not know the required documentation that they need to bring so that their problems would be attended to smoothly.\n“Mostly, they will realize that the customer service will now tell them, so you need this and you need that. Please, can you go back and bring it? And they’ll be like, I don’t have time. I cannot come back to this bank again. That’s a very big problem,” she said.\nMs Moses therefore suggested that the financial institution introduce a “UBA journey guide” for customers during onboarding, containing information on the documents and steps required for different banking-related complaints and requests.\n“So I want to suggest, how about we have a UBA journey guide for our customers during onboarding, when they are registering with us. We give them maybe a PDF that contains what you need to do at a particular time,” the graduate trainee said.\nShe explained that the guide could be available in both digital and hard-copy formats, particularly to accommodate customers who are less comfortable with digital products.\nThe guide, she said, could cover issues such as changing a phone number and the documents customers need to bring to the bank to ensure prompt and smooth responses to their requests.\n“And we can also have it in hard copy for some of our customers who do not really like the digital product.\n“This way, they are informed of what they need to bring to the bank. They don’t always have to come and go back or have to come,” she said.\nMs Moses, an agricultural economics and extension graduate, also proposed that the lender create a department responsible for capturing customers’ experiences in real time across its branches.\nShe said such a system would enable the bank to track the number of customers visiting its branches, those attended to and those who were not, while identifying recurring complaints.\n“At the end of the day, we know this number of people came to the bank; these people were attended to, and these were not, at the branch level. Daily reports, in a way, will help us know the recurring problems, the ones that are the highest, and then we will know how to solve them and reduce inflow,” she said.\nReacting to Ms Moses’ suggestions, the UBA chairman, Mr Elumelu, invited the graduate trainee to the podium, extolled her ideas and exchanged a handshake with her.\n“If we hand over to people like you in UBA, we will be safe,” Mr Elumelu said, expressing his enthusiasm to continue monitoring her career at the bank.\nMeanwhile, in a Facebook post on Friday, Ms Moses said the moment reinforced her belief that ideas, initiative and the courage to speak up can create an impact, regardless of where one is in their career journey.\nREAD ALSO: UBA strengthens Africa’s future leadership pipeline, graduates 374 young professionals\n“I always imagined the day I’d shake hands with the outgoing Chairman. Yesterday, I got more than a handshake; I got a hug, encouragement, and his recommendation.\n“During my GMAP OJT, by the Grace of God, I identified a problem, suggested a solution, and dared to speak up. He loved the idea.\n“That moment reminded me that ideas matter, initiative matters, and your voice can create impact; regardless of where you are in your journey,” Ms Moses added.\nThe UBA graduate trainee previously worked as a Human Resources Assistant at Bank of Agriculture (BOA) after graduating in 2023. She also worked with NEAT Microcredit before joining the UBA internship programme.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "recurring", "definition": "何度も繰り返し起こる、反復する。ビジネス文脈では、継続的に発生する問題や課題を指します。"}, {"word": "onboarding", "definition": "新規顧客や従業員を組織に統合するプロセス。銀行では新規顧客が口座開設時に受ける一連の手続きと情報提供を意味します。"}, {"word": "tenure", "definition": "職務や地位を保持している期間。ここではエルメル会長が会長職を務めた期間を指しています。"}, {"word": "extolled", "definition": "高く評価する、たたえる。誰かのアイデアや業績を公に称賛する行為です。"}, {"word": "inflow", "definition": "流入、到着。ここでは支店に訪れる顧客の数や相談事の数が増加することを指します。"}, {"word": "initiative", "definition": "主導権、積極的な行動。組織の指示を待たずに自分から行動を起こす力を意味します。"}]}, {"title_ja": "アジャイが得点、ナイジェリア選手がプレミアリーグシーズンを好不調で開幕", "title_en": "Ajayi Scores as Nigerian Players Start EPL Season with Mixed Results", "summary_ja": "セミ・アジャイがハルシティをマンチェスター・ユナイテッドに2-0で勝利させ、イングランドフットボール史上初の新昇格チームへの開幕戦敗北をもたらしました。一方、オラ・アイナのノッティンガム・フォレストはリーズに1-0で敗れ、フランク・オニェカとタイウォ・アウォニイはコベントリーでアーセナルに3-0で敗北しました。2024/25シーズンのプレミアリーグは複数クラブで活躍するナイジェリア選手の強い存在感を示しています。", "summary_en": "Semi Ajayi scored as Hull City defeated Manchester United 2-0 in an impressive upset on opening day, marking a historic first loss for United against a newly promoted side. Meanwhile, other Nigerian players had contrasting fortunes, with Ola Aina's Nottingham Forest losing 1-0 to Leeds United, and Frank Onyeka and Taiwo Awoniyi suffering a 3-0 defeat with Coventry City against Arsenal. The 2024/25 Premier League season showcases a strong Nigerian presence, with established internationals and emerging young talents competing across multiple clubs.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/904712-epl-ajayi-scores-as-nigerian-players-make-mixed-start-to-new-season.html", "state_media": false, "category": "社会", "full_text": "Semi Ajayi marked his return to the Premier League in spectacular fashion, scoring as newly promoted Hull City defeated Manchester United 2-0 on Saturday.\nAjayi struck in the 17th minute and Nobel Mendy added a second in the 38th minute as Manchester United lost on the opening day of a league season to a newly promoted side for the first time in their history, having won 10 of the first 13 instances (D3).\nThe Nigeria international started at centre-back and helped Hull keep a clean sheet before being substituted in the 64th minute.\nThe victory was an impressive start for Hull, who returned to the Premier League after a nine-year absence and were widely expected to struggle against one of England’s most decorated clubs.\nFor United, the defeat was a disappointing start under Michael Carrick after the club finished third last season and secured Champions League football.\nAina starts, Forest lose late\nOla Aina also featured on Saturday as Nottingham Forest began their campaign with a 1-0 home defeat to Leeds United.\nAina started and played the match as Leeds secured victory through Anton Stach’s late free-kick, condemning Oliver Glasner to defeat in his first competitive match as Forest manager.\nThe result leaves Forest with work to do ahead of their next fixtures.\nNigerians began season with mixed fortunes\nAjayi’s heroics came a day after Frank Onyeka and Taiwo Awoniyi suffered defeat with Coventry City.\nOnyeka played the full match while Awoniyi came off the bench in Coventry’s 3-0 loss to defending champions Arsenal at the Emirates Stadium on Friday. Kai Havertz, Bukayo Saka and Martin Ødegaard scored for Arsenal.\nThe defeat was Coventry’s first match back in the Premier League after 25 years.\nThe opening weekend continues to provide opportunities for several other Nigerians.\nAlex Iwobi and Calvin Bassey are expected to feature for Fulham when they host Chelsea on Monday, while Benjamin Fredrick’s Brentford face fellow London side Tottenham Hotspur on the opening weekend.\nREAD ALSO: Osimhen scores twice as Galatasaray crush Erzurumspor\nAt Brighton, teenage Nigerian winger Zadok Yohanna is another player attracting attention after joining the club from AIK Stockholm on a five-year contract. Brighton have confirmed their opening fixture against Aston Villa on Sunday.\nThe 2026/27 campaign therefore promises another strong Nigerian presence in the Premier League, with established internationals such as Iwobi, Bassey and Aina joined by Ajayi, Onyeka and Awoniyi, while younger players including Fredrick and Yohanna seek their first significant opportunities.\nFor now, Ajayi has set the early benchmark, with his goal helping Hull secure one of the opening weekend’s biggest shocks.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "promoted", "definition": "昇進した、上位リーグに昇格した。スポーツでは、下位のリーグから上位のリーグへ進むことを意味します。"}, {"word": "condemned", "definition": "非難する、悪い運命に追いやる。ここでは監督が敗北を避けられない状況に置かれたことを意味します。"}, {"word": "competitive", "definition": "競争的な、実戦の。公式な試合や競争に関連することを示します。"}, {"word": "established", "definition": "確立された、地位が確定した。実績があり、認識されている選手や地位を示します。"}, {"word": "benchmark", "definition": "基準、目安となる標準。比較や評価の対象となる基準を意味します。"}, {"word": "absence", "definition": "不在、欠席。ここでは9年間プレミアリーグから離れていたことを示します。"}]}, {"title_ja": "カーニー首相、米国・カナダ貿易提案を非難し報復を誓う", "title_en": "Carney Slams U.S.-Canada Trade Proposal and Vows Retaliation", "summary_ja": "マーク・カーニー首相は土曜日、トランプ大統領の懲罰的な関税に対応して米国との貿易交渉の一時停止を発表する力強いスピーチをカナダ国民に向けて行いました。この動きは報復措置への決意を示すもので、両国間の緊張のエスカレーションを意味しています。", "summary_en": "Prime Minister Mark Carney delivered a forceful address to Canadians on Saturday, announcing the suspension of U.S. trade negotiations in response to President Trump's tariffs. The move signals Canada's determination to retaliate against the punishing trade measures, marking an escalation in tensions between the two countries.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/22/world/canada/carney-tariffs-trade-trump.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「The Rest Is History」ポッドキャストが世界を制覇した方法", "title_en": "How 'The Rest Is History' Podcast Conquered the World", "summary_ja": "イギリスの歴史家トム・ホランドとドミニク・サンドブルックが立ち上げた「The Rest Is History」ポッドキャストは、大成功を期待していませんでした。同番組は英語圏で最高の歴史ポッドキャストとなり、その世界的な人気で制作者たちさえも驚かせています。", "summary_en": "British historians Tom Holland and Dominic Sandbrook launched 'The Rest Is History' podcast without expecting massive success. The show has become the top history podcast in the English-speaking world, surprising even its creators with its global popularity.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/22/world/europe/rest-is-history-podcast-sandbrook-holland.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イタリア人作家が家族の暗い側面を描く新作で議論を呼ぶ", "title_en": "Italian Novelist Explores Dark Side of Family Bonds in New Work", "summary_ja": "アンドレア・バヤーニの最新作は、イタリアの家族関係を心理的・身体的暴力で特徴づけられた「小さな全体主義体制」として描いている。多くのイタリア人がこの描写に自分たちの姿を見出し、親密な家族関係の複雑な性質についての議論が生まれている。この作品は家族愛と親密さのロマンティックな理想に異議を唱えている。", "summary_en": "Andrea Bajani's latest novel examines Italian family dynamics as a \"little totalitarian system\" marked by psychological and physical violence. Many Italians recognize themselves in the portrayal, sparking discussion about the often complicated nature of close-knit family relationships. The work challenges romanticized notions of familial love and intimacy.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/22/world/europe/italian-families-novel-anniversary-bajani.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事地帯の通行を許可、パレスチナ人がガザ北部へ帰還", "title_en": "Palestinians Return to Northern Gaza After Israel Opens Military Crossing", "summary_ja": "人質解放交渉の膠着状態が打開された後、イスラエルはガザを二分する軍事地帯の通行を許可し、避難していたパレスチナ人の帰還が始まった。この重要な通路の再開は、停戦交渉の長期的な膠着状態が解決したことを示す大きな進展となっている。現在、数千人のガザ住民が徒歩でエンクレーブの北部へ帰還することができるようになった。", "summary_en": "Israel has allowed displaced Palestinians to begin crossing back through a military zone that divides Gaza, following a breakthrough in hostage release negotiations. The reopening of this critical passage marks a significant development after a prolonged deadlock in ceasefire talks. Thousands of Gazans are now able to return on foot to the northern part of the enclave.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発業者が巨額損失を報告、不動産危機の深刻化を示す", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Real Estate Crisis", "summary_ja": "中国最大級の不動産開発企業バンケは巨額の損失を報告し、不動産セクターの危機がさらに深刻化していることへの懸念を強めている。同社の経営難は、中国政府が不安定な不動産市場の安定化に介入するかどうかという疑問を生じさせている。", "summary_en": "Vanke, one of China's largest property developers, has reported a significant loss, intensifying concerns about the deepening real estate sector crisis. The company's struggles raise questions about whether the Chinese government will intervene to stabilize the troubled property market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃から8ヶ月後も体内に破片を保持", "title_en": "Freed Israeli Hostages Carry Shrapnel Wounds Eight Months After October 7 Attack", "summary_ja": "イスラエルの医療当局者によると、解放されたイスラエル人人質の体内には10月7日の攻撃による破片がまだ埋め込まれたままであるという。一部の女性は長期間隔離状態で拘束され、トンネル内に8ヶ月間閉じ込められていた。これらの身体的損傷は、人質が拘禁中に経験したトラウマの深刻さを物語っている。", "summary_en": "Released Israeli hostages still have embedded shrapnel in their bodies from the October 7 attack, according to Israeli medical officials. Some women were held in isolation for extended periods and spent eight months confined in tunnels. The physical injuries reveal the trauma endured by hostages during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "迎撃ミサイルが枯渇したときに何が起こるか", "title_en": "What Happens When Interceptor Missiles Run Out", "summary_ja": "ウクライナおよび他国は、防空需要の急増に伴い迎撃ミサイルの深刻な不足に直面している。供給危機は航空攻撃に対する防御能力に対する広範な懸念を引き起こしている。軍事戦略家は、備蓄の枯渇が重大な戦略的影響をもたらす可能性があると警告している。", "summary_en": "Ukraine and other nations face a critical shortage of interceptor missiles as air defense demands surge. The supply crisis is causing widespread concern about the ability to defend against aerial attacks. Military planners warn that depleted stockpiles could have serious strategic implications.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エコノミスト、パーソナライズされたニュースレターを導入", "title_en": "The Economist Launches Personalized Newsletter Service", "summary_ja": "エコノミスト誌は「The Economist for You」という新しいパーソナライズニュースレターを開始しました。このサービスは、購読者の個人的な関心や好みに合わせてカスタマイズされた読むべき記事リストを提供しています。読者エンゲージメントを高め、よりキュレーションされたニュース体験を実現することを目的としています。", "summary_en": "The Economist has introduced a new personalized newsletter called 'The Economist for You' that delivers customized reading lists directly to subscribers' inboxes. The service allows readers to receive content tailored to their individual interests and preferences. This initiative aims to enhance reader engagement by providing a more curated news experience.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/introducing-our-latest-newsletter-the-economist-for-you", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブームがアメリカの慈善活動を変革", "title_en": "Silicon Valley's AI Boom Is Remaking American Charity", "summary_ja": "シリコンバレーのテック企業創業者たちがAI事業の巨大な富から、数千億ドルを慈善事業に寄付することを誓約している。この動きは、これまでにない規模の資金がどのように配分され、今後の慈善支出の優先順位をどのような基準で決定するのかという問題を提起している。", "summary_en": "Tech founders in Silicon Valley are pledging hundreds of billions of dollars to charitable causes as their AI ventures generate massive wealth. The movement raises questions about how these unprecedented sums will be allocated and what priorities will guide philanthropic spending in the coming years.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランドとウクライナ、第二次世界大戦の集団墓地発掘を通じて共有の歴史に向き合う", "title_en": "Poland and Ukraine Confront Shared WWII History Through Mass Grave Excavations", "summary_ja": "ウクライナ西部の旧村落ヴォラ・オストロヴィエツカとオストロフスキで、考古学者たちが1943年にウクライナ民族主義者によって殺害されたポーランド人民間人の遺骨を発掘している。80年以上経った現在でも、この悲劇的な章はワルシャワとキーウの外交関係に緊張をもたらし続けている。", "summary_en": "Archaeologists in western Ukraine are exhuming remains of Polish civilians killed by Ukrainian nationalists in 1943 from former villages Wola Ostrowiecka and Ostrowki. Over 80 years later, this tragic chapter continues to strain diplomatic relations between Warsaw and Kyiv as both nations grapple with their complex and painful shared history.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/22/the-slow-reconciliation-of-polish-and-ukrainian-memories-over-world-war-ii-mass-graves_6756766_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国とカナダの貿易交渉が決裂、50%の関税が発動へ", "title_en": "US-Canada trade talks collapse as 50% tariffs set to begin", "summary_ja": "米国とカナダ間の貿易交渉が金曜日に決裂し、米国は土曜日からカナダ製品に対する新たな50%の関税を発動する。オタワは同等の規模の報復関税で対抗すると表明し、両隣国間の緊張が高まっている。", "summary_en": "Trade negotiations between the US and Canada broke down on Friday, prompting the US to implement new 50% tariffs on Canadian products starting Saturday. Ottawa has pledged to respond with retaliatory tariffs of equivalent scope, escalating tensions between the two neighboring nations.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/economy/article/2026/08/22/us-canada-trade-talks-collapse-testing-ottawa-s-strategy-of-firmness_6756757_19.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランスとイギリスの元大使ら、パレスチナ問題で国際法維持のための共同行動を呼びかけ", "title_en": "Former French and British Ambassadors Call for Joint Action on Palestine", "summary_ja": "フランスとイギリスの約100人の元外交官がパレスチナにおける国際法の維持のため、両国政府が共同で行動するよう促す公開書簡を発表した。イスラエルの占領と破壊政策に対応して、元大使らは法の支配を守るための協調的な制裁を主張している。", "summary_en": "Around one hundred former diplomatic representatives from France and the United Kingdom have issued an open letter urging their governments to work together to uphold international law in Palestine. In response to Israel's occupation and destruction policies, the former ambassadors advocate for coordinated sanctions to safeguard the rule of law in the region.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/opinion/article/2026/08/22/france-and-the-uk-should-act-together-to-uphold-international-law-in-palestine-an-open-letter-by-former-french-and-british-ambassadors_6756756_23.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省ニュースレター", "title_en": "Mindef Newsletter", "summary_ja": "シンガポール国防省（Mindef）からのニュースレター更新です。購読者はニュースレター設定を管理し、ザ・ストレーツ・タイムズから追加の無料コンテンツを購読できます。", "summary_en": "A newsletter update from Singapore's Ministry of Defence (Mindef). Subscribers can manage their newsletter preferences and sign up for additional free content from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニングアップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズが最新のニュースと情報をお届けします。読者は購読設定を管理し、出版社からの追加ニュースレターに登録できます。", "summary_en": "The Straits Times delivers its evening news update with the latest developments and stories. Readers can manage their subscription preferences and sign up for additional newsletters from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズのモーニングブリーフィングは、毎日のニュース更新と分析を提供します。読者は出版物のプラットフォームを通じて追加の無料ニュースレターに登録し、購読を管理できます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and analysis. Readers can sign up for additional free newsletters and manage their subscriptions through the publication's platform.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル警察、ハアレツ紙購読キャンセルの理由について嘘をついたことを認める", "title_en": "Israel Police Admits Lying About Canceling Haaretz Subscription", "summary_ja": "イスラエル警察は、ハアレツ紙の購読をキャンセルした理由について虚偽の説明をしたことを認めた。警察庁による購読中止決定の精査を受けて、この認めが行われた。", "summary_en": "Israel Police acknowledged that it provided false reasons for canceling its subscription to the Haaretz newspaper. The admission came after scrutiny of the police department's decision to discontinue its access to the publication.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMipAJBVV95cUxPVUFoVE5rY0xUbzRMUEVpRk9NN3p0bXNDRzkwZFVTSWJmUkhQekJsVkg0Q3ozcExVV2FBZTM0d29nbllvUFNBSDFjeThGdEtDWDlWeXFodTZ5YVlaTFpyZzdkWk1yNE9WY3NZZWp5LTVXcS1QSGRaUVpOclA4VEZHQ0NOQUJOdHEycnNzNnR2VFdYc3pkQjI4MUh4N1Y3UHFTNEY5RU15eWZmc3RXLU9CMHBrcmxkazZUUWU4YU1lODdObFFiUEhHZ3ppX1NUMEpJTVNVQkxNM0FNWC1hU1lHOWZxTzZTRHBGdFFKcllrc3g3clRNWnMwTE9ub2Y4cXl3dVVtLUF6eXN2SVdUaWx4YW5Cc0o4SHpHRVNCWDNHQUMxWEhU?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ガザから越境したとみられる凧がイスラエル南部で懸念を招く", "title_en": "Kites from Gaza Raise Concerns in Southern Israel", "summary_ja": "ガザから越境したとみられる凧がイスラエル南部で安全保障上の懸念を引き起こしている。この事件はイスラエル・ガザ国境沿いの緊張の高まりを浮き彫りにしている。当局はこれらの凧がもたらす潜在的なリスクを監視している。", "summary_en": "Kites believed to have crossed from Gaza into southern Israel are raising security concerns among residents. The incidents highlight ongoing tensions along the Israel-Gaza border. Authorities are monitoring the situation as these kites pose potential risks to the region.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimgJBVV95cUxONkI1anoxYmpRY2lNWXVTQVEyWWdWYjFacksxRlRaN0htQWVYVnpsNDBfLUdScEJ4QVRfYzA4aGRoSktjZk1WMGRLRU1oRXdoN3pSb05nc2hYUjI3N2lWRUFBMWhXRW4yaUY3UmJVS1lIQWhTVXVVZzhvbXZhZWxpQ1RhYzdFSkZmYkZQdUdzdVNrSDk2TFpsQ1BsbkxXNEU2UGZGRGF0RXBZQUtHaTAta05DbWtHTTl4bk9iZ0RweTB6ZU5DSHdQT1pRbFdPczA4WWI4enZFSzhpX19YaWpRRXpHMmxtSTM4dFlUTFg3Q1VWaFc2X1RVQ0FKaE92M0pFclM2SXAyaHNGUVdrbzlrSm1xMERyRWtmZHc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル軍によるガザ地区での空爆で男性が殺害、IDF司令官と主張", "title_en": "Man Killed in Israeli Strike in Gaza; IDF Claims Hamas Commander", "summary_ja": "イスラエル軍がガザ地区で実施した空爆により男性が殺害され、イスラエル国防軍はその対象がハマスの司令官だったと主張しています。この空爆は同地域における継続的な軍事作戦の一部です。事件の詳細については、情報が更新されています。", "summary_en": "An Israeli airstrike in Gaza resulted in the death of a man, with the IDF claiming the target was a Hamas commander. The strike is part of ongoing military operations in the region. Details about the incident continue to emerge.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimwJBVV95cUxQcHZoTFRjRmhxUDJJRkFNS3pocVhSTk40WER6N21CNUsyX1J1M0VxdGozQzBDQWU0UGxsOUhUaEY2eWZIUlFfT2hmSjk3VGZscUxsYkJZeUg5c1hnc0NEaWlxRDRtRUdlSlJMZm1jQzBqdmU0R013UDlNMTNpQUVxbzh5QkRHOEptVUZVY3hhT1Bhd2VVcndqelFLUzNNRDFOQUI3ZzU5VW05NEZYbGFQbEk4WmVSc2ZYMVNzUlJNN2dDRkZqeUVmTWJ2N2ZweGJPVEYyX2d0dDUtUS1BYXN5d05wNkhVbGpRbm0xSlRTdVptS0c4Vjl5SkZlLVdla2pYY1V4N21YUElMMWlzTUpheW5CSlJ3bFBxQTc0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾議会、学校における月経平等を推進する法律を改正", "title_en": "Taiwan Legislature Amends Law to Promote Menstrual Equity in Schools", "summary_ja": "台湾議会は、学校における月経平等を促進するための法律改正案を可決しました。この法改正は月経困難による貧困に対処し、教育上の障壁を減らすことを目的としています。この改正案は、月経が学生の登校や学業成績に悪影響を与えないようにするための取り組みを示しています。", "summary_en": "Taiwan's legislature has passed amendments to promote menstrual equity in schools, addressing period poverty and related educational barriers. The legislation aims to ensure that menstruation does not negatively impact students' school attendance and academic performance. The amendments represent efforts to create a more inclusive and supportive school environment for all students.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9vX1RxaG9BUWF1QmcxNEhHdDZDcWlwRlRHRDhLOS1wMlp4LWhCUHd6WXNCV0NBSnMxQzNGNDZtWHk3Qnh6Xzg0NE5vamU5UXNsRHZ5RFlGdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、リピーター外国人観光客向けに5,000台湾ドルの旅行クレジットを提供", "title_en": "Taiwan Offers NT$5,000 Travel Credits to Repeat Foreign Visitors", "summary_ja": "台湾は以前に同国を訪問した外国人観光客を対象に、5,000台湾ドル（約170米ドル）の旅行クレジットを提供するインセンティブプログラムを開始します。このイニシアティブは、リピート観光の奨励と観光・宿泊業界の活性化を目指しています。このプログラムは台湾を再訪し、さらなる観光地を探索したい国際観光客を対象としています。", "summary_en": "Taiwan is launching an incentive program offering NT$5,000 (approximately USD$170) in travel credits to foreign visitors who have previously traveled to the country. This initiative aims to encourage repeat tourism and boost the travel and hospitality sectors. The program targets international tourists seeking to revisit Taiwan and explore additional attractions.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBqZW1qU05BalBGUDVYYkhFNGtMMkZRaExEaGdaYXFPc0RDUTNKUV9odzk1a242T0Vlc3pNRmJxb3dhUk1WS1h5dWhXME1mQmEwb2tTZkNB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾へ向かう最初の2機のF-16V戦闘機", "title_en": "First two F-16V fighter jets en route to Taiwan", "summary_ja": "情報筋によると、台湾が最初の2機のF-16V戦闘機を受け取る予定であるという。最新型航空機は台湾の防空能力の大幅な強化を示している。この納入は台湾の軍事近代化の取り組みの進展を示すものである。", "summary_en": "Taiwan is receiving its first two F-16V fighter jets according to sources. The advanced aircraft represent a significant strengthening of Taiwan's air defense capabilities. The delivery marks progress in Taiwan's military modernization efforts.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9iLTFXZ0JxaTNsWDJ3SE1YVlFjbHZfdUtZZzJXempfUlA0RVFkN0VQQWRPN2FLeFdKanRpTmhFOFdmN2x4c1VJOUdfbE9UMHJndVlKSnVCaw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国外相、健全で持続可能な中韓関係を呼びかけ", "title_en": "Chinese FM Calls for Healthy, Sustainable China-South Korea Ties", "summary_ja": "CGTNが報じたところによると、中国の王毅外相は水曜日、中国と韓国が二国間関係において戦略的ビジョンを示すべきだと呼びかけた。同国営メディアによれば、王毅外相は両国の関係の健全で安定した持続可能な発展を確保する必要性を強調した。", "summary_en": "CGTN reports that Chinese Foreign Minister Wang Yi called Wednesday for China and South Korea to demonstrate strategic vision in their bilateral relations. According to the state media outlet, Wang Yi emphasized the need to ensure the healthy, stable and sustainable development of ties between the two nations.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-20/Chinese-FM-calls-for-healthy-sustainable-China-South-Korea-ties-1PKK9r21Wqk/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア、領土紛争地域近くでミサイル演習を実施", "title_en": "Russia Conducts Missile Drills Near Disputed Islands", "summary_ja": "CGTNが報じたところによれば、ロシア太平洋艦隊は南クリル諸島（日本が北方領土と呼ぶ地域）近くの海域で、想定敵艦を標的とするミサイル発射演習を実施した。艦隊によれば、木曜日の演習ではすべての標的に命中したという。この演習は、ロシアと日本の両国が領有を主張する領土近くで実施された。", "summary_en": "CGTN reports that Russia's Pacific Fleet conducted missile launch exercises targeting simulated enemy ships near the Southern Kuril Islands, which Japan refers to as the Northern Territories. According to the fleet, all targets were successfully hit during Thursday's drills. The exercises took place in waters near the disputed territory claimed by both Russia and Japan.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-22/Russia-holds-missile-drills-near-disputed-islands-1POe9DLMVPO/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア、ドネツク州ボドニャンスコエの制圧を主張", "title_en": "Russia Claims Capture of Vodnyanskoye in Donetsk Region", "summary_ja": "CGTNが報じたところによれば、ロシアはウクライナ東部のドネツク州の集落ボドニャンスコエを制圧したと主張している。紛争地域での軍事作戦の詳細については限定的な報道となっている。", "summary_en": "CGTN reports that Russia claims it has captured the settlement of Vodnyanskoye in Ukraine's Donetsk Region. The report provides limited details about the alleged military operation in the contested eastern Ukrainian territory.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-19/news-1PJMpo6K4kE/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アルメニア原発の閉鎖はエレバンの依存度を増加させると露外交官", "title_en": "Shutdown of Armenian NPP Would Increase Yerevan's Dependence, Says Russian Diplomat", "summary_ja": "ロシア外務省のマリア・ザハロワ報道官は、アルメニアのメツァモル原子力発電所の閉鎖はエレバンを他国への依存度を高めると報告している。ザハロワはこの施設をアルメニアのエネルギー・バランスにおける「システム形成要素」と特徴づけている。RT/TASSは、閉鎖を提案している者や時間枠については詳細を提供していない。", "summary_en": "Russian Foreign Ministry spokesperson Maria Zakharova reports that closing Armenia's Metsamor Nuclear Power Plant would make Yerevan more dependent on other states. Zakharova characterizes the facility as a 'system-forming element' in Armenia's energy balance. RT/TASS does not provide details on who is proposing the shutdown or the timeline involved.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2176541", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン、米国の行動が世界的な核不安定性を生み出したと主張", "title_en": "Iran claims US actions created global nuclear instability", "summary_ja": "イランの安全保障理事会代表モフセン・レザエイ氏は、TASS通信によると、米国の行動が多くの国に核兵器の取得を検討させたと述べている。レザエイ氏は、米国の政策決定が世界的な核安定性と安全保障枠組みを損なわせたと主張している。", "summary_en": "According to Iran's Security Council representative Mohsen Rezaei, TASS reports that Washington's actions have prompted many countries to consider pursuing nuclear weapons. Rezaei contends that US policy decisions have undermined global nuclear stability and security frameworks.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2176539", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ラヴロフ外相、西側がロシア選挙妨害を企図していると主張", "title_en": "Lavrov Claims West Seeks to Disrupt Russian Elections", "summary_ja": "ロシアのラヴロフ外相は、西側がロシアに対する戦争を展開し、国旗を正義の象徴として使用していると報告している。TASによると、ラヴロフ外相は西側が9月の下院選挙を妨害しようとするだろうと強調したが、そのような計画は阻止されると述べた。", "summary_en": "Russian Foreign Minister Sergey Lavrov reports that the West is waging war on Russia and using its flag as a symbol of justice. TASS reports that Lavrov emphasized the West will attempt to disrupt September State Duma elections, though he claims such plans will be thwarted.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2176537", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドルの外側の防衛線が突破された", "title_en": "The Dollar's Outer Defenses Have Been Breached", "summary_ja": "トランプ政権の積極的な円支援介入は、他国の通貨不安がより広範な金融危機を引き起こし米ドルに影響を及ぼす可能性への懸念を反映している。財務長官スコット・ベッセントが円買いに50億～100億ドルを費やすという声明は、2012年のマリオ・ドラギの有名な介入を彷彿とさせ、政策立案者が1960年代に類似する伝播を懸念していることを示唆している。", "summary_en": "The Trump administration's aggressive intervention to support the yen reflects concerns that currency instability in other nations could trigger a broader financial crisis affecting the US dollar. Treasury Secretary Scott Bessent's stated commitment to spend $5-10 billion on yen purchases echoes Mario Draghi's famous 2012 intervention, suggesting policymakers fear contagion similar to the 1960s rather than previous crises.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/bessent-yen-bond-market-interventions-acts-of-desperation-by-harold-james-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Dollar's Outer Defenses Have Been Breached\nThe puzzle of why the Trump administration is so concerned with a falling yen has historical parallels not to the 1930s or the 1980s, but to the 1960s, when US officials feared that a crisis elsewhere could spread to America. With US bond yields spiking, Treasury Secretary Scott Bessent is getting desperate.\nPRINCETON—In a Reuters photo from late July, US Treasury Secretary Scott Bessent can be seen holding a to-do list with just one item: purchase $5–10 billion worth of yen. As he explained soon thereafter, invoking the famous phrase that then-European Central Bank President Mario Draghi used to save the euro in 2012, the Trump administration will do “whatever it takes” to prop up the Japanese currency.", "translation_ja": "", "vocab": [{"word": "contagion", "definition": "金融危機やその他の悪影響がある国から他の国へ広がる現象を指す経済用語。1960年代の金融危機で用いられた概念。"}, {"word": "intervention", "definition": "政府や中央銀行が市場に直接介入して、通貨やその他の金融資産の価格を調整しようとする政策措置。"}, {"word": "spikes", "definition": "急激で急速な増加を意味する。ここでは米国債利回りが急上昇することを指す。"}, {"word": "breached", "definition": "防御線や境界線が突破される、または破られることを意味する。比喩的に使用されている。"}, {"word": "desperate", "definition": "差し迫った状況で必死の行動を取る状態。ここでは財務長官が緊急の対応を迫られていることを示唆している。"}]}, {"title_ja": "世界がなぜ今もウォール街を必要とするのか", "title_en": "Why the World Still Needs Wall Street", "summary_ja": "米国の債務増加、政治的分極化、不予測な通商政策など、投資家が米国から資金を逃避させる理由は多くあるにもかかわらず、ドルは依然として世界金融で支配的である。著者は、他の金融システムが大規模な資本流入を吸収する能力に欠けるため、金融の多極化よりも地政学的多極化がより速く進んでいると主張している。", "summary_en": "Despite numerous reasons for investors to diversify away from the US—including rising debt, political polarization, and unpredictable trade policy—the dollar remains dominant in global finance. The author argues that other financial systems lack the capacity to absorb large capital inflows, causing geopolitical multipolarity to advance faster than financial multipolarity.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-financial-and-treasury-markets-still-no-alternative-by-jorge-arbache-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Why the World Still Needs Wall Street\nOutside of the United States, all other financial systems face major constraints on their ability to absorb large financial inflows. That is why geopolitical multipolarity is advancing faster than financial multipolarity, despite the many reasons that investors have to pursue greater diversification.\nBRASÍLIA—Investors have no shortage of reasons to diversify away from the United States. America’s public debt is rising, political polarization is deepening, trade policy has become unpredictable, the rule of law is now in doubt, and financial sanctions have encouraged other governments to seek alternatives to the dollar. Yet there has been no great exodus from US markets. The dollar still accounted for 56.8% of allocated foreign-exchange reserves at the end of 2025, and was used in 89.2% of all foreign-exchange trades surveyed by the Bank for International Settlements.", "translation_ja": "", "vocab": [{"word": "exodus", "definition": "大量の移動や脱出。ここでは投資家が米国市場から資金を引き上げることを指す表現。"}, {"word": "multipolarity", "definition": "複数の勢力や中心が存在する状態。地政学や金融における権力分散を意味する。"}, {"word": "diversification", "definition": "リスク低減のため、投資対象や資産の種類を複数に分散させる戦略。"}, {"word": "allocated", "definition": "特定の目的や用途のために配分・割り当てられた。外貨準備の配分先を指す。"}, {"word": "constraints", "definition": "制限や制約。ここでは金融システムの能力上の限界を示す。"}, {"word": "geopolitical", "definition": "地理的要因と政治的・軍事的状況の相互作用を扱う。国際関係における権力構造に関する。"}]}, {"title_ja": "高齢化する人口が必ずしも経済を弱体化させる必要はない", "title_en": "Aging Populations Need Not Mean Frailer Economies", "summary_ja": "人口高齢化は必然的に経済停滞をもたらすという従来の経済学的見方に反して、研究によれば労働力不足が生産性向上技術や革新への投資を促進し、労働人口の減少による悪影響を相殺して経済成長を維持することができる。", "summary_en": "Contrary to conventional economic wisdom, demographic aging does not necessarily lead to economic decline. Labor scarcity from aging populations incentivizes investment in productivity-enhancing technologies and innovation, which can offset the negative effects of a shrinking workforce and maintain economic growth.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/what-economists-get-wrong-about-demographic-change-by-andrew-j-scott-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Aging Populations Need Not Mean Frailer Economies\nGovernments and economists have long viewed demographic aging as a threat to economic growth. But new research finds that labor scarcity encourages investment and shifts innovation toward labor-saving technologies, boosting productivity enough to offset a shrinking workforce.\nOXFORD—The global demographic transition, characterized by declining birth rates and rising life expectancy, has been one of the most consequential transformations of the past century, with population aging fueling a steady stream of gloomy economic forecasts. If academic economists, international organizations, and national governments agree on just one thing, it is that an aging society inevitably leads to economic sclerosis.", "translation_ja": "", "vocab": [{"word": "demographic aging", "definition": "人口構造の高齢化を指す用語。出生率の低下と平均寿命の延伸により、総人口に占める高齢者の割合が増加する現象を意味します。"}, {"word": "economic sclerosis", "definition": "経済の硬化・停滞を指す比喩的表現。動脈硬化のように経済システムが柔軟性を失い、成長力が低下する状態を描写しています。"}, {"word": "labor scarcity", "definition": "労働力不足の状態。利用可能な労働力が需要に対して供給不足になることで、賃金上昇や生産性向上への投資圧力をもたらします。"}, {"word": "productivity", "definition": "生産性。単位時間当たりの産出量や効率性を示す経済指標で、経済成長の重要な要素です。"}, {"word": "demographic transition", "definition": "人口転換。高出生率・高死亡率から低出生率・低死亡率への段階的な移行過程を指す人口学的概念です。"}, {"word": "shrinking workforce", "definition": "縮小する労働力。労働人口の減少により、働き手の数が減少する状態を意味しています。"}]}, {"title_ja": "ナタリー・ハープ問題で露呈した共和党員の選別的な怒りと偽善", "title_en": "Republicans' Selective Outrage Over Natalie Harp Reveals Hypocrisy on Feminism", "summary_ja": "著者アルワ・マハダウィは、トランプ補佐官ナタリー・ハープについてのジョン・オソフ上院議員の発言を性差別だと非難した保守派評論家たちを批判し、彼らの女性扱いへの関心が偽善的であると主張している。ハープへの批判は性別によるものではなく、トランプへの執着的な献身と行政における疑わしい行動に由来していると主張している。", "summary_en": "Author Arwa Mahdawi critiques conservative commentators who accused Senator Jon Ossoff of sexism for his remarks about Trump aide Natalie Harp, arguing their sudden concern for women's treatment is hypocritical. She contends that criticism of Harp stems not from her gender but from her unprofessional behavior, including obsessive devotion to Trump and questionable conduct in his administration.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/22/natalie-harp-republicans-feminists", "state_media": false, "category": "オピニオン", "full_text": "Jon Ossoff is quite the miracle worker. Perhaps the Democratic senator can’t turn water into wine, but he has managed to turn whining conservatives into impassioned feminists.\nDuring a rally last Sunday, the Georgia senator delivered a takedown of Donald Trump, which included a reference to his aide Natalie Harp. “He doesn’t want to do the job,” Ossoff said of the president. “He wants to build his ballroom and travel with Natalie on their apparently defenseless flying palace gifted by the Emir of Qatar.”\nThose three words – travel with Natalie – were deliberately loaded. Harp was in the spotlight at the time because of the decoy plane story. The 35-year-old was one of a handful of people Trump had taken onto a different plane via a catering truck when he was worried about a potential assassination attack targeting Air Force One. Intrigue as to the exact nature of the relationship between Harp and Trump was heightened by the fact that Melania Trump, the president’s third wife, hadn’t been seen in public for weeks at the time. (Funnily enough, she magically reappeared on Thursday, a few days after Ossoff’s comments, for a press conference where she lovingly held hands with Trump. Very cute.)\nOssoff’s remarks about “Natalie” might have been something of a cheap shot, but it’s hilarious to watch the right discover misogyny and decry the remarks as sexist. Suddenly, everyone from Fox News to prominent conservatives are very worried about a professional woman not being taken seriously.\nThe former House speaker Newt Gingrich, for example, said on Twitter/X that Ossoff owes Harp an apology. “If a conservative Republican had attacked a liberal Democrat working professional woman the way Ossoff smeared Natalie Harp there would be cries to kick them off the ticket and reject this kind of misogynistic language diminishing and smearing someone who is simply doing their job.”\nThe conservative commentator Scott Jennings, who is rumoured to be a potential replacement for Karoline Leavitt as White House press secretary, was also appalled. “[Ossoff] unleashed a comment so vile against a young Republican woman working in politics that every woman in this country, no matter your ideology, ought to listen carefully and never forget it,” Jennings said on his podcast.\nMeghan McCain also clutched her pearls at the coverage Ossoff’s comments sparked. “The egregious sexist attacks on Natalie Harp are absolutely insane – and they’re coming from prestigious journalists,” she wrote on X. “What is wrong with everyone?! Every president has close aides and sometimes they are females. Like what year is this?!”\nIt’s 2026, Meghan. And in the year 2026 I think the masses have generally understood that simply criticizing a woman is not in itself misogynistic. I’m not saying there hasn’t been any misogyny in the Harp coverage, but the main reason there has been so much attention on the story is because the White House has had a completely unhinged response to Ossoff’s comments and kept it in the news. More importantly, the reason so many people aren’t taking the Trump aide seriously isn’t because she’s a woman; it’s because she’s not a serious person.\nAnd I’m being diplomatic with that choice of language. After all, we’re talking about someone whose nickname is “the human printer” because, while working on Trump’s re-election campaign, she reportedly ran around after him with a portable printer, handing him hard copies of flattering coverage. You could write that off as a canny career move from someone who understands flattery gets you everywhere with Trump, but that’s also one of the least weird things Harp has done. Per a CNN report, which has pictures of the incident, back in 2023, Harp jumped in the trunk of an SUV because she wanted to be close to Trump and there was no room in his motorcade. Once Trump won re-election and Harp joined him in the White House, she apparently worked for a year without security clearance. According to reporting by MS NOW, she declined to complete the clearance process for unknown reasons.\nAnd then there are the “adoring letters” Harp sent Trump, first mentioned in the book Regime Change, by the New York Times reporters Maggie Haberman and Jonathan Swan. Two were later published in the Daily Beast. “You are all that matters to me,” she wrote in one letter. Other memorable lines included “I want to bring you joy, to feel like we can get through a day without ever having to talk ‘work’”; she also called Trump her “Guardian and Protector in this Life”.\nTo state the obvious: these are deeply weird things to say to your boss. (It’s also weird that Harp shares Trump’s unconventional approach to capitalization.) I should note that Harp, who says she is a cancer survivor, seems to believe that Trump saved her life by signing legislation that gave her access to experimental bone cancer treatment when she was younger. While that might make her obsession with Trump more understandable, it does not make her general conduct", "translation_ja": "", "vocab": [{"word": "misogynistic", "definition": "女性を軽視・嫌悪する、または女性差別的な。性別に基づいて女性を不当に扱う態度や行動を表す。"}, {"word": "cheap shot", "definition": "不公正または卑怯な批判や攻撃。低い手段を使った相手への批判や非難を指す。"}, {"word": "decry", "definition": "強く批判する、非難する。公的に反対意見を表明することを意味する。"}, {"word": "unhinged", "definition": "不安定で非論理的な、精神的に問題のある。常識外れで危険な状態を表す。"}, {"word": "canny", "definition": "抜け目のない、賢明な。特にビジネスや金銭面で機敏で利益を見極める能力を示す。"}, {"word": "hypocrisy", "definition": "偽善、本音と建前の不一致。言行不一致で、自分の言うことと行動が矛盾している状態。"}]}, {"title_ja": "トランプ新司法長官は中絶権に極めて大きな脅威をもたらす", "title_en": "Trump's New Attorney General Poses Huge Threat to Abortion Rights", "summary_ja": "コラムニストのモイラ・ドノヴァンは、新たに確認されたトランプ政権の司法長官トッド・ブランシュが、司法省を利用してミフェプリストン郵送禁止やComstock法施行を推し進めることで中絶アクセスに深刻な脅威をもたらすと主張している。ブランシュはDobbs判決を全州で永続化させ、中絶を保護する民主党州を標的にすると公言しており、中絶薬によって得られた生命救済の安全性の進歩を逆転させる可能性がある。", "summary_en": "Opinion columnist Moira Donegan argues that Trump's newly confirmed attorney general Todd Blanche poses a severe threat to abortion access, particularly through his stated intent to weaponize the Justice Department to ban mifepristone mailing and enforce the 1873 Comstock Act. Blanche has publicly committed to making the Dobbs decision permanent nationwide and targeting Democratic states that protect abortion, which could reverse the life-saving safety gains enabled by the abortion pill.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/22/trump-attorney-general-todd-blanche-abortion-rights", "state_media": false, "category": "オピニオン", "full_text": "The abortion pill is a miracle. Mifepristone, then called RU-486, was synthesized by a French lab in the 1980s; in combination with misoprostol, commonly used as ulcer medication, it cuts off the body’s supply of progesterone, halts the development of a pregnancy, and incites contractions, which empty the uterus. The drug allows pregnancies to be terminated with a shocking degree of reliability and ease. Gone are the concoctions of ergot and Spanish Fly dispensed by 19th century midwives, which only sometimes worked to induce a miscarriage; gone are the backroom procedures of the pre-Roe US, when drunk, lascivious, incompetent or cruel providers wielded bent coat hangers in dirty rooms. The abortion pill is safe, effective and cheaper than ever. And since Dobbs, it’s everywhere: even if you live in a state with an abortion ban, you can get the pills shipped to your house in the mail. Since Roe was overturned, there has not been a return to the terror of mass death that marked the pre-Roe era of septic abortion wards, where women routinely found themselves maimed, sickened or killed. There’s exactly one reason why: because illegal abortions were largely unsafe without the pill, and they are extremely safe with it.\nSo of course, the Trump administration and their allies on the American right are trying to get rid of it. And this month, they gained a powerful new ally when Todd Blanche, Donald Trump’s former personal lawyer and an anti-abortion zealot, was confirmed as attorney general.\nThe vote, in which Blanche was confirmed by a margin of one along party lines, was conducted in the wee hours of the morning on 8 August. Maybe that’s because the Republicans who confirmed him didn’t want anyone to see what they were doing. Blanche has, after all, been shockingly subservient to Donald Trump, and seems poised to complete the president’s long-brewing transformation of the country’s chief law enforcement agency into a vehicle for score settling, personal vendettas, distributing favors to the administration’s friends and suppressing dissent from its political enemies. But perhaps most incendiary is what Blanche has said, publicly and privately, about how he intends to use the justice department and its vast array of oversight powers, legal prerogatives, and investigatory purview to curtail abortion access nationwide – and to shut down the life-saving distribution of mifepristone, in particular.\nIn a call facilitated by the White House faith office just days before he was confirmed, Blanche reportedly told Christian conservative leaders that as attorney general, he would move more aggressively than his predecessor Pam Bondi to outlaw the mailing of mifepristone across state lines, and target the Democratic-controlled states that have protected abortion most effectively. Blanche, who was then the acting AG, told the religious group Intercessors for America that the justice department was working “so that the Dobbs decision becomes permanent in every single state.” “We don’t have complete victory yet,” Blanche said, “but we will have victory, and victory will be soon, and, and, and it will be permanent.”\nExactly how Blanche intends to secure his victory over women’s freedom is unclear. But as AG, he has several paths at his disposal. His comments on the call prompted widespread speculation that Blanche could call for enforcement of the Comstock Act, a long-dormant law from 1873 that has been unenforced for years and has been partially repealed in the past. Anti-choice advocates say it could be used to legally ban the mailing of abortion pills, thus cutting off access for many women who live in states with bans. In 2022, the Biden justice department declared that medical providers could not be prosecuted under the Comstock Act for mailing abortion pills; as the attorney general, Blanche would have the power to reverse that decision. The Comstock Act’s application would be particularly significant, as it could be used to halt virtually all commercial traffic in abortion pills – not only mifepristone, but also misoprostol, the second drug, which has sometimes been used to induce abortion on its own. Such a move would reverse the miracle of the pills, pushing many desperate women towards methods that are less effective and can carry grave dangers.\nAnother path that Blanche could take to restrict abortion access would be to sue the states that seek to protect it. On the call, Blanche explained his reasoning: “If states have said, ‘We are going to protect the unborn and we’re going to protect every life from the moment of conception,’ we’re putting practices and policies in place so that other states and other organizations can’t attack that. They can’t do things like they’re doing with mailing in mail-order drugs.”\nHere, Blanche appeared to be referencing shield laws, legislation passed in a number of Democratic-controlled states that prohibits state authorities from participating in other states’ abortion-related investig", "translation_ja": "", "vocab": [{"word": "zealot", "definition": "信仰や思想に狂信的に献身する人。政治的・宗教的な極端な立場を強く持つ人を指す。"}, {"word": "subservient", "definition": "他者に従属的な、奴隷的な態度を示す。権力者に無条件に従う状態を表現する。"}, {"word": "prerogative", "definition": "特定の職や権限に付与された特別な権利や特権。行使する権限のこと。"}, {"word": "incendiary", "definition": "炎症的な、扇動的な。紛争や怒りを引き起こしやすい言動や発言を指す。"}, {"word": "dormant", "definition": "休止している、未発動の。法律が存在するが長期間適用されていない状態。"}, {"word": "Comstock Act", "definition": "1873年制定の米国連邦法。当初は猥褻物の郵送を禁止していたが、後に中絶薬の郵送禁止に転用される可能性がある法律。"}]}, {"title_ja": "トランプのICC制裁：主権を盾にした戦争犯罪人の保護", "title_en": "Trump's ICC Sanctions: Protecting War Criminals Under the Guise of Sovereignty", "summary_ja": "ケネス・ロス氏は、トランプ政権によるICC職員への制裁が、米国とイスラエル政府の戦争犯罪に対する国際的責任を回避させようとする試みだと主張しています。ロス氏は、トランプ・ルビオ陣営が領土的管轄権の原則を歪曲し、大量虐殺起訴におけるICCの重要な役割を損なわせていると述べており、司法妨害罪で起訴される可能性に直面していると指摘しています。", "summary_en": "Kenneth Roth argues that Trump administration sanctions against ICC officials are an attempt to shield U.S. and Israeli officials from international accountability for war crimes. Roth contends that the Trump-Rubio campaign misrepresents territorial jurisdiction principles and undermines the ICC's essential role in prosecuting mass atrocities, while potentially exposing themselves to obstruction of justice charges.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/21/icc-sanctions-trump-war-criminals", "state_media": false, "category": "オピニオン", "full_text": "The Trump administration has taken another step in its crusade against the international criminal court by imposing sanctions on two more senior ICC officials. The growing number of sanctioned jurists – now 13 – does not change the lawless nature of this quest.\nDonald Trump and his henchman, Marco Rubio, want to make the world safe for US and Israeli war criminals. No one should let them.\nThe latest victims of Trump’s vendetta are the ICC president – its chief judge, Tomoko Akane of Japan – and Abdoulaye Seye of Senegal, a senior ICC trial lawyer, evidently for his role advancing the prosecution of Israeli officials. Yet the real victims are not these particular individuals, but people worldwide who look to the court as one of the few avenues of recourse against unscrupulous leaders who commit mass atrocities such as fighting wars by targeting civilians.\nWe should never let Trump normalize these sanctions. Their main effect is to deprive the target of the ability to use the international financial system – no credit cards, no access to banks, extreme difficulty navigating a modern economy. That is a tool once reserved for corrupt or violent officials who were otherwise beyond the law. Trump is using them to attack the public officials who would bring such heinous individuals to justice.\nRubio, the secretary of state, dressed up the sanctions with high-sounding rhetoric about the ICC threatening “America sovereignty”. That is true only if Americans (and Israelis) have a sovereign right to commit war crimes wherever they want. Even Rubio cannot get himself to spell out what King Trump’s campaign is really about.\nRubio’s main articulated complaint is that the ICC can “investigate, arrest, detain, or prosecute officials whose government has not consented to ICC jurisdiction”. That is true, but it is wrong only if one adopts a conveniently (for Washington and the Israeli government) narrow sense of how the court should obtain jurisdiction for a crime.\nOn the one hand, when a country joins the ICC, it accepts the court’s jurisdiction over its citizens. That might be called jurisdiction by virtue of nationality. The US government accepts that route to jurisdiction because it never joined the court.\nBut when a country becomes a court member, it also confers jurisdiction over crimes on its territory, even when committed by a foreigner. That is hardly controversial. A hallmark of sovereignty is the ability to enforce the law on a country’s own territory. Even the Trump administration would not dare object to, say, the British government prosecuting an American for a crime committed in London.\nBut the administration claims it is somehow an outrage if a country confers that same territorial jurisdiction on the ICC for war crimes and similar atrocities committed by foreigners on its territory – a major purpose of the court. The US government objected to such territorial jurisdiction when the court’s treaty was adopted at a major diplomatic conference in Rome in 1998 – and lost overwhelmingly, by a vote of 120 to seven.\nSince then, even the US government has accepted territorial jurisdiction when convenient. After the ICC used it to prosecute Vladimir Putin (Russia never joined the court) for the kidnapping of children from Ukraine (a member), Joe Biden called the prosecution “justified”. The late senator Lindsey Graham, a Republican leader on foreign policy, orchestrated a unanimous Senate resolution in support.\nBut for Trump, territorial jurisdiction suddenly became toxic again when it was used to charge Benjamin Netanyahu and the former Israeli defense minister Yoav Gallant with deliberately starving and depriving Palestinian civilians in Gaza. Israel is not a member of the ICC, but Palestine, where the alleged crimes took place, is.\nTerritorial jurisdiction can also be used to charge foreigners from non-member states with aiding and abetting crimes in a state where the ICC has jurisdiction. For example, the court might charge United Arab Emirates officials with aiding and abetting genocide in the Darfur region of Sudan by sending arms and mercenaries to the paramilitary Rapid Support Forces, Rwandan officials with aiding and abetting war crimes in eastern Democratic Republic of Congo by arming and supporting the M23 rebel group, or US officials (Trump’s real concern) with aiding and abetting Israel’s genocide in Gaza by supplying arms and military aid.\nIndeed, territorial jurisdiction means that the sanctions themselves could lead to prosecution of Trump and Rubio. Article 70 of the Rome Statute, the ICC’s founding treaty, codifies the crime of obstructing justice when someone retaliates “against an official of the Court on account of duties performed”. That’s exactly what the Trump-Rubio sanctions do. The court would have jurisdiction because the sanctions relate to the prosecution of Israeli officials for crimes committed on Palestinian territory.\nRubio has vowed to dismantle the ICC “brick by brick, if necessary”,", "translation_ja": "", "vocab": [{"word": "vendetta", "definition": "個人的な報復や復讐の行為。特に長期的な対立や恨みに基づく報復を指します。"}, {"word": "jurisdiction", "definition": "特定の裁判所や機関が法的権限を行使できる範囲や領域。管轄権を意味します。"}, {"word": "aiding and abetting", "definition": "犯罪者を支援・幇助すること。法律用語で、直接的な犯行参加ではなく、他者の犯罪を助長する行為を指します。"}, {"word": "obstructing justice", "definition": "司法の公正な運営を妨害する行為。裁判所や捜査機関の活動を違法に阻止することです。"}, {"word": "territorial jurisdiction", "definition": "特定の領土内で発生した犯罪に対する裁判権。その地域が犯罪の場所である場合、その地域の法律が適用される原則です。"}, {"word": "sovereignly", "definition": "国家が独立して自らの権力を行使する権利や状態。他国の干渉を受けない独立性を意味します。"}]}, {"title_ja": "犯罪者が中国経済を愛する理由", "title_en": "Why Criminals Love the Chinese Economy", "summary_ja": "中国の違法経済は毎年約1兆ドルを生み出し、合法経済と同じ金融インフラと構造的不均衡を悪用している。北京は選別的な取り締まりを実施しているが、犯罪組織が資本規制、産業過剰生産能力、そして中国の戦略的利益を活用して偽造品、マネーロンダリング、人身売買、制裁回避事業を継続しているため、これらの取り組みは効果的ではない。", "summary_en": "China's illicit economy generates nearly $1 trillion annually, exploiting the same financial infrastructure and structural imbalances that drive its legal economy. While Beijing conducts selective enforcement actions, these efforts remain ineffective because criminal networks leverage capital controls, industrial overcapacity, and China's strategic interests to sustain operations in counterfeiting, money laundering, human trafficking, and sanctions evasion.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/why-criminals-love-chinese-economy", "state_media": false, "category": "オピニオン", "full_text": "For years, international discussion of China’s economic rise has focused on how it has built a manufacturing and export powerhouse and used industrial policy to support such efforts at a continental scale. But there is another, darker side of China’s dominance: its outsize role in the illicit global economy. China purchases roughly 90 percent of Iran’s sanctioned oil exports, which often arrive relabeled as originating from Malaysia and are paid for with money routed through small banks and shell companies acting as intermediaries. Cryptocurrency brokers in China and Hong Kong help North Korean hackers, such as the notorious Lazarus Group, convert stolen coins into usable cash. And China-based networks support money launderers working with Mexican cartels selling fentanyl, online scam centers in Southeast Asia, and the global wildlife trafficking trade.\nData from organizations and governments tracking illegal activity suggests that the Chinese illicit economy generates nearly $1 trillion in revenue annually, about the size of Switzerland’s GDP. Roughly two-thirds of counterfeit goods seized by customs authorities worldwide originate in China or move through Hong Kong, and the notorious scam compounds that have proliferated in Southeast Asia—many of which are operated by or linked to Chinese criminal networks—have trafficked more than 300,000 people from at least 66 countries into forced labor while generating roughly $40 billion in profits each year.\nBeijing has tried to crack down on some of these activities. In the Philippines, China’s Ministry of Public Security canceled the passports of hundreds of Chinese nationals involved in offshore gambling operations there, turning them into fugitives who can be arrested and deported. Since 2023, joint operations between China and Myanmar have led to the arrest of more than 57,000 Chinese nationals suspected of telecom fraud, the closure of dozens of scam compounds along the China-Myanmar border, and the execution of several bosses running these compounds. The United States, too, wants to stop these activities: the Trump administration launched the Scam Center Strike Force to investigate fraud centers in Southeast Asia, and the president signed an executive order directing the government to prioritize cybercrime, including predatory schemes.\nYet none of these actions have significantly curtailed the illicit economy. If anything, it is growing larger. This is in part because these illegal activities are driven by many of the same forces that underpin China’s legal economy. Criminal groups have exploited the core financial and commercial infrastructure that developed in response to China’s strict capital controls and its industrial overcapacity. Beijing’s enforcement, although real, is selective and partial because elements of the illicit economy serve the country’s larger strategic goals, such as sustaining trade with Russia while maintaining distance from the war in Ukraine. What may appear to be a collection of unrelated crimes is intertwined with China’s imbalanced growth model and its foreign policy. As Washington struggles to compete with China, Beijing’s role in the global illicit economy is working against U.S. priorities around the world.\nFOLLOW THE MONEY\nThe central forces driving China’s illicit economy are the structural imbalances created by the country’s economic model. One of the most important is financial: strict capital controls have created enormous demand to move money out of China. China’s economic boom has produced fabulous wealth, including more than 800 billionaires. But Beijing restricts how this wealth can leave the country. China has a quota limiting individuals to purchasing $50,000 in foreign currency each year, and they cannot freely convert domestic currency to move wealth abroad. With deposits in China generating low returns and no access to more lucrative foreign assets to invest in, wealthy individuals and business owners have sought to find ways to funnel their money out of the country.\nStarting in the 1990s, underground bankers set up shell companies and bank accounts in Hong Kong to circumvent mainland China’s capital controls. These companies and accounts, often disguised as trading firms, settled transactions involving renminbi collected inside China against dollars held offshore. In addition, brokers and financial intermediaries routed payments to offshore counterparties to allow Chinese citizens to use domestic currency to purchase property abroad or to trade overseas investment for foreign visas and passports. Meanwhile, junket operators, who brought wealthy clients to casinos in Macau, extended credit to them in Hong Kong dollars and then collected the debts in main
