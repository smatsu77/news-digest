edium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Carney faces crucial test after walking away from Trump's deal\n- Published\nThe United States and Canada have entered into uncharted territory.\nThe longtime allies and economic partners, who have enjoyed free trade for decades, are now in an escalating trade war with no clear off ramp.\nAnd for Prime Minister Mark Carney, the late night decision to suspend talks with President Donald Trump and to retaliate instead of agreeing to a deal that seemed in reach will be a significant political test.\nHe is one of the first world leaders to walk away from the negotiating table with the White House - and the outcome will be closely watched.\nBoth sides have blamed last-minute changes for torpedoing the tentative deal, with Carney saying the US \"asked too much\" and \"offered too little\".\nCarney's decision will challenge the appetite among Canadians to accept some economic pain as Ottawa pushes for more US concessions.\nAfter rejecting Trump's high pressure tactics, and in choosing to hit back against the latest duties, Carney will need to convince Canadians that the economic pain is worth the cost of standing up to the Trump administration in search of a better agreement in the long run.\nIn remarks on Saturday, he said \"we take this step confident this is in the best interest of Canada\" and accused the US of a \"power play\" by seeking eleventh-hour changes.\nAsked by a reporter whether the US and Canada were locked in a trade war, he replied: \"You're at war when you're attacked - we got attacked.\"\nSwitching to French, he said the spiralling trade dispute \"wasn't our choice\", adding: \"Canada is strong, Canada is ready, Canada is united.\"\nThere is no doubt this will cause pain on both sides of the border, with business facing more pressure from US duties and Canadian counter-tariffs.\nCanada sends about 70% of its exports to the US, and the country is the top trading partner for a number of US states, with Michigan, Kentucky, Indiana and Ohio among the most exposed.\nCarney came to power with a call for \"elbows up\" - an ice-hockey term for an aggressive approach - vowing to fight for Canada in the face of a Trump administration keen to exert economic pressure for its America First agenda.\nMany Canadians have told pollsters that they are willing to fight.\nA recent survey by Abacus Data suggested that around 36% of Canadians would support retaliating to US tariffs, while a Leger poll indicated that 56% of Canadians want the federal government to take a hard line and make no more concessions.\nCanadians frustrated with the US tariffs have already chosen to avoid travelling there. The boycott has meant a loss of about C$3.3bn ($2.35bn; £1.75bn) in travel revenue for the US last year.\nA decision by most provinces to remove US alcohol from store shelves has hammered that sector.\nBased on US government trade data, US wine exports to Canada fell 78% year over year, a $357m loss in export value. The US distillers association reported similar numbers - saying provincial bans have caused exports of American spirits to drop by more than 70%.\nThe ban quickly became a point of frustration for the Trump administration.\nCanada’s prime minister will also need to convince the provinces who have been less affected by the US trade dispute so far that walking away is a risk worth taking.\nHe briefed them on Saturday on the current state of affairs, and for now, they are showing a united front.\nBritish Columbia Premier David Eby said he was committed to the \"national project we are on\", while Ontario Premier Doug Ford said \"we didn't start this fight but I can assure you. we're going to win this fight\".\n- Carney calls Trump's fresh tariffs a 'miscalculation' after trade talks collapse \n  - Published51 minutes ago\nWhat went wrong?\nFor a week, it seemed that a deal between Washington and Ottawa was in reach.\nIt's still unclear exactly how the talks fell apart in the final hours, but by all accounts is came down to the wire.\nCarney said that late US proposed terms \"were unfair, uneconomic, and called into question the reliability of any deal\".\nHe added on Saturday those terms included demands on the automobile sector and \"unacceptable\" restrictions on trade deals with other countries.\nIn one biting line, he said of the Trump administration: \"We recognise sometimes its signature is written in pencil\".\nUS trade representative Jamieson Greer, meanwhile, pointed to \"new demands and walk backs of other commitments by Canada\".\nIn a statement on Friday, the Distilled Spirits Council of the United States suggested \"Canadian provinces' continued refusal to return US spirits products to store shelves has led to this outcome\".\nThere were also reports by Canadian media, external that US Commerce Secretary Howard Lutnick, was unhappy with the deal. The BBC has contacted his office for comment.\nAnd as details on an interim trade agreement with the US trickled out over last week, some provincial leaders, industry groups and political opponents raised concerns that the ", "translation_ja": "", "vocab": [{"word": "uncharted territory", "definition": "前例のない未知の状況。新しい経験や状況に直面することを意味し、ビジネスや政治の文脈でよく使用される。"}, {"word": "off ramp", "definition": "問題や困難な状況から抜け出す方法や手段。高速道路の出口に例えて、対立や危機から脱する解決策を指す。"}, {"word": "torpedoing", "definition": "計画や交渉を意図的に破壊または妨害する行為。戦艦への攻撃に例えて、何かを完全に台無しにすることを意味する。"}, {"word": "eleventh-hour", "definition": "締め切りや期限の直前の最後の瞬間。最後の時点での変更や決定を指す。"}, {"word": "appetite", "definition": "この文脈では、何かを受け入れる意欲や志向。経済的苦痛を耐える意思などに使われる。"}, {"word": "concessions", "definition": "交渉において譲歩する、または譲り合う内容。相手方に対して行う譲歩や合意事項を指す。"}]}, {"title_ja": "TikTok、米国との児童プライバシー侵害で4億ドルの和解金支払い", "title_en": "TikTok to Pay $400M in Major US Child Privacy Settlement", "summary_ja": "TikTokは、13歳未満のユーザーから保護者の同意なしに個人情報を収集したとして、米国司法省に4億ドルの支払いに合意した。この和解は児童オンラインプライバシー保護法（COPPA）違反を巡る2024年の訴訟に由来し、過去最大級の和解となった。TikTokと親会社ByteDanceは即座に3億ドルを支払い、追加で1億ドルは連邦取引委員会の同意判決が取り消された際に支払われる。", "summary_en": "TikTok has agreed to pay $400 million to the US Department of Justice to settle allegations that it violated children's privacy by collecting data on users under 13 without parental consent. The settlement, one of the largest of its kind, stems from a 2024 lawsuit citing violations of the Children's Online Privacy Protection Act (COPPA). TikTok and parent company ByteDance will pay $300 million immediately, with an additional $100 million due when a federal consent decree is vacated.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwyr0l45xjro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "TikTok to pay $400m to US in one of largest child privacy settlements\n- Published\nTikTok has agreed to pay $400m (£293m) to the US to end a lawsuit alleging its platform violated children‘s privacy, marking one of the largest ever settlements over the issue.\nThe deal stems from a 2024 suit by the Department of Justice under former President Joe Biden alleging TikTok and its parent company ByteDance collected \"vast amounts of data\" on millions of users under the age of 13.\nDoing so was against the Children's Online Privacy Protection Act (COPPA), a federal law enacted in 2000. It is the same law that dozens of US states are now suing Meta over.\n\"Children and parents are better protected today than they were when this case began,\" assistant Attorney General Brett Shumate said.\nOther companies to have paid penalties to the US government for COPPA violations include Google's YouTube, which in 2019 paid $170m, and Epic Games, which in 2022 paid $275m.\nMeta is also now facing penalties that could exceed hundreds of billions of dollars stemming from COPPA violations alleged by attorneys general of 29 US states. A jury trial in the lawsuit started this week, with the Instagram and Facebook owner accused of targeting child users and profiting from them.\nWhile the TikTok lawsuit predates last year's split of TikTok's US business and operations from its original base of China, the settlement only involves TikTok's operations in China.\nByteDance, which is a privately held company, was most recently valued by investors at $550bn, external.\nUnder the terms of the deal, TikTok and ByteDance will immediately pay the DOJ $300m. It will pay another $100m when the government vacates a 2019 consent decree, external with the Federal Trade Commission.\nAs part of the agreement, the predecessor to ByteDance, Musical.ly, was required to pay a $5.7m fine for COPPA violations and ensure it sought parental consent for any user aged under 13.\nThe justice department did not detail on Friday any action against TikTok beyond the fine. But the department noted that since it sued the platform, TikTok has \"undergone significant changes,\" including to its ownership, privacy practices and platform controls for young users.\nWhen the lawsuit was filed, attorneys for the US said there were more than 170 million teenagers using TikTok and that the app was \"directed to children.\" Yet, it did not effectively gauge the age of users or get parental consent for use from those underage.\nIn 2024, former President Biden pushed for TikTok to be either banned, or have the company divest its US operations. President Donald Trump went on to support divestment of the app, which occurred last year.\nIts US operations are now 81% owned by a consortium of investors, while Bytedance maintains a 19% stake.\nA representative of TikTok did not respond to the BBC for comment.\nRelated topics\n  - Published3 days ago\n  - Published26 September 2025\n  - Published23 January", "translation_ja": "", "vocab": [{"word": "settlement", "definition": "法的紛争を解決するための合意または協定。訴訟を終わらせるために当事者間で合意された条件や支払いのこと。"}, {"word": "consent decree", "definition": "法廷によって承認された当事者間の合意文書。特に政府機関と企業が将来の違反を防ぐため署名する法的拘束力のある合意。"}, {"word": "divest", "definition": "ある資産や事業部門を売却または手放すこと。通常、企業が特定の事業や投資から撤退することを意味する。"}, {"word": "alleged", "definition": "法的またはメディア報道で、証明されていないが主張されている事柄を表す。容疑とされる、疑いをかけられているという意味。"}, {"word": "predecessor", "definition": "現在の人物または事業の前任者または前身となる企業。後継者の前に存在していたもの。"}, {"word": "consortium", "definition": "共通の目的のために組織された企業や団体の共同体。複数の組織が協力して形成されたグループ。"}]}, {"title_ja": "シェアハム沖の海で亡くなった家族のため追悼式が開催される", "title_en": "Community holds vigil for family who died in sea off Shoreham", "summary_ja": "ロンドンからの家族4人が火曜日にウェストサセックス州シェアハム近くの海で遭難し、最年少の6歳のサジャが金曜日に病院で亡くなった。地元コミュニティはキングストンビーチで追悼式を開き、ハッサン・エル・カワス、ゼイナ・アライン、14歳の娘サラ、サジャへの追悼の時間を持った。サセックス警察は事件が第三者の関与のない悲劇的な事故であることを確認した。", "summary_en": "A family of four from London died after getting into difficulty in the sea near Shoreham, West Sussex on Tuesday, with the youngest member, six-year-old Saja, passing away in hospital on Friday. The local community gathered for a vigil at Kingston Beach and held a moment of silence to pay respects to Hassan El-Khawas, Zeina Alayn, their 14-year-old daughter Sara, and Saja. Sussex Police confirmed the incident appears to be a tragic accident with no third-party involvement.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c87n7xd2ye9o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Vigil held for family who died in sea off Shoreham\n- Published\nThe community in Shoreham, West Sussex, has paid its respects to a family who died after getting into difficulty in the sea on Tuesday.\nHassan El-Khawas, 55, Zeina Alayn, 37, and their 14-year-old daughter Sara, died despite the efforts of paramedics at the scene. It was confirmed on Friday that six-year-old Saja El-Khawas had died in hospital.\nA vigil took place earlier at Kingston Beach, where the incident took place, alongside a one-minute silence in Shoreham town centre.\nReverend Pat Alden said: \"When something happens, whether it's something we celebrate... or tragic circumstances like this, the community comes together.\"\n'Heartbroken'\nAlden added: \"Shoreham is the sort of place where the community comes together at times like this. We are a very close-knit community.\"\nTom Rutland, East Worthing and Shoreham MP, who attended the vigil, said the whole town was \"heartbroken, particularly by the development that Saja has lost her life sadly too\".\nAlden added: \"The way everybody has come together and marked today with this minute's silence, and there were people who met with paddleboards and kayaks over at Kingston Beach as well this morning, it's been a really lovely way to pay to the very sad loss of these lives.\"\nWesley Horscroft attended on behalf of paddlers in the Kingston beach community.\nHe said he had originally planned to go out alone and \"put some flowers on the water\" to honour the family, before he decided to invite others.\n\"It's kind of grown and a lot of people wanted to turn up to do the same,\" he said.\nHe said Saja's death had added an \"another layer\" to the grief felt in the town.\nAccording to Sussex Police, the family had travelled down from their home in London on Tuesday to visit Shoreham, which is about 6.3 miles (10.1km) from Brighton.\nThe force said the family had entered the water from the beach at Shoreham Fort at about 14:00 BST before getting into trouble.\nA Sussex Police spokesperson said the investigation remained open, and the \"current hypothesis\" was that it was \"a tragic accident, with no third-party involvement\".\nAddressing Saja's death on Friday evening, Ch Supt James Collis said: \"This heartbreaking update is one we all feared in the aftermath of Tuesday's tragic events.\n\"The impact of this tragedy has been felt across the country and I know the Shoreham community, emergency responders and all involved will continue to be affected for a long time to come.\"\nThe family lived in London and were British citizens of Palestinian origin, with roots in the Rashidieh refugee camp in Lebanon.\nTheir extended family had lived in the UK for many years, the Palestinian Forum said.\nPrime Minister Andy Burnham called the incident a \"terrible family tragedy\".\nFollow BBC Sussex on Facebook, external, on X, external, and on Instagram, external and listen to BBC Radio Sussex on Sounds. Send your story ideas to southeasttoday@bbc.co.uk, external or WhatsApp us on 08081 002250.\nRelated topics\nRelated stories\n  - Published11 hours ago\n  - Published3 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "hypothesis", "definition": "仮説や推定の意。ここでは警察が事件の原因について立てた「現在の仮説」という意味で使われている。"}, {"word": "third-party involvement", "definition": "第三者の関与を意味する表現。犯罪捜査などで、事件に他人が関わっていないことを示す。"}, {"word": "aftermath", "definition": "ある事件や出来事の後の状態や結果を指す。ここでは火曜日の悲劇的な出来事の直後を意味している。"}, {"word": "close-knit", "definition": "密接に結びついた、団結力のある状態を表す形容詞。コミュニティや家族が強く繋がっている様子を示す。"}, {"word": "profound", "definition": "深刻な、強い影響を持つという意味。ここでは悲しみや影響の大きさを強調している。"}]}, {"title_ja": "経済顧問オニール氏が政府職を辞退、首相の分権計画を支持", "title_en": "Economic adviser O'Neill declines government role but backs PM's devolution plans", "summary_ja": "首相の顧問を務める経済学者ジム・オニール卿は、ブラインドトラストなどの制約を理由にアンディ・バーナム政権での正式な職を辞退した。役職を断る一方で、オニール氏は政府の分権化政策を強く支持し、グレーター・マンチェスターの経済成長を国家発展のモデルとして言及している。", "summary_en": "Economist Lord Jim O'Neill, advising the prime minister, has declined a formal position in Andy Burnham's government, citing constraints such as blind trusts and loss of business control. Despite rejecting the role, O'Neill expressed strong support for the government's devolution agenda and cited Greater Manchester's economic growth as a model for national development.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwym4m4j848o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Economic adviser O'Neill rules out government job but backs PM's devolution plans\n- Published\nEconomist Lord Jim O'Neill, who has been advising the prime minister, has said he will not be taking a job in Andy Burnham's government.\nAs first reported by, external the Financial Times, Lord O'Neill, a crossbench peer who was once a treasury minister under the Conservatives, said he did not want the constraints involved in taking on a formal role.\nThe former chief economist at Goldman Sachs had been tipped to become Burnham's chief economic adviser.\nHe said he was enjoying what he was currently doing too much and did not want to have to give up control of his business interests to comply with official rules.\nHe told BBC Radio 4's Today programme that he had \"lots of other things that are going on that I very much enjoy\" and, having been a minister before, he knew the job included \"all the constraints that understandably go with it, like a blind trust and to abandon everything else you do, never mind the fact that it's 24/7\".\nIn placing shares in blind trusts, ministers have no knowledge of how their investment is being handled, to avoid any potential conflict of interest.\nHe said he concluded he would rather be a voice to talk to and \"get on with the rest of the things in my life\".\nHe earlier told the Financial Times it was \"not because of any policy disagreements\", adding \"I'm a massive fan of the focus on devolution and I hope Andy and his team will be bold on this and everything else.\"\nHe pointed to Greater Manchester as an example of economic growth and said if you could repeat that around populated areas, \"then national economic performance will improve\".\nAsked by the BBC whether the new government in the upcoming October budget would need to raise taxes, Lord O'Neill said it was a choice for the prime minister and his team \"based on the things they're saying they want to do more of - defence spending is obviously the one that catches the eye\", among other things.\nPressed on whether the government could turn to something such as wealth taxes, Lord O'Neill said he was \"not a fan of further increases in these kind of taxes, particularly as it relates to capital gains for genuine risk taking things like venture capital\".\nHe noted that the country has boosted government spending \"dramatically\" in recent years and needed a \"more sensible approach to welfare spending under genuine welfare reform\".\nFrom 2015-2016, Lord O'Neill was commercial secretary to the Treasury under the then-Chancellor, George Osborne.\nThe peer, who grew up in Greater Manchester, was a key figure in pushing the Conservatives' Northern Powerhouse agenda, which was aimed at boosting the economy of the North of England.\nLord O'Neill is also known as the economist who coined the term Bric in 2001 to describe leading developing or newly industrialised countries with potential for fast growth and, therefore, investment returns.\nThe original four nations - Brazil, Russia, India and China - later became the Brics when they were joined by South Africa.\nRelated topics\n  - Published3 days ago\n  - Published20 July", "translation_ja": "", "vocab": [{"word": "crossbench peer", "definition": "特定の政党に属さない議会議員。政府や野党のいずれにも属さない独立した立場の議員を指す。"}, {"word": "blind trust", "definition": "大臣などの公職者が利益相反を避けるため、自分の資産管理を第三者に委ねる仕組み。本人は投資内容を知らされない。"}, {"word": "devolution", "definition": "中央政府から地域政府への権限移譲。地方分権のことで、地域が独立してより多くの決定権を持つようになる。"}, {"word": "venture capital", "definition": "成長の可能性が高い企業に投資される資金。リスクが高いが利益も大きい可能性がある投資形態。"}, {"word": "commercial secretary to the Treasury", "definition": "財務省の商務担当官。経済政策と商務に関する決定に関わる政府高官職。"}, {"word": "coinage", "definition": "新しい言葉や用語の創造。ここではONEILLが'BRIC'という経済用語を作り出したことを指す。"}]}, {"title_ja": "ウェールズの郡が山火事後に世界的な炭素排出ホットスポットに", "title_en": "Welsh County Becomes Global Carbon Emissions Hotspot After Wildfires", "summary_ja": "ウェールズのトルファエン郡は、EUのコペルニクスデータによると、7月の山火事により世界的に最も高い平方キロメートル当たりの炭素排出量の上位にランクインした。300フィールド分の大きさの火災がミニッド・ガーンクロッドで発生し、煙は地域全体に拡散し、特に脆弱な人口グループの健康への懸念を引き起こした。議会は粒子状物質濃度の上昇を認めたが、研究で使用された評価方法に疑問を呈した。", "summary_en": "Torfaen county in Wales ranked among the world's highest carbon emissions per square kilometre in July following major wildfires, according to EU data from Copernicus. A fire the size of 300 football pitches broke out on Mynydd Garnclochdy, causing smoke to spread across the region and prompting health concerns for vulnerable populations. The council acknowledged elevated particulate concentrations but questioned the assessment methodology used in the research.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cp9e9rg255vo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Welsh county becomes global hotspot for carbon emissions after wildfires\n- Published\nA county in Wales had one of the world's highest carbon emissions per square kilometre due to wildfires in July, according to a charity.\nThe fire above Blaenavon, Torfaen was described as \"one of the largest and most challenging\" in south Wales in recent years by the fire service.\nSave the Children said it was concerned about possible health consequences after data, external published by the European Union's earth observation programme, Copernicus, showed Torfaen behind Malanje in Angola, Spain's Ávila and Annaba in Algeria in terms of wildfire emissions in July.\nTorfaen council said it was unaware of the EU data but its own air quality monitoring showed \"elevated particulate concentrations\".\nA blaze the size of about 300 football pitches broke out on Mynydd Garnclochdy, between Abersychan and Blaenavon, with people reporting smelling smoke about 30 (48km) miles away in Cardiff.\nCombined with others across the region it contributed to a major incident being declared, which eventually required assistance from the military.\nBlaenavon councillor Janet Jones said the smoke had been \"particularly bad\" on 13 August - about three weeks after the fire first ignited.\n\"There was great concern about air quality and the impact on elderly people and those suffering with respiratory issues such as emphysema and COPD.\"\nJones said she had spoken with GP practice nurses two weeks ago and was not aware of any increase in patients complaining about respiratory problems, but added this \"could change in the months ahead\".\nMelanie Simmonds, head of Save the Children Wales, said: \"In Wales and across the world, children are breathing in smoke from wildfires, coping with extreme heat and losing the freedom to play outdoors because the air is no longer safe.\n\"These conditions are not only frightening - they carry serious health consequences for children whose bodies and lungs are still developing.\"\nTorfaen council said it was not aware of the research and \"it is not clear what data or evidence was used in the assessment to arrive at the reported conclusion\".\nIt said it \"recognises that prolonged wildfire incidents have the potential to adversely affect local air quality, particularly through increased levels of smoke and particulate matter\".\nIt added it \"continuously monitors\" air quality through a monitoring station in Croesyceiliog Cwmbran.\n\"While elevated particulate concentrations have been observed during the wildfire period, the council's monitoring station is intended to provide information on general background air quality rather than conditions at specific locations immediately adjacent to the fires,\" it said.\nThe Copernicus Atmosphere Monitoring Service (CAMS) website, external said it was part of European Union's Space programme, and provided global information related to air pollution and health.\nIts data said emissions in Torfaen had been \"extremely unusual\".\nMore top stories\n  - Published23 hours ago\n  - Published14 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "hotspot", "definition": "特定の問題や活動が集中している場所または地域を指します。この文脈では、高い炭素排出量が集中している地域を意味します。"}, {"word": "emissions", "definition": "大気中に放出される気体や物質のこと。特に環境問題では、温室効果ガスやその他の汚染物質の排出を指します。"}, {"word": "particulate matter", "definition": "空気中に浮遊している小さな粒子状物質のこと。健康被害を引き起こす可能性のある汚染の一形態です。"}, {"word": "respiratory", "definition": "呼吸に関連する、または呼吸器系に関する形容詞。肺や気道の病気や問題に使われます。"}, {"word": "earth observation", "definition": "衛星やセンサーを使用して地球の表面やその過程を監視・観察する科学技術のこと。環境管理に広く用いられます。"}, {"word": "prolonged", "definition": "長く続く、または長期間継続することを意味する形容詞。短期的ではなく、持続的な状態を表します。"}]}, {"title_ja": "インド沖でカーゴ船が沈没", "title_en": "Cargo vessel sinks off Indian coast", "summary_ja": "パナマ船籍のカーゴ船「オーシャン・ウィナー」がインド東部沖で沈没し、乗船していた24人の乗組員のうち少なくとも2人が救助されました。インド沿岸警備隊と海軍による合同作戦が追加の生存者の捜索に当たっています。同船はオディシャからシンガポールへ鉄鉱石を運んでいました。", "summary_en": "A Panama-flagged cargo ship named Ocean Winner sank off the eastern coast of India with 24 crew members on board. At least two crew members were rescued, and a joint operation by the Indian Coast Guard and navy was underway to find additional survivors. The ship was carrying iron ore from Odisha to Singapore when it sank about 240 nautical miles offshore.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/cargo-vessel-sinks-off-indian-coast/a-78472142?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Cargo vessel sinks off Indian coast\nAugust 22, 2026\nA cargo ship has sunk off the eastern coast of India, the country's coast guard said. The Panama-flagged vessel Ocean Winner had 24 crew on board, at least two of whom were reportedly rescued.\nThe crew included 20 Chinese nationals, three seamen from Myanmar and one from Bangladesh, Indian officials said.\nWhy the ship sank remains unclear.\nAccording to officials cited in the Indian Express, the ship was about 240 nautical miles (444 kilometers, 276 miles) off the coast of Odisha. A joint operation by the Indian Coast Guard and the country's navy was underway to find more survivors.\nThe Hindustan Times reported local Paradip police official Sanjay Negi saying that rescue teams would reach the site \"by tomorrow morning\" and that other vessels in the vicinity had been alerted to help with the rescue effort.\nAccording to ship-tracking app MarineTraffic, the Ocean Winner was carrying iron ore from Paradip port in Odisha to Singapore.\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button so you'll see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "Panama-flagged", "definition": "パナマの国籍登録を持つ船舶。多くの商船がパナマ船籍を選ぶのは登録が簡単で運営コストが低いため。"}, {"word": "nautical miles", "definition": "海上距離の単位。1海里は約1.852km。船舶や航空機の距離測定に用いられる。"}, {"word": "joint operation", "definition": "複数の組織や部隊が協力して実行する作戦。ここでは沿岸警備隊と海軍の共同救助活動を指す。"}, {"word": "vicinity", "definition": "近隣地域や周辺。『in the vicinity of』で『～の近くで』という意味で使われる。"}, {"word": "iron ore", "definition": "鉄の採掘と製造に用いられる鉱物。主に赤鉄鉱や磁鉄鉱などの形態で存在する。"}]}, {"title_ja": "米国との貿易交渉失敗後、カナダが報復関税を発動へ", "title_en": "Canada to Impose Retaliatory Tariffs After Failed US Trade Talks", "summary_ja": "カナダは米国による50%の報復関税に対抗して、9月8日から米国産品に対して同等の報復関税を導入すると発表した。マーク・カーニー首相は米国の提案を拒否した判断を正当化し、この状況を貿易「戦争」と表現し、カナダは対抗する準備と体力があると述べた。", "summary_en": "Canada announced it will introduce dollar-for-dollar retaliatory tariffs on US products starting September 8, following the US's imposition of 50% tariffs on Canadian goods. Prime Minister Mark Carney defended Ottawa's decision to reject the US trade offer, describing the situation as a trade 'war' and stating Canada has the reserves and resilience to respond.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/canada-to-hit-back-with-retaliatory-tariffs-after-us-trade-talks-fail/a-78471618?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Canada to hit US back with tariffs after trade talks fail\nAugust 22, 2026\nIn an ongoing trade dispute with the US, Canada said on Saturday that it would introduce tariffs on several US products starting September 8.\nThe announcement comes in retaliation to the US imposing 50% tariffs earlier on Saturday on a broad range of Canadian products after the two sides failed to reach a trade deal on Friday.\n\"Canada will match Washington's new tariffs dollar for dollar in order to protect Canadian workers, farmers, families, and businesses,\" Prime Minister Mark Carney told reporters in Ottawa.\n\"In the coming days, we will release the details of these new tariff measures, which will come into force the Tuesday after Labor Day,” he said.\nWhile the United States had blamed Canada for declining to finalize the trade pact with Washington on Friday, Carney defended Ottawa's position, explaining, \"We cannot accept what they have offered, and we will not give what they have asked.\"\nHe later on Saturday met virtually with provincial and territorial premiers to discuss the suspension of the trade talks with the US.\nWhat products are affected by the tariffs?\nThe US tariffs will affect a broad range of products, including wine, furniture, dairy products, cement, clothing, fishing rods, and hockey equipment, and cover some $20 billion (€17 billion) worth of Canadian exports to its southern neighbor.\nCanada's retaliatory tariffs would, in turn, target steel, dairy, appliances, agricultural equipment, pulp and paper and electronics, Carney said.\nThe US currently accounts for roughly 70% of Canadian exports, making Ottawa potentially more vulnerable in the standoff Carney explicitly described as a trade \"war.\"\n\"You're at war when you get attacked. We got attacked,\" he said, adding that Canada had the reserves, resilience and plan to respond.\nFriendly ties turned sour\nThe fresh tariffs are the culmination of long and tense trade negotiations between the two sides and mark a sharp reversal from just two days earlier, when officials from both sides appeared optimistic that a compromise was in the making.\nAccording to the AP news agency, no further talks were planned to resolve the situation.\nThe US administration's approach to Canada is a major change from the friendly ties the two countries have traditionally had. US President Donald Trump has often said he wants tariffs on Canadian goods to encourage companies to move manufacturing back to the United States.\nHe has also made controversial comments about making Canada the 51st US state. Carney said Canada understood that \"America has changed\" and that the two countries would \"not return to their old relationship.\"\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button so you'll see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "retaliatory", "definition": "相手の攻撃や不公正な行為に対して報復として行われる、という意味の形容詞。ビジネスや国際関係の文脈で、対抗措置や報復的な行動を説明する際に使用される。"}, {"word": "culmination", "definition": "長期間の過程や一連の出来事が最終的にたどり着く頂点や終焉を意味する名詞。複雑な状況や交渉が最終的な結果に至ることを表す。"}, {"word": "standoff", "definition": "双方が譲らず、進展がない対立や膠着状態を指す名詞。交渉や紛争が行き止まり状態にあることを表す。"}, {"word": "resilience", "definition": "困難な状況から回復する能力や、圧力に対する耐性を意味する名詞。経済や組織が逆境に対抗できる強さを表す。"}, {"word": "controversial", "definition": "多くの人の間で議論や意見の対立を招く、議論の余地がある、という意味の形容詞。賛否両論がある発言や行動を説明する際に使用される。"}, {"word": "reversal", "definition": "以前の状態や方向から完全に逆転すること、180度の転換を意味する名詞。政策や方針、関係性の急激な変化を表す。"}]}, {"title_ja": "ナイジェリア：ジハード主義者が金曜礼拝中に数十人を誘拐", "title_en": "Nigeria: Jihadis kidnap dozens during Friday prayers", "summary_ja": "武装した過激派がニジェール州の村々を襲撃し、金曜礼拝中のケペニャ村のモスクを襲撃し、最大60人の礼拝者を誘拐した。目撃者は激しい暴力と死傷者を報告したが、警察は死傷者数に異議を唱えた。ラクラワ、アンサル、マフムダを含む複数のジハード主義グループが実行犯として示唆された。", "summary_en": "Armed extremists attacked villages in Niger State and stormed a mosque in Kpenya during Friday prayers, abducting as many as 60 worshipers. Witnesses reported severe violence and deaths, though police disputed casualty figures. Multiple jihadi groups including Lakurawa, Ansaru, and Mahmuda were suggested as possible perpetrators.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/nigeria-jihadis-kidnap-dozens-during-friday-prayers/a-78471356?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Nigeria: Jihadis kidnap dozens during Friday prayers\nAugust 22, 2026\nExtremists attacked and abducted a number of worshipers in Nigeria's Niger State, authorities said on Saturday.\nPolice said the armed men attacked a number of villages in the Borgu Local Government Area before storming mosque in the village Kpenya during Friday prayers.\n\"People were abducted while praying at a Juma’at mosque on Friday,\" Borgu area council chair Abdullahi Mohammed Nasir told the Associated Press.\n\"That was when the bad people came and surrounded the mosque and took them away.\"\nSome witnesses recounted extreme violence.\n\"Soon after finishing the normal Friday prayer, the armed group [...] in their hundreds, wielding guns, knives and machetes, began to attack us,\" one survivor told the AFP news agency. \"They slaughtered some of our people, saying we are not practicing the true teachings of Islam.\"\nLocal residents told the AFP and Reuters news agencies that dozens of people — as many as 60 — were kidnapped.\nWitnesses also told AFP that the armed men killed several people, although according to police, \"the developing report indicated that no life was lost.\"\nWho was responsible for the attack?\nNo group claimed responsibilityfor the attack in the day that followed and police have not identified the culprits.\nOne witness told AFP that the gunmen belonged to Lakurawa — an increasingly radical outfit that researchers link to the \"Islamic State Sahel Province\" group.\nAnother resident told AFP that the attackers were Ansaru, which split from Boko Haram and is now aligned with al-Qaeda.\nWitnesses also said that a third, rival jihadi group known as Mahmuda clashed with the attackers and allowed some of the abductees to escape.\nAlthough jihadi attacks have declined in Nigeria since the height of Boko Haram's insurgency last decade, the military and police remain overstretched as they face multiple, sometimes overlapping conflicts.\nIn addition to jihadist insurgency in the north, parts of Nigeria also face violence and kidnappings from non-ideological gangs known locally as \"bandits.\"\nEdited by: Sean Sinico\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "extremists", "definition": "過激な思想を持つ人々。政治的または宗教的目標を達成するために暴力や過激な手段を用いる傾向がある。"}, {"word": "insurgency", "definition": "支配下の政府に対する反乱や暴力的な蜂起。特に組織化された長期的な武装反対運動を指す。"}, {"word": "abducted", "definition": "誰かを無理やり連れ去ること。誘拐や強制的な連行を意味する。"}, {"word": "culprits", "definition": "犯罪や悪行の責任者。犯人や加害者を指す。"}, {"word": "overstretched", "definition": "リソースや人員が不足して、対応する能力を超えている状態。処理しきれないほど負担がかかっている。"}, {"word": "ideological", "definition": "政治的、宗教的、または社会的な信念体系に基づく。特定の思想や原則に基づいていることを示す。"}]}, {"title_ja": "トランプ大統領のカナダへの50%関税が発動、カーニー氏報復を誓う", "title_en": "Trump's 50% tariffs on Canada take effect as Carney vows to retaliate", "summary_ja": "米国がカナダからの輸入品に対して50%の関税を発動し、土曜日早朝に効力を発生します。トランプ大統領は前回の期限を3日間延長していました。カナダのカーニー副首相は報復措置を講じることを表明しており、両国間の貿易紛争が激化しています。", "summary_en": "The United States has implemented 50% tariffs on Canadian imports, set to take effect early Saturday morning after President Trump extended a previous deadline by three days. Canadian Deputy Prime Minister Chrystia Freeland has pledged to retaliate against the tariffs. The move escalates trade tensions between the two neighboring countries.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Business/trumps-proposed-tariffs-canada-hurtle-deadline-amid-trade/story?id=135833861", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース放送", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースとライブイベントを24時間体制でカバーしています。プラットフォームは主要なストーリーが展開するにつれてリアルタイム更新を配信します。視聴者は国内および国際ニュースの最新レポートにアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events throughout the day. The platform delivers real-time updates on major stories as they develop. Viewers can access up-to-the-minute reporting on national and international news.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権の75ヶ国ビザ停止政策が却下される", "title_en": "Court Strikes Down Trump Visa Suspension Policy for 75 Countries", "summary_ja": "米連邦地方裁判所の判事は、トランプ政権の75ヶ国に対するビザ停止政策がルビオ国務長官の法定権限を超えていると判断しました。判事はこの政策が適用法に違反し、認可された権限の範囲を超えて発令されたと判断しました。この決定は政権の移民制限に対する大きな法的な後退となります。", "summary_en": "A U.S. district judge ruled that Trump's policy suspending visas for 75 countries exceeded Secretary Rubio's legal authority. The judge determined the policy violated applicable law and was issued beyond the scope of authorized powers. The decision marks a significant legal setback for the administration's immigration restrictions.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/judge-strikes-trump-administration-policy-suspended-immigrant-visas/story?id=135862935", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、トランプ政権下でリベリアへの移民1,200人の強制送還開始、第1陣20人到着", "title_en": "US Deports 20 People to Liberia as Part of 1,200-Person Trump Migration Deal", "summary_ja": "米国はリベリアとの新協定に基づき、最大1,200人の移民をリベリアに強制送還する計画を開始した。トランプ政権は少なくとも35カ国と同様の協定を結び、移民政策の強化の一環として約23,000人を第三国に送還している。人権擁護団体は、この慣行は庇護申請者を本国に間接的に送還する法的抜け穴だと批判している。", "summary_en": "The United States has begun deporting migrants to Liberia under a new agreement that will eventually send up to 1,200 people to the West African nation. The Trump administration has reached similar deals with at least 35 countries, sending roughly 23,000 people to third countries as part of its immigration crackdown. Human rights advocates criticize the practice as a legal loophole that indirectly forces asylum seekers back to their home countries.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/20/liberia-deportation-agreement", "state_media": false, "category": "社会", "full_text": "Twenty deportees from the United States arrived in Liberia on Thursday, as part of a new agreement that will see the west African country receive as many as 1,200 people under the Trump administration’s immigration crackdown.\nThe group arrived at the Roberts international airport outside the capital, Monrovia. The Liberia-US agreement is one of the largest third-country deportation arrangements pursued by the administration since Trump returned to office last year.\nThe Liberian information minister, Jerolinmek Piah said the 1,200 deportees will include African nationals as well as nationals from North America, South America and the Caribbean.\nDuring a briefing on Tuesday, Liberia’s justice minister, Natu Oswald Tweh, said that the majority of the deportees had committed migration-related violations and offenses, and that they could seek asylum in the west African country if they wished.\nThe US has agreed to extend visitor visas for Liberians from 12 to 36 months and pledged $124m in assistance as part of the arrangement.\nUnder a series of often-secret agreements, the Trump administration has deported thousands of people to nearly two dozen countries that are not their own, advocates say, with about 10 of them in Africa. A new report by Refugees International and Human Rights First say the Trump administration has reached deals with at least 35 countries and has sent roughly 23,000 people to 26 of them as of early August, and makes the Liberia agreement the largest single arrangement so far.\nImmigration lawyers have said the Trump administration uses deportations to third countries as a legal loophole to indirectly force asylum seekers back to their home countries.\nIn many cases, migrants are deported to countries they have never been to or where they face safety risks and are left with little choice other than to return to the home countries they were fleeing from.\nA February report by Senate foreign relations committee Democrats found the Trump administration had paid more than $32m to five governments, several with poor human rights records, to accept about 300 third-country deportees – including $1.1m per person to Rwanda for seven deportees, and $7.5m to Equatorial Guinea for 29, a sum exceeding all US aid to that country over the previous eight years.\nThe report found more than 80% of those sent to third countries had since returned home anyway, often at further cost to taxpayers, and cited cases where deportees with US court-ordered protections were removed to Ghana and Equatorial Guinea before being sent onward within days.\nThe state department disputed the report’s characterization of its enforcement record.\nThe Associated Press contributed reporting", "translation_ja": "", "vocab": [{"word": "third-country deportation", "definition": "第三国への強制送還。亡命希望者を本国以外の他国に送還する慣行で、国際的な人権問題として議論されている。"}, {"word": "loophole", "definition": "法律の抜け穴。規則や法律に隙間があり、それを利用して本来の目的を回避する行為を可能にする。"}, {"word": "enforcement", "definition": "法律や規則の執行。政府が法律を強制的に実行し、違反者に対して措置を講じることを意味する。"}, {"word": "asylum seeker", "definition": "亡命申請者。政治的迫害や紛争から逃れるため、他国での保護を求める人を指す。"}, {"word": "arrangement", "definition": "協定や合意。複数の当事者間で交わされた正式な合意や取り決めを意味する。"}]}, {"title_ja": "中央アフリカ共和国の小規模金鉱で土砂崩れ、100人以上が死亡", "title_en": "Over 100 dead after artisanal goldmine collapse in Central African Republic", "summary_ja": "中央アフリカ共和国西部のザンボイエ村で火曜日に地滑りが発生し、鉱夫が作業していた地下トンネルが崩落して100人以上が死亡した。赤十字ボランティアと地元当局者によると、これは同地域で今年だけで複数発生している鉱山事故の一つである。救助活動が進行中だが、当局は復旧作業の継続に伴い死者数がさらに増加する可能性があると警告している。", "summary_en": "A landslide caused an artisanal goldmine in western Central African Republic to cave in on Tuesday, killing more than 100 people according to Red Cross volunteers and local officials. The collapse occurred in the village of Zamboye when underground tunnels where miners were operating gave way, burying workers under sand and debris. Rescue efforts are ongoing, though authorities warn the death toll may rise as recovery operations continue.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/20/gold-mine-collapse-deadly-landslide-central-african-republic", "state_media": false, "category": "IT", "full_text": "More than 100 people have died after an artisanal goldmine at a small village in western Central African Republic (CAR) caved in due to a landslide, local officials and aid workers said on Wednesday.\nThe landslide happened on Tuesday afternoon in the village of Zamboye, about 50km (31 miles) from the town of Baboua and close to the border of Cameroon. Footage on social media appeared to show an avalanche of sand descend on a group of people, likely the miners, and cover them.\nA statement by a local public prosecutor said many others were trapped under the deluge. It did not mention the number of fatalities. However, Gervais Ganagoroh, a Red Cross volunteer involved in the relief effort, told the Associated Press news agency on Wednesday that more than 100 bodies had been recovered from the collapse and a senior official at a local mining association confirmed that number to Reuters.\nLocal media in CAR reported that authorities had launched an investigation into the incident. A second prosecutor from Baboua told the press that the incident is believed to have been caused by “the collapse of several underground tunnels in which miners were operating”.\n“The ground completely collapsed and buried people,” Cedric Mbango, a miner at the site, told the AFP news agency, describing the incident as “catastrophic”.\nRescuers are racing to retrieve the bodies of victims and find survivors among the miners, believed to be nationals of CAR and Cameroon. Authorities in Cameroon’s Eastern region said at least three of its citizens have been identified as victims in the incident.\nGrégoire Mvongo, the region’s governor told state-owned radio on Wednesday that he was “working in close collaboration with our Central African colleagues to deal with the aftermath of this tragedy”.\nBertrand Be Yangué, a member of the Zamboye youth council, said that “finding them alive would be a miracle.” He added: “We are saddened and heartbroken to see young men and women perish after coming to the mines to save their families from despair.”\nThe toll is expected to rise as the rescue efforts continue, added Yangué.\nThe Central African news website Corbeau News reported that heavy machinery, including tractors, was being used in the retrieval mission and could jeopardise the rescue of those still alive under the landmass.\nThe exact number of people who were in the mine at the time of the cave-in remains unknown.\nSmall scale artisanal mines are common in different parts of Africa, despite regulations criminalising them, as unemployment continues to drive able-bodied men to abandoned or unused mines, to eke a living. The mining sites often operate with weak safety standards leading to repeated incidents: at least 40 people have died in several mining incidents in CAR this year alone.", "translation_ja": "", "vocab": [{"word": "artisanal", "definition": "小規模で手工業的な、または伝統的な方法で行われることを意味する形容詞。特に開発途上国で個人や小規模グループが行う採掘活動に使われる。"}, {"word": "landslide", "definition": "土砂が斜面から急速に流れ落ちる地質現象を指す名詞。また圧倒的な勝利や支持を意味する比喩的用法もある。"}, {"word": "deluge", "definition": "大量の水が押し寄せることや、圧倒的な量の物が殺到することを意味する名詞。ここでは土砂の洪水を表している。"}, {"word": "toll", "definition": "災害や事故による死傷者の数、または代償を意味する名詞。通常ネガティブな結果や被害の程度を表す。"}, {"word": "jeopardise", "definition": "～を危険にさらす、または～の成功を危うくすることを意味する動詞。英国英語ではこのスペリングが使われる。"}, {"word": "eke out", "definition": "わずかな資源で何とか生活する、または不足分を補うことを意味する句動詞。困難な状況で最小限の生活を続けることを表す。"}]}, {"title_ja": "ケニアのサファリヘリコプター墜落、アメリカ人5人を含む7人が死亡", "title_en": "Seven killed in safari helicopter crash in Kenya, including five Americans", "summary_ja": "ケニア北部のサファリ地域でヘリコプターが水曜日に墜落し、乗員乗客7人全員が死亡しました。死者にはアメリカ国籍者5人とエクアドルの国家情報機関長官が含まれています。同機はレディ・ローリ・ヘリコプターズが運用する観光地間の移動便でした。", "summary_en": "A safari helicopter crashed in northern Kenya on Wednesday, killing all seven people onboard, including five US citizens and Ecuador's national intelligence director. The aircraft, operated by Lady Lori Helicopters, was flying between tourist destinations when it went down in a remote, mountainous area.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/19/kenya-helicopter-safari-crash", "state_media": false, "category": "社会", "full_text": "Seven people, including five Americans, were killed when a safari helicopter crashed on Wednesday morning in a remote part of northern Kenya, according to local police and the state department.\nAmong the dead were an executive with Telemundo, the US-based Spanish-language network owned by NBC Universal, and the director of Ecuador’s national intelligence service.\nThe helicopter crashed at 9.13am while flying from the Loisaba Conservancy to the Ewaso Nyiro area in Samburu county, according to the Kenya Civil Aviation Authority, which said in a statement that an investigation was under way. It said there were seven people onboard – six passengers and the pilot.\nLate on Wednesday, David Nkoroi, the police commander for Samburu, told reporters that all seven people onboard had died.\nIn Washington, the state department said five of those killed were US citizens. “The US embassy is in touch with local authorities and is providing consular assistance,” it said. “We extend our deepest condolences to the families and loved ones on their loss.”\nThe identities of the victims were not revealed but a local television station in Miami, Florida, said that José Suárez, 55, president and GM of several Telemundo stations in Florida, was among those killed.\n“We are heartbroken to learn the tragic news that José was killed in a helicopter accident in Kenya,” the NBC affiliate in Miami quoted from a joint statement from NBC Universal and Telemundo leadership.\nThe helicopter crashed in a rugged area in the foothills of Mount Ololokwe, a popular tourist destination in the country, local media reported. The helicopter, owned by local company Lady Lori Helicopters, was carrying guests with the travel company +Beyond.\nLady Lori Helicopters said in a statement that the aircraft was operating a charter flight when it crashed.\nTropic Air Kenya, a local safari operator, said in a statement that it dispatched two of its helicopters to aid search and rescue operations.\nThe aviation authority said the aircraft was a Eurocopter EC130 B4.\nEcuador confirmed later on Wednesday that Michele Sensi-Contugi, director of the country’s national intelligence center, died in the helicopter crash in Kenya.\nIn a statement posted on X, the presidency said: “In this moment of deep sorrow, the government extends its heartfelt condolences to his family, loved ones and close associates.”\nSensi-Contugi was visiting Kenya as a tourist with his wife, Stephany Hollihan Vasconez, who also died in the crash. She was a US and Ecuadorian citizen. They are survived by their two children.\nHelicopter crashes have happened with increasing regularity in Kenya, which has a thriving tourism industry that depends on domestic carriers to ferry visitors to distant places like Mount Ololokwe.\nIn February, a legislator was among six people who died after a helicopter crash in a hilly area of western Kenya.", "translation_ja": "", "vocab": [{"word": "consular assistance", "definition": "領事館による支援。外国人が海外で困難に陥った際に、その国の大使館や領事館が提供する公式な援助のこと。"}, {"word": "charter flight", "definition": "チャーター便。定期便ではなく、特定の目的地や時間で個人や団体が専有するために運航される航空便のこと。"}, {"word": "thriving tourism industry", "definition": "繁栄する観光産業。活気に満ちた経済的成功を収めている観光業のこと。"}, {"word": "rugged terrain", "definition": "険しい地形。凹凸が激しく、通行が困難な山岳地帯などの地理的環境のこと。"}, {"word": "aviation authority", "definition": "航空当局。航空機の安全性や運航を監督・規制する政府機関のこと。"}]}, {"title_ja": "米郵便公社、裁判所の判決に反して郵便投票制限案を公表", "title_en": "USPS Publishes Mail-in Ballot Restrictions Despite Court Ruling", "summary_ja": "米郵便公社（USPS）がトランプ大統領の下で郵便投票を制限する95ページの規則案を公表しました。この規則は州に有権者記録の提供とバーコード付き投票用紙の再設計を要求するものです。裁判所はこの制限は違憲と判断していますが、USPSは差し止め命令が取り消された場合に即座に発効できるよう準備しています。", "summary_en": "The U.S. Postal Service has released a 95-page draft of proposed rules to restrict mail-in voting under President Trump, despite court injunctions blocking their implementation. The rules would require states to provide voter records and redesign ballot envelopes with barcodes for tracking. Courts have ruled the restrictions unconstitutional, but USPS prepared them to take effect immediately if the injunction is reversed.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/22/us-postal-service-shares-mail-in-ballot-restrictions-despite-court-ruling?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US Postal Service shares mail-in ballot restrictions despite court ruling\nUS President Donald Trump has called for restrictions on mail-in voting as part of a bid to exert control over elections.\nThe United States Postal Service (USPS) has published a final draft of its proposed rules to restrict the use of mail-in ballots under President Donald Trump.\nThe rules have so far been blocked by the US court system. But the USPS shared the 95-page update on Friday so that the rules can go into effect immediately if the existing court injunction is reversed.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Trump asks US Supreme Court to allow mail-in voting restrictions\n- list 2 of 3Homeland Security Secretary Mullin reiterates Trump threats about elections\n- list 3 of 3Did China steal 2020 US election data, as Trump claims?\nUnder the proposed rules, the Postal Service will not distribute mail-in ballots in states that do not comply with federal demands for voter records.\nStates would be required to identify to the USPS any voters who have requested mail-in ballots. They would also have to redesign the ballot envelopes to feature barcodes that the Postal Service could use to track and identify voting materials.\nIn the 95-page document, the USPS argued that such changes were necessary to ensure compliance with federal law.\n“These requirements do not amount to election administration, nor do they usurp state resources,” the document said. “Rather, they regulate the use of the mail to improve operational efficiency and support the faithful execution of federal law.”\nBut critics have accused the Trump administration of seeking to exert federal oversight on election administration, a task that falls to the states under the US Constitution.\nThey warn that the Postal Service could use the proposed rules to gather voter information and reject ballots in states that do not comply with Trump’s demands.\nSince returning to office for a second term in 2025, Trump has sought to place additional restrictions on voting, based on false claims of widespread election fraud.\nHe has, for instance, continued to maintain that he was the rightful winner of the 2020 presidential election, a race he lost.\nTrump has also used claims of “rigged” voting to cast doubt on other elections where the outcome was not in his favour.\nEarlier this year, for instance, he accused the state of California of “cheating” in its primary races, after several Republican candidates fell short of his expectations.\nMail-in ballots have been a longstanding focus of Trump’s efforts to exert greater control over the electoral process. Though he has criticised the voting method as ripe for fraud — an unsubstantiated allegation — Trump himself has voted by mail on multiple occasions, including in this month’s Florida primary.\nRepeated studies have shown that election fraud is exceedingly rare in the US. Every state has laws barring noncitizen voting and fraudulent ballot-casting.\nIn March, however, Trump issued an executive order instructing the Postal Service to implement new rules about mail-in ballots. Friday’s 95-page document is a response to that demand.\nControl of the US Senate and House of Representatives will be on the ballot in November, with Democrats hoping to win back one or both chambers of Congress.\nLeaders of 23 states, plus the District of Columbia, quickly challenged the Trump administration’s plans to impose the new rules on mail-in voting.\nA group of voting rights organisations filed a separate lawsuit with the same goal.\nIn June, US District Judge Indira Talwani blocked the rules from taking effect, saying states could voluntarily opt into the rules but that the federal government could not impose policies like barcoding.\nTalwani ruled a second time on August 11, this time addressing the case brought by the voting rights groups. She once again issued a preliminary injunction to prevent the rules from taking effect, noting that there were fewer than 90 days until the midterm races.\n“Where [Trump’s executive order] is presently causing confusion and threatening both increasing chaos and an erosion of trust in our democracy, the court finds that enfranchisement heavily outweighs the executive’s attempt to unconstitutionally insert itself into the domain of election regulation,” Talwani wrote.\nStill, Postmaster General David Steiner has defended the Trump administration’s plan, arguing in June that the rules would ensure that post officials “match the ballots that a state believes they’re sending out to what actually gets sent out”.\nAfter the voting rules went online on Friday night, critics slammed the effort to push forward the restrictions.\n“Late tonight, USPS caved [in] to Trump,” voting rights advocate and Trump critic Marc Elias wrote in a social media post on Saturday.\nDemocratic lawmakers have likewise argued that the Postal Service is seeking to reconfigure election rules with the midterm elections just months away.", "translation_ja": "", "vocab": [{"word": "injunction", "definition": "裁判所が発令する法的命令で、ある行為を禁止または強制するもの。本記事では、郵便投票制限ルールの発効を禁止する仮差し止め命令を指します。"}, {"word": "usurp", "definition": "他者の権利や権限を不法に奪い取ること。本記事では、州に属する選挙管理権を連邦政府が奪おうとしていることを表現するために使用されています。"}, {"word": "noncitizen", "definition": "市民権を持たない外国人を指す。不正投票の防止に関連する文脈で、市民でない者による投票を禁止する法律があることを説明しています。"}, {"word": "enfranchisement", "definition": "投票権を与えること、または市民が投票する権利。裁判官の判決では、投票権の保護が行政権の行使よりも重要であると述べられています。"}, {"word": "preliminary injunction", "definition": "訴訟の最終判決前に発令される仮の法的命令で、紛争の一方の当事者が被る害を防ぐためのもの。本記事では、郵便投票ルールが発効するのを一時的に禁止するための措置です。"}, {"word": "subpoena", "definition": "裁判所が発令する強制力を持つ令状。ただしこの記事には直接登場しませんが、政府が情報提供を強制する文脈で関連します。本記事では「unsubstantiated」（根拠のない）という形容詞が使用されており、詐欺の主張に証拠がないことを表現しています。"}, {"word": "reconfigure", "definition": "構成を変え直す、再構成する。本記事では、民主党議員がUSPSが選挙ルールを再構成しようとしていると批判している文脈で使用されています。"}]}, {"title_ja": "イランがイラク石油タンカーのホルムズ海峡通過を許可", "title_en": "Iran Permits Iraqi Oil Tankers Through Strait of Hormuz", "summary_ja": "イランがバグダッドの繰り返しの要請を受けてイラク石油タンカーのホルムズ海峡通過を許可し、イラク大統領ニザール・アミディが一部の船舶の通過を確認しました。この動きはイランがイラクを友好国として優遇する一方で、他国と米国に対しては海峡の広範な封鎖を維持していることを示唆しています。", "summary_en": "Iran has granted permission for Iraqi oil tankers to pass through the Strait of Hormuz following Baghdad's repeated requests, with Iraqi President Nizar Amidi confirming the facilitation of some shipments. The move reflects Iran's preference for Iraq as a friendly state while maintaining a broader closure of the strait against other nations and the United States.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/22/iran-grants-permission-for-some-iraqi-oil-tankers-to-pass-through-hormuz?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Iran grants permission for some Iraqi oil tankers to pass through Hormuz\nIraqi President Nizar Amidi says his country’s territory will not be used to launch attacks against any other state.\nIran has granted permission for a number of Iraqi oil tankers to pass through the Strait of Hormuz following repeated requests from Baghdad through various channels, according to Iranian state media.\nThe IRNA government news service reported on Saturday that obtaining special permission for Iraqi tankers was one of Baghdad’s main requests during Iranian parliament speaker Mohammad Bagher Ghalibaf’s visit to Iraq this week.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Seven decades of US regime change efforts: What have they achieved?\n- list 2 of 4Are ships passing Hormuz more willing to defy Iran or US? What data shows\n- list 3 of 4‘Tremendous costs’: Can Trump stop other countries from trading with Iran?\n- list 4 of 4Iran says new US sanctions violate sovereignty of other states\nIraqi President Nizar Amidi said on Saturday that Iran had facilitated the passage of “some ships carrying Iraqi oil in the strait” in recent days and Baghdad had discussed the export of Iraqi oil through Hormuz with Iranian officials.\nSpeaking at the Baghdad Dialogue policy conference, Amidi added that the government will not accept Iraqi territory being used to launch attacks against any other country. The Iraqi president said attacks launched from inside Iraq against countries in the region “have no justification”.\n“Everyone is keen to prevent Iraq from being dragged into the ongoing war in the region,” he said, adding that its repercussions “have been harsh on our country”.\nOn the Strait of Hormuz, Amidi said it “affects the whole world, not only Iraq”, adding that Baghdad remained in talks with Iran over what he described as “complex problems” in the strait.”\nAl Jazeera’s Tohid Asadi, reporting from Tehran, described the situation around the strait as a “holding pattern that applies not only to Iraqis but also all countries”.\n“The situation at the Strait of Hormuz remains still vague as Iran has been involved in talks with Oman to find the arrangements for the reopening of the strait,” Asadi said.\n“So far, no deal has been reached, regardless of the good progress that Iran has been talking about. And obviously – speaking of the larger context – the United States is another determinant when it comes to the closure of the strait, as the Iranians are saying that as long as the naval blockade continues, the strait is going to remain closed,” he added.\nSpeaking to Al Jazeera, Mostafa Khoshcheshm, a professor at the University of Applied Sciences in Tehran, said Iran has decided to let Iraqi oil tankers pass through the Strait of Hormuz because Baghdad has “always stood up to the United States”.\nKhoshcheshm suggested Iran is looking to punish Gulf states, which have allowed US forces to use their military bases to launch attacks on Iran – an accusation regional countries’ deny – while treating Iraq as a “friendly state”.\n“Iran has requested other states to do the same [and] stop the US from using their territory,” the analyst added.\nIraq has been among the countries most affected by Iran’s effective closure of the Strait of Hormuz. Traffic in the strait remains significantly below pre-war levels and ships continue to face attacks in the area.\nIraq produced approximately 4 million barrels of oil per day before the outbreak of the US-Israel war on Iran. But Baghdad is working to expand its exports through Turkiye’s Ceyhan port and also to begin exporting oil through Syria’s Baniyas port and Jordan’s Aqaba port, Prime Minister Ali al-Zaidi said on Friday.", "translation_ja": "", "vocab": [{"word": "facilitated", "definition": "～を容易にする、助成するという意味の動詞。特にビジネスや外交の文脈で、障害を取り除いて何かが進むようにすることを指します。"}, {"word": "repercussions", "definition": "（ある行動や出来事による）悪影響、波及効果を意味する名詞。通常は複数形で使用され、長期的な負の影響を示します。"}, {"word": "determinant", "definition": "決定要因、決め手となる要素を意味する名詞。ある結果や状況に重要な影響を与える要素を指します。"}, {"word": "closure", "definition": "閉鎖、閉ざすことを意味する名詞。通路、施設、事業などが機能停止または遮断された状態を表します。"}, {"word": "blockade", "definition": "封鎖、特に軍事的な海上封鎖を意味する名詞。敵国への物資供給や通商を制限するために海域を封鎖する行為です。"}, {"word": "vague", "definition": "曖昧な、不明確なという意味の形容詞。情報や状況がはっきりしていない、あるいは不確定な状態を表します。"}]}, {"title_ja": "イスラエルはなぜ違法な入植地を建設しているのか？", "title_en": "Why is Israel building new illegal settlements?", "summary_ja": "イスラエルの右翼政府は、国際法違反の新しい住宅1,200戸の建設入札を開始し、占領下のヨルダン川西岸での入植地拡大を加速させている。この政策はイスラエルの支配を強化し、パレスチナの連続した国家の形成を阻止することを目的としており、一部の西欧諸国は報復的に制裁の脅しをかけている。", "summary_en": "Israel's right-wing government has opened construction bids for 1,200 new illegal housing units in the occupied West Bank, accelerating settlement expansion under international law. The policy aims to strengthen Israel's control and prevent a contiguous Palestinian state, with some Western nations threatening sanctions in response.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/inside-story/2026/8/22/why-is-israel-building-new-illegal-settlements?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Inside Story\nWhy is Israel building new illegal settlements?\nIsrael opens construction bids for new illegal housing units in the occupied West Bank.\nIllegal under international law, Israeli settlements in the occupied West Bank have been expanding for decades.\nThe right-wing government of Prime Minister Benjamin Netanyahu has fast-tracked the establishment of new ones.\nRecommended Stories\nlist of 4 items\n- list 1 of 4As families retrieve bodies, Gaza is running out of places to bury the dead\n- list 2 of 4Over 100 ex-diplomats urge France, UK to sanction Israel over Palestine\n- list 3 of 4Israel’s Chief Rabbi says Palestinians are not a people and have no rights\n- list 4 of 4What did war with the US reveal about Iran’s weapons capabilities?\nThe policy aims to tighten Israel’s hold on the occupied West Bank and block the creation of a contiguous Palestinian state.\nWith just months to go until the elections, the government has opened bids for the construction of 1,200 illegal housing units. It has also ignored international criticism of the planned illegal settlement, known as E1.\nSome Western countries are threatening sanctions if Israel goes ahead. But would that make a difference?\nPresenter: James Bays\nGuests:\nAmmar Hijazi – Ambassador and head of the Palestinian Mission to the Netherlands\nAlon Pinkas – Former Israeli ambassador and consul general in New York", "translation_ja": "", "vocab": [{"word": "contiguous", "definition": "互いに接している、または隣接している状態を意味する。地理的に繋がった領土や領域を表すのに使われる。"}, {"word": "fast-tracked", "definition": "通常のプロセスよりも速く進める、または優先的に処理することを意味する。政策や計画を迅速に実行する場合に使われる。"}, {"word": "settlement", "definition": "新しく建設された集落や居住地域を指す。特に政治的紛争地域での建設を強調する場合に使われる。"}, {"word": "sanctions", "definition": "国際関係における経済的または政治的な懲罰手段を意味する。特定の国や団体に対する圧力をかけるために実施される。"}, {"word": "occupied", "definition": "軍事的に支配下または占有されている領土を表す。通常は国際紛争の文脈で使われる。"}]}, {"title_ja": "米国、インドが関税回避を支援していると非難—迂回輸送スキャンダル", "title_en": "U.S. Accuses India of Helping China Evade Tariffs Through Transhipment", "summary_ja": "米国ホワイトハウスが発表した報告書『大迂回輸送詐欺』は、インドを含む40ヶ国以上が中国製品をわずかに改変して米国への関税を回避していると非難しています。インドは主要な協力国として特定され、2025年の推定280億ドルの米国関税収入喪失につながっています。この最新の疑惑は、ロシア産油輸入と強制労働慣行をめぐる米国とインドの既存の貿易緊張に加わるものです。", "summary_en": "The U.S. White House report titled 'The Great Transhipment Scam' accuses India and 40 other countries of routing Chinese goods through their territories with minimal modifications to evade American tariffs. India is identified as one of the top enablers, with an estimated $28 billion in lost U.S. tariff revenue in 2025. This latest allegation adds to existing trade tensions between the U.S. and India over Russian oil imports and forced labor practices.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/business/what-are-the-uss-latest-allegations-against-india-explained/article71378950.ece", "state_media": false, "category": "経済", "full_text": "The story so far: Last week, the U.S. accused India of violating what it considers fair trade practices. The White House published a report titled ‘The Great Transhipment Scam’ in which it accused about 40 countries, including India, of helping China evade U.S. tariffs.\nWhat is the Great Transhipment Scam?\nOver the last nearly three decades, the U.S. and Chinese economies have become deeply intertwined, with the U.S. increasingly relying on China to be its manufacturing hub, and China relying on the U.S. as its market and for investment. This is a somewhat simplistic assessment of their engagement, but it is also the most relevant for the current context.\nThis relationship has resulted in the U.S. running huge trade deficits with China. That is, importing much more from the country than it exports to it. U.S. President Donald Trump has long spoken about his concerns about vast trade deficits; this is primarily why he insisted on levying tariffs on U.S. trade partners during his second term.\nHowever, China began facing such actions during Mr. Trump’s first term itself. In 2018, the U.S. imposed tariffs ranging from 7.5% to 100% on goods from China such as electric vehicles, semiconductors, and medical products under Section 301 of the Trade Act of 1974, for unfair trade and tech practices. As per the White House report, this resulted in a shrinking of the U.S.’s trade deficit with China in 2019 and 2020.\nOn July 24, 2026, the U.S. added a further 12.5% tariff for gaps in forced-labour compliance and the lack of comprehensive legal import prohibitions.\nAccording to the report, since 2018, Chinese exporters have increasingly been routing goods through third countries to evade tariffs. “Products that previously moved directly from China to the United States were shipped through jurisdictions where limited assembly, finishing, repackaging, relabeling, or documentation changes could create the appearance of a different national origin,” the report stated.\nWhat is India’s involvement?\nThe White House has identified more than 40 countries associated with “elevated illegal transhipment risk”, with India among the top “enablers” of China’s evasion of tariffs. The other countries/regions named as the top enablers are Mexico, Canada, the European Union, Japan, and South Korea.\nThe U.S. has alleged that these countries are importing Chinese goods, modifying them marginally, and exporting them to the U.S. at tariffs below what these goods would have faced had they directly been exported from China. This, the report said, has led to significant revenue loss for the U.S. government.\n“The Office of Trade and Economic Analysis estimates that approximately $67 billion in U.S.-bound goods were transshipped from China through the top hubs — Mexico, India, and Vietnam — in 2025, producing an estimated $28 billion in lost tariff revenue,” the report said.\nAs an example, the report mentioned the Pune-Gujarat-Chennai production belt, saying that the region “absorbs” pumps and compressors from China, thereby affecting industrial supply chains in Cincinnati, Dayton, and Columbus in the U.S.\nWhat does this mean for the U.S.?\nBroadly, the report’s findings suggest that the U.S.’s tariff policy has failed to reduce U.S. imports and increase domestic production. While U.S. imports from China fell from $525.8 billion in 2017 to $327.5 billion in 2025, total U.S. imports from all countries rose sharply from $2.41 trillion to $3.50 trillion. In short, the U.S. replaced many Chinese finished goods with imports from other countries rather than with domestically produced goods.\nAs Ajay Srivastava, founder of the think tank Global Trade Research Initiative, said, “Mr. Trump’s tariffs changed the source of imports but failed to reduce America’s overall dependence on imported goods”.\nWhat are the implications for India?\nThis is yet another way that the U.S. is finding fault with India’s trade policies. During his first term, Mr. Trump found fault with India’s tariffs on luxury motorcycles, after which India reduced them.\nLast year, he blamed India for financing Russia’s war with Ukraine by importing Russian oil; his government hiked tariffs on imports from India to 50% as a penalty.\nMore recently, the U.S. Senate passed a Bill with Mr. Trump’s backing that would result in tariffs of up to 100% being levied on India for its Russian oil imports. The Bill is waiting to be introduced and passed in the House of Representatives.\nApart from this, the U.S. has also imposed a 10% tariff on imports from India as a penalty for not doing enough to curb the import of goods made using forced labour. Another investigation on excess capacity is ongoing, which could potentially see tariffs being hiked even further.\nThe latest allegations that India is helping China evade tariffs are not accompanied by penal actions yet, but that possibility remains. Mr. Trump could decide to impose further tariffs on countries he deems are helping China in this regard.\nHow could ", "translation_ja": "", "vocab": [{"word": "transhipment", "definition": "第三国を経由して商品を再輸送する行為。元の発地を隠すため、わずかな加工や再梱包を施して輸出元を変えるプロセスを指します。"}, {"word": "evade", "definition": "法的義務や制約をうまく避ける、または逃れることを意味する動詞。ここでは関税を回避する意図を表しています。"}, {"word": "tariff", "definition": "輸入品に対して政府が課す税金。国内産業の保護や貿易政策の手段として機能します。"}, {"word": "trade deficit", "definition": "ある国の輸入額が輸出額を上回る貿易収支の赤字状態。国が海外から輸入する商品の価値が、輸出する商品の価値より大きいことを示します。"}, {"word": "compliance", "definition": "法律や規制、協定などに従う行為または状態。違反がないか確認される基準を満たすことを意味します。"}, {"word": "hub", "definition": "中心地点または集約地点。貿易において、商品が集められ、処理され、再配分される重要な拠点を示します。"}, {"word": "penal", "definition": "罰や処罰に関連する形容詞。違反に対する罰則的措置を指します。"}]}, {"title_ja": "トランプ大統領のインド投票制度批判：米国とインドの選挙制度の違い", "title_en": "Trump's Critique of India's Voting System: How US and Indian Elections Differ", "summary_ja": "トランプ大統領がTruth Socialでインドの選挙慣行に疑問を呈し、インドの郵便投票率の低さと米国システムを比較し、SAVE America法を通じた厳格な投票人ID要件を提唱しました。この記事は、州が管理する米国の連邦選挙制度とインドの中央集権的な選挙委員会による制度の構造的違い、および有権者適格要件に関する議論とその実際的影響を検証しています。", "summary_en": "President Trump questioned India's election practices on Truth Social, comparing India's low mail-in voting rate to the U.S. system and advocating for stricter voter ID requirements through the SAVE America Act. The article examines structural differences between the U.S. federal election system managed by states and India's centralized Election Commission, as well as debates over voter eligibility requirements and their practical impacts.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/what-did-trump-say-about-indias-voting-system-explained/article71378943.ece", "state_media": false, "category": "政治", "full_text": "The story so far:\nPresident Donald Trump posted on his social media platform, Truth Social, that India’s Chief Election Commissioner Gyanesh Kumar had asked his administration how elections are held in the U.S. without a valid photo identity card.\nHe also pointed out that just 1% of India’s 64.64 crore electors who voted in the last general elections voted by mail (unlike the large number who do so in the U.S.) Mr. Trump reiterated his demand that Congress pass the Safeguard American Voter Eligibility (SAVE America) Act, which would require documentary proof of citizenship to register to vote in federal elections and a photo ID to cast a ballot, among other restrictions.\nHow are elections conducted in the U.S. and how do they differ from elections in India?\nArticle I, Section 4 of the U.S. Constitution (the Elections Clause) empowers the State legislatures to determine the “times, places, and manner” of federal elections, even as it allows Congress to alter or make such regulations. There is no national election authority like the Election Commission of India. There is the Federal Election Commission, but it is only empowered to regulate campaign finance as registration, balloting, and counting are done by the States’ county and municipal jurisdictions. This is due to the strongly federal nature of the U.S., unlike India’s quasi-federal system.\nThe U.S. Congress also passed the National Voter Registration Act, 1993, which required States to offer voter registration at motor vehicle and public assistance offices, and the Help America Vote Act, 2002, which provided funding for States to buy new voting machines and called for State-wide elector databases.\nVoter eligibility in the U.S. is therefore a State concern, and registration is elector-initiated. While documentary proof of citizenship is not demanded, a potential elector has to affirm citizenship under penalty of perjury on the registration form. Thirty-six States ask for some form of identification at the polling place and 23 ask for a photo ID.\nThis is unlike India, where electoral rolls are compiled in each State via house-to-house enumeration conducted by the ECI, which has superintendence over the whole process of registration. Eligible electors are then issued the Electoral Photo Identity Card (EPIC), though other documents, including Aadhaar, can be used as identification at the booth as well.\nIs non-citizen voting a real problem in the U.S. as Trump has made it out to be?\nIndependent studies have found that almost all non-citizen registrations in the U.S. are accidental and only a small proportion of them votes. The Trump administration’s claims have not survived scrutiny. The New York Times reported that after announcing in July that it had identified 2,78,000 non-citizens on the rolls of four States, including 15,903 in Nevada, the Department of Homeland Security told Nevada’s election administrators this month that it had identified just 185 potential non-citizens so far. It described the earlier figure as a “ceiling” and shared a list without names.\nSurveys show that a large majority of the electorate supports the requirement of photo identification at the polls. Yet, even this is short of the more onerous requirement of proving citizenship at the point of registration, which is what the SAVE America Act requires.\nWhat is the SAVE America Act, and why is it opposed by Democrats and others?\nThe SAVE America Act was passed by the U.S. House of Representatives in February along party lines, with Republicans outnumbering Democrats. It requires every new registering elector or an existing elector who wants to update his/her record to produce a passport, or a birth certificate, or naturalisation papers along with a government photo ID. Mail-in voters — a widely used option in the U.S. — have to enclose a copy of their photo ID. States will then run names on electoral rolls through the U.S. Department of Homeland Security and the latter could flag non-citizens for removal. Election officials who register people who lack the documents can face up to five years in prison.\nThe Bipartisan Policy Centre in the U.S. estimates that over 20 million eligible American citizens do not have ready access to a passport or a birth certificate. Newly registering young adults have also faced problems producing these documents. These concerns have led the Democratic Party to oppose the SAVE America Act, which has stalled in the Senate.\nIs India’s Special Intensive Revision (SIR) process delivering the “pure” rolls that the ECI promises?\nThe SIR, launched by the ECI to “purify” the electoral rolls, uses a peculiar methodology in which electors must self-enumerate on forms distributed door-to-door by the ECI before being included in the draft roll. After scrutiny by election officials, who will compare the forms with the previous SIR conducted more than two decades ago in the States, the draft rolls will be updated (the corrections and clarifications phase) before new ", "translation_ja": "", "vocab": [{"word": "superintendence", "definition": "管理や監督の権限、特に公式な機関による全体的な監視を意味します。選挙委員会による登録過程全体の監視を指すために使用されています。"}, {"word": "enumeration", "definition": "詳細な数え上げや一覧作成のプロセスを指します。選挙管理において有権者を戸別訪問で数え上げることを意味します。"}, {"word": "onerously", "definition": "負担が重く、困難である方法を意味する副詞です。より厳しい要件を課す際に使用されます。"}, {"word": "scrutiny", "definition": "詳細で厳密な調査や審査を意味します。主張や制度が精密な検討に耐えられるかを確認するために使用されます。"}, {"word": "purify", "definition": "不要な要素を除去して純化することを意味します。選挙投票用紙から不正な登録を削除するプロセスを指します。"}, {"word": "stalled", "definition": "進行が停止した、または進展していない状態を意味します。議会での法案の進捗が止まっていることを表しています。"}]}, {"title_ja": "配偶者の後を追わず上院議員となった初の女性ナンシー・カッセバウム・ベイカー、94歳で死去", "title_en": "Nancy Kassebaum Baker, First Woman Senator Without Spousal Path, Dies at 94", "summary_ja": "配偶者なしで米国上院議員に選出された初の女性ナンシー・カッセバウム・ベイカーが94歳で自然死で亡くなった。1978年から1997年までカンザス州を代表する穏健派共和党員として3期を務め、党の圧力にもかかわらず超党派的な大義を支持し、歴史的な健康保険法を共同作成した。彼女の独立心と政治的権力の外部性への拒否は、カンザス州政治において党派を超えた尊敬される人物にした。", "summary_en": "Nancy Kassebaum Baker, the first woman elected to the U.S. Senate without following a spouse into office, has died at 94 from natural causes. She served three terms representing Kansas from 1978 to 1997 as a moderate Republican, co-authoring landmark health insurance legislation and supporting bipartisan causes despite party pressure. Her independent-minded approach and refusal to be caught up in political power dynamics made her a respected figure across party lines in Kansas politics.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nancy-kassebaum-baker-former-us-senator-from-kansas-dies-at-94/article71378927.ece", "state_media": false, "category": "政治", "full_text": "Nancy Kassebaum Baker, a Kansas governor's daughter who became the first woman elected to the U.S. Senate without following a spouse into office, has died. She was 94.\nKassebaum Baker died Friday (August 22, 2026) of natural causes, according to her son, Bill Kassebaum.\n“She loved Kansas. She loved people from Kansas and represented Kansas for 18 years in the US Senate,” he told The Associated Press. “She was an independent-minded Republican who was willing to stand up for what she thought was ri
