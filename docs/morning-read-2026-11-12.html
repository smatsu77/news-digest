5年間続く戦争を終わらせる具体的な突破口は見られませんでした。ただし、モスクワとキーウの両者は大規模な捕虜交換が実施間近であることを確認しました。", "summary_en": "Talks in Abu Dhabi centred around Europe's security framework, with US envoys due to meet Putin and Zelensky on Thursday.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck792we7zrz4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Russia-Ukraine talks turn to post-war security but end without breakthrough\n- Published\nTrilateral talks in Abu Dhabi between Russia, Ukraine and the US aimed at ending the war in Ukraine have concluded after a second day.\nAlthough the American side said they saw \"some openings\", there was no hint of any breakthroughs to end the nearly five year-long war sparked by Russia's invasion.\nHowever, both Moscow and Kyiv confirmed that a large-scale prisoner of war exchange was in the works and could be carried out soon.\nDavyd Arakhamia from Ukraine's negotiating team said that this round of talks - the first since February - \"was one of the hardest.\"\n\"I believe the Russians came with very strict directives, so it was extremely difficult to soften the discussion,\" he said. But he added that he felt \"good momentum\" and urged for a second round of talks to be organised as soon as possible.\nComments by Kremlin negotiator Vladimir Medinsky were less conciliatory. \"Right now... a lot depends on Ukraine, on the position of the US, and on whether Europe comes to its senses,\" he said.\nAfter the talks it was announced that on Thursday US negotiators Steve Witkoff and Jared Kushner - President Donald Trump's son-in-law - would travel to Moscow to meet Russian President Vladimir Putin, and then to Dublin to speak to Ukraine's Volodymyr Zelensky.\nThe meetings in Abu Dhabi had been framed as centred around the \"security architecture\" of Europe.\nFor Kyiv, this may include reassurances that allies will come to its aid if Ukraine comes under attack again, despite the country not being a Nato member.\nFor Moscow, a reworked \"security framework\" is likely to include a limit to the influence of Nato in eastern Europe - a central concern for the Kremlin since the alliance's eastward expansion.\nEarlier this week Kushner said the US hoped to \"create a new framework\" of security between Ukraine, Russia and Europe that could \"secure lasting peace\", while the Kremlin's Medinsky said the world needed a \"new\" and \"fair\" security system.\nThat framework would serve as \"a new Yalta and Potsdam\", Medinsky said, referring to the 1940s summits in which the victorious Allied powers carved up post-war Europe into spheres of influence.\nUkraine and Europe have long been concerned about the current US administration's commitment to European security and its softening towards the Kremlin.\nRepresentatives of Britain, Nato and various EU countries were also in Abu Dhabi and met with US and Ukrainian negotiators, but the Kremlin - with whom the EU does not officially communicate - said its delegation had not had any contact with them.\nMoscow has been dismissive of European involvement, although Europeans have long argued that they are central to any post-war dynamics on their continent.\nMany - particularly in eastern Europe - feel their security is linked to that of Ukraine. Agreements cannot be implemented \"if no consensus can be reached among Nato members,\" a German government spokesperson said on Wednesday.\nKushner said the US was keen to bring the Europeans on board and said that getting them \"added to the format\" would be on the agenda for his talks with Putin.\nThere is also disagreement on whether discussions on a future security framework should be preceded by a ceasefire, as the Europeans and Kyiv would want, or whether the fighting only stops after an agreement has been reached, as the Kremlin has insisted.\nAny agreement on a peacetime security framework, however, is contingent on the war ending, Kushner noted. But that cannot occur \"until there's an agreement on territory and on all other bilateral issues,\" he added.\nSince talks began last year, a core obstacle to any settlement has been Ukraine's eastern region of Donetsk, which is mostly occupied by Russia. Kyiv wants to freeze the contact line to maintain control over those areas, which it says are essential to its security.\nMoscow, meanwhile, has never backed down from its demand that Ukraine relinquish the parts of Donetsk it still holds. \"Every inch\" of land would be \"returned to Russia one way or another\", Medinsky said.\nKushner acknowledged that the territorial question remained the hardest, while Zelensky's chief of staff and negotiator Kyrylo Budanov refused to be drawn on whether Russia was still demanding a Ukrainian withdrawal from the region.\nLater, Budanov admitted the talks had been \"tough\" and that Ukraine's priority was to ensure Russia could not attack it again.\n\"These deals are very hard and complex, and this one is very emotional, very complex,\" Kushner said. \"The reality is there is no trust right now between the sides and that is to be expected after a conflict like this.\"\nRelated topics\n  - Published1 day ago\n  - Published1 day ago", "translation_ja": "", "vocab": []}, {"title_ja": "25歳未満の若者の給付金削減を検討、ミルバーン審査報告書が勧告へ", "title_en": "Some under-25s should get less benefits, Milburn review to say", "summary_ja": "政府が委託したアラン・ミルバーン元労働党保健相の報告書は、25歳未満の若者が受け取れる給付金の削減を勧告する予定です。報告書では、若者は健康要素付きユニバーサルクレジットや個人独立支払い(PIP)を請求できなくなり、基本的なユニバーサルクレジットと同じレートの手当を受け取ることが想定されています。一方で、政府は若者向けの雇用支援に数十億ポンドを投資し、職業訓練や職業補助金などを提供する計画です。", "summary_en": "The proposed radical overhaul of the welfare system would move under-25s off the main sickness benefits.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwn70l1628l0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Some under-25s should get less benefits, Milburn review to say\n- Published\nSome young people could see reductions to the benefits they are entitled to, under a radical overhaul of the system to be recommended by a government-commissioned review.\nAlan Milburn's year-long report, which will be published on Tuesday, will recommend moving under-25s off the main sickness and disability benefits, the Times reported, external.\nMilburn, a former Labour health secretary, has been tasked by the government with helping reduce the one in eight 18- to 24-year-olds in the UK who are not in education, employment or training - or \"Neet\".\nHe said on Wednesday night that his plans would not be \"pain-free\" and would affect both existing and new claimants.\nHis report is expected to recommend that under-25s are no longer able to claim the health element of universal credit or personal independence payment (Pip).\nInstead, they would receive an allowance on the same basic rate as universal credit.\nSome could be eligible for a new \"additional cost allowance\" to cover day-to-day costs related to their conditions.\nBut many claimants would receive less under the plans, which the government is set to take forward into legislation in the new year.\nMilburn, a Labour MP from 1992 to 2010, is also expected to recommend an investment of billions into more employment support for young people, including work placements, job subsidies and one-to-one personal advisers.\nThose with more severe disabilities and unable to work would get a new benefit paid at a higher rate.\nSpeaking to the Times about his report, Milburn said: \"Candidly, it could mean that some people will get less financial support at the beginning of their benefit claim than under the current system.\n\"But actually, for young people, there's a different debate that we've got to resolve, which is whether the priority is their longer-term life chances or just their immediate shorter-term finances.\n\"I think what the current system does [is] it prioritises the latter over the former. I believe that's the wrong choice and it needs to be the other way around.\"\nJust under one million young people in the UK are Neets, data from the Office for National Statistics (ONS) from April to June suggests. This was a rise of 3% on the same period last year.\nMilburn's recommendations are likely to be backed by Prime Minister Andy Burnham but could prove controversial among Labour MPs, who opposed welfare reform under his predecessor Sir Keir Starmer.\nThe reforms would represent a radical overhaul of Britain's welfare system, at a time when there is heavy political pressure for the UK to find the money to spend more on defence.\nIf Milburn's recommendations were approved, it could take almost a decade for the British state to see monetary savings.\nThe new system \"will need significant investment\" and would involve \"rebuilding the system from scratch,\" Milburn added.\nHe said that currently \"you've got hundreds of thousands of young people stuck in a benefit system that is trapping them in poverty, giving them no prospect of prosperity or a job\".\nHis new proposed system would involve an element of carrot and stick, where young people could lose some of their benefits if they did not engage with the extra work support options.\n\"A deal isn't a deal unless there are potential consequences,\" Milburn said. \"Entitlements and responsibilities are two sides of the same coin.\"\nA government spokesperson said: \"We will always ensure there is a safety net for the most vulnerable and those who are unable to work.\n\"But the prime minister has been clear that we need a wholesale change in the way we support young people to grow up in this country, where we invest in their success rather than paying for failure.\"\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": []}, {"title_ja": "著者が出版業界内でのデイビッド・ウォリアムズに関する「懸念」について言及", "title_en": "Author says there were 'real concerns' about David Walliams within publishing industry", "summary_ja": "著者クロエ・コンビは、10年以上前から出版業界内でデイビッド・ウォリアムズの行動について「懸念」があったと報告している。コンビは2015年に業界関係者から、ウォリアムズが学校への招待に「ふさわしくない」と警告されたと述べている。ガーディアンとITVニュースの調査では、ウォリアムズが複数の女性から性的非行と不適切な行動で告発されていることが報道されており、彼は否定している。", "summary_en": "The comedian denies allegations of sexual misconduct, inappropriate behaviour and abusing his power more than 10 years ago.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c95y15830k77o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Author says there were 'real concerns' about David Walliams within publishing industry\n- Published\nAuthor Chloe Combi has said she had heard rumours that there were \"real concerns\" about David Walliams's behaviour within the publishing industry more than a decade ago.\nCombi told BBC News she had heard there were allegations about his \"behaviour around young female staff\" and says she was told in 2015 to warn schools that he was \"not an appropriate booking\".\nAn investigation by the Guardian and ITV News alleged that Walliams has been accused by several women of sexual misconduct, inappropriate behaviour and abusing his position, which he denies.\nHarperCollins, which published Walliams's best-selling children's books, dropped Walliams last year after an investigation into his behaviour.\nIn response to the Guardian and ITV report, a spokesperson for HarperCollins said the company had decided not to publish any new titles by Walliams and that it took \"employee wellbeing extremely seriously\".\nWalliams told ITV News and the Guardian that he was \"not a sexual predator\" and had not \"broken the law\".\nCombi said she was getting invited to events such as book launches around the time one of her own books was being published, and was also running a scheme to bring \"high-profile and inspiring writers and speakers\" to talk in schools.\nAt an event in 2015, Combi said she got speaking to someone \"quite senior\" in publishing, who warned her about Walliams.\n\"We were talking about [the scheme] and possible writers who might be good for the project to work well with teenagers,\" Combi said.\n\"She gave me some great recommendations and said to me: 'Whatever you do, don't invite David Walliams, and FYI if you are speaking to head teachers or teachers, please inform them that he's not a good booking, not an appropriate booking for a school'.\"\nCombi continued: \"I obviously asked why, and to be honest I had already heard quite a lot of rumours because those worlds are quite small and contained.\n\"One of the things she said was that there had been real concerns about his behaviour around young female staff.\"\n- If you are affected by any of the issues in this story, help and support is available at BBC Action Line.\nAsked whether concerns about his behaviour was an open secret, Combi replied: \"Yes definitely... and I'd heard it from people who worked in publishing, fellow writers, people kind of in celebrity and TV circles.\"\nCombi said she never met Walliams herself, and said her information had come from \"a number of people I was speaking to\".\nHarperCollins in September announced it would no longer be publishing his back catalogue.\nThe allegations against Walliams include:\n- One woman alleges she met Walliams at a fan event when she was 15. She says he groomed her and they had sex when she was 17\n- Another woman alleges she met Walliams for a coffee when she was 15, before going back to his house where he allegedly tried to lift up her shirt and commit an act that she now describes as a sexual assault\n- A woman who worked as a model in her teens accused Walliams of grooming her. A different woman who also worked as a model said Walliams tried to kiss her while showing her around his home\n- The investigation claimed Walliams had a sexual relationship with at least one junior employee at publisher HarperCollins, and pursued another\n- Other women allege inappropriate behaviour at ITV's Britain's Got Talent, such as inviting girls and young women to his dressing room\nIn his statement to ITV News and the Guardian, Walliams said: \"Looking back, I realise that at times I behaved thoughtlessly towards other people I had casual sexual relationships with.\n\"I realise I did not always take people's feelings properly into account. That is something I regret. And whilst a power imbalance is inevitable when one party is famous, abusing that power is something else entirely and it is something that I never did.\"\nHe added: \"I am not a sexual predator. I have not broken the law, but I am devastated that some of the women I met 10 to 20 years ago have now expressed hurt or anger towards me.\"\nEarlier on Wednesday, media minister Ian Murray said there is a \"cultural problem\" in the industry that needs to be \"stamped out\".\nGiving evidence to the Digital, Culture, Media and Sport Committee, Murray said he was \"deeply saddened and also angry\" to see the prevalence of abuse by men in the media industry.\nMeanwhile, Minister for Women and Equalities Bridget Phillipson paid tribute to the \"bravery\" of victims who have shared their experiences in recent days.\nSpeaking in the Commons, she said: \"Women and girls should never have to shrink our lives or ambitions because of outdated, misogynistic attitudes, and the appalling testimonies we have heard in recent days underline how much further we have to go.\"\nPhillipson later said the government would \"go further\" on restricting the use of non-disclosure agreements, telling Sky News: \"We cannot have a system where rich ", "translation_ja": "", "vocab": []}, {"title_ja": "政府大臣、学校への爆弾脅迫は公共への危険性なしと述べる", "title_en": "No risk to public from hoax school bomb threats, says government minister", "summary_ja": "スコットランドの教育長官は、全国1,000以上の学校が受け取った爆弾脅迫メールについて、公共への危険性はないと発表しました。警察とアイルランド北部の当局も、これらのメールに信頼性のある脅迫内容は含まれていないと確認しており、サイバー犯罪捜査官が発信元の特定に当たっています。警察幹部は、メールが同じ発信元から送信されたと考えられ、国際的なパートナーと共同調査を進めると述べました。", "summary_en": "Police Scotland said at least 1,000 schools received the email but the warnings were immediately assessed as hoaxes.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr868l17yj4jo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "No risk to public from hoax school bomb threats, says government minister\n- Published\nScotland's education secretary has said there is no risk to the public after schools across the country were targeted with a fresh wave of hoax bomb threats, less than a month after a previous alert.\nAt least 1,000 schools received the hoax email, though police and the government said there was nothing within them to suggest a credible threat.\nGovernment minister Mairi McAllan told parliament the situation was \"very much in hand\".\nSpecialist cyber-crime officers are working to identify the source of the messages, which were sent to both primary and secondary schools.\nSimilar \"bogus\" emails were sent to 300 schools in Northern Ireland, while schools in Italy also received threats.\nAssistant Chief Constable Mark Sutherland told the BBC Scotland News that the police were able to assess the threat as a hoax in around an hour and urged parents not to keep their children away from school.\nHe said: \"First and foremost, I'll be sending my daughter to school tomorrow. I think what is important is that we continue to be vigilant, but we are not alarmed.\n\"We have carried out a significant amount of checks on all of the information we have gathered so far and there is nothing to suggest there is a credible threat and there is no requirement to keep children away from education settings.\"\nHe said officers believed that the email was sent by the same source as emails sent to schools in Northern Ireland and elsewhere in the UK but it was \"too early to say\" who could be behind it.\n\"We will be working with partners across the UK and internationally to carry out a joined-up investigation,\" he added.\n- More than 300 calls to police after hoax bomb threats at schools \n  - Published19 October\n- 'Large number' of schools sent threatening email \n  - Published9 hours ago\n- Hundreds of Italian schools hit by threats in suspected bomb hoax \n  - Published6 hours ago\nThe education secretary told MSPs that she had held a meeting with police and local authorities.\n\"As a parent and as a constituency MSP I understand just how concerning this will be for parents, for pupils, for carers and for school staff,\" Mairi McAllan said.\n\"I would take this opportunity to repeat Police Scotland's advice that there is nothing to suggest any threats to the public from the content of the emails.\"\nThe cabinet secretary added there was a \"considerable amount of work\" ongoing by Police Scotland and partners across the UK to \"understand the motivations and the individuals behind this\".\nMost local authorities contacted by BBC Scotland said schools were operating as normal but some confirmed pupils had been evacuated.\nMore than 300 calls were made to police when a similar message was sent to schools around the country on 19 October.\nIn many areas, pupils were off due to half-term holidays.\nOn Wednesday the majority of schools in Dumfries and Galloway received the email and some were evacuated as a precaution.\nA spokesperson for the local authority said: \"Each school community/setting is unique and as such has its own way of supporting and reassuring learners and staff.\n\"We also know that local police have attended some school settings in a community capacity to assist and reassure.\"\nIn Edinburgh Queensferry High School was evacuated and pupils were sent home.\nHighland Council confirmed a number of its schools \"made the decision to activate their emergency protocols\".\nLocal authorities in Glasgow, Edinburgh, East Lothian, Aberdeenshire and Orkney also confirmed their schools received the message.\nIn Northern Ireland, the Education Authority (EA) said the \"message has similarities with a bogus threat sent last month\" which was treated as a hoax by the (PSNI).\nThe Police Service of Northern Ireland said the email originated from outside the UK.\nItalian reports said 280 school head teachers had received threats in recent days. Italian Prime Minister Giorgia Meloni has called a meeting of top ministers and intelligence chiefs over the issue.\nGet in touch\nHave you been affected by the issues in this story? Share your experience", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidiaの取締役会、ジェンセン・ファンCEOの解任を検討か 不倫疑惑と中国スパイ容疑で", "title_en": "Nvidia board reportedly weighs ousting Huang amid alleged affairs with exec and suspected Chinese spy", "summary_ja": "Nvidiaの取締役会は創業者兼CEO のジェンセン・ファンの解任を準備しており、数十年にわたり同社をゲーミングチップメーカーからAI チップの支配的供給企業に成長させた人物の去就が問われている。ファンは妻への不貞を認めており、中国情報機関の関係者とされる女性との不倫関係と、同社幹部との不倫関係の両方が調査対象となっている。この報道を受けてNvidiaの株価は時間外取引で約8%下落した。", "summary_en": "Nvidia's board is reportedly preparing to oust Jensen Huang amid reports of an affair with a suspected Chinese spy. The shake-up would leave the world's leading AI chip supplier without the co-founder who built it.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/nvidia-board-reportedly-weighs-ousting-huang-amid-alleged-affairs-with-exec-and-suspected-chinese-spy/a-79925002?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "Nvidia board prepares to oust CEO Jensen Huang — reports\nNovember 12, 2026\nNvidia's board is preparing to oust co-founder and CEO Jensen Huang and could meet imminently to decide his future, media outlets, led by the Wall Street Journal, reported on Wednesday.\nHuang has led the company for more than three decades, turning it from a gaming chipmaker into the dominant supplier of chips for artificial intelligence.\nWhy is Nvidia's board considering replacing Huang?\nThe report comes as Nvidia investigates whether Huang was targeted by a foreign intelligence effort after reports of an affair with a woman US intelligence reportedly identified as a Chinese intelligence asset. The New York Times reported Wednesday that Huang also had an affair with an Nvidia executive who reported to him.\nNews that Nvidia might part ways with Huang sent the company's shares down about 8% in after-hours trading.\nA reporter for the financial news outlet Bloomberg said on X that Nvidia's board was working with an outside firm to identify potential successors and considering an interim CEO while it searched for a permanent replacement.\nWhat has Huang said?\nHuang acknowledged in a note to employees that he had been unfaithful to his wife. He did not publicly name the woman. The New York Times identified her as Alice H., a former executive at Singapore-based data center company Megaspeed who is not related to him. Beijing rejected the espionage allegation.\nShareholders sued Nvidia and Huang on Monday in a proposed class action, accusing them of concealing the alleged relationship and the risks it posed to the company.\nWhat do we know about the second alleged affair?\nThe New York Times identified the Nvidia executive as Kimberly Powell, the company's vice president of health care. Asked about the relationship, Huang told the newspaper, \"I don't think you should be talking to me directly,\" before ending the call.\nNvidia and Powell did not immediately respond to requests for comment, Reuters reported.", "translation_ja": "", "vocab": []}, {"title_ja": "ミシシッピ州上院選挙：民主党のスコット・コーロム候補が共和党のシンディ・ハイド=スミス議員に勝利", "title_en": "Mississippi Senate race: Democrat Scott Colom defeats Republican Cindy Hyde-Smith", "summary_ja": "民主党のスコット・コーロム候補（43歳）がミシシッピ州の上院選挙で共和党現職議員を僅差で破り、同州初の黒人連邦上院議員となった。投票用紙の集計に1週間以上を要した接戦で、コーロムは4,500票以上のリードで勝利を確定させた。この勝利により、民主党の上院での優位性は55対44に拡大し、2026年の中間選挙における共和党への有権者の反発を示すものとなった。", "summary_en": "The southern US state of Mississippi has elected its first Black senator in more than 140 years. Democrat Scott Colom has won the seat in a historic upset, according to projections.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/mississippi-senate-race-democrat-scott-colom-defeats-republican-cindy-hyde-smith/a-79924938?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Mississippi Senate race: Democrat Scott Colom wins\nNovember 12, 2026\nDemocratic candidate Scott Colom beat Republican Senator Cindy Hyde-Smith in Mississippi's US Senate race after a prolonged ballot-counting process, the Associated Press projected on Wednesday.\nThe narrow victory makes Colom, 43, the state's first Black US senator since post-Civil War Reconstruction and the first new Democratic senator chosen by Mississippi since 1947.\nHow Colom pulled ahead in Mississippi\nDuring the campaign, Colom promised to represent all of Mississippi, a state where racial divisions have long defined its politics and society.\n\"It's got to be about having a party that represents rural America again, suburban America, urban America — a party that makes sure we actually deliver for voters in ways that make their lives better,\" he said.\nThe southern US state of Mississippi has been controlled mostly by white conservatives for generations.\nDemocrats extend their Senate majority\nThe Mississippi victory gives the Democrats a 55-44 advantage in the 100-member Senate. The winner of the Senate race in Alaska remains to be determined. The Democrats also won control of the House of Representatives, having gained 41 seats so far and holding a 254-to-168 advantage, with 13 races yet to be called.\nMississippi election officials have been counting ballots for over a week in a race so close that Colom led by only a few dozen votes at some points. The latest media-tabulated results showed him ahead by more than 4,500 votes, or 0.5 percentage points.\nThe outcome adds to a decisive midterm rebuke of President Donald Trump, whose Republican Party suffered defeats in several states, and it will bolster some Democrats' argument that their future runs through the US South.\nRepublican rival concedes after close count\nHyde-Smith, 67, posted a concession video on social media, and a spokesperson confirmed she had called Colom to concede. Hyde-Smith was first elected in 2018 and consistently led in opinion polls in a state that Trump won by nearly 23 points in 2024.\nThe Democrats' Senate leader, Chuck Schumer, wrote on X, \"Blue Mississippi is here.\"\nHyde-Smith had blocked Colom's nomination by former President Joe Biden to serve as a US District Court judge in northern Mississippi, citing his position on transgender issues. Mississippi's other US senator, Republican Roger Wicker, supported his nomination for the post.\nMississippi does not have a law mandating a recount for a close election.", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアの駐米大使が死亡", "title_en": "Russian Foreign Ministry says its ambassador to US has died", "summary_ja": "ロシア外務省は、モスクワの駐米大使アレクサンドル・ダルチェフ氏が慢性疾患により66歳で死亡したと発表しました。ダルチェフ氏は2025年3月にプーチン大統領に任命され、西側に対する公然の非難で知られていました。外務省報道官は米メディアが死亡に関する陰謀論を広げていると警告しました。", "summary_en": "Russia's Foreign Ministry has said that Alexander Darchiev died from a chronic illness at the age of 66. The long-time diplomat had been in the Washington post since early 2025.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/russian-foreign-ministry-says-its-ambassador-to-us-has-died/a-79924829?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Russian Foreign Ministry says its ambassador to US has died\nNovember 12, 2026\nRussia's Foreign Ministry said Wednesday that Alexander Darchiev, Moscow's ambassador to the US, died from an unspecified chronic illness in Moscow at the age of 66.\nDarchiev was appointed to the post by Russian President Vladimir Putin in March 2025 after Donald Trump returned to the White House and the two countries sought to improve relations. The post had been vacant for six months before his appointment after hardliner Anatoly Antonov was relieved of his duties in October 2024.\nIn a statement, Foreign Ministry spokeswoman Maria Zakharova described Darchiev as \"an outstanding diplomat, experienced leader, good comrade and mentor\" and a brilliant scholar on US history and affairs.\nWhat was Russia's ambassador to US known for?\nZakharova warned against the spread of conspiracy theories surrounding Darchiev's passing, accusing US media outlets of being \"particularly active\" in that regard.\nDarchiev, known for his public denunciations of the West, had previously led the Foreign Ministry's North America and North Atlantic departments and served as ambassador to Canada from 2014 to 2021.\nHe also led Russia's negotiating team during February 2025 Ukraine peace talks with the US in Istanbul, Turkey.\nNo date has been given for his funeral.\nDetails for a memorial service will be announced at a later date, Zakharova said.", "translation_ja": "", "vocab": []}, {"title_ja": "民主党コロム氏、ミシシッピ州上院議席を奪取", "title_en": "Democrat Colom flips Mississippi Senate seat", "summary_ja": "民主党のスコット・コロム氏がミシシッピ州の米国上院議員選挙で勝利することが、AP通信により報じられた。この選挙結果は、共和党支配が強いミシシッピ州において民主党が議席を獲得したことを示している。コロム氏の当選は同州の政治情勢における重要な変化を象徴している。", "summary_en": "Democrat Scott Colom will win the election for U.S. Senate in Mississippi, The Associated Press projects.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/democrat-colom-mississippis-black-senator-100-years-ap/story?id=137984057", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ:ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、ニュースと生放送イベントの24時間体制での報道を提供しています。最新のニュース速報と重要なイベントをリアルタイムでカバーしています。視聴者は常に最新の情報にアクセスできます。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ブルックリンで建物が崩壊、少なくとも2人が死亡、複数人が負傷：市長", "title_en": "At least 2 dead, multiple injured after building collapses in Brooklyn: Mayor", "summary_ja": "ブルックリンで3階建ての建物が隣接する掘削現場に崩壊し、現場にいた作業員が巻き込まれました。FDNYの通信記録によると、少なくとも2人が死亡し、複数人が負傷しています。", "summary_en": "A three-story building collapsed into an adjacent excavation site, where workers were on scene, according to an FDNY dispatch.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/rescue-operations-underway-after-building-collapses-brooklyn-new/story?id=138059620", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ルイス・ハミルトン、エジプトのラファ検問所とガザ支援施設を訪問", "title_en": "Lewis Hamilton visits Egypt’s Rafah crossing and Gaza aid facilities", "summary_ja": "7度のF1世界チャンピオン、ルイス・ハミルトンがエジプトのラファ国境を訪れ、ガザへの人道支援に取り組む団体と面会しました。ハミルトンはこれまでソーシャルメディアでイスラエルの空爆による子どもたちの死亡について投稿し、停戦を呼びかけています。訪問時には赤新月社の物流倉庫を見学し、ガザへの援助物資の流入状況について学びました。", "summary_en": "Seven-time F1 world champion tours border area and logistics warehouses operated by Egyptian Red Crescent Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory. The seven-time Formula One world champion has spoken", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/10/lewis-hamilton-egypt-rafah-crossing-gaza-aid-facilities", "state_media": false, "category": "政治", "full_text": "Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory.\nThe seven-time Formula One world champion has spoken out about conflict and humanitarian crises in the region, and has called for peace. He has frequently posted on social media about children killed in Israeli airstrikes in Gaza and called for a ceasefire.\n“I think we need to make sure we’re pushing to free Congo, free Sudan, free Syria, free Palestine. I think there’s a lot of peace that I’m hoping we get to at some stage,” Hamilton said in October.\nA ceasefire agreement reached last year has halted major combat operations in Gaza, but the amount of aid reaching the territory continues to fall far short of the agreed-upon minimum of 600 trucks a day.\nIsraeli forces have continued to advance, expanding their control from 53% of the territory to at least 60%, an independent commission of UN experts said last month.\nAirstrikes also continue, and Israeli fire along the advancing front has killed at least 196 Palestinians, including 18 women, 32 boys and 11 girls, the commission said.\nHamilton toured Egypt’s Rafah border crossing with Gaza before visiting logistics warehouses operated by the Egyptian Red Crescent, which facilitates the entry of aid to Gaza.\nAt the crossing, Hamilton greeted aid workers with “Assalamu alaikum” a widely used Arabic greeting meaning “peace be upon you.” He shook hands and briefly spoke to workers and officials.\nKhaled Megawer, the governor of North Sinai, where Rafah is located, said the visit was intended to help Hamilton learn about Egypt’s efforts to send aid to Gaza.\nThe visit comes after Hamilton made his 400th race start on Sunday at the São Paulo Grand Prix at Interlagos.\nThe first black F1 driver, he made his debut with McLaren in 2007. He is only the second F1 driver to start 400 races after his former teammate Fernando Alonso, who achieved the milestone in 2024.", "translation_ja": "", "vocab": []}, {"title_ja": "エジプトで列車衝突、少なくとも7人が死亡", "title_en": "Collision of two trains in Egypt kills at least seven", "summary_ja": "エジプトの首都カイロの南約50km離れたギザ県アル・アイヤート地区で、2台の列車が衝突し、少なくとも7人が死亡、125人以上が負傷した。停止していたカイロ・アスワン線列車に、ファイユーム州へ向かう列車が後部から衝突したもので、エジプトの鉄道システムの管理不全と保守不足が問題化している。", "summary_en": "President orders prompt investigation after one train derails in collision in al-Ayyat about 50km from Cairo Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said. The crash occurred in al-Ayyat district in Giza prov", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/08/egypt-two-trains-deadly-collision", "state_media": false, "category": "政治", "full_text": "Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said.\nThe crash occurred in al-Ayyat district in Giza province, about 50km (30 miles) south of Cairo, when a train travelling to Fayoum province crashed into the rear of a train heading to the southern province of Aswan, according to the transport ministry.\nAn inspection indicated that the Cairo-Aswan train had been stationary on the same track, officials said.\nThe health ministry gave the casualty toll, adding more than 70 of the injured were discharged after receiving treatment.\nTrain derailments and crashes are common in Egypt, where the railway system has a history of mismanagement and poor maintenance of equipment. In recent years the government has announced modernisation initiatives to improve its railways.\nAyman Gamal, a resident of Kafr Girza in al-Ayyat where the crash occurred, said people rushed to the scene, pulled out survivors and called ambulances.\nGamal said he saw about 80 of the injured being taken by ambulances to hospital. Some passengers were trapped inside one of the carriages of the stationary train and died, he said.\nEgypt’s president, Abdel Fatah al-Sisi, said in a social media post that he had ordered a prompt investigation.\nOutside al-Wasta central hospital in Beni Suef province, where some of the injured were taken for treatment, survivors said passengers were in shock and struggling to breathe because of all the dust that was kicked up. Nearby villagers eventually got them out, they said.\nFarha Gamal, a survivor who was inside the Fayyoum train, said she saw some of the passengers who appeared dead and others were struggling to find their way out of the car. “There were other cars that were completely mangled,” she said in an interview.\nEmergency teams and cranes were dispatched to the crash site to clear the wreckage and restore train services to their normal schedule as soon as possible, the Egyptian railway authority said.\nLast September, a train driver and his assistant were injured after two freight trains collided in the same district.\nEgypt’s deadliest train crash was in 2002 when more than 300 people were killed after a fire broke out on an overnight train journeying from Cairo to southern Egypt.", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカの哲学がマンチェスターの映画祭の新しいアプローチにインスピレーションを与えた方法", "title_en": "How African philosophies inspired a new approach to staging film festivals in Manchester", "summary_ja": "アフリカ系創作者を支援する「See My World」という映画祭がマンチェスターで11月21日に開催されます。この祭典はケニアの思想家ジョン・ムビティとングギ・ワ・ティオンゴなどのアフリカ哲学にインスピレーションを受けており、過去が現在と未来をどのように形作るかを探求しています。祭典は1945年のパン・アフリカ会議のレガシーを継承し、詩やダンスなどの芸術形式を通じて解放の表現を探索する場として機能します。", "summary_en": "See My World, an event highlighting the pan-African thought via film, poetry and dance, builds on momentum sparked by local activists and creatives African philosophies including exploring how lessons from the past can shape the present and near future have inspired a film festival coming to Manches", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/news/2026/nov/08/african-philosophies-see-my-world-film-festival-manchester", "state_media": false, "category": "社会", "full_text": "African philosophies including exploring how lessons from the past can shape the present and near future have inspired a film festival coming to Manchester.\nSee My World, a day dedicated to independent creators from across the African diaspora in the north of England, will take place at the Contact theatre on 21 November.\nThe festival is part of See My World’s year-round programme showcasing pan-African arts, culture and events.\nIt reflects the determination among creatives and activists in Manchester to build on the legacy of the 1945 Pan-African Congress in Manchester – which connected luminaries of postwar independence movements with a shared vision of liberation – after last year’s 80th anniversary commemorations.\nSee My World’s CEO and artistic director, Tunde Adekoya, said this month’s film festival was taking inspiration from across the spectrum of pan-African thought, including the works of Kenyan writers John Mbiti, an Anglican theologian who died in 2019, and Ngũgĩ wa Thiong’o, the author of the groundbreaking 1986 book Decolonising the Mind who died last year.\nBoth writers rejected the colonial conceit that African thought was inferior, stressed the importance of community and saw reclaiming African ways of knowing as essential to a people’s self-understanding.\nWhile Mbiti sought common ground between African religions and Christianity, Ngũgĩ was a Marxist. He argued colonialism was motivated by cultural and economic conquest, and that European powers used language as their sharpest instrument. Ngũgĩ famously abandoned English to write in Gikuyu, a Bantu language mainly spoken in Kenya and criticised the role missionary Christianity played in colonial rule.\nAdekoya said: “It’s a day dedicated to pan-African and global majority films from the north of England with exclusive premieres of documentaries we’ve been working on, which weave together expressions of liberation through art forms like poetry and dance.\n“The whole idea is that it’s like a playground in search of strategies of liberation, using the festival as a way to explore different philosophies.\n“John Mbiti explores the philosophy and spiritual understandings of time through the concept of Sasa na Zamani – in which the past informs everything that happens moving forward. That reflects how we constantly go back to pan-African histories to inform how we progress.”\nFilm-makers have been invited to submit films lasting up to 30 minutes from across genres, with no screening fees charged.\nAs well as submissions, the festival will feature documentaries produced by See My World. They include Homage, a “cinematic love letter to dance” that traces a culture through present-day portraits illustrating dance artists and archival material from Manchester, telling a story of joy, loss, migration, rhythm and resistance. Meanwhile, Poetic Justice explores how pan-African thought and Manchester’s poetry scene speak across decades.\nAdekoya added: “The idea is that we would go against the norm of how film festivals are, because when we think about decolonisation, we think about how structures have been created to alienate and exclude communities.\n“So we thought our film festival would look more at how we make film accessible and how stories that deserve to be seen get seen. Throughout the day we will have different activities, from exhibitions to explorations of our performances, discussions, Q&As, insights into directors’ processes, and workshops.\n“We’ve been looking for literature and concepts that inform us and give us an understanding of who we truly are. And as works from thinkers like John Mbiti have come into our sphere, they have really emboldened us to think differently about our place in the world and what we do.”\nSee My World film festival runs from 2pm to 11pm on Saturday 21 November at Contact theatre, Oxford Road, Manchester.", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidia CEO の不倫から中国情報機関が学んだ可能性のあることは？", "title_en": "What could Chinese intelligence have learned from Nvidia CEO’s affair?", "summary_ja": "Nvidia の Jensen Huang CEO が、中国情報機関に雇用されていると指摘されている女性との不倫関係を認め、米国の議員らが国家安全保障の侵害の可能性について調査を要求しています。当局は、この女性が Huang CEO に接近し、中国への半導体販売制限の緩和を促すよう影響を与えることを目的にしていた可能性があると考えています。Nvidia は国家安全保障やその機密情報が侵害されたという理由を信じていないと述べていますが、専門家らはこの関係を通じてどのような機密情報が露出した可能性があるかについて懸念を表明しています。", "summary_en": "Nvidia says no secrets were compromised, but experts question what sensitive information may have been exposed.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/12/what-could-chinese-intelligence-have-learned-from-nvidia-ceos-affair?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "What could Chinese intelligence have learned from Nvidia CEO’s affair?\nNvidia says no secrets were compromised, but experts question what sensitive information may have been exposed.\nUnited States lawmakers are pushing for answers from Nvidia CEO Jensen Huang amid growing concerns over whether an affair he had compromised national security.\nHuang, 63, has admitted to having extramarital relations during his time leading Nvidia, a major US tech firm. Media reports indicate the woman involved was Alice Huang, a former executive at Singapore-based tech company Megaspeed who is accused of working for Chinese intelligence.\nAs the scandal continues to grip Washington, Republican leaders of three committees in the House of Representatives have asked Huang to appear at a closed-door briefing to testify about the relationship.\nHouse Foreign Affairs Committee Chair Brian Mast said he was prepared to subpoena Huang if he did not respond by the end of Wednesday.\nAccording to The New York Times, US intelligence officials believe Alice Huang was recruited by Chinese intelligence to gather information about the Nvidia CEO and influence him to push for looser restrictions on chip sales to China.\nIn a statement on Sunday, Jensen Huang apologised to his family and Nvidia employees about the affair.\nHis company also launched an independent investigation, saying it had no reason to believe that “either national security or NVIDIA secrets were compromised”. Still, by Wednesday, media reports emerged that Nvidia was preparing to part ways with Huang over the controversy.\nUS President Donald Trump confirmed on Monday that the Federal Bureau of Investigation was looking into the matter, but he has stood by Huang, calling him an “honourable guy”.\nBut the pressure on Huang intensified on Tuesday when Republican Senator Kevin Cramer called for him to resign.\n“The potential for extortion is so tremendous that something as sensitive as Nvidia chips, I just think he’s got to go,” Cramer said in an interview with Politico.\nBut Huang, who co-founded Nvidia more than 30 years ago, has shown no signs of heeding that call.\nDespite the company’s assurances, experts say the affair raises concerns about what information Alice Huang may have been privy to and what role the relationship may have played in the Nvidia CEO’s decisions.\nWhat are the national security concerns surrounding Nvidia?\nNvidia’s advanced chips, which power much of today’s artificial intelligence, have put the company at the centre of the race for tech dominance between China and the US.\nSince 2022, Washington has restricted sales of some of the most advanced chips to China over concerns that they could be used by the country’s military or intelligence agencies.\nAccording to US intelligence officials cited by The New York Times, Alice Huang was tasked with getting Jensen Huang to lobby for looser restrictions on chip exports.\nThe Nvidia CEO had already been pushing for an easing of the rules, arguing that China’s domestic chip industry would get stronger without better access to US products.\nBut some experts say it is worth looking at how Alice Huang may have influenced decisions Nvidia made specifically about her former employer Megaspeed, which bought more than $4.8bn worth of Nvidia chips over the span of about two years.\nMegaspeed has also been investigated over allegations that it helped Chinese companies get access to restricted chips. Megaspeed denies the allegation.\nRyan Fedasiuk, a fellow at the Foundation for American Innovation who studies Chinese technology and intelligence activities, pointed to reports from Bloomberg and The New York Times that Nvidia contacted the US Commerce Department about its investigation into Megaspeed.\nHe also noted that, in disclosures to the government, Nvidia appeared to vastly undercount the value of the chips it sold to the company.\n“The question at hand is whether Nvidia took specific actions with respect to Megaspeed that it might not otherwise have done,” Fedasiuk told Al Jazeera, “possibly as a result of the personal relationship between the two executives.”\nWhat sensitive information could have been a risk?\nThere are also questions about what sensitive information Alice Huang may have had access to through her relationship with Jensen Huang.\nIn an analysis published by the Council on Foreign Relations, a think tank, senior fellow Jessica Brandt pointed to information about how Nvidia designs its China-specific chips.\n“Information about its conversations with policymakers could be helpful for anticipating where those controls and other policies are headed,” she said. “Understanding where it disagrees with government could expose fault lines to exploit. And that’s before we get into anything touching R&D [research and development].”\nFedasiuk raised similar concerns about what Alice Huang could have learned about Nvidia’s internal operations and plans for future products, as well as its customer base, which includes American and f", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルがガザのナセル病院の集中治療室を攻撃", "title_en": "Israel strikes intensive care at Gaza’s Nasser Hospital", "summary_ja": "ガザの民間防衛当局によると、イスラエルによるナセル病院への攻撃で少なくとも6人が殺害されました。カーン・ユーニスでの攻撃により、スタッフを含む少なくとも20人が負傷しました。", "summary_en": "Gaza&#039;s Civil Defence says an Israeli strike on Nasser Hospital has killed at least six people.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/12/israel-strikes-intensive-care-at-gazas-nasser-hospital?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Israel strikes intensive care at Gaza’s Nasser Hospital\nNewsFeed\nIsrael strikes intensive care at Gaza’s Nasser Hospital\nGaza’s Civil Defence says an Israeli strike on Nasser Hospital has killed at least six people. The strike in Khan Younis also injured at least 20 other people, including staff.\nPublished On 12 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "イタリア極左赤い旅団の元メンバー、アルゼンチンの自宅軟禁から脱獄", "title_en": "Former Italian Red Brigades member escapes house arrest in Argentina", "summary_ja": "イタリアの極左武装組織「赤い旅団」の元メンバー、74歳のレオナルド・ベルトゥラッツィがアルゼンチンで自宅軟禁中に5階のアパートからハーネスとロープを使って脱出した。イタリアの元首相アルド・モーロの誘拐と殺害に関与した罪で27年の懲役刑に直面しており、ミレイ大統領の右翼政権下でアルゼンチンの難民ステータスが取り消された。当局は全国規模での捜索を展開しており、彼の身柄確保に関する情報に対して2,000万ペソ（約13,000ドル）の報奨金が提供されている。", "summary_en": "Bertulazzi used a rope and harness to climb down from a fifth-floor apartment and evade authorities in Argentina.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/12/former-italian-red-brigades-member-escapes-house-arrest-in-argentina?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Former Italian Red Brigades member escapes house arrest in Argentina\nBertulazzi used a rope and harness to climb down from a fifth-floor apartment and evade authorities in Argentina.\nA 74-year-old former member of Italy’s far-left Red Brigades has escaped from house arrest in Argentina by climbing down from a fifth-floor apartment using a harness and rope, prompting a nationwide search.\nLeonardo Bertulazzi, who faces extradition to Italy to serve a 27-year prison sentence, escaped on Tuesday and was still on the run on Wednesday, Argentine police officials told The Associated Press news agency.\nBertulazzi was convicted in absentia by a court in his home country for his role in the kidnapping and death of a former Italian prime minister by the left-wing armed group, and his refugee status in Argentina was revoked under right-wing President Javier Milei.\nPolice said he descended onto the second-floor terrace of a neighbouring house, climbed down to a first-floor terrace, crossed a vacant lot and got onto the street by climbing over a gate.\nAuthorities did not immediately notice Bertulazzi was gone as he had tampered with his electronic ankle monitor, the officials said. They said he placed it inside a device containing a thermal blanket to maintain its temperature, along with grease or animal fat, apparently to keep moisture in.\nExplosives specialists examined the device, which had been made to resemble an explosive.\nArgentina’s Security Ministry has offered a reward of 20 million pesos (about $13,000) for information leading to his capture.\n‘Years of Lead’\nThe Red Brigades were a far-left armed group responsible for a wave of kidnappings and killings in Italy in the 1970s and 1980s, a period known as the “Years of Lead”.\nThe group kidnapped and killed former Prime Minister Aldo Moro in 1978. Argentine authorities have said Bertulazzi, who belonged to the group’s Genoa branch, was involved in the logistics of Moro’s kidnapping.\nItalian courts convicted him in the 1980s of “terrorism-related” crimes, resulting in a combined 27-year sentence, according to Argentine court records.\nHe was first arrested in Buenos Aires in November 2002, but an Argentine judge rejected Italy’s extradition request in 2003 because Italian law did not guarantee him a new trial after a conviction in absentia. He was granted refugee status in 2004.\nArgentina revoked it in 2024, under Milei, and re-arrested him that August. Its Supreme Court approved his extradition last year.\nWanda Ferro, an undersecretary in Italy’s Interior Ministry, said Argentine police were responsible for ensuring he was handed over. “I am certain that every effort will be made,” she told local television, adding that she hoped the extradition could take place “very quickly” if Bertulazzi is recaptured.", "translation_ja": "", "vocab": []}, {"title_ja": "ミシシッピ州が民主党のスコット・コロム氏を初の黒人上院議員に選出、再建期以来の歴史的快挙", "title_en": "Mississippi elects Democrat Scott Colom as state's first Black U.S. senator since Reconstruction", "summary_ja": "民主党候補スコット・コロム氏が共和党の現職議員シンディ・ハイド=スミス氏に勝利し、ミシシッピ州の初の黒人連邦上院議員となりました。再建期以来初めてのこの歴史的勝利は、世代にわたって白人保守派に支配されてきた同州に大きな変化をもたらし、トランプ前大統領への有権者の反発が強まっていることを示しています。43歳の地元検察官であるコロム氏は、州の大きな黒人人口と経済への不満を背景に、ハイド=スミス氏の再選を阻止しました。", "summary_en": "Former President Bill Clinton and former Vice-President Kamala Harris campaigned on Scott Colom's behalf in the campaign's closing weeks", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/mississippi-elects-democrat-scott-colom-as-states-first-black-us-senator-since-reconstruction/article71692151.ece", "state_media": false, "category": "政治", "full_text": "Democratic nominee Scott Colom has defeated Republican Senator Cindy Hyde-Smith in Mississippi's closely contested U.S. Senate race after a prolonged ballot-counting process, giving the state its first Black U.S. senator since post-Civil War Reconstruction.\nMr. Colom's narrow victory is a seismic shift in Mississippi, which has been controlled mostly by white conservatives for generations, and it yielded immediate echoes around the country. The outcome adds to a decisive midterm rebuke of President Donald Trump, whose party suffered defeats in several Republican-controlled states, and it will bolster some Democrats' argument that their future runs through the American South.\nThe Associated Press called the contest Wednesday (November 11, 2026) in Mr. Colom's favour after local election officials spent several days processing absentee and provisional ballots, called affidavit ballots in Mississippi.\n“While this is not the outcome we worked for or hoped for, I respect the decision of Mississippi voters,” Ms. Hyde-Smith said in a two-minute concession speech posted online. “I want to congratulate Scott Colom and wish him well as he takes on the tremendous responsibility of representing our great state.”\nA spokesman for the Senator said she called Mr. Colom to congratulate him and concede before the video was shared publicly.\nThe last time Mississippi chose a new Democratic Senator was 1947, and the winner then was a staunch segregationist. Mr. Colom, a 43-year-old local prosecutor, capitalised on the state's large Black population, discontent with the economy and Ms. Hyde-Smith's missteps as she sought a second full term.\n“They actually deserve a Senator that will listen to them, that actually cares about what they think, actually cares about what they're going through,” Mr. Colom said in the campaign's closing stretch.\nMr. Colom said during the campaign that he could represent all of Mississippi, a state where racial divisions have long defined its politics and society.\n“It's got to be about having a party that represents rural America again, suburban America, urban America — a party that makes sure we actually deliver for voters in ways that make their lives better,” he said.\nNational Democrats celebrate along with Colom\nParty leaders hailed the senator-elect's triumph, with nods to the South's emerging battleground status after other upset victories from North Carolina to Texas.\n“Scott Colom is the only person who could've gotten this done,” Democratic Senate leader Chuck Schumer of New York posted online. “Along with his staff and volunteers, Scott ran the campaign of a lifetime and re-imagined what's possible for Democrats in the South.”\nFormer President Bill Clinton, a native Arkansan who campaigned with Mr. Colom days before the election, addressed Mr. Colom on social media, saying he won “because you believe in the promise of your state's people. And they believed in you right back. I'm honoured to have stood alongside you.”\nA race Washington once viewed as a long shot\nDespite Mr. Schumer's support, the contest was a latecomer to the national spotlight, drawing attention from Democrats who belatedly infused cash into Colom's candidacy well after Black senators, including Georgia's Raphael Warnock and Maryland's Angela Alsobrooks, urged donors and party leaders to see the contest as winnable.\nThe son of a one-time Republican who worked for President Ronald Reagan, Mr. Colom garnered attention for his aggressive campaign as Democrats widened the Senate battleground map and Ms. Hyde-Smith's vulnerabilities crystallised.\nMr. Colom attracted particular notice for some of the year's most widely circulated ads. After Ms. Hyde-Smith, 67, seemed to brush off high beef prices by saying consumers could choose other proteins, Mr. Colom cut a 30-second spot depicting incredulous voters saying they'd “pick another senator instead.”\nWhen Mr. Trump came to Corinth, Mississippi, in late October for a rally with Ms. Hyde-Smith, Mr. Colom walked the line of Mr. Trump supporters as they waited outside the gates. He introduced himself, asked about their concerns and explained his priorities.\nLater that evening, when Mr. Trump called Ms. Hyde-Smith to the stage, she said nine words in six seconds: “Is this not the best President in our lifetime?”\nThen she stepped away.\n“I love that,” Mr. Trump replied when he continued his 80-plus minutes at the microphone. “Sometimes they get up and they talk for 10 minutes.”\nThe appearance tracked Mr. Colom's tactic of criticising Mr. Trump's policies — especially the Iran war and tariffs that he said were especially hard on Mississippi farmers — without taking personal jabs at the President or people who voted for him. Instead, he consistently put the onus on Ms. Hyde-Smith, framing her as a nonentity in Washington — a critique that resonated in a state that has been accustomed to long-serving senators like Thad Cochran, Trent Lott and John Stennis, who all rose to powerful posts and rou", "translation_ja": "", "vocab": []}, {"title_ja": "ジェンセン・ファンとは誰か：スパイ疑惑タイムラインの展開", "title_en": "Who is Jensen Huang and how the timeline of spy scandal unfolded", "summary_ja": "Nvidiaのジェンセン・ファンCEOと同社は、中国情報機関と関連があるとされるアリス・ファンとの関係を開示しなかったとして株主から集団訴訟を起こされている。2026年11月9日にカリフォルニア州サンノゼの米連邦裁判所に提出された訴状では、この関係と国家安全保障上の懸念の隠蔽が会社の評判とビジネスリスクにさらされたと主張している。台湾生まれの63歳のファンは30年以上にわたってNvidiaを率い、同社を世界で最も影響力のあるテクノロジー企業に変えてきた。", "summary_en": "Nvidia CEO Jensen Huang admitted to being unfaithful to his wife but did not disclose details about the alleged relationship with Chinese executive Alice Huang.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/who-is-nvidia-ceo-jensen-huang-what-we-know-about-alleged-chinese-spy-scandal/article71689414.ece", "state_media": false, "category": "社会", "full_text": "Nvidia and its chief executive, Jensen Huang, are facing a proposed class-action lawsuit that accuses them of misleading shareholders by failing to disclose Mr. Huang’s alleged relationship with Alice Huang, who has been linked to Chinese intelligence.\nThe complaint, filed in a U.S. federal court in San Jose, California, on November 9, 2026, alleges that Nvidia and Mr. Huang concealed the relationship and the national security concerns surrounding it. Shareholders contend that the alleged omission exposed the company to reputational and business risks.\nWho is Jensen Huang?\nSixty-three-year-old Taiwan-born Mr. Huang has led U.S. chipmaker Nvidia for more than three decades, transforming it into what is arguably the world’s most influential technology company. He is now at the centre of a controversy stemming from his alleged relationship with Ms. Alice Huang, a former executive at Singapore-based firm Megaspeed and an alleged Chinese spy.\nMr. Huang was born on February 17, 1963, in Taiwan, the second son of a chemical engineer and a schoolteacher. In 1968, his family moved to Thailand before relocating to the United States amid the Vietnam War, according to Graphics News. He graduated in electrical engineering from Oregon State University and later obtained a master’s degree from Stanford University, according to his Linkedin profile.\nJensen Huang timeline (according to Graphics News)\n- February 17, 1963: Jensen Huang is born in Taiwan, the second son of a chemical engineer and a schoolteacher.\n- 1968: His family moves to Thailand before relocating to the United States during the Vietnam War.\n- 1970s: He spends part of his childhood at a boarding school in Kentucky before moving to Oregon, where he develops an interest in computing.\n- 1984: Graduates with a degree in electrical engineering from Oregon State University.\n- 1984-1992: Completes a master’s degree at Stanford University.\n- 1993: Co-founds Nvidia with Chris Malachowsky and Curtis Priem. He becomes chief executive officer as the company enters the computer gaming market with an initial capital of $40,000.\n- 1999: Nvidia goes public. The launch of the GeForce 256, promoted as the world’s first GPU, establishes the company as a major force in the technology industry.\n- 2006: Under Mr. Huang’s leadership, Nvidia introduces CUDA technology, enabling graphics processors to handle complex computing tasks beyond gaming and helping lay the groundwork for the AI revolution.\n- 2022: The launch of ChatGPT triggers a sharp rise in demand for advanced AI processors.\n- 2024: The boom in generative AI drives Nvidia’s rapid expansion, with Mr. Huang’s net worth surpassing $100 billion.\nSpy scandal timeline\n- 2024-2025: Jensen Huang and Alice Huang are reportedly seen together at several industry events in Taipei.\n- 2026: U.S. Secretary of State Marco Rubio sends a memo warning Trump administration officials about the Nvidia chief executive’s relationship with Alice Huang.\n- October 29, 2026: The New York Times reports that U.S. authorities investigated Alice Huang over suspicions that she passed intelligence to Beijing and helped circumvent U.S. restrictions on advanced AI chips.\n- November 5, 2026: Senior U.S. lawmakers seek a closed-door briefing from Jensen Huang over potential national security concerns.\n- November 8, 2026: Mr. Huang admits he was “unfaithful” to his wife. Nvidia announces an independent investigation into the espionage allegations.\n- November 9, 2026: Nvidia shares fall by more than 4%. U.S. President Donald Trump says the FBI is investigating the controversy involving Mr. Huang and Alice Huang.\nThe Jensen-Alice saga\nMr. Huang admitted to being unfaithful to his wife but did not disclose details about the alleged relationship with Ms. Alice Huang. The Nvidia chief executive said he was “deeply sorry” for the affair. “I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did,” he said in a statement posted on Nvidia’s website.\nThe New York Times reported that Ms. Alice Huang is a Chinese citizen allegedly recruited by Beijing to gather intelligence on Mr. Huang.\nMr. Huang also sent a message to Nvidia employees on November 8, 2026, acknowledging the affair and apologising to both his family and company staff. While expressing regret for his actions, he did not address allegations that Alice Huang was a suspected spy.\nThe Times reported last month that U.S. intelligence agencies had concluded that Mr. Huang had developed a close relationship with Alice Huang, a Chinese citizen and chip buyer, and alleged that she was providing information directly to Beijing.\nNvidia announced a probe into the matter on November 8, 2026. Independent directors have engaged external legal counsel to examine the circumstances surrounding the relationship. Nvidia’s board said it had “no reason to believe” that either national security or Nvidia’s proprietary information had been compromised, and that Mr. Huang would remain ", "translation_ja": "", "vocab": []}, {"title_ja": "エヌビディアがCEOジェンソン・ファン会長兼CEO解任を準備中：米メディア報道", "title_en": "Nvidia preparing to oust CEO Jensen Huang: U.S. media", "summary_ja": "チップ大手エヌビディアの取締役会が、共同創業者兼CEO のジェンソン・ファン氏の解任を準備しているとU.S.メディアが11月11日に報道した。ファン氏は中国のスパイ容疑者との不倫関係に加え、同社の医療担当副社長との第二の不倫疑惑が新たに発覚している。取締役会は同日中に会議を開く予定で、U.S.情報機関は春にファン氏と関係のあるアリス・ファン氏が中国国家安全保障局の資産である可能性を示唆する覚書を回覧していた。", "summary_en": "The New York Times reported that Jensen Huang was also involved in a second extramarital affair, with Nvidia's vice-president of health care, Kimberly Powell", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nvidia-preparing-to-oust-ceo-jensen-huang-us-media/article71692138.ece", "state_media": false, "category": "政治", "full_text": "Nvidia's board is preparing to oust its co-founder and CEO, Jensen Huang, U.S. media reported Wednesday (November 11, 2026), as the chip giant's chief faces new accusations of infidelity, after revelations he had an affair with a woman accused of spying for China.\nThe tech company's board was preparing to meet as soon as Wednesday (November 11, 2026) to determine Huang's future, according to the Wall Street Journal, which quoted people familiar with the matter.\nThe New York Times reported on Wednesday (November 11, 2026) that Mr. Huang was also involved in a second extramarital affair, with a subordinate, saying there was video evidence of the 63-year-old executive being affectionate with Nvidia's vice-president of health care, Kimberly Powell.\nMs. Powell, 48, has been a public face of Nvidia's efforts to expand the chip technology into higher education and health care, and was speaking at a San Jose, California conference where they \"were seen being affectionate at the hotel\" by bystanders, the Times reported.\nThe report of the second affair follows Ms. Huang's acknowledgement of a relationship with Alice Huang, a senior executive at Singapore-based data centre company Megaspeed. The Wall Street Journal reported that the two were photographed together in Taipei in 2024 and 2025.\nU.S. intelligence reportedly circulated a memo this past spring alleging Alice Huang was an asset of China's Ministry of State Security.\nThe Nvidia CEO admitted to having had a relationship with Ms. Huang -- to whom he bears no familial relation -- in a note to Nvidia employees Sunday (November 8, 2026) , writing: \"I was unfaithful to my wife.\"\nThe same day, Nvidia's board of directors said in a statement that they'd launched \"an independent investigation in light of recent reporting that founder and CEO Jensen Huang has been the target of a foreign intelligence effort.\"\n\"I support the investigation and will cooperate fully. I love our country and our company,\" Ms. Huang wrote in his statement. The Times reported that Congress has also called on him to provide a closed-door briefing on his interactions with Alice Huang.\nAs the surge in the artificial intelligence industry has driven Nvidia's stock to new heights, Mr Huang has appeared alongside U.S. President Donald Trump at White House events, most recently last month, when he accepted a National Medal of Science from the Republican leader.\nMr. Huang was among the world's most influential tech leaders -- including Elon Musk, Jeff Bezos and Mark Zuckerberg -- who vowed to self-regulate AI against possible threats, as Mr. Trump rejected calls for government oversight and dismissed warnings the technology could wipe out humanity.\nNvidia shareholders filed a class action lawsuit against Mr. Huang and the AI chip maker for failing to disclose information about the relationship to investors.\nNvidia shares have plummeted in recent days since Mr. Huang admitted to the affair.\nNvidia designs advanced components created to handle 3D visuals in video games, called Graphics Processing Units (GPUs).\nNvidia's processors are mostly made by the Taiwanese company TSMC, the world's largest contract manufacturer of chips.\nPublished - November 12, 2026 06:56 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "米国検察：カナダ人Ryan Weddingがメキシコ麻薬カルテル幹部向けの月額10万ドルの会員サービスに加入", "title_en": "Ryan Wedding joined a $100,000 monthly subscription service for Mexican cartel leaders: U.S. prosecutors - Toronto Star", "summary_ja": "米国検察当局は、カナダ人のRyan Weddingがメキシコの麻薬カルテル指導者向けの高額な月額購読サービスに加入していたと主張している。このサービスは月額10万ドル
