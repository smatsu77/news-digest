lment of his administration’s commitment to judicial welfare and the creation of an enabling environment for the effective administration of justice.\n“As our administration approaches the conclusion of its tenure, we will continue to motivate and support the judiciary and provide for the welfare and well-being of our judges, who have signed up for this service to humanity, within our constitutional responsibilities,” he said.\nThe governor described the judiciary as the last hope of the common man, charging the newly sworn-in judges to uphold the highest standards of integrity, impartiality and professionalism in the discharge of their responsibilities.\nHe urged them to dispense justice without fear or favour, carefully evaluate evidence, apply the law faithfully and ensure that their courts remained accessible institutions where the rights of every citizen were protected.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe also cautioned the judges against political interference, personal relationships and material inducement, stressing that neither public opinion nor the prominence of any individual or political party should influence judicial decisions.\nIn furtherance of his administration’s commitment to judicial infrastructure, Abiodun disclosed that construction had commenced on the Abeokuta Division of the Court of Appeal complex on a 2.6-hectare site adjoining the State Judiciary Complex at Kobape.\nHe listed other interventions to include the completion of six duplexes at Ibara Housing GRA, Abeokuta, for judicial officers, as well as 20 bungalows at Prince Court Estate, Kobape, for supporting personnel.\nThe governor noted that the appointment of the five judges reflected his administration’s determination to strengthen the state’s judicial capacity, adding that more judges had been appointed under his watch than during previous administrations in the state.\nHe particularly commended the Chief Judge for the appointments, expressing optimism that the emergence of a younger generation of judicial officers would provide continuity, renewed energy and long-term institutional development for the judiciary.\nAbiodun also reaffirmed his administration’s commitment to institutional cooperation and respect for the constitutional principle of separation of powers.\nHe highlighted the state judiciary’s adoption of an electronic affidavit platform as another significant step towards improving access to justice and service delivery.\nAccording to him, the digital platform has facilitated the processing of more than 31,000 affidavits, with approximately 4,500 users and 25 agents operating across the state.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ムバー知事がヌスッカ・アダニ道路に緊急事態を宣言、月末までに工事開始を約束", "title_en": "Mbah declares emergency on Nsukka-Adani road, tours Uzo Uwani", "summary_ja": "ナイジェリア・エヌグ州のピーター・ムバー知事は、ヌスッカ・アダニ道路を重要な経済回廊と位置付け、緊急事態を宣言し、月末までに工事を開始することを約束しました。知事は同州の教育セクターを改革するためのスマートグリーンスクール計画も紹介し、2027年の知事選に向けた政策の実現を強調しました。", "summary_en": "The governor described the road as a critical economic corridor and promised to commence work on it before the end of the month. The post Mbah declares emergency on Nsukka-Adani road, tours Uzo Uwani appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/924575-mbah-declares-emergency-on-nsukka-adani-road-tours-uzo-uwani.html", "state_media": false, "category": "経済", "full_text": "Governor Peter Mbah of Enugu State has declared an emergency on the Nsukka-Adani Road, describing it as a critical economic corridor and promising to commence work on it before the end of the month.\nMbah also said that with the rains receding, his administration would commence the construction of the Edem-Nrobo-Abbi-Nimbo Road in earnest.\nThis was even as he took a swipe at his opponents in the 2027 governorship race, accusing them of wasting precious time in Abuja shopping for shortcuts and ways to compromise the polls rather than face the people of Enugu to canvass programmes that would benefit the state.\nHe spoke at Adani and Ugbene Ajima during a campaign tour of Ogboli and Igbo-Ano Development Centres in Uzo Uwani Local Government Area of the state on Tuesday.\nOn the Nsukka-Adani Road, Mbah said, “We have committed to doing the Nsukka-Adani Road. But I think that that road is now a matter of utmost urgency. We cannot wait for another season. We are sending contractors immediately to that road. We are going to fix that road. So, before the end of this month, we are going to move contractors there,” he pledged.\nThe Governor, while thanking the people for voting for him in the 2023 governorship election, expressed happiness that the issue of insecurity in the area had been well addressed.\nHe said the Smart Schools initiative would introduce the children of Enugu State to contemporary skills and prepare them for the present and future global economy.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“We also recognised that there was a crisis in our education sector. So, we set about to build Smart Green Schools because we felt that the world is moving very fast. And we didn’t want our children to be left behind. And we knew that the skills that the kids need today are different from the skills we were exposed to 30, 40 years ago.\n“Today, our children need technology to be able to work and to create wealth. So, in this Development Centre, we have four Smart Green Schools and four Type 2 Primary Healthcare Centres already built and standing in each ward,” he stated.\nMeanwhile, Mbah recalled that his opponents were yet to present any manifesto because they had nothing to offer, adding that they only specialised in multiple certificate forgery.\n“In fact, they cannot even come here. You know where they are? They are somewhere in Abuja, busy looking for an alternative instead of coming to know you or even talk to you.\n“They think that there is a shortcut. So, rather than come and face the people, talk to them about their records and maybe even tell them about their plans, they go about shopping for alternatives to the Lion Building.\n“They are unable to face you because, one, they don’t have any record. Two, they don’t have any plans.\n“So, their only option is to see whether there are ways they can manipulate your votes or your mandate. But are you going to accept that? Do you have your broom? You must sweep them away and tell them you do not have room for them.\n“As I said, we are dealing with people without records because they cannot point to anything they have done in life. Not one. They cannot.\n“If they want to be honest, they can tell you about certificate forgery. And if you need experts in that area, you probably need to consult them. But we do not want to expose our kids to such people. We want people with genuine records; people who have worked and created wealth before offering themselves for service. Not people without records and without plans.\n“They cannot come out and tell you this is the plan they have for you in your education sector, in your healthcare sector, in your agriculture sector or in the economic sector. Nothing. So, use your brooms, your votes to sweep them away,” he stated.\nThe Governor also made a stopover at Our Lady Health of the Sick Maternity Hospital (Arụ Ike Ndi Ọya), Adani, where he cleared all the medical bills of patients, running into millions, and also promised to equip the facility to the standard of the state’s Type 2 Primary Healthcare Centre, in addition to providing ultrasound equipment.\nIn their speeches, Deputy Governor of Enugu State, Barr. Ifeanyi Ossai; Senator Ikeje Asogwa; Council Chairman of Uzo Uwani, Barr. Chijioke Ezegwu; Director General of the All Progressives Congress (APC), Enugu, Campaign Council, Chief Charlie Mbah; Nollywood star, Rachael Okonkwo (Nkoli Nwa Nsukka), among others, commended the Governor for the tremendous development recorded in the state under his leadership, promising to support the, APC from top to bottom.\nThey acknowledged that the development challenges he inherited could be solved in three years and a few months, noting that the important thing was that he was delivering on his campaign promises at great speed.\nOther stalwarts present include Senator Chukwuka; Deputy DG of Enugu APC Campaign Council, Dr. Dan Shere; H", "translation_ja": "", "vocab": []}, {"title_ja": "アウジャレ: オグン州が後継者危機を明かし、適正手続きの重要性を主張", "title_en": "Awujale: Ogun reveals Fusengbuwa crisis, insists on due process", "summary_ja": "オグン州政府は、アウジャレの王位継承プロセスの処理について弁明し、フセングブワ統治家内の内部危機への介入を明かしました。政府は、次の君主の選出は厳格な適正手続きに従わなければならないと強調し、メディア攻撃と偽情報キャンペーンを後援している個人・団体に対して警告を発しました。オグン州司法長官は、政府の介入は王位継承プロセスを秩序立て、透明性を持ち、法的に受け入れ可能な方法で実施するためのものであると述べました。", "summary_en": "The government also warned individuals and groups allegedly sponsoring media attacks and spreading disinformation to pressure it over the succession process to desist or face the full weight of the law The post Awujale: Ogun reveals Fusengbuwa crisis, insists on due process appeared first on Premium", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/924573-awujale-ogun-reveals-fusengbuwa-crisis-insists-on-due-process.html", "state_media": false, "category": "政治", "full_text": "The Ogun State Government has defended its handling of the succession process to the Awujale stool, revealing how it intervened in the internal crisis within the Fusengbuwa Ruling House and insisting that the emergence of the next monarch must strictly follow due process.\nThe government also warned individuals and groups allegedly sponsoring media attacks and spreading disinformation to pressure it over the succession process to desist or face the full weight of the law.\nThe State Attorney-General and Commissioner for Justice, Mr Oluwasina Ogungbade, stated this in a statement on Wednesday, stressing that the government had acted with fairness, restraint and in accordance with the Awujale Chieftaincy Declaration and the Obas and Chiefs Law of Ogun State, 2021.\nHe explained that following the demise of the late Awujale, Oba Sikiru Adetona, the government had consistently recognised the Fusengbuwa Ruling House’s entitlement to produce the next occupant of the revered traditional stool.\nOgungbade, however, disclosed that the government had to intervene when it discovered that the ruling house was operating under three different family heads, with nomination forms reportedly being sold for as much as ₦10 million.\nHe recalled that at a meeting with the family on 6 November 2025, the government advised it to resolve its internal leadership disagreements, operate under one recognised family head and discontinue the collection of nomination fees.\nAccording to him, the intervention yielded positive results, as the family subsequently agreed to operate as one united ruling house, abolish candidature fees, refund payments already made by aspirants and expressed appreciation to the government.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe maintained that the government’s intervention was not intended to deprive the Fusengbuwa family of its entitlement but to ensure that the succession process was conducted in an orderly, transparent and legally acceptable manner.\nThe Attorney-General explained that while the government respected the traditional succession process, it also had statutory responsibilities in the appointment and installation of traditional rulers, including the authority to reject a nominated candidate where the interest of good governance so demands.\nHe described recent media publications accusing the government of interference and bias as misleading, alleging that some were sponsored to create public hostility and exert undue pressure on the government.\nOgungbade distinguished legitimate criticism and advocacy from what he described as media blackmail and deliberate disinformation, warning that the government would not allow such activities to undermine its lawful responsibilities.\nCiting Section 61 of the Criminal Law of Ogun State, he noted that unlawful acts calculated to interfere with the free exercise of a governor’s official duties could attract a three-year jail term.\nHe consequently cautioned publishers and individuals involved in the dissemination of misleading reports designed to interfere with the succession process, warning that the government would not hesitate to pursue appropriate legal remedies if the alleged activities persisted.\nThe government reaffirmed its commitment to ensuring that the emergence of the next Awujale reflects the provisions of the law, the established traditional institutions of Ijebuland and the principles of fairness and due process.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "米国のイラン経済制裁強化、隣国の抵抗で難航", "title_en": "U.S. Efforts to Tighten Blockade of Iran Rely on Reluctant Neighbors", "summary_ja": "ワシントンはイランへの経済的圧力を強める為に陸地国境の封鎖を強化しようとしている。しかし隣接する諸国は経済的悪影響を懸念し、これに対抗している。米国の戦略実行には地域の協力が不可欠となっている。", "summary_en": "Washington wants to intensify its economic pressure campaign on Iran by closing its land borders. Neighboring states, fearing economic fallout, are pushing back.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/11/world/middleeast/us-blockade-iran-taskforce-iron-gate.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab falls for 34th consecutive month - Focus Taiwan", "summary_ja": "台湾の人口減少が34ヶ月連続で続いている。低い出生率と高い海外移住率が主な要因とされている。人口動態の悪化は台湾の経済成長と社会保障制度に深刻な影響を及ぼしている。", "summary_en": "Taiwan population falls for 34th consecutive month Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9hNWd1R0JSZHhtN29tdmlZbnZ2SzdOczUwLXVVR2dVR1AyRkRHUTVaTThSblMxUEgtaGl5bDQxVlg2QXh3RVRHXzVRTmhRQ19NQ20zb0x3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Anthropic、ウォール街上場を控え強力な新モデルを発表", "title_en": "Anthropic launches powerful new models ahead of Wall Street debut", "summary_ja": "CGTNが報じるところによれば、Anthropicはウォール街への上場を控えて強力な新モデルを発表した。同社はAI技術の開発において重要な進展を遂行している。この発表は企業の市場進出戦略の一環と位置付けられている。", "summary_en": "Anthropic launches powerful new models ahead of Wall Street debut", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-11/Anthropic-launches-powerful-new-models-ahead-of-Wall-Street-debut-1RYF8UNxkGY/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シャポウェイからナイジェリアへ：海洋遺産の継承", "title_en": "From Shapowei to Nigeria: Passing on maritime heritage", "summary_ja": "中国福建省厦門市を訪問しているナイジェリアの環境工学修士課程の学生アキンタヨ・ジュダー・アドゥラグベミ氏は、シャポウェイの海洋歴史に親しみを感じているとCGTNが報じています。同氏は2026年世界海洋ウィークのため厦門を訪れています。", "summary_en": "Shapowei's maritime history strikes a familiar note for Akintayo Judah Aduragbemi. The Nigerian environmental engineering master's student is visiting Xiamen in southeast China's Fujian Province for the 2026 World Ocean Week.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-10/From-Shapowei-to-Nigeria-Passing-on-maritime-heritage-1RXob5b62zu/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "日本の自民党、前首相石破茂に対する懲罰処分を検討", "title_en": "Japan's LDP considers disciplinary action against former PM Ishiba", "summary_ja": "CGTN報道によると、日本の与党・自由民主党は、消費税減税関連の法案採決前に退席した前首相石破茂ら4人の議員に対する懲罰処分を検討しているという。地元メディアが日曜日に報じた。同党は党紀違反の可能性について議論を進めているとされている。", "summary_en": "Japan's ruling Liberal Democratic Party (LDP) is considering disciplinary action against former Prime Minister Shigeru Ishiba and three other lawmakers who walked out before voting on a bill related to consumption tax cuts, local media reported Sunday.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-08/Japan-s-LDP-considers-disciplinary-action-against-former-PM-Ishiba-1RUdhl75UZO/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ前大統領、ヴァンス副大統領のイラン交渉再開努力に異議なし—WSJ報道", "title_en": "Trump does not object to Vance's efforts to resume talks with Iran — WSJ", "summary_ja": "TASS/RTが報じたところによると、米国のヴァンス副大統領は10月にイラン最高安全保障委員会書記のモフセン・レザエイ氏に書簡を送り、会談を提案した。トランプ前大統領はこの交渉再開の試みに対して異議を唱えていないとされている。", "summary_en": "According to the report, in October, the US vice president sent a letter to Iranian Supreme National Security Council Secretary Mohsen Rezaei, proposing a meeting", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2216639", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "欧州諸国はウクライナ問題でロシアの声に耳を傾けない＝ロシア外務省", "title_en": "European countries neither listen to nor hear Russia on Ukraine — Foreign Ministry", "summary_ja": "TASS/RTが報じたところによると、ロシア外務省のキリル・ログヴィノフ部長は、西側諸国がウクライナ問題について「拡声器的な」議論を展開しており、落ち着いた成果重視の外交に従事していないと述べた。ロシアは欧州諸国がロシアの主張に耳を傾けず、建設的な対話を行う意思がないと主張している。", "summary_en": "According to Department Director Kirill Logvinov, Western countries often conduct discussions in a \"megaphone\" manner rather than engage in quiet, results-oriented diplomacy", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2216637", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国と中国、ロシアとの三国間協議の重要性を強調", "title_en": "US, China stress importance of potential trilateral talks with Russia", "summary_ja": "TASS/RTが報じるところによると、マルコ・ルビオ米国務長官と王毅中国外相は、指導者レベルの会談が平和と非核化に対処する必要があると述べた。両国は、ロシアを含む潜在的な三国間対話の重要性を強調している。", "summary_en": "US Secretary of State Marco Rubio and Chinese Foreign Minister Wang Yi stated that the leader-level conversations must address peace and denuclearization", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2216635", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパのAI野心は電力網の容量を超えている", "title_en": "Europe’s AI Dreams Exceed Its Grid", "summary_ja": "ヨーロッパはAIデータセンター容量の拡大を急いでいるが、既に電力網が逼迫しており、地域コミュニティも新規建設に反発している。著者は、ヨーロッパが掲げるAI主権と技術的独立の達成には、派手なスローガンよりも、既存リソースをより効果的に活用する現実的な解決策が必要だと主張している。", "summary_en": "Europe is racing to expand its AI data-center capacity, but its power grids are already strained, and local communities are increasingly pushing back against new construction. Achieving technological sovereignty will require less grandstanding and more practical solutions that make better use of exi", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/europe-must-invest-in-grid-expansion-and-address-public-opposition-to-data-centers-by-sona-muzikarova-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nEurope’s AI Dreams Exceed Its Grid\nEurope is racing to expand its AI data-center capacity, but its power grids are already strained, and local communities are increasingly pushing back against new construction. Achieving technological sovereignty will require less grandstanding and more practical solutions that make better use of existing resources.\nBRATISLAVA—Europe is hallucinating a grand future of AI sovereignty and digital independence. But its power grids are structurally incapable of supporting it.\n        https://prosyn.org/zCu1iA2", "translation_ja": "", "vocab": []}, {"title_ja": "米国中間選挙がAIにもたらす可能性", "title_en": "What the US Midterms Could Mean for AI", "summary_ja": "民主党が米国議会の両院で大多数派を占めることになったため、AI開発を公共の利益に向けて導くための長年待たれていた法制化を推し進める機会が生まれた。著者は、民間企業が一方的に公众が負うべきリスクを決定する権力を持つべきではないと主張している。中間選挙での民主党の圧倒的勝利は、経済格差への怒りと、AIによって形作られることになる未来への不安を示す広範な不満の表れである。", "summary_en": "Now that the Democrats will hold sizable majorities in both chambers of the US Congress, they have an opening to push for long-overdue legislation to steer AI development toward the common good. Private companies should not have the power to decide unilaterally which risks the public will bear.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-midterms-democrats-ai-mandate-by-gabriela-ramos-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWhat the US Midterms Could Mean for AI\nNow that the Democrats will hold sizable majorities in both chambers of the US Congress, they have an opening to push for long-overdue legislation to steer AI development toward the common good. Private companies should not have the power to decide unilaterally which risks the public will bear.\nPARIS—The US midterm elections were a clarion call for change. Affordability concerns, the war in Iran, and corruption all played a part in the Democrats’ sweeping victory, signaling widespread dissatisfaction with America’s direction, anger over unfair economic outcomes, and anxiety about a future that seems destined to be shaped by AI.", "translation_ja": "", "vocab": []}, {"title_ja": "AI生成記事の掲載を認めるべき理由", "title_en": "Let’s Publish AI-Generated Articles!", "summary_ja": "学術誌の目的は最良の研究成果を発表して知識を進歩させることであり、人間とAIの査読者がAI生成論文が基準を満たしていることに同意すれば、編集者がそれを却下する理由はないと著者は主張している。著者が編集委員を務める『異議を唱える思想ジャーナル』は、人文科学および社会科学における議論可能なテーマの範囲が狭まることに対抗するため、物議を醸す論文であっても査読を通せば掲載し、著者が筆名での発表を希望する場合はそれを認めている。", "summary_en": "Peer-reviewed academic journals exist to advance our knowledge and understanding by publishing the best work being done in a given field. If that is the goal, and the best reviewers—both human and AI—agree that an article generated by AI meets that standard, why should a journal's editors reject it?", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/legitimacy-of-ai-generated-academic-articles-by-peter-singer-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nLet’s Publish AI-Generated Articles!\nPeer-reviewed academic journals exist to advance our knowledge and understanding by publishing the best work being done in a given field. If that is the goal, and the best reviewers—both human and AI—agree that an article generated by AI meets that standard, why should a journal's editors reject it?\nŁÓDŹ—I am a co-editor of the Journal of Controversial Ideas, an open-access, peer-reviewed journal. Five years ago, my co-editors and I launched the journal to combat the narrowing of the range of “acceptable” issues that can be raised in the humanities and social sciences. We do not reject well-argued articles because their topics are too sensitive, and we allow authors to publish under a pseudonym if they fear that publishing their controversial ideas will harm their careers, or lead to personal abuse and death threats.", "translation_ja": "", "vocab": []}, {"title_ja": "中間選挙後のMAGA運動についてのガーディアン紙の見方：トランプ主義の強化", "title_en": "The Guardian view on Maga after the midterms: doubling down on Trumpism | Editorial", "summary_ja": "中間選挙での共和党の敗北後、トランプ前大統領は初期の融和姿勢を放棄し、白人至上主義者のスティーブン・ミラーを首席補佐官に抜擢することで、より過激なトランプ主義への回帰を示している。この人事異動により、行政府内の女性が全員辞任または更迭され、強硬派による支配が強まり、極端な移民政策や司法外の殺害など危険な政策が推し進められる可能性がある。共和党内でトランプを責任追及しようとする動きは弱く、多くの政治家はより過激なトランプ主義を望むか、彼に対抗することを極度に恐れている。", "summary_en": "Republicans know that the president’s folly and excesses cost them the elections. That doesn’t mean they’re ready to challenge him Shortly after polls closed last Tuesday, with the scale of the Republican trouncing in the midterms still becoming apparent, Donald Trump briefly adopted an oddly concil", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/11/the-guardian-view-on-maga-after-the-midterms-doubling-down-on-trumpism", "state_media": false, "category": "オピニオン", "full_text": "Shortly after polls closed last Tuesday, with the scale of the Republican trouncing in the midterms still becoming apparent, Donald Trump briefly adopted an oddly conciliatory tone. He declared that he was “absolutely” willing to accept the results, would look forward to working with Democrats and that deportation policies might have been “too tough”.\nIt was never going to last. He soon cast doubt on the elections’ legitimacy. On Friday, he replaced his chief of staff, Susie Wiles, with her deputy, Stephen Miller – a white nationalist, or “stone-cold racist”, in the words of Hakeem Jeffries, likely to be the next House speaker. Ms Wiles executed the president’s decisions faithfully, but was seen as a somewhat calming if not restraining influence, which may help explain her departure.\nEvery high-profile woman in the administration has now quit or been ousted, and its machismo has increased. Mr Miller is an ideological extremist and attack dog who has spearheaded the expansion of executive power as well as the draconian immigration excesses that alienated many (particularly Latino) voters. He reportedly wants to wind down the war on Iran, but played a leading role in strikes against alleged drugs boats in the Caribbean – extrajudicial killings.\nHappily for Mr Trump, the reshuffle has turned discussion away from lame ducks and the Republican succession. He does not need the mixed martial arts supremo Dana White as his press secretary; he has enough brawlers. On Tuesday, House Republicans picked another aggressive hardliner, Jim Jordan, as minority leader. He has pledged to fight investigations by the new Democratic majority. On the same day, they blocked the attempted impeachment of Pete Hegseth, the self-styled “secretary of war” (with some Democrats also missing the vote). The outgoing Republican congressman Thomas Massie was pressing the case against him over the Iran war and attacks on drugs boats. Mr Hegseth is manifestly unfit for office. He has shared highly sensitive information on a messaging app and wanted to live stream a military execution. But a case against him might embarrass Mr Trump.\nSome still hope that Republicans will have little choice but to hold Mr Trump accountable for last week’s defeat. JD Vance sought to distance himself by criticising the Iran war, and Ron DeSantis declared that there was “no question” that the results were a rebuke of Mr Trump. But GOP politicians either want more Trumpism, or are extremely wary of taking him on, after he torched previous critics. Trump voters are split between the Maga base, which wants to double down (and who turned out last Tuesday) and the rest who want to moderate (and stayed home) – with divisions on everything from datacentres to deportations. The Republicans can’t win in 2028 with Maga votes alone. Yet the GOP regained power in 2016 by becoming more extreme.\nThe Democrats now have their own challenge. They must use their new congressional power to ensure accountability – including pinning corruption in Mr Trump’s circle to the cost of living crisis – while also trying to deliver for voters who need real improvements in their lives. Republicans will seek to tie them up in fruitless congressional battles.\nThe Trumpist message is so clear that the outgoing speaker of the House, Mike Johnson, even said it out loud: “The voters made the wrong choice.” The Republicans are promising the electorate more of what they didn’t want. The people have spoken, but the president – and his party – won’t listen.", "translation_ja": "", "vocab": []}, {"title_ja": "ピート・ヘグセスが自らを「戦争長官」と呼ぶ理由：「愚かだが危険」はバッジには収まらない", "title_en": "Why does Pete Hegseth call himself secretary of war? ‘Dopey but dangerous’ wouldn’t fit on a badge | Emma Brockes", "summary_ja": "エマ・ブロッケス筆者は、国防長官ピート・ヘグセスが自分自身を「戦争長官」と呼ぶことについて論じている。ヘグセスはトランプ政権で最も不適格な人物であり、イラン戦争やベネズエラの政権交代など多くの非難を受けているにもかかわらず、その滑稽なペルソナが彼の危険性を隠蔽していると指摘している。筆者は、ヘグセスの「愚かだが危険」という性質が、トランプ大統領の戦術的な脅迫と道化師的な態度の組み合わせと軌を一にしていると論じている。", "summary_en": "He has survived blame for the US midterms disaster and dodged an impeachment vote, but it will be one battle after another now – and he can’t win them all Like the brief, wondrous cycle of the mayfly, we may come to look back on the career of Pete Hegseth, the US secretary of defence who cheekily re", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/11/pete-hegseth-secretary-of-war-dopey-dangerous-midterms-impeachment", "state_media": false, "category": "オピニオン", "full_text": "Like the brief, wondrous cycle of the mayfly, we may come to look back on the career of Pete Hegseth, the US secretary of defence who cheekily rebranded himself secretary of war, as the defining appointment of the Trump era: that is, one in which extraordinary power was handed to a man of cartoonish inappropriateness and which, despite this week’s shelved attempt to impeach him, may still turn out to have been luminously short-lived. In January, the Democrats will assume a majority in both chambers and are likely to have another crack at impeaching Hegseth. In the meantime, we can only look on and wonder at his meaning.\nIt is quite something, in the context of Trump cabinet appointments that have included Robert F Kennedy Jr and Kristi Noem, to be the most glaringly underqualified person in the West Wing, but since being sworn in almost two years ago, Hegseth has comfortably seen off any rivals to his crown. This week, eight articles of impeachment, or “high crimes and misdemeanours” as the official rubric has it, were levied against him by Thomas Massie, an outgoing Republican congressman from Kentucky, who accused Hegseth of illegal acts including violating the constitution by conducting an unauthorised war with Iran and effecting regime change in Venezuela.\nRepublicans narrowly saw off the proceedings and, somewhat to the surprise of observers, joined the president in rallying energetically to Hegseth’s defence. This, too, may not last; in the wake of the Republicans’ shellacking in the midterms, speculation as to who would take the fall for Trump’s losses focused on Hegseth, after JD Vance pointed to the Iran war as a root cause of the losses. But perhaps this underestimates Hegseth’s appeal to the president. If Greg Bovino, the former US immigration chief who quit after two people were killed by agents under his command, looked like a textbook psycho in the manner of Sean Penn’s Col Steven J Lockjaw – the screw-loose character from the movie One Battle After Another – Hegseth is a different beast entirely; a Mr Incredible-like figure whose persona is so ridiculous, so dopey, as to distract from his dangerousness.\nSuch a manoeuvre is, of course, in line both with Trump’s own highly developed ability to marry deadly threat levels with the affect of a buffoon, and a more general tradition in the US of men of war who operate with the affability of the Pillsbury Doughboy. Cast your minds back to Gen “Stormin’” Norman Schwarzkopf, a man shaped like a freestanding wardrobe, who led coalition forces in the first Gulf war, or Colin Powell, his senior at the time who, as chairman of the joint chiefs of staff and despite leading the most powerful military in the world, appeared at briefings with the casual ease and likability of a lounge singer.\nCompare this with the way we do things in Britain, where, generally speaking, we like our military men to be slight of form, quiet of voice, thin of moustache and ruthless of execution. As a platonic ideal, if military officers in the US take the shape of comfy old Tom Hanks in Saving Private Ryan, in Britain we’re more partial to Trevor Howard in The Third Man, all twinkly eyes and icy veins, or the unyielding Alec Guinness in The Bridge on the River Kwai, a man who, beneath his quivering, rule-following exterior, is as pitiless as rain and as mad as a snake. Both represent sleights of hand, to some degree. Take your pick.\nHegseth, of course, never led the US army. While serving in the military, he rose to the middling rank of major (it was his service on Fox & Friends that, in all likelihood, made him a four-star general in Trump’s eyes). And US defence secretaries aren’t themselves expected to be especially martial; let’s enjoy a quick drive-by on the memory of Dick Cheney, secretary of defence under George H W Bush, accidentally shooting his own hunting buddy in the face during a quail hunting trip in southern Texas.\nBut Hegseth looks the part, not just of the genial American warrior, but of the very specific ideal favoured by Trump in which the quiff-wearing, square jaw-rocking secretary of defence embodies the 1950s aesthetic for which the president pines. If Democrats manage to impeach and oust him next year, he may linger in our minds, against stiff competition, as the most hollow, disastrous and surreal piece of casting in Trump’s cabinet of misfits and rogues.\n- Emma Brockes is a Guardian columnist\n- Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": []}, {"title_ja": "弾劾シーズン到来！ピート・ヘグセス国防長官への弾劾未遂後、ドナルド・トランプが次の標的になるのか？", "title_en": "It’s impeachment season! After the attempt on Pete Hegseth, will Donald Trump be next? | Arwa Mahdawi", "summary_ja": "著者は、共和党が中間選挙で大敗したため、民主党がトランプ大統領の弾劾を追求する可能性があると論じている。トランプはすでに2度弾劾されているが、上院の有罪判決には至らなかった。民主党が政権を掌握する現在、トランプが弾劾で罷免される初の大統領となる可能性は低いものの、完全には不可能ではないと著者は指摘している。", "summary_en": "Trump has already made history as the only president to be impeached twice. After the Republicans’ thrashing in the midterms, could there be a third attempt? The days are getting shorter, the nights are getting longer and some Republicans are getting nervous. After a long stretch of impunity, it’s i", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/11/impeachment-pete-hegseth-donald-trump", "state_media": false, "category": "オピニオン", "full_text": "The days are getting shorter, the nights are getting longer and some Republicans are getting nervous. After a long stretch of impunity, it’s impeachment season in the US. While the attempt to impeach the defence secretary, Pete Hegseth, failed yesterday, Donald Trump may be worried he’s next.\nIn January, the president warned Republicans that they had better win the November elections or he would be in big trouble. “If we don’t win the midterms … they’ll find a reason to impeach me,” Trump said. He repeated this plea to voters during an October rally in Oklahoma: “Pretend I’m running, please. Just pretend. ’Cause I am on the ballot. And if we don’t win, they’ll end up impeaching me.”\nI don’t need to tell you what happened with the midterms, do I? The Republicans didn’t just lose – they were given a thrashing so thorough that, for a while, Trump seemed to avoid talking about it. Indeed, in his first public appearance after the election, Trump largely avoided the issue for a full 20 minutes while talking about his beloved White House ballroom project, rhapsodising about its “magnificent” columns. This week, Trump seems to have moved on to another obsession: he is now making baseless claims that the election was rigged. Still, while Trump may be in la-la land half the time, in his moments of lucidity you have to imagine he’s worried a comeuppance is coming.\nThere are various ways Trump could be held accountable for any alleged crimes, but what he seems most worried about right now is potential impeachment. It’s a multistep process used to charge a public official with serious misconduct and remove them from office. First, articles of impeachment are brought, then the House votes on whether to adopt these articles via a majority vote. If that happens, the person is impeached. But this is where things get tricky. For the official to get removed, the Senate has to hold an impeachment trial and two-thirds of members (67 senators) have to find them guilty; a tough hurdle to clear. There have only been eight cases where this has happened and all the officials removed have been judges.\nTrump has already made history by being the only president to have been impeached twice: in 2019 and 2021. In both cases the Senate acquitted him. But now that Democrats have control of government, could Trump become the first president to be removed from office through impeachment?\nThe short answer is that, while it’s not impossible, it’s unlikely. The Democrats have a majority, but they still only have 54 seats. Attempting to remove Trump would be a gruelling process that many don’t have the appetite for. Kamala Harris said recently: “Going in the direction of impeachment is not a good idea … we have limited resources and I think the energy and the resources need to be put into accountability, need to be put into investigations.”\nIn an interview with NBC News on Sunday, Senator Bernie Sanders went even further. “We cannot spend all of our time investigating Trump,” Sanders said. “We have to stand up for working-class families, make a real difference in their lives.”\nHear me out: how about we do both? And look, if impeachment is unrealistic, we can get a little creative and come up with other ways to give Trump and his lackeys a small taste of the misery they have inflicted on the rest of us. I would suggest exiling the president to an island and forcing him to listen to his incoherent speeches on a nonstop loop, but I suspect he’d quite enjoy that. Although we could fill the place with wind turbines, which enrage him, and make sure the water is filled with sharks. Trump is weirdly obsessed with the fish; according to Stormy Daniels he once said: “I hope all the sharks die.”\nOh dear, I think I’d better stop there before I have the FBI knocking on my door. Forget the sharks, OK? If the legal system fails us, let’s just focus on replacing him at the next election.\nArwa Mahdawi is a Guardian columnist", "translation_ja": "", "vocab": []}, {"title_ja": "新しい種類の外国人工作員", "title_en": "A New Kind of Foreign Agent", "summary_ja": "著者は、中国のAI企業が米国企業に販売するAIモデルが中国共産党の利益を促進するよう設計されており、新たな外国の脅威となっていると主張しています。著者は、中国のAI企業を禁止するのではなく、1938年に制定された外国人工作員登録法（FARA）に基づいて外国人工作員として扱い、登録と情報開示を義務付けることを提案しています。この既存の法律を執行することで、DeepSeekなどの中国企業がアメリカの重要な意思決定を支配することを防ぐことができると述べています。", "summary_en": "How AI is reshaping influence operations in America.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/new-kind-foreign-agent", "state_media": false, "category": "オピニオン", "full_text": "Foreign governments have tried to influence the United States since its founding. President George Washington warned in his Farewell Address that “foreign influence is one of the most baneful foes of republican government.” The old methods have certainly not gone out of vogue; just this week Nvidia CEO Jensen Huang admitted to having a romantic relationship with a businesswoman who U.S. officials believe was working for Chinese intelligence. But today, a new type of foreign agent has arrived: Chinese artificial intelligence companies.\nLike the foreign agents of old, the models these companies sell may seem harmless—just a cheap tool for American businesses to use. But their makers train them to promote the interests of the Chinese Communist Party (CCP). American businesses are outsourcing more and more critical decisions to AI. If Washington does nothing, those businesses will hand over control to models whose objective is to promote a foreign government.\nAlthough U.S. policymakers now debate banning Chinese AI, the tried-and-true American solution is not censorship but disclosure. In 1938, Congress passed the Foreign Agents Registration Act. Rather than outlaw propaganda, FARA allowed foreign agents to continue spreading it—as long as they registered with the government and disclosed whom they really worked for. Their communications also had to carry a conspicuous label naming their foreign sponsor.\nFARA’s wisdom has aged well over the decades. In recent years, the Justice Department has ordered the Russian state television network RT and the Chinese state media organizations Xinhua and CGTN to register as foreign agents and to label their content as such. Those who failed to register as foreign agents, such as Paul Manafort, President Donald Trump’s 2016 campaign chairman, and former U.S. Representative David Rivera of Florida, were sentenced to prison. (Trump pardoned Manafort in 2020.)\nToday, rather than banning AI companies controlled by foreign governments, the United States should treat them as foreign agents under FARA. No new statute is needed. Washington should simply enforce the one on the books. Of course, FARA is no silver bullet against all foreign influence, but it fits the shape of this problem. A handful of known Chinese companies, such as DeepSeek, Alibaba, and Moonshot AI, build the models that American businesses increasingly let think and act for them. The Justice Department can reach every one of them.\nDemocracy is strong enough to survive foreign influence but not invisible foreign influence. And to make sure the world does not subordinate its decision-making to Beijing, Washington and its allies must create an allied AI compact and then spread their own models far and wide.\nAGENTS, NOT PRODUCTS\nAmerican AI models, such as Anthropic’s Claude and OpenAI’s ChatGPT, are under no obligation to promote the U.S. government’s message. Ask Claude about Trump’s and President Joe Biden’s biggest failures or about the United States’ darkest chapters, and it will answer. Not so for Chinese AI models. When I asked the Chinese chatbot DeepSeek to “tell me about the CCP” in November, it answered that the party “is the vanguard of the Chinese working class, the Chinese people, and the Chinese nation. . . . The Party’s leadership is the most essential characteristic of socialism with Chinese characteristics and is the fundamental guarantee for China’s development and progress.” Such boosterish language appears by design.\nBy law, Chinese AI models must never go against the Chinese government. Under the country’s 2023 regulations on generative AI, they must “uphold the Core Socialist Values” and may not engage in “harming the nation’s image” or “undermining national unity and social stability.” The Chinese government released a technical standard that laid out what these high-level declarations mean in practice: AI developers should have a list of at least 10,000 banned keywords, and their models must refuse to answer at least 95 percent of test questions the CCP finds objectionable. Developers must also scrub their training data of any history Beijing does not like. In short, the models must act as card-carrying members of the CCP.\nThat is why, as the U.S. Commerce Department’s AI evaluators found in 2025, DeepSeek pushes Chinese propaganda at far higher rates than American models do, even when run on American servers. Estonia’s Foreign Intelligence Service found that DeepSeek inserted praise of the Chinese state unprompted, and it concluded that China uses DeepSeek to instill “a distorted, self-serving world view in the Western information space.”\n Chinese AI models must act as card-carrying members of the CCP.\nBut these models are not just propaganda parrots—they are taught to “think” about how to promote Beijing’s perspective. Ask an AI model something complex, and it will “reason” for a while. As it thinks, it produces an internal monologue called its chain of thought. Users rarely see it. There, i", "translation_ja": "", "vocab": []}, {"title_ja": "トランプが直面する全く異なる北朝鮮", "title_en": "Trump Is Facing a Very Different North Korea", "summary_ja": "トランプ前大統領は金正恩との外交を再開しようとしているが、2019年の最後の会談以来、北朝鮮の状況は大きく変わっている。米中対立の激化、ウクライナ侵攻、北朝鮮の核・軍事力強化とロシアからの支援増加により、金正恩の立場は強化され、過去の譲歩と交渉戦術は通用しなくなっている。トランプが実現する可能性のある米朝首脳会談では、より困難な交渉環境に直面することになるという論旨である。", "summary_en": "Donald Trump has Pyongyang on his mind. In recent months, the U.S. president has made comments to the media suggesting he is in communication with North Korean leader Kim Jong Un. In an August 17 Truth Social post, for instance, Trump announced that the United States would scale back joint military ", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/north-korea/trump-facing-very-different-north-korea", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump has Pyongyang on his mind. In recent months, the U.S. president has made comments to the media suggesting he is in communication with North Korean leader Kim Jong Un. In an August 17 Truth Social post, for instance, Trump announced that the United States would scale back joint military drills with South Korea. The decision, he wrote, was “based on my very good relationship with Kim Jong Un,” describing the dictator as “unthreatening and respectful.”\nTrump has not been subtle about his desire to restart diplomacy with Kim. With an eye on his legacy and the war with Iran stalemated, he is eager to notch a foreign policy win. During his first term, Trump held two historic U.S.–North Korean summits aimed at denuclearizing the Korean Peninsula—but both foundered because of the countries’ disparate expectations for the terms of a deal. Since his reelection, Trump has been looking to reopen talks with Kim. The ball is now in Pyongyang’s court, and Kim has signaled, if not an eagerness for renewed engagement, at least an unwillingness to rule it out. In August, after Trump insisted for the second time that he was in touch with Pyongyang, Kim Yo Jong—the leader’s influential sister—released a statement that read: “Regarding the reports from Washington about recent communication between the top leaders of North Korea and the U.S., I am completely unaware of such matters. It has been stated on numerous occasions that our head of state holds fond personal memories and positive feelings toward Trump. The relationship between the leaders remains excellent.” Although this is far from an agreement to meet, Kim Jong Un is not closing the door.\nIf leader-to-leader talks materialize, Trump may believe his personal rapport with Kim will yield a deal. But he will be facing a very different North Korea than the one at their last meeting in 2019. The fallout from unfinished diplomacy during Trump’s first term, the COVID-19 pandemic, and global trends such as the sharp escalation in U.S.-Chinese strategic rivalry and Russia’s invasion of Ukraine have destabilized the security landscape and created formidable obstacles to peaceful engagement. Meanwhile, North Korea’s continued nuclear and conventional military expansion and the growing support it is receiving from Moscow have strengthened Kim’s hand. Facing an emboldened Pyongyang, Trump can no longer fall back on the same concessions and negotiation tactics he used in previous talks.\nFor a U.S.–North Korean summit to be successful, the United States must approach it with well-defined strategic goals and a clear understanding of what concessions it is willing to make. Washington should shift its focus away from denuclearization, at least in the short term, to concentrate on more achievable nuclear arms control and safety measures. The United States should also maintain a capable troop presence on the Korean Peninsula and reiterate its security assurances—particularly its nuclear-deterrence guarantees—to regional allies such as South Korea and Japan.\nAlthough diplomacy with North Korea has historically been difficult, Trump is eager to meet with Kim, and both sides want to avoid pushing the Indo-Pacific toward nuclear proliferation or all-out war. Careful engagement with Pyongyang could defuse tensions on the Korean Peninsula and lay the groundwork for a more stable security landscape.\nTABLES TURNED\nSince the U.S.–North Korean summit in 2019, the conflicts in Ukraine and Iran have reshaped the Indo-Pacific in ways that strengthen Kim’s hand. The U.S.-Israeli war with Iran has drawn Washington’s focus away from Asia as, for the third time in the past quarter century, U.S. strategic attention and military assets have surged to the Middle East. The last American aircraft carrier stationed in the Indo-Pacific departed for the Persian Gulf in August, and U.S. strikes on Iran have rapidly depleted American munitions stockpiles. Washington’s Indo-Pacific allies, already strained by Trump’s abrupt policy shifts and punishing tariffs, are now concerned about deteriorating deterrence. Asian economies—many of which are deeply dependent on Middle Eastern energy supplies—have contracted as the Strait of Hormuz has remained compromised. Amid signs of further American retrenchment, U.S. allies and partners are increasingly skeptical about Washington’s commitment to the region.\nEven more consequential is Russia’s invasion of Ukraine, which has benefited North Korea in numerous ways. Moscow and Pyongyang’s once dormant relationship has flourished as Kim has sent thousands of munitions to replenish Russia’s depleted stockpiles and thousands of soldiers to fight and die in the ongoing ground war. Images of the new memorial to the Korean People’s Army soldiers who have perished in the invasion suggest an already significant loss of North Korean lives. In return, Pyongyang has received generous assistance from Moscow in violation of international sanctions, including abundant financial supp", "translation_ja": "", "vocab": []}, {"title_ja": "中国のAI外交が機能している", "title_en": "China’s AI Diplomacy Is Working", "summary_ja": "著者は、米国が中国とのAI安全対話を進める際、戦略的競争の一部として扱うべきだと主張している。中国は国際的なAI安全討論を利用して米国の輸出規制を批判し、開発途上国に対して独自のAIエコシステムを提供することで競争優位を獲得している。米国は対抗するため、対話を競争戦略の一環として扱い、中国に対する圧力を強化しつつ、他国により説得力のあるAI採用・ガバナンスのビジョンを提示する必要があるとしている。", "summary_en": "America should be taking notes.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinas-ai-diplomacy-working", "state_media": false, "category": "オピニオン", "full_text": "Can the United States and China simultaneously cooperate and compete on AI? That is the question driving debates in Washington about the wisdom of pursuing talks on the subject with Beijing. The Biden administration paired sweeping technology restrictions with a narrow dialogue on risk, and the Trump administration has kept a channel open even as it has downplayed safety. Some experts go further. They hope that cooperation on safety can be siloed off from competition entirely, a belief as appealing as it is fanciful. Any dialogue on AI risk takes place within the broader strategic competition between the United States and China.\nBeijing has long appreciated this dynamic. Much of Washington has not. Whereas the United States has shifted its approach to AI competition and safety across and within presidential administrations, Beijing has kept its AI diplomacy focused on gaining competitive advantage over the United States. China has taken part in international AI safety discussions, but it has used them, along with talks with the United States, to paint U.S. export controls as the main obstacle to cooperation. It has cast itself as the champion of the developing world, promising a Chinese-led AI ecosystem without technological or financial barriers as an alternative to a restrictive U.S.-led AI order. The pitch is working. A growing number of states are embracing China’s message, and Chinese open-weight models are gaining users across the developing world.\nIf the United States wants to maintain its lead and make meaningful progress on safety, it needs to treat the dialogue as part of the competition with China. To do so, it must ramp up pressure on China outside the talks and offer countries still choosing sides a more compelling vision for AI adoption and governance. And when U.S. and Chinese officials next meet, in November, Washington should test Beijing’s seriousness about safety. In short, the United States should approach AI diplomacy with the same strategic clarity China has.\nCHIPPING AWAY\nThe Biden administration’s first round of advanced semiconductor export controls in October 2022 and the release of ChatGPT a month later signaled that the United States had taken an early lead in the AI competition and would act to weaken China’s AI industry. Washington and its allies also seized the diplomatic initiative, taking the first steps toward global AI governance. In May 2023, the G-7 began intense discussions on AI governance that would eventually produce a code of conduct for developers. Weeks later, the United Kingdom announced it would host the first global AI safety summit at Bletchley Park.\nChina responded by rolling out a diplomatic script it has been honing ever since. Its core tenets first appeared in the Global AI Governance Initiative, published in October 2023. It called for countries to “put equal emphasis on development and security” (though it left security to be defined by individual states) and contrasted China’s focus on cooperation and development with U.S. export controls, attacking Washington for “creating barriers and disrupting the global AI supply chain through technological monopolies and unilateral coercive measures.” Despite Beijing’s growing body of AI regulations at home, the initiative offered little more than slogans on the technology’s risks.\nThat basic formula—cooperation and development, set against U.S. restrictions, with little to say about risk—has guided China’s AI diplomacy for the last three years. In March 2024, the UN General Assembly adopted a U.S.-led resolution on safe, secure, and trustworthy AI intended to appeal to both developed and developing countries. China supported the resolution, then introduced another resolution centered on help for poorer countries and “emphasizing that member states should enjoy equal opportunities” to develop and use AI. At a UN Security Council meeting on AI chaired by the United States in December that year, China’s UN ambassador, Fu Cong, once again counterposed Beijing’s stated interest in cooperation against “discriminatory barriers based on ideological differences.” In thinly veiled terms, Fu was charging that U.S. restrictions on China harmed the developing world.\n Much of the allure of China’s pitch rests on how the country’s developers share their technology.\nTo win the support of these countries as they built out their AI infrastructure, China needed a bloc of its own. In July 2025, Premier Li Qiang proposed the World Artificial Intelligence Cooperation Organization (WAICO), which promised developing countries technology, training, and a greater say in writing global AI rules. In a speech marking its launch a year later, Chinese leader Xi Jinping called for “openness,” shorthand for access to U.S. chips and the adoption of Chinese open-weight models. After urging countries to take the risks of AI seriously, Xi added that they should, “in the meantime,” jointly oppose “overstretching the national security concept in the f", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-12 02:04 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
