inition": "従来の軍事手段と非軍事的な手段（サイバー攻撃やプロパガンダなど）を組み合わせた戦争戦術。通常の戦闘と区別しづらい多様な方法で敵を攻撃する戦略。"}, {"word": "escalation", "definition": "問題や紛争が段階的に悪化・拡大すること。対立や緊張が徐々に激化する状況を指す。"}, {"word": "maritime drone", "definition": "海上で作動する無人航空機。海洋での監視、偵察、または攻撃任務に使用される遠隔操作または自動制御されたロボット装置。"}, {"word": "electronic interference", "definition": "電子信号や通信を意図的に妨害する行為。GPS信号やドローンの操縦信号などを遮断または混乱させる技術。"}, {"word": "offshore gas project", "definition": "海洋で実施される天然ガス採掘・生産事業。陸地から遠く離れた海域でのガス資源開発プロジェクト。"}, {"word": "NATO member", "definition": "北大西洋条約機構（NATO）に加盟している国。集団防衛条約に基づく同盟関係にある国。"}]}, {"title_ja": "ジョン・タバレス、2018年フリーエージェント契約の交渉内容を明かす　800万ドルの税務問題に直面", "title_en": "John Tavares Reveals Details of 2018 Free-Agent Deal While Fighting $8M Tax Bill", "summary_ja": "トロント・メープルリーフスのスター選手ジョン・タバレスが、2018年のフリーエージェント契約に至った交渉の詳細を明かした。同選手は現在、この契約に関連した800万ドルの税務問題で争っている。", "summary_en": "Toronto Maple Leafs star John Tavares has disclosed details about the negotiations that led to his lucrative 2018 free-agent contract. The player is currently involved in a dispute over an $8-million tax bill related to the deal.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi7gFBVV95cUxONEt3djRrVHlZZFlic09jVUVPazlrUjRSUE1SRTVzc1htQU9yU04wMnJtMFc2dDZxVklTVWRybXhwOHJFcnBxRGZMaUNQdXFFWUMyb2xVNU13dTh6Qklkdk4wbzdPdG1uRUM2WFZfSktWN0dScnp6NjFRRHE1R3plcnBISmVHN2dwU2Y3T3hOemRETGwzOTVfYmljR0FoYUZJTVRTbWhNd1UwZm1JLWFGM3BGcnMxUExtaWJaclJTTmN0S0xkWVlEVjNnclBqeHM4VXRWLVB0TzJYSlhYcjRGcFR3ZG52Q2JnLTJqY2dB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "CTVの『ザ・ソーシャル』が創設共同ホストメリッサ・グレロの退出に伴いビデオポッドキャストへ移行", "title_en": "CTV's 'The Social' Transitions to Video Podcast as Founding Co-host Melissa Grelo Departs", "summary_ja": "CTVの長年放映されているデイタイムトークショー『ザ・ソーシャル』が大きなフォーマット変更を実施し、従来のテレビ放映からビデオポッドキャストへと移行する。この変更は、番組の重要なメンバーとして長年携わってきた創設共同ホストのメリッサ・グレロが番組を去ることに伴うものである。", "summary_en": "CTV's long-running daytime talk show 'The Social' is undergoing a major format change, transitioning from traditional television to a video podcast. The shift comes as founding co-host Melissa Grelo announces her departure from the program after years as a key member of the show.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi_gFBVV95cUxORWh1MjN6RUJyVFc1R2NnVjVlMVZiV1JLbmNqa241akNrLWxQRTRVVUJnbkpNaXFNMGFxRktYMExPSG56VTItbE5DZXBPdVB0N3Rha3BwWkZtNThFenhnU09HejBHUmctbGxhZS0tV3BVUk1oTnBrNUtUN1l1c2FDb0NoYk5MM0pfcDc2Mnl0bGQyRW1RVmh3QlloZjQyQjJ1MHdzd1NydlBwUHdmUWNZV1o4TzJjbE9EMmpOREFQZUJmWUFSYkwxams1amE4SXNDWVc4YnVqZW50WW5uYXo3Y0t5NnI5WGJBcE95cFo2QVZUTVdrQ05wamZrUjZNZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フォード州首相の自動車産業対策は実質的な成果を示す必要がある、コラムが指摘", "title_en": "Ford's Auto Industry Deal Must Deliver Real Relief, Column Says", "summary_ja": "アダム・ラドワンスキーはオンタリオ州の自動車産業支援パッケージが実質的な利益をもたらすのか、それとも表面的なサポートに過ぎないのかを検証している。スター紙のコラムニストは、この対策が初期印象以上の意味のある経済的影響を示さない場合、ダグ・フォード首相は彼のアプローチを再検討すべきだと示唆している。", "summary_en": "Adam Radwanski examines whether Ontario's auto-industry relief package offers substantive benefits or merely surface-level support. The Star columnist suggests Premier Doug Ford should reconsider his approach if the deal fails to deliver meaningful economic impact beyond initial appearances.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiqgJBVV95cUxNWmd5NTE3SGg1VGI5TVF2Nm1rWGN4TUJyclVWd0lVb2N5T2dreENZd1FqRWk1dEVZMDl1aUp0bjV5ZFNnV3pXdFN0Ul8tS3N2UF96ekFPVkhGZ2VxeEc4dkpLWXJMLTI3X2JLdm5YU3p0NEIxSk5uazBCT0JzSzdacjVENXNuMEFTM09QRi1vZmxyVzgxNGc5UnpmX05kaVVNVGZ4Q0FBWEZMNWlDcXBhM3Y5TTkzTjlVWjB0ZGJReFpTUWlrU3JHLWxTUE4wb0NRLTV4aHNsdDdtLXZnYWJqZmJ3clE3eHlFSXJ6NzRFQWtZMk51WkpSMGVlMFI2ZWxKejAwSDVWQU5FdFZYN0dUX25CSGtTdHpESGFjWWxyRGthYnJNdXlSZXdn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O Globoの英語ニュース", "title_en": "O Globo English News", "summary_ja": "O Globoは英語での国際ニュース報道を提供しています。同出版物は世界的なイベントと動向に関する包括的な報道を配信しています。", "summary_en": "O Globo provides international news coverage in English. The publication delivers comprehensive reporting on global events and developments.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE00WVFsTjVqR2xZQjFKaFZSNHBGUkpwZ2RhZXRRVUpPeHpoNXlfWENGNkN1VW9xOEtmby1oNVpYZVc2Y2huaWh2SnpvdExUbEJvZWhhc3ZXWnRFM2xIcVFiajR4UHA4NENhYXc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O GLOBOと同じく2025年に100周年を迎える購読者たちのストーリー", "title_en": "Century-Old Subscribers Mirror O GLOBO's 100-Year Milestone in 2025", "summary_ja": "O GLOBOは2025年の創刊100周年を記念して、同じく100年の節目を迎えた長年の購読者たちのストーリーを紹介している。これらの注目すべき人物たちは、新聞とともに1世紀の歴史を目撃してきた。彼らの個人的な人生経験は、出版社と最も忠実な読者たちの深いつながりを反映している。", "summary_en": "O GLOBO celebrates its centennial in 2025 by highlighting the stories of long-time subscribers who have also reached their own 100-year milestones. These remarkable individuals have witnessed a century of history alongside the newspaper. Their personal journeys reflect the deep connection between the publication and its most loyal readers.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi4gFBVV95cUxQckNyQXRYdHI5dHNKNGFDT0ZIU1dlRnZxRFpYdkFYR1hoTFpkaDRobkZ6Mkxpd21oeVhRUU1qR3hCTjQyZmVRVlo3R1p0aGptR2JqVU5MR1lORGxJRTJXQ1B1eGNHVndIZXgyb1pqU0V3eURHRHFWYXFheE5sdkRBS3laU01nQzl5YVp0a2hiT3hzOHExNFRQUnlWLXUxOVJsSWJNbDQtdXhodVlSRGlWVFRVSjlSREZpaGFOelU5UmlxRmVVNEY4RG5GSjRDUWpWc3N6eWVzS3gtMkdkYi1kU1pn0gHwAUFVX3lxTE5mTnRybnZhQWpFUWpqZTloM0lHcjA5UFZQWWZyX05SclVVTXFxRU9lQnJnYVRLTkd5Z1FYOHgtOHNZV0I2dlZsRTBwZVdDVlFETkFuTWQxRFdTZE5mZXVjMXZPdEVQSjZIamJzWkdZX3ZXUFo3TEZfYm9ISzJjUFZ2eUVsaVhGTktPQkg2UlkwZEh5M3dRU2xZQUtBVkh6NEV2UmpOQ2Q4aC10TW9pdldLdUJieXVLaU1NWEZqbVhXYW52UUdIWjcya3c4WWMtb1VBUGI0OVk4bUlnZHo3cEtILVFRVS0ybUYtYmoyVVNWNg?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グルーポ・グロボ、創立100周年に向けた取り組みを準備", "title_en": "Grupo Globo Prepares Initiatives for Centennial Year", "summary_ja": "ブラジルの大手メディア企業グルーポ・グロボが、創立100周年を迎えるにあたり特別な企画を準備している。同社はこの歴史的な節目を記念するプロジェクトを展開する予定である。", "summary_en": "Grupo Globo is planning special initiatives to celebrate its upcoming centennial anniversary. The Brazilian media conglomerate is developing projects to mark this significant milestone in its history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "大統領パネルが国家警察改革法案に関する国民からの提出書類を審査中", "title_en": "Presidential Panel Reviews Public Submissions on National Policing Bill", "summary_ja": "ナイジェリアの大統領作業部会は、全国協議の際に国民から提出された覚書と立場表明書の審査を開始した。この法案は大統領の安全保障改革の一環として州警察の創設を目指している。法務省から指名された法律起草者が最初の起草段階を開始し、提出期限は8月21日まで延長された。", "summary_en": "Nigeria's Presidential Working Group on the National Policing Bill has begun reviewing memoranda and position papers submitted by the public during nationwide consultations. The bill aims to establish state police forces as part of President Tinubu's security reforms. Legal drafters from the Federal Ministry of Justice have started the first drafting phase, with a submission deadline extended to August 21.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/904375-state-police-presidential-panel-reviews-public-submissions-as-bill-drafting-begins.html", "state_media": false, "category": "政治", "full_text": "The Presidential Working Group on the National Policing Bill said it has started reviewing memoranda and position papers submitted by Nigerians as part of the plan to incorporate public input into the proposed legislation.\nThe proposed legislation will guide the creation of state police, a key security reform by the administration of President Bola Tinubu.\nThe submissions, received during a nationwide consultation, are being analysed alongside the ongoing drafting of the bill, according to a statement issued Thursday evening by Femi Gbajabiamila, chief of staff to President Bola Ahmed Tinubu and chairperson of the working group.\nHe said the exercise is intended to ensure that relevant recommendations and perspectives from the consultation are considered as the proposed legislation takes shape.\nThe consultation has attracted contributions from institutions, professional bodies, civil society organisations, security experts and members of the public.\nMr Gbajabiamila added that the review is simultaneously being conducted as legal drafters nominated by the Federal Ministry of Justice begin the first drafting sprint under the working group’s seven-week workplan.\nThe Policy Advisory Committee (PAC), chaired by a retired judge, Mohammed Liman, has also completed the first stage of its oversight role and provided policy direction for the drafting process, Mr Gbajabiamila added.\nPREMIUM TIMES reported that the working group extended the deadline for submission of memoranda and position papers to give the public more time to contribute. The eight-day extension expires tomorrow (21 August) at 5 p.m.\nThe proposed National Policing Bill is expected to provide the constitutional and legislative framework for a dual policing structure comprising a Federal Police Service and State Police Services.\nThis newspaper reported that the National Assembly has passed the constitutional amendment bill for state police. While the Senate passed its version in June, the House passed it in July. The ongoing review indicates that President Tinubu intends to send a fresh bill to the lawmakers.\nREAD ALSO: State Police: Former police chiefs raise concerns, submit recommendations IGP Disu\nThe framework is also expected to include institutional safeguards, accountability mechanisms and oversight arrangements for the proposed policing structure.\nThe working group chair said it would continue with the next phase of drafting after the consultation window closes, with the aim of producing a comprehensive proposal for consideration by the president and eventual transmission to the National Assembly.\nMr Gbajabiamila thanked institutions, organisations, professionals, experts and members of the public who had contributed to the consultation, saying their inputs would form an important part of efforts to develop a policing framework responsive to Nigeria’s contemporary security needs.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "memoranda", "definition": "複数の公式な記録文書または覚書。ビジネスや行政の場で、意見や情報を記録・伝達するために使用される。"}, {"word": "consultation", "definition": "専門家や関係者に意見を求めるプロセス。政策決定前に多くの関係者の視点を集めるために行われる。"}, {"word": "dual policing structure", "definition": "2つのレベルの警察制度から成る仕組み。この場合は連邦警察と州警察の両方を含む警察体制。"}, {"word": "safeguards", "definition": "不正な行為から保護するための対策や手段。制度や権力の乱用を防ぐために設けられた安全装置。"}, {"word": "transmission", "definition": "ある機関から別の機関へ情報や提案を送ること。ここでは大統領から国会への法案提出を指す。"}, {"word": "responsive", "definition": "ニーズや状況の変化に適切に対応することができるという意味の形容詞。"}]}, {"title_ja": "FEC、国立病院の改修と癌センター建設に5,400億ナイラを承認", "title_en": "FEC Approves N540bn to Upgrade National Hospital and Build Cancer Centre", "summary_ja": "ナイジェリアの連邦執行評議会は、アブジャの国立病院を四次医療機関に転換し、新しい癌治療センターを建設するために約5,400億ナイラの事業を承認しました。この投資には、神経科学研究所、モジュール式クリニック、手術室、および国立癌研究治療研究所（NICRAT）の資金が含まれており、24～36ヶ月以内の完成が予定されています。これらのプロジェクトはティンブ大統領の医療インフラ強化指令の一部であり、資金は2025年と2026年の予算配分から調達されます。", "summary_en": "Nigeria's Federal Executive Council has approved approximately N540 billion in projects to transform the National Hospital in Abuja into a quaternary healthcare institution and construct a new cancer treatment centre. The investments include funding for a Neuroscience Institute, modular clinics, theatre complex, and the National Institute for Cancer Research and Treatment (NICRAT), with completion expected within 24-36 months. These projects are part of President Tinubu's directive to strengthen healthcare infrastructure, with funding sourced from 2025 and 2026 budget appropriations.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/904378-fec-approves-n540bn-to-upgrade-national-hospital-build-cancer-centre.html", "state_media": false, "category": "社会", "full_text": "The Federal Executive Council (FEC) has approved projects worth about N540 billion to upgrade the National Hospital, Abuja, to a quaternary healthcare institution and to build a new cancer treatment centre.\nQuaternary healthcare refers to highly specialised medical care involving advanced treatment, research and management of complex conditions.\nThe approvals were disclosed by the Minister of Health and Social Welfare, Muhammad Pate, after the weekly FEC meeting on Wednesday.\nThe Personal Assistant to President Bola Tinubu on Special Duties, Kamorudeen Yusuf, shared details of the approvals in a post on X.\nThe approved projects include the construction of new facilities at the National Hospital, Abuja, a Neuroscience Institute and a new National Institute for Cancer Research and Treatment (NICRAT) facility.\nNational Hospital upgrade\nAccording to Yusuf, the council approved N18.74 million for the refitting of the hospital’s administrative block, with Visible Construction Limited awarded the contract.\nIt also approved N64.92 billion for modular clinics and a theatre complex, to be constructed by Strabbing Construction Limited.\nAnother N103 billion was approved for a new hospital wing, with CBC Global Civil Construction Limited awarded the contract.\nThe project is expected to be completed within 24 months.\nThe council further approved N69 billion for a Neuroscience Institute covering neurosurgery, radiology and rehabilitation. CBC Global Civil and Building Construction Limited was awarded the contract.\nThe approvals are part of plans to transform the National Hospital, which Pate said had lagged behind its “original vision” due to years of underinvestment since its establishment about 25 years ago.\nCancer centre\nThe largest of the approved projects is the N302.3 billion facility for the National Institute for Cancer Research and Treatment.\nYusuf said the project, awarded to CBC Global Civil and Building Construction Nigeria Limited, has a 36-month completion period.\nREAD ALSO: FG seeks African-led research, partnerships to tackle hepatobiliary cancers\nThe facility is expected to strengthen cancer research and treatment capacity in the country.\n“The projects follow President Tinubu’s directive to strengthen healthcare infrastructure nationwide, and that funding comes through National Assembly appropriations already reflected in the 2025 and 2026 budgets rather than direct ministry allocation,” Pate was quoted to have said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "quaternary", "definition": "4番目のレベルを示す形容詞で、医療分野では最も高度で専門的な医療レベルを意味します。複雑な疾患の先進的治療と研究を提供する機関に用いられます。"}, {"word": "infrastructure", "definition": "社会や産業の基盤となる施設やシステムの総称です。医療インフラはホテルや医療機器などの医療提供に必要な基本的な設備を指します。"}, {"word": "refitting", "definition": "既存の施設や建物を改装・改修することです。新しい装備や設備を整えて機能を向上させるプロセスを表します。"}, {"word": "modular", "definition": "独立した単位モジュールで構成され、柔軟に組み合わせたり拡張できる設計方式です。建築分野では独立したユニットを組み合わせて構成されることを意味します。"}, {"word": "appropriations", "definition": "政府が特定の目的のために配分する予算資金のことです。議会による予算承認と割り当てプロセスを指します。"}, {"word": "neuroscience", "definition": "脳神経系の構造と機能を研究する学問分野です。神経外科や神経疾患の治療に関連する医学的専門領域を表します。"}, {"word": "underinvestment", "definition": "必要とされる程度よりも少ない投資が行われている状態です。施設や事業が十分な資金配分を受けていないことを意味します。"}]}, {"title_ja": "APC、燃料補助金復活公約をめぐるアティク氏の必死さを非難", "title_en": "APC Accuses Atiku of Desperation Over Fuel Subsidy Restoration Pledge", "summary_ja": "APC（全進歩会議）は、元副大統領アティク・アブバカル氏が2027年の選挙当選時に燃料補助金を復活させると公約したことを批判し、以前の補助金廃止支持から政治的利益のために方針を翻したと非難しています。大統領府とFCT大臣ニョソム・ワイク氏も、この方針転換を日和見主義的かつ経済的に矛盾していると非難し、アティク氏は真の代替経済政策を欠いていると主張しています。", "summary_en": "The APC has criticized former Vice President Atiku Abubakar for pledging to restore fuel subsidies if elected in 2027, accusing him of flip-flopping for political gain after previously supporting subsidy removal. The presidency and FCT Minister Nyesom Wike also condemned the shift as opportunistic and economically inconsistent, arguing that Atiku lacks genuine alternative economic policies.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/headlines/904371-apc-accuses-atiku-of-desperation-over-pledge-to-restore-fuel-subsidy.html", "state_media": false, "category": "経済", "full_text": "The All Progressives Congress (APC) has criticised former Vice President Atiku Abubakar over his pledge to restore fuel subsidy if elected president in 2027, accusing him of abandoning his previous position on the policy for political advantage.\nThe APC National Publicity Secretary, Felix Morka, described the proposal as a desperate attempt by the presidential candidate of the African Democratic Congress (ADC) to win support ahead of the 2027 election.\nMr Morka, in a statement posted on his X handle on Thursday, said Atiku had reversed his position on fuel subsidy after previously supporting its removal ahead of the 2023 presidential election.\n“Atiku, flip-flopping in last-ditch desperation,” Mr Morka titled his statement.\nHe accused the former vice president of failing to offer an alternative economic policy and of seeking to exploit public dissatisfaction with the hardship that followed the removal of the subsidy.\n“This is desperation of the most pitiful kind,” he said, describing Atiku’s position as “an admission he is clueless and out of touch with Nigeria’s economic realities and imperatives of reform.”\nAccording to Mr Morka, the former vice president’s proposal also demonstrated what he called a lack of alternative economic ideas and an attempt to use populist promises to gain political support.\nHe said the position could ultimately contribute to what he described as Atiku’s “final defeat” in 2027.\nPREMIUM TIMES reports that the APC’s reaction came after Atiku said he would restore the petrol subsidy if elected president, while questioning how the savings from its removal had been utilised.\nThe former vice president made the pledge during a Facebook Live session in which he responded to questions on the subsidy removal and the management of funds previously spent on the scheme.\nAtiku said he had not initially opposed the removal of the subsidy but wanted the government to account for the resources that were previously used to fund it.\n“I initially did not oppose the removal of the fuel subsidy. But now that it has been removed, where is the money? Where has the subsidy money gone? Has it been used to improve healthcare, education or security?” he asked.\nHe then pledged to reverse the policy if elected.\n“If I win the presidential election, I will restore the subsidy. And anyone who stole Nigeria’s subsidy funds must return the money,” Atiku said.\nPresidency joins criticism\nPREMIUM TIMES reports that the presidency also criticised Atiku, with the Special Adviser to President Bola Tinubu on Information and Strategy, Bayo Onanuga, accusing Atiku of changing his position because of his desire to return to power.\nMr Onanuga said the former vice president had campaigned in 2023 on the position that the subsidy regime should be eliminated but had now abandoned that position.\nHe described the shift as an “opportunistic” reversal of a major component of Atiku’s previous economic position.\nThe presidential aide argued that the subsidy arrangement that existed before 2023 was no longer compatible with the country’s current petroleum-sector structure.\nAccording to him, the Petroleum Industry Act had already provided for the end of the subsidy regime by the end of June 2023, with President Tinubu only bringing forward the implementation by a few weeks after assuming office.\nMr Onanuga also rejected Atiku’s claim about savings from the subsidy, arguing that the subsidy was not money sitting in government coffers that could simply be redirected to other sectors.\nHe explained that the former system involved the government absorbing the difference between the regulated pump price and the actual cost of supplying petrol, creating significant financial obligations for the state.\nWike questions Atiku’s consistency\nThe former vice president’s proposal has also attracted criticism from the Minister of the Federal Capital Territory, Nyesom Wike.\nMr Wike questioned Atiku’s consistency, recalling that the former vice president had previously supported the removal of the subsidy.\nREAD ALSO: Presidency tackles Atiku for saying he ll restore fuel subsidy\nThe FCT minister described Atiku as a “voodoo economist” and accused him of changing his position in pursuit of political power.\n“For Atiku, who is confused is a voodoo economist. Atiku will say anything just to be president,” Mr Wike said.\nHe recalled Atiku’s position in 2022, when he supported the removal of the subsidy on the grounds that the system was fraudulent.\n“This was a man in 2022 that was going to remove the fuel subsidy because it was a fraud. Now in 2026, he was not going to remove the fuel subsidy. Is he going back to the fraud?” Mr Wike asked.\nHe said political leaders should maintain consistency when making policy proposals, particularly on issues with significant consequences for the economy and the welfare of Nigerians.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "flip-flopping", "definition": "政治的利益や状況の変化に応じて、以前の立場から急激に立場を変えることを指します。一貫性がない行動の非難的な表現として使用されます。"}, {"word": "subsidy", "definition": "政府が価格を低く抑えるため、または特定の産業を支援するために提供する財政支援のことです。ナイジェリアの場合、燃料価格を規制するために行われていました。"}, {"word": "opportunistic", "definition": "自分の利益のために状況を利用する傾向を示す形容詞です。原則や一貫性を犠牲にして、短期的な利益を求める行動を指摘する際に使われます。"}, {"word": "regime", "definition": "特定の方針や体制の一連のシステムを指します。ここでは燃料補助金制度全体の仕組みを意味しています。"}, {"word": "pump price", "definition": "ガソリンスタンドで消費者が支払う小売価格を指します。政府の補助金によって実際の供給コストより低く設定されていました。"}, {"word": "financial obligations", "definition": "政府が負うべき金銭的責任や債務のことです。補助金制度では、政府が価格差を吸収する義務がありました。"}]}, {"title_ja": "ロシア、ウクライナの防空能力の弱体化につけ込んでミサイル攻撃を強化", "title_en": "Russia Intensifies Missile Attacks Exploiting Ukraine's Air Defense Shortages", "summary_ja": "ロシアはウクライナの対空防御用迎撃ミサイルの備蓄枯渇につけ込み、ミサイル攻撃を激化させている。ウクライナの防空体制が対応に苦しむ中、攻撃の激化により民間人の死傷者が増加している。", "summary_en": "Russia is escalating its missile barrage against Ukraine, capitalizing on the country's depleted inventory of air defense interceptors. The intensified attacks are resulting in increased civilian casualties as Ukrainian defenses struggle to counter the onslaught.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/20/world/europe/ukraine-kyiv-missiles-russia-war.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIが人間の雇用を生み出すインドの都市", "title_en": "The Indian City Where AI Is Creating Jobs for Humans", "summary_ja": "南インドの小都市では、急速に成長するデータ注釈分野で多くの労働者が雇用を見つけています。これらの労働者は、人間が伝統的に行ってきたタスクの実行方法を改善するために、人工知能システムを訓練しています。", "summary_en": "In a small city in south India, workers are finding employment in the rapidly growing field of data annotation. These workers train artificial intelligence systems to improve how AI performs tasks that were traditionally done by humans.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/20/world/asia/ai-jobs-data-annotation-india-karur.html", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランと米国が緊迫した膠着状態に、外交交渉は停滞", "title_en": "Iran and U.S. in Tense Standoff as Diplomatic Progress Stalls", "summary_ja": "イランとアメリカは過去数週間、外交的進展がない中で不安定な膠着状態が続いており、どちらも全面的な軍事衝突には至っていない。双方とも相手よりも長く耐えられると確信しているようで、緊張と自制のバランスが微妙に保たれている。", "summary_en": "Iran and the United States remain locked in an uneasy standoff with no diplomatic breakthroughs in recent weeks, yet neither side has escalated to full-scale military conflict. Both nations appear confident they can outlast the other, creating a precarious balance between tension and restraint.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/20/world/middleeast/iran-us-war-standoff-hormuz.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事ゾーン通過を許可、パレスチナ人がガザ北部に帰還", "title_en": "Palestinians Return to Northern Gaza After Israeli Military Allows Crossing", "summary_ja": "イスラエルがガザを二分する軍事ゾーンの通過をパレスチナ難民に許可した。これは人質解放交渉の膠着状態が打開された後の動きである。数千人のガザ住民が徒歩でガザ北部への帰還を開始している。", "summary_en": "Israel has permitted displaced Palestinians to cross through a military zone that divides Gaza following a breakthrough in hostage release negotiations. The movement marks a significant shift after a deadlock in ceasefire talks. Thousands of Gazans are now able to return to the northern part of the enclave on foot.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "China's Leading Developer Reports Massive Loss Amid Widening Property Crisis", "summary_ja": "中国最大級の不動産開発企業ワンケ（万科）が巨額の損失を報告し、不動産危機が小規模企業を超えて深刻化していることが明らかになった。同社の財務上の問題は業界全体への波及効果の可能性を示唆し、中国当局による国家介入の必要性に関する疑問が生じている。", "summary_en": "Vanke, one of China's largest property developers, has reported a significant loss, signaling the deepening of the real estate crisis beyond just smaller firms. The company's financial troubles raise questions about potential contagion across the sector and whether Chinese authorities will provide state intervention to stabilize the market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による砲弾の破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From October 7 Attack", "summary_ja": "解放されたイスラエル人人質の中には、10月7日の攻撃による砲弾の破片が体内に埋め込まれたままの者がいる。イスラエルの医療当局者によれば、複数の女性が長期間隔離状態で拘束され、約8ヶ月間トンネルに閉じ込められていた。この発見は、人質たちが捕虜中に被った深刻な身体的外傷を浮き彫りにしている。", "summary_en": "Some of the released Israeli hostages remain in medical care with shrapnel embedded in their bodies from the October 7 attack. According to Israeli medical officials, several women were held in isolation for extended periods and spent approximately eight months confined in tunnels. The discovery highlights the severe physical trauma endured by hostages during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "迎撃ミサイルが枯渇したときに何が起こるのか", "title_en": "What Happens When Interceptor Missiles Run Out", "summary_ja": "ウクライナおよび他国は防空迎撃ミサイルの深刻な不足に直面しており、航空攻撃に対する防御能力について懸念が高まっている。供給危機は軍幹部と政策立案者の間で広範な警戒感を引き起こしている。この不足は進行中の紛争における防御能力に大きな影響を与える可能性がある。", "summary_en": "Ukraine and other nations face a critical shortage of air defense interceptor missiles, raising concerns about their ability to defend against aerial attacks. The growing supply crisis is causing widespread alarm among military officials and policymakers. This shortage threatens to significantly impact defensive capabilities in ongoing conflicts.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エコノミスト、パーソナライズされた新しいニュースレターを導入", "title_en": "The Economist Launches Personalized Newsletter Service", "summary_ja": "エコノミスト誌は、購読者の個人的な関心に合わせてカスタマイズされた記事リストをメールで配信する新しいニュースレター「The Economist for You」を開始しました。このサービスは、各読者の好みや興味に基づいたコンテンツを提供することを目的としています。デジタルサービスの拡充により、読者とのエンゲージメント向上を実現しています。", "summary_en": "The Economist has introduced a new personalized newsletter called 'The Economist for You,' designed to deliver customized reading lists directly to subscribers' inboxes. The service aims to provide readers with content tailored to their individual interests and preferences. This addition enhances The Economist's digital offering and engagement with its audience.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/introducing-our-latest-newsletter-the-economist-for-you", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブームがアメリカの慈善活動を再編成", "title_en": "Silicon Valley's AI Boom Is Remaking American Charity", "summary_ja": "シリコンバレーのAI創業者らが数千億ドルの寄付を誓約しており、アメリカの慈善活動の風景を大きく変える可能性がある。この記事は、これらの莫大な資金がどのように配分され、慈善寄付にどのような影響を与えるかを検証している。これらの誓約が実現するかどうか、そして資金がどの程度効果的に配分されるかについては、疑問が残っている。", "summary_en": "AI founders in Silicon Valley are pledging to donate hundreds of billions of dollars to charitable causes, potentially transforming the philanthropic landscape. The article examines how these massive commitments will be allocated and what impact they may have on American charitable giving. Questions remain about whether these pledges will materialize and how effectively the funds will be deployed.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タリバンの偽善：獄中で女性を虐待する一方で道徳を説く", "title_en": "Taliban's Hypocrisy: Preaching Morality While Stripping Women of Rights in Prison", "summary_ja": "アフガニスタンのタリバン政権は家庭内暴力と児童婚を合法化する新たな法令を発令し、事実上法律を女性と少女に対抗させている。純潔と道徳を標榜しているにもかかわらず、政権は女性囚に対する虐待行為が記録されている。アフガニスタンの女性はタリバン支配下で体系的な法的迫害に直面している。", "summary_en": "The Taliban regime has issued new decrees that legalize domestic violence and child marriage in Afghanistan, effectively turning the law against women and girls. Despite claiming to uphold purity and morality, the regime has been documented engaging in abusive practices against female prisoners. Afghan women now face systematic legal persecution under Taliban rule.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/summer-reads/article/2026/08/20/the-taliban-preach-purity-and-morality-but-rush-to-strip-women-in-prison-a-land-of-terror-for-afghan-women_6756711_183.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランスの防衛装備輸出、2025年に218億ユーロの過去最高を維持", "title_en": "French Arms Exports Hit Record €21.2 Billion in 2025", "summary_ja": "フランスは2025年の防衛装備輸出で218億ユーロの過去最高水準を維持し、前年と同額を記録した。インドへのラファール戦闘機販売とミサイル輸出の増加が主な要因となっている。これはグローバル防衛装備市場におけるフランスの継続的な優位性を示している。", "summary_en": "France maintained its record arms export levels in 2025, reaching €21.2 billion, matching the previous year's total. The surge was driven primarily by Rafale fighter jet sales to India and increased missile exports. This demonstrates France's continued dominance in the global defense equipment market.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/economy/article/2026/08/20/french-arms-exports-remain-at-record-highs-in-2025_6756706_19.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランスのサイバーセキュリティ問題は強力な政治的意志が必要", "title_en": "France's Cybersecurity Challenge Requires Long-Term Political Commitment", "summary_ja": "フランスはセバスチャン・ルコルヌ首相による短期的な対策では対応できない深刻なサイバーセキュリティの脆弱性に直面している。国防体制の強化には多大な投資、長期的な取り組み、そして継続的な政治的意志が不可欠となる。", "summary_en": "France faces significant cybersecurity vulnerabilities that go beyond temporary government measures announced by Prime Minister Sébastien Lecornu. Strengthening national defenses will require substantial investment, sustained effort, and unwavering political will over an extended period.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/pixels/article/2026/08/20/france-s-cybersecurity-problem-demands-strong-political-will_6756709_13.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省からの最新情報", "title_en": "Ministry of Defence Updates", "summary_ja": "国防省（Mindef）が新しい情報と更新内容をリリースしました。購読者はストレーツ・タイムズの購読ポータルを通じてニュースレター設定を管理できます。防衛関連の最新動向についての最新情報をご覧ください。", "summary_en": "The Ministry of Defence (Mindef) has released new information and updates. Subscribers can manage their newsletter preferences through The Straits Times subscription portal. Stay informed about the latest defence-related developments.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニングアップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニングアップデート・ニュースレターは、毎日のニュースハイライトと最新情報を提供します。読者はサブスクリプション設定を管理し、ストレーツ・タイムズから追加の無料ニュースレターに登録できます。", "summary_en": "The Straits Times Evening Update newsletter provides daily news highlights and updates. Readers can manage their subscription preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズが購読者向けの日刊朝刊ニュース更新を配信しています。このブリーフィングは、その日の重要なニュース報道と主要な情報を提供しています。読者は提供されたリンクを通じてニュースレター購読を管理できます。", "summary_en": "The Straits Times delivers daily morning news updates to subscribers. This briefing provides essential news coverage and key information for the day ahead. Readers can manage their newsletter subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ベングリオン空港、混乱による運航停止後に便の運航を段階的に再開", "title_en": "Ben-Gurion Airport Resumes Flights After Chaotic Standstill", "summary_ja": "イスラエルのベングリオン空港は、大規模な混乱による運航停止の後、段階的に飛行運航を再開している。同空港は遅延した乗客の対応と運航スケジュールの正常化に向けて取り組んでいる。", "summary_en": "Ben-Gurion Airport in Israel is gradually restoring flight operations following a significant disruption that caused widespread chaos. The airport is working to normalize schedules and accommodate the backlog of delayed passengers.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiigJBVV95cUxOcUZ2Q0hUb05lOVBKRnJtX1MyUnZlNjUzakZ0WXBlZnE4SmZiX2dudmE1V1E3amRFcnZrYUt1WUhaX1ZSd2s1VWxpdlhSYi1MNWxJQlpSLWZkMWxkR09iYURfc1pEX2VWWlM0M2p0cnF5NjU2SnFNdXh2TVdGOE12LVN6Z01CNzNERTlMa3dsWkpYRktfN3VMUnRTT0lXM29nRTdyTXA5VFdvSFRxNEZERTFnQzRzTklsQ2tMWTFqblVsY1JVdlRzd0NKSVBLTWVMUXFIMHRXWVFoUmZtSk9ITWJuUzNnTWU1aE9pRTBGYjZUZWxGMHpLUWxYeVY3ME5aN0c4d0N4eGw4UQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフを支援する人物が2つのプロパガンダ活動の背後にいることが明かされた", "title_en": "Netanyahu Backer Behind Two Propaganda Initiatives Revealed", "summary_ja": "ハアレツは、ネタニヤフ首相を支援する目立たない支援者が2つの主要なプロパガンダ活動を支援していることを調査している。この報告書は、謎の人物とイスラエル首相のコミュニケーション戦略を結びつける財務的および組織的なつながりを明らかにしている。調査は、これらの活動がどのように公共の物語を形成しているかを明かしている。", "summary_en": "Haaretz investigates a discreet Netanyahu supporter who has been backing two major propaganda initiatives. The report exposes the financial and organizational connections linking the mysterious figure to the prime minister's communications strategy. The investigation reveals how these initiatives have been shaping public narratives.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijwJBVV95cUxQUEFOblpNLThhQnNXNmxYTndmUXVWOW85NFBXbV9kVEpuX0N2MllidGlUZS1sSXBZUGJEYy0zLThDTGo5QktGbGdiMlh6c3dLTWwtc0lLeU5maFNXRmxqMTdYRmxXd25EMk9hWWY3cm00Y2lhb1FZVjZCdUUtOFVKVTlmRjIzU3ByZ2I3Y0JVd2NYNE5pQ3ZMeG1zd0NyekhVMTdkZkZ2V2NkLUpodWNIbW1ZUzFzSUJwaC1XWmxkajVwbEwxdFE1cTVCUlpyMklPOFJvcjZMYlJiYWtVVVRhRWZtdDhDa3pzRWMyZ080Vm9OQS01MXctdDFHYjBPelNnOVY2cUxydDRpMlpJRnFN?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフの中東に関する計画", "title_en": "Netanyahu's Plan to Pulp the Middle East", "summary_ja": "ハアレツがネタニヤフの中東政策に対する戦略的アプローチを検証しています。この記事は提案された計画の潜在的な地域的影響を分析しています。", "summary_en": "Haaretz examines Netanyahu's strategic approach to Middle East policy. The article analyzes potential regional implications of the proposed plans.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi8AFBVV95cUxOUHhQMG9fM3E3dGhPVkVidnlIRFA0aE1QblhDTW0xcWp6RWNYMkV3SlZtOFJBMGlUbUlUaFZuYzhrQzhzTzNON1FzZ2hKSEFFdHBIbzBQb0N5eWY0QS0ySDI2enRaeUw0ZkFWcVFOVzRvWXlPYTFoOFJLNzZnMzh0WTRPUUZjVWdNMlh2cGhvN2pVWUE5X2ZkSE1KdmRYR016bEp4ZnFGYlJhOWFYZXN1cEYtRHdCZk1sX1YtOWpLbWtPT05rUWFQUklydmdnSHZDSGdCQjhWalhVcW5JRTZYWTJOLXZDWkpYRnFybVpJc3M?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、2027年度予算に1万台湾ドルの全国民給付金を含める", "title_en": "Taiwan to Include Universal NT$10,000 Cash Handout in 2027 Budget", "summary_ja": "台湾の頼清徳総統は、2027年度予算に全国民を対象とした1万台湾ドルの給付金を含める計画を発表した。この経済対策は家計を支援し、消費拡大を促進することを目的としている。政府の経済支援と国民福祉への取り組みを示すものである。", "summary_en": "Taiwan's President Lai has announced plans to include a universal NT$10,000 cash handout for all citizens in the 2027 budget. This stimulus measure aims to support households and boost consumer spending. The decision reflects the government's commitment to economic relief and public welfare.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE05XzRjUDdhQzJtSTNnVkJTdllxbHUxbkpHbXNIYUROOFJya08xcWRQdWVWcU9UTkd3bHVnYWR5ZjAxazZxYTdlUXlldFdIZkFPNTRmdHJkQQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾へ向かう最初の2機のF-16V戦闘機", "title_en": "First Two F-16V Fighter Jets En Route to Taiwan", "summary_ja": "台湾は初めての2機のF-16V戦闘機を受け取ることになり、防空能力の大幅な強化となります。この最先端航空機は地域の安全保障懸念が続く中、島国へ向かっています。この納入は台湾のより広範な軍事近代化努力の一部です。", "summary_en": "Taiwan is set to receive its first two F-16V fighter jets, marking a significant strengthening of its air defense capabilities. The advanced aircraft are en route to the island nation amid ongoing regional security concerns. This delivery is part of Taiwan's broader military modernization efforts.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9iLTFXZ0JxaTNsWDJ3SE1YVlFjbHZfdUtZZzJXempfUlA0RVFkN0VQQWRPN2FLeFdKanRpTmhFOFdmN2x4c1VJOUdfbE9UMHJndVlKSnVCaw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "野党・国民党、頼清徳総統の1万台湾ドル現金配給で「ダブルスタンダード」を非難", "title_en": "KMT Accuses President Lai of 'Double Standard' Over NT$10,000 Cash Handout", "summary_ja": "野党の国民党は、1万台湾ドルの現金配給プログラムに関して頼清徳総統がダブルスタンダードを適用していると批判した。野党は、この政策が総統の過去の財政責任に関する立場と矛盾していると主張している。この紛争は、経済政策をめぐる与野党間の継続的な政治的緊張を浮き彫りにしている。", "summary_en": "The KMT party has criticized President Lai Ching-te for applying a double standard regarding a NT$10,000 cash handout program. The opposition party argues that the policy contradicts the president's previous positions on fiscal responsibility. The dispute highlights ongoing political tensions between the ruling and opposition parties over economic policies.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE15X05tSHNKeU51ZWlSZjVkeFZiYzZ4S2FCaXVMVllrWVlUMkpuVEtTM0VnT1ZnMm0zeTExSE1PS0J1dElXVWZFa3Y4MjZ4V3BOWi1Rb0YyZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ソウル、米国による合同演習削減について事前通知を受けていないと述べる", "title_en": "Seoul Says It Received No Prior Notice of US Joint Drill Cuts", "summary_ja": "CGTNは、韓国の趙兌龍外交部長官がトランプ米大統領のソーシャルメディアを通じて韓米軍事演習削減について知ったと報じている。CGTNは、ソウルが米国からの削減決定について事前通知を受けなかったと報じている。この事態は、軍事問題に関する両同盟国間のコミュニケーションについての懸念を浮き彫りにしている。", "summary_en": "CGTN reports that South Korean Foreign Minister Cho Hyun learned about cuts to South Korea-US military drills through US President Donald Trump's social media posts, rather than through official channels. CGTN reports that Seoul received no advance notification from Washington regarding the decision. The incident highlights concerns about communication between the two allied nations on military matters.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-19/Seoul-says-it-received-no-prior-notice-over-joint-drill-cuts-from-US-1PJGYul4aM8/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「China Crafted」展がシンガポールで中国の物質文化を紹介", "title_en": "China Crafted Exhibition Showcases Chinese Material Culture in Singapore", "summary_ja": "CGTNが報じるところによると、シンガポールのチャイナタウン図書館で今月『China Crafted』という展覧会が開催されており、貸出カウンター近くのテレビ画面で数世紀にわたる中国の歴史と物質文化の旅が紹介されている。この展示会は、伝統的な中国工芸と文化遺産の豊かさを強調することを目的としている。", "summary_en": "CGTN reports that an exhibition called 'China Crafted' is being displayed at Singapore's Chinatown Library this month, featuring a television presentation near the borrowing stations. The exhibition offers viewers a journey through centuries of Chinese history and material culture. The showcase aims to highlight the richness of traditional Chinese craftsmanship and cultural heritage.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-19/China-Crafted-showcases-Chinese-material-culture-in-Singapore-1PJI7oXZ41G/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グローバルサウスの声：一帯一路構想", "title_en": "Global South Voices: Belt and Road Initiative Impact and Achievements", "summary_ja": "CGTNは、本番組でジャーナリストと専門家が一帯一路構想の広範な影響について議論していると報じています。CGTNは、近年における同構想を通じた具体的な成果が検討されていると報じています。番組は、この構想の影響についてのグローバルサウスの視点を特集しています。", "summary_en": "CGTN reports that journalists and experts discuss the wide-ranging impacts of the Belt and Road Initiative in this program edition. CGTN reports that the discussion reviews concrete achievements delivered through the initiative in recent years. The program features perspectives from Global South voices on the initiative's effects.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-17/Global-South-Voices-Belt-and-Road-Initiative-1PGATQVJaMg/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国連事務総長候補者がウクライナ紛争での中立性を表明", "title_en": "UN Secretary-General Candidate Declares Neutrality on Ukraine Conflict", "summary_ja": "TASS/RTは、国連事務総長の候補者であるイボンヌ・A・バキが、ウクライナ紛争に関する中立性を表明したと報道している。同メディアによれば、A・バキ氏は最終的な解決に向けては双方が一定の譲歩を行う必要があると述べたという。", "summary_en": "TASS/RT reports that Yvonne A-Baki, a candidate for UN secretary-general, has declared neutrality regarding the Ukraine conflict. According to the source, A-Baki stated that both sides would need to make certain concessions to reach a final settlement.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2175825", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国連事務総長候補、ウクライナのNATO不参加合意を提案", "title_en": "UN Secretary-General Candidate Proposes Ukraine NATO Abstention Agreement", "summary_ja": "TASSによると、国連事務総長候補のイボンヌ・A・バキ氏は、ウクライナがNATO加盟を控える合意を提案している。報道によれば、A・バキ氏はロシアとウクライナが国連を通じた直接対話に応じるべきだと考えている。この提案は紛争解決への潜在的な道筋として位置づけられている。", "summary_en": "TASS reports that UN secretary-general candidate Yvonne A-Baki has proposed an agreement where Ukraine would abstain from NATO membership. According to the source, A-Baki believes Russia and Ukraine should engage in direct talks through the United Nations. The proposal suggests this arrangement as a potential path toward resolving the conflict.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2175817", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツ人ジャーナリスト、ロシア内務省の指名手配リストに掲載", "title_en": "FAZ Journalist Martens Listed on Russian Interior Ministry Wanted List", "summary_ja": "TASS/RTによると、フランクフルター・アルゲマイネ・ツァイトゥング紙のドイツ人ジャーナリスト、ディルク・マルテンス氏がロシア内務省の指名手配リストに掲載されたと報じている。ロシアの国営メディアによれば、この掲載はロシア刑法の条項違反を理由としているが、具体的な容疑は詳細に報じられていない。", "summary_en": "TASS/RT reports that German journalist Dirk Martens of Frankfurter Allgemeine Zeitung has appeared on Russia's Interior Ministry wanted list. According to the state-controlled sources, the listing cites violations of Russian Criminal Code articles, though specific charges were not detailed in the report.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2175815", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパはいかにして1兆ユーロを節約し、AI競争に勝つことができるか", "title_en": "How Europe Can Save a Trillion Euros and Win the AI Race", "summary_ja": "著者は、AIで競争するためのヨーロッパ戦略はアメリカの最先端AIラボを追求することではなく、潜在的なアクセス制限から生き残るための独立したインフラと訓練能力を構築することに焦点を当てるべきだと主張している。米国によるAnthropicの高度なAIモデルへの輸出規制は、ヨーロッパの脆弱性とAI開発における戦略的自給自足の必要性を強調している。", "summary_en": "The author argues that Europe's strategy to compete in AI should not focus on chasing American frontier AI labs, but rather on building independent infrastructure and training capabilities to survive potential access restrictions. The US export controls on advanced AI models, exemplified by Anthropic's forced model disabling, underscore Europe's vulnerability and the need for strategic self-sufficiency in AI development.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/eu-ai-strategy-that-lays-foundations-for-multiple-technological-futures-by-eric-hazan-et-al-2026-08", "state_media": false, "category": "オピニオン", "full_text": "How Europe Can Save a Trillion Euros and Win the AI Race\n, , and\nIf the risk Europe faces is losing access to frontier AI models, the solution is not necessarily to chase the labs that created them in the hopes of eventually pulling ahead. Instead, it is to build the capacity to make surviving that loss possible, such as by investing in AI infrastructure and training capabilities.\nPARIS—On June 12, the US Department of Commerce informed Anthropic that it had to secure an export license for any foreign person, inside or outside the United States, to access its two most advanced AI models. This left the firm with no choice but to disable Fable 5 and Mythos 5 for everyone, with no advance warning. While the US lifted the order on June 30, apparently satisfied that Anthropic had addressed the security risk, European businesses, governments, and researchers had by then spent 18 days using older models, with no knowledge of when they might regain access.", "translation_ja": "", "vocab": [{"word": "frontier", "definition": "最新の、最先端の。テクノロジーやビジネス分野で、最も先進的で革新的な領域を指す。"}, {"word": "export license", "definition": "輸出許可証。政府が特定の製品やサービスの輸出を規制・許可する際に必要とされる公式文書。"}, {"word": "infrastructure", "definition": "インフラストラクチャー。産業や社会の基盤となるシステムや施設。ここではAI開発の基盤を指す。"}, {"word": "self-sufficiency", "definition": "自給自足、自立。他国に依存せず、自力で必要なものを賄える能力や状態。"}, {"word": "vulnerability", "definition": "脆弱性、弱点。攻撃や悪影響を受けやすい状態または特性。"}]}, {"title_ja": "多国間開発銀行が新たなグローバル安全資産となりつつある", "title_en": "MDBs Are Becoming a New Global Safe Asset", "summary_ja": "多国間主義が危機に瀕している中でも、多国間開発銀行は米国債と同等の低コストで借入できる能力により成長し続けており、事実上のリスクフリー資産の新しい種類を生み出している。この展開は、地政学的な緊張が従来の多国間機関を脅かしている最中でも、グローバル金融システムの安定化要因となる可能性がある。", "summary_en": "Despite challenges to multilateralism, multilateral development banks are thriving by borrowing at rates comparable to US Treasury bonds, effectively creating a new class of risk-free assets. This development provides a potential stabilizing force for the global financial system even as geopolitical tensions threaten traditional multilateral institutions.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/mdb-risk-free-assets-with-spreads-close-to-treasuries-and-strong-demand-by-erik-berglof-2026-08", "state_media": false, "category": "オピニオン", "full_text": "MDBs Are Becoming a New Global Safe Asset\nEven as multilateralism faces an existential threat, multilateral development banks are not only surviving but thriving. Thanks to MDBs’ ability to borrow at costs close to that of the US Treasury, they have created a new class of de facto risk-free assets that could help underpin the global financial system.\nBEIJING—Despite all the geopolitical chaos, one can still find some comfort in today’s capital markets. The walls of the multilateral order may be cracking, but in the quiet corners of global finance, a remarkable counternarrative is unfolding: multilateral development banks are not only surviving but thriving. Thanks to MDBs’ ability to borrow at costs close to that of the US Treasury, they have created a new class of de facto risk-free assets that could help underpin the global financial system.", "translation_ja": "", "vocab": [{"word": "multilateralism", "definition": "複数の国が協力して国際問題を解決する主義または体制。政治経済において各国が同等の立場で連携することを指す。"}, {"word": "underpin", "definition": "何かを支える、または基礎となる。比喩的に、制度や理論の根底にある支持や基盤を表す。"}, {"word": "geopolitical", "definition": "地理的な位置と政治的・軍事的な力関係が結びついた国際関係。各国の地域的利益と権力争いに関連する。"}, {"word": "de facto", "definition": "法律上ではなく、実質的に、事実上という意味。実際の状況や実務的な現実を示す。"}, {"word": "existential threat", "definition": "存在そのものを脅かす深刻な危機。組織や制度の継続性を根本から危うくする脅威。"}]}, {"title_ja": "米国債市場が揺らいでいる理由", "title_en": "Why US Bond Markets Are Trembling", "summary_ja": "著者は、米国債市場の最近の弱さを、インフレの軟化と経済指標の変化と一致する市場シグナルとして真摯に受け止めるべきだと主張している。著者は、米国市場の世界的な金融の中心としての役割の喪失を示唆するのではなく、債券弱化が世界的な市場低迷と関連していることから、米国固有の問題ではなく構造的な問題を示唆していると指摘している。", "summary_en": "The author argues that recent weakness in US bond markets should be taken seriously as a market signal, particularly given concurrent softening in inflation and economic indicators. Rather than signaling a loss of the US market's role as a global financial anchor, the author notes that bond weakness correlates with broader global market declines, suggesting systemic rather than US-specific issues.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-bond-markets-2026-reasons-for-concern-by-jim-o-neill-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Why US Bond Markets Are Trembling\nWhat is the apparent fragility in the US bond market telling us? Since markets tend to be less wrong than those who comment on them regularly, their signals must be taken seriously, especially when they coincide with a relative softening in US inflation figures and other high-frequency economic indicators.\nLONDON—As we approach the end of the northern summer, often a volatile period for financial markets, all eyes are on the apparent fragility of US bonds. Some observers will say that sustained weakness is a sign that the US market is losing its role as the anchor of the global financial system. Yet there is little evidence of this happening. On recent days when US bonds have traded especially poorly, so, too, have other markets around the world.", "translation_ja": "", "vocab": [{"word": "fragility", "definition": "脆さ、もろさ。金融市場の文脈では、市場や金融システムが外部ショックに対して非常に弱い状態を意味します。"}, {"word": "anchor", "definition": "錨、支柱。ここでは世界金融システムの安定性と信頼性を支える中心的な役割を指します。"}, {"word": "coincide", "definition": "同時に起こる、一致する。複数の出来事や指標が同じ時期に同じ方向の動きを示すことを意味します。"}, {"word": "high-frequency indicators", "definition": "高頻度経済指標。毎日または毎週など短期間に更新される経済統計で、景気の現状をリアルタイムで反映します。"}, {"word": "sustained", "definition": "持続する、継続する。一時的ではなく、ある期間継続して続く状態を表します。"}]}, {"title_ja": "トランプ大統領のMMR行政命令は医学的根拠なく児童を危険にさらす", "title_en": "Trump's MMR Order Endangers Children Despite His Rhetoric", "summary_ja": "ガーディアン編集部は、麻疹・おたふく風邪・風疹ワクチンの単独接種を推奨するトランプ大統領の行政命令を医学的根拠がなく危険だと批判している。この動きは1998年の信用を失ったアンドリュー・ウェイクフィールドの論争を彷彿とさせ、麻疹が流行した経緯があり、結合型MMRワクチンが安全で効果的であるというファイザーやメルク社および専門家の合意に反している。", "summary_en": "The Guardian Editorial criticizes Trump's executive order promoting separate measles, mumps, and rubella vaccines as medically unfounded and dangerous. The move echoes the discredited 1998 Andrew Wakefield controversy that caused measles outbreaks, and contradicts pharmaceutical companies' and health experts' consensus that the combined MMR vaccine is safe and effective.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/20/the-guardian-view-on-trumps-mmr-executive-order-endangering-the-children-he-claims-to-care-about", "state_media": false, "category": "オピニオン", "full_text": "Nobody wants to hurt a child. The howl of pain, the tears, the look of betrayed shock all make it very hard to deliver a cherished small person to the needle-wielding nurse. But that’s part of being a responsible parent. It becomes a lot tougher if mum or dad is being fed mixed and erroneous messages about the benefits and harms of vaccination.\nParents have to make a lot of decisions about what’s right for their child, from the school they should go to and the food they should eat to the hours they should spend on the phone or watching TV. In the US, Donald Trump wants them to add another: do they choose to give their children separate jabs against measles, mumps and rubella, involving six visits to the clinic, or should they opt for the combined MMR vaccine, which does the job in two? For decades, the vast majority of families have been taking the advice of doctors, accepting their assurance that the MMR vaccine is safe and very effective. But what are they to think when a US president announces that the triple jab could be “quite lethal” and signs an executive order advising states to offer separate vaccines?\nFor the moment, what Mr Trump is proposing is an empty choice. The individual vaccines are not available. They have not been widely used in decades. In the US and in the UK, they don’t have a licence, and to get one, pharma companies such as GSK and Merck & Co would probably have to run new clinical trials to prove that they work and are safe, which would take years. Both have already said that no published scientific evidence supports splitting the MMR vaccine into single shots. They are not rushing to invest in making them, for all the US president’s enthusiasm.\nBut we are likely to see a rerun of the furore and distress in 1998 caused by Andrew Wakefield, the British gastroenterologist (not an infectious diseases specialist) who declared that the MMR vaccine was linked to the gut disorder Crohn’s disease and thence to autism. His evidence-free advice was for parents to seek separate vaccines. As now, they were not readily available, so many children went without. Measles vaccination levels dropped alarmingly and measles cases rose.\nStruck off as a doctor, Mr Wakefield now lives in Texas, hero-worshipped by vaccine sceptics, and his views are embraced by all those suspicious of or hostile to the medical and scientific establishment, including the president and his health secretary, Robert F Kennedy Jr. They fit an anti-science agenda that has recently seen the pursuit by a congressional committee of Dr Anthony Fauci, who led the US response to Covid-19 and is now being accused of covering up its origins.\nMr Trump and RFK Jr already aim to shrink the vaccine schedule in the US from 18 to 11 shots, citing Denmark, where fewer vaccines are given to young children. But Denmark offers universal high-quality healthcare and excellent screening programmes to pick up those at risk. The US does not, and children fall through the cracks.\nNo other country recommends single measles, mumps and rubella vaccines. But such is the confusion that some parents are likely to take away the message that the combined jab is unsafe – and that no jab is a better choice. President Trump is putting at risk the very “beautiful, healthy, lovely, delicate little children” that he claims to care about.\nDo you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": [{"word": "erroneous", "definition": "誤った、間違った。医学情報や事実に基づかない情報のことを指す。"}, {"word": "furore", "definition": "激怒、激怒した反応。社会的な大騒ぎや論争を指す。"}, {"word": "struck off", "definition": "（医師などの専門家資格を）剥奪する。医師免許取り消しを意味する。"}, {"word": "vaccine skeptics", "definition": "ワクチンに対して懐疑的な人々。医学的根拠なくワクチンの安全性や必要性に疑問を持つ人。"}, {"word": "anti-science agenda", "definition": "科学や医学的証拠に対抗する政治的・思想的立場。科学的根拠を無視する方針。"}]}, {"title_ja": "トランプの数十億ドル：良心と貪欲さの問題", "title_en": "Trump's Billions: A Question of Conscience and Greed", "summary_ja": "フランシーン・プローズは、トランプが2024年以降に蓄積した20億ドル以上は実質的な必要性ではなく純粋な貪欲さを反映していると主張し、イメルダ・マルコスの過度な支出と比較しています。彼女は、普通のアメリカ人が経済的に苦労している一方で、富を誇示する男を支持する支持者たちに疑問を呈し、ディケンズの『クリスマス・キャロル』のような道徳的な清算を求めています。", "summary_en": "Francine Prose argues that Trump's accumulation of over $2 billion since 2024 reflects pure greed rather than any practical need, comparing his behavior to Imelda Marcos's excessive spending. She questions how supporters can back a man who flaunts wealth while ordinary Americans struggle financially, and calls for a moral reckoning similar to Dickens's A Christmas Carol.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/20/trump-money-earnings-billionaires", "state_media": false, "category": "オピニオン", "full_text": "Many years ago, in the crowded corridor of a Manhattan hotel, I was surprised to find myself standing face-to-face with Imelda Marcos, then the first lady of the Philippines. At that time, she was said to possess 3,000 pairs of shoes.\nI desperately longed to ask the wife of the dictatorial president Ferdinand Marcos why anyone could need all those shoes. And more importantly, why would someone spend so much of her country’s wealth on stiletto heels when so many citizens were so desperately poor? But natural reticence, good manners or simply fear prevailed, and I walked away.\nI’m fairly certain that Donald Trump’s shoe closet doesn’t come anywhere near the size and grandeur of Imelda Marcos’s, and yet the questions I wanted to ask her are very much like the ones I now would like to ask anyone who will listen.\nSince his re-election in 2024, Donald Trump has earned more than $2bn. Much of it comes from his cryptocurrency ventures. Some derives from the sale of a range of Trump-themed memorabilia: hats, watches, Bibles.\nUnsurprisingly for a man who used the small fortune he inherited from his real estate mogul father to finance a real estate empire of his own, he owns golf courses and clubs, national and international luxury properties, and leases that provide a significant chunk of his wealth.\nA reported $117m came from legal settlements alone. According to Yahoo finance, his total net worth varies between $6.4bn and $6.5bn, depending on how the markets are doing that day.\nSo here’s a variation on my question for Mrs Marcos: why would anyone need so many billions of dollars? It’s more than anyone could ever spend on shoes. It can’t be about acquiring some shiny new toy or property. All that money can buy the biggest estates and yachts, a gargantuan wardrobe of blue suits and weirdly long red ties.\nSo the drive and the thrill must all be about acquisition, accumulation. After all, greed is one of the seven deadly sins. It’s all about the numbers, the power and success that those numbers signify. It’s no longer about how those numbers translate into comfort or pleasure.\nPerhaps it’s partly because of some delusional idea that vast wealth can make you immortal. The more you have in the bank, the greater your chances of living for ever.\nIt would be hard to distinguish the amount of money that Trump had honestly acquired from the sums that one imagines flow through loopholes and into his accounts from various elaborate, borderline-legitimate deals.\nWe have learned some hard lessons about the fragility of some money-making strategies, the cryptocurrency market that can falter and fail, wiping out the hard-earned savings of smaller investors, while those at the top continue to prosper.\nThe more urgent question is a version of the second one I wanted to ask Imelda Marcos. How can you, in good conscience, continue to amass so much disposable wealth when so many everyday Americans are struggling to fill their gas tanks and avoid losing their homes?\nBy now we know that charity, generosity and compassion – and conscience – are virtues that our president doesn’t seem to have even in trace amounts.\nIt’s impossible to imagine him following the examples set by billionaires such as Melinda Gates and Mackenzie Scott, who have pledged and made huge contributions to good causes.\nClosely related to the mystery of why one man thinks he deserves and needs so much is the question of how anyone who has ever returned a grocery item back to the shelves after some bad news at the checkout counter can support a man who flaunts his extreme wealth and ignores their worsening hardships.\nThe only answer I can see is that Trump’s fortune is aspirational. It’s an aspect of the American dream that, despite the evidence, people still hope to attain. If Trump amassed those billions, maybe we can, too. The sad truth is that the income gap keeps widening between ordinary American families and the billionaires who make the decisions that affect our lives.\nEvery December, faculty members at the college where I teach read Charles Dickens’s A Christmas Carol aloud, section by section, to a group of students and colleagues. Each year we laugh and cry together as the three ghosts – representing the past, the present and the future – visit the miserly Ebenezer Scrooge and terrify him into changing his selfish ways.\nI tear up whenever Tiny Tim, the disabled, ill little boy, “did not die” presumably because of Scrooge’s help.\nI guess it’s too much to pray for a chain-clanking ghost awakening Donald Trump to the loneliness and grief that he, like Scrooge, may face. Let’s hope that and work so the midterms and the next presidential election function like Scrooge’s ghosts of Christmas Past, Present and Future, showing America how something better than greed and selfishness could look.\n- \n  Francine Prose is a former president of the PEN American Center and a member of the American Academy of Arts and Letters and the American Academy of Arts and Sciences. Her la", "translation_ja": "", "vocab": [{"word": "reticence", "definition": "発言や行動を控えめにする傾向。躊躇や慎重さを示す性質を指します。"}, {"word": "acquisitions", "definition": "企業や資産の買収、または物品の取得。特にビジネスコンテキストで大規模な買い取りを意味します。"}, {"word": "loopholes", "definition": "法律や規則の抜け穴。意図した規制を回避するための技術的な逃げ道を指します。"}, {"word": "aspirational", "definition": "野心的で、より高い目標や地位を目指す態度。達成したいと思う理想や憧れを表します。"}, {"word": "fraught", "definition": "危険や困難に満ちている状態。紛争や不安定さを含む状況を描写する用語です。"}, {"word": "delusional", "definition": "現実に基づかない誤った信念を持つ状態。妄想的な考えや根拠のない確信を意味します。"}]}, {"title_ja": "企業寄りの民主党の衰退と進歩的政治の台頭", "title_en": "The Decline of Corporate Democrats and the Rise of Progressive Politics", "summary_ja": "ロバート・ライシュは、民主党が企業寄りの民主党員の顕著な衰退を経験していると主張し、有権者は手頃な価格と金融エリートへの対抗を約束する進歩的な候補者をますます支持していると述べています。彼は、トランプの露骨な企業優遇がアメリカ企業の貪欲さを露呈させ、有権者を確立した民主党から医療保険改革と選挙資金改革を約束する候補者へと向かわせたと主張しています。", "summary_en": "Robert Reich argues that the Democratic party is experiencing a significant decline of corporate-aligned Democrats as voters increasingly support progressive candidates who promise to address affordability and challenge Wall Street elites. He contends that Trump's blatant corporate favoritism has exposed corporate America's greed and convinced voters to reject establishment Democrats in favor of candidates committed to Medicare for All and campaign finance reform.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/20/corporate-democrats-decline", "state_media": false, "category": "オピニオン", "full_text": "Most discussions about the Democratic party in this election cycle focus on the remarkable rise of progressive Democrats, such as the Florida state representative Angie Nixon, a democratic socialist who scored an upset win in the Democratic US Senate primary on Tuesday.\nBut an equally big story is the remarkable decline of corporate Democrats.\nSome Democrats worry about this. My old friend James Carville compares the current wave of progressive primary wins to progressive campaigns in 2016 – especially that of Bernie Sanders – that he believes fractured the Democratic coalition.\n“Bernie Sanders is the reason that Donald Trump is president,” the Democratic strategist said recently, claiming that Bernie’s primary challenge to Hillary Clinton convinced voters in battleground states that establishment Democrats were no different from establishment Republicans, thereby weakening her prospects in the general election.\nEven if James is right about 2016 (and I don’t believe he is), his assessment is irrelevant now because we’re at a radically different point in US politics than we were 10 years ago.\nThe silver lining in the dark storm cloud of Trump and his detestable regime is that it has exposed the greed, venality, cupidity and corruption of the US’s corporate elite.\nTrump has allowed the CEOs of giant corporations and the titans of Wall Street to do whatever they want as long as they suck up to him. And he’s providing all sorts of corporate welfare to those who generously woo him – no-bid government contracts, exclusive licenses, tax loopholes, tariff exemptions, use of public lands, and permission to become even bigger monopolies.\nTrump has thereby unveiled a truth about corporate America that for many years has been hidden behind a soothing blanket of corporate PR bullshit about social responsibility, corporate charity and “trickle-down” economics.\nThat truth is the captains of corporate America are so rapacious that they’re willing to throw average working Americans under the bus to make billions more.\nCorporate avarice under Trump has become so blatant and corporate America’s contempt for the needs of average Americans so flagrant that most Americans are now catching on.\nThey’re voting for progressive Democrats not because they want socialism, support the Democratic Socialists of America, or reject candidates called “moderate”.\nThey’re voting for candidates whom they believe will fight to make housing, food, healthcare and childcare affordable to average working families. And who’ll take on Trump’s billionaire backers, CEOs and Wall Street titans who are rigging the economy against them.\nMuch of the corporate media won’t tell this story. When Dr Abdul El-Sayed won Michigan’s Democratic primary over Haley Stevens, the media overflowed with accounts of how much smaller El-Sayed’s margin of victory was than polls had predicted.\nYet the most remarkable thing about El-Sayed’s victory was that he won despite being dramatically outspent by Super Pacs arrayed against him.\nStevens benefited from tens of millions of dollars in outside spending, including the largest investment in a senatorial race ever made by the American Israel Public Affairs Committee, which traditionally supports pro-Israel candidates but in recent election cycles has supported candidates most favored by corporate America. Aipac’s ads in favor of Stevens and against El-Sayed never even mentioned Israel.\nOutside Super Pacs put an estimated $54m to $60m into backing Stevens and opposing El-Sayed, compared with only about $5m for El-Sayed. Pro-Stevens groups outspent El-Sayed on TV advertising alone by more than 12 to one ($26.9m to $2.1m) in the closing weeks. An average of $95 was spent for every vote against El-Sayed versus just $9 per vote for him.\nThe race between Stevens and El-Sayed was a proxy fight over the future of the Democratic party. The Senate minority leader, Chuck Schumer, backed Stevens and encouraged donors to back her campaign, as did other corporate-aligned politicians such as the Michigan senator Gary Peters. On the other hand, Bernie Sanders and Alexandria Ocasio-Cortez supported El-Sayed, as did progressives such as the US senators Chris Van Hollen and Elizabeth Warren.\nEl-Sayed justifiably made a campaign issue out of how much corporate money was backing his rival. He argued that Democrats should reject corporate influence and embrace an agenda that helps average Americans. His campaign centered on providing Medicare for All, lowering prescription drug costs, and banning corporate Pac money. “We’re in a situation right now where the rich keep getting hyper-rich on the backs of figuring out how to monetize everyday people,” El-Sayed told the Associated Press while supporters chanted: “Money out of politics! Money in your pockets!”\nEl-Sayed’s victory marked a turning point for the corporate wing of the Democratic party.\nI saw the start of the corporate Democrats in the early 1980s, when Democrats in Congress began drinking fro", "translation_ja": "", "vocab": [{"word": "venality", "definition": "商品化や買収の傾向。腐敗した行為。金銭的な不正直さを示す道徳的な欠陥。"}, {"word": "cupidity", "definition": "強い金銭欲や物質的利益への渇望。貪欲さ。"}, {"word": "rapacious", "definition": "貪欲で利益を求める傾向が強い。むさぼり食うような。"}, {"word": "avarice", "definition": "強い金銭への執着心や欲望。けちな性質。"}, {"word": "proxy fight", "definition": "代理戦争。実際の対立する立場を代表する間接的な競争や対立。"}, {"word": "corporate welfare", "definition": "大企業に与えられる政府補助金や優遇制度。企業への優遇措置。"}]}, {"title_ja": "AIがいかに米軍を空洞化させるか", "title_en": "How AI Could Hollow Out the U.S. Military", "summary_ja": "著者は、AI統合が軍事効率を向上させる可能性がある一方で、より大きな脅威はAIの自律性ではなく、人間の認知と意思決定に及ぼす影響にあると主張している。研究によれば、AI依存は自動化バイアス、スキル低下、専門家における判断力の低下を引き起こし、指揮官と兵士の独立した戦術的思考を損なう可能性がある。ペンタゴンは、『AI優先戦闘力』への急速な転換ではなく、職員にAI使用法の慎重な訓練を行い、その認知的影響を監視する必要がある。", "summary_en": "The author argues that while AI integration could improve military efficiency, the greater threat lies in how it affects human cognition and decision-making rather than AI becoming autonomous. Research shows that reliance on AI causes automation bias, skill degradation, and impaired judgment even among experts, which could undermine commanders' and soldiers' independent tactical thinking. The Pentagon must carefully train personnel on AI use and monitor its cognitive effects rather than rushing toward an 'AI-first warfighting force.'", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/how-ai-could-hollow-out-us-military", "state_media": false, "category": "オピニオン", "full_text": "When people think about the risks of mixing AI and armed forces, their thoughts often drift to one famous film franchise: The Terminator. Its premise is simple. American scientists invent a superintelligent computer system, called Skynet. The Department of Defense then integrates it into the military and embodies its intelligence into lethal robots. Skynet soon becomes self-aware, and American military leaders attempt to unplug it. In response, the AI starts a nuclear war and deploys its robots—the terminators—to eliminate the human race.\nThere is no doubt that people need to maintain control over AI systems, and so it is essential for analysts and engineers to think about how to avert a Skynet-style outcome—particularly after models from OpenAI, Anthropic, and Meta escaped their testing environments and hacked into outside companies, including an escape that took place during an exam run by the United Kingdom’s premier AI safety institute. But focusing on escaped models and imagining killer robots can drive discussions about how the military should use AI exclusively toward questions of engineering and thus miss a more pernicious threat to human control of the armed forces. According to a growing body of research, AI use is affecting people’s cognitive capacity to evaluate evidence, make independent judgments, and even do their basic jobs. In other words, policymakers should be as worried about how troops and commanders use AI as they should be about AI’s independent capabilities.\nThat does not mean the U.S. military should forgo the use of AI, which could do wonders to improve its efficiency and reduce errors in conflicts. But it does mean that the Pentagon will need to more carefully train soldiers how to use AI and monitor how such systems affect people’s thinking. To be sure humans are always capable of overseeing AI, it may even require adopting certain models more slowly.\nLOSING OUR MINDS\nFor years, scientists have embarked on systematic research to illuminate how human-machine interactions affect cognition. The findings are complicated, but often worrying. For example, people can suffer from what is called automation bias: the tendency to defer to machine judgments over their own. This was true before the advent of AI; simply search for videos of people who blindly followed their navigation systems and drove their cars into lakes. But AI could make automation bias worse. Analysts have found that relying on AI can impair skill development for new learners while degrading knowledge among experts. When researchers gave computer scientists and oncologists AI assistance and later took it away, both groups performed worse at their jobs than they did before using it.\nThese findings should be particularly concerning to the U.S. military as it seeks to foster what Secretary of Defense Pete Hegseth calls an “AI-first warfighting force.” Some commanders hope to use AI to support war game analysis and to help develop military courses of action. Such integration could lead to tactical and strategic breakthroughs, given how powerful AI models have become. But it also risks diminishing the ability of commanders and soldiers to independently evaluate or develop creative military options.\nIt is easy to imagine how this might happen. Sailors, for example, are often tired and overworked when reviewing images of potential threats. If they are evaluating an image of a nearby object, they might already be ready to accept the verdict of a computer that deems it an enemy warship—even when their own eyes suggest it is more likely a cargo tanker or a fishing boat. Likewise, battlefield commanders often need urgent response plans to enemy attacks, something AI can help with. But if commanders overrely on what computers suggest, they might lose their own tactical edge and blindly adopt the algorithm’s plan. This possibility is particularly concerning given that, in some experiments, AI models have been prone to make unnecessarily aggressive and escalatory recommendations.\n Relying on AI can impair skill development.\nTo some, these fears may seem outlandish. The U.S. military, after all, invests tremendous amounts of resources on making sure its members exercise good judgment. The process by which it selects senior combat leaders, for example, is designed to weed out all but the most experienced and discerning candidates. And once selected, these leaders adhere to a strict code of conduct and undergo intensive training and certification requirements, all of which prize discipline and self-regulation. Finally, the American military bureaucracy has been focused on safely operating automated (if not autonomous) weapons since at least the 1940s.\nBut AI is more capable than earlier technologies, and it is already overwhelming workers in other similarly disciplined fields. In medicine, for instance, evidence is accumulating that even experienced doctors struggle to reliably catch incorrect AI recommendations. Sycophantic AI chatbots ", "translation_ja": "", "vocab": [{"word": "automation bias", "definition": "機械の判断を自分の判断より優先してしまう傾向のこと。特にAI時代には専門家でさえこのバイアスに陥りやすくなる。"}, {"word": "pernicious", "definition": "徐々に害をもたらす危険な状態を指す形容詞。即座には気づきにくいが深刻な悪影響をもたらす脅威を表現する。"}, {"word": "cognitive capacity", "definition": "情報を処理し判断する能力。AI依存により、この認知的能力が低下する可能性があると論文では指摘されている。"}, {"word": "degrade", "definition": "機能や能力が低下する、劣化するという動詞。専門知識でさえもAI使用後に低下することが研究で示されている。"}, {"word": "forego", "definition": "何かを放棄する、控える、使用しないという動詞。軍がAI技術の使用を完全に止めるべきではないというニュアンスを表現する。"}, {"word": "sycophantic", "definition": "へつらいやすく、ユーザーの意思に従順なAIシステムの特性を指す形容詞。人間の判断力をさらに弱める危険性を暗示する。"}]}, {"title_ja": "長期的に持続する対中国戦略", "title_en": "A China Strategy That Lasts", "summary_ja": "著者は、大統領府の変わりやすい政策に依存するのではなく、議会が恒久的な通商戦略を確立する必要があると主張している。提案には、関税免除の抜け穴を永久に塞ぎ、税関取締措置を法制化し、中国企業が米国の制度の隙間を悪用するのを防ぐため貿易インフラを近代化することが含まれる。この長期的な立法枠組みは、米国の製造業基盤を再構築し、中国との持続的な競争に勝つために不可欠である。", "summary_en": "The author argues that the U.S. must establish a durable, congressionally-mandated trade strategy to counter China's use of trade as a geopolitical weapon, rather than relying on shifting executive branch policies. Key proposals include permanently closing tariff loopholes, codifying customs enforcement measures, and modernizing trade infrastructure to prevent Chinese companies from exploiting gaps in U.S. systems. This long-term legislative framework is essential for rebuilding American manufacturing capacity and winning sustained competition with China.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/china-strategy-lasts-bill-cassidy", "state_media": false, "category": "オピニオン", "full_text": "For decades, Beijing has used trade not only as a means to generate economic growth but also as a geopolitical tool to attract investment, strengthen its industrial base, expand its economy, and support its military. It has done so by integrating national security, economic security, energy policy, and environmental policy. In sectors as varied as automobiles, chemicals, and solar panels, the Chinese government’s policies have led to overproduction at home, which pushes companies to export at low prices, flooding international markets and undermining the manufacturing bases of rival economies. The erosion of those countries’ industrial capacity ultimately weakens their ability to compete with and resist China economically, diplomatically, and militarily. And the United States cannot win a long-term competition with China when Beijing controls global manufacturing and supply chains.\nIn Washington, policymakers of both parties recognize the China challenge. Yet the United States’ approach to addressing this challenge has shifted with each presidential administration and, at times, even within a single presidency. Long-term challenges require long-term solutions, and Congress is the branch best suited to crafting such solutions. Congress can provide the consistency and pred
