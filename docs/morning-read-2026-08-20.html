ictability needed to align U.S. economic, trade, and national security goals into the future. If the United States hopes to compete successfully with China in the coming decades, Congress—not the executive branch alone—must establish a durable framework that can outlast political cycles.\nTo counter China’s trade policy and protect U.S. national security, Congress should pass legislation to permanently strengthen enforcement of existing trade laws, modernize customs authorities to better track goods coming from China, deepen partnerships in the Western Hemisphere, and address the advantage that China derives from weak enforcement of environmental standards. Many such pieces of legislation have already been introduced. Now, Congress needs to move forward and make them law. This will ensure that the United States can rebuild and protect its industrial base and win the competition with its biggest geopolitical rival.\nCLOSING LOOPHOLES\nA long-term trade strategy to counter China must first have permanent trade enforcement. One positive step came in July 2025, when Congress closed the de minimis loophole, which allowed goods costing less than or equal to $800 to be imported without a tariff. Because of this loophole, in 2024, approximately four million packages a day—mostly from China—entered the United States duty free and largely unscreened. Counterfeit products, goods containing hazardous chemicals such as fentanyl, and cheap consumer products were pouring into the United States. Meanwhile, American exporters sending goods to China faced tariffs on any products for individual use costing more than $6.90 and on commercial products worth more than $690.00.\nRepealing the de minimis threshold will help level the playing field for American manufacturers and create a more stable framework going forward—one that cannot be changed by a future executive order. But other legislation is needed to further bolster enforcement. Currently, U.S. trade strategy relies on a June 2026 executive order that increases the bond on high-risk goods that is required to guarantee duties get paid in full, places restrictions on repeat violators of customs rules, establishes minimum penalty floors, and expands reporting requirements that provide Customs and Border Protection with the ownership and supply chain information necessary to identify bad actors. Together, these changes make it harder for Chinese companies to exploit gaps in U.S. customs enforcement.\nCongress should codify the June 2026 executive order to make these changes permanent. Such a bill warrants bipartisan support because protecting U.S. manufacturers and rebuilding the manufacturing job base is a shared priority for policymakers. Furthermore, such a bill would protect American businesses and ensure that trade rules are enforced more consistently.\nGET WITH IT\nEnforcement alone will be insufficient, however, if customs authorities continue relying on systems designed for an earlier era of global commerce. Although recent executive actions, including the June 2026 customs enforcement order, authorize the destruction of counterfeit goods, expand electronic filing, and move the United States toward a better trade-processing system, Congress should pursue a broader effort to bring customs into the twenty-first century.\nThe Customs Modernization Act, which I introduced in 2023, aims to replace paper-based customs processes with comprehensive electronic filing. It also requires online marketplaces to provide verified seller and transaction data. The Trump administration has since built on these reforms by requiring importers of record—the entities legally responsible for imported goods—to maintain sufficient do", "translation_ja": "", "vocab": [{"word": "de minimis", "definition": "法律用語で「取るに足らない」という意味。ここでは一定額以下の輸入品に対して関税やスクリーニングを免除する制度を指す。"}, {"word": "codify", "definition": "法律や規則として正式に成文化する、または体系化すること。一時的な行政命令を恒久的な法律に変換する場合に使用される。"}, {"word": "durable", "definition": "長期間にわたって持続可能で、変わらない性質を持つ。政治的な周期を超えて機能する政策や枠組みを表現する際に用いられる。"}, {"word": "erosion", "definition": "徐々に減少・衰退する過程。ここでは米国の産業基盤が段階的に弱くなることを指す。"}, {"word": "geopolitical", "definition": "地理的・政治的・軍事的な要因が国家間の関係に及ぼす影響に関する。国家戦略や国際競争を論じる際に使用される。"}, {"word": "bolster", "definition": "何かを強化・支持する、またはサポートを増やすこと。ここでは税関取締を強化する意味で使われている。"}]}, {"title_ja": "民主主義には創造的破壊が必要である", "title_en": "Democracies Need Creative Destruction", "summary_ja": "著者は、民主主義の危機は政府機関が基本的な機能を果たせない国家能力の低下に根ざしていると主張している。市民は政治的レトリックが現実と一致しないときに民主主義への信頼を失い、この制度的崩壊は民主的正当性と国家主権の両方を損なう。解決策には抜本的な制度改革が必要である。すなわち、現代の課題に対応するための機関の再構築、または修復不可能な機関の廃止である。", "summary_en": "The author argues that democracies face a crisis rooted in declining state capacity—government agencies cannot perform their basic functions effectively. Citizens lose faith in democracy when political rhetoric fails to match observable reality, and this institutional breakdown undermines both democratic legitimacy and national sovereignty. The solution requires radical institutional reform: rebuilding agencies for modern challenges or dismantling those beyond repair.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/democracies-need-creative-destruction-pahlka-greenway", "state_media": false, "category": "オピニオン", "full_text": "Over the past decade, there has been a growing consensus that democracies around the world are facing a crisis from within. According to a 2025 Pew survey, nearly 60 percent of respondents in 23 countries agreed that they are “dissatisfied with democracy.” Polarization, disinformation, and disillusionment with leaders willing to break established norms for personal advantage are certainly to blame for this growing sense of dysfunction, but there is a deeper flaw in today’s democratic governments: state agencies and institutions are increasingly unable to perform the basic tasks they were designed to carry out.\nWhen the COVID-19 pandemic reached the United States, in early 2020, the U.S. government was spending roughly $600 million a year to detect infectious diseases. Yet the virus spread undetected for a month because researchers were unable to get permission from a rigid bureaucracy to test the swabs that would have helped identify it. In the United Kingdom, despite the billions of dollars the government has spent on youth employment services following the pandemic, the number of young people aged 16 to 24 who are not employed, in school, or in training programs has surpassed one million—a precipitous increase of more than 300,000 in less than five years. Germany, a country once known for its efficiency, now has a rail network so unreliable that it has become a national embarrassment; around 40 percent of long-distance trains arrive late. Across large swaths of the United States and Europe, people compare what they hear from politicians of all parties with what they see with their own eyes, and the rhetoric does not match the reality. The result is dismay and distrust.\n“State capacity” used to be a term that experts in advanced countries used when speaking of the developing world. If this country receives foreign aid, does it have the capacity to turn it into public good? Now the citizens of those donor countries are asking that question at home. If we pay taxes, will our government provide more of the things we need? If we engage in the political process, will we get the outcomes we seek? Increasingly, the apparent answer to these questions is no. As Brian Shearer, a regulatory expert at the Vanderbilt Policy Accelerator, has laid out, implementing a significant new federal rule in the United States usually takes at least five years from start to finish, making it impossible for a president to deliver on a promised reform before the next election. As a result, the basic feedback loop of democracy—candidates say what they’ll do, voters choose, results arrive, voters judge—is breaking down. Nearly all rich democracies face some version of this crisis.\nAt a fundamental level, these failures not only erode confidence in democracy; they also undercut sovereignty. When Ukraine needed to restore its communications network after Russia’s invasion, in February 2022, it turned to Starlink’s satellite Internet service, a private enterprise. That meant that although the Pentagon eventually paid to keep the Starlink network running in Ukraine, the decision about whether Ukrainian forces would have the satellite network they needed to strike the Russian fleet at Sevastopol rested not with the Pentagon or with the National Security Council but with Starlink’s founder, the tech billionaire Elon Musk. Since then, frontier AI models have only accelerated the shift of power from public institutions to private companies.\nDemocracies have not given up on institutional reform. There are glimmers of success in almost every advanced country, including the United States, at agencies such as the Internal Revenue Service, which has finally begun to modernize its woefully out-of-date technology. Following the onset of the pandemic, the massive stimulus that Congress passed in March 2020 showed what governments could deliver when the global economy was on the line. But overall, efforts to make government agencies fit for purpose in today’s world have not been going well. Even Musk, despite his vow to take a chainsaw to the bureaucracy, seemed exhausted by the vastness of what his Department of Government Efficiency had taken on, and abandoned DOGE over a year earlier than planned.\nTo truly reverse the dramatic decline in state capacity, governments need to take radical approaches that can win public trust. In his classic 1967 book, Inside Bureaucracy, the economist Anthony Downs described how institutions that lose their ability to adapt eventually embark on a slow death, becoming hollow shells of rules and procedures. Once they reach this point, he argued, they must be either reborn or destroyed. Today, advanced democracies around the world need to give serious attention to institutional rebirth—rebuilding state agencies into departments of now, unencumbered by people, precepts, and processes of past eras. But they also need to consider which legacy agencies are beyond reinvention and should be shut down altogether.\nNot every broke", "translation_ja": "", "vocab": [{"word": "state capacity", "definition": "政府が基本的な行政サービスを効果的に提供・実行できる能力。かつては発展途上国を評価する際に使われた用語だが、先進国でも問題になっている。"}, {"word": "disillusionment", "definition": "期待や希望が現実と異なることで生じた失望感や幻滅。民主主義に対する信頼が損なわれた状態を指す。"}, {"word": "bureaucracy", "definition": "官僚組織や官僚制度。複雑なルールと手続きによって意思決定が遅くなる傾向がある。"}, {"word": "erode", "definition": "徐々に削弱する、損なう。信頼や能力などが時間とともに低下していく過程を表す。"}, {"word": "sovereignty", "definition": "主権。国家が独立した権力を行使し、政策決定権を保有する権利や状態。"}, {"word": "institutional rebirth", "definition": "既存の機関や組織を現代の要求に適応させるべく根本的に再構築すること。過去の人員や規則から解放される過程。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-20 21:17 JST";
  renderTabs();renderList();
})();
</script>
</body>
