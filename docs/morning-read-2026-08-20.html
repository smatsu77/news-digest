inst you,\" the treasure secretary said referring to the US's international trading partners.\nBessent confirmed further details about the plan will be made public at a press conference on 24 August.\nThe Iranian economy has long been struggling under the weight of decades of international sanctions, which left it in tatters.\nEarlier this year, Iran experienced weeks of protests due to the spiralling cost of living and inflation – with everyday Iranians blaming the regime for their difficulties.\nOfficial figures show that in the 12 months to February 2026, the price of basic necessities increased by an average 60%, while food prices doubled in the same period.\nAt the time, Trump told demonstrators \"help is on the way\" as he urged them to \"keep protesting\".\nThe attacks on Iran ensued - and later led to the US to imposed a blockade of Iranian ports, threatening further sanctions.\nIn April, the US launched a wave of sanctions on foreign banks and firms doing business with Tehran after it became apparent military operations had not led to the overthrow of Iran's regime nor its surrender, as Trump had initially hoped.\nOperation Economic Fury, announced by the US Treasury Department and the Pentagon, aimed at degrading Tehran's warfighting capability by cutting off its revenue streams, and also included a naval blockade aimed at stopping Iranian exports.\nThe Memorandum of Understanding (MoU) signed by Iran and the US in June included a clause stating that the US would \"terminate all types of sanctions\" against Iran in an agreed-upon schedule.\nIran is no stranger to sanctions – a raft were first imposed shortly after the Islamic Revolution of 1979, during the US embassy hostage crisis.\nSince then, more sanctions have been implemented, but the Iranian government has not collapsed - in fact it has succeeded in controlling dissent, most recently by cracking down on the protesters earlier this year.\nOne resident in the central Iranian province of Khuzestan told . The project, which would strategically divide the West Bank and isolate East Jerusalem, is viewed as a major threat to a two-state solution and comes amid escalating settler violence against Palestinians. Despite international opposition and an upcoming Israeli election, the bidding deadline is set for October 19, making it difficult for any future government to reverse the decision.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c998evlgz8ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "UK, France, Germany, Italy and Canada condemn Israel's West Bank settlement project\n- Published\nIsrael's plans to open up tenders for the construction of some 1,200 settlement homes in a strategically important part of the occupied West Bank have sparked fresh condemnation by major Western powers.\nIn a joint statement, the UK, France, Germany, Italy and Canada called the decision \"unacceptable\", external and urged Israel to \"retract the plans immediately\".\nAll settlements are illegal under international law and, under international pressure, Israel held off for decades on plans to build in E1 to the east of Jerusalem.\nMany of its allies and Palestinians argued this development would deal a major blow to hopes of a two-state solution, effectively cutting the West Bank in two and isolating east Jerusalem.\n- Israel opens up bids for highly sensitive West Bank settlement project \n  - Published10 hours ago\n- BBC speaks to Palestinians targeted by Israeli settlers \n  - Published26 July\n\"At a time of grave instability in the West Bank with unprecedented levels of violence by settlers against civilians, and serious restrictions on the Palestinian economy, this decision is even more concerning\", the statement from the European allies and Canada published on Thursday said.\n\"Not only will they [the plans] take us further from peace, but they further undermine Israel's international standing,\" the statement added.\nIn a separate statement, the UN secretary general also said the E1 plan posed an \"existential threat\" to a contiguous Palestinian state - and so did Belgium's foreign minister.\nUK Foreign Secretary Ed Miliband's condemnation earlier on Thursday had drawn \"ouright\" rejection by the Israeli foreign minister.\nDespite an Israeli court challenge to the plans by Bedouin Palestinians living in the area and Israeli peace groups, on Wednesday the Israeli housing ministry issued a tender for 1,234 of the 3,401 housing units approved by the Israeli government last August.\nIt covers about 12 sq km (4.6 sq miles) between East Jerusalem and the settlement of Maale Adumim.\nAt the time of their unveiling, Finance Minister Bezalel Smotrich - an ultranationalist and settler - said the idea of a Palestinian state was \"being erased\".\nThe deadline for bids is 19 October, just days before Israel's general election on 27 October, making it much harder for any future government to overturn any tenders issued.\nIsrael has built about 160 settlements housing 700,000 Jews since it occupied the West Bank and East Jerusalem - land Palestinians want, along with Gaza, for a hoped-for future state - during the 1967 Middle East war. An estimated 3.3 million Palestinians live alongside them.\nDespite the fierce international opposition, successive Israeli governments have allowed settlements to grow.\nHowever, expansion has risen sharply since Prime Minister Benjamin Netanyahu returned to power in late 2022 at the head of a right-wing, pro-settler coalition, as well as the start of the Gaza war, triggered by Hamas's 7 October 2023 attack on Israel.\nOpponents of the E1 project have warned that it would effectively block the establishment of a Palestinian state because it would cut off the north of the West Bank from the south, and prevent the development in the centre of a contiguous Palestinian urban area connecting Ramallah, East Jerusalem and Bethlehem.\n  - Published10 hours ago", "translation_ja": "", "vocab": [{"word": "contiguous", "definition": "連続した、隣接した。通常は地理的に途切れずにつながっている土地や地域を指す。"}, {"word": "precedent", "definition": "先例、前例。過去の判例や慣例に基づいて、将来の行動や判断の根拠となるもの。"}, {"word": "existential threat", "definition": "実存的な脅威。ある国家やコミュニティの存続そのものを危険にさらすような根本的な脅威。"}, {"word": "ultranationalist", "definition": "超国家主義者。過度な国家主義や愛国心を持ち、強硬な民族主義政策を支持する人物。"}, {"word": "tender", "definition": "入札、札。政府や企業が特定の事業を実施する業者を募集する公式な応募手続き。"}, {"word": "retract", "definition": "撤回する、引っ込める。以前の声明や計画を取り下げて無効にすること。"}]}, {"title_ja": "ロシア、キーウの重要インフラを「意図的に」標的とした最新の攻撃", "title_en": "Russia 'purposefully' targets Kyiv critical infrastructure in latest strikes", "summary_ja": "ロシアは一夜にしてキーウに大規模な攻撃を仕込み、少なくとも17人が殺害され、小児病院や学校を含む重要インフラが数ヶ月ぶりに損傷した。キーウ市長は西側同盟国からのミサイル防衛システムの緊急の必要性を強調した。ウクライナ空軍は、攻撃中にロシアの弾道ミサイルは一発も迎撃されなかったと報告した。", "summary_en": "Russia launched a major attack on Kyiv overnight, killing at least 17 people and damaging critical infrastructure including a children's hospital and school for the first time in months. Kyiv's mayor emphasized Ukraine's urgent need for more air defense missiles and interceptors from Western allies. Ukraine's air force reported that none of the Russian ballistic missiles were intercepted during the attack.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c98vzmden5yo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Russia 'purposefully' hit critical infrastructure in latest strikes, Kyiv mayor says\n- Published\nRussia's latest attack on Kyiv marks the first time in several months critical infrastructure \"was purposefully attacked\" in the Ukrainian capital, the city's mayor said.\nAt least 17 people have been killed as blocks of flats and warehouses were struck across the city overnight, the State Emergency Service of Ukraine said. A children's hospital and school were also damaged, and more than 40 people have been injured, it added.\nOn Thursday, Kyiv's mayor Vitali Klitschko warned residents of Desnyansky and part of the Dnipro districts may experience a disrupted supply of hot water, following the overnight attacks.\n\"Specialists are working to restore the damaged infrastructure,\" he said on Telegram, external.\nSpeaking to BBC News at a wrecked apartment block in Kyiv, Klitschko said Ukraine continues to face a shortage of air defence missiles and needs \"ammunition, anti-missile systems - we need support from our partners\".\nKyiv relies on Western allies for the supplies and President Volodymyr Zelensky said that \"as long as Ukraine does not have enough anti-ballistics, Russia will not seriously think about peace\".\nHe added: \"The interceptors for the Patriots have not yet been replaced, and they are needed every day. Each additional missile saves the lives of our people.\"\nAn update released by the Ukrainian Air Force on Thursday morning implied that none of the Russian ballistic missiles used overnight were intercepted.\nUkraine has relied on American supplies of Patriot interceptor missiles to combat Russian ballistic missiles, but the US has used much of its stockpile during the war with Iran.\nThe Russian defence ministry said it used air, land and sea-based weapons to target military facilities and warehouses.\nThe latest strikes on Kyiv began around midnight local time as air raid sirens sounded across the city, followed by the impact of Russian missiles.\nThe strikes cut power to thousands of properties, plunging parts of the Kyiv region into darkness.\nA day of mourning is to be observed on Friday.\nAt a local school in the Solomyanski disctrict, the windows were knocked out and its playing fields were left covered in debris.\nA nearby storeroom was destroyed, exposing the basement. The BBC was told it was a laundry and boiler house supplying heating to the surrounding apartment blocks.\nUkraine's deputy intelligence chief told the BBC this was the kind of attack Russia was planning ahead of the winter in order to make life difficult.\nAnastasiia Kovtun's flat was in a nine-storey building that was hit in the attack.\nThe primary school teacher said she felt like her \"head was going to blow\" when she heard the explosions in her area from the shelter.\n\"It's so frightening to realise it's your house, you never think you're going to be next,\" she told the BBC.\nValeria Bondaruk moved to Kyiv after her home in southern Ukraine was bombed, believing it would be safer for her and her daughter.\nNow she has been driven from her home for the second time during this war.\nShe told the BBC she feared for her 13-year-old daughter's future and was considering leaving Ukraine.\nElsewhere in the broader Kyiv region, an attack in the Brovary and Boryspil districts killed one man and wounded seven. One person was killed and 11 injured in the region of Donetsk, a local official said.\nIn Russia, the defence ministry said that 726 Ukrainian drones had been shot down after being launched at various regions across the country.\nIn recent weeks both sides have carried out massive air strikes, resulting in dozens of deaths.\nUkraine has stepped up its attacks deep inside Russia and targeted the capital Moscow with a wave of 600 drones at the weekend.\nTwo separate attacks on Russia this week killed at least 16 people, including one child.\nDespite the ongoing attacks and vulnerabilities on both sides, there has been little progress in diplomatic efforts to broker a ceasefire. Both sides accuse each other of targeting civilians.\nRussia first launched a full-scale invasion of Ukraine in February 2022, and currently controls about one-fifth of Ukrainian territory – largely concentrated in the eastern border regions.\nAdditional reporting by Isabella Jewell in Kyiv and Ruth Comerford in London\nRelated topics\n  - Published2 days ago\n  - Published3 days ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "interceptor", "definition": "敵の航空機やミサイルを撃ち落とすために発射される兵器のこと。特に防空システムにおいて、相手の攻撃を阻止するための重要な装備。"}, {"word": "ballistic", "definition": "発射後に放物線を描いて飛行する弾道に関する形容詞。弾道ミサイルなどの軍事用語として使われる。"}, {"word": "stockpile", "definition": "将来の使用に備えて保管された大量の物資や兵器のこと。供給を確保するため、あらかじめ貯蓄されている備蓄品を指す。"}, {"word": "ceasefire", "definition": "紛争当事者が敵対行為を一時的に停止する合意のこと。戦闘の休止や停戦を意味する国際政治用語。"}, {"word": "vulnerability", "definition": "攻撃や被害に対する弱さや脆弱性を表す名詞。防御が不十分な領域や欠点を指す。"}, {"word": "brokers", "definition": "交渉の仲介者として機能する人や国を指す。紛争解決や合意形成のために当事者間の仲立ちをする役割。"}]}, {"title_ja": "ハリー王子とメーガン妃のUK帰国が警備問題を再燃させる", "title_en": "Harry and Meghan's UK Return Raises Security Questions", "summary_ja": "ハリー王子とメーガン妃は子どもたちを連れてUKに永住移転する計画を発表し、政府はセキュリティ体制の再評価を迫られている。2020年に王族の職務を退いた際にセキュリティが縮小されて以来、納税者負担の保護をめぐる議論が再び浮上している。内務省と独立した安全保障委員会は、今後彼らが受ける公的資金による警備レベルを決定する必要がある。", "summary_en": "Prince Harry and Meghan plan to relocate permanently to the UK with their children, prompting the government to reassess their security arrangements. The couple's move has reignited debate about taxpayer-funded protection, as their previous security was downgraded when they stepped back from royal duties in 2020. The Home Office and independent security committee must now determine what level of publicly funded security they will receive.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr59yg34r4mo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Harry and Meghan's return to UK reignites questions over security\n- Published\nThe Duke and Duchess of Sussex's surprise announcement that they will return to the UK this month has reignited questions over the level of their publicly funded security in Britain.\nPrince Harry and Meghan plan to relocate from the US to a private, non-royal residence outside London, with their children, Prince Archie, seven, and Princess Lilibet, five, enrolled to start at school in September.\nTheir UK security was downgraded after they stopped being working royals in 2020 and moved to the US, where they have paid for their own protection.\nThe Royal and VIP Executive Committee (Ravec), an independent body overseen by the Home Office, will now have to make a new decision as previous arrangements were based on the Sussexes not living in the UK permanently.\n- Prince Harry and Meghan moving back to UK later this month \n  - Published9 hours ago\n- Harry and Meghan are experts in surprise - but why are they returning to UK now? \n  - Published19 hours ago\nRavec had concluded that because Prince Harry was going to be an infrequent visitor to the UK, his security needs would be assessed on a case-by-case basis.\nEarlier on Thursday, Prime Minister Andy Burnham said the couple's security arrangements were a \"private matter\".\nBurnham, who does not decide about security for the Royal Family, added: \"It's a matter for Harry and for Meghan, and we wish them well in the move that they are making.\"\nThe Home Office has said the UK's protective security system was rigorous and proportionate, but \"it is our long-standing policy not to provide detailed information on those arrangements, as doing so could compromise their integrity and affect individuals' security\".\nSecurity for the couple has long been a point of tension, with Prince Harry losing a legal challenge last year over how much he and his family were entitled to when visiting the UK.\nThe Sussexes left the UK and stepped back from their royal duties in early 2020, before they settled in California, where they have employed a private security team to protect them.\nThey offered no comment when asked by the BBC whether that team would be moving to the UK with them.\nDepending on Ravec's reassessment of the couple's new permanent circumstances in the UK, the pair could now get the level of taxpayer-funded security they always wanted.\nBut there is no suggestion the couple are going to become full-time working royals again, so they may not qualify for the levels of security Prince Harry had before he and his wife left the UK six years ago.\nOther non-working royals get only limited security, and if that happens to Prince Harry, it could be the source of further tensions.\nThe Sussexes are high-profile public figures, with close links to the King and Prince Harry's military service in Afghanistan also remains an important consideration.\nIf Prince Harry does not get the taxpayer-funded security that he has always asked for since stepping down as a working royal, he would have to top up any security he might be given out of his own pocket.\nLast year, when Prince Harry lost his bid to overturn a decision that had downgraded his security after his move to the US, he told the BBC that he \"can't see a world\" in which he would bring his family to the UK due to the downgrading of his protection.\nIn terms of why they were moving now, a source close to the couple said the \"stars had aligned\" at this time to make the move work for their family.\nThey are described by the source as an international couple who love to travel - and for the next while they are going to be based in the UK.\nAs well as surprising the world's media, it was also news to King Charles, who was told about the move on Sunday. He is said to be looking forward to seeing them more often.\nThe decision follows a visit in July by Prince Harry, Meghan and their children to see the King at his Highgrove home in Gloucestershire.\nIt was the first time the King had seen his grandchildren in person in more than four years, and the couple's first visit to the UK together since 2022.\nIt has also been two-and-a-half years since the King was diagnosed with cancer and in Prince Harry's BBC interview last year, he spoke of wanting to spend more time with his father.\nHighgrove has the feel of a family home rather than a royal palace - and royal author Valentine Low says a key driver of their return has been the chance for Harry to rebuild links to his family and particularly to \"repair his relationship with his father\".\nThe couple will still keep their California home and Meghan's work in the media and her online food business, As Ever, can be carried out from a base in the UK as readily as in the US.\nNext year, Prince Harry's Invictus Games are being held in Birmingham, which would have meant extensive travelling to meetings and events in the UK.\nIt will also mark the 30th anniversary of the death of his mother, Princess Diana, which will bring commemorations ", "translation_ja": "", "vocab": [{"word": "reignite", "definition": "再び燃え上がらせる、再発させる。問題や議論が再び活発になることを意味する。"}, {"word": "proportionate", "definition": "相応の、釣り合った。状況や目的に対して適切な大きさや程度であることを示す。"}, {"word": "Ravec", "definition": "Royal and VIP Executive Committee（王族・VIP執行委員会）の略称。英国の王族や要人の警備を評価する独立機関。"}, {"word": "compromise", "definition": "（ここでは）危険にさらす、損なわせる。セキュリティシステムの信頼性や有効性を損なうことを意味する。"}, {"word": "stepping down", "definition": "職務や立場から退く、身を引く。役職や責任を放棄することを表現する。"}, {"word": "tension", "definition": "緊張、不和。人間関係や状況における対立や不快感を示す言葉。"}]}, {"title_ja": "GCSE再受験サイクルは「機能していない」と学校指導者が指摘", "title_en": "GCSE Resit Cycle 'Simply Not Working', Say School Leaders", "summary_ja": "イギリスの教育指導者たちは、生徒が何度も落第して再受験するGCSE数学と英語の試験サイクルが非効果的で若者の将来に害をもたらしていると述べています。17歳以上の生徒がGCSE数学と英語の試験のほぼ4分の1を受けており、ほとんどは以前落第した試験を再受験しています。政府は2028年からレベル4以下の新しい「踏み石」資格を導入し、生徒たちが無限の再受験に陥ることなく進歩できるよう支援する予定です。", "summary_en": "Education leaders in England say the cycle of students repeatedly failing and resitting GCSE maths and English exams is ineffective and harmful to young people's futures. Nearly one in four GCSE maths and English exams are taken by students aged 17 and older, mostly resitting previously failed exams. The government plans to introduce a new 'stepping stone' qualification at Level 1 from 2028 to help students progress without being trapped in endless resits.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/czdm6d2z3gro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'Relentless' GCSE resit cycle 'simply not working', school and college leaders say\n- Published\nThe \"relentless\" cycle of pupils in England failing and then resitting their GCSEs in maths and English is \"simply not working\", a leading education union has said.\nThe Association of School and College Leaders (ASCL) said a \"significant proportion\" of students fall short of passing those subjects, and that most who retake those exams \"face the miserable experience of falling short once again\".\nThursday's results data showed nearly one in four maths and English GCSEs in England were taken by students aged 17 and older, mostly young people resitting exams they had previously failed.\nThe government said it wanted to stop the \"endless treadmill of unnecessary resits\".\nIt said it would introduce a new \"stepping stone\" qualification from 2028 at Level 1 - one level below GCSEs - for students who do not achieve a pass in GCSE maths or English.\nCurrently, many courses and jobs remain dependent on students securing GCSE passes in those subjects.\nBut those that miss the grade can find themselves in a continuing loop of resits as they try and try again to pass.\nPepe Di'Iasio, general secretary of ASCL, said the fail-resit cycle was like \"force feeding\" students a \"relentless diet of GCSE English and maths\".\n\"This limits their education and career options and is very likely to be a factor in the large number of young people who end up not in employment, education or training,\" he said.\nPass rates for students aged 17 and older in English and maths are much lower than 16-year-old students taking the exams for the first time, bringing down overall GCSE grades for all ages across England, Wales and Northern Ireland as a result.\nWhile resitting is not a requirement, according to the Department for Education (DfE), colleges will generally enter students into exams when they think they are ready.\nFor Marianne, from Cambridgeshire, results day has been a \"mixed bag\" as both of her sons, Tobias and Jake, collected GCSE results.\nWhile Jake achieved a grade 8 in maths, his older brother, Tobias, did not get the pass he wanted after sitting the exam for a fifth time.\n\"He was very upset,\" Marianne said.\n\"He turns up for his lessons, he puts great effort in, there's just something about maths he doesn't get. What do we do now?\"\nLast week Tobias, collected A-level results in which he achieved a B in history and two Cs in politics and criminology - but his ambitions to apply to university to become a history teacher are on ice without that pass in maths.\n\"It's horrendous making him keep doing it. I don't think it's fair, the pressure on them to keep resitting it,\" mum Marriane said.\nThe new stepping stone qualification would offer an alternative route for students like Tobias to keep moving forward.\nAlthough the details are scant, the DfE said a student could be directed to it once they had sat maths and English GCSE but did not achieve a pass.\nIt said it would \"give students the essential knowledge and skills\" before they resit their GCSEs, and then \"only be entered into exams when they are ready\".\nIt is hoped it would provide a solution for students like Abdi, 17, from east London, who failed to pass his exams in maths and English for the third time.\n\"I have to get my retakes right next time, or they won't let me complete my course at college,\" he said.\n\"My school has provided extra classes to help prepare for the exams, but you have to be self-disciplined because juggling resits and college is not easy.\"\nCatherine Sezen, from the Association of Colleges, said the stepping stone qualification sounded positive, but that it should become an option for students long before they fail their GCSEs.\n\"We have to look at what happens probably from reception right the way through, because young people who don't achieve very well in their SATs at 11 are really unlikely to achieve a grade 4 at 16.\"\nShe said this year's resit figures were \"disappointing and slightly demoralising for everybody\" but not a \"huge surprise\".\n\"I think we're still also seeing the legacy of the pandemic,\" she said.\n\"These young people would have been in Years 6, 7 and 8, and so possibly haven't necessarily got the basic foundations in these subjects which are really fundamental.\"\n- Unexpected GCSE results? This interactive guide runs through your options \n  - Published15 hours ago\n- Five key takeaways from GCSE results day 2026 \n  - Published6 hours ago\nBut the resit cycle is not always an inevitable one.\nAmandeep, 17, did not pass her maths or English language GCSEs this time last year.\nBut on results day on Thursday, the student at Sandwell College, in the West Midlands, found out she had passed with a grade 5.\n\"I teared up, I thought my patience had paid off,\" she said.\n\"It happened for a reason, it was meant for me this year.\"\nAmandeep's results mean she is now able to move on to study a T-level in health and social care.\nWhile the majority of resit students are aged 17 ", "translation_ja": "", "vocab": [{"word": "relentless", "definition": "容赦ない、絶え間ない状態を表す。ここでは、生徒たちが繰り返し直面する試験の再受験サイクルが止まることなく続く様子を指しています。"}, {"word": "stepping stone", "definition": "進歩や成功への中間段階を意味する表現。この文脈では、GCSEに合格していない生徒が次のレベルに進む前の中間的な資格を指しています。"}, {"word": "treadmill", "definition": "同じことの繰り返しで進展がない状態を比喩的に表す。ここでは、試験に落第して再受験を繰り返す無限のサイクルを表現しています。"}, {"word": "incumbent", "definition": "義務的な、やらなければならない状態。この文脈では、多くの職業や教育機関がGCSE合格を必須条件としていることを指しています。"}, {"word": "legacy", "definition": "過去の出来事が現在に与え続ける影響や遺産。ここではパンデミックの影響が現在の学生の学力に残っていることを指しています。"}, {"word": "demographic", "definition": "特定の人口グループやその特性を指す統計用語。この場合、17歳以上の再受験生という特定の学生グループを表しています。"}]}, {"title_ja": "西側列強がイスラエルのヨルダン川西岸入植計画を非難", "title_en": "Western Powers Condemn Israel's West Bank Settlement Plan", "summary_ja": "英国、フランス、ドイツ、イタリア、カナダはイスラエルが占領下のヨルダン川西岸の戦略的に重要なE1地域に1,200戸の入植地建設を計画していることに共同で非難声明を発表し、この決定を「受け入れられない」と述べた。この開発はパレスチナ国家樹立と2国家解決に対する重大な脅威と見なされており、ヨルダン川西岸を実質的に分割し東エルサレムを孤立させるものである。入札期限の10月19日はイスラエル総選挙の直前に設定されており、将来の政府がこの決定を覆すことが困難になる。", "summary_en": "The UK, France, Germany, Italy, and Canada have jointly condemned Israel's plan to build 1,200 settlement homes in the strategically sensitive E1 region of the occupied West Bank, calling it 'unacceptable.' The development is seen as a major threat to Palestinian statehood and a two-state solution, as it would effectively partition the West Bank and isolate East Jerusalem. The tender deadline of October 19 is timed just before Israel's general election, making it difficult for any future government to reverse the decision.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c998evlgz8ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "UK, France, Germany, Italy and Canada condemn Israel's West Bank settlement project\n- Published\nIsrael's plans to open up tenders for the construction of some 1,200 settlement homes in a strategically important part of the occupied West Bank have sparked fresh condemnation by major Western powers.\nIn a joint statement, the UK, France, Germany, Italy and Canada called the decision \"unacceptable\", external and urged Israel to \"retract the plans immediately\".\nAll settlements are illegal under international law and, under international pressure, Israel held off for decades on plans to build in E1 to the east of Jerusalem.\nMany of its allies and Palestinians argued this development would deal a major blow to hopes of a two-state solution, effectively cutting the West Bank in two and isolating east Jerusalem.\n- Israel opens up bids for highly sensitive West Bank settlement project \n  - Published10 hours ago\n- BBC speaks to Palestinians targeted by Israeli settlers \n  - Published26 July\n\"At a time of grave instability in the West Bank with unprecedented levels of violence by settlers against civilians, and serious restrictions on the Palestinian economy, this decision is even more concerning\", the statement from the European allies and Canada published on Thursday said.\n\"Not only will they [the plans] take us further from peace, but they further undermine Israel's international standing,\" the statement added.\nIn a separate statement, the UN secretary general also said the E1 plan posed an \"existential threat\" to a contiguous Palestinian state - and so did Belgium's foreign minister.\nUK Foreign Secretary Ed Miliband's condemnation earlier on Thursday had drawn \"ouright\" rejection by the Israeli foreign minister.\nDespite an Israeli court challenge to the plans by Bedouin Palestinians living in the area and Israeli peace groups, on Wednesday the Israeli housing ministry issued a tender for 1,234 of the 3,401 housing units approved by the Israeli government last August.\nIt covers about 12 sq km (4.6 sq miles) between East Jerusalem and the settlement of Maale Adumim.\nAt the time of their unveiling, Finance Minister Bezalel Smotrich - an ultranationalist and settler - said the idea of a Palestinian state was \"being erased\".\nThe deadline for bids is 19 October, just days before Israel's general election on 27 October, making it much harder for any future government to overturn any tenders issued.\nIsrael has built about 160 settlements housing 700,000 Jews since it occupied the West Bank and East Jerusalem - land Palestinians want, along with Gaza, for a hoped-for future state - during the 1967 Middle East war. An estimated 3.3 million Palestinians live alongside them.\nDespite the fierce international opposition, successive Israeli governments have allowed settlements to grow.\nHowever, expansion has risen sharply since Prime Minister Benjamin Netanyahu returned to power in late 2022 at the head of a right-wing, pro-settler coalition, as well as the start of the Gaza war, triggered by Hamas's 7 October 2023 attack on Israel.\nOpponents of the E1 project have warned that it would effectively block the establishment of a Palestinian state because it would cut off the north of the West Bank from the south, and prevent the development in the centre of a contiguous Palestinian urban area connecting Ramallah, East Jerusalem and Bethlehem.\n  - Published10 hours ago", "translation_ja": "", "vocab": [{"word": "contiguous", "definition": "隣接している、連続した地域や地区のこと。パレスチナ国家が分断されず統一された領土を形成することを意味する文脈で使用されている。"}, {"word": "existential threat", "definition": "存在そのものを脅かす脅威のこと。ここではパレスチナ国家の成立可能性そのものを危機にさらすという意味で使用されている。"}, {"word": "ultranationalist", "definition": "過激な国家主義者のこと。自国の利益を極端に優先させ、領土拡張を強く支持する政治家などを指す。"}, {"word": "tender", "definition": "公開入札、入札募集のこと。政府や企業が工事やサービスの提供者を募集するプロセスを指す。"}, {"word": "partition", "definition": "分割、分裂のこと。領土や地域を複数に分けることを意味し、ここではヨルダン川西岸が北と南に分断されることを指す。"}, {"word": "strategic", "definition": "戦略的に重要な、という意味の形容詞。政治的・軍事的・経済的に重要な地域や決定に対して使用される。"}, {"word": "sovereignty", "definition": "主権、統治権のこと。ここではパレスチナが独立した国家として自らの領土を統治する権利を意味している。"}]}, {"title_ja": "ペルー南部アンデス山脈で強い地震が発生", "title_en": "Strong 6.7 Magnitude Earthquake Strikes Peru's Southern Andes", "summary_ja": "木曜日、ペルー南部アンデス山脈でマグニチュード6.7の強い地震が発生し、アヤクチョ地域のウパワチョ町付近が震源となりました。地震はイカやアレキパなど複数の南部地域で感じられ、首都リマまで揺れが到達しました。当局は直ちの死傷者や被害の報告がなく、津波の脅威もないと確認しました。", "summary_en": "A powerful earthquake with a magnitude of 6.7 struck Peru's southern Andes on Thursday, centered near the town of Upahuacho in the Ayacucho region. The quake was felt across multiple southern regions including Ica and Arequipa, with tremors reaching as far as Lima. Authorities reported no immediate casualties or damage, and confirmed there was no tsunami threat.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/peru-strong-earthquake-shakes-southern-andes/a-78450656?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Peru: Strong earthquake shakes southern Andes\nAugust 20, 2026\nA powerful earthquake shook Peru's southern Andes Mountains on Thursday, measured at magnitude 6.7 by the US Geological Survey (USGS) and 7.2 by Peru's Geophysical Institute (IGP).\nThe USGS said the quake occurred at 1 p.m. local time (18:00 GMT) with an epicenter 38 kilometers (24 miles) northwest of the town of Upahuacho, in the southern Ayacucho region, and a depth of 66.7 kilometers. The IGP had the depth at 108 kilometers.\nThe earthquake \"was felt with moderate to strong intensity in several departments,\" the National Institute of Civil Defense wrote on social media.\nImages broadcast by Peruvian media showed rocks and earth tumbling down hills around Coracora, the closest significant town to the epicenter with a population of about 10,000.\nWhat damage has the Peru earthquake caused?\nThere were no immediate reports of damage or casualties and the Peruvian Navy confirmed there was no threat of a tsunami.\n\"The population has responded, they evacuated and took shelter,\" Coracora mayor Yony Odon told local television.\nLuis Vasquez, head of Civil Defense, told local radio station RPP that \"no damage of any kind has been reported so far.\"\nThe jolt was felt across several regions of southern Peru, including Ica and Arequipa. Reporters for the AFP news agency said tremors were even felt as far away as the capital, Lima.\nHow common are earthquakes in Peru?\nEarthquakes are frequent in Peru which lies on the southeastern edge of the Pacific \"Ring of Fire,\" an area of frequent seismic activity.\nIn 2007, a magnitude 7.9 earthquake in a province of the Ica region left nearly 600 people dead.\nEdited by: Rob Turner\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "epicenter", "definition": "地震の震源となる地表面上の地点。震源から最も近い地表面を指す。"}, {"word": "magnitude", "definition": "地震の規模を数値で表す尺度。マグニチュードが大きいほど地震は強い。"}, {"word": "seismic activity", "definition": "地震活動。ある地域で起こる地震現象や地震の頻度を指す。"}, {"word": "Ring of Fire", "definition": "環太平洋火山帯。太平洋を囲む地域で地震と火山活動が頻繁に起こる帯状の地域。"}, {"word": "jolt", "definition": "急激な揺れや衝撃。地震による急しゅんな揺れを指す。"}, {"word": "casualties", "definition": "死傷者。事故や災害による死亡者と負傷者の総称。"}]}, {"title_ja": "ナイジェリア：ソコト州でボート転覆、数十人が死亡", "title_en": "Nigeria: Dozens dead after boat capsizes in Sokoto", "summary_ja": "ナイジェリア北西部のソコト州の川で過積載のボートが転覆し、少なくとも50人が死亡し、犠牲者のうち少なくとも40人が子どもであることが確認された。ボートは雨季に農場で働く人々を運んでいた。この時期は同様の事故がより頻繁に発生する。当局が救助活動を進めている。", "summary_en": "An overloaded boat capsized in a river in Sokoto state, northwestern Nigeria, killing at least 50 people, with at least 40 children among the casualties. The boat was carrying workers heading to farms during the rainy season when such accidents are more common. Rescue operations are underway as authorities investigate the incident.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/nigeria-dozens-dead-after-boat-capsizes-in-sokoto/a-78449903?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Nigeria: Dozens dead after boat capsizes in Sokoto\nAugust 20, 2026\nAn overloaded boat capsized in a river in Sokoto state in northwestern Nigeria, leaving at least 50 people dead, local authorities confirmed on Thursday.\nThe boat was reportedly carrying people heading to work on farms, but local officials and residents said that at least 40 children were among the casualties.\n\"I can confirm that so far around 40 corpses of children have been,\" said Abdulkadir Yusuf, an area manager of the National Inland Waterways Authority, in a statement to the Reuters news agency.\nOne resident, Samaila Garba, said his 13-year-old granddaughter was among the dead. He said he had counted at least 42 bodies of victims, most of them women and children.\n\"During the rainy season, most women and children go to the farm to work,\" he told the Associated Press.\nNigeria boat accident: rescue work underway\nDahir Kure, a spokesman for the National Emergency Management Agency in Sokoto state, told the AFP news agency that rescue operations were underway.\n\"We are now at the scene of the boat accident and have begun rescue work,\" he said.\nOne former local councilor, Ibrahim Musa, described the situation as \"bad,\" adding: \"We already buried 46 bodies, and five others have just been brought out of the river.\"\nDeadly boat accidents are common in Nigeria, especially during the rainy season, with scores of people dying each year as a result of overloaded boats, poor maintenance or failure to comply with safety regulations.\nIn January, at least 25 people were killed in Yobe state in the northeast of the country in a similar accident.\nEdited by: Rob Turner\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "capsized", "definition": "ボートや船が転覆する、または横転することを意味する。水上事故における重要な用語で、通常は過積載や悪天候が原因となる。"}, {"word": "overloaded", "definition": "許容量を超えて荷物や乗客を積み込むことを表す。安全基準を超過した状態を示す。"}, {"word": "casualties", "definition": "事故や災害による死傷者を指す。特に大規模災害時に使用される正式用語。"}, {"word": "compliance", "definition": "法律や規則に従うことを意味する。安全規制への準拠や法令遵守の文脈で使用される。"}, {"word": "inland waterways", "definition": "河川や運河などの内陸水域を指す。海ではない陸地内の水路や水運に関連する用語。"}, {"word": "emergency management agency", "definition": "災害や緊急事態に対応する政府機関を指す。救助活動や災害対応を統括する公的機関。"}]}, {"title_ja": "イスラエルのシリアにおける軍事プレゼンスの拡大が懸念を招く", "title_en": "Israel's Growing Military Presence in Syria Raises Concerns", "summary_ja": "2024年12月のシリアのアサド政権の崩壊以来、イスラエルは非武装地帯での軍事プレゼンスを拡大し、10の軍事基地を設置して毎日の越境作戦を実施している。イスラエル軍はシリア人約200人を拘束し、家屋と農地を破壊し、生体認証データを収集しており、人権団体はこれらの行為を戦争犯罪の可能性があると説明している。", "summary_en": "Since Syria's Assad regime fell in December 2024, Israel has expanded its military presence in the demilitarized zone, establishing 10 bases and conducting near-daily incursions. Israeli forces have detained around 200 Syrians, destroyed homes and farmland, and collected biometric data, with human rights organizations describing these actions as possible war crimes.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/why-is-israel-s-military-presence-growing-in-syria/a-78435811?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Why is Israel's military presence growing in Syria?\nAugust 20, 2026\nIt's been two years, four months, 24 days and five hours, said Syrian man Ahmad Hassan al-Din when asked how long it's been since he last saw his son.\nIn April 2024, Israeli soldiers took Saddam, who had just turned 17, from farmland near the Golan Heights, a part of Syria Israel has occupied since 1967.\n\"Saddam had gone to feed the animals early in the morning,\" al-Din, who's from the village of Jubata al-Khashab in the Quneitra district near Golan, told DW. \"I called him on the phone, and he told me, 'Everything's fine.' But then later we saw with our own eyes how they took the boy, handcuffed and shackled.\"\nAl-Din filmed Israeli soldiers marching his son through fields. The video, which he forwarded to DW, has previously been verified by open-source investigators at France24 and by human rights organizations.\n\"They said they took him because he was trespassing on the territory of the state of Israel,\" al-Din continued. \"Even though that area is our farmland and we have a valid UN permit to work there.\"\nTo enter this buffer area, Syrian farmers and shepherds needed a special pass from the United Nations Disengagement Observer Force, or UNDOF. The latter was set up to make sure Israeli and Syrian forces kept their distance after a 1974 disengagement agreement.\nHumanitarian organizations have since discovered Saddam, now 19, is likely in a prison in Israel.\nDW asked the Israeli military what Saddam had been charged with and under which legal system, and a spokesperson said they would investigate. At the time of writing, there had been no further response.\nIsrael takes over buffer zone\nSince Saddam was taken, the Syrian teenager's story has become one of many similar accounts in this part of southern Syria.\nAfter the fall of the country's dictatorial Assad regime in December 2024, Israel took control of the UN-patrolled demilitarized zone. Senior Israeli politicians declared the 1974 agreement void and said troops would be in the area temporarily to protect Israel from cross-border attacks.\nHowever, since then Israel's presence in Syria has become more permanent. In November 2025, UNDOF told reporters Israel had set up 10 bases in the area. From these bases, Israeli soldiers are making near-daily incursions into the Syrian provinces of Daraa and Quneitra.\n\"These incursions typically involve armored patrols through populated areas, followed by the establishment of temporary checkpoints on main roads, where all passing Syrian civilians are stopped, searched, questioned, and have their phones examined. In some cases, biometric data is also collected,\" Syrian consultancy, Karam Shaar Advisory, wrote in January.\nIsraeli soldiers have also raided homes, businesses and schools and fenced off farmland and water sources.\nQuneitra authorities sent DW a statement claiming Israeli troops had seized more than 200 sheep, destroyed drinking water wells, razed horticultural areas and destroyed buildings.\nMousa Khalil, a resident of Quneitra, recounted how his home, a two-story building with four apartments in Hamidiyah village, was completely destroyed by Israeli troops last year.\n\"I am 65 years old,\" he told DW. \"At this age, finding decent work has become extremely difficult, forcing me to accept whatever I can find to provide for my family of eight and to save money to rebuild our home.\"\nIncreased Israel incursions\nOver the past few months, the number of these kinds of incursions has been rising, and Israeli soldiers have also been moving farther inside Syria.\nThe Sijil Center, based in Syria, documents Israeli violations of Syrian territory. Between August 25 and December 31, 2025, the center recorded 818 incidents, or 45 incidents per week. Since the beginning of this year, the center has counted 1,632 incursions, bringing the average to 48 incidents weekly.\nThe Sijil Center also documents how many Syrians have been detained by Israel and says that, since December 2024, around 200 people have been apprehended. Unlike al-Din's son, most were released within 24 hours after being interrogated.\nBetween 40 and 50 Syrians are thought to remain in Israeli jails, including four or five who were in custody before the change of Syrian government in 2024.\nSoldiers coming across a border and detaining citizens of another country, then transferring them back to their own prisons, is clearly a breach of international law, experts say. Organizations like Amnesty International and Human Rights Watch have described Israel's actions in southern Syria as possible war crimes.\nWhy is Israel doing this?\nSince the fall of the previous Syrian government, Israeli politicians have insisted that southern Syria must be a \"demilitarized zone.\"\nThe Israeli military previously told other news outlets that it has \"apprehended individuals where there was reasonable suspicion of their involvement in terrorist activity.\" The army also acknowledged the construction of new military bases ", "translation_ja": "", "vocab": [{"word": "demilitarized zone", "definition": "軍事力が制限または禁止された地域のこと。国境地帯や紛争地域での緊張緩和のために設置されることが多い。"}, {"word": "incursion", "definition": "他国の領土への侵入や突然の侵略行為を意味する。通常は短期的で限定的な軍事活動を指す。"}, {"word": "biometric data", "definition": "指紋、虹彩、顔認証など、個人の生物学的特性に基づいた識別情報。身元確認に使用される。"}, {"word": "apprehend", "definition": "人を逮捕または拘束すること。法執行機関や軍隊による身柄の拘束を意味する。"}, {"word": "breach of international law", "definition": "国際法に違反する行為のこと。国家間の合意や国際条約の違反を指す。"}, {"word": "disengagement agreement", "definition": "紛争当事者が軍事力を分離・撤退させることを定めた国際協定。紛争の拡大防止を目的とする。"}]}, {"title_ja": "ロイヤルエキスパート、ハリー王子とメーガンのUK復帰計画についてコメント", "title_en": "Royal Experts Discuss Prince Harry and Meghan's Planned Return to UK", "summary_ja": "ロイヤルエキスパートのロバート・ジョブソンとビクトリア・マーフィーは、ハリー王子とメーガンの英国への移住計画についての見解を述べました。専門家らは、この潜在的な転居が王族とその力関係にもたらす影響について論じています。", "summary_en": "Royal experts Robert Jobson and Victoria Murphy have shared their insights on Prince Harry and Meghan's plans to move back to the United Kingdom. The experts weigh in on what this potential relocation could mean for the royal family and its dynamics.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Culture/royal-experts-explain-prince-harry-meghans-plannedmove-back/story?id=135805996", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、速報ニュースとライブイベントを24時間体制でカバーしています。主要なストーリーが展開する際のリアルタイム更新で常に情報を得ることができます。国内外のニュースに関する包括的なレポートにアクセスしてください。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. Stay informed with real-time updates on major stories as they develop. Access comprehensive reporting on national and international news.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヘイデン・パネッティーアの死去後、ニュートロジーナが批判に対応", "title_en": "Neutrogena Responds to Backlash Following Hayden Panettiere's Death", "summary_ja": "女優ヘイデン・パネッティーアが36歳で死去したことを受け、ニュートロジーナは同社に向けられた批判に対応しました。この反発は、同社と女優の関係または過去の関わりに関連して生じました。スキンケアブランドは世論の反応に対し声明を発表しました。", "summary_en": "Neutrogena has addressed criticism directed at the company following the death of actress Hayden Panettiere at age 36. The backlash emerged in connection with the company's relationship or previous involvement with the actress. The skincare brand released a statement in response to the public reaction.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Culture/neutrogena-acknowledges-hayden-panettiere-backlash-after-actresss-death/story?id=135817284", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権、1,200人の移民送還協定の一環としてリベリアに20人を強制送還", "title_en": "US deports 20 people to Liberia under Trump's 1,200-person migration deal", "summary_ja": "トランプ政権はリベリアへの新しい協定の下で移民の強制送還を開始し、最大1,200人がアフリカ西部の国に送られる可能性がある。この取り決めは政権が追求した最大規模の第三国強制送還協定であり、米国は援助1億2,400万ドルとビザ期間の延長を提供している。批評家は、この慣行が庇護申請者を本国に間接的に戻すための法的抜け穴を悪用していると主張しており、多くの被強制送還者は訪れたことのない国で安全上のリスクに直面している。", "summary_en": "The Trump administration has begun deporting migrants to Liberia as part of a new agreement that could see up to 1,200 people sent to the West African nation. This arrangement is the largest third-country deportation deal pursued by the administration, with the US offering $124 million in assistance and extended visa terms to Liberia in exchange. Critics argue the practice exploits legal loopholes to indirectly force asylum seekers back to their home countries, with many deportees facing safety risks in nations they've never visited.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/20/liberia-deportation-agreement", "state_media": false, "category": "社会", "full_text": "Twenty deportees from the United States arrived in Liberia on Thursday, as part of a new agreement that will see the west African country receive as many as 1,200 people under the Trump administration’s immigration crackdown.\nThe group arrived at the Roberts international airport outside the capital, Monrovia. The Liberia-US agreement is one of the largest third-country deportation arrangements pursued by the administration since Trump returned to office last year.\nThe Liberian information minister, Jerolinmek Piah said the 1,200 deportees will include African nationals as well as nationals from North America, South America and the Caribbean.\nDuring a briefing on Tuesday, Liberia’s justice minister, Natu Oswald Tweh, said that the majority of the deportees had committed migration-related violations and offenses, and that they could seek asylum in the west African country if they wished.\nThe US has agreed to extend visitor visas for Liberians from 12 to 36 months and pledged $124m in assistance as part of the arrangement.\nUnder a series of often-secret agreements, the Trump administration has deported thousands of people to nearly two dozen countries that are not their own, advocates say, with about 10 of them in Africa. A new report by Refugees International and Human Rights First say the Trump administration has reached deals with at least 35 countries and has sent roughly 23,000 people to 26 of them as of early August, and makes the Liberia agreement the largest single arrangement so far.\nImmigration lawyers have said the Trump administration uses deportations to third countries as a legal loophole to indirectly force asylum seekers back to their home countries.\nIn many cases, migrants are deported to countries they have never been to or where they face safety risks and are left with little choice other than to return to the home countries they were fleeing from.\nA February report by Senate foreign relations committee Democrats found the Trump administration had paid more than $32m to five governments, several with poor human rights records, to accept about 300 third-country deportees – including $1.1m per person to Rwanda for seven deportees, and $7.5m to Equatorial Guinea for 29, a sum exceeding all US aid to that country over the previous eight years.\nThe report found more than 80% of those sent to third countries had since returned home anyway, often at further cost to taxpayers, and cited cases where deportees with US court-ordered protections were removed to Ghana and Equatorial Guinea before being sent onward within days.\nThe state department disputed the report’s characterization of its enforcement record.\nThe Associated Press contributed reporting", "translation_ja": "", "vocab": [{"word": "third-country deportation", "definition": "第三国への強制送還。庇護申請者を出身国ではなく別の国に送還する移民慣行。"}, {"word": "loophole", "definition": "法律や規則の抜け穴。規則を避けるために利用できる技術的な欠陥や曖昧性。"}, {"word": "enforcement", "definition": "法律や協定の実施・執行。ルールが守られることを確保する行為。"}, {"word": "asylum seekers", "definition": "庇護申請者。迫害や危害から逃れるため、別の国で保護を求める人々。"}, {"word": "characterization", "definition": "特徴付け、描写。事実や状況をどのように説明・解釈するか。"}, {"word": "advocates", "definition": "提唱者、支持者。特定の立場や政策を支持し、推進する人々や団体。"}]}, {"title_ja": "中央アフリカ共和国の採金鉱山崩落で100人以上が死亡", "title_en": "Over 100 Dead After Artisanal Goldmine Collapse in Central African Republic", "summary_ja": "中央アフリカ共和国西部のザンボイエ村で火曜日に採金鉱山が地滑りにより崩落し、100人以上が死亡した。鉱山労働者が操業していた地下坑道の崩落が原因とみられている。当局は事故の調査を開始しており、この悲劇は地域全体の無認可採掘地における安全上の懸念を反映している。", "summary_en": "More than 100 people died when an artisanal goldmine collapsed due to a landslide in western Central African Republic on Tuesday. The incident in Zamboye village involved the collapse of underground tunnels where miners were operating, with rescue efforts ongoing to retrieve bodies and find survivors. Authorities have launched an investigation into the tragedy, which reflects ongoing safety concerns at unregulated mining sites across the region.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/20/gold-mine-collapse-deadly-landslide-central-african-republic", "state_media": false, "category": "IT", "full_text": "More than 100 people have died after an artisanal goldmine at a small village in western Central African Republic (CAR) caved in due to a landslide, local officials and aid workers said on Wednesday.\nThe landslide happened on Tuesday afternoon in the village of Zamboye, about 50km (31 miles) from the town of Baboua and close to the border of Cameroon. Footage on social media appeared to show an avalanche of sand descend on a group of people, likely the miners, and cover them.\nA statement by a local public prosecutor said many others were trapped under the deluge. It did not mention the number of fatalities. However, Gervais Ganagoroh, a Red Cross volunteer involved in the relief effort, told the Associated Press news agency on Wednesday that more than 100 bodies had been recovered from the collapse and a senior official at a local mining association confirmed that number to Reuters.\nLocal media in CAR reported that authorities had launched an investigation into the incident. A second prosecutor from Baboua told the press that the incident is believed to have been caused by “the collapse of several underground tunnels in which miners were operating”.\n“The ground completely collapsed and buried people,” Cedric Mbango, a miner at the site, told the AFP news agency, describing the incident as “catastrophic”.\nRescuers are racing to retrieve the bodies of victims and find survivors among the miners, believed to be nationals of CAR and Cameroon. Authorities in Cameroon’s Eastern region said at least three of its citizens have been identified as victims in the incident.\nGrégoire Mvongo, the region’s governor told state-owned radio on Wednesday that he was “working in close collaboration with our Central African colleagues to deal with the aftermath of this tragedy”.\nBertrand Be Yangué, a member of the Zamboye youth council, said that “finding them alive would be a miracle.” He added: “We are saddened and heartbroken to see young men and women perish after coming to the mines to save their families from despair.”\nThe toll is expected to rise as the rescue efforts continue, added Yangué.\nThe Central African news website Corbeau News reported that heavy machinery, including tractors, was being used in the retrieval mission and could jeopardise the rescue of those still alive under the landmass.\nThe exact number of people who were in the mine at the time of the cave-in remains unknown.\nSmall scale artisanal mines are common in different parts of Africa, despite regulations criminalising them, as unemployment continues to drive able-bodied men to abandoned or unused mines, to eke a living. The mining sites often operate with weak safety standards leading to repeated incidents: at least 40 people have died in several mining incidents in CAR this year alone.", "translation_ja": "", "vocab": [{"word": "artisanal", "definition": "小規模で伝統的な手工業的方法で行われることを意味する。特に鉱業では、大規模採掘ではなく個人や小グループによる採掘を指す。"}, {"word": "deluge", "definition": "大量の何かが一度に押し寄せることを意味する。ここでは土砂が大量に崩れ落ちてきた様子を表している。"}, {"word": "toll", "definition": "災害や事故による死傷者の数、または費用や代償を意味する。この文脈では犠牲者の数を指す。"}, {"word": "jeopardise", "definition": "何かを危険にさらす、危機に陥らせることを意味する動詞。救助活動が生存者を危険にさらす可能性を表している。"}, {"word": "eke", "definition": "わずかな収入や資源を工夫して生活する、という意味の動詞。困難な状況で何とか生計を立てることを指す。"}]}, {"title_ja": "ケニアのサファリヘリコプター墜落事故で米国人5人を含む7人が死亡", "title_en": "Five Americans among seven killed in safari helicopter crash in Kenya", "summary_ja": "ケニア北部で水曜日の朝、サファリ用ヘリコプターが墜落し、乗員乗客7人全員が死亡しました。被害者には米国テレムンド放送のフロリダ支局長ホセ・スアレス氏とエクアドル国家情報機関長ミケーレ・センシ・コントゥージ氏が含まれています。ユーロコプターEC130 B4がマウント・オロロクウェ付近の遠隔地でチャーター飛行中に墜落しました。", "summary_en": "A safari helicopter carrying seven people crashed in northern Kenya on Wednesday morning, killing all onboard including five US citizens. Among the victims were José Suárez, president of Telemundo stations in Florida, and Michele Sensi-Contugi, Ecuador's national intelligence director. The Eurocopter EC130 B4 was operating a charter flight in a remote area near Mount Ololokwe when it crashed.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/19/kenya-helicopter-safari-crash", "state_media": false, "category": "社会", "full_text": "Seven people, including five Americans, were killed when a safari helicopter crashed on Wednesday morning in a remote part of northern Kenya, according to local police and the state department.\nAmong the dead were an executive with Telemundo, the US-based Spanish-language network owned by NBC Universal, and the director of Ecuador’s national intelligence service.\nThe helicopter crashed at 9.13am while flying from the Loisaba Conservancy to the Ewaso Nyiro area in Samburu county, according to the Kenya Civil Aviation Authority, which said in a statement that an investigation was under way. It said there were seven people onboard – six passengers and the pilot.\nLate on Wednesday, David Nkoroi, the police commander for Samburu, told reporters that all seven people onboard had died.\nIn Washington, the state department said five of those killed were US citizens. “The US embassy is in touch with local authorities and is providing consular assistance,” it said. “We extend our deepest condolences to the families and loved ones on their loss.”\nThe identities of the victims were not revealed but a local television station in Miami, Florida, said that José Suárez, 55, president and GM of several Telemundo stations in Florida, was among those killed.\n“We are heartbroken to learn the tragic news that José was killed in a helicopter accident in Kenya,” the NBC affiliate in Miami quoted from a joint statement from NBC Universal and Telemundo leadership.\nThe helicopter crashed in a rugged area in the foothills of Mount Ololokwe, a popular tourist destination in the country, local media reported. The helicopter, owned by local company Lady Lori Helicopters, was carrying guests with the travel company +Beyond.\nLady Lori Helicopters said in a statement that the aircraft was operating a charter flight when it crashed.\nTropic Air Kenya, a local safari operator, said in a statement that it dispatched two of its helicopters to aid search and rescue operations.\nThe aviation authority said the aircraft was a Eurocopter EC130 B4.\nEcuador confirmed later on Wednesday that Michele Sensi-Contugi, director of the country’s national intelligence center, died in the helicopter crash in Kenya.\nIn a statement posted on X, the presidency said: “In this moment of deep sorrow, the government extends its heartfelt condolences to his family, loved ones and close associates.”\nSensi-Contugi was visiting Kenya as a tourist with his wife, Stephany Hollihan Vasconez, who also died in the crash. She was a US and Ecuadorian citizen. They are survived by their two children.\nHelicopter crashes have happened with increasing regularity in Kenya, which has a thriving tourism industry that depends on domestic carriers to ferry visitors to distant places like Mount Ololokwe.\nIn February, a legislator was among six people who died after a helicopter crash in a hilly area of western Kenya.", "translation_ja": "", "vocab": [{"word": "consular assistance", "definition": "領事館が提供する公式な支援。海外での国民の問題や苦難に対して、政府が行う外交的サポートを指します。"}, {"word": "charter flight", "definition": "特定の顧客や団体のために専用にレンタルされた飛行。定期便ではなく、特別な目的で手配される航空輸送です。"}, {"word": "thriving", "definition": "繁栄している、成功している。ビジネスや産業が活発に成長・発展している状態を表します。"}, {"word": "rugged", "definition": "険しい、ごつごつした。地形が荒々しく、不規則で難しい地域を描写する際に使われます。"}, {"word": "foothills", "definition": "山麓、丘陵地帯。大きな山の麓にある低い山々や丘の連なりを指します。"}]}, {"title_ja": "米国、キューバの鉱業・建設部門に新たな制裁を実施", "title_en": "US Imposes New Sanctions on Cuban Mining and Construction Sectors", "summary_ja": "米国はキューバの鉱業・金属・建設部門の国営企業9社と国家機関の指導者3名を対象とした新たな経済制裁を発表した。トランプ政権はこれらの企業がキューバの弾圧的な政府を支援していると主張し、島の経済を不安定化させ体制転換を強制することを狙った『最大圧力』キャンペーンの一部としている。", "summary_en": "The United States has announced fresh economic sanctions targeting nine Cuban state-owned companies in mining, metals, and construction, as well as three leaders of a state organization. The Trump administration claims these entities support Cuba's repressive government, part of a broader 'maximum pressure' campaign to destabilize the island's economy and potentially force regime change.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/20/us-pummels-cuban-economy-with-new-sanctions-on-mining-construction?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US pummels Cuban economy with new sanctions on mining, construction\nUS economic restrictions have strained the island’s already fragile economy, prompting blackouts and medical shortages.\nThe United States has announced another round of economic sanctions against Cuba, this time targeting nine state-owned mining, metal and construction companies.\nA notice posted on the US Treasury Department’s website on Thursday showed Cuba’s Ministry of Construction of Cuba among the sanctioned entities, as well as government-controlled import companies.\nRecommended Stories\nlist of 3 items\n- list 1 of 3‘To play God’: Cuba’s healthcare system collapses under US pressure\n- list 2 of 3US diplomat Rubio targets Cuban military officials, companies in sanctions\n- list 3 of 3Seven decades of US regime change efforts: What have they achieved?\nEnterprises that extract and trade the island’s minerals, like the mining group GEOMINSAL, were also on the list. Cuba holds significant deposits of cobalt and nickel.\nIn addition to the nine entities, three leaders at the Cuban Institute of Friendship with the Peoples (ICAP), a state organisation designed to foster international relations, were sanctioned as well.\nThe administration of US President Donald Trump portrayed the targeted individuals and groups as national security threats in an accompanying statement, written by Secretary of State Marco Rubio.\nRubio, a longtime proponent of government change in Cuba, accused the mining and construction companies of helping to “sustain the regime’s repressive apparatus”.\nHe also blasted ICAP for allegedly organising a “subversive network” of “international sympathisers” to help Cuba’s government.\n“The Trump Administration will not stand by while a hostile foreign power seeks to exploit our freedoms — none of which are afforded to its people — by misleading and corrupting American citizens with lies, spy tradecraft, and other malfeasance,” Rubio wrote.\nHe added that ICAP’s activities help Cuba with its goal of “exporting Marxism, racial resentment, and Communist violence across the world”.\nWhile the US has long sought to isolate Cuba over political differences, the Trump administration has pressed forward with a “maximum pressure” campaign designed to topple the island’s government.\nFollowing the military operation to abduct and imprison Venezuelan President Nicolas Maduro on January 3, Trump has turned his sights to Cuba, an island roughly 145 kilometres, or 90 miles, from the US state of Florida.\nSince the mid-20th century, the island has been been governed as a socialist state under the one-party rule of the Communist Party of Cuba.\nIn remarks earlier this year, Trump indicated that, once the US-Israeli war against Iran reaches an end, “Cuba is next” for regime change.\nHe has floated ideas including a “friendly takeover” of the island, and his administration has conducted negotiations with Cuban officials. Media reports have suggested he sought, at one point, the resignation of Cuban President Miguel Diaz-Canel.\nTo heighten the pressure on Diaz-Canel’s government, his administration has implemented a series of withering measures meant to destabilise the Cuban economy.\nAmong them has been a de facto fuel blockade that began in January. Trump cut off Cuba’s supply of oil from Venezuela and proceeded to threaten any country that exports fuel to the island with tariffs. Only one oil tanker, from Russia, has docked at the island since.\nIn May, Trump also unveiled a new executive order authorising his government to impose far-reaching sanctions on those “responsible for repression” in Cuba. Thursday’s economic measures cite that order as justification.\nTrump’s pressure campaign has contributed to energy blackouts and shortages of crucial goods, including medicine, on the island.\nUnited Nations officials have warned that such conditions could trigger a humanitarian crisis. In March, for instance, a group of UN experts warned that the fuel blockade amounts to an illegal form of “energy starvation“.\nThe following month, UN Human Rights Commissioner Volker Turk pointed to accelerating infant mortality rates, as well as a decline in survival among children with cancer. He warned that the growing restrictions against the island are fuelling those health outcomes.\n“The fuel restrictions imposed since early 2026 and recent tightening of extraterritorial sanctions, taken together, are directly harming Cubans, especially the most vulnerable,” Turk said in a statement. “These sanctions must be lifted immediately.”\nBut the Trump administration has argued that Cuba poses a national security threat to the US, thereby necessitating the sanctions.", "translation_ja": "", "vocab": [{"word": "pummels", "definition": "繰り返し激しく打つ、または厳しく攻撃することを意味します。経済的な強い圧力を表現する際に使用されます。"}, {"word": "fragile", "definition": "壊れやすい、または不安定な状態を表現する形容詞です。経済や社会情勢の危機的状況を示します。"}, {"word": "repressive apparatus", "definition": "弾圧的な装置・機構を指します。政府が国民を統制・支配するために用いるシステムを意味する政治用語です。"}, {"word": "extraterritorial", "definition": "その国の領土外の行為や人物に対して適用される法律的管轄権を意味します。国家主権を超えた規制を表します。"}, {"word": "destabilize", "definition": "安定した状態を不安定にする、または崩壊させることを意味します。政治・経済的な混乱を引き起こすことを示します。"}, {"word": "humanitarian crisis", "definition": "大規模な人道的災害や緊急事態を指します。食糧不足や医療の欠乏など、人命に関わる深刻な状況を表現します。"}]}, {"title_ja": "コロンビアの違法金鉱山での地滑りで13人が死亡", "title_en": "Landslide at Illegal Gold Mine Kills 13 in Colombia", "summary_ja": "コロンビア南西部の認可されていない金鉱山で地滑りが発生し、少なくとも13人が死亡し7人が負傷した。鉱山ではおよそ50人の労働者が働いており、その大多数はキジャシンガ先住民族に属していた。地元当局は、違法採掘事業の危険な状況に起因する悲劇であることを確認した。", "summary_en": "At least 13 people were killed and seven injured when a landslide occurred at an unlicensed gold mine in southwest Colombia. The mine employed approximately 50 workers, most of whom belonged to the Quillacinga indigenous group. Local officials confirmed the incident as a tragedy resulting from unsafe conditions at the illegal mining operation.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/20/landslide-at-illegal-gold-mine-kills-13-people-in-colombia-2?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Landslide at illegal gold mine kills 13 people in Colombia\nNewsFeed\nLandslide at illegal gold mine kills 13 people in Colombia\nAt least 13 people have been killed and seven others injured in an unlicensed gold mine in southwest Colombia, local officials said. Residents said about 50 people, most belonging to the Quillacinga indigenous group regularly worked in the mine.\nPublished On 20 Aug 2026", "translation_ja": "", "vocab": [{"word": "unlicensed", "definition": "認可されていない、許可のない状態を意味する。鉱山、事業などが正式な法的許可を得ていないことを示す。"}, {"word": "landslide", "definition": "山崩れや土砂崩れを指す。大量の土砂や岩石が急速に斜面から滑り落ちる自然現象。"}, {"word": "indigenous", "definition": "先住民の、土着の意味を持つ。特定の地域に元々住んでいた民族や民族グループを指す。"}, {"word": "casualties", "definition": "死傷者、被害者を意味する。事故や災害によって死亡または怪我をした人々を指す。"}, {"word": "illicit", "definition": "違法な、不法な意味を持つ。法律で禁止されている、許可なく行われている活動を示す。"}]}, {"title_ja": "チベット人数百人が頭を剃って中国の民族統一法に抗議", "title_en": "Hundreds of Tibetans Protest China's Ethnic Unity Law by Shaving Heads", "summary_ja": "ニューデリーのチベット人亡命者数百人が、頭を剃ることで中国の民族統一・発展法に対する抗議活動を行いました。この集会は、チベット民族に対する中国の政策を批判するための象徴的な抵抗行為として組織されました。", "summary_en": "Hundreds of Tibetan exiles in New Delhi staged a protest against China's ethnic unity and progress law by shaving their heads. The demonstration was organized as a symbolic act of resistance to criticize China's policies toward Tibetan ethnic minorities.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/20/hundreds-of-tibetans-protest-chinas-ethnic-unity-law-by-shaving-heads?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Hundreds of Tibetans protest China’s ethnic unity law by shaving heads\nNewsFeed\nHundreds of Tibetans protest China’s ethnic unity law by shaving heads\nA protest organised by hundreds of Tibetans in New Delhi led many exiles to shave their heads, calling out and criticising China’s ethnic unity and progress law.\nPublished On 20 Aug 2026", "translation_ja": "", "vocab": [{"word": "exiles", "definition": "自国を離れて他国に住む人々。政治的理由や強制的な状況により祖国を離れた人々を指します。"}, {"word": "ethnic unity", "definition": "異なる民族背景を持つ人々の間の統一性や結束。ここでは政策用語として使用されています。"}, {"word": "symbolic", "definition": "具体的な意味や理念を表現するために使用される象徴的な。文字通りではなく、深い意味を込めた行動や物体を表します。"}, {"word": "demonstration", "definition": "政治的主張や意見を公に表明するための集会やデモ。大人数が参加して意思表示を行う活動です。"}, {"word": "criticize", "definition": "何かの欠点や問題点を指摘し、評価や判断を示すこと。政策や行為に対して反対意見を表明します。"}]}, {"title_ja": "ペルー南部アンデス山脈でマグニチュード6.7の地震が発生", "title_en": "Magnitude 6.7 Earthquake Strikes Peru's Southern Andes", "summary_ja": "2026年8月21日、ペルー南部アンデス山脈でマグニチュード6.7の地震が発生し、アヤクチョ州パリナココチャス州のウパワチョ市の北西38キロメートルを震源としていた。震源の深さは66.7キロメートルで、イカやアレキパを含む南部の複数地域で揺れが観測された。現在のところ、被害報告はない。ペルーは太平洋の「環太平洋火山帯」に位置しており、頻繁な地震活動を経験している。", "summary_en": "A magnitude 6.7 earthquake shook Peru's southern Andes Mountains on August 21, 2026, centered 38 kilometers northwest of Upahuacho in the Ayacucho region at a depth of 66.7 kilometers. The tremor was felt across several southern regions including Ica and Arequipa, with no immediate reports of damage. Peru experiences frequent seismic activity as it lies on the Pacific Ring of Fire.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/magnitude-earthquake-shakes-peru-southern-andes/article71370825.ece", "state_media": false, "category": "社会", "full_text": "A magnitude 6.7 earthquake shook Peru’s southern Andes Mountains on Thursday (August 21, 2026), according to the U.S. Geological Survey. There were no immediate reports of damage.\nThe USGS said the quake occurred at 1 p.m. local time and was centred 38 kilometres northwest of the city of Upahuacho, in the Parinacochas province of the Ayacucho region. It had a depth of 66.7 kilometres.\nThe earthquake was felt in several regions of southern Peru, including Ica and Arequipa.\nEarthquakes are frequent in Peru, which is part of the Pacific “Ring of Fire\", an area of frequent seismic activity.\nIn 2007, a magnitude 7.9 earthquake in a province of the Ica region left nearly 600 people dead.\nPublished - August 21, 2026 12:59 am IST", "translation_ja": "", "vocab": [{"word": "magnitude", "definition": "地震の規模を表す尺度で、エネルギー放出量に基づいて計測される値。数字が大きいほど強い地震を示す。"}, {"word": "seismic", "definition": "地震に関連した、または地震による現象を指す形容詞。地震活動や地震波などで用いられる。"}, {"word": "centred", "definition": "特定の地点を中心に位置することを意味する。地震では震源地を表現する際に使用される。"}, {"word": "Ring of Fire", "definition": "太平洋を取り囲む地震活動が活発な地帯で、多くの火山と地震が集中する地域。環太平洋火山帯のこと。"}, {"word": "depth", "definition": "地震の震源が地表面下どの程度の深さにあるかを示す距離。キロメートル単位で表現される。"}, {"word": "tremor", "definition": "地震による揺れや振動を指す。小規模な地震や地震動を表す正式な用語。"}]}, {"title_ja": "恒大集団創業者の会社を貴人が金融詐欺で終身刑に判決", "title_en": "Evergrande Founder Hui Ka Yan Sentenced to Life in Prison for Financial Fraud", "summary_ja": "中国の不動産開発企業恒大集団の創業者である会社を貴人（フイ・カーヤン）が大規模な金融詐欺で終身刑と20億ドル以上の罰金を言い渡された。同社は資産を水増しし負債を隠蔽していた。この有罪判決は、3000億ドル以上の負債で経営破綻し、2020年以降の中国の不動産市場全体の低迷をもたらした恒大集団の衰退における重要な節目となっている。", "summary_en": "Chinese property developer Hui Ka Yan, founder of Evergrande, has been sentenced to life imprisonment and fined over $2 billion for large-scale financial fraud that inflated assets and concealed liabilities. The conviction marks a milestone in the collapse of Evergrande, which defaulted with over $300 billion in liabilities and triggered a broader downturn in China's real estate sector since 2020.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/chinese-court-sentences-founder-of-troubled-property-developer-evergrande-to-life-in-prison/article71370604.ece", "state_media": false, "category": "社会", "full_text": "Chinese property developer Hui Ka Yan, founder of the Evergrande real estate group, has been sentenced to life in prison and the companies were fined a total of more than $2 billion, a court in the southern city of Shenzhen said Thursday (August 20, 2026).\nThe decision marks a milestone in Evergrande's saga after it collapsed with more than $300 billion in liabilities when Chinese authorities cracked down on excessive borrowing in the real estate industry in 2020. That triggered a crunch among many developers and brought on a downturn in the property market that has weighed on the broader economy ever since.\nThe Shenzhen Intermediate People's Court convicted Hui, 67, and Evergrande of engaging in large-scale financial fraud in inflating the group's assets and concealing its liabilities.\nIn a statement, the court also said Hui, also known as Xu Jiayin, abused his position in orchestrating fraud and misappropriating company assets.\nEvergrande Group was fined 8.82 billion yuan ($1.31 billion), and Evergrande Real Estate Group was fined 7 billion yuan ($1.04 billion), the court said in the statement.\n\"The amount involved is exceptionally large, the circumstances are particularly egregious, and extraordinarily heavy economic losses have been caused,\" the court's statement said. \"The harm to society is extremely serious. Therefore, severe punishment should be given in accordance with the law.\" Hui's sons, Xu Tenghe and Xu Zhijian, were also sentenced alongside senior Evergrande executives and others linked to the group on charges including illegally taking public deposits, fundraising fraud and the illegal use of funds, China's official Xinhua News Agency said.\nA total of more than 50 individuals were sentenced to imprisonment of between 22 months and 18 years, Xinhua said, although a breakdown of sentencing details was not provided.\nA photo of Hui's courtroom appearance released by the Shenzhen court on Thursday (August 20, 2026) showed an aged Hui, who used to be a high-profile figure but had long been out of public view, wearing a navy blue shirt and standing between two uniformed officers behind a sign that read \"defendant\".\nHui pleaded guilty in April to various charges, including illegal absorption of public deposits, fraud and bribery, after he was detained in China.\nChina Evergrande, founded in 1996, defaulted on its debts in 2021. It was the world's most heavily indebted real estate developer before it was ordered to liquidate its assets. After Evergrande's downfall triggered the broader downturn in China's massive property sector, home prices have fallen by roughly 20% or more since 2021.\nAuthorities in Hong Kong and mainland China earlier said their investigations found Evergrande had manipulated its financial data by tactics that included prematurely booking revenue from property sales before completion and delivery of the apartments to buyers. Revenues were overstated by roughly $80 billion over 2019 and 2020, they said.\nHui was fined 47 million yuan ($6.5 million) in 2024 and banned from China's securities markets for life by the China Securities Regulatory Commission over inflating company financial results, among other issues.\nOnce reported to be China's richest man, Hui used to own the football club Guangzhou Evergrande. At one point, he and his companies were involved in investing in and building theme parks and electric vehicles.\nHis story was one of rags-to-riches. Born in 1958 into a rural family in central China's Henan province, he worked in the steel industry in the 1980s before establishing Evergrande, which then prospered during China's housing market boom. He was one of many businessmen who have also gained political influence by joining a major advisory organisation, the Chinese People's Political Consultative Congress.\nPublished - August 20, 2026 10:24 pm IST", "translation_ja": "", "vocab": [{"word": "liabilities", "definition": "企業や個人が負う法的および金銭的な義務や借金のこと。貸借対照表で資産と対比される会計用語として使用される。"}, {"word": "default", "definition": "債務者が債務の支払いを期限までに行わないこと。金融や法律の文脈で、契約上の義務を果たさない状態を指す。"}, {"word": "egregious", "definition": "きわめて悪質で許されない、または極めて目立つという意味の形容詞。特に違法行為や過ちの深刻さを強調する際に用いられる。"}, {"word": "fraud", "definition": "詐欺行為で、他者を欺いて不正な利益を得る違法行為のこと。金銭詐欺や財務詐欺など様々な形態がある。"}, {"word": "misappropriating", "definition": "自分の職務や権限を不正に使用して、会社や他者の資産を自分のものにする横領行為のこと。"}, {"word": "liquidate", "definition": "企業の資産を現金に換えて売却すること。通常、企業の破産や解散時に行われる。"}, {"word": "downturn", "definition": "経済、市場、または産業の活動が減少し悪化する期間のこと。景気後退や不況を指す経済用語。"}]}, {"title_ja": "ルーマニア、海上ガスプロジェクト近くの爆発物搭載ドローンを撃墜、ロシアを非難", "title_en": "Romania Destroys Explosive-Laden Drone Near Offshore Gas Project, Blames Russia", "summary_ja": "ルーマニアのF-16戦闘機が2026年8月20日、黒海のネプトゥン・ディープ海上ガスプロジェクト近くで爆発物を搭載した海洋ドローンを撃墜した。ルーマニア大統領はこの事件をロシアによるハイブリッド戦争キャンペーンの一部と非難した。このドローン事件は、ウクライナ・ロシア紛争の中で東欧全域で増加する無許可のドローン活動と同時に発生した。", "summary_en": "A Romanian F-16 fighter jet destroyed a marine drone loaded with explosives near the Neptun Deep offshore gas project in the Black Sea on August 20, 2026. Romania's President blamed Russia for the incident, calling it part of an escalating hybrid warfare campaign against NATO members. The drone incident coincides with multiple unauthorized drone activities across Eastern Europe amid the ongoing Ukraine-Russia conflict.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/romania-destroys-drone-near-offshore-gas-project-blames-russia/article71370570.ece", "state_media": false, "category": "政治", "full_text": "A Romanian F-16 fighter jet on Thursday (August 20, 2026) destroyed a marine drone near an offshore gas project, with Romania's President blaming Russia for the latest incident involving the NATO member bordering Ukraine.\nUnauthorised drone activity has become increasingly frequent in recent months across eastern European countries as Ukraine fights off a Russian invasion launched in 2022, with both countries increasingly relying on drone warfare.\nIn the latest incident, the drone that was destroyed was \"loaded with explosives\" and did not originate from Ukraine, Defence Minister Radu Miruta said on Facebook.\n\"I strongly condemn the escalation of such irresponsible incidents on the part of the Russian Federation,\" Romanian President Nicusor Dan said on X.\nEuropean Commission chief Ursula von der Leyen also slammed \"an escalating campaign of threats\" against the bloc, \"unsettling our citizens and seeking to divide our Union\".\n\"This is hybrid warfare,\" she wrote on X.\nThe drone was spotted at 6:28 a.m. local time (0328 GMT) by a commercial vessel, hundreds of metres from the offshore gas project Neptun Deep and 80 nautical miles east of the Black Sea city of Constanta, according to a press release from the defence ministry.\nTwo Romanian F-16 aircraft were deployed to respond, and one of them destroyed it.\nHundreds of people are currently working at Neptun Deep, according to the government. Neptun Deep is due to start production in 2027.\nIn early June, a Ukrainian maritime drone exploded in Romania's Black Sea port of Constanta without causing casualties.\nKyiv said the drone had been knocked off course by Russian electronic interference.\nNATO has shot down four aerial drones in Romania recently, with the latest incident happening during last weekend.\nThe Eastern European country also reported an aerial drone crash on Thursday (August 20, 2026) following Russian strikes on Ukraine.\nIt fell in an unpopulated area four kilometres (2.5 miles) northeast of the village of Grindu in eastern Romania, close to the border.\nNo casualties were reported.\nUkrainian President Volodymyr Zelenskyy on Thursday (August 20, 2026) urged a global response to Moscow's \"escalation\" of the four-year war after Russian bombardments killed at least 16 people in Kyiv and surrounding areas overnight.\nPublished - August 20, 2026 10:08 pm IST", "translation_ja": "", "vocab": [{"word": "hybrid warfare", "def
