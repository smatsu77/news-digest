inian conflict.\n“We express deep concern over the continued escalation of tensions in Middle East/West Asia and, recalling our respective national positions, call for exercising maximum restraint, as well as avoiding actions that could further aggravate the situation,” the joint declaration said.\n‘Two-state solution’\nThe meeting in New Delhi earlier drew attention as the Iranian parliamentary delegation’s chief, Mohammad Baqer Ghalibaf, cancelled his India visit in the wake of growing hostilities between Saudi Arabia and the Houthi forces.\nDespite the absence of Mr. Ghalibaf, who has been a key interlocutor in direct and indirect negotiations during the ongoing conflict, the forum provided opportunities for the exchange of views among stakeholders in West Asia. Several key policymakers from the region attended, including Ali Rashid Al Nuaimi, Chairman of the Defence Affairs, Interior and Foreign Affairs Committee of the United Arab Emirates.\nTies between the UAE and Iran have nosedived, as Iran attacked the Gulf nation as part of its strategy of retaliation against the U.S.-led attacks that began on February 28. Meeting a small group of journalists on the sidelines of the forum, Mr. Al Nuaimi spoke forcefully in favour of the two-state solution for the Israel-Palestinian crisis, without hurting Israel’s interests. “Around 160 countries recognise Israel, and it is a reality in the region. But the tragic situation has shown that the Palestinian state is needed. With this in mind, we need to restart the negotiation for a two-state solution,” Mr. Al Nuaimi said.\nThe joint declaration also addressed the ongoing conflict in the Gaza Strip. “We reaffirm our unwavering support for the peaceful resolution of the Israeli-Palestinian conflict based on the two-state solution, with the two States living side by side, in peace and security, in accordance with international law and relevant United Nations resolutions, asserting the right of the Palestinian people to self-determination, freedom and an independent, sovereign state.”\nUndermining international law\nThe BRICS Parliamentary Forum obliquely addressed the U.S.-Israel attack on Iran and the BRICS stance against attacks on member countries, “We call for the elimination of such unlawful measures which undermine international law and the principles and purposes of the UN Charter,” the joint declaration said.\nIt condemned acts of terrorism as “criminal and unjustified” and condemned the April 22, 2025 terror strike in Kashmir’s Pahalgam in the “strongest terms”. It added: “We call for an expeditious finalisation and adoption of the Comprehensive Convention on International Terrorism in the UN framework. We call for concerted actions against all UN designated terrorists and terrorist entities.”\nThe joint declaration added that inter-parliamentary exchanges among BRICS member countries provides a channel of communication and build trust among the member states. “Support the peaceful resolution of international disputes,” it said.\nPublished - October 27, 2026 09:46 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "トロント選挙結果速報：チャウ市長が勝利演説で「進歩的な都市」と宣言、モイーズがトロント中心部で落選", "title_en": "Toronto election results recap: Chow declares Toronto a ‘progressive city’ in victory speech; Moise loses Toronto Centre - Toronto Star", "summary_ja": "トロント市長選挙でオリヴィア・チャウ氏が勝利し、勝利演説でトロントを「進歩的な都市」と宣言しました。一方、モイーズ候補はトロント中心部選挙区での当選を逃しました。", "summary_en": "Toronto election results recap: Chow declares Toronto a ‘progressive city’ in victory speech; Moise loses Toronto Centre Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMitAFBVV95cUxOWThmR21sWkZDWTZSQ2RmejRTakZRYm5MRXVpVEp6VGJORU1aUmZoSDhaYXdHMklfaFhLV3dYa2gyQWxKTjRsN1EzS3VabmtHcG0xVU0wVHpVVXdGUlhpclBoVTI0LWVCN0VCS1gtWlIwV3hRSzdwQ2NIak9MdE82RjBiZkstZURkN082UFFDNHRvOTZ2dDRlWktSbm5SSW5zbzlqZDZPcjBLcm01aTVMbWtkS2Q?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "v he former African Development Bank president says he is willing to support Nigeria in any capacity, but insists he is not seeking a government job. The post ‘I have a duty to serve Nigeria, and I will’ — Adesina tells Tinubu appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/920868-i-have-a-duty-to-serve-nigeria-and-i-will-adesina-tells-tinubu.html", "state_media": false, "category": "政治", "full_text": "Former President of the African Development Bank (AfDB), Akinwumi Adesina, has declared his readiness to serve Nigeria in any capacity, saying he has a duty and responsibility to contribute to the country’s development.\nMr Adesina made the declaration on Tuesday after meeting President Bola Tinubu at the Presidential Villa in Abuja, where he briefed the president on his 10-year tenure at the continental development finance institution.\n“I’m fully able to help Nigeria in any capacity. I’ve always had that. You know, my heart is always at home,” he told journalists after the meeting.\nAsked what role he could play, Mr Adesina said he would help in any capacity the president considered appropriate, but stressed he was not seeking a government appointment.\n“I’m not looking for a job. I’m not looking for anything. I’m just here to help. It’s my country. I have a duty, an obligation, and a responsibility to do so, and I will,” he said.\nThere was no announcement of a specific role or appointment for the former AfDB president following the meeting.\nAdesina’s record in agriculture and development finance\nMr Adesina, an agricultural economist, served as Nigeria’s minister of agriculture and rural development from 2011 to 2015 under former President Goodluck Jonathan before becoming the first Nigerian to lead the AfDB.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe was elected president of the bank in May 2015 and re-elected for a second five-year term in August 2020. His tenure ended in 2025.\nAs agriculture minister, he championed reforms to the distribution of subsidised farm inputs, including an electronic-wallet system that let farmers receive support for seeds and fertiliser via mobile phones.\nThe AfDB said the programme reached 15 million farmers within its first four years. The initiative was intended to improve access to agricultural inputs while reducing the role of intermediaries in their distribution.\nAt the AfDB, Mr Adesina oversaw the institution’s development agenda, which included expanding electricity access, improving food security, industrialising African economies, promoting regional integration and improving living standards.\nDuring his leadership, the bank’s general capital increased from $93 billion to $208 billion in 2019, following a decision by its shareholders, the largest capital increase in the institution’s history at the time.\nAfDB provided $7 billion to Nigeria in 10 years\nAt the meeting, Mr Adesina said the AfDB provided about $7 billion in financing to Nigeria between 2015 and 2025.\nHe compared this with the $11.1 billion in cumulative financing the bank had provided to Nigeria since it began operations in the country in 1971.\n“Within 10 years, we were able to do 63 per cent, literally, of that,” he said, adding that President Tinubu was pleased with the bank’s support to Nigeria during his tenure.\nMr Adesina said he used the meeting to commend the president for his economic reforms, particularly the removal of the petrol subsidy and the harmonisation of the foreign exchange windows.\nHe described the measures as difficult but said they were beginning to produce results.\nHe cited increased foreign exchange availability, the return of portfolio investors and a downward trend in inflation as signs of progress. However, he acknowledged that prices remained high for Nigerians.\nHe also pointed to improved assessments of Nigeria by some international rating agencies, saying the country’s outlook had shifted towards stable or positive assessments.\nThe comments come amid ongoing debate over the impact of the Tinubu administration’s economic reforms, including higher fuel costs after the removal of the petrol subsidy and changes to the foreign exchange market.\nAlthough the government has defended the measures as necessary to stabilise the economy, the higher cost of living has continued to put pressure on households and businesses.\nFrom economic stabilisation to growth\nMr Adesina said stabilising the economy was only the beginning, arguing that Nigeria must now focus on structural transformation, economic growth and prosperity.\nHe said President Tinubu recognised the need to move beyond macroeconomic reforms and address the broader challenge of transforming the economy.\n“I told the president, I’m back at home, here to help and ready to help. It’s my country. I love my country, and I’m ready to help,” he said.\nHis offer comes after a decade leading one of Africa’s major development finance institutions, a period during which the bank financed projects and programmes across sectors including agriculture, energy, transport and infrastructure.\nREAD AlSO: ‘I will forever miss you’ – Toluwanisings’ wife breaks down in tears at night of tributes\nMr Adesina’s meeting with the president also gave him an opportunity to formally brief the president on the completion of his two terms and th", "translation_ja": "", "vocab": []}, {"title_ja": "「永遠にあなたが恋しい」－トルワニシングスの妻が追悼式で涙に暮れる", "title_en": "‘I will forever miss you’ – Toluwanisings’ wife breaks down in tears at night of tributes", "summary_ja": "ナイジェリアの福音音楽家オラエミ「トルワニシングス」ボラジの妻アカンビ・エリザベスが、オヨ州イバダンで開催された追悼式で、亡き夫を失った悲しみについて涙ながらに語った。トルワニシングスは10月15日に自宅で倒れて亡くなり、数多くの福音音楽家や俳優が参列して彼の人生と音楽的遺産を祝った。家族は死因の真相解明まで埋葬の延期を主張している。", "summary_en": "Toluwanisings died on 15 October after he slumped at his residence in Ibadan, Oyo State. The post ‘I will forever miss you’ &#8211; Toluwanisings’ wife breaks down in tears at night of tributes appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/entertainment/naija-fashion/920866-i-will-forever-miss-you-toluwanisings-wife-breaks-down-in-tears-at-night-of-tributes.html", "state_media": false, "category": "社会", "full_text": "Akanbi Elizabeth could not hold back her tears as she mourned her late husband, gospel singer Olayemi “Toluwanisings” Bolaji, at a night of tributes in Ibadan, Oyo State, on Tuesday.\nThe widow broke down as she addressed mourners who gathered at Hall of Grace, Jogor Centre, in Oyo State to honour the late singer. Family members, colleagues, friends and associates attended the event to pay their respects to the “Kabiyesi Olorun Ayo” crooner.\nOvercome with grief, Elizabeth spoke of the pain of losing her husband and asked him to continue looking after her and their children despite his death.\nToluwanisings and his wife got married in September 2021 and had two daughters.\n“Toluwanisings, my dear husband. I will forever miss you. Please do not forget your children and me,” she said.\nSeveral gospel artistes and actors attended the tribute night, including Adeyinka Alaseyori, Esther Igbekele, Laolu Gbenjo, Akintayo Akinwande, Bidemi Olaoba, Peterson Okopi, Sarah Apekeola and Bimbo Oshin.\nThe artistes paid tribute through worship, songs and emotional reflections, celebrating the late singer’s life and musical legacy.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nBackstory\nToluwanisings died on 15 October after he slumped at his residence in Ibadan, Oyo State.\nPREMIUM TIMES earlier reported that his death sparked controversy over his burial, with his family yet to settle on whether to bury him in a cemetery, at his residence or in his hometown.\nThe family insisted that burial arrangements must remain on hold until the authorities establish the circumstances surrounding his death.\nREAD ALSO:Tompolo says Tinubu needs another term to consolidate reforms, presents 30 vehicles for mobilisation\nThey demanded a transparent, impartial investigation, warning they would not tolerate any attempt to compromise the process. The family also called on the government, community leaders and security agencies to prevent interference.\nThe family said they would continue to bear the mortuary costs until investigators uncovered the cause of death.\nThey also alleged possible foul play, citing what they described as an absence of visible mourning by the singer’s wife, workers and others at his residence when seven family members visited.\nThese claims remain allegations and, based on the information provided, have not been independently established.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ベヌエ州警察、29人の誘拐被害者を救出し、34人の外国人を含む34人の容疑者を逮捕", "title_en": "Police rescue 29 kidnap victims, arrest 34 foreigners in Benue – Official", "summary_ja": "ベヌエ州警察は10月の作戦で29人の誘拐被害者を救出し、34人の外国人を含む48人の容疑者を逮捕したと発表しました。クレタス・ンワディオグブ警察本部長は、逮捕された外国人にはカメルーン人16人とニジェール人18人が含まれていると述べています。警察はまた7丁の自製銃を回収し、複数の地域で誘拐事件の捜査を進めています。", "summary_en": "He said the command also killed a suspected bandit and recovered 16 rounds of ammunition and cartridges. The post Police rescue 29 kidnap victims, arrest 34 foreigners in Benue &#8211; Official appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/north-central/920863-police-rescue-29-kidnap-victims-arrest-34-foreigners-in-benue-official.html", "state_media": false, "category": "社会", "full_text": "The Police Command in Benue says it has rescued 29 kidnapped victims, arrested 48 suspects, including 34 foreign nationals, and recovered seven locally fabricated firearms.\nThe Commissioner of Police, Cletus Nwadiogbu, disclosed this on Tuesday in Makurdi while briefing journalists on the command’s operational achievements in October.\nHe said the 34 foreign nationals comprised 16 Cameroonians arrested in Otukpo on 9 October over concerns about their travel documents and immigration status, and 18 Nigeriens intercepted at Orokam on 22 October while travelling to Ikom, Cross River.\nMr Nwadiogbu said the suspects were being investigated, adding that the Nigeria Immigration Service would help verify their status and determine appropriate action under the law.\nHe said the command also killed a suspected bandit and recovered 16 rounds of ammunition and cartridges.\nOn kidnapping, the commissioner said four passengers abducted after gunmen attacked a commercial vehicle along the Uzer axis of Ayilamo–Tse-Abi Road in Logo Local Government Area on 5 October were rescued.\nHe said the driver was killed, while the passengers were rescued through a joint operation involving the police, Operation Whirl Stroke, Benue State Civil Protection Guards and local hunters.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMr Nwadiogbu added that 17 farmers abducted from Tse-Acha and Tse-Wuam communities in Bamun Village, Logo, were rescued on 7 October through a joint operation involving security personnel and local vigilantes.\nHe said eight kidnapped victims, including a Reverend Father, were also rescued in Ohimini Local Government Area following their abduction along Ugbokolo–Ajegbe–Awume Road on 13 October.\nAccording to him, two victims were rescued on 16 October, while the remaining six were freed on 18 October.\nHe said the victims were taken to the Federal University of Health Sciences Teaching Hospital, Otukpo, for medical examination and treatment, while two suspects were arrested in connection with the abduction.\nThe commissioner also disclosed that the command was investigating cases of child abuse, homicide, cult-related violence and defilement.\nHe said a suspect, Hemen Wuese, was arrested over the alleged abuse of two children in Injorov Village, Turan, Kwande Local Government Area, on 5 October.\nAccording to him, the children were allegedly subjected to severe physical abuse over an accusation involving N14,500, resulting in the death of one of them.\nHe said the surviving child was rescued and was in stable condition, while the deceased child’s body was deposited for autopsy.\nMr Nwadiogbu further said three suspects were arrested following an alleged cult-related attack on a resident along Maiduguri Street, Wadata, Makurdi, on Oct. 14.\nHe said the victim was taken to the Federal Medical Centre, Apir, but later died, adding that investigations were ongoing to establish the suspects’ individual roles.\nHe also disclosed that a 60-year-old man was arrested over the alleged defilement of a 10-year-old girl in Igumale, Ado Local Government Area.\nREAD ALSO: Army recover two AK-47 rifles after gunfight in Benue\nThe commissioner said the victim was taken for medical examination and treatment, while investigations continued.\nOn other security operations, Nwadiogbu said a suspected bandit was neutralised on 2 October during an encounter with Operation Zenda Joint Task Force personnel along Amaafu–Abaji Road in Katsina-Ala.\nHe said a locally fabricated firearm was recovered, while other suspected members of the group fled.\nThe commissioner urged residents to remain vigilant and provide credible information to security agencies to help prevent crime, identify threats and rescue victims.\nHe reaffirmed the command’s commitment to protecting lives and property and ensuring that offenders were brought to justice through lawful means.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to y  "", "vocab": []}, {"title_ja": "ドナルド・トランプは中東を愛しすぎるあまり滅ぼすかもしれない", "title_en": "Donald Trump may love the Middle East to death", "summary_ja": "トランプは民族主義的な強権指導者による中東支配と、グローバル商取引による経済成長という矛盾した目標を同時に実現しようとしている。この戦略は地域の安定性と国際的な経済秩序の両立という根本的な課題を無視している。専門家は、こうした政策では中東の長期的な繁栄と平和の達成は困難だと指摘している。", "summary_en": "The folly of wanting a Middle East run by nationalist strongmen and made rich by global commerce", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/10/27/donald-trump-may-love-the-middle-east-to-death", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "気候問題ニュースレター：どこまでゆっくりできるか？", "title_en": "The Climate Issue newsletter: How slow can you go?", "summary_ja": "『エコノミスト』の惑星問題編集者であるオリバー・モートンは、IPCCが重要な気候評価を提供するスピードの遅さを嘆いています。このニュースレターでは、気候変動に関する国連の主要な評価報告書の発表サイクルの問題点が取り上げられています。迅速な気候対策が求められる中、国際的な気候評価プロセスの効率性についての議論が展開されています。", "summary_en": "Oliver Morton, our planetary-affairs editor, laments the speed at which the IPCC delivers vital climatic stocktakes", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/10/26/the-climate-issue-newsletter-how-slow-can-you-go", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIの意外な人気", "title_en": "The surprising popularity of AI", "summary_ja": "裕福な西側諸国の人々とは異なり、世界中の多くの人々がAI技術に対して楽観的な見方をしている。この記事は、先進国と発展途上国の間でのAI認識の大きな相違を浮き彫りにしている。技術への希望と懸念の分断は、経済的背景と地域による期待値の違いに根ざしている。", "summary_en": "Unlike rich Westerners, many around the world feel hopeful about the technology", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/10/22/the-surprising-popularity-of-ai", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パリ西部の町トラップ、人種差別テロ攻撃の中心地が示す現代フランスの課題", "title_en": "Trappes, town at center of racist attack, tells the troubled story of contemporary France", "summary_ja": "10月23日の人種差別テロ攻撃によってパリ西部の貧困地域トラップが再び注目を集めた。1945年から1975年の経済成長期に移民労働者の受け皿となったこの約35,000人の町は、現代フランス史の四分の三世紀の歴史を物語っている。", "summary_en": "The racist terrorist attack of October 23 put this impoverished town west of Paris back in the spotlight. A cradle of immigrant labor during the 30 years of economic growth from 1945 to 1975, this town of around 35,000 inhabitants tells the story of three-quarters of a century of contemporary histor", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/10/27/trappes-town-at-center-of-racist-attack-tells-the-troubled-story-of-contemporary-france_6765475_7.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相の投票時間延長要求、選挙委員会が却下", "title_en": "Netanyahu's request to extend Israeli election voting hours rejected by elections committee", "summary_ja": "イスラエルの選挙委員会は、ネタニヤフ首相による投票時間の延長要求を拒否した。投票率は1999年以来の最高水準となる77%以上に達した。火曜夜の初期予測では、対立政党がネタニヤフ首相をわずかに上回る見通しが示されている。", "summary_en": "Voter turnout was the highest since 1999, with more than 77% of eligible voters casting ballots. Initial projections on Tuesday night showed that Israeli voters gave a narrow edge to opposition parties over Prime Minister Benjamin Netanyahu.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/10/27/record-turnout-as-israeli-voters-deliver-verdict-on-netanyahu_6765419_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス政府、学生デモに対処する施策を発表", "title_en": "French government announces measures to address student protests", "summary_ja": "月曜日、教育・高等教育担当大臣がフランス政府の危機対応計画を発表した。これらの施策はマクロン大統領の任期中に導入された改革の一部を撤回するもので、過去10年間に繰り返し批判されてきた長年の課題に取り組むことを目的としている。", "summary_en": "On Monday, the education and higher education ministers presented the government's plan to address the crisis. These measures, which roll back some reforms ZGQW9Ca0JUWlphUVNvcE9xN3htMl9lSkRxLUNjUmkyTUE?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アイゼンコット：出口調査は「イスラエル多数派の勝利」、ネタニヤフ首相の交代を誓う", "title_en": "Eisenkot: Exit Polls 'Victory for Israeli Majority,' Vows to Replace Netanyahu - Haaretz", "summary_ja": "イスラエルの政治指導者アイゼンコットは、最新の出口調査結果をイスラエルの多数派による勝利と評価した。彼はネタニヤフ首相の交代を実現させることを強く誓い、政権交代への決意を示した。", "summary_en": "Eisenkot: Exit Polls 'Victory for Israeli Majority,' Vows to Replace Netanyahu Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilwJBVV95cUxNamhlRlBmY0RkS2NHRXliRWcxNGN2SC11UFdPUVBoUVVYZ2F2bllWY2ZBWEczZWd6eERsQ0tlZmxSUzZoTXZIcVRBT19ldmdWckVwQk94U09vaG1KM3VmTDQ0ajVxd0JPeHBWdE00V2xYUjVycG1yNHZZQURoQnROZ2NsRFpVYUdxNTllUEVlRjR3dDhDSE1sMXFtcnQ2UlVHaU1XY29ZMWs2dVJVNHNNX2hvX0ZDV1o5Q2l2aEdXYnZvT3hFQ0EtMEl3NXdIMlJ6QVViSEhqUXhuODE5QlpSUmpvbmxlcy1xcHdjRXpzQVNrc3RZOHdVQkswQm8yVjJ2MGpCWTcxR0xCTEdJOUZGdlAzZm52T0E?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "澎湖沖で中国が日本海上保安庁の8隻の船舶を追跡：台湾", "title_en": "8 Japan Coast Guard vessels shadowed by China near Penghu: Taiwan - Focus Taiwan", "summary_ja": "台湾は、澎湖諸島近海で中国が日本の海上保安庁の8隻の船舶を追跡したと報告した。この事件は、東シナ海における海上安全保障の緊張を示す出来事である。中国の海洋活動の活発化が、この地域での国際的な懸念を高めている。", "summary_en": "8 Japan Coast Guard vessels shadowed by China near Penghu: Taiwan Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1jZl9ic1gwb0dYQTU1elMwaVBJOURyYm1XR0xkN2tpVFQtX1BPUFluQ3BkblRRZEl5S3JtWnY4QUJadExRcFdTN2pUVzl2dF91S2dfM3haZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「炎の後の世界：私たちの間に」がゴールデンベル・ドラマ部門で最高賞を受賞", "title_en": "'The World Between Us: After the Flames' wins top Golden Bell drama prize - Focus Taiwan", "summary_ja": "台湾のドラマ「炎の後の世界：私たちの間に」がゴールデンベル賞のドラマ部門で最高賞を受賞した。本作品は火災後の社会的課題と人間関係を描いた力作として高く評価されている。この受賞は台湾テレビドラマ業界の創作力と国際的競争力を示すものとなった。", "summary_en": "'The World Between Us: After the Flames' wins top Golden Bell drama prize Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE05T1NoZFNmdl81YXM4VGNzMzlsVU9JYjcta2VuMXM0ekVzTmYweEpzR2dWYVVJaVZ1cF9TOGJyUmE1WmtzZGU1UGxVeGgwZDlvbld1cW13?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、戦闘態勢強化のため「台本なし」訓練形式を採用", "title_en": "Taiwan adopting 'unscripted' training format to boost combat readiness - Focus Taiwan", "summary_ja": "台湾は戦闘準備態勢を高めるため、予定調和的でない「台本なし」の訓練形式を導入している。この新しい訓練アプローチにより、兵士たちはより現実的で予測不可能な状況での対応能力を養うことができる。予定外の状況への対応力強化により、台湾の防衛能力の向上を目指している。", "summary_en": "Taiwan adopting 'unscripted' training format to boost combat readiness Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE40Y1VJem10c2NKdkJHYTBwNzV3dndaUHFGTGtSQjlEZGNoZGJPNzFPYUtoc3cyOG1sRGFmUGQ4clAwdFlNNUpuc08yZjRERmdOZjdMQVFnQQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「55歳の誕生日おめでとう」：国連高官が中国の国連議席に関する立場を再確認", "title_en": "'Happy 55th birthday': UN officials reaffirm stance on China's UN seat", "summary_ja": "CGTN報道によると、国連の上級職員らは日曜日が中国の国連議席の回復55周年を迎えるにあたり、国連総会決議2758に対する国連の揺るがぬ支持を再確認したと述べています。同決議は中国の合法的な国連での地位に関するものです。", "summary_en": "Senior United Nations officials have reaffirmed the world body's unwavering adherence to UN General Assembly (UNGA) Resolution 2758, as Sunday marks the 55th anniversary of the restoration of China's lawful seat at the UN.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-25/-Happy-55th-birthday-UN-officials-reaffirm-stance-on-China-s-UN-seat-1Rvwzer6yZO/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国外相、コンゴ共和国外相と会談", "title_en": "China's top diplomat holds talks with FM of Republic of the Congo", "summary_ja": "中国国営メディアCGTNが報じたところによると、王毅外相は木曜日に北京でコンゴ共和国のコンスタン・セルジュ・ボウンダ外相兼ラ・フランコフォニー相兼コンゴ系外国人担当相と会談した。同報道は、両国間の外交的な対話の展開を伝えている。", "summary_en": "Chinese Foreign Minister Wang Yi held talks with Constant-Serge Bounda, minister of foreign affairs, La Francophonie and Congolese Abroad of the Republic of the Congo, on Thursday in Beijing.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-23/China-s-top-diplomat-holds-talks-with-FM-of-Republic-of-the-Congo-1RsYwWUbR16/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国医療チームがシエラレオネで無料の中医学ケアを提供", "title_en": "Chinese medical team brings free TCM care to Sierra Leone", "summary_ja": "CGTNは、シエラレオネに派遣された第27次中国医療チームが、首都地域で一連の無料コミュニティ保健クリニックを開催したと報じている。同チームは、地元住民に対して専門的な疼痛管理、一般医療、医学研修を提供しているという。", "summary_en": "The 27th Chinese medical team to Sierra Leone has conducted a series of free community health clinics across the capital region this month, delivering specialized pain management, general care and medical training to local residents.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-24/Chinese-medical-team-brings-free-TCM-care-to-Sierra-Leone-1RuShm7bbOw/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フラビオ・ボルソナロ氏が家族とともに米国に到着—CNN Brasil報道", "title_en": "Flavio Bolsonaro arrives in US with family — CNN Brasil", "summary_ja": "CNN Brasilは、ブラジルの政治家フラビオ・ボルソナロ氏が家族とともに米国に到着したと報道している。RTASは、同氏が明確な裁判所命令に反して国を離れたと伝えている。", "summary_en": "The politician left the country in defiance of an explicit court order", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2209173", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ペスコフ報道官、アリョーシキ周辺を超える停戦地帯について説明", "title_en": "Peskov clarifies ceasefire zone extending beyond Alyoshki", "summary_ja": "ロシア大統領報道官ドミトリー・ペスコフ氏は、同都市周辺の停戦協定は当初から合意されていたと述べたとTASS/RTが報じています。ペスコフ氏によると、停戦地帯はアリョーシキを超えて拡大する範囲をカバーしているとのことです。", "summary_en": "Russian Presidential Spokesman Dmitry Peskov noted that the ceasefire arrangement around the city was agreed upon from the outset", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2209169", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアと赤道ギニア、相互供給拡大の可能性が大きい＝プーチン大統領", "title_en": "Russia, Equatorial Guinea have significant potential to boost mutual supplies — Putin", "summary_ja": "TASの報道によると、プーチン大統領はロシアと赤道ギニアが相互供給を拡大するための重大な可能性を持っていると指摘しました。同大統領はまた、両国間の文化・人道協力において肯定的な成果が達成されていると述べています。", "summary_en": "The Russian President also pointed out that positive results have been achieved in bilateral cultural and humanitarian cooperation", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2209167", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ブラジルの反権威主義的対抗戦略の章", "title_en": "Brazil’s Chapter in the Anti-Authoritarian Playbook", "summary_ja": "ルーラ大統領がブラジル大統領選で歴史的な再選を果たしたことは、民主主義に対する国民の信頼を示している。著者は、このような民主的成果を維持するためには、制度的・構造的改革と左派を超えた連立構築が不可欠であると主張している。ハンガリーとセルビアの事例から得られた教訓が、ブラジルの民主主義強化に有用な指針を提供するとしている。", "summary_en": "Brazil’s renewed democratic confidence must now be matched by institutional and structural reforms and a willingness to build coalitions beyond the left. Recent democratic outcomes in Hungary and Serbia offer useful lessons.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/brazil-lula-victory-anti-authoritarian-playbook-by-robert-muggah-and-ilona-szabo-de-carvalho-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Brazil’s Chapter in the Anti-Authoritarian Playbook\nand\nBrazil’s renewed democratic confidence must now be matched by institutional and structural reforms and a willingness to build coalitions beyond the left. Recent democratic outcomes in Hungary and Serbia offer useful lessons.\nSÃO PAOLO—Until President Luiz Inácio Lula da Silva staged a remarkable comeback to win re-election, no Brazilian presidential candidate had overturned a first-round defeat in a runoff. Lula did so with nearly 52% of the vote, against Flávio Bolsonaro’s 48%. More than 128 million Brazilians turned out—nearly three million more than in the first round.", "translation_ja": "", "vocab": []}, {"title_ja": "ブラジル経済の再び墜落するのか？", "title_en": "Another Crash Landing for Brazil’s Economy?", "summary_ja": "ブラジルは変動相場制、豊富な外貨準備、強い商品輸出、自国通貨建ての債務により国際収支危機のリスクは低い。しかし、ルーラ大統領の再選に伴う財政悪化の継続は国内経済に大きな負担をもたらす可能性がある。歴史的に例外的な天然資源を持ちながらも短期的な成長後に停滞するというブラジルの繰り返されたパターンが、再び失望をもたらす懸念がある。", "summary_en": "Brazil’s floating exchange rate, high foreign-exchange reserves, strong commodity exports, and debt denominated predominantly in its own currency reduce its exposure to a balance-of-payments crisis. Nonetheless, continued fiscal deterioration under President Luiz Inácio Lula da Silva will carry high", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/brazil-fiscal-deterioration-under-lula-will-carry-high-domestic-costs-by-gene-frieda-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Another Crash Landing for Brazil’s Economy?\nBrazil’s floating exchange rate, high foreign-exchange reserves, strong commodity exports, and debt denominated predominantly in its own currency reduce its exposure to a balance-of-payments crisis. Nonetheless, continued fiscal deterioration under President Luiz Inácio Lula da Silva will carry high domestic costs.\nLONDON—Brazil has an unfortunate habit of disappointing. Despite the country’s exceptional natural-resource endowment, its growth trajectory resembles what Brazilians call the flight of a chicken (voo de galinha): a brief flutter followed by an inevitable fall back down to Earth. President Luiz Inácio Lula da Silva’s surprise re-election raises the risk of another letdown.", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパの正念場が到来", "title_en": "Europe’s Make-or-Break Moment Has Arrived", "summary_ja": "米国のトランプ大統領がウクライナと欧州の同盟国を見捨て、ロシアのプーチン大統領に傾斜している。ヨーロッパが主権を守るためには、外部からの圧力に対して団結を保つ必要があり、同時に国内の政治的脅威に対処する必要がある。著者は、ウクライナの5年間の抵抗と、かつての西側の団結の重要性を強調しており、ヨーロッパが政治的結束を維持することが重要であると主張している。", "summary_en": "US President Donald Trump has not only abandoned Ukraine and America’s European allies, but has increasingly sided with Russian President Vladimir Putin. To preserve their sovereignty, Europeans must remain united in the face of outside pressure, which in turn requires managing political threats fro", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/europe-make-or-break-submission-or-independence-by-joschka-fischer-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Europe’s Make-or-Break Moment Has Arrived\nUS President Donald Trump has not only abandoned Ukraine and America’s European allies, but has increasingly sided with Russian President Vladimir Putin. To preserve their sovereignty, Europeans must remain united in the face of outside pressure, which in turn requires managing political threats from within their borders.\nBERLIN—On February 24, 2027, it will have been five years since Russia launched its full-scale invasion of Ukraine, in flagrant violation of international law. Russian President Vladimir Putin’s neo-imperialist adventure—his “special military operation”—was supposed to be a brief and decisive war of conquest. But it soon became apparent that he had underestimated his victim. The Ukrainians have been determined to defend themselves, whatever it takes, and for a while, they could count on a united West, with the United States and Europe standing together in providing military and civilian support.", "translation_ja": "", "vocab": []}, {"title_ja": "ガーディアン紙の見方：ブリュッセルに対する極右の計画—習近平、プーチン、トランプの仕事を行う", "title_en": "The Guardian view on the far right’s plans for Brussels: doing the work of Xi, Putin and Trump | Editorial", "summary_ja": "フランスとドイツの主要な極右政党指導者らは、EU機関の権限と予算を大幅に削減し、加盟国の自主性を強化する『国民のヨーロッパ』構想を掲示している。2029年までに複数国で極右勢力が政権を握る可能性があり、欧州プロジェクト全体を弱体化させるリスクが高まっている。EU統合に対抗できず応答が鈍い親欧州勢力に対し、著者は気候危機や経済競争への対応に必要な連帯の強化を訴えている。", "summary_en": "If ever enacted, proposals by Marine Le Pen and the AfD leader, Alice Weidel, to hollow out EU institutions would be a continental act of self-harm Following the Brexit referendum in 2016, Marine Le Pen was in a predictably celebratory mood. Britain’s vote to leave the European Union, she told one i", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/27/the-guardian-view-on-the-far-rights-plans-for-brussels-doing-the-work-of-xi-putin-and-trump", "state_media": false, "category": "オピニオン", "full_text": "Following the Brexit referendum in 2016, Marine Le Pen was in a predictably celebratory mood. Britain’s vote to leave the European Union, she told one interviewer, was the first breach in the “Brussels Wall”. Ms Le Pen’s Front National party was at that point committed to taking France down the same path, given the chance. But as the UK’s self-inflicted economic wounds became a cautionary tale for the rest of Europe, the notion of Frexit was put on ice.\nInstead, Ms Le Pen now hopes to lead far-right allies in hollowing out the EU from within. This month, both she and the leader of Alternative für Deutschland, Alice Weidel, outlined their visions of a “Europe of nations” in which EU institutions would be stripped of both cash and power. Ms Weidel’s “new deal for Europe” would abolish elections to the European parliament, and seek German opt-outs in areas such as migration, defence and common borrowing. Ms Le Pen’s party, now called National Rally, proposes slashing French contributions to the EU budget by 60% over a five-year presidential term, and ending the role of Brussels in proposing common policies for the 27 member states.\nSimilar ideas have long circulated in far-right thinktanks. But they are now in the programmes of parties that lead the polls in France and Germany – Europe’s historic engines of integration. Ms Weidel has targeted 2029, when the next German election is due to take place, as the year in which a critical mass of anti-EU leaders can begin to effectively unravel the European project. By then, Eurosceptic ultra-nationalist parties could conceivably be in power in France, Italy and Poland.\nFaced with plotting in plain sight and a putative timetable for action, the response of pro-European forces has been distinctly underwhelming. From the economy to the climate emergency and security, Europe faces challenges that can only be properly addressed through the greater pooling of resources, allowing it to punch its continental weight. Mario Draghi, the former head of the European Central Bank, has warned that without an industrial policy to compete with China and the US, the continent faces an existential struggle. But other than the beleaguered and soon-to-be-departed French president Emmanuel Macron, it has been hard to find any EU leader speaking with the same sense of urgency.\nMs Le Pen and Ms Weidel’s interventions should be treated as a wake-up call. The kind of Europe they envisage would be less than the sum of its parts, distracted and weakened by competing national interests. In relation to defence, the moves towards European strategic autonomy would be undermined. The green transition, in the absence of collectively agreed goals, would stall. Adopting such a direction of travel would be an act of continental self-harm, opening up vulnerabilities that Xi Jinping and Vladimir Putin (and any Maga successor to Donald Trump) would eagerly exploit.\nAs a pivotal period in the history of the EU approaches, the time to start making such counter-arguments is now. The case for a strong Europe at a time of geopolitical volatility and anxiety is overwhelming. But it will need vigorous advocates as a battle for hearts and minds looms. For the time being, to paraphrase WB Yeats, the pro-Europeans appear to lack all conviction, while their opponents are full of passionate intensity.\n- Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": []}, {"title_ja": "エプスタイン・ファイルは米国中間選挙への必殺技である", "title_en": "The Epstein files are a sledgehammer for the US midterms | Katie Phang", "summary_ja": "著者は、エプスタイン・ファイルの公開が米国政治における権力者への説明責任を求める有権者の最優先事項であると主張している。88%の投票予定者が権力者の説明責任を重視しており、エプスタイン・ファイルは児童への性的搾取と政府腐敗を象徴する重要な問題だという。トランプ前大統領は当選前にファイルの機密解除を約束したにもかかわらず、大統領就任後はその公開を阻止し、民主党のデマと宣言したと著者は批判している。", "summary_en": "Voters have a chance to break America’s two-tiered system of justice and hold powerful people accountable Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Guardian US columnist Rebecca Solnit wrote about the G", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/26/epstein-files-midterms-sledgehammer", "state_media": false, "category": "オピニオン", "full_text": "Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Guardian US columnist Rebecca Solnit wrote about the GOP’s alignment with the tech overlords. Today’s edition was written by Katie Phang, an independent journalist, trial lawyer and political analyst. Sign up for future editions here.\nWhen Americans go to the polls a week from now, accountability will be front and center.\nThe Jeffrey Epstein files are emblematic of a corrupt system. And the fish rots from the head down. Beyond the grifter-in-chief and his spawn are billionaires profiting from pay-to-play relationships and predatory corporations rewarded for choosing profits over people, machines over humanity.\nAs many as 88% of Americans who plan to vote in the midterms prioritize candidates who have promised to hold powerful people to account, including by releasing the full Epstein files, according to a September GBAO poll, which also found that what the files represent – sexual exploitation of children; government corruption; abuse of power and powerful people escaping accountability – was a bigger concern than many of the everyday issues the pollsters tested. The finding echoed a poll from Reuters/Ipsos earlier this summer which found 69% of Americans believe the Epstein files show that “powerful people in the U.S. are rarely held accountable for their actions”.\nBefore he was elected president, Donald Trump sat down with Fox News’s Rachel Campos-Duffy, who, during yet another softball interview typical of that network, posed the following question: “Would you declassify the Epstein files?” Trump answered: “Yeah, yeah I would.”\nKash Patel, Dan Bongino, JD Vance and the president’s son, Donald Jr, all sang in the chorus that demanded the files be released. But as soon as Trump became president, and Patel took over at the FBI, the tune changed dramatically. Now that Trump was in a position to actually do something about it, suddenly there was nothing to see. The FBI, under the direction of Patel and joined by Pam Bondi, the then US attorney general, even released a memo stating there was no client list, no evidence to pursue investigations against third parties and that “no further disclosure would be appropriate or warranted.”\nTrump went on to declare the Epstein files a “Democrat Hoax” and tried his damnedest to distract the public from demanding justice. As is well known, Congress eventually passed the Epstein Files Transparency Act (EFTA), requiring the attorney general to release the files with very limited grounds for redactions and withholdings.\nWe all saw the botched rollout of the 3.5m pages of materials and how egregiously it reviolated Epstein survivors by releasing confidential personal information. The EFTA was supposed to protect those survivors, but Trump’s Department of Justice blacked out the names of those with money, means and influence but exposed victims and survivors. If you think that was an accident, I’ve got some swampland in Florida to sell you.\nThen in January of this year, Todd Blanche, then the deputy attorney general, declared that Trump’s Department of Justice was done. Just done. In my long career as a trial lawyer and journalist, I’ve been reading documents for what they say and what they leave out, and have personally reviewed tens of thousands of the released Epstein files. I never thought I would see our Department of Justice conceal the crimes of a small, moneyed elite.\nSo, I sued for the transparency the law required. On 27 April, I filed Katie Phang v Attorney General Todd Blanche in federal court in Washington DC, arguing that Blanche violated the Administrative Procedure Act when he illegally redacted and withheld documents pursuant to the EFTA. Blanche’s illegal conduct was making it impossible for journalists to do their jobs; to bring the truth and transparency that the American people demanded and deserved.\nOn 25 June, the presiding judge in my case, Emmet Sullivan, found that Blanche had failed to respond substantively to my arguments and that therefore “the Attorney General has conceded that he is in violation” of EFTA. Judge Sullivan also ordered Trump’s justice department to begin producing specific unredacted documents. Since then, Blanche has violated court orders, refused to comply with the law and rules of procedure, blown deadlines and made cheap, insincere excuses. Instead of enforcing the law, the attorney general of the United States has been busy subverting it.\n Instead of enforcing the law, the attorney general of the United States has been busy subverting it\nHere’s the thing, though: voters have noticed. They’re angry and candidates are seizing the day. More than 160 unique Epstein-related campaign ads worth more than $35m in airtime have aired leading up to the midterms. In Ohio, Sherrod Brown has been hammering the incumbent Republican senator Jon Husted over his acceptance of donations from the billionaire ", "translation_ja": "", "vocab": []}, {"title_ja": "米国でまだ投票登録していない人へ：あなたもまだ投票できる可能性があります", "title_en": "Not registered to vote yet in the US? There’s a good chance you can still cast a ballot | Laura W Brill", "summary_ja": "著者のローラ・ブリル氏は、政治キャンペーンが投票登録済みの有権者に多くの資金を費やしている一方で、登録していない数百万人の若い米国人を無視していると指摘しています。カリフォルニア州だけで約30万人の18歳の有権者と100万人以上の18～24歳の未登録若年層が、投票日や期間中投票を通じて投票する法的権利を持っています。著者は、政治陣営が説得力のあるこれらの若年層に焦点を当て、民主主義への参入経路を構築することに投資すべきだと主張しています。", "summary_en": "Twenty-two states and Washington DC let voters register on election day. Why aren’t politicians doing more to reach young people? With election day just a week away, candidates are ignoring millions of young Americans who could still cast a decisive ballot but have not yet registered to vote. By con", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/27/register-vote-midterm-election-day", "state_media": false, "category": "オピニオン", "full_text": "With election day just a week away, candidates are ignoring millions of young Americans who could still cast a decisive ballot but have not yet registered to vote.\nBy contrast, my mailbox has been full of political flyers: the various campaigns gleaned my name from the voter file, recognized that I am a regular voter who hadn’t cast a ballot yet, and assessed through their targeted analysis that it’s worth spending on printing and postage to get their message to me.\nHonestly, they are wasting their money on me – I have voted now and would have done so anyway, with or without their glossy mailers. What they should be doing is targeting people who are probably way more persuadable than I am, yet are routinely ignored: the millions of Americans who will be old enough to vote for the first time this November.\nIn California alone, for example, there are nearly 300,000 eligible 18-year-olds who can legally show up through election day and cast a provisional ballot. Their votes would count the same as mine. So why are their mailboxes empty?\nIt’s not just the 18-year-olds. We estimate that more than 1 million young Californians ages 18-24 who have not yet registered and are therefore not in the voter file still have a right to vote on election day or during early voting. And it’s not just California. More than half of US states allow eligible voters to cast provisional ballots either on election day, during some part or all of their early voting period, or both.\nWe estimate that 1.7 million 18-year-olds live in the 22 states (plus Washington DC) that allow voters to register on election day. Voter files show that almost half of them have not yet registered, so are probably not receiving mail from campaigns.\nAcross the country, only 45% of 18-year-old Americans are registered to vote, compared with 82% of the over-45s. It’s not apathy or laziness that stops them – it’s more often that no one bothered to ask them or explained how to do it and why it matters – including the candidates.\nThat’s despite the more than $10bn already spent in this campaign. Imagine if just 0.01% of that were spent building the on-ramp to democracy instead of on throw-away mailers and tune-out ads.\nFour other states allow provisional voting during all or part of their early voting period for those who aren’t yet registered, but don’t allow it on election day itself: Massachusetts, Nebraska, New York, North Carolina.\nYou might wonder: does election day registration really matter for first timers? The answer is – absolutely. We looked at the voter files for a sample of four states with same-day registration on election day and they all see far more 18-year-olds making it into the voter file on that final day versus any other day of the year.\nAnd this really should not be a surprise, but turnout correlates positively with allowing voting for eligible voters who haven’t signed up in advance.\nYoung people – because they are registered at such low rates and therefore aren’t targeted by candidates – often become aware of elections in the final weeks of campaigns, as more and more money is spent on advertising. In many states though, that is well after early registration deadlines. Plus they are highly mobile compared with other age groups, making early registration more challenging for them. The result is millions of voices left unheard, cycle after cycle.\nWe need to rebuild the systems that bring young voters in and that will take time, money and vision. But in the next few days leading to 3 November, we can all reach out to the people we know in the same-day states and encourage them to register and vote. It’s not too late for them to have their say and it’s never too early to start the habit of voting.\n- Laura W Brill is the founder and CEO of the Civics Center, a non-partisan non-profit with a mission to make voter registration a core part of high school", "translation_ja": "", "vocab": []}, {"title_ja": "プーチンの戦略が機能している", "title_en": "Putin’s Strategy Is Working", "summary_ja": "本論説は、トランプ大統領がロシアへの制裁緩和、ウクライナへの軍事・経済支援削減、情報協力の中断、ゼレンスキー大統領への圧力を通じて、ウクライナでの戦略的失敗から回復するプーチンを支援していると主張している。長年にわたってウクライナの支配を目指してきたプーチンは、2022年2月以来、ウクライナ領土の実質的な併合とキーウの将来支配をより可能にする立場にある。トランプの支持により、プーチンは前線での停滞を補うため、ウクライナ社会へのテロ攻撃と民間インフラへの爆撃キャンペーンに焦点を移すことができるようになったと論じている。", "summary_en": "Trump could salvage the Kremlin’s objectives in Ukraine.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/putins-strategy-working-michael-mcfaul", "state_media": false, "category": "オピニオン", "full_text": "Vladimir Putin plays the long game. For decades, the Russian leader has worked to subjugate Ukraine. For decades, he has also cultivated ties with Donald Trump. Now, success at the latter endeavor is allowing Putin to recover from failures at the former: after nearly five years of thwarted Russian objectives in the war on Ukraine, the U.S. president is helping him win. By easing sanctions on Russia, cutting military and economic assistance to Ukraine, disrupting intelligence cooperation, and pressuring Ukrainian President Volodymyr Zelensky to accept Putin’s war aims, Trump is making Russia’s successful annexation of substantial Ukrainian territory and de facto control over Kyiv’s future decisions more likely than at almost any point since February 2022.\nSince Putin launched his full-scale invasion of Ukraine, battlefield momentum has swung back and forth between the two sides. Russian forces had the advantage at the start. But by the fall of 2022, Ukraine had seized the offensive, liberating so much territory once held by Russian troops that Washington worried Putin might use a nuclear weapon to stop Ukrainian advances. The war then settled into a tragic grind on the frontline—until last spring. Momentum returned to Ukraine after Kyiv deployed new long-range missiles capable of striking targets deep inside Russia, new midrange drones able to attack Russian supply routes in the occupied parts of eastern Ukraine, and improved interceptor drones that could better defend against Russian attacks on Ukrainian cities. Putin’s army proved unable to advance on the frontline; Ukrainian troops even made incremental progress in liberating territory.\nBut Trump has helped return the momentum to Russia. Stymied at the frontline, Putin has shifted his focus to terrorizing Ukrainian society through rocket and drone strikes on both civilians and the infrastructure their livelihood depends on—energy and water in particular—driven by the hope that a suffering population would pressure Zelensky to capitulate. New weaponry has made this terrorist campaign especially brutal, in particular the mass production of ballistic missiles and a new drone, the Geran 5, equipped with a powerful Chinese rocket engine that Ukrainian air defenses cannot intercept. Because Russia has more troops, greater military production capacity, and some new and better weapons, Putin believes that he can afford to persist despite the seeming stalemate.\nTrump’s support has bolstered Putin’s belief that time is on his side. In just the last few weeks, Trump and his allies have expanded his help to Moscow: suspending sanctions, buying Russian diesel, disrupting Ukraine’s access to Starlink and Starshield communications systems, and even insisting that Zelensky must go. “It is equally clear that when some partners ease the pressure on Russia,” Zelensky has noted, “it only reinforces Putin’s belief that his goals are within reach.” The combination of less support from the United States, especially when it comes to air defenses, and faster Russian drones and more missiles will make the coming winter the most brutal yet for Ukrainians.\nOUR MAN IN WASHINGTON\nPutin’s long game with Trump began years ago, driven not so much by some specific objective, but by the hope that Kremlin influence on him might someday prove useful—a common KGB tactic. Now that day has come.\nYears before Trump first ran for president, Russian actors close to Putin pursued business ties with the then real estate mogul, including most famously when Trump collaborated with Emin and Aras Agalarov to host the Miss Universe pageant in Moscow in 2013. Putin then orchestrated unprecedented foreign interference in the 2016 presidential election to help Trump and hurt his opponent Hillary Clinton. Whether the Russian theft and publication of Clinton campaign emails, combined with a comprehensive social media effort to bolster Trump, affected the 2016 election outcome is impossible to prove. That Putin was trying to influence the result is without question.\nIn 2017, Putin’s cultivation of Trump started to deliver some atmospheric benefits. Trump made clear his admiration for the Russian dictator. More shockingly, during his summit with Putin in Helsinki in 2018, Trump expressed doubt about the findings of his intelligence community regarding Russian interference in the 2016 presidential election and instead endorsed Putin’s denial. Yet in his first term, Trump’s rhetorical adulation of Putin only marginally changed actual U.S. policy toward Russia, in part because several senior officials on Trump’s national security team—National Security Adviser H. R. McMaster, Secretary of Defense James Mattis, Secretary of State Mike Pompeo—constrained Trump from making a full pro-Russia pivot.\nAfter Trump’s reelection, in 2024, the Kremlin’s long courtship started to produce more tangible results. Most consequentially, Trump ended direct U.S. military and economic assistance to Ukraine. Before then, the United St", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフが作ったイスラエル", "title_en": "The Israel Netanyahu Made", "summary_ja": "イスラエルの長期首相ベンヤミン・ネタニヤフは、たとえ権力を失っても、国の安全保障政策に深刻な遺産を残すだろう。彼はパレスチナ国家建設の考えを主流から排除し、イラン戦争を広く受け入れさせることに成功した。ネタニヤフの政治的影響力は彼の在任期間を超えて、イスラエル国民の安全保障に対する考え方の基本的な枠組みを変えてしまった。", "summary_en": "Why Bibi’s national security vision will endure.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/israel/israel-netanyahu-made", "state_media": false, "category": "オピニオン", "full_text": "Israeli Prime Minister Benjamin Netanyahu has dominated his country’s politics for the last four decades, and his influence will not end even if Israelis vote him out of office. Over the course of his tenure as Israel’s longest-serving prime minister, Netanyahu has dramatically reset the terms of the country’s national security politics. His persistent rejection of Palestinian statehood has helped push the idea firmly out of mainstream debates, and his longtime agitation for war against Iran is now widely accepted policy across Israel’s political and security establishment.\nBefore his first term as prime minister, Netanyahu was already a divisive figure. In 1993, as the leader of the opposition, he likened Prime Minister Yitzhak Rabin’s Oslo agreement with Palestine Liberation Organization leader Yasir Arafat to British Prime Minister Neville Chamberlain’s appeasement of Hitler ahead of World War II. His inflammatory rhetoric emboldened Israelis who considered any territorial compromise with the Palestinians to be treasonous, including the assassin who killed Rabin in 1995. Today, extreme policies and positions have become normalized under Netanyahu’s watch. He has presided over a three-year campaign of mass destruction and displacement in Gaza and the killing of more than 70,000 Palestinians. His government includes one politician, National Security Minister Itamar Ben-Gvir, who was barred from serving in the army in his youth because of his involvement in terrorist groups, and another, Finance Minister Bezalel Smotrich, who has said Israel needs “to wipe out Gaza” and that it should repeat what it “did in Gaza” in the West Bank. Defense Minister Israel Katz has made similar calls for applying the “Gaza model” to the West Bank and even southern Lebanon.\nNetanyahu might soon lose power. His attacks on Israel’s judiciary, corruption trials, and refusal to take responsibility for security lapses ahead of Hamas’s terror attack on Israel on October 7, 2023, have generated significant opposition among Israelis. A change of leadership could have profound consequences for domestic policy. But whether Netanyahu leaves politics this week or years down the road, his national security vision will outlast him. He has had catastrophic success in crushing domestic support for Palestinian national aspirations and gaining mainstream backing for a permanent war footing to confront Iran. Netanyahu has changed the baseline of how Israelis think about their country’s security and turned his own uncompromising positions into an institutionalized reality. Future leaders may bring their own styles to Israeli security policy, but for the foreseeable future, at least, they will be coloring within lines that Netanyahu has drawn for them.\nTWO-STATE ILLUSION\nNetanyahu is not the first Israeli prime minister to reject Palestinian national aspirations. In a 1969 interview, Golda Meir famously asserted that there was “no such thing” as a distinct Palestinian nation. Menachem Begin embraced the 1978 Camp David accords with Egypt only because the agreement did not require him to come to terms with the Palestinians. Yitzhak Shamir refused to allow independent Palestinian representation at the 1991 Madrid Peace Conference.\nThe difference today is that the idea of Palestinian statehood is not even up for debate. This change did not happen overnight. Rabin’s assassination led to the dismantling of the Oslo model, which intended to produce a Palestinian state but in practice produced limited Palestinian self-government and continued Israeli control over much of the West Bank. Attacks by Palestinian terrorist groups throughout the 1990s deepened Israelis’ skepticism about the prospects of peace, which helped to bring Netanyahu to power in 1996.\nStill, when Netanyahu’s first term ended in 1999, some politicians sought to keep the possibility of a political settlement alive. Israelis elected leaders such as Ehud Barak and Ehud Olmert who were open to territorial concessions to the Palestinians and who engaged in serious, albeit unsuccessful, U.S.-backed peace negotiations. Barak also spearheaded a unilateral Israeli withdrawal from southern Lebanon in May 2000. Even the hawkish Ariel Sharon, whose controversial visit to the Temple Mount in Jerusalem later that year helped spark the second Palestinian intifada, evacuated around 9,000 Israeli settlers and initiated the withdrawal of ground forces from Gaza in 2005.\nBut in the absence of a negotiated solution, the conflict worsened on all fronts. Hamas won the 2006 elections in Gaza and took full control of the territory by 2007. Military conflict between Israel and Hamas became routine, with major wars erupting in 2008, 2012, 2014, and 2021. Netanyahu became prime minister again after the first of those wars, in 2009. As Israel contended with frequent rocket fire from Gaza and missile attacks by the Lebanon-based Hezbollah in the north, Netanyahu linked the deteriorating security conditions to Israe", "translation_ja": "", "vocab": []}, {"title_ja": "The New Energy Stalemate in Ukraine", "title_en": "The New Energy Stalemate in Ukraine", "summary_ja": "Tatiana Mitrova, a fellow at Columbia University’s Center on Global Energy Policy and former energy scholar at Moscow’s Russian Academy of Sciences, and Sergey Vakulenko, an oil and gas expert at Carnegie’s Russia Eurasia Center, argue that Russia and Ukraine are locked in an energy war that has bec", "summary_en": "Tatiana Mitrova, a fellow at Columbia University’s Center on Global Energy Policy and former energy scholar at Moscow’s Russian Academy of Sciences, and Sergey Vakulenko, an oil and gas expert at Carnegie’s Russia Eurasia Center, argue that Russia and Ukraine are locked in an energy war that has bec", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/new-energy-stalemate-ukraine", "state_media": false, "category": "オピニオン", "full_text": "In the days since U.S. President Donald Trump’s highly public falling out with Ukraine and growing rapprochement with Russia, Kyiv’s prospects going into the fifth winter of war look grim. The Trump administration has demanded that Ukraine suspend its attacks on Russian refineries, which have been one of Ukraine’s most effective means of putting pressure on Moscow. Meanwhile, Kyiv faces dangerous gaps in its air defenses against Russia’s jet-powered drones and stepped-up use of ballistic missiles. And Trump has entered into a deal with Russian President Vladimir Putin that temporarily waives U.S. sanctions on Russian diesel exports, offering Moscow a diplomatic win. Trump’s envoys have also proposed that Europe increase purchases of Russian gas as part of an effort to gain the Kremlin’s support for peace—further complicating the efforts of Ukraine and its remaining allies to squeeze Russia.\nYet missing from this bleak picture are the ways that Ukraine has already adapted to escalating attacks. Kyiv has developed innovative strategies to mitigate the impact of Russian energy strikes and keep its grid running, even amid intense bombardment. And despite the new U.S. pressure, Ukraine has continued to launch powerful drone strikes against Russia’s energy infrastructure, including successful mid-October attacks on an oil terminal in St. Petersburg and industrial gas processing plants as far away as Surgut and the Novy Urengoy, 1,800 miles from the Ukrainian border. Overall, since mid-2025, Ukrainian drone strikes have reduced Russian refinery throughput by roughly 30 percent; they have also eroded a significant share of Moscow’s excess refining capacity, resulting in a gasoline shortfall of about ten percent.\nStill, this is only one part of a rapidly evolving energy war. Moscow has developed its own ways to limit the effects of Ukrainian strikes. And it has intensified its assault on Ukrainian infrastructure, including an October 19 barrage that damaged more than ten energy facilities. DiXi Group, a Ukrainian think tank, has estimated that Russia launched 12,800 missiles and drones at Ukrainian energy facilities in 2025 and early 2026, compared with just 2,800 during the first three years of the war combined. Although these figures count launches rather than successful strikes, they show how massive and relentless the Russian campaign has become.\nMoreover, both sides are now able to target the substitutes and reserves that in the past could be used to cushion losses. Following Russian strikes on local power plants in early October, Ukrainians experienced widespread blackouts, even though Ukraine’s national grid had electricity to spare, because Russia continued hitting the lines and substations carrying the reserve power. During the summer, Ukraine hit so many of the refineries and pipelines around Moscow that Russia was forced to bring fuel by rail from as far as Lake Baikal, thousands of miles away.\nIf U.S. pressure and negotiations cannot stop the energy war, the central question for Ukraine is whether its remarkable capacity to adapt can keep pace with Russian attacks. At the same time, its fortunes this winter will depend on whether it can continue to hit Russian infrastructure in ways that challenge Moscow’s ability to repair and rebuild. Both Russia and Ukraine must now protect and repair their entire national networks around the clock; attackers can concentrate on the most vulnerable sites and strike again as soon as repairs are done. In such a war, defensive ingenuity matters as much as offensive capability. In the end, energy attacks alone are unlikely to force either side to accept the other’s terms, neither side may be able to gain a decisive advantage, even as both incur mounting costs. Recognizing the limits, as well as the power, of these strikes may be crucial not only to ending the present conflict but also to understanding the role that energy infrastructure will likely play in future wars.\nTHE RACE AGAINST ROCKETS\nFor Ukraine, international support has been especially crucial in containing Russia’s energy barrage. As of November 2025, before the worst of last winter’s attacks, Ukraine had suffered $17.1 billion in direct damage to its electricity infrastructure, according to a report by the UN, the World Bank, and the European Commission. Yet Kyiv was able to keep the electricity flowing by drawing on the country’s remaining nuclear plants; repairing thermal generation facilities; increasing electricity, gas, and diesel imports; and compensating for lost power plants with distributed generation—smaller units running on solar, wind, gas, and diesel energy that are connected to the main grid.\nEurope has also provided crucial replacement technology. In 2025, the European Commission delivered equipment from a retired Lithuanian thermal power plant to Ukraine in 149 shipments, enabling Ukraine to provide power to one million people. Such transfers have turned foreign utilities and suppliers into pa", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-28 00:07 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
