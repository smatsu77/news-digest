ters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxPTnhLb1ZGYUdnbENkWmMyZDZqTHlsckJwbEsxWVZGTnI5U2lPcFNXLXFoYmRRZm1rU2NWREZrWGVRblRES2FmdkwtUVIzMDlTS2N4ZW5vNno1Y2JCR1FzclhmdUVBOU5jMElCd2FwTlN1VzdfOU94YXlFc2VSWmRObXZyMVhyNnlf?oc=5", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ノルウェーとフィンランドの首脳がプーチン大統領と電話会談を実施", "title_en": "Norway and Finland leaders hold rare call with Putin", "summary_ja": "フィンランドのスタッブ大統領とノルウェーのストーレ首相は、ロシアのプーチン大統領と共同で電話会談を行いました。両首脳は、ウクライナ紛争の終結に向けた平和交渉について直接メッセージを伝えることを目的としていましたが、紛争解決への大きな進展はみられませんでした。この対話はウクライナとアメリカとの事前協議に基づいており、両首脳はその後ゼレンスキー大統領に会談内容を報告しました。", "summary_en": "An end to the conflict in Ukraine \"will not be achieved through silence,\" Finland's President Alexander Stubb said.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6vgj813mlelo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Norway and Finland leaders hold rare call with Putin\n- Published\nThe leaders of Finland and Norway have held a joint call with Vladimir Putin - rare contact between the Russian president and European leaders.\nFinland's President Alexander Stubb and Norwegian Prime Minister Jonas Gahr Støre said the aim of the call had been to \"convey messages directly regarding future negotiations\" towards peace. An end to the conflict in Ukraine \"will not be achieved through silence,\" Stubb said.\nNeither side suggested the needle had been moved on ending the war, which began when Russia launched its full-scale invasion of Ukraine in 2022.\nAlthough the Finnish leader said the conversation with Putin had been \"frank and substantive,\" Støre added that there were \"big differences in views\" with Putin.\nSeveral European leaders have recently shown willingness to engage with Russia directly, but both Stubb and Støre pointed out their initiative was taken in their capacity as neighbours of Russia, rather than on behalf of Europe as a whole.\n\"We've not set out to speak on behalf of anyone other than ourselves,\" Støre said.\nStubb added the call had been prepared in consultation with Ukraine and the US following a meeting between Ukrainian President Volodymyr Zelensky, the Nordic leaders and US special envoy Steve Witkoff in Oslo last week.\nThe first trilateral US-Ukraine-Russia talks since the start of the year are tentatively planned for early November in Abu Dhabi.\nZelensky later confirmed Stubb and Støre debriefed him after the call and said he was grateful for their \"active support\", while his Foreign Minister Andrii Sybiha said the call had been \"the right approach\".\nFinland and Norway, which border Russia, initiated the 90-minute call - held from Helsinki - to \"discuss Russia's war of aggression against Ukraine and the diplomatic efforts to end the war and promote peace and stability in Europe\", the leaders' offices said.\nStøre added: \"The war comes with enormous human and material costs... The suffering and destruction will impact generations.\"\nThe Kremlin said Putin told the leaders that \"a just and lasting peace\" would only be possible if Russia's interests were considered.\nPutin also reaffirmed to the Nordic leaders what he views as the \"root causes\" of the conflict - his frequent shorthand for Ukraine's desire to exist as a sovereign state.\n\"A fair long-term peace settlement is possible only if Russia's legal interests are taken into account fully and unconditionally\", Putin said.\nAll three parties reportedly agreed to continue their direct phone communication.\nThere was no official EU reaction to the talks. The dialogue had not been coordinated with other European leaders, the Danish and Swedish prime ministers said. \"I think Europe should stick together rather than going solo,\" commented Sweden's Ulf Kristersson.\nMeanwhile, Polish Prime Minister Donald Tusk said Stubb had informed him that Europe's position on the upcoming talks in the United Arab Emirates was \"moderately optimistic\".\nRelations between the US and Ukraine and its European allies have soured since US President Donald Trump agreed to lift some sanctions from Russia, allowing Moscow to export oil to the America.\nAs the Trump administration's position on Russia has softened, several European leaders have said Europe should be trying to re-establish direct contacts with the Kremlin.\nStubb and Støre are the first European leaders to contact Putin since French President Emmanuel Macron's conversation with him in July 2025.\nSoon after, Putin visited Alaska for a summit with Trump, and from then on Europeans were further sidelined from Ukraine peace talks. Moscow regularly mocks European leaders and accuses the EU of prolonging the war by supplying Ukraine with weapons.\nBut last weekend, Kremlin spokesman Dmitry Peskov said having a European negotiator at the peace talks table would be \"good\".\nAnd although he said Moscow did not view Finland and Norway as speaking on behalf of Europe, on Tuesday Peskov conceded that Stubb and Støre's talks with Putin had been \"very constructive and practical talks with the leaders of two key neighbouring states.\"", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ・ヘルソン地域の停戦が拡大、当局者が発表", "title_en": "Ceasefire extended across Ukraine's Kherson region, officials say", "summary_ja": "ロシア占領下のウクライナ都市オレシキへの食糧と医薬品の供給を目的とした停戦が、南部のヘルソン地域全域に拡大されました。メラニア・トランプ米大統領夫人とローマ教皇レオ14世の仲介により実現した今回の停戦では、人道支援物資の配送と11月1日の避難が予定されています。両陣営は現在のところ停戦の違反を報告していません。", "summary_en": "The truce was originally planned for the stranded residents of Oleshky, and Russia and Ukraine say no breaches have been reported.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6lye1w9p2l8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Ceasefire extended across Ukraine's Kherson region, officials say\n- Published\nA ceasefire that began with the aim of getting food and medicine to the Russian-occupied Ukrainian city of Oleshky has been extended across the wider southern region of Kherson, according to sources.\nSeveral thousand residents are trapped in the city with no access to food, water and electricity. On one side is the Dnipro river, while Russian forces are on the other and all the roads out are too dangerous.\nHowever, no breaches of the truce that began early on Tuesday have so far been reported.\nUS First Lady Melania Trump, who helped broker the ceasefire along with Pope Leo XIV, said on Tuesday that the area involved had been expanded to provide \"safe passage\" for humanitarian convoys.\nThat was later corroborated by the press secretary to Ukraine's public ombudsman, and by Oleksandr Tolokonnikov, deputy head of Kherson, who said Russian shelling had stopped both in Kherson city, which is in Ukrainian hands, and the wider region.\nUnder the deal, the ceasefire will be followed by deliveries of humanitarian aid to Oleshky and then evacuations, planned for Friday, for anyone wishing to leave.\nAn estimated 1,700 to 2,000 people remain in Oleshky itself and a few thousand more in surrounding areas.\nMany residents have resorted to cooking garden weeds to survive, telling the BBC they are suffering extreme hunger and want to leave.\nBoth sides said the ceasefire was being observed. Kremlin spokesman Dmitry Peskov said everything was proceeding \"according to plan\", and paid tribute to US mediation and in particular representatives of Melania Trump.\nUkrainian Foreign Minister Andrii Sybiha said if the ceasefire produced results, it could \"pave the way for other steps in the peace process\".\nA key official in President Volodymyr Zelensky's parliamentary party, David Arakhamia, said it would continue until 22:59 Ukrainian time on Sunday 1 November, and described the truce as the \"largest de-escalation since 2022\".\nBefore the war Oleshky was home to 24,000 people, but it was seized by Russia during the first days of its full-scale invasion in February 2022.\nNo shops are open, and the city has had no electricity, gas or water since the Kakhovka Dam was blown up in 2023, flooding the area and killing many people in Oleshky itself.\nConditions have become so desperate that not only is getting supplies into the city extremely difficult, but escaping is too risky because the routes out of Oleshky have been mined and subject to drone attack.\nOne woman told the BBC she had stepped on a landmine and was currently in hospital where she had undergone two operations: \"I don't know how long I will have to spend there,\" she said, worried about not being able to join the evacuation.\nPope Leo appealed earlier this month to Russia's President Vladimir Putin to allow food and medical aid into Oleshky as well as a safe evacuation, and urged his Ukrainian counterpart Volodymyr Zelensky to co-operate with Moscow over a ceasefire.\nThen the White House said last week that Melania Trump had secured a ceasefire.\nOn Tuesday, the US first lady said on X that the area covered by the ceasefire \"has expanded beyond Oleshky, within the Kherson region, to provide safe passage for the humanitarian convoys\".\nThe current truce is supposed to enable roads to be cleared of mines for supplies to get into the city possibly on Thursday, and for residents to have safe passage out in an evacuation planned for Friday.\nRussia's defence ministry said units from the army's Dnepr group had been conducting \"engineering reconnaissance\" and clearing main access roads into the village of \"explosive and booby-trap devices\".\nMany details on the evacuation plans are unclear, and residents are wary of trusting officials with their names and addresses. However, a local volunteer told the BBC that about 500 people had already expressed interest by Tuesday afternoon.\nVladimir Saldo, the Russian-installed head of occupied areas of Kherson, said temporary accommodation had been prepared in the region itself as well as Russian-annexed Crimea and across the Russian border in the Rostov, Krasnodar and Stavropol regions.\nSaldo told Russian media that most Oleshky residents wanted to leave the city and stay in Russia, although his account has not been corroborated on the ground.\nIt is hard to make contact with people there as communication is patchy and many are reluctant to speak of the situation in fear of reprisals from the Russians.\nThose residents or relatives who have spoken to the BBC have expressed fears that Russia may not allow them to return to Ukraine, or might examine their phones and online activity for signs of Ukrainian support, which could put them in danger.\nUkraine's military general staff urged people not to trust unverified reports or spread rumours about \"the routes, time and place of the movement of people and humanitarian convoys\".\n- Eating garden weeds to survive in Russian-occupied ci", "translation_ja": "", "vocab": []}, {"title_ja": "中国での反発後、ムバッペが「軽率な」毛沢東発言に謝罪", "title_en": "Mbappé sorry for 'ill-judged' Mao remark after backlash in China", "summary_ja": "レアル・マドリードのキリアン・ムバッペが、フランスのトークショーで故毛沢東指導者に関する不適切なコメントを発表し、中国の複数のブランドから契約を打ち切られた。ムバッペは「軽率な発言であり、中国および世界中の中国系コミュニティの人々を傷つけたことを理解している」と謝罪した。中国では毛沢東が共産党から尊敬されているため、スペンのラリーガも公式に遺憾の意を表明し、ブランド各社も素早く契約を終了した。", "summary_en": "The France star had referred to the former Chinese leader as a \"dictator\" during an interview about memes.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cv62yg0erp8zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Mbappé sorry for 'ill-judged' Mao remark after backlash in China\n- Published\nKylian Mbappé has apologised for \"ill-judged\" comments he made about late Chinese leader Mao Zedong which led to him being dropped by several Chinese brands.\nMbappé had reportedly told French talk show The Bridge the meme \"that makes me laugh the most, it's the one where there's a video of a guy, I think it's a Chinese dictator...\" He then laughs as the clip cuts to a meme showing his face superimposed on an image resembling Mao.\nThe meme is part of a running joke about the Real Madrid forward being called a \"dictator\" because of his huge influence in football.\n\"My comment was ill-judged, and I now understand that it hurt many people in China and in Chinese communities around the world,\" Mbappé said in a statement.\n\"I apologise to everyone my words have upset.\"\nSpain's La Liga also apologised, saying it \"deeply regrets the offence that Kylian Mbappé's recent comments have caused among Chinese fans\".\nThe joke did not go down well in China, where Mao is revered by the Communist Party, despite his chaotic and often violent rule that left millions dead.\nA few people came out in support of him on Chinese social media, but that is a rare response given China's tightly controlled internet, where people are expected to toe the party and government line on sensitive topics.\nFew topics are as sensitive as Mao, which may explain why brands were so quick to terminate partnerships with a global sports star like Mbappé.\nThe original video is not available on the show's YouTube channel, and it's unclear when the interview hosted by Real Madrid's Aurélien Tchouaméni first aired. In clips that have been circulating online, Mbappé does not identify Mao by name. He says he \"uses [the meme] with friends all the time\".\nThe furore appeared to kick off on Monday night after Chinese football forum Dongqiudi drew attention to the comments in a statement, saying they were \"inappropriate\" and \"hurt the feelings of Chinese people\".\nScreengrabs of the clip and meme have since spread quickly on Chinese social media, with people echoing this sentiment and even calling for a boycott of both the French striker and his club, Real Madrid.\nBut some have blurred the meme itself as well as the part of the comment they found offensive, when Mbappe refers to \"a Chinese dictator\".\nDongqiudi said in its statement that it was \"unable to translate\" his comments because they were \"offensive to China and the Chinese people\".\nMany people are therefore also wondering what exactly Mbappe said and have responded to the angry posts and comments with questions, wanting to know more.\nWhat is the reaction in China?\nChinese fans have been criticising Mbappé – who is popular in China and has huge brand endorsements – of \"profiting from the Chinese market yet making remarks that offend the Chinese public\".\n\"International public figures, in particular, should show greater respect and sensitivity, as national sentiment must never be taken lightly,\" reads another comment on Weibo.\nAs the anger online grew louder, Chinese brands began to cut ties, although they did not explicitly refer to the video.\nThe country's largest dairy producer, Mengniu, said it \"firmly opposes and has a zero-tolerance policy towards any words or actions that hurt the feelings of the Chinese people\".\nDrinks giant Dongpeng issued a similar statement: \"Our company firmly opposes and has a zero-tolerance policy towards any behaviour that offends national sentiments.\"\nAccording to state-owned newspaper The Global Times, state broadcaster CCTV's news apps will not feature content related to the French striker. CCTV will also stop showing La Liga matches, Chinese media reported on Tuesday. Real Madrid is one of 20 clubs that play in the Spanish football league and is the most decorated team with 36 league titles.\nChina's foreign ministry has also weighed in, with spokesperson Lin Jian saying: \"We have noted the relevant reports. Words and deeds that hurt the feelings of the Chinese people will naturally be met with opposition from all sectors of Chinese society.\"\nChina is a major market for international sports stars and homegrown brands have signed multimillion-dollar endorsement contracts with Mbappé, Norwegian striker Erling Haaland, and NBA player Stephen Curry.\nBy 14:00 local time on Tuesday, five of the top 10 trending topics on Weibo centered on Mbappé, with the hashtag \"multiple brands terminate partnerships with Mbappé\" topping the list.\n\"Don't ever come to China,\" read one of the top comments on Weibo.\nWhy is Mao a sensitive topic?\nMao founded the People's Republic of China in 1949 and ruled through tumultuous decades in the 1960s and 1970s.\nHis attempt at rapid industrialisation, which he called the Great Leap Forward, led to a famine that killed tens of millions. Then came the Cultural Revolution: a violent purge of anyone seen as a threat to Communism, which included Chinese intellectuals, landowners, artists ", "translation_ja": "", "vocab": []}, {"title_ja": "最低賃金は上昇するが、18～20歳の若年労働者は大幅な引き上げを受けられない", "title_en": "Minimum wage set to rise but 18-20 year-olds will not get bigger increase", "summary_ja": "英国の最低賃金が上昇することが予算で発表される予定ですが、18～20歳の若年労働者は前年度よりも低い引き上げ率となります。労働党は政権復帰以来若年労働者の賃金を26%引き上げてきましたが、今回の引き上げ率は3.9%に留まり、年配労働者の国民生活賃金（£13.20）よりも低い水準が続くことになります。労働組合は同じ仕事に対して異なる賃金を支払うことは「極めて不公正」だと批判しています。", "summary_en": "Chancellor John Healey will reveal the new pay rates in the Budget, and has also announced measures to help households with the cost of living.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6d93gq1xdgno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Minimum wage set to rise but 18-20 year-olds will not get bigger increase\n- Published\nThe rise in the minimum wage is expected to be announced in the Budget, but 18-to-20 year-olds are set to see lower increases than in previous years, the BBC understands.\nPay for younger workers will rise in line with the increase in minimum pay for employees aged 21 years and over.\nHowever, the increase for younger workers is lower than that seen in the previous two years, when Labour raised the rate to meet a manifesto promise that it would remove \"discriminatory age bands\" with all adults entitled to the same minimum wage.\nChancellor John Healey is also announcing measures to give families what he is calling \"breathing space\" with the cost of living.\n\"The manifesto pledge on equalisation still applies but we were always clear it could happen over time,\" Business Secretary Jonathan Reynolds told the BBC:\n\"Of course, you want not just good wages but good work, \" he added. \"It is a balance of making sure the pressures on the labour market are taken into account.\"\nThe Times reported that the National Minimum Wage for 18-to-20 year-olds is likely to rise by 3.9% from £10.85 an hour to around £11.27.\nThat is a smaller rise than the 26% increase the Labour government has put in place for younger workers since returning to power in 2024.\nEven after the reported rise, the rate remains below the National Living Wage for older workers, which is currently £12.71 an hour. It is set to rise by 3.9% to £13.20, the Times said.\nAndrea Egan, general secretary of the union Unison, said it was \"deeply unfair\" to keep paying different rates for the same job.\n\"Twenty year-old care workers, teaching assistants and security guards do the same work as their older colleagues,\" she said. \"They don't pay less in the supermarket or at the petrol pump. They must be paid equally.\"\n'Not going to change the world'\nThe government has also announced a number of measures, including removing import taxes on some food and ending the so-called cliff-edge for those receiving carer's allowance payments.\nIt says removing tariffs from 100 food items could save households up to £21 per year - or 40p a week - when combined with existing tariff suspensions that were introduced in June.\n\"We're not going to say it is everything,\" Reynolds told the BBC, but taken alongside the changes implemented in the summer on goods such as pasta, fruit juice and tuna, he said it would save around £500m a year.\nOther measures the government announced on Tuesday included:\n- Making permanent a 55p per mile tax-free mileage rate for those driving up to 10,000 miles for work, with the rate rising from 25p per mile to 35p above that\n- Allowing carers to earn more than an existing earnings limit without losing their entire allowance, replacing it with a taper mechanism instead. However, this will not come in until 2030\n- Giving two weeks of paternity pay to self-employed fathers, who have previously missed out on payments of up to £194 a week for the period\n- And rolling out hundreds of additional Post Office drop boxes to make sending parcels easier\nSpeaking to the BBC's Newscast, Healey said: \"None of this is going to change the world. But if it helps around the margins and its action the government can take, then I want try and fix it.\"\nThe government will also freeze fuel duty again in the Budget, the BBC understands. The 5p duty discount is also set to continue. That discount was first introduced in 2022, and was due to last 12 months, but has been extended ever since.\n- What is the Budget and what could be in it? \n  - Published5 hours ago\nThe list of products the government is removing tariffs on includes:\n- Baked beans\n- Garlic\n- Gherkins\n- Chocolate-coated wafers and waffles\n- Boiled sweets\n- Toffees, caramels and similar sweets\n- Citrus jams, marmalades and pastes\n- Throat pastilles and cough drops\n- Plant-based drinks including soya, nut, cereal or seed\n- Kerosene\n- Fertilisers\nThe government said removing tariffs on fertiliser aimed to help farmers, while changes to import levies on kerosene is targeted at households that rely on heating oil.\nThe Treasury said it would publish on Wednesday a full list of the products that will have tariffs removed.\nA tariff is an import duty paid by domestic businesses buying products from overseas.\nAsked why the government was making it cheaper to buy goods from abroad rather than cutting business costs for UK firms, Reynolds said: \"Where you can make a reduction in the cost of importing goods into the UK, when you think you can balance that with your domestic economic interests, that's a decision we will take.\"\nBut Balwinder Dhoot, director of sustainability and growth at the Food and Drink Federation (FDF), said: \"It's more expensive to make food and drink here in the UK than in many of our close neighbours, as businesses face such high energy costs.\"\nThe Conservatives said the government's \"everyday fixes\" had already been wiped out by hig", "translation_ja": "", "vocab": []}, {"title_ja": "カリブ海訪問を開始したキング、過去の「苦しみ」を認める", "title_en": "King acknowledges 'suffering of the past' as Caribbean tour begins", "summary_ja": "チャールズ国王はバハマでのカリブ海9日間の訪問を開始し、君主として同地域を初訪問した。バッキンガム宮殿は国王が奴隷貿易の影響を含む植民地支配の遺産に触れることを明言したが、英国の役割に対する謝罪や賠償は行わないとしている。国王は若者集会で過去の「大きな苦しみと不正」を認めることが「当然」であると述べた。", "summary_en": "The King is on a nine-day tour that will take him to three countries, including the Bahamas, Guyana and Antigua and Barbuda.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmwyv8ld22z1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "King acknowledges 'suffering of the past' as Caribbean tour begins\n- Published\nKing Charles has arrived in the Bahamas for a nine-day tour of the Caribbean - the first time he has visited the region as monarch.\nThe King, wearing sunglasses and a grey suit, was given a ceremonial welcome at the airport before attending a youth rally.\nPrior to the trip, Buckingham Palace said the King would not shy away from \"colonial legacy\" and the impact of the slave trade during the visit but, in line with the UK government position, he will not apologise for Britain's role in the slave trade or offer reparations.\nAppearing at his first engagement, he told young people it is \"only right\" to \"acknowledge the great suffering and injustices of the past\".\nUpon arriving on the island, he met island's Governor General Dame Cynthia A. Pratt and its Prime Minister Philip Edward, before speaking with members of the Royal Bahamas Defence Force as he inspected a guard of honour on the runway.\nThe King was then met with cheers as he arrived for his first engagement at a youth rally at Clifford Park - where he attended the island's independence celebrations as Prince of Wales in 1973.\nDuring his speech, the King acknowledged his 50-year-long commitment to fighting climate change and highlighted the challenges faced by low-lying Caribbean islands, saying that \"our world cries out for healing\".\nHe went on to call on the young people at the rally to \"take up the sacred task to play your part\" as \"in years to come, this will be surely be the measure of every person - how they answered the call to care for planet earth - the source of our life, our prosperity and our security\".\nBuckingham Palace said opportunities for the King to reflect on the legacy of the slave trade will be built into his schedule in all three countries with visits planned to memorials and other places of reflection and remembrance.\nA spokesperson for the palace told the BBC that the King's programme on the tour \"will primarily focus on shining a light on the many modern partnerships and opportunities for the future\", specifically those which are \"having a transformative effect on the region\".\nFor the King, the spokesperson added, the \"tour is both a new journey but also the continuance of a lifelong one, in which he has sought to engage, understand and educate about the most shameful aspects of our past\".\nThose themes will be reflected by the King through the nine-day visit, the palace said.\nThe visit has been planned alongside the governments of the Bahamas, Guyana and Antigua and Barbuda with an emphasis on honouring the past but also looking forward to the ambition and possibility for future generations.\nThe King will move to Guyana later this week where his engagements will focus on the environment and biodiversity.\nHe will then visit Antigua and Barbuda, where he will be joined by Queen Camilla, for the Commonwealth Heads of Government Meeting (CHOGM) and his keynote speech as leader of the Commonwealth.\nCHOGM is a biennial summit which brings together leaders of 56 Commonwealth countries to address shared challenges and advance cooperation.\n  - Published3 days ago\n  - Published2 October", "translation_ja": "", "vocab": []}, {"title_ja": "RAF フェアフォード基地でのイラン関連疑惑事件で2人が法廷に出廷", "title_en": "Two in court over alleged Iran-linked plot at RAF Fairford", "summary_ja": "イギリスの2人の国籍保持者が、RAF フェアフォード基地でのイラン関連疑惑事件に関連してウェストミンスター治安判事裁判所に出廷した。ウェストミンスター出身の24歳のモハメド・アブドゥルカリムは外国情報機関への協力容疑で、同じくウェストミンスター出身の24歳のノウマン・エシギルは8月22日に禁止区域への立入容疑で起訴されている。9月27日には米国が運用する基地近くで不審な3台のバンが目撃され、大事件として宣言されたが、警察による爆発物の発見はなかった。", "summary_en": "Mohmed Abdulkarim and Nouman Essghir, both 24, appear at Westminster Magistrates' Court on Tuesday.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqly3v5vz4kko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Two in court over alleged Iran-linked plot at RAF Fairford\n- Published\nTwo British nationals have appeared in court in connection with an alleged Iran-linked plot at RAF Fairford last month.\nMohmed Abdulkarim, 24, from Westminster, London, has been charged with assisting a foreign intelligence service, which police earlier said they believed to be Iran.\nNouman Essghir, also 24 and from Westminster, has been charged with entering a prohibited place for a purpose prejudicial to the UK on 22 August - weeks before he was arrested near the airbase in Gloucestershire alongside four other men.\nThe pair appeared at Westminster Magistrates' Court on Tuesday.\nA major incident was declared after three suspicious vans were seen near the US-operated airbase on 27 September.\nDozens of residents were evacuated and a large cordon was put up in the area around the base. No explosive materials were found in the vans by police but a quantity of petrol was seized.\nThe court heard vans bearing the logo \"Fuel2You\" were spotted close to the base.\nIn the early hours, the vans came across a Ministry of Defence Police cordon and re-routed to another location.\nPolice arrived and arrested five men. They later revealed that one had called 999 and reported what was going on.\nDuring the hearing at Westminster Magistrates' Court, Essghir stood in the dock wearing a grey sweatshirt and confirmed his name and address.\nHis charge relates to an alleged \"reconnaissance mission\" on 22 August, around a month before the Fairford incident.\nAbdulkarim is charged with helping with the plot.\nHe appeared in court in a wheelchair wearing a checked shirt, jeans and a baseball cap. He confirmed his name and address.\nBoth men are charged under the 2023 National Security Act.\nEssghir has been remanded in custody, while Abdulkarim has been granted bail with conditions including the surrender of his passport.\nThe case will be next heard at the Old Bailey on 20 November.\nEssghir was one of five men arrested near the base on suspicion of committing offences under the Explosives Act and later on suspicion of preparation of a terrorist act. All five were released on police bail the following day, but Essghir was re-arrested on 20 October.\nA 25-year-old UK-Iranian national who was also re-arrested on that date on suspicion of assisting a foreign intelligence service has now been released without charge. He remains on police bail after his initial arrest on 1 October on suspicion of preparation of terrorist acts.\nThe re-arrests in October led to detectives interviewing Abdulkarim.\nEight men have been arrested as part of the counter-terror police investigation.\nAssistant Commissioner Laurence Taylor said the release of the five men on police bail in September had raised significant questions and speculation about the investigation for members of the public.\nHe stressed that tactics used by counter-terror police can appear \"illogical\" at times but said that \"there will always be a good reason or rationale behind them\".\n\"In this case, this decision-making has led to swifter progress, better evidence, and ultimately us securing the charges that I've announced today,\" he added.\nUS President Donald Trump at the time said he was \"surprised\" the men had been released, saying: \"We would not have released them.\"\nTaylor said counter-terror police had seen \"a range of incidents in recent months that we believe have been directed by the Iranian state\".\nIran has previously denied any involvement in the incident at RAF Fairford.\nThe base has been used as a forward operating location by the US Air Force (USAF) for decades.\nIn recent months, the US has flown B-1 and B-52 bombers from the base to the Middle East, after the UK approved a request for it to be used for defensive strikes against Iran.\nAfter the incident in September the US pulled its bombers out of the base and returned them to America.\nTrump said the aircraft were removed due to \"some threats\" to the base, without giving specific details.", "translation_ja": "", "vocab": []}, {"title_ja": "エジプト、独立系ニュースサイト「マダ・マスル」の閉鎖を命令", "title_en": "Egypt orders closure of independent news site Mada Masr", "summary_ja": "エジプトの裁判所は、編集長リナ・アッタラ氏がライセンスなしで運営していたとして、独立系ニュースサイト「マダ・マスル」の閉鎖を命じた。最高罰金の300万エジプトポンド（約5万3400ドル）が課せられ、ウェブサイトの機器没収も命じられている。2013年設立のマダ・マスルは、エジプト政府の腐敗や人権侵害を調査する数少ない独立系メディアの一つであり、当局から長年標的にされてきた。", "summary_en": "Editor-in-chief Lina Attalah was briefly detained and fined over licensing violations. Rights groups condemned the ruling as a major blow to press freedom in Egypt, where independent media face growing pressure.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/egypt-orders-closure-of-independent-news-site-mada-masr/a-79781842?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Egypt orders closure of independent news site Mada Masr\nOctober 28, 2026\nAn Egyptian court on Tuesday ordered the closure of independent news website Mada Masr after convicting its editor-in-chief, Lina Attalah, of operating without a license.\nAttalah, one of Egypt's most prominent journalists, was detained for several hours following the verdict before being released after paying a fine.\nThe court imposed a fine of 3 million Egyptian pounds (around $53,400; €48,112), the maximum penalty for the offense. It also ordered the website to shut down and its equipment to be confiscated.\nMada Masr, founded in 2013, is one of Egypt's few remaining independent news outlets. It is known for investigating corruption, human rights violations and the military's powerful role in the country.\nWhat happened during Lina Attalah's trial?\nAttalah's lawyers said the court rejected their requests to review the case file and submit additional evidence during Tuesday's hearing in Cairo.\nAccording to Hossam Bahgat, head of the Egyptian Initiative for Personal Rights (EIPR), who attended the hearing, the judge then appointed a new lawyer to represent Attalah despite objections from her eight-person defense team.\n\"In an even more shocking turn, the judge proceeded to dictate motions on behalf of this lawyer, who had not uttered a single word, and entered them into the official record,\" Bahgat told news agency AFP.\nThe judge announced the verdict amid protests from the defense before security officers detained Attalah.\nShe was released after Mada Masr paid the fine, her lawyer Hassan al-Azhari confirmed. The outlet plans to appeal the closure order.\nDuring her release procedures, Attalah also learned that she had been sentenced in absentia in a separate case in 2024 to one year in prison and a fine of 20,000 Egyptian pounds.\nThat conviction concerned charges of spreading false news and operating an unlicensed website. Her lawyers have challenged the ruling, with a new hearing scheduled for November 11.\nWhy has Egypt targeted Mada Masr?\nMada Masr has faced years of legal battles with Egyptian authorities, who have blocked access to its website inside the country since 2017.\nThe outlet says it first applied for a license in 2018 but received no response. It only learned that its application had been rejected when prosecutors raised the issue during another case in 2022.\nMada Masr challenged that decision and says its latest application has been awaiting a response since 2023.\nSix cases have been brought against the outlet and its journalists over the past six years, but Tuesday's trial was the first of its kind.\nEgyptian authorities maintain that the country respects freedom of expression but insist that media organizations must comply with the law, protect national security and counter misinformation.\nHow have press freedom groups reacted?\nThe ruling drew widespread international condemnation.\nA coalition of 119 rights organizations and media outlets, including Amnesty International, Human Rights Watch and the Committee to Protect Journalists (CPJ), described the prosecution as an \"unprecedented attack on press freedom.\"\n\"Today's decision represents a crushing blow to press freedom in Egypt and marks a dark day for independent journalism in the country,\" Amnesty International said.\nReporters Without Borders (RSF) called the ruling \"outrageous\" and \"shameful.\"\n\"If Egypt can put in custody one of its most respected editors and shut down her newsroom, no independent journalist in the country is safe,\" said CPJ regional director Sara Qudah.\nUS Senator Chris Van Hollen also criticized the prosecution, describing the charges as baseless and saying that \"journalism is not a crime.\"\nWhat is the state of press freedom in Egypt?\nThe case comes amid a broader crackdown on independent journalism.\nSix journalists from the fact-checking platform Matsadaash were arrested in September and subsequently charged with terrorism-related offenses.\nAuthorities accuse them of links to the outlawed Muslim Brotherhood and spreading false information to undermine confidence in state institutions and encourage protests.\nThe journalists have reported being tortured following their arrests, according to EIPR. Egypt's Interior Ministry has denied the allegations.\nOn Tuesday, prosecutors extended their pretrial detention by another 15 days. Rights groups warn that such detention can continue for months or even years.\nAccording to EIPR, Egypt currently holds 26 journalists in connection with their work.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "フラビオ・ボルソナロ議員、調査を逃れてブラジルから米国へ - 報道", "title_en": "Flavio Bolsonaro flees Brazil for US amid investigation  — reports", "summary_ja": "ブラジルの上院議員フラビオ・ボルソナロが、日曜日の大統領選挙での敗北後、米国へ出国したと複数のメディアが報道しています。最高裁判所はボルソナロにパスポート提出を命じていましたが、彼は命令に従わず国外脱出したとみられています。再選されたルーラ大統領は、ボルソナロが何らかの責任を逃れようとしていると述べています。", "summary_en": "Flavio Bolsonaro is on the way to the US, according to reports citing people close to the senator. The US State Department said it will issue visas to the senator and his family.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/flavio-bolsonaro-flees-brazil-for-us-amid-investigation-reports/a-79781094?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Flavio Bolsonaro flees Brazil for US amid investigation — reports\nOctober 27, 2026\nBrazilian Senator Flavio Bolsonaro has left the country for the United States after he was defeated in Sunday's presidential election, Folha de S.Paulo and Reuters reported, citing sources close to the senator.\nThe US State Department will issue visas to Flavio Bolsonaro and his family to allow them to enter the US, a senior State Department official told Reuters and other news agencies.\nLeftist President Luiz Inacio Lula da Silva, who secured the runoff victory in elections, told supporters outside the presidential residence in Brasilia on Tuesday that Bolsonaro had left the country, but he didn't have information about Bolsonaro's exact whereabouts.\nBrazil is \"the second country\" of the Bolsonaro family, Lula added.\n\"The first is licking American boots,\" the reelected president said. \"Those who are not liable do not fear. A fellow that secretly leaves his country, that's because he is liable for something.\"\nBolsonaro wasn't allowed to leave Brazil\nThe Supreme Court had asked Flavio Bolsonaro, the eldest son of former President Jair Bolsonaro, to surrender his passports to stop him from leaving the country amid investigations into the senator.\nIt was reported that Bolsonaro had refused to comply with the order, although other reports contradicted this.\nThe AFP news agency cited a police official as saying that Bolsonaro's passports had been cancelled and there was no official record of him leaving the country.\nBrazilian newspaper Folha de S.Paulo reported that Bolsonaro's plane was scheduled to land in either Miami or Dallas.\nHow did Bolsonaro exit Brazil?\nArgentine news outlet Infobae reported earlier today that Bolsonaro had crossed into Argentina to board a plane to the US.\nA spokesperson for Argentina's Ministry of Security denied the reports that the conservative Brazilian senator had entered the country.\nBrazilian media reports earlier said that the federal police were still searching for him.\nBolsonaro leaves Brazil after losing presidential election: What to know\nBolsonaro lost Brazil's presidential election runoff on Sunday after an incredibly tight voting count through the evening until his challenger, Lula, surged ahead.\nBolsonaro had initially said he would seek to annul the election results, citing alleged irregularities.But Bolsonaro's Liberal Party on Tuesday acknowledged the results.\nIn a video on Instagram on Monday, Bolsonaro said he had been served with a Supreme Court order to hand over his passports so he couldn't leave the country.\nHe had said he was planning to hand over his passports, but reports on Tuesday said the deadline had passed leading to their cancellation.\nWhat are the investigations against Flavio Bolsonaro about?\nThe senator has been accused of laundering money through a sports betting company, money that was deducted from government pensions to senior citizens.\nA second investigation is looking into Bolsonaro's connections to a disgraced banker from whom he allegedly accepted millions of dollars to finance the biopic about his father, titled \"Dark Horse.\"\nBolsonaro loses his immunity from prosecution once his Senate term comes to end in February 2027. He has denied wrongdoing in both cases.\nBolsonaro asked to surrender passports: What to know\nBolsonaro said that he had received the Supreme Court order outside the home where his father, Jair Bolsonaro, is under house arrest.\nHe said the order was issued by Supreme Court Justice Alexandre de Moraes, the same judge who sentenced his father to prison.\nHe also pointed to comments made by his brother, Eduardo Bolsonaro, who said on a podcast last week that his sibling should leave the country if he lost the election.\nEduardo, who lives in the US, was convicted in absentia in June of illegally lobbying the Trump administration. He was sentenced to four years in prison and a warrant was issued for his arrest.\nEdited by: Alex Berry and Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル選挙：反ネタニヤフ勢力が優位も多数派には至らず", "title_en": "Israel election: Anti-Netanyahu bloc ahead, but no majority", "summary_ja": "イスラエルの議会選挙で、反ネタニヤフ勢力が53議席を獲得し、親ネタニヤフ勢力の50議席を上回りましたが、安定多数派に必要な61議席には両勢力とも達しませんでした。野党指導者ガディ・アイゼンコットは選挙後の演説でネタニヤフ首相に辞任を呼びかけ、政権交代の準備を表明しました。", "summary_en": "While Netanyahu's party is projected to be the biggest in parliament, the anti-Netanyahu coalition looks set to have more seats. But no bloc has a clear majority.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/israel-election-anti-netanyahu-bloc-ahead-but-no-majority/live-79713839?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Israel election: Anti-Netanyahu bloc ahead but without a majority\nPublished October 27, 2026last updated October 28, 2026\nWhat you need to know\n- Israelis have voted, at a high turnout, in a parliamentary election that appears to have produced no clear winner\n- The pro-Netanyahu bloc is on 50 seats, with the anti-Netanyahu bloc on 53, according to public broadcaster KAN\n- Two Arab parties have gained 17 seats between them\n- At least 61 seats are needed to form a secure majority\n- Israel election committee reports highest voter turnout on record as of 2 p.m., halfway through the voting day\n- Benjamin Netanyahu, Israel's longest-serving prime minister, faces a staunch challenge to his grip on power\n- His chief rival is former military chief Gadi Eisenkot\n- Eisenkot called on Netanyahu to resign in post-election speech\nFollow below for all the latest on the Israeli election on October 27, 2026, and its aftermath:\nTired of missing our real-time updates? Click here to add us as a Preferred Source on Google. Then tap the \"Star\" or \"Preferred\" to keep DW News at the top of your feed.\nEisenkot calls on Netanyahu to resign in post-election speech\nIsraeli opposition leader Gadi Eisenkot has called on Prime Minister Benjamin Netanyahu to step down, saying voters have sent a clear message that they want change.\n\"We've made history,\" Eisenkot told supporters in a speech in Jerusalem following Tuesday's election. \"The public voted against the continuation of Netanyahu as prime minister.\"\nHe said a \"decent leader\" would accept the public's will and announce his resignation, warning that another round of elections would be a mistake.\nEisenkot pledged to work towards forming what he called a \"Zionist conscription government,\" referring to his push for broader military service obligations.\n\"We would like to represent all Israelis,\" he said, adding that the country needed stable leadership and a government that represented all parts of society.\nThe former military chief also warned Netanyahu against making major security decisions or launching new wars, arguing that he no longer had a mandate to do so.\n\"Netanyahu: Don't you dare use Israel's security for your political needs,\" Eisenkot said.\nEisenkot says he is ready to form a government\nGadi Eisenkot, the leader of the opposition bloc, said the election results pointed to a \"complete lack of confidence\" in Netanyahu and his coalition.\n\"I will act immediately to carry out the people’s mandate, replace Netanyahu's government and form a Zionist government committed to military conscription as soon as possible,\" Eisenkot said in a statement.\nA former military chief, he made the issue of eliminating exemptions from military service for Ultra-Orthodox men central to his campaign.\nMajority of Israeli public voted against Netanyahu, exit polls show\nMuch of the Israeli media labeled the Israeli election an opinion poll on Israeli Prime Minister Benjamin Netanyahu.\nIf the exit polls of Israel's main news outlets are anything to go by, the Israeli public voted against the country's longest-serving prime minister.\nWhile Netanyahu's current coalition includes 68 seats, the exit polls gave his bloc between 50 and 51 seats.\nThe Israeli prime minister is unlikely to concede defeat despite his coalition having taken a significant hit, but it remains to be seen how Likud's own ranks, as well as its coalition partners, will react to the exit polls.\nRa'am party becomes political power broker\nThe success of Ra'am, which exit polls predict will take seven seats, means no Israeli government can be established without the religious Muslim party playing some part.\nThe party already made headlines after appointing Yoav Segalovich, a Jewish former high-ranking police chief, as the number two candidate to leader Mansour Abbas. The raging criminality and violence across the Arab and Palestinian community, as well as the war in Gaza, both could have played a role in Ra'am's result.\nBoth the Likud-led coalition and large parts of the Israeli opposition may have ruled out a coalition with Ra'am, but the current results may leave them little choice but to seek some form of cooperation with the party.\nAs one Israeli pollster put it, \"Tonight, Israelis were reminded that their population also includes Arabs and Palestinians with Israeli citizenship.\"\nNetanyahu's bloc trails in Israel election, exit polls say\nExit polls from Israel's major television networks project that a majority of Israelis voted against Prime Minister Benjamin Netanyahu's coalition, but his Likud party has emerged as the largest single group in the Knesset, with 25 projected seats.\nChallenger Gadi Eisenkot's bloc has emerged as the largest group with a projected 53, just ahead of the ruling coalition on 50, but well short of the 61 needed for a majority.\nNeither bloc has a clear majority without the support of Arab parties.\nThese projected numbers are from public broadcaster Kan 11; other numbers vary by channel, but only slightly.\nPolls ", "translation_ja": "", "vocab": []}, {"title_ja": "DOJ、元トランプ補佐官カッシディ・ハッチンソンに対する起訴を失敗：情報筋", "title_en": "DOJ fails to get indictment against ex-Trump aide Cassidy Hutchinson: Sources", "summary_ja": "陪審団は、1月6日に関する証言についての議会証言で嘘をついた罪に問われた元ホワイトハウス補佐官カッシディ・ハッチンソンの起訴を拒否した。複数の情報筋が確認したところによると、司法省は彼女に対する起訴状を取得することができなかった。", "summary_en": "A grand jury has refused to indict former White House aide Cassidy Hutchinson on charges of lying to Congress over her testimony regarding Jan. 6, sources confirm.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/doj-fails-indictment-trump-aide-cassidy-hutchinson-jan/story?id=137619918", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ：ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、最新のニュースと生中継イベントを24時間体制でカバーしています。視聴者は、世界中で起きている重要なニュースをリアルタイムで追跡できます。このプログラムは、継続的なニュース報道と緊急事態への即座の対応を提供しています。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "元交際相手との法廷番組出演当日に殺害容疑、男を逮捕 令状発行", "title_en": "Man accused of fatally choking ex on same day they appeared on court TV show: Warrant", "summary_ja": "33歳の3人の子どもを持つ母親ミシェル・パーカーは、2011年に放映された「ピープルズ・コート」という法廷番組に出演した直後に失踪した。警察によると、彼女は元交際相手に絞殺された容疑で、その男に対して逮捕令状が発行されている。", "summary_en": "Michelle Parker, a 33-year-old mother of three, vanished in 2011 hours shortly after the pre-taped episode of \"The People's Court\" aired, according to police.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/man-accused-fatally-choking-same-day-appeared-peoples/story?id=137610700", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "UK、エルファシャー『強姦キャンペーン』に関与したスーダン軍事指導者に制裁", "title_en": "UK sanctions Sudanese military leaders implicated in El Fasher ‘campaign of rape’", "summary_ja": "英国政府は、スーダンの継続中の紛争で性暴力の疑いがある両勢力の軍事指導者15人に対して、渡航禁止と資産凍結の制裁を発動しました。この行動は、RSFによるエルファシャー制圧1周年を記念したもので、その間に数万人の民間人が殺害されたと考えられています。英国は、この措置がエルファシャーで起きた恐怖が世界に知られることを望んでいると述べています。", "summary_en": "Commanders suspected of sexual violence during the largest and fastest slaughter of civilians in more than 30 years have been subjected to travel ban and asset freeze Senior Sudanese commanders implicated in a “campaign of rape” have been targeted by the UK on the first anniversary of a mass atrocit", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/26/uk-sanctions-sudanese-military-leaders-implicated-in-el-fasher-campaign-of", "state_media": false, "category": "政治", "full_text": "Senior Sudanese commanders implicated in a “campaign of rape” have been targeted by the UK on the first anniversary of a mass atrocity that saw tens of thousands of civilians killed over several days.\nA year after the fall of El Fasher, the British government said it had sanctioned military leaders from both sides in the country’s ongoing conflict whom it suspected of sexual violence during the siege of the city.\nA total of 15 commanders from the military groups – the Rapid Support Forces (RSF) and the Sudanese Armed Forces (SAF) – have been subjected to a travel ban and an asset freeze.\nThe Foreign Office said it hoped the action would ensure “the horrors that took place at El Fasher will be known to the world”.\nDuring the RSF’s takeover of the city, up to 10,000 men, women and children are believed to have been slaughtered over two days – the fastest and largest massacre of civilians this century. Another 40,000 remain unaccounted for.\nThe killings came at the end of an 18-month starvation siege by the RSF, which was allegedly backed by the United Arab Emirates (UAE). The UAE continues to deny supporting the RSF.\nFewer than 70,000 people are believed to remain in El Fasher, compared with a prewar population of more than 1 million. Life inside the city continues to be horrendous, with testimony indicating routine detention, torture and unlawful killings.\nIndividuals targeted by the UK’s latest sanctions include Hussein Abu Jalak, an RSF colonel linked to atrocities during the siege, which forced hundreds of thousands of civilians to live off animal feed.\nAnother is Al-Nour Ahmed Adam – also known as “Al-Qubba” – who was identified as playing a prominent role in the attack on the city.\nA Guardian investigation earlier this year revealed internal US and UK warnings were sidelined in the run-up to the RSF attack on El Fasher, and that action that might have saved lives was not taken.\nA statement to mark the anniversary of the massacre from the Coalition on Atrocity Prevention and Justice for Sudan said: “The victims will not be forgotten, survivors will be heard, and we will continue to pursue accountability for those responsible.”\nDuring the 12 months since the fall of El Fasher, Sudan’s ruinous conflict – which has forced 14 million people to flee their homes – has developed increasingly into a drone war.\nThe latest strikes saw the RSF causing mass power outages across east Sudan after targeting power stations with a coordinated drone attack.", "translation_ja": "", "vocab": []}, {"title_ja": "米軍がソマリアの洪水を「兵器化」、エルニーニョの中で女性と子どもを危険地帯に追い込んでいると非難", "title_en": "US forces accused of ‘weaponising’ Somalia’s floods by trapping women and children in the path of El Niño", "summary_ja": "ソマリア南部ではアメリカ軍による無人機の空爆が激化し、住民がジュバ川の氾濫原へ押し込められている状況が報告されている。消息筋によると、米軍の軍事戦略はエルニーニョによる豪雨を「兵器」として利用し、アルシャバブ支配地域の人口を洪水危険地帯へ意図的に追い込んでいるという。2023年のエルニーニョはソマリアで100年ぶりの大洪水を引き起こし、120万人以上が避難を余儀なくされた。", "summary_en": "Exclusive: Coordinated airstrikes on territory held by al-Shabaab are driving the civilian population to find refuge alongside a river where rising water levels are a threat to safety. Is it a deliberate military strategy? The water was rising rapidly. It had already reached Cayni Ali’s waist. Her h", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/26/us-forces-accused-of-weaponising-somalia-flood-el-nino", "state_media": false, "category": "政治", "full_text": "The water was rising rapidly. It had already reached Cayni Ali’s waist. Her home, five metres from the flooded River Juba in southern Somalia, never stood a chance. There was nowhere to go. Ali’s city of Jilib was under attack. Repeated airstrikes, said the mother of six, were pinning its population beside the rising river.\n“The drones come all the time,” said the 27-year-old. “We hear them constantly. They kill animals, civilians. The town is big but destruction is everywhere.”\nAsho Omar from Malenda, a village near Jilib, described “constant” airstrikes that had forced people towards the banks of the Juba.\n“The airstrikes are everywhere; it is difficult to move. So many people have been killed.”\nTheir testimony offers a rare glimpse of life inside the stronghold of al-Shabaab, the Islamist militants who control 30% of Somalia. Closed off from the outside world, residents describe a city dealing with significant civilian casualties. Bodies, some said, lay in the streets.\nThe ongoing conflict is a legally ambiguous, shadowy war coordinated by the United States in east Africa, in which there is little accountability for harm to Somali civilians.\nThe United States Africa Command (Africom) would not share “operational security” details of a seemingly accelerating campaign that has also raised questions over potential covert US strikes. But there is, perhaps, an even darker dimension to the offensive on al-Shabaab’s de facto capital.\nSources say the military strategy appears to be seeking to drown those living in al-Shabaab territory by “weaponising” a rapidly strengthening El Niño, forecast to intensify Somalia’s rainy season from this month.\n“The airstrikes are forcing people to go close to the river. It’s an extremely aggressive offensive, exploiting El Niño as a weapon of war to push the population into flood-prone areas,” said a source monitoring the Juba floodplain in southern Somalia.\nPinning the population – which includes large numbers of women and children – on the river’s floodplain has raised concerns of large-scale deaths in the months ahead.\n“The official line is that they are targeting military positions and al-Shabaab, but because al-Shabaab is embedded within the community, it’s difficult to avoid collateral damage,” added the source.\nWhen El Niño last struck Somalia in 2023, it caused the worst floods seen in the country for a century, displacing more than 1.2 million people. Analysts have questioned the ethics of the US military allegedly using mapping data from flood-prone areas – conceived to mitigate civilian casualties – to inflict harm.\nJethro Norman, a senior researcher with the Danish Institute for International Studies, said: “A weaponisation of El Niño is a reversal of process – using humanitarian remote sensing to inflict casualties rather than to mitigate harm. You capture the cumulative impact of a sustained airstrikes campaign in an El Niño flooding context.”\nUS officials deny exploiting climatic factors. A spokesperson said: “Africom does not target civilians, conduct operations for the purpose of displacing civilian populations or use weather or flooding as a method of warfare. Africom targets lawful military objectives and takes feasible measures to mitigate civilian harm.”\nNevertheless, many wonder if the opportunity to weaken al-Shabaab using the weather was too tempting to ignore, offering a catastrophic drowning event blamed on a supercharged El Niño.\nLike many cities, Jilib’s location has been found wanting in an era of extreme weather. On a low-lying plain, the city is chronically vulnerable to flooding. In 2023, vast swathes of farmland were submerged. Halimo Abdikadir from Kamsuuma, south of Jillib, described the destruction of her home, 6 miles (10km) from the river. “The waters came quickly at night – when they left, everything was mud. A lot of animals drowned.”\nArbey Famu from Ahmed Yare, another village outside Jilib, expects this El Niño to be far worse than 2023: her crops of maize and sorghum are underwater.\n“In Jilib, there is big flooding already,” said the 70-year-old.\nUS defence officials will know the early indicators of El Niño’s impact in al-Shabaab’s heartland. UN agencies say the Juba River basin is of “particular concern”. The International Committee of the Red Cross (ICRC), meanwhile, foresees “severe flooding”.\nAttacking Jilib using ground forces carries much risk. Airstrikes can yield triumphs such as the death of a senior al-Shabaab commander on 1 October, but are unable to overrun a city of 100,000.\nAli Adan Ali, the commissioner for displaced people in Jubaland, is worried. In his Kismayo office, Ali identified 327 regions prone to flooding. By October, El Niño warnings had only been issued to half.\nHis chief concern is the lack of boats. Without them, he says, thousands in al-Shabaab territory risk being trapped on the east side of the river, unable to reach help in Kismayo, at the mouth of the Juba.\nThree years ago, during the last El Niño, Al", "translation_ja": "", "vocab": []}, {"title_ja": "スーダン準軍事勢力のドローン攻撃で東部州が大規模停電", "title_en": "Sudan paramilitary drone strikes cause mass power cuts in eastern states", "summary_ja": "スーダンの準軍事勢力「ラピッド・サポート・フォーセス」が5つの発電所に対して協調的なドローン攻撃を実施し、東部地域で大規模な停電を引き起こしました。攻撃により、アル・ジャジーラ州とゲダレフ州では各2か所、ホワイトナイル州では1か所の発電所が被害を受けました。すでに世界最大規模の飢餓危機に直面している地域の住民は、医療サービスや基本的なインフラへのアクセスがさらに悪化する恐れがあります。", "summary_en": "Rapid Support Forces strike five power stations in three states controlled by Sudanese army Sudan’s paramilitary Rapid Support Forces have launched a coordinated drone attack against five power stations, causing mass power outages across the country’s east, a government official said. The drones hit", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/26/sudan-paramilitary-drone-strikes-rapid-support-forces-power-cuts-eastern-states", "state_media": false, "category": "政治", "full_text": "Sudan’s paramilitary Rapid Support Forces have launched a coordinated drone attack against five power stations, causing mass power outages across the country’s east, a government official said.\nThe drones hit two power stations each in the states of Al-Jazira and Gedaref and one in White Nile state, “resulting in power outages across large parts of these three states”, the official said on condition of anonymity.\nAll three states are controlled by the Sudanese army, which has been at war with the RSF, its former ally, since April 2023.\nThe United Nations has repeatedly warned that regular attacks on power stations threaten health and services for millions of people who are already facing the world’s largest hunger crisis.\nBabiker Youssef, a resident of Al-Fao, in Gedaref, said the power had been out there since early morning.\n“My son is diabetic, his insulin has to be stored in the fridge,” he said over the phone, adding that he feared he would not be able to replace the medication if it spoiled. “We have no idea when the power will come back,” he said.\nElectricity has been cut for days at a time after past paramilitary drone strikes on power stations and hydroelectric dams.\nSudan’s war is currently being fought primarily via drones, with both sides launching sophisticated attacks across the country, killing dozens of civilians at a time.\nIn the first three weeks of October, drone strikes killed more than 300 people and injured hundreds more, according to a UN tally.\nAfrica’s third largest country, home to an estimated 50 million people, has been ravaged by the war, which aid workers estimate has killed more than 200,000 people.\nThe majority of Sudan’s hospitals have been forced to close, at least 8 million children are out of school and swathes of the country cannot access basic services.\nAbdelhafez Daafallah, a 54-year-old farmer, said by phone from Al-Junaid town in Al-Jazira: “The electricity had just started to improve three months ago, the power station the militia had destroyed was just repaired and we had hope our irrigation pumps would finally start running again.\n“We hoped we would be able to finally get back to farming, but now the station has been hit,” he said, frustrated after nearly four years unable to work his land.\nFarmers in Al-Jazira have struggled to rehabilitate and replant their land since the army recaptured the state from the RSF last year.\nTo the east, in Gedaref, Ibrahim Mohammed, 37, a grocer, said he was “already facing power cuts for hours before the strike”. “Now I have chicken in the fridge, we either lose our entire stock, or will be forced to sell it off at any price, which is still a loss,” he said.\nSudan is also grappling with unprecedented inflation and its currency has lost more than 25% of its value in recent weeks.", "translation_ja": "", "vocab": []}, {"title_ja": "ルーラ大統領、ボルソナロのブラジル離脱を「恥ずべき行為」と非難", "title_en": "President Lula calls Bolsonaro’s Brazil exit ‘shameful’", "summary_ja": "ブラジルのルイス・イナシオ・ルーラ・ダ・シルバ大統領は、米国へ向かったと報じられているフラビオ・ボルソナロを批判した。ボルソナロは選挙敗北とマネーロンダリング疑惑に関連した最高裁判所のパスポート返納命令を受けて国を離れたとされている。", "summary_en": "President Lula da Silva criticised Flavio Bolsonaro for leaving Brazil amid reports he was headed to the US.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/27/president-lula-calls-bolsonaros-brazil-exit?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "President Lula calls Bolsonaro’s Brazil exit ‘shameful’\nNewsFeed\nPresident Lula calls Bolsonaro’s Brazil exit ‘shameful’\nBrazilian President Luiz Inacio Lula da Silva has criticised Flavio Bolsonaro for leaving the country amid reports he was headed to the US. Bolsonaro reportedly fled after election defeat, and a Supreme Court order to surrender his passports amid a money-laundering probe.\nPublished On 27 Oct 2026", "translation_ja": "", "vocab": []}, {"title_ja": "ベングヴィル氏、支持者に演説する悪い一日", "title_en": "A bad day for Ben-Gvir as he addresses his supporters", "summary_ja": "イスラエル選挙でオツマ・イェフディト党が議席を失ったことが世論調査で示された後、右翼政治家イタマル・ベングヴィル氏は強気の発言を行った。彼は自身の政治キャリアの中でパレスチナの家屋を破壊し、刑務所の処遇を厳しくしたことに誇りを持っていると述べた。", "summary_en": "Itamar Ben Gvir was defiant after polls show his Otzma Yehudit party has lost seats in the Israeli election.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/27/a-bad-day-for-ben-gvir-as-he-addresses-his-supporters?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "A bad day for Ben-Gvir as he addresses his supporters\nNewsFeed\nA bad day for Ben-Gvir as he addresses his supporters\nItamar Ben Gvir was defiant in his first comments after polls show his Otzma Yehudit party has lost seats in the Israeli election. The right-wing politician says he’s proud to have destroyed Palestinian homes and toughened prison conditions during his political career.\nPublished On 27 Oct 2026", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル選挙で明確な勢力図が形成されず：今後の展開は？", "title_en": "No clear mandate projected in Israel election: What’s next?", "summary_ja": "イスラエルの立法選挙の出口調査の結果、ネタニヤフ首相率いるリクード党連合は120議席中50議席、野党連合は52議席を獲得する見通しで、どちらも過半数の61議席に達していない。アラブ系政党が18議席を獲得し、キングメーカーとなる可能性がある中、政府樹立に向けた数週間から数ヶ月間の政治交渉が予想される。", "summary_en": "President Isaac Herzog will task the candidate he deems best placed to form a government once results are in.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/27/no-clear-mandate-projected-in-israel-election-whats-next?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "No clear mandate projected in Israel election: What’s next?\nPresident Isaac Herzog will task the strongest candidate with forming government once results are finalised.\nExit polls from Israel’s legislative elections have come in, with no party or bloc projected to secure a clear mandate to form a new government.\nThe polls, released by the major Israeli television networks on Tuesday, indicated that the coalition led by current Prime Minister Benjamin Netanyahu’s Likud party was on track to win 50 seats in Israel’s 120-seat parliament, the Knesset.\nThe opposition bloc led by former Israeli military chief of staff Gadi Eisenkot’s Yashar party was projected to take 52 seats.\nThat could leave neither bloc with the 61 seats needed for a majority, setting the stage for weeks or months of political jockeying to form Israel’s next government.\nSeparately, the Arab-led parties, which are not part of either coalition, were projected to win 18 seats. This means the Arab-led parties could emerge as kingmakers if other parties agree to join forces with them.\nHere’s what comes next:\nHow have parties reacted?\nEisenkot said the exit polls show a “lack of confidence” in Netanyahu, while Yair Lapid, the current opposition leader, said the prime minister’s bloc has suffered a “crushing defeat”. He added, “This is a total collapse, and the public has told them to go home.”\nBut Gideon Saar, Israel’s foreign minister and a member of Netanyahu’s Likud party, said the opposition’s celebrations were premature.\nIn a social media post, he said: “Likud is the largest party in Israel. It is always good to learn something from the past.”\nNetanyahu, who heads Likud, has served as prime minister for nearly 19 of the past 30 years and has repeatedly survived political crises.\nEhab Jabareen, a Palestinian political analyst and researcher in Israel, told Al Jazeera that the early exit poll projections show “a clear weakening of Netanyahu’s bloc” but expressed caution about “declaring either a Netanyahu victory or the end of his political career”.\n“The exit polls suggest that his bloc has lost its majority, but they also suggest that his opponents face a difficult task in building one,” he said. “If neither side can form a government, Netanyahu could remain in office as caretaker while the negotiations continue.”\nWho will the president nominate to form a government?\nIt remains to be seen.\nOnce the final vote tally is in on November 4, Israeli President Isaac Herzog will speak with party leaders about who they want as prime minister, then tap the candidate he believes has the best chance of forming a government.\nThat will not necessarily be the leader of the party that won the most seats in the Knesset.\nWith Netanyahu and Eisenkot’s parties emerging as the strongest, the two are viewed as leading contenders.\nHow much time will the invited leader have to form a coalition?\nUp to 42 days. The candidate initially has 28 days, but the president can extend it by 14 days.\nDuring this time, parties could engage in intensive negotiations and dealmaking, seeking policy concessions or potential ministerial portfolios, as the designated candidate tries to cobble together enough support to govern.\nIf the candidate cannot assemble a coalition with at least 61 seats, they could also try to form a minority government by relying on support from smaller parties, or negotiate a power-sharing arrangement with alternating prime ministers.\nTo be sworn in, a new government must win a parliamentary confidence vote by a simple majority, which can be fewer than 61 votes if some parties abstain.\nWhat if negotiations fail?\nIf the first candidate fails to form a government, Herzog has the option of asking another Knesset member to try to do so within 28 days. If that candidate also fails, a majority of Knesset members could put forward a third candidate, who would have a final 14 days to try to assemble one.\nIf the Knesset remains at an impasse, it would be formally dissolved, and Israelis would return to the polls for another round of elections.\nThose elections would have to be called within 90 days. In the meantime, Netanyahu’s government would remain in office as a caretaker government.\nHas this happened before?\nYes.\nProlonged gridlock in the Knesset forced Israelis into three rounds of elections between April 2019 and March 2020. The result was a power-sharing agreement between Netanyahu and his then-chief rival, Benny Gantz, under which they were supposed to rotate the premiership.\nThat government collapsed a year later after failing to pass a budget.\nWill the opposition form a coalition with the Arab-led parties?\nWhile the exit polls suggest the Arab-led parties could become kingmakers, both Netanyahu and Eisenkot have ruled out partnering with the parties, citing a lack of shared values.\nAsaf Ronel, an Israeli political analyst, said that while exit polls suggest an end to Netanyahu’s “nightmarish government”, there are serious questions if other leaders can overcom", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル選挙の出口調査、野党陣営がわずかにリード、過半数には及ばず", "title_en": "Israeli exit polls indicate deadlock in election", "summary_ja": "イスラエルの総選挙の出口調査によると、野党陣営が52～53議席でネタニヤフ首相陣営の50議席をわずかに上回ったが、120議席の議会で過半数には達していない。ネタニヤフ陣営では最大政党リクードが24～25議席を獲得したものの、主流右派政党の多くが野党の中道政党ヤシャル党への支持に転じた。投票率が高かったこの選挙は、ネタニヤフ首相に対する国民の信任喪失と評価されている。", "summary_en": "Polls closed at 10 p.m. (2000 GMT) in Israel’s pivotal general election, which saw high voter turnout and veteran Prime Minister Benjamin Netanyahu fighting for his political life", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/israeli-exit-polls-indicate-deadlock-in-election/article71633257.ece", "state_media": false, "category": "政治", "full_text": "The first exit polls from Israel’s elections showed the opposition bloc with a slight edge over Prime Minister Benjamin Netanyahu’s camp as voting ended Tuesday (October 27, 2026), but still shy of an outright majority in the 120-seat Knesset.\nThe country’s main pollsters -- Channels 11, 12 and 13 -- projected the Opposition bloc to win 52 or 53 seats, and Mr. Netanyahu’s bloc to win 50, although his Likud would be the largest single party in the parliament, with 24 or 25 seats.\nIsraeli Arab parties also made gains after their voter base turned out in high numbers. The exit polls showed the two Arab-majority groupings, Raam and the Joint List, winning 17 or 18 seats between them.\nIn the last election, Likud walked away with 32 seats, enabling it to cobble together a coalition with smaller far-right parties after Mr. Netanyahu’s traditional allies baulked at the corruption cases the premier was facing.\nThis time around, those mainstream right-wing parties, by and large, vowed to work with main challenger Gadi Eisenkot’s Yashar party -- projected to nab 21 to 23 seats -- to form an Opposition coalition capable of unseating Netanyahu.\n“The initial exit poll results indicate a complete lack of confidence in Netanyahu and the October 7 government,” Mr. Eisenkot said.\nIsrael’s current Opposition chief Yair Lapid said Mr. Netanyahu’s bloc had suffered a “crushing defeat”, while left-wing leader Yair Golan said the public had “fired the Netanyahu government”.\nWhile Raam and the Joint List do not belong to the Opposition bloc, they have expressed openness to supporting it.\nTuesday’s (October 27, 2026) poll was marked by high turnout, with many voters saying they saw it as pivotal for the country’s future.\nThe following is a party-by-party breakdown of the projected seat count in the first exit polls:\nPro-Netanyahu camp\nLikud, right-wing, led by Benjamin Netanyahu: 24 or 25\nOtzma Yehudit, far-right, led by Itamar Ben Gvir: 6 or 7\nUnited Torah Judaism, Ashkenazi ultra-Orthodox, led by Yaakov Asher: 6 or 7\nShas, Sephardic ultra-Orthodox, led by Aryeh Deri: 6 to 8\nReligious Zionism, far-right, led by Bezalel Smotrich: 6\nOpposition camp\nYashar, centrist, led by Gadi Eisenkot: 21 to 23\nBeyahad, centre-right, led by Naftali Bennett: 12 to 14\nThe Democrats, left-wing, led by Yair Golan: 9 or 10\nYisrael Beiteinu, secular right, led by Avigdor Lieberman: 7 to 9\nArab parties\nRaam, moderate Islamist, led by Mansour Abbas: 7\nJoint List, far-left, led by Yousef Jabareen: 10 or 11\nPublished - October 28, 2026 01:56 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "フーシ派がサウジアラビアの石油精製所を攻撃と主張、リヤドで爆発", "title_en": "Houthis claim attack on Saudi oil refinery, blasts shake Riyadh", "summary_ja": "イエメンのフーシ派は10月27日、サウジアラビア最大の石油精製所ラス・タンウラをミサイルで攻撃したと主張し、大規模な火災が発生したとしている。サウジの首都リヤドでも複数の爆発が報告され、サウジ主導の連合軍が2発の弾道ミサイルを迎撃したと発表した。イラン支援のフーシ派は数週間にわたってサウジの石油施設と民間地域への攻撃を続けている。", "summary_en": "Saudi Arabia, West Asia's largest economy, has suffered weeks of strikes from the Iran-backed Houthis against oil and civilian sites including Riyadh's international airport", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/houthis-claim-attack-on-saudi-oil-refinery-blasts-shake-riyadh/article71633247.ece", "state_media": false, "category": "経済", "full_text": "Yemen's Houthis said they targeted Saudi Arabia's biggest oil refinery with a ballistic missile on Tuesday (October 27, 2026), as blasts shook the capital of the world's top crude exporter.\nSaudi Arabia, West Asia's largest economy, has suffered weeks of strikes from the Iran-backed Houthis against oil and civilian sites including Riyadh's international airport.\nHouthis target refinery in southern Saudi Arabia: Media\n\"The Yemeni Armed Forces were able to target the Ras Tanura refinery in the Eastern Province with a ballistic missile,\" Houthi military spokesman Yahya Saree posted on X, saying the strike caused \"massive fires\".\nThe Saudi-led coalition fighting the Houthis earlier said it had shot down three missiles fired by the group towards the Eastern Province.\nA resident in the city of Al Khobar, south of the Ras Tanura complex, told AFP he heard explosions around dawn and received a text message alert.\nIn the crossfire: on India and the Saudi-Houthi conflict\n\"We got the alert on the mobile and then heard a very loud bang,\" the resident said.\nMaritime security agency Vanguard said a fire was reported in the Ras Tanura area in the early hours of Tuesday (October 27, 2026) after an attack.\n\"The fire has reportedly been contained, while the extent of damage and any impact on oil-loading operations remain unclear at current,\" Vanguard said.\nThe Ras Tanura facility along Saudi Arabia's Gulf coast is home to one of the largest refineries in West Asia and a cornerstone of the kingdom's energy sector.\nThe complex has a capacity of 550,000 barrels per day. It has been repeatedly targeted by strikes blamed on Iran, including a drone attack in early March that forced a partial shutdown of the refinery.\nMeanwhile a series of explosions echoed across the capital, Riyadh, shaking office windows in the city centre. A text message alert warned residents to seek shelter.\nThe Saudi-led coalition fighting the Houthis said it intercepted two ballistic missiles that were fired at Riyadh.\nEgypt 'declared war'\nEarlier, a Houthi official said the Egyptian Parliament's decision to authorise defensive military support for Saudi Arabia amounted to a declaration of war.\nEgypt's Parliament authorised the measure on Monday (October 26, 2026), following a request from Egyptian President Abdel Fattah al-Sisi.\n\"It is truly remarkable that while these people go to discuss what they call 'peace in the region', Egypt and its parliament declare support for the so-called defence of the Kingdom of Saudi Arabia, and in doing so, declare war against the Republic of Yemen,\" said Mohammed Ali al-Houthi, a member of the Houthis' political bureau, in a Telegram post.\nIt was not clear exactly what support was on offer from Egypt, which has the Arab world's largest military.\nAl-Houthi's statement also pointed to Monday's (October 26, 2026) visit to Tehran by the Saudi defence minister, Pakistan's army chief and Turkey's intelligence chief, in a bid to de-escalate tensions in the West Asia war.\nRiyadh, Ankara and Islamabad recently signed a NATO-style defence pact in Mecca, pledging to consider an attack on one country as an attack on all three.\nTurkey and Pakistan have not announced any strikes on the Houthis during the group's weeks of attacks on Saudi Arabia.\n‘Not afraid of any alliance'\nAl-Houthi said the group was \"not afraid of any alliance that may be formed\".\nYemen's largely dormant conflict reignited in July, further destabilising the region months into West Asia war between the United States and Iran.\nThe Houthis declared a maritime blockade of Saudi Arabia and began hitting its ships, territory and oil facilities, before seizing swathes of Red Sea coastline in a major offensive in September.\nThe Houthis have in turn reported frequent Saudi strikes targeting areas under their control.\nThis month the Houthis ramped up attacks on Saudi Arabia, forcing the cancellation of flagship events and shutting down Riyadh's airport for two weeks.\nThe Houthis' war with the Saudi-led coalition began in 2015, months after they ousted the internationally recognised government from the capital Sanaa in September 2014.\nPublished - October 28, 2026 02:25 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "BRICS議会フォーラム、西アジア情勢の悪化に「深刻な懸念」を表明", "title_en": "BRICS parliamentary forum expresses ‘deep concern’ about West Asian hostilities", "summary_ja": "BRICS諸国の議会指導者たちは、西アジアにおける緊張激化と敵対行為の深刻さを懸念し、国際法に反する「一方的な強制措置」と「経済制裁」を非難する共同宣言を発表しました。ロク・サバ議長オム・ビルラ主導の第12回BRICS議会フォーラムでは、イスラエル・パレスチナ紛争の解決に向けた「2国家解決案」の必要性が重ねて確認されました。", "summary_en": "Joint declaration calls for a two-state solution to Israel-Palestinan conflict; asserts the right of the Palestinian people to self-determination, freedom, and an independent, sovereign state", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/national/brics-parliamentary-forum-expresses-deep-concern-about-west-asian-hostilities/article71632561.ece", "state_media": false, "category": "政治", "full_text": "Expressing ‘deep concern’ about the escalating tension and hostilities in West Asia, parliamentary leaders from the BRICS nations slammed “unilateral coercive measures” and “unilateral economic sanctions” imposed in the region as contrary to international law.\nA joint declaration issued after deliberations led by Lok Sabha Speaker Om Birla, at the end of the two-day 12th BRICS Parliamentary Forum on Tuesday, also reiterated the need for a ‘two-state’ solution to the Israel-Palest
