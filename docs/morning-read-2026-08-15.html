ding their diplomatic engagement with the Taliban, which may further embolden the group to tighten its repression and advance its extreme policies. The Taliban’s odious treatment of women should in itself be sufficient to compel foreign countries to reconsider their approach. But the strides the Afghan women’s movement has made offers them another reason to resist normalization and instead to invest directly in Afghan people. Afghan women are the most organized constituency resisting the Taliban’s hardline agenda—and they are preserving the human capital, institutions, and political networks with which a stable and pluralistic Afghanistan could one day be rebuilt.\nSTILL IN THE FIGHT\nAfghan women had received education and participated in professional life—if unevenly—for decades before the Taliban first seized power in 1996 and imposed oppressive policies that dismantled women’s rights and opportunities. After the Taliban regime fell in 2001, Afghanistan, with the support of the United States and other international partners, made remarkable strides in restoring and advancing the rights of the country’s women and girls. By 2021, an entire generation of women had grown up with some access to education. Women, especially in urban centers, worked as doctors, lawyers, judges, journalists, and public servants. They became a significant presence in political life, filling more than a quarter of the seats in Afghanistan’s parliament and serving as ministers and diplomats.\nAfter the Taliban returned to power in 2021, the group swiftly imposed policies that reversed decades of progress for women and girls. In addition to barring women’s access to education, employment, and public services, it dismantled key institutions such as the Ministry of Women’s Affairs, the Afghan Independent Human Rights Commission, and the High Commission to Eliminate Violence Against Women. The regime also closed women’s shelters, imposed a strict dress code, and restricted women’s access to public spaces. Every year, these measures have become more expansive and entrenched, reinforced by the 2024 Law on the Promotion of Virtue and the Prevention of Vice and the promulgation of more than a hundred decrees that touch on nearly every aspect of women’s lives. More than 3,000 morality inspectors have been deployed across the country to enforce the Taliban’s decrees in public spaces and to pressure male family members to ensure women’s compliance within the home. One former civil society worker described the suffocating effect of these laws in testimony related to the UN Security Council, commenting, “I am afraid that they will ban women from breathing without a man’s permission.” Another Afghan woman compared living under the Taliban to “being buried alive.”\nYet even in these draconian conditions, Afghan women have continued to fight for their rights, meeting the Taliban’s repression with extraordinary acts of courage. Within weeks of the group’s return to power, scores of women marched through the streets of Kabul, Herat, Mazar-i-Sharif, and other cities to demand that the Taliban reverse their newly introduced restrictions. The UN has documented the Taliban’s brutal response to these demonstrations, which has included arbitrary arrests of protesters and their families, enforced disappearances, rape, torture, and other forms of intimidation and violence. Yet women activists have remained defiant, and at times they have drawn support from men. In June of this year, women and men in Herat took to the streets to protest the detention of a", "translation_ja": "", "vocab": [{"word": "normalization", "definition": "通常の関係や状態への回復のこと。ここでは国際社会がタリバンを通常の国家として扱い、政治的・外交的な正当性を与えることを意味する。"}, {"word": "embolden", "definition": "誰かに勇気や自信を与えて、ある行動を取るよう促すこと。ここでは外交的な関与がタリバンに更なる抑圧を進める勇気を与えるという文脈で使われている。"}, {"word": "tenacious", "definition": "粘り強い、断固とした、しつこいという意味の形容詞。ここではアフガニスタン女性の不屈の抵抗運動を描写している。"}, {"word": "draconian", "definition": "非常に厳しい、過度に厳罰的な法律や措置のこと。ここではタリバンによる女性抑圧政策の極端さを強調している。"}, {"word": "dismantled", "definition": "組織や制度を解体する、破壊するという意味。ここでは女性省などの機関がタリバンによって廃止されたことを指す。"}, {"word": "human capital", "definition": "人々の知識、スキル、健康、価値観などの経済的価値を持つ資産。ここでは教育を受けたアフガニスタン女性の社会的・経済的価値を意味する。"}]}, {"title_ja": "イラン危機の長い影", "title_en": "The Long Shadow of the Iran Shock", "summary_ja": "ホルムズ海峡の閉鎖により世界のエネルギー供給の5分の1が遮断されたにもかかわらず、エネルギー市場は事前の過剰供給と戦略備蓄のおかげで回復力を示した。しかし著者は、保護的なクッションが消耗し、次の危機局面がより大きな被害をもたらす可能性があり、アジアとヨーロッパは既に不均等な打撃を受けていると警告している。", "summary_en": "Despite the closure of the Strait of Hormuz disrupting one-fifth of global oil and gas supplies, energy markets have remained surprisingly resilient due to pre-existing oversupply, strategic reserves, and alternative infrastructure. However, the author warns against complacency, as the protective cushions are depleting and a second phase of crisis could prove far more damaging, with uneven pain already visible in Asia and Europe.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/long-shadow-iran-shock", "state_media": false, "category": "オピニオン", "full_text": "By almost any measure, the world should be suffering a far more severe energy crisis. The Strait of Hormuz, through which roughly one-fifth of global oil and liquefied natural gas supplies normally passes, has been largely closed for months. Yet when considered against the nightmare scenarios contemplated at the war’s outset, oil prices have remained low and natural gas markets have proved resilient. The global economy has so far avoided the kind of recession that many past energy shocks produced.\nIt would be tempting to conclude that the dangers of energy supply disruptions have been overstated, but such complacency would be misguided. The Hormuz crisis has so far led to only modest oil price spikes thanks to an unusual combination of favorable market conditions and years of investment in energy security measures. Before the war began, oil markets were oversupplied, inventories were relatively high, Saudi Arabia and the United Arab Emirates had built pipelines around the strait, and governments and companies had amassed emergency and commercial stocks. In addition, China helped stabilize the global oil balance by reducing its imports, drawing on its immense capacity to curb how much oil it buys for stocks, holds in inventory, refines for export, and consumes domestically.\nThese conditions may not endure. If the conflict enters a new phase of intense fighting that threatens to spill across borders and continues to block the strait, oil markets, now stressed by shortages of refined products such as diesel and jet fuel, could see crude oil prices surge higher. But even if hostilities in the region de-escalate, a persistent risk to traffic through the strait will likely remain, with passage either outright controlled by Iran or, at the very least, subject to Iranian disruption at any time. A more optimistic scenario in the next several months seems a chimera, barring major and unlikely change in Tehran.\nIn preparing for these scenarios, as well as new crises in the more distant future, the world should not take solace in the relatively benign outcome of the last five months for energy markets. The cushions that helped the world manage those months are now more threadbare: inventories have been depleted, demand is recovering, alternative routes are becoming more vulnerable, and infrastructure continues to come under fire and, in some cases, will take years to repair. A second phase of the Hormuz crisis could prove substantially more damaging than the first.\nMoreover, the first phase of the crisis was not as painless as headline global oil prices suggested. The relatively modest movement in global benchmark prices concealed a strikingly uneven distribution of pain, as countries in Asia and Europe endured high prices, shortages, rationing, fiscal strain, and forced reductions in consumption, while the United States and China demonstrated newfound levels of insulation and influence. Delayed effects also loom on the horizon. Because of the crunch in refining, diesel and other crude products are priced much higher than they normally would be at current headline oil prices. And the shock is making it harder and more costly for Europe to replenish its natural gas inventories, leaving the continent with lower-than-usual storage levels and more vulnerable to energy and geopolitical coercion in the coming winter.\nThe past five months have revealed not that the world has become immune to energy crises but that market forces, policy, and government investments in energy security have paid off. Without renewed efforts to rebuild, in today’s geopolitically fractured world that resilience will quickly erode. Before a next phase of this crisis unfolds, therefore, policymakers must analyze how this resilience came to be. Moreover, they must acknowledge that, as the energy system has changed since the 1970s, so too has the way energy shocks reverberate around the world, and the measures needed to safeguard against them. Understanding these dynamics will better position the world for the next inevitable energy shock.\nWHAT COULD HAVE BEEN\nWhen Tehran closed the Strait of Hormuz days after U.S. and Israeli attacks in late February, the head of the International Energy Agency (IEA) called it the “the largest supply disruption in the history of the global oil market.” But even as the strait remained almost entirely closed for nearly four months—until Washington and Tehran signed a memorandum of understanding in mid-June—Brent crude averaged just over $100 per barrel, up from around $70 per barrel when the war began. The peak of $126 per barrel, in April, was far below the $200 per barrel that veteran analysts had warned was possible. Even after Tehran closed the strait to oil traffic again in July, after the cease-fire collapsed, the barrel price fell into the $80 range.\nMany factors contributed to this relatively muted price response. As would be expected, oil demand was forced to decrease, to match available supply. It fell by roug", "translation_ja": "", "vocab": [{"word": "complacency", "definition": "自己満足、慢心の状態。現在の状況に満足して、潜在的な危険に警戒を怠る姿勢を指します。"}, {"word": "resilience", "definition": "回復力、しぶとさ。困難な状況から回復し、順応する能力を表します。"}, {"word": "threadbare", "definition": "ぼろぼろの、疲弊した状態。本来は布地が薄くなった様子ですが、リソースや保護手段が著しく減少した状況に使われます。"}, {"word": "reverberate", "definition": "反響する、波及する。音が反響するように、影響や結果が広がり続ける状況を表します。"}, {"word": "coercion", "definition": "強制、強圧。力や脅迫によって行動を強制されること。エネルギー供給を武器として使用する政治的圧力を指します。"}, {"word": "muted", "definition": "控えめな、抑制された。反応や影響が予想より小さい、弱められた状態を表します。"}]}, {"title_ja": "ウクライナ平和仲介の方法", "title_en": "How to Broker Peace in Ukraine", "summary_ja": "著者は、ロシア・ウクライナ戦争終結に向けた米国の外交努力は活発だが戦略的組織が不足し、成果が限定的だと主張している。論文は、成功する仲介には周到に設計されたプロセス、継続的な努力、複数の当事者による責任共有、および交渉による解決を軍事目標追求より優先させるための明確な条件が必要だと述べている。", "summary_en": "The author argues that while U.S. diplomatic efforts to end the Russia-Ukraine war show commendable activity, they lack strategic organization and have produced limited results. The piece contends that successful mediation requires a well-designed process with sustained effort, multiple parties sharing responsibility, and clear conditions that help parties envision negotiated solutions rather than pursuing military objectives.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/how-broker-peace-ukraine", "state_media": false, "category": "オピニオン", "full_text": "Since early 2025, the United States has made significant diplomatic efforts to end the war between Russia and Ukraine. Negotiators have met in Abu Dhabi, Berlin, Geneva, Istanbul, Paris, and Riyadh; envoys have shuttled to Moscow and Miami. Those efforts deserve credit. But activity is not strategy—and, as demonstrated by the massive strikes across Ukraine and Russia in recent weeks, it has yet to produce results.\nTo make real progress toward peace, Washington should apply lessons from decades of international mediation experience. Although all conflicts are unique, past negotiations show that getting the process right is essential, and they offer insights about which approaches tend to work and which do not. If talks are well organized and parties have a sense of ownership, agree on the process, and build personal relationships, negotiations are more likely to succeed. Without those conditions, efforts to end the fighting are apt to falter, and the strategic, economic, and human costs will continue to mount.\nFor any process even to begin, the parties must, of course, be willing to engage. Although Kyiv has said it wants a cease-fire and negotiations, Russian President Vladimir Putin’s recent rhetoric—he called Ukraine’s government a “junta” in May—and the intensifying attacks on Ukrainian cities suggest that he is not in a talking mood.\nYet Putin is under the most significant economic, military, and political pressure since he launched the full-scale invasion in February 2022. His forces advanced by less than half a square mile per day in June 2026—a reduction of more than 90 percent from their rate of gain in June 2025. Meanwhile, Ukraine’s increasingly effective long-range drone strikes are disrupting Russia’s energy sector and reducing state revenues. Kyiv’s attacks on refineries and logistics infrastructure are affecting everyday life in major cities. With public sentiment showing signs of strain, the Kremlin faces a more difficult task in delivering a strong result for the ruling party in September’s Duma elections. None of this means that Putin will choose negotiations over fighting. But given the pressure he is now under, that possibility should at least be tested.\nA well-designed process is the best way to gauge Putin’s intentions—and to shape them. That is because leaders pursue negotiations not only when they are struggling to achieve their military objectives but also when they see a credible alternative to war. A serious process can help the parties envision how a negotiated outcome could address their core interests and concerns. Without one, peace is a distant abstraction.\nNOT A SOLO ACT\nMediating a full-scale war is among the hardest undertakings in international affairs. When hostilities intensify and become protracted, hatred, resentment, and the desire for revenge make war self-sustaining. Leaders typically come to see themselves as locked in an existential struggle against a malign and implacable enemy. They tend to treat negotiations as a futile distraction or a step that could undermine their political standing at home.\nTo even have a chance at overcoming such obstacles, mediation requires sustained and continuous efforts by a highly capable team. That means assembling a group of individuals whose primary job is ending the conflict and who have professional expertise and deep knowledge of its history and dynamics. Mediation also often involves more than one third party. Successful processes have featured a lead mediator working alongside supporting states or organizations. France, Germany, Italy, Russia, and the United Kingdom formed the contact group that backed the U.S.-led negotiations that ended the Bosnian war in 1995. Chile, Cuba, Norway, and Venezuela all played a role in the 2016 talks that concluded the Colombian government’s half-century war with the Revolutionary Armed Forces of Colombia (known by its Spanish acronym, FARC). In Ukraine, by contrast, Washington has largely gone it alone. European allies, Gulf partners, and Turkey have been involved, but only at the margins.\nAt minimum, European governments, as major stakeholders in both Ukraine’s future and the security of the continent, should be involved as parties to the talks. Given their deep mediation expertise, they should cosponsor the process alongside Washington. Europe is not short of officials with relevant experience. Jonathan Powell, the British government’s chief negotiator during the Good Friday talks, now serves as the British national security adviser. Washington could enable European participation by establishing a contact group—perhaps modeled on the body that supported the Bosnian peace agreement—in which key European governments hold defined roles and responsibilities, not merely observer status. Such a structure would achieve greater diplomatic coherence and help marshal resources, expertise, and political support as required.\nDESIGN MATTERS\nThere is no standard template for a successful negotiation. Bu", "translation_ja": "", "vocab": [{"word": "mediation", "definition": "紛争当事者間の解決を促進するための第三者による調停活動。国際紛争や交渉の文脈でよく使用される。"}, {"word": "envision", "definition": "将来の状況や結果を心の中で具体的に思い描くこと。ビジョンを持つまたは想像する意味。"}, {"word": "protracted", "definition": "長期間にわたって継続する、または長く引き延ばされた状態を表す。紛争や交渉の文脈で頻出。"}, {"word": "coherence", "definition": "複数の要素がまとまりのある統一的な全体を形成する状態。政策や戦略の一貫性を指すことが多い。"}, {"word": "implacable", "definition": "説得や交渉で和らげることができない、容赦ない敵対者や態度を表す。譲歩の余地がない状態。"}, {"word": "marshal", "definition": "資源や支援を組織し結集させること。軍隊を配置する以外に、権力や影響力を集約する意味で使用される。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-15 21:06 JST";
  renderTabs();renderList();
})();
</script>
