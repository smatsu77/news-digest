ple have been killed after a magnitude 7.7 earthquake struck Indonesia early on Saturday, the nation's disaster mitigation agency has said.\nThe official death toll has been rising as a search and rescue operation gets under way. The National Disaster Management Agency (BNPB) said several people had been injured to varying degrees.\nHundreds of buildings in the region have been damaged by the quake and the dozens of aftershocks that followed.\nThe quake struck the island of Flores shortly before 05:00 local time on Saturday (22:00 GMT on Friday). It had a depth of 15km, Indonesia's meteorology and geophysics agency stated.\nThe shallower an earthquake is, the more destructive its effects on the surface tend to be.\nAftershocks included a magnitude 6.4 earthquake in North Sumatra, located in western Indonesia, at a depth of 163km, BNPB announced. The US Geological Survey measured it at magnitude 6.9.\nVideo taken at the port in Maumere showed large chunks of concrete breaking off the terminal building onto passengers waiting to board an inter-island ferry. Some were thrown into the sea when the gangway to a ship collapsed.\nEmanuel Melkiades Laka Lena, governor of East Nusa Tenggara province, told a news conference that they were killed in their sleep by collapsing rubble.\nArnold Welianto, who lives in Talibura, a village near the coastline in Sikka, East Nusa Tenggara, said he was awoken by the \"very strong shaking\".\n\"I was startled awake and immediately went to my child's room.\"\nHe told the BBC that many people had already fled into the hills.\n\"Some other residents were standing along the roadside because the sea had also receded,\" he explained.\n\"The water remained low for quite some time, so everyone panicked and ran - I went around to the community health centre, and the people there had already been evacuated.\"\nA tsunami warning was issued but lifted around three hours after the initial jolt, when no significant sea level rise was detected.\nA stream of people could be seen moving inland on motorbikes after authorities issued a tsunami warning. BNPB said 2,000 people had evacuated or relocated on their own.\nManggarai province is among the most affected areas, the disaster agency added.\nIt said 24 fatalities had been recorded there, 17 in East Manggarai province, three in Sikka province, and at least one in each of the Ngada, Ende and West Manggarai provinces.\nAt least two others had been seriously injured and 11 slightly injured.\nWelianto said many residents of Talibura were choosing to remain outdoors as the aftershocks meant they were afraid to return to their homes.\nYulian Juita Ekalia, a university lecturer from Ruteng, a city to the west of the epicentre, said she had dragged her stove outside and was cooking there for fear of further tremors.\n\"I have never felt an earthquake this big,\" she told news agency AFP. \"It felt like we were on a trampoline - it was really scary.\"\nIt will take time to assess the full extent of the destruction in the region, which is remote and mountainous.\nPreliminary reports indicated more than 150 houses had been severely damaged, as well as dozens of educational institutions, and a number of healthcare facilities, places of worship, offices, and several other public facilities. The BNPB said aid was being sent to the affected areas.\nIt also advised people to remain calm, and to stay away from coastal areas and structures showing signs of damage.\nIndonesia is prone to earthquakes and volcanic activity, lying along the meeting point of three major tectonic plates.\nGet in touch\nHave you been affected? If it is safe to do so share your experiences\n- If you are in Indonesia you can get in touch here", "translation_ja": "", "vocab": [{"word": "mitigation", "definition": "損害や危害を軽減すること。災害対応の文脈では、被害を減らすための予防的措置や対応策を指します。"}, {"word": "epicentre", "definition": "地震の震源。地表面において地震の揺れが最も強い中心点を意味します。"}, {"word": "receded", "definition": "引き潮のように後退すること。この記事では、津波警報時に海水が陸地から離れて out 3km (1.8 miles) from the border, the majority of whom were from sub-Saharan Africa.\nMoroccan police - including some in riot gear - reportedly used tear gas to disperse groups of migrants gathered on nearby hills.\nEarlier this week, Morocco's government said it was monitoring \"the circulation of social media posts and messages of unknown origin\" calling for a mass crossing on Saturday, and warned that it would prosecute organisers and participants.\nSecurity at the breakwater entrance was \"10 times stronger than the previous day\", Spanish newspaper El País reported.\nMorocco had dispatched army officers, navy speedboats and drones to the border on Saturday, it said.\nMadrid meanwhile deployed more than 1,500 security officers to patrol the area.\nSpain has also installed a metal fence and a floating barrier following last month's influx.\nThe crisis had calmed since breaking out in late July, but it has sparked tensions between EU nations which share open borders as well as criticism of the Spanish government.\nItaly suspended the 29-member Schengen arrangement of free movement with Spain and introduced border checks on arrivals from Spain.\nItaly was backed by Finland and Denmark, while the Czech Republic called for Spain's membership to be temporarily suspended.\nSpain reacted angrily, with Prime Minister Pedro Sánchez noting Ceuta was not part of the Schengen area - and the migrants, therefore, had not arrived on the Spanish mainland and could travel to any other European country.\nIt urged Italy to drop its border controls - and introduced its own when Rome refused, citing the possibility of a new influx on 15 August.\nOn Saturday, Italy's Foreign Minister Antonio Tajani said his country had been afraid of a \"risk of a new wave of arrivals in Ceuta\".\n\"We're not waging any kind of 'battle' against Spain; we're simply carefully controlling arrivals,\" he said.\n\"Instead of worrying about us, Spain should worry about Morocco: that's where the problems are coming from, certainly not from our controls.\"", "translation_ja": "", "vocab": [{"word": "intercepted", "definition": "進路を遮って止める、途中で捕捉する。ここでは当局が移民の越境を途中で阻止したという意味で使用されている。"}, {"word": "exclave", "definition": "本国から分離された領土飛び地。スペイン本土から離れたセウタのような領域を指す。"}, {"word": "influx", "definition": "大量の流入、押し寄せ。短期間に多くの人々や物が流れ込む現象を表す。"}, {"word": "Schengen arrangement", "definition": "ヨーロッパ内の国境管理を廃止し自由な移動を認める協定。EU加盟国間の国境チェックを撤廃する制度。"}, {"word": "suspension", "definition": "一時的な停止、中断。イタリアがスペイン間の自由移動を一時的に止めた。"}, {"word": "dispersed", "definition": "散らす、分散させる。警察が集団を周囲に広がらせた。"}]}, {"title_ja": "イスラエルの南部レバノン空爆で11人が殺害、当局が発表", "title_en": "Eleven killed in Israeli strikes on southern Lebanon, authorities say", "summary_ja": "イスラエル軍がレバノン南部で空爆を実施し、アンサル町の民間人を含む11人が殺害されました。これは6月の停戦合意以来、最も死傷者が多い日の一つとなっています。イスラエル軍はヒズボラの大隊指揮官を標的にしたと主張していますが、民間人がその場所にいたことを認めています。この事件はレバノン指導部からの非難を招き、脆弱な停戦枠組みに対する緊張を高めています。", "summary_en": "Israeli forces conducted strikes on southern Lebanon that killed eleven people, including civilians in the town of Ansar, marking one of the deadliest days since a June ceasefire agreement. Israel's military claimed it targeted a Hezbollah battalion commander but acknowledged that civilians were present at the site. The incident has drawn condemnation from Lebanese leaders and raised tensions over the fragile ceasefire framework.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4gjygx4gjeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Eleven killed in Israeli strikes on southern Lebanon, authorities say\n- Published\nEleven people have been killed in Israeli strikes in southern Lebanon, authorities say, in one of the deadliest days of attacks since an agreement aimed at reducing hostilities was announced in June.\nLebanon's prime minister said seven people were killed in a strike on a house on the outskirts of Ansar, 70km (43 miles) south of the capital, Beirut. State media reported three children and two women were among the dead.\nIsrael's Defense Forces (IDF) said it had killed a commander of Hezbollah - the Iran-backed Shia militia - following an attack against Israeli soldiers.\nThe commander's family \"who he used as human shields\" were present and \"harmed\", it added.\nLater on Saturday, another round of strikes hit the town of Deir al-Zahrani, killing four and wounding five others, the Lebanese ministry of health said.\nLebanese authorities say the strike in Ansar at around 04:30 (01:30 GMT) occurred where displaced families were living. Footage on social media shows large plumes of smoke permeating through the streets of the village as sirens ring out.\nLebanon's Prime Minister Nawaf Salam condemned the attacks, saying the seven civilians killed were not \"military infrastructure\".\n\"Israel must halt this escalation,\" he said. \"For the security of our people and their right to life on their land are not subject to negotiation or bargaining.\"\nThe IDF said the incident that prompted its strike on Ansar had taken place in the Ali al-Taher Ridge, a strategic high ground overlooking much of south-eastern Lebanon and one of the war's most fiercely contested positions.\nA later IDF statement said Ali Samir al-Haj Hassan, who it described as a Hezbollah battalion commander in the Radwan Force unit, had been killed.\n\"Alongside him, several additional terrorists who were involved in advancing terror attacks against IDF soldiers were eliminated,\" it added.\n\"The strike was specifically directed at Hassan, who was a lawful target under international law, not at his family members who he used as human shields - hiding alongside them inside the military HQ,\" the IDF said.\nThe office of Israeli Prime Minister Benjamin Netanyahu also issued a statement, defending the IDF strike.\nIt said the Hezbollah attack had seriously injured three soldiers and the response had struck \"the Hezbollah terror headquarters which ordered the attack\".\n\"Only later did the IDF learn that Hezbollah deliberately put civilians in that military compound,\" the statement added, before saying \"Hezbollah is willing to do anything, including using its own civilians as human shields, to falsely accuse Israel of deliberately targeting civilians, which the IDF clearly did not\".\nHezbollah dismissed Netanyahu's \"false claims\" and said Lebanese civilians \"were deliberately targeted in their homes, many of whom were reduced to human remains, followed by claims that the locations were military sites\".\nLebanon was drawn into the war between Israel, the US and Iran on 2 March, when Hezbollah - the armed group affiliated with Iran - launched rockets into Israel in retaliation for a strike that killed Iran's supreme leader.\nIsrael responded by launching a bombing campaign across Lebanon and invading a significant part of the country's south. Its forces continue to occupy roughly 5% of Lebanese territory.\nThe June ceasefire framework calls for Hezbollah to disarm, Israeli forces to withdraw gradually from southern Lebanon and the Lebanese army to deploy across the area.\nLebanon's President Joseph Aoun condemned the Israeli strikes that had killed an entire family in Ansar and its \"repeated violations\" of the framework, which he said sent a \"clear message\" to the US-led negotiations.\nHezbollah was not involved in the agreement and has rejected direct negotiations.\nThe IDF says it will continue to remove threats to Israeli citizens and soldiers operating in the security zone - the 10km-deep military buffer in southern Lebanon occupied by Israel.\nDespite a reduction in fighting following the June agreements, Israeli strikes and demolitions in southern Lebanon have continued.\nLebanese and Israeli negotiators are set to meet for an eighth round of negotiations in September, but a final date has not been set.\n  - Published6 August", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や対立が段階的に激化することを意味します。この記事ではレバノンの首相がイスラエルに対してこの軍事的エスカレーションを停止するよう求めています。"}, {"word": "disarm", "definition": "武装を解除する、武器を放棄することを意味します。停戦枠組みではヒズボラが武装解除することが求められています。"}, {"word": "buffer", "definition": "紛争の当事者間に設置される中立地帯や安全地帯を指します。ここでは南部レバノンのイスラエル占領地域が説明されています。"}, {"word": "cease-fire", "definition": "敵対行為を一時的または永続的に停止する合意を意味します。この記事では6月に発表された停戦合意が繰り返し言及されています。"}, {"word": "framework", "definition": "協定や制度の基本的な構造や枠組みを指す用語です。停戦交渉における規則や原則の総体を表しています。"}, {"word": "contested", "definition": "複数の団体が支配や所有を争っている状態を意味します。アリ・アル・タヘル丘陵は戦争で最も激しく争奪されている地域として説明されています。"}]}, {"title_ja": "首相、ケンブリッジ大学元教授ジェイソン・アーデイの死を「多くの側面での悲劇」と述べる", "title_en": "PM calls Jason Arday death 'tragedy on so many levels'", "summary_ja": "盗用スキャンダルを受けてケンブリッジ大学を辞職した41歳の元教授ジェイソン・アーデイが、ロンドン南部で金曜日に遺体で発見された。首相アンディ・バーナムは反省を呼びかけ、複数の公人が彼の死をメディアの激しい監視と学界の人種差別に帰した。家族は「誤った情報キャンペーン」が彼にとって耐えられなかったと述べた。", "summary_en": "Former Cambridge professor Jason Arday, 41, was found dead in south London on Friday following a plagiarism scandal that led to his resignation. Prime Minister Andy Burnham called for reflection, while multiple public figures attributed his death to intense media scrutiny and racism in academia. His family stated a 'campaign of misinformation' had been too much for him to bear.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c9982znvyk4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Jason Arday death 'tragedy on so many levels' says PM\n- Published\nAndy Burnham has described the death of former Cambridge professor Jason Arday as \"a tragedy on so many levels\", as he called for a \"moment for reflection\".\nArday was found dead at an address in Battersea, south London, on Friday afternoon.\n\"It's not a moment for any rushing to judgement. It's a moment for reflection, I would say, reflecting on how things came to this,\" the prime minister told broadcasters during a visit to Cornwall.\nIn a statement issued by his publisher Simon & Schuster UK, Arday's family said they were \"in shock to have lost this amazing father, partner, brother, uncle and son\".\nThey said a \"campaign of misinformation\" had been too much for him.\n- Analysis: Jason Arday's death will send shockwaves through a divided academia \n  - Published7 hours ago\n- Jason Arday, ex-Cambridge professor at centre of plagiarism row, found dead \n  - Published19 hours ago\nArday, 41, resigned as a Cambridge professor of sociology of education last week after allegations of plagiarism and questions about some of his achievements. He had denied the claims.\nA friend told the BBC Arday had described feeling \"destroyed\" and had told him his authorisation to travel to the US had been revoked.\nEamonn McCrystal, who became his friend at St Mary's University, Twickenham, tried to reassure him what he was going through would pass, but Arday replied \"it does not feel like it will.\"\nMcCrystal told the BBC \"He was the nicest person. So kind and such a gentle soul.\n\"We shared an office at university, when I set up the student radio station, and he used to speak on the station a lot.\"\n\"I'm in shock, I can't believe it.\"\nThe University of Cambridge vice-chancellor Prof Deborah Prentice led the tributes, saying the faculty was \"desperately saddened\" to learn of his death.\n\"Our heartfelt sympathies go to Jason Arday's family and friends at this incredibly difficult time,\" she added.\nEducation Secretary Lucy Powell said she was \"deeply shocked and saddened\" and urged people to \"remember there are real people with loved ones involved\".\nMayor of London Sir Sadiq Khan said Arday was subjected to unrelenting media scrutiny.\nHe said he had faced \"an unacceptable public hounding and campaign of abuse\" and was the victim of \"a pernicious public shaming\".\n\"His death was a tragedy, but once again it should be a wake up call for all of us,\" he posted on X.\nA donation page, set up by Windrush campaigner Sir Patrick Vernon, has raised more than £10,000 to help cover funeral costs for Arday's family.\n\"Today should be about compassion, dignity and solidarity with a grieving family,\" Vernon wrote.\n\"Jason's life was bigger than the controversy that surrounded his final weeks.\"\nA vigil will be held on Monday evening on the steps of the National Gallery in Trafalgar Square, held by the organisation Stand Up To Racism.\nThe group's co-convenor, Weyman Bennett, said Arday's death \"was the result of a racist witch hunt\".\nJo Grady, general secretary of the University and College Union, said the \"level of harassment he suffered and the racism he was subjected to has been sickening\" and \"must be investigated\".\nLord Paul Boateng, who became the UK's first black cabinet minister in 2002, told BBC Newsnight he was \"horrified, shocked and deeply saddened\".\n\"Racism in academia is a fact of life and needs to be addressed,\" he added in a written statement.\nIn a statement on Saturday, National Education Union general secretary Daniel Kebede said Arday had been subjected to \"a public and brutal takedown that unleashed a tirade of racism\".\n\"The effect has been chilling. It tells black people and others from underrepresented backgrounds that entering prominent public positions will make you a target,\" he said.\nProf Simon Baron-Cohen, director of the Autism Research Centre at the University of Cambridge, told BBC Radio 4's Today programme Arday had been \"bombarded by every media outlet to paint him as a fraud\".\n\"He was an incredibly, kind and gentle and caring man,\" he said.\nHe spoke to Arday the morning of his death, and said the academic had felt unable to leave the house.\n\"He has experienced what he described as a campaign against him, for the last three years,\" he previously told BBC News.\n\"What he was saying to me was 'they've destroyed my life' - it's not clear who they were but I think he was referring to the media.\n\"The personal attacks on him have been so immense.\"\nSpeaking to BBC Newsnight, Professor of Black Studies Kehinde Andrews, a friend of Arday, described him as \"very down\" after resigning from Cambridge.\n\"He was very upset. He felt that there was no way out. He effectively wasn't leaving the house. He had lost a lot of weight,\" Andrews said.\n\"There should be a wakeup call to just how bad black academics actually have it in academia.\"\nLabour MP Bell Ribeiro-Addy also told the programme \"the idea that an academic would be dragged through this amount of media scrutiny is unheard of\".", "translation_ja": "", "vocab": [{"word": "plagiarism", "definition": "他人の著作物を自分のものとして無断で使用すること。学術的には最も重大な不正行為とみなされ、キャリアを終わらせる可能性がある。"}, {"word": "scrutiny", "definition": "厳密で注意深い検査や調査。特に公人や有名人が受ける詳細で批判的な注目のこと。"}, {"word": "misinformation", "definition": "事実ではない、または不正確な情報。故意に広められることもあり、公衆を混乱させるために使用される。"}, {"word": "harassment", "definition": "誰かを繰り返し嫌がらせすること。言葉や行動による継続的な攻撃や脅迫を指す。"}, {"word": "pernicious", "definition": "狡猾で有害な、特に目に見えない形で悪い影響を及ぼすこと。社会的影響が深刻な悪意を意味する。"}, {"word": "witch hunt", "definition": "無実の人々を罰することを目的とした不公正な調査またはキャンペーン。根拠のない非難と迫害を指す。"}, {"word": "chilling effect", "definition": "人々が恐怖や抑止力のために正当な権利や活動を控えるようになること。その文脈では、黒人や少数派が公的地位を求めることを躊躇させる現象。"}]}, {"title_ja": "アーデイ教授の死が分裂した学界に衝撃を与える", "title_en": "Arday's Death to Send Shockwaves Through Divided Academia", "summary_ja": "ケンブリッジ大学最年少の黒人教授ジェイソン・アーデイが、学術論文の盗用疑惑と経歴に関する疑問の精査を受けた数ヶ月後に亡くなった。彼の死は、人種差別の可能性があると指摘される大きな論争に先立つものである。この事件は、研究基準、多様性、有色人種の学者への扱いをめぐる学界の深い分裂を露呈させた。", "summary_en": "Jason Arday, Cambridge's youngest black professor, has died following months of scrutiny over his academic work and personal narrative. His death comes after plagiarism allegations and questions about his research integrity sparked a highly publicized controversy that some attribute to racial bias. The incident has exposed deep divisions in academia over research standards, diversity, and the treatment of academics of color.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr59jg1ypd3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Analysis: Jason Arday's death will send shockwaves through a divided academia\n- Published\nJason Arday's death - described as unexpected and not suspicious - will send shockwaves through UK universities and beyond.\nWhen he was appointed as professor of sociology of education in 2023 Arday was the youngest black professor at Cambridge and the university publicly celebrated his background.\nBarely one per cent of professors at UK universities are black, so he was joining a small and highly visible minority in academia.\nHis appointment, in the wake of Black Lives Matter and debates about de-colonising the curriculum, drew worldwide attention.\n- Jason Arday death 'tragedy on so many levels' says PM \n  - Published3 hours ago\n- Jason Arday, ex-Cambridge professor at centre of plagiarism row, found dead \n  - Published19 hours ago\nJason Arday had beaten what would have been an impressive international field of candidates to a top job in a university ranked in the global top 10.\nHowever, in July 2026 questions about the quality of his academic research, which some had raised privately with him, broke into the open.\nThese included an allegation that parts of his first major piece of research, a PhD awarded by Liverpool John Moores University, were plagiarised. In other words, it was suggested he had used the work of another academic without adequately crediting them.\nArday said this was untrue and Liverpool John Moores University said after a review that it stood by the quality of the research. Arday suggested any mistakes in attribution were due to his autism.\nNewspapers dissected Arday's previous work while at Durham and Glasgow universities, and on social media, academics were divided between those publicly championing the black autistic academic and those who said his work did not withstand analysis.\nRows about research rarely break through into national debate but this was Cambridge, an elite university whose history and reputation has been built on excellence in research, original thinking and academic integrity.\nFor many academics, including many at Cambridge, robust scrutiny of the integrity of research is a red line.\nSome wrote to the vice chancellor demanding an independent inquiry because they felt the reputation of the university was at stake.\nThere was another reason this row had such a high profile. Arday was a celebrity academic known as much for the remarkable life story he told, of an autistic child who didn't speak until 11, or learn to read and write until 18.\nOther aspects of his personal narrative came under scrutiny, and he had to clarify that £5m raised for charity had been as part of a group effort, and that a 600 mile running challenge had taken twice as long as originally claimed.\nSome who had signed a public letter of support quietly removed their names.\nBy the time he resigned his Cambridge position last week Arday said the \"relentless accusations\" had taken a \"profound toll\" on him and his family.\nHe suggested they had been racially motivated.\nThere are many unanswered questions which a coroner will no doubt be expected to consider about his circumstances and state of mind in the days before his death.\nIn the immediate aftermath of his death, his family said Arday had been subjected to a \"campaign of misinformation\" that was too much for this \"gentle man\".\nOthers think that he attracted so much scrutiny because he was a black man in a prominent position.\nSir Sadiq Khan, the mayor of London, said Arday had been \"the victim of a pernicious public shaming that other people in his position simply wouldn't have faced. His death was a tragedy, but once again it should be a wake up call for all of us.\"\nThere has been deep unease among some academics of colour who feel the ferocity of the debate was due to Arday being a young black academic.\nProfessor of Black Studies Kehinde Andrews, a friend of Arday, told Newsnight in the wake of his death: \"This is not just something that has happened in the past two weeks, we've seen the stories, this goes back three and a half years.\n\"The very day he got the position at Cambridge he had a Freedom of Information request asking about his credentials. He had all the right-wing people in America and the UK writing in to see if he was credible.\n\"Some people didn't believe a black man should be in that position at Cambridge.\n\"It's been a three-and-a-half-year toll which has come its head now.\"\nWhat is certain is that Arday had sought to defend his reputation, using a high-profile firm of lawyers to send a letter to a journalist from Times Higher Education who first questioned his work.\nThe University of Cambridge initially robustly defended Arday then announced an investigation into his appointment and tenure amid growing disquiet.\nIn 2023, as an elite university which had been criticised for a lack of diversity, Cambridge had been keen to make some high-profile non-white appointments. It had already made a huge effort to ensure admission of students was more diver", "translation_ja": "", "vocab": [{"word": "plagiarism", "definition": "他の著作物から無断で引用または盗用すること。学術的には最も重大な不正行為の一つであり、適切な引用なしに他人の作品や考えを自分のものとして提示する行為を指す。"}, {"word": "integrity", "definition": "誠実さと道徳的原則を持つ性質。学術文脈では、研究の正確性、透明性、および倫理的基準を守ることを意味する。"}, {"word": "scrutiny", "definition": "厳密で詳細な調査や検査。通常は注意深く、時には批判的な目で何かを検討することを指す。"}, {"word": "tenure", "definition": "大学教員が解雇から保護される雇用制度。通常は一定期間の試験期間後に与えられ、学問の自由と雇用の安定を保証する。"}, {"word": "diversity", "definition": "様々な背景、特性、視点を持つ人々の存在。組織や機関における人口統計的な多様性と包括性を指す。"}, {"word": "attribution", "definition": "著作物や思想が特定の人物に帰属することを明記すること。学術的には、参考文献や引用を通じて情報源を正確に示す必要がある。"}]}, {"title_ja": "UK全域の火災サービスが圧倒的な負荷に直面、数千人が帰宅できず", "title_en": "UK Fire Services Overwhelmed as Major Incidents Declared Across Country", "summary_ja": "過去48時間で11件の大規模火災と金曜日以来43件の新規山火事が発生し、UK全域の消防サービスが極度の負荷下にある。ウェストミッドランズ、ハンプシャー、南ウェールズを含む複数の地域で大規模災害が宣言されている。退避した数千人の住民は帰宅時期が不明なままで、消防署長らは膨大な通報に対応できていないと報告している。", "summary_en": "Fire services across the UK are under extreme pressure following 11 major fires in 48 hours and 43 new wildfires since Friday, with major incidents declared in multiple regions including the West Midlands, Hampshire, and South Wales. Thousands of residents evacuated from their homes remain uncertain about when they can return, while fire chiefs report being unable to meet demand with control rooms receiving thousands of calls. Authorities are investigating the causes of the fires and urging the public not to speculate, with two arrests made on suspicion of arson.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwyjjvd4g0qo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Fire services stretched as residents still not home\n- Published\nEleven major fires in the past 48 hours and 43 new wildfires since Friday have left services under \"incredible pressure\", a fire boss has said.\nPhil Garrigan from the National Fire Chief's Council (NFCC) said major incidents had been declared across the UK, including in Stourbridge, Sandwell, Pershore and Stoke-on-Trent in the West Midlands, as well as in Hampshire and South Wales.\nMany residents forced to flee their homes following the fires are still in the dark about when they can return.\nIn Stourbridge, where 38 houses have been destroyed or damaged, frustrated residents said they were not getting any answers, although it was hope they may go home later on Saturday.\nWest Midlands Assistant Chief Fire Officer Simon Barry told residents the fire there was under control and they were just dampening down hot spots.\nHe said as far as the service was concerned, homes were no longer at risk and he hoped some residents whose homes had been unaffected would be able to move back on Saturday evening.\nIn a recorded online briefing, Dudley Council chief executive Balvinder Hera stressed residents should not return home until explicitly told they could do so.\nShe said decisions to reopen roads were being taken on a street-by-street basis, with the council working closely with emergency services.\nPolice were keen to hear from people with information or video footage that could assist inquiries and had asked the public not to speculate on the fire's cause, she said.\nAn online fund, external has been set up by the council to allow people to donate to those affected.\nWest Midlands Fire and Rescue Service was alerted to the large grass fire near Stourbridge Golf Club in the Racecourse Lane area just before 13:30 BST on Thursday.\nMore than 100 firefighters fought the flames across an area of 500 acres, with hotspots remaining on Saturday.\nJohn Moore was asked to leave his home on Osmaston Road as fire spread through grass and woodland about half a mile away.\nHe said he was now visiting the cordon four times a day to seek information.\n\"It's absolutely shocking. We can get no answers about when we can go back,\" he said.\nThe house he shares with his 86-year-old wife, who is partially bedridden, was not damaged, but he has only been permitted to visit it to pick up medication.\nMoore said: \"There's probably about 60 other people who are normally here by the side of me every day asking, 'can we go?'.\"\nSimon Tuhill from West Midlands Fire Service said 19 properties had been \"completely destroyed\", with a further 19 damaged.\nHe said specialist investigators were on the scene and working with police to try to \"triangulate down where the fire started\".\nOther residents who have lost everything gathered at a cordon at the corner of Worcester Road and Racecourse Lane, frustrated by the lack of information and not being allowed to see what had become of their homes.\nOne man told the BBC he had met Prime Minister Andy Burnham on Friday when he visited the region, saying Burnham had promised to personally intervene to help his family get their passports.\nA woman described suffering horrific flashbacks and claimed it had taken 40 minutes for a fire engine to respond to her emergency call.\nMeanwhile, A-level student Dominic Abdullah was forced to flee shortly after he had got his results on Thursday.\n\"I thought the day couldn't get any more big, any more significant,\" he said.\nA national government alert sent out by the government on Friday warned people not to light anything that might spark a fire.\nGarrigan said the NFCC had asked politicians to highlight the risks fire services were facing, with control room operators dealing with \"thousands and thousands of calls\".\nHe said services had been unable to immediately meet demand at points during the busiest 24-hour period from Thursday afternoon.\n\"They'd asked for maybe 10 additional appliances to come in nationally, and we weren't able to provide them with the full 10 in the first instance,\" he said.\nHe added firefighters were \"still seeing fires occur through maybe carelessness or deliberate action\".\nElsewhere in the West Midlands, in Goldenhill, Stoke-on-Trent, four homes in Sandyford were destroyed on Thursday, with other nearby properties damaged.\nMarie Leese escaped the fire with just her dog and her phone, but her beloved garden on Maureen Avenue was destroyed, including a summer house built by her husband before he died.\n\"It was like the scenes of the Blitz, just a blazing inferno, the flames were moving so quickly,\" she said.\n\"I feel fortunate that I've been allowed back, but the house across the road still has hotspots and is destroyed.\"\nShe said she was too terrified to sleep, because the neighbouring house \"keeps reigniting\".\nTwo people have been arrested by Staffordshire Police on suspicion of arson in connection with the incident.\nIn Clun, Shropshire, firefighters spent the night tackling a fire on Black Hill.\nAn e", "translation_ja": "", "vocab": [{"word": "triangulate", "definition": "複数の情報源から正確な位置や事実を特定する方法。調査において、異なる複数の地点や証拠から共通点を見つけることで、目標地点を確定させることを意味する。"}, {"word": "cordon", "definition": "警察や当局が危険地域に設置する警戒線や境界線のこと。立ち入り禁止区域を指定し、一般人の進入を防ぐために用いられる。"}, {"word": "appliances", "definition": "この文脈では、消防車などの消防設備・車両を指す用語。緊急対応に必要な機器や装置全般を表す。"}, {"word": "hotspots", "definition": "火災において、特に高温で火が再び燃え始める可能性がある局所的な地点。消火作業後も監視が必要な危険箇所を意味する。"}, {"word": "arson", "definition": "意図的に建造物や物質に火をつける犯罪行為。放火罪として法的に問われる重大な犯罪。"}, {"word": "speculate", "definition": "十分な証拠や情報がないまま推測や憶測をすること。ここでは火災の原因について根拠のない推測をしないよう警告している。"}]}, {"title_ja": "レバノン、イスラエルの空爆で11人が殺害されたと発表", "title_en": "Lebanon Says 11 Killed in Israeli Airstrikes", "summary_ja": "イスラエルの南レバノン空爆で土曜日に少なくとも11人が殺害され、約2ヶ月前の停戦合意以来の最大規模の攻撃となった。ヒズボラは「適切な」報復を誓い、平和交渉の継続に警告を発した一方、レバノン首相ナワフ・サラムは緊張の激化の終止を呼びかけた。空爆は停戦違反と6月下旬に調印された平和合意の実施をめぐる対立の中で行われた。", "summary_en": "Israeli airstrikes in southern Lebanon killed at least 11 people on Saturday, marking the deadliest attack since a ceasefire agreement nearly two months ago. Hezbollah vowed an \"appropriate\" response and warned against continued peace negotiations, while Lebanese Prime Minister Nawaf Salam called for an end to the escalation. The strikes targeted areas in southern Lebanon amid ongoing disputes over ceasefire violations and the implementation of a peace deal signed in late June.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/lebanon-says-11-killed-in-israeli-airstrikes/a-78383713?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Lebanon says 11 killed in Israeli airstrikes\nAugust 15, 2026\nAt least 11 people were killed when Israel launched fresh airstrikes in southern Lebanon on Saturday, the deadliest since the Israel-Hezbollah truce nearly two months ago.\nThe attacks were met with defiance by the Iran-backed Hezbollah, which demanded an end to \"humiliating\" peace negotiations with Israel.\nWhat do we know?\nThe Lebanese Health Ministry said one of the strikes, on the edge of the village of Ansar, killed seven people and wounded two.\nThe dead included three children and two women, according to the ministry.\nThe strike, which happened at dawn, hit a house and destroyed it, according to NNA, the Lebanese state news agency.\nGermany's DPA news agency cited residents as saying the property served as a base for Hezbollah.\nThe second strike hit the village of Deir al-Zahrani, killing four and wounding 17.\nNNA reported other strikes around the strategic Ali Taher hill, which overlooks parts of the southern city of Nabatiyeh and key roads to it.\nThe Israeli military confirmed hitting Hezbollah infrastructure in southern Lebanon, saying it was retaliation for an attack by the militia on Israeli forces.\nHezbollah vows revenge\nLater Saturday, Hezbollah hit back at the latest strikes, saying they would be met with an \"appropriate\" response.\nIsrael \"must clearly understand that its attacks, violations and attempts to impose a fait accompli cannot continue, and will be met with an appropriate response\", the Iran-backed group said in a statement.\nHezbollah warned Lebanese authorities against continuing its \"humiliating\" negotiations with Israel, which would provide \"the enemy with free concessions.\"\nLebanese Prime Minister Nawaf Salam denounced the strikes, calling on Israel to \"halt this escalation.\"\n\"The seven martyrs of the Israeli airstrike on the town of Ansar are not military infrastructure and the children and women killed were not military targets,” he wrote on X.\nCeasefire struggles to stick\nThe Israel–Hezbollah war reignited in early March around the start of the Iran war, when Hezbollah launched attacks on northern Israel to avenge the killing of Iran’s Supreme Leader, Ayatollah Ali Khamenei.\nIt rapidly became a full-scale conflict that involved Israeli ground operations in southern Lebanon, mass evacuations of residents and the deaths of over 4,300 people.\nIsrael claims to have established the so-called security zone in southern Lebanon to prevent Hezbollah attacks on northern Israel.\nAccording to Lebanese media, the Israeli-controlled area covers approximately 620 square kilometres, or about 6% of the country's total area.\nIsrael and Hezbollah have repeatedly accused each other of ceasefire violations following the announcement of a framework peace agreement in late June,\nThe deal lays out a plan for Israeli forces to withdraw from southern Lebanon, in return for Hezbollah laying down arms. It also envisions steps toward eventual peace.\nThe two sides have held seven rounds of talks; the most recent in Rome earlier this month.\nHezbollah refused direct talks, wasn't party to the deal and has refused to disarm.\nEdited by: Kieran Burke\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as yourPreferred Source on Google by clicking hereand hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "retaliation", "definition": "報復、反撃を意味する。ある行為に対する返礼として行われる行動を指す。"}, {"word": "ceasefire", "definition": "戦闘停止、休戦協定を意味する。紛争当事者間の武力衝突の中止に関する合意。"}, {"word": "infrastructure", "definition": "インフラストラクチャー、基盤施設を意味する。軍事・経済活動を支える基本的な施設や設備。"}, {"word": "fait accompli", "definition": "すでに成し遂げられた事実を意味する。後戻りできない状況を作ることを指す。"}, {"word": "disarm", "definition": "武装を解除する、兵器を手放すことを意味する。軍事力を放棄するプロセス。"}, {"word": "escalation", "definition": "エスカレーション、段階的な拡大や悪化を意味する。紛争や問題が徐々に深刻になること。"}]}, {"title_ja": "ドイツの気候危機：熱死が大規模抗議活動を引き起こさない理由", "title_en": "Germany's Climate Crisis: Why Heat Deaths Haven't Sparked Mass Protests", "summary_ja": "2026年夏のドイツで熱関連死亡と深刻な干ばつが記録されているにもかかわらず、気候活動主義は公衆の疲労と政府の不作為により大幅に減少している。ドイツ国民の80%が気候変動について懸念しているが、活動家はウクライナ戦争とガザ紛争などの他の緊急課題との競合に直面しており、気候政策はほぼ放置されている。", "summary_en": "Despite record heat-related deaths and severe drought in Germany during summer 2026, climate activism has significantly declined as public fatigue and government inaction discourage mass protests. While 80% of Germans worry about climate change, activists face hostility and competition from other pressing issues like the Ukraine war and Gaza conflict, leaving climate policy largely neglected.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/climate-action-doesn-t-seem-to-be-a-priority-for-germany-despite-heat-related-deaths-and-drought-why-aren-t-more-people-taking-to-the-streets/a-78374727?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "In Germany, record heat meets climate action fatigue\nAugust 15, 2026\nWhen Lars Werner of the \"Last Generation\" climate activist group glued himself to the road four years ago to protest for greater climate action, Germany had not yet seen 12,500 heat-related deaths (the 2026 toll, so far), or record temperatures across Western Europe, and fully loaded ships were still navigating the Rhine without difficulty.\n\"Of course, I could say 'I told you so,' because it was foreseeable and comes as no surprise whatsoever,\" Werner told DW.\n\"The fact is, even back then, I was constantly explaining in my presentations that the Rhine would eventually run dry during hot summers and that this would have an incredible impact on the economy.\"\nThis summer, entire villages have been evacuated due to forest fires, farmers are expected to lose about 3 million metric tons of grain and rapeseed to drought, and hospital patients and the elderly in nursing homes are facing an acute threat to their lives in buildings with no air conditioning.\nBut so far, the federal government has remained astonishingly quiet. Despite the crisis, it has still not convened a \"heat summit.\"\n\"It is utterly irrational for the federal government to resort to tinkering with regulations — such as lifting the Sunday ban on truck traffic — in the hope of somehow scraping by without implementing a comprehensive climate protection policy for the long or even short term,\" said Werner.\nFridays for Future finds it difficult to motivate people\nThe government no longer has to worry about \"Last Generation\" protesters calling out its inaction by setting up road blockades. The climate activists halted their protests two years ago, worn down by hostility, fines and prison sentences. Now, the task of fiercely criticizing political decision-makers on climate policy falls primarily to the Fridays for Future Germany (FFF) movement.\n\"The federal government is doing virtually nothing when it comes to effective climate policy. Instead, various 'pseudo-solutions' are being promoted — such as dredging the Rhine to make it deeper or lifting the Sunday driving ban for trucks,\" FFF spokesperson Linda Kastrup told DW. She deplores what she sees as short-term fixes for the symptoms of the climate crisis, and notes that effectively nothing sustainable is being done.\nOnly a few hundred protesters turned out for a demonstration outside the chancellery in Berlin a week ago. It was a far cry from the protests in 2019, prior to the COVID-19 pandemic, when hundreds of thousands of people took to the streets to demand climate action.\nA recent study by the Bertelsmann Foundation found that 80% of people in Germany are worried about climate change, and more than 50% want to see more government spending on climate protection. But that doesn't mean they're take to the streets.\nKastrup isn't surprised.\n\"When Chancellor Friedrich Merz completely dismisses and ignores climate policy — when we see tens of thousands of heat-related deaths in Germany alone yet not a single word is said about it — it inevitably leaves people with the impression in their private lives that climate protection doesn't matter. Naturally, that makes it very difficult to motivate people to take to the streets,\" she said.\nIn addition, there has been a rise in hateful speech directed at climate activists on social media.\n\"Two days ago, I posted a reel and within a very short time, there were 2,000 hateful comments on it,\" said Kastrup.\nFocus has shifted to Ukraine, Gaza\nSebastian Haunss, a political science researcher at the University of Bremen, said it's surprising that the scorching summer of 2026 has not led to climate protests. He finds it remarkable that on the one hand, more and more people in Germany are installing solar power systems, but on the other, they take vacations on environmentally damaging cruise ships.\n\"A strong counter-position has emerged,\" he said. \"Specifically, political actors like the AfD [the far-right populist Alternative for Germany Party — Editor's note] are pursuing an agenda that opposes climate protection regulations. Such actors — whether at the international or national level — did not exist just a few years ago.\"\nAlso, Haunss pointed out that large organizations like Fridays for Future have been replaced by a vast number of local groups, who operate largely out of the public eye. However, he believes a pivotal event could bring people back onto the streets in large numbers at any moment.\n\"Then there is the competition for attention; the COVID pandemic and the war in Ukraine pushed the climate issue out of the spotlight, and current economic concerns also play a major role,\" said Haunss, adding that many of those who took to the streets against climate change a few years ago are now focusing on different topics.\n\"In some cases, their issues have shifted, and other topics — such as the war in Gaza and solidarity with Palestine — have moved to the forefront.\"\nA divided government\nGerman Environ", "translation_ja": "", "vocab": [{"word": "fatigue", "definition": "長期間の努力や困難な状況による精神的・感情的な疲労状態。ここでは気候変動対策への関心や行動意欲の低下を指す。"}, {"word": "inaction", "definition": "何らかの対応や行動を取らないこと。政府が必要な政策を実施しない状態を表す。"}, {"word": "deplore", "definition": "強い不満や遺憾の意を示すこと。何かが起きているのを悪いと感じて、明確に批判する。"}, {"word": "irrational", "definition": "論理的でない、理屈に合わないという意味。感情や根拠のない判断に基づいている状態を指す。"}, {"word": "pivotal", "definition": "極めて重要で、物事の流れや決定を大きく左右する決定的な。転機となる出来事や瞬間を表す。"}, {"word": "divergence", "definition": "異なる方向に分かれること、相違が生じること。複数の意見や行動が別々の方向に向かう状態。"}]}, {"title_ja": "歴史的ハリケーン接近、ハワイ州が非常事態宣言", "title_en": "Hawaii Under State of Emergency as Historic Hurricane Approaches", "summary_ja": "トロピカルストーム・ララがハリケーン強度に発達する中、ハワイ島は1871年以来初のハリケーン脅威に直面している。ジョシュ・グリーン知事は金曜日に非常事態宣言を発令し、当局は直接上陸しなくても生命を脅かす洪水、地滑り、危険な高波の可能性を警告している。", "summary_en": "Hawaii's Big Island faces its first hurricane threat since 1871 as Tropical Storm Lala approaches hurricane strength. Governor Josh Green declared a state of emergency Friday, with authorities warning of life-threatening flooding, mudslides, and dangerous surf conditions that could impact the islands even without a direct landfall.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/hawaii-under-state-of-emergency-ahead-of-historic-hurricane/a-78382001?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Hawaii under state of emergency ahead of historic hurricane\nAugust 15, 2026\nResidents on the Big Island of Hawaii, which gives its name to the volcanic US Pacific archipelago, are preparing for a potentially historic weather situation with a tropical storm gathering hurricane-level strength as it approaches.\nThe US Oceanic and Atmospheric Administration's (NOAA) National Hurricane Center (NHC) on Friday said Lala, a powerful tropical storm at the moment, should be at hurricane strength by the time it approaches the Big Island on Saturday.\nHawaii Governor Josh Green, who called the storm \"enormous,\" declared a state of emergency on Friday in an effort to make sure the state and its counties \"have sufficient resources to clear debris, secure infrastructure and take other measures to prepare.\"\nCurrently, a hurricane warning is in effect for Hawaii County, which covers the Big Island. The islands of Maui, Molokai and Kahoolawe to its northwest are under a tropical storm warning.\nShould the storm make landfall as expected, it would be the first time the Big Island has been hit by a hurricane since 1871.\nThe storm is expected to bring winds, rainfall and heavy surf, spurring government and residents to prepare for the worst.\nShelters have already been set up and residents encouraged to remain vigilant and get themselves and their families to safe spaces before they become trapped.\nWhat if Lala doesn't make landfall?\nExperts say a direct hit is not necessarily the concern here, with meteorologist Vanessa Almanza of the National Weather Service (NWS) in Honolulu cited by the Associated Press as saying: \"It doesn't take landfall to create destruction. A lot of the impacts are felt outside of the hurricane.\"\nThe National Hurricane Center predicts 8 to 12 inches (20.3 to 30.5 centimeters) of rain across Maui and the Big Island this weekend, with maximum totals as high as 25 inches (63.5 centimeters) in some Big Island locations.\nThe NHC also warned that the storm could bring \"life-threatening flooding and mudslides, especially in areas of steep terrain,\" as well as dangerous storm surges and ocean swells, \"likely to cause life-threatening surf and rip current conditions.\"\nConditions trigger fear of floods and fires\nAs of Friday afternoon, Lala was located about 275 miles (440 kilometers) east-southeast of South Point, Hawaii, according to the NHC.\nData showed the storm had maximum sustained winds of 65 miles per hour (100 kilometers per hour) and was moving toward the west-northwest at 14 miles per hour. The wind-speed threshold for a Category 1 hurricane is 74 miles per hour.\nBeyond fear of flooding, which the island of Oahu experienced in March, dry and windy weather has increased fear of wildfires as the storm picks up pace.\nIn 2023, the Maui town of Lahaina burned during extreme winds caused by a hurricane passing by far to the south.\nPointing to 1992's Hurricane Iniki as a tale of warning\nThe last hurricane to make landfall on the archipelago was Iniki, a category 4 storm, in 1992 — also an El Nino year.\nOn Friday, Governor Green reminded residents that Iniki made landfall after changing its path, \"so we just can never know if a storm is going to turn.\"\nWhile urging vigilance, Green said: \"It did $3 billion (€2.6 billion) in damage. It destroyed thousands of homes and it did kill six people.\"\nGreen implored residents: \"If you feel now that your house doesn't have a great roof or might not be able to withstand hurricane force winds, then first things first you go to a family or friend's house and you kind of hunker down there.\"\nThe southern end of Hawaii is remote and rural but its affordability has attracted a growing population, some of whom live off-grid in unpermitted structures.\n'Prepare, don't wait' say authorities\nOn neighboring Oahu, Honolulu Mayor Rick Blangiardi said Friday: \"I am asking everyone to finish your preparations today. Don't wait for the weather to deteriorate. Stay informed, stay away from dangerous areas and make sure your family knows what to do if conditions worsen.\"\nResidents were encouraged to clean gutters and drains, clear any hanging branches or debris from yards and seal their doors, with emergency services adding, \"Stay away from beaches and coastal areas where rough surf and rip currents could sweep you away.\"\nThis year's Pacific Ocean El Nino has already attained temperatures so high that when it peaks between October and December NOAA says there is a 69% chance of a \"historic event that would exceed the strength of previous El Nino events dating back to 1950.\"\nThe natural climate pattern occurs when ocean surface temperatures in the central and eastern Pacific become unusually warm. This tends to fuel hurricane activity in the Pacific while retarding it in the Atlantic.\nEdited by: Saim Dušan Inayatullah\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hi", "translation_ja": "", "vocab": [{"word": "landfall", "definition": "ハリケーンなどの熱帯暴風雨が陸地に到達すること。予報や被害評価の重要な転機となる気象現象。"}, {"word": "sustain", "definition": "ある状態や速度を継続・維持すること。ここでは風速が一定レベルを保つことを意味する。"}, {"word": "retard", "definition": "何かの進行や活動を遅延させたり阻害したりすること。科学的文脈で使用される中立的な用語。"}, {"word": "vigilant", "definition": "危険や問題に備えて注意深く警戒する状態。防災や安全管理の文脈でよく用いられる。"}, {"word": "infrastructure", "definition": "社会や産業の基盤となる道路、電力網、通信網などの施設・システムの総称。"}, {"word": "attribution", "definition": "何かの原因や責任を特定の事象・人物に帰することや割り当てること。"}]}, {"title_ja": "ハリケーン・ララがカテゴリー1に発達、ハワイに接近", "title_en": "Hurricane Lala Approaches Hawaii as Category 1 Storm", "summary_ja": "ハリケーン・ララは中太平洋を移動する中、カテゴリー1に勢力を強めました。土曜日にはハワイ島に到達する見込みです。住民は接近するハリケーンの影響に備えるよう呼びかけられています。", "summary_en": "Hurricane Lala has intensified to Category 1 status while moving through the central Pacific Ocean. The storm is expected to reach Hawaii's Big Island on Saturday. Residents are advised to prepare for potential impacts from the approaching hurricane.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/tropical-storm-lala-forecast-impact-hawaiian-islands-weekend/story?id=135610026", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース・ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース・ライブは、世界中の速報ニュースと生放送イベントを24時間体制でカバーしています。同プラットフォームは、主要なニュースがリアルタイムで展開される際に、最新の情報を視聴者に提供します。", "summary_en": "ABC News Live provides continuous, around-the-clock coverage of breaking news and live events from around the world. The platform delivers real-time updates on major stories as they develop, keeping viewers informed on the latest developments in news and current events.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "インドネシア東部でマグニチュード7.7の地震後、2番目の地震が発生", "title_en": "Second Earthquake Strikes Indonesia Following Magnitude 7.7 Quake", "summary_ja": "米国地質調査所（USGS）によると、インドネシア東部沖でマグニチュード7.7の強い地震が発生しました。初期の地震の後、この地域で2番目の地震が発生しています。当局は余震と津波リスクの可能性を監視しています。", "summary_en": "A powerful magnitude 7.7 earthquake struck off the coast of eastern Indonesia, according to the U.S. Geological Survey. A second earthquake has since hit the region in the aftermath of the initial quake. Authorities are monitoring the situation for potential aftershocks and tsunami risks.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/2-dead-after-powerful-77-earthquake-strikes-off/story?id=135664681", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジンバブエのボート事故で22体が追加で回収、死者は68人に", "title_en": "Twenty-two more bodies recovered after Zimbabwe boat accident, death toll reaches 68", "summary_ja": "火曜日にザンビアとの国境にあるカリバ湖でフェリーが転覆し、68人が死亡しました。これはジンバブエの海難事故では最悪とされています。船は定員90人の船に119人以上が乗船していた過負荷状態で、強風の中で転覆しました。生存者は転覆前にドライバーに警告していたと報告しています。", "summary_en": "A ferry capsized on Lake Kariba in Zimbabwe on Tuesday, killing 68 people including 18 children in what is believed to be the country's deadliest maritime disaster. The vessel was overloaded with 119 passengers and crew when it capsized during heavy winds, though it was only authorized to carry 90 people. Survivors reported warning the ferry driver about water entering the boat before it turned over.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/15/more-bodies-recovered-after-zimbabwe-boat-accident", "state_media": false, "category": "経済", "full_text": "Twenty-two more bodies have been recovered after a boat accident in Zimbabwe, taking the death toll to 68, police said on Saturday.\nThe ferry capsized on Tuesday on Lake Kariba, on the border with Zambia. An investigation has suggested it was overloaded when it turned over during heavy winds.\nEighteen children were among the people killed, Zimbabwe’s police said, in what is believed to be the country’s deadliest such disaster.\nMost of the passengers are believed to be villagers and fish traders who lived around the lake.\nOfficials said the vessel was authorised to carry 90 people but was packed with 114 adults, five crew members and an unspecified number of children.\nLt Col Joseph Muchechesi, commander of the boat regiment involved in the search operation, said: “So far today we have managed to take 22 bodies. We are confident that we will manage to retrieve all the bodies.”\nThe civil protection unit said on Wednesday that 77 people had been rescued.\nHundreds of people gathered at the district hospital in the lakeside town of Kariba to identify the bodies of their relatives and loved ones.\nA public memorial service was held in Kariba, nearly 280km (175 miles) north-west of the capital Harare, on Thursday before the burials started.\nSurvivors said they pleaded with the ferry driver to turn back as the vessel had begun taking on water soon after departing.\nChance Siyamavhu, 45, told Agence France-Presse: “Thank God that a wave pushed the sinking vessel and we managed to climb on top.\n“When the boat capsized, most of the people scrambled to get the lifejackets but most of them did not even know how to use them.\n“Most people could not make it.”\nLake Kariba is the world’s largest manmade lake by volume. It stretches more than 200km (124 miles) and is up to 40km (25 miles) wide in places.\nIt was created in the 1950s during British colonial rule, when the Zambezi River was dammed, displacing about 57,000 people.\nIn 2014, 26 people, 24 of them children, drowned in Zambia’s part of the lake, when the boat meant to transport them to independence day celebrations capsized.\nOn the Zimbabwean side, five passengers drowned in a 2021 incident.", "translation_ja": "", "vocab": [{"word": "capsized", "definition": "ボートや船が転覆することを意味します。急激な風や波によって船が横転し、沈没する状況を表します。"}, {"word": "overloaded", "definition": "乗り物や容器が許容量を超えて積載されている状態を指します。安全基準を超える重量や人数が詰め込まれていることを意味します。"}, {"word": "manmade", "definition": "人工的に作られたもの、特に自然を改変して人間が建設したものを指します。自然の湖ではなく、ダムなどで人工的に作られた湖などに用います。"}, {"word": "displacing", "definition": "人々を元の場所から移住させることを意味します。ダム建設などの開発により、住民が居住地から強制的に移動させられることを表します。"}, {"word": "civil protection unit", "definition": "災害や緊急事態に対応する公的機関を指します。人命救助や被害管理を行う政府の専門部門を意味します。"}]}, {"title_ja": "モロッコ警察、セウタへの侵入を試みた移民111人を逮捕", "title_en": "Moroccan police arrest 111 migrants attempting to enter Spanish territory of Ceuta", "summary_ja": "モロッコ当局は、セキュリティが強化される中、スペイン領セウタへの侵入を試みた移民111人（主にサハラ以南のアフリカ出身）を逮捕した。この逮捕は2週間前の大規模な越境事件に続くもので、その時は少なくとも96人が死亡し、72,000人以上の移民がセウタに流入していた。スペインとモロッコは、8月15日の大規模越境を呼びかけるソーシャルメディア投稿を受けて、国境のセキュリティを大幅に強化している。", "summary_en": "Moroccan authorities arrested 111 people, mostly sub-Saharan African migrants, as they attempted to cross into Spain's Ceuta enclave amid heightened security measures. The arrest follows a mass crossing two weeks earlier that killed at least 96 people and saw over 72,000 migrants surge into the territory. Both Spain and Morocco have significantly reinforced border security after social media calls for another mass crossing scheduled for August 15.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/15/moroccan-police-arrest-more-than-100-people-as-they-attempt-to-enter-ceuta", "state_media": false, "category": "社会", "full_text": "Moroccan police have arrested 111 people as they tried to enter Spain’s north African territory of Ceuta, amid tightened security on both sides after social media posts called for another mass crossing.\nThe attempted crossing on Saturday came two weeks after more than 72,000 migrants surged into Ceuta, causing tensions within the EU and prompting anti-immigration rhetoric among far-right parties worldwide. At least 96 people died trying to reach European soil.\nA source in Morocco’s interior ministry told news agency Reuters that those detained included 109 migrants from sub-Saharan Africa and two Moroccan citizens arrested in or around Fnideq, the Moroccan city near Ceuta.\nMoroccan police used teargas to disperse groups of migrants gathered on hills about 1.9 miles (3km) from the border, according to Spanish news agency EFE. Reuters later saw hundreds of police officers, some in riot gear and others in plainclothes, returning from the hills outside Fnideq.\nEFE and Spanish state broadcaster TVE said Morocco’s interior ministry ordered their journalists to leave Fnideq immediately, without providing an explanation.\nIn Ceuta, Spanish soldiers guarded supermarkets while police patrolled the main streets. The city was calmer than in the days after the deadly crossing attempt on 30 July.\nMadrid has since installed a maritime barrier and deployed more than 500 additional police officers from mainland Spain, raising the total in Ceuta to more than 1,600. The interior ministry said the reinforcements would remain for as long as needed.\n“We’ll continue to deploy whatever personnel are necessary to restore normality as soon as possible and prevent events like those of 30 July from happening again,” Spain’s interior minister, Fernando Grande-Marlaska, said on Thursday.\nAbout 5,000 migrants remained in Ceuta, the minister added. Reuters saw hundreds sheltering from scorching heat under makeshift bamboo shelters on the urban beach of El Trampolin.\nGrande-Marlaska said migrants who entered irregularly would not be allowed to stay in the territory, travel to mainland Spain or obtain legal status, except in rare cases involving extreme vulnerability. Those without a right to remain would be returned to Morocco, he added.\nEarlier this week, Rabat said it was monitoring “the circulation of social media posts and messages of unknown origin” calling for a mass crossing on 15 August, warning it would prosecute organisers and participants.\nA Reuters witness saw reinforced security near the border, including police vans with wire shields and road checkpoints. Local media reported similar measures near Melilla, another Spanish territory in north Africa.\nAuthorities prevented several groups from boarding trains and buses to northern Morocco in cities such as Casablanca, Fez and Kenitra. However, witnesses told Reuters that some migrants from sub-Saharan Africa were bypassing security checkpoints by taking mountain routes towards Fnideq.\nOne witness said the schools in Fnideq had been turned into accommodation for security forces deployed near the border.", "translation_ja": "", "vocab": [{"word": "surge", "definition": "急激に、また大量に押し寄せることを意味する動詞。ここでは移民が一気に流入した状況を表現している。"}, {"word": "reinforce", "definition": "強化する、補強するという意味の動詞。セキュリティや人員を増やして対応を強化することを指す。"}, {"word": "disperse", "definition": "散らす、分散させるという意味の動詞。警察が群衆を追い散らす際に使用される。"}, {"word": "enclave", "definition": "周囲と異なる特性を持つ領土や地域を指す名詞。セウタはスペイン領土がモロッコ内に位置する飛び地である。"}, {"word": "tighten", "definition": "より厳しくする、強化するという意味の動詞。セキュリティ対策をより厳格にすることを示す。"}, {"word": "prosecute", "definition": "起訴する、告発するという意味の動詞。違反行為に対して法的措置を取ることを指す。"}]}, {"title_ja": "ニジェールで拉致されたアメリカ人宣教師、9ヶ月後に解放される", "title_en": "American Missionary Kidnapped in Niger Released After Nine Months", "summary_ja": "アメリカの宣教師パイロット、ケビン・リデアウト（50歳）は、10月にニジェール首都ニアメで拉致された後、解放されました。トランプ大統領は彼の解放に関与したと主張し、リデアウトが米国の管理下にあり健康状態は良好だと述べました。リデアウトは事件前の19年間、ニジェールで宣教師として働いていました。", "summary_en": "Kevin Rideout, a 50-year-old American missionary pilot, has been released after being kidnapped in Niger's capital Niamey in October. President Trump claimed credit for securing his release, stating that Rideout is now in US custody and in good health. Rideout had been working as a missionary in Niger for 19 years before his abduction by three armed individuals.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/14/american-missionary-kevin-rideout-niger-released-kidnapping", "state_media": false, "category": "社会", "full_text": "An American missionary who was kidnapped in Niger in October has been released, his organisation has said.\nServing in Mission International said Kevin Rideout “is in good health in the care of US officials” and would soon be reunited with his extended family.\nDonald Trump, who claimed to have helped secure Rideout’s release, later said he was “back in United States Custody” on Friday.\nThe 50-year-old missionary pilot was kidnapped in the west African country’s capital, Niamey, on 21 October by three armed individuals and was probably driven out of town, according to a security official at the time. No armed group claimed responsibility for the abduction. Other details about his rescue remain unknown.\nThe US president’s administration had made the release of Rideout a priority in its latest strategy on African Sahel states, after years of fighting extremism found limited success. Rideout had been working in Niger for 19 years as a missionary before the incident.\n“I am proud to announce that Kevin Rideout, a wonderful Christian Missionary, is back in United States Custody,” Trump wrote on his Truth Social platform on Friday. “Kevin, the United States of America looks forward to welcoming you HOME. Glad to have helped!”\nNiger has long been the target of attacks by armed groups, including jihadis linked to al-Qaida and Islamic State. A “continually deteriorating security situation” across the country was cited by the military junta that took power in 2023 when deposing the democratically elected president, Mohamed Bazoum.\nThe new authorities ousted western partners, including the US, which had soldiers in Niger, and forged a new security and diplomatic alliance with Russia. One former US base has since been occupied by Russian soldiers.\nTrump described the broader region of west Africa as “the epicenter of Islamist terrorism” in his social media post on Friday, claiming there had been “more deadly attacks in the past year” there than anywhere else on Earth.\nWashington has since shifted its focus to coastal west African states including Benin, Côte d’Ivoire and Ghana, sharing intelligence with local security personnel to prevent extremist threats from spilling southwards from the arid Sahel.\nHowever, the insurgency continues to escalate in the region. In Niger, data from Acled, the armed conflict data aggregator, shows that civilian fatalities rose by nearly 50% in the year after Bazoum was ousted.\nCities and urban centres in the Sahel region have also been increasingly targeted by armed non-state actors as the crisis reaches new dimensions.\nThe US embassy in Niamey issued a security alert a day after Rideout’s abduction, warning that American citizens “remain at a heightened risk of kidnapping throughout Niger, including in the capital city”.\nIn June, more than 30 people were killed when gunmen attacked the main airport in Niamey. It was the second attack this year at the airport, a strategic hub that serves as the ruling military’s command, hosting its air force base and most of its drones and aircraft. It is also the headquarters of the Alliance of Sahel States, the regional alliance that brings together troops from Niger, Mali and Burkina Faso.\nIn April, Mali’s defence minister, Gen Sadio Camara, was killed in his home on the outskirts of the capital Bamako during coordinated assaults staged by insurgents including the west African affiliate of al-Qaida.\nAssociated Press and Agence France-Presse contributed reporting", "translation_ja": "", "vocab": [{"word": "abduction", "definition": "誘拐や拉致のこと。人を無理やり連れ去る行為を指します。特に犯罪的な文脈で使われます。"}, {"word": "junta", "definition": "クーデターで権力を奪った軍事政権のこと。正統な政府に代わって権力を行使する軍事グループを意味します。"}, {"word": "escalate", "definition": "状況や問題が段階的に悪化・拡大すること。緊張が高まったり、紛争が激化する場合に使われます。"}, {"word": "insurgency", "definition": "政府に対する武装反抗や反乱活動のこと。組織的な反政府勢力による活動を指します。"}, {"word": "deteriorating", "definition": "状況が悪くなること、劣化すること。セキュリティや条件などが次第に悪化する場合に用いられます。"}, {"word": "strategic hub", "definition": "戦略的に重要な中心地のこと。軍事や政治上で重要な役割を果たす場所を意味します。"}]}, {"title_ja": "カリフォルニア州、複数の山火事に対処する中、消防士の人員不足が深刻化", "title_en": "California Battles Multiple Wildfires as Firefighter Workforce Faces Strain", "summary_ja": "カリフォルニア州は、ビッグサー地域のティンバーファイアを含む複数の大規模な山火事に対処している。このファイアは4,655エーカーを焼いており、現在までに12%しか鎮火していない。連邦の野生地火災消防士たちは低賃金と劣悪な労働条件に加えて、トランプ政権下での予算削減により数千人のポストが廃止されたことで苦しんでいる。週末にかけて高温乾燥した気候と強風がさらに状況を悪化させると予想されている。", "summary_en": "California is tackling multiple large wildfires, including the Timber Fire at Big Sur that has burned 4,655 acres with only 12% containment. Federal wildland firefighters are struggling with low pay, poor conditions, and recent budget cuts under the Trump administration that have eliminated thousands of positions. Hot, dry weather and strong winds are expected to worsen the situation through the weekend.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/gallery/2026/8/15/california-tackles-multiple-wildfires-as-firefighter-workforce-faces-strain?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "In Pictures\nCalifornia tackles multiple wildfires as firefighter workforce faces strain\nThe federal wildland firefighting workforce, faced with low pay and cost of living issues, copes with Trump-era cuts.\nFirefighters in the western United States and Canada are working to contain multiple wildfires, including one that erupted along California’s rugged Big Sur coastline.\nThe state’s wildland firefighting agency Cal Fire said in an update on Saturday that the Big Sur blaze, nicknamed the Timber Fire, is currently burning across 4,655 acres (1,884 hectares). Only 12 percent of the fire is contained so far.\nOfficials have indicated that hot, dry weather across the western part of North America has helped to fuel the blazes, displacing thousands of residents.\nWith the Timber Fire, Cal Fire noted the wind also presents a factor in the outdoor conditions.\n“Any morning clouds along ridges and east of the fire should erode quickly with winds increasing in the afternoon,” Saturday’s update reads. “A warming and drying trend is predicted through the weekend and into next week.”\nState parks in the area have been closed, and authorities have issued evacuation orders for portions of Highway 1, a famous road that traces the California coast, attracting visitors from around the world.\nThe Big Sur section of Highway 1 offers some of the state’s most stunning views, with sheer drops into the sea and a 24-metre (79-foot) waterfall tumbling from a cliff to the beach below.\nAcross the state, on the border between California and Nevada, firefighters are also working to contain the fast-moving Bug Fire near the city of Reno. So far, it has consumed about 93,381 acres (37,790 hectares) and is 58 percent contained, according to Cal Fire.\nWashoe County Sheriff Darin Balaam stated in a news conference earlier this week that the fire had prompted the displacement of at least 4,000 people, including the evacuation of a memory care facility.\nFirefighters are facing increasing strain in recent years as the blazes they battle have grown larger and more destructive due to climate change.\nShifting politics have also had an effect on the federal firefighting workforce.\nThe National Federation of Federal Employees (NFFE), a labour union, said in a statement on Friday that budget cuts and layoffs imposed under President Donald Trump have heaped uncertainty onto the beleaguered workforce.\nThe union referenced the actions undertaken by the Department of Government Efficiency (DOGE), an initiative Trump pursued during his second term to slash the federal government.\n“In the middle of fire season, DOGE and the Trump administration’s policies and actions have weakened our ability to safely fight wildfires,” NFFE National President Randy Erwin said.\n“DOGE recklessly cut more than 6,000 [US Forest Service] workers, thousands of them qualified wildland firefighters, and the Trump administration now threatens pointless relocations or terminations of many more, including shuttering 57 of 77 research labs critical to fire preparedness and response.”\nWhile working conditions among firefighters can vary widely by agency and status, advocates say federal wildland firefighters have long faced poor pay and benefits, compounding the stress of their often life-threatening jobs.", "translation_ja": "", "vocab": [{"word": "beleaguered", "definition": "困難に直面している、苦しんでいる状態を表す形容詞。ここでは予算削減と過酷な労働環境に苦しむ消防士の職場を描写するために使用されている。"}, {"word": "recklessly", "definition": "無謀に、深く考えずに行動することを表す副詞。ここでは意思決定に対する批判的な表現として、慎重さを欠いた行動を指している。"}, {"word": "compounding", "definition": "悪化させる、複合的に増加させることを意味する動詞。ここでは複数の要因が組み合わさってストレスを増幅させる状況を説明している。"}, {"word": "displacement", "definition": "強制的に立ち退かさせられる状態、または移動させられることを表す名詞。山火事によって住民が避難を余儀なくされた状況を指す。"}, {"word": "preparededness", "definition": "準備ができている状態、防災体制が整った状態を表す名詞。火災への対応能力や予防的な準備体制を指している。"}]}, {"title_ja": "米国大使の追放を求めるカナダの請願署名が17万1000件を超える", "title_en": "Canadian Petition to Expel US Ambassador Surpasses 171,000 Signatures", "summary_ja": "米国のピート・ホークストラ大使の追放を求めるカナダの請願署名が17万1000件を超え、下院での議論に必要な500件を大幅に上回った。請願書はホークストラ大使がトランプの物議を醸す政策を支持する公開声明でカナダ・米国の外交関係を損なわせていると非難している。署名数の多さは、トランプの関税とカナダへの米国の圧力増加に対するカナダの不満の高まりを反映している。", "summary_en": "A Canadian petition calling for the expulsion of US Ambassador Pete Hoekstra has exceeded 171,000 signatures, far surpassing the 500 needed for House of Commons discussion. The petition accuses Hoekstra of undermining Canada-US diplomatic relations through public statements supporting Trump's controversial policies. The massive signature count reflects growing Canadian discontent with Trump's tariffs and increased US pressure on the nation.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/15/canadian-petition-to-expel-us-ambassador-gains-over-170000-signatures?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Canadian petition to expel US ambassador gains over 170,000 signatures\nThe petition set to be discussed by Canada’s House of Commons in the latest sign of discontent with President Donald Trump’s policies.\nAn official petition before Canada’s House of Commons has gained thousands of signatures in support of the expulsion of the United States ambassador, Pete Hoekstra.\nThe signature tally, as of Saturday, surpassed 171,000, far exceeding the 500 needed for the petition to be discussed before Canada’s legislature.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Trump takes economic message to Michigan amid dwindling popularity\n- list 2 of 3Japan turns to Canadian crude as Asia feels Hormuz supply pinch\n- list 3 of 3Trump administration refunds $100bn in tariffs struck down by Supreme Court\nThe effort underscores the simmering discontent in Canada with the administration of US President Donald Trump.\nThe petition accuses Hoekstra of “repeatedly making public statements undermining Canada-US diplomatic relations”.\nHoekstra has defended Trump’s pledge to make Canada “the 51st” US state, and last year, he accused Canadian officials of seeking to interfere in US elections.\nThose remarks came in response to advertisements funded by the Ontario government criticising Trump’s tariff policies, which have disproportionately targeted Canada. Hoekstra warned that Canada cannot “expect that there will be no consequences or reaction” from the US following the ads.\nThe petition also pointed to reported ties between Hoekstra and the founder of an application used by separatists in Calgary to rally support for their movement. Hoekstra has previously denied any ties between the Trump administration and the separatists.\nThe petition makes three demands of the Canadian government. First, it calls on the House of Commons to “formally declare Pete Hoekstra persona non grata and request his removal as US Ambassador to Canada”.\nSecond, it pushes for cross-border talks on “the pattern of conduct by Ambassador Hoekstra inconsistent with the Vienna Convention on Diplomatic Relations”, a 1961 international treaty on diplomacy.\nThe third demand is that the Canadian government “direct a parliamentary committee to review US diplomatic interference in Canadian domestic affairs”.\nThe petition was authorised by Elizabeth May, the leader of the Green Party and its only current member in the House of Commons, after being put forward by Calgary resident Leanne Walker.\nIn Canada, any citizen can organise a petition for an issue to be addressed by the House of Commons. Residents and citizens must provide their province and territory and postal code, as well as a phone number, to participate in the petition.\nSuch petitions can stay open for up to 120 days. The petition to expel Hoekstra was introduced on July 21.\nReaching the 500-signature threshold requires that the issue be brought before the House of Commons, which must give an official response within 45 days.\nThe petition, however, is non-binding, and it remains unclear how much traction it would ultimately gain among members of Canada’s Parliament.\nStill, the mass of signatures is the latest indication of entrenched discontent in Canada towards Trump’s policies, which include a push to assert greater US influence over the entire Western Hemisphere.\nIn recent months alone, several areas of friction have emerged. In July, Trump imposed new 50 percent tariffs on certain Canadian goods, claiming “discriminatory treatment” in trade relations.\nIn response, Canada cancelled a celebration ceremony for the new Gordie Howe International Bridge, which links Windsor, Ontario, with Detroit, Michigan. The bridge’s opening was itself cast in doubt, after Trump pushed for a greater US stake in the project, undertaken by Michigan and Canada.\nTrump also threatened more tariffs last month in response to wildfires across Canada, blaming it for poor air quality south of the border.\nA Pew Research survey in June found that Canadians’ views of the US as a reliable partner had plummeted.\nIn 2022, 83 percent of Canadians rated the US as reliable. By 2026, just 35 percent held that view. The same poll found that 16 percent of Canadians in 2022 explicitly rated the US as “not reliable”. That proportion climbed to 65 percent this year.", "translation_ja": "", "vocab": [{"word": "persona non grata", "definition": "外交関係において、受け入れ国から受け入れられない人物として宣言されたステータス。この場合、カナダはホークストラ大使をカナダで受け入れられない人物として公式に宣言することを要求している。"}, {"word": "simmering discontent", "definition": "表面には表れていないが、水面下で続いている不満や怒り。トランプ政策に対するカナダ国民の継続的で潜在的な反発を指す。"}, {"word": "Vienna Convention on Diplomatic Relations", "definition": "1961年に締結された国際条約で、外交官の権利と義務、および受け入れ国と派遣国の関係を規定している。外交官の行動の基準となる国際法。"}, {"word": "non-binding", "definition": "法的な強制力がない、または拘束力がないことを意味する。この請願は議会で討論されるが、その結果を実行する法的義務がないことを示す。"}, {"word": "entrenched discontent", "definition": "深く根付き、しっかり確立された不満。カナダ国民の間でトランプ政策への反発が根深く、継続的になっていることを意味する。"}, {"word": "traction", "definition": "進捗、支持、または影響力を得ること。この文脈では、請願がカナダの議会メンバーの間でどれほどの支持を得るかの可能性を指す。"}]}, {"title_ja": "モロッコ警察、セウタ飛び地へ向かう移民を拿捕", "title_en": "Moroccan Police Intercept Migrants Heading for Ceuta Enclave", "summary_ja": "フニデク地区のモロッコ治安部隊は、スペイン領セウタへの移民流入を阻止するための作戦を強化している。緊張関係が続く中、タラハル国境地域への警備強化により、一時的な落ち着きが取り戻されている。", "summary_en": "Moroccan security forces in Fnideq have intensified operations to prevent migrants from crossing into the Spanish enclave of Ceuta. Despite ongoing tensions, heavy security deployment in the Tarajal border region has temporarily stabilized the situation.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/15/moroccan-police-intercept-migrants-heading-for-ceuta-enclave?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Moroccan Police Intercept Migrants Heading for Ceuta Enclave\nNewsFeed\nMoroccan Police Intercept Migrants Heading for Ceuta Enclave\nMoroccan Police Intercept Migrants Heading for Ceuta Enclave Security forces in Fnideq have stepped up operations to prevent migrants from crossing into the neighboring Spanish enclave of Ceuta. Despite heightened tensions, heavy security presence in the Tarajal border region has restored a temporary calm.\nPublished On 15 Aug 2026", "translation_ja": "", "vocab": [{"word": "intercept", "definition": "移動中の物や人を途中で捕捉・阻止すること。ここでは国境検問で移民を引き止める行為を指す。"}, {"word": "enclave", "definition": "周囲を他の領土に囲まれた領土の一部。セウタはモロッコ領土内にあるスペイン領土である。"}, {"word": "heightened tensions", "definition": "高まった緊張状態。国家間または集団間の対立や不和が増加した状態を表す。"}, {"word": "security presence", "definition": "安全保障のための武装した人員や機関の配置。秩序維持のため当局が目に見える形で配置すること。"}, {"word": "stepped up operations", "definition": "活動や行動の規模・頻度を増加させること。ここでは警察の取締りを強化する意味。"}]}, {"title_ja": "ミャンマー、30万人以上のロヒンギャ難民の本人確認完了、帰還準備へ—難民危機が9年目に", "title_en": "Myanmar Verifies Over 300,000 Rohingya Refugees for Repatriation as Crisis Enters Ninth Year", "summary_ja": "ミャンマーの軍事政権は、バングラデシュのキャンプにいる30万人以上のロヒンギャ難民をラカイン州の旧住民として確認したと発表し、治安が改善されれば帰還を受け入れると約束した。2017年の軍事作戦で70万人以上が避難したロヒンギャ危機は9年目を迎え、ミャンマー国内の紛争と治安悪化により帰還計画は停滞している。", "summary_en": "Myanmar's military government announced it has verified over 300,000 Rohingya refugees in Bangladesh camps as former residents of Rakhine state, promising to accept their return once security improves. The Rohingya crisis has persisted for nine years since the 2017 military crackdown that displaced over 700,000 people, with repatriation plans stalled due to ongoing conflict and poor security conditions in Myanmar.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/myanmar-says-over-300000-rohingya-refugees-verified-for-repatriation-as-exodus-enters-ninth-year/article71350651.ece", "state_media": false, "category": "政治", "full_text": "Myanmar's military-backed government said on Saturday (August 15, 2026) that more than 3,00,000 Rohingya refugees living in camps in Bangladesh are former residents of western Rakhine state and that it will accept their return once security conditions improve.\nThe Ministry of Foreign A
