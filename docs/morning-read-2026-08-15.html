ffairs statement comes as the Rohingya refugee crisis enters its ninth year, with hundreds of thousands of refugees still living in camps in Bangladesh after fleeing Myanmar in August 2017 when the military launched a crackdown following attacks by a Rohingya insurgent group on guard posts in Rakhine.\nThe operation drove more than 7,00,000 Rohingya across the border into Bangladesh, joining hundreds of thousands of others already living there for decades in the wake of waves of previous violence perpetrated by Myanmar's military.\nThe scale, organisation and ferocity of the operation led to accusations of ethnic cleansing and genocide from the international community, including the UN.\nMyanmar, formerly known as Burma, does not recognise the Rohingya as one of the country's 135 lawful ethnic minorities, instead referring to them as Bengalis to imply they are natives from Bangladesh and are illegally settled in Myanmar.\nMyanmar said it had verified 4,26,545 of the 8,28,824 refugees on a list provided by Bangladesh as of the end of July, and determined that 3,08,797 of those verified were former residents of Rakhine.\nThe Ministry of Foreign Affairs said 113,507 people could not be verified and that 4,241 people were found to have been involved in what it called terrorist activities.\nThe statement said it will continue working with Bangladesh to receive verified former residents when the security situation in Rakhine becomes more stable.\nThe ministry also rejected claims that more than 1 million people were displaced from Rakhine, saying that more than 5,40,000 people crossed into Bangladesh after the violence in 2017 while more than 2,00,000 remained in northern Rakhine.\nMyanmar and Bangladesh agreed to a two-year repatriation process in 2018. However, security in Myanmar worsened following an army takeover in 2021 that ousted the elected government of Aung San Suu Kyi, triggering widespread armed resistance. Plans to repatriate the refugees have not succeeded.\nThe renewed chaos brought about by fighting between the Rakhine-based ethnic Arakan Army group and the military over control of the region in 2023 forced more refugees to flee toward Bangladesh and elsewhere in a desperate move to save their lives. The Arakan Army controls much of Rakhine after capturing territory from the military in recent years.\nIn recent years, poor conditions in refugee camps, steep cuts to foreign aid and the lack of safe prospects for returning to Myanmar have led to an increasing number of Rohingya refugees attempting to make the dangerous ocean crossing to Malaysia and Indonesia on rickety boats.\nMalaysian Prime Minister Anwar Ibrahim said in late July that Myanmar had agreed to take back 5,000 Rohingya refugees currently living in Malaysia as part of a repatriation programme.\nHowever, an official from Myanmar's foreign ministry, Han Win Aung, told The Associated Press at the time that the repatriation program was focused solely on verified Myanmar nationals currently held in detention centres in Malaysia and rejected reports that the government would accept Rohingya.\nPublished - August 15, 2026 11:44 pm IST", "translation_ja": "", "vocab": [{"word": "ethnic cleansing", "definition": "特定の民族集団を特定地域から排除する行為。国際法では重大な人権侵害と見なされ、ジェノサイド（大量殺害）と区別される概念である。"}, {"word": "insurgent", "definition": "政府に対して武装抵抗を行う反政府勢力のメンバー。クーデターや反乱を起こす者を指す。"}, {"word": "repatriation", "definition": "難民や国外にいる人々を本国に帰す、または帰国させるプロセス。通常は国家間の協議に基づいて行われる。"}, {"word": "ferocity", "definition": "激しさ、猛烈さを表現する名詞。暴力や攻撃の強度や容赦なさを形容するのに使用される。"}, {"word": "stalled", "definition": "進展が止まった、停滞した状態を表す。プロジェクトや交渉などが動かなくなった時に用いられる。"}, {"word": "ousted", "definition": "権力から追放される、追い出される。権力者が強制的に地位から排除された場合に使用される。"}]}, {"title_ja": "ウクライナがロシア南西部サマラ地域の軍事施設への長距離攻撃を強化", "title_en": "Ukraine Intensifies Long-Range Strikes on Russian Industrial Sites in Samara", "summary_ja": "ウクライナはロシア・サマラ地域の大規模攻撃を実施し、国産のフラミンゴミサイルを使用してロスコスモス傘下の宇宙センターとサバスレイカ空軍基地を700～900キロメートルの距離から攻撃した。ゼレンスキー大統領は、これらの攻撃はロシアの軍事インフラに具体的な損害を与え、戦争の影響をロシア国民に実感させることを目的としていると述べた。ウクライナは今年、長距離攻撃を大幅に増加させており、ロシアはより広い地域に防空システムを配置することを余儀なくされている。", "summary_en": "Ukraine conducted a large-scale attack on Russia's Samara region, hitting the Progress Centre space facility and Savasleyka air base using domestically produced Flamingo missiles from 700-900 kilometers away. President Zelenskyy stated the strikes aim to inflict concrete damage on Russian military infrastructure and make Russians feel the consequences of the war. Ukraine has dramatically increased long-range attacks this year, forcing Russia to stretch its air defenses across a wider area.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/ukraine-attacks-russias-samara-industrial-site-as-kyiv-ramps-up-long-range-strikes/article71350605.ece", "state_media": false, "category": "社会", "full_text": "A large-scale Ukrainian attack struck industrial infrastructure in Russia's southwestern Samara region Saturday (August 15, 2026), a Russian official said.\nIvan Noskov, head of the region's capital, Samara, said air defence forces had repelled a “massive” missile attack, with “localised damage” to the city's industrial sites. He also said that medical assistance had been provided to those injured in the attack, but did not give further details.\nUkraine has stepped up its long-range aerial attacks on Russian military industries and energy facilities, aiming to cut Moscow's revenue for the war and make Russians feel the consequences of the invasion, now in its fifth year.\nPresident Zelenskyy says need for peace has to be felt in Russia\nWriting on social media, Ukrainian President Volodymyr Zelenskyy said that Kyiv's forces had carried out a strike against Samara's Progress Centre, which operates under the Russian space agency Roscosmos and is involved in producing rocket technology and electronics.\nHe said that the strike used Ukraine's domestically produced Flamingo missiles to hit the site, which is approximately 900 kilometres from the Ukrainian border.\nMr. Zelenskyy also said Russia's Savasleyka air base, some 700 kilometres from the front line, had also been hit.\n\"Peace is needed, and this must be evident in Russia — through concrete damage to specific facilities,\" Mr. Zelenskyy wrote.\nWhile most of Ukraine's strikes have a range of less than 200 kilometres, its longer-range attacks have increased dramatically this year. It launched three times as many of those strikes in July as it did in January, according to data from ACLED, an independent conflict monitor. Repeatedly hitting deep into Russia has forced its military to stretch air defences over a larger area.\nRussia's Ministry of Defence said Saturday (August 15) that it had shot down 598 Ukrainian drones over 19 Russian regions, as well as the Black and Azov Seas and the annexed Ukrainian peninsula of Crimea.\nSeparately, two people, including a nine-year-old child, were wounded when a Ukrainian drone attack hit a private home in the town of Shatura in the Moscow region, local official Andrey Vorobyov said.\nChild killed in drone strike\nElsewhere, a Russian strike on an apartment block in southeastern Ukraine on Saturday (August 14) killed a three-month-old baby and wounded 11 people, local officials said.\nDrones hit the building in the town of Marhanets, said Oleksandr Hanzha, head of the Dnipropetrovsk Regional Military Administration.\nRussia's Ministry of Defence also said that it had targeted warehouses and infrastructure at the Ukrainian ports of Odesa, Izmail and Yuzhnyi.\nUkraine's Air Force said that Russia launched 152 drones over the country Saturday (August 15), of which 124 were destroyed.\nPublished - August 15, 2026 11:09 pm IST", "translation_ja": "", "vocab": [{"word": "repelled", "definition": "攻撃や侵入を撃退する、または拒否することを意味します。軍事的な文脈では、敵の攻撃を防いだり跳ね返したりすることを指します。"}, {"word": "infrastructure", "definition": "国や地域の経済や社会の基盤となる構造物やシステム全体を指します。橋、道路、発電所、通信網などが含まれます。"}, {"word": "annexed", "definition": "ある国や領土が別の国に一方的に併合または領有されることを意味します。国際法上、正当性が争われることが多いです。"}, {"word": "dramatically", "definition": "急激に、大幅にという意味の副詞です。変化や増加が大きく著しい場合に使用されます。"}, {"word": "stretching", "definition": "ここでは資源や能力を広い範囲に配置・配分することを意味します。限られた資源を多くの場所に配置することで負担が増すことを表します。"}, {"word": "facilitate", "definition": "何かが起こりやすくする、または進めやすくするために支援することを意味します。プロセスやアクションを容易にすることです。"}]}, {"title_ja": "レバノンがイスラエルの攻撃で11人が死亡と報告、ヒズボラ標的", "title_en": "Lebanon Reports 11 Dead in Israeli Strikes Targeting Hezbollah", "summary_ja": "イスラエルの南部レバノンへの空爆により11人が死亡した。6月の停戦合意以来最も激しい攻撃である。イスラエルはヒズボラの指導者を標的にしたと主張する一方、レバノンは和平交渉を損なう違反行為として非難した。今月開催予定のローマでの米国仲介交渉を控えての攻撃となった。", "summary_en": "Israeli airstrikes on southern Lebanon killed 11 people, including three children, marking the deadliest raids since a ceasefire agreement in June. Israel said the strikes targeted Hezbollah infrastructure and a commander, while Lebanon condemned them as violations undermining ongoing peace negotiations. The attacks occurred ahead of planned U.S.-sponsored talks in Rome and drew criticism from Lebanese leaders and threats of retaliation from Hezbollah.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/israeli-airstrike-on-southern-lebanon-kills-7-people-lebanese-state-media-say/article71348904.ece", "state_media": false, "category": "政治", "full_text": "Lebanon said Israeli strikes on the south killed 11 people including three children on Saturday (August 15, 2026), the deadliest raids since deals in June eased hostilities between Israel and Hezbollah.\nLebanese leaders condemned the strikes, which Israel's military said were in retaliation for an attack by the Iran-backed militant group, with one targeting a Hezbollah commander it accused of using his family as \"human shields\".\nThe strikes came as Israel and Lebanon were set to hold an eighth round of U.S.-sponsored direct negotiations early next month in Rome.\nThe two sides had agreed a framework deal at talks in Washington in June, but Lebanese President Joseph Aoun said that Saturday's \"violations are a clear message on the negotiations process and American efforts aiming to implement this agreement\".\nA spokesman for Israeli Prime Minister Benjamin Netanyahu, however, said the latest strikes \"should jumpstart the talks and make them much more serious, not do the opposite\".\nHezbollah said the attacks \"will be met with an appropriate response\", urging Lebanese authorities to abandon \"the humiliating path of direct negotiations\".\nLebanon's state-run National News Agency (NNA) reported an airstrike on a home in the village of Ansar and a \"series of airstrikes targeting the Ali al-Taher ridge\", a strategic hill overlooking the Nabatieh area.\nIt later reported another strike on the southern town of Deir Zahrani.\nLebanon's Health Ministry said seven people were killed \"including three children and two women\" in Ansar, where Aoun said \"an entire family\" had been killed.\nIsrael's military said the Ansar attack had killed a commander in Hezbollah's elite Radwan Force, Ali Samir Al-Haj Hassan, acknowledging reports that Hassan's family was present and maintaining they \"were not the target of the strike\".\nThe Health Ministry said four other people were killed and 17 wounded, including a child and 11 women, in Deir Zahrani.\n'No justification'\nIn Ansar, an AFP correspondent saw a destroyed building as rescuers combed the rubble, and a swimming pool clouded and grey from dust and debris.\nAbbas Khalil, 60, said he was praying when the strike hit.\n\"We were shocked... There's no justification for this,\" he told AFP.\nStanding next to the murky swimming pool, Mohammed Saab said he waited every year to rent his property out over the summer.\n\"What do I have here for this to happen?\" he said in dismay.\nThe Israeli army said it struck \"Hezbollah terror infrastructure\", later adding that the group had attacked soldiers inside a so-called \"security zone\" — a strip of territory around 10 kilometres (six miles) deep inside Lebanon where Israeli forces are operating.\nThree Israeli soldiers were seriously wounded, according to Netanyahu's office.\nIn Deir Zahrani, an AFP correspondent saw significant damage and heavy traffic towards the city of Sidon as some people headed north in cars packed with belongings.\nLebanese Prime Minister Nawaf Salam said that \"the women and children who were killed [in Ansar] are not military targets\", urging Israel to halt the \"extremely dangerous\" escalation.\nThe Israeli military, however, insisted that Mr. Hassan had been a \"lawful target\", and accused him of having \"used his family as human shields\".\nParliament speaker Nabih Berri, a Hezbollah ally, said the attacks were a call \"to the sponsors of the negotiations and the ceasefire agreements to bear their responsibility... before it's too late\".\nThe framework Israel-Lebanon deal calls for the disarmament of Hezbollah, a gradual withdrawal of Israeli forces from south Lebanon and the deployment of the Lebanese army to the region, starting in \"pilot zones\".\nMr. Netanyahu spokesman Doron Spielman told AFP that Israel stood by the agreement and voiced hope the Lebanese military would step up \"and together we're going to remove Hezbollah from the picture\".\nHezbollah has repeatedly rejected the deal, and opposes the ongoing talks.\nNegotiations\nThe group said that the new attacks reflected a desire by Mr. Netanyahu \"to escalate the war in order to strengthen his domestic political position\", with the Israeli leader running for re-election later this year.\nHezbollah drew Lebanon into the Middle East war in March with rocket fire at Israel in support of its backer Iran.\nIsrael responded with a heavy air campaign and ground invasion that Lebanese authorities say have killed more than 4,300 people.\nViolence has dropped since a U.S.-Iran memorandum of understanding on the broader Middle East war in June and the Israel-Lebanon deal later that month.\nBut Lebanon still reports intermittent Israeli strikes and broad demolitions of civilian buildings in southern villages and towns.\nThis week, Israeli Defence Minister Israel Katz vowed to keep troops in the \"security zone\".\nBut a U.S. State Department official said \"a permanent military presence in south Lebanon is not consistent with the commitments made in the framework\".\nPublished - August 15, 2026 01:55 pm IST", "translation_ja": "", "vocab": [{"word": "retaliation", "definition": "敵対行為に対する復仇・報復。攻撃を受けた側が相手に対して行う反撃のこと。"}, {"word": "infrastructure", "definition": "基盤となる施設や設備。軍事用語では戦闘支援のための重要な施設を指す。"}, {"word": "escalation", "definition": "紛争や対立が段階的に拡大・激化すること。段階的な悪化を意味する。"}, {"word": "disarmament", "definition": "武装の解除。特に軍事的な武器や軍隊を減らしたり廃止したりすること。"}, {"word": "ceasefire", "definition": "戦闘の一時停止。紛争当事者が合意による戦闘中止のこと。"}, {"word": "intermittent", "definition": "断続的な、時々起こる。継続的ではなく、時間を置いて繰り返される状態を表す。"}]}, {"title_ja": "カナダ国民はトランプへの譲歩をもう許さない：カーニーへのメッセージ", "title_en": "Canadians Won't Tolerate More Trump Concessions: Message for Carney", "summary_ja": "アンドリュー・フィリップスはトランプの圧力下での米国への さらなる譲歩に対してカナダの指導部が抵抗する必要があると警告している。論評は、米国の利益を優先する取引に対する国民の許容度が限界に達したことを強調している。潜在的なリーダーとしてのカーニーはこのカナダ有権者からの明確なメッセージに注意を払うべきである。", "summary_en": "Andrew Phillips warns that Canadian leadership must resist further concessions to the United States under Trump's pressure. The commentary emphasizes that public tolerance for trade-offs favoring American interests has reached its limit. Carney, as a potential leader, should take heed of this clear message from Canadian voters.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijwJBVV95cUxPdGtvS2NhSWdFbDh1cTdiWGgwVjE0V0ZaN3lKd0NNal9UeFlCR0xQcVNoVjBrelZvNXFHRWNmbXZoaGozZmx4YUJkM1R1dTN3N2ViNGxhcFk3N2VSS0phTHE1cGgxZUh3VDlEMXpabUVRR1BDOE9sY0gyT1NQLXltN1Jtekg0TzVKVVJ2SXVsRXdEeGVZVDlrWEZ2djN3Q3RtRjVzM0hCMmtZcE4xOG9jUzY2REJibUtpWHVOOFZkak1PQkdTMEhPV0MwOV93NjFtdTRQeHd2VkRUSXpXeGtIM00xRWRZSEVRTkxfN1JydGR5YXEtaXc3 is planning special initiatives to celebrate its 100-year anniversary. The media conglomerate is developing commemorative projects and programs to mark this significant milestone in its history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリア軍のX(旧Twitter)アカウントがハッキングされ、暗号資産投稿で埋め尽くされる", "title_en": "Nigerian Military's X Account Hacked, Flooded with Crypto Posts", "summary_ja": "国防本部は、そのXアカウントが侵害され、暗号資産関連のコンテンツを投稿するために使用されていると発表しました。軍は国民に対して、そのアカウントからの疑わしい投稿を無視し、本物の情報をFacebook、Instagram、WhatsAppなどの他の公式チャネルから入手するよう促しました。アカウントの管理を回復するための技術的措置が実施されています。", "summary_en": "The Defence Headquarters announced that its X account has been compromised and is being used to post cryptocurrency-related content. The military urged the public to disregard suspicious posts from the account and rely on other official channels like Facebook, Instagram, and WhatsApp for authentic information. Technical measures are being implemented to restore control of the account.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/903209-x-account-of-nigerian-military-headquarters-hacked-official.html", "state_media": false, "category": "政治", "full_text": "The Defence Headquarters said its X account has been “compromised,” and advised the public to disregard information posted there.\nIts spokesperson, Samaila Uba, disclosed this in a statement posted on Facebook Saturday evening.\nPREMIUM TIMES ran a quick check on the account and found that it has been flooded with countless cryptocurrency-related posts.\nThe account, which carries a verification badge, has more than 980,000 followers. Its name, military gallery and reposts remain intact.\nMr Uba, a major general, said the case was being treated as a “cybersecurity matter.” According to him, technical measures have been activated to secure the account and prevent further unauthorised access.\n“The Defence Headquarters assures the public that efforts are ongoing to fully restore control of the official account,” he stated.\n“Consequently, members of the public are advised to disregard any suspicious, unauthorised or misleading content that may be posted from the account during this period,” the military spokesperson added.\nThe account is one of the official channels through which military authorities disseminate information about combat operations, changes in hierarchies, and other defence matters.\nMr Uba did not state when the account was hacked. However, it appears that the hijackers have been consistent in posting automated cryptocurrency messages, with many of the posts made 19 hours ago.\nALSO READ: Nigeria, US airstrikes against ISWAP continue – Defence Headquarters\nThe military spokesperson said the Defence Headquarters prioritises “highest standards of information security,” while ensuring the public “receive accurate, timely and credible information on the activities and operations of the Armed Forces of Nigeria.”\nHe urged the public to rely on other official communication channels—Facebook, Instagram and WhatsApp— for “accurate, verified and timely information.”\n“We appreciate the understanding and vigilance of the public and will provide further updates as necessary,” he stated.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "compromised", "definition": "セキュリティが侵害された、または危険にさらされた状態を意味します。コンピュータシステムやアカウントが不正アクセスされたことを示すときに使用されます。"}, {"word": "cybersecurity", "definition": "コンピュータシステム、ネットワーク、またはデータを不正アクセスや攻撃から保護することに関わる分野です。デジタルセキュリティの専門分野を指します。"}, {"word": "disseminate", "definition": "情報や知識を広く配布・伝播させることを意味します。公式な情報を多くの人に知らせる際に使用される形式的な表現です。"}, {"word": "hijackers", "definition": "不正にシステムやアカウントを乗っ取った人々を指します。権限なしにコンピュータリソースを制御する者を意味します。"}, {"word": "unauthorised", "definition": "許可されていない、権限がない状態を意味します。不正なアクセスや操作を説明するときに使用されます。"}, {"word": "vigilance", "definition": "注意深い監視や警戒を意味します。潜在的な危険や問題に対する継続的な注意深さを表します。"}]}, {"title_ja": "エボニ州、違法採鉱に対抗するためにタスクフォースを設立", "title_en": "Ebonyi inaugurates task force to tackle illegal mining", "summary_ja": "エボニ州政府は、採鉱活動を規制し、違法操業を防止し、3つの上院地区全体で収益損失を減らすためにタスクフォースを立ち上げました。タスクフォースは、コミュニティ開発協定、安全基準、収益義務への適合を監視し、採鉱における不安全な慣行と児童労働を防止します。", "summary_en": "Ebonyi State Government launched a task force to regulate mining activities, prevent illegal operations, and reduce revenue losses across its three senatorial districts. The task force will monitor compliance with Community Development Agreements, safety standards, and revenue obligations while preventing unsafe practices and child labor in mining operations.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/903208-ebonyi-inaugurates-task-force-to-tackle-illegal-mining.html", "state_media": false, "category": "政治", "full_text": "The Ebonyi State Government, on Thursday, inaugurated a task force to strengthen regulation of mining activities, curb illegal operations and block revenue leakages in the sector.\nIn a speech at the inauguration, the Commissioner for Solid Minerals Development, Chinedu Nkah, said the task force would monitor mining and quarry activities across the three senatorial districts and ensure that the operators complied with relevant laws and regulations.\nMr Nkah said the task force became necessary because of the strategic importance of solid minerals to the state’s economy.\nHe said the operators must comply with Community Development Agreements, safety standards and statutory revenue obligations.\nHe warned mining operators against abandoning excavated pits, engaging in unsafe practices, under-declaring minerals or transporting mineral products illegally, particularly at night.\nThe commissioner also directed the task force to monitor mineral-bearing trucks, verify revenue payments and official clearances, and ensure that prohibited practices, including the use of children and pregnant women in mining, were strictly adhered to.\nHe cautioned members against extortion and abuse of office, saying that they must obtain appropriate directives before sealing mining companies or taking major enforcement actions.\nALSO READ: Court jails two Chinese nationals five years each in Lagos for illegal mining\nHe said that members would receive operational guidelines and training from the ministry and security agencies, while official identification materials would be provided to distinguish authorised personnel from impostors.\nAlso speaking, the Senior Special Assistant to the Governor on Solid Minerals Development, Chima Ude, urged the task force members to use their identification cards responsibly.\nHe warned that abuse of the privilege would attract legal consequences.\nMr Udeh said the initiative was part of government’s broader efforts to improve oversight, boost revenue mobilisation and ensure that solid mineral resources contribute meaningfully to the development of Ebonyi and its mining communities.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "curb", "definition": "~を抑制する、制御する。違法行為や悪習慣などの拡大や増加を防ぐことを意味します。ビジネスや政策用語として頻繁に使用されます。"}, {"word": "revenue leakage", "definition": "収益漏洩、不正や管理不備により失われる収入。政府や企業が徴収すべき資金が適切に回収されていない状況を指します。"}, {"word": "statutory", "definition": "法令で定められた、法律上の。法律または規制によって義務付けられたまたは認可されたことを意味します。"}, {"word": "under-declaring", "definition": "過少申告する、実際より低い金額や数量を報告する。税務や許可申請で不正に少ない情報を報告する行為です。"}, {"word": "extortion", "definition": "恐喝、脅迫による金銭等の取得。権力を悪用して違法に金銭や利益を強要する犯罪行為です。"}, {"word": "impose", "definition": "課す、負わせる。法律や規則により義務や責任を強制すること。この文脈では'impose guidelines'は「指針を課す」という意味です。"}]}, {"title_ja": "オスン州知事がティンブ大統領に選挙結果集計の保護を要請", "title_en": "Adeleke Urges Tinubu to Secure Election Results Collation in Osun", "summary_ja": "オスン州知事アデモラ・アデレケは、土曜日の州知事選挙の結果集計中に混乱を防ぐよう、ティンブ大統領に治安機関に指示を出すよう要請しました。アデレケは対立する政治家による混乱の試みについて懸念を表明し、すべての治安部隊にINECを支援して信頼性と透明性のある結果を確保するよう呼びかけました。", "summary_en": "Osun State Governor Ademola Adeleke has requested President Bola Tinubu to direct security agencies to prevent disruptions during Saturday's governorship election result collation. Adeleke expressed concerns about attempts by rival politicians to cause chaos and called on all security forces to support INEC in ensuring a credible and transparent outcome.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/903205-osundecides2026-ask-security-agencies-to-protect-votes-adeleke-tells-tinubu.html", "state_media": false, "category": "政治", "full_text": "Osun State Governor Ademola Adeleke has asked President Bola Tinubu to order security agencies deployed to the state to prevent attempts to disrupt the collation of results in the ongoing Saturday’s governorship election.\nMr Adeleke, in a post on X, expressed concerns over alleged attempts by what he described as “desperate and rejected” politicians to cause chaos during result collation.\nMr Adeleke, who is seeking second term in Saturday’s election, demanded that Mr Tinubu use his “good office” to issue a warning to “the heads of security agencies deployed to protect and safeguard the integrity of the electoral process.”\nHe said, “Reports of attempts to hijack or disrupt collation centers by desperate and rejected politicians across the state are deeply concerning and unacceptable, particularly given the large number of security personnel deployed to ensure a peaceful and credible election.”\nHe urged the president to reaffirm his commitment to ensure that Osun State residents’ votes count and that the election outcome reflects their genuine choice.\nHe also called on the Nigeria Police Force, Department of State Services, Nigerian Army, Nigeria Security and Civil Defence Corps and other security agencies to adhere strictly to the president’s directive.\nHe asked that they provide the Independent National Electoral Commission (INEC) the necessary support it needs to ensure a credible and transparent outcome\nThis is the latest in the series of alarms Mr Adeleke has raised concerning electoral violence and malpractice on Saturday.\nALSO READ: #OsunDecides2026: Adeleke urges voters to protect their votes\nPREMIUM TIMES reports that the incumbent governor demanded that security agencies prioritise protecting citizens’ votes during collation of the governorship election results only a few hours ago.\nDuring voting hours, he accused security agencies of bias, intimidation, and attempts to manipulate the poll in favour of the APC.\nThe governor alleged that police personnel were tear-gassing voters in some areas and that the APC was attempting to rig the election.\nMr Adeleke’s bid for a second term faces challenge from 14 other candidates, including the All Progressives Congress (APC) governoraship candidate, Bola Oyebamiji, in a keenly contested poll.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "collation", "definition": "選挙結果などを集計・照合する過程。複数の地域から報告された数字を確認し、最終的な結果にまとめることを指します。"}, {"word": "hijack", "definition": "本来の目的や過程を乗っ取る、または不正に支配する行為。選挙では投票地点や結果をコントロール下に置こうとする違法な試みを意味します。"}, {"word": "integrity", "definition": "誠実さ、廉潔性、完全性。選挙の文脈では、選挙過程が正直で不正なく行われることを指します。"}, {"word": "bias", "definition": "偏見、不公正な傾斜。特定の側を有利にするための不公正な扱いや、一方への不当な支持を意味します。"}, {"word": "incumbent", "definition": "現職の、現在その職にある。特に政治的地位（大臣、知事など）を現在保有している者を指します。"}]}, {"title_ja": "ケンブリッジ大学の黒人教授が死亡、人種と採用に関する問題が浮上", "title_en": "Cambridge's Youngest Black Professor Found Dead, Raising Questions on Racial Support", "summary_ja": "ケンブリッジ大学の最年少黒人教授ジェイソン・アーディが金曜日に死亡した。大学は彼の生活と仕事に関する一連の警告を無視していたとして、批判にさらされている。", "summary_en": "Jason Arday, Cambridge University's youngest Black professor, was found dead on Friday. The university faces scrutiny for allegedly ignoring warnings about his wellbeing and the challenges he faced during his tenure.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/15/world/europe/jason-arday-cambridge-hiring-questions.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランのYouTubeショーが大胆な議論で境界線を押し広げる", "title_en": "Iranian YouTube Show Pushes Boundaries With Bold Debates", "summary_ja": "イランの人気オンライン討論番組「Azad」は、国の権威主義体制の限界に挑戦する論争的なテーマに取り組むことで注目を集めています。同番組の継続的な放送は、検閲を回避する方法についての疑問を生じさせています。観察者たちは、機密性の高い問題に対処しながら放送を続けることができている理由に困惑しています。", "summary_en": "Azad, a popular online debate program in Iran, has gained attention for tackling controversial topics that challenge the limits of the country's authoritarian system. The show's continued operation raises questions about how it has managed to avoid censorship. Observers are puzzled by its ability to remain on air while addressing sensitive issues.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/15/world/middleeast/iran-youtube-show.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オーストリアで内戦虐待罪で有罪判決を受けたシリア人、シリアで拘束される", "title_en": "Syrian Convicted in Austria of Civil War Abuses Detained in Syria", "summary_ja": "シリアの元警察長官ムサブ・アブ・ルクバは、内戦中の犯罪で有罪判決を受けたオーストリアから逃亡した後、シリアで拘束された。アブ・ルクバは8年の懲役刑に対する控訴中にオーストリアを離れていた。彼の拘束はシリアの紛争に関連した責任追及の取り組みにおける重要な進展を示している。", "summary_en": "Musab Abu Rukbah, a former Syrian police chief, has been detained in Syria after fleeing Austria where he was convicted of crimes committed during the civil war. Abu Rukbah left Austria while appealing his eight-year prison sentence for civil war abuses. His detention marks a significant development in accountability efforts related to Syria's ongoing conflict.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/15/world/middleeast/syria-austria-arrest-civil-war-crimes.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、人質交渉合意後にガザ北部への通路を再開", "title_en": "Palestinians Return to Northern Gaza as Israel Reopens Crossing", "summary_ja": "イスラエルは人質解放交渉の膠着状態が解消された後、ガザを二分する軍事地帯を通過する避難民の移動を許可した。この通路の再開は、イスラエルとパレスチナ当局間の長期的な対立の後の大きな転換を示している。数千人のガザ住民が徒歩でガザ北部への帰還を開始することが可能になった。", "summary_en": "Israel has permitted displaced Palestinians to begin crossing through a military zone that divides Gaza, following a breakthrough in hostage release negotiations. The reopening of the crossing marks a significant shift after a prolonged deadlock between Israeli and Palestinian authorities. Thousands of Gazans are now able to return to the northern part of the enclave on foot.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発業者が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Widening Real Estate Crisis", "summary_ja": "中国最大級の不動産開発企業である万科が巨額の損失を報告し、国内の不動産危機の深刻化への懸念が高まっている。この経営危機は業界全体の安定性に関する疑問を生じさせ、当局が業界の悪化を防ぐために介入する必要があるかどうかについての議論を引き起こしている。", "summary_en": "Vanke, one of China's largest property developers, has reported significant losses, raising concerns about the deepening real estate crisis across the country. The financial troubles highlight questions about the stability of the sector and whether Chinese authorities will need to intervene to prevent further deterioration.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From October 7 Attack", "summary_ja": "イスラエルの医療関係者によると、8ヶ月間拘束されていた解放されたイスラエル人人質の中には、10月7日の攻撃による破片が体内に埋め込まれたままの者がいるという。多くの女性人質は地下トンネル内で長期間隔離されて拘束されていた。この発見は、拘束されていた人々が経験した深刻な身体的および心理的トラウマを浮き彫りにしている。", "summary_en": "Some of the released Israeli hostages who were held captive for eight months still have shrapnel embedded in their bodies from the October 7 attack, according to Israeli medical officials. Many of the women hostages were held in isolation for extended periods in underground tunnels. The discovery highlights the severe physical and psychological trauma experienced by those detained.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブームがアメリカの慈善事業を再構築", "title_en": "Silicon Valley's AI Boom Is Remaking American Charity", "summary_ja": "シリコンバレーのAI企業の創業者たちは、数千億ドルの寄付を誓約しています。この記事は、これらの前例のない資金がどのように配分され、アメリカの慈善活動にどのような影響を与えるかを探ります。", "summary_en": "Tech founders in Silicon Valley's AI sector are pledging to donate hundreds of billions of dollars to charitable causes. The article explores how these unprecedented commitments will be allocated and what impact they may have on American philanthropy.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の民主主義が人質に", "title_en": "Taking Taiwan's Democracy Hostage", "summary_ja": "台湾の政治家たちが私利私欲を優先させ、国家統治能力が低下している。政治的分裂により国の安定性と民主的制度が弱体化し、地域におけるチャイナの戦略的目標達成に有利に働く可能性がある。", "summary_en": "Taiwan's political system is becoming increasingly dysfunctional as self-interested politicians prioritize partisan interests over governance. This internal division weakens the country's stability and democratic institutions, potentially benefiting China's strategic objectives in the region.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/11/taking-taiwans-democracy-hostage", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの将軍がなぜ政界で成功しないのか", "title_en": "Why Israeli Generals Rarely Succeed in Politics", "summary_ja": "エコノミスト誌のイスラエル特派員が、軍事的成功を政治的成功に変えられないイスラエル元将軍の謎めいた現象を検証している。国家安全保障における著名な役割を果たしているにもかかわらず、これらの勲章を受けた将校は政界での足がかりを得るのに苦労している。", "summary_en": "The Economist's Israel correspondent examines the puzzling phenomenon of former military generals failing to translate their battlefield success into political achievement in Israel. Despite their prominent roles in national security, these decorated officers struggle to gain traction in the political arena.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/10/the-war-room-newsletter-do-generals-make-good-politicians", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "気候変動への対策は今実行する方が後から修復するより安上がり、公衆衛生研究者が指摘", "title_en": "Acting on climate change now is cheaper than fixing damage later, says health researcher", "summary_ja": "公衆衛生研究者のケヴィン・ジャンは、環境政策が気候変動議論でしばしば見落とされている重大な健康上の利益をもたらすと主張しています。彼は、気候変動に今対処することが、その結果を後から修復するより費用対効果が高いことを強調しています。", "summary_en": "Public health researcher Kévin Jean argues that environmental policies offer significant health benefits that are often overlooked in climate debates. He emphasizes that taking action today to address climate change is more cost-effective than waiting to repair the consequences.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/summer-reads/article/2026/08/15/climate-change-it-will-always-cost-less-to-act-today-than-to-do-nothing-and-repair-the-consequences_6756547_183.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハマス軍縮合意は歴史的な転機だが、イスラエルが反発", "title_en": "Hamas Disarmament Deal Offers Historic Opening, but Israel Opposes", "summary_ja": "ハマスは39年の歴史の中で初めて軍縮を交渉の議題に乗せることに同意した。トランプ大統領が承認した和平ロードマップは、イスラエル軍の撤退と並行した段階的で検証可能な軍縮プロセスを提案している。しかし、ベンヤミン・ネタニヤフ首相はこのアプローチを拒否している。", "summary_en": "Hamas has agreed for the first time in its 39-year history to place disarmament on the negotiating table. Trump-approved roadmap proposes a gradual, verified disarmament process parallel to Israeli military withdrawal. However, Benjamin Netanyahu has rejected this approach.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/15/hamas-disarmament-deal-offers-historic-opening-but-israel-stands-in-the-way_6756539_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプのイラン静かなる戦争：情報隠蔽と目標の変化", "title_en": "Trump's Silent Iran War: Information Gaps and Strategic Ambiguity", "summary_ja": "8ヶ月以上の展開が続くUSSエイブラハム・リンカーン空母では、乗組員の生活条件が悪化している。米メディアは、ホワイトハウスがイラン紛争に関する情報提供にほぼ消極的であることを報じている。この状況は、軍事作戦における透明性の欠如と戦略目標の変化に関する懸念を反映している。", "summary_en": "The USS Abraham Lincoln has been deployed for over eight months amid deteriorating conditions for sailors aboard the aircraft carrier. US media reports indicate the White House has provided minimal transparency regarding the ongoing conflict with Iran. The situation reflects broader concerns about communication and shifting strategic objectives in military operations.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/15/trump-s-silent-iran-war-withheld-information-shifting-objectives-and-skilled-deception_6756537_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の最新情報", "title_en": "Mindef Update", "summary_ja": "国防省（Mindef）が購読者向けの最新情報を発表しました。このニュースレターは、Mindefからの定期的な情報と更新を提供します。読者はザ・ストレーツ・タイムズのウェブサイトを通じて購読設定を管理できます。", "summary_en": "The Ministry of Defence has released an update for subscribers. This newsletter provides regular information and updates from Mindef. Readers can manage their subscription preferences through The Straits Times website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズが夕刊ニュースの概要を配信しています。読者は購読設定を管理し、出版物から利用可能な追加の無料ニュースレターを探索できます。", "summary_en": "The Straits Times delivers its evening news roundup with curated stories and updates. Readers can manage their newsletter subscriptions and explore additional free newsletters available from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "朝刊ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズが最新ニュースを毎日配信します。読者は購読設定を管理し、同紙の無料ニュースレターに登録することができます。", "summary_en": "The Straits Times delivers its daily morning briefing to keep readers informed on current events. Subscribers can manage their newsletter preferences and sign up for additional free content from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの入植地が成功することはない理由", "title_en": "Why Israeli settlements will never be a success story", "summary_ja": "イスラエルの入植地に固有の根本的な課題と矛盾を検証する論評。この記事は、入植地が長期的な実行可能性と成功を達成するために乗り越えられない障害に直面していると主張しています。", "summary_en": "An opinion piece examining the fundamental challenges and contradictions inherent in Israeli settlements. The article argues that settlements face insurmountable obstacles to achieving long-term viability and success.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9gFBVV95cUxQdVNiSGdOMklzdzhLVkRHVE5PTmllaENHa3d6dWZ6RDF3QWh6cTRjWldITHc1aUJrbnZVZ09LbXdpYVcxdUdTY2Y0bEJFSHljLUM1OVF3cHlWd01JY3pvV1pMeFRCbmdrdzZoa0tMOEpPSURfaEdkdUR1NVpJZFVQYVBoQlU0NjZVbjdtNlZJLXZ5SEQ3RmRUQ2xQWk9rTXhiX0w1VGhBV1RsMGhCTlhvYnp4MWZ4XzRGak5JclBYQXVwMklsVFl6a2ExeGRSVHo3aVV1c19RQkYxTjJiVjlYbjZUaDZHTk9rdm9WdXA0eXhFd3Z1UWc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ニューヨークのシナゴーグでシャバット礼拝中に信者とセキュリティが暴行される", "title_en": "Congregant and Security Guard Assaulted During NY Synagogue Shabbat Services", "summary_ja": "ニューヨークのシナゴーグでシャバット礼拝中に暴力事件が発生し、信者とセキュリティガードが暴行を受けた。この事件は、米国のユダヤ教宗教施設における継続的な安全上の懸念を浮き彫りにしている。", "summary_en": "A violent incident occurred at a New York synagogue during Shabbat services, resulting in assaults on both a congregant and a security guard. The attack highlights ongoing safety concerns at Jewish religious institutions in the United States.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi-gFBVV95cUxPUjduVEJrcERKdDJfQU5yOTFSTHk1Y2xhTXBlZnMzZEF2MktjbW1ELVJjZ0ZVdkZKbzFMeldtQ0ZQcm5NN3Rxc3BBUmMwUm5jV1VJNVFCTEthOHQzTmt5VHUxUGhQbEY1bGEzdHRheTFCQk83SHg0NTJ6c0swN2RMdzZMTGRLcjFINDlQUVJqa0VXQ2kzU1JueDJuY2UxT1pSTHRMY2w2X0xjT0dYTEI5NUxPUFNlSXFreWNyOVdzd3lqbTVSak83NFBfUFUyZ0hrVFdvc2RwcWJfX2ZLMjRiYlBqRGxYZjV1VVFvSzlEaVYwSFEzZmczaGZR?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "右派系イスラエルシンクタンク、米国の国連離脱推進ロビイスト雇用", "title_en": "Right-wing Israeli Think Tank Hires Lobbyists to Push U.S. Withdrawal From UN", "summary_ja": "右派系のイスラエルシンクタンクが、米国の国連離脱を推し進めるためにロビイストを雇用した。この動きは、様々な政策問題をめぐるイスラエルと国際機関との緊張関係を反映している。同機関はワシントンでの外交的影響力を積極的に追求し、この議題を推し進めている。", "summary_en": "A right-wing Israeli think tank has engaged lobbyists to advocate for the United States to withdraw from the United Nations. The move reflects tensions between Israel and the international body over various policy matters. The organization is actively pursuing diplomatic influence in Washington to advance this agenda.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMipAJBVV95cUxPUG83TkZibUpFbTdXdktYenpyVEJNOUM3aE1ob3dUVm9JemZ6MHRDU3RUcTVWRU5NSUlNVXBHaFhTN05zTFdpTFBiZzBCVVdKcWpmdGpRbUpRT1l2VkgyNE1wQklpc3BIT0FPRlZwY2JZV04tbG43YWZBWmlRU0NaWVRGVnlZbk1uVW5jYkx3N01FX19RNmtHaUZBaklwTGt4UUxVLXpmODAtMGl6UVczSkNHSVdxZHhGUTZZbTM3TG8xbER4cHZDdTJEUktTYlZIYmtuTTRZeHhvdU82bDlpX1Y2VHdGc3VXMXdjdFo4V2JEY0ZOZHl6RU4tTjFnNUg0MGVsaEVYTVV0Wjl6ODZrdGVKbkRibzF0MzNoNnFhc0pucG1F?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "医療能力削減とインターネット遅延で民間防衛訓練が終了", "title_en": "Medical Capacity Reduction and Internet Slowdowns Conclude Civil Resilience Drills", "summary_ja": "台湾は医療能力の削減とインターネット遅延をシミュレートして民間防衛訓練を終了し、緊急事態への対応能力をテストしました。この訓練では、潜在的な危機の際に重要なサービスを維持する国の能力が評価されました。訓練はヘルスケアと通信セクター全体の制度的対応能力を強化することを目的としていました。", "summary_en": "Taiwan concluded its civil resilience drills by simulating medical capacity reduction and internet slowdowns to test emergency preparedness. The exercises evaluated the nation's ability to maintain critical services during potential crises. The drills aimed to strengthen institutional response capabilities across healthcare and communications sectors.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFAwSEN0d1BEdjV1Sng0N1g4bDk0Q3ZyTjlPUWh2c09FZW1tM1diaENvNUxLc1Y0bmlfOEpVMWRQZEZlSTJXejlYQzg0YWl6NWtKYl9rWEZpbw?oc=5", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、中国が発表したインドネシアとの合同海軍演習について説明を求める", "title_en": "Taiwan Seeks Clarification from Indonesia on China's Announced Joint Naval Exercise", "summary_ja": "台湾は、中国が発表したインドネシアとの合同海軍演習に関して、インドネシアに説明を求めている。この動きは、地域の軍事協力と東南アジアにおける台湾の安全保障上の利益への潜在的な影響について懸念を高めている。", "summary_en": "Taiwan has requested clarification from Indonesia regarding a joint naval exercise announced by China. The development raises concerns about regional military coordination and potential implications for Taiwan's security interests in Southeast Asia.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE80WXVLWnBHWWlJUTdUZi1YbzVwX0UxaFhIWmlUUVhhWm85Q0oxN1hweVJKcFVzdGNjMUwtSXUzRmt4ZE0wdXVmOGRUaTBrVnBBbXZxUFpsdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、インドネシアとの共同軍事演習計画で中国を非難", "title_en": "Taiwan Criticizes China's Planned Military Drill with Indonesia East of Taiwan", "summary_ja": "台湾は、インドネシアとの軍事演習を台湾東方の海域で実施するという中国の発表を強く非難した。この演習は地域の緊張をさらに高める挑発的な動きと見なされている。台湾は、この演習を島に対する軍事的圧力を強化する中国の広範な戦略の一部と位置づけている。", "summary_en": "Taiwan has strongly condemned China's announcement of a planned military exercise with Indonesia to be conducted in waters east of Taiwan. The drill is seen as a provocative move that could escalate tensions in the region. Taiwan views the exercise as part of China's broader efforts to increase military pressure on the island.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9leXRNOWRYZWtJdGpCS0FFN2dYZmw0RU5BRkNlWnUxVGV3b1RxNjUzOVZUWFVBM3FWWnJuZGpkWmh5UlZQWVQtS0ZCelNYTjk0U2NzeVJsZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "外交活動が続く中、イラン・米国間の緊張が継続", "title_en": "Iran-US tensions remain elevated amid diplomatic efforts", "summary_ja": "CGTNによると、中東情勢をめぐるテヘランの外交接触が続く中、金曜日にイラン・米国間の緊張が焦点となった。報道によれば、イランの軍隊がイラン南部上空で米国のドローンを撃墜したという。", "summary_en": "CGTN reports that Iran-US tensions remained a focal point on Friday as Tehran engaged in diplomatic contacts regarding Middle Eastern developments. According to reports, Iranian forces downed a US drone over southern Iran, further heightening regional tensions.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-14/news-1PBpEfdDgDm/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の自動車輸出が100万台を突破、新エネルギー車が牽引", "title_en": "China's Car Exports Surpass 1 Million as NEV Sales Surge", "summary_ja": "CGTNが報じたところによると、中国の自動車輸出は104万3000台を超え、前年比81.3%増となった。中国自動車工業協会によれば、新エネルギー車（NEV）は2ヶ月連続で輸出の半分以上を占め、海外に出荷された55万3000台は前年比145.5%の大幅な増加を記録している。", "summary_en": "CGTN reports that China's car exports exceeded 1.043 million units, a year-on-year increase of 81.3%, driven primarily by new energy vehicles (NEVs). According to the China Association of Automobile Manufacturers, NEVs constituted more than half of exports for two consecutive months, with 553,000 units shipped abroad, representing a 145.5% surge compared to the previous year.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-12/China-s-car-exports-top-1-million-again-as-NEVs-drive-the-boom-1Py8AtXFc8o/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "プーチン大統領、NATO と日本の動きはロシアへの安全保障上の脅威だと警告", "title_en": "Putin warns NATO and Japan moves pose security threat to Russia", "summary_ja": "ロシアのプーチン大統領は水曜日、NATO がアジア太平洋地域での新兵器配備計画がロシアに対する脅威をもたらすと警告したと CGTN が報道している。プーチンは地域における不安定化させる軍事行動に対して警告を発した。この発言は、アジアにおける西側の軍事拡張に対するモスクワの懸念を反映している。", "summary_en": "Russian President Vladimir Putin stated on Wednesday that NATO's plans to deploy new weapons in the Asia-Pacific region pose a threat to Russia, according to CGTN. Putin cautioned against what he characterized as destabilizing military moves in the region. The statement reflects Moscow's concerns about Western military expansion in Asia.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-13/Putin-says-NATO-Japan-s-moves-pose-security-threat-1Pza0alBOve/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ペルシャ湾上空で米軍航空機とドローンが再び目撃", "title_en": "US Military Aircraft and Drone Spotted Over Persian Gulf", "summary_ja": "TASSは、ペルシャ湾地域上空で米軍航空機とドローンが観測されたと報じている。中東の航空交通管制サービス関係者によると、軍事輸送機の飛行もオマーン湾上空で追跡されたという。", "summary_en": "TASS reports that US military aircraft and drones were observed over the Persian Gulf region. According to sources in Middle Eastern air traffic control services, military transport aircraft flights were also tracked over the Gulf of Oman during the day.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2173771", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "熱波によりバルト海沿岸で有毒なアオコが拡大", "title_en": "Toxic blue-green algae spread along Baltic Sea coast due to heatwave", "summary_ja": "Der Spiegelの報道によると、有毒なアオコがバルト海沿岸で急増しているとTASSが伝えている。異常な熱波がこれらの有害な藻類の繁殖を引き起こしたと同誌は報じている。この環境問題が当該地域に影響を与えている。", "summary_en": "Der Spiegel reports that toxic blue-green algae have proliferated along the Baltic Sea coast. According to the publication, an abnormal heatwave has caused the spread of these harmful algae blooms. TASS reports on the environmental concern affecting the region.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/non-political/2173769", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ軍がエネルゴダルの統一司令センターを攻撃", "title_en": "Ukrainian army attacks dispatch service premises in Energodar", "summary_ja": "TASS/RTによると、ウクライナ軍はエネルゴダルの統一司令センター施設に対して攻撃を実施した。市長は攻撃により施設で火災が発生したと報告している。", "summary_en": "According to TASS/RT, Ukraine's military conducted strikes against a unified dispatch service facility in Energodar. The mayor reported that the attacks resulted in a fire at the premises.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2173767", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アジアの過小評価通貨に対して何をすべきか？", "title_en": "What Should Be Done About Asia's Undervalued Currencies?", "summary_ja": "著者は、アジアの通貨（人民元、円、ウォン）が過小評価されているという懸念は米国との貿易不均衡によるものとされることが多いが、外国為替介入だけではこれらの不均衡の根本的な原因には対処できないと主張している。政策立案者は、調整された通貨市場介入に頼るのではなく、主要アジア経済と米国の間の不均衡を引き起こしている基本的な経済要因に焦点を当てるべきである。", "summary_en": "The author argues that while concerns about undervalued Asian currencies (renminbi, yen, won) are often attributed to trade imbalances with the US, foreign-exchange intervention alone cannot address the fundamental causes. Rather than relying on coordinated currency market intervention, policymakers should focus on the underlying economic fundamentals driving these imbalances between major Asian economies and the United States.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/foreign-exchange-interventions-to-strengthen-renminbi-yen-and-won-will-not-solve-global-imbalances-by-jeffrey-frankel-2026-08", "state_media": false, "category": "オピニオン", "full_text": "What Should Be Done About Asia’s Undervalued Currencies?\nThose who worry that the renminbi, yen, and won are undervalued vis-à-vis the dollar are usually focused on the large trade and current-account surpluses that China, Japan, and Korea run with the US. But coordinated intervention in currency markets will not address the fundamentals underlying these imbalances.\nCAMBRIDGE—Major Asian currencies’ exchange rates are again at the center of debates in international monetary economics. With China, Japan, and South Korea all running trade and current-account surpluses, and the United States running corresponding deficits, some argue that the renminbi, yen, and won are undervalued. But given the fundamentals underlying these imbalances, foreign-exchange intervention is unlikely to do much good.", "translation_ja": "", "vocab": [{"word": "undervalued", "definition": "本来の価値より低く評価されている状態。為替レートが理論値より低いことを示す経済用語。"}, {"word": "vis-à-vis", "definition": "対して、～に対比して。フランス語由来の表現で、ある国や通貨と別の国や通貨を対比する際に使用される。"}, {"word": "current-account surplus", "definition": "経常収支の黒字。商品・サービスの輸出入と所得収支の合計が黒字である状態を意味する。"}, {"word": "foreign-exchange intervention", "definition": "中央銀行が為替レートに影響を与えるため、市場に直接介入すること。通貨の売買を通じて為替を調整する政策手段。"}, {"word": "fundamentals", "definition": "経済の基本的な要因。インフレ、成長率、金利差など、為替レート決定の根本的な経済指標を指す。"}]}, {"title_ja": "企業がAIによる失業危機をどう軽減できるか", "title_en": "How Corporations Can Mitigate an AI Jobocalypse", "summary_ja": "著者は、AIによる失業がセクター間で異なるペースで進む可能性があるが、企業は社会的連帯の観点から影響を最小化する責任を負うべきだと主張している。政府は政策的インセンティブを導入すべきであり、大企業は、すでに大手企業がより急速にAI技術を採用している中で、AI置換による失業者を支援することが長期的利益であることを認識すべきである。", "summary_en": "The author argues that while AI-related job displacement may occur at varying speeds across sectors, corporations must take responsibility for minimizing its effects through social solidarity. Governments should implement policy incentives while large employers should recognize their long-term interests in supporting workers displaced by AI adoption, particularly as larger firms are already adopting the technology faster than smaller businesses.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/corporations-can-mitigate-ai-jobs-apocalypse-by-raghuram-g-rajan-2026-08", "state_media": false, "category": "オピニオン", "full_text": "How Corporations Can Mitigate an AI Jobocalypse\nEven if AI-related job displacement is less severe than many feared, corporations will need to be enlisted in minimizing its effects in the name of social solidarity. To that end, governments should consider what policy incentives are in place, and large employers should consider their own long-term interests.\nCHICAGO—AI-related job displacement is coming, though no one knows how fast it will proceed, how far it will go, and which sectors it will affect most. Much depends on the pace at which individual firms apply the technology to their operations. A recent US Census Bureau Business Trends and Outlook Survey indicates that only 20% of firms with fewer than 20 employees currently use AI, compared to 37% of businesses with at least 250 employees. While larger firms are doing more with the technology, 37% is still quite meager considering the survey’s low threshold for answering in the affirmative (whether AI is used “in any business function”).", "translation_ja": "", "vocab": [{"word": "displacement", "definition": "人や労働者が元の位置や職から別の場所や職に移動させられること。特に雇用の文脈では、技術進歩などにより職を失うことを意味します。"}, {"word": "mitigate", "definition": "悪い状況や影響を軽くする、緩和することを意味します。被害や問題の深刻さを減らすために対策を取ることです。"}, {"word": "jobocalypse", "definition": "job（仕事）とapocalypse（黙示録的な破滅）を組み合わせた造語で、大規模な失業危機を指す俗語です。"}, {"word": "solidarity", "definition": "共通の目標や利益に基づいて一致団結すること。社会全体の福祉のために団結して行動する姿勢を表します。"}, {"word": "meager", "definition": "量が少ないこと、不十分であることを意味します。期待や基準に対して不足している状態を表現します。"}, {"word": "incentives", "definition": "人々を特定の行動をするように動機付ける報酬や優遇措置のことです。政策では企業や個人の行動を促すために用いられます。"}]}, {"title_ja": "中国全体主義の形成と再形成", "title_en": "The Making and Remaking of Chinese Totalitarianism", "summary_ja": "著者は、経済成長が中国を自由化させるという西側の仮定が誤りであり、中国の全体主義制度は数十年の改革を乗り越えて弾力性を示し、習近平体制下で再び力を強めたと主張している。米中関係を理解するための人気のある「修正主義の罠」という枠組みに異議を唱え、より深い構造的要因が両国の対立に作用していることを示唆している。", "summary_en": "The author argues that Western assumptions about economic growth liberalizing China proved incorrect, as China's totalitarian institutions remained resilient through decades of reform and have reasserted themselves under Xi Jinping. The piece challenges the popular Thucydides Trap framework for understanding US-China relations, suggesting deeper structural factors are at play in their rivalry.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/onpoint/institutional-genes-explain-how-china-totalitarian-institutions-survived-reform-era-by-chenggang-xu-2026-08", "state_media": false, "category": "オピニオン", "full_text": "OnPoint Subscriber Exclusive\nLonger Reads provide in-depth analysis of the ideas and forces shaping politics, economics, international affairs, and more.\nThe Making and Remaking of Chinese Totalitarianism\nFor decades, the West assumed that economic growth would turn China into a more open, liberal society, much as it did South Korea and Taiwan. Instead, China’s totalitarian institutions proved remarkably resilient, surviving decades of reform and reasserting themselves under President Xi Jinping.\nSTANFORD—The Thucydides Trap has become a popular lens for understanding US-China relations. Its logic is simple: when a rising power challenges an established one, fear and mistrust grow, making conflict increasingly difficult to avoid. Over the past decade, Chinese President Xi Jinping has repeatedly invoked this distinctly American concept to frame his country’s rivalry with the United States.", "translation_ja": "", "vocab": [{"word": "totalitarianism", "definition": "政府が市民の生活のあらゆる側面を完全に支配する独裁的な政治体制を指す。個人の自由や民主的プロセスが存在しない。"}, {"word": "resilient", "definition": "困難や変化に直面しても回復し、適応する能力を持つ性質。ここでは制度が長期間にわたって存続する強さを意味する。"}, {"word": "Thucydides Trap", "definition": "新興勢力が既存勢力に挑戦する際に、恐怖と不信が増加し紛争が避けられなくなるという国際関係の理論概念。"}, {"word": "reasserting", "definition": "かつての力や権威を再び主張または確立する行為。ここでは体制が以前の支配力を再び取り戻すことを意味する。"}, {"word": "lens", "definition": "物事を理解・分析するための観点や枠組み。特定の視点から現象を解釈するための理論的視座を指す。"}, {"word": "rivalry", "definition": "二つ以上の勢力や国家間の競争状態。互いに優位性を求めて対立する関係を意味する。"}]}, {"title_ja": "「ウォーク1.0」への執着を止めよ—アメリカはより緊急の危機に直面している", "title_en": "Stop Obsessing Over 'Woke 1.0' – America Has Urgent Crises to Address", "summary_ja": "アルワ・マハダウィは、進歩派が最近「ウォーク1.0」（2018～2021年の社会正義活動）を批判することが共和党の手助けになり、大統領の汚職、中絶制限、移民拘留などの深刻な現在の問題から注意をそらしていると主張する。過去のいくつかの行き過ぎは問題だったことを認めながらも、民主主義と人権への前例のない脅威に直面している時にこれらの歴史的批判に焦点を当てることは逆効果だと彼女は述べている。", "summary_en": "Arwa Mahdawi argues that progressives' recent dismissal of 'Woke 1.0' (2018-2021 social justice activism) plays into Republican hands and distracts from serious current problems like presidential corruption, abortion restrictions, and immigrant detention. While acknowledging some past excesses were problematic, she contends that focusing on these historical critiques is counterproductive when the country faces unprecedented threats to democracy and human rights.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/15/woke-1-aoc-progressives", "state_media": false, "category": "オピニオン", "full_text": "There is probably no word that has been more used and abused in the last decade than “woke”. It has been rendered completely meaningless, but it refuses to die. Indeed, it has now taken on new life: in the past week, there’s been a flurry of headlines about “Woke 1.0” or “Woke One”. If you haven’t seen the phrase pop up in your newsfeed yet, it will soon.\nSo what is this cursed phrase? There’s no official definition, but the term is largely being used to refer to the period between 2018 and 2021 when social justice language was at its peak in mainstream culture. Certain progressives, including Alexandria Ocasio-Cortez, have started to use “Woke 1” disparagingly, as a way to distance themselves from that period and signal that they stand for a new form of left-leaning politics that is more palatable to centrist Democrats. “Woke 2”, I suppose.\nWe can blame the New York City councilmember Chi Ossé for coining the phrase. Back in May, he wrote on X: “Woke 1 was crazyyyy.” This was in response to someone reminding him that, in 2021, he’d said: “A cis white man should not be the next speaker of the Council.”\nNot that many people paid attention to the May post. But then Alexandria Ocasio-Cortez quoted it on a recent appearance on ABC News’s This Week when she was asked about some statements the Wisconsin gubernatorial candidate Francesca Hong had made. In 2020, Hong, who lost this week’s gubernatorial primary, tweeted that Thanksgiving should be cancelled. She also posted about defunding the police. AOC responded to a question about these “controversial” tweets by saying Hong had moved away from these positions.\nThe congresswoman then noted: “I have a local city councilman that has this saying: ‘Woke 1.0 was crazy.’” After laughing at the phrase, Ocasio-Cortez went on to add: “During the pandemic, the doors were really open in trying to entertain any and every policy that was going to get us to a better place. And I actually think that the discussions that were had in that time were quite fruitful … I think that, you know, during lockdown, of course, rhetoric in that time is not rhetoric that we would use today.”\nWhen you look at AOC’s full quote about Woke 1.0, it’s pretty reasonable. However, it has been ripped out of context and is being willfully misinterpreted by some people to suggest that Ocasio-Cortez thinks the excesses of that period were funny.\nStephen Miller, for example, almost exploded on air after Fox News’s Will Cain played a clip of AOC talking about Woke 1 to him on air. Miller ranted for almost five minutes about how woke policies resulted in a “historic increase in murders”. (Gun violence surged in the US during Covid, but that wasn’t because of protests or because some people wanted you to say “folx” instead of “guys”. It was for myriad reasons that we are still trying to understand but include school closures in low-income areas.)\nMiller added: “We’re all going to have a good laugh about that? ‘Sorry your husband was murdered.’ ‘Sorry your mom was killed.’ ‘Sorry your loved ones are six feet under the ground now.’ We’re going to have a good laugh about that? It’s sickening, it’s disgusting and the thing is, [Woke 1.0] never stopped.”\nThe Atlantic, meanwhile, published a piece headlined “The Democrats Can’t Just Laugh Off ‘Woke 1’”, which argued: “Republicans have no incentive to let them forget past excesses.”\nMaybe not, but progressives also shouldn’t play into their hands by talking about Woke 1.0 instead of focusing on the dire state of the country right now. This isn’t to say we can’t learn from past mistakes. I think we can all agree that there were some embarrassing excesses between 2018-2020. There was the time, for example, when a Mexican American San Diego Gas and Electric employee got fired because someone thought he was doing the White Power symbol with his hand. All he was doing was hanging his arm out of his truck and cracking his knuckle. There was no evidence to prove he held white supremacist views, there was just a baying mob on Twitter.\nWas that incident bad? Yes, of course! Was some of the earnest discourse from the time cringe? Absolutely! But just take a minute and look around, why don’t you? The president of the US is monetizing his position in an unprecedented way. Pregnant women are dying preventable deaths because they can’t get access to safe abortions, and immigrants are being snatched off the street by masked thugs. Freedom of speech is under attack, and you can get deported for talking about the ongoing genocide in Gaza. Getting upset right now about Woke 1 is crazyyyy.\nICE is locking people up for things their grandmother did\nDo take the time to read this shocking piece in the Nation by Maryam Tahmasebi, who is currently in ICE detention with her family because her mother-in-law was a translator for the Iranian hostage takers back in 1979. Tahmasebi and her husband are both professors and legal residents without so much as a traffic ticket on their records. They’", "translation_ja": "", "vocab": [{"word": "excesses", "definition": "行き過ぎた行為や過度な行動。文脈では、2018～2021年の社会正義活動の中で問題のある過激な言動を指す。"}, {"word": "disparaging", "definition": "ある人や物を軽蔑的に扱うこと。ここではAOCが過去の立場から距離を置くために使用している。"}, {"word": "willfully", "definition": "意図的に、故意に。ここでは共和党がAOCの発言を故意に誤解釈していることを指す。"}, {"word": "monetizing", "definition": "何かを利用して利益や金銭を得ること。大統領職を通じて経済的利益を得る行為を指す。"}, {"word": "unprecedented", "definition": "これまでに例がない、前代未聞の。ここでは大統領の権力濫用の規模が歴史的に異例であることを強調している。"}, {"word": "genocide", "definition": "特定の民族や宗教集団を意図的に滅絶させようとする行為。ガザに関する言論の自由が制限されていることを例として挙げられている。"}]}, {"title_ja": "AOCが批判する『ウォーク1.0』：理想と現実のバランスを求めて", "title_en": "AOC's Critique of 'Woke 1.0': Finding Balance Between Ideals and Practicality", "summary_ja": "フランシーン・プローズはAOCの最近のパンデミック時代の極端な進歩的政策批判を支持しながら、『ウォーク』という用語そのものに対する著者の不安を認める。プローズは緩和の必要性を理解しているが、ベイツ大学などの機関での厳格なアイデンティティ中心の政策が進歩主義者の信頼性を損ない、右派が正当な左派の目標を批判するための弾薬を与えたと主張している。", "summary_en": "Francine Prose supports AOC's recent criticism of extreme progressive policies during the pandemic era, while acknowledging the author's discomfort with the term 'woke' itself. Though she understands the need for moderation, Prose argues that rigid identity-focused policies at institutions like Bates College undermined progressive credibility and gave ammunition to the right to dismiss legitimate leftist goals.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/15/aoc-woke-1", "state_media": false, "category": "オピニオン", "full_text": "Full confession: I am one of those who have come to think that Alexandria Ocasio-Cortez can essentially do no wrong. At times when I most fear for the future of our country, I watch her videos and am consoled and cheered by her clarity, her honesty, her intelligence, her simple common sense. So I was a little surprised to hear that on a recent interview on ABC This Week, she quoted a political ally as having remarked: “Woke 1.0 was crazy.”\nWhat surprised me was not that she called for some moderation of the radical positions – the call to defund the police and the military, for example – that have, at times, been an aspect of progressive politics. But I was frankly a little unnerved to hear her use the word “woke”.\nThe term has its roots in Black slang. “Stay woke” was originally a warning to keep alert to the dangers posed by prejudice and white supremacy. But its meaning has changed to become a synonym for what used to be referred to, also derogatorily, as “PC” – politically correct.\nI’ve politely asked my colleagues at the college where I teach to avoid the word because it has so effectively been weaponized by the far right to mock and discredit anyone who supports racial justice, economic equity, universal healthcare, and many of the issues in which I too believe.\nIn the ABC interview, AOC explained the ways in which, during the Covid lockdown, “There was a huge opening. The doors were really open to entertain any and every policy that was trying to get us to a better place. But the rhetoric we used at that time is not the rhetoric we use today.” She went on to explain that her primary goal – improving the life of every American – has remain unchanged.\nEven though I wish she’d used different language for it, I understand her suggestion that Woke 1.0 was crazy. The strict policing of language, the “cancellation” of anyone who had, at any point in their life, made a mistake that was perceived as injurious to women or people of color, the inflexible and frequently impractical notions of what can be said, taught and legislated raised the specter of a dictatorial left that devalued individual liberties and threatened our freedom of speech almost (though not quite) as much as the extreme right.\nIn the current issue of The Atlantic, there’s an eloquent and terrifying essay by Tyler Austin Harper, explaining why the absurd and damaging policies regarding the need to root our racism in the college curriculum and in the larger society made him decide that he – a Black scholar with a tenure-track appointment to teach interdisciplinary humanities in an environmental-studies program – had no choice but to abandon academia forever.\nIn 2021, it was decided that every department at Bates College, where Harper worked, must offer two courses that would “identify areas where white supremacy, ‘colonial’ frameworks, and other forms of bias might be lurking in curricula and major requirements”. This would include the science classes, taught by faculty who often had no idea how to address these complex topics.\nSuch courses might include a math class aimed to help students understand “the role of mathematics as a gatekeeper and driver of injustice”. A colleague suggested that when a student or teacher made a remark perceived to be insensitive, another student should call out “oops” or “ouch” as a helpful corrective.\nThough some of the more extreme policies were eventually rescinded, the final effect was to make Harper decide that he no longer felt capable of functioning with any degree of personal freedom and integrity on a college campus.\nThe policies implemented at Bates were, I assume, typical of the Woke 1.0 ideology to which AOC was referring. Policies like those, which were heavy-handed interventions in curricula and teaching norms – and the headlines they generated – made it all too easy for the far right to ridicule the ideals of the more moderate and left-leaning Americans, and to use that ridicule as a tool to make sure that the old-fashioned, constitutionally-guaranteed aspects of our democracy – including freedom of speech and assembly – could be characterized as “radical” and even “communist”.\nThe infighting and mutual recrimination that this inspired between progressive and centrist Democrats made it all too easy for the right to dismiss the worthiest of ideals – freely available healthcare, childcare and education, an end to inflation and to the profiteering that has enabled billionaires to widen the income disparity so harmful to average US families – as the kind of folly that allowed the Bates community to describe an argument between white and Black students as a “lynching”.\nSo once again, I agree with AOC. We need to focus on what’s politically viable, on what is attainable, on what the American people so desperately need. Censorship and repression are not only counterproductive but destructive, regardless of whether those efforts come from the right or the left.\nThe midterms are approaching. Our country sta", "translation_ja": "", "vocab": [{"word": "weaponized", "definition": "政治的な目的のために言葉や概念を意図的に利用・悪用されるようになったことを意味する。ここでは『ウォーク』という言葉が右派に攻撃の道具として使われるようになったことを指す。"}, {"word": "inflexible", "definition": "融通性がなく、固い、または柔軟に対応できない様子。ここではウォーク運動が厳格で変更や妥協の余地がなかったことを表現している。"}, {"word": "specter", "definition": "幽霊や亡霊を意味する。比喩的に、恐れや懸念される脅威や悪い可能性を象徴する存在を指す。"}, {"word": "recrimination", "definition": "相互の非難や責任転嫁のこと。党派内または政治的グループ間での互いへの批判と対立を意味する。"}, {"word": "viable", "definition": "実行可能で、うまくいく可能性がある状態のこと。政治的な提案や政策が現実的に達成できるかどうかを判断する際に使用される。"}, {"word": "entertain", "definition": "考慮する、検討するという意味で使われる。ここではパンデミック中に様々な政策提案を『真摯に受け止めて検討した』という意味。"}]}, {"title_ja": "COVID-19の起源について政治的対立を超えた客観的調査が必要である", "title_en": "We Need Objective Answers on Covid-19's Origin, Not Political Theater", "summary_ja": "スタンフォード大学の微生物学者デイビッド・レルマンは、COVID-19の起源について自然界からの感染と研究所事故の両方が依然として妥当な説明であると主張しながらも、この問題が危険なほどに政治化していることを指摘している。彼は不確実性への謙虚な受け入れ、透明性のある国際的調査、そして危険な研究に対する責任を科学者が受け入れ、政治家が国民的議論のバランスを図ることを求めている。", "summary_en": "Microbiologist David Relman argues that while both a natural spillover and lab accident remain plausible explanations for Covid-19's origin, the issue has become dangerously politicized. He calls for humble acceptance of uncertainty, transparent international investigation, and scientists to embrace responsibility for risky research while politicians foster balanced public discourse.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/15/covid-19-origins", "state_media": false, "category": "オピニオン", "full_text": "As a microbiologist and infectious disease clinician, it has been tough to watch the recent devolution of public discourse on Covid-19 origins. It has been especially difficult for me to read the comments of Anthony Fauci about the origins debate in his now-public diary. And it has been painful to watch the televised spectacle hosted by the US senator Rand Paul on 29 July involving a hostile interrogation of Fauci.\nDespite many early pleas, including my own, for a dispassionate, objective assessment of what we know, don’t know and need to know about Covid-19 origins, we seem to be even further from this goal now than we have ever been – plagued by politicization, polarization and illogical thinking.\nMuch is at stake: trust in science, scientists and government, not to mention our ability to thwart and respond to the next pandemic. How did this happen and how do we dig ourselves out?\nBy the eve of Covid-19, after 20 years of debate, we had agreed to disagree about whether humans were capable of starting a new pandemic. Most public health scientists believed that nature was the only important “bioterrorist”, based simply on prior probabilities.\nOther scientists, who focused on the growing power of biotechnology and studied human behavior, believed that humans had become more than fully capable. When Covid suddenly blew up in late December 2019 in Wuhan, China, and was quickly attributed to a coronavirus with recent ancestors in bats, two possibilities leaped to the fore: a natural “spillover” at one of the unregulated wildlife markets in the city (as with the original 2002 Sars outbreak), and a lab accident in Wuhan, where there happened to be the world’s largest collection of bat-associated coronaviruses.\nSix years later, despite much mudslinging, each of these possibilities remains viable, supported by circumstantial, but not dispositive, evidence. The virus has not been found in nature, nor in a lab.\nAt the heart of the dispute, two statements are true but not necessarily related. First, we see in scientific publications that risky work with bat coronaviruses was undertaken in Wuhan, some with US National Institutes of Health (NIH) support.\nIts goal was prediction of disease emergence. Some of this work resembled a form of Russian roulette, in which pieces of novel bat viruses were shuffled to make chimeric viruses and then test their properties (under inadequate biosafety conditions).\nYet, this published work does not reveal a plausible Covid precursor virus. Thus, Rand Paul is correct in that risky work was funded by NIH in Wuhan. Anthony Fauci is correct in that the published work, on the face of it, did not cause Covid. Of course, as with any research program, we can assume that much remains unpublished.\nMy own view, for what it is worth, is that a lab accident in Wuhan is the most plausible explanation for Covid, given the kind of work pursued there, the fact that publications by Chinese researchers indicate knowledge about the Sars-CoV-2 virus before late December 2019, and the thousands of negative tests from suspect animal reservoirs. But I could be wrong.\nIf we are to improve our capacity for anticipating, preventing and responding to the next pandemic, several things must happen. First, everyone who insists that they know how Covid began should back off, accept ongoing uncertainty and display a bit more humility.\nSecond, we need an objective and transparent forensic investigation of Covid origins with broad international engagement and proper authorities and accountability.\nThird, scientists must fully embrace the responsibilities that come with technical power and knowledge and accept guardrails for some kinds of experiments. Similarly, political representatives must embrace their responsibilities for ensuring an educated, balanced public discussion about the trade-offs between a healthy pursuit of public health science and the attendant risks, as well as for balanced public policy addressing risk oversight.\nOne thing that cannot continue to happen is a collective state of wishful thinking that this issue can be ignored or buried, or that nothing useful will result from addressing it. Continuing down the current path comes at our own peril.\n- \n  David Relman is a professor of medicine and microbiology at Stanford University. He was an inaugural member of the US National Science Advisory Board for Biosecurity and president of the Infectious Diseases Society of America", "translation_ja": "", "vocab": [{"word": "devolution", "definition": "状況や議論が悪化・退化することを意味する。原義は権限の委譲だが、ここでは公開討論の低下を表す。"}, {"word": "dispositive", "definition": "決定的な、結論を左右する証拠を意味する法律・学術用語。最終的な判断を下すに十分な証拠があることを示す。"}, {"word": "spillover", "definition": "動物から人間への感染病の伝染を指す専門用語。ウイルスが種の壁を越えて感染することを意味する。"}, {"word": "chimeric", "definition": "異なる生物由来の遺伝子を組み合わせた、キメラ的な生物学的存在を指す専門用語。"}, {"word": "guardrails", "definition": "安全柵や規制の枠組みを意味するイディオム。危険な活動を制限するための防止措置や基準を指す。"}, {"word": "humility", "definition": "謙虚さ、謙虚な態度を意味する。自分の知識や判断の限界を認識することを示す。"}, {"word": "forensic", "definition": "法医学的な、証拠に基づく徹底的な調査を意味する学術用語。科学的かつ厳密な分析を指す。"}]}, {"title_ja": "アフガニスタン女性との連帯：タリバン抑圧に対する国際的支援の呼びかけ", "title_en": "Standing With Afghan Women: A Call for International Support Against Taliban Repression", "summary_ja": "著者は、アフガニスタン女性がタリバン支配に対する最も組織的な抵抗勢力となっており、深刻な抑圧にもかかわらず秘密学校を運営しデモを組織していると主張している。それにもかかわらず、ほとんどの外国政府はこれらの努力をほとんど支援しておらず、むしろタリバンとの外交関係を拡大している。著者は、アフガニスタン女性の抵抗への国際的支援が道徳的に不可欠であると同時に、アフガニスタンの将来の安定と多元性のために戦略的に重要であると主張している。", "summary_en": "The author argues that Afghan women have become the most organized resistance to Taliban rule, running underground schools and organizing protests despite severe repression. Despite this, most foreign governments have done little to support these efforts and are instead expanding diplomatic engagement with the Taliban. The author contends that international support for Afghan women's resistance is both morally imperative and strategically important for Afghanistan's future stability and pluralism.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/afghanistan/standing-afghan-women", "state_media": false, "category": "オピニオン", "full_text": "In the five years since the Taliban seized power in Kabul on August 15, 2021, Afghan women have become the most persistent source of resistance to the group’s efforts to transform Afghanistan. The exclusion of women and girls from public space is at the center of the Taliban’s extremist state-building project—a project that has also included dismantling institutions, subordinating the judiciary to religious authority, eliminating political opposition and civic activity, silencing independent media, and diverting male and young female students from schools with broad-based formal curricula to madrasahs that instill the Taliban’s ideology.\nMany Afghan women are refusing to accept this radical transformation of Afghanistan’s social and political order. Some are protesting in the streets despite the extraordinary threats they face. Others are organizing underground schools to fill gaps in education and collaborating closely with Afghans in exile to prepare legal action against the Taliban’s abuses. Against the odds, Afghan women have built a tenacious resistance movement, inside and outside the country, that is working to alleviate conditions and provide opportunities, however limited, for women and girls.\nYet most foreign governments, including those who have publicly condemned the Taliban’s swift and sweeping repression of women since 2021, have done little to support Afghan women’s efforts. Indeed, many are expan
