an, 110 from Nawalparasi East, 44 from Gorkha, 37 from Nuwakot and 33 from Dhading district.\nSimilarly, 28 bodies have been recovered from Tanahu, 27 from Nawalparasi West and 12 from Rasuwa.\n-PTI\nHere are helpline numbers of Indian Embassy and state governments\nThe Ministry of External Affairs (MEA) and the Indian Embassy in Kathmandu have issued emergency helpline numbers for Indian nationals seeking assistance or information. Those requiring help may contact the embassy helplines at +977 985 131 6807 and +977 970 910 7500.\nThe Nepal Tourism Board also issued emergency contact numbers, including the toll-free number 1234, hotline 1144 and Tourist Police number 9851289445.\nNepal does not need foreign rescue help with flood, foreign ministry says\nNepal does not need help from other countries to conduct search and rescue operations after a devastating flash flood wrecked towns, its Foreign Ministry said on Friday (August 28).\n“The offer for help is natural. Our security agencies are doing the search and rescue operation. For now we don’t require such help,” Lok Bahadur Chhetri, spokesperson for the Foreign Ministry said on Friday.\n-Reuters\nAugust 28, 2026 09:50\nAll stranded tourists in China's Tibet Autonomous Region, says China\nAll stranded tourists in China’s Tibet Autonomous Region have been transferred and residents affected by a mudslide in Gyirong County have been resettled, local authorities said, China’s Xinhua news agency reported.\nA total of 499 villagers and construction workers have all been properly accommodated. Meanwhile, 555 affected tourists were evacuated and transferred under the coordination of cultural and tourism authorities. No tourists remain stranded.\nCivil aviation authorities have also joined the rescue efforts. As of 3 p.m. Thursday, civil aviation services had transported 324 rescue personnel and delivered 24 tonnes of rescue equipment, daily necessities and medical supplies to the disaster-hit area, providing support for emergency response and the relocation of affected residents.\n- Ananth Krishnan\nAugust 28, 2026 09:35\nFresh flood warnings for disaster-hit Nepal and Tibet, 1,400 still missing\nChina and Nepal warned of fresh flooding risks, complicating rescuers’ search on Friday (August 28) for more than 1,400 people missing after a deadly deluge and landslides swept away entire villages along their remote Himalayan border.\nEmergency teams were racing to pluck survivors from affected zones, while Nepali soldiers used sniffer dogs to search for bodies buried under the suffocating dirt.\nBut their efforts are hampered by fears of new floods as water trapped by the immense piles of debris blocking the valley risks surging out.\n-AFP\nAugust 28, 2026 09:20\nSri Lanka extends $1 million in assistance to Nepal after flash floods\nSri Lanka on Thursday (august 27) said it will extend $1 million in financial assistance to Nepal after flash floods in the country claimed hundreds of lives and left over a thousand missing.\nThe assistance demonstrates Sri Lanka’s solidarity with the people of Nepal following the floods, Sri Lanka’s foreign ministry said in a statement.\nPresident Anura Kumara Dissanayake has directed the government to provide a financial contribution of $1 million to Nepal, the statement said.\n-PTI\nAugust 28, 2026 09:13\nU.S. undersecretary speaks to Nepal FM, conveys condolences over flood tragedy\nNepal’s Foreign Minister Shisir Khanal on Thursday (August 27) spoke to U.S. Under Secretary of State for Political Affairs Allison Hooker over the phone and received condolences over the loss of lives and property in the devastating flash floods, as the two sides discussed ongoing search and rescue efforts.\nThe conversation came a day after the ", "translation_ja": "", "vocab": [{"word": "geomorphologists", "definition": "地形学者。地球表面の形状や地形の変化を研究する科学者を指します。"}, {"word": "bedrock", "definition": "基盤岩。地表下の堆積物の下にある固い岩盤を意味し、地質学的な土台となります。"}, {"word": "devastating", "definition": "壊滅的な、甚大な被害をもたらす。大規模な破壊や損失を引き起こす様子を表現します。"}, {"word": "debris", "definition": "がれき、破片。洪水や災害によって散乱した建物や物質の残骸を指します。"}, {"word": "hampered", "definition": "阻害された、妨げられた。進行を遅くする、または困難にする状況を表現します。"}, {"word": "solidarity", "definition": "連帯、団結。国家や団体が困難な状況にある相手を支援する姿勢を示します。"}]}, {"title_ja": "トランプ政権が留学生のインターンシップ就労許可を制限", "title_en": "Trump Administration Restricts Internship Work Authorization for International Students", "summary_ja": "トランプ政権は留学生の実務訓練（CPT）就労許可を制限するメモを発行し、規制に従わない大学は外国人学生の入学認定を失う可能性があると警告した。UCLAとUCバークレーを含む主要大学は、連邦政府の指針に対応して特定の就労許可申請を一時停止している。この措置は、様々な政策とパレスチナ支持デモに対する大学への精査の一環である。", "summary_en": "The Trump administration has issued a memo restricting Curricular Practical Training authorizations for international students, warning universities that non-compliance could result in loss of certification to enroll foreign students. Major universities including UCLA and UC Berkeley have paused certain work authorization applications in response to the federal guidance. The move is part of broader Trump administration scrutiny of universities over various policies and pro-Palestinian protests.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-administration-seeks-to-restrict-internships-for-international-students/article71399036.ece", "state_media": false, "category": "社会", "full_text": "President Donald Trump’s administration has issued a memo for universities that seeks to restrict the issuance of certain internship work authorisations for international students, as the federal government warned that colleges not complying with the regulations may lose certification to enroll foreign students.\nThe federal memo dated August 24 said the Student and Exchange Visitor Program, which is part of the U.S. Immigration and Customs Enforcement agency, has “observed a rise in Curricular Practical Training (CPT) authorisations that appear to violate regulatory requirements which permit CPT only where the training is an integral part of an established curriculum.”\n“Failure to comply with SEVP regulations may result in an institution losing certification to enroll foreign students,” the memo said.\nIt resulted in some schools, including the University of California, Los Angeles and the University of California, Berkeley, pausing certain applications for work authorizations for international students.\n“UCLA has paused certain Curricular Practical Training authorisations while it reviews recent federal guidance and determines next steps,” a UCLA spokesperson said.\nUC Berkeley’s international office said the August 24 memo was “more narrow in focus, more direct, and includes content that is more restrictive in nature.” The federal government had also issued an earlier memo in mid-August.\nThe UC Berkeley international office said it is extending the pause for certain work authorizations for international students for “the foreseeable future.” It said it will continue processing “degree-requirement” CPT as normal and would resume processing “Doctoral Dissertation and Master’s Thesis Research CPT.”\nThe office said it would consult with legal experts to develop new processes that align with new federal requirements.\n“Nothing about these regulations has changed,” the Department of Homeland Security, ICE’s parent, said in a statement. “However, schools and employers should consider themselves on notice: under President Trump, abuse of this generous system will no longer be tolerated.”\nMr. Trump has targeted universities with probes and funding threats over issues like pro-Palestinian protests against U.S. ally Israel’s assault on Gaza, diversity initiatives, climate programs and transgender policies.\nRights advocates have raised free speech, academic freedom and due process concerns.\nSeparately, the U.S. Justice Department alleged on Thursday admissions practices at the George Washington University School of Medicine and Health Services favored Black and Hispanic applicants, citing findings of a probe as the Trump administration continued its diversity crackdown.\n“We are disappointed by the DOJ’s conclusions, which we believe are incorrect,” the university said, saying the admissions policies were in compliance with law and not discriminatory.\nThe Justice Department has alleged similar bias at other schools, saying the department aims for settlement talks. If those efforts fail, the department will file suit, it said.\nMr. Trump’s administration has also revoked the visas of student protesters over pro-Palestinian protests that it casts as antisemitic and sympathetic to extremists.\nProtesters, including some Jewish groups, say opposition to Israel’s assault on Gaza and its occupation of Palestinian territories is not antisemitic and advocacy for Palestinian rights is not the same as supporting extremism.\nPublished - August 28, 2026 09:15 am IST", "translation_ja": "", "vocab": [{"word": "integral", "definition": "全体として不可欠な、本質的な部分という意味。ここでは「実務訓練がカリキュラムの欠かせない部分である」という文脈で使用されている。"}, {"word": "certifications", "definition": "公式な承認や資格という意味。大学が外国人学生を受け入れるための公的な許可や認定を指す。"}, {"word": "compliance", "definition": "規則や要件に従うことを意味する。政府の規制に従わないと罰せられる可能性があることを示している。"}, {"word": "discriminatory", "definition": "不公正な差別的扱いを意味する。特定のグループに対して不当に異なる待遇をすることを指す。"}, {"word": "crackdown", "definition": "厳しい取り締まりや弾圧という意味。当局が特定の行為や政策に対して強硬な措置を取ることを指す。"}, {"word": "probes", "definition": "詳細な調査や審査という意味。政府が大学の特定の慣行や政策について行う公式な調査を指す。"}]}, {"title_ja": "米軍がメキシコ麻薬カルテルの無人機3機をレーザーで撃墜、国境近く", "title_en": "U.S. Military Uses Laser to Down Three Mexican Cartel Drones Near Border", "summary_ja": "米軍はテキサス州リオグランデ・バレー地域で高出力レーザーシステムを配備し、2026年8月25～26日に米メキシコ国境近くで活動するメキシコの麻薬カルテルの無人機3機を撃墜した。米当局者は、これらの無人機が軍および国境警備要員に物理的な脅威をもたらし、麻薬密輸と監視に使用されていると述べた。この作戦は、トランプ政権による南部国境での移民とカルテル活動の取り締まりの広範な取り組みの一環である。", "summary_en": "The U.S. military deployed a high-energy laser system in Texas's Rio Grande Valley to shoot down three drones operated by Mexican drug cartels near the U.S.-Mexico border on August 25-26, 2026. U.S. officials stated the drones posed a physical threat to military and border protection personnel and were being used for drug smuggling and surveillance. The operation is part of the Trump administration's broader effort to clamp down on immigration and cartel activities along the southern border.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-military-uses-laser-to-down-three-mexican-cartel-drones-near-border/article71398995.ece", "state_media": false, "category": "政治", "full_text": "The U.S. military used a laser in southern Texas' Rio Grande Valley to shoot down three Mexican drug cartel drones this week near the U.S.-Mexico border, U.S. officials said on Thursday (August 28, 2026).\nThe North American Aerospace Defence Command and U.S. Northern Command said in a statement that the operation took place late on Tuesday (August 25) and early on Wednesday (August 26) and used the Army Multipurpose High Energy Laser.\nThe military did not give the precise location of the strikes nor make clear whether it took place over U.S. or Mexican territory. Mexican President Claudia Sheinbaum has said any unilateral U.S. action on Mexican soil would be a grave breach of her country's sovereignty.\nThe military said the drones posed \"a physical threat\" to U.S. military and U.S. Customs and Border Protection personnel.\n\"Cartel networks are increasingly employing unmanned aircraft systems to facilitate illicit human-smuggling and actively spy on our personnel and law enforcement partners,\" Major General Curtis Taylor, the commander of Joint Task Force–Southern Border, said in a statement.\nThe announcement comes as U.S. President Donald Trump's administration seeks to clamp down on immigration and cartels, seeking to fulfill promises from his 2024 presidential campaign.\nSince its establishment in 2025, the border task force has conducted tens of thousands of detection and monitoring patrols and thousands of observation flights, the task force said.\nThe military did not specify the manufacturer of the laser system.\nAeroVironment Inc delivered its first two multi-purpose high-energy lasers to the U.S. Army last summer.\nThe U.S. Army has previously deployed AeroVironment Inc's LOCUST system. The deployment of that system led to a seven-hour airspace shutdown near Texas' El Paso International Airport earlier this year.\nIn February, the military accidentally shot down a U.S. government drone using a laser-based anti-drone system, congressional aides told Reuters at the time.\nU.S. security officials have expressed concern about the use of drones by Mexican cartels, which mostly employ crudely adapted versions of off-the-shelf models to drop drug packages or surveil trafficking routes.\nIn parts of Mexico farther from the U.S. border, cartels have used drones to drop explosives in deadly attacks. U.S. and Mexican authorities are working together to combat the rise of drones in the border region.\nPublished - August 28, 2026 09:05 am IST", "translation_ja": "", "vocab": [{"word": "breach", "definition": "条約や約束などの破棄、または侵害を意味する。「sovereignty」と組み合わせて国家主権への侵害を指す。"}, {"word": "unilateral", "definition": "一方的な、または一国が独断的に行う行為を示す。国際関係では他国の同意なしに行動することを指す。"}, {"word": "facilitate", "definition": "何かを容易にする、促進する、または可能にすることを意味する。犯罪活動などの不正行為を助長する文脈で使われることもある。"}, {"word": "clamp down", "definition": "厳しく取り締まる、または規制を強化することを意味する。通常、違法行為や問題行動に対する強硬姿勢を示す。"}, {"word": "unmanned aircraft systems", "definition": "操縦者が乗り込まない航空機、つまりドローンのことを指す。軍事や民間用途で広く使用されている。"}, {"word": "surveillance", "definition": "監視や偵察を意味する。特に人物や地域の活動を継続的に観察することを指す。"}, {"word": "deployment", "definition": "人員や装備などを実際の運用場所に配置することを意味する。軍事用語として広く使われている。"}]}, {"title_ja": "アイビーリーグの教授らがカナダの5億4100万ドルの新研究プログラムに移住", "title_en": "Ivy League Professors Flee to Canada's New $541M Research Program", "summary_ja": "アイビーリーグの教授たちがアメリカを離れ、カナダの新しい5億4100万ドルの研究イニシアティブに参加している。この動きは、トランプ政権下のアメリカの政治情勢への懸念と、カナダが世界的な研究拠点として優秀な学者を引き付けようとする努力を反映している。このプログラムはカナダの世界的な研究ハブとしての地位を強化することを目指している。", "summary_en": "Ivy League professors are leaving the United States to join Canada's new $541-million research initiative. The exodus reflects concerns about the current political climate in Trump's America and Canada's efforts to attract top academic talent. The program aims to strengthen Canada's position as a global research hub.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi3AFBVV95cUxOSjk3cXNDOUh4d1lVamJXWGVEZ3N4dElHTjVFREVGc25jR1l5TC01eTljbHg3SWdiaGRwMHl6QllGSmRDb2xIbmlXVzZQY2hWMzRtTS1UVVhCMUgtTXZyaUI0X0kwSG12dDBQcGZNdy01cm9ZLUo0V1lraHZhazcyMXlpUmthZm1sUkQzT3NMaEVhSVlWSkRTSncyXzltbDMteFZWZEtqTWlURmlQVm9ZeTdaZHh1bFB0Z2YzU21Bc3ZJdnJaVUJEdUZmOEhjOXY3aGNuSU5OMmJEWnVL?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "メープルリーフスのファンがチケット価格に衝撃と不満を表明", "title_en": "Maple Leafs fans express shock and frustration over ticket prices", "summary_ja": "トロント・メープルリーフスのファンは試合観戦のための高いチケット価格について懸念を表明し、多くのファンが購入に苦労しています。MLSEはファンの批判に対応し、価格設定戦略に関する不満に対処しています。この議論は、チケット料金の手頃さについてフランチャイズとファンベースの間で続く緊張を浮き彫りにしています。", "summary_en": "Toronto Maple Leafs fans have voiced their concerns about the high cost of attending games, with many struggling to afford tickets. MLSE has responded to the criticism, addressing fan complaints about pricing strategies. The debate highlights ongoing tension between the franchise and its fanbase over ticket affordability.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikAJBVV95cUxPazVrX3otdEpudm9VdHBZN2YzUF9Qckh4SzdFUldmQkIxMkxUMEhyUjN1ejVzS1g1a2tqbldIZ2RWdVZYTHh6WERmTzg0aWhycGdjMjBuLVFtcTlxMGpybmpmUnZ0MVd0Mkg3ZmhmYmt1aDhoU29XUno3ZnZ5RnpJdEs3dFR1MUFiUmpVWUZSMG9OWVM4TnRkNThINkRoOEc5Rjl4VGVuNVUwbDgzQWNacXBfVEk2SEI0Z0w2eVhUNmxkUFdWN1o3VVNEa1FVRGNfV2prU1M0bGJMRlE1RDFDdGlvTnYtYk43NGxQSDhUWVVXekUzbGZvSUhjcDlnRHRrUThGNjQxbDZVNHZzVHZ5SQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ自動車関税：誤った政策が本当の脅威を見落とす", "title_en": "Trump's Auto Tariffs: A Misguided Policy Missing the Real Threat", "summary_ja": "トランプ大統領の自動車関税提案は経済的に悪い政策であり、自動車産業が直面する真の競争上の課題に対処していないとする論説。これらの関税は業界の根本的な問題を見落とし、予期しない経済的影響をもたらす可能性があると分析している。", "summary_en": "An opinion piece argues that Trump's proposed tariffs on automobiles represent poor economic policy that fails to address genuine competitive challenges. The analysis suggests these tariffs miss the underlying issues affecting the auto industry and may cause unintended economic consequences.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMigwJBVV95cUxOMmtCLWVLQXdFTGdRVnFsNEhSV01VNnR5OGltWldDTmt0c0R0VlpmNGcxR0xWWmtTQjEybFlzTEZORXlIMktkXzRSYngxTnQxYnpMXzJxWjJJaTA5R0N1UDlwc0xLaXNZaGxpM3c5NEx6cVY4ZzhLNEl3a1lJbFE5RFhQTWJBc3BzLWdGWExYdVE0eFNxM2Z5azlrenQtR3l4bzBjbzVjRFpkd1Bnckx4NkZ1bGtSZ0NCZ0ZsdlA1VFdMdHhGX0JGYTJzNFB5NVZVVWI2YTRieWlMMFhCUzRyUEtFUFlta01DLVlIczk5NXB2eEdTVE1JdmRSMExLODZrMklR?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O グロボ英語ニュース", "title_en": "O Globo English News", "summary_ja": "O Globoは国際的な読者向けに英語での最新ニュースカバレッジを提供しています。同紙はブラジルと世界的なイベントに関する包括的なレポートを継続して配信しています。", "summary_en": "O Globo presents its latest news coverage in English for international readers. The publication continues to deliver comprehensive reporting on Brazilian and global events.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE00WVFsTjVqR2xZQjFKaFZSNHBGUkpwZ2RhZXRRVUpPeHpoNXlfWENGNkN1VW9xOEtmby1oNVpYZVc2Y2huaWh2SnpvdExUbEJvZWhhc3ZXWnRFM2xIcVFiajR4UHA4NENhYXc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2025年に注目すべきブラジルのテニス期待の星ジョアン・フォンセカ", "title_en": "Why João Fonseca is Brazil's Tennis Star to Watch in 2025", "summary_ja": "ジョアン・フォンセカは2025年に向けてブラジル最有望のテニス選手として台頭している。若き才能は国際テニス界での成功に対するブラジルの期待を背負い、今後1年で大きな活躍が期待されている。", "summary_en": "João Fonseca has emerged as Brazil's most promising tennis talent heading into 2025. The young athlete represents the country's hopes for success on the international tennis circuit and is poised to make significant impact in the coming year.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE1MNWptTnpaTlFMQTc3WmpTYXdqMVluczNiTHhZQUotNnJoRWZydHZtdm1HdjJqOGVQXzFNT0t6cUZzODBVV3F0TmZDNTNCQVdrUmRQWDdtR1ZYLXMtMURzUnU5Y0RnS3U3eWc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O Globo：我々の歴史を誇りに、未来へ向かって", "title_en": "O Globo: Proud of Our History, Looking to the Future", "summary_ja": "ブラジルの主要新聞であるO Globoは、その歴史的な成功を振り返りながら、将来の成長と関連性を確保するための方針を示している。同紙は、ジャーナリズムの質の向上とブラジルメディア史における自らの役割の重要性を強調している。", "summary_en": "O Globo, a prominent Brazilian newspaper, reflects on its storied past while positioning itself for future growth and relevance. The publication emphasizes its commitment to quality journalism and its role in Brazilian media history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "麻薬密売の中心地だったリバーズ州精神神経科病院が改築される", "title_en": "Rivers Neuropsychiatric Hospital Upgraded After Being Used as Drug Trafficking Centre", "summary_ja": "リバーズ州のシミナライ・フバラ知事は、改築された精神神経科病院および総合病院の竣工式を行い、精神科病院の敷地が以前は麻薬密売の中心地だったことを明かした。改築された精神神経科病院は現在、精神衛生と物質乱用治療のための100床のリハビリテーションセンターを備えており、新しい総合病院は地域社会に包括的な医療サービスを提供している。", "summary_en": "Governor Siminalayi Fubara of Rivers State commissioned a newly upgraded Neuropsychiatric Hospital and General Hospital in Rumuigbo, revealing that the psychiatric facility's premises were previously used for drug trafficking. The renovated Neuropsychiatric Hospital now has a 100-bed rehabilitation centre for mental health and substance abuse treatment, while the new General Hospital provides comprehensive healthcare services to the local community.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/905886-rivers-neuropsychiatric-hospital-was-drug-trafficking-centre-says-fubara.html", "state_media": false, "category": "社会", "full_text": "Rivers State Governor Siminalayi Fubara has said the premises of the state’s Neuropsychiatric Hospital in Rumuigbo, Obio/Akpor Local Government Area, were previously used as a centre for drug trafficking.\nMr Fubara disclosed this on Thursday while commissioning the newly upgraded Neuropsychiatric Hospital alongside a new General Hospital in Rumuigbo.\nHis remarks were contained in a statement sent to PREMIUM TIMES on Thursday by his spokesperson, Onwuka Nzeshi.\n‘This premises was a drug trafficking centre’\nAccording to Mr Fubara, the Neuropsychiatric Hospital had become a location where drugs were supplied to inmates undergoing rehabilitation.\n“This premises was a drug trafficking centre. We keep people in the Rehabilitation Centre, but some of our people innocently come here to play football while others are carrying bags to sell drugs to the inmates,” the governor said.\nHe said the situation prompted his administration to secure the premises by fencing the facility and restricting access through designated gates.\nMr Fubara said the decision to rebuild and upgrade the hospital followed an inspection visit to the facility.\nHe said the Hospital Management Board had invited him to inspect a rehabilitation centre being constructed with limited overhead funds.\n“It was there and then that I said: Look, we have this very big compound, we need to rebuild, modernise and upgrade the standard of this Neuropsychiatric Hospital and that day, we started this journey,” he said.\n100-bed rehabilitation centre\nThe governor said the Neuropsychiatric Hospital was conceived in 1970 and commissioned in 1977 with a 50-bed capacity.\nFollowing the upgrade, he said the facility now has a 100-bed standard rehabilitation centre for people dealing with mental health and substance abuse challenges.\nMr Fubara said unemployment, depression and other psychological pressures contribute to mental health challenges, stressing the need for rehabilitation facilities to address the problems.\n“Even in developed countries, they send people to rehabilitation centres, and they help bring you back to normalcy. So, what we have done here is to prepare for the current challenges of our time,” he said.\nNew General Hospital\nOn the new General Hospital, Mr Fubara said Obio/Akpor, one of the largest local government areas in the state, deserved a standard healthcare facility beyond primary healthcare centres.\nHe said residents previously had to travel to the University of Port Harcourt Teaching Hospital or Braithwaite Memorial Hospital for higher-level medical services.\n“With the new General Hospital, residents can now access treatment locally and only be referred to higher facilities when necessary,” he said.\nThe permanent secretary of the Rivers State Ministry of Health, Vincent Wachukwu, said the hospital has accident and emergency services, consulting rooms, pharmacy, laboratory, X-ray rooms, delivery room, maternity, postnatal and antenatal wards.\nThe facility also has an operating theatre, a surgery recovery room, an intensive care unit, a newborn intensive care unit, paediatric wards, male and female general wards with 50 beds each, private wards, and administrative offices.\nMr Wachukwu said the Neuropsychiatric Hospital has consulting rooms, pharmacy, laboratory, male and female 50-bed wards, a substance and drug-abuse rehabilitation centre, 50-bed private wards, recreational spaces and a meeting hall.\nOther facilities include an electroconvulsive therapy centre, ICT centre, canteen, mortuary, generator house, internal road networks and landscaping.\nThe complex also has a 216-bed students’ hostel and staff quarters comprising 12 two-bedroom apartments.\nMr Wachukwu said both hospitals were furnished with modern equipment for diagnosis and treatment and each provided with a new ambulance.\nThe complex is supported by a 500KVA transformer, 350KVA generating set and solar panels with inverter batteries providing 120KVA.\nOsigwe urges end to stigma\nThe outgoing President of the Nigerian Bar Association, Afam Osigwe, who performed the ceremonial cutting of the ribbon, commended the Rivers State Government for investing in healthcare and prioritising mental health.\nMr Osigwe urged the public to stop stigmatising people seeking mental healthcare, saying such care encompasses stress, depression and personal crises and is not limited to severe psychiatric disorders.\nMr Fubara also urged the Obio/Akpor council chairman and the host community to take ownership of the facilities and protect them from theft and vandalism.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "neuropsychiatric", "definition": "精神神経医学に関する。精神疾患と神経系の疾患の両方を対象とする医療分野を指す。"}, {"word": "rehabilitation", "definition": "リハビリテーション。薬物乱用や精神疾患から回復するための治療や支援プログラムのこと。"}, {"word": "stigmatising", "definition": "社会的烙印を押すこと。特定の人々や状態に対して負の評価や偏見を持つこと。"}, {"word": "commissioned", "definition": "正式に稼働させる、就役させる。建物や施設の完成を認めて正式に使用を開始させること。"}, {"word": "comprehensive", "definition": "包括的な、広範な。多くの領域やサービスを網羅した、全面的な。"}, {"word": "vandalism", "definition": "器物損壊。公共の物や他人の財産を故意に破壊または損傷する行為。"}, {"word": "overhead", "definition": "経営上の間接費用。施設の維持管理にかかる基本的な費用のこと。"}]}, {"title_ja": "ティヌブ大統領、CNG充填ステーション500箇所を追加指示し全国の運輸料金低下を目指す", "title_en": "Tinubu Orders 500 More CNG Stations to Lower Transport Fares Nationwide", "summary_ja": "ティヌブ大統領はナイジェリア全土に500箇所の追加CNG充填ステーション配置を指示し、燃料補助金廃止後の運輸コスト削減のため計画総数を1,000箇所に拡大した。すでに120,000台以上の車両がCNGに転換されており、政府は10月1日からの安価な運輸料金への還元を目指している。連邦および州の合同委員会が実施を監督し、低い運営コストが乗客に還元されることを確保する。", "summary_en": "President Tinubu has directed the deployment of 500 additional CNG refuelling stations across Nigeria, bringing the total planned network to 1,000 stations to reduce transportation costs after subsidy removal. Over 120,000 vehicles have already been converted to CNG, with the government aiming to translate fuel savings into cheaper transport fares from October 1. A joint federal-state committee will oversee implementation to ensure lower operating costs benefit commuters.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/headlines/905883-tinubu-orders-500-more-cng-stations-targets-lower-transport-fares-nationwide.html", "state_media": false, "category": "政治", "full_text": "President Bola Tinubu has directed the rollout of 500 additional Compressed Natural Gas (CNG) refuelling stations across Nigeria as part of efforts to reduce transportation costs following the removal of the petrol subsidy.\nThe additional stations will bring the planned number of CNG refuelling stations under the federal government’s programme to 1,000 nationwide.\nMr Tinubu disclosed this on Thursday after a meeting with the Nigeria Governors’ Forum, saying the governors had agreed to take immediate measures to reduce transportation costs in their respective states.\nHe said the focus would be on expanding the use of CNG and electric vehicles, particularly for intra-state transportation, where Nigerians have continued to bear the brunt of rising fares.\n“From October 1, our goal is that Nigerians begin to partake in those savings through lower transport fares. We have agreed that cheaper fuel should result in cheaper fares,” Mr Tinubu said in a statement personally signed by him and posted on his X handle.\nThe president said the federal and state governments had agreed to establish a joint committee to begin implementing measures aimed at reducing transport costs.\nHe said the committee would work to ensure that savings from cheaper alternative energy sources translate into lower fares for commuters.\nCNG expansion\nAccording to Mr Tinubu, more than 120,000 vehicles have so far been converted to CNG nationwide under the Presidential CNG Initiative, while more than 100,000 additional conversion kits are being processed.\nHe said the federal government was also expanding conversion centres and refuelling infrastructure across the country to support the growing number of CNG-powered vehicles.\nThe president said the Midstream and Downstream Gas Infrastructure Fund was financing more than 100 gas projects nationwide. They include 15 CNG mother stations and 86 daughter stations.\nFour of the projects were commissioned in May in Lagos, Abuja and Owerri, according to Mr Tinubu.\nAmong them was a 15-station CNG refuelling network in Lagos and a facility in Abuja capable of serving up to 1,000 cars and tricycles and 50 trucks and buses daily.\nMr Tinubu said the government had earlier ordered 500 CNG stations through the Midstream and Downstream Gas Infrastructure Fund.\nHe has now directed the rollout of another 500 stations, bringing the planned network to 1,000 stations across the country.\nThe president said the expansion was particularly important for intra-state transportation because that was where the high cost of transport was most directly felt by Nigerians.\nREAD ALSO: Tinubu orders comprehensive football reform after Gusau’s resignation\nHe said CNG-powered vehicles could spend between 60 and 80 per cent less on fuel than petrol-powered vehicles.\nThe expected savings, he said, should be reflected in transport fares from October 1.\nMr Tinubu urged federal and state authorities to work together to ensure that the lower operating costs associated with CNG translate into cheaper transportation for Nigerians.\n“Each tier of government must keep doing its part and work together for the benefit of every Nigerian,” the president said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "rollout", "definition": "新しい製品やサービスを段階的に導入・展開すること。通常は計画的で組織的な導入プロセスを指す。"}, {"word": "subsidy", "definition": "政府が企業や消費者を支援するために提供する資金援助。このケースでは燃料価格を低く保つための政府補助を意味する。"}, {"word": "infrastructure", "definition": "産業や活動を支える基本的な施設やシステム。ここではCNG充填ステーションなどの物理的設備を指す。"}, {"word": "intra-state", "definition": "州内での、または州の内部における。国家間（inter-national）と対照して、同じ地域内での移動や取引を示す。"}, {"word": "commissioned", "definition": "建設や製造が完了し、正式に使用開始された状態。施設やプロジェクトが公式に稼働状態に入ったことを意味する。"}, {"word": "translate", "definition": "ここでは「変換される」「反映される」という意味で、ある形態から別の形態に変わることを示す。"}]}, {"title_ja": "汚職対策委員会、偽造機関スキャンダルで13人の公務員に懲戒処分を勧告", "title_en": "ICPC Recommends Disciplinary Action Against 13 Officials in Fake Agency Scandal", "summary_ja": "ナイジェリアの反腐敗機関ICPCは、法的に設立されなかった架空の大統領外交介入促進評議会（PFIPC）に政府システムへのアクセスを提供した13人の公務員に対する懲戒処分を勧告しました。偽造機関の責任者アデニイ・アデイェミは、文書偽造と詐称を含む複数の罪で起訴が勧告されています。調査により、この架空組織が偽造文書を通じて連邦官僚機構の多くの層に浸透し、銀行口座を開設し、オフィススペースを取得した方法が明らかになりました。", "summary_en": "Nigeria's anti-corruption agency ICPC has recommended administrative action against 13 public officials who facilitated access to government systems for a fraudulent Presidential Foreign Intervention Promotion Council (PFIPC) that was never legally established. The agency's director, Adeniyi Adeyemi, has been recommended for prosecution on charges including forgery and impersonation. The investigation reveals how the fake organization penetrated multiple layers of the federal bureaucracy, opening bank accounts and obtaining office space through forged documents.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/headlines/905877-fake-agency-scandal-icpc-recommends-disciplinary-action-against-13-officials-full-names.html", "state_media": false, "category": "経済", "full_text": "The Independent Corrupt Practices and Other Related Offences Commission (ICPC) has recommended administrative action against 13 public officials over their roles in the scandal involving the illegal Presidential Foreign Intervention Promotion Council (PFIPC).\nThe recommendation is contained in an ICPC investigation report examining how the organisation, which was not established by a valid legal instrument, gained access to government offices, financial systems and other administrative privileges.\nThe commission also recommended the prosecution of Adeniyi Adeyemi, the man who presented himself as the Director-General of the PFIPC, for forgery, impersonation, making false statements to public officers and criminal misrepresentation.\nThe recommendations offer a fresh indication of how deeply the purported agency penetrated the federal bureaucracy before the Presidency eventually disowned it.\nThe ICPC investigation followed President Bola Tinubu’s directive for a probe into the PFIPC. In its interim report submitted to the President on 6 August, which PREMIUM TIMES obtained, the commission said Mr Adeyemi was never appointed by the federal government and that the PFIPC was not established by any law, executive order or other valid government instrument.\n13 officials recommended for administrative action\nThe ICPC recommended administrative action against Mimi Abu, director of the Organisation Design and Development Department at the Office of the Head of the Civil Service of the Federation; Rosemary Achem, special adviser on administration to the Director-General of the Budget Office of the Federation; and Patricia Akhigbe, an assistant director at the Ministry of Budget and National Planning.\nOthers are Aminu Abdullahi, schedule officer, Office Allocation, Office of the Secretary to the Government of the Federation; Bello Abdullahi, assistant director, IPSAS, National Chart of Accounts, Consolidated Account Department, Office of the Accountant-General of the Federation; Sanni Olubunmi, director, Inspectorate Department, OAGF; and Jousha Kadiri Luka, director, Consolidated Accounts Department, OAGF.\nThe list also includes Muazu Balami, deputy director, Risk and Review, Inspectorate Department, OAGF; Omameh Florence, assistant director, Inspectorate Department, OAGF; Akinlose Moses, Inspectorate Department, OAGF; Ogaba Harry, chief accountant, OAGF; Esther Orji Okoli, principal executive officer I, OAGF; and Ogunbade Habeebat Ajibola, manager, Compliance and Regulation Department, National Information Technology Development Agency (NITDA).\nThe commission also recommended that the affected institutions implement relevant reforms identified in the report.\nPREMIUM TIMES reported that Mr Adeyemi used documents presented as official presidential instruments to obtain office accommodation, seek self-accounting status and facilitate the opening of Central Bank of Nigeria accounts for the PFIPC. Several government agencies processed his requests on the assumption that the organisation was a legitimate federal institution.\nFurther investigation recommended\nBeyond the administrative action, the ICPC recommended further investigation into the roles played by the Ministry of Foreign Affairs and the Ministry of Finance in what it described as the process through which legitimacy was accorded to the PEAC/PFIPC.\nIt also recommended inviting and interviewing officials and individuals connected to the newly uncovered fake MDAs, forged legislative Acts and Unity Bank accounts.\nThose listed for further questioning include the managing director, chief compliance officer and relationship or account officer responsible for the Unity Bank accounts linked to the organisation.\nThe ICPC also recommended the invitation of OAGF officials, Adekunle Ajayi and Lovina Akabueze.\nIt further recommended an analysis of all bank accounts linked to Mr Adeyemi, as well as other sources of funds he claimed to have obtained as loans.\nThe recommendations come against the backdrop of mounting evidence that the purported agency was able to navigate several layers of the federal bureaucracy without its legal status being independently verified.\nPREMIUM TIMES reported in July how the Office of the Secretary to the Government of the Federation, the Office of the Accountant-General of the Federation and the CBN acted on requests from Mr Adeyemi’s organisation.\nIn one instance, the OAGF wrote to the CBN on 29 July 2025 requesting the creation of four domiciliary accounts for two MDAs, including the PFIPC. The CBN subsequently confirmed the creation of dollar and pound accounts for the purported agency.\nMr Adeyemi also obtained access to office space at the Federal Secretariat in Abuja after presenting documents to government authorities. PREMIUM TIMES reported that he had approached the OSGF in November 2024 seeking office accommodation and self-accounting status.\nHow the purported agency gained legitimacy\nAccording to the ICPC report, the PFIPC operated witho", "translation_ja": "", "vocab": [{"word": "administrative action", "definition": "公式な懲戒手続きまたは組織内での処分措置。通常、解雇ではなく訓告や昇進の見送りなどを含む。"}, {"word": "impersonation", "definition": "不正な目的で他人になりすまさせること。特に、公務員や公式な立場を持つ人物のふりをする犯罪行為。"}, {"word": "forgery", "definition": "文書、署名、または通貨を詐欺的な目的で複製または変更する行為。法的に重大な犯罪。"}, {"word": "domiciliary accounts", "definition": "外貨建てで銀行に開設される口座。特に発展途上国で外国人や企業が使用する。"}, {"word": "penetrated", "definition": "組織や防御システムに深く入り込むこと。この文脈では、不正な方法で複数の政府機関に影響を及ぼしたことを意味する。"}, {"word": "bureaucracy", "definition": "複雑な行政機構と官僚制度。多くの規則と承認手続きを持つ政府システム。"}]}, {"title_ja": "洪水の脅威が続く中、行方不明者と取り残された人々の捜索活動", "title_en": "Rescuers Search for Missing and Stranded as Flood Threat Continues", "summary_ja": "ネパールとチベットでの豪雨により数百人が死亡し、1,400人以上が行方不明となっています。目撃者によると、瓦礫と水の奔流が数分で村全体を押し流したと述べています。追加の洪水警報の中、救助活動が続いています。", "summary_en": "Hundreds have been killed in Nepal and Tibet, with over 1,400 people still missing following devastating floods. Witnesses reported torrents of debris and water destroying entire villages within minutes. Rescue operations continue amid warnings of additional flooding.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/08/27/world/nepal-tibet-flash-floods", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドローンが見えない場所で：ウクライナ戦争は命がけの追いかけっこ", "title_en": "Where Drones Cannot See, the Ukraine War Is a Deadly Game of Cat and Mouse", "summary_ja": "ロシア軍は3年前に破壊されたダムの広大な貯水池盆地に侵入を試み、ウクライナ兵士は近接戦闘で彼らを追撃している。空中監視から隠された地形では、従来型ドローン偵察が効果的でない。この地域での紛争は、現代的な監視技術の及ばない地上レベルの激しい戦闘が繰り広げられていることを浮き彫りにしている。", "summary_en": "Russian troops are attempting to infiltrate the overgrown reservoir basin of a dam destroyed three years ago, while Ukrainian soldiers engage them in close-quarters combat. The terrain, obscured from aerial surveillance, has become a deadly battleground where traditional drone reconnaissance proves ineffective. The conflict in this area highlights the intense, ground-level fighting occurring beyond the reach of modern surveillance technology.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/27/world/europe/ukraine-russia-war-zaporizhzhia-frontline-fighting.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア制裁がカナダの自動車窃盗の急増を招く", "title_en": "Russian Sanctions Fuel Surge in Canadian Car Thefts", "summary_ja": "ロシアへの制裁により盗難車の違法取引市場が急拡大し、ロシアがカナダから盗まれた自動車の最大の仕向地となっている。密輸業者がこの需要を利用して利益を得ており、国際的なサプライチェーンの混乱に伴い、カナダ全土での自動車窃盗事件が増加している。", "summary_en": "Russian sanctions have created a booming black market for stolen vehicles, with Russia becoming the largest destination for cars stolen from Canada. Smugglers are capitalizing on the demand, driving up theft rates across the country as international supply chains are disrupted.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/27/world/canada/canada-car-theft-russia-sanctions.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが検問所を開放、パレスチナ人がガザ北部へ帰還開始", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "イスラエルは人質釈放交渉の膠着状態が打開されたことを受け、ガザを二分する軍事地帯を横切ることを許可し、避難していたパレスチナ人が北部地区への帰還を開始した。この措置により、長期間にわたり立ち入りを制限されていた地域への移動が可能になった。", "summary_en": "Israel has allowed displaced Palestinians to begin crossing through a military zone that divides Gaza, following a breakthrough in negotiations over hostage releases. The move enables residents to return to the northern part of the enclave after being blocked from the area. This development comes after a deadlock in hostage negotiations was resolved.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額赤字を報告、不動産危機の拡大を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国最大級の不動産開発企業ワンケが巨額の赤字を報告し、同国の不動産危機がさらに深刻化していることへの懸念が高まっている。大手開発企業の経営難は、中国政府が経営難に陥った不動産セクターの安定化に介入するかどうかについての疑問を引き起こしている。この状況は、中国の不動産市場が直面するより広範な課題とその潜在的な経済への影響を浮き彫りにしている。", "summary_en": "Vanke, one of China's largest property developers, has reported significant losses, raising concerns about the deepening real-estate crisis in the country. The financial troubles at the major developer have sparked questions about whether the Chinese government will intervene to stabilize the struggling sector. The situation highlights the broader challenges facing China's property market and its potential economic impact.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片が体内に残存", "title_en": "Freed Israeli Hostages Carry Shrapnel Wounds From October 7 Attack", "summary_ja": "イスラエルの医療関係者によると、解放されたイスラエル人人質は10月7日の攻撃による破片の傷をまだ負っている。一部の女性は長期間隔離されて過ごし、8ヶ月間はトンネルの中に監禁されていた。", "summary_en": "Released Israeli hostages still bear shrapnel injuries from the October 7 attack, according to Israeli medical officials. Some women were held in isolation for extended periods and spent eight months confined in tunnels during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIが宗教を変え、宗教がAIを変えようとしている", "title_en": "AI is changing religion and religions are trying to change AI", "summary_ja": "宗教機関は、イマームや司祭が従来提供してきた精神的指導や助言を提供できるAIチャットボットの台頭に直面している。これらの技術が宗教指導者に取って代わるのか、それとも彼らがより広い聴衆に到達し、教えをより効果的に広めるのを支援するツールになるのかが問われている。", "summary_en": "Religious institutions are grappling with the rise of AI chatbots that can provide spiritual guidance and advice traditionally offered by clergy. The question remains whether these technologies will replace religious leaders or become tools to help them reach wider audiences and spread their teachings more effectively.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/27/ai-is-changing-religion-and-religions-are-trying-to-change-ai", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "衰退する大統領職がトランプをより危険にする", "title_en": "Trump's Fading Presidency Makes Him More Dangerous", "summary_ja": "トランプ大統領の政権が課題に直面する中、権力防衛への好戦的なアプローチが強まっている。エコノミスト誌は、権力維持のために激しく戦う弱体化した大統領がアメリカの民主主義と制度に独特のリスクをもたらすと警告している。", "summary_en": "As President Trump's administration faces mounting challenges, his combative approach to defending power intensifies. The Economist warns that a weakened president willing to fight fiercely poses unique risks to American democracy and institutions.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/25/as-his-presidency-flounders-trump-is-more-dangerous-than-ever", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "迎撃ミサイルが枯渇するとどうなるか", "title_en": "What happens when interceptor missiles run out", "summary_ja": "ウクライナおよび他国では、空中防衛の需要が高まる中で迎撃ミサイルの深刻な不足に直面している。増大する品不足は空襲への防御能力に対する広範な懸念を引き起こしている。この供給危機は複数の国の軍事態勢と民間人の安全を脅かしている。", "summary_en": "Ukraine and other nations face a critical shortage of interceptor missiles as demand for air defense intensifies. The growing scarcity is causing widespread concern about the ability to protect against aerial attacks. This supply crisis threatens military readiness and civilian safety across multiple countries.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルのイラン体制転覆計画の失敗", "title_en": "Israel's Failed Attempt to Overthrow Iranian Regime", "summary_ja": "イスラエル政府は2月28日に米国と開始した戦争を利用して、イランのイスラム共和制を転覆させようとした。しかし、モサドがクルド系野党勢力と元大統領マフムード・アフマディネジャドの支持を得る計画は失敗に終わった。この作戦はイスラエルの地域的野心における大きな後退を示している。", "summary_en": "The Israeli government attempted to leverage the February 28 war with the US to destabilize and topple Iran's Islamic Republic. However, Mossad's strategy to mobilize Kurdish opposition groups and enlist former president Mahmoud Ahmadinejad ultimately failed. The operation represents a significant setback to Israel's regional ambitions.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/28/israel-s-dashed-ambitions-to-topple-the-iranian-regime_6756924_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネパール・チベット洪水、死者469人以上、1400人以上が行方不明", "title_en": "Nepal-Tibet flood death toll rises to at least 469, over 1,400 missing", "summary_ja": "水曜日、氷河の崩壊がネパールとチベットで地震活動と大規模な洪水を引き起こし、少なくとも469人が死亡した。インド、米国、英国、マレーシアを含む観光客数百人を含む1400人以上が行方不明のままである。当局は被災地での捜索・救助活動を継続している。", "summary_en": "A glacial collapse triggered seismic activity and catastrophic flooding in Nepal and Tibet on Wednesday, resulting in at least 469 deaths. Over 1,400 people remain missing, including hundreds of tourists from India, the US, the UK, and Malaysia. Authorities continue rescue and recovery operations in the affected regions.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/environment/article/2026/08/26/nepal-floods-kill-at-least-19-people-with-hundreds-missing_6756872_114.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "DRC史上最悪のエボラ出血熱流行の中、治療法とワクチンが治験段階へ", "title_en": "Experimental treatments and vaccines advance amid DRC's worst Ebola outbreak", "summary_ja": "民主共和国が5月中旬にエボラ出血熱の流行を宣言して以来、2,700人以上が死亡している。保健機関は抗ウイルス薬、モノクローナル抗体、ワクチンを含む新しい治療法の開発を急速に進めている。", "summary_en": "More than 2,700 people have died since the Democratic Republic of Congo declared an Ebola epidemic in mid-May. Health organizations are rapidly developing new therapies including antivirals, monoclonal antibodies, and vaccines to combat the outbreak.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/environment/article/2026/08/28/treatments-and-vaccines-under-trial-amid-the-worst-ebola-epidemic-in-the-democratic-republic-of-congo-s-history_6756919_114.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省のニュース", "title_en": "Ministry of Defence Updates", "summary_ja": "防衛省が新しい情報と更新内容をリリースしました。読者は海峡時報のニュースレターを購読して、防衛関連の報道をさらに受け取ることができます。購読管理ページにアクセスしてニュース設定をカスタマイズしてください。", "summary_en": "The Ministry of Defence has released new information and updates. Readers can subscribe to The Straits Times newsletters for more defense-related coverage. Visit the subscription management page to customize your news preferences.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニングアップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニングアップデートは、購読者に毎日のニュース速報を提供しています。本版は2026年8月28日現在のイベントと動向をカバーしています。読者は提供されたリンクを通じて購読設定を管理できます。", "summary_en": "The Straits Times Evening Update provides daily news briefings to subscribers. This edition covers events and developments as of August 28, 2026. Readers can manage their subscription preferences through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズのモーニング・ブリーフィングは、毎日のニュース更新と主要記事を提供しています。本版は2026年8月28日に公開されました。読者はストレーツ・タイムズの追加の無料ニュースレターを購読できます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and key stories. This edition was published on August 28, 2026. Readers can subscribe to additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルがガザで武装民兵を派遣し戦争犯罪を実行していると非難", "title_en": "Israel Accused of Deploying Armed Militias in Gaza for War Crimes", "summary_ja": "ハアレツの報道によると、イスラエルがガザで戦争犯罪に該当する可能性のある作戦を実行するために武装民兵を派遣しているという疑惑が詳しく報じられている。この記事は、これらのグループを保護する役割に懸念を表明するセキュリティ作戦関係者の証言を提示している。", "summary_en": "A report from Haaretz details allegations that Israel is deploying armed militias in Gaza to carry out operations that may constitute war crimes. The article presents testimony from individuals involved in security operations who express concerns about their role in protecting these groups.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimwJBVV95cUxNOVpLbXZ1Y0xNYzFGNFk5Z3BfbWwwckM3QzNneHllVWtldnpDV2lmaHNTamstMXB1VHJnY2pqUUJKbFRJLTVQaS1GVVNtbi1CWDBoclhsZVF1MjY2S0ZQMVN0b3c2OXpBa08zMExyblY2TWk5LTdkMk8yM2Vnd28xLXFmeTBOR3hpWUpaVUZ6aGtQd1EwVmdmbjNZdzJtSWJHc2pqNnlkWjRhQ01KNmhVZkFsR1RXRnpVQTh5R1JsWFdDQnh6U1NWQjZXSWxsWVFrSWJZSlEwUmJhc1EyM0Y3dThUUmtWWDloWHFTU3ZfclQ1N3JENnZlTUJqUkF6TDJQMW5mSnBxWTdlV195TUZSbzYtNVZjZnZYWEgw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル裁判所、エルサレム旧市街での修道女暴行容疑者を無罪判決", "title_en": "Israeli Court Acquits Man Accused of Assaulting Nun in Jerusalem's Old City", "summary_ja": "イスラエルの裁判所は、エルサレム旧市街で修道女への暴行容疑をかけられていた男性を無罪判決とした。同判決は宗教共同体の一員である修道女への暴行疑惑を検討する裁判の結果である。", "summary_en": "An Israeli court has acquitted a man of charges related to an assault on a nun in Jerusalem's Old City. The decision comes after a trial examining the alleged incident involving a member of a religious community.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihAJBVV95cUxPSFRmX3BwNENqaTVIbmMtUUZ4Q0x1UXJNdEhXQzJKRnBNZzhndzRJcV9qSldqdS1jZFhDZUlrRVhGVGllbEdTTkVTODkzS3o4eWlfYldSOWw0T3ZfNTNYT2l5dldTZmxZWVpUT3pQZWxqd3pDX2Nla0tyc0ZYR19aRHpBbGkxRzJVSjRDZDdHZ0phc0VXRmcwR0hJY0hvRjQyeE9jVm5iT3N1ek42alhYYm5GTTlJcFg4ODAwdE5zakRlaHk1M2xDUXlhMm54alQ4aW0tVGRhdk5NYkhYM1JyUEk2cFFLOXZGUW04aGdQMFNQNXBxbmhlZFAzY3VCaTIyQVJLeQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "PA選挙を前にダーランがハマスとの反アッバス同盟を模索", "title_en": "Dahlan Explores Anti-Abbas Alliance with Hamas Ahead of PA Elections", "summary_ja": "パレスチナの政治家モハンマド・ダーランは、予定されているパレスチナ自治政府選挙を前にハマスとの潜在的同盟を模索していると報じられている。この動きはアッバス大統領の継続的な指導力に対する野党を構築しようとするダーランの重要な政治的転換を示している。", "summary_en": "Palestinian political figure Mohammad Dahlan is reportedly exploring a potential alliance with Hamas to challenge President Mahmoud Abbas ahead of upcoming Palestinian Authority elections. The move represents a significant political shift as Dahlan seeks to build opposition to Abbas's continued leadership.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi_AFBVV95cUxOOGk3OUlwUi1JdW15QmtOWm00bWEyNlQyRlZzbXhhczJaZmx2OFgyWHVMYThUc1JnR3dzT3d4enFJWVpkTmdfQzhZZXR3Y0xfOFA1UVRfZkZROVFISEt0N1VUcnBlcGlPczhEYmFEbGxNbmVnSURmazNhZjRtdDhhaDZwa1VTblN1Q0k4X2ZXamVkckZOUmlrc3lJdFdhQ0VydjBrYzF0ejNsSGw2ZEMxRjlIYkEtc0huRXhsZmlnWnJSeXBFUGE5Vmp1OTI3UE12US1jdUY0WmNHWkwzVV9aTTdkdzNndVpBMGs3cXl2VnRTNkRvajVNejVCc28?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、ネパール・チベット洪水後の捜索救助隊派遣を準備", "title_en": "Taiwan Prepares Search and Rescue Team After Nepal-Tibet Flood", "summary_ja": "台湾はネパールとチベットに影響を与えている壊滅的な洪水に対応するため、捜索救助チームを動員している。チームは被害地域での人道支援と救助活動の支援を目指している。", "summary_en": "Taiwan is mobilizing a search and rescue team in response to devastating floods affecting Nepal and Tibet. The team aims to provide humanitarian assistance and support rescue operations in the affected regions.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1XQTh5eGVNWW9VaVF6ekdSaFRTQ2JHWHFlRTJsNUtHdWFMVlpnTUZsUUoycUNodDFaZDdfREsxV1RvTFI5R3RieDdkWmVkS1N5b1hpb0t3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、チベット土砂崩れ後に国民の安全確認", "title_en": "Taiwan Checks Safety of Nationals After Deadly Tibet Landslide", "summary_ja": "台湾の大陸委員会（MAC）は、チベットの致命的な土砂崩れの後、台湾国民の安全確認を進めている。この災害をきっかけに、台湾は被害地域にいる国民に連絡を取り、安否確認を行っている。", "summary_en": "Taiwan's Mainland Affairs Council (MAC) is verifying the safety of Taiwanese nationals following a deadly landslide in Tibet. The disaster has prompted Taiwan to reach out to its citizens in the affected region to ensure their well-being.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5NaGlMb0lQSkd2MF9PNnBxSzZEOGM3NlpNTTRTSXNQNEQwOWMtRU5veS1CRnoySDl1Wm9ObEhHUXlFaTRUMjlBUUxvdEdCa0w5NTFqNk5rcw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "睡眠薬を麻薬密売人に販売した医師に対し桃園検察が懲役12年を求刑", "title_en": "Taoyuan Prosecutors Seek 12-Year Sentence for Doctor Who Sold Sleeping Pills to Drug Dealer", "summary_ja": "桃園の検察は、麻薬密売人に違法に睡眠薬を販売した医師に対して懲役12年の判決を求めている。本件は医療専門家が処方医薬品を通じて麻薬密売を助長していることへの懸念を浮き彫りにしている。医師の行為は違法薬物の流通に寄与したと考えられている。", "summary_en": "Prosecutors in Taoyuan have requested a 12-year prison sentence for a doctor accused of illegally selling sleeping pills to a drug dealer. The case highlights concerns about medical professionals facilitating drug trafficking through prescription medications. The doctor's actions are believed to have contributed to the distribution of controlled substances.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFAySGhleHlLbGNKNERqaGRaYTlzZWswcExmb0g3SXNnYzVsVW1Ud0VvRktYc2NVTDlYbjc4OFhQMFRvWUtHd0Z6dnpJQ0hudEh1Mll6SVdR?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コンゴ民主共和国東部に停戦検証チームが到着", "title_en": "Ceasefire verification team arrives in eastern DR Congo", "summary_ja": "CGTNが報じたところによると、停戦検証チームがコンゴ民主共和国のキヴ南州に到着し、政府軍とM23反政府勢力間の停戦違反の疑いを調査する。平和努力が進められている中でも戦闘が続いている。チームは停戦合意の遵守状況を記録・評価することが任務である。", "summary_en": "CGTN reports that a ceasefire verification team has arrived in the Democratic Republic of the Congo's South Kivu province to investigate alleged violations between government forces and M23 rebels. The deployment comes as fighting continues despite renewed peace efforts in the region. The team's mission is to document and assess compliance with ceasefire agreements.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-25/Ceasefire-verification-team-arrives-in-eastern-DR-Congo-1PTztchDeBW/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EAC諸国、教育改革と青年スキル育成への取り組みを更新", "title_en": "EAC Countries Renew Commitment to Education Reforms and Youth Skills", "summary_ja": "CGTNは、ナイロビで開催された地域会議において、東アフリカ共同体加盟国が教育制度改革と職業訓練の拡充に力を入れていると報じています。同報道によれば、各国指導者はスキルギャップに対処し経済成長を促進するため、技術、教員研修、能力ベースの学習への投資拡大を呼びかけました。CGTNは、これらの施策が地域全体の経済成長を目指すものだと報じています。", "summary_en": "CGTN reports that East African Community member states are intensifying efforts to reform education systems and expand vocational training at a regional conference in Nairobi. The reports indicate that leaders called for increased investment in technology, teacher training, and competency-based learning to address skills gaps. CGTN reports these measures aim to drive economic growth across the region.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-27/EAC-countries-renew-commitment-to-education-reforms-and-youth-skills-1PWZz2z5ZFm/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン革衛隊：米国がイランの条件を受け入れなければホルムズ海峡は閉鎖されたままになる", "title_en": "IRGC: Hormuz Strait to remain closed if US rejects Iran's terms", "summary_ja": "CGTNが報じたところによると、イランのイスラム革命防衛隊は米国がイランの条件を受け入れなければホルムズ海峡は閉鎖されたままになると述べた。この紛争は、経済的圧力、外交交渉、軍事的エスカレーションの可能性など、複数の前線でテヘランとワシントン間の広範な緊張の中で起きている。この対立は、両国間の複数の政策分野における対立の激化を反映している。", "summary_en": "CGTN reports that Iran's Islamic Revolutionary Guard Corps has stated the Strait of Hormuz will remain closed unless the United States accepts Iran's conditions. The dispute occurs amid broader tensions between Tehran and Washington across economic, diplomatic, and military fronts. The standoff reflects escalating confrontation between the two nations on multiple policy areas.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-27/IRGC-Hormuz-Strait-to-stay-closed-if-US-does-not-accept-Iran-s-terms-1PWxjRhceyY/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セヴァストポリへのドローン攻撃で4人が負傷、知事が報告", "title_en": "Four wounded in drone attack on Sevastopol, governor reports", "summary_ja": "TASSは、セヴァストポリへのドローン攻撃で4人が負傷したと知事ミハイル・ラズヴォジャエフの発表として報道している。同報道によると、負傷者のうち2人は軽傷で、入院を拒否したという。攻撃の詳細や状況についてはさらなる情報は提供されていない。", "summary_en": "TASS reports that four people were wounded in a drone attack on Sevastopol, according to governor Mikhail Razvozhayev. The source states that two of the wounded sustained minor injuries and declined hospitalization. The report provides no additional details about the attack or its circumstances.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2178647", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国退役少将がアトランティス発見の可能性を主張", "title_en": "Retired US Admiral Claims Possible Discovery of Atlantis", "summary_ja": "TASS/RTは、米国退役少将ティム・ガロデット氏が失われた都市アトランティスを発見した可能性があると主張していると報じている。報道によると、ガロデット氏は場所の特定を避けるため、詳細の開示を拒否している。同氏の主張は科学コミュニティからの検証を受けていない。", "summary_en": "TASS/RT reports that retired US rear admiral Tim Gallaudet claims he may have found the lost city of Atlantis. According to the report, Gallaudet has declined to disclose specific details about the location to prevent its revelation. The admiral's claims remain unverified by the scientific community.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/society/2178645", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、ホルムズ海峡の機雷を完全に除去したと発表", "title_en": "US Claims Full Clearance of Mines from Strait of Hormuz", "summary_ja": "中央軍司令官ブラッドリー・クーパーは、米国がホルムズ海峡の国際航路から機雷を完全に除去したと報告しています。CENTCOMによると、機雷はイランの革命防衛隊（IRGC）によって設置されたとのことです。この発表は世界で最も重要な海上交通路の一つにおける安全保障上の懸念に対処するものです。", "summary_en": "CENTCOM head Bradley Cooper reports that the US has fully cleared mines from the Strait of Hormuz's international shipping lanes. According to CENTCOM, the mines were laid by Iran's Islamic Revolutionary Guard Corps (IRGC). The claim addresses security concerns in one of the world's most critical maritime chokepoints.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2178643", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国のヒマラヤ超大型ダムが数十億人に壊滅的な洪水リスクをもたらす", "title_en": "China's Himalayan Super-Dam Poses Catastrophic Flood Risk to Billions", "summary_ja": "著者ブラーマ・チェラニーは、チベット高原のヤルン・ツァンポ川に建設中の中国の巨大ダムプロジェクトが、深刻な地震リスクと破局的な決壊の可能性によりインド北東部とバングラデシュの下流に住む20億人を脅かしていると警告している。中国の科学者自身さえこの地質的に不安定なヒマラヤ地域での地質不安定性と貯水池誘発地震についての警告論文を発表しているにもかかわらず、北京は建設を継続している。", "summary_en": "Author Brahma Chellaney warns that China's massive Yarlung Tsangpo dam project on the Tibetan Plateau threatens two billion people downstream in India and Bangladesh due to severe seismic risks and potential catastrophic failure. Even China's own scientists have published warnings about geological instability and reservoir-triggered earthquakes in this highly unstable Himalayan region, yet Beijing continues construction.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-himalayan-super-dam-dangerous-and-plan-lacks-transparency-by-brahma-chellaney-2026-08", "state_media": false, "category": "オピニオン", "full_text": "China’s Super-Dam Is Becoming an Upstream Water Bomb\nBrahma Chellaney\nThe latest evidence suggests that the Chinese scientific establishment understands the dangers of a planned Himalayan dam—the world's largest—more clearly than its political leadership is willing to acknowledge. With the livelihoods of two billion people at stake, the international community needs to weigh in.\nNEW DELHI—The world’s largest dam is rising in one of the world’s most geopolitically treacherous and seismically unstable regions. Just a few kilometers from the heavily militarized border with India, China is constructing an unprecedented hydropower project in Tibet on the Yarlung Tsangpo, the world’s highest-altitude major river, better known internationally as the Brahmaputra.\nThe super-dam will dwarf China’s Three Gorges Dam, currently the world’s largest, in power-generating capacity. Its reservoir will impound a gargantuan volume of water above millions of people downstream in India’s northeast and deltaic Bangladesh, much of which lies barely above sea level.\nNow the most troubling warning is coming not from foreign critics but from China’s own scientists. A recent paper published in the state-linked, Mandarin-language journal Sedimentary Geology and Tethyan Geology identifies serious geological hazards at the construction site. The geologists conclude that the terrain has a “loose structure and weak cohesion” and warn that fault movement or an earthquake could easily trigger large-scale instability, threatening both the reservoir and surrounding infrastructure. The authors recommend reinforcing the reservoir slopes, installing retaining structures, and redesigning key elements to reduce the risk of catastrophe.\nWhen scientists working under a communist regime issue such warnings, the international community must pay attention.\nThe new dam is rising at the Great Bend of the Brahmaputra, where the river plunges steeply through the world’s deepest and longest canyon before entering India. It also sits squarely within the Himalayan seismic belt, created by the slow-motion collision of the Indian and Eurasian tectonic plates. This is among Earth’s most earthquake-prone regions, with a record of producing devastating temblors.\nThe danger is not simply that an earthquake might damage a dam. A gigantic reservoir could itself trigger a quake by intensifying geological stresses. Reservoir-triggered seismicity, or RTS, has been documented for decades.\nOne likely example occurred in China. In one of the deadliest natural disasters in modern Chinese history, an earthquake on the Tibetan Plateau’s eastern rim in 2008 killed nearly 90,000 people, mainly in Sichuan province. While scientists continue debating the precise relationship, influential research concluded that the immense weight of water stored in the reservoir of the new Zipingpu Dam may have increased pressure along an underlying fault, potentially advancing the earthquake by decades or even centuries.\nInstead of facing up to that scientific possibility, China has embarked on a vastly larger dam project in an even more fragile geological setting. But the Himalayan fault system does not respect national borders; nor would the consequences of a major dam failure. The powerful 2025 Myanmar earthquake demonstrated how interconnected this seismic zone is, with tremors traveling far enough to trigger the collapse of a high-rise building in Bangkok, some 1,000 kilometers away.\nThe Brahmaputra is the lifeline of northeastern India, irrigating farms, sustaining fisheries, replenishing wetlands, and supporting millions of livelihoods before flowing into Bangladesh, where it is the single largest source of freshwater. Like China’s giant dams on the Mekong, the super-dam threatens to alter cross-border river flows and reduce the downstream transport of nutrient-rich sediment essential to the river’s ecology and riparian countries’ agriculture.\nWorse, a catastrophic structural failure—or even an emergency release of impounded water following seismic damage—could unleash devastating floods across densely populated downstream plains with little warning. What begins as an engineering failure in Tibet could become a humanitarian catastrophe extending all the way to Bangladesh, the world’s most densely populated country outside microstates and mini-states.\nThe geological danger is only part of the story. China is increasingly transforming its control of the Tibetan Plateau—the source of most of Asia’s major rivers—into strategic leverage. It has built cascades of dams on transboundary rivers, withheld hydrological data during periods of tension, and resisted entering any water-sharing treaty with downstream states. Water has become another instrument of coercive statecraft.\nThe sheer scale of what China calls “the project of the century” will inevitably give it unprecedented control over river flows. Even routine reservoir operations can affect downstream ecosystems, agriculture, sediment transp", "translation_ja": "", "vocab": [{"word": "geopolitically treacherous", "definition": "政治的に危険で予測不可能な地域を指す表現。国々の利益対立や軍事的緊張が高い地帯を意味し、外交関係が不安定な状況を説明する際に用いられる。"}, {"word": "impound", "definition": "水をダムやその他の構造物で閉じ込める、または貯蓄することを意味する。法律用語としては差し押さえるという意味もある。"}, {"word": "reservoir-triggered seismicity (RTS)", "definition": "貯水池の水の重みと圧力が断層線に力を加え、地震を引き起こす現象。ダム建設に伴う重大なリスク要因として認識されている技術用語。"}, {"word": "riparian", "definition": "河川に隣接する土地や地域に関連する形容詞。河川の流域に位置する地域の農業や生態系に関わる文脈で用いられる。"}, {"word": "coercive statecraft", "definition": "強制力を伴う国家戦略を指し、資源や地政学的優位性を用いて他国に圧力をかける手段。水資源管理をこのような外交ツールとして利用することを意味する。"}, {"word": "transboundary", "definition": "国境をまたがる、または複数の国にわたることを意味する形容詞。河川やエネルギー資源など、国家間で共有される自然資源に関する議論で頻出する。"}]}, {"title_ja": "ウクライナ戦争とヨーロッパ：戦略的統一への呼びかけ", "title_en": "Europe and the War in Ukraine: A Call for Strategic Unity", "summary_ja": "著者は、ロシアのウクライナ長期戦争に対応するため、ヨーロッパが分断された国家利益を超えて統一しなければ、世界舞台での影響力を失うリスクがあると主張している。紛争の終わりが見えない中、ヨーロッパ諸国は地政学的現実に直面し、この歴史的転換期における影響力を維持するため集団的行動を強化する必要がある。", "summary_en": "The author argues that Europe risks becoming irrelevant on the world stage unless it unites beyond fragmented state interests to address Russia's prolonged war in Ukraine. With no foreseeable end to the conflict, European nations must confront geopolitical realities and strengthen collective action to maintain influence during this transformative historical period.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/europe-and-ukraine-war-following-american-decline-and-new-threats-by-joschka-fischer-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Europe and the War in Ukraine\nIf Europe remains a mere collection of small states and middle powers, the current period of profound geopolitical and historical change will also mark the end of its role on the world stage. With no end in sight for Russia's war in Ukraine, Europeans must come to grips with reality.\nBERLIN—Four and a half years after Russia’s unprovoked full-scale invasion of Ukraine, no end is in sight. What initially looked like a “special operation” that would end in a matter of days (or weeks, at most) has evolved into a seemingly interminable war of attrition.", "translation_ja": "", "vocab": [{"word": "unprovoked", "definition": "正当な理由のない、一方的な。国際紛争の文脈では、相手国による攻撃の口実や原因がない状態を指す。"}, {"word": "interminable", "definition": "終わりが見えない、永遠に続く。期限のない、退屈なほど長く続く状態を表す。"}, {"word": "geopolitical", "definition": "地政学的な、国家間の権力関係と地理的位置に関連する。国際政治と地理の交差点を分析する分野。"}, {"word": "attrition", "definition": "消耗戦、徐々の減少。特に軍事用語として、長期的な戦闘で敵の人員や資源を徐々に減らす戦略を意味する。"}, {"word": "fragmented", "definition": "分裂した、細分化された。統一性を欠いた状態で、異なる部分に分かれている。"}]}, {"title_ja": "ヨーロッパはトランプに対してカナダを支持すべき", "title_en": "Europe Must Stand with Canada Against Trump", "summary_ja": "著者は、トランプがカナダとの貿易紛争を展開する中、ヨーロッパの指導者が受動的にとどまるべきではなく、同様の脅威に直面する可能性があると主張しています。カナダの首相カーニーのダボス演説で中程度の大国が独裁的な超大国に対抗するために団結する必要があるという論点を引き出しながら、EUは経済的同等国との連帯を示す必要があると主張しています。", "summary_en": "The author argues that European leaders should not remain passive as Trump pursues trade conflict with Canada, as they may face similar threats. Drawing on Canadian PM Carney's Davos speech about middle powers uniting against predatory superpowers, the piece contends that the EU must demonstrate solidarity with economic peers to protect shared prosperity and security.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/eu-must-stand-with-canada-against-trump-by-philippe-legrain-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Europe Must Stand with Canada Against Trump\nRather than keeping their heads down as US President Donald Trump wages another trade war with Canada, European leaders must recognize that they could be next. Like Canada, the European Union is a middle power whose future prosperity and security will depend on solidarity with economic peers.\nLONDON—Canadian Prime Minister Mark Carney’s widely acclaimed speech at Davos earlier this year remains the talk of diplomats worldwide. Carney argued that middle powers must act together to avoid becoming victims of predatory superpowers, and he has lived by his words, duly standing with his European allies as US President Donald Trump threatened to invade Greenland, a Danish territory.", "translation_ja": "", "vocab": [{"word": "predatory", "definition": "他者を搾取・支配しようとする侵略的な性質を持つ。ここでは、大国が弱い立場の国々を不当に扱う様子を表しています。"}, {"word": "solidarity", "definition": "共通の目標や利益のために一致団結すること。政治や経済の文脈では、国家間の連帯や支援を意味します。"}, {"word": "middle power", "definition": "国際関係において、大国ほど影響力はないが、地域的には重要な役割を持つ国家。カナダやEU加盟国などが該当します。"}, {"word": "keep their heads down", "definition": "注目を避けるため、低姿勢を保つ、目立たないようにする。困難な状況で慎重に行動することを意味します。"}, {"word": "duly", "definition": "適切に、当然のように、期待通りに何かを行うこと。予定通りに実行されたことを強調します。"}, {"word": "trade war", "definition": "関税の引き上げや報復措置などを通じて、国家間で行われる経済的対立。保護主義的な政策の応酬を指します。"}]}, {"title_ja": "NBCのプレミアリーグ中継：アメリカ視聴者にとって英国的すぎないか？", "title_en": "NBC's Premier League Coverage: Too English for American Audiences?", "summary_ja": "著者レアンダー・シャエルラッケンスは、NBCが提供するプレミアリーグサッカーの放映が過度に英国化されており、英国人アナウンサー、用語、文化的言及が本物のアメリカサッカー文化の発展を阻害していると主張しています。NBCの戦略は商業的に成功していますが、著者はアメリカのサッカーが常に英国フットボール文化を模倣するのではなく、最終的には独自のアイデンティティを確立する必要があると主張しています。", "summary_en": "Author Leander Schaerlaeckens argues that NBC's presentation of Premier League soccer is excessively anglicized, featuring British announcers, terminology, and cultural references that hinder the development of an authentic American soccer culture. While NBC's strategy has been commercially successful, the author contends that American soccer must eventually establish its own identity rather than perpetually imitating English football culture.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/football/2026/aug/27/nbcs-premier-league-coverage-in-the-us-is-excellent-but-is-it-too-english", "state_media": false, "category": "オピニオン", "full_text": "There they were again, signaling with their unchanging faces and voices and their unchanging studio backdrop that another Premier League season had begun. On Friday afternoon, and again on Saturday and Sunday morning, Rebecca Lowe welcomed American viewers to what is somehow already the 14th season of the world’s most popular sporting circuit to air on NBC.\nShe was flanked, as ever, by her merry band of pundits, her gang of fellow British expats. The Robbies and the other ones. Also, Tim Howard as the token American, albeit one who spent 13 seasons of his goalkeeping career in the Premier League, deemed sufficiently English by osmosis to join the crew.\nThe games’ announcers would be British, too. And they would all speak of “football” and “pitches” and “away matches.” Teams would be “they,” of course. The ads, too, would sound very English, supremely English, maximally English. For Barclays, among other longtime sponsors leaning hard into the image of the beleaguered American fan, embattled but persevering in his or her niche pursuit of following this plucky little league that airs on one of the nation’s most readily available channels.\nTaking it all in, I couldn’t help but think back to watching the BBC’s coverage of the final day of the last season for the first time in years with some English expat friends and some VPN trickery. It struck me that somehow, despite originating from the country, it didn’t actually look or sound or feel quite as English-coded as the NBC offering of the events. Except for the diversity of mellifluous regional accents on offer on the BBC, NBC has out-Englished the English.\nOther broadcasters have chosen different approaches. Fox leans into its Americanness as hard as NBC does the Englishness in its World Cup presentation. Apple sits somewhere in the middle, on neutral ground, when it airs Major League Soccer.\nIf Major League Baseball’s core product is really nostalgia, and the NFL’s is consumerism and nationalism, then the Premier League’s, going by NBC’s presentation, is anglophilia. It’s all there. The satellite zoom-ins on the league’s quaint stadiums nestled between the brick row houses. The reverence for the club anthems and traditions. The poppies pinned to the on-air talent’s lapels every November to commemorate Britain’s fallen soldiers – a tradition which doesn’t entirely resonate in an American context.\nNBC’s unsaid sales pitch feels like it should be: Catch a match, and you, too, could look and sound and feel more English, to yourself and to all your friends.\nFor NBC’s part, this has been a perfectly justifiable and coherent business strategy. And it has worked outstandingly well for the broadcaster. In a landscape of shrinking audiences, NBC’s Premier League viewers seem to tick up every year and posted their highest totals ever last season.\nAnd in a way, all of this is baked into the recipe. Soccer owes much of its rise in these United States to the worldliness it confers. As the upper middle class discovered soccer – or rediscovered it, to be historically accurate – in the late 1990s and early 2000s, following it signaled that you knew there was more to sports than the NFL, NBA or baseball. That the rest of world mostly followed different sports, and that you were in on its secrets. Bonus points for drinking a Carling in a pub of some American downtown at 7.30 am on a Saturday.\nBut the question that is now imposing itself is how and when the US will develop its own soccer culture, where it no longer has to apologize for its quirks and its lingo. The wildly profitable – almost counterproductively profitable – 2026 World Cup demonstrated anew that the US has been a soccer country for a long time. The sport is mature here now. It is long past needing to establish itself and is now on to the trickier work of consolidating its status and making the smaller gains.\nYet American soccer remains beset by a sense that it doesn’t entirely belong. Its players and teams must still scrap to be taken seriously outside their own borders. There is an unmistakable undercurrent of imposter syndrome running through our soccer scene. And when the sport’s most popular games are presented with an English accent, it stunts the growth of something authentic. How can an organic soccer culture blossom here, after belatedly taking root in the supporter sections of the many MLS and NWSL teams that rushed to brand themselves as “football club”, when NBC’s coverage chooses to stand in the shadow of another?\nThis isn’t to diminish NBC’s Premier League crew or their otherwise excellent work or indeed their career choices. And part of the appeal of the US is that, at its best, it accepts the cultures and norms of the world and finds a place to integrate those things into a kaleidoscopic whole. Lowe even announced that she was a naturalized citizen in 2022.\nBut eventually, American soccer will have to start doing its own things in its own way, rather than just copying what the cool soccer countries", "translation_ja": "", "vocab": [{"word": "anglophilia", "definition": "英語圏、特にイギリスへの好意や傾倒。ここではアメリカの視聴者がイギリス文化的なものに惹かれる傾向を指します。"}, {"word": "imposter syndrome", "definition": "自分の成功は実力ではなく運や欺きの結果だと感じ、詐欺師のように感じる心理状態。アメリカサッカーがスポーツとして正当な地位を得ていないという不安を表現しています。"}, {"word": "osmosis", "definition": "本来は浸透現象を示す物理用語ですが、ここは無意識のうちに他の文化や特性が移ること。ティム・ハワードがプレミアリーグで長年プレーしたため、イギリス文化が自動的に身についたことを意味します。"}, {"word": "coherent", "definition": "一貫性のある、筋が通った。ここではNBCの戦略が明確で理論的に矛盾がないことを表現しています。"}, {"word": "beleaguered", "definition": "困難に直面している、苦境にある。ここではプレミアリーグを追うアメリカのファンが社会的に少数派で大変な立場にあるという皮肉的な描写です。"}, {"word": "consolidating", "definition": "強化する、統合する。スポーツの成長段階において、基盤を安定させ確実なものにするプロセスを指します。"}, {"word": "kaleidoscopic", "definition": "万華鏡のような、多様で複雑な。アメリカの文化的多様性と異文化の統合を表現しています。"}]}, {"title_ja": "バーナムの率直な対トランプ戦略がスターマーの従属的姿勢を上回る", "title_en": "Burnham's Blunt Approach to Trump Beats Starmer's Neediness", "summary_ja": "ジョン・クレイスは、アンディ・バーナムの実用的で率直なトランプへのアプローチ（過去の批判を謝罪せず、不要な追従を避ける）が、キア・スターマーの卑屈なアプローチよりも効果的だと主張している。クレイスは、トランプが追従よりも強さと一貫性を尊重すること、そしてバーナムの明確に相違点を述べる意思がトランプ自身が採用する矛盾と機会主義を反映していることを指摘している。", "summary_en": "John Crace argues that Andy Burnham's pragmatic, no-nonsense stance toward Donald Trump—refusing to apologize for past criticism while avoiding unnecessary flattery—is more effective than Keir Starmer's obsequious approach. Crace contends that Trump respects strength and consistency over fawning, and that Burnham's willingness to speak plainly about their differences mirrors the contradiction and opportunism that Trump himself employs.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/politics/2026/aug/27/andy-burnham-trump-meeting-needy-keir-starmer", "state_media": false, "category": "オピニオン", "full_text": "It makes a pleasant change. Not s
