o long ago, Keir Starmer was falling over himself in his efforts to keep things sweet with Donald Trump. Offering the US president a second state visit within minutes of meeting him. Everyone knows you should never put out on the first date: it only makes the other person think you’re a pushover. Sure enough, The Donald banked the marching bands and the Windsor silver service, made polite conversation for three days and then went back to trash-talking him.\nYet still, Starmer just sat there and took it. As if one word of criticism would be too much. Wittering on about the “special relationship” as if Trump gave a moment’s thought to the UK before he did anything. The rest of us wouldn’t have put money on the US president even being able to locate Britain on a map. It was only latterly, when The Donald chose to bomb Iran, that the penny finally dropped for Keir. And even then he looked pained by the apparent betrayal, as he resisted the calls of Kemi Badenoch and Nigel Farage to join in the war.\nNo such misgivings for Andy Burnham. This week, the prime minister was reminded that when he had been mayor of Greater Manchester, he had said The Donald wouldn’t be welcome in his city and that he could take his poisonous politics elsewhere. Words that had been loudly cheered at the time by many in Britain who had had enough of all the toadying. After all, it wasn’t as if the Trump-whispering had made any difference. If anything, it had only added to his contempt for us. You’ll never get any thanks from a narcissist.\nNor did Andy have any regrets now that he was prime minister and was likely to meet Trump in person for the first time at the UN general assembly in New York at the end of next month. Far from it. “Shit happens” was pretty much his precis of what had gone down. He wasn’t going to apologise to The Donald for what he had said. Not least because he had meant every word.\nThis was the real world. Politicians say stuff. Trump had said all sorts of things about him, too. That he had been mayor of “some town”. To be fair to Agent Orange, it’s quite likely he had never heard of Manchester before. Neither geography nor an interest in other people have ever been his strongest suits. All he had known about Andy was that he was “extremely liberal”. Which in Maga language is the same as saying he’s a “Commy bastard”.\nSo here was Burnham’s deal. He wasn’t planning to go out of his way to insult the US president, but neither would he be offering unexpurgated sycophancy. Instead, we would be getting a very British type of pragmatism. He would do what was necessary in the UK’s interest but not much more. They would be polite and try not to accentuate their differences, but there would be no pretence of any lasting friendship. Just stick to the matters in hand and get the hell out. After New York, Andy wouldn’t be sending weekly WhatsApps. Out of sight, out of mind.\nWeirdly, this performative show of an ersatz friendship – the US and UK are meant to be more or less on the same side, after all – is likely to be far more effective than Keir’s more needy approach. Because this is the type of language The Donald understands. Although he craves the fawning, he has no respect for those who offer it. He takes it as a sign of weakness. Equally, no amount of flattery is ever enough. There is a hole in Trump’s psyche that can never be filled.\nWith Burnham, there is going to be more a meeting of equals. Two world leaders who are doing what it takes to get along with each other. It’s as close to respect as a sociopath like Trump can get. Andy hasn’t taken a backward step, or attempted to deny his previous comments. More that that was then and this was now. Just get used to it.\nYou can say one thing one day and the opposite the next. It’s up to the other person to work out which one was the truth. Or maybe neither, or maybe both. After all, that’s precisely what The Donald does. Contradiction is his modus operandi. And it’s got him to the White House. So if it works for Trump, why not for Burnham? Sincerity can be an overrated virtue for a world leader. You don’t always need a Love, Actually moment to make your feelings known.\n“So I’m looking forward, actually, to my first meeting [with Trump],” said Andy. And he probably is. His cards are on the table and he has nothing to hide. Plus, he has a sense of humour and self-deprecation, which also might confuse the US president, who has neither.\nIt also feels as if there’s less at stake with this meeting than there was with many of Starmer’s. Back in the early days of Trump’s presidency, it was as if much of the world was holding its breath for what he might do next. Now, not so much. We’ve all learned to adapt to The Donald. Even to his never-ending war with Iran, which has jacked up the cost of living. All his bad habits are now priced in. And suddenly he looks more vulnerable. A man who has found the world doesn’t automatically bend to his will. A man who", "translation_ja": "", "vocab": [{"word": "sycophancy", "definition": "他者の気に入られるために過剰にへつらい、同調する行為。本文ではバーナムがトランプへの無条件の追従を拒否することを説明している。"}, {"word": "pragmatism", "definition": "理想や原則よりも実利的な結果を重視する実践的な立場。バーナムが友情の見せかけよりもUKの利益を優先する姿勢を指す。"}, {"word": "modus operandi", "definition": "特定の個人や組織が繰り返し使用する特有の行動様式または方法論。トランプの矛盾と言辞の操作を表現するために使われている。"}, {"word": "narcissist", "definition": "自己愛が異常に強く、他者からの称賛や注目を常に求める人格障害的な人。本文ではトランプの心理特性を描写している。"}, {"word": "performative", "definition": "実質的な内容より見せかけや形式を重視する、または外部への見せ物的な行為。米英関係の虚偽の友情を指すために使用されている。"}, {"word": "ersatz", "definition": "本物の代用品として使われる模造品。本来の価値や真正性に欠ける。バーナムとトランプの関係が真の友情ではなく模造的なものであることを意味している。"}, {"word": "expurgated", "definition": "不適切な部分を削除した、または検閲された。本文ではバーナムが完全にはしゃべりを抑制しないことを意味している。"}]}, {"title_ja": "民主党が必要とする勝利のメッセージ：「台所のテーブル」ポピュリズム", "title_en": "Kitchen-Table Populism: The Winning Message Democrats Need", "summary_ja": "勤労階級政治センターが6,000人のアメリカ人を対象に実施した調査によれば、民主党の最も効果的なメッセージングは、家賃や食料品の支払いから上昇する物価まで、日常的な経済的闘争に焦点を当てています。この「台所のテーブル」ポピュリズムは、反トランプメッセージや文化的転換に関する「分割統治」戦略、進歩的な人種階級アピールなどの代替戦略よりも大幅に優れており、これらは有権者に説教的に感じられます。", "summary_en": "According to a survey of 6,000 Americans by the Center for Working-Class Politics, Democrats' most effective messaging focuses on everyday economic struggles—paying for rent and groceries, rising costs, and ensuring hard work pays off. This 'kitchen-table populism' significantly outperforms alternative strategies like anti-Trump messaging, 'divide-and-conquer' narratives about cultural diversion, and progressive race-class appeals, which voters perceive as condescending.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/27/democrats-survey-populism-economy", "state_media": false, "category": "オピニオン", "full_text": "This year’s Democratic primaries look and sound a lot more populist than usual. Brian Poindexter, a union iron worker running on a “workers first” message, won a House primary outside Cleveland. Sherrod Brown is mounting a Senate comeback in Ohio on the same “rigged system” message that has allowed him to outshine other Democrats in Ohio. Troy Jackson, a fifth-generation logger who built his career fighting corporate landowners, is the Democratic Senate nominee in Maine. And Josh Turek, a self-described “prairie populist”, is on the Senate ballot in Iowa.\nIn fact, according to research we’ve conducted through the Center for Working-Class Politics (CWCP), more than 70% of 2026 Democratic candidates now rely on populist rhetoric in their campaigns, laying the blame for our broken system on rich elites of one kind or another.\nIt seems after decades of bleeding working-class support, Democrats are converging on a solution to win them back: run populists.\nThe real question, then, is not whether Democrats should embrace populism, but rather what kind of populism they should embrace. To settle that argument, CWCP teamed up with the Rural Urban Bridge Initiative (RUBI) to conduct a new survey.\nIn polling conducted by Verasight between late June and early July, we asked more than 6,000 Americans to rate 13 different kinds of messages commonly deployed by Democratic candidates to see which pitch would draw the strongest support. We also randomly presented each respondent with one of two Republican attack messages modeled on actual Republican campaign rhetoric in order to see how well Democratic messages hold up under attack.\nThe top-performing messages we tested have a simple formula. They focus on Americans’ day-to-day struggles to pay for rent and groceries, and the widespread frustration with prices that rise faster than working-class wages. They insist that working people should be able to give their kids a better shot. They promise to bring costs down, make the biggest corporations pay their fair share, and crack down on the people who game the system. Ultimately, they tell a simple story: hard work should pay off.\nWe call this winning combination “kitchen-table populism”.\nNone of the plausible alternatives to this kind of messaging performed nearly as well. Consider what we call the “divide-and-conquer playbook” messaging popular with certain progressive campaign consultants. One prominent proponent of this style is the Texas senatorial candidate James Talarico. Talarico strikes a populist posture, emphasizing that economic elites keep working people divided over race, immigration, and cultural issues so that no one sees that they’re all getting fleeced. It sounds good, and Talarico is holding his own in red Texas, but this tactic is not the slam dunk against the culture war that some progressives think it is. In fact, in our survey, it was not all that effective, severely underperforming the pure kitchen-table messages we tested.\nThe weakest variant of the divide-and-conquer narrative is the one that tells voters they’ve been tricked into blaming scapegoats. These “race-class narrative” appeals, so popular in progressives circles, finished at the bottom of the field. Why? Because telling people they’ve been duped comes off more like a condescending sermon than an invitation. Unlike kitchen-table populist messages that meet voters where they’re at, the race-class narrative strays from voters’ concrete economic woes to expound a more abstract theory of political gamesmanship. These messages trailed our top kitchen-table populist pitches with every group, including non-white voters and Democrats.\nAnother alternative to populist messaging is a big-tent anti-Trumpism, pushed by some establishment liberals. The argument here is that candidates could unite all those Never-Trump Republicans, anti-Trump independents, and Resistance Democrats with a simple opposition message – one that steers clear of divisions over policy or ideology. Again, the theory makes sense. The trouble is that messaging focused on attacking Trump performed poorly across the board. We fielded the strongest-testing anti-Trump message we know, one that ties his attacks on democratic norms directly to pocketbook pain, and even this steelman version was a net negative with rural voters and Trump waverers.\nIt wasn’t all roses for populism either. We found that anti-elite messages varied in their efficacy. While naming corruption, and promising to end it, was a powerful way to convey anti-elite sentiments – especially with Republicans, where adding an anti-corruption pledge to a plain cost-of-living pitch lifted support by 18 points – messages that leaned too stridently into class war turned off these same voters. Republicans swung 25 points against messages that blamed “big corporations” and “the wealthy few”.\nWe also tested a progressive-coded anti-plutocrat message that railed against oligarchs and fascists: it trailed kitchen-table populism by abo", "translation_ja": "", "vocab": [{"word": "populist", "definition": "既得権層に対抗し、一般市民の利益を代弁すると主張する政治的立場。ポピュリスト的なメッセージングは富裕層や権力者を批判し、普通の人々の経済的困難に焦点を当てる。"}, {"word": "efficacy", "definition": "ある方法や戦略が期待される結果を達成できる程度や効果。調査では異なるメッセージングの有効性を測定している。"}, {"word": "plausible", "definition": "可能性がある、もっともらしいという意味。理論的には理にかなっているように見える代替案を指す。"}, {"word": "stridently", "definition": "激しく、高圧的に主張する方法。穏やかではなく、強硬で攻撃的な口調で意見を述べることを意味する。"}, {"word": "condescending", "definition": "相手を見下した、高圧的な態度で接すること。有権者に対して説教的で上から目線のメッセージングとして批判される。"}, {"word": "scapegoat", "definition": "責任転嫁のターゲットとなる人や集団。本来の原因ではなく、他の者のせいにされることを指す。"}, {"word": "anti-plutocrat", "definition": "富裕層による支配に反対する立場。富豪や少数の裕福な人々による権力支配に対抗するメッセージングを意味する。"}]}, {"title_ja": "インドはアメリカに付き添っている—当面の間", "title_en": "India Is Sticking With America—for Now", "summary_ja": "トランプの関税政策、パキスタンへの脅迫的態度、中国との関係強化にもかかわらず、インドはアメリカとの提携を「アメリカ・プラス戦略」と呼ばれるものを通じて維持してきた。モディ首相はトランプの行動に対して抑制的な対応を示しながら、ワシントンがインドの最も重要な戦略的パートナーであることを認識しつつ、他のアメリカ同盟国との関係を多様化させている。しかし、トランプが攻撃的な政策を継続すれば、国内政治的圧力によってインドはその同盟関係を再考することを強いられる可能性がある。", "summary_en": "Despite Trump's provocative policies including tariffs, threats toward Pakistan, and closer ties with China, India has maintained its partnership with the United States through what the author calls an \"America plus\" strategy. Prime Minister Modi has shown restraint in responding to Trump's actions while diversifying India's engagement with other U.S. allies, recognizing that Washington remains India's most important strategic partner. However, if Trump continues aggressive policies, domestic political pressure could force India to reconsider its alignment.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/india/india-sticking-america-now", "state_media": false, "category": "オピニオン", "full_text": "President Donald Trump, in his second term, has severely tested the U.S.-Indian relationship. He has slapped tariffs on India, threatened to impose secondary sanctions, gotten considerably closer to Pakistan, and enthusiastically engaged with China—the country India considers its biggest long-term military threat. Yet these strains have not led to the rupture that some observers had predicted. Nor have they forced a fundamental reorientation of Indian foreign policy. Instead, New Delhi has adopted what might be called an “America plus” strategy, in which it seeks to sustain partnership with the United States while widening its engagement with other powers, namely U.S. allies.\nIndian Prime Minister Narendra Modi has responded with unusual restraint to Trump’s provocations and has resisted demands to pull away from Washington. With the United States, India has continued trade negotiations, increased defense cooperation, and expanded technological and commercial ties. In addition, he has sustained the Quad, a regional security organization that also includes Australia, Japan, and the United States; drawn closer to U.S. allies; preserved relations with Russia; and sought to lower tensions with China. These efforts do not represent a retreat from the United States or a strategy of multialignment. India is trying to reduce its exposure to American volatility, but it still recognizes that Washington is its most important partner.\nAfter all, when it comes to cultivating a great-power patron, India doesn’t have better options. China and Russia will never buy Indian goods and services on the scale that the United States does, nor can Russia help India balance China. These realities have protected the U.S.-Indian relationship so far. But if Trump continues to bully India, public opinion could force Modi to abandon his restrained approach.\nGROWING APART?\nThrough 2024, Modi and his ruling Bharatiya Janata Party were excited at the prospect of Trump’s return to power. Modi had established an unusually warm personal relationship with the president during the latter’s first term. In 2019 and 2020, they headlined rallies together in Houston and Ahmadabad, expanded bilateral cooperation on defense, and developed a common approach to Asian security.\nAt the start of Trump’s second term, it seemed the friendly personal relationship between the two leaders would continue. At a White House meeting in February 2025, they announced an ambitious agenda for trade, defense, energy, and technology. To signal goodwill, the Indian prime minister accommodated Trump by slashing some of India’s tariffs on U.S. products and accepting a planeload of deported immigrants.\nBut the relationship soon soured. Trump took credit in May 2025 for ending a brief military conflict between India and Pakistan. While the Pakistanis hailed Trump’s intervention, the Indians refused to acknowledge that the president had done anything of the sort, sticking to New Delhi’s standard position that its disputes with Islamabad are purely bilateral and do not require outside mediation. Trump then took a shine to Pakistan’s army chief, Syed Asim Munir, and elevated Pakistan in the White House’s diplomatic priorities by using Islamabad as a mediator in negotiations with Iran and blessing the trilateral security pact between Pakistan, Saudi Arabia, and Turkey.\n Modi has largely avoided confrontations with Trump.\nTrump also became friendlier with China, another Indian rival. In his first term, he sought to build stronger partnerships with Australia, India, Indonesia, and Japan to construct a new regional architecture in Asia to balance China. But in his second term, he has spent a significant amount of time engaging with Chinese leader Xi Jinping—even talking loosely of establishing a “G-2,” under which China and the United States would meet regularly to hash out global problems. Trump has also failed to hold the annual summits of the Quad, raising doubts that the United States is committed to that security partnership and to preventing Chinese dominance across Asia.\nTrade tensions have also inflamed U.S.-Indian relations. When Trump punished India with high tariffs for its protectionism and for buying Russian oil, many Indians felt that their country was being unduly singled out. Washington had carved out exceptions for itself and some European countries to buy Russian oil, and the Biden administration had even encouraged India to buy Russian oil under a price cap as part of a plan to stabilize the global oil market. By late 2025, India faced some of the highest tariffs of any U.S. partner.\nIt is for these reasons that Indian public opinion started to turn against Trump in 2025. The opposition leader Rahul Gandhi accused Modi of surrendering to American pressure. Long-standing skeptics of the United States argued that Washington had proved itself unreliable. Critics of Modi started mobilizing farmers against a U.S.-Indian trade deal by characterizing the careful opening ", "translation_ja": "", "vocab": [{"word": "rupture", "definition": "関係の決裂や破断。通常、対立や衝突の結果として生じる状態を指す。ここでは米国とインドの関係が完全に壊れることを意味する。"}, {"word": "multialignment", "definition": "複数の国家や勢力に同時に対抗する戦略的枠組み。通常、ひとつの大国に従属するのではなく、複数のパートナーとの関係を保つ外交政策。"}, {"word": "volatility", "definition": "不安定性や変動性を指す。特に政治的・経済的な予測不可能な変化や急激な方針転換を意味する。"}, {"word": "reorientation", "definition": "方向や指向の変更を意味する用語。外交政策において、国際関係の優先順位や戦略的目標を新たに設定し直すこと。"}, {"word": "bilateral", "definition": "二国間の関係や協定を指す。ここではインドとパキスタンの間の問題が、第三国の介入を必要としない二者間の問題であることを強調している。"}, {"word": "protectionism", "definition": "国内産業を保護するために輸入品に高い関税をかけたり規制したりする経済政策。自由貿易の対立概念として使われることが多い。"}]}, {"title_ja": "不可能な中東", "title_en": "The Impossible Middle East", "summary_ja": "著者は、2月28日以来の米国・イスラエルのイラン戦争が地域の混乱を激化させ、中東諸国間の亀裂を深め、米国との伝統的な同盟を破壊していると主張しています。湾岸諸国は、トランプ政権が地域の安定よりもイスラエルを優先したことに失望し、パキスタン、トルコ、中国、ロシアとの安全保障パートナーシップを本格的に多様化させようとしていますが、現在のところアメリカの保護に代わる実行可能な選択肢は存在しません。", "summary_en": "The author argues that the U.S.-Israel war against Iran since February 28 has intensified regional chaos, deepening fault lines between Middle Eastern states and fracturing their traditional alliance with the United States. Gulf governments, disappointed by Trump's prioritization of Israel over regional stability, are now seriously diversifying their security partnerships with Pakistan, Turkey, China, and Russia, though no viable alternative to American protection currently exists.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/middle-east/impossible-middle-east", "state_media": false, "category": "オピニオン", "full_text": "The Middle East is no stranger to conflict. But even by its standards, the last six months have been extraordinarily chaotic. Ever since the United States and Israel went to war against Iran on February 28, countries in the region have faced cycles of drone and missile strikes against their military bases, energy infrastructure, and water desalination plants. Their airports and oil refineries have repeatedly needed to pause operations. And their regular ports have at times sat idle, thanks to Iranian attacks on ships in the Strait of Hormuz.\nDespite months of negotiations, Tehran and Washington seem poised to keep fighting on and off in an effort to wear down the other’s materiel and willpower. In fact, the war has expanded. More members of Iran’s regional proxy network, including the Yemen-based Houthis and Iranian-aligned Iraqi militias, joined the fray, and a port in Egypt was hit by drones. (No country has claimed responsibility for that attack, but the United States blamed Iran.)\nAs the conflict drags on, damage to the Middle East will extend far beyond infrastructure. It will deepen the Middle East’s fault lines. Some economies will be affected more than others, which could upend even the Gulf states’ traditionally stable politics. Institutions central to the region, such as OPEC+, could further come under extreme stress. There are measures that Middle Eastern governments can take to address these challenges, but none are straightforward, and all have their own set of consequences. To survive an era of increased disorder, then, the region’s countries will have to rethink how they relate to the wider world—and, most important, to each other.\nA HOUSE DIVIDED\nMiddle Eastern states have long had their differences. They have feuded, for example, about Israel, political Islam, and oil policy. Saudi Arabia and the United Arab Emirates have contrasting visions for the region and beyond, including Libya, Sudan, and Yemen. But the war is deepening all these rifts and creating new ones. The UAE has resented the muted nature of the condemnations that Oman, Qatar, and Saudi Arabia have made of Iran’s attacks on Emirati infrastructure. The countries have differences on how to handle the war itself and an unpredictable Trump administration. These disagreements have piled onto existing disputes, feeding resentment and making the region’s differences harder to manage. They are frustrating efforts to adapt to the evolving war.\nThe conflict has also begun to divide the Gulf from the United States, its main security guarantor. When U.S. President Donald Trump returned to the White House, many Gulf governments believed that their relationship with Washington would improve after a turbulent four years under the Biden administration. After all, Trump had a friendly and transactional political approach toward the region during his first term. Middle Eastern officials made ostentatious efforts to win him over, including by pledging to spend trillions of dollars in the United States, raising oil output, funneling investment deals to the president’s own family, and, in the case of Qatar, gifting him a private jet. But then Trump launched not one but two wars against Iran, prioritizing Israel’s desire to debilitate the Islamic Republic over the Arab states’ desire for stability. This showed the region that Washington cannot be trusted.\nThe Middle East has long worried about its dependence on the United States and has thus been diversifying its partnerships since the Arab Spring, in 2011. But in the past, these efforts were largely aimed at threatening or coercing Washington to act in their favor. Now they are more serious. This month, for example, Saudi Arabia forged a mutual defense pact with Pakistan and Turkey. Regional governments are buying more weapons from suppliers in Europe, South Korea, Turkey, and even Ukraine. Finally, they continue to look to China and Russia for political and economic partnerships. They are especially interested in forging more economic ties with China, which already trades hundreds of billions of dollars worth of goods with the region. China is currently the top destination for crude from the region.\nAny pivot away from the United States will be limited. There is no alternative security partner, at least right now: China is loath to use its economic might to offer military assistance, Russia is bogged down in its own war, and Europe struggles to coordinate on defense issues. (From the Gulf’s perspective, Europe is also too focused on Gulf domestic issues.) These governments are also unhappy with Chinese and Russian efforts to assist Iran in the war by, respectively, offering Tehran material that it can use to rebuild its defense industrial base and helping it improve its targeting. And although American bases can make host states targets, regional governments still want a U.S. military presence and American protection.\nBut unlike past efforts to diversify, this limited shift away from Washington w", "translation_ja": "", "vocab": [{"word": "materiél", "definition": "軍隊や武装勢力が使用する物質的な装備品、武器、弾薬など。戦闘能力を維持するために必要な物資全般を指します。"}, {"word": "fault lines", "definition": "地層の断層を指す地質学用語から転じて、社会や政治における根本的な対立や分裂の線を意味する比喩表現です。"}, {"word": "transactional", "definition": "個々の具体的な取引や利益交換に基づいた関係や姿勢を指し、原則や理想よりも短期的な利益を優先する傾向があります。"}, {"word": "ostentatious", "definition": "見せびらかすような、派手に目立たせるような行動や態度を示す形容詞で、他者に印象づけるために意図的に行われます。"}, {"word": "pivot", "definition": "外交や政策において重点を移す、方向転換することを意味する動詞で、新しい戦略や関係構築への転換を指します。"}, {"word": "bogged down", "definition": "進展が阻害された状態、特に困難な状況に足を取られて身動きがとれない状態を表す慣用句です。"}]}, {"title_ja": "アメリカはより多くの核兵器を必要としない", "title_en": "America Doesn't Need More Nuclear Weapons", "summary_ja": "著者は、中国の兵器増強と軍備管理条約の失効にもかかわらず、米国の核兵器拡張に反対している。新しい劇場核兵器を開発するのではなく、米国は既存の戦略核戦力の近代化と従来型兵器能力の強化により、抽象的な核優位性よりも実用的な抑止オプションを通じて対抗国を抑止すべきだと主張している。", "summary_en": "The author argues against expanding the U.S. nuclear arsenal despite China's weapons buildup and the expiration of arms control treaties. Rather than developing new theater nuclear weapons, the U.S. should modernize existing strategic forces and strengthen conventional military capabilities to deter adversaries through practical deterrence options rather than pursuing abstract nuclear superiority.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/america-doesnt-need-more-nuclear-weapons", "state_media": false, "category": "オピニオン", "full_text": "How many nuclear weapons is enough? The question has haunted policymakers and scholars for 80 years. Early in the Cold War, the United States expanded its nuclear arsenal rapidly in response to the Soviet threat. But beginning in the 1980s, as the two nuclear powers sought ways to reduce nuclear risks, arms treaties helped cut the size of those arsenals significantly, and stockpiles decreased by 80 percent. Now, circumstances are pushing the United States to consider the size of its nuclear arsenal once again. Over the past six years, China has nearly tripled the number of nuclear weapons it has, and according to the U.S. Defense Department, the country is on track to have over 1,000 by 2030. China is not yet a nuclear peer to Russia and the United States, which each deploy roughly 1,550 nuclear weapons in keeping with the limit set by the 2010 New Strategic Arms Reduction Treaty, but parity may be Beijing’s goal. Meanwhile, the last formal barrier to a U.S.-Russian arms race fell away when New START expired earlier this year.\nFaced with these rising dangers, the Trump administration announced in March that it would conduct what it called a “nuclear strategy review.” Some strategists recommend that the review include a call for a larger and more diverse nuclear arsenal. A larger arsenal, proponents of expansion argue, would provide the United States with a wider array of choices, especially for an in-kind response to low-yield theater nuclear attacks. Although Russia and the United States have nearly the same number of weapons, Russia possesses a greater number of theater nuclear weapons, which, unlike strategic nuclear forces, are designed for tactical use on the battlefield. China may also be developing more of these types of weapons. Advocates of expansion propose that if Washington can match any nuclear attack blow for blow, Beijing and Moscow will be less likely to initiate a nuclear exchange. According to Trump administration officials, the nuclear review will look at this “theater nuclear forces issue” to “identify where there may need to be changes or additions made.”\nThe United States should take additions to its nuclear forces off the table. The country already has a vast and diverse enough supply of nuclear weapons to unleash devastation on an adversary in the case of a nuclear attack. The purpose of nuclear deterrence is not to have an answer for every weapon in an adversary’s arsenal, but to avoid crossing the nuclear threshold in the first place. Moreover, introducing new theater weapons could provoke an arms race for which the United States is ill equipped and invite risks of inadvertent escalation that would only make the country more vulnerable. Rather than focus on expanding and diversifying the U.S. nuclear arsenal, Washington’s deterrence strategy should attend to the modernization of its existing strategic forces, which is behind schedule, and of its conventional arms, which are not fit to deter the United States’ greatest military threats, especially Chinese military aggression in the Western Pacific.\nMAXED OUT\nWhen the foundations of U.S. nuclear doctrine were laid early in the Cold War, escalation was understood as a ladder. When states encountered crises, their retaliatory actions would follow a vertical climb to more dangerous “rungs.” But escalation is unlikely to follow such a neat path, as Undersecretary of Defense for Policy Elbridge Colby argued in May; instead, as he said, there are ways that nuclear powers can shape “the limits of a conflict” and influence how their opponents respond. The goal for modern U.S. nuclear doctrine, therefore, should not be an abstract conception of superiority at all levels of the escalation ladder but practical options to constrain and deter the adversary. The proposal to introduce new theater nuclear forces in Asia or Europe follows the outdated logic that escalation will progress in a rational, orderly way with increasing levels of violence and harm. It does not follow modern reality.\nWithout arms controls in place, Washington does need to modernize its strategic nuclear forces—high-yield weapons whose purpose is to hold valuable targets at risk—to deter and defend against a nuclear attack on the American homeland or on U.S. allies’ territory. It has been trying to do so for years, since the U.S. Senate ratified New START in 2010, but with mixed results. As part of a deal to gain Senate support for the treaty, U.S. President Barack Obama approved a multidecade program to upgrade the existing nuclear arsenal and delivery systems that is now costing at least $1 trillion. The decision paved the way for defense contractors and national laboratories to begin replacing bombers, ground-based intercontinental ballistic missiles, submarines, warheads, and military communications systems.\nMore than 15 years later, most of the United States’ nuclear modernization efforts are over budget and behind schedule, despite significant investments in workforce, i", "translation_ja": "", "vocab": [{"word": "parity", "definition": "同等の地位や力。特に軍事力や核兵器の数が同程度であること。このテキストでは中国が米国やロシアと同等の核戦力を持つことを指している。"}, {"word": "escalation", "definition": "紛争や危機が段階的に悪化・拡大していくこと。軍事戦略では対立のレベルが上がっていくプロセスを意味する。"}, {"word": "deterrence", "definition": "敵対国が攻撃を仕掛けないよう防止する戦略。報復の脅威によって侵略を抑止することが核戦略の主目的である。"}, {"word": "arsenal", "definition": "武器や兵器の総体。国家が保有する全体的な軍事力の集合。核兵器の場合は保有する全核弾頭を指す。"}, {"word": "inadvertent", "definition": "意図せずに起きる、うっかりした。意識的でない偶然の行動を指す。核戦争の危険性に関連して使われている。"}, {"word": "ratified", "definition": "正式に批准する、承認する。通常は条約や協定を政府が法的に有効にすることを意味する。"}]}];

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-28 04:38 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
