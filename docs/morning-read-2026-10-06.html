ublished6 days ago\nTrump's comments appear to confirm reports by US media that a new threat led to the bombers being removed after a major incident on 27 September when police were alerted to three \"suspicious vehicles\" near the airbase.\nWhile speaking to a gaggle of reporters outside the White House, Trump was asked if a \"specific threat\" had led the US to pull its bombers from the airbase.\nTrump replied: \"Yeah I think we can say that. They didn't fly out by accident.\n\"There were some threats. And rather than tempting the enemy, we'll capture the enemy and beat the enemy. But why should we leave them there? So we moved them around a little bit. Not very far.\"\nHe added Washington \"actually knows the people that made the threat\", but he did not confirm who.\nThe exact nature of the threat that prompted the aircraft's removal from RAF Fairford remains unclear, but sources in Washington speculated to the BBC it might have revolved around sabotage attempts or attempts to strike the sensitive, expensive aircraft in the event of resumed hostilities with Iran.\nOne source close to the White House pointed to Ukraine's Operation Spiderweb - a covert drone attack on five Russian bases in June last year - as an example of what an enemy force could do, even at a distance.\n\"Whatever they thought it was, it was taken extremely seriously,\" the source said.\nTrump's comments, and those of Vance before him, stand in stark contrast to those of Secretary of State Marco Rubio.\nWhile both Trump and Vance pointed to an unspecified threat, Rubio was much more guarded in his language, noting that it was \"not unusual\" for military units and assets to rotate and be moved around the world.\nRAF Fairford - in the Cotswolds in Gloucestershire - has been at the centre of an incident being investigated by counter-terror police.\nFive men were initially arrested on suspicion of terror offences and subsequently released on bail. A sixth man, a UK-Iranian national, was also later mewhat\", Christoph Bergs, research analyst at defence think tank the Royal United Services Institute told the Reuters news agency.\nHowever, the use of the base had already been limited given London's st", "translation_ja": "", "vocab": [{"word": "speculated", "definition": "根拠なく推測すること。ワシントンの情報筋がBBCに対して、脅威の正確な性質について推測したという文脈で使用されている。"}, {"word": "covert", "definition": "秘密の、隠密の。ウクライナのOperation Spiderweb（秘密のドローン攻撃）のように、公開されていない極秘の作戦や活動を指す。"}, {"word": "hostilities", "definition": "敵対行為、戦闘。イランとの関係が悪化した場合の戦争やテロ行為のような対立的な行動を意味する。"}, {"word": "guarded", "definition": "慎重な、用心深い。マルコ・ルビオ国務長官がより慎重な言い方をしたという文脈で、控えめで慎重な表現や態度を指す。"}]}, {"title_ja": "France braces for national day of school protests after injuries and mass arrests", "title_en": "France braces for national day of school protests after injuries and mass arrests", "summary_ja": "France prepares for a day of protests in support of students who’ve been demanding more investment in education.", "summary_en": "France prepares for a day of protests in support of students who’ve been demanding more investment in education.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr4g1q1elxnjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "France braces for national day of school protests after injuries and mass arrests\n- Published\nFrance is braced for major protests on Tuesday, after organisers called for a nationwide day of action in support of students demanding more investment in education.\nIt comes after a week of demonstrations, which saw students blockading hundreds of schools, at least 190 students injured, and more than 5,000 people arrested.\nOne student had his hand blown off during a confrontation on Monday, while another was reportedly struck in the head by a tear gas grenade last week.\nFrance's prime minister said the government had announced measures to address their demands, but the Union Syndicale Lycéenne (USL), a major organiser of the protests, said the government had offered \"nothing concrete\".\nThe organisation called on people to join their mobilisation on Tuesday in the face of \"this political deadlock and what we describe as unprecedented repression of the movement\".\nSome other organisations have also shown their support for the students, with the teachers' union SNES-FSU urging its members to join Tuesday's protest.\nThe radical-left La France Insoumise (LFI) party leader Jean-Luc Mélenchon described the protests as the \"most powerful high school and university student youth movement\" since 1968 - a year of major unrest, which saw millions of workers go on strike.\nThe wave of demonstrations began in September in Paris and has spread across the country, with students protesting over a range of issues, including overcrowded classrooms, run-down buildings, and a lack of teachers.\nThe protests were started by high school students, who were later joined by university students.\nOn Sunday, French Prime Minister Sébastien Lecornu announced a series of measures to \"address the difficulties faced by secondary school students and education staff\", promising \"visible changes\" in schools.\nHowever, he also said: \"We will make no concessions to violence. We stand by students and staff who have been assaulted, as well as police officers and gendarmes who have been injured.\"\nThe unrest has not only seen schools blockaded, but also rubbish bins set on fire. Education Minister Édouard Geffray said 24 schools had been \"burned and ransacked\" since the start of the protests.\nViolent clashes between students and the police have led to some serious injuries throughout the course of the protests so far.\nOn Monday, a 15-year-old boy's hand was blown off during a confrontation near a school in the northern city of Lens. The student was transferred to a nearby hospital and his injury is not life-threatening, according to officials.\nLast week, Eden, 14, was badly hurt in Saint-Ouen-l'Aumône after reportedly being struck on the head by a tear gas grenade.\nThe student suffered \"a double jaw fracture\" and had to undergo \"extremely major surgery\", according to his lawyer.\nSpeaking at a news conference on Monday, Eden's mother said her heart was \"shattered\".\n\"It's shameful, it's appalling, it's violent, it's horrific,\" French media outlet BFMTV reported her as saying.\n\"This should not happen. They are dealing with children who are asking for better conditions in which to study.\"\nAmong the 5,060 people arrested since the start of the movement, 87% were minors and 13% were adults, according to France's justice ministry, external.\nFourteen people have reportedly been placed in pre-trial detention, while 1,802 people are facing prosecution, including 319 adults and 1,483 minors.\nThe USL has accused police of using excessive force against the protesters. Responding to this allegation last week, Interior Minister Laurent Nuñez said the demonstrations had been policed in \"an extremely proportionate manner\".\nWhile France's next presidential election is still months away, the protests and the response by French authorities have been heavily politicised.\nThe government and hard-right politicians have blamed the hard left for fuelling the protests. Lecornu said LFI was being \"irresponsible\" in calling for the movement to expand.\nThe leader of the hard-right National Rally, Marine Le Pen, has also criticised the left for its response.\n\"This is no longer about high school student protests. It is about riots organised by professionals and overseen by deputies from La France Insoumise,\" she said, calling for a new anti-rioting law to be passed.\nMeanwhile Mélenchon, the LFI's party's presidential candidate, has been blaming the police for \"abuses of power\", calling on people to take to the streets to \"protect the youth demonstrations\".\nThe left-wing mayor of Marseille, Benoît Payan, condemned the \"unacceptable violence\" in his city. While young people were \"legitimately concerned\" about their future and public services, they must express themselves calmly, he said.\nRelated topics\n  - Published3 days ago\n  - Published3 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "blockading", "definition": "建物や場所への出入りを妨害して占拠する行為。デモ活動において、学生たちが学校の出入り口を塞いで機能を停止させることを指す。"}, {"word": "mobilisation", "definition": "特定の目的のために人々を組織し、団結させて行動に導くこと。ここでは抗議活動への参加を促す組織的な呼びかけを意味する。"}, {"word": "unprecedented", "definition": "これまで経験したことがない、前例のない状態。ここでは政府による学生運動への弾圧が極めて異例であることを強調している。"}, {"word": "ransacked", "definition": "建物や場所を荒らし回して、物を盗んだり破壊したりすること。教育施設が抗議活動の過程で荒廃させられたことを表現している。"}, {"word": "concessions", "definition": "譲歩、譲り合い。ここでは政府が暴力的な行為に対して要求に応じることはないという姿勢を示している。"}]}, {"title_ja": "Flydubai co-pilot planned to crash plane into Tel Aviv airport or building, reports say", "title_en": "Flydubai co-pilot planned to crash plane into Tel Aviv airport or building, reports say", "summary_ja": "The Omani national was a \"lone wolf\" extremist, according to the reports.", "summary_en": "The Omani national was a \"lone wolf\" extremist, according to the reports.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm3691y79xp5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Flydubai co-pilot planned to crash plane into Tel Aviv airport or building, reports say\n- Published\nThe co-pilot accused of trying to hijack a flydubai plane planned to crash the aircraft into Tel Aviv's Ben Gurion airport or a tower block in the Israeli city, US and Israeli reports suggest.\nThe Omani national was a \"lone wolf\" extremist, according to the reports.\nThe United Arab Emirates' attorney-general has said the co-pilot attempted to carry out a \"terrorist act\" on flight FZ1073 from Dubai to Tel Aviv last Wednesday.\nHe attacked and wounded the captain with the emergency crash axe kept in the cockpit before being overpowered by passengers. Another crew travelling on the plane was able to land it in Saudi Arabia.\nIsrael's prime minister has said the co-pilot underwent \"Islamist radical indoctrination\" and the captain, passengers and a second crew prevented \"a 9/11 disaster\".\nFlyDubai: What Happened?\nWhat began as a routine flight from Dubai to Tel Aviv turned into a fight for survival when one pilot allegedly stabs another inside the cockpit.\n- Australia investigating Flydubai co-pilot's links to country \n  - Published1 day ago\n- Flydubai co-pilot attacked captain with axe, UAE official says \n  - Published1 day ago\nMore details about the co-pilot of the flydubai flight – whom multiple reports have named as Hamam al-Hammami – emerged over the weekend as he continued to be questioned in the UAE, with Israeli representatives being updated.\nIsraeli media cited sources with knowledge of the probe as saying the co-pilot told investigators that, having attacked Capt Smit Machchhar, he intended to continue flying the plane as normal into Israeli airspace and receive landing clearances from Ben Gurion airport.\nHe then planned to crash the Boeing 737 MAX – with more than 180 passengers on board – into the airport or into a tower block in central Tel Aviv, in the style of al-Qaeda's 11 September 2001 attacks in the US, according to the reports.\nThe sources are quoted as saying he was most likely to have acted alone rather than on behalf of a radical organisation or foreign government.\nThe co-pilot also reportedly told investigators that he had intended to hijack and crash a previous flight to Tel Aviv but changed his mind because he knew someone on board.\nThere was no immediate comment from Emirati or Israeli authorities.\nUAE Attorney-General Hamad al-Shamsi said on Saturday that his country's investigations would establish the full circumstances, motives and any links related to the incident, and that the results would be announced upon their conclusion.\nQuestions are also being asked about major security lapses, including how the attacker was recruited by flydubai and given clearance to fly a plane filled with Israelis to Tel Aviv.\nRegional officials said the co-pilot was barred from flying by Oman's national carrier, Oman Air, and moved to an administrative job because of concerns about his extremist views.\nHe was later hired by UAE-based flydubai after undergoing standard security checks that did not examine his background for potential signs of radicalisation, according to the officials.\nIsraeli aviation regulations also state that pilots who are citizens of countries without formal diplomatic relations with Israel, like Oman, are not permitted to operate flights to the country.\nRegional officials told the Associated Press on Sunday that Emirati authorities had shared with Israel a list of passengers and crew ahead of flight FZ1073's departure.\nIsrael's Shin Bet domestic security agency said the transport ministry was responsible for vetting such lists from foreign airlines.\nBut Transport Minister Miri Regev said her ministry was not given passenger and crew lists, and that security oversight for flights operated by foreign airlines fell under the remit of the Shin Bet and the Mossad foreign intelligence agency.\nIsrael's Prime Minister, Benjamin Netanyahu, has told the head of the National Security Council to review \"all security aspects regarding foreign civil aviation to Israel\".\nAustralian authorities are investigating the co-pilot's links to Australia. Sources have told local media that he studied there between 2015 and 2017.", "translation_ja": "", "vocab": [{"word": "indoctrination", "definition": "思想や信念を繰り返し教え込むことで、批判的思考を失わせるプロセス。政治的または宗教的目的で使用されることが多い。"}, {"word": "probe", "definition": "事件や問題を詳しく調査すること。特に警察や当局による公式な調査を指す。"}, {"word": "lone wolf", "definition": "組織や団体に属さずに単独で行動する過激派やテロリスト。個人的な信念に基づいて独立して行動する人物。"}, {"word": "overpowered", "definition": "力や数で相手を圧倒して制圧すること。攻撃者に対して乗客が協力して彼を抑制した。"}, {"word": "alleged", "definition": "疑いはあるが未だ証明されていない、との意味を持つ。法的には有罪が確定していない段階で使用される。"}]}, {"title_ja": "Trump says 'threat' led US to pull bombers from RAF Fairford", "title_en": "Trump says 'threat' led US to pull bombers from RAF Fairford", "summary_ja": "The Pentagon confirmed on Sunday it had removed the B1 bombers from the base in England back to their home stations in America.", "summary_en": "The Pentagon confirmed on Sunday it had removed the B1 bombers from the base in England back to their home stations in America.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwj3413e5m1lo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Trump says 'threat' led US to pull bombers from RAF Fairford\n- Published\nPresident Donald Trump has said the US moved its bombers out of RAF Fairford because of \"some threats\" to the base.\nThe Pentagon confirmed on Sunday it had removed its bombers - thought to be about a dozen B-1s - from the base back to their home stations in America.\nSpeaking to reporters as he departed for Nebraska on Monday, Trump said the US had known of a \"threat\", which led them to move the bombers.\nEarlier on Monday, a No 10 spokesperson had insisted RAF Fairford was safe and pointed to Trump's comments last week, where he praised the UK's \"police, defence and security services\" in relation to the base.\n- What prompted the US bombers to leave RAF Fairford? \n  - Published3 hours ago\n- What makes RAF Fairford one of the UK's most important military sites? \n  - Published6 days ago\nTrump's comments appear to confirm reports by US media that a new threat led to the bombers being removed after a major incident on 27 September when police were alerted to three \"suspicious vehicles\" near the airbase.\nWhile speaking to a gaggle of reporters outside the White House, Trump was asked if a \"specific threat\" had led the US to pull its bombers from the airbase.\nTrump replied: \"Yeah I think we can say that. They didn't fly out by accident.\n\"There were some threats. And rather than tempting the enemy, we'll capture the enemy and beat the enemy. But why should we leave them there? So we moved them around a little bit. Not very far.\"\nHe added Washington \"actually knows the people that made the threat\", but he did not confirm who.\nThe exact nature of the threat that prompted the aircraft's removal from RAF Fairford remains unclear, but sources in Washington speculated to the BBC it might have revolved around sabotage attempts or attempts to strike the sensitive, expensive aircraft in the event of resumed hostilities with Iran.\nOne source close to the White House pointed to Ukraine's Operation Spiderweb - a covert drone attack on five Russian bases in June last year - as an example of what an enemy force could do, even at a distance.\n\"Whatever they thought it was, it was taken extremely seriously,\" the source said.\nTrump's comments, and those of Vance before him, stand in stark contrast to those of Secretary of State Marco Rubio.\nWhile both Trump and Vance pointed to an unspecified threat, Rubio was much more guarded in his language, noting that it was \"not unusual\" for military units and assets to rotate and be moved around the world.\nRAF Fairford - in the Cotswolds in Gloucestershire - has been at the centre of an incident being investigated by counter-terror police.\nFive men were initially arrested on suspicion of terror offences and subsequently released on bail. A sixth man, a UK-Iranian national, was also later arrested and released on bail.\nFollowing the release of the first five men, Trump criticised the decision and US officials suggested Iran could have been involved in the incident.\nWhitehall sources have not disputed that the decision from Washington to remove the bombers was in response to the incident at the airbase in Gloucestershire.\nSpeaking earlier on Monday, Rubio said he would not directly tie last week's incident to the decision to pull bombers from RAF Fairford.\nHe added: \"It's not unusual to see movement of assets to different parts of the world based on exercises, redeployments, people changing out and new people coming in, new planes coming in and old planes going out.\"\nRubio said the US still had full confidence in the security of all its bases and that British authorities had been very co-operative since the incident.\nVance later said the bombers had been moved out of an \"abundance of caution\", adding Washington felt Iran was doing what it had \"done for 49 years... which is engage in acts of terrorism against the US and against a lot of other people\".\nDays after the incident at RAF Fairford, Prime Minister Andy Burnham said there were \"strong indications\" that Iran had played a part in the incident but he did not provide further details, while Rubio said it had \"clearly involve[d] the hands of a foreign actor\" without going into further details.\nTehran has strongly denied any involvement.\nIn July, Iran said \"any base used for aggression against Iranian territory constitutes a legitimate target for our forces\".\nRAF Fairford, near the village of Whelford, has been used as a forward operating location by the US air force for decades.\nIn recent months, the US has flown B-1 and B-52 bombers from the base for the Middle East, after the UK approved a US request to use it for defensive strikes on Iran.\nThe redeployment from RAF Fairford will reduce America's capacity to \"quickly surge sorties against Iran, reducing the threat level somewhat\", Christoph Bergs, research analyst at defence think tank the Royal United Services Institute told the Reuters news agency.\nHowever, the use of the base had already been limited given London's st", "translation_ja": "", "vocab": [{"word": "covert", "definition": "秘密裏の、隠密の。特に軍事やスパイ活動など、公然とは行われない作戦や活動を指す。"}, {"word": "speculated", "definition": "推測する、憶測する。確実な情報がない中で、可能性のある説を述べること。"}, {"word": "sabotage", "definition": "破壊活動、妨害行為。敵対勢力が施設や機械などを意図的に損傷させる行為。"}, {"word": "hostilities", "definition": "敵対行為、戦闘。国家間または勢力間の武力紛争や対立を指す。"}, {"word": "guarded", "definition": "用心深い、慎重な。情報開示や発言を限定的にして、慎重に対応する様子。"}]}, {"title_ja": "Author and former politician Jeffrey Archer dies aged 86", "title_en": "Author and former politician Jeffrey Archer dies aged 86", "summary_ja": "Archer sold more than 300 million books in his five-decade writing career, and his last book, Adam and Eve, was due to be released later this month.", "summary_en": "Archer sold more than 300 million books in his five-decade writing career, and his last book, Adam and Eve, was due to be released later this month.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckj0l401dvpgo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Author and former politician Jeffrey Archer dies aged 86\n- Published\nBestselling author and former politician Jeffrey Archer has died at the age of 86.\nArcher sold more than 300 million books in his five-decade writing career, including the Clifton Chronicles and Kane and Abel, and often set the novels in his home town of Wellington, Somerset.\nIn a statement, Archer's publisher HarperCollins said the author died \"suddenly and peacefully at home\" on Monday between writing sessions.\nThe former Conservative MP was jailed for perjury in 2001 after being found guilty of lying and cheating in his 1987 libel case against the Daily Star.\nArcher was born in north London on 15 April 1940 but would quickly move to Weston-super-Mare in Somerset, where his family bought a house from John Cleese's mother.\nIn 1969, Archer was elected MP for the Lincolnshire constituency of Louth.\nHe served as an MP for five years before becoming Conservative Party deputy chairman.\nHis political career was paused in 2001 when he was jailed for four years for perjury and perverting the course of justice.\nHe was found to have lied in libel action he had brought against The Star newspaper, in which he was awarded £500,000 in damages.\nHe was released in 2003 and returned to the House of Lords until he retired in 2024.\nHis last book, Adam and Eve, is set to be released this week, HarperCollins said, describing him as a \"master storyteller\" whose readers \"meant everything to him\".\nThe publisher added that the author had been at the Leicester Square Theatre in London on Sunday, signing books for fans with broadcaster Gyles Brandreth.\nWriting on X, Brandreth said: \"Just yesterday I did a show with Jeffrey Archer to celebrate his new novel – he said it was to be his last.\n\"He was in the most wonderful, ebullient form and had such a great reception from a packed house. He was funny, engaging and self-deprecating – a great storyteller to the last.\"\nLast week, Archer also returned to his former school to promote his last book.\n\"It's wonderful to come back. What I got a real thrill about when I was walking towards the library is seeing the young boys and girls and thinking, 'that's the next generation',\" Archer said at Wellington School.\nArcher was due to attend the Cheltenham Festival on Saturday to discuss his final novel.\nHe and his wife Mary had celebrated their 60th wedding anniversary this year, HarperCollins said.\nThe pair have two sons and five grandchildren.\nConservative Party leader Kemi Badenoch described Archer's death as a \"huge shock\".\nWriting on X, she said: \"I am incredibly saddened to hear this news. He had sent me a lovely message just this morning and was always a great source of encouragement to me personally.\"\nPaying tribute to the bestselling author, Kate Elton, HarperCollins UK CEO and Jeffrey's editor, said: \"It has been one of the great privileges of my publishing life to have been Jeffrey Archer's editor.\n\"He was the master storyteller and an editor's dream - phenomenally hard-working, utterly committed to completing draft after draft to get every word as perfect as possible, and a true champion of the 'team' nature of great publishing.\"\nFormer Conservative chancellor Nadhim Zahawi paid tribute to the bestselling author on X, describing him as a \"dear friend and extraordinary human being\".\nHe wrote: \"His gift for storytelling was matched by his wit, warmth and boundless energy. Life was never dull in Jeffrey's company.\"", "translation_ja": "", "vocab": [{"word": "perjury", "definition": "偽証罪；法廷で宣誓した後に意図的に嘘をつく罪。法的な重大犯罪として扱われる。"}, {"word": "perverting the course of justice", "definition": "司法妨害；法の正当な進行を意図的に妨害または歪める行為。深刻な犯罪である。"}, {"word": "ebullient", "definition": "陽気で活力に満ちた；興奮して熱狂的な様子。前向きで生き生きとした気分や態度を示す。"}, {"word": "constituency", "definition": "選挙区；政治家が代表する地域または有権者のグループ。"}, {"word": "self-deprecating", "definition": "自分自身を謙虚に貶める；自分の能力や業績を控えめに評価する傾向。ユーモアを交えることが多い。"}]}, {"title_ja": "King's funding for Andrew not to be used for legal action against police", "title_en": "King's funding for Andrew not to be used for legal action against police", "summary_ja": "Andrew Mountbatten-Windsor is taking action over search warrants issued ahead of his arrest in February.", "summary_en": "Andrew Mountbatten-Windsor is taking action over search warrants issued ahead of his arrest in February.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c9ly0l028d1go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "King's funding for Andrew not to be used for legal action against police\n- Published\nAndrew Mountbatten-Windsor has been told that the allowance given to him by King Charles should not be used to fund his legal action against Thames Valley Police and the Central Criminal Court.\nThe King uses his own private money to support his brother and to accommodate him on his estate in Sandringham.\nBut a royal source said that this funding should not be used for a legal challenge being launched by Mountbatten-Windsor against the search warrants issued ahead of his arrest in February.\nThe former Prince Andrew was arrested on suspicion of misconduct in public office in the wake of information that emerged from the Epstein files in the United States.\nMountbatten-Windsor has consistently denied any wrongdoing linked to his association with Epstein.\nThe former Prince Andrew is not a working royal - so Buckingham Palace no longer speaks on his behalf and is not involved in his legal battle.\nBut a royal source said the King's financial support for his brother should not be directed towards paying for the judicial review that Mountbatten-Windsor is seeking.\nIt's not been disclosed how much the King gives to Mountbatten-Windsor, but the funding for his brother was part of the arrangement when the former Prince Andrew was moved from his previous home at Royal Lodge in Windsor.\nThis allowance for Mountbatten-Windsor is not from the Sovereign Grant, which is the £138m in public funding for the monarchy.\nIt is drawn from the King's private money, which includes his income from the Duchy of Lancaster, private estates and his own investments and inheritances.\nAt the time of Mountbatten-Windsor's arrest, the King said the \"law must take its course\", and the Palace is now distancing itself from the former Duke of York's legal pushback.\nMountbatten-Windsor's lawyers are understood to be challenging Thames Valley Police and the Central Criminal Court over the lawfulness of warrants used for searches of Sandringham and Royal Lodge - in what has been Andrew's first public response since his arrest earlier this year.\nThames Valley Police has confirmed it is \"engaged in legal proceedings in relation to warrants previously obtained from the Central Criminal Court\".\nIt added: \"As these legal proceedings are currently ongoing, it would be inappropriate for us to comment further.\"\nMountbatten-Windsor, who lost his titles as a prince and Duke of York over his connections to the sex offender Jeffrey Epstein, wants a judicial review to consider the legality of the search warrants.\nA court hearing on Thursday afternoon will be part of Mountbatten-Windsor's bid to quash the warrants.\n- Why was Andrew Mountbatten-Windsor arrested and what happens next? \n  - Published24 February\n- How Andrew's 11-hour detention on his birthday played out \n  - Published20 February\n- Shell-shocked, haunted photo of Andrew will be part of how arrest is remembered \n  - Published19 February\nThe warrants had been issued by a judge at the Central Criminal Court on 18 February - the day before Mountbatten-Windsor was arrested in Sandringham.\n\"Even if Andrew succeeds in having the search warrants quashed, that would not necessarily be the victory it might first appear,\" said Nick Vamos, a criminal lawyer at Peters & Peters and former head of special crime at the Crown Prosecution Service.\nVamos said disputes over warrants were not uncommon - but if the police lost on a technical error, they could still sometimes keep what they had obtained in a search.\n\"The police can apply back to the Crown Court to retain the material if they have grounds to immediately seize it again,\" said Vamos.\nIt would need to be a more fundamental issue with the granting of the warrants for the police to be required to return the material from a search, he said.\nMountbatten-Windsor's arrest, carried out on his 66th birthday, followed a series of revelations from the Epstein files, published by the US Department of Justice.\nThey included emails appearing to show official documents being shared by Mountbatten-Windsor with Epstein and others, at a time when he was the UK's trade envoy.\nMountbatten-Windsor had already been stripped of his titles by King Charles, after emails had shown Mountbatten-Windsor had continued his links with Epstein, beyond when he had publicly said connections had been severed.\nAfter Mountbatten-Windsor's arrest he was taken to Aylsham police station. A photograph captured his departure later that day, looking exhausted, after he was released under investigation.\nSign up here to get the latest royal stories and analysis every week with our Royal Watch newsletter. Those outside the UK can sign up here.", "translation_ja": "", "vocab": [{"word": "judicial review", "definition": "行政機関や裁判所の決定の合法性を審査する法的手続。裁判所がその決定が法律に適合しているかどうかを検討するプロセスです。"}, {"word": "warrants", "definition": "裁判官が発行する捜索令状や逮捕令状などの公式文書。警察が法的に家宅捜索や逮捕を実行する権限を与えるものです。"}, {"word": "misconduct in public office", "definition": "公職にある者が職務を不正に遂行する違法行為。公務員が職権を濫用したり、職務義務に違反する行為を指します。"}, {"word": "Sovereign Grant", "definition": "イギリスの君主制度と王室の運営に充てられる公式な公的資金。毎年議会から割り当てられる王室の主要な財源です。"}, {"word": "distancing itself", "definition": "何かから意図的に距離を置く、関係を切り離す行為。特に政治的または法的な責任から身を守るために関係を縮小することを意味します。"}]}, {"title_ja": "ICC unseals Taliban leaders' warrants over persecuting women", "title_en": "ICC unseals Taliban leaders' warrants over persecuting women", "summary_ja": "The court gave more details on the warrants for four Taliban leaders accused of the crime against humanity of gender persecution of women, girls and the LGBTQ+ community. The Islamist group rejected the warrants.", "summary_en": "The court gave more details on the warrants for four Taliban leaders accused of the crime against humanity of gender persecution of women, girls and the LGBTQ+ community. The Islamist group rejected the warrants.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/icc-unseals-taliban-leaders-warrants-over-persecuting-women/a-79556631?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "ICC unseals Taliban leaders' warrants over persecuting women\nOctober 5, 2026\nThe International Criminal Court (ICC) disclosed on Monday more details about the arrest warrants against two Taliban leaders, while also issuing two more arrest warrants.\nThe four Taliban leaders are accused of crimes against humanity through the persecution of women, girls and the LGBTQ+ community in Afghanistan since taking power in 2021.\nAccording to the court, warrants were issued in July and September of last year against Hibatullah Akhundzada , the Taliban's Supreme Leader, as well as against Abdul Hakim Haqqani, who heads the country's Supreme Court.\nThe other two warrants were issued against Education Minister Habibullah Agha and Minister of Higher Education Neda Mohammad Nadim.\nThe four are charged with persecution on grounds of gender of \"girls, women and other persons nonconforming with the Taliban's policy on gender, gender identity or expression; and on political grounds against persons perceived as 'allies of girls and women,'\" according to the court.\nWhat does the ICC accuse the 4 Taliban leaders of?\nThe judges who issued the warrants said that the four implemented policies that saw \"severe violations of fundamental rights and freedoms of the civilian population of Afghanistan, in connection with conducts of murder, imprisonment, torture, rape and enforced disappearance.\"\nThe Taliban \"specifically targeted girls and women by reason of their gender,\" the judges added, also mentioning persecution against people due to \"certain expressions of sexuality and/or gender identity.\"\nThe ICC has no jurisdiction to execute the warrants. Still, the move is considered a form of pressure on the Afghan ruling authority.\nThe Taliban have taken a wide range of measures to restrict women's access to jobs and education beyond sixth grade, as well as barring them from most public spaces.\nWomen are also obligated to cover their whole bodies apart from their eyes upon leaving home, with a male relative having to accompany them on long trips.\nTaliban rejects ICC's warrants\nAfghanistan's government spokesperson said the country does not recognize the court's authority.\n\"We are bound by the rulings of Islamic Sharia and its courts, not by intelligence entities or so-called courts.\" chief spokesman Zabihullah Mujahid said in a statement.\nA request for warrants for Akhundzada and Haqqani made last year by former ICC chief prosecutor Karim Khan argued that \"Afghan women and girls as well as the LGBTQI+ community are facing an unprecedented, unconscionable and ongoing persecution by the Taliban.”\nThe UN Human Rights Council has called on the Taliban to drop its \"systematic oppression of all women and girls in Afghanistan.\"\nHuman rights groups have been calling for the international community to do more against the Taliban's gender-based policies in Afghanistan.\nEdited by: Rana Taha\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "persecute", "definition": "特定のグループの人々に対して組織的かつ継続的に危害や差別を加えること。政治的、宗教的、または人種的な理由に基づいて行われることが多い。"}, {"word": "jurisdiction", "definition": "特定の法廷や政府機関が法的権限を行使できる範囲や領域。ある組織がその権限を及ぼせる地理的または法的な範囲を指す。"}, {"word": "enforce", "definition": "法律や規則を厳格に実行または強制すること。権力を使って特定のルールや政策を強制的に実施する。"}, {"word": "accord", "definition": "一致や合意。また、正式な合意や協定を指す場合もある。特定の意見や規則と一致して行動することを表す。"}]}, {"title_ja": "Australia's migrant policy offers lessons for EU and US", "title_en": "Australia's migrant policy offers lessons for EU and US", "summary_ja": "Australia has used offshore processing centers to deter asylum seekers for more than two decades. As the EU and US pursue similar third-country arrangements, Australia's experience highlights the potential problems.", "summary_en": "Australia has used offshore processing centers to deter asylum seekers for more than two decades. As the EU and US pursue similar third-country arrangements, Australia's experience highlights the potential problems.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/australia-s-migrant-policy-offers-lessons-for-eu-and-us/a-79388096?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Australia's migrant policy offers lessons for EU and US\nOctober 5, 2026\nNations that send asylum seekers to third countries for offshore processing and holding could spend billions, only to face accusations of human rights abuses and financial mismanagement, as in Australia.\nThe European Union (EU) has nevertheless been considering the idea, and the United States (US) has already made similar third-country deals, but Australia has been processing or relocating people outside the country where they seek protection for more than two decades.\nFormer Australian Prime Minister John Howard introduced the so-called \"Pacific Solution\" in 2001, targeting immigrants who arrived by boat, and establishing Australian migration processing centers with the help from governments in Papua New Guinea (PNG) and the tiny island nation of Nauru .\nThousands sent to islands under Australia's 'Pacific Solution'\nCenter-left and center-right governments described the policy as a deterrent, saying people were less likely to attempt dangerous ocean crossings or pay smugglers if arriving by boat did not provide a route to Australia. In his 2001 election policy speech, Howard said the famous line, frequently quoted since: \"We will decide who comes to this country and the circumstances in which they come.\"\nIn 2008, a newly elected Labor Party government phased out the practice, saying it was a cynical, costly, and ultimately unsuccessful exercise.\nBut faced with more deaths at sea, a Labor government under Prime Minister Julia Gillard started sending maritime arrivals to Nauru and Manus again in 2012, after an expert panel recommended reopening the centers.\n\"I'm not going to play politics or look at political scoreboards when too many lives have been lost,\" Gillard said at the time.\nBetween 2013 and 2014, the number of people transferred offshore peaked to more than 3,000.\nJournalists have been mostly barred from the centers on Nauru and Manus Island. Graham Thom, Advocacy Coordinator for the Refugee Council of Australia (RCOA), told DW that this lack of access and independent oversight meant many Australians accepted the narrative that the policy was working.\nEU considers offshore arrangements\nPeople without a legal right to remain in the EU could face deportation to third countries as soon as 2027, with Rwanda and Uzbekistan reportedly under consideration as third-party countries, as well as Uganda.\nThe European Parliament in June approved new rules that would pave the way for so-called \"return hubs\" outside the EU's borders.\nDenmark's Minister for Immigration and Integration, Morten Bodskov, told reporters last month the hubs would not be detention and deportation centers.\n\"We are not talking about camps,\" Bodskov said, describing the scheme instead as \"a new chance to have a life in a partner country.\"\nDenmark, alongside Germany, Austria, Greece, and the Netherlands, known collectively as the Group of Five, said in September they had agreed on steps towards a deal with a non-EU country, without naming it.\nThe group was to speak with the United Nations (UN) body, the International Organization for Migration, and the UN Refugee Agency about their next steps.\nThe proposal allows for harsh penalties for those who refuse to be removed to the hubs, including detention for up to 30 months pending deportation from the EU and entry bans.\nUS already has a third country migration scheme\nThe US government has already made deals with at least 30 third countries in Africa and Latin America. In June, Amnesty International said some agreements had been revealed through the US Freedom of Information Act, while others \"remain secret.\"\nThe US Supreme Court ruled late last month that the second Trump administration could resume deportations under the third-country scheme, after a US appeals court ruled that immigrants must receive effective notice of their intended destination and an opportunity to challenge removal if they fear persecution or torture.\nThe first deportations from the US under the third-country removal scheme were of immigrants convicted of crimes, but more recently, foreign nationals not accused of any crime have also been deported. \nAccusations of human rights abuse\nAsylum seekers and human rights advocates have repeatedly alleged human rights abuses in Australia's offshore migration processing program, with Thom describing the policy as a \"medieval idea.\"\nA group of asylum seekers formerly detained on Manus Island reached a AU$70 million (€43.47 million/$48.47 million) settlement in 2017 after filing charges for abuse and unlawful detention.\nIn February, an Australian Senate inquiry heard first-hand witness accounts of neglect, untreated health conditions, and serious concerns for the safety and dignity of camps inhabitants — especially of women being kept on Nauru. Prior to the hearing, 73 UN member states had publicly raised concerns about Australia's migration policies.\nBrazil, China, Finland, Germany, Serbia, Switzerland and Turke", "translation_ja": "", "vocab": [{"word": "offshore processing", "definition": "第三国での処理・管理のこと。本国以外の場所で難民申請者などを処理する制度を指す。"}, {"word": "deterrent", "definition": "抑止力、防止策という意味。ここでは、危険な行為を避けさせるための施策を指している。"}, {"word": "cynical", "definition": "皮肉的な、不誠実なという意味。政策が本当の解決ではなく、政治的な見せかけであることを示唆している。"}, {"word": "oversight", "definition": "監視、監督という意味。ここでは独立した第三者による検査や監視の不足を指す。"}, {"word": "pave the way for", "definition": "～の道を開く、～を可能にするという表現。新しい施策や変更が実現されるための基礎を作ることを意味する。"}]}, {"title_ja": "Yemen launches major military operation against Houthis", "title_en": "Yemen launches major military operation against Houthis", "summary_ja": "Yemen's internationally recognized government has launched a new military offensive to retake Houthi-held territory, as the Iran-backed rebel group claims new attacks in Saudi Arabia.", "summary_en": "Yemen's internationally recognized government has launched a new military offensive to retake Houthi-held territory, as the Iran-backed rebel group claims new attacks in Saudi Arabia.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/yemen-launches-major-military-operation-against-houthis/a-79542723?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Yemen launches major military operation against Houthis\nOctober 5, 2026\nYemen's military and a Saudi-led coalition launched an offensive against Iran-backed Houthi fighters on Monday, a day after Yemeni Presidential Council chief Rashad al-Alimi announced the lofty goal of retaking all territory held by the Iran-backed rebel group.\nThe Yemeni military said Monday operations were commencing in the Houthi-held capital, Sanaa, while the Saudi-led coalition said it had hit Houthi \"military targets\" in the town of Hodeida on the Red Sea coast.\nA coalition spokesman on X said that naval forces had \"destroyed weapons depots, facilities storing booby-trapped boats and naval mines\" and had \"thwarted a planned attack\" targeting waterways in the southern Red Sea.\nYemeni officials said forces allied with the internationally recognized government retook the crucial town of Dhubab just north of strategic Bab el-Mandeb Strait.\nSunday's announcement came after Houthi fighters captured a key road linking the key southwestern city of Taiz with the government-held city of Aden, effectively isolating Taiz. The rebels have besieged Taiz for more than a decade.\nMore than 70 people were reportedly killed in fighting around Taiz over the past day, according to AFP news agency.\nHouthi's claim new strikes on Riyadh\nMeanwhile, a Houthi military spokesman said Monday that ballistic missiles and drones targeted King Khalid International Airport in the Saudi capital, Riyadh, and an oil refinery in the Red Sea city of Rabigh.\nThe spokesman said the Aramco refinery in Rabigh was also hit along with military sites and smaller airports in the south.\nThere was no immediate confirmation from Saudi authorities on the reported strikes.\nMecca alliance to deploy forces\nIn response to the latest escalation, Turkey, and Pakistan agreed on Monday to deploy troops as part of the collective defense agreement under the Mecca Joint Defense Agreement the two countries signed in August with Saudi Arabia.\nThe move came after an emergency meeting in Riyadh.\nIn a joint statement, the trio \"reaffirmed their unequivocal rejection of any attack or threat against the Kingdom's security and territorial integrity.\"\nThe statement did not specify what sort of role the troops would fill once in Saudi Arabia.\nThe three countries condemned the Houthis' targeting of Saudi Arabia's two holiest cities, Mecca and Medina, as well as agreeing to provide the \"agreed military forces and capabilities,\" which will be deployed in Saudi Arabia.\nHow did the conflict between Saudi Arabia and Houthis escalate?\nThe latest developments come amid an escalation between the Houthis and the internationally recognized government in Yemen that is supported by Saudi Arabia, reviving Yemen's civil war after a four-year ceasefire.\nA 2022 truce between the Houthis and Saudi Arabia collapsed in July after the rebels allowed an Iranian plane to land in Yemen's capital Sanaa, which defied the Saudis' control over Yemeni airspace.\nAs a result of the escalation, the Houthis announced a maritime blockade on Saudi Arabia.\nLast month, the Houthis seized Yemen's Red Sea coast and the Bab el-Mandeb Strait — a vital global shipping route — from government hands, even as Al-Alimi called for support from the international community.\nAt the same time, Houthi's have been launching long-range attacks at targets in Saudi Arabia.\nThe Iran-backed Houthis have controlled Sanaa and much of Yemen's more populous western areas since the start of Yemen's civil war in 2014.\nEdited by: Elizabeth Schumacher and Wesley Dockery\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "offensive", "definition": "攻撃作戦、または積極的な軍事行動。ここでは、イエメン軍がフーシ派に対して仕掛ける大規模な軍事作戦を指す。"}, {"word": "coalition", "definition": "共通の目的のために一時的に結成された複数の国や勢力の同盟。この記事ではサウジアラビア主導の連合軍を指す。"}, {"word": "thwarted", "definition": "計画や企図を阻止する、妨害する。ここでは連合軍がフーシ派の攻撃計画を未然に防いだことを意味する。"}, {"word": "escalation", "definition": "状況や紛争が段階的に悪化・拡大すること。軍事衝突の規模や強度が増していく過程を指す。"}, {"word": "territorial integrity", "definition": "国家が領土主権を保つ権利、領土の完全性。国家の境界線と領土の不侵害を意味する国際法上の概念。"}]}, {"title_ja": "Trump says his super PAC will pay for controversial promotional ad campaign", "title_en": "Trump says his super PAC will pay for controversial promotional ad campaign", "summary_ja": "The ads that mirrored campaign spots were paid for with government funds.", "summary_en": "The ads that mirrored campaign spots were paid for with government funds.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-super-pac-pay-controversial-promotional-ad-campaign/story?id=137019187", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Pentagon to execute convicted Fort Hood mass shooter Nidal Hasan by firing squad", "title_en": "Pentagon to execute convicted Fort Hood mass shooter Nidal Hasan by firing squad", "summary_ja": "Pentagon spokesperson Sean Parnell said in a statement that Defense Sec. Pete Hegseth recommended the execution and it was approved by President Donald Trump.", "summary_en": "Pentagon spokesperson Sean Parnell said in a statement that Defense Sec. Pete Hegseth recommended the execution and it was approved by President Donald Trump.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/pentagon-execute-convicted-fort-hood-mass-shooter-nidal/story?id=137019865", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Guardian readers fund life-changing surgery for Somali boy injured in US airstrike", "title_en": "Guardian readers fund life-changing surgery for Somali boy injured in US airstrike", "summary_ja": "After Guardian investigation uncovered drone strike that killed 12 civilians and injured many more, seven-year-old Abdiqadir Salah underwent vital operation in Mogadishu On the rickshaw ride to the hospital, Marian Haji Abdi Guled felt a mixture of joy and apprehension: the day they had been waiting", "summary_en": "After Guardian investigation uncovered drone strike that killed 12 civilians and injured many more, seven-year-old Abdiqadir Salah underwent vital operation in Mogadishu On the rickshaw ride to the hospital, Marian Haji Abdi Guled felt a mixture of joy and apprehension: the day they had been waiting", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/05/guardian-readers-fundraising-somalian-boy-injured-in-us-strike-surgery-abdiqadir-salah", "state_media": false, "category": "経済", "full_text": "On the rickshaw ride to the hospital, Marian Haji Abdi Guled felt a mixture of joy and apprehension: the day they had been waiting for had finally arrived.\nAlmost a year earlier, her then seven-year-old son, Abdiqadir Salah, had been seriously injured, alongside his two siblings, in what a Guardian investigation found was a US drone strike on the village of Jamaame in Somalia that killed at least 12 civilians, including eight children.\nAbdiqadir’s small body had been impaled by shrapnel in the attack, and several chunks remained embedded in his back.\nDoctors feared that without an operation to remove them, the boy would lose his ability to walk, but Guled had no money for an operation. For 10 months, the family had languished in Mogadishu with growing expenses and no income – unable to afford surgery, but unwilling to let the boy return to the village without it.\nAfter the investigation, which told the story of Guled and other civilians affected by the attack, a group of Guardian readers from across the globe fundraised for Abdiqadir’s surgery and recovery.\nWithin a few hours, enough money was raised to cover his treatment and rehabilitation, as well as any medical expenses and treatment for her other two children, who sustained less extensive injuries.\n“I was so happy when I found out that Guardian readers raised the money needed for my son’s surgery. I didn’t know people like this existed,” Guled said.\n“The people who contributed to the surgery – I really appreciate their support and how they stood by our family when we needed it the most.”\nOn a Saturday morning in September, Guled waited anxiously as Abdiqadir was finally taken for surgery at Kaafi hospital in Mogadishu.\n“Other patients were taken into surgery after him and came out before him – so I worried maybe something went wrong,” she said. “I got to a point where I knocked on the operating room door asking if my son was still alive, then was held back by other patients.”\nFinally, her son emerged. Doctors told Guled the surgery had been successful, but complex. While the first two pieces of shrapnel from the missile had been successfully removed, taking out the final piece was considered too risky, possibly resulting in paralysis, so they concluded that it was safer to leave it and monitor his condition.\nWhen the Guardian visited Abdiqadir a few weeks later, he appeared bright, energised and visibly happy. “I have one piece of metal still in me, and if they touch it, I might become paralysed,” the seven-year-old said. “[But] I don’t have any problem with the last piece of metal in my body, because I’m no longer in pain.”\nThe Guardian investigation into the US airstrikes that injured Abduqadir raised myriad questions about US military intelligence, such as how the targets were selected and why children were hit while they were clearly visible and out in the open. The US has not responded to any questions about the Jamaame attack.\nIn the months since then, US attacks on the area have continued: from December 2025 to July 2026, it carried out at least three airstrikes around Jamaame, according to research by New America, a security thinktank that documents US military operations abroad. Residents say drones continue to fly above the town.\n“We cannot return to Jamaame because what caused my children to be hurt is still there,” Guled said. “I fled Jamaame with my wounded children because of the drones, and the drones are still [flying].”\nWith the remaining financial support she received from Guardian readers, Guled plans to relocate with her children to the government-controlled port city of Kismayo, which has not been the target of drone strikes, and where Abdiqadir can receive further surgery if needed.\nShe still wants answers from the US government, nearly a year after they were bombed. “My son has been left scarred for life,” she said.\n“I want the US government be held accountable for what they did to my family and for the US to stop bombing our community.”", "translation_ja": "", "vocab": [{"word": "apprehension", "definition": "不安や懸念の感覚。将来の出来事について心配や恐れを感じている状態を表す。"}, {"word": "embedded", "definition": "深く埋め込まれた、または固く組み込まれた状態。物理的または概念的に何かが深く組み込まれていることを示す。"}, {"word": "languished", "definition": "衰退または停滞した状態で過ごした。進展がなく、つらい状況が続いている状態を表す。"}, {"word": "extensive", "definition": "広範囲に及ぶ、または大規模な。範囲が広く、程度が大きいことを示す。"}, {"word": "paralysis", "definition": "麻痺。筋肉の機能が失われた状態。医学的には神経系の損傷により身体が動かせなくなること。"}]}, {"title_ja": "Skull fractures suggest servants of Egypt’s ancient kings were sacrificed", "title_en": "Skull fractures suggest servants of Egypt’s ancient kings were sacrificed", "summary_ja": "Study of remains taken from royal cemetery at Umm el-Qa’ab appears to confirm early Egyptologist’s theory Court officials and craftspeople serving early Egyptian kings may have been sacrificed when their ruler died, according to research that found fractures in several ancient skulls. The royal ceme", "summary_en": "Study of remains taken from royal cemetery at Umm el-Qa’ab appears to confirm early Egyptologist’s theory Court officials and craftspeople serving early Egyptian kings may have been sacrificed when their ruler died, according to research that found fractures in several ancient skulls. The royal ceme", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/science/2026/oct/05/skull-fractures-suggest-servants-of-egypts-ancient-kings-were-sacrificed", "state_media": false, "category": "社会", "full_text": "Court officials and craftspeople serving early Egyptian kings may have been sacrificed when their ruler died, according to research that found fractures in several ancient skulls.\nThe royal cemetery of Umm el-Qa’ab near Abydos features the tombs and enclosures of the First Dynasty rulers of Egypt, and dates as far back as 3,000BC.\nNot only royalty were buried at the site: surrounding these structures are graves thought to belong to people associated with the royal households – including ladies, seal-bearers, inspectors and artisans.\nWriting in the journal Frontiers in Environmental Archaeology, Dr Roselyn Campbell, author of the study from Purdue University in the US, notes: “While Aha, the first ruler of the First Dynasty, seems to have only had a few subsidiary burials, his successors included hundreds of subsidiary graves around their tombs and enclosures.”\nThe graves of the retainers were excavated in the 1920s by the English Egyptologist Flinders Petrie, who believed them to be an example of human sacrifice – a view some later experts agreed with.\nBut there was a snag: Petrie did not find any evidence of trauma on the remains. While he suggested the individuals may have been buried alive, others suggested the retainers died naturally and were later reburied at Abydos when their ruler died.\nCampbell re-examined the skulls of 46 retainers excavated from graves surrounding the funerary enclosures of three different royals – King Djer, King Djet, and Queen Merneith – from the Duckworth Collections at the University of Cambridge.\n“This question of whether or not retainer sacrifice was practised in Egypt has been debated for over a century, but this is the first study to examine the human remains from the tombs themselves,” Campbell told the Guardian.\nCampbell reports that 18 of the skulls showed signs of potentially lethal trauma such as fractures and – in one case – a chopping injury to the eye.\nCampbell believs Petrie may have seen the skull fractures but did not realise they were injuries that occurred around the time of death, rather than arising as a result of later damage.\nThe fractures, she adds, are unlikely to have been caused by a mace – a weapon often depicted in ancient Egyptian art as being used by a victorious king to smite his enemies. Instead they are more likely to have been caused by flat, wide objects made of wood or antler.\n“For the crania without trauma, we cannot be certain they were sacrificed. It’s quite possible that some of the retainers were sacrificed, while others were not,” she said. “With such a small sample size of the original burial population, we simply can’t see the full extent of these funerary rituals, nor can we be sure that this sample is truly representative of all the retainers.”\nCampbell noted the number of subsidiary graves tapered off quickly and seems to have disappeared with the beginning of the Second Dynasty.\nSalima Ikram, a professor at the American University in Cairo, said while the idea of retainer sacrifice was not totally new, “this paper is one of the few times that rigorous current methodologies are being used to evaluate these remains”.\nShe added: “The practice was short-lived, with people being replaced by statuettes. Possibly some or all retainers felt that this was a boon and that they would enjoy an eternal life in the service of the god-king, though they might also have resented it, been terrified, and tried to escape this fate.”\nDr Dawn McCormack, an Egyptologist at Samford University, Alabama, said similar sacrifices had occurred across different cultures and times, adding that not everyone at the Egyptian site may have been compliant.\n“If you really think about what those scenes would have looked like, it would have been very gruesome,” she said. While noting that the study only involved a small number of skulls from the burial site, “the idea that some of the people may have been violently killed, I think, is something that in reality we might expect”, she said.", "translation_ja": "", "vocab": [{"word": "subsidiary", "definition": "主要なもの以外の二次的な、または附属的な。ここでは、王に従属する身分の低い人々の埋葬を指す。"}, {"word": "retainer", "definition": "貴族や王に仕える従者や家臣。中世やそれ以前の社会で、主君に仕えた人物を指す。"}, {"word": "trauma", "definition": "身体的または心理的な外傷。医学用語として、怪我や損傷を意味する。"}, {"word": "crania", "definition": "頭蓋骨の複数形。頭部の骨格構造を指す医学用語。"}, {"word": "smite", "definition": "力強く打つ、撃つ。古い文学的表現で、敵を倒すなどの行為を劇的に描写する際に用いられる。"}]}, {"title_ja": "Egyptian journalist faces terrorism charges after entire newsroom detained", "title_en": "Egyptian journalist faces terrorism charges after entire newsroom detained", "summary_ja": "Calls for release of six Matsadaash staff after one is charged, while whereabouts of other five remain unknown An Egyptian journalist has been charged with joining a terrorist group, days after an entire newsroom was detained in what rights groups have said is a crackdown on press freedoms. Last wee", "summary_en": "Calls for release of six Matsadaash staff after one is charged, while whereabouts of other five remain unknown An Egyptian journalist has been charged with joining a terrorist group, days after an entire newsroom was detained in what rights groups have said is a crackdown on press freedoms. Last wee", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/04/egyptian-journalist-faces-terrorism-charges-entire-newsroom-detained-matsadaash-press-freedom", "state_media": false, "category": "経済", "full_text": "An Egyptian journalist has been charged with joining a terrorist group, days after an entire newsroom was detained in what rights groups have said is a crackdown on press freedoms.\nLast week, authorities arrested six journalists from the independent fact-checking and investigative platform Matsadaash – literally meaning “don’t believe” – accusing them in a statement of being unlicensed and publishing false news on behalf of the outlawed Muslim Brotherhood.\nThe outlet’s six journalists, Abdallah Qadri, Mohamed Ashraf, Mohamed Adel, Islam Barakat, Mohamed Mahmoud and Omar Helal, were arrested by security forces over the course of two days.\nOn Sunday, Egyptian authorities charged Ashraf with joining a terrorist group and spreading false news, according to a statement by the Egyptian Initiative for Personal Rights, a NGO. The charges came after an interrogation that lasted from 10pm to 8am and focused exclusively on material published by Matsadaash, the rights group said.\nAshraf was to be held for 15 days, pending investigation, while the whereabouts of the other five journalists were still unknown.\nAbdelrahman Mansour, the co-founder of the platform, denied having any association with the Muslim Brotherhood, a transnational movement that was designated a terrorist organisation by Egypt in 2013 after the former president Mohamed Morsi, a senior Brotherhood figure, was ousted in a coup. Mansour called the arrests “one of the gravest attacks on journalism in Egypt’s modern history”.\n“My colleagues were doing what journalists should do: asking difficult questions, uncovering facts, and reporting on issues that affect people’s lives. They deserve recognition for their work. Instead, their homes were raided, and all six were taken away,” he said. “The government must answer this question: why have you arrested six journalists? What have they done beyond doing their jobs?”\nThe Guardian contacted the Egyptian State Information Service for a comment but did not receive a reply by the time of publishing.\nDozens of journalists staged a sit-in outside the Egyptian Journalists Syndicate (EJS) in Cairo on Saturday, demanding the release of the Matsadaash staff. Members said they would keep the sit-in open ended until the journalists were released, and the EJS said it would convene an emergency meeting on Monday.\nThe EJS had filed a request with the ministry of interior and public prosecutor for the release of the journalists, as well as for information on their whereabouts.\nMore than 80 rights groups, including Human Rights Watch and the Committee to Protect Journalists, condemned the arrests as a violation of freedoms, and demanded the immediate release of the Matsadaash staff.\nThe arrests came little over a week after the US government waived its human rights conditions on $320m (£242m) in military aid to Egypt, citing Cairo’s “helpful role” to US national security after the US-Iran war.\nThe US gives about $1.3bn in aid to Egypt annually, but a portion is contingent upon the Egyptian government meeting certain human rights and democracy-related requirements. The US has withheld portions of aid several times since the 2013 coup owing to Egypt’s poor human rights record, but has largely kept funds flowing.\nThis year, Washington waived the human rights requirement in total, as doing so was “essential for the US-Egypt relationship and US national security priorities”, according to a state department memo revealed by Reuters.\nWhile saying that he was unsure whether the arrests were linked to the recent waiver, Mansour said: “The use of the national security waiver on human rights conditions by the US by many years, a willingness by other states to look the other way on Egypt’s human rights record … certainly enables violations like this to occur more easily.”\nCairo has for years faced criticism for its human rights abuses, with the rights monitor Freedom House saying Egyptian security forces “engage in human rights abuses and extrajudicial killing with impunity”.\nSince the Egyptian president Abdel Fatah al-Sisi took power in the coup that ousted Morsi, civil liberties have been curbed and domestic political opposition has been violently crushed.\nEgypt ranks 169th out of 180 countries on the Reporters Without Borders Press freedom index. Freedom of the press is tightly restricted in the country and independent platforms such as Matsadaash are rare. About 26 journalists are held in Egyptian prisons, according to the EJS.", "translation_ja": "", "vocab": [{"word": "crackdown", "definition": "不正や違反行為などに対する厳しい取り締まり。政府が特定の活動や言論を抑圧するために行う強硬措置を指す。"}, {"word": "outlawed", "definition": "法律により禁止された、違法とされた状態。政府が公式に禁止した組織や活動を表す。"}, {"word": "transnational", "definition": "複数の国にまたがる、国境を超えた性質を持つ。一つの国に限定されず、国際的に広がっている組織や運動を指す。"}, {"word": "designated", "definition": "公式に指定された、任命された。政府機関などが正式に何かを特定の名目や分類に指定することを意味する。"}, {"word": "convene", "definition": "会議や集会を召集する、開催する。正式に人々を集めて会合を行うことを表す。"}]}, {"title_ja": "Syrian Airlines unveils laser-sharp look for the future", "title_en": "Syrian Airlines unveils laser-sharp look for the future", "summary_ja": "Syrian Airlines unveils a new visual identity as it rebrands amid Syria’s post-Assad development.", "summary_en": "Syrian Airlines unveils a new visual identity as it rebrands amid Syria’s post-Assad development.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/6/syrian-airlines-unveils-laser-sharp-look-for-the-future?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Syrian Airlines unveils laser-sharp look for the future\nNewsFeed\nSyrian Airlines unveils laser-sharp look for the future\nSyrian Airlines unveiled its new visual identity in a ceremony at Damascus Airport, featuring a revamped colour scheme, modernised booking and payment platforms, and a mobile app launching in November.\nPublished On 6 Oct 2026", "translation_ja": "", "vocab": [{"word": "revamped", "definition": "改装した、改新した。既存のものを大幅に改善・改造することを指す。"}, {"word": "visual identity", "definition": "ブランドアイデンティティの視覚的表現。ロゴ、色、デザインなどの統合的な見た目のこと。"}, {"word": "modernised", "definition": "近代化した、最新式にした。古いシステムや施設を現代的な基準に更新することを意味する。"}]}, {"title_ja": "Moroccan journalists recount years of surveillance amid new Amnesty claim", "title_en": "Moroccan journalists recount years of surveillance amid new Amnesty claim", "summary_ja": "Amnesty cites a whistleblower’s account of how Morocco allegedly uses surveillance to silence journalists.", "summary_en": "Amnesty cites a whistleblower’s account of how Morocco allegedly uses surveillance to silence journalists.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/6/moroccan-journalists-recount-years-of-surveillance-amid-new-amnesty-claim?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Moroccan journalists recount years of surveillance amid new Amnesty claim\nAmnesty cites a whistleblower’s account of how Morocco allegedly uses surveillance to silence journalists.\nRabat, Morocco – “I was surveilled not because of a specific article. I was investigating land dispossession in Morocco. I then learned I was a Pegasus target,” Omar Radi, a journalist and human rights defender, told Al Jazeera, referring to the mobile surveillance tool developed by Israeli company NSO Group.\nThe findings emerged in June 2020, when Amnesty International Security Lab examined his phone. Radi, now based in Germany, said he had spent two years, from 2018 to 2020, noticing signs including his phone’s battery draining quickly, its temperature rising and the network slowing down.\nThe physical surveillance, he said, was barely discreet.\n“They came every day to get a daily report from the parking attendants in my street, the shops I used to go to, and my friends,” he said. “I would sometimes turn around and walk towards the people following me to take photographs, but they ran quickly and hid their faces.”\nHis case is among four detailed in a new Amnesty International report, We Start With the Verdict: Inside Morocco’s Surveillance Machine, produced with 14 media organisations and coordinated by the international network of journalists Forbidden Stories.\nThe other three are Fouad Abdelmoumni, a veteran activist; Abdessadak El Bouchattaoui, a human rights lawyer; and Hicham Mansouri, a journalist in exile who had been imprisoned in 2015 on charges of adultery and sexual exploitation, which Amnesty describes as trumped-up.\nThe report draws on interviews with a whistleblower using the pseudonym Safir, a former employee of Morocco’s General Directorate for Territorial Surveillance (DGST). Amnesty said it corroborated key parts of Safir’s testimony with independent sources, technical evidence and interviews with 10 people identified as surveillance targets, including Radi.\n“The Amnesty report connected many dots as to what I was living and feeling while I was under tight surveillance,” Radi said.\n“It explains the extraordinary aspect of my police interrogations and my trial, where many of my rights weren’t respected, because even the judicial police and the judges were under monitoring,” he added.\nAmnesty identifies the DGST as the agency behind the deployment of Pegasus spyware in Morocco and documents what it describes as abuses of the spyware against activists and journalists between 2017 and 2021.\nMorocco denies surveillance\nMorocco has previously rejected Amnesty’s allegations that its authorities used Pegasus to target journalists, activists and other critics.\nIn statements issued in 2020 and 2022, Moroccan authorities challenged Amnesty to provide material evidence supporting its claims.\nAmnesty said it wrote to Moroccan authorities four weeks before publishing its latest report and invited them to respond, but received no response.\nAl Jazeera also sought comment from Moroccan officials but had not received a response at the time of publication.\nMoroccan media have also challenged the latest report. Le360 cited arguments that the presence of a phone number in Pegasus targeting records does not, by itself, prove that a device was infected or establish who ordered an alleged attack.\nThe outlet also argued that Amnesty had not provided the conclusive technical and material evidence Moroccan authorities had demanded.\nThe report says Morocco’s Pegasus operations were fully active by October 2017, pointing to the case of human rights lawyer El Bouchattaoui, whose number was entered into the system in September 2017 and selected for targeting weeks before he received an infection link by text message.\nAmnesty said its analysis of Pegasus records matched 103 Moroccan phone numbers to individuals identified as potential targets between September and December 2017. Of those, 65 were identifiable as civil society members, including 34 human rights defenders, 22 journalists and media workers, five lawyers and four academics.\nAccording to Amnesty, Safir described a surveillance apparatus that combined digital and physical methods. Targeted individuals were secretly filmed and recorded in detention, offices, cars, cafes and even bedrooms, he said.\nPhone shops, he added, were coopted to sell targets devices infected with spyware. Neighbours of human rights defenders, he said, were recruited as informants to file daily reports on their movements.\nSafir also described the use of remote control systems (RCS) at internet cafes. Field agents would identify which cafe a target was visiting, he said, giving the DGST access to activity on machines it had already infected and allowing an operator to track calls, read messages, access photographs and record audio.\nThe report says similar tactics were used against activist Abdelmoumni, who was secretly filmed at home with his fiancee in 2021. Abdelmoumni said he believed the footage was capture", "translation_ja": "", "vocab": [{"word": "dispossession", "definition": "不当に財産や土地を奪い取ること。政治的または社会的文脈で、個人や集団から権利や資産が違法に奪われる状況を指します。"}, {"word": "corroborated", "definition": "証拠や証言によって、ある主張や説明が正しいことを確認すること。調査やジャーナリズムで、情報の信頼性を検証する際に使用されます。"}, {"word": "spyware", "definition": "個人のデバイスに無断でインストールされ、ユーザーの行動や通信を秘密裏に監視するソフトウェア。プライバシー侵害とセキュリティの脅威となります。"}, {"word": "pseudonym", "definition": "本当の名前の代わりに使用される仮名または別名。プライバシー保護や身の安全を守るために、ジャーナリズムや執筆で頻繁に使われます。"}, {"word": "trumped-up", "definition": "根拠のない、あるいは意図的に作られた虚偽の告発や容疑。権力者が政治的反対者を抑圧するために用いられることがあります。"}]}, {"title_ja": "Police clash with Kosovo protesters over bid to curb Hague war crimes court", "title_en": "Police clash with Kosovo protesters over bid to curb Hague war crimes court", "summary_ja": "The political dispute over the court has become a factor in negotiations to hold a new presidential election.", "summary_en": "The political dispute over the court has become a factor in negotiations to hold a new presidential election.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/6/police-clash-with-kosovo-protesters-over-bid-to-curb-hague-war-crimes-court?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Police clash with Kosovo protesters over bid to curb Hague war crimes court\nThe political dispute over the court has become a factor in negotiations to hold a new presidential election.\nPolice have clashed with protesters outside Kosovo’s Parliament over plans to limit the powers of a Hague-based war crimes court.\nThe violence broke out on Monday evening after Parliament ended its session without passing the proposed changes, which concerned the Kosovo Specialist Chambers, a court dedicated to crimes committed during the Kosovo War from 1998 to 2000.\nFounded in 2015, the court is an independent part of Kosovo’s judicial system, based in The Hague and staffed internationally.\nCritics, however, have accused the court’s verdicts of being overly punitive. The amendments before Parliament would limit sentences to 15 years, allow sentences to be served in Kosovo and permit appeals to the self-declared republic’s Supreme Court.\nThe changes passed a first reading earlier on Monday, but Parliament adjourned before a second vote could be held.\nSeveral hundred protesters had gathered outside the Parliament building in Pristina, including supporters and veterans of the Kosovo Liberation Army (KLA), the ethnic Albanian rebel force that fought Serbian troops in the war.\nSome tried to block lawmakers from leaving after the session ended. Police used tear gas and water cannons in an attempt to disperse the protesters, some of whom threw flares and firecrackers.\nNaser Syla, the emergency director at a hospital in Pristina, told The Associated Press news agency that 12 people were injured, including 11 civilians.\nThe legislation follows the September 16 convictions of former President Hashim Thaci and three other former KLA commanders for war crimes.\nThaci was sentenced to 25 years in prison. His co-defendants received prison terms ranging from 13 to 25 years. They have all denied the charges.\nThe rulings prompted weeks of protests and were unanimously condemned by Kosovo’s Parliament in late September.\nThe question of reforming the court has also become tied to the political battle over Kosovo’s presidency.\nKosovo’s Constitutional Court has ruled that the self-declared republic has until October 6 to elect a president. If lawmakers fail to do so, Parliament will be dissolved, and Kosovo will face another early election.\nThe Democratic Party of Kosovo (PDK), the largest opposition party and sponsor of the bill, has hinged its support for electing a president to the successful passage of the changes.\nPrime Minister Albin Kurti’s governing Vetevendosje party, or the Self-Determination Movement, wants the presidential vote to take place first.\nKurti backed allowing the bill to proceed but told Parliament on Monday that the changes had been rushed.\nHe has also said the appeals process should be used to challenge the controversial September convictions.\nKosovo created the Specialist Chambers under pressure from Western allies to prosecute alleged crimes by KLA members.\nIt was based outside Kosovo partly due to concerns about political pressure and threats to witnesses.\nThe court remains deeply contentious in Kosovo, where many people regard the KLA as the force that fought Serbian repression and led the self-declared republic towards declaring independence.\nThe 1998-99 war killed about 13,000 people, most of them ethnic Albanians, and forced about one million Kosovo Albanians from their homes.\nThe conflict ended after a 78-day NATO bombing campaign against Serbian forces. Kosovo declared independence from Serbia in 2008, but Belgrade does not recognise its sovereignty.", "translation_ja": "", "vocab": [{"word": "curb", "definition": "〜を制限する、抑制する。政策や権力などの成長や活動を制御する意味で使用される。"}, {"word": "adjourned", "definition": "会議や裁判を一時延期する、散会する。法律や議会の文脈で、後日の再開を予定して休止することを意味する。"}, {"word": "verdicts", "definition": "裁判所の判決、判定。法的な有罪・無罪決定を指す正式な用語。"}, {"word": "punitive", "definition": "懲罰的な、罰を与える性質の。刑罰や制裁が過度に厳しいことを表現する際に用いられる。"}, {"word": "dissolved", "definition": "〜を解散させる、廃止する。組織や政治的な機構が正式に終了することを意味する。"}]}, {"title_ja": "Trump says his super PAC will pay for taxpayer-funded ads that sparked backlash for glorifying him", "title_en": "Trump says his super PAC will pay for taxpayer-funded ads that sparked backlash for glorifying him", "summary_ja": "Donald Trump provided no details on reimbursing taxpayers for ads that had already aired, nor on how he would go about having his political organisation pay for such future advertising", "summary_en": "Donald Trump provided no details on reimbursing taxpayers for ads that had already aired, nor on how he would go about having his political organisation pay for such future advertising", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-says-his-super-pac-will-pay-for-taxpayer-funded-ads-that-sparked-backlash-for-glorifying-him/article71549746.ece", "state_media": false, "category": "政治", "full_text": "President Donald Trump said Monday (October 5, 2026) that he will stop using taxpayer funds for television advertisements glorifying himself that sparked a major backlash, and instead tap his super PAC to cover costs going forward.\nIn a post on his social media site, Mr. Trump defended the ads, which cost at least $1.5 million in federal funds and have drawn intense criticism. Mr. Trump said they were “positive promotion for our Great USA.”\n“This is a rather standard thing to do,” the president wrote, while blaming intense criticism for using taxpayer funds on the ads on the “Radical Left.” But the president added that he'd “decided to do the Patriotic Ads, among others, and pay for them myself, and with money I raised for MAGA, Inc.\"\nThat is Mr. Trump's political war chest, which had amassed more than $400 million by the end of July. Mr. Trump has begun to tap it to boost Republican candidates around the country ahead of midterm elections.\nMr. Trump provided no details on reimbursing taxpayers for ads that had already aired, nor on how he would go about having his political organisation pay for such future advertising.\nThe White House — which had fiercely defended using taxpayer money on spots meant to promote the President — said Monday (October 5, 2026) night that MAGA Inc. will pay for such ads going forward. It did not answer questions about how it or Mr. Trump might
