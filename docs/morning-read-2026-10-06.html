 prove that his political funds were being used on such future advertising.\nMr. Trump's abrupt about-face came after leaders from both parties criticised using taxpayer funds for the ads.\nLegal experts said the ads might even violate federal statutes, including a law against congressionally appropriated funds being used for “publicity or propaganda” and one limiting the partisan political activities of government employees.\nThe spots began airing in late September\nThe first ad featured clips of Mr. Trump talking about defeating communism interspersed with onscreen text promoting the “largest tax cuts in history,” “reigniting American manufacturing” and a call to “defend law and order and police.”\nLater the same week, a second ad began running. It showed scenic videos of Mount Rushmore with quotes and clips from Mr. Trump's Fourth of July weekend speech there honoring the country's 250th anniversary.\nA third, more recent one was virtually identical to an ad for Mr. Trump's Republican reelection campaign in 2024 and showed him walking down a hallway as his voice can be heard warning of a “final battle” against “globalists” and “warmongers.”\nAll ended with a message: “Paid for by the U.S. Government.”\nAccording to AdImpact, which tracks media spending, the spots had cost at least $1.4 million by the end of September. The actual amount spent could be far more, depending on whether networks classified the ad as a political ad.\nPublished - October 06, 2026 06:42 am IST", "translation_ja": "", "vocab": [{"word": "backlash", "definition": "批判や反発。否定的な反応や反対運動を意味する。政策や行動に対する強い抗議を指す。"}, {"word": "amassed", "definition": "大量に集める、蓄積する。時間をかけて徐々に集めることを示す。"}, {"word": "reimbursing", "definition": "返金する、補償する。すでに支払われた費用を返すことを意味する。"}, {"word": "statutes", "definition": "法令、成文法。国会や議会が制定した正式な法律を指す。"}, {"word": "interspersed", "definition": "散在させる、ところどころに挿入する。異なる要素を混ぜながら配置することを示す。"}]}, {"title_ja": "Saudi-backed Yemeni forces expel the Houthis from several areas around key strait, officials say", "title_en": "Saudi-backed Yemeni forces expel the Houthis from several areas around key strait, officials say", "summary_ja": "The officials said forces allied with the internationally recognised government have retaken the crucial town of Dhubab just north of the strait", "summary_en": "The officials said forces allied with the internationally recognised government have retaken the crucial town of Dhubab just north of the strait", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/saudi-backed-yemeni-forces-expel-the-houthis-from-several-areas-around-key-strait-officials-say/article71549737.ece", "state_media": false, "category": "政治", "full_text": "Forces of the Saudi-led coalition fighting in Yemen have recaptured several key areas around Bab el-Mandeb Strait from Iran-backed Houthi rebels, Yemeni officials said Monday.\nThe officials said forces allied with the internationally recognised government have retaken the crucial town of Dhubab just north of the strait. They also captured the towns of Bab and Hadeid, said the officials, who spoke on condition of anonymity because they were not authorized to speak to reporters. Witnesses said they saw government tanks and forces entering the towns.\nThe government push came as part of a major offensive launched early Monday (October 5, 2026) under air cover by a Saudi military coalition.\nU.S. Secretary of State Marco Rubio told reporters that it was expected that the Saudi-backed government in Yemen would hit back at the rebels to reclaim territory. Asked if the Saudi-led coalition coordinated the action with the United States, Rubio said that Saudi Arabia and the US have a defence agreement but wouldn't offer more details.\nThe Yemeni government was ousted from some of its territory by a Houthi campaign and the Saudis have come under attack, and “they have a right to defend themselves,” Mr. Rubio said.\nThe U.S. has provided support to Saudi Arabia in its ongoing campaign against the Houthis, according to a regional official and a U.S. official who spoke on condition of anonymity because they weren't authorised to speak to reporters. U.S. support included intelligence sharing, target identification and planning for the offensive, said the officials.\nThe U.S. had supported the Saudi-led coalition fighting the Houthis early in the Yemen war, before quitting the coalition in recent years.\nThe U.S. Embassy in the Saudi capital of Riyahd warned U.S. citizens on social media to be vigilant about possible drone or missile attacks.\nThe offensive came just after the rebels said they had captured more territory in the southwestern part of Yemen, taking a key town in a blow to the Saudi-backed forces as they advanced toward a strategic provincial capital in the region.\nThe Saudi-led coalition spokesman, Maj. Gen. Turki al-Malki, said 100 fighter jets were providing support to the forces of Yemen's internationally recognized government fighting against the Houthis. He said the coalition has secured “air protection” of the strategic Bab el-Mandeb Strait and destroyed hundreds of Houthi targets as part of the ongoing campaign.\nPublished - October 06, 2026 05:40 am IST", "translation_ja": "", "vocab": [{"word": "coalition", "definition": "複数の国や勢力が共通の目的のために一時的に結成する連合体。この記事ではサウジアラビア主導の軍事同盟を指しており、政治的・軍事的な協力関係を示す。"}, {"word": "offensive", "definition": "軍事用語で、敵に対して積極的に攻撃を仕掛ける作戦や行動。防守ではなく攻撃的な軍事行動全般を指す。"}, {"word": "vigilant", "definition": "潜在的な危険に対して注意深く、警戒心を持った状態。継続的な注意と観察を伴う積極的な警戒姿勢を表す。"}, {"word": "strategic", "definition": "長期的な目標達成のための重要な位置づけや計画。軍事や経営などの文脈で、全体の成功に大きく影響する重要性を持つことを意味する。"}, {"word": "authorised", "definition": "公式な権限を与えられている、許可されている状態。組織や政府から正式な許可や権限を得ていることを示す。"}]}, {"title_ja": "Pakistan, Saudi Arabia, Turkiye agree on rapid deployment of forces in the Kingdom", "title_en": "Pakistan, Saudi Arabia, Turkiye agree on rapid deployment of forces in the Kingdom", "summary_ja": "The ‌decision ⁠was taken at an ⁠emergency meeting of the Mecca Defence Alliance in Riyadh and would be carried out under “approved ​arrangements” and ‌the national laws of the three countries, the statement said", "summary_en": "The ‌decision ⁠was taken at an ⁠emergency meeting of the Mecca Defence Alliance in Riyadh and would be carried out under “approved ​arrangements” and ‌the national laws of the three countries, the statement said", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/pakistan-saudi-arabia-turkiye-agree-on-rapid-deployment-of-forces-in-the-kingdom/article71549736.ece", "state_media": false, "category": "社会", "full_text": "Pakistan, Saudi Arabia and Turkey agreed on Monday (October 5, 2026) to move immediately to implement their collective defence commitments and ensure the “rapid deployment” of agreed military forces and capabilities in Saudi Arabia, the three countries said in a joint statement shared by Pakistan’s foreign ministry.\nThe decision was taken at an emergency meeting of the Mecca Defence Alliance in Riyadh and would be carried out under “approved arrangements” and the national laws of the three countries, the statement said.\nThe meeting “reaffirmed the solidarity and unity of our countries in confronting the heinous attacks against the Kingdom and the holy sites,” the Saudi Defence Minister said on X.\nThe Saudi-led coalition fighting Yemen’s Houthis said on Thursday (October 1, 2026) that the Iran-aligned group had attacked a power distribution station in the Saudi city of Medina which supplies electricity to the Prophet’s Mosque, one of Islam’s holiest sites.\nThe three countries signed the Mecca Joint Defence Agreement in August, under which an armed attack on one member is considered an attack on all.\nThe agreement announced at the time gave no specifics on the military commitments or defence obligations of each country.\nPublished - October 06, 2026 05:36 am IST", "translation_ja": "", "vocab": [{"word": "collective defence commitments", "definition": "複数国が一体となって防衛義務を果たすこと。1つの国への攻撃は全ての加盟国への攻撃と見なされる相互防衛協定のこと。"}, {"word": "rapid deployment", "definition": "素早く軍事力や資源を展開・配置すること。緊急時に迅速に対応する軍事戦略のこと。"}, {"word": "reaffirmed", "definition": "以前の宣言や約束をもう一度確認・強調すること。過去の立場や決定を改めて表明する。"}, {"word": "Iran-aligned group", "definition": "イランと結びついたり、イランの影響下にある組織や勢力のこと。政治的・軍事的にイランを支持する立場を持つ。"}, {"word": "heinous attacks", "description": "極めて悪質で重大な攻撃のこと。道徳的に許されない、非常に悪質な犯罪行為を指す。"}]}, {"title_ja": "PM Mark Carney pledged to ‘Buy Canadian.’ Since then, $7.8 billion in contracts went to American corporations - Toronto Star", "title_en": "PM Mark Carney pledged to ‘Buy Canadian.’ Since then, $7.8 billion in contracts went to American corporations - Toronto Star", "summary_ja": "PM Mark Carney pledged to ‘Buy Canadian.’ Since then, $7.8 billion in contracts went to American corporations Toronto Star", "summary_en": "PM Mark Carney pledged to ‘Buy Canadian.’ Since then, $7.8 billion in contracts went to American corporations Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimgJBVV95cUxQU1piNW5DT1JIOW1ZZ3dIRmRRODFwOTR5YVJLQmNlSkVfeHdQWmd1Mzk3Zi04RFJYNkVydDdLMVJxYlc0dHVWcXZFeXBQN0xSSkRQVDRpQ3RiVlVkaGNDRWlnZ1hsSHdpQUY1YXI1NmpRMVoxUXdvRnZvNkRkRUEtc3o3OGl4dnZpNVVXREo3ZS1TUlFHYlhpRXN5cVp2SENGdVlpcmtYWTlpcUstaHVmc3NUZmpFRnVOZUExZ2puQzVNbXNQay1jN1lCLUxySzhmbExhYmlHNndzVERKckx1Z0ZhNFc1Y2MxQnJ4dzFOVjQxWGFZMFpzUUwxejhJcDlXME1BVDZQMTVCTXBOb2U4STRScGxVd1RDZ0E?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "The beat goes on for Canada in win over Peru, even if the song stutters - Toronto Star", "title_en": "The beat goes on for Canada in win over Peru, even if the song stutters - Toronto Star", "summary_ja": "The beat goes on for Canada in win over Peru, even if the song stutters Toronto Star", "summary_en": "The beat goes on for Canada in win over Peru, even if the song stutters Toronto Star", "source": " astructure.html", "state_media": false, "category": "政治", "full_text": "The Ogun State Government has announced the employment of over 7,000 teachers since the inception of the Prince Dapo Abiodun administration, as part of its sustained investment in strengthening teaching and learning across the state.\nThe government has also earmarked ₦24 billion through the State Universal Basic Education Board (SUBEB) for the provision and rehabilitation of critical education infrastructure, while over ₦51 million was presented in cash prizes to outstanding teachers, schools and administrators at the 2026 World Teachers’ Day celebration in Abeokuta.\nSpeaking at the celebration, held at the Cultural Centre, Kuto, Abeokuta, Governor Abiodun, represented by the Secretary to the State Government, Mr Tokunbo Talabi, said his administration recognised teachers as the foundation upon which every other profession and society was built.\n“Before a doctor learns to treat patients or an engineer designs a bridge, a teacher has awakened their minds and laid the foundation they are building upon,” the Governor said.\nAbiodun added that behind the achievements celebrated by society were teachers whose names might never make the headlines, but whose influence remained written in the lives they had touched.\nHe said his administration would continue to invest in teachers, schools and the future of every child in Ogun State, noting that the Ogun State Education Revitalisation Agenda (OGSERA) would continue to drive improvements in curriculum delivery, school management, technology, infrastructure, funding, and the welfare of teachers and learners.\nThe governor disclosed that the OgunTEACh programme has become a model being emulated beyond Ogun State, following the recruitment of thousands of teachers through the initiative.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe further announced the absorption of over 1,500 OgunTEACh interns into the mainstream civil service, with the beneficiaries receiving their letters of appointment at the ceremony.\nAbiodun commended teachers and education administrators in Ogun State for distinguishing themselves nationally and internationally, noting that some of the state’s teachers and education administrators were in Abuja receiving national recognition as Best Teacher, Best Administrator and Best School.\nHe said the recognition further demonstrated the quality and commitment of teachers in the state and reaffirmed his administration’s determination to create an environment in which educators could thrive.\nThe Governor also presented cash awards to outstanding teachers, administrators and schools in both public and private school categories.\nThe first-prize winners in the Best Teacher categories received ₦2.5 million each, while the second- and third-place winners received ₦1.5 million and ₦1 million respectively.\nIn the public primary school category, Mr Rasaq Babatunde emerged first, Mrs Ayedun Oluwakemi second, and Mrs Ajayi Fatimo Bisola third.\nIn the junior public school category, Mr Soleye Olugbemi, Mrs Akande Abosede and Mrs Kuye Funmilayo emerged first, second and third respectively, while Mr Adebayo Oluwaseun, Mrs Akomolafe Beatrice and Àjọṣe Aderibigbe took the first, second and third positions respectively in the senior public school category.\nIn the private teachers’ category, Mrs Akanni Àyọkà of Breakthrough Academy, Akute, and Mr Kehinde Olusegun of Anglican High School, Quarry, emerged first and second respectively.\nFor the Best Administrators’ public category, Mr Sodipo Raymond of Muslim Primary School, Ago-Oko, Abeokuta, won first prize; Mrs Bankole Oluranti of African Church Primary School 1, Ayetoro, came second; while Mrs Olakitan Silifat of Abeokuta South Local Government Nursery/Primary School, Ijemo, Abeokuta, emerged third.\nCommunity Nursery and Primary School, Mike II, and Christ Apostolic Grammar School, Iperu, received ₦10 million each as Best School in the primary and junior secondary school categories respectively, among other award recipients.\nThe event also featured the presentation of the Award of Distinguished Leadership in Technology-Driven Education and Innovation to Governor Abiodun in recognition of his administration’s efforts in advancing technology-driven education in the state.\nSpeaking on the theme of the celebration, “Standing with Teachers: 60 Years of Protecting the Profession, Advancing its Status and Shaping Our Future,” the Ogun State Chairman of the Nigeria Union of Teachers (NUT), Sewakanu Noah Oladipupo, described the theme as a policy-oriented call for improved recognition, status and welfare for teachers.\nOladipupo commended the Abiodun administration for recruiting over 6,000 teachers through the OgunTEACh platform, noting that there had been no recruitment of teachers for eight years before the administration came into office.\nHe also commended the government for approving and implementing teachers’ pro", "translation_ja": "", "vocab": [{"word": "inception", "definition": "開始、始まり。ビジネスや組織などが始まった時点を指す。「この行政の開始以来」という文脈で使用されている。"}, {"word": "earmarked", "definition": "特定の目的のために予算や資金を確保・割り当てる。「24億ナイラを教育基盤整備のために割り当てた」という意味。"}, {"word": "rehabilitation", "definition": "復興、修復、改善。施設やインフラなどを修理・改善して機能を回復させることを指す。"}, {"word": "revitalisation", "definition": "復活、活性化、再生。システムやプログラムなどを改善して活気を取り戻すこと。ここでは教育システムの改善を指している。"}, {"word": "absorption", "definition": "吸収、組織への統合。インターンシップ生を正規職員に組み込むことを指す。"}]}, {"title_ja": "Military Aircraft Crash: Ondo governor orders emergency, logistics support", "title_en": "Military Aircraft Crash: Ondo governor orders emergency, logistics support", "summary_ja": "\"To aid ongoing efforts, Governor Aiyedatiwa has directed the State Emergency Management Agency (SEMA), the Ministry of Health, and relevant security agencies to immediately mobilise and offer full logistical and human support to the Nigerian Air Force and other emergency response agencies in the se", "summary_en": "\"To aid ongoing efforts, Governor Aiyedatiwa has directed the State Emergency Management Agency (SEMA), the Ministry of Health, and relevant security agencies to immediately mobilise and offer full logistical and human support to the Nigerian Air Force and other emergency response agencies in the se", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/914786-military-aircraft-crash-ondo-governor-orders-emergency-logistics-support.html", "state_media": false, "category": "政治", "full_text": "Following the crash of an ATR-42 aircraft in Igbokoda, Ondo State, on Monday, the state governor, Lucky Aiyedatiwa, has directed the deployment of logistics and emergency support from the Ministry of Health and Emergency Agency to the scene.\nHe said the deployment was to support the ongoing search-and-rescue exercise.\nThis was contained in a statement by the Chief Press Secretary to Ebenezer Adeniyan.\nThe aircraft was flying from Benin to Lagos on a routine mission and crashed in the early hours of Monday, killing seven crew members and 25 passengers on board.\nThe crash occurred in a swampy area of Igbokoda, the headquarters of Ilaje LGA of Ondo State.\nAccording to preliminary reports confirmed by the Nigerian Air Force Director of Public Relations and Information, Ehimen Ejodame, an air commodore, the aircraft, an ATR-42 with tail number NGR 931, was on a routine mission from Benin to Lagos when it crashed in a swampy area opposite the Naval Base in Igbokoda.\nThe Minister of Aviation and Aerospace Development, Festus Keyamo, also confirmed that 25 passengers and seven crew members were on board.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMr Adeniyan said Governor Aiyedatiwa received the news of the crash with deep sadness.\nHe said he has been in contact with the leadership of the Nigerian Air Force, the Ilaje Local Government Chairman, Maurice Oripelaye, and security agencies on the ground.\n“To aid ongoing efforts, Governor Aiyedatiwa has directed the State Emergency Management Agency (SEMA), the Ministry of Health, and relevant security agencies to immediately mobilise and offer full logistical and human support to the Nigerian Air Force and other emergency response agencies in the search and rescue operations currently ongoing at the crash site,” the statement said.\n“The Governor has also directed that the area be cordoned off and secured to allow for smooth and unhindered rescue operations, while urging residents of Igbokoda and adjoining communities to remain calm, cooperate with emergency responders, and refrain from spreading unverified information.”\nREAD ALSO: What we know about Nigerian military aircraft that fatally crashed Monday\nHe said the state government will continue to monitor the situation and provide updates as more information becomes available from the Nigerian Air Force.\n“On behalf of the Government and good people of Ondo State, Governor Aiyedatiwa expresses his heartfelt sympathy to the Chief of Air Staff, the entire Nigerian Air Force family, and the families of all personnel and passengers on board the ill-fated aircraft. Our thoughts and prayers are with them at this difficult time,” he said.\n“We pray for the safety of our gallant officers and for the success of the rescue efforts.”\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "deployment", "definition": "人員や物資、装備を特定の場所や任務に配置すること。軍事や緊急対応などの文脈で頻繁に使われ、戦略的な配置を意味します。"}, {"word": "preliminary", "definition": "最終的ではなく、初期段階の、暫定的な。調査や報告書などの前段階の結果や情報を指します。"}, {"word": "mobilise", "definition": "人員、資源、組織などを素早く集め、特定の目的のために活動できる状態にすること。"}, {"word": "cordoned", "definition": "ロープや柵などで区域を囲んで隔離すること。通常、安全上の理由から特定エリアへのアクセスを制限する際に使用されます。"}, {"word": "unhindered", "definition": "妨害されない、邪魔されない状態。自由に進行できることを表し、スムーズな業務遂行を意図する際によく用いられます。"}]}, {"title_ja": "Military Aircraft Crash: Tinubu declares three-day mourning, says victims to be named", "title_en": "Military Aircraft Crash: Tinubu declares three-day mourning, says victims to be named", "summary_ja": "He also directed that flags should be flown at half-mast throughout the country as a mark of respect to the officers. The post Military Aircraft Crash: Tinubu declares three-day mourning, says victims to be named appeared first on Premium Times Nigeria .", "summary_en": "He also directed that flags should be flown at half-mast throughout the country as a mark of respect to the officers. The post Military Aircraft Crash: Tinubu declares three-day mourning, says victims to be named appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/914783-military-aircraft-crash-tinubu-declares-three-day-mourning-says-victims-to-be-named.html", "state_media": false, "category": "政治", "full_text": "President Bola Tinubu has declared a three-day national mourning for Air Force personnel who died in the crash of a military plane today.\nHe also directed that flags should be flown at half-mast throughout the country as a mark of respect to the officers.\nPresident Tinubu had earlier expressed profound sadness over the crash of the Nigerian Air Force ATR-42 jet.\nThe accident occurred near a naval base in the Igbokoda area of Ondo State. The aircraft, carrying 25 passengers and seven crew members, was on a routine mission from Benin to Lagos when it crashed.\n“This is a painful moment for our Armed Forces and for the entire nation. Our Air Force personnel put their lives on the line every day to secure Nigeria. Their sacrifice will never be forgotten,” President Tinubu declared in a condolence message to the Chief of Air Staff, Air Marshal Sunday Aneke, an tition at the Asian Games", "title_en": "How Chinese technology supports esports competition at the Asian Games", "summary_ja": "How Chinese technology supports esports competition at the Asian Games", "summary_en": "How Chinese technology supports esports competition at the Asian Games", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-02/How-Chinese-technology-supports-esports-competition-at-the-Asian-Games-1QUjFV0bj5S/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Moscow mayor reports destruction of 18 UAVs near capital", "title_en": "Moscow mayor reports destruction of 18 UAVs near capital", "summary_ja": "Emergency responders are working at the sites where debris fell, Sergey Sobyanin reported", "summary_en": "Emergency responders are working at the sites where debris fell, Sergey Sobyanin reported", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2197889", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "New York Times to close soon, great day for America — Trump", "title_en": "New York Times to close soon, great day for America — Trump", "summary_ja": "The US president criticized the newspaper for publishing what he called a photo \"doctored by The Times\" of Trump National Doral, his resort and hotel complex near Miami, Florida, which will host the G20 summit", "summary_en": "The US president criticized the newspaper for publishing what he called a photo \"doctored by The Times\" of Trump National Doral, his resort and hotel complex near Miami, Florida, which will host the G20 summit", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2197887", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "WHO calls public health risk low after Irkutsk pneumonia case", "title_en": "WHO calls public health risk low after Irkutsk pneumonia case", "summary_ja": "Spokesman Christian Lindmeier said that all of the patient’s contacts \"have reportedly been identified and are being monitored for illness\"", "summary_en": "Spokesman Christian Lindmeier said that all of the patient’s contacts \"have reportedly been identified and are being monitored for illness\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/society/2197885", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Iran’s Moment of Opportunity", "title_en": "Iran’s Moment of Opportunity", "summary_ja": "America and Israel's unilateral aggression against Iran lacked international legitimacy and predictably destabilized the entire region. But as justified as the Iranian leadership might feel in pursuing an obstinately maximalist strategy, it must be careful not to mistake short-term advantages for lo", "summary_en": "America and Israel's unilateral aggression against Iran lacked international legitimacy and predictably destabilized the entire region. But as justified as the Iranian leadership might feel in pursuing an obstinately maximalist strategy, it must be careful not to mistake short-term advantages for lo", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/iran-opportunity-to-secure-relief-normalization-and-new-regional-balance-by-abdullah-gul-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Iran’s Moment of Opportunity\nAmerica and Israel's unilateral aggression against Iran lacked international legitimacy and predictably destabilized the entire region. But as justified as the Iranian leadership might feel in pursuing an obstinately maximalist strategy, it must be careful not to mistake short-term advantages for longer-term gains.\nISTANBUL—On February 28, the United States and Israel shocked the world by launching strikes across Iran and assassinating the country’s supreme leader, Ayatollah Ali Khamenei. Civilian casualties quickly mounted, including 150 civilians—mostly children—killed when American missiles struck an elementary school. Iran duly retaliated by targeting Israel and US bases across the region and throttling maritime transit through the Strait of Hormuz.", "translation_ja": "", "vocab": [{"word": "unilateral", "definition": "一方的な、片側からの行動を意味する。国際関係において、一国が他国の同意なく単独で行動することを指す。"}, {"word": "legitimacy", "definition": "正当性、合法性を意味する。政府や行動が法的・道徳的に認められているかどうかの状態を表す。"}, {"word": "destabilized", "definition": "不安定にする、不安定化させることを意味する。政治的・経済的に安定した状態を崩すことを指す。"}, {"word": "obstinately", "definition": "頑固に、意固地に行動することを意味する。ある方針や態度を強硬に貫き続けることを表す。"}, {"word": "throttling", "definition": "絞る、制限する、流量を減らすことを意味する。通常、通行・流通・輸送などの制限を指す。"}]}, {"title_ja": "Is Russia’s Placement on the Security Council Legal?", "title_en": "Is Russia’s Placement on the Security Council Legal?", "summary_ja": "When Russia replaced the Soviet Union as a permanent member of the United Nations Security Council in 1991, it did not even attempt to follow the process outlined in the UN Charter. Now that Russia's usurpation of the USSR’s seat has enabled it to wage a war of aggression, the dubious legal status o", "summary_en": "When Russia replaced the Soviet Union as a permanent member of the United Nations Security Council in 1991, it did not even attempt to follow the process outlined in the UN Charter. Now that Russia's usurpation of the USSR’s seat has enabled it to wage a war of aggression, the dubious legal status o", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/russia-usurped-soviet-security-council-seat-status-today-is-a-legal-fiction-by-denys-shtilierman-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Is Russia’s Placement on the Security Council Legal?\nWhen Russia replaced the Soviet Union as a permanent member of the United Nations Security Council in 1991, it did not even attempt to follow the process outlined in the UN Charter. Now that Russia's usurpation of the USSR’s seat has enabled it to wage a war of aggression, the dubious legal status of its position must be revisited.\nKYIV—“We the peoples of the United Nations determined to save succeeding generations from the scourge of war.” So begins the UN Charter. Yet Russia’s war of aggression against Ukraine is well into its fourth year, confirming just how far the UN has strayed from its foundational promise.", "translation_ja": "", "vocab": [{"word": "usurpation", "definition": "不正な方法による権力や地位の奪取のこと。法的な正当性がないまま他者の権利を奪い取る行為を指します。"}, {"word": "dubious", "definition": "疑わしい、信頼できないという意味。法的または道徳的な妥当性が不確かな状況を表します。"}, {"word": "scourge", "definition": "大きな害悪や災厄のこと。戦争や疫病など人類に深刻な被害をもたらす存在を指します。"}, {"word": "strayed", "definition": "本来の目的や方針から外れる、逸脱するという意味。正しい道を離れて異なる方向に向かうことを表します。"}]}, {"title_ja": "To Support Nepal, Waive Remittance Fees", "title_en": "To Support Nepal, Waive Remittance Fees", "summary_ja": "To help Nepal move from rescue and relief toward reconstruction, money-transfer companies and banks ought to waive fees on remittances sent to the country for at least two months. Doing so could provide additional relief totaling several times more than what a recent emergency appeal by the United N", "summary_en": "To help Nepal move from rescue and relief toward reconstruction, money-transfer companies and banks ought to waive fees on remittances sent to the country for at least two months. Doing so could provide additional relief totaling several times more than what a recent emergency appeal by the United N", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/nepal-remittance-fee-waiver-for-flood-relief-recovery-by-ngozi-okonjo-iweala-and-dilip-ratha-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "To Support Nepal, Waive Remittance Fees\nand\nTo help Nepal move from rescue and relief toward reconstruction, money-transfer companies and banks ought to waive fees on remittances sent to the country for at least two months. Doing so could provide additional relief totaling several times more than what a recent emergency appeal by the United Nations generated.\nGENEVA—The flash floods that struck Nepal on August 26 claimed more than a thousand lives and destroyed livelihoods, homes, farms, and public infrastructure. With reconstruction and the economic recovery now underway, support for the survivors can travel fastest through payment networks and family ties—as is usually the case when disasters strike developing countries.", "translation_ja": "", "vocab": [{"word": "remittance", "definition": "海外から母国に送金されるお金のこと。特に出稼ぎ労働者が故郷に送る送金を指し、発展途上国の経済で重要な役割を果たしている。"}, {"word": "waive", "definition": "権利や要件などを意図的に放棄する、または免除することを意味する。ビジネス文脈では手数料や条件を取り除く場合に使用される。"}, {"word": "reconstruction", "definition": "災害や戦争などで破壊された地域や施設を再び建設・復興すること。経済的・物理的な回復プロセスを指す。"}, {"word": "infrastructure", "definition": "道路、橋、電力網などの基盤となる施設や社会資本のこと。国家や地域の基本的な機能を支える物理的システムを意味する。"}, {"word": "livelihood", "definition": "生計を立てる手段や生活の糧のこと。個人や家族が生存を維持するための収入源や生活基盤全般を指す。"}]}, {"title_ja": "Hegseth is obsessed with increasing testosterone. If anything, the US could use less | Dave Schilling", "title_en": "Hegseth is obsessed with increasing testosterone. If anything, the US could use less | Dave Schilling", "summary_ja": "Maybe the key to life is being able to bench press 300lb at 75. But do we need more muscle-bound, angry guys around? I loathe going to the doctor. Not a controversial opinion, compared with some of the other ones in this section of the Guardian. I’m not exactly arguing for universal basic income or ", "summary_en": "Maybe the key to life is being able to bench press 300lb at 75. But do we need more muscle-bound, angry guys around? I loathe going to the doctor. Not a controversial opinion, compared with some of the other ones in this section of the Guardian. I’m not exactly arguing for universal basic income or ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/04/hegseth-testosterone-replacement-therapy", "state_media": false, "category": "オピニオン", "full_text": "I loathe going to the doctor.\nNot a controversial opinion, compared with some of the other ones in this section of the Guardian. I’m not exactly arguing for universal basic income or for Manchester City to be relegated to the Saudi Pro League here. No one looks forward to a doctor visit, with its recriminations for bad habits or various intrusive blood tests. People don’t have cocktail parties to celebrate their yearly check-up, and yet, it seems like every day, there’s a new reason to go get prodded by a stranger in a lab coat.\nOur collective fascination with testosterone levels is just another instance of me (specifically me) being shamed into more medical tests.\nThe defense secretary, Pete Hegseth, and others in the Trump administration have been prattling on about testosterone for years now, claiming it’s the key to maintaining what’s left of our civilization. Hegseth wants to test soldiers for T levels, and offer testosterone replacement therapy (TRT) to those who don’t have sufficient medically verifiable machismo. He sees this as “restoring and optimizing your natural capabilities, protecting your longevity, and ensuring you have the biological foundation required to sustain the fight”.\nThe health secretary, Robert F Kennedy Jr, removed limits on TRT in June of this year, so that more men could be legally prescribed testosterone rather than, say, buying it at a gas station or from the back of a 2007 Dodge Caravan in the parking lot of an Arby’s.\nThe science behind the perceived benefits of testosterone replacement therapy for cisgender men are hotly debated – a debate I’m simply too stupid to wade into. I have a hard time doing long division. How am I going to understand what injecting hormones into my body is going to do? Maybe testosterone will make me smarter. Probably not. I think that’s probably the one thing we can agree it doesn’t do.\nIt’s bad enough that I have to be tested for blood pressure, cholesterol, A1C and eyesight. Why throw another thing on the pile of stuff I have to worry about? And is this actually worth my concern?\nTestosterone allegedly makes you more athletic, more virile, and more sexually active. First of all, I’m not a professional athlete. I don’t need to dunk a basketball or dominate my gym’s racquetball league. I’m a writer. My fingers work just fine.\nDo I need to function better sexually? If anything, I wouldn’t mind my libido toning down a bit. Will testosterone regrow my hair? I’d at least consider it if it did, but apparently, it makes hair loss worse. What good will a bit more muscle mass be if I end up looking like Steve Harvey without the millions of dollars that make Steve Harvey attractive? If you give me a million dollars, I’ll take testosterone. There, the offer is in writing.\nWhile fighting hormone therapy for trans troops, the Trump administration is simultaneously suggesting to cis men like me that I should be taking it instead, even if I don’t actually want it. Or need it. Considering my high interest in sex, perfectly acceptable athletic ability and generally sedentary lifestyle, if anything, maybe I have too much testosterone.\nI’m perpetually angry – about someone cutting me off in traffic, the escalator at the AMC Burbank 16 that never works, and the Lakers’ starting lineup. Would I be a more valuable member of society if I got out of my car and walloped the guy who swerved in front of me? Should I be bashing the escalator at the AMC with an aluminum baseball bat until the police arrive?\nLike any normal person my age, I take my aggression out in video games. Whenever I get too apoplectic to function, I turn on my Playstation 5 and queue up RoboCop: Rogue City, a game where you play as the titular cybernetic lawman of the future – blasting criminals with a high-powered, rapid-fire pistol. The only thing more satisfying than a robot eviscerating drug-addled gutter punks inside a game is when you get to issue parking citations and arrest people for public urination. Yes, you can do that in the game. It never gets old.\nI’m sure this is not what Pete Hegseth means when he talks about “lethality”, but this is as close as I’m going to get – wiping out a street gang with a rocket launcher. I assure you I don’t need more testosterone for that.\nUnderneath much of this tedious discourse and my own dread of seeing a doctor, though, is the fundamental premise that there’s something wrong with the natural progression of the human body. That, for some reason, we need to fix people who aren’t sick – as though we’re in some Jean-Claude Van Damme movie and need to be turned into a biologically enhanced weapon so we can swim more laps or something.\nIs the key to life being able to bench-press 300lb at the age of 75? For some, sure. I salute them. And yet, we are destined to age, to be rendered irrelevant, and to die. No matter what you inject or swallow from the pharmacist, it’s going to happen. That’s as normal as a stiff breeze. There’s no conquering reality. Just ask y", "translation_ja": "", "vocab": [{"word": "loathe", "definition": "強く嫌う、ひどく嫌悪する。感情的で強力な否定的感情を表す。"}, {"word": "recriminations", "definition": "相互の非難、責め返し。特に相手の悪行に対する非難や抗議を意味する。"}, {"word": "prattling", "definition": "つまらないことをしゃべり続ける、くだらないおしゃべりをする。自分勝手で退屈な話をすることを指す。"}, {"word": "verifiable", "definition": "検証可能な、証拠によって確認できる。事実として確認または証明できることを意味する。"}, {"word": "allegedly", "definition": "伝えられるところによると、と言われている。真実かどうか確実ではないが、そう主張されていることを表す。"}]}, {"title_ja": "Vance wants voters to ‘give us another chance’. But he is cornered | Sidney Blumenthal", "title_en": "Vance wants voters to ‘give us another chance’. But he is cornered | Sidney Blumenthal", "summary_ja": "The vice-president’s recent remarks seek to maintain a posture of strength while they inadvertently expose political realities JD Vance has parachuted into the midterm election campaign on a rescue mission in a new guise: a risk management consultant. Speaking in the flat language of the expert hire", "summary_en": "The vice-president’s recent remarks seek to maintain a posture of strength while they inadvertently expose political realities JD Vance has parachuted into the midterm election campaign on a rescue mission in a new guise: a risk management consultant. Speaking in the flat language of the expert hire", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/05/jd-vance-trump-midterms", "state_media": false, "category": "オピニオン", "full_text": "JD Vance has parachuted into the midterm election campaign on a rescue mission in a new guise: a risk management consultant. Speaking in the flat language of the expert hired to identify threats, weaknesses and losses affecting a business’s reputation, he has presented his executive summary for limiting vulnerabilities and a scenario for averting disaster.\n“There’s a lot of good that’s been done, but there’s a lot of work left to do,” he informed his clients on 15 September about the words to use. “Give us another chance, or give us another couple of years, to continue to work on the amazing things that we’ve been doing for the past two years.” He turned the focus to harm reduction rather than total agreement and then shifted the equation to a negative binary choice. “Even if you don’t agree with us on every issue, the other party is consumed by craziness.”\nHis proposal for a “another chance”, however, did not acknowledge harm, express remorse or offer any pledge to change. Skipping the apology avoided admitting error, wrongdoing or enlightenment. The lack of an apology allowed Vance – and Donald Trump – to maintain a posture of unwavering strength, to demand continued fealty and to maintain their pretenses.\nVance’s strategy does double duty by firmly establishing his stake to become the prospective successor to Trump as the Republican presidential candidate in 2028. He himself embodies “another chance”. But his implicit self-characterization creates an indelible political identity that the man of many identities must carry forward through this campaign and the next.\nEvery vice-president seeking to become president is inevitably “another chance”. Vance carries the burden of one of the most unpopular presidents of modern times. His gameplan depends upon more than calculated forgetfulness. Abject failure should be seen as “amazing” success. Explaining away Trump means never having to say you’re sorry.\nVance’s plea for “another chance”, however, has not produced the desired effect. Instead of Maga minions aroused to march in a phalanx through Trump’s Arch of Triumph, Vance’s defensive positioning has dampened fervor while opening the door to criticism within his party. Beleaguered Republican Senate candidates who had been in lockstep with Trump have suddenly started to flake off. Yet even as they edge away, they still take timid steps.\nMike Rogers in Michigan had previously argued that congressional efforts to limit Trump’s authority in the Iran war would “not be good for America” and dismissed concerns about rising fuel costs. “We’re going to be fine, we got plenty of oil,” he said. Senator Ashley Hinson in Iowa insisted that the US needed to “finish the job”, voting numerous times against invoking the War Powers Resolution to force an end to US involvement or curb executive authority without congressional approval.\nThen Rogers reversed himself, “I think the best option now is to wind it down … The time is now.” Hinson followed suit, pleading that “the war needs to be brought to a successful and immediate end.”\nThe panicked Republicans are not really defectors. None of them has offered a single reason why any Trump policy has been flawed, damaging or counterproductive. But now they want out, somehow to reduce their vulnerabilities. They demand an export ban on diesel as a panacea, which the Financial Times reports “wouldn’t be workable” and would have unintended consequences that would lead eventually to fuel price spikes.\nThe Republicans without a cause are seeking “another chance” without being able to articulate a difference from the past. They are pivoting into a void.\nHaving supported Trump down the line they would prefer not to be held responsible for the consequences. But their fracturing underscores that the president and the policies they supported are the source of their quandary.\nThe Republican freak-out validates voters’ anxieties that continuing the Trump status quo carries unacceptable risk. Rogers, Hinson and others cannot be dismissed as Democratic complainers. Their attempt to distance themselves grounds the Democratic criticism in more than partisanship and undermines the simple choice of rejecting the Democrats as the radicals. Intra-party disintegration makes the Trump administration, not the opposition, appear more unpredictable and untrustworthy.\nThe uneasy Republicans’ bid for “another chance” subverts Vance’s framing of the midterms as a judgment about who flew over the cuckoo’s nest. “So, to the American people, I’d say, send these people packing, put them in the mental hospital, do not put them in Congress, because even if you don’t agree with us on every policy issue, at least we’re motivated by common sense and American interest.”\nVance’s pitch relies on vapid “common sense”, but when Republicans turn tail the illusion of irresistible power is shattered and the dogma loses its magnetism. It is the Republicans above all who are neutralizing Vance’s damage control. His request for “a", "translation_ja": "", "vocab": [{"word": "parachuted", "definition": "突然現れる、急に投入される。元々は傘兵が降下することから転じて、予期しない方法で急に何かの状況に参入することを意味する。"}, {"word": "vulnerabilities", "definition": "弱点、脆弱性。組織やシステムが持つ潜在的な弱みや攻撃されやすい部分のこと。"}, {"word": "fealty", "definition": "忠誠心、従順さ。主君や指導者に対する絶対的な忠誠と服従の義務を指す。"}, {"word": "indelible", "definition": "消えない、不変の。物理的または心理的に消すことができない、永遠に残るという意味。"}, {"word": "phalanx", "definition": "密集した集団、連帯した組織。古代ギリシャの軍事用語から転じて、統一された強力なグループを指す。"}]}, {"title_ja": "Trump’s recent statements on the economy are even more bonkers than usual | Steven Greenhouse", "title_en": "Trump’s recent statements on the economy are even more bonkers than usual | Steven Greenhouse", "summary_ja": "Our ‘genius’ president is revealing his ignorance of economics, fueling concerns about the threat he poses to the world Donald Trump recently made a bold claim about his abilities, writing on Truth Social : “The only control or ‘guardrails’ that AI needs is a STRONG AND SMART (High IQ!) PRESIDENT, a", "summary_en": "Our ‘genius’ president is revealing his ignorance of economics, fueling concerns about the threat he poses to the world Donald Trump recently made a bold claim about his abilities, writing on Truth Social : “The only control or ‘guardrails’ that AI needs is a STRONG AND SMART (High IQ!) PRESIDENT, a", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/05/trump-us-economy-comments", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump recently made a bold claim about his abilities, writing on Truth Social: “The only control or ‘guardrails’ that AI needs is a STRONG AND SMART (High IQ!) PRESIDENT, and the U.S.A. has that, in spades!”\nBut in the days before and after that post, Trump made one mind-boggling statement after another, including one that raised the possibility of cutting off all trade with dozens of the US’s trading partners. The president’s statements had many experts questioning not just his intelligence, but also whether he – and the outlandish policies he was proposing – were a clear and present danger to both the US economy and the world economy. Public respect for Trump’s economic sense has fallen so low that just 7% of Americans think he should take the lead in regulating AI, according to a recent WSJ poll.\nResponding to Trump’s reckless statements, one prominent advocacy group, Republicans Against Trump, derided him as “Dumbest. President. Ever.”\nEconomists and corporate executives were especially alarmed by two Trump statements. First, he wrote on Truth Social: “I’ll stop trading with countries with which we have a deficit” if the Federal Reserve doesn’t cut interest rates.\nThe second disconcerting statement was: “If we stopped Trading with every country that we have a Deficit with, which is most of them, we would make, at least, 1.5 Trillion Dollars a year.”\nNot only is Trump’s arithmetic childishly silly here, but any college student who took Econ 101 knows that if a trade-dependent nation like the US suddenly ended all trade with dozens of countries, that would lead to economic disaster. What’s more, it was worrisome that Trump views himself as almighty emperor with the power to singlehandedly halt hundreds of billions of dollars in trade.\nIf Trump ordered the US to terminate all trade with every place with which it has a trade deficit – that includes China, Mexico, Taiwan and the European Union – many US manufacturers would quickly find themselves in desperate straits, unable to obtain critically needed computer chips, rare earths, auto parts, aluminum and much more. As a result, many factories would be forced to close. Not only that, many farmers would be crippled because they couldn’t import the fertilizer they need, while many homebuilders would have to stop work because they couldn’t import needed lumber.\nThose were by no means Trump’s only recent mind-boggling statements.\nTwo days before the Federal Reserve raised its short-term interest rates to 3.75% to 4% to combat inflation, Trump was on a tear, badgering and bullying the Fed, telling it not only not to raise interest rates, but to cut rates sharply. “We should be at 1% or half a percent,” Trump said. Again, anyone who took Econ 101 knows that cutting rates so sharply and so low will push prices skyward at a time when the Fed and consumers already think inflation is too high. And let’s not forget that Trump was the guy who promised to reduce prices on day one as president.\nWith that statement, the self-described “stable genius” president showed his utter failure to understand one of the most basic teachings of Econ 101 – when interest rates are extremely low, like 1%, that heats up the economy and that revved-up economic activity fuels inflation. The University of Michigan economist Justin Wolfers called Trump’s demand for a 1% interest rate “the dumbest thing ever said by a president”.\nThen there was this whopper. Trump said that if the Fed bowed to his demands and slashed interest rates, “we could have a GDP [growth] of 14, 15, 16 and 20.”\nThose numbers are absurd, fantastical. Considering that the US economy grew at a moderate 2.2% rate in this year’s second quarter and rarely grows faster than 5%, talk of 20% growth is delusional. Since the second world war, the US economy has grown at a rate at 20% or higher just once. That happened in the third quarter of 2020 due to extraordinary circumstances – in that quarter, myriad businesses rushed to reopen after the worst pandemic in a century caused many to suddenly shut down during the previous quarter. (GDP plunged at a 28% rate that quarter.)\nThen there was this colossally wrong-headed statement about trade: “The word ‘Deficit’ is nothing more than a fancy word for LOSS.” Trump coupled that assertion with his misbegotten statement that the US would magically be $1.5tn richer if it terminated all trade with every nation with which it has a deficit.\nThis shows an infantile understanding of trade – and a stunning blindness to its mutual benefits.\nTo explain how inane Trump is being here, let’s hypothesize for a second that in the US-France trade relationship, the only goods traded are wine and bourbon. Under Trump’s ludicrous logic, if the US buys $2bn of wine from France, and the French import $1bn worth of Kentucky bourbon, the resulting $1bn trade deficit means the US is simply giving away $1bn to France.\nTrump bafflingly sees that as an outright $1bn loss. Blinded by ignorance, ideology or a", "translation_ja": "", "vocab": [{"word": "outlandish", "definition": "常識外れで極端な、奇抜な政策や主張を表す。合理性を欠いた過激な提案に対して使用される。"}, {"word": "reckless", "definition": "危険性を無視した無責任な行動や発言を指す。深く考えずに無謀に行動することを意味する。"}, {"word": "disconcerting", "definition": "不安や困惑を引き起こす、落ち着きを失わせるような出来事や発言。予想外で不安な状況を表す。"}, {"word": "singlehandedly", "definition": "一人の力で、単独で何かを成し遂げることを意味する。他者の助けなしに対処すること。"}, {"word": "terminate", "definition": "正式または公式に終了させる、打ち切る。契約や関係を公式に終わらせることを指す。"}]}, {"title_ja": "China’s Long Twilight", "title_en": "China’s Long Twilight", "summary_ja": "Demographic decline, political paralysis, and the fate of great powers.", "summary_en": "Demographic decline, political paralysis, and the fate of great powers.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinas-long-twilight-carl-minzner", "state_media": false, "category": "オピニオン", "full_text": "During the boom years of the reform era, from 1978 to the early 2000s, China was a country of productive workers. The working-age population (those aged 15 to 64) rose from 57 percent of the population in 1978 to a peak of nearly 75 percent in 2010. They built the roads, factories, apartment complexes, and firms that powered three decades of close to ten percent annual growth—a 20-fold economic expansion.\nBut over the past decade, this tide has turned. Beijing’s one-child policy, plus the same social forces that have dragged East Asian fertility to historic lows, have produced below-replacement birth rates for three decades in China—draining the fuel that powered China’s rise. China’s total population peaked at 1.4 billion in 2021 and is now falling by three to four million people per year—roughly equivalent to losing one Los Angeles each year. By the 2040s, if China continues to follow East Asia’s descent to ultralow fertility rates, it will shed around one percent of its population annually—roughly ten million people, more than the population of New York City. At the same time, the proportion of China’s population aged 65 and older will surge, doubling from 15 percent today to around 30 percent in the 2040s, and then rising to well over 40 percent by the late twenty-first century. The size of that cohort in the United States, by contrast, is projected to rise far more gradually, from around 19 percent of the population today to just over 23 percent in 2060.\nPut simply, China is entering a century of demographic decline. This change will remake the country’s economy and politics just as dramatically as the last century’s demographic boom did. Back in the mid-twentieth century, improvements in health and falling infant mortality rates led to a burgeoning youth population, which Mao Zedong channeled into revolutionary social change, overturning entrenched hierarchies and remaking society from the bottom up. By 1978, China had a swelling population of working-age adults, and Chinese leader Deng Xiaoping’s pragmatic policies of “reform and opening up” astutely plugged them into the global economy, allowing China to emerge as the world’s factory.\nToday, as the population rapidly grays, China’s political system is becoming increasingly regressive and rigid. As the Chinese Communist Party pivots back toward one-man rule, its vaunted institutions of technocratic rule are not what they once were. Instead of creatively addressing emerging challenges, the CCP is relying on repression and reflexively following central mandates—no matter the risks. Economically, for instance, policymakers continue to pursue Chinese leader Xi Jinping’s preferred export-driven industrial policy despite the obvious need to boost domestic consumption and strengthen the social security net for the poor.\nThe story of twenty-first-century China, then, is not just one of demographic decline but also one of political paralysis—and what happens when those two intersect. It is this combination that makes China’s future especially bleak. As China ages, the social pressures bearing down on its political system will only intensify. Mid-twenty-first-century China could end up looking a lot like the sixteenth-century Ming dynasty, a sclerotic political regime rendered increasingly brittle by worsening social, gender, and generational divides. Lest observers in Washington gloat about this fate, however, China’s trajectory is ultimately a warning: demographic decline and political erosion can hollow out any great power—including the United States.\nThe Politics of Paralysis\nAs the journalist Li Yuan has observed, the United States suffers from China envy. Tech investors fawn over its latest AI models. Energy specialists are awestruck by its industrial dominance in batteries and solar power. And journalists and analysts often return from visits offering rosy-eyed panegyrics about China’s gleaming transit systems and engineering capacity. Politicians and pundits, meanwhile, often fuse China’s expanding navy and missile tests with Xi’s speeches on “the great rejuvenation of the Chinese nation” to form a single image: a strong state successfully executing a grand strategy for its twenty-first-century rise.\nCompared with the political circus in Washington and the malaise in the rest of America, such surface-level manifestations of China’s wealth and power often lead to sweeping conclusions about relative national trajectories. But on closer inspection, Beijing is also undergoing profound political erosion—it just doesn’t look like the process playing out in Washington. Because China’s system is tightly controlled, its descent into personalistic one-man rule does not play out in divisive confrontations on television or erratic social media rants by the top leader. Beijing’s transformation is instead happening quietly but just as consequentially. Over the past two decades, the CCP has come to revolve ever more tightly around a single man. Xi successfully lifted", "translation_ja": "", "vocab": [{"word": "demographic", "definition": "人口動態に関する。人口の規模、構成、変化などを表す学術用語で、経済や社会政策の分析に頻繁に使われます。"}, {"word": "burgeoning", "definition": "急速に増加・拡大する。成長や発展が活発に進行している状態を指す比較的格式高い表現です。"}, {"word": "pragmatic", "definition": "実用的で現実的な。理論よりも実際の結果や効果を重視する姿勢や政策を説明する際に用いられます。"}, {"word": "regressive", "definition": "後退的な、悪化する方向に向かう。政治体制や政策が以前より民主的でなくなることを指します。"}, {"word": "vaunted", "definition": "自慢された、名高いとされている。通常は皮肉を込めて、評判ほどの価値がないことを暗示するときに使われます。"}]}, {"title_ja": "The Triumph of Tech-Fueled Propaganda", "title_en": "The Triumph of Tech-Fueled Propaganda", "summary_ja": "America isn’t ready for the next wave of foreign influence operations.", "summary_en": "America isn’t ready for the next wave of foreign influence operations.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/triumph-tech-fueled-propaganda", "state_media": false, "category": "オピニオン", "full_text": "In April and May, hundreds of users of the social media platform Bluesky discovered that their accounts had been hijacked and used to spread content about Ukraine. Researchers at Clemson University later attributed the campaign to the Social Design Agency, a Russian consulting firm sanctioned by the U.S. Department of Treasury for running Kremlin-directed malign influence campaigns. The Bluesky effort turned out to be only one piece of the SDA’s much larger portfolio of recent operations: leaked documents obtained by the news portal Delfi Estonia and shared with the Organized Crime and Corruption Reporting Project revealed plans for real-world acts of vandalism, intimidation, and election interference.\nMost discussions of online influence and disinformation campaigns assume that attacks such as the one on Bluesky are discrete efforts. But as the SDA’s operations show, influence operations are increasingly interconnected and part of propaganda strategies that transcend traditional boundaries. Sophisticated states such as China, Iran, and Russia routinely combine overt public messaging with covert influence and mix broadcast channels with social media platforms. State media outlets, official government accounts, paid influencers, fake personas, hacked accounts, and bot armies are parts of the same system. This integrated approach, which we call “full-spectrum propaganda,” is now the norm for U.S. adversaries trying to spread their message abroad.\nIn full-spectrum propaganda, as we outlined in a recent Security Studies article, the many channels that states can use reinforce each other, making narratives seem more credible and allowing them to proliferate more widely. A story publicized on a state-backed broadcast channel may reach one audience, while social media accounts catch the attention of another. Official outlets can quote from posts on fake accounts whose creators masquerade as ordinary members of the public, making a fringe claim seem normal. Paid influencers can tailor messages in a style that resonates with niche audiences. The rapid expansion of artificial intelligence is making this strategy even more powerful: states are increasingly integrating AI into every level of their propaganda operations, allowing small groups or individuals to conduct propaganda campaigns that would previously have required far greater resources.\nStrategies that merely address discrete foreign influence campaigns will fail to meet the challenges presented by full-spectrum propaganda. The United States needs to be able to understand, assess, and counter influence operations holistically, yet as the threat grows, the United States has been undercutting the capacity that would allow it to do so. Politicians have been dismantling the government agencies designed to track foreign influence, and social media companies are raising barriers to research on their platforms, leaving the country unprepared. As AI accelerates the spread and expands the reach of global propaganda, Washington is blinding itself to the challenge.\nEVERYTHING EVERYWHERE ALL AT ONCE\nFor much of the last decade, politicians and the public understood foreign influence operations on social media through the parts that first became visible. Most often, this would be a network of fake accounts discovered by social media companies as part of their efforts to eliminate bots, scams, and online deception on their platforms. After taking down such accounts, companies would write reports and researchers (including us) would publish analyses to explain the evolving tactics, techniques, and procedures of online influence campaigns. The focus on the specifics of each individual operation led people to think of the threats as narrow, distinct incidents.\nBut the fragment of what is visible is not the whole story. State-backed propagandists do not have to choose between state media and fake accounts, between covert personas and overt broadcasters, or between a spoofed media outlet or a Telegram channel. They can use all of them together—and they are increasingly doing so.\nThe SDA, for instance, documented its own work in the style of a consultancy reporting to a client. That client, the leaked documents suggest, was the administration of Russian President Vladimir Putin, whose officials appear in the agency’s internal communications overseeing its work. The consulting firm’s covert operations are just one component of a much broader Russian propaganda apparatus that also includes state media networks, official government channels, and fake personas. Moscow and its proxies use all of these tools in tandem to amplify propaganda messages and reach many types of audiences.\n Looking at foreign influence campaigns as a social media problem is too limited.\nAs the Organized Crime and Corruption Reporting Project and other news outlets explained, the SDA was behind a fake video in June 2025, branded to appear as if it were made by the Saudi media outlet Al Arabiya, which claimed t", "translation_ja": "", "vocab": [{"word": "attributed", "definition": "~の原因であると考える、~に帰する。ここでは、キャンペーンがロシアのコンサルティング企業によるものであると結論づけたことを意味します。"}, {"word": "portfolio", "definition": "複数のプロジェクトや業務の一覧、経歴書。ここでは、ある組織が実施している複数の作戦や活動の集合体を指します。"}, {"word": "discrete", "definition": "別々の、独立した、個別の。ここでは、個々に独立した個別の努力として認識されていることを意味します。"}, {"word": "covert", "definition": "秘密の、隠された、表面に出ない。公開されていない秘密裏の活動や影響力操作を指します。"}, {"word": "proliferate", "definition": "急速に増殖する、広がる、蔓延する。ここでは、偽情報や物語が広範囲に広がっていくことを意味します。"}]}, {"title_ja": "Brazil’s Election Won’t Fix What’s Broken", "title_en": "Brazil’s Election Won’t Fix What’s Broken", "summary_ja": "Reckoning with the country’s real crisis.", "summary_en": "Reckoning with the country’s real crisis.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/brazil/brazils-election-wont-fix-whats-broken-matias-spektor", "state_media": false, "category": "オピニオン", "full_text": "The Brazilian presidential election, which kicks off with a first round of voting on October 4, gives citizens a choice between radically different visions of politics. Luiz Inácio Lula da Silva, known as Lula, the standard-bearer of the Latin American left, seeks a fourth presidential term against Flávio Bolsonaro, the son of Jair Bolsonaro, the hard-right former president who was sentenced to 27 years in prison for attempting to overturn the results of the previous presidential election. The race is also a contest over how Brazil should conduct its foreign affairs: Lula emphasizes strategic autonomy, including through growing ties with China and other partners, while Flávio Bolsonaro favors close alignment with the Trump administration in the United States.\nWhat unites the two candidates is the assumption that Brazil still has the freedom to choose its foreign policy strategy. Brazil’s vast resources, distance from active conflict, and influx of foreign direct investment should position it well to manage current global upheaval and great-power competition, and to effectively bargain for what it wants. But despite these valuable geopolitical assets, Brazil is losing global influence, and its autonomy to act is at risk. Major powers, including both China and the United States, are increasingly able to dictate their terms of engagement with Brazil. The country is also becoming isolated in South America, where it had until recently led the creation of regional institutions such as the trading bloc Mercosur. Its relationship with Argentina, for instance—which had helped underpin four decades of regional stability—has deteriorated to the point that neither country has an ambassador in the other’s capital.\nBrazil is largely responsible for its waning sway. Much of the country’s influence depends on whether foreign partners believe that the deals it strikes today will be implemented tomorrow. That credibility, in turn, rests on the state’s capacity to commit—that is, its ability to mobilize the resources needed to fulfill its promises, coordinate public institutions effectively, and ensure that the bargains it makes survive democratic political turnover. A raft of domestic problems, including mounting fiscal constraints, a political system at war with itself, and widespread corruption, has made it harder for the state to deliver. A major scandal has now engulfed the Supreme Court, an institution meant to enforce rules impartially and which is therefore essential to the durability of Brazilian commitments. The Trump administration’s open meddling in Brazil’s domestic politics has compounded the country’s vulnerabilities by making any deal controversial and partisan and raising the likelihood that future administrations in both Brasília and Washington might try to reverse it.\nWhoever wins the upcoming presidential election will inherit these sources of weakness. So far, the candidates have not offered any clear plan to address them. Neither a tilt toward Washington nor an embrace of multilateral diplomacy will solve the deeper problem that is eroding Brazil’s foreign policy autonomy and keeping it from turning its assets into real strength.\nRUNNING WILD\nBrazil has not always struggled to project credibility to the world. In the 1990s, the country’s economic stabilization plan brought down runaway inflation, its leaders consolidated and strengthened its democracy, and it signed agreements with Argentina on economic integration and nuclear safeguards that improved regional security. All these commitments persisted through multiple leadership transitions. In the eyes of powerful players such as Europe and the United States, Brazil was an appealing place for investment and a growing force in multilateral diplomacy.\nToday, however, what partners see is a country beset by dire fiscal problems, deeply fragmented domestic politics, and endemic corruption. Brazil’s economy is roughly the size of Canada’s and larger than Spain’s, and the government has a formidable capacity to tax its citizens and bring in revenue. But more than 90 percent of the federal government’s noninterest spending is mandatory, giving it little room for discretionary spending on areas such as infrastructure, which the country sorely needs to make use of its vast reserves of critical minerals. At the same time, the International Monetary Fund has projected that Brazil’s government debt will reach about 98 percent of GDP by the end of 2026. With real interest rates at about ten percent, servicing that debt is extraordinarily expensive, consuming resources that might otherwise be used to strengthen the country’s security forces or fund other strategic priorities.\nThe country’s fiscal constraints are making it harder to curb the transnational expansion of homegrown criminal gangs, a failure that forces other countries to manage Brazilian problems and further undermines the country’s credibility as a partner. Brazilian authorities do not have enough money ", "translation_ja": "", "vocab": [{"word": "standard-bearer", "definition": "ある運動や政党などの指導者や代表者のこと。その立場や理想を象徴する人物を指す。"}, {"word": "autonomy", "definition": "自治権や自主性のこと。他国からの干渉を受けずに独立して行動する自由を意味する。"}, {"word": "geopolitical", "definition": "地政学的な、つまり地理的位置が国際政治や経済に与える影響に関連する。大国間の競争などの文脈で使われる。"}, {"word": "waning", "definition": "減少している、衰退している状態を表す。影響力や権力が徐々に失われていく過程を指す。"}, {"word": "credibility", "definition": "信頼性や信用のこと。約束や契約を実行する能力があると他者から認識される度合いを示す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-06 01:33 JST";
  renderTabs();renderList();
})();
</script>
