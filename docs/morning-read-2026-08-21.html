, defying growing international protests\n- Published\nA new generation of Israeli settlers has returned to the settlement of Kadim, in the occupied West Bank, two decades after it was closed by a previous Israeli government.\nThirty \"pioneer families\" had arrived in the settlement on Thursday from Tel Aviv, according to the regional settlers' council, riding a wave of Jewish nationalism driven by Israel's current government.\nThey came in small groups, some under military escort, blue and white Israeli flags fluttering from their cars as they passed Palestinian villages and farmlands. Some dragged trailers loaded with bedding, furniture and building material.\nIsrael's government has overturned a 20-year ban on Jewish settlements around Jenin. Palestinian residents are watching the new push on settlement expansion here with fear.\nAll Israeli settlements and settler outposts are illegal under international law. Outposts are also illegal under Israeli law, though are often supported by state services and funding.\n\"21 years after the crime of expulsion from northern Samaria, we have completed the correction […] and have returned to the settlement of Kadim,\" said Israel's far-right Finance Minister Bezalel Smotrich at the opening ceremony, using the Biblical word for the northern West Bank.\nAlongside him were Israel's Justice Minister, the Speaker of the Knesset, and Yossi Dagan, head of the regional settlers' council, who vowed that settlers would one day return to Gaza too.\nKadim, on a small hillside outside the Palestinian city of Jenin, was evacuated in 2005 by a previous Israeli government as part of a wider unilateral Disengagement Plan that also saw all Jewish settlers and soldiers pulled out of Gaza, and three other settlements in the northern West Bank dismantled.\nAt the time, the four settlements were considered too isolated and costly to protect, and of little strategic value.\nIn recent weeks, white trailer homes have appeared on the hilltop here again, in preparation for families to return.\nOur request to speak to people at the opening ceremony was refused; we were told no media were allowed to enter the settlement today.\nDriving along a dirt track on the hill behind it, we met a Palestinian vegetable farmer, living in the house he was born in 53 years ago.\nHe told me how, as a boy, he watched Kadim being built for the first time, then watched again as the settlers there were forced out by the government twenty years later.\n\"Back then, the settlers were living alongside us, and we coexisted peacefully. They lived their lives and we lived ours,\" he told me.\nNow, watching them return, he's fearful.\n\"I'm afraid of the events spreading around us, and the bypass road [where] they demolished shops and businesses,\" he said.\n\"They drove my nephews away from their vegetables and citrus trees, telling them 'you have no place here, don't come back'\".\nHe said his family fled here from Haifa during the 1948 Arab-Israeli War.\n\"There's no more displacement left in me,\" he said. \"We're living with a sense of resignation. It's a life of fear.\"\nAfter Kadim and the three other settlements here were evacuated in 2005, Israelis were banned from settling in this area. Israel's current government overturned that ban.\nKadim is the last of the settlements evacuated in 2005 to reopen. Ganim, Sanur and Homesh have already been formally opened, and families moved in.\nBut they are a drop in the ocean of the Israeli government's settlement project here. Since it took power in late 2022, it has approved more than 100 new settlements across the West Bank, including 19 in the northern West Bank.\nHagit Ofran, director of the Settlement Watch programme at Peace Now, says the rapid construction in Jenin is part of a wider race by the Israeli government to expand settlements in the West Bank before Israeli elections are held in October.\nOne of those new settlements is Emek Dotan, to the west of Jenin, formally opened last Sunday and now home to almost two dozen Jewish families.\nFrom the small hamlet of Palestinian houses next door to Emek Dotan, teacher Samer Jaber, has watched the settlement take shape: first the bulldozers, then the caravans lifted into place. The problems began even before most of the families moved in, he said.\n\"Groups come and stand opposite our houses, filming us,\" he told me.\n\"Yesterday they came and stood here, filming me and my children. Every time my wife stepped outside, they filmed her too. They try to enter our homes. And they go house by house, shining powerful floodlights directly through all the windows at two or three in the morning.\"\nSamer is partially blind and has a leg injury that makes moving difficult.\n\"Fear dominates everything. We are completely defenceless,\" he said. \"All of them have weapons. I'm bringing concrete blocks to close off this side of the house because I'm afraid for my children.\"\nSamer has watched settlements – and settler attacks – gr", "translation_ja": "", "vocab": [{"word": "disengagement", "definition": "政治的・軍事的な関与から身を引くこと。ここではイスラエルがガザと北西岸から兵士と入植者を撤退させた2005年の政策を指す。"}, {"word": "outpost", "definition": "領土の周辺に設置された小規模な軍事・民間拠点。国際法では違法だが、イスラエル法でも違法なパレスチナ領土内の入植地。"}, {"word": "bilateral", "definition": "二国間の関係や交渉を指す用語。ここでは文脈上、イスラエルとパレスチナ間の関係を暗示する。"}, {"word": "strategic", "definition": "戦略的な、長期的な利益や目標達成に関連する。カディムは2005年に戦略的価値が低いと判断され撤退された。"}, {"word": "unilateral", "definition": "一方的な行動や決定のこと。2005年のイスラエルの撤退計画は国際協調を伴わない一方的な決定であった。"}, {"word": "defenceless", "definition": "防御手段がなく、攻撃や危害から保護されていない状態。パレスチナ住民が入植者の行為に対して無力であることを表現している。"}]}, {"title_ja": "ロシアの二段階ドローン攻撃でウクライナの商業施設で15人が殺害", "title_en": "Russian double-tap drone strike kills 15 at Ukrainian shopping mall", "summary_ja": "ロシアのドローンがクリヴォイ・リフの商業施設に二段階攻撃を実行し、少なくとも15人が殺害、130人が負傷した。ゼレンスキー大統領は、昼間の攻撃を「非常に冷酷で卑劣」と非難し、二番目の波で緊急対応者を狙ったと述べた。複数地域からの救援隊ががれきに閉じ込められている可能性のある生存者を捜索している。", "summary_en": "At least 15 people were killed and 130 injured when Russian drones struck a shopping centre in Kryvyi Rih in a double-tap attack. President Zelensky condemned the \"absolutely cynical and despicable\" daytime strike, where a second wave of drones targeted emergency responders at the scene. Rescue teams from multiple regions are searching for survivors feared trapped in the rubble.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c39egw7nmk2o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Russian double-tap drone strike kills 15 in Ukrainian mall, officials say\n- Published\nAt least 15 people have been killed in a Russian double-tap drone strike on a shopping centre in the central Ukrainian city of Kryvyi Rih, local officials have said.\nAnother 130 people - including 23 children - were injured in the city's biggest mall. More people are also reported to be trapped in the rubble.\nPresident Volodymyr Zelensky said the \"absolutely cynical and despicable\" daytime attack in his home town was carried out in \"two waves\", with the second strike targeting emergency workers at the scene.\nDramatic footage verified by the BBC shows the second drone hitting the already burning shopping centre in the Dnipropetrovsk region. Russia's military has not commented.\nDnipropetrovsk regional head Oleksandr Hanzha said on Friday evening that there were now 15 confirmed fatalities, including two people who died later in hospital.\nHe said that 130 people were injured, including 29 who were in a serious condition. There are fears the death toll would rise further.\nRescuers teams from four other Ukrainian regions are being urgently deployed to help search for survivors.\nEarlier in the day, Kryvyi Rih Mayor Oleksandr Vilkul said the Russian drones were flying at \"extremely low altitudes\", describing the attackers as \"animals\".\n\"There are missing people who are not responding to calls,\" the mayor added.\nFour people - including three children - were killed in separate Russian attacks in Ukraine's southern Mykolaiv region, and another two in the north-eastern Kharkiv region, local officials said.\nIn the southern city of Zaporizhzhia, three people were injured when a drone exploded near a taxi, the regional head said.\nThis comes a day after 17 people were killed and more than 40 injured in a major Russian missile and drone attack on Ukraine's capital Kyiv.\nBlocks of flats and warehouses were struck overnight across the city, local officials said. A children's hospital and school were also damaged.\nEarlier on Friday, Ukraine's military said it carried out strikes on an oil refinery and a military airfield deep inside Russia.\nUkraine has in recent months intensified attacks on Russian energy facilities, as well as on warehouses of the country's largest online retailer Wildberries.\nKyiv describes them as legitimate targets because they help finance Russia's war.\nRussian President Vladimir Putin launched a full-scale invasion of Ukraine in February 2022, and currently Moscow controls about a fifth of Ukrainian territory in the south-east.\nRelated topics\n  - Published3 days ago\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "double-tap strike", "definition": "連続して同じ目標を攻撃する軍事戦術。最初の攻撃の後、救急隊員などの対応者を狙う二番目の攻撃を指す。"}, {"word": "cynical", "definition": "人間の動機や善意を疑う、または無視する態度を示す。道徳的配慮を欠いた行為を表現する際に使用される。"}, {"word": "despicable", "definition": "極めて悪質で、軽蔑に値するさまを表す形容詞。強い負の感情を伴う重大な非難を示す。"}, {"word": "fatalities", "definition": "死亡事故や死者の数を示す正式な用語。特に災害や事件の統計報告で使用される。"}, {"word": "deployed", "definition": "軍隊や資源を特定の目的や場所に配置する。戦略的に人員や物資を展開させることを意味する。"}, {"word": "full-scale invasion", "definition": "限定的ではなく、全面的で大規模な軍事侵攻を示す表現。すべての利用可能な軍事力を投入した戦争開始を意味する。"}]}, {"title_ja": "スウェーデンの高校で剣による攻撃、1人が殺害される", "title_en": "One killed in sword attack at Swedish high school", "summary_ja": "金曜日、スウェーデン中部のブリネル学校で剣による攻撃が発生し、1人が殺害され、2人が重傷を負いました。18歳の男が現場で逮捕され、警察は容疑者に向けて発砲しました。当局は容疑者の動機を調査する中、近隣の8つの学校が封鎖されました。", "summary_en": "One person was killed and two others seriously injured in a sword attack at Brinell School in central Sweden on Friday. An 18-year-old man was arrested at the scene after police fired at him. Eight nearby schools were placed under lockdown as authorities investigate the suspect's motives.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3r0g7gj2n3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "One killed in sword attack at Swedish school\n- Published\nOne person has been killed in a sword attack at a high school in central Sweden, authorities have said.\nPolice were called to the Brinell School in Fagersta shortly after 14:00 local time (13:00 BST) on Friday, where officers arrested an 18-year-old man.\nIn an update on Friday, police said officers fired at the suspect before arresting and detaining him. He has not been named.\nTwo teenage boys were seriously injured in the attack. Another person had minor injuries.\nEight other schools in the area were placed under lockdown measures - which have now been lifted - while a state of high alert was declared in the Västmanland region following the attack.\nSweden's public broadcaster reported that the suspect was wearing a helmet. Local media also said he was a former student. His motives were not immediately known.\nPolice said officers were now working to establish possible motives, adding that there was currently no danger to the public.\nIn a post on X, Sweden's Prime Minsiter Ulf Kristersson described the attack as a \"serious incident,\" and said \"we do not know what lies behind the act, but we know that police are working very intensively\".\nStudents at Brinell School had only just returned to the classroom following the summer break, with the new term beginning either on Monday or Wednesday this week, depending on the academic year.\nThe school has just under 500 students on its roster, according to SVT, and is located 170km (105 miles) north-west of the capital, Stockholm.\nSweden has experienced a number of attacks on educational institutions in recent years.\nThe country experienced its worst-ever mass shooting in 2025, where 11 people, including the gunman, died at an adult education centre in Örebro.\nThis led to the government tightening the country's gun laws after it was found that the suspect legally owned four rifles, three of which were found in the school where attack took place.\nTwo teachers were killed in a violent attack on a secondary school in Malmo in 2022 - an 18-year-old student later confessed to the attack.\nIn 2015, a teacher and a pupil were killed in a sword attack at a school in Trollhättan.", "translation_ja": "", "vocab": [{"word": "detain", "definition": "容疑者を逮捕して拘束すること。法執行機関が犯罪容疑者を一時的に身柄を拘束する行為を指します。"}, {"word": "lockdown", "definition": "安全上の理由から建物や施設の出入りを制限する措置。学校などで緊急時に実施される行動制限です。"}, {"word": "motives", "definition": "人が特定の行動を起こす理由や動機。犯罪捜査では容疑者の行為の背景にある目的を調査します。"}, {"word": "roster", "definition": "組織や施設に属する人員の名簿やリスト。学校の場合は登録されている全生徒の一覧を指します。"}, {"word": "tightening", "definition": "法律や規制をより厳しく、より厳密にすること。政府が安全上の理由から法律を強化する行為です。"}]}, {"title_ja": "ハリー王子ら7人、プライバシー訴訟敗訴で最大3450万ポンドの弁護士費用を請求される", "title_en": "Prince Harry and Six Others Face Up to £34.5m Legal Bill in Privacy Case Loss", "summary_ja": "ハリー王子を含む7人の著名人は、デイリー・メール紙の出版社アソシエイテッド・ニューズペーパーズに対する不正情報収集訴訟で敗訴し、最大3450万ポンドの法務費用を支払う必要に直面している。高等法院の判事は、彼らの主張が『極度に不合理』と判断し、事前合意をはるかに上回る異例の費用命令を下した。申立人らは10月2日までに控訴を試みることができる。", "summary_en": "Prince Harry and six other public figures, including Sir Elton John and Liz Hurley, must pay up to £34.5m in legal costs to Associated Newspapers Limited after losing their privacy case. A High Court judge ruled their claims of unlawful information-gathering were presented as 'unreasonable to a high degree,' imposing an exceptional costs order far exceeding the pre-trial agreement. The claimants have until October 2 to attempt an appeal.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c04kwr9r1zlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Prince Harry and six others face privacy case legal bill of up to £34.5m\n- Published\nPrince Harry and six other public figures face paying up to £34.5m to the publisher of the Daily Mail after a High Court judge imposed an exceptional order for legal costs over their failed privacy case.\nThe seven claimants, also including Sir Elton John and Liz Hurley, must pay an initial £9.54m by Friday of next week to Associated Newspapers Limited (ANL).\nThe judge ruled that the case was a rare one in which the claimants should have to pay far in excess of the costs that had been agreed before trial, criticising how they presented their claims as \"unreasonable to a high degree\".\nOn 7 July, Judge Mr Justice Nicklin dismissed the claims of unlawful information-gathering, which ANL denied.\nThe Duke of Sussex and the other six claimants have until 2 October to attempt to launch an appeal.\nThose other claimants are Sir Elton John and his husband David Furnish, former Liberal Democrat deputy leader Sir Simon Hughes, racial justice campaigner Baroness Lawrence, and actresses Sadie Frost and Liz Hurley,\nThey had insurance to cover up to £16.2m of Association Newspapers' costs in the event of losing the case - but Friday's ruling means the newspaper group could now try to recover up to the £34.5m that it said it had to spend to defend itself. This means the duke and others could face a bill of some £18m.\nJustice Nicklin said: \"I regard a claim for costs in excess of £34 million as, on its face, excessive and as giving rise to real concerns as to whether all of the costs now claimed by Associated were reasonably incurred and are reasonable in amount.\"\nBut he added he had \"decided not to impose a ceiling on Associated's recoverable costs\", as it would \"be too broad-brushed, would risk unfairness, and would be vulnerable to the charge that it was arbitrary\".\nThe judge also ruled that ANL's costs should be determined on an indemnity basis, which is more favourable to the publisher in terms of the amount it can recover, aside from where orders had already been made.\nHe added it was \"striking\" that \"not a single allegation of serious wrongdoing was voluntarily withdrawn\" by the group of seven claimants.\nHe said: \"That matters. Serious allegations of criminality or grave impropriety cannot properly be left hanging over individuals in that way.\n\"If a party no longer advances such an allegation, or no longer has a proper evidential basis for advancing it, the allegation should be withdrawn clearly and in terms.\n\"The claimants' failure to do so was not ordinary forensic judgment. It was not a proper or disciplined way to deal with serious allegations. It was unreasonable to a high degree.\"\nIn a statement released on Friday, the publisher called the ruling \"a devastating critique of an attempt to destroy a newspaper and the reputations of its journalists, editors and executives\".\nFriday's decision comes just days after Prince Harry and Meghan announced their plan to return to the UK, with their children Prince Archie, seven, and Princess Lilibet, five, enrolled to start school in September.\nDuring the trial, dozens of people gave evidence including Prince Harry and the other claimants. The Duke of Sussex flew in from the US to attend court in person.\nMany current and former Associated Newspapers journalists and executives gave evidence denying illegal activity.\nSir Simon Hughes told the BBC he was \"disappointed\" by the judgement.\n\"I am now taking the time necessary to consider both the substantive and the costs judgment and whether to pursue appeals against decisions in either judgment or both,\" he added.\nIn a joint statement following the judge's ruling last month, Prince Harry and Baroness Lawrence, who became a public figure after her son Stephen was murdered in 1993, said: \"We came to court seeking justice and accountability. But we have received neither.\"\n\"It is a complete and obvious whitewash, but sadly not altogether unexpected\", the pair added.\nComplex costs hearings now begin\nIn a civil case such as this, the legal convention is that the losing party must reimburse \"reasonable\" legal fees incurred by the other side. They also have to settle their own legal costs. Normally these are agreed and capped ahead of trial.\nANL had asked for more than £9.9m as an interim payment ahead of future hearings to decide its legal costs in depth. Only after it won did it become clear it has spent far more than an initial agreed cap of £16m.\nColin Campbell, a former specialist costs judge now with law firm Kain Knight, said the size of that overspend meant the battle was not over quite over yet.\n\"The order is a significant win for Associated Newspapers,\" he said. \"It means the publisher will no longer be constrained by the costs budget previously approved by Mr Justice Nicklin.\n\"Notably, [it] came despite the judge expressly finding that none of the claimants had been dishonest in their evidence.\n\"However, this is far from game, set and match for ", "translation_ja": "", "vocab": [{"word": "indemnity basis", "definition": "法的な費用回収において、より広い範囲の費用を請求できる基準。出版社など勝訴側がより有利な条件で法務費用を回収できる方式を指す。"}, {"word": "interim payment", "definition": "最終的な決定前に支払われる一時的な金銭給付。本件では訴訟の本格的な費用決定前に行われた支払いを指す。"}, {"word": "exceptional order", "definition": "通常の規則や慣例から著しく外れた特別な裁判命令。本件では通常のルールを超えた費用請求を認める判断を指す。"}, {"word": "forensic judgment", "definition": "法廷戦略における判断。本件では訴訟上の策略や判断が適切かどうかに関連して使用されている。"}, {"word": "vulnerable to the charge", "definition": "批判や告発にさらされやすい状態。判決がある種の批判を受ける可能性がある場合に使われる。"}, {"word": "whitewash", "definition": "不正行為や問題を隠蔽し、事実を歪める行為。本件ではハリー王zelda王子らが判決を不当な隠蔽と称して使用した。"}]}, {"title_ja": "メーガン妃、Netflixシリーズ『ザ・ジェントルメン』の役について交渉中", "title_en": "Meghan in talks for Netflix role in 'The Gentlemen' series", "summary_ja": "サセックス公爵夫人は、ガイ・リッチー制作のNetflixコメディシリーズ『ザ・ジェントルメン』の役で演技に復帰することについて初期段階の交渉中であることが分かった。2018年にハリー王子と結婚して以来、彼女にとって初めての重要な演技役となるだろう。この可能性のある機会は、夫妻が今月後半に英国に移転する予定であることと同時に報じられている。", "summary_en": "The Duchess of Sussex is in early discussions to return to acting with a role in Netflix's comedy series The Gentlemen, created by Guy Ritchie. This would mark her first significant acting role since marrying Prince Harry in 2018. The potential opportunity comes as the couple plans to relocate to the UK later this month.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwye9g9r58zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Meghan in talks for role in Netflix series The Gentlemen, BBC understands\n- Published\nThe Duchess of Sussex is in talks to return to acting with a role in Netflix series The Gentlemen, the BBC has learned.\nDiscussions are in their early stages but this would be Meghan's first significant acting role since her marriage to Prince Harry.\nMuch of the two previous series of The Gentlemen, which was created by Guy Ritchie, have been filmed in the Cotswolds - the area it is rumoured Harry and Meghan will set up home when they return to the UK later this month.\nThe Gentlemen, starring the actor Theo James, is a comedy series about a duke who becomes a drug baron.\nThe details of the discussions and any role Meghan might be offered have not yet been revealed.\nActors Hugh Bonneville and Vinnie Jones have appeared in previous series of the show.\nMeghan was best known in acting for her part in the US legal drama, Suits, in which she played lawyer, Rachel Zane, for seven seasons. Her last episode aired in 2018.\nThe duchess put her career on hold after her marriage to Prince Harry in May 2018. At the time, she told the BBC she did not view quitting acting as giving anything up, but rather as \"a new chapter\".\nShe recently returned to acting for the first time in nearly a decade, with a cameo as herself in forthcoming comedy Close Personal Friends, which stars Lily Collins and Brie Larson.\nA return to acting could be lucrative for Meghan. The BBC understands that while based in the UK she also hopes to expand the global reach of her US-based lifestyle and cooking brand, As Ever.\nNews of her possible return to acting comes after it was announced that Prince Harry and Meghan are to move back to the UK.\nThe BBC understands Prince Harry and Meghan intend to relocate from the US later this month to a private, non-royal residence outside London, as first reported by the Daily Telegraph and the Sun.\nThe couple's children, Prince Archie, seven, and Princess Lilibet, five, are enrolled to start at a British school in September.\nThere are no current plans for either Prince Harry or Meghan to resume their roles as working royals.\nTheir plan to move to the UK follows a visit in July by Prince Harry, Meghan and their children to see King Charles III at his Highgrove home in Gloucestershire.\nIt was the first time the King had seen his grandchildren in person in more than four years, and the couple's first visit to the UK together since 2022.\nReturning on a longer term basis has reignited questions over the level of the couple's publicly funded security in Britain.\nTheir UK security was downgraded after they stopped being working royals in 2020 and moved to the US, where they have paid for their own protection.\nThe Royal and VIP Executive Committee (Ravec), an independent body overseen by the Home Office, will now have to make a new decision about security as previous arrangements were based on the Sussexes not living in the UK permanently.\n  - Published1 day ago\n  - Published11 hours ago", "translation_ja": "", "vocab": [{"word": "duchy", "definition": "公爵領、公爵が統治する領地。The Gentlemensではduke（公爵）が主人公で、duchyはその領地を指す。"}, {"word": "cameo", "definition": "特別出演、著名人による短い出演。メーガン妃が『Close Personal Friends』で自分自身として短く出演することをcameoと表現している。"}, {"word": "lucrative", "definition": "利益が大きい、儲かりやすい。演技活動への復帰は経済的に有利になる可能性が高いことを意味する。"}, {"word": "downgraded", "definition": "格下げする、等級を落とす。王妃としての地位を失った後、セキュリティレベルが低下されたことを指す。"}, {"word": "reignited", "definition": "再び火をつける、再燃させる。英国への返還がセキュリティ問題に対する議論を再び活発化させたことを表現している。"}, {"word": "publicly funded", "definition": "公費でまかなわれた。政府の税金から支払われるセキュリティ経費のことを指す。"}]}, {"title_ja": "ロンドン公園の山火事により遺骨が発見され殺人事件捜査が開始", "title_en": "Murder Investigation Launched After Wildfire Uncovers Remains in London Park", "summary_ja": "8月にロンドン西部のベッドフォント・レイクス・カントリーパークで山火事の後、25～45歳の女性のものと思われる人骨が発見されました。ロンドン警視庁は殺人事件の捜査を開始し、被害者の身元確認と死亡の経緯の解明に取り組んでいます。当局は情報を持つ者に名乗り出るよう呼びかけています。", "summary_en": "Human bones belonging to a woman aged 25-45 were discovered at Bedfont Lakes Country Park in west London following a wildfire in August. The Metropolitan Police have launched a murder investigation and are working to identify the victim and determine the circumstances of her death. Authorities are urging anyone with information to come forward.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c0rdk9ddepvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Murder probe after wildfire uncovers body in park\n- Published\nA murder investigation is under way after human bones were uncovered at a west London park following a wildfire, the Metropolitan Police said.\nEmergency services were called to Bedfont Lakes Country Park in Hounslow at about 18:35 BST on Wednesday, 12 August.\nA police spokesperson said the remains were found by a member of the public after the wildfire affected an area of woodland known as The Pits.\nFollowing a post-mortem examination, police said the bones belonged to a woman aged between 25 and 45. They said it was not clear how long the remains had been there and officers were still working to identify her.\nThe London Fire Brigade said four fire engines and around 25 firefighters tackled a grass fire there on 5 August, which damaged about two hectares of shrubland.\nClose to the scene where the remains were found, patches of ground appeared blackened and some vegetation showed signs of fire damage.\nDet Ch Insp Wayne Jolley, who is leading the investigation, said: \"We are working to establish the full circumstances of what happened while keeping an open mind.\"\n\"I would urge anyone who has information that may assist us in identifying the victim and understanding the circumstances of her death to come forward and speak to us.\"\nListen to the best of BBC Radio London on Sounds and follow BBC London on Facebook, external, X, external and Instagram, external. Send your story ideas to hello.bbclondon@bbc.co.uk, external\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "post-mortem examination", "definition": "死後に遺体を医学的に調査する検査のこと。犯罪捜査では死因や死亡時期の特定に用いられます。"}, {"word": "circumstances", "definition": "事件や出来事が起きた際の状況や条件のこと。捜査においては事件の全体像を理解するために重要です。"}, {"word": "urge", "definition": "強く勧める、促すという意味の動詞。当局が情報提供を強く求める際に使われます。"}, {"word": "probe", "definition": "詳しく調査する、または調査そのものを指す名詞。特に刑事事件の捜査を意味することが多いです。"}, {"word": "uncover", "definition": "覆いを取る、または秘密や隠されたものを明らかにするという意味の動詞。"}, {"word": "remains", "definition": "遺体や遺骨など、故人の肉体的な痕跡を指す名詞。法医学的な文脈でよく使われます。"}]}, {"title_ja": "スウェーデン：学校での剣による攻撃で1人が殺害される", "title_en": "Sweden: One Killed in School Sword Attack", "summary_ja": "スウェーデン中部ファーゲスタのブリネルスコーラ高等学校で、18歳の男が剣で複数の生徒を攻撃し、1人を殺害、複数人が負傷しました。警察は容疑者に銃撃して身柄を確保し、公衆への危険はないと確認しました。この事件はスウェーデンの教育機関における最近の悲劇的な攻撃事件です。", "summary_en": "A sword-wielding 18-year-old man attacked students at Brinellskola secondary school in Fagersta, central Sweden, killing one person and wounding multiple others. Police shot and apprehended the suspect, and authorities confirmed there was no further danger to the public. The incident marks another tragic attack at an educational institution in Sweden.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/sweden-one-killed-in-school-sword-attack/a-78460421?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Sweden: One killed in school sword attack\nPublished August 21, 2026last updated August 21, 2026\nA person armed with a sword has wounded multiple people at a school in Fagersta in central Sweden, authorities said Friday.\nPolice said one person had been taken into custody and there was no longer any danger to the public.\nAfter initially saying three people had been wounded in the attack, two of them severely, police later said an additional person had been killed.\nEarlier on Friday, Sweden's healthcare authority said two boys, both aged between 12 and 17, were being treated in hospital.\nPolice said the suspect was an 18-year-old man, whom they shot during a confrontation and took into custody.\nWhat else do we know?\nPolice were called to the Brinellskola, a secondary school in Fagersta, at around 2 p.m. local time (1200 GMT). The school, which has some 450 students aged 16 to 20, had just reopened after the summer holidays.\nPublic broadcaster SVT reported that ambulances, police cars and a police helicopter were outside the property.\nThe municipality said other schools and some public buildings in the area had been locked down.\nFagersta, home to some 12,000 people, lies around 170 kilometers (105 miles) northwest of the capital, Stockholm.\nReactions to 'terrible news'\n\"Our thoughts are with all those affected,\" Prime Minister Ulf Kristersson said in a post on X. \"We do not yet know what lies behind the act, but we know that the police are working very intensively.\"\nMagdalena Andersson, leader of the opposition Social Democrats, lamented the \"terrible news.\"\n\"When violence takes place at a school, I know it impacts everyone in our country. All of Sweden stands together with Fagersta at this difficult time,\" she wrote on X.\nOther attacks at educational institutions\nSweden has seen a number of high-profile attacks at educational facilities in recent years.\nIn February 2025, a 35-year-old man killed 10 people at an adult education center in Orebro.\nIn another incident, an 18-year-old student fatally stabbed two teachers at a Malmo high school in March 2022.\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hit the \"star\" or \"preferred\" button so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "custody", "definition": "警察や当局による身柄拘束、または法的な監視下の状態を指します。犯人などが逮捕され、当局の管理下に置かれた状況を表します。"}, {"word": "confrontation", "definition": "対立や衝突的な出会いを意味します。ここでは警察と容疑者が直接対峙した状況を表しています。"}, {"word": "municipality", "definition": "自治体や地方自治区を指す行政用語です。ファーゲスタのような都市や町を統治する地方政府組織を意味します。"}, {"word": "lamented", "definition": "深い悲しみや遺憾の念を表現することです。政治家などが悲劇的な出来事に対して悔しみや同情を公に述べる場合に使われます。"}, {"word": "high-profile", "definition": "広く注目を集める、重要な、または著名な事柄を指します。メディアで大きく報道された攻撃事件などを説明する際に用いられます。"}, {"word": "perpetrator", "definition": "犯罪や悪行を実行した人物、すなわち犯人を指します。ニュースやレポートで事件の加害者を正式に指す用語です。"}]}, {"title_ja": "ウクライナがロシアのアニメ『マーシャとくま』に制裁を課す—プロパガンダ疑惑で", "title_en": "Ukraine Sanctions Russian Cartoon 'Masha and the Bear' Over Alleged Propaganda", "summary_ja": "ウクライナはロシアのアニメ『マーシャとくま』の製作者・流通業者に対し、親ロシア的なナラティブとプロパガンダの懸念から制裁を課しました。この制裁はウクライナ国内のYouTubeやNetflixなどのプラットフォーム上でコンテンツをブロックし、収益化を制限することを目的としています。クレムリンはこの措置を批判し、同作品のグローバルな成功と独立した運営を擁護しています。", "summary_en": "Ukraine has imposed sanctions on the producers and distributors of the Russian children's cartoon 'Masha and the Bear,' citing concerns over pro-Russia narratives and alleged propaganda. The sanctions aim to block the content and restrict monetization on platforms like YouTube and Netflix within Ukraine. The move has drawn criticism from the Kremlin, which defends the show's global success and independent operations.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/masha-and-the-bear-ukraine-sanctions-russian-cartoon/a-78464406?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "'Masha and the Bear': Ukraine sanctions Russian cartoon\nAugust 21, 2026\nUkrainian Culture Minister Tetyana Berezhna on Friday said Kyiv had imposed sanctions on the \"producers and distributors\" of the Russian children's cartoon series \"Masha and the Bear,\" or \"Masha i Medved\" in the original language.\nThe step will enable Kyiv to seek to remove and demonentize the series on websites like YouTube or streaming services like Netflix in the country.\nThe cartoon about a mischievous young girl's unlikely friendship and adventures with a retired circus bear, loosely based on a Russian oral fairytale of the same name, launched in 2009 and quickly became one of Russia's most successful televisual exports.\nWhat did the government in Kyiv say about the sanctions?\n\"Ukraine has imposed sanctions against the producers and distributors of the Russian animated series Masha and the Bear,\" Berezhna said on social media. \"This creates legal grounds to block the content in Ukraine and engage international platforms to restrict its monetization and distribution.\"\nThe show has also faced criticism from allies of Ukraine like Estonia and the UK for allegedly painting Russia in a positive light or for military or Soviet symbols sometimes appearing in the show.\n\"Russian propaganda has no place on children's screens — in Ukraine or anywhere in the world,\" Berezhna said.\nIn further comments on Facebook, Berezhna said the Ukrainian language channel for the show had 800 million views in 2025 alone. The Ukrainian language channel currently has roughly 18 million subscribers.\nWorldwide, as of June 2026, the show had more than 54 billion combined views on YouTube, making it one of the 50 most popular feeds on the entire site.\nUkrainian President Volodymyr Zelenskyy signed a decree imposing sanctions on the creators of the show for spreading \"pro-Russia narratives\" and for posing a threat to Ukrainian national security. They target the studio, the show's founder, and the series' scriptwriter and director.\nUkraine said it would seek to have its sanctions mirrored by international partners, potentially widening the restrictions.\nHow did the show's makers and the Russian government respond?\nThe company behind the show, Animaccord Animation Studios, has called past allegations that the show contains Russian propaganda \"false and defamatory,\" saying that it operates independently and receives no funding from the government in Moscow.\nKremlin spokesman Dmitry Peskov was asked about the sanctions on Friday and said that the cartoon series had \"conquered the world\" by promoting \"the finest human qualities.\"\n\"The fact that Ukraine has launched a war against cartoons, too, likely serves as yet another illustration of the ugly nature\" of the authorities in Kyiv, he said.\nIs 'Masha and the Bear' controversial, and why?\nThe show has been on the radar of Ukrainian authorities for almost a decade. The first complaint by the State Film Agency dates back to 2017, amid the illegal annexation of Crimea and the lower-level war in Ukraine waged by separatists supported by Russia. Since the 2022 full-scale invasion the issue has come into sharper focus still.\nIn June, Kyiv protested against streaming giant Netflix's move to acquire the rights to stream new seasons of \"Masha and the Bear.\"\nA group of more than 50 British parliamentarians this year appealed to Culture Minister Lisa Nandy to urge streaming platforms to remove the cartoon. They argued that some episodes exposed children to Russian and Soviet military imagery.\nSeveral Estonian politicians have also argued that \"Masha and the Bear\" is an instrument of Russian soft power, not least because of the several amiable bears in its cast.\nSome Western analysts have warned against exaggerating these fears, though — for instance UK academic Mark Galeotti, who wrote an article objecting to the British lawmakers' appeal in July, saying the show was not \"the most elevated of television,\" but \"it is cute and it has a big heart.\"\nIn its earlier days, \"Masha i Medved\" was also a topic of some controversy in Russia. It sometimes drew critical comparisons to Western children's shows and prompted debate on whether it was contradicting traditional values about the roles of girls and fathers in Russian society, given Masha's mischievous nature and her paternal bear's gentle use of positive reinforcement rather than correctional discipline.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "sanitize", "definition": "不適切な内容を削除または修正すること。この文脈では、制裁によってプラットフォームからコンテンツを削除または制限する行為を指します。"}, {"word": "demonetize", "definition": "動画やコンテンツから広告収益を削除すること。YouTubeなどのプラットフォームで、特定のコンテンツの収益化機能を無効にする措置を意味します。"}, {"word": "defamatory", "definition": "人または団体の名誉や評判を傷つけるような発言や記述のこと。法的には誤った悪意ある陳述を指します。"}, {"word": "exaggerate", "definition": "事実以上に大きく誇張すること。この記事では、カートゥーンのプロパガンダに関する懸念を過度に膨らませることを意味しています。"}, {"word": "soft power", "definition": "軍事や経済的強制力ではなく、文化や価値観を通じて他国に影響力を行使する方法。映画やアニメなどのメディアはソフトパワーの手段となり得ます。"}, {"word": "annexation", "definition": "他国の領土を自国に違法に併合すること。この記事ではロシアによるクリミア併合を指しています。"}]}, {"title_ja": "ドイツ軍、ポーランドのロシア対抗防衛線構築を支援", "title_en": "German Army Aids Poland's Eastern Border Defense Against Russia", "summary_ja": "ドイツの戦闘工兵隊が6月からポーランドのロシア・ベラルーシ国境沿いに広がる800キロメートルの防衛線「東の盾」構築を支援している。ウクライナ侵攻後のポーランドの防衛支出増加の一環であるこのプロジェクトは、潜在的な脅威を抑止しNATO東部側面を強化することを目的としている。ドイツ・ポーランド間の軍事協力は、ウクライナ紛争以来著しく強化されている。", "summary_en": "German combat engineers have been deployed since June to help Poland construct the East Shield, a defensive barrier along its 800-kilometer eastern border with Russia and Belarus. The project, part of Poland's increased military spending following Russia's 2022 invasion of Ukraine, aims to deter potential aggression and reinforce NATO's eastern flank. The German-Polish military cooperation reflects strengthened ties since the Ukraine conflict.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/german-army-helps-poland-construct-a-defensive-barrier-against-russia/a-78464726?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "German army helps Poland protect itself against Russia\nAugust 21, 2026\nPoland started to construct a defensive barrier along its border with Russia and Belarus in 2024. The East Shield defense system will eventually be around 800 kilometers long, and is intended to protect this country on NATO's eastern flank against attack from the east.\nWhen the Polish prime minister, Donald Tusk, inspected the first completed section in November 2024, he declared that the project was meant to \"deter and discourage a potential aggressor\" and was \"truly an investment in peace.\"\nThe Russian invasion of Ukraine in February 2022 was a profound shock to Poland's sense of security. The Tusk government has increased defense spending in 2026 to 200 billion zlotys (around 46 billion euros, or 54 billion dollars) ― almost 5% of Poland's GDP. This means that, in relative terms, Poland has the highest defense spending of all the members of NATO. The government has also bought the most advanced weapons available, particularly from the US, and is proceeding with the construction of the East Shield, a complex defense system along its eastern border.\nA shield against Russia\nSince June, around 40 German sappers, or combat engineers, have been helping to establish the defenses. The German army's combat engineer unit is specially trained in blocking the movement of enemy troops. The sappers are currently deployed near Budry in Masuria, close to the border with Russia. The fence marking the border is visible from where they are working, partially obscured by a row of trees on the Polish side.\nThe German soldiers are installing anti-tank obstacles to impede battle tanks in the event of an attack. A yellow backhoe loader lifts the spiky concrete blocks, known as Czech hedgehogs, off a truck and places them on the muddy ground.\nThis installation, around 200 meters back from the border, consists of three rows of these concrete blocks. A deep ditch and another line of hedgehogs run along the border itself. A Polish officer explains that mines can quickly be laid in the zone between the two lines of Czech hedgehogs.\n\"The German sappers have done an excellent job,\" the Polish general Stanislaw Czosnek said when he inspected the works on Thursday. He added that he was \"very impressed\" by his German colleagues' performance.\nIn the six weeks since their deployment, the German engineers have laid more than a kilometer of blocks.\n\"We stand ready to fight for democracy and freedom,\" stressed the German general Tito Gante, who accompanied Czosnek on the inspection. He praised the comradely atmosphere between the German and the Polish soldiers.\nThe Bundeswehr has declared its support for the East Shield an official mission: \"We want to maintain peace with a credible deterrent,\" Gante said.\nThe German contingent will stay until October, but the sappers will soon be deployed at other sections of the East Shield. The work near Budry is due to be completed over the coming week.\nPolitically symbolic\n\"Above all, the participation of German sappers has politically symbolic significance,\" Lukasz Jasinski, an analyst at the Polish Institute for International Affairs, told DW. \"Poland wants to convince Germany and other partners that Poland's eastern border is also the external border of the EU and NATO. Our Western partners should treat this border a bit like their own.\"\nPoland and Germany were quick to establish military cooperation after the end of the Cold War. Later, when Poland joined NATO in 1999, this created the necessary political and institutional conditions for close collaboration. Since then, NATO's Multinational Corps Northeast, in which Poland and Germany both have leading roles, has been headquartered in the Polish city of Szczecin.\nIn 2003, Germany sold the MiG-29 fighter jets it inherited from the former East German Air Force to Poland for the symbolic price of one euro each. Joint military exercises and exchange programs for both officers and soldiers are now standard practice.\nWhen Russia attacked Ukraine in February 2022, there were initial tensions between Germany and Poland on account of the cautious response from Berlin. Overall, though, the attack has further strengthened cooperation between the two. The Bundeswehr has supported Polish air defense by supplying several units of the Patriot air defense system, with their German crews. German fighter jets are helping to protect Polish air space, most recently as part of the NATO mission Enhanced Air Policing North (eAPN) in Malbork.\nQuestions of military cooperation were also prioritized in the closing statement that followed German-Polish intergovernmental consultations on December 1, 2025. The process culminated in the signing of the German-Polish defense agreement on June 17, 2026.\nOn August 15 this year, three German planes, two Eurofighters and an A400M transport aircraft, participated in the celebration of Polish Armed Forces Day. The head of the German air force, Holger Neumann, was one ", "translation_ja": "", "vocab": [{"word": "deterrent", "definition": "攻撃や侵攻を思いとどまらせるもの。軍事用語として、敵の行動を抑止する防衛力や兵力を指す。"}, {"word": "sappers", "definition": "戦闘工兵のこと。障害物の設置や地雷の敷設など、軍事防衛施設の建設に特化した兵士。"}, {"word": "contingent", "definition": "特定の期間や目的のために派遣される軍隊や人員グループ。通常は一時的な配置を意味する。"}, {"word": "credible", "definition": "信頼できる、信用性のある。文脈では、本当の脅威として敵に受け取られる防衛力を指す。"}, {"word": "external border", "definition": "EU等の同盟体の外周部にある国境。メンバー国の国境であり、同時に全体の境界線となる。"}, {"word": "multinational", "definition": "複数の国々から成り立つ。軍事用語では、異なる国籍の兵士が共同で活動する部隊や組織を意味する。"}]}, {"title_ja": "ヘンリー王子とメーガン妃、6年ぶりにUK帰還で王室の亀裂は修復されるか", "title_en": "Prince Harry and Meghan Markle Return to UK After Six Years", "summary_ja": "ヘンリー王子とメーガン妃がカリフォルニアへの移住から6年ぶりにイギリスに帰還します。この帰還は王室内の継続的な対立の修復に役立つ可能性があるという疑問を提起しています。彼らのUK滞在は、長年の緊張の中で和解の機会をもたらすかもしれません。", "summary_en": "Prince Harry and Meghan Markle are returning to the United Kingdom after departing for California six years ago. The visit raises questions about whether their return could help mend the ongoing rifts within the royal family. Their time in the UK may provide an opportunity for reconciliation amid longstanding tensions.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Culture/prince-harry-meghan-markles-uk-return-puts-spotlight/story?id=135840065", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、ニュース速報とライブイベントの24時間カバレッジを提供しています。プラットフォームは重大なニュースが発生する際のリアルタイム更新を配信しています。視聴者はオンデマンドで包括的なニュース報道と分析にアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. The platform delivers real-time updates on major stories as they develop. Viewers can access comprehensive news reporting and analysis on demand.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "最高裁判所長官がホワイトハウス舞踏室の建設継続を許可", "title_en": "Supreme Court Chief Justice Allows White House Ballroom Construction to Proceed", "summary_ja": "ジョン・ロバーツ最高裁判所長官は、ホワイトハウスのボールルーム改修工事を中止していた下級審の判決の行政的な一時差し止めを発行しました。この一時差し止めにより、法的手続きが継続される間も建設作業は続行されます。ロバーツ長官の決定は、プロジェクトをブロックしていた以前の裁判所の判決を一時的に無効にしています。", "summary_en": "Chief Justice John Roberts has issued an administrative stay of a lower court order that had halted construction on a White House ballroom renovation project. The stay allows the construction work to continue while legal proceedings continue. Roberts' decision temporarily overrides the previous court ruling that had blocked the project.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/supreme-court-chief-justice-allows-construction-white-house/story?id=135846623", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権、リベリアへの大規模強制送還開始 1,200人の移民を対象", "title_en": "US Deports 20 People to Liberia Under Trump's 1,200-Person Migration Deal", "summary_ja": "米国はトランプ政権の移民政策の一環として、20人の強制送還者をリベリアに送還した。この第三国強制送還協定では最大1,200人がリベリアに送られる予定である。米国はリベリア国民のビザ有効期間を延長し、1億2,400万ドルの援助を約束した。人権団体は、この政策が亡命希望者を事実上本国に強制送還するための法的抜け穴として機能していると批判している。", "summary_en": "The United States has deported 20 people to Liberia as the first installment of a major third-country deportation agreement that will send up to 1,200 migrants to the West African nation. Under the arrangement, the US extended visitor visas for Liberians and pledged $124 million in assistance. Critics argue the Trump administration uses such deals as a legal loophole to indirectly force asylum seekers back to their home countries, citing cases where deportees faced safety risks and ultimately returned home anyway.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/20/liberia-deportation-agreement", "state_media": false, "category": "社会", "full_text": "Twenty deportees from the United States arrived in Liberia on Thursday, as part of a new agreement that will see the west African country receive as many as 1,200 people under the Trump administration’s immigration crackdown.\nThe group arrived at the Roberts international airport outside the capital, Monrovia. The Liberia-US agreement is one of the largest third-country deportation arrangements pursued by the administration since Trump returned to office last year.\nThe Liberian information minister, Jerolinmek Piah said the 1,200 deportees will include African nationals as well as nationals from North America, South America and the Caribbean.\nDuring a briefing on Tuesday, Liberia’s justice minister, Natu Oswald Tweh, said that the majority of the deportees had committed migration-related violations and offenses, and that they could seek asylum in the west African country if they wished.\nThe US has agreed to extend visitor visas for Liberians from 12 to 36 months and pledged $124m in assistance as part of the arrangement.\nUnder a series of often-secret agreements, the Trump administration has deported thousands of people to nearly two dozen countries that are not their own, advocates say, with about 10 of them in Africa. A new report by Refugees International and Human Rights First say the Trump administration has reached deals with at least 35 countries and has sent roughly 23,000 people to 26 of them as of early August, and makes the Liberia agreement the largest single arrangement so far.\nImmigration lawyers have said the Trump administration uses deportations to third countries as a legal loophole to indirectly force asylum seekers back to their home countries.\nIn many cases, migrants are deported to countries they have never been to or where they face safety risks and are left with little choice other than to return to the home countries they were fleeing from.\nA February report by Senate foreign relations committee Democrats found the Trump administration had paid more than $32m to five governments, several with poor human rights records, to accept about 300 third-country deportees – including $1.1m per person to Rwanda for seven deportees, and $7.5m to Equatorial Guinea for 29, a sum exceeding all US aid to that country over the previous eight years.\nThe report found more than 80% of those sent to third countries had since returned home anyway, often at further cost to taxpayers, and cited cases where deportees with US court-ordered protections were removed to Ghana and Equatorial Guinea before being sent onward within days.\nThe state department disputed the report’s characterization of its enforcement record.\nThe Associated Press contributed reporting", "translation_ja": "", "vocab": [{"word": "third-country deportation", "definition": "第三国への強制送還を意味する。申請者の本国ではなく、別の第三国へ亡命希望者を送る政策的手段。"}, {"word": "loophole", "definition": "法律や規則の抜け穴。規制を回避するために利用される技術的な欠陥や不備。"}, {"word": "asylum seeker", "definition": "亡命希望者。自国での迫害や危険から逃れるため、別国での庇護を求める者。"}, {"word": "arrangement", "definition": "協定や取り決め。複数の当事者間で合意された正式な合意事項。"}, {"word": "enforcement", "definition": "法律や規則の施行。政府機関が法律を強制的に実行するプロセス。"}, {"word": "characterization", "definition": "特性付けや描写。何かをどのように説明し、表現するかの方法。"}]}, {"title_ja": "中央アフリカ共和国の採金鉱山が崩落、100人以上が死亡", "title_en": "Over 100 Dead After Artisanal Goldmine Collapses in Central African Republic", "summary_ja": "中央アフリカ共和国の小規模採金鉱山が火曜日に地滑りにより崩落し、100人以上が死亡した。ザンボイェ村での事故で地下坑道が陥没し、中央アフリカとカメルーンの鉱夫が埋まった。当局は救助活動を続けているが、生存者が見つかる可能性は低いと述べている。", "summary_en": "More than 100 people have died after an artisanal goldmine in the Central African Republic collapsed due to a landslide on Tuesday. The incident occurred in the village of Zamboye when underground tunnels caved in, burying miners from CAR and Cameroon. Rescue efforts are ongoing, though authorities say finding survivors would be unlikely.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/20/gold-mine-collapse-deadly-landslide-central-african-republic", "state_media": false, "category": "IT", "full_text": "More than 100 people have died after an artisanal goldmine at a small village in western Central African Republic (CAR) caved in due to a landslide, local officials and aid workers said on Wednesday.\nThe landslide happened on Tuesday afternoon in the village of Zamboye, about 50km (31 miles) from the town of Baboua and close to the border of Cameroon. Footage on social media appeared to show an avalanche of sand descend on a group of people, likely the miners, and cover them.\nA statement by a local public prosecutor said many others were trapped under the deluge. It did not mention the number of fatalities. However, Gervais Ganagoroh, a Red Cross volunteer involved in the relief effort, told the Associated Press news agency on Wednesday that more than 100 bodies had been recovered from the collapse and a senior official at a local mining association confirmed that number to Reuters.\nLocal media in CAR reported that authorities had launched an investigation into the incident. A second prosecutor from Baboua told the press that the incident is believed to have been caused by “the collapse of several underground tunnels in which miners were operating”.\n“The ground completely collapsed and buried people,” Cedric Mbango, a miner at the site, told the AFP news agency, describing the incident as “catastrophic”.\nRescuers are racing to retrieve the bodies of victims and find survivors among the miners, believed to be nationals of CAR and Cameroon. Authorities in Cameroon’s Eastern region said at least three of its citizens have been identified as victims in the incident.\nGrégoire Mvongo, the region’s governor told state-owned radio on Wednesday that he was “working in close collaboration with our Central African colleagues to deal with the aftermath of this tragedy”.\nBertrand Be Yangué, a member of the Zamboye youth council, said that “finding them alive would be a miracle.” He added: “We are saddened and heartbroken to see young men and women perish after coming to the mines to save their families from despair.”\nThe toll is expected to rise as the rescue efforts continue, added Yangué.\nThe Central African news website Corbeau News reported that heavy machinery, including tractors, was being used in the retrieval mission and could jeopardise the rescue of those still alive under the landmass.\nThe exact number of people who were in the mine at the time of the cave-in remains unknown.\nSmall scale artisanal mines are common in different parts of Africa, despite regulations criminalising them, as unemployment continues to drive able-bodied men to abandoned or unused mines, to eke a living. The mining sites often operate with weak safety standards leading to repeated incidents: at least 40 people have died in several mining incidents in CAR this year alone.", "translation_ja": "", "vocab": [{"word": "artisanal", "definition": "小規模で伝統的な方法で行われる産業を指す。特に鉱業や漁業で、企業的ではなく個人や小グループが手作業で行う活動を説明する際に用いられる。"}, {"word": "deluge", "definition": "大量の流入や押し寄せることを意味する。ここでは砂や土砂が一気に押し寄せることを表現している。"}, {"word": "jeopardise", "definition": "危険にさらす、危機的な状況に置くという意味。救助活動が重機の使用によって危険にさらされることを説明する。"}, {"word": "eke", "definition": "わずかに生活する、困難な中で何とか生活をやりくりするという意味の動詞。経済的に苦しい状況を表現する。"}, {"word": "tolls", "definition": "死傷者数や被害の総数を示す。特に災害や事故による人命喪失の数量を表現する際に使用される。"}]}, {"title_ja": "ケニアのサファリヘリコプター墜落で7人死亡、米国人5人を含む", "title_en": "Seven killed in safari helicopter crash in Kenya, including five Americans", "summary_ja": "ケニア北部で水曜日の朝、サファリ用ヘリコプターが墜落し、乗客7人全員が死亡した。死者にはフロリダのテレムンド放送局の社長ホセ・スアレス氏とエクアドル国家情報局長ミケーレ・センシ・コントゥギ氏が含まれている。ユーロコプター EC130 B4型機がマウント・オロロクウェ近郊の遠隔地でチャーター便を運航中に墜落した。", "summary_en": "A safari helicopter crashed in northern Kenya on Wednesday morning, killing all seven people onboard including five US citizens. Among the dead were José Suárez, president of Telemundo stations in Florida, and Michele Sensi-Contugi, director of Ecuador's national intelligence service. The Eurocopter EC130 B4 was operating a charter flight in a remote area near Mount Ololokwe when it crashed.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/19/kenya-helicopter-safari-crash", "state_media": false, "category": "社会", "full_text": "Seven people, including five Americans, were killed when a safari helicopter crashed on Wednesday morning in a remote part of northern Kenya, according to local police and the state department.\nAmong the dead were an executive with Telemundo, the US-based Spanish-language network owned by NBC Universal, and the director of Ecuador’s national intelligence service.\nThe helicopter crashed at 9.13am while flying from the Loisaba Conservancy to the Ewaso Nyiro area in Samburu county, according to the Kenya Civil Aviation Authority, which said in a statement that an investigation was under way. It said there were seven people onboard – six passengers and the pilot.\nLate on Wednesday, David Nkoroi, the police commander for Samburu, told reporters that all seven people onboard had died.\nIn Washington, the state department said five of those killed were US citizens. “The US embassy is in touch with local authorities and is providing consular assistance,” it said. “We extend our deepest condolences to the families and loved ones on their loss.”\nThe identities of the victims were not revealed but a local television station in Miami, Florida, said that José Suárez, 55, president and GM of several Telemundo stations in Florida, was among those killed.\n“We are heartbroken to learn the tragic news that José was killed in a helicopter accident in Kenya,” the NBC affiliate in Miami quoted from a joint statement from NBC Universal and Telemundo leadership.\nThe helicopter crashed in a rugged area in the foothills of Mount Ololokwe, a popular tourist destination in the country, local media reported. The helicopter, owned by local company Lady Lori Helicopters, was carrying guests with the travel company +Beyond.\nLady Lori Helicopters said in a statement that the aircraft was operating a charter flight when it crashed.\nTropic Air Kenya, a local safari operator, said in a statement that it dispatched two of its helicopters to aid search and rescue operations.\nThe aviation authority said the aircraft was a Eurocopter EC130 B4.\nEcuador confirmed later on Wednesday that Michele Sensi-Contugi, director of the country’s national intelligence center, died in the helicopter crash in Kenya.\nIn a statement posted on X, the presidency said: “In this moment of deep sorrow, the government extends its heartfelt condolences to his family, loved ones and close associates.”\nSensi-Contugi was visiting Kenya as a tourist with his wife, Stephany Hollihan Vasconez, who also died in the crash. She was a US and Ecuadorian citizen. They are survived by their two children.\nHelicopter crashes have happened with increasing regularity in Kenya, which has a thriving tourism industry that depends on domestic carriers to ferry visitors to distant places like Mount Ololokwe.\nIn February, a legislator was among six people who died after a helicopter crash in a hilly area of western Kenya.", "translation_ja": "", "vocab": [{"word": "conservancy", "definition": "野生動物や自然を保護・保全する目的で設立された土地区域。観光と保全を兼ねる施設を指すことが多い。"}, {"word": "consular assistance", "definition": "領事館が提供する国民への支援サービス。海外での事件や災害時に市民を援助する外交機能。"}, {"word": "charter flight", "definition": "特定の客や団体のために専用で運航される航空便。通常の定期便ではなく個別にレンタルされる。"}, {"word": "thriving", "definition": "繁栄している、急速に成長している。ビジネスや産業が成功して栄えている状態を表す。"}, {"word": "domestic carriers", "definition": "国内航空会社。国内の旅客輸送を主たる業務とする航空運送事業者。"}, {"word": "rugged", "definition": "険しい、凹凸に富んだ。地形が複雑で移動が困難な様子を表す。"}]}, {"title_ja": "チュニジアの抗議者がカイス・サイード大統領の辞任を要求", "title_en": "Tunisian Protesters Demand President Kais Saied's Resignation", "summary_ja": "木曜日、数百人のチュニジア人が首都で大統領の権力放棄を要求するデモを展開しました。抗議者は停電と生活費の急騰に対する不満を表明しました。このデモは新興野党勢力であるナファス運動によって組織されました。", "summary_en": "Hundreds of Tunisians demonstrated in the capital on Thursday, demanding that President Kais Saied step down from power. The protesters expressed grievances over power outages and soaring living costs. The march was organized by Nafas Movement, an emerging opposition coalition.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/21/tunisian-protesters-call-for-president-kais-saied-to-step-down?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Tunisian protesters call for President Kais Saied to step down\nNewsFeed\nTunisian protesters call for President Kais Saied to step down\nHundreds of Tunisians took to the streets of the capital Tunis on Thursday, calling for president Kais Saied to leave power. The protesters denounced power cuts and the rising cost of living. The march was organised by Nafas Movement, a new opposition group.\nPublished On 21 Aug 2026", "translation_ja": "", "vocab": [{"word": "denounce", "definition": "批判する、非難することを公に表明すること。政治的な文脈でよく使用されます。"}, {"word": "opposition group", "definition": "与党に対抗する政治団体。政治的権力に反対する組織を指します。"}, {"word": "power cuts", "definition": "電力供給の遮断。予定されたまたは予期しない停電のこと。"}, {"word": "rising cost of living", "definition": "生活費の上昇。商品やサービスの価格が増加し、生活が高くなること。"}, {"word": "took to the streets", "definition": "街頭でデモや抗議活動を行うこと。大衆が公開の場で意思表示すること。"}]}, {"title_ja": "ソマリアの人道的危機は回避できるか?", "title_en": "Can a Humanitarian Disaster Be Averted in Somalia?", "summary_ja": "ソマリアは干ばつ、紛争、国内避難民により約600万人が飢饉の危機に直面しており、数年間で最も深刻な食糧危機に見舞われている。世界食糧計画は、30年以上の不安定性と国際援助資金の削減により、状況がさらに悪化していると警告している。", "summary_en": "Somalia faces a severe hunger crisis with approximately six million people at risk of starvation due to drought, conflict, and displacement. The World Food Programme warns of the worst food security situation in years, complicated by three decades of instability and recent cuts to international aid funding.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/inside-story/2026/8/21/can-a-humanitarian-disaster-be-averted-in-somalia-2?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Inside Story\nCan a humanitarian disaster be averted in Somalia?\nThe UN warns of another hunger crisis, with millions at risk of starvation\nSomalia is yet again unable to feed its people, with about six million facing high levels of hunger on a scale not seen in years.\nThe World Food Programme (WFP) says a combination of drought, conflict and displacement means many Somalis are not getting enough to eat.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Clashes between government and opposition fighters in Somalia’s Baidoa\n- list 2 of 3Thousands flee drought in Somalia amid sharp aid decline\n- list 3 of 3Somali army clashes with rebel forces for control of key city Baidoa\nInstability has complicated aid delivery for more than three decades, with the situation now worsened by severe cuts in international aid.\nThe WFP says it has only a fraction of the funding needed to provide assistance.\nSo, what are the consequences for Somalia?\nPresenter: James Bays\nGuests:\nSamira Gaid – Founding director of Balqiis Insights, a think tank focusing on the Horn of Africa\nMohamed Abdi – Country director for Somalia at the Norwegian Refugee Council\nOmar Mahmood – Senior analyst for Somalia at the International Crisis Group", "translation_ja": "", "vocab": [{"word": "avert", "definition": "危機や災害などの悪い事態が起きることを防ぐ、回避する。\"avert a disaster\"で災害を回避するという使われ方が一般的です。"}, {"word": "humanitarian", "definition": "人道的な、人類の福祉に関する。人命救助や人権保護などを目的とした活動や組織に用いられます。"}, {"word": "displacement", "definition": "強制的な移住、立ち退き。紛争や災害により人々が居住地から追い出されることを指します。"}, {"word": "starvation", "definition": "飢餓、食糧不足による飢え。深刻な食糧危機の状況を表します。"}, {"word": "complication", "definition": "複雑さ、困難な状況。問題が複数の要因が絡み合うことで、より解決が難しくなることを意味します。"}, {"word": "fraction", "definition": "ほんの一部、わずかな量。\"only a fraction of funding\"で必要な資金のほんの一部しかないという意味です。"}]}, {"title_ja": "教皇レオ14世、ガザ再建への世界的支援を呼びかけ", "title_en": "Pope Leo XIV Calls for Global Support in Gaza Reconstruction", "summary_ja": "教皇レオ14世は、依然として深刻な苦難に直面しているガザの人々を支援するよう世界中の当局に呼びかけた。教皇は同地域の再建事業への国際的支援を促している。", "summary_en": "Pope Leo XIV has appealed to world authorities to assist the people of Gaza, who continue to face severe suffering. The pontiff is urging international support for reconstruction efforts in the region.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/21/pope-leo-urges-the-world-to-help-begin-reconstruction-of-gaza?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Pope Leo urges the world to 'help begin reconstruction' of Gaza\nNewsFeed\nPope Leo urges the world to ‘help begin reconstruction’ of Gaza\nPope Leo XIV is appealing to authorities around the world to support the people of Gaza who are ‘still suffering greatly’ and to help begin reconstruction efforts.\nPublished On 21 Aug 2026", "translation_ja": "", "vocab": [{"word": "appeal", "definition": "強く訴えかけたり、懇願したりすること。公的な立場から社会や権力者に対して要求や支援を求める行為。"}, {"word": "reconstruction", "definition": "破壊または損傷した物、施設、社会などを再び建設・復興すること。通常、戦争や自然災害後の復興事業を指す。"}, {"word": "authorities", "definition": "公式な権限を持つ機関や指導者のこと。政府、行政機関、または統治権を持つ団体を意味する。"}, {"word": "suffering", "definition": "身体的または精神的な苦痛や苦難を経験すること。個人または集団が困難な状況で耐えている状態。"}, {"word": "pontiff", "definition": "ローマカトリック教会の最高指導者であるローマ教皇のこと。宗教的および精神的権威を持つ立場。"}]}, {"title_ja": "イスラエル入植者がパレスチナ人少年を殺害、ヨルダン川西岸での衝突激化", "title_en": "Israeli settlers kill Palestinian teen in West Bank clash amid escalating violence", "summary_ja": "パレスチナの少年カリム・サナド・ラジャ・シャラルデが、ヨルダン川西岸での投石事件に続いてイスラエル入植者に殺害された。同時に、58歳のパレスチナ人男性がジェニンでのイスラエル軍の夜間作戦中に銃撃されて殺害された。ヨルダン川西岸の暴力は大幅にエスカレートしており、今年はイスラエル入植者と兵士による約1,500件の攻撃で少なくとも87人のパレスチナ人が殺害されている。", "summary_en": "A Palestinian teenager, Karim Sanad Raja Shalaldeh, was killed by Israeli settlers on Friday following a rock-throwing incident in the occupied West Bank. Separately, a 58-year-old Palestinian man was fatally shot by Israeli forces in Jenin during an overnight operation. Violence in the West Bank has escalated significantly, with at least 87 Palestinians killed in nearly 1,500 attacks by Israeli settlers and soldiers this year.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/settlers-kill-palestinian-teen-in-west-bank-clash-and-other-middle-east-developments/article71374973.ece", "state_media": false, "category": "経済", "full_text": "A Palestinian teenager was killed by Israeli settlers on Friday (August 21, 2026) after a rock-throwing incident in the occupied West Bank.\nThe Ministry identified the teenager as Karim Sanad Raja Shalaldeh. The teenager's father told The Associated Press at the hospital that Israeli settlers had killed his son.\nThe Israeli military said soldiers were dispatched to Sa'ir after Palestinians threw rocks at Israeli civilians who were in the area without prior authorisation. Some Israelis were injured and a security official opened fire.\nSeparately, the Palestinian General Authority for Civil Affairs informed the Health Ministry that 58-year-old Fathi Khazem was fatally shot by Israeli forces early Friday in Jenin.\nAn Israeli army official speaking on condition of anonymity in line with military rules said Khazem attempted to stab an Israeli soldier during an overnight operation. No Israeli soldiers were injured.\nViolence has escalated in the West Bank where at least 87 Palestinians have been killed in almost 1,500 attacks by Israeli settlers and soldiers this year, according to Palestinian officials.\nPublished - August 21, 2026 10:02 pm IST", "translation_ja": "", "vocab": [{"word": "escalated", "definition": "段階的に悪化または高まったという意味。紛争や危機が徐々に深刻さを増す状況を表す。"}, {"word": "fatally", "definition": "致命的に、死をもたらすという意味で使用される副詞。重大な結果をもたらす行為を描写する。"}, {"word": "dispatched", "definition": "急いで派遣または送出されたという意味。軍隊や職員を迅速に特定の場所へ向かわせることを示す。"}, {"word": "authorized", "definition": "公式の許可を得た、認可されたという意味。適切な権限による正当な承認があることを表す。"}, {"word": "overnight operation", "definition": "夜間に実行される軍事作戦のこと。秘密性や奇襲効果を重視した作戦活動を指す。"}]}, {"title_ja": "イランが米国の経済脅迫に「壊滅的な」対抗を誓約", "title_en": "Iran Vows 'Devastating' Response to U.S. Economic Threats", "summary_ja": "イランは米国財務長官スコット・ベッセント氏が発表した新たな制裁に対して、広範で決定的な対抗を誓うとともに、軍幹部が「粉砕的かつ壊滅的な」反撃を警告した。トランプ政権はイラン指導部を標的とした史上最厳しい金融制裁を課す計画である。イラン議会議長はこの措置を経済的・心理的戦争と呼びながら、軍事およびサイバー領域全体での準備強化を強調した。", "summary_en": "Iran has pledged a broad and decisive response to new U.S. sanctions announced by Treasury chief Scott Bessent, with military officials warning of 'crushing and devastating' reactions. President Trump's administration plans to impose the harshest financial penalties in history targeting Iranian leadership. Iran's Parliament Speaker called the measures economic and psychological warfare while emphasizing preparations across military and cyber domains.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-vows-devastating-response-as-us-threatens-toughest-ever-economic-hit/article71374981.ece", "state_media": false, "category": "経済", "full_text": "Iran said on Friday (August 21, 2026) that its response to any new U.S. threats would be \"devastating\" after Washington pledged to impose the toughest financial penalties in history with the aim of toppling the Iranian leadership.\nU.S. Treasury chief Scott Bessent said he would give details on Monday of the planned sanctions, which follow a warning from President Donald Trump of economic consequences against any country that provided \"any type of lifeline to Iran.\"\nThe chief of staff of Iran's Armed Forces, Major General Ali Abdollahi, said the Islamic Republic's reaction would be broad and decisive.\n\"With preparedness across land, sea, air, air defence and cyberspace, Iran's armed forces will respond to the enemy's new threats with crushing, punishing and devastating responses,\" Abdollahi was quoted as saying by Iranian media.\nIran's Parliament Speaker, Mohammad Baqer Qalibaf, the country's main negotiator in mediated talks with the United States, said Washington appeared to have concluded it could not prevail in its direct military confrontation.\n\"We must make plans to deal with the unjust sanctions so that we can overcome them,\" he said in neighbouring Iraq, accusing the U.S. and Israel of resorting to what he said was economic and \"cognitive\" warfare.\nPublished - August 21, 2026 09:59 pm IST", "translation_ja": "", "vocab": [{"word": "sanctions", "definition": "ある国や個人に対する経済的・政治的な制裁。違法行為や条約違反に対する罰として課される。"}, {"word": "pledged", "definition": "正式に約束する、誓う。政治的・法的な文脈で厳粛な約束を表す。"}, {"word": "prevail", "definition": "優位に立つ、勝利する。特に競争や対立の中で勝つことを意味する。"}, {"word": "cognitive", "definition": "認識・認知に関連した。心理的・知的な操作や戦略を指すことが多い。"}, {"word": "mediated talks", "definition": "第三者の仲介者を通じた交渉。直接対話ではなく仲介者が両者の間に入って進行する協議。"}, {"word": "consequential", "definition": "重大な結果をもたらす、重要な。行為や決定が大きな影響を与えることを示す。"}]}, {"title_ja": "日本、係争地域での露ミサイル実験に抗議", "title_en": "Japan Protests Russian Missile Tests Off Disputed Islands", "summary_ja": "日本は1945年にロシアに占領された係争地のクリル諸島沖でのロシアのミサイル実験に対して正式な抗議を提出した。ロシア太平洋艦隊は、300キロ以上離れた場所にある敵艦を模擬した攻撃訓練を実施したと述べた。この事件は2022年のロシアのウクライナ侵攻以来、日本とロシアの関係の悪化を反映しており、日本はモスクワに対するG7制裁に参加している。", "summary_en": "Japan lodged a formal protest against Russia's missile tests conducted off the disputed Kuril Islands, which Russia seized in 1945. Russia's Pacific Fleet stated it carried out exercises simulating attacks on enemy ships located over 300 kilometers away. The incident reflects deteriorating Japan-Russia relations since Russia's invasion of Ukraine in 2022, with Japan joining G7 sanctions against Moscow.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/japan-protests-russian-missile-tests-off-disputed-islands/article71374967.ece", "state_media": false, "category": "政治", "full_text": "Japan said Friday (August 21, 2026) it had protested against Russia's notification that Moscow would conduct missile tests off disputed islands visited by President Vladimir Putin earlier this month.\nBilateral relations have long been dogged by the Kuril islands, known in Japan as the Northern Territories and seized in 1945 by the Soviet Union which then expelled the Japanese population.\n\"We lodged a protest in response to the notification about the plan to conduct a missile test\" off the islands, a Japanese government spokesman told AFP.\nRussia's Pacific Fleet said Thursday (August 20, 2026) it had already conducted the missile test, although it was unclear when it took place.\n\"During planned exercises, Pacific Fleet forces carried out a missile strike against targets off the coast of the Southern Kuril Islands. The targets simulated enemy ships and were located at a distance of more than 300 kilometres,\" the naval fleet said in a statement.\nTies between Japan and Russia have worsened since the full-scale conflict in Ukraine began in 2022.\nJapan has joined other G7 countries in sanctioning Moscow and aiding Kyiv.\nPublished - August 21, 2026 09:56 pm IST", "translation_ja": "", "vocab": [{"word": "lodged a protest", "definition": "公式な不満や異議を正式に提出すること。外交交渉において、一国が他国の行動に対して正式な異議を唱える際に使用される表現。"}, {"word": "bilateral relations", "definition": "二国間の外交関係のこと。国家間の相互的な関係や協力を指す。"}, {"word": "seized", "definition": "武力や権力によって領土や財産を奪い取ること。歴史的な領土紛争の文脈でよく使用される。"}, {"word": "dogged", "definition": "継続的に悩ます、または妨害し続けるという意味。問題や困難が長く続く状況を表す。"}, {"word": "expunged", "definition": "記録から削除する、または抹消すること。この文では追放を意味する過去形で、人口が強制的に排除されたことを指す。"}, {"word": "Pacific Fleet", "definition": "ロシアの太平洋地域の海軍組織。国の軍事力の一部を構成する地域別の海軍司令部。"}]}, {"title_ja": "マーク・カーニーがトランプ大統領への譲歩を検討か＝分析", "title_en": "Mark Carney May Make Unwise Concession to Trump: Analysis", "summary_ja": "カナダの元中央銀行総裁マーク・カーニーが米国大統領トランプとの交渉でカナダの利益に悪影響を与える可能性のある譲歩を検討しているかどうかについて、ジャスティン・リングが分析している。貿易および経済政策交渉における潜在的な妥協の懸念が提起されている。", "summary_en": "Justin Ling examines whether Mark Carney, Canada's former central banker, is considering concessions to U.S. President Trump that could prove detrimental to Canadian interests. The opinion piece raises concerns about potential compromises in trade or economic policy negotiations.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikgJBVV95cUxPTDhHS2prN29PTlZJQWtOcjBEeWR1MC05U1RXQU5QX0JKT0NhVUF3ZmJlNzVMS3pyNDNhV095VUxpaEt1dnBWaW15RmlTcEhTVzVycHFMTGhrNmRraWdnNVR0MTIzQnZpOE8wYkczT0lRWFctQUtra1QzSVFZVGp5QUlUWXV5dEplZzQ1UUh5YzhNX3poVEgwYWM0RkxvbHV6QlVtUHlEeVN6S3Fyakk4QnRCSWZIT2pHNHd1NWJLW 初期調査に端を発しています。", "summary_en": "President Bola Tinubu has suspended three permanent secretaries and ordered the arrest of George Buchi Nwabueze following the discovery of a fraudulent National Brands Development agency operating within the Office of the Secretary to the Government of the Federation. The ICPC chairman revealed that Nwabueze operated under multiple name variations and that investigations uncovered three fake agencies in total. The probe stemmed from initial investigations into the alleged fictitious Presidential Foreign Investment Promotion Council.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/headlines/904543-tinubu-suspends-three-permanent-secretaries-over-fresh-fake-agency-orders-alleged-promoters-arrest.html", "state_media": false, "category": "政治", "full_text": "President Bola Tinubu has ordered the suspension of three permanent secretaries over the discovery of a new fake agency.\nThe phoney agency, known as the National Brands Development and Made in Nigeria Special Project Office, was said to be operating within the Office of the Secretary to the Government of the Federation.\nThe suspected permanent secretaries are M.S. Danjuma, Nadungu Gagare, and Richard P. Pheelangwah.\nThe president also ordered the immediate arrest of the alleged promoter of the fake agency, George Buchi Nwabueze.\nThe chairman of the Independent Corrupt Practices and Other Related Offences Commission (ICPC), Musa Aliyu, who disclosed the developments to State House correspondents on Friday, said Mr Nwabueze “was discovered to also operate under four other variations of names.”\nThe four other name variations are “George Nathan, George Nathan Nwabueze, Hon. George Buchi Nwabueze, Prince Geroge Buchi Nwabueze and George Nwabueze.”\n“I have briefed Mr President comprehensively on these new developments. ICPC will continue with its investigations,” the ICPC chairman said.\nThe discovery of the new fake agency was an offshoot of ICPC’s investigations into the alleged fictitious Presidential Foreign Investment Promotion Council (PFIPC).\nThe ICPC chair had disclosed after briefing President Tinubu on 6 August on the commission’s interim report that the probe discovered two additional fake agencies.\nALSO READ: Fake Agency Probe: State House denies authorising council creation, FRSC admits number plate issuance\nMr Aliyu said he submitted the interim report on 6 August, exactly 30 days after the President ordered a probe into the matter.\nMr Aliyu said the commission recommended the prosecution of the self proclaimed Director-General of the organisation, Adeniyi Adeyemi, over alleged forgery, impersonation and related offences.\n… more details later\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "phoney", "definition": "偽りの、詐欺的なという意味の形容詞。本来は電話（telephone）の俗語的用法に由来し、信頼できない、本物ではないものを指す場合に使用されます。"}, {"word": "impersonation", "definition": "他人になりすまし、身分詐称することを意味する名詞。法律用語として詐欺や犯罪行為に該当することが多いです。"}, {"word": "interim report", "definition": "調査や事業の途中経過を報告する中間報告書のこと。最終的な結果ではなく、暫定的な段階での報告を指します。"}, {"word": "fictitious", "definition": "架空の、創作の、実在しないという意味の形容詞。特に法律や行政文脈では、偽造された存在しない組織や個人を指す場合に使用されます。"}, {"word": "offshoot", "definition": "派生物、副産物、または分枝を意味する名詞。ある事柄から発生した関連する別の事項を指します。"}, {"word": "forgery", "definition": "文書や署名などを偽造する行為、または偽造品のこと。重大な犯罪に該当する法律用語です。"}]}, {"title_ja": "クワラ州上院議員、APC離脱数時間後にPDP公認を獲得", "title_en": "Kwara Senator Switches to PDP Hours After Quitting APC", "summary_ja": "クワラ中央地区の上院議員サリウ・ムスタファ氏は与党APCから離脱し、数時間後にPDPの上院議員公認を獲得しました。同氏は党内の不公正な選挙プロセスを理由に党への信頼喪失を表明しており、同じ上院議席を目指すアブドゥルラフマン・アブドゥルラザク知事との直接対決が実現します。", "summary_en": "Senator Saliu Mustapha of Kwara Central resigned from the ruling APC party and immediately secured the PDP's senatorial ticket, citing lost confidence in the party's leadership due to unfair primary processes. His defection follows months of internal party conflict over candidate selection and sets up a direct contest with Governor AbdulRazaq, who is seeking the same senate seat on the APC platform.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/904540-kwara-senator-picks-pdp-ticket-hours-after-quitting-apc.html", "state_media": false, "category": "政治", "full_text": "Senator Saliu Mustapha of the Kwara Central District has picked the Peoples Democratic Party (PDP) ticket for the district, hours after resigning from the All Progressives Congress (APC).\nMustapha received the PDP senatorial ticket on Friday from the party’s Kwara State Chairman, Issa Bawa, formally making him the party’s candidate for the Kwara Central senatorial election in 2027.\nThe development follows his resignation from the APC amid a prolonged crisis within the ruling party in Kwara State.\nMustapha had run for the APC governorship ticket. Still, the party decided to give the ticket to the state’s northern senatorial district, eventually nominating the state House of Assembly speaker, Yakubu Danladi-Salihu.\nThe ruling party also nominated Governor AbdulRahman AbdulRazaq as its senatorial candidate for the central district.\nMustapha announced his resignation on Thursday through statements shared on his verified social media handles.\nIn his resignation letter dated 14 August and addressed to the APC Ward Chairman of Gambari Ward 1 in Ilorin East Local Government Area, the senator said recent developments within the party, particularly under its leadership in Kwara, had eroded his confidence in the APC.\nHe said his decision followed weeks of consultations with his supporters, constituents and political stakeholders across the state.\nMustapha leaves APC\nMustapha said he joined the APC as a founding member because of his commitment to good governance, unity, and service to the people.\nHe, however, said the party’s leadership in Kwara had departed from the principles of unity and internal democracy on which the
