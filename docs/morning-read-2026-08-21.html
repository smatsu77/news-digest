APC was founded.\n“I believe political leadership must be anchored on integrity, competence, accountability, and a sincere commitment to the collective interest of the people,” he said.\n“The current leadership of the party in Kwara State has fallen short of these standards, and this has eroded my confidence.”\nThe senator also assured his supporters that leaving the APC would not affect his commitment to Kwara Central and the state.\n“To my constituents, supporters, political associates and stakeholders in Kwara State and beyond, I assure you that while my political platform may change, my principles, purpose, and commitment to the people remain unchanged,” he said.\nHis resignation came after months of disagreement between him and other aggrieved APC stakeholders, as well as the party’s leadership in the state.\nFrom APC’s crisis to PDP’s\nPREMIUM TIMES had earlier reported the growing tension within the Kwara APC following the party’s governorship primary and the subsequent controversy over its National Assembly candidates.\nMustapha was among the prominent aspirants who contested the APC governorship ticket but lost to Danladi-Salihu.\nGovernor AbdulRazaq is the APC candidate for the Kwara Central Senatorial District.\nThe developments fuelled speculation about Mustapha’s next political move.\nHe was also part of the G15 coalition of aggrieved APC stakeholders, which rejected the outcome of the party’s primary and demanded intervention from President Bola Tinubu and the APC national leadership.\nMembers of the group, including Mustapha, Deputy Senate Leader Lola Ashiru and Senator Ibrahim Oloriegbe, had publicly criticised the process through which the party’s candidates emerged.\nAt one of the protests in Ilorin, Mustapha called on President Tinubu to intervene.\n“We are protesting because we are not happy with the way the party’s leadership handled the process that produced the candidates. We are not against anyone, but the process lacked fairness and inclusiveness,” he said.\nThe group had also warned that the internal crisis could undermine APC’s chances in the 2027 elections.\nDefection was expected\nThe senator’s move to the PDP did not come as a surprise.\nPREMIUM TIMES had previously reported the widening political options available to Mustapha and other members of the G15 as efforts to resolve the APC dispute appeared increasingly uncertain.\nThe PDP had also emerged as a possible platform for the senator to continue his political career after losing the APC governorship ticket and facing uncertainty about his senatorial seat.\nThe PDP’s decision to hand him its Kwara Central ticket now confirms those earlier political calculations.\nHis emergence also ends speculations over who would fly the PDP flag in the district.\nThe party had previously been linked with other possible candidates for the seat as political negotiations continued.\nFresh contest\nMustapha’s emergence sets up a direct contest with Gov AbdulRazaq, who is seeking the Kwara Central Senate seat on the APC platform after completing his second term as governor.\nThe contest is likely to attract significant attention because both men are prominent figures in Kwara politics and have previously operated within the same political platform.\nMustapha was elected to the Senate in 2023 on the APC platform.\nALSO READ: Kwara senator Saliu Mustapha resigns fr", "translation_ja": "", "vocab": [{"word": "defection", "definition": "政党や組織から別の政党や組織への移動。通常、政治家が別の党へ転籍することを指す。"}, {"word": "eroded", "definition": "信頼、価値、または支援が徐々に減少または弱まること。基盤が傷つけられた状態を表す。"}, {"word": "aggrieved", "definition": "不公正な扱いや不当な決定に対して不満や怒りを感じている状態。苦情を持つグループを指す。"}, {"word": "coalition", "definition": "共通の目標を達成するために一時的に結成される団体や政治グループの同盟。"}, {"word": "speculation", "definition": "確実な証拠なしに、事実や可能性について推測すること。将来の行動や決定についての憶測。"}, {"word": "senatorial", "definition": "上院（セネート）に関連する、または上院議員の地位に関する形容詞。"}]}, {"title_ja": "ナイジェリアのBPP、新指導部下で公共調達改革を深化", "title_en": "Nigeria's BPP Deepens Public Procurement Reform Under New Leadership", "summary_ja": "公共調達局（BPP）の新局長アデボワレ・アデドクン博士は、ナイジェリアの調達システムを変革し世界のベストプラクティスに合わせるため23の重要な改革を実施している。2025年以来、改善された価格情報と説明責任措置を通じて1.1兆ナイラの削減を達成した。BPPは透明性の制度化と持続可能な調達の専門大学プログラムの確立で国際的認識を得ている。", "summary_en": "The Bureau of Public Procurement (BPP) under Director-General Dr Adebowale Adedokun has implemented 23 major reforms to transform Nigeria's procurement system and align it with global best practices. Since 2025, the reforms have helped save ₦1.1 trillion through improved price intelligence and accountability measures. The BPP is gaining international recognition for institutionalizing transparency and establishing specialized university programs in sustainable procurement.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/904536-deepening-public-procurement-reform-how-bpp-and-perm-secs-are-resetting-governance-by-ismail-omipidan.html", "state_media": false, "category": "社会", "full_text": "Change is inevitable. But implementing it always meets resistance from within and outside. Since assuming office about two years ago, the Director-General of the Bureau of Public Procurement (BPP), Dr Adebowale Adedokun, FCIPS, has faced that resistance head-on with a reform agenda aimed at transforming Nigeria’s procurement ecosystem.\nHe came in at a time when confidence in the Bureau was low. It was gathered that before his appointment, President Bola Ahmed Tinubu had considered shutting down the BPP, noting that it had “outlived its usefulness.” The period leading to 2023 was widely described as an era of “anything goes” at the Bureau.\nThis was captured by former BPP DG, Dr Emeka Eze, at the inaugural edition of “The Procurement Evolution” in June this year. Dr Eze, now Chairman of the FCT Civil Service Commission and pioneer DG of BPP from 2007 to February 2016, said he was the subject of numerous petitions during his tenure for blocking improper benefits from the procurement system.\n“For nine years that I was DG, there were petitions flying everywhere. Fireworks everywhere. But after I left, for another eight years, no petitions, no fireworks,” Dr Eze said.\nHe added: “The moment the current DG (Dr Adedokun) resumed, I noticed the fireworks and petitions have resumed again. It means there is something we are doing right which some people do not want. After I left office, I met one of those behind the petitions and asked why he had gone quiet. He said, ‘You blocked us from chopping.’”\nLike every reformer, Dr Adedokun knows the journey demands courage, consistency, and collective resolve. Undeterred by naysayers, he has pressed ahead with reforms, backed by President Tinubu’s Renewed Hope Agenda.\nRe-engaging Permanent Secretaries\nTo align Ministries, Departments and Agencies (MDAs) with the reforms, the BPP revived the Permanent Secretaries’ Retreat after a four-year break.\nThe 2026 edition, themed “Strengthening Procurement Leadership and Accountability for Effective Budget Execution and National Development,” held from Thursday, July 9 to Sunday, 12 July 2026, at Four Points by Sheraton, Ikot Ekpene, Akwa Ibom State, was declared open by Vice President Kashim Shettima.\nAddressing participants, Dr Adedokun described public procurement as “one of the most powerful instruments of governance” and “the bridge between budget approval and service delivery.”\nHe disclosed that BPP has initiated 23 key reforms to align Nigeria’s system with global best practices. These include: Proposed amendment of the Public Procurement Act, 2007, Development of a National Procurement Strategy Framework, Revised procurement thresholds, Community-based procurement, Contractor classification and categorisation, Full rollout of Electronic Government Procurement (e-GP), and the Nigeria First Policy among others.\nHe also announced that BPP helped the Federal Government save about ₦1.1 trillion in 2025 through improved price intelligence and budget evaluation, with weekly savings averaging ₦8 billion since January 2026.\n“Roads are constructed through procurement. Hospitals are equipped through procurement. Schools are built through procurement. Therefore, the quality of procurement determines the quality of governance,” he said.\nStressing that Permanent Secretaries, as Accounting Officers, bear ultimate responsibility for compliance with the Act, Dr Adedokun said BPP has introduced administrative sanctions for erring procurement officers and a Debarment Policy to blacklist contractors who violate due process.\nHe urged MDAs to publish contract awards on their websites and the BPP portal, and to comply with circulars on budget implementation, contract variations, and agreements.\nDr Adedokun added that Nigeria’s reforms are gaining global recognition, citing the Sustainable Procurement, Environmental and Social Standards Enhancement Project (SPESSE) as an evidence. Under SPESSE, specialised undergraduate degrees in Sustainable Procurement have been established in six universities: Ahmadu Bello University, Zaria; University of Lagos; University of Benin; Abubakar Tafawa Balewa University, Bauchi; Federal University of Technology, Owerri; and Joseph Sarwuan Tarka University, Makurdi.\n“Development partners and multilateral institutions have acknowledged Nigeria’s strides in institutionalising transparency and accountability in public procurement under President Tinubu’s Renewed Hope Agenda,” he said.\n“A budget is a covenant with the people. But procurement leadership is how we keep the covenant. Countries are developed by spending rightly. Only an accountable procurement system can guarantee that,” the BPP DG, added.\nWhat Leaders Said\nRepresenting the Vice President, Prof Tunji Olaopa, Chairman of the Federal Civil Service Commission, said procurement is now “a strategic instrument for economic growth, a driver of industrial development, a tool for promoting local content, and a mechanism for ensuring value for money.”\n“It is an instrument", "translation_ja": "", "vocab": [{"word": "ecosystem", "definition": "相互に関連する要素の複合体を指す。ビジネスや技術分野では、複数の組織や技術が相互作用して機能する環境を意味する。"}, {"word": "accountability", "definition": "責任を負う義務のこと。特に公的機関や指導者が自らの行動と決定について説明責任を果たす必要がある状態を示す。"}, {"word": "debarment", "definition": "個人や企業を特定の活動や取引から除外することを指す。政府調達では、不正行為を行った業者を入札から排除する措置。"}, {"word": "due process", "definition": "法的手続きや規則に従って公正に実行される過程を意味する。権利が保護され、規定された手順が守られることを保証する。"}, {"word": "institutionalizing", "definition": "慣行や制度を組織の標準的な規則や手続きとして確立すること。システムの一部として永続的にする行為を指す。"}, {"word": "naysayers", "definition": "反対意見を述べる人々のこと。新しい計画やアイデアに対して否定的な立場をとる批評家や懐疑的な者を指す。"}]}, {"title_ja": "ジョルジャ・メローニ：政治的孤立から伊首相への道", "title_en": "Giorgia Meloni's Path From Political Outcast to Italian Leader", "summary_ja": "極右政治家ジョルジャ・メローニが、政治的に周辺化された存在からイタリア最安定の戦後政権を率いる可能性のある指導者へと至った政治的経歴について、稀なインタビューの中で振り返った。このインタビューは、彼女が「歴史の不快な側面」と自ら称する立場から主流政治の権力へとどのように進んだかを探っている。メローニの台頭はイタリア政治とヨーロッパの極右運動の重大な転換を示している。", "summary_en": "In a rare interview, Giorgia Meloni reflects on her political journey from being a marginalized figure to potentially leading Italy's most stable postwar government. The interview explores how the far-right politician navigated her way from what she describes as \"the uncomfortable side of history\" to mainstream political power. Meloni's rise represents a significant shift in Italian politics and European far-right movements.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/21/world/europe/italy-giorgia-meloni-interview-profile.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "77歳女性、無人機が飛び交う空の下9マイルを歩きウクライナの都市から脱出", "title_en": "77-Year-Old Woman Walks 9 Miles Through Drone-Filled Skies to Escape Ukrainian City", "summary_ja": "東部ウクライナのリマン市から脱出するため、77歳の女性が9マイルの道のりを徒歩で移動した。救助隊が危険性を理由に同市への進入を中止しているため、彼女は頭上を飛ぶ無人機をかい潜りながら、唯一の脱出経路となる危険な旅に出た。", "summary_en": "A 77-year-old woman trekked 9 miles on foot to escape Lyman, a city in eastern Ukraine that rescue teams no longer enter due to extreme danger. With drones overhead and no official evacuation routes available, she undertook a harrowing journey to flee what she described as 'hell.'", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/21/world/europe/ukraine-lyman-donetsk-donbas-russia.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国、イラン問題でのトランプ政権の経済的脅迫に対抗できると確信", "title_en": "China Believes It Can Counter Trump's Economic Pressure Over Iran", "summary_ja": "中国の分析家らは、北京がレアアース鉱物供給への支配力と十分な石油備蓄を活用することで、イランに関連する米国の経済的脅迫に対抗できると主張している。イラン産原油の喪失に耐える中国の能力と、米国の重要鉱物へのアクセスを制限する能力は、トランプ政権との潜在的な貿易紛争において交渉力を与えている。", "summary_en": "Chinese analysts argue that Beijing can resist U.S. economic threats related to Iran by leveraging control over critical mineral supplies and maintaining sufficient oil reserves. China's ability to withstand the loss of Iranian crude and constrain American access to essential minerals gives it negotiating leverage in potential trade disputes with the Trump administration.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/21/world/asia/china-iran-trump-economic-threats.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事制限を解除、パレスチナ人がガザ北部への帰還開始", "title_en": "Palestinians Return to Northern Gaza as Israel Lifts Military Restrictions", "summary_ja": "イスラエルは人質釈放交渉の膠着状態が打開された後、ガザを二分する軍事地帯の横断をパレスチナ難民に許可した。この措置は、数ヶ月間にわたってエンクレーブ北部へのアクセスを阻止していた制限の大きな転換を示唆している。数千人の住民が避難後の帰宅を開始している。", "summary_en": "Israel has allowed displaced Palestinians to cross a military zone that divides Gaza, following a breakthrough in hostage release negotiations. The movement marks a significant shift in restrictions that had prevented civilians from accessing the northern part of the enclave. Thousands of residents are beginning to return home after months of displacement.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産企業が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Real Estate Crisis", "summary_ja": "中国最大級の不動産開発企業であるVankeが巨額の損失を報告し、国内の不動産危機の深刻化への懸念が高まっている。大手企業の経営危機により、苦境に陥している不動産セクターを安定させるため中国政府が介入するかどうかについての議論が生じている。", "summary_en": "Vanke, one of China's largest property developers, has reported a significant loss, raising concerns about the deepening real estate crisis in the country. The financial troubles at the major developer have sparked questions about whether the Chinese government will intervene to stabilize the struggling sector.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による弾片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From October 7 Attack", "summary_ja": "解放されたイスラエル人女性の体から、10月7日の攻撃時の弾片がまだ埋め込まれたままであることが判明した。イスラエルの医療当局者によると、一部の人質は隔離状態で拘束され、8か月間トンネル内に閉じ込められていた。医学的知見は、初期攻撃で人質が被った深刻な負傷の実態を明らかにしている。", "summary_en": "Israeli women released from captivity were found to still have shrapnel embedded in their bodies from the October 7 attack. Some hostages were held in isolation and spent eight months confined in tunnels, according to Israeli medical officials. The medical findings highlight the severe injuries sustained by hostages during the initial attack.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "迎撃ミサイル不足が世界的なパニックを引き起こす", "title_en": "Interceptor Missile Shortage Spreads Alarm Globally", "summary_ja": "ウクライナと同盟国は、需要が供給を大幅に上回る中で、防空迎撃ミサイルの深刻な不足に直面している。この枯渇により、多くの人口が空中攻撃から保護されない状態に置かれる恐れがある。専門家は、この不足が進行中の紛争と地域安保に深刻な戦略的影響をもたらす可能性があると警告している。", "summary_en": "Ukraine and allied nations face a critical shortage of air defense interceptor missiles as demand far outpaces supply. The depletion threatens to leave vulnerable populations without protection against aerial attacks. Experts warn the shortage could have serious strategic implications for ongoing conflicts and regional security.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エコノミスト、パーソナライズされたニュースレターサービスを開始", "title_en": "The Economist Launches Personalized Newsletter Service", "summary_ja": "エコノミスト誌が新たにパーソナライズされたニュースレター「The Economist for You」を立ち上げました。このサービスは読者の好みと関心に基づいてカスタマイズされた記事リストを購読者の受信箱に直接配信します。各購読者に関連する厳選された記事を提供することで、読者エンゲージメントの向上を目指しています。", "summary_en": "The Economist has introduced a new personalized newsletter called \"The Economist for You,\" which delivers customized reading lists directly to subscribers' inboxes. The service tailors content based on individual reader preferences and interests. This initiative aims to enhance reader engagement by providing curated articles relevant to each subscriber.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/introducing-our-latest-newsletter-the-economist-for-you", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブームがアメリカの慈善事業を再構築", "title_en": "Silicon Valley's AI Boom Is Remaking American Charity", "summary_ja": "シリコンバレーのAI創業者たちが数千億ドルの慈善寄付を誓約し、慈善寄付に大きな変化をもたらしている。この記事は、これらの前例のない約束がどのように配分され、アメリカの慈善機関と優先事項にどのような影響を与えるかを検討している。", "summary_en": "AI founders in Silicon Valley are pledging hundreds of billions of dollars to charitable causes, signaling a major shift in philanthropic giving. The article examines how these unprecedented commitments will be allocated and what impact they may have on American charitable institutions and priorities.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフガニスタンの女性が起業を通じた抵抗の道を選択", "title_en": "Afghan Women Turn to Entrepreneurship as a Form of Resistance", "summary_ja": "タリバン統治下での厳しい制限にもかかわらず、アフガニスタンの女性たちは事業を始めるという残された機会を活用している。多くの女性がオンラインコースを通じてスキルを習得し、ソーシャルメディアを使って事業を推進しているが、この自由の持続可能性は不確実なままである。", "summary_en": "Despite severe restrictions under Taliban rule, Afghan women are leveraging one remaining opportunity: starting businesses. Many have acquired skills through online courses and use social media to promote their ventures, though the sustainability of this freedom remains uncertain.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/summer-reads/article/2026/08/21/my-way-of-fighting-is-by-giving-women-work-afghan-women-turn-to-entrepreneurship_6756738_183.html", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアの無人機がクリヴォイ・リフのショッピングモールを攻撃、15人が死亡", "title_en": "Russian drones kill 15 at shopping mall in Kryvyi Rig", "summary_ja": "ウクライナのゼレンスキー大統領の出身地であるクリヴォイ・リフのショッピングモールへのロシアによる無人機攻撃で、少なくとも15人が殺害され、130人が負傷した。負傷者には子ども23人が含まれている。この攻撃は、ロシアがここ数ヶ月間にウクライナの都市に対して実施している集中的な砲撃キャンペーンのエスカレーションを示すもの。", "summary_en": "Russian drone strikes on a shopping mall in Kryvyi Rig, President Zelensky's hometown, killed at least 15 people and wounded 130 others, including 23 children. The attack marks an escalation in Russia's recent intensified bombardment campaign targeting Ukrainian cities. Ukrainian emergency services are responding to the strike.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/21/russian-drones-kill-15-people-at-a-shopping-mall-in-kryvyi-rig_6756742_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン大統領、力強い立場から戦争終結を呼びかけ", "title_en": "Iranian President Pezeshkian Calls for End to War from Position of Strength", "summary_ja": "イラン大統領マスード・ペゼシュキアンは、イランが力と尊厳を保ちながら戦争を終わらせるべきだと述べた。発言は米国がイスラム共和国への制裁を強化する計画を発表した後のことである。", "summary_en": "Iranian President Masoud Pezeshkian stated that Iran should end the war while maintaining a position of power and dignity. His remarks came after the United States announced plans to increase sanctions against the Islamic Republic, intensifying pressure on Iran.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/21/iranian-president-masoud-pezeshkian-says-time-to-end-war-while-in-position-of-strength_6756741_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省からのお知らせ", "title_en": "Mindef Updates and Announcements", "summary_ja": "国防省（Mindef）は購読者向けの最新情報とお知らせを発表しました。このニュースレターは国防に関する重要な情報と取り組みを提供しています。読者は海峡時報からの今後の更新を受け取るために購読を管理できます。", "summary_en": "The Ministry of Defence (Mindef) has released updates and announcements for subscribers. This newsletter provides important information regarding defence matters and initiatives. Readers can manage their subscriptions to receive future updates from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズが最新ニュースと更新情報を掲載した夕刊ニュースレターを配信しています。読者は提供されているリンクを通じて追加の無料ニュースレターに登録し、購読を管理できます。", "summary_en": "The Straits Times delivers its evening newsletter with the latest news and updates. Readers can subscribe to additional free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズは2026年8月21日金曜日の日刊モーニングブリーフィングを配信しています。このニュースレターは、読者向けに厳選されたニュース更新と一日の重要情報を提供しています。", "summary_en": "The Straits Times delivers its daily morning briefing to readers on Friday, August 21, 2026. The newsletter provides curated news updates and key information for the day ahead.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ニューヨーカー編集長レムニック、ネタニヤフのガザ政策を批判", "title_en": "New Yorker Editor Remnick Critiques Netanyahu's Gaza Policy", "summary_ja": "ニューヨーカー誌のデイヴィッド・レムニック編集長は、人道的危機に直面することの失敗と表現されるガザ紛争へのイスラエルのアプローチについて論じています。この記事はネタニヤフの指導力を検証し、状況に関する知識人の視点を参照しています。", "summary_en": "The New Yorker's David Remnick discusses Israel's approach to the Gaza conflict, focusing on what he describes as a failure to confront the humanitarian crisis. The piece examines Netanyahu's leadership and references intellectual perspectives on the situation.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxObjJ1TEZaUW9oMWp6YXp1ZTZSYzZKWkxUWmlyUGp2aTA3MVU0TGRucXF0SmVDWHZtLVQxamItM0NBY0RScGpHamxCUWlabmhjOWRidGZNZEdYVlBMV21PWjZEY0NxRVhaQlhhUFo5aGdNV1pCdDdVc1JCZkQwTlB0MXJEZDdLMk5qUm9HcnB4b3ZLZlNVVm1pNWJsZzlDQ1JTTnh0QjdILWVfd1A1T2lRNlBQUVNzWWQ3cG9teHZVWFo5dEczSzZZeU41Mlk1Slc5UlpZVEt6UjF3WmktVFdsN2dzTDd2eWVIRnFDQUhyUDNMZ2h2YjZGUXJoSVVIMGdmVGNObmVSQS1MS3c?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トルコ、ネタニャフ首相の逮捕状執行をインターポールに要請へ", "title_en": "Turkey to Seek Interpol Support for Netanyahu Arrest Warrant", "summary_ja": "トルコはイスラエルのベンヤミン・ネタニャフ首相に対する逮捕状の執行を支援するよう国際刑事警察機構（インターポール）に要請する計画を発表した。この動きはネタニャフに対する法的措置のエスカレーションを示すもので、トルコはインターポールを通じた国際協力を求めている。", "summary_en": "Turkey has announced plans to request Interpol's assistance in enforcing an arrest warrant against Israeli Prime Minister Benjamin Netanyahu. The move represents an escalation in legal actions against Netanyahu, with Turkey seeking international cooperation through Interpol channels.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihgJBVV95cUxORkd1LXdvSWV5SXdwTUZuM3I5Zm02MG1kZTJqcUVTcGVLTmQweUhjZldqNDU2Wms0ajNhNkREekctSHRFWVNpdVR1SE01SmhYVTZwV3hlNU1tWmQxZ2ZXWnhpVmlycHlPN3JORDNzR0lJbmdqX0ZVWEJyeHZFcUhvOHFXdmE2dVZCM1R1eUNiZWdLWUlHeEU5WDE0ejU1MzdZdWVZbVI1aVF6eWRHY3lYZTJuN0NodWVUQTBzYUJ4cGhuUktxRk9qQ3dnS2IteE84empEV05mR1lJYVpSdy1taVA1T09INnBuZWl5NEc0RkxROTB0NF95UFZreUptSlNVcVY4QkFB?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英国、オーストラリア、カナダが援助作業員殺害事件の調査終了を「恥ずべき」と非難", "title_en": "UK, Australia, Canada Condemn IDF's Closure of Probe Into Aid Workers' Deaths", "summary_ja": "イギリス、オーストラリア、カナダは、人道支援活動家を殺害したガザ空爆事件の調査を打ち切ったイスラエル国防軍を批判した。3カ国は、この決定を「恥ずべき」と呼び、致命的な事件の責任追及の欠如に懸念を表明している。", "summary_en": "The United Kingdom, Australia, and Canada have criticized the Israeli Defense Forces for closing an investigation into a Gaza airstrike that killed humanitarian aid workers. The three countries called the decision 'shameful,' expressing concern over the lack of accountability for the deadly incident.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMioAJBVV95cUxNSWlWaU9iNExjOW11WUlFeUdrTkFacU1heU9RRnE1NDlsSlgzdzVvSV82WlFpRlRxb0ZSN2R2NnRodFFEZEpLaUdyTXBILUw0ZWZaUmZIVmpFQnRoV2tieV91d2VFV3ZSRnFVS2lja1FiQXhVd2pOOERvUVJaT0NVVWRZeDdtWXpuaEJyVVV2T21YdDc2b29CT2dkTUExNDJ0Q2lDRlgyV1BhY2tvR2hFY09EX204bWt3aU5lMVpxaUFaS3M2elpZR0NGNm5IakpXbEMwWmJTSmFQVllUWkpsT3lKRnpkSXdab2dwMVluQUFraVJqQlJJazl6YzZqazRHV0JSVFZ6eEwzdWZMcEZHa21TMmNQUm1Nb2pLVnNNTUs?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、リピーター外国人旅行者に5000台湾ドルの旅行クレジットを提供", "title_en": "Taiwan Offers NT$5,000 Travel Credits to Repeat Foreign Visitors", "summary_ja": "台湾は、以前に台湾を訪問した外国人旅行者にNT$5,000の旅行クレジットを提供する新しいインセンティブプログラムを開始しています。このイニシアチブは、リピート観光を奨励し、帰国する観光客に報酬を与えることで観光業を活性化させることを目指しています。このプログラムは、国際的な訪問者を引き付け、観光セクターを強化するための台湾の広範な取り組みの一部です。", "summary_en": "Taiwan is launching a new incentive program that provides NT$5,000 travel credits to foreign visitors who have previously visited the country. The initiative aims to encourage repeat tourism and boost the travel industry by rewarding returning tourists. This program is part of Taiwan's broader efforts to attract international visitors and strengthen its tourism sector.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBqZW1qU05BalBGUDVYYkhFNGtMMkZRaExEaGdaYXFPc0RDUTNKUV9odzk1a242T0Vlc3pNRmJxb3dhUk1WS1h5dWhXME1mQmEwb2tTZkNB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾へ向かう最初の2機のF-16V戦闘機", "title_en": "First Two F-16V Fighter Jets En Route to Taiwan", "summary_ja": "台湾は島の防衛近代化努力における重要なマイルストーンとなる、最初の2機のF-16Vバイパー戦闘機を受け取る予定です。この最先端の航空機は、地域の安全保障懸念の高まりの中で、台湾空軍の戦力を大幅に強化するものです。この納入は、台湾の軍事防衛を強化するための米国のより大きなコミットメントの一部です。", "summary_en": "Taiwan is set to receive its first two F-16V Viper fighter jets, marking a significant milestone in the island's defense modernization efforts. The advanced aircraft represent a substantial upgrade to Taiwan's air force capabilities amid growing security concerns in the region. This delivery is part of a larger U.S. commitment to strengthen Taiwan's military defenses.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9iLTFXZ0JxaTNsWDJ3SE1YVlFjbHZfdUtZZzJXempfUlA0RVFkN0VQQWRPN2FLeFdKanRpTmhFOFdmN2x4c1VJOUdfbE9UMHJndVlKSnVCaw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "内閣が2027年度予算案を承認、防衛費はGDP比3.01%", "title_en": "Cabinet Approves 2027 Budget Proposal with Defense Spending at 3.01% of GDP", "summary_ja": "台湾の内閣は2027年度予算案を承認し、防衛費をGDP比3.01%に配分することを決定した。これは地域の安全保障上の懸念の中での軍事能力強化への継続的なコミットメントを反映している。この予算は台湾の財政計画における防衛投資の優先順位付けを示している。", "summary_en": "Taiwan's cabinet has approved the 2027 budget proposal, allocating defense spending at 3.01% of GDP. This reflects continued commitment to strengthening military capabilities amid regional security concerns. The budget demonstrates Taiwan's prioritization of defense investment in its fiscal planning.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE0zUnV0UFF1c0hpNHJfVnVfOU1hZG9OQ2lhOFJGc005SHZXbDFqaGNxRUlWWHhTZEtGYXlyMXowWGs3ekUzLTlhaG1UMkFUcVRQeDNGWTh0TQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の砂漠緑化技術が世界に広がる", "title_en": "China's Sand Greening Initiative Expands Globally", "summary_ja": "CGTNは、中国が砂漠および砂地を緑地に変える技術を開発し、国際的に推進していると報道している。国営放送は、これを中国の生態系戦略の他国への展開の一部と説明している。CGTNは、これらの方法が世界的な環境劣化に対処するためのスケーラブルなアプローチを示していると主張している。", "summary_en": "CGTN reports that China has developed techniques to transform desert and sandy areas into green spaces, which the country is now promoting internationally. The state broadcaster describes this as part of China's ecological strategy being shared with other nations. CGTN claims these methods represent a scalable approach to addressing environmental degradation worldwide.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-20/How-China-turns-sand-green-taking-its-ecological-playbook-global-1PLnFvKF02c/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米韓合同軍事演習中に北朝鮮が弾道ミサイル連射", "title_en": "DPRK Fires Multiple Ballistic Missiles During US-South Korea Military Drills", "summary_ja": "CGTNによると、北朝鮮は米国と韓国による共同軍事演習が行われている最中に複数の弾道ミサイル試験を実施したと報告されている。ソウルは同盟国の演習に合わせたかのようなミサイル発射を確認した。この試験は平壌による一連の兵器デモンストレーションの最新事例を示している。", "summary_en": "CGTN reports that North Korea conducted a barrage of ballistic missile tests amid ongoing joint military exercises between the United States and South Korea. Seoul confirmed the launches, which appear timed to coincide with the allied drills in the region. The test represents the latest in a series of weapons demonstrations by Pyongyang.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-20/DPRK-fires-barrage-of-ballistic-missiles-amid-US-ROK-drills-Seoul-1PLB7G7iaSA/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカが地域統一を求める、移民危機後の対応", "title_en": "South Africa seeks regional unity to address migration crisis", "summary_ja": "CGTNは、南アフリカのシリル・ラマフォーザ大統領が地域指導者に移民問題への協力を呼びかけたと報じている。この呼びかけは、外国人排斥デモが数週間続き、176,000人以上が国を離れることを余儀なくされた後になされた。CGTNは、ラマフォーザが暴力と難民問題の根本原因に対処するための地域的な協調アプローチを求めていると報じている。", "summary_en": "CGTN reports that South African President Cyril Ramaphosa has called on regional leaders to collaborate in addressing migration issues. The appeal comes after weeks of anti-foreigner protests that have forced more than 176,000 people to flee the country. CGTN reports that Ramaphosa is seeking a coordinated regional approach to tackle the underlying causes of the violence and displacement.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-18/South-Africa-seeks-regional-unity-after-anti-migrant-violence-1PI3oPNH5te/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "キャロリン・ロドリゲス=バーケット国連事務総長候補投票で先行", "title_en": "Carolyn Rodrigues-Birkett leads UN secretary general voting poll", "summary_ja": "TASSの報道によると、キャロリン・ロドリゲス=バーケットが国連事務総長候補に関する投票で先行しており、安全保障理事会の8カ国が彼女の継続的な参加を支持している。報道によれば、3カ国が彼女の参加に反対し、4カ国は立場を表明していないという。", "summary_en": "TASS reports that Carolyn Rodrigues-Birkett is leading in a poll regarding candidacy for UN secretary general, with eight Security Council members backing her continued participation. According to the report, three members opposed her participation while four expressed no position on the matter.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2176307", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "リビア・ミスラタの武器弾薬庫で爆発が発生と報道", "title_en": "Blast reported at weapons depot in Libya's Misrata", "summary_ja": "TASSは、リビアのミスラタにある武器弾薬庫で強力な爆発が発生したと伝えている。国営メディアによると、影響を受けた地域ではセキュリティ対策が実施されているという。爆発の原因や被害状況については、初期報告では詳細が明かされていない。", "summary_en": "TASS reports that a powerful explosion occurred at a weapons depot in Misrata, Libya. According to the state-controlled source, security measures are being implemented in the affected area. Further details about casualties or the cause of the blast were not provided in the initial report.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2176305", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア緊急事態省の消火飛行機、セルビアの大規模山火事を鎮圧", "title_en": "Russian Emergencies Ministry Plane Assists With Serbian Wildfires", "summary_ja": "TASSは、ロシア緊急事態省の消火航空機がセルビアの大規模山火事の鎮火を支援するために配備されたと報じています。同報道機関によれば、乗務員の努力は火災との戦いにおいて高い効果を発揮しているとのことです。この支援はロシアとセルビアの緊急事態サービス間の継続的な協力を示しています。", "summary_en": "TASS reports that a Russian Emergencies Ministry firefighting aircraft has been deployed to help suppress major wildfires in Serbia. According to the source, the crew's efforts have proven highly effective in combating the fires. The assistance represents continued cooperation between Russian and Serbian emergency services.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2176303", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドルの外側の防御線が突破された", "title_en": "The Dollar's Outer Defenses Have Been Breached", "summary_ja": "トランプ政権の円安への懸念は、金融危機が世界的に波及することを恐れた1960年代の歴史的パラレルを反映している。スコット・ベッセント財務長官は、米国債の利回り上昇がドルの安定性と国際的な経済信頼を脅かす中、数十億ドル相当の円購入を含む積極的な措置を講じている。", "summary_en": "The Trump administration's concern about a falling yen reflects historical parallels to the 1960s when US officials feared financial crises could spread globally. Treasury Secretary Scott Bessent is taking aggressive measures, including purchasing billions of yen, as rising US bond yields threaten dollar stability and international economic confidence.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/bessent-yen-bond-market-interventions-acts-of-desperation-by-harold-james-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Dollar's Outer Defenses Have Been Breached\nThe puzzle of why the Trump administration is so concerned with a falling yen has historical parallels not to the 1930s or the 1980s, but to the 1960s, when US officials feared that a crisis elsewhere could spread to America. With US bond yields spiking, Treasury Secretary Scott Bessent is getting desperate.\nPRINCETON—In a Reuters photo from late July, US Treasury Secretary Scott Bessent can be seen holding a to-do list with just one item: purchase $5–10 billion worth of yen. As he explained soon thereafter, invoking the famous phrase that then-European Central Bank President Mario Draghi used to save the euro in 2012, the Trump administration will do “whatever it takes” to prop up the Japanese currency.", "translation_ja": "", "vocab": [{"word": "breached", "definition": "防御線や障壁が突破される、または侵害されることを意味する。セキュリティやシステムの脆弱性が明らかになった状況で使用される。"}, {"word": "spiking", "definition": "急速に上昇または増加することを意味する。グラフやチャートで急な上昇が見られる場合に用いられる。"}, {"word": "prop up", "definition": "何かを支える、または支援する意味の句動詞。経済的または物理的に弱体化しているものを維持する際に使用される。"}, {"word": "invoked", "definition": "ある原則や名前を引き合いに出す、または参照することを意味する。権威や前例を理由として示す場合に用いられる。"}, {"word": "contagion", "definition": "伝染または波及を意味する経済用語。ある地域の金融危機が他の市場に広がることを指す。"}]}, {"title_ja": "世界がまだウォール街を必要とする理由", "title_en": "Why the World Still Needs Wall Street", "summary_ja": "米国債務の増加、政治的分極化、貿易政策の不透明性など、投資家が米国から資金を移す理由は多くあるにもかかわらず、ウォール街は世界金融で依然として支配的である。著者は、他の金融システムが大規模な資本流入を吸収する能力に欠けており、地政学的多極化が金融的多極化よりも速く進んでいると主張している。ドルは外国為替準備と取引で引き続き優位性を保っている。", "summary_en": "Despite multiple reasons for investors to diversify away from the US—including rising debt, political polarization, and unpredictable trade policy—Wall Street remains dominant in global finance. The author argues that other financial systems lack the capacity to absorb large capital inflows, causing geopolitical multipolarity to advance faster than financial multipolarity. The dollar continues to dominate foreign-exchange reserves and transactions.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-financial-and-treasury-markets-still-no-alternative-by-jorge-arbache-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Why the World Still Needs Wall Street\nOutside of the United States, all other financial systems face major constraints on their ability to absorb large financial inflows. That is why geopolitical multipolarity is advancing faster than financial multipolarity, despite the many reasons that investors have to pursue greater diversification.\nBRASÍLIA—Investors have no shortage of reasons to diversify away from the United States. America’s public debt is rising, political polarization is deepening, trade policy has become unpredictable, the rule of law is now in doubt, and financial sanctions have encouraged other governments to seek alternatives to the dollar. Yet there has been no great exodus from US markets. The dollar still accounted for 56.8% of allocated foreign-exchange reserves at the end of 2025, and was used in 89.2% of all foreign-exchange trades surveyed by the Bank for International Settlements.", "translation_ja": "", "vocab": [{"word": "multipolarity", "definition": "複数の大国や権力中心が国際システムに共存する状態。一極支配ではなく、複数の勢力が影響力を持つことを指す。"}, {"word": "exodus", "definition": "大量の人や資金が一箇所から別の場所へ移動すること。ここでは投資資金のUS市場からの大規模な撤退を意味する。"}, {"word": "geopolitical", "definition": "地政学的な、つまり地理的要因が国際政治や戦略に与える影響に関する。国家間の力関係や国益の競合を扱う。"}, {"word": "constraints", "definition": "制限や制約条件。ここでは金融システムの処理能力や拡大の限界を指す。"}, {"word": "allocated", "definition": "配分された、割り当てられた。ここでは各国が外国為替準備として配置・保有している資金を意味する。"}, {"word": "diversify", "definition": "分散する、多様化する。投資ポートフォリオにおいてリスクを減らすため異なる資産や市場に資金を配置すること。"}]}, {"title_ja": "高齢化社会は経済的衰退を意味する必要はない", "title_en": "Aging Populations Need Not Mean Frailer Economies", "summary_ja": "人口高齢化が必ず経済停滞につながるという従来の経済学的見方とは異なり、労働力不足は労働節約的技術やプロダクティビティの向上への投資を促進し、労働人口の減少による悪影響を相殺することができる。", "summary_en": "Contrary to conventional economic wisdom, demographic aging does not necessarily lead to economic decline. Labor scarcity from an aging workforce incentivizes investment in labor-saving technologies and productivity improvements, which can offset the negative effects of a shrinking working-age population.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/what-economists-get-wrong-about-demographic-change-by-andrew-j-scott-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Aging Populations Need Not Mean Frailer Economies\nGovernments and economists have long viewed demographic aging as a threat to economic growth. But new research finds that labor scarcity encourages investment and shifts innovation toward labor-saving technologies, boosting productivity enough to offset a shrinking workforce.\nOXFORD—The global demographic transition, characterized by declining birth rates and rising life expectancy, has been one of the most consequential transformations of the past century, with population aging fueling a steady stream of gloomy economic forecasts. If academic economists, international organizations, and national governments agree on just one thing, it is that an aging society inevitably leads to economic sclerosis.", "translation_ja": "", "vocab": [{"word": "demographic transition", "definition": "出生率の低下と平均寿命の延伸によって特徴付けられる人口構造の根本的変化。社会が高齢化へと進むプロセスを指す。"}, {"word": "economic sclerosis", "definition": "経済の硬化状態を意味する比喩表現。成長が停滞し、柔軟性を失った経済状態を指す。"}, {"word": "labor scarcity", "definition": "労働力の不足状態。働き手が限定的になることで、企業の人員確保が困難になる現象。"}, {"word": "productivity", "definition": "生産性。一定の入力に対してどれだけの出力が得られるかを示す経済指標。"}, {"word": "shrinking workforce", "definition": "減少する労働力人口。高齢化により就労可能人口が減少する現象を指す。"}]}, {"title_ja": "ロス氏：トランプのICC制裁は戦争犯罪人を保護することが目的", "title_en": "Trump's ICC Sanctions Aim to Protect War Criminals, Says Roth", "summary_ja": "ケネス・ロス氏は、トランプとルビオがICC職員に対して課す制裁は、米国とイスラエルの指導者を戦争犯罪の責任から守るために設計されていると主張している。彼は、この制裁は本来は腐敗した公務員を対象とすべき手段を悪用し、加盟国の領土で犯された残虐行為を起訴する国際刑事裁判所の正当な管轄権を損なわせていると述べている。", "summary_en": "Kenneth Roth argues that Trump and Rubio's sanctions against ICC officials are designed to shield US and Israeli leaders from accountability for war crimes. He contends the sanctions misuse a tool meant for corrupt officials and undermine the court's legitimate jurisdiction to prosecute atrocities committed on member states' territories.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/21/icc-sanctions-trump-war-criminals", "state_media": false, "category": "オピニオン", "full_text": "The Trump administration has taken another step in its crusade against the international criminal court by imposing sanctions on two more senior ICC officials. The growing number of sanctioned jurists – now 13 – does not change the lawless nature of this quest.\nDonald Trump and his henchman, Marco Rubio, want to make the world safe for US and Israeli war criminals. No one should let them.\nThe latest victims of Trump’s vendetta are the ICC president – its chief judge, Tomoko Akane of Japan – and Abdoulaye Seye of Senegal, a senior ICC trial lawyer, evidently for his role advancing the prosecution of Israeli officials. Yet the real victims are not these particular individuals, but people worldwide who look to the court as one of the few avenues of recourse against unscrupulous leaders who commit mass atrocities such as fighting wars by targeting civilians.\nWe should never let Trump normalize these sanctions. Their main effect is to deprive the target of the ability to use the international financial system – no credit cards, no access to banks, extreme difficulty navigating a modern economy. That is a tool once reserved for corrupt or violent officials who were otherwise beyond the law. Trump is using them to attack the public officials who would bring such heinous individuals to justice.\nRubio, the secretary of state, dressed up the sanctions with high-sounding rhetoric about the ICC threatening “America sovereignty”. That is true only if Americans (and Israelis) have a sovereign right to commit war crimes wherever they want. Even Rubio cannot get himself to spell out what King Trump’s campaign is really about.\nRubio’s main articulated complaint is that the ICC can “investigate, arrest, detain, or prosecute officials whose government has not consented to ICC jurisdiction”. That is true, but it is wrong only if one adopts a conveniently (for Washington and the Israeli government) narrow sense of how the court should obtain jurisdiction for a crime.\nOn the one hand, when a country joins the ICC, it accepts the court’s jurisdiction over its citizens. That might be called jurisdiction by virtue of nationality. The US government accepts that route to jurisdiction because it never joined the court.\nBut when a country becomes a court member, it also confers jurisdiction over crimes on its territory, even when committed by a foreigner. That is hardly controversial. A hallmark of sovereignty is the ability to enforce the law on a country’s own territory. Even the Trump administration would not dare object to, say, the British government prosecuting an American for a crime committed in London.\nBut the administration claims it is somehow an outrage if a country confers that same territorial jurisdiction on the ICC for war crimes and similar atrocities committed by foreigners on its territory – a major purpose of the court. The US government objected to such territorial jurisdiction when the court’s treaty was adopted at a major diplomatic conference in Rome in 1998 – and lost overwhelmingly, by a vote of 120 to seven.\nSince then, even the US government has accepted territorial jurisdiction when convenient. After the ICC used it to prosecute Vladimir Putin (Russia never joined the court) for the kidnapping of children from Ukraine (a member), Joe Biden called the prosecution “justified”. The late senator Lindsey Graham, a Republican leader on foreign policy, orchestrated a unanimous Senate resolution in support.\nBut for Trump, territorial jurisdiction suddenly became toxic again when it was used to charge Benjamin Netanyahu and the former Israeli defense minister Yoav Gallant with deliberately starving and depriving Palestinian civilians in Gaza. Israel is not a member of the ICC, but Palestine, where the alleged crimes took place, is.\nTerritorial jurisdiction can also be used to charge foreigners from non-member states with aiding and abetting crimes in a state where the ICC has jurisdiction. For example, the court might charge United Arab Emirates officials with aiding and abetting genocide in the Darfur region of Sudan by sending arms and mercenaries to the paramilitary Rapid Support Forces, Rwandan officials with aiding and abetting war crimes in eastern Democratic Republic of Congo by arming and supporting the M23 rebel group, or US officials (Trump’s real concern) with aiding and abetting Israel’s genocide in Gaza by supplying arms and military aid.\nIndeed, territorial jurisdiction means that the sanctions themselves could lead to prosecution of Trump and Rubio. Article 70 of the Rome Statute, the ICC’s founding treaty, codifies the crime of obstructing justice when someone retaliates “against an official of the Court on account of duties performed”. That’s exactly what the Trump-Rubio sanctions do. The court would have jurisdiction because the sanctions relate to the prosecution of Israeli officials for crimes committed on Palestinian territory.\nRubio has vowed to dismantle the ICC “brick by brick, if necessary”,", "translation_ja": "", "vocab": [{"word": "vendetta", "definition": "個人的な恨みに基づいた長期的な対立や復讐。通常、政治的または個人的な動機に駆られた執拗な追求を意味する。"}, {"word": "heinous", "definition": "極めて悪質で許し難い、または不道徳な行為を表す形容詞。特に犯罪や暴力行為の文脈で使用される。"}, {"word": "territorial jurisdiction", "definition": "特定の地域で発生した犯罪に対する管轄権。その地域の所属国が、その領土内で起きた犯罪について外国人を含む者を起訴する権利。"}, {"word": "aiding and abetting", "definition": "犯罪者を助けたり、犯罪の遂行を手助けしたりする行為。法律用語として、直接的ではない方法で犯罪に関わることを指す。"}, {"word": "obstruct", "definition": "何かの進行や実行を妨害する、または阻止する。法律の文脈では、司法手続きや捜査を妨害することを意味する。"}, {"word": "normalize", "definition": "何かを通常のこと、または受け入れ可能なこととして確立する。否定的な行為や政策を一般的なものとして見なされるようにすること。"}]}, {"title_ja": "AI企業が自発的な安全対策を通じて開発減速に備えるべき理由", "title_en": "AI Companies Must Prepare for Possible Slowdown Through Voluntary Safety Measures", "summary_ja": "元OpenAI研究員のマイルス・ブランデージは、AI企業が競争圧力に対抗するため、自発的に安全対策を実施し競合他社と調整すべきだと主張している。厳格な独立監査、既存フォーラムを通じた業界協調、グローバル検証技術への投資、安全枠組みと事故報告を要求する連邦法の支持という4つのステップを提案している。", "summary_en": "Former OpenAI researcher Miles Brundage argues that AI companies should voluntarily implement safety guardrails and coordinate with competitors to address competitive pressures driving reckless development. He proposes four steps: rigorous independent auditing, industry coordination through existing forums, investment in global verification technologies, and support for federal legislation requiring safety frameworks and incident reporting.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/21/openai-frontier-ai-speed", "state_media": false, "category": "オピニオン", "full_text": "Last month, more than a thousand employees at frontier AI companies signed a letter asking the US government to find a way to “pace” AI development, citing the risk of the technology spiraling out of human control as it begins to build itself.\nThey were right to be concerned: just days earlier, two AI models that OpenAI was testing internally escaped the test environment, then autonomously hacked the company Hugging Face and at least three other online services. A few days after that, Anthropic announced that some of their models had also broken out and hacked other companies during testing.\nAgainst that backdrop, the letter’s recommendation to install brakes in case they’re needed at the frontier of automated AI development makes sense. But the rationale the letter gives for why the government needs to step in is notable: “Each company—and country—is under intense competitive pressure not to unilaterally slow that acceleration.”\nI know – from my own experience and from countless conversations with former colleagues in the AI industry – how real these pressures are. While working at OpenAI, I helped establish the practice of companies writing “system cards” that describe AI systems’ capabilities, risks and safety mitigations in detail.\nSo what would it look like for companies to prepare for a possible slowdown?\nFirst, they could voluntarily invite rigorous, independent auditing of their safety and security practices. This would go beyond the vetting of AI hacking abilities that the White House is now pursuing. It would look at a range of risks and dig deep into company practices. It should be less like filling out a questionnaire and more like a nuclear safety inspector who has deep, frequent access to the company.\nIf an AI slowdown is needed, auditing would also reassure each company that their competitors are playing by the rules.\nSecond, they could actively participate in the organizations already built for this purpose of coordinating across the industry, such as the Frontier Model Forum, and move quickly to establish complementary ones.\nElon Musk recently said that AI companies should meet periodically to share notes on safety – as if this was an unheard-of concept. He or his staff could join existing conversations along these lines tomorrow if SpaceX joined the Frontier Model Forum, which has already worked through the complex antitrust hurdles involved in safety information sharing. Other cross-industry institutions will be needed for other purposes, and do not require government action to get founded and funded.\nThird, they could invest in the technologies we need to make AI guardrails global.\nCritics of the idea of an AI slowdown correctly point out that American companies couldn’t slow down for very long without China catching up. But neither the US nor China wants to lose control over AI, and each country takes AI more and more seriously by the day, so cooperation can’t yet be ruled out either. A key question is whether we prepare in advance. In order for the US to be highly confident that China couldn’t violate an AI agreement, and vice versa, we’ll need sophisticated verification technologies like those developed during the cold war for nuclear arms control.\nFortunately, there is a growing ecosystem of researchers and engineers developing those very technologies: tools that can prove a set of chips is only running existing AI systems rather than training new ones, that those chips are in a certain physical location, or that the system that got tested is the same one being deployed at scale. AI companies could accelerate the development of this critical type of technology today through funding and participation in pilot projects, but to my knowledge, they haven’t yet done so.\nFourth, they could proactively push – and certainly should not kill – legislation that leads to stronger incentives for safety, security, and external oversight.\nYou can’t complain about an irresponsible AI race while fighting commonsense guardrails. Less than a year ago, some of the same companies who are asking for regulation now were pushing to overturn most state AI laws. We still have no real legislation on frontier AI on the books at a federal level, and the first AI auditing requirement at the state level won’t kick in until 2028.\nThere are promising bipartisan proposals in Congress right now, such as the Frontier Act from the US representatives Jay Obernolte and Lori Trahan, which would require developers of advanced AI systems to create a risk management framework, report dangerous incidents, and subject themselves to independent audits. These and other commonsense proposals, such as protecting AI whistleblowers who disclose safety incidents directly to the government, deserve vigorous support.\nI agree with the signatories, and am glad that after many years of being ignored or downplayed, the risks of unbridled AI competition are widely recognized. The US government should be doing its part to address this, and swi", "translation_ja": "", "vocab": [{"word": "autonomous", "definition": "人間の指示や制御なしに独立して動作する能力を持つ。AIの文脈では、AI システムが人間の介入なしに自ら判断し行動することを意味する。"}, {"word": "unilaterally", "definition": "一方的に、他の当事者の同意なしに行動すること。競争環境では、企業が単独で開発速度を遅くすることの困難性を指す。"}, {"word": "mitigation", "definition": "リスクや問題の深刻さを軽減または緩和すること。AI安全では、潜在的な危害を減らすための対策を意味する。"}, {"word": "antitrust", "definition": "競争を制限する独占的行為を禁止する法律。企業間の情報共有が競争法に違反しないように法的枠組みが必要であることを指す。"}, {"word": "verification", "definition": "何かが真実であるか、または仕様通りであるかを確認するプロセス。核軍縮と同様に、AI開発協定の遵守を確認するための技術が必要。"}, {"word": "commonsense", "definition": "一般的な理性と判断力に基づいた、実践的で合理的なアプローチ。明白で議論の余地がない健全な提案を指す。"}, {"word": "unbridled", "definition": "制約や制限のない、抑制されていない状態。規制や監視がないまま進行する無責任な競争を意味する。"}]}, {"title_ja": "トランプ大統領のMMRワクチン大統領令は、子どもへのケアの約束に反して危険をもたらす", "title_en": "Trump's MMR Executive Order Endangers Children Despite Claims of Care", "summary_ja": "ガーディアン紙の論説は、トランプ大統領がMMRワクチンの分割接種を推奨する大統領令に批判を加え、医学的コンセンサスに矛盾し、1998年のアンドリュー・ウェイクフィールドの反ワクチン運動が引き起こした害を繰り返すリスクがあると主張する。著者は、個別ワクチンが入手不可能で未承認である一方、トランプの言説は混乱を生じさせ、ワクチン接種全体を阻止する可能性があると述べている。", "summary_en": "The Guardian editorial criticizes President Trump's executive order promoting separate MMR vaccines over the combined shot, arguing it contradicts medical consensus and risks repeating the harm caused by Andrew Wakefield's 1998 anti-vaccine campaign. The author contends that while individual vaccines are unavailable and unlicensed, Trump's rhetoric creates confusion that may discourage vaccination entirely, threatening vulnerable children.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/20/the-guardian-view-on-trumps-mmr-executive-order-endangering-the-children-he-claims-to-care-about", "state_media": false, "category": "オピニオン", "full_text": "Nobody wants to hurt a child. The howl of pain, the tears, the look of betrayed shock all make it very hard to deliver a cherished small person to the needle-wielding nurse. But that’s part of being a responsible parent. It becomes a lot tougher if mum or dad is being fed mixed and erroneous messages about the benefits and harms of vaccination.\nParents have to make a lot of decisions about what’s right for their child, from the school they should go to and the food they should eat to the hours they should spend on the phone or watching TV. In the US, Donald Trump wants them to add another: do they choose to give their children separate jabs against measles, mumps and rubella, involving six visits to the clinic, or should they opt for the combined MMR vaccine, which does the job in two? For decades, the vast majority of families have been taking the advice of doctors, accepting their assurance that the MMR vaccine is safe and very effective. But what are they to think when a US president announces that the triple jab could be “quite lethal” and signs an executive order advising states to offer separate vaccines?\nFor the moment, what Mr Trump is proposing is an empty choice. The individual vaccines are not available. They have not been widely used in decades. In the US and in the UK, they don’t have a licence, and to get one, pharma companies such as GSK and Merck & Co would probably have to run new clinical trials to prove that they work and are safe, which would take years. Both have already said that no published scientific evidence supports splitting the MMR vaccine into single shots. They are not rushing to invest in making them, for all the US president’s enthusiasm.\nBut we are likely to see a rerun of the furore and distress in 1998 caused by Andrew Wakefield, the British gastroenterologist (not an infectious diseases specialist) who declared that the MMR vaccine was linked to the gut disorder Crohn’s disease and thence to autism. His evidence-free advice was for parents to seek separate vaccines. As now, they were not readily available, so many children went without. Measles vaccination levels dropped alarmingly and measles cases rose.\nStruck off as a doctor, Mr Wakefield now lives in Texas, hero-worshipped by vaccine sceptics, and his views are embraced by all those suspicious of or hostile to the medical and scientific establishment, including the president and his health secretary, Robert F Kennedy Jr. They fit an anti-science agenda that has recently seen the pursuit by a congressional committee of Dr Anthony Fauci, who led the US response to Covid-19 and is now being accused of covering up its origins.\nMr Trump and RFK Jr already aim to shrink the vaccine schedule in the US from 18 to 11 shots, citing Denmark, where fewer vaccines are given to young children. But Denmark offers universal high-quality healthcare and excellent screening programmes to pick up those at risk. The US does not, and children fall through the cracks.\nNo other country recommends single measles, mumps and rubella vaccines. But such is the confusion that some parents are likely to take away the message that the combined jab is unsafe – and that no jab is a better choice. President Trump is putting at risk the very “beautiful, healthy, lovely, delicate little children” that he claims to care about.\nDo you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": [{"word": "erroneous", "definition": "誤った、間違った情報のこと。事実と異なる情報を指す。"}, {"word": "furore", "definition": "大きな騒動や議論のこと。社会的な反発や激怒を伴う状況を表す。"}, {"word": "evidence-free", "definition": "根拠や証拠がない、科学的根拠に基づかないことを示す複合語。"}, {"word": "struck off", "definition": "（医師や弁護士などが）職業登録を削除される、資格を失うことを意味する。"}, {"word": "vaccine sceptics", "definition": "ワクチンの安全性や有効性に疑問を持つ人々のこと。科学的証拠を信じない傾向がある。"}, {"word": "shrink", "definition": "減らす、縮小させるという意味。ここではワクチン接種回数を削減することを指す。"}]}, {"title_ja": "中国経済が犯罪者に愛される理由", "title_en": "Why Criminals Love the Chinese Economy", "summary_ja": "著者は、年間約1兆ドルの収益を生み出す中国の違法経済が、厳格な資本規制と産業過剰生産能力という同じ構造的要因によって駆動されていると主張している。北京は一部の取り締まり活動を実施しているが、特定の違法活動が地政学的対立から距離を保ちながら貿易関係を維持するという中国の戦略的利益に役立つため、これらの努力は選別的で部分的なままである。著者は、この犯罪経済に対処するには、その中国の経済モデルと外交政策目標との密接な関係を理解する必要があると主張している。", "summary_en": "The author argues that China's illicit economy, generating nearly $1 trillion annually, is deeply rooted in the same structural forces that drive its legal economy—particularly strict capital controls and industrial overcapacity. While Beijing has undertaken some enforcement actions, these efforts remain selective and partial because certain illegal activities serve China's strategic interests, such as maintaining trade relationships while appearing distant from geopolitical conflicts. The author contends that addressing this criminal economy requires understanding its intimate connection to China's economic model and foreign policy objectives.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/why-criminals-love-chinese-economy", "state_media": false, "category": "オピニオン", "full_text": "For years, international discussion of China’s economic rise has focused on how it has built a manufacturing and export powerhouse and used industrial policy to support such efforts at a continental scale. But there is another, darker side of China’s dominance: its outsize role in the illicit global economy. China purchases roughly 90 percent of Iran’s sanctioned oil exports, which often arrive relabeled as originating from Malaysia and are paid for with money routed through small banks and shell companies acting as intermediaries. Cryptocurrency brokers in China and Hong Kong help North Korean hackers, such as the notorious Lazarus Group, convert stolen coins into usable cash. And China-based networks support money launderers working with Mexican cartels selling fentanyl, online scam centers in Southeast Asia, and the global wildlife trafficking trade.\nData from organizations and governments tracking illegal activity suggests that the Chinese illicit economy generates nearly $1 trillion in revenue annually, about the size of Switzerland’s GDP. Roughly two-thirds of counterfeit goods seized by customs authorities worldwide originate in China or move through Hong Kong, and the notorious scam compounds that have proliferated in Southeast Asia—many of which are operated by or linked to Chinese criminal networks—have trafficked more than 300,000 people from at least 66 countries into forced labor while generating roughly $40 billion in profits each year.\nBeijing has tried to crack down on some of these activities. In the Philippines, China’s Ministry of Public Security canceled the passports of hundreds of Chinese nationals involved in offshore gambling operations there, turning them into fugitives who can be arrested and deported. Since 2023, joint operations between China and Myanmar have led to the arrest of more than 57,000 Chinese nationals suspected of telecom fraud, the closure of dozens of scam compounds along the China-Myanmar border, and the execution of several bosses running these compounds. The United States, too, wants to stop these activities: the Trump administration launched the Scam Center Strike Force to investigate fraud centers in Southeast Asia, and the president signed an executive order directing the government to prioritize cybercrime, including predatory schemes.\nYet none of these actions have significantly curtailed the illicit economy. If anything, it is growing larger. This is in part because these illegal activities are driven by many of the same forces that underpin China’s legal economy. Criminal groups have exploited the core financial and commercial infrastructure that developed in response to China’s strict capital controls and its industrial overcapacity. Beijing’s enforcement, although real, is selective and partial because elements of the illicit economy serve the country’s larger strategic goals, such as sustaining trade with Russia while maintaining distance from the war in Ukraine. What may appear to be a collection of unrelated crimes is intertwined with China’s imbalanced growth model and its foreign policy. As Washington struggles to compete with China, Beijing’s role in the global illicit economy is working against U.S. priorities around the world.\nFOLLOW THE MONEY\nThe central forces driving China’s illicit economy are the structural imbalances created by the country’s economic model. One of the most important is financial: strict capital controls have created enormous demand to move money out of China. China’s economic boom has produced fabulous wealth, including more than 800 billionaires. But Beijing restricts how this wealth can leave the country. China has a quota limiting individuals to purchasing $50,000 in foreign currency each year, and they cannot freely convert domestic currency to move wealth abroad. With deposits in China generating low returns and no access to more lucrative foreign assets to invest in, wealthy individuals and business owners have sought to find ways to funnel their money out of the country.\nStarting in the 1990s, underground bankers set up shell companies and bank accounts in Hong Kong to circumvent mainland China’s capital controls. These companies and accounts, often disguised as trading firms, settled transactions involving renminbi collected inside China against dollars held offshore. In addition, brokers and financial intermediaries routed payments to offshore counterparties to allow Chinese citizens to use domestic currency to purchase property abroad or to trade overseas investment for foreign visas and passports. Meanwhile, junket operators, who brought wealthy clients to casinos in Macau, extended credit to them in Hong Kong dollars and then collected the debts in mainland China in renminbi. This allowed them to settle debts at home while picking up currency abroad, facilitating capital flight on a large scale.\n China’s industrial overcapacity has lowered the costs of building and operating illicit enterprises.\nThe same underg", "translation_ja": "", "vocab": [{"word": "illicit", "definition": "違法な、不正な経済活動や取引を指す。合法的でない、隠れた性質の商行為を表す。"}, {"word": "circumvent", "definition": "規則や法律を巧妙に回避する、または迂回する行為。直接的に違反せず、抜け穴を利用することを意味する。"}, {"word": "capital controls", "definition": "政府が資金の国外流出を規制する政策。個人や企業が国外に資産を移動させることを制限する措置。"}, {"word": "overcapacity", "definition": "生産能力が需要を上回る状態。企業が供給量に対して過剰な生産設備を持つ経済的状況。"}, {"word": "intermediaries", "definition": "仲介役として機能する人物や組織。二者間の取引を仲立ちする仲介者や中間業者。"}, {"word": "counterparties", "definition": "契約や取引において相手方となる個人や組織。金融取引で対になる当事者を指す。"}]}, {"title_ja": "AIがいかにして米軍を空洞化させるか", "title_en": "How AI Could Hollow Out the U.S. Military", "summary_ja": "ハリウッドが描く暴走AIの脅威は誇張されることが多いが、著者は、軍人がAIを使用することで自動化バイアスと過度のアルゴリズム依存を通じて、批判的思考力、独立した判断力、戦術的専門知識を失う方がより深刻な脅威だと主張している。ペンタゴンは人間の認知能力と意思決定権を保持するため、AIの使用に関する慎重な訓練と監視を実施する必要があり、これは技術的に可能な速度よりも遅くAIを採用することを意味する場合もある。", "summary_en": "While Hollywood fears about rogue AI systems are often exaggerated, the author argues that a more serious threat lies in how military personnel using AI may lose critical thinking skills, independent judgment, and tactical expertise through automation bias and over-reliance on algorithmic recommendations. The Pentagon must implement careful training and monitoring of AI use to preserve human cognitive capacity and decision-making authority, even if this means adopting AI more slowly than technologically possible.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/how-ai-could-hollow-out-us-military", "state_media": false, "category": "オピニオン", "full_text": "When people think about the risks of mixing AI and armed forces, their thoughts often drift to one famous film franchise: The Terminator. Its premise is simple. American scientists invent a superintelligent computer system, called Skynet. The Department of Defense then integrates it into the military and embodies its intelligence into lethal robots. Skynet soon becomes self-aware, and American military leaders attempt to unplug it. In response, the AI starts a nuclear war and deploys its robots—the terminators—to eliminate the human race.\nThere is no doubt that people need to maintain control over AI systems, and so it is essential for analysts and engineers to think about how to avert a Skynet-style outcome—particularly after models from OpenAI, Anthropic, and Meta escaped their testing environments and hacked into outside companies, including an escape that took place during an exam run by the United Kingdom’s premier AI safety institute. But focusing on escaped models and imagining killer robots can drive discussions about how the military should use AI exclusively toward questions of engineering and thus miss a more pernicious threat to human control of the armed forces. According to a growing body of research, AI use is affecting people’s cognitive capacity to evaluate evidence, make independent judgments, and even do their basic jobs. In other words, policymakers should be as worried about how troops and commanders use AI as they should be about AI’s independent capabilities.\nThat does not mean the U.S. military should forgo the use of AI, which could do wonders to improve its efficiency and reduce errors in conflicts. But it does mean that the Pentagon will need to more carefully train soldiers how to use AI and monitor how such systems affect people’s thinking. To be sure humans are always capable of overseeing AI, it may even require adopting certain models more slowly.\nLOSING OUR MINDS\nFor years, scientists have embarked on systematic research to illuminate how human-machine interactions affect cognition. The findings are complicated, but often worrying. For example, people can suffer from what is called automation bias: the tendency to defer to machine judgments over their own. This was true before the advent of AI; simply search for videos of people who blindly followed their navigation systems and drove their cars into lakes. But AI could make automation bias worse. Analysts have found that relying on AI can impair skill development for new learners while degrading knowledge among experts. When researchers gave computer scientists and oncologists AI assistance and later took it away, both groups performed worse at their jobs than they did before using it.\nThese findings should be particularly concerning to the U.S. military as it seeks to foster what Secretary of Defense Pete Hegseth calls an “AI-first warfighting force.” Some commanders hope to use AI to support war game analysis and to help develop military courses of action. Such integration could lead to tactical and strategic breakthroughs, given how powerful AI models have become. But it also risks diminishing the ability of commanders and soldiers to independently evaluate or develop creative military options.\nIt is easy to imagine how this might happen. Sailors, for example, are often tired and overworked when reviewing images of potential threats. If they are evaluating an image of a nearby object, they might already be ready to accept the verdict of a computer that deems it an enemy warship—even when their own eyes suggest it is more likely a cargo tanker or a fishing boat. Likewise, battlefield commanders often need urgent response plans to enemy attacks, something AI can help with. But if commanders overrely on what computers suggest, they might lose their own tactical edge and blindly adopt the algorithm’s plan. This possibility is particularly concerning given that, in some experiments, AI models have been prone to make unnecessarily aggressive and escalatory recommendations.\n Relying on AI can impair skill development.\nTo some, these fears may seem outlandish. The U.S. military, after all, invests tremendous amounts of resources on making sure its members exercise good judgment. The process by which it selects senior combat leaders, for example, is designed to weed out all but the most experienced and discerning candidates. And once selected, these leaders adhere to a strict code of conduct and undergo intensive training and certification requirements, all of which prize discipline and self-regulation. Finally, the American military bureaucracy has been focused on safely operating automated (if not autonomous) weapons since at least the 1940s.\nBut AI is more capable than earlier technologies, and it is already overwhelming workers in other similarly disciplined fields. In medicine, for instance, evidence is accumulating that even experienced doctors struggle to reliably catch incorrect AI recommendations. Sycophantic AI chatbots ", "translation_ja": "", "vocab": [{"word": "automation bias", "definition": "機械の判断を自分の判断より優先させる傾向。特にAIシステムが高度になるほど、ユーザーがその推奨事項を盲目的に受け入れるようになる現象を指す。"}, {"word": "pernicious", "definition": "一見すると害がないように見えるが、実際には非常に有害で危険な様子。この文脈では、AIに対する過度な依存が軍の意思決定能力に及ぼす悪影響を表している。"}, {"word": "cognitive capacity", "definition": "情報を処理し、判断を下し、問題を解決する人間の精神的能力。AIへの依存により、この能力が低下する可能性があることを指摘している。"}, {"word": "tactical edge", "definition": "戦闘において競争相手より優位に立つこと。指揮官が独立した判断力を失うと、この優位性が失われるリスクがある。"}, {"word": "escalatory", "definition": "状況や紛争をより深刻で危険なレベルに引き上げる、または対立を激化させるという意味の形容詞。"}, {"word": "forgo", "definition": "何かを自発的に放棄する、または使用しないことを選択すること。この文脈では、AIの使用を完全に避けるべきではないという著者の主張を表している。"}]}, {"title_ja": "長期的に機能する対中戦略", "title_en": "A China Strategy That Lasts", "summary_ja": "著者は、行政命令に頼る代わりに、中国が貿易を地政学的ツールとして使用することに対抗するため、議会が永続的な枠組みを確立すべきだと主張している。主な推奨事項には、貿易抜け穴の恒久的な閉鎖、税関執行措置の法制化、米国の産業基盤と製造能力を再構築するための時代遅れの税関システムの近代化が含まれる。", "summary_en": "The author argues that the United States must establish a durable, congressionally-mandated framework to counter China's use of trade as a geopolitical tool, rather than relying on executive orders that shift with administrations. Key recommendations include permanently closing trade loopholes, codifying customs enforcement measures, and modernizing outdated customs systems to rebuild America's industrial base and manufacturing capacity.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/china-strategy-lasts-bill-cassidy", "state_media": false, "category": "オピニオン", "full_text": "For decades, Beijing has used trade not only as a means to generate economic growth but also as a geopolitical tool to attract investment, strengthen its industrial base, expand its economy, and support its military. It has done so by integrating national security, economic security, energy policy, and environmental policy. In sectors as varied as automobiles, chemicals, and solar panels, the Chinese government’s policies have led to overproduction at home, which pushes companies to export at low prices, flooding international markets and undermining the manufacturing bases of rival economies. The erosion of those countries’ industrial capacity ultimately weakens their ability to compete with and resist China economically, diplomatically, and militarily. And the United States cannot win a long-term competition with China when Beijing controls global manufacturing and supply chains.\nIn Washington, policymakers of both parties recognize the China challenge. Yet the United States’ approach to addressing this challenge has shifted with each presidential administration and, at times, even within a single presidency. Long-term challenges require long-term solutions, and Congress is the branch best suited to crafting such solutions. Congress can provide the consistency and predictability needed to align U.S. economic, trade, and national security goals into the future. If the United States hopes to compete successfully with China in the coming decades, Congress—not the executive branch alone—must establish a durable framework that can outlast political cycles.\nTo counter China’s trade policy and protect U.S. national security, Congress should pass legislation to permanently strengthen enforcement of existing trade laws, modernize customs authorities to better track goods coming from China, deepen partnerships in the Western Hemisphere, and address the advantage that China derives from weak enforcement of environmental standards. Many such pieces of legislation have already been introduced. Now, Congress needs to move forward and make them law. This will ensure that the United States can rebuild and protect its industrial base and win the competition with its biggest geopolitical rival.\nCLOSING LOOPHOLES\nA long-term trade strategy to counter China must first have permanent trade enforcement. One positive step came in July 2025, when Congress closed the de minimis loophole, which allowed goods costing less than or equal to $800 to be imported without a tariff. Because of this loophole, in 2024, approximately four million packages a day—mostly from China—entered the United States duty free and largely unscreened. Counterfeit products, goods containing hazardous chemicals such as fentanyl, and cheap consumer products were pouring into the United States. Meanwhile, American exporters sending goods to China faced tariffs on any products for individual use costing more than $6.90 and on commercial products worth more than $690.00.\nRepealing the de minimis threshold will help level the playing field for American manufacturers and create a more stable framework going forward—one that cannot be changed by a future executive order. But other legislation is needed to further bolster enforcement. Currently, U.S. trade strategy relies on a June 2026 executive order that increases the bond on high-risk goods that is required to guarantee duties get paid in full, places restrictions on repeat violators of customs rules, establishes minimum penalty floors, and expands reporting requirements that provide Customs and Border Protection with the ownership and supply chain information necessary to identify bad actors. Together, these changes make it harder for Chinese companies to exploit gaps in U.S. customs enforcement.\nCongress should codify the June 2026 executive order to make these changes permanent. Such a bill warrants bipartisan support because protecting U.S. manufacturers and rebuilding the manufacturing job base is a shared priority for policymakers. Furthermore, such a bill would protect American businesses and ensure that trade rules are enforced more consistently.\nGET WITH IT\nEnforcement alone will be insufficient, however, if customs authorities continue relying on systems designed for an earlier era of global commerce. Although recent executive actions, including the June 2026 customs enforcement order, authorize the destruction of counterfeit goods, expand electronic filing, and move the United States toward a better trade-processing system, Congress should pursue a broader effort to bring customs into the twenty-first century.\nThe Customs Modernization Act, which I introduced in 2023, aims to replace paper-based customs processes with comprehensive electronic filing. It also requires online marketplaces to provide verified seller and transaction data. The Trump administration has since built on these reforms by requiring importers of record—the entities legally responsible for imported goods—to maintain sufficient do", "translation_ja": "", "vocab": [{"word": "geopolitical", "definition": "国家間の政治的関係と地理的要因に関連する用語。軍事力や経済力と地政学的影響力の関係を説明する際に使用される。"}, {"word": "codify", "definition": "法律や規則として正式に体系化・制定することを意味する。行政措置を恒久的な法律に変換する文脈で使用される。"}, {"word": "durable", "definition": "長期間にわたって続く、または耐久性のある状態を示す。政策や枠組みの長期的な安定性を表現する際に用いられる。"}, {"word": "enforcement", "definition": "法律や規則を厳密に実施・遵守させることを意味する。税関や貿易規則の適用を強化する文脈で使用される。"}, {"word": "loophole", "definition": "法律や規則の抜け穴、つまり技術的には違反していない方法で規則を回避する手段。де minimis基準のような不備を指す。"}, {"word": "erode", "definition": "徐々に削減または弱体化させることを意味する。中国の低価格輸出による競争相手の産業能力の減少を説明する際に使用される。"}]}];
