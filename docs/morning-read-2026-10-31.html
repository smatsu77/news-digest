conomic stability in Europe\".\nIt said \"Ukraine will pay for this purchase with donations from Canada, Germany, and Norway via the JUMPSTART program and national funds, financed by the European Union's Ukraine Support Loan\".\nThe statement said the \"principal contractor\" would be American company Lockheed Martin, adding that \"no US funds are involved in this sale\".\nZelensky said earlier this week that his country had been waiting almost a month for the US to sign off on critical missile supplies.\nAnd in a Telegram post late on Friday, the Ukrainian president reported that earlier in the day Russian ballistic missiles had struck two of the country's regions.\n\"They continue to carry out terrorist strikes against our cities,\" he said.\nZelensky has recently admitted that Ukraine was running critically low on Patriots, as Russia was intensifying its attacks on key energy infrastructure ahead of winter.\nKyiv desperately needs the interceptors but there is a global shortage of the munitions due to their use by the US in its war against Iran.\nIt is not clear what the production schedule will be for the Patriots - but it is understood the order is for new builds rather than existing missiles, meaning there is unlikely to be any kind of rapid delivery to Ukraine.\nPatriots also have lengthy production times, with only 600 missiles produced per year according to the US Department of Defence.\nIn July, Trump said Washington had \"not agreed\" to license Ukraine to produce Patriots - three weeks after offering the country such a right.", "translation_ja": "", "vocab": []}, {"title_ja": "暗号資産大手バイナンス、北朝鮮関連ハッキングで63億ドル盗難の回収に奔走", "title_en": "Crypto giant Binance attempting to recover $6.3bn stolen in hack linked to North Korea", "summary_ja": "世界最大の暗号資産取引所バイナンスは、北朝鮮のハッキング部隊に関連すると見られる大規模なハッキングで63億ドルが盗まれたと発表しました。同社は盗難資産の約半分にあたる30億ドルを凍結することに成功しましたが、残りは身元不明のハッカーの手にあります。米シークレットサービスとFBIは、盗難資金の追跡・回収に向けて国際的な法執行活動を展開しています。", "summary_en": "The cyber-attack, which the company describes as complex, is believed to be the largest ever of its kind.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwe8lp7zy07zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Crypto giant Binance attempting to recover $6.3bn stolen in hack linked to North Korea\n- Published\nBinance, the world's largest cryptocurrency exchange, says it has frozen around half of the funds stolen in a \"complex\" hack, after $6.3bn (£4.7bn) was accessed in what is believed to be a record heist.\nThe firm said $3bn of its stolen digital assets had been secured - but many were still in the hands of unidentified hackers. It initially thought an engineer's laptop had been compromised, allowing unauthorised withdrawals, but later said the attack was wider.\nSeveral analytics firms have linked the hack, which eclipses a $1.5bn (£1.12bn) heist on the Bybit exchange in 2025, to a North Korean hacking unit.\nThe US Secret Service said it was \"working around the clock\" \"to identify, freeze, trace, and recover\" stolen funds.\nAmerica's lead federal agency for investigating financial crimes added that it would \"identify the cyber criminals responsible and bring them to justice\", while Binance also said it was working with the FBI.\nWhile Binance said its US-facing exchange was unaffected, the US would still have jurisdiction to investigate the hack and help track down stolen funds - an effort which generally involves a global law enforcement effort.\nThe hack also involved some US-linked assets, such as stablecoins Tether and Circle – cryptocurrencies pegged to the dollar.\nBinance told its users \"your money is safe, and we're covering every loss\".\nIt had initially suspended all deposits and withdrawals - but then said in an update that \"deposits remain unaffected\".\n- Who could be behind the Binance hack and what we know so far \n  - Published12 hours ago\nBinance's co-CEO Richard Teng said: \"This was not carried out by one person. Our initial investigation suggested that the security incident may have involved a compromised laptop, however our subsequent investigation has uncovered additional points of breach.\"\nTeng also describes how the hackers used \"a self-destruct mechanism that destroyed tooling and traces as they went, making it more difficult for us to trace and investigate\".\nInitially, the company had indicated the breach \"may have started with a compromised DevOps engineer's laptop\" but later statements have pointed to a broader breach.\nIn a later update, the firm set it had \"set aside\" more than $6.34B in company funds to cover the stolen assets and was \"actively buying\" a range of crypto tokens.\nThe Binance hack spooked cryptocurrency markets on Friday. The price of Bitcoin was down 5% to $76,800 in Friday afternoon trading in New York.\nCryptocurrency exchange Coinbase was down 12% as investors also reacted to earnings results in which the firm reported revenue slightly below expectations. Robinhood, a financial services company that trades in cryptocurrency, was down 7.8%.\nBinance, which was founded in China in 2017, allows users to trade digital assets and is estimated to have more than 300 million registered users worldwide.\nThe company said in 2024 that it had more than $160bn in assets under its custody.\nA lot of the fear right now from Binance users - and the crypto industry at large - is whether or not Binance will actually be capable of covering this enormous financial loss.\nThe company has said repeatedly that customer funds will be covered and that the firm is strong enough to weather the storm.\nBut crypto history watchers have been pointing out online that this is exactly the kind of message that FTX CEO Sam Bankman-Fried gave before his crypto exchange collapsed in 2022, leading to huge losses for customers and the industry.\nSeveral experts have warned customers not to regard Binance's promise to cover losses as legally sta Pike says she woke up 'confused and in pain' after failed execution\n- Published\nUS death row inmate Christa Pike has released her first public statement since her botched execution in September.\n\"There hasn't been a moment since that night when I haven't been in pain,\" she said in the statement.\n\"My body hurts. My arms hurt. My hands hurt. My throat hurts. I still struggle to speak. And the pain isn't just physical. There is pain in my mind and in my soul.\"\nPike, 50, was discharged from hospital at the end of last month after surviving two lethal injections of the drug pentobarbital, which left her in a critical condition.\nShe has since been sent back to the prison where she has spent the last 30 years for murdering Colleen Slemmer in 1995.\nPike is thought to be the only person to survive an execution attempt by lethal injection.\n- I've seen nearly 500 executions - but never one like Christa Pike's \n  - Published2 October\n- What happened in Christa Pike's failed US execution, and how did she survive? \n  - Published8 hours ago\n\"I am recovering, and I know that I am getting stronger,\" she said in her statement on Friday. \"But healing is not the same as being okay.\"\nHer lawyers previously said she had suffered from pneumonia following the attempted execution, had significant swelling on her arms and was also unable to swallow.\nPike was 18 when she and her then-boyfriend, Tadaryl Shipp, beat, tortured and killed 19-year-old Slemmer, whom they had met at a job training camp for low-income young people.\nShipp was spared the death penalty because he was not legally an adult when the crime was committed. He remains in prison.\nPike's botched execution captivated and shocked the world last month and shocked Pike, too.\n\"I had not contemplated life beyond that night, and I'm deeply hurt by the incompetence that has put so many people in this terrible position,\" she said in her statement.\nBethany Mann, a friend of Pike's and a founder of Child Arise Tennessee, which supports children and families affected by parental incarceration, told the BBC on Friday that she had been in direct contact with Pike since the botched execution attempt.\nWhen asked about her reaction to Pike's statement, Mann said: \"Truthfully, I don't know that I have anything to add to what Christa has already expressed so powerfully herself, and I want to be respectful of her privacy.\"\nTennessee Governor Bill Lee paused all executions for the remainder of the year and ordered an independent review to \"determine exactly what occurred\".\nLee was asked by reporters this week about a potential second execution attempt. \"I suspect her sentence will be the same as before unless determined otherwise by the courts,\" he responded.\nSpeaking about the state's response to what happened to Pike, Mann said: \"I find it deeply troubling that, even after what Christa endured, Governor Lee has shown little public willingness to reconsider the death penalty itself, rather than simply the procedures used to carry it out.\"\nShe added: \"What happened to Christa is not an isolated tragedy, nor should this conversation begin and end with her.\"\nThe Tennessee Department of Correction has not explained why the execution did not go as planned, though it has defended the method it used.\nIt declined comment on Pike's statement when contacted by the BBC.\nSlemmer's mother, May Martinez, was among those pushing for Pike to be put to death and attended the botched execution, later calling it a \"mess\".\nShe told a local ABC News affiliate in Florida, where she lives, that she thinks the state owes her an apology.\n\"All I wanted was justice,\" Martinez said.\nPike was the first woman scheduled to be executed in the state of Tennessee in over 200 years.\nHer lawyers have spent decades appealing her case. In the days leading up to her scheduled execution, both the US Supreme Court and Lee declined to block the execution.\nThe attempted execution of Pike was not the first in Tennessee in 2026 that did not go to plan.\nThe execution of Tony Carruthers, who was convicted of kidnapping and murdering three people in 1994, was postponed in May after staff were unable to find a vein for a lethal injection. He was granted a year's reprieve by the governor.\nIn 2022, more than a third of executions across the US were botched or highly problematic, according to the Death Penalty Information Center, which does not take an ethical stance on the penalty.\n  - Published8 October", "translation_ja": "", "vocab": []}, {"title_ja": "スコットランド警察がアンドルー王子とエプスタイン氏のバルモーラル城訪問について「積極的な捜査」を実施中", "title_en": "Police Scotland carrying out 'active inquiries' into Andrew and Epstein Balmoral visits", "summary_ja": "スコットランド警察は、アンドルー・マウントバッテン=ウィンザー王子、故ジェフリー・エプスタイン氏、ギスレーン・マクスウェル氏のバルモーラル城での活動について捜査を行っていると発表した。スコットランド警察のスポークスマンは、女性が王室の邸宅に人身売買されたという疑惑に関連していると述べ、捜査は初期段階にあると説明した。2006年のフライトログと1999年に撮影されたと思われる写真により、エプスタイン氏とマクスウェル氏が複数回バルモーラル城を訪問したことが確認されている。", "summary_en": "The force said it had received information and stressed its inquiries were at \"an early stage\".", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqglwp088532o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Police Scotland carrying out 'active inquiries' into Andrew and Epstein Balmoral visits\n- Published\nPolice Scotland is making inquiries into the activities of Andrew Mountbatten-Windsor, Jeffrey Epstein and Ghislane Maxwell during their time at Balmoral Castle.\nThe Daily Express reported, external that the inquiry relates to allegations that women were trafficked to the royal residence in Aberdeenshire.\nSex offender Epstein - who died in 2019 - and Maxwell, who was jailed in 2022 for sex trafficking, are understood to have visited the castle with Mountbatten-Windsor, who has previously denied any wrongdoing.\nPolice Scotland said inquiries were at \"a very early stage\" and that it would be inappropriate to comment further.\nRepresentatives of Mountbatten-Windsor have been contacted for comment.\nThe Royal family traditionally spend summer at Balmoral, where Queen Elizabeth II died in 2022.\nAsked about the Express report, a Police Scotland spokesperson said: \"We have received information and active inquiries are ongoing but these are at a very early stage.\n\"All inquiries are evidence led, with the needs of victim survivors at the heart of those inquiries.\n\"We would never confirm details of ongoing inquiries and it would be inappropriate to comment further.\"\nIn February, the force said it wanted to \"speak to anyone with information\" about Epstein's private jet using Edinburgh Airport.\nAt the time officers said they had not received any reports or complaints in relating to the trip.\n- Epstein's UK flights had alleged British abuse victims on board - BBC investigation \n  - Published15 December 2025\n- Email by 'A' from 'Balmoral' asked Ghislaine Maxwell for 'inappropriate friends', Epstein files show \n  - Published23 December 2025\n- Prince Andrew hosted Epstein, Maxwell and Weinstein at Royal Lodge \n  - Published27 October 2025\nFlight logs show Mountbatten-Windsor and Maxwell flew from Luton to Edinburgh on Epstein's private jet with two other passengers on 1 September 2006.\nAn image believed to show disgraced financier Epstein and former socialite Maxwell at Balmoral was also released by US prosecutors during her sex trafficking trial.\nIt is thought to have been taken in 1999, when Mountbatten-Windsor reportedly invited the couple to stay at the castle.\nEpstein and Maxwell were reportedly regular guests at royal residences in the late 1990s and early 2000s.\nLast year, the so-called Epstein Files were released by the US Department of Justice.\nAmong them was an email from someone named 'A' to Maxwell which said they were at Balmoral and asked for \"new inappropriate friends\".\nThe message, sent to Maxwell on 16 August 2001, begins: \"I am up here at Balmoral Summer Camp for the Royal Family.\"\nLater in the email, the sender asks: \"How's LA? Have you found me some new inappropriate friends?\" before signing off \"see ya A xxx\".\nJeffrey Epstein was 66 when he died by suicide in 2019 in a US prison while awaiting trial for sex trafficking charges.\nMaxwell, 60, was jailed for 20 years in 2022 for her role in procuring girls for Epstein.\nLast October it was confirmed Andrew had been stripped of his \"prince\" title and would be leaving his Windsor mansion, Royal Lodge.\nIn February he was arrested on suspicion of misconduct in public office, in the wake of information that emerged from the Epstein files in the US, and later released.\nEarlier this month it emerged he was taking legal action against Thames Valley Police over search warrants issued before his arrest.\nMountbatten-Windsor has consistently denied any wrongdoing linked to his association with Epstein.\nAsked about the latest reports, Scottish First Minister John Swinney said: \"I understand the seriousness of the points that have been made and the concern that has been expressed.\n\"This is an operational matter for Police Scotland to fully and comprehensively investigate and I'm very confident that's exactly what Police Scotland will do.\"\nPrime Minister Andy Burnham said he did not want to comment on the police inquiries, which \"should properly be independent\".", "translation_ja": "", "vocab": []}, {"title_ja": "ドライバー、引きずられた校長の死で有罪判決", "title_en": "Driver guilty of dragging head teacher to his death", "summary_ja": "35歳の男性ドライバー、シモン・リチャードソンは、自転車で帰宅中の56歳の校長マイケル・マリンズ氏を車ではね、1マイル以上にわたって引きずって殺害した罪で有罪判決を受けました。事件は2024年4月20日にグレーター・マンチェスターで発生し、リチャードソンは危険運転罪も問われています。月曜日のマンチェスター・ミンシュル・ストリート王立裁判所で量刑が言い渡される予定です。", "summary_en": "Simon Richardson is convicted of murdering head teacher Michael Mullins and will be sentenced on Monday.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6e3xg5we9eyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Driver guilty of dragging head teacher to his death\n- Published\nWarning: This article contains distressing content\nA man has been found guilty of murdering a head teacher who was dragged to his death for more than a mile while trapped under the wheels of a car.\nSimon Richardson crashed into 56-year-old Michael Mullins, who was cycling home from his job at Stretford Grammar School on the evening of 20 April in the village of Warburton in Trafford, Greater Manchester.\nProsecutors claimed Richardson, 35, fled the scene of the crash before stopping to try to dislodge the injured but still-living cyclist and then driving on with Mr Mullins still lodged underneath the vehicle.\nRichardson was also convicted of dangerous driving and will return to Manchester Minshull Street Crown Court to be sentenced on Monday.\nThere were shouts of \"Yes!\" from the court's public gallery as the guilty murder verdict was announced.\nOthers could also be heard crying.\nThe judge, Mrs Justice Brunner KC, told Richardson that there was only one sentence for murder, namely life imprisonment.\nIn a statement released after the verdicts had been returned, Mr Mullins' family described him as \"an anchor\", \"the perfect dad\" and \"our everything\".\n\"My past, present and future have been brutally and callously torn apart,\" said his widow.\n\"My memories of being with Michael through the rough and the smooth are now permanently tainted with sadness.\"\nMr Mullins' son described his late father as \"the type of Dad that would show up to everything\".\nHe said: \"Our last exchange of words together before he dropped me at the station was him reminding me of how proud he was of me.\"\nMr Mullins' daughter added: \"I made a promise in those first days that I would live the rest of my life for my Dad and give myself the life he had started to see me grow into and wanted for me.\n\"I am here telling you all that my Dad was and always will be our everything.\"\nThe court heard Richardson, of no fixed address, had driven through \"give way\" markings at a junction in Warburton before colliding with the father-of-two, who went under the Volvo XC90.\nRichardson then drove off before stopping in a country lane and twice getting out of the vehicle in attempts to pull Mr Mullins free, the jury was told.\nHe then mounted the grass verge in his Volvo and finally dislodged him before reversing over Mr Mullins, causing \"crushing\" chest injuries.\nRichardson's cousin Gabrielle Debotte, who was a passenger in the front seat of the car, previously told the court that both of them had heard \"moaning\" shortly after the collision in Paddock Lane and that he had gone on to say: \"He is under the car.\"\nThe prosecution claimed Mr Mullins' injuries were caused by \"dragging and crushing\" rather than the impact of the crash itself.\nProsecutor Phil Barnes KC told jurors: \"Simon Richardson knew he was there and he inevitably knew what the consequences of driving on would be, and he did it anyway.\n\"For a split second after the collision, for a brief moment he possibly thought about doing the right thing and getting out and taking ownership of what he had just done and help the man he had just run down.\n\"But Simon Richardson did not get out. He did not do the right thing. He chose to drive away.\n\"The obvious reason is because he wanted to escape the consequences of what he had just done.\"\nA motorcyclist followed a trail of blood and discovered Mr Mullins alone and barely breathing as he lay on a grass verge in a secluded country lane in Lymm, Cheshire.\nThe head teacher was pronounced dead at the scene shortly afterwards by emergency services.\nRichardson was arrested the next day following a police chase.\nHe denied murder as he claimed he did not realise Mr Mullins was underneath his car and said he did not get out of his vehicle in a bid to free him.\nBut jurors did not believe him and found him guilty of murder.\nMrs Justice Brunner KC thanked members of the jury and acknowledged their job \"cannot have been easy\".\nShe discharged the jurors from taking jury service again for 10 years and told them: \"This was, I know, an upsetting case and there was evidence which you may have found distressing.\"\nGet in touch\nTell us which stories we should cover in Greater Manchester\nListen to the best of BBC Radio Manchester on Sounds and follow BBC Manchester on Facebook, external, X, external, and Instagram, external. You can also send story ideas via Whatsapp to 0808 100 2230.\nRelated stories\n  - Published8 hours ago\n  - Published21 October\n  - Published20 October", "translation_ja": "", "vocab": []}, {"title_ja": "イアン・マッケレン、86歳で亡くなったパトリック・スチュワート卿への追悼の辞を述べる", "title_en": "Sir Ian McKellen leads tributes to 'beloved actor' Sir Patrick Stewart after his death at 86", "summary_ja": "スター・トレックのキャプテン・ピカード役で知られるパトリック・スチュワート卿が86歳で亡くなりました。アルツハイマー病とレビー小体型認知症との闘病の末の死亡でした。X-MENの共演者であるイアン・マッケレンをはじめ、ウィリアム・シャトナーやジュディ・デンチなど、多くの著名人から追悼の声が上がっています。", "summary_en": "The actor died in Los Angeles following a \"a brief and poignant journey\" with Alzheimer's Disease and Lewy Body Dementia.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm20v3029p5xo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Sir Ian McKellen leads tributes to 'beloved actor' Sir Patrick Stewart after his death at 86\n- Published\nSir Ian McKellen has led tributes to Sir Patrick Stewart following his death at the age of 86, calling him \"the most respected and beloved actor of his generation\".\nTributes to the renowned British actor have poured in since his death at his Los Angeles home after \"a brief and poignant journey\" with Alzheimer's disease and Lewy Body Dementia was announced on Thursday.\n\"He wore his heart on his sleeve, which made him a man to rely on, to admire and, in my case, love,\" Sir Ian, Sir Patrick's X-Men co-star, said.\nFamous for his role as Captain Jean-Luc Picard in Star Trek, Sir Patrick was a versatile actor who won multiple awards, balancing Hollywood roles and a career in classical theatre.\n- Sir Patrick Stewart: Actor who moved effortlessly between Star Trek and Shakespeare \n  - Published20 hours ago\n- 'RSC was where Sir Patrick Stewart felt at home' \n  - Published10 hours ago\nWilliam Shatner, who also helmed the USS Enterprise in Star Trek, said Sir Patrick brought \"intelligence, grace and a deep sense of humanity to everything he did\".\n\"Captain Picard stood for the best of us and so did the man who played him. I was filled with affection and admiration for him and his work,\" Shatner added.\nStewart depicted Picard in more than 170 episodes of the hit sci-fi TV series between 1987 and 1994, as well as in four feature films. He returned to the role for Star Trek: Picard in 2020.\nDame Judi Dench said she was \"shocked\" and \"very sad\" to hear of Sir Patrick's death, adding: \"He's never been one of those actors who never felt like it that night, he was always very, very committed... He'll be much missed and he was much admired.\"\nGeorge Takei, who played Hikaru Sulu in Star Trek, said the actor \"inspired a whole next generation of star-gazers who looked longingly ahead to a brighter future for all humanity\".\nSir Patrick would later be celebrated for his portrayal of Professor Charles Xavier - most commonly known as Professor X - in the X-Men film franchise.\nHugh Jackman, who starred alongside him in the franchise, called him a \"tremendous friend and man\", saying: \"We lost one of the greats of stage and screen today.\"\nSir Ian, a longtime friend of his X-Men co-star, who officiated his wedding in 2013, said Sir Patrick was \"defined by being born and bred in Yorkshire\".\n\"You could hear it in his accented voice and in the stern honesty with which he told you what he thought and felt. Yorkshiremen have no truck with half-truths or avoidance of big issues.\"\nSir Ian recalled first meeting Sir Patrick as young actors in the Royal Shakespeare Company (RSC) and how he had expressed caution over him taking on the Star Trek role.\n\"He took the risk and thank goodness for us all that he did,\" said Sir Ian, who appeared with Sir Patrick in a 2009 theatre production of Waiting for Godot.\nHe added that while the US had become Sir Patrick's \"adopted home\", he \"never forsook his origins\" growing up in Yorkshire, and said \"the proudest achievement of the most respected and beloved actor of his generation on either side of the Atlantic, was his appointment as chancellor of Huddersfield University\".\nSir Ian noted that Sir Patrick's final film appearance will be as Professor X in the upcoming Avengers: Doomsday film. Marvel Studios described him as \"a singular talent, a generous collaborator and a true gentleman\".\nThe Academy dubbed his voice \"unmistakable\", adding: \"Whether commanding the bridge of the Enterprise or guiding a generation of young mutants, Sir Patrick Stewart brought a tenderness to his characters that made us feel we knew them.\"\nSir Patrick died on Wednesday \"in the loving care of his wife\", a statement from his family said. \"We will forever cherish the peaceful ease and reflection on his face, an enduring reminder of his invincible grace,\" it added.\nThe veteran actor is survived by his wife, Sunny Ozell, as well as by his two adult children from his first marriage, Daniel and Sophie Stewart.\n'One of greatest stage actors ever seen'\nBorn in the town of Mirfield in 1940, Sir Patrick's love of drama began at school where he was introduced to Shakespeare and his first public performance was in a local church production of Cinderella.\nHe threw himself enthusiastically into the flourishing local theatre. \"I used to recite Shakespeare from memory,\" he said. \"I just learned all these big speeches.\"\nWhen Sir Patrick was knighted by Queen Elizabeth II in 2010, he said he owed \"literally everything\" to his former English teacher who first encouraged him to perform.\nHis first foray into professional acting was when he joined the RSC in 1966, going on to play King John, Oberon in A Midsummer Night's Dream and Henry IV.\nThe RSC described him as a \"colossus of both stage and screen\", remembering him as \"one of the finest classical Shakespearean actors of his generation\" whose contribution to the company was \"beyond measure\".\nDame H", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランド：解任された裁判所長官を巡り抗議者と警察が衝突", "title_en": "Poland: Protesters clash with police over sacked court chief", "summary_ja": "ポーランドの憲法裁判所の長官ボグダン・シュビェチコフスキー大統領と副長官が1ヶ月間の停職処分を受けたことを受け、金曜夜に抗議者が同裁判所の外に集結し、警察が出動した。トゥスク首相は「法の支配の回復」を強調し、右派の前政権PiS党が任命した政治的に偏った裁判官らの改革を進めている。", "summary_en": "Polish Prime Minister Donald Tusk defended the firing of top court President Bogdan Swieczkowski as a move to \"restore the rule of law.\"", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/poland-protesters-clash-with-police-over-sacked-court-chief/a-79813882?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Poland: Protesters clash with police over sacked court chief\nOctober 31, 2026\nProtesters gathered outside Poland's Constitutional Court on Friday night, with authorities sending police to the scene to secure the court's grounds.\nIt all comes after a statement appeared on the top court's website saying President Bogdan Swieczkowski and his deputy had been suspended for one month. Fellow judge Anna Korwin-Piotrowska will lead the institution during this period.\nAccording to Warsaw police, officers responded to one judge who alerted them to possible threats to the safety of judges and staff.\nTusk vows to 'restore rule of law'\nSwieczkowski is one of a slew of politically aligned judges who were appointed by the right-wing conservative Law and Justice Party (PiS), which governed Poland from 2015 to 2023.\nPolish Prime Minister Donald Tusk backed the move in a post on X.\n\"Restoring the rule of law is our duty,\" Tusk said.\n\"After years of PiS-led lawlessness, this is a difficult process, sometimes painful, and it requires decisive action. There is no other way,\" he added.\nWhen Tusk's center-left alliance took over after the 2023 parliamentary election, the group announced it would reverse controversial PiS government reforms in the judiciary.\nPresident cancels trip abroad\nRight-wing Polish President Karol Nawrocki reacted to the situation by canceling a planned trip to Senegal.\n\"At a moment like this, the president must be in Poland,\" Nawrocki said.\nBut in recent months, Nawrocki had refused to swear in five top court judges nominated by parliament.\nWhen these judges instead took their oath before parliament, Swieczkowski had denied them access to the building.", "translation_ja": "", "vocab": []}, {"title_ja": "カナダのマーク・カーニー首相、米国への過度な依存を認識 EU とのより緊密なパートナーシップを模索", "title_en": "Canadian PM Mark Carney discusses talks with the EU, overdependence on the US and how to deal with Donald Trump in a DW interview.", "summary_ja": "カナダのマーク・カーニー首相は、EU指導部との協議後、カナダが米国への経済的依存が過度であることを認め、EU との新たなパートナーシップ構築の必要性を述べました。フォン・デア・ライエン欧州委員会委員長が提案する「準加盟国」の地位について、カナダとEUの間で最も緊密な協力関係を構築することを目指していると述べています。カーニー首相は、米国との同盟関係を維持しつつも、ヨーロッパとの協力の深化により、カナダの経済的多角化と強化を進める方針を示しました。", "summary_en": "Prime Minister Mark Carney tells DW that Canada is seeking closer EU ties to \"diversify and deepen\" partnerships beyond the Americas. Despite German pushback, he said he favors the all-new term \"associate membership.\"", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/canadian-pm-mark-carney-discusses-talks-with-the-eu-overdependence-on-the-us-and-how-to-deal-with-donald-trump-in-a-dw-interview/a-79811469?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Mark Carney: Canada has 'learned we are overdependent on the US'\nOctober 30, 2026\nCanadian Prime Minister Mark Carney spoke to DW on Friday after talks in Montreal with European Union leaders seeking to hammer out details of a new, closer partnership between Canada and the EU.\nAmid difficult negotiations with US President Donald Trump, representing Canada's biggest trading partner, Carney said that he and his compatriots had come to realize the country was too dependent on the economic powerhouse to the south.\n\"The lesson we've taken, Canadians as a whole, is we're overdependent on the United States. Too closely connected to the United States. And we need to build our strength here at home and diversify and deepen our partnerships with like-minded countries internationally,\" Carney said.\nWhat did Carney say about EU talks and closer ties to the bloc?\nAn EU delegation led by European Commission President Ursula von der Leyen and European Council President Antonio Costa held talks with Carney and other Canadian officials in Montreal on Friday.\nThey're discussing the plans floated by Commission President Ursula von der Leyen to forge what she called an \"associate membership\" — a status that does not yet exist for any other country — even as German Chancellor Friedrich Merz's government resists creating this label. Carney seemed to speak in its favor.\n\"Well, I think the advantage of what we're doing is that a few things are absolutely clear, irrespective of the exact terminology that's used. President von der Leyen uses associated membership. We use associated membership,\" he told DW's Katharina Kroll at Port of Montreal Tower.\n\"What does that mean? It means the closest possible partnership without being a full member of the European Union, because Canada is not in Europe geographically and therefore cannot have accession.\" Carney said.\nWhat scope for EU-Canada cooperation does Carney see?\nAsked if he was looking to create a \"new transatlantic bloc without the US,\" Carney said it was more about diversifying and deepening Canada's other partnerships than excluding by far its largest trading partner.\n\"We're both partners of the United States, obviously close partners, alliance partners in NATO. And there are many, many opportunities for cooperation with the United States,\" he said. \"But in many cases, there'll be much deeper cooperation for Canada between Canada and Europe than Canada and the United States.\"\nHe mentioned both existing areas of cooperation like the Comprehensive Economic and Trade Agreement (CETA), calling it \"one of the most successful free trade agreements in the world,\" and also pointed to research cooperation and programs like Horizon Europe and Erasmus+ enabling student exchanges.\nBut Carney also pointed to areas where the two sides could seek to expand cooperation, naming areas like space technologies, artificial intelligence and critical minerals.\nIs Canada concerned the talks could alienate the US, or Trump?\nDespite his well-documented difficulties with Donald Trump — perhaps most crudely exemplified by Trump's attempts to unilaterally rename Lake Ontario, or his posting AI videos imagining him as an ice hockey player beating Carney up in a fight — Carney said US-Canadian ties were too deep to be derailed by any governments or prime ministers or presidents.\n\"The bonds between Canadians and Americans are longstanding. They're very strong. And big elements of that will be maintained regardless of the government in Canada, the government in the United States, the combination of the two,\" he said.\nAsked about the best way to deal with Trump, Carney said it was \"to be direct, to be clear, to be absolutely clear about your bottom lines are.\" He said it was important to show respect but also to continue to bring \"the negotiations back to the core issues.\"\nBut he said the tensions with Trump had demonstrated the need to diversify and to seek Canada's other most natural partners around the world.\nHe acknowledged that no matter the nature of the talks with the EU, \"the scale of the relationship with the United States\" would be \"very hard to replace.\"\nAsked if he was concerned that the talks could expose him to further tariffs or other punitive measures from the Trump administration, Carney said, \"We've been living with this for some time.\"\n\"There have been many justifications for trade action against Canada that the United States has had,\" he said. \"Our view is that all of them are unjustified under our trade agreement.\"\nCarney said the crucial message, also for the Trump White House, was that the talks with Brussels concerned a \"positive association\" and partnership \"to help solve global problems\" and address global challenges.\n\"It's not against somebody. It's for. It's a positive act,\" he said.\nDW's Katharina Kroll conducted the interview in Montreal.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verifi", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ：戦禍に見舞われたオレシキから住民が避難", "title_en": "Ukraine: Oleshky residents evacuate war-ravaged city", "summary_ja": "ウクライナ南部ヘルソン州のロシア占領下にあるオレシキから、10月30日に住民の避難が行われました。メラニア・トランプ米大統領夫人とレオ14世教皇の仲介により実現した停戦協定に基づき、推定2,000人の残存住民のうち750人以上が安全に避難しました。避難者たちはウクライナ領土、ロシア領土、または都市内の残留を選択でき、この人道的活動は日曜夕方まで続く予定です。", "summary_en": "Under the local ceasefire, an aid convoy of 25 buses arrived with humanitarian aid and as transport for fleeing Oleshky residents. The Ukrainian city has been occupied by Russia since 2022 and faces food shortages.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-oleshky-residents-evacuate-war-ravaged-city/a-79812327?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Ukraine: Oleshky residents evacuate war-ravaged city\nOctober 30, 2026\nResidents of Russian-occupied Oleshky, in Ukraine's southern Kherson region, evacuated the war-torn city on Friday.\nThe evacuations come in the fourth day of a ceasefire in the city, the most significant truce since Russia's full-scale invasion of Ukraine over four years ago.\nThe local ceasefire was brokered by US first lady Melania Trump. Pope Leo XIV also participated in deliberations with Russian and Ukrainian leaders to allow aid deliveries and civilian evacuations.\nUnder the ceasefire deal, an aid convoy of 25 buses, some ambulances, trucks and other vehicles arrived in the city earlier on Friday to deliver food and medicine to residents.\nDemining operations preceeded the aid convoy's arrival, with a Russian sapper and one other person killed in the process.\nOfficials from both Ukraine and Russia came to gether in the rare joint humanitarian effort, which is expected to continue through Sunday evening.\nHow did the evacuations take place?\nAccording to the plan, an estimated 2,000 remaining Oleshky residents were offered the choice of traveling to Ukrainian-held territory, Russian-held territory, or to remain in the city with replenished food and medical supplies.\nIf residents chose to go to Ukraine, they would travel 450 kilometers (280 miles) through Russian-held Crimea to reach the city of Anapa in southern Russia. Then they would fly to Belarus before crossing the border into northern Ukraine.\nRussia's lead representative on the mission, Yana Lantratova, said buses would transport residents who want to live in Russia.\nIt remained unclear how many people chose to leave the city, but Melania Trump posted on social media that the convoy had safely evacuated more than 750 people.\nHarrowing conditions\nOleshky residents have spoken of the harrowing conditions they have had to suffer in the city, such as traveling along mine-strewn roads in search for food and water.\n\"The problem is that a lot of people are staying,\" one woman told Ukraine's human rights ombudsman Dmytro Lubinets.\n\"I've been told that it's their own choice,\" Lubinets replied. \"At the very least, we'll do what we can to ensure that somehow humanitarian aid gets through.\"\nLubinets was in charge of coordinating the operation with Lantratova.\nThe pair appeared side by side to address reporters and were cordial to one another, something not seen between Russian and Ukrainian officials since the start of the war.", "translation_ja": "", "vocab": []}, {"title_ja": "2つの州で有権者が下院議員を順位付け投票—ランク付け投票制が説明される", "title_en": "Ranked choice voting explained as voters in 2 states rank congressional picks", "summary_ja": "ランク付け投票制は長年にわたって投票方法として成長しており、専門家はこの方式が有権者により良い機会を提供して意見を反映させることができると述べています。ABCニュースは、2つの州で有権者が議員候補を順位付けして投票する動きについて報道しています。", "summary_en": "Ranked choice voting has grown as a voting measure for years, and experts say it presents voters with a better opportunity to reflect their opinions.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/ranked-choice-voting-explained-voters-2-states-rank/story?id=137476649", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABC ニュース ライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは24時間体制で速報ニュースと生中継イベントをカバーしています。最新のニュース情報をリアルタイムでお届けします。世界中の重要なニュースや事件を常時監視しています。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セルマ・ブレア、逮捕数週間後に動画で謝罪「真摯に受け止めています」", "title_en": "Selma Blair apologizes in video weeks after arrest: 'I take this very seriously'", "summary_ja": "セルマ・ブレアが逮捕から数週間後に動画で声明を発表し、謝罪の意を示しました。彼女は「この状況を真摯に受け止めている」とコメントしています。", "summary_en": "Selma Blair is speaking out weeks after her arrest.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Culture/selma-blair-apologizes-video-weeks-after-arrest/story?id=137723047", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シンクホール、傷ついた大地、そしてスケープゴート：ヨハネスブルグの違法金採掘の脅威", "title_en": "Sinkholes, scarred land and scapegoats: the scourge of illegal gold mining in Johannesburg", "summary_ja": "ヨハネスブルグ近郊の放棄された鉱山で違法採掘（ザマザマ）が急増している。金価格の上昇に伴い活動が激化し、警察の取り締まりは十分ではなく、研究者は数万人の違法採掘者がいると推定している。貧困、失業、腐敗した当局者との関係が問題の根本にあり、採掘企業による鉱山の適切な封鎖義務の不履行も原因となっている。", "summary_en": "There is no end in sight for the drivers of illegal mining, while police action appears ineffective Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has s", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/business/2026/oct/30/sinkholes-scarred-land-scapegoats-illegal-gold-mining-johannesburg", "state_media": false, "category": "社会", "full_text": "Cora Bailey has been encountering illegal miners ever since she first started treating injured animals in the townships around Roodepoort, west of Johannesburg, in 1991. But as the price of gold has soared, so too has activity in the abandoned mine shafts that mark the area.\nIn late September, dozens of zama zamas – the name given to illegal miners in South Africa, meaning roughly “to take a chance” in Zulu – arrived to dig for gold across the dirt road from her charity, Claw (Community Led Animal Welfare).\nSoon, they were taking water for their panning and processing from the organisation’s two 25,000-litre water tanks, which are filled irregularly by the city government for the 100 or so rescued and injured animals on site.\n“We’ve asked them really nicely and haven’t ever refused them water to drink … But, for the first time ever, we closed the gate at 12 [midday], because we literally had about two buckets of water left,” Bailey said in mid-October.\nPolice told her that the scale of the illegal mining was too big for them to do anything about, she said at the time. About a week later, officers sheared away the grass that had partly hidden the zama zamas. But within a few days a smaller group had returned, although Bailey said they were now taking Claw’s water only for drinking.\nSouth Africa’s police regularly trumpet their success in tackling illegal mining. On 19 October, they said they had arrested 71 suspected zama zamas across the country in the previous week.\nHowever, researchers put the number of illegal miners in the tens of thousands. In 2019, Marcena Hunter, a researcher at the Global Initiative against Transnational Organised Crime, estimated that a tenth of South Africa’s gold production, worth about $1bn, was being exported illegally.\nPolice operations have also led to tragedy. In 2025, 93 bodies were pulled from a mine shaft in Stilfontein, after officers blocked food and water from being delivered underground.\nMeanwhile, there is no end in sight to the dynamics driving illegal mining, including the high price of gold, poverty, unemployment, corrupt politicians and police profiting, and the failure of mining companies to fulfil their legal obligation to seal mining shafts when they cease operating.\nSouth Africa’s modern history is tied to mining. In 1884, gold was found on a farm, sparking a gold rush that led to the creation of Johannesburg. Gold production peaked in the 1970s, but South Africa was the world’s largest producer, a title it held for more than a century, until 2007.\nIn 2009, Morris Viljoen, a geology professor at the University of the Witwatersrand, estimated that the reef that gave the university its name had produced more than a third of the gold ever mined globally. Claw is housed in the old offices of the Durban Deep mine, which shut at the turn of the century, having once lent its name to an Elton John song.\nThe city government claims there is still 40,000 tonnes of gold underground in the region. But, with the remainder lying ever deeper, the costs of recovering it have risen.\nMining companies are supposed to seal up old mine shafts and rehabilitate the environment around them. However, in 2025 there were “6,100 derelict and ownerless mines and 1,170 unsafe mine openings”, the mining minister, Gwede Mantashe, said in response to a parliamentary question.\nZama zamas have stepped into those voids left in the earth. While there is no comprehensive data on them, experts agree that a majority are from neighbouring countries, principally Lesotho, Mozambique and Zimbabwe.\nThe skyline south of Johannesburg is punctuated by the pale yellow ridges of mine dumps. Increasingly, the ground is also caving open.\nFor politicians seeking votes in local elections on 4 November, the culprit is clear: illegal miners. In May, Kenny Kunene, the Johannesburg council member responsible for transport, took journalists on a tour of sinkholes that he claimed were the fault of zama zamas, including a section of Wemmer Pan Road that had completely collapsed.\nThe road was once the main artery linking the city’s central business district to the south-eastern suburbs. In one section it has completely disappeared, now raw earth pitted with the holes where illegal miners have been digging.\nHowever, when it comes to sinkholes, experts say zama zamas are being scapegoated.\nRosalind Morris, an anthropology professor at Columbia University, who has worked extensively with illegal miners, noted that the porous dolomitic rock to Johannesburg’s south and west becomes unstable when water is removed.\n“The biggest culprit of sinkholes in South Africa is formal industrial mining, which dewaters at a scale of hundreds of millions of gallons of water removed from underground every day,” she said.\n“There are areas where there is a lot of residual gold, which are being very intensely mined by zama zamas, and some of that definitely causes structural collapse, there’s no doubt about it. But the idea that this was invent", "translation_ja": "", "vocab": []}, {"title_ja": "スーダン侵襲勢力支援疑惑でUAE外交官の国連事務総長候補が非難される", "title_en": "Sudanese diaspora and human rights groups denounce UAE nominee for UN top job", "summary_ja": "アラブ首長国連邦が国連事務総長候補に指名したラナ・ヌセイベ外交官が、スーダンの武装勢力ラピッド・サポート・フォース(RSF)への支援疑惑を否定していることに対し、スーダン系住民団体と国際人権団体が強く反発している。RSFはスーダン軍との戦争で虐殺行為を行っており、2025年10月のエルファシャ攻撃は国連から「ジェノサイドの特徴を持つ」と指摘されている。批評家らはヌセイベがUAEの利益を代表し、スーダン国民が最も必要とする国連の公正さに逆行する可能性があると警告している。", "summary_en": "Critics cite Lana Nusseibeh’s denial of accusations the UAE is fuelling Sudan war by supporting paramilitary RSF Members of the Sudanese diaspora and international human rights monitors have denounced the candidature of an Emirati diplomat for the top job at the UN, citing her denial of accusations ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/30/sudanese-diaspora-human-rights-groups-denounce-uae-nominee-un-top-job", "state_media": false, "category": "政治", "full_text": "Members of the Sudanese diaspora and international human rights monitors have denounced the candidature of an Emirati diplomat for the top job at the UN, citing her denial of accusations that the United Arab Emirates is fuelling the war in Sudan by supporting the paramilitary Rapid Support Forces.\nThe UAE nominated Lana Nusseibeh last week to replace the UN secretary general, António Guterres, as he finishes his second five-year term this year, upending a race that had become gridlocked.\nRights groups and others have for years documented evidence of UAE support for the RSF, which has been accused of atrocities during the course of its war against the Sudanese army, including an attack on the city of El Fasher in October 2025 that the UN said had “hallmarks of genocide”.\nNusseibeh, the UAE’s representative to the UN until 2024, has repeatedly reflected the UAE’s blanket denials of the accusations.\nThe Sudanese pro-democracy and women’s rights activist Hala al-Karib, the regional director of the Strategic Initiative for Women in the Horn of Africa, said Nusseibeh had “no track record of acting independently of her country’s role in Sudan” and that endorsement by the security council would amount “essentially [to] a denial of the genocidal acts committed in El Fasher by the RSF”.\nThere was also strong criticism of Nusseibeh’s candidature at a virtual briefing by the Avaaz human rights advocacy group on Tuesday.\nIbrahim Alduma, who grew up in El Fasher and is the co-founder of the human rights organisation Sudan Action Hub, told the briefing that success for Nusseibeh would result in people losing faith in the UN.\n“If this candidate [succeeds], how would we tell people on the ground that the United Nations is not an obstruction of the [rights of] the people of Sudan?” said Alduma. “How could the people – not only in Sudan, but other victims of wars and international criminals – trust that the UN will achieve some kind of justice?”\nHusam Mahjoub, a Sudanese advocate and co-founder of independent media Sudan Bukra TV, said: “Electing [the UAE’s] senior diplomat as secretary general would hand leadership of (UN) institutions to that government’s chief defender, at the very moment Sudanese civilians most need the UN to hold powerful states accountable.”\nKenneth Roth, a former executive director of Human Rights Watch, told the briefing: “She has been asked about the UAE’s role in arming and supporting the RSF, and she just blatantly denies it without regard to the facts. That is not what we need as UN secretary-general.”\nOn Wednesday, Bruno Stagno Ugarte, the chief advocacy officer at Human Rights Watch, said Nusseibeh’s dismissal of UN reports documenting the UAE’s links to the RSF had “seriously undermined justice and accountability for the victims”.\nIn a statement on Tuesday Nusseibeh said that if she got the top UN job she would support the work of UN fact-finding missions for accountability and transitional justice over the war in Sudan, and described the RSF’s crimes as “atrocious”.\nShe added that she had taken a leave of absence from her ministerial post in the UAE government to be “mindful of the obligations of independence” the UN role would entail, adding that “the horrific conflict in Sudan will be the litmus test of the success of an incoming secretary general”.\nTo become the next UN security general, a candidate must secure a minimum of nine affirmative votes out of the 15 security council members, and avoid a veto from the US, the UK, China, France or Russia, its permanent members.\nAn informal security council poll earlier his month had placed the former Costa Rican vice-president Rebeca Grynspan as the narrow frontrunner in the race. But she and all other candidates received two or more opposing votes from the permanent council members. The next straw poll could take place as soon as Friday, but the format and exact timing are still being negotiated by the diplomats.\nAt Tuesday’s briefing, Roth said: “It’s fair to say the RSF would not have been able to be nearly as successful militarily as it was and has been without that support from the UAE. And with that support, it didn’t just fight the Sudan armed forces. This wasn’t just a civil war. It committed mass atrocities.”\nHe added: “It amazes me that she’s being put forward. This is a completely unsuitable candidate.”\nKate Ferguson, co-founder and co-executive director of Protection Approaches, a charity working to prevent identity-based violence, said at the briefing: “There is not, as far as I have seen, sufficient evidence that this candidate is independent from the state from which she comes. And we must not be naive nor hide behind the pretence of naivety.\n“This is autocratic capture of our most significant multilateral institution.”\nAdditional reporting by Kaamil Ahmed", "translation_ja": "", "vocab": []}, {"title_ja": "エジプト、著名な編集者リナ・アッタラを罰金、独立系ニュース媒体マダ・マスルを閉鎖", "title_en": "Egypt fines prominent editor Lina Attalah and shuts independent news outlet Mada Masr", "summary_ja": "エジプト当局は著名なジャーナリストで「マダ・マスル」編集長のリナ・アッタラを拘束し、330万エジプトポンド（約5万3500米ドル）の罰金を科した後、彼女のウェブサイトの閉鎖を命じました。アッタラはライセンスなしでウェブサイトを運営したとして有罪判決を受け、独立系メディアへの弾圧が強まっています。国際的な人権団体は表現の自由が脅かされていると懸念を表明しており、エジプト当局による独立系メディア撲滅の意図を示唆していると指摘されています。", "summary_en": "Warnings of escalating clampdown on press freedom come after Cairo court convicts Attalah of managing an unlicensed website Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/28/egypt-lina-attalah-mada-masr-press-freedom-clampdown", "state_media": false, "category": "政治", "full_text": "Lina Attalah, a prominent Egyptian journalist and the editor-in-chief of the news outlet Mada Masr, has been released from detention by Egypt’s authorities and had her website ordered to be shut down by a court amid an intensifying crackdown on independent media in the country.\nAttalah was taken briefly into custody after a Cairo court convicted her of managing an unlicensed website, prompting fresh international concerns over press freedom in Egypt.\nAccording to Mada Masr, Attalah was released after the news outlet had paid a fine of 3m Egyptian pounds ($53,500; £40,100), prompting statements of support from global human rights groups.\n“Lina Attalah was released after we paid the said fine,” said her lawyer Hassan al-Azhari. “In the process, we discovered that she had been sentenced in absentia in 2024 to a year in prison, as well as a fine of 20,000 Egyptian pounds,” he told AFP.\nAttalah’s defence team had appealed that sentence, and a new court hearing was scheduled for 11 November, Azhari added.\nAttalah founded Mada Masr in 2013, after coming to international prominence in 2011 during the Arab spring. An advocate for press freedom, she has been arrested on a number of occasions.\nAttalah’s detention, and the ordered closure of Mada Masr – which says it had applied for a licence to operate three years ago and had no reply from Egyptian authorities – follows the arrest of the entire six-person team at the independent factchecking platform Matsadaash, who were charged with belonging to the outlawed Muslim Brotherhood.\nAttalah’s legal team suggested she had been, in effect, ambushed during a court appearance, with a judge appointing a defence lawyer for her before security personnel detained her in the courtroom.\nThe crackdown “can only mean that Egypt’s security agencies are moving from years of harassing independent media to wiping them out completely”, said Hossam Bahgat, the head of the Egyptian Initiative for Personal Rights (EIPR), who attended the court hearing.\n“This escalation validates our fears that the arrest and continued detention of the six Matsadaash journalists would signal a crackdown of unprecedented magnitude,” said Bahgat. “It risks fully eviscerating the narrow margin of press freedoms that have been carefully maintained in Egypt over the past decade, albeit amid great personal sacrifice – a margin that had allowed the continued operation of a handful of news outlets and human rights organisations despite frequent harassment, including through legal avenues.”\nAccording to EIPR, the recent moves against independent media follow an increasing frequency of statements from the Egyptian president, Abdel Fatah al-Sisi, since August claiming a conspiracy to destabilise the country. He has said he intended to remain in power until 2030 to protect Egypt from “traitors, criminals, and saboteurs”.\nReporters Without Borders said the court’s decision was “outrageous” and “shameful”, urging authorities to release Attalah “at once”. The Committee to Protect Journalists (CPJ) also condemned the verdict. Amnesty International said the verdict represented “a crushing blow to press freedom”.\nEgypt is among the top jailers of journalists globally, with 25 currently behind bars, according to the CPJ. Attalah’s lawyers took steps to challenge the ruling, with a hearing in a retrial of the case scheduled for 11 November.\nUnderlining concerns over the crackdown, Pen International issued a statement with several dozen civil society organisations condemning the moves.\n“Though this is the sixth case brought against Mada Masr in six years, this is the first time that a case of this nature has been referred to trial,” the writers’ association said. “For years, Egyptian authorities have leveraged their repressive and restrictive tactics against independent media outlets to harass journalists, restrict their operations and chill freedom of expression. To escalate to the step of referral to trial must be read as a clear intent to entirely shutter the independent media space, and to permanently close what remains.”", "translation_ja": "", "vocab": []}, {"title_ja": "マッキーモアの「フリー・パレスチナ」ツアー最終夜、ファンが支持を表明", "title_en": "Fans voice support on final night of Macklemore’s ‘Free Palestine’ tour", "summary_ja": "マッキーモアがパレスチナ支持を表明したことでエド・シーランのコンサートから追放された後、組織された「フリー・パレスチナ」ツアーの最終夜にアルジャジーラがファンに取材した。ファンたちはなぜこのツアーに参加したのかについて語った。", "summary_en": "Al Jazeera spoke to fans attending Macklemore’s ‘Free Palestine’ concert after he was dropped from Ed Sheeran’s tour.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/30/fans-voice-support-on-final-night-of-macklemores-free-palestine-tour?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Fans voice support on final night of Macklemore’s ‘Free Palestine’ tour\nNewsFeed\nFans voice support on final night of Macklemore’s ‘Free Palestine’ tour\nAl Jazeera spoke to fans about why they came to Macklemore’s ‘Free Palestine’ tour, which was organised after he was expelled from Ed Sheeran’s concerts in the US after voicing his support for Palestine.\nPublished On 30 Oct 2026", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランド最高裁判所長官の職務停止後、警察が配備", "title_en": "Polish police deployed to top court after head judge suspended", "summary_ja": "ポーランドの憲法裁判所の長官ボグダン・シュビェチコフスキーが職務停止となり、抗議デモが発生。警察は裁判所の敷地内に展開し、デモ参加者3人を拘束した。この職務停止は、前政権による裁判所の政治化をめぐる長年の紛争の一環であり、現政府は司法の独立回復に向けて強硬措置を進めている。", "summary_en": "Judge&#039;s suspension is part of a long dispute over politicisation of the Constitutional Tribunal under former government.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/30/polish-police-deployed-to-top-court-after-head-judge-suspended?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Polish police deployed to top court after head judge suspended\nJudge’s suspension is part of a long dispute over politicisation of the Constitutional Tribunal under former government.\nPolish police have been deployed outside the country’s top court after demonstrators gathered to protest the suspension of its head judge.\nPolice said on Friday they entered the premises of the Constitutional Tribunal after incidents outside the court, including objects being thrown at police.\nProtesters descended on the Warsaw court after it announced on Friday that its head, Bogdan Swieczkowski, had been suspended.\nHis suspension is related to a long-running dispute that has effectively paralysed the court.\nOver the past six months, Swieczkowski used his power as head of the court to block judges elected by the current parliamentary majority from assuming their court duties.\nMinister of Justice Waldemar Zurek told reporters on Friday that he had requested that Swieczkowski and his deputy’s immunity be lifted for failing to fulfil their duties by preventing judges from performing their work.\nSwieczkowski was appointed to his position by Poland’s former nationalist Law and Justice party (PiS) government, which critics have accused of politicising the country’s courts.\nRestoring the rule of law is the government’s duty, Prime Minister Donald Tusk said on X following the news of Swieczkowski’s suspension.\n“After years of lawlessness under PiS, this process is difficult, at times even painful, and requires decisive action. There is no other way,” said Tusk, leader of the Civic Coalition party.\nNews of Swieczkowski’s suspension brought crowds of PiS supporters to the gates of the Constitutional Tribunal. Police said they detained three people after some in the crowd launched “dangerous projectiles”.\nAlso on Friday, PiS-allied Polish President Karol Nawrocki announced he was turning his plane around while on the way to a sporting event in Senegal, saying: “At a moment like this, the President must be in Poland”.\nSince his election in mid-2025, Nawrocki has refused to swear in three of six judges nominated by the Polish parliament.\nPoliticised judiciary\nPoland’s Constitutional Tribunal has long been a point of serious political contention, with critics in Poland and across the European Union accusing PiS, which led the country from 2015 to 2023, of imposing political control over the court by electing judges friendly to the party and its policies.\nWhen Poland’s pro-European government came to power, it promised to restore the independence of the judiciary. However, two attempts to do so have been vetoed by two PiS-aligned presidents – one of them Nawrocki.\nAnna Korwin-Piotrowska, one of the judges Nawrocki refused to swear in on the grounds of alleged flaws in her selection procedure, has now been placed in charge of the Constitutional Tribunal.\nPoliticians from PiS, currently Poland’s largest opposition force, have criticised Swieczkowski’s suspension.\n“This is a blatant, criminal attack on the constitutional order,” former Justice Minister Zbigniew Ziobro wrote on X Friday.", "translation_ja": "", "vocab": []}, {"title_ja": "AIが世界中のデジタルインフラを脅かす可能性がある理由", "title_en": "Why AI could threaten much of the world’s digital infrastructure", "summary_ja": "ほとんどのウェブサイトを支えるオープンソースプログラミング言語PHPが、AI技術を活用したサイバー攻撃の脅威にさらされている。10年以上前に埋め込まれた「PHP2Shell」という重大な脆弱性がAIによって発見されたが、これは人間だけでは検出不可能なほど複雑だった。セキュリティ専門家は、ボランティアで管理されている世界中の重要なデジタルインフラが、AIが発見する今後の大量の脆弱性に対応できない可能性があると警告している。", "summary_en": "Volunteer-led PHP, which powers most websites, is increasingly under threat from cyberattacks using AI capabilities.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/30/why-ai-could-threaten-much-of-the-worlds-digital-infrastructure?traffic_source=rss", "state_media": false, "category": "IT", "full_text": "Why AI could threaten much of the world’s digital infrastructure\nVolunteer-led PHP, which powers most websites, is increasingly under threat from cyberattacks leveraging AI capabilities.\nEarlier this month, authorities worldwide urged website administrators to execute emergency updates after a nonprofit programming foundation flagged critical security flaws that could allow hackers to breach systems.\nGovernment and corporate websites briefly went offline to patch the vulnerabilities, nicknamed PHP2Shell, which were discovered by independent cybersecurity experts using artificial intelligence (AI).\nThe vulnerabilities were embedded in the code of a widely used open-source web programming language, PHP, for more than a decade. They had gone unnoticed, however, because it would have been too complicated for humans to exploit them without the use of advanced AI.\nBut cybersecurity experts, as well as those maintaining important software, say PHP2Shell could be the first in a deluge of security flaws exposed by emerging AI. They say much of the world’s most critical digital infrastructure is maintained by volunteers, who often lack the resources and time to respond to newly discovered threats.\n“There’s been a lot of people in the AI safety community that said this is one of the first areas where we are going to see the harmful impact of AI,” said Peter Slattery, a research scientist at MIT’s FutureTech, who studies how cybersecurity experts are dealing with the new technology and tracks real-world incidents involving AI.\nA digital world built on volunteer work\nPHP got its start in 1995, when Danish-Canadian programmer Rasmus Lerdorf sought to track how many people visited his online resume. Over time, others around the world improved Lerdorf’s software, and it grew in popularity.\nAs with other open-source coding projects, anyone could download, modify and share improvements. Websites like Facebook and Wikipedia were built using PHP, which runs about 70 percent of the world’s websites.\nIn 2021, a dedicated nonprofit, the PHP Foundation, was launched to coordinate development. Like many other foundations maintaining open-source software, it operates on a meagre budget.\nMost of the digital infrastructure consumers use is powered by open source software. The Mozilla Firefox browser is open source, as are languages like Perl, Python, and JavaScript. The software that lets a computer communicate with others on the internet is often open source, with many servers using products like Apache HTTP Server, maintained by the Apache Software Foundation.\n“The world today, including proprietary software vendors, relies on open source software for its digital infrastructure,” said Amanda Brock, CEO of OpenUK, a nonprofit that supports open source software.\nThe world’s largest corporations, like Meta, Google, OpenAI and Anthropic, depend on that volunteer-built, open-source infrastructure. Now, those companies’ own AI tools are uncovering security flaws in the infrastructure at a pace that needs far more resources for groups like the PHP Foundation to keep up.\n“It’s simply not possible with the resources in place to fix all of the known vulnerabilities,” Brock said. “Foundations are attempting to manage these challenges, but the smaller ones don’t have hundreds of millions in funding, and managing this at the pace AI requires is proving impossible.”\nA deluge of new bugs to fix\nThe PHP2Shell vulnerabilities were found through several advanced AI models, which can employ far more complicated attempts to hack past security barriers than humans could.\nDevelopers of other software are also discovering far more security flaws than in the past because AI is being used to probe defences.\nGoogle said it uncovered more than 1,000 security bugs in the last update for its Chrome browser, more than in the last two dozen updates combined. Mozilla, the foundation behind the Firefox browser, found more than 400 security vulnerabilities in April, a significant jump from the previous record of 76 bugs discovered just one month earlier.\n“We have maybe 10 times more issues than usual because we are using AI to find them,” said Jarek Potiuk, part of the volunteer security team at the Apache Software Foundation. (In keeping with the foundation’s non-hierarchical ethos, Potiuk said he has no real title).\nPotiuk said there is an “industry-wide movement” to conduct scans using AI models and identify security vulnerabilities, much like was done to find the bugs in PHP. But the scans themselves cost money – used to pay for the tokens for AI models – and afterwards, humans must pore over them to weed out false positives.\n“Every project, every foundation is doing this right now – spending enormous amounts of time to find these issues,” Potiuk said. “AI helps to find them, but you have to verify things, you have to review them.”\nEarlier this year, Anthropic launched Project Glasswing, offering $100m in credits to support its advanced Claude Mythos AI model to", "translation_ja": "", "vocab": []}, {"title_ja": "ブータンの氷河湖決壊洪水が道路を損傷、橋を流出", "title_en": "Glacial Lake Outburst Flood damages roads, washes away bridge in Bhutan", "summary_ja": "ブータン北西部ガサ県のシンタプ・ツォ氷河湖の決壊洪水により、モチュ川沿いで洪水が発生し、2つの県の道路、橋、公共インフラが被害を受けました。死傷者は報告されていませんが、ラヤ地域の下流約2,000フィートに位置するタクツェマカン近くに形成された大規模な人工湖が懸念事項となっています。タクツェマカン地域の住民と軍人員は安全な場所への避難が指示されました。", "summary_en": "Vulnerable revenue circles in Dhubri and Kokrajhar districts of Assam have been put on high alert", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/glof-damages-roads-washes-away-bridge-in-bhutan/article71646476.ece", "state_media": false, "category": "社会", "full_text": "GELEPHU (BHUTAN) A glacial lake outburst flood (GLOF) in Shintapu Tsho in the Laya area of northwestern Bhutan’s Gasa district on Thursday night (October 29, 2026) triggered flooding along the Mochhu, damaging roads, bridges and public infrastructure in two districts.\nOfficials on Friday (October 30, 2026) said no human casualties have been reported, but there are growing concerns over a large artificial lake formed near Taktsemakhang, about 2,000 feet downstream of Laya. The accumulation of water at the confluence of the flood-affected channels of Mochhu (river) has raised fears of another sudden outburst, which could be disastrous for downstream areas.\nOfficials said they could not immediately assess the GLOF impact on Thursday night (October 29, 2026). Royal Bhutan Army personnel stationed at Taktsemakhang and people near Gasa Tshachu, a hot spring, were instructed to evacuate to a safer location.\n“Prime Minister Tshering Tobgay is in Laya to assess the artificial lake at Taktesakhang, while Industry, Commerce and Employment Minister Namgyel Dorji is monitoring the situation in Punakha,” a Department of Local Governance and Disaster Management official said.\nPunakha and Thimphu districts are south of Gasa, which borders the Tibetan Autonomous Region. These and other neighbouring districts were put on high alert for potential danger from the GLOF-induced artificial lake.\nAccording to disaster management officials, Gasa Tsachu, one of Bhutan’s popular hot spring destinations, suffered extensive damage due to Thursday’s (October 29, 2026) GLOF. Floodwaters washed away almost all public facilities in the area.\nThis was the second flood-related damage at Gasa Tshachu since August 26, 2021, when the swollen Mochhu changed course towards the area.\nThe GLOF also damaged two vital roads in Gasa district and swept away a Bailey bridge in Punakha district. The bridge was constructed in 2022 with support from the Government of India.\nMelting Himalayan glaciers endanger all of South Asia\nIn Assam, Chief Minister Himanta Biswa Sarma said the State government was closely monitoring the possible impact of the Bhutan GLOF. “The vulnerable revenue circles in (western Assam’s) Dhubri and Kokrajhar districts have been put on high alert,” he said.\nShintaphu Tsho (Lake), located at the source of the Mochhu, is among Bhutan’s 17 glacial lakes identified as potentially dangerous. The Mochhu, considered female, and Phochhu (male) meet in Punakha district to form the Punatsangchhu, which flows along the Assam-West Bengal border as the Sonkosh River.\nPublished - October 31, 2026 02:55 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ポーランド憲法裁判所長官の一時停止に対する抗議が激化、警察が庁舎を警備", "title_en": "Police secure Poland's Constitutional Tribunal as protests erupt over court chief's suspension", "summary_ja": "ポーランドの憲法裁判所の長官一時停止に抗議する数十人のデモ隊が集まり、警察が庁舎を警備する事態となった。親欧州政府のドナルド・トゥスク首相は司法の独立回復を掲げており、かつての保守強硬派の法と正義党による司法支配からの改革を進めている。数人の抗議者が庁舎の柵を破って侵入し、警察に物を投げつけたため3人が拘束された。", "summary_en": "Police said they detained three people after some protesters breached the tribunal's fence and others threw objects at officers", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/police-secure-polands-constitutional-tribunal-as-protests-erupt-over-court-chiefs-suspension/article71646886.ece", "state_media": false, "category": "社会", "full_text": "Police secured Poland's Constitutional Tribunal as dozens of protesters gathered to demonstrate against what they perceive as the wrongful suspension of the top court's president by the current pro-European government.\nPolice said they detained three people after some protesters breached the tribunal's fence and others threw objects at officers.\nPolish President Karol Nawrocki, who was flying to Senegal, said he turned his flight back because of the situation. “At a moment like this, the President must be in Poland. I am cutting short my flight to Senegal. I am returning,” he wrote on X.\nPoland's top judicial bodies, including the Constitutional Tribunal, have been a major bone of contention between the current pro-European government and the main opposition party, national-conservative Law and Justice (PiS).\nCritics in Poland and the European Union accuse PiS, which led the country between 2015 and 2023, of imposing political control over key judicial institutions, including the Constitutional Tribunal. The PiS reforms led the EU to impose fines on Poland.\nOld values, new avenues: On India-Poland ties\nThe pro-European government of Donald Tusk came to power in 2023 with a promise to restore the independence of the judiciary. Since then, the government's efforts have been blocked by vetoes from two successive presidents aligned with PiS, including Nawrocki.\nThe information about the suspension of the president of the Constitutional Tribunal, Bogdan Swieczkowski, was published on the website of the court around 6 p.m. local time. The website of the Tribunal went down soon after, so The Associated Press could not independently verify the official reasons given for his suspension.\nMr. Swieczkowski became head of the Constitutional Tribunal under the PiS government, and Mr. Tusk has accused him of blocking judges elected by the parliamentary majority from taking up their posts at the tribunal.\n“Restoring the rule of law is our obligation,\" Prime Minister Tusk wrote on X on Friday evening (October 30, 2026). \"After years of lawlessness under PiS, this is a difficult process, sometimes painful, and it requires decisive action. There is no other way.”\nSpeaking about the future of the Constitutional Tribunal at Campus Polska in August, Mr. Tusk said his government had a plan to ensure the tribunal would be staffed again with lawfully appointed judges while acknowledging his methods may not be to everyone's liking.\nPoliticians from PiS, currently the largest opposition force, have criticised Mr. Swieczkowski's suspension.\n“This is a blatant, criminal attack on the constitutional order,\" former Justice Minister Zbigniew Ziobro wrote on X on Friday evening (October 30, 2026). “That is why I call for resistance that will be loud, firm, solidary and fearless.”\nPublished - October 31, 2026 03:25 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツの若者、ヨーロッパの抗議活動の波に参加へ", "title_en": "Germans to join Europe's youth protest wave", "summary_ja": "ドイツの若者約15万人が10月31日、「GenZ regelt!」というグループが主導する抗議活動に参加予定で、生活費の高さや学校の老朽化、政府の支出削減に反発している。フランスやイタリア、スペインなど欧州各地で若者による抗議活動が相次いでおり、一部では暴力的な事態に発展している。ドイツ当局は国外の過激派が参加する可能性を懸念し、数千人の警察官を配置して対応する予定。", "summary_en": "In Germany, about 150,000 people have so far registered to turn out on October 31 in around 30 cities, including Berlin, Frankfurt and Cologne, for protests led by a group dubbed \"GenZ regelt!\" (Gen Z has got this!).", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/germans-to-join-europes-youth-protest-wave/article71646650.ece", "state_media": false, "category": "社会", "full_text": "Tens of thousands of young Germans are set to demonstrate on Saturday (October 31, 2026), the latest in a wave of protests across Europe led by youths who complain political elites are ignoring their concerns.\nFrom France to Italy and Spain, young protesters have taken to the streets in recent weeks to make their voices heard, with demonstrations sometimes degenerating into serious violence.\nIn Germany, about 150,000 people have so far registered to turn out on Saturday (October 31, 2026) in around 30 cities, including Berlin, Frankfurt and Cologne, for protests led by a group dubbed \"GenZ regelt!\" (Gen Z has got this!).\nWhile the movement has stressed it rejects all violence, police are taking no chances and are deploying thousands of officers, while some luxury jewellery shops and clothing stores are boarding up their windows to ward off potential looters.\nThe protest movement has a range of complaints, from high cost of living to poorly maintained schools, government spending cuts, and, more broadly, what it sees as politicians deciding on policies with apparently little regard for the younger generation.\n\"We are young people who no longer want to sit back and watch while decisions are made about our future without us being heard,\" said a statement from the group, which describes itself as a non-partisan alliance.\n\"Wherever we look, we see crises and hardly any prospects for us.\"\nSpending cuts are being made in areas ranging from education to culture and healthcare, they say.\n\"The cuts are being made at our expense, while big corporations continue to profit and billions flow into rearmament.\"\nThey are also unhappy with Germany's bid to boost its military through a new voluntary service model, and fear that mandatory conscription could be reintroduced.\n'Enormous pressure'\nAuthorities are worried the protests, taking place on Halloween, could be marred by the same kind of violence seen elsewhere in Europe.\nIn France, nationwide demonstrations on October 17 degenerated into some of the country's worst rioting in years.\nBerlin is in contact with officials in France and Italy amid fears that radicals from overseas could seek to join the German protests.\nMarc Henrichmann, a senior lawmaker from the ruling centre-right CDU party, warned in an interview with the Handelsblatt newspaper that the \"networking of the far-left extremist scene is international and coordinated\".\nBut the Interior Ministry has stressed that a distinction must be drawn between \"peaceful student protests\" and a \"violent extremist scene\" that might hijack the demonstrations.\nAuthorities say that they do not as yet have any evidence of concrete plans for violence.\nThe \"GenZ regelt!\" movement meanwhile stressed that \"extremist groups, anti-constitutional symbols, racism and hate speech have no place with us — no matter from which side\".\nChristian Volk, an expert in protest movements, said there was the potential for Germany to see a major protest movement.\n\"There is an enormous amount of pressure building up,\" Mr. Volk, from Berlin's Humboldt University, told AFP.\nYoung people are demanding \"that their political experiences and expectations for the future are also heard\", he said.\nBut he said there were key differences with France, which has a \"completely different tradition when it comes to confrontational forms of protest\".\nPublished - October 30, 2026 10:51 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "ハミルトンの教師が永遠の船旅での退職生活を選択。2年後、船は永遠に停泊することになり、彼女は立ち往生", "title_en": "A Hamilton teacher retired to live on a never-ending cruise. After 2 years, it’s docked for good — and left her stranded - Toronto Star", "summary_ja": "ハミルトンの教師は退職後、終わることのないクルーズ船での生活を選択しました。しかし2年後、その船は最終的に停泊することになり、彼女は予期しない状況に置かれることになりました。この記事は、彼女のユニークな退職計画がどのように予期しない展開を迎えたかを報じています。", "summary_en": "A Hamilton teacher retired to live on a never-ending cruise. After 2 years, it’s docked for good — and left her stranded Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMipgJBVV95cUxOZk0tQ3RTSTBaalZqODBlc2FpdTlqaVMxZ3NIRV9ockhkR3Z0NEpsMGtmd2FNX21xdlVWdzVVNHJFT1JVYUZ2RUctOHlURlc1dms0X3BhMW1SUGhJOUg0LVBhQ2R0ZHhVcmNjdV9SX0N4Mk5rZ1l4ckZVU0FKcHhPTEo4cVhYdFJIR1ZEcUJzcUphZy1qZGdPenRsbmlrREdrUjRkc2daNy03cG1LMWlBZWRtS1UtTVc2V3RjNW50S1lEbGVsaUpHX05DalFoZ3NTSzg1MF9FUUROcDY3UjRHYW93ZzNEYkZxc25uZVFacFJ3THFLREpib3hTTml4Nm0zQUozXzQ5ZzBDREc4el9UTHU2aEZYRGF0QkpPd1VySlBfcEFpalE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ブリドルパス襲撃事件、増加するトロント住宅侵入犯罪の最新事例：「皆が恐怖に震えている」", "title_en": "Bridle Path attack latest in rising number of Toronto home invasions: ‘Everyone is terrified’ - Toronto Star", "summary_ja": "トロント市のブリドルパス地域で発生した襲撃事件は、同市で急増している住宅侵入犯罪の最新の事例となっています。地域住民の間では治安悪化への不安が広
