ot takes like men shouldn’t “eat soup in public”, has an incredible talent for inserting misogyny into absolutely any news story.\nTake, for example, Donald Trump’s ludicrous announcement on Wednesday night that he will give every American adult $5,000 if Republicans retain control of the US Congress in November’s midterm election. That’s a story about apparent bribery, right? A story about fiscal recklessness and empty promises. A story about how the president, whose popularity is plummeting, is so out of ideas that he’s resorted (yet again) to dangling cash in front of voters.\nActually, says Watters, it’s none of the above; it’s just Trump behaving like a woman.\n“That $5,000 check, Dana, that’s not a bribe,” Watters told Fox anchor Dana Perino on Thursday. “We’re calling it an enticement … It’s like a woman. Sometimes a woman can entice you, OK? Maybe – it doesn’t mean you’re going home with her, but it keeps you interested. It keeps you intrigued and wanting more. That’s what this is about.”\nPerhaps the Fox News host isn’t completely wrong. After all, I am a woman and I am about to entice you to look up the story about how Watters courted his much younger second wife. It’s very intriguing.\nBut back to this definitely-not-a-bribe $5,000 payment which the president calls a Trump “dividend”. I wouldn’t start spending it now, if I were you. The president, like his right-hand man Elon Musk, has a habit of making grandiose promises he doesn’t keep. Remember the Doge dividends floated last February? Those haven’t materialized. Nor have the tariff dividends that Trump made so much noise about. “People that are against Tariffs are FOOLS!” Trump said in a Truth Social post last year. “We are taking in Trillions of Dollars and … A dividend of at least $2000 a person (not including high income people!) will be paid to everyone.” Almost a year after that post, nobody has received a tariff dividend. However, it has been estimated by the Joint Economic Committee – Minority that the average American family will pay more than $2,500 in tariff costs this year.\nI feel pretty confident saying there is a 0.00001% chance that anyone is going to get a $5,000 Republican celebration check. But let’s just play along for a minute and pretend that Trump isn’t a fabulist. Let’s pretend that the president is a serious man who makes thoughtful policy proposals, rather than an opportunist who says whatever inane thing happens to pop into his brain in the moment. Isn’t it a bit reckless to be giving all this money away, a total that exceeds $1tn, when the US national debt recently surpassed $40tn for the first time? As Maya MacGuineas, president of the Committee for a Responsible Federal Budget, said in a statement, that debt “doesn’t exist solely on the government’s ledgers”, it is shouldered by everyone. “The more we borrow, the more we exacerbate inflation, squeeze out other priorities in the budget, and leave ourselves vulnerable to emergencies at home and turmoil abroad.”\nDon’t worry about all that, says the commerce secretary, Howard Lutnick. “It’s not tax money,” Lutnick told NBC News on Thursday. The Trump administration is going to earn that money from various moneymaking endeavours like the Trump Platinum Card, which allows wealthy people to pay up to $5m to extend their US visas. JD Vance, meanwhile, has suggested that the money might come from US tariff revenues, even though economists have pointed out the $125bn in tariff revenues wouldn’t come close to covering the costs.\nThe president himself, meanwhile, doesn’t seem keen to elaborate on his cunning plan to win friends and influence voters. When the ABC reporter Rachel Scott asked him about the rationale behind the $5,000 checks on Thursday night, he said it was a reward to Americans for putting up with Joe Biden. After Scott tried to ask a follow-up question, Trump lunged at her and said: “Your network … you’re the worst.” Which is very on-brand for the president. He can’t seem to handle being asked tough questions by anyone, but gets particularly nasty when those questions are posed by a woman.\nWhile Trump doesn’t want to get into the details of his dividend, the proposal reflects how the president is looking at some very unconventional ways to sway the midterms. He may not end up issuing people celebration checks, but he has already gutted election security programs and attempted to limit voting access. The real story here isn’t $5,000 cheques, it’s the fact that America’s self-styled king seems intent on meddling with the election, and no meaningful checks and balances are stopping him.\nEctopic pregnancy deaths in the US have nearly doubled\nA ProPublica analysis found almost 200 women died after an ectopic pregnancy from 2020 to 2025. That’s compared to about 100 in the previous six years. To nobody’s surprise, mortality is worse in states with strict abortion bans", "translation_ja": "", "vocab": [{"word": "fabulist", "definition": "嘘をつくことが常習的である人。真実よりも都合の良い話や大げさな話をする傾向がある人物を指す。"}, {"word": "exacerbate", "definition": "問題や状況を悪化させる、より悪い状態にする。経済や社会問題が深刻化することを表現する際に使用される。"}, {"word": "reckless", "definition": "危険性や結果を考慮せず無謀に行動する様子。特に財政政策など重大な決定に対して無責任であることを示す。"}, {"word": "misogyny", "definition": "女性に対する偏見や敵意。女性を軽視する態度や言動を指す。"}, {"word": "meddling", "definition": "他者の事柄に無断で干渉または介入する行為。選挙プロセスなどに不正に関わることを意味する。"}, {"word": "checks and balances", "definition": "権力の濫用を防ぐために設計された制度的な制約と監視メカニズム。民主主義の重要な要素。"}]}, {"title_ja": "イランの第二戦線：フーシ派の軍事拡張が世界のエネルギー市場を脅かす", "title_en": "Iran's Second Front: Houthi Escalation Threatens Global Energy Markets", "summary_ja": "イラン支持のフーシ派がイエメンで大規模な軍事作戦を展開し、紅海沿いの戦略的な港と島を占領し、実質的にイラン・イスラエル紛争の第二戦線を開いた。彼らが重要な海上チョークポイントを支配することで、サウジアラビアの石油輸出と世界のエネルギー安全保障が脅かされている。著者は軍事的解決はもはや実行不可能であり、さらなる地域的エスカレーションを防ぐため、サウジアラビア、米国、イエメンの同盟国による統調された政治戦略の緊急の必要性を強調している。", "summary_en": "The Iranian-aligned Houthis have launched major military offensives in Yemen, capturing strategic ports and islands along the Red Sea, effectively opening a second front in the Iran-Israel war. Their control of critical maritime chokepoints threatens Saudi oil exports and global energy security, while the anti-Houthi coalition faces military setbacks and internal fragmentation. The author argues that military solutions are no longer viable and emphasizes the urgent need for a coordinated political strategy among Saudi Arabia, the U.S., and Yemeni allies to prevent further regional escalation.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/yemen/irans-second-front", "state_media": false, "category": "オピニオン", "full_text": "Seizing opportunity amid the war in Iran, the Houthis have launched a major new bid for military dominance in and around Yemen. On Tuesday, the Iranian-aligned group unleashed a wave of drones and ballistic missiles strikes on Saudi Arabia, setting fire to oil facilities in the country’s south and injuring more than 70 people. Then on Thursday, after days of heavy fighting along key frontlines inside Yemen, the Houthis routed Saudi-backed government forces along the Red Sea coast and captured the strategic port of Mokha. And on Friday, the Yemeni government reported that the Houthis had seized Perim Island at the mouth of the Bab el Mandeb Strait, the narrow waterway that connects the Red Sea to the Indian Ocean. The takeover marks a profound shift in the balance of power in Yemen, with potential consequences for the entire region.\nUntil this week, Mokha had been home to a vital part of the anti-Houthi coalition and served as a bulwark against the rebels’ advance. With this offensive, the Houthis have shattered a status quo along the coast, upended a truce that had largely held since 2022, and set the stage for further consolidation of their control of the north. But the victory is also Iran’s, since Houthi control of both Perim Island and Mokha, which lies less than 50 miles from the Bab el Mandeb, will allow the rebels to establish themselves as the power brokers of the strait and more easily harass shipping.\nThe timing of the Houthis’ escalation, which began with attacks on Saudi interests in July, is especially significant, given that the Red Sea has become a crucial alternative to the Strait of Hormuz for Saudi oil during the Iran war. Even as Houthi leaders frame their actions in local terms, their alignment with Tehran appears to have tightened. By attacking Saudi shipping and Saudi Arabia itself, they have effectively opened a second front in the Iran war, broadening that conflict and placing further pressure on global energy and financial markets. Iranian officials have said that reaching a deal with the United States will require ending the blockade of Yemen—a shorthand for Saudi Arabia’s lifting all transit restrictions on Houthi-held territories, including the capital, Sanaa, and ending support for the Yemeni government. In this evolving regional order, Iran and its partners are trying to establish a new status quo by controlling the Middle East’s most critical maritime checkpoints.\nOptions for addressing the Houthi challenge are moving from bad to worse. While the frontlines will likely continue to evolve, a few hard realities have been laid bare. A decisive military solution to Houthi threats is not credible. For all their public bluster, Yemeni government forces remain internally fragmented. During this week’s offensive, their backer Saudi Arabia also failed to provide close air support and other necessary assistance, suggesting continued poor coordination between the anti-Houthi coalition and Riyadh. Moreover, the Houthis’ gains also undermine the prospects for a negotiated settlement. The militant group is now likely to be even more maximalist in its demands and in its ambitions to assert control across the Red Sea.\nThere are no easy solutions. For now, the priority for Saudi Arabia, the United States, and their Yemeni allies must be protecting other key frontlines from Houthi advances and hindering Houthi efforts to consolidate control over northern Yemen and the Bab el Mandeb. But beyond that, the anti-Houthi coalition must finally address the fissures that continue to tear it apart and agree on a credible political vision for resolving the Yemeni conflict. If it does not, there is a real risk of greater upheaval on the government side and expansion of the Houthi threat across the region.\nFROM THE STRAIT TO THE SEA\nFor nearly five months after the Iran war began in late February, the Houthis mostly stayed on the sidelines. That relative calm gave way in mid-July, when the Iranians flew a Houthi delegation from Tehran to Sanaa, challenging the Yemeni government and Saudi-led coalition’s control of Yemen’s airspace. To prevent the aircraft from landing, Saudi Arabia and the Yemeni government bombed the Sanaa airport’s sole runway. Although the plane landed at the Houthi-controlled port of Hodeidah instead, the Saudi action gave the Houthis a pretext for abandoning the 2022 truce. It was at that point that the group began their bold escalation against Saudi interests and launched their new offensive against coalition forces in Yemen.\nThe Houthi campaign is clearly designed to exploit new Saudi vulnerabilities. As Iran has throttled the Strait of Hormuz, the Red Sea has become a lifeline for the Saudi oil industry. But since the Houthis resumed their attacks in July, Saudi oil exports through the Bab el Mandeb have plummeted 95 percent. Now, by targeting infrastructure and ships near the Red Sea port complex of Yanbu, the Houthis are threatening the transit of oil exports northward through Eg", "translation_ja": "", "vocab": [{"word": "consolidation", "definition": "権力や支配を強化・統一することを意味する。この記事では、フーシ派がイエメン北部と紅海での支配を確実にする過程を指す。"}, {"word": "maximalist", "definition": "最大限の要求や野心を持つ立場を表す。交渉においてより強硬な姿勢を取ることを意味する。"}, {"word": "credible", "definition": "信じられる、または実現可能であると認識されることを意味する。軍事戦略の文脈では、実行可能性がある、または効果的である可能性があることを示す。"}, {"word": "fragmented", "definition": "分裂した、または一体性を欠く状態を表す。この記事ではイエメン政府軍の内部的な統一の欠如を指す。"}, {"word": "fissures", "definition": "亀裂や分裂を意味する。政治的または軍事的同盟内の深刻な意見の相違や対立を指す。"}, {"word": "throttled", "definition": "流通や移動を制限・遮断することを意味する。イランが海峡を制御して通行を制限する行為を表す。"}, {"word": "pretext", "definition": "真の理由を隠すための口実や言い訳を意味する。フーシ派がトルエ休戦を破棄する正当性を主張するための理由を指す。"}]}, {"title_ja": "もう一つのテロ戦争：テロ対策がアメリカ民主主義をいかに変えたか", "title_en": "The Other War on Terror: How the War on Terror Reshaped American Democracy", "summary_ja": "この論説は、米国のテロ対策戦争が、よく知られている軍事的コストを超えて、アメリカ国内政治と社会に深刻な悪影響を与えたと主張している。著者は、20年間の対テロ対策が恐怖ベースの文化、排外主義、政治的分極化を助長し、最も重大なことに民主的制度を脅かす前例のない大統領権の拡大をもたらしたと述べている。", "summary_en": "This opinion piece argues that the U.S. war on terror has profoundly damaged American domestic politics and society—beyond the well-documented military costs. The author contends that two decades of counterterrorism measures fueled fear-based culture, xenophobia, political polarization, and most critically, an unprecedented expansion of executive power that now threatens democratic institutions.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/other-war-terror", "state_media": false, "category": "オピニオン", "full_text": "For years, the United States’ political dysfunction has been attributed to large-scale social and economic changes. Experts point to the failures of globalization, rising inequality, reduced social mobility, or the long aftermath of the “China shock” more than two decades ago to explain today’s extreme polarization, collapsing trust in institutions, democratic erosion, immigration backlash, and struggling middle class. Yet there is another widely overlooked factor that is equally central to understanding the United States’ current predicament: the war on terror.\nTypically, when policymakers and analysts speak of the global war on terror—the defining fact of international affairs for two decades—they discuss the damage done to terrorist groups, the plots that have been thwarted, the rise and fall of jihadi ideology, the many intelligence failures, and, perhaps above all, the two forever wars in Afghanistan and Iraq. These are the scorecards of contemporary counterterrorism. But left out of this framing are the profound effects of this vast war on terror on domestic politics and society.\nThe human statistics alone tell an appalling story: more than 7,000 U.S. troops were killed in action, 53,000 were wounded, and well over 30,000 took their own lives—a staggering number. According to Brown University’s Costs of War Project, these conflicts added $8 trillion to the U.S. national debt, with trillions more projected in the future for veterans’ health care, including for the half million GIs with traumatic brain injuries and posttraumatic stress disorder.\nYet even these numbers fail to show the myriad ways in which two decades of war transformed the United States. For years, the fixation on Islamist terror shaped a culture drenched in fear, as voices from politics, the media, civil society, and a swelling counterterrorism-industrial complex insisted that the country faced an existential threat. Amid this climate, the government was given broad new powers to root out and prosecute potential jihadi activity wherever it might be, and the widespread assumption that there might be another terrorist attack began to reshape American society itself. Rather than bringing the country together behind a shared—and narrowly defined—enemy, however, the result has been a dramatic decline in social cohesion. It has contributed to the demise of political bipartisanship, already weakened in previous decades. At the same time, the war on terror fueled an alarming rise in xenophobia and anti-immigrant sentiment and discredited the country’s political and foreign policy elites.\nAbove all has been the uncontrolled expansion of executive power. This impetus did not begin with the war on terror; generations of American leaders and scholars have sought to increase presidential power, drawing up mechanisms that could sideline civil liberties and intertwine military and police activities. But after 9/11, these contingencies were used to give the executive branch sweeping new authority in the name of domestic security. And today, an authoritarian president is using these powers to target his political enemies. The United States, then, is overdue for a reckoning with the political legacy of the war on terror.\nTHE POWER OF NIGHTMARES\nAnxiety about extended war has preoccupied American officials throughout U.S. history. In the first years after the country’s independence, James Madison, who would become the country’s fourth president, observed that “no nation can preserve its freedom in the midst of continual war.” More than a century and a half later, U.S. President Dwight Eisenhower sounded the alarm about “the acquisition of unwarranted influence” by what he famously called “the military-industrial complex.” As Eisenhower forewarned, “The potential for the disastrous rise of misplaced power exists and will persist.” For many of the decades since, much of that apprehension has been focused on the concentration of power in government and in the broader machinery of war. Yet during the war on terror, parts of society mobilized in parallel with the state and sought to cast a much wider net against a class of perceived enemies.\nTerrorist acts are typically carried out by secret actors operating within a country’s borders, and 9/11 was the ultimate case in point. The attacks on the Twin Towers and the Pentagon—the first on U.S. soil since World War II—were carried out by foreign nationals inside the country. They were motivated by the al-Qaeda leader Osama bin Laden’s particular brand of jihadi ideology, which held that major attacks on the U.S. homeland would lead Washington to withdraw support for the apostate rulers of the Muslim world. These themes—which also carried notions of proportional revenge for the number of Muslims previously killed by the United States—and the attacks themselves gave license to Islamophobes throughout American society, including in the political world and policy establishment. The most influential came from the evan", "translation_ja": "", "vocab": [{"word": "polarization", "definition": "政治的、社会的に異なるグループが対立し、中間の立場が消滅する現象。分極化を意味する。"}, {"word": "xenophobia", "definition": "外国人や異なる文化を持つ人々に対する極端な嫌悪感や恐怖。排外主義。"}, {"word": "executive power", "definition": "大統領など行政府の長が持つ権限。特に法律を施行し行政機関を統制する権力。"}, {"word": "bipartisanship", "definition": "異なる政治党派が協力して共通の目標達成を目指す姿勢。超党派的協力。"}, {"word": "contingencies", "definition": "将来起こる可能性のある事態に備えた計画や措置。不測の事態への対応策。"}, {"word": "reckoning", "definition": "過去の行動や決定の結果に直面すること。清算や決算の時期が来ること。"}]}, {"title_ja": "ロシア大国の衰退の危機", "title_en": "The Coming Risks to Russian Power", "summary_ja": "著者は、西側諸国がロシアの現在の国際的影響力を過小評価していると主張し、ロシアは今日の分裂した国際秩序の中で繁栄していると述べている。しかし、ロシアの優位性は継続的な世界的不安定性に依存しており、国際体制が統合され協力が戻れば、ロシアの硬直した制度と外交政策は足かせになる可能性がある。", "summary_en": "The author argues that Western assessments underestimate Russia's current global influence, which thrives in today's fragmented international order. However, Russia's advantages depend on continued global instability and disorder; if the international system consolidates and cooperation returns, Russia's rigid institutions and foreign policy may become liabilities.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/coming-risks-russian-power", "state_media": false, "category": "オピニオン", "full_text": "The United States has long viewed Russia as a power in terminal decline. This assessment formed in the 1980s as the Soviet Union began showing clear signs of imperial overstretch, and it congealed after the collapse of first the Warsaw Pact and then the Soviet Union itself. Washington went on to pursue a policy agenda, including NATO enlargement, that treated Russian power and interests as an afterthought, and the long-standing conflict over Ukraine turned dismissiveness into condescension. In March 2014, U.S. President Barack Obama called Russia “a regional power” that was “threatening some of its immediate neighbors, not out of strength but out of weakness.” President Donald Trump shows more fondness for Russian President Vladimir Putin than his predecessors did, but most Russia watchers in the West still dwell on Russia’s lagging technology; its failure to rescue allies in Syria, Venezuela, and Cuba; and what they see as its reduction to a vassal of mighty China.\nThis picture of Russia as feeble and fading may suit the biases of Putin’s many critics, but it is fundamentally at odds with reality: Moscow consistently punches above its weight in global affairs. Thirty-five years after the disintegration of the Soviet Union, Russia remains a nuclear superpower. As during the Cold War, NATO treats it as the benchmark threat around which the alliance plans its forces. An unprecedented wall of Western sanctions has failed to trigger the economic collapse its architects predicted or to erode political and social stability. The effort to isolate Moscow has faltered as well. The Kremlin has skillfully promoted non-Western bodies such as BRICS, a grouping of major emerging economies, and the Shanghai Cooperation Organization, a Eurasian political and security group. In so doing, it has extended its influence over the post-Western order now taking shape. And even though Russia’s economy is far smaller than China’s, the “no limits” partnership between Moscow and Beijing has produced a formidable coalition.\nThis bullish assessment comes with a caveat: it relies on the international conditions that prevail today. Moscow continues to punch above its weight because it is navigating a fragmented, unpredictable world that plays to its strengths. Volatility and instability, active conflicts and arms races across several regions, economic decoupling and the retreat of globalization, the worldwide rise of nationalism and populism, the discounting of soft power and fissures in the Western alliance—all these features of the existing international order work to Moscow’s advantage.\nThe downside risk for Russia is that today’s turmoil and uncertainty may not last. The pendulum is likely to swing back, with global disorder subsiding and the international system consolidating anew. That reversal could come when Trump leaves the White House, especially if his successor restores traditional U.S. support for the transatlantic alliance, multilateralism, and open trade. A planetary shock—accelerating climate change, an out-of-control AI system, or some other surprise—could likewise push states to set aside their current conflicts in favor of closer cooperation. When this change happens—and it will—Russia may find that its time-tested foreign policy and its once reliable but rigid institutions no longer serve it well.\nTHRIVING IN CHAOS\nThe centrifugal trends pulling the international system apart work to Moscow’s advantage. In a fragmented and dangerous world of strongmen, where raw power decides outcomes, Russia’s military heft remains a durable source of strength and influence. Russia is also the only power that can rival the United States in strategic nuclear weapons. China is modernizing and expanding its arsenal, but Beijing will need a long time to catch up with the two superpowers. Russia’s nuclear status has practical effects: it has deterred NATO members from deploying troops to Ukraine, and it gives Moscow powerful diplomatic leverage on arms control, strategic stability and risk reduction, nonproliferation, and the prevention of nuclear terrorism.\nAs for its conventional capabilities, Russia retains a blue-water navy and long-range strike capabilities; only the United States can project power more widely. To be sure, the initial phase of fighting in Ukraine in February 2022 exposed serious weaknesses in the Russian army. But over the four and a half years since, the armed forces have transformed themselves, sharply improving their efficiency and combat power. Moscow now fields one of the world’s strongest militaries and, beyond that, has unique experience in next-generation ground warfare—an edge over almost any other fighting force, the United States included. Ukraine, too, has adapted its forces and tactics to new battle technologies, but it depends on Western support and may not be able to preserve those capabilities once the fighting stops. The accumulated experience of Russia’s armed forces will keep serving Moscow well in", "translation_ja": "", "vocab": [{"word": "imperial overstretch", "definition": "帝国が支配領域を拡大しすぎて、資源と軍事力が過剰に分散され、衰退につながる状態を指す。本文ではソビエト連邦の衰退の原因として使用されている。"}, {"word": "congealed", "definition": "固まる、結晶化するという意味。流動的な状態から固定的・永続的な状態に変わることを表す。政策や意見が確定することに用いられる。"}, {"word": "punches above its weight", "definition": "自分の実力や規模以上の影響力を発揮することを意味するイディオム。本文ではロシアが経済規模の割に国際的影響力が大きいことを表現している。"}, {"word": "centrifugal", "definition": "中心から外側へ向かう傾向を示す言葉。政治文脈では、統一体から分散・分裂へ向かう傾向や力を指す。"}, {"word": "durable", "definition": "長期間持続する、堅固であるという意味。本文では軍事力がロシアの長期的な影響力の源泉であることを強調している。"}, {"word": "leveraging", "definition": "支配力や影響力を活用して、利益を得たり目標を達成したりすることを意味する。本文ではロシアが核兵器保有を外交的に活用することを指す。"}, {"word": "consolidated", "definition": "統合される、一つにまとめられるという意味。本文では国際秩序が再び統一・安定化することを表現している。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-13 22:45 JST";
  renderTabs();renderList();
})();
</script>
