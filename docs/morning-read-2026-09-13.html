and USA’s Ronnie Baker (9.93s).\nIt was a repeat of the Tokyo World Championship double for Jefferson-Wooden, whose 21.47s world lead time made her the third-fastest woman in 200m history as she eased past compatriots Gabrielle Thomas, the Olympic champion (21.77s) and Kayla White (21.93s).\nIn the 100m, Jefferson-Wooden’s time of 10.62s held off Olympic champion Julien Alfred of Saint Lucia (10.74s) and compatriot Sha’Carri Richardson (10.76s), who clinched her world title in the same stadium three years ago.\nEarlier on Sunday, Jasmine Jones opened the final day of competition with a shakeup in the women’s 400m hurdles.\nThe American clocked 52.45s to edge out Slovakia’s Emma Zapletalova (52.68s) and compatriot, world leader, and favourite Anna Cockrell (53.09s), who settled for third after an almost unbeaten season. Teammate Dalilah Muhammad graciously retired from track and field with a fourth-place season’s best of 53.11s.\nReigning javelin king Rumesh Pathirage launched a monstrous 91.09m final throw for the win to continue his unbeaten streak this season.\nThe Sri Lankan’s throw proved too much for Grenada’s Anderson Peters (86.18m) and third-place Julian Weber of Germany (85.89m), while world champion Keshorn Walcott was disappointed with yet another fourth-place finish (82.41m).\nItaly’s Gianmarco Tamberi literally soared to new heights with a 2.37m clearance that amazed the crowd – and himself – well after USA’s JuVaughn Harrison jumped 2.30m for second in the men’s high jump and Mexico’s Erick Portillo cleared 2.26m for third.\nJosh Kerr of Great Britain kept the 1500m win predictable (3:29.35) after Algeria’s Djamel Sedjati (1:41.91) flipped the script on 800m world and Olympic champion Emmanuel Wanyonyi (1:42.44), who settled for third behind Canada’s Marco Arop (1:42.28) in a stunning finish.\nEthiopia’s Likina Amebaw dominated to claim the women’s 5,000m (14:30.36) while Saly Sarr of Senegal (15.06m) stole the triple jump spotlight from world leader Thea Lafond (14.47m) after the Dominican failed to perform in the Hungarian capital.\nCrowd favourite Mondo Duplantis opened the show on Friday with a casual 6.20m jump to reign supreme in the men’s pole vault, although close friend and rival Emmanouil Karalis of Greece continued to close the gap between world number one and two with 6.15m for second.\nOver on the women’s side, it was an emotional win for USA’s Sandi Morris when she cleared 4.90m for her first global outdoor title.\nJakob Ingebrigtsen shifted gears to dominate the men’s 5,000m in a comeback like never before (12:59.24), leaving USA’s Cole Hocker (13:00.05) and Parker Wolfe (13:00.13) in his trail.\nThe Americans predictably dominated the hurdles as Masai Russell clocked 12.22s in the women’s 100m hurdles to cap off an unbeaten season while Diamond League champion Ja’Kobe Tharp dazzled with 12.94s in the men’s 110m hurdles.\nOther predictable wins came from Greece’s Miltiadis Tentoglou in the men’s long jump (8.35m), Switzerland’s Audrey Werro in the women’s 800m (1:55.88), Brazil’s Alison dos Santos in the men’s 400m hurdles (45.98s), Dominican Marileidy Paulino in the women’s 400m (49.07s) and male counterpart Collen Kebinatshipi with a 43.39s Botswana national record.\nA cozy, unbothered Yaroslava Mahuchikh rested in her sleeping bag in between jumps that saw her add another high jump title to her collection at 1.99m ahead of Nicola Olyslagers of Australia.\nMeanwhile, the women’s javelin saw a clash of old and new as Japan’s Haruka Kitaguchi set a national record (68.92m) en route to reclaiming the throne, while Chinese teen sensation Yan Ziyi retired hurt but claimed her first silver of the season w", "translation_ja": "", "vocab": [{"word": "inaugural", "definition": "初めての、初回の。新しく始まったイベントや組織を指す。例：inaugural ceremony（就任式）"}, {"word": "dominated", "definition": "圧倒的に優勝する、支配する。競技で他の選手を大きく上回る成績を収める。"}, {"word": "unbeaten", "definition": "負けなしの、無敗の。シーズンを通して敗北がないこと。例：unbeaten streak（連勝記録）"}, {"word": "predictable", "definition": "予想通りの、容易に想像できる。競技結果が事前予想通りになること。"}, {"word": "monstrous", "definition": "巨大な、並外れた。特に計測値が異常に大きいことを強調する表現。"}, {"word": "compelling", "definition": "魅力的な、説得力のある。観客の注目を集める素晴らしい試合内容。"}]}, {"title_ja": "イエメン紛争激化、フーシ派がサウジアラビアへの攻撃を強化", "title_en": "Yemen Conflict Escalates as Houthis Intensify Attacks on Saudi Arabia", "summary_ja": "2026年9月13日、イランの支援を受けるフーシ派反政府勢力がイエメンで戦闘を激化させ、戦略的に重要なモカ港湾都市を占領し、ドローンとミサイルでサウジアラビアを攻撃した。この紛争激化により8万人以上が避難を余儀なくされ、数百人の戦闘員が殺害されている。フーシ派の進軍はジブチの米軍基地まで32km以内に迫り、地域全体に懸念をもたらしている。", "summary_en": "Fighting in Yemen intensified on September 13, 2026, as Iran-backed Houthi rebels captured the strategic port city of Mokha and launched drone and missile attacks on Saudi Arabia, threatening global oil supplies. The escalation has displaced over 80,000 people and killed hundreds of fighters, with government forces suffering a significant defeat along the Red Sea coast. The Houthis' advance brings them within 32 km of a major U.S. military base in Djibouti, prompting regional concerns.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/fighting-in-yemen-intensifies-houthis-launch-more-attacks-on-saudi-arabia/article71464664.ece", "state_media": false, "category": "政治", "full_text": "The conflict in Yemen intensified on Sunday (September 13, 2026), as government forces launched attacks against Iran-backed Houthi rebels along the Red Sea and Houthis fired into neighbouring Saudi Arabia, which supports Yemen's government.\nThe Yemeni government vowed to send more forces to the Red Sea coast after conceding a “painful” defeat last week when Houthis captured the port city of Mokha and an island on the Bab el-Mandeb Strait, a crucial shipping alternative to the Strait of Hormuz.\nThe escalation — especially Houthi attacks on Saudi oil infrastructure and its shipping in the Red Sea — adds pressure on global oil supplies and prices, and that could give Iran leverage in its war with the United States.\nAs Yemen risks descending into another civil war, the United Nations estimated that more than 80,000 people in the impoverished country have been displaced by the fighting since the start of September.\nOne woman said a mortar shell fell nearby as she fled in the middle of the night from the town of Khawkha in Hodeida province along the Red Sea, shortly before it was captured by Houthis.\n“I saw with my own eyes cars and buses burning, and bodies of children and women were lying on the road in a horrific scene,” said the woman, who spoke on condition of anonymity out of concern for her and her family's safety.\nSaudi authorities sounded sirens Sunday afternoon (September 13, 2026) in the southern city of Abha and Khamis Mushait province, warning residents to take shelter from potential incoming fire. Both areas were repeatedly attacked by the Houthi in recent weeks.\nThe Houthis claimed to have used drones and missiles to target Saudi Arabia, including a military base just over the border with Yemen. Houthi military spokesperson Brig Gen Yahya Saree didn't provide evidence or say when the attack occurred.\nThe Saudi civil defence overnight said a projectile fell in a different area near the border with Yemen along the Red Sea, injuring two people and damaging a mosque and several other buildings. The statement blamed the Houthis.\nSaudi Arabia did not announce any new attacks targeting the Houthis.\nThe Houthis are targeting Saudi oil infrastructure and shipping as part of a recently declared blockade. While the Houthis have said they do not intend to threaten other countries' commercial shipping, markets remain wary and oil prices have risen again.\nThe National Resistance, a government-allied force that had controlled coastal areas, said more than 500 government fighters were killed on the west coast over the past four weeks — its first comprehensive toll. It said about 1,500 others had been wounded in the fighting since Aug 9.\nIts statement said more than 1,000 Houthis had been killed in Hodeida and Taiz provinces. A spokesman for the Houthis didn't respond to a request for comment.\nYemen is home to over 40 million people who fear a return to the civil war that killed 150,000 and brought many others to the brink of famine in one of the world's most sprawling humanitarian crises.\nYemen's internationally recognised government and Saudi Arabia have been battling the Houthis for 12 years. A ceasefire that began in 2022 had mostly halted the fighting.\nA senior government official in Yemen said its forces will return to the Red Sea coast and fight back. People fleeing the Houthi advance told The Associated Press they saw forces withdrawing and urging people to run.\nSultan al-Arada, a member of the ruling presidential council, described the collapse of government forces in the port city of Mokha and elsewhere on Yemen's west coast as “painful and regrettable”.\nMr. Al-Arada said in the televised interview aired late Saturday (September 12, 2026) that forces “are currently regrouping and will return to the battle in one form or another.”\nOn Sunday (September 13, 2026), the Yemeni military said it launched airstrikes on Houthi positions in Mokha and the coastal town of Dhubab, and elsewhere in Taiz province.\nThe rebels also reported strikes by the Saudi-backed forces in the province as well as artillery shelling in the province of Saada, the Houthi stronghold on Yemen's northern borders with Saudi Arabia.\nThe Houthis' advance puts them just 32 km from the U.S. military base in Djibouti, on the other side of the Bab el-Mandeb Strait. It's the main US base in Africa and one of several foreign military bases in Djibouti, including those of China, France and Japan.\nThe small Horn of Africa nation is already seeing the arrival of displaced Yemenis making the perilous water crossing. More than 2,000 Yemenis have reached Djibouti, the International Organisation for Migration said.\nDjibouti's Economy and Finance Minister Ilyas M. Dawaleh, said on X that the country's navy, coast guard and other specialised agencies were conducting rescue operations and providing emergency assistance.\n“The displaced people are in a very bad condition,” said Ahmad al-Masawi, the director of the Al Salam camp in the southern port city of Ade", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や対立が次第に激しくなること。この記事では、イエメンにおける戦闘の規模と強度が増していく過程を指す。"}, {"word": "blockade", "definition": "特定の地域や施設に対する物資の通行を禁止または制限する軍事的または経済的手段。フーシ派がサウジアラビアとの間で宣言した海上封鎖を意味する。"}, {"word": "internally displaced persons", "definition": "戦争や自然災害などの理由で自国内で避難を余儀なくされた人々。この記事では8万人以上のイエメン国民が該当する。"}, {"word": "strategic", "definition": "長期的な目標達成のために重要な位置づけや計画に関する。モカ港湾都市はバベルマンデブ海峡という重要な海上通路に関連する戦略的に重要な場所である。"}, {"word": "leverage", "definition": "交渉や影響力を行使する際の優位性または手段。この場合、イランが米国との戦争において利用できる有利な立場を指す。"}, {"word": "ceasefire", "definition": "紛争当事者が合意によって一時的に、または永続的に戦闘を中止すること。イエメンでは2022年から停戦状態が継続していた。"}]}, {"title_ja": "ギリシャ沖で移民を乗せたボートが部分的に沈没、25人が行方不明", "title_en": "Boat carrying migrants partially sinks off Greece, 25 missing", "summary_ja": "日曜日、ギリシャのガヴドス島南部でおよそ77人の移民を乗せたボートが部分的に沈没し、約25人が行方不明になった。沿岸警備隊とEUのフロンテックス船が51人の外国籍者を救出し、行方不明者の捜索活動が続いている。救助活動中に1人が意識不明の状態で発見された。", "summary_en": "A boat carrying approximately 77 migrants partially sank south of the Greek island of Gavdos on Sunday, leaving about 25 people missing. Coast guard and EU Frontex vessels rescued 51 foreign nationals, with search efforts ongoing for the missing persons. One person was found unconscious during the rescue operation.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/boat-carrying-migrants-partially-sinks-in-greece/article71464548.ece", "state_media": false, "category": "社会", "full_text": "About 25 people were missing after a boat carrying migrants partially sank south of the Greek island of Gavdos on Sunday (September 13, 2026), coast guard said.\nSo far, 51 foreign nationals have been rescued by nearby vessels, while one foreign national has been found unconscious, it said.\nIt said search efforts continued for the approximately 25 missing persons, as according to survivors there were 77 people on the boat.\nFour nearby vessels and two European Union border agency Frontex boats were involved in the rescue while another Coast Guard vessel, a Frontex ship and a helicopter headed to the scene.\nPublished - September 14, 2026 02:51 am IST", "translation_ja": "", "vocab": [{"word": "partially", "definition": "完全ではなく、部分的に。全体の一部だけが影響を受けた状態を示す。"}, {"word": "migrants", "definition": "自分の国から別の国に移動する人々。経済的理由や危険から逃れるため移動することが多い。"}, {"word": "coast guard", "definition": "沿岸警備隊。海岸線や海域の安全と秩序を維持する政府機関。"}, {"word": "unconscious", "definition": "意識がない状態。外傷や病気により、目覚めていない状態を指す。"}, {"word": "border agency", "definition": "国境を管理・監視する政府機関。移民や密輸の取締りなどを担当する。"}, {"word": "rescue operation", "definition": "危機的状況にある人々を助けるための組織的活動。迅速かつ協調的に実行される。"}]}, {"title_ja": "イラン・湾岸諸国の協議、合意形成のためオマーンで延期", "title_en": "Iran-Gulf talks in Oman postponed for consensus", "summary_ja": "ホルムズ海峡の海運協定について協議する予定だったイランと湾岸諸国の会合がオマーンで延期されることが発表された。この延期はテヘランとマスカットが共同で決定した地域諸国からの要請によるもである。イランの大統領はブリックス首脳会議の傍らでアラブ首長国連邦の高官と別途会談を行い、地域的緊張の中での外交的関与の意思を示唆した。", "summary_en": "A meeting scheduled between Iran and Gulf countries in Oman to discuss shipping agreements on the Strait of Hormuz has been postponed, Omani Foreign Minister Badr Albusaidi announced. The postponement came at the request of some regional countries in a jointly decided move by Tehran and Muscat. Iran's President held separate discussions with UAE officials at the BRICS Summit, signaling diplomatic engagement despite ongoing regional tensions.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/talks-between-iran-and-gulf-countries-in-oman-postponed-in-the-interests-of-consensus/article71464526.ece", "state_media": false, "category": "社会", "full_text": "A meeting in Oman between Gulf countries and Iran to discuss possible agreements on the Strait of Hormuz, which had been scheduled for Monday (September 14, 2026), has been postponed, Omani Foreign Minister Badr Albusaidi said on X late Sunday (September 13, 2026).\nMr. Albusaidi said the meeting had been postponed \"in the interests of consensus.\" \"We remain committed to fostering dialogue that supports stability and lasting cooperation in our region,\" he added.\nMeanwhile, Fars news agency, citing an Iranian foreign ministry official said the postponement came at the request of some regional countries in a decision jointly made by Tehran and Muscat.\nIran had said Foreign Ministers from regional countries would meet in Oman to discuss efforts by Iran and Oman, located on the other side of the strait, to manage shipping on it. But the\nCommercial ship traffic remains low in the Strait of Hormuz as attacks continue on what was seen as an international waterway before the US and Israel launched the war on February 28.\nBefore the meeting in Oman was postponed, only Iraq had publicly confirmed plans to attend. Bahrain had said it would not attend, citing a lack of diplomatic relations with Tehran.\nSince early in the war, Iran has expressed interest in having ships pay fees for transit. It has said traffic into the Persian Gulf would pass through Iranian waters, while the outbound route would pass partly through Iranian waters and partly through Oman's.\nThere had been some optimism in the region about the planned meeting, with hope that Gulf nations might use it to assert a collective response to a war they had no part in starting. For months, they have faced Iranian attacks that Tehran has claimed target U.S. military assets on their lands.\nOn Sunday (September 13, 2026), Iran's President said he had a \"good talk\" over the weekend with a top official from the United Arab Emirates on the sidelines of a global summit of leading developing nations.\nMr. Pezeshkian said he met with Abu Dhabi's Crown Prince, Sheikh Khaled bin Mohamed bin Zayed, while attending the BRICS Summit in New Delhi.\n\"We talked about issues of concern so that it's possible to put the past behind us, to look toward the future and how we can build the future together,\" Mr. Pezeshkian said. His comments were aired live on Iranian state television.\nWith inputs from AP, Reuters\nPublished - September 14, 2026 01:53 am IST", "translation_ja": "", "vocab": [{"word": "consensus", "definition": "合意や意見の一致を指す。複数の当事者が共通の見解に達すること。国際交渉や会議の文脈では、全員が同意する結論を得るプロセスを意味する。"}, {"word": "postponed", "definition": "予定されていた事柄を後の日時に延期することを意味する。ビジネスや外交では、合意に達するまで会議や交渉を後日に送ることを指す。"}, {"word": "strait", "definition": "二つの陸地に挟まれた狭い海峡を指す。国際法では重要な航路であり、通航権に関する複雑な問題が生じることがある。"}, {"word": "transit", "definition": "通過または移動を意味する。海運の文脈では、船舶が特定の海域を通過することを指す。"}, {"word": "diplomatic relations", "definition": "二国家間の公式な政治的関係を指す。これがない場合、両国間の公式な対話チャネルが存在しないことを意味する。"}, {"word": "assertion", "definition": "主張や要求を強く述べること。政治的文脈では、国家が集団として統一された立場を示すことを指す。"}]}, {"title_ja": "オンタリオ州の教授が学生の成績評価方法を革新", "title_en": "Ontario Professors Transform Student Grading Methods", "summary_ja": "オンタリオ州の教授たちが、従来の成績評価制度から脱却した革新的な評価方法を導入しています。これらの新しい方法は、より意義のあるフィードバックを提供し、学生の学習成果をより正確に評価することを目指しています。この変化はカナダの大学全体における教育評価実践の広範な変化を反映しています。", "summary_en": "Ontario professors are implementing innovative grading approaches that move away from traditional letter grades and numerical scores. These new methods aim to provide more meaningful feedback and better assess student learning outcomes. The shift reflects broader changes in educational assessment practices across Canadian universities.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikgJBVV95cUxPcFp2MDRTSFdaQkZTM3E4VjcwSWRtdFZsd1psQ1ZKMVc2a0wzWERJS0xiZ2RsYnEtcVBZeVhuaGxXYTJOakVvZVM4c0tBN3NNMnZnMFNXQkpqa3lNbzZNNDJSQUNFbGxhT3IwZ3BCaWZRbWJVSVl0N3RXOWx3aXZOVzRBRnVQaHl0X2c1dzVvSEFmMUM3cU5XU054MzlGMklsOGo1d0FIZjFDWW9VMEtsS20zc3lUWnIwUlBiSHZ6ak9JYllBMERIVFN1UVlaRUY0RjRsNWMybGF4NzJaQ2 ニュースカバレッジを提供しています。政治、ビジネス、文化、スポーツなど、幅広いジャンルの速報とレポートを配信しています。", "summary_en": "O Globo provides comprehensive news coverage in English for international audiences. The publication delivers breaking stories and in-depth reporting across politics, business, culture, and sports.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE00WVFsTjVqR2xZQjFKaFZSNHBGUkpwZ2RhZXRRVUpPeHpoNXlfWENGNkN1VW9xOEtmby1oNVpYZVc2Y2huaWh2SnpvdExUbEJvZWhhc3ZXWnRFM2xIcVFiajR4UHA4NENhYXc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オ・グローボ：歴史に誇りを持ち、未来へ向かって", "title_en": "O Globo: Proud of Our History, Looking to the Future", "summary_ja": "ブラジルの主要新聞であるオ・グローボは、その輝かしい遺産を振り返りながら、将来の成長とイノベーションに向けた態勢を整えている。同紙は、質の高いジャーナリズムへのコミットメントとブラジルのメディア界を形作るうえでの役割を強調している。", "summary_en": "O Globo, a major Brazilian newspaper, reflects on its distinguished legacy while positioning itself for future growth and innovation. The publication emphasizes its commitment to quality journalism and its role in shaping Brazil's media landscape.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オグン州が道路、病院、電力投資を含む新規インフラプロジェクトを承認", "title_en": "Ogun State Approves Infrastructure Projects Including Roads, Hospitals, and Power Investment", "summary_ja": "オグン州行政評議会は、道路再構築、2つの新しい総合病院、および州の急速に成長する産業経済をサポートするための電力発電投資を特徴とする包括的な開発パッケージを承認しました。プロジェクトには、マイクロ、中小企業（MSME）向けの支援を調整するオグン州企業開発庁の設立も含まれます。これらの承認は、州全体のインフラ、医療提供、ビジネスサポート、およびエネルギー信頼性を強化するための行政の戦略を反映しています。", "summary_en": "The Ogun State Executive Council has approved a comprehensive development package featuring road reconstructions, two new general hospitals, and a power generation investment to support the state's growing industrial economy. The projects also include the establishment of the Ogun State Enterprise Development Agency to coordinate support for micro, small and medium-sized enterprises (MSMEs). These approvals reflect the administration's strategy to strengthen infrastructure, healthcare delivery, business support, and energy reliability across the state.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/909356-ogun-exco-approves-new-roads-hospitals-power-investment-msme-agency.html", "state_media": false, "category": "経済", "full_text": "The Ogun State Executive Council has approved a fresh package of infrastructure and economic development projects, including new road constructions, two general hospitals, a power-generation investment and the establishment of an agency to drive the growth of micro, small and medium-sized enterprises (MSMEs).\nThe projects, approved at the weekend, further reinforced the administration’s drive to expand infrastructure, strengthen healthcare delivery, support businesses and provide the energy required to sustain Ogun’s rapidly growing industrial economy.\nBriefing journalists on the outcome of the Council meeting on Sunday, the Special Adviser to the Governor on Information and Strategy, Kayode Akinmade, said the Council approved the reconstruction of the 4.87-kilometre Siun Junction–Iperu Junction Road, linking Obafemi Owode and Ikenne Local Government Areas.\nIt also approved the reconstruction of the 4.87-kilometre Simawa–Lukosi/Ogijo Road in Sagamu Local Government Area.\nAkinmade said the Council further approved variations for the reconstruction of the Sango–Ota–Ijoko–Agbado–Oke-Aro–Akute Road (Phase I) in Ifo Local Government Area and the 69.2-kilometre Abeokuta–Abule Egba Road.\nHe said the projects would improve connectivity, ease the movement of people and goods and open up more opportunities for economic activities across the state.\nIn the health sector, the Council approved the construction of new General Hospitals at Itori in Ewekoro Local Government Area and Aiyepe in Odogbolu Local Government Area.\nAccording to Akinmade, the projects would expand the state’s healthcare infrastructure and bring medical services closer to residents, particularly in communities where demand for healthcare services continues to increase.\nIn a major boost to enterprise development, the Council also approved the establishment of the Ogun State Enterprise Development Agency, with a mandate to coordinate and strengthen support for MSMEs across the state.\nThe agency is expected to promote entrepreneurship, facilitate access to business opportunities and strengthen the capacity of small and medium-sized businesses to expand, create jobs and contribute more to the state’s economy.\nThe Council also approved Ogun State’s participation in power generation through the adoption of Gateway Power Limited, in furtherance of the administration’s plan to provide more reliable electricity for the state’s expanding industrial and commercial base.\nAkinmade said the power initiative was particularly important to Ogun’s economic development, given the state’s growing concentration of industries and businesses, adding that a more dependable electricity supply would enhance productivity and strengthen the environment for investment.\nMeanwhile, the Council approved the appointment of Otunba Osunsina Olumide John as the new Olu of Ifo in Ifo Local Government Area.\nThe latest approvals cut across critical areas of Ogun’s development agenda—transport infrastructure, healthcare, enterprise development and energy—reflecting the administration’s strategy of building the infrastructure and economic ecosystem required to support sustained growth across the state.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "reinforced", "definition": "さらに強化された、補強されたという意味。ここでは政府の基盤整備推進戦略がさらに強固になったことを表しています。"}, {"word": "mandate", "definition": "公式な命令や権限という意味で、団体や機関が与えられた公的な役割や責任を指します。"}, {"word": "facilitate", "definition": "～を容易にする、促進するという意味。ビジネスや取引がスムーズに進むようにサポートすることを表します。"}, {"word": "ecosystem", "definition": "相互に関連し支え合う組織やシステムの総体という意味。ビジネスや産業が発展するための統合的な環境を指します。"}, {"word": "connectivity", "definition": "接続性、つながりという意味で、地域間や施設間の移動や通信がスムーズであることを表します。"}, {"word": "expansion", "definition": "拡張、拡大という意味。施設やサービスの規模や範囲が広がることを指します。"}]}, {"title_ja": "娘のポルノ動画投稿で700ドル稼いだと認める女性が逮捕", "title_en": "Woman arrested for child sexual abuse admits earning $700 from posting daughter's videos", "summary_ja": "ナイジェリアのアナンブラ州で36歳の女性が、未成年の娘に対する性的虐待とポルノ動画のオンライン投稿で逮捕されました。警察の尋問中に、国際的な連絡先から違法コンテンツの購入により300～700ドルを稼いだことを認めました。同様の犯罪行為をソーシャルメディアプラットフォームで行う他のナイジェリア人女性がいると主張しています。", "summary_en": "A 36-year-old woman in Anambra State, Nigeria was arrested for sexually abusing her underage daughter and posting pornographic videos online. During police interrogation, she admitted to earning between $300-$700 from an international contact who purchased the illegal content. She claimed other Nigerian women engage in similar criminal activities on social media platforms.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/909349-how-i-made-700-from-posting-my-8-year-old-daughters-pornographic-video-woman.html", "state_media": false, "category": "社会", "full_text": "Anulika Onyeanusia, the 36-year-old woman arrested for using a sex toy on her underage daughter, has admitted that she earned $700 from posting her children’s pornographic video on social media.\nPREMIUM TIMES previously reported that the police in Anambra State arrested Mrs Onyeanusia on Friday in connection with the incident.\nThe suspect, according to the police, was being investigated for child pornography.\nThe couple lives in Onitsha, where police operatives recovered sex toys and other unnamed items from the suspect that would assist in the ongoing investigation.\nPolice said they also rescued four children, aged two, three, six and nine years from the suspect.\nThis newspaper had reported that the suspect’s husband, Ikechukwu Onyeanusia, said he was unaware that his wife was sexually molesting their children.\n$700 earning\nDuring interrogations in what appeared to be a police facility, Mrs Onyeanusia said the highest money she had earned from posting her daughter’s pornographic video clips was $700 only.\nShe also confirmed that the daughter was eight.\nPREMIUM TIMES confirmed that a popular Anambra-based comedian and content creator, Valentine Obinwanne, was the one interrogating the suspect.\nThe suspect claimed she initially sent her daughter’s pornographic video to a “whiteman” via WhatsApp, who subsequently sent her money in dollars.\nWhen asked how much she received from the white man, she responded: “Sometimes, he gave me $300. Sometimes he gave me $400.”\n“So because of $300, (and) $400, that’s why you have to mess up your child to please that man?” Mr Obinwanne, popularly known as Onye Obodo, asked.\nThe content creator told the suspect that he was at the police facility to condemn her for her actions.\n‘I am not the only one doing this’\nAmid condemnation from people at the facility, Mrs Onyeanusia then claimed that she had seen many Nigerian women engaging in similar acts on social media.\n“There’s one lady who also posted two of her children’s (pornographic videos) on our platform.\n“I am not the only one doing this,” she said.\nPolice investigators then informed her that she would help identify others who engage in the act.\n“I don’t know all of them,” she responded.\nREAD ALSO: How I discovered my wife was sexually molesting our daughter Husband\n‘Forgive me, it’s the handiwork of the devil’\nMrs Onyeanusia confirmed that her husband was unaware of her social media activities.\nThe suspect then asked for forgiveness, vowing not to engage in a similar act again.\n“Please, forgive me. It’s the devil’s handiwork,” she pleaded.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "interrogation", "definition": "警察や当局による厳格な質問と調査のプロセス。犯罪事件に関連して容疑者から情報を引き出すために行われます。"}, {"word": "operatives", "definition": "特定の任務や作業を実行する専門的な担当者、特に警察や秘密機関の職員を指します。"}, {"word": "alleged", "definition": "まだ証明されていないが、そうであると主張または疑われている事柄を表します。法的文脈でよく使用されます。"}, {"word": "condemn", "definition": "ある行為や人物を強く非難・批判すること。道徳的に悪いと判断して反対を表明します。"}, {"word": "facilitate", "definition": "何かが起こりやすくする、または容易にする手助けをすること。プロセスをスムーズに進めることを意味します。"}, {"word": "vowing", "definition": "厳粛な誓いや約束をすること。将来の行動について決意を示す時に使用されます。"}]}, {"title_ja": "キリスト教世代の崩壊（第2部）：祈りの架け橋と教会の腐敗への対峙", "title_en": "The Collapse of a Christian Generation (2): Building Prayer Bridges and Confronting Church Corruption", "summary_ja": "牧師アヨ・アケレレは、ナイジェリアの教会が物質主義、オカルト主義、腐敗によって危機に瀕していると警告し、指導者たちが道徳的権威よりも富を優先していると述べています。彼は祈り、聖書的純潔さ、預言的勇気に根ざした世代の育成と、精神的および社会的衰退に対する対抗を呼びかけています。教会指導部の沈黙は富と政治的癒着によって駆動されており、社会の道徳的解決策としての教会の信用を失ったと強調しています。", "summary_en": "Pastor Ayo Akerele warns that Nigeria's churches are compromised by materialism, occultism, and corruption, with senior leaders prioritizing wealth over moral authority. He calls for a generation grounded in prayer, scriptural purity, and prophetic courage to confront spiritual and societal decay. The article emphasizes that church leadership's silence on evil, driven by mammon and political entanglement, has forfeited the church's credibility as society's moral solution.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/909348-the-collapse-of-a-christian-generation-2-by-ayo-akerele.html", "state_media": false, "category": "政治", "full_text": "How to Build the Bridge of Prayer into the Next Generation\nPastors must teach prayer intentionally and consistently. Churches must create active prayer meetings. Parents must pray with their children. Children must see their parents pray. Ministers must avoid diminishing prayer in their messages. Churches must promote purity of doctrine over popularity. Believers must test all spirits and measure all teachings by Scripture.\nLeonard Ravenhill said, “A praying church is not a straying church.” If the next generation forsakes prayer, our generation has failed. We must secure the faith of the next generation. We are living in an age of “Anything Goes” Christianity, sweet, blended, adulterated, numbing, deceptive, and destructive. But God is calling us to raise a generation that knows Him, fears Him, prays to Him, and walks with Him.\nA Generation that Rejects Adulterated Christianity\nA generation that crushes stones of error before they enter the mouth. A generation that stands on Scripture alone. A generation that prays without ceasing. A generation that shines more and more unto a perfect day.\nWe must secure the faith of the next generation, by teaching them to pray, by modeling holiness, and by preserving the purity of the gospel.\n“The voice said, ‘Cry out!’ And he answered, ‘What shall I cry?’ All flesh is grass, and all its beauty is like the flower of the field.” (Isaiah 40:6)\nI stand again upon the staff of my calling, the office of a scribe appointed by the Lord — to speak directly to the conscience of the church, and especially to its leadership. The silence of our elders in the face of rising evil is no longer golden. Heaven is disturbed by the level of compromising quietness displayed in the midst of a raging spiritual war — a war that is steadily eroding the dignity, credibility, and moral authority of the church, which God designed to be the final solution to the persistent plague of sin, wickedness, and corruption in our land.\nThe reasons behind this silence are not mysterious; they are painfully clear.\n“Open your mouth, judge righteously, and plead the cause of the poor and needy.” (Proverbs 31:9)\nScripture declares without ambiguity: “The righteous are as bold as a lion.” (Proverbs 28:1).\nBut when unrighteousness infiltrates the inner fabric of the church, the moral strength required to speak truth to power becomes weakened. Among the many forms of unrighteousness that have captured the church, the love of money, mammon, stands as the greatest thief of spiritual courage.\nAt a time when wicked men, destiny destroyers, and national devourers have ascended into leadership at multiple levels, the prophetic voice of the church’s senior leadership has gone silent. The voice of money now speaks louder than the voice of truth. The applause of crowds has become more valuable than the approval of God.\n“Do not be afraid, but speak, and do not keep silent.” (Acts 18:9).\nTo understand where we are headed, we must first acknowledge where we have fallen. Why has the love of money conquered the hearts of many spiritual leaders in Nigeria? The reasons are practical, painful, and undeniable:\n- Many leaders have turned away from the Lord and now engage in various shades of occultism, witchcraft, and syncretism, practices known to their closest aides and ministry staff.\n- Many work secretly with corrupt politicians, receiving tax waivers, massive donations, lands, cars, and other seductive gifts from men steeped in corruption and occult power.\n- Many belong to pseudo‑occultic “loyalty clubs” and “sons of the prophets” groups, where they have sworn lifetime allegiances to spiritual fathers who manipulate them.\n- Many personally bankroll political parties, elections, and political candidates for personal and ministerial gain.\n- Many are entangled in corrupt business ventures, smuggling, money laundering, forex round‑tripping, land grabbing, illegal mining, and fraudulent real estate schemes — using the proceeds to erect gigantic cathedrals.\n- Many are trapped in sexual perversion, same‑sex scandals, immoral relationships with members, mentees, choristers, and visiting guests during counseling sessions.\n- Many actively initiate junior pastors into occultic ordinations, binding them with “holy communion” rituals and “anointing oils” that enforce lifelong loyalty or threaten destruction if they ever leave.\nAll these evils point to one thing: the desperate accumulation of wealth at any cost.\nStephen King once told the graduating class of Vassar College in 2001: “We come in naked and broke. We may be dressed when we go out, but we’re just as broke. Warren Buffet? Going out broke. Bill Gates? Going out broke.”\nThe catalogue of corruption within the church is long. Because of these things, many leaders no longer possess the moral authority to confront political wickedness. They remain silent in the face of tyranny. And silence is the natural habitat of evil. Evil thrives when good men remain quiet, passive, and apathetic.\nDr", "translation_ja": "", "vocab": [{"word": "adulterated", "definition": "純粋さが失われ、有害な物質が混ぜられた状態。ここでは、聖書の教えが歪められ、世俗的な価値観が混入したキリスト教を指す。"}, {"word": "syncretism", "definition": "異なる宗教や思想体系を無責任に混ぜ合わせること。記事では、教会指導者がキリスト教とオカルト信仰を混在させていることを批判している。"}, {"word": "prophetic", "definition": "神の声や真理を人々に伝える役割に関連する。教会指導者が社会の悪に対して神のメッセージを声高に言う責任を指す。"}, {"word": "mammon", "definition": "富や物質的豊かさ、特に不正な手段で得られた財宝。聖書では富への執着を象徴し、神への信仰と相反するものとされる。"}, {"word": "thief", "definition": "盗む者、または密かに何かを奪い去る者。記事では、お金への愛が精神的な勇気を奪い取ることを比喩的に表現している。"}, {"word": "infiltrates", "definition": "敵や有害な物質が密かに内部に入り込むこと。教会内に不正行為が浸透していく過程を描写している。"}]}, {"title_ja": "イランの強硬派、ホルムズ海峡での船舶攻撃で核合意を破壊", "title_en": "How Iran's Hard-liners Sabotaged Nuclear Deal Through Strait of Hormuz Attacks", "summary_ja": "体制内部者によると、イランの強硬派はトランプ政権との平和交渉を損なうため、ホルムズ海峡での船舶攻撃の秘密キャンペーンを組織した。この秘密作戦は合意を完全に失敗させ、この事実を知ったイランの大統領は激怒したという。", "summary_en": "According to regime insiders, Iranian hard-liners orchestrated a clandestine campaign of ship attacks in the Strait of Hormuz to undermine peace negotiations with the Trump administration. The covert operations successfully derailed the agreement, leaving Iran's president furious upon discovering the sabotage.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/13/world/middleeast/iran-hard-liners-sabotaged-peace-deal.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナの駅でロシア無人機がペトレイアス元CIA長官の近くに着弾", "title_en": "Russian Drone Strike Narrowly Misses Ex-CIA Chief Petraeus at Ukrainian Rail Station", "summary_ja": "元CIA長官デイビッド・ペトレイアス氏がウクライナの駅にいた際、ロシアの無人機による攻撃がその近くで発生した。ウクライナ当局によると、この攻撃はイギリスのジョンソン前首相と他の要人が乗った列車が出発した直後に起きたという。", "summary_en": "Former CIA Director David Petraeus was at a Ukrainian rail station when a Russian drone struck nearby. The attack occurred just after a train carrying British ex-Prime Minister Boris Johnson and other dignitaries had departed, according to Ukrainian officials.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/13/world/europe/ukraine-petraeus-russian-strike.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "チャールズ国王、開発減速の呼び声の中でAIリーダーと会談へ", "title_en": "King Charles Convenes A.I. Leaders Amid Development Concerns", "summary_ja": "チャールズ国王はバッキンガム宮殿で人工知能の経営陣と会談し、技術の責任ある開発について協議する予定。AI企業の指導者間で急速な技術進歩への懸念が高まる中での会合となる。宮殿はAIが社会に良い影響をもたらす方法を探ることを目指している。", "summary_en": "King Charles will meet with artificial intelligence executives at Buckingham Palace to discuss responsible development of the technology. The meeting comes as concern grows among A.I. company leaders about the rapid pace of technological advancement. The palace aims to explore how A.I. can be leveraged for beneficial purposes.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/13/world/europe/king-charles-ai-meeting.html", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、ガザ北部への通行を許可 人質解放の膠着状態が打破", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "イスラエルは、人質解放をめぐる膠着状態の解決後、ガザを二分する軍事地帯の通行をパレスチナ難民に許可した。この決定により、避難民は徒歩でガザ北部への帰還を開始できるようになった。数週間の膠着状態の後、人道的状況は大きな転機を迎えている。", "summary_en": "Israel has permitted displaced Palestinians to cross a military zone that divides Gaza, following the resolution of a standoff regarding hostage releases. The move allows residents to begin returning to the northern part of the enclave on foot. This development marks a significant shift in the humanitarian situation after weeks of deadlock.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発会社が巨額損失を報告、業界危機の深刻化を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Real Estate Crisis", "summary_ja": "中国最大級の不動産開発企業であるワンケは巨額の損失を報告し、全国的な不動産危機の深刻化を示唆している。この財務悪化により、中国政府が不安定な業界に介入するかどうかという懸念が生じている。", "summary_en": "Vanke, one of China's largest property developers, has reported substantial losses, signaling a deepening real estate crisis across the country. The financial deterioration raises concerns about whether the Chinese government will intervene to stabilize the troubled sector.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From October 7 Attack", "summary_ja": "イスラエルの医療関係者によると、最近解放された8ヶ月間捕虜として拘束されていたイスラエル人人質は、10月7日の攻撃による破片が体内に残っていた。何人かの女性人質は長期間隔離され、捕虜期間中ずっと地下トンネルに閉じ込められていた。医学的知見は、ハマスに拘束された者たちが経験した深刻な身体的トラウマを浮き彫りにしている。", "summary_en": "Recently released Israeli hostages who were held captive for eight months retained shrapnel injuries from the October 7 attack in their bodies, according to Israeli medical officials. Some of the women hostages were isolated for extended periods and confined in underground tunnels throughout their captivity. The medical findings highlight the severe physical trauma experienced by those held by Hamas.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "世界の指導者たちが核戦争への恐怖を失いつつある", "title_en": "World leaders are losing their terror of nuclear war", "summary_ja": "プーチン、トランプ、習近平は地球上で最も強力な核兵器を保有しているにもかかわらず、冷戦時代よりも核のリスクを真摯に受け止めていないようである。エコノミスト誌は、大国の指導者たちのこうした油断が世界の安全保障に対して重大な脅威をもたらしていると警告している。地政学的緊張が高まる中、核の危険性に対する新たな敬意が急務である。", "summary_en": "Putin, Trump, and Xi Jinping control the world's most powerful nuclear arsenals, yet appear to be taking nuclear risks less seriously than during the Cold War. The Economist warns that this complacency among leaders of major powers poses a significant threat to global security. As geopolitical tensions rise, a renewed respect for nuclear dangers is urgently needed.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/08/world-leaders-are-losing-their-terror-of-nuclear-war", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "10代の学生の学力低下が深刻化？世界規模の学力試験で衝撃的な成績低下が判明", "title_en": "Are teenagers growing dimmer? Global school tests reveal shocking new declines", "summary_ja": "世界規模の学力試験の最新結果から、複数の教科と地域で生徒の成績が低下していることが明らかになった。このデータは10代の学生の学力低下が進行中であることを示唆しており、世界中の教育の質と学習成果について懸念が高まっている。", "summary_en": "Recent global school assessments show concerning declines in student performance across multiple subjects and regions. The data suggests a troubling trend in teenage academic achievement, raising questions about educational quality and learning outcomes worldwide.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/08/are-teenagers-growing-dimmer", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "仕事が家族をより平等にする方法", "title_en": "How work makes families more equal", "summary_ja": "特に女性の雇用は、世帯内の経済的不平等を削減する強力な力となっています。仕事を通じて得られる経済的自立により、家族成員はより均衡のとれた交渉力と意思決定権を持つようになります。この経済的変化は家族のダイナミクスを根本的に変え、より大きな平等を実現します。", "summary_en": "Employment, particularly among women, has become a powerful force for reducing economic inequality within households. The financial independence gained through work allows family members to have more balanced bargaining power and decision-making authority. This economic shift fundamentally reshapes family dynamics and contributes to greater equality.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/03/how-work-makes-families-more-equal", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス大統領選：ル・ペン極右政党が過去最高の支持率、有権者の不安と怒りが高まる", "title_en": "Le Pen leads in polls as France's far-right gains momentum amid voter anxiety", "summary_ja": "フランスの極右ラッセンブルマン・ナショナル党のマリーヌ・ル・ペンが過去最高の支持を獲得する一方、急進左派のジャン=リュック・メランションも強固な基盤を構築している。政治的分極化が進む中、他の候補者との競争も激しさを増している。ル・モンドの最新世論調査によれば、有権者は国の将来に対する深刻な懸念と怒りで二分されている。", "summary_en": "Marine Le Pen's Rassemblement National is experiencing record support in France's polarized political landscape, while radical left candidate Jean-Luc Mélenchon also builds significant momentum. The race remains competitive for other candidates as voters express deep concerns about the country's future. Le Monde's latest polling reflects a divided electorate driven by worry and anger.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/09/13/2027-presidential-election-le-pen-begins-campaign-in-strongest-position-ever-amid-worried-angry-electorate_6757478_5.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スウェーデンの政治家ビルギッタ・オールソン、がんとの闘いを経て極右勢力に対抗するため政界復帰", "title_en": "Swedish politician Birgitta Ohlsson returns to fight far-right extremism", "summary_ja": "2度のがん治療を経験した元リベラル派政治家ビルギッタ・オールソンが、スウェーデンの総選挙に出馬する。51歳の親欧州派フェミニストは、新中道党から立候補し、かつての政党陣営における極右への傾斜に対抗することを決意している。", "summary_en": "Birgitta Ohlsson, a former Liberal politician who left politics after battling two cancers, is returning to the electoral arena in Sweden's general election. The 51-year-old pro-European feminist is now running with the Center Party to combat the far-right drift within her former political camp.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/m-le-mag/article/2026/09/13/when-you-re-that-sick-you-reflect-on-the-values-that-matter-most-sweden-s-birgitta-ohlsson-returns-to-fight-the-far-right_6757468_117.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スウェーデン選挙は接戦、極右勢力が後退", "title_en": "Sweden's Election Too Close to Call as Far Right Loses Ground", "summary_ja": "スウェーデンの選挙で投票数の50%以上が開票された時点で、マグダレーナ・アンデルソン率いる野党社会民主党の4党連合がクリステルソン首相の右派連立政権に対してわずかなリードを保っている。専門家は選挙の結果が最終投票次第になる可能性があると予測している。この結果は近年勢いを増していた極右政党にとって大きな後退となっている。", "summary_en": "With more than half the votes counted in Sweden's election, the opposition Social Democrats led by Magdalena Andersson hold a narrow lead over Prime Minister Ulf Kristersson's right-wing alliance. The race is expected to be extremely tight, with experts predicting the final outcome could depend on the last votes counted. The result marks a setback for the far-right party that had gained prominence in recent years.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/13/sweden-s-election-too-close-to-call-as-far-right-loses-ground_6757483_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省のお知らせ", "title_en": "Mindef Updates", "summary_ja": "シンガポール防衛省（Mindef）からのニュースレター更新です。読者はストレーツ・タイムズのニュースレター購読を管理できます。", "summary_en": "This is a newsletter update from Singapore's Ministry of Defence (Mindef). Readers can manage their subscription preferences for The Straits Times newsletters.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートは購読者向けの日刊ニュース速報です。このニュースレター版は2026年9月13日のニュースと最新動向をカバーしています。読者は提供されたリンクを通じてサブスクリプション設定を管理できます。", "summary_en": "The Straits Times Evening Update provides daily news briefing to subscribers. This newsletter edition covers September 13, 2026 news and developments. Readers can manage their subscription preferences through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズが購読者向けの日刊朝刊ニュースレターを配信しています。本号は2026年9月13日日曜日のニュースと更新情報をカバーしています。読者は提供されたリンクから購読設定を管理できます。", "summary_en": "The Straits Times delivers its daily morning briefing newsletter to subscribers. This edition covers news and updates for Sunday, September 13, 2026. Readers can manage their subscription preferences through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル文化大臣、ガザ紀録映画製作者の市民権剥奪を脅迫", "title_en": "Israeli Culture Minister Threatens to Revoke Citizenship of Gaza Documentary Filmmakers", "summary_ja": "イスラエルの文化大臣がガザに関する紀録映画を製作した映画製作者の市民権剥奪を脅迫している。この脅迫はイスラエル当局と紛争を報道するメディア専門家の間の緊張の激化を示している。この動きはイスラエルにおける表現の自由と報道の自由に対する懸念を引き起こしている。", "summary_en": "Israel's Culture Minister has threatened to revoke the citizenship of filmmakers who created a documentary about Gaza. The threat represents an escalation in tensions between Israeli officials and media professionals covering the conflict. The move has raised concerns about freedom of expression and press freedom in Israel.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiogJBVV95cUxPX0hEeFZoZWFvV19Zc1p3Yjh2MFlQZXhnaHZfQUNvbEVSWEZnazh2X2JUTDVLRVZEdGFIbmNubS1SMFhzTkRZSU81WDI0S29makRERlJPQUZrNXpFcDBYOTE4V04zWFhIbVRlZEhmb01NRVJJZ1FjM0xFYm5LSnE3UElwMUhpWkxxUDAtcFl6Z2ZmN05pOVVKZkxYZXlmN2ozSGdKc1AtZFZzdWhDdFFwaEF0TV9ocENtT3piWndoTEZDX0x0UTg4NVJLa201U3lYaHZoOEpWQTF2am1NbllndEkxM2t2R0pnOEh3ZmNCNTNTUkhNV1FPNlFSQnpjeDRweDhYOThmdmt1NTA5RUZzOGluUmJIMWxGZHJMWEtSSkNFQQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "IDF、正当な理由なくパレスチナ人を射撃した兵士は規則違反と発表", "title_en": "IDF says soldier who shot Palestinian broke regulations", "summary_ja": "イスラエル国防軍（IDF）は、正当な理由なくパレスチナ人を射撃している様子が映像に記録された兵士が、軍事規則に違反していたことを認めた。この事件は武装解除規則と軍内の説明責任に関する懸念を引き起こしている。", "summary_en": "The Israeli Defense Forces acknowledged that a soldier filmed shooting a Palestinian without apparent justification violated military rules. The incident, captured on video, has raised concerns about rules of engagement and accountability within the IDF.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiAJBVV95cUxQbm1Gdy1ReVNIUlNiUnp6QTE0aGVnTkxfbFhnSWJETm9wVEZIMHllOHZlLVBCT0JOOTJROV9teW01M24zZnlMSXpfcDI1VkNMeTBkM3RDS3g4YTA2SHRYbmRiNDRBc0NNREtXdmxYWkF0RDNscG9JZC1mdWtRdThXLXRuM2NIY3owckRaekFreEhPYWdzWkdDaUJRVUlyc25LUTlOa19FaVRTRmtSTDF6dHhtN3ZpUlV5Yk8zR0VtUjA2a3U5bkNiRFJZQ0ZGUFdWLVBpTkdJY2JuQ3VtNVhOdDhCekl4VVJ0WEZaaTIyZTRoV21aSFdkV3JSN2RGOW1UakplcklBams?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ガザの殺害事件を扱うイスラエル監督作品、ベネチア映画祭で特別審査員賞を受賞", "title_en": "Israeli-directed Film on Gaza Killings Wins Special Jury Prize at Venice", "summary_ja": "ガザでの殺害事件を扱うイスラエル人監督による映画が、ベネチア映画祭で特別審査員賞を受賞した。同作品は紛争の人道的影響を記録した芸術的貢献が認められた。", "summary_en": "An Israeli-directed film examining killings in Gaza has received the Special Jury Prize at the Venice Film Festival. The award recognizes the film's significant artistic contribution to documenting the humanitarian impact of the conflict.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihAJBVV95cUxPalR6V1pGb0hjanJkcGhERHVuU2MzQ0dDOFdpZ1NHTFR6VzZaQ0VTVzN3SlEtZTdNMldfYXBPcFdFSS11R0tsZk03OF9ZT3VpWExFV1YzOGg0US03UjNXazJhdzdZQVl6bFpJSkJVS1ZicDZ4T2VZVC15VDdVWVJkNllvNXRhU0I4dkQ0cWFhUndDODJOdDBfZ093WGZ1MEpDRExLTGZrRHRCZUFRNFdsNkpjUWhSZWtwX1BIR3lTWTJIUXN6Vnl6VE5Pc2lFaXFtQmxRQUhpR1h3ekQ2Y2hNLUQ2dU1jVHFiM3UxTVNhN1czQmhJYWcxWHJIWXhnZWJUblRYdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の人口減少が32ヶ月連続で継続", "title_en": "Taiwan's Population Continues Declining for 32nd Consecutive Month", "summary_ja": "台湾は32ヶ月連続で人口減少を記録しており、島国の持続的な人口統計上の課題を示唆しています。この継続的な傾向は、出生率の低下と高齢化による長期的な経済・社会的持続可能性への脅威を反映しています。継続する人口減少は、政策的介入を通じて人口危機に対処する必要性を浮き彫りにしています。", "summary_en": "Taiwan has experienced its 32nd consecutive month of population decline, marking a persistent demographic challenge for the island nation. This ongoing trend reflects declining birth rates and aging population issues that threaten long-term economic and social sustainability. The continued decline underscores the urgency for Taiwan to address its demographic crisis through policy interventions.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9yS2YtYUdGTThGWGNEZ0hlUlNKTW16TGVrcnBqOHJ3YndXX0pTaV9DWnBBd1FCS1hVVnNOVTZURnk2bHJkN1JLOTE0MzlxM3VYNml0X0tn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "空港で航空会社インターン職員を刃物で脅迫した男が逮捕", "title_en": "Man Arrested at Airport After Holding Airline Intern at Knifepoint", "summary_ja": "空港で航空会社のインターン職員をナイフで脅迫した男が逮捕された。警察当局は対峙の後、容疑者を身柄確保した。事件の動機と詳細な状況については現在調査中である。", "summary_en": "A man was arrested at an airport following an incident in which he held an airline intern hostage at knifepoint. The suspect was apprehended by authorities after the confrontation. Details regarding the motive and circumstances of the incident remain under investigation.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBsU0tpRm5wMTVyX2ZqR3RvVngyckdnM3ZFZzVnWlFrWjE0SVdYdnhtdjJBSEctTThqZlk3TEhDNGVpN3NENGZoWkhMSnNoNjVaMjVRQ2tn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "新型iPhone、プリオーダー開始から2分で完売", "title_en": "New iPhones Sell Out Within 2 Minutes of Preorder Launch", "summary_ja": "ベンダーの報告によると、新型iPhoneはプリオーダー開始からわずか2分で完売したという。消費者の強い需要がAppleの最新スマートフォンに対して存在することが明らかになった。この急速な在庫枯渇は、新型iPhoneが初期段階で供給不足に直面する可能性を示唆している。", "summary_en": "New iPhone models sold out in just 2 minutes after preorders opened, according to reports from vendors. The rapid sell-out demonstrates strong consumer demand for Apple's latest smartphone offerings. This swift inventory depletion suggests the new iPhones may face initial supply constraints.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE92ZGFxdGtPY1laTjYtU191UlJGOXNTR0hSOHFRc1FiQldyVFllUzFpRFRmanhELThLZWpMNXphdFpHenE3Xzd1OHhRWXhlWnFfUHdWVzJrcw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国、国連安保理でテロ対策における国際協力の強化を呼びかけ", "title_en": "China Calls for Stronger Global Counterterrorism Cooperation at UNSC", "summary_ja": "CGTNが報じたところによると、中国は金曜日の国連安保理テロ対策討論会でテロ対策における国際協力の強化を呼びかけた。CGTNが報じたところによると、中国は新技術がもたらすテロ対策における新たなリスクに対処するよう国際社会に促した。", "summary_en": "CGTN reports that China called for stronger international cooperation in counterterrorism efforts during a UN Security Council debate on Friday. CGTN reports that China urged the international community to address emerging risks posed by new technologies in combating terrorism.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-12/China-calls-for-stronger-global-counterterrorism-cooperation-at-UNSC-1Qnboc88kE0/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラク、サウジアラビアへのドローン攻撃を受けて司令官を解任", "title_en": "Iraq Dismisses Commander Following Drone Attacks on Saudi Arabia", "summary_ja": "CGTNが報じたところによると、イラクのアリ・アル・ザイディ首相兼武装勢力最高司令官は土曜日、南部イラクのマイサン州のサイトからサウジアラビアを狙った攻撃が発動されたことが確認されたため、マイサン作戦司令官を解任した。CGTNが報じるところでは、武装勢力最高司令官であるアル・ザイディは、この無許可の攻撃に対応して解任措置を講じた。この解任は、イラクが事件に対処し、軍事作戦に対する支配を示す努力を反映している。", "summary_en": "CGTN reports that Iraqi Prime Minister Ali al-Zaidi dismissed the Maysan Operations Commander on Saturday after confirming that attacks targeting Saudi Arabia were launched from a site in Maysan province in southern Iraq. CGTN reports that al-Zaidi, who serves as commander-in-chief of the armed forces, took this action in response to the unauthorized strikes. The dismissal reflects Iraq's effort to address the incident and demonstrate control over its military operations.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-12/Iraq-sacks-commander-over-drone-attacks-on-Saudi-Arabia-1QnA3AlstcQ/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "インドの歴史家：南南貿易が急速に成長している", "title_en": "Indian Historian: South-South Trade Growing Dramatically", "summary_ja": "CGTNは、インドの歴史家が途上国間の貿易の大幅な成長を指摘していると報道している。報告書は、グローバルサウス諸国間の経済的つながりの拡大を強調しており、国際商取引パターンの転換を示唆している。", "summary_en": "CGTN reports that an Indian historian has highlighted significant growth in trade between developing nations. The report emphasizes the expanding economic connections among Global South countries, suggesting a shift in international commerce patterns.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-10/Indian-historian-South-South-trade-is-growing-dramatically-1QksyNmGIog/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "北朝鮮、巡航ミサイルと弾道ミサイルの訓練を実施", "title_en": "North Korea conducts drills with cruise and ballistic missiles", "summary_ja": "TASSは、北朝鮮が巡航ミサイルと弾道ミサイルを用いた軍事演習を実施したと報じている。朝鮮中央通信社によれば、この訓練には攻撃用ドローンと、サーモバリック弾頭を装備した大口径多連装ロケットシステムも含まれていたという。", "summary_en": "TASS reports that North Korea conducted military exercises involving cruise and ballistic missiles. According to the Korean Central News Agency, the drills also included strike drones and large-caliber multiple-launch rocket systems equipped with thermobaric munitions.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2187105", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "CENTCOM司令官、米軍の弾薬不足の懸念はないと表明", "title_en": "US Military Has No Concerns About Ammunition Shortage, Says CENTCOM Head", "summary_ja": "TASSが報じたところによると、ブラッド・クーパー提督は米軍が「十分に武装し、あらゆる事態に対応する準備ができている」と述べ、陸軍の弾薬不足の可能性についての懸念はないと表明しました。CENTCOM司令官の発言は、現在の弾薬備蓄と軍の準備態勢に対する自信を示唆しています。", "summary_en": "TASS reports that Admiral Brad Cooper stated the US military is \"well armed and ready for any contingency\" and expressed no concerns about potential ammunition shortages in the Army. The CENTCOM commander's comments suggest confidence in current munitions stockpiles and military preparedness.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2187101", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スウェーデン議会選挙の出口調査で野党ブロックがリード", "title_en": "Opposition bloc leads Swedish parliamentary elections in exit polls", "summary_ja": "TASSが報じたところによると、SVTテレビが引用した出口調査では、スウェーデンの野党4党が投票の51.3%を獲得する見込みであるのに対し、右翼4党は46.8%となっている。この結果は、選挙後に議会の勢力図が変わる可能性を示唆している。", "summary_en": "According to exit polls cited by SVT television, TASS reports that Sweden's four opposition parties are projected to receive 51.3% of the vote compared to 46.8% for the four right-wing parties. The results suggest a potential shift in parliamentary power following the election.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2187099", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "IMFが必要とするプログラム再設計", "title_en": "The Program Redesign the IMF Needs", "summary_ja": "IMFは2019年以来初の大規模なプログラム設計と条件性の見直しを実施しており、発展途上国の広範な債務危機の中で行われている。著者は、マクロ経済の不均衡が世界的に開発見通しを著しく弱めているため、基金の貸付ガイドラインの3つの主要な側面を改革する必要があると主張している。", "summary_en": "The IMF is conducting its first major review of program design and conditionality since 2019, amid widespread debt distress in developing countries. The author argues that the Fund's lending guidelines need reform to address three key features, as macroeconomic imbalances continue to severely weaken development prospects globally.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/three-issues-for-imf-review-of-program-design-by-martin-guzman-and-joseph-e-stiglitz-2026-09", "state_media": false, "category": "オピニオン", "full_text": "The Program Redesign the IMF Needs\nand\nThe International Monetary Fund’s guidelines for program design are more salient than ever, given widespread debt distress in developing countries. As the Fund undertakes its first major evaluation since 2019, it should focus on three features of its lending, all of which need to be reformed.\nNEW YORK—The International Monetary Fund is conducting a Review of Program Design and Conditionality, its first major evaluation since 2019, before the COVID-19 pandemic. With so many countries suffering from macroeconomic imbalances and debt distress that are severely weakening their development prospects, the IMF guidelines for program design, while always important, are more salient than ever.", "translation_ja": "", "vocab": [{"word": "conditionality", "definition": "国際金融機関が融資を提供する際に借入国に課す条件や要件。IMFやWorld Bankが資金援助の見返りとして政策改革を要求することを指す。"}, {"word": "macroeconomic imbalances", "definition": "インフレ、失業率、財政赤字、国際収支など、国全体の経済的な不均衡や歪み。一国の経済全体の安定性に影響を与える問題。"}, {"word": "debt distress", "definition": "政府や企業が債務返済義務を果たすことが困難または不可能な経済的状況。深刻な財政危機を示す。"}, {"word": "salient", "definition": "特に重要である、顕著である、目立つという意味。特定の状況下で特に重要性が高いことを表現する。"}, {"word": "lending guidelines", "definition": "金融機関が融資を実行する際に従うべき基準や方針。IMFなどの国際機関が貸付プログラムの条件や要件を定めたもの。"}]}, {"title_ja": "AIは政府をより遅くする可能性がある", "title_en": "AI Could Make Governments Slower", "summary_ja": "政府がAIツールを採用して情報処理と効率化を進める一方で、著者は人間の監督能力が有限であり、公共サービスに新たなボトルネックが生じると主張している。AI生成の法的文書が1%から18%に急増した事例は、AIの拡大がシステムを合理化するのではなく、制度的な審査を緊張させることを示している。", "summary_en": "While governments increasingly adopt AI tools to process information and improve efficiency, the author argues that human oversight capacity remains finite, creating new bottlenecks in public services. The surge in AI-generated legal documents—from 1% to 18% of federal complaints—illustrates how AI proliferation strains institutional review systems rather than streamlining them.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/by-speeding-up-routine-tasks-ai-may-end-up-overwhelming-human-decision-makers-by-sami-mahroum-2026-09", "state_media": false, "category": "オピニオン", "full_text": "AI Could Make Governments Slower\nGovernments are increasingly turning to AI tools to process vast amounts of information and make public services more efficient. But because human attention is finite, making machines more capable could simply create new bottlenecks wherever oversight is necessary.\nABU DHABI—AI-generated writing has become ubiquitous since ChatGPT’s release in 2022, and institutions are struggling to keep up. Nowhere is the pressure more evident than in the courts. In the United States, the share of federal lawsuits filed without a lawyer rose from an 11% average in 2005–22 to 16.8% in 2025, with researchers linking the surge to the advent of AI. The same study found that the share of federal civil complaints containing machine-written text rose from 1% in 2023 to 18% today.", "translation_ja": "", "vocab": [{"word": "ubiquitous", "definition": "至る所に存在する、ありふれた。テクノロジーやトレンドが広く普及し、どこでも見られる状態を指す。"}, {"word": "bottleneck", "definition": "プロセスやシステムの流れを制限する障害点。生産や処理の効率を低下させる制約条件を意味する。"}, {"word": "oversight", "definition": "監督、管理。また、過失や見落としも意味する。ここでは人間による監視・チェック機能を指す。"}, {"word": "advent", "definition": "到来、出現。特に重要な物事や時代の始まりを指す。新しいテクノロジーの登場に使われることが多い。"}, {"word": "surge", "definition": "急増、急上昇。数値やデータが短期間に大幅に増加する現象を表す。"}, {"word": "finite", "definition": "有限の、限度のある。無限ではなく、測定可能で限定された量や能力を指す。"}]}, {"title_ja": "インドの女性労働参加率がなぜ低いのか？", "title_en": "Why Do So Few Women Work in India?", "summary_ja": "インドの女性労働力参加率35%はバングラデシュやフィリピンなどの同等経済と比べて低いが、著者はこれが社会規範ではなく労働需要の弱さが主な原因だと主張している。最近の女性参加の増加の70%以上は、隠蔽された雇用を伴う農業・生計部門から来ている。著者は規制改革と公共投資を通じてこの問題を解決できると示唆している。", "summary_en": "India's female labor force participation rate of 35% lags behind peer economies like Bangladesh and the Philippines, but the author argues this is primarily due to weak labor demand rather than social norms. Over 70% of recent increases in female participation have come from agriculture and subsistence sectors with disguised employment. The author suggests the problem can be addressed through regulatory reforms and public investment.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/india-low-womens-labor-force-participation-rate-about-demand-not-norms-by-shishir-gupta-and-aalhya-sabharwal-2026-09", "state_media": false, "category": "オピニオン", "full_text": "Why Do So Few Women Work in India?\nand\nIndia’s female labor force participation rate has long lagged behind that of peer economies like Bangladesh, not because of social norms, but because of weak demand for labor. That is ultimately good news, because it is a problem that can be solved with common-sense regulatory reforms and public investment.\nNEW DELHI—India’s female labor force participation rate (LFPR) stands at 35%, which is well below that of peers like Bangladesh (42%) and the Philippines (50%). Though it has risen substantially from 21% in 2017–18, a closer examination reveals that over 70% of the increase came from the agriculture and subsistence sectors, with significant levels of disguised employment.", "translation_ja": "", "vocab": [{"word": "labor force participation rate", "definition": "労働力参加率。働く能力と意思を持つ人口に対する、実際に就業または求職している人の割合を示す経済指標。"}, {"word": "disguised employment", "definition": "偽装雇用・隠蔽雇用。統計上は雇用とされるが、実際には不完全就業や自給農業など実質的な生産性が低い就業形態。"}, {"word": "subsistence sectors", "definition": "生計部門。農業や家内手工業など、生存に必要な基本的なニーズを満たすための経済活動を行う部門。"}, {"word": "peer economies", "definition": "同等経済。発展段階や経済規模がほぼ同じレベルの国々。比較分析の対象として用いられる。"}, {"word": "regulatory reforms", "definition": "規制改革。政府が市場参入障壁を下げたり、ビジネス環境を改善したりするための法律や規則の変更。"}]}, {"title_ja": "トランプ政権がなぜ自転車レーンを「DEI」と呼ぶのか", "title_en": "Why the Trump Administration Wrongly Labels Bike Lanes as 'DEI'", "summary_ja": "著者デイブ・シリングは、トランプ政権が自転車レーンを「DEI（多様性・公平性・包括性）」と切り捨てることは論理的に無意味であり、正当な運輸上の懸念ではなく男らしさについての偏った非合理的見方に由来していると主張している。彼は自転車レーンの環境上と安全上の利点を認めながら、子どもでも乗りこなせるスキルがどのように多様性に分類されるのかを風刺的に疑問視している。", "summary_en": "Author Dave Schilling argues that the Trump administration's dismissal of bike lanes as \"DEI\" is rhetoically nonsensical and stems from a blinkered, irrational view of masculinity rather than legitimate transportation concerns. He acknowledges bike lanes' environmental and safety benefits while satirically questioning why biking—a skill even children possess—could be classified as diversity, equity, and inclusion.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/13/trump-administration-bike-lanes-dei", "state_media": false, "category": "オピニオン", "full_text": "I’m out of gas. Not metaphorically. Literally, my car has the barest minimum amount of fuel in it. This is not because I like to live dangerously, a la the great literary hero Austin Powers, but because gas is more expensive than ever. I have nowhere to be today, so I’m allowing my car to sit idle, empty and alone, lest my bank account disappear into the Phantom Zone of negative balance. If things get sticky, I can take public transit or, God forbid, ride a bike.\nExcept I can’t ride a bike, thanks to my parents, who were too busy doing more important tasks than teaching me, like arguing or falling asleep. But for many Americans, riding a bike is a perfectly normal thing to do. Am I humiliated that one of the many basic skills for life that I don’t know is considered so simple that it became a common idiom for something that’s easy? Yes, of course. I don’t live dangerously, I live humiliatingly. Humiliation is my middle name. Dave Humiliation Schilling. Go on, point and laugh at the photo of me in this article. Get it out of your system so we can move along.\nThanks.\nAs I was saying, many people can ride a bike if they can’t drive a car for whatever reason, and they’ll be perfectly happy doing it. They smile broadly as the wind whips through the holes in their helmet and gently touches the exposed hairs on their head. They pedal like their lives depend on it (they do), dodging deadly automobiles operated by inattentive drivers. In some cities, there are dedicated lanes for these brave bikers, theoretically inoculating them from the dangers of cars pancaking them.\nThe United States has 4,400 directional miles of bike lanes, offering safety for anyone serious enough to risk it. The push for bike lanes began in the 1960s and grew in the ensuing decades. Theoretically, the lanes offer a carbon-neutral alternative to driving a car. If one chooses to bike instead of drive, it’s one fewer toxin-spewing death trap creating pollution and traffic congestion on the motorways. That sounds like a boon for the world, so naturally, the Trump administration wants to do away with it.\nCondemning “DEI bike lanes”, the Trump administration has made a point of freezing or canceling related grants, referring to alternative transit options as unworkable in the United States, and suggesting removing the lanes that already exist. Their logic, if we are using that term loosely, is that bike lanes take space away from cars, create more traffic, and lead to chaotic roads.\nI suppose that’s true, if we assume that there is an infinite number of cars and bikes are just extra, rather than an alternative that takes cars off the street. But that clashes with studies that say bike lanes actually make the roads safer by forcing drivers (sensible ones, at least) to slow down and avoid potential vehicular manslaughter charges.\nRhetorically, the administration’s charge of bike lanes being some form of diversity, equity, and inclusion makes no sense. If riding a bike is so easy, then how can we classify it as unique enough to be diverse? Children ride bikes. It’s far less exotic than, say, operating a motorcycle, which takes a special license in every state. Maybe if we had a dedicated lane for a penny-farthing, I’d buy this explanation. If I were tooling around on one of those, I’d never get where I was going, because scores of beautiful women would be stopping me every few feet.\nConservative disapproval for bike lanes stems from a blinkered, irrational view of culture, and more accurately, masculinity. Trumpists have teased Joe Biden and Pete Buttigieg for riding bikes. But I’ve been teased for not being able to ride a bike. Shouldn’t I be lauded for my commitment to machismo? My belief in the petrol-powered conveyance deserves commendation. My parents’ inattention to my development actually made me cooler, right?\nIf anything, I’m the diversity in this scenario. I can’t use a bike lane. I’ve been excluded from significant parts of the road. I can’t even walk in the bike lane. I should be furious, writing pointed, profane letters to my city councilperson, begging them to release me from my shackles. Or better yet, I should demand the city taxpayers pay for me to take bike lessons, so I can be accommodated. I’m the weirdo here. The one who has to explain my predicament, to feel excluded from the general population. Except, I’m not going to complain.\nI might seethe when I have to swerve to avoid a biker. I might slam on my brakes when I try to turn right and a Schwinn comes screaming through the crosswalk. Maybe I complain for a living on the internet, but I’m also a responsible citizen of the world. I see the obvious benefits of bike access for those that choose to do it, for fitness or for affordability.\nI can’t ride a bike now, but as my car becomes more and more of a money pit, voraciously hoovering up my meager income like the video game character Kirby, I see the benefits of learning, even if I’m in my 40s and will look absolutely ridiculous.\n", "translation_ja": "", "vocab": [{"word": "inoculating", "definition": "保護する、免疫を与えるという意味。ここでは危険から守る、防ぐという比喩的用法で使われている。"}, {"word": "inattentive", "definition": "注意散漫な、不注意な。注意力を失った状態を示し、危険な状況を引き起こす可能性がある。"}, {"word": "blinkered", "definition": "視野が狭い、固定観念に縛られた。目隠しされた状態のように見識が限定されていることを表す。"}, {"word": "rhetoric", "definition": "修辞学、弁論術。または説得力を持つことを目的とした言葉遣いや議論の技法を指す。"}, {"word": "meager", "definition": "貧弱な、少量の。資源や量が限定的で不十分な状態を表す。"}, {"word": "voraciously", "definition": "貪欲に、むさぼるように。大量かつ激しく消費する様子を示す副詞。"}]}, {"title_ja": "トランプ政策がイギリスの経済安定を脅かしている、とガーディアン論説委員が主張", "title_en": "Trump's policies are undermining Britain's economic stability, argues Guardian columnist", "summary_ja": "リチャード・パーティントンは、財務大臣ジョン・ヒーリーが直面する深刻な経済的逆風の多くは、米国・イラン緊張からの石油価格ショック、無責任な財政政策、自動車産業などイギリス産業に影響を与える関税脅迫を含むドナルド・トランプの行動に遡ることができると主張している。イギリス経済の回復力を認める一方で、パーティントンは悪化する金融市場の状況がヒーリーの予算選択肢を大きく制限し、イギリスが独自の経済的運命をコントロールするのに苦労する可能性があると警告している。", "summary_en": "Richard Partington argues that Chancellor John Healey faces severe economic headwinds largely traceable to Donald Trump's actions, including oil price shocks from US-Iran tensions, reckless fiscal policies, and tariff threats affecting British industries like automotive manufacturing. While acknowledging some resilience in the UK economy, Partington warns that deteriorating financial market conditions could severely constrain Healey's budget options and leave Britain struggling to control its own economic destiny.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/business/2026/sep/13/uk-autumn-budget-healey-trump", "state_media": false, "category": "オピニオン", "full_text": "Britain is not entirely in control of its own destiny, from the rising cost of the weekly shop, to the vaulting cost of government borrowing. What is said and done in Westminster matters. But the global backdrop is making life tough, not least in the deeds and words of one man: Donald Trump.\nAs John Healey drafts his plan for next month’s autumn budget, the perilous economic conditions the chancellor must navigate can be traced back to the door of the US president.\nThe US-Israel war on Iran is driving up inflation, amid the most serious shock to oil and gas prices of the modern age. The global financial market turmoil this has triggered is adding to the debt servicing costs of governments worldwide, in a situation made worse by Trump’s reckless fiscal policy and threats of interference at the US Federal Reserve.\nMeanwhile, there was a grim irony last week as Healey travelled to Coventry for his first big speech as chancellor on the same day that Jaguar Land Rover – with its headquarters just down the road – announced 4,000 job cuts, as Trump’s tariff policies throttle the car industry. The president’s geopolitical posturing and steps to dismantle the post-second world war western security consensus are also adding to pressure on Healey to ramp up defence spending.\nIn his speech, Healey did not directly call out the source of these economic headwinds sweeping in from across the Atlantic. But he was wistful about the timing of his appointment as chancellor.\n“In our British democratic system, if you have the privilege to serve, you don’t get to choose: you don’t get to choose the time, you don’t get to choose the circumstances,” he said.\nThere are, though, signs of resilience. Last week, the chancellor received a pre-budget boost from figures showing that Britain’s economy unexpectedly shrugged off the worst of the Middle East fallout to grow at a robust pace in July, helped by the rapid expansion of AI.\nFar from sitting back and blaming the US for all of the country’s problems, the chancellor also recognises there are meaningful steps that Labour can take to cushion the blow, and to help rebuild confidence.\nHowever, last week was still a bad one, as the latest flare-up in the Iran war drove the oil price to $109 a barrel and fuelled a dramatic bond market selloff. As an open economy in the eye of the storm, the yield – in effect the interest rate – on 10-year UK government bonds, known as gilts, rose to almost 5.4%; the highest level for almost two decades.\nThe renewed bout of selling pressure in the financial markets could not have happened at a worse time for Healey.\nHistory suggests that the Office for Budget Responsibility (OBR) may need to use the latest gyrations in markets to form the basis of its budget forecast. With this report informing the boundaries of the chancellor’s tax and spending plans, Healey could find himself boxed in.\nBack in spring, the Treasury watchdog used the market movements over the 10 working days to 30 January as the input for Rachel Reeves’s spring statement – leaving roughly a month gap before her 3 March Commons set piece. For Healey, there are just over six weeks before his budget on 28 October.\nShould the reference period use current market conditions, analysts at Oxford Economics estimate the headroom against the main fiscal rule of £23.6bn – left by Reeves in March – could be halved.\nIn previous years, the OBR has taken a flexible approach in times of elevated market volatility, and so there is no guarantee this will be the case. There are also other variables that are hard to forecast; from growth to inflation, and from the jobs market to the level of immigration.\nHowever, the risk is that the bond market meltdown will have a deleterious impact on the forecast, making the fiscal arithmetic for Healey significantly tougher amid myriad spending pressures for Labour to finance.\nThis week could also prove critical. On Tuesday, official figures are expected to show a further slowdown in Britain’s jobs market, including weaker levels of wage growth and a rise in unemployment. Inflation figures on Wednesday are predicted to show a rise in the headline rate in August to above 3%, in a renewed squeeze on living standards.\nIn the midst of all this, the Bank of England will take its next decision on interest rates on Thursday, in a verdict that will play a crucial role in influencing the borrowing costs of households, businesses and the government.\nWith a cooling domestic jobs market, and amid global turbulence over which Threadneedle Street has little control, the City predicts interest rates will be kept on hold. However, this will add to the sense that Britain is without a full grip on its future.\nFor the government, too, there is a growing sense that some of Andy Burnham’s biggest fiscal decisions could be deferred beyond the budget to next year’s comprehensive spending review.\nSuch a strategy will give him more time to get things right on knotty issues such as social care, we", "translation_ja": "", "vocab": [{"word": "perilous", "definition": "危険な、困難な状態にある。経済や状況が不安定で危機的であることを表す。"}, {"word": "fiscal policy", "definition": "政府の税収と支出に関する政策。経済成長やインフレをコントロールするために用いられる。"}, {"word": "gilt", "definition": "イギリス政府債券のこと。金利（イールド）が上昇すると、政府の借入コストが増加する。"}, {"word": "headwinds", "definition": "進行を妨げる逆風。経済成長や発展を阻害する外部要因や困難を比喩的に表す。"}, {"word": "tariff", "definition": "輸入品に対する税金。トランプが導入を脅迫している関税で、産業競争力に影響する。"}, {"word": "deleterious", "definition": "有害な、悪影響を及ぼす。ネガティブな結果をもたらすことを意味する正式な表現。"}]}, {"title_ja": "トランプ陣営の500ドル公約に対するフォックスニュースのミソジニー的解釈", "title_en": "Fox News' Misogynistic Spin on Trump's $5,000 Campaign Promise", "summary_ja": "アルワ・マハダウイはジェシー・ウォーターズがトランプの有権者向け500ドル支給を女性の誘惑に例えた性差別的なコメントを批判し、財政無責任さをエンターテインメントとしてフレーミングすることの不合理性を指摘している。彼女は、トランプの公約不履行の歴史を考えると実現の可能性は極めて低いが、本当の懸念は選挙セキュリティ破壊と投票アクセス制限に対する彼の継続的な取り組みにあると主張している。", "summary_en": "Arwa Mahdawi critiques Jesse Watters' sexist commentary comparing Trump's $5,000 voter payment to female seduction, exposing the absurdity of framing fiscal irresponsibility as entertainment. She argues the real concern is not the unfulfilled promise—given Trump's history of broken pledges—but rather his documented efforts to undermine election security and voting access.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/12/trump-voters-woman", "state_media": false, "category": "オピニオン", "full_text": "I think I finally understand why Fox News pays Jesse Watters the big bucks. The network star, famous for h
