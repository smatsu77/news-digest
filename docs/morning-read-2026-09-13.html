om Ukrainian officials for increased military aid and sanctions.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy5zg41dkqwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Russia hits Ukrainian train shortly after Boris Johnson and top European officials leave station\n- Published\nA Russian drone has hit a train near the Ukraine-Poland border shortly after former UK Prime Minister Boris Johnson and top European security officials had passed through.\nNo casualties were reported after the strike at Yahodyn, which hit the train's engine. All the passengers had been evacuated, Ukrainian authorities said.\nJohnson and other European national security advisers, including the UK's Jonathan Powell, had passed along the same line on a different train on their way back from a conference in Kyiv.\nRussia said it had struck \"railway infrastructure\" in western Ukraine, but Ukraine's state railway company Ukrzaliznytsia said that \"quite possibly, the target of this drone could have been the diplomatic train\".\nIn a statement, it said the train \"had left the station earlier than expected because of the timetable change... due to constant threats of Russian strikes\".\nIt also said an evacuation order for passengers on the hit train had been given \"just 15 minutes\" before the strike by a Russian jet-propelled drone.\nThe railway authority also said former CIA chief David Petraeus had been on board another train at Yahodyn station at the time of the drone strike.\nBoth Ukrainian and Polish authorities said the Russian drone had struck 2km from the Polish border.\nFormer Swedish Prime Minister Carl Bildt, who had also attended the conference in Kyiv, told the BBC passengers on board his train had been told to prepare for evacuation before subsequently being allowed to continue their journey.\n\"On the train I was on we received order to prepare evacuation after it had stopped. But after a number of minutes we were informed that it was clear and we could proceed,\" he said.\nThat train then safely arrived at Poland's border station in Dorohusk.\nSome reports have suggested Bildt was on the same train as Johnson, but the former UK prime minister has not confirmed any details.\nJohnson wrote on X: \"I don't know what warped logic drove Putin to blow up a stationary Ukrainian locomotive on the Polish border this morning.\nHe said this was \"the kind of random and senseless attack Ukrainians are enduring every day - even on civilian railways\" and urged Kyiv's allies to urgently provide Ukrainians \"the air defences they need\".\nUkraine has made repeated pleas to its allies - particularly the US - to provide more interceptors to defend against daily Russian attacks that increasingly use fast-moving ballistic missiles and jet-propelled drones.\nUkrainian Foreign Minister Andrii Sybiha said the \"barbaric strikes\" at the Ukraine-Poland border in Yahodyn amounted to \"[Russian President Vladimir] Putin's terror 'knocking' directly on the doors of the EU and Nato\" and renewed calls for more sanctions on Moscow.\n\"Putin needs to understand that his barbarism will be met with decisive action that increases the cost of war for him to an unacceptable level. This is the only way to stop him,\" he said.\nIn Poland, Prime Minister Donald Tusk held an emergency meeting to discuss the latest developments.\n\"The escalation of the actions from the Russian side is becoming a reality, and they are getting closer and closer to our border.\"\nJohnson and other top European security advisers were on their way back from the Yalta European Strategy (YES) conference in Kyiv - an annual event that brings together leaders and experts from politics, business, security and mass media.\n- PM's top security adviser says Europe faces hard winter to keep pressure on Putin \n  - Published16 hours ago\nRussia appears to be escalating its war against Ukraine by targeting trains, railway depots, petrol stations and border crossings.\nEarlier this week, two people were killed when Russian drones hit a border crossing between Ukraine and Moldova, Ukrainian President Volodymyr Zelensky said.\nAlso this week, a female conductor died in a Russian drone attack on a passenger train in southern Ukraine. Six Ukrzaliznytsia employees were killed after a depot was struck n Kyiv at the start of the month.\nIn January, Zelensky condemned as \"terrorism\" a Russian strike on a crowded passenger train in the north-eastern Kharkiv region that left five people dead.\nThe Russian attacks have significantly damaged Ukraine's vast train network - the main mode of transportation for millions of Ukrainians as all air travel has been suspended since the start of Russia's full-scale invasion in 2022.\nEuropean countries are also blaming Russia for suspicious incidents on their territory.\nLast week, Germany said Russia was responsible for August's drone attack at Leipzig's airport - a claim denied by Moscow as \"absurd\".\nThere have also been a number of suspicious fires at defence facilities from Italy to Estonia, with some of the affected countries blaming Russia.", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や問題が段階的に悪化・拡大すること。この文脈ではロシアの攻撃の規模と頻度が増えていることを意味します。"}, {"word": "diplomatic", "definition": "国家間の公式な交渉や関係に関連する。ここでは外国の高級官僚を乗せた列車のことを指します。"}, {"word": "interceptor", "definition": "飛行中の敵の航空機やミサイルを撃ち落とす防御兵器。ウクライナはドローンやミサイル攻撃を防ぐために多数必要としています。"}, {"word": "infrastructure", "definition": "国や地域の基本的な機能を支える施設・組織・制度。橋、電力網、鉄道など経済活動に不可欠な基盤を指します。"}, {"word": "barbaric", "definition": "野蛮で残虐な、非人道的な。文明的でない極めて暴力的な行為を表す強い批判的表現です。"}, {"word": "ballistic", "definition": "投射された後に放物線を描いて飛行する。ミサイルや砲弾などの軌道を説明する技術用語です。"}]}, {"title_ja": "トランプ大統領、中国との競争を理由にAIリスクの警告を軽視", "title_en": "Trump Downplays AI Risks Amid China Competition Concerns", "summary_ja": "トランプ米大統領は、専門家によるAIのリスクに関する警告を否定し、否定的な声が実現しない脅威を誇張していると述べました。彼はAI開発における米国の中国に対する技術的優位性の維持を優先事項として強調し、大手テック企業幹部の開発速度低下の呼びかけを退けました。", "summary_en": "US President Trump has dismissed warnings about artificial intelligence risks from experts, stating that negative voices are exaggerating threats that won't materialize. He emphasized that maintaining US technological superiority over China in AI development is a priority, dismissing calls from major tech executives for a slowdown in AI development.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c7v48vp31mdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Trump downplays warnings of AI risks, citing rivalry with China\n- Published\nUS President Donald Trump has downplayed risks posed by artificial intelligence following days of dire warnings by experts.\n\"You have a lot of very negative forces that are bringing it up that shouldn't be bringing it up and they're bringing up things that won't happen,\" Trump said during a visit to Ireland.\nOne of the warnings came from a former Anthropic researcher who said \"there is a strong chance that we could all die in the immediate future\" if the current pace of development continued.\nOn Saturday, top industry bosses agreed and called for a slow-down. Trump did not directly address the idea, but said: \"We're leading China on AI... and, frankly, I want to keep it that way because whoever wins AI, wins.\"\nTrump spoke on the same day AI researcher Jacob Coxon - who quit Anthropic a few days ago - told the BBC that staff who were developing the systems were \"genuinely frightened\" for the future of humanity.\nCoxon – who has also worked at OpenAI – welcomed the idea of a slowdown but said it would need to be co-ordinated with China.\nOn Saturday, Elon Musk, owner of xAI, and Sam Altman of OpenAI, backed a warning from the head of Anthropic Dario Amodei that the pace of development should be slowed \"to reduce the risk that something goes seriously wrong\".\nThe Anthropic CEO said any slowdown would have to be limited to avoid allowing China to pull ahead.\n- Questions mount over what an AI 'slowdown' would look like \n  - Published4 hours ago\nThe issues surrounding AI have prompted fierce debate - and present a dilemma for many world leaders.\nOn one hand, the sector is seen as a huge opportunity to boost economic growth and a way to improve outdated digital systems and ways of working.\nBut there have also been a number of incidents where AI appears to have gone seriously wrong.\nIn August, OpenAI said it had slowed down training some of its most advanced AI models to improve security.\nThe ChatGPT-maker said it was adding new measures after its AI agents bypassed safeguards and hacked the tech start-up Hugging Face.\nAnd the same month it was disclosed two of the world's most powerful AI tools created fake human profiles to try and trick people in attempted cyber-attacks.\nThe UK's AI Security Institute (AISI) said in the most serious case, Anthropic's Mythos AI tried to gain access to a service by sending private messages, having set up fake accounts mimicking real people - then hid the evidence.\nThe Trump administration argues that the US must maintain global tech dominance as a matter of national security, though it has admitted a need for vigilance around the risks posed by the emerging technology.\nThe weekend call by major AI executives sparked discussion in Washington, where lawmakers are facing pressure to address those potential risks around rapid AI developments.\nOn Sunday, Speaker Mike Johnson, the top House Republican, urged caution about rushing AI regulation during an appearance on CNN's Jake Tapper on State of the Union, arguing it could \"smother American innovation\".\n\"If Congress just races in and does some sort of emergency session to try to regulate AI, we will lose the race to China, and that is a threat to every single American,\" he said. \"So, we've got to have balance. We've got to have steady hands at the wheel.\"\nDemocratic House Minority Leader Hakeem Jeffries argued for \"decisive action\" by lawmakers.\nHe told George Stephanopoulos on ABC's This Week that the US should slow down \"the pace of development in order to protect the American people and ensure that AI is proceeding safely\".\nResponding to recent comments from the AI industry, tech investor David Sacks, who serves on Trump's Council of Advisors on Science and Technology, called on the companies to police themselves.\n\"Stop pretending you need anyone else's permission,\" he posted on X.\n\"So go ahead and pace the frontier. You are the ones setting it... Demanding your preferred regulatory framework as the price of that will look like blackmail of the public and the political system. So just do it.\"\nStill, there is at least some cross-party consensus on AI regulation. In July, a group of House Democrats and Republicans introduced the Frontier Act, a bipartisan bill that seeks to establish a national safety and oversight framework for AI.\n\"Safety researchers are resigning, powerful AI models are breaking out of their labs, and companies are racing ahead anyway,\" Rep Lori Trahan, a Massachusetts Democrat who co-authored the bill, wrote on X this week.\n\"It's past time for Congress to get off the sidelines and do its job.\"\nRelated topics\n  - Published1 day ago\n  - Published3 days ago\n  - Published13 hours ago", "translation_ja": "", "vocab": [{"word": "downplay", "definition": "重要性や深刻さを軽く見せる、過小評価するという意味。ニュースではリスクや問題の重要性を意図的に小さく扱う場合によく使われます。"}, {"word": "dire", "definition": "極めて深刻で悪い状況や警告を意味する形容詞。警告や予測が非常に悪い結果を示している時に使用されます。"}, {"word": "safeguard", "definition": "保護や安全対策を施すという意味。AIの文脈では、システムが安全に動作するための防御機構や対策を指します。"}, {"word": "dominance", "definition": "支配的な地位や優位性を意味する名詞。技術分野では特定の国や企業が市場や技術で優れた立場にあることを表します。"}, {"word": "frontier", "definition": "最新の開発領域や最前線を指す。AI業界では急速に進化する技術開発の最先端を表します。"}, {"word": "bipartisan", "definition": "異なる政党の両者が協力する、という意味の形容詞。米国政治で与野党が共に支持する法案や政策に使われます。"}]}, {"title_ja": "AI開発の減速要求、実行方法と国際競争を巡る疑問が浮上", "title_en": "Calls for AI Slowdown Face Questions Over Implementation and Global Competition", "summary_ja": "AI大手経営者が安全保障上の懸念から開発速度の減速を呼びかけているが、専門家はその実行方法が不明確であり、中国への競争優位性喪失を懸念している。提案は明確な定義の欠如、検証方法、および英国の成長戦略への経済的影響など、実践的な課題に直面している。", "summary_en": "Leading AI executives are urging a slowdown in AI development citing safety concerns, but experts question how such a slowdown would be enforced and worry about losing competitive advantage to China. The proposal faces practical challenges including lack of clear definition, verification methods, and potential economic impact on the UK's growth strategy.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwyzp47py48o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Questions mount over what an AI 'slowdown' would look like\n- Published\nThere has been no shortage of warnings from AI's top bosses about existential threats over the years.\nI attended the world's first AI safety summit in Bletchley Park in November 2023 where the focus was on the most serious threats imaginable, posed by the most powerful AI models.\nAt the time, many thought this was in the realm of sci-fi and the real threats were comparatively far more mundane: job losses, cheating in exams. Three years later, many of those same voices don't seem to be so sure.\nOn Saturday head of AI company Anthropic, Dario Amodei, urged the pace of development to be slowed down - the bosses of two rival AI firms, Sam Altman of OpenAI and Elon Musk said they agreed with him.\nMeanwhile AI researcher Jacob Coxon - who quit Anthropic - told the BBC on Sunday staff who were developing the systems were \"genuinely frightened\" for the future of humanity.\nThey all add up to a chorus of serious voices urging a slowdown, but although it might sound like a quick fix, it is far from an easy solution.\nAmerica is widely understood to be terrified of losing the race to build the most powerful AI to China.\nOn Sunday President Trump made his own views clear, claiming the US was ahead of China in the AI race and declaring: \"Whoever wins AI, wins.\"\nChina isn't renowned for wanting to come second. Everyone I speak to says that even if their company pauses, others will not and they will just get left behind. It reminds me of the height of the campaign for nuclear disarmament. The problem then too was that nobody wanted to go first.\nThere is also the question of how on earth a slowdown would be enforced. Who would police it? Would we be relying on the AI companies to be transparent about what they are doing, and more importantly what they are choosing not to do? That would require an epic level of trust, which arguably the tech sector has never earned.\nAlthough Amodei in his post proposed a three-point plan that included independent monitoring of AI models as they are developed, industry-wide regulation and global regulation, some observers question how this would work in practice.\n\"Nobody has given a substantive explanation of what 'slowdown' means,\" said Ed Zitron, CEO of EZ Primary Research.\n\"Putting a plant from METR, where one of the guys who quit Anthropic went, in every AI company? Democratic and global 'co-ordination'? Doesn't mean anything to me.\"\nZitron said stopping training AI models would leave them vulnerable to Chinese rivals.\n\"Their margins might improve but their products will be captured in amber and distilled by Chinese labs. They may have to change pricing. I truly don't know how it all works.\n\"This could burst the bubble. But right now we are very thin on what a 'slowdown' means.\"\nIn the UK, we have heard about plans to roll out the tech more widely within the NHS to improve patient care, and how AI gave the UK economy a much-needed boost over the summer. We are all being encouraged to use it more and more at work, in education and in our personal lives.\nThe industry is a key part of the UK's strategy to drive economic growth. \"There is no plan B\" a former government adviser told me, so could a slowdown wreck future prospects here in Britain?\nThe AI industry is burning through enormous amounts of money and natural resources and so far, is not creating nearly as much revenue. There are multiple reports suggesting a number of firms adopting the technology are disappointed by it.\nEconomists widely speculate that even the current giants are not all likely to survive and that some kind of \"levelling\" is coming – also known as a bursting bubble. But those firms which do make it could end up becoming the most powerful mega-corporations the world has ever seen, and that comes with its own issues.\nOpenAI choosing to halt its march to the stock market could be seen as an epiphany-like moment of taking responsibility for public safety – but it could also be the move of a company which has realised it might not get the lucrative payout it needs while its entire product is perceived to be lethal.\n\"One of the probably the biggest challenges that we have right now is that no one can predict with certainty how this technology is going to evolve,\" says Alexander Voica from the UK AI company Synthesia.\n\"We know that these systems are getting more powerful, but we don't know where and how they're going to be used, and we haven't figured out essentially a way of taking full advantage of their potential. My only concern in rushing to regulate now, where there's still a lot of open questions, is that it could actually backfire.\"\nWe also can't deny the fact that underpinning this entire tech revolution is an ocean of investor cash.\n\"I'm not worried about the existential risks of AI, I'm worried about the corporate greed of the companies that are creating it,\" says Sasha Luccioni, the founder of Sustainable AI.\nLeading computer scientist Profess", "translation_ja": "", "vocab": [{"word": "existential", "definition": "人類の存在そのものを脅かす、根本的な危険や問題を指す形容詞。ここではAI技術が人間の存在に対して与える深刻な脅威を意味する。"}, {"word": "substantive", "definition": "具体的で実質的な内容を持つ、単なる外観的ではなく本質的な意味での。ここでは実現可能で詳細な説明や計画を指す。"}, {"word": "distilled", "definition": "複雑なものから本質的な部分を抽出する、または濃縮する意味の動詞。ここでは他国がAI技術の核となる要素を取得することを表す。"}, {"word": "levelling", "definition": "均等化、平準化を意味する。ここでは市場が調整され、競争力の弱い企業が淘汰される経済現象を指す。"}, {"word": "epiphany", "definition": "突然の悟り、啓示的な気づきを意味する名詞。ここでは企業が社会的責任に目覚めたかに見える瞬間を表現している。"}, {"word": "lucrative", "definition": "利益をもたらす、儲かるという意味の形容詞。ここでは株式公開による金銭的利得を表す。"}]}, {"title_ja": "イングランド新学校給食ルールで揚げ物が禁止に", "title_en": "Deep-fried food banned under new school dinner rules in England", "summary_ja": "イングランド政府は2027年から施行される包括的な新学校給食基準を導入し、揚げ物の禁止と新鮮な食材・全粒穀物の増加を実施する。デザートは中学校で週2回、小学校で週1回に制限され、加工肉は週1回に制限される。朝食クラブは栄養ガイドラインに従うことが初めて義務付けられ、学校は食品基準庁により監視される。", "summary_en": "England's government has introduced sweeping new school meal standards effective from 2027, banning deep-fried foods and increasing fresh produce and whole grains. Sweet desserts will be limited to twice weekly in secondary schools and once weekly in primary schools, while processed meats are restricted to once per week. Breakfast clubs will now be required to follow nutrition guidelines for the first time, with schools monitored by the Food Standards Agency.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy4zrepw78eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Deep-fried food banned under new school dinner rules in England\n- Published\nThere will be a boost for fresh fruit and vegetables and deep-fried food will be banned in what the government has called the biggest shake-up to school dinners in England in over a decade.\nUnder new school food standards, fibre and wholegrains will also be increased, and breakfast clubs will have to follow nutrition rules for the first time, with schools also being monitored.\nThe Association of School and College Leaders (ASCL) welcomed the changes, but said they hoped the new rules would not become \"another stick with which to beat head teachers\".\nThe changes will come into effect from 2027 and be funded with existing money for schools, the government said.\nAs part of the new framework, sweet desserts, like cake, will be reduced from a regular lunch offer to twice a week in secondary schools, and once a week in primary schools. They also must now be served with a portion of fruit.\nServings of processed meats such as ham, sausages and chicken nuggets have been reduced to once a week and must come with a side of vegetables or fruit.\nEducation Secretary Lucy Powell said they were \"once-in-a-generation changes\" which would \"transform school food for children across the country\".\nThe Department for Education said it hoped the reforms would tackle childhood obesity, improve nutrition and support children's concentration, learning and wellbeing.\nSchools will be required to publish food policies and menus online with monitoring arrangements set to be developed alongside the Food Standards Agency, it said.\nPepe Di'Iasio, ASCL general secretary, said parents would feel \"reassured\" that schools were providing children with a healthy diet.\nBut on plans for enforcement, he added: \"None of us would consider ourselves experts in health and nutrition. Don't create another stick with which to beat head teachers when they are trying to do their very best to provide a healthy, balanced meal for those in our schools.\"\nHe said schools needed \"more investment\" in catering facilities and in the \"professional development\" of school chefs to develop menus that \"meet the ambitions\" of the government.\nAs part of the changes, deep-fried chips will have to be oven-baked instead, and pasta dishes will need to be 50% wholewheat once a week. High-fibre bread will also become a requirement.\nBreakfast clubs will undergo one of the biggest changes.\nHistorically, there has been no guidance on what they should provide, but from next September pastries and fried-eggs will be off the menu and there will be a sugar cap when it comes to cereals.\nThe government said Coco Pops would no longer be an option and chocolate spread was \"not permitted\".\nSince February this year, 1,250 schools have offered free breakfast clubs to their pupils.\nOne of those was Oasis Blakenhale in Birmingham, where principal Farzana Ahmed said the school welcomed the changes.\n\"The more children that can access a hot, nutritious meal, the better it is for us, the better it is for them, and actually it really supports families with the reduction of their financial pressures at home,\" she said.\nAhmed said it was \"important\" that schools are monitored, but added that they \"probably need some more guidance from the government on what that's going to look like on a day-to-day basis\".\nAbout 60% of pupils at the inner-city school receive free school meals, and Ahmed said they were already providing a healthy, balanced diet.\nWith free school meal eligibility expanding this year to all families who receive Universal Credit, Ahmed said there had been an \"influx of parents\" applying, and expects around 70% of pupils to benefit going forward.\n\"It's a really positive move,\" she said.\n\"We know how important a nutritional diet is to the wellbeing, to the behaviour, to the learning of our pupils.\"\nWorking mum-of-three Kinza Butt said the free school meals her son was now getting at Blakenhale Juniors had lifted a \"burden off the shoulders\".\n\"He doesn't have to eat those cold sandwiches anymore,\" she said.\n\"By the end of the day he used to be starving. But now he's coming home all happy because he's having good, healthy meals with a snack as well.\"\nThe new food standards will apply to primary and secondary schools in England, but rules for school dinners vary across the UK.\nIn Wales, new guidance will come into force by the end of the year with a greater focus on at least two portions of vegetables being offered every day, with only water, milk or plant-based drinks allowed for hydration.\nScotland updated its legislation in 2020. It requires students to be offered at least two portions of vegetables and one portion of fruit every day and oily fish must be served at least once every three weeks.\nNorthern Ireland last updated its regulations in 2007. They include providing bread everyday, without spread, and offering two portions of fruit and vegetables a day. It also stipulates that if beans or pulses form the protei", "translation_ja": "", "vocab": [{"word": "shake-up", "definition": "大幅な改革や変更のこと。business や制度に対して使われ、既存のやり方を大きく変える改革を意味する。"}, {"word": "enforcement", "definition": "法律やルールを強制的に実行させること。compliance（遵守）との違いは、enforcement はより強制的で厳しい実行を指す。"}, {"word": "eligibility", "definition": "特定の条件や要件を満たして、何かの対象になる資格があること。申請者がプログラムの条件を満たしているかどうかを判断する際に使用される。"}, {"word": "stipulates", "definition": "法律や契約で明確に定める、指定すること。正式な文書や規則の中で、特定の条件や要件を明確に述べるときに使われる。"}, {"word": "ambitions", "definition": "達成したいという強い願望や目標のこと。個人的な目標だけでなく、組織や政策の目指す目標を指すこともできる。"}, {"word": "influx", "definition": "大量の何かが流入してくること。通常、人や物が短期間に大量に到着する状況を表す。"}]}, {"title_ja": "英国首相、ビジネスのやり方の「文化的転換」を促す", "title_en": "UK PM Urges 'Culture Shift' in Business Approach", "summary_ja": "アンディ・バーナム首相は、英国のビジネス手法における文化的変化を呼びかけ、リスクを取る企業への政府支援と地方指導者と企業のパートナーシップを強調した。BPやシェル、HSBCなどの大手企業のCEOと成長戦略について会談する予定である。この会談は、政府の高い借入コストと高エネルギー価格を含む経済的課題への懸念の中で行われる。", "summary_en": "Prime Minister Andy Burnham called for a cultural change in how the UK conducts business, emphasizing government support for risk-takers and local leaders' partnership with companies. He will meet with chief executives from major firms like BP, Shell, and HSBC to discuss growth strategies. The meeting occurs amid concerns about high government borrowing costs and economic challenges including elevated energy prices.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyl18x4734o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "'Culture shift' needed in how UK does business, PM urges\n- Published\nThe UK needs a \"culture shift\" in how it does business, Andy Burnham has said ahead of a meeting with some of the UK's biggest bosses.\nThe prime minister said those who take risks in business should be backed by government and local leaders should have the power to work with businesses.\nThe current Labour government has been criticised for increasing costs for businesses, such as with the employer national insurance and minimum wage changes under Burnham's predecessor Sir Keir Starmer.\nDowning Street said Burnham will meet with the chief executives of BP, Shell, HSBC, Morrisons, Sainsbury's, BT, Vodafone, Rolls-Royce, and several others at Number 10.\nAhead of the meeting, Burnham said he would give people \"the confidence that if they have a great idea, they'll get all the support they need to bring it to life\".\n\"When local leaders have the tools to get things done and government works in partnership with business, you can pull in investment, create jobs and transform communities,\" he said.\nHe added the government would be \"a partner for growth to make every part of Britain better off\".\nBurnham will host a reception for the business community where local leaders are invited before a private engagement with senior chief executives at Downing Street on Monday evening.\nThe meeting comes as higher borrowing costs in the UK and other countries present problems for governments looking to spend money on business support or investment.\nOfficial data revealed a surprise boost in the economy in July partly driven by artificial intelligence (AI) investment, though experts expect growth to slow in the months ahead due to high energy prices.\nThe US-Israel war with Iran has led to a sharp jump in oil prices, which has fed through to higher energy and fuel prices, affecting households and businesses.\nThis rise in energy costs has led to fears that inflation will remain high, and increase the chance that central banks will hike interest rates to keep price rises under control.\nThe expectation of higher interest rates, as well as competition for debt from AI firms looking to spend money on development, has driven up the cost of government borrowing in many countries.\nHowever, many argue the UK has a particular problem with high government debt. The UK yield for 10-year bonds, a key measure of government debt costs, is higher than countries such as the US, France, and Japan.\nExperts say this is due to several factors affecting investor confidence in the UK, such as multiple prime ministers, chancellors and policy U-turns over a short period.\nIn an interview with the BBC last week, Chancellor John Healey called for a restoration of \"confidence about Britain\" despite acknowledging the challenge of \"historic high\" borrowing costs.\nOthers have argued that the Labour government has created its own problems by increasing costs for businesses.\nConservative shadow business secretary Julia Lopez said: \"The way for the prime minister to get businesses thriving, delivering jobs and driving growth is to cut their taxes.\n\"Labour's jobs tax and employer red tape have been devastating for businesses. The consequence has been a drying-up of the jobs market, weaker investment and businesses facing ever greater costs.\"\nRelated topics\n  - Published2 days ago\n  - Published4 days ago\n  - Published2 September", "translation_ja": "", "vocab": [{"word": "culture shift", "definition": "組織や社会の価値観や行動様式における根本的な変化。ビジネス環境では、経営方針や企業文化を大きく転換させることを意味する。"}, {"word": "employer national insurance", "definition": "労働者の給与に対して雇用主が支払う社会保障税。企業の採用コストに直結する重要な税制である。"}, {"word": "yield", "definition": "債券などの投資商品が生み出す利回り。政府債の利回りが高いほど、市場は政府の信用リスクが高いと判断していることを示す。"}, {"word": "investor confidence", "definition": "投資家が経済や企業の将来性に対して持つ信頼度。政治的安定性や政策の一貫性に大きく影響される。"}, {"word": "policy U-turns", "definition": "政府が過去の政策決定を急激に変更すること。市場の不確実性を高め、投資家の信頼を低下させる要因となる。"}, {"word": "red tape", "definition": "官僚的な手続きや複雑な規制。ビジネスの効率性を阻害する行政上の障害を指す。"}]}, {"title_ja": "改革党、提案される新たな寄付ルール下での7200万ポンド返金は不要と確信", "title_en": "Reform Confident £72m Crypto Donations Won't Need Repayment Under New Rules", "summary_ja": "改革党は暗号資産億万長者ベン・デロとクリストファー・ハーボーンからの7200万ポンドの寄付が現在および提案されているイギリスの政治寄付法に適合していると考えている。政府は3月25日以降に遡って適用される海外在住イギリス人からの寄付に10万ポンドの上限を導入しているが、改革党は両寄付者が新しい規制に影響されないと主張している。", "summary_en": "Reform UK believes its £72m in donations from cryptocurrency billionaires Ben Delo and Christopher Harborne comply with current and proposed UK political donation laws. The government is introducing a £100,000 cap on donations from British expats, retroactively applied from March 25, though Reform claims both donors will not be affected by the new regulations.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckgwkeg1vy8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Reform confident it won't need to repay any of £72m under proposed new donor rules\n- Published\nReform UK believes the £72m in donations it has received from two cryptocurrency billionaires were \"entirely in line with the law\", the party's economic spokesman has said.\nRobert Jenrick told the BBC he did not expect that the party will have to return any of the money from Ben Delo and Christopher Harborne, who are both British and have spent time living overseas.\nThe government is seeking to change the law on donations to UK political parties from British expats, including a £100,000 cap backdated to 25 March.\n\"These two donations are entirely in line with the law as it is and, as far as we know, the law as it's going to be in the future,\" Jenrick said.\nAs well as limiting how much British citizens can donate to political parties from overseas, the government has proposed a minimum residency period in which the £100,000 cap would still apply for those who move back to the UK.\nThis would be in place for the remainder of the calendar year and the following calendar year after the person returns.\nHousing Secretary Angela Rayner told the BBC's Sunday with Laura Kuenssberg that the rule changes would apply retrospectively and anyone not complying with them would have \"to return that money\".\nRayner added she was not commenting specifically on Delo and Harborne as she does not \"understand\" their \"circumstances\".\nAnswering questions about the donations following Rayner's remarks, Jenrick said: \"It might be that Angela Rayner or the government keep trying to change the law to make it even harder for people to donate to Reform, nothing would surprise me.\n\"But, as it stands, we believe these are entirely in line with the law.\"\nBBC News has been told that both Delo and Harborne have returned to the UK. Delo is understood to have been back in the country since last year.\nJenrick said Delo had returned to the UK \"in part so that he can comply with the changes to the law\".\nIn a statement after the programme, a Reform UK spokesman said: \"We are 100% confident both [donations] are legal and won't ever have to be handed back.\"\nOne person familiar with the government's proposed changes said the issue of whether Delo and Harborne are affected would likely come down to how ministers choose to define UK residency.\nThey said one way would be to adopt the same definition used in tax laws, but stressed how complex the rules around residency are.\n- Who is Reform donor and crypto billionaire Ben Delo? \n  - Published1 day ago\nThe government's proposed changes were added to the Representation of the People Bill after they were approved by MPs this month. The bill still needs to be scrutinised in the House of Lords.\nRayner said the proposals were \"directly as a result\" of a review by former top civil servant Philip Rycroft, external, published on 25 March.\nRayner said: \"We said that because of the intention of the legislation and the recommendations, which we accepted, was known in the public domain that it would be retrospective to that date.\n\"That legislation is going through Parliament at the moment and we've also written to the Electoral Commission, which is an independent body, to see what further measures we need to take to protect our democracy.\"\nThere are currently no restrictions on the amount of money UK-based donors can give to political parties.\nThe government has previously said it was \"determined to tackle\" the issue of \"mega-donors\", and has established a new taskforce to do this.\nIt did not support calls from some MPs for a cap but Rayner left the door open to the possibility of further restrictions.\n\"It's not as simple as we're saying we won't put a cap [on donations], it's a question of making sure that the task and finish group look at how we implement this.\"\nRayner said the aim would be to \"protect our democracy in the spirit of individuals not being able to overpower and buy their way into democracy at the expense of those people that are at the ballot box\".\nConservative shadow foreign secretary Tom Tugendhat said it was important to ensure \"we do not end up with a sort of Americanisation of politics where money just sort of runs free\".\nHe said people should be able to support the democratic movements they wished but added that \"what we've got to be careful about is where different industries, where different financial sources raise questions\".\nLiberal Democrat Cabinet Office spokeswoman Lisa Smart said there should be emergency legislation to cap campaign donations and spending.\nShe said: \"No politician should be able to buy the keys to Number 10.\"\nA Green Party spokesperson said there needed to be \"more robust laws\" around political donations, adding: \"The Labour Party urgently needs to find its spine and support a tight cap on donations from individuals.\"\nJenrick said Delo and Harborne - who each gave £36m to the party in two days and now share the record for the largest ever donation given to a UK political party - ", "translation_ja": "", "vocab": [{"word": "retrospectively", "definition": "過去に遡って適用されることを意味する。法律や規則が以前の行為にまで遡って効力を持つ場合に使用される。"}, {"word": "expat", "definition": "自国以外の国に住む市民を指す。通常、一時的または長期的に海外に滞在する人々に対して使用される。"}, {"word": "scrutinised", "definition": "綿密に調査・検査されることを意味する。通常、法律や政策が議会で詳しく検討される際に使用される。"}, {"word": "residency", "definition": "特定の場所に住んでいる法的な状態を指す。税法や移民法など様々な法的文脈で使用される。"}, {"word": "cap", "definition": "上限または最高限度を意味する。金銭や数量の最大額を制限する場合に使用される。"}, {"word": "Americanisation", "definition": "アメリカ的な特性や慣行が他の文化に浸透していく過程を指す。政治や商業において金銭が過度な影響力を持つことを示唆する。"}]}, {"title_ja": "ドイツのズベレフが黄金期にUS Openを制覇", "title_en": "Germany's Zverev Wins US Open in Golden Year", "summary_ja": "アレクサンダー・ズベレフは2026年のUS Openを制し、同年2度目のグランドスラムタイトルを獲得した。ドイツの第1シードはベン・シェルトンを決勝で下し、同一シーズンに全メジャー大会で少なくとも準決勝に進出した9番目の男性選手となった。", "summary_en": "Alexander Zverev won the US Open to claim his second Grand Slam title in 2026, capping the best season of his career. The German top seed defeated Ben Shelton in the final and became the ninth man to reach at least the semifinals at all four majors in the same season.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/germany-s-zverev-wins-us-open-in-golden-year/a-79212706?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Germany's Alexander Zverev wins US Open\nSeptember 14, 2026\nAlexander Zverev has won his second Grand Slam singles title after the German top seed beat Ben Shelton in the US Open final on Sunday.\nZverev beat the American, who was making his first appearance in a major final, 6-3, 7-6 (7-2), 5-7, 6-2.\nThis success caps the best season of Zverev's career. Not only has he now won two of the four Grand Slams in the same season, but he has become just the ninth man to reach at least the semifinals at all four majors in the same season.\n\"We went 30 years without winning a Grand Slam title and now we've won two in three months,\" Zverev said on court after his second major win of the year, following his victory at the French Open in June.\n\"God has seen how hard we've worked and how much we've suffered. 2026 is the outcome of all the years that happened before,\" he said as he thanked his coaching team and family.\nGreat expectations from the start\nAs a former junior world No. 1, there were great expectations on Zverev from the moment he started his pro career in 2013 at just 16 years old. Titles soon followed, as did a shock early win over Roger Federer in a tournament in his native Germany in 2016.\nBut the presence of Federer, Rafael Nadal and Novak Djokovic meant Zverev struggled to make a mark in the Grand Slams. After a string of disappointing exits, he had something of a breakthrough in 2020, reaching the semifinals of the Australian Open and the final of the US Open.\nWith age starting to catch up with at least two of the big three in modern men's tennis, Zverev looked well primed to become a dominant force in the majors. His 2021 Olympic gold felt like it might be just the start.\nFrench Open ends long grand slam wait\nBut he was unable to make the opportunity count, and the emergence of Jannik Sinner and Carlos Alcaraz has made the task even tougher. Finally, this year, Zverev got his hands on a major title, winning at Roland Garros in June. In doing so, he became the first German man to win a singles Grand Slam since Boris Becker in 1996 in the process.\n\"It was just relief, joy, everything together,\" he told ATPTour.com. \"I didn't realize that I had won the match until I saw my box all jumping around and celebrating. In your mind, you think, 'Well, I've got to continue playing', but then I saw my dad raise his arms in the air. That's when it kind of hit me, 'Okay, we've done it. We've achieved it. We are Grand Slam champions.'\"\nBecker's triumph was a year before Zverev was born in Hamburg to Russian parents who were both tennis pros in the Soviet Union and moved to Germany in 1991. His older brother, Mischa, was also a pro until 2023, reaching the quarterfinals of the Australian Open in 2017 and becoming world number 25 in the same year. But it was Alexander who was destined for the even bigger stage.\nFamily a big influence on Zverev's career\nIn their youth, Mischa was generally coached by his father, Alexander Zverev Snr, while the younger brother was coached by his mother, Irina. His father has taken the reins in the professional arena though, and the family remain a constant fixture at Zverev's matches.\n\"I know there are crazy tennis parents out there as well,\" the 29-year-old said on the subject ahead of the US Open. \"If you try to control every single aspect of your kid's life, even when the kid is 25, 26, 27 years old and at some point has a personal life… I think that is never helpful.\"\n\"But if you have smart tennis parents like we do have on tour now, I feel like Ben Shelton's father is incredibly smart, Casper Ruud's father is incredibly smart, I feel like I'm lucky enough to say the same thing about my parents. I think then it's beneficial.\"\nDespite finally ending Germany's long wait for a major male tennis champion, Zverev is far from universally liked in his own country, or on the tennis circuit.\nDomestic violence allegations\nWhile there is acknowledgement of his work in promoting awareness of type 1 diabetes, with which he was diagnosed in 2022, allegations of domestic abuse have hung over his career and seen him heckled at various tournaments. His behavior on court has also seen him get in trouble before.\nThe first came in October 2020, when his ex-girlfriend, Olya Sharypova, claimed he had been violent towards her on multiple occasions. However, Sharypova didn't press criminal charges, and in January 2023, men's tennis governing body the ATP closed its own investigation into the matter, citing \"insufficient evidence.\"\nWelcoming that decision at the time, Zverev said: \"From the beginning, I have maintained my innocence and denied the baseless allegations made against me.\"\nBut he faced a Berlin court in 2024 after similar allegations from Brenda Patea, Zverev's ex-girlfriend and the mother of his daughter. The court was told that \"after a heated argument\" in the German capital, Zverev allegedly pushed Patea against a wall and strangled her with both hands.\nHe denied the charges and the case was sett", "translation_ja": "", "vocab": [{"word": "domesticate", "definition": "ここでは「家庭内」という意味の「domestic」から派生し、記事の「domestic violence allegations」は「家庭内暴力の疑惑」を指す。個人的な領域での問題を示す。"}, {"word": "sufficiency", "definition": "記事では「insufficient evidence」として使用され、「十分でない」という意味。法的文脈で証拠の不十分性を表す重要な用語。"}, {"word": "allegations", "definition": "「告発」「疑惑」を意味し、法的な文脈で誰かが犯したとされる行為について、まだ証明されていない主張を指す。"}, {"word": "breakthrough", "definition": "「突破口」「大きな進歩」を意味し、困難な状況から重要な成功や進展を遂げることを表す。ここではズベレフのキャリアにおける転機を示す。"}, {"word": "primed", "definition": "「準備ができている」「適切な状態にある」という意味で、何かが起こる準備ができている状態を表す。"}, {"word": "heckled", "definition": "「やじられた」「ブーイングされた」という意味で、観客が選手に対して否定的な声を上げることを指す。"}]}, {"title_ja": "スウェーデン選挙：中道左派連合が序盤調査でリード", "title_en": "Sweden election: Center-left coalition leads initial polls", "summary_ja": "スウェーデンの総選挙で、前首相マグダレーナ・アンデルソン率いる中道左派野党連合が、現職ウルフ・クリステルソン首相率いる与党右派連合に対して51.3%対47%でリードしている。右派連合の勝利は極右のスウェーデン民主党が初めて政権に参加することを意味するが、出口調査では前回選挙比で得票率が低下する見込みである。正式な開票結果は数時間以内に発表される予定。", "summary_en": "Sweden's center-left opposition bloc led by former Prime Minister Magdalena Andersson holds a narrow lead of 51.3% over the governing right-wing coalition in post-election surveys. A right-wing victory would bring the far-right Sweden Democrats into government for the first time, though exit polls suggest their vote share will be lower than in the previous election. Official results are expected within hours.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/sweden-election-center-left-coalition-leads-initial-polls/a-79248599?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Sweden election: Center-left coalition leads initial polls\nPublished September 13, 2026last updated September 13, 2026\nPolls closed in Sweden's general election on Sunday where the center-left opposition is hoping to return to power after four years.\nAccording to a post-election survey by the Novus polling agency, the center-left bloc led by former Prime Minister Magdalena Andersson's Social Democrats held 51.3% support against 47% for the governing right-wing bloc led by incumbent Ulf Kristersson.\nA victory by the right-wing bloc would bring the far-right Sweden Democrats into government for the first time. But according to exit polls, the Sweden Democrats are expected to see a lower vote share compared to the last election.\nOfficial election results are expected in the coming hours.\nAhead of the election, opinion polls had predicted an easy win for the left-wing alliance over the right-wing group led by incumbent Kristersson.\nBut the four-party opposition alliancehad seen that lead narrow as election day neared.\n\"We all knew it was going to be a very close election; I've said that all along,\" Andersson, the first woman to serve as Swedish Prime Minister in 2021-2022, told a rally in the Swedish capital Saturday.\n\"Now it's up to voters: do they want a government that will be totally dominated by the Sweden Democrats, or do they want a government led by me?\"\nWhat do we know about the main parties in Sweden's election?\nThe Social Democrats have governed in Sweden for most of the last century and remain the country's largest party.\nThe left-wing bloc has promised to boost the welfare state and address rising costs.\nKristersson's campaign has focused on his government's record of reducing violent and organized crime and clamping down on immigration.\nA victory at the ballot box on Sunday would suggest voters approve of that approach, supporters of the right-wing bloc say. Critics have denounced the agenda as undermining civil liberties and unfairly targeting immigrants.\n\"We can unify parties, voters and issues into joint action. That's why we get things done,\" Kristersson said this week in parliament.\nFar right could enter government for first time\nUnlike in Germany, where most parties have ruled out working with the far-right Alternative for Germany as part of the political \"firewall\", Kristersson has promised the Sweden Democrats key government posts if his alliance wins.\nThe leader of the far-right party, Jimmie Akesson, told a campaign rally in Stockholm on Saturday that the Sweden Democrats \"have already won,\" as the party eyes power for the first time since entering parliament in 2010.\n\"Sweden is becoming safer, better, and more Swedish,\" the 47-year-old said.\nAkesson is expected to be given the role of migration minister if the right-wing alliance wins on Sunday.\nEight million people are eligible to vote in a country of 10.6 million people. Turnout regularly exceeds 80% in Sweden.\nPolling stations close at 8 p.m. (1900 UTC). The first results will be expected several hours later on Sunday night.\nAround half of the votes have already been cast in advance.\nEdited by: Wesley Dockery and Kieran Burke\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "incumbent", "definition": "現職の、在職中の。特に政治的な職位にある人を指す。この場合、現職首相ウルフ・クリステルソンを表している。"}, {"word": "bloc", "definition": "政治的または経済的に共通の利益を持つ国家やグループの連合。ここでは左派連合と右派連合を示している。"}, {"word": "clamping down", "definition": "厳しく取り締まる、規制を強化するという意味の句動詞。政府が移民政策や犯罪に対して厳格な措置を取ることを表す。"}, {"word": "firewall", "definition": "政治的または社会的な障壁を意味する。多くの政党が極端な政治勢力との協力を拒否することを表している。"}, {"word": "civilly liberties", "definition": "市民的自由、個人の基本的人権。言論の自由や隠私権など、市民が享受すべき権利のこと。"}, {"word": "welfare state", "definition": "福祉国家。政府が医療、教育、失業保険などの社会保障制度を広範に提供する国家体制。"}]}, {"title_ja": "トルコ：LGBTQ+関連の一斉摘発で162人逮捕", "title_en": "Turkey: 162 arrested in LGBTQ+ raids", "summary_ja": "トルコ警察は週末の一斉摘発でLGBTQ+関連の6団体を強制捜査し、162人以上を逮捕した。政府は売春と児童虐待対策と主張しているが、人権団体はLGBTQ+コミュニティがトルコの少子化危機のスケープゴートにされていると批判している。専門家は、実際の原因はインフレーション、住宅価格の高騰、保育施設の不足などの構造的経済要因だと指摘している。", "summary_en": "Turkish police arrested at least 162 people and raided six LGBTQ+ associations during weekend operations dubbed 'My Family is Safe,' part of President Erdogan's campaign to reverse declining birthrates. The government claims the raids targeted prostitution and child exploitation, while rights groups say the LGBTQ+ community is being unfairly scapegoated for Turkey's demographic crisis. Experts point to structural economic factors like inflation, housing costs, and limited childcare access as the real causes of falling fertility rates.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/turkey-162-arrested-in-lgbtq-raids/a-79251409?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Turkey: 162 arrested in LGBTQ+ raids\nSeptember 13, 2026\nTurkish police have arrested at least 162 people and searched the offices of six LGBTQ+ associations in weekend raids designed to support the country's campaign to protect family values.\nThe Ankara-based LGBTQ+ rights group Kaos GL claimed that beyond arrests, the government had also cut access to dozens of websites and social media accounts belonging to associate groups and rights advocates.\nGovernment says its fulfilling duty to 'protect families and children'\nTurkish Justice Minister Akin Gurlek said investigations — prompted by accusations of prostitution and obscenity — were coordinated by prosecutors in Istanbul, Ankara, Izmir, Aydin and Mersin and involved judicial proceedings against 162 suspects, nine associations and 13 businesses across 15 provinces.\n\"As per the duty to protect families and children given to the state by the constitution, no criminal organization, abuse network or illegal activity which targets children, youths or families will be tolerated!\" Gurlek added in a social media post.\nAuthorities say they seized drugs, digital equipment, smuggled alcohol and a gun in weekend police operations targeting gay bars and night clubs as well as a hammam that was said to be a place of prostitution.\nThe Istanbul prosecutor's office added that it had found evidence indicating that children and minors were being inappropriately swayed on issues tied to sexual orientation and gender identity.\nRights groups say the government is unfairly targeting the LGBTQ+ community, with Kaos GL saying that it had been accused of making \"posts containing obscenities\" accessible to children.\nErdogan scapegoats LGBTQ+ 'perverts' for falling birthrates, avoiding actual contributing factors\nThe weekend police operation was dubbed \"My Family is Safe\" by the government and was part of President Recep Tayyip Erdogan's \"Decade of Family and Population\" scheme, which is designed to reverse plummeting birthrates in the aging country.\nAuthorities say it was intended to make sure that society does not see LGBTQ+ activity as \"normal\" and that raids were carried out to \"protect children, the institution of the family, and our shared moral values.\"\nAlthough same-sex relations are not illegal in the country, homophobia is rife, with President Erdogan blaming LGBTQ \"perverts\" for Turkey's rapidly declining birthrates.\nThat would seem a rhetorical diversion from the actual complexity of reasons for the decline, which Erdogan — who has ruled as the country's authoritarian president since 2014 as well as serving as its influential prime minister for 10 years before that — has called \"a disaster.\"\nThough Turkey's statistical agency, TurkStat, tracked a sharp decline in the total fertility rate between 2013 and 2023 (from 2.11 to 1.51 ), the shift brings birthrates in the country closer to those in other developed nations.\nObservers say the real reasons for the drop are more likely of a structural and institutional nature rather than one chalked up to lifestyle.\nTurkey's chronically worsening financial crisis, inflation, skyrocketing housing prices, family unfriendly workplace environments, limited access to affordable childcare, and higher educational and employment rates for women are all considered reasons for Turks to postpone having children, as well as for having fewer when they finally do.\nEdited by: Kieran Burke\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "scapegoat", "definition": "責任や問題を一方的に押し付けられる人や集団。ここでは、トルコの少子化問題の原因をLGBTQ+コミュニティに押し付けることを意味します。"}, {"word": "diversion", "definition": "注意や関心を別の方向に逸らすこと。ここでは、政府が実際の問題から注意をそらすための戦術を指します。"}, {"word": "fertility rate", "definition": "女性一人当たりの平均出生児数を示す統計指標。人口動態や国の人口増減を測定するのに使用されます。"}, {"word": "authoritarian", "definition": "権力を個人または少数者に集中させ、個人の自由を制限する政治体制。エルドアン大統領の統治スタイルを表しています。"}, {"word": "rhetorically", "definition": "説得力や効果を目的とした言語表現。ここでは、政治的に有効だが事実に基づかない主張を指します。"}, {"word": "chronically", "definition": "継続的または繰り返し起こる状態。ここではトルコの長期的かつ継続的な経済危機を表しています。"}]}, {"title_ja": "ペンシルベニア州の麻しん流行で676例に、死亡者が追加報告", "title_en": "Pennsylvania Measles Outbreak Reaches 676 Cases With Additional Death Reported", "summary_ja": "ペンシルベニア州保健局は、州内の麻しん流行がさらに拡大する中、新たな関連死亡を確認し、累計患者数は676例に達したと発表しました。この流行は特定のコミュニティにおけるワクチン接種率の低下を背景とした公衆衛生上の懸念が高まっていることを浮き彫りにしています。当局は住民に予防接種の状況確認とワクチン接種の検討を促しています。", "summary_en": "Pennsylvania health authorities have confirmed another measles-related death as the state's outbreak continues to expand, bringing the total case count to 676. The ongoing outbreak highlights growing public health concerns amid declining vaccination rates in certain communities. Officials are urging residents to verify their immunization status and seek vaccination if needed.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/measles-related-death-reported-pennsylvania-outbreak-grows/story?id=136410532", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、速報ニュースと生放送イベントの24時間体制での報道を提供しています。政治、経済、健康、国際情勢などの最新情報をご覧ください。主要なニュース速報をリアルタイムで視聴できます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. Stay updated with the latest developments in politics, business, health, and international affairs. Watch live streams of major news stories as they unfold.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "元Anthropic・OpenAI研究者がAI開発の加速ペースに警告", "title_en": "Former Anthropic and OpenAI Researcher Warns of Rapid AI Development Pace", "summary_ja": "AnthropicとOpenAIの両社で安全研究を行っていたジェイコブ・コックスン氏がABCニュースで、AI開発の加速ペースについて懸念を表明しました。彼は適切な安全対策なしに進む人工知能開発の急速な進展に伴う潜在的なリスクを強調しています。", "summary_en": "Jacob Coxon, a former safety researcher at both Anthropic and OpenAI, expressed concerns about the speed of AI development during an appearance on ABC News. He highlighted potential risks associated with the accelerating pace of artificial intelligence advancement without adequate safety measures.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/former-anthropic-openai-employee-sounds-alarm-ai-development/story?id=136401554", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウガンダの最年少君主オヨ王が埋葬され、ニュースキャスターが王位承継の準備へ", "title_en": "Uganda's Youngest Monarch King Oyo Buried as News Anchor Prepares for Throne", "summary_ja": "1995年に当時3歳で即位し世界最年少の君主となったウガンダのオヨ・ニイムバ・カバンバ・イグル・ルキディ4世が、ガンで34歳で亡くなった後、トロ王国に埋葬されました。ニュースキャスターのエドワード・ルキディ・キジャナンゴマが後継者として選ばれましたが、オヨの遺族は不明な息子が王位を継ぐべきだと主張し対立が生じていました。埋葬により激しい家族間の紛争が終わり、王国は新しい指導者との歩みを始めることができました。", "summary_en": "King Oyo Nyimba Kabamba Iguru Rukidi IV, who became the world's youngest monarch at age three in 1995, has been buried in Uganda's Tooro kingdom after dying of cancer at 34. News anchor Edward Rukidi Kijanangoma has been chosen as his successor following a succession dispute with Oyo's family, who claimed an unknown son should inherit the throne. The burial marks the end of a bitter family conflict and allows the kingdom to move forward with its new leadership.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/12/burial-king-oyo-uganda", "state_media": false, "category": "政治", "full_text": "Uganda’s King Oyo Nyimba Kabamba Iguru Rukidi IV, long the world’s youngest monarch, has been buried among the tombs of his royal forebears as his Tooro kingdom looked to put a bitter succession battle behind it.\nOyo’s appointed successor, the news anchor Edward Rukidi Kijanangoma, cast nine coffee berries into the grave at the Karambi Royal Tombs, marking the formal handover of power in the western Ugandan kingdom.\nOyo made global headlines in 1995 when he took the throne at the age of three. Images of the toddler king wearing a crown and royal robes sparked curiosity and adoration around the world.\nHe died last month at 34 in the United States, where he was receiving treatment for cancer.\nUganda is led by an elected head of state but retains several kingdoms that pre-date the British colonial era and are regarded as bulwarks of traditional identity and heritage.\nAt a church service before the burial, Oyo, who became a UN goodwill ambassador championing the fight against HIV and Aids, was eulogised as a reserved but jovial young man.\n“Although he became king and carried responsibilities far beyond what most people ever experience, he never completely lost the young boy who loved to have fun,” said his sister, Ruth Komuntale.\nRoyal guards clad in orange shawls then led the hearse carrying Oyo’s casket through the streets of the kingdom’s capital, Fort Portal, to the royal tombs, as thousands of mourners joined the procession on foot.\nThe burial, which was held 31 years to the day after Oyo’s coronation, followed days of bickering within the notoriously fractious royal family.\nA committee consisting of members of the royal clan announced on Wednesday it had chosen Oyo’s cousin, Kijanangoma, a news anchor and editor at state broadcaster UBC, as king.\nBut the late king’s immediate family said his hitherto unknown son should succeed him, as called for in his will. Oyo never married and was not known to have any children until the kingdom’s prime minister said in the statement announcing his death that he had a son.\nSupporters of Kijanangoma’s succession say Oyo’s family has not been able to produce basic information about the purported son.\nA source with knowledge of crisis talks over the matter said Ugandan authorities had successfully pushed through Kijanangoma’s succession on Friday. A government spokesperson could not be reached for comment.\nThe archbishop of the Church of Uganda, Stephen Kaziimba Mugalu, called for unity.\n“Words spoken in grief can cause pain, division and conflict,” he told mourners. “It can even destroy the legacy of the king we are mourning.”\nOyo himself took the throne after a protracted succession battle that finished in court.\nIn addition to his ceremonial responsibilities and campaigning against HIV and Aids, Oyo cultivated close ties with former Libyan leader Muammar Gaddafi, whom he named a special adviser to the monarch. Gaddafi donated money towards refurbishment of the royal palace.\nThe 56-year-old Kijanangoma, who maintained a low profile as the succession battle played out, has been described by fellow Ugandan journalists as quiet and humble.\nBesides the throne, the new king will inherit a considerable royal estate including swathes of land and sizeable cash payouts from the central government.", "translation_ja": "", "vocab": [{"word": "succession", "definition": "王位や地位の継承のこと。特に王族や指導者の交代時に使われる用語です。"}, {"word": "fractious", "definition": "気難しい、けんかっぱやいという意味の形容詞。家族や団体が内紛や対立しやすい状態を表します。"}, {"word": "ceremonial", "definition": "儀式的な、形式的なという意味の形容詞。実質的な権力よりも形式や式典に関わる職務を指します。"}, {"word": "bulwarks", "definition": "防壁や砦という意味の名詞。転じて、ある価値観や伝統を守る重要な存在や制度を指します。"}, {"word": "eulogised", "definition": "故人を称賛・讃美する、追悼演説をするという意味の動詞。葬儀などで故人の功績や人格を褒める際に使われます。"}, {"word": "jovial", "definition": "陽気な、ほがらかなという意味の形容詞。社交的で人付き合いの良い人物の性質を表します。"}]}, {"title_ja": "ナイジェリア人6人、600万ドルのオンライン恋愛詐欺で米国に引き渡され", "title_en": "Six Nigerians extradited to US over $6m online romance scam", "summary_ja": "2021年にケープタウンで逮捕されたBlack Axe犯罪ネットワークに関連するナイジェリア人6人が、金曜日に米国に引き渡された。彼らは洗練されたオンライン恋愛詐欺を通じて、100人以上のアメリカ人女性から600万ドル以上を詐欺したとされている。容疑者らは詐欺罪とマネーロンダリング罪に直面している。", "summary_en": "Six Nigerian nationals linked to the Black Axe criminal network were extradited to the United States on Friday after being arrested in Cape Town in 2021. They allegedly defrauded over 100 American women of more than $6 million through sophisticated online romance scams. The men face wire fraud and money laundering charges.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/12/nigerians-extradited-online-romance-scams", "state_media": false, "category": "経済", "full_text": "Six Nigerian nationals linked to an organized criminal network that allegedly swindled American women out of more than $6m through online romance scams were extradited to the United States on Friday.\nSouth African police confirmed they were to be extradited earlier on Friday, while local news in Africa confirmed that the Directorate for Priority Crime Investigation, known as the Hawks, facilitated their handover to officials from the US Federal Bureau of Investigation and Secret Service at Cape Town international airport, in collaboration with Interpol South Africa.\nThe men, who were arrested in the South African city of Cape Town in 2021, face wire fraud and money laundering charges.\nThey are accused of belonging to a criminal network known as the Black Axe, which Interpol describes as being among criminal groups responsible for a significant share of the world’s cyber-enabled financial fraud, typically through romance, cryptocurrency and investment scams.\nAccording to South African police, the men are alleged to have targeted more than 100 women in the US, defrauding them of more than $6m through online romance or love scams.\nAmong the alleged victims were pensioners and businesspeople who were reportedly targeted through sophisticated online relationships.\n“Through the coordination of Interpol South Africa, the six will today be transported from a correctional facility in Cape Town to Cape Town international airport, where they will be handed over to officials from the FBI and the United States Secret Service, who arrived in South Africa this morning,” said police spokesperson Katlego Mogale.\nA recent operation by Interpol targeting west African organized crime groups led to the arrest of 58 people and the identification of 263 suspects linked to various criminal networks involved in similar crimes, the multinational police body said last month.\nThe operation aimed to disrupt money laundering, identify high-value targets, seize assets, and support arrests and prosecution.\nIn South Africa, authorities raided seven locations in the city of Johannesburg linked to a syndicate that ran romance and investment scams targeting retirees in English-speaking countries.\nIn that operation in South Africa, police arrested 39 people, seized $2.67m and froze more than 250 bank accounts, Interpol said.", "translation_ja": "", "vocab": [{"word": "extradited", "definition": "別の国に引き渡されたことを意味する。国家間の法的手続きによって、容疑者が身柄を拘束されていた国から、起訴国に移送されるプロセスを指します。"}, {"word": "organized criminal network", "definition": "組織的な犯罪を行うために構成された、複数の人物による集団を指す。通常、明確な階級構造と役割分担を持っています。"}, {"word": "wire fraud", "definition": "電信、インターネット、電話などの通信手段を使用して詐欺行為を行うこと。米国の連邦犯罪法で重大な犯罪とされています。"}, {"word": "money laundering", "definition": "違法に得た資金を合法的な源泉のものとして見せかける行為。犯罪収益を金融システムに統合するプロセスです。"}, {"word": "disrupt", "definition": "組織的な活動や計画を中断させたり、妨害したりすることを意味する。警察活動では違法ネットワークの機能を停止させることを指します。"}, {"word": "syndicate", "definition": "特定の違法行為を共同で行うために組織された集団や企業連合を指す。通常、複数の個人や組織が参加しています。"}]}, {"title_ja": "女性器切除を世界的に終わらせるために1,550万ドルの基金が立ち上げられた", "title_en": "$15.5m Fund Launched to End Female Genital Mutilation Worldwide", "summary_ja": "世界的に230万人以上の女性と少女に影響を与えている女性器切除（FGM）に対抗するための前例のない1,550万ドルの基金が立ち上げられました。ハー・ホライゾン・ファンドは複数のドナーから1億ドルを集め、2030年までにFGM廃止に向けた勢いを作ることを目指しており、既存プログラムへの国連資金が45%減少している中での取り組みです。最前線の活動家とFGM生存者は、地域社会における彼らの活動を維持するための重要なリソースとして本イニシアティブを歓迎しています。", "summary_en": "A unprecedented $15.5 million fund has been launched to combat female genital mutilation (FGM), which affects over 230 million women and girls globally. The Her Horizon Fund aims to pool $100 million from donors to create momentum toward eliminating FGM by 2030, as UN funding for existing programs has declined by 45%. Frontline activists and FGM survivors welcome the initiative as critical resources for sustaining their work in local communities.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/sep/11/15m-fund-launched-to-create-unstoppable-momentum-to-end-fgm-worldwide", "state_media": false, "category": "社会", "full_text": "Frontline activists and leaders in the fight against female genital mutilation, which has affected more than 230 million women and girls worldwide, have welcomed an unprecedented $15.5m (£11.4m) fund aimed at creating “unstoppable momentum” to finally end the practice.\nThe launch of the fund comes as women’s rights are increasingly under attack and donor funding is in sharp decline, particularly for work led by FGM survivors in local communities. It is thought to be the largest single philanthropic contribution to ending the practice of FGM.\nThe United Nations has set a goal of elimination by by 2030, but progress is not on track as funding declines and legal protections are challenged.\nFunding received by the largest initiative to end the practice – a joint programme operated in 18 countries by the UN’s sexual and reproductive health agency, UNFPA, and the UN humanitarian organisation for children, Unicef – fell by 45% last year, from $29.6m to $16.3m.\nThe Her Horizon Fund has been seeded with $14m from the Wallace Global Fund, plus an additional $1.5m contribution from an anonymous donor, making $15.5m in total.\nThe aim of Her Horizon Fund, set up by the US-based Wallace Global Fund, is to pool $100m from donors to reach a “tipping point” towards ending FGM within a generation.\nIfrah Ahmed, a Somali-Irish activist and survivor of FGM who set up the Ifrah Foundation to end practice in Somalia, where it is nearly universal, said: “By giving $14m, the global fund will ensure activists can continue their work in this area.”\nUN funding worth $300,000 to her organisation was cut by UNFPA last year, but Ahmed managed to raise money from elsewhere. The Ifrah Foundation has helped push for anti-FGM legislation in Somalia, she said.\nThree of Somalia’s seven federal member states have enacted anti-FGM laws, while in two other states bills banning the practice have been endorsed by cabinet and are awaiting parliamentary approval, albeit with opposition by religious leaders in some areas.\n“If we don’t continue to raise money, the dream where this practice will end will have died for young girls,” she added.\nAdvocates warn that while international recognition of FGM as a human rights violation has grown, and countries such as Burkina Faso, the Gambia and Kenya have criminalised the practice, progress remains fragile.\nIn recent years, survivors and frontline groups have been trying to protect gains made over several decades.\nThe Gambia’s supreme court, for instance, is considering a constitutional challenge to the country’s 2015 ban on female genital mutilation and cutting. The case follows a 2024 parliamentary effort to repeal the ban, which lawmakers rejected after months of debate, amid strong resistance from women’s rights groups. In Sierra Leone, the new Child Rights Act does not prohibit FGM, despite sustained campaigning from rights groups.\nSusan Gibbs, the Wallace Global Fund’s senior adviser on women’s rights and FGM, said: “Female genital mutilation is a global crisis, an extreme manifestation of gender-based violence and violence against children, and a public health emergency.\n“There has been decades of progress, and UN data indicates declines in prevalence in a number of countries. But there have also been anti-rights pushback and political crises. Obviously, donor funding is in decline. So it’s a mixed picture.”\nShe added: “We’re at this critical inflection point. Most frontline organisations have been absolutely starved for resources, and so more direct funding would allow them to sustain and scale [up] their work.”\nGibbs, who attended a Justice for Girls global gathering in Kenya earlier this month, where the fund was officially launched, said the momentum at the meeting was “incredible”.\n“Lasting change must be led by the frontline – it cannot be imposed from the outside. Frontline survivors, activists, they know their communities and they know what it will take. They must have the resources and power to lead.\n“I’m convinced the impact [of the fund] will be catalytic,” she said. “There’s no doubt in my mind that with adequate funding, these frontline activists have what it takes to get this done.”\nFGM is the partial or total removal of female genitalia for non-medical reasons. It has been endured by more than 144 million women and girls in Africa, 80 million in Asia and 6 million in the Middle East. The practice can cause immediate health complications such as severe pain, excessive bleeding and infection, as well as long-term consequences that include complications during childbirth, chronic pain and lasting psychological trauma.\nA 2025 study estimated that FGM causes approximately 44,000 deaths each year in the 15 countries examined, making it one of the leading causes of death for women and girls in those countries.", "translation_ja": "", "vocab": [{"word": "philanthropic", "definition": "慈善的な、人道的な寄付や支援に関する。営利目的ではなく社会貢献のための活動を指します。"}, {"word": "tipping point", "definition": "大きな変化が起こり始める臨界点。この時点を超えると急速に状況が変わります。"}, {"word": "frontline", "definition": "問題解決の最前線、直接対応している組織や個人。第一線で活動している様子を表します。"}, {"word": "prevalence", "definition": "ある現象や病気などが集団内でどの程度広がっているかの割合。医学や統計で使われます。"}, {"word": "inflection point", "definition": "転換点、方向性が大きく変わる重要な局面。数学の変曲点から転じて用いられます。"}, {"word": "fragile", "definition": "もろい、壊れやすい状態。成果や改善が不安定で容易に失われる可能性があることを示します。"}, {"word": "catalytic", "definition": "触媒的な、大きな変化や反応を引き起こすきっかけとなる。重要な変化をもたらす力を持つ。"}]}, {"title_ja": "AIは本当に10年以内に人類を滅ぼす可能性があるのか？", "title_en": "Could AI Really Kill Us Within a Decade?", "summary_ja": "AI企業は、その技術が人類を消滅させる可能性があると警告を発しています。この記事では、これらの黙示録的な予測が真の懸念なのか、それとも企業自体に利益をもたらしているのかを検証しています。アルジャジーラはこのような警告的主張の背景にある動機を調査しています。", "summary_en": "AI companies are issuing warnings that their technology could potentially wipe out humanity. The article examines whether these apocalyptic predictions are genuine concerns or if they benefit the companies making them. Al Jazeera investigates the motivations behind such alarming claims.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/13/ai-apocalypse-warnings-benefit-ai-companies?traffic_source=rss", "state_media": false, "category": "IT", "full_text": "Could AI really kill us within a decade?\nNewsFeed\nCould AI really kill us within a decade?\nAI companies are warning that their technology could wipe out humanity. But are the apocalyptic predictions actually benefiting the companies themselves? Al Jazeera’s Lina Serene explains.\nPublished On 13 Sep 2026", "translation_ja": "", "vocab": [{"word": "apocalyptic", "definition": "世界の終末や大破壊を予言する、または非常に悲劇的な未来を描写する。大規模な災害や滅亡を伴うシナリオを指します。"}, {"word": "wipe out", "definition": "完全に消滅させる、排除する、または絶滅させる。ビジネス用語でも個人の破産などを意味します。"}, {"word": "predictions", "definition": "将来に起こると予想または推測する事柄。科学的根拠や分析に基づいた予測を指します。"}, {"word": "motivations", "definition": "ある行動を起こす理由や動機。人や企業が特定の行動をする背後にある目的や利益。"}, {"word": "investigates", "definition": "事実や真実を明らかにするために綿密に調査する。ジャーナリズムではニュースの背景や原因を追求すること。"}]}, {"title_ja": "バルセロナがレバンテを撃破、ヤマルが2得点で完璧な滑り出しを維持", "title_en": "Barcelona beat Levante as Yamal scores twice to maintain perfect start", "summary_ja": "バルセロナは19歳のラミネ・ヤマルが2得点をあげ、レバンテに4-2で勝利して6連勝を達成した。カタルーニャの名門はラ・リーガで5勝5敗のまま首位に立ち、レアル・マドリードから3ポイント差をつけている。レバンテが後半に4-2に迫る場面があったが、バルセロナは耐えて全大会通算6連勝を果たした。", "summary_en": "Barcelona extended their perfect record to six wins with a 4-2 victory over Levante, with 19-year-old Lamine Yamal scoring twice. The Catalan club sits atop La Liga with five wins from five matches, three points clear of Real Madrid. Despite a late scare when Levante pulled back to 4-2, Barcelona held firm to secure their sixth consecutive win across all competitions.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/13/barcelona-beat-levante-as-yamal-scores-twice-to-maintain-perfect-start?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Barcelona beat Levante as Yamal scores twice to maintain perfect start\nBarcelona have won all six games this season, and sit top of La Liga with five wins after win at Levante.\nLamine Yamal scored twice as Barcelona continued their perfect start to the season with a hard-fought 4-2 La Liga victory over Levante in Valencia on Sunday.\nXavi Espart and Karim Adeyemi were also on target for Barcelona, who are alone at the top of the La Liga table with five wins from five, three points ahead of Real Madrid.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Danish FA allege FIFA Legal Committee evaded questions on Infantino’s plan\n- list 2 of 4Morocco PM takes aim at federation chief over 2030 World Cup final boast\n- list 3 of 4FIFA rebukes Morocco’s claim it will host 2030 World Cup final\n- list 4 of 4UEFA wants FIFA subsidiaries’ blocked from Infantino discovery fight in US\nBarcelona went ahead after five minutes when a slick one-touch move ended with 19-year-old Espart firing home from the edge of the box via a slight deflection for his first senior goal.\nBarcelona continued to dominate possession and doubled their advantage in the 19th minute. Raphinha controlled Fermin Lopez’s through ball expertly and picked out an unmarked Lamine in the centre of the box for an easy finish.\nLevante rallied after their early struggles, applying some pressure of their own, and despite failing to create a clear opening, ended the half with six attempts to Barcelona’s three.\nGerard Martin, who appeared to be limping, was withdrawn by Barcelona manager Hansi Flick at half-time and replaced by Andreas Christensen.\nBarcelona struck when Aissa Mandi conceded a penalty for a foul on Lamine 42 seconds after the restart. The winger converted the spot kick to complete his third double of the La Liga season and puncture Levante’s growing belief that they could fight their way back into the contest.\nLevante came close on the hour when Victor Garcia beat goalkeeper Joan Garcia, but a partial block by Pau Cubarsi and Christensen’s goal-line clearance combined to keep his effort out.\nAn errant pass from Espart in the 79th minute allowed Levante to pull one back, with forward Ivan Romero rounding Joan Garcia before passing the ball into the net.\nNine minutes later, Roger Brugue burst through multiple Barcelona challenges to reduce the deficit to one goal as what looked like a comfortable Barcelona win threatened to turn into a heroic Levante comeback.\nYet Adeyemi’s mazy run and smart finish in the 93rd minute ended the hosts’ hopes of a draw. The home crowd nevertheless showed their appreciation for the fighting spirit shown by their side, chanting “Levante” as the German celebrated his goal.\nDespite their late wobble, Barcelona secured a sixth successive win in all competitions, with Rodri’s assured midfield display and captain Raphinha’s relentless running central to their success.\nAtletico leave it late against Sociedad\nAtletico Madrid scored three late goals to beat Real Sociedad 3-0, as new signings Alejandro Grimaldo and Jonathan David scored their first goals since joining the club.\nBoth sides struggled to create clear chances until Grimaldo netted an 84th-minute penalty, before David doubled their lead after finding space on the break six minutes later.\nGiuliano Simeone added a third in the 95th minute to complete the scoring for Atletico, who were without key players Julian Alvarez and Pablo Barrios due to muscle injuries as they returned to winning ways following two consecutive losses.\nMalaga rescued a 1-1 draw against Celta Vigo, who had dominated the game at Balaidos, while Deportivo A Coruna also drew 1-1 with Getafe after going behind in the second half.", "translation_ja": "", "vocab": [{"word": "slick", "definition": "滑らかで洗練された、巧妙なという意味。スポーツでは、迅速かつ効率的なプレーを表現する際に使用される。"}, {"word": "dominate possession", "definition": "試合中にボールを支配する、ボール支配を握るという意味のサッカー用語。攻撃的なチームが優位に立っていることを示す。"}, {"word": "penalty", "definition": "ペナルティキック、つまりファウルによって与えられる罰則としてのキック。サッカーで得点の機会となる重要な場面。"}, {"word": "puncture", "definition": "穴をあける、打ち砕くという意味。ここではレバンテの意気を削ぐ、復帰のチャンスを潰すという比喩的用法。"}, {"word": "errant", "definition": "誤った、的を外した、間違った判断や行動を指す形容詞。ここでは不正確なパスを表現している。"}, {"word": "mazy", "definition": "迷路のような、複雑で入り組んだドリブルやランを指す。サッカーで相手を揺さぶるような動きを表現する用語。"}]}, {"title_ja": "ジェファーソン=ウッデン、ベドナレク、アルティメット選手権スプリント二冠達成", "title_en": "Jefferson-Wooden, Bednarek Complete Ultimate Championship Sprint Doubles", "summary_ja": "アメリカのスプリンター、ケネス・ベドナレクとメリッサ・ジェファーソン=ウッデンがブダペストで開催された第1回アルティメット選手権で100m、200m両種目を制し、それぞれ15万ドルの賞金を獲得した。ベドナレクは200mで世界歴代2位となる19.52秒を記録し、ジェファーソン=ウッデンは200mで21.47秒の今季世界最高記録を樹立した。", "summary_en": "American sprinters Kenneth Bednarek and Melissa Jefferson-Wooden swept both the 100m and 200m events at the inaugural Ultimate Championship in Budapest, each earning $150,000 in prize money. Bednarek clocked a world-leading 19.52s in the 200m while Jefferson-Wooden ran a 21.47s world lead in her event. The weekend-long competition showcased elite track and field athletes competing for record prize purses.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/13/jefferson-wooden-bednarek-complete-ultimate-championship-sprint-doubles?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Jefferson-Wooden, Bednarek complete Ultimate Championship sprint doubles\nThe Americans won both the 100m and 200m at the Ultimate Championship that saw elite athletes win $150,000 each.\nAmericans Kenneth Bednarek and Melissa Jefferson-Wooden have claimed the sprint double to close off an action-packed weekend in Budapest that saw elite track and field athletes crowned inaugural Ultimate Champions and pocket $150,000 in prize money.\nBednarek stormed to victory in a 19.52s world lead – the season’s best performance globally – ahead of Olympic champion Letsile Tebogo of Botswana (19.76s) and American Courtney Lindsey (19.79s) as Jamaican sprint legend and Ultimate Champion ambassador Usain Bolt gave his nod of approval from the stands on Sunday.\nRecommended Stories\nlist of 4 items\n- list 1 of 4World Athletics Ultimate Championship opens with record $10m prize pot\n- list 2 of 4Lights, camera, action: Irksome influencers at the US Open are here to stay\n- list 3 of 4Asian Games athletes forced to evacuate amid record rainfall in Japan\n- list 4 of 4Spain’s FA to fund IVF, egg freezing for female football players, referees\nA day earlier, Bednarek finally emerged from the shadow of compatriot sprinter Noah Lyles to claim the 100m crown in 9.85s and edge out world champion Oblique Seville of Jamaica (9.90s)
