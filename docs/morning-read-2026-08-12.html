 false, "category": "経済", "full_text": "Israeli settlers besieging Palestinian families in West Bank village\n- Published\nIsraeli settlers have been besieging two Palestinian families in their homes in the occupied West Bank since Sunday, with the families saying their supplies were running out and rights groups urging the authorities to step in.\nOn Wednesday Israeli security forces were reported to have withdrawn from the Jewish settler outpost in the village of Qusra near Nablus, following clashes with a crowd of extremist settlers. About a dozen settlers are said to remain at the site.\nAfter the Palestinian homeowners made their initial report to the Israeli army, the first soldiers who arrived at the scene were filmed praying with the settlers.\nThe Abu Ridi and Hassan families have been posting on social media appealing for help after their water and power supplies were cut off and their food stocks ran low.\nIt is not clear exactly what the settlers in Qusra want. In the past, settlers have forced Palestinians out of their homes and seized their properties.\nThe stated aim of the settlers is to empty the area of its Palestinian residents.\nThe latest developments come as a top UN official told the Security Council in New York on Tuesday that \"the West Bank is at breaking point\".\nAll settlements are illegal under international law. Outposts are set up without official Israeli authorisation.\nPalestinian security camera footage shows settlers tearing down a wall outside the Abu Ridi family's home on Sunday evening and using the stones to block the road.\nThis left seven people - including two young girls – unable to leave their homes while other Palestinians could not reach them. They live in what is known as Area B, part of the West Bank under Palestinian administrative control and Israeli security control.\nPosting on Facebook, Qusay Abu Ridi said the situation was critical, \"especially as we are completely isolated\".\nHe wrote: \"We are living in our own home, on our own land, and we are asking for nothing more than the right to live safely and with dignity.\"\nAysha Hassan told Reuters the settlers had \"tried to break the gate\" to the house and \"started throwing stones at us, cursing and insulting us\".\nShe said her family was \"dying of fear, extremely terrified\".\nOn Monday, Israeli settlers blocked Israeli journalists from the left-leaning Haaretz newspaper from trying to reach the Palestinian properties. The reporters said Israeli soldiers at the scene refused to help them when their car was blocked for two hours. They were told the area was a closed military zone, however the order was not enforced on the settlers.\nA day later the Israeli human rights group Yesh Din urgently appealed to the head of the Israeli military's Central Command for the army to protect the besieged residents, evacuate the settlers' outpost and hold the settlers accountable.\nLate on Tuesday, a Palestinian ambulance was finally allowed to reach the families, delivering food and taking one child away for medical treatment.\nAt about the same time, the Israel Defense Forces (IDF) put out a statement condemning the establishment of the new outpost. It said that entering and seizing Palestinian homes was \"illegal, reprehensible, and unacceptable activity\".\nWhen the head of its Central Command, Maj Gen Avi Bluth and other senior officers arrived at the scene early on Wednesday they are said to have met residents and voiced their \"grave concern\".\nAfterwards, Palestinian security camera video shared with the BBC showed confrontations between Israeli soldiers and border police and a large crowd of settlers. The security forces used tear gas and stun grenades.\nIn other footage, the Israeli forces appear to have confiscated the canopy under which the settlers were sheltering, while leaving their other equipment.\n\"Border Police forces evacuated the tent and are working to evacuate the civilians who were staying there. The incident is still ongoing,\" the IDF stated.\nIt said it was decided that \"disciplinary action would be taken against the security personnel involved, who were documented at the site several days ago\".\nThe Palestinian village mayor, Abdel Azim Wadi, told the BBC that local residents had seen \"a clear and sustained pattern of targeting Qusra\". Last month a newly completed mosque was set on fire with graffiti in Hebrew sprayed nearby.\nThat settler attack was one of many that followed on from an incident in the Palestinian village of Tal. After Israeli settlers attacked Tal, it triggered an escalation in which six people were killed - four Palestinians and two Israeli soldiers – one of whom acted as a security coordinator for a nearby Israeli settlement.\nIn July, settlers also surrounded a Palestinian home in the village of Jalud, near Qusra, for more than two weeks. Afterwards, the owners fled and settlers took over the property where they remain until now.\n\"Settler violence has reached unprecedented levels,\" the UN's Deputy Special Coordinator for the Middle East Peace Pro", "translation_ja": "", "vocab": [{"word": "besiege", "definition": "ある場所や人を包囲して、その中から出られないようにすること。軍事的または敵対的な文脈でよく使われる。"}, {"word": "outpost", "definition": "遠く離れた場所に設置された小規模な軍事施設や前哨地点。本拠地から遠く離れた場所での活動基地を意味する。"}, {"word": "reprehensible", "definition": "非常に悪い、非難される価値のある行為や態度を表す形容詞。道徳的に許されない行動を指す。"}, {"word": "escalation", "definition": "紛争や問題が段階的に悪化・拡大していくこと。より深刻または激しい状態へ進展することを意味する。"}, {"word": "unprecedented", "definition": "過去に前例がない、新しい、かつてない規模や程度の事柄を表す形容詞。"}, {"word": "disciplinary action", "definition": "職務違反や不適切な行為に対して組織が取る懲戒処分。警告から解雇まで様々な措置が含まれる。"}]}, {"title_ja": "米国移民税関捜査局が電撃手袋の装備を計画", "title_en": "ICE Plans to Equip Agents with Electric Shock Gloves", "summary_ja": "米国移民税関捜査局（ICE）は最大2,000万ドルをかけて、GLOVE装置と呼ばれる電撃を与える手袋を法執行官に配備する計画を立てている。この手袋は最大380ボルトの電気を放出でき、ボタンで起動されるが、公民権団体は悪用と説明責任に関する懸念を表明している。", "summary_en": "US Immigration and Customs Enforcement plans to spend up to $20 million on shock-delivering gloves called GLOVE devices for law enforcement use. The gloves can deliver up to 380 volts of electricity and are activated by a button, though civil rights groups have raised concerns about potential abuse and accountability.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c20d292gdp4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "ICE plans to equip agents with gloves that can deliver electric shocks\n- Published\nUS Immigration and Customs Enforcement (ICE) officers may soon be equipped with gloves that can deliver electric shocks as they carry out their law enforcement duties.\nICE plans to spend up to $20m (£14.8m) to buy the Generated Low Output Voltage Emitter (GLOVE), according to a note published on Monday by the Department of Homeland Security (DHS).\nThe gloves can deliver up to 380 volts of electricity, roughly three times the charge of a standard US power outlet.\nCivil rights groups, including the American Civil Liberties Union (ACLU), have expressed alarm over its use.\n\"ICE is constantly assessing the needs of our officers in the field to ensure they have the tools and equipment necessary to safely arrest and remove criminal illegal aliens from our country,\" the DHS said in a statement to the BBC.\nCompliant Technologies LLC, which makes the gloves, told the BBC it was unable to comment on the sale. A no-bid purchase contract could be published as early as Friday, DHS said.\nThe GLOVE devices are activated by pushing a button to deliver shocks and can deliver up to 30 pulses per second. They also feature built-in microprocessors that keep a record of activation. Compliant Technologies states on its website that they do not cause injury and are used by many agencies.\nA user manual on the company's website recommends avoiding use on the elderly, small children, pregnant women and the \"severely handicapped\", as well as that an additional officer be present to restrain the subject while the gloves are being used.\nUnlike a taser, which uses sharp barbs in the skin to deliver a shock of up to 50,000 volts, the gloves do not complete an electrical circuit inside the body.\nThe gloves instead deliver a sharp shock to convince a subject to comply using \"pain deterrence\", says Lt Butch Gallion, an administrator at Hawkins County jail in Tennessee.\n\"We may or may not deploy them. It just depends on how they act. When you push the button to turn them on there's a light that displays. The inmates understand that light, and often just seeing the light brings compliance,\" he says.\nThe shocks can only be delivered when they contact skin, allowing an officer to touch a subject's clothing, and then move to the skin – typically the wrist or elbow - if they begin to fight.\nIf they become combative, he continues, \"then you can apply the gloves to an area that the skin is exposed. And it's an instant complier for me\".\nAccording to the DHS note, GLOVE would be used by officers and agents in Homeland Security Investigations (HSI), which targets transnational criminal organisations, and Enforcement Removal Operations (ERO), which is responsible for arresting, detaining and deporting people who violate immigration laws in the US.\nSome law enforcement agencies are already using the gloves but it's believed that the planned ICE purchase would be the largest from Compliant Technologies to date.\nCivil rights groups, including the American Civil Liberties Union (ACLU), have expressed alarm about law enforcement using them.\n\"ICE spent the last year showing this country that they are willing to disregard the law and are too quick to use force, with devastating and at times fatal consequences for citizens and noncitizens alike,\" said Jenn Rolnick Borchetta, deputy director on policing at the ACLU.\nThe agency has faced scrutiny over deaths that have occurred during immigration enforcement activity.\nRecent incidents include the fatal shooting of Mexican national Lorenzo Salgado Araujo in Texas, while Colombian national Johan Sebastián Durán Guerrero was killed during an immigration enforcement operation in Maine.\nICE has also been under pressure to deliver President Donald Trump's deportation agenda, which includes meeting a daily target of arrests.\n\"Now they [ICE] might be equipped with a device that allows them to deliver an electric shock with their hands by pushing a small button, in a move that might be imperceptible to those watching,\" Borchetta said.\n\"Giving immigration agents a concealed means of delivering terrible pain is a recipe for more harm to the public and less accountability.\"\nWith reporting by Max Matza\nRelated topics\n  - Published4 February", "translation_ja": "", "vocab": [{"word": "transnational", "definition": "国家間または複数の国にまたがることを意味する。ここでは複数国家の犯罪組織を指す。"}, {"word": "deployment", "definition": "兵力や装備を戦略的に配置すること。ここでは電撃手袋の使用展開を指す。"}, {"word": "deterrence", "definition": "抑止力；犯罪や行動を防ぐために使用される脅迫または恐怖。"}, {"word": "imperceptible", "definition": "知覚できない、気づかれない状態を示す。ここでは観察者に見えない形での電撃使用を指す。"}, {"word": "scrutiny", "definition": "厳密な調査や詳細な検査。ここでは機関の行動に対する厳しい監視を指す。"}, {"word": "combative", "definition": "闘志的な、抵抗的な。対象者が暴力的に対抗する状態を表す。"}]}, {"title_ja": "連続殺人犯・強盗犯に終身刑判決、システム的失敗が明らかに", "title_en": "Serial attacker given whole life sentence for two murders and rape", "summary_ja": "ロンドンで2人の女性殺害と強盗罪で有罪となったシモン・レヴィ容疑者（40歳）に対し、仮釈放なしの終身刑が言い渡された。レヴィ容疑者は保釈中で警察の監視下にあったにもかかわらず犯罪を犯したことが明らかとなり、刑事司法制度における深刻な失敗が露呈した。", "summary_en": "Simon Levy, 40, has been sentenced to life imprisonment without parole after being convicted of murdering two women and raping another in London. The case has exposed serious failures in the criminal justice system, as Levy was able to commit these crimes while on bail and under police monitoring despite previous convictions for sexual assault.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4g30dw9xw6o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Double killer and rapist given whole life sentence\n- Published\nA serial sex attacker who had a \"morbid fascination\" with sex has been jailed for the rest of his life after he was found guilty of murdering two women and raping a third.\nSimon Levy, 40, killed Carmenza Valencia-Trujillo, 53, in March 2025 and 39-year-old Sheryl Wilkins five months later. Earlier that year, he raped a third woman in the same Tottenham car park where Wilkins was later found dead.\nAt the Old Bailey on Wednesday, Judge Mark Lucraft KC sentenced Levy to a whole life order, meaning he will never be released.\nThe sentence comes after police and the Crown Prosecution Service (CPS) apologised over a series of disastrous decisions that left him free to roam the streets.\nWhen Levy carried out the attacks, he was on bail and being monitored by the Met.\nThe police watchdog is currently examining how he was managed over a four-year period, from his first conviction in September 2021 for sexual assault up to his final arrest in September 2025.\nFollowing Wednesday's sentencing, Met Police Commissioner Sir Mark Rowley said the handling of Levy's case was a \"whole system failing\".\nDuring his trial, the court heard Levy suffocated both women in sexually motivated attacks, with Valencia-Trujillo found in a largely abandoned block of flats on the Aylesbury estate in south-east London, and Wilkins behind a car park wall near Tottenham High Road, north London.\nThe woman he raped had told the police where he lived but she was not formally interviewed until after Levy had killed.\nSentencing Levy, Lucraft said, external: \"You are clearly someone who ruthlessly exploits others for your own personal sexual satisfaction\".\nNoting his disturbing internet history and collection of press cuttings about sexual crimes, Lucraft said Levy was \"someone who appears to have a morbid fascination with sex, rape, and crime\".\nThe judge added the offences reflected \"a series of attacks by you upon vulnerable women\".\nLucraft added he was \"acutely aware that whole life terms are sentences that should be considered for rare cases\".\nBut in this case \"the starting point has to be a whole life order\", he said, as the aggravating features outweighed any mitigating features and \"this cannot be described in any way as a borderline case\".\n\"You will be in prison for life and there will be a whole life order,\" the judge added.\nThe court heard victim impact statements from families of the murdered women and the woman he raped.\n'Know this, you lose'\nLindsey Hicks, Wilkins' sister, addressed Levy directly, saying: \"I hope you rot in prison for the rest of your life.\"\nShe added: \"You, Simon Levy, have destroyed our lives and we will never get over this. Sheryl was a beautiful soul who you cruelly took away in an evil act of crime.\n\"We should have been growing old together like sisters do and be there to support each other.\n\"Instead, I'm having to realise that one day in the near future I will be older than my big sister.\"\nShe said the past year had been the \"worst of our lives\" and concluded her witness statement by telling him: \"Know this, you lose.\"\nWilkins' mother, Mary Wilkins, said she takes a \"small measure of comfort\" that Levy is now locked up and will never be free again.\nShe added her daughter \"ended your chances of hurting anyone else\".\nDuring his trial, jurors heard Levy had a string of convictions for attacking women dating back to July 2018, including one carried out against a prison officer in 2022.\nEarlier this year, Levy was also convicted of sexually assaulting 11 other women, 10 of them on trains and the Tube in London between 2023 and 2025.\nLevy had declined to give evidence during his trial but pleaded not guilty to the two murders, as well as two counts of rape, grievous bodily harm with intent, and non-fatal suffocation against the surviving woman.\nAfter sentencing, Sir Mark said the Met had apologised for its part.\n\"The concerning aspect for me is the fact he had been caught, he had been charged with offences,\" he said.\n\"He was repeatedly put by police before the courts seeking he be remanded in custody, saying this man is too dangerous to be on the streets, and between the CPS and the courts, they kept bailing him.\"\nThe commissioner said it was \"not acceptable\" for the \"struggling criminal justice system\" to put dangerous offenders on the street for the police to monitor.\nHe added: \"We are seeing far too many cases day in and day out - knife carrier sex offenders who have been bailed when a few years ago they had been remanded in custody.\"\nMayor of London Sir Sadiq Khan said Valencia-Trujillo, Wilkins and Levy's other victims \"deserved a system that believed and protected them\".\n'Institutional failure'\nHe added: \"Time and time again, opportunities to stop him were missed.\n\"I am appalled by his crimes and the failures across multiple agencies that could have prevented him from harming, and ultimately killing, more women.\"\nHe said the \"multi-agency failings need a", "translation_ja": "", "vocab": [{"word": "morbid", "definition": "異常で不健全な興味や関心を示す状態を指す形容詞。ここではレヴィが性犯罪に執着的な関心を持っていたことを表す。"}, {"word": "suffocated", "definition": "窒息させるという意味の動詞の過去形。両被害者が息ができなくされて殺害されたことを表す。"}, {"word": "mitigating", "definition": "罪や過失を軽くする・緩和する要因を指す形容詞。裁判で刑罰を減らす理由となる情状酌量の事項を表す。"}, {"word": "aggravating", "definition": "犯罪を悪化させる・重大にする要因を指す形容詞。裁判で刑罰を重くする理由となる加重要因を表す。"}, {"word": "remanded in custody", "definition": "判決前に被告人を留置する司法的な決定を表す表現。被告人が危険であるため釈放されず拘留されることを意味する。"}, {"word": "institutional failure", "definition": "複数の公的機関が一体となって機能しなかったシステム上の失敗を指す表現。複数部局の協調不足による政策的な失策を表す。"}]}, {"title_ja": "英国の学生がA-レベル、T-レベル、BTec試験の結果発表を待つ", "title_en": "Students Await A-level, T-level and BTec Results in UK", "summary_ja": "イングランド、ウェールズ、北アイルランドの数十万人の学生が木曜日にA-レベル、T-レベル、BTec試験の結果を受け取ります。大学UK協会は、高等教育費用に対する政治的批判に落胆させられないよう学生に警告しており、記録的な数の学生が大学の第一志望に合格することが予想されています。結果は、学生ローン改革に関する継続的な議論と職業教育代替案への強調の増加の中で発表されます。", "summary_en": "Hundreds of thousands of students across England, Wales and Northern Ireland will receive their A-level, T-level and BTec results on Thursday. Universities UK warns students not to be discouraged by political criticism of higher education costs, as record numbers are expected to secure university places. The results come amid ongoing debates about student loan reforms and increased emphasis on technical education alternatives.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8dn8q3r8mzo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Students wait for A-level, T-level and BTec results\n- Published\nHundreds of thousands of students in England, Wales and Northern Ireland will receive A-level, T-level and BTec results on Thursday morning.\nAnother record number of students are expected to find out they have secured a place at their first choice of university.\nThe cost of going to university has been in the spotlight this year, with mounting pressure on the government to reform student loan repayments and a renewed focus on technical education under Prime Minister Andy Burnham.\nBut the chief executive of Universities UK, which represents more than 140 vice-chancellors, urged students to not \"let politicians make your decision for you\".\nAbout 40% of 18-year-olds in England receive A-levels every summer.\nAround 250,000 grades for vocational and technical qualifications are also expected to be released to students in England, including BTec National, Cambridge Technical, Cambridge Advanced National and T-level results.\nAS-levels, which will count towards students' final A-level results next summer in Wales and Northern Ireland, will also be released.\nThis year, the pass rate for National 5, Higher and Advanced Higher exams in Scotland rose across the board.\nAnd last year, the proportion of students getting top A-level results reached a record high, with 28.3% of all grades across England, Wales and Northern Ireland marked at A* or A.\nAround 41% of UK 18-year-olds had applied to university by the end of June this year.\nThat is a similar proportion to last year, despite increased scrutiny of the long-term cost of university and a renewed focus on technical education.\nVivienne Stern, chief executive of Universities UK, said she was concerned that \"people talking [university] down\" could \"put off\" potential students from the least-advantaged backgrounds.\nShe urged students to \"make the right decision for you\", adding: \"Don't let politicians make your decision for you.\"\nJo Saxton, chief executive of Ucas, said on Tuesday that she found \"kicking higher education incredibly frustrating\".\n\"It's right that the prime minister and secretary of state [in England] are committed to parity [between academic and technical education] but I still think that there are lots and lots and lots of young people the best place for whom would be in a university,\" she said.\n- How student loans work for tuition fees and living costs \n  - Published1 day ago\n- What is an apprenticeship and how much is the pay? \n  - Published5 hours ago\nTheir comments follow criticism of the student loan repayment system this year - especially Plan 2 loans, which used to be issued in England and are still issued in Wales.\nThey also come after Burnham announced that pupils in England will be able to study technical subjects in addition to core academic learning from Year 10.\nHis predecessor, Sir Keir Starmer, announced that new V-level qualifications would be an additional vocational option for students from 2027.\nMeanwhile, universities continue to struggle with their finances after a long-term freeze in domestic tuition fees and a fall in international student numbers.\nUndergraduate tuition fees in England and Wales are rising for a second year running for students starting university in September, reaching £9,790 a year.\nBut four in ten universities, external in England are still expected to report a deficit for the 2025-26 financial year.\n- What are T-levels and what are the grades worth? \n  - Published8 hours ago\n- What are BTecs and how are they graded? \n  - Published8 hours ago\nMost students getting their grades this year were in Year 7 and Year 8 in 2020 and 2021, during the Covid pandemic.\nBoth years saw spikes in pass rates at GCSE and top grades at A-level, after exams were cancelled and results were based on teachers' assessments, and were followed by a phased effort to bring grades back in line with pre-pandemic levels.\nThis summer England's exams regulator, Ofqual, said it was \"closely monitoring\" the marking of an A-level maths paper which students and parents claimed was significantly more challenging than in previous years.\nRelated topics\n  - Published3 March\n  - Published7 days ago", "translation_ja": "", "vocab": [{"word": "vice-chancellors", "definition": "大学の最高経営責任者。英国では大学の学長を指します。"}, {"word": "vocational", "definition": "職業や実務的な技能に関連する教育・訓練を指す形容詞。実践的な職業教育を意味します。"}, {"word": "parity", "definition": "同等の状態や権利。ここでは学術教育と職業教育が同等に扱われることを意味します。"}, {"word": "deficit", "definition": "赤字や欠損。支出が収入を上回る状態を指します。"}, {"word": "phased", "definition": "段階的な、段階を分けた。時間をかけて徐々に実施されることを意味します。"}, {"word": "scrutiny", "definition": "厳密な検査や詳細な調査。批判的な注視を指します。"}]}, {"title_ja": "英首相、山火事リスクを理由に使い捨てBBQの販売中止を小売業者に促す", "title_en": "UK PM Urges Retailers to Stop Selling Disposable BBQs Amid Wildfire Crisis", "summary_ja": "アンディ・バーナム首相は、極端な高気温と干ばつ条件により山火事のリスクが高まっているため、使い捨てバーベキューの販売を自主的に中止するよう店舗に呼びかけた。大手小売業者は既に2023年の消防士と小売業者団体との協定の下で販売を中止することに同意しており、政府は夏季間の使い捨て製品の販売禁止を検討している。7月には英国とウェールズ全域で過去最高の393件の山火事が発生し、使い捨てBBQが重大な原因として特定されている。", "summary_en": "Prime Minister Andy Burnham has called on shops to voluntarily suspend sales of disposable barbecues due to extreme heat and drought conditions increasing wildfire risks across England and Wales. Major retailers have already agreed to halt sales under a 2023 framework with fire chiefs, and the government is considering a potential ban on single-use grills during summer months. July saw a record 393 wildfires across England and Wales, with disposable BBQs identified as a significant cause.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr59p2nr6dqo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Burnham urges shops not to sell disposable BBQs over wildfire risks\n- Published\nAndy Burnham has urged shops to stop selling disposable barbecues amid increased wildfire risk driven by this summer's droughts.\nThe prime minister said he was urging \"all retailers big and small\" to adhere to voluntary guidance to suspend sales during extreme heat.\nHe added that in the \"longer term\" the government would look at potentially banning the single-use grills during summer months.\nIt comes after a potential ban was discussed at an emergency Cobra meeting on the government's response to record temperatures.\nA number of large retailers and supermarkets have voluntarily stopped selling the devices under a framework, external agreed in 2023 between fire chiefs and the British Retail Consortium (BRC).\nThis says that retailers should suspend sales once an extreme heat event has been declared as imminent, or in response to \"reasonable, evidence based\" requests from local councils.\nEarlier, Burnham told reporters single-use grills had been behind a number of recent blazes and people should not be using them \"at this moment in time\".\n\"We do want people to take the greatest possible care when they are out in the countryside, both in terms of cigarettes, but also those temporary barbecues that we know are causing risk of fires.\"\nAfter the Cobra meeting, Burnham said: \"We would say to retailers do not put disposable barbecues on sale at this moment in time.\"\nNearly three-quarters of England and all of Wales have been officially declared in drought, creating conditions rife for fire to spread.\nThe Met Office has issued a rare amber extreme heat warning for Thursday, with temperatures peaking in the mid-to-high 30s across the Midlands and south-east of England, and a high of 38C possible.\nA Labour MP wrote to large retailers last week in a bid to stop them selling disposable barbecues for the rest of the summer, whilst a number of Lib Dem MPs have also backed restrictions.\nThe National Farmers Union has also called on local councils to issue public space protection orders to restrict their use in public areas.\nAuthorities including Brighton & Hove and Fylde, in Lancashire, are among councils to have used these orders to ban single-use grills in recent years.\nThose who defy such orders can currently be fined up to £100, a limit that is set to rise to £500 in future.\nCouncils intending to issue the orders are required to consult residents beforehand, and gather evidence of an ongoing risk to quality of life in a particular area.\n'Cool spaces'\nThe Cobra meeting was attended by ministers from the Department for Environment, Food and Rural Affairs, Home Office, and Department for Health, as well as the Environment Agency.\nThere has already been one Cobra meeting on heatwaves this year chaired by officials, but this was the first such emergency session chaired by Burnham.\nIn June, the government under previous prime minister Sir Keir Starmer announced that specialist firefighters would be positioned in key locations across England in response to wildfire risks, with forces encouraged to use a government fund to upgrade equipment.\nBurnham had faced calls from the Green Party to chair a Cobra meeting on the heatwaves, with leader Zack Polanksi accusing the prime minister of inaction amid threats to public health and food supplies.\nSpeaking on Wednesday, Polanski welcomed the meeting but said it was \"not enough just to discuss\" the threats from heat.\nHe added that recent temperatures showed the need to offer workers flexible hours to allow them to avoid the hottest part of the day, and for a legally-enforced maximum temperature for workplaces.\nThe party has previously called for more publicly accessible \"cool spaces\" for vulnerable groups and financial support to help households heatproof their homes.\nFire chiefs have said that wildfires are becoming a \"recurring and growing feature of the risks facing our communities\" amid a changing climate.\nCrews responded to 393 wildfires across England and Wales in July, making it the busiest month on record.\nGet in touch\nHow are you coping with the hot weather? Have you had to make adjustments at home or work? Have the heatwaves impacted on an event you have planned?\nRelated topics\n  - Published1 August\n  - Published23 July", "translation_ja": "", "vocab": [{"word": "disposable", "definition": "使い捨ての、使用後に廃棄することを前提とした。この文脈では、再利用できない一時的なバーベキューグリルを指す。"}, {"word": "voluntary", "definition": "自発的な、強制ではなく自らの意思に基づく。法的義務がない中での行動や同意を示す。"}, {"word": "imminent", "definition": "差し迫った、すぐに起こりそうな。危険や事象が非常に近い将来に発生することを表す。"}, {"word": "consortium", "definition": "複数の組織や企業による協力体制または共同事業体。この場合、消防署と小売業者団体の協働を指す。"}, {"word": "defy", "definition": "違反する、命令や規則に逆らう。ここでは公共空間保護命令に従わない行為を意味する。"}, {"word": "heatproof", "definition": "熱に強い、高温の影響から保護するような改修を施す。建物や住宅を高気温に対応させることを指す。"}, {"word": "recurring", "definition": "繰り返し起こる、何度も発生する。継続的またはサイクル的な問題や現象を表す。"}]}, {"title_ja": "ユーロビジョン、戦争中の国でのホスト開催を禁止", "title_en": "Eurovision Bars Countries at War From Hosting Future Contests", "summary_ja": "ユーロビジョンの主催者は、武力紛争に関与している国がコンテストを主催することを防ぐ新しいルールを発表しました。この決定は、イスラエルの最近の成功とガザ戦争をめぐる複数国による2026年ウィーンコンテストのボイコットの後に続いています。EBUはまた、パフォーマーの最低年齢を18歳に引き上げ、ライブボーカルパフォーマンスの要件を強化しました。", "summary_en": "Eurovision organizers announced new rules preventing countries involved in armed conflicts from hosting the competition. The decision follows controversies including Israel's recent success and multiple countries boycotting the 2026 Vienna contest over the Gaza war. The EBU also raised the minimum performer age to 18 and strengthened requirements for live vocal performances.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/eurovision-bars-countries-at-war-from-hosting/a-78341915?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Eurovision bars countries at war from hosting\nAugust 12, 2026\nEurovision Song Contest organizers announced rule changes that would prevent countries involved in an armed conflict from hosting the event.\nIsrael and Ukraine are among the countries the rule could affect, with both having enjoyed recent success in the competition.\nWhat did the Eurovision organizers say?\nEurovision is typically staged by the broadcaster from the country that won the previous edition as part of a co-production involving members of the European Broadcasting Union (EBU).\nUnder the new rules, \"the winning broadcaster will automatically be ineligible to host the Contest if an armed conflict, a sensitive geopolitical situation, or any other situation materially affects the security, safety or stability of their state or immediate region,\" the EBU said.\nThe EBU may commission an independent security assessment if necessary. If the winning broadcaster is deemed unable to stage the contest, another broadcaster will be selected.\nWhy is the Eurovision changing the rules?\nThe EBU did not name any particular country as the reason, but Israel finished second at Eurovision in both 2025 and 2026.\nFive countries — Spain, Ireland, the Netherlands, Slovenia and Iceland — boycotted the 2026 contest in Vienna, saying they could not participate alongside Israel because of the war in Gaza. Israel is currently involved in the war in Iran.\nThe new rule formalizes a challenge Eurovision has faced before.\nUkraine hosted the contest in 2017 despite fighting in the east of the country, but after winning Eurovision in 2022 it was unable to stage the following year's event because of Russia's full-scale invasion.\nLiverpool instead hosted Eurovision 2023 in the United Kingdom on Ukraine's behalf.\nRussia has been excluded from Eurovision since 2022, when the EBU banned it following its full-scale invasion of Ukraine.\nWhat else is changing about the Eurovision?\nUnder the new rules, the EBU is raising the minimum age for performers from 16 to 18 to reduce pressure on young artists.\nLead vocals must also be performed live and cannot be supported by pre-recorded voices.\nThe EBU said the clarification was intended to protect the integrity of performances and ensure audiences hear the lead singer live.\nEurovision director Martin Green said the contest's rules were reviewed each year to keep the competition fair and transparent.\nNext year's contest will be held in Bulgaria following Bulgarian pop singer Dara's victory in Eurovision 2026 in Vienna with \"Bangaranga.\"\nEdited by: Louis Oelofse\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "ineligible", "definition": "適格でない、資格がないという意味。特に競争や公式な地位に関する文脈で使用され、ある条件を満たさないため参加や選出の対象外となることを示します。"}, {"word": "geopolitical", "definition": "地政学的な、国家間の政治的・地理的な関係に関連する意味。国際関係や地域の安定性に影響を与える政治的状況を指します。"}, {"word": "boycott", "definition": "ボイコット、抗議の意思を示すため商品購入やイベント参加を拒否すること。政治的または倫理的な理由で特定の組織や国を支持しないという意思表示です。"}, {"word": "formalize", "definition": "公式化する、正式な規則や手続きとして確立すること。非公式だった慣行や対応を公式なポリシーとして制度化することを意味します。"}, {"word": "integrity", "definition": "誠実さ、完全性、一貫性を意味します。この文脈では、パフォーマンスの本物らしさと信頼性を保つことを指しています。"}, {"word": "clarification", "definition": "明確化、説明または解釈をより明確にするプロセス。曖昧なルールや規則をより具体的で理解しやすくすることです。"}]}, {"title_ja": "ロシア、野党ヤブロコ党を9月選挙から除外", "title_en": "Russia Bars Opposition Yabloko Party from September Elections", "summary_ja": "ロシア最高裁判所は、反戦野党ヤブロコ党を2026年9月18～20日の議会選挙から除外する訴訟を認容した。親クレムリン政党ロディーナは、著作権侵害、過激主義、違法な外国資金調達の疑いでヤブロコを告発した。野党指導者たちは、クレムリンがヤブロコのロシア国民の広範な反戦感情を示す能力を恐れていると考えている。", "summary_en": "Russia's Supreme Court upheld a lawsuit banning the anti-war opposition party Yabloko from parliamentary elections scheduled for September 18-20, 2026. The pro-Kremlin party Rodina accused Yabloko of copyright infringement, extremism, and illegal foreign financing. Opposition leaders believe the Kremlin feared Yabloko's ability to demonstrate widespread anti-war sentiment among Russian voters.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/russia-why-is-the-yabloko-party-barred-from-the-elections/a-78341971?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Russia: Why is the Yabloko party barred from the elections?\nAugust 12, 2026\nOn Monday Russia's supreme court upheld a lawsuit against the anti-war opposition party Yabloko. Its candidates will now be barred from taking part in the parliamentary elections on September 18 to 20.\nThe case against Yabloko was brought by the pro-Kremlin party Rodina, which accused it of infringing copyright with its election campaign materials. Rodina also made the claim that Yabloko had engaged in extremist activities and had received illegal financing from abroad.\nThe verdict was pronounced by presiding judge Vyacheslav Kirillov. This was the same judge who, in April, banned the Russian human rights organization Memorial and designated it an extremist organization. Kirillov also previously dismissed legal complaints against the Russian prison service filed by the prominent opposition politician Alexei Navalny. Navalny spent many years in Russian prisons prior to his death in jail in 2024.\nAt least 500 people gathered in front of the Supreme Court to show their support for Yabloko. They distributed apples and sang songs. The name Yabloko – \"apple\" in English – derives from the initials of the party's three founders, Grigory Yavlinsky, Yury Boldyrev and Vladimir Lukin (YaBL). The apple is now well-known as a symbol of the party.\nAt the end of the nine-hour court session, security services threatened the people gathered outside the courthouse with arrest, also warning young men that they could be taken to an army enlistment office.\n\"You are mistaken if you believe that, with a stroke of a pen, you can write off millions of people who want peace, freedom and a normal future for their country,\" Nikolai Rybakov, the leader of Yabloko, wrote on Telegram that evening.\nHe insisted that the party had not broken any Russian laws, and announced that he would appeal the judgement.\nThe Kremlin 'got scared'\nGrigory Yavlinsky, one of the founders of Yabloko, said those in power were afraid of Yabloko's program, which calls for an election \"for peace, freedom and a life without fear\" – because, he said, \"removing a party with a platform like this from the election, without any real grounds, is the political system exposing itself.\"\nThe lawsuit came at the same time as an appeal by Russian opposition and cultural leaders living abroad for people to support Yabloko.\nThey include the politician Yulia Navalnaya, Alexei Navalny's widow, as well as Lyubov Sobol, Ilya Yashin and Andrei Pivovarov. The writer Dmitry Bykov, human rights activist Oleg Orlov and other prominent people also voiced their support for Yabloko.\nNavalnaya, who now leads the Anti-Corruption Foundation (FBK) her husband set up in 2011, responded to the verdict. The Kremlin was originally going to let Yabloko stand in the elections, she said, but those in power \"got scared\" and had the party blocked.\nNavalnaya wrote on Telegram that the powers-that-be had observed a development they wanted to stop at any cost: People were starting to join forces. This, she wrote, was less about support for Yabloko than the possibility for millions of Russians to express how they really felt about Vladimir Putin and the war in Ukraine.\nAndrei Pivovarov, a political activist who lives in exile in Germany and is a coordinator of the Russian Antiwar Committee, explained to DW that the opposition had not believed supporting Yabloko would bring about swift political change or an end to the war. The aim, he said, had been to make visible the extent of anti-war sentiment in Russia.\n\"There would have been a dozen parties on the ballot who are pro-war, and one that is pro-peace. The war wouldn't end even if Yabloko were to get representatives into the State Duma. But we would have seen that a lot of Russians oppose the war,\" said Pivovarov. This view, he added, would not simply disappear now Yabloko has been barred from standing.\nWhat were the Kremlin's plans for Yabloko?\nThe political scientist Ivan Preobrazhensky speculated in an interview with DW that the banning of Yabloko could be a consequence of a power struggle between different interest groups in the Kremlin. He suggested that the security bloc allied with the federal security service, the FSB, may have wanted Yabloko to act as a counterweight to the New People party. This is regarded as a project of Sergey Kiriyenko, the first deputy chief of staff of the presidential administration.\nAnother version of events is that Kiriyenko himself may have tried to create the impression of political rivalry, and underestimated the potential of anti-war feeling in the country.\nPreobazhensky says the government underestimated the number of people in Russia who oppose the war and are ready to support a political force campaigning for an end to the war in Ukraine. Surveys, he says, indicate that there is substantial demand for such a political alternative. He also believes that the Kremlin initially intended to let Yabloko run in the election but changed its mind ", "translation_ja": "", "vocab": [{"word": "infringing", "definition": "他者の権利や法律を違反する行為を指す。著作権や特許などの知的財産権を侵害する場合に使用される。"}, {"word": "extremist", "definition": "過激な思想や行動を持つ人や団体を指す。政治的・宗教的に極端な立場を取る者を説明する際に用いられる。"}, {"word": "verdict", "definition": "裁判所による判決や評決を意味する。陪審団または裁判官による公式な決定を指す。"}, {"word": "designated", "definition": "特定の名称や地位を与える、指定する、または任命することを意味する。公式に決定や指示を下す行為を表す。"}, {"word": "counterweight", "definition": "別の力や勢力のバランスを取るための対抗勢力を指す。政治的なバランスを保つために機能する存在を表す。"}, {"word": "underestimated", "definition": "ある事柄の規模や重要性を実際より低く評価する。過小評価して誤った判断をすることを意味する。"}]}, {"title_ja": "オフリド合意から25年：北マケドニアの平和は保たれているか", "title_en": "25 Years After Ohrid Agreement: Is North Macedonia's Peace Holding?", "summary_ja": "北マケドニアは2001年のオフリド枠組み合意から25年を迎えた。この合意はマケドニア人とアルバニア人の民族紛争を終わらせ、権力分担メカニズムを確立したが、専門家は真の和解がまだ達成されておらず、最近の政治的変化が脆弱なバランスを脅かしていると警告している。両民族社会は少数民族の権利保護の実施と維持について引き続き対立している。", "summary_en": "North Macedonia marks 25 years since the 2001 Ohrid Framework Agreement ended ethnic conflict between Macedonians and Albanians. While the agreement established power-sharing mechanisms and brought relative stability, analysts warn that genuine reconciliation remains incomplete and recent political shifts threaten the fragile balance. Both ethnic communities continue to dispute the implementation and preservation of minority rights protections.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/25-years-ohrid-agreement-is-n-macedonia-s-peace-holding/a-78340239?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "25 years Ohrid Agreement: Is N. Macedonia's peace holding?\nAugust 12, 2026\nThe guns fell silent in 2001, but North Macedonia is still grappling with the legacy of its ethnic conflict.\nTwenty-five years after the Ohrid Framework Agreement ended the fighting, ethnic Macedonians and Albanians live in peace, yet analysts say genuine reconciliation remains unattained.\nThe six-month conflict that erupted in February 2001 is often described as the final chapter of former Yugoslavia's violent breakup.\nBut unlike the wars in Croatia, Bosnia and Herzegovina and Kosovo, it was contained before it could spiral into a larger tragedy, thanks in large part to a political compromise brokered by NATO, the United States and leading EU countries.\nAgreement enters a new phase\nТwenty-five years later, the political order that emerged from the Ohrid Framework Agreement is entering a new phase.\nWhen the conservative Macedonian VMRO-DPMNE party returned to power two years ago, the Democratic Union for Integration (DUI), the main ethnic Albanian party, went into opposition.\nThis development ended two decades of governing influence for Ali Ahmeti, who transformed himself from leader of the ethnic Albanian National Liberation Army (NLA) during the 2001 conflict into one of the country's most influential political figures.\nAhmeti, who swapped his guerrilla uniform for tailored black suits and white shirts after the Ohrid Agreement, now argues that ethnic relations have deteriorated over the past two years.\n\"Attacks on the official use of the Albanian language, the abolition of equitable and adequate representation, the weakening of mechanisms designed to prevent majoritarian rule and the promotion of a monoethnic concept of the state are serious signals about the direction in which the country is moving,\" he said in a statement marking August 2, North Macedonia's national holiday.\nBalancing ethnic diversity and political stability\nHome to a large ethnic Albanian minority, North Macedonia has spent much of the past quarter-century trying to balance its ethnic diversity within a stable political system.\nAccording to the latest census, Albanians make up over a quarter of North Macedonia's population of 1.8 million.\nFor Bujar Osmani, a senior DUI official and former foreign minister, the key question is no longer how much of the Ohrid Agreement has been implemented, but whether its gains can be preserved.\n\"On the 25th anniversary of the Ohrid Agreement, the question is no longer only what we have implemented since 2001. The question is whether we will allow, within a few years, the dismantling of what has kept North Macedonia stable for two and a half decades,\" he told DW.\n2001: A wound that has not fully healed\nThe legacy of the 2001 conflict runs deep.\nThe fighting claimed the lives of 72 soldiers and police officers, while the number of ethnic Albanian insurgents killed remains disputed, with estimates ranging from about 100 to several hundred. More than 170,000 people were displaced, including 74,000 within the country.\nThe Ohrid Framework Agreement that ended the conflict reshaped North Macedonia's political system, introducing power-sharing mechanisms designed to give minority communities a greater voice in decision-making.\nLaws affecting sensitive issues such as language, education and national symbols require support not only from a parliamentary majority but also from representatives of minority groups.\nWhile largely in line with European standards on minority rights, the arrangement did not end disputes over equality and representation.\n\"The agreement achieved a large part of its historic mission, but its essence cannot be declared complete,\" Osmani said. \"Ohrid is not an administrative checklist that can be fulfilled once and then archived. It is a system of balance that must be respected continuously.\"\nMacedonian majority also voices grievances\nAt the heart of the debate are differing views on Ohrid's legacy.\nWhile many ethnic Macedonians argue that affirmative representation policies have created unfair advantages for Albanians, Albanian politicians say the real concern is the gradual erosion of rights secured under the agreement.\n\"There is discrimination that frustrates many in the Macedonian community because Albanians are often given priority in recruitment to meet representation quotas in the public sector,\" said Stojance Angelov, a police general during the 2001 conflict.\nAngelov said such practices put ethnic affiliation ahead of qualifications.\nOsmani rejects that narrative, arguing that recent government policies have weakened protections for Albanians that were introduced after the conflict.\n\"At first, all of this was concealed behind political propaganda, technical explanations and claims that it was merely modernization of the system. Today, as that noise gradually fades, it is becoming much clearer what is actually being called into question,\" he said.\nDefensive nationalism on the rise\nDomestic and international o", "translation_ja": "", "vocab": [{"word": "Framework Agreement", "definition": "国家間または利害関係者間の基本的な枠組みを定める協定。本記事では、マケドニアの民族紛争を終わらせるために設定された基本的な政治的合意を指す。"}, {"word": "power-sharing", "definition": "異なる民族グループや政治勢力が政府内で権力を分配する制度。少数派の声を政治決定に反映させるために設計されている。"}, {"word": "affirmative representation", "definition": "少数派や過去に差別を受けたグループが政治や雇用で平等な機会を得るための積極的な措置。"}, {"word": "erosion", "definition": "権利や合意などが時間とともに徐々に削弱または失われることを指す。"}, {"word": "reconciliation", "definition": "過去の紛争や対立を乗り越え、異なるグループ間で信頼と平和を回復するプロセス。"}, {"word": "minority rights", "definition": "少数派の集団が享受する法的保護と権利。言語、教育、政治参加などを含む。"}]}, {"title_ja": "トランプ大統領、ホワイトハウス報道官カロリン・リービット氏の辞任を発表", "title_en": "Trump Announces White House Press Secretary Karoline Leavitt Stepping Down", "summary_ja": "ホワイトハウス報道官のカロリン・リービット氏が月末での退職を発表した。トランプ大統領によると、リービット氏は同月末をもってその職を離れる予定である。後任者はまだ発表されていない。", "summary_en": "White House Press Secretary Karoline Leavitt is stepping down from her role, with her departure effective at the end of the month, according to an announcement by President Trump. Leavitt has served as the chief spokesperson for the Trump administration during her tenure. Her replacement has not yet been announced.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-announces-white-house-press-secretary-karoline-leavitt/story?id=135590424", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、世界中で発生する速報ニュースと重大なライブイベントの継続的な報道を提供します。プラットフォームは、発展途上の話題をリアルタイムで報道します。ABCニュースからの最新ニュース更新で情報を得てください。", "summary_en": "ABC News Live provides continuous coverage of breaking news and major live events around the world. The platform delivers up-to-the-minute reporting on developing stories as they unfold. Stay informed with real-time news updates from ABC News.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2026年8月12日の皆既日食：写真と見える場所ガイド", "title_en": "2026 Total Solar Eclipse on August 12: Photos and Visibility Guide", "summary_ja": "2026年8月12日に皆既日食が世界中の特定地域で見られます。ABCニュースは、イベントの素晴らしい写真と観測者のための安全な視聴ガイドラインを含む包括的なカバレッジを提供しています。", "summary_en": "A total solar eclipse will occur on August 12, 2026, visible from specific regions around the globe. ABC News provides comprehensive coverage including stunning photos from the event and safe viewing guidelines for observers.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Living/august-2026-total-solar-eclipse-us/story?id=134723486", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジンバブエのカリバ湖で満員フェリーが転覆、少なくとも44人が死亡", "title_en": "At least 44 dead after overcrowded ferry capsizes on Lake Kariba in Zimbabwe", "summary_ja": "ジンバブエのカリバ湖でフェリーが転覆し、少なくとも44人が死亡した。定員90人のフェリーが大人114人に加え乗員と複数の子どもを乗せていた。カリバ湖は世界最大の人造湖であり、過去にも同様の事故が繰り返されている。", "summary_en": "An overcrowded ferry carrying 114 adult passengers plus crew and children capsized on Lake Kariba in Zimbabwe, resulting in at least 44 deaths. The boat exceeded its 90-person capacity and began taking on water about 30 minutes after departure from Kariba town. This incident adds to a troubling history of boat accidents on the world's largest human-made lake.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/12/zimbabwe-lake-kariba-ferry-capsize", "state_media": false, "category": "社会", "full_text": "At least 44 people have died after an overcrowded ferry capsized on Lake Kariba in Zimbabwe, police said.\nThe boat had a capacity of 90 people, but was carrying 114 adult passengers, five crew members and an unknown number of children, Zimbabwe’s civil protection unit (CPU) said earlier on Wednesday, citing ticket sales.\nA crew member told the national broadcaster ZBC that there were 153 people onboard when the ferry overturned on Tuesday after it hit large waves. A passenger told ZBC that the boat began taking on water about 30 minutes after it left the lakeshore town of Kariba, heading for islands and fishing camps.\nA specialised underwater team was flown to the area, the CPU said, as search and rescue continued on Wednesday. At the time, the CPU said the death toll was 15, with 27 known to be missing.\nZimbabwe’s police updated the death toll on Wednesday afternoon in posts on X twice in the space of 32 minutes. In the first post, it said the death toll was 38, adding: “The bodies have been retrieved from the lake.” Then it said that 44 people were now known to have died.\nA video shared by ZBC on Tuesday showed several people appearing to be sitting on the upturned ferry, while at least four speedboats came to their aid and a helicopter circled overhead.\nMaxwell Kanhema Page, who describes himself as a media practitioner and originally posted the video shared by ZBC, reshared a video on his Facebook page filmed from the shore, in which he had noted that the lake was “angry”.\nHe said: “A few moments later I get over 200 calls about [the ferry] sinking. A sad day indeed.”\nLake Kariba is the world’s largest human-made lake by volume, stretching about 150 miles along Zimbabwe’s northern border with Zambia. It was created in the 1950s during British colonial rule, when the Zambezi River was dammed, displacing about 57,000 people. The Kariba dam supplies at least a third of both countries’ electricity.\nIt is not uncommon for boats to overturn on the lake. In 2014, 26 people, 24 of them children, drowned in Zambia’s part of the lake, when the boat meant to transport them to independence day celebrations capsized.\nOn the Zimbabwean side, five drowned in a 2021 incident and three were feared dead in an October 2023 capsizing. The month before, a police boat overturned although no one died.\nAgence France-Presse contributed to this report.", "translation_ja": "", "vocab": [{"word": "capsized", "definition": "転覆する、ひっくり返る。特に船舶が波などによってバランスを失い、横転または沈没することを意味する。"}, {"word": "overcrowded", "definition": "過度に混雑した、定員以上に詰め込まれた。乗り物や施設などが許容量を超えて人員を収容している状態。"}, {"word": "displacing", "definition": "立ち退かせる、移住を余儀なくさせる。ダム建設などによって、その土地に住む人々が別の場所へ移動することを強制されること。"}, {"word": "undertaking", "definition": "大規模な事業、プロジェクト。特に困難で重要な計画や業務のこと。"}, {"word": "toll", "definition": "死傷者の数、被害の規模。災害や事件による人命喪失の統計的な数字。"}, {"word": "humanitarian", "definition": "人道的な、人類全体の福祉に関する。人命救助や災害救援など、人道的価値に基づく行為を指す。"}]}, {"title_ja": "アフリカ軍団芋虫との戦いに天然菌が希望をもたらす", "title_en": "Natural fungus offers hope in battle against African armyworm plague", "summary_ja": "南アフリカの科学者が、アフリカ地域で最も破壊的な農業害虫であるアフリカ軍団芋虫を殺死する天然菌を発見しました。この画期的な発見は、作物の破壊と家畜の病気に直面している数百万の農民に救済をもたらす可能性を提供していますが、この菌の治療が商業的に展開される前にさらなる開発が必要です。", "summary_en": "A South African scientist discovered a naturally occurring fungus that kills the African armyworm, one of the region's most destructive agricultural pests. The breakthrough offers potential relief for millions of farmers facing crop destruction and livestock illness, though further development is needed before the fungal treatment can be commercially deployed.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/aug/12/african-armyworm-crop-pest-discovery-fungus-science-hope-farmers", "state_media": false, "category": "社会", "full_text": "Hearing about fields full of dead caterpillars enveloped in a mysterious white substance intrigued the South African scientist Letodi Luki Mathulwe. Something was killing off the African armyworm – one of the most devastating pests for farmers in east and southern Africa.\nThe white substance was a naturally occurring fungus and it was wiping out the caterpillar, which gained its name from its march-like advance through fields of crops.\nAn outbreak of African armyworm (Spodoptera exempta) in 2025 had started in northern South Africa and by April had reached the eastern province of KwaZulu-Natal, where Mathulwe was working for the agriculture department. Every day she was getting panicked calls from local farmers who were finding the caterpillars in their fields.\nMathulwe went out to the KwaZulu-Natal countryside to see for herself and it was there, in the fields of Kikuyu grass – crucial grazing for livestock – that she realised she had made an important discovery.\n“Something was killing the insects naturally. I was intrigued because in other areas the insects were alive and destroying the grass but as soon as they come here, there’s something that is killing them,” she said.\nAs an entomologist who had studied the use of fungi to kill insect pests, Mathulwe immediately gathered samples of the dead armyworms and the fungus to test at her laboratory in Pietermaritzburg.\nHer team’s results, now presented in a peer-reviewed research paper, showed she was right in her hunch that the fungus could be used in the fight against the armyworms.\nIt was a major breakthrough, said Mathulwe, because while there are chemical treatments for dealing with the caterpillars in the early stages of life, nothing has proven effective against mature populations.\nThe African armyworm not only eats staple crops such as maize and sorghum but also releases a chemical compound in grass that can make cattle sick.\nThe impact can be brutal for farmers. One outbreak in 2017 was estimated to have destroyed up to 40% of Zambia’s maize production.\nIt also sends food prices soaring and puts strain on government budgets. Last year’s outbreak caused problems for farmers in countries such as Zimbabwe, where inflation had hit 736% in 2024, and Malawi, where it reached 35% in 2024.\nThe African armyworm causes the most damage in its caterpillar stage but is also hard to control when it develops into a moth, allowing populations to migrate.\n“When we discovered this fungus, we realised we could develop this into a product that can be eventually used when the next outbreak happens,” said Mathulwe.\n“I think it will be a great thing – it will eventually eliminate the fear for farmers that the insect creates because once it’s present within grazing fields, farmers start to panic.”\nMathulwe said there was still more work and more testing to do in developing a product for use by farmers.\n“I think it will create a lot of hope for farmers, because it will mean that their animals won’t get sick if the farmer is able to control the presence of the insects within their field,” she said.", "translation_ja": "", "vocab": [{"word": "entomologist", "definition": "昆虫を研究する科学者。特に害虫や昆虫の生態・分類を専門とする学者のこと。"}, {"word": "devastating", "definition": "甚大な被害や損害をもたらす、破壊的な。農業では収穫量の大幅な減少をもたらすことを意味する。"}, {"word": "breakthrough", "definition": "大きな進展や重大な発見。科学研究や技術開発での従来の困難を乗り越えた成功を指す。"}, {"word": "outbreak", "definition": "病気や害虫などが急速に発生・蔓延する現象。特に予期しない急激な増加を示す。"}, {"word": "strain", "definition": "圧力や負担。経済的・社会的な困難な状況を指し、政府予算や資源への圧力を意味する。"}]}, {"title_ja": "スペイン、移民問題でイタリアへの報復措置として一時的な国境検査を導入", "title_en": "Spain Introduces Reciprocal Border Checks on Italy Over Migration Dispute", "summary_ja": "スペインはモロッコからセウタへの大量移民問題を受けてイタリアが実施した国境検査に対抗するため、イタリアからの訪問者に対する一時的な国境検査を土曜日から開始すると発表した。この検査は9月7日まで続き、不規則な移民政策をめぐるEU同盟国間の緊張が高まっている。イタリアの極右政府は、セキュリティリスクと将来の移民波に関する保証がない限り、検査を解除することを拒否している。", "summary_en": "Spain has announced temporary border checks on visitors from Italy starting Saturday, retaliating against Italy's similar measures imposed after a mass migration surge from Morocco into Ceuta. The checks will last until September 7 amid escalating tensions between the EU allies over irregular immigration policy. Italy's far-right government has refused to lift its controls without assurances about security risks and future migration waves.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/07/spain-to-introduce-temporary-border-checks-on-visitors-from-italy", "state_media": false, "category": "社会", "full_text": "Spain has announced it will introduce temporary border checks on visitors from Italy in response to Rome imposing similar measures after a mass rush of people from Morocco into Ceuta.\nThe checks, which come “amid the persistent irregular migration pressure” facing Italy, will start at midnight on Saturday and last until 7 September, Spain’s interior ministry said in a statement.\nHours earlier, Spain threatened Italy with countermeasures if it did not swiftly lift its own border checks, drawing a rebuff from Rome.\nThe rare spat between the EU and Nato allies came after tens of thousands of people crossed from Morocco to Spain’s north African territory on 30-31 July in an unprecedented, deadly rush.\nThe scenes infuriated EU members that back a hard line on irregular immigration, including Italy, which imposed border checks on people arriving from Spain for one month.\nThe Spanish government criticised the measure on Friday as “unfair, contrary to the EU’s interests and discriminatory for the Spanish population”.\nForeign minister José Manuel Albares described it as “a torpedo fired at the hull of European unity”.\n“We urge the government of Italy to rectify, put an end to the checks and treat Spaniards like other European citizens,” he added.\nHe threatened “proportional measures” in response by Sunday if Italy failed to comply.\nWithin hours, the government of Italy’s far-right prime minister, Giorgia Meloni, said it “had no intention of revising the decision” before 15 August, when it said Spanish authorities “expected a new wave of migration” to hit Ceuta.\nMeloni’s office said in a statement: “Italy does not accept ultimatums or impositions from abroad regarding national security and border control.\n“Only when there is certainty that there are no security or terrorism risks to Italy, that no new wave is occurring, and that no irregular migrants are heading toward European territory, will the decision be reconsidered.”\nSpain’s interior ministry announced the reciprocal measures within hours.\nSpanish police have been monitoring online rumours and social media about possible fresh arrivals in Ceuta in mid-August, according to local media. But authorities have not expressly said they expect a repeat of last week’s rush.\nBorder authorities would in the meantime “do their utmost to ensure maximum ease of movement for Spanish and European citizens” who are not affected by border checks, the Italian statement added.\nItaly, which does not share a land border with Spain, introduced border controls at maritime and air entry points for third-country nationals arriving from Spain.\nThe move, announced on 31 July, was an “extraordinary measure” intended to “safeguard national security and prevent possible repercussions for our nation”, Meloni said at the time.\nShe was among several EU leaders who called for Spain to be suspended from the visa-free Schengen travel zone after the Ceuta incident, despite such a move being legally impossible.\nItaly’s coalition government has sought to stop the tens of thousands of people who land in small boats on the country’s shores each year.\nThe Spanish government warned against “creating rifts and sterile conflicts driven by internal electoral motives” and said “we trust that pro-European sentiment, common sense and good faith prevail”.\nOf the 72,000 people who entered Ceuta, 70,000 have returned to Morocco, according to official Spanish figures.\nSpanish authorities said 80 people died in the crossings.\nMoroccan rights groups, however, estimate the figure to be higher. The Moroccan Association for Human Rights and the European Coordination for Human Rights in Morocco on Friday said at least 141 deaths were recorded and that the toll was likely to rise.\nMorocco’s interior ministry has said 11 people died on its side of the border, all but one by drowning.\nThose who remain in Ceuta – including hundreds of unaccompanied children – face dire living conditions with little access to food, water and shelter.", "translation_ja": "", "vocab": [{"word": "reciprocal", "definition": "相互的な、互いに対等な報復や対応を意味する。一方が行動を起こしたことに対して、相手方も同等の対抗措置を取ることを示す。"}, {"word": "unprecedented", "definition": "これまで例のない、前代未聞の出来事や状況を表す。歴史的に見ても類を見ない規模や性質を持つことを意味する。"}, {"word": "proportional", "definition": "相応の、均衡の取れた、という意味。ある行為に対して適切でバランスの取れた対応や規模を指す。"}, {"word": "extraordinary measure", "definition": "通常の手段では対応できない緊急事態に対して取られる、異例の措置や対策を意味する複合語。"}, {"word": "sterile", "definition": "文字通りには不毛な、という意味だが、比喩的には生産性のない、実のない、という意味で使われる。"}, {"word": "safeguard", "definition": "保護する、守る、という意味の動詞。権利や利益などを確保・維持するための対策や防御措置を指す。"}]}, {"title_ja": "モロッコ、セウタへの新たな越境ラッシュ防止に向けた国境警備強化を発表", "title_en": "Morocco Increases Border Security to Prevent New Ceuta Crossing Surge", "summary_ja": "モロッコ内務省は、8月15日の大量不正越境を呼びかけるソーシャルメディアの虚偽キャンペーンを受けて、スペイン領飛び地セウタとメリリャとの国境沿いの警備を強化しました。当局は不正移民を助長する投稿の拡散者に対して法的措置を講じ、容疑者の身柄を調査のために召喚しています。これは7月の危機の後の措置で、当時は約7万2千人がセウタに不正越境し、多数の死者が出ました。", "summary_en": "Morocco's Interior Ministry has heightened security along its borders with Spanish enclaves Ceuta and Melilla following a social media disinformation campaign calling for mass illegal crossings on August 15. Authorities are taking legal action against those spreading posts encouraging irregular migration, and have summoned suspects for investigation. This follows a July crisis when approximately 72,000 people crossed into Ceuta irregularly, resulting in dozens of deaths.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/12/morocco-says-working-to-prevent-potential-new-ceuta-crossings-surge?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Morocco says working to prevent potential new Ceuta crossings surge\nMorocco Interior Ministry says it has increased security along its borders with the Spanish exclaves Ceuta and Melilla.\nMoroccan authorities say they are working to prevent more people from crossing to Spanish-administered Ceuta as a new disinformation campaign on social media called for mass attempts to enter.\nMorocco’s Ministry of Interior said on Wednesday that it has increased security along its borders with the Spanish exclaves Ceuta and Melilla.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Migrant children go days without food in Ceuta amid asylum crisis\n- list 2 of 3Ceuta mayor calls for migrant detention amid mass influx crisis\n- list 3 of 3Mediterranean smuggling network ‘dismantled’ in Spain-led raid, 78 arrested\nAuthorities also said legal proceedings would be taken against those spreading online posts that encourage irregular migration. The surge in late July had been triggered by a social media campaign calling for mass crossings.\nOnline posts have been circulating throughout the past week. This time, they claim that the border crossing between the Moroccan town of Fnideq and Ceuta would be open on August 15, a public holiday in Spain.\nThe Moroccan ministry said it “detected over the last days the circulation of publications and anonymous messages on social media inciting the organisation of collective, illegal crossing attempts” towards Ceuta.\nAdditionally, Moroccan Interior Ministry spokesman Rachid El Khalfi said that “all the necessary measures were taken to counter all attempts at illegal passage and intercept every person seeking to participate.”\nA group of people accused of being involved has been summoned for investigation, El Khalfi added in remarks carried by the state news agency MAP.\nIn late July, approximately 72,000 people from Morocco crossed into Ceuta irregularly, most of them arriving via the sea over a few days.\nOn August 7, Morocco sentenced seven Moroccan taxi drivers to up to six months in prison and fined each $1,070 for driving people to the border.\nThe national taxi union condemned the sentences as harsh and unexpected, noting in a statement that “no official decision was issued imposing restrictions on passenger transport.”\nThe vast majority of those who crossed have since been returned to Morocco by local and Spanish forces. However, according to local authorities in Ceuta, about 2,000 people remain in the territory on the North African coast. Approximately 1,000 of them are minors who cannot be deported under Spanish law.\nThe Moroccan Interior Ministry has urged Spanish authorities to speed up the return of the children.\nMoroccan authorities recovered the bodies of 11 dead people in the wake of the crisis, while Spain said at least 80 people died. The Moroccan Association for Human Rights, a nongovernmental group, estimated the death toll to be at least 141.", "translation_ja": "", "vocab": [{"word": "disinformation", "definition": "意図的に広められた誤った情報や虚偽。特にソーシャルメディア上で大衆を誤導するために使用される。"}, {"word": "irregular migration", "definition": "法的な移民手続きを通さずに国境を越えること。密入国や不正な越境行為を指す。"}, {"word": "intercept", "definition": "進行中のものを途中で止めたり捕捉したりすること。この場合、違法な越境者を止めることを意味する。"}, {"word": "exclave", "definition": "母国から離れて飛び地として存在する領土。セウタとメリリャはスペイン領だがモロッコ領土に囲まれている。"}, {"word": "surge", "definition": "急激な増加や高まり。ここでは短期間での不正越境の大量発生を指す。"}, {"word": "summoned", "definition": "公式に出頭するよう命じられること。調査や聴取のため当局に呼び出されることを意味する。"}]}, {"title_ja": "ガザでイスラエル軍が11歳の少年を銃撃", "title_en": "11-year-old boy shot by Israeli forces in Gaza", "summary_ja": "ガザのハンユニスで、イスラエル軍が11歳の少年の頭と脚に銃弾を浴びせたと、少年の父親が述べています。ガザ政府メディア局は、10月の停戦以来のイスラエル軍作戦により、パレスチナ人少なくとも1,259人が殺害され、4,146人が負傷したと報告しています。", "summary_en": "An 11-year-old boy was shot in the head and leg by Israeli forces in Khan Younis, Gaza, according to his father. Gaza's Government Media Office reports that Israeli military operations since October's ceasefire have resulted in at least 1,259 Palestinian deaths and 4,146 injuries.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/12/11-year-old-boy-shot-by-israeli-forces-in-gaza?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "11-year-old boy shot by Israeli forces in Gaza\nNewsFeed\n11-year-old boy shot by Israeli forces in Gaza\nThe father of an 11-year-old boy says Israeli forces shot his son in the head and leg in Khan Younis. Gaza’s Government Media Office says Israeli attacks since last October’s ceasefire have killed at least 1,259 Palestinians and injured 4,146.\nPublished On 12 Aug 2026", "translation_ja": "", "vocab": [{"word": "ceasefire", "definition": "戦闘や敵対行為の一時的な停止のこと。通常、紛争地域で合意された休戦期間を指します。"}, {"word": "casualties", "definition": "戦争や事故などで死亡または負傷した人々のこと。軍事・紛争関連の報道でよく使用される用語です。"}, {"word": "Government Media Office", "definition": "政府公式の情報発信機関のこと。公式な統計やステートメントを発表する政府機関を指します。"}, {"word": "military operations", "definition": "軍隊による作戦行動のこと。特定の戦略的目的のために実行される軍事的活動全般を意味します。"}]}, {"title_ja": "ドローン攻撃がリビアのエネルギー危機を深刻化", "title_en": "Drone Attacks on Energy Infrastructure Deepen Libya's Energy Crisis", "summary_ja": "石油と電力インフラを標的とした繰り返されるドローン攻撃により、リビアのエネルギー危機が深刻化している。攻撃は燃料供給を混乱させ、戦略的に重要なアズ・ザウィーヤ市の支配をめぐってライバル勢力が競争する中で停電を悪化させている。エスカレートする紛争はリビアの重要なエネルギーサービス維持能力を脅かしている。", "summary_en": "Repeated drone strikes targeting oil and power infrastructure in Libya are intensifying the country's energy crisis. The attacks are disrupting fuel supplies and exacerbating power outages as rival groups compete for control of the strategic city of Az Zawiya. The escalating conflict threatens Libya's ability to maintain essential energy services.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/12/drone-attacks-on-energy-infrastructure-deepen-libyas-energy-crisis?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Drone attacks on energy infrastructure deepen Libya's energy crisis\nNewsFeed\nDrone attacks on energy infrastructure deepen Libya’s energy crisis\nRepeated drone strikes on oil and power infrastructure are deepening Libya’s energy crisis. Al Jazeera’s Malik Traina says attacks are threatening fuel supplies and worsening power cuts as rival groups compete for control of the strategically located city of Az Zawiya.\nPublished On 12 Aug 2026", "translation_ja": "", "vocab": [{"word": "infrastructure", "definition": "社会や産業の基盤となる施設や設備。電力網、道路、港湾など、国家や地域の機能に不可欠な構造的基盤を指す。"}, {"word": "deepen", "definition": "問題や危機などを深刻化させる、悪化させる。既存の困難な状況をさらに悪くする意味で使用される。"}, {"word": "strategically located", "definition": "地理的または戦術的に重要な位置にある。軍事的、経済的、政治的観点から有利な場所を示す。"}, {"word": "exacerbate", "definition": "問題や状況を悪化させる、より深刻にする。すでに困難な状況をさらに悪くするという意味の正式な表現。"}, {"word": "rival groups", "definition": "競争関係にある複数の集団。同じ目標や権力を求めて対立する勢力や組織を指す。"}]}, {"title_ja": "インドと南部アフリカ関税同盟が貿易協定交渉を再開", "title_en": "India and Southern African Customs Union Revive Trade Pact Talks", "summary_ja": "インドと5ヶ国で構成する南部アフリカ関税同盟（SACU）は優遇貿易協定に関する交渉の基本方針に署名し、2002年から2010年に停止していた交渉を再開しました。インドは自動車、医薬品、工業機械などの主要輸出品の関税引き下げを求めており、同時にプラチナやマンガンなどの重要鉱物への安定的なアクセスを目指しています。この協定はインドとアフリカ地域ブロック間の初の主要な貿易協定となり、両者に優遇市場アクセスの利益をもたらす可能性があります。", "summary_en": "India and the five-member Southern African Customs Union (SACU) signed terms of reference to begin negotiations on a preferential trade agreement, marking the revival of talks that stalled between 2002 and 2010. India seeks lower tariffs on key exports including automobiles, pharmaceuticals, and industrial machinery, while also aiming to secure reliable access to critical minerals like platinum and manganese. The agreement could become India's first major trade deal with an African regional bloc, benefiting both sides with preferential market access.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/business/india-southern-african-customs-bloc-revive-trade-pact-talks/article71338194.ece", "state_media": false, "category": "経済", "full_text": "India and the five-member Southern African Customs Union signed terms of reference on Wednesday (August 12, 2026) to start talks on a preferential trade agreement, as New Delhi seeks lower tariffs on exports including cars, pharmaceuticals and industrial machinery.\nThe move revives talks between India and SACU, comprising South Africa, Botswana, Namibia, Lesotho and Eswatini, after five rounds of negotiations between 2002 and 2010 ended without a deal.\nThe pact could become India’s first major trade agreement with an African regional bloc, giving Indian companies preferential access to a market of about 65 million people while helping SACU members expand exports to the world’s fastest-growing major economy.\nThe terms of reference set the scope, objectives and procedures for the negotiations. Unlike a comprehensive free trade agreement, a preferential trade pact typically cuts duties on an agreed list of products and is less likely to cover services, investment or intellectual property.\nThe talks come as South Africa considers raising duties on automobiles from India and China to 50% from 25%, threatening a key Indian export.\nThe terms will guide negotiators towards a “balanced, mutually beneficial and development-oriented agreement,” Ndiitah Nghipondoka Robiati, executive director at Namibia’s Ministry of International Relations and Trade, said after signing the agreement with Yashvir Singh, an additional secretary at India’s trade ministry.\nIndia’s Trade Minister Piyush Goyal said he was confident SACU countries and India would “benefit immensely” from a fair, equitable and balanced agreement that he hoped to finalise in the coming months.\nIndia is expected to seek duty concessions for automobiles and auto parts, pharmaceuticals, machinery, electrical equipment, chemicals and textiles, trade officials and industry representatives said.\nAutomobiles and auto parts were India’s second-largest export category to SACU after petroleum products, with shipments worth $1.7 billion in the fiscal year ended March 2026. India’s exports to SACU totalled $7.5 billion in 2025/26, while imports stood at $9.2 billion. South Africa accounted for most of the trade, with Indian exports of $7 billion and imports of $8.5 billion.\nNew Delhi is also seeking more reliable access to SACU supplies of critical minerals, including platinum-group metals, manganese and copper, which are important for manufacturing, batteries and clean energy technologies.\nPublished - August 12, 2026 11:18 pm IST", "translation_ja": "", "vocab": [{"word": "preferential trade agreement", "definition": "特定の国や地域間で関税を削減し、優遇的な条件を与える貿易協定のこと。自由貿易協定よりも限定的な範囲で実施されることが多い。"}, {"word": "tariffs", "definition": "輸入品や輸出品に課せられる税金のこと。国際貿易において商品の価格競争力に大きな影響を与える。"}, {"word": "duty concessions", "definition": "関税の軽減または免除のこと。貿易交渉において一国がもう一国に与える譲歩を意味する。"}, {"word": "customs union", "definition": "加盟国間で関税を撤廃し、域外国に対して統一した関税率を適用する国際機構のこと。"}, {"word": "critical minerals", "definition": "電池や再生可能エネルギー技術など重要な産業に不可欠な鉱物資源のこと。供給が限定されることが多い。"}, {"word": "platinum-group metals", "definition": "プラチナ、パラジウムなどの希少金属の総称。触媒や電子機器などの製造に使用される。"}]}, {"title_ja": "米国ヘリコプター、イラン港湾封鎖を突破しようとした船舶に発砲", "title_en": "U.S. Helicopter Fires on Ship Breaking Iran Ports Blockade", "summary_ja": "2026年8月11日、米海軍ヘリコプターがイラン港の米国による封鎖を突破しようとしたパナマ船籍の貨物船にミサイルを発射し、警告を無視した乗員のエンジンルームを破壊した。7月14日の封鎖再開以来、強制停止された船舶は3隻目で、中央軍は55隻のリダイレクトと2隻の乗船を報告している。イランは、ホルムズ海峡を再開する条件として米国による封鎖の終了を要求している。", "summary_en": "A U.S. Navy helicopter fired missiles at a Panama-flagged cargo ship attempting to breach the American blockade of Iranian ports on August 11, 2026, disabling its engine room after the crew ignored warnings. This marks the third vessel forcibly halted since the blockade was reinstated on July 14, with CENTCOM reporting 55 redirected ships and two boardings. Iran has demanded the U.S. end the blockade as a condition to reopen the Strait of Hormuz, a critical global oil and gas shipping route.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-helicopter-fired-on-ship-that-tried-to-break-iran-ports-blockade/article71338058.ece", "state_media": false, "category": "政治", "full_text": "A U.S. helicopter fired missiles on Tuesday (August 11, 2026) into the engine room of a Panama-flagged cargo ship that attempted to break the American blockade of Iran's ports, the United States military said.\nThe U.S. Navy MH-60 helicopter fired on and disabled the M/V Vela Nova \"after the ship's civilian crew ignored repeated warnings from American forces,\" U.S. Central Command (CENTCOM) said on X, adding that the vessel \"is no longer transiting to Iran in violation of the U.S. blockade.\"\nIt was the third time the United States, in a months-long war against Iran, has forcibly halted a vessel since reinstating the ports blockade on July 14.\nCENTCOM said it has redirected 55 ships that tried to run the blockade and boarded two others as of Tuesday (August 11).\nU.S. forces previously blockaded Iranian ports from April 13 to June 18, during which they disabled nine ships and redirected more than 140, according to CENTCOM.\nIran has demanded that the United States end the ports blockade as part of its conditions to reopen the Strait of Hormuz, a key conduit for oil and gas shipments before the war that has seen traffic plummet due to Tehran's attacks on ships in the area.\nU.S. President Donald Trump repeated his frequent claim on Tuesday (August 11) that the United States has taken over the waterway.\n\"We have total control over the Hormuz Strait right now. They don't have control. We have total control. We own it,\" Mr. Trump told reporters.\nPublished - August 12, 2026 10:54 pm IST", "translation_ja": "", "vocab": [{"word": "blockade", "definition": "港湾や地域への出入りを軍事力で遮断すること。通常、戦争や国際紛争時に経済的・軍事的圧力をかけるために使用される。"}, {"word": "reinstate", "definition": "一度中止または廃止されたものを再び開始または復活させること。前の状態に戻すための措置。"}, {"word": "conduit", "definition": "物資やエネルギー、通信などが流通する経路や通路。商業や戦略的に重要な流通ルートを指す。"}, {"word": "plummet", "definition": "急激に低下または減少すること。特に数値や統計が劇的に落ち込む場合に使用される。"}, {"word": "transgression", "definition": "法律や規則、国際秩序などの違反行為。ここでは『violation』の同義語で、封鎖規定への違反を示す。"}, {"word": "forcibly", "definition": "強制力を伴って、物理的な力や強い強制力で何かを行うこと。意に反して強引に実行される。"}]}, {"title_ja": "アイスランドとスペインで27年ぶりのヨーロッパ皆既日食を観測、数百万人が集結", "title_en": "Millions Gather in Iceland and Spain for Europe's First Total Solar Eclipse in 27 Years", "summary_ja": "2026年8月12日、アイスランドと北スペインに数百万人が集まり、ヨーロッパ27年ぶりの皆既日食を観測した。スペイン当局は最大600万人の来訪者に対応するため2万5千人の警察官と約100機の航空機を配備し、極度の高温による山火事の防止に努めた。この稀な天文現象には日食追跡者や大気研究を行う科学者も引き寄せられ、アイスランドは悪天候にもかかわらず最大8万人の来訪者を予想している。", "summary_en": "Millions of people flocked to Iceland and northern Spain on August 12, 2026, to witness Europe's first total solar eclipse in 27 years. Spanish authorities deployed 25,000 police officers and nearly 100 aircraft to manage up to 6 million visitors and prevent wildfires amid extreme heat conditions. The rare astronomical event also attracted eclipse chasers and scientists conducting atmospheric research, with Iceland expecting up to 80,000 visitors despite overcast weather.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/millions-of-people-in-iceland-and-spain-set-for-event-of-the-century-eclipse/article71336848.ece", "state_media": false, "category": "社会", "full_text": "Millions of people gathered in Iceland and northern Spain to witness Europe’s first total solar eclipse in 27 years on Wednesday (August 12, 2026), with Spanish officials warning people to avoid areas where a heatwave has raised the risk of wildfires.\nAuthorities were expecting up to 6 million visitors in mostly rural areas within the eclipse’s path across the north of Spain and the Balearic Islands, said Juan Cruz, Spain’s Secretary of State for Science.\n“I hope that tonight will see the emerge
