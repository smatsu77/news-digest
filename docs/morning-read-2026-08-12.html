e United States’ European allies to spend more on defense, promoted peace talks between Russia and Ukraine, and pursued a cautious détente with China that has dialed down tensions over Taiwan.\nEighteen months later, however, the United States is bogged down in a new war in the Middle East. Although the U.S. military has enjoyed tactical successes, Washington has not achieved any kind of meaningful strategic victory; in certain respects, Iran exerts more power now than it did in February. Nonetheless, Trump has shied away from making diplomatic compromises. Just like his nemesis, U.S. President Barack Obama, Trump promised Americans that he would extract the country from pointless “forever wars” in the Middle East and then proved unable to do so. But the fact that the United States again became mired in a Middle East conflict is even more surprising today, because over the past two decades, the American public as well as many U.S. leaders have firmly concluded that such wars are mistakes.\nAt heart, structures and incentives pull Washington back, repeatedly, to avoidable quagmires. For starters, military action is easy for U.S. presidents to initiate. Since 1991, U.S. leaders have gotten in the habit of deploying force to secure even the most minor U.S. interests. The short-term costs and risks of using force against a smaller, distant state or nonstate actor often appear small—most Americans can go about their day-to-day lives without even realizing their country is at war—and Congress has largely become willing to cede its constitutional oversight. But getting out of these kinds of conflicts is far harder. Washington is accustomed to setting maximalist goals for even marginal wars, and U.S. leaders balk at halting an intervention without meeting promised objectives. Particularly if the ongoing costs of a conflict are relatively diffuse, there are few incentives for presidents to face accusations of weakness.\nYet the costs of these interventions are not small. They are merely hidden. Repeated wars add to a growing national debt, overstretch the U.S. military, and generate opportunity costs, drawing spending away from needed military investments and domestic priorities. Simply desiring to change the United States’ habit of waging war has not been enough to change it. If U.S. foreign-policy makers want to break the cycle, they need to think of ways to make using force a harder and less attractive option.\nPERVERSE INCENTIVES\nThe Trump administration’s 2025 National Security Strategy broke with precedent. Most national security strategies populate laundry lists of so-called vital U.S. interests through an interagency process that ensures that no issue goes unmentioned. Last year’s document, by contrast, admitted that the United States has a set of discrete, circumscribed interests that policymakers “must evaluate, sort, and prioritize.” It argued that “not every country, region, issue, or cause—however worthy—can be the focus of American strategy.” And it went on to emphasize the importance of the Western Hemisphere and the Indo-Pacific while concluding that “the days in which the Middle East dominated American foreign policy in both long-term planning and day-to-day execution are thankfully over.”\nFor much of the first year of his second term, Trump loosely adhered to this stated approach. The White House did use military force abroad, engaging in campaigns to strike Iranian nuclear sites and boats in the Caribbean that were allegedly involved in drug trafficking. But Trump also aggressively pushed allies in Europe and Asia to share the burden of defending their regions and moved to facilitate peace talks in both Gaza and Ukraine. The June 2025 U.S.-Israeli attack on Iran, the so-called 12-day war, was at least brief and its objective specific. Similarly, the January seizure of Venezuelan President Nicolás Maduro by U.S. Special Forces did not attempt full regime change. Instead, the White House struck a deal with Maduro’s vice president, Delcy Rodríguez, to take over.\nBut the successes in Venezuela and during the 12-day war strengthened the neoconservative wing of the Republican Party and made it easier to argue for subsequent interventions. A mere month after the Venezuela operation, U.S. forces launched Operation Epic Fury, targeting Iranian military infrastructure and killing senior regime leaders; the administration’s early rhetoric openly promised regime change in Tehran. Six months on, the damage to Iran’s military capabilities has been significant. But the United States has expended much of its stockpile of precision munitions and suffered substantial damage to its regional bases. The Islamic Republic remains in power and has expand", "translation_ja": "", "vocab": [{"word": "quagmire", "definition": "沼地のような状況を比喩的に表す言葉で、困難で脱出しにくい状況や泥沼のような紛争を意味する。外交・軍事において、長期化し出口が見えない状況を指す。"}, {"word": "maximalist", "definition": "最大限の目標や要求を追求する立場や傾向を指す。妥協を拒否し、完全な勝利や目標達成を求める姿勢を表す。"}, {"word": "neoconservative", "definition": "新保守主義者、強い軍事力による国際的影響力の行使を支持する政治思想の支持者。積極的な対外政策と軍事介入を推進する傾向がある。"}, {"word": "détente", "definition": "対立国家間の緊張緩和や関係改善を意味する外交用語。冷戦期の米ソ関係における緊張緩和政策を指すことが多い。"}, {"word": "overextend", "definition": "限界を超えて拡大・拡張する、あるいは能力以上の負担を引き受けることを意味する。軍事・経済の文脈で過度な展開や過剰な関与を指す。"}, {"word": "cede", "definition": "権利や領土、権限などを譲り渡す、放棄することを意味する。政治的・法的文脈で権力や責任を手放すことを指す。"}]}, {"title_ja": "援助後の世界における発展への道", "title_en": "The Path to Development in a Post-Aid World", "summary_ja": "著者は、トランプ政権下での米国と西側諸国による外交援助の大幅削減が、援助依存型開発モデルの限界を露呈させたと主張している。脆弱国家は縮小する外部援助に頼るのではなく、天然資源、海外在住者からの送金、地域間貿易協力、国内能力構築を活用した自立的戦略を追求すべきだと述べている。", "summary_en": "The author argues that massive cuts to foreign aid by the United States and other Western donors under Trump have exposed the limitations of aid-dependent development models. Rather than rely on diminishing external assistance, fragile states must pursue self-reliant strategies leveraging their natural resources, diaspora remittances, regional trade cooperation, and internal capacity-building to achieve sustainable economic growth.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/path-development-post-aid-world", "state_media": false, "category": "オピニオン", "full_text": "Fragile states, almost by definition, never have it easy. But for the roughly 60 poor countries that lack the capacity to perform basic responsibilities for their citizens, the last year and a half have been especially tough. For decades, these countries have subsisted on a lean diet of foreign aid from major donor governments and the United Nations, the World Bank, and other multilateral institutions. Yet under President Donald Trump, the United States—traditionally the world’s largest aid provider—has slashed its assistance. Other major donor states have followed suit, as have multilateral organizations.\nThe cuts are causing serious damage. Foreign aid has done a great deal of good, including by helping poorer governments meet the basic needs of millions of people, and the reductions have already resulted in the deaths of over 500,000 children, according to an estimate by Brooke Nicols at Boston University. But for all its merits, the existing system has always been quite limited. Relying on foreign aid did not provide fragile states with a pathway to meaningful economic growth. It did not advance state capacity. Instead, it left recipient countries vulnerable to the whims of faraway powers, as the cuts have now made evident. For weak states to become strong, they need a new strategy, one that depends mostly on themselves.\nCreating such a strategy will not be easy, nor will implementing it. Weak states are weak for a reason. But this task is not impossible. Fragile countries typically possess a wealth of natural resources and receive huge diaspora remittances. Managed right, these streams can provide governments with billions of dollars in revenue and help each country build a robust middle class. These states can create better systems of trade, and they can work across borders to promote internal and external stability. After all, countries typically suffer when their neighbors descend into chaos and thus have a shared stake in ensuring the region’s collective success.\nTHE GREAT WITHDRAWAL\nWhen Trump returned to office in January 2025, he immediately laid waste to the existing system of economic development. On the very day of his inauguration, he dismantled the U.S. Agency for International Development, the body that accounted for the lion’s share of U.S. development and humanitarian assistance. He also promptly slashed or outright canceled Washington’s annual contributions to the Global Climate Fund, the World Health Organization, and over a dozen other UN agencies. The result has been the end of all kinds of development initiatives. Closing USAID, for example, resulted in the termination of well over 5,000 projects. Washington’s cuts to multilateral bodies, to which it was the largest contributor, has shuttered many other programs. Meanwhile, Trump’s heavy-handed use of tariffs has gutted long-standing provisions that gave vulnerable states advantageous trade terms.\nThe United States is not alone in pulling back. According to the Organization for Economic Cooperation and Development, other Western governments have slashed assistance grants and development loans to their lowest level since 2016. Belgium, France, the Netherlands, Sweden, Switzerland, and the United Kingdom have all slashed foreign aid in favor of defense spending and other domestic expenditures. These countries have traditionally been among the world’s leading providers of humanitarian aid, after the United States. The United Kingdom’s humanitarian assistance in the social sector, for instance, has fallen below pre-COVID levels, leading to cuts in health programs in dependent countries in West and East Africa, notably Gambia, Kenya, and Eritrea.\nWestern donors are not the only game in town. China, let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-12 21:35 JST";
  renderTabs();renderList();
})();
</script>
