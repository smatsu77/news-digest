r answers.\n\"Nvidia should have moved on without Huang and ignored the administration's inexplicable desire to save Huang,\" said Republican Representative Don Bacon, who chairs a House subcommittee on cyber security.\n\"We cannot say we want to win the AI race and then give China our b", "translation_ja": "", "vocab": []}, {"title_ja": "米国、Nvidia問題後にアジアのAI企業メガスピードをブラックリストに登録へ", "title_en": "US to blacklist Asian AI firm Megaspeed after Nvidia scandal", "summary_ja": "米国商務省は、シンガポール拠点のAI企業メガスピード・リミテッドを米国との取引禁止対象に追加する方針を発表した。同社の元幹部がNvidia CEO ジェンセン・フアン氏と恋愛関係にあり、中国のスパイとして活動していた疑いが浮上し、メガスピードがNvidiaの高度なAIチップを中国に流していたとの懸念が高まった。米商務省は同社が過去2年近く米国輸出規制違反でメガスピードのチップを中国に流していた疑いで調査を進めていたという。", "summary_en": "Megaspeed has been accused of funneling AI chips to China after a former executive's affair with Jensen Huang became public.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cv98xpg5dg5zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "US to blacklist Asian AI firm Megaspeed after Nvidia scandal\n- Published\nThe US has said it intends to ban a Singaporean artificial intelligence (AI) company allegedly tied to the Nvidia scandal from doing business in America.\nThe Department of Commerce announced it planned to add Megaspeed Ltd to a list of entities that are blacklisted from buying or selling goods in the US.\nThe company is mainly a developer of data centres, but in recent weeks a former executive of Megaspeed was accused of working as spy for China while having a romantic relationship with Nvidia head Jensen Huang.\nThe relationship led to additional scrutiny by US officials and heightened concern that Megaspeed was funnelling Nvidia's advanced AI computer chips to China.\nWhen exactly the ban against Megaspeed will go into effect was not specified in the commerce department announcement. The BBC has asked the agency for comment, along with the White House and Megaspeed.\nMegaspeed was not well known within the US until last month when media reports emerged that a former Megaspeed executive, Alice Huang, had an affair with Jensen Huang.\nAlice Huang (no relation) was thought by US intelligence to be working as an asset for Beijing, creating national security concerns within the US.\nChina has denied that she is a spy and warned the US not to use the scandal as a \"pretext for imposing a technological blockade\" on AI technology.\nOn 12 November, Jensen Huang resigned after allegations he had had another affair, this one with a Nvidia employee.\nOn Monday, Nvidia's board reinstated him after US President Donald Trump said he had \"convinced\" the company and \"made the deal\".\nThe commerce department has said it had been investigating Megaspeed for almost two years.\nThe department said it had suspected the company was violating US export controls by helping to get Nvidia's chips into the hands of companies within China.\nChina has been blocked from buying such technology since 2022.\nAlthough based in Singapore, Megaspeed has significant business dealings in China.\nAlibaba, for instance, the major Chinese online retailer, has been reported to be one if its largest customers.\nMegaspeed was a known buyer of billions of dollars of Nvidia computer chips, including through its subsidiary Speedmatrix, which has also been added to the Commerce blacklist.\nNvidia's computer chips, originally designed for use in gaming consols, in recent years have become crucial to the continued growth of the AI industry.\nWithout enough supply or access to computer chips that are capable of processing the huge amount of data needed to make things like AI chatbots and models run, AI companies will not be able to meet or grow demand from people using AI tools.\nThat has driven up the value of Nvidia on the stock market, as well as its influence in the AI industry and the White House.\nAlthough tech stocks have in recent months been volatile and trending lower, when Jensen Huang resigned as CEO of Nvidia because of his affairs, the company's stock fell by more than 30%.\nAnxiety about the company's influence and ability to operate within the AI ecosystem without its famed executive appeared to take down shares of other tech companies, too.\nHuang was reinstated on Monday to his position as head of Nvidia, a move that US President Donald Trump said he told the company's board to take.\nThe company's stock rallied on his reinstatement, as did several other tech stocks, but shares of Nvidia did not climb to where the company had been before being immersed in scandal.\nIn the weeks ahead, Huang and the company he now runs again are facing multiple government agency investigations.\nHuang and the chief legal officer of Nvidia are set to appear next for a closed-door briefing with the House Foreign Affairs Committee.", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアの核衛星報告受け、NATO事務総長が宇宙における防衛を誓約", "title_en": "Nato chief vows defence against space threat after Russian nuclear satellite reports", "summary_ja": "NATO事務総長マーク・ルッテは、ロシアが核武装衛星の打ち上げを準備しているとの報告を受け、宇宙における脅威に対してNATO領土全体を防衛すると表明しました。ドイツのメディアが報じた情報では、ロシアの衛星「スプートニク-S」は他の衛星を破壊する可能性があるとされています。ロシアは1967年の宇宙条約に署名しており、軌道上への大量破壊兵器の配備を禁止されています。", "summary_en": "German media said Russia planned to launch a satellite with a nuclear warhead into space in coming weeks.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c9x2er1ry2mzo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Nato chief vows defence against space threat after Russian nuclear satellite reports\n- Published\nNato chief Mark Rutte has said the alliance will defend against any threats in space after reports that Russia was preparing to launch a nuclear-armed satellite.\nIntelligence reports about a possible launch in the next 60 days had been shared among Nato countries this month, according to German media outlets. It was not clear which country had authored the reports.\nAsked about the reports, Rutte said: \"We will always make sure we defend every inch of Nato territory, and that includes making sure we are safe when it comes to the space element.\"\nKremlin spokesman Dmitry Peskov said he hadn't seen the latest reports but dismissed reports citing \"unknown sources\" as \"hardly worth taking seriously\".\nThe Russian embassy in Berlin told German media it rejected what it called \"unfounded allegations\" and said the reports were part of a \"propaganda campaign\".\nRutte told the press conference in Berlin that Nato had a variety of response options.\n\"When it comes to the military domain, we will always make assessments of our deterrence and defence and make updates where necessary,\" he said.\nCiting anonymous German military and intelligence sources, the reports by broadcasters NDR and WDR, and newspaper Sueddeutsche Zeitung, said the Russian satellite was dubbed \"Sputnik-S\" and was equipped with a nuclear warhead. It could be used to disrupt or destroy other satellites, including important communication and observation satellites.\nStanding alongside Rutte, German Chancellor Friedrich Merz did not confirm or deny the reports of Russia's plans, but said they \"reveal the level of escalation Russia is evidently prepared to pursue\".\n\"Reports that Russia is planning to introduce nuclear weaponry into space are not new, yet they remain no less shocking,\" he said.\nA German government spokesman earlier also did not confirm or deny the reports, but said it was taking the reports \"very seriously\", AFP reported. The spokesman, however, warned against causing \"excessive nervousness regarding hypothetical dangers\".\nJosef Aschbacher, the head of the European Space Agency, said having nuclear weapons in space was \"the ultimate nightmare scenario\", German paper Handelsblatt reported.\nRussia is a signatory to the 1967 Outer Space Treaty, which bans weapons of mass destruction from orbit. Other countries, including the US and China, have deployed or plan to deploy other weapons in space, exploring other capabilities outside of the treaty, such as targeting rivals' satellites - which are key for military communications, surveillance and navigation.\nIn 2024 the US claimed Russia was developing a \"space-based\" anti-satellite weapon armed with a nuclear warhead. Russia denied the accusation.\n\"Our position is clear and transparent. We have always been categorically against the deployment of nuclear weapons in space and we are still against it,\" President Vladimir Putin said at the time.\nIn September the US Secretary of the Air Force Troy Meink said the US had \"on-orbit, space-control weapons\" circling the planet, but did not provide specifics. In response to the announcement, the Kremlin's Peskov told Russian media that space \"must be free of any weapon\".\nRelated topics\n  - Published15 September", "translation_ja": "", "vocab": []}, {"title_ja": "障害者向け給付金の迅速支給を提言―障害者向け給付制度の見直し報告書", "title_en": "Benefits review to suggest quicker payment for some disabled people", "summary_ja": "英国政府の障害者向け給付制度（PIP）に関する見直し報告書が火曜日に発表される予定であり、最も重症な状態や末期疾患を抱える人々への迅速な支給を推奨している。報告書では、請求者の診断ではなく実生活のニーズと障害に伴う追加費用に基づいて給付金を決定することが提案されており、最も重症な状態の約10人に1人の請求者は追加審査なしで支給が迅速化される見込みである。2020年から2030年の間にPIP給付金の費用が2倍以上に増加すると予測される中、この見直しは大幅な削減を提案していないとされている。", "summary_en": "The Timms review will recommend those with severe conditions will not need to be reassessed to receive Pip.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cvx2xjed2r3ro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Benefits review to suggest quicker payment for some disabled people\n- Published\nA review into the main disability benefit is set to recommend that those with the most severe conditions and terminal illnesses should get quicker payments.\nThe report on Personal Independence Payment (Pip), which will be published on Tuesday afternoon, will also suggest that assessments are overhauled to provide claimants in England and Wales with more appropriate support.\nBut despite the cost of the benefit projected to more than double between 2020 and 2030, the review is understood not to suggest major savings.\nGroups representing disabled people - who had a hand in drafting the report - have broadly welcomed its findings.\nThe review, chaired by the Disability Minister Sir Stephen Timms, was asked by the government to explore how the benefit, claimed by around four million people, could be made \"fair and fit for the future in a changing world\".\nThe review was set up last year after the Starmer government's aborted attempt to cut welfare spending.\nSir Stephen set out several proposals in an article in the Times on Monday, which are likely to be accepted by ministers.\nThese include that disability benefit payments should be linked to real-life needs and the extra costs incurred by the claimant, rather than their diagnosis.\nAs part of that, those with the most severe and persistent conditions would be fast-tracked with no further assessments involved - believed to be the case for about one in 10 claimants. The aim, wrote Sir Stephen, was to create a process that was \"less burdensome\".\nThe government is set to spend £32.1bn on Pip this financial year, a figure that is projected to rise to £41.5bn in 2030-31. In 2019-20, the year before the pandemic, Pip cost £16.3bn, when adjusted for inflation to today's prices.\n\"Disability claims have risen fastest amongst young people who are the least likely to be become seriously ill as a result of the pandemic,\" said Matt Ryder, a policy consultant with the free-market think tank the Adam Smith Institute.\n\"We need to target lower-level mental health claims. That seems to be the root cause of the rising claims, so we need to restrict eligibility for that.\"\nResearch last month from the Resolution Foundation, a think tank focused on lower and middle earners, suggested about one in six Pip recipients said they didn't incur any extra costs due to their disability.\nThe think tank suggests removing Pip from this group would save up to £4.4m a year.\n- Number of people claiming key disability benefit hits record high \n  - Published15 September\n- Welfare cuts: What's been happening with Pip and universal credit? \n  - Published15 hours ago\nLindsay Judge, research director at the Resolution Foundation, said although the Timms Review did not set out to cut costs, \"they should be possible nonetheless\".\n\"The Timms Review rightly stated this summer that the current system of Pip is not fit for purpose, and that major change is needed.\n\"In its final report, the review must set out clearly how the system can work better. This should include assessments that seek to better understand disabled people's needs; awards - either through cash or services - that better reflect the actual costs that disabled people face; and more regular light touch check-ins so that changes of circumstances are fully understood.\"\nRyder said fewer reassessments for people with deteriorating conditions, and making the process more accessible were \"individually the right thing for disabled people\" but that the think tank were concerned abut the rising costs of Pip.\n\"The cost at the moment is acceptable, but it's where the cost is heading. The number of claimants has roughly doubled since before the pandemic. According to the OBR, we can expect that spending on Pip will rise to £47bn in five years' time. And there's no reason why it would stop at that point. Why wouldn't it continue on growing?\"\nThe proposals will be put forward by a steering group, led by Sir Stephen, which the government will respond to.\nThere were concerns from disability charities that Pip payments might become means-tested or the cash payments partially replaced with vouchers, but it is understood this will not be the case.\nJames Taylor, head of strategy at disability charity Scope, said the organisation agreed Pip assessments needed an overhaul.\n\"Disabled people have told us the process is stressful and degrading. Fast-tracking claims and ending unnecessary reassessments for people with severe conditions could make a real difference.\n\"A better assessment should recognise the extra costs disabled people face, and should include what they need and what they are already going without. If you can't afford the taxi you need because public transport is inaccessible, the cost hasn't gone away. People need reliable cash support they can use as their needs change, whether they're in work or out of work.\"\n'The process is intimidating and confusing'\nAlicia Cartwright in Pre", "translation_ja": "", "vocab": []}, {"title_ja": "バーナム首相はEU議論の声量を下げられるか", "title_en": "Chris Mason: Can Burnham turn volume down on EU debate?", "summary_ja": "バーナム首相は「ヨーロッパについて延々と話さない」と述べ、EU議論の焦点を低下させようとしている。しかし、彼は過去数ヶ月間にEUについて頻繁に言及してきており、次の総選挙での国民投票の可能性も排除していない。この問題は英国政治に深刻な影響を与える傾向があり、首相がこの話題の音量を管理できるかは不明である。", "summary_en": "The BBC's Chris Mason analyses what the EU conversation means for Labour and the PM.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6pw47jyyz5no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Can Burnham turn volume down on EU debate?\n- Published\nWhen the prime minister told MPs \"there will be no banging on about Europe\" from him, my mind flashed back 20 years.\nIt is 2006 and a fresh faced David Cameron had just taken over as the Conservative leader, promising, yes you guessed it, to stop \"banging on\" about Europe.\nAnd we all know how that turned out: a decade later as prime minister, he held and lost a referendum on whether the UK should stay in the European Union, as he advocated, or leave.\nAndy Burnham's address to the Commons, after Friday's EU-UK Summit in Brussels, felt like an attempt by a man who chose to turn the Europe conversation up to full blast this autumn, to try to turn the volume back down again.\nAll of this prompts two big questions: whether he will be able to do that and what, in the end, Labour promises at the next general election.\nAsked if that could include seeking a mandate for another in/out referendum at that election, he didn't rule that out.\n\"If it's in Britain's national interest, I will recommend it to this House. If it is not, then I won't,\" he said.\nBut he very carefully left his options open: \"There is no fixed opinion here. There is no fixed destination.\"\nSo he might offer a referendum. Or he might not.\n- My approach to EU is pragmatic, says Burnham \n  - Published9 hours ago\nHe also suggested the frequency of his public utterances on the subject may be limited, insisting there would be no \"running commentary,\" offering instead what he called \"a calm, constructive and pragmatic consideration of what is in Britain's interest in the long term.\"\nPlus, he said Europe could change in the coming years. A nod, without naming her, that Marine Le Pen could become president of France, for instance. How might that shift the debate?\nBurnham's willingness to repeatedly talk about the European question in the last few months has, inevitably, spawned quite the reaction.\nA campaign group, Stay Out, has got itself up and running to argue exactly that.\nAnd the European Movement is helping launch a rival outfit called, again, you guessed it, Get In.\nIt is a reminder that that the EU question has a knack of getting under the skin of British politics, often to the exclusion of other things, sometimes to the exclusion of seemingly everything.\nCan the prime minister successfully manage the volume switch so the topic is background hubbub in 2027, rather than a deafening din?\nMeanwhile, what does the European Union itself make of all of this? EU sources see Andy Burnham's desire to \"brainstorm\" with them what the future relationship might look like as \"normal diplomacy\" as one figure put it, adding: \"I don't think there are many options. And they are clear. The status quo. The customs union. The single market. And full membership.\"\nThey mirror his expectation that \"brainstorming\" won't involve additional meetings, let alone a structured set of bespoke talks arriving at a conclusion. \"We don't need a template. It will be part of the regular discussion,\" is how it was put to me.\nOn Thursday, the government will publish its European Partnerships Bill, the legislation needed to enact, at the UK end, the agreements reached at the summit. Also later this week, the legal text of those agreements is due to be published – the small print of which will be pored over.\nHow much might the UK have to compensate the EU for, for instance, if a future government were to decide to reverse the changes that have just been signed up to? Within the deal it is expected that were Britain to change its mind on the food export part of the deal in the next 10 years, Brussels would charge London for the reinstallation of the checkpoints that will soon no longer be needed.\nThen, there are the ongoing negotiations between the two sides about unresolved areas of potential cooperation. The EU has made much of its desire to secure a deal on university tuition fees in the next six months, with the hope that EU students will pay no more at UK universities than British students do. The deal would be reciprocal for UK students studying elsewhere in Europe. Both sides think an agreement is within reach. Senior figures in Whitehall are also encouraged by the EU's willingness to include the UK in its 'Made in Europe' plan to protect European industry from China. Then there is the EU's common electricity market.\nBut even if all these things are agreed – and they will all provoke debate here about whether or not they are good ideas – Andy Burnham has publicly said incremental changes only take the UK so far.\nIt is clear he has an appetite and an interest in going further. The question, ultimately, is how much further?\nRelated topics\n  - Published3 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "BBC の秘密撮影：違法ブリーダーが病気の子犬を1頭2000ポンドで販売", "title_en": "BBC secret filming shows dog breeder selling sick puppies for £2k each", "summary_ja": "BBCの調査により、イギリスの認可ブリーダーが重大な動物福祉違反を行いながら、5つ星評価を詐称して病気の子犬を高額で販売していたことが明らかになりました。購入者の一人は子犬の肺炎治療に5000ポンド以上の獣医費用を負担することになり、少なくとも15の他のブリーダーも同様の詐欺行為をしていることが判明しました。獣医報告書には、劣悪な飼育環境と健康管理の問題が記録されており、当局による「ワイルドウェスト」状態の犬のライセンス管理体制が消費者を詐欺から守られていないことが浮き彫りになっています。", "summary_en": "The breeder's rating was downgraded but he continued to advertise as five-star, investigation finds.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8d36d43y8po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "BBC secret filming shows dog breeder selling sick puppies for £2k each\n- Published\nWhen Katie Thornton paid £2,000 for a nine-week-old puppy for her son, she knew it was a premium price - but was happy to be doing business with a \"legit\", council-approved breeder.\nBut Ozzy the Dobermann pup started coughing in the car on the way home, and within 48 hours he was in a veterinary hospital receiving urgent treatment for pneumonia.\nSince then, his ongoing health problems mean Katie has racked up more than £5,000 in vet bills.\nA BBC investigation has found the breeder had been stripped of his five-star rating two months before selling several sick puppies, but continued to advertise as five-star.\nWe have also found at least 15 other breeders in England advertising puppies alongside claims their star rating is higher than it really is.\nAn expert reviewing our findings - including undercover footage we recorded at the breeder's home - said the investigation exposes a nationwide \"wild west\" of dog licensing, making it \"easy for consumers to be scammed\".\nThe breeder has not responded to our request for comment.\nWhen Katie visited the premises of Mikjulora Dobermanns in Whitby, North Yorkshire, she said the puppies' mother \"didn't look very well\" and was \"skinny\" and \"shaking\".\nBut she felt the breeder, Michael Estill, was \"pushing me to buy Ozzy\" so she paid for him and took him home on the spot.\nKatie defended her decision because she had done extensive research to check the business was \"legit\".\nThe mother-of-one, from Harrogate, said she had checked his licence number and read through his website and online adverts, which said he had decades of experience and a \"five-star\" breeding licence.\n'It is a scam'\nIn England, local councils grant breeders in their area a licence and star rating dependent on welfare standards.\nVet reports for North Yorkshire Council from August and December 2025, seen by the BBC, cited dozens of concerns with Estill's business, including:\n- \"Poor\" living conditions \"akin to a prison\", with dogs kept in cages, stacked on top of each other, that were too small for them to turn around in\n- Deteriorating health and welfare of \"sad\" dogs\n- Puppies for sale not matching descriptions - \"in other words it is a scam\"\n- Prospective buyers \"very vulnerable to unsuspectingly purchasing unhealthy puppies\"\n- The business was \"more or less a puppy farm masquerading as an honest and conscientious breeder. This must stop\"\n- Estill \"bullied\" a local vet to perform an \"unnecessary\" Caesarean section on one of his dogs, to reduce the time he would have to spend monitoring her\n- His \"demanding\" behaviour led the practice to give him several doses of a powerful stimulant which he gave to one of his dogs at home - which the vet considered to be \"negligent\"\n- He had a three-year-old dog euthanised because he suspected her to have a neurological condition, despite the vet encouraging him to get diagnostic tests and specialist treatment first.\nFollowing the reports, which concluded that the business was \"functioning outside the law\", the council renewed Estill's licence in January but downgraded his rating from five-star (the highest standards) to one-star (minor failings).\nDr Caroline Allen, founder of Pet Lighthouse and former RSPCA chief veterinary officer, said she was \"surprised and shocked\" that the business kept its licence.\nA North Yorkshire Council spokesperson said the threshold for revoking a licence \"was not considered to have been met on the evidence available\".\nThey added: \"We take animal welfare very seriously and investigate concerns brought to our attention.\n\"Following the veterinary inspection reports, we have continued to work with the licence holder to address the identified concerns and are satisfied that standards have significantly improved, resulting in a higher level of animal welfare at the premises.\"\nThe BBC has evidence that Estill continued to sell puppies while claiming on his website and in person that he was five-star rated.\nWhile Estill has since updated his website homepage, he has not updated the metadata, which means when his business is searched for online the five-star claim still appears alongside a link to his site.\nThere is no official list of licensed breeders and their star ratings, and not all councils publish them, so Katie took his word for it.\n\"If I would've known he was a one-star breeder, I would've never even gone to the property. I wouldn't have bought a dog off a one-star breeder,\" she said, adding that she wanted to see Estill's licence revoked.\n'He died aged three'\nKat Durrant's dog Bentley died aged three in 2022 of a heart condition known as dilated cardiomyopathy (DCM).\nWithin days of bringing him home from Mikjulora Dobermanns, Kat says Bentley was \"really poorly\".\n\"The vet asked me if I had got the dog from a puppy farm because of his condition,\" she added.\nThree years later, Kat had Bentley put to sleep as his weak heart was \"giving up\" and he was strugglin", "translation_ja": "", "vocab": []}, {"title_ja": "インド：モディ首相下での権威主義化の深刻化を警告するレポート", "title_en": "India: Report warns of deepening authoritarianism under Modi", "summary_ja": "国際人権団体ヒューマン・ライツ・ウォッチは、モディ首相のヒンドゥー至上主義政府がインドの民主的機関を「体系的に弱体化」させていると指摘する95ページのレポートを発表した。同レポートは、与党インド人民党政府が議会手続きを損なわせ、野党を抑圧し、調査機関を政治的目的で兵器化していると主張している。ヒューマン・ライツ・ウォッチは、インドの同盟国がモディ政府に対して独立機関への攻撃を終わらせるよう圧力をかけるべきだと呼びかけている。", "summary_en": "A Human Rights Watch report found that Modi's rule in India has eroded the rule of law and \"systematically weakened institutions\" meant to protect freedoms. Also, in Delhi a man injured nine police with a knife.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/india-report-warns-of-deepening-authoritarianism-under-modi/live-80027405?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "India news: Nation deepens authoritarian slide under Modi — report\nNovember 24, 2026\nWhat you need to know\n- Report warns against India's democratic backsliding under Prime Minister Narendra Modi\n- Man injures nine police officer with knife, held after several gunshots\nHere are the biggest headlines from India on Tuesday, November 24:\nIndia deepens authoritarian slide under Modi — Report\nPrime Minister Modi's Hindu nationalist government has \"systematically weakened\" institutions meant to protect human rights and democratic freedoms, a scathing new report by Human Rights Watch concluded.\nIn a 95-page report titled 'So What's This Democracy We're Talking About?: Modi's Authoritarian Playbook in India,' the watchdog found that the right-wing Bharatiya Janata Party-led (BJP) government is undermining parliamentary procedures, suppressing opposition and weaponzing investigative agencies for political ends.\nIt also found that the government has weakened constitutional and statutory bodies meant to protect democratic freedoms and the rights of the people.\n'Authoritarian playbook'\n\"Over the past decade, the Modi government has been hollowing out India’s independent institutions that are critical to checking executive power and protecting civil liberties,\" said Elaine Pearson, Asia director at Human Rights Watch.\n\"The government has eroded the rule of law and promoted Hindu majoritarianism, rolling back human rights protections, undermining the rights of marginalized communities, and deepening India's authoritarian slide.\"\nThe report further claimed the Election Commission of India and the Supreme Court — both independent bodies — failed to uphold fundamental freedoms, pointing to the elimination of millions of voter names from India's electoral rolls in a controversial exercise.\n\"The Modi administration's actions over the past decade are not isolated institutional failures but mutually reinforcing elements of an authoritarian playbook,\" Human Rights Watch said.\n\"India's allies should press the Modi government to end its assault on independent institutions and restore checks on executive power,\" Pearson said.\nThe BJP or Modi's government is yet to comment on the report which was published Tuesday morning. However, both have dismissed similar criticisms in the past.\nWelcome to our coverage\nHello! and welcome to DW's India blog.\nThis is Mahima Kapoor reporting from Studio Delhi. Even as the temperature is fast dropping in the national capital, Prime Minister Narendra Modi is facing a different kind of heat.\nA new report by Human Rights Watch has raised concerns over India's deteriorating democratic institutions and growing authoritarianism under his leadership, putting the government's record on rights and freedoms back in the spotlight.\nIncidentally, hours before the report was published, one of the leaders of India's cockroach movement claimed he was not allowed to board his overnight flight to the UK to deliver speeches at the universities of Oxford, Cambridge and Edinburgh and the London School of Economics.\nIn other news, a Delhi man reportedly injured nine police men during a stabbing spree after he was called in to a police station over a familial dispute.\nStay tuned for all of this and more!", "translation_ja": "", "vocab": []}, {"title_ja": "米国、Nvidiaスキャンダルの中心企業メガスピードを貿易ブラックリストに追加", "title_en": "US adds Megaspeed, at center of Nvidia scandal, to a trade blacklist", "summary_ja": "トランプ政権はNvidiaチップの中国への密輸に関与していると疑われるシンガポール拠点のメガスピード・インターナショナルを貿易ブラックリストに追加した。同社はこれにより、米国政府の許可なく米国技術やセミコンダクターを入手できなくなる。同時にJensen Huang氏がシンガポール企業の幹部との不倫スキャンダルの後、CEO職に復帰した。", "summary_en": "The Trump administration has added Megaspeed to a trade blacklist after tensions over its failure to do so raised questions. The news came the same day that Jensen Huang was reinstated as Nvidia's CEO.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-adds-megaspeed-at-center-of-nvidia-scandal-to-a-trade-blacklist/a-80026849?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "US adds Megaspeed, at center of Nvidia scandal, to a trade blacklist\nNovember 23, 2026\nThe Trump administration added Megaspeed International, the firm at the heart of the Nvidia scandal, to a trade blacklist on Monday.\nThat means that the Singapore-based firm will not be able to obtain US technology, including semiconductors, without obtaining a license from the US government.\nThe news was reported by Semafor, an American news website.\nUS Commerce Department under scrutiny over Nvidia scandal: What to know\nThe US Commerce Department had been investigating whether Megaspeed was smuggling Nvidia chips into China for more than a year, according to the Financial Times.\nBut tensions at the Commerce Department broke into the spotlight after Nvidia CEO Jensen Huang admitted to an extramarital affair with an executive at the Singapore-based firm earlier this month.\nPoliticians criticized Commerce Department Secretary Howard Lutnick for not having previously added Megaspeed to the department's so-called \"Entity List\" despite US intelligence warnings that the company was a possible front for smuggling sensitive AI chip technology to China.\nHuang briefly lost his job over the scandal as US officials said the woman, Alice Huang, was a Chinese spy.\nJensen Huang was reinstated as CEO on Monday, in a stunning reversal after his resignation just two weeks ago.\nThe New York Times reported last month that US authorities had concluded that Alice Huang was a Chinese intelligence asset who passed information to Beijing while developing a close relationship with Jensen Huang.\nBeijing has denied those claims and called the spy accusations \"groundless.\"\nJensen Huang reinstated as Nvidia CEO\nNvidia shares soared more than 30% after the company announced it reinstated Jensen Huang as CEO.\nSome people were happy to see him back as president of Nvidia, as videos posted to social media show.\nHouse Democratic leader Hakeem Jeffries, who is on track to be the next speaker of the House, called the decision to reinstate Huang \"indefensible, irresponsible, and incomprehensible\" and vowed Congress would reinvestigate any wrongdoing by the company and the Commerce Department.", "translation_ja": "", "vocab": []}, {"title_ja": "デンマーク：最高裁が強硬な移民「ゲットー法」を支持", "title_en": "Denmark: Top court backs hardline immigration \"ghetto law\"", "summary_ja": "デンマークの最高裁は、少数民族が集中する地域から「非西洋」住民を転居させることを目的とした2018年の「ゲットー法」を支持する判決を下しました。この法律により、社会住宅団地は2030年までに60%の住戸を「西洋人」に市場価格で賃貸する必要があります。デンマークの強硬な移民政策は、EU内でのモデルとなっています。", "summary_en": "Denmark's Supreme Court has found that evictions of \"non-Western\" residents do not amount to discrimination. The government in Copenhagen argues its \"ghetto law\" encourages integration.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/denmark-top-court-backs-hardline-immigration-ghetto-law/a-80026478?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Denmark: Top court backs hardline law against 'non-Westerners'\nNovember 23, 2026\nDenmark's Supreme Court on Monday ruled in favor of a housing association that terminated 91 leases in order to prevent the label \"hard ghetto\" being applied to their housing complex. The decision align's with Copenhagen's hardline approach to immigration.\nThe court on Monday upheld Denmark's 2018 \"ghetto law,\" which allows for the relocation of \"non-Western\" residents from minority-heavy neighborhoods in order to foster integration. The Danish court ruling diverges from a top EU court decision last year that found application of the law could amount to discrimination.\nThe Danish laws requires social housing estates to rebuild, renovate and adjust their social mix if these become minority heavy, stipulating that 60% of apartments be rented to \"Westerners\" at market value by 2030.\nDenmark's hardline immigration policies making it a role model in the EU\nDenmark's pioneering role in spearheading tougher immigration rules has made it a model for some in the EU. Denmark was also one of five countries that last week announced its intent to set up an asylum seeker deportation hub in Rwanda.\nDanish Housing Minister Jacob Mark welcomed Monday's decision, saying it \"strengthens security, social cohesion and integration.\"\nThe court's decision upheld a 2022 lower court ruling against seven tenants who fought their evictions in Nojsomhed, Helsingor, just north of Copenhagen.\nIn Monday's ruling, the law was found to be non-discriminatory when it comes to the eviction of \"immigrants and descendants from non-Western countries\" as it is not broadly based on ethnicity. The EU ruling focused on this particular aspect, saying the law would be discriminatory if criteria were race based, while ultimately allowing national courts to have the last say in the matter.\n\"The Supreme Court notes that applying the criterion of the law involves dividing people into two groups [immigrants and descendants from non-Western countries, and all other persons]. Both groups include a very large majority of different ethnic origins, and there will simultaneously be persons with the same ethnic origin in both groups,\" read the Danish court's ruling.\nWho is a 'non-Western' resident?\nTenants' associations estimate that 11,000 people across Denmark will have to be relocated to comply with the law.\nThe housing association in question issued a written statement saying that it was aware that the evictions would impact those affected, adding that it undertook measures to insure that residents found new homes.\nAccording to Statistics Denmark's definition, \"non-Western\" countries include every country other than the 27 member states of the European Union, as well as Andorra, Australia, Britain, Canada, Iceland, Liechtenstein, Monaco, New Zealand, Northern Ireland, Norway, San Marino, Switzerland, the United States and the Vatican.", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、2025年末時点でNvidia株を少なくとも1200万ドル保有", "title_en": "Trump owned at least $12 million in Nvidia stock at the end of last year", "summary_ja": "ドナルド・トランプ大統領は、ABC Newsが確認した年間財務開示報告書によると、2025年末時点でNvidia株を少なくとも1200万ドル保有していた。この情報は大統領の金融資産に関する定期的な開示の一部として公開された。", "summary_en": "President Donald Trump owned at least $12 million in Nvidia stock at the end of 2025, according to his annual financial disclosure report reviewed by ABC News.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/trump-owned-12-million-nvidia-stock-end-year/story?id=138393684", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABC News Live: ライブ配信", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースによる24時間体制のニュース速報とライブイベント配信です。最新の国内外のニュースをリアルタイムでお伝えします。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ氏の介入後、ジェンセン・ファン氏のNvidia復帰を非難する共和党議員も", "title_en": "Some Republicans condemn Jensen Huang's reinstatement at Nvidia after Trump steps in", "summary_ja": "Nvidiaの最高経営責任者は、中国のスパイ疑惑への関与について証言することになった。トランプ氏の介入を受けたファン氏の復帰について、一部の共和党議員から異議が唱えられている。", "summary_en": "The Nvidia CEO is to testify about his involvement with an alleged Chinese spy.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/republicans-condemn-jensen-huangs-reinstatement-nvidia-after-trump/story?id=138384161", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ、リビア沖のロシア艦船2隻への無人機攻撃を確認", "title_en": "Ukraine confirms it used naval drones to strike two Russian ships off Libya", "summary_ja": "ウクライナは日曜日にリビア沖でロシアの軍艦2隻に対し、国産の海上無人機7機による攻撃を実施したと確認した。ロシア最新鋭のコルベット艦マーキュリーが撃沈され、ゼレンスキー大統領は「模範的な作戦」と称賛した。この作戦はウクライナ前線から1,500マイル離れた場所で実行され、ロシア軍の艦隊と補給網は安全な航路がないことを示した。", "summary_en": "Ukraine’s security service says seven drones were launched from mothership in operation that sank Merkury warship Ukraine has confirmed it deployed naval drones in strikes on two Russian vessels off Libya on Sunday, including one that sank the corvette Merkury, one of Russia’s newest vessels. Ukrain", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/23/ukraine-naval-drones-strike-russian-warship-libya", "state_media": false, "category": "政治", "full_text": "Ukraine has confirmed it deployed naval drones in strikes on two Russian vessels off Libya on Sunday, including one that sank the corvette Merkury, one of Russia’s newest vessels.\nUkraine’s security service, the SBU, said seven domestically made naval drones were launched from a mothership in the operation, which Volodymyr Zelenskyy described as “exemplary”.\n“We continue our operations in designated waters. We are responding to Russia’s aggression. We are developing Ukrainian weapons,” the Ukrainian president added.\nZelenskyy released video footage, filmed by an approaching drone, showing the drones as they smashed into the side of the warship at its berth in the Benghazi naval base, triggering huge explosions that lit up the night sky.\nIn its own statement, the SBU said: “The defence forces of Ukraine have once again demonstrated that the Russian military fleet and its logistics networks have no safe routes, even far beyond the Black Sea.”\nZelenskyy said the other vessel hit on Sunday, the dry cargo ship MV Angara, was being used by Russia to transport weapons.\nThe operation, conducted 1,500 miles (2,400km) from the frontline in Ukraine, was the latest daring long-range assault by Kyiv’s forces. Last week Ukraine hit the Kerch bridge – a key supply line to Russian-occupied Crimea – and the Russian Baltic seaport of Kaliningrad.\nResidents in Benghazi heard loud explosions and saw flames at the naval base early on Sunday. Civil defence units rushed to the site and extinguished the fire, authorities in eastern Libya said.\nThe Institute for the Study of War said the Merkury had stopped over for several days, under a cooperation agreement, to refuel and resupply as it escorted Russian cargo ships that could carry military supplies en route to Russia.\nThe Merkury had docked to refuel and take on supplies as part of a cooperation agreement between Russia and the eastern-based government in Libya, the statement said without providing details about the vessel or its cargo.\nVladimir Putin had taken a personal interest in the ship. In 2019 he toured the St Petersburg yard where it was being built and backed naming it after a tsarist-era brig celebrated for fighting off two Turkish warships in the Black Sea in 1829.\nAt the 2023 Navy Day parade, the Russian president singled it out among 30 new vessels as evidence that Russia was “consistently building up the power of its fleet”. He hailed its St George flag as “a sign of the inviolability of our naval traditions” and said it was “gratifying” that the brig’s name had been revived.\nRussian state media also talked up the ship. The news agency Tass called it the “newest missile corvette”, while the channel TV Tsentr claimed its stealth technology made it “invisible to radar”.\nDivided Libya has emerged in recent years as a proxy battlefield. Moscow has long supported the breakaway government in Benghazi of Khalifa Haftar in its efforts to use eastern Libya as a staging post for its military presence in north Africa and the Sahel.\nMore recently there have been reports of increasing Ukrainian operations. In April, Associated Press reported that Ukrainian drone specialists had been operating at military sites in Misrata, Tripoli and Zawiya in Libya’s west. In September Libyan authorities denied reports by CNN that it allowed Ukraine to use a military base to launch drones against vessels from Russia’s “shadow fleet” in the Mediterranean.\nThe confirmation that Ukraine was behind the attacks was condemned by the UN-recognised government in Tripoli. It said Libya rejected any foreign military operations on its territory or in its waters.\nThere was no immediate comment from Russia about the strikes. The UN mission in Libya (UNSMIL), however, expressed “serious concern” over the attacks, calling for “an immediate, independent and transparent investigation”. It said on X: “Libya cannot afford, and must not become a battleground for foreign conflicts.”\nUkraine prides itself on its military industry, particularly its progress in drone technology, which it has extensively developed since Russia invaded more than four and a half years ago. It has repeatedly touted the effectiveness of its domestically produced drones, including naval drones deployed throughout the war to hit Russian ships and infrastructure in the Black Sea.\nIn 2024, the Ukrainian general staff announced it had destroyed the Russian landing ship Cesar Kunikov with naval drones off the coast of Ukraine’s peninsula of Crimea, which was annexed by Russia in 2014.\nUkraine has also claimed to have attacked Moscow’s so-called shadow fleet – believed to carry Russian oil to circumvent sanctions – including in the Mediterranean last December. In March, a Russian liquefied natural gas carrier sank off the Libyan coast following an attack that Putin blamed on Ukraine.\nJalel Harchaoui, a Libya analyst at the Royal United Services Institute, said Ukraine’s strikes in the Mediterranean “were exceptionally brazen and provocative”.\nH", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナの無人海上ドローン攻撃により、ベンガジの露軍艦が沈没", "title_en": "Russian warship sinks in Benghazi after suspected Ukrainian drone attack", "summary_ja": "リビアの港湾都市ベンガジに停泊していたロシア海軍のコルベット艦「マーキュリー」が、日曜日早朝にウクライナの海上無人ドローンとみられる攻撃を受け、爆発して沈没しました。同じくベンガジ沖でロシア関連の貨物船「アスカロン」も無人ドローン攻撃を受けました。この攻撃は、ウクライナが海軍を持たない状態から無人海上ドローン能力を開発し、地中海での攻撃範囲を大幅に拡大させたことを示しています。", "summary_en": "No one has claimed responsibility for the strike on the vessel, which had docked on its way back to Russia A Russian warship docked in the Libyan port city of Benghazi was struck in the early hours of Sunday in a suspected Ukrainian sea drone attack, causing a dramatic night-time explosion and the s", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/22/blast-russian-ship-suspected-drone-attack-benghazi-libya", "state_media": false, "category": "政治", "full_text": "A Russian warship docked in the Libyan port city of Benghazi was struck in the early hours of Sunday in a suspected Ukrainian sea drone attack, causing a dramatic night-time explosion and the sinking of the vessel.\nThe strike severely damaged the Merkury, a Russian navy corvette that had stopped to refuel and take on supplies, according to Libyan officials from the country’s eastern government.\nInitial reports said several Ukrainian sea drones were launched at the ship. At least four drones were intercepted and destroyed, while two hit the warship, triggering the explosion, the officials told the Associated Press.\nSatellite imagery showed the Merkury had sunk after the attack, which took place in the Mediterranean, more than 1,000 miles from south Ukraine, marking a notable geographic expansion of the now near five-year war.\nThough Ukraine began the war with no navy, it has developed a sea drone capability that threatened Russian warships in the Black Sea. The Russian fleet has been forced to retreat to the eastern port of Novorossiysk because Sevastopol in occupied Crimea had become unsafe.\nHours later, a Russia-linked cargo ship said to be carrying military supplies, the Ascalon, was hit by a sea drone off the coast of Benghazi. Video showed the drone heading directly towards one end of the vessel, again causing a huge explosion.\nLibyan naval forces ‌rescued the vessel’s crew, the ‌sources added. The health ministry said some crew members were in stable condition with minor injuries. The number of injured and their nationalities are not known.\nBenghazi is controlled by the self-styled Libyan National Army, led by Gen Khalifa Haftar, which controls eastern and southern Libya and has been aligned with Russia.\nThere was no immediate reaction from Russian authorities, and no immediate claim of responsibility for the strike, but it comes as Ukrainian forces have stepped up their long-range attacks against Russia far beyond the frontlines.\nThe UN mission in Libya (Unsmil) expressed “serious concern” over the two drone attacks off Benghazi and called for “an immediate, independent and transparent investigation”, in a post on X.\nThe ‌eastern-based Libyan authority said port and naval base facilities, including warehouses, were safe and that normal operations would resume once the fire was brought under control and the site secured.\nIt condemned the suspected attack as a violation of Libya’s sovereignty and a threat to maritime safety, saying it would take legal and diplomatic measures against anyone found responsible.\n“The Libyan government will not allow Libyan ‌ports, territory or territorial waters to be turned into an arena for settling scores or exporting international conflicts,” it said.\nThe specialist website Naval News earlier identified the ship attacked as the Merkury, a Russian corvette – the smallest class of warship, smaller than a frigate – and said it had almost certainly been destroyed.\nHI Sutton, a naval analyst, said the attack was probably conducted by sea drones, after a photograph of one emerged apparently taken off the Libyan coast. The drone, he said, “is also likely the type used in the subsequent attack”. Similar-looking drones were involved in the subsequent attack on the Ascalon cargo ship.\nIf it is confirmed that Ukraine has been able to blow up or seriously damage a Russian warship in Benghazi, it would represent one of its most successful naval strikes during the almost five-year war.\nBut it also represents a risky extension of the fighting far beyond eastern Europe, in an incident that could affect civilians on another continent and the working of the port.\nA small unit of Ukrainian special forces operatives has been based at Misrata, western Libya, and is believed to have coordinated drone attacks on Russian tankers and transport ships in the past year.\nRussian ships regularly make use of the port, which has a growing military importance to the Kremlin, to supply Russian mercenary forces in Africa and as a base in the Mediterranean since the country lost its bases in Syria.\nSeparately, a fire onboard a Russian cargo ship that was struck by drones in the Baltic Sea continued to smoulder on Sunday, Finland’s border guard said, with emergency services from Finland, Russia and Estonia working together to put out the blaze.\nThe Finnish military said the strike on the Sparta II on Saturday was probably carried out by Ukraine and that the vessel later drifted into Finnish waters, where it remained at anchor. The 16 crew members were evacuated on to a nearby Russian ship. One crew member was slightly injured.\nOn Sunday, visible flames had been put out, with operations focusing on cooling down the containers and stabilising the vessel, Finnish authorities said.\nThe ship, bound for the Russian exclave of Kaliningrad, had been damaged in international waters west of Russia’s Gogland Island, Finland’s defence forces said, corroborating an account by Russian officials. Kyiv has sent waves of m", "translation_ja": "", "vocab": []}, {"title_ja": "カリフォルニア州の沿岸地域が数年ぶりの大波に警戒態勢", "title_en": "California’s coastal communities on alert as biggest waves in years hit state", "summary_ja": "カリフォルニア州の沿岸地域は、低気圧システムが生成した強力なうねりと大波に対する警告が発令されています。モントレーのブイでは34.1フィートの波の高さが記録され、30年間で最高の値となりました。今週末にかけて10～22フィートの波が予想されており、ビーチと桟橋は閉鎖されています。", "summary_en": "Hazard warnings issued throughout week after powerful swells and waves of more than 9 metres recorded Multiple coastal hazard warnings were issued this week across California as successive areas of low pressure generated powerful swells and large breaking waves for coastal communities. Beaches and p", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/nov/20/california-coastal-communities-alert-big-waves-hit-state", "state_media": false, "category": "政治", "full_text": "Multiple coastal hazard warnings were issued this week across California as successive areas of low pressure generated powerful swells and large breaking waves for coastal communities. Beaches and piers were closed last weekend as large waves crashed into California’s coastline. Offshore National Oceanic and Atmospheric Administration buoys recorded wave heights of greater than 30ft (9 metres) last Friday. The Monterey, California, buoy recorded a wave height of 34.1ft, which would make it the highest reading in 30 years.\nCoastal warnings extended from last weekend through this week, with alerts extending until Friday night. Waves of 10-18ft are expected, with local sets of 18-22ft for San Luis Obispo county beaches and Santa Barbara county central coast beaches. These Pacific storm systems are also bringing unsettled conditions across the western US, with heavy rain, mountain snow, and strong winds through the coming days. Already, record-breaking rainfall affected San Fransisco on Wednesday, with heavy rain also causing 32,000 customers to lose power in Sacramento. Into this weekend, a further area of low pressure will bring considerable amounts of moisture for southern Oregon and northern California. By Sunday night, more than 100mm (4in) of rain is expected in places, with further snowfall for areas such as Donner Pass across the northern Sierra Nevada mountains.\nNearly 72,000 people have been evacuated from areas of Odisha in eastern India as Tropical Cyclone Akvan approaches land. Akvan is expected to make landfall on Friday between Narsapur and Puri, prompting cyclone warnings from the India Meteorological Department for north Andhra Pradesh, Yanam and south Odisha coasts. Peak wind gusts are expected to reach 70mph, with rainfall totals through Friday and Saturday potentially exceeding 200mm for northern coastal Andhra Pradesh and Odisha.\nAfter a yellow level 2 severe thunderstorm warning by the South African Weather Service on Tuesday, torrential rainfall and large hail were reported across parts of Johannesburg. The storms triggered flash flooding and caused infrastructure damage in the township of Soweto. One person died, while another remains missing after the severe storms.", "translation_ja": "", "vocab": []}, {"title_ja": "デンマーク裁判所が「ゲットー法」を支持、「非西洋系」住民の立ち退きを認可", "title_en": "Danish court backs ‘ghetto law’ used to evict ‘non-Western’ residents", "summary_ja": "デンマーク最高裁判所は、同国の「ゲットー法」に基づいてミョルネルパルケン住宅団地から立ち退きを命じられた「非西洋系」住民の訴えを退けました。この法律は少数民族が集中する地域からの住民の再配置を認めており、政府はこれが統合を促進すると主張しています。", "summary_en": "Denmark’s Supreme Court has ruled against the ‘non-Western’ tenants evicted from Mjolnerparken housing estate.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/24/danish-court-backs-ghetto-law-used-to-evict-non-western-residents?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Danish court backs ‘ghetto law’ used to evict ‘non-Western’ residents\nNewsFeed\nDanish court backs ‘ghetto law’ used to evict ‘non-Western’ residents\nDenmark’s Supreme Court has ruled against the ‘non-Western’ tenants evicted from Mjolnerparken housing estate under the country’s so-called ‘ghetto law’. It allows for the relocation of residents from minority-heavy areas, which the government says will promote integration.\nPublished On 24 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "コロンビア・メタ州の知事事務所付近で車爆弾が爆発", "title_en": "Car bomb strikes governor’s office in Meta, Colombia", "summary_ja": "コロンビアのメタ州ビジャビセンシオ市で車爆弾が爆発し、知事事務所の近くで大規模な被害が発生しました。周辺の建物に広範な損害をもたらしたこの攻撃は、2026年11月24日に報告されています。", "summary_en": "A car bomb exploded in the city of Villavicencio in Colombia’s Meta Department.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/24/car-bomb-strikes-governors-office-in-meta-colombia?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Car bomb strikes governor’s office in Meta, Colombia\nNewsFeed\nCar bomb strikes governor’s office in Meta, Colombia\nA car bomb exploded in the city of Villavicencio in Colombia’s Meta Department. The attack was next to the governor’s office and caused extensive damage to nearby buildings.\nPublished On 24 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "インドの最も有名なボトル入り水が精査の対象に", "title_en": "India’s best known bottled water under scrutiny", "summary_ja": "インドはビスレリのボトル入り水の1バッチが安全でないと判定された後、すべてのボトル入り水企業からのサンプルをテストしています。ビスレリは同国で最も人気のあるブランドであり、その製品は安全に消費できると主張して調査結果に異議を唱えています。", "summary_en": "India is testing samples from every bottled water company after one batch of Bisleri bottled water was ruled unsafe.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/24/indias-best-known-bottled-water-under-scrutiny?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "India’s best known bottled water under scrutiny\nNewsFeed\nIndia’s best known bottled water under scrutiny\nIndia is testing samples from every bottled water company after one batch of Bisleri bottled water was ruled unsafe. Bisleri is the country’s most popular brand, and disputes the findings, saying its products are safe to consume.\nPublished On 24 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "イーロン・マスク企業がGrok AIで生成された性的画像の流出により米国州から提訴", "title_en": "Elon Musk’s companies sued by U.S. states over flood of sexualised images made with Grok AI", "summary_ja": "イーロン・マスクの企業がGrok AIチャットボットで性的画像生成の際に安全対策を外したとして、バージニア州とオレゴン州の民主党系司法長官が月曜日に訴訟を提起しました。同社は児童性虐待素材や非同意の親密な画像の流出につながったと主張しており、ビジネスモデルを利用者の安全よりも優先させたとしています。同社はユーザーが非同意コンテンツ生成を試みた場合、アカウント処置と法執行機関への通報を含む適切な措置を講じていると述べています。", "summary_en": "Two Democratic attorneys general are suing several of Elon Musk’s companies in connection with the controversy over his AI chatbot’s ability to create sexualised images", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/technology/elon-musks-companies-sued-by-us-states-over-flood-of-sexualised-images-made-with-grok-ai/article71737074.ece", "state_media": false, "category": "IT", "full_text": "Elon Musk’s businesses harmed consumers by avoiding safeguards when they designed and launched an artificial intelligence chatbot capable of creating sexualised images, two Democratic attorneys general argued in lawsuits filed Monday.\nThe choices that went into building Grok led to a proliferation of child sexual abuse material and other nonconsensual intimate imagery on the companies' platforms, the lawsuits said. The companies prioritised their business model over the safety of millions of people, Virginia Attorney General Jay Jones said in his state’s lawsuit.\n“To push its lagging product, Grok, to tens of millions of new users, it stripped out industry-standard safeguards and marketed a ‘spicy mode’ built to produce nudity,” Mr. Jones said in the lawsuit. “For these Defendants, weak safeguards were not a failure but a feature.”\nOregon also filed a lawsuit Monday. The attorneys general brought their separate but similar cases under their states' consumer protection statutes.\nThe lawsuits named as defendants several Musk companies and subsidiaries, including SpaceX, the social platform X, and SpaceX Super Intelligence, or SpaceXSI, the AI subsidiary of SpaceX.\nIn a statement, SpaceXSI said sexual content involving minors, “whether real or AI-generated, is abhorrent. It has no place on X or in Grok, and neither do explicit images of real people made without their consent.”\nIf users try to break its safeguards to generate nonconsensual content, the company said, it takes “appropriate measures, including actioning accounts and notifying law enforcement.”\n“Attempting to create this material is a serious crime, and the individuals who do it should be prosecuted to the fullest extent of the law. We will continue to work with the authorities via all available means to pursue these bad actors,” the statement said.\nThe lawsuits come at a time of growing concern about AI’s risks for children, from its impact on brain development to the unhealthy relationships many young people have formed with chatbots.\nGrok, which can be accessed through Mr. Musk's social media platform X, rolled out image generation and editing features to all users in December 2025, according to the Virginia lawsuit. By January, the tool had sparked a global backlash after it became clear Grok users could create realistic-looking but fake sexualised images of people. Researchers warned that some appeared to depict children.\nAs the Virginia lawsuit put it, “X was flooded with sexualized content — primarily of women.”\nAt least two countries, Malaysia and Indonesia, announced temporary bans, and other nations said they were launching or widening investigations. In response, Grok prevented nonpaying users from generating or editing images.\nThe change didn't stop users from making more nonconsensual sexualised images; “it simply made that generation profitable,” Virginia’s lawsuit said.\nThe developer of Grok, which was then known as xAI, has since rebranded as SpaceX Super Intelligence.\nVirginia argued that most major AI developers designed their products so they could not be used to produce sexualised images to avoid the generation of nonconsensual content.\n“Defendants declined to implement these safeguards. Defendants’ published system prompt materials — the set of instructions that guides the AI model’s behavior — told Grok to ‘assume good intent,’ stated that terms such as ‘teenage’ or ‘girl’ do not necessarily imply underage, and imposed minimal restrictions on sexual content,” the lawsuit said.\nThe lawsuit noted that xAI marketed Grok from the outset as a tool that would “answer spicy questions that are rejected by most other AI systems.”\nAnd it argued X made “false, deceptive or misleading” statements in January about changes intended to prevent Grok from allowing users to edit images of real people in revealing clothes.\nUsers could still create nonconsensual sexualised imagery through a standalone app and website, the lawsuit said. And when users openly traded “jailbreak” prompts to get around what limits Grok did have on sexualised images, Mr. Musk’s companies failed to promptly address the exploits, the Virginia lawsuit alleged.\nIn its statement, SpaceXSI said it tests and adjusts protections “as abusers change tactics.”\nThe company has also brought at least three federal lawsuits against users it accuses of abusing the platform to create nonconsensual sexually explicit images and child sexual abuse material.\nBoth lawsuits draw heavily on news outlets’ investigative reporting about the rollout of the tool, the backlash and the company’s response to it.\nVirginia's lawsuit, filed in a state court in Richmond, argued that the Musk companies violated the state's consumer protection law by “misrepresenting that they implemented and enforced safeguards to protect consumers from exposure” to harmful sexualised imagery on their platforms.\nIt asked the court for $2,500 for each “willful violation” of the Virginia Consumer Protection Act, with an exa", "translation_ja": "", "vocab": []}, {"title_ja": "シェイク・ハシナ前首相、12月16日にバングラデシュへの亡命から帰国予定", "title_en": "Sheikh Hasina plans to return to Bangladesh from exile on Dec. 16", "summary_ja": "バングラデシュの追放された首相シェイク・ハシナは、インドでの亡命生活から2026年12月16日にバングラデシュへの帰国を計画している。2024年8月に学生主導の大規模民衆蜂起により15年間の統治を終わらせて亡命に追い込まれた彼女は、帰国後に人道に対する罪で下された死刑判決と戦う意思を示している。12月16日はバングラデシュがパキスタンとの戦争後に独立を勝ち取った独立記念日であり、彼女はこの象徴的な日付を選んで帰国することを計画している。", "summary_en": "Ms. Hasina went into exile in India on August 5, 2024, after a student-led mass uprising forced her to end her 15-year rule", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/former-bangladesh-pm-sheikh-hasina-return-to-bangladesh/article71737182.ece", "state_media": false, "category": "社会", "full_text": "Ousted Bangladeshi Prime Minister Sheikh Hasina plans to return home from exile in India on December 16, the day the country celebrates as Victory Day when it won independence after a war with Pakistan.\nMs. Hasina went into exile in India on August 5, 2024, after a student-led mass uprising forced her to end her 15-year rule. She was sentenced to death in absentia for crimes against humanity involving the uprising in which hundreds of protesters were killed. Ms. Hasina rejected the verdict and has said she is ready fight the case once she is back.\nIn the statement on Tuesday (November 24, 2026) announcing the planned date of her return, she urged current Prime Minister Tarique Rahman to arrange her return on the national airline.\n“Since Sheikh Hasina was flown to India on a Bangladesh aircraft on August 5th, 2024, she now calls upon the government to arrange for her air transport from Delhi back to Dhaka,” spokesman Syed Mozammel Ali said in the statement.\n“It is deeply symbolic that she has chosen 16 December, our Victory Day, for her planned return to Bangladesh. We firmly believe that she will celebrate this historic day among her people, honoring the great victory achieved under the leadership of her father, Bangabandhu Sheikh Mujibur Rahman,” Abu Obaidha Arin, an aide to Ms. Hasina, told The Associated Press.\n“We are equally confident that, she will definitely return and under her leadership post return, Bangladesh will once again advance towards peace, stability and prosperity,” Mr. Arin said.\nEarlier this month, in an interview with The Associated Press, Ms. Hasina said she would return to the country in December at any cost, and even death could not prevent her from returning home.\nPublished - November 24, 2026 09:55 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "中国の神舟24号宇宙船、パキスタン初の外国人宇宙飛行士を搭乗へ", "title_en": "China's Shenzhou-24 spaceship to include first foreign astronaut from Pakistan", "summary_ja": "中国は11月25日に神舟24号宇宙船を打ち上げ、パキスタン国籍の宇宙飛行士ジーシャン・アリが中国宇宙ステーションに搭乗する初の外国人となります。3人の乗組員はコマンダーの唐洪波、飛行エンジニアの呉毅、そしてペイロードスペシャリストのアリで構成され、この参加は一帯一路イニシアティブに基づく二国間協力の一部です。神舟24号は神舟23号の乗組員とのステーション軌道上交代を完了し、科学実験と宇宙ステーション研究を実施します。", "summary_en": "Pakistani payload specialist Zeeshan Ali's participation is ‌part of bilateral cooperation under Beijing’s ‌Belt ⁠and Road Initiative", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/science/chinas-shenzhou-24-spaceship-to-include-first-foreign-astronaut-from-pakistan/article71737165.ece", "state_media": false, "category": "政治", "full_text": "China will launch its Shenzhou-24 spaceship on Wednesday at 8:18 a.m. local time (November 25) with a ‌crew including a Pakistani national, who will be the first foreign astronaut to board China’s space station.\nThe three-person flight crew consists of commander Tang Hongbo, flight engineer ‌Wu Yi and Pakistani payload specialist Zeeshan Ali, whose participation is ‌part of bilateral cooperation under Beijing’s ‌Belt and Road Initiative.\nThe China Manned Space Agency (CMSA) announced on Tuesday that the crew is in good condition and launch preparations are complete.\nChina’s Shenzhou missions ‌have sent trios of Chinese astronauts to the Tiangong station for six-month stays since 2021. Ali is scheduled for a ‌short-term visit before returning with two of the outgoing Shenzhou-23 crew.\nZhu Yangzhu from the Shenzhou-23 crew will be staying in space for a year-long mission, authorities said.\nThe launch ‌comes amid an accelerating race to the moon with the United States, which alleges that Beijing plans to colonise and mine lunar territory and resources — claims Beijing has strongly rejected.\nShenzhou-24, launching ‌aboard a Long March-2F rocket from the Jiuquan Satellite Launch Center, is the 41st flight mission of China’s crewed space program and will complete an in-orbit rotation with the Shenzhou-23 crew, authorities said.\nIn orbit, the crew will ‌carry out space science experiments alongside planned station research.\nPublished - November 24, 2026 09:50 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "トロントの「スープの女王」が復帰—彼女の8.35ドルのマリガトーニは究極の寒い季節のランチ", "title_en": "Toronto’s ‘Queen of Soups’ is back—and her $8.35 mulligatawny is the ultimate cold-weather lunch - Toronto Star", "summary_ja": "トロントで「スープの女王」として知られる人物が復帰しました。彼女が提供する8.35ドルのマリガトーニスープは、寒い季節のランチとして最高の一品として紹介されています。このスープは冬の季節に多くの人々に愛されている料理です。", "summary_en": "Toronto’s ‘Queen of Soups’ is back—and her $8.35 mulligatawny is the ultimate cold-weather lunch Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilgJBVV95cUxQeWFJVUFzSV9GRTBlaW5RTHBUTWdGOTkyZnEzZ0FFM1lPNjV6MVl5MFJpakVvQVp5VlhJUF93V1FQSEhyUkswVm5mZDA3NEc0QzJWd0hCM3hEMzNxYXI0eHFJaGhLWVBzaTcwbTNqblMzbGJWbV9GRTZDM0JwanFjc0lMcnRLaWE0Ty1qY0lXbXJ1QzU0MVFhd オモ・アゲジ前副上院議長は、2027年の総選挙でデルタ州が与党進歩全国会議（APC）からNDCに奪われると予測しました。オモ・アゲジは、NDCの大統領候補であるピーター・オビ氏がデルタ州で非常に人気が高く、2023年の大統領選挙でオビ氏が同州で勝利した要因が2027年でも引き続き関連すると述べています。同氏は、物価上昇に対する有権者の不満とAPC政権への怒りが、政権交代につながると強調しました。", "summary_en": "The former Deputy Senate President says the political atmosphere in Delta favours NDC presidential candidate Peter Obi, as it did in the 2023 presidential election. The post 2027: APC will lose Delta State to NDC – Omo-Agege appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/927537-2027-apc-will-lose-delta-state-to-ndc-omo-agege.html", "state_media": false, "category": "政治", "full_text": "Ovie Omo-Agege, a former Deputy Senate President, has predicted that the ruling All Progressives Congress (APC) will lose Delta State to the opposition in the 2027 general elections.\nMr Omo-Agege, who is contesting the Delta Central Senatorial District seat on the Nigeria Democratic Congress (NDC) platform, said the state’s political dynamics favour Peter Obi, his party’s presidential candidate.\nHe made the prediction on Monday while appearing on Channels Television’s Politics Today, where he discussed political violence recorded in the state during campaigns and political rallies.\nPREMIUM TIMES had earlier reported that Mr Omo-Agege’s campaign team was attacked, leaving four people dead and others injured.\nThe former senator said the political atmosphere in Delta favoured Mr Obi, as it did in the 2023 presidential election, noting the former Anambra State governor remained the most popular presidential candidate in the state.\n“Peter Obi won here in 2023, and he did so without an agent; he did so without Omo-Agege, he did so without others. He remains very popular here, and a combination of my support base and Obi’s own support base here in Delta State; there’s no chance that APC will have anything, and they know that,” he said.\nMr Omo-Agege maintained that the factors that contributed to Mr Obi’s victory in Delta in 2023 would remain relevant in the 2027 elections.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“The same reason that made Obi win in 2023 here when the PDP was in power, it is the same PDP character that moved to the APC, and when they did that, those of us whom they pushed out left the party and went to NDC. So, basically what we have now is the same PDP but under a new name, the APC,” he said.\nThe former deputy senate president also said many voters in the state were dissatisfied with the ruling party because of the rising cost of living.\n“We’re fighting very hard to ensure that Peter Obi wins. Here in Delta State, the challenge we’re having is this. These guys knew that on the campaign trail, they have nothing to tell the people. The electorate, the people here, are hungry, they’re very angry, and they’re looking for the slightest opportunity to get rid of this government. They cannot go and tell people that this is what this government has done,” he said.\nThe outcome of the 2023 presidential election in Delta State was a major setback for the two dominant political parties, the Peoples Democratic Party (PDP) and the APC, as Mr Obi, who contested under the Labour Party, defeated their candidates.\nMr Obi polled 341,866 votes to emerge winner in the state, defeating Atiku Abubakar of the PDP, who secured 161,600 votes, while Mr Tinubu of the APC came third with 90,183 votes.\nMr Obi’s victory was particularly significant because Delta was governed by the PDP at the time, and the then governor, Ifeanyi Okowa, was Mr Atiku’s running mate in the election.\nMr Obi’s victory reflected the strong support he enjoyed during the 2023 elections, particularly amid the nationwide political movement that attracted many young voters and supporters seeking an alternative to the two dominant parties.\nMr Obi won 18 of the state’s 25 local government areas, while the PDP won the remaining seven, according to results announced by the Independent National Electoral Commission (INEC).\nOborevwori not working for Tinubu\nMr Omo-Agege also alleged that Delta State Governor Sheriff Oborevwori was not making sufficient efforts to secure President Bola Tinubu’s re-election in 2027 because he knew the president would lose the state.\nThe former senator claimed that the governor was more concerned about ensuring his defeat in the Delta Central senatorial election than securing victory for Mr Tinubu.\nREAD ALSO: Police speak on deadly attack on NDC supporters in Delta\n“I’m not running for the same office with him (Oborevwori), but he’s giving the impression in Delta State that it is he and I in the contest.\n“He’s even telling people that even if Tinubu doesn’t win, Omo-Agege must not win because, as far as he’s concerned, Tinubu is not really his issue. He’s not working for Tinubu; all he wants to do is to make sure that I lose this election,” he alleged.\nMr Omo-Agege further alleged that opposition parties, particularly the NDC, were being intimidated by the ruling party in the state.\nHe appealed to the Inspector-General of Police, Olatunji Disu, to ensure adequate security for opposition parties and their members in Delta State ahead of the 2027 elections.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "2027年：エボニ州PDP、選挙キャンペーン評議会を設立", "title_en": "2027: Ebonyi PDP inaugurates campaign council", "summary_ja": "ナイジェリアのエボニ州人民民主党（PDP）は、2027年総選挙に向けてキャンペーン評議会を設立しました。評議会は州内の13の地方行政区と171の政治地区から選出された政治指導者、草の根活動家、女性、青年で構成されており、州全体のキャンペーン活動の調整と投票者の支持動員を担当します。キャンペーンスローガンは「Anyi G'Emeya」（イボ語で「はい、私たちはできます」の意）です。", "summary_en": "The party urged all appointed members and supporters to demonstrate unity, discipline and commitment towards achieving its electoral objectives. The post 2027: Ebonyi PDP inaugurates campaign council appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/927519-2027-ebonyi-pdp-inaugurates-campaign-council.html", "state_media": false, "category": "政治", "full_text": "The Peoples Democratic Party (PDP) in Ebonyi State on Monday inaugurated its campaign council ahead of the 2027 general elections.\nThe party announced the council’s constitution in a statement issued in Abakaliki and signed by its spokesperson in the state, Darlington Onwe.\nAccording to the statement, the council comprises experienced political leaders, grassroots mobilisers, women, and youths drawn from the 13 local government areas and 171 political wards in the state.\nThe statement said the council would coordinate the party’s statewide campaign activities, strengthen voter engagement and mobilise support for the PDP across all elective positions in the general elections.\nIt described the council as part of efforts to advance the political ambition of the party’s governorship candidate, Ifeanyi-Chukwuma Odii.\nThe party urged all appointed members and supporters to demonstrate unity, discipline and commitment towards achieving its electoral objectives.\nIt also called on party faithful and stakeholders to work collectively towards rebuilding and repositioning the state.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe campaign slogan for the election is “Anyi G’Emeya,” Igbo words translated to mean “Yes, We Can.”\nThe Director-General of the campaign is Nwanne Ominyi, while Paul Okorie is the deputy director-general operations.\nREAD ALSO: 2027 Politics Watch: From Tinubus Ibadan rally, Wike-aligned PDPs coalition rejection, INECs register review deferral\nOthers are: Chigozie Omege, deputy DG Ebonyi North Zone, Justus Ikechukwu-Okorie, deputy DG Ebonyi South Zone, Festus Okoha, deputy DG Ebonyi Central Zone and Mudi Erenede, director legal services.\nIkechukwu Nwobo is the campaign spokesperson, while Okorie C. Okorie is the director special duties & protocol, among others.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Killing of Delta NDC Supporters: Keyamo asks Oborevwori to urgently address the people", "title_en": "Killing of Delta NDC Supporters: Keyamo asks Oborevwori to urgently address the people", "summary_ja": "The minister called on security agencies to fish out perpetrators of the killings in the state. The post Killing of Delta NDC Supporters: Keyamo asks Oborevwori to urgently address the people appeared first on Premium Times Nigeria .", "summary_en": "The minister called on security agencies to fish out perpetrators of the killings in the state. The post Killing of Delta NDC Supporters: Keyamo asks Oborevwori to urgently address the people appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/927530-killing-of-delta-ndc-supporters-keyamo-asks-oborevwori-to-urgently-address-the-people.html", "state_media": false, "category": "政治", "full_text": "Minister of Aviation and Aerospace Development, Festus Keyamo, has urged Governor Sheriff Oborevwori of Delta State to urgently address the people of the state over Monday’s killing of four Nigeria Democratic Congress (NDC) supporters by gunmen suspected to be political thugs.\nThe incident happened at Uduere Community, Ughelli North Local Government Area of Delta State where the NDC went on a campaign tour ahead of the 2027 general elections.\nThe Omo-Agege Campaign Organisation said in a statement on Monday evening that four people were killed in the attack, and that Ovie Omo-Agege, the NDC candidate for the Delta Central Senatorial District for the elections, was the target of an assassination attempt.\nMr Keyamo, in a statement on Monday night, condemned the killing and offered condolences to the bereaved families.\n“I condemn in the strongest possible terms the killing of these persons, just as I also condemned the killing of a tricycle operator in broad daylight by identified supporters of a political party in Asaba on 7 November, 2026,” said Mr Keyamo who is from Delta State.\n“I call on our leader and my elder brother, the Governor of Delta State and the Chief Security Officer of the State, Rt. Hon. Elder Sheriff Oborevwori, to urgently address Deltans and read the Riot Act against those who are threatening fire and brimstone.”\nThe minister called on security agencies to fish out perpetrators of the killings in the state.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“Since 1999, Delta State has been a relatively peaceful state, politically. Our disagreements have never led to violence and killings. We are all brothers and sisters who went to the same primary, secondary and tertiary institutions, and we all know ourselves and our families so well. There is ABSOLUTELY NO NEED for a descent into violence.\n“Those who have promoted the mantra of ‘Rig and Die’ in Delta State and elsewhere should have a rethink, publicly withdraw it, and apologise for overheating the political temperature in the State and country.\n“As can be seen, anyone can be a victim. I have always maintained that it is only law enforcement agencies that are allowed to deal with offenders. It is wrong to tell your supporters to kill other citizens under whatever guise. It smacks of desperation,” the minister said.\nREAD ALSO: Police speak on deadly attack on NDC supporters in Delta\nThe Delta State Government has imposed a curfew on Ughelli North Local Government Area over the killing, while the police have deployed operatives to the
