と経済的ポテンシャルを活用し、欧州全域への事業拡大を目指している。", "summary_en": "INTERVIEW Taiwan looks to Poland as base for expansion into Europe Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1QTkF5Slh6OGRNUnVkQmMtc0ZkX0VmU0xpNko0X3RvNF82TFcxc3RjSDBQTS1VZEs2bjNkWFVDQy13VzFocXk1SXNPS2ZPekdJdW8tNDJ0NA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "『我們生來善良』が金馬奨で最高賞を受賞", "title_en": "'We Are Born Good' takes top prize at Golden Horse Awards - Focus Taiwan", "summary_ja": "映画『我們生來善良』が権威ある金馬奨で最高賞を獲得しました。この作品は優れた映画製作と物語の質で高く評価されています。金馬奨はアジアにおける最も重要な映画賞の一つです。", "summary_en": "'We Are Born Good' takes top prize at Golden Horse Awards Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9XLXE0R2o1NldURUg0MkRXRnlWcFpUeW5JdmZheWN2WG5jN1V4cUhsd3JKRkZpOW1VV2Y0ZmRhejRjdUFwVE5qN2xPWlhLYmZMdHdvMlBR?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "COP31閉会セッション終了、成果文書は週末に予定", "title_en": "COP31 closing session ends, outcome document expected over weekend", "summary_ja": "CGTNは、COP31の閉会セッションが終了し、成果文書が週末中に発表される予定であると報じている。国連気候変動会議の最終段階が完了し、各国の合意内容がまとめられようとしている。今後の国際的な気候変動対策の方針を示す重要な文書となることが見込まれている。", "summary_en": "COP31 closing session ends, outcome document expected over weekend", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-22/COP31-closing-session-ends-outcome-document-expected-over-weekend-1SgQGdQrFGE/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領が「恒久的な合意」を模索する中、イラン革命防衛隊がバーレーンの米国レーダーを標的に", "title_en": "IRGC targets US radars in Bahrain as Trump seeks 'permanent deal'", "summary_ja": "CGTNは、ドナルド・トランプ米大統領が土曜日にフォックス・ニュースに対し、イランの核兵器開発を阻止する「恒久的な」合意を望んでいると報じた。トランプ大統領は、イラン当局者は「非常に非常に困難だ」とコメントした。同時にCGTNは、イラン革命防衛隊がバーレーンの米国レーダーを標的にしたと報じている。", "summary_en": "US President Donald Trump told Fox News on Saturday that he wants a \"permanent\" deal that stops Iran from getting a nuclear weapon. He said Iranian officials are \"very, very difficult.\"", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-22/IRGC-targets-US-radars-in-Bahrain-as-Trump-seeks-permanent-deal--1SgRClAT5x6/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "李強首相：中国はシンガポールとのFTA交渉加速の準備ができている", "title_en": "Premier Li: China ready to accelerate FTA upgrade talks with Singapore", "summary_ja": "中国国営メディアCGTNが報じたところによると、中国の李強首相は土曜日、中国とシンガポールが「中国・シンガポール自由貿易協定（FTA）4.0」の交渉を加速させ、より高いレベルの双方向の開放を促進する準備ができていると述べた。CGTNは、両国が二国間関係の深化に向けて協力することへの中国の意思を強調したと報道している。", "summary_en": "China stands ready to work with Singapore to accelerate negotiations on the China-Singapore Free Trade Agreement (FTA) 4.0 and promote a higher level of two-way opening-up, Chinese Premier Li Qiang said on Saturday.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-21/Premier-Li-China-ready-to-accelerate-FTA-upgrade-talks-with-Singapore-1SfYdpSSpxe/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナの重大な損失が兵員確保を困難に、キーウは未成年者の出国禁止を検討か", "title_en": "Heavy losses shrink Ukraine’s pool of recruits as Kiev weighs teen travel ban — expert", "summary_ja": "TASなどが報道するところによると、ウクライナは重大な軍事損失により兵員確保の困難に直面しているとのこと。キーウ当局は未成年者の出国禁止措置と女性の動員も検討しているとRT系の専門家が指摘している。", "summary_en": "Andrey Marochko noted that due to recruitment difficulties, Kiev is also considering mobilizing women", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2223679", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネパールでマグニチュード5.3の地震が発生、インド東部も揺れる", "title_en": "Magnitude 5.3 earthquake strikes Nepal, rattles eastern India", "summary_ja": "国営メディアTASS/RTは、ネパールでマグニチュード5.3の地震が発生し、インド東部にも影響を及ぼしたと報じています。同メディアによれば、現時点で死傷者や建物被害の報告はないとしています。", "summary_en": "There were no immediate reports of casualties or damage", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2223677", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ、2027年にIMFへ20億ドル以上の返済義務", "title_en": "Ukraine to owe more than $2 billion to IMF in 2027", "summary_ja": "TASS/RTは、ウクライナのIMFに対する未払い債務が140億ドルを超えていると報じています。同報道によれば、ウクライナは2027年にIMFに対して20億ドル以上の返済義務を負うことになるとしています。", "summary_en": "Ukraine’s outstanding debt to the IMF exceeds $14 billion", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2223675", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "新興経済における貿易のアキレス腱", "title_en": "The Achilles’ Heel of Emerging Economies’ Trade", "summary_ja": "2024年の世界商品輸入の23%が、製品の重要性、供給の集中、地政学的距離という3つの脆弱性のうち少なくとも2つに直面しているという新しい研究結果が示されている。著者は、新興経済が限定的な財政余力の中で、これらの問題に早期に対処し、重要な産業への依存性を認識し、サプライチェーンの回復力を構築することの重要性を強調している。グローバル貿易は後退ではなく再構成されており、新興経済がこの変化から恩恵を受けるためには、戦略的な対応が必要だという主張である。", "summary_en": "New research shows that 23% of global goods imports in 2024 faced at least two of three vulnerabilities: product criticality, supply concentration, and geopolitical distance. Given the wide range of problems, early diagnosis and targeted action are particularly important for emerging economies with ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/emerging-economies-must-identify-achilles-heel-goods-trade-by-nick-leung-et-al-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Achilles’ Heel of Emerging Economies’ Trade\nNew research shows that 23% of global goods imports in 2024 faced at least two of three vulnerabilities: product criticality, supply concentration, and geopolitical distance. Given the wide range of problems, early diagnosis and targeted action are particularly important for emerging economies with limited fiscal space.\nHONG KONG/TOKYO/MADRID—Last year’s tariff turmoil and this year’s Strait of Hormuz disruptions held an important lesson for emerging economies: global trade is reconfiguring, not retreating, and the changes can offer new opportunities. Seizing them, however, requires emerging economies to identify the critical inputs, concentrated suppliers, and exposed routes that could undermine their gains from integration, and then build resilience where it matters most.", "translation_ja": "", "vocab": []}, {"title_ja": "AIエージェントがビッグテックをさらに巨大化させる可能性", "title_en": "AI Agents Could Make Big Tech Bigger", "summary_ja": "エージェント型AIの台頭により、少数のビッグテック企業が個人生活に対して前例のない権力を獲得する可能性がある。規制当局が今すぐ行動しなければ、これらのデジタルゲートキーパーは消費者を操作し、企業監視を加速させ、個人の権利と市民的自由を脅かす恐れがある。著者は、AIエージェントへの集中的な企業支配が、サイバーセキュリティ上の懸念と同等かそれ以上に危険な脅威であることを主張している。", "summary_en": "The rise of agentic AI could give a handful of Big Tech firms unprecedented power over our personal lives. Unless lawmakers and regulators act now, these digital gatekeepers could manipulate consumers, turbocharge corporate surveillance, and threaten our individual rights and civil liberties.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/high-costs-of-the-emerging-agentic-ai-oligopoly-by-max-von-thun-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nAI Agents Could Make Big Tech Bigger\nThe rise of agentic AI could give a handful of Big Tech firms unprecedented power over our personal lives. Unless lawmakers and regulators act now, these digital gatekeepers could manipulate consumers, turbocharge corporate surveillance, and threaten our individual rights and civil liberties.\nBRUSSELS—In a matter of months, several highly publicized hacks by AI agents targeting businesses and governments have raised new cybersecurity concerns. But while preventing similar or worse incidents is critical, we face another, equally dangerous threat: concentrated corporate control over the agents that many of us could come to rely on in our daily lives.", "translation_ja": "", "vocab": []}, {"title_ja": "AIバブルが崩壊すれば、その影響は深刻になるだろう", "title_en": "If the AI Bubble Is Bursting, the Fallout Will Be Severe", "summary_ja": "著者は、S&P 500がNASDAQに続いて調整局面に入る中、AI関連株の評価をドットコムバブルと比較し、深刻な懸念を表明している。資産価格バブルの崩壊は経済不況につながる傾向があり、その影響は状況によって大きく異なるが、AIセクターの現在の過度な評価は過去の教訓から学ぶ必要があることを示唆している。", "summary_en": "With the S&P 500 following the tech-heavy NASDAQ into correction territory, even as Anthropic set a record with its initial public offering, this is a good moment to compare AI stock valuations with earlier asset-price bubbles. A look back at the dot-com boom and bust of the late 1990s offers ample ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-bubble-why-fallout-will-be-severe-by-desmond-lachman-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nIf the AI Bubble Is Bursting, the Fallout Will Be Severe\nWith the S&P 500 following the tech-heavy NASDAQ into correction territory, even as Anthropic set a record with its initial public offering, this is a good moment to compare AI stock valuations with earlier asset-price bubbles. A look back at the dot-com boom and bust of the late 1990s offers ample cause for concern.\nWASHINGTON, DC—Tolstoy famously wrote that “Happy families are all alike; every unhappy family is unhappy in its own way.” Something similar could be said about punctured asset-price bubbles. While such occurrences generally lead to economic recessions, the resulting pain and unhappiness vary widely, depending on the circumstances.", "translation_ja": "", "vocab": []}, {"title_ja": "アンスロピックのIPOは技術エリートには素晴らしかったが、私たち一般人にはそうではない", "title_en": "Anthropic’s IPO was great for the tech elite – and not so great for the rest of us | Steven Greenhouse", "summary_ja": "著者は、アンスロピックの過去最大のIPO（1,500億ドル評価）が一握りのシリコンバレーエリートと初期投資家に莫大な富をもたらした一方で、多くのアメリカ人はAIの雇用喪失や経済への悪影響への懸念、データセンターによる地域への�悪影響を感じていると主張している。さらに、AI関連企業がS&P500の市場価値の49%を占める中で、多くの一般労働者や年金生活者が知らないうちにAI企業への投資を保有しており、AI市場の崩壊は数百万人の退職資金に大きな打撃を与える可能性があると警告している。", "summary_en": "The company’s co-founders are now wildly rich, while countless Americans face AI-driven threats to their jobs and fears of a stock bubble The sultans of Silicon Valley and the wizards of Wall Street rejoiced this week when Anthropic raised an eye-popping $81bn in the largest initial public offering ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/23/anthropic-ipo-tech-elite-stock-bubble", "state_media": false, "category": "オピニオン", "full_text": "The sultans of Silicon Valley and the wizards of Wall Street rejoiced this week when Anthropic raised an eye-popping $81bn in the largest initial public offering in history. They saw the AI company’s IPO as a gung-ho affirmation of Silicon Valley’s and Wall Street’s marriage of technology and capitalism.\nFor many employees at the company that developed Claude, the public offering must have been a thing of dreams. With the IPO valuing Anthropic at $1.5tn, the company’s seven co-founders each came away with stakes worth about $20bn, while, by one estimate, 600 of Anthropic’s more than 5,000 employees will have holdings topping $100m and 2,800 others will have shares worth more than $10m.\nBut while the IPO fueled jubilation in Silicon Valley and Wall Street, I’m sure that many Americans resented the fact that Anthropic’s employees and early investors became immensely rich even as millions of Americans distrust and dread AI, fearing that it could have disastrous results for workers, the overall economy and humankind.\nAnd let’s not forget that millions of Americans are furious about the many datacenters that have been foisted on their communities; many of those centers have pushed up electricity prices, disrupted communities, received big tax breaks and created annoying, round-the-clock noise.\nAnthropic’s successful IPO and the huge media attention it received have in ways shined a spotlight on the country’s immense wealth and income inequality. A small elite did marvelously, while the masses have nothing to celebrate.\nThey feel left out and left behind in the IPO’s financial frenzy at the same time that many Americans are deeply worried that AI is a hi-tech grim reaper that will someday come for their – and their children’s – jobs.\nWhat’s more, many workers and retirees have only recently discovered that their 401(k)s and index funds have investments in AI companies that they didn’t know about or choose. Notwithstanding Anthropic’s big day, there are growing fears among workers and retirees that an AI bust or burst bubble could take a hugely painful bite out of their retirement funds.\nAccording to a recent JP Morgan analysis, corporations with ties to AI make up 49% of the S&P 500’s market value, and if those companies’ shares drop 20% or 30% in value, that’s going to pummel the finances of millions of Americans.\nMany economists have debated whether there is an AI stock market bubble, with more and more people convinced that an AI bubble has already begun to burst. Tech stocks have had a very bad week and continued to drop on Friday, two days after Anthropic’s IPO. That day, Anthropic’s shares fell by 9%, sliding along with the rest of the tech sector.\nIf the bubble bursts on inflated AI stocks, not only would that drag down the overall stock market, but it could pull the whole US economy into recession, throwing millions of Americans out of work. If AI sparks such a recession – while the tech elite enjoys the billions they made from AI – the federal government and the states might have to spend tens of billions of dollars on unemployment benefits and other measures to cushion the recession.\nThat is an argument to enact a federal tax on IPOs or a federal wealth tax to ensure that the general public shares in some of the IPOs’ benefits.\nI fear that many tech executives’ takeaway from the Anthropic IPO will be that all is well with AI, that there is no need for change, and that the industry should double down in opposing all regulation and government interference. They will reach that conclusion despite the growing and scary number of examples of AI agents going rogue and bypassing guardrails, taking unauthorized actions, and even engaging in illegal actions.\nUnfortunately, many tech execs may see the successful IPO as another reason to ignore warnings like those from Geoffrey Hinton, considered the godfather of AI, who said there was a 10% to 20% chance that AI could lead to the extinction of humanity within the next 30 years.\nIf anything, the Anthropic IPO seems to have encouraged Donald Trump to continue giving a thumbs down to imposing any regulations on AI. Trump seems to fear that regulating AI may slow the industry’s breakneck growth and hasten a decline in AI stocks. That could deflate his beloved stock market and dismay the billionaire tech entourage that constantly flatters him.\nSpeaking on Thursday to the Asia-Pacific Economic Cooperation meeting in Shenzhen, China, Trump again ruled out any regulation, saying: “We oppose any form of globalist regulation or anything to control or stifle SI [super intelligence], and we won’t allow that to happen.”\nI don’t mean to slam Anthropic here. It apparently is one of the more public-minded tech companies, but the gap between the tremendous success of its IPO and the tremendous concerns about AI is huge.\nAnthropic’s Claude is very impressive, and so is the pledge by the company’s seven co-founders to donate 80% of their equity stakes to philanthropic causes. Anthr", "translation_ja": "", "vocab": []}, {"title_ja": "ミャンマーに対する判決はジェノサイド立証をより実行可能にする | ケネス・ロス", "title_en": "The ruling against Myanmar makes proving genocide more feasible | Kenneth Roth", "summary_ja": "国際司法裁判所がミャンマーがロヒンギャに対してジェノサイドを犯したと判断した判決は、世界で最も迫害されている少数民族の窮状を認識している。著者は、この判例によってジェノサイドの意図をより立証しやすくなり、ガザでのイスラエルに対する同様の訴訟においてジェノサイド認定の可能性が高まると論じている。ジェノサイドの立証には加害者の意図の証明が不可欠だが、指導者の公式声明は証拠となりにくいため、過去の判例から行動パターンから意図を推論することが確立されたと述べている。", "summary_en": "The international court of justice has settled questions over the issue of intent, with powerful implications for Israel The international court of justice (ICJ) decision last Thursday that Myanmar committed genocide against the Rohingya recognizes the plight of one of the world’s most persecuted mi", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/23/myanmar-genocide-ruling", "state_media": false, "category": "オピニオン", "full_text": "The international court of justice (ICJ) decision last Thursday that Myanmar committed genocide against the Rohingya recognizes the plight of one of the world’s most persecuted minorities. It also resonates in Gaza, where the same court is now more likely to find that Israel committed genocide against Palestinians.\nThat possibility has incensed the Donald Trump administration, but it should think twice before attacking another international tribunal.\nThe case stems from the Myanmar military’s brutal “clearance operations” in 2017 when it used murder, torture, rape and arson to kill at least 10,000 Rohingya and to send more than 700,000 fleeing to neighboring Bangladesh. The Rohingya are a Muslim minority that has long faced severe discrimination in Myanmar, whose dominant Bamar ethnic group tends to be Buddhist and have lighter skin.\nMyanmar has 135 recognized ethnic groups but refuses to accept the Rohingya as the 136th. A 1982 law denied most Rohingya citizenship despite their deep roots in the country.\nEven Aung San Suu Kyi, awarded the Nobel peace prize in 1991 as an icon of her country’s quest for democracy, refused to call them Rohingya. She preferred the disparaging appellation “Bengali” to suggest they were foreigners who immigrated from Bangladesh. In 2019, she traveled to The Hague to defend the Myanmar military from the genocide charge.\nHer actions reflected her fellow citizens’ vilification of the Rohingya. She also evidently hoped that by ingratiating herself with the military, it might allow her to become president despite a constitutional ban because her husband and two sons are British.\nInstead, the military overthrew the country’s fledgling democracy in 2021 and has detained her ever since.\nGenocide is defined in a widely ratified treaty. The Myanmar case, like many others, hinged on whether certain atrocities were committed with genocidal intent – that is, the intent to destroy a protected group, in this case a religious and ethnic minority, “in whole or in part”.\nThere was ample proof that the Myanmar army committed systematic murder, torture, rape and arson against the Rohingya, but did it have the requisite intent?\nIn theory, genocidal intent can be proved by the statements of senior officials, but most are smart enough to use less incendiary language. As a result, intent usually must be inferred from conduct.\nIn rulings on genocide cases brought by Bosnia and Croatia against Serbia, the ICJ held in 2007 and 2015 that such a deduction could be made if “the only reasonable inference to be drawn from that conduct is one of genocidal intent”. That suggested to some that genocidal intent could not be found to coexist with another intent.\nThat view seemed built on genocides designed to kill a group “in whole”. For example, after a certain point during the Holocaust and the genocide in Rwanda, the aim was to kill every possible Jew or Tutsi.\nBut what about a genocide aimed at killing a group “in part”? That might arise when genocide is not the sole goal of mass atrocities but a means to another end, such as ethnic cleansing.\nAccording to this interpretation, the ICJ’s Serbia rulings would perversely suggest that the commission of the crime against humanity of mass forced displacement might serve as a defense to allegations of genocidal intent. That made no sense.\nIn the Myanmar case, the court, by a vote of nine to six, interpreted this standard more sensibly. Citing general principles of criminal law, it ruled that dual intents were possible. “Genocidal intent may exist alongside other intentions, provided that such intentions are not incompatible with the existence of genocidal intent,” it explained.\nIn other words, its earlier ruling that genocidal intent must be shown to be the “only reasonable inference” from a course of conduct should not be read to mean that genocide is the sole intent. Rather, it meant there should be no reasonable understanding of the evidence that disproves genocidal intent, even if there was also a parallel intent.\nThe Myanmar government claimed its intent was not to commit genocide but to mount a counterinsurgency operation against a rebel group in the part of western Myanmar where most Rohingya lived. The court discounted that explanation because the army committed atrocities even in places where there was no insurgency and engaged in gratuitous atrocities such as raping women, killing children, burning villages and attacking fleeing civilians.\nMyanmar also asked the court to consider the possibility, never admitted, that its aim was forced displacement, not genocide. That paralleled the ICJ’s finding from the evidence against Serbia that it did not have genocidal intent.\nBut in the latest case, the court held that so long as the only reasonable inference from the evidence was that Myanmar intended to commit genocide, it didn’t matter that the evidence reasonably supported the conclusion that Myanmar also sought to forcibly displace the Rohingya or to fight an in", "translation_ja": "", "vocab": []}, {"title_ja": "現実世界が崩壊する中、グランド・セフト・オートはますます魅力的に見える", "title_en": "As the real world falls apart, Grand Theft Auto looks more and more appealing | Dave Schilling", "summary_ja": "著者は、GTA VIのリリースを機に、私たちが仮想世界への依存を深めている傾向を批判している。現実の世界がテック・インフラの障害や社会不安に直面する中、人々はゲームという逃避手段に引き込まれ、やがて現実そのものがゲームの世界に近づいていくという皮肉な状況を指摘している。デジタル製品の儚さと、私たちが構築した技術社会の脆弱性に対する警告でもある。", "summary_en": "All these tech outages are a reminder we’re at the mercy of powers beyond our comprehension. At least in GTA we have control This week marked the release of the highly anticipated video game Grand Theft Auto VI. Millions around the world checked out of their usual responsibilities in order to immers", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/22/grand-theft-auto-vi-gaming", "state_media": false, "category": "オピニオン", "full_text": "This week marked the release of the highly anticipated video game Grand Theft Auto VI. Millions around the world checked out of their usual responsibilities in order to immerse themselves in a game where you run errands for your girlfriend in between murdering people.\nI feel completely alone in not caring about GTA VI, as I famously only play video games where you get to be RoboCop – issuing public nuisance citations to graffiti taggers in between murdering people. I’m a man who knows what he likes.\nGTA VI has been over a decade in the making. The anticipation built to a fever pitch, with gaming enthusiasts practically going feral at the prospect of finally getting to schlep groceries and engage in casual bird-watching after brutally running over a pedestrian with a stolen Porsche.\nOur collective addiction to virtual mayhem is guaranteed to crash productivity all across the globe. I shudder to think what would happen if the game glitched out for everyone all at once, rendering your PS5 a slickly manufactured plastic paperweight. Would there be Paris-style riots turning every major city into a dystopian nightmare riddled with flaming trash bins and smashed shop windows?\nIn a sense, that would be a boon to fans of the game, as the world of flesh would start to resemble GTA come to blood-curdling life.\nMeanwhile, gaming is trending in the opposite direction. Most modern video game systems don’t even accept physical media anymore. The days of buying an actual disc in a little plastic box are nearly gone. Each game purchase is now just exchanging invisible digital money for the right to access the pixels and data that make virtual worlds come to life on your TV screen. It’s ephemeral, intangible, and it could all disappear in an instant.\nBut hey, that’s life in 2026, a time when hackers can turn off your refrigerator from halfway around the world. GTA VI digitally vaporizing at random would be catastrophic, but it wouldn’t be the first computer-related global inconvenience of the year, let alone the month or the week.\nFor the last seven days, the news has been dominated by outages in our tech infrastructure: grounded planes, broken email systems, bank accounts fritzing in and out of existence like a flickering lightbulb. The troubles have been blamed on software bugs, faulty patches, and outdated equipment.\nThe truly bored among us prefer to claim worldwide conspiracy theories, malicious hackers, or government manipulation that would have James Bond tossing his martini in the air and screaming: “This is all too much for me to handle.”\nMeanwhile, AI companies like Anthropic are growing exponentially as they seek to further entangle everyday life on Earth with their complex, interdependent, free-thinking computer systems.\nEven if these outages aren’t the direct result of AI, it’s all part of our brave new world. For the simple price of your money occasionally being completely inaccessible, you can have AI write a novel for you or remind you to pay your car insurance bill with the money you can’t use.\nThis plan seems to be a huge success for everyone but actual human beings with normal, non-billionaire lives. Besides tech companies, I suppose the other biggest winners in all this are bar owners, especially the ones at airports. When absolutely nothing works, the only sane response is to have a pint and laugh about it.\nIncreasingly, reality resembles a video game like GTA VI. Maybe without all the gruesome, wanton mayhem and surface-to-air missiles, but certainly with all of the other bits. As games start folding in more mundane tasks like shopping, going to the gym, or fixing a leaky roof, real life is taking on the rigid, mission-based thrill ride of the arcade.\nSorting through a health insurance claim is almost as annoying as a boss fight in a classic Sonic the Hedgehog game – repeated button-smashing, gnashed teeth, and frayed nerves. The mere notion of a shadowy cabal flipping switches to shut off various critical services makes me think of a caffeine-addled bachelor cackling as they wreak havoc in a particularly malicious game of Sim City.\nI often feel like a cuckolded non-playable game character, or NPC, watching more exciting events happen around me that I’m unable to control. If I want to be able to get on an airplane that actually leaves on time, I’m going to have to level up my XP or purchase a pay-to-win upgrade.\nIt’s not uncommon for me to imagine myself as an NPC avatar while strapped into the back of a Waymo driverless taxi, tooling from one checkpoint to another, silently praying the computer shuttling me to my destination doesn’t decide to change its mind and fly off a bridge into a river.\nWe’re all at the mercy of virtual powers beyond our comprehension. One can’t help but sink into the despairing realization that life is now a series of slights perpetuated by an algorithm with a callous disregard for the whims of corporeal beings.\nSo, what do we do when nothing works and everything is impossible? ", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアとの和解の時が来た", "title_en": "It’s Time to Settle With Russia", "summary_ja": "著者は、ウクライナ戦争を終わらせるためにはロシアに対する「棒」（制裁）だけでなく「人参」（譲歩）も必要だと主張している。2014年以降、特に2022年以降、ロシアは2万5千以上の制裁を受けているにもかかわらず、政策変更や戦場での劣勢には至っておらず、強制的手段だけでは十分ではないことが証明されたという。したがって、米国はウクライナとの交渉を進める際に、強硬手段と譲歩を組み合わせた戦略を追求すべきだと主張している。", "summary_en": "In October, U.S. President Donald Trump sold his eleventh-hour deal to secure diesel from Russian President Vladimir Putin—pausing sanctions that his own administration had imposed—as a boon for the negotiations to end the war in Ukraine. The arrangement, he wrote on Truth Social, was intended to ke", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/its-time-settle-russia", "state_media": false, "category": "オピニオン", "full_text": "In October, U.S. President Donald Trump sold his eleventh-hour deal to secure diesel from Russian President Vladimir Putin—pausing sanctions that his own administration had imposed—as a boon for the negotiations to end the war in Ukraine. The arrangement, he wrote on Truth Social, was intended to keep Russia at “the bargaining table.” Of course, it was always obvious to observers that the gambit had as much or more to do with bolstering the U.S. economy and stemming a massive victory for the Democrats in this month’s midterm elections, and in that, it failed.\nCynics have grounds for questioning all of Trump’s moves when it comes to Russia and Ukraine. He clearly dislikes Ukrainian President Volodymyr Zelensky and shows a marked preference for illiberal leaders, especially those willing to give him easy wins. Still, a stopped clock can be right twice a day. And concessions such as the fuel deal are exactly what might move Russia and Ukraine closer to peace, even if they are not wholly motivated by public-spiritedness.\nUkraine and its backers in Europe and the United States have long maintained that Russia only responds to sticks. The problem with their argument is that since 2014, and especially since 2022, Moscow has been subjected to nothing but sticks. According to Kaja Kallas, the European Union’s foreign policy chief, the more than 25,000 sanctions imposed on Russia after its full-scale invasion of Ukraine had cost its economy almost $1.5 trillion as of June. And although Trump has backed Ukraine less consistently than U.S. President Joe Biden did, especially in his rhetoric, his administration has still provided significant financial, military, and intelligence support; his CIA has been more aggressive than Biden’s in assisting Ukraine’s offensive and defensive air operations. All of these coercive measures have proved insufficient to compel a change in Putin’s policy or turn the tide in Ukraine’s favor on the battlefield.\nEuropean leaders may fret that Trump, now a lame duck and focused on his legacy, will push for a deal on Ukraine that suits the Kremlin’s interests more than their own. But ultimately, this remains a war in which Russia has the advantage. Europe should recognize that its pressure tactics have not worked and welcome the U.S. president’s willingness to throw in a few carrots among the many sticks used to try to beat the Kremlin into submission. Washington, meanwhile, should continue to pursue a concessionary strategy by encouraging Ukraine to surrender territory, freezing NATO’s expansion, and offering sanctions relief to Moscow. Putin has shown a willingness to sign favorable deals in the past, including the Minsk agreements in 2014 and 2015, which promised an end to the civil conflict in Donbas only to collapse under the duress of Kyiv and European capitals. A more enduring peace is desperately needed in Ukraine, however unfair the price may seem.\nTHINGS FALL APART\nUkraine has had some recent success on the battlefield. Early in 2026, Kyiv launched offensives in western Zaporizhzhia that erased a year of Russian gains there. During the summer, the Ukrainian military embarked on a major counteroffensive, Operation Vivaldi, that made significant progress near Liman, delaying Russia’s campaign to take the Donbas fortress cities of Kramatorsk and Sloviansk. And after four years, Ukrainian forces have finally inflicted serious, albeit not irreparable, damage to the bridge connecting Crimea and Russia, disrupting a military transport route and tarnishing a potent symbol of Putin-era expansionism. Kyiv has also brought the war home to segments of the Russian public with its attacks on oil infrastructure and commercial targets such as warehouses for Wildberries, Russia’s largest online retailer. Supporters in Western capitals have trumpeted these achievements as evidence that Ukraine has turned the tide in a war that previously seemed to be moving in Moscow’s favor.\nBut tactical wins do not necessarily add up to strategic victory. And, as Undersecretary of Defense for Policy Elbridge Colby reminded the Ukraine Defense Contact Group at a meeting earlier this month, the war will be decided on the ground. Casualties remain a huge problem for Ukraine. The few times Zelensky has addressed them, he has offered implausibly low figures for his side and cited astronomically high losses on the other. A recent study by Alexander Grable, a King’s College London war studies researcher, dissects these figures and concludes that Ukraine is suffering far higher casualties than Russia in absolute numbers—findings that, if true, refute the canard that Russia is uniquely careless with the lives of its soldiers. These days, while Ukraine pursues costly offensives to temporarily recover territory, Russia is taking cities and densely fortified areas by encirclement rather than frontal assault, reducing the risk to its fighters.\nAlthough Ukraine’s strikes on Russian oil infrastructure have disrupted refining and s", "translation_ja": "", "vocab": []}, {"title_ja": "議会と迫り来る危機", "title_en": "Congress and the Coming Crises", "summary_ja": "民主党は手頃な価格を公約に中間選挙で勝利したが、ガソリン価格、電気代、国債金利の上昇という深刻な課題に直面している。これらの問題は地政学的紛争、AI革命、持続不可能な国債という複雑に絡み合った要因に由来し、世界的な安全保障脅威をもたらしている。共和党の抵抗により迅速な行動は困難だが、民主党は超党派的協力と立法を通じて対応する必要があると著者は主張している。", "summary_en": "How to defuse looming threats to U.S. national security.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/congress-and-coming-crises", "state_media": false, "category": "オピニオン", "full_text": "Democrats won a historic victory in the U.S. midterm elections by running on a key voter concern: affordability. They promised to lower gas and diesel prices, curb electricity and water bills, and cut borrowing costs. Now voters expect results.\nMaking progress will not be easy, given that the affordability crisis is inextricably linked to a set of thorny policy issues. Soaring gas and diesel prices stem from wars in Europe and the Middle East that have overextended the United States and provided China, Iran, North Korea, and Russia openings to exploit. Rising electricity and water bills are driven by the growing number of data centers powering an artificial intelligence revolution that is nearing a point of no return, when machines improve faster than humans can understand or control. And higher prices and borrowing costs are the result of an unsustainable U.S. national debt, now above $40 trillion, that requires exorbitant interest payments and has foreign governments questioning the safety of the dollar and U.S. Treasury bonds.\nThese problems not only strain Americans’ pocketbooks but also threaten the security and prosperity of the United States—and the world. If Beijing and Moscow try to take advantage of a weakened United States by escalating simultaneously in Taiwan and eastern Europe, those moves could be the first steps toward World War III. If AI escapes the bounds of human control, no one will be safe. And if the national debt continues to soar, Washington could trigger a fiscal crisis that devastates the American economy and leaves the United States far less able to meet the challenges it faces overseas.\nAction to address the United States’ problems therefore cannot wait. But politics may stand in the way. The White House is more likely to obstruct than to cooperate with congressional Democrats over the next two years, as President Donald Trump’s appointment of the pugilistic Stephen Miller as the new White House chief of staff underscores. Moreover, one electoral victory did not erase the country’s deep partisan and policy divisions. Going into the 2028 presidential election, Republicans know that a successful Democratic Congress would endanger their chances of keeping the White House. Trump and congressional Republicans, therefore, have considerable motivation to derail Democratic plans.\nDemocrats are not without options, however. They can pursue legislation, seeking cross-party collaboration when possible and pushing ahead even in the face of presidential vetoes. Sometimes it is the president, not Congress, who blinks. When he doesn’t, voters will know who stood in the way. Democrats can also use public hearings and the investigative powers of Congress to shed light on the threats facing the country and to build a case for change—much as the Fulbright hearings did during the Vietnam War and the Church Committee did to highlight Cold War–era intelligence abuses. They can put the defense secretary and military commanders, AI executives, and Treasury and budget officials under oath to account for how they prosecuted the Iran war, raced ahead on AI without adequate safeguards, and exploded the deficit. They can also call on economists, scientists, and strategists to explain how to steer the country away from peril.\nCongressional efforts may not be enough to meaningfully change Trump’s policies. But the risks of major war, unconstrained AI, and eroding economic competitiveness are too great to wait two more years to address. These problems, and the affordability crisis they have generated, will only get worse. If Democrats in Congress do not start advancing a serious agenda to address them now, these dangers may become impossible to contain.\nMINUTES TO MIDNIGHT\nThe first order of the new Congress’s business should be to end the Iran war. Operation Epic Fury has sent energy prices soaring and put freedom of navigation at risk. It has also highlighted the United States’ vulnerabilities in ways that could prove dangerous—and costly—in the years ahead. Iranian missiles and drones wreaked havoc on American military bases in the Persian Gulf. U.S. efforts to defeat these attacks depleted supplies of critical munitions, showing that the U.S. military has become overly reliant on very expensive, hard-to-produce high-tech weapons. The economic, diplomatic, military, and intelligence support that China and Russia have provided Iran revealed the extent to which autocracies are cooperating to stretch U.S. capabilities and undermine American power. The U.S. Navy is effectively bottled up in the Arabian Sea, limiting its presence in the Atlantic and Pacific. In theory, U.S. allies could help fill the gaps, but Trump’s decision to launch the war without consulting them and his adversarial attitude toward them have strained those relationships, weakening deterrence of a Russia and China bent on securing strategic advantage.\nPerceptions of weakness, even when they are wrong, are often why wars begin. Moscow and Bei", "translation_ja": "", "vocab": []}, {"title_ja": "ベネズエラにおけるアメリカの悪い取引", "title_en": "America’s Bad Bargain in Venezuela", "summary_ja": "トランプ政権がマドゥーロ大統領を拘束後、ベネズエラの民主化と経済復興を約束したが、石油部門との取引により国家が重要な経済部門をコントロールする仕組みを強化しており、これは過去25年間の腐敗を助長してきた体制そのものである。同時に民主化努力は遅れており、野党指導者マリア・コリーナ・マチャドが交渉から除外されてきたため、民主化勢力はアメリカの十分な支援を受けられていない状況にある。マチャドの帰国により、ベネズエラの民主的転換の成否は彼女が現在交渉中の野党派閥と協調できるかどうかに大きく左右される可能性がある。", "summary_en": "Washington’s dealmaking is strengthening the Chavista regime.", "source": "Foreign Affairs", "tier": "opinion", "link": "ht elp her return. Venezuela’s pro-democracy forces have thus been left feeling like they are pushing the regime in Caracas to democratize with the acquiescence, but not necessarily the full enthusiasm, of the United States.\nLast month, Machado returned to Venezuela, and now she has the potential to change the game. Machado could become the greatest asset or, possibly, the greatest disruptor to Venezuela’s democratic transition. If Machado coordinates with the faction of the opposition that is currently negotiating with the government, any outcome will be seen as legitimate. But if she opposes and speaks out against the result, Venezuelans will find themselves in a familiar and dangerous place: with a divided opposition, a government with few constraints on its power, and a transition in purgatory.\nSo far, Washington has squandered its immense leverage over Caracas. By dragging out the transition and pursuing questionable economic deals, Washington is endangering not only its own end goal but also the greatest opportunity Venezuela has had to overcome more than a quarter century of autocratic governance.\nSTANDARD OPERATING PROCEDURES\nDuring Trump’s first term, his administration centered its criticism of Maduro on the country’s socialist model. In February 2019, weeks after recognizing the opposition leader Juan Guaidó as Venezuela’s interim president, Trump promised in a speech that the “twilight hour of socialism has arrived in our hemisphere.” That campaign to oust Maduro failed, but Trump’s diagnosis of what ails Venezuela was wrong to begin with. Over the past two decades, Venezuela has not been operating primarily under a socialist model but an extractivist one. And since January 3, the United States has seemed only to reinforce it.\nVenezuela is an oil state. Under Chavismo, the ideology named for Maduro’s predecessor Hugo Chávez, the state used oil revenues as a political slush fund to reward allies. Little went toward investments in the oil sector or the rest of the economy. Secret deals with oil magnates at home and abroad guided most governance decisions. Whereas the government’s critics faced legal attacks, the well-connected received impunity. Chávez implemented elements of socialism, of course, with massive nationalizations and price controls, but the key priority was collusion and special deals. Many of the state’s allies were poor Venezuelans whose votes kept the autocrats in power, but less noticed were the economic elites. These private actors shunned opposition figures and refrained from any public criticism of the regime; in exchange, they accumulated regulatory favors, access to preferential exchange rates, or exclusive contracts with the state. This model even applied internationally; around 2007, Chávez began redirecting oil sales from the United States to China, both to reward China for being so friendly toward the regime and to preempt a possible U.S. divestment from the Venezuelan oil sector. Oil booms in the first decade of the century allowed the country’s populist leaders to build vertical patronage systems that rewarded loyalty and starved out disse", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-24 05:03 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
