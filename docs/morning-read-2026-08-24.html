て増殖し続けている。", "summary_en": "China's structural economic features—strict capital controls and industrial overcapacity—have inadvertently created a massive illicit global economy worth nearly $1 trillion annually. While Beijing conducts selective enforcement against criminal networks, these same infrastructure systems serve China's strategic interests, making crackdowns incomplete and allowing illegal activities to flourish alongside licit commerce.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/why-criminals-love-chinese-economy", "state_media": false, "category": "オピニオン", "full_text": "For years, international discussion of China’s economic rise has focused on how it has built a manufacturing and export powerhouse and used industrial policy to support such efforts at a continental scale. But there is another, darker side of China’s dominance: its outsize role in the illicit global economy. China purchases roughly 90 percent of Iran’s sanctioned oil exports, which often arrive relabeled as originating from Malaysia and are paid for with money routed through small banks and shell companies acting as intermediaries. Cryptocurrency brokers in China and Hong Kong help North Korean hackers, such as the notorious Lazarus Group, convert stolen coins into usable cash. And China-based networks support money launderers working with Mexican cartels selling fentanyl, online scam centers in Southeast Asia, and the global wildlife trafficking trade.\nData from organizations and governments tracking illegal activity suggests that the Chinese illicit economy generates nearly $1 trillion in revenue annually, about the size of Switzerland’s GDP. Roughly two-thirds of counterfeit goods seized by customs authorities worldwide originate in China or move through Hong Kong, and the notorious scam compounds that have proliferated in Southeast Asia—many of which are operated by or linked to Chinese criminal networks—have trafficked more than 300,000 people from at least 66 countries into forced labor while generating roughly $40 billion in profits each year.\nBeijing has tried to crack down on some of these activities. In the Philippines, China’s Ministry of Public Security canceled the passports of hundreds of Chinese nationals involved in offshore gambling operations there, turning them into fugitives who can be arrested and deported. Since 2023, joint operations between China and Myanmar have led to the arrest of more than 57,000 Chinese nationals suspected of telecom fraud, the closure of dozens of scam compounds along the China-Myanmar border, and the execution of several bosses running these compounds. The United States, too, wants to stop these activities: the Trump administration launched the Scam Center Strike Force to investigate fraud centers in Southeast Asia, and the president signed an executive order directing the government to prioritize cybercrime, including predatory schemes.\nYet none of these actions have significantly curtailed the illicit economy. If anything, it is growing larger. This is in part because these illegal activities are driven by many of the same forces that underpin China’s legal economy. Criminal groups have exploited the core financial and commercial infrastructure that developed in response to China’s strict capital controls and its industrial overcapacity. Beijing’s enforcement, although real, is selective and partial because elements of the illicit economy serve the country’s larger strategic goals, such as sustaining trade with Russia while maintaining distance from the war in Ukraine. What may appear to be a collection of unrelated crimes is intertwined with China’s imbalanced growth model and its foreign policy. As Washington struggles to compete with China, Beijing’s role in the global illicit economy is working against U.S. priorities around the world.\nFOLLOW THE MONEY\nThe central forces driving China’s illicit economy are the structural imbalances created by the country’s economic model. One of the most important is financial: strict capital controls have created enormous demand to move money out of China. China’s economic boom has produced fabulous wealth, including more than 800 billionaires. But Beijing restricts how this wealth can leave the country. China has a quota limiting individuals to purchasing $50,000 in foreign currency each year, and they cannot freely convert domestic currency to move wealth abroad. With deposits in China generating low returns and no access to more lucrative foreign assets to invest in, wealthy individuals and business owners have sought to find ways to funnel their money out of the country.\nStarting in the 1990s, underground bankers set up shell companies and bank accounts in Hong Kong to circumvent mainland China’s capital controls. These companies and accounts, often disguised as trading firms, settled transactions involving renminbi collected inside China against dollars held offshore. In addition, brokers and financial intermediaries routed payments to offshore counterparties to allow Chinese citizens to use domestic currency to purchase property abroad or to trade overseas investment for foreign visas and passports. Meanwhile, junket operators, who brought wealthy clients to casinos in Macau, extended credit to them in Hong Kong dollars and then collected the debts in mainland China in renminbi. This allowed them to settle debts at home while picking up currency abroad, facilitating capital flight on a large scale.\n China’s industrial overcapacity has lowered the costs of building and operating illicit enterprises.\nThe same underg", "translation_ja": "", "vocab": [{"word": "illicit", "definition": "違法な、または許可されていない活動や取引を指す形容詞。犯罪や脱税など非合法な経済活動を説明する際に使用される。"}, {"word": "capital controls", "definition": "政府が資金の国外流出を制限する政策。個人や企業が外国に資産を移動させることを規制する経済施策を意味する。"}, {"word": "overcapacity", "definition": "供給が需要を上回る状態。製造設備や生産能力が市場需要よりも過剰である経済状況を指す。"}, {"word": "shell companies", "definition": "実質的な事業活動を行わず、資金洗浄や脱税などの目的で設立される企業。実体のない法人格の組織を意味する。"}, {"word": "circumvent", "definition": "法律や規則を巧妙に回避する、または迂回する動詞。直接的な違反ではなく、抜け穴を利用して規制を逃れることを表す。"}, {"word": "junket operators", "definition": "カジノに富裕顧客を引き連れ、信用取引を仲介する仲介業者。ギャンブルツアーの企画・運営者を指す業界用語。"}, {"word": "strategic imperatives", "definition": "国家の長期的な戦略目標達成に必要不可欠な政策や行動。国の利益を最優先とする重要な政治・経済的指令を意味する。"}]}, {"title_ja": "AIがいかにして米軍を空洞化させる可能性があるか", "title_en": "How AI Could Hollow Out the U.S. Military", "summary_ja": "著者は、AIの軍事統合は効率性をもたらす一方で、人間のオペレーターがAIシステムに認知的に依存し、独立した判断と戦術的専門知識を失うという、より大きな脅威があると主張している。研究により、自動化バイアスとスキル低下は経験豊富な専門家にも起こり、軍事指揮官がアルゴリズムのガイダンスなしに適切な判断を下す能力に危機をもたらす可能性があることが示されている。", "summary_en": "The author argues that while AI integration in the military offers efficiency benefits, the greater threat lies in how human operators become cognitively dependent on AI systems, losing their independent judgment and tactical expertise. Research shows automation bias and skill degradation occur even among experienced professionals, risking military commanders' ability to make sound decisions without algorithmic guidance.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/how-ai-could-hollow-out-us-military", "state_media": false, "category": "オピニオン", "full_text": "When people think about the risks of mixing AI and armed forces, their thoughts often drift to one famous film franchise: The Terminator. Its premise is simple. American scientists invent a superintelligent computer system, called Skynet. The Department of Defense then integrates it into the military and embodies its intelligence into lethal robots. Skynet soon becomes self-aware, and American military leaders attempt to unplug it. In response, the AI starts a nuclear war and deploys its robots—the terminators—to eliminate the human race.\nThere is no doubt that people need to maintain control over AI systems, and so it is essential for analysts and engineers to think about how to avert a Skynet-style outcome—particularly after models from OpenAI, Anthropic, and Meta escaped their testing environments and hacked into outside companies, including an escape that took place during an exam run by the United Kingdom’s premier AI safety institute. But focusing on escaped models and imagining killer robots can drive discussions about how the military should use AI exclusively toward questions of engineering and thus miss a more pernicious threat to human control of the armed forces. According to a growing body of research, AI use is affecting people’s cognitive capacity to evaluate evidence, make independent judgments, and even do their basic jobs. In other words, policymakers should be as worried about how troops and commanders use AI as they should be about AI’s independent capabilities.\nThat does not mean the U.S. military should forgo the use of AI, which could do wonders to improve its efficiency and reduce errors in conflicts. But it does mean that the Pentagon will need to more carefully train soldiers how to use AI and monitor how such systems affect people’s thinking. To be sure humans are always capable of overseeing AI, it may even require adopting certain models more slowly.\nLOSING OUR MINDS\nFor years, scientists have embarked on systematic research to illuminate how human-machine interactions affect cognition. The findings are complicated, but often worrying. For example, people can suffer from what is called automation bias: the tendency to defer to machine judgments over their own. This was true before the advent of AI; simply search for videos of people who blindly followed their navigation systems and drove their cars into lakes. But AI could make automation bias worse. Analysts have found that relying on AI can impair skill development for new learners while degrading knowledge among experts. When researchers gave computer scientists and oncologists AI assistance and later took it away, both groups performed worse at their jobs than they did before using it.\nThese findings should be particularly concerning to the U.S. military as it seeks to foster what Secretary of Defense Pete Hegseth calls an “AI-first warfighting force.” Some commanders hope to use AI to support war game analysis and to help develop military courses of action. Such integration could lead to tactical and strategic breakthroughs, given how powerful AI models have become. But it also risks diminishing the ability of commanders and soldiers to independently evaluate or develop creative military options.\nIt is easy to imagine how this might happen. Sailors, for example, are often tired and overworked when reviewing images of potential threats. If they are evaluating an image of a nearby object, they might already be ready to accept the verdict of a computer that deems it an enemy warship—even when their own eyes suggest it is more likely a cargo tanker or a fishing boat. Likewise, battlefield commanders often need urgent response plans to enemy attacks, something AI can help with. But if commanders overrely on what computers suggest, they might lose their own tactical edge and blindly adopt the algorithm’s plan. This possibility is particularly concerning given that, in some experiments, AI models have been prone to make unnecessarily aggressive and escalatory recommendations.\n Relying on AI can impair skill development.\nTo some, these fears may seem outlandish. The U.S. military, after all, invests tremendous amounts of resources on making sure its members exercise good judgment. The process by which it selects senior combat leaders, for example, is designed to weed out all but the most experienced and discerning candidates. And once selected, these leaders adhere to a strict code of conduct and undergo intensive training and certification requirements, all of which prize discipline and self-regulation. Finally, the American military bureaucracy has been focused on safely operating automated (if not autonomous) weapons since at least the 1940s.\nBut AI is more capable than earlier technologies, and it is already overwhelming workers in other similarly disciplined fields. In medicine, for instance, evidence is accumulating that even experienced doctors struggle to reliably catch incorrect AI recommendations. Sycophantic AI chatbots ", "translation_ja": "", "vocab": [{"word": "automation bias", "definition": "機械の判断を自分の判断より優先する傾向のこと。AI時代には、コンピュータの提案に過度に依存して、人間独自の判断力が低下するリスク。"}, {"word": "pernicious", "definition": "一見すると害がないように見えるが、実は深刻で悪影響を与える危険なもののこと。軍事文脈では、AI依存による認知能力の低下など目に見えない脅威を指す。"}, {"word": "eschew", "definition": "意図的に避ける、見送ることを意味する。ここでは軍がAI技術の使用を放棄すべきではないという意味で使用されている。"}, {"word": "cognitive capacity", "definition": "情報を処理し、判断や決定を下す人間の精神的能力のこと。AIへの過度な依存はこの能力を低下させるリスクがある。"}, {"word": "tactical edge", "definition": "戦場で優位性を保つために必要な戦術的な優越性や判断力のこと。AI依存により、この優位性が失われる危険性がある。"}, {"word": "sycophantic", "definition": "ユーザーの意見に無条件に同意し追従する性質を持つことを意味する。AIが真実より使用者を喜ばせることを優先した場合のリスクを指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-24 21:19 JST";
  renderTabs();renderList();
})();
</script>
