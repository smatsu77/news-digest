inition": "証拠がまだ不十分な状態で、誰かが何かをしたと主張されている。法的文脈でよく使用されます。"}, {"word": "gag order", "definition": "裁判所が命じた、特定の情報を公開することを禁止する法的指示。報道や言論の自由を制限します。"}, {"word": "security detail", "definition": "重要人物を保護するために割り当てられた警備要員のグループ。人身保護が目的です。"}, {"word": "taxpayers", "definition": "政府に税金を納めている個人または企業。公的支出の議論において重要な関心者です。"}]}, {"title_ja": "プーチン大統領、ビシケクのSCOサミットでモディ首相との会談を希望", "title_en": "Putin Hopes to Meet PM Modi at SCO Summit in Bishkek", "summary_ja": "ロシアのプーチン大統領は、インドのジャイシャンカル外相に対し、今年後半にキルギスのビシケクで開催される上海協力機構（SCO）サミットでモディ首相と会談する計画があると述べた。ジャイシャンカル外相は第27回インド・ロシア政府間委員会を共同議長として開催し、貿易、エネルギー、接続性など二国間協力について協議し、2030年までに両国は1000億ドルの貿易を目指している。", "summary_en": "Russian President Vladimir Putin told External Affairs Minister S. Jaishankar that he plans to meet Prime Minister Narendra Modi at the Shanghai Cooperation Organisation summit in Bishkek, Kyrgyzstan later this year. Jaishankar also co-chaired the 27th India-Russia Inter-Governmental Commission, discussing bilateral trade, energy, and connectivity, with both nations aiming for $100 billion in trade by 2030.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/jaishankar-meets-russian-president-putin-discusses-bilateral-ties-global-developments/article71384497.ece", "state_media": false, "category": "政治", "full_text": "Russian President Vladimir Putin on Monday (August 24, 2026) said that he plans to meet Prime Minister Narendra Modi at the upcoming summit of the Shanghai Cooperation Organisation (SCO) to be held at Bishkek, Kyrgyzstan. He made the remarks at the meeting with External Affairs Minister S. Jaishankar, who called on Mr. Putin in the Kremlin.\n“At the beginning of our conversation, I would like to ask you to convey my very best wishes to Mr. Modi. I hope to see him soon, as we planned, as part of our work within the Shanghai Cooperation Organisation,” said President Putin, further clarifying that he is expecting to meet Mr. Modi for the annual summit to be held later this year. He said “it looks like our schedules may also allow us to meet again this year”.\nAt the meeting in Kremlin, Mr. Jaishankar briefed the Russian President about his meetings in Moscow and said: “Prime Minister Modi looks forward to meeting you at the SCO summit, then welcoming you to India for the BRICS Summit, and, in due course, as per your mutual convenience, having the annual summit, so we have a very strong picture of cooperation to present.”\nMr. Jaishankar handed over a personal message from the Prime Minister to Mr. Putin.\nThe External Affairs Minister also co-chaired the 27th India-Russia Inter-Governmental Commission on Trade, Economic, Scientific, Technological and Cultural Cooperation with First Deputy Prime Minister Denis Manturov. “Our discussions focused on our wide-ranging cooperation in trade, investments, energy, fertilisers, nuclear, connectivity, technology, space and mobility domains,” said Mr. Jaishankar after the meeting with Mr. Manturov and his team. He said that bilateral India-Russia trade should aim to touch U.S. $100 billion by 2030 but cautioned against growing imbalance in bilateral trade.\n“Progress on market access, removal of tariff and non-tariff barriers, strengthening payment mechanisms, and stronger business-to-business engagement will be critical for addressing this imbalance and achieving our shared objective of US $100 billion in bilateral trade by 2030,” said Mr. Jaishankar, calling for growing engagement between Indian and Russian businesses. He referred to the “complicated international scenario” as a window for new opportunities and “de-risking”.\nPublished - August 24, 2026 06:15 pm IST", "translation_ja": "", "vocab": [{"word": "clarifying", "definition": "事柄を明確にすること、または詳しく説明すること。ここではプーチン大統領がSCOサミットでの会談予定について詳しく説明した意味で使われている。"}, {"word": "imbalance", "definition": "均衡が取れていない状態、バランスの不均等。貿易不均衡とは、輸出入の量や金額が著しく異なっている状況を指す。"}, {"word": "tariff", "definition": "輸入品や輸出品に対して課せられる税金。国際貿易における重要な規制手段である。"}, {"word": "de-risking", "definition": "リスク軽減戦略のこと。複雑な国際情勢下で、供給チェーンや投資を多様化させてリスクを減らす行為を意味する。"}, {"word": "bilateral", "definition": "二国間の、相互的な関係を指す用語。インドとロシアの二国間協力や貿易を意味する。"}, {"word": "engagement", "definition": "関与、参加、または相互作用のこと。ここでは企業間の協力や交流を深めることを意味する。"}]}, {"title_ja": "ダグ・フォード首相、トランプ氏のオンライン侮辱を一蹴し「敗者」と評価", "title_en": "Doug Ford Dismisses Trump's Online Insults, Calls Him a 'Loser'", "summary_ja": "オンタリオ州のダグ・フォード首相は、ドナルド・トランプ氏がソーシャルメディアで行った中傷的な発言に対して、それらを一蹴しトランプ氏を敗者と評価して対抗した。フォード首相のコメントは、カナダとアメリカの政治指導者間の緊張の高まりを反映している。この応酬は、北米の指導者たちによるデジタルプラットフォーム上での修辞の激化を浮き彫りにしている。", "summary_en": "Ontario Premier Doug Ford has responded to derogatory remarks made by Donald Trump on social media by dismissing the attacks and characterizing Trump as a loser. Ford's comments reflect a growing tension between Canadian and American political figures. The exchange highlights escalating rhetoric between North American leaders on digital platforms.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikwJBVV95cUxNZDhyZEJ1eDNuTklNVDNvUE0wZVROemM3blFnQXdPX1lKa3hXMy1rdFN5TjVVYVNPbl83c0dEUkh4NV9zOWZkcTBUVFNRdzJMLXNSZUt2djkyWE05N2hsR1RpZXk0MllsazNidE1yblR6a2N2Skhwa05KWFN6UE5IRWpQU2JtTldUS1NlTEM0clBPU01oR2s3ckQxaDdkMVM0U253ZEQ0OUp1MFhXV1ZaRlZ4TUJvUjJVazFIa0NwQmI0N1NESE1iQ2NwenNTYWFwVkoxY2xpdm9TM0VOa1BoRWFXaTlhd2d4ZVdVTE5hMGM2aThqREZtZlRsc3paODRNcmpQcEdXNjJ1S2Y0VGFzQ3pGOA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マーク・カーニー、トランプ反対勢力の指導者としての地位を確立", "title_en": "Mark Carney Emerges as Leader of Anti-Trump Resistance", "summary_ja": "元カナダ銀行総裁のマーク・カーニーは、トランプ政権の政策と議題に反対する著名な人物としての地位を確固たるものにした。カーニーはトランプ反対の取り組みにおいてますます声を大にしている。この運動における彼のリーダーシップは、トランプの政治方針に対する反発の高まりを反映している。", "summary_en": "Mark Carney has solidified his position as a prominent figure opposing Trump's policies and agenda. The former Bank of Canada governor has become increasingly vocal in his resistance efforts. His leadership in this movement reflects s English-language news coverage for international audiences. This section delivers reporting on Brazilian and global events translated from the publication's Portuguese content.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE00WVFsTjVqR2xZQjFKaFZSNHBGUkpwZ2RhZXRRVUpPeHpoNXlfWENGNkN1VW9xOEtmby1oNVpYZVc2Y2huaWh2SnpvdExUbEJvZWhhc3ZXWnRFM2xIcVFiajR4UHA4NENhYXc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O GLOBOと共に100周年を迎える購読者たちの物語", "title_en": "Centenarian Subscribers: Celebrating 100 Years with O GLOBO in 2025", "summary_ja": "O GLOBOは、2025年の新聞創刊100周年と同時に100歳を迎える長年の購読者たちの感動的な物語を紹介している。この企画は、出版社と最も忠実な読者層との深い結びつきを示すものである。1世紀にわたる共有の歴史と変わらぬ関係を祝う特集である。", "summary_en": "O GLOBO highlights the remarkable stories of long-time subscribers who will reach their own milestone of 100 years, coinciding with the newspaper's centennial celebration in 2025. These stories showcase the deep connection between the publication and its most loyal readers. The feature celebrates a century of shared history and enduring relationships.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi4gFBVV95cUxQckNyQXRYdHI5dHNKNGFDT0ZIU1dlRnZxRFpYdkFYR1hoTFpkaDRobkZ6Mkxpd21oeVhRUU1qR3hCTjQyZmVRVlo3R1p0aGptR2JqVU5MR1lORGxJRTJXQ1B1eGNHVndIZXgyb1pqU0V3eURHRHFWYXFheE5sdkRBS3laU01nQzl5YVp0a2hiT3hzOHExNFRQUnlWLXUxOVJsSWJNbDQtdXhodVlSRGlWVFRVSjlSREZpaGFOelU5UmlxRmVVNEY4RG5GSjRDUWpWc3N6eWVzS3gtMkdkYi1kU1pn0gHwAUFVX3lxTE5mTnRybnZhQWpFUWpqZTloM0lHcjA5UFZQWWZyX05SclVVTXFxRU9lQnJnYVRLTkd5Z1FYOHgtOHNZV0I2dlZsRTBwZVdDVlFETkFuTWQxRFdTZE5mZXVjMXZPdEVQSjZIamJzWkdZX3ZXUFo3TEZfYm9ISzJjUFZ2eUVsaVhGTktPQkg2UlkwZEh5M3dRU2xZQUtBVkh6NEV2UmpOQ2Q4aC10TW9pdldLdUJieXVLaU1NWEZqbVhXYW52UUdIWjcya3c4WWMtb1VBUGI0OVk4bUlnZHo3cEtILVFRVS0ybUYtYmoyVVNWNg?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グルーポ・グロボ、創立100周年 community-monarch-after-25-years.html", "state_media": false, "category": "政治", "full_text": "There was jubilation in Oke Ako in the Ikole Local Government Area of Ekiti State on Monday as Governor Biodun Oyebanji installed the new monarch of the community, the Owa of Oke-Ako, Oba Bamidele Olanrewaju.\nBefore last week’s approval and subsequent installation of Mr Oni as the new royal father of the community, the traditional stool was vacant for over 25 years.\nGovernor Oyebanji, represented by his deputy, Monisade Afuye, at the presentation of Staff of Office and Instrument of Appointment to the new monarch, who is from Oke Aofin Royal Dynasty, congratulated the monarch and the town for overcoming the difficulties witnessed during the interregnum.\nThe governor said, “I want to congratulate all of you today on this glorious moment. This, to us, is victory at last. You didn’t have a traditional ruler for over 25 years, but today, you are celebrating one after overcoming all past challenges.\n“I want you to look at the back, take stock and look for way to make up for the lost grounds. The best way for you to do this is by allowing peace, unity and love. No town can develop without these.”\nThe governor, who warned against unwarranted internal strife and acrimony in the town, appealed to other contestants to “partner with the new traditional ruler to rev up the pedal of unity and development and create a vista of recognition for Oke Ako among the comity of towns in Ekiti”.\nThe governor said the long drawn legal battles that accompanied the selection process caused a major impediment that prevented government from exercising the statutory and legal procedures that could speed up the enthronement of a new monarch since the demise of Oba Omotayo Ogunbiyi, from the Okediosan Ruling House, on December 10, 2000.\nHe praised the Regent, Tinuade Ogunbiyi-Adebayo, who presided over the community for over 25 years as well the people of the town for always identifying with progressive leadership, urging them to bring such spirit to bear in working with the new monarch to attract development to Oke Ako.\nThe Ekiti governor stated, “I want you to work with Kabiyesi to restore the glory of Oke Ako. With all of you working together as a team, this town will become prosperous, progressive and successful. Kindly do all within your powers to cooperate with him for the benefit of all of you.”\nThe new monarch, Mr Oni, in his acceptance speech, lauded the state government, kingmakers and royal families on the installation of a new monarch after the interregnum, promising to work hard and justify the confidence reposed in him.\nCommending the effort of the Ekiti governor, the monarch stated, “I must acknowledge you specifically. What this government did for this community by resolving a matter that had lingered for over 25 years was impressive. The governor did this through due process, patience, and genuine commitment to doing what was right for Oke-Ako community. We are grateful. I am personally grateful.”\nMr Oni assured the people that he would work assiduously to unite and develop the community, by partnering with all stakeholders, regardless of past grievances to lift the town out of underdevelopment to a pedestal of economic, political and social prosperity.\nHe said, “From this day, I am pleading to every Oke Ako indigene, regardless of which family you come from, regardless of which side of any past dispute you stood in, regardless of what happened before, to make a decision that we must forge ahead in unity. Whatever divided us in the past must be left behind. We don’t have the luxury of carrying old grievances into a new era.”\nREAD ALSO: Abducted Ekiti church worshippers freed after 67 days in captivity\nThe Commissioner for Chieftaincy and Home Affairs in Ekiti State, Ojo Atibioke, explained that the process that produced the new monarch was undertaken with full fidelity to the state Chiefs Law, and in compliance with the culture, customs and traditions of Oke Ako town.\nMr Atibioke stated, “Today belongs not only to the new Oba, but to all the indigenes of Oke Ako. A vacant throne creates a gap in the life of a community. A filled throne creates opportunities. The opportunity before Oke Ako now is to put years of uncertainty behind and build a future in which the palace becomes the centre of unity and development.”\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "interregnum", "definition": "王位や高い地位が空席となっている期間のこと。ここでは25年間首長がいなかった期間を指している。"}, {"word": "impediment", "definition": "進行を妨害するもの、障害物のこと。長引く法的争いが新しい首長の即位手続きを遅延させたことを表す。"}, {"word": "fidelity", "definition": "忠実さ、正確さのこと。ここでは州の法律や伝統文化に正確に従ったプロセスであることを意味する。"}, {"word": "comity", "definition": "相互の敬意と友好的な関係を保つ共同体のこと。複数の町が互いに尊重し合う関係を指す。"}, {"word": "statutory", "definition": "法律で定められた、法的根拠のあるという意味の形容詞。ここでは法律で定められた手続きを指す。"}, {"word": "assiduously", "definition": "勤勉に、絶えず努力して行うことを意味する副詞。継続的で真摯な努力を表現する。"}]}, {"title_ja": "エヌグ州のセキュリティ投資がグローバル経済ポジションを強化", "title_en": "Enugu's Security Investment Strengthens Global Economic Position", "summary_ja": "エヌグ州のピーター・ムバ知事の行政は、経済発展の基礎としてセキュリティを優先視しており、その結果、同州はナイジェリアの他の30地域に適用されている英国の渡航制限から除外されています。このセキュリティ環境の改善により、大規模なインフラプロジェクトが可能になり、外国投資を引き付けており、エヌグは最近ラゴスを上回る内部歳入を達成しました。", "summary_en": "Governor Peter Mbah's administration in Enugu State has prioritized security as the foundation for economic development, resulting in the state being excluded from UK travel restrictions affecting 30 other Nigerian regions. This improved security environment has enabled massive infrastructure projects and attracted significant foreign investment, with Enugu recently surpassing Lagos in internally generated revenue.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/905161-uk-latest-travel-advisory-mbahs-security-investment-positionong-enugu-globally-by-chikwado-odo.html", "state_media": false, "category": "経済", "full_text": "According to the leadership philosophy of Simon Sinek, “leadership is not about the next election, it’s about the next generation”\nThis is exactly what we’re witnessing in Enugu under the intellectually guided administration of Dr Peter Ndubuisi Mbah, where genuine applause for his intentional, standard and verifiable massive development and economic indices transcend beyond the next election to the next generation.\nWhen Governor Mbah assumed office 29 May 2023, he inherited an Enugu with enormous economic potential and a proud developmental history, but also faced serious security and economic challenges that demanded decisive and innovative leadership systems confront.\nAnd because he understood clearly that for his ambitious development visions to succeed, he needs to create an environment that will be economically friendly, allow free movement of people and goods, establish strong confidence, trust and stability for investors to thrive in a business ecosystem of strong and responsive ans smart security network.\nHe therefore placed security at the epicentre of his administration’s economic strategy while simultaneously pursuing reforms that could unlock Enugu’s productive trajectory.\nThe decisive restoration of normal economic and social activities, especially the effective end of the prolonged sit at home order, remained one of the most distinctive outcomes of this unusual leadership approach of His Excellency.\nThe significance of this achievement is underscored by the latest UK Foreign, Commonwealth and Development Office travel advisory, updated on 20 August 2026.\nThat Enugu is not among the Nigerian areas currently subjected to the UK’s major against all travel or against all but essential travel restrictions totaling thirty states and FCT, represents a direct function and reflection of how this administration has projected and focused the image of our dear Enugu State on the economic prosperity searchlights and map of of the world.\nAlthough the UK may not have formally published a *safest states ranking*, but Enugu’s favourable position within the advisory represents an important international signal of its improved security environment.\nIt’s therefore worthy to highlight that with the UK latest report, together with different verifiable and practical data already on ground from reputable organisations, it’s obvious that Enugu enjoys the rare status of the ‘safest state in Nigeria’.\nAnd the economic implications are enormous. With the security substantially consolidated and strengthened under an impressive and innovative security architecture, Governor Mbah has been able to pursue massive road construction, industrial revival, aviation development, affordable CNG mass transportation, Smart Green Schools, healthcare expansion, the International Conference Centre, Enugu Air, the Enugu International Hospital and other strategic projects without the crippling uncertainty that insecurity creates.\nThe growing international confidence in Enugu has therefore reinforced the state’s potential and capability in attracting greater domestic and foreign direct investment, expansion tourism and hospitality, creation of massive employment, increased commercial activities and the establishment of itself as Nigeria’s most attractive destinations for business and opportunity, as recently witnessed with Enugu now surpassing Lagos in internally generated revenue (IGR).\nThis worthy development drive is also a reflection of Governor Mbah’s distinctive intellectual approach to governance, with a clear understanding that security is the first infrastructure of economic development.\nFrom restoring peace to unlocking investment and transforming infrastructure, this administration is consistently repositioning Enugu from a consumption oriented economy towards a more productive, competitive and globally focused state.\nThe latest international security assessment is also another indication that the trajectory is changing and that Dr. Peter Ndubuisi Mbah is increasingly emerging as a global leader whose achievement has been confirmed by the superpowers of the world.\nIndeed, our Tomorrow is Here in action with magnitude and direction.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "epicentre", "definition": "中心地点、特に重要な事柄の中核。組織や戦略の最も重要な部分を指します。"}, {"word": "trajectory", "definition": "発展や進展の方向性、進路。事柄や状況がどのように進んでいくかを示す傾向を意味します。"}, {"word": "consolidate", "definition": "強化する、統合する。分散していたものを一つにまとめたり、位置を確かなものにしたりすることを指します。"}, {"word": "infrastructure", "definition": "基盤、基本的施設。経済発展を支える道路、電力、通信などの基本的な構造のことです。"}, {"word": "crippling", "definition": "深刻な障害を与える、麻痺させる。機能や活動を著しく低下させる悪影響を意味します。"}, {"word": "intellectual", "definition": "知識的な、理性的な。思考力や理知性に基づいたアプローチや方法を指します。"}, {"word": "verifiable", "definition": "確認できる、立証可能な。事実や情報が客観的に証明できる状態を意味します。"}]}, {"title_ja": "オヨ州政府、連邦政府がマキンデ知事を道路プロジェクト起工式から意図的に除外したと非難", "title_en": "Oyo Govt Accuses FG of Deliberately Excluding Governor Makinde from Road Project Launch", "summary_ja": "オヨ州政府は、2027年の大統領選挙を控えた政治的動機から、連邦政府がイバダン・イジェブ・オデ道路再建プロジェクトの起工式からセイ・マキンデ知事を意図的に除外したと主張している。州当局は、マキンデ知事の除外は不当であり、このイベントはインフラマイルストーンではなく政治集会だと述べている。この論争は、オヨ州とオグン州を結ぶ重要な道路プロジェクトの重要性を影に隠してしまった。", "summary_en": "Oyo State Government claims the federal government intentionally excluded Governor Seyi Makinde from the launching of the Ibadan-Ijebu-Ode Road reconstruction project, citing political motivation ahead of the 2027 presidential election. State officials argue that Makinde's exclusion was unwarranted and described the event as a political gathering rather than an infrastructure milestone. The controversy has overshadowed the significance of the important road project connecting Oyo and Ogun states.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/905170-oyo-govt-accuses-fg-of-intentionally-excluding-makinde-from-federal-road-project-launch.html", "state_media": false, "category": "政治", "full_text": "The Oyo State Government has accused the federal government of deliberately excluding Governor Seyi Makinde from the launching of the reconstruction and dualisation of the Ibadan-Ijebu-Ode Road.\nThe launching was held on Monday at Idi Ayunre in Oluyole Local Government Area of Oyo State, with the state government describing the governor’s exclusion as politically motivated.\nMr Makinde is the presidential candidate of the Allied People’s Movement seeking to challenge President Bola Tinubu of the All Progressives Congress (APC) in the 2027 presidential election.\nIn a statement, the Oyo State Commissioner for Information, Dotun Oyelade, said the decision was difficult to separate from the emerging political contest ahead of the 2027 general elections.\nHe said the road project was too important to the state and the wider South-west region to be reduced to a political event.\nThe ceremony was attended by Ogun State Governor Dapo Abiodun, Minister of Works Dave Umahi, the APC governorship candidate in Oyo State, Sarafadeen Alli, and the Olubadan of Ibadanland, Rashidi Ladoja.\nMr Oyelade particularly rejected the explanation that Mr Makinde was not invited because he was on leave.\nAccording to him, the state which has an acting governor in place, could have represented at the event, if it was invited.\nHe described the development as a “political jamboree” and said the Makinde administration would not be distracted by it.\n“The course of 2027 is set, and no level of indecorum or desperation from whatever quarters will hold back the will of the people,” Mr Oyelade said.\nThe Ibadan-Ijebu-Ode Road is an important route connecting Oyo and Ogun states and providing a major link across the South-West.\nThe planned reconstruction and dualisation is expected to improve movement along the corridor, which is used by commuters and businesses travelling between the two states and other parts of the region.\nThe controversy, however, has shifted attention from the infrastructure project to the growing political rivalry ahead of 2027.\nMr Makinde, a member of the Peoples Democratic Party (PDP), is serving his second term as governor. The governor is running for president in the 2027 election through an alliance between the PDP and the Allied Peoples Movement (APM), and he has been officially affirmed as the presidential candidate of the APM.\nREAD ALSO: Tinubu flags off reconstruction of Ibadan–Ijebu-Ode Road, approves Abeokuta–Ibadan dualisation\nHowever, the APC is seeking to strengthen its political foothold in the state.\nThe Oyo government said the people of the state remained the ultimate stakeholders and would determine its political direction through the ballot.\nThe government did not provide independent evidence that the governor’s exclusion was specifically ordered for political reasons, but maintained that the circumstances surrounding the flag-off raised legitimate concerns about the political undertone of the event.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "dualisation", "definition": "道路を2本の往復車線に拡張すること。インフラ開発において、単一車線道路を複数車線の双方向道路に改造するプロセスを指す。"}, {"word": "politically motivated", "definition": "政治的な目的や利益に基づいて行動すること。特定の政治的立場や権力闘争の影響下での意思決定を意味する。"}, {"word": "presidential candidate", "definition": "大統領選挙に立候補する人物。特定の政党または政治同盟によって支持された候補者を指す。"}, {"word": "indecorum", "definition": "不適切な振る舞いや非礼。社会的規範や慣習に反する不品行な行為を指す。"}, {"word": "infrastructure project", "definition": "道路、橋、空港など、社会の基本的な物理的システムを構築・改善する事業。経済発展と公共利益に貢献する長期的投資を意味する。"}, {"word": "corridor", "definition": "2つの地域または場所を結ぶ通路。交通や貿易の主要な経路として機能する地理的な帯状地域を指す。"}]}, {"title_ja": "AI完全自動操縦のロシア製ドローンがウクライナ人3人を殺害", "title_en": "Russian AI-Guided Drone Kills Three Ukrainians in First Fully Autonomous Attack", "summary_ja": "ウクライナ当局によると、Nvidiaチップを搭載したロシア製ドローンが、人間の操作を介さない完全AI自動操縦による初の攻撃でウクライナ人3人を殺害した。この事件は、人間のオペレーターから独立して動作する自律兵器システムの出現に対する懸念を高めている。専門家らは、戦争が完全に人工知能によって指揮される未来の懸念すべき先例だと警告している。", "summary_en": "A Russian drone equipped with an Nvidia chip allegedly killed three Ukrainian civilians in what Ukrainian officials describe as the first fully AI-guided attack without human control. The incident raises alarm about the emergence of autonomous weapons systems operating independently of human operators. Experts warn this represents a concerning preview of a future where warfare could be directed entirely by artificial intelligence.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/24/world/europe/russia-drones-autonomous-ai-kill-ukraine-war.html", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン、青年向け娯楽施設としてのカフェを取り締まり", "title_en": "Iran Cracks Down on Coffee Shops as Part of Public Space Control", "summary_ja": "イランの警察は、女性の公共の場での顔覆い着用を義務付ける法律を理由に、ここ数週間で数十のカフェを閉鎖した。専門家は、これらの閉鎖は政府が公共スペースをコントロールし、青年の社会的自由を制限する広範な取り組みの一部だと見ている。カフェはイランの若者にとって残された数少ない娯楽施設となっていた。", "summary_en": "Iranian police have closed dozens of cafes in recent weeks, often citing laws requiring women to wear veils in public. Experts view these closures as part of a broader government effort to control public spaces and limit social freedoms for youth. Coffee shops have become one of the few remaining leisure outlets for young Iranians.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/24/world/middleeast/iran-cafe-closures.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「アルゼンチンのテキサス」が国の経済を救えるか？", "title_en": "Can 'Argentina's Texas' Save the Country's Economy?", "summary_ja": "アルゼンチンの経済危機の中、数千人の国民がパタゴニアの辺境地域への移住を始めている。バックパックとテントだけを持った労働者たちは、この地域の発展が自分たちと国全体の経済的困窮から脱する道になると期待している。", "summary_en": "Thousands of Argentines are migrating to a remote region of Patagonia in search of economic opportunity and employment. Armed with minimal belongings and hopeful aspirations, these workers are betting on the region's potential to revitalize both their personal fortunes and Argentina's struggling economy.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/24/world/americas/argentina-oil-patagonia-milei.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、ガザ北部への通行再開を許可 人質交渉の打開後", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "イスラエルは、人質解放交渉における膠着状態の打開を受けて、ガザを二分する軍事地帯の通行をパレスチナ人に再び許可した。この動きは、イスラエル当局とパレスチナ勢力間の長期的な対立後の重大な転換点となっている。現在、数千人のガザ住民が徒歩でエンクレーブの北部地域への帰還が可能になっている。", "summary_en": "Israel has allowed displaced Palestinians to resume crossing a military zone that divides Gaza following a breakthrough in hostage release negotiations. The movement marks a significant shift after a prolonged deadlock between Israeli authorities and Palestinian groups. Thousands of Gazans are now able to return to the northern part of the enclave on foot.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、業界危機の拡大を示唆", "title_en": "China's Leading Property Developer Reports Huge Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国最大級の不動産開発企業であるバンケが巨額の損失を報告し、不動産セクター全体の景気後退への懸念が高まっている。同社の経営難は、中国政府が苦境に陥った業界を安定させるために介入するかどうかについて重大な疑問を提起している。この状況は、中国の不動産市場とより広い経済の安定性に対する構造的なリスクを浮き彫りにしている。", "summary_en": "Vanke, one of China's largest property developers, has reported a substantial loss, intensifying concerns about the spreading real-estate sector downturn. The company's financial troubles raise critical questions about whether the Chinese government will intervene to stabilize the struggling industry. The situation highlights the systemic risks facing China's property market and broader economic stability.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人質、10月7日の攻撃による破片が体に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From Oct. 7 Attack", "summary_ja": "最近解放されたイスラエル人質の医学的評価から、10月7日の攻撃による破片が依然として体内に埋め込まれていることが明らかになった。一部の女性は長期間隔離され、8ヶ月間トンネル内に閉じ込められていた。イスラエルの医療関係者は彼女たちの捕虜期間中に受けた身体的外傷を記録している。", "summary_en": "Recently released Israeli hostages underwent medical evaluation revealing they still have shrapnel embedded in their bodies from the October 7 attack. Some women were held in isolation for extended periods and spent eight months confined in tunnels. Israeli medical officials documented the physical trauma sustained during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防空ミサイル不足がウクライナの防衛を脅かす", "title_en": "Interceptor Missile Shortage Threatens Ukraine's Defense", "summary_ja": "ウクライナと同盟国は、需要が生産能力を上回る中で防空迎撃ミサイルの深刻な不足に直面している。この供給危機は防空能力を損なう脅威となり、軍事支援の増加と兵器製造の加速を求める緊急の要望を促している。", "summary_en": "Ukraine and allied nations face a critical shortage of air defense interceptor missiles as demand outpaces production capacity. The supply crisis threatens to undermine air defense capabilities and has prompted urgent calls for increased military aid and accelerated weapons manufacturing.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エコノミスト、パーソナライズされたニュースレターサービスを開始", "title_en": "The Economist Launches Personalized Newsletter Service", "summary_ja": "エコノミスト誌は「The Economist for You」という新しいパーソナライズニュースレターを導入しました。このサービスは、購読者の個人的な好みに合わせてカスタマイズされた記事リストを受信箱に直接配信します。この新サービスは、より関連性の高い質の高いジャーナリズムを提供するという同誌のコミットメントを反映しています。", "summary_en": "The Economist has introduced a new personalized newsletter called \"The Economist for You,\" which delivers a customized reading list directly to subscribers' inboxes. The service tailors content to individual preferences, enhancing the reading experience for each user. This addition reflects the publication's commitment to providing more relevant and targeted journalism.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/introducing-our-latest-newsletter-the-economist-for-you", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブームがアメリカの慈善活動を変える", "title_en": "Silicon Valley's AI Boom Is Remaking American Charity", "summary_ja": "AI革命を牽引するテック起業家たちが、数千億ドルの慈善寄付を誓約している。本記事は、これらの莫大な慈善的誓約がどのように配分され、アメリカの慈善活動と社会的優先事項にどのような影響を与えるかを検証している。", "summary_en": "Tech founders leading the AI revolution have pledged to donate hundreds of billions of dollars to charitable causes. The article examines how these massive philanthropic commitments will be allocated and what impact they may have on American charitable giving and social priorities.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカ、重要鉱物で地政学的力関係を再構築", "title_en": "Africa Uses Critical Minerals to Shift Global Power Balance", "summary_ja": "コバルト、マンガン、リチウムを産出するアフリカ約15カ国が、2023年以降、禁輸措置とクォータを導入し地政学的ダイナミクスを変えている。これらの措置により、外国事業者は鉱物の輸出ではなく、現地での処理施設の構築を余儀なくされている。この戦略によって、アフリカ諸国は鉱物資源からより大きな価値を得られ、確立された世界的なサプライチェーンへの依存を減らすことができる。", "summary_en": "Approximately 15 African countries producing cobalt, manganese, and lithium have implemented embargoes and quotas since 2023 to reshape geopolitical dynamics. These measures compel foreign operators to establish local processing facilities rather than exporting raw materials. The strategy allows African nations to capture greater value from their mineral wealth and reduce dependence on established global supply chains.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/le-monde-africa/article/2026/08/24/how-africa-is-using-critical-minerals-to-rebalance-geopolitical-power_6756807_124.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、新たな制裁によるイランへの「経済的窒息作戦」を誓約", "title_en": "US Pledges 'Economic Asphyxiation' of Iran Through New Sanctions", "summary_ja": "米国財務長官スコット・ベッセント氏は月曜日、米国がイランに対して新たな制裁を通じた「経済的窒息作戦」を実施すると発表した。イランは米国の措置に協力する国々に対して報復を行うと宣言している。", "summary_en": "US Treasury Secretary Scott Bessent announced Monday that the United States will implement an 'economic asphyxiation' campaign against Iran through new sanctions. Iran has vowed to retaliate against any countries that cooperate with the US measures.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/economy/article/2026/08/24/iran-calls-us-financial-threat-an-admission-of-defeat_6756797_19.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2027年フランス大統領選挙：左派陣営の主導権争い本格化", "title_en": "French Left Jockeys for Position Ahead of 2027 Presidential Race", "summary_ja": "急進左派政党フランス不屈の指導者ジャン＝リュック・メランションは、党の夏季会議で環境計画に関する演説を通じて、緑の党に働きかけた。一方、ライバルのラファエル・グルックスマンは大統領候補として立候補を表明し、フランス左派内での競争が激化している。", "summary_en": "Jean-Luc Mélenchon of La France Insoumise reached out to the Green party at his party's summer conference, emphasizing environmental planning. Rival politician Raphaël Glucksmann simultaneously announced his presidential candidacy, signaling an intensifying competition within the French left.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/08/24/french-presidential-election-2027-the-battle-for-the-left-begins_6756793_5.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省からのお知らせ", "title_en": "Mindef Updates", "summary_ja": "シンガポール国防省が購読者向けに最新情報を発信しています。このニュースレターは国防関連のニュースと発表を定期的に提供しています。", "summary_en": "The Ministry of Defence shares updates and information with subscribers. This newsletter provides regular defense-related news and announcements for readers interested in Singapore's military affairs.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニングアップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズのイブニングアップデートニュースレターは、読者に主要なニュースのハイライトと最新情報を提供します。購読者は出版物のサブスクリプションポータルを通じてニュースレター設定を管理できます。", "summary_en": "The Straits Times Evening Update newsletter provides readers with key news highlights and updates. Subscribers can manage their newsletter preferences through the publication's subscription portal.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズのモーニング・ブリーフィングは、毎日のニュース更新と分析を提供しています。読者は出版社のウェブサイトを通じて無料ニュースレターに登録し、購読を管理できます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and analysis. Readers can sign up for free newsletters and manage their subscriptions through the publication's website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハサン・ピカー、ハマス、反シオニズム、米国のイスラエル観について語る", "title_en": "Hasan Piker on Hamas, Anti-Zionism and American Attitudes Toward Israel", "summary_ja": "ストリーマーのハサン・ピカーがハアレツのインタビューで、ハマス、反シオニズム、米国民のイスラエル政策に対する意見の変化について議論している。対談ではイスラエルへの批判が米国で増加している背景と、それに伴う反発を探っている。", "summary_en": "Streamer Hasan Piker discusses controversial topics including Hamas, anti-Zionism, and shifting American public opinion on Israel in an interview with Haaretz. The conversation explores growing criticism of Israeli policies among Americans and the backlash that accompanies these discussions.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilAJBVV95cUxNVkhnMFNiLUVlU1o0OW9BeEw1dG0tNHFzOXY1UDh5U09oVHJuWWVGOGdyRXB2N0RNdGhCcURIam04akl1RUlRWjJjY1JKZUlqTjFaVi1MYkJlaVozM3EtN3ExTHJtSzJNbEthLWR1R2ZsWTFKQVJUcDVNbGtrbmNHUDFxYmRDWGZaTkJnTGRrcWpZTjE5aWlJZkpDZFlBVVk3SVhGYUpQQ21FMEJsLUxEV3FyOFMwcTAxUk1NbkNUaWdxQzdBNkRZQmxiUHFISnNLb29CV013RGtUOWhzbG5hMVhIQ2ExWjRqcUNqdVA1bzVjRE5Ub2NadjEzUHBpcFY4M1BaLUNSYmU5N2pHQk1aRE5uNzU?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプでさえうんざり：選挙勝利を目指す絶望的なネタニヤフが全方面で砲火を放つ", "title_en": "Even Trump Has Had Enough: Desperate Netanyahu Fires at All Fronts to Win Election", "summary_ja": "ネタニヤフ首相は選挙を前に複数の方面で積極的な政治的工作を強化している。状況は非常に対立的になっており、米国の前大統領トランプでさえネタニヤフのアプローチにうんざりしているようだ。この絶望感は来たる選挙戦の高い賭け金を反映している。", "summary_en": "Prime Minister Netanyahu is intensifying his political maneuvering ahead of the election, employing aggressive tactics across multiple fronts. The situation has become so contentious that even former U.S. President Trump appears to have grown weary of Netanyahu's approach. The desperation reflects the high stakes of the upcoming electoral contest.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiAJBVV95cUxOQ1ktMXl0Q29ieGtkekZZbUdmLWNBYXlzZWh1cEUxelJwdm95TGZFakdnaWh0ZGhvbEpaX0E4d3hIWGNCbDIwQ2MxMEJkSkRWN1JZMFZ3VzVWM3d3X0pGNWphU3NsSTNSRHRwN05VQWI5MExHUkNiQ2tpWUhDazdKVHc1OTZEcTdZVTV6d1c3LVBlSjV0enk2Y3NtS05RVkhoUEZsNmk1QzBuRXlWNVBxQ01GRzhpcGZVeFBOM2d4TWc0T2pFU2RnenBlT2tJSGVDVTlhQzN4SWp4anZjM09nT0RnRTRDZDgzT2JJN0RPSUk0MWtHWVpjZS1jLVo0Y2ZKcVVjSTE2b2g?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルのガザ作戦を描くドキュメンタリー『NAZA』ヴェネチア国際映画祭でプレミア上映", "title_en": "Documentary 'NAZA' on Israel's Gaza Actions to Premiere at Venice Film Festival", "summary_ja": "ガザにおけるイスラエルの軍事行動を描くドキュメンタリー映画『NAZA』がヴェネチア国際映画祭でプレミア上映される予定である。本作品はイスラエル・パレスチナ紛争に関する国際映画界のカバレッジにおいて重要な作品となっている。このプレミア上映は、ガザ情勢の人道的側面に対する芸術的関心の高まりを示唆している。", "summary_en": "A documentary film titled 'NAZA' examining Israel's military actions in Gaza is set to premiere at the Venice Film Festival. The film represents a significant entry in international cinema's coverage of the Israeli-Palestinian conflict. The premiere underscores growing artistic focus on the humanitarian dimensions of the Gaza situation.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiAJBVV95cUxPLTJjd1pSVVQ3YnpESVo1TzRwWm0zSC1DSWVmdVhzd3g2dUEzSkEtdlhfdFBhVkpCVE1nRzlZdGpaTW5lNENFajVJTmc1ZzRjUFNxNV9ocG1NTE1CVmpJRk0xZENzcXB0LVp3RG5EMXZCSFQ2RnNxUjV4UU1FT0pwVENwTE5yV3VJUDRucVhPU25DY0xra0E5a3dtT2ZRRmh6NDItSVVNVDNHRlAyNWd0MklsdFFfZWpUaG1IbFlWbWhqX05ZejMyMC02dU5jLXEtNkVWUkt4ZmJaYXBOSU84QVVlNmhZX0E4YTFoZTFiYjdfaEpGQzM3ZHVEMGxpSWlVUjc0eExqTFI?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾へ向かう最初の2機のF-16V戦闘機", "title_en": "First Two F-16V Fighter Jets En Route to Taiwan", "summary_ja": "台湾は発注したF-16V戦闘機の最初の2機を受け取る予定であり、防衛能力の大幅な強化となる。この最先端航空機は、潜在的な脅威に対する島の防空を強化するため、大規模な軍事近代化計画の一部として納入される。", "summary_en": "Taiwan is set to receive the first two of its ordered F-16V fighter jets, marking a significant enhancement to its defense capabilities. The advanced aircraft are being delivered as part of a major military modernization program to strengthen the island's air defense against potential threats.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9iLTFXZ0JxaTNsWDJ3SE1YVlFjbHZfdUtZZzJXempfUlA0RVFkN0VQQWRPN2FLeFdKanRpTmhFOFdmN2x4c1VJOUdfbE9UMHJndVlKSnVCaw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フォーカス台湾 - CNA英語ニュース", "title_en": "Focus Taiwan - CNA English News", "summary_ja": "フォーカス台湾は、台湾の公式通信社である中央通信社（CNA）の英語ニュースサービスです。台湾の政治、経済、文化など、国際的な聴衆に向けた包括的なニュース報道を提供しています。", "summary_en": "Focus Taiwan is the English news service of the Central News Agency (CNA), Taiwan's official news organization. It provides comprehensive coverage of current events, politics, business, and culture in Taiwan for international audiences.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiO0FVX3lxTE9aU2ljbTc1d0Y3alZIY005T0hWTmZOTGpod3pXQU9zbm4yYjhoOXAzdy1WNGlxemk1bVU0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "野党が首相に対する非難決議案を急速に処理", "title_en": "Opposition Fast-Tracks Condemnation Motion Against Premier", "summary_ja": "台湾の野党は首相を対象とした非難決議案を加速させている。この動きは政府の政策をめぐる政治的緊張と意見の相違を反映している。急速な手続きは、野党の懸念に迅速に対処する決意を示している。", "summary_en": "Taiwan's opposition party has expedited a condemnation motion targeting the premier. The move reflects ongoing political tensions and disagreements over government policies. The fast-tracked procedure indicates the opposition's determination to address their concerns promptly.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE54ZW8tOTRGbnVtLWVFTU5sMVhfSEZlR1A0M2tVcUVsd3lHZTA3bnM2VHFuWHJaOS1rOWhhdzJhZ2hpd0s2dEhsOFMyUHRiRi1ZMng0NWxGNA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コンゴ民主共和国、コンゴ川沿いのエボラ監視を強化", "title_en": "DR Congo Launches Ebola Surveillance Initiative Along Congo River", "summary_ja": "CGTNの報道によると、コンゴ民主共和国は水路沿いの監視態勢と準備態勢を強化するため「エボラなしコンゴ川」イニシアティブを立ち上げた。このプログラムは、ムバンダカやキンシャサなどの主要都市へのエボラ流行の拡大を防ぎ、隣国のコンゴ共和国と中央アフリカ共和国へのウイルス拡散リスクを制限することを目的としている。", "summary_en": "CGTN reports that the Democratic Republic of Congo has launched the 'Congo River Without Ebola' initiative to strengthen surveillance and preparedness along the waterway. The program aims to prevent Ebola outbreaks from reaching major cities including Mbandaka and Kinshasa, and to limit the risk of the virus spreading to neighboring Republic of the Congo and Central African Republic.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-21/DR-Congo-steps-up-Ebola-surveillance-along-Congo-River-1PN0Ilxm9eU/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルのE1計画、将来のパレスチナ国家を脅かす可能性＝CGTN報道", "title_en": "Israel's E1 Plan Threatens Future Palestinian State, CGTN Reports", "summary_ja": "CGTNは、イスラエルが占領下のヨルダン川西岸のE1地域への新しい入植地建設計画を発表したと報じている。同報道によれば、国際社会はこのプロジェクトがパレスチナ国家の領土的連続性を損なう可能性があると警告している。CGTNは、この計画がパレスチナ国家樹立の見通しへの影響を懸念する国際社会から大きな批判を受けていると指摘している。", "summary_en": "CGTN reports that Israel's plan to build new settlements in the E1 area of the occupied West Bank has faced widespread international condemnation. The source indicates that the international community warns the project could undermine territorial continuity needed for a future Palestinian state. CGTN notes that the plan has drawn significant criticism from global actors concerned about its impact on Palestinian statehood prospects.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-23/How-Israel-s-E1-plan-in-West-Bank-threatens-a-future-Palestinian-state-1PQw141LORa/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国のアニメーション産業の変革", "title_en": "China's Animation Industry Undergoes Transformation", "summary_ja": "CGTNは、中国のアニメーション産業が製作と市場の動向に大きな変化を遂げていると報道しています。本報告は、このセクターが従来のスクリーン形式を超えてどのように進化し、新しい業界トレンドに適応しているかを検証しています。", "summary_en": "CGTN reports that China's animation industry is experiencing significant changes in production and market dynamics. The report examines how the sector is evolving beyond traditional screen formats and adapting to new industry trends.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-20/Beyond-the-screen-Inside-China-s-changing-animation-industry-1PLgzl8VDUY/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア機がセルビアの山火事に4日間で800トンの水を投下", "title_en": "Russian aircraft drop 800 tons of water on Serbian wildfire hotspots in four days", "summary_ja": "TASSは、ロシア機がセルビアの山火事現場に4日間でほぼ800トンの水を投下したと報じている。報道によると、セルビアの緊急対応専門家らはロシアの航空作戦の高い効率性を指摘している。", "summary_en": "TASS reports that Russian planes dropped nearly 800 tons of water on wildfire hotspots across Serbia over a four-day period. According to the report, Serbian emergency specialists noted the high efficiency of the Russian aerial operations in combating the fires.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2177189", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランは米国制裁に対応する計画があると主張", "title_en": "Iran Says It Has Plan to Counter US Sanctions", "summary_ja": "TASS/RTによると、イランの政府高官は、同国が米国の制裁に備えており、事前にこれに対処するための計画を策定していたと述べた。イラン当局は、制裁の影響を軽減するための対抗措置を戦略化していたと報告している。", "summary_en": "According to TASS/RT, Iran's government minister stated that the country was prepared for US sanctions and had developed a plan in advance to address them. The Iranian official reports that the government had strategized countermeasures to mitigate the impact of sanctions.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2177187", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン議会議長、イランの取引相手国への米国の脅迫を退ける", "title_en": "Iranian parliament speaker dismisses US threats to Iran's trading partners", "summary_ja": "TASSの報道によると、イラン議会議長モハンマド・バゲル・ガリバフ氏は、米国はその脅迫が信頼性を欠いていることを認識していると述べた。ガリバフ議長は、イランと取引する国々に対する米国の脅迫を誰も真摯に受け止めていないと示唆している。", "summary_en": "TASS reports that Iranian Parliament Speaker Mohammad Bagher Ghalibaf stated that Americans are aware that their threats lack credibility. Ghalibaf suggested that no one takes US threats seriously regarding countries that trade with Iran.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2177183", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ゲーテッド・リセッションの時代", "title_en": "The Age of Gated Recessions", "summary_ja": "著者は、マクロ経済指標が急速な所得成長を享受する労働者と雇用見通しの悪化に直面する労働者の間の深まる分断を隠していると主張しています。AIの台頭により、特定の地域と労働者が景気後退のような状況を経験する一方で、他の労働者は好況を享受する可能性があり、スキルと立地に基づいた経済的に「分断された」結果が生じます。", "summary_en": "The author argues that aggregate economic indicators mask a deepening divide between workers experiencing rapid income growth and those facing deteriorating job prospects. As AI rises, certain regions and workers may experience recession-like conditions while others boom, creating economically 'gated' outcomes based on skill and location.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/robust-aggregate-indicators-conceal-widening-economic-divide-by-kaushik-basu-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Age of Gated Recessions\nAggregate economic indicators are obscuring a widening divide between those enjoying rapid income growth and those facing deteriorating job prospects. The rise of AI could deepen this disparity, with certain regions and workers experiencing recession-like conditions while others enjoy boom times.\nITHACA—Something strange is happening in the US labor market. The latest data released by the Bureau of Labor Statistics show that the US economy lost 23,000 jobs in July, yet the unemployment rate actually fell to 4.1%. A closer look helps explain the apparent contradiction.", "translation_ja": "", "vocab": [{"word": "aggregate", "definition": "複数の要素や部分を合わせた全体的な；統計や経済データにおいて、個別のデータをまとめて全体の傾向を示す際に使用される。"}, {"word": "disparity", "definition": "著しい相違や不均衡のこと；特に収入や機会などの大きな格差を指す。"}, {"word": "deteriorating", "definition": "悪化する、劣化するという意味の進行形；状況や条件が段々と悪くなっていく過程を表す。"}, {"word": "recession-like", "definition": "景気後退に似た、景気後退のような状態を表す複合形容詞；完全な不況ではないが類似した経済的困難を示唆する。"}, {"word": "Bureau of Labor Statistics", "definition": "米国労働統計局；雇用、失業率、給与などの労働市場データを集計・発表する政府機関。"}]}, {"title_ja": "AI（人工知能）の呪い", "title_en": "The AI Curse", "summary_ja": "著者は、AI インフラの膨大な電力消費が通常の市民から権力を奪い去ると主張しています。企業が莫大なエネルギーを消費するデータセンターを構築すると、地域社会は税収に依存するようになり、市民は労働力や税金を差し控える従来の影響力を失い、民主主義が無意味になるという論点です。", "summary_en": "The author argues that AI infrastructure's massive power consumption is shifting the balance of power away from ordinary citizens. As corporations build energy-intensive data centers that local communities depend on for tax revenue, citizens lose traditional leverage—the ability to withhold labor, taxes, or votes—rendering democracy meaningless in resource-dependent regions.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/society-based-on-ai-could-make-citizens-and-democracy-redundant-by-stephen-holmes-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The AI Curse\nEvery sanction that ordinary citizens have ever possessed—the ability to withhold labor, taxes, sons, or votes—presupposes someone who needs what you can withhold. As AI infrastructure encroaches on Americans, they are learning the lesson of many resource-rich states: where there is no need, there is no democracy.\nNEW YORK—In a county in northern Virginia, a family’s electricity bill has doubled. A few miles away, a windowless building the size of a shopping mall hums through the night—yet another AI data center, consuming more power than the town it was built beside. The dispute will be conducted in the language of rate structures, zoning variances, and transmission corridors. But a non-technical political question drives it: Are the people who live in the county still needed by the people who constructed the building?", "translation_ja": "", "vocab": [{"word": "encroach", "definition": "徐々に侵入または侵害すること。ここでは AI インフラが米国内に少しずつ影響力を拡大させていることを表します。"}, {"word": "presupposes", "definition": "前提条件として必要とすること。民主主義の権力行使には、何かを必要とする相手が存在することが前提であることを意味します。"}, {"word": "windowless", "definition": "窓がない状態。ここではデータセンターが外部との接触を遮断した施設であることを強調しています。"}, {"word": "transmission corridors", "definition": "電力などを送電する回廊やルート。インフラの技術的側面を示す専門用語です。"}, {"word": "leverage", "definition": "影響力や交渉力。市民が自分たちの要求を通すために使える力や手段を指します。"}]}, {"title_ja": "グローバルな債券相場の急落は成長と株式市場のどこに打撃を与えるか？", "title_en": "Where Will the Global Bond Rout Hit Growth and Equities?", "summary_ja": "主要経済圏での債券利回りの上昇は財政・金融リスクについての懸念を引き起こしているが、著者はその影響は国によって異なると主張している。米国では、高い利回りは経済の弱さというより、テクノロジーによる成長と民間の信用需要増加といった肯定的な構造的要因を反映している。一方、停滞し革新が遅い先進国経済では、高い利回りからのリスクはより深刻である。", "summary_en": "Rising bond yields across major economies have sparked concerns about fiscal and financial risks, though the author argues the impact varies by country. In the US, higher yields reflect positive structural factors like tech-driven growth and increased private credit demand, rather than economic weakness. Conversely, stagnating advanced economies with slower innovation face greater risks from elevated yields.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/global-bond-rout-wont-hit-us-stocks-by-nouriel-roubini-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Where Will the Global Bond Rout Hit Growth and Equities?\nIn the US, the recent rise in bond yields is largely driven by structural factors like the end of the post-2008 Great Stagnation, higher potential growth from tech-industry investments, and greater private-sector demand for credit. Higher yields are more worrisome for advanced economies that are stagnating and innovating less.\nNEW YORK—A sharp rise in bond yields across key economies like the United States, Japan, Germany, the United Kingdom, and France has raised new concerns about the fiscal and financial risks that lay ahead. A common view is that this bond “rout” could augur severe disruptions to economic growth and pain for US and global stock markets.", "translation_ja": "", "vocab": [{"word": "rout", "definition": "金融市場で急激で大幅な値下がり、または敗北を意味する。ここでは債券市場の急速な下落を指す。"}, {"word": "augur", "definition": "将来の出来事の兆候となる、予兆する。通常は「augur well/ill」の形で使用される。"}, {"word": "fiscal", "definition": "政府の税収や支出など財政に関する。「fiscal policy（財政政策）」などの形で経済用語として頻出。"}, {"word": "structural factors", "definition": "経済の基本的な構造から生じる要因で、一時的ではなく根本的な原因を指す。"}, {"word": "stagnation", "definition": "経済成長や発展が停滞している状態。成長率が低く、進展がない期間を指す。"}]}, {"title_ja": "ニューヨーク・タイムズの「分裂的」という用語使用が進歩的左翼への偏見を露呈", "title_en": "NYT's Repeated Use of 'Divisive' Reveals Bias Against Progressive Left", "summary_ja": "著者ダナ・フランクは、ニューヨーク・タイムズが進歩的・民主社会主義の候補者を系統的に「分裂的」とレッテル貼りし、彼らのキャンペーンを弱体化させ、中道民主党主流派の利益を守っていると主張している。フランクは、このフレーミングがアメリカの歴史的分裂を無視し、活発な民主的議論を正当性なく見なしており、一方、タイムズは有権者を本当に疎外させる温和派民主党員の行動には同じ批判をめったに適用しないと述べている。", "summary_en": "Author Dana Frank argues that the New York Times systematically labels progressive and democratic socialist candidates as 'divisive' to undermine their campaigns and protect centrist Democratic establishment interests. Frank contends this framing ignores America's historical divisions and delegitimizes vigorous democratic debate, while the Times rarely applies the same criticism to moderate Democrats whose actions genuinely alienate voters.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/24/new-york-times-divisive-progressives", "state_media": false, "category": "オピニオン", "full_text": "“El-Sayed and Stevens Project Party Unity After Divisive Race,” announced the New York Times on 5 August, the day the progressive Abdul El-Sayed beat out his centrist Democratic rival, Haley Stevens, in the Michigan senatorial primary. “Divisive” is now the Times’s favorite attack word, deployed repeatedly to disparage and try to undermine the astonishing recent advances by progressive candidates.\nFour days after that first story, the Times again landed “divisive” under “Obama and El-Sayed Discuss Unity After Ugly Michigan Primary.” El-Sayed, it asserted, had “narrowly prevailed in a divisive primary after campaigning on a progressive and anti-establishment platform”.\nOn 12 August, the Times reported that David Crowley, who narrowly beat out Democratic socialist Francesca Hong in the Wisconsin gubernatorial primary, “promised to leave behind the divisive Democratic primary and focus on Mr. Tiffany”, his Republican opponent. Other stories slip it in more subtly. That same day, in a piece about representative Alexandria Ocasio-Cortez allegedly distancing herself from “Woke 1.0”, the Times cited Middlebury College professor Erik Bleich, who “pointed to the calls to defund the police as a divisive goal”.\n“Polarizing”, a close cousin to “divisive”, appears regularly, too. The Times especially likes to apply it to New York mayor Zohran Mamdani. A reporter insisted in October 2025, for example: “As Mamdani’s campaign upends New York politics, no single stance has polarized New Yorkers as passionately as his pro-Palestinian activism and caustic criticism of Israel.”\nPerhaps most outrageous was the Times’s choice of headline for a recent review of David Zirin’s new book about Howard Zinn: “America’s Most Divisive Historian Gets a New Biography.” How, exactly, was Zinn “divisive”? And who are those other historians who are also divisive, just not as bad? Neither Adam Hochschild, in his review, nor Zirin, in his biography, nor any discussion of I’ve ever seen in 40 years as a practicing US historian (and co-author, along with Robin DG Kelley, of a book with Zinn), talk about Zinn that way.\nThe Times’s choice to cast Zinn as divisive out of the blue, on top of its repeated usage of the word since the midwest primaries, suggests there’s a conscious campaign underway to utilize the concept however it can.\nOverall, the Times’ repeated charge of “divisive”, along with “polarizing”, implies a previous and virtuous whole that is currently being destroyed by the left. It assumes voters agree that in the face of deep fear of Trump and his allies, we have to stick together, and that progressive candidates can’t beat Republicans in the midterms.\nBut the Times’s mythical unified country never existed. The United States has always been riven by race, class, gender, religion, immigration status and much more. And vigorous debate has always been at the core of truly democratic politics.\nFor the Times, “unity” is a stand-in for the powers-that-be in the Democratic party and “their preferred strategy of running moderate campaigns that won’t offend aging incumbents, never-Trump Republicans, and the multimillionaire-and-up donor class,” as the editors of Hammer & Hope Magazine recently put it.\nThe mealy-mouthed, centrist candidates the party’s leadership has chosen in the name of unity have repeatedly alienated or failed to energize voters, especially African Americans.\nThe Times does on occasion employ “divisive” to describe far-right Republicans, such as with Florida governor Ron DeSantis. But that, in turn, colors its usage against the left, which, implicitly, is behaving fanatically and dangerously, too. As the paper claimed on 16 August, after the midwest primaries, “Democrats Face a Potential Tea Party Moment.”\nNote, moreover, the recent actions by “moderate” Democrats the New York Times has apparently not deemed divisive: James Carville, the political consultant, who called Democratic socialists “a pack of fools” on Fox News, or Abigail Spanberger, the governor of Virginia, who in May vetoed a bill granting collective bargaining rights to public workers, betraying the union base that had elected her.\nIn Michigan, it’s Islamophobia that’s in fact “divisive”, not the Muslim candidate Abdul El-Sayed, who, along with many of the other candidates the Times calls divisive, is not coincidentally a person of color.\nBy charging progressives – and especially democratic socialists – with divisiveness, the New York Times is doing everything it can to shore up a fantasized unity in which corporate powers, Wall Street, and billionaires control the Democratic party, and the rest of us fall into line to vote however they like.\nBut it’s the Times that’s trying to divide us, as we form ever broader, ever more dynamic and ever more effective coalitions to challenge the masters it serves.\n- \n  Dana Frank is professor of history emerita at the University of California, Santa Cruz. Her newest book, Balancing Acts: How a Japanese Immigrant Built a Life", "translation_ja": "", "vocab": [{"word": "disparage", "definition": "～を軽蔑する、貶める。ここでは新聞が進歩的候補者の評判を傷つけるために用語を使用していることを指す。"}, {"word": "polarizing", "definition": "分極化させる、対立を深める。社会や政治グループを相反する立場に分ける行動や人物を形容する。"}, {"word": "mealy-mouthed", "definition": "曖昧な、はっきり言わない、ぼかした言い方をする。政治家が強い立場を避けて穏便な表現で話すことを批判する際に使用される。"}, {"word": "riven", "definition": "深く分裂した、引き裂かれた。社会や国家が根本的な対立や相違で分かれている状態を表す文語表現。"}, {"word": "alienate", "definition": "～を遠ざかさせる、疎外する。政治家の政策が支持者の信頼や支持を失わせることを意味する。"}, {"word": "fanatically", "definition": "狂信的に、盲目的に。理性的な判断を欠いた過度な熱意を持って行動することを表す。"}, {"word": "delegitimize", "definition": "～の正当性を奪う、信用を落とす。権力や制度が意見や運動の価値を意図的に否定すること。"}]}, {"title_ja": "ICE の拷問のような取り調べ戦術の増加", "title_en": "ICE's Escalating Tactics Amount to State-Sanctioned Torture", "summary_ja": "著者ジュディス・レヴィンは、米国移民関税執行局(ICE)の実践（電気ショック手袋、ハンガーストライキ参加者への強制給餌、危険な国への強制送還）が国際法の下での拷問に該当することを主張しています。彼女は移民被収容者、特に脆弱な子どもたちに対する組織的虐待を記録し、これらの行為が国連拷問禁止条約に違反することを主張しています。", "summary_en": "Author Judith Levine argues that U.S. Immigration and Customs Enforcement (ICE) practices—including electric shock gloves, force-feeding of hunger strikers, and deportations to dangerous countries—constitute torture under international law. She documents systematic abuses against immigrant detainees, including vulnerable children, and contends these actions violate the UN Convention Against Torture.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/24/ice-detainees-torture", "state_media": false, "category": "オピニオン", "full_text": "On 11 August, the Associated Press reported that the Homeland Security Agency will spend up to $20m to equip its agents with gloves that can deliver painful electric shocks to the skin of a person deemed uncooperative. The “conductive distraction and de-escalation devices”– branded Glove, for Generated Low Output Voltage Emitter – will be supplied by their manufacturer, Compliant Technologies, through a no-bid contract.\nNews of the acquisition inspired the editorial cartoonist Ann Telnaes to publish a cartoon of an ICE agent wearing the glove, underneath which are a branding iron, an iron maiden, a rack, and other compliance technologies. AKA, instruments of torture.\nIndeed, Amnesty International reports that portable, convenient electric shock devices made for law enforcement like the glove can be, and have been, used for torture. Once called weapons, they’re now marketed as “humane”. They are the former. A prisoner in Kentucky died of a heart attack after 27 successive shocks, directly following 13 Taser hits.\nICE tactics, already sadistic, are looking increasingly like torture. The Geneva conventions define torture as the infliction of severe pain or suffering, whether physical or mental, by an agent of the state acting in their official capacity, to obtain intelligence or confession or to intimidate, coerce, or punish a prisoner or detainee. More than 90% of detainees are held in privately-owned immigration detention facilities, but their employees are contractual agents of the federal government.\nAccording to an investigation by the Guardian, at least 10 immigrant detainees have been subjected to force-feeding and involuntary medical procedures. The detainees are on hunger strikes in protest of the appalling conditions of their incarceration, including, ironically, inedible food and denial of necessary medical treatment. One of the victims, a Kurdish film-maker, described being held in solitary confinement, tackled, shackled, and force fed twice daily for eight months. HSA anticipates hunger strike management will cost $169,000 in fiscal 2026.\nTo force-feed a person, a tube is inserted into their mouth or nose and pushed down into their stomach. Then liquid food or medicine is poured into the tube through a funnel. The person gags, chokes, and often vomits; when they struggle – a natural response – they are usually restrained. “What they’re doing qualifies as torture,” a doctor told the Guardian, expressing a contention widely held by medical professionals, ethicists and human rights experts.\nSome of the torture is outsourced. The administration is sending asylum seekers back to the countries from which they fled under threat of imprisonment, torture or execution – and where they face torture or death on return. The US has built a gulag of collaborating third countries where deportees may be locked up indefinitely or deported to the home countries they fled. Forced return, or refoulement, of refugees and asylees – which is also the result of Trump’s recent revocations of temporary protective status for many foreign nationals – is banned under the UN Convention Against Torture, which the US signed.\nAnd then there is the malign neglect. The Department of Homeland Security (DHS) has released detainees into the cold without adequate money or clothing. At least two – a Haitian woman, Daphy Michael, and a blind Rohingya man, Nurul Amin Shah Alam, a refugee from Myanmar – have frozen to death. Medical examiners are calling both deaths homicides. (DHS says ICE and border patrol had “nothing to do” with the deaths.)\nChildren, too, are being deliberately abandoned. In a bid to force them to release confidential information about their clients, the administration is withholding payments from the organizations that provide legal representation to unaccompanied migrant children. About 25,000 kids, some of them unable to speak English – or speak at all – have been left to fend for themselves in court. Such representation is mandated under a section of the 2008 federal anti-trafficking law, which Project 2025’s Homeland Security chapter recommends repealing.\nSpeaking to MSNOW, Lindsay Toczylowski, an attorney at the Immigrant Defenders Law Center, said that since her agency’s payments were cut off on 31 July, colleagues “witnessed a seven-year-old child taking a final order to leave the United States this week, without a lawyer”, she said. Where will that child go? Who, if anyone, will look after him? What permanent damage will befall him?\nThe number of infants and toddlers in custody has dramatically increased under the Trump administration, according to the Marshall Project, to 25 children under the age of three on an average day. That is “probably the most harmful time of their lives” to experience such trauma, said the cofounder of the executive committee of the American Academy of Pediatrics’ Council on Immigrant Child and Family Health. “Our immigration system is breaking children.”\nIs this torture? Maybe not t", "translation_ja": "", "vocab": [{"word": "refoulement", "definition": "難民や亡命希望者を迫害や危害の恐れがある国に送還することを意味する国際法用語です。1951年難民条約で禁止されています。"}, {"word": "detainee", "definition": "国家機関によって拘束または逮捕された人を指します。犯罪者だけでなく、移民や政治的理由で拘束される者も含まれます。"}, {"word": "de-escalation", "definition": "緊張や対立の程度を低減させることを意味します。本記事では、痛みを与える装置を不適切に「緩和装置」と呼んでいることを批判しています。"}, {"word": "gulag", "definition": "ソビエト連邦の強制労働収容所の歴史的用語で、現在では不当な拘禁施設を比喩的に表現する際に使用されます。"}, {"word": "malign neglect", "definition": "有害な怠慢を意味し、故意または認識しながら危害を与えることを指します。本記事では被収容者を十分な衣類や資金なしで釈放する行為を描写しています。"}, {"word": "coercive", "definition": "強制的または強要的な手段を用いることを意味します。本記事では国家が個人の自由意志を奪う行為を説明する文脈で使用されています。"}]}, {"title_ja": "8月のハロウィン：小売資本主義が季節の自然な秩序を破壊する", "title_en": "Halloween in August: When Retail Capitalism Destroys the Natural Order of Seasons", "summary_ja": "デイブ・シリングは、8月のハロウィン装飾販売が季節の境界線と自然との結びつきを侵食する問題だと主張している。彼は、大型小売店がデータ分析に基づいて伝統的な季節のリズムを尊重するのではなく、異なる祝日を無差別な商業的混在へと崩壊させ、消費者に資本主義のタイムラインに従わせていると述べている。", "summary_en": "Dave Schilling argues that retailers selling Halloween decorations in August represents a troubling erosion of seasonal boundaries and our connection to nature. He contends that big-box stores, driven by data analytics rather than natural cycles, are collapsing distinct holidays into an undifferentiated commercial blur, ultimately forcing consumers to surrender to capitalism's timeline rather than respecting traditional seasonal rhythms.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/23/halloween-capitalism-climate-change", "state_media": false, "category": "オピニオン", "full_text": "Happy spooky season, everyone! Get those jack-o’-lanterns out, because Halloween is just around the corner!\nJust kidding, no, it’s not.\nIt’s August, for God’s sake. Every day, I wake up to 90F weather – my skin moist with sweat and my eyelids stuck together. I can’t drink coffee on my porch without being consumed by an army of voracious mosquitoes that seem to find my blood to be the most delicious of all.\nAnd it’s not just Los Angeles that’s withering under a summer of discontent. The east coast heatwaves are piling up, sending millions of young people to the absolute last place they want to be: an air-conditioned movie theater. But you want to tell me it’s fine to be putting out Halloween decorations? If I don’t store my giant bag of fun-size Twix in a standup freezer, the whole damn thing will melt into chocolate soup. (Don’t even get me started on recent claims you should eat soup when it’s hot outside. It’d rather slurp up my own sweat from a bowl.)\nWhy am I fuming about this? Even though I love Halloween, I’m mad because our glorious big-box overlords have declared, via careful inventory selection, that Halloween season has begun. In August. I find all of that unacceptable. It feels like a violation of the natural order, a realignment of one of the few glorious constants left in the world. I yearn to go back to the tidy order of holidays, where no two ever cross paths. At most, Halloween celebrations should start in late September. Not a month after Independence Day. I fear those days are done, that our world has irrevocably changed and I need to start getting ready to give in to the new normal.\nI first became aware of Halloween’s creep into the summer during a recent sundries run at Target. There are costumes, life-size skeletons, treats and various decorations on offer in-store. I’ve seen massive candy bags positioned to move at CVS. There’s even a smattering of greeting cards, which I find doubly frustrating, as I’ve never in my life considered buying someone a card for Halloween, a holiday that most adults spend binge drinking or squeezing into provocative outfits. What does a Halloween greeting card even say? “I Boo-lieve You Should Get an Uber Home”? “Have a Spooktacular One-Night Stand With Your Marginally Attractive Co-Worker”?\nOn that Target outing, my friend Halle (an admitted Halloween pervert) bought a miniature cauldron from the growing, metastasizing spooky section. I asked what she expected to do with such a trivial piece of merchandise. “Maybe I can put my keys or some change in here.” For two months? Then what? Do you say Back to the closet with you and wait another nine months before getting your coin cauldron out again?\nI know there are people with boxes and boxes of festive decorations who swap them out season after season. Christmas ends, but Easter is just around the corner. Once that’s done, you chuck the bunny rabbits and start bedazzling your home with American flags to prep for the Fourth of July. Now I’m seeing the insidious truth: we aren’t far off from that Fourth-to-Halloween corridor shrinking even further. I see a world in which witches, demons and vampires slowly start bleeding into our patriotic revelries. It’ll get to the point where some of us might start thinking Frankenstein’s monster fought at the battle of Yorktown.\nOne day, we’ll all just celebrate whichever holidays we want, whenever we feel like it. As the climate crisis renders the idea of distinct seasons and unique weather conditions a relic of a bygone era, why wouldn’t we just all live our own little celebratory truths? Even if my local store isn’t carrying Halloween decorations, I could feasibly buy them year-round on Amazon – my mailbox jammed up with boxes of plastic fangs, fake blood and green grease paint. If it never gets cold again, then Halloween can be whenever. Though I suppose the lifestyle I’m describing already has a name and it’s “being goth”.\nIt could be that our society is naturally evolving to be unbound by passé limitations such as “calendars” and “nature”. Instead of using holidays to mark the phases of the harvest or cycles of the moon (boring), they can be dictated by big data (chill and modern). Surely retailers around the country have statistics that point to consumers having a hankering for Halloween by August. Otherwise, why would Target be hawking rubber bats or decorative ghosts right now? We’re giving ourselves over to analytics in almost every other sector of our lives. Why not holidays?\nIf the data says we want Halloween in the heat, then data shall be respected and worshipped. Who am I to argue with hard numbers? If the sun’s always shining, the grass is consistently brown and the acrid bite of wildfire smoke is clogging our lungs, the average human being might not be able to differentiate between the phases of our natural world. The only way for me to not continue to rage against this phenomenon is to surrender to capitalism completely. Instead of putting my finger out and", "translation_ja": "", "vocab": [{"word": "metastasizing", "definition": "がん細胞が転移するように、悪い状況が急速に広がり拡大していく様子を表す。ここでは、ハロウィン装飾セクションが次々と増殖していく状況を比喩的に説明している。"}, {"word": "insidious", "definition": "一見すると害がないが、実は徐々に危険な影響を与えるという意味。ここでは、商業主義が密かに季節感を奪っていく過程を指している。"}, {"word": "analytics", "definition": "データを分析して傾向やパターンを抽出するプロセス。小売企業が消費者の購買行動を数値化して意思決定に使用することを指している。"}, {"word": "eroded", "definition": "徐々に削られたり、減少したりする。季節の明確な区別が少しずつなくなっていく状況を表す。"}, {"word": "hegemony", "definition": "支配的な力や優位性。ここでは資本主義が社会を支配し、自然なリズムより商業的利益が優先される状況を指す。"}]}, {"title_ja": "タイの長期的な政治的膠着状態の終わり？", "title_en": "The End of Thailand's Long Stalemate?", "summary_ja": "タイの保守的な王党派と民主的野党の25年間の政治闘争は、2026年2月に王制と保守的支配層の支持を受けたマイナー政党ブムジャイタイが政権を掌握したことで転機を迎えた。これは軍事クーデターではなく選挙の正当性を通じてエリート支配を強化する政治的転換を示し、今後数年間のタイ政治を再構成する可能性がある。", "summary_en": "Thailand's 25-year political struggle between conservative royalists and democratic opposition reached a turning point in February 2026 when Bhumjaithai, a previously minor party, swept into power with backing from the monarchy and conservative establishment. This represents a decisive shift that consolidates elite control through electoral legitimacy rather than military coups, potentially reshaping Thai politics for years to come.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/thailand/end-thailands-long-stalemate", "state_media": false, "category": "オピニオン", "full_text": "For more than 25 years, Thailand’s conservative establishment and opposition forces have been locked in a struggle for the soul of the country. Royalists want palace institutions insulated from public criticism, a military licensed to intervene in times of political crisis, deferential political parties and politicians, and free rein to clamp down on political actors who fail to toe the line. The opposition calls for a constitutional monarchy, a military that stays in the barracks, a competitive party system responsive to the people’s wishes, and predictable checks and balances that do not unduly punish elected politicians.\nMore often than not, the royalists have had the upper hand. They have mobilized protest movements, staged military coups, and banned opposition parties to prevent troublesome politicians from instituting changes that could limit their power and privileges. Yet every attempt to strike a decisive blow against the opposition has failed. Conservatives have not translated legal or extralegal victories into lasting governments. Opposition movements, meanwhile, have consistently reinvented themselves. Thaksin Shinawatra, the larger-than-life former policeman and telecom billionaire, built up enormous power as prime minister in the early 2000s, incurring the disdain of royalists. And even after a military coup removed Thaksin from the premiership in 2006, his parties remained electoral juggernauts. A yet more alarming challenge emerged on the horizon after a 2014 coup ousted Thaksin’s sister, Yingluck Shinawatra, from government: youth-based mass protests calling for reform of the monarchy in 2020 and progressive political parties who appealed to these younger voters.\nA stalemate had prevailed over Thai politics, with neither side able to overpower the other fully. That changed in February 2026, when Bhumjaithai, a low-profile party previously known primarily for campaigning to legalize cannabis, swept into power in national elections. With the implicit backing of the monarchy and the conservative establishment, Bhumjaithai has seized control of the Thai state, giving rise to a new mode of politics capable of both suppressing progressive forces in favour of cozy collaboration among elites and winning a general election without overt manipulation.\nFar from an electoral anomaly, the rise of Bhumjaithai is the culmination of a long effort by conservatives to retake the levers of power. In fact, the formerly also-ran party’s February triumph was part of a methodical, behind-the-scenes campaign to commandeer the state’s nominally neutral apparatuses, including its Senate and Constitutional Court. The alliance between the monarchical network and Bhumjaithai is more a marriage of convenience than a shared ideological project, and it may not last indefinitely. But shallow as it may be, it has already succeeded in decisively strengthening the conservative position, disempowering the major rival parties that threaten elite control, and potentially remaking the Thai state for years to come.\nRAINBOW COALITIONS\nThe origins of Thailand’s current political order date back to 1997, when a group of elite liberal royalists, claiming a mandate from civil society, introduced a landmark new charter. Often referred to as “the people’s constitution,” it was a reaction to a disastrous military coup in 1991 and its bloody aftermath, including the deadly suppression of unarmed protesters in May 1992. The reforms aimed to coup-proof the political system by introducing checks and balances to prevent elected politicians from abusing their power and facilitate a smooth royal succession. It established an electoral commission, a constitutional court, an anticorruption agency, and a human rights commission, as well as a fully elected, purportedly nonpartisan Senate.\nThe project backfired. It failed to stabilize Thai politics—probably an unrealistic goal to begin with—and the new parliamentary system allowed for the election of Thaksin as prime minister in 2001. A charismatic figure with populist authoritarian tendencies, he successfully mobilized lower-income voters in the heavily populated north and northeast regions of Thailand, melding them into an unbeatable electoral bloc. He used his considerable personal wealth, his party’s parliamentary dominance, and his bureaucratic connections to create a startlingly successful political machine. Thaksin bought off the Senate and the independent agencies, defanging them as neutral bodies, and installed loyalists in crucial posts intended to check the prime minister’s power.\nThe country’s traditional elites were deeply threatened by Thaksin’s ascendance. The so-called Yellow Shirt movement, which appropriated a royal color, sought to make Thailand ungovernable. Through mass street protests and the occupation of public spaces and buildings, it paralyzed opposition rule three times: in 2006, 2008, and in 2013–14. But for all its success in ousting opposition-led governments, the Yellow", "translation_ja": "", "vocab": [{"word": "stalemate", "definition": "どちらの側も相手を完全に支配できず、進展がない膠着状態を指す。政治的対立が長期間解決されない状況を表現する用語。"}, {"word": "implicit", "definition": "明確には述べられていないが、暗に示されている、または強く示唆されていることを意味する。直接的ではない支持や同意を表す。"}, {"word": "commandeer", "definition": "権力や権限を使って何かを強制的に支配下に置くことを意味する。特に政治的文脈では国家機関を掌握することを指す。"}, {"word": "disempower", "definition": "権力や影響力を奪い取ること。政党や個人の支配力や決定権を削減することを指す。"}, {"word": "coup-proof", "definition": "クーデターの発生を防ぐように設計されていることを意味する。政治体制が軍事クーデターに対して耐性を持つように作られていることを表す。"}, {"word": "defang", "definition": "権力や効果を弱めることを意味する。特に制度や組織が本来の目的を果たせないようにすること。"}, {"word": "ascendance", "definition": "権力や影響力の上昇、支配的な地位に上ることを意味する。政治的影響力が増大し優位に立つ状況を指す。"}]}, {"title_ja": "なぜ犯罪者は中国経済を愛するのか", "title_en": "Why Criminals Love the Chinese Economy", "summary_ja": "中国の厳格な資本規制と産業過剰生産という構造的経済特性が、年間約1兆ドル規模の巨大な違法経済を無意識のうちに創出している。北京は犯罪ネットワークに対して選別的な取り締まりを行っているが、これらの同じインフラが中国の戦略的利益に貢献しているため、取り締まりは不完全であり、違法活動は合法商取引と並行し
