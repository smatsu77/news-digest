tiveness given that most Iranian oil exports already go to China, which has historically ignored US sanctions.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c0qxew81y83o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Iran faces 'greatest financial offensive ever', says US treasury secretary\n- Published\nThe US announced a host of sanctions against Iran and threatened its supporters in what Treasury Secretary Scott Bessent said was \"the single greatest financial offensive ever\".\nLabelling it an \"economic D-Day\" for Iran, Bessent said the US would sever all economic ties with the country and added that any nation financially partnering with Iran would also be isolated.\nHowever, the latest threat to the Iranian regime follows several U-turns and extended deadlines from the White House in its efforts to end the conflict.\nThe war has led to hikes in global oil prices, and in response to the latest threat Iran warned it would shut down all oil exports from the region if the war continued.\nThe Iranian regime has also issued a fresh warning to shipping to not pass through the Strait of Hormuz without its permission, according to Reuters.\nOne fifth of the world's oil and gas usually passes through strait, a narrow waterway south of Iran, but the flow has been effectively blocked by the country since the conflict began at the end of February, leading to higher oil prices globally.\nAt a press conference on Monday outlining what has been called \"Operation Economic Outcast\", Bessent said the US was launching an \"economic onslaught against Iran's financial connections around the globe\".\n\"Iran now faces a very clear choice with only two paths before them: complete global isolation....or a path back to normalcy with an opportunity to rejoin the global economy,\" he said.\nThe treasury secretary claimed America was \"no longer managing the Iranian threat, we are ending it\".\nBessent said the Treasury Department had mapped networks, facilitators and financial channels used by Iran to evade sanctions to trade oil.\nThe department said it has issued determinations against five sectors: digital assets, technology, gold, aviation and shipping. The Treasury has also imposed sanctions on almost 60 entities, individuals and vessels.\nBessent said that such actions would \"tighten the noose and block every potential source of revenue\" for Iran's Islamic Revolutionary Guard Corps and the wider Iranian regime.\nIn a warning to governments and entities assisting or trading with Iran, he said they could not \"claim they are blind to enabling this activity\".\nHe declined to highlight specific countries, but said Trump would be phoning world leaders \"with specific request to cease their interactions with the regime.\"\nWhile he said it was important to give people time to understand the new sanctions, he added: \"they should know that that will move very quickly and that we are serious.\"\n'Damp squib'\nDavid Oxley, chief climate and commodities economist at Capital Economics, cast doubt on the effectiveness of the sanctions announcement.\n\"With the renewed US naval blockade already strangling Iran's oil exports, the direct impact of 'economic D-Day' on Iran's energy revenues will be somewhat of a damp squib,\" he said.\n\"We suspect that the new package will have only a limited direct impact on Iranian energy flows in the short term.\"\nHe said that was partly due to the fact roughly 90% of Iran's oil goes to China, a country \"which has not recognised US sanctions in the past and is unlikely to be cowed this time either\".\nOver the course of the conflict so far, previous threats have included Trump saying in April that \"a whole civilisation will die tonight\" unless Iran agreed a deal to end the war and unblock the Strait of Hormuz.\nThe US eventually climbed down from that position after mediator Pakistan intervened and called for more diplomacy.\nThe protector, not a drain on our security but the front line in keeping Europe safe.\"\nIt comes after Kremlin spokesman Dmitry Peskov criticised the UK's decision to share the missile blueprints. Peskov said it prevented \"even the slightest progress\" towards achieving peace.\nHe told reporters on Monday that the Russian military was already gathering data to locate any missile production sites to destroy them.\n\"Britain is involved in this war on the side of the Kyiv regime. Britain methodically and regularly adds fuel to the fire,\" he added.\nIn response, Burnham said: \"Who started the fire? That's the question, isn't it?\"\nHe said the issue of missile interceptors would be the main topic at the coalition of the willing meeting.\nBurnham has been reaffirming the UK's backing for Kyiv in the wake of escalating Russian strikes on Ukraine in recent weeks - including one on a shopping centre on Friday that killed at least 16 people.\nIn a joint statement after the meeting, Burnham and co-chairs French President Emmanuel Macron and German Chancellor Friedrich Merz said the group would aim to strength Kyiv's air defences \"as a matter or urgent priority\".\nThey also condemned Moscow's \"systemic and escalating strikes against Ukraine's cities, critical infrastructure and civilians\" and pledged to \"constrain Russia's war chest through sanctions and actions against the \"shadow fleet\".\nThe Coalition of the Willing is a partnership of 34 countries including Ukraine. Members met on Monday in either Kyiv or by video conference, with a release stating \"leaders once again reaffirmed their commitment to support Ukraine's independence\".\nIt came as the European Union said it had released €6.1bn (£5.2bn) in military aid for Ukraine to boost its air defences. The finance is part of a wider €90bn loan from the EU to Ukraine.\nThe UK and Ukraine have also announced a new military technology partnership, external giving British experts access to Kyiv's Avengers AI Labs database.\nDowning Street says Ukraine has used sensors and cameras to capture data across the battlefield and it can be used to train AI models \"to solve key national security challenges\" faced by both countries.\nOn Monday morning the prime minister laid flowers at the graves of Ukrainian soldiers during a service at the National Military Memorial Cemetery.\nHe accepted an award from Zelensky on behalf of the British people recognising the UK's support for Ukraine during an independence day event outside the St Sofia cathedral in Kyiv.\nIn a speech, Burnham compared Ukraine's resistance to Russia to the UK's fight with Nazi Germany, saying: \"My nation kept the flame of European freedom alive in the 20th century, you hold that flame in the 21st.\"\nIn a statement issued ahead of the visit, the prime minister said: \"On Ukraine's 35th anniversary of independence, the Ukrainian people should be in no doubt: the UK is behind you today and for as long as it takes.\n\"I am proud of the contribution our country has made to Ukraine and I want the Ukrainian people to hear it directly from me that our support will not waver. After all, Ukraine's security is our security.\"\nHe said the friendship Ukraine shared with the UK would \"long outlast Russia's illegal war\", adding: \"Russia should be in no doubt of our resolve. We will not back down until there is a just and lasting peace.\"\nMoscow earlier warned of \"consequences\" over the use of British drones by Ukraine in its recent ramping up of strikes on Russian infrastructure.\nKyiv has stepped up long-range attacks on Moscow and other Russian regions, targeting oil refineries and warehouses of the country's largest online retailer, Wildberries.\nThe gove", "translation_ja": "", "vocab": [{"word": "reaffirm", "definition": "すでに表明された立場や約束を改めて強調・確認することを意味する。外交や政治文脈で頻出する上級語。"}, {"word": "escalating", "definition": "段階的に増加・拡大することを指す。紛争や危機が深刻化していく過程を表現する際に使用される。"}, {"word": "coalition", "definition": "共通の目標を持つ複数の国や団体が一時的に形成する政治的な同盟体。"}, {"word": "constrain", "definition": "何かの力や活動を制限・抑制することを意味する。政治・経済分野で制裁や規制を表現する時に用いられる。"}, {"word": "blueprint", "definition": "建築や製品の設計図を指すが、比喩的には計画や戦略の詳細な枠組みを意味する。"}, {"word": "outrageous", "definition": "非常に不当で、許容できないほど悪質であることを強く表現する形容詞。"}]}, {"title_ja": "ウクライナの無人機攻撃がロシア第2位のオンライン小売業者オゾンを標的に", "title_en": "Russia's Second-Largest Online Retailer Ozon Hit by Ukrainian Drone Strikes", "summary_ja": "ウクライナ軍は一晩中、ロシア第2位のオンライン小売業者オゾンの倉庫に無人機攻撃を実施し、南部の複数地域で火災を引き起こし、多数の負傷者が出た。この攻撃は、キエフが軍事物資供給に使用されていると主張するロシア最大手小売業者ワイルドベリーズへの数週間に及ぶ攻撃に続いている。ロシアのプーチン大統領はウクライナの経済部門への報復を誓った。", "summary_en": "Ukrainian forces conducted overnight drone strikes on warehouses belonging to Ozon, Russia's second-biggest online retailer, causing fires across multiple southern regions and injuring several people. The attacks follow weeks of Ukrainian strikes on Wildberries, Russia's largest retailer, as Kyiv targets logistics infrastructure it claims supplies military components. Russian President Putin vowed retaliation against Ukraine's economic sectors.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cg598yvrzpro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Russia's second-biggest online retailer targeted in Ukrainian strikes\n- Published\nWarehouses belonging to Russia's second-largest online retailer have been hit by a wave of Ukrainian drone strikes.\nOzon said its logistics facilities in the southern regions of Krasnodar, Dagestan, Stavropol and Adygea were on fire and several people had been injured following overnight strikes.\nUkraine has for weeks struck sites belonging to Wildberries, the country's biggest online retailer, describing the firm as a legitimate target because it supplied components to the military, which Moscow denies.\nRussian President Vladimir Putin said on Saturday that Ukraine had opened \"Pandora's box\" by striking economic targets and that Russia would hit back at Kyiv's \"most sensitive economic sectors\".\nRussia has targeted Ukraine's civilian infrastructure since launching its full-scale invasion in 2022, and recent Russian attacks have hit Ukrainian warehouses and cargo terminals.\nBoth Russia and Ukraine deny deliberately targeting civilians.\nOzon said \"a fire broke out\" at a logistics centre in Makhachkala, in the southern region of Dagestan, following a drone attack at around 05:00 local time (02:00 GMT) on Monday.\nThe company said earlier that a \"major fire\" was burning at one of its logistics centres in the city of Krasnodar, 700km (435 miles) to the east of the Dagestan site.\nRussia's defence ministry said three children had been killed in Krasnodar following a Ukrainian drone attack. Russia's children's rights commissioner Maria Lvova-Belova said they were aged 13, 15 and 16, while six more children had been taken to hospital.\nMeanwhile, Ozon workers in Adygeysk, in the Adygea region, and Nevinnomyssk, in the Stavropol region, have been evacuated.\nVideos posted on social media of the Ozon attacks have been verified by the BBC. One shows a drone hitting a warehouse in the Orenburg region, while another shows a large plume of smoke and flames rising from its warehouse in Dagestan.\nShares in Ozon fell by as much as 12% on the Moscow Exchange on Monday morning, while shares in its major shareholder, private equity firm AFK Sistema, fell by almost 13%.\nWhen asked on Monday whether the Russian government would provide state support to Ozon, the Kremlin said it was \"working with business representatives to develop various options for providing support in this difficult situation\".\nThe overnight strikes comes a day after Ozon's site in the Samara region was hit. The company said a number of its workers had been injured.\nFollowing that strike, Ukraine's defence ministry said on Saturday: \"Systematic strikes on dual-use goods storage centres complicate the enemy's logistics and negatively affect the Russian economy as a whole.\n\"After Ukrainian units hit 15 of the largest logistics hubs of Wildberries, it was Ozon's turn.\"\nMeanwhile, in Ukraine's Odesa region, overnight strikes targeted food storage facilities and energy infrastructure leading to five people being injured, the region's head Oleg Kiper said on Telegram.\nFounded in 1998, Ozon is one of Russia's first online retailers. The company is second only to Wildberries in terms of scale and presence, with its pick-up posts and delivery boxes stationed across the country.\nBoth the Ozon and Wildberries logos are often seen together in Russia at shared pick-up points.\nThe targeting of these online retailers has had the effect of bringing the war closer to ordinary Russians.\nBoth companies have been described as \"Russia's Amazon\" and it is estimated that they are used by 85-90% of Russia's economically active population.\nIn many remote places lacking accessible shops, Russians depend on them for much of their clothes and household appliances.\nBut unlike Amazon, which sells goods directly alongside its marketplace business, Wildberries and Ozon act almost entirely as marketplaces, connecting independent sellers with buyers across Russia, storing and delivering their goods and handling payments.\nThis means many of the losses incurred in the attacks have been borne by those businesses.\nThe Kremlin has denied that online platforms are used for army supplies.", "translation_ja": "", "vocab": [{"word": "logistics", "definition": "物資やサービスの流通・配送・保管に関わる活動全般を指す。ビジネスや軍事における重要な組織機能である。"}, {"word": "dual-use", "definition": "民間と軍事の両方の目的に使用できるものを指す。通常、技術や物資が軍事転用の可能性を持つ場合に用いられる。"}, {"word": "marketplace", "definition": "売り手と買い手が商品を取引するプラットフォームを意味する。Amazonなどのオンライン販売仲介業のビジネスモデルを指す。"}, {"word": "retaliation", "definition": "相手からの攻撃や不正な行為に対する報復や復讐を意味する。対抗措置としての攻撃を指す。"}, {"word": "infrastructure", "definition": "インフラストラクチャーの略で、経済や社会の基盤となる施設・設備全般を指す。道路、通信網、電力施設などが含まれる。"}, {"word": "economic sectors", "definition": "経済全体を構成する産業分野や領域を指す。農業、製造業、サービス業などの区分された経済活動の領域。"}]}, {"title_ja": "A66クラッシュ事件に関連した組織犯罪捜査で12人が逮捕", "title_en": "Twelve arrested in organised crime investigation linked to A66 fatal crash", "summary_ja": "7人（警察官2人を含む）が死亡したA66クラッシュ事件に続き、12人が逮捕されました。容疑者は銃器所持、麻薬密売、および犯罪グループ参加の疑いで逮捕されています。事件の調査により、クラッシュした車両は偽造ナンバープレートを使用して危険運転に関与していたことが明らかになりました。", "summary_en": "Twelve people have been arrested following an A66 crash that killed seven people, including two police officers. The arrests relate to organised crime activity, with suspects held on suspicion of firearm possession, drug trafficking, and participating in criminal groups. The investigation revealed the crashed Volkswagen Passat was involved in dangerous driving incidents using cloned number plates.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c36d6975dzno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Organised crime arrests in A66 crash investigation\n- Published\nTwelve people have been arrested as part of the investigation into the A66 crash that killed seven people, including two police officers.\nNine men and three women, aged between 19 and 61, have been arrested across Teesside on suspicion of a range of offences including possession of a firearm and being part of an organised crime group.\nIn the early hours of Saturday, a Volkswagen Passat that had been pursued by police travelled the wrong way down the A66 near Middlesbrough and crashed into an oncoming police car - two PCs and all five Passat occupants died.\nCleveland Police said it was investigating \"serious criminal activity that resulted in this fatal incident\".\nPC Tom Clough, 38, and PC Matthew Blades, 37, died in the crash, as did Michael Robert Cahill, 23, Jacob Matusiak, 23, Makai Saddington, 18, Theo Rae, 17, and 17-year-old Cole Robert Worthy.\nEarlier, Cleveland Police released more details of its investigation into the lead-up to the crash and information about the 12 people it had arrested.\nThe force said:\n- It received several reports of two vehicles \"being driven dangerously\" on Saturday morning\n- The first vehicle, believed to be a Volvo XC60, was seen \"ramming properties\" in the Middlesbrough area\n- The second vehicle, a Passat, is believed to have been associated with this activity\n- Both vehicles were operating with cloned number plates but were picked up by automated number plate recognition technology\n- The Volvo has been recovered in Middlesbrough\n- Four of the five people in the Passat had previous convictions\nAssistant Chief Constable Wayne Fox said the investigation had been \"fast moving and complex\".\nHe said: \"The events of that tragic night will have a lasting and profound impact on the Cleveland area and the communities we seek to protect.\n\"We have a duty to respond to, and thoroughly investigate, the serious criminal activity that resulted in this fatal incident and to bring all those responsible to justice.\"\nThe 12 people arrested as part of the investigation are:\n- Three men, aged 24, 19 and 35, all held on suspicion of participating in an organised crime group and possession of an offensive weapon. They are in police custody\n- A man, 21, held on suspicion of participating in an organised crime group, possession of an offensive weapon and criminal damage. He has been remanded on recall to prison\n- A 30-year-old woman arrested on suspicion of assisting an offender and who is in police custody\n- A 20-year-old man arrested on suspicion of threats to cause criminal damage and public order. He remains in custody\n- A 26-year-old man has been charged with possession with intent to supply class A and class B drugs, as well as the possession of criminal property\n- Another man, 39, and a 47-year-old woman have been released on conditional bail after both being arrested on suspicion of possessing a firearm without a certificate, possession with intent to supply class A and class B drugs, and possession of class C drugs\n- An 18-year-old man has been released on unconditional bail after being arrested on suspicion of possessing a firearm without a certificate, possession with intent to supply class A and class B drugs, and possession of class C drugs\n- A 61-year-old woman has been released on conditional bail after being arrested on suspicion of possessing a firearm without a certificate\n- A 39-year-old man has been arrested on suspicion of threats to kill and has been released on conditional bail\nThe Independent Office for Police Conduct (IOPC) has launched an investigation into the collision following a self-referral from Cleveland Police, which is mandatory when someone dies following contact with police.\nThe IOPC said officers had followed the Passat for almost seven minutes before abandoning the pursuit when the car went the wrong way down the A66 at South Bank.\nTen seconds later at 03:39 BST, the Passat collided with the vehicle of PCs Clough and Blades, who were travelling on the correct side of the road and were in the area to assist with the search for the car.\nEarlier, BBC Verify reported that a TikTok account believed to belong to Saddington previously shared videos showing young men driving dangerously.\nThe government called for social media platforms to remove posts celebrating such behaviour.\nCleveland Police said: \"At the current time, there is no evidence to indicate that filming of the activities that took place on Friday night and Saturday morning has taken place for the purposes of TikTok.\"\nAn online fundraiser set up for the officers' families by the Cleveland Police Federation has raised more than £500,000.\nPC Blades' wife said he \"gave his life in the line of duty, protecting and serving others with courage, dedication and selflessness\".\nBefore joining Cleveland Police, PC Blades worked as an English teacher at Carmel College in Darlington.\nThe college said: \"Many within our community will remember Matty as an", "translation_ja": "", "vocab": [{"word": "organised crime group", "definition": "違法な利益を得るために組織的に活動する犯罪集団。複数の犯罪を計画・実行する構造化された集団を指します。"}, {"word": "cloned number plates", "definition": "正規の車両ナンバープレートを複製して別の車に装着したもの。犯罪者が車両を追跡されないようにするために使用します。"}, {"word": "remanded", "definition": "裁判前に被告人が警察または刑務所に送致されること。保釈が認められず拘留される状態です。"}, {"word": "self-referral", "definition": "組織や機関が自発的に上級機関や調査機関に事件を報告すること。この場合、警察が死亡事件を独立した委員会に報告しました。"}, {"word": "conditional bail", "definition": "特定の条件（例：住所の報告、外出禁止など）を守ることを約束した上での釈放。条件違反時は再逮捕されます。"}, {"word": "possession with intent to supply", "definition": "販売目的で違法物質を所持すること。単なる個人使用目的の所持よりも重大な犯罪です。"}]}, {"title_ja": "バーナム首相、ロシアの脅迫にもかかわらずウクライナへの支援を誓約", "title_en": "Burnham Vows Continued Ukraine Support Despite Russian Threats", "summary_ja": "英国のアンディ・バーナム首相はウクライナを訪問し、ゼレンスキー大統領と会談して34カ国の連合を主導した。英国はミサイル生産の設計図を共有し、ウクライナの防空能力強化に取り組む一方、クレムリンは英国の紛争への関与に対する報復を警告した。", "summary_en": "UK Prime Minister Andy Burnham visited Ukraine to reaffirm support, meeting President Zelensky and chairing a coalition of 34 countries. The UK will share blueprints for missile production and work to strengthen Ukraine's air defences, while the Kremlin warned of consequences for British involvement in the conflict.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyqypkrzq5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham vows support for Ukraine despite 'outrageous threats' from Russia\n- Published\nAndy Burnham has promised to keep up the pressure on Russia despite Moscow's \"outrageous threats\", on his first official visit to Ukraine as UK prime minister.\nBurnham met Ukrainian President Volodymyr Zelensky and chaired his first meeting of the \"coalition of the willing\", set up by the UK and France under his predecessor Sir Keir Starmer.\nHe said the coalition was \"doing everything we can\" while urging the US Congress to \"ratchet up\" economic pressure on Russia.\nThe government has agreed to hand over blueprints for British-made components for the Scalp missile, a French version of the UK's Storm Shadow cruise missile - allowing Ukraine to produce the long-range weapon domestically.\n- UK missiles offer may help Ukraine - but they are not what Zelensky needs most \n  - Published8 hours ago\n- Briton fighting for Russia killed in Ukraine \n  - Published4 hours ago\nBurnham said allies were doing \"everything we can\" to \"dig into our own stocks and help others dig into their stocks\" of air defences to protect Ukraine.\n\"This is the moment to keep up the pressure on Russia, the moment to squeeze their ability to fund this illegal war,\" Burnham said, praising the \"strength\" of the Ukrainian people.\n\"Ukraine has been Europe's protector, not a drain on our security but the front line in keeping Europe safe.\"\nIt comes after Kremlin spokesman Dmitry Peskov criticised the UK's decision to share the missile blueprints. Peskov said it prevented \"even the slightest progress\" towards achieving peace.\nHe told reporters on Monday that the Russian military was already gathering data to locate any missile production sites to destroy them.\n\"Britain is involved in this war on the side of the Kyiv regime. Britain methodically and regularly adds fuel to the fire,\" he added.\nIn response, Burnham said: \"Who started the fire? That's the question, isn't it?\"\nHe said the issue of missile interceptors would be the main topic at the coalition of the willing meeting.\nBurnham has been reaffirming the UK's backing for Kyiv in the wake of escalating Russian strikes on Ukraine in recent weeks - including one on a shopping centre on Friday that killed at least 16 people.\nIn a joint statement after the meeting, Burnham and co-chairs French President Emmanuel Macron and German Chancellor Friedrich Merz said the group would aim to strength Kyiv's air defences \"as a matter or urgent priority\".\nThey also condemned Moscow's \"systemic and escalating strikes against Ukraine's cities, critical infrastructure and civilians\" and pledged to \"constrain Russia's war chest through sanctions and actions against the \"shadow fleet\".\nThe Coalition of the Willing is a partnership of 34 countries including Ukraine. Members met on Monday in either Kyiv or by video conference, with a release stating \"leaders once again reaffirmed their commitment to support Ukraine's independence\".\nIt came as the European Union said it had released €6.1bn (£5.2bn) in military aid for Ukraine to boost its air defences. The finance is part of a wider €90bn loan from the EU to Ukraine.\nThe UK and Ukraine have also announced a new military technology partnership, external giving British experts access to Kyiv's Avengers AI Labs database.\nDowning Street says Ukraine has used sensors and cameras to capture data across the battlefield and it can be used to train AI models \"to solve key national security challenges\" faced by both countries.\nOn Monday morning the prime minister laid flowers at the graves of Ukrainian soldiers during a service at the National Military Memorial Cemetery.\nHe accepted an award from Zelensky on behalf of the British people recognising the UK's support for Ukraine during an independence day event outside the St Sofia cathedral in Kyiv.\nIn a speech, Burnham compared Ukraine's resistance to Russia to the UK's fight with Nazi Germany, saying: \"My nation kept the flame of European freedom alive in the 20th century, you hold that flame in the 21st.\"\nIn a statement issued ahead of the visit, the prime minister said: \"On Ukraine's 35th anniversary of independence, the Ukrainian people should be in no doubt: the UK is behind you today and for as long as it takes.\n\"I am proud of the contribution our country has made to Ukraine and I want the Ukrainian people to hear it directly from me that our support will not waver. After all, Ukraine's security is our security.\"\nHe said the friendship Ukraine shared with the UK would \"long outlast Russia's illegal war\", adding: \"Russia should be in no doubt of our resolve. We will not back down until there is a just and lasting peace.\"\nMoscow earlier warned of \"consequences\" over the use of British drones by Ukraine in its recent ramping up of strikes on Russian infrastructure.\nKyiv has stepped up long-range attacks on Moscow and other Russian regions, targeting oil refineries and warehouses of the country's largest online retailer, Wildberries.\nThe gove", "translation_ja": "", "vocab": [{"word": "escalating", "definition": "段階的に拡大・増加していく状態。ここではロシアによるウクライナ攻撃が強度を増していることを表す。"}, {"word": "systemic", "definition": "システム全体に関連する、体系的な。継続的で組織的な性質を持つことを示す。"}, {"word": "constrain", "definition": "制限する、抑制する。ロシアの資金源を制限するなど、活動範囲を狭めることを意味する。"}, {"word": "coalition", "definition": "特定の目的のために一時的に結成された複数グループの同盟。ここでは34カ国が協力する連合を指す。"}, {"word": "sovereignty", "definition": "主権、独立。国家が自らを統治する権利と能力を表す用語。"}, {"word": "illegal war", "definition": "国際法に違反する戦争。ロシアによるウクライナ侵攻を法的に違法と判断する表現。"}]}, {"title_ja": "ハリー王子、アフリカ野生動物慈善団体の理事会から退任", "title_en": "Prince Harry Steps Down from African Wildlife Charity Board", "summary_ja": "ハリー王子は、6年間会長を務めたアフリカ・パークスの理事会から退任しました。同慈善団体のレンジャーがコンゴ・ブラザヴィルの先住民に対して人権侵害を行ったことが明らかになったためです。彼は同組織の保全活動を支持し続けています。この退任は、彼がカリフォルニアからイギリスへの移転を発表したのと同じ時期に行われました。", "summary_en": "Prince Harry has resigned from the board of African Parks after six years as president, following revelations that the charity's rangers committed human rights abuses against indigenous people in Congo-Brazzaville. He remains a supporter of the organization's conservation mission. His departure coincides with his announcement to relocate with his family from California to the UK.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c750n3nx76ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Prince Harry steps down from African wildlife charity board\n- Published\nThe Duke of Sussex has stepped down from the board of an African wildlife charity whose rangers had been found to have committed human rights abuses against indigenous people.\nA spokesman for Prince Harry confirmed he was stepping down after being president for the charity, African Parks, for six years before becoming a member of its board of directors in 2023, but said he remains a \"supporter of its mission\".\nLast year the organisation admitted human rights abuses were committed by its rangers in Congo-Brazzaville.\nPrince Harry's resignation comes shortly after it was announced he was relocating with the Duchess of Sussex, Prince Archie and Princess Lilibet from California to the UK.\nPrince Harry's spokesman said \"the Duke is proud of his 10 years with African Parks and fully supports the ongoing strengthening of its board.\n\"His commitment to conservation in Africa continues, and he remains a supporter of African Parks' mission.\"\nAfrican Parks manages around 20 national parks and protected areas across 12 countries.\nIt was subject to an independent human rights investigation into allegations guards managed and paid by the charity had beaten, raped and tortured indigenous people in the Odzala-Kokoua National Park.\nThe charity said in 2025 it had improved its safeguarding processes both in the Odzala-Kokoua National Park and institutionally.\nAnnouncing a \"governance refresh of its board of directors\", the charity thanked Prince Harry for his association, saying he had \"brought global attention to the urgent need for biodiversity protection for the benefit of people and wildlife, and has contributed greatly to promoting philanthropy for the cause of conservation in Africa\".\nIt added: \"The duke remains deeply committed to this cause, and remains a strong supporter of African Parks' work.\"\nThe charity's website says Prince Harry served as part of the expert team that helped implement the first phase of the 500 Elephants project, which was \"one of the largest and most significant elephant translocations in conservation history\".\nIt saw wildlife experts move elephants from a park in Malawi to help increase population in areas where they have been heavily poached.\nPrince Harry has said helping move elephants to safer homes was an \"amazing\" experience.\nThe Sussexes are back in the spotlight after the revelation last week they were returning to the UK this month after enrolling their children to start at a British school in September.\nNo change is expected to the official status of Prince Harry and Meghan and they will remain as private individuals.\nTheir pending return to the UK has raised questions on their security arrangements.\nLast year, Prince Harry lost a legal challenge over the levels of security he and his family are entitled to while in the UK.\nIt is unclear what provisions will be made for their security once they return to the UK.\nThe couple's plans while they are in the UK are also unclear.\nThe BBC learned the Duchess of Sussex was in talks to return to acting with a role in Netflix series The Gentlemen, which would be her first significant acting role since her marriage to Prince Harry.\nIn early 2020, the Sussexes left the UK and stepped back from their royal duties before settling in California in March that year.\n  - Published4 days ago\n  - Published2 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "abuses", "definition": "権利や権限の悪用、不正な扱い。ここでは人権侵害を指し、組織が管理する人員による違法行為や不当な行為を意味します。"}, {"word": "safeguarding", "definition": "危険や危害から保護するための措置や制度。組織が実施する安全保障や保護プロセスを指す専門用語です。"}, {"word": "biodiversity", "definition": "生物多様性。ある地域や地球全体における異なる種の生物の多様性を表す生態学用語です。"}, {"word": "translocation", "definition": "生物の移動または再配置。保全活動において、野生動物を一つの地域から別の地域に移動させるプロセスを指します。"}, {"word": "poached", "definition": "違法に狩猟または捕獲されること。野生動物が密猟者により違法に殺害される状況を表します。"}, {"word": "provisions", "definition": "準備された物事、設備、または条項。ここではセキュリティのための手当てや対策を指します。"}]}, {"title_ja": "米国、スーダン全域へのUN武器禁輸拡大を提案", "title_en": "US Proposes Expanding UN Arms Embargo to Cover All of Sudan", "summary_ja": "米国は、ダルフール地域に限定されている既存の国連武器禁輸をスーダン全域に拡大することを提案しました。紛争の残虐性と戦闘勢力への外部軍事支援を遮断する必要性を理由としています。スーダン政府は軍の防御能力が低下する可能性があると警告して反対し、ロシアも既存合意の変更に懐疑的な姿勢を示しています。現在のダルフール禁輸は9月12日に失効予定で、改正には安全保障理事会の投票が必要です。", "summary_en": "The United States proposed expanding an existing UN arms embargo from Darfur to all of Sudan, citing the brutality of the conflict and the need to cut off external military support to warring factions. Sudan's government opposed the expansion, warning it could weaken the army's ability to protect civilians, while Russia expressed skepticism about changes to the existing deal. The current Darfur embargo expires September 12, 2026, and requires a Security Council vote to be amended.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/sudan-us-proposes-expanding-un-arms-embargo/a-78490440?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Sudan: US proposes expanding UN arms embargo\nAugust 24, 2026\nThe United States on Monday proposed expanding an existing UN arms embargo for Darfur to cover all of Sudan.\nThe proposal was put forth by US Envoy Massad Boulos during a UN Security Council meeting in New York.\n\"The brutality of the war waged by the Rapid Support Forces [RSF] and the Sudanese Armed Forces has discredited their claims to be legitimate governors of the Sudanese people,\" said Boulos, who warned that \"external financial and military support is fueling the conflict and risks drawing neighboring states deeper into war.\"\nBoulos said the US wants to expand the embargo geographically as well as materially in order to cover unmanned aerial vehicles and related technologies. Moreover, the US plan would see the number of experts monitoring the embargo increased.\nThe Darfur embargo has been in place for two decades and will expire on September 12, 2026, if not amended or renewed.\nAn expansion would require a Security Council vote.\nSudan wants 'technical extension' but warns against hampering army\nSudan's UN envoy urged members to endorse a \"technical extension\" of the existing embargo while warning against changes that would hamper the army.\n\"Sudan suffers the most from weapons and their illegal flow. However, expanding such a sanctions regime will weaken the protection of civilians,\" said Al-Harith Idriss al-Harith Mohamed.\nRussia, which holds veto powers in the Security Council, has voiced skepticism over changes to the existing deal, saying that expanding the embargo could impact the Sudanese army's effectiveness.\nUN Sudan experts say sophisticated weaponry suggests 'external support'\nBefore Boulos articulated the US position, UN Under Secretary General for Political and Peacebuilding Affairs Rosemary Di Carlo warned that a \"worrying aspect of the conflict in Sudan is its increasing complexity.\"\n\"Sophisticated weaponry,\" she said, \"continues to point to ongoing external support to both parties.\"\nThe UN's humanitarian chief, Tom Fletcher, also made note of the fact that, \"in recent weeks, fighting in Sudan has been characterized by the heavy use of drones and localized ground combat in areas less affected by rainy season conditions.\"\nThe war in Sudan, now in its fourth year, has killed tens of thousands and displaced millions of civilians.\nWhile Sudan's army holds sway in the country's central and eastern regions, western and parts of southern Darfur are under control of rival Rapid Support Forces.\nDarfur, a vast western region the size of France, has seen some of the worst violence of the conflict, with repeated attacks on displacement camps and ethnic massacres that kill thousands at a time.\nEdited by: Rana Taha\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "embargo", "definition": "政府が特定の商品や技術の輸出入を禁止する措置のこと。国際紛争や制裁の手段として用いられます。"}, {"word": "brutality", "definition": "野蛮さや残虐性を指す名詞。暴力的で非人道的な行為の程度を表します。"}, {"word": "veto", "definition": "提案や決議を否決する権限のこと。国連安全保障理事会の常任理事国が持つ拒否権です。"}, {"word": "skepticism", "definition": "疑念や懐疑的な態度を示すこと。提案の有効性や正当性に対する疑いの気持ちです。"}, {"word": "humanitarian", "definition": "人道的な、人命救助に関する形容詞または名詞。緊急時の人道支援に携わる活動を指します。"}, {"word": "articulate", "definition": "考えや意見を明確に表現する、説明するという動詞。政治的立場や方針を明瞭に述べることです。"}]}, {"title_ja": "米国がイランの経済的孤立化をさらに推し進める計画を発表", "title_en": "US Announces 'Economic Asphyxiation' Plan to Further Isolate Iran", "summary_ja": "米国財務長官は「経済的孤立作戦」を発表し、イランの貿易相手国に二次制裁を課すことでイランの経済を孤立させる包括的な計画を明らかにした。この戦略は中国、UAE、トルコ、イラクなど主要な貿易相手国を標的とし、協力を拒否する国に対して報復を警告している。イランの政府はこの発表を失敗と一蝕し、ペルシャ湾からの石油輸出の混乱を含む「地震的な報復」を警告している。", "summary_en": "The US Treasury Secretary announced 'Operation Economic Outcast,' a comprehensive plan to isolate Iran's economy by imposing secondary sanctions on its trading partners. The strategy targets Iran's major trade relationships with countries like China, UAE, Turkey, and Iraq, threatening consequences for nations that refuse to cooperate. Iran's government dismissed the announcement as another failed attempt, warning of 'seismic retaliation' including potential disruption of oil exports from the Persian Gulf.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-announces-bid-to-further-isolate-iran-economically/a-78483909?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US announces bid to further isolate Iran economically\nAugust 24, 2026\nThe US on Monday announced what it said would be an \"unprecedented\" bid to constrict Iran's economy, by targeting its trading partners, as the war in the Middle East continues with no real resolution or progress in sight.\nTreasury Secretary Scott Bessent's much-hyped press conference did not include any solid measures or announcements, but he said to expect them to follow fairly rapidly in the course of the week.\nHe laid out plans for what he called the \"economic asphyxiation\" of the regime in Tehran, implying this would be achieved in large part via secondary sanctions on Iran's trading partners.\n\"Around the globe, our objective is to sever every economic lifeline that sustains this tyrannical regime until Tehran stands alone,\" Bessent told a press conference. \"We are going to hold everyone accountable.\"\nWhat did Bessent say about the plans?\nBessent called the program \"Operation Economic Outcast\" and again sought to liken it to the \"Economic D-Day\" mentioned last week by US President Donald Trump, an analogy that prompted ridicule because of how poorly it seemed to fit the circumstances.\n\"In the Second World War, D-Day marked the historic beginning of a campaign with our Allies to target and drive the enemy from its positions, including those in third counties,\" Bessent said, in an apparent effort to salvage the historical allusion.\nIt would target Iran \"and its enablers,\" he said.\n\"Iran now faces a very clear choice, with only two paths before them: Complete global isolation and a subsistence economy, or a path back to normalcy with an opportunity to rejoin the global economy,\" Bessent said.\nHe said the Treasury had mapped \"every node, every network, every facilitator that Iran has used to smuggle oil and evade sanctions,\" and said it would now start to \"tighten the noose\" to constrict \"every potential source of revenue that funds the IRGC and the evil Iranian regime.\"\nCarrot and stick both brandished at third countries\nThere would be a \"zero leakage approach,\" he said, adding that for third parties it was \"no longer acceptable to operate in the grey spaces of this conflict.\"\n\"The president is making phone calls to world leaders with specific requests to cease their interactions with the regime. We are already seeing results,\" Bessent said, without elaborating.\n\"Those who stand with the United States will reap the rewards of our partnership,\" Bessent said. \"Those who tether themselves to the Iranian regime should expect to share in the isolation of a withering regime.\"\nHe said the US would issue various countries a defined timeline to cooperate and steps to take, or to face consequences.\nHow has Iran responded to the new sanctions?\nResponding to the latest US sanctions on Monday, Iran's Economy Minister Ali Madanizadeh predicted \"another defeat\" for Washington, saying Tehran had a \"two year plan\" to counter the sanctions.\n\"They have done everything they could to test the determination of the Iranian people and the country's officials, but they have failed every time. It seems they wished to suffer yet another defeat,\" Madanizadeh told state television.\n\"We've been waiting for these plans for a long time, and the government is and was ready and has a two-year plan to manage these events.\"\nOver the weekend, the head of Iran's top security body warned that Tehran would see any country's support of the US measures as an \"act of war.\"\nSupreme National Security Council leader Mohsen Rezaei said Iran would \"retaliate in a seismic manner\" to the sanctions by targeting other oil-shipping routes from the Persian Gulf.\n\"If the economic war continues, not a single drop of oil will be exported, neither through the Strait of Hormuz nor from anywhere in the Persian Gulf,\" Rezaei said.\nWhy is the US having to focus on third countries?\nIran has already been living under international sanctions for decades. The US does almost no bilateral trade with Iran and has very little direct economic leverage over it.\nPrior to the war, Iran's two biggest trading partners by far were China — arguably the country and entity that has most effectively stood up to past attempts at economic intimidation from the Trump administration — and the United Arab Emirates. The UAE last week announced it was suspending all trade, commercial exchanges and financial transactions with Iran until further notice.\nNATO member Turkey and neighboring Iraq both do a substantial amount of business with Iran.\nRussia is also a valued trading partner, albeit one with no need of Iranian fuel exports.\nGermany is Iran's largest European trading partner, but volumes barely exceeded a billion euros in 2025 (not much more than the US figures) with provisional government figures suggesting the levels will roughly halve to record lows this year amid the war.\nBessent said he would not \"name names\" when it came to whose cooperation the US would seek or demand.\nAhead of Monday's press conference, China's", "translation_ja": "", "vocab": [{"word": "asphyxiation", "definition": "窒息状態、または息ができなくなることを意味する。ここでは比喩的に、経済的な生命線を絶つことで経済を機能不全に陥らせることを表している。"}, {"word": "secondary sanctions", "definition": "第三国がある国と取引することを理由に、その第三国に対して課される制裁。直接的ではなく間接的な経済的圧力の形態である。"}, {"word": "bilateral trade", "definition": "2つの国家間の商取引。輸出入の相互取引のこと。"}, {"word": "leverage", "definition": "影響力や交渉の優位性。ある国が他国に対して圧力をかけるための力や手段。"}, {"word": "tether", "definition": "つなぎ留める、結びつけるという意味。ここでは政治的または経済的に関係を深くすることを指している。"}, {"word": "retaliate", "definition": "報復する、仕返しする。相手の攻撃に対して反撃や対抗措置を取ること。"}]}, {"title_ja": "コンゴ民主共和国の平和工程表：紛争終結の道は開かれるか", "title_en": "DR Congo Peace Roadmap: Can Diplomacy End Years of Conflict?", "summary_ja": "コンゴ民主共和国とルワンダ支援のM23反政府勢力の代表者らが、ジュネーブの交渉を経て平和工程表に合意した。昨年の米国仲介による枠組みを基礎としている。国際仲介者は慎重な楽観論を示す一方で、専門家らは制裁、被拘禁者の釈放、ルワンダの紛争への関与など重大な課題が残っていると警告している。成功の真の尺度は、被災民が安全に帰宅して生活を再建できるかどうかにある。", "summary_en": "Representatives from the Democratic Republic of Congo and Rwanda-backed M23 rebels have agreed on a peace roadmap following negotiations in Geneva, building on a US-brokered framework from last year. While international mediators express cautious optimism, experts warn that significant challenges remain, including unresolved disagreements over sanctions, detainee releases, and Rwanda's role in the conflict. The true measure of success will be whether displaced civilians can safely return home and rebuild their lives.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/dr-congo-peace-roadmap-will-the-fighting-finally-end/a-78487489?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "DRC peace roadmap: Will the fighting finally end?\nAugust 24, 2026\nRepresentatives of the Congolese government and the Rwanda-backed M23 rebel group agreed on a roadmap for peace after negotiations in Geneva.\nIt builds on the US-brokered framework signed in Doha last year, and sets out steps and timelines for negotiations and implementation: a ceasefire monitoring mechanism is also due to receive support from the UN peacekeeping mission, MONUSCO.\nThe United States, Qatar, the African Union (AU) and Switzerland have all expressed their support for the process as brokers of the push for peace.\nHowever, it is not a full peace plan with bindíng resolutions and terms; rather, many aspects of the push will still need to be fine-tuned.\nThe new diplomatic initiative could nevertheless be offering fresh hope following years of bloody conflict in eastern DRC; fighting in the region has killed hundreds of civilians and displaced millions since 2022. The M23 rebel group continues to control large parts of North Kivu and South Kivu — two provinces in eastern DRC that are highly coveted for their minerals.\nAs disagreements remain over key issues, doubts continue to cast a shadow over the prospect of a lasting peace.\nFrom signature to implementation\n\"There are likely to be many more bumps on the road — disagreements remain over issues including sanctions against M23, the release of detainees and the timing of political reforms. So this remains a very fragile commitment,\" Alex Vines, Africa program director at the European Council on Foreign Relations, told DW.\nConflict analyst Clifton Chifuwe, executive director of the Centre for Peace Research and Advocacy (CPRA), a local NGO that focuses on conflict management, agrees with that assessment, pointing to the presence of multiple armed groups in the area, the deep level of mistrust between DRC and Rwanda, and competition over eastern Congo's mineral wealth.\nHe believes that the biggest of the challenges across the board is to turn this roadmap into action.\n\"Signing it is easier than implementing it on the ground,\" Chifuweexplains.\nChifuwe told DW that independent monitoring mechanisms and the involvement of all key stakeholders will be essential for any peace to hold.\nRwanda's role in the conflict\nRwanda has repeatedly rejected accusations that it backs M23 rebels — though international groups maintain the view that the small neighboring nation is deeply entrechned in the conflict.\nKigali's relationship with the rebel group therefore remains central to the peace process, says Vines:\n\"Rwanda's good faith and its relationship with M23 is a really key consideration. Kigali's buy-in to any agreement and influence over M23 is key.\"\nRwandan President Paul Kagame's comments at a press conference on August 24 further underline the complexity of the issue; Kagame rejects the narrative that Rwanda is responsible for the current conflict, blaming factions within the DRC instead.\nHe links any Rwandan involvement in the conflict to what he describes as a longstanding security threat from the other side of the border, naming the Democratic Forces for the Liberation of Rwanda (FDLR) armed group — which fights against M23 rebels alongside the Congolese military — as his main target.\nKagame said that \"if this problem of the FDLR is not resolved,\" Rwanda would act to protect itself \"at any cost.\"\nMixed messages of hope and skepticism\nThere also are signs and reasons for cautious optimism: Chifuwe highlights that the roadmap focuses on a sequenced implementation plan, with monitoring initiatives to be put in place to help identify warning signs before any violence resumes.\nThese international mediators will also have to maintain pressure on the parties while ensuring regional concerns are heard.\nIn this context, Vines believes that US and Qatari involvement remains important, while stressing that African input through the AU must not be ignored.\nAll parties involved have signed off on a pledge to \"pursue negotiations towards comprehensive peace and conflict resolution\" — for now.\nWhat does peace mean for the displaced?\nUltimately, the roadmap will not be measured by the signatories' attitudes but by results for thousands upon thousands of people in the eastern DRC, who remain displaced.\n\"The real test is ... whether ordinary Congolese people become safer and better off,\" Chifuwe says emphatically, highlighting also the restoration of state authority and the management of mineral resources as key objectives that need to be achieved.\nFor Congolese civilians, the diplomatic language carries a personal meaning: One refugee named Linda Kasongo finds herself stuck in Zambia five years into the conflict.\nShe told DW that she wants to return home, but can't even entertain the thought, since violence on all sides continues to wreck lives and livelihoods in her war-torn home region.\n\"I hope it works out because I want to go home,\" Kasongo says. \"I want to be with my people. I miss my people. I miss my h", "translation_ja": "", "vocab": [{"word": "entrenched", "definition": "深く根付いた、確固として定着した状態を意味する。政治や社会的な立場が強固で変わりにくいことを表す。"}, {"word": "broker", "definition": "仲介者、仲立ち人を意味する。紛争解決や交渉において中立的な立場で両者の合意を促す役割を果たす。"}, {"word": "sequenced", "definition": "段階的に、順序立てて計画されたことを意味する。複数の段階を時系列に沿って実行することを指す。"}, {"word": "fragile", "definition": "脆弱な、壊れやすい状態を表す。政治的合意や平和協定が不安定で、容易に破綻する可能性があることを示す。"}, {"word": "coveted", "definition": "強く望まれた、渇望された状態を意味する。多くの人や団体が欲しいと思う価値あるものを表す。"}]}, {"title_ja": "トランプ政権、イランへの二次制裁の対象を拡大", "title_en": "Trump Administration Expands Secondary Sanctions Against Iran", "summary_ja": "トランプ政権はイランの経済を標的とした二次制裁の範囲を拡大した。スコット・ベッセント米財務長官は「イランに対する経済的D-Dayが迫っている」と警告し、同国の金融システムへの圧力を強化している。", "summary_en": "The Trump administration has broadened the scope of secondary sanctions targeting Iran's economy. U.S. Treasury Secretary Scott Bessent warned that an \"economic D-Day is coming for Iran,\" signaling intensified pressure on the country's financial system.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates/?id=135895428", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース配信", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、世界中の速報ニュースとライブイベントを24時間体制でカバーしています。視聴者は主要なニュースが展開する際のリアルタイム報道にアクセスできます。複数のプラットフォーム上で継続的なニュース更新を配信しています。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events from around the world. Viewers can access up-to-the-minute reporting on major stories as they develop. The platform delivers continuous news updates across multiple platforms.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "警察官の死亡事件で容疑者の妻が遺体で発見される", "title_en": "Wife sought in officer's death found dead, police say", "summary_ja": "先週自宅で死亡しているのが発見された警察官の夫に関連する事件で、容疑者として指名手配されていた58歳のカレン・ソロモンが遺体で発見されたと警察が発表しました。夫の遺体が発見されて以来、当局による捜査が続いていました。", "summary_en": "Karen Solomon, 58, was being sought by authorities following the death of her husband, a police officer, who was found dead in their home last week. Police have announced that Solomon has been found dead. The discovery concludes the search that had been underway since her husband's body was discovered.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/wife-sought-massachusetts-cops-death-believed-found-dead/story?id=135915804", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハリー王子、レンジャーの人権侵害を理由にアフリカ公園理事会から辞任", "title_en": "Prince Harry quits African Parks board over rangers' human rights abuses", "summary_ja": "ハリー王子は、アフリカの主要野生生物慈善団体であるアフリカ・パークスの理事会から辞任しました。同団体のレンジャーがコンゴ共和国の先住民コミュニティに対して人権侵害を行ったことが明らかになったためです。オジャラ・ココウア国立公園でのレンジャーによる暴力行為や性的暴力が報告されました。人権団体の圧力を受けての辞任ですが、ハリー王子はアフリカでの保全活動への支持を継続しています。", "summary_en": "Prince Harry has stepped down from the board of African Parks, a major African wildlife charity, following revelations of human rights abuses by its rangers against Indigenous communities in the Republic of the Congo. The charity admitted that its rangers in Odzala-Kokoua national park committed beatings, waterboarding, and sexual violence against local Baka people to prevent access to ancestral forests. Harry's departure comes after pressure from human rights organizations, though he remains a supporter of conservation efforts in Africa.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/uk-news/2026/aug/24/prince-harry-quits-board-wildlife-charity-african-parks-human-rights-abuses", "state_media": false, "category": "社会", "full_text": "The Duke of Sussex has stepped down from the board of a major African wildlife charity that had been at the centre of a human rights controversy.\nPrince Harry’s spokesperson confirmed he was no longer a trustee of African Parks, which admitted last year that human rights abuses were committed by its rangers in the Republic of the Congo.\nThe charity’s admission followed an independent review into allegations made by members of the Baka community.\nIn a 2024 report published by the Mail on Sunday newspaper, community members accused African Parks rangers of beating, waterboarding and raping locals to stop them from accessing their ancestral forests, which are now in a conservation area.\nAfter the review, African Parks published a statement acknowledging that human rights abuses occurred in the Odzala-Kokoua national park, which it manages. It said that it had improved its safeguarding processes both at the park and institutionally.\nA spokesperson for Harry said the duke, who was president of the charity for six years before he became a member of its board of directors in 2023, remained an active and avid supporter of African Parks.\n“The duke is proud of his 10 years with African Parks and fully supports the ongoing strengthening of its board,” the spokesperson said.\n“His commitment to conservation in Africa continues, and he remains a supporter of African Parks’ mission.”\nSurvival International, a global human rights charity that campaigns for the rights of Indigenous people, had called on Harry to step down as a member of the board.\nCaroline Pearce, the executive director of Survival International, said it was “outrageous that for 10 years Prince Harry has served African Parks” while people working for it had “been responsible for abuse and violence against Indigenous people. His departure doesn’t undo that record — African Parks itself must now be held accountable, and must abandon this model of fortress conservation for good.”\nFounded 26 years ago, African Parks manages more than 20m hectares (50m acres) in partnership with 13 African governments and hundreds of local communities.\nAfrican Parks expressed “deep gratitude” to the duke on concluding his tenure after his 10-year commitment to the organisation.\n“His relationship with the organisation dates back to Malawi in July 2016, when he supported one of the largest elephant translocations in history. He served as president for six years before being appointed a member of the board of directors,” it said.\n“Over the years, the duke has brought global attention to the urgent need for biodiversity protection for the benefit of people and wildlife, and has contributed greatly to promoting philanthropy for the cause of conservation in Africa. The duke remains deeply committed to this cause, and remains a strong supporter of African Parks’ work.”\nThe announcement comes as the Duke and Duchess of Sussex are due to relocate to the UK from California with their children, Prince Archie, seven, and Princess Lilibet, five.\nFormer Suits star Meghan is said to be pursuing an acting role, with reports she has been in talks about a role in the third series of Guy Ritchie’s Netflix hit The Gentlemen, swiftly followed by other reports that the deal was off.\nThe couple are understood to be planning an “extended stay” in the UK, and their children are already enrolled in school, but it has not been confirmed for how long.", "translation_ja": "", "vocab": [{"word": "trustee", "definition": "団体や組織の信託財産を管理し、その運営に責任を持つ人。理事や受託者を意味します。"}, {"word": "safeguarding", "definition": "人々の安全と福祉を保護するための制度や措置。特に脆弱な人々を虐待から守るための対策を指します。"}, {"word": "fortress conservation", "definition": "地元コミュニティを排除して自然保護区を管理する方式。先住民の権利を無視する保全モデルを指します。"}, {"word": "biodiversity", "definition": "生態系に存在する様々な生物の種の多様性。自然環境の豊かさを示す指標です。"}, {"word": "tenure", "definition": "職位や役職を保有する期間。特定の職務を務めた期間を指します。"}, {"word": "translocation", "definition": "動物を一つの場所から別の場所に移動させること。野生動物の保全や管理目的で行われます。"}]}, {"title_ja": "ナイジェリアのモスク襲撃後、数百人が人質に取られている映像が公開", "title_en": "Video shows hundreds held captive after Nigeria mosque kidnapping", "summary_ja": "武装集団がナイジェリアのニジェール州のモスク襲撃時に拉致された約600人の女性、子ども、高齢者を映した映像を公開しました。犯人たちはソーシャルメディアに映像を投稿し、家族に人質の中から親族を特定するよう促しました。身代金目的の大量拉致事件はナイジェリア北部でますます一般的になり、武装集団は南部への作戦を拡大しています。", "summary_en": "An armed group released a video showing approximately 600 women, children and elderly people abducted during an attack on a mosque in Niger State, Nigeria. The kidnappers posted the footage on social media urging families to identify their relatives among the captives. Mass kidnappings for ransom have become increasingly common in Nigeria's northern regions, with armed gangs expanding their operations southward.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/24/video-shows-hundreds-held-captive-after-nigeria-mosque-kidnapping", "state_media": false, "category": "社会", "full_text": "An armed group has posted a video showing what residents said were about 600 women, children and older people abducted in an attack on a mosque in Nigeria’s north-central Niger State last week.\nThe video, posted on Facebook and WhatsApp, showed large groups of people seated in a forested area surrounded by armed men. Several children could be heard crying in the background.\nMass kidnappings for ransom have become common in parts of north-western and north-central Nigeria, where heavily armed gangs frequently raid villages, schools and highways and hold them until paid large sums of money. The violence was previously focused in the north of the country, but gunmen have increasingly moved south.\nThe video surfaced two days after the latest kidnapping, when gunmen attacked worshippers at the mosque in Dekara village during Friday prayers, taking people away in what residents said were simultaneous raids on several communities.\nIn the video, a gunman speaking in Hausa addressed families of the captives and urged them to identify relatives among the people in the footage.\n“These are all your people. We are showing you this video so that you can identify your family members, your fathers, mothers, children and relatives,” the gunman said.\nReuters could not verify the exact date or the location where the video was filmed. However, no older version of the video was found posted online before Sunday.\nFour residents said they were able to confirm the identities of some of those seized.\n“The people in the video are from Dekara. I’ve identified 13 people that I know,” Ibrahim Abubakar said.\nAnother resident, Abdulmutallib Muqaddas Dindi, said those who appeared in the video had been seized during the prayers. “We have identified our elders, relatives, and some of us have seen their wives and children in the video,” he said.\nPolice and state authorities did not respond to requests for comment on Monday. Police had earlier confirmed an attack on worshippers in the area but said they could not verify the number of people abducted.\nJamilu Ibrahim, another resident, appealed to the federal and state authorities to secure the release of the captives, pointing out the number of mothers with infants and children among those shown in the footage.", "translation_ja": "", "vocab": [{"word": "captive", "definition": "拘束されている人、捕虜。自由を奪われた状態にある人を指します。"}, {"word": "abduct", "definition": "誘拐する、拉致する。不法に人を連れ去ることを意味します。"}, {"word": "ransom", "definition": "身代金。拘束された人の解放と引き換えに要求される金銭のことです。"}, {"word": "verify", "definition": "確認する、検証する。情報や事実が正しいかどうかを確認することです。"}, {"word": "appeal", "definition": "訴える、懇願する。強く助けを求めたり、支持を呼びかけたりすることです。"}, {"word": "surge", "definition": "急増する、増加する。数量や勢いが急速に増えることを表します。"}]}, {"title_ja": "ギニアビサウのサル痘患者の半数が子どもたち、流行が拡大", "title_en": "Children account for half of mpox cases in Guinea-Bissau as outbreak spreads", "summary_ja": "ギニアビサウがサル痘の流行を宣言し、報告されたケースの半数以上が子どもたちであり、4歳未満の症例が16件含まれています。保健当局は、脆弱な監視システムのためウイルスがより広く検出されずに蔓延している可能性があると警告しています。この流行はインフラの問題があることや、9月の学校再開を控えていることにより、特に課題が大きいです。", "summary_en": "Guinea-Bissau has declared an mpox epidemic with over half of reported cases occurring in children, including 16 cases under age four. Health authorities warn that fragile surveillance systems mean the virus is likely spreading undetected. The outbreak poses particular challenges due to infrastructure issues and comes as schools prepare to reopen in September.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/aug/24/children-half-mpox-disease-cases-guinea-bissau-epidemic-spreads-west-africa", "state_media": false, "category": "社会", "full_text": "More than half of the mpox cases reported in Guinea-Bissau have been among children, local authorities have said, almost two months since the country announced an epidemic.\nA national outbreak was declared on 4 July, just over a week after a 27-year-old woman became the first confirmed case of mpox in the west African country. Since then, there have been seven confirmed cases and 46 suspected cases. Half of those patients have been children, with 16 under the age of four.\nIn a statement on Thursday, Unicef warned that because the country’s health surveillance systems were fragile, the virus is probably spreading undetected, leaving even more children at risk.\nSandra Martins, the country’s deputy representative for Unicef, said: “This is the first time mpox cases have been reported in Guinea-Bissau, making even a small outbreak a major public health event.”\nMpox is an infectious viral disease that can be transmitted through close contact. There have been more than 2,000 mpox-related deaths among tens of thousands of cases recorded across east, central and west Africa since January 2024.\nHealth workers say the Clade variants are consistent with viruses circulating in neighbouring countries, meaning that a risk of cross‑border transmission in the region remains strong. The vast majority of confirmed cases are in the Bissau autonomous sector, where the capital is, while one case is in the nearby Biombo area. No deaths have been reported to date.\nDr Magda Robalo, a former health minister who led the country’s Covid-19 response, said that to eliminate the “biggest gaps in the health system right now”, increased surveillance would have to be prioritised and frontline capacity reinforced.\n“Even though the numbers are small, new cases have appeared intermittently over several weeks, which means transmission is ongoing,” said Robalo, who is also co-founder of the Institute for Global Health and Development and former director of communicable diseases for the World Health Organization.\nThe outbreak comes as the country grapples with infrastructure challenges and the aftermath of the suspension of last November’s presidential election by the military, which remains in power. There was no electricity throughout Thursday in Bissau for instance because of petrol scarcity since the weekend.\nMany public health laboratories in the region lack equipment to deal with epidemics but have institutional knowledge from handling other crises.\nIn Guinea-Bissau, that is no different but there is also a sense of urgency, with primary schools scheduled to reopen across the country in September. After the outbreak was declared, community health workers immediately began a door-to-door public awareness campaign with megaphones and translated leaflets, supported by the health ministry and international agencies.\nThese grassroots initiatives are seen as vital for building public trust in the public health sector. Earlier this year, the country suspended a controversial US-funded trial on hepatitis B vaccinations for newborns, citing ethical concerns and procedural flaws. The decision was lauded by many across the continent and has highlighted sensitivities around emergency health interventions.", "translation_ja": "", "vocab": [{"word": "fragile", "definition": "脆弱な、壊れやすい。ここでは健康監視システムが十分な機能を果たしていない状態を指します。"}, {"word": "surveillance", "definition": "監視、監視体制。感染症の流行を追跡・検出するための体系的な観察活動のこと。"}, {"word": "transmission", "definition": "感染、伝播。病原体がある個体から別の個体へ移動する過程を指す医学用語。"}, {"word": "outbreak", "definition": "勃発、流行。感染症が急速に増加して蔓延することを意味します。"}, {"word": "epidemic", "definition": "流行病。ある地域や人口集団で通常より多くの人が同じ病気にかかることを指す。"}, {"word": "institutional knowledge", "definition": "組織的知識、機関内の経験的知識。ある機関や組織が過去の対応を通じて蓄積した実践的な知識。"}]}, {"title_ja": "汚職捜査が進む中、ウクライナ大統領への国内政治的圧力が増加", "title_en": "Domestic Political Pressure Mounts on Ukraine's President Amid Corruption Probes", "summary_ja": "ゼレンスキー大統領は解任された閣僚からの戦時選挙実施要求を拒否しており、国内の政治的圧力が高まっている。政府高官への汚職捜査が進行する一方で、軍事作戦も継続している。", "summary_en": "President Zelenskyy faces growing domestic political pressure as he rejects calls for wartime elections from a dismissed minister. Corruption investigations into senior government officials have intensified while military operations continue on multiple fronts.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/inside-story/2026/8/24/whats-behind-domestic-political-pressure-on-ukraines-president?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Inside Story\nWhat’s behind domestic political pressure on Ukraine’s president?\nZelenskyy rejects call from sacked minister for wartime elections.\nInternational leaders have visited Ukraine to mark its Independence Day as President Volodymyr Zelenskyy rejects calls for wartime elections.\nBut domestic political pressure has been growing amid the latest corruption investigations into senior government officials while Russian and Ukrainian attacks intensify.\nWhat’s the impact?\nPresenter: Sami Zeidan\nGuests:\nOleksandr Sushko – executive director of the International Renaissance Foundation, a Ukrainian charitable organisation, and former co-chairman of the EU-Ukraine Civil Society Platform\nOlexiy Haran – professor of comparative politics at the National University of Kyiv-Mohyla Academy and head of research at the Democratic Initiatives Foundation\nMichael Bociurkiw – global affairs analyst and senior fellow at the Atlantic Council", "translation_ja": "", "vocab": [{"word": "wartime elections", "definition": "戦争中に実施される選挙のこと。通常は政治的安定性や軍事的集中力の維持のため、紛争中は延期されることが多い。"}, {"word": "corruption investigations", "definition": "政府高官や公務員による不正行為や贈賄などを調査する公式な手続き。国家の信頼性と透明性に関わる重要な問題である。"}, {"word": "domestic political pressure", "definition": "国内の政治勢力や国民からの政府や指導者に対する影響力や要求のこと。政策決定に直接的な影響を及ぼす。"}, {"word": "intensify", "definition": "程度や強度が増す、強まるという意味。ここでは軍事攻撃や紛争がより激しくなることを指す。"}, {"word": "sacked minister", "definition": "職を解かれた、または解雇された閣僚のこと。政治的失策や不信によって公職から除かれた人物を指す。"}]}, {"title_ja": "米国の「経済D-Day」制裁に対するイランの反応", "title_en": "Iran Responds to US 'Economic D-Day' Sanctions Campaign", "summary_ja": "イランの経済相アリ・マダニ・ザデ氏は、イランの経済的つながりを遮断することを目的とした米国の新たな経済制裁を拒否し、「今回も失敗するだろう」と宣言した。米国はイランの残りの経済的生命線を標的とした包括的な圧力キャンペーンを発表した。", "summary_en": "Iran's Minister of Economy Ali Madani-Zadeh rejected new US economic sanctions aimed at severing Iran's economic connections, declaring 'You will fail this time, too.' The US announced a comprehensive pressure campaign targeting Iran's remaining economic lifelines.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/24/video-iran-reacts-to-us-economic-d-day-sanctions?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Iran reacts to US ‘economic D-Day’ sanctions\nNewsFeed\nVideo: Iran reacts to US ‘economic D-Day’ sanctions\n‘You will fail this time, too.’ Iran’s Minister of Economy Ali Madani-Zadeh has responded to the US announcement of a new economic pressure campaign against Iran where it aims to ‘sever every economic lifeline’.\nPublished On 24 Aug 2026", "translation_ja": "", "vocab": [{"word": "economic pressure campaign", "definition": "経済的な圧力を加えるための組織的な取り組み。政治的目標を達成するため、貿易制限や制裁などの経済手段を用いて相手国に影響を与えるキャンペーン。"}, {"word": "sever", "definition": "つながりや関係を切断する、または分断する。外交・経済関係を完全に絶つことを意味する正式な表現。"}, {"word": "lifeline", "definition": "生存や機能維持に必要不可欠なもの。経済的文脈では、国家や企業が生存・繁栄するために必要な経済的支援や取引を指す。"}, {"word": "announcement", "definition": "公式に情報を発表または告知すること。政府機関が政策や決定を公に知らせる行為。"}, {"word": "reject", "definition": "提案や主張を受け入れないこと、または拒否すること。政治的文脈では、相手国の政策や要求に対して反対を表明する。"}]}, {"title_ja": "コンゴ民主共和国東部への国連停戦監視団派遣、戦闘は継続", "title_en": "UN Ceasefire Monitoring Mission Deployed to Eastern DRC Despite Ongoing Fighting", "summary_ja": "国連主導の監視団がコンゴ民主共和国東部に到着し、コンゴ軍とルワンダが支援すると言われるM23反政府勢力の間で、カタール仲介による停戦協定の遵守を確認することになった。2025年7月に署名された協定にもかかわらず、鉱物豊富な地域では戦闘が続いている。監視団は停戦違反を調査し、ウビラやカレヘを含む主要地域を訪問する予定である。", "summary_en": "A UN-led monitoring mission has arrived in eastern Democratic Republic of Congo to verify compliance with a Qatar-mediated ceasefire between the DRC's army and M23 rebels, who are allegedly backed by Rwanda. Despite the agreement signed in July 2025, fighting has continued on the ground in the mineral-rich region. The mission will investigate ceasefire violations and visit key areas including Uvira and Kalehe.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/24/ceasefire-monitoring-mission-arrives-in-democratic-republic-of-congo?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Ceasefire monitoring mission arrives in Democratic Republic of Congo\nFighting persists in the mineral-rich region despite ceasefire agreements.\nA monitoring mission has been deployed in the eastern Democratic Republic of Congo (DRC) to verify the formal ceasefire between the DRC’s army and M23 rebels said to be backed by Rwanda.\nThe United Nations and government sources said on Monday that the monitoring team had arrived to track the progress of the Qatari-mediated truce. Despite the agreement to end the hostilities, fighting has continued on the ground.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Residents emerge in DR Congo’s tense Uvira after M23 rebel takeover\n- list 2 of 3DR Congo files case against Rwanda at ICJ over decades of alleged ‘abuses’\n- list 3 of 3DR Congo, M23 rebels agree on roadmap for peace talks\nThe UN said that the mission had deployed to Minembwe, located in the country’s mineral-rich South Kivu province, where intense fighting has persisted in recent months.\nThe Swiss government announced on Sunday that the DRC and M23 had agreed on a roadmap for peace talks after closed-door negotiations, and that a mission would be deployed to verify violations of the ceasefire agreement signed in Doha, Qatar in July 2025.\nThe mission is composed of members of the Congolese government and M23, as well as observers from member countries of the International Conference on the Great Lakes Region (ICGLR).\nLocal journalists reported that the UN Organization Stabilization Mission in the Democratic Republic of Congo (MONUSCO) provided logistical support for the deployment.\nThe mission will visit Uvira, from where the M23 withdrew in January, as well as Kalehe, where fighting has been reported in recent weeks.\nMultiple armed groups have fought over the DRC’s mineral-abundant eastern provinces, including the Alliance Fleuve Congo (AFC) and M23, which seized swathes of territory and advanced on Goma, the capital of the North Kivu province, last year.\nPeace efforts led by Qatar and the United States have sought to end the crisis, leading to the signing of two separate accords.\nDRC President Felix Tshisekedi and Rwandan President Paul Kagame – whose country has been accused of backing the M23 rebels – signed a “historic” peace and economic agreement in December aimed at ending fighting, five months after the two agreed to a ceasefire. However, fighting has continued on the ground.\nBoth sides have accused the other of alleged abuses and ceasefire violations.\nIn a statement on Monday, the DRC condemned alleged M23 “crimes and serious rights violations” in territory under its control, accusing the group of killing “more than 300 people” in June and July.\nThe M23 has rejected the accusations. A spokesperson for the group said on X that government forces had launched a “deadly attack” with artillery on a village near Minembwe.", "translation_ja": "", "vocab": [{"word": "mediated", "definition": "第三者による仲介や調停を通じて成立させること。外交交渉で中立的な立場の国や機関が紛争当事者の間に入り、合意を促進する過程を指す。"}, {"word": "verification", "definition": "合意や報告が真実であるか、条件が満たされているかを確認・検証する行為。国際協定では独立した監視団による検証が重要な役割を果たす。"}, {"word": "compliance", "definition": "契約や法律、協定などの要求事項に従うこと。特に国際条約や停戦協定において、当事者が合意内容を守っているかどうかを指す。"}, {"word": "alleged", "definition": "証拠がまだ十分でない状態で、～と言われている、～と主張されている意味。法的には未確認だが、疑いをかけられている事柄に用いられる。"}, {"word": "logistical", "definition": "作戦や事業遂行に必要な物資、輸送、人員配置などの後方支援に関する。軍事作戦で物資調達や移動手段の確保を意味することが多い。"}]}, {"title_ja": "米財務長官がイランの「経済命綱」を断つことを誓約", "title_en": "U.S. Treasury Chief Vows to Cut Every 'Economic Lifeline' of Iran", "summary_ja": "米国財務長官スコット・ベッセント氏はイランに対する「経済的窒息」戦略を発表し、二次制裁を拡大し、圧力キャンペーンに参加することを拒否する国々に対する結果を警告しました。財務省はデジタル資産、技術、金、航空、海運の5つの重要部門を標的にし、イランのための資金洗浄を助長する事業体は米ドルシステムから削除されることを警告しています。ベッセント氏はテヘランに対する「経済的D-デー」が始まったと宣言し、継続中の紛争は膠着状態に陥っています。", "summary_en": "US Treasury Secretary Scott Bessent announced an 'economic asphyxiation' strategy against Iran, expanding secondary sanctions and threatening consequences for countries refusing to join the pressure campaign. The Treasury Department has targeted five critical sectors—digital assets, technology, gold, aviation, and shipping—while warning that entities facilitating money laundering for Iran will be removed from the U.S. dollar system. Bessent declared that 'economic D-Day' has begun against Tehran as the ongoing conflict remains at a stalemate.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-treasury-chief-vows-to-cut-every-economic-lifeline-of-iran/article71386161.ece", "state_media": false, "category": "政治", "full_text": "US Treasury Secretary Scott Bessent on Monday (August 24, 2026) laid out plans for the “economic asphyxiation” of Iran, expanding Washington’s secondary sanctions threats and warning of dire consequences for countries that decline to join the pressure campaign.\nMr. Bessent’s address comes almost six months into a war on Tehran that has ground to a stalemate, with stalled peace talks and Iran preventing most traffic through the crucial Strait of Hormuz.\n“Around the globe, our objective is to sever every economic lifeline that sustains this tyrannical regime until Tehran stands alone,” Mr. Bessent told a press conference.\n“We are going to hold everyone accountable, and this is economic asphyxiation of this regime.”\nHe added that countries not joining US sanctions would “share in the isolation” of Iran, and noted that Trump is making phone calls to world leaders with requests to stop their interactions with Tehran.\nThe Treasury Department said Monday that it has “issued determinations against five critical sectors — digital assets, technology, gold, aviation, and shipping — that the Iranian regime uses to try to prop up its failing economy.”\nMr. Bessent, meanwhile, vowed that any entity “that facilitates money laundering on behalf of Iran will be removed from the U.S. dollar system.”\nAsked if Chinese banks dealing with Iran could be targeted, Mr. Bessent said “no one is above the reach of U.S. sanctions.”\nThe Treasury chief earlier declared that an “economic D-Day” had begun against Tehran, in a column for the Financial Times.\nThe United States and Israel triggered the West Asia war with a massive wave of bombing against Iran on February 28, sparking Iranian retaliation across the region.\nPublished - August 25, 2026 01:02 am IST", "translation_ja": "", "vocab": [{"word": "asphyxiation", "definition": "呼吸ができなくなること、または比喩的に息の根を止めること。経済的に完全に機能不全にする状態を示します。"}, {"word": "secondary sanctions", "definition": "特定国との取引を行う第三国や企業に対して課される制裁。直接制裁ではなく、関連する企業や国に対する間接的な経済的圧力です。"}, {"word": "facilitate", "definition": "何かが起こるのを容易にする、促進する、または支援することを意味します。ここでは違法な資金移動を可能にすることを指します。"}, {"word": "stalemate", "definition": "膠着状態、進展がない状況。チェスの用語が転じて、紛争や交渉が動かない状態を表現します。"}, {"word": "tyrannical", "definition": "独裁的で専制的な統治を行う、という意味の形容詞。権力を乱用する政権を非難する文脈で使用されます。"}, {"word": "accountability", "definition": "責任、説明責任、または行為に対する責任を取ること。政策文脈では、違反国に対する制裁を意味します。"}]}, {"title_ja": "ネタニヤフ首相、イランが息子の暗殺を企てたと主張", "title_en": "Netanyahu Claims Iran Attempted to Assassinate One of His Sons", "summary_ja": "イスラエルのベンヤミン・ネタニヤフ首相は月曜日の電話インタビューで、イランが彼の2人の息子のうち1人の暗殺を企てたと明かしましたが、具体的な詳細は示していません。この暴露は10月の選挙を控えた政治的ライバルであるガディ・アイゼンコットのセキュリティ保護に関する議論の中で浮上しました。ネタニヤフの長男ヤイルは2024年初頭からマイアミに滞在しており、セキュリティコストをめぐる議論を引き起こしています。", "summary_en": "Israeli Prime Minister Benjamin Netanyahu disclosed during a Monday phone interview that Iran had attempted to assassinate one of his two sons, though he provided no specific details about the alleged plot. The revelation emerged during discussions about security protection for political rival Gadi Eisenkot ahead of October elections. Netanyahu's elder son Yair has been residing in Miami under security protection since early 2024, sparking controversy over taxpayer costs.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/israels-netanyahu-says-iran-tried-to-kill-one-of-his-sons/article71386058.ece", "state_media": false, "category": "社会", "full_text": "Israeli Prime Minister Benjamin Netanyahu said on Monday (August 23, 2026) that Iran had attempted to assassinate one of his two sons, without offering further details.\n“Something incredible happened: Iran targeted one of my sons. Iran tried to kill one of my sons,” Mr. Netanyahu said during a phone interview with Israel’s Channel 14.\nThe claim came during a discussion about reports that the Shin Bet domestic security agency had declined to provide a security detail for Gadi Eisenkot, the former army chief who is running neck and neck with Mr. Netanyahu ahead of elections on October 27.\nMr. Netanyahu voiced support for around-the-clock protection for Eisenkot, saying it was “not a luxury”.\n“Without that, (the Iranians) will succeed,” he said.\nMr. Netanyahu has two sons and a daughter. It remains unclear which of his sons was allegedly targeted.\nHis elder son, Yair, 35, has spent extended periods in Miami since early 2024, reportedly under Shin Bet protection.\nHis stay in the United States has attracted controversy in Israel over the cost to taxpayers of providing security, while some residents in south Florida have expressed concern that his presence could make the area a target for attacks by Israel’s enemies.\nShortly after Mr. Netanyahu’s remarks became public on Monday (August 24, 2026), prominent Israeli journalist Amit Segal wrote on his Telegram channel that the alleged assassination attempt had been known for “months” but was subject to a gag order.\nPublished - August 24, 2026 11:27 pm IST", "translation_ja": "", "vocab": [{"word": "assassination", "definition": "政治的またはその他の理由で重要人物を殺害する行為。多くの場合、計画的で秘密裏に実行されます。"}, {"word": "alleged", "def
