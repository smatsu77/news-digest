etween hardliners seeking total victory and moderates pursuing negotiated settlements.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-us-war-live-updates-donald-trump-mojtaba-khamenei-fresh-strikes-irgc-strait-of-hormuz-ceasefire-deal/article71297056.ece", "state_media": false, "category": "政治", "full_text": "West Asia updates: Iran media denies Trump claim that Tehran asked U.S. not to strike\nThe U.S. President said he will order American forces to hold off on new strikes against Iran, claiming West Asia allies had reached the parameters of a deal to end the war\nU.S. President Donald Trump. File\n| Photo Credit:\nAP\nThis LIVE is now closed\nIran’s Mehr news agency on Sunday (August 2, 2026) denied President Donald Trump’s claim that the Islamic republic asked the United States to refrain from conducting new strikes.\nCiting military officials, the agency said the allegation “was nothing but a new lie” and that the Iranian armed forces were “on high alert and ready for any eventuality”. Earlier, Mr. Trump said the U.S. was “ready to go against the Islamic republic” but that Tehran and other countries in West Asia had asked him to hold off on fresh strikes.\nMr. Trump said he will order American forces to hold off on new strikes against Iran. The emerging deal “would include the Immediate, Complete, and Total opening of the Hormuz Strait, and an end to Iran’s nuclear threat,” he wrote in a social media post.\nAugust 02, 2026 22:00\nEfforts underway to revive June U.S.-Iran deal: Iranian MP\nAn Iranian lawmaker said on Sunday (August 2, 2026) that mediators were seeking to revive a deal that briefly halted the war between Iran and the United States in June.\nHassan Ghashghavi, spokesman for Parliament’s national security commission, said in a video interview that “there is an effort underway to revive the 14-point Islamabad agreement, particularly by the mediators”.\n“They know that the main issue and, in fact, the key to the matter right now is the issue of the Strait of Hormuz, so yes, there is an exchange of views,” he said.\n- AFP\nAugust 02, 2026 15:48\nIran media denies Trump claim that Tehran asked U.S. not to strike\nIran’s Mehr news agency on Sunday denied President Donald Trump’s claim that the Islamic republic asked the United States to refrain from conducting new strikes.\nCiting military officials, the agency said the allegation “was nothing but a new lie” and that the Iranian armed forces were “on high alert and ready for any eventuality”.\nOn Saturday, Mr. Trump said the U.S. was “ready to go against the Islamic republic” but that Tehran and other Middle Eastern countries had asked him to hold off on fresh strikes.\nHe said he had made the decision, subject to reaching a deal with Iran.\n“This would include the Immediate, Complete and Total OPENING OF THE HORMUZ STRAIT, and an end to Iran’s nuclear threat,” wrote Mr. Trump in a Truth Social post.\nOn Sunday, Iran’s Fars news agency citing a source close to Iranian negotiators said “as long as the United States maintains its hostile actions, the Strait of Hormuz will remain closed”.\nIran has blockaded Hormuz since the start of the war, requiring vessels to obtain permission and pay transit fees before using the waterway.\n-AFP\nAugust 02, 2026 13:33\nIran sees every threat from adversaries as \"real and credible\", acting Defence Minister says\nTehran views every threat from its adversaries as “real and credible” even if made as part of psychological warfare, Iran’s acting Defence Minister, Majid Ibn al-Reza, said on Sunday according to state media.\n“We will neither be caught off guard nor remain passive,” he said, adding that Iran would use threats as a basis to increase its military readiness, strengthen deterrence and enhance its military capabilities.\n-Reuters\nAugust 02, 2026 11:11\nIran’s leaders show a united front over the war but are divided over what the goal is\nWith escalating attacks against U.S. bases and its allies over the past week, Iran’s leaders are showing considerable unity over their war strategy: hanging tough, determined to show Iran can endure more than America and its allies can.\nBut within the leadership, there are sharp differences over what the endgame should be.\nOn one side, the ultra-hardliners who oppose any negotiations with the United States are pressing for total victory in the war. Known as the “Paydari” movement – Persian for “stability” – they are hard-core ideologues who want to enforce the Islamic Republic’s control over society.\nOn the other, those who support President Masoud Pezeshkian and powerful parliament speaker Mohammad Bagher Qalibaf — who doubles as Iran’s chief negotiator — see military pressure as a way to win a negotiated deal with the United States. This camp is also spurred by concern over the economic toll Iran is suffering from the war and the need to adapt to social change in the country.\n-AP\nAugust 02, 2026 08:01\nTrump says U.S., Israel to hold off on Iran strikes\nU.S. President Donald Trump said that the United States and Israel had agreed to hold off on planned strikes on Iran at the request of Tehran and other countries in the region -- provided a deal is quickly reached.\n“The USA is locked and loaded and ready to go against the Islamic Republic of Iran, at levels of Military Terror, Strength, and Power not seen sin", "translation_ja": "", "vocab": [{"word": "blockade", "definition": "特定の地域や国への物資・人員の出入りを封鎖する軍事戦略。ここではイランがホルムズ海峡を封鎖していることを意味する。"}, {"word": "deterrence", "definition": "相手に対抗行動を起こさせないようにする軍事的抑止力。防衛戦略における重要な概念である。"}, {"word": "endgame", "definition": "紛争や交渉の最終段階。ここではイラン指導部が戦争の結末についてどのような目標を持つかについて使われている。"}, {"word": "hardliners", "definition": "妥協を拒否し強硬な立場を取る人々。政治的には過激派や強硬派を指す。"}, {"word": "mediation", "definition": "紛争当事者間の仲介や調停。第三者が両者の合意を促進するプロセス。"}, {"word": "refrain", "definition": "自発的に何かを控える、避ける。ここでは米国に攻撃を控えることを要求することを意味する。"}]}, {"title_ja": "トロント病院の緊密なチームが遠く離れた戦争によって引き裂かれる", "titl a has been transformed beyond recognition. Once serving as the country's main gateway, the area now bears the scars of the disaster. The earthquakes have left a lasting impact on this critical economic hub.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/02/world/americas/venezuela-earthquakes-la-guaira.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カウボーイ・フリンガンのベーシスト、ケベック州首席科学者に任命", "title_en": "Cowboys Fringants Bassist Named Quebec's Chief Scientist", "summary_ja": "ケベック州で最も人気のあるフォークロックバンドの一つであるカウボーイ・フリンガンのベーシスト、ジェロム・デュプラがケベック州の首席科学者に任命されました。この新しい職務では、同州の環境政策と科学的方向性の形成に携わります。音楽活動と科学的専門知識を融合させた人事となります。", "summary_en": "Jérôme Dupras, bassist for one of Quebec's most popular folk rock bands, has been appointed as the province's chief scientist. In this new role, he will help shape Quebec's environmental policy and scientific direction. The appointment brings together his musical career with his scientific expertise.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/02/world/canada/jerome-dupras-quebec-chief-scientist-les-cowboys-fringants.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、ガザ北部への通行を許可 人質問題の膠着状態が打開", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "イスラエルは、人質解放をめぐる膠着状態が解決された後、ガザを二分する軍事ゾーンの横断を開始することを許可した。この動きは、家族を分断し、北部地域への帰還を妨げてきたアクセス制限の大きな転換を示している。", "summary_en": "Israel has allowed displaced Palestinians to begin crossing a military zone that divides Gaza after resolving a deadlock over hostage releases. The movement marks a significant shift in access restrictions that have separated families and prevented civilians from returning to northern areas of the enclave.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "China's Top Property Developer Reports Massive Loss Amid Real Estate Crisis", "summary_ja": "中国大手不動産開発企業のワンケが巨額の損失を報告し、中国の不動産危機が深刻化していることが明らかになった。同社の経営危機は、業界全体への財務的困難の波及可能性と、市場安定化のための政府介入の必要性について疑問を生じさせている。", "summary_en": "Vanke, a leading Chinese property developer, has reported significant losses, signaling the deepening real estate crisis in China. The company's troubles raise questions about the potential spread of financial difficulties across the sector and whether government intervention will be necessary to stabilize the market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃の破片がまだ体に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From Oct. 7 Attack", "summary_ja": "ハマスから解放された女性人質の一部は、長期間の単独監禁を受け、8ヶ月間地下トンネルで過ごしていたとイスラエルの医療関係者が述べた。解放された人質の体には依然として10月7日の初期攻撃の破片が埋め込まれており、捕虜期間中の負傷の深刻さが明らかになった。", "summary_en": "Some of the women released from Hamas captivity were held in isolation for extended periods and spent eight months in underground tunnels, according to Israeli medical officials. The freed hostages still had shrapnel embedded in their bodies from the initial October 7 attack, revealing the extent of their injuries during captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "歴史上最も重要な包囲戦", "title_en": "The Most Significant Sieges in History", "summary_ja": "エコノミスト誌の「War Room」ニュースレターは、歴史の流れと文明の運命を決めた重要な包囲戦を検証しています。シニアエディターのリチャード・コッケット氏が、軍事キャンペーン全体がいかにしてこれらの決定的な戦闘によって左右されたかを探ります。この記事は戦争における包囲戦の戦略的重要性と、歴史的結果に対するその深刻な影響を強調しています。", "summary_en": "The Economist's War Room newsletter examines pivotal sieges that have shaped the course of history and determined the fate of civilisations. Senior editor Richard Cockett explores how entire military campaigns have turned on these decisive battles. The article highlights the strategic importance of sieges in warfare and their lasting impact on historical outcomes.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/31/the-war-room-newsletter-the-most-significant-sieges-in-history", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "レストラン業界が急速に変化している", "title_en": "The restaurant business is changing beyond recognition", "summary_ja": "テクノロジー、インフレーション、消費者の習慣の変化により、レストラン業界は大きな転換期を迎えています。配達プラットフォームから労働力の課題、食事スタイルの変化まで、飲食店は生き残るために適応が必要です。同業界はかつてない圧力に直面しており、レストランの運営方法と顧客サービスのあり方を根本的に変えています。", "summary_en": "The restaurant industry is undergoing significant transformation driven by technology, inflation, and evolving consumer preferences. From delivery platforms to labor challenges and changing dining habits, establishments must adapt to survive. The sector faces unprecedented pressures that are reshaping how restaurants operate and serve customers.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/30/the-restaurant-business-is-changing-beyond-recognition", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権下でフランスの核戦力はヨーロッパを守れるか？", "title_en": "Can French Nuclear Power Protect Europe Without US Support?", "summary_ja": "トランプ政権復帰の可能性が高まる中、ヨーロッパ諸国はマクロン大統領下のフランスとの核協力の強化を模索している。しかし右翼の有力候補マリーヌ・ルペンが大統領になった場合、フランスの防衛戦略と核協力の枠組みが大きく変わる可能性があり、ヨーロッパの安全保障に影響を与える恐れがある。", "summary_en": "European nations are exploring closer nuclear cooperation with France under President Macron as concerns grow about US security commitments under a potential Trump administration. The strategy faces uncertainty if right-wing candidate Marine Le Pen were to become president, potentially altering France's approach to continental defense and nuclear collaboration.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/28/can-french-nukes-protect-europe-if-donald-trump-walks-away", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "バルセロナの伝統的蒸し風呂で：ロシア系とウクライナ系亡命者が戦争を語らぬまま共存", "title_en": "Russian and Ukrainian exiles find common ground at Barcelona's traditional steam baths", "summary_ja": "過去1年間、バルセロナではロシアと東欧の伝統的蒸し風呂が次々とオープンし、2022年の戦争勃発後にコスタ・ブラバに殺到したロシア系とウクライナ系の両コミュニティに人気となっている。これらの施設は予期せず中立的な空間となり、両グループが戦争について語らないという暗黙の了解のもと共存している。バニャ文化は、対立する両者が同じ空間を比較的平和に共有する貴重な避難所となっている。", "summary_en": "Traditional Eastern European and Russian steam baths have become popular gathering spots in Barcelona over the past year, attracting both Russian and Ukrainian communities who fled to the Costa Brava since 2022. These establishments have unexpectedly become neutral spaces where the two groups can coexist peacefully, with an unspoken agreement to avoid discussing the war. The banya culture has created a rare sanctuary where former adversaries share the same space in relative harmony.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/m-le-mag/article/2026/08/02/in-barcelona-russian-and-ukrainian-exiles-cross-paths-at-the-baths-we-don-t-talk-about-the-war-not-even-at-the-banya_6756093_117.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス、9月の教皇レオ14世の歴史的訪問に向けて準備を開始", "title_en": "French Catholic Church Prepares for Historic Papal Visit in September", "summary_ja": "教皇レオ14世は9月25日から28日にかけてフランスを訪問し、パリ、ルルド、メスを巡る予定である。これはフランスへの正式な教皇訪問としては20年近ぶりとなる。フランスカトリック教会はこの重要な宗教外交イベントに向けた準備を進めている。", "summary_en": "Pope Leo XIV will undertake a historic visit to France from September 25 to 28, traveling to Paris, Lourdes, and Metz. This marks the first formal papal visit to the country in nearly 20 years. The French Catholic Church is actively preparing for this significant religious and diplomatic event.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/08/02/french-catholic-church-prepares-for-pope-leo-s-historic-visit-in-september_6756078_7.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セウタへの短い越境後、モロッコの若者たちは幻滅に直面", "title_en": "Young Moroccans Face Disillusion After Brief Crossing to Ceuta", "summary_ja": "木曜日と金曜日に約5万人のモロッコの若者がスペインの飛び地セウタになだれ込み、ヨーロッパへの到達を試みた。しかし、ほとんどの移民希望者はその後戻ってしまい、セウタは閑散とした状態になっている。短い越境の試みは、多くの人がフニデクへの帰路で失望に直面している。", "summary_en": "Approximately 50,000 young Moroccans rushed to the Spanish enclave of Ceuta on Thursday and Friday in an attempt to reach Europe. However, most would-be migrants have since turned back, leaving Ceuta deserted. The brief crossing has left many facing disappointment as they return to Fnideq.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/le-monde-africa/article/2026/08/02/in-fnideq-near-ceuta-young-moroccans-face-disillusion-after-brief-crossing-into-europe_6756090_124.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省からのお知らせ", "title_en": "Mindef Updates", "summary_ja": "国防省は定期的に最新情報と発表を配信しています。読者は海峡時報のニュースレターに登録して、より多くの国防関連ニュースを受け取ることができます。", "summary_en": "The Ministry of Defence releases regular updates and announcements. Readers can subscribe to The Straits Times newsletters for more defence-related news and information.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートは、購読者に毎日のニュース報道と最新情報を提供しています。本版は2026年8月2日に発行され、読者に追加の無料ニュースレターと購読管理オプションへのアクセスを提供しています。", "summary_en": "The Straits Times Evening Update provides subscribers with daily news coverage and developments. This edition was published on August 2, 2026, and offers readers access to additional free newsletters and subscription management options.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズのモーニング・ブリーフィングは、日々のニュース更新と主要なストーリーを提供しています。読者はザ・ストレーツ・タイムズのプラットフォームを通じて、追加の無料ニュースレターに登録し、購読を管理することができます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and key stories. Readers can sign up for additional free newsletters and manage their subscriptions through The Straits Times platform.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、国際軍配置予定地域への攻撃権を要求", "title_en": "Israel Demands Right to Strike Gaza Areas Designated for International Force", "summary_ja": "イスラエルは国際平和維持軍の統制下に置かれるガザ地域における軍事攻撃の実施権を維持するよう主張している。この要求は、イスラエルの安全保障上の懸念と、この地域での軍事作戦の完全な統制権放棄への抵抗を反映している。", "summary_en": "Israel is insisting on maintaining the ability to conduct military strikes in Gaza areas that would be controlled by an international peacekeeping force. The demand reflects Israeli concerns about security and its unwillingness to cede complete control over military operations in the territory.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihgJBVV95cUxPX1RFSmg4YnNzUTBIalBvY3V0UkRiUkhoZFpLR0RacXV2czZtcTQ3bTcyY3RYSUFuLUxLRmRwZkwzVTI3QTlfTWVhMVdQNlhKTlhwQlE4R3dTQzkxaU42OVgyYlZDX1JSV0NQOFBNQ3U1c1BmS1lmek5aZGRRR3FJTlF2S1JTSUEyaVRGbW1rSUQyc09Nc0NlTkpSeExRM1h0ZlhnVnBXbERkQ3ExVE1WaVBuTkZpWXVSZ3ZTdWkxQk5nN05SYXpLRHZkdUNSS3g3c1RIQmdNYV9KcEVwTTNIaHMwWEFYWGJ5eS1MRGZ6S3JMemtfLWlmNllha0pkQXBRVmtpV3Z3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相、ウクライナへのアイアンドーム送付要請を拒否", "title_en": "Netanyahu Blocked Request to Send Iron Dome to Ukraine", "summary_ja": "イスラエルのベンヤミン・ネタニヤフ首相は、アメリカのリンジー・グラハム上院議員がウクライナへの防空システム「アイアンドーム」送付を要請したことを拒否したと報じられている。この決定は、地域の緊張の中でイスラエル自身の防衛能力を維持したいという懸念を反映している。", "summary_en": "Prime Minister Benjamin Netanyahu reportedly rejected a request from U.S. Senator Lindsey Graham to transfer Israel's Iron Dome air defense system to Ukraine. The decision reflects Israel's concerns about maintaining its own defensive capabilities amid regional tensions.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilwJBVV95cUxNVEtfcWdOdjFjZmQxT2ZQczMzZTNRME1kV2NxOFNZVWdjbk5KNXg1VllNS1JiME13Mzg0NmF1U3c1UHQ3TjM3MUVoT09vSE9JcllyaGczT3VoajZTVHZDSXFnN0Z2THBTelMtZkgwblhKNkNTN1ZyNExoN2ZjN25hTjBtQXB3UmszMHpaYnlSMkZRTTMtY2FEOGRUeGFPNkcyZ3R0UDZRSldncnZYVVY2NjRweUZEb2FaNVk5LXZHYndJV184VHh4RUltLVFEbF81bE5wTzc1QTJEV2lxSXVfSzhlWHU5SGFZYzJ0V25sYWdBR2hPZE9kNXlHVGVOeERtOGpxWkZBQm9SWWRlSHBJaWRtcUJQNWM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "論評：暴力が喜びの源となる中、イスラエル人が戦争を望む理由", "title_en": "Opinion: Why Israelis Support War as Violence Becomes a Source of Joy", "summary_ja": "ハアレツの論評記事は、イスラエル社会における暴力が正常化され、さらには賞賛されるようになった文化的転換を検討しています。記事は、この憂慮すべき傾向がイスラエル国民の広範な軍事行動支持を説明していると主張しています。", "summary_en": "A Haaretz opinion piece examines the cultural shift in Israeli society where violence has increasingly become normalized and even celebrated. The article argues this troubling trend explains the widespread support for military action among the Israeli public.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiigJBVV95cUxQSDJvNFFxazR3QkY0VHZUeTlXbWJfLWc5Yl9Hb2xGMC1URVNkdUdmN1h1bmV5Wnd4U1A1ZnhIM0V3ZS1ScUF3dS1YclBIUVdXVlB6dTZlU2V4bF9FZjQyazlULW1PNEhvclJ3QjVsWmRnWkJNOTlEQngySFZyb1FDY21kUGIyUzN5VEZ0OU43ODAyYVNUVnJEQkh0WkJjalBUQzJ3aU41RkVmQVFDVHphRThob2dpRnNwMXhBNjJwNENmUDBGOUZZQjJXZlRYR2hHd0F0Q3N6SEVMQ204SVJlRnc1U045MkpTSTlZdjUxdnFtb1c4ZWVudGpqSmFORFVRcVIxSldqXzJRZw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、強制労働に関連する輸入品をブロックするメカニズムを発動", "title_en": "Taiwan launches mechanism to block imports tied to forced labor", "summary_ja": "台湾は強制労働を使用して生産された商品の輸入を防ぐための新しいメカニズムを確立しました。このシステムはサプライチェーンの透明性を強化し、国際労働基準への準拠を確保することを目指しています。この措置は、台湾の倫理的な貿易慣行と人権保護への取り組みを反映しています。", "summary_en": "Taiwan has established a new mechanism to prevent the importation of goods produced using forced labor. The system aims to strengthen supply chain transparency and ensure compliance with international labor standards. This measure reflects Taiwan's commitment to ethical trade practices and human rights protection.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBqeDF3cjRyc0pnSFF4UWxWRlZFQzdMY3YzYU5mT1BUd3Q5YXRPQjFTOVpxcEo3S3RzSURzRFZvajBLbVJ6b19lVFBVbzZ0RVZ2T09wdFowNA?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "外交的対抗措置としてモロッコ国民の台湾ビザ申請を禁止", "title_en": "Morocco Bans Taiwan Visa Applications in Diplomatic Dispute", "summary_ja": "台湾はモロッコの外交的行動に対抗するため、モロッコ国民のビザ申請を禁止した。この措置は両者間の緊張の激化を示している。この動きはモロッコの以前の決定への相互報復と位置づけられている。", "summary_en": "Taiwan has barred Moroccan citizens from applying for visas in response to Morocco's diplomatic actions. The measure represents an escalation in tensions between the two entities. The move is characterized as a tit-for-tat response to Morocco's earlier decision.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1GWWZYQ19KNVpXQmliMENxckMzVkYta0dzRXg1VzlQQ1dZUHJ3NWxrcF9RaEtGME5kSl95LXhkTml3UE5NMHJJcFBNZ2pNZ2ZCcDBxb01Qcw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、マレーシアの非中国系学生の新たな留学先として浮上", "title_en": "Taiwan Emerges as New Study-Abroad Destination for Non-Chinese Malaysians", "summary_ja": "台湾は、中国系以外のマレーシア人学生にとって新たな留学先として注目されるようになっています。この傾向は、より広い範囲のマレーシア人学生の間で、台湾の教育機関と文化的魅力への関心の高まりを反映しています。", "summary_en": "Taiwan is increasingly attracting Malaysian students from non-Chinese ethnic backgrounds as a study-abroad destination. The trend reflects growing interest in Taiwan's educational institutions and cultural appeal among a broader demographic of Malaysian students.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE53a29YR1hVdFNESjBqanZzRDUyZFdLWWl3U0hWZ01CZXppX2ZvVG16YmMtWnBYeGptX2hEb25Yd2hWUXFDVm1ZMTZ6X0hTTzk3UHg4Q25n?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の夏季経済に関する世論調査", "title_en": "Poll on China's Summer Economy", "summary_ja": "CGTNが夏季における中国経済のパフォーマンスについての世論調査を報道しています。この調査は、この期間における様々なセクターの消費者心理と経済指標に関するデータを収集しています。", "summary_en": "CGTN reports on a poll examining China's economic performance during the summer season. The survey gathers data on consumer sentiment and economic indicators across various sectors during this period.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-01/Poll-on-China-s-summer-economy-1PfsHe3VZIY/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2026年上半期の成長エンジンとしてのイノベーション", "title_en": "Innovation Positioned as Key Growth Engine for First Half of 2026", "summary_ja": "CGTNは、2026年上半期の経済成長の重要な推進力としてイノベーションが位置付けられていると報じています。同国営メディアは、この時期の経済発展を支援する上で、技術革新と革新的なソリューションの役割を強調しています。", "summary_en": "CGTN reports that innovation is being identified as a crucial driver of economic growth in the first half of 2026. The state media outlet highlights the role of technological advancement and innovative solutions in supporting economic development during this period.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-01/Innovation-seen-as-key-growth-engine-in-first-half-of-2026-1PfMsUbNkjK/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ブラジル、米国の「根拠のない」主張に基づく通商権延長を非難", "title_en": "Brazil Accuses US of Extending Trade Powers on 'Baseless' Claims", "summary_ja": "CGTNは、ブラジルが米国を非難したと報じており、米国は「根拠のない虚偽の」主張を使用して同国に対する緊急通商権を1年間延長したとしている。CGTNによると、この延長により米国はブラジル産輸出品に対する懲罰的関税を継続課すことが可能になるという。CGTNは、ブラジルがこの措置を正当化できないものと見なしていると報じている。", "summary_en": "CGTN reports that Brazil has denounced the United States for using what it characterizes as 'baseless and false' claims to extend emergency trade powers against the country for another year. According to CGTN, this extension allows the US to continue imposing punitive tariffs on Brazilian exports. CGTN reports that Brazil views the move as unjustified.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-07-30/Brazil-accuses-US-of-extending-trade-powers-on-baseless-claims-1PccVH60vmM/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの作戦によりガザで少なくとも19人のパレスチナ人が殺害", "title_en": "At least 19 Palestinians killed in Gaza during Israeli operations", "summary_ja": "TASS/RTは、イスラエルの作戦の結果、ガザで1日に少なくとも19人のパレスチナ人が殺害されたと報じている。アルジャジーラが引用したガザの病院関係者によれば、飛び地北部のガザシティで12人が殺害されたという。当該報告は、その日の事件に関する病院筋からの死傷者数を提供している。", "summary_en": "TASS/RT reports that at least 19 Palestinians were killed in Gaza during a single day as a result of Israeli operations. According to sources in Gaza hospitals cited by Al Jazeera, 12 people were killed in Gaza City in the northern part of the enclave. The report provides casualty figures from hospital sources regarding the day's incidents.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2168207", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "サウジアラビアとイランの外交官が地域緊和努力について協議", "title_en": "Saudi and Iranian diplomats discuss regional de-escalation efforts", "summary_ja": "TASSによると、サウジアラビアとイランの高位外交官が地域の緊張緩和に焦点を当てた協議を行った。ファイサル・ビン・ファルハン・アルサウド皇太子は、サウジアラビアが地域の安全保障と安定性確保における重要な役割を果たし続けることに尽力していると述べた。この協議は両国間の地域安全保障に関する外交的関与を示している。", "summary_en": "TASS reports that top Saudi and Iranian diplomats held discussions focused on de-escalation in the region. Prince Faisal bin Farhan Al-Saud stated that Saudi Arabia remains committed to playing a key role in ensuring regional security and stability. The talks signal diplomatic engagement between the two nations on regional security matters.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2168205", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア海事委員長、アルジェリアで海事物流協力を協議", "title_en": "Russian Maritime Board Chief Discusses Mediterranean Logistics in Algeria", "summary_ja": "タス通信によると、ロシア海事委員会の長官がアルジェリア当局者と海事物流協力について協議を行った。国営メディアによれば、地中海地域の航海安全保障確保も討議の対象となったという。", "summary_en": "TASS reports that Russia's Maritime Board chief held talks with Algerian officials on maritime logistics cooperation. The discussions included ensuring navigation security in the Mediterranean region, according to state media sources.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2168203", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカのエネルギー呪いは政治的選択である", "title_en": "Africa's Energy Curse Is a Political Choice", "summary_ja": "アフリカは膨大な石油・ガス埋蔵量を保有しながら、6億人の市民が電力へのアクセスを欠いており、大陸は国内エネルギー開発よりも炭化水素輸出を優先している。著者らは、これは経済的必要性ではなく、汚職、エネルギー補助金、地政学的圧力によって駆動される政治的選択であると主張し、このトレードオフについての透明な議論が急務であると述べている。", "summary_en": "Africa possesses vast oil and gas reserves while 600 million citizens lack electricity access, yet the continent prioritizes hydrocarbon exports over domestic energy development. The authors argue this is a political choice driven by corruption, energy subsidies, and geopolitical pressures rather than economic necessity, and that transparent debate on this tradeoff is urgently needed.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/africa-energy-abundance-alongside-deprivation-is-a-choice-by-rabah-arezki-and-michael-l-ross-2026-07", "state_media": false, "category": "オピニオン", "full_text": "Africa’s Energy Curse Is a Political Choice\nRabah Arezki and Michael L. Ross\nLIBREVILLE/LOS ANGELES—Africa is facing one of the world’s great energy windfalls. The continent holds roughly 125 billion barrels of confirmed oil reserves and more than 620 trillion cubic feet of natural gas, implying vast additional deposits still waiting to be discovered. At the same time, some 600 million Africans have no electricity at home, and this figure has not fallen since the COVID-19 pandemic. On current trends, it will still exceed a half-billion in 2030.\nThe problem is not geological, but political. Every barrel of oil shipped from an African port to a European or Chinese terminal is a barrel not converted into kilowatts for an African household. Every long-term liquefied natural gas (LNG) contract signed with a foreign utility commits gas that could be powering an African hospital, school, or factory. The choice between exporting hydrocarbons and using them to electrify the continent is highly consequential yet almost never debated openly. That needs to change.\nThe case for energy exports is clear enough. The continent depends heavily on imported food, medicines, capital equipment, and manufactured goods that it does not yet produce at scale. For many producer countries, oil and gas exports are the only reliable source of foreign exchange, without which they cannot pay for those imports, service sovereign debt, or maintain enough fiscal space to function.\nBut the case for domestic use is equally compelling. Nigeria holds enough natural gas to achieve 100% electrification within its borders, and gas-to-power projects across the continent have long demonstrated technical viability. The International Energy Agency estimates that achieving universal electricity access in Africa would require annual investments of $15 billion for ten years, and though only $2.5 billion is currently being committed each year, domestically deployed hydrocarbons could help bridge the gap.\nIn theory, these two options are economically equivalent. A government could export oil, invest the proceeds well, and use the returns to finance power infrastructure. A barrel exported at world prices and a barrel converted into electricity should produce the same national wealth if governance is sound and pricing is free.\nIn reality, neither condition has been met. One major distortion is corruption. Rather than being invested in electrification, hydrocarbon revenues in most African producer states are regularly captured. Nigeria has generated more than $600 billion in oil revenues since the 1960s while also recording one of the world’s highest rates of extreme poverty. During oil-boom years, Equatorial Guinea has achieved the continent’s highest per capita GDP even as over half of its population lives below the poverty line.\nPS Deep Dive: Oligarchy\nA collection of PS commentaries examining how a few individuals amassed unprecedented wealth—and how they are using it to dismantle democracy. Featuring insights from Cristina Enache, Brooke Harrington, James Livingston, Michael Madowitz, Ann Pettifor, Matt Simonton, and Quinn Slobodian.\nSubscribe and save 30%\nAll told, research tracking offshore bank accounts has found that around 15% of windfall gains flowing to petroleum-producing countries with weak institutional safeguards ends up in the pockets of those in power. This easy money then becomes easy spending—but on elite luxury consumption, not public investment.\nDomestic energy subsidies are a second distortion. In many African producer states, consumers pay far less for fuel and electricity than the actual cost. Angola has the world’s fourth-cheapest retail gasoline. Nigeria’s domestic gas prices have historically been held so low that building a gas-fired power plant is commercially pointless.\nThese subsidies are not accidents. They are core instruments of the petrostate political economy: a diffuse benefit handed to populations who otherwise see little of the wealth nominally being extracted on their behalf. But subsidies also send a false signal to investors and governments, making energy exports appear economically superior to domestic use, even when the welfare arithmetic says otherwise.\nRecent geopolitical shocks are a third factor. Russia’s full-scale invasion of Ukraine severed some 80 billion cubic meters of annual gas supplies to Europe, and this year’s Middle East war tightened LNG markets further. Suddenly, European governments were in Algiers, Dakar, and Maputo pleading for more supply. Algeria became the European Union’s second-largest pipeline gas supplier in 2023, providing 20% of pipeline imports, behind Norway at 54% and ahead of Russia at 17%. Angola has directed LNG cargoes westward. And a new project off Mauritania and Senegal shipped its first cargo to Atlantic markets in 2025.\nFor African producers, the windfall has come in the form of both revenues and political cover. Governments now have internationally legitimized reasons to de", "translation_ja": "", "vocab": [{"word": "windfalls", "definition": "予期しない、特に大きな利益や幸運。通常、政府や企業が急に得た多額の収入を指す。"}, {"word": "liquefied natural gas (LNG)", "definition": "天然ガスを液化したもの。冷却・圧縮により輸送・貯蔵が容易になる。国際的なエネルギー取引で重要。"}, {"word": "fiscal space", "definition": "政府が支出や投資に使用できる予算上の余裕。インフレや債務管理の制約を受ける。"}, {"word": "distortion", "definition": "本来の状態から歪んだ状態。市場経済では、汚職や過度な規制など、効率的な資源配分を阻害する要因を指す。"}, {"word": "petrostate", "definition": "石油・ガス産業が経済と政治の中心である国家。しばしば資源の呪いや統治の問題と関連する。"}, {"word": "geopolitical", "definition": "地政学的な。国家間の地理的位置、資源、戦略的利益に基づいた政治的関係や紛争に関する。"}]}, {"title_ja": "EUの急速に縮小する銀行セクター", "title_en": "The EU's Incredible Shrinking Banking Sector", "summary_ja": "著者は世界的な銀行力の劇的な逆転を指摘している。25年前、5大EUの銀行各行は米国最大手銀行を時価総額で上回っていたが、今日ではJPモルガン・チェース1行が5大EUの銀行すべてを合わせた時価総額を超えている。この論説は欧州の銀行支配力の衝撃的な低下を検証し、この競争上の不利さの背景にある構造的問題に対処するよう政策立案者に呼びかけている。", "summary_en": "The author highlights a dramatic reversal in global banking power: 25 years ago, each of the five largest EU banks surpassed the biggest US bank in market capitalization, but today JPMorganChase alone exceeds all five top EU banks combined. The piece examines this shocking decline in European banking dominance and calls for policymakers to address the structural issues behind this competitive disadvantage.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/top-five-eu-banks-lower-combined-market-capitalization-than-largest-us-bank-by-howard-davies-2026-07", "state_media": false, "category": "オピニオン", "full_text": "The EU’s Incredible Shrinking Banking Sector\n                        At the start of the millennium, all five of the largest European banks had a higher market capitalization than the largest US bank. What explains the fact that a quarter-century later, the largest US bank has a higher capitalization than all five top EU banks combined, and how can European policymakers address this dramatic reversal?\n                    \n                        LONDON—A quarter-century ago, each of the five biggest European Union banks had a market capitalization larger than that of the biggest US bank. Now the market capitalization of the biggest US bank, JPMorganChase, is higher than that of the top five EU banks combined. (The EU is coy about names, but we can presume that the EU banks include France’s BNP Paribas, Germany’s Deutsche Bank, and Spain’s Santander).\n        https://prosyn.org/vwp7ljZ", "translation_ja": "", "vocab": [{"word": "market capitalization", "definition": "企業の時価総額のこと。株価に発行済み株式数を掛けた値で、企業の市場評価を示す重要な指標である。"}, {"word": "reversal", "definition": "方向転換、逆転、または状況が反対に変わることを意味する。ここでは経済的地位の劇的な変化を指す。"}, {"word": "dominance", "definition": "優位性、支配力、または特定の分野や業界での圧倒的な優位の状態を表す。"}, {"word": "policymakers", "definition": "政策決定者、または政府や組織で方針や計画を決定する権限を持つ人々を指す。"}, {"word": "structural", "definition": "構造的な、組織や体系の根本的な性質に関する。問題の表面的でなく本質的な原因を示唆する。"}]}, {"title_ja": "AIは経済を拡大すべき、分断すべきではない", "title_en": "AI Must Enlarge the Economy, Not Divide It", "summary_ja": "ノーベル賞受賞者16人を含む200人以上の経済学者とAI研究者が、AIが産業革命よりもはるかに急速に世界経済を再構築する可能性があると警告する声明に署名した。著者らは、AIを人間を置き換えるのではなく補完するように開発すべきだと主張しており、この区別がこの技術の経済的影響を管理するために重要だと考えている。", "summary_en": "Over 200 economists and AI researchers, including 16 Nobel laureates, have issued a warning that AI could reshape the global economy more rapidly and dramatically than the Industrial Revolution. The authors argue that AI should be developed to complement human capabilities rather than replace them, a distinction they consider crucial for managing the technology's transformative economic impact.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-revolution-does-not-have-to-replace-human-work-by-mark-esposito-and-aurelie-jean-1-2026-07", "state_media": false, "category": "オピニオン", "full_text": "AI Must Enlarge the Economy, Not Divide It\nand\nCAMBRIDGE/PARIS—More than 200 economists and AI researchers, including 16 Nobel laureates, have signed the We Must Act Now statement, warning that AI could reshape the global economy on a scale larger than the Industrial Revolution—and far more quickly. We were among the signatories, but recognizing the stakes does not settle the question of how AI should be developed. One of the statement’s central claims is that AI should be steered toward complementing humans rather than imitating them. That distinction is more consequential than it may seem.", "translation_ja": "", "vocab": [{"word": "signatories", "definition": "署名者のこと。特に公式な文書や宣言に署名した人々を指す。ここでは声明に署名した経済学者やAI研究者を意味している。"}, {"word": "reshape", "definition": "大きく形を変える、再構築することを意味する。経済や社会構造などの大規模な変化を表現するために使われる。"}, {"word": "complementing", "definition": "何かを補う、補完することを意味する。AIが人間の能力を支援・強化する関係性を表す。"}, {"word": "consequential", "definition": "重要で、大きな結果や影響を伴う、という意味の形容詞。重大な、意味のあるという意味で使われる。"}, {"word": "stakes", "definition": "危険にさらされている利益や資源のこと。ここではAI開発が経済に与えるリスクと機会を指している。"}]}, {"title_ja": "ガーディアン紙の見解：グローバル企業税制改革は各国が掴むべき5000億ドルの機会", "title_en": "The Guardian view on global corporate tax: a $500bn prize that states must seize", "summary_ja": "ガーディアン紙は、多国籍企業の利益をタックスヘイブンではなく実際の経済活動が行われる場所で課税する「統一課税」を導入することで、各国が年間5000億ドルを共同で獲得できると主張している。ニューヨークで開催予定の国連交渉は、この原則をグローバル基準とするための財政枠組み条約確立を目指し、先進国と発展途上国の双方に大きなメリットがある。同紙は、米国の反対にもかかわらず、ブリテンがアフリカ主導の努力を支持し、各国が経済内で生み出された価値に課税できる環境を整えるべきだと促している。", "summary_en": "The Guardian argues that countries could collectively gain $500 billion annually by implementing unitary taxation, which taxes multinational corporate profits where actual economic activity occurs rather than in tax havens. Upcoming UN negotiations aim to establish a global fiscal framework convention to make this principle standard, with significant benefits for both wealthy nations like Britain and developing countries. The editorial urges Britain to support African-led efforts to ensure countries can tax value created within their economies, despite US opposition.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/02/the-guardian-view-on-global-corporate-tax-a-500bn-prize-that-states-must-seize", "state_media": false, "category": "オピニオン", "full_text": "Governments are told that public services must shrink because money is tight. Yet a new Tax Justice Network report says that countries could capture an extra $500bn a year without raising corporate tax rates. The answer is to tax multinational profits where real economic activity happens – known as unitary taxation. No new profit is created. Revenue simply shifts from tax havens where profits are “booked” to the countries where workers produce and customers spend.\nMaking that principle a global tax standard depends on UN talks opening in New York on Monday. Modelled on the UN climate regime, a fiscal framework convention would create the governing body and procedures, with protocols providing detailed rules. The UN wants agreement by late 2027. Donald Trump’s US walked out last year and urged others to follow. None did.\nRich countries gain most when firms pay tax where people work, not where profits vanish in havens, because their economies are the largest. Britain would collect about £13bn extra a year in tax receipts – two‑thirds of the cost of an NHS-style social care system. EU governments could raise enough to quadruple climate-adaptation spending. Poorer countries also benefit. The report calculates that the global south would receive $156bn in one year – more than the International Monetary Fund has outstanding in loans to those nations.\nFor the first time in decades, multinationals could be taxed where they actually do business. Rules built for the corporate world of the 1920s – when national industrial giants dominated – would finally confront today’s companies organised around intangible assets and global supply chains, as well as profits of an altogether different scale. In 1929, General Motors made the equivalent of $4.7bn. Apple’s profit last year was $112bn. What the report calls “diversified” tax havens such as Switzerland and the Netherlands could offset losses by raising rates. Pure booking centres such as the Cayman Islands could not.\nThe talks suggest states are beginning to reclaim powers surrendered under globalisation to corporate lawyers and private tribunals. One protocol would let countries tax digital and other cross-border services without waiting for firms to establish domestic offices, blunting Mr Trump’s trade threats. A second could go further, shifting tax disputes from secretive investor-state arbitration into a more open, publicly accountable UN-led system.\nThe direction is unmistakable. Ireland, which is facing an estimated $11bn annual tax loss, has already begun putting aside part of its “windfall corporate tax receipts” in a new fund – an admission that the revenue won’t last. India and Nigeria have legislated so that companies profiting from their economies should not escape the tax net just because they operate across borders.\nBritain has belatedly backed a UN-led shift towards taxing real activity. Defending rules entwined with its offshore network was politically indefensible and economically perverse. The US can sit out the negotiations, but it cannot shield American companies from others’ rules. The success of these talks has largely been down to African nations insisting on consensus where possible and majority rule where necessary. That denies the US and any rich-country bloc an effective veto. Backed by India, Brazil and other developing powers, an African-led coalition can now press a simple claim: countries should be free to tax value created within their economies. Britain should help them prevail.", "translation_ja": "", "vocab": [{"word": "unitary taxation", "definition": "多国籍企業の利益を、タックスヘイブンではなく実際の経済活動が行われた国で課税する方式。グローバルサプライチェーン時代に対応した課税制度。"}, {"word": "fiscal framework convention", "definition": "国連が主導する国際的な税制に関する協定枠組み。各国が課税権を行使するルールや手続きを定める公式な条約。"}, {"word": "tax havens", "definition": "法人税率が低い、または課税制度が緩い国や地域。多国籍企業が利益を計上して税負担を最小化するために利用される。"}, {"word": "intangible assets", "definition": "特許やブランド、知的財産など目に見えない形の資産。現代の大企業の収益源として重要な役割を果たす。"}, {"word": "investor-state arbitration", "definition": "企業と国家間の紛争を非公開の仲裁廷で解決する秘密裏の制度。透明性と民主的責任の欠如が問題とされている。"}, {"word": "windfall", "definition": "予期しない幸運な利益や利得。本来は得られないはずだった一時的な収入を指す。"}]}, {"title_ja": "トランプの通商戦争：セクション338が大統領に危険な関税権を与える可能性", "title_en": "Trump's Trade War: Section 338 May Give Him Dangerous Tariff Power", "summary_ja": "著者は、トランプがスムート・ホーリー関税法第338条を通じて関税を課す潜在的に阻止不可能な法的手段を見つけたと主張している。同法は、米国に不利益をもたらすと判断された国に対して報復する広範な権限を大統領に与えている。最高裁がIEEPA下での以前の関税戦略をブロックしたにもかかわらず、この新しいアプローチは危険な意味的柔軟性を提供し、裁判所で異議を唱えることが困難である可能性がある。", "summary_en": "The author argues that Trump has found a potentially unstoppable legal tool for imposing tariffs through Section 338 of the Smoot-Hawley Act, which gives the president broad authority to retaliate against countries deemed to disadvantage US commerce. While the Supreme Court blocked his earlier tariff strategy under the IEEPA, this new approach offers dangerous semantic flexibility and may be difficult to challenge in court, posing a serious threat to global trade.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/us-news/2026/aug/02/trump-tariffs-weapon", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump may have found the killer weapon to punish countries at will: by imposing tariffs on their exports to the United States.\nThe president has been looking for a new tool since February, when the supreme court struck down tariffs he slapped on virtually all of America’s trading partners based on the International Economic Emergency Powers Act, or IEEPA, on the spurious grounds that the US faced a variety of national emergencies. It’s become a parlor game among policy wonks to predict what new legal justification he would deploy to replace them.\nWell, it’s probably not what you think. The round-robin tariffs imposed on everybody last Friday, under the argument that America’s trading partners unfairly undercut US companies by importing things made with forced labor, has drawn a lot of attention. The blatantly specious accusation, sitting uneasily alongside America’s own state-sanctioned abuse of forced labor, underscored how low Trump will stoop to get his way on trade.\nBut those tariffs, imposed under section 301 of the Trade Act of 1974, do not provide the carte blanche Trump wants. Tariffs under this section are meant to retaliate against specific “acts, policies and practices” that are “unreasonable” and “burden or restrict” US companies. A blanket charge that every foreign country is enabling forced labor and thus hurting American business is unlikely to fly in court. The whole strategy can be challenged as “arbitrary, capricious, an abuse of discretion, or otherwise not in accordance with law” or as “unsupported by substantial evidence”.\nThe truly menacing precedent comes from Trump’s decision, made the Monday before the worldwide forced labor tariffs came into play, to foist a 50% tariff on imports from Canada.\nThe White House’s pretext is Canadian discrimination against American dairy, booze and cars, which, paradoxically, came about as retaliation against Trump’s original barrage of tariffs last year. Sly observers, however, have pointed to Trump’s threat to punish Canada for the forest-fire smoke that wafted into the US. Maybe the new duties are meant to soften Canada as talks get under way to renew the USMCA North American trade pact, or to convince Canadians to become America’s 51st state. Or just because “tariff” is a pretty word.\nThe authority Trump invoked to attack Canada is ominous: section 338 of the Smoot-Hawley Tariff Act of 1930, which is the law that choked global trade in the 1930s and helped sink the world into the Great Depression. Section 338 is particularly dangerous because it offers cover for the president to slap trade levies on whatever country he wants under some fairly hazy arguments.\nSpecifically, it grants the president authority to retaliate against countries that do anything to put the United States “at a disadvantage compared with the commerce of any foreign country”. As soon as the president decides this is going on, he is authorized to “declare such new or additional rate or rates of duty as he shall determine will offset such burden or disadvantage”.\nUntil Trump, section 338 was never invoked to impose tariffs. It was mostly used as leverage, to guarantee that other countries treated American products the same as imports from anywhere else. If some country offered preferential access to a neighbor or ally, the US could demand the same terms, or else.\nThis principle is now called “most favored nation treatment,” which is central to multinational trade rules enforced by the World Trade Organization. Trump doesn’t care about such niceties, though. He has a more destructive agenda in mind. And the statute appears to give him semantic wiggle room. He is determined to pursue his trade war. With such a sprawling mandate, he may be difficult to stop.\nAmerica’s trading partners were elated in February when a 6-3 majority on the court, including two justices appointed by Trump, ruled against his use of the 1977 IEEPA to impose tariffs at will. It was close, though.\nThe court has shown an almost unbelievable deference to the president. It didn’t object to Trump’s spurious invocation of national emergencies – a “public health crisis” due to illegal drugs from Canada, Mexico and China; trade deficits that “led to the hollowing out” of American manufacturing; something something because Brazil jailed its ex-president Jair Bolsonaro for plotting a coup. The justices merely objected to his use of the statute to impose taxes, which are the preserve of Congress.\nThe executive has gotten away with similarly spurious arguments before. In 1975 President Richard Nixon was allowed to invoke the Trading with the Enemy Act of 1917 to slap tariffs on a zipper company from Japan, a country with which the US was not at war. Trump’s lawyers, in fact, argued before the supreme court that this precedent supported the president’s emergency powers to raise tariffs on anybody under IEEPA.\nThough Trump lost, his menace to the world remains. Since February his minions have trawled through legal ", "translation_ja": "", "vocab": [{"word": "carte blanche", "definition": "制限や監督なしに自由に行動する権限。フランス語から英語に借用された表現で、「白紙委任」という意味で使用される。"}, {"word": "capricious", "definition": "理由なく気まぐれに行動する、または予測不可能な様子。法律では、恣意的で不合理な政府決定を説明するために使用される。"}, {"word": "semantic", "definition": "言葉や表現の意味に関連する。ここでは、法的言語の解釈や意味上の違いを指す。"}, {"word": "menace", "definition": "脅威や危険を表す。人や状況が他者に対して持つ悪影響や危険性を指す。"}, {"word": "spurious", "definition": "見た目は本物に見えるが、実は偽りで根拠のない。虚偽の主張や理由を説明するために使用される。"}, {"word": "deference", "definition": "権威や専門家に対する敬意を持った従順さ。法律では、裁判所が政府部門の決定に対して示す尊重の度合いを指す。"}, {"word": "invoke", "definition": "法律や規則を適用または引用する。権限を行使するために法律に訴えることを意味する。"}]}, {"title_ja": "トランプの新関税に米小企業がそこまで懸念していない理由", "title_en": "Why US Small Businesses Are Less Worried About Trump's New Tariffs", "summary_ja": "ビジネスコンサルタントは、米国の中小企業がトランプの最新関税について大きな懸念を示していない理由として、税率が以前の試みより低いこと、過去の関税払い戻しが処理されていること、そして企業が裁判所制度が関税措置を覆すことができることを学んだことを指摘しています。また、小企業は代替仕入先、国内製造、業務改善を通じて関税への適応をより革新的に行うようになり、関税はコロナ以降の他の上昇コストと比較してそこまで大きな懸念ではなくなっています。", "summary_en": "A business consultant argues that US small and medium-sized businesses are largely unconcerned about Trump's recent tariffs because the rates are lower than previous attempts, refunds from earlier tariffs are being processed, and companies have learned the court system can overturn tariff actions. Small businesses have also become more innovative at adapting to tariffs through alternative suppliers, domestic manufacturing, and operational adjustments, making tariffs a lesser concern compared to other rising costs since Covid.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/business/2026/aug/02/us-small-businesses-trump-tariffs", "state_media": false, "category": "オピニオン", "full_text": "Rebounding from his defeat at the supreme court in February, Donald Trump has recently announced a new round of tariffs, invoking sections of various trade acts to levy amounts on industries and countries based on reasons ranging from “forced labor” to “excess capacity”.\nAnd how are small and medium-sized businesses in the US reacting? One word: snoozefest.\nFor context, my firm has hundreds of clients who are small and medium-sized. I’m also a professional speaker and present to literally thousands of business owners across many industries at associations and conference events. Last year I was frequently asked to discuss tariffs to these groups. This year that topic is not even on the agenda. People don’t care. Why?\nFor starters, the new tariffs announced aren’t as big as before.\nRemember “liberation day”, when tariff rates ranging anywhere from 10% to 50% were being ultimately assessed? Remember how products coming from China were subject to rates as high as 145% at one point. As recently as February, tariff rates on Indian goods were as much as 50%.\nThose numbers were significant and had an impact on many of my clients. But the new rates are much lower, generally ranging from 10% to 12.5% (although higher rates are being assessed on certain products and countries). Already the administration is carving out exemptions. It’s not nothing. But they’re way below previous attempts and more manageable.\nAnd refunds from the last tariff attempt are helping. As I write this, approximately $122bn in refunds have been accepted and are due to be paid. I was skeptical that this was ever going to happen, but it’s happening. The process is bureaucratic and doesn’t include all the tariffs paid (yet), but a number of my clients have seen money returned to them through their original customs brokers.\nNow their biggest problem is making sure they’ve estimated enough taxes to be paid on this unexpected windfall. The experience not only has helped many companies’ bank accounts, but also gives them confidence that there is a process for overturning these actions.\nWhich brings me to the next reason why tariffs aren’t as big a deal this time: lawsuits. They’re inevitable. In fact, a few small businesses already filed suits contesting the president’s latest round of levies. We’ve learned that the court system works. The appeals process is reliable. The supreme court actually cares about the law. And – despite the protests and marches – our “king” actually behaves more like a president and complies with the courts when he loses a case there.\nGiven the way the administration has handled so many other big challenges (Hello, Iran? Immigration enforcement?) I – and a number of my clients – have confidence that the plaintiffs’ attorneys will find many holes in how these new tariffs were implemented and the likelihood of repeal is pretty strong.\nOne thing that can’t be denied about American entrepreneurs: they’re innovative. I’ve seen this in practice over the past two years as a number of them dodged, danced and navigated their way around the many tariff bombs hurled their way. They moved products to bonded warehouses. They leveraged their data and got better at targeting their pricing. They pivoted to technology for cost savings elsewhere in their business. They scrambled to find alternative suppliers and to do more domestic assembly and manufacturing. New tariffs will simply be another incentive to exercise these options and explore others, and businesses are less fearful of the impact than they were in the past.\nMost of the businesses I know, regardless of industry, have seen their production, delivery and operating costs increase anywhere from 20% to 40% since Covid. It’s been a massive change. Energy prices are contributing to this. Inflation caused by government spending is another. Supply chain issues aren’t helping. But the fact is that tariffs are just a small part of that. When small businesses are asked if tariffs are hurting their margins they’re likely to say yes. But not as much as some other factors, which mutes their overall impact.\nBack when he first took office it seemed like the president was announcing new tariffs, changing his mind, increasing them, decreasing them, removing them – it all got a bit much.\nYes, more tariffs will be announced. But there’s a process required by the trade acts he’s invoking to get these tariffs approved. That provides time to figure out a response. Things are still relatively uncertain because … well, Trump. But the uncertainty caused by his behavior has muted a bit. That’s good news for any business owner making their plans.\nWhen the president announced his initial round of tariffs, the media was wringing its hands over the countless small businesses that would be affected. I remember the bike shop owner who bought all of his supplies from India, the wine merchant who specialized in French products and the woman who ran a specialty shoe site online using shoes from China. Yeah, they wer", "translation_ja": "", "vocab": [{"word": "snoozefest", "definition": "つまらない、退屈な出来事や状況を指す俗語。ビジネス関係者が関税問題にもはや関心を示していないことを強調するために使用されています。"}, {"word": "levy", "definition": "税金や料金などを課す、または徴収することを意味する動詞。ここでは政府が産業や国に対して関税を課すことを指しています。"}, {"word": "carving out exemptions", "definition": "除外や免除を作り出すことを意味する表現。政府が特定の製品や企業を関税から除外する措置を取ることを指しています。"}, {"word": "windfall", "definition": "予期せぬ利益や幸運な収入を意味する名詞。ここでは払い戻された関税金が企業にもたらす予期しない利益を指しています。"}, {"word": "plaintiffs", "definition": "訴訟を起こしている側の人々またはグループを意味する法律用語。ここでは関税措置に異議を唱えて訴訟を提起した企業を指しています。"}, {"word": "mutes", "definition": "影響や効果を和らげる、または減らすことを意味する動詞。ここでは他の要因が関税の相対的な影響を軽減していることを指しています。"}, {"word": "invoke", "definition": "法律や規則を引き合いに出して適用することを意味する動詞。ここでは政府が関税を正当化するために法律条項を適用することを指しています。"}]}, {"title_ja": "イランにおける曖昧性の悪循環：混合メッセージがいかに紛争を悪化させるか", "title_en": "The Ambiguity Spiral in Iran: How Mixed U.S. Messaging Worsens Conflict", "summary_ja": "著者は、イラン紛争に関する米国の目標についてのトランプ政権の曖昧で矛盾したメッセージが逆効果となり、イランの大規模な軍事エスカレーションを招き、平和交渉を損なわせたと主張しています。曖昧性が紛争を緩和することもありますが、体制転換目標とホルムズ海峡の地位に関する不明確な信号は、危険な誤解を生み出し、さらなる紛争のリスクを高めています。", "summary_en": "The author argues that the Trump administration's vague and inconsistent messaging regarding U.S. objectives in the Iran conflict has backfired, causing Iran to escalate dramatically and undermining peace negotiations. While ambiguity can sometimes help de-escalate wars, unclear signals about regime change goals and the Strait of Hormuz status have created dangerous misunderstandings that risk further conflict.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/ambiguity-spiral-iran", "state_media": false, "category": "オピニオン", "full_text": "Ambiguity—vague language, mixed messaging, frequent policy shifts—has been a hallmark of the United States’ approach to the war in Iran. From almost the moment the conflict began, U.S. President Donald Trump has vacillated over its purpose, what risks he might be willing to take, and what the United States would consider victory. He has threatened to destroy Iranian civilization, then promptly signed a cease-fire agreement. He has floated the possibility of taking Kharg Island, the hub of Iran’s oil industry, only to quickly walk it back. And he has discussed imposing a 20 percent toll on shipping through the Strait of Hormuz, only to declare that the waterway must be free to everyone.\nIn some cases, ambiguity can help countries settle wars. Leaders, for example, can leverage uncertainty to de-escalate a conflict or reach a stable peace agreement by letting both sides claim victory. If governments avoid drawing clear redlines, they can avoid pressure to escalate in response to attacks, creating space to cool tensions.\nBut Washington’s mixed messaging about the war in Iran has done more harm than good. Trump’s spectrum of threats, for example, prompted Tehran to see the war in existential terms and maximally fight back. The lack of clarity over the status of the Strait of Hormuz made the June memorandum of understanding negotiated by the two countries impossibly frail. To reach a more durable truce, the Trump administration needs to be clearer about its goals and more consistent in pursuing them. Otherwise, Iran and the United States will continue to get their wires crossed—and the next cease-fire could again collapse.\nCAN’T GET A READ\nWhen coercing a rival, a government must decide how to convey intent, capabilities, and redlines. One option is to be clear: explicitly and consistently defining a goal, identifying consequences for noncompliance, and articulating what the other side can count on if demands are met. Such clarity can let a rival state know what is at stake and encourage it to limit its response. But too much of it can do the opposite. If the rival knows just how far it can go toward a threshold without triggering retaliation, it will often escalate all the way to that point.\nThe other option is to be vague. Yet this can also have mixed consequences. If a state does not know how its adversary will respond to a certain action, it might hold back for fear of triggering painful counterattacks. But too many mixed signals can throw off an opponent’s risk calculus, giving rise to misunderstandings that can produce or worsen a crisis.\nThis is what happened with the United States’ Operation Epic Fury—its military operation against Iran. Trump has variously said, at different times, that the goal of the campaign is to degrade Iran’s missile capabilities and navy, prevent the country from obtaining nuclear weapons, and end Iran’s support of its regional proxy network. On the first day of the conflict, he even suggested he wanted to dismantle the Islamic Republic. (On February 28, Trump encouraged Iranians to “take over” their government, and Israeli Prime Minister Benjamin Netanyahu, who has carried out military strikes alongside Trump, echoed that sentiment.) Other Trump administration officials, meanwhile, avoided explicit mention of a political transformation for Iran, focusing on narrower military objectives.\nFor Iran, this mixed messaging was the opposite of reassuring. Uncertain of U.S. intentions, its officials assumed the worst—particularly given that airstrikes killed Supreme Leader Ali Khamenei in the conflict’s opening hours. The country thus escalated massively, unleashing thousands of missiles and drones at infrastructure and U.S. military bases across the Middle East. If the United States had been clear from the outset that it was not gunning for regime change, Iran might have responded with more restraint and the conflict might have stayed more limited, as it had after U.S.-Israeli airstrikes on Iran in June 2025.\nAmbiguity has not only ramped up the conflict. It has also undermined efforts at ending it. The June memorandum of understanding was meant to pause fighting, open the Strait of Hormuz, and start a 60-day period for further negotiations. But it failed, in part because of its unclear wording. The memorandum obliged Iran to “make arrangements using its best efforts for the safe passage of commercial vessels.” The Americans interpreted this clause to mean that Iran would let all traffic through, as it did before the war. The Iranians, on the other hand, took it as a confirmation that they had authority over the waterway and only needed to open parts of it. (Iran wants shipping to pass through the part of the strait closest to its territory). At the end of June, Iran began shooting at commercial vessels for taking what it deemed to be unauthorized routes through the channel. As these attacks unfolded, Iran’s deputy foreign minister took to social media to announce that safe passage was", "translation_ja": "", "vocab": [{"word": "vacillate", "definition": "立場や方針の間を揺れ動く、一貫性を欠く。政治指導者が異なる立場を繰り返し変更する場合によく使われる。"}, {"word": "redline", "definition": "譲歩できない限界線や条件。交渉で相手に対して明確に引かれる「これ以上は許容できない」という境界線を指す。"}, {"word": "durable", "definition": "長く続く、耐久力のある。協定や平和合意が長期間効果を持続させることを意味する。"}, {"word": "coerce", "definition": "強制力や脅迫を用いて相手に行動させる。国家間の外交で圧力をかけることを示す。"}, {"word": "escalate", "definition": "段階的に激しくなる、エスカレートする。紛争や危機が次第に深刻化する過程を表す。"}, {"word": "risk calculus", "definition": "リスク計算。相手国が自らの行動がもたらす結果や報復の可能性をどう評価するかの判断方法。"}, {"word": "restraint", "definition": "自制、抑制。国家が可能な行動を控え目に行う姿勢や政策判断を指す。"}]}, {"title_ja": "弱体化したロシアがなぜ戦い続けるのか", "title_en": "Why a Weaker Russia Keeps Fighting", "summary_ja": "ロシアの軍事的・経済的悪化にもかかわらず、プーチンは3つの戦略計画がすべて失敗したため、ウクライナとの戦争を続けている。ロシアは増加する死傷者、経済的負担、領土獲得の停滞に直面しているが、長期戦を継続するための十分な能力を保持しており、プーチンはモスクワの有力者からの交渉要求に応じる兆候を示していない。", "summary_en": "Despite Russia's military and economic deterioration, Putin continues the war in Ukraine as all three of his strategic plans have failed. Although Russia faces mounting casualties, economic strain, and stalled territorial gains, it retains sufficient capacity to sustain prolonged conflict, and Putin shows no signs of seeking negotiation despite calls from Moscow elites.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/why-weaker-russia-keeps-fighting", "state_media": false, "category": "オピニオン", "full_text": "At the end of June, Russian President Vladimir Putin gave an interview in which he declared, once again, that Russia would win its war against Ukraine. The Russian army, he said, was advancing along the roughly 800-mile frontline and occupying more Ukrainian land every day. Kyiv, by contrast, was flailing. He acknowledged that the Ukrainian drone strikes torching Russian oil refineries and other critical infrastructure deep behind the frontlines were “creating problems.” But Russians would adapt and persevere. “These terrorist attacks have no impact whatsoever on the situation,” he said.\nIf this were 20 months ago, Putin’s confidence would have been warranted. At the time, recently elected U.S. President Donald Trump was praising Moscow and criticizing Kyiv. Russian troops were making slow but steady gains on the battlefield. Putin could thus follow three strategies, as we argued in a March 2025 Foreign Affairs essay. Under Plan A, the Kremlin would work with the White House to make Kyiv accept a deal written in Moscow. Under Plan B, Putin would simply hold out until Trump pulled U.S. support for Ukraine, allowing Russian troops to roll to victory. Failing that, Putin could pivot to Plan C: continuing to fight and ultimately prevailing on the battlefield.\nToday, however, Russia’s position has deteriorated. Plan A—winning over Trump—failed; Putin didn’t even mention the U.S. president in his recent interview. Plan B also went awry. Although the White House stopped providing Ukraine with many types of assistance, the United States has continued to supply vital intelligence to Kyiv and enforce sanctions against Russia. Meanwhile, Kyiv has been able to turn to its European backers to make up for the lost aid. In fact, Ukraine is now better positioned militarily than it was last year. Russia, by contrast, is losing more soldiers than it can recruit and stalling out on the battlefield. Its economy is facing increasing trouble. Thus, Plan C, in which Russia would win by outlasting Ukraine, is also not working.\nBut that does not mean Putin will change course. Russia’s problems are real, but the country is nonetheless capable of sustaining the conflict. Its economy remains functional enough, and it has the manpower and weaponry needed to keep battling. Moscow is also devising new ways to regain the initiative. The Kremlin’s insistence on continuing to fight will make life worse for Russians, and so there are elites in Moscow calling for a negotiated resolution. But there is no indication that Putin is listening. The war, then, is almost certain to drag on.\nGREAT EXPECTATIONS\nWhen Trump took office in 2025, the Kremlin believed it could achieve a diplomatic coup. During the 2024 campaign, Trump had pledged to end the war in Ukraine “within 24 hours.” Upon taking office, he moved to pressure Ukraine’s leaders to accede to some of Russia’s demands. In February 2025, he insisted that Ukrainian President Volodymyr Zelensky agree to an immediate cease-fire with Russia and insinuated that Kyiv was responsible for the war. When Zelensky refused, Trump temporarily suspended intelligence sharing and military aid to Ukraine. Vice President JD Vance delivered a speech at the 2025 Munich Security Conference in which he declared that the United States was pulling back from Europe. And in August 2025, Trump and Putin held an amiable summit in Alaska. Afterward, the U.S. president said, again, that Zelensky was the reason the conflict wasn’t finished.\nThe trajectory of the Russian economy and the dynamics of the battlefield further boosted Putin’s confidence. In 2024, Russia’s GDP grew by 4.3 percent, fueled by military production and domestic consumption. Inflation was high but manageable. The Russian armed forces were recruiting more men than they were losing, whereas the Ukrainian army was losing more soldiers than it was gaining. The creeping occupation of the Donbas was costing Russia tens of thousands of troops, but these losses were tolerated as the country continued to advance. In 2024, Putin captured around 1,600 square miles of Ukrainian territory. Russia was producing nearly as many drones as Ukraine and using them in increasingly creative ways. It was producing far more traditional weapons, such as artillery shells and missiles, than was Ukraine or its Western partners. From the Kremlin’s viewpoint, a Russian victory was inevitable.\nBut not for the first time, Putin’s complacency led to overconfidence. He continued to push for conditions that Trump either could not accept or could not deliver—including that Kyiv surrender parts of the Donbas it still controlled and sign away much of its sovereignty. Trump’s two main envoys to Moscow, his friend Steve Witkoff and his son-in-law Jared Kushner, were amateurs in international diplomacy and proved unable to start a proper negotiating process. In Moscow, attitudes toward both men soured. Plan A failed.\nFor a time, Putin could still hope that Plan B, in which Trump would simpl", "translation_ja": "", "vocab": [{"word": "complacency", "definition": "自分の現状に満足して警戒心を失うこと。ここではプーチンが戦況を過度に楽観視していた状態を指す。"}, {"word": "deteriorate", "definition": "状況や条件が悪化すること。ロシアの軍事的・経済的状況が次第に悪くなっていく過程を表す。"}, {"word": "leverage", "definition": "影響力や圧力を行使して有利な立場を得ること。交渉で相手に優位に立つための手段を意味する。"}, {"word": "trajectory", "definition": "進行や発展の方向性や傾向。ここでは戦況や経済状況の推移を指す。"}, {"word": "pivot", "definition": "別の方針や戦略へと方向転換すること。ロシアが異なる作戦計画に切り替えることを意味する。"}, {"word": "diplomatic coup", "definition": "外交交渉による大きな成功や勝利。予想外の有利な条約や合意を達成すること。"}]}, {"title_ja": "中国の新民族統一法：少数民族自治の終焉を示唆", "title_en": "China's New Ethnic Unity Law Signals End of Minority Autonomy", "summary_ja": "中国が新たに制定した「民族団結と進歩法」は、少数民族の自治の約束から強制的な文化同化へと明確にシフトしたことを示している。この法律は、少数民族言語教育を北京官話に置き換え、宗教に対する国家統制を強化し、少数民族の歴史を統一された中国文明の一部として再構築する、習近平指導下での10年以上の政策を法典化している。政府のあらゆる層に組み込まれたこの法律は、平和的共存の道を事実上閉ざし、少数民族グループとの関係を協調から対立的なゼロサムゲームへと転換させた。", "summary_en": "China's newly enacted Law on Promoting Ethnic Unity and Progress marks a decisive shift from the constitutional promise of minority autonomy toward forced cultural assimilation under Xi Jinping's leadership. The law codifies over a decade of policies replacing minority-language education with Mandarin, increasing state control over religion, and reframing minority histories as part of one unified Chinese civilization. This legislation, now embedded in bureaucratic structures across all levels of government, effectively closes the door on peaceful coexistence and locks China into a zero-sum relationship with its minority groups.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/next-phase-chinas-minority-crackdown", "state_media": false, "category": "オピニオン", "full_text": "When the People’s Republic of China was founded, in 1949, it was explicitly a multinational state. Although Han Chinese make up more than 90 percent of the country’s population, China’s constitution and subsequent laws grant minority nationalities autonomy in specific regions and promise them collective agency as “masters of their own homes.” For decades, the party-state’s official bargain—honored unevenly and often violated—was that national unity would be best secured by recognizing difference and granting minorities limited territorial, linguistic, and political autonomy within China, rather than by forcing them to be absorbed into Han culture.\nAs of July 1, however, national integration through forced cultural assimilation is the law of the land. The constitution still defines the country as a multinational state, but the passage of the Law on Promoting Ethnic Unity and Progress marks a decisive turn away from the promise of territorial autonomy. It codifies the coercive project to create a Chinese national community in which minority peoples can exist only insofar as they serve Chinese leader Xi Jinping’s vision of China—a vision rooted in the belief that commonality is better than diversity and that national cohesion requires a single shared Chinese cultural and linguistic identity.\nThe new ethnic unity law did not introduce the policy of assimilation; for more than a decade, Xi has been replacing minority-language education with Mandarin Chinese instruction, increasing the party’s control over religion, and recasting minority histories as strands of one continuous Chinese civilization. But this approach is now consolidated in national legislation enacted by the full National People’s Congress, signaling that Beijing regards it as a matter of fundamental state importance and enshrining it with the highest legal authority. And the law distributes responsibility for implementing these policies across all levels of the state and throughout society.\nBeijing’s campaign of cultural dispossession will now become more deeply embedded in bureaucratic practices and institutional structures, which are difficult to dislodge or change. Even if a more liberal leader were to one day succeed Xi, reviving autonomy would require a complete bureaucratic, political, and cultural overhaul. For the foreseeable future, therefore, Beijing has closed the door on peaceful coexistence, locking itself instead into a more hostile and zero-sum relationship with the minority groups whose cultures and languages it once accommodated.\nASSIMILATION NATION\nChina’s official policy, inspired by the Soviet model of national-territorial autonomy, recognizes 56 formally equal nationalities within the country. Its constitution promises to protect the rights and interests of all minority nationalities and grants them territorial autonomy in areas where they live in concentrated communities. A 1984 law formalized the protections and accommodations granted to minority groups as part of this territorial autonomy. In areas as varied as Xinjiang in the far northwest and Yunnan in the country’s southwest, minority groups were entitled to use their own languages as the medium of instruction in schools and maintain their own traditions, cultures, and religious practices. Even when these protections were violated, the law maintained the principle of collective rights for China’s non-Han nationalities.\nBut Xi began systematically dismantling the foundations of this system soon after he became general secretary of the Chinese Communist Party in 2012. His move to dismantle territorial autonomy is often explained as a response to episodes of unrest that broke out in minority regions shortly before he took power. In 2008, protests that began in Lhasa, the capital of Tibet, escalated into a full-blown uprising across the plateau. And in 2009, a Uyghur protest in Urumqi, in Xinjiang, descended into rioting and retaliatory violence that killed nearly 200 people, according to official figures.\nThe roots of Xi’s campaign, however, go back much further. The collapse of the Soviet Union in the 1990s prompted some leading Chinese scholars and officials to reconsider granting territorial autonomy to minority nationalities. Starting around the first decade of the twenty-first century, advocates of a so-called second-generation ethnic policy argued that China’s Soviet-inspired approach had hardened ethnic boundaries and created the conditions for separatism. They warned that minority groups’ distinct identities, institutions, and languages were impeding China’s attempt to construct a cohesive nation. Although the situation in Beijing is fundamentally different than it was in Moscow—China’s autonomous regions are much more tightly controlled by the central government and possess neither sovereignty nor a legal route to independence, as federal republics in the Soviet Union did—these powerful voices warned that even limited autonomy was dangerous. China’s existing polic", "translation_ja": "", "vocab": [{"word": "assimilation", "definition": "少数民族が多数派の文化や言語を採用し、元の文化的アイデンティティを失う過程。異なる民族や文化グループを支配的な文化に同化させることを指す。"}, {"word": "territorial autonomy", "definition": "特定の地域に住む少数民族が、その地域内で一定程度の自治権を持つこと。言語教育や文化・宗教慣行について独立した決定権を有することを意味する。"}, {"word": "codify", "definition": "慣習や政策などを体系的に法律として成文化すること。それまで慣行や規制としてあった内容を、公式な法令として確立することを指す。"}, {"word": "coercive", "definition": "強制力や強圧を使用して人を従わせることに関連する。同意なしに人々に特定の行動や信念を採用させることを指す。"}, {"word": "dispossession", "definition": "人々から財産、権利、文化的遺産などを強制的に奪い取ること。少数民族から言語や伝統的慣行を奪う行為を指す。"}, {"word": "enshrine", "definition": "重要な原則や権利を法律や制度の中で正式に保護・確立すること。価値あるものを制度的に永続させることを意味する。"}]}];
