mbers have been killed after two helicopters collided mid-air in Greece while battling wildfires.\nThe fatalities were a Danish pilot and a Greek fire service liaison officer. A British pilot and another Greek co-ordinator on the second helicopter survived.\nVideo of the incident some 65 km (42 miles) west of the capital Athens shows one of the two Bell helicopters hitting the propellers of the other, which bursts into flames and crashes in a ravine. The other aircraft made an emergency landing.\nWildfires have broken out in Greece this week, prompting mass evacuations. Other European states have also suffered devastating blazes during prolonged heatwaves.\nAccording to the Greek Fire Service, the two leased Bell helicopters collided on Sunday while taking part in efforts to tackle a large wildfire burning on the Attica-Boeotia border.\nThe crew members of one aircraft were rescued alive, while the second crew were recovered unconscious and later pronounced dead.\nGreek Prime Minister Kyriakos Mitsotakis expressed his \"deepest sorrow\" over the accident.\nIn a post on X, he said the loss of the Greek coordinator and Danish pilot \"fills us all with grief\". He also sent condolences to their families.\nAccording to protocol, all Bell helicopters across the country have been grounded, a source from the civil protection ministry told the BBC.\nThe source added that the second Bell helicopter involved in the collision made an emergency landing in an area of low vegetation.\n\"The two people on board, a British pilot and a Greek fire service liaison officer - escaped with minor injuries,\" the source said.\n\"Both remained conscious and have been admitted to hospital, where they will remain under observation for 24 hours as a precaution.\"\nThe source also told the BBC the British survivor was a private pilot hired for the wildfire season.\nHe was not part of any exchange between the UK and Greece, and there was no request for assistance from Athens.\nMeanwhile, Greece' ump's cabinet meeting on Friday, sources told CBS News, the BBC's news partner in the US.\nThe US government had also urged Americans across the Middle East to be alert and ready to leave \"should there be escalation\" in the region.\nIn his post on Saturday, Trump said the US was \"locked and loaded and ready to go against the Islamic Republic of Iran, at levels of Military Terror, Strength, and Power not seen since World War II\".\nHe said cancelling the attack would be \"for the future benefit of the world and, likewise, the survival of a successful and prosperous Iran\".\nBack on 7 April, the US president warned that \"a whole civilisation will die tonight\" if Iran refused to engage in peace talks. He threatened to destroy civilian infrastructure and power plants, a move that many said would be a war crime.\nThat threat did result in historic face-to-face talks in Pakistan, led by Vice-President JD Vance.\nFor supporters of the president, it was vindication. Bellicose threats - often referred to as the \"Madman Theory\" - resulted in talks with the Iranians.\nThe issue with that view, however, is that those talks ended without a deal. There were simply too many competing red lines that could not be reconciled, even with the threat of civilisation erasure.\nDuring the Friday meeting, CBS News reported Trump was heard saying while reporters were still in the room: \"We'll be hitting them [Iranians] very hard. At some point, they're going to say, 'We just can't take it anymore.'\"\nA day later, Saudi Crown Prince Mohammed Bin Salman had a call with Trump, aimed at reducing regional tensions, the kingdom's official SPA press agency reported.\n\"His Royal Highness emphasised the necessity of prioritising dialogue to reduce tensions and the importance of exerting all possible efforts to achieve a truce that paves the way for diplomatic solutions.\"\nThe US's Gulf allies hold concerns that, while the American mainland is out of reach of Iranian missiles, countries like Bahrain, Jordan and the United Arab Emirates are not - with their critical infrastructure such as water desalination plans being prime targets.\nWashington and Tehran have engaged in escalating strikes and counter-strikes since a ceasefire in April aimed at pausing the war fell apart in June.\nThe US has blockaded Iranian ports and bombed Iranian sites, while Iran has fired missiles and drones at US assets in countries across the Middle East and targeted shipping in the Strait of Hormuz, a vital waterway for global oil shipping.\nThere have been significant fluctuations in oil prices since then.\nIt is not only international pressure that the US president faces. According to the Pew research centre, around 60% of Americans disapprove of the war with Iran, contributing to Trump's falling popularity.\nAny escalation would almost certainly result in an increase in oil prices, further squeezing US consumers.\nWith crucial US midterm elections looming, the president will know his international decisions could have serious domestic consequences for his administration.\nRelated topics\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "perimeters", "definition": "ここでは交渉の「枠組み」や「条件」を意味します。deal perimetersは合意の基本的な輪郭や条件が決まったことを表す表現です。"}, {"word": "apocalyptic", "definition": "極度に悲観的で壊滅的な、終末的な警告や予測を指します。ここではトランプが発した極めて深刻な脅迫警告を形容しています。"}, {"word": "bellicose", "definition": "好戦的で、戦闘的な態度や言動を表します。政治指導者の攻撃的な言辞や威嚇的な姿勢を指すのに使われます。"}, {"word": "Madman Theory", "definition": "相手に予測不可能で危険な人物だと思い込ませることで交渉を有利に進める政治戦略です。Nixon政権で使用された概念です。"}, {"word": "reconciled", "definition": "相反する立場や主張を調和させる、または相容れない事柄を一致させることを意味します。ここでは対立する立場が解決されなかったことを示しています。"}, {"word": "blockaded", "definition": "軍事的に港湾や地域を包囲し、物資や人の出入りを遮断することです。経済的・軍事的な圧力手段として使われます。"}, {"word": "desalination", "definition": "塩水から塩分を取り除いて真水を製造するプロセスです。特に中東の水不足地域で重要なインフラストラクチャーです。"}]}, {"title_ja": "ハマス武装解除合意後のイスラエルによるガザ攻撃で少なくとも13人が殺害", "title_en": "At least 13 killed in Israeli strikes on Gaza after Hamas agree disarmament deal", "summary_ja": "ハマスが武装解除計画を受け入れた後、イスラエルの軍事攻撃によってガザで少なくとも13人（子どもを含む）が殺害されました。この攻撃は連続2夜目の空爆であり、ハマスがトランプ大統領の平和委員会に武器を引き渡すことに同意した直後に発生しました。イスラエル当局者は、ハマスの武装解除への意思を疑っており、エネルギー大臣はガザの完全なイスラエル支配が必要である可能性を示唆しています。", "summary_en": "At least 13 people, including children, were killed in Israeli military strikes on Gaza City, Khan Younis, and Deir el-Balah following Hamas's acceptance of a disarmament plan. The attacks mark the second consecutive night of strikes and occur despite Hamas agreeing to hand over weapons to Trump's Board of Peace. Israeli officials remain skeptical about Hamas's willingness to disarm, with Energy Minister Eli Cohen suggesting full Israeli control of Gaza may be necessary.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/czjlvvkzj20o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "At least 13 killed in Israeli strikes on Gaza after Hamas agree disarmament deal\n- Published\nAt least 13 people, including several children, have been killed in the latest strikes on Gaza, Palestinian officials have said.\nGaza's Civil Defence Authority said Israeli military aircraft carried out the attacks on Gaza City, Khan Younis and Deir el-Balah.\nIt was the second successive night of Israeli strikes on the territory, and it comes days after Hamas accepted a disarmament plan, which would see the Palestinian group hand over its weapons to US President Donald Trump's Board of Peace.\nA spokesperson for the Israel Defense Forces (IDF), said it was targeting military operatives in Gaza, and two Hamas militants were killed.\nThe Israeli Energy Minister, Eli Cohen, said on Sunday that no deal had been reached to stop attacks on the Gaza Strip, a territory now under 70% Israeli control.\nCohen added that he saw a need for the strip to be placed under the full control of Israel if Hamas did not disarm - despite the Board of Peace plan for Israel to pull out of the territory - the Reuters news agency reported.\nIn a post on X on Sunday, the IDF said it had killed two Hamas commanders, one from the elite Nukbha force, and one from the Maghazi Battalion.\nThe IDF also said killed another Hamas militant from the Jabalia Battalion in northern Gaza in a separate attack last week. It said all three were planning to attack Israeli targets.\nPalestinian health officials said two people, including a child, were killed in a strike on a residential building in Gaza City, while another person was killed near Jabalia in northern Gaza.\nA father, mother and their nine-year-old son were killed after a strike on a house in Khan Younis, and a man and woman died after their apartment block was struck in Deir el-Balah.\nMore than 1,100 Palestinians have been killed since a supposed ceasefire came into effect last October.\nLast week, President Trump said the Board of Peace had reached an agreement for the \"complete disarmament\" of Hamas and other armed groups in Gaza.\nOn Friday Trump insisted that Israel was \"very happy\" with the proposed agreement, describing it as a \"big step for the Middle East\".\nBut Israel remains deeply sceptical about Hamas' willingness to give up its weapons or its control in Gaza. Far-right Israeli National Security Minister Itamar Ben Gvir dismissed the draft as \"not acceptable\".\nIt is part of the second phase of a US-brokered Gaza ceasefire plan that aims to end the war in Gaza.\nThe 20-point plan, unveiled in September last year, included the creation of the Board of Peace to oversee the agreement's implementation, as well as the disarmament of Hamas, withdrawal of Israeli troops and reconstruction of Gaza.\nA 15-point road map was also published on Friday, which sets out the final steps for implementing the agreement.\n- What's in the Gaza peace deal roadmap? \n  - Published2 days ago\nThe roadmap, which has not yet been implemented, states: \"A process shall begin to inventory and store heavy weapons, military production sites, weapons depots, and tunnels\".\nIt says this is conditional on Israel meeting its commitments under the initial ceasefire agreement.\nHow the weapons would be handed over to the Board of Peace is not yet clear, although it is believed that all heavy weapons and other military hardware would be moved into storage and managed by the Palestinian National Committee - a group of independent technocrats to which Hamas has agreed to hand over power.\nThe committee has so far been working from Cairo and has not entered Gaza.\nIsrael has destroyed more than 1,500 buildings in areas of Gaza that have remained under its control since the ceasefire, satellite images seen by BBC Verify last November showed. The actual number is likely much higher, with imagery unavailable for some areas.\nAccording to UN estimates, around 60 million tonnes of debris has been generated since October 2023.\nHamas - proscribed by the UK government as a terror organisation - has governed the Gaza Strip since 2007.\nRelated topics\n  - Published17 January", "translation_ja": "", "vocab": [{"word": "disarmament", "definition": "武装を放棄すること、または兵器を廃棄するプロセスのこと。国家や組織が保有する軍事兵器を削減または廃止する行為を指します。"}, {"word": "proscribed", "definition": "法律または公式な命令によって禁止されること、または違法と宣言されること。テロ組織などが政府によって公式に禁止されることを表します。"}, {"word": "sceptical", "definition": "何かが真実または成功する可能性について疑いを持つこと。確信が持てず、疑わしいと感じる態度を示します。"}, {"word": "brokered", "definition": "仲介者として交渉や取引を成立させること。政治的・経済的な合意を実現するために、第三者が仲介役を務めることを表します。"}, {"word": "technocrats", "definition": "技術的専門知識に基づいて政策や決定を行う専門家や管理者のこと。科学者や技術者など、専門的知識を持つ人物を指します。"}, {"word": "inventory", "definition": "保有している品物や資産の詳細なリストまたは目録。ここでは武器や軍事装備の詳細な記録を意味します。"}]}, {"title_ja": "バーナム首相、小型ボート横断の抑制に「徹底的に」取り組むと誓約", "title_en": "Burnham Pledges 'Relentless' Effort to Curb Small Boat Crossings", "summary_ja": "アンディ・バーナム首相は、国家犯罪局の職員を800人近くまで倍増させ、不正な小型ボート横断に対処することを約束した。政府は人身売買組織を解体する一方で、移民のための安全な合法ルートの確立を目指している。最近の統計によると、小型ボート横断件数は前年同期比で43%減少している。", "summary_en": "Prime Minister Andy Burnham has committed to tackling illegal small boat crossings with increased enforcement, doubling National Crime Agency officers to nearly 800. The government aims to dismantle people-smuggling gangs while establishing safe legal routes for migrants. Recent figures show small boat crossings are down 43% compared to the same period last year.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3r0v952ny3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham pledges to be 'relentless' in curbing small boat crossings\n- Published\nAndy Burnham has pledged his government will be \"relentless\" in curbing the number of people arriving in the UK on small boats.\nThe prime minister said progress had been made and the government was \"changing the whole approach\", with enforcement officers tackling people-smuggling gangs doubled on both sides of the Channel.\n\"People want to see this issue addressed,\" he said in Dover, adding: \"We also need to build a system that offers safe routes for people as well, because that also takes away the selling point of the gangs.\"\nThe Conservatives said that Labour had not delivered on its promises on migration, while Reform UK said it would deploy the Royal Navy to ward off small boat crossing.\nPolitical discussions around the UK's policies on illegal migration have resurfaced since tens of thousands of migrants swam into the Spanish exclave of Ceuta on Thursday.\nBurnham noted that 98% of the people who swam to the African territory had been returned to Morocco - which he said had dealt with the immediate issue.\nBut he added: \"There's a broader issue about the Schengen area and our relationship with it, and of course, I would want to be in regular dialogue with the EU on those issues.\"\nHis comments came shortly after the Home Office announced that the number of National Crime Agency (NCA) officers tackling smuggling gangs facilitating small boat crossings had risen to almost 800 from 376 at the start of 2025.\nBurnham said there had been a similar doubling of French officers.\nAsked whether he wanted to change the tone of the debate around small boats, he said that he wanted to \"deal with the issue rather than play politics with the issue\".\nHe added: \"The public don't like the idea that the border looks like it's not controlled. We need to bring back that control. But also we need to offer support for people who genuinely need it.\"\nThe Home Office also said on Sunday that there had been nearly 300 arrests of smuggling gang members last year, as well as the seizure of more than 1,100 small boats and engines.\nIt said that, if the equipment seized by the NCA had been used, it could have helped 72,000 more people come illegally to the UK. The BBC has been unable to independently verify this claim.\n\"Clearly, progress is being made, but we're not complacent,\" Burnham commented.\nReform UK shadow home secretary Zia Yusuf said his party would order the Navy to force small boats carrying migrants back to France, saying it would be \"the largest military operation in the English Channel since World War Two\".\nInternational conventions on the sea allow for states to pick people up from boats if they are in danger of being lost but do not allow for them to be taken to another country without that nation's consent.\nA Labour Party spokesperson said Reform's plans were a \"desperate bid\" to distract from scrutiny of their party's finances.\nMeanwhile, shadow home secretary Chris Philp said Labour had not \"smashed the gangs as they promised over two years ago\", adding that the Tories would leave the European Convention on Human Rights (ECHR) so illegal migrants could be deported within a week of arrival.\n\"If Andy Burnham was serious he would do this - but he's too weak,\" he said.\nThe Liberal Democrats' immigration and asylum spokesman Will Forster said the government should \"redouble its efforts to rebuild our broken relationship with Europe\" and \"continue to cut down on the asylum backlog\".\nThe number of migrants who have arrived in the UK on small boats since Burnham became PM a fortnight ago surpassed 2,000 after 326 people crossed the English Channel on Saturday.\nMore people attempt the potentially perilous crossing in the summer when conditions are better, and Home Office figures show small boat crossings so far this year are down around 43% compared to the same period in 2025.\nSmall boat crossings have become the most common way for people to be detected entering the UK illegally since 2020, and the issue has become a lightning rod in the wider debate over immigration.\nThe number of small boats crossing the Channel have been on a downward trend since it peaked in 2022, Home Office figures show.\nIn May, the Office for National Statistics (ONS) revealed that net migration to the UK fell to 171,000 last year - almost half the number seen in 2024 when Labour assumed power, and the lowest level since 2012.\nThe drop has been attributed to fewer people arriving from outside the EU for work and study.\n  - Published23 April\n  - Published24 July", "translation_ja": "", "vocab": [{"word": "relentless", "definition": "休みなく、絶え間なく続く、という意味。ビジネスやニュースでは決意や努力が継続的であることを強調する際に使用される。"}, {"word": "facilitate", "definition": "～を助長する、容易にする、という意味。犯罪やプロセスがより簡単になるようにすることを指す。"}, {"word": "exclave", "definition": "飛び地、本国と分離された領土を指す地政学用語。スペイン領北アフリカ地域などを説明する際に使用される。"}, {"word": "complacent", "definition": "自己満足した、現状に満足している、という意味。問題解決において警戒を怠ることを警告する文脈で用いられる。"}, {"word": "perilous", "definition": "危険な、危ひんな、という意味。小型ボート横断のような生命の危険がある状況を描写する際に使用される。"}, {"word": "lightning rod", "definition": "避雷針、転じて議論や批判の的となる人や事柄。政治的に物議をかもす話題を指す比喩表現。"}]}, {"title_ja": "ギリシャ警察：スコットランド人女性の遺体をスーツケースで運んだことを認めた男", "title_en": "Man Admits Transporting Scottish Woman's Body in Suitcase, Greek Police Say", "summary_ja": "ギリシャ警察によると、26歳の男がスコットランド人女性エリザベス・ジェーン・ロスの遺体をスーツケースに入れてアテネの放置されたビルに運んだことを自白した。38歳のロスは行方不明の報告後、7月18日にキプセリ地区で発見された。容疑者は過失致死傷、強盗、武器所持違反の容疑で逮捕されている。", "summary_en": "Greek police say a 26-year-old man has confessed to transporting the body of Scottish woman Elisabeth-Jane Ross in a suitcase to an abandoned building in Athens. Ross, 38, was reported missing and found in the Kypseli district on July 18. The suspect has been arrested on suspicion of manslaughter, robbery, and weapons offences.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c89ndd4g0gjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Man admits transporting Scottish woman's body in suitcase, Greek police say\n- Published\nGreek police say a man has admitted transporting the body of a Scottish woman in a suitcase to an abandoned building.\nElisabeth-Jane Ross, 38, was found in the Kypseli district of Athens on 18 July, days after she was reported missing.\nLocal officers launched an investigation with cooperation from authorities in the US, the UK and Scotland, and now say they have arrested a 26-year-old man - the BBC understands he is from Afghanistan.\nThe force said he was brought to police headquarters on Thursday where he \"confessed to his actions\". He was arrested on suspicion of manslaughter, robbery and weapons offences, but the exact charges have yet to be finalised under the Greek legal system.\nPolice said Ross, known to her family as Lisa, arrived in Greece on 26 June and stayed in the Piraeus area until 10 July, when she left for an unknown destination in Attica.\nAfter carrying out investigations and analysing video footage, police said they identified a 26-year-old man was connected to the case.\nThey claim he transported Lisa's body to the abandoned site in a suitcase and subsequently used her bank cards to withdraw money.\nDuring searches carried out at his home, police said a replica pistol and a knife were found and seized.\nLisa had initially stayed in the area of Keratsini, 5.9 miles (9.5km) west of central Athens, with Greek friends.\nShe had told them that on 15 July she would go to Kypseli, where her \"American friends\" or acquaintances were.\nOn Saturday Greek police said they were fast-tracking toxicology reports in order to ascertain the cause of her death, potentially \"in the coming days\".\nTest results can take anywhere from several weeks to a few months depending on the complexity of the case and the workload of forensic laboratories.\nThey were also looking to trace Lisa's American friends, who they said were also staying in Kypseli.\nFirst Minister John Swinney called it an \"absolutely appalling case\".\nA Scottish government spokesperson said: \"This is an extremely distressing time for the family of Elisabeth-Jane Ross and it is important that their privacy is respected while enquiries continue.\n\"Scottish government officials are in communication with the family and with the Foreign, Commonwealth and Development Office to ensure they receive appropriate support.\n\"As this remains an operational matter for Police Scotland, it would not be appropriate to comment further.\"\nThis article originally stated that Greek police had said the suspect had admitted killing Elisabeth-Jane Ross. This was changed after further information emerged.", "translation_ja": "", "vocab": [{"word": "confessed", "definition": "犯罪や過ちを認めて白状すること。法的文脈では、被疑者が警察や裁判所に対して違法行為を認めることを意味する。"}, {"word": "manslaughter", "definition": "人を殺害したが、故意ではなく過失または情状酌量の余地がある場合の罪。殺人より軽い犯罪とされる。"}, {"word": "toxicology", "definition": "毒物や薬物が身体に及ぼす影響を研究する学問。医学捜査では死因を特定するために行われる。"}, {"word": "ascertain", "definition": "調査や確認を通じて事実や真実を明確に確認すること。確実な情報を得るために努力することを意味する。"}, {"word": "replica", "definition": "本物そっくりに作られた複製品や模造品。銃の場合、実際には発砲できない見た目だけそっくりなもの。"}, {"word": "fast-tracking", "definition": "通常のプロセスをスキップして優先的に処理を進めること。緊急時に手続きを加速化することを指す。"}]}, {"title_ja": "干ばつの長期化により食糧不足の可能性、イギリスの農民が警告", "title_en": "Prolonged drought could cause food shortage, UK farmers warn", "summary_ja": "イギリス農民組合は、イングランドとウェールズ全域の干ばつが継続すれば、特定の食品の不足につながる可能性があると警告しています。小麦とオーツ麦の収穫量が激減し、家畜農家は冬飼料を使い果たしています。高温と水不足があらゆる農業部門に影響を与えており、野菜生産者は水利用可能性の制限で特に打撃を受けています。", "summary_en": "The National Farmers' Union has warned that continued drought conditions across England and Wales could lead to shortages of certain food products, as wheat and oat yields plummet and livestock farmers deplete winter feed reserves. High temperatures and water scarcity are affecting all farming sectors, with vegetable producers struggling particularly due to limited water availability. The NFU president has called on the government to invest in water infrastructure and offer tax incentives for farmers to build storage systems.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq89e771jqlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Prolonged drought could cause shortage of some foods, farmers' union head says\n- Published\nThere could be a shortage of certain food products if the current drought conditions continue, the National Farmers' Union (NFU) has warned.\nNFU president Tom Bradshaw said yields of wheat and oats were \"very, very poor\" this year and warned livestock farmers have had to use their winter feed rations because they have been unable to grow grass.\nDrought has been declared across large parts of England and the whole of Wales as successive heatwaves left water supplies under strain, with more than 20 million people now under hosepipe bans.\nAmber heat health alerts have also been issued for large parts of England, including the Midlands, the south-east and south-west of England, until Wednesday.\n- How are hosepipe bans enforced? \n  - Published22 July 2025\n- Satellite images show impact of heatwaves and drought on UK landscape \n  - Published2 days ago\n- How cow showers and fans help farmers keep cattle cool \n  - Published4 days ago\nBradshaw told the BBC that high temperatures and drought conditions had placed all areas of farming under increasing pressure.\nVegetable producers, he said, are running low on water, reducing the amount of food produced in the UK and increasing the cost it takes to grow it.\n\"We have to recognise that water security is a critical part of our food security and food security is our national security,\" Bradshaw said.\nHe called on the government to invest more heavily in reservoirs, saying too much water that could be collected during winter was instead being pumped out into the North Sea.\n\"We can't change what's happening at the moment, there is no water in our rivers, but we must use this to take action for the future,\" he said.\nBradshaw also suggested farmers should be given tax breaks to build water storage systems on their land to prepare for the years ahead.\n\"We have taken our food supply for granted for far too long,\" he added.\n\"Those other countries around the world that we currently rely on to produce our food and vegetables, their climates are changing as well.\n\"It does feel like there is going be some shortages of [food] products\", Bradshaw told Radio 4's Broadcasting House.\nIn a message to Prime Minister Andy Burnham, he said: \"Let's draw a line in the sand and make sure we prioritise domestic food production to deliver growth across the UK.\"\nAfter a wet and mild start to the year, it has been exceptionally dry hot and dry with a succession of heatwaves across the UK.\nThe combination of low rainfall and prolonged heat has quickly depleted water reserves in soils, vegetation and rivers.\nWhile droughts can occur naturally, climate change is making weather patterns more erratic, and heatwaves more frequent and intense.\nScientists say there is a greater risk of droughts happening as a result, and of them being more severe and longer-lasting when they do.\nThe Met Office reports that England saw just 5.6mm of rainfall up to 30 July – just 8% of its long-term meteorological average for the month and less than half of the previous record of 13.4mm set in 1911.\nFor Wales it was 7.9mm of rainfall, also 8% of its long-term average for the month and almost a third of the previous record of 22.6mm, again set in 1911.\nHeat health alerts are in place across most of England until at least 09:00 BST on Wednesday.\nAmber alerts indicate a rise in deaths of vulnerable people and increased demand on health services are likely, while yellow alerts indicate these are possible.\nRelated topics\n  - Published3 days ago\n  - Published5 November 2025\n  - Published4 days ago", "translation_ja": "", "vocab": [{"word": "depleted", "definition": "減少させた、枯渇させた。リソースや資源が使い尽くされた状態を表します。"}, {"word": "erratic", "definition": "不規則な、予測不可能な。気象パターンなどが一貫性を欠き、変動が大きい状態を意味します。"}, {"word": "infrastructure", "definition": "基盤施設、インフラストラクチャー。ダムや貯水池など、社会の基本となる施設や構造を指します。"}, {"word": "incentives", "definition": "奨励金、インセンティブ。特定の行動を促すために提供される報酬や利益のことです。"}, {"word": "vulnerability", "definition": "脆弱性、傷つきやすさ。環境的変化や困難に対する弱さや抵抗力の欠如を表します。"}, {"word": "heatwaves", "definition": "熱波。通常より著しく高い気温が続く期間を指し、健康や農業に悪影響を与えます。"}]}, {"title_ja": "パキスタン：反過激派デモで自爆テロ犯が14人を殺害", "title_en": "Suicide Bomber Kills 14 at Anti-Militancy Protest in Pakistan", "summary_ja": "パキスタン北西部スワト渓谷のカバル市で、反過激派集会を狙った自爆テロ犯が14人を殺害し、数十人が負傷した。被害者には警察官5人が含まれており、デモは政府の対過激派対策の失敗に抗議するため警察署外で開催されていた。責任を主張する団体はまだなく、パキスタンではタリバン系勢力による攻撃が急増している。", "summary_en": "A suicide bomber attacked an anti-militancy rally in Kabal, Pakistan's Swat Valley, killing 14 people including five police officers and injuring dozens more. The attack targeted demonstrators protesting militant violence and government inaction, occurring outside a local police station. No group has claimed responsibility, though Pakistan has experienced a surge in attacks by the Pakistani Taliban and allied militant groups.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/pakistan-suicide-bomber-kills-14-at-anti-militancy-protest/a-78209642?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Pakistan: Suicide bomber kills 14 at anti-militancy protest\nAugust 2, 2026\nA suicide bomber killed 14 people and injured dozens more in an attack targeting anti-militancy demonstrators in the city of Kabal in Pakistan's northwestern Swat Valley.\nFive police officers were among those killed at the event, which was staged outside a local police station to protest growing militant violence in the region and the state's inability to protect citizens.\nThose gathered accused authorities of failing to act decisively against militants, saying residents want to live without fear after years of devastating violence.\nThe area was the home of Nobel laureate Malala Yousafzai, who was shot there by a Taliban gunman in 2012.\nHundreds of people were at the rally and social media video footage showed a speaker mid-sentence when an explosion rocked the area and sparked panic among demonstrators.\n\"The suicide bomber blew himself up when asked for a search in front of the police station,\" a local police official said.\nNo group has claimed responsibility for the crime.\nA former Taliban stronghold\nPresident Asif Ali Zardari and Prime Minister Shehbaz Sharif both condemned the attack.\n\"Terrorists,\" said Zardari, \"will never succeed in their nefarious efforts to harm peace, national unity and the writ of the state.\"\nPakistan has experienced a surge in militant attacks of late, with many targeting police and security forces.\nThe Swat Valley was a Taliban stronghold between 2007 and 2009, when Pakistan's military drove the Islamists out and re-established government control over the area.\nThe religious militants have recently resurfaced, however, with the Pakistani Taliban, known as Tehrik-e-Taliban Pakistan, or TTP, being particularly active.\nThe TTP is separate from, but allied with, Afghanistan's Taliban rulers and has been a source of tension between the neighboring countries.\nPakistan says the TTP and other militant groups are carrying out attacks in the country with the support of Afghanistan's Taliban rulers and has promised to continue targeting the TTP and its support network.\nEdited by: Jenipher Camino Gonzalez\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "nefarious", "definition": "邪悪で有害な目的や行為を表す形容詞。悪意を持った不正な活動に対して使用される。"}, {"word": "stronghold", "definition": "特定の勢力が強い影響力を持つ地域や場所。組織が支配権を確立している拠点を意味する。"}, {"word": "resurfaced", "definition": "一度消えたものが再び現れることを表す動詞。過去に存在した事象や勢力が再び浮上する状況で使用される。"}, {"word": "militants", "definition": "暴力的な手段で政治目標を達成しようとする活動家。武装した過激派勢力を指す。"}, {"word": "writ of the state", "definition": "政府の法的権限と統治力。国家が領域内で法律を執行する権力を表す表現。"}]}, {"title_ja": "ウクライナがドローンでロシア深部を攻撃、8人が死亡", "title_en": "Ukraine Strikes Deep Into Russia With Drones, Killing Eight", "summary_ja": "ウクライナのドローンが日曜日にロシア全土の軍事・エネルギー・民間インフラを攻撃し、少なくとも8人が死亡し、石油精製所と軍事基地が損傷を受けました。ロシアは夜間の攻撃で635機のドローンを撃墜したと主張しています。ウクライナはまた、ロシアの経済に圧力をかけ、戦争をロシア国民に実感させるため、ワイルドベリーズの物流倉庫を標的にしました。", "summary_en": "Ukrainian drones attacked military, energy, and civilian infrastructure sites across Russia on Sunday, killing at least eight people and damaging an oil refinery and military base. Russia claimed to have shot down 635 drones during the overnight attacks. Ukraine also targeted Wildberries logistics warehouses as part of efforts to pressure Russia's economy and bring the war home to Russian citizens.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-hits-targets-deep-inside-russia-killing-eight/a-78208850?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Ukraine hits targets deep inside Russia, killing eight\nAugust 2, 2026\nUkrainian drones rained down on numerous military, energy and civilian infrastructure sites deep inside Russia on Sunday, killing at least eight people overnight.\nRussia's Defense Ministry said its forces downed 635 drones over the course of the attacks.\nTwo people were killed in the city of Engels on the Volga River when drones hit residential buildings. Another apartment complex in nearby Saratov City was also damaged.\nThree people were reported killed and two injured in the Udmurtia region (1,300 kilometers from Ukraine), and another three killed and five injured in Belgorod according to local officials.\nUkrainian President Volodymyr Zelenskyy on Sunday said Kyiv had targeted an oil refinery in Saratov and a military base that is home to Russian long-range bombers in Engels.\nZelenskyy said the attacks were his country's answer to Russian aggression and thanked Ukrainian forces for taking the war \"back to where it came from.\"\nKyiv said fires had damaged both sites and that its forces had also struck an oil depot in the western Kaluga region.\nUnverified video uploaded to social media sites purported to show fires burning at the Saratov oil facility.\nWhy is Ukraine targeting Wildberries warehouses?\nUkraine again targeted the online retailer Wildberries in its attacks, striking a logistics warehouse in Samara — more than 800 kilometers (500 miles) from Ukraine's front-line positions.\nSunday's attacks on Wildberries were just the latest onslaught on the retail giant, which Kyiv says aids Russia's military.\nKyiv has attacked nearly a dozen Wildberries warehouses since July 18.\nNo casualties were reported at the facility and local management said that a fire at the site had been brought under control.\nAlthough the number of drones that Russia claims to have downed cannot be confirmed, the figure is indicative of the scale of Kyiv's effort to strike Russia deep inside its own territory as it defends itself against an army that launched a full-scale invasion on February 24, 2022.\nThe Wildberries attacks are seen as an attempt to bring President Vladimir Putin's war home to Russia's citizens, applying pressure to the country's already anaemic economy in hopes of finally ending Moscow's ongoing invasion.\nEdited by: Jenipher Camino Gonzalez\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "onslaught", "definition": "激しい、容赦ない攻撃や襲撃。大量の物事が一度に押し寄せることを意味します。"}, {"word": "anaemic", "definition": "活力や力に欠ける状態。経済の場合は、成長が弱く活気がない状態を示します。"}, {"word": "logistics", "definition": "物資や人員の輸送・配送を計画・実行する業務。ここでは物流施設を指します。"}, {"word": "indicative", "definition": "何かを示唆する、または表す性質がある。～の指標となる、～を示唆する意味です。"}, {"word": "refinery", "definition": "原油から石油製品を製造する産業施設。石油や鉱物を精製する工場を指します。"}]}, {"title_ja": "セウタ：国境突破した移民の大多数が去ったとスペイン当局が発表", "title_en": "Ceuta: Most migrants who breached border have left, Spain says", "summary_ja": "スペイン北アフリカの飛び地セウタに押し入った5～6万人の移民のほとんどがモロッコに戻ったとスペイン当局が報告し、国境突破時の死者数は72人に上ることが確認されました。この事件はスペイン政治の波紋を呼んでおり、右派指導者らが社会主義政権の移民政策を批判する一方、モロッコはソーシャルメディアの誤報と人身売買ネットワークが急増の原因だと主張しています。", "summary_en": "Spain reports that most of the 50,000-60,000 migrants who crossed into the North African exclave of Ceuta have returned to Morocco, with authorities confirming 72 deaths during the border rush. The incident has sparked political controversy, with right-wing leaders criticizing the Socialist government's migration policies, while Morocco blamed social media misinformation and human trafficking networks for the surge.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ceuta-most-who-breached-border-have-left-spain-says/live-78191601?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ceuta: Most who breached border have left, Spain says\nPublished July 31, 2026last updated August 2, 2026\nWhat you need to know\n- Ceuta returning to normal but work remains, local official says\n- Madrid says 72 people died in the border rush\n- Right-wing leaders call for migrant expulsions, security reinforcement\n- Italy's one-month suspension of the free-movement Schengen deal takes effect\n- Spain's PM Sanchez calls for an urgent teleconference of EU interior ministers\n- DW correspondent says thousands of migrants still in Ceuta\n- Germany's Merz calls on Morocco to take back the irregular migrants 'without delay'\nFollow this blog for continuing coverage and updates on the developing situation in Ceuta, Spain's North African territory.\nTired of missing our real-time updates? Click here to add us as a Preferred Source on Google. Then tap the \"Star\" or \"Preferred\" to keep DW News at the top of your feed.\nMorocco blames social media misinformation, people smugglers for border chaos\nThe recent border surge in Ceuta was fueled by misinformation spread on social media, human trafficking groups, and a Spanish court ruling banning immediate returns of migrants intercepted at sea, the Moroccan Interior Ministry said Sunday.\nThe statement was the first from the Moroccan government since the mass border breach on Thursday and Friday, which Spain says saw between 50,000 and 60,000 migrants enter Ceuta.\nMorocco said around 40,000 people were involved in the mass crossing at Ceuta, while 1,135 were stopped while trying to enter Melilla, Spain's other North African exclave.\nThe ministry also said 11 people had died. Ten of them died by drowning while attempting to cross the border, the ministry said, with one person dying after falling from a rocky area.\nThe ministry added that Moroccan officials were checking reports from their Spanish counterparts that 72 people died.\nFar-right politicians call for migrant expulsions, security reinforcement\nThe border crisis in Ceuta has sparked debates in Spain and across Europe about the Spanish government's migration policy.\nMany governments in Europe have sought to curb immigration, but Spain has pursued a different approach, recently announcing a plan to provide legal status to up to 500,000 undocumented migrants.\nPedro Sanchez and his Socialist government have been heavily criticized this week by politicians from Spain's right and far-right parties.\nThe leader of the opposition, the conservative People's Party's Alberto Nunez Feijoo, has traveled to the exclave, where he slammed Sanchez for failing to prevent the border rush.\nThe leader of the far-right Vox party, Santiago Abascal, who was also in Ceuta on Sunday, blamed the Socialist government for the migrant surge, which he described as \"an invasion.\"\nHe said the surge was an \"act of war\" and an \"attack on the sovereignty and security of Spaniards.\"\nAbascal also said Sanchez was \"a danger\" to the country, and called for the EU-Morocco agreement, which functions as a partial free trade area, to be scrapped.\nFar-right influencer and Member of the European Parliament Alvise Perez called for migrants to be expelled during a confrontation with a crowd of rival protesters in Ceuta. Much of the city's population is of Moroccan descent.\nPerez had to shelter in a bar before being escorted away by police.\nSanchez and his government have also been criticized by other right-wing politicians in Europe, most notably Italy's Interior Minister Antonio Tajani.\nItaly has suspended free movement with Spain, even though both are part of the Schengen Area.\nMost migrants return but Ceuta still on edge as death toll climbs to 72\nRelative calm had returned to Ceuta on Sunday, but the city remained on edge following the deadly border rush.\nLocal officials have warned that the city's recovery has just begun, while right-wing politicians are blaming the Socialist government in Madrid for chaotic scenes that unfolded this week in the Spanish North African exclave.\nSpanish Civil Guard ships were searching the waters around the city on Sunday for more bodies after between 50,000 and 60,000 migrants breached the border with Morocco.\nNearly all of them had walked back to the Moroccan side of the border by Sunday, according to officials in Ceuta, normally home to around 84,000 people.\nAt least 72 people died during the crush on Thursday and Friday, the Spanish government representative in Ceuta, Miguel Angel Perez, said.\nSome drowned, while others were killed in a stampede at a breakwater barrier and a border fence.\nPerez added that medical services have treated more than 1,000 people.\nHe said while the situation in the exclave had improved significantly, work remained to be done for the city to return to normal.\nOn Saturday, authorities installed a 500-meter (1,600-foot) floating barrier in the waters off Ceuta to boost border security, as well as reinforcing police and army patrols.\nWATCH: Spain installs floating barrier to stop Ceuta sea crossings\nWhat to kn", "translation_ja": "", "vocab": [{"word": "exclave", "definition": "本国から離れた領土で、他国に取り囲まれている地域のこと。セウタはスペイン領だがモロッコに囲まれているため、飛び地と呼ばれます。"}, {"word": "breach", "definition": "壁や境界線などの防御を破って侵入することを意味する動詞。ここでは多数の移民が国境を突破したことを表しています。"}, {"word": "surge", "definition": "急速で大規模な増加または上昇のこと。ここでは移民の大量流入を指しています。"}, {"word": "misinformation", "definition": "意図的または無意識的に広められた誤った情報のこと。ソーシャルメディアを通じて拡散されることが多い。"}, {"word": "sovereignty", "definition": "国家の独立した統治権や自決権のこと。政治的な独立性と自国の決定権を意味する重要な概念です。"}, {"word": "stampede", "definition": "危機や恐怖によって引き起こされる、大勢の人や動物の無秩序な集団パニック逃走のこと。"}]}, {"title_ja": "モレノ上院議員、虐待疑惑でミラー下院議員の辞職を要求", "title_en": "Sen. Moreno calls for Rep. Miller's resignation over abuse allegations", "summary_ja": "バーニー・モレノ上院議員は、ミラー下院議員がミラーの元妻（モレノの娘）による虐待疑惑を受けて下院議員を務めるべきではないと述べた。この発言は深刻な非行疑惑をめぐる家族間の重大な対立を示している。ミラーはまだ辞職要求に応じていない。", "summary_en": "Sen. Bernie Moreno has stated that Rep. Max Miller should not serve in the House following abuse allegations made by Miller's ex-wife, who is Moreno's daughter. The senator's comments represent a significant family conflict over the serious misconduct claims. Miller has not yet responded to the renewed calls for his resignation.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/sen-moreno-calls-rep-max-miller-resign-allegedly/story?id=135307603", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース放送", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースと生中継イベントを24時間体制でカバーしています。信頼できるABCニュースの記者やアンカーからのリアルタイム更新で、最新情報をお届けします。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. Stay informed with real-time updates on developing stories from trusted ABC News correspondents and anchors.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アイダホ州のイン・アンド・アウトでの銃撃事件、3人死亡7人負傷を確認", "title_en": "Police Confirm 3 Killed, 7 Injured in Idaho In-N-Out Shooting", "summary_ja": "警察は土曜日夜、アイダホ州のイン・アンド・アウト・バーガー付近で銃撃事件に対応しました。この事件により3人が殺害され、7人が負傷しました。当局は銃撃事件の調査を継続しています。", "summary_en": "Police responded to an active shooter situation at an In-N-Out Burger location in Idaho on Saturday evening. Three victims were killed and seven others were injured in the incident. Authorities are continuing their investigation into the shooting.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/police-respond-active-shooter-idaho-burger/story?id=135296367", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モロッコからの越境混乱後、セウタで足止めされた移民たち", "title_en": "Moroccan Migrants Stranded in Ceuta After Border Crossing Chaos", "summary_ja": "当局が予期せず国境管理を解除した後、約5万人がモロッコからスペイン領セウタに越境し、少なくとも72人の死者が出た。ほとんどはモロッコに戻ったが、数百人はセウタに取り残され、スペイン本土への明確な道がない状態が続いている。この事件は人身売買ネットワークか、アルジェリアに関するスペインの政策についてのモロッコの外交的シグナルと考えられている。", "summary_en": "Approximately 50,000 people crossed from Morocco into the Spanish enclave of Ceuta this week after authorities unexpectedly opened border controls, resulting in at least 72 deaths. While most have since returned to Morocco, hundreds remain stranded in Ceuta with no clear path to mainland Spain, caught between hope and despair. The incident is attributed to either human-trafficking networks or a diplomatic signal from Morocco regarding Spain's relationship with Algeria.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/02/ceuta-border-crossing-spain-morocco", "state_media": false, "category": "社会", "full_text": "Four days ago, Youssef El Abbas saw an opportunity to reclaim the life he had lost seven years earlier. News was circulating that about 400 people had swum from Morocco to the neighbouring Spanish enclave of Ceuta on the north African coast, approximately 12 miles (19km) across the strait of Gibraltar from mainland Spain.\nHere was a chance for the 44-year-old Moroccan father of four to return to Spain, from which he had been deported when his residency expired after the loss of his job in Bilbao in 2019.\nEl Abbas took a taxi and headed to the city of Tétouan, south of the enclave. While en route, he saw Facebook posts and news reports claiming that the Moroccan authorities were allowing people to pass through their side of the border. That meant that unlike those who had crossed the previous night, he could simply travel overland before swimming for just five minutes across the border from Moroccan to Spanish territory to avoid the Spanish border controls.\nHe reached Tétouan to find the city completely overwhelmed. “Young men were running through the streets, flooding every corner,” he said. By the time a second taxi took El Abbas to Fnideq, the town bordering Ceuta, he realised that the usual blockades and checkpoints preventing people without European documents from even approaching the frontier had been removed.\n“The Moroccan police were shouting at us: ‘Go, go, go! Run now, run into Spain,’” he said. “The night before, they were beating people. But that morning they were letting us through. Nothing made sense.”\nDespite the crowds, El Abbas noticed the police were only letting Moroccans cross over. “All the sub-Saharan migrants were being pushed back by force.”\nHe reached the border at 2.45pm on Wednesday. By 3pm, after a short swim, he was standing on Spanish soil. Not everyone was so lucky.\n“In just 10 minutes in the water, I saw four people floating dead in Moroccan waters,” he said. “People were pulling their bodies out.” They were among at least 72 people who drowned or were crushed trying to reach the Spanish territory.\nEl Abbas is just one of the 50,000 or so people to have crossed into Ceuta this week, in what Spain’s prime minister, Pedro Sánchez, described as “a violation of Spain’s territorial integrity”.\nMadrid has attributed the latest influx to “human-trafficking mafias” that have taken advantage of a decision by Spain’s supreme court, which recently ruled that those intercepted at sea while trying to enter Ceuta or Melilla – the other Spanish enclave on the north African coast – could not be summarily returned under special rules.\nBut there has also been speculation that the Moroccan authorities may have opened the border to signal their displeasure at Sánchez’s recent visit to Algeria, which supports efforts to free the disputed territory of Western Sahara from Moroccan occupation.\nMorocco’s ambassador to Spain, Karima Benyaich Millán, said Rabat was not happy about the mass crossing, adding that it hoped those in Ceuta would return.\nMoroccan government sources told the Europa Press news agency that the surge of people entering Ceuta was down to “criminal organisations” and insisted that Rabat’s cooperation with Spain remained “exemplary”.\nIn May 2021, Rabat loosened border controls – allowing 10,000 people to cross into Ceuta over the course of two days – during a diplomatic standoff triggered after Madrid allowed a Western Sahara independence leader to be treated for Covid-19 in Spain.\nEl Abbas said he had never stopped dreaming of returning to Spain, where he had worked mainly in the hospitality sector for 14 years. Since being deported to Morocco in 2019, he has lived apart from his wife and four daughters, who remain in the northern Spanish city of Bilbao, while scraping by with occasional work repairing mobile phones alongside his father.\n“I never stopped thinking about coming back,” he said. “In Morocco, I was alive, but I wasn’t really living.”\nThe return has been bittersweet. When he swam ashore in Ceuta, a Spanish Guardia Civil officer extended a hand to pull him from the sea. But that gesture of aid eventually gave way to one of violence. Three days after arriving, the group of people he was with were surrounded by a military patrol and beaten.\n“The same hand that helped me out of the water was the one that later hit me,” he said.\nEl Abbas’s story is hardly unique. Although more than 48,000 people had crossed back into Morocco by Friday night, hundreds are still sleeping in parks, public squares and on pavements, waiting for a chance to move on or simply to find somewhere to rest. It appears to be virtually impossible for migrants to leave Ceuta for mainland Spain.\nSaid, 17, from Casablanca, was sitting on a kerb a few hundred metres away. He, too, had joined the Ceuta-bound crowds when he heard that the border was open. But the jubilation had given way to reality and all he had was a bottle of water and the carton of yoghurt a local resident had given him.\nThe teenager said he", "translation_ja": "", "vocab": [{"word": "territorial integrity", "definition": "国家が領土を完全にコントロールし、外部からの違法な侵害を受けない権利。スペイン首相がこの大規模越境を自国の領土的完全性を侵害する行為と述べた。"}, {"word": "enclave", "definition": "ある国の領土内に囲まれた別の国の領土。セウタはスペインの領土だが、モロッコ領内に位置している。"}, {"word": "diplomatic standoff", "definition": "国家間の対立で、どちらも譲歩せず、解決が困難な状況。スペインとモロッコの関係悪化を指す。"}, {"word": "summarily", "definition": "正式な手続きや詳しい検討なく、素早く行うこと。海上で拘束された者を判決なく直ちに送還することを指す。"}, {"word": "influx", "definition": "大量の人または物が短時間に流入すること。セウタへの人口流入の急増を指す。"}, {"word": "bittersweet", "definition": "喜びと悲しみが混在していること。スペインへの帰国が救助と暴力の両方を含んでいた状況を表す。"}]}, {"title_ja": "西アフリカ全域でLGBTQ+に対する法律が急増、政治的圧力の中で", "title_en": "Anti-LGBTQ+ Laws Surge Across West Africa Amid Political Pressures", "summary_ja": "セネガル、ニジェール、マリ、ガーナなど西アフリカ諸国が反LGBTQ+法を制定・強化しており、政治的便宜主義、宗教的影響、国際的な保守キャンペーンが推進力となっている。この法律はLGBTQ+コミュニティに逮捕、暴力、社会的迫害をもたらしている。国際的なキリスト教団体と会議がアフリカ大陸全体でこれらの取り組みを調整していると報告されている。", "summary_en": "West African countries including Senegal, Niger, Mali, and Ghana are implementing or strengthening anti-LGBTQ+ laws, driven by political opportunism, religious influence, and international conservative campaigns. The legislation has devastated LGBTQ+ communities through arrests, violence, and social persecution. International Christian groups and conferences are reportedly coordinating these efforts across the continent.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/02/anti-lgbtq-laws-are-on-the-rise-across-west-africa-campaigners-warn", "state_media": false, "category": "政治", "full_text": "A growing number of west African countries are implementing or strengthening anti-LGBTQ+ laws, amid local political pressures and a global pushback against LGBTQ+ rights.\nIn March, Senegal doubled the maximum prison sentence for gay sex to 10 years and criminalised the “promotion” of homosexuality. Niger criminalised “sexual relations with a person of the same sex” in February, the first time same-sex intimacy had been outlawed in the country.\nMali and Burkina Faso, which neighbours Niger, also criminalised same-sex relations for the first time in the last two years. All three are ruled by military juntas.\nIn June, Ghana, which already outlaws gay sex, passed a law criminalising LGBTQ+ “activities”. The bill, which hasn’t been signed into law by the president, is the latest iteration of a bill that was first introduced in 2021.\n“What I see in all of them is a political opportunism,” said Anthony Oluoch of Pan Africa ILGA, a continental LGBT+ rights campaign group.\nIn some countries, he said, the new or harsher laws had been backed by religious groups and campaigns for “family values”, while in Burkina Faso, whose population is predominantly Muslim, the law was framed as boosting its sovereignty in opposition to the west. “Underneath that all, there’s a lot of transnational reinforcement,” Oluoch added.\nLGBTQ+ people “are the easiest scapegoats to maintain their power”, said an activist in Burkina Faso, who could not be named for her security.\nThe impact on the community, even before the law was implemented, has been devastating, activists said. Thirteen transgender women were detained without trial from June to November last year, a HIV worker said, with the women reporting they had been beaten by a military unit that imprisoned them. After the law was passed, there have been at least two sets of convictions.\nPolice are entrapping LGBTQ+ people on social media and demanding they denounce other community members, said the HIV worker, who fled the country in May after he was named by someone who had been arrested.\nDespite military president Ibrahim Traoré’s anti-western rhetoric, Burkina Faso has also caught the eye of anti-LGBTQ+ campaigners that include conservative, western Christian groups.\nThe African Inter-Parliamentary Conference on Family Values and Sovereignty, a forum that many argue has influenced anti-LGBTQ+ laws on the continent, will be held in Burkina Faso and then Eswatini (formerly Swaziland) next year, it was announced this year.\nThe first three conferences were held annually in Uganda, in east Africa, beginning in 2023. Uganda imposed the death penalty for some same-sex sexual acts that year.\nAccording to US-based international reproductive rights organisation Ipas, the annual gatherings are supported by Family Watch International (FWI), an Arizona-based Christian campaign group that opposes abortion and comprehensive sex education (CSE). Also in attendance has been Dutch-founded lobby group Christian Council International, which promotes similar views.\nAt this year’s conference, hosted by Ghana’s parliament in June, the draft African Charter on Family Sovereignty and Values treaty was drawn up. It condemns abortion and CSE, states that gender is either male or female, and asserts that parental rights supersede children’s. A draft copy was published on FWI’s website.\nThe anti-LGBTQ+ bill passed by Ghana’s parliament is a “very effective political tool”, supported by powerful religious organisations in the country, said Amanda Odoi, a researcher at the University of Cape Coast.\nNonetheless, Odoi added: “These international actors were very key in empowering, supporting, funding, financing and giving voice to the anti-LGBT campaign.”\nShe noted the Ghana bill’s similarity to Uganda’s law, as well as its “alphabet soup” – the bill uses the acronym “LGBTTQAP+” – that includes words like “questioning” not commonly used in Ghana.\nBringing this year’s African parliamentary conference to Ghana was a deliberate decision due to the country’s influence on the continent, said Ebenezer Peegah, executive director of Rightify Ghana, an NGO that supports LGBTQ+ people.\n“Ghana has a lot of credentials that Uganda does not have … some clout that other countries in Africa do not have,” said Peegah, listing Ghana’s stable democracy, free and fair elections and relative press freedom.\nAcross west Africa, LGBTQ+ people are suffering the consequences of the new and harsher laws. In Senegal, the law is also hindering HIV prevention for men who have sex with men and transgender women, who have higher rates of HIV prevalence, as well as lawyers representing LGBTQ+ people, said Marame Kane, a French-Senegalese activist based in Paris.\nAbout 100 Senegalese people fled to the Gambia this year, although most had to return to Senegal as they had no money, according to a Gambian HIV worker.\nSame-sex relations are already punishable with up to life in prison in the Gambia, while transgender women are criminalised by a cross", "translation_ja": "", "vocab": [{"word": "opportunism", "definition": "自分の利益のために状況を巧みに利用する行為。政治的機会主義は、権力を維持するために特定の集団を標的にすることを指す。"}, {"word": "transnational", "definition": "複数の国々にまたがる、または国境を超えた性質を持つもの。異なる国間での組織的な支援や協力を示す。"}, {"word": "entrapping", "definition": "誰かを計画的に不利な立場に陥れること。特に執行機関が人々を違法行為に誘い込むことを意味する。"}, {"word": "scapegoat", "definition": "他者の失敗や問題の責任を一身に引き受けさせられる人物またはグループ。権力者が注意をそらすために利用される対象。"}, {"word": "sovereignty", "definition": "国家の自決権と独立性。他国の影響から自由に決定を下す権利として政治的に使用される。"}, {"word": "empowering", "definition": "他者に権力、能力、または自信を与えること。この文脈では、国際的な団体がキャンペーンを強化・支援することを意味する。"}, {"word": "prevalence", "definition": "特定の時期または場所における疾病や状態の広がりの程度。感染症が特定の集団にどの程度蔓延しているかを示す。"}]}, {"title_ja": "セウタ移民危機を巡りEUが緊急閣僚会議を開催へ、加盟国間の対立深刻化", "title_en": "EU to hold urgent meeting on Ceuta migration crisis as divisions deepen", "summary_ja": "EUは火曜日に内務大臣の緊急会議を開催する。スペイン領セウタに5万人以上の移民が到着し、越境試行時に少なくとも67人が死亡した事態を受けたもの。イタリアなど複数加盟国がスペインを批判し、未登録移民の身分正規化制度が人身売買を助長したと指摘。スペイン首相サンチェスは『フェイクニュース』に対抗し、EU内の連帯を呼びかけている。", "summary_en": "The EU will convene an emergency meeting of interior ministers on Tuesday to address the aftermath of over 50,000 migrants arriving in Spanish territory Ceuta, where at least 67 people died during crossing attempts. Spain has faced criticism from Italy and other EU members over the incident, with accusations that a regularization scheme for undocumented migrants incentivized human trafficking. Spanish Prime Minister Sánchez defended his government against 'fake news' and called for EU solidarity, while the bloc works to restore unified migration policy.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/01/spain-pedro-sanchez-calls-for-eu-meeting-ceuta-border-crossing", "state_media": false, "category": "政治", "full_text": "The EU is to hold an urgent meeting of interior ministers on Tuesday amid continued divisions in the bloc over the arrival of more than 50,000 migrants in the Spanish territory of Ceuta in north Africa.\nThe decision was taken by officials representing EU member states and Frontex border agency experts at what was described as a “sobering” meeting on Saturday.\nSpain confirmed at least 67 people had died in the attempted crossing. Some drowned, while others were crushed as they tried to cross a breakwater barrier.\nThe decision to call a summit of ministers was unanimous as EU leaders seek to heal divisions in the bloc and restore a unified approach to migration.\nSpain said migrant crossings into Ceuta had stopped overnight, as police began installing a 500-metre (1,640ft) floating barrier off its border with Morocco.\nAndy Burnham, the British prime minister, said on Saturday: “I have been in touch with the Spanish prime minister and [we are] providing what help we can.”\nItaly and Denmark, with some support from Poland and Sweden, used the meeting on Saturday to criticise Spain for what had happened.\nIn a furious letter on Saturday, Spain’s prime minister Pedro Sánchez hit out against “fake news” and “disinformation”, pointing out that “virtually all” migrants had been returned to Morocco after the army intervened on Friday, “preventing any unauthorised onward movement towards continental Europe”.\nIt is understood suspected Russian attempts to spread disinformation to sow dissent within the EU was also discussed at the meeting on Saturday.\nThere is frustration in Spain that previous incidents of this scale, such as mass arrival of migrants on the border of Belarus and Poland or Russia and Finland, were labelled as “hybrid attacks” , and met with solidarity from the rest of the EU.\nAlthough more than 48,000 people had voluntarily returned to Morocco by 6pm on Friday, the influx triggered a political crisis for the Madrid government and led some fellow EU countries to call for Spain to be suspended from the Schengen free-movement zone.\nJuan Jesús Vivas, the president of Ceuta, said that while many people had returned to Morocco, not all those who had crossed into the city had left.\n“We’re not back to normal because there are several thousand people who need to be returned, and there is still an atmosphere marked by unease and concern,” he said. He also called for “all the security measures deployed” in Ceuta to remain in place to guarantee the safety of the population.\nSánchez asked for the meeting after what appeared to be a breakdown of EU unity on external border policy, with Italy attacking Spain.\nItaly announced on Friday evening that it would suspend its Schengen arrangements with Spain for a month, even though Ceuta – and Spain’s other north African territory, Melilla – are subject to special Schengen rules that prevent onward movement within the zone.\nItaly’s foreign minister, Antonio Tajani, blamed the situation in Ceuta on the Sánchez government’s decision to offer a now-closed scheme to regularise the status of more than 1 million undocumented migrants and asylum seekers. He said the programme had incentivised human trafficking and was “profoundly wrong”.\nSánchez was forthright in a letter sent to the European Commission president, Ursula von der Leyen, the European Council president, António Costa, and Micheál Martin, the prime minister of Ireland, which holds the EU presidency.\nSánchez said that while most EU countries had expressed support and solidarity over events in Ceuta, others had chosen to attack Spain.\n“Such an attitude – driven by prejudice, fake news, ignorance or political interest – is … contrary to European law, humanitarian law and the principles of solidarity that bind us together,” he said.\nIn a pointed rebuke to Italy, he noted that Spain was “according to Frontex, one of the least porous external borders of the European Union, with a number of irregular entries that is half that recorded, for example, in Italy in recent years (2021–26)”.\nSenior EU officials met on Saturday in a “political crisis response team” convened by Ireland’s presidency.\nIreland’s prime minister, Micheál Martin, said on Saturday that, as the holders of the EU presidency, “Ireland will convene a meeting on Tuesday of the EU Justice and Home Affairs Council, chaired by Jim O’Callaghan [justice minister], to discuss developments in Ceuta.\n“We remain in close contact with all member states and the institutions and continue to monitor the situation,” he said in a social media post.\nO’Callaghan, who is leading the meetings on behalf of the EU, said he had been in touch with Spain’s interior minister, Fernando Grande-Marlaska, to express his solidarity and support.\nIn remarks that appeared to respond to Sánchez’s criticisms, von der Leyen said she welcomed his suggestion of a video conference “to take stock of what has happened”, adding: “Fighting illegal migration requires solidarity and a united European response", "translation_ja": "", "vocab": [{"word": "porous", "definition": "（国境などが）取り締まりが緩い、容易に通過できる状態。セキュリティの観点から、移民や不正な出入りに対する防御が弱いことを指す。"}, {"word": "disinformation", "definition": "意図的に広められた虚偽情報、偽情報。真実ではない情報を意図的に流布させて混乱や対立を生じさせる行為。"}, {"word": "hybrid attack", "definition": "複合型攻撃。軍事、経済、情報など複数の領域を組み合わせた国家による攻撃戦略。"}, {"word": "solidarity", "definition": "連帯、団結。共通の目的や価値観に基づいて、グループが一体となって支援・協力する姿勢。"}, {"word": "incentivise", "definition": "動機付けする、奨励する。ある行動を取るよう人々を促す誘因や刺激を与えること。"}, {"word": "humanitarian law", "definition": "人道法。紛争や災害時に人命保護を目的とする国際法。赤十字国際委員会などが関連する。"}]}, {"title_ja": "レバノンの宗教間協力によるキリスト教修道院の再建", "title_en": "Interfaith Volunteers Rebuild Christian Monastery in Lebanon", "summary_ja": "レバノンのザウタル・アル・ガルビーイェの主にシーア派イスラム教徒の村で、地元ボランティアがカトリック修道院の再建に向けた宗教間協力活動を開始しました。イスラエル軍の撤退後、住民は廃墟と化した故郷に戻ってきています。この協調的な再建努力は、宗教の枠を超えた地域社会の連帯を示しています。", "summary_en": "Local volunteers from a predominantly Shia Muslim village in Lebanon have launched an interfaith initiative to rebuild a Catholic monastery destroyed in Zawtar al-Gharbiyeh. Following the Israeli military withdrawal from this designated 'pilot zone,' residents are returning to find their homes and religious sites in ruins. The collaborative rebuilding effort demonstrates community solidarity across religious lines.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/2/local-volunteers-help-rebuild-destroyed-christian-monastery-in-lebanon?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Local volunteers help rebuild destroyed Christian monastery in Lebanon\nVolunteers have united in an interfaith effort to rebuild a Catholic monastery destroyed in Zawtar al-Gharbiyeh, one of Lebanon’s “pilot zones.” Following the withdrawal of Israeli forces, residents of the predominantly Shia Muslim village are returning home to rubble and ruins.\nPublished On 2 Aug 2026", "translation_ja": "", "vocab": [{"word": "interfaith", "definition": "異なる宗教の信仰者による、または異なる宗教間での協力や対話を指します。複数の宗教グループが共働する場面で用いられます。"}, {"word": "monastery", "definition": "修道士や修道女が共同生活を送る宗教施設のことです。通常、キリスト教や仏教などで見られる宗教的コミュニティの中心地となります。"}, {"word": "predominantly", "definition": "ある特性や属性が大多数を占める、または主要である状態を表します。統計的に最も多い比率や傾向を示す副詞です。"}, {"word": "pilot zone", "definition": "新しい政策や制度を試験的に実施する指定地域のことです。本格導入前に成果を検証する目的で設定されます。"}, {"word": "solidarity", "definition": "共通の目標や価値観に基づいた団結や相互支援の精神を指します。困難な状況下での共助意識を表します。"}]}, {"title_ja": "英国バーナム首相、イギリス海峡の移民渡航に「徹底的に」対処することを誓約", "title_en": "UK PM Burnham Vows 'Relentless' Approach to Channel Migrant Crossings", "summary_ja": "英国のアンディ・バーナム首相は、イギリス海峡での小型ボートによる不法渡航に対して、政府が徹底的に対処することを誓った。先週最高の1日当たりの到着数を記録しながらも、前年同期比で50％減少している。", "summary_en": "UK Prime Minister Andy Burnham pledged his government will take a relentless approach to tackling small boat crossings in the English Channel. Despite recording the highest daily arrival figure of 2026 last week, crossings have decreased by 50% compared to the same period last year.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/2/uk-pm-burnham-vows-to-be-relentless-on-channel-migrant-crossings?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "UK PM Burnham vows to be ‘relentless’ on Channel migrant crossings\nUK Prime Minister Andy Burnham said his government will be “relentless” in tackling small boat crossings across the English Channel, saying crossings are down by 50% compared with the same period last year despite Britain recording its highest daily arrival figure of 2026 last week.\nPublished On 2 Aug 2026", "translation_ja": "", "vocab": [{"word": "relentless", "definition": "容赦ない、絶え間ない。継続的で止まらない努力や行動を表す。ビジネスや政策など様々な文脈で使用される。"}, {"word": "small boat crossings", "definition": "小型ボートによる不法な国境越え。難民や移民が使用する違法な渡航方法を指す専門用語。"}, {"word": "tackling", "definition": "問題に対処する、取り組む。困難な課題や課題に直面して対応することを意味する。"}, {"word": "English Channel", "definition": "イギリスとフランスの間の海峡。地政学的に重要な水域であり、不法移民の経路として知られている。"}, {"word": "arrival figure", "definition": "到着数、到着件数。統計データとして使用され、移民や難民の入国数を数値化したもの。"}]}, {"title_ja": "ベネズエラとドミニカ共和国、外交関係の修復に合意", "title_en": "Venezuela and Dominican Republic Agree to Restore Diplomatic Ties", "summary_ja": "ベネズエラとドミニカ共和国は、2024年のマドゥーロ大統領の再選を詐欺的であると否定したドミニカ共和国との間で失われた外交関係を修復するためのロードマップに合意しました。この合意は両国間の継続的な対話に続くもので、関係の段階的な正常化を目指しています。デルシー・ロドリゲス暫定大統領率いるベネズエラの暫定政府は、米国の地域的利益とのより広い再編成の一環として、かつての疎遠なパートナーとの関係を新たに模索しています。", "summary_en": "Venezuela and the Dominican Republic have agreed to a roadmap for restoring diplomatic relations that were severed after the Dominican Republic rejected Maduro's 2024 re-election as fraudulent. The agreement follows sustained dialogue between both nations and aims for gradual normalization of ties. Venezuela's interim government under Delcy Rodriguez is pursuing renewed engagement with formerly estranged partners as part of a broader realignment with US interests.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/2/venezuela-and-the-dominican-republic-say-they-will-work-to-restore-ties?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Venezuela and the Dominican Republic say they will work to restore ties\nTwo countries have agreed to roadmap towards the full restoration of diplomatic ties, cut off after contested 2024 vote.\nVenezuela and the Dominican Republic have agreed to work towards restoring relations, which were severed after the Dominican Republic criticised the re-election of former Venezuelan President Nicolas Maduro as fraudulent.\nThe two countries agreed on a roadmap for further talks on “gradual normalisation” of diplomatic ties, according to a statement from Venezuela’s foreign ministry on Sunday.\n“This decision responds to the shared interest of strengthening institutional channels of communication to benefit people of both countries,” the ministry said, calling the agreement the result of “sustained dialogue” between both nations.\nThe Dominican Republic joined dozens of other countries in announcing that they would not recognise Maduro’s 2024 re-election amid widespread allegations of fraud from election observers and Venezuela’s political opposition. Those elections were followed by a deadly government crackdown on ensuing protests. Venezuela reacted by cutting off diplomatic relations with the Dominican Republic.\nMaduro was abducted by US forces in a military raid on Venezuela in January. The interim government in Caracas, led by interim President Delcy Rodriguez, has pursued renewed engagement with formerly estranged partners as part of a larger realignment with US interests in the region.\nThat has included opening up Venezuelan energy sources to US investment and greater access to other natural resources, such as minerals, along with closer ties to Washington.\nVenezuela recently announced that it would pull out of the International Criminal Court (ICC), which it accused of bias against poor and non-Western countries. The ICC announced in 2021 that it would investigate potential crimes against humanity by the Venezuelan government during its crackdown on anti-government protests in 2017. However, the recent decision coincided with a push by the Trump administration to delegitimise and hobble the international organisation.\nVenezuela agreed in February to restore flights between Caracas and Santo Domingo, the capital of the Dominican Republic, along with consular services.", "translation_ja": "", "vocab": [{"word": "severed", "definition": "完全に切断された、または断絶されたという意味。外交関係などの結びつきが完全に失われた状態を指します。"}, {"word": "fraudulent", "definition": "詐欺的な、または不正な行為による。選挙結果などが違法または不正な手段で得られたことを意味します。"}, {"word": "roadmap", "definition": "目標達成のための計画や指針。段階的な行動計画や合意事項の実行計画を示すビジネス用語です。"}, {"word": "normalization", "definition": "正常化、または通常の状態に戻すこと。国際関係において、対立していた関係を通常の良好な状態に戻すプロセスを指します。"}, {"word": "realignment", "definition": "再編成、または勢力図の再構成。政治的・外交的な立場や同盟関係の再構成を意味します。"}, {"word": "crackdown", "definition": "取り締まり、または厳しい弾圧。政府や権力者が反対勢力などに対して行う強硬な措置を指します。"}]}, {"title_ja": "モスクワ市長がレストラン爆弾テロを「テロ行為」と非難", "title_en": "Moscow Mayor Calls Restaurant Bombing a 'Terrorist Act'", "summary_ja": "2026年8月1日、モスクワ中心部の高級イタリアンレストランで爆弾攻撃が発生し、少なくとも3人が殺害され、21人以上が負傷した。モスクワ市長セルゲイ・ソビャニンはこの事件を「残忍なテロ行為」と非難したが、ロシア当局は犯人を特定しておらず、ウクライナ紛争との関連性も明らかにしていない。", "summary_en": "A bomb attack at an upscale Italian restaurant in central Moscow on August 1, 2026, killed at least three people and wounded 21 others. Moscow Mayor Sergei Sobyanin condemned the incident as a \"brutal terrorist act,\" though Russian authorities have not identified the perpetrators or drawn connections to the ongoing Ukraine conflict.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/moscow-mayor-calls-deadly-bomb-attack-on-a-restaurant-a-terrorist-act/article71299021.ece", "state_media": false, "category": "社会", "full_text": "Moscow Mayor Sergei Sobyanin called on Sunday (August 2, 2026) a bomb attack on a restaurant in the capital the day before a “brutal terrorist act,” but did not say who was responsible.\nThe blast on Saturday (August 1) evening at the Balzi Rossi, an upscale Italian establishment in central Moscow, killed three people, including the woman bomber, Russian state media said, citing local officials.\n“Yesterday, a brutal terrorist act was committed in Moscow that claimed human lives. The victims are currently in the city's hospitals, where they are receiving all necessary care,” Mr. Sobyanin wrote on social media on Sunday (August 2).\nHe added that a probe into the attack was underway. “Those responsible for committing this crime will certainly be found and will face the punishment they deserve,” he wrote.\nAt least 21 people were wounded when the explosive device detonated at the restaurant on Kudrinskaya Square, the National Anti-Terrorism Committee said late on Saturday (August 1), according to Russian state news agency Ria Novosti.\nA woman attempted to smuggle the bomb into the establishment, but a security guard refused to let her in before the bomb exploded, reported Ria Novosti. The Moscow Investigative Committee said on Saturday evening the attack was still being investigated.\nAs of early afternoon on Sunday (August 2), there was no further information from Russian authorities, and no one had publicly claimed responsibility.\nAccording to Ria Novosti, the restaurant was closed for a private function on Saturday (August 1) evening.\nFootage released by Russian state media showed heavily armed law-enforcement officers, several ambulances and other emergency vehicles at the site.\nEarlier this year, Russia's Federal Security Service announced that authorities would tighten security around senior military and government officials, after a series of assassination attempts in Russian cities that followed the Kremlin's full-scale invasion of Ukraine in February 2022.\nSo far, Russian authorities have not drawn any connections between Saturday's (August 2) blast and these earlier attacks or the war in Ukraine.\nRussia previously said Kyiv was behind a car bombing in Moscow last April that killed Lt Gen Yaroslav Moskalik, a deputy head of the main operational department in Russia's General Staff. Ukraine did not publicly claim responsibility.\nBut Ukraine's SBU security service earlier said it had organized the killing in December 2024 of Lt Gen Igor Kirillov, who headed the Russian military's nuclear, biological and chemical protection forces.\nKirillov was killed by a bomb hidden in a scooter outside his apartment building in Moscow, a day after Ukraine's security service leveled criminal charges against him.\nAmong other prominent victims of bombing attacks in Russia were Daria Dugina, the daughter of influential nationalist thinker Aleksandr Dugin, and Vladlen Tatarsky, a well-known pro-Kremlin military blogger.\nKyiv denied involvement in the attack on Dugina, and did not respond to Russian accusations that it was behind Tatarsky's death.\nPublished - August 03, 2026 02:06 am IST", "translation_ja": "", "vocab": [{"word": "detonated", "definition": "爆発する、または爆発させるという意味の動詞。爆弾や爆発装置が起動して爆発した場合に使用される。"}, {"word": "perpetrators", "definition": "犯人、加害者を意味する名詞。犯罪や違法行為を実行した人々を指す。"}, {"word": "probe", "definition": "調査、捜査を意味する名詞または動詞。事件や問題について詳しく調べることを指す。"}, {"word": "tighten security", "definition": "警備を強化する、セキュリティを厳しくするというイディオム。防御措置を増加させることを意味する。"}, {"word": "assassination", "definition": "暗殺、要人殺害を意味する名詞。政治的または個人的な理由で重要人物を殺害する行為を指す。"}, {"word": "publicly claimed responsibility", "definition": "公開で責任を認める、公式に犯行声明を出すという表現。組織や個人が攻撃を実行したことを公に認めることを指す。"}]}, {"title_ja": "バングラデシュ裁判所がヒンドゥー人権活動家に保釈を許可、完全釈放の可能性は低い", "title_en": "Bangladesh court grants bail to Hindu rights leader in two cases; full release unlikely", "summary_ja": "バングラデシュ高等裁判所は2026年8月2日、投獄中のヒンドゥー僧侶チンモイ・クリシュナ・ダスに2つの事件で保釈を認めたが、殺人と反逆罪を含む4つの追加告発により獄中に留まっている。ダスは2024年11月に国旗冒涜容疑で逮捕され、社会不安と抗議活動を引き起こした。複数の深刻な容疑が異なる裁判所で係属中であるため、彼の釈放の見通しは不確実なままである。", "summary_en": "Bangladesh's High Court granted bail to jailed Hindu monk Chinmoy Krishna Das in two cases on August 2, 2026, but he remains imprisoned due to four additional pending charges including murder and treason. Das was arrested in November 2024 on sedition charges for allegedly disrespecting the national flag, sparking communal tensions and protests. His release prospects remain uncertain as he faces multiple serious accusations across different courts.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/bangladesh-court-grants-bail-to-jailed-hindu-rights-leader-release-from-prison-unlikely/article71298906.ece", "state_media": false, "category": "社会", "full_text": "Bangladesh’s High Court on Sunday (August 2, 2026) granted bail to jailed Hindu rights leader Chinmoy Krishna Das in two cases, his lawyer said. But the bail would not ensure his immediate release from prison because he is accused in four other cases.\nMr. Das is a Hindu monk whose arrest in November 2024 on sedition charges for allegedly disrespecting the national flag sparked protests and communal tensions in Bangladesh. He was subsequently booked in several additional cases, including charges of murder, attempted murder and vandalism.\nIndia back then expressed \"deep concern\" over the arrest and asked Dhaka to ensure the safety \"of Hindus and all minorities\".\nIt came at a time when India-Bangladesh relations turned frosty following the August 2024 ouster of Prime Minister Sheikh Hasina — driven by her asylum in New Delhi and political friction with the interim government.\n“The (two-judge) High Court bench granted his bail petition in two cases involving charges of murder attempts, vandalism and obstructing officials in performing their duties,” Mr. Das’s lawyer Apurba Kumar Bhattacharya said on Sunday.\nBoth prosecution and defence lawyers said the decision of the Bench would not ensure Mr. Das’s release because of four more pending cases, including charges of treason and murder, against him.\nThe murder case concerns an incident in which a government prosecutor was hacked to death in the southeastern port city of Chattogram by activists protesting Mr. Das’s arrest.\nMr. Das, who was previously associated with ISKCON, is a spokesman for a group named Hindu group Sammilito Sanatan Jagaran Jote. The group organised several rallies in Bangladesh, demanding minority rights, safety and protection from civil unrest in 2024 after the ouster of Hasina following a violent student-led street protest.\nThe cases against Mr. Das are in different stages in the courts.\nHis lawyers have sought bail for a while, saying Mr. Das was languishing in jail for a long time with ailments.\nSeveral of his earlier bail petitions were either rejected or stayed.\nPublished - August 03, 2026 12:03 am IST", "translation_ja": "", "vocab": [{"word": "sedition", "definition": "政府転覆や反乱を扇動する行為または言論。国家の安定性を脅かす違法な政治活動を指す法律用語。"}, {"word": "interim", "definition": "暫定的または一時的な状態を表す。正式な体制が確立されるまでの過渡期を指す。"}, {"word": "communal tensions", "definition": "異なる宗教や民族グループ間の対立や不和。社会の安定を脅かす紛争状態。"}, {"word": "languishing", "definition": "苦しむ、衰弱する、または悪い状態が長く続くこと。改善の見込みなく困難な状況に置かれている状態。"}, {"word": "persecution", "definition": "特定のグループに対する体系的で継続的な虐待や差別。宗教的・政治的理由による抑圧。"}, {"word": "ouster", "definition": "権力者や指導者が強制的に退去させられること。クーデターや暴力的な政権交代を指す。"}]}, {"title_ja": "イランがトランプ大統領の「攻撃自粛要求」説を否定", "title_en": "Iran Denies Trump's Claim of Requesting U.S. to Hold Off Strikes", "summary_ja": "イランのメフル通信社は、テヘランが米国に攻撃を控えるよう要求したというトランプ大統領の主張を嘘だと否定した。トランプ氏は、イランがホルムズ海峡を開放し核計画を終わらせることに同意すれば、米国とイスラエルは計画中の攻撃を中止すると述べた。イラン指導部は全面勝利を目指す強硬派と交渉による和解を求める穏健派に分裂している。", "summary_en": "Iran's Mehr news agency denied President Trump's assertion that Tehran requested the United States refrain from conducting new strikes, calling it a lie. Trump stated the U.S. and Israel would hold off on planned attacks if Iran agrees to open the Strait of Hormuz and end its nuclear program. Iranian officials remain divided b
