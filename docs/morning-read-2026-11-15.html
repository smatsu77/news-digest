 to happen tomorrow?\"\nA nationwide ground stop has only been ordered one other time since all flights were banned from take-off for several days following the 11 September 2001 attacks.\nRelated topics\n  - Published1 hour ago", "translation_ja": "", "vocab": []}, {"title_ja": "ゼレンスキー大統領、米国がドンバス譲渡とNATO加盟を交換案として提示したと発表", "title_en": "US has floated Ukraine ceding Donbas for Nato membership, Zelensky says", "summary_ja": "ウクライナのゼレンスキー大統領は、米国の交渉担当者がドンバス地域からの撤退とNATO加盟の交換案を提示したと述べました。米国はこのコメントを確認していませんが、ゼレンスキー大統領は安全保障の保証と国家再建資金が含まれた具体的な提案があれば国民投票にかけることを示唆しました。", "summary_en": "The US has not confirmed the Ukrainian president's comments - a US official told the BBC \"many ideas continue to be discussed\".", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwvg2l312ylqo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "US has floated Ukraine ceding Donbas for Nato membership, Zelensky says\n- Published\nUS negotiators have touted the idea of Ukraine withdrawing its remaining forces from the eastern Donbas region in exchange for Nato membership, President Volodymyr Zelensky has said.\nThe US has not confirmed Zelensky's comments, and a US official told the BBC \"many ideas continue to be discussed but any final deal will have to be agreed to by both parties\".\nThe Ukrainian leader's comments came after US envoys met Russian President Vladimir Putin and Zelensky as part of US efforts to end the war between Russia and Ukraine.\nKyiv has long sought membership of the military alliance, but this has previously been opposed by the US and others while Russia has said another Nato member on its border is unacceptable.\nRussia launched a full-scale invasion of Ukraine in February 2022. It controls most of the industrial region of Donbas and Zelensky has consistently said Ukraine is unwilling to give up sovereign territory.\n\"The Americans raised a question: 'What if Ukraine joins Nato? Would Ukraine withdraw from Donbas?' This was the first time this had been raised,\" Zelensky said in remarks released by his office on Saturday.\nHe went on to say that if he received a specific proposal that contained security guarantees, no constraints on Ukraine's military and funds to rebuild the country, he would put it to a referendum.\nUS envoys Jared Kushner and Steve Witkoff travelled to the Irish capital, Dublin, on Thursday to meet Zelensky, after a round of talks with Putin in Moscow.\nComments by both Putin and Kremlin officials suggest that Russia's position on the war has not shifted. It has previously proposed limits on the size of Ukraine's military, territorial concessions and Kyiv's guaranteed neutrality as conditions of a peace deal.\nUkraine has rejected these, arguing that such constraints would hamper its ability to stave off any future invasion.\nOther Nato members apart from the US are wary of membership for Ukraine - and it is understood that Ukraine itself sees that as unrealistic.\nThe Kremlin has always been fiercely opposed, too. It is one reason why Russia started this war in the first place.\nIt is possible the American envoys were exploring Ukraine's \"red lines\" when it comes to occupied land in the Donbas. Zelensky said recently that the US mediators believed Kyiv only had to cede territory to achieve peace and were applying pressure, keen to do a deal as soon as possible.\nUkraine is sure that Russia's ambitions are far greater and has long seen Nato as its only sure protection.\nSo it is also possible that Zelensky made this suggestion public in order to re-open a discussion that had been considered all but closed.\nHe maintains that the idea is now \"back on the agenda\" as part of an \"extremely difficult conversation\" on European security.\nIt also looks like Ukrainian push-back against Russia's renewed hardline stance. Moscow now talks about a \"new European security architecture\", which is long-standing Russian code for a weaker Nato.\nThe over accessing users' photos", "summary_ja": "イタリアのデータ保護局がメタに対し、ユーザーの明示的な同意なしにAndroidユーザーの写真にアクセスしたとして8億5000万ユーロ（約670億円）の罰金を科しました。フェイスブックアプリの機能により2000万人のスマートフォンユーザーが影響を受けました。メタは60日以内にこの機能をデフォルトで無効化し、ユーザーの個別同意を得るよう命じられています。", "summary_en": "The social media giant is accused of not informing 20 million users it had access to their photos.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwn83gxemk35o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Italy fines Meta €805m over accessing users' photos\n- Published\nItalian regulators have fined social media giant Meta €805m (£670m; $887m) for accessing Android users' photos without their specific consent.\nItaly's Data Protection Authority said Meta did not properly inform about 20 million smartphone users that it had access to their photos and videos via a feature of the Facebook app.\nIt has given Meta 60 days to disable the feature by default and seek users' consent separately.\nThe fine is among the largest an Italian authority has ever imposed on a tech giant.\nA Meta spokesperson told the BBC that it planned to appeal.\nThe charge is related to a feature which suggests photos and videos from a user's phone gallery as ideas for posts.\nFacebook requested access to users' photo galleries through a single app-wide authorisation. According to the Italian regulator, a preceding notice did not make clear that this would also allow Facebook to generate suggestions based on photos in their gallery.\nThe regulator said it took into account \"the high number of people affected\" and the fact it is \"still ongoing for those who have not updated the app and for those who have already given their consent to the system\".\nIt also cited \"Meta's lack of co-operation\".\nMeta told the BBC: \"We strongly disagree with the [regulator's] assessment of the facts, its application of the law, and the disproportionate level of the fine.\n\"This is a straightforward feature which helps people post photos and videos to Facebook. People must give permission on their device before it can operate, and they can change this permission at any time via their settings.\"\nLast month, Meta, which is also behind Instagram and WhatsApp, was hit with its largest fine ever for its business practices.\nA US judge in New Mexico ordered the company to pay $25bn (£18.6bn) after it found that found it had spent years lying to the public about how it handled Facebook user data.", "translation_ja": "", "vocab": []}, {"title_ja": "若者は仕事または訓練の法的保障を受けるべき、ミルバーン氏がBBCに述べる", "title_en": "Young people should have legal guarantee of job or training, Milburn tells BBC", "summary_ja": "青年失業に関する大規模レビューの著者であるアラン・ミルバーン元労働党議員は、若者が仕事、訓練、雇用支援の法的保障を受けるべきだとBBCに述べました。政府が若者向け給付金に使う予算を、就職支援に充てるべきと主張しており、現在25対1の比率を2対1に改める必要があると述べています。この提案には、給付金支給の大幅削減と、訓練や教育などの支援に対する追加的な税金投入が含まれています。", "summary_en": "The author of a major review on youth unemployment, due next week, acknowledges the change would mean some young people losing out on benefits.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c69vwp09d7vvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Young people should have legal guarantee of job or training, Milburn tells BBC\n- Published\nYoung people should have a legal guarantee of a job, training or employment support, the author of a major review of youth unemployment has told the BBC.\nAlan Milburn, the former Labour minister whose proposals on welfare and young people will be unveiled on Tuesday, said those who refuse to take up the help could lose their benefits.\nIn an interview to be broadcast on Sunday, Milburn called for a radical shift in government spending away from benefits for young people to measures that support them into work.\nHe claims the government spends 25 times as much on benefits for young people than it spends on supporting them into employment, and believes the ratio should shift to two to one.\nThat would mean significant cuts to benefit spending and significant extra taxpayers' cash for training, education or other forms of support.\nMilburn said \"the pendulum's swung far too far from the one to the other - £25 to one, and we can take everything to £2 to one\".\nHe added: \"To do that, we've got to invest, less in benefits, so we've got to be paying out less in benefits.\"\nThe former MP acknowledged that would mean some young people losing out on benefits, arguing the system should focus on helping people into work rather than keeping them dependent on welfare.\n- Some under-25s should get fewer benefits, Milburn review to say \n  - Published2 days ago\n- Can Burnham avoid another Labour welfare rebellion? \n  - Published2 days ago\nMilburn said the government is already spending £22bn a year supporting young people who are economically inactive, and that money needs to be spent differently.\nHe has already said that the under 25s should no longer be able to claim some health benefits – the personal independence payment and the health element of Universal Credit.\nIn his other major announcement, Milburn spoke of the proposal he calls an \"opportunity guarantee\" for young people.\nThis would put a legal duty on government to ensure young people have access to a route into employment.\nHe said: \"It should be a guarantee for a young person. Because at the moment the only guarantee they've got is a very simple thing. To get a benefit. What sort of life is that?\"\nThe \"opportunity guarantee\" might work similarly to the way that councils have a legal responsibility to offer homeless people accommodation or advice, or accommodate children in care.\nMilburn argues previous employment schemes have been temporary, and says a permanent legal entitlement is needed to tackle the long-running problem of young people not in education, employment or training.\nThe government is expected broadly to welcome the proposals, which will be published in full on Tuesday, with a statement in Parliament and draft laws early next year.\nAlmost one million young people in the UK are not in employment, education or training - otherwise known as Neet - according to the latest data from the Office for National Statistics.\n'Watershed moment'\nPrime Minister Andy Burnham has described Milburn's forthcoming report as a \"watershed moment,\" but stopped short of committing to implementing its recommendations in full.\nBurnham also insisted paying for the reforms would not mean \"more money\" but \"spending differently\" in government when pressed on the large upfront investment they are expected to require.\nAsked whether he would accept the politically sensitive report in full, Burnham declined to provide that \"blanket assurance\".\nSpeaking at the Welsh Labour conference on Saturday, Burnham said that the report addressed the \"youth detachment\" that has been on the rise since the pandemic.\n\"It can't be right that we've stripped away support from young people as a society, as life is getting harder for them and growing up is getting more difficult,\" he said.\nThe prime minister added that the government was also looking at a new vision for schooling that is \"not focused solely on the university route\" and which offers technical education alongside traditional academic learning.\nLord Blunkett, a former Labour home secretary, told the BBC that money from cutting benefits spending should be reassigned to supporting employment \"at least in the immediate future\".\nSpeaking on Radio 4's Today programme, he said reforms should focus on \"transferring resource that currently goes into paying for failure, keeping youngsters at home, isolated, lonely, into actually putting the money in and the resource and the commitment in to making those jobs available\".\nConservative Party leader Kemi Badenoch has previously said the government should not be spending \"lots of time\" on employment schemes, which she said would ultimately fail.\nHer party and Reform UK have argued for significant cuts to welfare, including to fund a boost to defence.\nReform economy spokesman Robert Jenrick said: \"This review is pointless unless we get action from Burnham straight away.\n\"It cannot be right that this continues for anothe", "translation_ja": "", "vocab": []}, {"title_ja": "ラッセル・ブランド性的暴行疑惑の被害者、同意年齢法の変更を求める", "title_en": "Alleged Russell Brand rape victim wants age of consent law changed", "summary_ja": "ラッセル・ブランドから16歳の時に強盗されたと主張する女性ミア・ラターが匿名性を放棄し、段階的な同意年齢法の導入を求めるキャンペーンを開始しました。彼女は16～18歳の未成年者と30代以上の成人との関係を犯罪とすべきだと主張しています。ブランドは先月、強盗1件と性的暴行3件で懲役10年半の判決を受けています。", "summary_en": "Mia Latter, who says she was 16 when she met the convicted rapist, wants a staggered age of consent.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm3rgx9p583zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Alleged Russell Brand rape victim wants age of consent law changed\n- Published\n- Warning - this story contains graphic content\nA woman who has alleged that she was raped by Russell Brand when she was 16 has waived her right to anonymity and is campaigning for a staggered age of consent in an interview with the Sunday Times.\nMia Latter was one of six women who made allegations against Brand in 2023 as part of a Times, Sunday Times and Channel 4's Dispatches investigation. She was known under the pseudonym 'Alice'. Brand denied the allegations at the time.\nNone of the women in the 2023 media investigation were complainants in Brand's recent criminal trial.\nOn Monday the entertainer was sentenced to 10 and a half years for one count of rape and three counts of sexual assault. He was acquitted of two counts of rape and one allegation of attempted indecent assault.\nThe Sunday Times reported that Latter had initially described the allegation about Brand to them as a sexual assault and that is how they reported it in their 2023 investigation.\nLatter, 37, \"now calls this allegation rape\", the paper said.\nLatter said she was 16 when she met Brand, who was 30 at the time, when she was on her way home from a shopping trip. She said Brand was working at MTV.\nShe told the paper: \"I think people were so struck by my story because of the age difference and the clear imbalance [in power],\"\nShe said Brand told her to keep their relationship secret from her school friends and claimed that he referred to her as \"the child\" in front of his entourage.\nIt was towards the end of their relationship that Latter was allegedly orally raped by Brand, according to the Sunday Times.\nLatter said that she was now campaigning for the introduction of a \"staggered\" age of consent that would prohibit relationships between 16- and 17-year-olds and adults.\n\"I don't want to criminalise teenagers having sex with each other,\" she told the paper. \"If you're between the ages of 16 and 18, it seems reasonable that you can have relationships with each other, and [teenagers] are always going to. But … if you're in your thirties, forties and fifties and you're trying to have a relationship with someone under the age of 18, it [should be] a criminal offence.\"\nShe also told the paper that she would not continue with the criminal process so she could focus on her campaign.\nIn her interview with the Sunday Times she said that the CPS decided not to include her as part of Brand's criminal trial but the police wanted her to be part of a \"subsequent trial\".\nA Met Police spokesperson said: \"Officers launched an investigation in January 2026 after receiving an allegation of rape.\n\"Detectives sought advice from the Crown Prosecution Service to determine how best to proceed, and officers were advised that further information was needed before a charging decision could be made.\n\"This investigation remains ongoing. We understand the delay has been distressing for this victim-survivor. However, our focus has been on putting forward the best possible evidence.\"\nA spokesperson for the Crown Prosecution Service said it would \"continue to work closely with investigators to provide advice and make sure cases progress as quickly as possible\".\nRelated topics\n  - Published1 day ago\n  - Published2 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "仮面をかぶった集団に刺された男性が死亡、マンチェスターで殺人事件に", "title_en": "Man dies after being stabbed by gang of masked men", "summary_ja": "マンチェスターのクラムプサル地区で27歳の男性が複数の刺し傷を負わされ、救急車で搬送される途中に死亡しました。警察は黒い服とバラクラバを着用した複数の容疑者による襲撃事件として殺人捜査を開始しており、目撃者からの情報提供を呼びかけています。容疑者らはアッシュツリー・ロードの方向に現場から逃走したと考えられています。", "summary_en": "Police say a 27-year-old man died after being stabbed in the \"shocking and tragic attack\" in Crumpsall.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm4gn7pp5r85o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Man dies after being stabbed by group in balaclavas\n- Published\nA murder investigation has been launched after a 27-year-old man was stabbed in Manchester.\nOfficers were called to Moss Bank in the Crumpsall area of the city shortly after 01:30 GMT following reports that a man had suffered several stab wounds. He later died from his injuries in an ambulance.\nGreater Manchester Police (GMP) said initial inquiries suggested the victim had been attacked by \"a number of males\" all believed to have been wearing dark clothing and balaclavas.\nThe suspects are believed to have fled the scene in the direction of Ash Tree Road, said a force spokesperson who added that no arrests had been made and inquiries were continuing.\nForensics officers could be seen lifting drain covers within the area and looking under cars parked along the street lined with terraced houses.\nOne officer climbed a fence near an alley.\nA police spokesperson said the victim's family had been informed and were being supported by specially trained officers.\n\"First and foremost, my thoughts are with the victim's family and loved ones at this devastating time,\" said Det Insp Neil Higginson.\n\"This was a shocking and tragic attack which has resulted in a young man losing his life.\n\"I would like to reassure the community that we are pursuing all available lines of inquiry.\n\"I would urge anyone who witnessed the incident or has any information that could assist our investigation to contact us.\"\nGet in touch\nTell us which stories we should cover in Greater Manchester\nListen to the best of BBC Radio Manchester on Sounds and follow BBC Manchester on Facebook, external, X, external, and Instagram, external. You can also send story ideas via Whatsapp to 0808 100 2230.", "translation_ja": "", "vocab": []}, {"title_ja": "フィリピンがユーロビジョン・ソング・コンテスト・アジア初代優勝", "title_en": "Philippines wins first Eurovision Song Contest Asia", "summary_ja": "フィリピンは2026年11月14日、アジア版ユーロビジョン・ソング・コンテストの初代優勝国となりました。19歳のカルメル・コラド選手が英語とタガログ語の歌詞を特徴とした「ソブラ・ソブラ」で優勝し、211点を獲得しました。バンコクで開催されたこのコンテストには11カ国が参加しましたが、欧州版のユーロビジョンと比べて人気の程は未知数です。", "summary_en": "Eleven countries took part in the competition in Bangkok. Teenage winner Carmelle Collado's winning dance song is a tribute to Filipino women.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/philippines-wins-first-eurovision-song-contest-asia/a-79950050?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Philippines wins first Eurovision Song Contest Asia\nNovember 14, 2026\nThe Phillippines on Saturday became the first winner of the Asian version of the Eurovision Song Contest.\nWho took part in the event and which songs were featured?\nEleven countries, including South Korea, Malaysia and Vietnam, took part in the song contest in the Thai capital, Bangkok. However, major nations in the region such as China, Japan and India were absent from the event.\n19-year-old Carmelle Collado's dance song \"Sobra-Sobra\" (Too Much) won the competition. The song, which features lyrics in both English and Tagalog, is an empowering tribute to Filipino women.\nThe Philippines received 211 points in the competition, with Thailand in second place with 170 points. Vietnam placed third with 164 points, while Malaysia landed in fourth place on 152 points.\nNational juries in the participating countries and the viewing audience awarded the points.\nThe competition featured motifs inspired by host city Bangkok, with the participants making their way to the stage on tuk-tuks and waving the flag of the countries they represent in a parade.\nWill the Eurovision Song Contest Asia become a sensation?\nThe contest featured some references to the camp European competition. Bulgarian singer Dara performed \"Bangaranga,\" the song which won the Eurovision Song Contest in Vienna in May.\nIt's unclear whether Eurovision Song Contest Asia will be as popular as the original competition, which received 131 million viewers this year. Tickets for the Bangkok event were still available just hours before it kicked off.\nIn 2022, a US spinoff, the American Song Contest, featured acts from all 50 US states. The competition, hosted by rapper Snoop Dogg and American Idol star Kelly Clarkson, only lasted for one season.", "translation_ja": "", "vocab": []}, {"title_ja": "SpaceXが史上初の宇宙船キャッチに成功", "title_en": "SpaceX carries out first-ever spaceship capture", "summary_ja": "SpaceXは11月14日、打ち上げから22時間以上飛行したStarship宇宙船をテキサス州の発射台の機械的な「チョップスティックアーム」でキャッチすることに成功しました。これは15回目のテスト飛行であり、同社の再利用可能ロケット開発における重要なマイルストーンです。一方、ロケットの下段であるSuper Heavy ブースターはエンジンの早期停止によりメキシコ湾上空で爆発し、回収は中止されました。", "summary_en": "The successful recovery of SpaceX's Starship marks a breakthrough in founder Elon Musk’s goal of developing a fully reusable rocket system.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/spacex-carries-out-first-ever-spaceship-capture/a-79950275?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "SpaceX carries out first-ever spaceship capture\nNovember 14, 2026\nSpaceX's Starship spacecraft returned from its longest-yet flight in orbit on Saturday to the tower it was launched from on Friday.\nThe spaceship descended and smoothly slipped between the mechanical \"chopstick arms\" above Launch Pad 2 in the US state of Texas. It was the first key recovery of the rocket system's centerpiece vessel in the company's decadelong effort to develop a fully reusable rocket.\n\"Can you believe it?\" SpaceX commentator Dan Huot shouted. \"Look at her! Baby, she’s back!\"\nSpaceX's Starship hit key milestone\nIt was the 15th test flight of the world's biggest and most powerful rocket system. The Starship spacecraft orbited Earth 14 times for over 22 hours, during which it deployed 26 Starlink satellites.\nThe successful return marked a key milestone in the multibillion-dollar development of Starship, which billionaire Elon Musk sees as crucial to SpaceX's satellite business and ambitions to put humans on the Moon and eventually Mars.\nNASA welcomed the news. The US space agency is paying billions of dollars for Starship to land Artemis astronauts on the moon later this decade and help build a permanent lunar base.\n\"It was almost magic,\" NASA Administrator Jared Isaacman wrote on X.\nSpaceX still investigating booster malfunction\nSpaceX also intended to capture the bottom part of the rocket, known as the Super Heavy booster, but the lower stage recovery was aborted, and it exploded over the Gulf of Mexico shortly after launch on Friday.\nSpaceX's Kate Tice said its engines stopped firing too soon. The booster's guidance system sensed it was not in the correct position and initiated the self-destruction protocol. Engineers are still investigating the cause.\nSpaceX caught the Super Heavy Booster on three earlier test flights. Developing a fully reusable rocket system is key to SpaceX’s goal to drive down the cost of spaceflight.", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツの2027年予算：過去最高の5610億ユーロと負債の山", "title_en": "Germany's 2027 budget: A record €561 billion and a mountain of debt", "summary_ja": "ドイツの連邦議会予算委員会は、2027年度予算案に5610億ユーロの支出を承認しました。歳入不足により1230億ユーロの借金が必要となり、防衛費と社会保障費の増加を含めると総借入額は2100億ユーロを超える見込みです。この金額はCOVID-19パンデミック時の2021年に次ぐ過去2番目の高水準となり、野党から「無責任」との批判を受けています。", "summary_en": "The 2027 federal budget proposal has finally been hammered out and is set for a vote in parliament. What are the government's policy priorities in defense, infrastructure, the economy and social spending?", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/germany-s-2027-budget-a-record-€561-billion-and-a-mountain-of-debt/a-79943216?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Germany's 2027 budget: A record €561 billion and a mountain of debt\nNovember 14, 2026\nIt was 5:55 a.m. on Friday when the Bundestag's Budget Committee concluded its final session.\nFollowing nearly 16 hours of negotiations, lawmakers from the conservative Christian Democratic Union(CDU) and Christian Social Union (CSU) parties, along with their coalition partners from the center-left Social Democratic Party (SPD), voted in favor of the 2027 draft budget. The opposition parties — the environmentalist Greens, the socialist Left Party and the far-right Alternative for Germany (AfD) — voted against it. With that, the way is now clear for the final vote in the Bundestag on November 27.\nReading through the nearly 1,000-page document requires a great deal of number-crunching. Next year, the federal government plans to spend around €561 billion ($620 billion).\nBut here's the problem: it won't collect nearly enough revenue to cover these expenses. With a shortfall of €123 billion, borrowing will be needed to bridge the gap.\nBut that's not the only problem. On top of all this debt, Germany also has loans for defense spending and for the renovation of the dilapidated infrastructure. Approved by the Bundestag in 2025, these special funds are set to be in place for multiple years.\nIf the new debt for 2027 is factored in, the total borrowing amounts to over €210 billion. This is the second-highest level of borrowing in the history of the Federal Republic of Germany. The only time Germany borrowed more was during the COVID-19 pandemic in 2021, when borrowing reached €215.4 billion.\nThis development has drawn sharp criticism from opposition parties. Green Party lawmaker Sebastian Schäfer and his colleague Dietmar Bartsch of the Left Party called it a \"gigantic mountain of debt,\" an \"untrustworthy\" budget, \"irresponsible\" policies at the expense of future generations and a lack of future prospects.\nWhy is debt growing? Crises drive up costs\nTo understand the reasons behind the growing debt, one has to look beyond the numbers. Every federal budget is a snapshot of the priorities set by a government and a country — in terms of the economy, social issues, security and geopolitics.\nFor 2027, that story continues to be one of crises and wars. While Russia's war against Ukraine is driving up defense spending, the faltering economy is also demanding new investments. At the same time, Germany's population is aging rapidly, which is driving up social spending.\nWhat's more, the crumbling infrastructure must be repaired and modernized, and the energy transition is costing billions. And more than half of all this debt is going toward security and defense.\nDefense spending continues to rise\nRussia's war against Ukraine will enter its sixth year in 2027. As of the end of June, the federal government estimated its overall support for Ukraine to have reached approximately €100 billion. In response to a request from the AfD in the Bundestag, the government stated: \"The federal government will continue to provide Ukraine with political, financial, humanitarian, civil and military support for as long as necessary.\"\nThe rearmament of the Bundeswehr and spending on NATO are also putting massive pressure on the budget. The defense budget is set to grow to just under €110 billion in 2027, an increase of around €27 billion compared to last year. Added to this are expenditures from the Bundeswehr's special fund.\nLargest budget item: Social spending and pensions\nNevertheless, by far the largest single budget item comes from the Ministry of Labor and Social Affairs, which is set to grow to over €200 billion. There are plans for cost-cutting measures, for example, in basic income support for job seekers. But the costs of old-age pension benefits continue to rise.\nPeople born in the 1960s have begun to retire. Back then, more than 1 million children were born each year. But birth rates nearly halved in the early 1970s and have continued to decline since then. As a result, there will be an increasing number of retirees and a decreasing number of working-age individuals in the coming years.\nThe pension funds cannot be financed by the pension contributions of this dwindling workforce and have to be subsidized by the government. Already, contributions to the pension insurance system — which are split equally between employees and employers — will have to be increased. They are expected to rise to just under 20% of gross salary.\nThe Federal Employment Agency, too, has long been unable to make ends meet on contributions alone. In 2027, subsidies of more than €8 billion from the federal budget are planned.\nGermany no longer a model of fiscal discipline\nAnyone comparing Germany's current budget situation with that of past years will be rubbing their eyes in disbelief. It wasn't that long ago that Germany was considered a model of fiscal discipline. Between 2014 and 2019, the federal budget managed to avoid taking on new debt for six consecutive years. In some y", "translation_ja": "", "vocab": []}, {"title_ja": "専門家が語る、グラウンドストップの影響が残る中での旅行ナビゲーション方法", "title_en": "How travelers can navigate trips as ground stop effects linger, expert says", "summary_ja": "FAA管理者のブライアン・ベッドフォード氏によると、システムは日曜日までに完全に復旧する予定だという。グラウンドストップの影響が続く中、旅行者は移動手段の計画に注意を払う必要がある。専門家は利用者に対して、航空会社の最新情報を確認し、柔軟なスケジュール管理を心がけるよう勧めている。", "summary_en": "FAA administrator Bryan Bedford said the system is expected to be fully recovered by Sunday.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/travelers-navigate-trips-ground-stop-effects-linger-expert/story?id=138141476", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは、速報ニュースとライブイベントの24時間体制のカバレッジを提供しています。最新のニュース情報をリアルタイムで配信する総合的なニュースプラットフォームです。国内外の重要なニュースや社会的関心事を常に監視し、視聴者に迅速な情報をお届けしています。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イリノイ州の工場での爆弾脅迫、当局が調査", "title_en": "Authorities investigate 'credible' bomb threat at Illinois plant", "summary_ja": "ペオリア警察は土曜日、イリノイ州の施設で信憑性のある爆弾脅迫事件について調査したと発表しました。調査官が数時間にわたり施設を捜索した結果、追加の爆発装置は発見されず、避難命令は解除されました。", "summary_en": "No additional devices were found and the evacuation order has been lifted after investigators searched the facility for hours, Peoria police said Saturday.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/peoria-police-urge-evacuations-after-reported-bomb-threat/story?id=138137440", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジンバブエの作家シムバラシェ・クンディゼザがAI使用の疑いから潔白が証明される", "title_en": "Zimbabwean author Simbarashe Kundizeza cleared of using AI to write prize-winning story", "summary_ja": "ジンバブエの作家シムバラシェ・クンディゼザが、受賞した短編小説『The Blue Fighter』でAIを使用したという疑いについて、アフリカ文学の権威あるケイン賞の調査により潔白が証明されました。同賞の委員長は詳細な調査の結果、この作品は「人間によって執筆された」ものであると確認し、AI検出ソフトウェアの判定に異議を唱えました。この判定は、黒人作家やアフリカの作家がAI使用疑惑で不当に標的にされているとのオンライン上での議論を受けたものです。", "summary_en": "After a month-long investigation it was concluded that Kundizeza’s story The Blue Fighter, which won the £10,000 Caine prize, was ‘human-written’ The Zimbabwean author Simbarashe Kundizeza has been cleared of using AI to write a prize-winning short story, after the prestigious Caine prize for Africa", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/books/2026/nov/12/zimbabwean-author-simbarashe-kundizeza-cleared-ai-caine-prize-winning-story", "state_media": false, "category": "経済", "full_text": "The Zimbabwean author Simbarashe Kundizeza has been cleared of using AI to write a prize-winning short story, after the prestigious Caine prize for African writers concluded that his entry was “human-written” after a month-long investigation.\nKundizeza’s story The Blue Fighter, which charts the declining fortunes of a family after the father invests in fish tanks, was announced as the winner of the £10,000 prize on 6 October.\nFive days later, the Atlantic published an article titled “Yet another literary prize winner seems to be AI”, in which the author and journalist Vauhini Vara said the AI-detection software Pangram, which itself uses AI, had deemed the story to be almost completely artificially generated.\nThe Caine prize chair, Ellah Wakatama, said in a statement: “From our detailed investigation, we feel the evidence is clear: The Blue Fighter was human-written. We now look forward to awarding and celebrating Simbarashe Steyn Kundizeza … before the end of the year.”\nShe said: “When concerns were raised, we have a duty as an organisation to look at them carefully and fairly,” adding that the prize had taken a “human-centred” approach to its investigation.\n“Our review included interviews with the author, the 2026 judging panel and The Shallow Tales Review, where the story was first published,” Wakatama said. “It also included independent and expert-led metadata analysis of drafts written by the author.”\nKundizeza, who had strongly denied using generative AI to write the story, said he was “relieved” that the allegations had been dismissed after the investigation. “It was not necessary in the first place, I am happy to put all this behind me and continue with my writing journey,” he said.\nVara’s article prompted outrage online, with many claiming that Black writers, and Africans in particular, were being unfairly singled out by allegations of the use of AI.\nAssociated Press contributed to this report", "translation_ja": "", "vocab": []}, {"title_ja": "ルイス・ハミルトン、エジプトのラファ検問所とガザ支援施設を訪問", "title_en": "Lewis Hamilton visits Egypt’s Rafah crossing and Gaza aid facilities", "summary_ja": "7度のF1世界チャンピオン、ルイス・ハミルトンがエジプトのラファ国境検問所を訪れ、ガザへの人道支援を行う組織と面会した。ハミルトンは長年、イスラエルの空爆で殺害されたガザの子どもたちについてソーシャルメディアで発信し、停戦を求めてきた。この訪問は、エジプトのガザへの援助活動についてハミルトンが学ぶことを目的としていると北シナイ州知事は述べている。", "summary_en": "Seven-time F1 world champion tours border area and logistics warehouses operated by Egyptian Red Crescent Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory. The seven-time Formula One world champion has spoken", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/10/lewis-hamilton-egypt-rafah-crossing-gaza-aid-facilities", "state_media": false, "category": "政治", "full_text": "Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory.\nThe seven-time Formula One world champion has spoken out about conflict and humanitarian crises in the region, and has called for peace. He has frequently posted on social media about children killed in Israeli airstrikes in Gaza and called for a ceasefire.\n“I think we need to make sure we’re pushing to free Congo, free Sudan, free Syria, free Palestine. I think there’s a lot of peace that I’m hoping we get to at some stage,” Hamilton said in October.\nA ceasefire agreement reached last year has halted major combat operations in Gaza, but the amount of aid reaching the territory continues to fall far short of the agreed-upon minimum of 600 trucks a day.\nIsraeli forces have continued to advance, expanding their control from 53% of the territory to at least 60%, an independent commission of UN experts said last month.\nAirstrikes also continue, and Israeli fire along the advancing front has killed at least 196 Palestinians, including 18 women, 32 boys and 11 girls, the commission said.\nHamilton toured Egypt’s Rafah border crossing with Gaza before visiting logistics warehouses operated by the Egyptian Red Crescent, which facilitates the entry of aid to Gaza.\nAt the crossing, Hamilton greeted aid workers with “Assalamu alaikum” a widely used Arabic greeting meaning “peace be upon you.” He shook hands and briefly spoke to workers and officials.\nKhaled Megawer, the governor of North Sinai, where Rafah is located, said the visit was intended to help Hamilton learn about Egypt’s efforts to send aid to Gaza.\nThe visit comes after Hamilton made his 400th race start on Sunday at the São Paulo Grand Prix at Interlagos.\nThe first black F1 driver, he made his debut with McLaren in 2007. He is only the second F1 driver to start 400 races after his former teammate Fernando Alonso, who achieved the milestone in 2024.", "translation_ja": "", "vocab": []}, {"title_ja": "エジプトで列車同士が衝突、少なくとも7人が死亡", "title_en": "Collision of two trains in Egypt kills at least seven", "summary_ja": "エジプトの首都カイロ南部で2列車が衝突し、少なくとも7人が死亡、125人以上が負傷しました。ファイユーム州行きの列車がアスワン州行きの停止中の列車に衝突したもので、同地区では昨年9月にも貨物列車同士の衝突事故が発生しています。エジプトの鉄道網は老朽化と保守不足が常態化しており、政府は近年改修計画を発表しています。", "summary_en": "President orders prompt investigation after one train derails in collision in al-Ayyat about 50km from Cairo Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said. The crash occurred in al-Ayyat district in Giza prov", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/08/egypt-two-trains-deadly-collision", "state_media": false, "category": "政治", "full_text": "Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said.\nThe crash occurred in al-Ayyat district in Giza province, about 50km (30 miles) south of Cairo, when a train travelling to Fayoum province crashed into the rear of a train heading to the southern province of Aswan, according to the transport ministry.\nAn inspection indicated that the Cairo-Aswan train had been stationary on the same track, officials said.\nThe health ministry gave the casualty toll, adding more than 70 of the injured were discharged after receiving treatment.\nTrain derailments and crashes are common in Egypt, where the railway system has a history of mismanagement and poor maintenance of equipment. In recent years the government has announced modernisation initiatives to improve its railways.\nAyman Gamal, a resident of Kafr Girza in al-Ayyat where the crash occurred, said people rushed to the scene, pulled out survivors and called ambulances.\nGamal said he saw about 80 of the injured being taken by ambulances to hospital. Some passengers were trapped inside one of the carriages of the stationary train and died, he said.\nEgypt’s president, Abdel Fatah al-Sisi, said in a social media post that he had ordered a prompt investigation.\nOutside al-Wasta central hospital in Beni Suef province, where some of the injured were taken for treatment, survivors said passengers were in shock and struggling to breathe because of all the dust that was kicked up. Nearby villagers eventually got them out, they said.\nFarha Gamal, a survivor who was inside the Fayyoum train, said she saw some of the passengers who appeared dead and others were struggling to find their way out of the car. “There were other cars that were completely mangled,” she said in an interview.\nEmergency teams and cranes were dispatched to the crash site to clear the wreckage and restore train services to their normal schedule as soon as possible, the Egyptian railway authority said.\nLast September, a train driver and his assistant were injured after two freight trains collided in the same district.\nEgypt’s deadliest train crash was in 2002 when more than 300 people were killed after a fire broke out on an overnight train journeying from Cairo to southern Egypt.", "translation_ja": "", "vocab": []}, {"title_ja": "SpaceXのスターシップ、打ち上げ台の機械アームでキャッチ 歴史的初成功", "title_en": "SpaceX’s Starship captured by launchpad arms in dramatic first", "summary_ja": "SpaceXのスターシップが宇宙から帰還し、テキサス州のスターベースで巨大な機械アーム「チョップスティックアーム」によって空中でキャッチされました。この初の成功は、スターシップの完全な再利用可能性を実証し、迅速で低コストなリサイクルが可能であることを示しています。ただし、1段目ブースターは打ち上げ直後に爆発し、目指していた二重キャッチには至りませんでした。", "summary_en": "Starship&#039;s dramatic capture sets up Artemis mission launches from Florida in the next few months.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/15/spacexs-starship-captured-by-launchpad-arms-in-dramatic-first?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "SpaceX’s Starship captured by launchpad arms in dramatic first\nSpaceX officials say catch by mechanical arms shows Starship’s full reusability, crucial for rapid, low-cost recycling.\nSpaceX’s Starship spacecraft has returned to Earth, caught midair by giant mechanical arms where its journey began 22 hours earlier.\nThe spaceship emerged from a cloudy sky on Saturday, descending slowly over Starbase before slipping smoothly between mechanical “chopstick arms” above Launch Pad 2 in Texas – the first-ever capture of a Starship flying back from space.\nSoon afterwards, SpaceX founder and CEO Elon Musk congratulated his “incredible team”.\nSpaceX officials said Saturday’s catch demonstrates Starship’s full reusability, crucial for rapid, low-cost recycling.\nHowever, with the first-stage booster exploding shortly after Friday’s liftoff from Texas, the company fell short of its desired double catch.\nSeparating neatly from its booster before things went awry, the upper-stage spacecraft soared into orbit and released 26 advanced Starlink satellites.\nSpaceX’s Kate Tice said its engines stopped firing too soon on the way back down. The booster’s guidance system sensed it was not in the right position and automatically initiated the watery detour and self-destruction. Engineers are still investigating the cause.\nAlthough Friday’s booster recovery failed, the company had already made three previous booster catches, validating the technique.\nNASA, which is paying billions of dollars for Starship to land Artemis astronauts on the Moon later this decade, welcomed the achievement.\n“It was almost magic,” NASA Administrator Jared Isaacman said on X.\nStarship completed 14 laps around the Earth, 265km (165 miles), outshining the previous mission’s one to two laps.\nSpaceX reported that everything on the spacecraft, including its vital heat shield, appeared to work well.\nIt was SpaceX’s 15th flight of a full-scale Starship since 2023 and its only second trip to orbit.\nStarship, a 124-metre (407ft) behemoth, is the world’s largest and most powerful rocket, intended for Moon and Mars travel.\nSpaceX expects to begin launching Starships from Florida’s Kennedy Space Center within the next few months.", "translation_ja": "", "vocab": []}, {"title_ja": "イラン戦争ライブ：イスラエル暫定政権下でもガザへの「攻撃的政策」を誓約", "title_en": "Iran war live: Israel vows Gaza ‘offensive policy’ despite caretaker status", "summary_ja": "イスラエルはガザへの「攻撃的政策」を継続する方針を表明した。ネタニヤフ政権が投票で落選したにもかかわらず、防衛相カツは「ガザが非武装化されハマスが存在しなくなる」まで攻撃を続けると述べた。直近ではイスラエル軍がハンユニスのアルマワシ地域にドローン攻撃を実施し、少なくとも1人のパレスチナ人が殺害された。", "summary_en": "Israel has pledged to continue its &#039;offensive policy&#039; on Gaza as fighting in Yemen grips the region.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/11/15/iran-war-live-israel-vows-gaza-offensive-policy-despite-caretaker-status?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: Israel vows Gaza ‘offensive policy’ despite caretaker status\nIsrael has pledged to continue its ‘offensive policy’ on Gaza as fighting in Yemen grips the region.\nPublished On 15 Nov 2026\n- At least one Palestinian has been killed and two others wounded after Israeli forces carried out a drone strike on the al-Mawasi area of Khan Younis in southern Gaza, just days after Israel fatally struck a hospital in Gaza.\n- Israel’s Defense Minister Israel Katz said the government will continue its “offensive policy” in Gaza until the beseiged Strip “is demilitarized and there is no Hamas” despite the Netanyahu government having been voted out of office.", "translation_ja": "", "vocab": []}, {"title_ja": "ポルトガルがロナウドを讃えて新たな背番号7を永続化", "title_en": "Portugal immortalises Ronaldo with a new number 7", "summary_ja": "ポルトガル代表は、クリスティアーノ・ロナウドの国際試合からの引退後、初試合で象徴的な背番号7を披露しました。同国のサッカー連盟は、ロナウドの歴史的な23年間のキャリアを記念して、この背番号を恒久的に変更することを発表しました。", "summary_en": "Portugal’s national team has lined up in Cristiano Ronaldo&#039;s number 7 in its first match since he retired from the side.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/14/portugal-immortalises-ronaldo-with-a-new-number-7?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Portugal immortalises Ronaldo with a new number 7\nNewsFeed\nPortugal immortalises Ronaldo with a new number 7\nPortugal’s national team has lined up in the iconic number 7 in its first match since Cristiano Ronaldo retired from international football. The country’s football federation also unveiled a permanent change to the number to mark Ronaldo’s historic 23-year career.\nPublished On 14 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "ダマスカス郊外で爆弾爆発、2人死亡（子ども含む）", "title_en": "Bomb rips through Damascus suburb; killing 2, including child", "summary_ja": "シリアの首都ダマスカス南部郊外ジャラマナで11月15日夜、車に仕掛けられた爆発装置が爆発し、子どもを含む2人が殺害された。内務省によると、少なくとも1人が負傷し、セキュリティ部隊が現場を封鎖して捜査を開始した。2024年12月のアサド政権崩壊後、ダマスカスと郊外では複数の爆発事件が発生しており、同国の治安情勢が不安定な状態が続いている。", "summary_en": "The explosion took place in the southern Damascus suburb of Jaramana near a factory where batteries are produced, state TV said", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/bomb-rips-through-damascus-suburb-several-people-killed/article71703052.ece", "state_media": false, "category": "社会", "full_text": "An explosive device placed inside a car in a suburb of Syria’s capital exploded on Saturday evening (November 15, 2026), killing two people and wounding at least one, state TV and the Interior Ministry said.\nThe explosion took place in the southern Damascus suburb of Jaramana near a factory where batteries are produced, state TV said. It said two people were killed and two were wounded, without giving further details.\nThe Interior Ministry said the dead included a child, adding that one person was wounded. It said security forces cordoned off the area and started an investigation.\nSeveral explosions have taken place in Damascus and its suburbs in recent months as the country’s security remains fragile nearly two years after five decades of Assad family rule ended in December 2024. Militants stormed the capital and removed then-President Bashar Assad from power.\nJaramana is home to a large community of the Druze religious minority. The suburb has faced tensions between some members of the community and Sunni Muslim Syrians supportive of the country’s current Islamist-led government.\nPublished - November 15, 2026 05:15 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "SpaceXのスターシップが軌道から帰還し、打ち上げ台のアームでキャッチされる劇的な初成功", "title_en": "SpaceX’s Starship returns from orbit and is captured by launch pad arms in a dramatic first", "summary_ja": "SpaceXのスターシップは2026年11月14日土曜日に地球に帰還し、打ち上げ地点の巨大な機械アームでキャッチされた。宇宙からの帰還キャッチは史上初で、スターシップの完全な再利用可能性を実証した。ただし前日の打ち上げ時に第1段ブースターが爆発し、目指していた二重キャッチは達成されなかった。", "summary_en": "SpaceX expects to begin launching Starships from Florida’s Kennedy Space Center within the next few months", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/spacexs-starship-returns-from-orbit-and-is-captured-by-launch-pad-arms-in-a-dramatic-first/article71703046.ece", "state_media": false, "category": "社会", "full_text": "SpaceX’s Starship made a triumphant return to Earth on Saturday (November 14, 2026), caught in midair by giant mechanical arms where its journey began 22 hours earlier.\nIt was the grand finale that Elon Musk and his team hoped for — the first-ever capture of a Starship flying back from space. But with the first-stage booster exploding shortly after Friday’s liftoff from Texas, the company fell short of its desired double catch.\nWreckage remained in the Gulf of Mexico, cordoned off by buoys, as the stainless steel, bullet-shaped spacecraft lowered itself upright at the launch pad.\n“Can you believe it?” shouted SpaceX commentator Dan Huot.\nSpaceX officials said Saturday’s catch demonstrates the full reusability of Starship, intended for moon and Mars travel. Although Friday’s booster recovery failed, the company had already made three previous booster catches, validating the technique.\nNASA welcomed Saturday’s news. The space agency is paying billions of dollars for Starship to land Artemis astronauts on the moon later this decade and help build a permanent lunar base. Musk’s ambitions are even grander: He wants to launch a fleet of Starships to build a city on Mars.\nThe world’s largest and most powerful rocket — a 407-foot (124-metre) behemoth — blasted off late Friday afternoon from SpaceX’s Starship base near the U.S.-Mexican border. Separating neatly from its booster before things went awry, the upper-stage spacecraft soared into orbit and released 26 advanced Starlink satellites.\nStarship continued circling the world 165 miles (265 kilometres) up, with live views of itself and Earth streaming down via Starlink. The spacecraft completed 14 laps around Earth, outshining the previous mission’s one to two laps.\nIt was SpaceX’s 15th flight of a full-scale Starship since 2023 and its only second trip to orbit.\nSpaceX reported that everything on the spacecraft, including its vital heat shield, appeared to work well.\nAs for the booster, SpaceX’s Kate Tice said its engines stopped firing too soon on the way back down. The booster’s guidance system sensed it wasn’t in the right position and automatically initiated the watery detour and self-destruction. Engineers are still investigating the cause.\nSpaceX expects to begin launching Starships from Florida’s Kennedy Space Center within the next few months. That is the starting point for NASA’s next Artemis mission, which will skip the moon and remain in orbit around Earth for lunar lander practice.\nArtemis III’s four astronauts will attempt to dock their capsule with not only Starship but also Blue Origin’s Blue Moon. The two companies will take turns delivering crews to the lunar surface. NASA is targeting as soon as 2028 for Artemis IV, humanity’s first moon landing since the Apollo era more than half a century ago.\nPublished - November 15, 2026 04:01 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ジェンセン・ファン | AI業界の雨乞い師が窮地に", "title_en": "Jensen Huang | AI rainmaker meets his Waterloo", "summary_ja": "Nvidia共同創設者のジェンセン・ファン氏が、中国実業家アリス・ファン氏との不倫関係が発覚し、その後さらにNvidiaのヘルスケア部門責任者キンバリー・パウエル氏との関係も報道された。これらのスキャンダルにより、同氏は自ら創業したNvidiaのCEO職から辞任を余儀なくされた。", "summary_en": "The Nvidia chief’s abrupt exit marks a stunning fall from grace for the man who built the hardware foundation of the AI revolution, forged deep ties with Silicon Valley’s tech leaders and expanded the company’s reach across every layer of the AI stack", "source": "The Hindu", "tier": "paper", "link": " 治支援グループ「As Tinubu and Mbah Move（ATM）」を正式に設立しました。このグループはテクノロジーと革新を基盤とし、デジタルツールを活用して有権者の動員、草の根での活動監視、およびエヌグ州の4,145投票所での選挙活動を追跡します。ムバ州知事はこのイニシアチブを称賛し、グループのメンバーに地域社会から投票所まであらゆるレベルで支援活動を展開するよう促しました。", "summary_en": "The political support group, As Tinubu and Mbah Move (ATM), is to mobilise support for the re-election of President Bola Ahmed Tinubu, Enugu State Governor Peter Mbah and other All Progressives Congress (APC) candidates in the 2027 general elections. The post 2027: Udeh unveils ATM support group for", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/925210-2027-udeh-unveils-atm-support-group-for-tinubu-mbah-apc-candidates.html", "state_media": false, "category": "政治", "full_text": "Minister of Innovation, Science and Technology, Dr Kingsley Udeh, on Saturday officially inaugurated a political support group, As Tinubu and Mbah Move (ATM), to mobilise support for the re-election of President Bola Ahmed Tinubu, Enugu State Governor Peter Mbah and other All Progressives Congress (APC) candidates in the 2027 general elections.\nThe group, which is anchored on technology and innovation, is expected to deploy digital tools to mobilise voters, monitor grassroots engagement and track its membership and electoral mobilisation activities across the 4,145 polling units in Enugu State.\nSpeaking at the inauguration, Governor Mbah commended Udeh for the initiative, describing its technological approach and grassroots mobilisation strategy as important complements to the existing political structures of the APC in the state.\nMbah, who expressed excitement over the large turnout at the event, urged members of the group to extend the enthusiasm generated by the inauguration to communities, villages, kindreds, families and polling units across the state.\nHe said the support group’s effectiveness would be measured not by the crowd at its inauguration but by its ability to translate the energy into grassroots mobilisation and electoral support.\n“ATM, this heat, this energy must go beyond this inauguration hall. You must take this energy to our streets, villages, polling units, kindreds and families,” he said.\nThe governor urged members to convince voters through visible development projects and the achievements of his administration, including Smart Green Schools, the International Conference Centre, Presidential Hotel, International Hospital and other infrastructure projects.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nOn President Tinubu’s re-election bid, Mbah described the President as a unifier, arguing that his administration’s economic reforms and infrastructure investments had laid the foundation for national growth and shared prosperity.\nHe said the President’s decision to remove fuel subsidy and unify the foreign exchange regime demonstrated the political courage required to address longstanding structural challenges in the Nigerian economy.\nAccording to him, although the reforms initially imposed difficulties on citizens, they were necessary to restore macroeconomic stability, rebuild confidence in the economy and attract private capital and foreign investment.\nMbah argued that sustained economic reforms were necessary to translate the emerging growth trajectory into employment opportunities and improved living conditions for Nigerians.\nHe also highlighted the Federal Government’s infrastructure interventions in the South-East, particularly the improved Enugu-Onitsha highway, the ongoing Enugu-Port Harcourt Expressway project and the concessioning of the Akanu Ibiam International Airport.\nThe governor said the airport concession would strengthen the South-East’s economic competitiveness, particularly with the planned commencement of cargo operations and direct flights between Enugu and Guangzhou, China, before the end of the first quarter of 2027.\nHe maintained that the region stood to benefit significantly from the expansion of its aviation and cargo-handling capacity, given the volume of goods currently transported by road from Lagos to the South-East.\nOn the political implications of the 2027 elections, Mbah urged the people of the South-East to adopt a strategic approach to national politics, stressing the importance of building political alliances beyond the region.\nHe recalled the political alignments of the First and Second Republics, particularly the alliances involving Dr Nnamdi Azikiwe and Dr Michael Okpara, as examples of how political cooperation across regional boundaries could advance the interests of the Igbo.\nThe governor argued that supporting Tinubu’s re-election would provide the South-East with an opportunity to strengthen its political relevance and deepen its participation in national governance.\nHe cautioned APC members against complacency, despite the party’s dominance of the state’s political structures, urging them to campaign vigorously as though they were the underdogs.\nMbah disclosed that the group would complement the party’s existing structures across the state’s 4,145 polling units, adding that its digital monitoring platform would provide a verifiable picture of grassroots mobilisation.\nHe also urged eligible voters who had yet to collect their Permanent Voter Cards (PVCs) to do so and mobilise for the January 16, 2027, presidential and National Assembly elections, as well as the February 6, 2027, governorship and State Assembly polls.\nThe governor, however, stressed that the administration’s development agenda remained a work in progress, noting that the presence of poverty, inadequate electricity supply, water challenges and unpaved roads in s", "translation_ja": "", "vocab": []}, {"title_ja": "人権団体、DSS長官アジャイ氏の『リーダーシップ勇気賞』受賞を称賛", "title_en": "Rights group hails DSS Director General, Ajayi, over The Sun ‘Courage in Leadership Award’", "summary_ja": "公共誠実センター（CPI）は、国家情報局（DSS）長官のオルワトシン・アジャイ氏が『ザ・サン』紙から『リーダーシップ勇気賞』を受賞したことを歓迎する声明を発表しました。CPIはアジャイ氏の受賞を、立憲主義と民主的説明責任を重視した制度改革への国家的評価と位置づけています。同氏の指導下で、DSSは法の支配を尊重し、違法逮捕や長期拘留の被害者への補償金支払いなど、前例のない制度的成熟さを示していると述べられています。", "summary_en": "The group commended the Service’s new era of rule-of-law compliance, judicial respect, and victim compensation, adding that the honour has validated modernisation of Nigeria’s intelligence architecture The post Rights group hails DSS Director General, Ajayi, over The Sun ‘Courage in Leadership Award", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/925208-rights-group-hails-dss-director-general-ajayi-over-the-sun-courage-in-leadership-award.html", "state_media": false, "category": "政治", "full_text": "The Centre for Public Integrity (CPI) has extended its warmest felicitations to the Director-General of the Department of State Services (DSS), Mr Oluwatosin Ajayi, following his prestigious conferment with The Sun ‘Courage in Leadership Award.’\nIn a statement issued in Abuja on Saturday and signed by its Executive Director, Comrade Job Samuel Danfulani, the organization described the honour as a fitting national validation of Mr Ajayi’s ongoing institutional reforms, which have redefined secret service operations in Nigeria through strict adherence to constitutionalism, professionalism, and democratic accountability.\nAccording to the Centre, the award underscores a pivotal paradigm shift within the nation’s premier domestic intelligence agency since President Bola Tinubu appointed Mr Ajayi as DG.\n“This recognition by The Sun is not merely ceremonial; it is an objective verdict on a leader who has demonstrated the rare courage to modernize a critical security institution from within, and President Tinubu’s penchant for appointing the right people,” the statement read.\n“Mr Ajayi has successfully steered the DSS away from traditional strong-arm perceptions toward a sophisticated, intelligence-driven, and citizen-respecting agency.”\nHighlighting the hallmarks of the current administration, the CPI noted that the DSS has recorded remarkable operational milestones in neutralizing complex security threats, dismantling transnational arms syndicates, and preempting asymmetric attacks through covert, surgical intelligence gathering.\nMore importantly, the group applauded the Service’s unprecedented respect for the rule of law and judicial authority—a development it described as a watershed moment in Nigeria’s democratic evolution.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“For the first time in recent memory, Nigerians are witnessing a secret police leadership that actively submits its operations to the crucible of legal due process,” the group stated.\n“Under Mr Ajayi’s watch, the Service has not only secured a string of landmark judicial victories through diligent, evidence-based prosecution, but has also exhibited remarkable institutional maturity by obeying court orders, reviewing past operational excesses, and ensuring the payment of court-mandated compensations to citizens previously affected by wrongful arrests or prolonged detention.”\nThe Centre emphasized that pairing ruthless efficiency against enemies of the state with genuine empathy and restitution for innocent citizens represents the gold standard of modern intelligence leadership. By strengthening inter-agency synergy, opening constructive channels with civil society and the media, and prioritizing personnel welfare, the DG has elevated the DSS into a formidable pillar of national stability.\nWhile urging Mr Ajayi to view the accolade as an inspiration for greater national service, the Centre called on\nother heads of security and law enforcement agencies to emulate his template of transparent, accountable, and rights-based leadership.\n“We congratulate the Director-General on this well-deserved feather d it as its full Member. A gluttonous Moroccan monarchy would not accept the decision of the African people and on 12 November, 1984, worked away.\nAfter 33 years of wandering about and being rejected by the European Union, it returned on 31 January, 2017 like a prodigal son. Unfortunately the AU did not sufficiently interrogate Morocco but simply accepted it as a lost son. Now, that Morocco has repudiated the peace agreement and wants to colonise Western Sahara by force of arms, it is clear that the Moroccan establishment, had ulterior motives.\nAlso, Africa had not been critical of the United Nations, believing that its offer of peace which led to the establishment of MINURSO was genuine. The UN which is now pretending to be working for peace, has repudiated one of its basic principles in order to pamper Morocco and its Western backers. The UN Resolution 1514 of 1960 had proclaimed that: “All peoples have the right to self-determination; by virtue of that right they freely determine their political status and freely pursue their economic, social and cultural development.”\nIn line with this, the UNSC on 9 April 1991, passed Resolution 690 directing that a referendum be held in Western Sahara. Today, 35 years later with Morocco refusing to allow the referendum, the UNSC has rather than uphold its resolution, cancelled the referendum and, decided that only Morocco’s dubious plan in which Western Sahara will be ruled by King Mohammed VI, would prevail. This leaves our Sahrawi brothers and sisters with little or no alternative but to return to armed struggle.\nOn the other hand, this has sent the Moroccan establishment into celebratory mood. The Moroccan Monarchy celebrated with what it called “Unity Day” It declared that: “A 35-year chapter has now come to a close. Rooted in an anachronistic and outdated context, this Mission (MINUSO) has long served as a tool for internationalising the regional dispute concerning the Kingdom of Morocco’s legitimate recovery of its Saharan provinces.”\nOn the other hand, Western Sahara warned that it is willing to completely abandon the peace negotiations. The Representative of the Polisario Front to the UN, Sidi Mohamed Omar warned that if the UN draft is: “approved without substantial and significant modifications, the Polisario Front will have no choice but to withdraw from the entire peace process.”\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAmbassador Mike Waltz, US Representative to the UN in endorsing the end of the UN peace mission asked: “each of the concerned parties to negotiate a lasting peace.” He added: “Under President Trump’s leadership, the United States has done more for peace in Western Sahara this year than in decades.”\nChina had warned the UNSC against what it considered a one-sided approach to the Western Sahara issue.\nAlgeria which has for decades given political, moral and material support to the Sahrawi including granting them shelter in its Tindouf region, pointed out that the: “tragedy being endured by the Sahrawi people has oddly been diluted to the concept of refugee populations” It pointed out the well known fact that the Polisario Front is the legitimate representative of the Sahrawi and decried the: “failure of this Security Council”.\nThe UN Secretary-General António Guterres in his usual double speak, said ending the peace mission: “does not abrogate” the Saharawi people’s “inalienable right to self-determination” He called on all parties: “to respect and promote the rights of the people of Western Sahara.” The question is why has this not been respected for the nine years he has been in office? With the planned departure of MINURSO, he asked all: “to respect and promote the rights of the people of Western Sahara.” So, why is it that even with MINURSO, those rights are not respected. How does he expect King Mohammed IV who rules by decree even over Moroccans, to respect the fundamental rights of the Saharawi?\nTragically, the African Union whose founding Member is about being recolonised, has kept mute. If war breaks out again between Morocco and the Saharawi people, it is Africa that will ", "translation_ja": "", "vocab": []}, {"title_ja": "「世代間の衝突」がヨーロッパの抗議活動を加速させている", "title_en": "A ‘Generational Clash’ Is Fueling Europe’s Protests", "summary_ja": "高齢者の平均寿命が延びるにつれて、政府は年金支出を増やす必要があります。これにより他の公共サービスへの予算配分が難しくなり、フランスで起きているような抗議活動を引き起こしています。政府の財政負担と世代間の利益の衝突が、ヨーロッパ全域で深刻な社会問題となっています。", "summary_en": "As retirees live longer, governments need to spend more on pensions. That makes it harder to fund other services, spurring protests like those in France.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/14/world/europe/student-protests-pensions-generations.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「ロンドンに焦点を当てろ」：イランの工作員がヨーロッパの標的を攻撃した方法", "title_en": "‘Get Focused on London’: How Iran’s Agents Attacked European Targets", "summary_ja": "春季にイギリスおよびヨーロッパ各地で発生した一連の暴力事件がヨーロッパ全域に恐怖をもたらした。検察当局は、イランがどのようにして米国の同盟国を標的にしたのかについて新たな証拠を提示している。", "summary_en": "A wave of assaults in Britain and elsewhere in the spring sowed fear across Europe. Prosecutors shed new light on how Iran took aim at U.S. allies.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/13/world/europe/iran-attacks-europe-britain.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナのスターシールドアクセスが再び制限されている、ゼレンスキー大統領が主張", "title_en": "Ukraine’s Starshield Access Is Being Restricted Again, Zelensky Says", "summary_ja": "ウクライナのゼレンスキー大統領は、ドローンの誘導に使用されるスターシールドシステムがロシア占領地域上空で制限されていると述べた。開発元のスペースXはこの主張を否定している。", "summary_en": "President Volodymyr Zelensky said the system, which Ukraine uses to guide drones, was being throttled over Russian-occupied st", "tier": "paper", "link": "https://www.economist.com/international/2026/11/10/global-bullies-have-turned-uncertainty-into-a-weapon", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2027年大統領選挙：『フランス国民は進歩への信頼を次々と失っている』", "title_en": "2027 presidential election: 'French people are increasingly losing faith in progress'", "summary_ja": "ル・モンド紙とのインタビューで、歴史家エルヴェ・ル・ブラは、伝統的な指標を失い排除されていると感じるフランス国民の一部が、現在のエリート層を退け、国民に中心的役割を取り戻させる権威主義的政府を支持する可能性があると説明している。", "summary_en": "In an interview with Le Monde, historian Hervé Le Bras explains how a segment of the French population, losing its traditional bearings and feeling excluded, could push aside the current elites in favor of an authoritarian government that would give the people back a central role.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/11/14/2027-presidential-election-french-people-are-increasingly-losing-faith-in-progress_6780952_7.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "黒人男性への警察による暴力事件の裁判：目撃者は「介入しなければミシェルは死ぬ」と信じていた", "title_en": "Trial of French police beating of Black man: Witnesses believed 'if we don't intervene, Michel will die'", "summary_ja": "2020年に音楽プロデューサーがスタジオの地下室で3人の警察官に暴力を受けた事件の裁判が開かれている。現場にいた5人の若者が被害者として参加し、目撃した暴力行為と今なお続く心理的外傷について証言した。証人たちは、介入しなければ被害者のミシェルが死ぬと信じていたと述べている。", "summary_en": "Five young men who were the music producer's studio basement when he was beaten by three police officers in 2020 have joined the trial as plaintiffs. They testified in court about the violence they suffered and the trauma they still feel.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/11/14/trial-of-french-police-beating-of-black-man-witnesses-believed-if-we-don-t-intervene-michel-will-die_6780886_7.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vo ": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "これは『ストレーツ・タイムズ』のモーニング・ブリーフィングニュースレターです。読者は『ストレーツ・タイムズ』から複数の無料ニュースレターに登録できます。購読の管理はウェブサイトから行うことができます。", "summary_en": "Morning Briefing muthuramans Wed, 02/07/2024 - 15:18 If this e-mail is not displayed properly, click here. SUNDAY, NOV 15 2026 Sign up for more free newsletters from The Straits Times here . Manage subscription here .", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "右翼活動家がアイゼンコット元司令官の自宅外でハアレツ紙の報道カメラマンを暴行", "title_en": "Right-Wing Activists Assault Haaretz Photojournalist Outside Eisenkot's Home - Haaretz", "summary_ja": "ハアレツ紙の報道カメラマンが、イスラエル元参謀総長ガディ・アイゼンコット氏の自宅外で右翼活動家から暴行を受けた。この事件は、イスラエル国内の政治的緊張と報道の自由に関する懸念を浮き彫りにしている。", "summary_en": "Right-Wing Activists Assault Haaretz Photojournalist Outside Eisenkot's Home Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMioAJBVV95cUxObzV0MHF4LVhpelRvV1NyZGJNY0w4WUFiT0NxNXJ3bHlCZEZhenF0dy1udVNIZUdFUnFBNWVtU3g0MGZNOTNCNlNOdjNwUFZqZ2FlOFBvYUxrX2dESFhFV3RwRlB2NVhBRGZhX2liY3VRWkRGc3o0R2xCRXoyWEtpQTBHSWpzSEVVR3JKVU5tMGVCc1lobXgtUWJ1ZDBHNXMwTHROSzZtb09oU2tHeThSb3ZZZzgzYWRiLTEzRTkzOVlwZ1l5RVozMmhITU4wb2NkMi13a3NyQW1vOGxaUXpFbTZNY2JiakdCVjBWQmFubzI1VmF5RE1STkk3RE1HcDRmNTN5OWxfX3FZNTZxS0MyV0FPVFRoUkItQWhIQzl4QWg?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アイゼンコット氏への説明の後、ネタニヤフ首相が前提条件なしの統一政権を呼びかけ", "title_en": "After briefing Eisenkot, Netanyahu urges unity government without preconditions - Haaretz", "summary_ja": "ネタニヤフ首相はアイゼンコット氏への説明を受けた後、前提条件を設けない統一政権の樹立を呼びかけた。この発言は、イスラエル国内の政治的分裂を超えた協力体制の構築を目指すものと見られている。", "summary_en": "After briefing Eisenkot, Netanyahu urges unity government without preconditions Haaretz", "source": "Haaretz", "tier": "paper", "lin
