.google.com/rss/articles/CBMiV0FVX3lxTE9OanV5UWwxWWx0WUlqR1ZkbkNzX3NDdHJxMlpTYzF1Mm5GQVV6aGlkZTJZcTNiNmpTNkxkSDFLam1JeEZydUMxM05nYk1kQ05DV1hwTUFzQQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "来週、季節風により気温が15℃まで低下する見通し：中央気象局", "title_en": "Seasonal winds to send mercury down to 15°C next week: CWA - Focus Taiwan", "summary_ja": "中央気象局によると、来週は季節風の影響により気温が15℃まで低下する見込みです。台湾全域で気温の大幅な低下が予想されており、防寒対策が必要になる見通しです。", "summary_en": "Seasonal winds to send mercury down to 15°C next week: CWA Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9WYnlvOUQ0cU5Lam04a0ZoUjlRZlNqRUdQdmhsbFM1SHUxaVdIUUY0VnNZNE9IMXR2LUdfZnJaTGkySjVyVk1DLUtNYW9CS1luZkFOcGJ3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、東部沿岸での無線衝突後に中国船舶を監視", "title_en": "Taiwan monitors Chinese ships after radio clash off eastern coast - Focus Taiwan", "summary_ja": "台湾は東部沿岸で中国船舶との無線通信上の対立が発生した後、当該船舶の監視を強化している。この事案は両国間の海上での緊張関係を反映するものである。台湾当局は引き続き情勢を注視している。", "summary_en": "Taiwan monitors Chinese ships after radio clash off eastern coast Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE10dE5wS1M0U2Vfd1Q5cmV4ZEhid3pZS1A0RzhpMzlJT3B3N18xcm9fSG9UTEhTWXNTRW9aRlVtMldNM2hjWWZXdVRTMGJXYWhUUUJvR01MOA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国、深圳会議でのAPEC首脳宣言に期待", "title_en": "China looks to APEC leaders' declaration at Shenzhen meeting", "summary_ja": "CGTNは、第33回APEC経済首脳会議が中国南部の深圳で11月18日から19日にかけて開催されると報じています。会議では、参加国首脳による共同宣言の発表が予定されています。", "summary_en": "The 33rd APEC Economic Leaders' Meeting will be held in Shenzhen in south China from November 18 to 19.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-13/China-looks-to-APEC-leaders-declaration-at-Shenzhen-meeting-1S2u2xsPhSw/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブストリーム配信がブラジルのダブル11セールを活性化", "title_en": "Live streams light up Double 11 sales in Brazil", "summary_ja": "CGTNが報じるところによると、ライブストリーム配信がブラジルでのダブル11（11月11日）セールを大きく盛り上げているとのことです。オンライン販売イベントにおいて、動画配信を通じたリアルタイムショッピングが消費者の購買意欲を高める重要な役割を果たしているとされています。", "summary_en": "Live streams light up Double 11 sales in Brazil", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-11-12/Live-streams-light-up-Double-11-sales-in-Brazil-1S03KLQ3l6M/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "COP31、中国の緑色発展に関する英語報告書を発表", "title_en": "COP31 unveils English report on China's green development", "summary_ja": "CGTNが報じるところによると、COP31は中国の緑色発展に関する英語報告書を発表した。本報告書は、中国の環境保全と持続可能な発展への取り組みについての情報を国際社会に提供するものである。", "summary_en": "COP31 unveils English report on China's green development", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-11/COP31-unveils-English-report-on-China-s-green-development-1RZai5JXvJ6/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "キエフ軍、過去24時間でドネツク人民共和国を32回砲撃 - TASS/RTが報道", "title_en": "Kiev troops bombard Donetsk People’s Republic 32 times over past day", "summary_ja": "TASS/RTが報道したところによると、キエフ軍がドネツク人民共和国に対して過去24時間で32回の砲撃を実施したとのことです。この砲撃により、民間人1名が死亡し、4名が負傷したと報道されています。", "summary_en": "A civilian was killed and four more sustained wounds", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2218237", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアの有力選手アンドレーバが2026年米国WTAファイナルズの決勝進出", "title_en": "Russia’s top racquet Andreeva through to final of 2026 WTA Finals in US", "summary_ja": "TASS/RTが報じたところによると、ロシアの選手アンドレーバはアメリカの選手ジェシカ・ペグラを破り、2026年米国で開催されるWTAファイナルズの決勝進出を決めた。", "summary_en": "The player has defeated American Jessica Pegula", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/sports/2218235", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国はロシアとヨーロッパ間のウクライナに関する直接接触を促進することを目指している—クシュナー氏", "title_en": "US aims to facilitate direct contacts between Russia and Europe on Ukraine — Kushner", "summary_ja": "TASS/RTが報じたところによると、米国特使のクシュナー氏は、トランプ大統領がロシアとヨーロッパ間の直接的な接触を促進することを目指していると述べた。同氏は、トランプ大統領が「実行可能な」紛争防止メカニズムの必要性を信じていると付け加えた。", "summary_en": "The envoy added that US President Donald Trump believes it is necessary to have \"actionable\" conflict prevention mechanisms", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2218233", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "レアアース・ゲーム", "title_en": "The Rare-Earth Game", "summary_ja": "中国はレアアースの禁輸措置を実施する可能性は低いが、その脅威を生かし続けるだろう。一方、西側諸国は完全な自給能力を達成することは難しいが、高額な生産能力の重複やストックパイルを通じてサプライチェーン危機への脆弱性を軽減しようとし続けるであろう。経済安全保障を求める大国と異なり、小国がいじめや強制に対する脆弱性を減らすための唯一の現実的な選択肢はサプライチェーンの多様化である。", "summary_en": "China will probably not impose a rare-earth embargo, but it will keep the specter of one alive. And the West will probably not achieve self-sufficiency in this critical sector, but it will keep seeking to reduce its vulnerability to a supply shock through expensive capacity duplication and stockpile", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-rare-earth-embargo-unlikely-but-us-and-eu-will-pay-a-high-price-to-prepare-for-one-by-daniel-gros-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Rare-Earth Game\nChina will probably not impose a rare-earth embargo, but it will keep the specter of one alive. And the West will probably not achieve self-sufficiency in this critical sector, but it will keep seeking to reduce its vulnerability to a supply shock through expensive capacity duplication and stockpiles.\nBERLIN—Economic security is top of mind for governments around the world. But it is mostly the largest economies, especially the European Union and the United States, that are implementing concrete measures aimed at bolstering it, whether by forcing their economic partners to alter their behavior or finding alternatives. For smaller economies, the only real option for reducing vulnerability to bullying and coercion is diversification.", "translation_ja": "", "vocab": []}, {"title_ja": "なぜ研究が重要なのか", "title_en": "Why Research Matters", "summary_ja": "著者は、研究開発が人類の生活の質を向上させ、長寿化や健康増進、革新的な発明をもたらす重要なツールであると主張している。しかし、研究開発で最も成果を上げてきた国が現在、資金削減、研究機関の閉鎖、政治化した助成金配分、大学への圧力など、研究開発を弱体化させており、その社会的コストは予想以上に深刻であると警告している。", "summary_en": "Over the past 21 months, in the country that has leveraged research to greatest effect, the government is slashing funding for it, closing centers where it is done, politicizing grant-making decisions, and bullying its single biggest engine: universities. The costs will be far greater than many real", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trump-white-house-attacks-on-research-by-peter-n-miller-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWhy Research Matters\nOver the past 21 months, in the country that has leveraged research to greatest effect, the government is slashing funding for it, closing centers where it is done, politicizing grant-making decisions, and bullying its single biggest engine: universities. The costs will be far greater than many realize.\nROME—If you learned that there was a tool that could expand your understanding of every aspect of the world you lived in, helping you lead a longer, healthier life and providing inventions that would make that life more pleasant and interesting, would you want it? Would you pay for it? Would you want your government to support it?", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカに必要な異なる形態の気候資金", "title_en": "Africa Needs a Different Kind of Climate Finance", "summary_ja": "アフリカへの気候資金の約51%が債務の形態で供給されており、これは東アジア・太平洋地域の18%、ラテンアメリカ・カリブ海地域の20%と比べて著しく高い。多国間および二国間開発金融機関が既に債務負担に苦しむ経済に対して商業金利で融資している矛盾的な状況が生じている。アフリカの気候資金の効果を最大化するには、資金供給の手段をより譲歩的な形態に変える必要がある。", "summary_en": "Roughly half of the climate finance that flows to Africa comes in the form of debt, with multilateral and bilateral development-finance institutions often lending at commercial rates to economies already struggling to carry the added costs. To maximize fiscal space, the instruments used to deliver c", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/africa-needs-less-debt-based-climate-finance-by-penelope-gregoriou-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nAfrica Needs a Different Kind of Climate Finance\nRoughly half of the climate finance that flows to Africa comes in the form of debt, with multilateral and bilateral development-finance institutions often lending at commercial rates to economies already struggling to carry the added costs. To maximize fiscal space, the instruments used to deliver climate finance need to change.\nJOHANNESBURG—Discussions about climate finance follow a familiar script: a financing gap is declared, pledges are announced, and the size of the commitments is the main concern. But the form that financing takes matters as much as the amount of money pledged, particularly in Africa.\nAccording to the Climate Policy Initiative’s most recent data, climate-finance flows to Sub-Saharan Africa reached $55 billion in 2024, more than double the 2019 level. This represents important progress. But the continent still faces several challenges.\nFor starters, the CPI’s report “Landscape of Climate Finance in Africa 2024” showed high levels of concentration, with ten countries receiving 50% of Africa’s climate-finance flows, while the continent’s ten most climate-vulnerable countries received only 10%. The difference is even starker for private climate finance, 76% of which goes to ten countries, further narrowing access to capital. Meanwhile, multilateral climate funds under the United Nations Framework Convention on Climate Change, which are meant to deliver concessional support, account for only 2% of Africa’s climate finance.\nPerhaps more importantly, the report found that as much as 51% of climate finance to Africa comes in the form of debt, evenly split between concessional and market-rate borrowing. By contrast, debt accounts for only 18% of climate finance in East Asia and the Pacific, and 20% in Latin America and the Caribbean.\nIt is also worth noting that 82% of Africa’s debt-based climate finance priced at market rates comes from official sources, mainly multilateral and bilateral development-finance institutions. The contradiction is glaring. Institutions that are supposed to support sustainable economic growth, create jobs, and improve social outcomes by financing businesses and projects deemed too risky or unattractive for private investment are lending at commercial rates to economies already struggling to carry the added costs.\nTo be sure, this is partly a response to Africa’s immense climate-finance needs, which are estimated at just under $2 trillion until 2030, of which only 23% is currently being met. But instead of continuing to rely on debt-based lending, development-finance institutions must change the instruments through which climate finance is delivered.\nAs ActionAid’s new report finds, debt is a major barrier to green investment. In 2026, 54 of the world’s most climate-vulnerable countries, many of them in Africa, will spend $304.8 billion on servicing debt, compared to $12.3 billion on climate action. That is a ratio of nearly 25 to one. While most of this debt was not borrowed specifically for climate action, servicing it still leaves policymakers with limited fiscal space for investing in such measures, with debt repayment absorbing 65% of their combined national revenue.\nThe implications for national climate plans, known as nationally determined contributions (NDCs), are profound. The climate-vulnerable countries assessed in ActionAid’s report have budgeted for only one-quarter of their combined unconditional NDC costs, with Tanzania allocating 0.9% of its unconditional NDCs costs and Malawi allocating 10.3%. Zambia has devoted just 0.32% of its budget to climate policies, highlighting the constraints debt-burdened governments face in using public finance to fund their NDCs.\nAddressing these countries’ fiscal constraints requires reporting climate finance in a way that reflects its actual worth. A loan that must be repaid with interest is currently counted the same as a grant of equivalent size, which ends up overstating how much support is reaching Africa. Reporting a loan’s concessional portion rather than its full value would provide a clearer picture. The OECD’s Development Assistance Committee uses this method to measure official development assistance.\nMoreover, the recipient country’s debt position should be taken into consideration when determining the concessionality of loans, so that countries at moderate or high risk of debt distress receive grants rather than being saddled with an even heavier burden.\nThere is also a strong case for lending in local currencies, so that borrowers are not also carrying exchange-rate risk, and mobilizing Africa’s domestic capital. Even though international sources provide 87% of Africa’s tracked climate finance, the continent has roughly $2.4 trillion in domestically managed bank, insurance, and pension assets.\nRecent domestic issuances have shown what is possible with the right regulatory frameworks and financial instruments. In February 2024, Tanzania", "translation_ja": "", "vocab": []}, {"title_ja": "企業民主党員がアイデンティティ・ポリティクスを武器化して進歩派を中傷している", "title_en": "Corporate Democrats are weaponizing identity politics to smear progressives | Arwa Mahdawi", "summary_ja": "著者は、ハレイ・スティーブンスやハキーム・ジェフリーズなどの企業民主党員が、正当な批判を避けるためにアイデンティティ・ポリティクスを意図的に悪用していると主張している。スティーブンスは性差別を主張して批判をかわし、ジェフリーズはAIPACとの関係やメディケア・フォー・オール政策への転換によって進歩派議員から懸念を買っている。著者は、こうした戦術は虚偽で偽善的であり、実際の政策や行動に関する議論を妨げていると指摘している。", "summary_en": "House members have responded to legitimate criticism with cynicism. Let’s not have another ‘Bernie bros’ moment Before we get started, some ground rules. You are, of course, completely free to disagree with everything I have to say here. However, doing so might mean that you’re racist, homophobic an", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/14/corporate-democrats-identity-politics-progressives", "state_media": false, "category": "オピニオン", "full_text": "Before we get started, some ground rules. You are, of course, completely free to disagree with everything I have to say here. However, doing so might mean that you’re racist, homophobic and/or sexist. (Not to boast, but I have a lot of oppression cards to play.) So, you might want to tread carefully, OK?\nThat might sound ridiculous, but I don’t make the rules: I’m just taking a page from the corporate Democrat playbook. From Haley Stevens to Hakeem Jeffries, cynically weaponizing identity politics to ward off reasonable criticism seems to be all the rage.\nLet’s start with the soon-to-be-irrelevant Stevens who, as you may have noticed, is an adult human female. The Michigan representative is also a sore loser who attempted to torpedo Abdul El-Sayed’s senate campaign by endorsing his Republican opponent, Mike Rogers, at the 11th hour.\nBut don’t you dare quibble with her about any of that or she’ll cry sexism. In a softball interview with conservative commentator Scott Jennings before the midterms, Stevens seemed to imply that sexism played a part in why she wasn’t invited to an El-Sayed campaign event.\n“I gave [El-Sayed] an opportunity ... to unite around something that everyone could agree on, and then I got disinvited instead,” Stevens told Jennings. “This is what happens to women.”\nStevens must have been born with an inability to experience embarrassment because, after El-Sayed won, she doubled down on this cringe weaponization of feminism. “For me, living my beliefs was never measured by who would win at the ballot box,” she posted in a lengthy essay on Twitter/X. “As a woman, I have the right to make a decision and to change my mind.”\nAs a woman, I have the right to change the subject now and move on to Hakeem Jeffries, who is expected to be the next speaker of the House.\nNot everyone is thrilled by this for a number of reasons. There is the fact that he is very chummy with Aipac (the American Israel Public Affairs Committee), for example. Not only has he received money from the group, but Aipac has publicly boasted about supporting him. And on Thursday, Jeffries refused to say whether he supported or opposed controversial efforts to integrate the US and Israeli militaries.\nJeffries also said this summer that he opposes Medicare for All, reversing his earlier position, and putting him at odds with a number of progressive Democrats who campaigned on the platform.\nHe’s been consistently hostile to the progressive faction of his party, refusing to endorse Mamdani for New York City mayor for months. And it was recently revealed that Jeffries met with Jared Kushner in private before the midterms, which did not go down very well.\n“The American people demanded impeachment!” one protester yelled at Jeffries during an event on Friday. “Your version of accountability is shaking hands with the Trump family!”\nMany progressives view Jeffries as an establishment figure who offers no hope for meaningful change and want someone less beholden to corporate interests to be speaker. Jeffries and some of his allies, meanwhile, have suggested that denying him the opportunity to become the first Black speaker in US history would be, to quote Bloomberg, “racially insensitive”.\nDuring the June congressional primaries, when a picture of Jeffries came up on the screen at a victory party for Claire Valdez, a member of the Democratic Socialists of America, the crowd yelled: “You’re next!”\n“It was very interesting to me, as observed by others, that there was almost zero diversity in that crowd,” Jeffries said in a CNN interview this week.\nI don’t know about that crowd, but there’s plenty of diversity amongst DSA-affiliated politicians. Zohran Mamdani, the first Muslim mayor of New York, is a DSA member. So are Nithya Raman and Janeese Lewis George, who just got elected as the respective mayors of Los Angeles and Washington DC. DSA members David Morales and Yousef Rabhi are going to be the next mayors of Providence, Rhode Island, and Ann Arbor, Michigan.\nIf we’re going to continue to play identity politics, I should note all six of the DSA candidates elected to the House were Black, brown, or from marginalized backgrounds. You can certainly argue that DSA supporters skew white, but painting it as some sort of racist organization, as Jeffries seems to be doing, is intellectually dishonest.\nAnd we’ve seen this craven use of identity politics to smear progressive politics before, haven’t we? It’s the Bernie bros playbook all over again.\nDespite the fact that some polls found that young women supported Bernie Sanders in greater numbers than young men in the 2016 primaries, Sanders’ supporters were portrayed as misogynistic bros. Hillary Clinton’s campaign may not have coined the term, but they leaned heavily into this bad-faith narrative.\nLet’s not have a Bernie bros 2.0 moment, please. While a petition to make the progressive Massachusetts congresswoman Ayanna Pressley the speaker of the House reached around 100,000 signatures on Friday,", "translation_ja": "", "vocab": []}, {"title_ja": "チャック・シューマーとクリス・ヴァン・ホーレンの上院議員指導部選挙が意味するもの", "title_en": "What the choice between Chuck Schumer and Chris Van Hollen for Senate leader is all about | Bernie Sanders", "summary_ja": "バーニー・サンダース上院議員は、民主党上院議員指導部選挙はシューマーとヴァン・ホーレン個人の比較ではなく、民主党の将来を決める選挙だと主張している。富豪の献金者と業界ロビイストに支配された現体制を維持するのか、それとも労働者階級中心の草の根政党へ変革するのかの選択であり、不平等、医療制度、気候変動、外交政策など根本的な改革に取り組むかどうかが問われていると述べている。", "summary_en": "This is not a personality contest. This is a debate about the future of the Democratic party The election for Democratic Senate leader between Chuck Schumer and Chris Van Hollen must be understood for what it is. This is not a personality contest. This is a debate about the future of the Democratic ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/13/chuck-schumer-chris-van-hollen-senate-leader", "state_media": false, "category": "オピニオン", "full_text": "The election for Democratic Senate leader between Chuck Schumer and Chris Van Hollen must be understood for what it is.\nThis is not a personality contest. This is a debate about the future of the Democratic party. It is a debate about whether the Democratic party remains a top-down party dominated by billionaire campaign contributors, inside-the-beltway consultants and 30-second TV ads, or whether we can transform it into a grassroots party of, by and for the working families of our country.\nThe election for Democratic Senate leader will determine whether we continue to tinker around the edges and maintain status quo policies, or whether we finally have the courage to take on enormously powerful special interests and address the unprecedented crises that we face.\nFor example:\nDo we address the issue of oligarchy, obscene income and wealth inequality, and the reality that never before in the history of our country have so few people held so much wealth and so much power?\nDo we address the issue of a corrupt campaign finance system and their Super Pacs, which enables billionaires to buy elections and undermine our democracy?\nDo we address the issue that, in the wealthiest country in the history of the world, 60% of our people live paycheck to paycheck, we have the highest rate of childhood poverty of any major country and millions of seniors are unable to retire with dignity\nDo we address the reality that our current healthcare system is dysfunctional, wildly expensive and that we are the only major country on earth that does not guarantee healthcare for all as a human right?\nDo we address the reality that artificial intelligence, the most transformative technology in history, is being pushed down our throats by a handful of big tech billionaires who couldn’t care less about the wellbeing of ordinary Americans?\nDo we address the reality that climate change is causing deadly heatwaves, massive forest fires, drought and extreme weather disturbances and will only get worse if don’t transform our energy systems away from fossil fuels and into energy efficiency and sustainable energy?\nDo we address the reality that our immigration system is broken and that we have, with ICE, a domestic army that has killed Americans in cold blood and has acted in cruel, illegal and unconstitutional ways?\nDo we address the reality that the wars in Vietnam, Iraq and the current war in Iran were based on lies and that we need to fundamentally rethink our foreign policy, including continued military funding to the extremist government in Israel?\nBottom line: whether we like it or not, our country faces some extraordinary and unprecedented crises. Do we seriously address these difficult challenges, and restore the faith of the American people that their government can improve their lives, or do we continue the same old, same old politics?\nIn large measure, that is what this Senate Democratic leadership election is all about.\n- Bernie Sanders is a US senator, and ranking member of the health, education, labor and pensions committee. He represents the state of Vermont and is the longest-serving independent in the history of Congress", "translation_ja": "", "vocab": []}, {"title_ja": "ガーディアン紙の見方：報道の自由について - 独裁者がジャーナリズムを標的にするのはそれが重要だからだ | 社説", "title_en": "The Guardian view on press freedom: authoritarians target journalism because it matters | Editorial", "summary_ja": "本論説は、エジプト、ロシア、その他の国々での記者逮捕や起訴の具体例を挙げながら、世界的に報道の自由が過去25年間で最低水準にあることを示している。著者は、権威主義的政権がジャーナリズムを弾圧するのは、質の高い報道が社会にとって極めて重要であり、独裁者にとって脅威となるためだと主張している。同時に、かつてジャーナリストの自由を擁護していた米国が今や報道機関を敵視する指導者によって率いられていることに懸念を表明している。", "summary_en": "From Cairo to Moscow to Washington, governments are turning up the pressure on media workers Lina Attalah is an influential Egyptian journalist. Yet until last month, even she was unaware of a major and concerning piece of news: her own conviction. In 2024, a court issued her a one-year sentence for", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/13/the-guardian-view-on-press-freedom-authoritarians-target-journalism-because-it-matters", "state_media": false, "category": "オピニオン", "full_text": "Lina Attalah is an influential Egyptian journalist. Yet until last month, even she was unaware of a major and concerning piece of news: her own conviction. In 2024, a court issued her a one-year sentence for “spreading false news” and running a website without a licence – which she had repeatedly sought to obtain – after trying her in absentia, even though she was in the country. Ms Attalah learned of the case only after she was separately tried in October, resulting in a large fine and an order for the closure of the Mada Masr website. She faces retrial later this month.\nMeanwhile, the entire newsroom of the fact-checking website Matsadash remain in detention weeks after authorities snatched the six journalists on charges including joining and financing a terrorist group and spreading false news. Their lawyers say that they have been tortured and forced to record fabricated confessions.\nOn Monday, Russia finally succeeded in silencing the famed Novaya Gazeta, which had spent decades battling growing repression. Six of its journalists, including Anna Politkovskaya, paid for their coverage with their lives. But the newspaper continued until, stripped of its newsroom, donation platforms and right to publish, it was forced to turn the lights off. (The separate Novaya Gazeta Europe, founded by many of its alumni, continues.)\nThese cases are part of a wider pattern. Press freedom is at its lowest ebb for a quarter of a century, Reporters Without Borders said this spring, judging more than half of the 180 countries it surveys to have “difficult” or “very serious” conditions for journalists. The rising tide of war worldwide is also increasing the pressures and dangers: the Committee to Protect Journalists recorded a new peak of 129 deaths of reporters and other media workers in 2025. Unesco said last week that almost nine out of 10 killings of journalists go unpunished.\nHigh-quality journalism has never been more necessary in a world of rising conflict, AI slop and malicious fabrications spreading on platforms run by big tech firms who barely nod to ethical responsibilities. As Ms Attalah herself has pointed out, the disappearance of professional media organisations enlarges the space for conspiracies and disinformation.\nYet while the US previously pressed the case of threatened journalists overseas, sometimes helping to ease their conditions, it is now led by a man who has called news media “the enemy of the American people”, whose FBI raided a correspondent’s home in January, and who is currently pursuing a $10bn lawsuit against the BBC. Donald Trump has also sought to dismantle federally funded organisations which were an important source of independent reporting on many repressive nations.\nThis week, an appeals court panel ruled that the administration had illegally fired the head of Voice of America. VoA, Radio Free Asia and Radio Free Europe have all struggled on thanks to dedicated staff, though hugely diminished. Recent elections in Serbia, Brazil and the US are evidence that journalism, alongside activism, can stem the erosion of democracy. Thousands of people protested in Turkey last month against Recep Tayyip Erdoğan’s media crackdown. Large parts of the public still want the truth and, against the odds, courageous journalists worldwide persist in finding it out and sharing it. That authoritarians target them so relentlessly only testifies to their importance.", "translation_ja": "", "vocab": []}, {"title_ja": "平和への最後の機会", "title_en": "La última oportunidad para la paz", "summary_ja": "著者は、過去10年間で世界が戦争を不可避なものとして受け入れるようになったと主張している。第二次世界大戦後に確立された「戦争を違法化する」という国際的な合意が、地政学的競争と多国間主義の軽視により弱体化してきたと指摘する。著者は、各国政府が戦争に反対する技術を再学習し、国際機関を強化する責任があると結論づけている。", "summary_en": "Cómo evitar otra guerra mundial.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/es/spain/pedro-sanchez-ultima-oportunidad-paz-evitar-guerra-mundial", "state_media": false, "category": "オピニオン", "full_text": "En algún momento de la última década, el mundo empezó a aceptar la guerra como algo inevitable. Las guerras de agresión, como las de Ucrania, el Líbano o Irán, aumentan y siembran horror, ruina y el temor a una confrontación global. Los gobiernos piensan cada vez más en la guerra como algo para lo que hay que prepararse y presupuestar. El gasto militar no deja de crecer, las carreras tecnológicas y armamentísticas se intensifican, y cada vez más países se plantean si deberían dotarse de un arsenal nuclear disuasorio que garantice su seguridad.\nNo hay nada más peligroso que normalizar la guerra. Supone regresar a una norma que imperó durante la mayor parte de la historia de la humanidad. La guerra era el eje vertebrador del sistema internacional. Era la vía natural por la que los Estados zanjaban sus disputas o ensanchaban su territorio a costa de vecinos más débiles.\n[Read in English here.]\nPero la inmensa devastación que produjeron las dos guerras mundiales en la primera mitad del siglo XX hizo inaceptable ese statu quo. Los países se unieron en un empeño común: que la guerra dejara de ser un instrumento legítimo de la política de Estado y pasara a ser un acto ilegal. Las guerras no terminaron en 1945, pero durante años la comunidad internacional las condenó de forma abrumadora.\nEn las últimas décadas, sin embargo, el compromiso de los gobiernos con la causa de la paz se ha debilitado. En 2003, millones de personas salieron a las calles en cientos de ciudades para oponerse a la invasión de Irak liderada por Estados Unidos. Y, aun así, la guerra siguió adelante. Iniciada a partir de premisas falsas y en violación del derecho internacional, arrasó Irak, agravó la inestabilidad regional y avivó el resentimiento y el terrorismo contra los países occidentales. Aquel conflicto marcó, además, un punto de inflexión. Desde entonces, la búsqueda de la paz ha ido retrocediendo en la agenda internacional, arrinconada por la creciente competencia geopolítica y la desatención o la indiferencia hacia los esfuerzos multilaterales que durante décadas pusieron freno a la guerra.\nEste camino conduce a una nueva guerra mundial: la catástrofe que el orden del siglo XX se propuso evitar. Ante ese futuro sombrío en el horizonte, los gobiernos deben reaprender el arte de oponerse a la guerra. Todos los países, incluido el mío, España, tienen la responsabilidad de actuar para limitar la capacidad de otros de librar la guerra y para fortalecer las instituciones internacionales que han de ser garantes de la paz.\nEl éxito de este proyecto dependerá de un multilateralismo expansivo, al que yo llamo «maxilateralismo»: una cooperación que abarque al mayor número posible de países, en lugar de limitarse a pequeñas coaliciones ad hoc. Su ambición es que la guerra resulte cada vez más inviable, incluso inimaginable. En 2003, manifestantes por toda España coreaban «¡No a la guerra!». En 2026, el mundo no puede volver a ignorarlos.\nUNA ESCALADA PELIGROSA\nLos esfuerzos internacionales por desterrar la guerra como instrumento de política nacional se remontan al Pacto Briand-Kellogg de 1928, un tratado firmado en París por 15 países, al que posteriormente se sumaron decenas más. No bastó para impedir la Segunda Guerra Mundial, pero plantó una semilla. Cuando representantes de 50 países se reunieron en San Francisco en 1945 para crear las Naciones Unidas, recuperaron el espíritu y los principios del Pacto y añadieron lo que había faltado: estructura institucional. La Carta de Naciones Unidas prohibió recurrir a la amenaza o al uso de la fuerza contra la integridad territorial o la independencia política de otro Estado. Y, a diferencia de su predecesor de 1928, respaldó esa prohibición con instituciones facultadas para hacerla cumplir.\nEn las décadas siguientes, estas instituciones levantaron un orden que castigaba las violaciones al derecho internacional e incentivaba la cooperación y la diplomacia. Al mismo tiempo, el rechazo popular a la guerra y al militarismo de la Guerra Fría cobraba fuerza en todo el mundo. Se hizo visible en la resistencia a la guerra de Vietnam y en los movimientos de masas contra las armas nucleares. El pacifismo alcanzó su punto álgido en los años noventa, cuando una sociedad civil global pujante se movilizó en defensa de causas humanitarias y Naciones Unidas tenía autoridad para abanderar una ambiciosa agenda de paz.\nHoy, sin embargo, hay más conflictos armados que en ningún otro momento desde 1946. Según el Programa de Datos sobre Conflictos de Uppsala, en 2025 hubo 65 conflictos activos con participación estatal, el doble que en 2010. Se calcula que en estos conflictos murieron 250.000 personas: la cifra anual más alta desde el genocidio de Ruanda hace más de 30 años. Cerca de 120 millones de personas en todo el mundo siguen desplazadas por la guerra.\nY lo más inquietante: las guerras de agresión, que violan la Carta de Naciones Unidas, están de vuelta. Rusia invadió Ucrania. Estados Unidos e Israel atacaron Irán. Y", "translation_ja": "", "vocab": []}, {"title_ja": "世界最後の平和への機会", "title_en": "The World’s Last Chance for Peace", "summary_ja": "著者は、過去10年間で戦争が不可避なものとして受け入れられるようになったことに警告を発している。第二次世界大戦後、国際社会は戦争を違法化することで平和を追求してきたが、2003年のイラク侵攻以降、その決意が弱まり、地政学的競争の深刻化とともに平和への取り組みが後退していると指摘している。著者は、第三次世界大戦という大惨事を防ぐため、各国が戦争を制限し国際機関を強化するための多国間協力（「マキシラテラリズム」）に取り組むべきだと主張している。", "summary_en": "How to avert a new world war.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/spain/pedro-sanchez-world-last-chance-peace-avert-world-war", "state_media": false, "category": "オピニオン", "full_text": "At some point during the last decade, the world started accepting war as inevitable. Wars of aggression, from Ukraine to Lebanon to Iran, are on the rise, bringing horror, ruin, and the specter of a wider international confrontation. Governments increasingly treat war as something to budget and prepare for. Military spending is climbing, technological and arms races are intensifying, and more and more countries are considering whether they should acquire a nuclear deterrent to guarantee their security.\nNothing is more dangerous than the normalization of war. It represents a return to a norm that persisted for most of human history, when war was the main organizing principle of the international system. Armed conflict was the natural way for states to settle disputes or enlarge their territory at the expense of weaker neighbors.\n[Leer en español aquí.]\nYet the vast wreckage of World Wars I and II in the first half of the twentieth century made the status quo unacceptable. Countries united behind an effort to turn war from a legitimate instrument of statecraft into an outlawed act. Wars did not end in 1945, but for years after they were overwhelmingly condemned by the international community.\nIn recent decades, however, governments’ commitment to the cause of peace has weakened. Millions of people took to the streets in hundreds of cities to oppose the U.S.-led invasion of Iraq in 2003, but the war proceeded nonetheless. Fought on false premises and in violation of international law, it brought destruction to Iraq, fed regional instability, and fueled resentment and terrorism directed at Western countries. The conflict also marked a turning point. Ever since, the pursuit of peace has steadily receded from the international agenda amid deepening geopolitical competition and inattention or indifference to the multilateral efforts that for decades discouraged acts of war.\nAt the end of this path lies another world war—the catastrophe the twentieth-century order was designed to prevent. With that dire future looming, governments must relearn the art of opposing war. It is the responsibility of every country, including my own, Spain, to take direct action that constrains others’ ability to wage war and to strengthen the international institutions that will serve as guarantors of peace.\nThe success of this project will depend on an expansive multilateralism that I call “maxilateralism”—cooperation that embraces as many countries as possible, rather than being limited to small, ad hoc groupings. Its ambition is to make war increasingly impractical, even unimaginable. In 2003, protesters across Spain chanted “No a la guerra!’’—“No to war!” The world cannot afford to ignore them again.\nA DANGEROUS ESCALATION\nInternational efforts to reject war as an instrument of national policy date back to the Kellogg–Briand Pact of 1928, a treaty signed in Paris by 15 countries and joined by dozens more later. It was insufficient to prevent World War II, but it planted a seed. When representatives of 50 countries gathered in San Francisco in 1945 to create the United Nations, they revived the spirit and principles of Kellogg–Briand and gave them what they had lacked: institutional form. The UN Charter prohibited the threat or use of force against the territorial integrity or political independence of another state. And, unlike its 1928 predecessor, it backed up the prohibition with institutions empowered to enforce it.\nIn the decades that followed, these institutions established an order that penalized violations and created incentives for diplomacy and cooperation. At the same time, public opposition to war was growing stronger around the world. Popular defiance of Cold War militarism was visible in worldwide resistance to the Vietnam War and in mass movements against nuclear weapons. Pacifism reached its high-water mark in the 1990s, when a vibrant global civil society mobilized to defend humanitarian causes and when the United Nations held sufficient authority to champion a sweeping peace agenda.\nToday, however, there is more armed conflict than at any time since 1946. According to the Uppsala Conflict Data Program, there were 65 active conflicts involving governments in 2025, double the number in 2010. An estimated 250,000 people died in those conflicts—the highest annual death toll in 30 years, since the Rwandan genocide. Close to 120 million people worldwide have been forcibly displaced by war.\nWorryingly, wars of aggression—which violate the UN Charter—are back. Russia invaded Ukraine. The United States and Israel attacked Iran. And as fighting continues year after year in places such as Lebanon, Sudan, and Yemen, it is becoming clear that war is being accepted as a normal occurrence.\n Nothing is more dangerous than the normalization of war.\nThere is no sign of the trend slowing down. Military budgets have surged to levels not seen in generations, at the expense of social and development spending. In the Should he sit down with Xi and Putin, he must avoid selling out European and Asian partners who will not be at the table. And given the three leaders’ headstrong personalities and competing national interests that pit the United States against what Xi calls a “no limits” partnership between China and Russia, the meeting might ultimately yield little progress on major issues.\nNevertheless, Trump would be right to join a summit with Xi and Putin. No U.S. president has ever held a trilateral meeting with the leaders of China and Russia, and the proposed talks would break the ice and begin to normalize much-needed dialogue. Authoritarianism is not going away, so autocracies and democracies must learn not only to live comfortably alongside one another but also to work together to tame geopolitical rivalry and tackle global challenges in an interdependent world. Americans will not find it easy to get along with the likes of Russia and China, whose political systems threaten the U.S. commitment to spreading democracy. But Trump is taking a bold step in the right direction by engaging with the heads of the world’s leading autocracies.\nIf he meets with Xi and Putin, Trump should aim low and focus on making meaningful, if limited, progress on a small number of core issues that could benefit from a three-way conversation: the flash points of the Korean Peninsula, Ukraine, and Iran, as well as arms control and strategic stability. But even if the summit yields no concrete results, it will nonetheless have been worthwhile. Trump, Xi, and Putin are paving the way for their successors to advance great-power cooperation across ideological lines and stabilize a fragmented world.\nCONCERTED EFFORT\nI have argued previously, including in a 2021 Foreign Affairs essay with Richard Haass, that a global concert—an informal steering group of great powers modeled on the nineteenth-century Concert of Europe—offers the best hope of curbing geopolitical competition and enabling collective action in a multipolar world. In addition to the United States, China, and Russia, a new concert would include India, Japan, the European Union, and representatives from Africa, Latin America, the Middle East, and Southeast Asia. Concerts sacrifice representation for efficacy and give only the geopolitically influential states that must be there a seat at the table. They set aside ideological differences and bring democracies and autocracies together to focus on international cooperation. Because concerts eschew binding, enforceable procedures in favor of informal consensus building, they can succeed when formal institutions such as the UN Security Council are paralyzed and when the United States wavers in its commitment to rules-based multilateralism.\nBut the time has not come for a global concert. Concerts function effectively only when their members are committed to the territorial status quo, are willing to exercise strategic restraint and pursue mutual benefits, and are ready to settle disputes diplomatically. Putin’s 2022 invasion of Ukraine and Xi’s decision to back Russia have, for now, scuttled hopes that the great powers will normalize restraint and the peaceful settlement of disputes. Meanwhile, Trump’s “America first” statecraft shuns joint action and mutual gain in favor of unilateralism.\nYet even though Trump, Xi, and Putin are the wrong leaders at the wrong time to establish a great-power steering group that other major players would eventually join, Trump’s iconoclastic diplomacy sets a useful precedent. His Alaska summit with Putin last year and two summits with Xi this year were admittedly long on pageantry and short on substance. But by taking the controversial step of pursuing joint talks with the two leaders, Trump is widening the diplomatic Overton window and expanding what is politically ", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-15 00:25 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
