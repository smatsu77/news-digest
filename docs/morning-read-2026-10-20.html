-in-law Jared Kushner, another key envoy, took part in the meeting via video link.\nA US official later described the talks as \"very productive and constructive\", saying there was a \"strong alignment at the working level\" among the US, Ukraine and Europe on \"the next steps\".\nThe official confirmed that Witkoff is due to meet President Vladimir Putin in Russia tomorrow to discuss the proposals and that Kushner will again participate virtually.\nPutin is yet to publicly comment on the latest developments, but Foreign Minister Sergei Lavrov earlier said the Kremlin would listen to what Wiktoff would offer, while ruling out \"any political concessions\".\nRelations between Ukraine and the US have soured in recent weeks to the extent that Trump has said it is time for Ukraine to get a new president, and most recently \"for somebody else to negotiate on behalf of Ukraine\".\nAhead of next month's US midterm elections, Trump has also sought to blame Ukraine's attacks on Russian oil refineries for fuel prices which have been rising since the start of the US-led war on Iran.\nSpeaking after Zelensky's news conference in Oslo, Trump again told reporters at the White House he wanted Kyiv to \"make a deal\". He said Russia would like to \"get it done\" and it was \"time for Ukraine to end this war\".\nPutin launched a full-scale invasion of Ukraine in 2022, and Moscow currently controls about 20% of Ukrainian territory.\nRussian drone attacks continued on Tuesday. Ukrainian officials said at least 10 people were killed - four in Kyiv and the capital region, another four in the eastern Donetsk region, and two in the central city of Dnipro.\n- Trump and Zelensky appear at loggerheads despite Oslo optimism \n  - Published3 hours ago\nAddressing the issue of US intelligence sharing after Tuesday's talks, Zelensky said he was \"thankful that intelligence works now\".\n\"Speaking about early warning, which is very important for our people, our children, adults, civilians because we can hear when ballistic[s] is coming - so we are thankful to American side, now it works, it's great,\" the Ukrainian president said.\nHe said he also hoped for a good result on SpaceX's Starlink satellite access as well, after Ukraine's military had reported in recent days speed restrictions on the US platform used by Kyiv to carry out drone strikes against Russia.\nBefore the Oslo talks, Zelensky said he had had a \"constructive discussion\" with Rubio about the need for US early warnings, missile interceptors and Starlink.\nLast week, a bipartisan group of US senators called for an urgent investigation into speed restrictions to the Starlink network in Ukraine.\nAnd Zelensky also restated that Ukraine was \"ready for negotiations\" to end the war.\n\"Of course, we are not losing this war, but we are losing people because Russia attacks,\" he said.\nThe Ukrainian leader added that \"strong\" security guarantees for Ukraine were also discussed in Oslo, as well as energy ceasefire proposals.\nNorwegian Prime Minister Jonas Gahr Støre, who also took part in the talks, stressed that Europe \"needs to be at the table\" during any discussions about how to end the Russia-Ukraine war.\nUnconfirmed reports earlier on Tuesday said the transfer of more US-made Patriot interceptor missiles - the only effective weapon in shooting down Russian ballistic missiles - had not yet been approved.\nRubio, who is currently on a visit to India, admitted to reporters that it may be true that Patriot interceptors had not yet arrived in Ukraine - but he stressed that nothing had been denied to Kyiv intentionally.\nEuropean leaders meanwhile have expressed concern about recent US statements from the US towards Russia.\nOn Monday, German Chancellor Friedrich Merz spoke of \"mixed pictures and messages\" on the war, adding that he was trying to convince the American government \"in total that this is something we have to resolve jointly\".\n\"It's really a big effort for our budgets, it's really a big thing for the European Union, but we are doing that and we are trying to keep on doing that until this terrible war end", "translation_ja": "", "vocab": [{"word": "withholding", "definition": "情報や支援などを意図的に提供しないこと。ここではアメリカがウクライナに重要な情報を与えていないという非難を指す。"}, {"word": "envoy", "definition": "特定の任務を帯びて派遣される特使や使者。外交交渉などに当たる政府の代表者を意味する。"}, {"word": "alignment", "definition": "立場や目標などが一致・調和していることを指す。ここでは米国、ウクライナ、ヨーロッパの方針が一致していることを表す。"}, {"word": "concessions", "definition": "交渉において相手に譲歩・譲歩すること。政治的または経済的な譲り合いを意味する。"}, {"word": "soured", "definition": "関係が悪くなる、冷え込むという意味。元々は牛乳が酸っぱくなることから比喩的に使われる。"}]}, {"title_ja": "Marseille braces for more unrest after protests give way to 'apocalyptic' disorder", "title_en": "Marseille braces for more unrest after protests give way to 'apocalyptic' disorder", "summary_ja": "France's second city saw some of the worst violence as chaos gripped the country on Saturday.", "summary_en": "France's second city saw some of the worst violence as chaos gripped the country on Saturday.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm5ynkk570pno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Marseille braces for more unrest after protests give way to 'apocalyptic' disorder\n- Published\nThunder and lightning have boomed across Marseille following the weekend's mayhem, illuminating the cracked windows and boarded-up doors of hundreds of businesses that were smashed as protests gave way to disorder.\nFrance's second city saw some of the worst violence as chaos gripped the country on Saturday. Local business leaders say more than 500 premises were damaged, and the majority looted.\nA police union boss told the BBC that the weekend had been an \"apocalyptic\" hell for his colleagues. 118 officers were injured, representing more than a tenth of the national figure.\nSo far, 101 arrests have been made in the port city, a quarter of them children.\nBut by Monday, it was police who were most conspicuous on the city's streets, not protesters. For eight hours, demonstrations and gatherings were banned in an effort to avoid a third consecutive day of disorder.\n- Suspect arrested after historic town hall set alight - French media \n  - Published2 hours ago\nIt seemed to work; the largest central gathering we witnessed was a posse of weather-beaten tourists trudging around the quayside.\nNonetheless, an overnight curfew for minors will come into force in parts of the city from Tuesday evening. An overnight curfew in parts of Paris, which came into force on Monday, has also been extended.\nMarseille is one of France's most ethnically diverse cities – a place where generations of new arrivals have landed.\n18-year-old student Maryame only arrived in the southern city a few weeks ago, albeit from the countryside not too far away.\n\"It was very scary because it's my first time in a big city, and also my first time demonstrating,\" she said.\nMaryame said violence engulfed the student demonstration her friends had joined as looters began attacking shops.\nShe said the solidarity of the earlier march was \"beautiful\" and the subsequent disorder \"terrifying\", but went on to say that she was conflicted as to whether even more violence would make the government sit up and listen.\n\"It is a very complicated question if violence is legitimate,\" she began.\n\"But the thing is, France, our history is really based on revolution, and sometimes we really have to make a really big impact.\n\"Sometimes it goes too far.\"\n'An unheard-of level of violence'\nFor the police, the extent to which order disintegrated was a shock, according to one organisation representing rank and file officers.\n\"It was a war,\" said Arnaud Blaise from the UN1TE police union. \"An unheard-of level of violence. Unprecedented.\"\nLooting was reported across the city centre, including along La Canebière - Marseille's equivalent of Paris's Champs-Élysées - Rue Paradis, and at the Centre Bourse shopping centre. Businesses were also hit further afield, such as in the Grand Littoral and Le Merlan shopping malls to the north.\nBlaise said he was concerned that future protests could follow the same destructive pattern as Saturday, with young people from the deprived northern suburbs seizing the opportunity to steal amid chaos that, in his view, was stirred up by far-left agitators - referred to in France as the Black Bloc.\n\"The Black Blocs provoked, and the youngsters took advantage to start looting,\" Blaise said. \"That created chaos, with police officers running right, running left, and in effect, we got overwhelmed.\"\nI put it to Blaise that the police had been accused of heavy-handedness with peaceful students but sitting back as the most violent protesters pillaged local businesses.\n\"That is not the case at all,\" he replied, arguing that more police than students had been injured.\n\"Four thousand tear gas grenades were fired and then we ran out of ammunition. So at a certain point, you have no choice but to retreat.\"\n- Watch: Shops looted and restaurants gutted in Paris riots \n  - Published1 day ago\nFrance's Interior Minister Laurent Nuñez - whose resignation in the wake of the riots was rejected by President Macron - travelled to Marseille on Monday evening.\nHe came to the City Hall, which was briefly occupied by protestors on Saturday, and met Marseille's Socialist Mayor Benoît Payan.\nPayan said he wanted answers from the government as to how the chaos was allowed to happen.\n\"Order was lost, and an attempt was made to restore order. I believe that from start to finish, it was a fiasco,\" he said on Monday.\nHe said under-staffed and poorly deployed police needed to change their tactics.\n\"If there isn't a radical change of approach on this issue - if, by chance, the only target remains high school students - then we will see looting scenes again.\"\nHe continued: \"I don't know what's left to loot in Marseille, but for the little that remains, it will be looted.\"\nWhile the ban on public gatherings in Marseille and partial overnight curfews in other French cities have brought some temporary calm, more demonstrations are planned for the weekend.\nAt a smashed out tram stop, 79-year-old grand", "translation_ja": "", "vocab": [{"word": "apocalyptic", "definition": "非常に悪い状況や破壊的な状況を表現する形容詞。通常、終末的な規模の災害や混乱を指す。"}, {"word": "conspicuous", "definition": "目立つ、明らかに見える、という意味の形容詞。存在が顕著で注目を集めやすい状態を表す。"}, {"word": "engulfed", "definition": "完全に包み込む、取り囲むという意味の動詞。何かが周囲から完全に覆われた状態を描写する。"}, {"word": "disintegrated", "definition": "バラバラに崩壊する、分解するという意味の動詞。秩序や組織が完全に崩れ落ちた状況を表す。"}, {"word": "rank and file", "definition": "一般的な兵士や労働者など、組織の下層部に属する普通のメンバーを指す表現。"}]}, {"title_ja": "Man charged with attack on Australia MP to face court", "title_en": "Man charged with attack on Australia MP to face court", "summary_ja": "Brendan Nugent's family say they have known Helen Haines, who remains in a critical condition, for more than 20 years.", "summary_en": "Brendan Nugent's family say they have known Helen Haines, who remains in a critical condition, for more than 20 years.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c678pnn9mpgno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Man charged with attack on Australia MP to face court\n- Published\nA 43-year-old man has been charged after Australian MP Helen Haines was hit by a car in the state of Victoria on Monday.\nThe suspect will appear in court on Wednesday to face charges of dangerous driving causing serious injury, intentionally causing serious injury and the federal offence of causing harm to a public official.\nLocal media earlier named the alleged attacker as environmental activist Brendan Nugent. His father and his partner said they had been friends with Haines \"for more than 20 years\" and thanked residents and officers who helped her after the \"shocking and horrific crime\".\nHaines remains in a critical condition after surgery and is reported to have lost one of her legs.\n\"Helen Haines is a deeply respected, valued and much loved member of our local community,\" Rod Nugent and his partner Christine Cunningham said in a statement.\n\"All of our love and all of our thoughts are with Helen and her family and friends.\"\nThey promised to assist Victoria Police \"in any way we can\".\nPolice say they will allege the incident was targeted.\nHaines, 65, the independent member for Indi, is in a critical but stable condition after undergoing surgery at a Melbourne hospital.\nShe was airlifted there after bystanders rushed to help.\nA local barber who was there says he pulled the suspect out of his car.\n\"I don't think I'm a hero. I think that I was just a person who had an opportunity to intervene in a safe-ish way,\" said Ricky Jefferies.\nOthers who helped \"didn't even check for danger\", he added. \"The car was still on and they sat in front of a rolling car, that's not an exaggeration.\"\nIn their statement, Victoria Police say a highway patrol unit was nearby at the time of the incident and \"on scene\" within eight seconds of the call coming through.\nAs they announced the charges against the 43-year-old, they said they had searched a property in Tarrawingee, around 12km (7.5 miles) from Wangaratta.\n\"At this stage it appears this is an isolated incident, and there are currently no other known threats connected to this matter,\" they said, adding officers would maintain a presence in Wangaratta.\nHaines won the seat of Indi as an independent in 2019, and has since become a prominent member of the crossbench, building rapport across Australia's increasingly divided political spectrum.\nThe community, and country, remain in shock.\nAt a vigil on Tuesday, locals queued patiently in the aisle of the Holy Trinity Cathedral, waiting for their turn to light a candle. Priests hugged some of those who came to pay their respects.\nWangaratta's main street, where Haines's office is located, had reopened to traffic. Cars slowly filed past the growing number of bouquets being left for her on the pavement.\nOne card read: \"May you recover quickly and continue to be a light in this world.\"\nRelated topics\n  - Published17 hours ago\n  - Published17 hours ago", "translation_ja": "", "vocab": [{"word": "allege", "definition": "〜であると主張する、〜であると申し立てる。法的文脈で、容疑者が特定の罪を犯したと主張することを意味します。"}, {"word": "targeted", "definition": "意図的に選ばれた、狙われた。この場合、攻撃が計画的で特定の人物を狙ったものであることを示します。"}, {"word": "rapport", "definition": "信頼関係、良好な関係。異なる立場の人々との間に築かれた相互理解と友好的な関係を指します。"}, {"word": "isolated", "definition": "孤立した、単独の、他と関連のない。この文脈では、事件が一度限りであり、他に関連した脅威がないことを意味します。"}, {"word": "crossbench", "definition": "無所属議員の総称、与野党のいずれにも属さない議員。政治的に独立した位置を表します。"}]}, {"title_ja": "Two men re-arrested on suspicion of assisting Iran intelligence after RAF Fairford incident", "title_en": "Two men re-arrested on suspicion of assisting Iran intelligence after RAF Fairford incident", "summary_ja": "The head of UK Counter Terrorism Policing said they consider Iranian state involvement \"highly likely\".", "summary_en": "The head of UK Counter Terrorism Policing said they consider Iranian state involvement \"highly likely\".", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqm26z110vzko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Two men re-arrested on suspicion of assisting Iran intelligence after RAF Fairford incident\n- Published\nTwo men have been re-arrested after an incident near RAF Fairford last month, counter-terrorism police have said.\nA 24-year-old UK national, and a 25-year-old dual UK-Iranian national, are being held on suspicion of assisting a foreign intelligence service under Section 3 of the National Security Act 2023, with police saying the investigation relates to Iran.\nPolice had been alerted to three suspicious vehicles near the US airbase in Gloucestershire in the early hours of 27 September - a major incident was subsequently declared and dozens of homes evacuated.\nSeven men in total have been arrested as part of the counter-terror police investigation.\nGloucestershire Police said it had received a call about \"three suspicious vehicles\" travelling towards RAF Fairford at 00:45 BST on 27 September.\nA bomb disposal team was deployed to the village to examine a number of vehicles.\nPetrol was found in three vans near the airbase and five men were arrested.\nThey had been initially arrested on suspicion of committing offences under the Explosives Act and then further arrested on suspicion of preparation of a terrorist act.\nPolice later said they did not find \"improvised explosive devices\".\nThe re-arrests announced on Tuesday relate to a 24-year-old man who was initially arrested on 27 September near the base and a 25-year-old who was arrested on suspicion of preparation of terrorist acts days later on 1 October in the borough of Westminster.\nThe other five men - who also include a 22-year-old British national arrested in Westminster on 6 October - remain on police bail.\nThe head of National Counter Terrorism Policing, Assistant Commissioner Laurence Taylor said: \"This is very much a live investigation, and our evidence gathering continues, but at this time our position remains the same; we consider it highly likely that there is Iranian state involvement.\n\"Our investigators are continuing to examine what that level of involvement was and the ambition behind it.\"\nThe officer added that national security investigations can take time to progress due to their sensitive nature.\n\"Our specialist teams have been working tirelessly to interrogate the many lines of enquiry involved in this hugely complex investigation,\" he said.\nDays after the incident, Prime Minister Andy Burnham told the BBC there were \"strong indications\" Iran had played a part in the incident.\nHe did not provide further details at the time.\nIran has previously denied any involvement.\nRAF Fairford has been used as a forward operating location by the US Air Force (USAF) for decades.\nIn recent months, the US has flown B-1 and B-52 bombers from the base to the Middle East, after the UK approved a request for Fairford to be used for defensive strikes against Iran.\nIn the week after the incident, it emerged that the US had pulled its bombers out of the base and returned them to America.\nUS President Donald Trump said the aircraft were removed due to \"some threats\" to the base without giving specific details.\nVice-President JD Vance said it was done out of an \"abundance of caution\".", "translation_ja": "", "vocab": [{"word": "counter-terrorism", "definition": "テロ対策に関連する。政府機関がテロ活動を防止・捜査するための活動や部門を指す。"}, {"word": "assisting", "definition": "援助する、支援する。何かの行為や計画を助けることを意味し、ここでは違法な活動への協力を指す。"}, {"word": "improvised explosive devices", "definition": "即席爆発装置。一般的な材料から作られた爆弾で、テロ行為に使用される傾向がある。"}, {"word": "interrogate", "definition": "詳しく調べる、尋問する。証拠や情報源を詳細に検査・審査することを意味する。"}, {"word": "ambition", "definition": "野心、目的、狙い。ここでは事件の背後にある目的や意図を指す。"}]}, {"title_ja": "Audit regulator looking into Manchester City accounting", "title_en": "Audit regulator looking into Manchester City accounting", "summary_ja": "No formal investigation has started, but the regulator is making inquiries into the case.", "summary_en": "No formal investigation has started, but the regulator is making inquiries into the case.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm93z1xlgqxqo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Audit regulator looking into Manchester City accounting\n- Published\nThe UK audit regulator has confirmed it is leading inquiries into accounting irregularities at Manchester City.\nThe Financial Reporting Council confirmed in a letter to the House of Commons business select committee it had taken over \"regulatory consideration\" of the case from the Institute of Chartered Accountants in England and Wales on 30 September.\nNo formal investigation has started, but the FRC is making inquiries into the case.\nIt comes after Manchester City were found guilty by an independent commission of all charges relating to breaches of the Premier League's financial regulations between the 2009-10 and 2017-18 seasons, including by artificially inflating the club's financial position by more than £900m. City are appealing the verdict.\nThe FRC has greater resources, and greater powers, to apply sanctions if it does find evidence of violations. It routinely oversees accounting standards at bigger institutions such as listed public companies, but not football clubs.\nThe FRC can look into the conduct of BDO, Manchester City's auditors, to ask whether the audit was in line with the rules.\nIt can also apply sanctions to individuals such as directors or employees of the Etihad club, if they are members of professional accountancy bodies.\nBDO is the UK's fifth-biggest accounting firm, but claims to be a market leader in football, advising more Premier League and Championship clubs than any other firm.\nThe independent commission which looked into Manchester City found that the club gave a \"misleading impression\" of the scheme used to disguise the origin of shareholder funds injected into the club to its auditors, who were \"unaware\" of the scheme.\nManchester City have said they will appeal against the commission's decision, arguing that it contains \"material errors, of law, principle and fact and is unsafe\".\nLiam Byrne, chair of the business select committee, called for greater powers for the FRC to look into similar cases.\nHe wrote on X: \"The regulator's letter exposes gaps in its ability to compel evidence from the club and pursue directors who fall outside its disciplinary rules.\n\"This raises serious questions about the powers available to hold companies and directors to account.\n\"The government has a responsibility to explain why reforms to close these gaps were abandoned - and what will now be done to strengthen accountability.\"\nBDO declined to comment.\n  - Published2 October", "translation_ja": "", "vocab": [{"word": "irregularities", "definition": "通常と異なる異常な状態や不正行為を指す。財務報告や会計における予期しない矛盾や逸脱を表す。"}, {"word": "regulatory", "definition": "法律や規則に基づいて統制・監督する性質を持つ。政府機関や業界団体による公式な監視・管理に関連する用語。"}, {"word": "sanctions", "definition": "規則違反に対する罰則や懲罰措置。警告から罰金、事業停止など様々な段階の処罰を意味する。"}, {"word": "artificially", "definition": "自然ではなく、意図的に作為的な方法で。ここでは財務数字を不正な手段で操作したことを強調する。"}, {"word": "compelling", "definition": "義務付ける、強制する。法的権限によって何かの証拠や情報の提出を強要することを意味する。"}]}, {"title_ja": "Schools should recognise antisemitism as distinct form of harm, review says", "title_en": "Schools should recognise antisemitism as distinct form of harm, review says", "summary_ja": "The government is expected to accept all 27 recommendations made in the review by ex-Ofsted boss, Sir David Bell.", "summary_en": "The government is expected to accept all 27 recommendations made in the review by ex-Ofsted boss, Sir David Bell.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c623d7z1rxg5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Schools should recognise antisemitism as distinct form of harm, review says\n- Published\nSchools and colleges in England will be required to recognise antisemitism as a distinct category of harm and take explicit action against it following a major review, the BBC understands.\nIt means anti-Jewish hatred would be treated as a specific safeguarding risk rather than being dealt with through existing measures to stop racism and bullying.\nThe government-commissioned review into antisemitism in education is also expected to recommend dedicated training for teachers, more consistent recording and reporting of incidents, and better education about antisemitism and modern-day Jewish life.\nThe BBC understands it will also call for stronger guidance on political impartiality for teachers.\nThe review, led by former Ofsted chief inspector Sir David Bell, is due to be presented to Parliament on Wednesday. The government is expected to accept all 27 recommendations.\nIt was launched amid growing concern about antisemitism in the UK, following a series of high-profile incidents including the attack at Heaton Park synagogue in Manchester in October 2025, in which two men were killed.\nSeparate reviews were also commissioned into antisemitism in healthcare and into public order and hate crime laws.\nThe BBC revealed in August that the Bell review had found Jewish schoolchildren were experiencing regular harassment and abuse.\nIt also found that headteachers of some Jewish schools were spending more of their time dealing with security arrangements than educational matters.\nRecent figures from the Community Security Trust, an organisation which provides security advice and support to the Jewish community, showed a spike in antisemitic incidents at schools.\nIt found in the first half of 2026 that antisemitism in schools had reached the highest level ever recorded for the first six months of any year. It jumped by 59%, from 112 reported incidents in the first half of 2025 to 178 recorded over the same period in 2026.\nThe review is also expected to recommend that the government sets up a type of hotline where school leaders can access immediate advice on tackling antisemitism.\nBell told the BBC: \"This is not just a report for Jewish children in Jewish schools. This is for all children and young people in all schools and colleges. We know that antisemitism crosses all boundaries.\"\nEarlier this month, the BBC was given rare access inside a Jewish school in Hertfordshire, where pupils and staff operate under tight security, amid heightened concerns about antisemitism.\nSpencer Lewis, the executive headteacher of Yavneh College, said that security was an \"innate part\" of his role.\n\"When you come in in the morning, there are high gates, high fences, lots of security cameras. We have four full-time security staff. And it sort of just becomes part of what you do,\" he said. \"We think about it a lot.\"\nStaff and pupils told the BBC they have become so used to these measures that they barely notice them anymore.\nLock-in - or \"in-vacuation\" - drills for dealing with intruders have become second nature, even to the youngest pupils.\n\"It's a bit scary sometimes, but you know you're safe,\" said Livi, a Year 6 pupil.\n\"It's sad that we can't be equal to everyone else, but people don't like us just because of the way we are,\" added her classmate, Sadie.\nA group of a dozen older pupils who spoke to the BBC said that while they feel safe inside school, hearing about antisemitic attacks in the UK, including reports of pupils at other Jewish schools being harassed on their commute and at sports fixtures, has left them feeling targeted.\nSome said that they were reluctant to wear skullcaps or necklaces featuring the Star of David – a Jewish symbol – outside school.\n\"Other religions get to be out and wear their necklaces and be proud - I don't get why Jewish people can't do it as much,\" said Year 9 pupil Ilan.\nIn response to the recommendations, the government is also expected to encourage schools to adopt the International Holocaust Remembrance Alliance (IHRA)'s working definition of antisemitism, although it cannot make it compulsory.\nThe definition is supported by mainstream Jewish organisations and has been adopted by 47 countries, including the UK, as well as most British universities.\nHowever, some of the IHRA definition's examples of antisemitic behaviour have proven controversial.\nThe Board of Deputies of British Jews said that adopting the IHRA definition would provide schools with a tool \"to deepen understanding of contemporary antisemitism\".\nIn a statement, a spokesperson told the BBC: \"Treating antisemitism in schools as a safeguarding issue will have the benefit of creating an explicit duty on all schools to address this as they would any other threat to children's safety, and will strengthen accountability.\"\nHe added: \"We have advocated these measures be accompanied by other steps including improving education about Jewish life and ensuring schoo", "translation_ja": "", "vocab": [{"word": "commissioned", "definition": "政府や組織が正式に(調査や報告書などの)作成を依頼すること。公式な調査や研究プロジェクトを開始する際に使用される。"}, {"word": "safeguarding", "definition": "特に子どもや弱い立場の人を保護し、危害から守るための制度や措置。教育機関では安全対策の重要な概念として使われる。"}, {"word": "impartiality", "definition": "政治的に中立であり、偏見なく公平であること。特に教育者が複数の視点を尊重すべき義務を指す。"}, {"word": "spike", "definition": "短期間での急激な増加や上昇。統計データやグラフで急峻な上昇を示す際に使用される。"}, {"word": "harassment", "definition": "継続的ないじめや嫌がらせ行為。特に組織的な不正や不適切な行動を指す法律用語として機能する。"}]}, {"title_ja": "Portugal housing protests continue after police clear camps", "title_en": "Portugal housing protests continue after police clear camps", "summary_ja": "Demonstrators vow to continue their campaign to call for affordable housing in Portugal after police cleared tent camps and arrested at least 55 people.", "summary_en": "Demonstrators vow to continue their campaign to call for affordable housing in Portugal after police cleared tent camps and arrested at least 55 people.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/portugal-housing-protests-continue-after-police-clear-camps/a-79717904?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Portugal housing protests continue after police clear camps\nOctober 21, 2026\nThousands of people rallied in Lisbon, Porto and other Portuguese cities on Tuesday evening, hours after police dismantled protest camps and arrested a total of 55 demonstrators.\nThe protesters vowed to continue their campaign against Portugal's deepening housing crisis, which has made buying or renting a home increasingly unaffordable.\nOrganizers said more than 1,000 people gathered in each of the two main protest locations, although police did not provide crowd estimates. \nIn Lisbon's central Rossio square, demonstrators voted by a show of hands to re-establish their tent camp on Wednesday.\nPolice moves to shut down protest camps\nPolice launched coordinated operations in Lisbon and Porto shortly before 6 a.m. (0500 GMT) on Tuesday, after warning protesters that their camps were illegal.\nActivists had occupied Lisbon's Rossio square since Saturday, setting up around 200 tents. In Porto, protesters had camped in Dom Joao I square for about 10 days.\nAuthorities seized 228 camping structures during the operation.\nIn Porto, demonstrators dismantled their tents themselves after police threatened to intervene. In Lisbon, officers cleared the square as protesters formed a human chain.\nClashes subsequently broke out, according to footage broadcast by local television stations.\nCarla Valadao, a spokesperson for the Lisbon camp, described the operation as \"very aggressive.\"\nHowever, Public Security Police superintendent Sergio Soares disputed that account, saying the eviction had been \"calm, proportionate and appropriate, with no police charge.\"\nAll 55 people arrested were later released pending a court appearance in Lisbon on Wednesday.\nWhy are people protesting in Portugal?\nPortugal is struggling with one of Europe's worst housing affordability crises.\nProperty purchase prices have more than doubled since 2017, while rents for new leases have nearly doubled over the same period.\nThe problem is particularly severe in major cities such as Lisbon and Porto, where residents have also protested against excessive tourism and an influx of so-called digital nomads.\nDemonstrators accuse the center-right government of failing to address the crisis.\nThey are demanding the withdrawal of a bill that would make evictions easier and end rent caps on new leases. The proposed legislation has already passed its first parliamentary reading.\nDebora Miranda, a 41-year-old communications consultant, told Reuters she joined the Lisbon demonstration to represent generations struggling with rising housing costs.\n\"If people don't feel at home, in every sense of the word, they can't move forward with their lives...enough is enough.\"\nJorge Paixao, a 19-year-old history student, described the situation as \"a societal crisis.\"\nHe said his generation needed \"the ability to live with dignity, start families and rejuvenate Portugal.\"\nPortugal housing protest takes place amid demos around Europe\nThe demonstrations come amid growing anger over housing affordability and living costs across several European countries.\nProtesters in Portugal have sought to align their movement with similar demonstrations in neighboring Spain.\nIn Madrid, activists maintain a tent camp to call for stronger action to tackle the housing crisis. The crisis was sparked by the eviction ofMaria del Carmen Abascal from her home.\nThe nearly four weeks of protests in Spain have contributed to political turmoil, leading to a snap general election being called for November 29.\nMeanwhile, demonstrations over rising living costs have also taken place in France, Belgium and Italy.\nViolence that erupted in France over the weekend on the sidelines of otherwise peaceful protests has raised concerns that similar unrest could spread to other countries facing comparable economic pressures.\nEdited by: Roshni Majumdar\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "dismantled", "definition": "組織や構造を意図的に解体すること。ここでは警察がプロテストキャンプを取り壊したことを指す。組織的かつ計画的に破壊する行為を表す。"}, {"word": "coordinated", "definition": "複数の人や組織が同じ目標に向けて一致して行動すること。ここでは警察がリスボンとポルトで同時に作戦を実行したことを示す。"}, {"word": "proportionate", "definition": "状況に対して適切で均衡の取れた程度や規模であること。過度ではなく、状況に見合っている様子を表す。"}, {"word": "affordability", "definition": "個人の経済状況から見て購入や利用が可能な価格帯であること。通常、住宅や生活必需品に関して使用され、経済的な余裕を示す。"}, {"word": "influx", "definition": "大量のものやひとが流入すること。ここでは外国人労働者が多数ポルトガルに入ってきたことを指す。"}]}, {"title_ja": "AfD's Alice Weidel to unveil plan to cut EU powers — report", "title_en": "AfD's Alice Weidel to unveil plan to cut EU powers — report", "summary_ja": "The far-right AfD will propose slashing powers of the European Union when it presents its policy paper on Wednesday, Politico reports.", "summary_en": "The far-right AfD will propose slashing powers of the European Union when it presents its policy paper on Wednesday, Politico reports.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/afd-s-alice-weidel-to-unveil-plan-to-cut-eu-powers-report/a-79717944?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "AfD's Alice Weidel to unveil plan to cut EU powers — report\nOctober 21, 2026\nAlice Weidel, the co-leader of Germany's far-right AfD, is expected to present her party's policy for the EU at the European Parliament on Wednesday.\nAccording to a report from news outlet Politico, the AfD policy paper on the EU does not seek to exit the bloc or the eurozone at first.\nThe party rather wants to downsize the EU's powers and budget.\nWhat's in the AfD policy paper?\nInstead of direct European Parliament elections, the AfD would like to see delegates appointed by national parliaments.\nThe AfD would also limit the scope of the European Commission to purely administrative tasks and supplant the European Court of Justice with an arbitration tribunal.\nThe far right party would threaten to slash Germany's contributions to the EU budget.\nGermany under the AfD would seek exemptions from EU regulations regarding issues such as migration and social policy. The AfD may also seek opt-outs of other areas such as agriculture and financial policies.\nIf the EU would not bend to the AfD's demands for reform, the party would then seek a German referendum on EU membership.\nA referendum would be unrealistic, as it would require a constitutional amendment to the German Basic Law to take place. An amendment would require a two-thirds majority vote in both the Bundestag and upper house Bundesrat — an extremely high threshold to meet.\nAfD eyes victory in next federal elections in 2029\nThe AfD hopes that it can implement its EU policies in 2029, when the next German and European elections will take place.\nRecent German federal election surveys show the AfD in first place but it would have to form a coalition with another partner to establish a ruling majority government. That's difficult when other parties such as the conservative Christian Democratic Union refuse to have any cooperation with the AfD as part of a \"firewall\" policy.\nEdited by: Roshni Majumdar\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "downsize", "definition": "規模や権力を縮小する、削減することを意味する。ビジネスや政治文脈で、組織の規模や影響力を段階的に減らす場合に使用される。"}, {"word": "supplant", "definition": "何かを別のもので置き換える、取って代わることを意味する。より優れたものによって従来のものが廃止される場合に用いられる。"}, {"word": "exemptions", "definition": "特定のルールや規制から除外されること、免除を意味する。法律や協定が適用されない特別な許可や状態を指す。"}, {"word": "opt-outs", "definition": "参加を拒否する、または特定の規則や協定から除外される権利を意味する。加盟国が特定の政策に参加しないことを選択する際に用いられる。"}, {"word": "threshold", "definition": "基準値、限界、または要件を意味する。政治や法律文脈で、特定の行動を実行するために必要な最小条件や投票数を指す。"}]}, {"title_ja": "Zelenskyy visits Norway amid Trump White House tensions", "title_en": "Zelenskyy visits Norway amid Trump White House tensions", "summary_ja": "Ukrainian President Zelenskyy met with Norwegian and Finnish leaders in Oslo and held talks with Trump envoys Steve Witkoff and Jared Kushner. Trump is pressuring Zelenskyy to \"make a deal\" with Russia.", "summary_en": "Ukrainian President Zelenskyy met with Norwegian and Finnish leaders in Oslo and held talks with Trump envoys Steve Witkoff and Jared Kushner. Trump is pressuring Zelenskyy to \"make a deal\" with Russia.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/zelenskyy-visits-norway-amid-trump-white-house-tensions/a-79717354?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Zelenskyy visits Norway amid Trump White House tensions\nOctober 20, 2026\nUkrainian President Volodymyr Zelenskyy visited Norway on Tuesday as Ukraine faces renewed tension in its relationship with US President Donald Trump and his administration.\nFinland's Stubb: 'Today was a good day for peace'\nDuring the visit, Zelenskyy met with Finnish President Alexander Stubb and Norwegian Prime Minister Jonas Gahr Store in Oslo, along with Trump envoy Steve Witkoff. The US president's son-in-law, Jared Kushner, joined the meeting remotely.\nStore described the meeting involving the European and the US sides as \"good and constructive\" at a press conference.\n\"US and European teams have done substantive work on key issues together with Ukraine,\" Store said.\nStubb said, \"Today was a good day for peace.\" The Finnish president said Witkoff intends to fly to St. Petersburg on Wednesday to meet with Russian leaders and discuss ideas from the Oslo meeting.\nThe Oslo meeting comes as Zelenskyy has accused the US of withholding intelligence from Ukraine in advance of Russian strikes and delaying the delivery of interceptor missiles.\nZelenskyy: Early intel warnings from partners on Russian strikes resume\nZelenskyy said he held a phone call with US Secretary of State Marco Rubio earlier in the day and said Ukraine is now receiving early warnings from its partners ahead of Russian strikes.\n\"We are thankful that intelligence works now, and I'm speaking about early warning, which is very important for our people, for children, adults, civilians, because we can hear when ballistic is coming,\" Zelenskyy said of the Russian-launched missiles while standing next to Finnish and Norwegian leaders.\nThere are also media reports that Trump, Russian President Vladimir Putin and Chinese President Xi Jinping could hold a meeting to possibly discuss Ukraine and other issues.\n\"I don't know what the trilateral meeting will be about between America and China, and Russia, it's up to them,\" Zelenskyy said, but added that if Ukraine is discussed, it would be acceptable only if Ukrainians are at the negotiating table.\nTrump ramps up attacks on Zelenskyy as US midterms loom\nEarlier this month, Zelenskyy criticized a deal struck between the Trump administration and Russia to buy Russian diesel fuel. Oil and gas export revenues are vital for the Russian economy and war efforts in Ukraine.\nTrump has criticized Zelenskyy and blamed Ukrainian strikes on Russian oil refineries for high diesel prices. Prices have increased dramatically since Iran closed the Strait of Hormuz in response to US attacks.\nZelenskyy on Tuesday said he is supportive of Trump's suggestion to stop attacks on energy sites, with Russia also doing the same in regard to Ukraine as part of an \"energy ceasefire.\" However, Zelenskyy said Russia is unwilling to stop its attacks on Ukraine.\nAt a recent European Union summit in Brussels, Zelenskyy smiled at the suggestion that he is being made a scapegoat by Trump.\nThe US president is looking for someone else to blame for high domestic energy costs ahead of midterm congressional elections onb November 3. If the opposition Democrats take back control of the US House and Senate, it could constrain Trump's powers in his last two years in office.\nIn comments to reporters at the White House on Tuesday, Trump said he wants Zelenskyy to \"make a deal\" with Russia and suggested Moscow has the upper hand.\nUkraine has been fighting off a full-scale Russian invasion since February 2022. In the past, Trump has blamed Zelenskyy for the war and on Tuesday again said it was up to Kyiv to end the Russian invasion.\n“We want Zelenskyy to make a deal,” Trump told reporters in the Oval Office. “We’ve given a lot to Ukraine. We’ve gotten absolutely nothing back except grief, death, tremendous monetary loss.”\nTrump said he also spoke with Putin about Stephen Hubbard, a retired US teacher detained in Russia accused of acting as a mercenary for Ukrainian forces.\n\"I've been talking to President Putin about Mr. Hubbard. I've been talking to him at length. I've asked him to release him. Let's see what happens,\" Trump said.\nEdited by: Sean Sinico\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "envoy", "definition": "特使、外交官。特定の目的で他国に派遣される政府の代表者を意味する。"}, {"word": "substantive", "definition": "実質的な、内容のある。重要な内容を含んでいて、表面的ではないことを示す。"}, {"word": "withholding", "definition": "差し控える、提供を拒否する。情報や資源などを意図的に与えないことを指す。"}, {"word": "trilateral", "definition": "三国間の、三者による。3つの国または団体が関わることを意味する。"}, {"word": "ramping up", "definition": "段階的に増加させる、強化する。活動や攻撃などを徐々に激しくすることを示す。"}]}, {"title_ja": "El-Sayed says Trump's attacks on his faith are to distract from pain he's causing", "title_en": "El-Sayed says Trump's attacks on his faith are to distract from pain he's causing", "summary_ja": "The Michigan Senate candidate said they don't address Americans' struggles.", "summary_en": "The Michigan Senate candidate said they don't address Americans' struggles.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/abdul-el-sayed-trumps-attacks-faith-meant-distract/story?id=137382911", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "American Airlines flight blows tire while landing at Chicago O'Hare: FAA", "title_en": "American Airlines flight blows tire while landing at Chicago O'Hare: FAA", "summary_ja": "The American Airlines Flight 41 crew \"reported a brake issue and then a blown tire\" after landing safely, the FAA said in a statement.", "summary_en": "The American Airlines Flight 41 crew \"reported a brake issue and then a blown tire\" after landing safely, the FAA said in a statement.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/american-airlines-flight-blows-tire-landing-chicago-ohare/story?id=137428455", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "RFK Jr’s ‘deities of vaccine research’ raided by police in Guinea-Bissau", "title_en": "RFK Jr’s ‘deities of vaccine research’ raided by police in Guinea-Bissau", "summary_ja": "Police seize doses of hepatitis B vaccine from people at center of dispute over research on African newborns Controversial vaccine researchers who have been praised by Robert F Kennedy Jr, the US Department of Health and Human Services (HHS) secretary, had their offices in Guinea-Bissau raided by ju", "summary_en": "Police seize doses of hepatitis B vaccine from people at center of dispute over research on African newborns Controversial vaccine researchers who have been praised by Robert F Kennedy Jr, the US Department of Health and Human Services (HHS) secretary, had their offices in Guinea-Bissau raided by ju", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/20/rfk-jr-vaccine-researchers-offices-raided-guinea-bissau", "state_media": false, "category": "社会", "full_text": "Controversial vaccine researchers who have been praised by Robert F Kennedy Jr, the US Department of Health and Human Services (HHS) secretary, had their offices in Guinea-Bissau raided by judicial police, who seized doses of hepatitis B vaccines, officials said on Facebook.\nThe researchers have been at the heart of an ongoing dispute over research on African newborns, supported by $1.6m from the US Centers for Disease Control and Prevention (CDC) and matched by the Pershing Square Foundation and the Bluebell Foundation for a total of $3.2m.\nThe police search took place on Monday, involving “investigative procedures aimed at clarifying the circumstances related to the said batch of vaccines”, according to the social media post, which was translated from Portuguese. The announcement noted that seizing the immunizations did not point to “irregularities in the quality, safety, or effectiveness of the vaccines”.\nThe Bandim Health Project recently posted a letter of approval for the trial from Guinea-Bissau’s national ethics committee at the ministry of public health, dated 14 July and signed by the committee’s president, Mouhammed Djicó Ould Ahmed. A Danish research ethics committee, which had to change its rules to consider a clinical trial, also approved the study earlier this month.\nQuinhin Nantote, the health minister of Guinea-Bissau’s transitional government, disputed reports that the trial would move forward.\n“This is not even remotely true,” Nantote told the Guardian in Portuguese on Thursday.\nThe study was redesigned over the summer, but it would still deny hepatitis B vaccines to 7,000 newborns in the first six weeks of life, in a country where about one in five adults have the virus. Hepatitis B kills 15% to 25% of people with chronic infections, causing cancer and liver failure, and newborns are particularly vulnerable – but vaccination within 24 hours of birth is safe and highly effective at preventing illness.\nAny study that would deny the vaccine to participants was “unethical and exposes newborns to serious and potentially irreversible harm”, said Tarik Jašarević, a spokesperson for the World Health Organization (WHO), calling hepatitis B vaccination at birth an “essential public health intervention”.\nThrough its country office in Guinea-Bissau, the WHO and its partners have been advising the ministry of health on the planned introduction of the hepatitis B vaccine and the potential impact of this study, Jašarević added.\nThe Bandim Health Project was founded by anthropologist Peter Aaby in 1978, and it is now co-led by his wife, Christine Stabell Benn, an epidemiologist.\nKennedy has repeatedly praised their work, calling them “the deities of vaccine research” at a recent anti-vaccine conference. He has several times referenced the results of a study they conducted on the diphtheria-tetanus-pertussis (DTP), which the same researchers later conducted again and found completely different results. Even so, Kennedy called Aaby a “very famous” researcher on Joe Rogan’s podcast in 2023 and cited his research when he halted US funding to Gavi, the Vaccine Alliance.\nStabell Benn was a member of the hepatitis B working group of the Advisory Committee on Immunization Practices (ACIP), helping present evidence to the US committee that voted to end the universal birth recommendation before such decisions on vaccines were stayed by a federal judge. Stabell Benn also hosted a podcast with Tracy Beth Høeg, a former top official with the US Food and Drug Administration (FDA) who said she wanted to end “unnecessary” vaccines.\nAaby, Stabell Benn and Frederik Schaltz-Buchholzer, the lead researcher on the project, did not respond to the Guardian’s questions about the trial and the police search.\nThe Bandim organization is deeply enmeshed in Guinea-Bissau but has done little to improve the country’s health and research capacities in five decades of operation, according to a report from the non-profit Stand Up for Science (SUFS). The organization is now fundraising to help roll out the vaccines at birth to all newborns in the country.\n“Our investigator encountered significant distrust of Bandim by the citizenry of Guinea-Bissau,” said Colette Delawalla, an American health researcher and founder of SUFS. “However, because of the lack of public health infrastructure, Bandim is often the only option in situations where people are desperate to access medical care of any kind.”\nThe police raid underlines the fact that Guinea-Bissau is a “fragile” nation that experienced a military coup less than a year ago, Delawalla said. The country lacks the stability needed for clinical trials, she added.\n“Guinea-Bissau is in the difficult situation of trying to protect their youth, their future, from exploitation by two powerful western nations and they are using what leverage they have to do so,” Delawalla said.", "translation_ja": "", "vocab": [{"word": "controversial", "definition": "議論の多い、物議を醸す。ある事柄や人物について、異なる意見や反対意見が多く存在する状態を表す。"}, {"word": "irregularities", "definition": "不規則性、異常、違反。通常の基準や規則から外れた状態を指し、ビジネスや医療分野で問題や疑いを示唆する用語として使われる。"}, {"word": "ethical", "definition": "倫理的な、道徳的な。ある行為や決定が正しい道徳基準に従っているかどうかを判断する際に用いられる。"}, {"word": "irreversible", "definition": "取り返しのつかない、不可逆的な。一度発生すると元の状態に戻すことができない変化や損傷を表す。"}]}, {"title_ja": "US grants deportation reprieve to migrants from Ukraine and Sudan", "title_en": "US grants deportation reprieve to migrants from Ukraine and Sudan", "summary_ja": "DHS says migrants ‘retain protections’ after temporary protected status was set to expire on Monday Send us your questions about immigration and the midterms More than 100,000 people from Ukraine and Sudan can stay in the United States without immediate risk of deportation, the Department of Homelan", "summary_en": "DHS says migrants ‘retain protections’ after temporary protected status was set to expire on Monday Send us your questions about immigration and the midterms More than 100,000 people from Ukraine and Sudan can stay in the United States without immediate risk of deportation, the Department of Homelan", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/oct/19/us-migrants-deportation-ukraine-sudan", "state_media": false, "category": "社会", "full_text": "More than 100,000 people from Ukraine and Sudan can stay in the United States without immediate risk of deportation, the Department of Homeland Security said, in what amounts to a temporary reprieve after their right to stay in the country was set to expire on Monday.\nTemporary protected status was set to end on Monday for about 101,000 Ukrainians and 1,800 Sudanese. But the DHS said an announcement “will be made at the appropriate time”. Until then, the department said in a written statement, Ukrainians and Sudanese in the US covered by those temporary measures “retain protection”. The department did not indicate how long they could stay or when a final announcement would be made on their status.\nThe DHS did not respond to a question about whether they can keep their work permits, but TPS generally allows people to work while their protections remain in effect.\nThe decision marks another incident where the Trump administration, which has previously sought to end these temporary protections from deportation and send people back to their home countries, has allowed people covered by the temporary status to stay in the country but without giving any guidance as to how long.\nYuriy Boyechko, CEO of Hope For Ukraine, a non-profit that provides humanitarian aid in Ukraine and helps resettle newcomers in the US, described the government’s announcement as “last-minute patches”.\nIt is a “bandage that has been placed on a wound that does not solve the real issue,” he said. “It’s time for US to come up with some normal path to permanent residency for all these people,” Boyechko noted. He emphasized that they cannot safely return to Ukraine.\nAndrew Arthur, a national-security and immigration expert at the Center for Immigration Studies, a Washington thinktank that favors lower immigration, said the government will eventually decide but faces no deadline. Until then, nothing changes, he said.\n“It’s simply going to be an extension until it is a termination,” he said. “It’s beyond cavil that both Sudan and Ukraine are experiencing ongoing armed conflict, and therefore the secretary is well within his authority to continue TPS for each of them.”\nThe Trump administration has already terminated TPS for more than 1 million people from 13 countries, including Venezuela, Haiti, Honduras, Nicaragua, Afghanistan and Syria.\nBut in a change in practice roughly a month ago, the administration kept protections in place for nearly 200,000 Salvadorians whose TPS was set to expire on 9 September. In that case they also said that they were going to make a decision at the appropriate time and that in the meantime, people from El Salvador could continue to work and live in the US.\nActivists and a bipartisan group of lawmakers have been raising the alarm over the upcoming deadline for TPS to expire for Ukrainians, arguing that conditions remain unsafe for them to return home amid the war with Russia.\nUkraine was first designated for TPS in April 2022, following Russia’s full-scale invasion two months earlier. The Biden administration subsequently extended the designation, most recently in January 2025, when the DHS authorized an additional 18 months of protection through October 2026.\nThe TPS program for Sudan was established in 1997, and since then, successive US administrations have extended it due to the armed conflict and political instability that have plagued the African nation.\nMonday’s decision comes two weeks before the midterm elections, when Trump’s hard line immigration policies will face a test at the ballot box.", "translation_ja": "", "vocab": [{"word": "reprieve", "definition": "一時的な猶予または延期のこと。特に罰や困難から一時的に解放されることを意味する。この記事では、ウクライナとスーダン国民の強制送還が一時的に延期されたことを指す。"}, {"word": "expedient", "definition": "都合のよい、有効な方法や手段のこと。短期的な利益のために原則を曲げる行動を暗に含むことがある。ここでは一時的な対処法という意味合いで使われている。"}, {"word": "cavil", "definition": "些細なことについて文句を言う、つまらない異論を唱えるという意味。法律用語として「疑いの余地がない」という表現「beyond cavil」で使われている。"}, {"word": "terminate", "definition": "終了する、中止するという意味。特に公式な決定による終了を指す。この記事では政府がTPS（一時的保護身分）を取り消すことを意味する。"}]}, {"title_ja": "Kenyan starvation cult leader guilty of murder of 190 children and one adult", "title_en": "Kenyan starvation cult leader guilty of murder of 190 children and one adult", "summary_ja": "Paul Mackenzie and his church set up sect that ordered followers to starve themselves and their children, say prosecutors A Kenyan court has found the starvation cult leader Paul Mackenzie and about 30 others guilty of murder over the deaths of ⁠190 children and one adult in one of the world’s worst", "summary_en": "Paul Mackenzie and his church set up sect that ordered followers to starve themselves and their children, say prosecutors A Kenyan court has found the starvation cult leader Paul Mackenzie and about 30 others guilty of murder over the deaths of ⁠190 children and one adult in one of the world’s worst", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/19/kenya-starvation-cult-leader-guilty-murder-190-children", "state_media": false, "category": "社会", "full_text": "A Kenyan court has found the starvation cult leader Paul Mackenzie and about 30 others guilty of murder over the deaths of 190 children and one adult in one of the world’s worst cult-related disasters in recent history.\nMackenzie was arrested in 2023 after police received a tipoff, and weeks later authorities began uncovering bodies in shallow graves in the Shakahola forest near the coast in south-eastern Kenya.\nProsecutors say Mackenzie and his Good News International Church organised a Christian doomsday sect in which they ordered followers to starve themselves and their children to death to go to heaven before the world ended.\nMackenzie denied murder charges, saying he did not force the victims to starve but the court rejected that argument.\nIn total, more than 400 bodies have been recovered from the Shakahola forest. Many were severely decomposed, and only 26 of them were able to be identified.\nMonday’s judgment covered 191 deaths while investigations into the other deaths are continuing.\nJustice Diana Kavedza Mochache said in a hearing lasting more than eight hours that in some cases children were isolated and denied food while their parents watched.\nMackenzie was in court, wearing a striped polo shirt and red trousers, sitting alongside his wife, one of the co-accused.\nHe was silent, staring into space before the ruling was handed down.\nRelatives of some of those who died in the forest gathered to hear the judgment at Mombasa high court.\nFrancis Wanje, 62, lost eight family members including two grandchildren to the cult.\nSpeaking before the verdict, he said: “It has been really a heavy thing [for] us as a family, and it has really taken us very far in terms of psychological problems … I was hoping for this particular day.”\nThe Shakahola tragedy has gripped Kenya since the discovery of mass graves in the coastal forest more than three years ago.\nIt raised questions over how Mackenzie was able to continue to operate despite having been on the radar of the authorities since 2017 when his premises were searched by police. In 2019, authorities shut down Mackenzie’s church and he relocated to the Shakahola forest, police said.\nThe case has also led to calls for tougher oversight of churches and other religious organisations in a country where religious faith plays a prominent role in public life.\nKenya’s president, William Ruto, said in 2023 that government agencies should have been able to prevent the deaths. He said he took responsibility as president.\nPeople with direct knowledge of the cult’s activities said Mackenzie planned the mass starvation in three phases: first children, then women and young men, and finally the remaining men.\nMackenzie, a former taxi driver, forbade cult members from sending their children to school and from going to hospital when they were ill, describing such institutions as satanic, some of his followers told Reuters for a 2023 article.\nCult members lived in makeshift homes of polythene sheeting and thatch that Mackenzie divided into areas with biblical names such as Jerusalem and Judea.\nThe plight of his followers began to emerge in mid-March 2023, when a local man told police that his brother and wife had starved their children to death in the forest on Mackenzie’s orders.\nMackenzie was arrested but released on bail, after which relatives say he brought forward the date on which he told his followers the world would end. Police arrested him again in April 2023 and started combing through the forest more systematically and began exhuming mass graves.\nMackenzie faces other charges over the forest deaths including terrorism-related ones, which he has denied.\nProsecutors say while he was in detention he also directed the deaths of 52 people in Kwa Binzaro village, about 18 miles (30km) from Shakahola. Mackenzie has pleaded not guilty in that case.", "translation_ja": "", "vocab": [{"word": "tipoff", "definition": "密告、情報提供のこと。犯罪や問題に関する情報を当局に提供する行為を指す。"}, {"word": "doomsday sect", "definition": "終末論的な宗教団体。世界の終末が近いと信じ、極端な行動を取る集団のこと。"}, {"word": "decomposed", "definition": "腐敗した、分解した状態。遺体が時間経過で腐り、原形を失うこと。"}, {"word": "oversight", "definition": "監督、管理、監視のこと。組織や活動が適切に運営されているかを確認する責務を意味する。"}, {"word": "gripped", "definition": "強く心を掴む、深刻な関心を引き起こす。ニュースや事件が国民の注目を集めている状態を表す。"}]}, {"title_ja": "The Gambia to pay reparations to ex-dictator’s victims from sale of US mansion", "title_en": "The Gambia to pay reparations to ex-dictator’s victims from sale of US mansion", "summary_ja": "The Gambia confirmed it received $2.5m from the sale of a US mansion belonging to former president Jammeh.", "summary_en": "The Gambia confirmed it received $2.5m from the sale of a US mansion belonging to former president Jammeh.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/20/the-gambia-to-pay-reparations-to-ex-dictators-victims-from-sale-of-us-mansion?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "The Gambia to pay reparations to ex-dictator’s victims from sale of US mansion\nGambian authorities have announced that funds from the sale of the country’s former president’s mansion in the United States would be used to pay reparations to victims of his rule.\nThe Gambia Reparations Commission confirmed Tuesday that it received just more than $2.5m from the sale of a property in the wealthy Washington, DC suburb of Potomac, Maryland, belonging to ex-President Yahya Jammeh.\nThe commission, which was set up to compensate victims of abuses committed during Jammeh’s 22-year rule ending in 2017, said in a statement that “the funds were deposited directly into the Reparations Fund account at the Central Bank of The Gambia and shall only be utilized for the payment of reparations”.\n“The Commission is committed to ensuring that the funds are managed responsibly, transparently and accountably, with due regard to the rights and needs of victims and survivors,” it added.\nJammeh currently lives in Equatorial Guinea, after he was forced out under pressure from The Gambia’s West African neighbours following his 2016 election loss to current President Adama Barrow.\nHe is accused of presiding over the murder of political opponents, disappearances, rape and torture.\nA commission of inquiry estimated that between 240 and 250 victims were killed by Jammeh’s forces in the former British colony of two million people.\nProceeds from corruption\nPresident Barrow said in a statement that his government would heed any recommendations by official auditors on how the funds would be allocated to victims.\nThe US Justice Department filed a civil forfeiture complaint in 2020 alleging that the property was bought with proceeds of corruption. A court ordered its forfeiture in 2022.\nThe property, it asserted, was purchased through a trust set up by Jammeh’s wife.\nThe US Justice Department had announced in September that it would return the funds from the mansion sale to The Gambia.", "translation_ja": "", "vocab": [{"word": "reparations", "definition": "過去の違法行為や害に対する補償金。ここでは独裁政権下での被害者に対する金銭補償を指す。"}, {"word": "forfeiture", "definition": "違法な方法で得た財産を没収すること。法的手段により強制的に財産権を失うこと。"}, {"word": "accountability", "definition": "説明責任。自らの行動や決定に対して責任を持ち、それについて説明する義務。"}, {"word": "civilly", "definition": "民事的に。刑事訴訟ではなく民法に基づいて訴えを起こすこと。ここでは『civil forfeiture complaint』として使用されている。"}, {"word": "allocate", "definition": "資金や資源を配分する。特定の目的のために資金を振り分けること。"}]}, {"title_ja": "‘I don’t care how it’s done’: Trump pressures Ukraine to cut peace deal", "title_en": "‘I don’t care how it’s done’: Trump pressures Ukraine to cut peace deal", "summary_ja": "The US president&#039;s remarks come amid a deepening feud with Ukraine&#039;s President Volodymyr Zelenskyy.", "summary_en": "The US president&#039;s remarks come amid a deepening feud with Ukraine&#039;s President Volodymyr Zelenskyy.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/20/i-dont-care-how-its-done-trump-pressures-ukraine-to-cut-peace-deal?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "‘I don’t care how it’s done’: Trump pressures Ukraine to cut peace deal\nThe US president’s remarks come amid a deepening feud with Ukraine’s President Volodymyr Zelenskyy.\nAmid escalating tensions with Ukrainian leader Volodymyr Zelenskyy, United States President Donald Trump has increased pressure on the Eastern European country to make a deal that would end the war with Russia.\nSpeaking at the White House on Tuesday, Trump doubled down on his efforts to blame the Ukrainian president for holding up peace efforts that would bring the years-long conflict to a close.\n“Zelenskyy has to want to settle this war, and if he doesn’t, I think it’s going to be a very bad thing,” Trump said as he talked about Russia having an “unlimited” supply of people to send in the fight.\nMoments later, the US president referenced a contentious Oval Office meeting he held with Zelenskyy in February 2025, shortly after returning to power.\nZelenskyy, Trump said, could have made a “better deal” then. “He’s going to have to want to make a deal, because I don’t think his people are going to stand for it any longer,” Trump told reporters.\nOn Tuesday, the Ukrainian president met US special envoy Steve Witkoff and European leaders in Oslo, Norway, to discuss ending Russia’s war.\nIn a post on social media after the meeting concluded, Zelenskyy said, without providing specifics, that his country has “some clear ideas on how to get to peace”.\n“We are united with our European partners in this effort, and we want the Americans to take these ideas to the Russians,” Zelenskyy wrote. “One of the important ideas is to move to a potential trilateral meeting of the leaders to address the issues that only the leaders can do.”\nThe Ukrainian leader added that Witkoff would head to Russia on Wednesday, where peace discussions are expected to continue.\n“Let’s see what Putin has to say,” Zelenskyy said.\nWhen asked whether Russian President Vladimir Putin should meet Zelenskyy, Trump said there was “tremendous” hatred between the two leaders.\n“It’s hard for them to be in the same room,” Trump said. “I don’t care how it’s done.”\nStarlink controversy\nTrump’s remarks come as the White House continues to squeeze Ukraine in order to force the country to cut a deal with Russia.\nLast week, Ukrainian officials reported slowdowns with Starshield, the military-grade version of the Starlink satellite system, run by the aerospace company SpaceX.\nUkraine relies on the technology for communications and intelligence to prevent Russian attacks.\nIt is unclear who ordered restrictions that limit Ukraine’s access to Starshield. SpaceX CEO and Trump ally Elon Musk pointed a finger at the White House.\n“Starshield systems are owned and controlled by the US government. Any limits on speed or usage are decided by the US military and ultimately POTUS,” he wrote on October 14.\nThe news agency Reuters also reported that the order came from inside the White House, citing two US officials and a Western official.\nBut a report in The Wall Street Journal on Tuesday claimed US officials had blamed Musk himself for the slowdown, saying the SpaceX CEO ordered it last week. Trump and US Defence Secretary Pete Hegseth have both denied that the government directed the restrictions, with Hegseth pushing responsibility towards SpaceX.\nBuilding ties with Putin\nTrump, meanwhile, has sought to ease the historically tense relations between Russia and the US.\nIn August 2025, Trump invited Putin to Alaska, the Russian leader’s first visit to US soil in a decade.\nMore recently, Trump has expressed openness this month to meeting with Putin and Chinese President Xi Jinping, as part of a trilateral discussion on denuclearisation.\nTrump also announced this month that he struck a deal to obtain diesel from Russia, marking a stunning reversal of years of US pressure on Moscow’s economy.\nThe US president also waived new economic restrictions that would have been imposed under the Lindsey Graham Sanctioning Russia and Iran Act, a bipartisan law he signed one month earlier, in honour of a late senator.\nIt would have imposed sanctions on Russian officials, banks and tankers, as well as tariffs on countries that purchase Russian oil.\nUS Secretary of State Marco Rubio defended the decision on Tuesday, saying the law allowed the waiver through a provision embedded in the legislation.\n“The president chose to use a national security waiver to not immediately implement those [sanctions and restrictions], because he recognises that these things have to be looked at in their totality,” Rubio said in an interview with India’s News18.\nRubio argued that Trump was engaged in a “balancing act” in deciding the extent of US-imposed economic restrictions and how they could impact the rest of the world.\n“When you do that pressure, sometimes it spills over and has a negative impact on other countries,” Rubio said.", "translation_ja": "", "vocab": [{"word": "escalating", "definition": "段階的に高まる、エスカレートする。紛争や緊張が徐々に激化していく状態を表します。"}, {"word": "contentious", "definition": "論争的な、議論の多い。対立や不同意を招きやすい会議や問題を指します。"}, {"word": "trilateral", "definition": "3者間の、3国間の。複数の国や当事者が関与する協議や合意を示します。"}, {"word": "squeezed", "definition": "圧力をかける、締め付ける。政治的または経済的な強制力を使って相手に譲歩させることを意味します。"}]}, {"title_ja": "Trump commits more than $400m ahead of high-stakes midterm elections", "title_en": "Trump commits more than $400m ahead of high-stakes midterm elections", "summary_ja": "The president&#039;s Republican Party seeks to maintain its hold over both chambers of Congress, despite declining polls.", "summary_en": "The president&#039;s Republican Party seeks to maintain its hold over both chambers of Congress, despite declining polls.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/20/trump-commits-more-than-400m-ahead-of-high-stakes-midterm-elections?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Trump commits more than $400m ahead of high-stakes midterm elections\nThe president’s Republican Party seeks to maintain its hold over both chambers of Congress, despite declining poll numbers.\nUnited States President Donald Trump has announced he plans to spend more than $400m to help Republican candidates win the November 3 midterm elections as his party fights to maintain its grip on Congress.\nIn a post on his Truth Social platform on Tuesday, Trump wrote that much of that total had already been spent on campaign outreach.\n“More than 300 Million Dollars has already been spent on Advertising, Direct and Indirect Voter Contact, Rallies, Rally Arenas, Telerallies, Get Out the Vote Programs, Election Integrity, and more,” Trump said.\n“It is my Great Honor to do so on behalf of the Republican Party, which has done so much to bring our Country back from the Edge of Oblivion.”\nHe added that the November vote was “the Most Important Midterm Elections in our Country’s History”.\nThe president offered no detailed breakdown of the spending, including how much would reach individual races.\nBut the promised influx of spending comes as Trump’s Republican Party faces headwinds ahead of the election, including pushback over the economy and the protracted US-Israeli war against Iran.\nIn the lead-up to the vote, Trump’s approval ratings have tumbled to record lows. A poll this week from the news agency Reuters and the research firm Ipsos found that only 31 percent of Americans approved of Trump’s job performance so far.\nSome Republicans have sought to distance themselves from the president as a result. Others have pushed for greater support, particularly for close races with Democrats.\nQuestions have swirled over whether Trump and his allies would tap into the war chest amassed by MAGA Inc, the super PAC named for his “Make America Great Again” movement.\nAs a super PAC — or political action committee — MAGA Inc can raise unlimited sums from donors to support or oppose federal candidates. But its spending is legally required to remain independent of their campaigns.\nLast month, the Campaign Legal Center (CLC), a campaign finance watchdog, accused Trump of violating those rules by claiming control over MAGA Inc’s expenditures.\nThe group cited the president’s public statements, including an exchange with reporters in the Oval Office on September 4, when Trump was asked when the money would start flowing to Republican candidates.\nHe replied that he would spend “whatever amount of money necessary” to help his party. He then added: “This is money from MAGA Inc. This is my money that I control.”\nAccording to its latest federal filing, MAGA Inc entered September with $415.8m in cash reserves, making it one of the most consequential financial resources in the Republican campaign arsenal.\nBut Trump has questioned why the super PAC’s hefty outlay has not improved Republican polling in key races, including in Ohio, according to Reuters.\nOther Trump-aligned groups have also ramped up their political advertising, including two newly formed organisations linked to MAGA Inc, the No Going Back PAC and the Safety and Affordability PAC.\nThe advertisement tracker AdImpact found that the No Going Back PAC contributed $68.7m in political ads last month alone.\nAnother Trump ally, tech entrepreneur Elon Musk, has reportedly spent $366m since last year on Republican campaigns through his group, America PAC, and other Republican and conservative groups.\nIn the final weeks of the midterms, Trump himself has hit the campaign trail, forging ahead with a 32-day campaign blitz. Upcoming stops include South Carolina and Iowa.\nThe stakes of this year’s election are considerable. Control of Congress hangs in the balance.\nCurrently, the Republican Party holds slim majorities in both legislative chambers, but Democrats are seeking to leverage Trump’s declining popularity to flip the Senate and the House of Representatives.\nIf they are successful, they could stymie Trump’s legislative agenda for the final two years of his presidency.", "translation_ja": "", "vocab": [{"word": "midterm elections", "definition": "大統領選挙の中間年（通常2年ごと）に行われる議会選挙。現職大統領の任期中に与野党の力関係が変わることが多い。"}, {"word": "maintain its grip", "definition": "支配権や影響力をしっかり保ち続けること。政治的または経済的な力を失わないようにすること。"}, {"word": "headwinds", "definition": "逆風のこと。比喩的に、目標達成を妨げる困難や障害を意味する。ビジネスや政治の文脈でよく使用される。"}, {"word": "war chest", "definition": "選挙資金や政治活動のために蓄積された資金。競争に備えて確保された大口の資金を指す。"}, {"word": "super PAC", "definition": "政治活動委員会（Political Action Committee）の一種で、献金に制限がなく、無制限の資金調達が可能な政治団体。"}]}, {"title_ja": "Iran security chief rejects moving enriched uranium out of country", "title_en": "Iran security chief rejects moving enriched uranium out of country", "summary_ja": "\"Not even a tiny bit of enriched nuclear material will leave Iran; such materials constitute a major asset and national wealth for the Iranian people, intended for use within the country,\" says Mr. Rezaei, Iran's secretary of the Supreme National Security Council", "summary_en": "\"Not even a tiny bit of enriched nuclear material will leave Iran; such materials constitute a major asset and national wealth for the Iranian people, intended for use within the country,\" says Mr. Rezaei, Iran's secretary of the Supreme National Security Council", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-security-chief-rejects-moving-enriched-uranium-out-of-country/article71605648.ece", "state_media": false, "category": "社会", "full_text": "Iran's security chief Mohsen Rezaei on Tuesday (October 20, 2026) told the visiting Pakistani army chief Asim Munir that Tehran would not allow nuclear material to leave the country, according to state TV.\n\"Not even a tiny bit of enriched nuclear material will leave Iran; such materials constitute a major asset and national wealth for the Iranian people, intended for use within the country,\" said Mr. Rezaei, Iran's secretary of the Supreme National Security Council.\n\"There will be no negotiations until America takes steps to build trust — a process that must begin with the fulfilment of Iran's conditions,\" he added.\nIranian President Masoud Pezeshkian also rejected the idea of negotiations under U.S. threats during his meeting with Munir, who is in Tehran as part of a renewed push to mediate a peace deal between the Islamic republic and the United States.\n\"The Americans must first remove the threats and sanctions; only then can we engage in dialogue,\" he said.\n\"Today, our nation does not trust America. It believes that if we enter the negotiations, they [the Americans] will attack us again.\"\nIran's chief negotiator and parliament speaker Mohammad Bagher Ghalibaf made similar remarks to Munir.\n\"We have nothing new to say; America cannot gain Iran's trust unless it fulfils the seven conditions,\" said Mr. Ghalibaf, noting that \"threats and military manoeuvres cannot influence Iran's strategic decisions\".\nIran has demanded, among other things, a ceasefire across West Asia, the unfreezing of its assets abroad and the lifting of sanctions on its oil sector.\nThe West Asia war was sparked in late February by the United States and Israel when they launched a wave of surprise attacks on Iran, while Washington and Tehran were in the midst of negotiations on Iran's nuclear programme.\nThe warring parties agreed a memorandum of understanding in June that was expected to create a framework for a permanent resolution to the conflict, but the deal did not last long.\nNegotiations have effectively been at an impasse since then, and recent indirect talks between the U.S. and Iran on the sidelines of the UN General Assembly failed to produce a breakthrough.\nTehran had previously maintained it would not hand over its nuclear materials — enriched to 60%, close to the atomic bomb threshold of 90% — to any country but had hinted at the possibility of diluting them within Iran's borders.\nWashington and its allies have imposed waves of sanctions on Iran, accusing it of seeking to build nuclear weapons, a charge Tehran has long denied.\nPublished - October 21, 2026 03:50 am IST", "translation_ja": "", "vocab": [{"word": "impasse", "definition": "交渉や問題解決が進まず膠着状態に陥ること。双方が譲歩しない状況を指す。"}, {"word": "mediate", "definition": "紛争や対立している当事者間に入って仲介・調停すること。中立的な立場から解決を促す。"}, {"word": "fulfilment", "definition": "約束や条件、要求などを完全に満たすこと。実現や成就を意味する。"}, {"word": "sanctions", "definition": "国際的な制裁措置。違反国に対して経済的・政治的な圧力を加える手段。"}, {"word": "threshold", "definition": "敷居、限界、境界線。ある状態から別の状態に移る分岐点を指す。"}]}, {"title_ja": "Zelensky, U.S. envoys hold Oslo talks as Ukraine claims U.S. missil
