e holdup", "title_en": "Zelensky, U.S. envoys hold Oslo talks as Ukraine claims U.S. missile holdup", "summary_ja": "\"Ukraine is working for peace. I thank our partners for their support!\" Mr. Zelensky said in a social media post after his arrival in the Norwegian capital", "summary_en": "\"Ukraine is working for peace. I thank our partners for their support!\" Mr. Zelensky said in a social media post after his arrival in the Norwegian capital", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/zelensky-us-envoys-hold-oslo-talks-as-ukraine-claims-us-missile-holdup/article71605520.ece", "state_media": false, "category": "IT", "full_text": "Ukrainian President Volodymyr Zelensky held talks in Oslo with top U.S. envoys on Tuesday (October 20, 2026) in a bid to get strained relations with Washington \"on a more constructive path\", Norway said.\n\"Ukraine is working for peace. I thank our partners for their support!\" Mr. Zelensky said in a social media post after his arrival in the Norwegian capital.\nMr. Zelensky handed U.S. envoy Steve Witkoff an award in the Norwegian government's official residence, before posing with Norway's Prime Minister Jonas Gahr Støre and Finnish President Alexander Stubb, according to footage accompanying the Ukrainian leader's post.\nMr. Witkoff's fellow U.S. envoy Jared Kushner — U.S. President Donald Trump's son-in-law — was also taking part in the negotiations but was doing so remotely because of illness, according to the NTB agency.\nRelations between Kyiv and Washington have soured since Mr. Trump partially lifted sanctions to strike a diesel-supply deal with Russia's Vladimir Putin and slammed Mr. Zelensky as a warmonger for Ukrainian attacks on Russian oil refineries.\nMr. Zelensky has accused the United States of deliberately withholding vital intelligence and delaying military aid, saying on Monday (October 19) that Ukraine received no early warning of powerful Russian missile strikes that targeted energy facilities in the capital region.\nU.S.-led diplomatic efforts to end Europe's deadliest conflict since World War II have stalled in recent months, as Washington has shifted focus towards the war with Iran.\nThe Norway talks were set to continue into the evening, Store told reporters, with he and Mr. Zelensky set to give a press conference around 7:15 p.m. (1715 GMT)\n\"The aim is to put diplomatic efforts on a more constructive path,\" he said.\n'Needed to protect lives'\nAhead of the meeting, Mr. Zelensky said on Tuesday (October 20) he held \"substantive\" and \"constructive\" talks with U.S. Secretary of State Marco Rubio, in which he insisted that the U.S. military satellite system Ukraine uses, Starshield, \"needs to be restored\" and that ballistic missile interceptors \"are needed to protect lives\".\nMr. Zelensky told U.S. senators on Monday (October 20) that \"the Pentagon is delaying the delivery of missiles\" already paid for by European countries, and that the shipment was waiting for U.S. Defence Secretary Pete Hegseth's signature.\nHe said several European countries were ready to transfer Patriot interceptor missiles from their own stockpiles but were still awaiting U.S. approval.\nThe United States has denied making any changes to intelligence sharing with Ukraine, and Mr. Rubio said on Tuesday (October 20) that Washington was not deliberately withholding supplies.\n\"There's nothing being deliberately denied to Ukraine,\" Mr. Rubio said while on a trip to India.\n\"It's simply, it's a balance between our obligations to other partners and frankly our own... requirements for our own facilities as well.\"\nMr. Trump has also denied ordering a reduction in speeds on the US government-owned and—controlled Starshield network after Elon Musk, whose company SpaceX developed it, said the order could only have come from the White House.\nStrained relations\nThe U.S. leader has accused his counterpart of not trying to resolve the conflict with Russia. \"Mr. Zelensky doesn't know what he's talking about,\" President Trump said on Monday (October 19).\n\"To be honest, I think it's time for somebody else to negotiate on behalf of Ukraine.\"\nMr. Trump said he was ready to meet Mr. Putin and Chinese leader Xi Jinping in China next month to discuss denuclearisation, adding that talks could also cover the Ukraine war — fuelling fears in Kyiv that it was being sidelined.\nKremlin spokesman Dmitry Peskov confirmed earlier that \"the topic of such a hypothetical has indeed been mentioned\" when asked about a Wall Street Journal report on Sunday (October 18) that U.S. President Trump, Russia’s President Putin and China’s President Xi could meet.\nUkrainian Foreign Minister Andriy Sybiga said that such a meeting would \"only encourage Putin to continue this war\".\nNews outlet Axios reported that Mr. Witkoff would travel from Oslo to Russia to meet Putin.\n\"We hope that it will be possible to arrange a meeting in the very near future, allowing the American negotiators... Mr. Witkoff to brief President Putin on their contacts with both the Ukrainians and the Europeans,\" Mr. Peskov told reporters on Tuesday (October 20).\nPublished - October 21, 2026 03:15 am IST", "translation_ja": "", "vocab": [{"word": "envoy", "definition": "外交使節、特使のこと。国家や指導者の代理として交渉や会談を行う外交官を指す。"}, {"word": "soured", "definition": "関係が悪化する、険悪になるという意味。元々は「酸っぱくなる」という意味だが、比喩的に友好的な関係が悪くなる場合に使われる。"}, {"word": "sanctions", "definition": "経済的・外交的な制裁のこと。国家間の対立や違反行為に対する懲罰的措置を指す。"}, {"word": "stalled", "definition": "停滞する、進展しなくなるという意味。交渉や計画が進まなくなった状態を表す。"}, {"word": "substantive", "definition": "実質的な、本質的な内容を持つという意味。表面的でなく、充実した、中身のある話し合いなどに用いられる。"}]}, {"title_ja": "Two men rearrested in U.K. on suspicion of assisting Iran over suspected plot at a U.S.-run air base", "title_en": "Two men rearrested in U.K. on suspicion of assisting Iran over suspected plot at a U.S.-run air base", "summary_ja": "British police have rearrested two men suspected of assisting Iran’s intelligence service in a plot at a U.S.-run air base", "summary_en": "British police have rearrested two men suspected of assisting Iran’s intelligence service in a plot at a U.S.-run air base", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/two-men-rearrested-in-uk-on-suspicion-of-assisting-iran-over-suspected-plot-at-a-us-run-air-base/article71605486.ece", "state_media": false, "category": "政治", "full_text": "British police said Tuesday (October 21, 2026) they have rearrested two men on suspicion of assisting Iran’s intelligence service over a suspected plot at a U.S.-run air base in England last month.\nCounter Terrorism Policing said the men, a 24-year-old British national and a 25-year-old dual U.K.-Iranian national, were arrested under the National Security Act.\nOne of the suspects was first arrested on September 27, when the suspected plot against the U.S.-run base at RAF Fairford took place. The air base in western England has been used to bomb Iran during this year’s war.\nThe second suspect was first arrested on October 1. Until Tuesday (October 20) the men had been bailed pending more investigation.\nScores of residents were evacuated from their homes near the base as armed police officers and army bomb-disposal experts swarmed the rural area. Police later said they had found a quantity of an accelerant — gasoline — in three vans at the site, but no explosives.\nBritish authorities have linked Tehran to the incident, which led the U.S. to pull its bombers from RAF Fairford. Prime Minister Andy Burnham said the apparent plot was “almost certainly” directed by Iran’s Revolutionary Guard, or IRGC.\nIran has denied involvement, although it has previously said that it considers any base used to attack its territory a legitimate target.\nFive other men in their 20s were arrested earlier then released on bail pending further investigation. No one has yet been charged.\nLaurence Taylor, head of National Counter Terrorism Policing in the U.K., said detectives are looking at “many lines of enquiry involved in this hugely complex investigation.”\n“This is very much a live investigation, and our evidence gathering continues, but at this time our position remains the same; we consider it highly likely that there is Iranian state involvement,” he said in a statement.\n“Our investigators are continuing to examine what that level of involvement was and the ambition behind it,” he added.\nLast week the head of Britain’s MI5 spy agency warned that both Iran and Russia were expanding their attacks against the U.K., and that the RAF base incident was not unique.\nKen McCallum, who leads the U.K.’s domestic security service, said Tehran is seeking to intensify its attacks in Britain beyond the traditional targets of Iranians opposed to the country’s Islamic authorities.\nIn all, more than 50 people have been arrested over Iran-linked plots in the past year, Mr. McCallum said.\nPublished - October 21, 2026 02:00 am IST", "translation_ja": "", "vocab": [{"word": "rearrested", "definition": "再逮捕する。以前逮捕された人物が、さらなる容疑で再度逮捕されることを意味する。"}, {"word": "accelerant", "definition": "燃焼促進剤。火災や爆発を加速させるために使用される物質。ガソリンなどの可燃液体を指す。"}, {"word": "Revolutionary Guard", "definition": "革命防衛隊。イランの指導体制を守護する軍事組織。イランの政治権力に直結した勢力。"}, {"word": "domestic security service", "definition": "国内安全保障機関。国内のスパイ活動やテロから国を守る情報機関。MI5やFBIなどが該当する。"}, {"word": "intensify", "definition": "強化する、激化させる。活動や攻撃の規模や強度を増加させることを意味する。"}]}, {"title_ja": "Richard Warnica: If Olivia Chow loses, this will be the reason why - Toronto Star", "title_en": "Richard Warnica: If Olivia Chow loses, this will be the reason why - Toronto Star", "summary_ja": "Richard Warnica: If Olivia Chow loses, this will be the reason why Toronto Star", "summary_en": "Richard Warnica: If Olivia Chow loses, this will be the reason why Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilAJBVV95cUxOLXNwN0VfamtIZlV . The post Ebola: 44 identified contacts to stay isolated for three weeks &#8211; Minister appeared first on Premium Times Nigeria .", "summary_en": "Mr Pate said authorities are treating the case as an imported infection, not community transmission. The post Ebola: 44 identified contacts to stay isolated for three weeks &#8211; Minister appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/918701-ebola-44-identified-contacts-to-stay-isolated-for-three-weeks-minister.html", "state_media": false, "category": "政治", "full_text": "The 44 people identified as contacts of Nigeria’s confirmed Ebola patient will remain in isolation for at least three weeks.\nThe Coordinating Minister of Health and Social Welfare, Muhammad Pate, disclosed this Tuesday evening during an NTA interview, shortly after the ministry announced Nigeria’s first confirmed Ebola case in the Federal Capital Territory (FCT).\nMr Pate said authorities are currently treating the case as an imported infection and not community transmission.\n“At this moment, we are treating it as an imported case, not community transmission,” he said, adding that the situation could change if the virus begins to spread beyond the known contacts.\nHe said the 44 contacts, including healthcare workers, patients, caregivers and travel contacts, are being isolated at a designated facility in Abuja. At the same time, public health teams determine who may have been infected.\n“They remain in communication with their families by phone and other ways, but not physical contact, until we clarify who is infected and who is not,” he said.\nTravel manifest obtained\nThe minister said Nigeria had been conducting risk-based surveillance at points of entry for the past five months through the Nigeria Centre for Disease Control and Prevention (NCDC) and Port Health Services.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe said the aviation industry had also been an important partner in the surveillance effort.\nAccording to Mr Pate, authorities obtained the infected passenger’s travel manifest, which is helping them identify people who may have been exposed.\nHe said the patient was asymptomatic when she entered Nigeria and developed symptoms after arriving in the country.\n“This makes it less likely that the travel itself exposed folks at risk,” Mr Pate said, while noting that authorities were still investigating the circumstances surrounding her entry into Nigeria.\nThe patient, an unidentified woman who recently arrived in Nigeria on an international flight from Uganda, is currently in isolation and receiving medical care at a private hospital in the FCT.\nSymptoms\nMr Pate urged Nigerians and health workers to watch for symptoms including fever, headache, nausea, vomiting, body aches, and severe muscle pain.\nHe said the Ebola variant involved in the current outbreak is different from the Sudan and Zaire variants, adding that bleeding could occur but is less prominent than with some other Ebola variants.\nThe case comes amid an ongoing regional outbreak of Bundibugyo Ebola virus, which the NCDC has been monitoring since the outbreak was reported in the Democratic Republic of the Congo (DRC).\nThe minister also stressed the importance of travel history when assessing suspected cases, particularly among people who have recently travelled to eastern Africa.\nHe said the Abuja patient had no confirmed travel to the DRC, so authorities presumed she was likely infected in Uganda.\nREAD ALSO: Ebola in Abuja: 10 things Nigerians should know about the deadly virus\n“We presume it is likely that it was picked up in Uganda,” he said, stressing the complexity of tracing the source of infectious diseases.\nRegional outbreak continues\nThe Nigerian case comes amid an ongoing Ebola outbreak in the DRC, where the disease has spread across several provinces.\nWHO reported more than 8,700 confirmed cases and more than 4,200 deaths in the DRC as of 6 October, with transmission continuing across dozens of health zones. The outbreak is caused by the Bundibugyo virus.\nKenya reported its first imported case on 6 October: a Kenyan citizen who had been living in the DRC and travelled to Kenya via Uganda.\nOn 20 October, Kenyan authorities confirmed a ninth case involving a close family member of the first patient.\nUganda, from which the Nigerian patient recently travelled, recorded 20 cases between May and June 2026. The country subsequently ended its outbreak after completing the required 42-day period without a new confirmed case.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "asymptomatic", "definition": "症状がない状態を示す医学用語。病気に感染しているにもかかわらず、外部に表れる兆候がない状態を指す。"}, {"word": "surveillance", "definition": "監視や監督活動を意味し、公衆衛生や安全保障の文脈では継続的な観察と情報収集を指す。"}, {"word": "manifest", "definition": "公式な記録や書類であり、特に航空輸送では乗客や貨物の詳細リストを意味する。"}, {"word": "transmission", "definition": "病気やウイルスが人から人へ、または媒体を通じて伝播するプロセスを指す医学用語。"}, {"word": "variant", "definition": "原型からの変異体または派生型を意味し、ウイルスなどの生物学的エンティティの異なる型を指す。"}]}, {"title_ja": "Ebola in Abuja: 10 things Nigerians should know about the deadly virus", "title_en": "Ebola in Abuja: 10 things Nigerians should know about the deadly virus", "summary_ja": "Here are 10 key facts Nigerians should know about the disease, including how it spreads, symptoms to watch for and ways to prevent infection. The post Ebola in Abuja: 10 things Nigerians should know about the deadly virus appeared first on Premium Times Nigeria .", "summary_en": "Here are 10 key facts Nigerians should know about the disease, including how it spreads, symptoms to watch for and ways to prevent infection. The post Ebola in Abuja: 10 things Nigerians should know about the deadly virus appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/918698-ebola-in-abuja-10-things-nigerians-should-know-about-the-deadly-virus.html", "state_media": false, "category": "社会", "full_text": "The confirmation of an Ebola case in Abuja, Nigeria’s capital, has put the country’s health system on heightened alert, 12 years after it successfully contained an outbreak that claimed eight lives.\nThe latest case involves a woman who recently arrived in Nigeria from Uganda and is currently receiving treatment in isolation. Health authorities have identified 44 contacts and commenced intensive tracing and monitoring efforts to prevent further transmission.\nAlthough officials have moved swiftly to contain the case, the development has revived concerns about Ebola, one of the world’s deadliest infectious diseases.\nThe outbreak has been linked in reports to the Bundibugyo virus, a type of Ebola virus for which no licensed vaccine is currently available. However, PREMIUM TIMES could not independently confirm which specific Ebola virus caused the imported case in Abuja.\nEbola is a severe infectious disease that can be fatal without prompt medical attention.\nUnderstanding how the virus spreads, recognising its symptoms and knowing how to protect oneself are essential.\nHere are 10 things Nigerians should know.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n1. Ebola belongs to the Filoviridae family\nEbola disease is caused by viruses belonging to the Orthoebolavirus genus within the Filoviridae family, commonly known as filoviruses. Scientists have identified several species that can cause illness in humans, including Ebola virus, Sudan virus, and Bundibugyo virus. This distinction matters because vaccines and treatments may not be equally effective against every species.\n2. Ebola is one of the world’s most dangerous viral diseases\nThe disease can cause severe illness affecting multiple organs and has recorded fatality rates ranging from 25 to 90 per cent in previous outbreaks. However, survival chances improve significantly when patients receive early diagnosis, rehydration and supportive medical care.\n3. Ebola does not spread through the air\nUnlike COVID-19, influenza or other respiratory infections, Ebola is not airborne. People become infected through direct contact with the blood, vomit, saliva, urine, faeces, or other bodily fluids of someone who is ill with the disease. The virus can also spread through contact with contaminated clothing, bedding or medical equipment.\n4. Symptoms can take up to 21 days to appear\nAccording to the World Health Organisation (WHO), symptoms may develop anywhere between two and 21 days after exposure. Early signs include fever, severe weakness, headache, muscle pain and sore throat. As the illness progresses, vomiting, diarrhoea and, in some cases, bleeding may occur.\n5. Ebola can look like malaria or typhoid\nOne of the challenges in detecting Ebola is that its early symptoms resemble those of common diseases such as malaria and typhoid fever. This is why healthcare workers rely on laboratory testing, travel history and contact history to confirm suspected infections.\n6. Infected people become contagious only after symptoms begin\nA person exposed to Ebola cannot transmit the virus before symptoms appear. Once illness develops, however, the risk of transmission increases significantly through contact with bodily fluids. This is one reason health authorities monitor exposed contacts for 21 days.\n7. Good hand hygiene helps reduce risk\nRegular handwashing with soap and water remains one of the simplest and most effective preventive measures. Alcohol-based hand sanitisers can also help where appropriate. Health officials have advised Nigerians to maintain good hygiene practices and remain vigilant.\nREAD ALSO: Africa CDC calls for urgent global support as Nigeria confirms Ebola case\n8. Avoid contact with bodily fluids and contaminated materials\nPeople should avoid direct contact with the blood, vomit, urine, faeces and other bodily fluids of anyone suspected of having Ebola. Soiled clothing, bedding and medical materials may also harbour the virus and should be handled only by trained personnel using proper protective equipment.\n9. Dead bodies can still transmit Ebola\nThe virus can remain active in the bodies of people who die from the disease. Traditional burial practices that involve washing or touching corpses have contributed to past outbreaks. Health authorities therefore recommend that trained teams manage the burial of suspected or confirmed Ebola victims.\n10. Report symptoms or exposure immediately\nAnyone who develops symptoms after possible exposure should immediately contact public health authorities and seek medical advice. People identified as contacts should fully cooperate with monitoring teams, provide accurate information, and promptly report any symptoms. Early reporting can save lives and help prevent further spread.\nFor now, health authorities are urging calm rather than panic.\nNigeria’s successful containment of the 2014 outbreak demonstrated the eff", "translation_ja": "", "vocab": [{"word": "heightened", "definition": "高まった、強化された。alert と組み合わせて「警戒態勢が強化された」という意味で使われる。"}, {"word": "transmission", "definition": "伝染、感染経路。疾病やウイルスが人から人へ広がることを指す医学用語。"}, {"word": "commenced", "definition": "開始した、着手した。フォーマルな文脈で「begin」や「start」の代わりに使われる動詞。"}, {"word": "fatality rates", "definition": "死亡率、致死率。特に疾病や災害における死亡者の割合を示す統計用語。"}, {"word": "airborne", "definition": "空気感染の、飛沫で伝染する。respiratory infections などと組み合わせて使われ、病原菌が空気中を漂って感染することを意味する。"}]}, {"title_ja": "Protests in France, Spain, other European countries persist", "title_en": "Protests in France, Spain, other European countries persist", "summary_ja": "Right-wing politicians across Europe are seizing the chaos as their moment. The post Protests in France, Spain, other European countries persist appeared first on Premium Times Nigeria .", "summary_en": "Right-wing politicians across Europe are seizing the chaos as their moment. The post Protests in France, Spain, other European countries persist appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/foreign/world-foreign/918693-protests-in-france-spain-other-european-countries-persist.html", "state_media": false, "category": "政治", "full_text": "The protests in France and some other parts of Europe have continued as protesters remain persistent in their call for action over the high cost of living, low wages, poor-quality education, and corruption.\nFrom France to Portugal, Albania, and Italy, social unrest continues. The demonstrations have been marked by looting, injuries, and running battles between the police and rioters.\nIn Spain and Portugal, tent camps have sprung up to protest unaffordable housing amid strong uncertainty among European youth.\nThe unrest comes as far-right parties gain public acceptance and record electoral gains. Europe also faces a critical moment in its support for Ukraine, with President Donald Trump seeking to establish relations with President Vladimir Putin of Russia.\nIn France, it comes ahead of France’s election, which is scheduled to be held in April 2027.\nRight-wing politicians are seizing the chaos as their moment. Experts have said the combination of severe street protests, soaring energy costs, and weak centrist leadership is creating a perfect political climate for anti-establishment campaigns.\nEarlier in the week, Maria Le Pen of the far-right National Rally party attributed the looting and destruction that trailed the demonstrations to the “decades of immigration” to France.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nShe presented her party as capable of restoring order and said President Emmanuel Macron’s leadership no longer has any “credibility or authority.”\nThe politician is already far ahead in recent polls and is considered likely to be the next leader.\nMeanwhile, French authorities said they have arrested over 2,400 people across the country.\nREAD ALSO: Mass protests turn violent in France, spread across Europe\nPortuguese police also arrested 55 people in Lisbon.\nPREMIUM TIMES reported that the violent demonstration in France began as a small school protest at Saint-Exupéry high school in a Parisian suburb on 21 September.\nIt initially attracted little attention, then snowballed into wider social unrest across Europe.\nPresident Emmanuel Macron declared earlier in the week that “nothing justifies” the violence.\nHe said that “listening to the anger” doesn’t mean those who vandalised and looted will go unpunished.\nHe also promised “full transparency” on the police’s response to the protests.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "unrest", "definition": "社会的な不安定や混乱の状態。政治的・社会的な不満から生じる不穏な状況を指す。"}, {"word": "seizing", "definition": "機会や状況を素早く利用・把握すること。政治家が混乱に乗じて権力を得ようとする文脈で使用される。"}, {"word": "credibility", "definition": "信頼性や信用度のこと。指導者が国民からどの程度信頼されているかを示す重要な概念。"}, {"word": "attributed", "definition": "原因や責任を特定の事柄に帰する、～のせいにすること。政治家が社会問題の原因を指摘する際に使われる。"}, {"word": "transparency", "definition": "透明性や開放性のこと。政府や組織が情報を隠さず公開する姿勢を表す。"}]}, {"title_ja": "France Protests Show Europe’s Shift Away From Centrist Politics", "title_en": "France Protests Show Europe’s Shift Away From Centrist Politics", "summary_ja": "Europe’s centrist parties are losing ground among young people and workers, who are increasingly tempted by populist promises of radical change.", "summary_en": "Europe’s centrist parties are losing ground among young people an ", "summary_ja": "On the International Day for the Eradication of Poverty, October 17, China's approach is still a source of inspiration five years after it declared a complete victory over absolute poverty.", "summary_en": "On the International Day for the Eradication of Poverty, October 17, China's approach is still a source of inspiration five years after it declared a complete victory over absolute poverty.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-17/Xi-Jinping-s-key-remarks-on-global-poverty-reduction-1RjPiPHGVgY/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Witkoff plans to present proposal for trilateral talks in Russia — Axios journalist", "title_en": "Witkoff plans to present proposal for trilateral talks in Russia — Axios journalist", "summary_ja": "According to Steve Witkoff, the United States, Ukraine and Europe currently have \"strong alignment at the working level\" on further steps, as well as \"a shared commitment to finding practical solutions to end\" the conflict", "summary_en": "According to Steve Witkoff, the United States, Ukraine and Europe currently have \"strong alignment at the working level\" on further steps, as well as \"a shared commitment to finding practical solutions to end\" the conflict", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2204981", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Fulfillment of previous US commitments would allow Strait of Hormuz to reopen — Iran’s MFA", "title_en": "Fulfillment of previous US commitments would allow Strait of Hormuz to reopen — Iran’s MFA", "summary_ja": "Abbas Araghch added that the “seven-day initiative” put forward by Tehran was “aimed at keeping the diplomatic path open, provided that previously reached agreements are honored", "summary_en": "Abbas Araghch added that the “seven-day initiative” put forward by Tehran was “aimed at keeping the diplomatic path open, provided that previously reached agreements are honored", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2204979", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Trump says he has never discussed Vance’s potential 2028 presidential bid with him", "title_en": "Trump says he has never discussed Vance’s potential 2028 presidential bid with him", "summary_ja": "The US leader noted that JD Vance is \"a very talented person\"", "summary_en": "The US leader noted that JD Vance is \"a very talented person\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2204977", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Brazil Cannot Afford Bolsonaro’s Spending Cuts", "title_en": "Brazil Cannot Afford Bolsonaro’s Spending Cuts", "summary_ja": "If he wins the October 25 runoff, far-right presidential candidate Flávio Bolsonaro plans to slash public spending by as much as 1.5% of GDP. These cuts could push Brazil into recession, hurt workers and small businesses, and drain tax revenue—all without solving the country’s debt problem.", "summary_en": "If he wins the October 25 runoff, far-right presidential candidate Flávio Bolsonaro plans to slash public spending by as much as 1.5% of GDP. These cuts could push Brazil into recession, hurt workers and small businesses, and drain tax revenue—all without solving the country’s debt problem.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/flavio-bolsonaro-planned-tax-and-budget-cuts-could-push-brazil-into-recession-by-laura-carvalho-and-joseph-e-stiglitz-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Brazil Cannot Afford Bolsonaro’s Spending Cuts\nand\nIf he wins the October 25 runoff, far-right presidential candidate Flávio Bolsonaro plans to slash public spending by as much as 1.5% of GDP. These cuts could push Brazil into recession, hurt workers and small businesses, and drain tax revenue—all without solving the country’s debt problem.\nNEW YORK—Brazil faces a stark choice on October 25, when far-right candidate Flávio Bolsonaro and President Luiz Inácio Lula da Silva face off in the country’s presidential runoff.", "translation_ja": "", "vocab": [{"word": "runoff", "definition": "決選投票のこと。複数の候補者がいる選挙で、上位候補が決選投票に進む制度を指します。"}, {"word": "slash", "definition": "大幅に削減する、切り下げるという意味。予算や支出を急激に減らす場合に使われます。"}, {"word": "recession", "definition": "経済不況、景気後退のこと。GDP成長率が連続して低下する経済状況を指します。"}, {"word": "drain", "definition": "徐々に減少させる、枯渇させるという意味。資金や資源が流出して減っていくことを表します。"}]}, {"title_ja": "A Generational Reckoning on the Streets of Paris", "title_en": "A Generational Reckoning on the Streets of Paris", "summary_ja": "As their schools deteriorate and the planet grows hotter, many young people in France do not have hope for a decent future. The recent protests may foreshadow a broader conflict between older generations who wield political power and younger people who must live in the world they leave behind.", "summary_en": "As their schools deteriorate and the planet grows hotter, many young people in France do not have hope for a decent future. The recent protests may foreshadow a broader conflict between older generations who wield political power and younger people who must live in the world they leave behind.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/france-youth-protests-may-herald-generational-showdown-upending-democratic-politics-by-jonathan-levy-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Generational Reckoning on the Streets of Paris\nAs their schools deteriorate and the planet grows hotter, many young people in France do not have hope for a decent future. The recent protests may foreshadow a broader conflict between older generations who wield political power and younger people who must live in the world they leave behind.\nPARIS—After weeks of mounting tension on the streets of Paris, my wife and I decided to take our six-year-old daughter and leave town during Saturday’s protests. When the main demonstration assembled at 2 p.m. at the Place de la République, we were hiking in the forests southeast of Paris near Fontainebleau, once an autumnal retreat and hunting ground for French kings.", "translation_ja": "", "vocab": [{"word": "foreshadow", "definition": "将来の出来事が起こることを前もって示唆する、または暗示すること。ここでは若い世代と年配世代の間の対立が今後さらに大きくなることを示唆している。"}, {"word": "wield", "definition": "権力や影響力を行使する、または操る。年配世代が政治的権力を保持し行使していることを表している。"}, {"word": "deteriorate", "definition": "悪化する、または質が低下すること。学校の状態が徐々に悪くなっていることを意味している。"}, {"word": "mounting", "definition": "徐々に増加する、または高まっていく。パリの通りの緊張が段階的に高まっていることを表している。"}, {"word": "autumnal", "definition": "秋に関連する、または秋らしい。フォンテーヌブローが秋の季節に王たちが訪れた場所であったことを説明している。"}]}, {"title_ja": "The Algorithm Driving French Student Protests", "title_en": "The Algorithm Driving French Student Protests", "summary_ja": "One of the main drivers of the student protests in France is the opposition to Parcoursup, the country’s university-admissions platform, which is widely denounced as opaque and unfair. While such automated decision-making systems do not create educational inequalities, they can exacerbate them.", "summary_en": "One of the main drivers of the student protests in France is the opposition to Parcoursup, the country’s university-admissions platform, which is widely denounced as opaque and unfair. While such automated decision-making systems do not create educational inequalities, they can exacerbate them.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/france-students-protest-against-parcoursup-digital-admissions-system-by-gabriela-ramos-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Algorithm Driving French Student Protests\nOne of the main drivers of the student protests in France is the opposition to Parcoursup, the country’s university-admissions platform, which is widely denounced as opaque and unfair. While such automated decision-making systems do not create educational inequalities, they can exacerbate them.\nPARIS—Hundreds of thousands of young people have taken to the streets in France to protest against the state of the country’s education system. The violence that erupted on October 17 should not eclipse their concerns, which are entirely legitimate: the deplorable conditions at many French schools, including dilapidated buildings, a lack of teachers, overcrowded classrooms, and long school days. They are also deeply opposed to Parcoursup, the country’s university-admissions platform, which has become the lightning rod for their grievances. They have denounced it as opaque, stressful, and unfair.", "translation_ja": "", "vocab": [{"word": "exacerbate", "definition": "問題や状況を悪化させることを意味する。自動システムが既存の不平等をさらに深刻にする場合に使用される。"}, {"word": "eclipse", "definition": "何かをかすませる、または重要性を減らすことを意味する。暴力が学生の正当な懸念を影で隠してしまうという文脈で使われている。"}, {"word": "deplorable", "definition": "非常に悪い、または嘆かわしい状態を表す形容詞。フランスの学校の劣悪な施設や環境を描写するのに用いられている。"}, {"word": "dilapidated", "definition": "老朽化して傷んだ、または荒廃した状態を意味する。建物や施設が長期間放置されて劣化していることを表す。"}, {"word": "opaque", "definition": "不透明で、理解しづらい、または隠された性質を持つことを意味する。大学入試プラットフォームの判定基準が不明瞭であることを批判する文脈で使われている。"}]}, {"title_ja": "Americans, this is your chance to slap down the tech broligarchs", "title_en": "Americans, this is your chance to slap down the tech broligarchs", "summary_ja": "The midterms will be a referendum on the GOP’s alignment with tech overlords over the public they’re meant to serve Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Robert Reich highlighted the link between co", "summary_en": "The midterms will be a referendum on the GOP’s alignment with tech overlords over the public they’re meant to serve Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Robert Reich highlighted the link between co", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/global/2026/oct/19/midterm-elections-tech-broligarchs", "state_media": false, "category": "オピニオン", "full_text": "Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Robert Reich highlighted the link between corruption and affordability. Today’s edition was written by Guardian US columnist Rebecca Solnit. Sign up for future editions here.\n“The world should accept some bad things happening,” Sam Altman, the head of OpenAI, said recently, “for the benefits of this technology and people having the agency.” Like so many things tech oligarchs say, it’s incoherent, since Altman would like to deny the world and the people in it the agency to decide whether or not we should accept his bad things. Surveys show that most Americans would like to pause AI; opposition to AI datacenters is a factor in many races in the midterm elections. People are outraged and anxious about what tech hath wrought, mad enough to fight back in what is coming to seem like a human v machine battle.\nI’ve been a fan of the film Terminator 2 forever, the one where a badass female protagonist leads the action-movie-style spectacular destruction of Skynet, the massive computer system that will otherwise go rogue and pit itself and a plethora of advanced weapons against the human race. We’re not in a film and we’re probably not going to solve the problems big tech creates through spectacular violence, although the guerrilla campaigns to take down, disable or destroy Flock cameras have some action-movie charms (wading through the bureaucratic process of getting cities to reject or take down the surveillance technology is probably more effective.)\nA few months ago, I was surprised to find myself using the term “beautiful hatred” to describe the nationwide revolt against datacenters, Flock cameras, AI, and tech corporations and the oligarchs (or broligarchs) they’ve spawned. It is beautiful because behind fierce opposition to a destructive force is something you’re trying to protect from destruction, something you care about, even love. Behind this revolt against big tech is concern about many things, from the climate to democracy to mental health and humanity itself.\nLike the Trump administration, the tech overlords have proceeded on the assumption they can ignore or override the will of the people. The will of the people is in the process of proving them wrong, at least to some extent, and the midterms will be, among other things, a referendum on the GOP’s alignment with predatory tech giants over the public they’re supposed to serve and, arguably, humanity itself. It’s sometimes said only a common enemy can unite a country, and in that sense Silicon Valley has provided something useful at last, because across the political spectrum people hate datacenters and are working to stop them. Datacenterwatch.org reports that at least 142 activist groups across 24 states have organized to block datacenter construction and expansion.\nOften the foregrounded concerns are about local issues – effects on land, water, electricity prices, noise – since datacenters offer a lot of negatives and, arguably, no real positives, not even more than a handful of local jobs. But behind that is beautiful hatred of the high-handed efforts to bludgeon communities into accepting something for which they’ll get little in return but trouble – and of AI itself. A nine-year-old I spend time with recently remarked: “I don’t trust AI,” more or less out of the blue, and I think she speaks for a lot of us. Never mind my nine-year-old; the pope is speaking up against it, too, saying in a recent social media post: “Algorithms lack the spark of humanity” and calling on us to “safeguard our humanity” against tech’s incursions.\nThe tech leaders onstage with Trump at his second inauguration thought they’d turn him into their golden escalator up; the current revolt suggests they could follow him on the golden escalator down. In San Francisco, more than 1,000 nurses and community members came out in a march in September to demand that hospitals cut ties with Palantir, Peter Thiel’s sinister surveillance corporation that also aids Immigration and Customs Enforcement (ICE). Nurses in the march noted that the software makes significant errors, violates patient confidentiality and the president of the California Nurses Association and National Nurses Organizing Committee said: “The violence and destruction unleashed by immigration agents and enabled by Palantir is a total violation of nursing values of care and compassion.”\nRecent news stories, following former Anthropic safety employee Jacob Coxon’s statements about AI’s near-term apocalyptic risks, were further reminders of the absolute amorality of Altman and Anthropic’s Dario Amodei. The documents for Anthropic’s IPO acknowledged AI models could pose “catastrophic or existential risks to humanity”, and the sheer arrogance of choosing to make profit-driven private decisions about the collective future is another reason to loathe and oppose them. Although there are use", "translation_ja": "", "vocab": [{"word": "incoherent", "definition": "矛盾していて理解しにくい状態。論理的な一貫性がなく、相反する主張や発言を指す。"}, {"word": "oligarchs", "definition": "少数の富豪や権力者が支配する体制における支配者層。特に技術業界の有力経営者を指すことが多い。"}, {"word": "rogue", "definition": "制御不能になり、不正な行動をする状態。本来の目的から外れて危険な行動をすることを意味する。"}, {"word": "plethora", "definition": "大量の、非常に多くの。豊富すぎる量を表す。"}, {"word": "predatory", "definition": "搾取的で、他者に害をもたらす性質。弱者を傷つけることで利益を得る行為を表す。"}]}, {"title_ja": "The Guardian view on Alberta’s referendum: Canada holds together – against Donald Trump | Editorial", "title_en": "The Guardian view on Alberta’s referendum: Canada holds together – against Donald Trump | Editorial", "summary_ja": "Voters’ emphatic rejection of separation strengthens Mark Carney’s energy strategy in the face of a US trade war and threats Canadians are proving to be a voice of sanity. In roundly rejecting the idea of separating from Canada, voters in the oil- and gas-rich province of Alberta sensibly backed the", "summary_en": "Voters’ emphatic rejection of separation strengthens Mark Carney’s energy strategy in the face of a US trade war and threats Canadians are proving to be a voice of sanity. In roundly rejecting the idea of separating from Canada, voters in the oil- and gas-rich province of Alberta sensibly backed the", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/20/the-guardian-view-on-albertas-referendum-canada-holds-together-against-donald-trump", "state_media": false, "category": "オピニオン", "full_text": "Canadians are proving to be a voice of sanity. In roundly rejecting the idea of separating from Canada, voters in the oil- and gas-rich province of Alberta sensibly backed the nation-building strategy of the prime minister, Mark Carney. He has put Alberta at the centre of his plan to make Canada an energy superpower that is “much less dependent on the United States”.\nDonald Trump’s trade war and threats last week to make Canada the 51st US state were a fillip for Mr Carney in Alberta, a landlocked western province where Liberal prime ministers have historically been unpopular. The stakes were high: a successful separatist campaign would have handed Mr Trump leverage over Canada’s resource belt. The result instead lets Mr Carney cast Alberta’s mineral wealth as a national asset, rather than allow separatists to define it as a regional grievance.\nAlbertans were not offered a binding secession vote. They rejected the idea of beginning the process towards such a vote. The early result – roughly 75% against 25% – looks emphatic. For all the separatists’ talk of “success”, Albertans did not buy their tactical argument: that voting for a future referendum would strengthen the province’s hand against Ottawa. However, the sense of alienation in the province is profound: polls show that Albertans think most of the country does not respect the region.\nAddressing that alienation has come at a worrying cost, both politically and environmentally. Mr Carney, who was raised in Alberta’s capital, Edmonton, made a series of pacts with the province’s premier, Danielle Smith. He agreed to back a new 1m-barrel-a-day oil pipeline and tear up environmental rules. Mr Carney has to deliver tangible gains, or else the sizable faction that supports separatism within Ms Smith’s United Conservative party will entrench itself and look for future opportunities to act.\nWhatever replaces the “Let Alberta decide” movement will have an uphill struggle. In his book The Republic of Alberta, the journalist Tyler Dawson wrote that it has “no charismatic leader like René Lévesque, the suave, smoke-wreathed Quebec separatist who took his province to its 1980 secession referendum. There is no culturally entrenched canon of nationalist literature to fill Alberta bookshelves. The province has no unique language or race or faith that binds its residents together.” Yet victory this month for the Lévesque-founded Parti Québécois in provincial elections reveals that separatists can win power despite their raison d’etre being unpopular.\nTo those who witnessed the Brexit referendum, the Albertan poll offered a depressing rerun of nationalist gripes and political fantasy. The easy assurance that sovereignty can be recovered painlessly is wearily familiar. Keith Wilson, an architect of Alberta’s separatist movement, calling the task of founding a country “super easy” will prompt a sense of deja vu. Perhaps most importantly, Blackfoot leaders saying that separatists regarded treaty nations as a “speed bump” is a sign that the sovereigntists have not caught up with the fact that First Nations’ rights are belatedly being recognised as a critical part of Canada’s constitutional makeup.\nCanada’s unity is a political achievement that is continually negotiated among regional interests, Québécois nationhood, Indigenous people’s rights, new arrivals and the continental pull of the US. Paradoxically, the insecurity that characterises Canadians keeps them in check – and holds the nation together. Or as one of the country’s most famous novelists put it: Canada is “not a country you love, it is a country you worry about”.\n- Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": [{"word": "fillip", "definition": "弾みをつけること、後押しすること。ある事象や出来事が人や組織に与える追い風や動力のこと。"}, {"word": "entrench", "definition": "強固に根付く、定着する。ある立場や考え方が深く定着して、変えにくくなった状態を表す。"}, {"word": "charismatic", "definition": "カリスマ的な、魅力的な指導力を持つ。人々を引きつけ、影響力を持つ人物の特性を指す。"}, {"word": "alienation", "definition": "疎外感、隔絶感。ある集団や地域が他からの尊重や理解を得られていないという感覚。"}, {"word": "tangible", "definition": "具体的な、形のある、実質的な。抽象的ではなく、実現可能で測定可能なものを指す。"}]}, {"title_ja": "Trump’s obsession with Ilhan Omar has reached a dangerous new level | Arwa Mahdawi", "title_en": "Trump’s obsession with Ilhan Omar has reached a dangerous new level | Arwa Mahdawi", "summary_ja": "The administration seems intent on stripping the congresswoman of her US citizenship and deporting her. It’s a terrible abuse of power What do you think it is about Ilhan Omar, exactly, that seems to get under Donald Trump’s tangerine-tinted skin? The president has claimed he has a problem with the ", "summary_en": "The administration seems intent on stripping the congresswoman of her US citizenship and deporting her. It’s a terrible abuse of power What do you think it is about Ilhan Omar, exactly, that seems to get under Donald Trump’s tangerine-tinted skin? The president has claimed he has a problem with the ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/20/trumps-obsession-with-ilhan-omar-has-reached-a-dangerous-new-level", "state_media": false, "category": "オピニオン", "full_text": "What do you think it is about Ilhan Omar, exactly, that seems to get under Donald Trump’s tangerine-tinted skin? The president has claimed he has a problem with the progressive Democratic congresswoman because she is “unpatriotic” to the US and “disrespectful … to Israel”. However, the extent of his animus towards Omar, the first Somali American in Congress, suggests there’s more to it. Trump has insisted he is “the least racist person there is anywhere in the world”, so I’m sure it has nothing to do with the fact that she’s brown and Muslim. Truly, it’s a mystery.\nWhatever the reason, Trump’s not a fan. The president has plenty of enemies, but few have been attacked as ferociously and consistently over the years as Omar. He’s called her “garbage”, among other nasty names, suggested (without evidence) that she married her brother, and said she “should be thrown the hell out of our country”. His supporters have echoed his calls to deport Omar, who fled war-torn Somalia as a child and became a naturalised US citizen at 17.\nNow Trump’s obsession with Omar has reached a dangerous new level. Trump isn’t just throwing out insults any more; his administration seems intent on stripping the congresswoman of her US citizenship and deporting her. Last Monday, 22 days before the November midterms in which Omar is seeking re-election, federal agents raided her house in Washington DC. Her phone was seized and grand jury subpoenas were reportedly issued to some of her relatives as part of an investigation concerning her immigration paperwork. Trump, by the way, denied any involvement. Just a curious coincidence that one of his biggest nemeses is now being treated like a criminal.\nAs House Democratic leaders have said, the raid on Omar’s house “raises serious questions about the continued corrupt weaponisation of the federal government against Donald Trump’s adversaries”. But it also raises another question: is this “just” a stunt designed to embarrass and intimidate Omar before the midterms? Or is there a real possibility that the congresswoman could be denaturalised and deported?\n“Certainly, if the evidence points that way, that could happen,” Tom Homan, Trump’s “border czar”, told Fox News over the weekend when asked about Omar being deported. “We’ll let the evidence lead where it leads, but she’ll be held to the same standard you and I are held: if she violated the law, then she’ll be held accountable,” Homan added.\nOh, please. I know the Mar-a-Lago set are big on Botox, but I can’t believe Homan was able to preach about accountability with a straight face. Not many people are convicted of 34 felonies and face no jail time. Trump, however, is in the White House rather than prison because the supreme court’s conservative majority (which he helped create) found that former presidents are entitled to a degree of immunity from criminal prosecution.\nThe US government has every right to uphold its immigration laws, but its appetite seems to vary considerably depending on the person. If Homan really is so keen on accountability, may I suggest he take a look at the Trump megadonor Elon Musk? The tech mogul’s brother, Kimbal Musk, has publicly joked about the fact that the brothers briefly worked in the US without proper documentation in the 1990s. (Elon said it was a “grey area”.) And then there’s Melania Trump: in 2016, the Associated Press reported the first lady was paid for 10 modelling jobs in the US before she had legal permission to work in the country. (Melania has denied ever violating the terms of her immigration status.)\nOmar was just a teenager when her father filled out the paperwork that led to them both being naturalised. I obviously have no idea if there were any errors in that. But I can tell you that this “investigation” is not about accountability. It is a terrifying abuse of power that reflects the way in which the Trump administration is weaponising the immigration system to stamp out dissent. We’ve already seen Trump deport noncitizen student activists to crack down on pro-Palestinian speech. Now he’s applying that strategy to Omar, a sitting congresswoman. As Barack Obama warned at the weekend, “If this becomes the new normal, there’s no reason to believe it will stop with her.” Indeed it won’t; Trump is just getting started.\nArwa Mahdawi is a Guardian columnist", "translation_ja": "", "vocab": [{"word": "animus", "definition": "敵意や悪意。特定の人物や集団に対する強い負の感情を表す。"}, {"word": "ferociously", "definition": "激しく、猛烈に。攻撃や批判が非常に激しい様子を描写する際に使用される。"}, {"word": "denaturalised", "definition": "帰化市民権を剥奪する。国籍取得後にその市民権を失わせる法的プロセスを指す。"}, {"word": "weaponisation", "definition": "武器化する行為。本来の目的以外の目的で、特に政治的に権力を使用することを意味する。"}, {"word": "nemesis", "definition": "主な敵対者や因果応報。特に対立する相手や自分の不運の原因となる人物を指す。"}]}, {"title_ja": "The Limits of American Power", "title_en": "The Limits of American Power", "summary_ja": "William McRaven, a retired four-star admiral and a major figure in American military affairs, uses history and his personal experiences to make an authoritative case that American leaders frequently overestimate the potential of military force to achieve political ends—and that new technologies like", "summary_en": "William McRaven, a retired four-star admiral and a major figure in American military affairs, uses history and his personal experiences to make an authoritative case that American leaders frequently overestimate the potential of military force to achieve political ends—and that new technologies like", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/limits-american-power-william-mcraven", "state_media": false, "category": "オピニオン", "full_text": "The war in Iran is far from the first time that U.S. policymakers have failed to appreciate the limits of American power. But the Trump administration’s use of military force against the Islamic Republic since February 28 offers a particularly glaring example of a mistake that has often characterized American strategy in recent decades. The war was launched without a clear rationale and with a constantly shifting set of objectives—from changing Tehran’s regime and squelching its nuclear ambitions to, more recently, reopening the Strait of Hormuz, which wasn’t closed until the war started. The results, not surprisingly, have been bad both for U.S. interests and for the Middle East.\nStill, to focus only on the blunders in Iran is to miss a deeper problem in U.S. foreign policy—one that preceded and will outlast Donald Trump’s presidency. Although the particular missteps in Iran may stem from the shortcomings of this president and the team around him, the overestimation of the potential of military force has been a growing feature of American strategy since at least the end of World War II. A tendency to wish away the limits of power accounted for some of the greatest mistakes of U.S. statecraft during the Cold War, with Vietnam the clearest and most consequential example. Yet despite an apparent commitment to internalizing the lessons of that overreach, this American delusion—our excessive faith in the capacity of military power to achieve victory and thereby fundamentally political ends—has gotten worse rather than better, especially in the past quarter century.\nAnd unfortunately, there is good reason to worry that the delusion will deepen in the years ahead. Presidential power is becoming increasingly personalized as the constraints on it continue to erode. The politicization of the military (along with the diplomatic corps and intelligence communities) is making it less likely that policymakers will receive the best advice, including frank warnings about risks and costs. And the rise of artificial intelligence and new weapons technologies reinforces a sense of complete battlefield awareness and mastery, feeding superpower hubris. The risk of overreach has never been higher, at a time when the damage from overreach is becoming more difficult to repair.\nWIN EVERY BATTLE\nIn April 1975, Colonel Harry Summers, a member of the U.S. delegation dealing with postwar issues in Vietnam, was meeting in Hanoi with a North Vietnamese counterpart, Colonel Tu. “You know, you never defeated us on the battlefield,” Summers observed. To which Tu replied, “That may be so, but it is also irrelevant.”\nSummers went on to write a seminal book about the war, On Strategy: A Critical Analysis of the Vietnam War. His key takeaway was simple: there are limits to American power that are neglected at immense cost. War is, and always has been, a contest of human will, shaped by heroism and cowardice, fear and elation, chance and uncertainty; no matter how superior a military force, it is not guaranteed strategic victory.\nThe book became required reading for many military officers, including me. I had joined the Naval ROTC unit at the University of Texas two years before the encounter between Summers and Tu. The draft had just ended, and the fall of Saigon was still to come, but discussion of Vietnam consumed our ranks. As I studied the American failure, I came to see that a great strength had become a fatal liability: our fundamental faith that we, the United States of America, had to win and thus would. We had won World War I, we had won World War II, and we had at least fought to a draw, holding off the North Koreans and Chinese, in Korea. And somehow, at all costs, we would win in Vietnam.\nTo believe you can win is important. It inspires troops and keeps the public engaged. But when the commitment to winning is not coupled with sound policy judgment, when the principles of war are disregarded in the false belief that technology or firepower can overcome the inherent frictions of combat, when tactical successes are viewed as a guaranteed path to a strategic win, when the cost in blood and treasure rises inexorably while any claim to righteousness collapses, it is essential to reassess. In Vietnam, the answer to mounting losses was simply “more”—more troops, more bombs, more money. To lose the fight was seen as anathema to all we stood for; we would keep fighting in spite of the increasingly evident limits to our power. When the end finally came with the rushed U.S. withdrawal from Saigon in 1975, many military and political leaders could still not understand how the United States had won nearly every skirmish, battle, and fight but lost the war.\n The damage from overreach is becoming more difficult to repair.\nThe military I entered in 1977 was struggling in the aftermath of Vietnam. The “peace dividend” meant a dramatic drawdown in manpower and money. Readiness was at an all-time low across the services—army enlistment had fallen by 60", "translation_ja": "", "vocab": [{"word": "rationale", "definition": "行動や決定の根拠となる理由や論理的根拠。政策や戦略を正当化する基本的な理由を意味する。"}, {"word": "overestimation", "definition": "何かの価値や能力を実際以上に高く評価すること。特に戦略や政策において、その効果を過度に見積もる傾向を指す。"}, {"word": "statecraft", "definition": "国家や政府が外交や政治戦略を巧みに運用する技術や能力。特に国際関係における政治的手腕を意味する。"}, {"word": "overreach", "definition": "自分の力や権限の限界を超えて行動すること。野心的だが実現不可能な目標を追求する傾向を指す。"}, {"word": "politicization", "definition": "本来は中立的であるべき組織や機関が政治的な影響を受けること。政治的な立場や利益が優先されるようになる過程を意味する。"}]}, {"title_ja": "The Fog of Tech", "title_en": "The Fog of Tech", "summary_ja": "Mara Karlin, a defense policy expert, argues that war planners’ obsession with new technologies like AI and drones has the potential to make them blind to the realities of war fighting. Using examples from Gaza, Ukraine, and Iran, Karlin shows how this technology trap leads to false assumptions abou", "summary_en": "Mara Karlin, a defense policy expert, argues that war planners’ obsession with new technologies like AI and drones has the potential to make them blind to the realities of war fighting. Using examples from Gaza, Ukraine, and Iran, Karlin shows how this technology trap leads to false assumptions abou", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/fog-tech-artificial-intelligence-mara-karlin-ai", "state_media": false, "category": "オピニオン", "full_text": "At a time when debates about national security tend to be polarized along partisan and ideological lines, there is one thing analysts and policymakers across the political spectrum seem to agree on: the future of warfare will be determined by technology. Hypersonic missiles, quantum computing, drone swarms, and artificial intelligence have all been hailed as transformative technologies that will shape battlefields, remake strategies, and upend established military doctrines.\nWithout question, these technologies are already having a tremendous impact. In Gaza, Iran, Lebanon, Ukraine, and elsewhere, every party with the capacity to employ artificial intelligence and autonomous systems has done so—in the air, on land, and at sea, and at times in massive numbers. And there is also no question that in order to maintain its status as the world’s preeminent fighting force, the U.S. military must ensure that it has the most sophisticated and cutting-edge capabilities available. To continue developing and operationalizing these technologies, defense planners should prioritize scaling and integrating them and developing innovative operational concepts to employ them. The risk of being overtaken by rivals such as China is real.\nBut an equally significant risk exists: call it “the technology trap,” in which policymakers develop a misplaced sense of certainty about how innovations will change war and what warfare will look like in the future, while not paying enough attention to the unchanging fundamentals of war. An excessive focus on the role of technology would be shortsighted and lead militaries in dangerous directions, especially if planners are highly confident about how new capabilities will develop and make decisions in line with that confidence—which will almost certainly be misplaced.\nFor war planners, faith in technological answers can obscure the most fundamental questions: Who kills, who dies, and who decides? In the post–Cold War era, this myopia has contributed to dreadful outcomes in Afghanistan, Iraq, Ukraine, and Gaza. In the decade to come, as U.S.-Chinese tensions persist, the fog of tech could help pave the way for a disastrous great-power war. Policymakers should worry less about getting the right technology at the right time and more about how fixating on technology might make them lose sight of the essential elements of war and find comfort in false certainty.\nTHROUGH A GLASS, DARKLY\nMore than 50 years ago, the military historian Michael Howard famously cautioned that future wars are unknowable. “I am tempted indeed to declare dogmatically that whatever doctrine the Armed Forces are working on now, they have got it wrong,” he wrote. “I am also tempted to declare that it does not matter that they have got it wrong. What does matter is their capacity to get it right quickly when the moment arrives.”\nBut Howard may have been a bit too sanguine about the costs of getting it wrong. For Americans, the paradigmatic example from recent history is how the U.S. military’s technological prowess in the 1990–91 Gulf War seemed to herald a new, high-tech American way of war that would guarantee victory in the post–Cold War era. Instead, Washington slowly and painfully learned that the technological advantages that beat Saddam Hussein’s regime could not defeat insurgencies in Afghanistan and Iraq during the post-9/11 wars.\nPredicting the role of technology in future wars has become even harder today thanks to the speed, scale, and complexity of contemporary technological progress. In the past, transformative innovations tended to be expensive at their outset—in resources or personnel—or required specialized knowledge and skills accessible to only a few. Think of the combined power of the rifle, the railroad, and the telegraph in the nineteenth century, or fighter jets and nuclear weapons in the twentieth century. By contrast, many of today’s technologies have low barriers to entry: they are cheap to produce, and access to the knowledge necessary to make them has been democratized and globalized. Enemies today often face each other on more equal battlefields, making it trickier for war planners to understand when and for how long new tools will confer an outsize advantage.\n In Ukraine, fishermen’s nets are one of the most effective antidrone defenses.\nFocusing too much on procuring the shiniest equipment also obscures the ways that high-end technology works in tandem with more basic tools. In the 2010s, defense planners failed to account for this dynamic when predicting future battlefields, which they believed would be dominated by sophisticated platforms. In 2017, a senior Pentagon official declared that the F-35 stealth fighter would be “a war winner.” The 2018 National Defense Strategy, drafted under the direction of Elbridge Colby, who now serves as undersecretary of defense, anticipated that a few primarily high-end capabilities—including advanced computing, artificial intelligence, robotics, hypersonics, a", "translation_ja": "", "vocab": [{"word": "polarized", "definition": "異なる立場や意見が対立して、二つの極端な側に分かれている状態。政治的または社会的な議論が分裂しているときに使用される。"}, {"word": "doctrine", "definition": "軍事や政治などの分野における基本的な原則や理論的枠組み。組織が従うべき公式な指針や信条を指す。"}, {"word": "operationalizing", "definition": "理論的な概念や計画を実際に機能する運用システムに変換するプロセス。戦略を実践的な行動に移すことを意味する。"}, {"word": "myopia", "definition": "視野が狭く、長期的な視点や広い視野を欠く傾向。比喩的に、近視眼的な思考や判断の欠如を表す。"}, {"word": "obscure", "definition": "何かを不明確にする、または隠す。重要な事実や本質的な問題を見えにくくする、または曇らせることを意味する。"}]}, {"title_ja": "Empires of AI", "title_en": "Empires of AI", "summary_ja": "In this essay, Niall Ferguson, one of the world’s foremost experts on imperial history, teams up the former CEO of Google, Eric Schmidt, and the researcher Lisa Klaassen to make the provocative argument that AI is an inherently “imperial technology”—and to reveal what the fate of past empires might ", "summary_en": "In this essay, Niall Ferguson, one of the world’s foremost experts on imperial history, teams up the former CEO of Google, Eric Schmidt, and the researcher Lisa Klaassen to make the provocative argument that AI is an inherently “imperial technology”—and to reveal what the fate of past empires might ", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/empires-artificial-intelligence-ferguson-klaassen-schmidt", "state_media": false, "category": "オピニオン", "full_text": "In the span of a few years, China and the United States have each assembled something future historians might recognize as a new kind of empire. Their dominions extend not merely over territory, trade routes, and airspace but over knowledge itself. By controlling the large language models, chips, physical infrastructure, and capital that provide the foundations for advanced machine cognition, Beijing and Washington are not only attaining new heights of economic performance and power projection; they are also setting the terms of all future scientific and intellectual progress. The term “AI superpowers” fails to capture the influence and reach that these rivals now wield. Even without active alliance building or coercion, they can make all other countries that seek access to advanced AI beholden to them.\nImperial history carries a warning. In the absence of other forces, empires seldom succumb to a challenger or to barbarians at the gates. More often, they fail because defending their vast dominions drains them dry, whether of material resources, the consent of the governed, or the loyalty of elites. The imperial center finds it can no longer maintain control over the periphery—the regions that once submitted to it. Failure can be financial, as it was for the British Empire after 1945, when the debts of two world wars forced London to liquidate its imperial assets to pay the price of victory: a welfare state for the citizens of the imperial metropole. It can be institutional, as it was for the Qing empire in the late nineteenth century, when it failed to industrialize, reform its bureaucracy, and renew the legitimacy of the Manchu dynasty.\nOr it can be technological. The Royal Navy’s Dreadnought of 1906 gave the United Kingdom the first “all big gun” battleship and, with the same stroke, rendered its existing battle fleet obsolete. Overnight, this breakthrough opened the way for rivals such as Germany, erasing a century of accumulated British advantage. The resulting arms race forced the United Kingdom to nearly double naval spending between 1900 and 1914 and clashed with the Liberal government’s new social spending commitments, such as the Old Age Pension Act of 1908. The decisive question in the contest between Beijing and Washington may therefore not be who achieves artificial general intelligence first, but who can bankroll the race.\nAI is imperial in two ways. On the one hand, China and the United States had empire-like qualities before the AI race began: Washington, the incumbent, pairs global military primacy with an alliance system no rival can match. It also supplies the currency for the lion’s share of international trade and transactions. Beijing, often described as the challenger, combines industrial and supply chain dominance with the world’s largest navy and a tightening grip on the physical and digital infrastructure of countries across Africa, Asia, and Latin America. For both, AI is a way to extend the power they already wield. But AI is also by its nature an imperial substance. Whoever produces and controls frontier models acquires global leverage over innovation, production, science, culture, and, ultimately, advanced thought. Much as silver underwrote Habsburg Spain and oil defined the “American century,” this new commodity will not merely enrich the powers that dominate it but also provide the basic operating system on which everyone else must depend.\nWhat distinguishes the AI empires from their forerunners is not ambition but velocity. The familiar imperial arc—expansion, overreach, strain, unraveling—once played out across a century or even a millennium. Today, that process is happening at machine speed. The question is whether the new hegemons can convert their particular endowments—the United States’ capital markets, frontier labs, and transistors and China’s state direction, cheap energy, and watts—into durable imperial orders or whether they will run aground trying.\nSUPREMACY BY SCARCITY\nAn empire is more than a great power. It is a polity whose authority and influence extend over vast territories and peoples without their express consent. Throughout history, empires have differed in almost every respect: in their form of government at home, in the kinds of resources they seek to control, in how their authority is sustained. They may be autocracies or republics; they may rely on soldiers and settlers or civil servants and chartered companies. Yet the underlying vector of power never changes. A center commands, and a periphery obeys. In practice, the most durable empires have relied on informal collaboration with local elites, whereas brutally coercive ones tend to be short-lived. Of course, any form of state power must not only monopolize violence but also be able to wield it. What sets empires apart is the capacity to elicit submission across immense distances. And they occur throughout history for a reason: by exploiting economies of scale, empires can achieve dominance and deliv", "translation_ja": "", "vocab": [{"word": "dominions", "definition": "支配下の領土や地域。帝国が統治する広大な地域全体を指す。"}, {"word": "periphery", "definition": "中心から離れた辺縁部や周辺地域。帝国の中心部に対する外側の領域を意味する。"}, {"word": "liquidate", "definition": "資産を売却して現金に変える、または廃止する。帝国が資産を売却して債務を返済することを指す。"}, {"word": "rendered obsolete", "definition": "時代遅れにする、無用にする。技術革新により既存のものが価値を失うことを表現する。"}, {"word": "bankroll", "definition": "事業や活動に資金を提供する。AIレースのような大規模な競争を財政的に支える力を意味する。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-20 23:29 JST";
  renderTabs();renderList();
})();
</script>
