picks Finland for its largest single investment in Europe\n- Published\nGoogle will buy up to half the electricity produced by one of Finland's nuclear power plants as part of a record €13bn (£11bn; $15bn) investment in the country's AI infrastructure, the company announced.\nThe US tech giant said the package would fund three new data centres, expand an existing site and support energy projects to power growing demand for AI services.\n\"This is Google's largest single investment in Europe and a testament to Finland's leadership in responsibly building AI infrastructure,\" the company said on Wednesday.\n\"Google's decision is a clear testament to our strengths,\" Finland's Prime Minister Petteri Orpo said in a statement.\nAs part of the deal, Google signed a 22-year contract with Finnish utility Fortum to buy up to 50% of the output from the Loviisa nuclear power plant.\nEarlier this week, TikTok announced a $1bn investment in Finland to build a new data centre in Kouvola, pointing to the country's \"strong digital infrastructure, clean energy mix, robust data governance and skilled tech talent\".\nFinland has emerged as an attractive location for data centres because of its cool climate, plentiful low-carbon electricity and relatively uncongested power grid. The colder temperatures can reduce the energy needed to cool facilities packed with computer servers.\nTechnology companies are racing to secure power supplies as the AI boom drives demand for vast networks of data centres.\nThe Google investment is expected to support more than 37,000 jobs during construction and boost Finland's GDP by €3.6bn a year, according to Google. Construction is set to take place in 2027 and 2028.\n\"The value of the data economy extends far beyond direct investment into spurring innovation, research and development,\" Orpo added.\n\"Deepening our collaboration with Google will deliver lasting benefits for both parties.\"\nGoogle will build new data centres in Kajaani, Muhos and Vaala, while expanding its existing facility in Hamina, which it established after converting a former paper mill in 2009.\nThe infrastructure will help support products such as its AI chatbot Gemini, alongside services including Search, Maps and YouTube.\nGoogle said the investments also covered \"clean energy projects, and dedicated nature and community funds to support local biodiversity, education, research, and workforce development\".\n\"Google is proud to deepen our roots in Finland,\" said Ruth Porat, president and chief investment officer of Alphabet and Google.\n\"This investment underscores Google's commitment to grow our presence responsibly, pairing the expansion of our technical infrastructure with new energy capacity, grid enhancements, and energy affordability initiatives,\" she added.\nEarlier this year, Google's parent company Alphabet raised its global spending plans to as much as $205bn as it sought to expand computing capacity for AI services.\nThe agreement with Fortum provides long-term financial certainty for the Loviisa plant, which currently generates about 10% of Finland's electricity.\nFortum said Google's commitment would support an investment programme aimed at extending the life of the nuclear station and increasing its generating capacity.\nRelated topics\n  - Published6 days ago\n  - Published14 October 2025\n  - Published26 August", "translation_ja": "", "vocab": [{"word": "testament", "definition": "明白な証拠や証明。「～の証拠である」という意味で使用され、ビジネス文脈では企業の実績や強みを強調する際に用いられる。"}, {"word": "plentiful", "definition": "豊富に存在すること。資源やエネルギーが十分にあることを表し、ビジネスや環境の文脈で頻繁に使用される。"}, {"word": "uncongested", "definition": "混雑していない状態。電力網やインフラが過負荷でなく、充分な容量があることを意味する。"}, {"word": "boom", "definition": "急速な経済成長や需要の急増。ここではAI関連の急速な発展を指し、ビジネス分野で業界の急速な拡大を表現する際に使用される。"}, {"word": "spurring", "definition": "～を促進または刺激すること。事業活動や研究開発を活性化させる、という意味で使用される。"}, {"word": "biodiversity", "definition": "生物多様性。生態系内に存在する異なる生物種の多様性を指し、環境保全の文脈で重要な概念である。"}]}, {"title_ja": "米国とフーシ派の攻撃後、原油が1バレル100ドルに上昇", "title_en": "Oil Hits $100 a Barrel After US and Houthi Strikes in Gulf Region", "summary_ja": "米国がイラン船舶を攻撃し、イランの革命防衛隊が報復としてタンカーと米軍基地を攻撃した後、原油価格は7月以来の最高水準である1バレル100ドルに急騰しました。湾岸地域の紛争の激化とフーシ派によるサウジアラビアの石油施設への無人機攻撃、および新しい海運禁止区域設置の脅威により、世界的なエネルギー供給が混乱し、ガソリン価格が世界中で上昇しています。", "summary_en": "Oil prices surged to $100 per barrel on Wednesday, the highest level since July, following military strikes by the US on Iranian tankers and retaliatory attacks by Iran's Revolutionary Guards on vessels and a US base. The escalating conflict in the Gulf region, combined with Houthi drone attacks on Saudi oil facilities and threats to establish a new shipping exclusion zone, has disrupted global energy supplies and driven up petrol prices worldwide.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cyvznqypz0yo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Oil hits $100 a barrel for first time since July after US and Houthi strikes\n- Published\nOil prices rose to $100 (£74) a barrel on Wednesday, after the US and Iran attacked tankers in the Gulf region and Yemen's Houthis hit oil facilities in Saudi Arabia.\nOvernight, the US said it struck five Iranian tankers in retaliation for Iran's targeting of a warship, while Iran's Revolutionary Guards said they attacked eight tankers and two warships in response, as well as a US base in Jordan.\nThe Guards also said they planned a new \"prohibited zone\" for shipping that extended beyond the Strait of Hormuz into the Arabian Sea.\nThe Iran-backed Houthis reported dozens of Saudi strikes in Yemen, a day after drone and missile attacks caused fires at several oil facilities in Saudi Arabia.\nThe escalating conflicts pushed the price of Brent crude, the global benchmark, to its highest level since late July, when Iran and the US resumed hostilities after a one-month lull.\nA barrel was priced at $100.70, up 2.83% compared to Tuesday, on Wednesday afternoon.\nBefore the US and Israel's war with Iran began in February, Brent crude had been priced at about $70 (£52) a barrel.\nBut Iranian missile and drone attacks on commercial shipping and a US naval blockade of Iranian ports resulted in the effective closure of the Strait of Hormuz waterway in the Gulf, through which 20% of the world's oil and liquefied natural gas (LNG) shipments usually pass.\nThe Houthis have also been targeting Saudi energy infrastructure and tankers in the Red Sea since July, when a four-year ceasefire in Yemen began unravelling.\nThe rising oil costs have sparked leaps in petrol prices around the world for motorists.\nThe US military's Central Command (Centcom) said early on Wednesday that its latest strikes destroyed four Iranian oil tankers linked to Iran's Islamic Revolution Guard Corps (IRGC) in the Gulf of Oman - Kaviz, Charminar, Horizon 1 and Riesco - and a fifth tanker - Derya - near Kharg Island, in the northern Gulf, which hosts Iran's main terminal for exporting oil.\nUS forces directed the crews to abandon ship before the vessels were struck, it added.\nCentcom said the attacks came after the IRGC launched ballistic missiles at a US warship in the region twice in two days. It added that the warship \"successfully evaded\" the missiles and that no American troops were harmed.\nThe IRGC said its Aerospace Force launched missiles at US maintenance facilities, hangars and aircraft at Muwaffaq Salti Air Base in Jordan overnight in retaliation for the US strikes.\nJordan's armed forces said they intercepted 20 Iranian missiles and two others fell in unpopulated areas, with no casualties were reported.\nLater, the IRGC said its navy also attacked two US Navy destroyers and eight oil tankers in the Strait of Hormuz, causing \"heavy damage\" to the vessels.\nCentcom said the claim that the IRGC struck two of its warships was false.\nThe UK Maritime Trade Operations agency said it had received reports of several merchant vessels in the northern Gulf and the Gulf of Oman being \"subject to disabling fire as part of ongoing military activity in the region\".\nIt also reported that one vessel 24 nautical miles (45km) north-west of Port Rashid, in the United Arab Emirates, was seen \"listing while at anchor, possibly indicating water ingress following an attack from an unknown projectile\".\nIraqi authorities said they extinguished a fire on a Panama-flagged tanker, New Andros, that was carrying two million barrels of fuel oil when it was hit by a drone in the Gulf.\nOn Wednesday afternoon, IRGC spokesman Hossein Mohebi told Iranian state TV that it would soon announce the co-ordinates for a new \"prohibited zone\" covering \"part of the Sea of Oman and another part of the Arabian Sea, along the route that can lead to the Strait of Hormuz\".\n\"If a vessel enters that area without co-ordination, it will be subject to our sanctions,\" he said.\nWhen asked by reporters about the latest tit-for-tat strikes, US Secretary of State Marco Rubio said on Tuesday that the situation was \"pretty straightforward\".\n\"Iran continues to try to hit US naval ships. And, for every time they do that or try to do that, they're going to lose tankers. And I think you'll see that again today,\" Rubio told reporters during a trip to Colombia.\nThe US strikes on Tuesday came hours after Iran's Navy said it had seized an uncrewed US submarine in the Strait of Hormuz.\nUS Navy Capt Tim Hawkins, a spokesperson for Centcom, said an \"underwater drone operated by US forces malfunctioned more than a day ago\" and that it had been used to survey regional waters.\nSaudi Arabia and the Houthis, an Iran-backed group that controls much of north-western Yemen, have also been exchanging fire.\nFollowing a wave of air strikes on Sunday and Monday, the Houthis accused Saudi Arabia of bombing a prison in Hazm. The group's military spokesman Yahya Sarea said on Wednesday that the bodies of 23 civilians had so far been pulled from the rub", "translation_ja": "", "vocab": [{"word": "retaliation", "definition": "相手の攻撃に対する報復行為のこと。国際紛争や軍事衝突の文脈で、一方の攻撃に応じて他方が行う反撃を指します。"}, {"word": "escalating", "definition": "段階的に激化・拡大していく状況を表現する動詞。紛争や問題が徐々に深刻になることを示します。"}, {"word": "disrupted", "definition": "通常の流れや機能を妨害・中断させることを意味する動詞。供給チェーンやサービスが中断される状況で使用されます。"}, {"word": "maritime", "definition": "海や海運に関連する形容詞。海での商業活動や海上交通、海洋法などの文脈で用いられます。"}, {"word": "exclusion zone", "definition": "立ち入りが禁止された区域を指す用語。軍事紛争や危険地域で人や物の進入を制限する際に使用されます。"}, {"word": "benchmark", "definition": "比較や評価の基準となる指標を意味する名詞。ブレント原油は世界の石油価格の標準指標として機能します。"}]}, {"title_ja": "警察、改革UK党の外国献金を犯罪捜査対象に", "title_en": "Police Launch Criminal Investigation into Reform UK Foreign Donations", "summary_ja": "メトロポリタン警察は、Channel 4 Newsの潜入報道により外国資金法違反の疑いがかかった改革UK党に対する犯罪捜査を開始しました。党の高級幹部らは、500万ポンドに上る外国からの献金を確保するため選挙法を回避する方法について議論する映像に映っていました。捜査は選挙委員会と王立検察庁と連携して実施されています。", "summary_en": "The Metropolitan Police has opened a criminal investigation into Reform UK following allegations that the party violated foreign funding laws, prompted by an undercover Channel 4 News report. Senior Reform aides were recorded apparently discussing methods to circumvent electoral law to secure foreign donations totalling £500,000. The investigation is being conducted in coordination with the Electoral Commission and Crown Prosecution Service.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cp3k72k1y3vo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Police launch criminal investigation into Reform UK donations\n- Published\nThe Metropolitan Police is carrying out a criminal investigation into Reform UK over allegations it broke foreign funding laws, following a broadcast by Channel 4 News last week.\nAn undercover reporter recorded two senior Reform aides apparently suggesting a way around electoral law to secure foreign party donations, one of which would have totalled £500,000.\nThe police investigation by the Met's Special Enquiry Team is being folded into an inquiry that has been under way into other donations to the party.\nA Reform UK spokesman said the party \"denies any wrongdoing and will fully cooperate with the investigation\".\n\"We won't be commenting further while a live investigation is under way.\"\nA Met spokesperson said it had received \"a number of reports relating to donations and polling involving a political party\", after the film by Channel 4 News and Verbatim Investigations was shown on Thursday evening.\nIn its statement, the Met Police said: \"All allegations under investigation relate to potential offences under the Political Parties, Elections and Referendums Act 2000.\"\n\"Detectives continue to liaise closely with the Electoral Commission and Crown Prosecution Service as enquiries progress.\"\nThe police spokesperson said detectives were seeking to obtain footage relating to the broadcast.\nAn Electoral Commission spokesperson said the Channel 4 News report included \"serious allegations of wrongdoing\", adding: \"It is right that these are properly and thoroughly investigated by the police.\n\"In parallel, we are also considering all relevant information and regulatory steps.\"\nThe film overshadowed the party's conference in Birmingham and led to the party losing two key figures - Dan Jukes, chief of staff to the leader Nigel Farage, and James Orr, head of policy.\nIn the news report, an undercover investigator posing as the son of an American donor is recorded raising a concern that his father wouldn't be able to directly donate to the party within the law.\nElectoral law states that to be a permissible donor to a UK political party you must be a UK registered voter, or a company registered in the UK.\nJukes appears to suggest that the donation could be in the UK-based son's name, although the money would have come from his American father.\nElsewhere, James Orr, the party's head of policy suggests that the father could pay for opinion polling to support one of Reform's campaigns.\nFarage and Jukes were also filmed at a lunch in Clacton where it is suggested the US donor, who was being played by an actor, gives £500,000 to Reform through his son.\nFarage told the BBC he \"frankly wasn't listening\" to the discussion about the potential donation. Channel 4 News has said the payment was never made.\nHe dismissed the comments made by his aide in the film as \"loose pub talk including a couple of boasts that simply were not true\".\nJukes has denied \"any wrongdoing\" and said he had \"stepped back from politics in order to clear my name\".\nLast week, Orr told Sky News he would cooperate with the party's internal investigation \"fully\".\nThe Met had already been investigating whether payments to Reform in the weeks before the last election complied with donation laws.\nThe probe is examining donations given directly to the party by Fiona Cottrell, mother of longstanding Nigel Farage ally, George Cottrell.\nIt is also examining payments from a company controlled by Reform's deputy leader Richard Tice, which received £1m from Fiona Cottrell in June 2024.\nA Verbatim Investigations spokesperson said: \"Verbatim will cooperate with the police's investigation.\"\nLabour Party Chair Bridget Phillipson said: \"Farage needs to wake up and realise the buck stops with him.\n\"Reform's failure to take responsibility for their actions shows just how unfit they are for office.\"\nThe Liberal Democrat's Cabinet Office spokeswoman Lisa Smart said: \"Every Reform MP urgently needs to state whether they or their campaigns have benefited from any foreign money.\"\nZack Polanski, leader of the Green Party in England and Wales, said: \"Nigel Farage and Lee Anderson hoped they could pin all this on two of their most senior advisors, but they have more questions to answer about how much they knew.\"\n- Why Reform UK undercover donations claims are legally complicated \n  - Published4 days ago\n- Reform UK winded by donations row as insiders call for shift in approach \n  - Published4 days ago\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": [{"word": "undercover", "definition": "身分を隠して秘密裏に活動する、潜入調査の。このニュースでは、記者が実際の身元を隠して改革UK党の幹部と接触し、違法行為の証拠を集めた。"}, {"word": "circumvent", "definition": "法律や規則を巧妙に回避する。ここでは、選挙資金法の規制を逃れるための方法を示唆することを意味する。"}, {"word": "permissible", "definition": "法律上または規則上許可される、認められた。選挙法では、英国登録有権者または英国登録企業のみが政党への献金者として認められている。"}, {"word": "liaison", "definition": "関係機関間の連絡・調整、また連絡役。警察が選挙委員会と検察庁と情報交換しながら捜査を進めることを指す。"}, {"word": "allegations", "definition": "証拠がまだ不確かな段階での主張や告発。この場合、改革UK党が外国資金法に違反したという疑いのこと。"}, {"word": "regulatory", "definition": "規制に関する、監督当局による。選挙委員会が法的規制に基づいて調査・監督する行動を指す。"}]}, {"title_ja": "輸送大臣、航空管制の障害は回避可能だったと指摘", "title_en": "Air traffic failure was avoidable, says transport secretary", "summary_ja": "英国の航空管制システムNatsが火曜日に4時間の技術的障害を経験し、2,000便以上がキャンセルされた。輸送大臣ハイディ・アレクサンダーは、この事故は回避可能であったと述べ、民間航空局とNats自身による独立調査を命じた。これは3年間でNatsの3度目の大規模なシステム障害である。", "summary_en": "The UK's air traffic control system operated by Nats experienced a four-hour technical failure on Tuesday, causing over 2,000 flight cancellations. Transport Secretary Heidi Alexander stated the incident was avoidable and ordered independent investigations by the Civil Aviation Authority and Nats itself. This marks the third major system failure at Nats in three years.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5y42v5n05do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Air traffic failure was avoidable, says transport secretary\n- Published\nA technical failure of the UK's air traffic control system that has caused widespread flight chaos was avoidable, according to the Transport Secretary.\nHeidi Alexander told the Commons she had ordered an independent investigation by the aviation watchdog into the system operated by Nats, which went down for four hours on Tuesday.\nMore than 2,000 flights have been cancelled as disruption continued for a second day with passengers stuggling to fly out of and into the UK.\nAfter meeting with the boss of Nats, Martin Rolfe, Alexander said a cyberattack could be ruled out, but she added: \"I do not believe this issue was unavoidable.\"\nNats has apologised for its third major technical fault in three years.\nAlexander said she discussed with Rolfe how Nats, which is 49% owned by the government, \"responded to resolve and minimise the disruption as quickly as possible\".\nShe said there had to be \"tough questions about resilience of Nats systems\", adding: \"We also need to think about consumer redress issues.\"\nEarlier on Wednesday the government said it had confidence in Rolfe, who has led Nats for 11 years as airlines such as Wizz Air and Ryanair called for him to step down.\nNats has been asked to investigate the incident and report back in one week. But Alexander said she has also asked the Civil Aviation Authority to conduct an independent review and present an update in six months' time.\nAirlines UK, which represents the country's carriers, said it had written to Alexander to \"register serious concerns over yesterday's technical failure at Nats - the third major system failure in three years - which has caused major disruption across the UK's aviation network\".\nAirlines UK's chief executive Tim Alderslade, said: \"The result is a system where airlines pick up the bill for the mistakes of others, while the organisations responsible face little or no financial consequence.\n\"Accountability should sit where responsibility lies and the Civil Aviation Bill offers the opportunity to address this.\"\nThe UK Civil Aviation Authority said passengers are unlikely to be entitled to compensation - though it reminded airlines of their responsibilities to look after passengers who flights had been delayed or cancelled.\nIt added that the disruption caused by the Nats issue is \"likely to be considered the result of 'extraordinary circumstances'\", meaning passengers \"are unlikely to be entitled to compensation for delays or cancellations that were directly caused by the incident.\"\n- What are my rights if my flight is cancelled or delayed? \n  - Published14 hours ago\n- 'It's been a nightmare': Passengers face airport chaos after air traffic issue \n  - Published6 hours ago\nIt is not the first time disruption has blighted Nats' control system. In 2023, a computer shutdown over the August bank holiday weekend caused chaos for 700,000 passengers.\nIt took an engineer, who had been unable to correct the fault from home, three hours to get to work.\nThere was another, smaller Nats outage in 2025, which caused 150 cancellations.\nNats is a public-private partnership, with the government holding the majority stake. The rest is split between a group of UK airlines including BA, easyJet and Virgin Atlantic as well as Heathrow and Nats staff.\nWhat do we know so far about the glitch?\nNats first confirmed it was investigating a \"technical issue\" at 13:46 BST on Tuesday, \"which is causing some disruption to flight departures\".\nThe glitch occurred at Nats' Swanwick Centre in Hampshire, where one of its two air traffic control centres are. The other is in Prestwick, Ayrshire.\nAround 90 minutes later, it said it had identified that the issue was with its flight processing system.\nThis processes flight plans and other operational information used by controllers to manage air traffic.\nIt continually updates flight information as aircraft progress through UK airspace, helping controllers maintain a safe and orderly flow of traffic.\nBy 19:30, Nats said the system issue had been resolved and it was working to clear the backlog of flights.\nHowever, by Wednesday evening, the number of flights that had been cancelled or failed to take off since the fault first emerged had grown to more than 2,000, according to flight analytics firm Cirium.\nAccording to tracking site FlightRadar24, the worst affected airports were Heathrow, Gatwick, Manchester and Birmingham.\nA Heathrow spokesperson said on Wednesday its \"operations are recovering\".\n\"Flights are operating today but we are expecting knock-on impacts as aircraft and crew reposition,\" it said.\nAt Gatwick, a spokesperson said: \"Flights have now resumed from London Gatwick. However, we still anticipate that it will take time for our operations to fully return to normal.\"\nManchester, Luton, Stansted, Bristol, and Belfast City Airports all said on Wednesday that flights had resumed, though Bristol, Belfast and Luton said there continued to be knock-on eff", "translation_ja": "", "vocab": [{"word": "avoidable", "definition": "防ぐことができる、避けられる状態を意味する形容詞。技術的または管理的な問題が事前に対策できたことを示します。"}, {"word": "resilience", "definition": "システムが障害から回復する能力、または困難に対する耐性を指します。ここではNatsのシステムの堅牢性と信頼性に関する懸念事項です。"}, {"word": "cyberattack", "definition": "コンピュータシステムへの悪意のあるオンライン攻撃。この記事では、技術障害の原因がサイバー攻撃ではないことが確認されました。"}, {"word": "extraordinary circumstances", "definition": "異常な状況、予測不可能で通常と異なる事態を指す表現。航空業界では補償責任を免除する法的要件です。"}, {"word": "accountability", "definition": "責任を持つこと、自分の行動について説明義務を果たすこと。記事では組織が過ちに対して責任を取るべきことを強調しています。"}, {"word": "operational information", "definition": "システムや組織を運営するために必要な実務的な情報。航空管制では飛行計画やトラフィック管理データを含みます。"}]}, {"title_ja": "バーナム首相、国防費増加のための社会保障削減は許容できないと述べる", "title_en": "National Security Can't Come at Expense of Social Security, Burnham Says", "summary_ja": "英国のアンディ・バーナム首相は、福祉給付金削減による国防費増加への保守党からの圧力を拒否し、政府は2035年までにGDPの3.5%を国防に配分しつつ、教育・雇用支援を通じて福祉費も削減できると主張した。バーナムは住宅給付金削減により大量のホームレスが発生すると述べ、国家安全保障は社会保障の犠牲にはできないと強調した。", "summary_en": "UK Prime Minister Andy Burnham rejected Conservative pressure to cut welfare benefits to fund increased defence spending, insisting the government can achieve both 3.5% GDP defence spending by 2035 and reduce the welfare bill through education and employment initiatives. Burnham argued that cutting housing benefit would cause mass homelessness and that national security cannot come at the expense of social security.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5yw3223w1vo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "National security can't come at expense of social security, Burnham says\n- Published\nAndy Burnham has said national security \"can't come at the expense of social security\", as he was challenged over funding for defence at Prime Minister's Questions.\nConservative leader Kemi Badenoch pressed Burnham over whether he would spend 3% of GDP on defence by 2030 and how he would pay for this.\nThe PM said the government's commitment to defence was \"absolute\" and he would set a target date to reach the 3% figure in the spring.\nBurnham said he would fund defence and get the welfare bill down in \"the Labour way\", by changing education, supporting young people and providing more mental health support.\nThe Conservatives seized on the comments, with a party spokesperson saying: \"Britain heard it loud and clear today: Andy Burnham will not cut welfare to fund the defence of our country.\n\"The prime minister is prioritising the ballooning benefits bill over our national security. Shameful.\"\nAfter PMQs, Burnham's team was at pains to stress his commitment that \"national security is the most important duty of any government\", and stressed the prime minister had been \"consistent about getting the welfare bill down\".\nBut they said that did not mean \"crude cuts\" that could \"put people into crisis\" by making them homeless and so creating higher costs elsewhere in the system to support them.\n- Badenoch accuses Burnham of kicking defence spending into the long grass \n  - Published6 days ago\n- British army told to stop non-essential training exercises to save money \n  - Published6 days ago\nIn the Commons session, Burnham repeated that the government would meet the Nato target of spending 3.5% of GDP on defence by 2035, with a target date for hitting the 3% figure set out in the spending review in the spring.\nThe PM said he had appointed John Healey, who resigned as Sir Keir Starmer's defence secretary over the government's failure to commit to a 3% increase by 2030, \"because of his strong commitment to the defence of this nation\".\nHowever, Badenoch hit back that 2035 was \"a decade away\" and \"the threats are now\".\nShe questioned whether Burnham was \"unable\" or \"just unwilling\" to meet the 2030 target.\nIn response, Burnham insisted: \"This chancellor of all chancellors will be willing to provide that funding to our armed forces.\"\nHowever, he rejected a Conservative plan to partly fund increased defence spending by saving at least £4bn through reforms to housing benefit.\n\"I don't think, myself, that taking £4bn out of housing benefit is going to get the right consensus around this issue because that would create levels of homelessness in this country... that we wouldn't have seen before, hundreds of thousands of children in temporary accommodation,\" he said.\n\"Yes, we do everything to support our national security, but it can't come at the expense of social security.\"\nHe added: \"This side of the House will not be forced to choose between the two and we will set out a plan to get to 3.5% by 2035 at the spending review.\"\nBadenoch said Burnham's comments were \"unbelievable\", adding: \"We need to fund our defence, not spend all of our money on welfare.\"\nBurnham insisted he would \"bring the welfare budget down\" by tackling the number of young people not in education, employment or training.\n\"That's the Labour way to get the welfare bill down,\" he said.\n\"That is the right way to fund defence.\"\nBadenoch accused Burnham of being \"continuity Keir\".\n\"He's pretending that he's the change candidate. But the fact is, he's still failing to cut welfare,\" she said.\nAs prime minister, Sir Keir attempted to cut disability benefits but was forced to row back on the plans in the face of opposition from Labour MPs.\nCutting the welfare bill is a key part of Tory proposals for funding increased defence spending.\nSpending on benefits has ballooned in recent years and is forecast to rise to £408.6bn in 2030/31, according to figures from the Department for Work and Pensions.\nThere is particular concern about the nearly one million young people in the UK who are not in education, employment or training – known as \"Neets\".\nThe government has asked former minister Alan Milburn to look into the issue and he is expected to publish his final recommendations for how to tackle the problem shortly.\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": [{"word": "consensus", "definition": "広く受け入れられた意見や合意。複数の関係者が同意する状態を指す。"}, {"word": "pragmatic", "definition": "実用的で実際的なアプローチ。理論よりも現実的な結果を重視する方針や判断。"}, {"word": "ballooning", "definition": "急速に増加・拡大すること。特に予算や支出が予想以上に膨れ上がる状況を表す。"}, {"word": "continuity", "definition": "継続性や連続性。政策や立場が変わらずに続いている状態。"}, {"word": "row back", "definition": "以前の立場や決定から後退すること。政策や提案を撤回・修正する。"}, {"word": "crude cuts", "definition": "単純で配慮に欠ける削減。細かい検討なく一律に削る政策。"}]}, {"title_ja": "グーグル、フィンランドにAIおよびエネルギー投資135億ユーロを発表", "title_en": "Google Announces €13 Billion AI and Energy Investment in Finland", "summary_ja": "グーグルはフィンランドのAIインフラと原子力エネルギーに135億ユーロを投資することを発表し、同社のEUにおける最大単一投資となります。この契約はデータセンター、エネルギーグリッドの改善、および22年間にわたるロヴィーサ原子力発電所の出力の50%購入契約を含みます。フィンランド当局は経済的利益と雇用創出を強調していますが、外国資本所有のデータセンターが北欧国家に潜在的なリスクをもたらす可能性について懸念が提起されています。", "summary_en": "Google announced a €13 billion investment in AI infrastructure and nuclear power in Finland, marking the company's largest single investment in the EU. The deal includes data centers, energy grid improvements, and a 22-year agreement to purchase 50% of output from Finland's Loviisa Nuclear Power Plant. While Finnish officials highlight economic benefits including job creation and GDP growth, security concerns have been raised about foreign-owned data centers potentially posing risks to the Nordic nation.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/finland-google-announces-€13-billion-ai-energy-investment/a-79208034?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Finland: Google announces €13 billion AI, energy investment\nSeptember 10, 2026\nUS tech company Google on Wednesday announced that it would be investing €13 billion ($15.1 billion) in AI infrastructure in Finland as well as penning a massive deal to buy nuclear power in the Nordic country over the next two decades.\nThis year, Google parent company Alphabet increased global investment to around $200 billion as it rushes to catch up in the AI race. Wednesday's announced deal is Google's biggest single investment in the EU to date.\nSince repurposing a former paper mill in the coastal city of Hamina in 2009 and transforming it into a data center, Google has steadily increased its presence in the country.\nThe northern location offers two advantages, cold Arctic temperatures mean it needs less energy to cool energy hungry servers and the fact that Finland only has 6 million residents would seem to provide relief from the growing resistance that such projects are running up against in the US and elsewhere.\nGoogle is not alone in looking to chilly Finland with its cheap nuclear, wind and hydroelectric energy supply to expand its business — Microsoft and TikTok parent ByteDance have also set up shop — with dozens of data centers being built in the country over the past few years.\nAttracting data center investment has been a priority for Finland's right-wing Prime Minister Petteri Orpo as the nation confronts record unemployment and slow economic growth.\nGoogle makes big claims about boosting Finnish GDP and creating jobs\nIn a statement, Google said the investment, scheduled to be doled out in 2027 and 2028, will include data centers, electrical grid improvement, and clean energy and battery projects for its chatbot, search and map services.\nThe company claims the investment will pump some €3.6 billion into Finland's GDP and create 37,000 jobs, with 7,000 being permanent and others coming during the construction phase.\nPrime Minister Petteri Orpo echoed Google's rosy outlook for his country's economy, emphasizing that it would spur further investment while downplaying fears that Google's project could drive up energy prices and gobble up resources.\"This investment is historical in Finland,\" said Orpo. \"This makes us a front-runner in digitalization and AI.\"\nOrpo said Google is, \"committed to ensuring that electricity production in Finland remains sufficient and that prices remain under control.\"\nThe tax-avoiding US company said the deal was, \"a testament to Finland's leadership in responsibly building AI infrastructure.\"\n\"Now we are building more in Hamina, expanding that site on a remarkable level, and we are opening up data center operations in three new locations in the municipalities of Kajaani, Muhos and Vaala,\" said Antti Jarvinen, the company's director of operations for Finland.\nBeyond skyrocketing energy consumption, Finland's data center boom presents a potential security risk\nWednesday's deal also includes a purchase agreement for 50% of energy output from one of Finland's two nuclear power plants for the next 22 years according to plant operator Fortum, which will team up with the tech giant to explore new nuclear and renewable projects in the country.\nFortum shares jumped 15.5% on news of the deal, pushing them to their highest level in over four years and making the company the biggest winner on European stock exchanges for the day.\n\"We call this BYOP — bring your own power,\" said Google President and Chief Investment Officer Ruth Porat, who noted, \"This is Google's first nuclear energy deal outside of the United States.\"\nFortum said the deal would allow it to \"continue operating the Loviisa Nuclear Power Plant until the end of its operating licenses in 2050,\" adding that without it, the plant, which currently supplies about 10% of Finland's electricity, would not have been able to continue operations past 2030.\nOverall, Finland's data center boom is expected to create a massive spike in energy consumption, with network operator Fingrid forecasting a 40% jump over the coming years.\nBeyond the environmental and energy concerns raised by such deals, Finland's Security and Intelligence Service (SUPO) has also issued explicit warnings that foreign-owned data centers pose potential security risks for the Nordic nation.\nSUPO is concerned that municipalities may be weighing the economic potential of data centers more heavily than the security risk associated with them, noting that despite data center investments being fundamentally good for Finland there may be concerns if their owners are linked to authoritarian countries like Russia or China.\nSUPO says authoritarian states may, for instance, try to use Finland to circumvent restrictions and sanctions on technology exports. For example, for advanced chips currently banned from export to China.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.\nEdited", "translation_ja": "", "vocab": [{"word": "infrastructure", "definition": "大規模なプロジェクトを支える基盤となる施設や体制のことで、この文脈ではデータセンターやエネルギー供給網などの技術的基盤を指します。"}, {"word": "circumvent", "definition": "法律や制限を巧妙に回避するという意味の動詞で、正面から対抗するのではなく、迂回的に規則を避ける行為を表します。"}, {"word": "authoritarian", "definition": "権力の集中と個人の自由の制限を特徴とする政治体制を指す形容詞で、民主的でない国家体制を説明する際に用いられます。"}, {"word": "repurpose", "definition": "既存の施設や物資を元々の目的とは異なる新しい目的のために再利用することを意味します。"}, {"word": "rosy", "definition": "前向きで楽観的な見通しや見解を表す形容詞で、将来が明るく良好であると述べるときに使われます。"}, {"word": "spike", "definition": "急激な増加や上昇を意味する名詞または動詞で、データやグラフが急速に上がる現象を指します。"}]}, {"title_ja": "ノルウェー首相：ゼレンスキー大統領の飛行機、モルドバ上空でロシアドローンにほぼ衝突", "title_en": "Norway's PM: Zelenskyy's Plane Nearly Hit by Russian Drone Over Moldova", "summary_ja": "ノルウェーのヨナス・ゲーア・ストール首相は、ウクライナのゼレンスキー大統領の飛行機がモルドバからオスロへ向かう途中、ロシアのドローンにほぼ衝突したと報告した。モルドバ政府はドローン警報により領空を閉鎖し、ロシアのシャヘッドドローンがその後モルドバ領土に墜落したことを確認した。この事件はゼレンスキー大統領の旅行中における絶え間ないセキュリティの脅威を浮き彫りにしている。", "summary_en": "Norwegian Prime Minister Jonas Gahr Store reported that Ukrainian President Volodymyr Zelenskyy's aircraft was nearly struck by a Russian drone while departing from Moldova en route to Oslo for King Harald V's funeral. Moldova's government confirmed airspace closure due to a drone alert, with a Russian Shahed drone subsequently crashing on Moldovan territory. The incident highlights the constant security threats facing Zelenskyy during his travels.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/norway-s-pm-zelenskyy-s-plane-almost-hit-by-drone/a-79207528?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Norway's PM: Zelenskyy's plane almost hit by drone\nSeptember 9, 2026\nNorwegian Prime Minister Jonas Gahr Store said on Wednesday that a plane carrying Ukrainian President Volodymyr Zelenskyy from Moldova to Oslo for the funeral of Norway's recently deceased King Harald V was almost hit by a drone.\n\"His flight was almost hit by a drone when it was taking off from Moldova. That is the reality he lives in,\" Store told Norwegian public broadcaster NRK, adding that Zelenskyy had left Norway for Canada, where he would meet with leaders in Ottawa.\nStore provided no further details about the incident, which reportedly happened on Tuesday, as Zelenskyy was en route from Moldova to Norway.\nMoldova's government spokesperson said later on Wednesday that the flight was delayed when the country's airspace was closed over a drone alert. The spokesperson said in a statement that Zelenskyy's plane was able to depart after a Russian drone came down on Moldovan territory.\nThe Ukrainian president arrived in Oslo on Tuesday evening. In the Norwegian capital, he held talks with Foreign Minister Espen Barth Eide and Finance Minister Jens Stoltenberg regarding military aid, including air-defense support, as well as civilian assistance.\nOn Wednesday, Zelenskyy then joined other foreign dignitaries at the funeral of King Harald.\nRussian drone in Moldova\nMeanwhile, neither Ukrainian authorities nor Zelenskyy himself have commented on the drone incident.\nA claim that Zelenskyy was at risk was described as \"exaggerated\" by the source.\nAccording to the Institute for the Study of War (ISW) — a US think tank — a Russian drone flew in Moldovan and Romanian airspace for about an hour on Tuesday.\nThe ISW said the defense ministries of Moldova and Romania both reported that a Shahed drone entered Moldovan airspace from Ukraine, flew over Romania, and then returned to Moldova, where it crashed.\nHowever, it is unclear whether this was the same drone mentioned by Store and the Moldovan government spokesperson.\nEdited by: Dmytro Hubenko\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "dignitaries", "definition": "高い地位や名誉を持つ人物のこと。特に国家行事や式典に参加する要人や高官を指す。"}, {"word": "airspace", "definition": "国や地域の上空の領域で、法的に支配される空間のこと。領空とも呼ばれ、主権が及ぶ範囲。"}, {"word": "exaggerated", "definition": "実際より大げさに、または過度に表現すること。事実を拡大解釈して伝えることを意味する。"}, {"word": "drone alert", "definition": "ドローンの存在や脅威を警告するシステムまたは警告状態のこと。航空管制が危険を検知して発令する。"}, {"word": "Shahed drone", "definition": "ロシアが使用する無人攻撃機の一種。イランの設計に基づいた巡航ミサイル型のドローンである。"}]}, {"title_ja": "中国、英語を成績評価対象の必修科目から外すことを検討", "title_en": "China Debates Removing English as Graded Core Subject", "summary_ja": "中国の数学教授が、英語を学校と大学の必修科目から廃止することを提案し、オンラインで議論を巻き起こしています。同教授は、ほとんどの学生にとって不要な科目に過度なリソースが費やされていると主張しています。AI翻訳の進化を支持する声がある一方で、英語教育の削減は中国の国際競争力と研究能力を害する可能性があると懸念する声も上がっています。", "summary_en": "A Chinese mathematics professor has sparked online debate by proposing that English be removed as a mandatory graded subject in schools and universities, arguing it consumes excessive resources for most students. Supporters cite AI translation capabilities, while opponents warn that reducing English proficiency could harm China's global competitiveness and research capabilities.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/china-english-to-be-removed-as-a-graded-core-subject/a-79199629?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "China: English to be removed as a graded core subject?\nSeptember 9, 2026\nFrom business and academia to social media and entertainment — English is considered the dominant global language. One in five people on Earth actively uses this lingua franca. In China, a mathematics professor specializing in vector algebra is now challenging this dominance in no uncertain terms. Tang Jiafeng believes that English should be abolished as a core subject in elementary schools, secondary schools and universities.\nTang is convinced that no other country in the world has placed as much importance on English as China has.\n\"Our children desperately begin learning English even before they have properly mastered their native language. Yet we are a civilization that dates back thousands of years. English is just a tool. It's enough to be able to use it. The tradition of revering and emulating Western cultures must come to an end,\" Tang says in social media.\nEnglish as a required subject starting in third grade\nEnglish is considered difficult in China, since the Chinese language does not use an alphabetic script. It is a required subject starting in third grade. It is graded on par with Chinese and mathematics on the entrance exam for secondary schools, the central exam after 9th grade, and the high school graduation exam. A maximum of 150 points can be earned on the latter.\n\"How many resources and how much time do our children, parents and schools invest in a subject that is completely irrelevant to the majority of people in their future professional lives?\" the mathematician asks, explaining his position.\nHe became well-known because many of his students achieved full scores on state math exams; in the class of 2011, six students from a single class did so.\nWhy English? 'AI translates'\nTang's opinion spread quickly online.\n\"Why cram for English when artificial intelligence can translate everything in seconds?\" comments a user from Beijing.\nAnother suggestion from the southern province of Guangdong is to at least adjust the scoring — for example, to 120 points instead of 150 on the high school graduation exam.\nMany parents invest in private tutoring that focuses specifically on exam questions. In addition, all bachelor's students must pass the English exam before being admitted to master's programs. Tang suspects that this could cause many young talents in the natural sciences to fail, even though they have great potential to become top researchers.\nNo English proficiency, no competitiveness\nThere is no question that English is also important for STEM subjects. Research on future-oriented topics is typically published in English. There are fears circulating online that cutting back on English instruction could lead to a decline in China's competitiveness. A prominent advocate for English as a required subject is Hu Xijin, former editor-in-chief of the state-run \"Global Times,\" who has previously drawn attention primarily for his nationalistic statements.\nHu emphasizes that foreign language skills are of great importance for every global citizen, \"because we live primarily in the present,\" alluding to a debate over the ungraded history exam. \"This present is shaped by globalization. China's opening up is not only state policy but also expands people's scope of action as well as the range of their diverse material and immaterial interests in life.\"\nHu went on to say that connections to the outside world should not, therefore, be compared to intellectual ties to ancient history.\n\"Forcibly pitting them against each other — by asking whether foreign languages or traditional Chinese culture are more important — runs the risk of setting the wrong priorities and unnecessarily politicizing public discussions.\"\nFor him, an open engagement with the outside world is the top priority. English as a core subject also promotes equal opportunity, he noted, as it gives children in rural areas access to this important foreign language and thus to the world.\nLittle interest in language studies\nEven Chinese universities specializing in foreign languages are feeling the pressure to adjust their educational goals and prepare incoming freshmen for future job markets. For example, fewer and fewer high school graduates are interested in German language studies, explains a university professor from Beijing who spoke to DW on condition of anonymity.\nThe new curriculum at Beijing Foreign Studies University has adopted a \"foreign language plus major\" model: English combined with law, information technology, or economics.\nSimilar cultural struggles already took place during the Self-Strengthening Movement in the late 19th century under the Qing Dynasty.\n\"Learn the superior skills from abroad so that you can later conquer the outside world,\" said Wei Yuan, a court scholar at the time.\nLearning from abroad simply works better in the language used there. Even though it may be becoming apparent that, in some areas, other countries are more interested in learning ", "translation_ja": "", "vocab": [{"word": "lingua franca", "definition": "異なる言語を話す人々の間で共通に使われる言語。ここでは英語が国際的なコミュニケーションツールとして機能していることを指します。"}, {"word": "abolish", "definition": "法律や制度などを公式に廃止する、または根絶する。タン教授は英語の必修科目としての地位を完全に排除したいと主張しています。"}, {"word": "competitiveness", "definition": "国家や企業が国際市場で他と競争する能力。英語教育削減がもたらす経済的・学術的な影響を指します。"}, {"word": "proficiency", "definition": "特定の言語やスキルに高度な熟達度や習熟度を持つこと。英語の十分な理解度が必要とされることを意味します。"}, {"word": "curriculum", "definition": "学校や大学で教える科目や授業内容の全体系。中国の教育機関が急速に変更しています。"}, {"word": "globalization", "definition": "世界中の国や企業が経済的・文化的に相互に依存し、統合されていくプロセス。国際競争力と関連します。"}]}, {"title_ja": "共和党が初の中間選挙大会を開催、トランプ大統領が基調演説", "title_en": "Republicans Hold Inaugural Midterm Convention with Trump Keynote", "summary_ja": "共和党は初となる中間選挙大会を開催しており、トランプ前大統領が水曜夜に基調演説を行う予定です。本大会は中間選挙に向けた同党の重要な取り組みとなります。大会の進行状況はライブアップデートで随時報告されています。", "summary_en": "Republicans are hosting their first-ever midterm convention, featuring President Trump delivering a keynote address on Wednesday evening. The event marks a significant moment for the party as it gears up for the midterm elections. Live updates are being provided throughout the convention proceedings.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/live-updates/live-updates-republicans-hold-midterm-convention/?id=136280834", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュースと生中継", "title_en": "ABC News Live: 24/7 Breaking News and Live Events", "summary_ja": "ABCニュース ライブは、世界中の速報ニュースと主要なライブイベントを24時間体制でカバーしています。プラットフォームは、進展する物語がリアルタイムで展開される際の最新レポートを配信します。視聴者はいつでも継続的なニュース更新とライブイベントのカバレッジにアクセスできます。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and major live events from around the world. The platform delivers up-to-the-minute reporting on developing stories as they unfold. Viewers can access continuous news updates and live event coverage anytime.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領のダラス移動前に軍がエアフォースワンの緊急スライドを誤作動", "title_en": "Military Accidentally Deploys Air Force One Emergency Slide Before Trump's Dallas Trip", "summary_ja": "共和党中間選挙大会が開催されるダラスへの出発前に、軍の職員がエアフォースワンの緊急スライドを誤って作動させた。この事故により予定されていた移動が一時的に遅延した。けが人は報告されていない。", "summary_en": "A military personnel accidentally triggered the emergency slide on Air Force One before President Trump's departure to Dallas for the Republican Midterm Convention. The incident caused a brief delay to the scheduled trip. No injuries were reported from the accidental deployment.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/inflatable-slide-deploys-qatari-gifted-air-force-ahead/story?id=136309957", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウガンダ、チャールズ国王への敬意を示すためインビクタス・ゲームスから撤退", "title_en": "Uganda Withdraws from Invictus Games in Show of Support for King Charles", "summary_ja": "ウガンダの軍事指導者ムホーズィ・カイネルガバ将軍は、チャールズ3世国王への敬意を示すため、ハリー王子のインビクタス・ゲームスからの撤退を発表した。この決定は、ハリー夫妻がもはや現職王族ではないことを明確にした宮殿の公式書簡に関連しているようで、カイネルガバは同夫妻を支持する軍内部の勢力を排除する必要があったと述べている。", "summary_en": "Uganda's military chief Gen Muhoozi Kainerugaba announced the country's withdrawal from Prince Harry's Invictus Games, stating it was to show respect for King Charles III. The decision appears linked to an official palace letter clarifying that Harry and Meghan are no longer working royals, which Kainerugaba said prompted him to eliminate internal military factions supporting the couple.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/09/uganda-withdraws-invictus-games-out-of-respect-king-charles", "state_media": false, "category": "政治", "full_text": "Uganda is withdrawing from the Duke of Sussex’s Invictus Games, the country’s military chief has said, out of respect for King Charles amid division over the “Harry-Meghan nonsense”.\nGen Muhoozi Kainerugaba, son of the Ugandan president, made the surprise announcement in a post on X on Wednesday.\nKainerugaba wrote: “In order not to be construed as being opposed to His Majesty King Charles III of the United Kingdom, whom we deeply revere, Uganda hereby withdraws from the Invictus Games. We shall not participate in anything that does not have His Majesty’s approval.”\nThe timing of the post suggests it may be in response to an official letter to UK senior government and military officials on behalf of Charles that reiterated the Duke and Duchess of Sussex were not working royals and would not use their HRH styles.\nWhen asked by the Times about what had motivated the move, Kainerugaba is reported to have said: “I have factions in the Ministry of Defence that support that Harry-Meghan nonsense. I had to quash it straight away. I support the monarch. Period.”\nThe news, first reported by the Uganda Pulse news website, will be a blow to Harry, who two months ago stood alongside Uganda’s defence minister, Kiryowa Kiwanuka, at an Invictus Games event in London to announce that the East African nation would be the 26th country to enter the multisport event for wounded service personnel.\nAt the time, Kiwanuka praised the Ugandan president, Yoweri Museveni for his “visionary leadership” and Kainerugaba, a Sandhurst graduate, for “championing our team’s entry”, adding that their support “marks a new chapter for our servicemen and women”.\nThe Ugandan government spokesperson Alan Kasujja confirmed to the BBC: “Gen Kainerugaba decides whether or not the UPDF [Uganda People’s Defence Force] participates in the Invictus Games. What you saw is his stated position. If it changes, he will let the world know.”\nThe decision to withdraw may be an unintended consequence of the official letter, issued on Monday by the head of the royal household, the lord chamberlain, Richard Benyon, at Charles’s behest, clarifying the position of the Sussexes after their return to the UK two weeks ago.\nThe letter directed that the couple were “no longer working members of the royal family”, that their charitable work “is a personal matter for them both and undertaken in their private capacity” and “their position is akin to private citizens with commercial and charitable interests”.\nKainerugaba was appointed army chief in 2024 and is widely seen as his 81-year-old father’s successor to the presidency. He has made several provocative posts on X, including threats to invade neighbouring Kenya, demands that Jay-Z hand over his wife, Beyoncé, so he could marry her, and threats against Bobi Wine, Museveni’s principal political rival.\nThe Invictus Games and representatives for the Duke of Sussex have been approached for comment.", "translation_ja": "", "vocab": [{"word": "reiterated", "definition": "何度も繰り返して述べることを意味する。公式な文書や声明で重要な内容を強調する際に使用される。"}, {"word": "construed", "definition": "何かを特定の方法で解釈または理解されることを意味する。法律や公式な文脈で、発言や行動の意図を説明するときに使われる。"}, {"word": "multisport", "definition": "複数の異なるスポーツ種目を含むイベントまたは大会を指す。オリンピックやインビクタス・ゲームスなどの大規模競技会を説明する際に使用される。"}, {"word": "unintended consequence", "definition": "予期せず予測されていなかった結果を意味する慣用表現。政策や行動の予想外の副作用を指す。"}, {"word": "clarifying", "definition": "不明確または曖昧な事柄をより明確にし理解しやすくすることを意味する。公式な説明や声明で使用される。"}, {"word": "incumbent", "definition": "現在その職位にある人を指す。「The incumbent president is serving his second term.」のように使用される。"}, {"word": "provocative", "definition": "反応や議論を意図的に引き起こすような、挑発的な内容を意味する。争いやすい物議を醸す発言や行動を説明する。"}]}, {"title_ja": "貧血の母親から生まれた乳幼児の脳がより小さいことが判明—研究報告", "title_en": "Babies Born to Anaemic Mothers Have Smaller Brains, Study Finds", "summary_ja": "ケープタウンで300人以上の母親と乳幼児を対象とした研究により、貧血の母親から生まれた乳幼児の脳容積は平均4%小さく、特に運動、学習、感情調節に関連する脳領域に顕著な差異があることが判明しました。これらの脳の違いは生後2年間で拡大し続け、貧血の母親から生まれた子どもが発達検査でより低いスコアを示す理由を説明する可能性があります。この研究は、特に妊娠中の母親の貧血スクリーニングと治療の重要性を強調しています。", "summary_en": "A study of over 300 mothers and babies in Cape Town found that infants born to mothers with anaemia had 4% smaller total brain volume, with notable differences in regions linked to movement, learning, and emotion regulation. These brain differences persisted and widened over the first two years of life, potentially explaining why children born to anaemic mothers score lower on developmental tests. The research highlights the importance of screening for and treating maternal anaemia, particularly during pregnancy.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/sep/09/babies-born-to-anaemic-mothers-have-smaller-brains-study-finds", "state_media": false, "category": "社会", "full_text": "Babies born to mothers with anaemia have smaller brains, particularly in key regions linked to movement, learning and the regulation of emotion, according to a study.\nResearchers said the differences, first detected at the age of one, could lead to cognitive problems when children started school.\nMore than a third of pregnant women worldwide have anaemia – a condition typically caused by iron deficiency in which the number of red blood cells in the body is lower than normal. Symptoms include fatigue, shortness of breath and dizziness. Rates are highest in sub-Saharan Africa and south Asia.\nResearchers from King’s College London in the UK, and the University of Cape Town in South Africa, followed more than 300 mothers and their babies in Cape Town, scanning the brains of the infants several times between the ages of three months and two years.\nOn average, the total brain volume of babies born to anaemic mothers was 4% lower than that of babies born to non-anaemic mothers – despite all the anaemic mothers being diagnosed only with a mild version of the condition.\nDifferences were recorded in three specific regions of the brain: the putamen, caudate nucleus and corpus callosum.\n“All three of these brain regions are implicated in key neuropsychological functions,” said Jessica Ringshaw, first author and researcher at King’s Institute of Psychiatry, Psychology & Neuroscience (IoPPN) and the University of Cape Town, citing processing speed, emotion regulation and executive function as examples.\nThe gap between the groups of babies widened over the first two years of life – the corpus callosum, for instance, was about 4% smaller at 12 months in the group whose mothers had been anaemic but 6% by 24 months.\nEarlier research in South Africa looking at toddlers and school-age children found comparable differences in brain volume.\n“These aren’t children who are catching up, where the brain differences are disappearing over time,” said Ringshaw. “They are still there when the children are six years old and going to school, and when these things might then start translating into more noticeable cognitive difficulties.”\nThe findings offer a potential explanation for earlier studies showing that children born to mothers with anaemia scored less well on tests of development, she added.\nThe mothers with and without anaemia were otherwise very similar in terms of factors such as household income and food security, Ringshaw said, making her confident that maternal anaemia caused the differences the team observed.\nThe results reinforced the importance of tackling anaemia in women of reproductive age, Ringshaw said. “We should be screening for anaemia and iron deficiency, particularly during pregnancy,” she said, recommending the use of oral or even intravenous iron supplementation where appropriate.\nThe causes of anaemia were complex and could include infectious diseases, she said, with the study finding higher rates of anaemia in women living with HIV, “so having our iron interventions, but also appropriate infection management in conjunction with that [is important]”.\nWhile the World Health Organization lists reducing rates of anaemia as a priority, progress has stagnated over the past two decades.\n“Now more than ever, anaemia needs to be placed at the forefront of public health efforts if we are to ensure that children are not only surviving but thriving,” said Ringshaw.\nThe research, published in the journal Brain Communications, used special new MRI scanners that are cheaper and more portable than the conventional machines used in hospitals.\nIt compared images taken using the traditional “high-field” MRI machines with those taken by the portable “low-field” options, and found the latter were sensitive enough to detect the same differences in the brains of babies born to anaemic mothers.\nSteve Williams, professor of neuroimaging at King’s, said: “This study has proved that our novel technology can measure the impact of malnutrition on the developing brain, at scale, in some of the most challenging environments. This will provide an early, sensitive assessment of planned interventions.”", "translation_ja": "", "vocab": [{"word": "anaemia", "definition": "赤血球数が正常より少ない状態で、通常は鉄分不足が原因の医学的な疾患。疲労や息切れなどの症状を伴います。"}, {"word": "stagnated", "definition": "進展や改善が停止して、同じ状態のまま変わらないことを意味します。進捗が止まっている状態を表します。"}, {"word": "neuropsychological", "definition": "脳の機能と心理的プロセスの相互作用に関連する学問分野。認知、感情、行動などの神経基盤を研究します。"}, {"word": "interventions", "definition": "問題を改善または解決するために行われる積極的な介入や施策。医療や公衆衛生の文脈では治療法や対策を指します。"}, {"word": "putamen", "definition": "脳の大脳基底核の一部で、運動制御と認知機能に関わる神経構造。この研究では縮小が観察されています。"}, {"word": "malnutrition", "definition": "栄養不足または栄養バランスの不良による健康状態の悪化。特に発展途上国で公衆衛生上の重要な課題です。"}]}, {"title_ja": "地域の混乱を利用したソマリア海賊がアデン湾に復帰", "title_en": "Somali pirates return to seas exploiting regional chaos and shipping disruptions", "summary_ja": "4月以降8件の拿捕事件が報告され、ソマリア海賊行為は10年ぶりの水準に急増している。地域紛争により国際海軍がソマリア沖から撤退し、航路がソマリア沿岸に近接したことが主な要因である。ソマリアの政治不安定化と石油タンカーの高い価値、Starlinkなどの高度な技術導入により、海賊は長年の相対的な平穏期に放置されたセキュリティギャップを巧みに利用している。", "summary_en": "Somali piracy has resurged to decade-high levels with eight hijackings since April, driven by regional conflicts diverting naval forces and rerouting shipping lanes closer to Somalia's coast. Political instability in Somalia, combined with the lucrative targeting of oil cargoes and increased use of sophisticated technology like Starlink, has enabled pirates to exploit security gaps abandoned during years of relative calm.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/08/hijacking-pirates-somalia-geopolitical-chaos", "state_media": false, "category": "政治", "full_text": "The scourge of Somali piracy targeting cargo ships and smaller dhows off the Horn of Africa has returned to levels not seen in a decade, driven by a convergence of factors including disruptions to the shipping industry caused by the US-Israeli war against Iran and a resurgence of political instability in Somalia.\nSince late April there have been eight hijackings by Somali pirates, including two within the space of a fortnight in August: one targeting an oil tanker with ties to Iran, the other a Cameroon-flagged vessel, the Lutuf, carrying military equipment for Turkey.\nOver a seven-year period from 2005 there were more than 1,000 attacks on vessels in the waters off Somalia, which has mainland Africa’s longest coastline. Thousands of crew members were taken hostage, netting $400m (£296m) in ransom payments for the piracy network’s financiers, the low-level “foot-soldier” pirates and the communities who provided them with goods and services. The attacks only petered out after a multinational anti-piracy force was deployed.\nThe hijacking of the Lutuf was the most high-profile of the recent incidents. Turkey has been expanding its influence in Somalia after an agreement signed in 2024 to build up its navy, and the Lutuf’s release two weeks after its capture involved a joint Turkish-Somali operation that resulted in the destruction of four pirate vessels.\nHowever, local officials including Mohamed Mubarak, the head of the Puntland security coordination office, have said that a $2.5m (£1.85m) ransom was also paid, prompting warnings that such payments risked encouraging similar incidents.\nIn a comment for the Center for Maritime Security in July, Matthew Reisener, the thinktank’s national security adviser, warned that naval campaigns by Iran in the strait of Hormuz and Iran’s Houthi proxies in the Red Sea – launched in response to the US-Israel war on Iran – are allowing regional piracy “to once again thrive”.\nHe wrote: “Not only have the global navies that once combatted piracy off the Horn of Africa diverted their resources to counter the threats against ships in these critical waterways, but these conflicts have also drawn maritime traffic closer to Somalia’s coastline, creating openings for opportunistic pirates to target commercial ships.”\nAccording to Reisener, about 70% of maritime traffic that passed through the Red Sea prior to the Houthis’ targeting of ships there is now being rerouted around the Cape of Good Hope in South Africa.\nA report by the International Institute for Strategic Studies in May reached a similar conclusion: “The recent deterioration of maritime security followed a prolonged period of relative calm in the waters off the Somali coast, which resulted in the redeployment of international anti-piracy fleets and the relaxation of commercial risk-management practices. These factors – alongside the distraction posed by Houthi attacks in the Red Sea – have converged to create an opening that Somali pirates have been quick to exploit.”\nAnalysts also note that rising oil prices driven by the war have made oil cargoes a more valuable target.\nAmong the least developed countries in the world, Somalia has endured conflict and clan battles with no strong central government since the autocratic ruler Mohamed Siad Barre fell in 1991. Insufficient patrol vessels and an inability to regularly pay salaries to those involved in coastal patrols are among the reasons why Somalia has long-struggled to secure its coastline.\nPiracy has historically thrived during periods of increasing instability and political, factional and regional competition. Observers say the recent rise in incidents has been exacerbated by a domestic and international focus on arms smuggling to Yemen by networks acting on behalf of Iran. Analysts suggest some of these networks have become increasingly associated with Somalia’s Islamist al-Shabaab group as it once again expands its territorial control in central and southern Somalia and seeks to build ties with the Houthis in Yemen.\nLocal officials interviewed by the Guardian described how in the recent spate of incidents, pirate groups have been using vessels they had already seized to attack and capture other vessels.\nAccording to the officials, the Lutuf was approached as it sailed three nautical miles from Somali shores near the fishing town of Maraya by a previously hijacked cement carrier, the MV Sward, which had been repurposed as a pirate mothership. Eight gunmen from the Sward then boarded the Lutuf and were able to overpower the ship’s armed guards.\nOfficials say the recent attacks have also been marked by increased technological sophistication on the part of pirate groups, including the use of SpaceX’s Starlink satellite internet service to facilitate the tracking of potential targets and for high-speed communications between pirates.\nThat reflects what Lloyd’s List has described as an increasingly “more capable and adaptive Somali piracy threat” that is already exposing vuln", "translation_ja": "", "vocab": [{"word": "convergence", "definition": "複数の要因や事象が一点に向かって集まることを意味する。本記事では、地域紛争、政治不安定化、海運業の混乱など複数の要因がソマリア海賊復活に同時に作用していることを指す。"}, {"word": "exacerbated", "definition": "問題や状況を悪化させる、より深刻にすることを意味する。ここでは、イランへの武器密輸問題がソマリア海賊の増加をさらに悪化させていることを表現している。"}, {"word": "redeployment", "definition": "軍隊や資源を別の場所に配置し直すことを意味する。国際的な対海賊戦力がソマリア沖からホルムズ海峡などの他の地域に再配置されたことを指す。"}, {"word": "opportunistic", "definition": "都合のよい機会を素早く利用する、隙をついて行動することを意味する。ソマリア海賊が国際海軍の撤退と航路変更の機会を活用していることを表現している。"}, {"word": "vulnerabilities", "definition": "弱点や隙をつかれやすい状態を指す。海運業が対海賊防衛の緩和により、攻撃に対して脆弱になっている状況を示している。"}, {"word": "factional", "definition": "グループ内の派閥や勢力に分かれた対立を意味する。ソマリアが統一政府を欠き、複数の派閥による権力闘争を経験していることを表現している。"}]}, {"title_ja": "ガウフがアンドレエバに逆転勝利、全米オープン準決勝進出", "title_en": "Gauff Defeats Andreeva in Comeback Win to Reach US Open Semifinals", "summary_ja": "ココ・ガウフが5番シードのミルラ・アンドレエバに対してマッチポイント2つをセーブし、2-6、7-6（7）、6-2で勝利して全米オープン準決勝に進出した。初セットで調子が出なかった2023年チャンピオンは逆転し、次のラウンドで2番シードのエレーナ・リバキナと対戦することになる。ガウフはメンタルのリセットと同胞フランシス・ティアフォーの同様の逆転劇から刺激を受けたことが復活につながったとコメントした。", "summary_en": "Coco Gauff saved two match points against fifth seed Mirra Andreeva, winning 2-6, 7-6 (7), 6-2 to advance to the US Open semifinals. After a poor opening set, the 2023 champion fought back and will face second seed Elena Rybakina in the next round. Gauff credited her comeback to resetting mentally and drawing inspiration from fellow American Frances Tiafoe's similar recovery.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/9/gauff-beats-andreeva-to-reach-us-open-semifinals-in-comeback-win?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Gauff beats Andreeva to reach US Open semifinals in comeback win\nCoco Gauff sets up US Open semifinal with Elena Rybakina after saving two match points against Mirra Andreeva.\nAmerican Coco Gauff saved two match points to beat Russian fifth seed Mirra Andreeva 2-6, 7-6 (7), 6-2 on Wednesday and reach the US Open semi-finals after recovering from a dreadful opening set.\nThe 2023 champion had none of her usual firepower at first and was on the ropes in the tiebreak before she flipped the script and closed out the match with a forehand strike, dropping her racket to the court in joy and relief.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Carrick confident Man Utd can go far in ‘magical’ Champions League\n- list 2 of 4Liverpool come back to beat Atletico Madrid 2-1 in Champions League opener\n- list 3 of 4Misfiring Arsenal beat Napoli with Odegaard stunner in Champions League\n- list 4 of 4Rampant Raphinha nets two goals as Barcelona rout Feyenoord\nShe faces second seed Elena Rybakina in the semi-finals.\n“The motto of the match was just to fight,” said Gauff.\nAndreeva looked completely at home in New York City’s Arthur Ashe Stadium as she sprinted through the first four games, never allowing Gauff to set up a break-point chance in the opening set where the Russian had just five unforced errors to 14 from her opponent.\nGauff, who took a break in the locker room between sets, took inspiration from her compatriot Frances Tiafoe, who recovered from two sets and a breakdown on Tuesday night to reach the semi-finals on the men’s side.\n“I just had to reset. I came out not feeling the ball, giving her too many free points,” said Gauff. “I was thinking about Frances Tiafoe and how he came back yesterday. And we all want to do well in front of this crowd.”\nGauff finally found some momentum in the second set and was serving for the match in the ninth game when old issues with her serve resurfaced. She produced three double faults, allowing her opponent to break back.\nUndeterred, Gauff recovered her poise and deployed a perfectly placed backhand to win a 39-shot rally, twice saving match point before forcing the third set with a forehand shot to the corner that Andreeva could not contain.\nShe kept up the pace from there, and Andreeva flung her racket at her bench in disgust after dropping her serve in the third game of the decider. Gauff broke her to love in the seventh game to put the contest completely out of reach.\nShe faces a formidable foe in Rybakina, who claimed the top ranking with a win earlier in the day over Zheng Qinwen of China.\nGauff and the Kazakh second seed have one win apiece in career head-to-head, with Rybakina winning their most recent encounter in the semi-finals in Toronto last month.\n“Elena – she’s the new world number one so it’s going to be a tough match,” said Gauff. “I’m looking forward to the battle. These are the moments you live for.”", "translation_ja": "", "vocab": [{"word": "resurfaced", "definition": "問題や状況が再び現れること、特に以前あった問題が再度起こることを意味する。ここではガウフのサーブの問題が再び起きたことを表している。"}, {"word": "undeterred", "definition": "困難や挫折にもかかわらず、決心が揺らがない状態。前向きに続行する姿勢を表す。"}, {"word": "formidable", "definition": "非常に強力で、対戦相手や課題として非常に手ごわいことを表す。ここではリバキナが強い対手であることを意味する。"}, {"word": "deployed", "definition": "戦略的に何かを配置・使用すること。テニスではショットや戦術を効果的に使うことを指す。"}, {"word": "flung", "definition": "物を勢いよく投げつけること。感情的に物を一気に放り投げる動作を表す。"}]}, {"title_ja": "英国空港システム障害で数千便キャンセル、独立調査が開始される", "title_en": "UK Airport Chaos Leaves Thousands Stranded as System Outage Sparks Investigation", "summary_ja": "火曜日に英国の航空交通管制システムの大規模障害が発生し、数千便のフライトがキャンセルされ、多くの乗客が足止めされた。ハイディ・アレクサンダー運輸相は独立した航空宇宙規制機関に障害の原因究明を指示した。この事件は影響を受けた旅行者の間で広範な怒りを引き起こしている。", "summary_en": "A major air traffic control system outage caused thousands of flight cancellations at UK airports on Tuesday, leaving passengers stranded and holidays disrupted. British transport minister Heidi Alexander has ordered an independent aerospace regulator to investigate the root cause of the failure. The incident has sparked widespread outrage among travelers affected by the disruption.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/9/everyones-had-their-holidays-ruined-outrage-after-uk-airport-chaos?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "‘Everyone's had their holidays ruined’: outrage after UK airport chaos\nNewsFeed\n‘Everyone’s had their holidays ruined’: outrage after UK airport chaos\nBritish transport minister Heidi Alexander has instructed the UK’s independent aerospace regulator to conduct an independent review into the cause of an air traffic control system outage that led to thousands of flight cancellations on Tuesday.\nPublished On 9 Sep 2026", "translation_ja": "", "vocab": [{"word": "outage", "definition": "通常は電気やシステムが利用できない時間帯を指す。この場合、航空管制システムが一時的に停止していた状態を示す。"}, {"word": "regulator", "definition": "政府機関や業界を監督・管理する公式な機構。ここでは航空宇宙産業を監視する独立した機関を意味する。"}, {"word": "aerospace", "definition": "航空機と宇宙船の設計、製造、運用に関わる産業。航空および宇宙技術分野全般を指す。"}, {"word": "cancellations", "definition": "予定されていたフライトや予約が中止されること。この事件では数千便が運航中止となった。"}, {"word": "stranded", "definition": "目的地に到達できずに取り残される状態。旅行者が予期しない事情により移動ができなくなっていることを表す。"}]}, {"title_ja": "米国裁判所、テイト兄弟のマイアミ刑務所からの釈放申し立てを却下", "title_en": "US Court Denies Tate Brothers' Bid for Release from Miami Jail", "summary_ja": "米国判事は、ソーシャルメディアの影響力者アンドリュー・テイト兄とトリスタン・テイト兄がレイプ罪で英国への身柄引き渡しを控える間、マイアミ刑務所に留まる必要があると判断しました。判事は兄弟の富と国際旅行の歴史により、彼らが「典型的な逃亡リスク」であると判断しました。テイト兄弟はルーマニアでも未成年者密売などの追加罪で起訴されています。", "summary_en": "A US judge ruled that social media influencers Andrew and Tristan Tate must remain in a Miami jail while appealing their extradition to the UK, where they face rape charges. The judge determined the brothers are a 'quintessential flight risk' due to their wealth and history of international travel. The Tates also face additional charges in Romania for trafficking minors and other offences.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/9/us-court-denies-tate-brothers-bid-to-be-released-from-miami-jail?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "US court denies Tate brothers’ bid to be released from Miami jail\nA judge has ruled the brothers are a ‘quintessential flight risk’ due to their wealth and frequent international travel.\nA United States judge has turned down a request from social media influencers Andrew and Tristan Tate to be released from jail as they appeal their extradition to the United Kingdom, where they face rape charges.\nOn Wednesday, US Magistrate Judge Lauren Louis ruled that the brothers constituted a “quintessential flight risk” because of their wealth and frequent international travel and must therefore remain in a Miami jail.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Andrew Tate indicted in Romania for trafficking minors, money laundering\n- list 2 of 3Tate brothers face two more weeks in US jail pending UK extradition\n- list 3 of 3White House says will not block Tate brothers’ extradition to UK\n“While [the brothers] may not in fact possess what extravagant holdings they portray themselves as possessing online, the record reflects that they possess an exceptional capacity to flee the jurisdiction,” Louis wrote.\nA lawyer for the brothers said they would “continue to defend themselves against the allegations they face and engage with the appropriate legal processes in each jurisdiction”.\nAndrew and Tristan Tate were arrested in Miami, Florida, on July 18 after the UK requested their extradition to face charges of rape, assault and facilitating trafficking for sexual exploitation.\nThe pair, who have citizenship in the US and the UK, have denied all wrongdoing.\nDefence lawyers previously argued that the brothers should be released from jail as they contest their extradition, saying their high-profile status makes fleeing the country unrealistic.\nThe Tates’ legal team also downplayed the brothers’ depictions of extravagant wealth on social media as “theatrical” and “grandiose”.\nProsecutors said in an August 10 court filing that Andrew and Tristan Tate recruited dozens of women to engage in work doing webcam pornography beginning in 2014. They later offered online courses through a venture called “Hustler’s University”.\nDuring a hearing on August 27, the court was shown a video of Andrew saying, “Slap, slap, grab, choke, shut up b****, sex”, in what appeared to be a description of his “pimping” lifestyle.\nThe Tates have built a massive online profile through what critics say is a promotion of aggressive misogyny.\nIn addition to facing charges in the UK, the brothers are also defending themselves in a case in Romania, where they were indicted for trafficking minors, among other offences.\nTheir defence team cited the Romanian case as another reason the brothers needed to be released from jail.\n“They are now facing an extraordinary situation in which they are being held thousands of miles from Romania while Romanian proceedings continue, deadlines approach, an additional indictment is said to be imminent and their own Romanian lawyer says he cannot properly prepare,” a statement from their lawyers said.\n“No serious person can pretend that this can be reviewed properly through occasional conversations from a federal detention center in another country.”", "translation_ja": "", "vocab": [{"word": "quintessential", "definition": "最も典型的な、本質的な。ある物事の特徴を最も典型的に表す状態を表す形容詞。ビジネス文書や法律用語として頻出です。"}, {"word": "extradition", "definition": "身柄引き渡し。ある国が他国に容疑者や被告人を引き渡すこと。国際法と外交に関する重要な用語です。"}, {"word": "jurisdiction", "definition": "管轄権、裁判権。特定の法廷や政府が法的権限を行使できる地域や領域を意味します。"}, {"word": "facilitating", "definition": "促進する、助長する。何かが起こるのを容易にする、またはプロセスをスムーズにすることを表動詞です。"}, {"word": "indicted", "definition": "起訴する。大陪審団または検察が正式に犯罪容疑で告発する法的プロセスを表します。"}, {"word": "misogyny", "definition": "女性嫌悪。女性に対する偏見や敵意を示す態度。社会問題として議論されることが多い用語です。"}, {"word": "contest", "definition": "異議を唱える、争う。判決や決定に対して法的に反対する、または異議を唱えることを表動詞です。"}]}, {"title_ja": "危機的段階：西アジアの危機について", "title_en": "Dangerous phase: On the crisis in West Asia", "summary_ja": "西アジアの危機は複数の戦線で エスカレートしており、米国はイランの石油タンカーを攻撃する一方、イランはヨルダンの米軍基地に弾道ミサイルで報復している。イランと提携するイエメンのフーシ派はサウジアラビアへの攻撃を開始し、海上封鎖を実施して、ホルムズ海峡と紅海の重要な海上輸送路を脅かしている。米国とイランのいずれも緊張緩和の兆候を示さないため、紛争はより危険な段階に入り、世界経済に大きな影響を及ぼす可能性がある。", "summary_en": "The West Asia crisis is escalating across multiple fronts with the U.S. striking Iranian oil tankers while Iran retaliates with ballistic missile attacks on American bases in Jordan. Yemen's Houthis, aligned with Iran, have launched attacks on Saudi Arabia and enforced a naval blockade, threatening critical shipping routes in the Strait of Hormuz and Red Sea. As neither the U.S. nor Iran shows signs of de-escalation, the conflict is entering a more dangerous phase with significant global economic implications.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/editorial/dangerous-phase-on-the-crisis-in-west-asia/article71447652.ece", "state_media": false, "category": "政治", "full_text": "The crisis in West Asia is escalating on two fronts. On Tuesday, the U.S. said that its forces had struck five Iranian oil tankers in the Gulf waters after what it claimed were Tehran’s attacks on U.S. warships in the region. Iran retaliated with a massive ballistic missile attack on the Muwaffaq Salti U.S. air base in Jordan and vowed to respond with greater force to every U.S. attack from now on. It has also announced a new restricted zone in the Strait of Hormuz, warning commercial ships against crossing it under American naval escort. Separately, Yemen’s Houthis, who are closely aligned with Tehran, launched an attack on Saudi Arabia, wounding dozens. Riyadh has vowed a response. The Houthis, who control northern Yemen and parts of its Red Sea coast, have already enforced a naval blockade of Saudi Arabia’s western ports and launched an offensive against the forces of Yemen’s Saudi-backed government in Taiz and Mocha. With both the Strait of Hormuz, which connects the Persian Gulf with the Gulf of Oman, and the Red Sea, a critical trade channel between Europe and Asia, remaining flashpoints, a horizontally escalating conflict from Tehran to Jordan and Riyadh to Bab-el Mandeb threatens to plunge the entire region into an economic and security abyss.\nThe current phase of the conflict could prove to be deadlier for several reasons. The U.S., which in the recent past has used intense military strikes and economic strangulation as separate policy tools in an attempt to force Iran to surrender, is now using both simultaneously to exert maximum pressure on Tehran. The U.S. naval blockade has largely prevented Iran from exporting its oil, while the American naval escort to a limited number of ships out of the Strait of Hormuz has helped Washington blunt the impact of Iran’s chokehold on the waterway on global energy prices. But President Donald Trump was wrong if he thought his maximum economic and military pressure would force Iran
