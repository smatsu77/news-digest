l of X to boost the party’s campaign messages. Last year, the US vice-president, JD Vance, met Alice Weidel, AfD co-leader, during a visit to Munich. There was no space in his diary for Olaf Scholz, then the German chancellor. Clearly, the AfD meets the criteria for endorsement set out in Donald Trump’s national security strategy, which pledges support for “patriotic resistance” movements committed to halting the “civilisational erasure” of Europe by immigration.\nIn Britain, Nigel Farage could once have assumed entitlement to that status as an early and enthusiastic cheerleader for Trump. But in the competition for Maga accolades, Reform UK has lost ground to parties and people even further to the right – Rupert Lowe’s Restore Britain; ultra-nationalist agitator Tommy Robinson; pretty much anyone who can muster a mob of blackshirts or a passing troll who catches Musk’s eye posting racist conspiracy theories online.\nIt would be absurd if it wasn’t so effective. “We never fall into the same abyss twice,” writes Éric Vuillard, the French novelist. “But we fall in the same way, in a mixture of ridicule and dread.”\nThe reach and pungency of the US right, drenched in white supremacism, interferes with Farage’s old strategy of banking far-right support and feinting moderation to make gains in the mainstream. Chasing credibility with fanatical racists in an international digital arena makes it hard to reassure a domestic analogue audience that he should be allowed near Downing Street.\nThe tension shows in Farage’s attitude to the AfD. He spoke at a rally for it in 2017. Now he describes it as a “mixed bag” of a party, whose cultural stances are “utterly respectable and decent” but whose enthusiasm for dictators is “very difficult”.\nFarage has called AfD support for Vladimir Putin “hard to understand”. It can’t be that far beyond comprehension for a man who, in 2014, described the Russian president as the world leader he most admired, albeit “as an operator, not a human being”.\nIf Farage needs further insight into what might motivate a Kremlin fellow traveller, he could reach out to Reform’s former leader in Wales, Nathan Gill, who is serving a prison sentence for accepting bribes to make pro-Russian speeches in the European parliament when he was a Brexit party MEP.\nProximity to the Moscow line is a fairly reliable measure of fanaticism and venality on the spectrum from far-right to even further-right politics in Europe and the US. The same applies on the left, where a credulous appetite for Russian propaganda endures decades after the demise of Soviet ideology.\nThankfully, there is not much of a market in British politics for openly pandering to Putin. That is one reason why Trump is also unpopular,", "translation_ja": "", "vocab": [{"word": "complacency", "definition": "現状に満足して危険性を認識しない状態。自分たちの民主主義は絶対に揺らがないという過度な信頼を指す。"}, {"word": "venality", "definition": "金銭や利益のために原則や道徳を売る行為。汚職や収賄を示唆する語。"}, {"word": "immunise", "definition": "ある悪影響や攻撃から保護する、あるいは耐性をつける。民主主義をファシズムから守ることを指す。"}, {"word": "inoculation", "definition": "病気や有害な思想への抵抗力をあらかじめつけること。歴史教育を通じた民主主義防衛の比喩。"}, {"word": "atonement", "definition": "過去の悪行に対する償い、または謝罪と改心。ドイツが歴史的責任を認める過程を指す。"}, {"word": "pungency", "definition": "言葉や行動の鋭さ、刺激性、影響力。主に政治的メッセージの有効性を表す。"}, {"word": "credulous", "definition": "批判的思考を欠き、簡単に信じやすい傾向。特にプロパガンダに騙されやすい人を形容する。"}]}, {"title_ja": "ロシアに対する制裁の正しい方法", "title_en": "The Right Way to Sanction Russia", "summary_ja": "著者は、西側のロシア制裁が効果がないように見えても、特にシャドーフリートの石油タンカーを標的にすれば有効な政策手段であると主張している。ヨーロッパが海上ルート、保険サービス、船舶所有権に対する支配力を活用することで、西側はモスクワの石油輸出収入を大幅に削減し、通貨下落とインフレーションを通じて経済を不安定化させることができる。G7の石油価格上限戦略は、戦略的に設計すれば制裁が世界経済に悪影響を与えることなく機能することを示している。", "summary_en": "The author argues that while Western sanctions on Russia have appeared ineffective, they remain a viable policy tool if properly enforced, particularly by targeting Russia's shadow fleet of oil tankers. By leveraging European control over maritime routes, insurance services, and ship ownership, the West can drastically reduce Moscow's oil export revenues and destabilize its economy through currency depreciation and inflation. The G-7's oil price cap strategy demonstrates that sanctions can work without causing global economic harm if designed strategically.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/right-way-sanction-russia", "state_media": false, "category": "オピニオン", "full_text": "When Russia invaded Ukraine in 2022, Western countries responded with aggressive economic restrictions, freezing Russia’s official foreign exchange reserves, placing export controls on critical technology, and sanctioning scores of its political, military and business leaders. Yet more than four years later, the war is still going on, and Western sanctions have inflicted only limited pain on the Russian economy. Russia continues to trade oil and other commodities, recently receiving a massive windfall as the closing of the Strait of Hormuz caused global oil prices to soar. These profits are raising the government’s tax revenue at a critical time, helping it fund the war in Ukraine and stabilize the country’s financial markets. If sanctions were looking ineffective before, Russia’s economic rebound since the start of the United States’ and Israel’s war with Iran have only strengthened that perception.\nBut it is wrong to write off sanctions as a policy tool. When Western policymakers portray them as a wasted effort or counterproductive, their governments are playing right into Moscow’s hands. And they are discounting the enormous strain that sanctions could still place on the Russian system if properly enforced. By reducing the flow of hard currency into Russia, sanctions have the potential to send the ruble into a spiral of depreciation, which in turn would send inflation soaring and destabilize the country’s broader economy.\nIt is not too late to make sanctions effective. One-fifth of Russia’s GDP is directly linked to oil and gas extraction, and exports account for nearly one-third of government revenues. Russia evades Western oil sanctions primarily by using a shadow fleet of oil tankers, and that fleet is vulnerable to European pressure. It passes through European-controlled waterways, replenishes its numbers with European-owned ships, and can be forced to engage with a Western-dominated insurance industry. All of this gives Europe the power to restrict the fleet’s operations, and thereby drastically reduce Moscow’s ability to finance its ruinous war.\nTHE RISE OF THE SHADOW FLEET\nThe sanctions that the United States, the European Union, the United Kingdom, and Canada placed on Russia in early 2022 ran the gamut. They included export controls on sensitive goods such as semiconductors, computers, and lasers as well as the freezing of Russian foreign exchange reserves held by Western central banks. Yet efforts to curtail Russia’s oil exports back then were limited. The world economy was still rebounding from the COVID-19 pandemic, oil demand was strong and rising, and Russian oil accounted for roughly one-tenth of global supply. Western countries did not want to drive up prices by embargoing Russian oil, but the mere fear that they might do so caused oil prices to surge anyway, delivering enormous profits to Moscow. Russia’s current account surplus, or the amount by which its export receipts exceeded its import payments, soared to an all-time high of $235 billion in 2022. Within one year, Russia had nearly recouped the foreign exchange reserves that were frozen by Western countries.\nWestern countries needed to figure out a way to prevent Moscow from generating large amounts of cash from oil exports without causing global prices to spike. Many oil and commodity analysts worried that any attempt to take Russian oil off global markets could lift crude prices from their prewar baseline of around $75 per barrel to $200 or higher, allowing Russia to make enormous profits from its remaining exports even if the volume of exports were lower. Such a substantial price increase would almost certainly drive the world into recession.\nThe solution the G-7 came up with in December 2022 was an oil price cap. Around 70 percent of the vessels shipping Russian oil were Western-owned and close to 90 percent used Western insurance, financing, and brokering services. G-7 members, Australia, and the EU agreed to allow Russian exporters to use those services—but only if the crude oil they were selling was priced below $60 per barrel. There were also separate price ceilings for high-value refined products, such as diesel, and low-value refined products, such as naphtha, which is used in refining and in the production of plastics. The idea was to set the caps high enough that Russia would continue to export oil but low enough to constrain its revenue.\nTogether with a European ban on purchasing any seaborne Russian oil regardless of price, the cap immediately reoriented the global oil trade. Suddenly, Russia was selling most of its crude oil to Asian markets, especially China and India, where buyers were able to negotiate prices well below those of Western grades. By January 2023, Russian crude was selling for almost 40 percent less than the global benchmark, depriving Russia of billions in profits each month. The country’s current account surplus began to decline, falling to $50 billion in 2023 and bouncing back only slightly to $63 ", "translation_ja": "", "vocab": [{"word": "shadow fleet", "definition": "正規な登録や規制を回避するために使用される非公式な船舶群。ここではロシアの石油輸出を隠匿するために使われている無保険または低質な老朽タンカーを指す。"}, {"word": "current account surplus", "definition": "輸出収入が輸入支出を上回る国際収支の黒字。国の外貨獲得能力を示す経済指標。"}, {"word": "depreciation", "definition": "通貨の価値が時間とともに低下すること。インフレーションや経済的圧力によって通貨が弱くなる現象。"}, {"word": "embargo", "definition": "政府が特定の商品や国との貿易を公式に禁止すること。経済制裁の最も厳しい形態。"}, {"word": "price cap", "definition": "政府が設定する商品の最高価格制限。インフレーション抑制や政策目標達成のために使用される経済政策ツール。"}, {"word": "reoriented", "definition": "方向性や焦点を変える、または再び向け直すこと。ここでは石油貿易の流れがアジア市場へ転換されたことを意味する。"}]}, {"title_ja": "アルカイダはいかにして終焉を迎えたのか", "title_en": "How al-Qaeda Ended", "summary_ja": "著者は、中央集権的な組織としてのアルカイダは実質的に終焉を迎えたと主張しており、様々な関連団体によるジハード主義テロは依然として存在すると述べている。アメリカの当局者は、近代のジハード主義組織をアルカイダの系列として扱うことでその遺産を永続させるのではなく、この戦略的勝利を認めるべきだと主張している。中核組織の衰退は戦略的失敗に起因し、2009年以降、その世界的作戦は本質的に終焉を迎えた。", "summary_en": "The author argues that al-Qaeda as a centralized organization has effectively ended, though jihadist terrorism persists in various affiliated groups. U.S. officials should acknowledge this strategic victory rather than perpetuating the group's legacy by treating modern jihadist organizations as al-Qaeda affiliates. The core organization's decline resulted from strategic failure, with its global operations ceasing after 2009.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/sept-11-how-al-qaeda-ended", "state_media": false, "category": "オピニオン", "full_text": "Al-Qaeda has ended. The organization that Osama bin Laden founded and led, that attacked the United States 25 years ago and killed 2,977 innocent Americans in the World Trade Center, the Pentagon, and rural Pennsylvania, no longer survives—and U.S. officials should say so, instead of burnishing the group’s legacy by acting and speaking as if it still exists. Terrorism has not ceased, jihadism has not gone away, and the U.S.-Israeli war on Iran may ignite more anti-American sentiment and violence. But the group that attacked the United States on 9/11 is finished.\nIn the years following that assault, thousands of Americans dedicated their lives to avenging the victims. The nationwide horror of watching planes go into towers—innocent people crushed, burned, or jumping to their deaths—catalyzed a passionate response. And the cost to those who responded was high: in the post-9/11 wars, more than 15,000 U.S. military members and contractors died in combat, and some 1.8 million became disabled. And from 2012 to 2021, four times as many active-duty or veteran military members died by suicide as died in combat. Service members from loyal U.S. allies, especially Canada, Denmark, France, Germany, Italy, and the United Kingdom, joined the United States in combat; hundreds of them died fighting alongside Americans. They and their families deserve to know their efforts were not in vain. Washington and its allies lost the war in Afghanistan but succeeded against al-Qaeda.\nJihadist terrorism persists as a threat, and not every group using the name “al-Qaeda” has been neutralized. Dangerous organizations operate in the Arabian Peninsula, the Horn of Africa, North Africa, the Sahel, and South Asia. They carry out attacks and hold territory, and some have come close to taking down governments, especially in Mali, Somalia, and Yemen. Jihadists of various stripes train in Taliban-governed Afghanistan—a development that must be closely monitored. But none of what are sometimes called “al-Qaeda affiliates” is centrally directed or led by bin Laden’s organization, and officials should cease suggesting they are, since doing so inflates the threat they pose without making it any easier to combat them. Indeed, it would be best to cease using the term “al-Qaeda affiliate” altogether.\nStudying the pattern of attacks tied directly to al-Qaeda shows how the central organization ran out of steam. Before 9/11, the core al-Qaeda organization kept up a steady pace of global operations against U.S. targets, with a track record that included the 1993 bombing of the World Trade Center (six dead, more than 1,000 injured), the 1996 bombing of Khobar Towers (19 killed, hundreds injured), the 1998 bombing of the U.S. embassies in Kenya and Tanzania (224 killed, thousands injured), and the 2000 attack on the USS Cole (17 killed). After 2001, core al-Qaeda’s efforts against the U.S. homeland included a fumbled 2001 attempt to ignite a bomb placed in a shoe on an airliner bound for Miami and a failed 2009 suicide bombing plot targeting the New York City subway. The group caused more pain for U.S. friends and allies than for the United States itself, with deadly attacks in Bali in 2002, Riyadh in 2003, and London in 2005. But following that spike in the first decade of the twenty-first century, the momentum shifted to other jihadist groups, and after 2009, core al-Qaeda’s global operations essentially ceased.\nFor decades, I have studied how terrorist groups end, based on a dataset of 457 terrorist campaigns and organizations going back a century. By analyzing their makeup, targets, and intended audiences, one can identify common trajectories. Although not mutually exclusive, there are six major pathways such groups ultimately take: decapitation, negotiation, success, failure, repression, and reorientation to another mode of operation (such as ordinary criminality or insurgency). In the case of core al-Qaeda, although decapitation and military repression played important roles, the group ended primarily through strategic failure—just as bin Laden feared it would.\nA MOVING TARGET\nIn the aftermath of the 9/11 attacks, the U.S. campaign should have been focused on destroying the perpetrators. But the United States failed to clearly define the threat. The Authorization for the Use of Military Force that Congress passed on September 14, 2001, did not mention al-Qaeda at all, instead vaguely identifying Washington’s enemies as “those nations, organizations or persons [the president] determines planned, authorized, committed or aided the terrorist attacks that occurred on September 11, 2001.” A few days later, President George W. Bush echoed that framing. “Our war on al-Qaeda begins with al-Qaeda but it does not end there,” he declared. “It will not end until every terrorist group of global reach has been found, stopped, and defeated.”\nWith that, the United States declared war on a tactic, one that had shaped political violence in the modern world since anarch", "translation_ja": "", "vocab": [{"word": "decapitation", "definition": "テロ組織の指導者を排除または殺害する戦術的手段。通常、組織の効果的な機能を損なうことを目的としている。"}, {"word": "jihadism", "definition": "イスラム教の宗教的大義を名目にした暴力的行動や武装闘争。政治的目的を達成するための過激なイデオロギー運動。"}, {"word": "trajectory", "definition": "時間とともに組織や事象が進む方向や経路。特に発展や衰退のパターンを示す際に使用される。"}, {"word": "repression", "definition": "政府や権力による圧制的な規制や抑制。テロ組織に対する軍事的または法的な弾圧活動を指す。"}, {"word": "reorientation", "definition": "組織や個人の目的、方向、活動を新しい方針に転換すること。テロ組織が犯罪活動や反政府活動へ変質することを示す。"}, {"word": "burnishing", "definition": "何かの声望や地位を高め、輝かせること。ここでは無意識にテロ組織の影響力を誇大化させることを意味する。"}]}, {"title_ja": "アメリカがイランを経済的に締め上げられない理由", "title_en": "Why America Can't Strangle Iran", "summary_ja": "数十年にわたる米国の経済制裁と最近の軍事攻撃にもかかわらず、イランの指導部は経済を適応させ、通常国民に負担を転嫁することで、経済的強制に対する耐性を示してきた。制裁によってイランの経済は深刻な被害を受けているが、国家の戦争遂行能力や体制支配を損なうことはできていない。著者は、米国の経済戦争がイラン国民を困窮させることはできるが、イスラム共和制を成功裏に転覆させることはできないと主張している。", "summary_en": "Despite decades of U.S. sanctions and recent military strikes, Iran's leadership has proven resilient in resisting economic coercion by adapting its economy and offloading hardship onto ordinary citizens. While sanctions have severely damaged Iran's economy—causing currency collapse, inflation exceeding 88%, and GDP contraction—they have not crippled the state's ability to wage war or maintain regime control. The author argues that U.S. economic warfare can immiserate the Iranian people but cannot successfully overthrow the Islamic Republic.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/why-america-cant-strangle-iran", "state_media": false, "category": "オピニオン", "full_text": "For Iran and the United States, August 24 was Groundhog Day. “We are launching an economic onslaught against Iran’s financial connections around the globe,” declared U.S. Treasury Secretary Scott Bessent. “Our objective is to sever every economic lifeline that sustains this tyrannical regime.” It was the same promise he made in April, when he said that the United States was “imposing a financial stranglehold on the Iranian regime” under what the White House called Operation Economic Fury. It was also akin to the May 2018 rollout of the first Trump administration’s “maximum pressure” campaign, in which Secretary of State Mike Pompeo announced that Iran would be targeted by the “strongest sanctions in history.” And it sounded like U.S. President Barack Obama’s promise, made in 2012, that the Iranian government was to face “even more crippling sanctions.”\nThe Iranian economy has certainly felt the effects of all the successive restrictions. Ever since U.S. President Donald Trump’s first term in office, the country has experienced little growth and high inflation. As a result, Iranian firms have built less infrastructure and adopted fewer new technologies compared with peers in other developing economies. Iranian households, once increasingly affluent, are now at risk of falling below the state’s poverty line.\nYet for the better part of a decade, Iran has been able to resist U.S. economic coercion. Until the recent blockade, it used sanctions-evasion techniques to continue oil exports to its key customer, China. Its non-oil industries also adapted to the sanctions, as currency devaluation reduced competition from imports and made Iranian products more competitive in regional markets, boosting exports. Iran thereby avoided the kind of runaway economic collapse seen in other sanctioned countries, such as Syria and Venezuela.\nToday, war is testing the resilience of the Iranian economy in ways that sanctions alone could not. Numerous U.S. and Israeli airstrikes have targeted critical industrial facilities, including some of Iran’s most important steel and petrochemical plants. The damage sustained during these attacks has led to major production outages for key industrial goods. The general decline in maritime traffic in the Strait of Hormuz and the specific disruptions caused by the U.S. naval blockade have not only reduced Iran’s exports; they have also throttled imports of much-needed capital and consumer goods. According to a July estimate by the International Monetary Fund, Iran’s GDP is set to contract 5.4 percent this year after shrinking by less than half that over the previous 12 months. Year-on-year inflation climbed from 52.6 percent in December 2025 to 88.6 percent by the start of the summer. The value of the country’s currency has hit a record low of over two million rials to the dollar.\nBut even as the country’s economic situation is getting worse, Iran’s leadership remains better able to resist the coercive effects of sanctions than it might appear. The state of the economy is not yet impinging on Iran’s ability to wage war. Stockpiles of various goods remain deep, thanks to years of sanctions experience. And the Iranian state, with its powerful repressive tools, has figured out how to offload much of the economic pain onto ordinary Iranians while making sure its own needs are met. Trump’s approach, in other words, can certainly immiserate most of the country’s people. But it cannot successfully strangle the Islamic Republic itself.\nANATOMY OF A CRISIS\nIranian officials have acknowledged the country’s economic difficulties. “No matter how strong we are militarily, if the people are hungry and we do not have financial circulation, economic growth and domestic production, we will not endure,” declared Mohammad Bagher Ghalibaf, the speaker of Iran’s parliament and a key power broker, on August 21. (Bessent cited this quote as evidence that U.S. economic warfare was having its intended effect.) During a television interview last week, Iranian President Masoud Pezeshkian expressed frustration that some of his fellow political leaders continue to deny that sanctions are harming the country. “Some say sanctions have no effect at all; I really don’t know what to say to those people,” he remarked.\nThe statements from Ghalibaf and Pezeshkian reflect genuine concern about Iran’s economic trajectory. The speaker and the president are understandably worried about deteriorating public opinion, given the inherent connections between general economic welfare and political legitimacy. But U.S. officials should be wary of overinterpreting these statements. Contrary to what it might seem, neither leader is suggesting that the country’s economy is on the brink of collapse.\nAmerican assessments of the Iranian economy and the success of economic coercion fail to account for the ways in which sanctions have transformed Iran’s political economy, altering the distribution of economic resources in ways that reinforce its exis", "translation_ja": "", "vocab": [{"word": "economic coercion", "definition": "経済的圧力や制裁を使用して、ある国や政権に特定の行動を強いること。特に国家間の政策変更を目的とした経済的脅迫を指す。"}, {"word": "sanctions-evasion", "definition": "経済制裁の対象を逃れるための技術や方法。禁止されている貿易や取引を秘密裏に継続する行為。"}, {"word": "immiserate", "definition": "人々を貧困や苦難に陥れる、または生活水準を著しく低下させること。社会的困窮をもたらす。"}, {"word": "resilience", "definition": "困難や圧力に対する回復力や耐久力。危機的状況から立ち直る能力や柔軟性。"}, {"word": "trajectory", "definition": "時間とともに変化する進路や傾向。特に経済や政治情勢の将来の方向性を指す。"}, {"word": "repressive tools", "definition": "政府が国民の自由や権利を抑制するために使用する法律、警察力、監視体制などの手段。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-09 22:53 JST";
  renderTabs();renderList();
})();
</script>
