bond markets selling off again? Reuters", "summary_en": "Why are world bond markets selling off again? Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMingFBVV95cUxQbHlJS0dDUGUxQWFaeWpJX21IdEZqSmw1UFRBcmcxajlsZW1yNlVVRm1ZQUVHQ0huUGdIdnBRTU1id0k3dVl1SlJ0UkxmNFUwNy1nWTNDcWtZdVpqOHp3czVja1hNWnZfQ2RxZnNUNDJYdXlSdVluME5vTjlhNVlYOEhUVVZRNVd1RzU3NWJyb0Q5R1hxZ2NOVGdZSFBnQQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Christa Pike in critical condition after surviving two lethal injections, lawyer says", "title_en": "Christa Pike in critical condition after surviving two lethal injections, lawyer says", "summary_ja": "Pike’s lawyers have asked for her death sentence to be commuted following the botched execution.", "summary_en": "Pike’s lawyers have asked for her death sentence to be commuted following the botched execution.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmn4540d4z87o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Christa Pike in critical condition after surviving two lethal injections, lawyer says\n- Published\nTennessee death row inmate Christa Pike is in \"critical condition, receiving life-saving care\" at hospital, after surviving two lethal injection attempts, leading the state's governor to halt all executions for the year.\n\"We don't have a sense of her prognosis or much update on her health at the moment,\" her lawyer Randy Spivey told reporters on Thursday. \"But we do know that she is alive right now.\"\nHer lawyers are now asking for her sentence to be commuted. Pike, 50, was sentenced to death in 1996 for the murder of Colleen Slemmer.\nShe was injected with two lethal doses of pentobarbital on Wednesday but remained alive, her lawyers said. She was then sent to hospital in an ambulance.\nPike was 18 when she and her then-boyfriend, Tadaryl Shipp, beat, tortured and killed 19-year-old Slemmer.\nHer attempted execution on Wednesday was the subject of a last-minute legal battle. This culminated in the US Supreme Court allowing the lethal injections to go ahead.\nSlemmer's mother May Martinez, who was among those who wanted the execution to take place and who travelled to Tennessee to witness it, told NBC News after the botched attempt that \"it was a mess\".\nOn Thursday afternoon, Pike's lawyers offered more details about what happened during the attempted execution, describing a harrowing scene shrouded in secrecy.\n\"Last night, the execution team attempted to establish an IV line for an hour,\" Spivey said. \"I counted at least seven needles used in her left arm alone, one of which appeared to be bent when it was pulled from her arm after an unsuccessful attempt.\"\nSpivey said that observers were kept in a dark room behind a closed curtain, after the second lethal dose had been administered and \"it was clear that Miss Pike was still breathing\" minutes later.\n\"No-one knew what was going on behind that curtain,\" Spivey said. \"I had no idea when and if medical professionals began to assist.\"\nSpivey said the state's governor must commute Christa's sentence now, a request that was denied previously.\nStephen Ferrell, another of Pike's lawyers, said they were also looking at other legal options.\n\"We want to think this through and we want to make sure that Christa recovers and has some input in what she wants,\" he said.\nTennessee Governor Bill Lee has ordered an independent review and said on Thursday the investigation into Pike's botched execution \"will be thorough\", adding that \"it's going to take time\".\n\"There are a lot of questions,\" Lee said. \"The people of our state deserve to have those questions answered, and that's what this investigation is for.\"\nLee has not made clear who will conduct the independent review of the state's execution procedures.\nHis order to pause all executions will overlap with the planned 3 December execution of convicted murderer Gary Sutton.\nThe Tennessee Department of Correction, which handled the execution, issued a statement defending its handling of the case.\nIt said in a statement that it \"followed every step of the State's lawful, established execution protocol approved by the attorney general's office\".\n\"The lethal injection chemical in the protocol has consistently been effective, and the protocol does not allow for additional procedures beyond what was carried out this evening.\"\nPike was given two doses of the chemical pentobarbital, in accordance with state protocol when the first attempt fails, but was still alive afterwards, according to court filings by her lawyers.\n\"This execution is causing Ms Pike unnecessary agony and occurring in violation of his right to be executed free of cruel and unusual punishment,\" her lawyers said.\nThe Tennessee attorney general's office said in a statement that it agreed with the decision to call for an investigation, adding: \"We need to know what happened.\"\nUS Republican Senator Marsha Blackburn, who is running for Tennessee governor, described the situation as \"tragic\".\n\"While there should be a thorough review of what happened and why the process failed, the answer is simple: bring back the electric chair,\" Blackburn said.\nDemocrat Jerri Green, Blackburn's opponent, criticised her for wanting to \"bring back one of the most cruel forms of capital punishment\".\n\"As governor, I would put a moratorium on all future executions,\" Green said on X.\nThis is the second time in 2026 Tennessee officials attempted and failed to execute a prisoner.\nIn May, the execution of Tony Carruthers was called off after staff were unable to find a vein to administer a lethal drug. Carruthers was given a year's reprieve.\nWith additional reporting by Stephanie Hegarty, World Service correspondent\nRelated topics\n  - Published14 hours ago\n  - Published1 hour ago", "translation_ja": "", "vocab": [{"word": "commuted", "definition": "刑罰を軽減または免除すること。死刑判決などの厳しい判決を、より軽い罰に変更する法的手続きを指す。"}, {"word": "lethal", "definition": "致命的な、死をもたらす。毒性物質や危険な行為が人命を奪う可能性があることを表す。"}, {"word": "botched", "definition": "失敗した、台無しにした。計画や実行が不適切で、期待した結果が得られなかったことを意味する。"}, {"word": "culminated", "definition": "最高潮に達した、終局を迎えた。一連の出来事が重大な結果や決定に至ることを表す。"}, {"word": "harrowing", "definition": "極度に苦痛な、気が気でない。非常に不安や恐怖を感じさせる状況や経験を表す。"}]}, {"title_ja": "What happened in the failed execution of Christa Pike - and what next?", "title_en": "What happened in the failed execution of Christa Pike - and what next?", "summary_ja": "The convicted killer is in hospital in Tennessee after surviving two lethal injections, in a case that has raised many questions.", "summary_en": "The convicted killer is in hospital in Tennessee after surviving two lethal injections, in a case that has raised many questions.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckge4eql4q7eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "What happened in the failed execution of Christa Pike - and what next?\n- Published\nUS convicted murderer Christa Pike is in a critical condition in hospital after Tennessee authorities failed to execute her by lethal injection, her lawyer says.\nThe case of Pike, whose attempted execution on Wednesday had already been the subject of a high-profile legal battle, raised a number of questions, including what went wrong? And what happens next?\nA third-party review has been ordered by state Governor Bill Lee, who has halted executions in Tennessee for the rest of the year.\nHow did it go wrong?\nPike, now 50, was sentenced to death in 1996 for the murder a year earlier of 19-year-old Colleen Slemmer.\nPike was scheduled to be put to death in Tennessee on Wednesday evening local time. The injections were allowed by the Supreme Court at the 11th hour.\nPike was given two injections of the drug pentobarbital, but her legal team said these failed to stop her heartbeat and that she could still be heard snoring.\n- Tennessee halts executions after death row inmate Christa Pike survives hers \n  - Published1 hour ago\n- US death row inmate survives execution attempt after two lethal injections \n  - Published14 hours ago\nThe Tennessee Department of Correction has defended the method it used, saying \"the protocol does not allow for additional procedures beyond what was carried out\".\nThe state protocol does not clearly specify what should happen if an inmate remains alive after a second dose, according to the AP news agency.\nAuthorities are yet to say whether they will try again to execute Pike. They have not explained why the dosage given to Pike was non-fatal.\nOpponents of the death penalty said it was difficult to know what went wrong, because part of Pike's execution happened behind a curtain.\nMaya Foa, the head of international legal organisation Reprieve, said: \"Lethal injection relies on secrecy at every stage, to hide the violence of the state taking a human life.\"\nWhat happens next?\nThe Tennessee correction department said Pike had been taken to an off-site medical facility, while one of her lawyers said on Wednesday that she was being given \"life-saving measures\" in hospital.\nOn Thursday, lawyer Randy Spivey told reporters: \"We don't have a sense of her prognosis or much update on her health at the moment.\"\nDr Joel Zivot, a professor at the Emory University School of Medicine, told the BBC in an email: \"It's very possible that as a consequence of the delay of the beginning of resuscitation she [Pike] will have a brain injury.\"\nHistorically, the US Supreme Court has not halted second attempts at executions, said John Mills, a lawyer who works with inmates sentenced to death.\nIn 2024, it allowed Alabama to proceed with a second execution of Kenneth Eugene Smith, using an experimental oxygen deprivation method, after their attempt to kill him by lethal injection failed two years earlier.\nA notable Supreme Court case from 1947 allowed the state of Louisiana to try a second electrocution of Willie Smith, a teenager whose first execution attempt failed when he was 17 years old.\nThe court found a second execution would not violate the Constitution's prohibitions against double jeopardy or cruel and unusual punishment and Smith was executed aged 18.\n\"If the question is, is it likely the federal courts would intervene in a second attempt? I'm afraid the answer is a resounding no,\" Mills said of Pike's case.\nWhat is pentobarbital?\nPentobarbital is a potent sedative that slows down the body, including the nervous system. Doctors sometimes use it as a treatment for certain conditions, but in high doses it can also be used as a lethal injection to cause death.\nIts use in lethal injections came under renewed scrutiny last year after a US federal government review during the Biden administration raised concerns about the drug's potential for \"unnecessary pain and suffering\".\nThe Biden government banned its use in federal executions, but that did not bind individual states such as Tennessee, which can choose their own methods.\n- Why the death penalty is on the rise in US \n  - Published13 August\nIn recent years, states have found some drugs needed for lethal injections harder to come by, because pharmaceutical companies have opposed the use of their products for such purposes.\nThe Tennessee correction department has not specifically addressed an allegation from Pike's legal team that the pentobarbital it used was \"degraded\".\nBut the department said in a statement the lethal injection chemical had \"consistently been effective\".\nHas this happened before?\nThe attempted execution of Pike was not the first in Tennessee in 2026 that did not go to plan.\nThe execution of Tony Carruthers, who was convicted of kidnapping and murdering three people in 1994, was postponed in May after staff were unable to find a vein for a lethal injection. He was granted a year's reprieve by the governor.\nIn 2022, more than a third of executions across the US were", "translation_ja": "", "vocab": [{"word": "lethal", "definition": "致命的な、死をもたらす。特に刑罰や注射など人命に関わる文脈で使用される。"}, {"word": "protocol", "definition": "公式な手順または規則。医学、法律、外交などの分野で、従うべき標準的な手順を指す。"}, {"word": "inmate", "definition": "刑務所や拘置所に収容されている人。囚人を意味する正式な用語。"}, {"word": "prognosis", "definition": "医学用語で、患者の病状や状態の見通し、予想される結果や回復の可能性。"}, {"word": "secrecy", "definition": "秘密にしておくこと、秘密裏に行うこと。透明性の欠如を示唆する文脈で使われる。"}]}, {"title_ja": "Netanyahu says Flydubai attacker had 'Islamist radical indoctrination'", "title_en": "Netanyahu says Flydubai attacker had 'Islamist radical indoctrination'", "summary_ja": "Israel's prime minister says the pilot who tried to take over the Flydubai plane clearly intended to \"down the plane\".", "summary_en": "Israel's prime minister says the pilot who tried to take over the Flydubai plane clearly intended to \"down the plane\".", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crje8edqyej9o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Netanyahu says Flydubai attacker had 'Islamist radical indoctrination'\n- Published\nIsraeli Prime Minister Benjamin Netanyahu says investigations suggest the man who stabbed his fellow pilot and tried to take over a flight from Dubai to Tel Aviv had undergone \"Islamist radical indoctrination\".\nThe Flydubai plane plunged more than 17,000ft (5,200m) two hours into its journey on Wednesday, before passengers and crew overpowered the attacker and retook control to land safely.\nNetanyahu told Fox News that it was looking \"very likely\" that the attacker, who he said was an Omani national, \"was going to down the plane\".\nMeanwhile, the United Arab Emirates (UAE) state news agency reports investigations have begun there to determine \"whether the incident was linked to any terrorist activity or purpose\".\nThe Interior Ministry of Saudi Arabia - where the plane made an emergency landing - said that both the pilot and co-pilot had been sent back to the UAE on Thursday morning after medical teams had cleared them.\nUAE officials earlier claimed jurisdiction over the incident because the aircraft on which the attack took place is registered there and flies under its flag.\nNetanyahu told Fox that once the attacker had been subdued and tied up by passengers and crew, he was \"calling out to the aircrew 'kill me, kill me', so it's clear he was suicidal - that's not a question\".\n\"And with all the passengers in there, and if you couple that with what I just told you about the Islamist tendencies, that radicalisation that were found in his background, I think... that'll give us a pretty good clue.\"\nHowever, he stressed that he did not want to draw any firm conclusions as to motive yet.\nBoth US President Donald Trump and UAE officials have indicated to the media that Iran may be responsible for the incident, without definitively blaming Tehran.\nTrump told reporters on Thursday that Iran would be \"hit very hard\" if it was deemed to have been involved in the attack.\nPilots from countries without diplomatic relations with Israel were usually not allowed to fly there, Netanyahu said when asked about how the suspected Omani pilot came to be on the plane.\nHe added: \"Obviously there was a loophole here and we're taking care of that among other things... with the full co-operation, I have to say, of the Emirati government, so we're both interested in making sure this doesn't happen again.\"\nOman has not formally established official ties with Israel, unlike the UAE.\nThe prime minister was also asked earlier on the same network whether there was an indication if Iran was involved, he replied: \"It's too early to say\".\n- Flydubai passenger describes hugging his children as plane nosedived during attack \n  - Published10 hours ago\n- Who is the 'hero' Indian pilot who was stabbed on Israel-bound flight? \n  - Published9 hours ago\nBoth Netanyahu and Indian Prime Minister Narendra Modi said the stabbed pilot, Indian national Capt Smit Machchhar was a \"hero\".\nIndia's ambassador to the UAE Deepak Mittal visited Captain Machhar in hospital on Thursday, the Indian Mission confirmed on social media, stating he was \"in good health and recovering well\".\nPreliminary findings from a separate Israeli investigation into the incident, suggest that the alleged attacker intended to crash the plane, an Israeli security source told BBC Arabic.\nThe source said the investigation - led by Israel's intelligence agency Mossad - interviewed passengers after they arrived in Tel Aviv to establish what had happened on the plane.\nFlydubai's flight FZ1073, with more than 170 people on board, took off from Dubai International Airport in the UAE at 03:05 GMT (07:05 local time), en route to Ben Gurion Airport.\nTwo hours later, the 17,000ft drop in altitude was reported on the plane tracking website Flightradar24 and minutes later the plane signalled an emergency code.\nAt about 05:40, the plane - which had briefly entered Jordanian airspace - looped back into Saudi Arabia, where it later started its manual descent, landing safely at Tabuk Airport in the north west of Saudi.\nFlydubai has since suspended flights between Dubai and Tel Aviv as it carried out its own investigation into the incident.\nIsrael's Transportation Ministry said the suspension aligns with Netanyahu's directive.\nIsraeli airlines including El Al, Israir and Arkia said plans were in place to operate rescue flights from Dubai starting on Friday to bring back stranded passengers.\nThe Transportation Ministry also said it sent an urgent request to Etihad Airlines to increase the number of flights between Abu Dhabi and Tel Aviv.", "translation_ja": "", "vocab": [{"word": "indoctrination", "definition": "特定の思想や信念を繰り返し教え込むことで、人の考え方を強く影響させるプロセス。通常、批判的思考を制限し、特定のイデオロギーを受け入れさせることを目的とする。"}, {"word": "plunged", "definition": "急激に、または急速に下降すること。物理的な降下だけでなく、状況や感情が突然悪化することも意味する。"}, {"word": "subdued", "definition": "力ずくで抑圧する、または制御下に置く。また、抵抗力を失わせた、または弱められた状態を示す。"}, {"word": "jurisdiction", "definition": "特定の事柄に対する公式な権限や司法権限。どの機関や国が事件を調査・処理する権利を持つかを決定する法的な権威。"}, {"word": "definitively", "definition": "明確で疑いの余地がない方法で、または最終的に決定的に述べること。曖昧さなく、はっきりと結論を下すことを意味する。"}]}, {"title_ja": "UK-Iranian dual national arrested over RAF Fairford incident, police say", "title_en": "UK-Iranian dual national arrested over RAF Fairford incident, police say", "summary_ja": "The 25-year-old man was arrested in Westminster, London, marking the sixth arrest in connection with Sunday's incident near the airbase.", "summary_en": "The 25-year-old man was arrested in Westminster, London, marking the sixth arrest in connection with Sunday's incident near the airbase.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmdx5xw36492o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "UK-Iranian dual national arrested over RAF Fairford incident, police say\n- Published\nA UK-Iranian dual national has been arrested on suspicion of preparation of terrorist acts in connection with the incident at RAF Fairford, counter-terror police have said.\nThe 25-year-old man was arrested in Westminster, London. Two properties in the area have been searched.\nFive men in their twenties who were arrested near the Gloucestershire airbase on Sunday remain on police bail. All five were UK nationals from London.\nCounter-terror police are considering \"all possible angles - including foreign state involvement\", the force's senior national coordinator Vicki Evans said.\n\"The investigation into circumstances surrounding events in Gloucestershire is hugely complex, and our specialist teams are interrogating multiple lines of enquiry,\" she said.\n\"I'd like to thank the public for their continued support and patience whilst we work through this investigation.\"\nPolice had initially given the dual UK-Iranian national's age as 27 and said a second man had been questioned under caution, but in a later update said that this was not the case.\nPrime Minister Andy Burnham said on Wednesday there were \"strong indications\" that Iran played a part in the incident. He did not provide further details, and Tehran has strongly denied any involvement.\nThe five men were arrested in the early hours of Sunday morning after \"three suspicious vehicles\" were reported travelling towards the base operated by the US Air Force (USAF), sparking a major security incident.\nThe BBC understands that one of the men had dialled 999 himself, about an hour before a local farmer alerted police to a \"large group\" of masked men near the vehicles.\nThey were arrested on suspicion of explosives offences and later on suspicion of preparing a terrorist act, before being released on bail on Monday in what police called an \"investigative decision\" that was \"grounded in experience and strategy\".\nPolice said a quantity of petrol but no explosive devices were found during searches of vans near the site.\nThe group were aged between 23 and 25. Four live in Westminster and one in Camden, and searches of their homes were carried out.\nUS Secretary of State Marco Rubio said on Monday that \"the hands of a foreign actor\" had clearly been involved in the incident at the base, which has been used as a forward operating location by the USAF for decades.\nIn recent months, US bombers have taken off from the airbase for the Middle East, after the UK approved a US request to use it for what it called defensive strikes on Iran.\n  - Published4 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "dual national", "definition": "2つの国籍を持つ人のこと。ここではイギリスとイランの両国籍を持つ人を指す。国際的な問題や複雑な法的状況で使われる用語。"}, {"word": "counter-terror", "definition": "テロ対策・テロ防止に関する活動を示す用語。警察や政府機関がテロ行為を防ぐための専門的な活動を指す。"}, {"word": "interrogating", "definition": "詳しく調査する、厳密に取り調べるという意味。複数の疑問や事柄について深く掘り下げて調べることを表す。"}, {"word": "suspicion", "definition": "疑い・容疑という意味。法的文脈では、犯罪行為を行った可能性があると考えられる状態を指す。"}, {"word": "forward operating location", "definition": "前進基地・前線作戦拠点という軍事用語。作戦活動を行うために設置された前線の重要な軍事施設を意味する。"}]}, {"title_ja": "Crypto thieves attack man in home and threaten to kill pregnant wife's baby in 'horrific' robbery", "title_en": "Crypto thieves attack man in home and threaten to kill pregnant wife's baby in 'horrific' robbery", "summary_ja": "The man was beaten with hammers until he transferred hundreds of thousands of pounds of cryptocurrency.", "summary_en": "The man was beaten with hammers until he transferred hundreds of thousands of pounds of cryptocurrency.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6eq84eygz0qo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Crypto thieves attack man in home and threaten to kill pregnant wife's baby in 'horrific' robbery\n- Published\nWarning: This story contains distressing details\nA businessman was beaten with hammers by masked men who broke into his home and threatened to kill his heavily pregnant wife unless he transferred hundreds of thousands of pounds of cryptocurrency.\nSpeaking to the BBC, the couple, who want to remain anonymous, described the attack as \"horrific\" and said they feared for their unborn baby's life.\nThe attackers left in a car driven by a getaway driver after the man transferred his crypto savings.\nCrimestoppers are offering a £10,000 reward for information in the attack, which was captured on home security footage and is being investigated by the police.\nExperts say it is one of a growing type of violent theft known as a \"wrench attack\" targeting cryptocurrency investors.\nAs crypto coins have risen in value, reports of these violent robberies linked to digital assets have emerged in the UK, France and the US.\nOnce funds are transferred, recovering them can be extremely difficult.\nThe man, who the BBC is calling James, said three intruders forced their way into their Solihull home before launching an assault which lasted 45 minutes.\n\"The door gets pushed open, I can see gloves coming in, balaclavas,\" he said.\nJames tried to fight the men off but they hit him in the face, head and ribs with hammers.\nHis wife, who was seven months pregnant, was held down on the sofa by one of the criminals.\n\"He's got a pillow over her face,\" James said. \"He's literally suffocating her on the sofa. I can hear her screaming, 'I can't breathe'.\"\nThe couple still had no idea what the criminals wanted until one of the men demanded James unlock his phone and hand it over.\nJames said the attackers appeared to know he owned cryptocurrency, but had little understanding of how to access it.\nInstead, they were taking instructions from someone else connected via a live video call.\n\"I can hear the guy on FaceTime saying: 'Show me everything on his phone. Show me what apps he's got',\" he said.\nWhen the caller identified a crypto wallet containing substantial funds, the threats escalated dramatically.\n\"He was basically saying: 'Look, if you don't send us this money now, we're going to stab your wife in the stomach and kill your baby. We're going to kill your wife',\" James said.\nHis wife, who also did not want to be named, described the attack that happened in December last year as \"horrific\" and said she feared James had been killed when he was unresponsive on the floor.\n\"It was terrifying,\" she said.\nThe woman, in her early thirties, was expecting her third child at the time and said she feared she might lose the baby due to the stress of the attack. The baby survived and was born at full term.\nThe men left after James transferred his savings - hundreds of thousands of pounds of cryptocurrency - to the digital wallet of the man on the video call.\nThey also stole several luxury Rolex watches.\nJames said before they left, he heard the man on the video call tell his accomplices: \"You can have 10 grand each but I am taking the rest.\"\nRise of the 'wrench attack'\nUnlike money held in a conventional bank account, cryptocurrency is often controlled directly by the owner through digital wallets or physical storage devices.\nFor criminals, that combination of speed, anonymity and irreversibility can make crypto holders attractive targets.\nWhilst the vast majority of cryptocurrency theft happens online through hacks and scams, crypto investigators at Chainalysis say \"wrench attacks\" have surged in recent years.\nAccording to their research, $30m (£22.6m) had been stolen so far this year up to June in violent robberies, making 2026 likely to become the single-worst year for violent crypto attacks on record. Home invasions are also on the rise this year, it found.\nThe US, Brazil, and Thailand are hotspots but France has seen the largest number of attacks by far, as a result of a data breach at a tax office that has apparently allowed wealthy crypto holders to be located.\n\"The physical security assumptions that protect traditional wealth, such as bank vaults and armored cars, do not automatically apply in crypto. Often, holders keep their assets in comparatively low security setups, like self-custody wallets, that can be compromised without any institutional gatekeeper standing in the way,\" said researchers in their report.\nJames said he became an amateur investor in crypto coins in 2020 and made enough money to quit his job in 2023 to trade full time.\nNow he has lost everything and is looking to get back to his traditional job.\nPolice have yet to identify the attackers.\nCrimestoppers is offering a £10,000 reward for information leading to progress in the investigation.\nAlan Edwards from the charity hopes people might have information about the three attackers, the driver who was parked outside without a face covering, or the man on the phone.\n\"These cri", "translation_ja": "", "vocab": [{"word": "wrench attack", "definition": "暗号資産の所有者を対象にした暴力的な強盗の一種。被害者に物理的な危害を加えることで、デジタル資産の譲渡を強要する犯罪手口。"}, {"word": "escalate", "definition": "段階的に悪化する、エスカレートする。ここでは脅迫や暴力の程度がだんだん激しくなることを意味する。"}, {"word": "substantial", "definition": "かなりの量の、相当な。金額や規模が大きく、重要性のあることを表す。"}, {"word": "retrieved", "definition": "回収する、取り戻す。失われた、盗まれた、または失った物を取り戻すことを意味する。"}, {"word": "anonymous", "definition": "匿名の、身元を明かさない。個人の安全やプライバシー保護のため、名前や身元を隠すことを指す。"}]}, {"title_ja": "US says Europe should ready fuel supplies as Trump threatens diesel ban", "title_en": "US says Europe should ready fuel supplies as Trump threatens diesel ban", "summary_ja": "President Donald Trump has threatened to ban diesel exports in a bid to ease prices in the US ahead of the November elections.", "summary_en": "President Donald Trump has threatened to ban diesel exports in a bid to ease prices in the US ahead of the November elections.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5zjzjgdeneeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "US says Europe should ready fuel supplies as Trump threatens diesel ban\n- Published\nDonald Trump has said he may ask European countries to release some of their diesel reserves as he mulls a ban on US exports of the fuel amid a global shortage.\nThe comments followed his Treasury Secretary Scott Bessent urging for Europe to immediately ready and release such supplies. \"American farmers, truckers, and businesses should not be left carrying the burden\" as prices soar, he argued.\nThe US has threatened to restrict diesel exports amid surging costs due to the war in Iran. The issue is top of mind for US voters ahead of the crucial midterm elections.\nOn Thursday, Britain held talks with European partners about the potential release of diesel reserves in response to any ban.\nThe US is a vital supplier of diesel to the world, exporting between 1.2 and 1.5 million barrels per day, with experts warning a ban on shipments abroad could put further pressure on prices in other countries.\n\"We're thinking about it very seriously,\" Trump said of an export ban at the weekend.\nOn Thursday Trump added that he may ask European countries to release some of their diesel reserves, while Bessent said they should do so \"immediately\".\n\"Our European partners should accelerate delivery on their existing commitments and make additional supplies immediately available to address ongoing disruptions,\" Bessent said in a post on social media.\nThe plans come weeks ahead of November elections in the US, where control of Congress will be up for grabs. The president is set to travel across the US campaigning for Republicans in hopes of keeping control of the House and Senate.\nDiesel prices in the UK hit record highs this week and are hovering just under 200p per litre, according to motoring organisation the RAC.\nBritain's Energy Minister Martin McCluskey was on a call with European counterparts on Thursday to discuss the potential ban.\nA source familiar with the discussions told the BBC it was prudent to prepare a co-ordinated response with other countries, including those across EU, but added that there were still European reserves left from a coordinated release of strategic fuel stocks earlier in the year.\n\"We have a diverse and resilient supply. We continue to engage with our international partners and the UK fuel industry,\" a government spokesperson said. The government has stressed that there is no cause for concern about potential diesel shortages, though prices are expected to rise further.\n- What a US diesel export ban could mean for you \n  - Published3 days ago\nA European Commission spokesperson said today that there were \"lots of calls, lots of meetings\" taking place on the diesel situation, including with \"high level contacts\" in the US administration.\nPrices of petrol and diesel globally have skyrocketed since the outbreak of the US-Israel war in Iran in February. The closure of the vital Strait of Hormuz, which typically transports around a fifth of the world's oil and gas, has pushed up the price of products made from oil.\nAn export ban from Russia, also a major supplier of diesel, has added to the pressure on prices.\nTrump has argued that keeping any surplus barrels of diesel in the US would lower pump prices domestically, offering immediate relief to drivers, truckers, and businesses ahead of the midterm elections.\nBut David Fyfe, chief economist at Argus Media, said cutting off American supply would likely cause international prices to skyrocket.\nDiesel prices have hit an all-time high in the UK, with the latest RAC figures showing average pump prices at 199.79p per litre, up from 142.38p\nDiesel is harder to refine than gasoline and, because it is used by the haulage industry and in agriculture, it is very difficult to reduce demand.\nThe UK is heavily reliant on imports. Although the four refineries in the UK make more than enough petrol to meet demand, they do not make enough diesel for the country's needs.\nThere were 15.1 million diesel vehicles on UK roads at the end of June, according to the Department for Transport. That is a drop from 15.7 million a year before.\nThere were 9.8 million diesel cars, down year on year from 10.4 million.\nRelated topics\n  - Published3 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "mulls", "definition": "〜を慎重に検討する、思案する。重要な決定を下す前にじっくり考えることを意味する。"}, {"word": "surging", "definition": "急速に増加する、急上昇する。価格や需要などが劇的に上昇する様子を表す。"}, {"word": "accelerate", "definition": "加速する、促進する。プロセスやスケジュールを早めることを指す。"}, {"word": "resilient", "definition": "回復力のある、しぶとい。困難な状況から立ち直る能力を持つことを意味する。"}, {"word": "disruptions", "definition": "混乱、支障。通常のサプライチェーンや供給体制が乱れることを指す。"}]}, {"title_ja": "Klopp wins first game as Germany coach, without 'top dogs'", "title_en": "Klopp wins first game as Germany coach, without 'top dogs'", "summary_ja": "It may have taken a little longer than he would have liked, but Jürgen Klopp has finally won a game as Germany coach. Despite a number of debutants, it was a familiar face who stood out in the victory over Serbia.", "summary_en": "It may have taken a little longer than he would have liked, but Jürgen Klopp has finally won a game as Germany coach. Despite a number of debutants, it was a familiar face who stood out in the victory over Serbia.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/klopp-wins-first-game-as-germany-coach-without-top-dogs/a-79508898?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Klopp wins first game as Germany coach, without 'top dogs'\nOctober 2, 2026\nAfter 47 days, three matches and 44 squad players, Jürgen Klopp has a first win as coach of Germany's men's fotball team. A straightforward 2-0 victory over Serbia in the Nations League on Thursday meant the former Liverpool and Borussia Dortmund coach avoided becoming the first Germany boss to win any of his first three games.\n\"I'm really happy today,\" Klopp told German public broadcaster ZDF. \"We were outstanding when defending and when we had the ball. We simply played wonderful football.\"\nKlopp had raised a few eyebrows by naming two squads for the four fixtures in this extended international window. But after a somewhat fortunate draw against the Netherlands and a shock loss to Greece with the more senior of the squads, it was left to those lower down the pecking order to get things going Thursday in Munich.\nBischof gets first goal on home turf\nThat meant a completely new starting XI and debuts to goalkeeper Jonas Urbig and winger Derry Scherhant. Such players should \"develop without the top dogs\" Klopp said before the game. And while Urbig was untroubled by Serbia, his Bayern Munich teammate Tom Bischof made his mark by turning in the opener after Florian Wirtz, one of the sprinkling of senior players, hit the post. It was Bischof's first goal for Germany in only his second national team game.\n\"It's indescribable,\" said Bischof after the game at Bayern's Allianz Arena. \"The stadium was on fire. I let it all out and was overjoyed.\" Unfortunately, he said, \"my knees hurt a little from sliding on my knees. But that doesn't matter.\"\nAfter a string of tournament failures, the latest new dawn for Germany comes with a little more patience. As well as Klopp's track record, there is a general acceptance from inside the country and abroad that Germany are no longer a top tier side.\n\"We're not the Bayern Munich of European football,\" Klopp said prematch. \"We're a team that needs to find its footing.\"\nKlopp: 'I liked everything'\nWhile one win against a limited Serbia side will not change that, the emphatic nature of the performance impressed the new boss.\n\"I liked everything — the opening phase, the middle section, and the end. Our counter-pressing was off the charts,\" said the man whose Gegenpressing (Counter-pressing) tactic became his trademark at Dortmund. \"We can afford to take all the liberties and risks we want when we win the ball back together. Everyone was there during our pressing moments.\"\nThe second half brought more debuts for players who may not have made a traditional 26-man squad. Cologne winger Said El Mala and Brentford's Vitaly Janelt made their Germany bows while Celtic's Mika Baur became the country's 1,000th men's international.\nIt was \"surreal,\" Baur said. \"Today was a highlight for everyone, not just for me with my debut.\"\nWirtz provides spark and hope\nWhile Klopp may have seen enough from a few of the second string to afford them opportunities in the future, the performance of Liverpool midfielder Wirtz, who scored Germany's second goal, may be the most critical of the night.\nWirtz, 23, has struggled to find his best form in the Premier League and has blown hot and cold in his 47 caps for Germany. A cool and composed finish suggested that the player who was so highly regarded at Bayer Leverkusen can be coaxed to life by Klopp.\n\"It was loads of fun. Every single one of us gave it our all on the field. We stuck to the game plan and did almost everything right,\" said Wirtz, who took the captain's armband later in the game. \"The players around me made it easy for me. We had a lot of movement in the middle. We were all fired up.\"\nThe challenge now for Klopp is to work out which of his wide pool of players are the ones he can rely on to take Germany to Euro 2028 and beyond. The next step is a chance for revenge against Greece in Thessaloniki on Sunday.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "pecking order", "definition": "組織内での序列や階級制度のこと。誰が上位で誰が下位かを示す階層構造を指す。"}, {"word": "emphatic", "definition": "強調的ではっきりとした、印象的な。パフォーマンスや主張が力強く、疑いの余地がない状態を表す。"}, {"word": "trademark", "definition": "特定の人物や組織を特徴づける独特の方法や様式。その人物の個性的な特徴を指す。"}, {"word": "counter-pressing", "definition": "ボール奪取直後に素早く相手を押し込む戦術。守備的な局面から攻撃的に転換する戦略。"}, {"word": "liberties", "definition": "自由や裁量のこと。文脈では、リスクを取る自由度を意味し、攻撃的に積極的に動く余地を指す。"}]}, {"title_ja": "UK police make another arrest in RAF Fairford case", "title_en": "UK police make another arrest in RAF Fairford case", "summary_ja": "Counter terrorism police said a dual UK-Iranian national was arrested on suspicion of preparing terrorist acts. Five men arrested on Sunday remain on bail.", "summary_en": "Counter terrorism police said a dual UK-Iranian national was arrested on suspicion of preparing terrorist acts. Five men arrested on Sunday remain on bail.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/uk-police-make-another-arrest-in-raf-fairford-case/a-79508050?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "UK police make another arrest in RAF Fairford case\nOctober 1, 2026\nPolice in the United Kingdom on Thursday said that another man had been arrested as part of the investigation into Sunday's security incident at a US-run air base in Gloucestershire.\nThe arrest of the dual UK-Iranian national came after British Prime Minister Andy Burnham told the BBC there were \"strong indications that Iran played a part in what happened over the weekend at RAF Fairford.\"\nIran's embassy in London earlier said it \"categorically rejects and strongly condemns\" speculation it was involved while Foreign Minister Abbas Araghchi said Burnham was \"barking up the wrong tree.\"\nWhat police have said\nCounter terrorism police said that a 27-year-old dual UK-Iranian national was arrested in London \"on suspicion of preparation of terrorist acts under Section 5 of the Terrorism Act 2006.\"\nThey said that a second man who is a UK national was also questioned under caution and that searches of two properties had taken place.\n\"The investigation into circumstances surrounding events in Gloucestershire is hugely complex, and our specialist teams are interrogating multiple lines of enquiry,\" said Counter Terrorism Policing's Vicki Evans.\n\"As we've made clear, we're looking at all possible angles — including possible foreign state involvement. I'd like to thank the public for their continued support and patience whilst we work through this investigation,\" Evans said.\nSunday's events at RAF Fairford\nFive men in their 20s, all from the London area and with British citizenship, were arrested on Sunday on suspicion of explosives and terror offenses close to the RAF Fairford air base, which has been used by American bombers to strike Iran.\nThey were wearing face coverings.\nPolice seized three \"suspicious\" white vans and evacuated around 85 households in the vicinity, bringing in bomb disposal teams.\nPolice said a quantity of petrol was but no explosive devices were found in the vans.\nThe suspects have since been released on bail in a move questioned by US President Donald Trump.\nEdited by: Zac Crellin\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "categorically", "definition": "明確かつ絶対的に否定または肯定すること。曖昧さの余地がなく、断定的に述べる様子を表す。"}, {"word": "interrogating", "definition": "複数の情報や証拠を詳しく調べ、検討すること。捜査の文脈では、様々な手がかりを徹底的に追跡することを意味する。"}, {"word": "vicinity", "definition": "ある場所の周辺地域、近隣一帯。特に特定地点から一定の距離内にある周囲の地域を指す。"}, {"word": "disposed", "definition": "配置された、処理された状態。この文脈では爆発物処理班が配備されたことを表す。"}]}, {"title_ja": "On October 3, Latvians will elect a new parliament ― with Russia looming large over the campaign", "title_en": "On October 3, Latvians will elect a new parliament ― with Russia looming large over the campaign", "summary_ja": "On October 3, Latvians will elect a new parliament with Russia looming large over the campaign. Security fears dominate the agenda, but so does a debate over the economic cost of cutting ties with Moscow.", "summary_en": "On October 3, Latvians will elect a new parliament with Russia looming large over the campaign. Security fears dominate the agenda, but so does a debate over the economic cost of cutting ties with Moscow.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/on-october-3-latvians-will-elect-a-new-parliament-―-with-russia-looming-large-over-the-campaign/a-79477614?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Latvians head to the polls with Russia on their minds\nOctober 1, 2026\nFour German Air Force Eurofighter jets stand ready at Latvia's Lielvarde military air base, just 60 kilometers from Riga. The aircraft are part of NATO's efforts to strengthen Baltic air defenses on the alliance's eastern flank ahead. Germany sent the jets amid repeated drone incursions, which have put Latvia on alert ahead of the country's elections on October 3.\nSecurity fears ahead of elections\nSecurity has become one of the defining issues of this campaign — defense promises appearing on the programs of most of the leading parties in Latvia. And the Latvian public's anxieties aren't unfounded.\nIn recent months, several drones have entered Baltic airspace. The latest incident occurred on September 15 in Lithuania, when a drone believed to have crossed from Belarus was shot down by an NATO fighter jet.\nOn top of that there are hybrid threats, including migrant flows that Latvia and its neighbors say are being encouraged by Russia's ally Belarus to pressure the EU and test border security. Intelligence officials of several European countries, including Latvia and the Czech Republic have warned that Russia could seek to test NATO in the upcoming \"months, not years.\"\n\"There are concerns in the West and also here in the Baltic states that Russia might be trying some further actions here in the Baltics,\" says Maris Andzans, director of the Center for Geopolitical Studies in Riga. \"If you want to test NATO, there is no better place than the Baltic states.\"\nNear-unanimous agreement on defense\nLatvia elects its 100-seat parliament, Saeima, through proportional representation, meaning coalition governments are the norm. Polls currently put the centrist United List, led by Prime Minister Andris Kulbergs ahead, followed by the populist alliance Sovereign Power/Young Latvians Alliance and Latvia First led by Ainars Slesers. The center-left Progressives and the conservative National Alliance are also expected to enter parliament.\nMost of these Latvian parties view Russia as a security challenge.\n\"The biggest threat is our neighbors, Russia and Belarus,\" says Agnese Kupca of the United List. \"Our partners in the EU should understand: it is not only our border with Russia, but also EU and NATO border with aggressor.\"\nLatvia is one of the few NATO members that have committed by law to spending 5% of GDP on defense, and analysts say the country's foreign policy orientation is unlikely to change regardless of which coalition emerges after the vote as there is nearly unanimous consensus on the importance of NATO. Which is backed by their voters: according to Friedrich Ebert Stiftung (FES) Security Radar 2025 Latvians generally have a positive view of NATO.\nEconomic concerns among voters\nBut while security policy enjoys broad agreement, the economic consequences of Latvia distancing itself from Russia remain contentious.\nBefore the full-scale invasion of Ukraine, Russia was among Latvia's most important trading partners. Since 2022, Latvia has reduced imports from Russia and Belarus by more than 90% and introduced some of the toughest restrictions in the EU on goods from the two countries. Latvia's economy has adapted, but businesses with strong pre-war links to Russia were among the hardest hit.\n\"This closeness to the theater of war has strongly influenced the investment climate,\" says political analyst Filips Rajevskis. \"So the big question is how to increase the investments and grow the economy.\"\nMany Latvians reject any economic cooperation with Russia on security grounds. Sixty percent said they want Latvia to reduce dependence on Russia, according to FES Security Radar 2025. \"In the current situation, it's absolute nonsense. We can't watch what's happening and still be friends with Russia,\" one passerby in Riga told DW.\nNot breaking up with Russia completely?\nAt the same time 20% of Latvians, according to FES, favor closer ties with Russia. Calls for a more pragmatic approach towards its eastern neighbor are not uncommon in the political debates.\nJulija Stepanenko, leader of Sovereign Power/Young Latvians Alliance, has repeatedly argued against completely severing economic ties with Russia and Belarus.\nEarlier this year, it emerged that Stepanenko has received gifts worth roughly €400,000 ($470,000) from her father, a Russia-based businessman whose company manufactures construction materials, including anti-tank fortifications known as \"dragon's teeth.\" But despite that, her party remains in second place in the polls.\nWhen DW met Lyubov Shvetsova, one of Sovereign Power/Union of New Latvians party candidates at a campaign stand just outside the center of Riga, she rejected accusations that the party is pro-Russian.\n\"Our approach is pragmatism oriented toward the interests of Latvian business,\" she said.\nEconomic pragmatism\nAnother advocate of a more pragmatic economic approach is Ainars Slesers, former businessman and leader of Latvia First.\nDuring a", "translation_ja": "", "vocab": [{"word": "incursions", "definition": "領土や領空への不正な侵入のこと。軍事的な侵犯行為を指す。"}, {"word": "hybrid threats", "definition": "従来の軍事攻撃ではなく、情報操作やサイバー攻撃など複数の手段を組み合わせた脅威のこと。"}, {"word": "proportional representation", "definition": "政党の得票率に応じて議席を配分する選挙制度。小政党にも議席が与えられる可能性がある。"}, {"word": "orientation", "definition": "方向性や指向性のこと。政策や外交方針の向かう方向を示す。"}]}, {"title_ja": "FlyDubai flight passenger details treating wounded pilot after tying up suspect", "title_en": "FlyDubai flight passenger details treating wounded pilot after tying up suspect", "summary_ja": "Dr. Shota Musaev spoke with ABC News about how he saved the pilot of the FlyDubai flight who was attacked by his co-pilot inside the cockpit.", "summary_en": "Dr. Shota Musaev spoke with ABC News about how he saved the pilot of the FlyDubai flight who was attacked by his co-pilot inside the cockpit.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/tel-aviv-flight-passenger-details-treating-wounded-pilot/story?id=136929137", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Christa Pike in critical condition after botched Tennessee execution, attorneys say", "title_en": "Christa Pike in critical condition after botched Tennessee execution, attorneys say", "summary_ja": "Christa Pike, 50, was sentenced to death after being convicted of the 1995 murder of 19-year-old Colleen Slemmer.", "summary_en": "Christa Pike, 50, was sentenced to death after being convicted of the 1995 murder of 19-year-old Colleen Slemmer.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/execution-lone-woman-tennessees-death-row-paused-federal/story?id=136893331", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Trump administration diverts human rights funds to push far-right agenda abroad", "title_en": "Trump administration diverts human rights funds to push far-right agenda abroad", "summary_ja": "Support such as for white Afrikaners and anti-communism reveals how US is redefining what qualifies as human rights With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that", "summary_en": "Support such as for white Afrikaners and anti-communism reveals how US is redefining what qualifies as human rights With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/30/trump-state-department-human-rights-fund", "state_media": false, "category": "政治", "full_text": "With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that includes a huge $40m grant for an anti-communism fund, support for a group advancing white Afrikaner rights in South Africa, a campaign against Brazil’s supreme court and programs that would reward ideological allies in Europe who protect “western civilizational norms”.\nOn Wednesday, the state department obligated the funds to the grantees hours before the deadline despite congressional concerns and requests not to do so, according to a source familiar with the negotiations. The state department declined to comment on questions from the Guardian specifically on whether it had obligated the funds and had “blown” holds from Congress due to concerns about the money’s use.\nCritics have focused on 43 awards of a combined $176.9m that will bolster rightwing and conservative causes around the world while probably angering US allies over interference in internal politics. The Guardian has seen a sample of the controversial grants, which make up most of the $205m in funding that Congress has appropriated for the entire Human Rights and Democracy Fund (HRDF).\nSources with knowledge of the grant process have told the Guardian that the awards were personally lobbied for by members of the Trump administration, and reflect interests that include JD Vance’s warnings of the collapse of traditional western values in Europe and Stephen Miller’s push against immigration and to support white minorities in countries like South Africa.\n“The story for me is the high-level – including White House-directed – attention on these programs,” said a person familiar with the discussions over the democracy awards. “These awards have been briefed at the highest levels of the department and have buy-in from the White House.”\nThe proposed awards represent a significant shift in US support for dissidents, human rights defenders and civil society groups under authoritarian governments. The new slate includes projects in wealthy nations, and those focused on opposition to regulation, Brexit, immigration, anti-communism, Christian protection and opposition to “gender ideology”, offering a window into how the Trump administration is redefining what qualifies as human rights and merits tens of millions of dollars in US foreign assistance.\n“Congress appropriated money for the democracy fund on a bipartisan basis to support defenders of human rights, to assist victims of human rights violations and to instead promote the growth of democracy abroad,” said Jeanne Shaheen, the top Democrat on the US Senate committee on foreign relations.\n“The Trump administration’s proposals would use taxpayer funds to promote far-right organizations and programs in established democracies. This is a waste of resources and undermines United States values and relations with democratic partners, including allies in Europe.”\nA Democratic congressional aide said Shaheen had maintained 10 holds on $22m of awards focusing on Brazil, South Africa, Nigeria, and the promotion of a rightwing ideology in the United Kingdom and in Europe. According to the aide, secretary of state Marco Rubio had personally signed a memo to disregard the holds and obligate the funds.\nThe largest award, of $40m, was directed to a consortium led by the Victims of Communism Memorial Foundation (VOC), an anti-communist non-profit that has received far smaller grants in the past. A state department vetting document seen by the Guardian records $96,997 in previous contracts in the last five years between the foundation and the department, all in the 2022 fiscal year, and notes that it had been vetted in 2019 in connection with tickets to the foundation’s gala. The vetting document also identifies Andrew Bremberg, a former Trump White House domestic policy adviser and US ambassador to the UN European office, as a “senior leader” of the foundation.\nIn July, ProPublica reported that Samuel Samson, a 27-year-old deputy assistant secretary overseeing the new grants, was linked to senior members of VOC through his studies at the Christian conservative Hillsdale College graduate program. (A state department official then told the outlet that the relationship had nothing to do with the grant).\nSamson has described the US and Europe as partners in a shared civilizational struggle. Samson toured Austria, the Czech Republic, Hungary and Slovakia last December – all countries that were floated to receive a $2m grant to counter migration weaponized by Russia and Belarus – and criticized NGOs that previous administrations had worked with for promoting what he called radical concepts, including gender theory and DEI.\nThe state department did not comment on individual grants but said the programs were still in “active deliberation”, that awardees would meet guidelines for federal grants, and that all programming would undergo a “standard ", "translation_ja": "", "vocab": [{"word": "obligated", "definition": "資金や責任を法的に拘束する、または割り当てる。ここでは国務省が期限前に資金を受取人に正式に配分したことを意味します。"}, {"word": "flagship", "definition": "企業や組織の最も重要で代表的なプログラムやサービス。ここでは国務省の主要な人権基金を指します。"}, {"word": "slate", "definition": "計画された候補者やプログラムのリスト。ここでは提案されている助成金の一覧を意味します。"}, {"word": "dissidents", "definition": "政府や権力に対して異議を唱える人々。独裁政権の下で反対派活動家を指します。"}, {"word": "redefining", "definition": "何かの定義や意味を変え直す。ここではトランプ政権が人権の定義を変えていることを意味します。"}]}, {"title_ja": "South African leader urges men to speak up on gender-based violence after series of killings", "title_en": "South African leader urges men to speak up on gender-based violence after series of killings", "summary_ja": "President announces measures amid anger at authorities over recent murders of women South Africa’s president has called on men to take more responsibility for violence against women as he announced measures to tackle the problem, amid anger at authorities over a recent wave of murders. Cyril Ramapho", "summary_en": "President announces measures amid anger at authorities over recent murders of women South Africa’s president has called on men to take more responsibility for violence against women as he announced measures to tackle the problem, amid anger at authorities over a recent wave of murders. Cyril Ramapho", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/30/south-africa-gender-based-violence-women-killings", "state_media": false, "category": "政治", "full_text": "South Africa’s president has called on men to take more responsibility for violence against women as he announced measures to tackle the problem, amid anger at authorities over a recent wave of murders.\nCyril Ramaphosa acknowledged that not enough had been done to protect women. He said police would be reviewing unsolved murders, attempted murders and serious sexual offences against women and children, as well as producing a funded plan to reduce the forensic backlog for such cases, both within 60 days.\nIn a televised speech on Tuesday night, the president said local governments would have five months to address issues that compromised women’s safety, from broken streetlights to overgrown public spaces and abandoned buildings. He added that he had tasked five ministers to come up with a plan within 60 days to reduce alcohol-fuelled violence.\n“Alcohol does not cause gender-based violence and it can never excuse it. Responsibility always lies with the perpetrator,” Ramaphosa said. “But harmful alcohol use is a significant aggravating factor in interpersonal violence and it must be addressed as part of our wider prevention effort.\n“Women should not have to live in fear because government has failed to repair a light, clear a public space, process evidence or enforce a law.”\nSouth Africa has been gripped by grief and fury after the discovery of 11 women’s bodies dumped across Ekurhuleni, the municipality adjoining Johannesburg to the east, since 15 July. Eight of the women were found in the last three weeks, including Elizabeth “Tsontso” Moselakgomo, who was discovered on 12 September after she went missing when she went for a run after work.\nRamaphosa said suspects had been arrested in connection with three of the killings and that the other cases would not be left to go cold. He added that police had not found evidence that a serial killer was responsible for all 11 killings, but that all possibilities were still being investigated.\nHe directly addressed South African men, urging them to challenge relatives, friends and colleagues who harassed, humiliated or abused women. “It is time for good men to stop being silent men,” he said.\n“For too long, gender-based violence has been treated as a woman’s problem to solve. Women march, the women of our country organise, they speak out, they protest, they confront and they comfort survivors,” Ramaphosa said.\n“Women change their routes home. Avoid going out at night and warn one another about dangerous places and dangerous men. We have placed the burden of male violence on women. That must change.”\nActivists expressed their frustration that solid policy actions had not been taken years ago and scepticism that the measures Ramaphosa had announced would work.\nShenilla Mohamed, the executive director of Amnesty International South Africa, said: “These are not new issues and as a country we have been talking about ways to tackle the high numbers of [gender-based violence and femicide], especially since 2019 when women took to the streets to protest, and yet here we are again in the face of continued attacks against women.\n“Amnesty International South Africa also notes the timelines put in place by the president, but this will only mean something if it results in action, and if there are consequences for inaction.”\nMpiwa Mangwiro-Tsanga and Bafana Khumalo, of Sonke Gender Justice, an NGO, said: “Our concern … is that the response remains heavily weighted towards what happens after violence has already occurred.”\nThey added: “Investigating unresolved cases, processing forensic evidence and repairing unsafe public spaces are necessary, but they do not constitute a comprehensive prevention strategy. It is concerning that the president is asking municipalities to do what is actually their mandate and yet they do not deliver on these.”", "translation_ja": "", "vocab": [{"word": "perpetrator", "definition": "犯罪行為を行った人、加害者のこと。特に法的文脈で使用され、重大な犯罪や暴力の加害者を指す。"}, {"word": "aggravating", "definition": "状況や問題を悪化させる、より深刻にする。既存の悪い状況をさらに悪くする要因や状況を説明するのに用いられる。"}, {"word": "interpersonal", "definition": "人間関係に関する、対人間の。個人と個人の間で起こる相互作用や衝突などを指す。"}, {"word": "gripped", "definition": "強く支配されている、捕らえられている。感情や状況が人々や地域を強く支配している状態を表す。"}, {"word": "harassed", "definition": "繰り返し嫌がらせや迷惑行為を行う。継続的に他者に不快感や苦痛を与える行為を指す。"}]}, {"title_ja": "Burundi agrees to receive ‘third-country’ migrant deportees from US", "title_en": "Burundi agrees to receive ‘third-country’ migrant deportees from US", "summary_ja": "Burundi joins several other African nations in accepting people deported under Trump’s hardline policy Burundi has agreed to join a clutch of ⁠other African nations in receiving migrants from other countries deported from the US under ⁠ Donald Trump ’s hardline ⁠ immigration ​policy . However, Burun", "summary_en": "Burundi joins several other African nations in accepting people deported under Trump’s hardline policy Burundi has agreed to join a clutch of ⁠other African nations in receiving migrants from other countries deported from the US under ⁠ Donald Trump ’s hardline ⁠ immigration ​policy . However, Burun", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/30/burundi-third-country-deportations-trump-immigration", "state_media": false, "category": "社会", "full_text": "Burundi has agreed to join a clutch of other African nations in receiving migrants from other countries deported from the US under Donald Trump’s hardline immigration policy.\nHowever, Burundi will only accept those not accused of crime or terrorism links, said Nancy Ninette Mutoni, a spokesperson for the country’s president, Évariste Ndayishimiye. Tuesday’s announcement gave no details of numbers, timing or financial details.\nWashington has sent so-called “third-country deportees” to about half a dozen African nations as well as many other countries, often where they have no ties, have never been and find themselves detained indefinitely, under opaque deals that Senate Democrats say have cost tens of millions of dollars.\nIn many cases, deportees had secured legal protections from immigration courts in the US against repatriation. But rights groups say the third-country deals allow the US to circumvent those protections.\nMutoni said preparations were under way to arrange accommodation, living conditions and integration into local communities in Burundi. “Receiving them requires serious planning – where they will stay, what they will eat and how they will live alongside the local population,” she said.\n“If they choose to join Burundian citizens and make a valuable contribution to national development, the law will be respected,” she said, regarding potential citizenship.\nBurundi aimed to both strengthen diplomatic relations and provide hospitality to people in need, the spokesperson added.\nThe US state department did not immediately respond to requests for comment while a spokesperson for the Burundi foreign ministry said details of the agreement were not yet available.", "translation_ja": "", "vocab": [{"word": "clutch", "definition": "少数の、一握りの。「a clutch of」で「～のグループ・集団」という意味で使われ、複数の国々などを指す際に用いられる。"}, {"word": "hardline", "definition": "強硬な、強硬派の。妥協を許さない厳格な立場や政策を表す形容詞で、政治や交渉の文脈で頻出する。"}, {"word": "circumvent", "definition": "～を回避する、迂回する。ルールや法律などを巧妙に避けて通ることを意味し、ビジネスや法律用語として使われる。"}, {"word": "opaque", "definition": "不透明な、曖昧な。文字通りの「光を通さない」という意味の他に、「不明朗な、情報が不明確な」という意味で政治や契約の文脈で用いられる。"}, {"word": "repatriation", "definition": "本国送還、引き揚げ。難民や移民などを出身国に送り返すことを指す国際法や移民政策の専門用語。"}]}, {"title_ja": "Iran war live: US moves 2,000 Marines to Middle East, tanker hit in Hormuz", "title_en": "Iran war live: US moves 2,000 Marines to Middle East, tanker hit in Hormuz", "summary_ja": "US deploys Roosevelt strike group and 2,000 Marines to the Middle East as part of a wider buildup around Iran.", "summary_en": "US deploys Roosevelt strike group and 2,000 Marines to the Middle East as part of a wider buildup around Iran.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/10/2/iran-war-live-us-moves-2000-marines-to-middle-east-tanker-hit-in-hormuz?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: US moves 2,000 Marines to Middle East, tanker hit in Hormuz\nPresident Masoud Pezeshkian says Iran “has never avoided” dialogue with the US, even though it’s been attacked three times during negotiations.\nlive\nThis video may contain light patterns or images that could trigger seizures or cause discomfort for people with visual sensitivities.\nPublished On 2 Oct 2026\n- A US official tells Al Jazeera that three carriers and two landing groups are deploying around Iran. The official says the Roosevelt strike group and Makin Island force with 2,000 Marines left San Diego, adding that the full buildup will finish by November.\n- UK Maritime Trade Operations says a 2.5-million-barrel supertanker was hit by an unknown projectile, causing a fire while passing through the Strait of Hormuz.", "translation_ja": "", "vocab": [{"word": "deploying", "definition": "軍隊や装備を特定の場所に配置・展開すること。軍事用語として頻繁に使用され、戦略的な位置取りを意味します。"}, {"word": "buildup", "definition": "段階的な増加や蓄積を指す名詞。ここでは軍事力の段階的な増強を表します。"}, {"word": "projectile", "definition": "発射された物体、特に銃弾やミサイルなどを指す。軍事や物理の文脈で使用される専門用語です。"}, {"word": "supertanker", "definition": "大量の液体貨物（主に石油）を運搬するための大型タンカー船。国際海運における重要な輸送手段です。"}]}, {"title_ja": "Israeli drone kills Palestinian in Gaza, settlers kill another in West Bank", "title_en": "Israeli drone kills Palestinian in Gaza, settlers kill another in West Bank", "summary_ja": "1,439 Palestinians have been killed in Gaza and 5,052 injured since the &#039;ceasefire&#039; began in October 2025.", "summary_en": "1,439 Palestinians have been killed in Gaza and 5,052 injured since the &#039;ceasefire&#039; began in October 2025.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/1/israeli-drone-kills-palestinian-in-gaza-settlers-kill-another-in-west-bank?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Israeli drone kills Palestinian in Gaza, settlers kill another in West Bank\nGaza’s health toll mounts, with 1,439 dead and 5,052 injured since the ceasefire began in October 2025.\nAn Israeli drone strike has killed a Palestinian man and wounded several others in southern Gaza while settlers shot dead another Palestinian man near Ramallah in the occupied West Bank.\nThe body of Tamer al-Hamayda, 42, and three wounded people were brought to Nasser Medical Complex on Thursday after the strike hit a tent sheltering displaced Palestinians in the al-Mawasi area, west of Khan Younis on the southern coast of the Gaza Strip.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Will Democrats move beyond rhetoric on Israel’s illegal settlements?\n- list 2 of 3What’s driving Israeli settler violence in the occupied West Bank?\n- list 3 of 3Funeral held for Palestinian man killed in the occupied West Bank\nAnother Palestinian succumbed to wounds sustained in an earlier Israeli drone strike on Tuesday that targeted a gathering of Palestinians in Jabalia refugee camp in northern Gaza, according to medical personnel in Nasser Medical Complex.\nIsraeli forces also carried out a large-scale demolition operation targeting buildings east of Gaza City’s al-Tuffah neighbourhood.\nThe Gaza Health Ministry reported eight new deaths and 26 wounded over the past 24 hours, putting the toll since the “ceasefire” took effect in October 2025 at 1,439 killed and 5,052 wounded, with 834 bodies recovered from the rubble.\nIsrael’s war on Gaza has killed at least 74,040 Palestinians and wounded 175,168 since October 2023, the ministry said.\nOccupied West Bank pogroms\nIn the occupied West Bank, Israeli settlers shot dead a Palestinian man and wounded another during a raid on the village of Yasuf, north of Ramallah, on Thursday.\n51-year-old Mashhour Yassin was shot dead by settler gunfire, the Palestinian Health Ministry said.\nDescribing the attack, the Palestinian Ministry of Foreign Affairs said Israeli forces had detained an ambulance, seizing its key and throwing it aside, “in a crime that reflects clear coordination between the settlers and occupation forces.”\nIt said the killing “falls within the framework of a serious and continuous escalation in organised settler crimes,” saying Israel gives free rein to settler “terrorism against our people in the service of settlement, annexation, forced displacement and ethnic cleansing plans.”\nYasuf Mayor Jumaa Abdel Fattah told the AFP news agency that dozens of Israeli settlers armed with sticks and firearms had attacked the village, which lies between four Israeli settlements.\n“Yassin was at his doorstep when the settlers attacked the village homes. He went out to defend his house,” Abdel Fattah said, adding that Yassin’s nephew was also wounded in the attack.\nAbdel Fattah said the settlers had come from Havat Anton, an illegal Israeli settlement established in July that has previously attacked the village’s residents.\nPalestinians in the occupied West Bank have reported a surge in settler pogrom attacks in recent months.\nMore than 500,000 Israelis live in West Bank settlements considered illegal under international law.\nAccording to the UN, at least 1,112 Palestinians in the occupied West Bank have been killed by Israeli forces or settlers in the territory since October 2023, including at least 37 killed by settlers.", "translation_ja": "", "vocab": [{"word": "ceasefire", "definition": "紛争や戦闘の一時的な停止。敵対勢力が合意により戦闘を中断する状態を指す。"}, {"word": "succumbed", "definition": "病気や怪我などが原因で死亡する、または抵抗できず屈服する。医学的文脈では「亡くなる」という意味で使われる。"}, {"word": "demolition", "definition": "建物や構造物を意図的に破壊する行為。軍事作戦や建設現場で使用される専門用語。"}, {"word": "pogrom", "definition": "特定の民族や宗教グループに対する組織的な暴力や虐殺。歴史的には迫害の文脈で使われる。"}, {"word": "ethnic cleansing", "definition": "特定の民族グループを強制的に追放または排除する行為。国際法では人道に対する罪と見なされることがある。"}]}, {"title_ja": "Brazilian government calls for probe into US funding of far-right causes", "title_en": "Brazilian government calls for probe into US funding of far-right causes", "summary_ja": "Report stating that Trump administration directed funds towards right-wing groups comes ahead of presidential election.", "summary_en": "Report stating that Trump administration directed funds towards right-wing groups comes ahead of presidential election.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/1/brazilian-government-calls-for-probe-into-us-funding-of-far-right-causes?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Brazilian government calls for probe into US funding of far-right causes\nA report stating that the Trump administration directed funds towards right-wing groups comes ahead of Brazil’s presidential election.\nBrazil’s attorney general has called on law enforcement to investigate alleged efforts by the United States to interfere in the country’s domestic politics through the diversion of funds to far-right causes.\nAttorney General Jorge Messias called for the probe on Thursday, one day after the British newspaper The Guardian published a story suggesting that the administration of United States President Donald Trump planned to award $1m to right-wing civil groups opposing the Brazilian Supreme Court.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Lula warns against foreign interference in Brazil election at UN\n- list 2 of 3Brazil’s Lula and Flavio Bolsonaro still essentially tied in new poll\n- list 3 of 3A political dynasty? Why the Bolsonaro family dominates Brazil’s right wing\nMessias stated in a social media post that foreign meddling “cannot be tolerated” and that the report represented “an important alert for Brazilian sovereignty”.\n“The information is especially serious in light of Brazil’s electoral process and the recent episodes of external pressure on our institutions,” the attorney general added.\nThe report comes amid a tense presidential election in which leftist President Luiz Inacio Lula da Silva is seeking re-election.\nLula has sought to focus attention on efforts Trump has undertaken to boost the prospects of far-right allies across Latin America, warning of threats to regional sovereignty.\nTrump has endorsed multiple right-wing candidates ahead of elections across the region, sometimes hinging the possibility of economic support on the voting results.\nHe has also cultivated close relations with the family of former Brazilian President Jair Bolsonaro, who lost to Lula in the last presidential election.\nBolsonaro’s eldest son, Senator Flavio Bolsonaro, is a frontrunner in the race to challenge Lula this year. Recent polls have shown Lula and Bolsonaro virtually tied ahead of the first round of voting on October 4.\nFlavio Bolsonaro met with Trump at the White House in May. He has promised closer ties with the US, while Lula has positioned himself as a critic of Trump’s interventionist approach to Latin American politics and security.\nThe Guardian report published on Wednesday states that the Trump administration sought to redirect $175m from the State Department’s human rights fund to various far-right causes around the world.\nThe recipients allegedly included groups advocating for white Afrikaners in South Africa that the Trump administration has falsely portrayed as victims of a “genocide” and efforts in Brazil to counter what the US called “lawfare and censorship”.\nBrazil’s Supreme Court has been a subject of frequent criticism from the political right, both in Brazil and the US.\nMuch of that criticism stems from the 2025 conviction of Jair Bolsonaro for involvement in an alleged coup plot, designed to subvert his loss to Lula in the 2022 election.\nBolsonaro and his allies, including Trump, have depicted the case as an instance of political persecution.\nCiting the trial, Trump last year placed 50-percent tariffs on certain Brazilian goods that he has since removed.\nAt the time, he announced the tariffs in a letter that denounced Bolsonaro’s prosecution. “The way that Brazil has treated former President Bolsonaro, a Highly Respected Leader throughout the World during his term, including by the United States, is an international disgrace,” Trump wrote.\nThe Trump administration also revoked the visas of Brazilian judicial officials involved in Bolsonaro’s case in an effort to have it tossed out. It also levied short-lived sanctions against Brazilian Supreme Court Justice Alexandre de Moraes, accusing him of “an unlawful witch hunt” against right-wing voices.\nBolsonaro was ultimately convicted and sentenced to a 27-year prison sentence in September 2025.\nIn June, one of his sons, Eduardo Bolsonaro, was sentenced to more than four years in prison after a court ruled he had lobbied for US interference in his father’s case.", "translation_ja": "", "vocab": [{"word": "diversion", "definition": "資金や注意を別の目的や方向へ向け替えること。ここでは、米国の資金が本来の目的から逸らされて右翼団体に向けられていることを意味する。"}, {"word": "meddling", "definition": "他者の事柄に無断で干渉すること。政治的または個人的な領域への不正な介入を指す。"}, {"word": "sovereignty", "definition": "国家が自らの領土と人民に対して持つ絶対的な支配権。独立した国家としての自決権を意味する。"}, {"word": "cultivated", "definition": "意図的に関係を育成・構築すること。通常は時間をかけて信頼や友好関係を深める過程を指す。"}, {"word": "interventionist", "definition": "他国や地域の内政に積極的に関与・介入する政策や姿勢。一方的な干渉的アプローチを示す。"}]}, {"title_ja": "U.K.-Iranian man held over U.K. airbase incident", "title_en": "U.K.-Iranian man held over U.K. airbase incident", "summary_ja": "Britain gave the U.S. the greenlight to use RAF Fairford for defensive strikes against Iran", "summary_en": "Britain gave the U.S. the greenlight to use RAF Fairford for defensive strikes against Iran", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/uk-iranian-man-held-over-uk-airbase-incident/article71534825.ece", "state_media": false, "category": "社会", "full_text": "A man with dual UK-Iranian citizenship was arrested Thursday (October 1, 2026) over a mysterious \"major incident\" at an airbase in southwest England as Israel said it had warned London about an attack.\nThe sixth arrest came after British Prime Minister Andy Burnham told the BBC there were \"strong indications that Iran played a part in what happened over the weekend at RAF Fairford\", a base used by the U.S. military in its war against Iran.\nIran denounced the British government's \"baseless accusations\" and condemned London for making military bases and facilities under its jurisdiction \"available for the planning and execution of the U.S.-Israeli military aggression against Iran\".\nCounter Terrorism Policing said in a statement Thursday that a \"25-year-old man, a dual UK/Iranian national, was arrested\" in Westminster in central London \"on suspicion of preparation of terrorist acts\".\nIsraeli Prime Minister Benjamin Netanyahu, speaking to Fox News late Wednesday (September 30, 2026), said Israel had tipped off Britain about a plot.\n\"We gave the Brits the intel that there was going to be an attack, and it's an Iranian-sponsored attack,\" he said.\nPolice were called to the base in the Cotswolds early Sunday, triggering an evacuation of the nearby village and the declaration of a \"major incident\".\nA farmer living in the village of Whelford near the airbase called the police after seeing vans blocking a road and a group of masked men.\nPolice arrested five London-based Britons, all men in their mid-20s, at the scene and examined several vehicles. The men were then released on bail on Monday (September 28, 2026), a move criticised by Washington.\nPolice then revealed no explosives were found at the scene and the nature of the threat has not been explained by officials.\nAd
