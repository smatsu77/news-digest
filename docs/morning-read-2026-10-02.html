ding to the mystery, British media reported that officers were alerted to the incident by one of the initial suspects but police have not commented on the reports.\nVicki Evans, senior national coordinator for Counter Terrorism Policing, said in a statement Thursday that the investigation is \"hugely complex\" and police are looking at \"all possible angles — including possible foreign state involvement\".\nIran's embassy in London earlier said it \"categorically rejects and strongly condemns\" speculation it was involved while Foreign Minister Abbas Araghchi said Mr. Burnham was \"barking up the wrong tree\".\nBritain gave the U.S. the greenlight to use RAF Fairford for defensive strikes against Iran, drawing Tehran's ire and unease from some residents in the Gloucestershire countryside where the base is located.\nPublished - October 02, 2026 04:56 am IST", "translation_ja": "", "vocab": [{"word": "dual citizenship", "definition": "2つの国の国籍を同時に持つ状態。この場合、イギリアとイランの両国の国籍を保有していることを意味する。"}, {"word": "denounce", "definition": "強く非難・糾弾する。政治的または公式な文脈で、相手の行動や主張に対して激しく反対を表明すること。"}, {"word": "jurisdiction", "definition": "管轄権・統治権。特定の領域や事項に対して権力を行使できる法的権限のこと。"}, {"word": "tipped off", "definition": "事前に情報を漏らす・知らせる。秘密の情報を誰かに事前に教えることを意味する。"}, {"word": "hugely complex", "definition": "極めて複雑である。非常に多くの複雑な要素が絡み合っている状況を表す。"}]}, {"title_ja": "Putin says Russia will use 'all weapons' in its arsenal if any of its territory is attacked", "title_en": "Putin says Russia will use 'all weapons' in its arsenal if any of its territory is attacked", "summary_ja": "European leaders and intelligence services have warned that Russia could be ready to strike at another country within a few years, especially if it wins its war on Ukraine.", "summary_en": "European leaders and intelligence services have warned that Russia could be ready to strike at another country within a few years, especially if it wins its war on Ukraine.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/putin-says-russia-will-use-all-weapons-in-its-arsenal-if-any-of-its-territory-is-attacked/article71534820.ece", "state_media": false, "category": "政治", "full_text": "President Vladimir Putin on Thursday (October 1, 2026) reiterated Moscow's long-held position that Russia is not planning to attack European countries but will respond to aggression with “all weapons\" in its arsenal.\nIn remarks at a foreign policy forum, Mr. Putin accused the West and Europe of escalating tensions by talking about preparing for a war with Moscow in the coming years, conducting military drills in the Baltic Sea, and seizing Russian vessels.\nHis remarks followed Moscow's warning to NATO that it would not hesitate to use nuclear weapons to defend Kaliningrad should any members of the military alliance try to cut off the Baltic exclave from the rest of Russia.\nSeveral Russian embassies in Europe this week issued statements that Moscow has “information that NATO is preparing [an] air and naval blockade of Kaliningrad and [the] Kaliningrad region.”\nThey accused European leaders of “playing a dangerous game” by saying Russia might attack another country or ramp up a campaign of destabilizing attacks with drones and sabotage. Moscow has called the allegations absurd.\n“There should be no mistake — Russia would be ready to use all its arsenal, including nuclear weapons, to defend its territory if NATO countries try to isolate [the] Kaliningrad region from the rest of the country,” the Russian Embassy in Ireland said in its statement on Tuesday (September 29, 2026).\nAsked at the Valdai Club forum Thursday (October 1, 2026) whether Russia was on the cusp of a war with NATO or whether both were trying to intimidate each other, Putin said: “It's not intimidation, it's a response to an attempt to intimidate us.”\nMr. Putin said that “everything is written correctly” in the earlier warning to NATO.\n“If it comes to a direct attack on the Russian Federation — in this case we mean Kaliningrad, or maybe some other territories — of course, inevitably and immediately the question of Russian Federation using all weapons at the disposal of our country will appear on the agenda,” he said.\nMr. Putin didn't specify whether Moscow would use nuclear weapons but said it has arms that “no one else has” and would determine which to use in case of an attack.\nNATO pushed back against Russian nuclear rhetoric\nNATO spokesperson Allison Hart confirmed Wednesday that Russia had sent a written message to the U.S.-led military alliance. “We strongly denounce the threat of force, including any irresponsible nuclear rhetoric,” she said in a statement.\nMs. Hart insisted NATO is not targeting Kaliningrad and had sent a reply noting that “NATO is a defensive alliance and none of our activities or exercises pose a risk to any part of Russia.”\nNATO Secretary-General Mark Rutte said on Wednesday (September 30, 2026) the bloc's response to the message was “short and concise.\"\n“Basically what we said is, Hey, listen, we are defensive alliance, and stop the nuclear threat. This is absolutely not called for and not helpful,'” Mr. Rutte told Euronews.\nNATO's response also urged Russia to stop its “unprovoked war of aggression against Ukraine,” now in its fifth year.\nThe Baltic exclave of Kaliningrad sits between NATO members Poland and Lithuania. It is home to Russia's main Baltic navy base and other military assets, and nuclear-capable Iskander missiles are deployed there.\nWestern military officers have said that key military installations in Kaliningrad would be a likely first target should Russia ever attack any NATO ally.\nNATO allies have conducted military exercises in the Baltic Sea region in recent months. More are planned in October. It launched Operation Baltic Sentry there last year to protect communication cables and pipelines.\nOn August 18, NATO held an exercise over northern Poland and the Baltic region involving several aircraft, including an EA-37B Compass Call — a sophisticated American plane that can jam communications and radar, the U.S. Air Forces in Europe said.\nDefense analysts believe the unannounced, large-scale exercise would not have been welcomed by the Kremlin.\nMr. Rutte urges continued focus on supporting Ukraine\nEuropean leaders and intelligence services have warned that Russia could be ready to strike at another country within a few years, especially if it wins its war on Ukraine.\nMr. Rutte told Euronews that Russia is trying “to divide us and lose the focus” on defending Ukraine.\n“We will not,” he said, adding that the best way to respond is to provide Kyiv with more support.\n“That's the message. Calm, carry on, keep the support for Ukraine going. That's how we deal with it,\" Mr. Rutte said. MNK\nPublished - October 02, 2026 04:12 am IST", "translation_ja": "", "vocab": [{"word": "reiterated", "definition": "何度も繰り返して述べること。同じ主張や立場を何度も言い続ける行為を指す。"}, {"word": "escalating", "definition": "段階的に悪化・拡大していくこと。紛争や緊張が徐々に高まる状況を表す。"}, {"word": "arsenal", "definition": "兵器や武器の総合的な備蓄。軍事力の全体、または比喩的に様々な手段・道具の総体を意味する。"}, {"word": "exclave", "definition": "周囲を他国に囲まれた飛び地領土。本国から分離されている領土領域を指す。"}, {"word": "rhetoric", "definition": "説得力を持たせるための言語表現や演説技法。特に政治的な主張や威嚇的な言葉づかいを指すことが多い。"}]}, {"title_ja": "Saudi Arabia says flydubai co-pilot who tried to crash Israel-bound jet transferred to UAE; Trump alleges copilot linked to Iran", "title_en": "Saudi Arabia says flydubai co-pilot who tried to crash Israel-bound jet transferred to UAE; Trump alleges copilot linked to Iran", "summary_ja": "Asked if the U.S. would retaliate against Tehran if it was behind the attack, Mr. Trump said, “Oh they'll be hit, very hard, don't worry.”", "summary_en": "Asked if the U.S. would retaliate against Tehran if it was behind the attack, Mr. Trump said, “Oh they'll be hit, very hard, don't worry.”", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/flydubai-copilot-iran-links-alleges-trump-netanyahu/article71534583.ece", "state_media": false, "category": "社会", "full_text": "Saudi Arabia’s Interior Ministry said on Thursday (October 1, 2026) that the flydubai co-pilot, suspected of an attack stopped by the captain and passengers on a flight bound for Israel, has been transferred from the kingdom to the United Arab Emirates.\nThe plane’s captain and the co-pilot “after their health improved and the medical team cleared them, left the Kingdom heading to Abu Dhabi on Thursday morning... accompanied by the Emirati security team”, the Ministry said in a statement, adding that the initial investigation showed the co-pilot attacked the captain.\nPresident Donald Trump said Iran may be linked to the flydubai copilot who tried to crash an Israel-bound plane.\nThe President was asked on Thursday (October 1, 2026) by reporters at the White House whether he had been briefed about any links between the pilot behind the attack and Tehran. He said, “We're working on it right now.”\n“I would say the answer, based on what I'm hearing, is yes, but we're working on it right now,” Mr. Trump said. He did not offer details.\nAsked if the U.S. would retaliate against Tehran if it was behind the attack, Mr. Trump said, “Oh they'll be hit, very hard, don't worry.”\n“You just ask them,” he added. “They know what happened. They'll be hit very hard.”\nPublished - October 02, 2026 12:01 am IST", "translation_ja": "", "vocab": [{"word": "co-pilot", "definition": "副操縦士のこと。航空機において機長を補佐する役職。この記事では機長への攻撃容疑者として言及されている。"}, {"word": "retaliate", "definition": "報復する、仕返しをするという意味。相手からの攻撃や危害に対して同等の行動で応じることを指す。"}, {"word": "briefed", "definition": "簡潔な説明や情報提供を受けるという意味。通常、重要な事項について迅速に知らされることを指す。"}, {"word": "suspected", "definition": "疑われている、容疑がかかっているという意味。犯罪や不正行為の実行者として考えられる対象を描写する際に使用される。"}, {"word": "transferred", "definition": "移送する、移動させるという意味。人物や物を一つの場所から別の場所へ移すことを指す。"}]}, {"title_ja": "Justin Ling: Who does Mark Carney really listen to? I asked the insiders - Toronto Star", "title_en": iVXNfRmRjbkFJaXBRc3BXWVBFdVk1OUJoSk95N2pNSWZYYzI3dnhpa093ZkxNWGVEN2ltTkNYc1FKSUZCTl9xYU5yVVVJV2tjS0lVbWxWdEpQWTUwYkJsMXBaT0xBX0pWRVdzaEdQcndtQVFMeXNnRFgwY24xdktQTzNYR1I4S3VRYUtGNzZPNjdxUlNPSUstQUZrcUdPZGhqcHhuN25VcjgyZEd3NVU2MEtkTlhDRTJPd3M2VHFn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Tinubu, Akpabio, Sanwo-Olu, others attend MKO documentary premiere", "title_en": "Tinubu, Akpabio, Sanwo-Olu, others attend MKO documentary premiere", "summary_ja": "The premiere was held on 1 October, as part of activities marking Nigeria’s 66th Independence Anniversary. The post Tinubu, Akpabio, Sanwo-Olu, others attend MKO documentary premiere appeared first on Premium Times Nigeria .", "summary_en": "The premiere was held on 1 October, as part of activities marking Nigeria’s 66th Independence Anniversary. The post Tinubu, Akpabio, Sanwo-Olu, others attend MKO documentary premiere appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/913973-tinubu-akpabio-sanwo-olu-others-attend-mko-documentary-premiere.html", "state_media": false, "category": "社会", "full_text": "President Bola Tinubu, Senate President Godswill Akpabio, Lagos State Governor Babajide Sanwo-Olu and Chief of Staff to the President, Femi Gbajabiamila, attended the national premiere of MKO, a documentary on the life and political legacy of the late businessman and politician, Moshood (MKO) Abiola.\nThe premiere was held on Thursday at the Wole Soyinka Centre for Culture and Creative Arts in Iganmu, Lagos, as part of activities marking Nigeria’s 66th Independence Anniversary.\nMr Tinubu, who served as Chief Host of the premiere, attended the event alongside First Lady Oluremi Tinubu.\nDignitaries\nAlso present were Ogun State Governor Dapo Abiodun, Kwara State Governor AbdulRahman AbdulRazaq, Deputy Senate President Jibrin Barau, Deputy Speaker of the House of Representatives Benjamin Kalu, Minister of Art, Culture, Tourism and the Creative Economy Hannatu Musawa, and former Ogun State Governor Segun Osoba.\nThe documentary’s director and producer, Nigerian-American filmmaker Ose Oyamendan, was also present.\nThe president’s arrival was captured in a video shared by presidential aide Dada Olusegun, showing Mr Tinubu and the First Lady entering the venue as a band played the national anthem.\nTinubu’s role in June 12 struggle\nSpeaking on the significance of the premiere, Mr Oyamendan paid tribute to Mr Tinubu and recalled his involvement in the struggle against military rule following the annulment of the June 12, 1993 presidential election.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMr Oyamendan said it was an honour for the film team that Mr Tinubu agreed to serve as Chief Host, adding that the significance of his role went beyond his attendance at the premiere.\nThe filmmaker said Mr Tinubu was among those who stood with the demand for the recognition of the June 12 mandate during the period of military rule.\nAccording to Mr Oyamendan, the documentary examines the choices political actors made during the crisis and the consequences of those choices for Nigeria.\nHe said Mr Tinubu “risked his life, livelihood and his family’s safety by standing with the people’s mandate.”\nMr Oyamendan said the documentary was not simply about Mr Abiola but also about the struggle that shaped Nigeria’s democratic journey.\nHe added that 33 years after June 12, the documentary provides an opportunity for Nigerians to revisit what happened, understand its significance and reflect on its implications for the country’s democratic development.\nDocumentary revisits June 12\nMKO chronicles the life, political career and legacy of Mr Abiola, with particular focus on the June 12 1993 presidential election, its annulment by the military government and the pro-democracy struggle that followed.\nThe documentary also examines Mr Abiola’s detention and the circumstances surrounding his death in custody in 1998.\nIt combines archival footage with first-hand accounts from people connected to the events.\nAmong those featured are former military leaders Ibrahim Babangida and Abdulsalami Abubakar, former President Olusegun Obasanjo, Nobel laureate Wole Soyinka and Mr Abiola’s running mate in the 1993 election, Baba Gana Kingibe.\nOther contributors include former United States Ambassador to Nigeria Walter Carrington, former US Deputy Secretary of State Thomas Pickering, former Canadian High Commissioner Gerald Ohlsen, members of the Abiola family, foreign journalists and Theodore Zadok, who served as Mr Abiola’s security guard during his detention.\nPresident Tinubu is also featured in the documentary, reflecting his involvement in the pro-democracy movement during the period.\nPersonal connection\nThe documentary also draws from Mr Oyamendan’s own experience of the June 12 period.\nThe filmmaker worked as a young journalist with Weekend Concord during the crisis and has used archival material and interviews with key personalities to reconstruct Mr Abiola’s political journey and the events surrounding the annulment.\nMr Oyamendan said the film’s extensive archive and testimonies provide an intimate account of one of the most significant periods in Nigeria’s political history.\nThe 108-minute documentary had its international premiere at the Sheffield International Documentary Festival in the United Kingdom on 12 June, before its Nigerian premiere in Lagos.\nCinema opening\nFollowing Thursday’s national premiere, MKO is scheduled to open in cinemas across Nigeria from Friday, 2 October.\nNile Entertainment is handling the film’s Nigerian theatrical distribution.\nREAD ALSO: Independence Anniversary: Tinubu says student loans will keep poor Nigerians in higher institutions\nThe distributor’s Managing Director, Moses Babatope, said the project was particularly significant to him because his father worked at Concord Newspapers, one of the media organisations founded by Abiola.\nMr Babatope said the documentary would help preserve an important chapter ", "translation_ja": "", "vocab": [{"word": "premiere", "definition": "初公開、初上映。映画やドキュメンタリーなどの作品が初めて公開される公式行事を指す。"}, {"word": "annulment", "definition": "廃止、取り消し。法的または公式な決定、契約、選挙などを無効にすること。"}, {"word": "mandate", "definition": "委任、授権。選挙で有権者から政治家や政党が受ける統治権や実行権。"}, {"word": "dignitaries", "definition": "要人、高位の人物。政治的地位や社会的地位が高い人々を指す。"}, {"word": "significance", "definition": "重要性、意義。何かが持つ重要度や深い意味のこと。"}]}, {"title_ja": "Wike’s Rainbow: Governor Dauda Lawal’s red line, By Emmanuel Ado", "title_en": "Wike’s Rainbow: Governor Dauda Lawal’s red line, By Emmanuel Ado", "summary_ja": "It’s Governor Dauda Lawal of Zamfara State that has put the governors’ position very bluntly. “Be on one side. You can’t be on two sides,” he bluntly told Wike, insisting that if the minister was genuinely committed to supporting President Tinubu, he should join the APC and campaign for its candidat", "summary_en": "It’s Governor Dauda Lawal of Zamfara State that has put the governors’ position very bluntly. “Be on one side. You can’t be on two sides,” he bluntly told Wike, insisting that if the minister was genuinely committed to supporting President Tinubu, he should join the APC and campaign for its candidat", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/913969-wikes-rainbow-governor-dauda-lawals-red-line-by-emmanuel-ado.html", "state_media": false, "category": "政治", "full_text": "Did Chinua Achebe, the foremost African writer, have Nyesom Wike, the former governor of oil-rich Rivers State and now the Minister of the Federal Capital Territory (FCT), specifically in mind—or was he writing about politicians generally—when he wrote his famous book, A Man of the People? The question arises not because of Achebe’s devastating portrayal of corruption among the political elite, but from his portrayal of Josiah, the petty thief whose unbridled greed ultimately became his greatest undoing.\nWike is not a petty thief; the connection between him and Josiah would soon be made.\nJosiah had spent many years getting away with his shenanigans. He stole, deceived and exploited others with remarkable impunity. But then he crossed the red line, stealing a blind man’s walking stick, an outrageous act that finally provoked the community into action. Josiah had not suddenly become a thief; he had simply overreached himself. And in doing so, he learnt, sadly too late, a timeless political lesson that there is often a point at which audacity ceases to be tolerated and becomes the very thing that will provoke outrage and resistance.\nThe connection between Josiah and Wike is not that the Minister is a petty thief. Far from it. It is the pattern of conduct: the belief that political power can be exercised without caution, and that every boundary can be tested and overcome with greater force. Josiah’s undoing, like Wike’s, is not that he had suddenly become more audacious; it is that his accumulated excesses eventually crossed a threshold that made continued tolerance impossible.\nClearly Wike’s political audacity has reached a breaking point where it has united the All Progressives Congress (APC) governors, who had hitherto tolerated his excesses, against him.\nSince he was thrust into the national limelight, Wike has spent years taking on virtually everyone who crossed his path, including his benefactors. He also played a significant role in the crisis that destroyed the Peoples Democratic Party (PDP), allegedly following his failure to secure its presidential ticket and Atiku Abubakar’s decision not to choose him as his running mate. It is an open secret that part of his mandate as minister was to weaken the opposition parties, a task that he accomplished with missionary zeal and with great success.\nIn return, he was rewarded with enormous power over the political direction of Rivers State and strategically emboldened in his efforts to politically annihilate Governor Siminalayi Fubara, his successor with whom he was locked in a prolonged power struggle. But, like nzia —the little bird that, after a heavy feast, became so emboldened that it challenged its chi (personal god) to a fight—Wike decided to venture beyond his political territory, meddling in the affairs of other states in ways he would never have tolerated.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nWhile the APC governors had for long tolerated Wike and his trademark brashness, the emergence of his “Rainbow Coalition” appears to have ended what was always an uneasy political relationship.\nWhat might previously have been dismissed as Wike’s familiar political swagger has become, in their view, a direct challenge to their own authority and control of the political structures in their respective states. The coalition is a cross-party platform through which Wike says he is mobilising support for President Bola Tinubu’s re-election while backing candidates of other parties in governorship and legislative elections.\nFor the APC governors, however, that arrangement is totally unacceptable: they see support for the President at the presidential level while backing candidates outside the APC at other levels as a threat to the party and its candidates. Their position, as expressed through the Progressive Governors Forum, led by Hope Uzodimma is that Wike’s support for President Tinubu must extend to APC candidates at the governorship and legislative levels.\nIt’s Governor Dauda Lawal of Zamfara State that has put the governors’ position very bluntly. “Be on one side. You can’t be on two sides,” he bluntly told Wike, insisting that if the minister was genuinely committed to supporting President Tinubu, he should join the APC and campaign for its candidates. Lawal went further: “It’s either he is in APC or he is out.” He also promised to raise Wike’s political position with President Tinubu, making it clear that, from the perspective of the APC governors, Wike’s era of political ambiguity had reached its limit.\nThis is where the Wike matter is becoming particularly interesting. From every indication, his political usefulness that once gave him the considerable leverage appears to have largely diminished. His influence was closely tied to the dirty role he played in the internal crisis that destroyed the PDP, but the political landscape has since ", "translation_ja": "", "vocab": [{"word": "impunity", "definition": "罰を受けないこと、責任を問われないこと。違法行為や不正行為をしても、しばしば何の処罰も受けないという状態を表します。"}, {"word": "overreach", "definition": "権限や能力を超えて行動すること、度を超すこと。自分の限界を超えて行動し、失敗や反発を招くという意味です。"}, {"word": "audacity", "definition": "大胆さ、勇敢さ。ここでは度を超した大胆な行動や無謀な行為を指し、社会的に容認されない無礼な振る舞いを表します。"}, {"word": "thither", "definition": "そこへ、あちらへ（古風な用語）。ここでは文脈で「これまで」という意味で使われており、過去から現在までの期間を表します。"}, {"word": "mandate", "definition": "権限、使命、命令。政治的な文脈では、特定の任務を遂行する権限や責任を意味します。"}]}, {"title_ja": "Independence Day: Wike urges FCT residents to elect leaders who can sustain infrastructure projects", "title_en": "Independence Day: Wike urges FCT residents to elect leaders who can sustain infrastructure projects", "summary_ja": "The minister said the election would give residents a chance to choose leaders who can consolidate the development projects being carried out across the territory. The post Independence Day: Wike urges FCT residents to elect leaders who can sustain infrastructure projects appeared first on Premium T", "summary_en": "The minister said the election would give residents a chance to choose leaders who can consolidate the development projects being carried out across the territory. The post Independence Day: Wike urges FCT residents to elect leaders who can sustain infrastructure projects appeared first on Premium T", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/913968-independence-day-wike-urges-fct-residents-to-elect-leaders-who-can-sustain-infrastructure-projects.html", "state_media": false, "category": "政治", "full_text": "The Minister of the Federal Capital Territory (FCT), Nyesom Wike, has urged residents to use the 2027 general elections to elect leaders with the vision and capacity to sustain and expand ongoing infrastructure development in the territory.\nMr Wike made the call in his Independence Day message to FCT residents on Thursday, as Nigeria marked its 66th anniversary.\nThe minister said the election would give residents a chance to choose leaders capable of consolidating the development projects underway across the territory.\n“My dear residents, as the nation prepares for the forthcoming general elections in January 2027, I enjoin you all to see it as an opportunity to vote in progressive, visionary leaders that will sustain and expand the infrastructural revolution that has commenced in the FCT, leaders who have vision and capacity to bring more development and prosperity to the people,” he said.\nMr Wike said the FCT Administration had invested heavily in roads, public transportation, healthcare and education as part of its efforts to transform Abuja into a modern and functional capital.\nHe said the administration has expanded the road network from the city centre to communities across the territory, with drainage systems and solar streetlights incorporated into some projects.\nThe minister added that the projects were intended to improve access to communities while also addressing security concerns in areas farther from the city centre.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMr Wike also disclosed that an ultramodern bus terminal had been constructed in the Abuja Municipal Area Council, with plans to extend similar facilities to Kuje, Bwari and Gwagwalada.\nHe said the administration was also improving healthcare and education across the six area councils by rehabilitating primary healthcare centres and schools.\n“Healthy and educated populations are the foundation of sustainable development,” Mr Wike said.\nOn security, the minister said the FCT Administration was working with security agencies to protect lives and property across the territory.\nHe said surveillance had been intensified, while community policing and modern technology were being deployed to combat crime.\nMr Wike urged residents to support the government’s development efforts by obeying the law and protecting public infrastructure from vandalism.\nHe also called on residents to maintain cleanliness and orderliness in the capital and promote peaceful coexistence among people from different ethnic, religious and cultural backgrounds.\nDescribing Abuja as a symbol of national unity, the minister said the FCT remained a place where Nigerians from different parts of the country lived and worked together.\n“The Federal Capital Territory stands as the ultimate symbol of our national unity, a place where Nigerians from every tribe, tongue, and faith come together to live, work, and thrive in peace,” he said.\nMr Wike said the administration’s primary mission was to transform Abuja into a world-class capital city where public services work for residents across the territory.\nREAD ALSO: Independence Anniversary: Governor pardons inmates, commutes death sentences\nHe said the development agenda was being extended beyond the city centre to ensure that residents in satellite towns and rural communities also benefited from government projects and services.\nThe minister also expressed optimism about Nigeria’s future and commended President Bola Tinubu’s administration for its reform efforts.\nHe said the FCT would continue to align with the federal government’s Renewed Hope agenda while extending development to communities across the territory.\n“We acknowledge the challenges that have faced our nation in the past 66 years, but also see a great opportunity for renewal and sustainable growth. We are very optimistic that the future is brighter,” Mr Wike said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "infrastructure", "definition": "社会や経済の基盤となる施設やシステム。道路、橋、通信網などの物理的な構造物を指す。"}, {"word": "consolidate", "definition": "複数のものをまとめて統合する、または既存のものを強化・安定させる。ここでは進行中の開発プロジェクトを強化するという意味。"}, {"word": "rehabilitating", "definition": "破損した施設や建物を修復し、元の良い状態に戻すこと。学校や医療施設などの改修工事を指す。"}, {"word": "surveillance", "definition": "監視活動や監視システムのこと。犯罪防止やセキュリティのための継続的な監視を意味する。"}, {"word": "vandalism", "definition": "公共施設や他人の財産を故意に破壊・毀損する行為。器物損壊罪に該当する違法行為。"}]}, {"title_ja": "UK-Iranian Man Arrested in Connection to RAF Fairford Air Base Incident", "title_en": "UK-Iranian Man Arrested in Connection to RAF Fairford Air Base Incident", "summary_ja": "British police said a 25-year-old British-Iranian dual national was arrested Thursday. British officials have said they believe Iran played a part in planning the incident at R.A.F. Fairford.", "summary_en": "British police said a 25-year-old British-Iranian dual national was arrested Thursday. British officials have said they believe Iran played a part in planning the incident at R.A.F. Fairford.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/01/world/europe/uk-iran-terrorism-raf-fairford.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Investigators Seek to Establish Motive in FlyDubai Attack", "title_en": "Investigators Seek to Establish Motive in FlyDubai Attack", "summary_ja": "The United Arab Emirates said it would lead the investigation, including into possible li ry_ja": "The Long March spirit not only resonates across the Chinese nation, but is also a source of inspiration that transcends borders and touches hearts around the world.", "summary_en": "The Long March spirit not only resonates across the Chinese nation, but is also a source of inspiration that transcends borders and touches hearts around the world.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-28/Why-they-chose-China-From-Engst-and-Hinton-to-Bethune-and-Sakolsky-1QOmBaJ4QHm/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Israeli PM says pilot tried to crash flight after stabbing captain", "title_en": "Israeli PM says pilot tried to crash flight after stabbing captain", "summary_ja": "Israeli PM says pilot tried to crash flight after stabbing captain", "summary_en": "Israeli PM says pilot tried to crash flight after stabbing captain", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-30/news-1QRLPQlO8HS/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Are you 'becoming Chinese'? Chinese-European guest unpacks the trend", "title_en": "Are you 'becoming Chinese'? Chinese-European guest unpacks the trend", "summary_ja": "Are you 'becoming Chinese'? Chinese-European guest unpacks the trend", "summary_en": "Are you 'becoming Chinese'? Chinese-European guest unpacks the trend", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-28/Are-you-becoming-Chinese-Chinese-European-guest-unpacks-the-trend-1QOl0pjYybu/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Crew Dragon spacecraft with Russian cosmonaut on board docks with ISS", "title_en": "Crew Dragon spacecraft with Russian cosmonaut on board docks with ISS", "summary_ja": "The flight to the orbital station took seven hours and 55 minutes, which makes it the fastest journey to the ISS in the history of manned spaceflights", "summary_en": "The flight to the orbital station took seven hours and 55 minutes, which makes it the fastest journey to the ISS in the history of manned spaceflights", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/science/2196401", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Fire in 18th century mansion in St. Petersburg put out", "title_en": "Fire in 18th century mansion in St. Petersburg put out", "summary_ja": "Open fire was put out at 10:45 p.m. Thursday GMT", "summary_en": "Open fire was put out at 10:45 p.m. Thursday GMT", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2196399", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Europeans tired of Ukrainian conflict, want peace there — WSJ", "title_en": "Europeans tired of Ukrainian conflict, want peace there — WSJ", "summary_ja": "The report says that more and more European voters start to view financial and military assistance to Ukraine as a harmful and dangerous practice", "summary_en": "The report says that more and more European voters start to view financial and military assistance to Ukraine as a harmful and dangerous practice", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2196397", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "America’s Looming Debt Reckoning", "title_en": "America’s Looming Debt Reckoning", "summary_ja": "High debt levels become dangerous when rising interest rates push up borrowing costs and governments fail to respond. With little political appetite to rein in its federal deficit and ballooning debt, the United States risks finding itself with few options when the next war, recession, or financial ", "summary_en": "High debt levels become dangerous when rising interest rates push up borrowing costs and governments fail to respond. With little political appetite to rein in its federal deficit and ballooning debt, the United States risks finding itself with few options when the next war, recession, or financial ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-cannot-keep-putting-off-addressing-its-fiscal-problems-by-kenneth-rogoff-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "America’s Looming Debt Reckoning\nHigh debt levels become dangerous when rising interest rates push up borrowing costs and governments fail to respond. With little political appetite to rein in its federal deficit and ballooning debt, the United States risks finding itself with few options when the next war, recession, or financial crisis arrives.\nCAMBRIDGE—America’s fiscal position is increasingly looking like a train hurtling along a twisting mountain track. No one seems willing to slow down for fear of falling behind schedule and losing their job. Even if the train doesn’t crash, it is worth asking: Why keep pushing it? Despite solid growth, the federal deficit is about 6% of GDP. Yet the option of slowing down does not appear to be in President Donald Trump’s playbook.", "translation_ja": "", "vocab": [{"word": "reckoning", "definition": "清算や決算の時を意味し、過去の行動や決定に対して責任を取らされる時点のこと。ビジネス文脈では財務的な清算を指す。"}, {"word": "ballooning", "definition": "急速に膨張・増加することを意味する動詞。特に負債や問題が急増している状況を表現する際に使用される。"}, {"word": "fiscal", "definition": "政府の財政や予算に関連する形容詞。税収、支出、赤字などの経済政策全般を指す。"}, {"word": "appetite", "definition": "本来は食欲を意味するが、比喩的に欲望や関心、またはそれらを持つ意欲を表す。政治的な関心度合いなどに用いられる。"}, {"word": "deficit", "definition": "収入が支出を下回る赤字の状態を意味する。特に政府予算や貿易収支における不足額を指す。"}]}, {"title_ja": "The OECD Should Be Reclaimed, Not Abandoned", "title_en": "The OECD Should Be Reclaimed, Not Abandoned", "summary_ja": "In recent years, the OECD has strayed from its core mission of coordinating economic policy among the US and its allies, instead building programs around gender budgeting and environmental justice. The Trump administration should use its leverage at the organization to return its focus to economics ", "summary_en": "In recent years, the OECD has strayed from its core mission of coordinating economic policy among the US and its allies, instead building programs around gender budgeting and environmental justice. The Trump administration should use its leverage at the organization to return its focus to economics ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/oecd-65th-anniversary-must-refocus-its-mission-on-economics-national-security-by-kim-ruhl-and-pierre-yared-1-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The OECD Should Be Reclaimed, Not Abandoned\nand\nIn recent years, the OECD has strayed from its core mission of coordinating economic policy among the US and its allies, instead building programs around gender budgeting and environmental justice. The Trump administration should use its leverage at the organization to return its focus to economics and national security.\nNEW YORK—On September 30, the OECD marked the 65th anniversary of its founding. Like many other aging international organizations, it has developed a taste for mission creep, as we witnessed firsthand as former delegates there. That is why some US policymakers want to reduce or eliminate funding for the organization. But walking away from the OECD would mean abandoning capabilities that are becoming ever more important in America’s economic competition with China.", "translation_ja": "", "vocab": [{"word": "mission creep", "definition": "組織が本来の目的から逸脱し、徐々に責任範囲を拡大していく傾向。元の使命を失い、関連のない新しい目標を追加することを指す。"}, {"word": "leverage", "definition": "影響力や交渉力を使って特定の目的を達成する能力。国際組織では、資金提供や投票権などの力を使って方針変更を強制することを意味する。"}, {"word": "delegates", "definition": "国際会議や組織に派遣される公式代表者。各国や団体を代表して交渉や投票に参加する権限を持つ。"}, {"word": "strayed", "definition": "本来の道や目的から外れる、逸脱する。組織や個人が元々の方針や方向性を失うことを意味する。"}, {"word": "competition", "definition": "企業や国家間の競争。経済的、技術的、または地政学的な優位性を争う状況を指す。"}]}, {"title_ja": "Putin Is Testing NATO at Ukraine’s Borders", "title_en": "Putin Is Testing NATO at Ukraine’s Borders", "summary_ja": "The Kremlin is determined to isolate Ukraine, which means not only breaking the will of the country’s backers, but also cutting it off physically by striking merchant ships, ports, and border crossings. These assaults cannot go unanswered, because they embolden Russian President Vladimir Putin to co", "summary_en": "The Kremlin is determined to isolate Ukraine, which means not only breaking the will of the country’s backers, but also cutting it off physically by striking merchant ships, ports, and border crossings. These assaults cannot go unanswered, because they embolden Russian President Vladimir Putin to co", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/putin-attacks-on-borders-trains-carrying-western-officials-test-of-nato-by-anna-husarska-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Putin Is Testing NATO at Ukraine’s Borders\nThe Kremlin is determined to isolate Ukraine, which means not only breaking the will of the country’s backers, but also cutting it off physically by striking merchant ships, ports, and border crossings. These assaults cannot go unanswered, because they embolden Russian President Vladimir Putin to continue testing the West.\nLVIV—Jet-powered Russian drones recently hit a train in Ukraine a mere mile from the Polish border. The drone pilots, and their Kremlin minders, must have known that officials from Europe, the United Kingdom, the United States, and elsewhere had previously left Kyiv by train after participating in the Yalta European Strategy (YES) Annual Meeting, a sort of Ukrainian Davos. But the trains carrying former UK Prime Minister Boris Johnson, former Swedish Prime Minister Carl Bildt, former CIA Director David Petraeus, and former Polish President Aleksander Kwaśniewski, among others, were not hit. Had the Russians missed them intentionally or through incompetence?", "translation_ja": "", "vocab": [{"word": "embolden", "definition": "勇気や確信を与えて、行動を起こすよう促すこと。ここではプーチンが西側への攻撃を続けるよう励まされている状況を表します。"}, {"word": "isolate", "definition": "孤立させる、隔離する。政治的・物理的に対象を周囲から切り離す意味で使用されます。"}, {"word": "assaults", "definition": "激しい攻撃、襲撃。軍事的な攻撃行為を指す正式な表現で、TOEICでよく出題される語彙です。"}, {"word": "minders", "definition": "付き人、監視者、世話役。ここではクレムリンの指揮官たちを指し、重要人物の身辺管理や監視を行う人を意味します。"}, {"word": "intentionally", "definition": "意図的に、故意に。あることを計画して行うことを表し、副詞として使用される高度な表現です。"}]}, {"title_ja": "The Guardian view on the death penalty: Christa Pike’s execution was botched, but cruelty is inherent | Editorial", "title_en": "The Guardian view on the death penalty: Christa Pike’s execution was botched, but cruelty is inherent | Editorial", "summary_ja": "Three-quarters of nations have rightly abolished capital punishment in law or practice, but killing by the state has surged in the US What is the kindest way to kill? That’s the question being asked once more following Tennessee’s failed attempts to execute Christa Pike for the brutal murder of a cl", "summary_en": "Three-quarters of nations have rightly abolished capital punishment in law or practice, but killing by the state has surged in the US What is the kindest way to kill? That’s the question being asked once more following Tennessee’s failed attempts to execute Christa Pike for the brutal murder of a cl", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/01/the-guardian-view-on-the-death-penalty-christa-pikes-execution-was-botched-but-cruelty-is-inherent", "state_media": false, "category": "オピニオン", "full_text": "What is the kindest way to kill? That’s the question being asked once more following Tennessee’s failed attempts to execute Christa Pike for the brutal murder of a classmate, Colleen Slemmer, when she was 18. The 50-year-old was taken to a medical facility, her condition unknown, with witnesses describing her snoring loudly around 40 minutes after receiving two injections of pentobarbital on Wednesday. It is the second botched killing in months, prompting Tennessee’s governor to order a halt to executions.\nLethal injection was supposed to be the humane alternative to firing squads and electric chairs. They in turn were seen as an improvement on hanging, which looked much like lynching in a system disproportionately handing the death penalty to black men. The age and ill health of those executed, and the ethical refusal of most medical staff to be involved, may contribute to botched injections. But analysis of autopsy results has provided compelling evidence that suffering is inherent; injections – especially those involving paralytic drugs – have merely disguised it. What is described as safeguarding the dignity of prisoners is really about reducing the discomfort of witnesses who would otherwise see their suffering.\nPressure from campaigners on pharmaceutical companies has curbed the supply of lethal drugs, but it has not stopped executions. Donald Trump’s enthusiasm for the death penalty has spurred on state officials, with the highest number of executions for 16 years in 2025. Some states have found alternative drugs, which may increase the suffering of those killed. Others are using different techniques. In June, the supreme court stopped Alabama from executing a prisoner with nitrogen gas, which it has used in other cases. The use of firing squads has resurged. Experts say such deaths can be “excruciating”, especially where marksmen miss the heart of the condemned, with allegations that some executions could even have been deliberately botched.\nThe US is in a shameful minority. Three-quarters of countries have got rid of capital punishment in law or practice – with Lebanon this year becoming the first Middle Eastern country to abolish it.\nOnly 17 countries executed prisoners last year, though the total number killed rose to more than 2,700 – the highest since 1984. (The figures do not include China, believed to carry out the most executions.) But while Mr Trump and others champion capital punishment, the American public are turning away from it. In 1994, 80% supported it; by last year that had fallen to 52%. A majority of younger people oppose it.\nHigh-profile miscarriages of justice have contributed to growing disquiet. So have cases such as Pike’s. She endured sexual abuse and rape by three perpetrators in childhood, as well as beatings and neglect – yet her experiences and age were not adequately put forward by lawyers at her trial. Her bipolar disorder and post-traumatic stress disorder were diagnosed only afterwards. Sandra Babcock, an expert on the death penalty who has acted on Pike’s behalf, argued that her execution would confirm that it was reserved “not for the worst of the worst, but for the most damaged and vulnerable among us”.\nThe ultimate problem, however, is not that the wrong people are being executed, but that anyone is being executed. The search for a humane way to kill is inherently preposterous. It is not just lethal injection, the firing squad or electrocution that should be rejected – but the death penalty itself.", "translation_ja": "", "vocab": [{"word": "botched", "definition": "失敗した、やり損なった。医療処置や計画などが不完全または失敗した状態を表す。"}, {"word": "humane", "definition": "人道的な、思いやりのある。人間らしい優しさや慈悲心を示す行為や方針を指す。"}, {"word": "inherent", "definition": "本来備わっている、固有の。あるものの本質的な特性として存在することを意味する。"}, {"word": "curtailed", "definition": "制限された、削減された。供給量や活動などが減らされた、または制御されたことを表す。"}, {"word": "excruciating", "definition": "苦痛に満ちた、耐え難い苦しみを伴う。極度の肉体的または精神的苦痛を強調する表現。"}]}, {"title_ja": "The horror of the Cornell rape case is how ordinary it is | Moira Donegan", "title_en": "The horror of the Cornell rape case is how ordinary it is | Moira Donegan", "summary_ja": "Many men rape; many men giggle encouragingly, or shrug indifferently, when their friends rape. Many men rape, and few seem to think that it’s a very big deal Maybe more than anything else, sexual violence is repetitive. Men commit it in patterns: mostly against women who are close by and vulnerable,", "summary_en": "Many men rape; many men giggle encouragingly, or shrug indifferently, when their friends rape. Many men rape, and few seem to think that it’s a very big deal Maybe more than anything else, sexual violence is repetitive. Men commit it in patterns: mostly against women who are close by and vulnerable,", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/01/cornell-rape-case", "state_media": false, "category": "オピニオン", "full_text": "Maybe more than anything else, sexual violence is repetitive. Men commit it in patterns: mostly against women who are close by and vulnerable, just below them on some social hierarchy: their assistant, their date, their friend, their daughter, their student, their kid’s babysitter.\nMen rape for opportunity – because they can – and for status – because it makes them feel good. They rape to impress other men, documenting it on phones for one another’s benefit. Men rape and do not always seem to register much of a difference between the sex they’ve had that was rape and the sex that they’ve had that wasn’t. They rape, often, without seeming to think about it, registering their victims’ unwillingness with vague contempt, if at all.\nInstitutions don’t seem very interested, either. When a woman comes forward, she is often told in hushed, awed and thoroughly patronizing tones that she is so brave – by the very same people, be they cops or prosecutors or Title IX coordinators, who will then set about explaining to her why she had no right to say no; why the man or men who violated her were within their rights to do so; why inaction and indifference on the part of the people she turned to for help are the only rational response, and the best that she can hope for. Some version of this happens over and over and over again. It happens every day.\nOnce in a while, an instance will rise to public consciousness. There is outrage, new articulations of feminist consciousness. Brilliant and livid women describe the pattern with insight, intelligence, and often a kind of bitter wit. People with real power call for action, investigations, even a new law. Then, the moment fades. Attention ebbs. Change doesn’t come. Soon after, a woman wakes up bruised. She steels herself to report. A person on the other side of a table will smile at her with a patronizing treachery, tell her something nonspecific, and set the cycle of impunity in motion again.\nThis pattern is repeating itself, now, at Cornell. A civil suit filed by a former undergraduate against the university and seven male students has attracted public attention and instigated feminist agitation around rape to a degree not seen in years.\nThe unnamed plaintiff alleges that in October 2024, she was raped and sexually assaulted over a period of some seven hours at Cornell’s Chi Phi fraternity house by seven men, named as Matthew Ingalls, Johnathan Newell, Winston Lee, Gillio Lopes, Diego Sarabia, Scott Norris and Scott Kretzschmar. (Lopes denied wrongdoing in statements to the press, as did Norris and Kretzchmar, the Scotts.) It was Ingalls who had allegedly invited her to the house; she thought he was her friend.\nThe woman’s lawsuit alleges that the men plied her with alcohol and pressured her to snort ketamine, and proceeded to assault and rape her when she was severely intoxicated and unable to resist. Her complaint includes screenshots from the fraternity’s group chat, in which one of the men, Jonathan Newell, advertised “free pussy” on the night of the attack – seemingly inviting other men to join in the alleged gang rape.\nAccording to screenshots included in the complaint, some of the men in the fraternity who received the message responded with encouragement or delight. None of the more than 50 men included in the group chat objected or reported the ongoing incident.\nUnlike many women, the victim reported her assault. But she claims that the results were disappointing. Only two of the men involved were expelled from Cornell. All of the other five soon returned to classes; some were briefly suspended, or required to attend a workshop. According to the student-run Cornell Daily Sun, which broke the story of the lawsuit, the accused were asked, as part of their punishment, to write an essay. I would like to read those essays. Their alleged victim dropped out; according to her attorney, she has not returned to college.\nFor his part, the local district attorney in Cornell’s Tompkins county, Matthew Van Houten, declined to pursue charges – claiming, nonsensically, that the woman who came to the police to report a rape did not assert that the encounter was nonconsensual or that she was drugged against her will. Van Houten says that allegations from this month’s civil lawsuit are “dramatically different” from Jane Doe’s statement two years ago. In her interview with police at that time, Doe said: “I can say with 100% confidence I was raped.” When asked about this by CBS News, Van Houten replied: “I’m going to follow up on this because this is news to me.”\nNone of the men were ever arrested; it’s not clear that they were interviewed by police at all. Van Houten has now reversed that decision and reopened the case following a public outcry, and subsequently gone on something of a press tour defending his initial decision not to investigate. But one wonders about his integrity and soundness of judgment in handling such cases. Sadly, his behavior here is not an outlier.\nIt is often o", "translation_ja": "", "vocab": [{"word": "patronizing", "definition": "相手を見下しながら親切にするような態度。上から目線で接すること。"}, {"word": "impunity", "definition": "罰を受けないこと、処罰されないままでいる状態。特に悪行が罰せられないことを指す。"}, {"word": "articulations", "definition": "明確に表現または説明すること。複雑な思想や概念を言葉で具体的に述べることを意味する。"}, {"word": "instigated", "definition": "何かが起こるきっかけを作る、扇動する。特に行動や運動を促進させることを指す。"}, {"word": "ebbs", "definition": "引き潮のように減少または衰退していく。感情や注意が段々と薄れていく状態を表す。"}]}, {"title_ja": "The ultra-rich face … accountability? Manchester City and Clippers verdicts show it’s possible | Leander Schaerlaeckens", "title_en": "The ultra-rich face … accountability? Manchester City and Clippers verdicts show it’s possible | Leander Schaerlaeckens", "summary_ja": "The sports world has accomplished a rare feat: calling out industrial-scale cheating on both sides of the Atlantic Sign up for our free newsletter here The first stage of billionaire exposure to accountability is vociferous denial . The second is bafflement that such an earthly and proletarian probl", "summary_en": "The sports world has accomplished a rare feat: calling out industrial-scale cheating on both sides of the Atlantic Sign up for our free newsletter here The first stage of billionaire exposure to accountability is vociferous denial . The second is bafflement that such an earthly and proletarian probl", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/football/2026/oct/01/manchester-city-la-clippers-ultra-rich-accountability", "state_media": false, "category": "オピニオン", "full_text": "The first stage of billionaire exposure to accountability is vociferous denial.\nThe second is bafflement that such an earthly and proletarian problem should even be allowed to happen to you, titan of industry, pillar of society, master of man and beast alike.\nThe third is a milquetoast non-apology apology “for the distraction and distress this matter has caused”, after issuing a total and belligerent denial through your proxies.\nThe fourth stage? We’ll know soon enough.\nWithin the last month, we have traipsed, on tiptoes, into a strange new age where some modicum of repercussion may occasionally threaten the billionaire class – albeit strictly limited to the confines of sports, where nothing actually matters. It’s a new and funny feeling in an age when it seems that the 1% don’t just get a bespoke business climate, where taxation and regulation are administered on an opt-in basis, but their own concierge service from the justice system, too.\nSetting aside for the moment the argument of whether billionaires should exist at all, or whether they are a flagrant failure of fiscal policy, this is a remarkable turn of events.\nOn 2 September, the NBA released the findings of an investigation: The Los Angeles Clippers and their owner Steve Ballmer were officially caught paying star forward Kawhi Leonard $28m off the books for a no-show job with a supposed sponsor, circumventing the league’s salary cap. The Clippers were docked five first-round picks and fined $30m. Ballmer, the ninth richest man in the world, was suspended from involvement with his team for a year. Initially, the Clippers issued a statement, snarling that they “vehemently reject the NBA’s findings, which are the result of a heavily biased investigation seeking to justify a predetermined narrative rather than facts and evidence”.\nThen, the team accepted the punishment.\nAfter all, they were caught bang to rights, after a year-long investigation by journalist Pablo Torre and his podcast, Pablo Torre Finds Out, which won a Pulitzer Prize for its work. The podcast unfurled its findings over several episodes and faced deep skepticism, including from Mark Cuban, Dallas Mavericks minority owner and Ballmer’s fellow billionaire. “I’m on Team Ballmer,” Cuban had previously posted in an act of class solidarity. “Steve isn’t that dumb.”\nBallmer, it should be noted, was only allowed to buy the Clippers when the team’s previous owner, Donald Sterling, was more or less expelled from the league over racist comments; another rare time that an owner was brushed back, especially by their own kind.\nThen, last week, a similar hammer dropped; Manchester City has been found guilty of more than 100 charges of cheating the Premier League’s financial regulations from 2009 to 2018 and obstructing the subsequent investigation from 2019 to 2023. They’re not at the apology stage yet, insisting on their innocence, as they have all along, taking an aggressively defiant posture.\nStill, it seems that in any of the plausible ways this may play out, after several more years of appeals and lawsuits surely, the club’s Abu Dhabi ownership will emerge from the ordeal bruised. Its entire footballing body of work, backed by untold billions in investment turning a humdrum club into a world-beating one, will have been tarnished. And if the entire point of the project – in the club administrator parlance – was a soft power PR play by the oil-rich nation state, it will have backfired catastrophically. No matter what happens next, the UAE-owned club will be remembered for cheating on an industrial scale, with a colossal scope, subverting the world’s most popular sporting competition and a British cultural institution for almost a decade.\nIt’s worth pausing and taking that in. These are the very rare occasions in a modern society, which has carved out a friction-free fast lane for the very rich and the very, very rich, that anyone in that stratus should be made to pay a price for anything at all.\nLike that time New England Patriots owner Robert Kraft was allegedly caught paying for sex in a Florida massage parlor; prosecutors dropped the charge. Or the current status of the ridiculous and spiteful New York Knicks owner James Dolan, who faces a lawsuit by a former employee over discrimination in which it’s alleged that he spied on the team’s own fans illegally – this, too, had been reported by Torre. It feels unlikely that Dolan will ever feel any effects from the accusations.\nAnd this is in addition to innumerable examples outside sports – including a certain resident of the White House, and a lot of his friends and allies.\nTime will probably mark out the Clippers and City cases as outliers. But that, for now, is what makes them so notable, so newsworthy. People of power and means running into the consequences of their own decadent and crooked decisions. A true novelty in our time.\n- \n  Leander Schaerlaeckens is the author of The Long Game: US Men’s Soccer and Its Savage, Four-Decade Journey to t", "translation_ja": "", "vocab": [{"word": "vociferous", "definition": "大声で激しく意見を述べる様子を指します。billionairesが責任追及に対して最初に取る行動として、激しく否定することを表しています。"}, {"word": "milquetoast", "definition": "気が弱く優柔不断な人、またはそのような性質を持つものを意味します。ここではbillionairesの謝罪声明が本気ではなく弱々しいものであることを皮肉的に表現しています。"}, {"word": "belligerent", "definition": "好戦的で敵対的な態度を示すことを意味します。proxiesを通じて発せられた強硬で対立的な否定声明を表現しています。"}, {"word": "bespoke", "definition": "特注の、個別にカスタマイズされたものを意味します。billionairesのために特別に調整された税制や規制体系があることを批判的に表現しています。"}, {"word": "circumvent", "definition": "法律や規則を巧妙に回避する、またはすり抜けることを意味します。Kawhi Leonardへの給与をサラリーキャップ制度の外で隠蔽した不正行為を指しています。"}]}, {"title_ja": "Why Iran Escalates", "title_en": "Why Iran Escalates", "summary_ja": "Tehran’s strategy to drive America out of the Middle East.", "summary_en": "Tehran’s strategy to drive America out of the Middle East.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/why-iran-escalates", "state_media": false, "category": "オピニオン", "full_text": "These, it might seem, are good days for the Islamic Republic of Iran. After years of being diplomatically isolated, economically strangled, and militarily assaulted, the Iranian regime came face-to-face with its nightmare scenario—a full-blown war with Israel and Washington—and survived. The United States began bombing Iran on February 28 with the goal of destroying the country’s nuclear program, its missile program, and even its government, only to fail spectacularly at each objective. In fact, Tehran may now be stronger than it was when the war began. It successfully seized the Strait of Hormuz and shuttered it, sending energy prices skyward. Its armed forces have proved capable of continuing to damage American military bases despite coming under heavy bombardment. U.S. support for the war, always weak, has fallen, and international anger at Washington has spiked. Little wonder, then, that many analysts think Tehran will stay the course over the coming year.\nIranian officials are no doubt proud of how their country has fared against Israel and the United States. They have publicly bragged about their success and even declared victory. But in private conversations, the regime’s elites remain quite nervous. They know that the United States has many tools and tactics it can use to increase the pressure on Iran, and they are concerned that the factors that seem to be holding Washington back—dwindling stockpiles of ammunition, domestic public opinion, and international opposition—could go away, grow manageable, or otherwise become unimportant to American officials.\nFor the United States, this might seem like good news. If Tehran still fears Washington, perhaps the U.S. government can pressure Iran’s leaders into making concessions. But this misreads the mood in Iran’s capital. The country’s elites have been hardened by the war, which killed their friends and family members. They see February 28, 2026, the same way Israelis see the October 7, 2023, attack by Hamas—as the moment their enemy proved willing to slaughter them, and thus as proof it must be permanently defeated. They never had much faith in American negotiators; now, they have virtually none.\nIran, then, is adopting a strategy toward the United States defined by escalation and continuous offense. That means it will neither stay the course nor compromise with Washington. Instead, it will start doing even more to hurt the economies of the United States’ regional partners and to decimate global energy markets, as well as expand its attacks on U.S. military infrastructure. It could try to assassinate American and Israeli officials. It may even launch ground offensives against its neighbors, including by trying to seize U.S. bases located in Gulf Arab countries.\nThis approach might fail to make the United States relent. But even if neither side can overpower the other right now and both accept a settlement, peace is unlikely to last. Tehran believes that Washington will regroup and, eventually, start fighting again. The regime is committed to responding forcefully to any American provocation, and perhaps even attacking without one. It does not think it can live with a U.S. presence in the Middle East, so it is willing to go full tilt to get the United States out. Iran’s enduring goal, in other words, will be to make staying in the region so painful that Washington has no choice but to withdraw most of its troops, accept Tehran’s control over the Strait of Hormuz, and acknowledge the Islamic Republic as an enduring power.\nFEAR AND LOATHING\nWhen the U.S.-Israeli war on Iran began, Iran’s foreign minister, Abbas Araghchi, was at a meeting in Supreme Leader Ali Khamenei’s compound. Araghchi had spent the last several months negotiating with the United States over Iran’s nuclear program, but in the preceding weeks, Washington had moved many of its military assets closer to the Persian Gulf and demanded that Iran give up all nuclear enrichment. U.S. President Donald Trump was publicly suggesting that he might try to overthrow the Islamic Republic. Araghchi was in the middle of briefing senior officials on these developments and the growing likelihood of conflict when the bombs started to fall.\nKhamenei’s compound was targeted in the initial strikes, which killed many senior officials—including the supreme leader himself. But Araghchi lived. He emerged from the rubble stunned and covered in debris. According to an account he gave to an Iranian podcaster, he ran into the street, stopped a passing car, and asked the driver to take him to the foreign ministry. From there, he tried to reach any military commanders he could and began contacting foreign leaders. Soon, he was joined by other surviving officials.\nThe Islamic Republic had long anticipated that Khamenei and his deputies might be killed, so it was well prepared to handle the aftermath of the attacks. The government had spent the better part of a year, for instance, decentralizing its political and military", "translation_ja": "", "vocab": [{"word": "diplomatically isolated", "definition": "外交的に孤立した状態。国際社会との外交関係が断絶または大幅に制限されている状況を指す。"}, {"word": "spectacularly", "definition": "劇的に、見事に失敗するさま。期待と現実のギャップが大きく、印象的な方法で何かが起こることを表す。"}, {"word": "dwindling", "definition": "徐々に減少する、減少していく。特に重要なリソースや支援が時間とともに少なくなる様子を描写する。"}, {"word": "misreads", "definition": "誤って解釈する、読み違える。状況や他者の意図を間違って理解することを意味する。"}, {"word": "hardened", "definition": "厳しくなる、頑固になる。経験や苦難を通じて、より強固で譲歩しない態度になることを表す。"}]}, {"title_ja": "The AI Autocrat", "title_en": "The AI Autocrat", "summary_ja": "How technology empowers—and imperils—dictators.", "summary_en": "How technology empowers—and imperils—dictators.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/artificial-intelligence-autocrat-technology-empowers-dictators", "state_media": false, "category": "オピニオン", "full_text": "Two weeks after Moscow’s full-scale invasion of Ukraine in March 2022, the Russian TV Channel One editor Marina Ovsyannikova burst onto the set of the evening newscast. She held up a hand-drawn sign behind the anchor’s head that read: “Stop the war. Don’t believe propaganda. They’re lying to you!” She shouted, “No to war!” until she was dragged away.\nNo one has protested the war on Russian television since then, partly as a result of tighter security and a general climate of fear. But in October 2024, Margarita Simonyan, one of Russia’s chief propagandists, gave another explanation. A growing number of the RT network’s anchors, she explained to an interviewer, are not real. “That face doesn’t exist. We generated the voice and everything else.” They were, she meant, produced by artificial intelligence. In a follow-up interview with the newspaper Vedomosti, she spelled out the logic: “These anchors don’t need a salary or insurance,” she said. “They won’t get arrested, and the police won’t search their homes. It’s all wonderful and terrifying at the same time.”\nThis is AI’s promise to every autocratic ruler: the ability to maintain control without delegating tasks to unreliable humans. It is an extremely attractive prospect. No matter how powerful, dictators have always needed subordinates—censors, propagandists, security guards, police officers, intelligence analysts, and local bureaucrats—to carry out their orders. But subordinates always pose a potential threat. They could shirk, steal, lie, leak, or conspire against their boss. As a result, one of the oldest dilemmas facing autocrats is how to empower agents to carry out orders without also enabling them to turn against their leader. Autocrats have usually managed the tradeoff by filling key positions with mediocrities whose incapacity is, as the political theorist Hannah Arendt put it, “the best guarantee of their loyalty.” But this inevitably makes it harder for dictatorships to govern and survive crises.\nAI appears to offer autocrats two ways to resolve this long-standing dilemma. First, it means they can now easily monitor and discipline their followers in real time. A change in a local official’s spending habits or meeting schedules can be flagged automatically by an AI system, without any need for self-interested informants. Second, AI can eliminate underlings altogether. By automating tasks that once required human discretion, rulers can replace unreliable intermediaries with faithful algorithms that cannot be bribed or manipulated. Officials in autocratic regimes have said as much. AI “can definitely replace half of officials,” Russia’s Digital Development Minister, Maksut Shadaev, told a Moscow data forum in April 2025, adding, “maybe slightly more.”\nYet these promises of a self-running state are illusory, because AI is never truly autonomous. Systems have to be built and maintained by a cadre of engineers and data scientists whose expertise political leaders cannot evaluate. The ruler who turns to AI to reduce a dependence on unreliable humans may end up relying, more blindly than before, on the few AI specialists who keep the system running. And this new digital Praetorian Guard may have the same weaknesses as the old, which makes it a threat to the ruler.\nEYES AND EARS\nChina is in the lead when it comes to developing AI systems that can monitor or replace subordinates. Smart city programs in Beijing, Shanghai, and other urban centers use AI to track performance and centralize oversight of local officials who once operated in comfortable obscurity, subjecting them to an algorithmic performance review. China also developed a “Zero Trust AI system,” which it deployed across roughly 30 counties and cities over the past decade. This system cross-referenced more than 150 government databases to catch embezzlement and nepotism by local officials. It worked a little too well, flagging 8,700 officials before local governments, under pressure from the bureaucrats it was monitoring, began rolling it back. But Beijing has not gotten rid of its new e-government portals, which use automated systems for issuing documents and permits, reducing face-to-face interactions that bred petty corruption or favoritism. The Chinese Communist Party, meanwhile, has plowed ahead with researching what it calls “thought management,” or how to use AI to create microtargeted propaganda. China’s army of Internet commentators, once composed of paid humans, is already being replaced by bots.\nRussia has been pursuing the same goals with a similar fervor. Moscow’s citywide facial recognition system, deployed across 200,000 cameras, was used to identify and apprehend protesters during the 2021 antigovernment demonstrations. The central government has started using automated data collection and aggregation to bypass regional officials who could taint the data or use it to promote their own interests. In 2023, Russia’s Internet regulator launched Oculus, an AI system that scans hundre", "translation_ja": "", "vocab": [{"word": "propagandist", "definition": "政治的・イデオロギー的な宣伝を意図的に広める人。特に権力者の利益のために虚偽や偏った情報を流布する専門家を指す。"}, {"word": "autocrat", "definition": "絶対的な権力を持つ独裁者。自らの意思により統治権を独占し、他の権力機関や市民の制約を受けない統治者。"}, {"word": "mediocrities", "definition": "平凡で能力の限定的な人々。指導者が故意に能力の低い部下を登用することで、反乱や陰謀のリスクを減らすこと。"}, {"word": "delegating", "definition": "権限や責任を他の人に移譲・委任すること。特に上位者が下位者に特定のタスクや権限を譲り渡す行為。"}, {"word": "dilemma", "definition": "二つの相反する選択肢の間での困難な決定状況。どちらを選んでも何らかの不利益がある板挟みの状態。"}]}, {"title_ja": "The Scramble for the Open Seas", "title_en": "The Scramble for the Open Seas", "summary_ja": "Over the last half millennium, societies around the globe competed to divide up the world’s land. Nearly every square inch of soil outside Antarctica is now owned and tucked within national borders. But the oceans have largely been spared that fate. There were times throughout history when countries", "summary_en": "Over the last half millennium, societies around the globe competed to divide up the world’s land. Nearly every square inch of soil outside Antarctica is now owned and tucked within national borders. But the oceans have largely been spared that fate. There were times throughout history when countries", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/oceans-seas/scramble-open-seas", "state_media": false, "category": "オピニオン", "full_text": "Over the last half millennium, societies around the globe competed to divide up the world’s land. Nearly every square inch of soil outside Antarctica is now owned and tucked within national borders. But the oceans have largely been spared that fate. There were times throughout history when countries tried to gate and regulate the seas, but they were too vast to be controlled for long periods. During the Cold War, as technology made it far easier to imagine partitioning the world’s waterways and seabeds, great powers avoided an unrestrained race to grab the oceans. Most governments agreed to deal with them through a patchwork of treaties and multilateral bodies that sought to guarantee freedom of navigation in international waters and assign coastal seabeds to adjacent littoral states.\nThat order is now collapsing. The Houthis are disrupting shipping in the Bab el Mandeb Strait, the gateway to the Red Sea. Iran and Oman are planning to charge ships fees for using the Strait of Hormuz, a chokepoint for global energy supplies and fertilizers. In July, U.S. President Donald Trump even floated the idea that the United States could impose its own toll on Hormuz, only to later drop the plan.\nOther governments, too, are jockeying to claim international waters and marine resources for themselves. Russia is trying to assert control over vast swaths of Arctic waters and seabeds, China is building artificial islands in the South China Sea, the United States has expanded its claims to seabeds beyond its exclusive economic zone, and many countries are laying the groundwork to mine the ocean floor for critical minerals.\nThe institutions that have kept the oceans free and open are failing, and great powers have, in key areas, stopped abiding by the rules that have held for decades. States are already making moves to control the seas. If governments rush to claim the world’s waters, as they did its land, they will make global commerce more difficult and encourage a new era of seaborne conflict. A world in which the oceans are carved up will invariably be poorer and more dangerous.\nFOR WHOM THE STRAIT TOLLS\nGovernments around the globe are taking note of the success of the maritime blockades in the Middle East. Just as Iran announced that it intended to introduce a toll in Hormuz, Indonesia’s finance minister suggested that Indonesia might follow suit in the Strait of Malacca, a critical shipping lane in Southeast Asia that carries roughly 29 percent of global maritime oil flows. (He eventually walked back the idea.)\nThe closures of the Strait of Hormuz and the Bab el Mandeb Strait are just the latest in a series of violations of the norms and rules governing oceans. China, for instance, has routinely flouted a binding 2016 ruling under the UN Convention on the Law of the Sea (UNCLOS) that rejected China’s expansive claims in the South China Sea. Beijing contravenes the decision by continuing to build artificial islands on disputed reefs, infringe on the Philippines’ exclusive economic zone, and encircle Taiwan. Russia, for its part, is suspected of breaking UNCLOS rules by using ships with concealed identities to cut undersea cables as part of a broader campaign to unsettle European countries.\nThis aggression is possible in large part because the institutions responsible for managing the oceans are ineffectual. The International Tribunal for the Law of the Sea, the body that is supposed to mediate maritime disputes, is slow and lacks an enforcement mechanism. The same is true of the Permanent Court of Arbitration, which makes binding rulings on treaty violations. The UN Security Council, which could levy economic penalties or even greenlight military action to protect shipping, is almost always paralyzed by a veto from China, Russia, or the United States. Punishing undersea saboteurs is further complicated by the rules of jurisdiction. Only the country in which the ship is register
