orld", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5y4g6meekro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Europe targeted by spiralling campaign of sabotage - and Russia is the chief suspect\n- Published\nAs summer temperatures in Europe smashed records and many politicians shifted to holiday mode, Russia remained focused on its war.\nNot only did its military attacks across Ukraine intensify last month, becoming ever more deadly for civilians, Russia also appears to have escalated its sabotage campaign across Europe.\nThis time, military and defence sector sites were the prime target.\nA full month after drones packed with explosives were found at Leipzig's airport, used by Ukraine to transport military goods, Germany's interior minister has declared that \"Russia is responsible\".\nRussia's President Vladimir Putin is demanding proof, as always, and his officials call the accusation \"absurd\".\nBut the drones were just a dramatic start. August then brought a series of suspicious fires at defence facilities from Italy to Estonia.\nSome of the affected countries have already blamed Russia; others are still investigating and some fires may eventually be ruled accidental, exactly as such attacks are designed to seem.\nPoland's interior minister is clear.\n\"There are many, many signals that Russia is changing its strategy and intensifying its activities, including terrorist and sabotage activities,\" Marcin Kierwiński said, warning people to be on their guard.\n- Germany says Russia behind Leipzig airport drone attack \n  - Published2 days ago\nAugust campaign across Europe\n4 August Germany: The first drone at Leipzig airport is discovered.\n10 August Bulgaria: A major fire breaks out at a warehouse of defence firm EMCO in Tryavna. In a statement, the company recalled previous blasts at its facilities which were investigated for links to Russia. \"Human error is excluded,\" it said.\n13 August Italy: A fire at KNDS Ammo Italy outside Rome triggers a large explosion.\nThe local prosecutor is looking into possible outside interference, La Repubblica newspaper reports. Publicly, his office will only confirm that a case has been opened for negligent disaster against \"unknown persons\".\n15 August Estonia: The Milrem Robotics factory in Tallinn, which the Kyiv Post says supplies drones to Ukraine, goes up in flames. Two suspects are arrested.\nEstonian Prime Minister Kristen Michal says the possibility of Russian sabotage is being \"taking seriously\" by investigators.\n25 August Slovakia: Police announce they have averted an arson attack on a Ukrainian-owned drone manufacturer and seized a \"large amount of incendiary mixture\". The firm itself blames Russia and police arrest three suspects who they say were \"following orders\". Slovakia is Russia's close ally in Europe.\n30 August Poland: A country which is heavily targeted for sabotage reports two more fires.\nOne is in Lublin at a company which produces helicopter components. Prime Minister Donald Tusk said arson \"cannot be ruled out\".\nAn attack on the drone producer, WB Group, is clearer cut. A masked man is caught on CCTV throwing incendiary devices. Tusk calls it a \"continuation of Russia's escalatory activities\".\nThe pattern has continued into September with two Bulgarians arrested in Munich, Germany, for suspected arson after throwing incendiary devices from a car at defence firm Rhode & Schwartz.\nSeparately, police say they are hunting a climate extremist suspected of sabotage attacks this week on power substations in western Germany.\nWhy is this happening now?\nAttacks on military and defence targets are not new, although previous acts of sabotage linked to Russia include more puzzling targets - such as an Ikea store and a Polish paint store.\nThe novelty now is the concentration of cases.\n\"The intensity of military sites being attacked we've seen over the past couple of weeks is unusual,\" Daniel 希望がもたらされました。", "summary_en": "Two people have been rescued from a tunnel in Nepal over a week after flash flooding killed more than 1,300 people near the Nepal-Tibet border. Nepal's army continues search operations despite challenging conditions from mud and rocks. The rescues have renewed hope for families still searching for missing relatives.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/videos/cd79vp91321o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "'A rare moment of joy': Nepal tunnel rescues bring hope for more flood survivors\nTwo people have been rescued from a tunnel in Nepal more than a week after flash flooding hit the Nepal-Tibet border, killing more than 1,300 people.\nNepal's army is continuing its search for survivors, but mud and rocks are making rescue efforts difficult.\nThe BBC's South Asia correspondent Azadeh Moshiri, reporting from Nepal, describes how the rescues have given renewed hope to some families still waiting to find out what happened to missing relatives.\nRelated topics\n- NepalUpdates from your News topics will appear in My News and in a collection on the News homepage.", "translation_ja": "", "vocab": [{"word": "flash flooding", "definition": "短時間に大量の水が急速に流れ込む洪水現象。豪雨や堤防決壊により突発的に発生する。"}, {"word": "rescue efforts", "definition": "危機的状況にある人々を救助するための組織的な活動。困難な状況での救援活動を指す。"}, {"word": "renewed hope", "definition": "再び生まれた望みや期待。失われていた希望が新たに蘇ること。"}, {"word": "missing relatives", "definition": "行方不明となった家族や親戚。所在が不明で状況が分からない状態にある人々。"}, {"word": "correspondent", "definition": "特定の地域や分野で取材・報告を行うジャーナリスト。現地から情報を伝える報道関係者。"}]}, {"title_ja": "アルゼンチンの領土要求に対し、英国がフォークランド諸島への支持は「揺るがない」と再確認", "title_en": "UK reaffirms 'unwavering' support for Falkland Islands as Argentina restates claims", "summary_ja": "英国政府は、アルゼンチンのハビエル・ミレイ大統領が領土に対する主張を改めて述べ、同地域で事業を展開する石油企業に制裁を脅迫した後、フォークランド諸島への支持は「揺るがない」ことを改めて表明しました。ミレイ大統領は同諸島が「歴史的かつ法的に」アルゼンチン領であると主張していますが、2013年の国民投票では投票者の99.8%が英国領の海外領土として留まることを支持しました。英国軍は島の主権を守るため24時間態勢で待機しています。", "summary_en": "The UK government has reaffirmed its unwavering support for the Falkland Islands after Argentine President Javier Milei reiterated claims to the territory and threatened sanctions against oil companies operating in the region. Despite Milei's assertions that the islands are 'historically and legally' Argentine, the 2013 referendum showed 99.8% of islanders voted to remain a British overseas territory. Britain's armed forces remain on standby to defend the islands' sovereignty.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cn45jg3zlz4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK support for Falkland Islands 'unwavering' after Argentina restates claims, No 10 says\n- Published\nThe UK's position on the Falkland Islands is \"unwavering\", Downing Street has said after Argentina's president said the islands were \"historically and legally\" Argentinian.\nAndy Burnham \"fully supports the wishes of the islanders to remain a British overseas territory\", a Downing Street spokesperson said.\nJavier Milei said the \"winds of change\" favoured his country's claim to the islands and pledged sanctions on firms planning to exploit oil close to the islands.\nA British and Israeli partnership due to begin exploration work on the Sea Lion oilfield said it didn't expect recent developments to affect its work in the region.\n- Argentine leader threatens to sanction oil firms and reiterates Falklands claim \n  - Published15 hours ago\n- Falklands is a pressure point for the UK – and the US knows it \n  - Published24 April\nMore than 40 years after the war over the territory, sovereignty of the archipelago in the south-west Atlantic Ocean remains hotly disputed between Britain and Argentina.\nHowever in a 2013 referendum, residents of the islands voted overwhelmingly to remain a British overseas territory - with 99.8% voting in favour and just three voting against.\nWhen asked about if the prime minister believed the UK had the necessary forces to defend the sovereignty of the islands the spokesperson said \"they will remain so far as long as the islanders wish\".\n\"Our armed forces are on standby 24/7 to protect the UK and our interests\", the spokesperson added.\nAnnouncing his plan for sanctions in a national address on Thursday, Milei reiterated that the Falkland Islands were \"historically and legally\" Argentinian.\nHe said: \"There can be no argument. They are part of the Argentine territory.\n\"The islanders on their usurped territory do not have a legitimate right to self-determination and any argument on any such self-determination is invalid.\"\nMilei described the Sea Lion oilfield as a \"clear and present danger\", and said if Argentina does not act swiftly, \"they will have the material capacity to access the oil that lies underneath our sea – something that has never happened before.\"\nHe continued: \"The Falklands are our future, we need to recover these islands which are nationally relevant. There is no other path forward\".\nIt is not yet clear how or to what extent the sanctions will be imposed or tightened. In Argentina, a current law already allows for restrictions of activities of oil companies participating in projects considered unauthorised on the islands.\nTwo oil companies – Britain's Rockhopper Exploration and Israel's Navitas Petroleum – are due to begin extracting oil in the Sea Lion oilfield off the Falklands coast within two years, something Milei said Argentina could not allow.\nA joint statement from the two firms on Friday said it had the valid licences granted by the government of the Falkland Islands, \"and with the full support of the UK government.\"\nThe project is due to deliver its first oil in 2028, Rockhopper and Navitas said the partnerships' timetable would not be affected.\nThe Sea Lion oilfield, around 130 miles from the islands, contains an estimated 1.7 billion barrels of oil - described by Rockhopper as a field containing \"highly marketable crude\".\nMilei also announced plans for a naval base in Tierra del Fuego in the south of Argentina, saying Trump and the US were \"assessing their historical position in regard to the Falklands\", which Argentina refers to as Las Malvinas.\n\"That is not empty words as they understand that Argentina is a reliable partner and a valuable ally for decades to come,\" he said, describing the UK as a nation \"in decline\".\nOn Thursday, President Trump hinted the US would not help the UK in any future Falklands conflict because Britain \"had not been there to help me\" during his war with Iran.\nTrump's latest remarks on the islands come after he previously said the US position on the Falklands is one of many under review.\nOn Friday, Foreign Secretary Ed Miliband said the UK would \"resolutely uphold\" the self-determination of the islands.\nWriting on X on Friday, Miliband said the Islands would remain British as that is the \"overwhelming position of the islanders.\"\nDefence Secretary Wes Streeting also said Britain's commitment to the Falkland Islands was \"absolute and unshakeable\".\n\"Milei's statement overnight tells us more about domestic politics in Argentina than it does about the Falkland Islands,\" he wrote in his own post on X.\nIn an earlier statement, Downing Street said it was \"not the first time\" the Argentine government had made economic threats against the Falkland Islands.\n\"We are clear that the Falkland Islanders' right of self-determination extends to the right to exploit their own natural resources,\" it said.\nConservative Party leader Kemi Badenoch said \"Britain does not surrender to bullies\".\n\"If (Milei) wants a stronger Argentina, he should build its economy,", "translation_ja": "", "vocab": [{"word": "unwavering", "definition": "変わることのない、揺るがないという意味で、強い決意や信念が継続することを表します。政治や立場の堅固さを強調する際によく使われます。"}, {"word": "sovereignty", "definition": "主権、統治権という意味で、国家が領土や人民を支配・統治する最高権力を指します。国際紛争や領土問題の中心となる法律用語です。"}, {"word": "restate", "definition": "改めて述べる、再度表明するという意味で、既に言及したことをもう一度強調して言うことを表します。"}, {"word": "archipelago", "definition": "群島、列島という意味で、多数の島々が集まった地理的地域を指します。フォークランド諸島のような複数の島からなる領土を説明する際に使われます。"}, {"word": "sanction", "definition": "制裁、罰という意味で、国家や機関が政治的・経済的圧力を加える行為を指します。また同意・承認という意味もありますが、ここでは懲罰的措置を意味します。"}, {"word": "self-determination", "definition": "自決権、自己決定権という意味で、民族や人民が自らの将来を自由に決定する権利を表します。国際法の重要な原則です。"}]}, {"title_ja": "A66衝突事故後、ミドルズブラで警察不信と暴力が深刻化", "title_en": "Police Distrust and Gang Violence Grip Middlesbrough After A66 Crash", "summary_ja": "A66での致命的な衝突事故で警察官2人と若者5人が死亡した後、ミドルズブラの住民は警察への深い不信感と暴力の激化への恐怖を表明している。事件は組織犯罪に関する大規模な警察作戦を引き起こし、車への突入、放火、逮捕により地域全体が恐怖の雰囲気に包まれている。", "summary_en": "Following a fatal collision on the A66 that killed two police officers and five young men, Middlesbrough residents express deep distrust of police and fear of escalating gang violence. The incident has sparked a major police operation into organized crime, with vehicle rammings, fires, and arrests creating an atmosphere of intimidation in the community.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c2e0w2e0k0ro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'I'd rather die than ring the police': Distrust and fear in Middlesbrough after A66 crash\n- Published\nIt is just after 8pm in Grangetown, near Middlesbrough, and the light is fading.\nTwo teenagers in balaclavas tear across a park on a muddy red quad bike, pulling wheelies as they pass a man walking his dog.\nYounger boys, some not yet in their teens, gather excitedly around the bike.\nWe're here because Grangetown and neighbouring South Bank now find themselves at the centre of a large police operation, with fears organised crime is out of control after the deaths of two police officers and five young men in a car crash on the A66.\nSuddenly one of our team is hit by a pellet, which appears to have been fired from the group. It stings but he's OK.\nThen the quad riders pull over for a chat, engine running.\nI ask the riders if it is normal to be driving around the park on a quad bike.\n\"Yeah, this isn't any special day,\" the passenger says. \"You're born and bred and brought up with it. What do you expect? You don't know anything different.\"\nSince the crash, more than 20 people have been arrested in Middlesbrough and the surrounding area as part of a wider operation into what police have called \"serious and organised crime\".\nSources say there are two feuding gangs at the centre of a spike in violence.\nIs this area out of control, I ask the quad bike riders.\n\"No. Definitely not.\"\nThen they reveal something we repeatedly heard from young people here. They do not trust the police.\n\"They're saying there are gangs, but there are no gangs,\" the driver says. \"It's not London, mate. Do you know what I mean?\"\nLike many young people here, they blame the police for the deaths on the A66. The circumstances remain under independent investigation.\nWhat we do know is that on Saturday 22 August, a Volkswagen Passat that had been pursued by police travelled the wrong way along the A66 and collided head-on with a police vehicle.\nPC Matthew Blades, 37, and PC Tom Clough, 38, were killed. So were all five people in the Passat: Michael Cahill, 23, Jakub Matusiak, 23, Makai Saddington, 18, Theo Rae and Cole Worthy, both 17.\nFour of the five young men killed had amassed 30 convictions between them for offences including car theft, drug possession, assaulting police officers and driving offences. Cahill had no convictions.\nThe chain of events that ended on the A66 is believed to have begun eight miles away, in a quiet suburban street in Acklam.\nIt feels a world away from Grangetown. Hanging baskets and neat front gardens line the bay windows of 1930s semi-detached homes.\n- Disorder at balloon release unacceptable, says MP \n  - Published7 days ago\n- Who has been arrested in the wake of the A66 fatal crash? \n  - Published6 hours ago\n- Schools close early for A66 crash funeral \n  - Published2 hours ago\nMany residents are reluctant to speak. Why? Because of what happened to one house here that stands behind large metal barriers.\nA car was rammed into the bay window, exposing the room inside. Some of the other windows were also smashed.\nFragments of lights and bumper remain scattered across the driveway.\nThe home belongs to Cole Worthy's father, Gye Worthy, and the ramming happened on the same night Cole died.\nPolice say the car used in the attack was a Volvo XC60. The BBC understands that Cole Worthy and the four others then set off in the Passat to find the Volvo.\nNow neighbours describe a street living in fear and say the home has been targeted for more than a year.\nThere is no suggestion that Gye Worthy is involved in criminal activity.\nAll but one of the residents who speak to us do so on the condition of anonymity. They are worried that showing their faces could place them or their homes at risk.\nWhat message do the attacks send to people on this street, I ask one.\n\"Well, they should be scared, shouldn't they, that something's going to happen to their property if they say anything or get involved. So we don't.\"\nVictoria, who moved here several years ago, says the escalating violence cannot be separated from the wider condition of the town.\n\"This is a social problem, especially in this area. Teesside has been massively neglected and ignored,\" she says.\nThe attack in Acklam is far from Middlesbrough's only recent case of a vehicle being used as a weapon. Back in May, a tractor was driven into a house on Priory Road, and since the A66 crash Cleveland Police has investigated at least two further rammings.\nDetectives have also linked their wider investigation to a caravan fire on Attlee Road in Grangetown.\n\"It's getting worse,\" a nearby resident says. \"They're always balaclava-ed up as well, do you know what I mean?\"\nHe blames drugs.\n\"It can't be anything else. Why would you be like you are unless it was drugs?\" he says.\nWhether every incident is part of a single feud has not been established. But taken together, the rammings, fires and arrests have created a powerful sense that violence is being used to intimidate, punish and send messages.", "translation_ja": "", "vocab": [{"word": "amassed", "definition": "大量に集積する、蓄積するという意味。ここでは容疑者が多くの犯罪記録を集積したことを表現している。"}, {"word": "escalating", "definition": "段階的に拡大・悪化する、エスカレートするという意味。暴力や紛争が次第に激しくなることを表す。"}, {"word": "intimidate", "definition": "脅迫する、威圧するという意味。暴力やその脅威を使って他者を支配しようとする行為を指す。"}, {"word": "feuding", "definition": "対立する、激しく争っているという意味。ここでは二つのギャング集団が継続的な抗争状態にあることを表す。"}, {"word": "reluctant", "definition": "気が進まない、抵抗感がある、躊躇するという意味。ここでは住民が話をするのを渋っていることを示す。"}, {"word": "ramming", "definition": "車両を使って建物などに故意に衝突させる行為。暴力的な威嚇や報復手段として用いられる。"}]}, {"title_ja": "クリーブランド警察本部長、致命的な衝突後に資金不足を理由に警察を批判", "title_en": "Cleveland Police Chief Says Force 'Let Down' by Funding After Fatal Crash", "summary_ja": "クリーブランド警察本部長ビクトリア・フラー氏は、警察官7人を含む致命的なA66高速道路衝突事故後、部隊に誇りを持ちながらも資金不足を批判した。同警察は、イングランド・ウェールズで最も高い犯罪率に直面しながら、大都市警察の半分以下の職員で運営されている。フラー氏は、組織犯罪と同地域の複雑な社会経済的課題に対処するため、クリーブランド警察がより多くのリソースを持つ大規模警察に統合される必要があると述べた。", "summary_en": "Cleveland Police Chief Constable Victoria Fuller expressed pride in her officers but criticized insufficient funding following an A66 motorway crash that killed seven people, including two police officers. The force faces the highest crime rates in England and Wales while operating with less than half the officers of metropolitan forces. Fuller called for Cleveland Police to merge into a larger force with greater resources to address organized crime and the area's complex socioeconomic challenges.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqlw67ngpp1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Cleveland police chief proud of force but being 'let down' by funding\n- Published\nCleveland Police's Chief Constable has said she is proud of her \"brave\" force but that it was being \"let down\" by the way it was funded, following a fatal crash which killed seven people including two police officers.\nIn her first sit-down interview since the A66 crash, speaking exclusively to the BBC, Victoria Fuller said the force needed to become part of a larger force with greater resources.\nShe said her officers are dealing with some of the highest crime levels in the country akin to those faced by metropolitan forces, but with less than half the number of officers.\nMultiple people have since been arrested as part of a wider police operation against organised crime following the crash.\nA Volkswagen Passat carrying five young men drove the wrong way down the motorway near Middlesbrough in the early hours of the morning before colliding with a marked police car.\nOfficers had been pursuing the car for almost seven minutes after it was connected to earlier alleged criminal activity, but the pursuit was abandoned 10 seconds before the crash when the Passat turned on to the dual carriageway, the Independent Office for Police Conduct (IOPC) said.\nFuller, whose force covers an area of north-east England that includes Middlesbrough and Teesside, recalled being asleep when the duty commander rang her with the news.\n\"No matter how tragic and devastated you feel, we swing into action and we do what we need to do,\" she said.\nThe home secretary announced this week that Cleveland Police would be given an extra £2m to deal with the fallout from the crash, with 200 officers drafted in from elsewhere.\nFuller told the BBC on Friday that she was grateful for the support the force had been given, but added: \"I need that all the time.\"\nCleveland's Labour police and crime commissioner has previously said the force needed an extra £20m a year to hire more officers and crack down on organised crime.\nCleveland Police is grappling with the highest recorded crime rate of anywhere in England and Wales, Office for National Statistics (ONS) figures for the year to March show.\nAt the same time, Fuller said Cleveland Police had experienced the largest decrease in the number of officers since 2010 and was staffed as if it were a rural force.\n\"It absolutely needs to change,\" she said.\nFuller expressed hope that reform to policing across the country was on the horizon, and that Cleveland Police would become one of the \"big, strategic forces that have the resource, the flex and the capability to surge when they need to surge\".\nShe added: \"In the meantime, we need additional funding... to take us to that point.\"\nFuller denied that gangs had control over parts of Middlesbrough, describing it as a \"complex\" area to police, with high rates of school absence, drug addiction and mental health issues.\n\"We're doing the very, very best with what we've got - and we absolutely do need more.\"\nAuthorities say high deprivation and unemployment in the area are fueling organised crime.\n\"When young people have little aspiration or hope, who don't have confidence in the state, then unfortunately criminals exploit these people,\" Fuller said.\n\"They give confidence, and they give them hope, and they give them aspiration. And sadly what that means is young people doing things without thought of consequences.\"\nThe five who died in the Volkswagen on 22 August were aged between 17 and 23. Four of them had previous convictions, including for assaulting police officers and theft, Cleveland Police previously said.\nSince the crash, the force has responded to at least two incidents it believes are in retaliation for the crash.\nIt has also had to grapple with a house fire in Middlesbrough that killed a woman and her niece, and left several others injured, which police could not rule out was linked to organised crime.\nA 23-year-old man has been charged with murder in relation to the deaths of Natalie McDonald, 34, and Valentina Foster, seven.\nFuller also paid tribute to the two officers who died in the A66 crash - PC Matthew Blades and PC Tom Clough.\n\"My heart goes out to their families - it really does,\" she said. \"My grief can't compare to theirs, nor to the officers and staff who've worked closely with Matty and Tom for a long time.\"\nThe Home Office said it was grateful to Cleveland Police for delivering a robust response in difficult circumstances.\nA spokesperson said: \"We have been in regular contact with Cleveland Police and local leaders, ensuring they have the support they need and engaging on their financial concerns.\n\"This additional £2m targeted funding will help Cleveland Police tackle serious crime. Beyond this, the force will receive up to £197.8m in funding in the 2026/2027 financial year - a 3.7% uplift in cash.\n\"We have also committed to a wider review of the police funding formula to ensure that force funding is fair and responsive to local needs.\"", "translation_ja": "", "vocab": [{"word": "fallout", "definition": "ある事件や行動の悪影響や結果。ここでは、衝突事故による警察と社会への悪影響を意味する。"}, {"word": "grappling", "definition": "難しい問題に対処しようとしている状態。ここでは、警察が高い犯罪率という課題に対抗している様子を表す。"}, {"word": "deprivation", "definition": "基本的な物質的便宜や生活の質に欠けている状態。社会経済的な貧困や不足を指す。"}, {"word": "surge", "definition": "急激な増加や急騰。ここでは、警察が必要に応じて対応能力を素早く拡大することを意味する。"}, {"word": "retaliation", "definition": "相手の行為に対する報復や復讐。犯罪集団による警察への報復行為を指す。"}, {"word": "aspiration", "definition": "将来への希望や目標達成への強い願い。ここでは若者が犯罪に引き込まれる理由と対比される概念。"}]}, {"title_ja": "ファラージ：公約実現のため上院と司法制度の大改革を脅迫", "title_en": "Farage Threatens Lords and Judiciary Overhaul to Deliver Reform Pledges", "summary_ja": "ナイジェル・ファラージ率いる改革UK政党は、小型ボートの横断阻止とエネルギー代金削減を含む公約を実現するため、上院の再編成や裁判官任免制度の変更さえも辞さないと述べた。演説は選挙法回避疑惑を巡る寄付金スキャンダルの影で開催され、ファラージはこれを『気ままなパブでの会話』と一蹴した。彼は100日以内に成果を出さない大臣を解雇すると誓い、2027年春に総選挙を呼び出すと予測した。", "summary_en": "Nigel Farage vowed that a Reform UK government would overcome obstacles to its agenda, including stopping small boat crossings and cutting energy bills, even if it means restructuring the House of Lords and changing how judges are appointed. His speech was overshadowed by a donations scandal involving allegations of circumventing electoral law, which Farage dismissed as 'loose pub talk'. Farage pledged to sack underperforming ministers within 100 days and predicted calling an early general election in spring 2027.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyeq5jvd2po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Farage threatens to overhaul Lords and judges to meet his pledges\n- Published\nNigel Farage has insisted a Reform UK government would deliver where other parties have failed, as he set out his priorities in his annual conference speech.\nHe said Reform's pledges for its first 100 days in power would include stopping small boat crossings, cutting energy bills by £250 a year and ending the net zero \"lunacy\".\nTo eliminate \"obstacles\" to his plans, Farage said he would declare a \"national emergency\" and threatened to overhaul the House of Lords and how judges are appointed if they stood in the way.\nIn a speech interrupted several times by protesters, the Reform leader was also forced to address allegations over donations which emerged in an undercover investigation.\nReform had been hoping to use its annual conference to regain momentum after a difficult summer dominated by questions over the party's finances.\nHowever, the main day of the conference was overshadowed after two senior party officials stepped down and Reform launched an investigation into claims about funding aired during a Channel 4 News report on Thursday evening, which was filmed by Verbatim Investigations, a group founded by journalists from the Centre for Climate Reporting.\nIn the undercover filming, the two men suggested a way around electoral law to secure foreign donations for the party, one of which would have totalled £500,000.\nFarage insisted \"the party has done nothing wrong\" and \"has taken no illegal money\", claiming the allegations had been made \"because they're scared of us\".\n- Farage says his aides' donor comments were 'loose pub talk' \n  - Published6 hours ago\n- Reform donations row overshadows party's moment to lay out big ideas \n  - Published4 hours ago\n- Reform UK promises £80bn cuts to public spending \n  - Published1 day ago\nIn his speech, which was light on new policy announcements, Farage said the country needed a government \"that actually delivers on its promises\" and \"we're the only people capable of doing it\".\nHe argued the Tories \"had 14 years in power and failed absolutely miserably\", while Labour's new Prime Minister Andy Burnham \"says he needs 10 years\", a reference to the PM's promise to set out a 10-year plan for the country later this year.\nIf Reform wins the next general election, Farage pledged to sack ministers who fail to deliver on their promises in their first 100 days in the job \"and replace them with somebody else with the courage to do it\".\nSetting out his plans to call a \"national emergency\" if Reform wins power, Farage said: \"Parliament will sit, if necessary, for 24 hours a day, for six days a week until we pass the necessary legislation.\"\nHe said he expected the House of Lords to \"honour\" Reform's policy pledges but if they refused to do so threatened to appoint hundreds of new peers so the party had a majority in the upper chamber.\n\"And if that proves difficult, we will hold a referendum on the current composition of the House of Lords, and they would be swept away by a British public appalled by them,\" he added.\nIdentifying the judiciary as another possible \"obstacle\", Farage promised to remove the ability of judges to rely on conventions like the European Convention of Human Rights (ECHR), which critics blame for hindering some deportations.\n\"We don't want the courts striking down, do we, the will of the people,\" he said.\n\"Parliament makes the law, judges interpret the law. We will do whatever it takes, and perhaps have to consider how judicial appointments work in the future.\"\nMeanwhile, he said civil servants who \"try to obstruct us\" would be removed from their posts and replaced by people from the world of business.\n\"I'm tired of being told what can't be done,\" the Reform leader said.\n\"That is not what the public want. The public want action, the public want genuine change, the public do not want any more of the same. And our attitude is can do, and will do.\"\nPredicting that Burnham would call an early general election in spring 2027, Farage attempted to use his speech to convince the public Reform was ready to govern.\nStressing he now had a team of spokespeople with \"frontline experience\", he said the party was planning to broaden its expertise.\n\"There are more big jobs to fill, and I'm looking and working on defence, health, and the other areas,\" he added.\nIn his speech, Farage also hailed a \"historic agreement\" on small boat returns, signed earlier between Reform and France's hard-right National Rally party.\nThe deal sets out how a Reform government would intercept boats in the English Channel and return them to France using the Navy, with France \"ordinarily\" accepting those on board.\nIt was signed by the National Rally President Jordan Bardella, whose party is currently leading in opinion polls ahead of French presidential elections in April next year, after he gave a speech to the main conference hall.\nFarage took to the stage after a long delay, which he told delegates was due to a \"security a", "translation_ja": "", "vocab": [{"word": "overhaul", "definition": "大規模な改革や改造を行うこと。組織や制度を根本的に改め直すことを意味します。"}, {"word": "obstruct", "definition": "妨害する、阻止する。何かの進行や目的達成を邪魔することを指します。"}, {"word": "judiciary", "definition": "司法制度、判事団の総称。裁判所や裁判官から構成される司法機関全体を意味します。"}, {"word": "circumvent", "definition": "規則や法律を巧妙に回避する。正面からではなく、裏道を使って障害を避けることです。"}, {"word": "electoral", "definition": "選挙に関連する。選挙制度や選挙プロセスに係わる形容詞です。"}, {"word": "convention", "definition": "国際条約や慣例的な規則。法的な基準や通例として認識されている取り決めを意味します。"}]}, {"title_ja": "マルタの実業家がジャーナリスト殺害事件で無罪判決　国民の怒り広がる", "title_en": "Maltese Tycoon Acquitted in Journalist Murder Case Sparks Outrage", "summary_ja": "マルタの実業家ヨルゲン・フェネックが2017年の調査報道記者ダフネ・カルアナ・ガリツィア殺害事件の指示容疑で無罪判決を受けた。検察は彼が動機を持っていたと主張したが、陪審員は有罪の証拠不十分と判断した。判決は国内で大きな怒りを呼び起こし、マルタの制度的失敗とメディア保護に関する問題が浮き彫りになった。", "summary_en": "Yorgen Fenech, a 44-year-old Maltese businessman, was acquitted of ordering the 2017 murder of investigative journalist Daphne Caruana Galizia, despite prosecution arguments that he had a motive. The verdict has sparked public outrage and raised questions about institutional failures and media protection in Malta, with the family criticizing the jury's decision as contradicting all evidence.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/outrage-as-maltese-tycoon-acquitted-in-journalist-s-murder/a-79027008?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Outrage as Maltese tycoon acquitted in journalist's murder\nSeptember 4, 2026\n\"Murderer!\" — \"Scum!\" — \"Mafia!\"\nAs Yorgen Fenech left the courthouse in Valletta on Wednesday evening, he was confronted by the furious crowd outside. The 44-year-old Maltese businessman pushed through, flanked by his security guards. Just minutes earlier, a jury had acquitted him of ordering the murder of the 53-year-old investigative journalist Daphne Caruana Galizia.\nThe verdict came as a shock to her family. Her son, Matthew Caruana Galizia, said it was a \"terrible decision by the jurors that our country may never recover from.\" He later doubled down on his criticism, describing the verdict in a post on Facebook as \"obscene\" and saying: \"Their decision flies in the face of all evidence, of all logic, of the truth.\"\nAlmost nine years after Caruana Galizia's murder, Malta is again confronted with the crucial question: Who was responsible for her death on October 16, 2017? The men who procured the bomb, placed it under the driver's seat and detonated it remotely have already been convicted. But the person who contracted them to do it has still not been legally identified.\nA difficult trial\nFor years, Fenech was considered to be the central figure in the investigations. His arrest on the morning of November 20, 2019, was like something out of a movie. His luxury yacht, Gio, had just left harbor when it was stopped by a Maltese military patrol boat. Fenech was arrested on board and subsequently interrogated by the police.\nFenech's arrest, and suspicion that people in government circles were involved in the crime, sparked protests all across the country. Joseph Muscat, prime minister at the time, was accused of protecting political allies and stepped down in January 2020. Fenech spent more than five years in detention before being released on bail, under strict conditions, in early 2025.\nHis trial only began this summer, and the final verdict was decisive. Eight of the nine jurors rejected the prosecution's argument that it was Fenech who had ordered the journalist's murder.\nWho was responsible?\nThe prosecution case relied above all on the testimony of Melvin Theuma, who confessed to being the middleman and testified that Fenech had contracted him to organize the murder. Theuma received a pardon in exchange for his cooperation.\nBut Fenech's defense called Theuma's credibility into question, highlighting contradictions in his testimony and false statements he had made previously.\nFenech's lawyers also sought to prove that evidence pointing to Keith Schembri, chief of staff to Muscat at the time, was not properly followed up. Schembri has denied any involvement in the murder, and the investigators did not charge him as a suspect in this case.\nThe public prosecutors' argument was that Caruana Galizia had been investigating Fenech, specifically his company 17 Black and the energy consortium ElectroGas, on suspicion of corruption. This, they said, meant Fenech had a motive for silencing her. She had not, however, been on the point of publishing anything that could have threatened him.\nOpen questions\nMany in Malta are outraged by the not-guilty verdict. But there is no indication to date that Fenech did not receive a fair trial, or that the process was manipulated. For him to be convicted, Fenech's guilt had to be proved beyond reasonable doubt.\nCaruana Galizia's family are therefore also focusing on institutional failures that they believe facilitated the murder. They complain that these have not been addressed, and necessary reforms not implemented. An official investigation already established, in 2021, that an \"atmosphere of impunity\" in Malta created conditions that made the murder possible.\nReforms in Malta\nSince then, Malta has made progress with a series of reforms, but many say they do not go far enough. This is especially the case with regard to press freedom. In 2021, the committee of inquiry recommended that journalists be better protected against political and economic pressure and their role institutionally strengthened, yet the country is still waiting for comprehensive media reform.\nFollowing years of discussion and a public consultation, the Maltese government brought the relevant bill before parliament in March 2026, but the legislation was not passed before early parliamentary elections in May.\nIn its latest Rule of Law Report, the European Commission only certifies limited progress made by Malta. It acknowledges that it has introduced some specific protection measures for journalists, but says core recommendations from the investigation into the murder of Daphne Caruana Galizia remain unfulfilled.\nGovernment sees progress\nBut the government paints a different picture. It has highlighted changes to the judiciary and anti-corruption measures, as well as better protection of journalistic sources, and additional measures to protect media professionals. This is what the EU Commission referred to as progress in specific area", "translation_ja": "", "vocab": [{"word": "acquitted", "definition": "無罪判決を受けたという意味の法律用語。裁判で有罪ではないと判定されることを示します。"}, {"word": "motive", "definition": "犯罪や行動を起こす理由や動機を指します。法的文脈では犯人が犯行に及んだ根本的な理由を意味します。"}, {"word": "credibility", "definition": "信頼性や信用度を示す名詞。証人の証言の信ぴょう性が問題となる法廷では特に重要な概念です。"}, {"word": "prosecution", "definition": "検察側または起訴側を指す法律用語。犯人を有罪にするために証拠を提示する側です。"}, {"word": "institutional", "definition": "制度的な、組織的なという意味の形容詞。政府や公的機関の体制や構造に関連した事項を表します。"}, {"word": "impunity", "definition": "罰を受けないこと、不処罰を意味します。悪事が罰せられない状態を指す法的概念です。"}]}, {"title_ja": "イエメン：フーシ派による西部での攻勢の中で戦闘が激化", "title_en": "Yemen: Fighting intensifies amid Houthi push in the west", "summary_ja": "イランが支援するフーシ派は木曜日にサウジアラビア主導の連合軍に対する地上攻撃を開始し、双方が数十人の死傷者を出した。この民兵勢力は紅海へのバブエルマンデブ海峡の支配権確保を目指しており、交渉における立場を強化しようとしている。戦闘の激化は7月の地域的緊張以来、比較的静かな状態から勃発した。", "summary_en": "The Iran-backed Houthis launched a ground offensive against Saudi-led coalition forces in Yemen on Thursday, with both sides sustaining dozens of casualties. The militia is attempting to seize control of the Bab el-Mandeb Strait gateway to the Red Sea to strengthen their negotiating position. The intensified fighting follows a period of comparative calm that broke down in July amid regional tensions.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/yemen-fighting-intensifies-amid-houthi-push-in-the-west/a-79039588?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Yemen: Fighting intensifies amid Houthi push in the west\nSeptember 4, 2026\nBoth sides in Yemen's long-running civil war have sustained losses in a new push from the Houthi militia to try to seize control of the gateway to the Red Sea in the west.\nThe Iran-backed Houthis, who control the capital Sanaa and much of the country, launched a ground offensive against the Saudi Arabia-led coalition supporting Yemen's government-in-exile on Thursday.\nNo casualty numbers were formally announced but news agencies citing sources off the record concurred that both sides had sustained dozens of losses, as well as civilians who were killed amid the fighting. The AFP news agency tallied 129 deaths as of Friday.\nOfficials also reported shelling and artillery fire forcing hundreds of families to flee from a pair of coastal cities, Hodeidah and Mokha, one held by either side in the conflict.\nWhy are the Houthis pushing to control this territory now?\nYemen has been in a state of civil war for almost exactly 12 years, and a period of comparative calm broke down this July amid the war with Iran in the Gulf.\nThe Houthis are targeting ports and elevated terrain held by Saudi-led forces that would improve their control of the Bab el-Mandeb Strait, where the Red Sea meets the Gulf of Aden, leading out into the Arabian Sea and open waters.\nAlways a crucial waterway, its significance has increased amid the restrictions to traffic through the Strait of Hormuz.\nThe Houthis declared a blockade on ships approaching the west coast of Saudi Arabia, with access to its eastern ports already impeded via Hormuz. But they are not ideally placed or equipped to enforce their stated desire.\nNevertheless they have already fired on several commercial vessels, causing severe damage and deaths in a few cases, even with their imperfect control of the relevant coastline.\nWhat do we know about the intensified fighting?\nMilitary sources speaking off the record told both the DPA and AFP news agencies that both sides had sustained multiple casualties. DPA put the figure in the dozens on both sides, AFP had a more precise estimate of roughly 60 on either side.\nExchanges of fire, on land as well as using rockets and drones, were reported in two southwestern provinces, Taiz and Hodeidah.\nThe Houthis control the major western port of Hodeidah further north, but large chunks of Yemen's southwestern tip in Taiz including the port of Mokha near the strait are controlled by Saudi-led forces.\n\"They are going for Bab al-Mandeb,\" Mohammed al-Basha of the US-based risk advisory Basha Report told the AFP news agency.\nFighting for the high ground, for instance on Mount al-Numan overlooking Mokha, was particularly fierce.\n\"The Houthis feel that if they capture Bab al-Mandab or Mokha port they will be in a better position of power to negotiate with the government and the Saudis,\" al-Basha said.\nEdited by: Zac Crellin\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "offensive", "definition": "攻撃的な軍事作戦のこと。戦争や紛争において、敵を攻撃する目的で行われる大規模な軍事行動を指します。"}, {"word": "blockade", "definition": "港湾や地域への物資や人員の流入を阻止する軍事的または政治的な封鎖のこと。商船などの通行を制限する戦術です。"}, {"word": "impede", "definition": "進行を妨げる、阻害するという意味の動詞。何かが目的地に到達することを遅くしたり困難にしたりします。"}, {"word": "strategic", "definition": "長期的な目標達成のための計画や戦略に関連する形容詞。軍事的、政治的、経済的な重要な位置置や行動を指します。"}, {"word": "comparative", "definition": "比較に基づいた、相対的なという意味の形容詞。ある時期や状況が他と比べてどうであるかを表す際に使用します。"}, {"word": "negotiate", "definition": "交渉する、話し合いをするという意味の動詞。異なる立場の者同士が合意に達するために協議することです。"}]}, {"title_ja": "ザクセン=アンハルト州：小政党がキャスティングボートを握る", "title_en": "Saxony-Anhalt: Small parties will be the kingmakers", "summary_ja": "2026年9月6日のドイツ東部の州選挙では、極右政党AfDが40%以上の支持を集め、戦後初の極右州政府樹立の可能性がある。しかし、5%の議席獲得基準に届かないリスクを抱える小政党（SPD、緑の党、FDP、BSW）の運命が、AfDが単独統治できるか、複雑な連立が必要かを決めることになる。", "summary_en": "In a historic German state election on September 6, 2026, the far-right AfD party is polling over 40% and could form the first far-right state government in post-WWII Germany. However, the fates of smaller parties like the SPD, Greens, FDP, and BSW—which risk failing to reach the 5% threshold—will determine whether the AfD can govern alone or face a complicated coalition scenario.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/saxony-anhalt-small-parties-will-be-the-kingmakers/a-78482460?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Saxony-Anhalt: Small parties will be the kingmakers\nSeptember 4, 2026\nIt's rare that a state parliament election in Germany attracts as much media interest as this one in Saxony-Anhalt. On September 6, 2026, the 1.7 million eligible voters in the eastern German state will decide whether the far-right Alternative for Germany (AfD) party can form a state government for the first time.\nSo far, there has not been a head of government who belonged to a proven far-right party in post-World War II Germany — at neither federal nor state level. That would change if AfD lead candidate Ulrich Siegmund were to be elected to this position, since the Office for the Protection of the Constitution in Saxony Anhalt already classified the AfD as such in 2023.\nSiegmund's chances of a historical triumph are high: For months the AfD has been comfortably leading the polls with well over 40% of the vote.\nAfD, CDU and Left Party will get into parliament\nAside from the AfD, there are only two other parties who can count on being included in the next state parliament: The conservative Christian Democratic Union (CDU) of current State Premier Sven Schulze and the socialist Left Party, which is traditionally strong in eastern Germany, the former socialist GDR.\nAll other parties have cause for concern they could fail to reach the 5% threshold of votes necessary for entry into parliaments in Germany.\nThis even applies to the center-left Social Democrats (SPD), who currently form part of the federal government coalition with the CDU and its Bavarian counterpart, the Christian Social Union (CSU).\nSPD, Greens, FDP, BSW might not make the 5% mark\nThe SPD is losing popularity nationwide. In Saxony-Anhalt, they are polling below the 8% they won five years ago.\nThe third party in Saxony-Anhalt's current governing coalition, formed in 2021, has even fewer hopes: The neoliberal Free Democrats (FDP) are polling only about 3%. Following the FDP's failure in the Bundestag general election of 2025 and multiple defeats at the state level, supporters are bracing themselves for the next setback.\nThe environmentalist Greens are also concerned about returning to the state parliament. The party, whose core voter base is in wealthy western German cities, is vehemently rejected by many voters in rural areas because of its climate policies and multicultural vision of society.\nConcern over Sahra Wagenknecht Alliance (BSW)\nAnd then there is the Sahra Wagenknecht Alliance (BSW), founded in 2024 by its namesake, a former Left Party co-leader. The party is economically left-leaning, but socially right-wing conservative and populist. This is its first time participating in a state election in Saxony-Anhalt.\nAfter the BSW gained 6.2% of the vote in the European parliament elections in 2024 and won results of between about 12% and 16% in the eastern German states of Brandenburg, Saxony and Thuringia during its first year, it failed by only a few thousand votes to reach the 5% hurdle to enter German parliament in the 2025 general election.\nThe BSW never really recovered from this setback. They went on to be defeated in three further state parliament elections. The party also has cause for concern in Saxony-Anhalt, where it has been polling under 5%.\nShould it win representation after all, Sahra Wagenknecht has already announced that her party's lawmakers would not vote an AfD premier into office, but abstain from the vote paving the way for him to win a majority in parliament and take office.\nConsidering the poor polling numbers for the BSW in Saxony-Anhalt, political scientist Oliver Lembcke speaks of an \"endgame\" for the party as a whole.\nSmall parties could prevent absolute majority for the AfD\nThe fact is: The more parties fail to reach the threshold, the higher the likelihood of the Alternative for Germany will be able to govern alone.\nOn the other hand, if aside from the AfD, the CDU, Left Party and SPD win representation in the next Saxony-Anhalt parliament, and those three parties together hold more seats than the AfD, the situation is complicated. This is because in 2018 the CDU adopted a so-called \"resolution of incompatibility,\" which rejects cooperation with both the AfD and the Left Party.\nIf the CDU sticks to this, forming even a minority government would be very difficult, perhaps impossible.\nCould the CDU form a minority government?\nPolitical scientist Lembcke from Ruhr University Bochum in the state of North Rhine-Westphalia argues that the CDU should have adapted its incompatibility resolution to the changed conditions of the party systems and political landscape. Because it has failed to do so, this issue could now escalate drastically in Saxony-Anhalt.\nThe Left Party is prepared to support Premier Sven Schulze of the CDU to secure a second term.\n\"In recent years, we, the Left Party, have shown that we take responsibility for this country. Especially when it comes to inhibiting the AfD,\" Left Party co-leader Luigi Pantisano told television broadcas", "translation_ja": "", "vocab": [{"word": "threshold", "definition": "議論や投票などで結果を決定するために必要な最小限の数値や基準。ここではドイツの政党が議会入りするために必要な5%の得票率を指す。"}, {"word": "incompatibility resolution", "definition": "特定の政党との協力を拒否する公式な決定。CDUが2018年にAfDと左翼党との協力を拒否するために採択した方針のこと。"}, {"word": "kingmaker", "definition": "直接的な権力は持たないが、その支持によって誰が権力を握るかを決める立場にある者や団体のこと。"}, {"word": "neoliberal", "definition": "市場経済と個人の自由を強調し、政府の規制を最小化する経済・政治思想。FDPなどの政党を表現するのに使われる。"}, {"word": "populist", "definition": "一般大衆の利益を標榜しながら、既得権層への対抗姿勢を示す政治スタイルや政治家のこと。"}, {"word": "escalate", "definition": "紛争や問題が段階的に悪化または拡大すること。政治的緊張が高まる場合に使われる。"}, {"word": "abstain", "definition": "投票や決定の際に、投票権を行使せず中立的な立場を取ること。"}]}, {"title_ja": "リンゼイ・クランシー裁判が不公正な裁判と宣告—次はどうなる？", "title_en": "Lindsay Clancy Trial Declared Mistrial: What Happens Next", "summary_ja": "陪審団が評決に達することができず、リンゼイ・クランシー裁判が不公正な裁判と宣告されました。本件は再審または他の法的手続きに直面する可能性があります。検察と弁護側チームが司法プロセスの次のステップを決定します。", "summary_en": "The Lindsay Clancy trial has been declared a mistrial after the jury failed to reach a verdict. The case now faces potential retrial or other legal proceedings. Prosecutors and defense teams will determine the next steps in the judicial process.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/News/lindsay-clancy-jury-deadlocked/story?id=136153308", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、世界中で起きているニュースと生中継イベントを24時間体制でカバーしています。政治、ビジネス、健康、国際問題など主要なニュースについて、最新の報道を提供しています。視聴者は昼夜を問わずライブストリーミングと速報アラートにアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events as they happen around the world. The platform delivers up-to-date reporting on major stories, including politics, business, health, and international affairs. Viewers can access live streams and breaking news alerts throughout the day and night.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防総省、新しいテストステロン検査ガイドラインを一時的に撤回", "title_en": "Pentagon Temporarily Rescinds New Testosterone Screening Guidelines", "summary_ja": "国防総省は、新しいテストステロン検査ガイダンスを公開してからわずか1日で一時的に撤回しました。ガイドラインの即座の引き戻しは、その実施に関する懸念や論争の存在を示唆しています。当局はまだ決定の逆転に関する詳細な説明を提供していません。", "summary_en": "The Pentagon has temporarily rescinded its newly released guidance on testosterone screening just one day after its public announcement. The decision to pull back the guidelines suggests potential concerns or controversy surrounding the implementation. Officials have not yet provided detailed explanations for the immediate reversal.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/pentagon-temporarily-rescinds-new-testosterone-guidelines/story?id=136205208", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国連、メルカトル図法を廃止しアフリカの実際の大きさを示す新しい世界地図を採択", "title_en": "UN Votes to Replace Mercator Map with Equal Earth Projection to Show Africa's True Scale", "summary_ja": "国連総会は164対1の投票により、16世紀のメルカトル図法を2018年の「Equal Earth図法」に置き換えることを決定しました。メルカトル図法は赤道付近の地域を実際より小さく、北半球の国々をより大きく表示することで、アフリカの認識を歪めてきました。国連決議は拘束力を持ちませんが、世界中の教育課程と技術プラットフォームに影響を与えることが期待されています。", "summary_en": "The UN General Assembly voted 164-1 to phase out the 16th-century Mercator map projection in favor of the more accurate 2018 Equal Earth design, which better represents Africa's actual size. The Mercator projection has historically distorted perceptions by making equatorial regions appear smaller and northern hemisphere nations larger, a phenomenon critics describe as 'cartographic colonialism.' While UN resolutions are non-binding, the change is expected to influence classroom curriculums and technology platforms globally.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/04/un-vote-world-map-mercator-equal-earth-africa", "state_media": false, "category": "政治", "full_text": "The United Nations has voted to adopt a resolution for the world to formally phase out the traditional Mercator map of the globe in favour of one that more accurately displays Africa’s size.\nIn a session at its headquarters in New York, the UN general assembly officially retired the 16th-century Mercator projection in favour of one based on the more accurate 2018 Equal Earth design.\nAt the session, 164 countries voted in favour of the resolution. Only the US voted no, with its representative saying the resolution was “superfluous”. There were six abstentions.\nUN resolutions are non-enforceable, so countries and institutions will not be mandated to use only the new projection or forbidden from using the old one. However, the outcome is expected to result in an update of classroom curriculums and everyday technology given the wide usage of the Mercator projection in education, technology and governance.\nTogo, which spearheaded a campaign for the resolution on behalf of the African Union, said the resolution “recognises and affirms that disproportionate cartographic representations, particularly those resulting from the Mercator projection, have had lasting cognitive, educational, cultural, geopolitical and socioeconomic effects, contributing to a drastic reduction in the perceived size of Africa and other regions of the world in the global collective imagination”.\nSpeaking before the resolution passed, Robert Dussey, Togo’s foreign affairs minister, said: “This discussion is not a political discussion [but] a scientific discussion, because there is scientific proof so we all have to accept the reality.”\nThe Mercator layout was introduced by the Flemish cartographer Gerardus Mercator in 1569 to help sailors navigate the seas. Almost five centuries later, it remains the global standard.\nBecause of its projection style, however, regions near the equator appear significantly smaller than they are, whereas high-latitude areas look much larger. For example, the map shows Africa as being similar in size to Greenland, but the continent is 14 times larger than the Danish territory.\n“You could fit the United States, China, India, Japan, Mexico and much of Europe into Africa and still have land to spare,” says a petition on Change.org for the #CorrectTheMap campaign, which has more than 11,000 signatures. The African Union endorsed the campaign in August 2025 and then asked Togo to spearhead its adoption.\nOn Friday, before the vote, France’s foreign minister spoke in support of the resolution. “[We] will abandon the Mercator projection in favour of map representations tailored to specific uses, more faithful to actual surface areas and in line with the recommendations of cartographers and scientists,” Jean-Noël Barrot said during a speech at the Sorbonne University in Paris, in a move seen as part of France’s push to increase goodwill among its former colonies. France will now use the Eckert IV projection, which is close to the Equal Earth projection recommended in the resolution.\nHistorians and geographers have said for years that the Mercator projection is rooted in western stereotypes. Activists have echoed this, with some coining the term “cartographic colonialism”.\nSome argue that the map has subtly shaped international power dynamics by minimising the physical presence of the global south and visually inflating northern hemisphere nations while shrinking equatorial regions. This is said to have reinforced systemic biases in international trade, development priorities and educational frameworks.\nOne of the Mercator projection’s most prominent critics was Arno Peters, a German historian, who launched the Peters world map based on the Gall–Peters projection in 1973. It has often been used as an alternative to the Mercator map.\nTogo’s #CorrectTheMap campaign promoted the use of the 2018 Equal Earth design, which was developed by an international team of cartographers. Supporters say it will help to reverse perceptions of Africa and decolonise global curriculums.\nSome analysts agree. JJ Enoch, a London-based senior associate at JS Held, a geopolitical risk advisory firm, said the Mercator projection visually diminished Africa’s true scale. He linked the campaign to a quest by African nations for “greater influence in global institutions and greater control over how the continent is represented”.\nHe said: “Adopting an equal-area map … would provide a more accurate basis for education and public understanding, while signalling that Africa’s demographic, economic and geopolitical importance should no longer be viewed through inherited and distorted conventions.”\nTogo’s government is planning an event in Lomé, the Togolese capital, with Unesco, the African Union and tech brands such as Google Maps during the first quarter of next year to map out the implementation of the resolution.\nSpeaking before the vote, Dussey said: “To those who say why now, I say: why not? When we look at the world map … it is time for us to change ", "translation_ja": "", "vocab": [{"word": "projection", "definition": "地図上で三次元の地球を二次元の平面に表現する方法。メルカトル図法やEqual Earth図法など複数の種類がある。"}, {"word": "cartographic", "definition": "地図製作に関する。cartographic colonialismは地図の歪みを通じた支配という意味。"}, {"word": "distorted", "definition": "本来の形や事実と異なるように変形させられた、または歪められた状態を指す。"}, {"word": "equatorial", "definition": "赤道周辺の、または赤道に関する。地理的には熱帯地域を意味することが多い。"}, {"word": "spearhead", "definition": "計画や活動の先頭に立つ、主導する。リーダーシップを持って進める。"}, {"word": "non-binding", "definition": "法的な拘束力や強制力を持たない。従う義務がない決定や決議を意味する。"}]}, {"title_ja": "スペイン首相、セウタ国境侵犯にモロッコの計画的関与を否定", "title_en": "Spain's PM denies Morocco planned Ceuta border breach despite police report", "summary_ja": "スペインのペドロ・サンチェス首相は議会で、警察報告書の主張にもかかわらず、スペインはセウタへの大規模国境越えをモロッコが計画または支援したことを示す証拠を発見していないと述べた。サンチェス首相はモロッコの移民送還への協力を擁護し、欧州の連帯を呼びかけたが、危機への対応について野党からの批判に直面している。", "summary_en": "Spanish Prime Minister Pedro Sánchez told parliament that Spain has found no evidence Morocco planned or facilitated the mass border crossing into Ceuta in July, despite a police report suggesting otherwise. Sánchez defended Morocco's cooperation in returning migrants and called for European solidarity, while facing criticism from opposition parties over his handling of the crisis that left thousands stranded.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/03/spain-pm-evidence-morocco-ceuta-border-breach", "state_media": false, "category": "政治", "full_text": "Spain has seen no evidence “whatsoever” that Morocco planned or facilitated a mass border breach into its north African territory of Ceuta, the Spanish prime minister, Pedro Sánchez, has told parliament.\nThe address on Thursday followed the emergence of a police report, commissioned by a judge and widely quoted in the media, claiming Moroccan border forces had actively aided about 70,000 people to cross the border in late July.\n“I can assure you that no institution – not the diplomatic service, nor the European Commission, nor any international body – has provided the Spanish government with any solid evidence that Morocco planned or carried out the incident. None whatsoever,” Sánchez told parliament.\nSpeaking the morning after about 50,000 people marched in Madrid to protest his handling of the Ceuta crisis, the socialist prime minister also denied the government had received any warning of the mass breach, saying no reports to authorities had anticipated “the scale or probability of what eventually happened”.\nSánchez has repeatedly defended Morocco during the crisis, highlighting Rabat’s cooperation in returning most of the migrants in the days after the surge.\nBut he said on Thursday that Spain had summoned Morocco’s ambassador on 21 August because of “unacceptable statements” made by two ministers over Ceuta and Melilla, another Spanish north African territory. Last month, Morocco’s justice minister, Abdellatif Ouahbi, publicly reiterated Rabat’s sovereignty claims over the cities.\nSánchez said he had “for now” ruled out Moroccan government involvement but conceded that Moroccan forces had allowed crossings to occur during a key 10-hour period on 30 July.\nMany of those who crossed said in interviews they had been actively encouraged to do so. Moroccan officials have denied enabling the crossing.\nAlberto Núñez Feijóo, the leader of the conservative People’s party, called on Sánchez to resign for his “incompetence and complicity”.\nIn response to Sánchez summoning the Moroccan ambassador to discuss the crisis, Santiago Abascal, the leader of the far-right Vox party, said: “Morocco doesn’t need an ambassador in Spain – you are its ambassador.”\nAs many as 141 people are thought to have died trying to enter Ceuta at the end of July. The influx unleashed a political crisis, a humanitarian emergency and reignited tensions within the EU over immigration.\nOn Thursday, Sánchez appealed for European solidarity over the crisis. He did not single out any countries by name but, in a pointed passage apparently aimed at Italy and Denmark, the two countries that had led public criticism of Spain, said the principle of solidarity should apply to Ceuta as much as it applies to Greenland and Lampedusa.\nAlthough 90% of the people had returned to Morocco within 24 hours, several thousand, including at least 500 minors, are thought to remain, either living on the street or in makeshift shelters.\nAmid calls from Vox to return them to Morocco, Sánchez reminded parliament that under Spanish, European and international law, migrants had a right to be treated as individuals. “You can’t just grab someone by the arm and drag them across the frontier as though they were a sack of dirt,” he told MPs.\nIn reference to the hundreds of destitute minors, Aina Vidal of the leftwing group Sumar, said: “They’re children, not invaders, not soldiers. They didn’t come carrying bombs, they arrived wearing water wings, in tears.”\nIt seems likely the government will invest in facilities in Ceuta to accommodate the remaining migrants rather than risk the political backlash both in Spain and across Europe were they to bring them to the mainland.\nThere is also evidence that, faced with hunger as well as hostility from many local people, some migrants have already begun going back to Morocco.\nHowever, as Sánchez told parliament, the per capita income of Ceuta is eight times that of Morocco and “even if we build a wall 100 metres high there will still be people prepared to throw themselves into the sea to get across”.\n“We will not stop working until Ceuta emerges from this difficult situation: stronger, more prosperous, and more integrated with the rest of Spain and the EU,” he added.\nAdditional reporting by Jakub Krupa", "translation_ja": "", "vocab": [{"word": "facilitate", "definition": "何かが起こるのを容易にする、促進する。政治や外交の文脈では、公式な関与を示唆することが多い。"}, {"word": "breach", "definition": "契約や法律の違反、または防御の破れ。この場合は国境の不正越境を指す。"}, {"word": "concede", "definition": "相手の主張を認める、譲り入る。議論や交渉で自分の立場を一部認めることを示す。"}, {"word": "influx", "definition": "大量の人や物が流れ込むこと。移民問題やデータ処理で頻出する用語。"}, {"word": "solidarity", "definition": "共通の目標や利益に基づく結束や一致。EU内の国家間の協力姿勢を表現する際に使用される。"}, {"word": "destitute", "definition": "極度に貧困である、何も持たない状態。特に難民や移民の悲劇的な状況を描写する際に用いられる。"}]}, {"title_ja": "シャープビル虐殺の生存者が南アフリカ政府に補償を要求", "title_en": "Sharpeville massacre survivors demand compensation from South African government", "summary_ja": "1960年に警察が平和的なデモ参加者91人以上を殺害したシャープビル虐殺の生存者らが、南アフリカ政府を相手に補償を求めて提訴しました。脊椎に銃弾が残ったままの男性を含む3人の請求者は、政府を保護する1961年の免責法が違憲であると主張しています。この事件は、アパルトヘイト後の政府が人種不平等の解決に失敗したことへの不満の中で、アパルトヘイト時代の犯罪に対する正義を求める訴訟の波の一部です。", "summary_en": "Survivors of the 1960 Sharpeville massacre, where police killed at least 91 peaceful protesters in South Africa, are suing the government for compensation. Three test claimants, including a man who still carries a bullet in his spine, argue that a 1961 immunity law protecting the government is unconstitutional. The case represents part of broader litigation seeking justice for apartheid-era crimes amid frustration with the post-apartheid government's failure to address racial inequality.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/03/victims-sue-south-african-government-sharpeville-massacre-apartheid", "state_media": false, "category": "政治", "full_text": "The day dawned brightly on 21 March 1960, as residents of the South African township of Sharpeville gathered to protest against pass laws, which forced “Black, Indian and Coloured” South Africans to carry documents at all times specifying where they were allowed to be.\nAbraham Mofokeng joined the march, one of dozens organised nationwide by the Pan Africanist Congress (PAC), a breakaway group from the African National Congress (ANC). “The weather was very nice, the sun was out. You could not have suspected that the day would go so horribly,” said Mofokeng, who was then a 20-year-old factory worker.\nMofokeng, now 86, was among the thousands gathered peacefully outside the police station in Sharpeville, which is about 40 miles south of Johannesburg in a heavily industrialised region known as the Vaal Triangle.\nThe crowd was singing, he said, when officers opened fire without warning. At least 91 people were killed and 238 injured, in what became known as the Sharpeville massacre.\nAs Mofokeng fled, a bullet grazed the inside of his right foot, ripping his shoe off. A woman fell to the ground before him; he jumped over her and kept running. Only later, when he noticed blood running down his legs, did he realise he had been shot in the back, where a bullet remains lodged in his spine.\nMofokeng is among three claimants suing the South African government, in a case filed on Thursday, for compensation for the massacre. If the case is successful, dozens more could file claims.\nThe case is part of a wave of litigation demanding justice for apartheid-era crimes, amid widespread disillusionment with ANC-led governments that have failed to rectify South Africa’s huge racial inequality and poverty since the end of apartheid over three decades ago.\nIn January 2025, 25 survivors and relatives of victims of apartheid state violence sued South Africa’s government for failing to prosecute cases referred to it by the post-apartheid Truth and Reconciliation Commission (TRC). That May, the president, Cyril Ramaphosa, announced a judicial inquiry into potential political interference, which is still ongoing.\nSpokespeople for South Africa’s justice department did not respond to a request for comment on the Sharpeville compensation case.\nIn the immediate aftermath of the Sharpeville massacre, police claimed protesters had been throwing rocks at them. “I don’t know how many we shot,” said Col J Pienaar, the local police commander, according to a story published by the Guardian the following day. “It all started when hordes of natives surrounded the police station. My car was struck with a stone. If they do these things they must learn their lesson the hard way.”\nIn July 1961, in response to victims filing compensation claims, the white minority regime passed a law indemnifying the government and anyone acting under its authority for any actions taken “in good faith for the prevention or suppression of internal disorder, the maintenance or restoration of good order, public safety or essential services, or the preservation of life or property”.\nThe law, which was made effective retrospectively from the date of the massacre, is still in force today. The claimants’ legal team is arguing that the law is unconstitutional.\nThe claimants are hoping to get compensation of about 500,000 rand (£23,000), said Daniel Leader, a partner with the UK law firm Leigh Day, which is advising the South African legal team, led by Lawyers For Human Rights, an NGO.\nMafokeng was awarded 30,000 rand as a one-off payment, after the TRC concluded in 2003. The TRC had recommended annual reparations payments of about 20,000 rand for six years.\n“We continued to suffer,” said Mofokeng, who still lives in Sharpeville. “Especially now … I am struggling and my health is not up to standard.”\nThe other two test claimants were children when their fathers were killed in the massacre. Paulina Mathinye was five when her father, Samson, was shot. “Every time he came back from work, I would be so happy to see him that I would run to him, and then he would pick me up,” she said.\nMathinye did not initially understand what had happened that day in 1960. “I kept on asking my mum: ‘Mummy, why are you crying?’”\nMathinye’s mother struggled to raise her five children on a domestic worker’s wages and Mathinye, who had wanted to train as a teacher but could not afford the bursary, had to leave education at 17 to find work.\nMathinye, who is now 71, said she hoped for compensation that would make up for some of what she lost when her father died. “Some of my friends are teachers, some of them are nurses, and I’m staying in the same house that my father did,” she said.\nSharpeville’s problems did not begin with the massacre in 1960, but with the dispossession of Black South Africans from productive land, their forced removals to townships and their exclusion from the economy, said Vincent Thamae, a PAC member who supports the massacre victims and their families.\n“When people talk about com", "translation_ja": "", "vocab": [{"word": "indemnify", "definition": "法的責任や損害賠償から保護する、または免除することを意味します。政府や当局が違法行為から法的保護を受けることを指します。"}, {"word": "retrospectively", "definition": "過去に遡って適用されることを意味します。この場合、1961年の法律が虐殺の日付まで遡って効力を持つことを指します。"}, {"word": "unconstitutional", "definition": "憲法に違反している、または違反する可能性があることを意味します。法律や政策が基本法に反していることを指します。"}, {"word": "reparations", "definition": "過去の不正行為や被害に対する償いとして支払われる金銭や補償を意味します。被害者が受けた損害を補うための支払いです。"}, {"word": "disillusionment", "definition": "期待や信念が失われ、がっかりしたり失望したりする状態を意味します。政府への信頼が低下した状況を指します。"}, {"word": "dispossession", "definition": "土地や財産、権利などを奪われることを意味します。特に植民地支配やアパルトヘイト下での強制的な奪取を指します。"}]}, {"title_ja": "イスラエル警察がエルサレムでパレスチナ人を銃撃; 軍が包囲された村への支援をブロック", "title_en": "Israeli Police Kill Palestinian in Jerusalem; Army Blocks Aid to Besieged Village", "summary_ja": "イスラエル警察は金曜日、ダマスカス門付近でパレスチナ人男性（33歳）を銃撃し、将校を刺そうとしたと主張した。同時にイスラエル軍は、約100人の平和活動家がヨルダン川西岸の村クスラで入植者に包囲されている3家族への食料と医薬品の配送を阻止した（28日間）。", "summary_en": "Israeli police fatally shot a 33-year-old Palestinian near Damascus Gate in Jerusalem on Friday, claiming he attempted to stab an officer. Simultaneously, the Israeli army prevented around 100 peace activists from delivering food and medicine to three families besieged by settlers in the West Bank village of Qusra for 28 days.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/4/israeli-police-kill-palestinian-in-jerusalem-as-army-blocks-aid-for-qusra?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Israeli police kill Palestinian in Jerusalem as army blocks aid for Qusra\nIsraeli forces bar Israeli and Palestinian activists from delivering food and medicine to homes besieged by settlers.\nIsraeli police have killed a Palestinian man in Jerusalem and the Israeli army has blocked humanitarian assistance from reaching an occupied West Bank village besieged by settlers for weeks.\nOfficers opened fire on a 33-year-old Palestinian near Damascus gate in Jerusalem on Friday. Israeli police said its border guard “neutralised” the man, claiming he was attempting to stab one of them.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Worshippers in West Bank tear-gassed as Israeli attacks on mosques surge\n- list 2 of 3Palestinians in fear as Israeli forces mount pogroms on West Bank mosques\n- list 3 of 3Two Palestinians killed as settlers, Israeli forces raid West Bank village\nThe Palestinian Wafa news agency identified the man as Ibrahim al-Hendi from East Jerusalem’s Beit Hanina neighbourhood. He was pronounced dead at the scene.\nFollowing the incident, Israeli forces deployed around Damascus Gate and the surrounding area of Jerusalem’s Old City, Palestinian sources told Al Jazeera.\nSeparately, the Israeli army said that it arrested Palestinians in the town of Qabatiya in the West Bank, alleging they were “planning to carry out an attack” against Israelis and security forces.\nTen other Palestinians were arrested during a 48-hour Israeli army operation in Nablus in the West Bank. The Israeli army said it seized more than “30 weapon production machines used to manufacture weapons” during the operation.\nMeanwhile, Israeli settlers and soldiers carried out attacks across the occupied West Bank on Friday, Wafa reported. Settlers stormed the Khirbet al-Hamra community in the northern Jordan Valley and assaulted one resident.\nIsraeli settlers, accompanied by soldiers, also attacked Khalet a-Nahlah in southern Bethlehem. Israeli forces also fired tear gas and concussion grenades at a crowd of Palestinians who gathered to resist the attacks.\nBlocking access to Qusra\nAs violence and harassment of Palestinians continues across the occupied territory, the Israeli army on Friday also prevented around 100 peace activists from delivering food and medicine to Palestinians who have been under siege in the town of Qusra for 28 days.\nSince August 9, Israeli settlers have besieged three Palestinian homes in the northern occupied West Bank village, while the Israeli army has also prevented the families from entering or leaving them, claiming the area is a “closed military zone”.\n“Day 28 of the blockade on Qusra. About 100 activists arrived to deliver supplies to the besieged families,” the Israeli Peace Now movement said in a post on X.\n“The army blocked us at first, claiming Qusra was a ‘closed military zone.’ Then let us in but on the way back detained us for ‘violating a closed military zone’,” it added.\nQusra Mayor Abdel Azim Wadi also told the state-run Turkish Anadolu news agency that the Israeli army has been “preventing the delivery of basic necessities to three families trapped on Mount Ras al-Ain”.\nUS ambassador to Israel Mike Huckabee told Israeli public broadcaster Kan on Friday that settler violence against Palestinians is “damaging the image of Israel as a nation and a people, warning that Israel “needs all the friends it can get” and “doesn’t need more enemies”.\nAround 750,000 Israeli settlers live in 156 illegal settlements and 360 settlement outposts in the occupied West Bank, including East Jerusalem, and carry out attacks aimed at forcibly displacing Palestinians, according to Palestinian figures.", "translation_ja": "", "vocab": [{"word": "besieged", "definition": "包囲された、取り囲まれた状態。軍事的または政治的に外部との接触が遮断された状況を指す。"}, {"word": "humanitarian assistance", "definition": "人道的支援。紛争地域や被災地で、食料や医療などの基本的なニーズを満たすための援助活動。"}, {"word": "neutralised", "definition": "中立化された、無力化された。軍事用語で脅威を排除することを表す。"}, {"word": "deployed", "definition": "配置された、展開された。軍隊や警察がある地域に配置されることを意味する。"}, {"word": "outposts", "definition": "前哨基地、外部拠点。小規模な軍事的または政治的支配の拠点を指す。"}, {"word": "forcibly displacing", "definition": "強制的に追い出す、排除する。人々を暴力的またはその他の手段で故郷から追放すること。"}]}, {"title_ja": "コスタリカ大統領、治安対策としての米軍作戦受け入れに前向き", "title_en": "Costa Rica's President Open to US Military Operations Amid Security Concerns", "summary_ja": "コスタリカのラウラ・フェルナンデス大統領は、国内の麻薬密売やテロ対策のための米軍作戦を許可する可能性を示唆しており、ただし議会の承認が必要であると述べた。彼女の姿勢は、トランプ大統領の下で米国がラテンアメリカ全域での軍事関与を拡大する圧力を反映している。一方、評論家はエクアドルでの最近の作戦に基づいて人権侵害の可能性について警告している。", "summary_en": "Costa Rican President Laura Fernandez has indicated willingness to allow US military operations on her country's territory to combat transnational crime and drug trafficking, though any such measures would require congressional approval. Her openness reflects broader US pressure under President Trump to expand military engagement across Latin America, though critics warn of potential human rights abuses based on recent operations in Ecuador.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/4/costa-rican-president-signals-openness-to-domestic-us-military-operations?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Costa Rican president signals openness to domestic US military operations\nPresident Laura Fernandez notes that Costa Rica’s Congress would need to approve any US military operations within the country.\nCosta Rican President Laura Fernandez has suggested that United States military operations in the country’s territory could bring national security benefits.\nBut she added caveats. In an interview published on Friday, Fernandez emphasised to the news service Reuters that such measures would require approval from the national legislature.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Laura Fernandez sworn in as Costa Rica’s new president\n- list 2 of 3Civilians faced attacks, abuse in joint US-Ecuador operations, HRW says\n- list 3 of 3In a bid to counter China, Trump hosts a summit for Latin America leaders\nShe also added there were no plans in the works for US forces to operate in the country.\n“It would obviously be very good for national security if it were about pursuing a common objective against transnational crime, transnational drug trafficking, transnational terrorism,” said Fernandez, a right-wing populist who took office in May.\nFernandez succeeded her mentor, former President Rodrigo Chaves, after a February election in which concerns about security and rising violence in the Central American country played a prominent role.\nThough she ran on a tough-on-crime platform, Fernandez has said that she is not currently considering a state of emergency to address the problem.\nSuch emergency declarations typically suspend key constitutional rights, in favour of giving police or the military added powers to crack down on violence.\nThat model has been popularised under the right-wing president of El Salvador, Nayib Bukele.\nBut critics point out that the states of emergency are meant to be short-term measures, not permanent ones. El Salvador has been under an emergency declaration since 2022, with the government extending it dozens of times.\nCrime has become a top voter concern in Costa Rica. The Central American country’s homicide rate has doubled in the last decade, reaching 17.2 per 100,000 inhabitants in 2023.\nThat figure still places the country’s average well below many others in the region, but the change, partly attributed to increased drug trafficking activity, has startled many residents.\nFernandez’s remarks also reflect growing pressure from the US to reduce crime across the Western Hemi
