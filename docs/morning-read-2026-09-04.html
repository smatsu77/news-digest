marks of America’s broken death penalty system.\nLike many who end up on death row, Pike had an unspeakably difficult childhood. She was raped and abused and, when not being subject to such horrors, was abandoned and neglected by her parents.\nSo it was not surprising when Pike turned to violence, and with two others committed a murder when she was still a teenager. As the psychologist and trauma expert Bethany Brand explains: “At 18 years old, her immature, traumatized brain made her exceptionally vulnerable to impulses and extremely poor decisions … Unmedicated and untreated, she was not able to put the ‘brakes on’ her bipolar- and trauma-triggered emotions.”\nWhen it came to her trial, Pike’s lawyer failed to present mitigating evidence that was readily available to him and to uncover any new mitigating circumstances. As the professor Deborah Denno explains: “Specifically, counsel chose not to present defendant’s social history evidence … claiming that the … materials in particular contained double-edged information,” namely information that might have hurt as well as helped her.\nAnd now as she awaits her execution, she has legitimate concerns that, given her distinctive medical and emotional problems, when the state tries to kill her, she will face a torturous and cruel death.\nBut so far, courts have chosen to look the other way.\nIf they continue to do so, Pike will take her place among America’s relatively exclusive club of female execution victims. It is such a club because while women commit about one in eight homicides in the United States, they tend to commit murders that fall below the threshold of crimes that prosecutors, judges and jurors consider to be the worst of the worst.\nAs the professor Elizabeth Rappaport argues: “Two thirds of women who kill, kill family members and lovers … [and] [t]hese crimes almost never result in death sentences, regardless of the sex of the killer.”\nPike was obviously not one of those killers. And her victim was murdered in a gruesome manner.\nA local television station in Knoxville, Tennessee, says prosecutors claim Pike “tortured and killed” her victim because Pike thought she was trying to steal Pike’s boyfriend.\nThis crime is reminiscent in its brutality to the one committed by Karla Faye Tucker in Texas in 1983. She and her co-defendant killed their victims with a pickaxe.\nTucker became something of a celebrity after having a sincere and profound religious conversion on death row. Texas Public Radio reports that her case “attracted national attention by many of America’s top televangelists, including Pat Robertson. He appealed to the Texas Governor George W. Bush … to commute Tucker’s sentence,” something that Bush refused to do.\nTucker was put to death in 1998, making her the first woman executed in Texas since 1863.\nFast forward to January 2021, when the federal government under Donald Trump executed Lisa Montgomery. Here, again the crime for which she was convicted was particularly gruesome.\nIn 2004, Montgomery crossed state lines “ostensibly to purchase a puppy from Bobbie Jo Stinnett, a 23-year-old dog breeder who was eight months pregnant. Instead, Montgomery strangled her, cut her fetus from her womb and tried to pass the surviving baby off as her own.”\nLike Christa Pike, Montgomery “had brain damage and severe mental illness that was exacerbated by a lifetime of abuse, including child sex trafficking, gang rape and physical abuse largely at the hands of family members”.\nShe was killed by lethal injection, making her just the fourth woman ever executed by the federal government. It put a woman to death for the first time in 1865, when it hanged Mary Surratt for her role in the assassination of Abraham Lincoln.\nAt the time, according to the National Museum of Women’s History, “most people, including the military judges who issued the guilty verdict, could not believe the United States government was going to execute a woman.”\nThere is a bit of that sentiment reflected in the news coverage of Pike’s case. Even as this society seeks to achieve gender equality, there is still something unsettling at the prospect of putting a woman to death.\nIn Pike’s case, what should truly be unsettling is not her gender, but rather the prospect of putting to death someone whose crime was as much the product of", "translation_ja": "", "vocab": [{"word": "mitigating evidence", "definition": "被告人の刑罰を軽減する可能性がある証拠。被告人の困難な背景や精神的問題など、犯罪の重大性を減らすための事由を示す証拠のこと。"}, {"word": "exacerbated", "definition": "問題や状態をより悪くすること。悪化させることを意味し、しばしば複数の要因が組み合わさって状況が深刻になる場合に使用される。"}, {"word": "hallmarks", "definition": "特徴的な兆候や標識。ある物事を代表する、典型的な特性や特徴を指す。"}, {"word": "threshold", "definition": "ある基準やレベルに達する入口。この文脈では、死刑対象になるほど十分に深刻と見なされる犯罪のレベルを意味する。"}, {"word": "commute", "definition": "刑罰を軽減すること。死刑判決をより軽い刑罰に変更する権限を持つのは、通常は州知事または大統領である。"}, {"word": "gruesome", "definition": "非常に残酷で不快な。暴力的で嫌悪感を抱かせるような行為や光景を表現する時に使われる。"}]}, {"title_ja": "チューゲンダートの真摯な政治姿勢とバデノックの改革ライト保守党の議題の衝突", "title_en": "Tugendhat's Serious Politics Clash With Badenoch's Reform-Lite Tory Agenda", "summary_ja": "ジョン・クレイスはケミ・バデノックの影の内閣改編を批判し、トム・チューゲンダートは確かに真摯な政治家であるが、外相への任命はバデノックの右傾化する保守党の方向性との不快な緊張を明かしていると主張する。改編自体は党の限定的な人材プールを反映しており、リズ・トラスの失敗したミニ予算との関わりで汚されたアンドリュー・グリフィスの影の財務相就任などの疑問の余地のある人事を含んでいる。", "summary_en": "John Crace critiques Kemi Badenoch's shadow cabinet reshuffle, arguing that while Tom Tugendhat is a genuinely serious politician from the One Nation tradition, his appointment as foreign secretary reveals an uncomfortable tension with Badenoch's rightward-shifting Conservative direction. The reshuffle itself reflects the party's limited talent pool, with questionable choices like Andrew Griffith as shadow chancellor—a man tainted by his association with Liz Truss's failed mini-budget.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/uk-news/2026/sep/04/digested-week-tom-tugendhat-tory-reshuffle", "state_media": false, "category": "オピニオン", "full_text": "Monday\nIt’s the end of summer and Kemi Badenoch chose to mark the occasion with a reshuffle of her shadow cabinet. Her aim is apparently to get the Tories match fit in case Andy Burnham calls an early general election, but the vibes are much more rearranging the deckchairs on a sinking ship. After all, when the gene pool of talent is that small, there’s not much you can do. James Cleverly got the ball rolling by announcing he was planning to be the Conservative candidate for London mayor in two years’ time. He may have his work cut out. London is a liberal, multicultural city and unlikely to be won over by a party giving up on net zero and the European convention on human rights.\nCleverly’s replacement as shadow housing secretary is Katie Lam, who was only elected two years ago but has been desperate to attract attention by consistently saying the most offensive thing she can think of. This may not end well. Priti Patel’s departure as foreign secretary was no great surprise as she has always been a liability, but Kemi’s decision to appoint Tom Tugendhat in her place did raise eyebrows. Tom has always been from the One Nation side of the party and Kemi didn’t seem to realise that when he said: “If I had known Kemi was this good I wouldn’t have stood against her,” he had merely been joking. He is at least a serious politician in the way Priti never was, but you also can’t help wondering if he is really signed up to Kemi’s Reform-lite Tory agenda. Still, Tom has never been one to shy away from going to war with anyone, so he and Kemi will have something in common.\nThat just leaves the change of shadow chancellor. It goes without saying that Mel Stride had always been endearingly hopeless, but the choice of Andrew Griffith to take over is bewildering. The Tories always like to play up Griffith’s career in business, but what the rest of the country will be focusing on is that he was the co-author and defender of Liz Truss’s disastrous mini-budget. So maybe his economic judgment is not that sound after all. It should also be remembered that Griffith was Boris Johnson’s “net zero business champion” in 2020; something he and Kemi are also hoping to forget. Maybe the key to understanding Griffith is that he is just a career opportunist who doesn’t really believe in anything. In which case he may fit in just fine.\nTuesday\nOne politician who won’t be hurrying back to Westminster for the start of the new parliamentary session is Keir Starmer. He has just announced he is standing down as an MP. The only recent former prime minister to remain a backbencher and regularly turn up to debates in the Commons was Theresa May and she cut a somewhat sad figure. Her attendance was impressive but she never appeared to have any friends. Just sitting by herself, lost in her own thoughts. What Keir is thinking now is anyone’s guess. We don’t all get the summer we were hoping for – I certainly didn’t – but Starmer’s must have been borderline surreal. It must be so hard for a prime minister to learn to switch off. One day you’re the centre of attention with constant demands on your time, the next you’re a virtual ghost. A person of little importance. Most former prime ministers have a tormented shadow to them, even years after they have left Downing Street. As if they still can’t believe that the voters or their own MPs have rejected them. Keir will have been expecting to have spent the last six weeks on constant alert. Dealing with world events and travelling the country to convince everyone he was actually working. A prime minister needs to be visible, or their enemies assume they are skiving. Instead, his phone will have gone quiet with no one making any demands on his time. The fear of missing out must have been intense.\nHe might have wished Burnham well in public but in private he wouldn’t have been too sad if Andy was struggling just a little bit. Just about all we did hear about Keir during the break was that he had donated a copy of Tom Baldwin’s biography of himself to the No 10 library. Which felt, somehow a little desperate. Somewhat tragic. Why not break with tradition and leave a work of fiction? Rebecca; or The Age of Innocence. Something that just oozes class. But instead, like many prime ministers, he couldn’t resist giving a rose-tinted version of his deeds that will never be read by anyone. It will survive to collect dust. Which only goes to show that with many politicians, it really is all about them.\nWednesday\nMost of us go through life collecting bits and pieces. What others might call clutter. Items that shape the identities of our homes. Starting with the basics. Tables, chairs, beds, chest of drawers, kitchenware, that sort of thing. Then books, televisions and sound systems. But what happens to all this when we die? How much will remain? In my mother’s case, the answer was almost nothing.\nMy mum died last year at the age of 101, her last seven years spent in a care home as her Alzheimer’s prevented her from liv", "translation_ja": "", "vocab": [{"word": "reshuffle", "definition": "内閣または主要メンバーの再構成。特に政治的な組織において、人員の配置を変更することを指す。"}, {"word": "liability", "definition": "弱点や問題となる人・もの。組織や集団にとってマイナスの影響を与える要素。"}, {"word": "One Nation", "definition": "イギリス保守党の伝統的な中道派勢力。社会階級間の調和と共通の利益を強調する政治哲学。"}, {"word": "mini-budget", "definition": "通常の予算案の外に発表される小規模な予算措置。イギリスではリズ・トラスの経済政策として知られる。"}, {"word": "opportunist", "definition": "自分の利益のために状況を利用する人。原則や信念よりも実益を優先する傾向のある人物。"}]}, {"title_ja": "次の飢饉を避ける", "title_en": "Avoiding the Next Famine", "summary_ja": "著者は、21億人に影響を及ぼす世界的な食糧不安が単なる人道的危機ではなく、経済発展、政治的安定、国際安全保障に影響を与える戦略的脅威であると主張しています。米国は飢饉に対処する調整された世界的な取り組みを主導し、農業専門知識と食糧安全保障機関における歴史的役割を活用して、アメリカのリーダーシップに対する国際的信頼を再構築し、この分野における中国の影響力の増大に対抗すべきであると述べています。", "summary_en": "The author argues that global food insecurity affecting 2.1 billion people is not merely a humanitarian crisis but a strategic threat with consequences for economic development, political stability, and international security. The U.S. should lead a coordinated global effort to address hunger, leveraging its agricultural expertise and historical role in food security institutions to rebuild international confidence in American leadership and counter China's growing influence in this domain.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/avoiding-next-famine", "state_media": false, "category": "オピニオン", "full_text": "In a world of great-power standoffs, climatic tipping points, and technological arms races, global hunger may not seem like a particularly significant problem. Yet last year, a total of 2.1 billion people, or more than a quarter of the planet’s population, experienced food insecurity—meaning they either ran out of food over the course of a year or were forced to reduce the quality or quantity of their diet. Over 260 million faced acute food insecurity, meaning their lives or livelihoods were in immediate danger because they could not get enough to eat. Almost a quarter of all children under the age of five were permanently stunted because of malnourishment and will likely reach lower levels of education, earn less over the course of their lives, and live with more chronic health challenges than properly fed kids. And these startling figures do not reflect the food crises that could be unleashed this year by rising energy and fertilizer prices, decreases in grain exports from Russia and Ukraine, and an intensifying El Niño weather pattern.\nFood insecurity is terrible in and of itself. But it also has disastrous political consequences. It inhibits economic growth, heightens the risk of violent conflict, and destabilizes governments. These problems, in turn, create trouble for the whole world. That means countries that are not overwhelmed by food insecurity still have strong, self-interested reasons to tackle it—the United States included.\nIn fact, a U.S.-led effort to address hunger would do more than create a healthier and more stable planet. Given the waning goodwill toward the United States, Washington needs an agenda through which it can rebuild global confidence in its leadership and demonstrate the value of international cooperation. Addressing global food security could be at the center of such a plan. Different parts of the world, after all, may have different geopolitical ambitions. But almost no government—northern or southern, democratic or autocratic—wants to see so many people go hungry. There may be no better way to rebuild confidence in the liberal world order and in the United States as a committed member of it than for Washington to address this challenge.\nFOOD, GLORIOUS FOOD\nIt is difficult to overstate just how intertwined food security is with global development, state security, and even international competition. Malnutrition leads to reduced educational attainment, compromised human capital, and lost productivity, costing the world economy $3.5 trillion a year in forgone economic growth and in added health-care costs. Food price spikes can also exacerbate grievances and lead to riots that destabilize governments; anger over hunger, for example, set the conditions for the Arab Spring protests. In rural areas, food insecurity helps armed groups recruit soldiers and causes disputes over scarce land and water resources. And it causes people to migrate to wealthier states.\nThese reasons are, by themselves, enough for Washington to helm a global campaign to reduce hunger. But so should the fact that leading on global food security means helping shape the future of the world’s entire agricultural system—something China is on a path to do. In 2019, Beijing invested significant capital in securing leadership of the Food and Agriculture Organization of the UN, a role with substantial influence over how governments work together on food-related issues. It is also quickly developing other ways to lead the world on matters of food security. China spends double what the United States spends on public agricultural research and development, and its output of agricultural patents and scientific publications has skyrocketed while U.S. output has stagnated.\nThankfully for American officials, the United States is still well positioned to lead the world when it comes to food security. The United States is among the world’s largest agricultural exporters. It was instrumental in founding the UN architecture dedicated to food security, including the Food and Agriculture Organization and the World Food Program. And for much of these institutions’ history, Washington has been their largest donor. In fact, for decades, the United States’ international development agenda was the most ambitious in the world, and it was backed by a willing public.\n Washington retains many of the tools needed to combat global hunger.\nThe country still has such a public: in early 2026 polling, a strong majority said that the United States should be a moral leader in the world. But a strong majority didn’t believe it was. Perhaps this is because the United States has been walking away from this legacy and this opportunity to lead. In mid-2025, for example, Congress clawed back nearly $8 billion in foreign assistance funds. The United States is now a reluctant international donor and a surly member of key international organizations.\nWashington, however, still retains many of the tools needed to combat global hunger. In addition to incre", "translation_ja": "", "vocab": [{"word": "food insecurity", "definition": "十分な食料にアクセスできない状態。個人や家族が年間を通じて食料が不足したり、食事の質や量を減らすことを余儀なくされる状況を指します。"}, {"word": "tipping points", "definition": "システムが急激に変化する臨界点。気候変動などの文脈では、取り返しのつかない変化が起こる分岐点を意味します。"}, {"word": "destabilize", "definition": "安定を損なう、不安定にさせる。政治体制や社会秩序が揺らぎ、機能不全に陥る状態を引き起こすことを指します。"}, {"word": "liberal world order", "definition": "民主主義と市場経済に基づく国際秩序。国連などの国際機関と法の支配によって維持される現在の国際システムを指します。"}, {"word": "exacerbate", "definition": "悪化させる、増幅させる。既存の問題や状況をより深刻で困難にすることを意味します。"}, {"word": "helm", "definition": "指導する、先導する。組織や取り組みの最高責任者として主導権を持つことを指します。"}, {"word": "foregone economic growth", "definition": "失われた経済成長。実現されなかった、または放棄された潜在的な経済成長の利益を指します。"}]}, {"title_ja": "台湾が台湾海峡で勝利する方法", "title_en": "How Taiwan Can Win the Strait", "summary_ja": "著者は、台湾が中国の侵攻に対抗するため、高価な大型軍艦を放棄し、より小型でステルス性能の高いコルベットを採用すべきだと主張しています。現代の監視およびミサイル技術により、狭い海域での大型艦船は脆弱になる一方、中国の大型揚陸艦は小型の代替品に置き換えられないため、台湾が活用すべき非対称的な優位性が生じています。", "summary_en": "The author argues Taiwan should abandon expensive large warships in favor of smaller, stealthier corvettes to defend against Chinese invasion across the Taiwan Strait. Modern surveillance and missile technology make large surface ships vulnerable in narrow waters, while China's massive amphibious vessels cannot be easily replaced with smaller alternatives, creating an asymmetric advantage Taiwan should exploit.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/taiwan/how-taiwan-can-win-strait", "state_media": false, "category": "オピニオン", "full_text": "Separated from China by a roughly 100-mile-wide strait, Taiwan relies on its navy as the first line of defense against a potential invasion. It must be able to prevent an assault by a Chinese force carried across the Taiwan Strait in large amphibious ships. Taiwan has traditionally favored large ships such as destroyers and frigates to form the core of its fleet, both as visible symbols of state power and as tools for signaling resolve in the face of Chinese coercion, and Taiwan’s current shipbuilding plans include replacing an aging surface fleet with large and expensive new ships.\nYet large surface ships are vulnerable in the narrow waters of the Taiwan Strait—a problem compounded by advances in technology that are making them easier to detect, track, and attack. China has invested in cutting-edge intelligence, surveillance, and reconnaissance (collectively known as ISR), as well as electronic warfare systems, drones, and missiles. Taiwan’s large surface ships are now a liability. But Taiwan has an advantage: these same technologies make China’s large amphibious ships more vulnerable in restricted waters, and those ships cannot be replaced by smaller, stealthier alternatives. Taipei can take advantage of this mismatch by replacing its destroyers and frigates with a greater number of smaller surface combatants that are more likely to survive an initial wave of Chinese strikes and remain capable of attacking a Chinese invasion fleet.\nThe Taiwanese navy is planning to invest heavily in large surface combatants, including a new 7,000-ton warship and as many as 12 3,000-ton light frigates. These large ships are impediments to the radical transformation of the Taiwanese navy that the Chinese threat requires. Building ships of this size with stealth features and defense systems to survive a battle in the Taiwan Strait would be prohibitively costly; without these features, they would be too vulnerable to play a major role in the navy’s primary wartime mission of denying a Chinese invasion force the use of the Taiwan Strait. Efforts elsewhere to build similarly capable ships have proved costly and difficult. The U.S. Navy’s Constellation-class frigate program, for example, budgeted roughly $1 billion per ship; the cost eventually rose to about $1.5 billion each before the Constellation program was canceled, and even at that price the ships lacked the capabilities needed to fight an advanced adversary in restricted waters. In comparison, the spending on Taiwan’s entire shipbuilding program is projected to be $1.5 billion annually.\nRather than spend resources on large ships, Taipei should build stealthy corvettes weighing between 700 and 1,000 tons, armed with missiles and drones, that are harder to detect and target but can retain enough firepower to attack Chinese ships crossing the strait. Combined with current plans to build shore-based mobile launchers, aircraft armed with antiship missiles, and eight submarines, Taiwan can create a dispersed and hard-to-destroy defense system that can withstand Chinese attacks and repel a potential amphibious assault.\nSITTING DUCKS\nLarge ships may be potent signals of national power, but they are relatively easy to target and politically costly to lose. When ships are fighting in narrow waterways under heavy surveillance, visibility quickly becomes a deadly liability. The sinking of a large ship can also have consequences beyond an immediate military setback. A highly visible and costly loss may make political and military leaders more cautious about risking additional warships as conflict continues.\nMajor naval engagements over more than the last four decades suggest that any navy expecting to fight near an enemy’s coast should be wary of building its force structure around expensive, irreplaceable hulls. The 1982 Falklands War between Argentina and the United Kingdom, for example, showed how a single successful strike on a warship can constrain an entire surface fleet. Argentina entered the Falklands conflict with powerful ships, including the cruiser General Belgrano and the aircraft carrier Veinticinco de Mayo. But after a British submarine sank the Belgrano, Argentina decided to keep much of the rest of its surface fleet, including the carrier, closer to coastal waters or in ports for the rest of the war.\nIn the Persian Gulf six years later, the U.S. Navy’s ability to combine surveillance, aircraft, ships, and precision weapons devastated Iranian naval forces during Operation Praying Mantis. In a single day, U.S. forces sank or badly damaged several Iranian surface vessels operating in the confined waters of the Gulf, including two large frigates. Whereas the Falklands War illustrated the political consequences of losing a major warship, Praying Mantis highlighted the danger for ships facing an adversary with a much more effective “kill chain”—the sensors and communications to detect, identify, track, target, and attack an opponent’s fleet. For Taiwan, the lesson is that ", "translation_ja": "", "vocab": [{"word": "corvette", "definition": "排水量700～1000トン程度の小型軍艦。ミサイルや防御システムを備え、フリゲート艦より小さいが十分な火力を持つ艦艇を指します。"}, {"word": "amphibious", "definition": "海と陸の両方で作戦を行う能力を持つことを意味します。本文では海から陸地への軍隊輸送作戦を指します。"}, {"word": "ISR", "definition": "Intelligence, Surveillance, and Recognitionの略。敵の動きを検知し追跡するための情報収集・監視・認識システムを指します。"}, {"word": "kill chain", "definition": "目標を検知してから攻撃まで一連の過程。センサーから通信、標的特定、射撃命令まで含まれます。"}, {"word": "liability", "definition": "弱点または不利な要素を意味します。本文では大型艦船が最新技術下では脆弱性となることを指しています。"}, {"word": "dispersed", "definition": "分散した、または拡散した状態を意味します。防御システムが複数箇所に配置されて敵の攻撃に耐える戦術を指します。"}]}, {"title_ja": "イランとの膠着状態のケース", "title_en": "The Case for a Stalemate With Iran", "summary_ja": "著者は、現在の米国とイランの相互封鎖が不完全ながらも、軍事的エスカレーションや完全撤退と比較して米国にとって最も低コストな選択肢だと主張しています。決定的な勝利を求めるのではなく、米国はこの膠着状態を無期限に維持すべきであり、イランの経済は米国よりも速く弱体化し、テヘランを有利な条件で交渉のテーブルに戻すことになるでしょう。この戦略は、破滅的なエスカレーションの回避を優先しながら、イランの地域的影響力と経済力を徐々に削減することに重点を置いています。", "summary_en": "The author argues that the current U.S.-Iran mutual blockade, while imperfect, represents the least costly option for Washington compared to military escalation or full withdrawal. Rather than seeking decisive victory, the U.S. should maintain this stalemate indefinitely, as Iran's economy will weaken faster than America's, potentially forcing Tehran to negotiate on favorable terms. The strategy prioritizes avoiding catastrophic escalation while gradually eroding Iran's regional power and economic capacity.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/case-stalemate-iran", "state_media": false, "category": "オピニオン", "full_text": "Six months in, the U.S. and Israeli war on Iran has settled into a stalemate. Neither Washington nor Tehran can achieve a clear military or diplomatic victory. Instead, the two sides have found themselves locked in a mutual blockade of oil and other shipments through the Strait of Hormuz and into Iranian ports, with no obvious way to change the status quo. The costs of accommodating the other side’s demands to end the stalemate are so high, and the costs of the stalemate sufficiently low, that a mutual blockade has emerged as the least bad option for both the United States and Iran for the foreseeable future.\nThis situation may not be ideal for Washington, but it avoids both defeat and escalation. It also works to the United States’ advantage over time: as the blockade drags on, Tehran’s position is likely to weaken faster than Washington’s. The United States has its own ample oil supplies to draw from, whereas nearly the entirety of Iran’s oil exports—and therefore much of its hard currency—has been cut off. An ongoing blockade that gradually ratchets up pressure on Iran could make Tehran more flexible in negotiations with the United States, leading to a compromise that Washington could accept. The challenge is to ensure that Tehran does not choose to respond to its worsening position by escalating its attacks and starting another regionwide conflict that ensnares the United States.\nU.S. policy should focus on avoiding the most disruptive contingencies, especially Iranian escalation, and settle for maintaining dual blockades indefinitely. If Iran is unwilling to concede, Washington can slowly erode the Iranian economy and military while ensuring that Tehran cannot rebuild the strong regional position it enjoyed before the Hamas attack on Israel on October 7, 2023. At this stage, maintaining the current U.S. position is the most effective way of fighting—and winning—this war.\nBEST OF THE WORST\nIn June, Washington and Tehran agreed to a memorandum of understanding to first establish a cease-fire and open the Strait of Hormuz and then to sign a permanent deal within 60 days to resolve long-term issues in the bilateral relationship, including restricting Iran’s nuclear program and removing U.S. and international sanctions and other financial penalties on Iran. But it fell apart before a final deal could be reached largely because Iran failed to fully open the strait. With diplomatic solutions going nowhere, both Washington and Tehran are now hoping that the economic pressure each can put on the other—and in the case of Iran, on the global economy—will force its counterpart back to the negotiating table on terms that will resolve the blockade in its favor.\nA blockade comes with costs for Washington. Keeping the strait closed is raising gas prices and increasing inflation in the United States, an especially sensitive issue as the November midterm elections approach. Prices could rise further if Iran finds a way to limit the millions of barrels of oil that bypass its blockade and are transported through the Strait of Hormuz daily. And the United States has already used up many critical munitions and strained its troops in the region by keeping the war going.\nBut the operation has been relatively affordable compared with past conflicts. The United States lost thousands of lives and spent trillions of dollars in Afghanistan and Iraq, whereas the ongoing conflict with Iran has resulted in 18 American service members killed and has likely cost tens of billions of dollars. (As of mid-July, estimates ranged from $37.5 billion to over $100 billion.) Most important, the mutual blockade has the advantage of being more palatable to political leaders in Washington than any of the alternative options.\nA full U.S. withdrawal from the Strait of Hormuz without gaining concessions from Iran, including ending its blockade, would be unthinkable even for the unorthodox Trump administration. It would allow Iran to tout a complete victory and give the regime in Tehran a powerful psychological boost that would undo much of the progress that the United States and Israel made in the past three years decimating Iran’s network of regional proxies. And it would probably not lead Iran to reopen the Strait of Hormuz for free passage—Tehran is likely to insist on installing some kind of tolling system in perpetuity. With Washington in retreat, Iran could also revive and rebuild its nuclear program, which would be a stunning failure for the United States.\n The United States can continue the mutual blockade at relatively low cost.\nMilitary escalation is an even less appealing option for Washington. The Iranian regime has already survived a massive bombing campaign; a new, even more aggressive offensive could take out much of Iran’s remaining military capabilities and its energy, transportation, and communications infrastructure, but such an offensive could not guarantee that Tehran would accept American terms on opening the strait or curtailing", "translation_ja": "", "vocab": [{"word": "stalemate", "definition": "相互に勝つことも負けることもできない膠着状態。交渉や紛争において、どちらの側も優位を得られない行き止まりの状況を指します。"}, {"word": "blockade", "definition": "港湾や地域への物資供給を制限または遮断する軍事的または経済的な行動。通常は敵国に対する圧力手段として使用されます。"}, {"word": "escalation", "definition": "紛争や対立の段階的な拡大または激化。軍事的、経済的、または政治的な緊張が増加する過程を示します。"}, {"word": "erode", "definition": "徐々に弱まる、減少する、または破壊される状態。時間とともに経済力や軍事力などが少しずつ損なわれることを意味します。"}, {"word": "bilateral", "definition": "二国間の、または二者間の関係や合意。通常、国家間の外交交渉や協定に用いられます。"}, {"word": "contingency", "definition": "起こる可能性のある不測の事態または予期しない状況。事前計画が必要な潜在的な危機シナリオを指します。"}, {"word": "palatable", "definition": "受け入れやすい、または認容できる状態。政治的または個人的に容認可能なことを示します。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-04 22:40 JST";
  renderTabs();renderList();
})();
</script>
