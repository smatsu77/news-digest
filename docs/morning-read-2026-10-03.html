es near four-year high in September, UN says reuters.com", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMipAFBVV95cUxONEhfR0lrWDQySjhaQkpLXzJJMVpfcDhScWxHbGNRRkhwa00xcndrQmw4OXQwZzVlX2F6ZVBsTHZ6cUFUbHJyN2ZzTHNka3htMWphZE1sNVRNdXBfMHBXbHF0T0NfTS02OTJnQkR0dmRLRWRXandsdktobVdacDhmQjBKbVJ5czM5U1FoaTFrTUwxVktmSGd3UUhRVWpKQlY5Q253Yg?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "G7 to release 100 million barrels of oil and diesel after Trump export ban threat", "title_en": "G7 to release 100 million barrels of oil and diesel after Trump export ban threat", "summary_ja": "The coordinated release is aimed at heading off further price spikes and avoiding a ban on US diesel exports.", "summary_en": "The coordinated release is aimed at heading off further price spikes and avoiding a ban on US diesel exports.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck87zg8jnwngo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "G7 to release 100 million barrels of oil and diesel after Trump export ban threat\n- Published\nThe G7 has agreed to release 100 million barrels of oil and diesel in a bid to ease supply pressures that have caused prices to skyrocket.\nThe group of advanced economies, including the US, said the move would include a \"substantial release\" of diesel in the coming days.\nPresident Donald Trump had threatened to ban diesel exports in a move which would have eased pressure on prices for US consumers ahead of November's midterm elections, but pushed up prices elsewhere.\nIn a joint statement, the G7 said member countries had now agreed to \"refrain from export restrictions on energy and energy products\" on one another.\nThe G7 includes the US, UK, Canada, Japan, Germany, Italy and France, with the EU also represented at its meetings.\nTrump had warned he would ban diesel exports from the US if European countries did not agree to put more of their own stocks onto the market.\nOn Friday, he said on social media: \"Europe has just agreed to release a massive amount of their heavily stocked Diesel Oil. The process will begin immediately.\"\nHis Treasury Secretary Scott Bessent had argued US farmers, truckers, and businesses \"should not be left carrying the burden\" as prices soar.\nDiesel is used heavily by the haulage industry and in agriculture, meaning rises in the cost of the fuel feed through into essentials such as food.\nBut, following a meeting of G7 leaders, French President Emmanuel Macron said the bloc had agreed to release reserves of \"up to 100 million barrels\" within four months under the coordination of the International Energy Agency (IEA).\nThe UK was represented at the meeting by Foreign Secretary Ed Miliband, who said the measures would \"stabilise energy supplies, build resilience in supply chains and shield households and businesses from price shocks\".\nMacron said the coordinated action would \"bring down the prices of petroleum products, particularly diesel\". Highlighting the agreement not to pursue export bans, Macron said \"President Trump, in particular, was very clear on this point\".\nSpeaking at the White House, Trump later said an export ban on diesel was \"never really on the table\".\nIn the joint statement, G7 leaders said: \"We will implement our commitments with a coordinated release through the IEA of 100 million barrels to begin immediately over four months, including a frontloaded substantial diesel release within the first 20 days by G7 members and partners.\"\nIt is not yet clear which partner countries will release stocks, nor how quickly.\nThe 100 million barrels will comprise a mix of diesel and crude oil. The price of global benchmark Brent crude oil briefly dropped below $100 a barrel, but rose back to around $102 by Friday evening. Before the US and Israel invaded Iran, it was trading at around $73.\nMatt Smith, director of commodities research at Kpler, said oil had risen again due to renewed strikes between Saudi Arabia and the Houthis in Yemen.\n\"Oil prices were selling off strongly due to the announcement of strategic stock releases in Europe, but they reversed course on rumours of Saudi Arabia planning an offensive into Yemen as it looks to re-establish a safe path via Bab-Al Mandeb,\" he said.\nEuropean countries had pushed back against US threats to turn off American diesel, against a backdrop of the US-led war in the Middle East and reduced supplies from Russia and China.\nThe G7 leaders said they will also coordinate maintenance schedules to avoid multiple refineries being shut down at the same time, while encouraging countries with the capacity to do so to ramp up refining of diesel in particular.\nAvoiding a ban on US diesel exports will offer significant relief to countries which are reliant on imports of the fuel, including the UK, where prices at the pump topped £2 a litre for the first time on Friday.\nOver half of the UK's diesel is imported, with 31% of those imports coming from the US.\nThe US is one of the world's leading diesel suppliers, with domestic refineries churning out roughly four to five million barrels every day, according to the US Energy Information Administration (EIA).\nAmericans consume about 3.6 million barrels of that. Refiners export the remaining 1.2 to 1.5 million barrels per day, making the US a vital supplier to the global market.\n- Why UK diesel prices have breached the £2 per litre mark \n  - Published10 hours ago\nSupplies of diesel internationally have been heavily constrained by the conflict in the Middle East, which has restricted the flow of both crude oil and refined diesel onto global markets.\nRussia, which is also a major producer, has implemented its own export ban on diesel, following attacks on its refineries by Ukraine, further limiting supply. The G7 leaders stressed that they will maintain sanctions against Russia amid its ongoing war in Ukraine.\nDiesel is harder to refine than petrol and, because of its use in the haulage industry and agriculture, it is ", "translation_ja": "", "vocab": [{"word": "skyrocket", "definition": "急騰する、急上昇する。価格やコストが急激かつ劇的に上昇することを表す動詞。"}, {"word": "refrain from", "definition": "～することを控える、慎む。特に政策や行動において自制を示すときに使用する表現。"}, {"word": "haulage", "definition": "貨物運送、運搬業務。特にトラックなどの車両による商業的な物資輸送を指す業界用語。"}, {"word": "resilience", "definition": "回復力、レジリエンス。困難や危機から回復する能力、またはシステムが圧力に耐える強度を意味する。"}, {"word": "frontloaded", "definition": "前倒しされた、最初に集中した。時間的に後ろの部分を前に移すことで、早期に実行することを指す。"}]}, {"title_ja": "Riot police clash with students as education protests rage in France", "title_en": "Riot police clash with students as education protests rage in France", "summary_ja": "About 735 schools have faced disruption as violent protests over standards and lack of teachers continue.", "summary_en": "About 735 schools have faced disruption as violent protests over standards and lack of teachers continue.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck3r5dxxwqzpo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Riot police clash with students as education protests rage in France\n- Published\nRiot police have clashed with protesters as thousands of students demonstrating over education standards disrupted more than 700 schools in France.\nFires have burned in the streets as high school pupils and others objected to a lack of teachers, overcrowded classrooms and run-down buildings. Interior Minister Laurent Nuñez said 1,747 people were arrested on Friday.\nThe protests began last week in the capital Paris and have spread across the country, with cities including Montpellier, Nantes and Marseille affected.\nFrench Justice Minister Gérald Darmanin said things had \"gone from high-school student demonstrations to a public order disturbance\".\n- School protests send shivers down French government's spine \n  - Published11 hours ago\nDarmanin said that 735 of France's 3,700 schools were now affected \"one way or another\" by the violent protests.\nAnnouncing the arrests late on Friday, Nuñez told France's TF1 television network: \"We are sliding into riot and urban violence, and we are using all intermediate means to put an end to it.\"\nMeanwhile, Education Minister Édouard Geffray said the movement had been hijacked by non-students.\nHe told French broadcaster BFMTV that teachers had said \"the people in front of me were not my students\".\nEarlier on Friday, a 17-year-old was arrested on suspicion of attempted homicide after protests in Belfort, north-eastern France, where a police officer was targeted.\nBBC Verify has now authenticated two videos that show the man, who was later identified as an officer by a minister, being beaten up.\nIn the graphic footage, a group of young men are seen chasing him. The officer falls to the ground, and is subsequently punched and kicked multiple times in the head.\nAt least 65 staff members have been injured in the unrest, the education ministry said.\nIn the Paris suburb of Pantin police charged at protesters and made arrests after projectiles where thrown at officers.\nMeanwhile, in Strasbourg tear gas was deployed as police feared conditions would become more hostile, according to the Reuters news agency.\nRubbish bins have also been set on fire in Rennes and Paris.\n\"As far as we're concerned, we've won - our school is closed this morning,\" Lola, a 16-year-old protester, told the AFP news agency on Friday.\nShe said police actions had made things worse.\n\"It makes us even angrier - the police have no right to hit us or use tear gas on us,\" she added.\nPolice published pictures of some of the items they had seized from demonstrators, including petrol bombs, an axe and so-called mortar fireworks.\n\"Significant damage\" had been done to school facilities, the education ministry said, after attacks on school gates, entrances and fences.\nNelson Mandela high school in Nantes suffered more than €2m (£1.7m) damage, according to the regional government, after fire destroyed its glass entrance and some areas inside the school.\nThe blockades and protests started last week before spreading to hundreds of schools across the country.\nStudents say school hours are too long, classrooms too hot and too many members of staff are off work.\nIt comes at a crucial time for French President Emmanuel Macron, six months before next year's presidential election.\nBudget cuts planned, which will impact on education funding, have infuriated the young protesters.\nParents have also been worried that their children have become caught up in a wave of violence and unrest.\nAt the Claude Monet school in southern Paris, 53-year-old Anya was looking for her son.\n\"We banned him from coming. I hope he isn't here, but he did leave the house,\" she told AFP. \"We're afraid the situation might escalate.\"\nDarmanin said prosecutors had been asked to hold parents liable for damage caused by their children and \"pay for repairs\".\nMany French unions have given their support to the protesting students.\nEducation union SNEP-FSU, public services union SNUEP-FSU and Solidaires have all called for members to support them.\nSolidaires Trade Union Federation said in a statement: \"Let's not let them fire on our children.\n\"Secondary school pupils have the freedom of assembly, association and demonstration.\"", "translation_ja": "", "vocab": [{"word": "disrupted", "definition": "通常の活動や秩序を妨害・中断させること。ビジネスや社会システムの正常な機能を阻止する状態を指す。"}, {"word": "hijacked", "definition": "本来の目的や支配権を奪い取ること。政治的な運動が当初の意図と異なる目的に乗っ取られた場合に使用される。"}, {"word": "authenticated", "definition": "真正性を確認・検証すること。情報やデータが信頼できる情報源であることを公式に認めるプロセスを意味する。"}, {"word": "deployed", "definition": "戦略的に配置・展開すること。軍事や警察が資源や人員を特定の場所に配置する際に用いられる正式な用語。"}, {"word": "projectiles", "definition": "投げられた物体や飛行体を指す。銃弾や投石などの飛行物を指す正式な用語。"}]}, {"title_ja": "US murderer Christa Pike unconscious and on ventilator after failed execution, lawyers say", "title_en": "US murderer Christa Pike unconscious and on ventilator after failed execution, lawyers say", "summary_ja": "As of Thursday night, Pike remained critically ill and is being treated at a hospital in Nashville, Tennessee.", "summary_en": "As of Thursday night, Pike remained critically ill and is being treated at a hospital in Nashville, Tennessee.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3kgqw7zvz47o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "US murderer Christa Pike unconscious and on ventilator after failed execution, lawyers say\n- Published\nWarning: This article contains details that readers may find distressing\nTennessee death row inmate Christa Pike was unconscious, intubated and on a ventilator on Thursday night, after authorities failed to execute her by lethal injection, her lawyers say in court filings.\nPike, 50, was injected with two lethal doses of pentobarbital on Wednesday but remained alive. She was then sent to hospital in an ambulance.\nPike remained critically ill and was being treated at a Nashville-area hospital.\nLawyers for Pike, who was sentenced to death in 1996 for the murder of Colleen Slemmer, are seeking to have her sentence commuted after the failed execution attempt.\nPike's lawyers filed an emergency motion on Friday to preserve \"any and all evidence\" related to her botched execution.\nHospital staff are working to save her life and clear the drug used, pentobarbital, from her system, the filing states.\nDuring the execution attempt, prison officials tried to start intravenous (IV) lines by using at least seven needles on Pike, according to her lawyers.\nAt one point, Pike herself offered guidance of where they could try.\n\"One needle was bent in a 90-degree angle when it was removed,\" the filing states.\nWhile receiving the two doses, \"she could be heard crying, whimpering, and breathing loudly throughout the procedure\", her lawyers said.\nTennessee Governor Bill Lee ordered an independent review into Pike's botched execution and he halted all executions in the state for the year.\nThe state's department of correction has defended the method it used, saying \"the protocol does not allow for additional procedures beyond what was carried out\".\nAuthorities are yet to say whether they will try again to execute Pike. They have not not offered any explanations about what went wrong.\n- What happened in the failed execution of Christa Pike - and what next? \n  - Published1 hour ago\n- I've seen nearly 500 executions - but never one like Christa Pike's \n  - Published9 hours ago\nPike's attorneys previously warned that her conditions, including thrombocytosis (a blood-clotting condition) and small veins meant there was a risk she would experience \"unnecessary\" pain and suffering during a lethal injection.\nIn the latest filings, her lawyers allege that \"at no point did any member of the execution team realise that the IV lines were not correctly placed or that the veins had blown and that the pentobarbital was, in whole or in part, entering Ms Pike's body\".\nThey are requesting that all relevant physical, written and electronic evidence is preserved.\nDr Joel Zivot, an anaesthesiologist advising Pike's defence team, said two doses of pentobarbital was enough that \"she would have surely died\" had it entered her bloodstream in normal circulation.\nThe only possible explanation for her survival, Zivot said, \"is that the pentobarbital blood level was never high enough to cause death\" and that blisters on her arm after the botched execution indicated a ruptured vein.\nSo, instead of entering Pike's bloodstream, he said, the pentobarbital was more likely to have spread across the tissue under her skin.\nPike's medical condition of thrombocytosis may have also played a role, forming blood clots at the injection site that would potentially block pentobarbital from entering her veins.\nRegarding the possibility the pentobarbital was degraded, Zivot explained that if this was the case, it could be due to factors including poor manufacturing or improper storage.\nThe attempted execution went ahead after multiple failed, last-minute legal challenges by Pike's lawyers.\nThe US Supreme Court thwarted two separate efforts to stop the lethal injection.\nTennessee's governor also denied a clemency request from Pike, the only woman on the state's death row.\nPike was 18 when she and her then-boyfriend, Tadaryl Shipp, beat, tortured and killed 19-year-old Slemmer in 1995.\nShe was sentenced to death the following year after a media frenzy around the killing in Knoxville, Tennessee.\nBefore the killing, Pike had accused Slemmer of insulting her and trying to steal her then-boyfriend.\nPike's boyfriend and co-defendant Shipp was 17 at the time so was spared the death penalty under state law. He was given a life sentence with the possibility of parole and remains in prison.", "translation_ja": "", "vocab": [{"word": "intubated", "definition": "気管に挿管されている状態を意味し、呼吸を補助するためにチューブを気道に挿入されていることを指す。医療用語として使用される。"}, {"word": "commuted", "definition": "刑罰が軽減または変更されることを意味し、特に死刑から終身刑などへの減刑を指す。法律用語。"}, {"word": "botched", "definition": "計画や実行が失敗に終わる、または不手際で台無しになることを意味する。日常会話でも使用される。"}, {"word": "thrombocytosis", "definition": "血液中の血小板数が異常に多い医学的状態を指し、血液凝固障害の一種である。医療専門用語。"}, {"word": "protocol", "definition": "公式な手順や規則、特に医療や科学の分野で従うべき標準的なプロセスを指す。"}]}, {"title_ja": "Widdecombe suspect charged with planning terror act against Farage", "title_en": "Widdecombe suspect charged with planning terror act against Farage", "summary_ja": "Counter terror police say the further charge comes after a \"hugely intensive and complex investigation\".", "summary_en": "Counter terror police say the further charge comes after a \"hugely intensive and complex investigation\".", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cv1j3lgrl6gko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Widdecombe suspect charged with planning terror act against Farage\n- Published\nThe man accused of murdering Ann Widdecombe has also been charged with preparing acts of terror including against Reform UK leader Nigel Farage.\nCounter terror police said Joshua Kerry, 28, was charged on Friday with one count of preparation of terrorist acts.\nThe charge relates to activity which is alleged to have taken place between May 2024 and July 2026.\nKerry was charged in July with the murder of 78-year-old Widdecombe, a former Conservative minister and Reform UK spokeswoman.\nHome Secretary Shabana Mahmood said she knew the fresh charge would be \"extremely concerning\" and her \"profound sympathies\" were with Farage and his family.\n\"Let no one make any mistake: an attack on anyone in politics is an attack on us all.\n\"This case raises serious questions about the security of those in public life. We must use this as an opportunity to reset. Once parliament returns, I will update on our work to strengthen protections for those who choose to serve.\"\nThe BBC contacted Reform UK for comment and a party source said: \"This is exactly why Nigel needed £5m to protect his security for life.\"\nFarage is currently facing a parliamentary standards watchdog probe into a £5m gift from a billionaire donor before he returned as an MP in 2024. The Reform leader has previously said the money was for his personal security.\nCounter Terrorism Policing Deputy Assistant Commissioner Vicki Evans said the charge on Friday was the result of a \"hugely intensive and complex investigation\".\n\"This investigation has been led by a dedicated team of detectives, analysts, and forensic experts, working on multiple lines of enquiry, which has resulted in this very serious charge,\" she added.\nKerry, from Rotherham, is due to appear in court over the terror charge on Wednesday, police said.\nFrank Ferguson of the Crown Prosecution Service's Special Crime and Counter Terrorism Division said prosecutors \"worked closely\" with police to bring the charge and would continue to work alongside them as the investigation continued.\nWiddecombe was found dead on Thursday 9 July at her home in Haytor, Devon, having sustained serious injuries.\nShe served as Conservative MP for Maidstone in Kent for 23 years and was appointed to ministerial roles in Sir John Major's government in the 1990s.\nFollowing her departure from the Commons, Widdecombe appeared on the BBC's Strictly Come Dancing and would later become a Reform UK spokeswoman.", "translation_ja": "", "vocab": [{"word": "preparation of terrorist acts", "definition": "テロ行為を準備すること。法的には、実際のテロ攻撃を実行する前段階の準備行為を犯罪として処罰する規定。"}, {"word": "parliamentary standards watchdog", "definition": "議会の倫理・規範を監視する独立した監視機関。政治家の行動が適切かどうかを調査する権限を持つ。"}, {"word": "intensive investigation", "definition": "詳細で徹底的な調査。多くのリソース・専門家・時間を投入して行われる複雑な捜査。"}, {"word": "Crown Prosecution Service", "definition": "イギリスの公訴官制度。独立した検察機関として刑事事件の起訴と公判を担当する。"}, {"word": "lines of enquiry", "definition": "調査の筋道や捜査方向。複数の異なるアプローチから事件を調査していくこと。"}]}, {"title_ja": "Men charged over alleged plot to target Manchester Jewish community", "title_en": "Men charged over alleged plot to target Manchester Jewish community", "summary_ja": "The pair were arrested in the Northern Quarter area of the city on the eve of Yom Kippur.", "summary_en": "The pair were arrested in the Northern Quarter area of the city on the eve of Yom Kippur.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqx29nke55kno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Men charged over alleged plot to target Manchester Jewish community\n- Published\nTwo Iranian nationals who arrived in the UK by small boat have been charged with terror offences over an alleged plot to target the Jewish community in Manchester.\nRahman Salehi, 35, of Salford, and Salam Ahmadyan, 36, from Liverpool, are accused of preparing to commit an act of terrorism or assisting another to commit an act of terrorism on or before 20 September.\nThe men were arrested in Manchester's Northern Quarter on the eve of Yom Kippur, considered the holiest day in the Jewish calendar.\nHome Secretary Shabana Mahmood said news that two Iranian men had been charged over the alleged plot would be \"deeply distressing\" to Manchester's Jewish community, as the city marks one year since the Heaton Park Synagogue attack.\nCounter Terrorism Police (CTP) allege the two men were in contact with a third-party overseas, who may be in Iran, in relation to the plot.\nAccording to CTP, the men are accused of obtaining instructions to make a chlorine bomb, acquiring liquids, components and equipment for such a device, researching potential targets and conducting reconnaissance of potential locations for attack.\nIt is understood the suspects arrived via small boat in 2020 and 2023. One was granted asylum, and the other has a live asylum claim.\nHome Secretary Shabana Mahmood said: \"These recent events are a stark reminder of the threats posed against this country from both terrorists and foreign state actors.\n\"Two suspects have been charged with planning a terrorist attack against Jewish communities in Manchester.\n\"This news will be deeply distressing for our Jewish communities, coming so soon after Rosh Hashanah and Yom Kippur.\n\"I know this will be especially true in Manchester, as we mark one year since the terrorist attack at Heaton Park Synagogue.\n\"The fact both suspects arrived by small boat several years ago is a reminder of the importance of our relentless work to tackle illegal migration into this country. While numbers are down, I know there is more we must do.\n\"It would be inappropriate to comment further on this case. But I can say that we will be unrelenting in our efforts to protect our Jewish communities, root out antisemitism in this country, and maintain our border security.\"\nAs part of the investigation, searches were carried out at addresses in Epworth Street, Liverpool, and Lancaster Road, Salford.\nGreater Manchester Police's Deputy Chief Constable, Terry Woods, said: \"We know this is particularly acute on the calendar anniversary of last year's terrorist atrocity at the Heaton Park synagogue, and during the Jewish High Holy days.\n\"Our ongoing and robust policing plans within the Jewish communities will endure, and the public can expect to see continued visibility with officers providing engagement and security.\"\nThe men are due to appear at Westminster Magistrates' Court on Saturday.\nGet in touch\nTell us which stories we should cover in Greater Manchester\nListen to the best of BBC Radio Manchester on Sounds and follow BBC Manchester on Facebook, external, X, external, and Instagram, external. You can also send story ideas via Whatsapp to 0808 100 2230.\nRelated topics\n  - Published5 days ago", "translation_ja": "", "vocab": [{"word": "alleged", "definition": "疑われている、申し立てられている。法的文脈で、まだ証明されていない告発や主張を表現する際に使用される。"}, {"word": "reconnaissance", "definition": "偵察、下見。軍事やセキュリティの文脈で、攻撃や作戦の前に行われる情報収集活動を指す。"}, {"word": "relentless", "definition": "容赦ない、絶え間ない。努力や活動が継続的で、決してやめることのない強い決意を表現する。"}, {"word": "stark reminder", "definition": "痛烈な警告、明白な警告。危険や問題の深刻さを強調する表現。"}, {"word": "unrelenting", "definition": "ゆるがない、執拗な。努力や圧力が継続的で、妥協や緩和がないことを示す。"}]}, {"title_ja": "Tories pledge to build 50,000 new prison places", "title_en": "Tories pledge to build 50,000 new prison places", "summary_ja": "The party says its proposals would stop prisoners being released early and cut crime.", "summary_en": "The party says its proposals would stop prisoners being released early and cut crime.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck9qrqq53nj3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Tories pledge to build 50,000 new prison places\n- Published\nThe Conservatives have promised to build 50,000 new prison places in England and Wales to stop criminals being released early, if they return to government.\nThe party said it would cost £2bn per year to build and run the new prisons, funded by spending cuts including to the foreign aid budget.\nOn Thursday hundreds of prisoners were released early, under new rules introduced to prevent jails reaching capacity, with around 4,500 due to be freed by next summer.\nLabour blamed the previous Tory government for leaving \"our criminal justice system at breaking point\" and said the party's proposals were not \"credible\".\nThe announcement comes as Conservative members gather for the party's annual conference in Birmingham, which begins on Sunday.\nPrisons in England and Wales have been running close to capacity for years, with the latest government figures showing they are 98% full.\nUnder the latest early release scheme, eligible prisoners can now be released on a community licence after serving one-third of their jail sentence.\nThose excluded include prisoners convicted of murder, manslaughter, a sexual or grooming-related offence, or a driving offence that led to a death.\nThe government has also effectively scrapped one-year jail terms.\nThe Tories said they would use extra prison capacity to reverse these measures.\nAn early release programme introduced by the previous Conservative government saw more than 10,000 prisoners freed early between October 2023 and September 2024.\nConservative leader Kemi Badenoch said: \"A violent criminal doesn't become less dangerous just because the government has run out of prison cells.\"\nShe added: \"[Labour's] answer is to let dangerous offenders out even earlier instead of building the prison spaces we need.\"\nLabour Party chairwoman Bridget Phillipson said: \"The Tories are taking the public for fools. Across 14 years in government, they added just 500 prison places and closed 23 prisons.\n\"Now Kemi Badenoch expects the British people to believe they'll build 50,000.\"\nMeanwhile, the Prison Governors' Association said \"long-term investment\" was needed and warned a \"staffing crisis\" would pose challenges to delivering new prisons.\nIf the party wins power, the Tories said they would introduce legislation early in the new Parliament to override planning and procurement barriers, allowing the process to be \"fast-tracked\".\nIt said the use of private finance would help speed up delivery and control costs.\nThere are currently around 89,000 useable prison places in England and Wales, according to the latest government figures.\nThe Tories said their proposals would increase this figure by more than 50%, with the vast majority of new places expected within the party's first Parliament in government - up to five years - and the full increase delivered within seven years.\nThe £2bn a year cost would be funded through savings in other areas, including cutting the aid budget by £1bn and reducing the budget of the Department for Culture Media and Sport by £1bn.\nThe Labour government has promised to add 14,000 extra prison space by 2031.\nThe Tories argued increasing prison places would cut crime and prevent reoffending by keeping serious criminals off the streets.\nShadow justice secretary Nick Timothy said: \"Prison works. It works by punishing and deterring, but most importantly by incapacitating.\n\"Prison should keep violent and repeat offenders away from the law-abiding public.\"\n- Tories aim to be election-ready ahead of party conference \n  - Published9 hours ago\nThe prison population has risen significantly in recent decades, partly as a result of longer sentences and more people being returned to prison for breaching the conditions of their release.\nSuccessive governments have pledged to increase the number of prison places - but delivery has often fallen short of those promises.\nNew prisons take years to build, often facing local opposition and obstacles in the planning process.\nThe Prison Governors' Association said: \"Building 50,000 cells is one thing; finding the thousands of experienced officers, governors and specialists needed to run them safely is quite another.\n\"Politicians have spent years announcing prison places while the service struggles with overcrowding, ageing infrastructure and staffing shortages. The real test is not how many places can be promised, but how many prisons can be operated safely, effectively, and sustainably.\"\n- Why are hundreds of prisoners being released early? \n  - Published1 day ago\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": [{"word": "pledged", "definition": "公約する、約束する。政治的な文脈で、実行を約束すること。"}, {"word": "capacity", "definition": "収容能力、最大許容量。ここでは刑務所が収容できる最大囚人数を指す。"}, {"word": "eligible", "definition": "適格な、資格がある。特定の条件を満たしており、何かを受ける資格がある状態。"}, {"word": "procurement", "definition": "調達、購買。政府機関が必要な物資やサービスを取得するプロセス。"}, {"word": "fast-tracked", "definition": "迅速に処理する、早急に進める。通常のプロセスをスキップして急速に進めること。"}]}, {"title_ja": "Christa Pike unconscious after failed execution — attorneys", "title_en": "Christa Pike unconscious after failed execution — attorneys", "summary_ja": "Lawyers for Christa Pike said she's unconscious and on a ventilator after a botched execution attempt. Pike is believed to be the first person to have survived the administration of lethal drugs in the modern era.", "summary_en": "Lawyers for Christa Pike said she's unconscious and on a ventilator after a botched execution attempt. Pike is believed to be the first person to have survived the administration of lethal drugs in the modern era.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/christa-pike-unconscious-after-failed-execution-attorneys/a-79526118?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Christa Pike unconscious after failed execution — attorneys\nOctober 3, 2026\nChrista Pike was unconscious and on a ventilator in a Nashville hospital in the hours after her bungled execution attempt in Tennessee, her attorneys said in a court filing on Friday.\nPike, who was sentenced to death for the 1995 murder of 19-year-old Colleen Slemmer, was audibly snoring after she was injected with two doses of lethal injection on Wednesday.\nThe court filing is the first account of what Pike went through in the hours after the botched execution attempt.\nPike's attorneys said they believed problems with the IV lines caused the lethal drug, called pentobarbital, to flow into her body instead of her bloodstream.\n\"Apparently at no point did any member of the execution team realize that the IV lines were not correctly placed or that the veins had blown and that the pentobarbital was, in whole or in part, entering Ms. Pike's body,\" they wrote in the court filing.\nInstead of \"remedying this failure,\" they prepared and administered a second dose of pentobarbital, her lawyers said.\nPike believed to be first person to survive administration of lethal drugs\nThere are now questions about what happens next and whether the state can attempt to execute Pike again given her medical state.\nTennessee Governor Bill Lee, a Republican, temporarily paused the state execution on Thursday, saying there would be a \"comprehensive, third-party review\" of the case.\nPike, who is 50 years old, was set to become the first woman executed in Tennessee in 200 years.\nShe is believed to be the first person to survive after being injected with lethal doses of execution drugs in the modern era of the death penalty, according to the Death Penalty Information Center.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "bungled", "definition": "失敗した、ぶざまにやり損なった。計画や実行がうまくいかず、ミスが生じた状態を指す。"}, {"word": "pentobarbital", "definition": "ペントバルビタール、強力な鎮静薬および麻酔薬。死刑執行の致死注射に使用される医薬品。"}, {"word": "lethal", "definition": "致命的な、死をもたらす。毒性や危険性が非常に高く、生命を奪う可能性を持つ。"}, {"word": "comprehensive", "definition": "包括的な、詳細な。広範囲に渡って詳しく調査や検査を行うことを意味する。"}, {"word": "paused", "definition": "一時的に停止した、中断した。通常は後に再開することが予想される状態。"}]}, {"title_ja": "North Korea fires ballistic missile into sea, Seoul says", "title_en": "North Korea fires ballistic missile into sea, Seoul says", "summary_ja": "North Korea fired a ballistic missile toward the sea off its east coast, the South Korean military has said.", "summary_en": "North Korea fired a ballistic missile toward the sea off its east coast, the South Korean military has said.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/north-korea-fires-ballistic-missile-into-sea-seoul-says/a-79526243?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "North Korea fires ballistic missile into sea, Seoul says\nOctober 3, 2026\nSouth Korea’s Joint Chiefs of Staff said North Korea fired a ballistic missile on Saturday.\n\"Our military detected a ballistic missile launched from the Wonsan area of North Korea toward the East Sea,\" the Joint Chiefs of Staff said, referring to the body of water also known as the Sea of Japan.\nThe test came amid heightened tensions between the countries.Land mine blasts injured three South Korean soldiers last month. South Korea and the US-led UN Command have said North Korean mines caused the blasts.\nOn Friday, Pyongyang's Kim Yo Jong, the influential sister of leader Kim Jong Un, dismissed Seoul's demand for an apology over the blasts in the Demilitarised Zone, the heavily fortified 4-kilometer-wide (2.5-mile) area between the two Koreas.\nSeoul called on Pyongyang to end efforts to fortify the border, including the use of mines and anti-tank barriers.\nKim Yo Jong called those demands \"utterly pathetic,\" adding that the North intended to cut ties with the South.\nThe projectile launch on Saturday came after weeks of North Korean military displays, including tests of a purported hypersonic missile system, live-fire exercises and the commissioning of a new warship.\nKim Jong Un has also continued to flaunt his growing nuclear program despite US calls to revive diplomacy.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "ballistic", "definition": "弾道に関する、または弾道兵器のことを指す。ミサイルや砲弾などが放物線を描いて飛ぶ特性に関連する用語。"}, {"word": "fortified", "definition": "防御を強化した、または要塞化された状態を示す。軍事的な防御施設や壁などを堅固にすることを意味する。"}, {"word": "commissioning", "definition": "新しい船舶や軍事兵器などを正式に運用開始すること。完成した装備を実戦配備する過程を指す。"}, {"word": "hypersonic", "definition": "音速の5倍以上の超高速を指す用語。主に最先端のミサイルや航空機技術の文脈で使用される。"}, {"word": "flaunt", "definition": "自慢げに見せつける、または故意に示威する。力や能力を誇示するために公然と行動することを意味する。"}]}, {"title_ja": "UK: Man charged with planning to attack Nigel Farage", "title_en": "UK: Man charged with planning to attack Nigel Farage", "summary_ja": "The suspect was already charged with the killing of Reform UK's Ann Widdecombe.", "summary_en": "The suspect was already charged with the killing of Reform UK's Ann Widdecombe.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/uk-man-charged-with-planning-to-attack-nigel-farage/a-79526078?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "UK: Man charged with planning to attack Nigel Farage\nOctober 2, 2026\nA man has been charged with planning acts of terrorism, including against far-right politician and Reform UK leader Nigel Farage, British police said.\n\"We have been running a hugely intensive and complex investigation for some time,\" Deputy Assistant Commissioner Vicki Evans said, saying the investigation resulted in \"this very serious charge.\"\nThe suspect, Joshua Kerry, was also charged with the murder of former MP and Reform UK spokesperson Ann Widdecombe.\nAccording to the prosecutor handling the case, Kerry allegedly hit Widdecombe on her head 21 times with a hammer while she had been eating lunch.\nWiddecombe's murder triggered reactions from across British politics, including demands to improve lawmakers' security arrangements.\nThe new charges against Kerry include one count of preparing acts of terrorism for actions allegedly carried out between May 31, 2024 and July 8, 2026.\nAccording to the police's statement, the 28-year-old suspect is due to appear in a London magistrates' court on October 7.\nApart from Widdecombe, two other politicians were murdered this decade. Labor's Jo Cox was murdered by a neo-Nazi sympathizer in 2016 and Conservative David Amees was killed in 2021 by an \"Islamic State\" supporter.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "intensive", "definition": "徹底的で綿密な調査や取り組みを指す。複雑で詳細な作業に多くの時間と資源を費やしていることを表現する際に使用される。"}, {"word": "allegedly", "definition": "証拠は不十分だが、告発されている行為や言及が事実であると信じられていることを示す副詞。法的文脈では被告人が有罪と証明される前の状況説明に用いられる。"}, {"word": "triggered", "definition": "特定の事象や行動が引き金となって、一連の反応や結果をもたらすことを意味する。因果関係を示す際に頻繁に使用される。"}, {"word": "sympathizer", "definition": "特定の思想や組織に共感し、支持する人物を指す。直接的な会員ではないが、その立場や目標に同調する者を表す。"}]}, {"title_ja": "Suspect in FlyDubai incident was previously identified as security risk: Officials", "title_en": "Suspect in FlyDubai incident was previously identified as security risk: Officials", "summary_ja": "The co-pilot of the FlyDubai plane who allegedly attacked its captain is an Omani national who was previously suspended by Oman Air as a security risk, sources say.", "summary_en": "The co-pilot of the FlyDubai plane who allegedly attacked its captain is an Omani national who was previously suspended by Oman Air as a security risk, sources say.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/suspect-flydubai-incident-previously-identified-security-risk-officials/story?id=136960488", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Christa Pike unconscious and on ventilator after botched execution: Attorneys", "title_en": "Christa Pike unconscious and on ventilator after botched execution: Attorneys", "summary_ja": "Christa Pike, 50, was sentenced to death after being convicted of the 1995 murder of 19-year-old Colleen Slemmer.", "summary_en": "Christa Pike, 50, was sentenced to death after being convicted of the 1995 murder of 19-year-old Colleen Slemmer.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/execution-lone-woman-tennessees-death-row-paused-federal/story?id=136893331", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Row erupts over Cairo mural depicting Tutankhamun and Nefertiti with dark skin", "title_en": "Row erupts over Cairo mural depicting Tutankhamun and Nefertiti with dark skin", "summary_ja": "Artwork created in Tahrir Square for Chinese president’s state visit to Egypt is painted over amid allegations it revived Afrocentric claims about pharaohs’ origins On the eve of the Chinese president Xi Jinping’s state visit to Cairo last month, the city authorities were busy removing a 66-metre-lo", "summary_en": "Artwork created in Tahrir Square for Chinese president’s state visit to Egypt is painted over amid allegations it revived Afrocentric claims about pharaohs’ origins On the eve of the Chinese president Xi Jinping’s state visit to Cairo last month, the city authorities were busy removing a 66-metre-lo", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/02/row-erupts-over-cairo-mural-depicting-tutankhamun-and-nefertiti-with-dark-skin", "state_media": false, "category": "政治", "full_text": "On the eve of the Chinese president Xi Jinping’s state visit to Cairo last month, the city authorities were busy removing a 66-metre-long mural from the esteemed guest’s line of sight.\nDepicting the Pharaoh Tutankhamun and Queen Nefertiti, the painting was among 40 murals commissioned to beautify the city for Xi’s arrival and was painted by a group of young volunteers, Rasmet Basma, in Tahrir Square.\nBut it drew a furious reaction for depicting the two historical figures with dark skin – angering those Egyptians who saw it as reviving Afrocentric claims about the 14th-century BCE pharaoh’s origins. The artwork vanished under fresh paint just hours before Xi landed.\nNow, Ahmed Moussa, the 22-year-old founder of Rasmet Basma, has admitted it was asked by the Cairo governorate to paint over its work, which had been prepared in just five days in late August.\nThe team used the AI programme ChatGPT to generate the designs, which volunteers then painted on to the wall.\nMoussa said Cairo’s deputy governor and the head of the district had visited the site throughout the process and were impressed by the murals – until controversy began to build on social media.\n“We used a golden-bronze tone that cast a kind of shadow on the faces at night, so they appeared dark-skinned,” Moussa said.\n“We acknowledge our mistake in not consulting specialists in archaeology and art.”\nAfrocentrism is a political movement asserting that ancient Egyptian civilisation was black African in origin and population.\nOne user asked whether anyone involved had “even seen what Nefertiti actually looked like”, while others accused Afrocentric groups of appropriating the images to claim Egyptians endorsed their theories.\nZahi Hawass, Egypt’s former antiquities minister, said the volunteers should not have been allowed to paint a city site as significant as Tahrir Square without expert oversight, and that the public outrage was justified.\n“Claims linking ancient Egyptian civilisation to sub-Saharan Africa are nonsense,” Hawass said.\n“Temple carvings from the late period show Egyptian kings depicted alongside captives from parts of Africa, Libya, Syria and Palestine, with the king himself not shown as dark-skinned,” he said.\nThis is just the latest episode in a long-running debate over the complexion of ancient Egyptians. In 2023, a Netflix documentary provoked discussion after casting a dark-skinned actor as Cleopatra, and a similar dispute flared in June 2024 after a guide reportedly gave an Afrocentric perspective of Egyptian history in Cairo’s Egyptian Museum.\nMonica Hanna, a prominent Egyptologist and assistant professor of archaeology at the American University of Iraq–Baghdad, labelled Afrocentric claims “pseudoscience”. She said Egyptian society had always been ethnically diverse, from Nubian communities in the south to Mediterranean populations in the north.\n“Egyptians were never one skin colour,” she said. “We are not snow-white, or the colour of cream.”\nWalid Mahmoud, an AI researcher and expert in African anthropology, said AI tools such as ChatGPT reflected whatever information was most widely shared online, rather than what was factually accurate.\nThey were built by companies in the US and Europe, he said, and the content they generated could shape how those audiences saw themselves.\n“That’s why we should never simply accept what it produces, especially when it comes to cultural identity and heritage,” Mahmoud said.\nMostafa Eissa, an art critic, said AI should remain a tool, never a decision-maker in its own right.\n“I favour using technology without abandoning the human element within the artist,” he said, warning that letting such tools substitute an artist’s own skill risked emptying a work of its originality.\n- This article is published in collaboration with Egab", "translation_ja": "", "vocab": [{"word": "esteemed", "definition": "尊敬された、高く評価された。敬意を持って扱われる人や物に対して使用される。"}, {"word": "commissioned", "definition": "正式に依頼する、発注する。特に政府や組織が公式に仕事を依頼する場合に使われる。"}, {"word": "furious", "definition": "激怒した、猛烈に怒った。非常に強い怒りの感情を表す。"}, {"word": "oversight", "definition": "監督、目配り、または意図しない見落とし。責任を持って監視・管理すること。"}, {"word": "appropriating", "definition": "不当に自分のものにする、横領する。または文化的背景を無視して利用することを指す。"}]}, {"title_ja": "Trump administration diverts human rights funds to push far-right agenda abroad", "title_en": "Trump administration diverts human rights funds to push far-right agenda abroad", "summary_ja": "Support such as for white Afrikaners and anti-communism reveals how US is redefining what qualifies as human rights With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that", "summary_en": "Support such as for white Afrikaners and anti-communism reveals how US is redefining what qualifies as human rights With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/30/trump-state-department-human-rights-fund", "state_media": false, "category": "政治", "full_text": "With hours left before the funding expires, the Trump administration is pushing to direct more than $175m of the state department’s flagship human rights fund to a slate of awards that includes a huge $40m grant for an anti-communism fund, support for a group advancing white Afrikaner rights in South Africa, a campaign against Brazil’s supreme court and programs that would reward ideological allies in Europe who protect “western civilizational norms”.\nOn Wednesday, the state department obligated the funds to the grantees hours before the deadline despite congressional concerns and requests not to do so, according to a source familiar with the negotiations. The state department declined to comment on questions from the Guardian specifically on whether it had obligated the funds and had “blown” holds from Congress due to concerns about the money’s use.\nCritics have focused on 43 awards of a combined $176.9m that will bolster rightwing and conservative causes around the world while probably angering US allies over interference in internal politics. The Guardian has seen a sample of the controversial grants, which make up most of the $205m in funding that Congress has appropriated for the entire Human Rights and Democracy Fund (HRDF).\nSources with knowledge of the grant process have told the Guardian that the awards were personally lobbied for by members of the Trump administration, and reflect interests that include JD Vance’s warnings of the collapse of traditional western values in Europe and Stephen Miller’s push against immigration and to support white minorities in countries like South Africa.\n“The story for me is the high-level – including White House-directed – attention on these programs,” said a person familiar with the discussions over the democracy awards. “These awards have been briefed at the highest levels of the department and have buy-in from the White House.”\nThe proposed awards represent a significant shift in US support for dissidents, human rights defenders and civil society groups under authoritarian governments. The new slate includes projects in wealthy nations, and those focused on opposition to regulation, Brexit, immigration, anti-communism, Christian protection and opposition to “gender ideology”, offering a window into how the Trump administration is redefining what qualifies as human rights and merits tens of millions of dollars in US foreign assistance.\n“Congress appropriated money for the democracy fund on a bipartisan basis to support defenders of human rights, to assist victims of human rights violations and to instead promote the growth of democracy abroad,” said Jeanne Shaheen, the top Democrat on the US Senate committee on foreign relations.\n“The Trump administration’s proposals would use taxpayer funds to promote far-right organizations and programs in established democracies. This is a waste of resources and undermines United States values and relations with democratic partners, including allies in Europe.”\nA Democratic congressional aide said Shaheen had maintained 10 holds on $22m of awards focusing on Brazil, South Africa, Nigeria, and the promotion of a rightwing ideology in the United Kingdom and in Europe. According to the aide, secretary of state Marco Rubio had personally signed a memo to disregard the holds and obligate the funds.\nThe largest award, of $40m, was directed to a consortium led by the Victims of Communism Memorial Foundation (VOC), an anti-communist non-profit that has received far smaller grants in the past. A state department vetting document seen by the Guardian records $96,997 in previous contracts in the last five years between the foundation and the department, all in the 2022 fiscal year, and notes that it had been vetted in 2019 in connection with tickets to the foundation’s gala. The vetting document also identifies Andrew Bremberg, a former Trump White House domestic policy adviser and US ambassador to the UN European office, as a “senior leader” of the foundation.\nIn July, ProPublica reported that Samuel Samson, a 27-year-old deputy assistant secretary overseeing the new grants, was linked to senior members of VOC through his studies at the Christian conservative Hillsdale College graduate program. (A state department official then told the outlet that the relationship had nothing to do with the grant).\nSamson has described the US and Europe as partners in a shared civilizational struggle. Samson toured Austria, the Czech Republic, Hungary and Slovakia last December – all countries that were floated to receive a $2m grant to counter migration weaponized by Russia and Belarus – and criticized NGOs that previous administrations had worked with for promoting what he called radical concepts, including gender theory and DEI.\nThe state department did not comment on individual grants but said the programs were still in “active deliberation”, that awardees would meet guidelines for federal grants, and that all programming would undergo a “standard ", "translation_ja": "", "vocab": [{"word": "obligated", "definition": "資金や予算を特定の目的に充当・配分することを公式に決定すること。行政用語として、予算を実際に支出することが決まった状態を指す。"}, {"word": "bolster", "definition": "支援や強化を通じて何かを強くすること。ここでは右派的な活動や原因を資金提供によって支援・強化することを意味する。"}, {"word": "dissidents", "definition": "政府や支配体制に反対する人々や活動家のこと。特に権威主義的な政権下で異議を唱える人々を指す。"}, {"word": "appropriated", "definition": "公式に予算や資金を割り当てること。議会が承認して特定の目的のために資金を配分することを意味する。"}, {"word": "redefining", "definition": "何かの定義や意味を新しく作り直すこと。従来の理解と異なる新しい解釈を与えることを表す。"}]}, {"title_ja": "South African leader urges men to speak up on gender-based violence after series of killings", "title_en": "South African leader urges men to speak up on gender-based violence after series of killings", "summary_ja": "President announces measures amid anger at authorities over recent murders of women South Africa’s president has called on men to take more responsibility for violence against women as he announced measures to tackle the problem, amid anger at authorities over a recent wave of murders. Cyril Ramapho", "summary_en": "President announces measures amid anger at authorities over recent murders of women South Africa’s president has called on men to take more responsibility for violence against women as he announced measures to tackle the problem, amid anger at authorities over a recent wave of murders. Cyril Ramapho", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/30/south-africa-gender-based-violence-women-killings", "state_media": false, "category": "政治", "full_text": "South Africa’s president has called on men to take more responsibility for violence against women as he announced measures to tackle the problem, amid anger at authorities over a recent wave of murders.\nCyril Ramaphosa acknowledged that not enough had been done to protect women. He said police would be reviewing unsolved murders, attempted murders and serious sexual offences against women and children, as well as producing a funded plan to reduce the forensic backlog for such cases, both within 60 days.\nIn a televised speech on Tuesday night, the president said local governments would have five months to address issues that compromised women’s safety, from broken streetlights to overgrown public spaces and abandoned buildings. He added that he had tasked five ministers to come up with a plan within 60 days to reduce alcohol-fuelled violence.\n“Alcohol does not cause gender-based violence and it can never excuse it. Responsibility always lies with the perpetrator,” Ramaphosa said. “But harmful alcohol use is a significant aggravating factor in interpersonal violence and it must be addressed as part of our wider prevention effort.\n“Women should not have to live in fear because government has failed to repair a light, clear a public space, process evidence or enforce a law.”\nSouth Africa has been gripped by grief and fury after the discovery of 11 women’s bodies dumped across Ekurhuleni, the municipality adjoining Johannesburg to the east, since 15 July. Eight of the women were found in the last three weeks, including Elizabeth “Tsontso” Moselakgomo, who was discovered on 12 September after she went missing when she went for a run after work.\nRamaphosa said suspects had been arrested in connection with three of the killings and that the other cases would not be left to go cold. He added that police had not found evidence that a serial killer was responsible for all 11 killings, but that all possibilities were still being investigated.\nHe directly addressed South African men, urging them to challenge relatives, friends and colleagues who harassed, humiliated or abused women. “It is time for good men to stop being silent men,” he said.\n“For too long, gender-based violence has been treated as a woman’s problem to solve. Women march, the women of our country organise, they speak out, they protest, they confront and they comfort survivors,” Ramaphosa said.\n“Women change their routes home. Avoid going out at night and warn one another about dangerous places and dangerous men. We have placed the burden of male violence on women. That must change.”\nActivists expressed their frustration that solid policy actions had not been taken years ago and scepticism that the measures Ramaphosa had announced would work.\nShenilla Mohamed, the executive director of Amnesty International South Africa, said: “These are not new issues and as a country we have been talking about ways to tackle the high numbers of [gender-based violence and femicide], especially since 2019 when women took to the streets to protest, and yet here we are again in the face of continued attacks against women.\n“Amnesty International South Africa also notes the timelines put in place by the president, but this will only mean something if it results in action, and if there are consequences for inaction.”\nMpiwa Mangwiro-Tsanga and Bafana Khumalo, of Sonke Gender Justice, an NGO, said: “Our concern … is that the response remains heavily weighted towards what happens after violence has already occurred.”\nThey added: “Investigating unresolved cases, processing forensic evidence and repairing unsafe public spaces are necessary, but they do not constitute a comprehensive prevention strategy. It is concerning that the president is asking municipalities to do what is actually their mandate and yet they do not deliver on these.”", "translation_ja": "", "vocab": [{"word": "perpetrator", "definition": "犯罪者や加害者のこと。特に悪質な行為の責任者を指す。刑事事件の文脈でよく使用される。"}, {"word": "aggravating", "definition": "状況を悪化させる、または問題を深刻にする要因のこと。既存の問題をさらに悪くする条件を表す。"}, {"word": "interpersonal", "definition": "人と人の間の、対人関係に関するという意味。個人同士の相互作用や関係を指す。"}, {"word": "forensic", "definition": "法医学的な、または司法捜査に関連する。犯罪捜査で証拠を科学的に分析する手法に関する用語。"}, {"word": "humanitarian", "definition": "人道的な、人類愛に基づく。人間の苦しみを軽減することを目的とした行動や政策に関連する。"}]}, {"title_ja": "Flydubai pilot recounts cockpit stabbing in call with Indian PM Modi", "title_en": "Flydubai pilot recounts cockpit stabbing in call with Indian PM Modi", "summary_ja": "Smit Machchhar recalls midair disaster after co-pilot&#039;s attack on Flydubai flight to Tel Aviv.", "summary_en": "Smit Machchhar recalls midair disaster after co-pilot&#039;s attack on Flydubai flight to Tel Aviv.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/2/flydubai-pilot-recounts-cockpit-stabbing-in-call-with-indian-pm-modi?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Flydubai pilot recounts cockpit stabbing in call with Indian PM Modi\nSmit Machchhar recalls mid-air disaster after co-pilot’s attack on flydubai flight to Tel Aviv.\nIndian pilot Smit Machchhar, who was stabbed by his co-pilot in an alleged attempt to crash a Flydubai flight to Tel Aviv, has shared a public account of how he managed to open the cockpit door and let passengers take control of the plane despite his injuries.\nSpeaking on Friday from a hospital bed in Abu Dhabi via video call with Indian Prime Minister Narendra Modi, Machchhar said that he knew the aircraft was going down as he lay bleeding on the floor.\n“I had suffered so many injuries that I had collapsed. At that time, I could feel that the aircraft was going down. I knew this was the last push, that the door was right there,” he said in a nearly 10-minute video released on the prime minister’s social media channels.\nHe added: “I was being hit even then, but I just opened the door and everyone came in.”\nMachchhar, who has 17 years of aviation experience, including 11 as a captain, said that experience helped him grasp what was happening even while wounded.\nHe told Modi he had recited a Hindu devotional prayer during the ordeal.\n“I know God himself saved me,” he said, in an emotional exchange with Modi, who is from the same home state of Gujarat.\nModi praised Machchhar’s bravery, saying his presence of mind had saved lives and the reputation of Indian pilots.\nMachchhar said he allowed passengers and crew to overpower the co-pilot and let a second pair of Flydubai pilots take control and land the plane in Tabuk, Saudi Arabia.\nThe Flydubai flight was carrying 174 people as it briefly plunged around 17,000 feet (5,180 metres) before it was brought back under control.\nUAE presidential adviser Anwar Gargash has called the incident a “terrorist act”, while Israeli Prime Minister Benjamin Netanyahu said the co-pilot had undergone “Islamist radical indoctrination” and appeared “suicidal”.\nUS President Donald Trump has warned that Iran would be “hit very hard” if found to be linked to the attack.\nThe United Arab Emirates has said it will launch an investigation into the incident.", "translation_ja": "", "vocab": [{"word": "recounts", "definition": "詳しく述べる、語り直す。過去の出来事や経験を詳細に説明する行為を指す。"}, {"word": "alleged", "definition": "主張されている、疑わしい。法的文脈で、証明されていないが申し立てられている事実に対して使用される。"}, {"word": "ordeal", "definition": "苦難、試練。特に困難で苦しい経験や状況を指す。"}, {"word": "indoctrination", "definition": "思想教育、洗脳。特定の信念体系を強制的に教え込むプロセスを意味する。"}, {"word": "plunged", "definition": "急落する、急速に下降する。飛行機が高度を急激に失う場合などに使われる。"}]}, {"title_ja": "Why Carney’s economic overhaul is clashing with Canada’s unions", "title_en": "Why Carney’s economic overhaul is clashing with Canada’s unions", "summary_ja": "Unions say proposed changes to Canada&#039;s labour laws could weaken workers’ right to strike.", "summary_en": "Unions say proposed changes to Canada&#039;s labour laws could weaken workers’ right to strike.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/economy/2026/10/2/why-carneys-economic-overhaul-is-clashing-with-canadas-unions?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Why Carney’s economic overhaul is clashing with Canada’s unions\nUnions say proposed changes to Canada’s labour laws could weaken workers’ right to strike.\nToronto, Canada: As Canadian Prime Minister Mark Carney races to make the country less dependent on the United States, attract billions in new investment and get major projects built faster, his economic overhaul is running into resistance from a group that says it wants many of the same things: organised labour.\nThe latest clash, over the right to strike, comes after months of mounting pressure on Ottawa from Washington, DC.\nUS President Donald Trump, since taking up a second term in office last year, has imposed steep tariffs on Canadian goods and weakened trade agreements – perilous moves as Canada has historically sent close to 80 percent of its exports to its southern neighbour. He has repeatedly piled on with the tariff threats to make Canada the 51st US state.\nCanada has responded with retaliatory tariffs, while a broader movement to “Buy Canadian” has taken hold. The hockey-inspired “elbows up” — meaning a readiness to defend against an opponent — has become a national rallying cry.\nWith trade talks stalled since August, Carney has moved with urgency to shore up the economy and invite new investments. Last month, he announced Bill C-39, known as the Building Canada Strong Act, promising to bring “speed, certainty and predictability” to investors.\nAlong with measures to speed up approvals for major projects, the bill would also give Ottawa clearer powers to intervene in legal strikes and lockouts in federally regulated workplaces — a provision that has put Carney on a collision course with unions.\nCanada’s largest unions have come together against the changes. The largest, the Canadian Union of Public Employees (CUPE), had its national executive go as far as voting to defy the bill’s proposed limits on the right to strike if it passes Parliament without amendments.\nCUPE National President Mark Hancock credited Carney’s handling of Trump and said the union’s 800,000 members, who work everywhere from hospitals to schools to municipal services, want to be part of “Team Canada”.\n“But at what cost?” he said in an interview with Al Jazeera.\nA fight over the right to strike\nThe controversy centres on Section 107 of the Canada Labour Code, which already gives the Labour Minister broad powers to step into disputes if needed to maintain “industrial peace”, end work stoppages and force the two sides into a binding arbitration.\nBeginning in 2024, Ottawa used the provision eight times to intervene in disputes involving airlines, Canada’s two largest railways, three major ports and Canada Post and again during the Air Canada dispute in 2025 when flight attendants went on strike.\nUnions have challenged the use of that law in court and had hoped the proposed C-39 would restrict, if not repeal, that clause while businesses wanted it strengthened.\nThe bill does neither. Instead, it introduces two conditions that the government would have to fulfil first before turning to Section 107.\nBefore stepping in, the government would have to appoint a special mediator, wait for a public report and consider whether a work stoppage is hurting the “national interest”.\nOnce a strike or lockout is underway, the minister could direct the Canada Industrial Relations Board to get operations running again and impose a binding process, such as arbitration.\nThe government says those steps put clearer guardrails around a power that already exists, and Carney has said the bill “absolutely reinforces the right to strike”, according to the Canadian Broadcasting Corporation.\nUnions have rejected this defence, pointing out that the meaning of “national interest” would ultimately be decided by the minister. They also argue that the prospect of government intervention is bound to change what happens at the bargaining table.\n“The political lesson that employers will draw from it is simple,” Larry Savage, a professor of labour studies at Brock University, told Al Jazeera. “Hold out long enough, emphasise the economic damage, and then Ottawa will remove the union’s leverage for you.”\nDisruption, Savage said, is precisely what gives a strike its power. “Every effective strike is disruptive,” he said.\nUnions say they have already seen employers expect Ottawa to intervene.\nTeamsters Canada alleges the Canadian National Railway (CN) and the Canadian Pacific Kansas City (CPKC) railroad companies were counting on Ottawa to step in when they locked out thousands of workers in 2024. Section 107 was invoked within hours.\n“Companies have gotten used to the idea that if there is a labour dispute, they can just wait for the government to intervene,” Christopher Monette, Teamsters Canada’s director of public affairs, told Al Jazeera.\nCUPE said it saw a similar dynamic at Air Canada in August 2025. Hancock said bargaining stalled after more than 10,000 Air Canada flight attendants voted overwhelmingly to strike", "translation_ja": "", "vocab": [{"word": "overhaul", "definition": "大規模な改革や刷新のこと。システム全体を根本的に改善する取り組みを指します。"}, {"word": "perilous", "definition": "危険で極めてリスクの高い状態を表す形容詞。経済的・政治的な脅威に直面していることを示します。"}, {"word": "retaliatory", "definition": "報復的な、相手の行為に対する反撃として行われることを意味する形容詞。対抗措置を示します。"}, {"word": "collision course", "definition": "衝突の方向に進むこと。対立や紛争が避けられない状況を比喩的に表します。"}, {"word": "intervention", "definition": "政府や当局が事態に介入し、影響を与えることを意味します。労使紛争への行政的な関与を指します。"}]}, {"title_ja": "Croatia vs England: UEFA Nations League – Kane, Modric, teams, form", "title_en": "Croatia vs England: UEFA Nations League – Kane, Modric, teams, form", "summary_ja": "Heavyweights England play away to Croatia, with captain Harry Kane going up against veteran Luka Modric.", "summary_en": "Heavyweights England play away to Croatia, with captain Harry Kane going up against veteran Luka Modric.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/10/2/croatia-england-uefa-nations-league-kane-modric-teams-form?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Croatia vs England: UEFA Nations League – Kane, Modric, teams, form\nHeavyweights England play away to Croatia, with captain Harry Kane going up against veteran Luka Modric.\nWho: Croatia vs England\nWhat: UEFA Nations League 2026-27, Group A3 match\nWhere: Rujevica Stadium, Rijeka, Croatia\nWhen: Saturday, October 3, at 6pm local time (16:00 GMT)\nHow to follow: Al Jazeera Sport will bring you all the build-up and live updates from 13:00 GMT\nAction in the Nations League continues this weekend with a matchday three tie between Croatia and England.\nWith a win and a defeat each, Croatia and England have both made a mixed start to this year’s competition.\nDrawn in a group alongside the reigning world champions Spain and minnows Czechia, Croatia and England find themselves in an interesting yet challenging pool.\nCaptain Harry Kane has led from the front for the Three Lions, excelling in front of goal alongside winger Anthony Gordon, while Luka Modric continues to defy age, still playing a vital role in Croatia’s midfield even at 41.\nAl Jazeera breaks down everything ahead of Croatia vs England:\nWhat is the UEFA Nations League?\nThe UEFA Nations League was founded in 2018 to reduce the number of meaningless friendlies and give nations competitive matches against top-ranked teams.\nIn this competition, countries from across Europe participate in a league structure which features promotion and relegation.\nHow have Croatia and England played in the Nations League?\nBoth Croatia and England have won once and lost once.\nCroatia started their Nations League campaign with a 2-1 win over Czechia in Prague before losing 4-1 to world champions Spain in Seville.\nEngland, on the other hand, fell 3-2 to Spain in their campaign opener in London before beating a 10-man Czechia side 2-0 in Prague.\nWhen did Croatia and England last meet?\nThey last met at the 2026 FIFA World Cup.\nEngland beat Croatia 4-2 in a World Cup group game on June 17 in Arlington, Texas. Captain Harry Kane scored a brace, while Marcus Rashford and Jude Bellingham scored a goal apiece.\nCroatia vs England: Head-to-head\n- Matches: 12\n- Croatia wins: 3\n- England wins: 7\n- Draws: 2\nCroatia vs England: Form guide\n(Last five games, latest results first)\nCroatia: L-W-L-W-W\nEngland: W-L-W-L-W\nWho are the top players to watch?\nLuka Modric and Ivan Perisic (Croatia): The evergreen Modric, very much the heartbeat of the Croatian midfield even at 41 years old, scored the opening goal in their away win in Czechia. Time and again, the captain has pulled the strings in the middle of the park, proving age is just a number. His fellow experienced teammate, Perisic, is also chipping in style, bagging back-to-back assists.\nHarry Kane and Anthony Gordon (England): The script for England has looked the same in the last two games: Gordon opens the scoring, and Kane follows suit. While that wasn’t enough to beat the mighty Spain, it did the job against Czechia. Can this dynamic duo strike again? The numbers swing in their favour – Gordon has five assists already for Barcelona this season, while Kane has scored six times for Bayern Munich.\nTeam news and predicted lineups\nCroatia\nCentre-back Martin Erlic is out injured until mid-October, and right-back Josip Juranovic is sidelined with illness.\nProbable Croatia XI: Dominik Livakovic; Josip Stanisic, Luka Vuskovic, Josko Gvardiol, Ivan Perisic; Luka Modric, Mateo Kovacic; Luka Sucic, Petar Sucic, Franjo Ivanovic; Dion Beljo\nEngland\nEngland are without left-back Nico O’Reilly, who withdrew from the squad with injury.\nProbable England XI: James Trafford; Trent Alexander-Arnold, Trevoh Chalobah, Marc Guehi, Lewis Hall; Elliot Anderson, Miles Lewis-Skelly; Bukayo Saka, Morgan Rogers, Anthony Gordon; Harry Kane\nCroatia vs England: TV channel, livestreaming\n- Croatia: gol\n- United Kingdom: ITV1\n- United States: FOX Sports, FuboTV, ViX\n- India: Sony Sports Network\n- Middle East and North Africa: beIN SPORTS\n- South Africa: DStv Stream\nYou can find your regional broadcaster on UEFA’s official broadcaster listing.", "translation_ja": "", "vocab": [{"word": "reigning", "definition": "現在のチャンピオンである、現職の。特にスポーツの文脈で、現在のタイトル保持者を指す表現。"}, {"word": "minnows", "definition": "小さな国や弱いチーム、とりわけ国際スポーツ競技において大国に対する弱小国を指す。"}, {"word": "defy", "definition": "～に抗う、克服する。ここでは加齢や困難に打ち勝つという意味で使われている。"}, {"word": "evergreen", "definition": "常に新鮮で活力のある、衰えない。スポーツ選手が年齢を重ねても優れたパフォーマンスを維持していることを表す。"}, {"word": "competitive", "definition": "競争的な、本気の。友好試合ではなく勝敗を争う真剣な試合という意味で使われている。"}]}, {"title_ja": "Taiwan receives 2 long-delayed US F-16Vs, awaits additional fighter jets", "title_en": "Taiwan receives 2 long-delayed US F-16Vs, awaits additional fighter jets", "summary_ja": "The two F-16V Block 70 jets landed at Chihhang Air Base in Taitung.", "summary_en": "The two F-16V Block 70 jets landed at Chihhang Air Base in Taitung.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/taiwan-receives-2-long-delayed-us-f-16vs-awaits-additional-fighter-jets/article71538631.ece", "state_media": false, "category": "社会", "full_text": "Taiwan on Friday received the first two of 65 F-16V fighter jets ordered from the US, the island's air force said, following years of delays.\nThe two F-16V Block 70 jets landed at Chihhang Air Base in Taitung. There are 63 more to be delivered. The self-ruled island, which is also claimed by Beijing as part of its territory, placed an order for the F-16Vs in 2019.\nTaiwan largely purchases arms from the U.S., its largest unofficial ally, to boost its defences in the face of a military threat from China. China sends fighter jets and ships toward the island almost daily. Taiwan's defence minister said on Tuesday that the island remains in continuous discussions with the US about its weapons sales.\nThe shipment is the first in a long list of backlogged U.S. orders worth almost USD 30 billion. The F-16Vs represent USD 8 billion, or roughly 25 per cent of the entire backlog, according to Taiwan Security Monitor at George Mason University.\nThe order had been delayed partly owing to production and supply chain issues.\nThe delivery of the jets comes as the island waits for the US administration to approve an additional USD 14 billion arms package.\nThat package has stalled after U.S. President Donald Trump met with China's President Xi Jinping in May. US defence sales to Taiwan are a major source of tension between the US and China. Beijing has repeatedly called for Washington to halt sales to Taiwan, with President Xi Jinping personally raising the issue.\nPublished - October 03, 2026 05:04 am IST", "translation_ja": "", "vocab": [{"word": "backlog", "definition": "処理待ちの仕事や注文の積み重なった状態。ここでは米国からの未納品の注文が大量に溜まっていることを指す。"}, {"word": "stalled", "definition": "停止・中断された状態。交渉や進行が一時的に止まったことを意味する。"}, {"word": "tension", "definition": "緊張状態や対立関係。国家間の政治的・外交的な葛藤を指す。"}, {"word": "self-ruled", "definition": "自治統治された、独立して統治される。政治的に独立した地位を持つ地域・国家を表す。"}, {"word": "boost", "definition": "増強する、向上させる。ここでは防衛能力を高めることを意味する。"}]}, {"title_ja": "FBI arrests Energy Department employee on charge of trying to support Iran-backed Houthis in Yemen", "title_en": "FBI arrests Energy Department employee on charge of trying to support Iran-backed Houthis in Yemen", "summary_ja": "Ashton Hamed Ellaboudy, 51, of Richland, Washington, was arrested on Thursday (October 1, 2026) and is due to make his first court appearance Friday. Court records do not list an attorney available to speak on his behalf.", "summary_en": "Ashton Hamed Ellaboudy, 51, of Richland, Washington, was arrested on Thursday (October 1, 2026) and is due to make his first court appearance Friday. Court records do not list an attorney available to speak on his behalf.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/fbi-arrests-energy-department-employee-on-charge-of-trying-to-support-iran-backed-houthis-in-yemen/article71538629.ece", "state_media": false, "category": "経済", "full_text": "A Department of Energy electrical engineer has been arrested on charges of providing support to the Iranian-backed Houthi rebels, including by buying materials for homemade explosives and drones and travelling to Yemen, the Justice Department said on Thursday (October 1, 2026).\nAshton Hamed Ellaboudy, 51, of Richland, Washington, was arrested on Thursday (October 1, 2026) and is due to make his first court appearance Friday. Court records do not list an attorney available to speak on his behalf.\nThe FBI says Ellaboudy had a goal of helping the Houthis improve their communications capabilities and traveled last September to Yemen, where the Houthis and Saudi-backed government forces are now engaged in renewed violence that has killed hundreds and displaced tens of thousands. The conflict began in 2014 when the Iran-backed rebels took over the capital, Sanaa, forcing the country's government to settle into exile in Saudi Arabia.\nUpon his return to the United States, authorities say, Ellaboudy told Customs and Border Protection officials that he was traveling back from Oman on a work trip and was part of a US government mission to inspect missile defense systems. But investigators interviewed Ellaboudy's supervisor, who reported having no knowledge of any international travel or of an Energy Department missile inspection program that Ellaboudy would have been assigned to, an FBI affidavit said.\nEllaboudy himself was recorded telling FBI informants, whom officials had introduced into the investigation, that he had to be smuggled into and out of Yemen and that he had hoped to reach the country's capital to make government-level connections, the affidavit says. He was ultimately unable to make it to Sanaa, the FBI said.\nThe FBI says investigators began looking into Ellaboudy after learning that he had purchased precursor chemicals commonly involved in the construction of homemade explosive devices, including acetone and sodium bisulfate, as well as parts used for drones.\nDuring the course of the investigation, the FBI says, he communicated with multiple informants — including one who purported to be a Houthi colonel — and provided advice and assistance on communications equipment.\nEllaboudy is charged under a law that makes it a crime to provide material support to a group designated by the United States as a foreign terrorist organization, of which the Houthis are one.\n“These allegations are so deeply disturbing that they almost defy imagination,” John Eisenberg, the assistant attorney general in charge of the Justice Department's National Security Division, said in a statement.\nPublished - October 03, 2026 04:53 am IST", "translation_ja": "", "vocab": [{"word": "precursor", "definition": "ある化学反応や製造プロセスの前段階で使用される物質。ここでは爆発装置製造の原料となる化学物質を指す。"}, {"word": "affidavit", "definition": "法廷に提出される宣誓供述書。事実を宣誓の下で証明する法的文書であり、調査や訴訟で重要な証拠となる。"}, {"word": "designated", "definition": "公式に指定または認定される。ここでは米国が公式にテロ組織として指定することを意味する。"}, {"word": "informant", "definition": "当局に情報を提供する人物、特に秘密裏に情報を収集するために当局側に配置された者。"}, {"word": "purported", "definition": "〜であると称する、〜であると主張される。必ずしも真実ではない可能性を含みながら、そう言われているという意味。"}]}, {"title_ja": "Ukraine denies F-16 crisis over maintenance and parts", "title_en": "Ukraine denies F-16 crisis over maintenance and parts", "summary_ja": "Kyiv pushed its Western allies for it
