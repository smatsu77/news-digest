to be given advanced fighter jets after Russia's full-scale invasion in February 2022 and finally received its first batch of F-16s two years later.", "summary_en": "Kyiv pushed its Western allies for it to be given advanced fighter jets after Russia's full-scale invasion in February 2022 and finally received its first batch of F-16s two years later.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/ukraine-denies-f-16-crisis-over-maintenance-and-parts/article71538623.ece", "state_media": false, "category": "社会", "full_text": "Ukraine on Friday (October 3, 2026) denied that it was facing maintenance and supply problems with its F-16 fighter jets, insisting that it can keep them in the air throughout winter.\nThe Wall Street Journal reported this week that delays in maintenance and a shortage of parts had grounded more than half of Ukraine's fleet, and all of its US-made aircraft could be affected by the year-end.\nKyiv pushed its Western allies for it to be given advanced fighter jets after Russia's full-scale invasion in February 2022 and finally received its first batch of F-16s two years later.\nThe jets are used to counter the threat from fast-moving jet-powered drones, which Russia is increasingly using across Ukraine, including the capital, Kyiv, and which are harder to shoot down.\nThe WSJ said there was a \"support failure\" because of the time it takes to inspect engines, hydraulics, fuel lines and other systems after 300 hours of flying.\nForeign ministry spokesman Georgiy Tykhy acknowledged that Ukraine's F-16s operate \"intensively and under demanding conditions\" and maintenance was \"challenging\".\n\"Certain components for this early F-16 variant are no longer in production and are becoming increasingly difficult to source,\" he wrote on X on Friday.\n\"However, recent reports alleging catastrophically low aircraft availability rates and excessively long maintenance turnaround times are simply false,\" he added.\nMr. Tykhy said overhauled aircraft from allies were now being delivered faster than before.\n\"We have full confidence in our industry partners and their ability to further optimise sustainment processes, ensuring the highest possible levels of F-16 readiness and availability during the coming winter months, when these capabilities will be needed most,\" he said.\nBelgian company Sabena Engineering, which services Ukraine's F-16s, also denied what it called \"erroneous reports citing significant delays in this critical maintenance program\".\n\"All appropriate measures are being proactively implemented, in collaboration with its government and industry partners, to maximise aircraft availability and return the aircraft to service,\" it said in a statement on Thursday.\nPresident Volodymyr Zelensky, who is pushing for advanced US-made Patriot interceptors to combat Russian drones and missiles, said on Tuesday that Belgium would supply three more F-16s by the year-end.\nPublished - October 03, 2026 04:42 am IST", "translation_ja": "", "vocab": [{"word": "grounded", "definition": "航空機が飛行できない状態にされること。ここでは、メンテナンスの問題でF-16戦闘機が飛行停止状態になっていることを示している。"}, {"word": "turnaround", "definition": "処理や修理などが完了するまでの期間のこと。特にビジネスや技術分野で、ある作業の開始から完了までの時間を指す。"}, {"word": "sustainment", "definition": "システムや機器などを継続的に維持・サポートすること。軍事用語では、装備品の継続的な保守・補給を意味する。"}, {"word": "proactively", "definition": "問題が起きる前に主体的に対応すること。受動的ではなく、積極的かつ先制的に行動する姿勢を示している。"}, {"word": "optimise", "definition": "効率性や性能を最大限に高めること。システムやプロセスを改善し、より良い結果を得るようにする。"}]}, {"title_ja": "Richard Warnica: Does Brad Bradford believe in anything other than himself? - Toronto Star", "title_en": "Richard Warnica: Does Brad Bradford believe in anything other than himself? - Toronto Star", "summary_ja": "Richard Warnica: Does Brad Bradford believe in anything other than himself? Toronto Star", "summary_en": "Richard Warnica: Does Brad Bradford believe in anything other than himself? Toronto Star", "source": "The Star", "tier": "pape lation_ja": "", "vocab": []}, {"title_ja": "Mbah dreams a Nigeria that earns patriotism, makes ‘japa a choice, not an escape’", "title_en": "Mbah dreams a Nigeria that earns patriotism, makes ‘japa a choice, not an escape’", "summary_ja": "Mbah spoke in Awgu during the swearing-in ceremony for the 2026 Batch C Stream of the National Youth Service Corps (NYSC) members deployed to Enugu State. The post Mbah dreams a Nigeria that earns patriotism, makes ‘japa a choice, not an escape’ appeared first on Premium Times Nigeria .", "summary_en": "Mbah spoke in Awgu during the swearing-in ceremony for the 2026 Batch C Stream of the National Youth Service Corps (NYSC) members deployed to Enugu State. The post Mbah dreams a Nigeria that earns patriotism, makes ‘japa a choice, not an escape’ appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/914171-mbah-dreams-a-nigeria-that-earns-patriotism-makes-japa-a-choice-not-an-escape.html", "state_media": false, "category": "社会", "full_text": "Governor of Enugu State, Peter Mbah, has charged Nigerians with collectively building a nation that earns the patriotism of young people, while also making migration a choice, not an escape route.\nMbah spoke in Awgu during the swearing-in ceremony for the 2026 Batch C Stream of the National Youth Service Corps (NYSC) members deployed to Enugu State.\nHe stressed that Nigeria’s extraordinary youth population could only become a demographic dividend if the nation creates the education, skills, jobs, enterprise and institutions that enable young Nigerians to convert their energy and talent into productivity and prosperity, hence the essence of the NYSC beyond experiencing other parts of Nigeria.\n“We often ask young Nigerians to be patriotic. But let us ask ourselves a more difficult question: How do we earn the patriotism of our young people if they feel excluded from their country’s promise?\n“Patriotism must be cultivated by creating a country in which young people can see a future for themselves.\n“We must provide quality education; create an enabling environment for enterprise; expand opportunities; make our institutions work.\n“We must build a country where merit is rewarded, hard work has meaning and dreams do not have to be exported before they can become reality,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMbah, however, urged the youth to never forget the demands patriotism makes of them, both in good and difficult times.\n“Patriotism also demands something from you. It demands that, even when the country is imperfect, you refuse to give up on its possibilities; that you criticise what is wrong without abandoning what can be made right; that you do not merely ask: ‘What can Nigeria give me?’ “But also ask: ‘What can I give Nigeria?’\n“Together, we can build a country where ‘japa’ is a choice, not an escape; where our young people can travel the world without feeling compelled to abandon home.\n“If you are called upon to teach, teach as though Nigeria’s future were sitting before you – because it is. And when you encounter the difficulties, do not simply ask: ‘When will Nigeria change?’ Ask the more powerful question: ‘What can I do to change Nigeria?’ That is the question of citizenship,” he emphasised.\nHe assured them of their welfare, safety and comfort in Enugu State, reminding them that Enugu is a state rich in cosmopolitan history, and where every citizen could attain any height he or she is capable of.\n“The Government of Enugu State will continue to work with the NYSC authorities to provide a conducive, secure and supportive environment for your service. We will pay particular attention to your welfare, safety and the conditions under which you discharge your responsibilities across the state.\n“But, importantly, note that you are not strangers in Enugu. Our history offers remarkable testimony. When Enugu was elevated to municipal status in 1952, Mallam Umaru Altine, a Fulani man from Sokoto, became its first Mayor.\n“It tells us that in Enugu, where you come from need not determine how far you can go; that belonging is not always about birthplace; that citizenship is also about contribution,” he assured them.\nSpeaking earlier, the NYSC State Coordinator, Mrs Oluwakemi Awolola, on behalf of the Director-General of the agency, Brigadier-General Olakunle Nafiu, said a total of 2,101 corps members had been registered under Batch C, and thanked Governor Mbah for improved welfare of Corps members and for making their environment conducive and safe.\n“I am pleased to report that a total of 2,101 prospective corps members, comprising 983 males and 1,118 females, have been successfully registered for the 2026 Batch ‘C’ Stream/Orientation Course in Enugu State. Their level of cooperation, enthusiasm, and willingness to participate in camp activities have been commendable.\n“We remain particularly grateful for your administration’s unwavering commitment to the welfare, security, and general wellbeing of Corps members.\n“Of particular significance is the ongoing comprehensive intervention and overhaul of facilities at the NYSC Orientation Camp, Awgu, as well as improved welfare support and allowances, which you have graciously promised serving corps members,” she stated.\nThe Commissioner for Youth and Sports Development in Enugu State, Lloyd Ekweremadu, and the Chairman of Awgu, the host LGA, Hon. Uchenna Okolo, assured the corps members that the state and LGAs would continue to work collaboratively with the NYSC authorities to ensure they have the best service experience in Enugu State.\nThe new corps members were sworn in by the Chief Judge of Enugu State, Justice Afojulu Ozoemena, represented by Justice Anthony Onovo. The event featured a parade by the Batch ‘C’ intakes.\nMbah also used the occasion to tour the NYSC Orientation Camp, Awgu, where he inspected completed and ongoing projects ", "translation_ja": "", "vocab": [{"word": "demographic dividend", "definition": "人口増加による経済的利益のこと。若い労働力が豊富な国家が経済成長を実現する潜在能力を指す。"}, {"word": "cultivated", "definition": "意図的に育成・醸成する、という意味。ここでは愛国心を国民の中で育てることを表現している。"}, {"word": "enabling environment", "definition": "ある活動や成長を可能にする支援的な状況・環境のこと。企業活動やイノベーションが起こりやすい条件を指す。"}, {"word": "compelled", "definition": "やむを得ず～させられる、強制される、という意味。ここでは若者が故郷を離れることを余儀なくされることを表している。"}]}, {"title_ja": "Jigawa recruits additional 2,000 secondary school teachers", "title_en": "Jigawa recruits additional 2,000 secondary school teachers", "summary_ja": "The state government presented appointment letters to 2,020 newly recruited teachers, comprising 1,100 appointed on permanent and pensionable terms and 920 engaged under the J-Teach programme. The post Jigawa recruits additional 2,000 secondary school teachers appeared first on Premium Times Nigeria", "summary_en": "The state government presented appointment letters to 2,020 newly recruited teachers, comprising 1,100 appointed on permanent and pensionable terms and 920 engaged under the J-Teach programme. The post Jigawa recruits additional 2,000 secondary school teachers appeared first on Premium Times Nigeria", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/914160-jigawa-recruits-additional-2000-secondary-school-teachers.html", "state_media": false, "category": "政治", "full_text": "The Jigawa State Government has expanded its teaching workforce with the formal presentation of appointment letters to over 2,000 newly recruited secondary school teachers, adding to the thousands of teaching staff recruited over the past three years as part of its efforts to strengthen the education sector in the state.\nThe event featured the presentation of appointment letters to 2,020 newly recruited teachers, comprising 1,100 appointed on permanent and pensionable terms and 920 engaged under the J-Teach programme.\nGovernor Umar Namadi, who presided over the presentation at the Banquet Hall of Government House, Dutse, said the intervention was aimed at addressing shortages of qualified teachers and improving pupil–teacher and student–teacher ratios across the state, particularly in underserved rural communities.\n“Barely a month ago, we provided school uniforms, bags, and writing materials to thousands of learners across the state to improve access and strengthen learning conditions. Today, we complement that investment by expanding the teaching workforce and directing qualified teachers to schools where shortages are most acute, particularly in underserved rural communities. This occasion therefore marks another purposeful step towards better teaching, improved learning outcomes, and a stronger future for every child in Jigawa State.”\nThe governor said the appointments represented another stage of the administration’s effort to strengthen the teaching workforce while creating employment opportunities for qualified young people.\nGovernor Namadi said the government’s investment in education must go beyond infrastructure and learning materials, stating that the importance of having sufficient numbers of qualified and motivated teachers in schools cannot be overemphasized.\n“More than ever, in a rapidly changing world powered by information and communication technology, people need the knowledge, skills, and tools that quality education provides to thrive the knowledge, skills, and tools that quality education provides. This enduring reality explains why we continue to commit a significant proportion of our annual budget to education. It also means our investments in classrooms, furniture, instructional materials, technology, and school governance must be matched by enough qualified, motivated, and properly supported teachers.”\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe said the state government would continue to give attention to teacher development, including induction, continuous training and retraining, improved teaching methods, and professional development through the Teacher Development Agency.\n“This intervention fulfils a commitment made at the inception of our administration: to improve unfavourable pupil–teacher and student–teacher ratios through the recruitment of qualified teachers, sustained training and retraining, and a more balanced deployment policy. The objective is not simply to increase staff numbers but to ensure that every school—particularly those in underserved rural communities—has the right mix of personnel to deliver effective teaching and meaningful learning.”\nThe governor said the latest appointments were part of a broader expansion of the teaching workforce since the beginning of his administration.\n“Since 2023, the J-TEACH pathway has brought 7,500 personnel into basic education, with 3,000 subsequently converted to permanent and pensionable appointments after training and a competitive selection process. At the post-basic level, nearly 2,000 personnel entered through the same programme, and 1,000 later secured permanent status. These efforts were reinforced by deploying more than 2,100 graduate teachers and employing about 600 teaching and non-teaching staff for mega schools and other boarding senior secondary schools across the state.”\nHe assured the new appointees that the government would provide the necessary support while urging them to demonstrate professionalism, discipline, and commitment to the interests of learners.\n“Government will support you with effective induction, mentoring, supervision, and fair performance assessment,” he said.\nThe governor also commended Guaranty Trust Bank for donating 450 bicycles to pupils and students who travel long distances to schools in hard-to-reach communities, saying the intervention would help ease the burden of daily travel and improve access, punctuality, attendance, and retention among affected learners.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "intervention", "definition": "問題解決や状況改善のための意図的な行動や介入。ここでは教育部門を強化するための政府の具体的な施策を指す。"}, {"word": "acute", "definition": "(問題が)深刻で緊急を要する状態。ここでは地方の教師不足が深刻であることを示している。"}, {"word": "workforce", "definition": "組織や地域で働く人々の集団。ここでは教育現場で働く教師全体を指す。"}, {"word": "enduring", "definition": "長く続く、永続的な。時の経過に耐える普遍的な性質や真実を表す。"}, {"word": "proportion", "definition": "全体に占める部分の割合やバランス。ここでは予算の中で教育に充てられる割合を指す。"}]}, {"title_ja": "Nigeria @ 66 : Uba Sani grants clemency to 27 prisoners", "title_en": "Nigeria @ 66 : Uba Sani grants clemency to 27 prisoners", "summary_ja": "According to the Chief Law Officer of Kaduna State, previous exercises were carried out on New Year's Day, during Democracy Day and Independence Day celebrations. The post Nigeria @ 66 : Uba Sani grants clemency to 27 prisoners appeared first on Premium Times Nigeria .", "summary_en": "According to the Chief Law Officer of Kaduna State, previous exercises were carried out on New Year's Day, during Democracy Day and Independence Day celebrations. The post Nigeria @ 66 : Uba Sani grants clemency to 27 prisoners appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/914158-nigeria-66-uba-sani-grants-clemency-to-27-prisoners.html", "state_media": false, "category": "社会", "full_text": "Governor Uba Sani has granted clemency to 27 inmates in correctional facilities across Kaduna State to mark Nigeria’s 66th Independence anniversary, in an effort to give deserving inmates the opportunity to rebuild their lives.\nA statement issued by the Commissioner for Information and Culture, Ahmed Maiyaki, on Friday, stated that the latest clemency brings the number of beneficiaries to more than 500 since the Governor assumed office.\nMaiyaki added that the intervention included the release of eligible inmates as well as the payment of fines and compensation of over N300 million for victims since 2023.\nThe statement quoted the State Attorney-General and Commissioner for Justice, Sir James Kanyip, as saying that the latest exercise is part of the Governor’s practice of extending mercy to deserving inmates on national occasions.\nAccording to the Chief Law Officer of Kaduna State, previous exercises were carried out on New Year’s Day, during Democracy Day and Independence Day celebrations.\nHe said the prerogative of mercy was exercised through established processes, taking into consideration accountability, rehabilitation and the responsibilities that come with freedom.\nKanyip said the beneficiaries were expected to return to society with a renewed sense of responsibility and appreciation of their obligations to others.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe statement said the payment of fines and compensation is also intended to give the clemency a restorative justice dimension by addressing barriers to the release of deserving inmates while recognising the interests of victims.\nIt said the interventions were based on the belief that public safety, human dignity, rehabilitation and the possibility of redemption should form part of the administration of justice.\nThe statement added that clemency goes beyond freeing inmates from custody, as it also provides an opportunity for beneficiaries to reconnect with their families and communities.\nThe statement further said the administration would continue to support rehabilitation, reconciliation and the reintegration of deserving inmates into society.\nAccording to the statement, the government remains committed to a justice system that protects society, respects victims’ interests and gives deserving individuals an opportunity to become responsible and productive members of their communities.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "clemency", "definition": "罪人に対する刑罰の減免または赦免。特に政治指導者が権限を使って行う慈悲深い措置を指す。"}, {"word": "prerogative", "definition": "特定の人物や立場にのみ与えられた特別な権利または特権。ここでは長官の法的権限を意味する。"}, {"word": "restorative justice", "definition": "犯罪被害者と加害者の関係修復、および被害者への補償に焦点を当てた司法制度のアプローチ。"}, {"word": "reintegration", "definition": "社会から離れていた人々が社会に再び統合されるプロセス。特に受刑者の社会復帰を指す。"}, {"word": "intervention", "definition": "問題解決のために外部から行われる積極的な介入や支援活動。ここでは政府の施策を意味する。"}]}, {"title_ja": "How FlyDubai Passengers and Crew Averted Disaster After Pilot Was Stabbed During Flight", "title_en": "How FlyDubai Passengers and Crew Averted Disaster After Pilot Was Stabbed During Flight", "summary_ja": "A badly wounded Indian pilot managed to unlock the cockpit door. Four Israeli men teamed up to overwhelm an attacker and avert disaster.", "summary_en": "A badly wounded Indian pilot managed to unlock the cockpit door. Four Israeli men teamed up to overwhelm an attacker and avert disaster.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/02/world/middleeast/flydubai-attack-timeline.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Argentina’s ‘Golden Passport’ Program Offers Citizenship in Exchange for Foreign Cash", "title_en": "Argentina’s ‘Golden Passport’ Program Offers Citizenship in Exchange for Foreign Cash", "summary_ja": "The program would grant citizenship to people who make major investments in Argentina. Similar efforts have yielded significant income for small economies, but have also led to risks.", "summary_en": "The program would grant citizenship to people who make major investments in Argentina. Similar efforts have yielded significant income for small econo n": "US to announce sweeping sanctions against International Criminal Court — The Times", "summary_ja": "According to the report, supporters of the court fear this could lead to its dissolution", "summary_en": "According to the report, supporters of the court fear this could lead to its dissolution", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2197017", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "FACTBOX: What is known about the prisoner attack on Russian prison guards", "title_en": "FACTBOX: What is known about the prisoner attack on Russian prison guards", "summary_ja": "The attack left one convoy officer dead and three others wounded", "summary_en": "The attack left one convoy officer dead and three others wounded", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2197015", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Trump’s Great Oil Heist", "title_en": "Trump’s Great Oil Heist", "summary_ja": "Venezuela’s hopes for a democratic transition are fading as the US works to take control of its vast oil wealth. Billions in US and foreign investment could strengthen the chavista regime and give future American presidents powerful incentives to preserve the political status quo.", "summary_en": "Venezuela’s hopes for a democratic transition are fading as the US works to take control of its vast oil wealth. Billions in US and foreign investment could strengthen the chavista regime and give future American presidents powerful incentives to preserve the political status quo.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trump-oil-deals-threaten-to-undermine-venezuela-democratic-transition-by-cristina-ramirez-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Trump’s Great Oil Heist\nVenezuela’s hopes for a democratic transition are fading as the US works to take control of its vast oil wealth. Billions in US and foreign investment could strengthen the chavista regime and give future American presidents powerful incentives to preserve the political status quo.\nLONDON—When the United States ousted Venezuelan President Nicolás Maduro earlier this year and put him in a New York jail cell, Venezuelans at home and abroad rejoiced. For the first time in 27 years, the country faced a real possibility of regime change. But removing an autocrat does not necessarily dismantle the authoritarian system that kept him in power, particularly when the man who removed him is an aspiring authoritarian and kleptocrat in his own right.", "translation_ja": "", "vocab": [{"word": "kleptocrat", "definition": "汚職や横領によって私的利益を得ることで知られる指導者や政治家のこと。権力を利用して国民の資産を盗む者を指す。"}, {"word": "dismantle", "definition": "システムや組織を段階的に破壊または解体すること。物理的な構造物だけでなく、政治体制や制度などの抽象的なものにも用いられる。"}, {"word": "incentive", "definition": "特定の行動を取るよう動機づける報酬や利益のこと。個人や団体が望ましい結果に向かうよう促す要因を指す。"}, {"word": "authoritarian", "definition": "権力が少数者または一人の支配者に集中し、個人の自由が制限される政治体制を特徴とする。民主的でない統治スタイルを示す。"}, {"word": "chavista", "definition": "ベネズエラの故ウゴ・チャベス前大統領の政治イデオロギーや政策を支持する人々を指す。左翼的で反米的な立場を取ることが多い。"}]}, {"title_ja": "Global AI Oversight Now", "title_en": "Global AI Oversight Now", "summary_ja": "AI is already concentrating enormous economic power and deepening existing inequalities, yet governments lack the institutions and expertise needed to govern it. They should establish an international AI body that can set standards and coordinate a collective response to threats no country can handl", "summary_en": "AI is already concentrating enormous economic power and deepening existing inequalities, yet governments lack the institutions and expertise needed to govern it. They should establish an international AI body that can set standards and coordinate a collective response to threats no country can handl", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-governance-can-no-longer-wait-by-gabriela-ramos-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Global AI Oversight Now\nAI is already concentrating enormous economic power and deepening existing inequalities, yet governments lack the institutions and expertise needed to govern it. They should establish an international AI body that can set standards and coordinate a collective response to threats no country can handle alone.\nPARIS—Several years ago, Mariana Mazzucato and I asked a simple question: Who is in charge if something goes wrong in the AI world? The question remains unanswered, even after the United Nations Security Council met last week to discuss the existential risks posed by AI.", "translation_ja": "", "vocab": [{"word": "concentrating", "definition": "経済力や権力などを一箇所に集中させることを意味します。ここでは、AIが少数の企業や国に経済的権力を集中させている状況を描写しています。"}, {"word": "deepening", "definition": "問題や状況をより悪化させたり、深刻にすることを意味します。この文脈では、既存の不平等がさらに悪化していることを示しています。"}, {"word": "existential", "definition": "存在そのものに関わる、または人類の存在を脅かすような致命的な性質を持つことを意味します。AIが人類の存在自体に対するリスクをもたらす可能性を指しています。"}, {"word": "coordinate", "definition": "複数の団体や国などが協力して、統一された行動や対応を取ることを意味します。ここでは、各国がAIの脅威に対して協力して対応することを示しています。"}]}, {"title_ja": "Climate Resilience Starts With Care", "title_en": "Climate Resilience Starts With Care", "summary_ja": "Climate shocks can disrupt services that millions of vulnerable people rely on, yet care is largely absent from adaptation plans and national funding estimates. Investing in climate-resilient care can prevent cascading health and economic crises while creating jobs and easing pressure on public budg", "summary_en": "Climate shocks can disrupt services that millions of vulnerable people rely on, yet care is largely absent from adaptation plans and national funding estimates. Investing in climate-resilient care can prevent cascading health and economic crises while creating jobs and easing pressure on public budg", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/leaving-care-out-of-climate-adaptation-plans-will-come-at-a-high-cost-by-caren-grown-2-and-kendall-trelegan-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Climate Resilience Starts With Care\nCaren Grown and Kendall Trelegan\nClimate shocks can disrupt services that millions of vulnerable people rely on, yet care is largely absent from adaptation plans and national funding estimates. Investing in climate-resilient care can prevent cascading health and economic crises while creating jobs and easing pressure on public budgets.\nWASHINGTON, DC—It is getting harder by the day to justify the slow pace of adaptation to climate change. Last year was one of the hottest on record, with economies and communities around the world disrupted by extreme heat, heavy rainfall, and tropical cyclones. As November’s United Nations Climate Change Conference (COP31) in Turkey approaches, governments must move beyond climate commitments and focus on implementation.\nFinancing for adaptation activities remains nowhere near what is needed. The UN Environment Programme estimates that developing countries will need $310–365 billion per year through 2035, putting the current funding gap at $280 billion. Getting the money to where it can do the most good may be an even bigger challenge, as institutions struggle to identify adaptation investments that are ready to implement and whose risks can be properly assessed and priced.\nIn a new working paper, we argue that estimates of funding needs and proposed investment pipelines overlook a critical piece of infrastructure: an ecosystem of climate-adapted care services that helps families prepare for, cope with, and recover from climate-induced hazards. Properly designed, these services can bolster household and community resilience. The same principle underpins investments in early-warning systems and adaptive social protections designed to help countries respond to climate shocks.\nProvisional estimates suggest that at least 35,000 excess deaths occurred across Europe during this summer’s severe back-to-back heat waves. Despite their well-developed welfare systems, the absence of climate-adapted physical infrastructure and coordinated services contributed to this excess mortality.\nYet national climate-adaptation plans rarely account for what happens when care breaks down. Floods and wildfires displace families and separate caregivers from the people who depend on them. When household-based care is no longer possible, formal care can become a lifeline for older people and people with disabilities who cannot evacuate or manage on their own. Without reliable care services, health issues can lead to otherwise preventable hospital admissions, putting even more pressure on already strained services.\nAs matters stand, family caregivers are left to shoulder the burden, facing injury and burnout during prolonged emergencies. Some, most of them women, are forced to leave paid work just when their families can least afford to lose income. When care systems fail, a climate shock can quickly become both a health and economic crisis. Strong care systems can prevent these cascading failures, making care a crucial part of climate resilience.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nLeaving care out of national adaptation plans thus means underestimating what climate resilience actually requires. Admittedly, anticipating those needs is difficult, as there is no standard definition of what qualifies as adaptation, and national estimates are often based on individual projects, most of them in conventional sectors.\nThat sector-by-sector approach allows care to fall through the cracks. Agriculture, forestry, fishing, water supply, and sanitation account for nearly 40% of global adaptation finance, while health receives an estimated 4–6% and education around 2%. Long-term care and early-childhood care and education are essentially absent, particularly in low- and middle-income countries, where most care is provided informally.\nDespite being too low, the $310–365 billion figure is already baked into national plans and multilateral-development-bank targets. But as climate shocks intensify, people will need more care, not less. And when formal services fall short, unpaid caregivers—overwhelmingly women and girls—will end up filling the gap.\nOur paper proposes a way to begin correcting that omission. For example, we estimate that building climate-resilient care infrastructure in Bangladesh would require an investment equivalent to roughly 3–5% of GDP, similar to what is needed for health and education. This is a substantial investment, but only a fraction of the estimated value of unpaid care work.\nBuilding that care infrastructure would require millions of workers. We estimate that early-childhood care and education and long-term care could directly employ 3.6–7 million people in Bangladesh. More jobs w", "translation_ja": "", "vocab": [{"word": "cascading", "definition": "連鎖的に次々と起こる、または波及する状況を表す。ある出来事が次の問題を引き起こし、さらにその先へと影響が広がることを意味する。"}, {"word": "ecosystem", "definition": "相互に関連し合う複数の要素から成る統合的な体系やシステムを指す。ビジネス用語としても、関連する企業やサービスの相互関係のネットワークを表す。"}, {"word": "bolster", "definition": "何かを強化する、支援する、または確実にすることを意味する。組織や計画などの力を増すために支持や資源を加える行為を表す。"}, {"word": "underpins", "definition": "基礎となる、あるいは支える役割を果たすことを意味する。特に理論や政策などが、その基盤となる原則や事実に支えられている状況を表す。"}, {"word": "resilience", "definition": "困難や危機に直面した時に回復する能力、または適応力を指す。組織や社会が逆境から立ち直り、機能を継続する力を意味する。"}]}, {"title_ja": "Trump is disappearing refugees into the hands of torturers – and rewarding them handsomely | Tutu Alicante and Uzra Zeya", "title_en": "Trump is disappearing refugees into the hands of torturers – and rewarding them handsomely | Tutu Alicante and Uzra Zeya", "summary_ja": "Refugees from third countries are being sent to Equatorial Guinea, where they are often sent back to the very countries they fled For nearly a year, the Hotel Bamy in Malabo, Equatorial Guinea, has been Adam’s prison. He is confined alone to a hotel room, under constant watch by the security officer", "summary_en": "Refugees from third countries are being sent to Equatorial Guinea, where they are often sent back to the very countries they fled For nearly a year, the Hotel Bamy in Malabo, Equatorial Guinea, has been Adam’s prison. He is confined alone to a hotel room, under constant watch by the security officer", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/02/trump-refugees-equatorial-guinea-torture", "state_media": false, "category": "オピニオン", "full_text": "For nearly a year, the Hotel Bamy in Malabo, Equatorial Guinea, has been Adam’s prison. He is confined alone to a hotel room, under constant watch by the security officers and soldiers of a notoriously oppressive regime who control his movements. Not long ago, they barged into his room, handcuffed and beat him, and warned him not to tell anyone. There is no cell to point to, no charges or formal sentence, and nothing on paper to document his plight.\nAdam, 26, has chosen not to share his real name or even his country of origin out of fear for his safety. He fled indefinite, forced military conscription in his home country after enduring abuse during his military service.\nAdam sought safety in the United States. A US immigration judge heard his case, found that he would probably face persecution if forced to return to his country of origin, and issued a formal order shielding him from removal there. Then, in November 2025, the United States sent him to Equatorial Guinea, a country he had never set foot in and where torture reportedly occurs in every prison nationwide, according to the most recent state department human rights report. Adam, and the other men onboard the flight, were told they were being transferred to another US detention facility. It was only midway through the 13 hour and 10 minute flight that they found out – while shackled – that they were headed toward Equatorial Guinea.\nNone of this is happening in a vacuum. In November, the Trump administration repurposed $7.5m to pay the government of Equatorial Guinea to accept third country nationals from the United States, a 275% foreign assistance increase and departure from longstanding US policy against direct provision of aid to a deeply corrupt and abusive regime. Congress appropriated these taxpayer funds for humanitarian assistance for refugees in dire need – money that is now used to detain, shackle and eventually send refugees back to the countries they fled. Since then, the US government has forcibly transferred at least 65 third country nationals to Equatorial Guinea. US immigration judges had granted protection to nearly all of these individuals due to the high risk of persecution or torture they face in their countries of origin. Yet one by one, Equatorial Guinea has been sending them back to harm in the very places from which they fled.\nIn the past few weeks, in retaliation for speaking out against the detention conditions and police violence, police in Equatorial Guinea violently assaulted and arrested two of the refugees, witnesses and lawyers say, including Ahmed Soliman, an Egyptian man from Arizona who has lived in the United States since he was three years old, and Samson Birhane. Today, they remain in police custody, detained incommunicado.\nThis is part of an escalating scheme by the Trump administration to send immigrants and refugees to countries around the world where they have no connection and often face grave harm. In Equatorial Guinea, it is also fueling the corruption and impunity our organizations have spent decades documenting and countering.\nEquatorial Guinea’s government and ruling family are, by any measure, among the most corrupt on earth. About a decade ago, the US justice department settled a civil forfeiture case against the country’s vice-president, Teodoro Nguema Obiang Mangue, or “Teodorín”. He forfeited a $30m Malibu mansion, a Ferrari and Michael Jackson memorabilia.\nSome governments have rightly taken serious action to restrain Teodorín’s corruption, such as the sanctions the UK government imposed on him in 2021. Yet last September, the Trump administration did the opposite, and quietly paused corruption-related visa restrictions that had prevented Teodorín from traveling to the United States, clearing the way for him to meet with Christopher Landau, the US deputy secretary of state, before the deal to accept non-Equatoguineans removed from the United States.\nIn addition to these funds, the deal affords Teodorin something he has long sought: legitimacy and access in Washington DC.\nWe are seeing that access to US policymakers deepening in real time. Last week, Teodorín was back in New York, meeting with Landau again, this time at the United Nations, where they celebrated what the government of Equatorial Guinea referred to as a positive evolution of the bilateral relationship. They discussed expanding cooperation beyond energy to banking, trade investment, security and diplomacy.\nOur organizations have worked for years to demand accountability for rampant corruption in Equatorial Guinea, and now, to fight for the refugees and torture victims being unlawfully sent there. After building the evidentiary dossier that led to UK sanctions, EG Justice is now challenging Equatorial Guinea’s participation in the US deportation scheme before the African Commission on People’s and Human Rights, while working with local attorneys to offer legal and humanitarian aid. In July, the African Commission on Human and People’s", "translation_ja": "", "vocab": [{"word": "confined", "definition": "限定された場所に閉じ込められた状態。自由な移動が制限されている。"}, {"word": "oppressive", "definition": "抑圧的で、不公正に人々の自由や権利を奪う政権や支配。"}, {"word": "conscription", "definition": "徴兵制度。政府が国民に対して強制的に軍隊に入隊させること。"}, {"word": "repurposed", "definition": "元々の目的とは異なる新しい目的のために資金や物資を転用すること。"}, {"word": "retaliation", "definition": "危害や不当な扱いに対する報復行為。復讐的な行動。"}]}, {"title_ja": "AI weapons systems are already here. Algorithms must not decide who lives and dies | Kenneth Roth", "title_en": "AI weapons systems are already here. Algorithms must not decide who lives and dies | Kenneth Roth", "summary_ja": "Israel’s conduct in Gaza shows the danger of using AI in warfare. Humans must remain at the center of wartime decisions As tech leaders warn about the threats of artificial intelligence, most conjure up images of AI agents running amok , such as hacking systems used to run our critical infrastructur", "summary_en": "Israel’s conduct in Gaza shows the danger of using AI in warfare. Humans must remain at the center of wartime decisions As tech leaders warn about the threats of artificial intelligence, most conjure up images of AI agents running amok , such as hacking systems used to run our critical infrastructur", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/02/ai-weapons-systems-algorithms-war", "state_media": false, "category": "オピニオン", "full_text": "As tech leaders warn about the threats of artificial intelligence, most conjure up images of AI agents running amok, such as hacking systems used to run our critical infrastructure, banks or even militaries. Yet one serious danger is mentioned less frequently – the threat posed by AI–empowered lethal weapons. Fully autonomous versions of these weapons are colloquially known as killer robots.\nIsrael’s conduct in Gaza shows that, in an important respect, such AI weapon systems are already here. An algorithm has been deciding who lives and who dies.\nFor more than a decade, governments have been meeting in Geneva to stop the development of autonomous AI weapons. In early September, 128 governments met to approve a report that could serve as the foundation for a binding treaty.\nBut a collection of lawyers sent by Donald Trump and Vladimir Putin teamed up to water it down. Notably, they weakened a provision that requires humans to review military targets developed by AI before a strike.\nFully autonomous weapons remain the focus; the use of AI to determine targets for conventional weapons is not. At risk is the longstanding quest to maintain a “human in the loop” – that is, meaningful or effective “human control” of AI-empowered weaponry.\nFor many people, talk of killer robots conjures up images of Arnold Schwarzenegger’s The Terminator. I have often thought about the problem in the context of the Tahrir Square uprising at the height of the Arab spring that led to the ouster of the Egyptian president Hosni Mubarak.\nMubarak’s fate was sealed when the Egyptian army made clear it would refuse to fire on Egyptian protesters. But killer robots would have had no such qualms. If Mubarak had been able to deploy them, he might have stayed in power.\nThe negotiators in Geneva are not even addressing this problem. The Trump-Putin lawyers made sure that the agreed report referred only to war, not repression.\nToday, amid the drone warfare in eastern Ukraine, Russian and Ukrainian troops are experimenting with fully autonomous weapons to overcome jamming of the signals used to control drones. We can expect these nascent deployments to expand.\nYet the “killer robot” metaphor is deceptive. If we look at targeting decisions more expansively, AI has already taken over. In Gaza, the Israeli military is using AI to target Palestinians.\nIsrael has long monitored phone communications in that territory. After the Hamas attack of 7 October 2023, Israel used an AI system called “Lavender” to uncover patterns that it equated with the phone of a Hamas operative. People whose phones AI determined met these criteria could be killed.\nBecause it was easier to target suspects at home, a separate automated system called “Where’s Daddy?” tracked them there, meaning that their families were often killed too. There was no pretense that Hamas was using its operatives’ homes for military purposes. It was simply easier for the AI system to find suspected Hamas fighters where they slept. The families were the collateral damage.\nTheoretically, a human remained in the loop because an AI-picked target was routed through intelligence officers who approved it and sent it to others who launched the attack. In fact, this human role was nominal.\nIn the past, Israeli targeting decisions were subject to significant review. But in Israel’s killing spree that followed the Hamas attack, the intense demand for targets took precedence over such review.\nIsraeli intelligence officers who received the AI selections routinely passed them to the attackers without second guessing. As one officer described: “I would invest 20 seconds for each target at this stage, and do dozens of them every day. I had zero added-value as a human, apart from being a stamp of approval. It saved a lot of time.”\nFrom computer to killing, the human judgment exercised was perfunctory – a “rubber stamp”. In essence, an algorithm played God.\nOne Israeli officer suggested the practice might be justified because AI makes better decisions than humans do. It is dispassionate, while people’s judgment can be clouded, such as by the animosity toward all Palestinians that some Israelis felt after the Hamas attack.\nAs one Israeli soldier explained: “I have much more trust in a statistical mechanism than a soldier who lost a friend two days ago. Everyone there, including me, lost people on October 7. The machine did it coldly. And that made it easier.”\nYet AI algorithms are inevitably affected by human input. How much evidence is required to identify someone as a Hamas fighter? What margin of error is tolerated?\nThe answer to such questions depends on the judgment of the AI programmers and their commanders – ordinary Israelis who might have devalued Palestinian civilian life in the fury that followed the Hamas attack. Even the Israeli military conceded that about 10% of the human targets slated for assassination were not members of the Hamas military wing at all.\nThe Israeli president, Isaac Herzog, epitomize", "translation_ja": "", "vocab": [{"word": "autonomous", "definition": "自律的な、自動的な。人間の指示や制御を必要とせず、独立して動作することを意味する。特にAIやロボットの文脈で、人間の介入なしに判断・行動する能力を指す。"}, {"word": "lethal", "definition": "致命的な、死をもたらす。人命を奪う可能性のある危険性を持つことを表現する。武器や疾病などの文脈で使用される。"}, {"word": "binding", "definition": "法的に拘束力のある、守らなければならない。契約や条約が当事者に対して法的義務を課すことを意味する。"}, {"word": "provision", "definition": "条項、規定。契約書や法律文書における具体的な条件や要件のこと。"}, {"word": "qualms", "definition": "躊躇、ためらい、疑念。道徳的または倫理的な理由から何かをすることに対する不安や抵抗を感じることを表す。"}]}, {"title_ja": "Christa Pike survived her execution attempt. Tennessee must not try again | Austin Sarat", "title_en": "Christa Pike survived her execution attempt. Tennessee must not try again | Austin Sarat", "summary_ja": "What happened to Pike was gruesome. No one deserves what she went through, not even those who commit horrible crimes Botched executions are nothing new in US history . In the era when hangings were common, some condemned people were decapitated. Later, when the electric chair was in vogue, every now", "summary_en": "What happened to Pike was gruesome. No one deserves what she went through, not even those who commit horrible crimes Botched executions are nothing new in US history . In the era when hangings were common, some condemned people were decapitated. Later, when the electric chair was in vogue, every now", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/02/christa-pike-tennessee-execution-attempt", "state_media": false, "category": "オピニオン", "full_text": "Botched executions are nothing new in US history. In the era when hangings were common, some condemned people were decapitated. Later, when the electric chair was in vogue, every now and again, someone would catch fire during an electrocution. And nitrogen hypoxia, the US’s newest execution method, has already proven notoriously unreliable.\nBut, of all of the ways we have tried to execute people, lethal injection has the worst track record. More than 8% of all lethal injection executions have been botched. Most of them resulted when those charged with carrying them out could not find a usable vein.\nLast night, we entered uncharted territory when Christa Pike survived Tennessee’s effort to execute her with lethal doses of pentobarbital. It was the first time someone received a drug intended to kill them but did not die.\nRobin Maher, the executive director of the Death Penalty Information Center, told the New York Times: “This event is the worst we’ve seen and unlike any other botched execution in the modern era … There is no precedent.”\nMoreover, there is almost no precedent for what should happen next.\nWhatever fate awaits Christa Pike, one thing is clear. The state of Tennessee should not be allowed to try to execute her again.\nBeyond that, it is time to give up on the fantasy that this country will ever be able to find an execution technology that is safe, reliable and humane. We have not found one yet, and we never will.\nWhat happened to Pike was gruesome. No one deserves what she went through, not even those who commit horrible crimes.\nPike was sent to death row for one such crime. The Tennessean describes her crime this way. “Pike lured Slemmer to a wooded area near the University of Tennessee’s Agricultural Campus with the promise of marijuana. With the help of … [her boyfriend], Pike tortured Slemmer before beating her to death with a chunk of asphalt. A pentagram was also carved into her body.”\nPike was barely 18 years old at the time. She was herself the victim of violence and abuse throughout her life.\nAs the date of her execution drew near, Pike claimed that it should not go forward, because using lethal injection on her would be cruel. Little did she know what would be in store for her.\nAs allowed by its execution protocol, state officials in Tennessee administered two doses of pentobarbital that were supposed to be enough to end her life. However, as NBC notes, instead of killing her, it left her “snoring” and complaining about pain, as well as “kicking her feet so often that she knocked off the sheets laid on her”.\nAfter the Tennessee governor, Bill Lee, was contacted, he authorized the execution team to stand down, and Pike was taken to a hospital.\nThis is not the first time that Lee has received a call about an execution gone awry. In May, he had also agreed to stop the execution of Tony Carruthers when officials couldn’t find a vein for a backup IV.\nLee granted him a one-year reprieve.\nNow he and his colleagues in Tennessee will have to decide what to do about Pike. So far, he has only called a halt to the one other execution scheduled in the state this year and ordered a review of what happened during Pike’s execution.\nThat is not enough.\nThe last time someone survived when a method of execution that was supposed to kill them failed to do so was in 1946, when Louisiana tried to put a man named Willie Francis to death in the electric chair. Francis survived because the electric chair malfunctioned and the current wasn’t strong enough to kill him.\nHe sued the state to prevent it from trying again. But to no avail. The United States supreme court allowed Louisiana to put him in the electric chair again.\nWriting for the court, Justice Stanley Reed said: “Even the fact that petitioner has already been subjected to a current of electricity does not make his subsequent execution any more cruel in the constitutional sense than any other execution … The fact that an unforeseeable accident prevented the prompt consummation of the sentence cannot, it seems to us, add an element of cruelty to a subsequent execution.”\nFrancis was executed soon after.\nSince then, many other executions have been botched, but few have lived to tell about them.\nBetween 1946 and today, that has happened only nine other times, including with Pike. Four of those execution survivors were killed by a second execution attempt, while others escaped that fate. Some died on death row.\nIn another case, the state agreed not to try to execute the person a second time, and now three of them are still alive.\nTennessee had its chance to execute Christa Pike. It shouldn’t get to try again.\nTo do so would be a form of double jeopardy that is prohibited by the constitution. And it would be cruel.\nJustice Harold Burton, who dissented in the Francis case, got it right when he said that no one should be subject to a second execution. “The intent of the executioner,” Burton wrote, “cannot lessen the torture or excuse the result.” In his view, w", "translation_ja": "", "vocab": [{"word": "botched", "definition": "失敗した、台無しにした。医療行為や計画などが不適切に実行され、うまくいかなかったことを意味する。"}, {"word": "notoriously", "definition": "悪名高く、有名に。通常は否定的な意味で、広く知られた悪い評判や特性があることを表す。"}, {"word": "uncharted territory", "definition": "未知の領域、前例のない状況。これまで経験されたことのない新しい状況や分野を指す。"}, {"word": "precedent", "definition": "先例、前例。過去に起きた同様のケースや法的判例を指し、現在の状況の参考になるもの。"}, {"word": "gruesome", "definition": "凄惨な、身の毛もよだつような。極めて不快で恐ろしい、暴力的な光景を表現する。"}]}, {"title_ja": "Palestinians Want a Two-State Solution", "title_en": "Palestinians Want a Two-State Solution", "summary_ja": "A new majority—even in Gaza—support compromise with Israel.", "summary_en": "A new majority—even in Gaza—support compromise with Israel.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/palestinian-territories/palestinians-want-two-state-solution-gaza-israel-amaney-jamal", "state_media": false, "category": "オピニオン", "full_text": "In September 2025, U.S. President Donald Trump unveiled a peace plan to end the war in Gaza, vowing it would not only rebuild the devastated territory but also usher in “eternal peace in the Middle East.” A year later, the plan has stalled. Hamas has not disarmed. Israel still controls more than 60 percent of the strip. A promised technocratic government and international security force has not materialized, and large-scale reconstruction has barely begun; most Gazans still struggle to obtain food, water, and shelter. And as Israel’s October election approaches, the country’s prime minister, Benjamin Netanyahu, has hardened his position, rejecting a U.S.-backed disarmament deal. Although the 25-country Board of Peace—the mechanism Trump established to implement his peace plan—did announce a more detailed reconstruction program this week, high-level officials have told the Times of Israel and other outlets that the group has stopped pressuring Netanyahu to comply with the plan because of the upcoming vote.\nThis hard-line stance appeals to the majority of Israelis, who do not think that Palestinians are interested in negotiations or diplomacy. Surveys have repeatedly shown that Israelis overwhelmingly believe Palestinians do not want peace at all and, therefore, that Israel has no real negotiating partner. In July of this year, for instance, a Tel Aviv University poll asked Jewish Israelis what they think Palestinians want. Seventy-two percent said they believed Palestinians were “moderately or very opposed” to any peace negotiations, and over 80 percent said they believed Palestinians thought no peace with Israel was achievable.\nBut this perception completely distorts what most Palestinians believe and are prepared to accept. For two decades, Arab Barometer, a survey project that we help run, has carried out comprehensive polls of Palestinian public opinion in both the West Bank and Gaza. Our most recent broad survey, conducted in October 2025, showed that a majority of Palestinians regard diplomatic negotiations, not armed resistance, as the best way to resolve the Israeli-Palestinian conflict for good; conditions on the ground have not changed in a way that would meaningfully modify these findings, and they are backed up by questions asked this August by the Ramallah-based Palestinian Center for Policy and Survey Research (PCPSR), an Arab Barometer partner.\nIn fact, many Palestinians have a clear and realistic vision for the future. Far more of them support a two-state option than any other potential resolution. And Gazans, despite having borne the brunt of destruction over the past three years, tend to be the most pragmatic: an even greater proportion of them are open to a two-state solution than are Palestinians living in the West Bank, and half of Gazans would back Arab states’ normalization of diplomatic ties with Israel as long as the process includes tangible progress toward Palestinian self-determination. Palestinians’ confidence in both Hamas and the Palestinian Authority (PA) has also deeply eroded; they judge that neither faction has secured their safety or improved their lives, and they want political renewal. Strikingly, most Gazans express a wish to stay and help rebuild their devastated homeland rather than emigrate.\nGaza’s immediate situation is bleak. The conditions for Palestinians living in the West Bank are deteriorating rapidly. The status quo is not sustainable, despite there being no clear end to conflict in sight. But Palestinians’ own views offer glimmers of hope. Israelis have a chance to choose a new government more committed to negotiation. If such a government and international donors were to pursue a transition that treats Palestinian statehood as a central part of negotiations and recognizes Gazans’ desire for security and legitimate governance, Gazans are ready to compromise, as are many Palestinians in the West Bank. They are willing to work toward a new political order, but it must be just that: new.\nPALESTINIAN REALISM\nLast October’s Arab Barometer survey revealed just how desperate conditions had become in both Gaza and the West Bank—a security, economic, and humanitarian crisis that has not improved meaningfully since then. The survey polled 855 people in Gaza face-to-face in the respondents’ homes, shelters, or camps, and 800 in the West Bank face-to-face in the respondents’ homes. It began the same day that a formal cease-fire in Gaza was announced, providing a broad picture of the conditions confronting the strip’s rebuilding. Because of the survey’s timing, some questions that were asked in the West Bank and other countries across the Middle East (such as queries about domestic politics and social relations) were not asked in Gaza to make room for questions that would bring to light Gazans’ immediate needs. Since the 2025 Arab Barometer poll, no similar survey has been done to capture Gaza’s humanitarian situation; given the limited aid that has been allowed to enter", "translation_ja": "", "vocab": [{"word": "unveiled", "definition": "公開する、明らかにする。新しい計画や製品などを正式に発表すること。"}, {"word": "stalled", "definition": "停滞する、進まなくなる。進展や進行が止まった状態を指す。"}, {"word": "materialized", "definition": "実現する、具体化する。計画や約束が実際の形になること。"}, {"word": "hardened", "definition": "強硬になる、態度が厳しくなる。立場や姿勢がより厳格・強硬になることを意味する。"}, {"word": "distorts", "definition": "歪める、ねじ曲げる。事実や情報を本来の形から変えて不正確に表現すること。"}]}, {"title_ja": "Brazil’s Election Won’t Fix What’s Broken", "title_en": "Brazil’s Election Won’t Fix What’s Broken", "summary_ja": "Reckoning with the country’s real crisis.", "summary_en": "Reckoning with the country’s real crisis.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/brazil/brazils-election-wont-fix-whats-broken-matias-spektor", "state_media": false, "category": "オピニオン", "full_text": "The Brazilian presidential election, which kicks off with a first round of voting on October 4, gives citizens a choice between radically different visions of politics. Luiz Inácio Lula da Silva, known as Lula, the standard-bearer of the Latin American left, seeks a fourth presidential term against Flávio Bolsonaro, the son of Jair Bolsonaro, the hard-right former president who was sentenced to 27 years in prison for attempting to overturn the results of the previous presidential election. The race is also a contest over how Brazil should conduct its foreign affairs: Lula emphasizes strategic autonomy, including through growing ties with China and other partners, while Flávio Bolsonaro favors close alignment with the Trump administration in the United States.\nWhat unites the two candidates is the assumption that Brazil still has the freedom to choose its foreign policy strategy. Brazil’s vast resources, distance from active conflict, and influx of foreign direct investment should position it well to manage current global upheaval and great-power competition, and to effectively bargain for what it wants. But despite these valuable geopolitical assets, Brazil is losing global influence, and its autonomy to act is at risk. Major powers, including both China and the United States, are increasingly able to dictate their terms of engagement with Brazil. The country is also becoming isolated in South America, where it had until recently led the creation of regional institutions such as the trading bloc Mercosur. Its relationship with Argentina, for instance—which had helped underpin four decades of regional stability—has deteriorated to the point that neither country has an ambassador in the other’s capital.\nBrazil is largely responsible for its waning sway. Much of the country’s influence depends on whether foreign partners believe that the deals it strikes today will be implemented tomorrow. That credibility, in turn, rests on the state’s capacity to commit—that is, its ability to mobilize the resources needed to fulfill its promises, coordinate public institutions effectively, and ensure that the bargains it makes survive democratic political turnover. A raft of domestic problems, including mounting fiscal constraints, a political system at war with itself, and widespread corruption, has made it harder for the state to deliver. A major scandal has now engulfed the Supreme Court, an institution meant to enforce rules impartially and which is therefore essential to the durability of Brazilian commitments. The Trump administration’s open meddling in Brazil’s domestic politics has compounded the country’s vulnerabilities by making any deal controversial and partisan and raising the likelihood that future administrations in both Brasília and Washington might try to reverse it.\nWhoever wins the upcoming presidential election will inherit these sources of weakness. So far, the candidates have not offered any clear plan to address them. Neither a tilt toward Washington nor an embrace of multilateral diplomacy will solve the deeper problem that is eroding Brazil’s foreign policy autonomy and keeping it from turning its assets into real strength.\nRUNNING WILD\nBrazil has not always struggled to project credibility to the world. In the 1990s, the country’s economic stabilization plan brought down runaway inflation, its leaders consolidated and strengthened its democracy, and it signed agreements with Argentina on economic integration and nuclear safeguards that improved regional security. All these commitments persisted through multiple leadership transitions. In the eyes of powerful players such as Europe and the United States, Brazil was an appealing place for investment and a growing force in multilateral diplomacy.\nToday, however, what partners see is a country beset by dire fiscal problems, deeply fragmented domestic politics, and endemic corruption. Brazil’s economy is roughly the size of Canada’s and larger than Spain’s, and the government has a formidable capacity to tax its citizens and bring in revenue. But more than 90 percent of the federal government’s noninterest spending is mandatory, giving it little room for discretionary spending on areas such as infrastructure, which the country sorely needs to make use of its vast reserves of critical minerals. At the same time, the International Monetary Fund has projected that Brazil’s government debt will reach about 98 percent of GDP by the end of 2026. With real interest rates at about ten percent, servicing that debt is extraordinarily expensive, consuming resources that might otherwise be used to strengthen the country’s security forces or fund other strategic priorities.\nThe country’s fiscal constraints are making it harder to curb the transnational expansion of homegrown criminal gangs, a failure that forces other countries to manage Brazilian problems and further undermines the country’s credibility as a partner. Brazilian authorities do not have enough money ", "translation_ja": "", "vocab": [{"word": "standard-bearer", "definition": "ある運動や団体を代表する指導者を意味する。特に政党や思想の象徴的な人物を指し、その立場や価値観を体現する者。"}, {"word": "autonomy", "definition": "自主性や自律性を意味し、他国や外部勢力の支配を受けずに独自の判断で行動する能力や権利を指す。"}, {"word": "geopolitical", "definition": "地政学的な、つまり地理的位置と政治・経済力の関係性に基づく国際関係を扱う概念で、国家戦略や大国競争を分析する際に用いられる。"}, {"word": "credibility", "definition": "信頼性や信用を意味し、約束や契約の履行可能性に対する他者の信頼度合い。国際関係では国家が合意を実行する能力への信頼を指す。"}, {"word": "fiscal constraints", "definition": "財政上の制約や予算不足を意味し、政府の支出能力が限定されている状況を指す。"}]}, {"title_ja": "Why Iran Escalates", "title_en": "Why Iran Escalates", "summary_ja": "Tehran’s strategy to drive America out of the Middle East.", "summary_en": "Tehran’s strategy to drive America out of the Middle East.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/why-iran-escalates", "state_media": false, "category": "オピニオン", "full_text": "These, it might seem, are good days for the Islamic Republic of Iran. After years of being diplomatically isolated, economically strangled, and militarily assaulted, the Iranian regime came face-to-face with its nightmare scenario—a full-blown war with Israel and Washington—and survived. The United States began bombing Iran on February 28 with the goal of destroying the country’s nuclear program, its missile program, and even its government, only to fail spectacularly at each objective. In fact, Tehran may now be stronger than it was when the war began. It successfully seized the Strait of Hormuz and shuttered it, sending energy prices skyward. Its armed forces have proved capable of continuing to damage American military bases despite coming under heavy bombardment. U.S. support for the war, always weak, has fallen, and international anger at Washington has spiked. Little wonder, then, that many analysts think Tehran will stay the course over the coming year.\nIranian officials are no doubt proud of how their country has fared against Israel and the United States. They have publicly bragged about their success and even declared victory. But in private conversations, the regime’s elites remain quite nervous. They know that the United States has many tools and tactics it can use to increase the pressure on Iran, and they are concerned that the factors that seem to be holding Washington back—dwindling stockpiles of ammunition, domestic public opinion, and international opposition—could go away, grow manageable, or otherwise become unimportant to American officials.\nFor the United States, this might seem like good news. If Tehran still fears Washington, perhaps the U.S. government can pressure Iran’s leaders into making concessions. But this misreads the mood in Iran’s capital. The country’s elites have been hardened by the war, which killed their friends and family members. They see February 28, 2026, the same way Israelis see the October 7, 2023, attack by Hamas—as the moment their enemy proved willing to slaughter them, and thus as proof it must be permanently defeated. They never had much faith in American negotiators; now, they have virtually none.\nIran, then, is adopting a strategy toward the United States defined by escalation and continuous offense. That means it will neither stay the course nor compromise with Washington. Instead, it will start doing even more to hurt the economies of the United States’ regional partners and to decimate global energy markets, as well as expand its attacks on U.S. military infrastructure. It could try to assassinate American and Israeli officials. It may even launch ground offensives against its neighbors, including by trying to seize U.S. bases located in Gulf Arab countries.\nThis approach might fail to make the United States relent. But even if neither side can overpower the other right now and both accept a settlement, peace is unlikely to last. Tehran believes that Washington will regroup and, eventually, start fighting again. The regime is committed to responding forcefully to any American provocation, and perhaps even attacking without one. It does not think it can live with a U.S. presence in the Middle East, so it is willing to go full tilt to get the United States out. Iran’s enduring goal, in other words, will be to make staying in the region so painful that Washington has no choice but to withdraw most of its troops, accept Tehran’s control over the Strait of Hormuz, and acknowledge the Islamic Republic as an enduring power.\nFEAR AND LOATHING\nWhen the U.S.-Israeli war on Iran began, Iran’s foreign minister, Abbas Araghchi, was at a meeting in Supreme Leader Ali Khamenei’s compound. Araghchi had spent the last several months negotiating with the United States over Iran’s nuclear program, but in the preceding weeks, Washington had moved many of its military assets closer to the Persian Gulf and demanded that Iran give up all nuclear enrichment. U.S. President Donald Trump was publicly suggesting that he might try to overthrow the Islamic Republic. Araghchi was in the middle of briefing senior officials on these developments and the growing likelihood of conflict when the bombs started to fall.\nKhamenei’s compound was targeted in the initial strikes, which killed many senior officials—including the supreme leader himself. But Araghchi lived. He emerged from the rubble stunned and covered in debris. According to an account he gave to an Iranian podcaster, he ran into the street, stopped a passing car, and asked the driver to take him to the foreign ministry. From there, he tried to reach any military commanders he could and began contacting foreign leaders. Soon, he was joined by other surviving officials.\nThe Islamic Republic had long anticipated that Khamenei and his deputies might be killed, so it was well prepared to handle the aftermath of the attacks. The government had spent the better part of a year, for instance, decentralizing its political and military", "translation_ja": "", "vocab": [{"word": "diplomatically isolated", "definition": "国際的な外交関係から孤立させられた状態。他国との正式な関係や交渉の機会が制限されていることを意味する。"}, {"word": "strangled", "definition": "経済的に締め付けられた、窒息させられたという比喩表現。制裁などにより経済活動が著しく制限されている状況を表す。"}, {"word": "spectacularly", "definition": "劇的に、派手に失敗することを意味する副詞。期待や目標に大きく及ばない結果になったことを強調する。"}, {"word": "dwindling", "definition": "徐々に減少していく、縮小していく。時間とともに数量や規模が少なくなっていく過程を表す。"}, {"word": "hardened", "definition": "鍛えられた、強化された。経験や苦難を通じて精神的に強くなることを意味する。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-03 00:03 JST";
  renderTabs();renderList();
})();
</script>
