loser cooperation on defence, critical minerals and energy security.\nCarney told the European Parliament in Strasbourg on Thursday that Canada and Europe were \"stronger together\" in the face of \"geopolitical rupture\".\nHis comments came a day after European Commission President Ursula von der Leyen proposed \"opening the door\" to Canada's associate membership, a status that does not currently exist.\nUS President Donald Trump earlier called the idea \"laughable\" and threatened \"very serious tariffs\" on Europe if he considered it a \"hostile act\".\nCanada and the US are locked in an escalating trade dispute, with each side imposing tit-for-tat tariffs after bilateral talks collapsed last month.\n\"Today our societies are being battered by new storms,\" Carney said during his address, naming them as climate change, \"the erosion of democratic norms\" and the \"weaponisation of trade\".\n\"Economic integration is now being weaponised, tariffs being used to exert pressure,\" he said.\n\"Financial mechanisms have been used for coercion. Supply chains constitute weak points to be exploited.\"\nHe said a Canada-EU alliance would create a \"beacon for other democracies\", while stressing the two sides were not seeking to form a new power bloc.\n\"I am not proposing a third bloc in order to become a great-power rival - only with better manners,\" he told MEPs.\n\"This is about sovereignty, our ability to live as we wish. We do not seek power to dominate others.\"\nAsked about the proposal on Wednesday, Trump told reporters: \"If I think it's at all a hostile act, I will put very serious tariffs or stop trading with Europe, on many things.\n\"If it's a good intention, that's fine. If it's a bad intention, we'll put very heavy tariffs on Europe, which is a possibility.\"\nResponding to Trump's comments at a press conference following his address, Carney said: \"This alliance is a positive process, that's my response to the American president.\"\n\"Canadians are united that nobody is going to tell us what language we speak, no-one is going to dictate our culture, or with whom we can strike agreements internationally,\" he added.\nCarney said Canada was \"not in a position, nor seeking, to become a full member of the European Union\", describing the proposal as a \"different framework\".\n- What could EU associate member status mean for Canada? \n  - Published7 hours ago\n- Carney's new love-in with EU has everything to do with Trump \n  - Published1 day ago\n- EU chief backs plan for Canada to become 'associate member' \n  - Published22 hours ago\nSpeaking at the European Parliament on Wednesday, von der Leyen said she wanted Canada to become the EU's first associate member, with closer cooperation in areas such as manufacturing, technology, defence, energy critical minerals and economic security.\nIt is unclear exactly what that relationship would look like because the \"associate member\" status does not currently exist within the EU and could take years to implement.\nAny new arrangement would require the agreement of all 27 EU member states, with some governments having previously expressed reservations about creating a new form of membership.\nThe EU and Canada already have a free-trade agreement, and cooperate in areas including trade, defence and research.\nIn his address, Carney said Canada and Europe could strengthen their \"strategic autonomy\" through \"deep co-operation in the full range of strategic capabilities, including critical minerals\".\nHe said Canada could supply liquefied natural gas and hydrogen to support European energy security, while benefiting from Europe's expertise in clean-energy technologies.\nHe also proposed pooling technological resources and deepening \"people to people ties\", including allowing young people to \"work, study and live where they want on either side of the Atlantic\" through Canada joining the EU's Erasmus+ programme.\nCarney described the proposed relationship as \"a unique, d", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqx2zgk8k8xvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Ninth woman's body found as South African police investigate string of deaths\n- Published\nPolice in South Africa have confirmed the discovery of a ninth woman's body in just two months, amid growing concern over a string of unexplained deaths east of Johannesburg.\nThe latest victim was found half-naked and wrapped in a sheet on the side of a road in Dawn Park on Thursday morning, police said. Her identity has not yet been released.\nThe discovery follows the deaths of eight other women whose bodies have been found since July across Ekurhuleni, a major urban area of Johannesburg.\nSeveral of the women were found partially clothed and with injuries, but police have stressed that they have not established whether all the deaths are connected or whether a serial killer is responsible.\n- Abducted South African journalist found dead with gunshot wounds \n  - Published16 hours ago\n- WATCH: South African women arming themselves against gender violence \n  - Published20 November 2025\nThe latest body is of a woman believed to be in her 30s and appeared to have bruises and stab wounds, local media reported.\nThe discovery has sparked fear in the area, particularly among women who say they no longer feel safe.\n\"We are scared to come out of our houses. We are scared to go to the shops. We are no longer free in a country where we are supposed to be safe as women,\" local resident Bongeka Sebela told the BBC.\nPresident Cyril Ramaphosa has vowed that \"no stone will be left unturned\" in finding those behind the killings, which he said were \"causing fear and uncertainty in our communities\".\nAmong the victims was 38-year-old Elizabeth \"Tsontso\" Moselakgomo, who disappeared last week after leaving her home for an afternoon run. Her body was found three days later behind a hotel in Kempton Park.\nTwo other victims have since been identified as Itumeleng Kekana, who had been missing since July, and 38-year-old Dineo Evelyn Motapane, whose body was discovered by the roadside in KwaThema on Tuesday.\nThe first of the nine bodies was discovered in Kempton Park on 15 July. A suspect was arrested two days later in connection with that case and remains in custody, but police have not linked that suspect to the other deaths.\nFurther bodies were discovered in August and September, including in Kempton Park, Olifantsfontein, Clayville and KwaThema.\nPolice have assembled a multidisciplinary team of detectives, intelligence officers, forensic experts and other specialists to investigate the deaths and establish whether there are links between the cases.\nThey are also pursuing a person of interest, although they have not disclosed which case or cases that person may be connected to.\n\"Let's not get emotional, the gloves are off,\" said Gauteng Premier Panyaza Lesufi on Thursday, adding that the authorities had the capacity to deal with the killings.\nIn a statement on Thursday, South African police said the recent rise in serious and violent crimes against women remained a \"matter of grave concern\", urging women in the country to remain vigilant about their personal safety.\nThey advised women to avoid walking alone or using isolated routes, remain alert to strangers and suspicious vehicles, and share their location or travel plans with someone they trust. They also advised against walking with earphones or earbuds at high volume, warning this could reduce awareness of their surroundings.\n\"Practising personal safety measures can save lives.\"\nAuthorities have offered a 400,000 rand ($24,000; £18,000) reward for information that could lead to arrests and have appealed to families with missing relatives to help identify the remaining victims.\nThe discoveries have caused widespread alarm in Ekurhuleni, particularly around Kempton Park, and come against the backdrop of longstanding concern about high levels of violence against women in South Africa.\nPolice say they are not linking the deaths to a serial killer at this stage, but are investigating the possibility that a group of people is behind the killings.\nActing Police Minister Firoz Cachalia has cautioned against speculation, saying investigators were dealing with what appeared, at this stage, to be \"quite distinct, separate events\".\nSouth Africa experiences some of the world's highest levels of gender-based violence (GBV), with the rate at which women are killed five times higher than the global average, according to UN Women.\nLast November, the country classified violence against women a national disaster following an online campaign that culminated in countrywide protests.\nYou may also be interested in:\n- South Africa calls gender violence a national disaster after protests \n  - Published21 November 2025\n- I built this 'AI aunt' for women after family tragedy in South Africa \n  - Published3 November 2025\nGo to BBCAfrica.com, external for more news from the African continent.\nFollow us on Twitter @BBCAfrica, external, on Facebook at BBC Africa, external or on Instagram at bbcafrica, external", "translation_ja": "", "vocab": [{"word": "multidisciplinary", "definition": "複数の異なる専門分野から構成されている、または多くの学問分野にまたがっている。この記事では、警察が様々な専門家から成るチームを組織したことを示しています。"}, {"word": "forensic", "definition": "犯罪捜査や法的証拠に関連する科学技術。法廷で使用する科学的分析を指します。"}, {"word": "vigilant", "definition": "警戒を怠らない、注意深い。危険や問題に対して常に注意を払っている状態を表します。"}, {"word": "backdrop", "definition": "背景、または事件や状況の根底にある環境や文脈。この記事では南アフリカの暴力の歴史的背景を指しています。"}, {"word": "countrywide", "definition": "国全体にわたる、全国的な。国中のすべての地域に広がっていることを表します。"}, {"word": "caution against", "definition": "～に対して警告する、注意するよう促す。何かを避けるべきだと勧告することを意味します。"}]}, {"title_ja": "国連専門家：イランへの米国の攻撃は戦争犯罪である可能性があると指摘", "title_en": "UN Experts: Reasonable Grounds to Believe US Committed War Crimes in Iran", "summary_ja": "国連人権専門家は、イランの学校とスポーツ複合施設への2月の米国ミサイル攻撃で少なくとも177人の民間人が殺害されたことに関して、米国が戦争犯罪を犯した可能性があるとの報告書を発表した。報告書は、これらの攻撃が明確に識別可能な民間人目標への無差別攻撃であり、軍事目的がなかったと結論づけている。同じ専門家は、イラン当局が反政府抗議活動の暴力的な弾圧中に人道に対する罪を犯したことも判明した。", "summary_en": "UN human rights experts report that the US likely committed war crimes in February missile strikes on a school and sports complex in Iran that killed at least 177 civilians. The report concludes the strikes were indiscriminate attacks on clearly identifiable civilian targets with no military purpose. The same experts also found Iranian authorities committed crimes against humanity during violent crackdowns on anti-government protests.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm9w4n5nverdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UN experts say grounds to believe US committed war crimes in Iran strikes\n- Published\nUN human rights experts say there are reasonable grounds to believe the US committed war crimes in two strikes in Iran that killed at least 177 civilians.\nA new report by the Independent International Fact-Finding Mission on Iran, external said February's missile strikes on a primary school in Minab and a sports complex in Lamerd constituted indiscriminate attacks causing civilian deaths and damage to civilian infrastructure.\nThe US previously denied striking Lamerd and said it was investigating what happened in Minab. A State Department official said the US did not give credibility to the findings in the report.\nThe experts also found Iranian authorities committed crimes against humanity during a crackdown on mass anti-government protests in January.\nThey said killings by security forces occurred on \"a staggering and unprecedented scale\" across all 31 provinces.\nIran has also not yet commented on the findings, but it has previously rejected allegations of systematic violations of human rights.\n\"Civilians in Iran are caught between gross human rights violations and crimes against humanity committed by their own government and the nation's deadly conflict with the United States and Israel,\" the fact-finding mission warned in a statement on Thursday.\nFor their latest report to the UN Human Rights Council, the mission's three independent experts investigated two of the deadliest attacks on civilians during the conflict.\nOn 28 February, when the US and Israel launched their war against Iran, Tomahawk missiles struck Shajareh Tayyebeh Primary School in the southern town of Minab, killing at least 156 people, including 120 children, according to local authorities.\nThe fact-finding mission's experts said the school was adjacent to an Islamic Revolutionary Guard Corps (IRGC) naval complex also attacked that day, but that the school was clearly identifiable and that no information indicated that it was used for military purposes.\nThe experts said that, based on the evidence gathered - including media reports indicating that a preliminary US military inquiry found US forces responsible, and the fact that the US is the only party to the conflict that possesses Tomahawk missiles - they had reasonable grounds to believe that the strike on the school was carried out by the US.\nThey also concluded that the school was \"the intended point of impact and that the damage did not result from an errant strike or collateral damage\" from the attack on the IRGC complex, citing survivors as saying the school was struck twice.\nThe US military has yet to release the findings of its investigation into the Minab strike, but Defence Secretary Pete Hegseth has said it would \"never target civilian targets\".\nAlso on 28 February, Precision Strike Missiles (PrSM) dispersed clouds of tungsten pellets over a sports complex and residential area in the town of Lamerd, killing at least 21 civilians, including seven children, according to local authorities.\nAgain, the fact-finding mission's experts said the sports complex was clearly identifiable and that no information indicated it was used for military purposes.\nThey concluded by saying there were reasonable grounds to believe that the strike was carried out by the US, citing evidence including the fact that the US is the only party to the conflict that possesses PrSM missiles.\nThe US military has said it carried no strikes on Lamerd that day and disputed reports identifying the weapon used as a PrSM.\nIn both incidents, the fact-finding mission's experts said there were \"reasonable grounds to believe that the US committed the war crime of launching an indiscriminate attack resulting in loss of life or injury to civilians or damage to civilian objects\".\nThe fact-finding mission's report also covers the Iranian authorities' violent repression of the mass protests that took place across Iran in December 2025 and January 2026.\nThe experts said it was an unprecedented escalation from past crackdowns, marked by the widespread use of lethal force resulting in mass killings and injuries, and extensive arrests.\nThey cited witnesses, health workers and victims' families as saying that security personnel positioned themselves on rooftops and other elevated positions, firing their assault rifles into crowds.\nProtesters also sustained severe wounds to the head, chest and eyes from metal shotgun pellets, causing permanent blindness.\nAs the crackdown escalated, security forces attacked healthcare facilities, beating and arresting wounded demonstrators and arresting some healthcare workers, which deterred victims from seeking life-saving care, according to the experts.\nThey also found that the tens of thousands of people detained during the protests faced torture, solitary confinement and denial of legal counsel.\nThe experts warned that the government had since intensified its use of the death penalty against protesters, with a", "translation_ja": "", "vocab": [{"word": "indiscriminate", "definition": "区別や選別なく行われること。特に「無差別攻撃」は民間人と軍事目標を区別せずに行われる攻撃を意味する。"}, {"word": "fact-finding mission", "definition": "事実や真実を調査するために設立された公式な調査団。国際機関や政府が真相を明らかにするために派遣する。"}, {"word": "collateral damage", "definition": "軍事作戦の過程で生じる意図しない民間人の死傷または民間施設の損壊。"}, {"word": "crackdown", "definition": "違法または望ましくない活動を厳しく抑圧する政府の行動。通常、強制力や暴力が伴う。"}, {"word": "extrajudicial", "definition": "法律の外で、または司法制度を経ずに行われること。特に「外司法的殺害」は裁判なしの殺害を意味する。"}, {"word": "disperse", "definition": "広い範囲に散らばらせることまたは散らばること。軍事用語では兵力や物資を分散配置することを意味する。"}]}, {"title_ja": "2019年から行方不明の母親の遺骨が特定される", "title_en": "Human remains identified as mother missing since 2019", "summary_ja": "ロンドン南西部の樹林で山火事後に発見された遺骨は、2019年12月に失踪した3人の子どもを持つ母親ジョアン・シーンと特定されました。南ハンプトン出身の56歳の男が殺人共謀容疑で逮捕されています。4,000以上の捜査線を含む調査はハンプシャー警察に引き継がれました。", "summary_en": "Human remains discovered in woodland in south-west London following a wildfire have been identified as Joanne Sheen, a mother-of-three who disappeared in December 2019. A 56-year-old man from Southampton has been arrested on suspicion of conspiracy to commit murder. The investigation, which involved over 4,000 lines of inquiry, has now been handed over to Hampshire Police.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c9e8e21x3vp4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Human remains identified as mum missing since 2019\n- Published\nHuman remains discovered in woodland in south-west London following a wildfire have been identified as a woman who has been missing since 2019.\nMother-of-three Joanne Sheen, then aged 44, was last seen when she travelled from Fareham to Southampton with a friend on 5 December 2019.\nMetropolitan Police officers were called to Padstow Walk in Feltham on 12 August after bones were discovered in an area of shrubland damaged by a fire the previous week.\nA 56-year-old man from Southampton has been arrested on suspicion of conspiracy to commit murder and he remains in police custody.\nDetectives in London have now handed the investigation over to Hampshire Police after the remains were identified as those of Sheen.\nSheen's disappearance sparked a major police investigation, which the force described as \"long and complex\".\nPolice said they had followed more than 4,000 lines of inquiry, taken more than 300 statements and carried out detailed searches at more than 10 addresses and on numerous vessels.\nDet Ch Insp Toby Elcock, from the Major Crime Team, said: \"While this tragic discovery is not the outcome Joanne's family, or any of us, had hoped for, we hope the identification of her remains can at least begin to provide some answers after many years of uncertainty.\n\"Throughout this investigation, Joanne's family have shown tremendous strength and dignity in the face of unimaginable circumstances, and our thoughts remain with them at this incredibly difficult time.\n\"As our investigation progresses, we remain committed to establishing exactly what happened to Joanne and ensuring that those responsible are held accountable.\"\nHe stressed that the police would still like to hear from anyone with information about Sheen's disappearance.\nLondon Fire Brigade was called on 5 August to a blaze that damaged about two hectares of shrubland in an area known as Bedfont Pits.\nThe human remains were discovered a week later, and a post-mortem examination suggested they had come from a woman aged between 25 and 45.\nA Metropolitan Police spokesman confirmed the remains were found by a member of the public at the site close to Bedfont Lakes Country Park.\nCrimestoppers has agreed to reinstate a £20,000 reward for information that supports the investigation.\nSheen was reported missing by her family in February 2020 - two months after she was last seen.\nSeveral people were arrested on suspicion of conspiracy to murder in 2020, but no charges were brought and the investigation remained unsolved.\nPolice previously said she did not have a permanent place of address, a vehicle or a bank account.\nRelated topics\n  - Published5 February 2025\n  - Published21 August", "translation_ja": "", "vocab": [{"word": "conspiracy to commit murder", "definition": "殺人を計画・実行するための共謀を意味する法律用語。複数の人物が協力して犯罪を遂行することを指します。"}, {"word": "jurisdiction", "definition": "特定の地域や事件に対する法的権限や管轄権のこと。ここではハンプシャー警察が調査を引き継ぐという文脈で使われています。"}, {"word": "exonerate", "definition": "誰かが罪を犯していないことを証明する、または責任がないことを明らかにするという意味。法的な状況で用いられます。"}, {"word": "line of inquiry", "definition": "警察捜査における特定の調査方向や容疑者追跡の道筋のこと。複数の可能性を同時に調べることを指します。"}, {"word": "post-mortem examination", "definition": "死亡後に死因を特定するために行われる医学的な検査。法医学において重要な役割を果たします。"}, {"word": "reinstate", "definition": "以前に存在していたものを再び導入または復活させることを意味します。ここでは報奨金を再び有効にするという意味です。"}]}, {"title_ja": "ダイアナ元皃妃の死後、チャールズ国王が『異常に興奮した様子だった』とスペンサー伯爵が主張", "title_en": "Earl Spencer claims King Charles 'sounded giddily elated' after Diana's death", "summary_ja": "ダイアナ元皃妃の兄であるスペンサー伯爵は、出版予定の回顧録で、1997年のダイアナ妃の死後、当時のチャールズ皇太子が電話で『異常に興奮した様子』で『宝くじに当たった人のような』態度だったと主張している。バッキンガム宮殿はこの主張を強く否定し、悲しみが記憶と判断を曇らせることがあると示唆した。この書籍にはチャールズとダイアナの険しい結婚生活に関する他の物議を醸す主張も含まれている。", "summary_en": "Earl Spencer has alleged in his upcoming memoir that King Charles sounded 'giddily elated' like 'a lottery winner' when he called him after Princess Diana's death in 1997. Buckingham Palace strongly rejected the claim, suggesting that grief can cloud memory and judgment. The book also contains other controversial claims about Charles and Diana's troubled marriage.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqkg083ve78ro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Charles 'sounded giddily elated' after Diana died, Earl Spencer claims\n- Published\nEarl Spencer, brother of Diana, Princess of Wales, has claimed King Charles \"sounded giddily elated\" when he called him after her death in 1997.\nIn a controversial book about Diana, he alleged the then-Prince Charles sounded like a \"lottery winner\" after the news.\nBuckingham Palace strongly pushed back on Wednesday against the credibility of the book, after an initial extract claimed Charles had said of Diana: \"We'll forget her soon enough.\"\nA spokesperson said: \"While we do not comment on books as a matter of principle, His Majesty is mindful that the pain of fraternal grief can cloud reason, affect judgment and colour memory in ways others do not recognise, even many years after such a loss.\"\nThe latest claims are once again highly personal in their attacks on King Charles and the royals, interpreting their motives in a very harsh light.\nThe evidence is Earl Spencer's own recollection of conversations about that emotional time around his sister's death, almost 30 years ago.\nWhat remains to be seen is how the public might respond to the allegations, whether they might support this book as a new and different Spencer perspective, or whether they might feel it to be inappropriate to be sharing such private disputes.\nRepresentatives of Prince Harry have said they do not want to comment on the book and Buckingham Palace has pointed back to its response from Wednesday, when it rejected the account of Prince Charles in the wake of Diana's death in Paris.\nIn excerpts from Earl Spencer's memoir published in the Daily Mail, external, he recounts being alerted to the car crash on 31 August, 1997, by a phone call from his sister Jane in the middle of the night at his home in Cape Town, South Africa.\nDuring the calls that followed, which confirmed the death, the then-Prince Charles telephoned him, he writes.\nThe book alleges: \"Unlike my other callers, who were stunned, barely able to articulate their condolences and offers of help, he sounded giddily elated - like a lottery winner, I remember thinking at the time.\"\nAccording to Earl Spencer, Charles informed him he had told Princes William and Harry of their mother's death first thing that morning, in their bedrooms at Balmoral.\nThe royal couple had divorced in August 1996.\nSwan Song: Diana, My Sister is due to be published next week. BBC News has not seen the book in full.\nIn the memoir, Earl Spencer writes of his sister's troubled marriage - claiming a friend of Diana's had told him that on the eve of their wedding in July 1981, Prince Charles had told her he was \"very happy to marry her, but… not actually in love with her\".\nThings became \"very difficult indeed\" in the marriage early on, Earl Spencer writes, adding that he is \"sure that both spouses despaired of the other at times\".\nHe now believes his sister had attention deficit hyperactivity disorder, external (ADHD), and as part of her condition suffered from Rejection Sensitive Dysphoria - describing the latter as an \"intense emotional pain in the face of others' rejection or criticism\".\nIn her later years, he writes, Princess Diana considered taking her own life on more than one occasion but love for her sons \"stopped her from going further\".", "translation_ja": "", "vocab": [{"word": "giddily", "definition": "浮かれた、上機嫌な様子で。通常は過度に興奮した、判断力を欠いた状態を表現する際に使用される。"}, {"word": "elated", "definition": "非常に喜びや興奮に満ちた状態。幸福感が高まっている様子を示す形容詞。"}, {"word": "memoir", "definition": "著者の人生経験や重要な出来事に関する回顧録。自伝的な記録文学作品。"}, {"word": "credibility", "definition": "信頼性や信用度。ある情報や主張がどの程度信じるに値するかを示す。"}, {"word": "fraught", "definition": "困難や問題に満ちた。緊張感や不安がある状況を表現する。"}, {"word": "recollection", "definition": "思い出すこと、記憶。過去の出来事を回想する行為や記憶そのもの。"}, {"word": "Rejection Sensitive Dysphoria", "definition": "他者からの拒絶や批判に対して極度の感情的痛みを感じる心理的状態。ADHD関連の症状として認識される。"}]}, {"title_ja": "チャールズ国王、AIが悪用される危険性を警告 『実存的脅威』と指摘", "title_en": "King Charles Warns of 'Existential Danger' of AI Falling Into Wrong Hands", "summary_ja": "チャールズ国王がダンフリース・ハウスでAI企業の経営幹部を集めたサミットを開催し、人工知能技術の安全保障について議論した。国王はAI能力が悪意のある者の手に落ちて破滅的に使用される場合の『実存的危険性』を警告した。業界の指導者たちは、AI開発のペースと集団的責任の必要性について議論しながら、安全保障への懸念を認めた。", "summary_en": "King Charles convened a summit at Dumfries House with AI executives from companies like OpenAI, Nvidia, and Anthropic to discuss safeguarding artificial intelligence technology. The King warned of 'existential dangers' if AI capabilities fall into the wrong hands and are used catastrophically. Industry leaders acknowledged safety concerns while debating the pace of AI development and the need for collective responsibility.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c65ymj7njvl7o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "King Charles warns of 'existential danger' of AI falling into wrong hands\n- Published\nKing Charles has warned AI executives of the \"existential dangers\" posed by the technology falling into the wrong hands.\nHe made the comments at a summit he had convened at Dumfries House in Ayrshire to discuss how the tech can be used to benefit society.\nThose gathered at the meeting also included Kanishka Narayan, the UK's AI Minister, the Pope's advisor, and participants from AI giants such as Nvidia, OpenAI and Anthropic.\nIt comes amid a series of recent warnings from people inside the industry about the rapidly evolving capabilities of advanced or \"frontier\" AI models and the regulation needed to keep them in check.\n\"Those who have created these technologies are now increasingly warning that AI risks developing darker capacities - perhaps even to take life,\" the King told the executives.\nHe said there seemed to be an \"urgency\" in \"adequately considering the existential dangers of such technologies falling into the wrong hands, and being used in potentially catastrophic ways\".\n\"The task before you is not merely to advance technology, but to ensure that it remains firmly in the service of humanity, community and the natural world,\" he told the group.\nThe summit has been called to consider whether a \"shared set of principles\" can be developed to \"help guide the future application\" of AI.\n'Keep engineering'\nJensen Huang, chief executive of Nvidia, was among top industry leaders attending.\nNvidia is a central player in AI infrastructure, supplying chips to leading AI model developers including OpenAI and Meta.\nIt is also the world's most valuable company, with a stock market value of around $5.15tn.\nHuang told the room he believed safety was \"paramount\", adding that companies should hold back a product and \"keep engineering\" if it was not safe enough.\nThe Nvidia boss also highlighted the value of open models - systems which give users direct access to the software - as a way to \"ensure that people and countries are not left behind\".\nHe said these systems must also be protected so \"researchers, universities, start-ups and countries\" can develop applications \"none of us would have imagined alone\".\n\"Let us lead with responsible optimism, build AI safely and securely, open it to more people, expand our ambition and solve the problems that matter to the world,\" Huang added.\nMeanwhile Sir Demis Hassabis, who co-founded the UK AI lab DeepMind - later acquired by Google - offered a more cautious view on the pace of development.\nHe said artificial general intelligence - systems it is believed could be as good as or better than humans at multiple tasks - was \"probably only a few short years away\" and could have an impact \"ten times that of the Industrial Revolution\".\nThe chance of something going wrong was \"definitely non-zero\", Sir Demis added.\nBut he advocated for \"a sensible middle way\", saying humanity could address risks if collectively given the space and time to mitigate them.\n\"The future is not yet written,\" he told the King's delegates.\nSarah Friar, OpenAI's chief financial officer, said AI had the potential to solve some of society's \"hardest problems\" - but agreed its growing capabilities raised questions about safety and \"how we ensure it always serves people\".\n\"We need to address those questions together,\" she said.\n\"No one company or government can do that alone and I'm grateful to His Majesty for convening this discussion at such an important moment.\"\n- Uncontrolled AI could lead to 'silicon species' rivalling humans, warns Microsoft \n  - Published14 hours ago\n- Why are there concerns AI could threaten humanity, and how real are they? \n  - Published13 hours ago\nWave of warnings\nSince August, a wave of discussion about AI's potential power and how to control and regulate it has dominated blog posts and social media, emphasised by several dramatic statements from those in the industry.\nThe debate has also been met with criticism from sceptics who say the focus on AI's hypothetical future risks distracting from more immediate concerns around the technology, such as its environmental impact.\nIn July, OpenAI announced what it called an \"unprecedented\" incident in which its advanced AI escaped test limits and hacked into the tech platform Hugging Face.\nAfter several other incidents, in September, a resignation post from Anthropic researcher Jacob Coxon went viral when he cited concerns AI could wipe out humanity.\nHe later told the BBC the people working on the technology were \"genuinely frightened\" about the speed of its advancements and what it could mean for humanity.\nIn response, Anthropic scientist Evan Hubinger wrote he personally thought the possibility of human extinction from AI was a greater than 10% chance.\nThe AI companies' top bosses have all weighed in with their thoughts following the claims, with OpenAI's Sam Altman saying people were right to be concerned, but adding they should trust AI firms to keep the te", "translation_ja": "", "vocab": [{"word": "existential", "definition": "existence自体の根本的な性質に関する、または存在に関わる根本的な危機を意味する。ここでは、AIが人類の存在そのものを脅かす可能性を指している。"}, {"word": "frontier", "definition": "技術開発における最先端領域を意味する。ここでは最新型・最高度のAIモデルを指す用語として使われている。"}, {"word": "mitigate", "definition": "問題や危険の程度を軽くする、被害を減らすという意味。リスク管理やリスク軽減の文脈でよく使用される。"}, {"word": "infrastructure", "definition": "システムやサービスが機能するために必要な基盤となる施設や構造。AIの場合はチップやサーバーなどの物理的な基盤を指す。"}, {"word": "unprecedented", "definition": "過去に例がない、前例のないという意味。極めて珍しい出来事や状況を説明する際に使用される。"}, {"word": "convened", "definition": "正式に人を集める、会議や集まりを開く、招集するという意味の動詞conveneの過去形。"}]}, {"title_ja": "トランプ大統領、ポーランドの米軍基地設立で「大きな進展」を発表", "title_en": "Trump Announces Major Progress on US Military Base in Poland", "summary_ja": "米国のトランプ大統領は、ポーランドに恒久的な米陸軍基地を設立するための大きな進展を発表し、ポーランドのナヴロツキ大統領のリーダーシップを賞賛しました。この動きは、ロシアのウクライナ侵攻を受けてNATOの東側側面を強化したいというポーランドの要望に対応するもので、現在約1万人の米兵がローテーション基で駐留しています。", "summary_en": "US President Donald Trump announced significant progress toward establishing a permanent US Army base in Poland, praising Polish President Karol Nawrocki's leadership. The move comes as Poland seeks to strengthen NATO's eastern flank following Russia's invasion of Ukraine, with nearly 10,000 US soldiers currently stationed there on a rotational basis.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/trump-hails-major-progress-in-setting-up-us-base-in-poland/a-79316328?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Trump hails 'major progress' in setting up US base in Poland\nSeptember 17, 2026\nUS President Donald Trump announced on Thursday that significant progress had been made toward establishing a US military base in Poland.\n\"Thanks to the bold leadership of my friend, Karol Nawrocki, President of Poland, major progress is being made toward establishing a US Army base in Poland,\" Trump said in a post on Truth Social.\nIn August, Warsaw revealed that it was in talks with Washington regarding a permanent US military presence in Poland.\n\"If this happens, the location will be announced very soon. This will be a historic step for our Great US/Polish Alliance,\" Trump added in a social media post.\nHis announcement comes despite his administration's launch of a formal review of its military presence in Europe. This has raised fears among allies that the US could reduce its military presence there.\nHow did Warsaw react?\nNawrocki, who is a conservative ally of the US president, thanked Trump on X, saying Poland was \"ready to continue our efforts to strengthen our defense cooperation.\"\nHe added, \"I can assure you that the Polish government will do its utmost to provide the best possible location for the US Army base.\"\nMeanwhile, Zbigniew Bogucki, the head of the Polish president's chancellery, called Trump's announcement \"great news for Poland.\" He also noted that it came on the 87th anniversary of the Soviet invasion of Poland.\nIn August, Polish Deputy Defense Minister Pawel Zalewski said his country was discussing with the United States the possibility of establishing a permanent US base on its territory.\n\"We have already completed the initial stage of the process, not to mention the political will, which was expressed long ago,\" Zalewski told the public broadcaster TVP.\nPoland secures NATO's eastern flank\nSince Russia's full-scale invasion of Ukraine in 2022, Poland has been pushing for a larger allied presence on NATO's eastern flank.\nNearly 10,000 US soldiers are currently stationed in Poland, a member of both NATO and the EU. However, they are there almost exclusively on a rotational basis.\nPoland's proximity to Ukraine and Russia is a key factor in its security strategy. The country allocates approximately 5% of its gross domestic product to defense spending and has been working to increase the United States' military presence.\nIn the meantime, Washington heavily criticized several European countries for refusing to allow US forces to use NATO bases in its war with Iran.\nEdited by: Sean Sinico\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "permanent", "definition": "恒久的な、永続的な状態を指します。一時的ではなく、継続的に存在することを意味します。"}, {"word": "rotational basis", "definition": "交替制度、ローテーション制度のことです。複数の人員が交代で任務に当たることを指します。"}, {"word": "eastern flank", "definition": "東側側面、東側の防御ラインを意味します。軍事用語で、同盟国の脆弱な側面を指します。"}, {"word": "proximity", "definition": "近接性、物理的な距離の近さを表します。地理的な位置関係が重要な場合に使用されます。"}, {"word": "allocates", "definition": "配分する、振り分けるという意味です。予算やリソースを特定の目的に充てることを指します。"}, {"word": "bolster", "definition": "強化する、支援するという意味です。防御力や同盟関係を強くすることを表現します。"}]}, {"title_ja": "トランプ政権が絶滅危惧種法の保護を弱体化", "title_en": "Trump Administration Weakens Endangered Species Act Protections", "summary_ja": "米国トランプ政権は絶滅危惧種法を再解釈し、商業漁業やlogging等の商業活動による野生動物の非意図的な死亡を法的責任から除外した。魚類野生動物局長の覚書により確認されたこの政策転換は、環境法の過去50年の先例から大きく逸脱しており、20の民主党主導州がこの変更に異議を唱える訴訟を提起した。", "summary_en": "The US Trump administration has reinterpreted the Endangered Species Act to exempt unintentional wildlife deaths from legal liability, particularly from commercial activities like fishing and logging. This policy shift, confirmed through a memo from the Fish and Wildlife Service director, represents a major departure from five decades of environmental law precedent and has prompted 20 Democratic-led states to file lawsuits challenging the changes.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-trump-administration-weakens-endangered-species-act/a-79316188?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US: Trump administration weakens Endangered Species Act\nSeptember 17, 2026\nThe US government is planning a major reinterpretation of the Endangered Species Act (ESA), The New York Times reported and officials confirmed to AFP on Thursday.\nThe policy shift was delivered in a new memo signed by Brian Nesvik, director of the Interior Department's Fish and Wildlife Service.\nIn it, the department will reduce the term \"take,\" a term that relates to pursuing, killing or capturing of a species, to simply \"affirmative conduct intentionally directed against a particular animal or animals.\"\nThis change would no longer treat the unintentional killing of protected wildlife as unlawful.\nWildlife deaths resulting from foreseeable risks posed by activities such as commercial fishing or logging would end up exempt from the landmark 1973 law.\nA 'huge loophole'\nThe wildlife service has historically held people liable for accidentally harming protected species such as grizzly bears, manatees and spotted owls.\n\"This cuts against the entire history of the Endangered Species Act,\" Dan Ashe, who led the Fish and Wildlife Service under former President Barack Obama, told the Associated Press. \"It just creates a huge loophole. It completely relieves people of any responsibility for their actions, even consequences that can be easily predicted.\"\nThe Interior Department confirmed the memo's authenticity to AFP.\n\"The memorandum accurately reflects the US Fish and Wildlife Service's guidance for implementing the Endangered Species Act following the final rule rescinding the regulatory definition of 'harm,'\" the department told AFP.\n\"Under the guidance, the ESA's prohibition on 'take' continues to prohibit conduct including harassing, pursuing, hunting, shooting, wounding, killing, trapping, capturing or collecting protected wildlife,\" it added.\nBroad overhaul of Endangered Species Act\nLast year, the Trump administration declared it would consider \"economic considerations\" when deciding whether to protect species at risk of extinction.\nThe move is the latest attempt to loosen the landmark ESA's rules. Combined, the changes overturn five decades of precedent in how the law is interpreted and applied.\nInterior Secretary Doug Burgum has argued that the changes are necessary, claiming the ESA has been \"weaponized\" to stop economic projects, weaken competitiveness, undermine national security, and ultimately hurt Americans.\nAmong the changes to ESA is the redefinition of the term \"harm,\" which would allow oil drilling, mining and other activities in endangered habitats as long as those activities do not directly kill or injure the animals.\nThe automatic application of endangered species protections to those listed as \"threatened\" was also halted.\nAdditionally, the Trump administration announced that it was shrinking two vast stretches of protected land in Utah by more than 90%, to open millions of acres of protected land for fossil fuel extraction and mining.\nStates sue the government\nLast week, the attorneys general of 20 Democratic-led states, along with Washington, DC, submitted a lawsuit against the administration over its overhaul of ESA.\nOne lawsuit tackles the redefinition of \"harm,\" while a second lawsuit challenges a rule that removes protections for newly threatened species, and the new business-related considerations taken into account when declaring \"critical habitats.\"\n\"The Trump administration is trying to undermine the law, the will of Congress and the will of the people who overwhelmingly support protections for endangered species,\" Washington Attorney General Nick Brown said.\n\"Instead of stewardship, this administration's approach to our land, to our water is one of exploitation,\" he added.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "reinterpretation", "definition": "既存の法律やルールを新たな視点から読み直し、異なる意味や適用方法を与えることを指します。ここでは政策の大きな方針転換を意味しています。"}, {"word": "affirmative", "definition": "明確に肯定的または積極的な行動を意味し、法律用語として「特定の動物に対して意図的に向けられた行為」などのように具体的な行動を示します。"}, {"word": "exempt", "definition": "法律や義務から除外されることを意味します。ここでは商業活動による野生動物の死亡が法的責任から免除されることを指します。"}, {"word": "landmark", "definition": "歴史的に重要で、その後の発展に大きな影響を与えた法律や出来事を形容する言葉です。ここでは1973年の絶滅危惧種法を指します。"}, {"word": "precedent", "definition": "後の判断や行動の基準となる先例を意味します。法律分野では過去の判例や慣例を指すことが多いです。"}, {"word": "loophole", "definition": "法律や規則の抜け穴、つまり本来の意図を回避できる不備や隙間を指します。ここでは環境保護を回避する可能性を意味しています。"}, {"word": "overhaul", "definition": "システムや法律全体を徹底的に改革・改善することを意味します。ここでは絶滅危惧種法の大規模な改変を指します。"}]}, {"title_ja": "ロシア人の出産目的でのブラジル渡航が増加", "title_en": "Russian Birth Tourism to Brazil Increases", "summary_ja": "自動的にブラジル市民権を獲得できる子どもを持つため、ロシア人がブラジルへの出産目的の渡航を増加させている。この傾向は2022年のロシアのウクライナ侵攻後のビザ要件厳格化と、アルゼンチンの市民権取得に関する居住要件強化に加速した。", "summary_en": "More Russians are traveling to Brazil to give birth, seeking automatic Brazilian citizenship for their children to access visa-free travel. This trend has accelerated since Russia's 2022 invasion of Ukraine tightened visa requirements for Russian nationals, and following Argentina's stricter residency policies for birth citizenship.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/russian-birth-tourism-to-brazil-increases/a-79312304?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Russian birth tourism to Brazil increases\nSeptember 17, 2026\nYulia and Dmitri (whose names have been changed for reasons of safety) flew from Russia to Brazil this summer so that their child could be born there. Yulia was 32 weeks pregnant at the time of travel.\n\"Of course, we didn't say that I was pregnant at border control,\" Yulia told DW.\nHer daughter was born at a private clinic in Santos, a city in southern Brazil. Anybody born in the country has an automatic right to Brazilian nationality. The family is currently preparing all the paperwork.\n\"We've achieved our minimum goal,\" said Dmitri. \"With a Brazilian passport, our daughter will be able to travel without a visa to almost any country in the world. She won't have to apply for an expensive and time-consuming Schengen visa. We want her to be able to decide for herself where she studies, works or lives.\"\nHe said that a colleague of his had traveled to Brazil in early August with his pregnant wife for the same reasons.\nYulia and Dmitri said that they had spent the equivalent of about €10,000 (about $11,500) during the first six weeks of their stay in Brazil, which included the costs for several days of treatment for their daughter in intensive care. Dmitri quit his job at a bank for the trip and hopes to find work again after the family returns to their home in the Russian capital Moscow.\nHowever, they are only planning to return once all the documents for their daughter are ready and that could take months. Other Russian families have decided to stay in Brazil permanently.\nAccording to organizations and lawyers that provide support to Russians in Brazil, there has been an increase in immigration from Russia, particularly since Russia's full-scale invasion of Ukraine in 2022, after which visa requirements for Russian nationals entering certain countries were tightened.\nArgentina tightens visa regulations\nBirth tourism to Brazil has also increased since Argentina, which used to be one of the main destinations for people wanting their children to be born in a country that automatically grants citizenship to newborns, tightened its regulations. People who want their children to obtain Argentinian citizenship now have to have resided in Argentina for at least two years. Since 2025, the access of people who do not have a permanent residence permit to free healthcare has also been restricted.\nAccording to the Russian news outlet RBC, more than 7,000 Russians applied for a residence permit in Argentina in 2023. By mid-2025, the number had decreased to about 1,800.\nMeanwhile, almost 500 Brazilian passports were issued to Russians in 2024 and more than 600 the following year. More than half of the new citizens were women.\nThe parents of a child born in Brazil can apply for a residence permit, which they can obtain within a year, under certain circumstances.\nYana (name changed) and her husband chose to do this in 2023.\n\"The events of 2022 certainly played a role, but we had already toyed with the idea of giving birth abroad,\" Yana told DW. \"A lot can happen in Russia. I always wanted a second passport and to give birth to my child in another country. When I became pregnant unexpectedly, all we had to do was decide which country made sense.\"\nYana gave birth to a boy at a public hospital in Florianopolis, the capital of the southern state of Santa Catarina, and the family stayed in Brazil for about three years.\n\"It was important to get passports for us and our child. I really enjoyed living there, and I learned Portuguese,\" Yana said, adding that she and her husband have lived as \"digital nomads\" in various countries over the years.\nEven though they no longer live in Brazil, they want their son to have a connection to his birth country: \"We read Portuguese books and talk a lot about Brazil. I want him to be able to travel without a visa and remain open to the world.\"\nBig Russian community in Florianopolis\nOne of the largest Russian communities in Brazil lives in Florianopolis, and it's growing. According to the local health authorities, 119 Russian women took advantage of prenatal consultations in the first six months of this year. In all of 2025, it was 136 Russian women.\nA lawyer who preferred to remain anonymous told DW that Brazil neither expressly prohibited nor permitted foreign nationals to enter the country for the purpose of giving birth. Often pregnant women do not disclose their reason for traveling to Brazil at border control. And once they are in the country they have access to free public hospitals and medical facilities regardless of their immigration status.\nAs Russian birth tourism to Brazil increases, a whole industry has emerged. Often, recent Russian immigrants to Brazil act as intermediaries and help others find housing or medical care. They provide assistance with complicated administrative procedures or the language. Depending on the level of care, the cost can reach into the thousands of dollars.\nHowever, providers of such services, lawyers", "translation_ja": "", "vocab": [{"word": "birth tourism", "definition": "妊娠した女性が子どもに特定国の市民権を自動取得させるため、その国で出産する目的で渡航する行為。政治的または経済的理由で複数のパスポート取得を目指す傾向がある。"}, {"word": "automatic citizenship", "definition": "ある国で出生した者が、その国の法律により自動的に市民権を獲得する制度。親の国籍や移民状況に関わらず適用される。"}, {"word": "visa-free travel", "definition": "特定のパスポート保有者が事前にビザを申請することなく他国へ入国・滞在できる権利。パスポートの国際的な信用度を示す指標。"}, {"word": "tighten regulations", "definition": "政府や機関が既存のルールをより厳しく、より制限的にする政策変更。入国や居住許可の条件を厳格にすることを指す。"}, {"word": "intermediaries", "definition": "二者間の取引や交渉を仲介する人物または組織。ここではロシア人移民がブラジル移住希望者と医療機関などをつなぐ仲介者を指す。"}, {"word": "digital nomads", "definition": "インターネットを利用して遠隔で働きながら、複数の国を転々と移動して生活する人々。現代の技術により実現可能なライフスタイル。"}]}, {"title_ja": "トランプ大統領の提案するアーチが「悪影響」を及ぼすと政権が認める", "title_en": "Trump's Proposed Arch Acknowledged to Have Adverse Visual Effects", "summary_ja": "トランプ政権は、提案されているアーチ記念碑が川沿いの景観を妨げる可能性があることを認めました。当局者らは、これらの悪影響は存在するものの、完全には回避できないと述べています。このプロジェクトは環境への影響と美的価値をめぐる精査に直面しています。", "summary_en": "The Trump administration has acknowledged that a proposed arch monument could obstruct views along the river. Officials stated that while these negative impacts exist, they cannot be fully avoided. The admission comes as the project faces scrutiny over its environmental and aesthetic consequences.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trumps-controversial-triumphal-arch-adverse-effects-landscape-administration/story?id=136528237", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、世界中の速報ニュースと生放送イベントを24時間体制でカバーしています。プラットフォームは主要なストーリーが展開する際に、最新の報道を提供します。視聴者は1日中、継続的なニュース更新と詳細な分析にアクセスできます。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events from around the world. The platform delivers up-to-the-minute reporting on major stories as they develop. Viewers can access continuous news updates and in-depth analysis throughout the day.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI顔認証の誤認で逮捕された祖母、1000万ドルの損害賠償を提訴", "title_en": "Grandmother Sues After False AI Facial Recognition Arrest for Bank Theft", "summary_ja": "テネシー州の祖母がAI顔認証システムの誤った照合により、ノースダコタ州で銀行強盗の容疑で不当に逮捕され、6ヶ月間拘留された。彼女は現在、1000万ドルの損害賠償を求めて提訴している。本件は、法執行機関における顔認証技術の精度と信頼性に関する懸念を浮き彫りにしている。", "summary_en": "A Tennessee grandmother was wrongfully accused of bank theft in North Dakota based on an alleged AI facial recognition match and detained for six months. She is now suing for $10 million in damages. The case highlights concerns about the accuracy and reliability of facial recognition technology in law enforcement.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/grandmother-falsely-accused-bank-theft-after-alleged-ai/story?id=136536444", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカ野生犬の兄弟3頭、大陸最長の旅を完成", "title_en": "Three Wild Dog Brothers Complete Africa's Longest Journey", "summary_ja": "ザンビアの絶滅危惧種アフリカ野生犬の兄弟3頭が、新しい縄張りを求めて2,500マイル以上を旅し、アフリカ大陸の哺乳類による最長単独移動記録を樹立しました。8ヶ月間の分散移動は、野生動物が人間が支配する風景をなお航行できることを示していますが、研究者らは種の生存のために接続された生息地の保護が重要だと警告しています。", "summary_en": "Three endangered African wild dog brothers traveled over 2,500 miles across Zambia in search of new territory, setting a record for the longest single journey by any African mammal. The epic eight-month dispersal demonstrates that wildlife can still navigate human-dominated landscapes, though researchers warn that protecting connected habitats is crucial for species survival.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/sep/17/wildlife-african-wild-dogs-longest-journey-zambia-conservation-aoe", "state_media": false, "category": "社会", "full_text": "It sounds like a Disney movie: three wild dogs, all brothers, on an epic journey to find a home of their own after their family tells them to leave. They dodge cars and hunters in search of a new life, navigating bushmeat snares and the hostility of a human-dominated landscape until they find a new haven on the African savannah.\nBut this is exactly what happened in Zambia last year, when three endangered African wild dogs made the longest-ever recorded single journey of any mammal from the continent. The brothers travelled more than 2,500 miles (4,100km) over eight months in their “dispersal” – when a young dog comes of age and must establish new territory to find a mate and start a family of their own.\nFrom point to point, starting in Kafue national park in western Zambia to their final destination in the Luangwa valley in the east of the country, the brothers covered 340 miles (546km), which is also a record.\nThe epic single journey is almost equivalent to travelling the length of Chile by foot and farther than the famous wildebeest and zebra migration across the Serengeti in east Africa. The previous record was 2,418 miles, also made by African wild dogs, which moved between Loliondo, in northern Tanzania’s Ngorongoro district, and Tsavo West national park in southern Kenya in 2012.\nDr Matt Becker, chief executive of the Zambian Carnivore Programme (ZCP), whose scientists were monitoring the wild dogs and have published their findings in the journal Ecology, says: “These extraordinary journeys show that natural connections between Africa’s wildlife strongholds still exist. But they also reveal how difficult and dangerous those journeys have become.\n“Rather than relying solely on fenced protected areas, these findings reinforce the value of investing in connected landscapes. The dogs are showing us that connectivity still works; now we need to do more to protect and strengthen it.”\nThe researchers tracked 19 separate groups of wild dogs to monitor their dispersals, including a group of sisters to the three brothers who were far less successful at finding a new range. Two of the sisters died, probably caught in snares, but not before they had a touching final encounter with their siblings.\nTwo months into their journey, the group of brothers and sisters came across each other deep in Zambia’s copper-belt mining region, spending the day together before going their separate ways again. Related dogs do not form new family packs, and typically have to travel long distances through the landscape to find prospective mates.\nOnly 6,600 or so adults remain of 39 distinct populations of African wild dogs, and the species is classified as endangered on the International Union for Conservation of Nature’s red list. Habitat loss, declining numbers of natural prey, bushmeat hunters’ snares and human conflict are among the biggest threats to their survival.\nBut researchers say the three brothers’ epic journey shows the wild dogs can still survive in a human-dominated landscape despite the enormous challenges they face. Alongside African savannah elephants, whose ancient migration routes are increasingly being blocked by human development, African wild dogs need to be able to make long journeys to find new homes.\n“These long-term studies provide key evidence that connectivity between large landscapes is still there,” says Dr Nyambe Nyambe, director of the Kavango-Zambezi transfrontier area secretariat, a key conservation region that spans five countries, including Zambia, where governments are trying to keep space for wildlife to move through the landscape.\n“If we conserve and continue to improve these connections – spanning the range of national parks, community areas, nations and regions – a lot of species like wild dogs can make the rest happen,” Nyambe says.\nFind more age of extinction coverage here, and follow the biodiversity reporters Rebecca Ratcliffe, Phoebe Weston and Patrick Greenfield in the Guardian app for more nature coverage.", "translation_ja": "", "vocab": [{"word": "dispersal", "definition": "動物が成熟後、新しい縄張りを求めて親の群れから離れて移動すること。野生動物の個体群拡大と遺伝的多様性維持に重要なプロセス。"}, {"word": "endangered", "definition": "絶滅の危機に瀕している状態を表す形容詞。IUCN赤色リストなどで、種の存続が危ぶまれる分類。"}, {"word": "habitat loss", "definition": "野生動物の生息地が人間の開発や環境破壊により減少・消滅すること。生物多様性喪失の主要な原因。"}, {"word": "connectivity", "definition": "異なる生態系や保護地域が相互に繋がっている状態。野生動物の移動と遺伝的交流を可能にする重要な特性。"}, {"word": "transfrontier", "definition": "複数の国や地域の境界を越えた地域。国際的な野生動物保護区など、広域生態系管理に用いられる概念。"}, {"word": "snares", "definition": "野生動物を捕らえるために設置された罠やワイヤーループ。違法狩猟や密猟で多くの動物が被害を受ける。"}]}, {"title_ja": "ヨハネスブルグ国際空港付近で8人の女性遺体が発見、南アフリカのフェミサイドに対する怒りが拡大", "title_en": "Discovery of Eight Women's Bodies Near Johannesburg Airport Fuels Anger Over South Africa's Femicide Crisis", "summary_ja": "ヨハネスブルグのOR タンボ国際空港近くで、過去1週間に5人を含む8人の女性遺体が発見され、南アフリカの極めて高いフェミサイド率（世界平均の約6倍）をめぐる公的な怒りが再燃しました。ランナーのエリザベス・モセラクゴモを含む女性たちの死亡により、政府への行動要求が促されていますが、2025年にラマポーザ大統領がジェンダーに基づく暴力を国家危機として宣言したにもかかわらず、具体的な対策の欠如に対する不満が高まっています。女性活動家と男性支援者たちは、女性に自分自身を保護する責任を負わせるのではなく、システム的な変化と説明責任を求めています。", "summary_en": "Eight women's bodies have been discovered near Johannesburg's OR Tambo airport in recent weeks, including five found in the past week, reigniting public outrage over South Africa's alarmingly high femicide rate—nearly six times the global average. The deaths of runner Elizabeth Moselakgomo and others have prompted calls for government action, though frustration grows over the lack of concrete measures despite President Ramaphosa's 2025 declaration of gender-based violence as a national crisis. Women activists and male advocates are demanding systemic change and accountability rather than placing responsibility on women to protect themselves.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/16/discovery-women-bodies-anger-femicide-south-africa", "state_media": false, "category": "政治", "full_text": "The discovery of the bodies of eight women around Johannesburg’s international airport, including five in the past week, has prompted an outpouring of fear, grief and anger over a lack of progress in tackling femicide.\nWhen Elizabeth “Tsontso” Moselakgomo did not return after going for a run on 9 September, her eight-year-old daughter alerted relatives, who contacted police. The 38-year-old’s body was found on Saturday and identified by relatives on Monday. The news of her disappearance had gone viral.\nPolice said in a statement on Saturday that four women’s bodies had been found since 15 July in Kempton Park, across the highway from OR Tambo international airport. All were half-naked and with visible bruising.\nOn Monday and Tuesday, two more bodies were found in the town of Olifantsfontein about 15 miles north of Kempton Park. On Tuesday, police said another woman’s body had been found 25 miles to the south-east, naked and decomposed. The acting police minister, Firoz Cachalia, said on Wednesday that another woman’s body found in Olifantsfontein on 7 September, was being added to the investigation.\n“In this country we are prey,” Sakane Mokoena posted on Instagram after confirmation of the death of her friend and fellow runner Moselakgomo.\nSouth Africa has one of the highest rates of femicide in the world. Women were killed at a rate of 12.2 per 100,000 people in 2022, nearly six times the global rate, according to the UN Office on Drugs and Crime.\nFor years, women have called on the South African government to take gender-based violence seriously. After hundreds of women protested on the eve of the G20 summit in Johannesburg in November 2025, President Cyril Ramaphosa declared it a national crisis.\nHowever, the lack of a concrete plan or action has frustrated campaigners – and women keep being killed.\nThe latest deaths are being investigated by specialist officers, who said on Saturday: “Women in and around Kempton Park are urged not to walk or run alone, particularly in isolated areas. They should avoid secluded spaces, remain vigilant and, where possible, travel or exercise in groups.”\nSouth African women responded with anger at the idea that they had to be responsible for their own safety, with many runners noting they already took precautions, such as sharing routes. “We are tired of being told to be vigilant when women are already doing everything possible to stay alive,” said the advocacy group Women For Change.\n“It should not take a missing woman, a desperate family, runners and communities searching, and a case going viral, before an area is searched with this intensity,” the group said.\nDetectives said on Saturday that they were examining a serial killer angle. However, on Monday, a police spokesperson, Athlenda Mathe, told reporters: “For now, nothing tells us that we’ve got a serial killer.”\nMathe added that a suspect in the killing in July of the first woman, her boyfriend, was in custody.\nRamaphosa said on Tuesday that he had directed police authorities to prioritise the ongoing murder investigations.\nAlthough the gender of the suspect or suspects in the other killings has not been confirmed, campaigners called on men to take responsibility for violence against women and children.\n“When some of these things happen in our presence, most of us men tend to look the other way,” said Bafana Khumalo, a co-executive director of Sonke Gender Justice.\n“You have excuses like ‘No, it’s not my business’. We feel strongly that violence against women is our business. We need, as men, to begin to face each other squarely and hold each other accountable.”\nThe identification of Moselakgomo’s body has triggered an outpouring of grief.\nMokoena met her about two years ago, when Moselakgomo joined a running club so she did not have to train alone on Saturdays.\n“She’s an amazing woman,” said Mokoena. “She always spoke about her daughter. Tsontso always said ‘Bye guys, I have to go, I have to go to my child’.\n“That’s just an example of how close she was with her baby girl. And she was a really light-spirited, funny and joyful woman, who was kind – very, very kind.”\nRunning clubs around South Africa organised events to remember Moselakgomo and Mokoena said she hoped this would help push the government and police to do more to protect women.\nShe added: “I’m just happy that the world, or at least our country, was standing still for a moment to acknowledge what is happening. Let’s get this out there and figure out exactly what is happening to women.”", "translation_ja": "", "vocab": [{"word": "femicide", "definition": "女性であることを理由に行われる殺人。性別に基づく極端な暴力の形態を指す法律用語であり、単なる殺人よりも広い社会的文脈を持ちます。"}, {"word": "outpouring", "definition": "感情や反応の大量で急速な表現。ここでは、発見されたニュースに対する人々の強い感情的反応（悲しみ、怒り）を示します。"}, {"word": "fuels", "definition": "（比喩的に）ある状況や感情をより強くする、増加させる。ここでは身体発見がフェミサイド問題への怒りを増幅させることを意味します。"}, {"word": "vigilant", "definition": "危険や問題に対して注意深く、警戒している状態。ここでは女性が常に周囲に注意を払っている必要があることを指しています。"}, {"word": "accountability", "definition": "自分の行動や決定に対して責任を取り、説明する義務。ここでは暴力を行う者や無視する者が責任を問われるべきことを示します。"}, {"word": "secluded", "definition": "人里離れた、隔離された場所。人通りが少なく、他の人との接触が少ない環境を表します。"}]}, {"title_ja": "米国、反白人差別疑惑で南アフリカ国民へのビザ制限を発表", "title_en": "US Imposes Visa Restrictions on South Africans Over Alleged Anti-White Discrimination", "summary_ja": "トランプ政権は白人アフリカーナーに対する人種差別を行っていると主張される南アフリカの当局者をターゲットとしたビザ制限を発表しました。南アフリカ政府はこれらの非難をアパルトヘイト時代の歴史的人種不平等に対処する努力の誤った表現として拒否しました。米国は援助を削減し、南アフリカの少数民族向けの別個の難民プログラムも設立しています。", "summary_en": "The Trump administration has announced visa restrictions targeting South African officials accused of racial discrimination against white Afrikaners, claiming the government pursues race-based policies. South Africa's government rejected the accusations as misrepresentation of its efforts to address historical racial inequality from the apartheid era. The US has also cut aid and established a separate refugee program for South African minorities.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/16/us-visa-restrictions-south-africans-trump-claims-anti-white-discrimination", "state_media": false, "category": "政治", "full_text": "The US has announced visa restrictions on some South Africans as Donald Trump’s administration continues to claim that South Africa’s government racially discriminates against white minority Afrikaners.\nThe announcement did not specify individuals who were barred from the US. Trump has spent his second term falsely claiming there is a “white genocide” in South Africa and railing against its affirmative action policies.\nSince the start of last year, the US has cut aid to South Africa, barred it from this year’s G20 summit in Miami and set up a refugee programme for Afrikaners and other South African racial minorities. Meanwhile, the Trump administration has been dismantling refugee and asylum programmes for people fleeing war and persecution.\n“The South African people are being failed by a government that is destroying its economy through an obsessive pursuit of racial grievance against the Afrikaner minority,” the US secretary of state, Marco Rubio, said in a post on X.\n“The South African government has consistently failed to adequately address rural crime, violent and dehumanising rhetoric, and race-based discriminatory policies against Afrikaners and other minority populations.”\nThe US visa restrictions would target “foreign nationals who enact or enable policies that promote race-based discrimination, incite violence, or enable land confiscation without compensation in South Africa”, Rubio added.\nThe US ambassador to South Africa, the conservative media activist Leo Brent Bozell III, said on X: “As has been made absolutely clear, the time for endless ‘dialogue’ has run its course … This visa restriction policy is only the first step in a series of escalatory measures that will show America’s firm resolve in this matter.”\nSouth Africa’s foreign ministry said in response that its policies were being misrepresented. “The announcement, once again, aligns with the mischaracterisation of South Africa’s domestic policies by fringe groups who wrongly portray themselves as representatives of “minorities” and Afrikaners in general,” the ministry spokesperson Chrispin Phiri said in a statement that was first published in Afrikaans.\nPhiri added: “It is our sovereign right to put in place laws that address the nation’s concern over centuries of racial injustice … South Africa respects that the United States may hold different views regarding particular measures and their implementation.”\nAfrikaners, who are descended from Dutch and French settlers, ruled South Africa during apartheid. The regime discriminated against and repressed the country’s black majority, while keeping white people safe and wealthy.\nSince Nelson Mandela took office as South Africa’s first black president in 1994, South African governments have tried to redress the country’s racial inequality, including through Black economic empowerment policies and buying land to redistribute.\nThese efforts have had limited impact. White South Africans typically have 20 times the wealth of Black people, according to a 2023 article in the Review of Political Economy, an economic journal.\nNonetheless, some white South Africans claim they are now the victims of racial discrimination, allegations that US conservatives have long promoted.\nRubio’s visa restrictions announcement criticised land expropriation without compensation. South Africa introduced a law last year that allows the government to seize land without paying for it in specific circumstances, including if it is abandoned or only held for speculation. There is no large-scale expropriation of land.\nAmong white South Africans who think they are discriminated against, many cite the far-left opposition leader Julius Malema’s repeated use of apartheid-era chant “Kill the Boer”, Boer being another word for Afrikaner. A video featuring the chant was played by Trump when he met South Africa’s president, Cyril Ramaphosa, in the Oval Office last year.\nThe ruling African National Congress party has disavowed the chant, which South African courts have ruled is not meant literally and is therefore not hate speech.", "translation_ja": "", "vocab": [{"word": "affirmative action", "definition": "歴史的な差別被害者を対象とした優遇措置や支援制度。採用や教育機会の配分において、特定グループに対して積極的な支援を行う政策を指します。"}, {"word": "expropriation", "definition": "政府が公共の利益のために私有財産を没収・収用する行為。法律に基づいて個人所有の資産を国家が取得することを意味します。"}, {"word": "redress", "definition": "過去の不正や不公正を是正・改善すること。歴史的な不平等や差別による損害を補償・解決する措置を指します。"}, {"word": "fringe groups", "definition": "主流派から外れた少数派グループや周辺的な集団。主要な見解や立場から離れた限定的な支持者たちを指します。"}, {"word": "escalatory measures", "definition": "段階的に強化される対抗措置や懲罰的な行動。状況を段々と悪化させる方向に進む一連の対策を指します。"}, {"word": "apartheid", "definition": "南アフリカで1948年から1990年代まで続いた人種隔離政策。法的に黒人や有色人種を差別し、白人支配を維持した制度を指します。"}, {"word": "disavow", "definition": "公式に否定・否認すること。関係を持たないと明言し、支持や責任を拒否する意思を表明することを意味します。"}]}, {"title_ja": "ロシア選挙：統一ロシア党の支配に他党は対抗できるか", "title_en": "Russia election: Can other parties challenge United Russia's dominance?", "summary_ja": "ロシア国民が2022年のウクライナ戦争以来初めての選挙投票に向かっており、統一ロシア党はプーチン大統領の支持を背景に20年以上権力を保持している。本報道は野党勢力がロシア政治における与党の長年の支配に対して信頼性のある対抗ができるかどうかを検証する。", "summary_en": "Russians are voting in their first election since the 2022 Ukraine war began, with United Russia maintaining control for over 20 years under President Putin's backing. The report examines whether opposition parties can mount a credible challenge to the ruling party's long-standing dominance in Russian politics.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/17/aje-onl-nf_medvedenkod-parties_challenge_united_russia-170926?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Russia election: Could other parties challenge United Russia?\nNewsFeed\nRussia election: Could other parties challenge United Russia?\nRussians head to the polls for the first time since the Russia-Ukraine war began in 2022. United Russia has been the governing party for over two decades, backed by President Vladimir Putin. Do other parties pose a challenge? Al Jazeera’s Dmitry Medvedenko reports from Moscow.\nPublished On 17 Sep 2026", "translation_ja": "", "vocab": [{"word": "challenge", "definition": "競争または対抗する力を持つこと。政治文脈では、既存の権力に対して異議を唱えたり競争したりする能力を意味する。"}, {"word": "dominance", "definition": "ある団体やグループが他を圧倒する支配的な力や地位。政治では、一党が他の政党より優位に立つ状態を指す。"}, {"word": "opposition", "definition": "政権与党に対抗する政党や勢力。権力層に反対する立場や活動を意味する。"}, {"word": "credible", "definition": "信頼できる、信じるに足る。政治的信用性や実行可能性を示す能力のこと。"}, {"word": "backing", "definition": "支持、援助、または後ろ盾。特定の候補者や政党に対する支援を意味する。"}]}, {"title_ja": "トリニダード・トバゴ、大量逮捕への反発を受けて非常事態を終了", "title_en": "Trinidad and Tobago Ends State of Emergency After Mass Arrest Backlash", "summary_ja": "トリニダード・トバゴは、容疑者を起訴なしで逮捕することを許可していた非常事態宣言を終了し、政府は代わりに恒久的な法制度を計画しています。弁護士らは約2,250人の起訴されていない人々の拘留を批判し、政府による人権侵害の可能性について調査を求めています。この動きは、犯罪対策の必要性の主張にもかかわらず、市民的自由が停止されたことへの批判に続いています。", "summary_en": "Trinidad and Tobago has terminated its state of emergency that permitted mass arrests without charge, with the government planning permanent legislation instead. Lawyers criticized the detention of approximately 2,250 people who remain uncharged, calling for investigations into potential human rights abuses. The move follows criticism over suspended civil liberties despite claims of crime-fighting necessity.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/17/trinidad-and-tobago-ends-state-of-emergency-amid-pushback-over-mass-arrests?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Trinidad and Tobago ends state of emergency amid pushback over mass arrests\nLawyers criticised mass arrests under emergency powers that allowed authorities to detain people without charge.\nThe Caribbean country of Trinidad and Tobago has ended a state of emergency that granted the government extraordinary powers to combat crime, including the ability to imprison people without charge.\nThe country’s prime minister told parliament on Wednesday that the government would not extend the state of emergency. One was issued in 2024 and another in 2025, with extensions lengthening both. Instead, the government would seek a “permanent legal framework”.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Trinidad and Tobago extends state of emergency for another three months\n- list 2 of 3Trinidad and Tobago police uncover 56 bodies, mostly children, at cemetery\n- list 3 of 3Venezuela hits out at Trinidad and Tobago in oil spill spat\n“The proposed legislation will establish a permanent legal framework for targeted operations against violent crime, gangs, illegal weapons and the criminal networks that finance them, while providing safeguards for law-abiding citizens, judicial oversight and parliamentary accountability,” Prime Minister Kamla Persad-Bissessar said in a social media post.\nThe government had faced criticism for a campaign of mass arrests that suspended key civil liberties in what it said was in the name of cracking down on crime and those the government deemed threats to security. A prominent businessman and his wife were among those arrested over alleged involvement in a plot to assassinate the prime minister, but were never charged and later released.\nThe measures were last extended in June, with the prime minister stating that more than 5,800 people have been arrested since a March extension. About 2,250 of those have yet to be charged, and it remains to be seen whether they will be released now that the state of emergency has ended.\nLawyer Criston Williams told The Associated Press news agency that he expects some of those detained without charge to bring lawsuits against the government and called for the Inter-American Commission on Human Rights to investigate possible abuses by the government.\n“They are transported to us blindfolded, shackled, hands behind their backs, a gray knapsack over their heads,” he said, adding that meetings with lawyers took place in the presence of five armed men from law enforcement, “who refer to themselves as operator one, two, three, four, five. There’s a camera above, so guess what, there’s nothing like attorney-client privilege.”\nPolice reported a record 624 killings in the country of about 1.4 million people in 2024, a figure that police say dropped to 369 in 2025. Police state that 255 killings have been recorded this year, compared with 268 over the same period in 2025.", "translation_ja": "", "vocab": [{"word": "extraordinary powers", "definition": "通常の法律を超える特別な権限。非常時に政府が通常は許可されない行動を取ることを可能にする権力を指します。"}, {"word": "suspended", "definition": "一時的に中止または停止させること。ここでは市民的自由が一時的に効力を失ったことを意味します。"}, {"word": "judicial oversight", "definition": "裁判所による監視や管理。政府の行動が法律に合致しているかを確認する司法機関の役割を指します。"}, {"word": "attorney-client privilege", "definition": "弁護士と依頼人間の通信の秘密性。法律により保護される機密通信で、第三者には開示されないべき情報を指します。"}, {"word": "detained without charge", "definition": "容疑をかけられずに拘束されること。正式な起訴なしに人が拘禁される状態を指します。"}, {"word": "safeguards", "definition": "保護措置や防御手段。権利や利益を守るために設けられた規則や制度を指します。"}]}, {"title_ja": "米国裁判官、ケネディセンターの物理的変更前に30日間の通知を命令", "title_en": "US Judge Orders 30-Day Notice Before Kennedy Center Physical Changes", "summary_ja": "連邦裁判官は、トランプ大統領の建物解体の可能性についての発言を受けて、ケネディセンターが大規模な物理的変更（解体を含む）の前に30日間の通知を提供するよう命じました。この命令は、部分的な天井の崩壊を含む構造的安全上の懸念により、今週施設が閉鎖された後に下されました。この判決は、トランプの機関の改名と改修の取り組みをめぐる法的紛争に続くものです。", "summary_en": "A federal judge has ordered the Kennedy Center to provide 30 days' notice before making major physical changes, including demolition, following President Trump's remarks about potentially demolishing the building. The order came after the performing arts venue closed this week due to structural safety concerns, including a partial ceiling collapse. The ruling follows a legal dispute over Trump's efforts to rename and renovate the institution.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/17/us-judge-orders-30-day-notice-prior-to-any-kennedy-center-physical-changes?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "US judge orders 30-day notice prior to any Kennedy Center physical changes\nThe ruling comes amid legal battle over Trump’s changes to the Kennedy Center, including his effort to rename it.\nA United States federal judge has ordered the Kennedy Center to provide 30 days’ notice before making major physical changes to the building, including demolition, after President Donald Trump said the Washington performing arts venue could be “ripped down”.\nUS District Judge Christopher Cooper issued the order on Thursday, saying it would “avoid any confusion” following the centre’s sudden closure this week.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Head of Smithsonian museums announces he will be stepping down\n- list 2 of 3US Kennedy Center faces bankruptcy, Washington Post reports\n- list 3 of 3Kennedy Center closes amid financial crisis and Trump name dispute\nThe Kennedy Center closed on Wednesday and will remain closed for at least seven days to assess what its executive director Matt Floca called “acute risks to public safety” from structural deterioration. Officials have cited a partial ceiling collapse earlier this month and problems with the building’s roof terrace canopy.\nThe temporary closure came a day after the center’s board voted to close the facility for an extended renovation. The Trump-aligned board has argued that the building, which opened in 1971, is in serious disrepair.\nTrump said on Wednesday that his administration’s efforts to restore the centre deserved recognition and warned that without them, “it’s going to close. It’ll end up being ripped down”.\nThe judge’s order followed a request from Democratic Representative Joyce Beatty, an ex officio Kennedy Center board member who has challenged Trump’s efforts to overhaul the institution. Judge Cooper rejected Beatty’s request for an emergency hearing but ordered that any major physical changes, including demolition, would require 30 days’ notice.\nOn Wednesday, an AFP news agency photograph showed Trump on board Air Force One examining a placard that appeared to depict the Kennedy Center being demolished. The image showed the words “Kennedy Center DEMOLIS…” above a picture of heavy machinery clearing rubble.\nThe AFP image was viewed millions of times on social media and made headlines in many US news outlets. The photograph was included in Beatty’s court filing on Thursday.\nThe legal dispute follows Judge Cooper’s earlier rulings that blocked efforts to add Trump’s name to the Kennedy Center without congressional approval.", "translation_ja": "", "vocab": [{"word": "ex officio", "definition": "職務上の資格で、特定の職に就いている人が自動的に持つ権利や地位。この文脈では、ボード会員がその職務に基づいて自動的に保有する権限を指します。"}, {"word": "deterioration", "definition": "徐々に悪くなる、劣化する状態。建物や設備などが時間とともに傷んでいくことを表します。"}, {"word": "emergency hearing", "definition": "緊急事態に対応するため、通常より迅速に行われる法廷審問。通常の手続きを待たずに急いで判断が必要な場合に実施されます。"}, {"word": "overhaul", "definition": "徹底的な改革や改造。システムや施設を根本的に改善するための大規模な改修作業を意味します。"}, {"word": "placard", "definition": "建物や製品に付けられた告知用の板や表示。情報や警告を公開するために使用される掲示物です。"}]}, {"title_ja": "イラン革命防衛隊がホルムズ海峡でトーゴ籍タンカーを攻撃", "title_en": "Iran Guards Strike Togo-Flagged Tanker in Strait of Hormuz", "summary_ja": "イランの革命防衛隊海軍は、ホルムズ海峡を違法に通過しようとしていたトーゴ籍の石油タンカーを木曜日に攻撃した。タンカーは火災が発生し、攻撃後に停止した。この事件はイランの国営メディアにより金曜日に報道された。", "summary_en": "Iran's Revolutionary Guards Navy attacked a Togo-flagged oil tanker attempting an illegal passage through the Strait of Hormuz on Thursday. The tanker caught fire and came to a halt following the strike. The incident was reported by Iranian state media on Friday.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/togo-flagged-tanker-stuck-in-strait-of-hormuz-iran-guards/article71478387.ece", "state_media": false, "category": "社会", "full_text": "Iran’s Revolutionary Guards Navy said it struck a Togo-flagged
