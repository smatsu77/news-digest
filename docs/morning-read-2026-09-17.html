he privatization of Cuba’s state oil company. Havana enacted 176 economic reforms in June, which expanded space for the private sector, but this did not satisfy Washington. While allowing limited U.S. fuel and food to reach the island through private distributors, the Trump administration added new sanctions against state companies and regime officials. In August, Secretary of State Marco Rubio told Axios that the policy’s timeline had shifted, saying that it would take “patience and persistence” and that the regime could survive into 2028 or beyond.\nThere are a few ways to read Rubio’s comments. One is that the administration is bluffing. It is threatening to maintain the current extraordinary sanctions pressure either to restart the stalled negotiations or to misdirect the regime ahead of a military operation. Another is that, with the United States entangled in Iran and busy managing Venezuela, Cuba has simply been demoted as a priority. The administration has put the island on life support, with just enough U.S. fuel and food allowed to reach private firms to prevent societal breakdown, but otherwise it has no new plan. Cuba policy has been set to autopilot. A third is that the administration has concluded that waiting for the one-party system to implode from within is the only viable path to regime change, even if it is long, tortuous, and uncertain.\nRegardless, what is not widely appreciated outside Cuba is how economic and state collapse—triggered by the regime’s unwillingness to reform and hastened by U.S. sanctions—is already remaking the island. The state, aside from its capacity for political repression, is rapidly weakening. The economy is contracting and growing more unequal, leaving a large underclass too poor to participate meaningfully in the new private sector. Social cohesion is fraying, and crime is rising, while plunging birth rates and emigration warp Cuba’s demographics.\nAll these trends predate the foreign oil cutoff and the newest sanctions by years, if not decades, but each now appears to be accelerating. The danger is that the longer the impasse lasts, the more they will calcify into the baseline conditions for any future transition, narrowing the chances that Cuba ever becomes a well-governed country—and increasing the likelihood of an even more dysfunctional, chaotic future instead. If nothing changes soon, a transitional government could one day find itself in the same impossible position as the men atop the ruins of the design institute: trying to build something safe, habitable, and lasting out of rubble.\nAUTHORITARIAN ANARCHY\nIn Havana, I heard a joke. “Only two things work in this country: the state security apparatus and the hospitals.” It was too generous to the hospitals. About state security, it was true. Repression is the only thing the Cuban state still does well. This owes less to any apparent abundance of resources than to the leadership’s entirely rational unity. The headquarters of the Directorate of Penal Institutions, which administers the country’s prison system, is as decrepit as any building in central Havana, with cardboard filling broken windows. But the generals and spy chiefs know how much they would lose from political liberalization. If the Trump administration has tried to convince some of them that there are off-ramps, it does not appear to have succeeded. So they stick to", "translation_ja": "", "vocab": [{"word": "impasse", "definition": "膠着状態、行き止まりを意味する。交渉や紛争が進展せず、どちらかが譲歩しない状況を指す。"}, {"word": "accelerating", "definition": "加速する、速度を増すという意味。ここでは経済的または社会的な悪化が急速に進むことを表す。"}, {"word": "calcify", "definition": "硬化する、石灰化するという本来の意味から、制度や習慣が固定化・硬直化することを比喩的に表す。"}, {"word": "unraveling", "definition": "ほどけていく、解きほぐされるという意味。政治的・経済的な秩序が次第に崩壊していく過程を指す。"}, {"word": "backchannel", "definition": "非公式な交渉ルート、秘密の通信経路を意味する。公式な外交チャネルを通さない裏での交渉を指す。"}, {"word": "fraying", "definition": "ほつれて崩れていく、裂け目が生じるという意味。社会的結束が弱まり、共通の価値観や信頼が失われることを表す。"}]}, {"title_ja": "中国の粛清は設計通りに機能している", "title_en": "China's Purges Are Working as Designed", "summary_ja": "習近平の粛清は制度的弱さを示しているという西側の見方に反して、著者は中共の粛清戦略が幹部を排除するのではなく改革する継続的な「自己革命」プロセスを通じて、実は党の耐久性を強化していると主張している。しかし、このシステムの長期的存続可能性は後継者問題の解決にかかっており、これが体制の根本的な脆弱性のままである。", "summary_en": "Contrary to Western assumptions that Xi Jinping's purges signal institutional weakness, the author argues that the CCP's purge strategy actually strengthens party durability by reforming rather than eliminating cadres through a process of continuous \"self-revolution.\" However, this system's long-term viability depends on solving the succession problem, which remains the regime's fundamental vulnerability.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinas-purges-are-working-designed", "state_media": false, "category": "オピニオン", "full_text": "For two decades, scholars believed that the main reason Chinese communist rule endured into the twenty-first century—whereas every communist regime in Europe collapsed—was that it had built sturdy, long-lasting institutions. The Chinese Communist Party (CCP) had moved away from the unpredictable personalist dictatorship of the Mao Zedong era and established the foundations of a modern state. It set term limits on its leaders, embraced collective leadership, and increasingly promoted officials based on merit, which made it resilient enough to bounce back from the external and internal shocks that had felled other socialist systems.\nChinese leader Xi Jinping, however, has spent the past decade demolishing nearly every institution that supposedly kept the party strong. He abolished presidential term limits in 2018, hollowed out collective leadership, and has declined to designate a successor. Xi has also purged high-level officials at will, especially in the most sensitive domain: the military. In January, only months after party leaders expelled nine senior military officers, the country’s Ministry of National Defense announced that General Zhang Youxia and General Liu Zhenli—until that point the People’s Liberation Army’s most senior uniformed officer and top operational commander, respectively—had been placed under investigation. Since 2022, according to data compiled by the Center for Strategic and International Studies, the party has formally purged three dozen generals and lieutenant generals, and many more are conspicuously missing.\nIn Washington, many observers see these purges as evidence of China’s weakness. They see a powerful leader consumed by suspicion and obsessed with maintaining his own grip on power. If the party’s strength were indeed based on the freestanding institutions that China had built in the post-Mao era, then Xi’s purges would be a warning sign of fragility and even a potential crackup. But the party has not shown any signs of falling apart. If anything, as these purges have continued, Xi and the party appear to have only gotten stronger.\nFar from weakening its rule, the way the CCP cleans its ranks can explain part of what makes it durable. A purge is not an event but a process—one that the party has run in nearly identical form for a century. It regularly targets, evaluates, and forces cadres to seek clemency to retain their standing within the system. The goal is to reform them rather than get rid of them entirely, which strengthens the party by encouraging obedience and dedication to the party’s cause. CCP leaders believe it’s working, too: Xi has embraced “self-revolution,” or continuous and permanent rectification, as the means by which China will escape the unhappy fate of the Soviet Union and other socialist regimes now residing in the dustbin of history. What could threaten the party’s longevity, then, is not the count of how many officials have been purged but the one problem that such a strategy cannot solve and can even make worse: how to handle succession. A regime of self-revolution will rise and fall on that question, no matter how hard it tries to avoid internal decay.\nCURE THE SICKNESS, SAVE THE PATIENT\nChina’s history of purges predates the founding of the People’s Republic, in 1949. In some cases, as has been true in similar regimes, the CCP launches violent purges to remove cadres from its ranks. The type of purge now synonymous with the actions of Joseph Stalin in the Soviet Union aims at eliminating someone from the party, whether through incarceration, exile, or death. The victim of such a purge does not come back. Mao employed this tactic as early as 1930, when he executed more than 700 army officers in a show of total control.\nBut what the CCP has also done, and what is unique to its continued rule, is not a purge in the traditional sense. CCP leaders often turn to a different method of discipline: rectification. Rectification aims to keep a person inside the party, even if sometimes at a greatly diminished status. Whereas the traditional idea of a purge seeks to eliminate enemies in the ranks (the Chinese term qingdang means to “cleanse the party”), rectification aims to retain and remold cadres while keeping them in the party’s orbit.\nThroughout its history, the CCP has sought to rectify cadres far more frequently than it has sought to eliminate them. In December 1929, in the village of Gutian, in Fujian province, Mao put forward a resolution called “On Correcting Mistaken Ideas in the Party” that asserted the party’s control of the military. The resolution also included clues as to how the party understood internal discipline: it described its targets not as enemies but as people who had deviations in their thinking. Cadres might suffer from ailments such as having a “purely military viewpoint” (a perspective untethered from politics), promoting ultrademocracy (a political system lacking party authority), and supporting individualism. Mao’s resolution tr", "translation_ja": "", "vocab": [{"word": "rectification", "definition": "党員の思想や行動を改め、党の綱領に適合させるプロセス。粛清（cleanse）とは異なり、党員を排除するのではなく、党の傘下に保ちながら改造することを意味する。"}, {"word": "cadre", "definition": "政党や政府組織の指導的幹部、特に地方レベルの党員。政治体制では重要な管理職位を占める人物を指す。"}, {"word": "purge", "definition": "組織から不要な人物や要素を除去するプロセス。政治的文脈では、政敵や異議を唱える者を権力から排除することを意味する。"}, {"word": "longevity", "definition": "長く存続すること、特に政権や体制が長期間継続する能力。中国共産党の体制維持の期間を指す。"}, {"word": "resilience", "definition": "困難や外部の衝撃に耐える能力、および回復力。制度が外的ショックから立ち直る強さを示す。"}, {"word": "freestanding", "definition": "独立して存在する、他の支援を必要としない。制度が個人の権力に依存せず自律的に機能することを指す。"}, {"word": "succession", "definition": "権力や地位が次の人物に引き継がれるプロセス。指導者の交代と新しい指導者の決定を意味する。"}]}, {"title_ja": "トランプとシーは米中の悪循環を止められない", "title_en": "Trump and Xi Can't Stop the U.S.-China Spiral", "summary_ja": "著者は、歴史的な米中外交の成功例にもかかわらず、現在の状況とトランプとシーの性格により、変革的な首脳会談は困難だと主張している。両指導者は構造的な競争を解決するために必要な外交手腕と相互信頼に欠けており、トランプの衝動性とシーの妥協への嫌悪が実質的な進展を妨げている。", "summary_en": "The author argues that despite historical precedents of successful U.S.-China diplomatic breakthroughs, current conditions and the personalities of Trump and Xi make transformative summits unlikely. Both leaders lack the diplomatic acuity and mutual trust necessary to resolve structural rivalries, with Trump's impulsiveness and Xi's aversion to compromise hindering meaningful progress.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/trump-and-xi-cant-stop-us-china-spiral-orville-schell", "state_media": false, "category": "オピニオン", "full_text": "The United States’ epic twentieth-century successes in diplomacy set dangerously high expectations. Germany and Japan surrendered unconditionally in 1945; U.S. President Harry Truman created NATO in 1949; President John F. Kennedy resolved the Cuban missile crisis in 1962 through secret diplomatic exchanges with the Soviet premier; and in the 1980s, President Ronald Reagan, with Soviet leader Mikhail Gorbachev, negotiated landmark arms-control agreements to wind down the Cold War. Such victories accustomed many Americans to imagining that their skilled leaders could break seemingly intractable political deadlocks in decisive ways.\nThis hope runs especially deep in China watchers. Their sense of how diplomacy between the United States and China can unfold at its best was shaped by that game-changing moment in 1972 when U.S. President Richard Nixon and his national security adviser, Henry Kissinger, redrew the world’s geopolitical map in the course of a weeklong visit with Chinese Chairman Mao Zedong and Premier Zhou Enlai, transforming the Cold War from a largely bipolar contest into a triangular one. Then, in 1979, U.S. President Jimmy Carter threw the door open to China in a theatrical way by welcoming the country’s paramount leader, Deng Xiaoping, to the White House and restoring formal diplomatic relations with Beijing.\nToday, as U.S.-Chinese relations spiral into an ever more adversarial state, the longing for another breakthrough delivered by “great men” is especially acute. U.S. President Donald Trump has egged on that desire by boastfully insisting that he alone can cut the kinds of deals the United States needs through force of personality. Even seasoned foreign policy hands who consider themselves realistic have been prone to entertaining unrealistic visions of success. When a Beijing summit between Trump and Xi was announced for the spring of 2026, the meeting was sanguinely billed in Foreign Affairs as “a geopolitical heavyweight matchup” that could “change the course of U.S.-China competition.”\nSadly, no such breakthrough came to pass. The May summit in Beijing, which I attended as a member of the press corps for this magazine, may have helped sustain a cryptic peace—a “constructive strategic stability,” as Xi euphemistically termed it. But it did not change the fundamentally adversarial nature of the relationship between the two countries. They remain locked in a dynamic of strategic ambiguity marked by endless bouts of punitive “chokehold” diplomacy, with each exploiting its control over critical supply chains to pressure the other.\nNow, another Trump-Xi summit is scheduled to begin in Washington on September 23, and yearnings for a conclusive breakthrough are resurfacing. They should be tempered. The same limitations that crimped the May summit will constrain the upcoming one. The problem is not simply that the United States and China have different ideologies and political systems. It is also that neither of their leaders is suited to the kind of bargaining their current rivalry demands. Xi equates compromise with weakness and has a hard time understanding the give-a-little-to-get-a-little logic that is the heart and soul of diplomacy. And Trump is so contradictory and impetuous that his pandering, “tech bro” side is in such an uncomfortable state of tension with his belligerent side that effective diplomacy becomes almost impossible.\nIn the past, the United States and China achieved breakthroughs when conditions were just right and leaders with great diplomatic acuity were in charge. The circumstances today are less favorable. Despite Trump’s simulacrum of camaraderie, he and Xi simply do not have the symmetries to build the kind of genuine fraternity and trust needed to resolve deep structural problems. As long as these two men lead their respective countries, the likelihood is that their summits will barely be able to manage the rivalry at best. At worst, they may exacerbate it by letting push come to shove.\nTHE TRUST FACTOR\nHistorically, successful U.S.-Chinese summits have relied heavily on leaders’ ability to break through the barriers of distrust. But the kind of superficial flattery and bonhomie in which Trump can excel when he is trying to make nice does not generate the deeper confidence that has assured Chinese leaders in the past. And for Beijing and Washington it has never been easy to establish that kind of trust: Chinese leaders are steeped in paranoid fears about foreigners’ ambitions to bring regime change to communist systems. Nixon understood this; before he went to China, he laid the groundwork in Foreign Affairs, saying it was time to welcome China into “the family of nations.” Such a framing suggested that at least for the moment, he was willing to accept China’s system for the sake of uniting behind the common interest of opposing Soviet expansionism.\nTo increase transparency and trust ahead of their meeting, Nixon sent Kissinger and Kissinger’s deputy, Winston Lord, t", "translation_ja": "", "vocab": [{"word": "intractable", "definition": "解決困難な、手に負えない問題や状況を指す。政治的な行き詰まりやジレンマなど、容易には解決できない複雑な問題に使用される。"}, {"word": "geopolitical", "definition": "地政学的な、国家間の政治的・戦略的な関係と地理的要因の相互作用に関する。国際関係や大国間の競争を分析する際に用いられる。"}, {"word": "adversarial", "definition": "敵対的な、対立的な関係を示す。競争や紛争が存在する状態や、相互に対立する立場を表現する。"}, {"word": "ambiguity", "definition": "曖昧さ、不明確さ。複数の解釈が可能な状態や、意図的に不透明にされた関係や政策を指す。"}, {"word": "bonhomie", "definition": "気さくで友好的な態度、親友関係のような親密さ。表面的な友好関係や作られた親密感を指すことも多い。"}, {"word": "acuity", "definition": "敏感さ、鋭敏さ、特に判断力や認識能力の優れた状態。外交手腕や分析能力などの高さを表現する。"}, {"word": "exacerbate", "definition": "悪化させる、状況を一層深刻にする。問題や対立をより厳しくすることを意味する。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-17 23:13 JST";
  renderTabs();renderList();
})();
</script>
