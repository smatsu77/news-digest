s a percentage of a good's value and paid to the government by businesses importing products.\nSome of these rates will be effectively reduced because of caps on tariffs Trump has agreed to. Individual countries also face different levies.\nThe proposed tariffs will affect goods from China, the European Union, Singapore, Switzerland, Indonesia, Malaysia, Cambodia, Thailand, Korea, Vietnam, Taiwan, Bangladesh, Japan, and India.\nThe USTR's Jamieson Greer said the latest tariffs issued would \"level the playing field for American workers and chart a new, more sustainable course for the world economy\".\nHe said that many of America's trading partners had \"for decades\" adopted industrial strategies which included \"targeting manufacturing, wage and labor suppression\".\nThey also employ \"other market distorting practices that tilt the trade balance in their favour while eroding America's manufacturing base\", Greer said.\nBut economists have warned tariffs can fuel inflation and push prices up for consumers if businesses pass on higher costs, as well as dampen global trade.\nTrump has repeatedly threatened or imposed tariffs during his second term, arguing they will boost US manufacturing and create jobs.\nDespite a poor result for the Republican party in the midterm elections, the president has continued to press on with his flagship trade policy.\nTrump is also seeking to cut the US trade deficit - the gap between the value of goods it buys from other countries and those it sells to them.\nThese new levies are build on a \"stronger legal foundation\" under US law compared with Trump's April 2025 Liberation Day tariffs, Singapore Management University economics lecturer Chang Pao-Li said.\nTrump previously invoked emergency presidential powers to impose tariffs that have since been struck down, while his latest approach relies on the USTR's authority to impose tariffs to address certain foreign trade practices, she said.\nThe levies are still likely to face legal challenges, but there has been a \"historical precedent\" for such tariffs remaining in force, Chang said.\nMany tariffs imposed under Section 301 - a law that allows the US to probe and retaliate against foreign trade practices - during Trump's first term remained in effect during his successor Joe Biden's administration.\nHowever, Stephen Brown, chief North America economist for Capital Economics, said the latest tariff announcement was \"not as alarming as it looks\", due to the taxes \"essentially replacing\" previously announced tariffs made in the summer.\n\"The increase in the effective tariff rate looks set to be a touch lower than we've been assuming for our forecasts, although the new tariffs will still provide a marginal boost to prices,\" he said in a note.\nThe additional tariff burden is likely to be small because a limited number of goods are subject to the new duties, Brown added.\nJurisdictions affected by the new wave of tariffs have voiced their disapproval over the Trump administration's move.\nWashington has also proposed a 10% tariff on goods from Brazil, as part of a separate investigation over what it says are \"harmful trade practices\" undercutting American workers.\nBrazilian authorities expressed their \"outrage\" at the announcement, saying that the move is aimed at pressuring the government to change regulations around issues like digital trade.\nThe South American nation faces duties on finished aircraft and sugar sold to the US.\n\"Brazil will not yield to such threats,\" President Luiz Inacio Lula da Silva's office said.\nThe European Commission rejected the new US tariffs, saying it would investigate the reasons for bringing them in. It pointed out that tariffs are limited to the 15% previously agreed.\nThe latest tariff rate is \"not consistent\" with the reality of bilateral economic-trade cooperation between the US and Vietnam, Vietnamese Deputy Prime Minister Bui Thanh Son ", "translation_ja": "", "vocab": []}, {"title_ja": "地球防衛実験の対象となった小惑星の画像、スタジアム規模のクレーターを明らかに", "title_en": "Images of asteroid targeted to test Earth's defences reveal stadium-sized crater", "summary_ja": "NASAが意図的に衝突させた小惑星ディモルフォスの画像により、スタジアム規模のクレーターが発見されました。2022年の衝突実験により小惑星の軌道が33分短縮され、惑星防衛システムの有効性が実証されました。欧州宇宇宙機関のHera探査機が衝突後の詳細な調査を行い、今後の小惑星衝突防止に必要な情報を収集しています。", "summary_en": "The asteroid's surface was transformed after a spacecraft was deliberately crashed into it four years ago", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cw8dv112r5gmo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Images of asteroid targeted to test Earth's defences reveal stadium-sized crater\n- Published\nThe first images of an asteroid that Nasa deliberately crashed into have revealed a stadium-sized crater on its surface.\nThe extensive damage was caused when a Nasa spacecraft hit the asteroid Dimorphos in 2022. The asteroid posed no threat, but this was a test of our planetary defences to see if it was possible to knock a space rock off course.\nFour years on, a European Space Agency (ESA) spacecraft called Hera is scouring the scene to fully assess the aftermath of the collision.\n\"The crater is almost as large as the body itself, which is really, really spectacular,\" said Dr Sabina Raducan, a planetary scientist, who is on the Hera science team.\n\"It's hard to describe in words all the excitement to actually finally see what happened. And as a crater person, I can also say it's beautiful.\"\nThe original 2022 crash test was carried out by a Nasa spacecraft called Dart which hurtled into Dimorphos at 14,000mph (22,000km/h).\nIt was such a big smash-up that the trail of debris, measuring about 6,200 miles long (10,000km), was spotted by telescopes on Earth and in space.\nDimorphos is about 150m (500ft) wide and was partly chosen as the target because it is one of an asteroid pair - it orbits around a larger space rock called Didymos, which is about 730m (2,400ft) wide.\nThe crash showed it was possible to change the path of the smaller asteroid.\nBefore the collision, it took Dimorphos 11 hours and 55 minutes to orbit around Didymos. After the crash, the duration of its orbit had shrunk by about 33 minutes.\nA key objective of the Hera mission is to measure the mass of Dimorphos, in order to work out how effective the spacecraft's shove was.\nThis information would be vital if we ever spotted a space rock that was on a collision course with Earth.\n\"It would help us to predict what would happen if we had to hit another asteroid,\" said Prof Simon Green, a planetary scientist who is on Hera's science team.\n\"We [could] measure its properties and say: 'Well, we need this mass of spacecraft, travelling at this speed, this early, in order to deflect it enough so that it misses the Earth'.\"\nHera's arrival on the scene is helping scientists answer many more questions too.\nNot only did the collision alter the shape of Dimorphos, it also changed the way it moves.\n\"Before the Dart impact, Dimorphos was more like our own Moon - so it was always showing the same face to Didymos, and it was behaving quite nicely,\" explained Raducan.\n\"Now it's very, very chaotic - it's tumbling. Imagine a barrel that you throw down the stairs, and the barrel is rolling and it's moving, and basically that's what Dimorphos does right now around Didymos.\"\nHera has also taken detailed images of Didymos, revealing its surface in detail.\n\"The gravity at the surface of Didymos is about 40,000 times less than the gravity on Earth,\" said Naomi Murdoch, who is on the Hera mission team.\n\"We can already see some fascinating and complex geology. We can see regions of boulders.\n\"The smallest details that we can make out in these images are about 3m in size. So that means that all the boulders that you can see with your eyes are at least 3m big, and some as big as 10m. So what we're seeing here is boulders the size of cars and buses sitting on a world with almost no gravity.\"\nThe Hera mission will spend the next six months studying Dimorphos and Didymos, sending back more images taken from closer up in higher resolution.\n\"Hera is a sort of Inspector Columbo going back to the crash scene to investigate what is the outcome of this impact,\" said Patrick Michel, principal investigator of ESA's Hera mission.\nThe spacecraft is packed with instruments and also has two shoe-boxed sized satellites onboard, which can study the impact site up close, and then later land on the asteroid.\nBut the first images taken by Hera have also revealed a new challenge. Dimorphos and Didymos are travelling through space surrounded by hundreds of boulders ranging in size from tens of centimetres to metre-size rocks.\nThis will make it especially challenging to operate the spacecraft and cube satellites through this boulder field.\nAsteroids pose a significant threat to our planet.\nThe biggest, which measures more than a kilometre across, could cause global devastation. But medium-sized asteroids around the same dimensions as Dimorphos could wipe out a city.\n\"We all know what happened to the dinosaurs, right? And we don't want that to happen to us,\" said Carolyn Ernst at Johns Hopkins Applied Physics Laboratory, who has worked on both the Dart and Hera missions.\n\"The good news for us is that there are far fewer potential threats out there in the Solar System than there were millions of years ago. But there are objects out there.\"\nShe said the biggest asteroids have been spotted, and none are heading to Earth.\n\"The smallest stuff isn't too much of a threat because our atmosphere protects us,\" she added.", "translation_ja": "", "vocab": []}, {"title_ja": "カイロの高速道路で燃料タンカー衝突、大火災で31人が死亡", "title_en": "Thirty-one killed in massive fire as fuel tanker crashes on Cairo highway", "summary_ja": "カイロの環状道路で燃料タンカーが衝突し大火災が発生し、31人が死亡、21人が負傷しました。高電圧ケーブルがタンカーの前に落下して運転手が操舵を失い、タンカーが横転して火災が発生したと報道されています。エジプトでは近年、インフラの老朽化と緊急対応の遅れにより火災事故が多発しています。", "summary_en": "Another 21 are injured after the tanker reportedly overturns on a busy ring road in the Egyptian capital.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqy7rn30v314o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Thirty-one killed in massive fire as fuel tanker crashes on Cairo highway\n- Published\nThirty-one people have been killed and 21 others injured in a large fire on a busy highway in Cairo after a fuel tanker crashed, Egypt's health ministry says.\nHospitals nearby treated patients suffering burns and smoke inhalation after the incident, which occurred on a section of a ring road in the Warraq neighbourhood, to the north of the old city centre, on Wednesday evening.\nFootage circulating on social media showed billowing flames and black smoke towering high into the night sky, with multiple nearby vehicles torched.\nOfficials have not given an account of how the fire broke out, but state-owned media reported the tanker had overturned, dousing nearby vehicles with petrol.\nThe regional public prosecutor has launched an investigation into the incident and asked that DNA samples be taken from bodies of the dead.\nThe tanker, which belonged to a private contractor, had been travelling along the highway when a high-voltage cable fell in front of it, prompting the driver to lose control, Al-Ahram reports, citing sources with knowledge of the investigation.\nIt then crossed the central reservation, overturned and caught fire, the state-owned newspaper says.\nEgypt has suffered several deadly fires in recent years, with informal residential areas and often run-down infrastructure making incidents more common, the response to which is often complicated by slow emergency response times and locally improvised rescue efforts, even in the sprawling Egyptian capital.\nImages from the scene show a large crowd gathered on the highway after the fire had been extinguished, as emergency services blocked off entry routes.\nThe health ministry said 39 ambulances had been dispatched to respond to the fire, while it posted images of Egypt's health minister overseeing the treatment of the injured at one of Cairo's hospitals.\nRoad collisions are also common in Egypt, often attributed to lax maintenance and the widespread flouting of traffic laws.\nNearly 6,000 people died on Egypt's roads last year, official figures show, a rise of several hundred on the previous year's total.\nEmergency responders have since cleared the highway and allowed it to reopen, state broadcaster NMA reports.\nA bulldozer could earlier be seen at the scene clearing the burnt-out wrecks of cars.", "translation_ja": "", "vocab": []}, {"title_ja": "英国政府、EUとの新条約を発表予定", "title_en": "UK government set to publish new treaties agreed with EU", "summary_ja": "英国政府とEUは木曜日午後、先週合意した2つの条約の文書を発表する予定です。条約には10年間の終了条項が含まれており、その期間内にいずれかの当事者が合意を終了した場合、国境検査インフラの再構築費用を支払う必要があります。この新規取引はイギリスの食品輸出に16%の増加をもたらすと予想されています。", "summary_en": "The BBC understands the treaties contain a 10-year termination clause to reimburse costs of any need to rebuild border checks infrastructure.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c98r7p65edvgo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK government set to publish new treaties agreed with EU\n- Published\nThe government and the EU is set to publish the texts of two treaties on Thursday afternoon that were agreed last week as part of a new deal with the EU, as well as the UK legislation to enact the bulk of the deal.\nThe BBC understands the treaties contain a 10-year termination clause that would mean if one party ended the agreement in that time they would have to pay to rebuild border checks infrastructure, which will be significantly scaled back as part of the new deal.\nThat means that if a future government or the EU ended the deal, they would have to pay potentially significant costs to re-establish border controls.\nOpposition leader Kemi Badenoch and Reform UK's Nigel Farage have suggested they would refuse to pay.\nThe Brexit reset deal has already sparked debate about its benefits, its costs, and a wider discussion on the long-term UK-EU relationship.\nThe deal covers British food exports, emissions trading and a youth experience scheme.\nTwo of the three legal texts will be released on Thursday, covering the food trade and emissions trading scheme deals, alongside the government's cost-cutting bill to enact the deal.\nThe treaties will also have an impact on the UK aviation and maritime industries in terms of their alignment with EU emissions schemes.\nNew assessments of the impact of the deal on different sectors and regions of the country are also expected.\n- EU offers UK fresh deal on 'Made in Europe' scheme \n  - Published10 hours ago\n- Badenoch challenges Burnham over university fees for EU students \n  - Published10 hours ago\n- Farage helps launch new campaign against the UK rejoining the EU \n  - Published8 hours ago\nUnder the deal, food exporters will be significant beneficiaries from the scrapping of considerable red tape and checks, and dismantling of border facilities. An internal analysis forecasts a 16% boost to agricultural exports.\nThe industry and government hope the reduction in costs for food producers and sellers will be passed on to customers, but there may be no clear visible impact at the checkout.\nPrivately, industry insiders told the BBC earlier this week that there are too many moving parts in the world economy, especially given the energy price shock resulting from war in the Middle East.\nRegarding the fine detail in the text of one of the treaties relating to the 10-year termination clause, European affairs minister Hamish Falconer said: \"The Cutting Costs Bill allows us to implement two major trade agreements.\"\n\"It allows us to eliminate paperwork for our food and drink traders, protect billions of pounds worth of British exports from carbon taxes, and make doing business with our largest trading partner cheaper and easier.\"\nThe BBC also understands that full details of a plan to link British and EU emissions trading schemes will see more of the UK aviation and maritime industries covered.\nThe treaty text will also contain the fine detail of how the UK will observe, shape but not vote on relevant EU rules.\nPlans to use secondary legislation, including granting direct so-called \"Henry VIII powers\" to ministers to align UK and EU laws will also be detailed in the legislation.\nOutlining the agreement with the EU to MPs earlier this week, the prime minister said new agreements with the EU are \"pragmatic\" and \"not a prelude to anything\".\nAndy Burnham also said it would be \"unthinkable\" for the UK to rejoin the bloc without a referendum.\nSeveral former prime ministers have urged him not to reopen the Brexit debate. Burnham said they are \"stuck in the past\" and later claimed there would be \"no banging on about Europe\" from Labour.\nBadenoch said Burnham has \"oversold\" the deal and was \"trying to take Britain back to 2015\".", "translation_ja": "", "vocab": []}, {"title_ja": "ストーキング罪を単一犯罪に統一へ 英国法改正", "title_en": "Stalking law simplified to become one offence", "summary_ja": "イングランドとウェールズでストーキング罪が単一の独立犯罪として新たに創設される。従来は複数の犯罪に分かれており、恐怖や苦痛の証明が必要だったが、法律は「複雑で混乱していた」とされた。ただし、最高刑は10年のままとなり、被害者らは刑罰の軽さに失望を表明している。", "summary_en": "The new stalking offence will be introduced after a review found existing legislation was confusing.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8lydnlkq7xno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Stalking law simplified to become one offence\n- Published\nA new standalone offence of stalking is to be created in England and Wales after a review found the law regarding the crime was \"cluttered and confused\" - but the maximum sentence will not be increased.\nSpecific stalking offences were introduced in 2012 but the underlying offence of harassment had to be established, and additional factors such as fear or distress proven, for it to be considered stalking.\nA review was ordered by the government last year, led by Richard Wright KC, who prosecuted the man who stalked and murdered Alice Ruggles in Gateshead in 2016.\nVictims of stalking have welcomed the change in law but said they were disappointed not all the recommendations have been adopted.\nKatherine, from Newcastle, whose former partner was arrested 28 times for stalking her, welcomed the government's decision to introduce one stalking offence instead of two.\n\"I'm pleased about that one because my ex was charged with [the lesser offence] of stalking without fear to start with and I was terrified,\" she said.\n\"Anyone who's been stalked knows how terrifying it is, so that one [without fear] was just pointless.\"\nBut her ex had resumed his behaviour after being sentenced to three years and four months in prison, and she criticised the length of jail terms given to stalkers, which she described as \"an absolute joke and an insult to the victims\".\nAshley, from Washington, in Tyne and Wear, was also disappointed the maximum sentence would not be increased.\n\"Stalking can have a devastating and lifelong impact on victims and their families,\" she said.\n\"It affects your confidence, independence and ability to feel safe, even long after the relationship has ended and the perpetrator has been sentenced.\"\nOf the two current offences, only the more serious charge, which requires proof of fear of violence on at least two occasions, can be tried in the Crown Court, where the potential sentence is greater.\nThe government has accepted the introduction of a single offence for stalking that can be tried in either Crown or magistrates' court and described it as the \"biggest shake-up of stalking laws in more than a decade\".\nBut documents seen by the BBC show ministers rejected Wright's proposal to raise the maximum sentence from 10 to 14 years.\nMinisters said the average sentence for the more serious stalking offence in the year to March was 18.6 months, suggesting the existing maximum was not being fully used.\nSafeguarding minister Satvir Kaur said: \"It's really important that victims know that we are holding perpetrators to account and feeling the full force of the law.\n\"The average sentences being given aren't good enough.\"\nShe said judges were already able to jail stalkers for 10 years so it was better to work with them to make sure they used the powers available to them than \"changing the goal posts\" on the maximum sentence.\nThe review was submitted to ministers earlier this year and last month Alice Ruggles's father, Clive Ruggles, said victims of stalking would be at greater risk of dying if the government failed to publish and act on the recommendations.\nAlice was killed in her Gateshead flat by her ex-boyfriend Trimaan Dhillon, who was found guilty of murdering the 24-year-old and jailed for 22 years.\nHer family has campaigned for better recognition of stalking and improvements in how it is tackled.\nReacting to Thursday's announcement, Alice's parents said they \"welcomed\" the report and recommendations.\nThey added they were \"heartened\" that the response \"endorses the need for a single stalking offence that focuses on the perpetrator's behaviour and removes the onus on police and the CPS to prove the impact upon the victim\".\nWright's review concluded confusion between stalking and harassment laws could contribute to failures in identifying and prosecuting the crime.\nA previous investigation into police handling of stalking found three in every 20 stalking crimes examined had been incorrectly recorded as other offences, including harassment.\nThe review also recommends removing the need for victims to demonstrate actual fear or serious disruption to their lives for a stalking offence to be established.\nWright argues this would better protect victims who were unaware they are being secretly followed or monitored.\nThe government said it would explore introducing such a test but had not yet committed to its inclusion in the new offence, although Kaur said she was \"sick and tired of it being the onus on the victim\".\n'AirTag stalking'\nThe review called for more consistent police investigations and greater use of specialist interventions to protect victims.\nIt also raised concerns about stalkers using applications to change protective orders as a means of maintaining contact with, or control over, victims.\nWright suggests additional safeguards, including requiring court permission before certain applications can proceed and ensuring victims can make representations.\nThe gove", "translation_ja": "", "vocab": []}, {"title_ja": "英国の季節が変化、冬の霜が減少し夏の猛暑日が増加 - 気象庁が発表", "title_en": "Expect fewer frosts and more hot days as UK seasons shift, says Met Office", "summary_ja": "英国気象庁の新たな分析によると、英国の季節が変化しており、冬の霜の日数は過去10年間で約25%減少した一方、夏日（気温25℃以上）は2倍以上に増加しました。気候変動が主な原因であり、特に南イングランドでは冬の霜の日が約3分の1減少し、ロンドン地域では30℃以上の日数が平均1.3日から6.1日に急増しています。", "summary_en": "Changing seasons are affecting wildlife and leading some farmers to grow different crops.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/weather/articles/cr3eg1py3gv5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Expect fewer frosts and more hot days as UK seasons shift, says Met Office\n- Published\nThe UK's seasons are changing, with fewer winter frosts and more hot summer days, according to new analysis from the Met Office.\nAcross the UK, the number of winter days with an air frost – when the air temperature falls to 0C or below – was around a quarter lower in the decade to 2025 than during the period from 1961 to 1990.\nIn southern England, the reduction was around a third while the average number of UK summer days reaching 25C has more than doubled.\nThe Met Office says climate change has led to these seasonal shifts.\n\"Our summer is getting wider and our winter is getting smaller,\" says Dr James Pope, climate scientist at the Met Office.\n\"The driver of this is that the whole global climate is warming. And that impacts on the UK.\n\"Some areas went from their wettest ever winter to a severe drought via a record-breaking summer for the whole country.\"\nThe changing conditions have affected wildlife and led some farmers to grow different crops.\nWhere have winters changed most?\nSome of the biggest reductions in winter air frosts have been in England, Wales and Northern Ireland, where the average number of days has fallen by around 11 compared with 1961 to 1990.\nSouthern England has seen other significant changes. In Cornwall, the average number of winter air frost days has almost halved, falling from around 18 to just 10.\nOn the Isle of Wight, the figure has also fallen by almost half, from around 21 to 11 days.\nScotland remains the frostiest UK nation, but has also seen a reduction, from around 45 to 38 winter air frost days.\nWhere are summers getting hotter?\nSummer days reaching 25C have become more common across the UK.\nSome of the biggest increases have been in southern England, where the average number of summer days reaching 25C has more than doubled, from just over eight to more than 16.\nIn Essex and Suffolk, they have risen by almost 13 days in both counties.\nThe Met Office defines a hot day as one where the temperature reaches 30C or above.\nAcross the UK, the average number of these days has increased fourfold, from 0.3 to 1.2 per summer.\nThe increase is particularly striking in Greater London, where days reaching 30C have risen from an average of 1.3 to 6.1 per summer.\nSummer 2026 was the hottest on record, according to provisional Met Office data.\nThere were five widespread heatwaves and 40 days of temperatures above 30C, smashing the previous record of 34 days.\nWhat's the impact on food?\n\"Humans, animals and crops are encountering extremes of temperature that we've not seen before and this is a physiological challenge to all three,\" says Thomas Crocker, science manager with the Met Office's climate security team.\nThis has led to water challenges, he says, with wet winters causing problems with planting, pests and diseases.\nDry summers have meant there has not been enough water to grow crops.\n\"The impact on horticulture is seismic, it's affected all crops,\" says John Walgate, CEO of British Growers, which represents most British horticultural organisations growing vegetable and fruit.\nWalgate says this year's weather has been particularly tough for brassicas like cauliflowers, cabbages and broccoli, with yields down by about 50%.\nIrrigated crops such as onions, potatoes and carrots also suffered from a lack of water due to low rainfall and hot temperatures.\nIt's not all been bad though. Walgate says soft fruit such as strawberries have had a \"good year\".\nTim Young and his family have been farming in Norfolk since the 1960s.\nBut his arable crops - onions, wheat and sugar beet - have been struggling because of the hotter, drier summers and fewer cold days in winter which kill bugs.\nWith some crop yields decreasing, Young has been looking at ways to diversify the farm's income and planted a vineyard three years ago.\nLast year he harvested double the expected amount of grapes.\n\"With climate change, the frontier is moving further north of where we can grow grapes,\" he says.\nDespite annual variations in weather, he is confident it can be profitable.\nWhat's the impact on wildlife?\nChanging weather patterns are shifting where species live and when they migrate, breed and feed, says Zoe Quiroz Cullen, head of climate and international policy at The Wildlife Trusts charity.\nWarmer winters mean bats are waking from hibernation when there are too few insects to feed, she says, while amphibians emerging and spawning earlier can be caught out by cold snaps.\nMeanwhile, warmer springs mean oak trees are coming into leaf earlier than usual, and caterpillars are hatching earlier.\nThe UK's bird population has fallen in recent decades, largely because of habitat loss and climate change, external.\nStarlings and swifts have declined significantly, although milder winters and conservation work have helped some species thrive.\nKevin Anderson, visitor experience officer at Somerset Wildlife Trust, has worked at Avalon Marshes for 15 ye", "translation_ja": "", "vocab": []}, {"title_ja": "米国の感謝祭行事が極端な気象に脅かされている", "title_en": "Extreme weather threatens Thanksgiving festivities in US", "summary_ja": "米国東海岸の極端な気象により、ニューヨークの象徴的なメイシー感謝祭デーパレードが100年の歴史で初めて延期され、土曜日の午前8時30分に変更されました。ニューヨーク市長は安全を最優先とする声明を発表し、時速30～40マイルの持続的な風と最大60～65マイルの突風が予想されていると述べました。東海岸の強風、西部の沿岸洪水、中西部の積雪により、感謝祭期間の交通に大きな混乱が予想されています。", "summary_en": "A major storm is forecast to move up the US East Coast and is likely to cause travel delays. Weather warnings were enough to postpone Macy's Thanksgiving Day Parade for the first time in its 100 years.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/extreme-weather-threatens-thanksgiving-festivities-in-us/a-80055880?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Extreme weather threatens Thanksgiving festivities in US\nNovember 26, 2026\nNew York's iconic Macy's Thanksgiving Day Parade has been postponed for the first time in its 100-year history as extreme weather threatens to disrupt the plans of tens of millions of Americans.\nThe parade has now been pushed back to 8:30 a.m. EST (1330 GMT) Saturday.\n\"Our team is now working through the complex operational logistics required to bring the Parade to life on Saturday, and we will share additional details as they are finalized,\" the company said.\nNew York City Mayor Zohran Mandani said: \"I know that this change of plans will cause inconveniences, yet safety has to come first.\"\n\"This will be a heavy storm. We are expecting sustained winds between 30 and 40 miles per hour, with gusts as high as 60 to 65 miles per hour possible,\" he added.\nNBC, which broadcasts the parade, said it will instead show a rerun of the 2025 edition on Thursday.\nTransport disruptions expected\nDespite gale-force winds on the East Coast, coastal flooding in the West and snow in the Midwest, travelers flocked to airports, roads and railways Wednesday for one of America's busiest travel periods of the year.\nA major storm developing on the Eastern Seaboard could bring heavy rain, coastal flooding, high winds and power outages to the Carolinas on Wednesday. It is forecast to move to the northern Mid-Atlantic and Northeast on Thanksgiving and is expected to affect air travel at airports in the region.\nAlready on Wednesday, the security line at New York City's John F. Kennedy International Airport topped one hour.\nIn the Midwest, winter storm warnings and watches were posted for parts of Missouri and Illinois, with up to 13 inches (33 centimeters) of snow expected in the St. Louis area by Thursday afternoon.\nMeanwhile, on the West Coast, king tides were to continue to inundate some coastal areas.", "translation_ja": "", "vocab": []}, {"title_ja": "デュラン・デュランのギタリスト、アンディ・テイラーが65歳で死去", "title_en": "Duran Duran guitarist Andy Taylor dies at 65", "summary_ja": "デュラン・デュランのギタリスト、アンディ・テイラーが前立腺がんとの長期の闘病の末、65歳で亡くなった。テイラーは1980年代のニューウェーブの大ヒット曲「Girls on Film」「Hungry Like The Wolf」「Rio」の制作に貢献し、革新的なミュージックビデオを通じてMTVの初期の成功を牽引した。バンドは2022年のロックの殿堂入りの際の再結成時にテイラーが第4段階の転移性前立腺がんと闘っていることを明かしていた。", "summary_en": "Andy Taylor first revealed he was battling cancer in 2022 when Duran Duran was inducted into the Rock & Roll Hall of Fame. The band had numerous hits in the 1980s, including \"Girls on Film\" and \"Hungry Like The Wolf.\"", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/duran-duran-guitarist-andy-taylor-dies-at-65/a-80055654?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Duran Duran guitarist Andy Taylor dies at 65\nNovember 25, 2026\nDuran Duran guitarist Andy Taylor died after \"a long and courageous battle with prostate cancer,\" his family announced on Wednesday. He was 65.\nTaylor was responsible for 1980s new wave hits like \"Girls on Film,\" \"Hungry Like The Wolf\" and \"Rio.\"\nThe band's pioneering music videos helped drive early success, including through airtime on MTV.\n\"From the moment he arrived in Birmingham from the North East with a guitar and an unshakeable belief in what we could become, he brought an indelible fire and swagger to our music,\" the band said in a statement.\n\"His playing drove the songs that took us around the world, and with a dry wit that was matched only by his wonderfully unsentimental, no-nonsense outlook on life he kept us grounded and gave the band its edge through the extraordinary years that followed.\"\nA career atop the charts\nDuran Duran accumulated a slew of accolades including two Grammys, six platinum records, two Ivor Novello Awards and the MTV Video Visionary Award.\nTaylor parted with the band in 1986 to pursue other projects.\nThe band was due to reunite when they were inducted into Rock & Roll Hall of Fame in 2022.\nHowever, Taylor was unable to be present. He revealed that he had been battling stage 4 metastatic prostate cancer for several years.\n\"I would like to thank each of my brothers in this great band,\" he wrote at the time. \"You can dream about what happened to us but to experience it, on one's own terms, as mates, was beyond incredible.\"", "translation_ja": "", "vocab": []}, {"title_ja": "エジプト：ガザの高速道路で燃料トラックが転覆、少なくとも31人が死亡", "title_en": "Egypt: At least 31 dead after fuel truck overturns on highway", "summary_ja": "エジプトのガザ地区のリング道路で燃料タンク車が転覆し、大規模な火災が発生しました。当局によると31人が死亡し、21人が負傷しており、死傷者数はさらに増加する可能性があります。イタリアとアルジェリアを含む各国がこの惨事で犠牲者に哀悼の意を表明しました。", "summary_en": "The accident occurred on the packed Ring Road in Giza near Cairo. Dozens of ambulances responded to the crash, and Egyptian health authorities say the death toll could rise.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/egypt-at-least-31-dead-after-fuel-truck-overturns-on-highway/a-80055175?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Egypt: Over 30 dead after fuel truck overturns near Cairo\nNovember 25, 2026\nA fuel truck overturned on a packed highway in Giza, Egypt, on Wednesday, killing 31 people and injuring 21 more, according to Egyptian authorities.\nWhat do we know so far?\nThe fuel tanker crash ignited a massive blaze on Ring Road in Giza's Waraq district. The Ring Road encircles the greater Cairo metropolitan area.\nEgyptian Health Minister Khaled Abdel Ghaffar said the injured were transported to nearby hospitals and added that the death toll could rise further. He said 39 ambulances are responding to the accident.\nA massive fire broke out after the accident, with rescue workers pulling people from their vehicles. A large crowd gathered in the densely populated Waraq neighborhood amid the rescue efforts.\nThe blaze left at least 27 vehicles, including cars and motorcycles, charred.\nAn investigation has been launched into the crash, according to Egypt's public prosecutor. DNA tests are being carried out to identify badly burned victims of the blaze.\nEgyptian President Abdel-Fattah el-Sissi expressed his deepest condolences and sympathy to the victims and directed relevant authorities to provide necessary support to the families of the victims and the injured.\nItaly, Algeria extend condolences to victims\nOther countries also reacted to the crash in Giza.\nItalian Foreign Affairs Minister Antonio Tajani said he extended his \"deepest solidarity to the victims' families,\" Egyptian Foreign Minister Badr Abdelatty \"and to the Egyptian people, whom I count as friends, at this tragic time.\"\nAlgerian Ambassador to Egypt Mohamed Sofiane Berrah also said the Embassy of Algeria in Cairo extended \"its deepest condolences and heartfelt sympathy to the sisterly Arab Republic of Egypt.\"\nCar accidents are frequent in Egypt due to poor road conditions, reckless driving and lax enforcement of safety rules.", "translation_ja": "", "vocab": []}, {"title_ja": "メイシーズ感謝祭パレード、悪天候により延期", "title_en": "Macy's Thanksgiving Day parade postponed due to weather", "summary_ja": "ニューヨーク市の当局者、NYPD、メイシーズが協力して、恒例の感謝祭パレードの延期を決定しました。ABC Newsの情報筋によると、悪天候がパレード開催の判断に影響しました。", "summary_en": "New York City officials, the NYPD and Macy's have decided to postpone the annual Thanksgiving Day parade, sources familiar with the decision told ABC News.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/macys-thanksgiving-day-parade-postponed-sources/story?id=138452401", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ：ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースライブは、24時間体制で速報ニュースと生中継イベントをカバーしています。常に最新のニュース報道と重要な出来事をリアルタイムで提供しています。視聴者は世界中で起きている重要なニュースに即座にアクセスできます。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アイオワ州弾薬工場での爆発後、連邦当局が「ゼロ」の気中鉛を検出", "title_en": "Federal officials say 'zero' airborne lead detected after Iowa munitions blast", "summary_ja": "陸軍がアイオワ州の弾薬製造工場で数トンのアジ化鉛を爆破させました。連邦当局による調査の結果、爆発後の環境中には気中鉛が検出されなかったと発表されました。", "summary_en": "The Army detonated several tons of lead azide at an ammunition plant in Iowa.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/iowa-detonation-lead-azide-army/story?id=138425051", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カイロ高速道路での燃料タンカー衝突火災、少なくとも31人が死亡", "title_en": "At least 31 killed as fuel tanker crash ignites large fire on Cairo highway", "summary_ja": "エジプトの首都カイロを囲む環状道路で燃料タンカーが横転し、大規模な火災が発生しました。この事故により少なくとも31人が死亡し、21人以上が負傷、数十台の自動車とバイクが焼失しました。エジプトは交通安全記録が悪く、毎年数千人が交通事故で命を落としており、当局は死傷者数がさらに増加する可能性があることに懸念を示しています。", "summary_en": "Blaze on ring road surrounding Egyptian capital injures at least 21 people and leaves cars and motorcycles charred A crash involving a fuel tanker ignited a huge fire on a highway surrounding Cairo on Wednesday, killing at least 31 people, Egyptian authorities said. The blaze on the ring road, a key", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/25/people-killed-fuel-tanker-crash-ignites-large-fire-cairo-highway", "state_media": false, "category": "社会", "full_text": "A crash involving a fuel tanker ignited a huge fire on a highway surrounding Cairo on Wednesday, killing at least 31 people, Egyptian authorities said.\nThe blaze on the ring road, a key artery that encircles the Egyptian capital, also injured at least 21 people and left more than two dozen cars and motorcycles charred, according to the latest figures released by the health ministry.\nState media reported that the fire broke out when the fuel truck overturned. The stretch of the highway where it occurred was in Waraq, a densely populated neighbourhood in Giza, part of the Greater Cairo area, the health ministry said.\nAt the scene, rescue workers were pulling people out of burning cars. An Associated Press video showed firefighters working to put out the fire spreading among the cars. Hundreds of people gathered near the scene.\nAhmed Sameer, who was stuck in traffic as the road was blocked after the accident, saw the fuel truck and many cars on fire. He said he saw at least eight bodies being removed from burned cars.\n“It was a huge fire, the cars got stuck together because of the fire,” he said, describing the fear and panic that followed. “It was a shocking scene.”\nThe Egyptian president, Abdel Fatah al-Sisi, expressed his condolences to the victims in a statement. The public prosecutor’s office said DNA investigations were under way to identify the victims.\nThe health minister, Khaled Abdel Ghaffar, said the injured were taken to nearby hospitals and that he would head to the scene. He said the death toll was preliminary, raising concerns it could rise further.\nDeadly traffic incidents claim thousands of lives every year in Egypt, which has a poor transportation safety record. Speeding, bad roads and poor enforcement of traffic laws are the main reasons behind most of the crashes.\nIn January, 21 people were killed and 16 were injured in a multicar pileup on a road near the southern province of Beni Suef.", "translation_ja": "", "vocab": []}, {"title_ja": "カメルーンでスイス人観光客がゾウの群れに襲われ死亡、英国人とアメリカ人が負傷", "title_en": "Swiss tourist killed and British and Americans injured by elephants in Cameroon", "summary_ja": "カメルーンのマウントカメルーン国立公園近くでハイキング中のスイス人観光客1名がゾウの群れに襲われ死亡し、英国人とアメリカ人の観光客が負傷した。事件は11月19日に約15頭のゾウの群れと遭遇した6人のハイカーグループに起きた。被害者はロンドンを拠点とする保険会社の幹部アラン・スルー氏で、現地の軍とパーク職員によって搬出された。", "summary_en": "Alain Throo, insurance executive based in London, reportedly gored and later died on hike near Mount Cameroon national park A Swiss tourist has been killed and British and American tourists have been injured when a group of hikers encountered a herd of elephants in Cameroon. The group of six tourist", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/nov/25/swiss-tourist-killed-british-americans-injured-elephants-cameroon", "state_media": false, "category": "社会", "full_text": "A Swiss tourist has been killed and British and American tourists have been injured when a group of hikers encountered a herd of elephants in Cameroon.\nThe group of six tourists, four British, one Swiss and one American, accompanied by local guides, were hiking near the village of Bakingili in the south of the Mount Cameroon national park on 19 November, on a path used by elephants to access a nearby lake, when they encountered the herd of about 15 animals, according to media reports.\nThe elephants attacked the group and Alain Throo, a Swiss insurance executive based in London, was reportedly gored and one of the guides tossed into a ditch on top of Throo, while the others hid in trees.\nThroo had a black eye and was initially responsive and complaining about an injury to his arm, one of the British female hikers told Cameroonian media, which said they had feared he was bleeding internally.\n“He said that the elephant attacked him,” an unidentified Cameroonian man added, according to a video posted by CBS Radio Buea FM. “It smashed him.”\nThroo later died of his injuries and his body was carried out of the park by a combined team of park staff and the military to a mortuary in the town of Limbeon 21 November. The American hiker was treated at the same hospital and later discharged, according to local media.\nOne of the British tourists, who said he had hid in a tree stump for two hours, recalled the moment the elephants attacked their group. “I saw these elephants almost next to me. And I thought, if I go down this path as well, I’m going to get hit. So I just moved to the opposite direction. They ran down the path, I ran and hid in a bush. And I heard some screaming.”\nSean McGovern, the UK chief executive of the insurer Axa XL, where Throo had worked for 13 years, confirmed the death, saying Throo was a “valued member of our team, respected colleague and friend whose contribution, professionalism and warmth touched many people”.\nCameroonian media reported that clashes between elephants and local people had been happening for the past 10 years.\nMount Cameroon is the highest mountain in west and central Africa, at more than 4,000 metres. The African forest elephant was declared critically endangered by the International Union for Conservation of Nature in 2021. There are about 195,000 left in the wild, less than 15% of its population 50 years ago, according to the World Wildlife Fund.\nJust 5% of forest elephants, which are smaller than their savannah-based counterparts, are found outside central Africa. In Cameroon, there are about 6,000 forest elephants, according to the NGO Global Conservation, which said the species was at risk from poaching syndicates.\nA spokesperson for Britain’s Foreign Office said: “We offered assistance after a number of British nationals were injured in Cameroon.”", "translation_ja": "", "vocab": []}, {"title_ja": "英国がスワジランドに送った斯里蘭卡亜難民が自殺", "title_en": "Sri Lankan asylum seeker killed himself after being sent by UK to Eswatini", "summary_ja": "英国は性的暴行の有罪判決を受けたスリランカ難民をアフリカ南部のエスワティニに送還し、同難民がそこで自殺した。難民は英領インド洋領土ディエゴガルシアに滞在中、英国への入国を性犯罪記録を理由に拒否された。エスワティニは仮の受け入れ措置だと主張しており、英国との正式な長期合意には至っていないと述べている。", "summary_en": "Kishanth Peramalya was denied entry due to sexual assault convictions and sent to Africa where he had no connections The UK sent a Sri Lankan asylum seeker who had been convicted of sexual assault to Eswatini, a southern African country to which he had no connection and where he killed himself. Kish", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/uk-news/2026/nov/25/sri-lanka-asylum-seeker-convicted-sexual-assault-uk-kills-himself-eswatini", "state_media": false, "category": "政治", "full_text": "The UK sent a Sri Lankan asylum seeker who had been convicted of sexual assault to Eswatini, a southern African country to which he had no connection and where he killed himself.\nKishanth Peramalya was part of a group that set sail from India hoping to reach Canada and claim asylum there. The boat was rescued by the Royal Navy in October 2021 when it got into difficulty and brought to Diego Garcia in the remote British Indian Ocean Territory, which hosts a US-UK military base.\nIn November 2024, the UK allowed 61 migrants to enter from Diego Garcia after a damning UN report about conditions in the camp. However, the then home secretary, Yvette Cooper, denied Peramalya entry to the UK due to his criminal convictions while he was on Diego Garcia for four counts of sexual assault, one count of assault occasioning actual bodily harm and one count of arson. Cooper’s decision was upheld by UK courts.\nPeramalya had been granted protection from being returned to Sri Lanka, having been tortured and sexually abused by Sri Lankan military personnel as a teenager. In late March, the Maldives said it would take him for 30 days, according to the BBC. He was then transferred to Eswatini, a country landlocked by South Africa and Mozambique and formerly known as Swaziland, where he killed himself on 13 September.\nA draft deal between the UK and Eswatini governments would have committed Downing Street to cover the costs of Peramalya’s resettlement there for three years, according to the BBC, which said the UK was also finalising arrangements for Peramalya to live in Eswatini permanently.\nThe Guardian has not seen the draft deal. Thabile Mdluli, a spokesperson for Eswatini’s government, said: “The initial arrangement was temporary in nature and intended to safeguard Mr Peramalya’s safety while the government of the United Kingdom worked towards a long-term solution regarding his circumstances.”\nShe said that no formal agreement was ever reached over Peramalya’s long-term residency status with the UK and declined to comment further on the specific arrangements of his stay in Eswatini or the circumstances around his death.\nMdluli said: “Eswatini has not received any other similar request from the government of the United Kingdom. The government of the Kingdom of Eswatini remains committed to ensuring that any agreements entered into with external partners safeguard national interest as well as the safety and security of Emaswati [Swazi people].”\nA UK government spokesperson said: “Keeping the British public safe will always be our first priority, and we will continue to take the decisions necessary to protect the British people. That includes taking steps to ensure high harm foreign criminals cannot enter the UK. We continue to work with the Eswatini authorities in relation to this case.”\nPeramalya had post-traumatic stress disorder and attempted suicide multiple times on Diego Garcia, according to a UK high court judgment in February 2025.\nPeramalya’s family told the BBC he was initially housed alone in an isolated guesthouse in Eswatini. “My brother did not want to go there at all,” said his sister, speaking from India. “He couldn’t manage being there alone, he was very lonely.”\nShe said he had called her four times a day and was initially having weekly psychiatric appointments, which were made daily when his mental health deteriorated, as well as having someone brought in to prepare his food.\nPeramalya’s relatives said they were not aware of his convictions for sexual offences or any plan to make his transfer to Eswatini permanent.\nEswatini has accepted dozens of third-country deportees from the US since July 2025. In November 2025, its government confirmed it had received $5.1m in exchange for taking up to 160 migrants from the US.", "translation_ja": "", "vocab": []}, {"title_ja": "金正恩氏、北朝鮮は戦術核兵器の配備を拡大すべきと表明", "title_en": "Kim Jong Un says North Korea should widen deployment of tactical nukes", "summary_ja": "北朝鮮の金正恩指導者は、複数の領域にわたる戦術核兵器の配備拡大を促すよう指示しました。同氏は北朝鮮の核兵器国としての地位は「絶対に侵すことができない」と述べ、核保有国の地位を否定する試みは「宣戦布告」とみなされると警告しました。これは韓国との非武装地帯での地雷爆発事件を巡る緊張が高まる中での発言です。", "summary_en": "North Korean leader warns attempts to deny country&#039;s nuclear status will be seen as \"an open declaration of war\".", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/26/kim-jong-un-says-north-korea-should-widen-deployment-of-tactical-nukes?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Kim Jong Un says North Korea should widen deployment of tactical nukes\nKim warns attempts to deny North Korea’s nuclear status will be seen as “an open declaration of war”.\nNorth Korean leader Kim Jong Un has urged his country to focus on deploying tactical nuclear weapons “across multiple domains for different missions”.\nKim said North Korea’s nuclear material production capacity was being systematically expanded on Thursday, according to state media KCNA.\nMaintaining North Korea’s status as a nuclear-weapons state was “absolutely inviolable”, Kim said during an inspection of nuclear material production and weapons research facilities. KCNA did not identify the facilities or their locations.\nThe country’s status would not change because of what he called “denuclearisation rhetoric from forces that ignore objective reality and failed to recognise the changed situation”.\n“Our nuclear capability is now a reality,” he said, calling recent achievements in nuclear weapons production a major success in carrying out the country’s nuclear policy.\nAny attempt to deny North Korea’s nuclear status, which it enshrined in its constitution in 2023, would be regarded as “an open declaration of war”, he said.\nKim said diversified use of tactical nuclear weapons was an “important and urgent task raised from tactical nukes’ military value in modern warfare and from the inevitable reality facing the border with the most dangerous enemy state”.\nDMZ tensions\nKim’s statements come during a growing border dispute with South Korea over a landmine explosion that injured three South Korean soldiers in the Demilitarized Zone (DMZ), a heavily fortified territory between the two countries, on September 21.\nSeoul demanded an apology from Pyongyang in October after a joint South Korea-United Nations investigation found that North Korea had planted the landmines more than a year ago.\nPyongyang sent a letter to the UN Security Council in response, accusing Seoul of fabricating the explosion, and fired about 10 short-range ballistic missiles off its east coast into the Sea of Japan less than a week later.\nSouth Korea estimates that North Korea possesses between 80 and 120 nuclear warheads.", "translation_ja": "", "vocab": []}, {"title_ja": "嵐とエルニーニョによる大潮がカリフォルニア州沿岸を襲う", "title_en": "Photos: Storms and an El Nino-charged king tide batter California’s coast", "summary_ja": "カリフォルニア州を含む米国西海岸が記録的な高潮に見舞われており、洪水や破壊、危険な波が発生しています。大潮とエルニーニョ現象、そして気候変動が組み合わさることで、過去最高の水位が記録されています。サンフランシスコ市長は12月と1月にさらに大潮が来ることを警告し、今後の嵐に備えることの重要性を強調しています。", "summary_en": "Meteorologists have warned that the king tide could pair with high surf to bring historic surges to parts of the state.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/gallery/2026/11/26/photos-storms-and-an-el-nino-charged-king-tide-batter-californias-coast?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "In Pictures\nPhotos: Storms and an El Nino-charged king tide batter California’s coast\nMeteorologists have warned that the king tide could pair with high surf to bring historic surges to parts of the state.\nCalifornia and other parts of the United States West Coast have experienced record-high water levels, causing flooding, destruction and dangerous waves.\nOn Wednesday, the National Oceanic and Atmospheric Administration (NOAA) announced that the fishing community of Charleston, Oregon, notched its highest-ever coastal water level, roughly 1.12 metres above the mean high water level.\nIt was as high as 3.4 metres above the mean low water mark.\nOther NOAA stations recorded some of their highest water levels on record, including San Diego, Los Angeles and Santa Barbara, all on the southern California coast.\nFurther north, the L-shaped municipal pier in Pacifica, a city south of San Francisco, crumbled into the surf after a wave as tall as its platform crashed into it.\nIn a video on social media, bystanders could be heard voicing astonishment at the sight. “Oh my god, it’s gone. Oh my god,” one person said.\nThe pier had faced multiple closures in recent years, as seawater weakened its concrete structure, but experts say this week’s conditions were more dangerous than normal.\nThe high coastal water levels were spurred by a combination of factors, including a phenomenon popularly known as king tides.\nThe term is applied to the highest tides of the year, created when both the sun and the moon are aligned to create a larger-than-normal tidal bulge, pulling the water with their combined gravitational force.\nThe king tides have been exacerbated by the El Nino weather pattern as well as human-fuelled climate change.\nWhile El Nino is a regular occurrence, this year’s edition is projected to be stronger than normal, according to forecasters, leading to record-warm waters off the Pacific coast. That warming, in turn, helps churn up powerful storms that contribute to waves battering the shoreline.\nSan Francisco Mayor Daniel Lurie announced on Wednesday that his city had made it through the worst of this week’s surge with flooding and waves up to 9 metres, but he warned of more king tides to come.\n“The last two weeks have been an important reminder to get prepared for the rest of El Nino season. We’re expecting more king tides in December and January,” he wrote on social media. “We need to take these events seriously, prepare ahead of future storms, and stay alert.”", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナがロシア軍基地を攻撃、5機の航空機を撃破", "title_en": "Ukraine attacks Russian military base, says five planes struck", "summary_ja": "ウクライナ軍がモスクワ東方のニジニノヴゴロド州にあるサヴァスレイカ空軍基地を攻撃し、ミグ31戦闘機3機とスホーイ34戦闘爆撃機2機の合計5機の航空機に損害を与えたと、ウクライナ総司令部が発表しました。この攻撃はロシアの戦争遂行能力を弱体化させることを目的とした一連の長距離攻撃の最新の事例です。ウクライナは近日中に複数の重要な軍事施設を攻撃しており、ロシアのエネルギーシステムへの攻撃と前線都市への空襲に対抗しています。", "summary_en": "The Ukrainian General Staff says its forces struck an airbase in the Nizhny Novgorod region east of Moscow.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/26/ukraine-attacks-russian-military-base-says-five-planes-struck?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Ukraine attacks Russian military base, says five planes struck\nThe Ukrainian General Staff says its forces struck an airbase in the Nizhny Novgorod region east of Moscow.\nUkrainian forces have hit a major Russian military base east of Moscow, damaging five aircraft used to launch missiles and bombs, according to the Ukrainian General Staff.\nUkraine struck the Savasleyka airbase in the Nizhny Novgorod region, the General Staff said on Wednesday, adding that three MiG-31 jets were used to fire hypersonic missiles and two Su-34 fighter-bombers were damaged.\nRussia did not immediately comment on the report by the General Staff, which said the Savasleyka airbase had been hit in the latest long-range attacks aimed at crippling Moscow’s war effort.\nThe operation followed a series of high-profile strikes by Ukrainian forces in recent days in which two Russian ships were hit in Libyan waters and a Russian vessel was struck in the Gulf of Finland.\nLast week, Ukraine destroyed the road portion of Russia’s prized bridge to the Crimea peninsula after consecutive attacks.\nRussia launched its full-scale invasion of Ukraine in February 2022, and fighting has continued despite a renewed US-backed push to end what has become Europe’s worst conflict since World War II.\nKyiv is trying to dent Moscow’s military might as it struggles under a renewed campaign of attacks on its energy system and mounting Russian strikes on front-line cities.\nUkrainian forces are hunting Russian ballistic-missile launchers used to carry out many of those attacks, striking 16 over the past several months, Defence Minister Yevhenii Khmara said this week.\nRenewed Ukrainian drone attacks have cut Russian oil refineries’ processing volumes by 45 percent since late October, industry sources said this month. Kyiv has said it will stop striking Russian energy targets only when Moscow does the same.", "translation_ja": "", "vocab": []}, {"title_ja": "米国、インドに新たに25%の関税を発表　14カ国中2番目に高い水準", "title_en": "U.S. announces new 25% tariffs on India, second-highest in the 14 countries against which action has been taken", "summary_ja": "米国通商代表部（USTR）は11月25日、インドからの輸入品に対して25%の関税を発表した。これは報復措置の対象となった14カ国の中でベトナムの35%に次いで2番目に高い水準である。ただし、米国とインドが互恵的貿易協定に合意した場合、この関税は17%まで引き下げられる可能性がある。", "summary_en": "The order by the U.S. Trade Representative also opens the door for a lower 17% tariff if India and the U.S. sign a trade deal", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/donald-trump-tariffs-us-midterm-elections/article71743081.ece", "state_media": false, "category": "経済", "full_text": "The U.S. government on Wednesday (November 25, 2026) announced a tariff of 25% on goods imported from India in response to India’s “unreasonable acts, policies, and practices” that “burden or restrict U.S. commerce”. This is the second-highest tariff among the 14 economies against which the latest action has been taken, second only to the 35% tariff levied on Vietnam.\nHowever, the order by the office of the U.S. Trade Representative (USTR) also said that, should the U.S. and India reach an Agreement on Reciprocal Trade, the tariff imposed on India could drop to 17%.\nFurther, while it says that the 25% tariffs would be net of existing tariffs levied on India, meaning they will not add to the 10% already in effect, the order also said that it remained for the USTR to decide whether these new tariffs would be adjusted keeping in mind those other tariffs.\nThe Indian government said it has taken note of the actions by the USTR and that its notice is currently under examination.\n“India engaged constructively throughout this investigation,” the statement by the Ministry of Commerce and Industry said. “In response to the Notice of Initiation and in subsequent proceedings, the Department of Commerce stated that India does not have structural excess capacity in any sector.”\n“India and the United States are engaged in negotiations for a Bilateral Trade Agreement,” it added. “It has been India’s position that any trade-related concerns should be addressed within the framework of these negotiations. Government of India remains committed to working closely with the United States towards the early conclusion of the India-U.S. Bilateral Trade Agreement, as announced on 2nd February 2026 and in accordance with the Joint Statement issued on 7th February 2026.”\nTariff pressure\nThe USTR had in March launched two separate investigations into American trade partners, including India, under Section 301 of the U.S. Trade Act. The first investigation related to forced labour resulted in a tariff of 10% levied on India. The new tariffs announced on Wednesday are a result of the second investigation into structural excess capacity.\nApart from this, the U.S. also levies a tariff of 50% on imports of aluminium and steel from all countries under Section 232 of its Trade Expansion Act. The new tariffs will not be added to these. Under the Lindsey O. Graham Sanctioning Russia and Iran Act of 2026, the U.S. government is also empowered to levy a tariff of up to 100% on countries, including India, that import large quantities of Russian oil. This tariff has been temporarily paused by U.S. President Donald Trump.\nIn its report on India, the USTR concluded that India’s acts, policies, and practices “create, sustain, or contribute to structural excess capacity” that burden or restrict U.S. commerce by harming U.S. producers and exporters through unfair competition and reduced commercial opportunities; harm the U.S. economy due to lost exports, trade deficits, and a diminished manufacturing sector; and create economic security risks for the U.S.\n“The Trade Representative proposes that appropriate action to obtain the elimination of the acts, policies, and practices would include applying tariffs of up to 25% on all goods of India, net of existing Section 301 tariffs, with exemptions for certain goods,” the order by the USTR said.\nWay out\nHowever, the order also says that the USTR further proposes to consider whether the additional duties applied should be adjusted to account for duties applied under other existing Section 301 actions, duties applied under Section 232, “or were India to reach an Agreement on Reciprocal Trade with the United States that is responsive to the determinations in this investigation into the acts, policies, and practices of India, a tariff rate of 17%”.\nThe 25% tariffs are higher than those levied on Japan, South Korea, Switzerland, Taiwan, the European Union (15% each), Indonesia, Malaysia, Thailand (18% each), Bangladesh, Cambodia, China, and Singapore (up to 20% each).\nOnly Vietnam faces a tariff of 35%, higher than that for India, but even that stands to be reduced to 20% if it signs a trade deal with the U.S.\nIndia and the U.S. issued a joint statement in February 2026 announcing a framework for an interim deal on trade under which the U.S. would levy a tariff of 18% on imports from India. That deal is yet to be finalised, however.\nShould it be finalised and tariffs settle at 17%, this would give India a comparative advantage over its competitors.\nPublished - November 25, 2026 07:54 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "インド外務省、シェイク・ハシナ前首相のバングラデシュ帰国とインドからの身柄引き渡しは別問題と明言", "title_en": "MEA separates Sheikh Hasina’s plans to return to Bangladesh from issue of extradition", "summary_ja": "インドの外務省は、バングラデシュの前首相シェイク・ハシナが旅行文書を使用して帰国することと、インドからバングラデシュへの身柄引き渡しは別の問題であると述べた。ハシナ前首相の自発的な帰国は本人とバングラデシュ政府の問題だが、身柄引き渡しの要請は確立されたプロセスに従って検討されているという。同時にインドはバングラデシュでの少数民族への暴力事件に懸念を表明した。", "summary_en": "‘The case of a citizen willing to return voluntarily to her country on a travel document is a matter separate from the extradition request,’ MEA’s official spokesperson Randhir Jaiswal said", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/national/mea-separates-sheikh-hasinas-plans-to-return-to-bangladesh-from-issue-of-extradition/article71743712.ece", "state_media": false, "category": "社会", "full_text": "NEW DELHI\nThe return of the deposed former Prime Minister of Bangladesh Sheikh Hasina, using a “travel document” to her country and the process of her extradition from India to Bangladesh were two separate issues, India’s Ministry of External Affairs said on Wednesday (November 25, 2026). Speaking at the bi-weekly press briefing, the MEA’s official spokesperson Randhir Jaiswal made the distinction, while expressing concern over the prevailing law and order situation in Bangladesh.\nBangladesh’s request for Ms. Hasina’s extradition, made during the tenure of the interim government under Prof. Mohammed Yunus, is “being examined in line with our established processes”, Mr. Jaiswal said. Dhaka, in recent weeks, has talked about getting Ms. Hasina through an “acceptable prisoner exchange process”. Ms. Hasina had earlier this month requested the High Commission of Bangladesh, through a U.K.-based law firm, to issue her a fresh Bangladesh passport so that she could return home. Mr. Jaiswal said her plans to return to her country were separate from India extraditing her to Bangladesh.\n“The case of a citizen willing to return voluntarily to her country on a travel document is a matter separate from the extradition request,” Mr. Jaiswal said, adding that the issue of her return was a matter “between the former Prime Minister and the Bangladesh government”.\nMs. Hasina’s supporters from the Awami League have been agitating in her party’s strongholds in places, including Gopalganj and Narail, where the party’s workers have been targeted by law enforcement authorities. “We understandably are concerned at the incidents of violence against minorities in Bangladesh. We urge the government of Bangladesh to thoroughly investigate these incidents and bring the perpetrators to justice,” Mr. Jaiswal said.\nPublished - November 25, 2026 10:22 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "ジェンセン・ファン氏がNvidiaの第二の時代に向けて新たな戦略が必要—スキャンダルからの復帰", "title_en": "Jensen Huang needs a new playbook for his second innings at Nvidia", "summary_ja": "Nvidia共同創業者のジェンセン・ファン氏は、セックス・スパイスキャンダルにより退任した後、トランプ政権への働きかけにより再びCEOとして復帰しました。11月23日にNvidiaのカリフォルニア本社に戻った同氏は、従業員に謝罪し、より良いCEOになることを誓い、彼の復帰によってNvidiaの株価は上昇し、市場価値は約1兆ドル増加しました。", "summary_en": "Returning to Nvidia’s Santa Clara headquarters in California on Monday (November 23, 2026), and standing on the ground floor of the atrium, Jensen Huang apologised to employees and vowed to be a better CEO", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/technology/jensen-huang-needs-a-new-playbook-for-his-second-innings-at-nvidia/article71745086.ece", "state_media": false, "category": "社会", "full_text": "Within two weeks, Jensen Huang, Nvidia’s co-founder, went from being an AI rainmaker, whose chips and business ingenuity kick-started the AI revolution, to a sex-and-spy scandal-hit CEO, who quit the company he built from scratch and helmed for over three decades, and then returned as its boss once again after a band of tech billionaires intensely lobbied the Trump administration for his reinstatement.\nReturning to Nvidia’s Santa Clara headquarters in California on Monday (November 23, 2026), and standing on the ground floor of the atrium, Mr. Huang apologised to employees and vowed to be a better CEO as staff cheered to see their chief back, whose exit wiped out close to a quarter of the company’s market value. Mr. Huang’s return buoyed the market as Nvidia’s stock soared, adding nearly a trillion dollars in market value the day he was back at Nvidia.\nPublished - November 26, 2026 08:17 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "トロント住宅侵入殺人事件、より厳しい法律を求める声が上がる", "title_en": "Toronto home invasion killing sparks calls for tougher laws - Toronto Star", "summary_ja": "トロントで発生した住宅侵入による殺人事件を受けて、市民や政治家からより厳しい法律の制定を求める声が高まっている。この事件は地域
