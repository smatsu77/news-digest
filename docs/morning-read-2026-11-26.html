 "title_en": "Security operatives assault lawmaker’s aide attempting to access 2026 budget review meeting venue", "summary_ja": "ナイジェリアの上院歳出委員会が2026年度予算の削減を審議する中、ティヌブ大統領の要請に応じた会議に出席しようとした議員の補佐官が、警備要員により負傷させられた。会議は非公開で行われており、予算総額は68.3兆ナイラから65.1兆ナイラに削減された。この事件は、会議室への出入りを制限していた警備要員と補佐官の間で口論が生じたことで発生した。", "summary_en": "The senator's aide alleged that security personnel held him, pushed him down a staircase, grabbed him again and struck him on the head with the butt of a gun. The post Security operatives assault lawmaker’s aide attempting to access 2026 budget review meeting venue appeared first on Premium Times Ni", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/928077-security-operatives-assault-lawmakers-aide-attempting-to-access-2026-budget-review-meeting-venue.html", "state_media": false, "category": "政治", "full_text": "Security operatives on Wednesday injured an aide to a senator while attempting to prevent him and another aide from gaining access to a closed-door meeting of the Senate Committee on Appropriations at the National Assembly in Abuja.\nMembers of the committee began deliberations on reducing the size of the 2026 budget and revising some of its components, as requested by President Bola Tinubu.\nThe lawmakers commenced consideration of the president’s request barely 24 hours after it was submitted. The meeting, however, was held behind closed doors.\nFor the budget, the total expenditure was reduced from N68.3 trillion, as earlier approved, to N65.1 trillion. Government revenue, including receipts from government-owned enterprises, is projected at N33.7 trillion, while aggregate capital expenditure stands at N26.2 trillion.\nThe revised budget also retains the government’s borrowing plan at N29.2 trillion, comprising N18.4 trillion in domestic borrowing and about N10.8 trillion in foreign borrowing.\nThe Senate Appropriations Committee was mandated to scrutinise the budget revision as proposed by the president and expected to report back to the Senate whether to approve or recommend otherwise.\nWhile the committee members were deliberating, security personnel attached to the committee chairman, Adeola Olamilekan (APC, Ogun West) were stationed at the entrance to prevent journalists and other non-lawmakers from accessing the meeting room.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHowever, pandemonium broke out at the entrance a few hours after the meeting began when two aides to Allwell Onyesoh, the senator representing Rivers East Senatorial District, attempted to enter the room but were stopped by the security personnel.\nMultiple sources who witnessed the incident told PREMIUM TIMES that the aides, a personal assistant and a legislative aide, identified themselves and insisted on entering the room because their principal was already inside the meeting.\nThe senator’s personal assistant was identified as Dr Kingsley, while the other aide identified himself as Kingsley Wali.\nEyewitness accounts indicated that an argument ensued between the aides and the security personnel, with the aides allegedly attempting to force their way into the meeting room.\nIn the ensuing confrontation, the security personnel allegedly assaulted Mr Wali, leaving him injured, and pushed Mr Kingsley against a wall.\nShortly after the incident, journalists rushed to the scene to ascertain what had happened.\nSpeaking with journalists, Mr Wali, whose clothes were soaked in blood, said he and his colleague had attempted to enter the meeting room after their principal had gained access but were stopped by the security personnel.\nHe said that while they were arguing with the operatives, the personnel pushed his colleague, Mr Kingsley, against a wall.\nHe added that he attempted to explain to the operatives that they were aides to a senator and not outsiders seeking unauthorised access.\nMr Wali alleged that while he was explaining, the security personnel grabbed Mr Kingsley by the neck and began beating him.\nHe further alleged that the operatives held him and pushed him down a staircase, causing him to fall and sustain injuries. He also claimed that when he attempted to get up, the personnel grabbed him again and struck him on the head with the butt of a gun.\nAfter the security personnel left, Mr Kingsley reportedly took photographs of his injured colleague lying in a pool of blood and sent them to their principal via WhatsApp. The photographs prompted Mr Onyesoh to leave the meeting briefly to check on his aides.\nOn seeing Mr Wali covered in blood, the senator reportedly took him into the committee room to show other lawmakers the extent of his injuries.\nThe committee members subsequently directed the committee clerk to ensure that Mr Wali received urgent medical attention. He was taken to the National Assembly Clinic for treatment.\nNASS to investigate\nReacting to the incident, Kayode Odunaro, media adviser to the committee chairman, confirmed that a confrontation occurred but said it happened without the chairman’s knowledge.\n“There was a misunderstanding between aides of some senators trying to forcefully gain entrance to Senate Committee Room in a closed session with state security aides at the entrance of the Committee Room.\nREAD ALSO: Senate approves loan requests Tinubu withdrew\n“The incident happened without the knowledge of the Senate Committee Chairman, Senator Solomon Adeola, already presiding inside the Committee Room and other members of his committee, including Senator Allwell Onyesoh, whose aide was injured,” he said.\nMr Odunaro said the National Assembly management had commenced an investigation to establish the circumstances surrounding the incident.\n“It was only when Senator Onyesoh came out briefly that he saw his ", "translation_ja": "", "vocab": []}, {"title_ja": "INEC、2027年選挙に向けた選挙偽情報対策のAIユニットを設立", "title_en": "INEC sets up AI unit to combat election misinformation ahead of 2027 polls", "summary_ja": "ナイジェリア独立選挙委員会(INEC)は、2027年総選挙に向けてAI部門を情報通信技術部門内に設立し、偽情報とデジタル操作コンテンツに対抗する体制を整備しました。同委員会は、ディープフェイク、合成音声、偽造動画などの新興デジタル操作手法の検出と対応能力を強化し、メディア機関やファクトチェッカー、市民社会団体との協力を深めています。警察庁長官も、偽造動画や不正な音声記録、組織的な偽情報キャンペーンが選挙の完全性を脅かし、暴力を引き起こす可能性があると警告しました。", "summary_en": "The commission says deepfakes, fabricated audio and coordinated online campaigns pose growing threats to electoral integrity as it steps up preparations for the 2027 elections. The post INEC sets up AI unit to combat election misinformation ahead of 2027 polls appeared first on Premium Times Nigeria", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/928071-inec-sets-up-ai-unit-to-combat-election-misinformation-ahead-of-2027-polls.html", "state_media": false, "category": "政治", "full_text": "The Independent National Electoral Commission (INEC) has established an Artificial Intelligence (AI) division within its Information and Communication Technology Department to tackle misinformation and digitally manipulated content ahead of the 2027 general elections.\nINEC Chairman, Joash Ojo Amupitan, disclosed this on Wednesday at the Nigeria Election Risks and Readiness Summit 2026 organised by the Centre for Journalism Innovation and Development (CJID) in Abuja.\nMr Amupitan, who was represented by his Chief Press Secretary, Adedayo Oketola, said the commission was strengthening its capacity to detect and respond to emerging forms of digital manipulation, including deepfakes, synthetic voices and fabricated videos.\nHe warned that such content could undermine public confidence in the electoral process, discourage voter participation and trigger panic or communal violence, particularly when circulated through coordinated online campaigns.\nHe noted that INEC is strengthening collaboration with media organisations, fact-checkers and civil society groups to ensure that accurate information reaches the public promptly.\nThe concerns raised by INEC come amid growing attention to the use of digital platforms and artificial intelligence to influence political narratives ahead of the 2027 elections.\nPREMIUM TIMES earlier reported that the Inspector-General of Police, Olatunji Disu, commended CJID and its fact-checking initiative, DUBAWA, for investigating and exposing emerging threats to electoral integrity, including foreign information manipulation, AI-generated disinformation and coordinated online campaigns.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMr Disu warned that fabricated videos, doctored audio recordings and coordinated false narratives could distort political participation, erode public trust and provoke violence. He added that an election could be attacked through false information even without the use of firearms.\nINEC steps up preparations for 2027 elections\nBeyond addressing misinformation, Mr Amupitan said the commission was taking steps to improve the efficiency of election-day operations, including procuring about 57,000 new Bimodal Voter Accreditation System (BVAS) devices and replacing batteries in existing machines.\nHe added that INEC was also providing climate-controlled storage facilities across states to ensure the proper preservation of election materials.\nAccording to him, the commission reduced the number of voters assigned to each BVAS device from 1,250 to 850, while allocating more devices to polling units with larger voter populations. The adjustment is expected to reduce accreditation time to between one and two minutes.\nThe commission said it would recruit about 1.41 million ad hoc personnel for the 2027 elections. Approximately 700,000 will be deployed for the presidential and National Assembly elections, while another 700,000 will serve during the governorship and State House of Assembly elections.\nThe commission also said it had extended the registration period for ad hoc staff from two weeks to two and a half weeks.\nThe presidential and National Assembly elections are scheduled for 16 January 2027, while the governorship and State House of Assembly elections will hold on 6 February 2027.\nMr Amupitan urged journalists and other stakeholders to complete their accreditation within the stipulated period, explaining that the deadlines were guided by the Electoral Act and could not be arbitrarily extended.\nHe said INEC is working with security agencies and political parties to identify potential election flashpoints and improve security deployment.\nThe commission, he added, is using its Election Risk Management tool to identify areas vulnerable to violence and other disruptions. The tool would also guide targeted security deployments during the 2026 Osun governorship election.\nStakeholders discuss election violence, security\nThe summit also featured a panel session titled “Preventing Electoral Violence and Strengthening Election Security Ahead of 2027”.\nThe session featured Gloria Korang, programme manager at the West Africa Network for Peacebuilding (WANEP); Bukola Idowu, executive director of Kimpact Development Initiative; Raphael Mgbaegbu, head of social research at NOI Polls; and Safiya Bichi, senior manager at YIAGA Africa, moderated by Tolulope Adeleru-Balogun of News Central Television.\nThe panel’s focus on electoral violence and security formed part of broader discussions at the summit on election preparedness and the protection of those involved in the electoral process.\nMr Amupitan condemned political violence and attacks on journalists, election officials and party supporters, warning that such incidents could undermine democratic participation and the credibility of elections.\nHe said INEC is engaging the police, political parties and other security ", "translation_ja": "", "vocab": []}, {"title_ja": "デルタ州議会、殺害された元議員を含む6人の死亡事件の正義を要求", "title_en": "Delta Killings: Assembly demands justice for slain ex-lawmaker, five others", "summary_ja": "ナイジェリアのデルタ州議会のスピーカーであるデニス・グウォル氏は、ウゲリ・ノース地域で発生した元議員モーゼス・アナウゲ氏を含む6人の殺害事件の徹底的な調査を要求しました。事件はナイジェリア民主会議が開催した選挙キャンペーン集会中に発生し、政治的暴力と無法状態を非難する声が上がっています。グウォル氏は2027年総選挙に向けて、政治は暴力ではなく理念と民主的関与に基づくべきであると強調しました。", "summary_en": "The speaker described the incident as “shocking” and condemned political violence, thuggery, intimidation and lawlessness ahead of the 2027 general elections The post Delta Killings: Assembly demands justice for slain ex-lawmaker, five others appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/928066-delta-killings-assembly-demands-justice-for-slain-ex-lawmaker-five-others.html", "state_media": false, "category": "政治", "full_text": "The Speaker of the Delta State House of Assembly, Dennis Guwor, called for a thorough investigation into the killing of a former lawmaker, Moses Anaughe, and five others in Ughelli North Local Government Area.\nMr Guwor made the call during the House’s plenary on Wednesday, condemning the violent incident that occurred at Uduere Community.\nThe incident, which occurred during a campaign rally organised by the Nigeria Democratic Congress on Monday, claimed six lives.\nThe speaker described the incident as “shocking” and condemned political violence, thuggery, intimidation and lawlessness ahead of the 2027 general elections.\nHe urged security agencies to investigate the attack thoroughly and ensure that those responsible are brought to justice.\n“As we approach the 2027 general elections, politics should be about ideas, service and democratic engagement, not violence and the destruction of human lives.\n“No political ambition is worth the life of any citizen,” Mr Guwor said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\ n Nanjing, east China's Jiangsu Province, on Monday.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-23/China-and-Switzerland-hold-foreign-ministers-strategic-dialogue-1SjcKHZ1ako/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "金正恩氏が核物質生産施設を視察—通信社報道", "title_en": "Kim Jong Un visits nuclear materials production plant — news agency", "summary_ja": "TASS/RTは、金正恩朝鮮民主主義人民共和国指導者が核物質生産施設を視察したと報道しています。同通信社は、この視察をピョンヤンの核戦力強化の背景における重要な展開として説明しています。", "summary_en": "The news agency described the inspection as an important development against the backdrop of Pyongyang’s strengthening of its nuclear forces", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2224989", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "NATO、米国の欧州駐留軍撤退決定の延期を期待—通信社", "title_en": "NATO expects US to postpone decision on withdrawing troops from Europe — news agency", "summary_ja": "TASS通信によると、米国とNATO間の関係が改善されており、米国は中東での戦争に対応するため欧州の基地が必要とされていると報じている。同通信社は、米国が欧州からの部隊撤退決定を先延ばしにすることをNATOが期待していると伝えている。", "summary_en": "According to the news agency, relations between the US and NATO have improved, and Washington also needs bases in Europe amid the war in the Middle East", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2224983", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国務省、キエフへの6億2190万ドル相当のF-16保守キット売却を承認", "title_en": "US State Department approves sale of $621.9 million worth of F-16 maintenance kits to Kiev", "summary_ja": "TASS/RTが報じたところによると、米国務省はウクライナへのF-16戦闘機用保守キット売却を承認しました。同省は、この取引が米軍の戦闘準備態勢に悪影響を与えないと想定しているとのことです。", "summary_en": "The State Department assumes that the deal will not have a negative impact on the combat readiness of the US Army", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2224981", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパ平和交渉でロシアと交渉できるのは誰か", "title_en": "Who Can Speak for Europe in Peace Talks with Russia?", "summary_ja": "EUがロシアとの平和交渉を代表する人物を見つけられないのは、人材不足ではなく構造的な失敗を示しており、著者はEUが英国、フランス、ドイツに特使の選出を委譲すべきだと主張している。ヨーロッパの指導者たちはロシアとの交渉が不可欠であることを認識しつつあり、さもなければヨーロッパは同意なしに交渉された平和の代償を払うか、資金が枯渇するかのいずれかに直面することになる。", "summary_en": "The European Union's inability to find one person to represent it in such negotiations reflects a structural failure, not a shortage of skilled personnel. That is why the EU should step aside and delegate the selection of an envoy to the United Kingdom, France, and Germany.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/eu-cannot-select-envoy-for-peace-talks-with-russia-by-yanis-varoufakis-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWho Can Speak for Europe in Peace Talks with Russia?\nThe European Union's inability to find one person to represent it in such negotiations reflects a structural failure, not a shortage of skilled personnel. That is why the EU should step aside and delegate the selection of an envoy to the United Kingdom, France, and Germany.\nATHENS—Europe’s leaders are coming to terms with a notion that they hitherto considered heretical. They must talk to Russia. Otherwise, Europe will either have to pay for a peace negotiated without its consent or it will run out of money.\n        https://prosyn.org/Je3x0Gr", "translation_ja": "", "vocab": []}, {"title_ja": "化石燃料の終焉にはCOP合意は不要である", "title_en": "The Fossil-Fuel Endgame Doesn’t Require a COP Consensus", "summary_ja": "本論文は、国連気候変動会議（COP）での合意形成の失敗にもかかわらず、化石燃料からの段階的廃止は避けられない目標であると主張している。太陽光発電や風力発電のコスト低下、電気自動車の普及など市場の力が既に急速なエネルギー転換を推し進めており、各国の合意を待たずとも「有志連合」による政策的アプローチで、より迅速で公正な移行が可能であることを強調している。ただし、2100年までの達成では地球温暖化が2.2～2.8℃に達する可能性があり、タイミングが重要であると指摘している。", "summary_en": "Despite the failure of this year's United Nations climate talks, there is no doubt that phasing out fossil fuels is the right goal. The only question is whether a coalition of the willing can use policy to push markets toward a faster, fairer, and smoother transition than the traditional COP process", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/fossil-fuel-phase-out-doesnt-require-success-at-cop-by-gernot-wagner-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Fossil-Fuel Endgame Doesn’t Require a COP Consensus\nDespite the failure of this year's United Nations climate talks, there is no doubt that phasing out fossil fuels is the right goal. The only question is whether a coalition of the willing can use policy to push markets toward a faster, fairer, and smoother transition than the traditional COP process can deliver.\nANTALYA—This year’s United Nations climate talks in Antalya, Turkey, broke up on Sunday without an agreement. Nearly 200 countries spent two weeks arguing about whether the final agreement could even mention phasing out fossil fuels. Apparently, it could not. Like last year’s conference in Belém, Brazil, which also failed to adopt a fossil-fuel roadmap, COP31 further reveals the limits of consensus-driven diplomacy.\nBut these high-profile failures do not mean that the global response to climate change is stalled. On the contrary, the energy transition is moving faster than ever, even if it still is not fast enough.\nConsider the latest headline figures. In the past ten years, solar photovoltaic costs have fallen by about 90%, onshore wind by about 70%, and batteries by over 90%. Global clean-energy investment now tops $2 trillion per year. Electric-vehicle sales keep rising. Transportation accounts for roughly 60% of global oil demand, most of it from cars and trucks, and EVs are simply the better technology. They are more efficient, cost less to operate, and are increasingly cheaper to buy. Once that becomes obvious to consumers everywhere, oil demand won’t just plateau. It will fall off a cliff, perhaps as soon as within the next decade or two.\nIncumbents know this, even if their lobbyists won’t say it. ExxonMobil and Saudi Aramco have both pledged to reach net-zero emissions from their own operations by 2050. Though they have since gone quiet about these targets, cutting emissions to near-zero may happen anyway. Norway, after all, pursues a similar strategy, with Norwegians buying almost only EVs, and the grid operating fully on renewables. Shell’s influential forecasters see the world reaching near-zero emissions by 2100 even in their gloomiest scenario: the “Archipelago” of fragmented, nationalistic strategies that one finds today.\nBut even if the end of the fossil-fuel era is a foregone conclusion, timing is everything. A world that reaches net-zero around 2100 will suffer average global warming of around 2.2–2.8° Celsius above pre-industrial levels, making irreversible tipping points all but inevitable. Getting there decades sooner will save many lives and livelihoods, not to mention trillions of dollars in climate-related damage.\nSpeed matters for economic reasons, too. The energy shock from the Iran war has once again exposed how dependent many economies remain on globally traded, geopolitically volatile commodities. Call it “fossilflation”: the inflationary cost of tying prices, budgets, and national security to oil and gas markets that a handful of producers and conflicts can move at will. The fix for that macroeconomic exposure is the same as the fix for climate change: phase out fossil fuels.\nBLACK FRIDAY SALE\nSave $50 on a new subscription\nThis Black Friday, a PS subscription starts at $39.99. You can read every new commentary from the likes of Joseph Stiglitz, Claudia Goldin, Raghuram Rajan, and Mariana Mazzucato, and explore an archive of 26,000 more prescient analyses by the world’s leading thinkers. With the year ahead promising to be a volatile one, few investments will serve you better\nSo, why do official talks keep stalling? There are two structural reasons. First, the UN process focuses on outcomes—targets, tons, and dates—while largely ignoring the root cause: the extraction and supply of coal, oil, and gas. Second, the process requires a consensus among some 200 countries, which gives governments (and companies) with the most to lose an effective veto over the final language.\nFortunately, in April, a more promising alternative approach got its first real test. At the First Conference on Transitioning Away from Fossil Fuels in Santa Marta, Colombia (co-hosted by the Netherlands), 57 countries, representing roughly one-third of the global economy, showed up to discuss supply rather than only emissions. Such a coalition of the willing (akin to a “climate club” proposed by the late William D. Nordhaus) helps eliminate the consensus problem altogether. By definition, those in attendance are already doing more to accelerate the energy transition, and they know that their ranks can expand over time.\nThere is ample precedent for this approach. In 1997, Canada led more than 120 countries to sign the Ottawa Treaty banning anti-personnel landmines, thereby making up for the failure of the UN’s consensus-bound disarmament forum (where China, Russia, and the United States each wielded a veto). A decade later, the Norway-led Oslo Process followed the same playbook and produced the 2008 Convention on Cluster Munit", "translation_ja": "", "vocab": []}, {"title_ja": "アメリカのAIボトルネックをコントロールするのは誰か？", "title_en": "Who Controls America’s AI Chokepoint?", "summary_ja": "本論説は、Nvidiaのジェンセン・ファン最高経営責任者（CEO）の一時的な辞任と復帰の事件を通じて、米国のテクノロジー覇権における矛盾を指摘している。NvidiaのAIチップにより米国は中国に対する影響力を持つ一方で、このチップがもたらす地政学的力によってNvidia自体が米国に対する影響力を獲得するという逆説的な構図が浮かび上がる。ファンが中国の情報機関関係者との不倫関係を認めたにもかかわらず、トランプ大統領が直接介入して彼のCEO復帰を実現させたことは、この力学の複雑さを象徴している。", "summary_en": "The saga of Jensen Huang's ouster and sudden return as Nvidia's chief executive has exposed a paradox at the heart of American technological hegemony. While Nvidia's AI chips give the United States leverage over China, the geopolitical power that Nvidia makes possible gives it leverage over the US.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/nvidia-scandal-who-controls-americas-ai-chokepoint-by-carla-norrlof-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWho Controls America’s AI Chokepoint?\nThe saga of Jensen Huang's ouster and sudden return as Nvidia's chief executive has exposed a paradox at the heart of American technological hegemony. While Nvidia's AI chips give the United States leverage over China, the geopolitical power that Nvidia makes possible gives it leverage over the US.\nTORONTO—On November 23, Nvidia reinstated Jensen Huang as chief executive, less than two weeks after his resignation amid a controversy stoked by national-security concerns. Huang admitted to having had multiple affairs, including with a suspected Chinese intelligence asset. Nonetheless, US President Donald Trump personally intervened with the company’s board to secure his return.", "translation_ja": "", "vocab": []}, {"title_ja": "民主党はAI規制で団結する必要がある。ここに3点計画がある", "title_en": "Democrats must unite on AI regulation. Here’s our three-point plan | Nathan E Sanders and Bruce Schneier", "summary_ja": "著者らは、民主党がAI規制に関する説得力のある計画を提示していないことが大きな問題であると主張している。有権者の84%がAIは米国の労働者に脅威をもたらすと考え、民主共和両党を超えて80%の民主党員と61%の共和党員がより厳しいAI規制を望んでいるにもかかわらず、民主党指導部は業界の寡占企業に対する対抗的な立場を明確にしていない。2028年の大統領選挙で成功するために、民主党は所得不平等の是正、技術へのアクセス公平性の確保、労働者と消費者の保護を含む統一されたAI政策議題を掲げる必要があると主張している。", "summary_en": "Voters are demanding action on the issue. We need to make AI work for the American public, not the tech oligarchs This month’s elections demonstrated the American public’s urgent demand for change. But they also revealed a glaring problem for the Democrats’ policy agenda: they haven’t presented a co", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/25/democrats-ai-regulation-plan", "state_media": false, "category": "オピニオン", "full_text": "This month’s elections demonstrated the American public’s urgent demand for change. But they also revealed a glaring problem for the Democrats’ policy agenda: they haven’t presented a compelling plan around AI.\nThis is important, because AI isn’t just a political issue in itself: it’s also a primary force behind both the economic disruption and political corruption that drove so many voters to the polls.\nAs AI companies and their boosters tossed around hundreds of millions of dollars in the 2026 elections, and the Trump administration lined up unequivocally alongside industry oligarchs, Democratic leaders have so far done more dodging than leading on the issue. Despite the massive overall shift towards the Democratic party, voters emerged from the election split on which party would best help control this technology.\nYet the public has been quite clear that they want government to take action. As an October survey shows, 84% of voters say AI threatens American workers, and 57% say the Trump administration has not taken AI risks seriously enough or at all. Eighty per cent of Democrats and 61% of Republicans want stricter AI regulation. This is one of the rare, emotional issues that crosses party lines.\nSome politicians have channeled that anger. The Democratic senators-elect Sherrod Brown in Ohio, James Talarico in Texas, Troy Jackson in Maine and Abdul El-Sayed in Michigan all ran – and won – against giveaways to tech billionaires and the general undercurrent of backlash against AI.\nAmong other proposals, the Vermont senator Bernie Sanders has advocated that the government acquire shares of AI companies, the California representative Ro Khanna has called to give workers a say in AI use in their workplaces, and the New York governor, Kathy Hochul, has signed safeguards for consumers using AI companions into law.\nBut there are other critical aspects of AI that have not yet made it on to the public agenda, where political leaders should be putting forward powerful ideas.\nThese include addressing the staggering inequality driven by the growing wealth of big tech, ensuring fair and universal access to this technology as it becomes increasingly embedded in life and work, and protecting consumers and workers from the exploitative uses of AI.\nTo be successful in the 2028 presidential campaign, Democrats must align around an AI policy agenda that shows they are willing to fight for the change voters are demanding.\nThe congressional caucus must walk into the Capitol in January prepared to take immediate legislative action on this agenda, showing they can channel the wishes of the public and set aside the self-interested demands of AI billionaires. That includes rejecting their campaign funds and barring Congress members from stock trading. And they should coordinate action across the statehouses they control, as well as those they do not.\nIn our book Rewiring Democracy, we studied examples from around the world of how AI will affect democratic politics. Following this month’s election, the path forward for US AI policy – and its intersections with broader economic and social policy – is clearer than ever.\nWe need to make AI work for the American public, not the tech oligarchs.\nWe propose a policy platform with three planks: curbing the power of big tech, building AI that works for everyone, and putting people in charge of where the technology is used.\nThe first plank is restraining the big tech companies that Trump has cozied up to. Today, a few trillion-dollar corporations are rigging the tech ecosystem – really, the country’s entire economy – for their own benefit, generating wealth from models trained on our knowledge, our grid, our land, and our air and water, while forcing the costs of their harmful practices on to the rest of us. We need to rein in their power and make them pay the costs of the problems they create for society.\nLike so many voters, we would start with datacenters. We would match and extend Massachusetts’ policy preventing companies from foisting pollution and price spikes on datacenter host communities. We would require datacenter developers to match their power consumption with new clean energy, and install energy storage systems to compensate for their strain on the energy grid.\nBut we also can learn from the UK’s experience, after a datacenter developer secured more than £200m of public guarantees for a project before backtracking on promises to use renewable energy.\nThe challenge is to ensure local control, while defending towns against developers with nation-state-like coffers. Congress should go beyond Massachusetts’ policy and insist that states receiving federal energy and economic grants require their cities to execute transparent, binding and enforceable agreements with datacenter developers. These agreements would need to meet a minimum standard of annual payments per megawatt-hour of energy consumption that accounts proportionately for local infrastructure impacts.\nWe would not stop", "translation_ja": "", "vocab": []}, {"title_ja": "AI時代の極度な富に対処する方法を提案する「パリ宣言」｜公開書簡", "title_en": "Our ‘Paris manifesto’ proposes how to deal with extreme wealth in the AI age | Open letter", "summary_ja": "本論説は、1987年以来の富の爆発的な増加により、世界人口のわずか0.0001%（約3,000世帯）の超富裕層が民主主義を脅かす前例のない権力を獲得したことを指摘する。著者らは、この国際的寡頭政治に対抗するため、公正な課税制度の導入を含む3つの原則を提案しており、特に個人資産に対する2%の税率下限設定と、過去の税不公正を是正する一度限りの追加課税を主張している。", "summary_en": "It is possible for democracy to reverse the dynamic of oligarchy. But we must act now The explosion of extreme wealth in the world is the defining social fact of our times. When Forbes magazine began ranking the world’s largest fortunes in 1987, the wealth of the richest 0.0001% of our planet’s popu", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/25/paris-manifesto-open-letter-ai-oligarchy", "state_media": false, "category": "オピニオン", "full_text": "The explosion of extreme wealth in the world is the defining social fact of our times.\nWhen Forbes magazine began ranking the world’s largest fortunes in 1987, the wealth of the richest 0.0001% of our planet’s population equaled 3% of global GDP. Since that time, the wealth held by this tiny group of people – just 3,000 households – has ballooned and now reaches 17% of global GDP.\nThis extreme wealth explosion has upended the balance of power, leaving choices that affect all of humanity to a few billionaires at the helm of a handful of corporations. The economic power of the ultra-wealthy is being used to consolidate their political power, creating a dynamic that is threatening democracy.\nThis dynamic of wealth and power is nothing new (the word “oligarchy” comes from ancient Greek), but its velocity and the scale of its cross-border impacts are unprecedented. A single decision made by the controlling shareholder of a multinational firm can wipe away jobs, deplete resources, or determine the course of a war.\nChoices made by the ultra-rich ignore national borders as they disrupt work and home lives, inject their ideas into the public discourse, bend public policy to fit their desires, siphon revenue away from states, and damage our earth.\nThe power dynamic of this international oligarchy must be countered with a transnational coalition to defend democracy. To this end, we affirm three principles.\n1 Fair taxation\nThe ultra-rich should pay taxes in proportion to their resources. As studies in many countries have shown, this is currently not the case. Myriad loopholes allow the wealthiest in the world to pay little or no income tax.\nA tax floor, expressed as a percentage of personal wealth, would put an end to this situation. This idea was first developed in a report commissioned by the G20 in 2024, under the presidency of Brazil, which proposed setting an individual tax floor equal to 2% of wealth for all fortunes more than $100m.\nSuch an initiative would ensure that the ultra-rich would pay at least as large a share of their income in tax as the middle class – the bare minimum required to ensure that fiscal law complies with the principle of tax fairness.\nThis annual tax floor should be accompanied by a one-time “catch-up” tax on the wealth of the super-rich to settle the outstanding tax inequalities that have fueled the explosion of extreme wealth. If this exceptional levy took into account any taxes paid during the time period covered by the catch-up, only those ultra-rich individuals who had avoided meeting their fiscal obligations would be affected.\n2 Media independence and pluralism\nInformation is not just another commodity, and access to it forms the bedrock of our democracies. The power of oligarchs to control information must be curtailed.\nThe purchase of media outlets and social platforms is one of the most glaring ways in which the ultra-rich capture power, ensuring themselves control over what is said, heard, learned and read. It is crucial to provide stronger support for public media and implement anti-concentration policies. In the age of big digital platforms, these anti-concentration policies should be designed on an international scale.\n3 Decisions to develop and deploy artificial intelligence technologies must be democratized\nKnowledge, artistic creation and works of imagination assembled over centuries are being captured, processed and repackaged (often without permission!) by a handful of corporations to be resold as artificial intelligence to the very humanity that produced them. There is still time to refuse that hijacking.\nTechnologies associated with artificial intelligence come with astronomically high risks: the possibility of cyber-attacks with lethal consequences, rapid and profound transformations of the labor market, the emergence of new forms of manipulation and disinformation, even the risk of human extinction. It would be folly to leave decisions about the deployment of these technologies in the hands of a few Silicon Valley billionaires.\nIn the field of information technology, the non-profit model has a proven track record. Some of the most popular applications and websites in the world, such as Wikipedia, Signal or Firefox, were developed by non-profit organizations. To build AI without oligarchs, companies working in this field should consider adopting the model of the non-profit foundation, with decisions piloted by those who understand them best: their own workers – the same people who, week after week, have been stepping down from their posts to warn us of the looming risk.\nToday, around the world, voices are being raised to protect our democracies from the threats of oligarchy. We are calling for a transnational coalition to defend democracy because, as history has shown, our voices are most powerful when we raise them together, as interconnected citizens. It is possible for democracy to reverse the dynamic of oligarchy. It is possible to work for a world that is no long", "translation_ja": "", "vocab": []}, {"title_ja": "フレーキング流行の時代到来。誰も集まりを主催したくない理由", "title_en": "We’re in a flaking epidemic. No wonder no one wants to host gatherings | Chelsea Flagan", "summary_ja": "アメリカは深刻な孤独の危機に直面しており、その原因は第三の場所の消滅や経済的困難だけではなく、スマートフォンが人々をより利己的で地域社会の意識を低下させたことにあるとチェルシア・フラガンは主張する。RSVPの直前キャンセル（フレーキング）が蔓延することで、ホスト側は集会を開くことに恐怖と屈辱を感じるようになり、低コストの社交交流の文化はさらに衰退しているのだという。", "summary_en": "We point to self-care as we skip out on activities – but routinely staying home poses its own risk to our mental health You might have heard by now, but Americans are quite lonely , especially if they’re young. The kind of low-effort, high-frequency hanging out we used to rely on – dropping by for d", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/25/flaking-epidemic-hosting-mental-health", "state_media": false, "category": "オピニオン", "full_text": "You might have heard by now, but Americans are quite lonely, especially if they’re young.\nThe kind of low-effort, high-frequency hanging out we used to rely on – dropping by for dinner, meeting up at the park, watching each other’s kids – has all but evaporated from our lives, leaving us unmoored from the social fabric that underpins our most basic wellbeing. (For reference, chronic loneliness has a comparable impact on long-term health to smoking.)\nAnd if you’re looking for a culprit, there are many to blame: the dissolution of third spaces and encroachment of car culture, the declining participation in social networks such as churches and unions, and the harsh economic conditions that have people working longer hours for less money with each passing year.\nAnd data shows that sheer disposable income is not as strongly correlated with social life as one might think: we are often completely eschewing the budget-friendly forms of contact that used to be standard in favor of being alone and scrolling on our phones.\nBut, as someone who literally wrote the book on getting together, and doing so across all income and age brackets, I would like to posit another reason why the American social fabric has so rapidly dissolved.\nIt’s not just that phones make it more appealing to scroll aimlessly than to have a conversation – it’s that they’ve made us more selfish, less community-minded people. Nearly every time I post a video about hosting, for example, my comments are filled with the same refrain: What’s the point of spending all this time and effort if no one actually shows up?\nAnd the concern that you might go through all the trouble of planning a party just to sit in an empty room surrounded by food and decorations is not irrational.\nWhen I posted this recent video about the psychic damage inflicted on a host by no-showing on an RSVP, it quickly racked up thousands of commenters sharing their experiences with the phenomenon. I am tagged daily in videos of people who did what I firmly believe we all should do: they took the risk of trying to get people together in real life, and they were left feeling humiliated by the realization that their party was simply an inconvenience that could be tossed overboard at the last minute.\nAnd with social media and party apps making it easier than ever to invite anyone you’ve ever met, and to perpetually “maybe” your entire calendar so you can make a game-time call as to what invitation you deem worthy (as this excellent Substack explores), we have entered a dual crisis. Fewer people than ever are willing to host, and when they do, it’s a massive gamble: who will actually show up?\nWhile there are, very occasionally, legitimate reasons to bail on a gathering at the last minute, we’ve also gotten very good at leveraging the language of mental health to lean into our most selfish impulses.\nWe speak in terms of boundaries and self-care about actions that don’t just devastate the person on the other side of our unreliability, but also sap at our own mental health, as community is arguably more important to it than our own immediate comfort.\nThe truth is, whether it’s exercising, spending time outside, showing up to a social commitment, or opting for more nutritious food over some quick takeout, it is often in doing the less immediately comfortable or enjoyable thing that we are truly caring for ourselves and those around us.\nAnd when it comes to gathering, the social isolation factor is very real: making and keeping platonic bonds is a skill, and the longer you are out of practice, the harder and more scary it becomes to start again. People are losing friends, and the process can accelerate until the entire concept of socializing feels like a threat.\nIt has never been easier in those moments to get under a blanket, make up a thin excuse for not showing up to a commitment, and reassure yourself that you have engaged in a powerful, therapeutic exercise by choosing to watch a screen again instead of literally anything else.\nWe increasingly speak of gathering in terms of self-sacrifice and effort, but, as this meme deftly satirizes, the thing we’re talking about – making friends and then hanging out with them – is supposed to be the fun part. It’s supposed to be the reward for all the work we do, both professionally and in our daily lives.\nInstead, the act has slipped so far from our cultural routines in just two generations that we no longer understand it as a leisure activity. (The performance of ultra-perfect hosting and homemaking on social media doesn’t help, but that’s a subject for another day.)\nSimply put, we have so radically devalued not just what it means to spend time with people we love, but to show respect for the people who facilitate it, that we have enabled a full-blown flake epidemic. And while I’m not willing to say that being a chronic flaker makes you a bad person, I am willing to say that it should not be acceptable – to you, or to anyone else.\nThere are so many prob", "translation_ja": "", "vocab": []}, {"title_ja": "世界的な反権威主義の波は幻想である", "title_en": "The Global Antiauthoritarian Wave Is an Illusion", "summary_ja": "著者は、2024年の米国中間選挙をトランプ候補の敗北として民主主義の勝利と解釈する見方を批判している。民主的規範を守る有権者の意識的な選択ではなく、むしろ指導者の能力と有権者自身の生活状況への関心が投票行動を左右していると主張する。民主主義の回復を示す証拠と見なされている世界的な動きも、実際には有権者が民主的価値より現実的な利益を優先していることの表れに過ぎず、民主制度は依然として後退のリスクにさらされていると論じている。", "summary_en": "Democracy can’t be saved at the ballot box.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/democracy-global-anti-authoritarian-wave-illusion", "state_media": false, "category": "オピニオン", "full_text": "In 2022, many observers celebrated the results of the United States’ midterm elections as a victory for democracy. The Republican Party underperformed at the ballot box, and some of the candidates most outspoken in support of former President Donald Trump’s historic effort to overturn the 2020 election outcome were among the casualties. President Joe Biden concluded that the American people “have proven once again that democracy is who we are.” Reporters for The New York Times concurred, writing that the midterm outcome demonstrated “the resilience of the country’s democracy” as the electorate rejected “openly extremist Republican candidates.”\nBut that rosy interpretation was more the result of wishful thinking than careful analysis. Most of the Republicans who lost were simply bad, inexperienced candidates. In fact, Republican members of Congress who had flouted the democratic process by voting to decertify electoral votes on January 6, 2021, suffered no discernible penalty at the polls, while the minority who had stood up for the rule of law faced stiff backlash from their party’s establishment and from primary voters. And, of course, two years later, Trump stormed back into the White House.\nIn this year’s midterms, Trump’s party took another, even bigger beating. And again, there has been a rush to celebrate the result as a triumph for democratic values. NPR reported that “one of the big, clear winners of the midterms is American democracy itself.” Amanda Taub, an international affairs columnist at The New York Times, upped the ante, writing that “An anti-authoritarian wave appears to be crashing over elections around the world.” Just as in 2022, however, there is reason to fear that this optimistic account seriously misconstrues what happened at the polls on November 3 and what the result means for the future. History shows that voters in the United States, as in other democracies, are much more focused on the competence of their political leaders and their own well-being than on adherence to democratic procedures. To imagine that they have suddenly become guardians of democratic norms is to misunderstand the electorate’s role in the democratic process—and to underestimate the chronic susceptibility of the American political system to democratic backsliding.\nBELIEFS VS. BUTTER\nIt is natural to “feel pride,” as the New York Times editorial board put it, in the notion that ordinary citizens “stood up” for democratic principles at the ballot box. Democracy is the United States’ civil religion, and the voice of the people is the closest thing Americans have to the voice of God. But as the British jurist and historian Henry Sumner Maine observed in 1885, the oracle of democracy is often “not as intelligible as might be desired.” Electoral behavior is complex, and interpretations of election outcomes constructed in the hours and days after a vote often turn out to be far off the mark. Voters in democracies are less ideological than analysts generally assume. They are also less committed to abstract democratic norms than high-minded observers might hope. In a 2020 study, the Yale political scientists Matthew Graham and Milan Svolik used survey experiments to test the impact of democratic norm violations on Americans’ support for hypothetical candidates. They concluded that “only a small fraction of Americans prioritize democratic principles in their electoral choices when doing so goes against their partisan identification or favorite policies.” In 2022, real voters demonstrated the same point with their willingness to support Republican members of Congress who had participated in Trump’s bogus “stop the steal” effort.\nThis year, the exit polls run by a consortium of American news organizations provided superficial support for the notion that the midterm “blue wave” was an explicit rejection of Trump’s continuing assault on democratic norms. These surveys asked voters which of six issues was the most important facing the country. A third of respondents chose “the state of democracy,” and an overwhelming proportion of those who did, 79 percent, voted for Democratic congressional candidates. Taken at face value, these data suggest that more than a quarter of the electorate voted Democratic because they opposed Trump’s efforts to subvert American democracy.\nAlas, people’s explanations for their own behavior are often misleading. Responses to list choices of this sort are particularly sensitive to the specific options presented and their favorable or unfavorable connotations. Given the choice, most people would probably prefer to attribute their votes to principled support for democracy than to pique at the price of gas. But when a separate YouGov poll conducted just after the vote asked an open-ended version of the same question, only five percent of voters spontaneously cited government corruption or the undermining of democracy as the most important factor motivating their choice.\nA closer look at the exit poll", "translation_ja": "", "vocab": []}, {"title_ja": "中国は関係改善の終焉に向けて準備を進めている", "title_en": "China Is Preparing for the End of Détente", "summary_ja": "トランプ大統領と習近平指導部の友好的な関係により、中国は米中関係が「関係改善」の新しい段階に入ったと主張しているが、中国の外交専門家の多くはこれが一時的なものに過ぎないと悲観的に見ている。トランプ政権が去った後、競争と敵意が再び高まると予想されるため、中国は今後2年間で貿易取引や公的外交を進め、関係の改善を定着させ、将来の悪化に備えようとしている。", "summary_en": "After Trump, a hawkish backlash awaits.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/china-preparing-end-detente-trump-yun-sun", "state_media": false, "category": "オピニオン", "full_text": "After three cordial meetings in six months between U.S. President Donald Trump and Chinese leader Xi Jinping, Beijing is trumpeting optimism about U.S.-Chinese relations. At last week’s Asia-Pacific Economic Cooperation forum in Shenzhen, China—where Xi personally met Trump at the airport and the two embraced—Xi said that U.S.-Chinese relations were on a “stable and positive trajectory” and that both sides were making efforts to sustain “current positive momentum.” Buoyed by Trump’s unprecedented friendliness toward China, Beijing is amplifying a narrative that relations between the two superpowers have entered a more amicable phase of détente—what the Chinese ambassador to the United States, Xie Feng, has hailed as a “new chapter” in the countries’ relationship.\nBut this sentiment is more aspiration than accepted reality. Many foreign policy scholars and strategists in China remain largely pessimistic about bilateral relations with the United States. Great-power competition might have been put on hold temporarily because of Trump’s personal desire for warmer ties, but the fundamental national security challenges China poses to the United States remain. There is a tacit consensus in Beijing that heightened competition and hostility are likely to reemerge as a U.S. priority once Trump is gone, if not sooner. Indeed, these tensions are already beginning to appear: the ouster of Jensen Huang, the NVIDIA co-founder and CEO, was read in Beijing as a coordinated attack by members of the Washington establishment to take China policy in a more hawkish direction. And it was only because of Trump’s personal intervention that Huang was reinstated.\nBeijing is thus wasting no time making the most of the last two years of the Trump administration. The goal is twofold: to preserve a positive direction for U.S.-Chinese ties to show Americans that better relations are worth maintaining and to consolidate any gains from dealing with Trump to build a higher floor under the relationship in anticipation of an inevitable downturn. For the next two years, China’s strategy is to pursue trade deals and investment opportunities, use public diplomacy to win hearts and minds in the United States, set a new normal on limiting U.S. arms sales to Taiwan, and take a harder line toward U.S. allies in the region, especially Japan and the Philippines, to punish perceived defiance of China’s vision for order in the Asia-Pacific. In many areas, what matters are tangible markers of progress and practical gains that future U.S. policymakers may want to preserve. Then, if and when relations sharply deteriorate, as most assume they will, such actions will ensure that even a significant setback will still leave Beijing in a stronger position than it would otherwise be in—and remind Washington of what is possible when ties are stable.\nTHE ELEPHANT IN THE ROOM\nThe Chinese policy community has been watching closely as Washington’s strategy has shifted. Under the first Trump and the Biden administrations, it was “strategic competition”—a form of great-power struggle centered on divergent values and interests. Under the second Trump administration, it has become “constructive strategic stability,” an idea that originates in the “mutually assured destruction” doctrine of nuclear deterrence but actually goes much further. Although there is no formal definition, strategic stability between the United States and China implies managing frictions in bilateral relations through accommodation and reciprocity on issues as varied as trade, Taiwan, and technology, especially artificial intelligence.\nFor American observers, the driving force of this change is obvious: Trump. China policy under the second Trump administration has been directed by the president himself, who, as analysts describe it, has acted as his own China “desk officer.” It was Trump’s decision to abandon the great-power competition narrative, to pursue warmer ties with Xi, and to avoid friction with Beijing over the sensitive issue of Taiwan’s status. And the Republican-dominated Congress of the past two years has rarely pushed back against the White House’s decision-making on foreign policy.\nDespite this obvious explanation for the changes in U.S.-Chinese relations, leaders in Beijing have instead opted to embrace a structural argument rather than one based on Trump’s personal preferences. In this telling, China’s forcef let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-26 03:14 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
