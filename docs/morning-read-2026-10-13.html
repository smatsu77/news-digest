h secretly planting a recording device in one of OpenAI's offices in California, federal prosecutors announced.\nAbdulrahman Alfozan, who worked at the AI firm as an engineer, was charged federally with using or endeavoring to use an electronic, mechanical, or other device to intercept oral communications.\nOpenAI said it had discovered a \"sophisticated recording device\" hidden in their San Francisco office and alerted the FBI. The company said it used its AI models to track that it had been planted by an employee.\nProsecutors say the device, wrapped in toilet paper, was found inserted in a USB port on the back of a TV in an executive conference room.\nOpenAI, the maker of the popular chatbot ChatGPT, said that it has no indication that source code, model weights or customer data were inappropriately accessed or taken in the incident. It said the employee has been fired.\nAccording to the complaint, Alfozan \"allegedly concealed a covert recording device inside his employer's executive conference room to secretly capture sensitive communications,\" FBI Director Kash Patel said in a statement.\nPatel said that the alleged goal was to capture information about the company's AI product.\nAlfozan has been working as an engineer at OpenAI since July 2025, prosecutors say.\nOn 30 September, OpenAI employees discovered the device - two days after prosecutors say it had been installed. The device was encrypted, prosecutors said.\nOpenAI said they were able to use their AI models \"to understand the device and where it had come from, identifying that a specific employee had planted it a few days earlier\".\nAccording to the FBI, the suspect used a \"productivity tool\" and a \"chatbot\" to research sensitive locations at OpenAI and how to secretly place audio equipment.\nChatbot prompts that he is alleged to have searched include \"building, customizing, installing, audio recording, testing, obfuscating, and remote accessing a device\", prosecutors allege.\nHe is also accused of using the chatbot to ask about \"'build[ing] a continuous audio recorder,' 'customiz[ing] Wi-Fi . . . connectivity,' 'improv[ing] audio and live listening,' and 'encrypt[ing] the SD card'\".\nOn 5 October, prosecutors say he allegedly returned to inspect the device in the office room. Prosecutors used CCTV camera footage to link him to the scene.\nThat same day, Alfozan left a bag unattended in a different part of the building. A security team for OpenAI opened it to find his wallet and ID, as well as another recording device that was similar to the one found in the office conference room, prosecutors said.\nAlfozan appeared in court on Tuesday. It's unclear whether he has legal representation.\nIf found guilty, he faces up to five years in prison and a fine of $250,000 (£187,000).\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.\nRelated topics\n  - Published4 days ago\n  - Published17 September", "translation_ja": "", "vocab": [{"word": "endeavoring", "definition": "～しようと努力する、企てるという意味。法的文脈では、ある行為を実行しようとする意図と行動を表します。"}, {"word": "covert", "definition": "秘密の、隠密の、暴露されていないという意味。スパイ活動や密かな作戦を説明する際によく使われます。"}, {"word": "obfuscating", "definition": "意図的に曖昧にする、不明確にする、隠蔽するという意味。技術的には情報やコードを理解困難にすることを指します。"}, {"word": "intercepted", "definition": "（通信などを）傍受する、遮断するという意味。電話やメッセージなど、意図された相手に到達する前に傍受する行為を表します。"}, {"word": "encrypted", "definition": "暗号化された、符号化されたという意味。データを保護するために解読困難な形式に変換することを指します。"}]}, {"title_ja": "Germany puts Ukrainian on trial accused of blowing up Nord Stream pipelines", "title_en": "Germany puts Ukrainian on trial accused of blowing up Nord Stream pipelines", "summary_ja": "Four years after the attacks, Serhii K will appear in court accused of a plot to destroy Russia's gas pipelines to Germany.", "summary_en": "Four years after the attacks, Serhii K will appear in court accused of a plot to destroy Russia's gas pipelines to Germany.", "source": "BBC World", "tier": "public" plosives were found in the samples taken from the boat\".\nDespite the strain on relations with Kyiv, German prosecutors pressed ahead with the case, and in January 2025 the German federal court of justice ruled that it fell within German territorial jurisdiction, external and prosecutors had a responsibility to act as it involved \"undermining [Germany's] internal security\".\nUkraine's Volodymyr Zelensky has always maintained that Ukraine had \"nothing to do with [the Nord Stream blasts]\", although in their indictment German prosecutors allege the saboteurs conceived the plot \"acting by order of Ukrainian state agencies\".\nThey say the case falls under Germany's code of crimes against international law as a war crime\" as an attack by military means against civilian objects\".\n- Nord Stream trial: How German police followed the evidence - to Ukraine \n  - Published3 days ago\nThe case has highlighted differences of opinion on the trial in Kyiv and Berlin.\nOleksandr Merezhko, who chairs the Foreign Affairs Committee in the Ukrainian parliament, points out that the blasts took place during a time of war with Russia and \"Nord Stream 2 was nothing but a tool used by Russia in order to get prepared for the war\".\nHe told the BBC they had no confirmation of the German account: \"It's one of the versions.\"\nHowever, Stefan Meister, of the German Council on Foreign Relations, says successive chancellors in Berlin have done their best to remove the politics from the case.\n\"They tried to make not a big story out of it, not to give it too much attention, to give it to the institutions, to the judiciary that they will deal with it. This is not a political case. So they tried to depoliticise it,\" he explained.\nIn August 2025, Serhii K was arrested after checking into a hotel near the Italian Adriatic resort of Rimini, by police acting under a European arrest warrant issued by federal prosecutors in Germany.\nAfter several weeks of court battles fighting extradition, Serhii K - identified in court documents as Serhii Kuznetsov - was transferred to Germany late last year.\nGerman prosecutors allege that in 2022 he was a serving officer in the Ukrainian army, external, and he had led a group of professional divers, a boat captain and an explosives expert.\nWhile his legal fight was going on in Italy, another Ukrainian man called Volodymyr Zhuravlov successfully challenged Germany's extradition bid in a Polish court.\nIn a ruling very different from Italy's Supreme Court, the Polish judge ordered Zhuravlov's release in October 2025, stating that the attack on the pipelines was not unlawful, and if Ukraine had organised an armed mission it was \"justified, rational and just\".\nAlthough he was released by the court in Warsaw, he was arrested last August in Croatia on suspicion of being a suspect who \"participated in the dives necessary\" for the sabotage.\nLast month, Croatia approved his extradition, although it is not clear when that will happen, and if his case could become part of the Hamburg trial.\nDespite the difficult nature of the case for Kyiv and Berlin, Ukrainian MP Oleksandr Merezhko does not believe it will spoil relations as \"it", "translation_ja": "", "vocab": [{"word": "sabotage", "definition": "意図的に施設や計画を破壊する行為。政治的または軍事的目的で行われることが多く、ここではパイプラインの爆破を指している。"}, {"word": "extradited", "definition": "ある国から別の国へ身柄引き渡しされること。国際法に基づき、容疑者が裁判を受けるため本国に送還される。"}, {"word": "apportioning", "definition": "責任や非難を特定の対象に割り当てること。ここでは爆破の責任をロシアに直接結びつけないという意味で使われている。"}, {"word": "territorial jurisdiction", "definition": "特定の地域における法的管轄権。国家が自国内で起きた事件に対して司法権を行使する権利を指す。"}, {"word": "indictment", "definition": "検察が被告人に対して提出する正式な告発状。犯罪行為に関する具体的な容疑が記載されている。"}]}, {"title_ja": "Family pays tribute to 'warm and engaging' man killed in tiger attack", "title_en": "Family pays tribute to 'warm and engaging' man killed in tiger attack", "summary_ja": "William Chapman was attacked by the tiger after he entered its pen at Yorkshire Wildlife Park.", "summary_en": "William Chapman was attacked by the tiger after he entered its pen at Yorkshire Wildlife Park.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck054nvzr676o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Family pays tribute to 'warm and engaging' man killed in tiger attack\n- Published\nThe family of a man who was killed by a tiger after he entered its enclosure at a wildlife park has paid tribute, describing him as \"bright, warm and engaging\".\nWilliam Chapman, 23, visited Yorkshire Wildlife Park near Doncaster on Saturday and was attacked after going into the animal's pen. He was pronounced dead at the scene.\nIn a statement, his family said that he had suffered from \"significant mental illness\" over a number of years and had been prescribed \"strong medication\".\nIt said it was for the coroner to decide whether his mental illness played a part in his death, asking that the public respect that process.\nCity of Doncaster Council has launched a health and safety investigation into Chapman's death and the park remains closed.\n\"William was a bright, warm and engaging young man whom his family dearly loved - and William loved them back,\" a statement released on Tuesday evening said.\nThe family also asked for privacy, saying \"the publication and circulation of deeply offensive media content is causing them severe distress at an exceptionally vulnerable time\".\n\"The family are utterly devastated by their loss and are struggling to come to terms with what has happened,\" the statement continued.\n\"The family are hopeful that the relevant authorities will do their upmost to get to the bottom of why our amazing son did what he did.\"\nThe incident, which took place shortly after 13:30 BST on Saturday, led to the evacuation and ongoing closure of the park.\nAn eyewitness described seeing Chapman wearing headphones and \"pacing around\" near the enclosure before he went in.\nMobile phone footage, believed to be from Chapman, appears to show the inside of the enclosure as he approaches the tiger across a patch of grass.\nA stage school where Chapman had been a former pupil also posted a tribute on Tuesday.\n\"We loved watching William grow, both as a person and as a performer, during his time with us,\" the Jackie Palmer Stage School in High Wycombe said.\n\"It was a privilege to be part of his journey, and he will be remembered with great fondness by everyone who had the pleasure of knowing him.\"\nStaff at Yorkshire Wildlife Park have separately said their \"thoughts and heartfelt sympathies\" are with Chapman's family and confirmed the rare Amur tiger, called Altai, remained in the enclosure and would not be euthanised.", "translation_ja": "", "vocab": [{"word": "tribute", "definition": "故人や尊敬する人物への敬意を表す言葉や行為。ここでは家族が亡くなった息子への敬意を示す声明を指す。"}, {"word": "enclosure", "definition": "動物を飼育するために柵や壁で囲まれた区域。野生動物公園でトラが飼われていた場所を指す。"}, {"word": "euthanised", "definition": "動物の苦しみを終わらせるために安楽死させること。医学的に行われる処置。"}, {"word": "vulnerable", "definition": "傷つきやすく、防御できない状態。ここでは家族が精神的に弱い状態にあることを表す。"}, {"word": "eyewitness", "definition": "事件や出来事を直接目撃した人。現場に居合わせて事実を証言できる人物を指す。"}]}, {"title_ja": "Zelensky and Burnham to meet in Downing Street", "title_en": "Zelensky and Burnham to meet in Downing Street", "summary_ja": "The prime minister is calling for partners to step up support for Ukraine following Trump's criticism of Zelensky.", "summary_en": "The prime minister is calling for partners to step up support for Ukraine following Trump's criticism of Zelensky.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq98z59xdny5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Zelensky and Burnham to meet in Downing Street\n- Published\nPrime Minister Andy Burnham will host Ukrainian President Volodymyr Zelensky at Downing Street on Wednesday, as the UK announces it will accelerate its delivery of air defence missiles to Kyiv.\nBurnham is also expected to set out how his government will draw up further sanctions against Russia.\nSpeaking ahead of the meeting, Burnham said the UK was with Ukraine \"for as long as it takes\", adding: \"Russian aggression cannot be allowed to succeed on our continent.\"\nThe UK will also urge allies to step up pressure on Russia, with Chancellor John Healey using International Monetary Fund (IMF) meetings to call for a ban on Russian liquefied natural gas (LNG).\nThis will be Zelensky's second visit to the UK since Burnham became prime minister. His first was in late July, days after Burnham entered No 10, when the pair met troops and led a news conference at a naval base in Portsmouth.\nBurnham said: \"Our rock-solid support to Ukraine is vital for keeping us safe here in the UK and ensuring those on the frontlines have the equipment they need to push back Russia.\n\"My message to the Ukrainian people could not be clearer, we are with you for as long as it takes, and we will go further and faster in our support to back your courageous fight for peace in Europe.\n\"It is not just the right thing to do, but it's the necessary thing to do.\"\nAmong the measures being announced is the quicker delivery of British Lightweight Multirole Missiles (LMMs), with the UK having already committed to send more than 5,000 worth £1.6bn over the next four years.\nThe UK will also reaffirm its plans to fully implement a maritime services ban on Russian LNG exports.\nThe meeting between Zelensky and Burnham follows what Foreign Secretary Ed Miliband described as a \"very difficult few days\" for UK-US relations due to President Donald Trump's decision to ease sanctions on Russian diesel.\nZelensky criticised the US deal with Russia, calling it a \"gift\" to President Vladimir Putin. Trump, in response, called for new leadership in Ukraine and criticised Zelensky for striking Russian oil refineries.\nMeanwhile, Healey will ask partners at the IMF to step up support for Kyiv and ensure Russia heeds the US' call for a full energy ceasefire.\nTrump claimed on Sunday that Russia and Ukraine had agreed to an immediate energy ceasefire - but hours later, Zelensky said Russian attacks on energy facilities had continued.\nOn Monday, Russia's Foreign Minister Sergei Lavrov said Ukraine did not deserve the \"respite\" a ceasefire would bring.\n- Analysis: Trump's global headaches worsen weeks before crucial elections \n  - Published1 day ago\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.", "translation_ja": "", "vocab": [{"word": "accelerate", "definition": "スピードを上げる、加速させる。ここでは英国がウクライナへのミサイル防衛兵器の配送速度を早めることを意味している。"}, {"word": "aggression", "definition": "攻撃的な行為、侵略。国家が他国に対して行う軍事的な侵害や敵対行為を指す。"}, {"word": "sanctions", "definition": "経済的・政治的な制裁。違反国に対して他国が課す罰則措置で、輸出入の禁止や資産凍結などが含まれる。"}, {"word": "reaffirm", "definition": "再度確認する、改めて主張する。既に発表した方針や計画を再度強く確認することを意味する。"}, {"word": "ceasefire", "definition": "停戦、戦闘の一時休止。紛争当事者が合意によって一時的に武力行使を中止すること。"}]}, {"title_ja": "MI5 chief warns of threats to UK from Russia, Iran and AI", "title_en": "MI5 chief warns of threats to UK from Russia, Iran and AI", "summary_ja": "Sir Ken McCallum says operations to tackle terrorism and state threats are now roughly of an \"equal scale\".", "summary_en": "Sir Ken McCallum says operations to tackle terrorism and state threats are now roughly of an \"equal scale\".", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c60rl5vwpk02o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "MI5 chief warns of threats to UK from Russia, Iran and AI\n- Published\nMI5 is devoting more resource to countering state threats than during the Cold War, the head of the intelligence service has said.\nSir Ken McCallum said threats from foreign adversaries had quadrupled in the last decade, with Russia \"aggressor number one\" as well as increased Iran-linked aggression against Jewish sites and military bases.\nAt an annual speech in London, MI5's chief said Russia was waging hybrid warfare at a time when AI was \"supercharging the cyber-security contest between attackers and defenders\".\nHe also warned of rising threats from \"extreme right-wing terrorism\" and said MI5 had \"caught terrorists seeking to exploit AI,\" including by integrating the technology with drones.\nHe said the biggest threat from the misuse of AI was extremist groups using the technology to harness new and existing bioweapons.\nHowever, he noted that work countering terrorism and state threats was now \"pretty much of equal scale\" which he described as a \"huge shift\" in recent years.\nSir Ken said Russia had stopped short of \"conventional conflict\" against Nato and is instead trying to unsettle European countries while its progress in its full-scale invasion of Ukraine is \"minimal and horrifically costly\".\nHybrid warfare or hybrid attacks are loose terms which tend to describe non-military methods, for example cyber-attacks, sabotage or misinformation, designed to exert pressure and destabilise an adversary.\nThese are quite often employed using proxies, but Russia always denies involvement in such attacks despite growing evidence to the contrary.\nSir Ken said MI5 successes in identifying and expelling Russian spies from the UK had left the Kremlin dependent on paying proxies for attempted attacks.\n\"With its traditional covert footprint eviscerated by almost 1,000 expulsions since the invasion, the Kremlin's global toolkit is weak, he said.\n\"So we see them scrambling to pay criminals to do their bidding.\"\nHe added: \"These are not the actions of a great power with the strategic upper hand.\"\nHis comments come as a growing number of leaders across Europe have warned Russia may be preparing attacks to test their commitment to supporting Ukraine.\nAsked after the speech about Prime Minister Andy Burnham's recent comments that Russia interfered with the Brexit referendum, Sir Ken said it was \"not new news\" that there had been attempts from Moscow but distinguished between \"interference attempted\" and \"outcome achieved\".\nHe said it was a matter of public record that there were pieces in Russian media and \"so-called internet trolls and bot farms\" seeking to influence the Brexit debate, but also stressed that the result of the 2016 referendum was \"not in dispute\".\nHe added that he was \"worried\" about the the ongoing debate on Russian interference.\n\"I am a little bit anxious that we don't play into our adversaries' hands by making these trolls look 10ft tall,\" he told reporters.\nMeanwhile, Sir Ken warned that Iran is also expanding a hybrid campaign in the UK.\nThe intelligence chief said there had been 50 arrests in the last year over Iran-linked activities.\nMuch of this Iranian aggression has been aimed at Jewish communities, Sir Ken added, and also at \"harder targets, like military sites\".\nSir Ken did not mention arrests at RAF Fairford directly during his speech, but told reporters afterwards the incident was \"not unique\".\nHe added: \"We have seen Iranian interest beyond RAF Fairford in the UK.\"\nThe incident at the airbase in Gloucesteshire, where three suspicious vans were seen parked nearby, has seen seven people arrested and bailed by counter-terrorism police.\nBurnham has said the incident was \"almost certainly directed by Iran's Islamic Revolutionary Guard\".\nThe MI5 head said in his speech: \"What I can say is that those who seek to cause mayhem on British streets - whether hired thugs here or their paymasters overseas - will meet an unflinching response.\"\nSir Ken added that the National Security Act - a 2023 law designed to target people working against UK interests for foreign powers - is in heavy use, and has been employed to tackle threats from China as well as Iran and Russia.\nOn the emerging threat posed by AI, Sir Ken said: \"It can produce propaganda and radicalising material tailored to the individual.\n\"We've caught terrorists seeking to exploit Al to improve their reconnaissance and attack methodologies, with Al-enabled drones adding a new twist.\"\nSir Ken said the bioweapons threat posed by AI was \"not yet realised\" but warned the technology has the \"potential to change the stakes\".\n\"These risks are real. The UK Intelligence Community - MI5, GCHQ, MI6 - is working closely with the UK's globally respected AI Security Institute to take them on.\"\nSir Ken said AI poses unknown threats, telling Thames House: \"Put at its simplest, human history has given us no experience of facing an actor which is smarter than we are\".\nHe announced MI5 had launched a", "translation_ja": "", "vocab": [{"word": "devoting", "definition": "リソースや努力を特定の目的に充てること。ここではMI5が冷戦時代以上にリソースを国家脅威への対抗に割き当てていることを意味する。"}, {"word": "quadrupled", "definition": "4倍に増加すること。外国の敵対勢力からの脅威がここ10年で4倍になったことを表している。"}, {"word": "hybrid warfare", "definition": "軍事的でない方法（サイバー攻撃、破壊行為、偽情報など）を組み合わせた非従来型の戦争形態。相手国を不安定化させることが目的。"}, {"word": "eviscerated", "definition": "内部を完全に取り出す、骨抜きにするという意味で、ロシアの秘密工作機関がほぼ壊滅状態になったことを比喩的に表現している。"}, {"word": "strategic upper hand", "definition": "戦略的優位性、有利な立場を意味する。ロシアが大国としての優位性を失ったことを示唆している。"}]}, {"title_ja": "Cornell suspends frat parties after gang rape case", "title_en": "Cornell suspends frat parties after gang rape case", "summary_ja": "Cornell said no parties will be held at frat houses until the end of the academic year. The university is trying to mend its reputation following its handling of a gang rape case in 2024.", "summary_en": "Cornell said no parties will be held at frat houses until the end of the academic year. The university is trying to mend its reputation following its handling of a gang rape case in 2024.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/cornell-suspends-frat-parties-after-gang-rape-case/a-79655735?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Cornell suspends frat parties after gang rape case\nOctober 14, 2026\nCornell University has suspended all parties at frat houses until the end of the 2026/27 academic year, the university announced on Tuesday.\nThis comes after the case in which a woman alleged to have been drugged and sexually assaulted by multiple members of the Chi Phi fraternity in October 2024, with the university's reaction to the gang rape allegations now attracting criticizm from around the nation and overseas.\nThe new measures include a new \"zero tolerance\" policy for violations, which would result in an immediate suspension of a chapter.\nUniversity President Michael Kotlikoff said these measures were to \"provide time for a thorough review of fraternity life\" at Cornell, while also determining how it can safely continue. The university has more than 20 active fraternities that are organized under its Interfraternity Council.\nIt is not clear whether the suspension also includes parties that take place outside the campus.\nMore support for victims\nAs part of the measures, Cornell is to hold talks with students and faculty experts about the \"the development of safe social alternatives\" to Greek life party culture, as well as investing the money needed to support the initiatives' establishment, Kotlikoff said.\nThe Cornell president also said the institution will be adding a case manager to its Office of Civil Rights to support people that report sexual misconduct to help in navigating the process.\nCampus police, which has full law enforcement authority but is controlled by Cornell, are largely the ones responsible for looking into crimes committed at the university. However, Kotlikoff announced that Cornell will work closely with New York State Police to allow an investigation independent of the school.\nDecision not to prosecute criticized\nThe 2024 gang rape allegations were initially investigated by the campus police, which then passed its initial findings to the Tompkins County district attorney, who did not prosecute — a decision that was lader met with widespread criticizm.\nThe woman filed a lawsuit in September, in which she claimed she had been drugged and sexually assaulted by several fraternity members after attending a party at the Chi Phi house in October 2024.\nAccording to the lawsuit, messages saying she was sexually available were sent among fraternity members without her knowledge.\nAfter learning about the case, Cornell closed the fraternity chapter and disciplined several students, without any criminal charges being filed.\nAll seven men mentioned in the lawsuit have denied the allegations.\nAfter the case was made public and triggered wide-scale criticism, the investigation is now in the hands of New York Attorney General Letitia James. The university's response will be reviewed by former Deputy US Attorney General Sally Yates.\nEdited by: Zac Crellin\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "allegations", "definition": "告発や主張のこと。特に犯罪や不正行為について、証拠なしに誰かが何かをしたと主張すること。この記事では性的暴行に関する主張を指している。"}, {"word": "zero tolerance", "definition": "違反に対して全く容赦しない厳格な方針のこと。どんなに小さな違反でも即座に罰せられる。"}, {"word": "navigate", "definition": "複雑な状況や手続きを上手く進める、対処するという意味。ここでは性的不品行の報告プロセスを進めることを指す。"}, {"word": "prosecution", "definition": "検察による訴追や起訴のこと。犯罪者を法的に裁くための公式な法的手続き。"}, {"word": "disciplined", "definition": "規則違反に対して罰を与えること。懲罰を科すという意味で使われる。"}]}, {"title_ja": "OpenAI says employee caught planting listening device", "title_en": "OpenAI says employee caught planting listening device", "summary_ja": "A Saudi national employed by the artificial intelligence lab has been arrested after a listening device was planted in a company conference room.", "summary_en": "A Saudi national employed by the artificial intelligence lab has been arrested after a listening device was planted in a company conference room.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/openai-says-employee-caught-planting-listening-device/a-79655491?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "OpenAI says employee caught planting listening device\nOctober 13, 2026\nOpenAI, the company behind ChatGPT, said Tuesday one of its employees was arrested after a \"sophisticated recording device\" was found in one of its San Francisco offices.\nA 35-year-old Saudi national working as an engineer was arrested on Friday, a week after the device was discovered in a conference room, according to a criminal complaint filed in federal court in San Francisco.\nAfter the device was discovered, the company reported the finding to the FBI and fired the employee. A federal investigation is ongoing.\nThe suspect, who appeared in court on Tuesday, has been charged with using or endeavoring to use an electronic, mechanical, or other device to intercept oral communications.\nThe criminal complaint did not specify what the suspect might have wanted to do with the recordings. It did add, however, that the suspect used a tool to inquire about the company's building addresses, meeting rooms, meeting-room capacities and calendars.\nHow was the device found?\nOpenAI said the device was discovered a few days after it was allegedly planted by the suspect.\n\"We used our models to understand the device and where it had come from, identifying that a specific employee had planted it a few days earlier,\" a spokesperson for the artificial intelligence company told the Associated Press.\n\"At this time, we have no indications of this individual inappropriately accessing or exfiltrating model weights, source code, or customer data,\" the spokesperson added.\nAccording to the US Justice Department, the suspect wrapped a USB device in toilet paper and hid it inside a television located in an \"executive conference room.\"\nHe was seen on camera near the room several times despite not having authorization to sit in meetings there. After this was noticed, another camera was installed in the room that captured the suspect on film checking on the stashed device.\nEdited by: Zac Crellin\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "sophisticated", "definition": "高度に複雑で、高い技術レベルを持っている様子。単純ではなく、精密な設計や構造を指す。"}, {"word": "intercept", "definition": "通信や情報などが目的地に到達する前に傍受する、または遮断する。ここではスパイ行為で盗聴を意味する。"}, {"word": "exfiltrating", "definition": "機密情報やデータを不正に組織から外部へ持ち出す、流出させる行為。情報セキュリティにおける重大な違反。"}, {"word": "endeavoring", "definition": "困難であっても目標達成のために努力する、試みる。法律用語では「～しようと企てた」という意味で使われる。"}, {"word": "authorization", "definition": "正式な許可や権限。特に企業や組織において、特定の人物や行為を公式に認める権限のこと。"}]}, {"title_ja": "Vatican confirms Pope Leo underwent surgery for lung cancer", "title_en": "Vatican confirms Pope Leo underwent surgery for lung cancer", "summary_ja": "The pope has had part of his lung removed and is recovering after surgery. Leo has been unusually candid for a pontiff about his health issues, disclosing the surgery to thousands of people in St. Peter's Square.", "summary_en": "The pope has had part of his lung removed and is recovering after surgery. Leo has been unusually candid for a pontiff about his health issues, disclosing the surgery to thousands of people in St. Peter's Square.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/vatican-confirms-pope-leo-underwent-surgery-for-lung-cancer/a-79647264?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Vatican confirms Pope Leo underwent surgery for lung cancer\nOctober 13, 2026\nPope Leo XIV underwent surgery on Tuesday to remove a nodule from his lung that later was reported to be cancerous, the Vatican said, adding the pope \"woke up normally\" after the procedure.\n\"The procedure was completed successfully, within the expected timeframe and as planned,\" said a brief Vatican statement.\nThe Vatican said in a medical bulletin that he lower lobe of Leo's right lung was removed, and he was diagnosed with lung adenocarcinoma, a common form of lung cancer.\nThe Vatican said the diagnosis had been suspected by preoperative tests and was confirmed during surgery.\nThe surgery at Rome's prestigious Gemelli hospital, which has been the main site of treatment for popes for decades, lasted about three hours. Leo's recovery is expected to take about a week, the statement added.\nAccording to oncologists, Leo has an excellent prognosis since the cancerous nodule was caught so early.\nA Vatican source cited by AFP news agency said further tests were being carried out to determine if the cancer had spread further.\nShift in transparency\nLeo, 71, disclosed the health issue to thousands of worshippers at a prayer service on Sunday, making a marked shift in the level of transparency about his health compared to his predecessors.\nIn the past, the Vatican has often been accused of making confusing or extremely vague statements about popes' health, if revealing at information at all.\nAll of the pontiff's engagements have been cancelled through October 20. He is still likely to take a planned trip to South America in November.\nEdited by: Jenipher Camino Gonzalez, Wesley Dockery, Zac Crellin\nCorrection: An earlier version of this article incorrectly stated that the pope underwent surgery for seven hours. The duration of his surgey was actually three hours.\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "nodule", "definition": "腫瘍や病変の小さな塊のこと。医学用語として、肺や他の臓器に見られる小さな異常な組織を指す。"}, {"word": "adenocarcinoma", "definition": "腺がんの一種で、腺細胞から発生する悪性腫瘍。肺がんの中でも最も一般的な形態である。"}, {"word": "prognosis", "definition": "医学用語で、病気の今後の経過や治療後の見通しのこと。患者の回復可能性や予後を医学的に予測することを意味する。"}, {"word": "transparency", "definition": "明確さや透明性を意味し、情報公開の程度や隠さずに事実を伝える姿勢を指す。"}, {"word": "pontiff", "definition": "教皇やローマ法王を指す正式な宗教用語。カトリック教会の最高指導者を敬意を込めて呼ぶ表現である。"}]}, {"title_ja": "Pope Leo diagnosed with lung cancer, Vatican says", "title_en": "Pope Leo diagnosed with lung cancer, Vatican says", "summary_ja": "Pope Leo XIV was diagnosed with lung cancer and had the lower lobe of his right lung removed during surgery on Tuesday, the Vatican said.", "summary_en": "Pope Leo XIV was diagnosed with lung cancer and had the lower lobe of his right lung removed during surgery on Tuesday, the Vatican said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/pope-leo-departs-vatican-ahead-operation-remove-nodule/story?id=137216472", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Woman accused of stabbing husband and son to death at family resort: Complaint", "title_en": "Woman accused of stabbing husband and son to death at family resort: Complaint", "summary_ja": "Authorities responded to a room at the Great Wolf Lodge in Scotrun, Pocono Township, on Monday for a suicidal caller, according to the complaint.", "summary_en": "Authorities responded to a room at the Great Wolf Lodge in Scotrun, Pocono Township, on Monday for a suicidal caller, according to the complaint.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/woman-accused-stabbing-husband-3-year-son-death/story?id=137239427", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "title_en": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "summary_ja": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "summary_en": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/society/2026/oct/09/vaccine-trial-guinea-bissau-rfk-jr", "state_media": false, "category": "政治", "full_text": "A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week.\nIt is a central part of the vaccine vision for Robert F Kennedy Jr, the secretary of the US Department of Health and Human Services (HHS) and a longtime vaccine opponent.\nAt an anti-vaccine conference last month, Kennedy praised the Danish researchers behind the trial and touted US-supported research on hepatitis B in newborns as exemplifying the Trump administration’s agenda for vaccines, which has included slashing vaccine recommendations and casting doubt on the safety and effectiveness of shots.\nKennedy “wants to make it so we don’t use a birth dose here in this country,” said Paul Offit, an infectious disease physician at Children’s Hospital of Philadelphia. “That’s the goal.”\nKennedy would never be able to do the trial in the US because of its significant ethical concerns, Offit added. “He’s taking advantage of a developing country … Is it because children in Africa are more expendable than children here?”\nDanish researchers plan to enroll 14,000 infants in Guinea-Bissau in the trial, giving the hepatitis B vaccine to half of the babies at birth and withholding it from the others for the first six weeks of life.\nAn ethics committee at the researchers’ home institution of the University of Southern Denmark voted this week to proceed with the trial, and officials in Guinea-Bissau have also greenlit the project, which the health minister, Quinhin Nantote, initially said was suspended after international uproar earlier this year.\nStig Børsen Hansen, a founding member who was one of two reviewers who presented the study to the Danish committee, resigned from the group in protest on Friday, citing major ethical issues with the study.\n“You are now enrolling newborns in a lottery to test a hypothesis,” Hansen said. The children who are randomly selected not to receive the birth dose of the vaccine, those who “lost the lottery”, face in their earliest days the risk of contracting hepatitis B, which can cause irreversible lifelong damage. “They contract hepatitis B in the context of being part of a research project,” Hansen said, which made their infection happen, in effect, “by design”.\nThree other members of the committee have also resigned in protest.\nThe US Centers for Disease Control and Prevention (CDC) has reportedly set aside $1.6m in this year’s budget for the project, and it will be matched with private funding from the Pershing Square Foundation, which was co-founded by the billionaire activist Bill Ackman, and the Bluebell Foundation.\nThe CDC, the Danish researchers, Pershing Square and Nantote have not responded to the Guardian’s questions about this trial.\nThe news that the trial was approved by the Denmark ethics committee was first reported by Rolling Stone. This is the first time details of the updated protocol have been disclosed.\nThe Guinea-Bissau study protocol has changed since it was posted in January, according to details shared with the Guardian. The researchers will now test mothers for hepatitis B before they give birth. The babies of mothers who test positive will be given the vaccine and will not be included in the trial. But the babies of mothers whose tests are negative may be enrolled. The new protocol has not been shared publicly.\nIn previous research, half of children who contracted hepatitis B did so after birth, through community exposures. “This virus can be transmitted casually,” Offit said. It can live on surfaces for up to seven days, and it can be acquired by sharing washcloths, toothbrushes and fingernail clippers. In addition, the hepatitis B test has a 5% false negative rate, which could provide false assurance that a birthing parent does not have the virus.\nDecades of research make it clear that the vaccine would be beneficial, which means it would be unfair to place some children in the vaccinated group and some children in the unvaccinated group, said Henrik Støvring, a professor of statistics and pharmacometrics at Aarhus University in Denmark.\nAccording to the Helsinki declaration, international medical research must be approved by ethics committees in both the host and sponsor countries.\nThe Danish research ethics committee at the University of Southern Denmark had never considered medical studies before, but it changed the rules in order to vote on this one. While committee members with expertise argued against approving it, the majority ruled to move forward.\n“It’s very unusual to bring this into a committee like that,” Støvring said. The national ethics committee in Denmark oversees medical research, but this study was outside of their purview because it won’t take place in Denmark.\nYet “I don’t see why you couldn’t do it in Denmark,” Støvring said of the trial. In fact, several conditions make it a better location. The hepatitis B vaccine is not usually given to newborns in Denmark unless the mother is positive for th", "translation_ja": "", "vocab": [{"word": "withhold", "definition": "意図的に与えない、差し控える。ここでは予防接種を与えないことを意味し、医学倫理の観点から問題となっている。"}, {"word": "touted", "definition": "大げさに宣伝する、賞賛する。ケネディが研究を公に称賛したことを示している。"}, {"word": "expendable", "definition": "使い捨てにできる、不必要な。ここでは倫理的に問題のある人種差別的な含意で使用されている。"}, {"word": "greenlit", "definition": "正式に承認を与える、ゴーサインを出す。プロジェクト進行の正式な許可を意味する。"}, {"word": "irreversible", "definition": "戻せない、取り返しのつかない。肝炎Bが生涯にわたって治らない損害を与える可能性があることを強調している。"}]}, {"title_ja": "ICJ judge Navi Pillay wins Nobel peace prize for promoting international law", "title_en": "ICJ judge Navi Pillay wins Nobel peace prize for promoting international law", "summary_ja": "Committee recognises work of South African who chaired UN commission that concluded Israel was guilty of genocide in Gaza The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide i", "summary_en": "Committee recognises work of South African who chaired UN commission that concluded Israel was guilty of genocide in Gaza The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide i", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/09/navanethem-navi-pillay-wins-nobel-peace-prize", "state_media": false, "category": "政治", "full_text": "The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide in Gaza.\nThe Norwegian Nobel committee said Pillay, who is serving as a judge at the international court of justice (ICJ), has “shown that legal measures can help prevent acts of war and violence”.\n“Navi Pillay’s commitment to universal legal principles and her firm moral compass are constants in a long career,” the committee said, mentioning her early work defending Nelson Mandela under South Africa’s apartheid regime, serving on the international criminal tribunal, and then as the UN high commissioner for human rights, as well as chairing the UN independent international commission of inquiry on the occupied Palestinian territory.\nThat commission concluded last year that the state of Israel was guilty of genocidal acts in Gaza “with the specific intent to destroy Palestinians in Gaza”, and said the country’s prime minister, Benjamin Netanyahu, its president, Isaac Herzog, and its former defence minister Yoav Gallant had “incited the commission of genocide”.\n“It is clear that there is an intent to destroy the Palestinians in Gaza through acts that meet the criteria set forth in the genocide convention,” Pillay said on the publication of the commission’s findings in September last year.\nIsrael refused to cooperate with the commission, arguing it was biased, and rejected its report as “scandalous”. The Israeli foreign ministry reacted furiously to news of Pillay’s award on Friday.\n“If there were an award for lies, hatred, and blood libels, Navi Pillay wouldn’t just be a contender. She’d be a frontrunner,” the ministry said on X, adding: “Awarding Pillay the Nobel Peace Prize isn’t a recognition of justice. It’s the grotesque weaponization of an award to legitimize anti-Israel hatred and prejudice.\n“Now that the Nobel commission has rewarded the biggest lie of the 21st century, Joseph Goebbels is certainly applauding from hell.”\nIn its statement, the Nobel committee said Pillay, 85, had “contributed to strengthen the institutions of international law”.\n“Her independence, expertise and steadfastness have made her one of the most respected international jurists of our time,” the committee said.\n“In awarding this year’s Nobel peace prize, the Norwegian Nobel committee wants to remind the world that the rule of law – national and international – underpins the system we have set up to ensure peace and resolve conflicts non-violently,” its statement said.\nThe committee said it had not been able to locate Pillay before its announcement on Friday morning. She was attending a meeting of human rights lawyers and jurists in Nuremberg, Germany, at the site of postwar war crimes trials of Nazi leaders, and heard the news from colleagues. She responded with disbelief.\n“I don’t know about it so much. The question is: is it true? Being a lawyer and a judge, I still want to verify it,” she said.\n“The last thing I did was the report on Gaza naming what’s happening there as genocide,” Pillay added. “One of the main reactions to that report was people [complimented] me for my courage. You can imagine how surprised I was. Why would you need courage to speak the truth. You interpret the law. You look at all the facts, so it’s an impartial decision.”\nPillay is currently overseeing a genocide case against Myanmar at the ICJ.\nThe ICJ, a UN body, rules on disputes between states, while the international criminal court (ICC) investigates and prosecutes individuals accused of atrocities and other grave international crimes.\nHours after the announcement, the Trump administration unveiled broad new sanctions against the ICC, on which Pillay also once served. The US secretary of state, Marco Rubio, said the measures were to ensure the court would never prosecute Americans.\nThe ICC has not charged any US nationals, and has previously pointed out that it is a court of last resort, unnecessary in the case of countries with effective legal systems. Last year, Donald Trump, who has long coveted the Nobel peace prize, imposed personal sanctions against ICC officials deemed to be involved in investigations of Americans or Israelis. The new sanctions target the court as an institution, blocking any ICC assets in the US and giving US companies and individuals six months to wind down any business with the court.\nThe ICC said the sanctions were “an attempt to obstruct the course of justice and to prevent the court from doing what it was created to do”.\n“It is an assault on the rule of law and on the very foundations of the international legal order which strikes at the simple principle that no one stands above the law,” the court said in a statement.\nPillay’s award was welcomed by human rights activists and hailed in South Africa, home to four previous laureates. The country’s president, Cyril Ramaphosa, said: “Justice Pillay’s crowning as winner of the Nobel prize allows us t", "translation_ja": "", "vocab": [{"word": "genocide", "definition": "特定の民族や宗教集団を意図的に全滅させようとする大量殺害行為。国際法で最も重大な犯罪とされています。"}, {"word": "apartheid", "definition": "かつての南アフリカで実施された人種差別制度。法律により人種に基づいた分離と差別を行った政策を指します。"}, {"word": "tribunal", "definition": "特定の事件や紛争を扱うために設立された特別裁判所または法廷。通常、国際的な戦争犯罪や人権侵害を審理します。"}, {"word": "weaponization", "definition": "本来の目的とは異なる方法で何かを武器として利用すること。ここでは、賞を政治的な目的のために悪用することを意味します。"}, {"word": "steadfastness", "definition": "困難な状況でも信念や決意を変えない堅固さ。一貫性と不動の決心を示す特性です。"}]}, {"title_ja": "Isaias strengthens to become first Atlantic hurricane of 2026 season", "title_en": "Isaias strengthens to become first Atlantic hurricane of 2026 season", "summary_ja": "Storm expected to make landfall on US’s northern Gulf coast with risk of flash floods and isolated river flooding Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it", "summary_en": "Storm expected to make landfall on US’s northern Gulf coast with risk of flash floods and isolated river flooding Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/oct/09/isaias-strengthens-first-atlantic-hurricane-2026", "state_media": false, "category": "社会", "full_text": "Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it approaches the US’s northern Gulf coast on Friday, according to the National Oceanic and Atmospheric Administration (NOAA).\nAs a result of the strong El Niño, it has been a notably quiet Atlantic hurricane season. The first hurricane of the season has not formed this late since 8 October 1905, which pre-dates the satellite era (1960s) for tracking hurricanes that has allowed for more non-landfall hurricanes to be discovered.\nIsaias is expected to make landfall on Friday evening local time, bringing an estimated 75-150mm (2.9-5.9in) of rainfall across the Gulf coast. There may be up to 250mm in places, with a possibility of flash flooding and isolated river flooding.\nThe NOAA also said there was increasing likelihood of life-threatening storm surge along portions of the northern Gulf coast and damaging hurricane-force winds over portions of the Florida panhandle, southern Alabama and Mississippi. A hurricane warning has been issued and people have been told to prepare for long power outages and to obey any evacuation orders issued.\nIn Zimbabwe, a state of disaster was declared in the south-east Masvingo province on Tuesday after a severe hailstorm caused widespread damage to homes and critical infrastructure.\nPreliminary assessments found the roofs had been torn off 8,500 homes. A further 15,300 people reported shattered windows, leaving many exposed to the elements as the rainy season begins.\nThe country’s power infrastructure was badly affected, disrupting drainage and sewerage systems, raising concerns about public health.\nIn Australia, a rare tornado hit the town of Ulladulla, about 140 miles (230km) south of Sydney, on 3 October. Tornadoes are relatively rare in Australia, where there are about 50 each year. This Ulladulla tornado damaged properties and felled trees.", "translation_ja": "", "vocab": [{"word": "landfall", "definition": "台風やハリケーンが陸地に上陸すること。気象学において、熱帯低気圧が海から陸地に到達する現象を指す。"}, {"word": "surge", "definition": "急激な上昇や高まり。ここでは嵐による海面の異常上昇を意味し、沿岸地域に危険をもたらす。"}, {"word": "preliminary", "definition": "最初の段階の、暫定的な。正式な調査や分析の前に行われる初期段階の評価を表す。"}, {"word": "infrastructure", "definition": "基盤施設、社会基盤。電力網や水道、道路などの公共施設全般を指す。"}, {"word": "disrupting", "definition": "機能や秩序を中断・阻害すること。通常のサービスや運営を妨げる状態を表す。"}]}, {"title_ja": "Ex-gang leader gets 40 years to life for rapper Tupac Shakur’s 1996 murder", "title_en": "Ex-gang leader gets 40 years to life for rapper Tupac Shakur’s 1996 murder", "summary_ja": "A 30-year hunt for justice ends with the sentencing of Duane &#039;Keffe D&#039; Davis, who has written about Shakur&#039;s shooting.", "summary_en": "A 30-year hunt for justice ends with the sentencing of Duane &#039;Keffe D&#039; Davis, who has written about Shakur&#039;s shooting.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/13/ex-gang-leader-gets-40-years-to-life-for-rapper-tupac-shakurs-1996-murder?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Ex-gang leader gets 40 years to life for rapper Tupac Shakur’s 1996 murder\nA 30-year hunt for justice ends with the sentencing of Duane ‘Keffe D’ Davis, who has written about his role in Shakur’s shooting death.\nA former gang leader accused of masterminding the 1996 drive-by shooting of hip-hop star Tupac Shakur has been sentenced to 40 years to life in prison.\nTuesday’s sentencing capped a 30-year-long cold case that rattled the golden era of rap music in the United States.\nIn August, Duane “Keffe D” Davis, a former leader of the South Side Compton Crips, had been found guilty of first-degree murder with the use of a deadly weapon.\nDavis, 63, is the sole person charged in the death of Shakur, who died at the peak of his fame at age 25.\nJudge Carli Kierny announced Davis’s sentence at a hearing in Las Vegas, Nevada, where she chided him for the murder.\n“You don’t get to take a man from his family, you don’t get to take his very life, his whole future from him and just walk away from it, especially when that man is Tupac Shakur,” Kierny said. “The world never forgot about him and his death, and neither did Las Vegas.”\nDuring the hearing, prosecutor Marc DiGiacomo said that whatever sentence the court imposes, Davis is “guaranteed to die” behind bars.\nFor nearly three decades, Shakur’s death remained one of the music industry’s most notorious unsolved mysteries, prompting endless debate over who did it and why.\nDavis had long been a suspect, but investigators lacked evidence to pursue an indictment.\nThe investigative deadlock shattered after Davis publicly boasted about his involvement in media interviews. He also recounted his role in the murder in his 2019 memoir, Compton Street Legend.\nPreviously, Davis entered into a 2008 proffer agreement with federal law enforcement officers, granting him limited immunity for statements he made privately to investigators.\nBut by repeating his statements outside his meetings with investigators, prosecutors said Davis had effectively voided the agreement’s protections.\nDiGiacomo said that Davis was trying to profit from a killing that he committed, and for that, he deserves the maximum possible sentence.\nShakur had been in Las Vegas for a Mike Tyson heavyweight fight on the night of September 7, 1996, when he was shot.\nInvestigators said the shooting took place roughly two hours after a confrontation between Davis’s nephew, Orlando Anderson, and Shakur’s entourage.\nIn his memoir, Davis accused Shakur and his friends of assaulting his nephew. He explained he then sought to retaliate, and he admitted to handing the murder weapon to two alleged accomplices, seated in the backseat of a white Cadillac, who then fired the fatal shots.\nShakur had been in the passenger seat of a black BMW, stopped at a red light, when his vehicle came under fire. He died six days later.\nDavis is the only person who was in the Cadillac that evening who is still alive.\nMembers of Shakur’s family spoke at the sentencing, including his siblings Maurice “Mopreme” Shakur and Sekyiwa “Set” Shakur.\n“This man’s life mattered,” Sekyiwa Shakur told the court, while her brother called the murder “devastating, heartbreaking and sad”.\nFollowing the verdict, Chief Deputy District Attorney Binu Palal described the Shakur family as having to endure years of Davis “bragging about killing someone they loved”.\n“They loved that man. And the arrogance that Mr Davis had in expressing his joy in killing that man ultimately was his undoing,” Palal said.\nThe ex-gang leader briefly addressed the court on Tuesday, asking the judge to order the return of property seized from his residence, including personal photographs.\nWhen the judge asked if he wished to make any additional statements, Davis declined, stating, “No, I’m good.” He added that he would “appeal this case for sure”.", "translation_ja": "", "vocab": [{"word": "mastermind", "definition": "計画や陰謀の首謀者となる、または中心人物。ここでは銃撃事件を企画・指揮した人物を指す。"}, {"word": "proffer agreement", "definition": "司法取引の一種で、容疑者が検察官に情報を提供する代わりに、その情報が自分の不利益にならないよう保護される合意。"}, {"word": "voided", "definition": "無効にする、効力を失わせる。法的効力や契約の効力がなくなった状態を表す。"}, {"word": "entourage", "definition": "著名人を付き添う随行団や側近グループ。タパックの周囲の友人や護衛チームを指す。"}, {"word": "notorious", "definition": "悪い意味で有名である、悪名高い。Shakurの死は音楽業界で悪名高い未解決事件だった。"}]}, {"title_ja": "Manchester United’s Martinez blasts board’s lack of investment", "title_en": "Manchester United’s Martinez blasts board’s lack of investment", "summary_ja": "Manchester United beaten 2-0 at Atletico Madrid, but defender Lisandro Martinez slams club&#039;s failure to invest in team.", "summary_en": "Manchester United beaten 2-0 at Atletico Madrid, but defender Lisandro Martinez slams club&#039;s failure to invest in team.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/10/13/manchester-uniteds-martinez-blasts-boards-lack-of-investment?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Manchester United’s Martinez blasts board’s lack of investment\nManchester United beaten 2-0 at Atletico Madrid, but defender Lisandro Martinez slams club’s failure to invest in team.\nManchester United defender Lisandro Martinez blasted the club’s board for a perceived lack of investment this summer, after the team were beaten by Atletico Madrid in the Champions League on Tuesday.\nUnited are winless in five games across all competitions after the 2-0 defeat in the Spanish capital and have made their worst start to a league season in 40 years.\n“Really poor,” Martinez told Amazon Prime when asked about the team’s performance against Atletico.\n“I have to control myself a lot but sometimes is a reflection… [or] mirror of how our club is at the moment.”\nMartinez said he “100 percent” expected more investment in the squad over the summer after United finished third in the Premier League last season and returned to Europe’s top competition.\n“I expect more from our technical director [Jason Wilcox], I have to be honest, as players we have to do more, but it is also important when you make a strong squad to be ready for these kind of nights,” he continued.\nMartinez said last season the club had “created the base to create an amazing team”, but they did not follow through.\nPressure is mounting on coach Michael Carrick after five games without a win, but Martinez suggested sacking the Englishman was not the way forward.\n“You can’t keep changing, changing, changing the manager. What about other areas? I can’t say more,” said Martinez.\n“Tonight it is easy to say the coach [is to blame], easy to say the players, but also we have to see other areas.”\nRed Devils minority owner Jim Ratcliffe was at the stadium to watch the league-phase defeat by last season’s semi-finalists.\nMan United spent around 140 million pounds ($185m) this summer on midfielders Carlos Baleba, Youri Tielemans and Andrey Santos, but fans were upset the club did not reinforce other positions, including left-back and striker.\nSpeaking to reporters after the game, Carrick said he had not heard Martinez’s comments and so could not judge them.\n“I think it’s a little bit on the emotions of the game as well, of coming here and being disappointed not to get something from the game,” said the coach.\nFormer Manchester United and England striker Wayne Rooney said Martinez’s criticism was excessive.\n“I think he’s maybe gone a bit too far, and that should have stayed internal,” Rooney told Amazon Prime.\n“You can clearly see that he cares and he wants the club to invest more money in more players, and to do that he’s probably one of the players who’ll be out the door if I’m being honest.”", "translation_ja": "", "vocab": [{"word": "blasted", "definition": "厳しく批判する。強い感情を込めて非難すること。ビジネスシーンで上司や組織に対する明確な不満の表現に使われる。"}, {"word": "perceived", "definition": "認識された、と受け止められた。客観的な事実ではなく、個人の見方や解釈を示す。経営判断や戦略批判の文脈でよく用いられる。"}, {"word": "reinforcement", "definition": "補強、強化。特定の領域や機能を補うために追加の資源や人材を投入すること。"}, {"word": "minority owner", "definition": "少数株主。企業の一部の株式を保有する人物で、経営に限定的な影響力を持つ。"}, {"word": "excessive", "definition": "過度な、度を超した。適切な範囲を大きく超えている状態を指す。批判や反応が妥当でないことを示唆する。"}]}, {"title_ja": "Bayern’s Michael Olise sent off for ‘super dumb’ yellows within seconds", "title_en": "Bayern’s Michael Olise sent off for ‘super dumb’ yellows within seconds", "summary_ja": "Bayern Munich draw 3-3 with Viking in UEFA Champions League, but Michael Olise sees red for two bookings within seconds.", "summary_en": "Bayern Munich draw 3-3 with Viking in UEFA Champions League, but Michael Olise sees red for two bookings within seconds.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/10/13/bayerns-michael-olise-sent-off-for-super-dumb-yellows-within-seconds?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Bayern’s Michael Olise sent off for ‘super dumb’ yellows within seconds\nBayern Munich draw 3-3 with Viking in UEFA Champions League, but Michael Olise sees red for two bookings within seconds.\nBayern Munich were held 3-3 at Viking in the Champions League on Tuesday with the Norwegian champions equalising late through Herman Haugen after Michael Olise was sent off.\nBayern trailed 2-0 at halftime thanks to goals from Gianni Stensness and Peter Christiansen.\nHarry Kane seemed to have dragged Bayern to victory as he scored twice and set up another for a 3-2 lead, but Olise saw a second yellow inside a minute for dissent after throwing the ball at an opponent’s face.\nViking made the most of their advantage with Haugen scoring in the final minute to snatch the Norwegian champions a shock draw against the German giants.\nOlise’s red means he will miss next week’s blockbuster clash with English champions Arsenal in Munich.\n“It was our own fault,” Kompany told reporters, adding “this red card was super dumb … You can see in (Michael’s) eyes that he’s sorry about it and that he regrets letting the team down.”\nKane scored for the ninth straight Champions League match, equalling a club record set by Robert Lewandowski and drawing two behind the record of 11 set by Cristiano Ronaldo.\n“It was a poor first half from us. We started the second half well and fought our way back. But the red card changed everything,” Kane said on Amazon Prime.\n“[Olise] will be gutted and he has to take responsibility for it. It was a mistake, and mistakes happen. He has to learn from it. It’s a shame because we have important games ahead of us.”\nJust days after conceding the fastest goal in Bundesliga history in Saturday’s 2-2 draw at Augsburg, Bayern were again behind early.\nWith just 72 seconds gone, Stensness headed in an outswinging corner to give the hosts a shock lead.\nBayern ramped up the pressure but could not break through, with Kane twice heading into the waiting arms of Viking goalie Arild Ostbo.\nNot content to absorb Bayern pressure and cling to a narrow lead, Viking launched a lightning-fast counter-attack and doubled their advantage after 38 minutes.\nTop goalscorer Christiansen finished off a slick move to give Viking a 2-0 lead.\nBayern were handed a lifeline when Konrad Laimer was felled in the box just after the break, bringing Kane to the spot.\nAfter a stuttering run up, the 33-year-old guided the ball into the bottom right of the goal, past the fingertips of Ostbo.\nOn the hour, Kane shed his marker and headed in a Joshua Kimmich cross to level the scores.\nDiaz had an effort ruled out for offside just a minute later but the Colombian was the beneficiary of a brilliant Kane chip 10 minutes on.\nKane lofted a ball to Laimer, whose saved shot rebounded cleanly into Diaz’s path.\nThe England captain appeared to have saved Bayern, until Olise was sent from the pitch.\nThe France winger saw yellow for a foul and then picked up another when he threw the ball directly at Viking captain Zlatko Tripic’s face right in front of the referee, leaving Bayern a man down with 16 minutes left.\nViking pushed and Haugen headed in at the far post in the 90th minute to snatch the hosts a memorable draw.", "translation_ja": "", "vocab": [{"word": "dissent", "definition": "上司や権威者の決定に対する公然とした反対や不同意。ここではオリセが審判の判定に対して不服を示した行為を指す。"}, {"word": "blockbuster", "definition": "大ヒット作品、または大規模で注目度の高いイベントのこと。ここでは注目度の高い重要な試合を意味する。"}, {"word": "equalling", "definition": "同じレベルや記録に達すること。ここではケインがルバンドフスキーと同じ記録に並んだことを示す。"}, {"word": "gutted", "definition": "非常に失望した、がっかりした状態。イギリス英語で感情的なショックや悔しさを表現する際に使用される。"}, {"word": "slick", "definition": "滑らかで効率的な、洗練された動きや技術。ここではバイキングの素早く連携の取れた攻撃を表現している。"}]}, {"title_ja": "Ex-gang leader sentenced to 40 years to life in prison for Tupac Shakur murder", "title_en": "Ex-gang leader sentenced to 40 years to life in prison for Tupac Shakur murder", "summary_ja": "Duane 'Keffe D' Davis convicted of leading drive-by shooting; killing stemmed from hostilities between two LA street gangs", "summary_en": "Duane 'Keffe D' Davis convicted of leading drive-by shooting; killing stemmed from hostilities between two LA street gangs", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/ex-gang-leader-sentenced-to-40-years-to-life-in-prison-for-tupac-shakur-murder/article71581327.ece", "state_media": false, "category": "社会", "full_text": "A former gang leader was sentenced to 40 years to life in prison on Tuesday (October 13, 2026) for orchestrating the 1996 drive-by shooting death of hip-hop star Tupac Shakur in Las Vegas, capping the prosecution of a long-unsolved murder that shaped the golden age of rap music.\nDuane “Keffe D” Davis, 63, found guilty of first-degree murder in August, received the sentence during a hearing in a Las Vegas courtroom.\nIn tearful testimony before Judge Carli Kierny, Shakur’s younger sister Sekyiwa Shakur said their mother had raised him to be a human rights activist and treated him as if he had the potential to change the world.\n“He believed her,” said Sekyiwa Shakur, wearing a black shirt. “He went out in the world to do that. And I believe he would have done it.”\nUntil Davis’ 2023 arrest, the killing of Shakur, shot dead in the passenger seat of an SUV driven by his record executive, Marion “Suge” Knight, had stood for nearly three decades as one of America’s most notorious cold cases.\nThe murder, which silenced one of rap’s most commercially successful and influential artists, heightened the image of violence permeating 1990s hip-hop culture while stoking the infamous East Coast-West Coast “gangsta” rap feud of the era.\nDespite Davis’ conviction, the question of who pulled the trigger in the fatal shooting of the 25-year-old rap legend has never been conclusively decided.\nDavis was tried and convicted for masterminding the murder to avenge the beating of his nephew by Shakur and members of the rapper’s entourage inside the MGM Grand casino on the Las Vegas Strip on September 7, 1996.\nDavis has said he would appeal his conviction.\n‘The world never forgot’\nAuthorities said they long believed Davis was involved in Shakur’s killing but lacked sufficient evidence to charge him.\nThat changed when he went public with his story in media appearances and a memoir that, along with tapes of his secret meetings with investigators, formed the bulk of the prosecution’s murder case.\nIn his book, “Compton Street Legend,” Davis himself wrote that he was considered a suspect in the murders of both Shakur and Christopher Wallace, a rival rapper.\nAddressing Davis on Tuesday, Kierny said his assertions that he had changed since the 1990s fell short.\n“You don’t get to take a man from his family,” Kierny said, referring to Shakur. “The world never forgot about him.”\nFatal shooting sparked by casino brawl\nThe clash at the casino stemmed from hostility between two Los Angeles-area street gangs — the South Side Compton Crips, of which Davis was the self-described leader, and Mob Piru, which was associated with Shakur, Knight, and their music label, Death Row Records.\nMembers of both groups were in Las Vegas to see a world heavyweight title boxing match that night between Mike Tyson and Bruce Seldon.\nWithin hours of the casino brawl, Davis ushered his nephew and two other associates into a white Cadillac and went looking for Shakur and Knight, determined to settle scores, according to an account Davis later gave police in an unrelated investigation and that prosecutors cited during his murder trial.\nDavis said he passed a gun to the two men seated behind him in the Cadillac, one of whom opened fire through the window when they caught up with, and pulled alongside of, Knight and Shakur’s vehicle in traffic.\nShakur was struck four times and died in a hospital six days later. Knight, who suffered a minor injury from a bullet fragment that grazed his head, is now serving a 28-year prison term on an unrelated voluntary manslaughter conviction.\nWhile Davis was never accused of actually firing the shots that killed Shakur - Nevada law allows someone to be charged with murder as a participant in the crime - prosecutors have never named a suspected gunman.\nAll three other men in the Cadillac with Davis that night have since died.\nPublished - October 14, 2026 05:00 am IST", "translation_ja": "", "vocab": [{"word": "orchestrating", "definition": "計画し実行すること。複雑な出来事や犯罪などを周到に企てて実行することを意味します。"}, {"word": "capping", "definition": "～の最後を飾ること、締めくくること。一連の出来事や過程の終わりを表します。"}, {"word": "permeating", "definition": "広く行き渡る、浸透する。ある状態や性質が全体に広がることを表します。"}, {"word": "conclusively", "definition": "決定的に、確実に。疑問の余地がないほど明確に決定されることを意味します。"}, {"word": "entourage", "definition": "付き添い人たち、随行者。著名人に付き添う人々のグループを指します。"}]}, {"title_ja": "Zelenskyy to visit Britain as Burnham pledges fresh support for Ukraine", "title_en": "Zelenskyy to visit Britain as Burnham pledges fresh support for Ukraine", "summary_ja": "The meeting comes at a difficult time for the Ukrainian President, days after the U.S. made a deal with Russia for diesel exports and U.S. President ‌Donald Trump said Mr. Zelenskyy should be replaced as ‌Ukraine’s leader", "summary_en": "The meeting comes at a difficult time for the Ukrainian President, days after the U.S. made a deal with Russia for diesel exports and U.S. President ‌Donald Trump said Mr. Zelenskyy should be replaced as ‌Ukraine’s leader", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/zelenskyy-to-visit-britain-as-burnham-pledges-fresh-support-for-ukraine/article71581319.ece", "state_media": false, "category": "政治", "full_text": "Ukrainian President Volodymyr Zelenskyy will meet British Prime Minister Andy Burnham in London on Wednesday (October 14, 2026) as Britain looks to reaffirm its support for Ukraine, including with the promise of a new package of surface-to-air missiles.\nThe meeting comes at a difficult time for Mr. Zelenskyy. U.S. President Donald Trump said at the weekend he should be replaced as Ukraine’s leader, days after cutting a deal with Moscow to lift sanctions on Russian diesel exports.\nBritain has said it does not support the U.S.-Russia diesel deal, and called for allies to keep up the economic pressure on Moscow.\n“My message to the Ukrainian people could not be clearer, we are with you for as long as it takes, and we will go further and faster in our support to back your courageous fight for peace in Europe,” Mr. Burnham said in a statement before the meeting.\nMr. Burnham said backing for Ukraine was vital to keeping people in Britain safe and pledged further military support.\nHe announced the planned delivery of £45 million ($59.60 million) of surface-to-air missiles used to target jet-powered Russian drones, with £10 million of that package fast-tracked to meet an urgent need in Ukraine.\nMr. Burnham has asked officials to draw up further sanctions, military aid, and fiscal support, and his foreign and finance ministers have been lobbying allies to follow Britain in banning maritime services that support Russian liquefied natural gas exports.\nPublished - October 14, 2026 04:01 am IST", "translation_ja": "", "vocab": [{"word": "reaffirm", "definition": "既に表明した立場や約束を再度確認・強調すること。政治や外交の場面で、継続的な支援や方針の変わらないことを明確にする際に使用される。"}, {"word": "sanctions", "definition": "国際関係において、ある国の行為に対抗するために経済的・政治的圧力をかける措置。輸出入制限や資産凍結などが含まれる。"}, {"word": "pledged", "definition": "正式に約束・誓約する、という意味の過去形。特に政治家が重要な公約をする場合に用いられ、公式的で拘束力のある約束を示す。"}, {"word": "fiscal", "definition": "政府の財政や予算に関する。税制や支出といった金銭的政策の面に関連する用語で、経済政策の文脈で頻出。"}, {"word": "lobbying", "definition": "特定の目的達成のため、政治家や政府関係者に対して影響力を行使したり説得したりする活動。企業や団体が自分たちの利益を代弁してもらうよう働きかけること。"}]}, {"title_ja": "Pope Leo has lung cancer, lower lobe of right lung removed: Vatican", "title_en": "Pope Leo has lung cancer, lower lobe of right lung removed: Vatican", "summary_ja": "Pope Leo XIV underwent surgery to remove a lung nodule and the Vatican said the operation was completed “successfully, on schedule and as planned”", "summary_en": "Pope Leo XIV underwent surgery to remove a lung nodule and the Vatican said the operation was completed “successfully, on schedule and as planned”", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/pope-leo-has-lung-cancer-lower-lobe-of-right-lung-removed-vatican/article71581183.ece", "state_media": false, "category": "社会", "full_text": "Pope Leo XIV's surgery confirmed that he has lung cancer, and he had the lower lobe of his right lung removed, the Vatican said Tuesday (October 13, 2026).\nThe tests confirmed a diagnosis of lung adenocarcinoma, the Vatican said in a medical bulletin after the surgery. It said the diagnosis had been suspected by preoperative tests and was confirmed during surgery.\nThe 71-year-old was in the operating room for about 3 hours, the statement said. The surgery itself lasted approximately 90 minutes. “The surgery was successful, and there were no complications,” the statement said.\nLeo had walked into Rome's Gemelli Hospital through the main entrance earlier in the day and waved to dozens of well-wishers who had gathered to greet him. The Vatican said the surgery would be performed by a team led by Gemelli's chief thoracic surgeon, Dr. Stefano Margaritora.\nThe American pontiff has offered a rare level of transparency about the first publicly disclosed major health problem of his 17-month papacy. He revealed the discovery of the small, localised nodule during his Sunday noon prayer and announced that he would have it removed.\nThe Vatican on Monday cancelled all Leo's audiences through Oct 20.\nBut the decision to have the operation clearly came as a surprise: While Gemelli has a specific papal apartment that past popes have used, complete with a private chapel on the 10th floor, Leo will actually be staying in a nearby room since the papal apartment is currently undergoing renovations, according to the Vatican press office.\nPublished - October 14, 2026 02:33 am IST", "translation_ja": "", "vocab": [{"word": "adenocarcinoma", "definition": "悪性腫瘍の一種で、腺細胞に由来するがんの総称。医学的な診断名として使用される専門用語。"}, {"word": "preoperative", "definition": "手術前の、または手術に先立つという意味の医学用語。術前検査などの表現で用いられる。"}, {"word": "pontiff", "definition": "教皇またはローマ法王を意味する格式高い表現。宗教的権威を持つ指導者を指す。"}, {"word": "transparency", "definition": "透明性、明白性を意味し、情報公開や隠蔽のない状態を指す。組織や個人の信頼性を示す概念。"}, {"word": "localised", "definition": "限定された、局所的なという意味の医学用語。特定の場所に限られている状態を表す。"}]}, {"title_ja": "Opinion | Chrystia Freeland’s book spills the tea on her ‘Unreliable Boyfriend’ and Justin Trudeau does not come off well - Toronto Star", "title_en": "Opinion | Chrystia Freeland’s book spills the tea on her ‘Unreliable Boyfriend’ and Justin Trudeau does not come off well - Toronto Star", "summary_ja": "Opinion | Chrystia Freeland’s book spills the tea on her ‘Unreliable Boyfriend’ and Justin Trudeau does not come off well Toronto Star", "summary_en": "Opinion | Chrystia Freeland’s book spills the tea on her ‘Unreliable Boyfriend’ and Justin Trudeau does not come off well Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMirwJBVV95cUxPTnZfU3lBSzVMY2swTlkweVpHanRBZ256MVczQzhtc0xMYzU2c1BqMDFadHgyeTVadnhMQjBkWW02dGw4cW1tYjluS1czWnJ0YVl1TW9yMVJrOGg2VEpyeUZEYTNMUzBVX1hJY0tSTnN3bzlsX3J2bjRmeGhwWlA3MDBPN3RWYThlWE9nTFlNRUFJOTg1ZVJkSGhoOTBWeHZhcmJMN3hFTjVoTHNCYmxuc1laSU9wTXlmVkdaMmpXRzlNYzNxVlFwRlcwTnVrRUlFTENnSHRrU0RtUGtOaEhaaHNlV
