 and other essential medical products during health emergencies. The post UN General Assembly adopts pandemic declaration, urges stronger global co", "summary_en": "The declaration outlines measures to strengthen disease surveillance, improve national health systems and ensure equitable access to vaccines, treatments and other essential medical products during health emergencies. The post UN General Assembly adopts pandemic declaration, urges stronger global co", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/916941-un-general-assembly-adopts-pandemic-declaration-urges-stronger-global-cooperation.html", "state_media": false, "category": "社会", "full_text": "The United Nations General Assembly (UNGA) has adopted a political declaration on pandemic prevention, preparedness and response, reaffirming the need for stronger international cooperation and sustained investment to protect the world against future pandemics.\nThe declaration was adopted on Tuesday following a vote in which 153 countries voted in favour, three against and two abstentions, according to the voting record provided.\nThe United States, Israel and Argentina voted against the declaration, while New Zealand and Paraguay abstained.\nThe declaration outlines measures to strengthen disease surveillance, improve national health systems and ensure equitable access to vaccines, treatments and other essential medical products during health emergencies.\nIt also calls on countries to strengthen their preparedness and response capacities, particularly in addressing weaknesses exposed by the COVID-19 pandemic.\nWHO welcomes declaration\nThe World Health Organisation (WHO) welcomed the adoption, describing it as a renewed commitment by countries to work together to prevent and respond to future pandemics.\nWHO Director-General Tedros Ghebreyesus urged member states to translate their commitments into action, particularly by concluding negotiations on the Pathogen Access and Benefit-Sharing (PABS) system.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“WHO welcomes this strong commitment by UN Member States to continue working together on pandemic prevention, preparedness and response,” he said.\nMr Ghebreyesus said concluding negotiations on the PABS annex would be an important step towards opening the Pandemic Agreement for signature, followed by ratification and its eventual entry into force.\nThe declaration was considered by member states at the second UN General Assembly High-level Meeting on Pandemic Prevention, Preparedness and Response on 25 September 2026 before being referred to the full General Assembly for adoption.\nPriorities for pandemic preparedness\nThe declaration calls for sustained investment in national, regional and global capacities to prevent, detect and respond to emerging pandemic threats.\nIt also frames pandemic preparedness as a development, economic and security priority that requires coordinated action beyond the health sector.\nAmong its priorities are stronger disease surveillance and monitoring systems, improved national preparedness capacities and implementation of the amended International Health Regulations (2005).\nThe declaration further calls for greater community participation, equitable access to pathogens and benefit-sharing arrangements, expanded local and regional manufacturing capacity, increased investment in research and development, and sustainable financing for pandemic preparedness and response.\nThese measures are intended to help countries identify emerging threats earlier, respond more effectively to outbreaks and improve the availability of essential health products during emergencies.\nThe emphasis on equitable access also reflects concerns about disparities in the availability of vaccines, treatments and other medical countermeasures during global health emergencies.\nPandemic Agreement negotiations remain crucial\nThe declaration identifies the conclusion of negotiations on the PABS annex as an urgent priority for member states.\nThe outcome of the negotiations is expected to be considered at the next World Health Assembly in May 2027, or earlier through a special session.\nConcluding and adopting the annex would clear a key outstanding hurdle in the process towards the Pandemic Agreement’s entry into force.\nThe agreement is intended to strengthen international cooperation in preventing and responding to future pandemics, including through improved coordination and arrangements for sharing the benefits derived from access to pathogens.\nWHO said the declaration provides a framework for strengthening global health security through collective action, solidarity and equity.\nHowever, its impact will depend on countries translating their political commitments into practical action through adequate financing, stronger health systems and sustained cooperation at national, regional and international levels.\nREAD ALSO: Nigeria elected to UN Human Rights Council\nBackground\nThe COVID-19 pandemic exposed significant weaknesses in global health systems, including inadequate disease surveillance, limited emergency preparedness and unequal access to essential medical products.\nMany countries, particularly those with limited manufacturing capacity, experienced difficulties obtaining vaccines, diagnostic tools and treatments during the pandemic.\nThese challenges prompted renewed international efforts to strengthen health security and establish mechanisms for more coordinated responses to future outbreaks.\nThe WHO Pandemic Agreement was developed as part of these efforts, ", "translation_ja": "", "vocab": [{"word": "reaffirming", "definition": "前に述べたことをもう一度強調して確認すること。重要な約束や立場を改めて明確にする際に使用される。"}, {"word": "equitable", "definition": "公平で公正な配分や扱いを意味する。特に資源やアクセスの機会均等性を強調する正式な表現。"}, {"word": "abstentions", "definition": "投票において投票を棄権すること。賛成でも反対でもない立場を示す行為。"}, {"word": "ratification", "definition": "条約や協定を正式に批准すること。国家が国際合意に法的に拘束されることを承認する過程。"}, {"word": "coordinated", "definition": "複数の組織や部門が一致した目標に向けて協力すること。統合された計画的な行動を指す。"}]}, {"title_ja": "UCL Roundup: Lookman scores as Atletico beat Man United, Osimhen falls to Barca", "title_en": "UCL Roundup: Lookman scores as Atletico beat Man United, Osimhen falls to Barca", "summary_ja": "Lookman scored after coming off the bench to help Atlético Madrid beat Manchester United 2-0, while Victor Osimhen played the full match in Galatasaray’s 4-1 defeat to Barcelona. The post UCL Roundup: Lookman scores as Atletico beat Man United, Osimhen falls to Barca appeared first on Premium Times ", "summary_en": "Lookman scored after coming off the bench to help Atlético Madrid beat Manchester United 2-0, while Victor Osimhen played the full match in Galatasaray’s 4-1 defeat to Barcelona. The post UCL Roundup: Lookman scores as Atletico beat Man United, Osimhen falls to Barca appeared first on Premium Times ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/sports/football/916938-ucl-roundup-lookman-scores-as-atletico-beat-man-united-osimhen-falls-to-barca.html", "state_media": false, "category": "社会", "full_text": "Ademola Lookman scored nine minutes after coming off the bench as Atlético Madrid defeated Manchester United 2-0, while Victor Osimhen played the full 90 minutes in Galatasaray’s 4-1 home defeat to Barcelona in Tuesday’s UEFA Champions League action.\nLookman seals Atlético victory\nAtlético took the lead after just 53 seconds when Pablo Barrios converted Alex Baena’s cutback.\nManchester United threatened through Bryan Mbeumo, but goalkeeper Jan Oblak made key saves to keep the visitors out. Alejandro Grimaldo also came close for Atlético, striking the angle of the post and crossbar with a free-kick.\nJohnny Cardoso thought he had doubled Atlético’s lead, but his goal was ruled out after a VAR review found a handball by Marcos Llorente in the build-up.\nIntroduced in the 70th minute, Lookman struck in the 79th to seal the victory for Atlético, who claimed their first points of the league phase and extended their unbeaten run against United to five matches.\nBarcelona punish Galatasaray\nAt Rams Park, Galatasaray took a surprise lead in the 28th minute when Aleksey Batrakov’s shot deflected off João Cancelo and into the net.\nREAD ALSO: Olympic Qualifiers: Super Falcons thrash Comoros 5-0, set f Morocco showdown\nCancelo made amends by curling in Barcelona’s equaliser shortly before half-time. The visitors then took control, with Lamine Yamal providing two assists in four minutes as Barcelona completed a 4-1 comeback victory.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nOsimhen played the full match but couldn’t prevent Galatasaray from suffering a heavy home defeat. The result extended Barcelona’s winning run across all competitions to 10 matches.\nOther results\nArsenal beat Lille 3-0 with Bukayo Saka and Eberechi Eze on target for the Gunners. Sporting CP also defeated Lens 2-0 while Villarreal overcame Napoli 3-1.\nIn a mouthwatering seven-goal thriller, Club Brugge edged Inter 4-3, RB Leipzig beat PSV 1-0, and Sabah Baku defeated Slavia Prague 2-0.\nThere was plenty of drama and goals in Norway, where Bayern Munich were held to a 3-3 draw by Viking.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "deflected", "definition": "ボールや物体が別の物に当たって方向を変えることを意味する。スポーツ用語として、意図しない方向へ進むことを説明する際に使用される。"}, {"word": "amends", "definition": "過ちや失敗を補うために行動を起こすこと。「make amends」は特に「償う、補償する」という意味の慣用句として使われる。"}, {"word": "extended", "definition": "期間や記録を長く続けることを意味する。ここでは連勝記録や連続記録を伸ばすという文脈で使用されている。"}, {"word": "mouthwatering", "definition": "非常に魅力的で興味深いことを表現する形容詞。本来は食べ物がおいしそうに見える様子を指すが、ここではエキサイティングな試合を表現している。"}, {"word": "thriller", "definition": "スリルのある、ハラハラドキドキする試合や物語を指す。多くのゴールが入るなど、最後まで結果が不確定な試合に対して使われる。"}]}, {"title_ja": "Afrilition: Mental models, By Adéwálé Àjàdí", "title_en": "Afrilition: Mental models, By Adéwálé Àjàdí", "summary_ja": "The foundation of all systems is the mental model, and the work ahead of Africa that Afrilition raises will transform our future. Unfortunately, we in the African world function within the current global system in reaction to it and with wider acceptance of its current mental model. Based on history", "summary_en": "The foundation of all systems is the mental model, and the work ahead of Africa that Afrilition raises will transform our future. Unfortunately, we in the African world function within the current global system in reaction to it and with wider acceptance of its current mental model. Based on history", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/916935-afrilition-mental-models-by-adewale-ajadi.html", "state_media": false, "category": "社会", "full_text": "The foundation of all systems is the mental model, and the work ahead of Africa that Afrilition raises will transform our future. Unfortunately, we in the African world function within the current global system in reaction to it and with wider acceptance of its current mental model. Based on history and cemented into our formal socialisation that we call education, we are indoctrinated into different forms of inferiority. We accept a lot without critical review, but it is not just us; the wider world mostly also accepts that Westernisation is the surest and only route to modernisation. The depth of this mental model hides the Janus face of the system, which is White supremacist and based on the pseudoscience of race. It does not stand up to basic scrutiny by its own logical or empirical standards.\nI have not practised law for a while, but yesterday I had reason to go to the Supreme Court of Nigeria to honour a friend and son who was being elevated to a senior role. I sat in the Foyer for hours, enduring the ceremony and the pomposity of performance. Intelligent people prancing as caricatures in European wigs and dressed for pageantry in 19th-century faux fashion. There were horsehair wigs; the only missing thing was powdered faces. It exemplified the levels our elites are reduced to. On the other side, as speeches droned on for hours in their monotone, I fell asleep many times, hoping I did not snore. My eyes fixed on the Statue of Lady Justice on the wall. She brought a smile to my face, telling me hope is not lost. She stood black and dignified, resting on the wall, with what were Northern Nigerian features; she had her head wrap solid, holding the sword and scale with an elegant buba that just barely touched the scale.\nThe sword on the other side expressed the glamour of the abundance of her outfit. She seemed aware of the work that needed to be done to move even herself from an Africanised European symbol as she stood on the Latin words beneath her feet with disdain. At least Lady Justice no longer borrows her robe. There was the crowd of well-wishers, many in the unique cultural refinement of their various people. A wonderful sight: the variety and diversity of ethnic excellence expressed in headgear and outfits from across the variety of people who are Nigerians. If there is a country in which people carry culture with dignity, it is in Nigeria, along with the contradiction of colonial mentality.\nAfrilition is a pathway to the place of confidence in our creativity, and to get here we must be honest enough to confront ourselves on the depth of our indoctrination into the current system so that we can engage across the African world honestly and share understanding. Africa and its Diaspora are the most diverse breadth of humanity in the world. The persistent calls for unity betray a lack of acceptance of our complexity and expose our failings. We need a maturing to understand that our disagreements are the engine of our growth. In our many perspectives, it is critical to recognise the diverse pathologies we must address. From colonial mentality, white supremacy, colourism, and exploitative capitalism which are all diseases that are inevitable as a result of the systems we are all socialised into.\nThey are not the problems of or for the ignorant, malevolent, or poorly educated people but the sea of mental architecture in which we were raised and continue to live. Despite resistance and reactions, especially when we are woke, the system remains pernicious and prevalent; it is not overcome by our individual victories but adapts in ways to suck us back into other forms of reaction. Individually, we get sucked in especially because we are embedded in the system that has become our lifeblood. From our schooling, where languages are those of the coloniser and meanings are reduced to the dominant perspective. Our success is defined by material acquisition using borrowed language of class and its performance as hierarchy for marriage, residence, or even basic social interaction. We champion being black as a global identity, ignoring that it is a faux pigmentation reduction away from a beautiful and complex humanity that we are. We are dragged into false Diaspora wars where ethnicity and nationality are conflated for clicks, and identity is hastily constructed rather than differences being engaged with curiosity.\nAfrilition is about how we can admit these challenges with vulnerability and honesty. For us to move beyond indictment and judgement towards a holding space for many perspectives. Understanding that building a Black identity and imbuing it with power is survival in the US, but it is not exactly the same in Ghana or Kenya. Accepting that Xhosa, Zulu, Kikuyu, Hausa, Igbo, and Ndebele are not tribes but ethnic nationalities with systems based on mental models that still enforce withdrawals from emotional bank balances. Our world is a platform for our differences so we can disagree effectively and grow from ", "translation_ja": "", "vocab": [{"word": "indoctrinated", "definition": "特定の思想や信念を繰り返し教え込まれること。批判的思考なしに受け入れるよう条件付けされる状態を指す。"}, {"word": "pseudoscience", "definition": "科学的方法に基づかない、科学的根拠のない主張や理論。見かけ上は科学的だが実質を欠く知識体系。"}, {"word": "empirical", "definition": "実験や観察などの実証的な証拠に基づいている。理論ではなく実際のデータや経験に基づくことを意味する。"}, {"word": "pomposity", "definition": "過度に格式ばった、見せかけに満ちた態度や表現。虚栄心や自己重要性を強調する傾向を指す。"}, {"word": "dignitified", "definition": "尊厳があり、落ち着きと気品を備えた様子。身分や立場に相応しい気高さを保つ状態を表す。"}]}, {"title_ja": "A Father’s Mission Is to Show the World ‘What Russia Did to My Family’", "title_en": "A Father’s Mission Is to Show the World ‘What Russia Did to My Family’", "summary_ja": "After a glide bomb killed his wife and younger daughter, Yevhen Ovcharov was determined to prevent other Ukrainians from dying the same way.", "summary_en": "After a glide bomb killed his wife and younger daughter, Yevhen Ovcharov was determined to prevent other Ukrainians from dying the same way.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/13/world/europe/ukraine-war-soldier-sumy-family.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "The Oct. 7 Attack Changed Israel, but Not Its Politics", "title_en": "The Oct. 7 Attack Changed Israel, but Not Its Politics", "summary_ja": "As Israelis prepare to vote for the first time since the Hamas-led assault, they remain divided over whether to hold Prime Minister Benjamin Netanyahu responsible for negligence or fault the “treason” of his generals.", "summary_en": "As Israelis prepare to vote for the first time since the Hamas-led assault, they remain divided over whether to hold Prime Minister Benjamin Netanyahu responsible for negligence or fault the “treason” of his generals.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/202 tle_ja": "Russia to convene Arria-formula meeting on human rights violations in Ukraine on Oct. 14", "title_en": "Russia to convene Arria-formula meeting on human rights violations in Ukraine on Oct. 14", "summary_ja": "The format suggests the participation of all members of the UN Security Council", "summary_en": "The format suggests the participation of all members of the UN Security Council", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2201659", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Ukrainian army attacks DPR settlements eight times in 24 hours, wounding two people", "title_en": "Ukrainian army attacks DPR settlements eight times in 24 hours, wounding two people", "summary_ja": "Strikes damaged a truck and one civil infrastructure facility", "summary_en": "Strikes damaged a truck and one civil infrastructure facility", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2201657", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Over 30 planes bound for Moscow diverted to other cities", "title_en": "Over 30 planes bound for Moscow diverted to other cities", "summary_ja": "In particular, 19 aircraft bound for Vnukovo landed in Nizhny Novgorod, St. Petersburg, Minsk, Pskov, and Istanbul", "summary_en": "In particular, 19 aircraft bound for Vnukovo landed in Nizhny Novgorod, St. Petersburg, Minsk, Pskov, and Istanbul", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2201653", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "A Stronger Renminbi Is No Quick Fix for Global Imbalances", "title_en": "A Stronger Renminbi Is No Quick Fix for Global Imbalances", "summary_ja": "The near-consensus among financial commentators is that China's currency is undervalued, driving global imbalances. But the renminbi's weakness reflects weak domestic demand, and pursuing currency appreciation without addressing that issue head-on would be counterproductive for everyone.", "summary_en": "The near-consensus among financial commentators is that China's currency is undervalued, driving global imbalances. But the renminbi's weakness reflects weak domestic demand, and pursuing currency appreciation without addressing that issue head-on would be counterproductive for everyone.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/chinese-currency-weakness-symptom-not-cause-of-global-imbalances-by-kai-guo-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Stronger Renminbi Is No Quick Fix for Global Imbalances\nThe near-consensus among financial commentators is that China's currency is undervalued, driving global imbalances. But the renminbi's weakness reflects weak domestic demand, and pursuing currency appreciation without addressing that issue head-on would be counterproductive for everyone.\nBEIJING—The renminbi is back at the center of debates about global macroeconomic imbalances. With China’s merchandise trade surplus widening to $1.2 trillion in 2025, and with its manufacturing sector becoming increasingly dominant, the near-consensus among financial and economic commentators is that the renminbi is significantly undervalued. The implication is that China should let its currency appreciate sharply, thereby shrinking its surplus, easing competitive pressure on manufacturers elsewhere, and helping rebalance the global economy.", "translation_ja": "", "vocab": [{"word": "imbalances", "definition": "不均衡、バランスの崩れた状態。特に国際経済において、ある国の過度な黒字と他国の赤字の間の不均等な関係を指す。"}, {"word": "undervalued", "definition": "過小評価された、本来の価値より低く評価されている状態。通貨の場合、国際市場での交換レートが実際の価値より低いことを意味する。"}, {"word": "counterproductive", "definition": "逆効果の、目的達成に反する。ある行動や政策が意図した結果とは反対の悪い結果をもたらすことを表す。"}, {"word": "consensus", "definition": "合意、総意、大多数が同意している見解。複数の専門家や関係者が同じ意見に達した状態を示す。"}, {"word": "merchandise trade surplus", "definition": "商品貿易黒字。ある国が輸出する商品の価値が輸入する商品の価値を上回っている状態を指す。"}]}, {"title_ja": "Trump’s Misguided War Against Effective Altruism", "title_en": "Trump’s Misguided War Against Effective Altruism", "summary_ja": "The US Department of “War” has recently begun attacking effective altruism, a movement that aims to save lives, reduce suffering, and prevent future catastrophes. Why would the Trump administration, which with great fanfare created a Department of Government Efficiency, now oppose being effective?", "summary_en": "The US Department of “War” has recently begun attacking effective altruism, a movement that aims to save lives, reduce suffering, and prevent future catastrophes. Why would the Trump administration, which with great fanfare created a Department of Government Efficiency, now oppose being effective?", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-defense-department-by-peter-singer-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Trump’s Misguided War Against Effective Altruism\nThe US Department of “War” has recently begun attacking effective altruism, a movement that aims to save lives, reduce suffering, and prevent future catastrophes. Why would the Trump administration, which with great fanfare created a Department of Government Efficiency, now oppose being effective?\nMELBOURNE—“Americanism, not effective altruism.” That’s a new slogan launched on X by the US Department of “War,” the words running across an image of President Donald Trump saluting. Above the image, the post reads: “The United States will continue to be AI DOMINANT!”", "translation_ja": "", "vocab": [{"word": "misguided", "definition": "判断や方向性が誤っている、または不適切であること。方針や行動が正しい軌道を外れている状態を表す。"}, {"word": "altruism", "definition": "自分の利益を考えずに他人の幸福や利益のために行動する利他主義。道徳的で無私の行為を指す。"}, {"word": "fanfare", "definition": "華々しい宣伝や大げさな発表のこと。注目を集めるための盛大な公開イベントや宣言を意味する。"}, {"word": "opposition", "definition": "何かに対する反対や抵抗の態度。特に政治的または思想的な反対立場を指す。"}, {"word": "dominant", "definition": "支配的な、または優位にある状態。特定の分野で最も強い力や影響力を持っていることを表す。"}]}, {"title_ja": "Futureless Russia", "title_en": "Futureless Russia", "summary_ja": "During past periods of chaos and brutality in Russia, such as Stalin’s Great Terror, there was generally a sense that the country was headed somewhere—that the suffering served some end, however unjustifiable the means. But the repression Russians are enduring today has only one aim: to perpetuate t", "summary_en": "During past periods of chaos and brutality in Russia, such as Stalin’s Great Terror, there was generally a sense that the country was headed somewhere—that the suffering served some end, however unjustifiable the means. But the repression Russians are enduring today has only one aim: to perpetuate t", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/what-kynev-arrest-says-about-russia-future-by-nina-l-khrushcheva-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Futureless Russia\nDuring past periods of chaos and brutality in Russia, such as Stalin’s Great Terror, there was generally a sense that the country was headed somewhere—that the suffering served some end, however unjustifiable the means. But the repression Russians are enduring today has only one aim: to perpetuate the state that is executing it.\nNEW YORK—On September 25, a Moscow court sent the political analyst Alexander Kynev to pretrial detention for “large-scale illegal drug production, sale, and trafficking”—a charge that could land him in prison for 10–20 years. But no evidence of Kynev’s involvement in illegal drugs has been made public.", "translation_ja": "", "vocab": [{"word": "perpetuate", "definition": "ある状態や状況を継続させる、存続させる。ここでは政権が自らの権力を保ち続けることを意味している。"}, {"word": "repression", "definition": "言論や行動の自由を抑圧すること。政治的な自由を制限する政府の行為を指す。"}, {"word": "pretrial detention", "definition": "裁判前の身柄拘束。有罪判決前に被告人が拘置所に収容されることを法的に表現した用語。"}, {"word": "spurious", "definition": "本当のように見えるが実は根拠がない、偽りの。ここでは不当な告発を示唆している文脈で使用される。"}, {"word": "brutality", "definition": "残忍さ、暴力性。特に国家権力による非人道的で暴力的な行為を指す。"}]}, {"title_ja": "Loves Trump, lies and conspiracies: Katie Zacharia is the perfect presidential press secretary | Arwa Mahdawi", "title_en": "Loves Trump, lies and conspiracies: Katie Zacharia is the perfect presidential press secretary | Arwa Mahdawi", "summary_ja": "The Maga member believes the 2020 election was stolen and seemingly her new boss is saving the world from a cabal of satanic paedophiles. She’ll fit right in then Poor Donald Trump. His (third) wife seemingly can’t bear to be near him and his (fifth) press secretary recently abandoned him to be with", "summary_en": "The Maga member believes the 2020 election was stolen and seemingly her new boss is saving the world from a cabal of satanic paedophiles. She’ll fit right in then Poor Donald Trump. His (third) wife seemingly can’t bear to be near him and his (fifth) press secretary recently abandoned him to be with", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/13/trump-lies-conspiracies-katie-zacharia-press-secretary", "state_media": false, "category": "オピニオン", "full_text": "Poor Donald Trump. His (third) wife seemingly can’t bear to be near him and his (fifth) press secretary recently abandoned him to be with a baby she had only recently met.\n“She decided she loved her children more than she loved Donald Trump,” the president lamented in August when Karoline Leavitt decided to step down a few months after giving birth. “I’m very upset about this. She has to go home and spend time with her children. That does happen on occasion with some people – when they love their children.”\nApparently, Leavitt loves her children and Fox News, because, in a highly predictable turn of events, the 29-year-old has got a gig there now. But don’t worry too much about the president: he’s found himself a new woman to attack the press and act as his mouthpiece. On Friday, Trump announced that he’d appointed Katie Zacharia, previously a communications adviser for the Trump Media and Technology Group, as the new press secretary. Unlike some of Trump’s other lackeys, Zacharia has government experience: she was once a Department of Homeland Security spokesperson. Her most important qualification, however, is her fealty to King Trump. “She has an unblemished record of support,” Trump said in his announcement. “She is … a devoted fan and member of Maga!”\nWhile you’ve obviously got to worship the president to get a top comms role with him, there are a few other job requirements. Not least a willingness to embrace what former Trump adviser Kellyanne Conway called “alternative facts”. Zacharia gets full marks in that department. Last year the press secretary, who once worked for an anti-abortion advocacy group, claimed on X that the abortion medication mifepristone “is connected to the manufacturer of the deadly gas Zyklon B, used in the World War II concentration camps”. While there is a tenuous corporate connection which conspiracy theorists have tried to play up, mifepristone was developed in the 1980s by a French company.\nThe origins of mifepristone aren’t the only alternative facts Zacharia is fond of. She has echoed Trump’s big lie that the 2020 election was “stolen” and used her Truth Social account to promote the QAnon conspiracy theory, which posits that Trump is saving the world from a cabal of satanic paedophiles. She’s also promoted Pizzagate, the baseless theory that Hillary Clinton and her 2016 campaign chief, John Podesta, were operating an underground child sex-trafficking ring from a Washington DC pizza shop.\nWhile Zacharia scores highly when it comes to devotion and unhinged theories, I suspect that she’s going to need to ramp up her public hatred of Joe Biden if she wants to stay on her boss’s good side. Biden is dealing with stage four cancer and mostly staying out of the public eye, but Trump still acts as if he’s running against the man. According to a recent Reuters analysis, Trump has invoked Biden’s name about 900 times this year. And not in a pleasant way.\nBeni Rae Harmony, 24, who is Trump’s new assistant press secretary, seems to suffer from the same Biden Derangement Syndrome afflicting the president; indeed, it might be part of the reason she got the job. A Christmas 2021 photo of Harmony wearing a “Fuck Joe Biden” T-shirt while holding a rifle recently did the rounds online. The White House subsequently defended Harmony, calling her “a trusted voice for the Maga movement”.\nBeyond bashing Biden, another helpful quality for a Trump spokesperson is a fondness for insults. White House communications director, Steven Cheung, whom Trump reportedly refers to as “my sumo wrestler” probably leads the pack there. He’s forged a shock-jock style comms strategy and endeavours to be as crass as possible. Cheung has told the former secretary of state, Mike Pompeo, to “shut his stupid mouth”, labelled senator Jon Ossoff “the biggest cuck loser in politics”, and described the former FBI head, James Comey, as “one of the dumbest motherfuckers in human history”. He’s also fond of calling people “retards”, recently directing the slur at CNN host Erin Burnett.\nCheung’s rhetoric would get a lot of ordinary people fired. But it has made him a fixture in Trumpworld: he’s been with the president in various capacities for a decade now. That’s rare for Trump, who cycles through staff. If Zacharia lasts even a year in her new role, meanwhile, I’ll be surprised. With a (very likely) disastrous midterm election approaching, she has her work cut out and will need all the alternative facts she can find. Zacharia has also admitted that she is probably not even the best person for the job. “President Trump does not need a spokesperson,” Zacharia gushed on X last month. “He is his own best Press Secretary.”\nArwa Mahdawi is a Guardian columnist", "translation_ja": "", "vocab": [{"word": "lamented", "definition": "嘆く、残念に思って述べる。何か望ましくない状況について、失望や悲しみを表現する際に使われます。"}, {"word": "fealty", "definition": "忠誠心、従順さ。特に君主や指導者に対する絶対的な忠誠と服従を表します。"}, {"word": "tenuous", "definition": "薄弱な、不確かな。証拠や論拠が弱く、説得力に欠けることを意味します。"}, {"word": "posits", "definition": "主張する、仮定として提示する。理論や信念として何かを述べることを指します。"}, {"word": "baseless", "definition": "根拠のない、証拠のない。証拠や事実に基づかない主張や理論を表します。"}]}, {"title_ja": "Brexiters can’t cope with the fact that Putin was cheering them on | Rafael Behr", "title_en": "Brexiters can’t cope with the fact that Putin was cheering them on | Rafael Behr", "summary_ja": "Russian meddling probably didn’t affect the referendum result – but the Kremlin’s motives for wanting to undermine the EU still matter Russian territorial aggression against Ukraine didn’t feature much in the Brexit referendum campaign. It made headlines briefly when Boris Johnson blamed Moscow’s 20", "summary_en": "Russian meddling probably didn’t affect the referendum result – but the Kremlin’s motives for wanting to undermine the EU still matter Russian territorial aggression against Ukraine didn’t feature much in the Brexit referendum campaign. It made headlines briefly when Boris Johnson blamed Moscow’s 20", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/13/brexit-vladimir-putin-russia-referendum-result-eu", "state_media": false, "category": "オピニオン", "full_text": "Russian territorial aggression against Ukraine didn’t feature much in the Brexit referendum campaign. It made headlines briefly when Boris Johnson blamed Moscow’s 2014 annexation of Crimea on the European Union.\nAccording to the Vote Leave frontman, Vladimir Putin’s land grab was a consequence of Brussels making foreign policy “on the hoof” and having “pretensions to running a defence policy”.\nThe logic of that position was that Kyiv had no right to choose its own allies and that European democracies should never have supported Ukrainian aspirations to escape submission to Moscow. It is the appeasement fallacy: if only the west acquiesced to Putin’s conviction that Kyiv is a Russian city and that Ukraine is not a proper country, he would not want to suffocate his neighbour’s independence.\nThat notion is refuted by all the evidence of campaigns to coerce countries deemed by the Kremlin to be errant possessions since the collapse of the Soviet Union.\nWhen Nigel Farage repeated the EU-provocation theory of the Ukraine war during the 2024 general election campaign, one prominent defender of Ukrainian sovereignty described the Reform UK leader’s assertions as “ahistorical drivel” and “Kremlin propaganda”. That stalwart friend of Kyiv was one Boris Johnson.\nThere is nothing unusual about Johnson contradicting himself. His talent as a political communicator came from the ability to hold whichever view was expedient to him in the moment and, for the duration of that moment, appear to hold it sincerely. In a more generous reading, he rose to the occasion of Putin’s full-scale invasion of Ukraine in 2022, understanding events in their proper geopolitical perspective (and with access to classified intelligence reports), which afforded a different reading of Putin’s motives.\nIn 2016, his focus had been wilfully myopic. The goal of maximising Eurosceptic votes meant reaching for any argument that presented Brussels in a negative light. If that involved narrating the cause of a conflict on the other side of the continent in warped terms that matched the Kremlin story, so be it.\nPutin despised the EU for his reasons; the leave campaign despised it for theirs. Johnson was not minded to interrogate whether that alignment of enmities discredited his cause.\nThis is the context in which Andy Burnham’s recent assertion that Russia meddled in the referendum needs to be understood. The prime minister said it was inconceivable, given all the evidence of Kremlin interference in elections around the world, that the toolkit of subversion would not have been deployed in support of Brexit.\nThat is not a controversial claim to anyone with a glancing awareness of Russian foreign policy and the means by which it is pursued – the swarms of bot accounts flooding social media with falsehoods; dirty money channelled to extremists; industrial dissemination of conspiracy theories and stoking of intercommunal tensions to undermine social coherence, deplete trust in democracy and make it less functional.\nNo candidate who was knowingly complicit in that process will admit as much. But even those who were unaware that their cause was boosted by Kremlin troll farms have incentives to deny it. No one wants their heroic victory recast as useful idiocy in service of a hostile power.\nConservatives have called Burnham’s intervention “dangerous and divisive”, which could be interpreted as a denial that interference happened or just as a preference that it not be mentioned to protect delicate pro-Brexit sensibilities.\nFarage’s feelings were certainly hurt. He called the prime minister a liar and described the whole thing as a “Russia hoax” – the formula Donald Trump applied to well-substantiated allegations that his 2016 presidential campaign got a helping hand from Moscow. The Reform leader can’t be too surprised by the idea of Kremlin influence in British politics. His party’s former leader in Wales is serving a jail term for taking bribes from Russian spies.\nThe backlash forced Downing Street to clarify that the prime minister didn’t mean to cast aspersions on the legitimacy of the referendum result. That is the right position when there is no way of knowing what impact, if any, foreign meddling might have had. The views that interference happened and also that the leave campaign would have prevailed anyway are compatible.\nSome remainers might seek comfort in the idea that Britain’s democracy was hijacked and diverted through clouds of Russian-induced false consciousness to the wrong destination. The banal truth is that the Eurosceptic side won enough arguments and voters made their choice freely.\nBrexiters didn’t need any outside help to turn latent anti-immigration sentiment into active hostility to free movement across European borders.\nThe Russia dimension is more relevant when it comes to a geopolitical argument that the pro-European side failed to land. In June 2016 it was hard to make the peril of strategic isolation for Britain, self-exiled from", "translation_ja": "", "vocab": [{"word": "annexation", "definition": "領土の併合や編入。ある国が他国の領土を自国の領土として取り込む行為を指します。"}, {"word": "appeasement", "definition": "譲歩や宥和政策。侵略者の要求に応じることで紛争を避けようとする外交戦略で、通常は弱腰の政策として批判されます。"}, {"word": "coerce", "definition": "強制する、脅迫する。武力や威嚇によって相手を無理やり従わせることを意味します。"}, {"word": "expedient", "definition": "都合の良い、便利な。その場の利益や便宜を優先させる様子を表し、道徳性を伴わない行為に用いられることが多いです。"}, {"word": "myopic", "definition": "近視眼的な、視野が狭い。物事の全体像を見ず、目前の利益だけに目を向ける傾向を指します。"}]}, {"title_ja": "I’m a pediatrician. Loss of human connection is the biggest threat to kids, not AI | Megan Moreno", "title_en": "I’m a pediatrician. Loss of human connection is the biggest threat to kids, not AI | Megan Moreno", "summary_ja": "Amid worries about children’s relationship to tech, the solution is often spending more time talking openly with each other We have become obsessed with the idea that screens are destroying human connection. The evidence seems to be everywhere. Each week headlines warn of teenagers addicted to phone", "summary_en": "Amid worries about children’s relationship to tech, the solution is often spending more time talking openly with each other We have become obsessed with the idea that screens are destroying human connection. The evidence seems to be everywhere. Each week headlines warn of teenagers addicted to phone", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/technology/2026/oct/13/human-connection-threat-children-ai-technology", "state_media": false, "category": "オピニオン", "full_text": "We have become obsessed with the idea that screens are destroying human connection.\nThe evidence seems to be everywhere. Each week headlines warn of teenagers addicted to phones, a loneliness epidemic and the dangers of AI. The release of The Social Reckoning leads us to ask, “How bad were those guys at Meta?” and then ultimately wonder, “How bad am I if I still use Instagram?” In our day-to-day, we observe workers eating lunch alone while scrolling and friends choosing online games over offline gatherings.\nBut what if we are focusing on the wrong problem?\nThe greatest threat to connection may not be technology itself. It may be our growing unwillingness to curiously, thoughtfully and openly communicate about the role technology plays in our lives.\nAs a pediatrician, this issue often manifests in my clinic. Parents arrive with worries about their teens’ screen time. The parent will demand that their child “fess up” and reveal how many hours they waste on their phone every day. The atmosphere is immediately charged. The teen becomes defensive. The parent is frustrated.\nI often suggest that we start somewhere else.\nI ask: “Can you share a little about what you do when you are using technology? What do you enjoy? Are there things about your technology use you are worried about and willing to discuss?”\nThe answers are not usually what people expect. One teen tells me about the friendships she maintained on social media after moving to a new town. Another shows me videos he created to promote his school’s upcoming play. One shares how digital design tools are changing the fashion industry, so she is trying to learn about them now. Another quietly admits that gaming has become so consuming that it feels stressful.\nAs the conversation unfolds, something changes. The tension in the room eases. Parents relax. The teen patient might even smile a few times. We talk about strategies, relationships, stress and health.\nWhat began as an argument about a device becomes a bigger conversation about health, relationships and life itself.\nIt often feels that our conversations about technology have become trapped in a false choice between two extreme camps. One camp is made up of the pro-tech enthusiasts, thought to embrace every new device or platform. The other camp is composed of preachers of digital abstinence.\nThe result is a polarized debate dominated by blame, shame and moral judgment. Instead of asking how technology affects our relationships, our sleep, our work, our wellbeing, we argue endlessly about whether technology is “good” or “bad”.\nI was reminded of this recently during a community event focused on digital media. The event included a youth panel with several brave adolescents, willing to speak to an audience of their teachers, community members and parents. I asked the adolescents a question: could you describe a positive conversation you had with a parent about technology?\nEvery single panelist shook their head.\n“I’ve never had that,” one teenager said, uneasily eyeing her mom who was sitting in the front row. The other panelists agreed.\nIt was a striking moment. Parents routinely talk their children through setbacks in sports, clubs, friendships and school. They listen, ask questions and offer support. Yet when it comes to technology, many conversations begin and end with warnings, criticism or fear.\nWhy is this?\nFor years, parents have been barraged by alarming headlines about screen time and mental health. Many parents worry there is probably only one right way to approach technology, and they’re failing miserably. Parents are also navigating the necessity of using their own devices for work, home and communication.\nThe real anxious generation just might be parents.\nSo how do we fix this? The solution begins with curiosity. Parents can ask what interests their children have online, and why those interests matter. Parents can ask their kids about what questions or worries they have about their tech use, and share some of their own concerns. If a parent missteps by scrolling cute cat videos and delaying dinner, they can acknowledge it and make it a teachable moment for themselves and their kids.\nBecause children do not need adults who have all the answers.\nThey need adults willing to ask questions.\nThese conversations matter because they lower the temperature of the debate. Once we move beyond panic and polarization, we can begin asking better questions on the societal level. How should digital platforms be designed to ensure safety? What obligations do technology companies have to children? What policies would support healthier digital environments?\nIf we want to preserve human connection in the age of social media and AI, the answer is not to simply spend less time with technology. It is spending more time talking openly with one another. The irony of the current moment is that as we worry endlessly about technology pulling us apart, it might be our inability to have conversations about technology that ult", "translation_ja": "", "vocab": [{"word": "obsessed", "definition": "何かに強く執着している、夢中になっている状態。通常は過度な関心や心配を表す。"}, {"word": "epidemic", "definition": "急速に広がる広範囲の問題や現象。元々は伝染病を指すが、社会的問題にも使用される。"}, {"word": "manifestation", "definition": "抽象的な問題や状態が実際の形で現れること、具体化すること。"}, {"word": "polarized", "definition": "2つの対立する立場や意見に分かれている状態。グループや社会が極端に対立している。"}, {"word": "abstinence", "definition": "特定のもの（アルコール、技術など）を意図的に避ける禁欲的な行動や主義。"}]}, {"title_ja": "The Real Lesson of the Iran War", "title_en": "The Real Lesson of the Iran War", "summary_ja": "When airpower wins, and when it doesn’t.", "summary_en": "When airpower wins, and when it doesn’t.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/real-lesson-iran-war", "state_media": false, "category": "オピニオン", "full_text": "For months, Iran’s resilience in its war with two of the world’s most capable militaries has perplexed many politicians and confounded public expectations. Israel and the United States have hit thousands of Iranian targets, systematically destroying much of the country’s military infrastructure and killing many of its top leaders. Yet the Islamic Republic has not only survived but also continued to maintain significant offensive capabilities. To account for this, some have pointed to Iran’s effective deployment of low-cost precise mass weapons, such as the Shahed-136 one-way attack drone. Others have looked at the decentralized and self-replacing nature of the regime itself.\nAlthough these and other factors have played a part, there is a more straightforward reason for Iran’s staying power: the American and Israeli decision to rely on a sustained air and stand-off naval campaign to bring the regime to its knees. This approach did not come out of nowhere. Air supremacy has been the defining tenet of U.S. and wider Western military strategy for decades. In the post–Cold War era, the United States has perfected the art of airpower—winning control of the skies so that enemy armies, navies, and territory can be bombed at will—to a degree that no country or even alliance of countries has matched. When pitted against an adversary’s deployed ground forces, this strategy has consistently yielded impressive results. The U.S. ability to achieve rapid air superiority has also long served as a powerful deterrent to would-be aggressors.\nYet there are few examples in history of adversaries conceding to maximalist demands in the face of punitive bombing campaigns alone—even by the world’s greatest air force. Indeed, Operation Epic Fury is only one of several recent or current conflicts—including Russia’s war in Ukraine and international responses to the Houthi threat in Yemen—that have exposed the drawbacks of relying heavily on airstrikes to try to unseat a government or to defeat insurgent forces. For American strategists, then, it will be crucial to distinguish the different uses of airpower. The Iran campaign has been a disastrous misuse of military resources, and it showcases the policy limits of what airpower can achieve. Yet it would be a mistake to conclude that the United States should shift away from its doctrine of prioritizing air superiority, as it prepares alongside NATO and Asian allies for very different threats in the coming few years.\nTHE WAGES OF DESTRUCTION\nDuring the major wars of the twentieth century, U.S. and Allied air superiority was critical to successes on the battlefield. But airpower still failed to force political capitulation by adversaries. In World War II, Nazi Germany fought to the very end despite the Allies’ systematic bombing of its cities, its industrial base, and its transport and fuel networks. In the Korean War, North Korea fought the United States and its allies to a standstill, even as fleets of U.S. bombers obliterated most of its cities and infrastructure. And in Vietnam, the North Vietnamese outlasted the United States, despite the U.S. military dropping more than a million tons of ordnance on cities, factories, and supply routes, in successive punitive air campaigns.\nIn the defining counterinsurgency conflicts of the twenty-first century, there is little evidence to suggest that air superiority proved any more effective. In Afghanistan and Iraq, the United States and its allies quickly established total air superiority over the enemy and were able to call in precision airstrikes at will, giving allied troops a huge advantage in combat. Yet in both cases, these campaigns also ultimately failed to achieve their political objectives.\nDespite near-daily barrages of Ukraine’s cities, power infrastructure, and industry, Russia is no closer to vanquishing the country more than four and a half years after its brutal invasion began. In Iran, there has been little sign that U.S. and Israeli airstrikes have fueled popular pressure to end the war. This is despite major antigovernment protests throughout the country shortly before the campaign began, which were stamped out only after mass state violence. Indeed, inflicting hardship on the population seems especially unlikely to change the calculus of the Iranian regime, given its willingness to kill thousands of protestors to stay in power.\nIf anything, there is reason to think that it may be even harder today to win wars than in the twentieth century. Because of the increasingly multipolar nature of the world order, countries can often rely on international support to mitigate the damage from a sustained enemy strike campaign. In Ukraine, this can be seen in the influx of American and European weapons and economic, military, and technological support into the country since Russia’s 2022 invasion. This assistance has not prevented Ukrainians from experiencing terrible loss and hardship, but it has enabled the Ukrainian economy to continue", "translation_ja": "", "vocab": [{"word": "perplexed", "definition": "困惑させた、戸惑わせた。複雑で理解しがたい状況に直面して、人々を混乱させることを意味する。"}, {"word": "confounded", "definition": "予想を裏切った、期待に反した。通常の予測や一般的な見方を覆すような結果をもたらすことを指す。"}, {"word": "decentralized", "definition": "分散化された、中央集権的でない。権力や機能が複数の場所や単位に分散している構造を表す。"}, {"word": "maximalist", "definition": "最大限の要求や目標を追求する。妥協を拒み、完全な達成を目指す立場や要求を意味する。"}, {"word": "punitive", "definition": "懲罰的な、罰を与えるための。相手に報復や制裁を加えることを目的とした行動を指す。"}]}, {"title_ja": "The Global AI Bust", "title_en": "The Global AI Bust", "summary_ja": "What will survive when the boom ends.", "summary_en": "What will survive when the boom ends.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/global-ai-bust-ruchir-sharma", "state_media": false, "category": "オピニオン", "full_text": "Few people doubt that AI is among the most transformative technologies to emerge in the past century. By many measures, it is spreading faster and more widely than any innovation since the dawn of the Industrial Revolution. Steam engines came into common use in the nineteenth century and electricity in the early twentieth, but their full potential was not realized before the completion of railways, highways, and power grids decades later. Computers for business use emerged in the 1950s, but they gave no visible lift to the economy before the Internet connected them in the 1990s.\nCommercial artificial intelligence, by contrast, appeared almost overnight on screens worldwide, at a moment when the overwhelming majority of humans already had access to a computer or smartphone. Less than four years after the release of ChatGPT, roughly 30 percent of Americans are now using AI, five times the share of Americans who were using smartphones, the Internet, or electricity at comparable stages of development. Revenue for AI companies is three times what previous digital technologies, including the Internet, cloud computing, and early mobile apps, generated in their early years.\nPolicymakers, investors, and business leaders are counting on AI to be a miracle cure for everything from runaway public debt to the costs associated with aging populations. Among investors, even some of the world’s most successful contrarians—who make their fortunes betting against conventional wisdom—are embracing the idea that AI could yield bigger benefits more rapidly than any past technological advance.\nThe euphoria is not universal, however. An ever-lonelier minority of skeptics argue that AI’s rise may seem unusually fast but is in fact following a centuries-old script. Major technology revolutions have always triggered dramatic boom-bust cycles. People get overexcited about the latest breakthrough and begin investing indiscriminately in the companies driving the innovation. As a team of researchers from Texas Tech University, Texas A&M University, and the Vlerick Business School in Belgium found in 2018, all of the most revolutionary technological innovations of the last two centuries inflated a major market bubble—a rapid increase in stock prices, followed by a precipitous decline.\nThe word “bubble” tends to conjure an idea as thin as air. But as with all previous tech bubbles, the innovations of the current AI boom are real, the hype born of genuine promise. That promise, however, is exactly what is inflating the bubble. Once the mania begins to crack, as it inevitably will, the shock will ripple back through financial markets into a global economy increasingly dependent on AI for growth. The damage will be felt worldwide, not only in the countries leading AI’s development but in the many now battling to supply them with inputs, as well. The weakest players will be wiped out, and the survivors will consolidate their lead. And from the rubble, a more stable AI ecosystem will emerge.\nALL IN\nThe AI competition is already reshaping the economic world order. At the top of this order stand the United States, where the foundational AI model, ChatGPT, reached consumers in late 2022, and China, where DeepSeek made its debut around a year later. Since then, the race for supremacy has come to drive both countries’ economies. In the United States, growth has been fueled primarily by the hundreds of billions of dollars of Big Tech investment in AI projects and by consumer spending energized by gains in a stock market dominated by AI. The top ten stocks in the benchmark S&P 500 are all big AI players and together account for nearly 40 percent of the index and around half of its returns this year.\nChina is spending far less on AI but would be lost without it. After falling in the last decade, net exports—mainly of AI-related goods—now account for a third of China’s growth. The domestic economy is otherwise moribund, hampered by bad debts and a shrinking labor force. Beijing is also heavily supporting the export of its homegrown AI models, which are catching on because they are cheaper than American frontier models but perform nearly as well.\nThe AI rage now extends beyond Washington and Beijing. Investors are plowing funds into companies that supply American tech giants with the computing power, semiconductors, and other building blocks they need, fueling stock market booms worldwide. In Asia, for example, three major semiconductor companies have reaped the benefits: TSMC in Taiwan and SK Hynix and Samsung in South Korea, which comprise an even larger share of their local stock indexes than big American tech firms account for in the U.S. index. In these relatively small economies, the global frenzy for AI has generated even greater shocks than in the United States. The total value of South Korea’s market exploded from $1.5 trillion at the start of 2025 to over $5 trillion this summer. Individual investors saw bigger gains in stock wealth over 18 mon", "translation_ja": "", "vocab": [{"word": "transformative", "definition": "根本的に変える力を持つ、革新的な。企業や社会に大きな変化をもたらす技術や出来事を説明するときに使用される。"}, {"word": "precipitous", "definition": "急激な、陡峭な。株価の急落や急速な下降など、予期しない急激な変化を表す言葉。"}, {"word": "indiscriminately", "definition": "区別なく、無差別に。投資家が慎重さを欠いて、根拠なく多くの企業に投資することを説明するときに用いられる。"}, {"word": "euphoria", "definition": "熱狂、陶酔感。特に市場や投資環境での過度な楽観主義や興奮状態を表す。"}, {"word": "contrarians", "definition": "逆張り投資家、主流の意見に反対する人。市場の一般的な見方とは異なる戦略で利益を得る投資家を指す。"}]}, {"title_ja": "Chinese Robots Could Decide the AI Race", "title_en": "Chinese Robots Could Decide the AI Race", "summary_ja": "Scott Singer and Pavlo Zvenyhorodsky, researchers at Carnegie’s China AI Initiative, argue that China is betting that AI dominance will come from combining hardware and software, or AI-powered robots. By focusing only on software such as AI models, they argue, Washington and Silicon Valley risk fall", "summary_en": "Scott Singer and Pavlo Zvenyhorodsky, researchers at Carnegie’s China AI Initiative, argue that China is betting that AI dominance will come from combining hardware and software, or AI-powered robots. By focusing only on software such as AI models, they argue, Washington and Silicon Valley risk fall", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinese-robots-could-decide-ai-race", "state_media": false, "category": "オピニオン", "full_text": "The fastest track and field athlete is no longer the Jamaican sprinter Usain Bolt. In fact, it is not a person at all: it is the Chinese humanoid robot Tiangong Ultra, which in August ran 100 meters in 9.39 seconds, nearly two-tenths of a second faster than Bolt’s world-record time and more than twice as fast as its own time a year ago. The race made global headlines and spread on social media in large part because of what it revealed robots still can’t do—in this case, slow down, as Tiangong Ultra ran right through the finish line and slammed into a safety wall. But it also showcased the incredible progress China’s robotics industry has made and the narrowing gap between human capabilities and new technology.\nChina’s robotics achievements have become central to its evolving national AI strategy. Whereas Washington and Silicon Valley focus primarily on scaling large language models and digital AI applications, Beijing is concentrating on combining its strengths in software and hardware to develop robots that incorporate the advanced cognition of AI with autonomous physical movement. These robots, often described in China as “embodied AI,” could eventually operate factories, perform manual labor, and even replace human soldiers on the battlefield. If AI-powered robots develop enough autonomy to carry out sophisticated tasks in the real world, they could become a general-purpose technology, like electricity or the Internet, that is able to transform physical work across broad swaths of the economy.\nFor Beijing, a powerful AI-driven robotics industry could serve several of its economic and strategic goals. It could ease demographic pressures from an aging population by reducing the need for workers and providing eldercare. It could also supercharge Beijing’s military capabilities by automating its reconnaissance, logistics, and combat operations. Most notably, some leading Chinese thinkers believe robotics could be the key to unlocking artificial general intelligence—systems capable of performing as well as or better than humans across most tasks. China’s investments in AI-powered robotics could be especially consequential if today’s leading AI companies in Silicon Valley, which are focused on scaling the data and computing power used to train large models, struggle to translate their digital gains into advancements in the physical world.\nSkeptics might think that AI-powered robots are the stuff of science fiction. But as robotics technology rapidly develops, China is betting that some of the most consequential advances in AI will hinge on mastery of the physical world. If that bet is right, even only partially, the United States’ lead in frontier models would matter far less than many in Washington assume. What would matter instead is the capacity to build robots, deploy them in sectors such as manufacturing and logistics, and generate enough data to continuously train them—all areas in which the United States currently underinvests. To compete, Washington needs to expand its own manufacturing sector and work with partners around the world that have developed advantages in key parts of the robotics supply chain. As China sprints ahead, the United States needs to get serious about AI-powered robots or it risks getting left behind.\nEMBODIED POSITIVITY\nThe Chinese government is determined to lead the transformation toward a world of AI-powered robots. Beijing has placed embodied AI among what it calls the “industries of the future,” alongside 6G and quantum technology, and named it a priority in the 15th Five-Year Plan—the country’s socioeconomic blueprint through 2030. Facing high youth unemployment, a property market still in crisis, sluggish domestic consumption, and an aging and shrinking population, Beijing sees embodied AI as a new growth engine that could offset these headwinds while also pushing technological frontiers.\nInnovations aimed at addressing domestic challenges could quickly create a geoeconomic advantage. China already controls key chokepoints in the emerging supply chain for embodied AI. Chinese companies, for example, produce about 80 percent of the world’s LiDAR (Light Detection and Ranging) sensors—the technology that underpins three-dimensional mapping and autonomous navigation in self-driving vehicles, warehouse robots, and precision agricultural tools. If AI-powered robots become as foundational to the global economy as Beijing hopes, countries would be as dependent on Chinese robotics supply chains as they are today for critical minerals, which has given Beijing enormous leverage over the global economy.\nThe strategic benefits of AI-powered robots extend to the military. In February, the Chinese Institute of Command and Control, a state-connected national scientific society, assessed that embodied AI could enable networks of unmanned systems operating across air, land, sea, and space to share information, anticipate battlefield developments, and carry out precision strikes in real time", "translation_ja": "", "vocab": [{"word": "embodied", "definition": "物理的な身体を持つ、または具体的な形態で実現されている状態を指す。抽象的な概念が実際の形や行動として現れることを表現する用語。"}, {"word": "autonomy", "definition": "自律性、自己決定能力、または外部の指示なしに独立して行動する能力。ロボットやAIが自動的に判断・行動する度合いを示す。"}, {"word": "consequential", "definition": "重要な結果や影響をもたらす、意味深長な。ある行動や出来事が大きな変化につながる可能性があることを表す。"}, {"word": "demographic", "definition": "人口統計に関連する、特に人口の年齢構成や人口変動など統計的な特性を指す。社会経済的な分析で頻出する用語。"}, {"word": "reconnaissance", "definition": "偵察、状況把握のための調査活動。軍事用語として敵地の情報収集活動を指すことが多い。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-13 23:59 JST";
  renderTabs();renderList();
})();
</script>
