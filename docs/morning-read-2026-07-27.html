anagement jobs – the only group in the Associated Press’s analysis overrepresented at that level.\nThat does not mean white men cannot be wronged at work. Title VII protects them, and the EEOC should enforce the law for them. But that is one thing a nationwide record is good for: letting evidence test an official’s theory. Lucas wants to end the measurement best ab", "translation_ja": "", "vocab": [{"word": "dismantle", "definition": "システムや組織を段階的に破壊・廃止すること。制度や機構を段階的に取り壊す場合に使用される。"}, {"word": "demographic", "definition": "特定の人口集団の統計的特性（年齢、性別、人種など）に関する。市場調査や社会統計で頻繁に使われる専門用語。"}, {"word": "systemic", "definition": "組織全体や制度全体に組み込まれた根本的な問題や特性。特定の個別事例ではなく、システム全体に関わる場合に用いられる。"}, {"word": "subpoena", "definition": "法廷が証人や証拠の提出を強制する法的命令。民事訴訟や刑事手続きで証拠収集に用いられる法的文書。"}, {"word": "enforcement", "definition": "法律や規則を厳密に実施・執行すること。コンプライアンスと法令遵守を確保するための措置全般を指す。"}, {"word": "overrepresented", "definition": "ある集団が統計的期待値よりも多く存在する状態。人口比率よりも高い割合で特定グループが占められていることを意味する。"}]}, {"title_ja": "なぜ民主党はテイト兄弟に対してトランプの厭女性を追及しないのか", "title_en": "Why Democrats Fail to Weaponize Tate Brothers Against Trump's Misogyny", "summary_ja": "ドネガン氏は、アンドリュー・テイトの性的人身売買と暴力の疑いがMAGA運動の男性至上主義の基盤に自然に適合していると主張している。民主党がこれを政治的武器として使用しないことは、男性至上主義的思考がいかに深く政治戦略に浸透しているかを示し、強姦反対と民主主義支持の原則を中心とした反トランプ主義の構築の機会を逃していると指摘している。", "summary_en": "Donegan argues that Andrew Tate's alleged sex trafficking and violence fit naturally within MAGA's foundation of male supremacy, yet Democrats have remained silent about using this as a political weapon. She contends that Democrats' failure to connect Tate's crimes to Trumpism reveals how deeply male supremacist thinking has infiltrated political strategy, representing a missed opportunity to build opposition around anti-rape and pro-democracy principles.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/jul/27/andrew-tristain-tate-democrats", "state_media": false, "category": "オピニオン", "full_text": "It’s not exactly strange that elements of the Magaverse have embraced Andrew Tate. What’s strange is that the Democrats do not seem interested in holding the Trump movement to account for it.\nAndrew Tate, the misogynist influencer who is accused by numerous women around the world and now by British prosecutors of rape and strangulation, as well as assault, sex trafficking, possession of child abuse images and extreme pornography, and various other forms of gender violence and exploitation, was arrested in Miami last week, along with Tristan, his brother and sidekick. Or I should say, they were rearrested: the men were previously charged in Romania, where they were under house arrest until, following some conveniently timed diplomatic moves from the Trump administration, they were allowed to leave the country and resettled in the US. When asked if the Trump administration had secured their release from Romania back then, the Tates’ lawyer said: “Do the math. These guys are on the plane.” Now, finally, they are awaiting extradition to the UK, where they are dual citizens.\nThe Tate brothers have long made their living by making provocative, contemptuous statements about women online. But in June, the New Yorker’s Heidi Blake published a long investigation that centered not on what the Tates have said, but on what they’re said to have done – detailing a long and documented history of alleged sex trafficking, violence and sexual assault along with a disturbing pattern of police mismanagement, incompetence and indifference that allowed the men to go free. The Tates denied wrongdoing in that piece; their lawyer called the new British charges against them “garbage”. But if anyone thought the Tates’ misogynistic influencer career was mere bluster, the Blake investigation offered a formidable bit of counterevidence: she painted a picture of the men acting exactly the way that they talked.\nIn a world where people take misogyny as seriously as they claim to, the Tates would long ago have been ostracized, and condemned, for their hatefully sexist rhetoric and alleged violence against women. In this world, they got rich, and ingratiated themselves to powerful figures in the Republican party.\nTate is a natural fit on a Maga right that has served to unite its many different factions – from Christian conservatives to Silicon Valley eugenicists, to beer-chugging barstool denizens, conspiracy mongers, and the male hosts of multi-hour podcasts – around a foundation of male supremacy. Contempt for women is the uniting force on the American right, more uniform across the competing styles within the movement even than the hatred of immigration or devotion to the prerogatives of capital. Donald Trump cemented the presidency, after all, when he was revealed to have bragged about “grab[bing]” women “by the pussy” and still maintained his base of support. In the decade that followed, his domineering, narcissistic, vulgar style of masculinity, and the alternately belittling and hateful treatment of women that accompanies it, have come to be seen on the right as a feature, not a bug. Other men within the Maga movement now imitate Trump’s style of misogyny with a gleeful competitiveness; the coalition welcomes men who collect harems of women to breed their children, those who have been multiply accused of sexual abuse and those who decry our right to vote. Andrew Tate, in this milieu, is not an exception. He is the rule.\nBut just because Tate’s style of masculinity is popular on the right – in which sex is seen to elevate men’s status at women’s expense, in which women’s aspirations to education, skilled work, dignity, public participation, or even mere decency are mocked; and in which men’s mistreatment of women is the key way for them to gain the esteem of other men – does not mean that it is popular with the public. Tate’s version of vulgar, avowed, preening misogyny has a constituency of Republican politicians and unlikable teenage boys; it does not have a constituency among the majority of the American public.\nWhy are Democrats not making the Tates into symbols of Maga’s hateful and bizarre cultural project, of Trump’s personal alleged affinity for sexual misconduct, or of the antisocial, anti-democratic and anti-equality stances of the Maga movement?\nRape, after all, might be the most quintessentially anti-democracy act: a violent refusal of equality in the most intimate terms. One could imagine an opposition to Trumpism that built from anti-rape principles into pro-democracy ones; less ambitiously, one could imagine an opposition to Trumpism that merely drew a link between Trump’s pathetic narcissism and that of the sleazeball Tates and their manosphere ilk. It seems like an easy win.\nThat the Democratic party is not taking it shows how broadly male supremacist thinking has seeped into the conventional wisdom of political strategists, and how anathema even the most basic and remedial feminist claims are now understood to be by th", "translation_ja": "", "vocab": [{"word": "ingratiated", "definition": "好意や信頼を得るために意図的に相手に近づくこと。人間関係を通じて権力者に接近する際に使われる。"}, {"word": "ostracized", "definition": "集団や社会から排除または拒絶されること。社会的に孤立させられた状態を表す。"}, {"word": "manosphere", "definition": "インターネット上で男性中心の思想や男性の権利を主張するコミュニティ。ミソジニストや男性優越主義者が集まるオンライン空間。"}, {"word": "eugenicists", "definition": "優生学を信奉する人々。生物学的に「優良な」特性を持つ人間の増殖を促進する思想を持つ者。"}, {"word": "prerogatives", "definition": "特別な権利や特権。ある集団や階級が独占的に持つ権力や権利を指す。"}, {"word": "quintessentially", "definition": "あるもの本質的、代表的な特性を最も典型的に示している状態。その概念の最高の表現形態。"}, {"word": "anathema", "definition": "強く拒否されたり嫌悪されたりする人や考え。宗教的にも世俗的にも非常に受け入れがたいもの。"}]}, {"title_ja": "再生可能エネルギーはアフリカを産業化できるか？", "title_en": "Can Renewables Industrialize Africa?", "summary_ja": "著者は、太陽光・蓄電池コストの急落とアフリカの豊富な再生可能エネルギー資源により、中国と同様のクリーンエネルギー駆動型工業化モデルの採用が可能だと主張しています。米国が化石燃料投資を優先し続ける一方で、中国が再生可能エネルギーインフラを通じて戦略的パートナーシップを深める場合、アフリカにおける米国の地政学的および経済的影響力は大きく損なわれるリスクがあります。", "summary_en": "The author argues that Africa's abundant renewable energy resources, combined with plummeting solar and battery costs, position the continent to adopt a clean energy-driven industrialization model similar to China's. The U.S. risks losing significant geopolitical and economic influence in Africa if it continues prioritizing fossil fuel investments while China deepens its strategic partnerships through renewable energy infrastructure development.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/africa/can-renewables-industrialize-africa", "state_media": false, "category": "オピニオン", "full_text": "The war on Iran, launched in late February by the United States and Israel, is doing more than rattling oil markets. It is accelerating a determination among African countries to reduce their dependence on imported fossil fuels and to turn toward renewable power. Africa has extraordinary solar, wind, and geothermal resources, but until the early 2010s, much of this potential had gone untapped. Most African states had long generated electricity from fossil fuels and hydropower, because these technologies were already well established, whereas solar and wind were the new, expensive, kids on the block.\nThat calculus began to change around 2022, when Russia’s invasion of Ukraine exposed the vulnerability of fossil fuel dependence. In sub-Saharan Africa, the cost of imported diesel and other fuels surged, with import bills rising by more than 35 percent in many countries over the course of a year, squeezing public finances and raising electricity bills for homes and businesses. The recent instability across the Middle East is only reinforcing that sense of vulnerability. And so African countries are now leaning toward the “electro-state” development model advanced by China, in which abundant, low-cost electricity from renewables underpins industrialization and economic growth. China is electrifying Africa through large-scale investment in renewable power generation, building electricity transmission and distribution infrastructure, and making electrified transport more accessible by financing electric-vehicle assembly lines, battery-swapping networks, and charging infrastructure.\nAfrica is now at the center of the world’s clean energy push, no longer at its periphery. And by embedding itself deeply into Africa’s energy infrastructure, China is positioning itself as a long-term strategic partner for industrializing the world’s youngest and fastest-growing continent. The United States under President Donald Trump, however, simply appears not to understand the appeal of renewables on the continent. (For instance, Washington has approved a $4.7 billion U.S. export-import bank loan to try to revive a liquefied natural gas project in Mozambique.) The truth is that infrastructure creates path dependency: countries tend to build future systems around the technologies, financing structures, and supply chains they already have.\nIf the United States cedes a role in Africa’s clean energy transition to China, it risks losing more than commercial opportunities. Beijing would deepen its diplomatic influence both in Africa and worldwide, shape the standards and supply chains underpinning the global energy transition, and strengthen its access to critical minerals essential for low-carbon technologies. And many African governments now prioritizing renewable energy are likely to view external partners that continue to emphasize fossil-fuel investments with growing skepticism. Rather than pushing hydrocarbons, the United States should partner with African countries on clean energy in ways that align with those countries’ development priorities. Doing so would not only expand Africa’s access to reliable and affordable energy; it would shore up American economic and geopolitical interests.\nHERE COMES THE SUN\nNearly 600 million people in sub-Saharan Africa still lack access to electricity in their homes, roughly 80 percent of the world’s unelectrified population. Throughout much of the twentieth century, electrification relied on large, centralized fossil fuel and hydropower plants designed to serve cities, mines, and industry. Dispersed rural populations remained beyond the reach of these expensive transmission networks, leaving the continent with the world’s largest electricity access gap despite decades of investments in infrastructure.\nBut over the past 15 years, Africa’s energy transition began to accelerate as renewable sources became far cheaper. In 2024 alone, the International Energy Agency (IEA) estimated that Africa would attract around $110 billion in total energy investments, of which nearly $40 billion would go to clean energy, almost double the proportion of the total directed toward renewables in 2020.\nThe driver of this pivot is economic. Worldwide, solar costs have fallen by roughly 90 percent since 2010, while battery prices have dropped by 93 percent over the same period. In Africa, decentralized renewable systems are now simply proving faster and cheaper to deploy than fossil fuel infrastructure. Rooftop solar, battery storage, and other such installations can bring electricity to rural communities in the space of months, rather than the years it can take to expand the high-voltage transmission and distribution networks that carry power from a national grid’s large, centralized generating stations.\nThe continent also has especially abundant wind, solar, and geothermal resources. According to the IEA, Africa contains roughly 60 percent of the world’s best solar resources; its untapped onshore wind potential could ", "translation_ja": "", "vocab": [{"word": "cede", "definition": "権利や支配権を譲る、放棄するという意味の動詞。国際関係や競争の文脈で、ある国が他国に優位性を与えることを指します。"}, {"word": "path dependency", "definition": "過去の決定や既存技術が将来の選択肢を制限する現象。一度選択された技術やシステムは変更困難になるという経済学・政策用語です。"}, {"word": "decentralized", "definition": "中央集権的でなく、分散型の構造を指す形容詞。再生可能エネルギー文脈では、小規模で各地域に分散した電力施設を意味します。"}, {"word": "geopolitical", "definition": "地政学的な、地理的および政治的要因に関連する形容詞。国家間の戦略的競争や影響力争いの分析に用いられます。"}, {"word": "electrification", "definition": "電気化、電力供給の拡大を意味する名詞。地域や産業に電力インフラを導入するプロセスを指します。"}, {"word": "accelerate", "definition": "速度を上げる、促進するという意味の動詞。プロセスやトレンドが急速に進む状況を説明するのに使われます。"}, {"word": "embedding", "definition": "深く組み込む、統合するという意味の動詞。ある組織やシステムが別の構造に密接に統合されることを指します。"}]}, {"title_ja": "アジアが「アメリカ第一主義」との共生を学んだ方法", "title_en": "How Asia Learned to Live With \"America First\"", "summary_ja": "アジアの同盟国は、中国からの存在的脅威に直面し米国の安全保障保証が不可欠であると理解しているため、トランプの取引的アプローチにヨーロッパの同盟国よりも適応している。東欧に緩衝地帯を持つヨーロッパ諸国は防衛支出を優先せず、米国の利己的でない外交政策の変化に対応していない。著者は、アジアの現実的態度が多極化する世界でヨーロッパよりもこれらの国をより安全にすると主張している。", "summary_en": "Asian allies have adapted more successfully to Trump's transactional approach than European counterparts because they face existential threats from China and understand that U.S. security guarantees are essential. European nations, sheltered from direct threats and accustomed to prioritizing welfare spending over defense, remain unprepared for a less benign American foreign policy. The author argues that Asian pragmatism positions these countries to be more secure than Europe in an increasingly multipolar world.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/how-asia-learned-live-america-first", "state_media": false, "category": "オピニオン", "full_text": "Western Europe is reeling in the face of U.S. President Donald Trump’s transactionalism, unilateralism, and unpredictability. U.S. allies on the continent have bristled at an American president unsentimental about decades-long alliances and uninterested in the storied history of transatlantic cooperation. In Berlin, Madrid, Paris, and other western European capitals, leaders are either struggling to manage the risk posed by an antagonistic leader in Washington or deferring any hard choices about how to adapt in the hope that a more friendly successor takes office in 2028.\nJapan, the Philippines, South Korea, Taiwan, and Thailand are also wary of Trump. But the United States’ Asian allies have been far less pessimistic than their European counterparts. They see risks, too, but they are also focused on realizing unique opportunities that are emerging from the disruption that Trump is causing. By accepting the Trump administration’s “America first” approach, the United States’ Asian allies believe they can obtain special benefits, such as stronger security guarantees and collaboration in sectors including artificial intelligence and critical minerals processing.\nAsian allies’ willingness to work with Trump on his terms is rooted in a sense of vulnerability that European allies neither feel nor understand. U.S. allies in Asia must deal with a unique threat from China, which is an economic superpower that possesses Asia’s most formidable military and eyes a return to regional preeminence. The presence of the United States and the security that it can provide is the only check that these states have against Chinese dominance. They are willing to take unequal deals from Washington because they know that taking orders from Beijing is far worse. Countries in western Europe, by contrast, have been outwardly disdainful of American power and culture, unwilling to recognize that many of the changes in Washington are the product of shifting structural realities rather than the president’s whim. It no longer makes sense for the United States to allow western Europe’s outsize role in defining the rules and norms of the global order because rising powers such as China are exploiting these rules and norms at the United States’ expense.\nThe divergence in attitudes between Asia and Europe has shaped the two continents’ respective abilities to handle Trump and the world he has wrought. Major allies in western Europe—especially Belgium, France, Germany, Italy, the Netherlands, Portugal, and Spain—were caught flat-footed when the United States turned away from a selfless and benign internationalism. Washington’s Asian allies, in contrast, were ready. Asian governments are looking at the world as it is, whereas western European ones still see the world as it once was—or how they wish it were. In a world increasingly shaped by Chinese power, the willingness of U.S. allies in Asia to deal with Washington is likely to make them stronger and more secure than European powers will be.\nTOO CLOSE TO COMFORT\nSince the collapse of the Soviet Union and the end of the Cold War, western Europe has enjoyed a peace dividend. Countries in this region have acted as though they do not have any serious security or existential threats. Even after Russian President Vladimir Putin embarked on his westward expansion, beginning with the annexation of Crimea from Ukraine, in 2014, major powers in western Europe were reluctant to invest in their own security. From 2014 to 2019, according to data collected by the Stockholm International Peace Research Institute, defense spending as a share of GDP in the four largest military spenders in continental western Europe—Germany, France, Italy, and Spain—remained largely stagnant. Spending grew slowly after 2019; only after the 2022 Russian invasion of Ukraine did these countries start to seriously address the need to build up their defenses.\nInstead of investing in their militaries, western European countries have prioritized their vast welfare states. They spend more than many other countries on programs such as pensions, health care, unemployment benefits, and disability payments. In 2024, according to estimates from the Organization for Economic Cooperation and Development, Germany, France, Italy, and Spain spent 27.9 percent, 30.6 percent, 27.6 percent, and 25.9 percent of GDP, respectively, on public social spending. The average among members of the OECD, which includes 38 high- and middle-income countries committed to democracy and free markets, was 21.2 percent of GDP. If leading western European powers are to meet their defense commitments—Germany plans to spend 3.5 percent of its GDP on defense by 2029—they will need to reduce their social spending. But there is no clear evidence yet that they are planning to do so.\nWestern European countries have been able to prioritize welfare over security because they are insulated from direct threats. They are shielded by the territorial buffer of eastern Europe and ", "translation_ja": "", "vocab": [{"word": "transactionalism", "definition": "取引的アプローチ；感情や歴史的な絆よりも、利益と相互交換に基づいた国際関係の方針を指す。"}, {"word": "unilateralism", "definition": "一国主義；国際協力や合意に頼るのではなく、単独で行動する外交方針。"}, {"word": "disdainful", "definition": "軽蔑的な；相手を見下し、尊重していない態度や感情を表現する形容詞。"}, {"word": "preeminence", "definition": "優位性、卓越性；特定の分野や地域での最高の地位や支配力を意味する。"}, {"word": "flat-footed", "definition": "準備不足で、予期しない状況に対応できていない状態を指すイディオム。"}, {"word": "stagnant", "definition": "停滞している；成長や進展がなく、変化がない状態を表現する。"}, {"word": "buffer", "definition": "緩衝地帯；二つの対立する勢力の間に位置し、衝撃を和らげる役割を果たす地域。"}]}, {"title_ja": "米国は依然として中国に対して優位性を保持している", "title_en": "America Still Has the Upper Hand Over China", "summary_ja": "著者は、最近の貿易紛争で米国が中国に譲歩しているにもかかわらず、米国が構造的優位性、特に中国の米国と同盟国の技術と市場への依存により、より大きな長期的経済的影響力を保有していると主張している。しかし、米国はこの影響力を効果的に行使するには、一方的な関税を課して同盟国を遠ざけるのではなく、同盟国と経済政策を調整する必要がある。", "summary_en": "Despite recent U.S. concessions to China in trade disputes, the author argues that America retains greater long-term economic leverage due to structural advantages, particularly China's dependence on U.S. and allied technology and markets. However, the U.S. can only effectively use this leverage by coordinating economic policy with allies rather than imposing unilateral tariffs that alienate them.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/america-still-has-upper-hand-over-china", "state_media": false, "category": "オピニオン", "full_text": "By most accounts, China has the upper hand in its growing economic confrontation with the United States. In April 2025, after Washington levied heavy tariffs on China, Beijing responded with export restrictions on rare-earth minerals that led the Trump administration to back down. And in May 2026, when U.S. President Donald Trump and Chinese leader Xi Jinping met in Beijing, the American delegation fell short of even its very limited objectives. The most notable success Trump could point to from the summit was Beijing’s agreement to buy 200 Boeing aircraft, but even that was a big step down from the 500 he had touted before the trip. Since then, many observers have suggested that the United States’ position has weakened further. China has tightened export controls on rare earths, while leading voices in Washington have cast doubt on the effectiveness of U.S. tools to restrict exports of semiconductors.\nBut this pessimism obscures an important reality: the United States has more potential economic leverage than China does. Rather than reflecting underlying weakness, Washington’s concessions to Beijing since early 2025 are a function of China wielding its limited economic weapons effectively and the United States failing to do the same with its own more powerful arsenal. In fact, Washington maintains crucial structural advantages over Beijing—most notably because China depends on the United States and its allies for high-tech imports and to provide markets for its export-driven growth model.\nStill, to be able to use this leverage, the United States needs to act in concert with its Asian and European allies. U.S. allies share American concerns about Chinese economic statecraft and could jointly push back on Beijing. Until now, however, the second Trump administration has imposed tariffs on these allies and tried to take on China alone. Washington will be able to mount an effective response to China’s economic coercion only if it coordinates its economic statecraft with allies rather than drives them away.\nGOING ALL IN\nChina has a few powerful economic weapons at its disposal. And in the U.S.-Chinese trade war in 2025, Beijing used its most potent ones, including curtailing exports of rare earths. Since first imposing export restrictions on rare earths in April 2025, Beijing has alternately tightened and relaxed them as negotiating leverage. In November 2025, as part of a truce with Washington, China suspended some restrictions, but in June 2026, it ramped up pressure by blacklisting two flagship U.S. rare-earth companies, MP Materials and USA Rare Earth, cutting them off from imports of dual-use items that could have both civilian and military applications.\nChina controls around 70 percent of the world’s rare-earth mining production and about 90 percent of global processing capacity, which means that Washington is dependent on Beijing to source rare earths. Although the absolute value of China’s rare-earth exports to the United States is less than $1 billion annually, cutting them off threatens the many U.S. manufacturers that rely on them—and the magnets derived from them—as inputs to make goods as varied as electric vehicle motors, magnetic resonance imaging (MRI) machines, and F-35 fighter jets.\nChina also froze imports of U.S. soybeans, a major U.S. agricultural export. In 2024, more than half of U.S. soybean exports went to China; the sudden moratorium that China imposed from June to August 2025 imperiled nearly $13 billion of annual revenue and disproportionately affected politically sensitive agricultural states in the U.S. heartland. Soybeans are far and away the largest American product that relies primarily on Chinese buyers—the next largest, copper scrap, totaled only $2.8 billion in exports to China in 2024—and China has plenty of alternative suppliers of soybeans, such as Brazil, that are eager to trade.\nRare earths and soybeans, however, are outliers in the overall picture of U.S.-Chinese economic dependencies. In both cases, China can easily inflict disproportionate harm on the United States. As the economic statecraft expert Edward Fishman described in Foreign Affairs, a chokepoint requires market dominance, few alternatives, and the ability to impose pain with minimal costs. China’s rare-earth production, in particular, is a clear example of a chokepoint. But although chokepoints can be extremely effective in the near term, they are likely to weaken once they are weaponized, especially if they do not involve extremely complex technology and can be overcome by investing in alternative supply chains.\nNOT-SO-RARE EARTHS\nU.S. policymakers have long known that China had the potential to weaponize the rare-earth chokepoint, but they did little to minimize this threat. Reducing dependencies requires time, money, and political capital, and Washington was unwilling to expend these resources in sufficient quantities before China restricted exports of rare earths in April 2025.\nWashington is now developi", "translation_ja": "", "vocab": [{"word": "chokepoint", "definition": "市場支配、代替案の欠如、最小限のコストで相手に痛手を与える能力を持つ経済的な弱点。一国が他国に対して経済的圧力をかける際の支配的地位を指す。"}, {"word": "statecraft", "definition": "国家の政治的・経済的目標を達成するために用いられる戦略的な外交政策や取引手段。通常は政府間の交渉や圧力行使を含む。"}, {"word": "leverage", "definition": "相手を有利な条件で交渉に応じさせるために使える力や影響力。経済や政治の文脈では、交渉で優位に立つための手段を意味する。"}, {"word": "arsenal", "definition": "武器や手段の備蓄、または政治・経済紛争において使用可能な様々な手段や道具の集合。比喩的に戦略的リソースの総体を指す。"}, {"word": "disproportionate", "definition": "相対的な影響や被害が不均等であること。通常は予想以上に大きな悪影響をもたらす場合に用いられる。"}, {"word": "weaponized", "definition": "経済的・技術的優位性を政治的な目的のために戦略的に利用すること。通常は相手国に圧力をかけるための手段として変換されることを指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-07-27 15:47 JST";
  renderTabs();renderList();
})();
</script>
