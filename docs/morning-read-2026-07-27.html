cupied West Bank was divided into three areas – A, B and C.\nThe accords also provided for the formation of the Palestinian Authority (PA) – an administrative body charged with governing Palestinian internal security, administration and civilian affairs in areas of self-rule, for a five-year interim period.\nArea A initially comprised 3 percent of the West Bank and grew to 18 percent by 1999. In Area A, the PA controls most affairs.\nArea B represents abo", "translation_ja": "", "vocab": [{"word": "ethnic cleansing", "definition": "特定の民族集団を地域から強制的に追放または排除すること。歴史的に深刻な人権侵害と見なされている。"}, {"word": "vandalised", "definition": "建物や物品を意図的に破壊または汚損すること。犯罪行為の一種。"}, {"word": "bolstered", "definition": "何かを強化する、支援する、または強力にすること。政治的または社会的な政策を推進する文脈でよく使用される。"}, {"word": "outposts", "definition": "主要な領土から離れた場所に建設された小規模な前進基地または入植地。軍事または政治的な影響力を拡大するために使用される。"}, {"word": "interim period", "definition": "一時的な期間、または暫定的な時間枠。最終的な合意または変化が実現されるまでの過渡期。"}, {"word": "incursions", "definition": "他者の領土や権利への不正な侵入または侵害。通常、敵対的または暴力的な性質を持つ。"}]}, {"title_ja": "イスラエルの入植者・兵士戦略：ウェストバンク植民地化", "title_en": "Israel's Settler-Soldier Strategy: Colonization of West Bank", "summary_ja": "このアルジャジーラの論説記事は、ウェストバンクのイスラエル入植者による暴力は散発的な無法行為ではなく、軍事作戦、入植者侵攻、行政的な土地収用を伴う意図的な植民地化戦略であると主張しています。政府がイスラエル兵士と入植者の両者に相互的保護と支援を提供していると述べています。", "summary_en": "This Al Jazeera opinion piece argues that Israeli settler violence in the West Bank is not sporadic lawlessness but a deliberate colonization strategy involving coordinated military operations, settler incursions, and administrative land seizures. The article claims Israeli soldiers and settlers work in sequence to weaken Palestinian communities, with the government providing mutual protection and support to both groups.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/opinions/2026/7/27/how-israel-uses-settler-soldier-terror-to-colonise-the-west-bank?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "How Israel uses settler-soldier terror to colonise the West Bank\nSettler attacks are not isolated incidents. They are all part of a strategy to grab land and colonise.\nThe violent scenes playing out in the West Bank over the past few days are painfully familiar. Settlers setting fire to homes and places of worship, Palestinian villages coming under vicious attacks, families forced to leave their homes at gunpoint with nothing but what they can carry, and the Israeli army carrying out lethal raids.\nThis latest episode of violence is framed as a consequence of a deadly confrontation in the village of Tal in the northern West Bank, where Israeli settlers who attacked the community were confronted by Palestinian men. Two settlers died.\nIn its aftermath, Israeli Prime Minister Benjamin Netanyahu pledged to increase military operations in the West Bank to target “terrorist hotbeds” while Defence Minister Israel Katz said the expansion of Israeli outposts and settlements in the West Bank is now a strategic and important aspect of Israeli security.\nListening to Israeli officials, one may think Israeli military operations and settlements in the West Bank are a reaction. But they are not. They are a strategy – a strategy of colonisation.\nThe settler-soldier sequence\nFor years, the presence of the Israeli military in the West Bank was justified by the presence of Israeli settlers. Perhaps this may have held some truth in the past, but within the past five years, the distinction between a soldier and an average Israeli settler has diminished to the fact that one wears a uniform and has a chain of command while the other dresses in jeans and can shoot on a whim.\nThere may be little difference between the two, but each plays a specific role in an important strategic sequencing.\nFirst, the Israeli army weakens Palestinian communities through military operations that sweep through villages and towns, destroying infrastructure, detaining, torturing and even killing Palestinians. Then, the settler incursions increase and finally the administrative arm of the government consolidates territorial reconfiguration.\nThis is what happened in Jenin. The Israeli army launched several deadly offensives on the city and the refugee camp, the latest being “Operation Iron Wall” in 2025. Then the settlers came. Today, three new Israeli settlements are being built near the city with others under way in Tulkarem.\nNot only do the Israeli government and security apparatus provide protection to Israeli settlers, but the reverse is also true. For years, Israeli soldiers who have committed torture, rape and murder against Palestinians were acquitted due to support and lobbying from settler groups.\nThis is precisely why reporting on Israeli violence in the West Bank as “settler violence” does not tell the full story. Settler violence suggests sporadic lawlessness that operates outside the state, rather than a well-thought-out strategy of colonisation of illegally occupied land.\nPermanent colonial terror\nFor years, Palestinians spoke of settler violence as a warning of what might come. Every year of the past decade set new records in settlement expansion, land dispossession, frequency of Israeli violence and Palestinians killed.\nEvery olive harvest disrupted, every outpost expanding over the hills was understood as part of a gradual encroachment whose ultimate consequences remained just over the horizon.\nToday, that horizon has collapsed. The Palestinians are living in a constant state of colonial terror, besieged and abandoned. They are expected to survive under conditions in which women are forced to endure miscarriages while stuck at checkpoints, where schools are teargassed by the army, where children never get to school because settlers attack their bus. Every day the space to exist safely shrinks.\nWhile land is stolen, Palestinian bodies are treated as objects through which Israelis perform domination, publicly and repeatedly. Stories of displacement, torture and humiliation punctuate daily Palestinian life.\nPerhaps this is precisely why last week, Forouq Ramadan, a resident of Tal, decided to capture a gun from an invading Israeli settler and shoot him.\nThat moment is significant because Israel’s violent response in the West Bank over the weekend was not really over the fact that an Israeli was killed. It was over the idea that a Palestinian man could successfully capture the weapon of an armed Israeli settler and shoot him dead.\nIn any case, this violent episode is now used as yet another opportunity to accelerate the colonisation project. This is why it should not be identified as an “escalation”. It is not a separate incident of settler violence; it is part and parcel of a colonisation strategy.\nIsrael’s hunger for land\nWhat happened in Tal on Thursday and what is happening in the West Bank today cannot and should not be divorced from what’s been happening regionally.\nSettler violence, genocidal military campaigns, illegal eviction orders", "translation_ja": "", "vocab": [{"word": "colonization", "definition": "ある地域を政治的・経済的に支配下に置く過程、または領土拡張を目的とした組織的な占領戦略を指します。この記事では、イスラエルがパレスチナ領土を支配下に置く戦略的プロセスの意味で使用されています。"}, {"word": "encroachment", "definition": "徐々に他者の領域や権利に侵入・侵害すること、または段階的な領土侵食を意味します。この記事では、入植地拡大による段階的なパレスチナ領土の蚕食を指しています。"}, {"word": "dispossession", "definition": "他者から財産や権利を奪い取ること、または強制的に所有権を失わせる行為を意味します。この記事では、パレスチナ人から土地を奪う行為を指します。"}, {"word": "consolidate", "definition": "権力や支配を強化・統合することを意味します。この記事では、政府が軍事作戦と入植者活動を通じて領土支配を強化することを指しています。"}, {"word": "acquitted", "definition": "法廷で無罪と判決されること、または告発から解放されることを意味します。この記事では、イスラエル兵士が暴力行為で起訴されても無罪とされることを指しています。"}, {"word": "besieged", "definition": "敵に包囲・遮断された状態にあること、または圧迫され窮地に追い込まれた状態を意味します。この記事では、パレスチナ人が軍事的に包囲・抑圧されている状態を指しています。"}]}, {"title_ja": "ベネズエラがICC脱退、グローバルサウス諸国への偏見を非難", "title_en": "Venezuela Withdraws from ICC, Citing Bias Against Global South", "summary_ja": "ベネズエラは国際刑事裁判所（ICC）から脱退し、グローバルサウス諸国に対する偏見があると非難している。この決定はICCが内部的な指導部危機と複数国からの政治的圧力に直面している最中に行われた。", "summary_en": "Venezuela is leaving the International Criminal Court, accusing it of showing bias against Global South nations. The withdrawal occurs as the ICC simultaneously faces internal leadership challenges and significant political pressure from multiple countries.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/7/27/why-venezuela-is-leaving-the-icc?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Why Venezuela is leaving the ICC\nWhy Venezuela is leaving the ICC\nVenezuela is withdrawing from the International Criminal Court, accusing it of bias against the Global South. The move comes as the ICC faces a leadership crisis and mounting political pressure. Al Jazeera’s Noor Wazwaz explains.\nPublished On 27 Jul 2026", "translation_ja": "", "vocab": [{"word": "withdrawing", "definition": "組織や協定から正式に脱退すること。国家レベルでは、国際条約や国際機関から公式に抜け出すプロセスを指す。"}, {"word": "bias", "definition": "公平でない、不公正な態度や判断。特定の立場や集団に対する偏った見方や差別的扱いを示す。"}, {"word": "Global South", "definition": "開発途上国や経済的に後発の国々を指す用語。歴史的な植民地支配や経済格差によって定義されることが多い。"}, {"word": "leadership crisis", "definition": "組織の指導部において深刻な問題や混乱が生じた状態。指導者の辞任や信頼喪失などを含む。"}, {"word": "mounting", "definition": "徐々に増加する、積み上がっていく。圧力や問題が次第に高まる状況を表す。"}]}, {"title_ja": "スリランカの活動家がインド学生のNEET試験漏洩抗議に連帯", "title_en": "Sri Lankan activists express solidarity with Indian students protesting NEET exam leak", "summary_ja": "スリランカの約200人の活動家、労働組合員、市民社会組織がNEET試験問題漏洩に抗議するインド学生への支持声明を発表した。声明は警察暴力にもかかわらず学生の回復力を称賛し、有意義な改革のため政府への圧力維持を促している。スリランカの活動家は自国の経験と比較し、不十分な教育改革の受け入れに警告を発した。", "summary_en": "Nearly 200 Sri Lankan activists, trade unionists, and civil society organizations have issued a statement supporting Indian students protesting the NEET examination paper leak and broader education sector issues. The statement praises the students' resilience despite police brutality and urges them to maintain pressure on the government for meaningful reforms. Sri Lankan activists drew parallels with their own experience, warning against accepting inadequate education reforms.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/sri-lankan-activists-trade-unionists-express-solidarity-with-indianstudents/article71273126.ece", "state_media": false, "category": "社会", "full_text": "Nearly 200 activists, social movements, civil society organisations, and trade unions in Sri Lanka have expressed solidarity with students in India, who were protesting and voicing serious concern over the NEET examination paper leak and broader issues facing the education sector.\n“The voice of India’s youth has been unstoppable, despite ridicule from the highest authorities and brutal police violence,” the statement, issued on Monday (July 27, 2026), said.\nApplauding the student protesters for “sustaining the struggle, despite heavy odds and police brutality”, the statement said this could be a “significant step” towards achieving meaningful education reforms in India.\n“However, learning from the Sri Lankan and regional experience, ensure that you remain vigilant and maintain pressure on the Government to deliver on its promises,” the signatories cautioned the Indian protesters. The signatories pointed to Sri Lankan youth gearing up to respond to “half-baked” education reforms that they said were not based on any proper public consultations and said, “We take heart in the struggle of our sisters and brothers in India.”\nContending that the Bharatiya Janata Party, under Prime Minister Narendra Modi’s leadership, has been adopting “blatantly fascist methods of governance”, the activists said the students and youth of India “are the harbingers of change India is in dire need of.”\n“Dharmendra Pradhan has fallen. Modi and the BJP have been shaken! It is now time for the youth and working class of the South Asian region to unite and fight alongside one another! Jai Bhim,” they said.\nMeanwhile a small group of activists gathered outside the Indian High Commission in Colombo on Monday (July 27, 2026) to express solidarity with Indian students and condemn the police violence unleashed on protesting students.\nThey carried placards with messages such as “The power of the people is always stronger than the people in power”, “Educate! Agitate! Organise!”, “Modi, stop the witch hunt of student protesters” and “The protest is not anti-national, your silence is”.\nPublished - July 27, 2026 07:41 pm IST", "translation_ja": "", "vocab": [{"word": "solidarity", "definition": "共通の目的や利益に基づいて、団結や協力すること。特に政治的または社会的運動における統一的な支持や共感を表す。"}, {"word": "brutality", "definition": "暴力的で残酷な行為や振舞い。法執行機関による過度な力の使用を指すことが多い。"}, {"word": "vigilant", "definition": "警戒心を持ち、危険や問題に対して注意深く見張る状態。政治的文脈では、権力者の約束の履行を監視することを意味する。"}, {"word": "signatories", "definition": "文書や声明に署名した人々や団体。正式な合意や宣言に参加した当事者を指す。"}, {"word": "fascist", "definition": "独裁的で権威主義的な政治体制を支持する、または関連する。個人の自由や民主的プロセスを制限する統治方法を特徴とする。"}, {"word": "harbingers", "definition": "変化や重要な出来事の前触れや先駆けとなるもの。将来の傾向や変化を示す兆候を指す。"}, {"word": "witch hunt", "definition": "不公正で証拠不十分な探索や迫害。特定のグループに対する無分別で害のある追跡活動を意味する。"}]}, {"title_ja": "中国、米国の「強制労働」関税に反対し撤廃を要求", "title_en": "China Opposes U.S. 'Forced Labour' Tariffs, Calls for Cancellation", "summary_ja": "中国商務省は、強制労働を理由とした米国による中国製品への12.5%の新関税は不当で保護主義的だと反発した。この関税は60の貿易相手国に課されたものである。中国は対話の意思を示しつつ、報復措置を取る権利を留保している。", "summary_en": "China's Commerce Ministry rejected new U.S. tariffs of 12.5% on Chinese goods, claiming they are unjustified and protectionist measures. The tariffs were imposed on 60 trading partners over alleged failure to curb forced labour imports. China signalled willingness to dialogue while reserving the right to take countermeasures.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/china-opposes-us-forced-labour-tariffs-calls-for-them-to-cancelled/article71273031.ece", "state_media": false, "category": "経済", "full_text": "China's Commerce Ministry said on Monday (July 27, 2026) that new U.S. tariffs imposed on Chinese goods over alleged forced labour were unjustified and amounted to protectionism, and urged Washington to remove them.\nAlso read | 45% of Indian exports to the U.S. will not face new 10% tariffs, says Commerce Ministry\nOn Friday (July 24, 2026), the United States imposed new tariffs of 10% and 12.5% on goods from 60 trading partners, including the EU and China, alleging those countries failed to curb imports made by forced labour. China was assigned a 12.5% rate.\nThe new U.S. duties could risk undermining a fragile trade truce reached between the world's two largest economies last year and came as the two sides prepare for a possible visit to the U.S. by Chinese President Xi Jinping in September.\nThe Commerce Ministry, in a statement, accused Washington of long manipulating the issue of forced labour, calling the new tariffs a typical act of unilateralism and protectionism, but also signalled willingness to continue dialogue \"based on mutual respect, equality and mutual benefit\" to address concerns.\n\"This time, it [Washington] has again initiated a Section 301 investigation and imposed unilateral tariffs on the grounds of 'forced labour,' which is a typical act of unilateralism and protectionism, and China firmly opposes it,\" the ministry said.\n\"China has consistently opposed forced labour and has established a comprehensive system of labour laws and regulations to resolutely prevent and combat forced labour practices. In contrast, the U.S. has not only failed to ratify the 1930 Forced Labour Convention, but has also long manipulated the issue of \"forced labour\"\".\nIt said Washington had pledged during trade talks that replacement tariffs on Chinese goods would not exceed 20%, noting that the new 12.5% tariff imposed under the forced-labour probe remained within that limit.\n\"China urges the U.S. to correct its erroneous practices and completely remove the relevant unilateral tariff measures,\" the Ministry said.\nIt said it reserved the right to take all necessary measures as it assessed further U.S. actions.\n\"It's hoped the U.S. will work with China in the same direction to implement consensus reached in bilateral trade talks, narrow differences, continuously reduce the problem list and lengthen the cooperation list,\" the Ministry said.\nPublished - July 27, 2026 07:18 pm IST", "translation_ja": "", "vocab": [{"word": "unilateralism", "definition": "一方的な行動や政策のこと。国際関係において、他国との合意や協議なしに一国が独断的に行動することを指す。"}, {"word": "protectionism", "definition": "自国の産業を保護するため、輸入品に高い関税をかけたり規制を行う経済政策のこと。"}, {"word": "fragile", "definition": "壊れやすく、不安定な状態を表す。ここでは脆弱な貿易休戦を意味し、簡単に崩れる可能性がある。"}, {"word": "ratify", "definition": "条約や協定などを正式に批准すること。国家指導者が公式に承認し、法的に有効にするプロセスを指す。"}, {"word": "manipulation", "definition": "自分の都合のいいように巧妙に扱ったり支配したりすること。ここでは米国が強制労働問題を政治的に利用していることを示唆している。"}, {"word": "consensus", "definition": "関係者全員が合意・同意した状態のこと。複数の当事者が共通の見解や合意に達することを意味する。"}]}, {"title_ja": "イラン、海峡支配を主張し米国との交渉を拒否 中東紛争の中", "title_en": "Iran Says It Controls Strait, Rejects U.S. Talks Amid West Asia Conflict", "summary_ja": "イラン外務省は月曜日、週末の戦闘一時停止にもかかわらず、米国と現在交渉していないと述べた。この停戦により、13夜連続の米軍による空爆の後、ペルシャ湾の海運と石油産業に一時的な救済をもたらした。米国当局者は軍事的準備を維持しながら交渉の余地を与える意思を示した。", "summary_en": "Iran's Foreign Ministry stated on Monday that it is not currently negotiating with the United States, despite a temporary halt in fighting over the weekend. The ceasefire provided relief to Gulf shipping and the oil industry after 13 consecutive nights of U.S. military strikes. U.S. officials indicated willingness to give negotiations space while maintaining military readiness.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-israel-us-war-july-27-2026-latest-updates-strait-of-hormuz-donald-trump-oil-prices-today/article71271253.ece", "state_media": false, "category": "政治", "full_text": "Iran’s Foreign Ministry on Monday (July 27, 2026) said it was not currently involved in negotiations with the United States, despite a halt in recent fighting between the two sides.\nIran and the United States held their fire on Sunday (July 26, 2026), handing Gulf shipping and the oil industry a respite from missile strikes as Donald Trump’s UN envoy said the president was “giving talks some space”.\nAlso read | Iran halts ‘retaliatory strikes’ after lull in U.S. attacks\nIran said it had halted retaliatory attacks against Washington’s allies in the Middle East, and US ambassador to the United Nations Mike Waltz told Fox News Sunday that, while forces remained “locked and loaded”, Trump would give negotiations “a little bit of room”.\nAlso read | Iran says progress in Oman talks on Hormuz Strait management\nPrior to Friday (July 24, 2026), the U.S. military had carried out strikes on Iran for 13 consecutive nights, in the largest rekindling of the almost five-month-old war since an April ceasefire. Friday and Saturday nights passed without bombing.\nFollow for updates:", "translation_ja": "", "vocab": [{"word": "retaliatory", "definition": "報復的な、仕返しの。相手の攻撃に対して行われる攻撃や措置を指す。"}, {"word": "respite", "definition": "一時的な休息や中断。困難や苦しい状況から一時的に解放されること。"}, {"word": "rekindling", "definition": "再び火がつくこと、再発することを意味する。紛争や戦闘が再び激化することを指す。"}, {"word": "strait", "definition": "海峡、狭い水路。二つの陸地を分ける海洋通路で、海運や戦略的に重要な場所。"}, {"word": "locked and loaded", "definition": "準備完了の状態、戦闘準備ができている。武器が装填され、いつでも発射できる状態を示す。"}, {"word": "envoy", "definition": "特使、使者。政府を代表して外交任務を行うために派遣される人。"}]}, {"title_ja": "2032年からのメンズT20ワールドカップはさらに拡大される可能性", "title_en": "Men's T20 World Cup Could Expand Further From 2032", "summary_ja": "新しいレポートによると、メンズT20ワールドカップは2032年版から大幅な拡大を予定しているとのこと。この変更は、トーナメントの規模と参加国をさらに大きくすることを目指しています。拡大計画の詳細は、国際T20クリケットの将来を変える予定です。", "summary_en": "The Men's T20 World Cup is set to undergo significant expansion starting from the 2032 edition, according to a new report. The changes aim to make the tournament even larger in scope and participation. Details of the expansion plan are expected to reshape the future of international T20 cricket.", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/sports/cricket/mens-t20-world-cup-could-get-bigger-2032-report-10806185/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "インドの歴史とファインダイニングが融合した最高のヘリテージレストラン", "title_en": "Best Heritage Restaurants in India for History and Fine Dining", "summary_ja": "インディアン・エクスプレスはインド全土の最高のヘリテージレストランを紹介し、歴史的な雰囲気と一流の料理を組み合わせた施設を探索しています。これらのレストランは復元された植民地時代の建築や伝統的な空間でファインダイニングを楽しみながら、インドの豊かな文化遺産を体験する機会を提供しています。", "summary_en": "Indian Express explores the finest heritage restaurants across India that blend historical ambiance with exceptional cuisine. These establishments offer diners an opportunity to experience India's rich cultural past while enjoying fine dining in restored colonial and traditional spaces.", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/lifestyle/destination-of-the-week/best-heritage-restaurants-in-india-to-visit-for-history-and-fine-dining-10780213/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カルナータカ高等裁判所：「強制措置なし」は逮捕禁止を意味し、捜査停止ではない", "title_en": "'No coercive steps' means no arrest, not a stay on probe: Karnataka High Court", "summary_ja": "カルナータカ高等裁判所は、刑事訴訟において「強制措置なし」という命令は逮捕を禁止することを意味するが、捜査そのものを中止させるものではないと明確にした。同裁判所の判決は、捜査活動と逮捕・勾留などの強制措置を区別している。この解釈は、刑事法におけるこのような命令の範囲に関する重要な指針を提供するものである。", "summary_en": "The Karnataka High Court clarified that an order restraining 'coercive steps' in criminal proceedings means a prohibition on arrest, but does not halt the investigation itself. The court's ruling distinguishes between investigative activities and coercive measures like arrest or detention. This interpretation provides important guidance on the scope of such orders in criminal law.", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/cities/bangalore/karnataka-hc-coercive-steps-vs-precipitative-action-explained-10806182/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カナダは毎夏より大規模な森林火災に備える必要がある", "title_en": "Canada Must Prepare for Larger Wildfires Every Summer", "summary_ja": "気候変動により、カナダは季節的な火災活動がより激化し、煙害が深刻化する未来に直面している。国はより大規模な火災に対応するための包括的な準備戦略を構築する必要がある。専門家は、公衆衛生とインフラを保護するために適応と予防措置が重要であると警告している。", "summary_en": "Canada faces a future of increasingly severe wildfires and smoke pollution as climate change intensifies seasonal fire activity. The country must develop comprehensive preparedness strategies to handle larger-scale fires that are becoming an annual occurrence. Experts warn that adaptation and prevention measures are critical for protecting public health and infrastructure.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihwJBVV95cUxNVVY5WGtCMGdPTTc3bHloTzNtYm55akV5dFJ5R1VqRW5UcW5TSEJiWWU1a2d1OS1HVDJzR3cwbHllMXctUWtBcnZIQ1pQeUhmUXV1cDNvUXhoM18xV21lLWJGRXdwbnRCUHVMYTZJbThvazdXeWdlM01xOG5GUmtJR0s3V3dqdVFaUkVGUm1hT1E0d1VrVlltY05Vb1lwQ2tjVHN2bFdYd2hoVGJJSk9WVTdzNjRZenlQVWF4bUs1MEF0ZUFxeHJLX3FCSkxRY21OcG13UU9WZkhwQmk1dmZlQWVBdTFuWUdFYzZZbDk5V0ExOUpvV0pvZjhhOEtmaDVPREJTWHpWUQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トロント、ユダヤ系所有のベーカリーで窓が割られ銃撃される", "title_en": "Window broken, gunshot fired at Jewish-owned bakery in Toronto", "summary_ja": "トロント警察によると、ユダヤ系所有のベーカリー「Kiva's」で窓が割られ、銃撃事件が発生した。この事件は同市のユダヤ系所有企業を狙った暴力事件のもう一つの事例である。当局が捜査を進めている。", "summary_en": "A window was broken and a gunshot was fired at Kiva's, a Jewish-owned bakery in Toronto, according to police reports. The incident marks another instance of violence targeting a Jewish-owned business in the city. Authorities are investigating the attack.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi8wFBVV95cUxQZk9Ua atives for Centennial Celebration", "summary_ja": "ブラジル最大のメディア企業グルーポ・グローボが、創立100周年を記念する特別な取り組みを計画しています。同社は歴史的なマイルストーンを祝うため、記念プロジェクトとイベントを準備しています。", "summary_en": "Grupo Globo, Brazil's largest media conglomerate, is planning special initiatives to mark its 100-year anniversary. The company is preparing commemorative projects and events to celebrate this milestone in its history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セギロラ・リソーシーズが青年にミニバスと経営支援を提供", "title_en": "Segilola Resources Empowers Youth with Minibuses and Business Training", "summary_ja": "セギロラ・リソーシーズ・オペレーティング・リミテッド（SROL）は青年向けエンパワーメント計画第2段階として3つのホストコミュニティに9台の商用ミニバスを配分しました。また以前の受益者にも発電機や製造機器を提供し、持続可能な生計開発への取り組みを示しています。", "summary_en": "Segilola Resources Operating Limited distributed nine commercial minibuses to youth in three host communities under its Youth Empowerment Programme's second phase. The company also provided equipment and materials to previous beneficiaries, including a generator for an aluminium fabricator and a filing machine for a cobbler, demonstrating its commitment to sustainable livelihood development.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/898549-segilola-resources-operating-ltd-hands-over-commercial-minibuses-and-upskills-artisans-in-host-communities.html", "state_media": false, "category": "社会", "full_text": "Segilola Resources Operating Limited (SROL), a subsidiary of Thor Explorations Ltd. and operator of Nigeria’s first large-scale commercial gold mine, has handed over nine commercial minibuses under the second phase of its Youth Empowerment Transport Scheme and provided targeted business support to beneficiaries across its host communities as part of its 2026 Youth Empowerment Programme.\nThe second phase builds on the success of the maiden edition, reinforcing SROL’s commitment to expanding access to sustainable income-generating opportunities for members of its host communities. Under the second phase, SROL presented three commercial minibuses each to beneficiaries from Iperindo, Odo-Ijesha, and Imogbara. The vehicles will enable beneficiaries to establish commercial transportation businesses, creating sustainable livelihoods and contributing to economic activity in their communities.\nBeyond expanding its transport empowerment initiative, SROL also provided business support to beneficiaries of previous editions of the Youth Empowerment Programme. From Imogbara community, Kayode Temitope, an aluminium fabricator who received equipment under the 2025 Youth Empowerment Programme, was provided with a generator to improve productivity and business operations. From Iperindo community, Akinrotimi Seun Michael, a cobbler who completed both beginner and advanced vocational training under the 2023 programme, received materials and a filing machine to increase production capacity and support business growth.\nSpeaking during the handover ceremony, Sikiru Haruna, an engineer and Mines Manager at SROL, reaffirmed the company’s commitment to empowering host communities through sustainable livelihood initiatives. He said, “At Segilola Resources Operating Limited, we believe lasting community development begins with investing in people. Through our Youth Empowerment Programme, we are equipping members of our host communities with the tools, resources, and opportunities they need to build sustainable businesses, improve their livelihoods, and contribute meaningfully to the economic development of their communities. Our commitment is to create opportunities that continue to deliver value long after today’s intervention.”\nExpressing his appreciation, James Adejugbagbe, a beneficiary of the second phase of SROL’s Youth Empowerment Transport Scheme, said, “Receiving this vehicle is a life-changing opportunity for me and my family. It gives me a reliable means of earning a living and the confidence to build a sustainable business. I sincerely appreciate Segilola Resources Operating Limited for investing in our future and creating opportunities that will positively impact our communities. We are committed to making the most of this opportunity and using it to improve our lives and support our families.”\nThe Youth Empowerment Programme is implemented under SROL’s Community Development Agreement (CDA). Through the CDA, the company works in partnership with host communities to implement initiatives that promote sustainable livelihoods and inclusive socio-economic development. By investing in enterprise development and livelihood opportunities, SROL continues to strengthen local economies and create lasting impact across its host communities in Osun State.", "translation_ja": "", "vocab": [{"word": "subsidiary", "definition": "親会社の支配下にある別の企業。法的には独立しているが、経営上は親会社の傘下にあります。"}, {"word": "empowerment", "definition": "個人や団体に権限や能力を与え、自立を促すこと。社会開発や経済支援の文脈で用いられます。"}, {"word": "sustainable", "definition": "長期間にわたって維持・継続可能なこと。環境や経済の文脈で、将来世代のニーズも考慮した取り組みを指します。"}, {"word": "livelihood", "definition": "生計や生活手段。個人や家族が生活を維持するための収入源や経済活動を意味します。"}, {"word": "beneficiary", "definition": "援助や支援の恩恵を受ける人。プログラムや制度から利益を得る対象者を指します。"}, {"word": "Community Development Agreement", "definition": "企業と地域社会が共同で実施する持続的な発展計画。採鉱企業がホストコミュニティと結ぶ協定の一形式です。"}, {"word": "enterprise development", "definition": "起業や事業拡大を支援すること。個人や小規模事業の成長を促進する施策を指します。"}]}, {"title_ja": "アクワイボム州NUJ、前議長イスラエル・ウモーの名を冠した会議ホール命名", "title_en": "Akwa Ibom NUJ Names Conference Hall After Former Chairman Israel Umoh", "summary_ja": "ナイジェリアジャーナリスト連盟（NUJ）アクワイボム州支部は、2004年から2007年に議長を務めた前議長イスラエル・ウモーの組織インフラ開発への貢献を認め、会議ホールに彼の名前を付けました。ウモーの任期中に、NUJ事務局舎の完成と2,000席の講堂の建設が行われました。ウモーは生前にこの栄誉を受けることができたことに驚きと喜びを表明しました。", "summary_en": "The Nigeria Union of Journalists (NUJ) in Akwa Ibom State has named its conference hall after Israel Umoh, a former chairman who served from 2004 to 2007, in recognition of his significant contributions to the union's infrastructure development. During his tenure, Umoh completed the NUJ secretariat building and initiated construction of a 2,000-seat auditorium. Umoh expressed surprise at the honor, stating he was pleased to receive recognition during his lifetime.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/898544-akwa-ibom-nuj-names-hall-after-former-chairman.html", "state_media": false, "category": "社会", "full_text": "The Nigeria Union of Journalists (NUJ), Akwa Ibom State Council, has named its conference hall after a former chairman of the union, Israel Umoh, in recognition of his contributions to the union’s infrastructural development.\nThe facility, unveiled after the union’s July Congress, will now be known as the Israel Umoh Conference Hall, journalist Dianime Uko captured the moment the announcement was made in a Facebook post.\nSpeaking during the unveiling, the NUJ chairman in Akwa Ibom, Nsibiet John, said Mr Umoh deserved to be celebrated for his selfless service and visionary leadership, particularly for projects that transformed the council’s infrastructure.\nMr John recalled that during Mr Umoh’s tenure from 2004 to 2007, he completed the NUJ secretariat building, furnished the facility and secured its commissioning by the then Akwa Ibom Governor, Victor Attah, on 21 November 2006.\nHe added that the former chairman also laid the foundation and constructed the 2,000-seat NUJ Auditorium up to the lintel level, a project that was eventually completed and commissioned by Governor Umo Eno on 1 August 2025.\nAccording to Mr John, recognising Mr Umoh during his lifetime reflects the union’s commitment to celebrating excellence and rewarding impactful leadership.\nHe also commended past leaders of the council for laying the foundation for the union’s growth, saying successive administrations had collectively strengthened the NUJ in the state.\n‘I didn’t see it coming’ – Umoh\nSpeaking with PREMIUM TIMES on Monday, Mr Umoh said the honour came as a complete surprise.\n“I didn’t see it coming,” the elated former chairman told this newspaper.\n“I was shocked because I didn’t expect it. You know I left the office 21 years ago,” Mr Umoh added.\nAsked whether he had prior knowledge of the decision, he said he was not informed before the announcement.\nHe explained that the decision was announced by the NUJ state chairman at the meeting of the State Advisory Council, a body comprising former chairmen and secretaries of the union that advises the state council on critical issues.\nMr Umoh said he was particularly pleased that the recognition came during his lifetime.\n“This is a very remarkable thing that has been done by the Union for me while I’m alive. It would have been tragic if the Hall was named after me posthumously.”\nLegacy beyond the Hall\nReflecting on his tenure, Mr Umoh said he secured approval for a Journalists’ Village from former Governor Attah two weeks before leaving office and also established a cooperative society for members of the union.\nHe said the naming of the Hall after him attracted congratulatory messages from friends and associates within and outside Nigeria.\nMr Umoh, who served a single three-year term as NUJ chairman between 2004 and 2007, commended the current leadership for what he described as its foresight.\nHe urged the council to sustain efforts to strengthen the profession and to “fight quackery” within the union.", "translation_ja": "", "vocab": [{"word": "infrastructure", "definition": "社会や組織が機能するために必要な基本的な構造や設備のこと。道路、建物、通信システムなど物理的な基盤を指します。"}, {"word": "tenure", "definition": "特定の職位や地位にある期間。任期や在任期間を意味する正式な用語です。"}, {"word": "visionary", "definition": "将来を見通し、創造的で革新的な考えを持つ人または思考を表します。理想的な未来像を示すリーダーシップを指すことが多いです。"}, {"word": "commission", "definition": "建物や施設を完成させて正式に使用開始する行為。または公式に任命する、指示する意味もあります。"}, {"word": "posthumously", "definition": "人が死亡した後に起こることを表します。故人の名誉や栄誉が死後に認められる場合などに使用されます。"}, {"word": "quackery", "definition": "詐欺的で信頼性のない医学や専門知識の悪用行為。偽りの専門知識や不正な実践を指します。"}]}, {"title_ja": "バイエルサ州でAPC幹部がPDPに党籍変更", "title_en": "APC Chieftain and Supporters Defect to PDP in Bayelsa", "summary_ja": "APC幹部のガブリエル・クラウディウスは、支持者とともにバイエルサ州オグビア地方のエレベレでPDPに復党した。PDP指導部は式典で離党者らを歓迎し、党の将来の選挙見通しに自信を表明した。PDP州指導部はこの機会に、現政権の貧困対策、失業問題、青年の政治参加不足への対応を批判した。", "summary_en": "Gabriel Claudius, an APC chieftain, has returned to the PDP along with his supporters in Elebele, Ogbia Local Government Area of Bayelsa State. PDP leaders welcomed the defectors at a ceremony, describing it as a homecoming and expressing confidence in the party's future electoral prospects. PDP state leadership used the occasion to criticize the current administration's handling of poverty, unemployment, and lack of youth inclusion in governance.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/898540-bayelsa-apc-chieftain-supporters-return-to-pdp.html", "state_media": false, "category": "政治", "full_text": "A chieftain of the All Progressives Congress (APC), Gabriel Claudius, has returned to the Peoples Democratic Party (PDP) alongside his supporters in Elebele, Ogbia Local Government Area of Bayelsa State.\nThe defectors were formally received on Monday at a ceremony in Ogbia, attended by leaders of the PDP at the local and state levels.\nThe Ogbia PDP Chairman, Ofoni Morgan, described PDP as the political home of the people of the area.\nHe said that PDP remains the party that produced Nigeria’s first President from the Ijaw ethnic nationality, insisting that the party continues to enjoy widespread support in the area.\nMr Morgan described Mr Claudius as a grassroots politician whose return would strengthen the PDP in Elebele and across the Ogbia Local Government Area.\nThe PDP State Chairman, George Turnah, welcomed the defectors before presenting them to the party leadership at the state level.\nMr Turnah used the medium to call on the Bayelsa State Government to do more to tackle poverty, unemployment, and economic hardship, claiming that the administration was not doing enough to address the people’s needs.\nHe alleged that despite the increased federal allocations, many youths and women remained economically disadvantaged.\nAccording to him, Elebele has a vibrant youth population that deserves greater political inclusion and participation in governance.\nREAD ALSO: 2027: Ex-minister Tuggar denies backing Bauchi APC governorship candidate\nPDP leader in Bayelsa, Joshua Maciver, described the defection as a homecoming, saying the party was pleased to receive Mr Claudius and his supporters.\nMr Maciver said the PDP remained determined to reclaim elective positions in future elections, including Senate, House of Representatives and Bayelsa State House of Assembly seats.\nHe dismissed insinuations that the party would be weakened by recent political realignments, insisting it remained focused on victory.\nSpeaking on behalf of the defectors, Mr Claudius said the PDP was restructuring and repositioning ahead of future elections.\nHe expressed confidence that the party would emerge stronger and more competitive in the next electoral cycle.\n(NAN)", "translation_ja": "", "vocab": [{"word": "defectors", "definition": "政党や組織から別の政党や組織に乗り換える人々。政治的な転向や党籍変更を示す。"}, {"word": "chieftain", "definition": "部族や政治団体の指導者・幹部。特に地位や影響力を持つ指導的立場の人物を指す。"}, {"word": "ethnic nationality", "definition": "共通の祖先や文化を持つ民族集団。特にナイジェリアなどの多民族国家で用いられる政治・社会的カテゴリー。"}, {"word": "grassroots", "definition": "基層の、草の根レベルの。一般市民や地域コミュニティに基盤を持つことを意味する。"}, {"word": "electoral", "definition": "選挙に関連する、選挙の。投票や選挙プロセスに関わる事柄を指す。"}, {"word": "realignments", "definition": "政党や勢力の再編成や再構成。政治的な立場や同盟関係の変化を示す。"}]}, {"title_ja": "スペインとフランス、極端な熱波の中で山火事との戦闘を継続", "title_en": "Spain and France Battle Wildfires as Extreme Heat Threatens New Blazes", "summary_ja": "スペイン東部の消防士たちは、月曜日に悪化する山火事の封じ込めに取り組んでいる。極端な熱波がこの地域での新たな火災の脅威となっている。この危機により、スペイン中部とフランス南西部から数十万人の住民が避難を強いられている。", "summary_en": "Firefighters in eastern Spain are working to contain a worsening wildfire on Monday as extreme heat conditions threaten to spark additional fires across the region. The crisis has forced hundreds of thousands of people to evacuate from central Spain and southwest France. Authorities continue efforts to hold back the spreading flames amid challenging weather conditions.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/07/27/world/france-spain-wildfires-evacutions", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン支援のフーシ派、サウジアラビアを新たな紛争へ追い込む", "title_en": "Iran-Backed Houthis Push Saudi Arabia Into New Conflict", "summary_ja": "イエメンのイラン支援フーシ派民兵組織は、サウジアラビアの脆弱性を利用して同国を新たな紛争へ押し込んでいる。同グループはイエメンでの政治的譲歩を求めており、権力と資源へのアクセス拡大を狙っている。", "summary_en": "The Iran-backed Houthi militia in Yemen is exploiting Saudi Arabia's vulnerability to force the kingdom into a new conflict. The group seeks political concessions in Yemen that would increase its authority and access to resources, despite Saudi Arabia's reluctance to engage in another war.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/07/27/world/middleeast/houthis-saudi-arabia-iran-war.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ベルリンのLGBTQ+コミュニティ、テロ事件で高まる不安", "title_en": "Berlin's Gay Community Faces Growing Safety Concerns Amid Threats", "summary_ja": "ベルリンのLGBTQ+コミュニティは、イスラム過激主義によるテロと分類された殺人事件に揺らいでいます。この事件は、極右勢力を含む複数の勢力からの脅威の増加に対する既存の懸念をさらに深刻化させています。", "summary_en": "Berlin's LGBTQ+ community is experiencing increased fear and safety concerns following a killing classified as Islamist terrorism. The attack has intensified existing anxieties about rising threats from multiple sources, including far-right extremists.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/07/27/world/europe/gay-community-berlin-attack.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事地帯を開放、パレスチナ人がガザ北部への帰還開始", "title_en": "Palestinians Return to Northern Gaza After Israel Opens Military Crossing", "summary_ja": "イスラエルは人質解放をめぐる膠着状態の打開を受け、ガザを二分する軍事地帯の通過をパレスチナ難民に許可した。これにより、避難していた住民が北部の自宅への帰還を開始できるようになり、ガザ地区の人道状況における重要な進展となっている。", "summary_en": "Israel has allowed displaced Palestinians to begin crossing through a military zone that divides Gaza, following a resolution to the hostage release deadlock. The movement marks a significant development in the humanitarian situation within the enclave, as residents attempt to return to their homes in the north.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Real Estate Crisis", "summary_ja": "中国最大級の不動産開発企業であるバンケが大幅な赤字を報告し、国内の不動産セクターの問題の深刻化を示している。同社の経営難は業界全体への危機の拡大の可能性を懸念させ、市場の安定化に向けた政府の介入の可能性について疑問を生じさせている。", "summary_en": "Vanke, one of China's largest property developers, has reported a significant financial loss, signaling the deepening troubles in the country's real estate sector. The company's struggles raise concerns about whether the crisis will continue to spread across the industry and prompt questions about potential government intervention to stabilize the market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による弾片を体内に保有", "title_en": "Freed Israeli Hostages Carry Shrapnel Wounds From October 7 Attack", "summary_ja": "イスラエルの医療当局者によると、解放されたイスラエル人人質の体内には10月7日の攻撃による弾片が埋め込まれたままであるという。一部の女性は長期間隔離状態で拘束され、捕虜期間中8ヶ月間をトンネル内で過ごしていた。", "summary_en": "Released Israeli hostages still have shrapnel embedded in their bodies from the October 7 attack, according to Israeli medical officials. Some women were held in isolation for extended periods and spent eight months confined in tunnels during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エアコンの地政学", "title_en": "The Geopolitics of Air-Conditioning", "summary_ja": "世界中の熱波により、エアコンへのアクセスが政治的問題となっている。本記事は、冷房技術がいかに地政学的ダイナミクスを再構築し、適切なAC インフラを備えた国とそうでない国の間に新たな分断を生み出しているかを検証している。", "summary_en": "As heatwaves intensify globally, access to air-conditioning has become a critical political issue. The article examines how cooling technology is reshaping geopolitical dynamics and creating new divisions between nations with adequate AC infrastructure and those without.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/23/the-geopolitics-of-air-conditioning", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン戦争がトランプ大統領職を蝕んでいる", "title_en": "The Iran war is consuming the Trump presidency", "summary_ja": "トランプ政権はイランとの緊張の高まりに直面しており、これが政策決定を支配している。バラク・オバマ前大統領が中東での無責任な軍事行動を避けるべきだと警告していた懸念が再燃している。トランプのイラン政策のアプローチが大統領職の議題と国際関係を再構築している。", "summary_en": "Donald Trump's administration faces mounting challenges from escalating tensions with Iran, which are increasingly dominating policy decisions. The situation echoes Barack Obama's cautionary stance against involvement in ill-conceived military conflicts in the Middle East. Trump's approach to Iran policy is reshaping his presidency's agenda and international relations.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/21/the-iran-war-is-consuming-the-trump-presidency", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペインのチームワークはメッシの天才を上回ることができるか?", "title_en": "Can Spain's teamwork overcome Messi's genius?", "summary_ja": "ワールドカップの決勝進出国であるスペインとアルゼンチンは、対照的なサッカー哲学を体現している。スペインは集団的なチームワークと戦術的な組織力に依存し、アルゼンチンの強みはリオネル・メッシの個人的な才能に集中している。この対戦はチーム結束とスター選手の力の永遠の議論を浮き彫りにする。", "summary_en": "Spain and Argentina, both World Cup finalists, represent contrasting football philosophies. Spain relies on collective teamwork and tactical organization, while Argentina's strength centers on Lionel Messi's individual brilliance. The matchup highlights the eternal debate between team cohesion and star power.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/18/can-spains-teamwork-overcome-lionel-messis-genius", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ボルドー近郊の大規模火災、フランス政府の対応能力を試す", "title_en": "Megafire near Bordeaux tests French government's crisis response", "summary_ja": "エマニュエル・マクロン大統領は月曜日に危機対応委員会を召集し、フランス南西部を襲う深刻な野火に対処する予定である。地方自治体の関係者らは、現在の民間防衛資源が気候変動の影響増大に対応するには不十分だと主張している。", "summary_en": "President Emmanuel Macron is convening a crisis cell on Monday to address severe wildfires spreading across southwestern France. Local officials contend that current civil protection resources are insufficient to cope with escalating climate change impacts.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/07/27/megafire-near-bordeaux-is-putting-the-french-government-to-the-test_6755870_5.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス南西部の山火事を可視化する地図", "title_en": "Mapping the Devastating Wildfires in Southwestern France", "summary_ja": "7月22日以降、フランスは南西部で2つの大規模な山火事に直面しており、いまだ制御下にありません。新しい地図により、火災の範囲と影響が視覚化されています。この状況はヨーロッパにおける大規模山火事の脅威の増大を浮き彫りにしています。", "summary_en": "Since July 22, France has been battling two major wildfires in its southwestern region that remain uncontrolled. A new map provides visualization of the fire's extent and impact. The situation highlights the growing threat of large-scale wildfires in Europe.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/les-decodeurs/article/2026/07/27/one-map-to-visualize-the-fires-in-southwestern-france_6755878_8.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペインの大規模山火事、連帯と政治的統一をもたらす", "title_en": "Monster wildfires in Spain bring solidarity and political unity", "summary_ja": "マドリード近郊とバレンシア近郊の大規模な山火事は、8万3,000ヘクタール以上を焼き、8万2,000人の住民の避難を余儀なくされている。この災害はスペイン指導部の広範な連帯と稀な政治的協力を促している。この危機は同地域における大規模山火事の壊滅的な影響を浮き彫りにしている。", "summary_en": "Massive wildfires near Madrid and Valencia have burned over 83,000 hectares and forced the evacuation of 82,000 residents. The disasters have prompted widespread solidarity and rare political cooperation among Spanish leaders. The ongoing crisis highlights the devastating impact of large-scale wildfires in the region.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/environment/article/2026/07/27/monster-wildfires-in-spain-bring-solidarity-and-political-unity_6755874_114.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の最新情報", "title_en": "Mindef Updates", "summary_ja": "国防省（Mindef）が新しい情報と更新内容をリリースしました。読者はザ・ストレーツ・タイムズのニュースレターを購読してさらに詳しい報道を得ることができます。同紙の購読サービスを通じて、国防省からの定期的な更新と発表を入手できます。", "summary_en": "The Ministry of Defence (Mindef) has released new information and updates. Readers can subscribe to The Straits Times newsletters for more comprehensive coverage. Regular updates and announcements from Mindef are available through the publication's subscription service.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデート・ニュースレターは、購読者向けの毎日のニュースハイライトと要約を提供します。本版は2026年7月27日に発行され、シンガポール有数のニュースソースからの厳選されたコンテンツをリーダーに提供しています。", "summary_en": "The Straits Times Evening Update newsletter provides daily news highlights and summaries for subscribers. This edition was published on July 27, 2026, and offers readers curated content from Singapore's leading news source.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズのモーニング ブリーフィングは、購読者向けの日刊ニュース更新と重要情報を提供しています。読者は提供されたリンクを通じてニュースレター購読を管理できます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and key information for subscribers. Readers can manage their newsletter subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "IDF兵役を拒否するイスラエル人兄妹、オーストラリアで難民資格の可能性", "title_en": "Israeli Siblings Refusing IDF Service May Qualify as Refugees in Australia", "summary_ja": "イスラエル国防軍（IDF）への兵役を拒否するイスラエル人兄妹がオーストラリアで難民資格を得られる可能性があるとの報告が出ている。このケースは軍事徴兵の免除と良心的兵役拒否をめぐる議論の増加を浮き彫りにしている。", "summary_en": "Israeli siblings who refuse to serve in the Israeli Defense Forces may be eligible for refugee status in Australia, according to a report. The case highlights growing debate over military conscription exemptions and conscience-based objections to military service.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMioAJBVV95cUxQLW9sbTV1c2JZUENIQ2JrNy1FRzdnTDVUTWhPd0VaWS1wNWtlUElhMG9pMkExWWRCSXNMMzAxNWRDQ1Y1LU5CdWVzeHJJRmN6MC01Q2xTLTd0aUE5cjJFd09wcWRuVW9rZTRPcWhOd2lIZGxhMkEyckNxTjZrQlBUMXlzTnNLOHJ4TnBMbzg0MmJWaURVTmxMSUs4SzlQTy1mdHFBRnAxV25JWlB2SzdRZUdIRHNQREx1c1oyY0pDZVkzZUdJajNTZFh4YXZ5SklLbTZPZzVyRGJRVmczMXZNVTFUQlpBWjd5TjNSNlNpT3dNTk5BaGtadjdheUxiMDJRdEp4N1JHdDBfcEU1WEF1RndmdHZVUUVZbEdVU1l1bjM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領が交渉継続を示唆する中、イスラエルがイラン大型攻撃に備え", "title_en": "Israel Prepares for Major Iranian Attack as Trump Signals Openness to Talks", "summary_ja": "イスラエルはイランからの大規模な軍事攻撃の可能性に備えている。米国のトランプ大統領は即座な軍事行動よりも交渉への意思を示唆している。この対立は中東における軍事準備と外交的対話の間の緊張の高まりを反映している。", "summary_en": "Israel is bracing for a potentially significant military strike from Iran amid diplomatic developments. The situation comes as U.S. President Trump indicates willingness to engage in negotiations rather than pursue immediate escalation. The standoff reflects heightened tensions in the Middle East with competing priorities between military preparedness and diplomatic channels.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimwJBVV95cUxNRlNEOWpOT21acUE5ZEhVaGtiRXFNZXVDVmVYX2UyNzlKYlA2Yk50dHF3YWtzRC1zYV8yUkdsTDFmclZCWHptWXh1ZGtmaWxtX2tFakxXc3lfZUM3WDBoa3JqYjVqV3pTOEVGekRvd3R4ZEZNQV9MSEFjUjdadVN6WXRUSGstOVI1UlFNb3J2ZUtaMTRUc3VOY1hSZE5rWnMtYW1pSDZCNzRmdmdRRVQ4S0E5NW5GSHBhWmZ3clh6N0NZLVRrRDBETk8xcGtBVnFhQkdsV2p2b2hqbTAwVnVmRnNCSnVjWF9UV1FUS3N5dUpGOGwxcWNhcEFFZjZqVlFwbXVLdXlzcnQ0Yk9MT0g0QnpaQkFNOTRZR3Fr?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ガリラヤ湖のビーチで貞淑さをめぐる論争が勃発", "title_en": "Modesty Dispute Erupts at Sea of Galilee Beach", "summary_ja": "ガリラヤ湖のビーチで、貞淑さの基準とビーチでの行為についての紛争が生じた。この紛争は、公共の娯楽地での適切な行動についての異なる文化的および宗教的グループ間の緊張を浮き彫りにしている。", "summary_en": "A conflict has emerged at a Sea of Galilee beach regarding modesty standards and beach conduct. The dispute highlights tensions between different cultural and religious groups over appropriate behavior at public recreational areas.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijAJBVV95cUxQU3dRMlhsNloxNHV4UW0zQ0ZJU252VlF1Z3JJUjZoRjhiVDRJZmFTS19hbkZiaTRHdlJ0ZUlrd2UyZU5KS3JQTkNveUN5QlpaTDBHWDdjSlJkVGRwZmRTY0t1WTVGN3ZwQ2gtS01IM2w3NFBkemhpdDdsdWJOTVVwR0FkX1FWRUEzS1NJNGFhSm1HR09BZFdUbDRWMFhrZDFSemsxeXBXU0I5X0FWcm5kZWIzanZQcEVyZ2VWSTJ2c2Mta0ZKYXlhR1pVaXBtZTk0V2FxWDZOTk5HMHNZUFRKSUNJVnZ6ZGdmOFdKSXZteWdKd2c3ejVlS2JDUFRfQ2laLU9CQUtkR0NDcUl5?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スパイダーマンが台北の夏祭りで「友好的な隣人」に", "title_en": "Spider-Man Brings 'Friendly Neighborhood' to Taipei Summer Festival", "summary_ja": "スパイダーマンが夏祭りの一環として台北に到着し、愛されるスーパーヒーロー・キャラクターを都市にもたらしました。このイベントは、ファンがこのウェブスリンガーの台湾の首都での存在を体験する特別な機会となっています。", "summary_en": "Spider-Man has arrived in Taipei as part of a summer festival celebration, bringing the beloved superhero character to the city. The event marks a special occasion for fans to experience the web-slinger's presence in the Taiwanese capital.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1aRWFna0lhbzRVdWtudGhKdWh3eGZMaTlDcExWVDF1ckhmZ2F4eWd5ajNFclkzMWlFcnI5SXJZVnVLRTFwQWI1Y2Z0MkZ1b3BZTkduejhR?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台北で汚染された食用油スキャンダルめぐり野党が集会を開催", "title_en": "Opposition Rallies in Taipei Over Tainted Cooking Oil Scandal", "summary_ja": "野党勢力は食用油汚染スキャンダルに抗議するため、台北で集会を開催した。デモ参加者は食品安全の失敗と政府の責任追及を求めている。このスキャンダルは台湾の食品業界における規制監督への懸念を高めている。", "summary_en": "Opposition parties organized rallies in Taipei to protest a major tainted cooking oil scandal affecting the nation. The demonstrations reflect public outrage over food safety failures and calls for government accountability. The scandal has raised concerns about regulatory oversight in Taiwan's food industry.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBucnRHam9wcy1DSjZRTjUzUi16allvX09KQklyZ3NaRDBfZGRDUGh3VGRzMDRmYVpJdjBvQklJY2w4bWRWRUdIcmVBb1JfeWE5czNZSUtHZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の俳優ワン・カイが台北の自宅で遺体で発見", "title_en": "Taiwanese Actor Wang Kai Found Dead at Taipei Home", "summary_ja": "台湾の俳優ワン・カイが台北の自宅で遺体で発見されました。地元当局が現在、彼の死亡の状況について調査を進めています。", "summary_en": "Taiwanese actor Wang Kai was discovered dead at his residence in Taipei. The circumstances surrounding his death are currently under investigation by local authorities.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE5oWWdWOUdTdDFVaEhhRHlVR19qcEFuYUlscTE2LXo1RnZmVDl0YkZGRlNBNm5VbUlOTVI1MnFqWU42b1NROWZSU21NcXBZVTF1X0tTVXhR?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ブラジル、米国務省職員2人のビザを却下", "title_en": "Brazil Denies Visas to Two US State Department Officials", "summary_ja": "CGTNは、ブラジル外務省が来週同国への渡航を予定していた米国務省職員2人のビザを却下したと報じています。ブラジル政府は土曜日にこの措置を講じました。国営メディアの報道によると、ビザ却下の具体的な理由は明らかにされていません。", "summary_en": "CGTN reports that Brazil's Foreign Ministry denied visas to two US State Department officials who planned to travel to the country next week. The Brazilian government took this action on Saturday, according to the state-controlled outlet. The specific reasons for the visa denials were not detailed in the report.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-07-25/news-1P4D7OkM252/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ関税を受けてメキシコが新たな貿易戦略を採択", "title_en": "Mexico Adopts New Trade Strategy Amid Trump Tariffs", "summary_ja": "CGTNは、メキシコがトランプ政権からの関税の可能性に対応するため、新たな貿易戦略を採択したと報じている。同報道によれば、メキシコは経済的利益を保護し、貿易関係を維持するためにアプローチを調整しているという。CGTNは、この戦略がメキシコ産品への輸入関税の引き上げに関する懸念に対処することを目的としていると述べている。", "summary_en": "CGTN reports that Mexico has adopted a new trade strategy in response to potential tariffs from the Trump administration. The report indicates Mexico is adjusting its approach to protect its economic interests and maintain trade relationships. CGTN states the strategy aims to address concerns about increased import duties on Mexican goods.", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-07-27/Mexico-adopts-new-trade-strategy-amid-Trump-tariffs-1P6G33i19HW/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "日本、福島第一原発から21回目の放射性汚染水の海洋放出を完了", "title_en": "Japan completes 21st discharge of nuclear-tainted wastewater from Fukushima", "summary_ja": "CGTNによると、日本の東京電力ホールディングスは金曜日に福島第一原子力発電所からの放射性汚染水の21回目の海洋放出を完了したと発表した。今回の放出には7,900トンの処理済み汚染水が含まれている。継続的な放出は国際的な監視と近隣諸国からの懸念の対象となっている。", "summary_en": "CGTN reports that Japan's Tokyo Electric Power Company Holdings completed the 21st round of ocean discharge of nuclear-contaminated wastewater from the Fukushima Daiichi Nuclear Power Plant on Friday. The discharge involved 7,900 tonnes of treated wastewater. The ongoing releases have been a subject of international scrutiny and concern from neighboring countries.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-07-24/Japan-discharges-7-900-tonnes-of-nuclear-tainted-wastewater-into-ocean-1P2AKIp2A3S/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア外務省、EUの石油価格上限を『茶番』と非難", "title_en": "Russia's MFA condemns EU oil price cap as 'farce'", "summary_ja": "TASSの報道によると、ロシア外務省のマリア・ザハロワ報道官がEUの石油価格上限措置を『茶番』と批判しました。同報道では、モスクワはEUがロシアのエネルギー部門に関する規則を繰り返し変更していると主張しています。この声明はエネルギー制裁を巡るロシアとEUの継続的な緊張関係を反映しています。", "summary_en": "TASS reports that Russia's Foreign Ministry, through spokesperson Maria Zakharova, criticized EU actions on an oil price cap as a 'farce.' According to the source, Moscow claims the EU has repeatedly changed rules regarding Russian fuel and energy sectors. The statement reflects ongoing tensions between Russia and the EU over energy sanctions.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2166075", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア、ウクライナによる南部への攻撃をテロ行為と非難", "title_en": "Russia condemns Ukraine terror attacks in southern region", "summary_ja": "TASSは、ロシアが南部への攻撃をテロ行為と述べ、未成年者を含む5人が殺害されたと報告している。ロシア外交官の声明は、モスクワがウクライナに帰属する地域での事件をテロ行為と特徴づけていることを反映している。", "summary_en": "TASS reports that Russia has strongly condemned what it describes as terror attacks on southern Russia, claiming that five people including a minor were killed. The Russian diplomat's statement reflects Moscow's characterization of incidents in the region as terrorist acts attributed to Ukraine.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2166069", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア大使、EUはドンバスでの犯罪を無視していると主張", "title_en": "Russian envoy claims EU ignores alleged crimes in Donbass", "summary_ja": "タス通信によると、イタリア駐在ロシア大使アレクセイ・パラモノフ氏は、2014年以降、ドンバスの民間人と子どもたちを擁護したヨーロッパ指導者はいないと述べたと報じられている。同大使はEUが自らの価値観に反して、ロシアが同地域での犯罪と特徴付ける事柄を無視していると主張している。ロシアは長年、ウクライナと西側諸国が紛争地帯での違反行為を軽視していると非難してきた。", "summary_en": "TASS reports that Russian Ambassador to Italy Alexey Paramonov stated that no European leader has defended Donbass civilians and children since 2014. The envoy claims the EU is contradicting its own values by allegedly ignoring what Russia characterizes as crimes in the region. Russia has long accused Ukraine and Western nations of overlooking violations in the conflict zone.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2166065", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "データセンター建設を見送ることの代償", "title_en": "The Cost of Not Building Data Centers", "summary_ja": "AI インフラ投資の急増に伴い、米国では過去3年間で850億ドル以上のデータセンタープロジェクトが地元の反対と環境懸念により中止された。ニューヨークは初のモラトリアムを実施した。著者は、これらの懸念は妥当だが、政策立案者はデータセンター開発を制限することの広範な経済的コストを考慮する必要があると主張している。", "summary_en": "The US has canceled over $85 billion in data-center projects due to local opposition and environmental concerns, with New York becoming the first state to impose a moratorium. While these concerns are valid, the author argues policymakers must consider the broader economic costs of restricting data-center development as AI infrastructure investment surges.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/not-building-data-centers-has-high-costs-ai-future-by-vittorio-quaglione-2026-07", "state_media": false, "category": "オピニオン", "full_text": "The Cost of Not Building Data Centers\nMILAN—The massive inflows of capital into data centers amid the frenzy of AI infrastructure investment have generated significant pushback in the United States by local opponents, leading to the cancellation of data-center projects worth at least $85 billion over the past three years. In July, New York became the first state to enact a moratorium on new data centers, as other states and the federal government consider similar proposals. But concerns about data centers’ economic and environmental costs, while reasonable, are only one part of the story. Everyone still must ask: Will the US miss out by not building more data centers?", "translation_ja": "", "vocab": [{"word": "inflows", "definition": "資金や資源が流入すること。ここでは大量の投資資本がデータセンター産業に流れ込むことを意味します。"}, {"word": "frenzy", "definition": "熱狂的で興奮した状態。制御不能なほど急速に進む投資活動や経済活動を指します。"}, {"word": "pushback", "definition": "提案や計画に対する反対や抵抗。地元住民や利益団体からの強い反発を意味します。"}, {"word": "moratorium", "definition": "特定の活動を一時的に禁止または中止する公式な決定。法的に強制される一時的な規制です。"}, {"word": "infrastructure", "definition": "産業やシステムを支える基本的な施設や設備。ここではAI技術を支えるデータセンターなどを指します。"}]}, {"title_ja": "ジム・クロウ法への危険な郷愁の蔓延", "title_en": "The Dangerous Spread of Jim Crow Nostalgia", "summary_ja": "著者は、極右インフルエンサーからメインストリーム媒体へと広がっている「黒人アメリカ人はジム・クロウ時代の方が今より恵まれていた」という虚偽の主張を批判している。データ分析を用いて、過去と現在の貧困率と犯罪率に関する主張に実証的根拠がなく、イデオロギー的動機によってのみ支持されていることを論じている。", "summary_en": "The author critiques the false claim, now spreading from far-right influencers to mainstream outlets, that Black Americans were better off during the Jim Crow era than today. Using data analysis, the piece argues there is no empirical evidence supporting claims about higher poverty and crime rates among Black Americans in the past compared to present, only ideological motivation behind such narratives.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/black-american-poverty-crime-rates-vastly-improved-since-jim-crow-by-john-donohue-and-charlie-grabois-2026-07", "state_media": false, "category": "オピニオン", "full_text": "The Dangerous Spread of Jim Crow Nostalgia\nandWith inaccurate claims about Black Americans’ poverty and crime rates having migrated from the far-right fringe to mainstream outlets like the Wall Street Journal, it is worth considering what the data actually say. Doing so will show that there is no empirical basis for such claims, only an ideological one.\nSTANFORD—After the right-wing influencer Charlie Kirk’s death last year, a video clip resurfaced in which he proclaimed that Black Americans “are poorer, more murderous, and more dangerous” today than in the Jim Crow era. The soundbite sparked outrage in liberal circles, owing to the dubious suggestion that Jim Crow had conferred some advantages on its victims, and became a flashpoint in the debate about Kirk’s legacy. Since then, Kirk’s claim has spread far and wide, with respected figures like Shelby Steele of Stanford University and the former Reagan adviser Robert Woodson peddling a similar line.", "translation_ja": "", "vocab": [{"word": "empirical", "definition": "実験や観察に基づいた、客観的データに裏付けられた。科学的方法論に従った証拠を意味する。"}, {"word": "fringe", "definition": "主流から外れた周辺部分。非主流派や極端な立場を指す。"}, {"word": "ideological", "definition": "特定の思想体系や政治的信念に基づいた。事実よりも信念体系を優先する性質を持つ。"}, {"word": "dubious", "definition": "疑わしい、信頼できない。真偽が不確かで信用性が低いことを示す。"}, {"word": "flashpoint", "definition": "紛争や議論が激化する地点。緊張関係が爆発しやすい状況を指す。"}, {"word": "peddling", "definition": "（考えや情報を）広めて回る、売り込む。誤った情報を意図的に流布する場合に使用。"}]}, {"title_ja": "湾岸諸国のAI主導ガバナンスへの推進", "title_en": "The Gulf's Push for AI-Led Governance", "summary_ja": "著者は、世界中の政府が外部コンサルタントへの依存を深め、独立して考え統治する制度的能力を弱めてきたと主張している。湾岸諸国はこの傾向を逆転させ、政府の知識と意思決定能力を回復させるための潜在的な解決策としてAIを探索している。本論文は、AI技術が高額な外部顧問への依存なく、国家が問題を解決する能力を回復させるのに役立つ可能性があることを示唆している。", "summary_en": "The author argues that governments worldwide have become overly dependent on external consultants, weakening their institutional capacity to think and govern independently. Gulf countries are exploring AI as a potential solution to reverse this trend and rebuild governmental knowledge and decision-making capabilities. The piece suggests that AI technology could help restore the state's ability to solve problems without relying heavily on expensive external advisers.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/gulf-countries-are-betting-on-ai-to-reduce-reliance-on-consulting-firms-by-sami-mahroum-2026-07", "state_media": false, "category": "オピニオン", "full_text": "The Gulf’s Push for AI-Led Governance\nGovernments around the world have spent decades outsourcing their ability to think to expensive consultants, gradually ceding the knowledge and judgment needed to govern effectively. AI may now offer a way to reverse that trend, and Gulf countries are providing an early glimpse of what that may look like.\nDUBAI—For years, scholars and policymakers have warned that governments have become too dependent on external advisers. In their 2023 book The Big Con, Mariana Mazzucato and Rosie Collington argue that governments’ growing reliance on consultants has weakened public institutions by draining them of knowledge, judgment, and problem-solving capacity. The clearest example may be the United Kingdom, where decades of outsourcing, privatization, and managerial reform have eroded the state’s ability to think for itself.", "translation_ja": "", "vocab": [{"word": "outsourcing", "definition": "企業や政府が特定の業務や機能を外部の専門企業や個人に委託すること。コスト削減や専門知識の活用が目的。"}, {"word": "ceding", "definition": "権利や領土、権力などを他者に譲歩すること、放棄すること。徐々に失うことを意味することも多い。"}, {"word": "eroded", "definition": "物質が徐々に減少または消失することを示す。ここでは制度や能力が時間とともに衰退することを意味している。"}, {"word": "institutional capacity", "definition": "組織が目標を達成するための資源、知識、スキルを備えた能力。制度的な強さと効率性を指す。"}, {"word": "managerial reform", "definition": "管理手法や経営システムを改善・刷新する取り組み。組織の効率性や透明性を高めることが目的。"}]}, {"title_ja": "トランプの関税執着：経済的破壊と論理的矛盾", "title_en": "Trump's Tariff Obsession: Economically Destructive and Logically Absurd", "summary_ja": "オピニオン執筆者スティーブン・グリーンハウスは、トランプの最新の関税政策（カナダと80カ国以上対象）が経済的に有害であり、世帯コストを年間1,100ドル増加させ、野火の煙や報復的な酒類禁止など不合理な正当化に基づいていると主張している。グリーンハウスは、トランプが75,000件の米国工場雇用を失い通商協定に違反しながらも、他国が報復する際には被害者意識を主張していると論じている。", "summary_en": "Opinion writer Steven Greenhouse argues that Trump's latest tariffs on Canadian and 80+ other countries are economically harmful, will increase household costs by $1,100 annually, and are based on absurd justifications like wildfire smoke and retaliatory liquor bans. Greenhouse contends that Trump uses tariffs as a destructive political tool despite losing 75,000 US factory jobs and violating trade agreements, while claiming victimhood when other countries retaliate.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/jul/27/tariffs-are-trumps-favorite-plaything-and-his-justifications-are-absurd", "state_media": false, "category": "オピニオン", "full_text": "With the midterm elections less than four months away, it’s a precarious time for Donald Trump and Republicans: Trump’s war against Iran is going badly, his approval ratings are in the toilet, gas prices are soaring and pushing up inflation, and nation after nation is furious about Trump’s insults, bullying and ugly American unilateralism.\nSo amid all this mess, what does Trump do? He turns to his favorite economic plaything: tariffs. On Monday, Trump signed orders to slap a 50% tariff on many Canadian goods, and four days later, he imposed across-the-board 10% or 12.5% tariffs on goods from more than 80 countries. Trump was no doubt thumping his chest, while millions of people overseas were dumping on him for yet another unnecessary, hostile act.\nToo bad for Republicans, and most Americans, though, because Trump’s fixation on tariffs will only worsen their troubles. Trump’s new tariffs will push up prices – let’s not forget that tariffs are taxes on imports, and US consumers will pay those taxes. A corollary of that: Trump’s tariffs will worsen Americans No 1 economic concern: affordability. In bad news for typical Americans, the Yale Budget Lab estimates that Trump’s tariffs will increase costs for the average US household by $1,100 each year. The tariffs are also likely to push Trump’s approval ratings deeper into the sewer. If Trump thinks these tariffs are going to distract Americans from thinking about the Epstein files or the disastrous mess he’s made with his Iran “excursion”, he’s deluding himself. The American people aren’t going to forget those things.\nIt’s hard to tell whether Trump’s repeated use of tariffs is a fixation or an addiction. Emperor Donald I evidently loves tariffs because he can use them to clobber other countries whenever he wants. They’re a powerful cudgel he won’t let go of. Trump imposed his new tariffs on more than 80 countries on the very day that another set of tariffs he slapped on dozens of countries was due to expire. To paraphrase the actor Charlton Heston, I can imagine Trump saying: “I’ll give up tariffs when you take them from my cold, dead hands.”\nWith these new tariffs, Trump is again engaged in his delusional, destructive tariff tomfoolery. They’ll push up prices, squeeze Americans’ wallets and anger other countries. Trump said his tariffs would boost US manufacturing, but the US has lost 75,000 factory jobs since he returned to office, with many executives complaining about all the herky-jerky uncertainty Trump has wrought. Assessing Trump’s effects on the economy, Atsi Sheth, the chief credit officer for Moody’s Ratings, told the New York Times :“Volatility and unpredictability is the new normal.”\nLike so much that Trump does, his new tariffs are clearly based on pique and false premises with lots of shamelessness and absurdity thrown in. After the US supreme court overturned Trump’s me-against-the-whole-world tariffs in February, Trump, refusing to let go of his tariff toy, turned to other strategies. To justify his new 50% tariffs against Canada – which are piled atop numerous other tariffs he’s imposed on a country that was long the US’s closest ally – Trump relied on a never before used provision of the Smoot-Hawley Tariff Act, a widely derided 1930 law that greatly worsened the Great Depression of a century ago. With this new tariff, placed on hockey sticks, paper, plywood, dairy products and many other Canadian goods, Trump invoked a Smoot-Hawley provision that allows retaliation against countries that engage in trade discrimination against the US.\nIn making that case, Trump’s exhibit No 1 is something rather preposterous, or should I say rather shameless? After Trump imposed high, punitive tariffs on Canada last year, 11 of Canada’s 13 provinces halted liquor imports from the US because they were so irate about those tariffs along with Trump’s outlandish and belittling statements that he wanted to make Canada the 51st state. The White House called this ban on US liquor illegal discrimination, while Canadians view it as a type of traditional trade retaliation that countries engage in when another country – here the US – slaps tariffs on them, a situation made worse by the fact that Trump’s tariffs against Canada are an egregious violation of the United States-Mexico-Canada Agreement.\nTrump also insists that Canada has improperly discriminated against the US because Canada imposed a 25% tariff on select US-made cars after Trump slapped a 25% tariff on Canadian-made cars.\nHe is essentially telling Canada: I have a right to punch you in the nose whenever I want. But if you punch me back, that’s illegal discrimination against the US. That’s the logic of America’s leading stable genius, who also offered another far-fetched justification for his decision: “We’re going to put a big tariff on Canada because of the smoke,” he told reporters on Friday, referring to wildfire smoke that has crossed the US border.\nOntario’s premier, Doug Ford, isn’t happy about Trump’s", "translation_ja": "", "vocab": [{"word": "fixation", "definition": "ある事柄に対する執着や強い関心。通常、健全でない程度に同じことに関心が集中している状態を指す。"}, {"word": "cudgel", "definition": "殴打用の棒、またはより広くは他者を支配・攻撃するための道具や手段を比喩的に指す言葉。"}, {"word": "delusional", "definition": "現実から乖離した誤った信念を持つ、または幻想に基づいている様子を表す形容詞。"}, {"word": "egregious", "definition": "著しく不当であるか、極めて悪質な程度の行為を指す。非常に重大で許しがたい違反や過ちを表す。"}, {"word": "retaliation", "definition": "他国や他者からの攻撃や不正な行為に対する報復行為。特に通商紛争では相手国と同様の措置で応じることを指す。"}, {"word": "shamelessness", "definition": "羞恥心の欠如、あるいは厚かましさを示す状態。不正行為を堂々と行う態度を表す。"}, {"word": "belittling", "definition": "他者の価値や重要性を軽視する、または貶める言動や態度。"}]}, {"title_ja": "EEOC職場差別測定廃止で市民権執行が危機に", "title_en": "EEOC's Move to End Workplace Discrimination Tracking Threatens Civil Rights Enforcement", "summary_ja": "EEOC共和党多数派が、雇用主に労働力の人口統計データの報告を義務付けてきた60年間のシステムを廃止することに投票した。著者は、この変更により機関が差別を選別的に調査できるようになる一方で、雇用主全体にわたるシステム的パターンを特定するために必要な包括的データを失うと主張している。", "summary_en": "The EEOC's Republican majority voted to dismantle the 60-year-old system requiring employers to report demographic data on their workforce, arguing such collection may violate equal protection. Author Jamil Smith argues this shift allows the agency to selectively investigate discrimination while losing the comprehensive data needed to identify systemic patterns across employers.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/jul/27/discrimination-eeoc-trump", "state_media": false, "category": "オピニオン", "full_text": "Workplace discrimination isolates. When a Black manager is passed over for a promotion, or a pregnant worker is quietly sidelined, they are left with a polite excuse and a lingering suspicion. They cannot see the company-wide spreadsheet. They cannot know if others are hitting the same invisible wall. For 60 years, the Equal Employment Opportunity Commission has kept a spreadsheet of its own: an annual demographic snapshot compiled from employer reports. That nationwide record lets the agency see beyond any one complaint.\nLast Tuesday, however, the EEOC’s Republican majority voted 2–1 to begin dismantling that reporting system. Two days later, the proposal entered the Federal Register, arguing that requiring employers to classify workers by race and sex may itself violate the constitutional guarantee of equal protection. The rule is not final: comments are due on 24 August, and a hearing is set for 11 August.\nIn plain English: the federal government wants to stop keeping the count it created to tell whether employers obey the law.\nThe Civil Rights Act will remain on the books, helping this change slip past notice – and perhaps outlast those behind it. An administration does not have to repeal a civil right if it can blind the agency charged with enforcing it. You cannot prove a pattern the government has chosen not to see. Yet blindness is not quite the plan. The EEOC would stop looking routinely across the workforce while keeping the power to examine particular employers when its leaders choose. That is not colorblindness. It is selective attention.\nSince 1966, private employers with at least 100 workers, and certain federal contractors with at least 50, have reported employees by race or ethnicity, sex and 10 job categories. Today, those reports typically cover more than 50 million people at roughly 73,000 employers. A company’s submission is confidential; the public dataset identifies no one. It sounds like paperwork until you consider that it shows the agency what no single worker can see. A complaint identifies a wound. Data reveals the system that made it.\nThere are fair objections to these reports. They require employers to sort workers into demographic categories even when no one has alleged discrimination. The categories are broad and sometimes dated. A numerical imbalance can be mistaken for proof of a problem, or used to defend preferences the law forbids. The EEOC estimates employers spend $273m a year complying. All of that is worth taking seriously. It sounds like a case for updating the form and enforcing the law carefully, not abandoning the system itself. Yet the proposal suggests that compulsory collection of this race and sex information may itself be unconstitutional. For an agency built to find discrimination, that is a remarkable turn: a tool it has used for six decades is now framed as a possible civil-rights injury.\nEmployers would still keep records of hiring, promotion, pay and termination. The required demographic categories that let investigators compare those decisions across groups would disappear. The commission could still demand demographic information after a charge or lawsuit begins, but it could no longer assume employers had collected the same information in the same form. The subpoena survives; the evidence thins.\nRoutine reports arrived whether or not the agency suspected anyone. Without them, its leaders would gain more control over when – and whose workplaces – the government examines for discrimination. This isn’t an agency going blind. It is choosing what it wants to see.\nThe EEOC chair, Andrea Lucas, has already shown us whose allegations she finds urgent. In December, she invited white men who believed they had suffered race or sex discrimination to come to the EEOC. She has described diversity programs as producing widespread, systemic discrimination, primarily against them.\nLook no further than Nike. No employee complaint set that investigation in motion; Lucas did, through a commissioner’s charge in May 2024. The charge itself cites Nike’s publicly disclosed EEO-1 data – a product of the very reporting requirement she now proposes to eliminate. The agency later subpoenaed extensive records, including demographic data, while investigating alleged bias against white employees. The investigation remains open. The need for a charge is no real limit when a commissioner can issue one herself.\nThe latest public national count, from 2023, offers a useful check on Lucas’s claim of systemic discrimination in the US. White men were about a third of the surveyed workforce, yet held 52.7% of executive and senior-m
