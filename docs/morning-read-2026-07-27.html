 "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の九寨溝世界遺産地で土砂崩れにより観光客を避難", "title_en": "Tourists evacuated from China's Jiuzhaigou World Heritage site after mudslides", "summary_ja": "豪雨により中国の有名な九寨溝世界遺産地で土砂崩れが発生し、当局は立ち往生した観光客の避難を余儀なくされた。この自然災害は、美しい谷と生物多様性で知られる人気の観光地へのアクセスに影響を与えた。緊急対応チームは悪天候の影響を受けた来園者の安全な救出作業を行った。", "summary_en": "Heavy rainfall triggered mudslides at China's renowned Jiuzhaigou World Heritage site, forcing authorities to evacuate stranded tourists from the scenic area. The natural disaster impacted access to the popular destination known for its picturesque valleys and biodiversity. Emergency response teams worked to safely remove visitors affected by the adverse weather conditions.", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMizwFBVV95cUxQYmZ6N2VsT2FEbTFEQjV5dTZocFM3TXlRdWd0ZlZpOVh4OWRXSlVERWVVSGw3YWdBOURuRUJGUTRNeHQxOUdubTB1VWszTWNaUXk1WTVpRGFzX2NCWG5ZT2VNNXozcWdpb0VTR242OGNmOWVBTVVZODMtWDBhSUJKeHFMS1puMlctcXpDR2dTRGhyUTZKUHVYbndXR2xZYjZFUDRSMGduR2FIMXVnQWZrYVJDZ3BnTFRsQ09JaFhvOUphbmt0NUxSVm1va0k3TlE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパの壊滅的な山火事：地図と消火活動への対応", "title_en": "Devastating European Wildfires: Maps and Firefighting Response", "summary_ja": "フランスとスペインが過去最大級の山火事と戦っており、30万人以上が避難を余儀なくされています。40℃を超える極端な熱波によって助長されたこの火災は、ボルドー近郊のフランスのワイン地域やマドリッド周辺の山々を含む広大な地域を焼いています。消防士たちは、水を投下する航空機、難燃剤飛行機、および大規模な防火帯を含む先進的な技術を使用して火災と戦っています。", "summary_en": "France and Spain are battling unprecedented wildfires that have forced over 300,000 people to evacuate. The blazes, fueled by extreme heatwaves exceeding 40°C, have burned vast areas including France's wine region near Bordeaux and Madrid's surrounding mountains. Firefighters are using advanced techniques including water-dropping aircraft, fire retardant planes, and massive firebreaks to combat the fires.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cj638jx0l53o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Devastating European wildfires in maps - and how they're being tackled\n- Published\nWildfires are tearing through France and Spain, forcing more than 300,000 people to evacuate their homes.\nFrance has seen its worst wildfires in two decades, while officials in the Spanish capital Madrid say the fires are the worst the region has ever experienced.\nIt follows a sweltering summer of heatwaves across Europe that have seen temperatures soar above 40C (104F) in many places.\nThree separate wildfires in the mountains outside Madrid have together burned about 297 sq miles (770 sq km), authorities estimate.\nIn France, the worst affected area is Gironde, around the city of Bordeaux, where more than 200,000 people have been forced from their homes.\nThe blaze has spread rapidly, tearing through forests and fields in France's famous wine region, and burning more than 162 sq miles (420 sq km) in less than four days - an area roughly four times the size of Paris.\nIt is now just nine miles (15km) from the south of Bordeaux.\nThe fires have also threatened a number of sensitive military and industrial sites in the area, including facilities that work on French ballistic missiles, rocket motors, and the processing of hazardous chemicals.\nSatellite imagery above Gironde shows vast areas of scorched, blackened earth, with smoke drifting inland to the east.\nThe fires have become so extreme they have created their own giant fire thunderstorm.\nA rare weather event, storms like these are formed when heat from the wildfires makes the air above the fire rise rapidly, carrying smoke, ash and water vapour high into the atmosphere.\nAs the air rises, it cools, and the water vapour condenses into a cloud. If the fire is powerful enough and the atmosphere is unstable, that cloud can grow into a cumulonimbus - the same type of cloud associated with thunderstorms.\nIf these clouds then become large enough, they can produce their own lightning, which can then start new fires. They can also occasionally bring hail and rain.\nThese extreme and unpredictable conditions make the fires all the more difficult to stop.\nTo combat them, French firefighters have been using planes loaded with fire retardant, as well as planes like the Canadair, which can scoop 6,000 litres of water from lakes or the sea in 12 seconds and drop it directly on the fires.\nOn dangerous days, loaded aircraft patrol high-risk areas before any fires have been reported, so they can drop within minutes of a sighting. Planes often fly in a continuous shuttle while retardant is laid along the edges of the fire and ground crews attack the flames directly.\nIn Gironde, about 2,500 firefighters, 1,500 military personnel, and 1,200 police officers and gendarmes have been involved in tackling the blaze.\nAround the town of Lacanau, bulldozers, diggers and mechanical shovels have been used to carve a firebreak that is 100m (328ft) wide at points, according to French media.\nA firebreak is essentially a stretch of land that has been stripped of all vegetation to stop the fire from spreading. It is key to strip the land of any potential fuel before the fire has a chance to reach it.\nSpanish teams have been using many of the same techniques to tackle their wildfires, which are on course to become the worst the country has seen in two decades.\nFrancisco Martin, a government delegate in Madrid, described the fires as \"undoubtedly the largest fire in the history of the Madrid region\".\nThis summer's fires have been aided by the hotter, drier conditions caused by climate change, which allow fires to spread faster and burn more fiercely.\nMany on the ground - in both Spain and France - are fearful that the coming week could see worsening conditions, with high pressure forecast to bring dry, settled and increasingly hot temperatures.\n1 of 4\nAdditional reporting by Elizabeth Rizzini and Helen Willetts", "translation_ja": "", "vocab": [{"word": "cumulonimbus", "definition": "積乱雲のこと。火災の熱によって形成される大規模な対流性雲で、落雷や激しい天候をもたらすことができます。"}, {"word": "retardant", "definition": "消火活動で使用される難燃性物質。火災の拡大を遅らせたり防いだりする目的で、航空機から投下されます。"}, {"word": "firebreak", "definition": "火災の拡大を防ぐために植生をすべて取り除いた土地。火が広がるための燃料源を事前に排除するための防火帯です。"}, {"word": "condenses", "definition": "気体が液体に変わることを指します。この記事では、火災による上昇気流で水蒸気が冷却して雲になるプロセスを説明しています。"}, {"word": "unstable", "definition": "大気が不安定な状態のこと。この条件下では、積雲が急速に発達し、雷雨を形成する可能性があります。"}]}, {"title_ja": "米国とイランが攻撃を一時停止、石油価格が急落", "title_en": "Oil Price Plunges as US and Iran Pause Attacks", "summary_ja": "米国とイランが攻撃を一時停止したことで、ブレント原油が9%以上下落し1バレル87.59ドルになりました。先週は紛争によるホルムズ海峡の閉鎖懸念から100ドルを超えていました。しかし専門家は、交渉が永続的な停戦につながるかについて依然として大きな不確実性が残っていると警告しています。", "summary_en": "Brent crude oil fell over 9% to $87.59 a barrel as the US and Iran halted attacks, offering hopes for de-escalation. The price had surged above $100 last week due to concerns over the Strait of Hormuz closure affecting global energy supplies. However, analysts warn significant uncertainty remains about whether negotiations will lead to a lasting ceasefire.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyj834jn5lo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Oil price dives as US and Iran pause attacks\n- Published\nThe price of oil has fallen sharply on hopes that a pause in attacks between the US and Iran could help to de-escalate the conflict.\nBrent crude, the global benchmark for oil, sank more than 9% to $87.59 a barrel at one point, marking a sharp turnaround from last week when it had risen above $100.\nThe fall came after the US ambassador to the UN said attacks on Iran had been halted for a second night in a row to give \"talks some space\".\nAn Iranian army spokesperson said on Sunday that Tehran had halted \"retaliatory\" attacks in the region in response.\nThe outbreak of the Iran war triggered a sharp rise in oil prices as the conflict led to the effective closure of the Strait of Hormuz, a key shipping route which usually carries about 20% of the world's oil and liquefied natural gas (LNG).\nWhen Iran and the US signed a memorandum of understanding in June to halt military operations and reopen the strait, the price of oil fell back to pre-war levels of around $70 a barrel.\nHowever, the collapse of the ceasefire earlier this month reignited fears over global energy supplies and pushed the oil price back up.\nLast week it hit $100 a barrel for the first time since May, with added concerns coming after Houthi militia in Yemen attacked oil tankers in the Red Sea, threatening a key export route that Saudi Arabia had used to bypass the Strait of Hormuz.\nBy Monday afternoon, the price of Brent stood at $90.60 a barrel, down more than 6% for the day.\nSusannah Streeter, chief investment strategist at Wealth Club, said markets were remaining \"cautious given the twists and turns during this conflict\".\nDespite the sharp fall in crude, \"there is still significant uncertainty baked into these prices and a reticence about whether negotiations will lead to a lasting breakthrough,\" she added.\nThe wholesale price of gas has also been rising recently, and analysis from research group Wood McKenzie published last week said European gas storage was at a historic low, with supply security for this winter \"at risk\".\nIf the Strait of Hormuz remains closed for a further two months, it said storage will end up lower than 70% by 1 November, compared with a five-year average for that date of 90%.\n\"Low European inventories, strong Asian demand and limited new LNG supply growth almost guarantee elevated prices through this winter and into 2027,\" said Massimo Di Odoardo, vice president of gas and LNG research at Wood Mackenzie.\nThe conflict between the US and Iran has also pushed up the cost of fuel such as petrol and diesel in many countries.\nThis often has knock-on effects on other prices, such as food, as businesses pass on the higher costs they are facing to customers, and this can push up the rate of inflation.\nHigher inflation raises the possibility that central banks will increase interest rates in an attempt to keep price rises under control.\nIn June, the European Central Bank opted to lift its key interest rate for the eurozone for the first time in almost three years, noting that the conflict was \"generating inflation pressures\".\nBefore the Iran war began, there had been expectations that the Bank of England would cut rates this year.\nHowever, no cuts are now expected and financial markets are currently predicting a rate rise towards the end of the year.\nThe Bank of England holds its latest interest rate-setting meeting this week, when it is expected to keep its key rate unchanged at 3.75%.", "translation_ja": "", "vocab": [{"word": "de-escalate", "definition": "紛争や対立の激化を緩和する、または状況を落ち着かせることを意味します。政治や国際関係の文脈で使用される動詞です。"}, {"word": "strait", "definition": "二つの陸地に挟まれた狭い水路のことです。ホルムズ海峡など重要な国際航路を指すことが多いです。"}, {"word": "reignite", "definition": "再び火をつける、または問題や懸念を再び起こすという意味です。比喩的に使われることが多いビジネス用語です。"}, {"word": "reticence", "definition": "躊躇や慎重さ、話すことへの不本意さを表します。マーケット分析では市場参加者の慎重な態度を示します。"}, {"word": "inventory", "definition": "在庫または保有資産のことです。エネルギー産業ではガス貯蔵量などの備蓄状況を指します。"}, {"word": "knock-on effect", "definition": "ある出来事が連鎖的に引き起こす二次的な影響を意味します。経済学で他の商品価格上昇などへの波及効果を指します。"}]}, {"title_ja": "ベルリンプライド襲撃事件：釈放された容疑者の行動の自由をめぐる疑問が浮上", "title_en": "Berlin Pride Attack: Questions Raised Over Released Suspect's Freedom", "summary_ja": "イスラム過激派との関連が疑われる21歳のドイツ人男性がベルリンプライドで土曜日に襲撃事件を起こし、1人の女性を殺害し29人以上を負傷させた後、警察に射殺されました。テロ関連の犯罪で有罪判決を受け、取り調べを受けていた容疑者が執行猶予判決を受けて釈放された理由について、疑問が生じています。ドイツ当局は現在、同様の事件を防ぐため、セキュリティ法と司法手続きの見直しを進めています。", "summary_en": "A 21-year-old German man with alleged Islamist ties carried out an attack at Berlin Pride on Saturday, killing one woman and injuring 29 others before being shot dead by police. Questions have emerged about why the suspect, who had prior convictions and was under investigation for terrorism-related offences, received a suspended sentence and was released. German officials are now reviewing security laws and judicial procedures to prevent similar incidents.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy9wv74qje9o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Anger, shock and grief - questions remain in the wake of the Berlin Pride attack\n- Published\nIn Germany there is grief, shock and, increasingly, anger about the attack at Berlin Pride on Saturday night which left one Polish woman dead and injured at least 29 others.\nThe main suspect, Abdul Ballout, a 21-year-old German citizen with Lebanese heritage, was shot and killed by police on Sunday.\nGermany's Interior Minister Alexander Dobrindt said Ballout \"had previously drawn attention to himself through a high volume of criminal offences, radicalisation and affiliation with the Islamist scene.\"\nAs details emerge about his criminal convictions, many are asking why Ballout was not in prison.\nProsecutors say that in 2025, Ballout decided to try to join Islamic State group's armed struggle in Syria, travelling via Turkey to Lebanon. In Lebanon, they say, he met several people he believed were members of IS.\nHe was arrested in Lebanon in July 2025 and sentenced to three months in prison for incitement to religious and sectarian conflict.\nThen in November 2025 he returned to Germany, where he was arrested at Berlin Brandenburg Airport and held in pre-trial detention.\nIn May this year, a Berlin court sentenced Ballout to a juvenile sentence of one year and ten months, for \"preparing a serious act of violence endangering the state\".\nThe sentence was suspended while prosecutors appealed against the verdict, calling for a longer sentence.\nBallout was released and placed under the supervision of a probation officer.\nInterior Minister Alexander Dobrindt told RTL that the decision to impose a suspended sentence was \"certainly incomprehensible... given the level of danger involved in this case\".\nHe said the authorities were investigating how that happened.\nBerlin's Governing Mayor, Kai Wegner from the centre-right Christian Democrat party (CDU), said he was dumbstruck at the way the Berlin judiciary had handled Ballout's case.\n\"He was sentenced... under juvenile criminal law,\" he told RBB TV. \"And then, unfortunately, the court handed down a suspended sentence. I don't want to pass judgement on that – that's the independence of the judiciary – but I'm really at a loss for words.\"\nThe opposition far-right Alternative for Germany (AfD) party described the attack as a total failure of security policy.\n\"If an Islamist threat known to the police was able to carry out such an act, a thorough investigation must be carried out to establish why he was still able to move about freely in the first place,\" said Martin Hess, the AfD's home affairs spokesperson.\nAccording to Der Spiegel, Ballout told the Berlin court this spring that he had distanced himself from extremist ideology and violence.\nThomas Mücke, an extremism expert at the Violence Prevention Network VPN, told ARD television that he had met the suspect.\nHe said Ballout had given social workers \"a very composed, very cautious, very controlled and very friendly impression\".\n\"And those are precisely the criteria where we realise we can't really get to know the person,\" he continued.\nSome have called for Germany's laws against terrorism to be made stricter.\nPeter Neumann at King's College London told ZDF that Germany's criminal law on terrorism is \"too lenient,\" and sentences too short by European standards.\nHe also called for a rethink of Germany's juvenile justice system, which he said prioritises education rather than the protection of the public.\nThe home affairs spokesperson for the centre-left Social Democrats (SPD), Sebastian Fiedler, told Deutschlandfunk radio that criminal law was not the problem, but the way it was applied.\n\"We need to look more closely at why [Ballout] still at large. Another key question is: 'What actually happened after his release from prison? Who was he still in contact with?' Although he was under surveillance, there was clearly a gap in the system.\"\nGermany's Chancellor Friedrich Merz said it was too early to say what political consequences will be drawn from the attack, but promised there would be action: \"We will have to respond with prudence, but also with determination.\"\nHe said if individuals classified as threats could not be detained, their freedom of movement should be restricted \"as much as possible.\"\n\"I cannot understand how I can track my mobile phone from anywhere in the world... yet it is supposedly impossible, or technically unfeasible, for security authorities in Germany to determine the whereabouts of individuals classified as security threats to that same extent.\"\nHe said he had asked the interior ministry to review the law regarding monitoring jurisdiction.", "translation_ja": "", "vocab": [{"word": "radicalisation", "definition": "過激な思想や行動へと段階的に傾斜していくプロセスのこと。特にテロリズムや極端な政治的イデオロギーへの転向を指す場合が多い。"}, {"word": "suspended sentence", "definition": "有罪判決を受けても刑務所に収監されない判決形式。一定期間無犯則であれば刑は取り消される。"}, {"word": "pre-trial detention", "definition": "裁判開始前に被告人を身柄拘束すること。逃亡防止や証拠隠滅防止が理由となる。"}, {"word": "incitement", "definition": "他者を特定の行為や暴力、違法行為へと扇動または扇動すること。言論や行動を通じて他者を駆り立てる行為。"}, {"word": "incomprehensible", "definition": "理解不可能または非常に理解しがたい状態のこと。この文脈では、判決の決定が納得しがたいと批判している。"}, {"word": "extremism", "definition": "主流の考え方から大きく外れた急進的または過激なイデオロギーや行動様式を指す。テロリズムはその極端な形態。"}, {"word": "juvenile justice system", "definition": "未成年者による犯罪を扱う特別な法律制度。成人刑罰より軽く、更生と教育に重点を置くことが多い。"}]}, {"title_ja": "NHS改革なければ「崩壊する」 首相がBBCで警告", "title_en": "NHS 'will collapse' without social care reform, PM tells BBC", "summary_ja": "首相アンディ・バーナムは社会福祉制度改革がなければNHSが崩壊すると警告したが、変更の時間枠を確定できないとしている。独立した審査を加速させ、福祉支出削減のため給付金請求の条件をより厳しくすることを提案している。", "summary_en": "Prime Minister Andy Burnham warns that the NHS will collapse without social care reform, though he cannot commit to a timeline for changes. He plans to accelerate an independent review and proposes stricter conditions for benefit claims to reduce welfare spending.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cn0n5xpzlz2o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "NHS 'will collapse' without social care reform, PM tells BBC\n- Published\nAndy Burnham has told the BBC \"the NHS will collapse\" if social care is not reformed but said he could not put a timeline on changes.\nIn his first major interview since becoming prime minister, Burnham said he would not want to leave office without bringing in \"substantial change\" to the social care system.\nThe prime minister also suggested making it harder to claim benefits, saying the country had to get serious about getting the welfare bill down.\nConservative leader Kemi Badenoch has meanwhile written to the prime minister, saying he should rule out tax rises or increased borrowing to fund social care reform.\nBurnham told the BBC that if the government did not reform social care, the NHS would \"collapse under the weight of trying to care for people who've really not needed to end up in the NHS system\".\nBut pressed on whether he would create a new system before the next election, he said he \"couldn't put a timeline on it right here, right now\", though he would put \"whatever political capital I have into fixing broken social care\".\nBurnham first proposed a universal system of social care in England in 2009 when he was health secretary under Gordon Brown and pursued the idea of a compulsory levy to fund it.\nThat Labour government also floated the idea of allowing people to defer the payment until after they died, which led to the Tories branding it a \"death tax\".\nBurnham is due to make a speech on adult social care on Wednesday.\nThe BBC understands the PM will stop short of unveiling plans for a new system in this speech, instead announcing he is speeding up the Casey Commission, an independent review that has been considering possible solutions for social care.\nBaroness Louise Casey is not expected to give her final recommendations until 2028, but Burnham wants to bring her schedule forward.\nAdult social care provides state support to help people live more independently, including assistance at home.\nUnlike the NHS, social care is not free at the point of use. In England and Northern Ireland, people with savings worth more than £23,250 are not entitled to help with care costs from their council.\nIn Wales and Scotland, different rules apply in terms of eligibility.\nSarah Woolnough, chief executive of healthcare think tank the King's Fund, said the current \"punitive system\" meant that \"quite a lot of people go without care that they need\", with one in seven paying in excess of £100,000 for social care.\nWhile Burnham has not yet outlined any plans, Woolnough told the BBC Radio 4's Today programme that reforms could range from making social care free at the point of need to placing a cap on the amount people spend.\n\"The PM has for a long time mooted the idea of a social care system similar to NHS,\" she said.\n\"It would be expensive but on the scale of what we spend on other public services - around £200bn on the NHS - we are talking for some of these options low billions per year.\"\nAdult social care has proved a complex issue to tackle for successive governments.\nTwo years ago Sir Keir Starmer was criticised when Labour scrapped plans for an £86,000 cap on the amount people in England would spend on social care in their lifetime.\nBadenoch wrote in her letter to Burnham that \"any solution to the issues around social care must also be fair to those who have made provisions and saved up over the course of their lives\".\nLayla Moran, the Liberal Democrat MP who chairs the Health and Social Committee, told the Today programme: \"We do need to discuss where the money is going to come from but also we need to all be putting our political capital into this.\"\nLib Dem leader Sir Ed Davey said he was ready to do \"whatever I can to find a real and lasting consensus on social care\".\n\"Family carers must be at the heart of any new system, everyone must get the care they need and no one should lose their home as a result,\" he said.\nReform Treasury spokesman Robert Jenrick said social care needed fixing but warned the party would fight any proposal for a \"universal death tax\".\nHe said: \"It's not fair to raid people's life savings and drags hundreds of thousands more families into paying tax when their loved ones pass away.\"\nAndy Burnham: the Laura Kuenssberg Interview\nWhat kind of prime minister will Andy Burnham be? Laura Kuenssberg has been behind the scenes with him during his first week in power.\nBenefits reform\nThe prime minister said he might \"increase the conditions on people required to receive benefits\", telling the BBC he believed \"there are people out there who, with the right support, can go into work.\"\nHe added: \"It's about changing the nature of the support and making some of the support conditional upon people taking opportunities that are presented in front of them. So you might increase the conditions required to receive benefits. \"\nHe said he would not go \"straight to blaming \" people on benefits, saying \"there are people in the benefits sy", "translation_ja": "", "vocab": [{"word": "defer", "definition": "支払いや決定を後日に延期することを意味する。ここでは死後に支払うことを延期するという文脈で使われている。"}, {"word": "punitive", "definition": "罰則的であるまたは非常に厳しいという意味。ここでは社会福祉制度が利用者に対して不利で厳しいシステムであることを指している。"}, {"word": "mooted", "definition": "提案する、議論に持ち出すという意味の過去分詞。政策や案を公開討論の対象として提示することを表す。"}, {"word": "levy", "definition": "税金や手数料として強制的に徴収することを意味する。ここでは社会福祉制度を支持するための強制的な税を指している。"}, {"word": "eligibility", "definition": "適格性、対象者となる条件を満たすことを意味する。社会福祉の受給資格があるかどうかを判定する基準を指している。"}, {"word": "provisions", "definition": "将来のために事前に用意した資金や準備のこと。ここでは老後に備えて貯蓄した金銭を指している。"}]}, {"title_ja": "アンディ・バーナム首相の初週：ダウニング街への独占取材", "title_en": "Inside Andy Burnham's First Week as Prime Minister: Exclusive Access to No 10", "summary_ja": "BBC政治編集者ローラ・クエンスバーグは、アンディ・バーナムが英国第59代首相となったときのダウニング街での珍しい舞台裏アクセスを獲得しました。報道は、ソーシャルメディアの積極的な活用とスタッフとの関わり、さらに社会福祉と地方統治に関する彼の慣れた修辞と具体的な政策の詳細との間の隔たりを明らかにしています。", "summary_en": "BBC political editor Laura Kuenssberg gained rare behind-the-scenes access to Downing Street as Andy Burnham became the UK's 59th prime minister. The coverage reveals Burnham's distinctive communication style, including his active use of social media and willingness to engage with staff, while highlighting the gap between his familiar rhetoric on social care and local governance versus concrete policy details.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c79gdjlv78wo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "\"You can clap now,\" a Downing Street official with a clipboard instructed the staff eagerly lining the halls of No 10 in the moments before the new prime minister walked in.\nThe applause duly began before the famous door opened, so the first sight and sound to greet Andy Burnham and his wife were crowds of clapping staff, crammed into the Downing Street hall. They stretched up the long corridor all the way to the door of the Cabinet Room - left ajar for him to walk straight in and get down to work.\nI've seen plenty of prime ministers come and go from outside No 10. But I'd never been allowed inside at that moment before, able to hover outside the Cabinet Room and grab a quick word with the country's new leader at such an intense, symbolic time.\nI have rarely seen a politician look as thoroughly delighted as Burnham, pride bursting out of his buttoned-up suit - that's right, the T-shirt and bomber jacket didn't make it to No 10 - or a leader who has wanted to stop and shake as many hands.\nAndy Burnham: The Laura Kuenssberg Interview\nPanorama\nWhat kind of prime minister will Andy Burnham be? In his first major broadcast interview since taking office, Laura Kuenssberg asks about his plans - and the challenges ahead.\nNo 10 staff are already wondering if they'll ever be able to stick to a regular prime minister's schedule, normally designed with military precision. If Andy Burnham was able to take the time to stop and speak to everyone in the country, I suspect he probably would.\nIt's a sign of his different style that our team was given permission to be behind the scenes at three key moments in the 59th prime minister's first week in charge - when he became Labour leader, when he walked into No 10, and on day one at his new Manchester outpost, No 10 North.\nMost important by far was our half-hour interview in that shiny new office, after weeks during which Burnham was chased by accusations he'd avoided tough questions. But the extra glimpses we were given, alongside Burnham's own voracious appetite for social media, display a prime minister that's not just at ease in front of the cameras, but a leader who wants to bring you along for the ride.\nThey included revealing moments that are normally hidden - his first steps into the Cabinet Room to appoint his team, rating pub snacks with his Chancellor, John Healey, in an Instagram post, external, and sharing pictures with us of the family dog, Axel, whom he describes as having \"angry little man energy\".\n\"Comms\" - how politicians communicate and explain themselves and talk to the public - is not the be-all and end-all.\nBurnham's exploits online have already brought mockery and launched a thousand memes. But if a leader can't get your attention to make their arguments - as Keir Starmer found so challenging - ultimately, they are not going to get very far at all.\nAnd the biggest difference of the Labour reboot so far is how the government looks and sounds. They've put an obvious priority on punter-friendly announcements such as cutting VAT from energy bills and tax breaks for pubs - although it is important to note the details on how to pay for all of that are not yet clear.\nFor Burnham though, telling his story is the easy part. Joking about the unique stink that accompanies Scampi Fries, or showing me his gold disc on loan from The Smiths' guitarist Johnny Marr, won't help him deal with US President Donald Trump, find money for defence, or create a new service to care for the elderly and vulnerable in England. Nor will it be any use as he grapples with the country's huge debts, changing demographics or public concerns about immigration.\nListening carefully during our interview, it seemed Burnham had distinct gears. He was fluent and passionate on his familiar ground: his desire to sort out social care, his track record in Manchester, his desire to run a government that feels relevant and effective where you live, local leaders eager to make many more decisions and able to spend taxpayers' money more freely without permission from Whitehall.\nThose are his core beliefs, arguments he's made hundreds, if not thousands of times.\nBut when it comes to how he'll apply what he thinks in principle to what he does in practice, that was not always so clear. On social care for example, he's long believed there ought to be a National Care Service, like the NHS. But in a speech on Wednesday, that's not likely to be what he unveils.\nInstead, he told me he'd \"brought it straight forward\", understood to mean speeding up the government review by Baroness Louise Casey of what ought to be done, not saying, \"here's the plan\".\nWhen it came to questions that are on his desk for the first time, there was a contradiction. Burnham told us all many times that he will stick to the manifesto the country voted for in 2024.\nBut he's also vowed his arrival in office will usher in the biggest change in four decades. You don't have to be a student of political history to find a mismatch there - he's go", "translation_ja": "", "vocab": [{"word": "voracious", "definition": "貪欲な、非常に熱心なという意味。ここではバーナム首相のソーシャルメディアへの強い関心と積極的な利用を表している。"}, {"word": "grapple", "definition": "困難な問題と取り組む、格闘するという意味。政治的課題や困難な状況に直面して対処することを表す。"}, {"word": "fluent", "definition": "流暢な、自由自在にという意味。ここではバーナム首相が得意なテーマについてスムーズかつ説得力をもって話すことを表している。"}, {"word": "unveil", "definition": "公式に発表する、明かすという意味。新しい計画や政策を初めて公開・発表することを指す。"}, {"word": "mismatch", "definition": "不一致、矛盾という意味。互いに合わない、または対応していない事柄同士の関係を表す。"}, {"word": "manifesto", "definition": "政策綱領、選挙公約という意味。政党や候補者が有権者に対して示す政策や主張をまとめた文書。"}]}, {"title_ja": "埋葬について嘘をついた葬儀社経営者が判決を控える", "title_en": "Funeral director faces sentencing for lying about burials and fraud", "summary_ja": "ハル州の葬儀社経営者ロバート・ブッシュ氏は、適切な埋葬の阻止と家族への詐欺を含む67件の罪を認めました。ピーター・ムーディ氏の遺体は葬儀から3ヶ月後に、ブッシュ氏の葬儀社で他の34体とともに発見され、被害者の家族に多大な苦痛をもたらしました。", "summary_en": "Robert Bush, a funeral director in Hull, admitted to 67 offences including preventing lawful burials and defrauding families. The body of Peter Moody was discovered three months after his funeral among 34 others at Bush's funeral home, causing immense suffering to affected families.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c75e0xr2qwko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Funeral boss who lied about burying dad has left me broken, victim says\n- Published\nA woman whose dead father was discovered at an undertaker's three months after his funeral says her hellish ordeal has \"crucified\" her.\nThe body of Peter Moody, 65, was found by police alongside 34 others and more than 100 sets of ashes at Legacy Independent Funeral Directors in Hull in March 2024. One of the bodies had been there for a year.\nFormer funeral director Robert Bush, 48, of Otley, West Yorkshire, will appear at Hull Crown Court later for sentencing. He previously admitted 67 offences, including 30 counts of preventing a lawful and decent burial.\nPeter Moody's daughter Joanne Moody, 48, who is expected to join other families wronged by Bush in the court's public gallery, said: \"It's broke me, it's crucified me.\"\nIn addition to preventing lawful and decent burials, Bush, 48, previously pleaded guilty to 35 counts of fraud by false representation and another of fraudulently running a business, relating to the sale of funeral plans.\nHe also admitted one count of theft, which related to money stolen from collections meant for 12 charities, including the Salvation Army and Macmillan Cancer Support as well as local causes.\nIn a move that provoked anguish among affected families, Bush was granted conditional bail after entering his final guilty pleas in April.\nBut Moody said she would \"sleep easier\" knowing he would pay for his crimes.\n\"It's a pivotal point in our recovery knowing that justice is being done,\" she said.\nMoody said she could now \"start remembering dad as he was, not thinking about Bush walking the streets\".\n\"I can't cry any more,\" she added.\nShe described her father as a \"dedicated\" family man who enjoyed fishing, Hull FC and spending time with his grandchildren.\nMoody said Bush's guilty pleas had brought her some peace of mind.\n\"My dad was a person, he was not just a number or a statistic,\" she said.\n\"Now I can talk about him as the former dock worker who loved nothing more than standing on King George Dock and watching the ferries go out.\"\nPrior to establishing Legacy, Bush worked for a number of other funeral directors. He oversaw more than 2,000 funerals during his career.\nMany former customers said Bush had presented as the archetypal, caring undertaker; a point noted by Hull West and Haltemprice MP Emma Hardy.\n\"He tried to act like he cared, like he was their friend,\" said Hardy, who supported many of the families.\nShe said Bush had \"exploited the most vulnerable people\" when they were at their lowest ebb.\nIn June 2024, after Bush was exposed, Peter Moody's family held a second funeral for him - six months after the first.\nHis daughter described the first, including how Bush had \"rushed us out\" of the service, leaving the family \"unable to grieve together\".\n\"As soon as the curtains were closed on my dad, he wanted us out,\" she added.\n'Licence to print money'\nCharities have also been left reeling from Bush's offending.\nHe stole the collection held at the funeral of a former Hull trawlerman.\nThe money was meant for the Hull Fishing Heritage Centre, a charity that supports the city's former trawlermen and their families.\nChairman Jerry Thompson said: \"I do not know how he [Bush] can sleep at night.\"\nHe said Bush had effectively turned his position into \"a licence to print money\".\nMeanwhile, Moody said she would never recover.\n\"I still have his [her father's] number in my mobile and I can't bear to delete it,\" she said.\n\"He was always only a phone call away and I miss him so much.\"\nListen to highlights from Hull and East Yorkshire on BBC Sounds, watch the latest episode of Look North.\nGet in touch\nYour Voice\nDownload the BBC News app from the App Store, external for iPhone and iPad or Google Play, external for Android devices\nRelated topics\n- Published25 June 2025\n \n- Published2 April 2025\n \n- Published14 March 2024\n \n- Published4 April 2024\n \n- Published29 April 2024\n \n- Published16 May 2024\n \n- Published20 January 2025\n \n- Published14 November 2024\n \n- Published13 May 2024", "translation_ja": "", "vocab": [{"word": "conditional bail", "definition": "特定の条件付きで釈放されること。被告が裁判まで自由に過ごすことを許可されるが、条件を守らなければならない。"}, {"word": "fraudulently", "definition": "詐欺的に、不正な手段で。法律用語として、意図的に他者をだまして利益を得る行為を指す。"}, {"word": "exploited", "definition": "搾取した、不当に利用した。弱い立場の人々の状況を悪用して利益を得ること。"}, {"word": "ordeal", "definition": "つらい経験、苦難。長く続く困難または苦しい状況を指す。"}, {"word": "remorse", "definition": "後悔、懺悔の念。自分の悪い行為に対する深い遺憾の気持ち。"}, {"word": "pivotal", "definition": "極めて重要な、決定的な。物事の流れを大きく変える中心となる。"}]}, {"title_ja": "インド世代Z、ユーモアとウイルス活動でモディ政府に勝利", "title_en": "Indian Gen Z Defeats Modi Government Through Humor and Viral Activism", "summary_ja": "インドの若者は「ゴキブリ」抗議運動を通じて、Instagramミーム、風刺ポスター、ユーモアを主な武器として、政府に大臣の辞任を強要することに成功した。失業者に関する物議を醸す発言に触発されたZ世代の抗議者は、前世代とは異なる大胆さと革新的な抗議戦術を示している。彼らのキャンペーンは、デジタルネイティブなアクティビズムとミーム文化がいかに世界最大の民主主義国家の政治権力に挑戦できるかを示す。", "summary_en": "Indian youth have successfully pressured the government into ministerial resignation through the \"Cockroach\" protest movement, using Instagram memes, satirical posters, and humor as their primary weapons. The Gen Z protesters, inspired by a controversial remark about unemployed young people, have demonstrated fearlessness and innovative protest tactics that differ significantly from previous generations' approaches. Their campaign showcases how digital-native activism and meme culture can challenge political establishments in the world's largest democracy.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/indian-youth-score-a-win-over-modi-with-humor-and-grit/a-78132308?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Indian youth score a win over Modi with humor and grit\nJuly 27, 2026Walking from Jantar Mantar to Connaught Place in central New Delhi on Saturday evening provided an unusual sight for the prime corridor of power in the world's largest democracy.\nSatirical posters mocking India's legislative, executive and judiciary were plastered on the walls, and the pavement was sprayed with sometimes \"vulgar\" graffiti mocking Prime Minister Narendra Modi.\nThese were all remnants of thousands of young \"Cockroach\" movement protesters who had flooded the streets hours earlier after India's Education Minister Dharmendra Pradhan resigned.\nCelebrating Pradhan's resignation, which had been a core protest demand, some protesters where heard telling security officials \"see you at the next protest,\" coming only days after several people were injured in clashes with baton-wielding police who fired tear gas into crowds.\nInstagram was also full of images from cities across India with young people dancing in front of police officials to the line \"Everybody knows that I'm a good girl, officer \" from Lana Del Ray's song \"Playing Dangerous.\"\nOthers held posters reading: \"Cuff me, daddy\" and some were seen climbing atop police barricades.\nIndia's Gen Z rattles government into change\nThe movement, known as the Cockroach Janta Party movement (CJP), came after the Chief Justice of India referred to unemployed young people as \"cockroaches\" in an offhand remark. The name is also a play on Narendra Modi's Hindu nationalist Bharatiya Janata Party (BJP).\nSince a scandal broke in May involving a highly competitive university entrance exam, the Gen Z protests have spread across India, challenging the political establishment with Instagram reels, viral trends, sarcastic jingles and posters.\n\"In our generation humor has become the defense mechanism from pain, frustration and helplessness. This entire protest is driven by humor, driven by Instagram and social media,\" Karan Azad, a 24-year-old law student, told DW at the Jantar Mantar protest site in New Delhi.\nAnother protester held a sign addressed to Modi reading in transliterated Hindi: \"Buddy, you can't even make tea,\" alluding to Modi's boyhood days as a tea seller.\n\"I had to do my part. I am the youth. If we don't stand up for ourselves no one else will, we have to fight this battle ourselves,\" she told DW without giving her name.\nA protesters named Tushar, also 24, was holding up a print out of Modi depicted as a fairy with words that read \"I am fairy, don't touch me.\"\nHe said he wasn't \"afraid of a backlash\" from the authorities, but rather \"would have had FOMO (fear of missing out)\" had he not joined the protest.\nRidhima, a 17-year-old school student, said: \"If not us then who? Those who are not here, it just speaks to their cowardice and I am talking about people who are sitting on their chairs in positions of power.\"\nWhat drove the Cockroach movement?\nContent creator Arun Singh, known by his social media handle \"TheJhumroo,\" said that meme culture kept the satire and humor fresh throughout the protests.\"\n\"It's the meme culture which fuelled this kind of emotion. As millennials, we developed the language of memes as we adapted to the internet culture, but this younger generation was born with memes being their language. This is how they communicate,\" he told DW.\nSingh said that the young protesters are best described as \"fearless.\"\n\"They don't fear anyone, they don't worry about how they would be perceived and that's what happens when you're absolutely young. That is what is driving their grit,\" he said.\nMumbai-based comedian Aditi Mittal observes that the fearlessness of the Gen Z protesters comes from them living in a \"hyper visible world\".\n\"All of them have 500 followers at a minimum. If something goes up on their stories, it's not going to go vastly ignored,\" she told DW.\nMittal also thinks that India's Gen Z inherited the \"perfect protest.\"\n\"The generation prior to ours wanted better infrastructure. We millennials aspired to have a more equal world, ours was a time distinct with, for example, the mistreatment of Muslims. We grew up in that and were constantly gaslit into… it's not that bad, it's not happening. We were also overly forbearing,\" she told DW.\n\"Gen Z inherited the perfect protest. Education goes beyond religion and secularism, It can resonate, especially for a country like ours where education has been the tool of escape from social class or a financial situation,\" Mittal said.\nMittal also points out differences between today and the 2019 citizenship law (CAA) protests, one of the last big protests that had challenged the Modi government, and was centered on discrimination against Muslims.\n\"The anti-CAA protests constantly demanded the perfection of the protesters. Be nice to them [authorities] even as they beat you or hold a gun to you, that was the language spoken to us. But these younger kids don't stand around and wait. They are not tripping over themselves to be perfec", "translation_ja": "", "vocab": [{"word": "satirical", "definition": "皮肉や風刺を使って批判する様子を表す形容詞。政治的メッセージを喜劇的に表現する際に用いられる。"}, {"word": "establishment", "definition": "権力や権威を持つ既存の体制や機関を指す名詞。通常、社会的な支配層や政治的権力構造を意味する。"}, {"word": "resilience", "definition": "困難や挫折から回復する能力のこと。本記事では若者の精神的な強さと決意を表現するために使用される。"}, {"word": "catalyst", "definition": "変化や反応をもたらすきっかけになる出来事や人物。ここでは大臣の辞任発言が抗議運動の引き金となったことを指す。"}, {"word": "cohesion", "definition": "グループやコミュニティがまとまって結束する状態。ソーシャルメディアを通じた若者の連帯を表現する。"}, {"word": "hyper-visible", "definition": "非常に目立つ、または常に注目される状態。ソーシャルメディア時代における個人の存在の可視性を指す。"}]}, {"title_ja": "ガーナの社会奉仕法案：刑務所過密化への解決策", "title_en": "Ghana's Community Service Bill: A Solution to Prison Overcrowding", "summary_ja": "ガーナ議会は2026年社会奉仕法案を可決し、軽微な犯罪に対して投獄の代わりとなる非監禁的な選択肢を提供することを目指しています。この法案は、3年以下の懲役に処せられる犯罪に対して、裁判所が社会奉仕を科す枠組みを確立しています。ガーナは回復的司法アプローチを採用する他のアフリカ諸国に加わっており、実装の詳細と公共教育が成功の鍵となります。", "summary_en": "Ghana's parliament passed the Community Service Bill 2026 to provide noncustodial alternatives to imprisonment for minor offenses, aiming to reduce prison overcrowding and costs. The legislation establishes a framework for courts to impose community service instead of jail time for crimes punishable by up to three years imprisonment. Ghana joins other African nations in adopting restorative justice approaches, though implementation details and public education remain critical for success.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ghana-s-community-service-bill-a-fix-for-the-prison-crisis/a-78104226?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ghana's community service bill: A fix for the prison crisis?\nJuly 27, 2026Ghana's parliament recently passed the Community Service Bill, 2026. The piece of legislation is designed to introduce community service as an alternative to custodial sentences for minor offenses. The bill also seeks to ease pressure on the country's overcrowded prisons and reshape how justice is administered for minor crimes.\nThe legislation establishes a National Community Service Secretariat and provides a legal framework for courts to impose community service in Ghana instead of imprisonment for specified offenses.\nAccording to the government, the move will reduce the financial strain of maintaining prison facilities, which have long suffered from inadequate budgets, high medical costs and chronic congestion.\n\"If you check the current prison population, overcrowding is over 37%. We have a current population of over 13,000 prisoners. Today the cost of maintaining them, feeding them alone, requires 10 million cedis (€752,000, $859,000) a quarter,\" Ghana's Interior Minister, Muntaka Mubarak, who tabled the bill in parliament, told the house during a debate.\nWhich offenses are covered under the community service bill?\nUnder the bill, community service applies to offenses punishable by not more than three years' imprisonment, with or without a fine. Courts may also impose community service for offenses that carry fines alone or fines combined with imprisonment.\nThis means petty crimes such as false publication or traffic offenses could now attract noncustodial penalties.\nLegal practitioner Christian Malm Hesse described the bill as \"a step in the right direction,\" noting its potential to reduce prison overcrowding. He told DW that the bill provides a structured alternative for misdemeanor offenses that previously defaulted to custodial sentences.\nHowever, some Ghanaians believe that its effectiveness will depend on proper categorization of offenses and public education.\nAccording to DW correspondent Eric Mawuena Egbeta, many Ghanaians still need clarity on which offenses qualify. \"An offense which is higher than a misdemeanor would mean that you will not get a community sentence… a lot more persons would need education on it,\" Egbeta said.\nFor legal practitioners like Hesse, one key safeguard in the bill is the requirement for a social inquiry report, which helps judges assess an offender's background, circumstances, and suitability for community service. Hesse said such measures ensure that sentencing decisions are informed and consistent, reducing the risk of arbitrary application.\nAfrica's shift toward noncustodial sentencing\nGhana's new passage aligns with a growing trend across Africa, where countries such as Nigeria, Kenya, Zimbabwe, Malawi, Tanzania and Uganda have adopted similar noncustodial sentencing legislation.\nInternational bodies, including the United NationsOffice on Drugs and Crime, have long encouraged alternatives to establish, citing benefits such as reduced recidivism (where a person returns to criminal behavior and is sent back to jail after finishing a past sentence), lower state expenditure, and improved community reintegration.\nFor Ghana, the bill represents the culmination of a decade-long policy process initiated in 2014 by the Ministry of the Interior with support from UNICEF. The resulting framework aims to modernize justice administration and align national laws with global best practices on restorative justice.\nExperts say the bill could be a game-changer for the continent, offering a model for balancing accountability with rehabilitation. By redirecting minor offenders toward community labor, skills development, and civic responsibility, Ghana joins a broader African effort to rethink punishment beyond incarceration.\nWhat do Ghanaians think about the bill?\nChristabel Success, a Ghanaian journalist, said the law is \"most appropriate for minor offenses,\" but stressed the need for fairness in its application. \"The method of application is what will determine whether it is a good bill or not,\" she told DW.\n\"It will help us with our capacity building, nation building, and ridding our communities and our environment of waste,\" Nurah Suglo, an Accra-based resident, told DW. \"We'd have cleaner cities, cleaner regions, and make good use of our labor instead of overcrowding our prisons. People with minor offenses get to also do something that will contribute to the nation as a whole,\" Success added.\nEgbeta, however, noted that crimes classified as second-degree felonies, such as stealing after breaking into a home, remain outside the bill's scope, which may disappoint those hoping for broader reforms. Although Parliament has passed the Community Service Bill, it cannot take effect until President John Dramani Mahama gives his assent.\nDespite hailing its passage, Hesse explained that another crucial step for the bill is the creation of a Legislative Instrument (L.I). \"What is left is an L.I. When bills like this a", "translation_ja": "", "vocab": [{"word": "custodial", "definition": "拘留や投獄に関連する。「custodial sentences」は懲役刑を意味し、収監による刑罰を指します。"}, {"word": "recidivism", "definition": "刑務所から釈放された人が再び犯罪を犯し、再投獄される現象。犯罪者の再犯率を表す専門用語です。"}, {"word": "restorative justice", "definition": "加害者と被害者の関係修復と社会復帰に重点を置く司法制度。従来の懲罰的司法とは異なるアプローチです。"}, {"word": "noncustodial", "definition": "投獄を伴わない。社会奉仕や罰金など、監禁以外の処罰方法を指します。"}, {"word": "congestion", "definition": "過度な混雑や混み具合。ここでは刑務所の過密状態を意味します。"}, {"word": "misdemeanor", "definition": "軽犯罪。より重大な重罪（felony）よりも軽い犯罪を分類する法律用語です。"}]}, {"title_ja": "フジモリ大統領、中国と米国のバランス戦略の中ペルー政権を掌握", "title_en": "Fujimori Takes Charge in Peru Amid China, US Balancing Act", "summary_ja": "ケイコ・フジモリがペルーの大統領に就任し、治安、インフラ、経済回復に焦点を当てる。米国と中国の地政学的競争の場となったペルーの戦略的重要性、特に中国が支援するチャンカイ港に関して、ワシントンと北京の両国との協力のバランスを取る必要がある。両国とのバランスを取ることが政権の成功に不可欠となる。", "summary_en": "Keiko Fujimori assumes Peru's presidency with a focus on security, infrastructure, and economic recovery. She must navigate Peru's strategic importance as a battleground for US-China geopolitical competition, particularly regarding the Chinese-backed Chancay port. Balancing cooperation with both Washington and Beijing will be critical to her administration's success.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/fujimori-takes-charge-in-peru-amid-china-us-balancing-act/a-78110410?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Fujimori takes charge in Peru amid China, US balancing act\nJuly 27, 2026When Keiko Fujimori steps into the presidential office on Tuesday, she'll bring back a political movement that hasn't been in power for more than a quarter century.\nFujimorism, a mix of neoliberalism, populism and strict government policies, characterized the 1990-2000 presidency of her father, the late Alberto Fujimori. Keiko Fujimori is stepping in amid a climate of social polarization, with promises to deliver more security, economic recovery and improvements in the health and education sectors.\nBut beyond those domestic projects, Fujimori is taking charge at a time of increased strategic importance for Peru. The country has become one of the key battlegrounds in the growing competition between the United States and China for political influence in South America.\nTough on crime\nFujimori has already signaled that security will be the top priority for her government.\nOn the agenda: more video surveillance, a stronger police presence, tougher punishment for crimes and organized gangs, and command and control centers across the country. Part of the crackdown includes the construction of four mega-prisons, like those in El Salvador.\nEliana Carlin, a political science expert at the Pontifical Catholic University of Peru in Lima, is concerned by how Fujimori's plans will affect human rights.\n\"Behind [these measures] lie strong ideological positions intended to justify making the police and the armed forces solely subject to military jurisdiction,\" she said.\nIn addition to a stronger focus on security, Fujimori has said she intends to advance infrastructure projects, attract private investment, build new schools and hospitals and modernize the country with the help of technology and artificial intelligence.\nBut delivering on these pledges depends largely on whether the government can find the necessary funds. Infrastructure and essential services continue to face significant deficits. Added to that is the surging crime rate and the threat of the strengthening El Nino weather pattern, which could hit Peru with increased drought, extreme heat, flooding and other climate-related disruptions.\nStrategic player in South America\nForeign policy will also be a major challenge for Fujimori's administration. The opening of the Chancay port and logistics hub has turned Peru into a strategic player in regional trade — and made it a central focus in the geopolitical rivalry between Washington and Beijing.\nThe estimated $3.5 billion (€3 billion) project is part of China's world-spanning Belt and Road Initiative. Once fully operational, the port is expected to reduce the shipping time between Peru and China from around 40 to about 23 days, turning Chancay into a new gateway to Asia.\nThanks to the port and other investments, China has become Peru's most important trading partner. Bilateral trade between the two countries exceeded $40 billion in 2024, according to official figures. In second place is the US, with nearly $25 billion in trade.\nMichael Shifter, an adjunct professor at Georgetown University in Washington teaching Latin American politics, said there's a lot at stake in Peru.\n\"Beijing has played a very important role in the Peruvian economy for many years, while at the same time the US is seeking to expand its influence. Nowhere is the competition between Beijing and Washington as evident as in Peru,\" he told DW.\nFor Shifter, the port at Chancay will be important for both Peru and its regional neighbors. \"It will reduce transportation costs and facilitate trade with Asia, particularly with China,\" he said. \"The project has enormous potential for the future of the South American economy.\"\nPart of a planned \"bioceanic\" corridor between Brazil and Peru, the Pacific hub at Chancay will be connected via rail and road projects to the Atlantic Ocean, facilitating the export of products from all over South America to Asia.\nBalancing China, US 'will not be easy'\nFujimori has also announced plans to expand her cooperation with the US, particularly in the areas of security and the fight against organized crime. For Shifter, the challenge will be to maintain the delicate balance between Washington and Beijing.\n\"Keiko wants to align herself with Washington and avoid tensions with the US. At the same time, China has been indispensable to the Peruvian economy for many years, and the port of Chancay enjoys broad support in Peru. Balancing this relationship will not be easy,\" he said.\nTo stay on the US president's good side, Peru's participation in the so-called \"Shield of the Americas\" will also be key. The alliance, initiated by Donald Trump to combat organized crime, has already welcomed the cooperation of, among others, the right-wing governments of Argentina, Chile, Ecuador and El Salvador.\nAccording to Shifter, involvement in \"the 'Shield of the Americas' would also serve to demonstrate a closeness to the Trump administration.\"\nNew roll for Peru in Latin Amer", "translation_ja": "", "vocab": [{"word": "neoliberalism", "definition": "新自由主義の立場を指し、市場経済を重視し、政府の規制を最小化する経済・政治的イデオロギー。"}, {"word": "geopolitical", "definition": "地政学的な、つまり国家間の政治的な権力競争と地理的条件や資源の関係に関連する。"}, {"word": "bilateral trade", "definition": "二国間の商取引。2つの国の間で行われる輸出入および商品・サービスの交換。"}, {"word": "crackdown", "definition": "取り締まり、厳しい抑止措置。犯罪や違法行為に対する厳格な規制や警察活動。"}, {"word": "jurisdiction", "definition": "管轄権、裁判権。特定の機関や組織が法的権限を行使できる範囲や領域。"}, {"word": "logistics hub", "definition": "物流の中心地。商品の輸送、保管、配分を管理・促進する主要な拠点。"}]}, {"title_ja": "トランプ大統領、イラン攻撃を延期し外交交渉を検討", "title_en": "Trump Holds Off Iran Strikes, Weighs Diplomatic Options", "summary_ja": "ドナルド・トランプ大統領は2月28日にイランに対する大規模な戦闘作戦を発表し、米国とイスラエルによる大規模な共同攻撃を実施しました。現在、政権は軍事備蓄と戦略的選択肢を評価しながら、外交的代替案を検討しています。", "summary_en": "President Donald Trump announced major combat operations against Iran on February 28, involving massive joint U.S.-Israeli strikes. The administration is now considering diplomatic alternatives while assessing military stockpiles and strategic options moving forward.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates-tehran-progress-made-strait-hormuz/?id=135110405", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、重大なニュースと生放送イベントの24時間体制での報道を提供しています。プラットフォームは、世界中の主要なニュースが展開する際にリアルタイム更新を配信しています。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. The platform delivers real-time updates on major stories as they develop.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シアトルの食の祭典での銃撃で3人死亡、4人負傷", "title_en": "3 Dead, 4 Injured in Shooting at Seattle Food Festival", "summary_ja": "日曜日にシアトルセンターで開催されていた「シアトルの一口」フードフェスティバルで銃撃事件が発生し、3人が死亡、4人が負傷した。この事件は人気のあるコミュニティイベント中に起きた。当局は銃撃事件の状況について調査を進めている。", "summary_en": "A shooting at the Bite of Seattle food festival at Seattle Center on Sunday resulted in three deaths and four injuries. The incident occurred during the popular community event. Authorities are investigating the circumstances surrounding the shooting.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/multiple-people-shot-seattle-center-police/story?id=135108867", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウガンダが干ばつで19人の死亡後に緊急食糧配給を開始", "title_en": "Uganda launches emergency food relief as drought kills 19 in Karamoja", "summary_ja": "ウガンダは長期的な干ばつで少なくとも19人の飢餓による死亡が報告されたカラモジャ地域で、9,400トンの緊急食糧配給を開始しました。降雨量の不足により農作物が失われ、150万人が深刻な食糧不足に直面しています。政府主導の配給は国際援助機関が大幅に事業縮小する中で、450億シリングの配分により実施されています。", "summary_en": "Uganda has begun distributing 9,400 tonnes of emergency food after at least 19 deaths from hunger were reported in the drought-stricken Karamoja region. The crisis stems from failed crops due to prolonged lack of rainfall, affecting 1.5 million people. The government-led distribution, funded by a 45 billion shilling allocation, marks a shift as international aid agencies drastically reduce their operations.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/jul/27/uganda-begins-emergency-food-handouts-after-19-die-from-hunger", "state_media": false, "category": "政治", "full_text": "Uganda has launched emergency food relief distribution after at least 19 deaths from hunger were reported in an area of prolonged drought in the east of the country.\nA crisis has been building in the Karamoja region of Uganda as crops have failed without the season’s expected rains, leaving the region’s 1.5 million people facing acute food shortages and rising malnutrition.\nThe Famine Early Warning Systems Network (Fews Net), a global mapping network designed to raise the alert on food security, reported the situation had deteriorated to a crisis across Karamoja.\nIn the first large-scale operation of its kind organised by the Ugandan government after the funding void left by aid cuts, authorities announced plans to distribute 9,400 tonnes of relief food over the next two months. The supplies were procured using a 45bn-shilling (£9m) emergency funding allocation, approved by parliament.\nSam Engola, minister for disaster preparedness and refugees, launched the aid distribution efforts at a primary school in Lodiko sub-county in Kaabong district on Wednesday.\n“The president does not want to hear of anyone in Karamoja dying of hunger. I am here to supervise the distribution of this food to the end. I will ensure that everyone receives food. No one will be left behind,” Engola said.\nKaramoja is experiencing its most severe dry spell in years. Farmers have lost crops since the last meaningful rainfall was recorded in April – the beginning of the planting season.\nAngelina Nakiru, a 21-year-old mother of two in Rupa, about 5 miles from Moroto town in Karamoja, said she was struggling to feed her children after all her crops failed. Now she goes early each morning to join other women at a small-scale grinding mill where machines are used to crush rock into powder to wash out gold-bearing ore. The pay is meagre.\n“The work is dusty and exhausting, but it is the only way I can earn money to buy a cup of maize and beans to feed the children,” Nakiru said.\n“If I don’t, the children will sleep hungry. Other days when I fail to get the meagre income from the mill, we go to bed on empty stomachs,” she said.\n“The situation is terrible. People are starving and dying due to hunger. The government must come to the rescue of the people.”\nHealth facilities report treating hundreds of children for severe malnutrition. A nutrition report published in June found nearly half of the population in Karamoja’s Kaabong and Kotido districts in a crisis situation.\nExperts attribute the region’s recurring food insecurity and vulnerability to climate crisis shocks, environmental degradation such as deforestation and overgrazing, as well as poverty and low agricultural productivity.\nIn 2022, a devastating hunger crisis claimed more than 2,200 lives, according to figures from Uganda’s human rights commission body.\nWhile emergency food aid is expected to provide short-term relief, the government said it remained committed to implementing long-term remedial measures with the recently approved Karamoja regional development plan, which is intended to strengthen communities’ resilience to drought.\nJohn Baptist Lokii, minister for Karamoja, said: “The government will provide drought-resistant, disease-resistant and early-maturing seeds ahead of the next planting season.”\nAgnes Kirabo, executive director of Uganda’s Food Rights Alliance (FRA), said the government was taking the lead on distribution as a necessity as much as a policy choice as the landscape of humanitarian aid had changed dramatically.\nFollowing significant funding cuts, most notably from USAID, which previously had an annual budget of about $42.8bn (£32.bn), agencies such as the World Food Programme (WFP) have been forced to drastically scale back their aid.\nIn Uganda, the WFP has phased out food assistance for 63% of the refugee population, cutting off more than 1 million people from aid, and reducing rations to just 663,000 recipients.\n“This transition should not be viewed solely as a reaction to aid cuts, but also as a positive shift towards nationally owned, sustainable development. Government leadership is a constructive move, provided it is part of a long-term strategy to establish durable national systems,” said Kirabo.\n“Emergency food distribution is a life-saving measure, not a permanent solution. To break this cycle, we must address the root causes of food insecurity through structural reforms.”\nThe FRA, Kirabo said, wanted access to food to be made a fundamental human right and the government to turn its attention to water infrastructure and climate resilience. “Karamoja possesses adequate rainfall and water routes to achieve food self-sufficiency, but requires the political will to strategically invest in water infrastructure for production,” she said.\n“Ultimately, the Karamoja hunger crisis is a governance crisis. The government’s leadership in this emergency is welcome, but it must be matched by the political will to implement the systemic changes required to permanently", "translation_ja": "", "vocab": [{"word": "deteriorated", "definition": "悪化した、低下した状態。ここでは食糧危機の状況が深刻化したことを表します。"}, {"word": "acute", "definition": "急性の、深刻な。医学や問題の文脈では、急速に進行する重大な状態を意味します。"}, {"word": "vulnerability", "definition": "脆弱性、傷つきやすさ。ある集団や地域が外的な危機に対して抵抗力を持たない状態を指します。"}, {"word": "remedial", "definition": "是正的な、改善を目的とした。問題を解決または状況を改善するための措置を表します。"}, {"word": "phased out", "definition": "段階的に廃止する、徐々に中止する。長期間にわたって段階的にサービスや製品を停止することを意味します。"}, {"word": "durable", "definition": "持続可能な、耐久性のある。長期的に継続する、または続く可能性が高い状態を表します。"}]}, {"title_ja": "ロシア人2人、テロとスパイ容疑でアンゴラで投獄", "title_en": "Two Russian men jailed in Angola for terrorism and spying", "summary_ja": "アンゴラの裁判所は、テロとスパイ容疑でロシア人2人、レフ・ラクシュタノフとイゴール・ラチンにそれぞれ8年と11年の懲役刑を言い渡した。検察当局は、彼らがアンゴラの大統領選挙に影響を与えようとし、ロシアの偽情報ネットワーク「アフリカ・ポリトロジー」と関連していると主張した。2人は容疑を否定し、文化的および商業的活動でアンゴラにいたと主張している。", "summary_en": "An Angolan court has sentenced two Russian men, Lev Lakshtanov and Igor Ratchin, to 8 and 11 years in prison respectively for terrorism and spying charges. Prosecutors alleged they attempted to influence Angola's presidential elections and were linked to Africa Politology, a Russian disinformation network. The men denied the charges, claiming they were in Angola for cultural and business activities.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/jul/23/two-russian-men-jailed-angola-terrorism-and-spying", "state_media": false, "category": "社会", "full_text": "Two Russian men have been found guilty by an Angolan court of terrorism and spying after being accused of planning a coup and helping to organise deadly demonstrations in the southern African country last year.\nLev Lakshtanov and Igor Ratchin were sentenced to eight and 11 years in jail respectively. They had denied the charges, claiming they were in Angola for cultural and business activities.\nFrom 28-30 July 2025, a minibus taxi strike over fuel price hikes descended into riots and looting, in which 22 people were killed and more than 1,600 arrested according to official figures.\nAngola’s security forces were accused of firing live ammunition at protesters; the government said its “progressive” use of force was justified. Human Rights Watch had previously said Angola employed “excessive force” when it used rubber bullets and teargas to break up a peaceful protest against rising fuel prices on 12 July 2025.\nAngolan prosecutors said Lakshtanov and Ratchin wanted to influence next year’s presidential elections, including by funding Angola’s largest opposition party, the National Union for the Total Independence of Angola (UNITA), or by forcing a leadership change within the Popular Movement for the Liberation of Angola (MPLA), which has ruled the country since independence from Portugal in 1975.\nProsecutors also claimed the men were linked to Africa Politology, a Russian disinformation and propaganda network that emerged from the Wagner mercenary group.\nAfrica Politology was taken over by Russia’s Foreign Intelligence Service (SVR) after the death of the Wagner chief Yevgeny Prigozhin in 2023, according to an investigation by media outlets including Forbidden Stories. Wagner was rebranded as Africa Corps and absorbed by Russia’s military.\nAngola, whose economy is highly dependent on oil exports, has historically been close with Russia. During the cold war years of Angola’s 1975-2002 civil war, the Soviet Union and Cuba supported the MPLA, while the US and apartheid South Africa backed its opponents, including UNITA. However, Angola’s president, João Lourenço, has improved relations with the US and Europe since taking power in 2017.\nIn the last decade, Russia has increased its presence in Africa. The Wagner group and then Africa Corps have provided security for the Central African Republic’s president, Faustin-Archange Touadéra, since 2017.\nIn 2021, Wagner forces arrived in Mali to support the military junta. Africa Corps also backs the military regimes in neighbouring Niger and Burkina Faso. Since 2023, Russian troops have also been deployed in Equatorial Guinea, Libya and Sudan, according to a US Congress report.\nMadagascar’s president, Michael Randrianirina, has also boosted ties with Russia since taking power in a coup in October 2025. There are Russians in his presidential guard and a weekly programme about Madagascar-Russia relations was launched earlier this month on national television.\nTwo Angolans were also tried alongside the Russians. The sports journalist Carlos Tomé received a two-year suspended prison sentence. Francisco de Oliveira, the secretary-general of UNITA’s youth wing, was acquitted.\nProsecutors have appealed against those sentences, according to the Portuguese news agency Lusa. Lakshtanov and Ratchin have also appealed against their sentences, but will remain in detention while the appeal is processed, according to Lusa.\nRussia’s embassy in Angola did not immediately respond to a request for comment.\nAgence France-Press contributed to this report", "translation_ja": "", "vocab": [{"word": "disinformation", "definition": "意図的に広められた虚偽の情報のこと。政治的または戦略的な目的で使用される。"}, {"word": "mercenary", "definition": "金銭のために他国や団体のために戦う傭兵のこと。ここではワグネル傭兵グループを指す。"}, {"word": "junta", "definition": "クーデターによって権力を掌握した軍事グループまたは政権のこと。"}, {"word": "acquitted", "definition": "裁判で無罪と判定されること。有罪ではないと法廷で判断されることを意味する。"}, {"word": "appellate", "definition": "上訴に関する、または控訴審に関する。判決に対する異議申し立てプロセスに関連している。"}, {"word": "geopolitical", "definition": "地理的な位置と政治的利益の関係に関する。国家間の権力競争と地域的影響力に関連する用語。"}]}, {"title_ja": "イギリス軍兵士の起訴権をめぐってケニアでの軍事訓練をキャンセル", "title_en": "UK Cancels Kenya Army Training Over Soldier Prosecution Powers", "summary_ja": "英国防省は、ケニア政府がイギリス兵士に対する強力な起訴権なしに防衛協定の批准を拒否したため、ケニアでの予定されていた陸軍訓練演習をキャンセルしました。ケニアは、英国軍事基地での人権侵害と性的虐待の疑いに関する議会調査から懸念を引き出し、英国兵士による重大な犯罪に対する管轄権の拡大を要求していました。紛争はまた、事件の管轄権とケニアへの財政的補償に関する意見の相違も含んでいました。", "summary_en": "The British Ministry of Defence has cancelled planned army training exercises in Kenya after the Kenyan government refused to ratify a defence agreement without stronger prosecution powers over British soldiers. Kenya demanded greater jurisdiction over serious offences committed by British troops, citing concerns from a parliamentary inquiry into alleged human rights violations and sexual abuse at the British military base. The dispute also involved disagreements over jurisdiction of cases and financial compensation to Kenya for hosting the training camp.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/uk-news/2026/jul/23/british-army-cancel-training-kenya-defence-agreement-dispute", "state_media": false, "category": "政治", "full_text": "The British army has been forced to cancel training for its troops in Kenya after the Kenyan government refused to ratify a bilateral defence agreement.\nWhile the UK government wanted to renew the existing agreement, Kenyan lawmakers had sought changes to give local authorities greater powers to hold British soldiers accountable for any offences committed in the country.\nAccording to the Kenyan news outlet the Daily Nation, the dispute centres on which cases Kenya will retain primary jurisdiction over, while the amount of money Britain pays Kenya to host the training camp has also been a sticking point.\nThe chair of the Kenyan national assembly’s defence, intelligence and foreign relations committee, Nelson Koech, said the two governments were “actively engaging to address these outstanding issues”.\nAs a result of the Kenyan government’s decision, a planned exercise involving the 1st Battalion the Duke of Lancaster’s Regiment, which was due to begin in September, has been cancelled.\nA Ministry of Defence spokesperson said: “The UK highly values its relationship with Kenya, which is underpinned by mutual benefit, respect and cooperation. The UK-Kenya Defence Partnership is one of the great strengths of our relationship. Our joint training and operations with the Kenyan Defence Forces are keeping both Kenyan and British people safe.\n“It is with regret that the necessary licences required to allow training to take place in Laikipia later this year have not been forthcoming. As a result, the planned training will now be conducted at an alternative location outside Kenya.”\nKenya also benefits from training of its own armed forces at BATUK, the British army base near Nanyuki, and the presence of British troops is valuable for the economy.\nThe MoD spokesperson added: “We recognise the disappointment this decision will cause for those who would have benefited from the economic activity generated by the exercise.”\nThey said the UK government remained “committed to our defence partnership with Kenya”, adding that the UK would “continue to engage closely with the Kenyan government to support the resumption of training in-country at the earliest appropriate opportunity”.\nHowever, there has been sustained pressure from Kenyan people opposed to the British army’s continued presence. Last year, a report to the Kenyan parliament into the base alleged human rights violations, environmental destruction and sexual abuse by British soldiers.\nThe most high-profile case linked to the base is the death of Agnes Wanjiru, in which a British soldier has been charged with murder. Kenya has retained jurisdiction in the case and an extradition hearing is due to take place in November. Robert Purkiss denies the single charge of murder.\nLegal proceedings had stalled since Wanjiru’s death in 2012, but advanced under John Healey’s tenure as defence secretary. As shadow defence secretary, he had called on the previous government to do more to progress the case.\nKoech said the committee had called for “stronger accountability measures, including jurisdiction over serious offences, enhanced protection for local communities, and implementation of recommendations arising from the BATUK inquiry”.", "translation_ja": "", "vocab": [{"word": "ratify", "definition": "正式に批准する、承認する。国家が国際条約や協定に法的に同意することを意味します。"}, {"word": "bilateral", "definition": "二国間の、双方向の。2つの国または団体の間に関するという意味です。"}, {"word": "jurisdiction", "definition": "管轄権、司法権。特定の法廷や政府機関が法的権限を行使できる範囲を指します。"}, {"word": "sticking point", "definition": "対立点、懸案事項。交渉や議論で合意を妨げる問題のことです。"}, {"word": "sustained", "definition": "継続的な、持続する。長期間にわたって続いている状態を表します。"}, {"word": "extradition", "definition": "身柄引き渡し、引き渡し。ある国が他国に容疑者や犯人を引き渡すことです。"}, {"word": "accountability", "definition": "説明責任、責任。個人や組織が自らの行動について説明し、責任を負う義務です。"}]}, {"title_ja": "ウェストバンクにおけるイスラエル入植者暴力の地図化", "title_en": "Mapping Israeli settler violence in the West Bank", "summary_ja": "イスラエル入植者がウェストバンク全域で暴力行為を激化させており、2つのモスクを焼き、「ユダヤ人の報復」という落書きをしている。国連データによると、2025年1月から2026年6月の間に3,033件の入植者による攻撃が記録され、2025年と比較して2026年の月間攻撃件数が24%増加し、数千人のパレスチナ人が避難を余儀なくされている。", "summary_en": "Israeli settlers have intensified violent attacks across the occupied West Bank, including burning two mosques and spray-painting 'Jewish revenge' graffiti. UN data shows 3,033 settler attacks between January 2025 and June 2026, with attacks increasing 24% monthly in 2026 compared to 2025, displacing thousands of Palestinians.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/7/27/mapping-israeli-settler-violence-in-the-west-bank?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Mapping Israeli settler violence in the West Bank\nIsraeli settlers have set fire to a mosque in the West Bank village of Qusra, and continued violent attacks.\nIsraeli settlers set fire to two mosques in separate attacks in the occupied West Bank in the early hours of Sunday, causing significant damage and daubing them with racist graffiti.\nThe mosques are Al-Rahma in Qusra, south of Nablus, and one in the village of Kour, south of Tulkarem.\nRecommended Stories\nlist of 4 items- list 1 of 4Why are Israeli settlers on a rampage in the occupied West Bank?\n- list 2 of 4Israeli crackdown in occupied West Bank intensifies, settlers cause mayhem\n- list 3 of 4Israeli settlers burn two mosques in occupied West Bank\n- list 4 of 4Israeli forces storm multiple West Bank towns, settler violence worsens\nIsraeli settlers also spray-painted the words “Jewish revenge” as the mosques were set on fire.\nThis is the latest incident in years of violent occupation and ethnic cleansing of the Palestinian people by Israeli settlers and forces.\nPalestinian officials say at least 45 mosques were vandalised or burned by illegal settlers in the West Bank in 2025 alone.\nOn Friday, a group of Israeli settlers who are supposed to be restricted from entering Palestinian areas entered the village of Tal (Tell), southwest of Nablus, triggering a confrontation with Palestinian residents.\nAccording to Al Jazeera Arabic, the residents forced them to retreat, but the settlers stormed back within the hour, past the Havat Gilad settlement post, sparking clashes and physical fighting between the unarmed Palestinian residents and the armed settlers.\nFarouk Ramadan, an unarmed resident, reportedly seized a rifle from an armed Israeli and opened fire.\nDuring the incident, four Palestinians and two Israeli soldiers were killed, while several others were wounded.\nIs Israeli settler violence in the West Bank common?\nData from the United Nations Office for the Coordination of Humanitarian Affairs (OCHA) shows that between January 1, 2025 and June 31, 2026, there were 3,033 Israeli settler attacks.\nThe Ramallah and el-Bireh governorate recorded the highest-ever number of settler attacks for the same time period, with 881 incidents, followed by Nablus with 660 and Hebron with 497.\nSince Israel’s genocidal war on Gaza began in October 2023, violence by Israeli settlers in the occupied West Bank has steadily risen.\nSome 1,291 settler attacks were recorded in 2023, rising to 1,449 in 2024, 1,835 in 2025 and 761 in the first four months of 2026. That equates to an average of 190 attacks per month in 2026, up from 153 per month in 2025 – a 24 percent increase in the monthly rate.\nEvery West Bank governorate has faced settler attacks over the past year.\nWho are Israeli settlers?\nSettlers are Israeli citizens living in illegal, Jewish-only communities, known as Israeli settlements, built on Palestinian-owned land that Israel occupied in 1967.\nBenjamin Netanyahu – Israel’s longest-serving prime minister – has bolstered settlement expansions since he first came to power in 1996, undermining the 1993 Oslo Accords, which called for the freezing of settlements and a mutually negotiated two-state solution.\nEarlier this year, for example, the Israeli government approved a plan to begin land registration in the occupied West Bank, meaning it will be able to seize land from Palestinians who cannot prove ownership.\nToday, roughly 10 percent of Israel’s Jewish population, totalling between 600,000 and 750,000 people, live in about 250 settlements and outposts dispersed throughout the occupied West Bank and East Jerusalem.\nMany of these settlements are located near Palestinian population centres, often leading to increased tensions and restrictions on movement for Palestinians.\nIsraeli settler violence has displaced thousands\nIn recent years, illegal Israeli settlers have intensified incursions into Palestinian land and expanded illegal settlements, as part of an effort to seize more Palestinian land.\nIn total, at least 1,988 Palestinians were displaced across the occupied West Bank in the first four months of 2026.\nThat’s already 20 percent more than 2025’s tally for the entire year, according to figures compiled by OCHA.\nSince January 2025, the greatest displacement of Palestinians in settler attacks has been seen in Ramallah (1,205), followed by Jericho (861) and Tubas (619).\nWhy most demolitions and attacks are in Area C\nAs part of the 1993 Oslo Accords, signed by the Palestine Liberation Organization (PLO) and Israel, the oc
