<script>
const CATS = ["全て","政治","経済","IT","社会","オピニオン"];
const DATA = [{"title_ja": "英国、ヨルダン川西岸の入植地に制裁を発表、イスラエルが激怒", "title_en": "UK Announces Sanctions on West Bank Settlements, Drawing Israeli Backlash", "summary_ja": "英国は違法なイスラエル入植地への制裁を発表し、入植地商品の禁止と拡張支援企業への制裁を実施しました。外務大臣エド・ミリバンドは入植者の行為を「民族浄化」と表現しました。イスラエル外相は東エルサレムの英国領事館の閉鎖と11人の英国下院議員のイスラエル入国禁止で対抗することを発表しました。", "summary_en": "The UK has imposed sanctions on illegal Israeli settlements in the West Bank, banning settlement goods and targeting companies supporting expansion, with Foreign Secretary Ed Miliband characterizing settler actions as 'ethnic cleansing.' Israel's Foreign Minister responded by announcing the closure of the UK consulate in East Jerusalem and banning 11 UK MPs from entering Israel. The sanctions were launched jointly with France and Canada as part of efforts to protect a two-state solution.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4g7zen0vveo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK announces sanctions on West Bank settlements prompting furious Israeli response\n- Published\nThe UK has announced sanctions on illegal Israeli settlements in the occupied West Bank, accusing Israel's government of turning a blind eye to the \"ethnic cleansing\" of Palestinians by settlers.\nForeign Secretary Ed Miliband said the move marked the \"beginning of a new approach\" to the Israeli-Palestinian conflict, which \"not only calls out injustice and suffering but acts\".\nIsrael's Foreign Minister Gideon Saar responded by accusing him of spreading an \"outrageous lie\" and announced counter-measures including shutting the UK's consulate in East Jerusalem.\nThe UK sanctions will ban settlement goods but also act against companies and individuals providing services for settlement expansion.\n- In West Bank, date farmers weigh impact of UK sanctions on Israeli settlers \n  - Published7 hours ago\n- How Israel is expanding settlements in drive to reshape West Bank \n  - Published21 August\nThe sanctions were launched alongside France and Canada, which in a joint statement with the UK said the action \"marks a further turning point in our approach to protecting the two-state solution\".\nSettlements are illegal under international law, and there has been a rise in violence towards Palestinians in the West Bank by settlers in recent months.\nIn a statement to MPs, Miliband said: \"The British government agrees that there is ethnic cleansing of Palestinians in areas of the West Bank, perpetrated by settler terrorists.\n\"And all too often the Israeli government has turned a blind eye to this and worse, members of it have made statements and taken actions to support the forced displacement of Palestinians.\"\nHe said ethnic cleansing was defined by the UN as a \"purposeful policy designed by one ethnic or religious group to remove by violent means another ethnic or religious group from certain areas\".\nMiliband said the official view of the government was that the Israeli occupation of the West Bank was unlawful because of the \"entrenchment of its control, its intention to extend permanent sovereignty, and its expansionist agenda via illegal settlements\".\nHe said this position, which is in line with a 2024 advisory opinion from the International Court of Justice, should be reflected in the UK's \"economic relationship\" with the occupied West Bank.\nAs a result, over the next six to nine months, the UK will introduce \"a new comprehensive sanctions regime\", he said.\nThe foreign secretary also announced a ban on advertising illegal West Bank settlements in the UK.\n\"The sanctions regime will target illegal settlements and settlement expansion, not Israel,\" Miliband added.\nLater on Tuesday, Prime Minister Andy Burnham said the targeted measures were \"aimed not at the Israeli people, but in support of the two-state solution\".\nAnnouncing the closure of the consulate - which represents the UK government in Jerusalem, the West Bank and Gaza - Israel's Foreign Minister Saar said at a press conference: \"We know that we have many friends in Britain.\n\"Unfortunately, we have a hostile Labour government that is consistently operating against the State of Israel, and it has left us no choice but to respond to its hostile actions.\"\nHe added that 11 UK MPs, including Jeremy Corbyn, Diane Abbott and all five sitting Green Party MPs, would be banned from entering Israel, accusing them of \"antisemitic and anti-Israel activity\".\nThe UK also issued a joint statement with 11 other countries; France, Canada, Denmark, Spain, Finland, Ireland, Iceland, Norway, Poland, Portugal and Sweden.\nIt said the group was unequivocally committed to the two-state solution and would introduce national measures or support European restrictions on trading goods with West Bank settlements.\nThe UK announcement comes after Israel opened up tenders for the construction of some 1,200 settlement homes in the so-called E1 area - a strategically important area east of Jerusalem. The plans have drawn widespread international condemnation. Israel has held off on plans to build in the area for decades under global pressure.\nMiliband told the Commons the UK's \"new approach\" was necessary because plans for the E1 development in the West Bank would render a two-state solution \"unviable\" by \"cutting through the heart of Palestine\".\nElsewhere, he said the Hamas-led attack on southern Israel on 7 October 2023, which triggered the Gaza war, carried \"terrible echoes of the centuries of persecution of the Jewish people\" and stressed Israel had \"the right to protect its people and defend its territory\".\nHowever, he added, \"that cannot justify what has happened in Gaza\".\nHe said: \"International humanitarian law imposes clear rules for states fighting wars, including to ensure access to food and medical supplies, to avoid mass displacement of civilians, and to avoid the targeting of civilians. Serious and international violations of this law, if proven, amount to war crimes.\n\"What has occurred, includin", "translation_ja": "", "vocab": [{"word": "ethnic cleansing", "definition": "特定の地域から特定の民族や宗教集団を暴力的手段により強制的に除去すること。国連は戦争犯罪や人道に対する罪として定義しており、本記事ではパレスチナ人に対するイスラエル入植者の行為を指しています。"}, {"word": "entrenchment", "definition": "強く確立された状態や根深く定着した状況を意味します。ここでは、イスラエルがヨルダン川西岸での支配を永続化・強化していく意図を指しています。"}, {"word": "expansionist agenda", "definition": "領土や権力を拡大しようとする戦略的計画のこと。イスラエルの違法入植地建設を通じた領土拡大の意図を表現しています。"}, {"word": "sanction", "definition": "国家が他国の不当な行為に対して経済的・政治的圧力をかけるための措置。本記事では商品禁止や企業制限などの経済制裁を指しています。"}, {"word": "viability", "definition": "実現可能性または継続可能性を意味します。本記事ではE1地域の開発が二国家解決の実現可能性を失わせることを指しています。"}, {"word": "humanitarian law", "definition": "戦争中の民間人保護や人道的扱いを規定する国際法。食糧・医療へのアクセス確保や一般市民の保護を義務付けています。"}]}, {"title_ja": "イギリス・イスラエル関係が数十年で最悪に：入植地貿易禁止をめぐり", "title_en": "British-Israeli Relations Hit Lowest Point in Decades Over Settlement Trade Ban", "summary_ja": "イギリスと他11カ国がイスラエルの西岸占領地での入植地との貿易を禁止したことに対し、イスラエルはエルサレム東部の英国領事館を閉鎖し、ガザ支援センターから代表を撤去した。外相エド・ミリバンドの入植者によるエスニック・クレンジングと政府の黙認を非難する強硬声明は英国政策の劇的な転換を示し、両国関係は数十年で最悪となった。", "summary_en": "Britain and 11 other countries have banned trade with Israeli settlements in the occupied West Bank, prompting Israel to close its UK consulate in East Jerusalem and remove representatives from Gaza operations. Foreign Secretary Ed Miliband's strongly-worded statement accusing settlers of ethnic cleansing and the Israeli government of turning a blind eye has marked a dramatic shift in British policy, leaving the relationship at its lowest ebb in decades.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5ydlex9yn3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Paul Adams: British-Israeli relations at lowest ebb in decades\n- Published\nIsrael's furious response to the British government's decision to ban trade with Israeli settlements in the occupied West Bank testifies to just how important this moment is.\nBritain took the brunt of Israel's anger, but the fact that 12 countries chose to move together clearly sharpened the sense of outrage.\nOfficials in London always knew that such a dramatic shift in policy towards Israel-Palestine was going to elicit a hostile response, but seemed taken aback by the speed and ferocity of Israel's reaction.\nThe closure of the UK's consulate in East Jerusalem, which serves the West Bank and deals directly with the Palestinian Authority in Ramallah, and the removal of British representatives from the International Gaza Support Centre, the body set up last year to co-ordinate stabilisation and relief efforts in the Gaza Strip, are very hostile moves.\nThey tell you that Israel is deeply troubled by Tuesday's action by the UK and 11 other countries, which include France, Spain and Canada.\nProducts manufactured in settlements may not represent a significant proportion of Israel's exports, but the political symbolism of singling these out for special treatment is powerful.\nFor decades, the British and other governments have regarded settlements in occupied Palestinian territory as illegal but stopped short of banning products grown or manufactured there.\nNow, having announced that Britain agrees with the 2024 International Court of Justice ruling that the occupation as a whole - including Israel's military presence - is unlawful, Foreign Secretary Ed Miliband says the government's economic relationships must reflect that.\nHence the ban, not just on products but also on companies that provide construction, infrastructure or finance to settlements. The measures, which also include restrictions on arms sales that \"materially contribute to the occupation\", go further than many expected.\nAnd it's not just the actions - it's the language of the foreign secretary's heartfelt, sometimes deeply personal statement that is so striking.\nAs a \"proud British Jew... unwavering in my support for the state of Israel,\" Miliband spoke more directly and starkly than practically any of his predecessors.\nThat a British foreign secretary should say that \"settler terrorism is rampant\" and was responsible for the \"ethnic cleansing\" of Palestinians in parts of the West Bank, while the Israeli government \"turned a blind eye to this\" is truly remarkable.\nMiliband calls this a \"reset\" in British policy. At times today, it felt like a radical rethink, and it leaves British-Israeli relations at their lowest ebb for decades.\nYes, the heated, febrile atmosphere that invariably accompanies an impending Israeli election may have contributed to Israeli Foreign Minister Gideon Saar's brutal response, but most Israelis will have shared his sense of outrage.\nMany Israelis find the violent, messianic ideology of some settlers deeply problematic. Some see them as a national embarrassment.\nBut that's not the same as saying they agree that settlements, built on land captured during the 1967 Six Day War, are illegal.\nMost would disagree violently with the former prime minister, Ehud Olmert, who last year accused his successor Benjamin Netanyahu of turning Israel into an international pariah.\nBut they can feel the walls of international opprobrium closing in - from protests at Eurovision or sporting events, to international arrest warrants being issued against their leaders and now to bans on settlement products - and that makes them anxious and defensive.\nFor the Palestinians, on the other hand, this feels like progress.\nThe Palestinian foreign ministry commended the countries adopting sanctions but called for \"urgent, concrete measures\" to stop Israel's \"illegal settlement enterprise\".\nIn London, the Palestinian ambassador Dr Husam Zomlot called the government's decision \"a turning point in the UK-Palestine relationship\".\nBritain's \"courageous steps\", he said, would help pave the way for the independence of the State of Palestine on the 1967 borders, with East Jerusalem as its capital.\nBut Zomlot knows that the reality of Israel's 59-year occupation has not ended, or even substantially changed.\nThe prospects for a viable Palestinian state remain vanishingly small, and there's little immediate sign that concerted action by 12 countries will reverse Israel's seemingly inexorable takeover of the West Bank.\nOnly the United States has that kind of influence, should it choose to wield it.\nIn 1991, President George HW Bush and his steely Secretary of State James Baker threatened to withhold $10bn (£7.4bn) in loan guarantees from the government of Prime Minister Yitzhak Shamir, when the famously tough Shamir refused to promise that it wouldn't be used to finance settlement activity in the occupied territories.\nBut Donald Trump has so far shown no desire to curb Benjamin Netanyahu's settl", "translation_ja": "", "vocab": [{"word": "ebb", "definition": "潮が引くように減少・衰退することを意味する。関係や状況が悪化・弱化する過程を表現する際に使用される比喩的な表現。"}, {"word": "febrile", "definition": "熱っぽい、興奮した状態を示す。政治的に不安定で緊張した雰囲気や環境を表す。"}, {"word": "messianic", "definition": "救世主的な理想主義に基づく。宗教的または政治的信念が絶対的で過激な思想傾向を指す。"}, {"word": "opprobrium", "definition": "強い非難や批判を意味する形式的な表現。国際的な非難や悪評を示す。"}, {"word": "inexorable", "definition": "止めることができない、避けられない状況や動きを表す。イスラエルの領土拡張が継続する必然性を表現する。"}, {"word": "viable", "definition": "実行可能で持続可能な状態を意味する。政治的または経済的に成立する可能性を示す。"}]}, {"title_ja": "カーニー首相「米国の貿易戦争には代価がある」とカナダが報復関税で対抗", "title_en": "Carney Says US Trade War 'Will Come at a Cost' as Canada Strikes Back", "summary_ja": "カナダのマーク・カーニー首相は、米国商品約280億カナダドルに対する報復関税（15～50%）を発表し、米国からの経済的転換を進めると表明した。カーニー首相は貿易戦争の経済的コストを認めつつも、カナダの労働者を保護し貿易関係を多角化することが必要だと主張した。米国通商代表は、報復関税として追加的なタリフを課す可能性があることを示唆した。", "summary_en": "Canadian Prime Minister Mark Carney announced retaliatory tariffs on nearly C$28 billion of American goods, ranging from 15% to 50%, as Canada pivots away from the US as its primary trading partner. Carney acknowledged the economic cost of the trade war but argued it is necessary to protect Canadian workers and diversify trade relationships. The US trade representative indicated Washington may impose additional tit-for-tat tariffs in response.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8jdev0422jo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Carney says US trade war 'will come at a cost' as Canada strikes back on tariffs\n- Published\nPrime Minister Mark Carney has said that Canada's pivot away from the US as its largest trading partner \"will come at a cost\", as a wave of Canadian retaliatory tariffs on American goods come into force.\nIn a video address, Carney added that the counter-tariffs against the US \"are necessary to protect our workers\".\nCanada's levies will apply to nearly C$28bn ($20bn; £15bn) of American products, from steel to furniture to cotton T-shirts, and will be as high as 50%.\nBoth US and Canadian officials have said they would like to strike a deal, but no new talks have been scheduled since negotiations collapsed in late August.\nIn Tuesday morning's 15-minute video address, Carney said his country's main focus was to diversify its trade relationships and build its economy.\nHe added that his government would also support workers affected by the ongoing trade war with the US \"for as long as it takes\".\n\"We have everything we need to pivot and prosper,\" the prime minister said. \"That pivot will come at a cost.\n\"There's always a cost to action, but it doesn't come close to the cost of standing still.\"\nUS trade representative Jamieson Greer meanwhile said that Washington would consider imposing tit-for-tat tariffs on Canada as early as Tuesday.\n\"We'll see this afternoon,\" he said in French, speaking to CBC News.\nPresident Donald Trump threatened on Monday to halt all US business with Canada-based airplane maker Bombardier unless it moved its manufacturing south.\nThe aerospace giant is one of the largest in the country, contributing over C$7bn to Canada's annual GDP in 2024, according to a report by accounting firm PwC that was commissioned by Bombardier.\nTrump argues that these import taxes encourage consumers to buy American-made goods and boost investment in the US from foreign companies.\nBut economists warn that prices rise for consumers on everyday goods that are targeted by tariffs.\n- What tariffs will really cost Canadians and Americans \n  - Published10 hours ago\n- The US-Canada trade war in 5 charts \n  - Published31 August\n- Sapporo to move some beer production from Canada to US after tariffs \n  - Published5 hours ago\nTrump took aim at Canada in a series of Truth Social posts over the weekend.\nAnother post showed a map of North America - including Canada and Mexico - and Greenland all overlaid with the US flag.\nCanada and the US have the world's largest bilateral trading relationship valued at nearly $900bn last year. The US economy is about 13 times larger than Canada's, and the majority of Canadian exports are sold to the US.\nBusinesses on both side of the border are scrambling to deal with what comes next.\nThe US currently has in place a 25% tax on Canadian cars and trucks, as well as taxes on Canadian steel, aluminium and lumber.\nGolf clubs, cheese, toilet paper\nIn late August, Trump imposed new 50% tariffs on other goods like dairy, alcohol, hockey sticks and perfume.\nCanada's counter-tariffs, which range from 15% to 50%, will from Tuesday be applied to hundreds of items coming in from the US.\nProducts like American milk, golf clubs, steel, aluminium and jackets and T-shirts will face 50% tariffs.\nCheese, toilet paper and certain household appliances like air conditioners will face 25% tariffs, while forklift trucks and industrial moulds will be hit with 15% tariffs.\nThese levies are in addition to existing retaliatory taxes Canada placed on finished American cars and trucks that are not covered by a free trade agreement between Canada, the US and Mexico, known as the USMCA in the US and CUSMA in Canada.\nOpinion polls suggest the majority of Canadians support, external their country imposing retaliatory tariffs on the US.\nThe Canadian Chamber of Commerce has urged the Carney government to take a surgical approach to retaliation.\n\"Businesses understand retaliation but don't want to see endless escalation,\" the Chamber's CEO and President Candace Laing told the BBC on Friday.\nPushback from the fisheries industry was enough for Canada to alter its counter-tariffs by removing dozens of seafood items to avoid unintended consequences to its own economy.\nThe lobster industry in both Canada and the US is heavily dependent on the other, with American-caught lobster often sent north to be processed before it is shipped back to the US and sold.\nAhead of the latest tariffs, Canada's economy had shown signs of resiliency. Its GDP grew 3.3% in the second quarter and it had gained 181,000 jobs from April to July.\nBut around 41,000 jobs were lost in August, a period that coincided with the new US tariffs on Canada and the collapse in trade talks.\nOne sector that saw a modest bump was manufacturing - a gain the Canadian government attributes to consumers and businesses buying more made-in-Canada products.\nData shows that Canada is also diversifying its trade.\nThe share of US-bound Canadian exports dropped to 66% from an average of 75% b", "translation_ja": "", "vocab": [{"word": "retaliatory", "definition": "報復的な、仕返しの。相手方の不当な行為に対して同等の措置で応じることを意味する。ここでは「報復関税」として使われている。"}, {"word": "bilateral", "definition": "二国間の、双方向の。2つの国または団体の間での取引や関係を指す。米国とカナダ間の貿易関係の規模を説明する際に使われている。"}, {"word": "tit-for-tat", "definition": "相手の行動と同じ方法で報復する、目には目を歯には歯をという原則。一方が措置を講じたら相手も同じ方法で応じることを意味する。"}, {"word": "diversify", "definition": "多様化する、種類を増やす。ここでは貿易先を米国以外に広げることを意味する。事業リスクを減らすために複数の相手と関係を持つ戦略。"}, {"word": "resiliency", "definition": "回復力、弾力性。困難な状況から立ち直る能力や、経済が悪条件でも成長を続ける強さを指す。カナダ経済の強さを表現する際に使われている。"}, {"word": "aerospace", "definition": "航空宇宙産業、飛行機や衛星などの製造業。ボンバルディアのような大型製造業を分類する用語として使われている。"}]}, {"title_ja": "英国、イスラエルの入植地に制裁発表、イスラエルが領事館を閉鎖", "title_en": "UK Sanctions Israeli West Bank Settlements, Israel Closes UK Consulate", "summary_ja": "英国は占領下のヨルダン川西岸のイスラエル非合法入植地に対する包括的な制裁を発表し、イスラエルがパレスチナ人の民族浄化を黙認していると非難した。イスラエルの外相は報復としてエルサレム東部の英国領事館を閉鎖し、11人の英国下院議員のイスラエル入国を禁止すると発表した。フランスとカナダと共同で実施されるこの制裁は、入植地商品とサービスを制限することで二国家解決を保護することを目的としている。", "summary_en": "The UK announced comprehensive sanctions against illegal Israeli settlements in the occupied West Bank, accusing Israel of enabling ethnic cleansing of Palestinians. Israel's Foreign Minister responded by closing the UK consulate in East Jerusalem and banning 11 UK MPs from entering Israel. The sanctions, launched jointly with France and Canada, aim to protect the two-state solution by restricting settlement goods and services.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4g7zen0vveo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK announces sanctions on West Bank settlements prompting furious Israeli response\n- Published\nThe UK has announced sanctions on illegal Israeli settlements in the occupied West Bank, accusing Israel's government of turning a blind eye to the \"ethnic cleansing\" of Palestinians by settlers.\nForeign Secretary Ed Miliband said the move marked the \"beginning of a new approach\" to the Israeli-Palestinian conflict, which \"not only calls out injustice and suffering but acts\".\nIsrael's Foreign Minister Gideon Saar responded by accusing him of spreading an \"outrageous lie\" and announced counter-measures including shutting the UK's consulate in East Jerusalem.\nThe UK sanctions will ban settlement goods but also act against companies and individuals providing services for settlement expansion.\n- In West Bank, date farmers weigh impact of UK sanctions on Israeli settlers \n  - Published7 hours ago\n- How Israel is expanding settlements in drive to reshape West Bank \n  - Published21 August\nThe sanctions were launched alongside France and Canada, which in a joint statement with the UK said the action \"marks a further turning point in our approach to protecting the two-state solution\".\nSettlements are illegal under international law, and there has been a rise in violence towards Palestinians in the West Bank by settlers in recent months.\nIn a statement to MPs, Miliband said: \"The British government agrees that there is ethnic cleansing of Palestinians in areas of the West Bank, perpetrated by settler terrorists.\n\"And all too often the Israeli government has turned a blind eye to this and worse, members of it have made statements and taken actions to support the forced displacement of Palestinians.\"\nHe said ethnic cleansing was defined by the UN as a \"purposeful policy designed by one ethnic or religious group to remove by violent means another ethnic or religious group from certain areas\".\nMiliband said the official view of the government was that the Israeli occupation of the West Bank was unlawful because of the \"entrenchment of its control, its intention to extend permanent sovereignty, and its expansionist agenda via illegal settlements\".\nHe said this position, which is in line with a 2024 advisory opinion from the International Court of Justice, should be reflected in the UK's \"economic relationship\" with the occupied West Bank.\nAs a result, over the next six to nine months, the UK will introduce \"a new comprehensive sanctions regime\", he said.\nThe foreign secretary also announced a ban on advertising illegal West Bank settlements in the UK.\n\"The sanctions regime will target illegal settlements and settlement expansion, not Israel,\" Miliband added.\nLater on Tuesday, Prime Minister Andy Burnham said the targeted measures were \"aimed not at the Israeli people, but in support of the two-state solution\".\nAnnouncing the closure of the consulate - which represents the UK government in Jerusalem, the West Bank and Gaza - Israel's Foreign Minister Saar said at a press conference: \"We know that we have many friends in Britain.\n\"Unfortunately, we have a hostile Labour government that is consistently operating against the State of Israel, and it has left us no choice but to respond to its hostile actions.\"\nHe added that 11 UK MPs, including Jeremy Corbyn, Diane Abbott and all five sitting Green Party MPs, would be banned from entering Israel, accusing them of \"antisemitic and anti-Israel activity\".\nThe UK also issued a joint statement with 11 other countries; France, Canada, Denmark, Spain, Finland, Ireland, Iceland, Norway, Poland, Portugal and Sweden.\nIt said the group was unequivocally committed to the two-state solution and would introduce national measures or support European restrictions on trading goods with West Bank settlements.\nThe UK announcement comes after Israel opened up tenders for the construction of some 1,200 settlement homes in the so-called E1 area - a strategically important area east of Jerusalem. The plans have drawn widespread international condemnation. Israel has held off on plans to build in the area for decades under global pressure.\nMiliband told the Commons the UK's \"new approach\" was necessary because plans for the E1 development in the West Bank would render a two-state solution \"unviable\" by \"cutting through the heart of Palestine\".\nElsewhere, he said the Hamas-led attack on southern Israel on 7 October 2023, which triggered the Gaza war, carried \"terrible echoes of the centuries of persecution of the Jewish people\" and stressed Israel had \"the right to protect its people and defend its territory\".\nHowever, he added, \"that cannot justify what has happened in Gaza\".\nHe said: \"International humanitarian law imposes clear rules for states fighting wars, including to ensure access to food and medical supplies, to avoid mass displacement of civilians, and to avoid the targeting of civilians. Serious and international violations of this law, if proven, amount to war crimes.\n\"What has occurred, includin", "translation_ja": "", "vocab": [{"word": "ethnic cleansing", "definition": "特定の民族または宗教集団を暴力的手段により一定地域から除去する行為を指す国際法用語。政治紛争や領土問題との関連で使用される。"}, {"word": "entrenchment", "definition": "ある立場や支配が深く根付き、変更が困難な状態を意味する。政治的支配や占領の継続・強化を示す。"}, {"word": "expansionist agenda", "definition": "領土拡大を目指す計画や政策方針を指す。国際紛争の文脈で、ある国や勢力が支配地域を増やそうとする意図を表す。"}, {"word": "sanctions regime", "definition": "特定の国や集団に対する経済的・政治的制裁を体系的に実施する枠組みまたは仕組みを指す。"}, {"word": "unequivocally", "definition": "曖昧性や疑いの余地なく、明確かつ絶対的に表明する副詞。外交声明では立場の強固さを示すために用いられる。"}, {"word": "humanitarian law", "definition": "武力紛争時に非戦闘員や捕虜の保護を定める国際法。ジュネーブ条約などで規定される。"}]}, {"title_ja": "英国の航空管制システム障害により数百便がキャンセル", "title_en": "Hundreds of UK flights cancelled due to air traffic control system glitch", "summary_ja": "航空管制プロバイダーNatsがフライトデータ処理システムの障害を経験し、数百便のキャンセルと数万人の乗客に影響を与えました。この問題はヒースロー、ガトウィック、マンチェスター、バーミンガムなどの主要ハブで広範な混乱を引き起こし、バックログが解消されるにつれて遅延が続くと予想されます。NatsのマーティンRolfe会長は謝罪し、完全な調査を約束し、EasyJetやブリティッシュ・エアウェイズなどの航空会社がキャンセルと乗客対応を管理しました。", "summary_en": "An air traffic control provider Nats experienced a flight data processing system failure, resulting in hundreds of flight cancellations and affecting tens of thousands of passengers across UK airports. The issue caused widespread disruption at major hubs including Heathrow, Gatwick, Manchester, and Birmingham, with knock-on delays expected to continue as backlogs clear. Nats' boss Martin Rolfe apologized and committed to a full investigation while airlines like EasyJet and British Airways managed cancellations and passenger communications.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ce8x3dp1zpxo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "More flight delays expected after hundreds cancelled by air traffic control glitch\n- Published\nFlight delays are expected to continue on Wednesday after an air traffic control problem cancelled hundreds of flights across the UK.\nTens of thousands of passengers were affected by the disruption and tracking website FlightRadar24 said up to 1,000 flights were cancelled after a glitch affecting air traffic control provider Nats.\nIts boss Martin Rolfe apologised, telling the BBC there would be a full investigation into what had gone wrong, after Nats said resolving the issue had taken \"longer than hoped\".\nWith few aircraft able to take off, it is understood landings were restricted, leading to some flights being unable to depart overseas airports.\nThe fault was widespread across the UK, and beyond, with airports in Scotland and Ireland also reporting disruption. EasyJet made 200 cancellations and British Airways more than 100.\nIt is not the first time disruption has blighted Nats' control system. Ryanair and Wizz Air called for an overhaul of the organisation, with Wizz Air saying Nats was \"not fit for purpose\" in its current form.\nWhen asked whether he was considering his position, Rolfe said there would be \"lots of time for that later\" but his focus now was on making sure the problem was solved.\nEurope's busiest airline, Ryanair, reported on Tuesday that more than 65,000 passengers had been delayed by up to eight hours.\nAt Heathrow, one of the busiest airports in Europe, departures were initially paused around lunchtime. Traffic then resumed, before facing further disruption in the afternoon.\nIt is understood the airport ran out of space for incoming flights during the afternoon because planes had not been departing.\nThirteen Heathrow-bound flights were diverted to other airports in the UK and Europe.\nPassengers have been advised to contact their airlines to check the status of their flights.\nBritish Airways said in a statement that it was anticipating knock-on effects.\n\"We were forced to cancel or divert more than 100 flights on Tuesday afternoon,\" a spokesperson said.\n\"We're doing everything we can to keep our customers updated and make arrangements for them to continue their journeys.\n\"We ask customers whose flights have been cancelled not to travel to the airport and to bear with us if they're trying to get in touch, as our call centres are incredibly busy at the moment.\"\nAirports across the UK said they were experiencing cancellations and delays and advised people to check their flight details before travelling.\nAccording to FlightRadar, the worst affected airports were Heathrow, Gatwick, Manchester and Birmingham.\nRyanair said affected passengers would be notified.\nPhil White from Bexhill told BBC Your Voice that his flight to Lanzarote boarded on time but he was left sitting on the tarmac at Gatwick for hours.\n\"We've been told the radar is down and we can't take off,\" Phil said.\n\"It's comfortable enough but the pilots been on every 20 minutes saying they are waiting for information from air traffic control and when he finds anything out he will let us know.\"\nKnock-on effects as backlog builds\nEven if Nats has resolved the issue with its flight processing system, the disruption is likely to persist due to backlogs.\nRolfe said the issue was in Nats' flight data processing system. He said it was not the same system that failed during an incident in 2023 over the August Bank Holiday weekend.\nAlthough the technical issue affected departures, arrivals were also hit as space on the ground became increasingly restricted.\nTransport Secretary Heidi Alexander said that \"it will take time to fully resume flights, so continue to check with airlines\".\n\"I am seeking assurances that lessons will be learned and systems that support aviation are up to the job,\" she wrote on X.\nAccording to Nats, the flight processing system processes flight plans and other operational information used by air traffic controllers to manage air traffic.\nThe system continually updates flight information as aircraft progress through UK airspace, helping controllers maintain a safe and orderly flow of traffic.\nChloe Davis,18, from Cambridgeshire was left sitting on a Virgin plane at Heathrow waiting to fly to Orlando.\nShe told BBC Your Voice that she had been due to depart at 13:40 BST.\n\"I'm not concerned, I would just like to know what's going on,\" she said.\n\"There [are] planes parked up on the taxi way because there's no gates for them to go to.\"\nGet in touch\nHave your travel plans been disrupted? Share your experience.", "translation_ja": "", "vocab": [{"word": "glitch", "definition": "コンピュータシステムやプログラムの一時的な不具合や障害。ここでは航空管制システムの予期しない技術的問題を指します。"}, {"word": "disruption", "definition": "通常の活動や運営の中断や妨害。この記事では航空便の運航が妨げられた状態を示します。"}, {"word": "divert", "definition": "本来の目的地から別の場所へ変更する、方向を変える。ここでは飛行機が予定されていた空港以外の空港に着陸することを意味します。"}, {"word": "backlog", "definition": "処理しきれずに積み重なった未処理の仕事や案件。この場合、スケジュール通りに運航できなかった航空便の蓄積を指します。"}, {"word": "resilience", "definition": "困難や危機から回復する能力、または回復力。システムが障害から立ち直る能力を表す。"}]}, {"title_ja": "移民反対デモ後、RNLI ボランティアが『受け入れられない』虐待に直面", "title_en": "RNLI Volunteers Face 'Unacceptable' Abuse Following Anti-Migrant Protests", "summary_ja": "ポーツマスとドーバーの反移民デモ後、RNLIスタッフとボランティアは深刻なオンラインおよび身体的虐待を経験している。慈善団体の最高経営責任者は、ボランティアに対する誤った情報と脅迫を非難し、チャネルでの救助活動が彼らの総救命活動の1.2%に過ぎないことを強調した。政府関係者はRNLIスタッフとその家族の個人情報公開に関してテック企業と協議している。", "summary_en": "RNLI staff and volunteers have experienced severe online and physical abuse following anti-migrant protests in Portsmouth and Dover. The charity's chief executive condemned the misinformation and threats against volunteers, emphasizing that rescue operations in the Channel represent only 1.2% of their total lifesaving work. Government officials have engaged with tech companies regarding the doxxing of RNLI personnel and their families.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c0j3912qe33o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "RNLI volunteers facing 'unacceptable' abuse, chief says\n- Published\nRNLI staff have faced \"unacceptable\" online and physical abuse since anti-migrant protests at the weekend, the charity's chief executive has said.\nOn Sunday, police faced off with demonstrators who blocked roads in Portsmouth in an effort to stop 140 people who arrived at the Eastney Landing ferry port area with the RNLI's assistance.\nChief executive Peter Sparkes said the abuse of volunteers was \"wholly unacceptable in a civilised society\".\nHe said there had been \"deliberate misinformation and a misunderstanding\" about the charity, and condemned threats by \"those who would hide behind a balaclava or a keyboard\".\nThe protest in Portsmouth followed a separate demonstration the previous day, in which hundreds of masked \"stop the boats\" protesters brought the Port of Dover to a standstill.\nFootage was subsequently posted on social media showing volunteers of the Poole-based charity labelled as \"traitors\".\nIn a statement issued on Tuesday, Sparkes said: \"Recent events have generated deliberate misinformation and a misunderstanding about the RNLI – our purpose, our tasking, and particularly our lifesaving work in the Channel.\n\"Sadly, as a result, some of our volunteers and staff have been the subject of online and, in the worst cases, physical abuse.\n\"The RNLI's people represent the very best in our society, they selflessly give up their time to keep others safe.\"\nHe continued: \"We will take whatever steps we can, to care for and protect our people and their families.\"\nDigital Secretary Lisa Nandy said she had spoken with tech firms about how the names, addresses and photographs of RNLI staff and volunteers were reportedly shared online.\nShe was responding to Vikki Slade, the Liberal Democrat MP for Mid Dorset and North Poole, about \"some very disturbing posts\" on social media identifying \"brave RNLI rescuers\".\nNandy was asked what more the government could do to remove posts \"that put children and adults' safety at risk through doxxing\".\nShe told the Commons: \"It is something that the government is concerned about [and] I'm personally concerned about.\"\nRequests to accept the landing of RNLI boats carrying the migrants were refused by both Portsmouth harbour and Southampton Port, the BBC understands.\nSparkes described illegal migration as a \"polarising subject\" and urged people to \"be mindful of misinformation\" and the \"impact it has upon others\".\nHe said: \"Be reassured that the RNLI and our crews strive only to prevent people like you and me from drowning at sea.\n\"Stand by them, not against them and their families.\n\"I am extremely proud of and grateful for their vital lifesaving work that meant 389 families welcomed their loved one homes safely last year.\"\nOf the 9,058 RNLI lifeboat launches in 2025, 109 were to those \"in distress in the Channel\", Sparkes said, which makes up 1.2% of the charity's total rescue work.\nHe said nearly 95% of small boats were intercepted by the UK Border Force.\n\"Our mission, and our tasking is to rescue those women, children and men in danger of drowning,\" he added.\nGet in touch\nYour Voice\n  - Published2 hours ago\n  - Published17 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "doxxing", "definition": "個人の名前、住所、電話番号などの個人情報をオンラインで公開する行為。プライバシー侵害と嫌がらせを目的として行われることが多い。"}, {"word": "polarising", "definition": "人々の意見を大きく二つに分ける、あるいは対立させる性質を持つこと。議論や問題が人々の間に深い分裂をもたらす状況を指す。"}, {"word": "misinformation", "definition": "事実に基づかない、または意図的に歪められた情報。真実ではない情報が広まることで、人々の判断や行動に悪影響を与える。"}, {"word": "tasking", "definition": "特定の目的や任務のために割り当てられた業務。組織や個人に与えられた具体的な責任や役割を指す。"}, {"word": "intercepted", "definition": "進行中のものを途中で止める、または引き継ぐこと。ここでは国境警備隊が密航船を途中で捕捉することを意味する。"}, {"word": "balaclava", "definition": "顔全体を覆うニット帽で、目と口の部分だけが開いている。匿名性を保つため、デモやプロテストで着用されることが多い。"}]}, {"title_ja": "米軍、イラン沖の石油タンカー5隻を攻撃", "title_en": "US Strikes Five Iranian Oil Tankers Off Iran's Coast", "summary_ja": "米軍は火曜日、イラン革命防衛隊がこの2日間に米海軍艦艇に弾道ミサイルを2度発射したことへの報復として、イランの石油タンカー5隻を攻撃しました。米中央軍はこれらのタンカーがイラン革命防衛隊と地域のプロキシに資金を提供するイランの闇市場ネットワークの一部であると述べています。米国人職員は被害を受けず、乗組員は攻撃前に避難しました。", "summary_en": "The US military attacked five Iranian oil tankers on Tuesday in retaliation for ballistic missile strikes by Iran's Islamic Revolutionary Guard Corps against a US Navy warship. CENTCOM stated the tankers were part of Iran's shadow network funding the IRGC and regional proxies. No American personnel were harmed and crews were evacuated before the strikes.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-strikes-oil-tankers-off-coast-of-iran/a-79194562?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "US strikes oil tankers off coast of Iran\nSeptember 8, 2026\nThe US military struck five Iranian oil tankers on Tuesday.\nThe US Central Command (CENTCOM) said it struck the ships \"after the Islamic Revolutionary Guard Corps (IRGC) targeted a US Navy warship with ballistic missiles twice over the past two days.\"\n\"The US warship successfully evaded the attempted Iranian attacks and continued to patrol regional waters. No American personnel were harmed,\" it added.\nCENTCOM said it directed the crews to abandon ship shortly before the strikes. The were no immediate reports regarding casualties.\nIranian media reported explosions were heard near the southern port of Jask and on Kharg Island — both key ports for Iran's oil exports.\nWhat do we know about the ships that were attacked?\nUS forces attacked four Iranian oil carriers in the Gulf of Oman: the M/T Kaviz, the M/T Charminar, the M/T Horizon 1 and the M/T Riesco.\nUS forces also attacked the M/T Derya near Kharg Island in the Strait of Hormuz.\nCENTCOM linked these five vessels to the IRGC.\n\"Iran has used the tankers as part of a multibillion-dollar shadow network that funds the IRGC and its regional proxies,\" CENTCOM said in a statement.\n\"Iran has no means by which to defend these vessels.\"\nMore to follow...", "translation_ja": "", "vocab": [{"word": "CENTCOM", "definition": "米中央軍（Central Command）の略称で、中東地域の米軍作戦を指揮する組織です。軍事・地政学関連の報道でよく使用される専門用語です。"}, {"word": "ballistic missiles", "definition": "弾道ミサイルのことで、発射後に自由落下しながら目標に向かう軍事兵器です。防衛・国防関連のニュースで頻出する技術用語です。"}, {"word": "evaded", "definition": "危険や攻撃をかわす、回避するという意味です。軍事作戦や緊迫した状況を描写する際に使われる動詞です。"}, {"word": "shadow network", "definition": "秘密裏に活動する組織や取引ネットワークを指します。違法または隠蔽された経済活動の説明で使用される表現です。"}, {"word": "proxies", "definition": "代理人や代理勢力を意味し、国家が直接関与せず支援する地域の武装勢力などを指します。地政学的分析で頻出する用語です。"}]}, {"title_ja": "ドイツ経済、ザクセン＝アンハルト州選挙でのAfD勝利に懸念", "title_en": "German Economy Worries Over AfD Victory in Saxony-Anhalt Election", "summary_ja": "極右政党AfDがザクセン＝アンハルト州選挙で圧倒的勝利を収め、ドイツの経営界に経済的な影響について懸念が広がっている。経済学者らは、同党の反移民政策が外国人熟練労働者を遠ざけ、州経済に悪影響を与える可能性があると警告している。", "summary_en": "The far-right AfD party won a landslide victory in Saxony-Anhalt state elections, raising concerns among German business leaders about potential economic consequences. Economists warn that the party's anti-immigration policies could deter foreign skilled workers and harm the state's economy, though many policy decisions remain under federal control.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/german-economy-frets-about-saxony-anhalt-election-results/a-79162871?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "German economy frets about Saxony-Anhalt election results\nSeptember 8, 2026\nThe results came in as predicted: The AfD, which is considered far-right extremist in parts, won the election in Saxony-Anhalt and could now put forward the state’s minister-president and take over the state government.\nWhat hardly anyone expected, however, was this: The governing CDU is now barely half as strong as it was, while the other parties have been left far behind. Calling it a landslide victory for the AfD is no exaggeration. And many commentators go so far as to call it a turning point in Germany’s postwar history.\nKeep calm and carry on?\n\"A state government led by the AfD would certainly be seen by many as a turning point and would further fuel the debate over how best to deal with the party,\" Commerzbank economist Ralph Solveen told Reuters.\nAt the same time, he advises waiting to see what happens, saying that things are rarely as bad as they seem.\n\"Many of these decisions are unlikely to affect the economy until the medium to long term,\" he said. \"Decisions on most taxes, the structure of the labor market and social security systems are made at the federal level. That is why the AfD, in many of its pledges, only promises to advocate for something in the Bundesrat, which is unlikely to succeed given the foreseeable isolation of an AfD-led government.\"\nLocal political pragmatism?\nMany business community concerns had already been raised before the election. It also became clear that there are differing views within the AfD, which could lead to unpredictable policies.\nFor example, DW reported two months ago that Hannes Loth, a member of the AfD and the mayor in Raguhn-Jessnitz, Saxony-Anhalt, sought to have six new wind turbines installed. This pledge puts him at odds with the official stance of his own party.\nWhether this is a sign of internal party pluralism or simply local political pragmatism will become clear during the coming legislative term, especially if the AfD ends up in the state government. It is not, however, serving to reassure business leaders.\nConsequences of xenophobia\nOne issue the AfD campaigned on was a promise to limit the number of foreigners. But will the party actually be able to implement its goal? On this point, Michael Berlemann, director of the Hamburg Institute of International Economics (HWWI), remains skeptical.\n\"A large part of the measures it has promised cannot be implemented at the state level because the federal government is responsible for them,\" he said. \"Another part would be illegal and would be overturned by the courts after some delay: The AfD cannot restrict the immigration of foreign skilled workers in Saxony-Anhalt.\"\nING chief economist Carsten Brzeski pointed to the national shortage of skilled workers: \"Forced deportations in Saxony-Anhalt would probably be limited. However, the symbolic effect cannot be underestimated. As with Trump, such headlines would act as a deterrent for foreign skilled workers.\"\nWido Geis-Thöne, an economist at the German Economic Institute in Cologne, sees it the same way.\nHe told DW that the AfD would \"do everything in its power to pursue its migration policy goals.\" However, it could only \"do things that actually fall under the responsibility of the state rather than the federal government.\"\nEconomic fallout for Saxony-Anhalt\nGeis-Thöne said the state itself would be the main victim of such a policy: \"With an anti-immigration state government, Saxony-Anhalt will become significantly less attractive a destination for foreign skilled workers, regardless of whether anything actually changes for them from a legal perspective.\"\nFor HWWI Director Berlemann, the indirect impacts of the AfD's plans are particularly problematic. The measures announced would mean \"that many skilled workers who are particularly needed in health care and nursing, hospitality and tourism, the food industry and agriculture and in construction and logistics will avoid the state in the future.\"\nThis would exacerbate the shortage of skilled workers and widen the state's economic gap.\nOpenness and diversity are key\nSaxony-Anhalt must remain a state where people from around the world want to live and work and where companies want to invest and new technologies can emerge, Bitkom President Ralf Wintergerst warned.\nHe told the Catholic News Agency KNA: \"The digital economy thrives on openness, diversity and international cooperation. Companies invest where they find good conditions and where skilled workers from Germany and abroad are welcomed.\"\nRegarding foreign investment, ING Chief Economist Carsten Brzeski told Reuters: \"Sure, there could be a symbolic effect on foreign investors. But let's not forget: Saxony-Anhalt is not the entire German economy.\"\nHow should Berlin react\nDIW President Marcel Fratzscher painted a bleak picture of the economic future after the Saxony-Anhalt election.\n\"Regardless of the makeup of the next state government, a controversial or weak government and th", "translation_ja": "", "vocab": [{"word": "landslide", "definition": "圧倒的多数による勝利を意味する。選挙などで候補者や政党が大きな差をつけて勝つ場合に使用される。"}, {"word": "extremist", "definition": "過激な思想や行動を持つ人を指す。政治的に極端な立場を取る団体や個人に対して用いられる。"}, {"word": "foreseeable", "definition": "予測可能な、先読みできる状況を表す。将来の展開が合理的に予想できることを意味する。"}, {"word": "exacerbate", "definition": "問題や悪い状況をさらに悪化させることを意味する。既存の課題をより深刻にする行為を指す。"}, {"word": "deterrent", "definition": "人が何かをすることを思いとどまらせるもの。警告や脅威として機能し、特定の行動を防ぐ効果を持つ。"}, {"word": "pluralism", "definition": "複数の異なる意見や立場が共存する状態を指す。組織内での多様な見方の存在を表す。"}]}, {"title_ja": "EU、UK、セルビアのムラディッチ葬儀に懸念を表明", "title_en": "EU, UK Express Dismay Over Mladic Funeral in Serbia", "summary_ja": "EUとUKは、ボスニア・セルブ人の指揮官で有罪判決を受けた戦争犯罪人ラトコ・ムラディッチの葬儀を非難しました。セルビア政府関係者を含む数千人が参列し、スレブレニツァ虐殺の責任者を称賛するものと見なされています。ボスニアは2人のセルビア外交官を国外追放し、セルビアの行動は越えてはいけない一線を超えたと主張しました。", "summary_en": "The EU and UK condemned Serbia's funeral for convicted war criminal Ratko Mladic, attended by thousands including six Serbian ministers, which was seen as glorifying the Srebrenica massacre orchestrator. Bosnia expelled two Serbian diplomats in response, calling Serbia's actions a crossing of a 'red line.' Serbian President Vucic denied state involvement, attributing the funeral to Mladic's family ahead of snap elections.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/eu-uk-express-dismay-over-mladic-funeral-in-serbia/a-79190233?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "EU, UK express dismay over Mladic funeral in Serbia\nSeptember 8, 2026\nBoth the EU and UK on Tuesday expressed dismay over the funeral in Belgrade, Serbia of late war criminal Ratko Mladic a day prior.\nThousands of people, including at least six Serbian ministers, attended the event on Monday which was seen as glorifying Mladic. He received military honors at the funeral, with the head of Serbia's Orthodox Church presiding over the ceremony.\nThe Bosnian Serb commander died last month at The Hague, where he had been imprisoned for life. Mladic was convicted in 2017 of genocide, having orchestrated the July 1995 Srebrenica massacre, where 8,000 Bosniak men and boys were killed.\nMladic, called the \"Butcher of Bosnia\" by some international press, is a revered as a war hero by many Serbian nationalists in both Serbia and Bosnia.\nEU leader call Mladic state funeral 'deeply regrettable'\nEU leaders condemned the funeral, with the bloc weighing an official response to the event.\n\"The elements of official support and the presence of some senior Serbian officials at the funeral are deeply regrettable,\" European Commission President Ursula von der Leyen and European Council President Antonio Costa said in statements posted on X.\n\"They demonstrate a failure to confront a dark chapter in Europe's recent history and contradict the values underpinning Serbia's path towards the European Union,\" they added.\nA European Commission spokeperson, in comments to German news agency DPA, said next steps were being evaluated.\nEU High Representative for Foreign Affairs and Security Policy Kaja Kallas added: \"Serbia's path into the European Union requires an unequivocal commitment in fundamental European values and historical truth.\"\nSerbia first applied for EU membership in 2009. Serbia's EU candidacy was confirmed by the European Council in 2012.\nUK summons Serbian envoy\nThe UK, meanwhile, summoned Serbia's charge d'affaires in response to the funeral.\n\"As a military commander, Mladic presided over crimes that are among the worst committed in Europe since the Second World War,\" the British Foreign Office said in a statement.\n\"The thoughts of the UK Government are with Mladic's victims and their families. They deserve respect, compassion and accountability, not efforts to rewrite proven history,\" the statement added.\nThe UK said that the \"glorification of a convicted war criminal directly undermines trust, fuels division, and is incompatible with the process of reconciliation within Bosnia and Herzegovina and the region.\"\nBosnia expels Serbian diplomats, says Belgrade crossed 'red line'\nIn its reaction to the funeral, neighboring Bosnia expelled two Serbian diplomats, saying Serbia crossed a \"red line\" in its display of reverence for Mladic.\n\"They crossed every red line with what they did yesterday, the day before, and in the days leading up to the reception,\" Bosnian Foreign Minister Elmedin Konakovic told a Sarajevo press event.\nKonakovic had also said he would withdraw most staff from the Bosnian Embassy in Belgrade in an effort to reduce ties to \"the lowest possible level\"\nSerbian President Aleksander Vucic was not present at Mladic's funeral, although his son Danilo, did attend the event. Vucic rejected allegations that Mladic was being glorified at the funeral and said the event was put together by Mladic's family rather than the state.\nThe controversial funeral comes ahead of snap elections next month. Serbia has faced a political crisis in the past two years triggered by the collapse of a concrete canopy at a railway station in Novi Sad.\nEdited by: Saim Dušan Inayatullah\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "dismay", "definition": "深い失望や不安を表す感情。国家間の公式な異議表明の際に使われる。"}, {"word": "unequivocal", "definition": "明確で、曖昧さのない、疑いの余地のない。政治的なコミットメントを述べるときに用いられる。"}, {"word": "presided", "definition": "会議や式典などを司る、主導する。ここでは宗教指導者が葬儀を主催したという意味。"}, {"word": "contradict", "definition": "反対する、矛盾する。ある行動や声明が別の価値観や原則と相容れないことを表す。"}, {"word": "reconciliation", "definition": "和解、関係の修復。紛争地域における平和と信頼の回復プロセスを指す。"}, {"word": "glorification", "definition": "ある人物や行為を高く評価し、賞賛すること。ここでは戦争犯罪者を英雄視することを意味する。"}]}, {"title_ja": "米軍がイランの石油タンカー5隻を破壊、中央軍が発表", "title_en": "US Forces Destroy 5 Iranian Oil Tankers, CENTCOM Reports", "summary_ja": "米中央軍司令部は、進行中の軍事作戦においてイランの石油タンカー5隻が破壊されたと発表しました。ホルムズ海峡は米国とイラン軍の紛争激化の中で重大な紛争地点のままです。", "summary_en": "The US Central Command announced the destruction of five Iranian oil tankers in ongoing military operations. The Strait of Hormuz remains a critical flashpoint in the escalating conflict between US and Iranian forces.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates-tehran-plans-new-restricted-zone/?id=136249116", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース配信", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、世界中の速報ニュースと主要なライブイベントを24時間体制でカバーしています。プラットフォームは、展開する事象をリアルタイムで最新の報道を配信しています。視聴者は継続的なニュース更新とライブイベントのストリーミングにアクセスできます。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and major live events from around the world. The platform delivers up-to-the-minute reporting on developing stories as they unfold. Viewers can access continuous news updates and live event streaming.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カバノー判事、共和党の選挙区地図維持の上告を却下", "title_en": "Kavanaugh Denies GOP Appeal to Preserve Partisan District Map", "summary_ja": "ブレット・カバノー判事は、11月の選挙に向けて共和党に有利な下院選挙区地図を維持しようとするミズーリ州共和党の上告を却下した。この決定は、今後の投票に先立ち、有利な選挙区割りを維持しようとする共和党にとって打撃となる。", "summary_en": "Justice Brett Kavanaugh rejected an emergency appeal from Missouri Republicans seeking to maintain a GOP-friendly congressional district map for the November election. The decision represents a setback for Republicans attempting to preserve favorable redistricting ahead of the upcoming vote.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/kavanaugh-denies-missouri-republicans-appeal-preserve-gop-friendly/story?id=136287286", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ソマリア沖海賊が地域混乱を悪用、10年ぶりに活動再開", "title_en": "Somali pirates exploit regional chaos, returning to seas after decade", "summary_ja": "ソマリア海賊による乗っ取りが4月以降8件報告され、10年ぶりの高水準に達した。米イスラエル・イラン紛争による海運の混乱とソマリアの政治不安定化が主な要因である。国際的な海賊対策部隊がホーシー派の紅海攻撃への対抗に転用され、海上交通路の変更により、衛星通信などの高度な戦術を使用する海賊に活動の機会が生まれている。", "summary_en": "Somali piracy has surged to levels unseen in a decade, with eight hijackings since late April driven by shipping disruptions from the US-Israel-Iran conflict and Somalia's political instability. The resurgence reflects how the diversion of international anti-piracy forces to combat Houthi attacks in the Red Sea and shifting maritime routes have created opportunities for pirates using increasingly sophisticated tactics including satellite communications.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/08/hijacking-pirates-somalia-geopolitical-chaos", "state_media": false, "category": "政治", "full_text": "The scourge of Somali piracy targeting cargo ships and smaller dhows off the Horn of Africa has returned to levels not seen in a decade, driven by a convergence of factors including disruptions to the shipping industry caused by the US-Israeli war against Iran and a resurgence of political instability in Somalia.\nSince late April there have been eight hijackings by Somali pirates, including two within the space of a fortnight in August: one targeting an oil tanker with ties to Iran, the other a Cameroon-flagged vessel, the Lutuf, carrying military equipment for Turkey.\nOver a seven-year period from 2005 there were more than 1,000 attacks on vessels in the waters off Somalia, which has mainland Africa’s longest coastline. Thousands of crew members were taken hostage, netting $400m (£296m) in ransom payments for the piracy network’s financiers, the low-level “foot-soldier” pirates and the communities who provided them with goods and services. The attacks only petered out after a multinational anti-piracy force was deployed.\nThe hijacking of the Lutuf was the most high-profile of the recent incidents. Turkey has been expanding its influence in Somalia after an agreement signed in 2024 to build up its navy, and the Lutuf’s release two weeks after its capture involved a joint Turkish-Somali operation that resulted in the destruction of four pirate vessels.\nHowever, local officials including Mohamed Mubarak, the head of the Puntland security coordination office, have said that a $2.5m (£1.85m) ransom was also paid, prompting warnings that such payments risked encouraging similar incidents.\nIn a comment for the Center for Maritime Security in July, Matthew Reisener, the thinktank’s national security adviser, warned that naval campaigns by Iran in the strait of Hormuz and Iran’s Houthi proxies in the Red Sea – launched in response to the US-Israel war on Iran – are allowing regional piracy “to once again thrive”.\nHe wrote: “Not only have the global navies that once combatted piracy off the Horn of Africa diverted their resources to counter the threats against ships in these critical waterways, but these conflicts have also drawn maritime traffic closer to Somalia’s coastline, creating openings for opportunistic pirates to target commercial ships.”\nAccording to Reisener, about 70% of maritime traffic that passed through the Red Sea prior to the Houthis’ targeting of ships there is now being rerouted around the Cape of Good Hope in South Africa.\nA report by the International Institute for Strategic Studies in May reached a similar conclusion: “The recent deterioration of maritime security followed a prolonged period of relative calm in the waters off the Somali coast, which resulted in the redeployment of international anti-piracy fleets and the relaxation of commercial risk-management practices. These factors – alongside the distraction posed by Houthi attacks in the Red Sea – have converged to create an opening that Somali pirates have been quick to exploit.”\nAnalysts also note that rising oil prices driven by the war have made oil cargoes a more valuable target.\nAmong the least developed countries in the world, Somalia has endured conflict and clan battles with no strong central government since the autocratic ruler Mohamed Siad Barre fell in 1991. Insufficient patrol vessels and an inability to regularly pay salaries to those involved in coastal patrols are among the reasons why Somalia has long-struggled to secure its coastline.\nPiracy has historically thrived during periods of increasing instability and political, factional and regional competition. Observers say the recent rise in incidents has been exacerbated by a domestic and international focus on arms smuggling to Yemen by networks acting on behalf of Iran. Analysts suggest some of these networks have become increasingly associated with Somalia’s Islamist al-Shabaab group as it once again expands its territorial control in central and southern Somalia and seeks to build ties with the Houthis in Yemen.\nLocal officials interviewed by the Guardian described how in the recent spate of incidents, pirate groups have been using vessels they had already seized to attack and capture other vessels.\nAccording to the officials, the Lutuf was approached as it sailed three nautical miles from Somali shores near the fishing town of Maraya by a previously hijacked cement carrier, the MV Sward, which had been repurposed as a pirate mothership. Eight gunmen from the Sward then boarded the Lutuf and were able to overpower the ship’s armed guards.\nOfficials say the recent attacks have also been marked by increased technological sophistication on the part of pirate groups, including the use of SpaceX’s Starlink satellite internet service to facilitate the tracking of potential targets and for high-speed communications between pirates.\nThat reflects what Lloyd’s List has described as an increasingly “more capable and adaptive Somali piracy threat” that is already exposing vuln", "translation_ja": "", "vocab": [{"word": "convergence", "definition": "複数の要因が同時に集中・結合すること。この記事では、海運混乱と政治不安定化が同時に起きて海賊活動を促進している状況を指す。"}, {"word": "resurgence", "definition": "衰えていたものが再び盛んになること、復活。ここでは10年ぶりにソマリア海賊活動が復活したことを表現している。"}, {"word": "exacerbated", "definition": "問題や状況を悪化させること。記事では国際的な関心の分散がソマリア海賊問題をより深刻にしていることを説明している。"}, {"word": "opportunistic", "definition": "機会を見つけて利用する、機会主義的な。海賊が海上交通路変更による新しい機会を素早く活用している様子を表現。"}, {"word": "maritime", "definition": "海洋、海運に関する。海での活動や輸送に関連する用語で、maritime security（海上安全保障）などと使用される。"}, {"word": "sophisticated", "definition": "複雑で高度な、洗練された。海賊グループがStarlink衛星通信など最新技術を使用していることを示す。"}, {"word": "vulnerability", "definition": "弱点、脆弱性。セキュリティや防御面での弱さを指し、国際海運業が海賊による新たな脅威に対して脆弱であることを表現。"}]}, {"title_ja": "台風サウデルが中国南東部で大規模避難を引き起こす", "title_en": "Typhoon Saudel Triggers Mass Evacuations Across Southeast China", "summary_ja": "台風サウデルは先週中国南東部に豪雨をもたらし、一部地域では24時間で500mm以上の降雨量を記録した。福建省だけで約60万人が避難し、洪水と土砂崩れにより複数の省で死傷者と広範なインフラ被害が発生した。これは今年中国に影響を与えた7番目の台風である。", "summary_en": "Typhoon Saudel brought torrential rainfall to southeast China last week, with some areas recording over 500mm of rain in 24 hours. Nearly 600,000 people were evacuated from Fujian province alone, while flooding and landslides caused deaths, injuries, and widespread infrastructure damage across multiple provinces. This was the seventh typhoon to affect China this year.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/07/typhoon-saudel-mass-evacuations-south-east-china-weather-tracker", "state_media": false, "category": "社会", "full_text": "Typhoon Saudel brought days of torrential rain to Zhejiang, Jiangxi, Fujian and Guangdong provinces in south-east China last week. The city of Putian, in Fujian province, recorded 416.5mm of rain in a 24-hour period between Thursday and Friday, with surrounding villages recording more than 500mm in the same period. In Fujian, authorities estimate that almost 600,000 people were evacuated from high-risk, flood-prone areas. A further 128,000 people in 53 counties were also affected across Jiangxi, with emergency evacuations affecting 9,000 people.\nFlooding, landslips and infrastructure damage were reported widely in the region. More than 2,500 teachers and students were trapped in a school compound in the Zhejiang city of Wenzhou on Wednesday after extreme rainfall caused flash floods in low-lying areas. At least 1,260 people reportedly had to be rescued in Putian after a river embankment collapsed on Thursday, flattening 100 homes. On Saturday, a landslip in a village of Suichuan county, in Jiangxi province, killed three people and nine others remaining missing.\nThis is the seventh typhoon to affect China this year, and Saudel arrived shortly after Typhoon Narra dumped heavy rain on Guangdong, Hainan and Guangxi late last month.\nThe South African Weather Service implemented several thunderstorm warnings late last week, covering a large swathe of the northern and western provinces. Disruptive rainfall, damaging winds, excessive lightning and hail were all reported, with rainfall totals expected to have reached at least 75-100mm for parts of the Northern Cape and North West provinces over the weekend. In Johannesburg, eight families were evacuated from an apartment building after strong winds tore off a significant part of its roof.\nOppressive heat in the US affected states across the central-southern plains and the Mississippi valley this weekend, with maximum temperatures easily reaching the high 30s celsius (high 90s fahrenheit). However, with high humidities, the heat indices in this region have been closer to 40-43C (105–110F). The unrelenting temperatures will continue across the midwest and southern US this week, with maximum temperatures continuing to reach the high 30s.", "translation_ja": "", "vocab": [{"word": "torrential", "definition": "非常に激しい降雨のことを指す形容詞。豪雨や大量の水の流出を表すのに用いられる。"}, {"word": "embankment", "definition": "洪水を防ぐために川や海の岸に築かれた堤防や堤防構造物のこと。防水機能を持つ人工的な土手。"}, {"word": "disruptive", "definition": "通常の活動や機能を妨害または中断させるという意味の形容詞。破壊的または混乱を引き起こす影響を表す。"}, {"word": "landslip", "definition": "土砂や岩石が山の斜面から滑り落ちる自然現象のこと。土砂崩れまたは地滑りとも呼ばれる。"}, {"word": "oppressive", "definition": "不快で耐え難い状態を表す形容詞。特に、不快な気候条件や圧倒的な状況を指すのに用いられる。"}, {"word": "unrelenting", "definition": "継続して続く、途切れることのない状態を意味する形容詞。厳しい条件が持続することを表現する。"}]}, {"title_ja": "エジプトのテレビ司会者を含む12人が麻薬犯罪で死刑判決", "title_en": "Egyptian TV Presenter Among 12 Sentenced to Death for Drug Trafficking", "summary_ja": "エジプトの裁判所は、テレビ司会者サラ・カリファ氏（39歳）を含む12人に、麻薬の製造・密売罪で死刑判決を言い渡しました。判決はエジプト法で義務付けられているグランドムフティとの協議を経ており、控訴の対象となります。当局は750kg以上の薬物と材料、および許可されていない銃器を押収しました。", "summary_en": "An Egyptian court sentenced television presenter Sarah Khalifa, 39, and 11 others to death for manufacturing and trafficking narcotics. The verdict, which required consultation with Egypt's Grand Mufti as mandated by law, is subject to appeal. Authorities seized over 750kg of drugs and materials, along with unlicensed firearms.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/05/egyptian-tv-presenter-among-12-sentenced-to-death-for-drug", "state_media": false, "category": "社会", "full_text": "An Egyptian court sentenced a well-known television presenter and 11 others to death for manufacturing and trafficking narcotics in a sprawling drug case, official media reported on Saturday.\nThe presenter, Sarah Khalifa, 39, is best known for her programme Mission Impossible, which dealt with issues concerning security and crime.\nThe state-linked Al-Ahram newspaper said a Cairo court sentenced “Khalifa and 11 other defendants to death by hanging on charges of forming an organised criminal gang specialising in procuring materials used in manufacturing narcotics, with the intent to traffic them, and possessing and carrying unlicensed firearms and ammunition”.\nThe verdict came after the court consulted the Grand Mufti of Egypt for his religious opinion, a procedure required by Egyptian law in capital cases.\nThe verdict is subject to appeal.\nKhalifa also owns a cosmetic surgery clinic and a production company that specialises in organising parties and events.\nAccording to the state-run Akhbar el-Yom newspaper, the defendants were charged with “manufacturing synthetic drugs with the intent to traffic them, by importing the materials used in manufacturing from abroad”.\nAl-Ahram reported that authorities seized more than 750kg of narcotics and raw materials, and found two apartments used as laboratories as well as unlicensed firearms and ammunition.\nThe court also sentenced Khalifa and others to five years in prison over a separate case involving the kidnapping and assault of a young man.\nEgypt applies the death penalty for premeditated murder, terrorism, some rape offences and drug trafficking.\nAccording to the Egyptian Commission for Rights and Freedoms, 541 death sentences were issued in Egypt in 2025.", "translation_ja": "", "vocab": [{"word": "trafficking", "definition": "違法な物品（特に麻薬や武器）を大量に運搬・販売すること。犯罪行為として国際的に取り締まられます。"}, {"word": "sprawling", "definition": "広がった、複雑に絡み合った状態を表す形容詞。大規模で複雑な事件や組織を指します。"}, {"word": "narcotics", "definition": "麻薬、特に違法な薬物全般を指す法律用語。医学的には麻酔性物質を意味します。"}, {"word": "premeditated", "definition": "事前に計画された、計画的な状態を表す形容詞。特に犯罪が計画的に実行されたことを示します。"}, {"word": "capital cases", "definition": "死刑に値する重大犯罪事件を指す法律用語。生命刑に関わる最も重い犯罪を意味します。"}, {"word": "Grand Mufti", "definition": "イスラム法の最高宗教指導者。イスラム国家で重要な宗教的および法的決定に関与します。"}]}, {"title_ja": "ナポリ対アーセナル：チャンピオンズリーグ開幕戦プレビュー", "title_en": "Napoli vs Arsenal: Champions League Opener Preview", "summary_ja": "セリエAとプレミアリーグの各チャンピオンであるナポリとアーセナルが、UEFAチャンピオンズリーググループステージ開幕戦でディエゴ・アルマンド・マラドーナ・スタジアムで対戦する。ナポリはマクトミナイとアングイッサのミッドフィールド負傷で苦しむ一方、アーセナルは4連勝という好調で臨む。Optaスーパーコンピューターはアーセナルの勝率を52%、ナポリを22%と予測している。", "summary_en": "Napoli and Arsenal, the respective Serie A and Premier League champions, face off in the UEFA Champions League group stage opener at Stadio Diego Armando Maradona. Napoli struggles with midfield injuries to McTominay and Anguissa, while Arsenal arrives in peak form with four consecutive wins. The Opta supercomputer gives Arsenal a 52% chance of victory over Napoli's 22%.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/8/napoli-vs-arsenal-champions-league-prediction-teams-lineups?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Napoli vs Arsenal: Champions League – prediction, teams, lineups\nNapoli has issues in midfield for its Champions League opener against Arsenal, but hope to recover Serie A winning form.\nWho: Napoli vs Arsenal\nWhat: UEFA Champions League\nWhere: Stadio Diego Armando Maradona in Naples, Italy\nWhen: Wednesday at 9pm local time (1900GMT).\nHow to follow: Al Jazeera Sport will bring you all the build-up from 16:00 GMT ahead of our live text commentary stream.\nNapoli and Arsenal are paired in titanic tussle to open their Champions League seasons as two league winners – in Serie A and the Premier League respectively – within the last two-season faceoffs.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Real Madrid beat Inter Milan as Mbappe goal sets Mourinho’s men on way\n- list 2 of 4Lights, camera, action: Irksome influencers at the US Open are here to stay\n- list 3 of 4‘Life became too hard’: Egypt’s vanishing wrestlers and a sport in crisis\n- list 4 of 4Sabalenka interrupts US Open match against Rakhimova over cannabis smell\nThe Gunners ended a 22-year wait to reclaim the English top flight last season, while also reaching the Champions League final where they were defeated by Paris Saint-Germain.\nNapoli were dethroned as Italian champions by Inter Milan last season, but retain a squad capable of striking fear into any side in Europe.\nAl Jazeera Sport takes a look at the mouth-watering matchup.\nWhat form do Napoli hold ahead of Arsenal Champions League test?\nAs the defending Serie A champion last season, Napoli was eliminated in the league phase after finishing 30th of the 36 teams in the Champions League.\nMassimiliano Allegri replaced Antonio Conte as head coach after last season.\n“We need to get 12 points to secure qualification,” Allegri said. “We know we’re up against a team that has just won the Premier League and reached the final of this competition. [Arsenal manager Mikel] Arteta has done well to get his defence organized and they concede very few goals.\n“I had the fortune of [coaching] in two finals but I lost both of them,” Allegri said, referring to when he was at Juventus and the 2015 and 2017 finals, which were won by Barcelona and Real Madrid, respectively.\nNapoli has lost two straight in Serie A, getting beat by Como and Inter Milan – going down 3-2 to the latter at the weekend.\nHow have Premier League champions Arsenal started the new season?\nArsenal are on a four-game winning streak to start their latest campaign.\nThe Gunners beat Manchester City 3-0 in the Community Shield – the English season opener between the previous season’s league and cup winners – to start the run.\nCoventry, Aston Villa and Chelsea have been downed in the league, in what has been a formidable start.\nNine goals have been scored so far, with only one conceded by the team not only regarded as the best defence in the world, but also the favourites lift the Champions League trophy.\nPrediction\nThe Opta supercomputer has given Arsenal a 52 percent chance of winning the game, while offering Napoli only a 22 percent chance.\nHead-to-head\nThis will be the fifth meeting between the teams with Arsenal winning three of the encounters and Napoli claiming victory in the other match.\nPrevious meetings\n- October 1, 2013: Champions League – Arsenal 2–0 Napoli\n- December 11, 2013: Champions League – Napoli 2–0 Arsenal\n- April 11, 2019: Europa League – Arsenal 2–0 Napoli\n- April 18, 2019: Europa League – Napoli 0–1 Arsenal\nNapoli team news\nNapoli has issues in midfield for its Champions League opener against Arsenal on Wednesday, with both Scott McTominay and Andre-Frank Zambo Anguissa unavailable.\nMcTominay underwent a surgical procedure to treat an irregular heartbeat on Tuesday, while Anguissa has a physical issue.\n“In midfield we will play three between (Kevin) De Bruyne, (Billy) Gilmour, (Stanislav) Lobotka and (Antonio) Vergara,” Napoli coach Allegri said Tuesday.\nPredicted Napoli starting lineup\nMeret; Di Lorenzo, Marin, Rrahmani, Spinazzola; De Bruyne, Lobotka, Gilmour; Politano, Hojlund, Santos\nArsenal team news\nCristhian Mosquera has not travelled for the match due to a muscular injury that kept him out of the Aston Villa game.\nJurrien Timber continues his return from a groin injury and could make the bench. William Saliba remains out with a back problem.\nBruno Guimaraes, who was an unused sub at the weekend, is closing on full fitness.\nPredicted Arsenal starting lineup\nRaya; White, Konsa, Gabriel, Hincapie; Zubimendi, Rice; Saka, Odegaard, Tzolis; Havertz", "translation_ja": "", "vocab": [{"word": "titanic", "definition": "非常に大きく重要な、巨大な。ここでは両チームの重要な対戦を形容している。"}, {"word": "dethroned", "definition": "権力や地位から追い落とされた、王座を奪われた。ナポリが前シーズン後にイタリアチャンピオンの地位を失ったことを表す。"}, {"word": "formidable", "definition": "非常に強い、畏敬の念を起こさせるような。アーセナルの強力な開幕戦の成績を形容している。"}, {"word": "supercomputer", "definition": "複雑な計算を高速に処理できる高性能コンピュータ。ここでは試合予測に使用されている。"}, {"word": "muscular injury", "definition": "筋肉の損傷、筋肉の怪我。スポーツ選手が試合に出られない医学的な理由の一つ。"}]}, {"title_ja": "リバプール対アトレティコ・マドリー：チャンピオンズリーグ プレビューと予想", "title_en": "Liverpool vs Atletico Madrid: Champions League Preview and Prediction", "summary_ja": "リバプールはアンフィールドでチャンピオンズリーグのリーグフェーズでアトレティコ・マドリーを迎え、アンドニ・イラオラ監督は監督就任後初の勝利を基に戦う。アトレティコはアスレティック・ビルバオに0-3で敗北した後の試合となり、リバプールはアイサクの2ゴールでイプスウィッチに2-0で勝利している。オプタスーパーコンピューターはリバプールを53%の勝利確率で有利と予想している。", "summary_en": "Liverpool hosts Atletico Madrid in the Champions League league phase at Anfield on Wednesday, with Andoni Iraola seeking to build on his first win as manager. Atletico arrives following a disappointing 3-0 defeat to Athletic Bilbao, while Liverpool secured a 2-0 victory over Ipswich with Alexander Isak scoring twice. The Opta supercomputer favors Liverpool with a 53 percent win probability against Atletico's 23.5 percent chance.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/8/liverpool-vs-atletico-madrid-champions-league-preview-teams?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Liverpool vs Atletico Madrid: Champions League – preview, teams, prediction\nAndoni Iraola looks to build on his first win as Liverpool manager in a tough game against Diego Simeone's Atletico.\nWho: Liverpool vs Atletico Madrid\nWhat: Champions League, league phase\nWhere: Anfield, Liverpool, United Kingdom\nWhen: Wednesday, September 9, at 8pm (19:00 GMT)\nHow to follow: Al Jazeera Sport will bring you all the build-up from 16:00 GMT ahead of our live text commentary stream\nLiverpool and Atletico Madrid kick off their 2026-27 Champions League campaigns with a mouthwatering league-phase game at Anfield.\nAndoni Iraola got his first win as Liverpool manager over the weekend and now turns his attention to his first Champions League game with the football club.\nMeanwhile, Atletico Madrid’s unbeaten start came to an end on Saturday when they slumped to a 3-0 away defeat at Athletic Bilbao.\nIsak fires Liverpool to first win under Iraola\nAlexander Isak struck twice in the opening 10 minutes as Liverpool delivered a first win for Iraola with a 2-0 victory at Ipswich on Friday.\nIsak’s Premier League record 125-million-pound ($169m) move from Newcastle was matched this week by Manchester City’s signing of Enzo Fernandez, but 12 months on, the Swede is finally beginning to deliver on his price tag.\nIpswich never recovered from a disastrous start as Liverpool cruised to victory at Portman Road with their latest 100-million-pound ($135m) signing Bradley Barcola making his debut as a second-half substitute.\nVictory maintains an unbeaten start for Iraola. A pair of 2-2 draws against Newcastle and Nottingham Forest did not lack in entertainment for the Basque coach’s opening two games in charge, but did little to ease doubts over Liverpool’s ability to challenge at the top end of the table this season.\n“We needed it. Definitely needed this one. Also the way it has been, I think, with a clean sheet,” said Iraola.\nFlat Atletico trounced by Bilbao\nAthletic Bilbao thumped Atletico Madrid 3-0 in La Liga on a miserable Saturday afternoon for Diego Simeone’s side.\nSimeone’s Atletico fell to their first defeat of the season, putting up little fight in the second half after Athletic made the breakthrough with two quick strikes from Nico Williams and Robert Navarro, before Oihan Sancet added a third at Bilbao’s San Mames Stadium.\n“[We had] two minutes of inattention and poor decision-making in situations we should have handled better,” said Simeone. “Bilbao capitalised on that lapse.”\nStriker Julian Alvarez, who tried to leave the club to join Barcelona this summer, returned as a substitute after illness in an ineffective second-half appearance.\n“We were good in the first half, but the game got away from us in those [couple of] minutes,” said Simeone.\n“We lacked in the second half everything that we had in the first.”\nPrediction\nThe Opta supercomputer pegs Liverpool as the favourites, with a win probability of 53 percent. Atletico were given a 23.5 percent chance of winning.\nHead-to-head\nT
