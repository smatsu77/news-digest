 bad look for the boss.\nBut what to do?\nHegseth has restricted reporters’ access at the Pentagon, fired journalists at the military newspaper Stars and Stripes, and installed “influencers” to spread pro-Trump propaganda. He hasn’t held a Pentagon news briefing on the war since early May.\nBut none of it seems to work.\nNow, trying to root out the problem at the source, he’s chasing down leakers by giving polygraph tests to about 50 military officers and civilian officials – something never done before in such a widespread way, according to New York Times reporting.\nThe boss, of course, heartily approves.\n“The ‘leakers’ of these treasonous statements are being hunted down!” Trump crowed on Truth Social, his favorite venue for venting rage and threatening retribution. “Long term jail sentences will be sought!”\nGranted, the ubiquitous news reports about shortages of American weapons, including long-range missiles, are a particularly bad look for Trump’s war effort, which seems more every day like a costly and directionless flop. And a huge political liability.\nThe war’s unpopularity has driven down the president’s approval ratings, and that’s a real worry as the midterm elections approach in early November. Trump himself is not on the ballot, of course, but control of Congress certainly is.\nDemocratic control of one or both houses, now in Republican hands, could put some unwelcome restraints on this president’s unbounded malfeasance and endless self-dealing.\nSuch control might even restore long-missing checks and balances. That is a nightmare scenario for this out-of-control president.\nNo wonder he and his allies are trying every method to seize control of journalists and their sources. The weaponized justice department even went so far as to subpoena several New York Times reporters over their stories on security problems with a Qatari-donated plane that’s been repurposed as the new Air Force One.\nInstead of addressing underlying problems, it’s all about seeking revenge. Since the media’s reporting is (largely) protected by the first amendment, the leakers themselves must seem like fair game.\nHegseth has played the polygraph card before. Furious last year after press leaks about plans to give Elon Musk a Pentagon briefing on China, the defense secretary yelled at Christopher Grady, then the acting joint chiefs chairman, accusing him of leaking, the Wall Street Journal reported.\n“I’ll hook you up to a f---ing polygraph!” Hegseth reportedly shouted at Grady.\nBut poorly led organizations, like Hegseth’s Pentagon, will always leak. Chaos and dysfunction need a steam valve. And the truth will out.\nInevitably, facts come to the surface when insiders have information that they want exposed and when journalists are doing their jobs.\nWhat politicians never admit is that leaks often serve an important and positive purpose.\n“Without leaks, we’d be left in the dark about vital information involving government, corporations, and powerful individuals, who often act in secret,” notes the Freedom of the Press Foundation, which also downplays the constant warnings of threats to national security. “We should be skeptical of claims that leaks cause harm and of broad leak investigations that can lead to the surveillance of journalists and sources and the chilling of reporting.”\nDon’t try telling that to Hegseth and Trump, who vastly prefer pro-war propaganda to uncomfortable facts. And who are always looking for someone to blame and punish.\nSome military officials may be scared off by this witch-hunt and decide to keep their lips sealed. But others, if they trust journalists to provide protective anonymity, will take their chances and expose the truth.\nSome, at least, do this out of old-fashioned patriotism, allowing cleansing sunlight into the dark corners of government and the military.\nCall such truth-telling another form of lie detection, one that is a far cry from Trump’s charges of treason. And in terms of democracy, a far more effective one.\n- \n  Margaret Sullivan is a Guardian US columnist", "translation_ja": "", "vocab": [{"word": "malfeasance", "definition": "公職者による違法行為や不正行為を意味する法律用語。職権濫用や腐敗行為などを指す。"}, {"word": "ubiquitous", "definition": "あらゆる場所に存在する、遍在する。ニュースが各所で報道されている状況などを表す。"}, {"word": "chilling effect", "definition": "抑止効果。恐怖や脅威によって人々が自由に行動・発言することを躊躇させる現象を指す。"}, {"word": "witch-hunt", "definition": "不当な捜査や根拠なき迫害。歴史的な魔女狩りから派生した表現で、権力による報復的調査を意味する。"}, {"word": "checks and balances", "definition": "権力分立における抑制と均衡。政府の過度な権力を制限するための制度的仕組みを指す。"}]}, {"title_ja": "トランプの改名ブーム：政治的パフォーマンスとしての地理学", "title_en": "Trump's Renaming Spree: Geography as Political Theater", "summary_ja": "マリーナ・ハイドは、トランプがアメリカの地名や領土の名前を次々と変更する（メキシコ湾をアメリカ湾に、オンタリオ湖をアメリカ湖に、ニューメキシコをニューアメリカに）姿勢を、失敗している7ヶ月間のイラン戦争から目をそらすパフォーマンスとして批判している。彼女は、この傾向がトランプの「シットポスティング」統治アプローチを反映していると主張し、実質的な決定を避けながら政治的忠誠度に基づいてアメリカの地理を絶えず改名し続けている。", "summary_en": "Marina Hyde critiques Trump's frenetic renaming of American landmarks and territories (Gulf of Mexico to Gulf of America, Lake Ontario to Lake America, New Mexico to New America) as performative distraction from his failing seven-month Iran war. She argues this pattern reflects Trump's \"shitposting\" approach to governance—avoiding substantive decisions while constantly rebranding America's geography based on political loyalty.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/08/america-gulf-lake-state-donald-trump-renaming-new-mexico", "state_media": false, "category": "オピニオン", "full_text": "Busy times for crayon-wielding US president Donald Trump, Earth’s most tireless freelance cartographer, who at the weekend celebrated the US labouring under the highest diesel prices in its history while his “two-week” Iran war edges into its seventh month with a social media spree in which he pushed renaming New Mexico as New America.\nIn some ways, it was a surprise to see Trump go for merely rebranding a state at this point, given that it was only so recently that he declared: “If you think about it, we have a gulf, and we have a lake. Now all we need is an ocean.” This is believed to be a reference to the Gulf of America, formerly – and indeed currently, in every meaningful sense – the Gulf of Mexico. It was also a nod to Lake America, as precisely no one calls Lake Ontario despite Trump supposedly retitling it by executive order last month, in another fit of pique over his trade war with Canada. Candidates for this heavily trailed American Ocean clearly include the Pacific and the Atlantic – though why the other oceans should be locationally ineligible increasingly feels unclear. At this rate, geography exams in the US are also about to get a whole lot easier.\nIn the end, you sense, most of the places in the US will go to the chop shop, and either have “America” bolted on the back, or have the Trump name fused on to them as a prefix. See the Donald J Trump and John F Kennedy Memorial Center for the Performing Arts, or the Donald J Trump Institute of Peace in Washington DC. Or, indeed, the President Donald J Trump International Airport in Palm Beach, Florida. A new class of warship may also be procured for naming privileges.\nAs for potential rebrand candidates/victims, how your area votes clearly affects the order in which its landmarks – or itself in its entirety – will be slapped with a fun new identity. When proposing the New Mexico renaming, Trump casually noted that it was “one of the great vote-cheating states of all time”. I wouldn’t be feeling all that confident if I were the Georgia state capitol, or the Trump America capitol as it may imminently be known.\nMeanwhile, it must be said that all this frenetic activity does feel born of Trump’s conviction that it should surely be possible to shitpost his way out of anything, even a war. After all, the Iran war, which I seem to remember was won on day one, has now been going on for more than six months. This feels confusing. First it was going to be two weeks, then four to five weeks. Four days into Operation Epic Fury, Trump explained that the US was “already substantially ahead of our time projections”, while the secretary of defence, Pete Hegseth, added: “It could move up, it could move back.” Having said that, evidence suggests it could only move up, although Trump wrapped up his first week of the conflict back in March by assuring the American people that his campaign continued “to totally demolish the enemy far ahead of schedule and at levels that people have never seen before”. Two days after that, the conflict was downgraded to “a short excursion”, with non-committal historical allies dismissed with a triumphant: “We don’t need people that join Wars after we’ve already won!” The war was “complete, pretty much”, he said two days later.\nAnd yet, was it? A couple of weeks in, Trump was explaining he’d know when the war should be over because he’d “feel it in my bones”. Alas, he seems to have failed to get the arthritic signal to pull out as late as three weeks in, despite assuring everyone that – contrary to appearances such as still bombing the shit out of things – the war had in fact been over “in two or three days”. Flash forward to a month in, and they were still “way ahead of schedule”, although once the five-week mark was hit Trump was dropping casual asides like “a whole civilization will die tonight”. Six weeks in, things were going “swimmingly”. Although, not to nitpick, but were they?\nThat was April. In May, a deal with the Iranians could apparently “happen any day”. By the end of the month, it could have potentially happened “over the weekend”. Same thing a weekend later. A whole two months after that, unfortunately, Trump shifted from the war being over to declaring that his notional/imaginary agreements to end the war were in fact the thing that was “over”. He no longer wished to negotiate with Tehran. Jump ahead to the present day, in fact, and he has spent quite a lot of the past week bombing the shit out of things again. Which is very much the behaviour of any state that won a war back in the first days of March. Unhelpfully, the former US defence secretary Leon Panetta estimated at the weekend that the war would drag on for another six months.\nAll of which suggests there has really never been a better time to rename New Mexico. Those eternal searchers for a so-called Trump doctrine are surely beginning to see that it essentially boils down to wimping out of the big, painful calls that could literally move the dial – for example, ", "translation_ja": "", "vocab": [{"word": "freelance cartographer", "definition": "本来の仕事ではなく、個人的な意図で地図や領土を自由に描き直す人。ここでは、トランプが勝手に地名を変更する様子を風刺的に表現している。"}, {"word": "renaming spree", "definition": "短期間に次々と名前を変えること。衝動的で無秩序な行動パターンを指す。"}, {"word": "frenetic activity", "definition": "激しく落ち着きのない活動。ここでは、トランプの落ち着きのない、次々と繰り出される改名活動を指す。"}, {"word": "shitpost", "definition": "意図的に挑発的または無意味な投稿をすること。本来の問題から目をそらすための軽薄な行動。"}, {"word": "substantive", "definition": "実質的で、内容のある。重大な影響を持つ。対比として「形式的」や「表面的」と相対する。"}, {"word": "arthritic signal", "definition": "関節炎による身体からの信号。ここでは風刺的に、年配の人物が直感だけで戦争終結の判断をする滑稽さを表現している。"}, {"word": "wimping out", "definition": "重要な決定や責任から逃げ出すこと。勇気がなく、難しい決断を避ける行動。"}]}, {"title_ja": "トランプの資産増加と支持率低下の矛盾", "title_en": "Trump's Wealth Surges While Approval Plummets", "summary_ja": "ガーディアン紙のコラムニスト、アルワ・マハダウィはトランプ大統領が2025年に22億ドルを蓄積しながら国のためだと主張していることを批判し、彼の株式取引活動における利益相反を強調している。トランプの金銭的利益（インテル投資などの政府決定から生まれた）が増加している一方で、支持率は記録的低さの33%に達しているが、共和党員の間では72%という高い支持を維持していることに触れている。", "summary_en": "Guardian columnist Arwa Mahdawi criticizes President Trump for accumulating $2.2 billion in 2025 while claiming to act for the country's benefit, highlighting apparent conflicts of interest in his stock trading activities. She notes that despite Trump's financial gains—including from government decisions like the Intel investment—his approval rating has hit a record low of 33%, though remaining strong at 72% among Republicans.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/08/trumps-approval-rating-is-plummeting-as-his-fortune-grows-and-grows", "state_media": false, "category": "オピニオン", "full_text": "If I had a dollar for every time Donald Trump said something inane, I would be a very rich woman. But even with an income that steady, I could never hope to be as flush as the president. A Forbes calculation from March puts his net worth at about $6.5bn – and it’s growing rapidly. Trump made $2.2bn in 2025 via business interests that ranged from selling cryptocurrency and Trump Bibles to offering early access to his (often market-moving) Truth Social posts.\nTo be fair, Trump isn’t making all this money just so he can buy golf clubs and gold toilets. No, he’s amassing these billions for the good of the little people; it’s altruism, not avarice! “I do this for our Country, not myself,” the president wrote on Truth Social on Sunday night alongside an AI-generated picture of him trading Intel stock. “I’ve made Hundreds of Billions of Dollars on Stocks, and many other type Holdings, for the U.S.A., not myself, and all I do is get criticized by the Radical Left Dumocrats. Very unfair, but what can you do!”\nOh, I have some ideas about what you can do, Mr President. Unfortunately, I can’t print most of them. I also can’t explain why Trump said he’s made hundreds of billions, apart from pointing to his propensity for exaggeration. It seems his post was referring to the fact that the US government took a 9.9% stake in Intel last year. That stake was worth $8.9bn at the time and as of Friday is worth nearly five times as much.\nAccording to the Trump administration, this is a win for everyone. In May, the White House released a statement calling Intel’s surging stock price “a direct windfall for American taxpayers”. Weirdly, I seem to have missed my portion of that windfall. Intel’s stock price has had little impact on my life. What is having an impact is the soaring cost of necessities such as electricity and groceries.\nBut I shouldn’t be grumpy, should I? I should be grateful that our intrepid president is balancing the demands of the day job with stock trading for the good of the country. According to Trump’s latest government disclosure, he made more than 1,000 equity trades in June. And his picks are doing very well: a report published in August by Democrats on Congress’s joint economic committee argued that Trump’s holdings in oil and gas stocks had risen by nearly $16m because of the war with Iran. “Experts on government ethics have flagged how rare it is for presidents to hold and trade stocks in individual companies, especially since Trump’s war in Iran and his other favors to the oil industry have all pushed up the value of Big Oil stocks,” the report read.\nTrump’s shamelessness may be rare, but he isn’t the only politician with serious conflicts of interest issues apropos stock market dealings. A 2022 New York Times investigation found that, from 2019 to 2021, 97 lawmakers or their family members traded financial assets in industries that could be affected by their legislative committee work. In 2020, for example, the wife of the now retired Democratic congressman Alan Lowenthal sold her Boeing shares a day before a House committee on which Lowenthal sat released a damning report about the company. Lowenthal told the Times that he was not involved in this trade at all, so I imagine it was just a funny coincidence.\nStill, these sorts of funny coincidences don’t do much to build up trust in the US government, do they? A majority of Americans support commonsense legislation to stop lawmakers and their family members from trading individual stocks. After a lot of resistance, a bill to this effect is winding its way through Congress. The bill does not affect the president or the vice-president, however.\nMoney can’t buy you everything, of course: while the president’s stock portfolio is rising, his personal stock is plummeting. According to an FT poll this week, Trump’s approval rating has hit a record low, with only 33% of registered voters saying they approve of his performance.\nBut don’t take that as a sign that the US is coming to its senses or that Republicans are cognisant that dear leader’s war is bleeding the country dry: the same poll found that 72% of Republicans still approve of the president. That figure is down from 82% in May, but it’s still an awful lot of people. Either these Trump loyalists are bigoted fools or they are getting the Intel windfall checks that I’m missing.\nArwa Mahdawi is a Guardian columnist", "translation_ja": "", "vocab": [{"word": "avarice", "definition": "過度な欲望や金銭への執着を意味する。強い批判的なニュアンスで使われることが多い。"}, {"word": "propensity", "definition": "特定の行動や傾向が起こりやすい性質や傾きを指す。心理的な傾向や習癖を表現する際に使用される。"}, {"word": "windfall", "definition": "予期しない利益や思いがけない利得を意味する。特に偶然または幸運によってもたらされた金銭的利益。"}, {"word": "intrepid", "definition": "恐れを知らない、勇敢な様子を表現する。ここでは皮肉的に使われている。"}, {"word": "shamelessness", "definition": "恥ずかしさや罪悪感を感じない状態。倫理的な問題に無関心である態度を示す。"}, {"word": "cognisant", "definition": "何かを認識している、気付いているという状態を表す。主に英国英語で使われるフォーマルな表現。"}]}, {"title_ja": "アメリカがイランを経済的に締め付けられない理由", "title_en": "Why America Can't Strangle Iran", "summary_ja": "数十年にわたるアメリカの制裁拡大と最近の軍事攻撃にもかかわらず、イラン政府は制裁回避技術と戦略的資源配分を通じて経済的強制に対する回復力を示している。一般的なイラン国民が高いインフレと通貨暴落による深刻な経済的困難に苦しんでいる一方で、イラン政府は軍事能力と指導部の優先事項を維持するのに十分な管理と備蓄を保持している。著者は、国家が経済的苦痛を国民に転嫁しながら自らの利益を守っているため、経済圧力だけではレジーム崩壊を強制できないと主張している。", "summary_en": "Despite decades of escalating U.S. sanctions and recent military strikes, Iran's government has proven resilient in resisting economic coercion by adapting its economy through sanctions-evasion techniques and strategic resource allocation. While ordinary Iranians suffer severe economic hardship including high inflation and currency collapse, the Iranian state maintains sufficient control and stockpiles to sustain its military capabilities and leadership priorities. The author argues that economic pressure alone cannot force regime collapse, as the state effectively transfers economic pain to the population while protecting its own interests.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/why-america-cant-strangle-iran", "state_media": false, "category": "オピニオン", "full_text": "For Iran and the United States, August 24 was Groundhog Day. “We are launching an economic onslaught against Iran’s financial connections around the globe,” declared U.S. Treasury Secretary Scott Bessent. “Our objective is to sever every economic lifeline that sustains this tyrannical regime.” It was the same promise he made in April, when he said that the United States was “imposing a financial stranglehold on the Iranian regime” under what the White House called Operation Economic Fury. It was also akin to the May 2018 rollout of the first Trump administration’s “maximum pressure” campaign, in which Secretary of State Mike Pompeo announced that Iran would be targeted by the “strongest sanctions in history.” And it sounded like U.S. President Barack Obama’s promise, made in 2012, that the Iranian government was to face “even more crippling sanctions.”\nThe Iranian economy has certainly felt the effects of all the successive restrictions. Ever since U.S. President Donald Trump’s first term in office, the country has experienced little growth and high inflation. As a result, Iranian firms have built less infrastructure and adopted fewer new technologies compared with peers in other developing economies. Iranian households, once increasingly affluent, are now at risk of falling below the state’s poverty line.\nYet for the better part of a decade, Iran has been able to resist U.S. economic coercion. Until the recent blockade, it used sanctions-evasion techniques to continue oil exports to its key customer, China. Its non-oil industries also adapted to the sanctions, as currency devaluation reduced competition from imports and made Iranian products more competitive in regional markets, boosting exports. Iran thereby avoided the kind of runaway economic collapse seen in other sanctioned countries, such as Syria and Venezuela.\nToday, war is testing the resilience of the Iranian economy in ways that sanctions alone could not. Numerous U.S. and Israeli airstrikes have targeted critical industrial facilities, including some of Iran’s most important steel and petrochemical plants. The damage sustained during these attacks has led to major production outages for key industrial goods. The general decline in maritime traffic in the Strait of Hormuz and the specific disruptions caused by the U.S. naval blockade have not only reduced Iran’s exports; they have also throttled imports of much-needed capital and consumer goods. According to a July estimate by the International Monetary Fund, Iran’s GDP is set to contract 5.4 percent this year after shrinking by less than half that over the previous 12 months. Year-on-year inflation climbed from 52.6 percent in December 2025 to 88.6 percent by the start of the summer. The value of the country’s currency has hit a record low of over two million rials to the dollar.\nBut even as the country’s economic situation is getting worse, Iran’s leadership remains better able to resist the coercive effects of sanctions than it might appear. The state of the economy is not yet impinging on Iran’s ability to wage war. Stockpiles of various goods remain deep, thanks to years of sanctions experience. And the Iranian state, with its powerful repressive tools, has figured out how to offload much of the economic pain onto ordinary Iranians while making sure its own needs are met. Trump’s approach, in other words, can certainly immiserate most of the country’s people. But it cannot successfully strangle the Islamic Republic itself.\nANATOMY OF A CRISIS\nIranian officials have acknowledged the country’s economic difficulties. “No matter how strong we are militarily, if the people are hungry and we do not have financial circulation, economic growth and domestic production, we will not endure,” declared Mohammad Bagher Ghalibaf, the speaker of Iran’s parliament and a key power broker, on August 21. (Bessent cited this quote as evidence that U.S. economic warfare was having its intended effect.) During a television interview last week, Iranian President Masoud Pezeshkian expressed frustration that some of his fellow political leaders continue to deny that sanctions are harming the country. “Some say sanctions have no effect at all; I really don’t know what to say to those people,” he remarked.\nThe statements from Ghalibaf and Pezeshkian reflect genuine concern about Iran’s economic trajectory. The speaker and the president are understandably worried about deteriorating public opinion, given the inherent connections between general economic welfare and political legitimacy. But U.S. officials should be wary of overinterpreting these statements. Contrary to what it might seem, neither leader is suggesting that the country’s economy is on the brink of collapse.\nAmerican assessments of the Iranian economy and the success of economic coercion fail to account for the ways in which sanctions have transformed Iran’s political economy, altering the distribution of economic resources in ways that reinforce its exis", "translation_ja": "", "vocab": [{"word": "economic coercion", "definition": "経済的強制。制裁や経済的圧力を通じて、ある国や政体に特定の政策変更や行動を強要しようとする戦略。"}, {"word": "sanctions-evasion", "definition": "制裁回避。政府の制裁規制を迂回するために、企業や国が使用する技術や方法。違法取引ネットワークなどを含む。"}, {"word": "immiserate", "definition": "貧困化させる。人々を苦しい経済状況や貧困状態に追いやること。深刻な経済的困難をもたらすという意味。"}, {"word": "resilience", "definition": "回復力。困難な状況や圧力に対抗して、その悪影響から回復する能力。経済的・政治的文脈での適応力を指す。"}, {"word": "stockpile", "definition": "備蓄。将来の不測の事態に備えて、商品やリソースを意図的に大量に貯蔵すること。緊急時対応のための準備。"}, {"word": "repressive tools", "definition": "抑圧的手段。政府が国民を統制・管理するために使用する警察力や軍事力などの強制的手段。"}]}, {"title_ja": "グローバル・ジハード主義の興隆と衰退", "title_en": "The Rise and Fall of Global Jihadism", "summary_ja": "著者は、9/11以降のテロとの戦いが多くの代償と挫折をもたらしたものの、ジハード主義が持続的なグローバル脅威となることを防いだという論点を展開している。初期の成長と採用急増にもかかわらず、アルカイダと後継のジハード主義グループは思想的影響力と能力を喪失し、最近の中東紛争がかつての時代なら採用を引き起こしたであろう事柄に対しても再興が見られていないことが証拠となっている。", "summary_en": "The author argues that while the U.S. war on terrorism since 9/11 had significant costs and setbacks, it ultimately succeeded in preventing jihadism from becoming a sustained global threat. Despite early growth and recruitment surges, al-Qaeda and successor jihadi groups have lost ideological influence and capacity, as evidenced by the lack of a resurgence following recent Middle Eastern conflicts that would have sparked recruitment in earlier decades.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/rise-and-fall-global-jihadism", "state_media": false, "category": "オピニオン", "full_text": "Twenty-five years ago, members of the jihadi group al-Qaeda hijacked four American airplanes, flying two of them into the World Trade Center towers in New York City and one into the Pentagon, in Washington, D.C. Passengers attempted to seize control of the fourth plane, and it crashed in Shanksville, Pennsylvania, killing everyone aboard. The hijackers killed 2,977 people in total—by far the deadliest single terrorist attack in history. To many Americans, the events of September 11, 2001, seemed to come out of nowhere. Few had even heard of al-Qaeda before the attacks. Yet by September 12, the United States had plunged into what President George W. Bush called “a war against terrorism,” a fight that would persist for decades, ensnare multiple jihadi groups, and extend to all corners of the earth.\nThe United States had many setbacks in this war. The ways in which it attempted to prevent another 9/11, or an even larger-scale attack, entailed massive, often inefficient investments as well as troop losses. Some of its efforts, such as the full-scale wars in Afghanistan and Iraq, were brutally destructive. The 2003 invasion of Iraq, in particular, drove a surge in jihadi recruitment. In the years since 2001, various new jihadi groups—some of them connected to al-Qaeda, some opposed to it—have set up shop in the Middle East and across East and West Africa, where they have fueled bloody civil wars, shattered local communities, and launched terrorist attacks both in the region and outside it.\nBut the war on terrorism has not been a complete failure, either. Al-Qaeda itself is devastated. There have been few jihadi attacks on U.S. territory—perhaps the most important measure of success for most American leaders—in the past two and a half decades. According to New America Foundation data, jihadi terrorists have killed 122 people in the United States since 2001, a fraction of what U.S. officials feared in the aftermath of 9/11. And although jihadi groups survive, jihadism has lost much of its ideological salience.\nConsider what has happened since 2023. On October 7, Hamas, a group that al-Qaeda regularly criticized for compromising on theological principles in the pursuit of its political agenda, launched a bloody terrorist attack on Israel, killing more than 1,100 people. Israel went on to kill tens of thousands of Palestinians in Gaza, many of them civilians, and conduct other attacks in Iraq, Lebanon, Syria, and the West Bank. In 2025, the United States joined Israel in bombing Iran, and in 2026 the United States and Israel launched a full-scale war with the initial objective of regime change in Tehran. The Israeli war in Gaza led to mass protests around the world, and all of these events offered fodder for conspiracy theories about the enemies of Islam plotting against Muslims. Yet in contrast to the 2003 U.S. invasion of Iraq or the onset of the Syrian civil war in 2011, they have triggered no jihadi surge. Indeed, the former jihadis who overthrew the Syrian dictator Bashar al-Assad, in 2024, quickly sought to make nice with states that have long fought terror organizations, including the United States and Saudi Arabia, upon taking power.\nA quarter century after Osama bin Laden gave the order for the 9/11 attacks, his successors have not built a durable transnational movement capable of repeatedly attacking the United States and forcing governments to bend to their demands. The sense of historic possibility that once made the jihadi movement so threatening to Western countries has faded. The United States may not have won the war on terrorism, but the jihadis clearly lost.\nTHE BIRTH OF A MOVEMENT\nIn late 2001, al-Qaeda appeared ascendant. The movement grew out of the armed struggle against the Soviet occupation of Afghanistan in the 1980s, and it attracted Muslim fighters from around the world. Under bin Laden’s leadership, al-Qaeda had many goals, including helping the Taliban secure power in Afghanistan and training its members for terrorist and insurgent campaigns throughout the Muslim world, but ousting the United States from the Middle East was at the top of the list. Other jihadis prioritized fighting governments that they saw as foreign invaders in Chechnya and Kashmir, toppling supposedly apostate Arab regimes, battling Shiite Muslims, or creating a caliphate.\nThe scale of its attack on the United States gave al-Qaeda an aura of momentum and outsize influence within the jihadi movement and beyond. After 9/11, the movement grew in stature, and fighting the United States and its Western allies, which most jihadis had previously considered a relatively low priority, became a more mainstream objective. The fact that the U.S. government would make few distinctions between al-Qaeda-linked groups and jihadis with a more local focus in its subsequent counterterrorism campaign only reinforced that trend.\nSeveral factors had made the 2001 attacks possible. Among them were the many shortcomings in Washington’s appro", "translation_ja": "", "vocab": [{"word": "ideological salience", "definition": "思想的影響力や重要性が際立つ状態。ある思想や運動がどの程度、人々の関心や行動に影響を与えるかを示す。"}, {"word": "transnational movement", "definition": "国境を超えて活動する組織運動。複数の国々にまたがって展開され、各国の枠組みを超えた影響力を持つ。"}, {"word": "apostate", "definition": "自らの信仰や信条を裏切った者。特に宗教の文脈では、信仰を放棄した者、または異端と見なされる者を指す。"}, {"word": "aura of momentum", "definition": "勢いや上昇気流を感じさせる雰囲気。ある集団や運動が力強く進展しているように見える外観的な印象。"}, {"word": "insurgent campaigns", "definition": "反政府勢力による武装闘争活動。既存の政治体制に対抗する組織的かつ暴力的な活動の総称。"}, {"word": "durable", "definition": "長期間にわたって持続可能な。耐久性があり、容易には衰退しない状態。"}]}, {"title_ja": "米中関係における新たな緊張緩和の出現", "title_en": "The Emerging U.S.-China Détente", "summary_ja": "著者は、シー・ジンピン国家主席とトランプ大統領の5月の首脳会談が「戦略的安定性」という実用的な枠組みを確立し、10年以上ぶりにコンセンサスを達成したと主張している。著者は、この枠組みがすべての紛争を解決するのではなく、米中関係の底辺を構築し、競争をより効果的に管理することで、軍事紛争や新冷戦を防ぐ可能性があると指摘している。中国が戦略的競争を受け入れたことは自信の表れであり、より慎重な行動につながる可能性があり、9月の首脳会談はこの新たな安定を強化する機会となると述べている。", "summary_en": "The author argues that the May summit between Xi Jinping and Trump established a pragmatic framework of 'strategic stability' that marks a significant diplomatic breakthrough after over a decade without consensus. Rather than resolving all conflicts, this framework aims to build a floor under bilateral relations and manage competition more effectively, potentially preventing military conflict or a new cold war. The author suggests that China's acceptance of strategic competition—rather than rejecting competitive frameworks—demonstrates confidence and could lead to more restrained behavior, with the September summit offering an opportunity to strengthen this newfound stability.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/emerging-us-china-detente", "state_media": false, "category": "オピニオン", "full_text": "When Chinese leader Xi Jinping and U.S. President Donald Trump met in Beijing, in May, they agreed that their two countries should build a constructive relationship of strategic stability. Although many observers in Washington responded skeptically to this new framework, dismissing it as empty words, it marks the first time in more than a decade that China and the United States established a consensus about how to define the relationship that leaders on both sides broadly recognize. Strategic stability does not refer to nuclear détente; rather, it suggests a new equilibrium in which both sides can avoid further deterioration of the relationship and even expand cooperation where interests align.\nLeaders in Beijing do not expect that this new framework can resolve most of the differences between China and the United States or that it can stop new frictions from emerging. In June, for example, the U.S. Department of Defense placed more Chinese companies—including private-sector giants Alibaba, Baidu, and BYD—on its list of firms involved in civil-military fusion activities, barring the Pentagon from contracting with them. In retaliation, China placed ten U.S. entities on its dual-use export control list, which prevents any company from supplying them with items that have the potential for both military and civilian use. But Beijing hopes that a consensus built around strategic stability can help China and the United States manage their differences more effectively and that it will prevent the worst outcomes: military conflict or a new cold war. So far, ongoing friction has not derailed the overarching consensus established in May. By keeping sanctions and countermeasures relatively limited, Beijing and Washington have avoided dangerous escalation and kept the relationship moving forward.\nThe goal of the new diplomatic framework between Beijing and Washington is a pragmatic one. It aims to build a floor under U.S.-Chinese relations rather than try to achieve an unlikely grand bargain that would resolve all conflict. It also represents a changing approach in Beijing to dealing with the United States. Unlike in the past, when China rejected U.S. frameworks focused on competition, it is now willing to recognize that the fundamental nature of U.S.-Chinese relations is competitive. Allies or partners, after all, would not set strategic stability as the overarching goal of their relationship; only competitors, or even adversaries, need to do so. Beijing’s willingness to accept a formulation to manage, rather than exclude, competition shows that it is gaining confidence and seeing itself more as an equal to Washington. Adopting this confident mindset could lead China to act with more restraint in its dealings with the United States—which could in turn bring a further degree of calm to the relationship.\nIt now appears plausible that bilateral relations have turned a corner and entered a more stable phase. Although fundamental challenges remain that could cause new turbulence, the peak tensions of the past eight years may well be receding. The upcoming leaders’ summit in late September, when Xi and Trump are scheduled to meet in Washington, is a chance to further move the relationship forward. The two leaders can now add more concrete measures to support this new framework of strategic stability, including taking steps to reduce economic friction, increase military-to-military communications, improve crisis management mechanisms, expand citizen exchanges, and offer reassurances about Taiwan, thereby defusing tensions that could escalate into potentially catastrophic military conflict. With Xi and Trump likely to meet again multiple times in the next few months, the new framework is the first chance in years to lay the groundwork for enduring stability in bilateral ties.\nBEYOND STRATEGIC COMPETITION\nFor a long time, leaders in both Beijing and Washington sought to define the bilateral relationship in terms of some kind of partnership. In 1997, when Chinese leader Jiang Zemin visited the United States, Beijing and Washington announced aims of “a constructive strategic partnership oriented toward the twenty-first century.” In 2005, the George W. Bush administration urged China “to become a responsible stakeholder” in the international system; Chinese leader Hu Jintao responded in 2006 that the two countries were not only stakeholders but “should also be constructive partners.” But between 2009, when President Barack Obama and Hu agreed to “steadily grow a partnership” to address common challenges, and the Trump-Xi summit earlier this year, the countries’ leaders were unable to reach a new consensus on how to position the relationship.\nThe United States moved away from seeing the relationship as a partnership earlier than China did. During Trump’s first term, the United States began to define U.S.-Chinese relations in terms of “strategic competition.” At first, China tried to accept the competitive element in bilateral rela", "translation_ja": "", "vocab": [{"word": "détente", "definition": "国家間の緊張緩和や関係改善のプロセス。特に冷戦時代の米ソ関係で使用された外交用語。"}, {"word": "consensus", "definition": "複数の国や指導者が共通の意見や協議に達すること。合意や共通理解を意味する。"}, {"word": "strategic stability", "definition": "両国間の軍事的衝突や冷戦を回避するための安定的な関係の枠組み。核抑止力ではなく関係管理を指す。"}, {"word": "pragmatic", "definition": "理想的な目標よりも現実的で実用的なアプローチを取ること。実務的で実現可能な方針を意味する。"}, {"word": "escalation", "definition": "紛争や緊張がしだいに激しくなること。段階的な悪化を指す。"}, {"word": "bilateral", "definition": "二国間の、または二者間の関係や協議。両国の相互関係を意味する。"}, {"word": "civil-military fusion", "definition": "民間部門と軍事部門が統合された活動。民間企業が軍事技術開発に関与することを指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-08 23:06 JST";
  renderTabs();renderList();
})();
</script>
