xecuting lawful military operations\".\n\"This is not patriotism. This is sabotage,\" he said.\nHe echoed some statements Trump had made during a surprise appearance at the White House briefing room on Monday, including touting a rise in military recruitment levels.\nBut Hegseth said Massie was motivated by policy differences and \"not high crimes, not misdemeanours, not treason, not bribery, not the kinds of offences the founders intended when they wrote the impeachment clause\".\nMassie, who lost re-election earlier this year to a Trump-backed opponent, has been critical of Trump and the war in Iran since it began in February.\nHe had already incurred the president's ire for demanding the Trump administration release files on deceased sex offender Jeffrey Epstein.\nWhile Hegseth has survived politically for now, many lawmakers - including some Republicans - have questioned how long he can last in the administration.\nTexas Senator Ted Cruz, a Republican, said on Tuesday he expected Hegseth to resign or be fired by Trump.\n  - Published23 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": []}, {"title_ja": "メーガン妃の父トマス・マークル、足首監視装置を外したとして連邦拘置所に戻される", "title_en": "Meghan's father Thomas Markle back in federal custody after allegedly removing ankle monitor", "summary_ja": "メーガン妃の父トマス・マークル氏（82歳）は、足首に装着された位置情報監視装置を外したとして、フロリダ州の連邦拘置所に戻されました。マークル氏は先週、児童性虐待画像の所持容疑で逮捕され、自宅軟禁の条件で釈放されていましたが、火曜日の公判で保釈は認められませんでした。検察は、マークル氏が児童性虐待画像を含むと思われる約78点の品物をロサンゼルスの貸し倉庫に保管していたと主張しています。", "summary_en": "The 82-year-old was placed under house detention in Florida last week after being charged over possession of child sex abuse material.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c9j3433zy4vro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Meghan's father Thomas Markle back in federal custody after allegedly removing ankle monitor\n- Published\nThomas Markle, the father of Meghan, Duchess of Sussex, is back in federal custody in Florida after allegedly removing his ankle monitor, according to court documents.\nMarkle appeared before a federal magistrate judge in the Florida city of Tampa on Tuesday and was denied bond. Prosecutors say he removed the monitor early that morning.\nUS Judge Lindsay S Griffin found on Tuesday that Markle had violated the conditions of his pretrial release, court documents show.\nMarkle, who has denied possessing images of child sex abuse, was arrested in Florida last week and placed under house detention. He was also ordered to wear a location monitoring device.\nThe BBC has contacted his representatives.\nGriffin described Markle's housing situation as \"untenable\", writing in the order revoking his pretrial release that \"based on the lack of suitable housing, no condition or combination of conditions would reasonably assure the safety of any other person or the community and the defendant's appearance in court\".\nHe also ordered a medical evaluation for Markle and said he \"must receive all necessary and prescribed medication unless discontinued by a physician\".\n\"Release conditions are court orders, not suggestions,\" Bill Essayli, the US attorney for Central California, wrote on X on Tuesday.\n\"We will continue to prosecute this case to the fullest extent of the law,\" he added.\nMarkle, 82, was first arrested last week after the FBI, acting on warrants, searched storage units in Los Angeles registered to him which he had rented since 2008, with the last payment being made in October this year, the DoJ said.\nInside the units the FBI says agents seized about 78 items, including film negatives, slides and books that they allege contained child sex abuse material.\nWitnesses \"positively identified\" Markle in two of the images believed to contain child sex abuse material.\nIn those images, the man pictured \"appears to be in the age range of 30s to 40s\", which suggests the alleged abuse dates back decades as Markle is currently 82 years old.\nMarkle appeared in court last week following his arrest. No plea was taken during the appearance, which set several conditions for his pretrial release, including that he be kept in home detention.\nHe is charged with one count of possessing indecent images of children, according to the DoJ.\nFBI director Kash Patel said last week that Markle \"allegedly targeted innocent children and sought to steal their innocence through his criminal actions\".\nMarkle has called the allegations \"sick lies\".\nHe moved to the Philippines last year after he had a series of strokes, and lived in Cebu until May. He was reportedly learning to walk again in Florida after having his leg amputated.\nThe duchess has been estranged from her father since 2018. The BBC understands she broke contact with him last year, telling him she and the authorities knew he had abused young girls.\nIn a previously shared statement, Meghan confirmed the existence of the letter and wrote: \"I am deeply distressed... my thoughts are with any children who may have been harmed.\"\nShe said she hoped it could be understood why she had largely cut off contact from her father and did \"not allow him to have contact with our children\".\nRelated topics\n  - Published14 hours ago\n  - Published29 October", "translation_ja": "", "vocab": []}, {"title_ja": "マレーシアの失脚した元首相が横領罪で獄中から自宅監禁に移行", "title_en": "Malaysia's disgraced former PM leaves jail for house arrest after embezzling millions", "summary_ja": "マレーシアの失脚した元首相ナジブ・ラザクが、政府系ファンド1MDBから数十億ドルを横領した罪で、4年間の獄中生活を終え自宅監禁に移行しました。マレーシア国王から条件付き恩赦を受けた73歳のナジブは、残り2年の刑期を自宅で服役することになります。この決定は汚職対策の努力を損なうものだとして批判を浴びています。", "summary_en": "Najib Razak was convicted for his role in the billion-dollar scandal involving the 1MDB sovereign wealth fund.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cxnv0v4yln7do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Malaysia's disgraced former PM leaves jail for house arrest after embezzling millions\n- Published\nMalaysia's disgraced former Prime Minister Najib Razak has arrived home to begin serving the rest of a jail sentence for corruption under house arrest.\nThere was a big media presence at his Kuala Lumpur residence to see the 73-year-old return from prison in an SUV late on Tuesday night, escorted by a heavily armed police convoy.\nNajib's return ended a four-year prison stint after he was found guilty over the embezzlement of billions of dollars from the country's sovereign wealth fund.\nThe 1MDB scandal brought down his government and made headlines around the world when it came to light a decade ago, embroiling prominent figures from Malaysia to Goldman Sachs and Hollywood.\nInvestigators estimated that $4.5bn (£3.3bn) was siphoned from the state-owned wealth fund, which Najib co-founded, into private pockets, including his own. More than $1bn allegedly ended up in accounts linked to Najib, according to prosecutors.\nNajib's lawyers claim he had been misled by his advisers - in particular the financier Jho Low, who has maintained his innocence and remains at large.\nNajib's mansion in one of the capital's most exclusive neighbourhoods was declared a federal prison ahead of his homecoming on Tuesday.\nCritics said his release from jail undermined efforts to fight corruption and questioned its legal basis, saying Malaysian law made no provision for house arrest.\nNajib, who was prime minister from 2009 to 2018, denied wrongdoing but was convicted at two separate trials.\nIn the first trial he was sentenced in 2020 to 12 years in prison and jailed in 2022. The term was later halved on appeal.\nIn September, the King of Malaysia granted him a conditional pardon to see out the remaining two years of his sentence at home.\nThe transfer to his mansion was to take place on Friday but put on hold after the attorney general sought clarification of the royal decree. On Tuesday the high court ruled the house arrest was effective immediately.\nNajib's party paid a $12m fine as part of the terms of the royal pardon allowing him to serve the rest of his term at home.\nHe was sentenced after being convicted of abuse of power, money laundering and breach of trust over 42 million ringgit ($10m; £7.7m) transferred from SRC International - a former unit of 1MDB - into his private accounts.\nNajib is appealing against a 15-year prison sentence, handed down at a second trial in December 2025, in a case involving much larger sums of money. In that case he was convicted of misappropriating nearly 2.3 billion Malaysian ringgit ($569m; £422m) from the nation's sovereign wealth fund 1Malaysia Development Berhad (1MDB).\nHe is due to start serving that sentence after his house arrest ends, which is expected in August 2028.\nRelated topics\n  - Published28 July 2020\n  - Published9 August 2019\n  - Published3 July 2018", "translation_ja": "", "vocab": []}, {"title_ja": "デイヴィッド・ウォリアムズ、差し止め仮処分申し立てが却下された後、性的非行の疑惑で告発される", "title_en": "David Walliams accused of sexual misconduct after losing injunction bid", "summary_ja": "ITVニュースとガーディアン紙は、デイヴィッド・ウォリアムズが複数の女性から性的非行で告発されていると報道した。3年間の共同調査による疑惑には、15歳の少女を含む女性らがグルーミングや不適切な行動を受けたと主張している。ウォリアムズは自分は「性的捕食者ではない」と主張しているが、一部の行動について思慮に欠けていたことを認めている。", "summary_en": "ITN and the Guardian allege the comedian preyed on teenage girls and young women. He has denied all allegations.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckn8w8p9370zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "David Walliams accused of sexual misconduct after losing injunction bid\n- Published\nITV News and the Guardian have published reports alleging that David Walliams has been accused of sexual misconduct by several women, including one who was aged 15.\nThe allegations were made as a part of a joint three-year investigation, external by the two news organisations, which was published after the entertainer lost a legal bid to stop the claims against him being made public.\nSome of the women accuse Walliams of \"grooming\" them when they were teenagers. One now characterises her alleged encounter with Walliams at 15 years old as a \"sexual assault\".\nIn a letter to journalists published by the Guardian, Walliams said he was \"not a sexual predator\" and had not \"broken the law\".\nHe said he \"realised that at times I behaved thoughtlessly towards other people I had casual sexual relationships with\" and said he regretted not always taking \"people's feelings properly into account\".\n- If you are affected by any of the issues in this story, help and support is available at BBC Action Line.\nWalliams shot to fame alongside Matt Lucas in the early 2000s with BBC sketch comedy Little Britain, and also served as a judge on ITV's Britain's Got Talent and launched a best-selling series of children's books.\nThe Guardian and ITV News say that several of the women, who do not know one another, allege they were targets of unwanted sexual advances from Walliams.\nThe allegations include:\n- One woman alleges she met Walliams at a fan event when she was 15. She says he groomed her and they had sex when she was 17\n- Another woman alleges she met Walliams for a coffee when she was 15, before going back to his house where he allegedly tried to lift up her shirt and commit an act that she now describes as a sexual assault\n- A woman who worked as a model in her teens accused Walliams of grooming her. A different woman who also worked as a model said Walliams tried to kiss her while showing her around his home\n- The investigation claimed Walliams had a sexual relationship with at least one junior employee at publisher HarperCollins, and pursued another\n- Other women allege inappropriate behaviour at ITV's Britain's Got Talent, such as inviting girls and young women to his dressing room\nIn a letter addressed to journalists working on the ITV and Guardian investigation, Walliams wrote: \"Looking back, I realise that at times I behaved thoughtlessly towards other people I had casual sexual relationships with.\n\"I realise I did not always take people's feelings properly into account. That is something I regret. And whilst a power imbalance is inevitable when one party is famous, abusing that power is something else entirely and it is something that I never did.\"\nHe added: \"I am not a sexual predator. I have not broken the law, but I am devastated that some of the women I met 10 to 20 years ago have now expressed hurt or anger towards me.\"\nAfter the investigation was published on Tuesday, Walliams's long-time literary agent Independent Talent Group confirmed it had dropped him.\nA BBC spokesperson described the allegations as \"serious\" and the corporation has removed Little Britain from BBC iPlayer.\nSky also described the allegations as \"extremely serious\", saying it was dropping its upcoming adaptation of Walliams's fantasy feature Fing! and had \"already removed content which features him from our platforms\".\nThe Metropolitan Police said it has contacted the Guardian and ITV News to \"to ensure that any potential victims\" are \"made aware of how they could report any criminal allegations to police\".\nOne of the women who alleged Walliams \"groomed\" her as a teenager told BBC Newsnight she was \"angry\" at his behaviour.\nLilly Creightmore - who Walliams contacted when she was 18 - waived her right to anonymity.\nCreightmore told Newsnight that a month after they first met, Walliams told her she \"could move in with him and basically that I could be his flatmate\".\nShe said that after she arrived to stay at his house she \"felt instantly pressured to share a bed with him\".\n\"In the evenings, he would sort of come and sit with me and stroke my leg, and one night I think he put his head in my lap and sort of be like, 'are you sure you don't want to come and sleep in my bed with me?' I had an inner strength like, 'no I'm not attracted to you in that way'... I felt I was being manipulated,\" she added.\nShe told Newsnight: \"I am angry, I'm suppressing it well, but just that this culture of older men in positions of power needs to go, needs to stop. They're abusing their positions, using young people and abusing young people, and people of any age of course. There were too many men in power still, that are doing this and they need to go.\"\nWalliams's lawyers told the ITV News and Guardian investigation that he denied grooming Creightmore or acting inappropriately. They added he did not \"target\" her because she was \"vulnerable\" or \"young\".\nWalliams said he believed his friend", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアのスパイ容疑で米陸軍兵がイギリスで逮捕", "title_en": "US Army soldier suspected of spying for Russia arrested in UK", "summary_ja": "ロシアのための諜報活動を行った容疑で、米陸軍の41歳の上級兵士がイギリスで逮捕されました。被疑者はNATO同盟軍素早い対応部隊の司令部があるグロスターシャー州のイムジン兵営に配置されていました。イギリスのカウンターテロ警察は2023年国家安全保障法に基づいて容疑者を取り調べており、FBI長官は重大な懸念を表明しています。", "summary_en": "The 41-year-old senior soldier is accused of national security offences and is being questioned in London.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6d7q77xgw0vo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "US Army soldier suspected of spying for Russia arrested in UK\n- Published\nA soldier in the US Army has been arrested on suspicion of spying for Russia, British counter-terror police have said.\nThe 41-year-old senior serviceman was arrested near Gloucester on Tuesday.\nCounter Terrorism Policing London said the man had been arrested under section one and section three of the National Security Act 2023.\nSection one of the Act relates to obtaining or disclosing protected information, while section three relates to assisting a foreign intelligence service.\nAs part of the investigation, officers are carrying out searches at two locations in Gloucestershire.\nThe BBC understands the soldier was based at Imjin Barracks in Innsworth, Gloucestershire. The barracks serve as the headquarters of Nato's Allied Rapid Reaction Corps (ARRC), a strategic operational base for the alliance.\nCounter Terrorism Policing said it was not linked to any other ongoing investigations.\nFBI director Kash Patel said in a statement: \"This important arrest involves allegations of espionage, which is of the utmost concern to the United States and our allies.\"\nHe added: \"While this investigation is continuing, I want to send a clear message – this FBI has no tolerance for anyone who breaks their oath to the United States and whose actions endanger our national security and that of our partners.\"\nDeputy Assistant Commissioner Vicki Evans, from Counter Terrorism Policing London, described the arrest as \"significant\".\n\"The allegations are serious and our investigation is very much ongoing,\" she said.\nThe unnamed soldier is currently in custody at a London police station.\nHe has been detained under the National Security Act 2023, allowing police to hold him without charge for up to 14 days.\nBrig Gen Sean Stinchon, commanding general of US Army Counterintelligence Command, said: \"The alleged conduct of a senior soldier, entrusted with sensitive information, is a sobering reminder that insider threats are real and persistent.\n\"I encourage anyone who thinks they've witnessed something suspicious to report it to their local counterintelligence office.\"\nAdditional reporting by Daniel Sandford, UK correspondent.", "translation_ja": "", "vocab": []}, {"title_ja": "フランスの警察、モハメド・アルファイド問題で逮捕 - パリのリッツホテルを捜索", "title_en": "Arrests made in Mohamed Al Fayed probe in France, police say", "summary_ja": "フランス警察は、故モハメド・アルファイド元ハロッズ会長兼リッツホテルオーナーによる虐待疑惑の調査に関連し、パリのリッツホテルを含む3つの物件を捜索し、複数人を身柄拘束した。英仏当局による合同作戦の一環として、10月13日と14日に捜査が実施され、人身売買、買収罪、強姦容疑について予備調査が進められている。この疑惑に関連した逮捕は初めてのことである。", "summary_en": "The Ritz hotel in Paris, which is still owned by the Al Fayed family, is one of the properties searched by police.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck1wvwyrd4ywo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Arrests made in Mohamed Al Fayed probe in France, police say\n- Published\nFrench police have made arrests after three properties, including the Ritz hotel in Paris, were searched in relation to an investigation into Mohamed Al Fayed's abuse.\nThe Paris prosecutor's office told the BBC that several individuals were taken into custody for questioning last month and later released.\nIn a confidential letter sent to survivors, the Metropolitan Police said its officers were present during the searches on 13 and 14 October, in what is understood to be a joint operation between British and French authorities.\nIt is the first time any arrests have been made in relation to alleged abuse and trafficking by the former Harrods and Ritz owner.\n- Mohamed Al Fayed accused of multiple rapes by staff \n  - Published19 September 2024\nSeveral victims of Al Fayed were also interviewed by French investigators, the prosecutor's office said.\nIt added that the searches were part of a preliminary investigation into \"allegations of human trafficking committed by an organized group, aggravated pimping committed by an organized group, and rape\".\nThe investigation is ongoing and digital material seized during the searches is being analysed.\nThe late Egyptian billionaire bought the Ritz Paris hotel in 1979, and it is still owned by the Al Fayed family.\nThe Villa Windsor in western Paris, another property involved in the search, was a holiday home for the Al Fayed family. It was previously the home of King Edward VIII, following his abdication, and his wife Wallis Simpson.\nThe Met shared this statement from French authorities with victims:\n\"At this stage of the proceedings, several victims have been interviewed by French investigators, and the investigations are being conducted in liaison with the British authorities.\n\"In this context, searches and evidence-gathering operations were carried out in mid-October 2026, notably within the Hotel Ritz in the 1st arrondissement of Paris, as well as at the Villa Sainte-Thérèse in Saint-Tropez, a former property of Mohamed Al Fayed, and at the Villa Windsor in the 16th arrondissement of Paris, in the presence of British investigators.\n\"Several suspects were taken into police custody, measures which were lifted following their interviews, specifically for the purpose of analyzing digital material seized during the search operations.\n\"The investigations are continuing under the direction of the Paris Public Prosecutor's Office.\"\nA Met Police spokesperson confirmed its officers travelled to France in October and were present during the operation.\nAl Fayed, who died in 2023 aged 94, was accused by more than 20 women of sexual assault in a BBC documentary and podcast in September 2024.\nOne of the women featured in the documentary said she was sexually assaulted by Al Fayed at the Ritz hotel in Paris, while another woman said she had been raped by him at the Villa Windsor residence.\nSince those allegations, more than 400 alleged victims or witnesses have come forward to lawyers.\nA woman has also told BBC Scotland she was trafficked, drugged, sexually assaulted and held prisoner on the Balnagown Estate by Al Fayed's brother, Salah Fayed, who died in 2010.\nBoth brothers died without facing legal charges in relation to these allegations.\nEarlier this year, Police Scotland said it was carrying out further investigations into allegations connected to Balnagown Estate.\nIn a statement, a force spokesperson said: \"Three people have been identified in connection with offending against a number of victims.\n\"Our inquiries are ongoing and it would be inappropriate to comment further.\"\nThe Justice for Fayed and Harrods Survivors group said it welcomed the \"significant developments\" and cooperation between the Met and French authorities.\n\"We believe that all properties owned by Fayed should be investigated with the same thoroughness as those already searched, wherever they are located, to ensure that no potentially relevant evidence is overlooked,\" the group said.\n\"We hope these developments represent meaningful progress towards identifying and holding to account all those who facilitated, concealed or assisted his offending, wherever they operated.\"\nThe survivor advocacy group No One Above said: \"France is treating this as organised human trafficking, led by specialists, with properties searched and evidence seized. That is what a serious investigation into a network looks like.\n\"Two years on, survivors are still waiting for the same from the Met. It is time the National Crime Agency took this investigation over.\"\nThe management of the Ritz Paris told AFP news agency that it \"does not tolerate any form of harassment, abuse or inappropriate behaviour\" and that it was ready \"to cooperate fully with the competent judicial authorities\".\nIf you have been affected by any of the issues raised in this story, information and support is available at BBC Action Line.\n  - Published27 September 2024\n  - Published24 August", "translation_ja": "", "vocab": []}, {"title_ja": "米国、ユダヤ人コミュニティとイギリス空軍基地を標的とした計画に関与したイラン工作員3人を起訴", "title_en": "US charges 3 alleged Iranian operatives over plots targeting Jewish communities and a UK airbase", "summary_ja": "米国当局は、イラン関連のテロ組織に代わって、ヨーロッパと米国のユダヤ人コミュニティおよびイギリスのフェアフォード空軍基地に対する約20件の攻撃を計画していたとして、イラン・イラク二重国籍者、イラン国籍者、イラク国籍者の3人を起訴しました。起訴された被告人たちは、イランのイスラム革命防衛隊とイラク武装勢力カターイブ・ヒズボラに関連するネットワークを代表して、テロキャンペーンの調整を支援していたと検察は主張しています。", "summary_en": "US prosecutors claim the three men were planning a \"campaign of terror\" ish communities and a UK airbase. The Fairford incident prompted the withdrawal of US bombers stationed there for operations against Iran.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-charges-3-alleged-iranian-operatives-over-plots-targeting-jewish-communities-and-a-uk-airbase/a-79913543?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "US charges 3 over alleged Iran-linked terror plots\nNovember 11, 2026\nUS authorities charged three men on Tuesday over allegedly plotting a \"campaign of terror,\" claiming that the trio had planned nearly 20 attacks against Jewish communities in Europe and the United States, as well as Britain's Royal Air Force (RAF) Fairford airbase.\nThe British base was used by the US for attacks against Iran. It came under the spotlight in late September, when UK authorities detained several men over a \"major incident\" near the military compound.\nThe officials had received information about suspicious vehicles nearing the base and responded by setting up a safety zone and evacuating homes in the area, as well as by dispatching strong security forces and a bomb disposal unit. Five people were arrested.\nThe US has since withdrew its bombers from the base.\nOne of the defendants charged on Friday allegedly helped coordinate the Fairford incident from a US jail.\nWhat do US prosecutors allege?\nAn updated indictment unsealed in Manhattan federal court charged an Iranian-Iraqi dual national, an Iranian national and an Iraqi national. Only the dual national is in custody.\n\"These defendants helped orchestrate a campaign of terror on behalf of terrorist organizations affiliated with Iran,\" US Attorney Jamie McDonald said.\nProsecutors claim the dual national used coded messages to relatives from jail to arrange payments to people who could carry out attacks. He allegedly continued coordinating with his co-defendants in the days before the Fairford incident.\nThe indictment said the men used a network of contacts in Britain to plan attacks on behalf of an Iran-aligned network that included Iran's Islamic Revolutionary Guard Corps and the Iraqi armed group Kata'ib Hizballah. Both are designated foreign terrorist organizations by the US.\nSuspect says he is a 'prisoner of war'\nProsecutors described the defendant held in the US as a Kata'ib Hizballah commander.\nArrested in the spring, the suspect pleaded not guilty in June to charges of plotting at least 18 attacks in Europe in retaliation for the US and Israeli war with Iran.\nHe called himself a \"prisoner of war.\"\nBritish authorities had also linked the alleged Fairford plot to Tehran, which denied involvement. .\nUK prosecutors alsoseparately charged two men, both 24, under the National Security Act in October. One is accused of assisting Iran's intelligence service and was granted conditional bail. The other faces a charge of entering a prohibited place for a purpose prejudicial to the UK, relating to an alleged reconnaissance visit to Fairford in August. He was remanded in custody.", "translation_ja": "", "vocab": []}, {"title_ja": "マレーシア前首相ナジブ・ラザク、王妃恩赦を受けて帰宅 1MDB汚職事件で自宅軟禁", "title_en": "Former Malaysian leader Najib Razak returns home under royal pardon, but faces a separate 15-year prison sentence", "summary_ja": "マレーシアのナジブ・ラザク前首相は、1MDB汚職事件で45億ドルが流出した国家投資基金をめぐる4年間の獄中生活を経て、王妃の条件付き恩赦により自宅軟禁で残りの刑期を服することが認められた。政党UMNOが罰金を支払い、高等裁判所が11月10日に移送を承認した。ナジブの自宅軟禁は2028年8月までだが、権力濫用と資金洗浄の別の15年刑については対象外であり、控訴に失敗した場合は再び投獄される可能性がある。", "summary_en": "Najib Razak has left prison under a royal pardon, prompting a minister to resign in protest. Malaysia's former leader still faces a separate 15-year sentence over the corruption scandal that brought him down.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/former-malaysian-leader-najib-razak-returns-home-under-royal-pardon-but-faces-a-separate-15-year-prison-sentence/a-79913437?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Malaysia's Najib Razak moves to house arrest over 1MDB scandal\nNovember 10, 2026\nFormer Malaysian Prime Minister Najib Razak arrived home Tuesday to serve the remainder of his corruption sentence under house arrest after four years in prison over the 1MDB scandal that saw $4.5 billion siphoned out of the state investment fund.\nThe transfer followed a royal pardon and a court ruling that ended a legal dispute over his release from prison.\nNajib, 73, reached his Kuala Lumpur residence in a convoy escorted by police and prison vehicles, with supporters waiting outside.\n\"It's a final relief,\" his lawyer Muhammad Shafee Abdullah told reporters, adding that house arrest was \"still an imprisonment because he can't leave the house unless he gets special permission or for a special reason.\"\nWhy was Najib allowed to leave prison?\nMalaysia's King Sultan Ibrahim Iskandar granted Najib a conditional pardon in September, allowing him to complete his reduced six-year sentence at home once a court-imposed fine was paid.\nHis political party, the United Malays National Organization (UMNO) which governed Malaysia for six decades following independence, paid the fine on Friday. Najib briefly left prison but was returned hours later after the attorney general sought legal clarification.\nThe king subsequently warned against defying the pardon, which he said was \"clear, explicit and without any ambiguity.\" The Kuala Lumpur High Court issued a fresh order Tuesday allowing the transfer.\nTransport Minister Anthony Loke resigned in protest against the decision to let Najib serve his sentence under house arrest.\nCould Najib return to prison?\nNajib's house arrest runs until August 2028 but does not cover a separate 15-year sentence for abuse of power and money laundering. He is appealing that conviction and could return to prison if the appeal fails.\nPrime minister from 2009 to 2018, Najib has denied wrongdoing in the looting of state investment fund 1Malaysia Development Berhad, known as 1MDB.\nAccording to US investigators, stolen funds paid for luxury properties, a superyacht and artworks — and, ironically, helped finance \"The Wolf of Wall Street,\" a film about financial fraud. The investigators estimated $1 billion of the funds ended up in accounts linked to Najib.\nNajib apologized in 2024 for mishandling the affair but said officials and fugitive financier Jho Low had misled him.", "translation_ja": "", "vocab": []}, {"title_ja": "英国でロシアのスパイ容疑で米陸軍兵を逮捕", "title_en": "British counterterrorism police arrest US soldier accused of spying on behalf of Russia", "summary_ja": "英国の対テロ警察は、ロシアのためにスパイ活動を行った容疑で米陸軍の41歳の兵士をグロスター近郊で逮捕した。英米当局が密接に協力して行った捜査の結果であり、FBI長官は国家安全保障を脅かす行為として「極めて深刻な懸念」を表明した。グロスター周辺はRAFフェアフォードやGCHQなど、英米の重要な軍事・情報施設が集中している地域である。", "summary_en": "A member of the US Army has been arrested near Gloucester in England. Police said he was suspected of espionage activity in connection with Russia. Investigators from the US and UK are involved in the probe.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/british-counterterrorism-police-arrest-us-soldier-accused-of-spying-on-behalf-of-russia/a-79913240?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "US soldier arrested in UK on Russian espionage allegations\nNovember 10, 2026\nA 41-year-old member of the US Army was arrested near Gloucester on Tuesday in England, the Metropolitan Police said in a statement.\nAuthorities were searched two locations in the Gloucestershire region, police said, adding: \"The country to which the allegations pertain is Russia.\"\nUS authorities, the US Military and the FBI were closely involved in the investigation, police said.\nThe man was in custody at a London police station, authorities said on Tuesday evening as the news emerged.\nWhat did US and UK officials say about the arrest?\nDeputy Assistant Commissioner Vicki Evans, Senior National Coordinator for Counter Terrorism Policing called it a \"significant arrest\" as a result of \"close collaboration between UK and US authorities.\"\n\"The allegations are serious and our investigation is very much ongoing,\" Evans said.\nFBI Director Kash Patel said the case was of \"utmost concern\" to the US and its allies.\n\"While this investigation is continuing, I want to send a clear message — this FBI has no tolerance for anyone who breaks their oath to the United States and whose actions endanger our national security and that of our partners,\" Patel said. He also expressed thanks to UK investigators across various branches and the US Military Counterintelligence Command \"for their outstanding work.\"\nBrigadier General Sean Stinchon, the commanding general of US Army Counterintelligence Command also said the case demonstrated the \"resolve of the counterintelligence community.\"\n\"The alleged conduct of a senior soldier, entrusted with sensitive information, is a sobering reminder that insider threats are real and persistent,\" Stinchon said.\nBusy area for US and UK military, intelligence communities\nThe area around Gloucestershire in the west of England, around two hours' drive from London, is home to several sensitive military and intelligence sites as well as outposts for various British and US companies with ties to the defense industry.\nRAF Fairford, which was in the news earlier this year amid a security scare at the vast airbase used by both UK and US planes, is not far southeast of Gloucester.\nGloucester's neighboring town, Cheltenham, is one the UK's intelligence hubs outside London. It is home to the headquarters of the country's signals intelligence agency GCHQ.", "translation_ja": "", "vocab": []}, {"title_ja": "下院、ヘグセス弾劾を棚上げ、現議会での可決を事実上終焉させる", "title_en": "House tables Hegseth impeachment, effectively killing it in current Congress", "summary_ja": "下院はピート・ヘグセス国防長官に対する弾劾決議を棚上げにし、現議会での可決の可能性を事実上終わらせた。ヘグセス氏はこの弾劾の試みを米国兵士に向けられたものとして位置づけている。", "summary_en": "Hegseth framed the effort as being directed at U.S. service members.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/hegseth-dismisses-impeachment-effort-political-spectacle/story?id=138002466", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ：ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは24時間体制で速報ニュースと生中継イベントをお届けします。最新の国内外のニュースをリアルタイムでカバーしています。重要な出来事や事件の発生時には、詳細な情報をライブ配信でお伝えします。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "民主党議員、ICE拘束の8歳ハイチ人少年について説明を要求", "title_en": "Democratic lawmakers want answers on 8-year-old Haitian boy taken into ICE custody", "summary_ja": "民主党議員のグループが、先週政府に拘束された8歳のハイチ人少年について、トランプ政権に情報提供を求めている。議員らは移民税関捜査局（ICE）による少年の拘束状況について詳しい説明を要求している。", "summary_en": "A group of Democratic lawmakers is seeking information from the Trump administration after an 8-year-old Haitian boy was taken into government custody last week.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/democratic-lawmakers-answers-8-year-haitian-boy-ice/story?id=138019026", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ルイス・ハミルトン、エジプトのラファ検問所とガザ支援施設を訪問", "title_en": "Lewis Hamilton visits Egypt’s Rafah crossing and Gaza aid facilities", "summary_ja": "7度のF1世界チャンピオン、ルイス・ハミルトンがエジプトのラファ国境検問所を訪れ、ガザへの人道支援を行う団体と面会しました。ハミルトンはイスラエルの空爆で殺害されたガザの子どもたちについてソーシャルメディアで発信し、停戦を呼びかけてきました。訪問中、彼はエジプト赤新月社が運営する物流倉庫を視察し、援助物資のガザへの輸送状況を学びました。", "summary_en": "Seven-time F1 world champion tours border area and logistics warehouses operated by Egyptian Red Crescent Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory. The seven-time Formula One world champion has spoken", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/10/lewis-hamilton-egypt-rafah-crossing-gaza-aid-facilities", "state_media": false, "category": "政治", "full_text": "Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory.\nThe seven-time Formula One world champion has spoken out about conflict and humanitarian crises in the region, and has called for peace. He has frequently posted on social media about children killed in Israeli airstrikes in Gaza and called for a ceasefire.\n“I think we need to make sure we’re pushing to free Congo, free Sudan, free Syria, free Palestine. I think there’s a lot of peace that I’m hoping we get to at some stage,” Hamilton said in October.\nA ceasefire agreement reached last year has halted major combat operations in Gaza, but the amount of aid reaching the territory continues to fall far short of the agreed-upon minimum of 600 trucks a day.\nIsraeli forces have continued to advance, expanding their control from 53% of the territory to at least 60%, an independent commission of UN experts said last month.\nAirstrikes also continue, and Israeli fire along the advancing front has killed at least 196 Palestinians, including 18 women, 32 boys and 11 girls, the commission said.\nHamilton toured Egypt’s Rafah border crossing with Gaza before visiting logistics warehouses operated by the Egyptian Red Crescent, which facilitates the entry of aid to Gaza.\nAt the crossing, Hamilton greeted aid workers with “Assalamu alaikum” a widely used Arabic greeting meaning “peace be upon you.” He shook hands and briefly spoke to workers and officials.\nKhaled Megawer, the governor of North Sinai, where Rafah is located, said the visit was intended to help Hamilton learn about Egypt’s efforts to send aid to Gaza.\nThe visit comes after Hamilton made his 400th race start on Sunday at the São Paulo Grand Prix at Interlagos.\nThe first black F1 driver, he made his debut with McLaren in 2007. He is only the second F1 driver to start 400 races after his former teammate Fernando Alonso, who achieved the milestone in 2024.", "translation_ja": "", "vocab": []}, {"title_ja": "エジプトで列車衝突、少なくとも7人が死亡", "title_en": "Collision of two trains in Egypt kills at least seven", "summary_ja": "エジプトの首都カイロ南方約50km離れたギーザ県アル・アイヤート地区で日曜日、2台の列車が衝突し、少なくとも7人が死亡、125人以上が負傷しました。ファイユーム方面行きの列車がアスワン行きの列車の後部に衝突したもので、同国の鉄道網は保守管理の不備で事故が後を絶ちません。エジプト大統領は迅速な調査を指示しました。", "summary_en": "President orders prompt investigation after one train derails in collision in al-Ayyat about 50km from Cairo Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said. The crash occurred in al-Ayyat district in Giza prov", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/08/egypt-two-trains-deadly-collision", "state_media": false, "category": "政治", "full_text": "Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said.\nThe crash occurred in al-Ayyat district in Giza province, about 50km (30 miles) south of Cairo, when a train travelling to Fayoum province crashed into the rear of a train heading to the southern province of Aswan, according to the transport ministry.\nAn inspection indicated that the Cairo-Aswan train had been stationary on the same track, officials said.\nThe health ministry gave the casualty toll, adding more than 70 of the injured were discharged after receiving treatment.\nTrain derailments and crashes are common in Egypt, where the railway system has a history of mismanagement and poor maintenance of equipment. In recent years the government has announced modernisation initiatives to improve its railways.\nAyman Gamal, a resident of Kafr Girza in al-Ayyat where the crash occurred, said people rushed to the scene, pulled out survivors and called ambulances.\nGamal said he saw about 80 of the injured being taken by ambulances to hospital. Some passengers were trapped inside one of the carriages of the stationary train and died, he said.\nEgypt’s president, Abdel Fatah al-Sisi, said in a social media post that he had ordered a prompt investigation.\nOutside al-Wasta central hospital in Beni Suef province, where some of the injured were taken for treatment, survivors said passengers were in shock and struggling to breathe because of all the dust that was kicked up. Nearby villagers eventually got them out, they said.\nFarha Gamal, a survivor who was inside the Fayyoum train, said she saw some of the passengers who appeared dead and others were struggling to find their way out of the car. “There were other cars that were completely mangled,” she said in an interview.\nEmergency teams and cranes were dispatched to the crash site to clear the wreckage and restore train services to their normal schedule as soon as possible, the Egyptian railway authority said.\nLast September, a train driver and his assistant were injured after two freight trains collided in the same district.\nEgypt’s deadliest train crash was in 2002 when more than 300 people were killed after a fire broke out on an overnight train journeying from Cairo to southern Egypt.", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカの哲学がマンチェスターの映画祭の新しいアプローチにインスピレーションを与えた", "title_en": "How African philosophies inspired a new approach to staging film festivals in Manchester", "summary_ja": "マンチェスターで開催される映画祭「See My World」は、過去が現在と未来を形作る方法を探求するアフリカの哲学にインスピレーションを受けています。この祭典は、アフリカ系ディアスポラの独立系クリエイターを紹介し、1945年のマンチェスター汎アフリカ会議の遺産を継承する運動の一部です。ケニアの作家ジョン・ムビティとングギ・ワ・ティオンゴの思想に基づき、植民地化された思考方法の回復と解放を求める戦略を探求する場として機能します。", "summary_en": "See My World, an event highlighting the pan-African thought via film, poetry and dance, builds on momentum sparked by local activists and creatives African philosophies including exploring how lessons from the past can shape the present and near future have inspired a film festival coming to Manches", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/news/2026/nov/08/african-philosophies-see-my-world-film-festival-manchester", "state_media": false, "category": "社会", "full_text": "African philosophies including exploring how lessons from the past can shape the present and near future have inspired a film festival coming to Manchester.\nSee My World, a day dedicated to independent creators from across the African diaspora in the north of England, will take place at the Contact theatre on 21 November.\nThe festival is part of See My World’s year-round programme showcasing pan-African arts, culture and events.\nIt reflects the determination among creatives and activists in Manchester to build on the legacy of the 1945 Pan-African Congress in Manchester – which connected luminaries of postwar independence movements with a shared vision of liberation – after last year’s 80th anniversary commemorations.\nSee My World’s CEO and artistic director, Tunde Adekoya, said this month’s film festival was taking inspiration from across the spectrum of pan-African thought, including the works of Kenyan writers John Mbiti, an Anglican theologian who died in 2019, and Ngũgĩ wa Thiong’o, the author of the groundbreaking 1986 book Decolonising the Mind who died last year.\nBoth writers rejected the colonial conceit that African thought was inferior, stressed the importance of community and saw reclaiming African ways of knowing as essential to a people’s self-understanding.\nWhile Mbiti sought common ground between African religions and Christianity, Ngũgĩ was a Marxist. He argued colonialism was motivated by cultural and economic conquest, and that European powers used language as their sharpest instrument. Ngũgĩ famously abandoned English to write in Gikuyu, a Bantu language mainly spoken in Kenya and criticised the role missionary Christianity played in colonial rule.\nAdekoya said: “It’s a day dedicated to pan-African and global majority films from the north of England with exclusive premieres of documentaries we’ve been working on, which weave together expressions of liberation through art forms like poetry and dance.\n“The whole idea is that it’s like a playground in search of strategies of liberation, using the festival as a way to explore different philosophies.\n“John Mbiti explores the philosophy and spiritual understandings of time through the concept of Sasa na Zamani – in which the past informs everything that happens moving forward. That reflects how we constantly go back to pan-African histories to inform how we progress.”\nFilm-makers have been invited to submit films lasting up to 30 minutes from across genres, with no screening fees charged.\nAs well as submissions, the festival will feature documentaries produced by See My World. They include Homage, a “cinematic love letter to dance” that traces a culture through present-day portraits illustrating dance artists and archival material from Manchester, telling a story of joy, loss, migration, rhythm and resistance. Meanwhile, Poetic Justice explores how pan-African thought and Manchester’s poetry scene speak across decades.\nAdekoya added: “The idea is that we would go against the norm of how film festivals are, because when we think about decolonisation, we think about how structures have been created to alienate and exclude communities.\n“So we thought our film festival would look more at how we make film accessible and how stories that deserve to be seen get seen. Throughout the day we will have different activities, from exhibitions to explorations of our performances, discussions, Q&As, insights into directors’ processes, and workshops.\n“We’ve been looking for literature and concepts that inform us and give us an understanding of who we truly are. And as works from thinkers like John Mbiti have come into our sphere, they have really emboldened us to think differently about our place in the world and what we do.”\nSee My World film festival runs from 2pm to 11pm on Saturday 21 November at Contact theatre, Oxford Road, Manchester.", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン、列車衝突事故の69人の犠牲者のための国葬を開催", "title_en": "Spain holds state funeral for 69 victims of deadly train crash", "summary_ja": "スペインの国王夫妻が、トレド近郊で発生した列車衝突事故の69人の犠牲者のための国葬に参列しました。この事故によって国民の鉄道網への信頼が大きく揺らぎ、同国の運輸相の辞任を招きました。国葬は11月11日火曜日に執り行われました。", "summary_en": "Spain’s King and Queen have joined families of the 69 victims from a deadly train collision at a state funeral.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/11/spain-holds-state-funeral-for-69-victims-of-deadly-train-crash?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Spain holds state funeral for 69 victims of deadly train crash\nNewsFeed\nSpain holds state funeral for 69 victims of deadly train crash\nSpain’s King and Queen have joined families of the 69 victims from a deadly train collision at a state funeral on Tuesday. The crash, 60 kilometres from Toledo, has shaken public confidence in the rail network and forced the country’s transport minister to resign.\nPublished On 11 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "「愛するすべてのものが危機に晒されている」トゥンベリがCOP31会談を批判", "title_en": "‘Everything and everyone we love is at stake’: Thunberg slams COP31 talks", "summary_ja": "スウェーデンの気候活動家グレタ・トゥンベリは、トルコのアンタルヤで開催されたUN気候変動会議COP31に到着し、国連気候会談を偽善的だと非難した。トゥンベリは、世界的リーダーたちに利益と権力よりも人類と地球を優先するよう促し、現在の経済システムが人間の本質と相容れないと警告した。彼女は、気候変動が「すべてのものを脅かしている」と述べ、若い気候活動家らと共に、より意味のある変化と説明責任を求めている。", "summary_en": "Climate activist urges world leaders to put people and planet before profit as she arrives at UN climate talks.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/11/everything-and-everyone-we-love-is-at-stake-thunberg-slams-cop31-talks?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "‘Everything and everyone we love is at stake’: Thunberg slams COP31 talks\nClimate activist urges world leaders to put people and planet before profit as she arrives at UN climate talks.\nSwedish climate activist Greta Thunberg has condemned the United Nations climate talks as hypocritical and urged world leaders to put people and planet ahead of profits and power.\nThunberg made the comments on Tuesday as she arrived at the COP31 conference in the Turkish resort city of Antalya.\n“It’s a hypocrisy every year that the host countries are given an opportunity to whitewash themselves and we know that these negotiations are filled with lobbyists, paid by the very destructive industries which are benefiting from our extremely violent status quo,” Thunberg said.\n“Our political and economic systems that have become incompatible with human nature.”\nThe talks follow a year of deadly climate-related disasters, including heatwaves and floods, and another energy shock caused by the US-Israel war on Iran.\nCOP31 co-hosts Turkiye and Australia are promoting renewable energy and rooftop solar installations, but both still rely heavily on fossil fuels, especially coal, to generate electricity. Previous hosts, including Brazil, the United Arab Emirates and Azerbaijan, are major oil producers.\nClimate change is “threatening everything”, Thunberg said, warning that “everything and everyone we love is at stake”.\n“We should act to protect and benefit people rather than constantly sacrificing the global majority and the very planet we are all living on, for a fortunate few to keep making unimaginable profits and maintaining geopolitical power,” she said.\nThunberg rose to prominence in 2018 as a 15-year-old, when she began a solitary “School Strike for Climate” outside the Swedish parliament.\nThe Antalya summit is the first she has attended since the 2021 talks in Glasgow, Scotland, where she dismissed world leaders’ promises as “blah, blah, blah”.\nShe has also campaigned for other causes, including the Free Palestine movement, and more recently backed French students protesting for more school resources.\nHer arrival in Antalya has created excitement among many of the youth climate activists at COP31 who are demanding more climate finance.\n“I hope that Greta’s presence here reminds us of why we started this work in the first place: to push for meaningful change, hold decision-makers accountable, and work towards a better future for all of humanity,” Amber Turner, a 26-year-old fellow with the Alliance of Small Island States, told The Associated Press news agency.\nQiyun Woo, a youth environmentalist from Singapore, said Thunberg’s “powerful” presence “adds to calls from a generation that inherits the consequences of these negotiations”.\nCOP31 runs in Antalya until November 20.\nNext year’s edition, COP32, is scheduled to take place in Ethiopia’s capital, Addis Ababa, in November 2027.", "translation_ja": "", "vocab": []}, {"title_ja": "イラン戦争ライブ：ヘグセス国防長官が弾劾回避、イランが米国との会談を否定", "title_en": "Iran war live: Hegseth survives impeachment bid; Iran denies US talks", "summary_ja": "米国下院はイラン戦争に関する疑惑でペット・ヘグセス国防長官の弾劾決議案を委員会に送付し、事実上弾劾を阻止した。イラン国会議長はイスラエルが米国を対イラン戦争に引き込もうとしていると主張し、イラン安全保障幹部はテヘランとワシントン間の協議についての報道を否定した。", "summary_en": "Despite bipartisan opposition to the war, a bid to impeach Hegseth fails as Iran denies talks with US.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/11/11/iran-war-live-hegseth-survives-impeachment-bid-iran-denies-us-talks?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: Hegseth survives impeachment bid; Iran denies US talks\nDespite bipartisan opposition to the war, efforts to impeach Hegseth were squashed as Iran denies US, Tehran talks\nPublished On 11 Nov 2026\n- The US House, which Republicans control until January, has voted 211 to 204 to send a resolution to impeach US Defense Secretary Pete Hegseth to committee, effectively killing the bid. The resolution accused him over the war on Iran, among other allegations.\n- Iranian Parliament Speaker Mohammad Bagher Ghalibaf has said that Israelis are “working overtime to drag the US into an endless war with Iran”, as Iranian security chief Mohsen Rezaei dismissed reports that talks are ongoing between Tehran and Washington.", "translation_ja": "", "vocab": []}, {"title_ja": "米国判事、トランプ大統領のBBC相手の100億ドル名誉毀損訴訟の継続を認める", "title_en": "U.S. judge says Trump’s $10 billion BBC defamation case can proceed", "summary_ja": "米国の連邦判事は11月10日、ドナルド・トランプ大統領がBBCに対して提起した100億ドルの名誉毀損訴訟を継続することを認めた。BBCは2021年1月6日の議会襲撃に関連する演説の編集映像を放映したもので、トランプ大統領はこれにより評判が傷つけられたと主張している。判事はトランプ大統領が名誉毀損の主張を合理的に立証したと判断した一方、不公正な取引慣行に関する請求は却下した。", "summary_en": "U.S. District Judge Jeffrey Kuntz in Florida declined to throw out Mr. Trump’s defamation ​claim against the BBC, ‌saying Mr. Trump had plausibly alleged that the broadcaster damaged his reputation and knew or should have known the clip was misleading", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-judge-says-trumps-10-billion-bbc-defamation-case-can-proceed/article71688097.ece", "state_media": false, "category": "社会", "full_text": "A federal judge on Tuesday (November 10, 2026) said U.S. President Donald Trump’s $10 billion defamation lawsuit against the BBC over a misleadingly edited clip of a speech can go forward, but threw out Mr. Trump’s unfair trade practices claim against the broadcaster.\nMr. Trump is suing Britain’s publicly funded broadcaster for at least $10 billion over edited clips of a speech that made it appear he directed supporters to storm the U.S. Capitol on January 6, 2021. The case is one of several Mr. Trump has privately filed against the news media as part of a wider pressure campaign against coverage he dislikes.\nU.S. District Judge Jeffrey Kuntz in Florida declined to throw out Mr. Trump’s defamation claim against the BBC, saying Mr. Trump had plausibly alleged that the broadcaster damaged his reputation and knew or should have known the clip was misleading. Judge Kuntz’s ruling did not decide whether Mr. Trump has proven those claims.\nMr. Trump called the ruling a “huge victory” in a social media post. “We will continue fighting against, and defeating, all of those who try to deceive the American People!” he wrote.\nThe BBC did not immediately respond to a request for comment.\nThe BBC previously admitted the edits were misleading and apologised to Mr. Trump, though it denies being liable for defamation.\nMr. Trump’s lawsuit, filed in December in Florida federal court, accuses the BBC of defaming him by splicing together parts of the speech, including one section where he told supporters to march on the Capitol and another where he said “fight like hell”. It omitted a section in which he called for peaceful protest.\nThe edited speech appeared in a BBC “Panorama” documentary show shortly before the 2024 presidential election, which Mr. Trump won. A leaked internal BBC memo cited the edits as evidence of potential political bias, sparking a public relations crisis for the broadcaster and leading to high-level resignations.\nPublished - November 11, 2026 06:03 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "米国共和党がヘグセス国防長官弾劾案を阻止", "title_en": "U.S. Republicans derail bid to impeach Hegseth", "summary_ja": "米国下院共和党は11月10日、イラン戦争をめぐる国防長官ピート・ヘグセスの弾劾決議を司法委員会に送付する投票で211対204で可決し、本会議での弾劾採決を事実上回避した。共和党のトマス・マッシー議員が弾劾決議を提出したが、同党は中間選挙での大敗後、ヘグセスへの支持を表明し、トランプ大統領に勝利をもたらした。マッシー議員の8つの弾劾条項は、ヘグセスが議会の承認なく違法に戦争を行い、国防長官の権限を乱用したと主張していた。", "summary_en": "The House voted 211 to 204 to send the impeachment resolution to the Judiciary Committee; this halts the immediate impeachment drive but does not prevent Democrats from reviving the effort after taking control of Congress in January", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-republicans-derail-bid-to-impeach-hegseth/article71687959.ece", "state_media": false, "category": "政治", "full_text": "Republicans in the U.S. House of Representatives on Tuesday (November 10, 2026) blocked an effort to impeach Defence Secretary Pete Hegseth over the Iran war, handing President Donald Trump a victory days after his party's crushing midterm election defeat.\nThe House voted 211 to 204 to send the impeachment resolution to the Judiciary Committee, effectively derailing a planned vote on Wednesday (November 11, 2026) on whether to bring formal charges against the embattled Pentagon chief.\nThe resolution was introduced by Republican Thomas Massie, a Trump critic who was the only member of his party to oppose the procedural maneuver, according to U.S. media.\nThe impeachment drive had threatened to deepen Mr. Trump's troubles after Democrats swept last week's midterms, with anger at the sputtering Iran war and soaring fuel prices helping drive voters to a historic rejection of Republicans.\nRepublicans still hold a narrow House majority until January, when Democrats take control of both chambers of Congress. And 11 Democrats missed the vote.\nPentagon spokesperson Sean Parnell, in a post on X, hailed the vote as a \"TOTAL VICTORY!\"\n\"We look forward to ending this sham impeachment in the committee room, where facts will continue to prevail and this distraction can be put to rest.\"\nMr. Hegseth earlier on Tuesday (November 10, 2026) dismissed the impeachment effort as a \"farce\" and defended his record leading the Iran war and other military operations under Mr. Trump.\n\"It's a farce, and it's a stunt, and everybody knows it,\" he said at a Pentagon press conference, branding the accusations \"slander\" and \"sabotage.\"\nMoments after Mr. Hegseth's televised appearance, Mr. Trump signalled his support.\n\"Pete Hegseth gets an 'A' PLUS, PLUS, PLUS,\" the 80-year-old president wrote on his Truth Social platform.\nVice-President J.D. Vance also backed the Defence Secretary, saying he had \"obviously not\" committed impeachable offenses.\n'Would do it again'\nMr. Massie's eight articles of impeachment accused Mr. Hegseth of illegally waging war without congressional authorisation and abusing his powers as Pentagon chief.\nSeveral related to the eight-month Iran war, accusing him of violating the War Powers Resolution, which places limits on U.S. military interventions without congressional authorisation.\nOther allegations involved the 2025 conflict with Yemen's Iran-backed Houthis and strikes on alleged drug-smuggling boats in the Caribbean and eastern Pacific, which Mr. Massie branded \"extrajudicial killings.\"\nHe also accused Mr. Hegseth of suppressing free speech by trying to punish Democratic Senator Mark Kelly over a video urging military and intelligence personnel to refuse illegal orders.\nMr. Hegseth defended the operations in Yemen, Iran, Venezuela and against alleged drug smugglers, while seeking to equate the impeachment effort with an attack on U.S. troops.\n\"I stand behind every one of these operations. I was proud to execute them, and I would do it again tomorrow,\" he said.\nThe decision to send the resolution to committee halts the immediate impeachment drive but does not prevent Democrats from reviving the effort after taking control of Congress in January.\nMr. Massie, who lost his Republican primary to a Trump-backed challenger, will leave Congress at the end of his term.\nPublished - November 11, 2026 05:23 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナのゼレンスキー大統領、戦争終結に向けた外交努力に関する米国特使からのメッセージに満足感を示す", "title_en": "Ukraine’s Zelenskyy says he is pleased with messages from U.S. envoys on diplomatic efforts to end war", "summary_ja": "ウクライナのゼレンスキー大統領は、ロシアとの4年半以上続く戦争の解決に向けた米国からのメッセージに満足していると述べた。アブダビで開催された米国主導の3者協議の初日が終了した後、ゼレンスキー大統領は建設的で実質的な進展があったと評価した。ゼレンスキー大統領は、戦争停止、ウクライナへの安全保障保証、その後のヨーロッパの安全保障についての対話という順序が重要であることを強調した。", "summary_en": "“I see changes. I am very happy about what I hear,” Mr. Zelenskyy said when asked about the recent messages by U.S. presidential ‌envoys ⁠Jared Kushner and Steve Witkoff", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/ukraines-zelenskyy-says-he-is-pleased-with-messages-from-us-envoys-on-diplomatic-efforts-to-end-war/article71687545.ece", "state_media": false, "category": "政治", "full_text": "Ukrainian President Volodymyr Zelenskyy said on Tuesday (November 10, 2026) he was very happy with messages he was getting from the U.S. in terms of moving towards a resolution of the more than four-and-a-half-year-old war with Russia.\nMr. Zelenskyy was addressing journalists after a day of talks with Nordic leaders in Denmark, as a first day of U.S.-led trilateral discussions between Ukraine, Russia and the U.S. wrapped up in Abu Dhabi.\n“I see changes. I am very happy about what I hear,” Mr. Zelenskyy said when asked about the recent messages by U.S. presidential envoys Jared Kushner and Steve Witkoff.\nMr. Zelenskyy has been careful to smooth over what has often been a volatile relationship with U.S. President Donald Trump, particularly after a February 2025 Oval Office meeting during which Mr. Trump accused him of being ungrateful.\nThe talks in Abu Dhabi are the first three-sided discussions to be held since February. Mr. Zelenskyy described the first day as constructive and substantive.\nLater, in his latest comments to journalists, Mr. Zelenskyy said the agenda of the talks in Abu Dhabi had included formulating a new security architecture for Europe, an idea raised earlier on Tuesday (November 10, 2026) by Russian Foreign Minister Sergei Lavrov.\nMr. Zelenskyy said the notion was “very difficult”.\n“We are all very cautious with this topic because nobody really understands 100% what they want. I think we understand, but nobody saw the documents, what the Americans discussed with the Russians,” Mr. Zelenskyy said.\nHe said the idea was first raised by Russian President Vladimir Putin in 2021 and the administration of President Joe Biden at the time was cautious about it as the sequence of what had to be done first was important.\n“Everybody is ready for dialogue. First, stop the war in Ukraine. Second, security guarantees for Ukraine. Third, maybe some dialogue about the topic of security in Europe, in the world,” Mr. Zelenskyy said.\n“This sequence is very, very important in this case.”\nEarlier, Mr. Lavrov had said Moscow would not agree to an immediate ceasefire without knowing what would happen next.\nHe said it would be wiser to discuss the outlines of the future security architecture in Europe first, and then a ceasefire in Ukraine.\nPublished - November 11, 2026 05:44 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "グレゴール・チザム: ブルージェイズがフリーエージェンシーで避けるべき5人の選手、タリク・スクバルから始まる", "title_en": "Gregor Chisholm: Five players the Blue Jays should avoid in free agency, starting with Tarik Skubal - Toronto Star", "summary_ja": "トロント・スターのコラムニスト、グレゴール・チザムは、ブルージェイズがフリーエージェント市場で署名を避けるべき5人の注目選手を分析しています。その筆頭としてタリク・スクバルを挙げており、経済的および戦略的な理由からこれらの選手との契約回避を推奨しています。", "summary_en": "Gregor Chisholm: Five players the Blue Jays should avoid in free agency, starting with Tarik Skubal Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiggJBVV95cUxPalY0NmFMUW81OWdtY19BTFlqbVp0dl9sYTdXUGVpSnVrV0Y3YzBEbWJzdVVHS0pjd1JGTlAxRGpsUXZuZm1sSW1yRHBLS3lrTEtqQXhRZU0walJVaXV6dDlYbDZzaE8xOFZvZXMzX0RDVzdFNFRlemtpUW5Ga3pScV9sSC1MTVhXd1J6SEVaYTRiNWtLRklROWZNNHptS0FiTUxvUUhtb2wzUlVzMkxLVmdNMXRBWHBwRDBUYXY5S29USjU3cGljcDVjMVQwZm83RnhhcGhiSC1VcDVSWEo4amxCZ2I2clY2TjJWdlVIdS14X0dGYjNneExGaWF3Q1hNMVE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オンタリオ州の早期インフルエンザシーズンの謎", "title_en": "The mystery behind Ontario's early flu season - Toronto Star", "summary_ja": "オンタリオ州では例年より早い時期にインフルエンザシーズンが到来している。専門家らはこの異例の現象の背景にある要因を調査している。公衆衛生当局は住民に対し、予防措置と予防接種の重要性を強調している。", "summary_en": "The mystery behind Ontario's early flu season Toronto Star", "source": "The Star", "tier":
