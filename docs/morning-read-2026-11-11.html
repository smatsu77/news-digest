", "summary_en": "Lula and Xi Jinping sign 37 deals in Brasília, but Brazil skips Belt and Road O GLOBO", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMizwFBVV95cUxPOWw3MVRSY3hFbEgyT1A1OFNaNXA4d05OVlV3ZGtPVUx5VDB1N2VMeXB1S0U0Q1BzdlppNTN0ZF9oR0ZqSmhnMlp2ellMVFpyS3ZISnlfNlNQNzg2Z1BnQzBUUUNVdDdUdVRwTzgxbGtFcVg5Yzg4S2pjNDFBUU91YU5jQTR6MkFfVkdWbE04Mno2VTAtT0FWLVNVQmZuNVpzWTI4WWV5eDVQRDM4MENndF9KM0NUbWlINlc0eDVHdXM3Q09HTExRTGZiblZGVk3SAd4BQVVfeXFMTVhOaS00d3dBNFlTZkRiOFVPWURfTWloN2NBWDk1LUNiVXNfRmRjbkFJaXBRc3BXWVBFdVk1OUJoSk95N2pNSWZYYzI3dnhpa093ZkxNWGVEN2ltTkNYc1FKSUZCTl9xYU5yVVVJV2tjS0lVbWxWdEpQWTUwYkJsMXBaT0xBX0pWRVdzaEdQcndtQVFMeXNnRFgwY24xdktQTzNYR1I4S3VRYUtGNzZPNjdxUlNPSUstQUZrcUdPZGhqcHhuN25VcjgyZEd3NVU2MEtkTlhDRTJPd3M2VHFn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "NHRC、10月に384,196件の人権侵害申し立てを記録、前月比13.4%増加", "title_en": "NHRC records 384,196 human rights violation complaints in October, cases up 13.4%", "summary_ja": "ナイジェリア国家人権委員会（NHRC）は10月に全国で384,196件の人権侵害報告を記録し、前月の338,810件から13.4%増加したと発表した。差別からの自由の侵害に関する申し立てが最も多く217,243件で、そのうち180,000件は国内避難民（IDP）キャンプからのものだった。委員会はテロ攻撃や略奪行為によって家を逃れた避難民の劣悪な生活条件と、彼らが直面する系統的な権利問題と差別的障壁に対する懸念を強調した。", "summary_en": "“Every complaint is a person, a family, or a community whose rights and dignity need protection,\" the NHRC executive secretary said. The post NHRC records 384,196 human rights violation complaints in October, cases up 13.4% appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/924315-nhrc-records-384196-human-rights-violation-complaints-in-october-cases-up-13-4.html", "state_media": false, "category": "社会", "full_text": "The National Human Rights Commission (NHRC) on Tuesday said it recorded 384,196 reports of human rights violations in October across Nigeria, up by 13.4 per cent from the previous month.\nThe number of cases stood at 338,810 in September.\nIn October, complaints on the violation of the freedom from discrimination were the highest at 217, 243.\nGiving the report at the NHRC’s headquarters in Abuja on Tuesday, the Executive Secretary, Tony Ojukwu, said 180,000 of the 217,243 discrimination cases were from the camps of Internally Displaced Persons (IDPs).\nHe said, “Every complaint is a person, a family, or a community whose rights and dignity need protection.\n“Our responsibility is not simply to document these complaints, but to ensure that the information gathered informs appropriate intervention as well as effective remedy.”\nHe stressed the importance of ensuring that “displacement does not deprive individuals and families of their dignity, security, and access to basic rights.”\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAcross many states, many Nigerians live under poor conditions of the camps of Internally Displaced Persons (IDP) after fleeing their homes over terrorists’ attacks, banditry and other threats of violence.\nThe complaints by IDPs reflect a systemic rights issue, social marginalisation, institutional neglect, and discriminatory barriers affecting displaced communities in Nigeria.\nComplaints due to insecurity\nOther issues of concern highlighted in Tuesday’s dashboard include insecurity, reports of killings, armed attacks, and abductions.\nThe commission’s Human Rights Observatory documented incidents involving attacks on farming communities, travellers, women, traditional leaders, and security personnel, particularly concerning their reports of mass killings and abductions in parts of Taraba, Borno, Zamfara, Niger, and Plateau State, among other locations.\nMr Ojukwu stressed that the reported incidents are not merely security concerns but also concern issues with “direct humanitarian implications.”\nHe said, “They affect the right to life, liberty, and dignity, and security of the person. They disrupt livelihoods, restrict freedom of movement, and expose children and mothers.\n“The commission reiterates that the protection of lives and property is an environmental responsibility of the state.”\nMr Ojukwu also encouraged political actors to exercise restraint and conduct themselves within the ambit of electoral laws and human rights.\nAs the 2027 elections draw near, “we should not lose focus on the fact that elections, voting process and outcomes reflect the interplay of various human rights.”\nDashboard details\nSenior Human Rights Adviser to the NHRC, Hilary Ogbonna, noted that the human rights complaints recorded by the commission in 2026 have crossed the 2.5 million mark.\nThe commission recorded 116,739 complaints from the North Central, 65,309 from the South West, 63,120 from the North West, 50,902 from the South South, 49,618 from the North East, and 38,508 from the South East.\nThe FCT, Lagos, Benue, Kaduna, Borno, Plateau, Kano, Rivers, Imo and Niger were among the top ten states with the highest violation complaints. This is the first time Lagos and Rivers are among the top ten states in 2026.\nMr Ogbonna attributed this to the tension with the upcoming elections, particularly in Rivers State.\nThe 10 states accounted for 52 per cent of the entire complaints recorded in October.\nWomen’s right violations\nThe commission recorded 632 complaints of women denied access to children, 591 abandonment, 339 trafficking and 376 forced marriages.\nMr Ogbonna noted an upsurge in men abandoning their wives.\n“Month after month, we try to ask ourselves, even in the commission, what could be the reason for this. It’s not our mandate to go and look for white men abandoning their marriages, but when it becomes a human rights issue, it gives us cause for worry,” he said.\nREAD ALSO: Court orders forfeiture of two Mercedes-Benz cars, phones linked to convicted fraudster\nSix rapes, 18 sexual violence incidents, and 1,873 domestic violence incidents were recorded in the month under focus. According to Mr Ogbonna, they each represent a woman who has been given a permanent scar.\nChild rights violations\nSimilarly, child abandonment in October rose by over 250 per cent to 2,479, with Mr Ogbonna describing the trend as a human rights breach.\nAlso, 2,093 children were forced into marriage, 2,141 cases of sexual abuse, 2,581 were denied their rights to education, and 1,681 were trafficked.\nCases resolved\nAmong the entire figures recorded in October, the NHRC resolved 1,455 cases.\nThe commission also visited 108 places of detention, five military formations and summoned the police 45 times.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "詐欺罪で有罪判決を受けた男に関連する2台のメルセデス・ベンツ車と携帯電話の没収を連邦高等裁判所が命令", "title_en": "Court orders forfeiture of two Mercedes-Benz cars, phones linked to convicted fraudster", "summary_ja": "ラゴス連邦高等裁判所は、詐欺罪で有罪判決を受けたイフェアニ・アリンゼ容疑者に関連する2台のメルセデス・ベンツ車、4台の電子機器、その他の財産の最終没収を命じました。経済金融犯罪委員会（EFCC）の申し立てを受けたイエリム・ボゴロ判事は、これらの財産が違法行為の収益で購入された疑いがあると述べています。アリンゼ容疑者はアメリカの被害者と接触し、外国の金融口座を通じて資金移動を指示していたとされています。", "summary_en": "The EFCC alleged that the properties \"were reasonably suspected to have been acquired with proceeds of unlawful activities.\" The post Court orders forfeiture of two Mercedes-Benz cars, phones linked to convicted fraudster appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/924308-court-orders-forfeiture-of-two-mercedes-benz-cars-phones-linked-to-convicted-fraudster.html", "state_media": false, "category": "社会", "full_text": "The Federal High Court in Lagos has ordered the final forfeiture of two luxury Mercedes-Benz vehicles, four electronic devices and other properties linked to a convicted internet fraudster, Ifeanyi Arinze.\nJudge Yellim Bogoro made the order on Monday after considering an application by the Economic and Financial Crimes Commission (EFCC).\n“The vehicles include a white Mercedes-Benz GLE 53 AMG and a grey Mercedes-Benz GLC 300 AMG, while the electronic devices comprise an orange iPhone 17 Pro Max, a silver Samsung Fold 7, a blue iPhone 13 and a silver iPad,” according to a statement issued on Tuesday by the EFCC Head of Media and Publicity, Dele Oyewale.\nAccording to the statement, the court had earlier granted an interim forfeiture order on 17 July. It directed the EFCC to publish the order in a national newspaper.\nThe publication was intended to give any interested person or organisation an opportunity to explain why the properties should not be permanently forfeited.\nWhen the commission’s lawyer, C. C. Okezie, moved the application for final forfeiture on Monday, she told the court that the EFCC had complied with the directive.\nShe ordered the commission to publish the interim forfeiture order in The Guardian newspaper on 16 September 2026.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMs Okezie also informed the court that no interested person or organisation had come forward to challenge the forfeiture.\nAfter considering the application and affidavit evidence, Judge Bogoro granted the application and ordered the final forfeiture of the properties to the Federal Government.\nProceeds of fraudulent activities\nThe commission alleged in the statement that the properties “were reasonably suspected to have been acquired with proceeds of unlawful activities.”\nEFCC to file the application through its lawyer, Ms Okezie.\nIn a supporting affidavit accompanying EFCC’s forfeiture application, an EFCC operative, Buluebiere Karamo, stated that the commission received intelligence alleging that Mr Arinze led a syndicate of fraudsters operating in Lagos.\nThe EFCC alleged that he used the identity “Tonya” on iMessage to contact several victims in the United States. He allegedly instructed them to create foreign financial accounts, including Zelle, Apple Pay, PayPal, Cash App and Venmo.\nThe victims were then allegedly directed to transfer funds received through those accounts to a Chinese national identified as “Chinko Applepay”.\nThe Chinese national allegedly credited Mr Arinze’s Kuda Bank account with the naira equivalent of the funds. He then transferred the money to other members of the syndicate and retained 10 per cent as commission, according to the EFCC.\nThe commission maintained that an analysis of his Kuda Bank account allegedly revealed total inflows of N2,149,495,381.42 between August 2022 and February 2026.\n“Further investigation revealed that Arinze operated 49 Gmail accounts, alongside several Facebook and Instagram accounts, which were allegedly used for his fraudulent activities.” the EFCC wrote.\nit said arrested Mr Arinze on 20 April 2024 during a sting operation on Remi Olowude Street, Lekki, Lagos. Several other individuals were also arrested.\nHe was subsequently charged before the Federal High Court on two counts of computer-related fraud.\nThe EFCC said he pleaded guilty and was convicted on 5 June 2024 by Judge Aneke. The judge ordered him to be of good behaviour and desist from further involvement in cyber-related offences.\nHowever, the commission alleged that he breached the terms of the judgement by continuing to engage in money laundering and computer-related fraud after his conviction and payment of the option of a fine.\nThe EFCC said it later received fresh intelligence indicating that Mr Arinze had continued his alleged fraudulent activities. This prompted another investigation.\nREAD ALSO: EFCC recovers $3m, N1.3bn unremitted revenues from two firms, hands over funds to RMAFC\nDuring the investigation, the commission said it traced the properties listed in the forfeiture application to proceeds of fraudulent activities committed after his earlier conviction.\nAsset forfeiture\nNigeria’s Proceeds of Crime (Recovery and Management) Act 2022 provides for the recovery and forfeiture of assets reasonably suspected to have come from unlawful activities. The law allows courts to order forfeiture through civil proceedings, separately from criminal prosecutions. This means that an asset can be forfeited even without a criminal conviction against its owner.\nThe Act provides for a two-stage process. A court first issues an order to preserve the property while interested persons are notified and given an opportunity to challenge the forfeiture.\nThe court may then grant a final forfeiture order if the evidence establishes, on a balance of probabilities, that the property is linked to unlawful act", "translation_ja": "", "vocab": []}, {"title_ja": "APC指導者にTinubu大統領の集会への随行を控えるよう勧告 - Uzor Kalu上院議員", "title_en": "Stop following Tinubu to rallies, Uzor Kalu tells APC leaders", "summary_ja": "アビア北部選出のOrji Uzor Kalu上院議員は、2027年総選挙に向けてAPC指導者がTinubu大統領のキャンペーン集会への随行を控え、むしろ各自の選挙区での草の根動員に注力すべきだと勧告しました。同氏は、党指導者が自らの政治的拠点で支持者動員に集中し、選挙区から地方政府レベルまでの党組織を強化することの重要性を強調しています。この提言は、APC大統領キャンペーン委員会が最近、大臣や政治任命者に各自の出身州での集会のみに参加するよう指示したことに続くものです。", "summary_en": "Mr Kalu’s comments reinforce the campaign council’s recent directive restricting political appointees and campaign officials to rallies in their home states as the APC begins preparations for the 2027 general elections. The post Stop following Tinubu to rallies, Uzor Kalu tells APC leaders appeared ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-east/924306-stop-following-tinubu-to-rallies-uzor-kalu-tells-apc-leaders.html", "state_media": false, "category": "政治", "full_text": "Abia North Senator Orji Uzor Kalu has advised All Progressives Congress (APC) leaders to prioritise grassroots mobilisation ahead of the 2027 general elections instead of accompanying President Bola Tinubu to campaign rallies across the country.\nMr Kalu, a former governor of Abia State, said party leaders should remain in their respective political constituencies to engage voters, strengthen party structures and build support at the ward and local government levels.\nThe senator, who coordinates parliamentary mobilisation for the South-east, made the recommendation in a statement titled, “The APC Presidential Campaign Council and the Need for a Leaner Campaign Train,” Vanguard newspaper reported on Monday.\nHe argued that the president should be accompanied by a smaller campaign entourage, while other influential party members concentrate on mobilising support in their political strongholds.\nAPC adopts grassroots mobilisation strategy\nMr Kalu’s position comes days after the APC Presidential Campaign Council directed ministers, political appointees and members of its campaign council to attend only rallies organised in their respective home states.\nPREMIUM TIMES reported that the council issued the directive in a circular dated 3 November and signed by its Director-General, Abdulaziz Yari.\nThe directive was addressed to directors and heads of directorates within the campaign council and was intended to improve coordination and strengthen grassroots mobilisation ahead of the elections.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe council also adopted a pyramid-style mobilisation strategy that emphasises building political support from polling units through wards and local government areas to the state level.\nUnder the arrangement, party officials are expected to mobilise voters within their respective jurisdictions rather than concentrate their activities around the president during campaign events.\nKalu cites political mobilisation in Abia\nCiting his political activities in Abia, Mr Kalu said effective mobilisation must begin at the ward level, where party leaders have direct access to voters.\nHe recalled leading more than 4,000 APC members from Igbere Wards A and B in Bende Local Government Area during the party’s presidential primary in May.\nAccording to him, the experience showed the importance of building political structures and consolidating grassroots support.\nMr Kalu maintained that the party’s chances in the 2027 elections would depend largely on its ability to sustain direct engagement with voters across communities.\nHe stressed that a campaign’s effectiveness should not be measured by the number of political leaders accompanying the president to rallies, but by the strength of the party’s structures and its connection with voters at the grassroots.\nMr Kalu’s comments reinforce the campaign council’s recent directive restricting political appointees and campaign officials to rallies in their home states as the APC begins preparations for the 2027 general elections.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "米兵がロシアのスパイ容疑で英国で逮捕", "title_en": "US Soldier Is Arrested in UK on Suspicion of Spying for Russia", "summary_ja": "英国で米兵の41歳男性がロシアのためにスパイをしていた容疑で逮捕されました。男性の身元は明かされていませんが、FBI及び米軍情報機関との合同捜査により、起訴される可能性のある状態で身柄を拘束されています。", "summary_en": "The 41-year-old man, who was not named, was in custody pending possible charges after a joint investigation with the F.B.I. and U.S. military intelligence.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/10/world/europe/uk-us-army-arrest-espionage-russia.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、ベネズエラの石油から120億ドルを受け取ったと報告書が示す", "title_en": "U.S. Received $12 Billion From Venezuela’s Oil, Report Shows", "summary_ja": "米国が管理する銀行口座の運用により、ベネズエラの大統領を拘束した後、ワシントンがいかにしてベネズエラの石油収益を管理しているかが明らかになった。この報告書は、米国がベネズエラの資産をどのように活用しているかについての詳細な見解を提供している。", "summary_ ink": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9NTlpkYV9jLXMxdWFuUE9nNmpEWWZ1ZDBCNVRsaGNIbjBKZ3dlUUQ4Uk9sY0JzYTQ4TUlZQkJNeEl3OHpCRklLRTF2NzBfdHpycS11Q2xB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の人口が34ヶ月連続で減少", "title_en": "Taiwan population falls for 34th consecutive month - Focus Taiwan", "summary_ja": "台湾の人口が34ヶ月連続で減少している。低い出生率と高い海外移住率が主な要因となっている。この人口減少トレンドは台湾の経済と社会保障制度に長期的な課題をもたらしている。", "summary_en": "Taiwan population falls for 34th consecutive month Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9hNWd1R0JSZHhtN29tdmlZbnZ2SzdOczUwLXVVR2dVR1AyRkRHUTVaTThSblMxUEgtaGl5bDQxVlg2QXh3RVRHXzVRTmhRQ19NQ20zb0x3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、リトアニアの代表処改名しない＝外交部次官", "title_en": "Taiwan will not rename representative office in Lithuania: Deputy FM - Focus Taiwan", "summary_ja": "台湾の外交部次官は、リトアニアに設置されている代表処の名称を変更しないという立場を明らかにした。これは両国関係における台湾の一貫した政策対応を示すものである。", "summary_en": "Taiwan will not rename representative office in Lithuania: Deputy FM Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBCOHQ5U1ZXY1FEOXV6ZF9WTWxjSmowZEYyOWMxa3FlN2VYR3pjc0gxQl9ITE4xNWxUVHZoak42ZjItbFpUczVQQnlOcVRDbFd0d2QtY2hjUQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "第4回持続可能鉱物サプライチェーン会議が長期成長に焦点", "title_en": "4th Sustainable Mineral Supply Chain Conference eyes long-term growth", "summary_ja": "CGTNは、第4回持続可能鉱物サプライチェーン会議が長期的な成長を目指していると報じています。本会議では、鉱物供給チェーンの持続可能性と発展について議論されるとみられています。業界関係者が一堂に集まり、鉱物資源の責任ある利用と供給チェーンの最適化について協議することが予想されます。", "summary_en": "4th Sustainable Mineral Supply Chain Conference eyes long-term growth", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-07/4th-Sustainable-Mineral-Supply-Chain-Conference-eyes-long-term-growth-1RRhZaKCVAQ/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国外交部、エヌビディアCEO関連の「中国スパイ」疑惑を否定", "title_en": "Beijing dismisses 'Chinese spy' claims over Nvidia CEO as smears", "summary_ja": "CGTNが報道したところによると、中国外交部は月曜日、エヌビディアのCEOに関連する「中国スパイ」疑惑について、一部メディアが流布している主張を拒否した。中国政府はこれらの報道を中傷行為と位置付けている。", "summary_en": "The Chinese Foreign Ministry on Monday rejected recent reports by some media outlets peddling \"Chinese spy\" allegations tied to the Nvidia CEO saga.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-09/Beijing-dismisses-Chinese-spy-claims-over-Nvidia-saga-as-smears-1RVNrUyd0VW/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "資源から製造業へ：アジア太平洋地域の新しい成長モデル", "title_en": "From resources to manufacturing: A new model of Asia-Pacific growth", "summary_ja": "CGTNが報じたところによると、アジア太平洋地域は従来の資源依存型経済から製造業中心へのシフトを進めており、新しい成長モデルの構築が進行中です。この転換により、地域全体の経済構造が大きく変わろうとしています。アジア太平洋諸国は産業の多角化と高度化を通じて、持続可能な経済成長を目指しているとCGTNは伝えています。", "summary_en": "From resources to manufacturing: A new model of Asia-Pacific growth", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-08/From-resources-to-manufacturing-A-new-model-of-Asia-Pacific-growth-1RSS9hhd94s/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "キエフ支持国がナチス賛美決議に反対票を投じた—外交官", "title_en": "Countries that support Kiev voted against Nazi glorification resolution — diplomat", "summary_ja": "TASS/RTによると、ナチス賛美に反対する国連決議に対して53カ国が反対票を投じたと報じられています。この決議は117カ国の賛成票を獲得しました。ロシア外交筋は、ウクライナを支持する国々がこの決議に反対したと主張しています。", "summary_en": "A total of 53 countries voted against the resolution, while the document received 117 votes in favor", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2215801", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ軍による攻撃でドネツク人民共和国の民間人3人（10代を含む）が負傷", "title_en": "Three civilians, including teenager, wounded in Ukrainian attacks on DPR in past day", "summary_ja": "TASS/RTが報道するところによると、過去24時間にウクライナ武装勢力によるドネツク人民共和国への砲撃攻撃が合計31件登録されたという。報道では、民間人3人が負傷したと伝えている。", "summary_en": "A total of 31 shelling attacks by Ukrainian armed groups were registered", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2215799", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "NATO偵察ドローンが黒海上空で基地との通信を喪失、今年4度目", "title_en": "NATO reconnaissance drone loses contact with base over Black Sea, fourth time this year", "summary_ja": "TASS/RTは、NATOの偵察ドローンが黒海上空で基地との通信を失ったと報じています。同メディアによれば、これは今年4度目の同様の事案だとのことです。通信障害の原因については現在のところ不明とされています。", "summary_en": "The possible cause of the communication failure is unclear", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2215797", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ブラジルとアメリカから学ぶべき正しい教訓", "title_en": "The Right Lessons From Brazil and the US", "summary_ja": "本論説は、ブラジルとアメリカの最近の選挙結果は、進歩派勢力への委任とは見なせないと主張している。民主党もルーラ大統領の労働者党も、有権者を興奮させるようなビジョンを提示していない。両国の選挙結果は極右の敗北という良いニュースだが、これが進歩的な政策実行への明確な支持を意味するわけではないという警告である。", "summary_en": "One lesson progressives in both countries cannot afford to ignore is that recent election results do not amount to a mandate. Neither the Democrats in the US nor President Luiz Inácio Lula da Silva’s Workers' Party in Brazil are offering a vision voters can get excited about.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/right-lessons-from-brazil-and-us-elections-by-andres-velasco-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Right Lessons From Brazil and the US\nOne lesson progressives in both countries cannot afford to ignore is that recent election results do not amount to a mandate. Neither the Democrats in the US nor President Luiz Inácio Lula da Silva’s Workers' Party in Brazil are offering a vision voters can get excited about.\nLONDON—President Luiz Inácio Lula da Silva defeated the far right’s now-fugitive Flávio Bolsonaro in Brazil’s recent presidential election. In the United States, President Donald Trump’s MAGA minions took a drubbing in the midterm elections. Both results are good news from two very big countries. Democrats everywhere can sleep a little better.", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパ規模のロシアの賄賂", "title_en": "A Russian Bribe the Size of Europe", "summary_ja": "著者は、トランプ米大統領がロシアとの石油・ガス取引と引き換えにウクライナを犠牲にしようとしていると主張しています。しかし、プーチン大統領はビジネスパートナーを裏切った長い歴史があり、トランプから欲しいものを得た後、ヨーロッパが次の標的になると警告しています。この取引はロシアのウクライナ孤立化戦略を進め、ヨーロッパでの国防支持を損なわせるものだと述べています。", "summary_en": "US President Donald Trump is willing to sacrifice Ukraine in exchange for lucrative oil and gas deals with Russia, but this bargain is bound to backfire spectacularly. Vladimir Putin has a long record of betraying his business partners, and once he gets what he wants from Trump, Europe will be his n", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trump-falling-for-putin-oldest-trick-spells-disaster-for-europe-by-andrew-kosenko-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nA Russian Bribe the Size of Europe\nUS President Donald Trump is willing to sacrifice Ukraine in exchange for lucrative oil and gas deals with Russia, but this bargain is bound to backfire spectacularly. Vladimir Putin has a long record of betraying his business partners, and once he gets what he wants from Trump, Europe will be his next target.\nNEW YORK—US President Donald Trump and his cronies are eager to normalize relations with Russia in exchange for lucrative oil deals. In doing so, they are advancing Russian President Vladimir Putin’s strategy of systematically isolating Ukraine by making its defense so costly that popular support for the country in Europe evaporates.", "translation_ja": "", "vocab": []}, {"title_ja": "アンスロピックのIPOはAI規制の改善につながるか？", "title_en": "Will Anthropic’s IPO Lead to Better AI Regulation?", "summary_ja": "フロンティアAI企業が上場すると、一般投資家の資産が企業の株価に直結するようになる。過度な規制は企業成長を阻害する可能性がある一方、不十分な安全対策による大惨事は同様に株主価値を破壊する可能性があり、この緊張関係がAI規制のあり方に影響を与える可能性がある。", "summary_en": "When frontier AI labs go public, ordinary people’s investments and pensions become tied to their valuations and stock prices. While excessive regulation could undermine a firm’s growth, catastrophic accidents caused by inadequate safety measures could do the same—and wipe out shareholder value.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/investors-in-anthropic-ipo-will-have-financial-incentive-to-demand-ai-safety-regulation-by-angela-huyue-zhang-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWill Anthropic’s IPO Lead to Better AI Regulation?\nWhen frontier AI labs go public, ordinary people’s investments and pensions become tied to their valuations and stock prices. While excessive regulation could undermine a firm’s growth, catastrophic accidents caused by inadequate safety measures could do the same—and wipe out shareholder value.\nLOS ANGELES—Imagine being presented with an opportunity to invest in a Silicon Valley technology company with dazzling performance, including revenue that has increased roughly 14-fold over the past year, a valuation that has more than quintupled in nine months, and rapidly increasing productivity. Sounds great, right?", "translation_ja": "", "vocab": []}, {"title_ja": "マネージャー解任は支配力の幻想を維持するためであることが多い", "title_en": "Firing a manager is often more about maintaining the illusion of control", "summary_ja": "本論説では、サッカークラブがマネージャーを解任する際の判断が科学的根拠に欠け、むしろ「雰囲気」と結果、代替案の有無といった曖昧な要因に基づいていることを批判しています。マンチェスター・ユナイテッドのマイケル・カリックの事例を挙げ、昨季は称賛されていた同じスキルセットが今季は不十分と見なされるなど、一貫性に欠ける判断が行われていることを指摘しています。著者は、マネージャー解任がクラブの構造的問題から目をそらし、支配力があるという幻想を保つためのものであると論じています。", "summary_en": "In an era of advanced analytics, deciding when to move on from a manager still seems to come down to vibes rather than logic He just had to go. His position had become untenable. Leander Schaerlaeckens is the author of The Long Game: U.S. Men’s Soccer and Its Savage, Four-Decade Journey to the Top, ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/football/2026/nov/10/michael-carrick-firing-managers-premier-league", "state_media": false, "category": "オピニオン", "full_text": "He just had to go.\nHis position had become untenable.\nHe’d run out of time, out of credit, out of chances.\nThis time of year, we live in permanent peril of hearing some version of the above proclaimed with unshakable confidence. Some soccer manager has been fired and it is universally agreed that it had to be done, that there was no alternative, that the club’s hands were tied by circumstance.\nIt’s all a bit weird, this broadly accepted yet totally unscientific formula for when a manager must – MUST – lose his job. It’s a sort of alchemy of vibes, and results, and the absence of other scapegoats, and the alternatives available. It’s like that old definition of hardcore pornography by a US supreme court justice: I know it when I see it.\nShall we talk about Michael Carrick now? Yes, here is where we are obliged to debate the beleaguered Manchester United manager, who has been at the helm during the Red Devils’ first dip into the relegation zone since 1986 yet somehow is also definitely not at fault. There is almost total agreement on the latter point, that United’s issues are structural and systemic and absolve Carrick of blame. Still, he’s gotta go, because what can you do, eh?\nBy the time you read this, he may be gone, or about to be gone, or still floating around in the liminal vapors of being emotionally, but not yet physically, gone.\nHe was caretaker manager and did such a good job at that free-hit, can’t-lose gig – five stars! Clean and comfortable ride! – that he was rewarded with the exact same but altogether more difficult job of being the permanent Manchester United manager.\nBut the discourse has shifted against Carrick. Suddenly, the exact same skillset that helped him rescue United last season, making him a poster child of club DNA and its virtues, is viewed as deficient.\nNow they say Carrick is outsmarted by the other managers, overwhelmed by the volume of games. Perhaps. But his tactical mind was up to it last year. With fewer games to worry about, certainly, but also burdened with Ruben Amorim’s debris to clear away first. Amorim, of course, was the predecessor who Simply Had To Go, because he was dogmatic and would need too much time to instill his methods, after he was hired because the club must have quite liked that he was dogmatic, even though he would need considerable time to instill his methods.\nYet hanging on to a manager often works out. There’s the famous case of Sir Alex Ferguson, of course, who was installed during United’s last flirtation with relegation, 40 years ago. The early years of his reign were not always smooth: he had a poor season in 1988-89 and was reportedly a few bad results from being sacked in January 1990. But he wasn’t, and nine years later, he was knighted for his accomplishments in management and, by extension, in not being fired.\nIt’s true of Mikel Arteta, too, who has teetered several times in charge of Arsenal. When the now-defending champions started the 2021-22 season without winning or scoring in three matches, including a 5-0 humiliation by Manchester City. And in late 2024. And as recently as this spring, when some felt that if Arteta didn’t deliver the title at last, he ought to be replaced. Six months on, that seems unthinkable.\nThere’s a graphic doing the rounds on social media showing that Carrick has actually done slightly better than Arteta in his first 27 league matches in charge, although this elides the very obviously opposite trajectories they were on. All the same, Arteta got to keep going; Carrick probably won’t. Few managers these days are allowed to grow on the job, or into it. The very things Ferguson once credited for his longevity – the leeway to evolve and develop and learn from his mistakes, to rebuild and retool – are denied to the managers supposed to succeed him. Because of … reasons? The money was different back then, but the pressure wasn’t.\nInstead, that predictable thing has happened where Carrick has morphed from the in-fashion manager to the one who is gently mocked. He’s no longer said to look calm and possessed of the desperately needed poise at a tumultuous club. Now, he is described as glum. It seemed an ominous portent that he should add himself to the ultra-niche lore of English managers misusing umbrellas when he promised to hold the umbrella so that he would get wet and keep everyone else at the club dry, possibly owing to an unfamiliarity with the rudiments of the technology.\nCarrick isn’t alone in managerial purgatory.\nCrystal Palace’s Pierre Sage: sacked but somehow not yet sacked.\nRégis Le Bris: safe for now, in spite of taking newly promoted Sunderland to an astounding seventh place last season.\nNewcastle’s Matthias Jaissle: medium rare, but not yet cooked.\nManchester City’s Enzo Maresca: definitely no longer the perfect successor to Pep Guardiola he was just a few weeks ago.\nFulham’s Álvaro Arbeloa and Bournemouth’s Marco Rose and Tottenham’s Roberto De Zerbi are fine now, after starting the season very not fine", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ時代の無法行為は起訴されるべき。我々の新しいグループは免責特権を終わらせるために活動している", "title_en": "Trump-era lawlessness must be prosecuted. Our new group is working to end the impunity | Kenneth Roth", "summary_ja": "著者ケネス・ロスは、トランプ大統領が司法省を政治化し、同盟者の犯罪を起訴せず、政敵を追及することで法の支配を損なったと主張している。米国の制度では大統領が司法長官を支配できるため、民主的選挙だけでは不十分であり、独立した検察制度が必要だと述べている。著者が創設メンバーである「法の支配プロジェクト」は、この免責特権を終わらせることを目指している。", "summary_en": "Congressional investigations are only part of the solution. A civic project will do needed legal legwork The Democrats’ midterm victory was resounding, but it will not be enough to re-establish the rule of law in the United States. The basic principle that even the president and his officials and cr", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/10/trump-lawlessness-impunity", "state_media": false, "category": "オピニオン", "full_text": "The Democrats’ midterm victory was resounding, but it will not be enough to re-establish the rule of law in the United States.\nThe basic principle that even the president and his officials and cronies are subject to the law has been profoundly undermined by Donald Trump through unchecked ICE violence, apparently large-scale official corruption, and frequent defiance of the law.\nDemocratic-run congressional committees can investigate and expose lawlessness but cannot prosecute the criminality they uncover. More is needed.\nMany people equate democracy with elections, but they are not enough. A president can be elected, his policies can be publicized by the media and debated by the public, his legislative proposals can require the assent of a majority of lawmakers, but if the president holds himself above the law, a nation ceases to be a democracy. That is what has been at stake in Trump’s second term.\nThe American system delegates many of the responsibilities for upholding the rule of law to an independent judiciary. If a president violates our rights, we can file a civil suit in court and hope a judge orders the president to stop.\nBut if the president or his allies engage in criminality, the American system has a built-in weakness. Some countries empower prosecutors to be independent, akin to a judge. But in the United States, the prosecutor for any federal crime is an employee of the Department of Justice. It is headed by the attorney general, who is nominated by and serves at the pleasure of the president.\nIn other words, the president can decide which criminal conduct in his administration will be prosecuted – and which will not.\nBecause the president’s ability to control the Department of Justice could put him and his friends above the law, presidents traditionally have exercised that power with restraint. While setting broad priorities, most presidents deferred to the judgment of their attorney general. But not Trump.\nTrump has weaponized his justice department, pursuing his perceived political enemies while neglecting crimes by his allies, who have often enjoyed effective impunity. They have little to fear from Trump’s politicized prosecutors.\nThe result has been increasingly brazen behavior – seemingly corrupt deals that few past officials would have dared to make, and arbitrary violence by ICE and others that is excused rather than investigated.\nThe Rule of Law Project, a new civic group of which I am a founding board member, seeks to end that impunity. We are hiring former federal prosecutors and FBI agents to investigate allegations of corruption and abuse by government officials and their accomplices that the current justice department is ignoring.\nWe have attracted an extraordinary set of past public servants. Many have served in the justice department, which has been decimated in the second Trump administration. We don’t know their political views and haven’t asked. What we know is that they are eager to continue their work in a different capacity.\nThe Rule of Law Project operates from the premise that criminal cases are more likely to be pursued if a prosecutor can be handed a case file that is largely ready for action. We will do the legwork of interviewing witnesses, collecting documents, and analyzing the results, with the aim of putting cases together while the evidence is fresh.\nWe won’t have subpoena power, wiretaps, or a grand jury, but many cases can be built with witnesses who voluntarily cooperate. Indeed, in the most sensitive cases, cooperating witnesses are essential.\nUntil we have a president and attorney general who believe in the rule of law, we plan to present these ready-made cases to state and local prosecutors, who are not subject to federal control. Many would like to uphold the law but lack the investigative resources to take on these cases on their own.\nI have seen the power of such investigations in my global work. For the mass atrocities under Syria’s former president Bashar al-Assad, for example, the international criminal court did not have jurisdiction, and Syrian prosecutors took instructions from the dictator.\nThe only option was national courts around the world exercising what is known as universal jurisdiction. But a typical prosecutor there would have no clue about how to prosecute torture, executions, or forced disappearances in Syria, let alone the resources to advance such a case.\nThat’s why, with the encouragement of Human Rights Watch, the UN general assembly established the International, Impartial and Independent Mechanism (IIIM) for Syria. A similar mechanism has been established to address atrocities by the military junta in Myanmar.\nThe IIIM, based in Geneva, is essentially a prosecutorial team without a court. They have no capacity to bring prosecutions, but they prepare them. That way, when an abusive Syrian official shows up in a national jurisdiction, local prosecutors have a place to turn for the evidence they need.\nThat happened in the German cit", "translation_ja": "", "vocab": []}, {"title_ja": "次の米国議会は「多数派対金銭」の枠組みで対峙すべき", "title_en": "‘The many v the money’ should frame the next US Congress", "summary_ja": "テキサス州の知事当選者ジーナ・ヒノホーサが、イーロン・マスクのSpaceXによる州立公園の買収計画を凍結した事例を通じて、ナオミ・クラインは米国政治における新たな戦線を示唆している。著者は、富の集中に対抗する「多数派対金銭」という垂直的な闘争の枠組みが、今後の政治を形作るべきだと主張している。これは民主主義そのものを脅かす寡頭資本主義的な力に対する市民の抵抗を象徴しているという論点である。", "summary_en": "If Democrats want to keep the blue wave going into 2028, they have to take on the billionaire class Welcome back to How We Win , a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Judd Legum shined a spotlight on the role of dark money in ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/10/democrats-congress-elections-billionaires", "state_media": false, "category": "オピニオン", "full_text": "Welcome back to How We Win, a Guardian opinion series with leading thinkers, offering bold ideas for America’s political future. Last week, Judd Legum shined a spotlight on the role of dark money in US elections. Today’s edition was written by Naomi Klein, Guardian US columnist and author of End Times Fascism: And the Fight for the Living World, co-written with Astra Taylor.\nTo see the battle lines of the post-midterm era in sharp relief, look to Texas.\nJust two days after her earthquake victory as the governor-elect, Gina informed reporters that she had already asked the parks and wildlife department to freeze a proposal to sell 1,300 acres (525 hectares) in a state park to SpaceX until she is sworn into her new office. The department complied with her request.\nThe Boca Chica state park is next door to Starbase, Elon Musk’s rocket launch facility and company town. That makes the park’s beaches and protected lands – a refuge for shore birds and sea turtles – the ideal location for SpaceX to expand.\n“These are our beaches we’re talking about. I mean, selling our beach to Elon Musk is just something that is almost unimaginable,” Hinojosa told CNN’s Jake Tapper. “It’s unacceptable. Our beaches are enshrined in our Texas constitution as being free and open to the people of Texas.”\nThis was not about shutting down “Elon Musk and his companies”, she went on, “but it has to be on our terms. It cannot be just running over the people of Texas. And that’s what changes now that I will be governor.”\nWhen Hinojosa’s clips circulated on X, she was roundly mocked by Musk’s many fans: imagine valuing some “empty beaches” more than the need for ocean-front launchpads to the stars! Imagine caring more about some lowly birds than Musk’s hulking, phallic, silver rockets! She must be a [insert vomitorium of misogynistic, racist and ableist slurs here]. Musk, his boys and bots predicted, will just pick up his expensive toys and move them to still-Republican Louisiana or Florida, leaving economic carnage in his wake.\nSo far, Hinojosa seems unmoved. In Texas, she and Senator-elect James Talarico shaped their campaigns as battles of the many v the money, a vertical struggle pitting the vast majority of Texans, struggling to get by, against the increasingly concentrated wealth at the top – perfectly embodied by the man flooding their democracy with cash. As Talarico reminded an audience of supporters in Austin last month: “Elon Musk wants our land. He wants our water. He wants our tax dollars. He wants his very own personal United States senator.”\nThe richest man in the world didn’t get his senator, or his governor, as the early clash over Boca Chica state park makes clear. What he did get – or rather, help produce – is an America polarized around a new political axis. On one side are ultrarich tech oligarchs, whose wealth is tethered to dreams of merging with machines and becoming multiplanetary, no matter the cost to our multispecies planet. On the other side are regular people, with human needs for things such as clean air, fresh water and healthcare – maybe even a day off at a public park – and who increasingly find themselves competing over these basics with sprawling datacentres and rocket launchers.\nThe oligarchs in this battle have no loyalty to the nations, states and cities that helped them grow their enormous wealth, thus the threats that Musk will soon ditch Texas if its newly elected representatives dare to keep their promises to voters (just as he dumped California and Canada before that). If all else fails, maybe he will join his friend Peter Thiel in Argentina, which Javier Milei is rapidly turning into techno-libertarian laboratory (Interestingly, Tesla just launched an Argentine division.)\n The oligarchs in this battle seem to have no loyalty to the nations, states and cities that helped them grow their enormous wealth.\nIn sharp contrast, the masses of people in this battle, regardless of their political leanings, tend to be attached to where they live – to its cities, towns, public lands and to the only planet that we know of suited to human life. This is as true in Texas as it is in Tirana, Albania, where, under the banner of the “flamingo revolution” citizens have been in revolt for months against a different set of oligarchs who laid claim to a different beloved wildlife refuge for their private benefit.\nIn our book End Times Fascism, Astra Taylor and I characterize these as fights between “the leavers v the stayers” – and we make the case that they increasingly define our age. You can see these fault lines running through a great many of the hot-button issues that animated and energized this election cycle. There were the many ballot measures to tax the super-rich to pay for basic services, and entirely predictable tantrums from billionaires who threatened to pick and leave rather than pay up. There was the muscular, national backlash against artificial intelligence and datacenters, which focused on the ways t", "translation_ja": "", "vocab": []}, {"title_ja": "中国のAI外交が奏功している", "title_en": "China’s AI Diplomacy Is Working", "summary_ja": "本論説は、米国と中国がAI分野で同時に協力と競争を行うことの難しさを論じている。中国は国際的なAI安全討議を利用して米国の輸出規制を批判し、発展途上国に対して中国主導のAIエコシステムを「より良い選択肢」として提示することで、外交的優位を獲得している。著者は、米国がこの戦略的競争に打ち勝つには、対話を競争の一部として位置づけ、中国に対する圧力を強化しつつ、発展途上国により説得力のあるAI統治ビジョンを提示すべきだと主張している。", "summary_en": "America should be taking notes.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/chinas-ai-diplomacy-working", "state_media": false, "category": "オピニオン", "full_text": "Can the United States and China simultaneously cooperate and compete on AI? That is the question driving debates in Washington about the wisdom of pursuing talks on the subject with Beijing. The Biden administration paired sweeping technology restrictions with a narrow dialogue on risk, and the Trump administration has kept a channel open even as it has downplayed safety. Some experts go further. They hope that cooperation on safety can be siloed off from competition entirely, a belief as appealing as it is fanciful. Any dialogue on AI risk takes place within the broader strategic competition between the United States and China.\nBeijing has long appreciated this dynamic. Much of Washington has not. Whereas the United States has shifted its approach to AI competition and safety across and within presidential administrations, Beijing has kept its AI diplomacy focused on gaining competitive advantage over the United States. China has taken part in international AI safety discussions, but it has used them, along with talks with the United States, to paint U.S. export controls as the main obstacle to cooperation. It has cast itself as the champion of the developing world, promising a Chinese-led AI ecosystem without technological or financial barriers as an alternative to a restrictive U.S.-led AI order. The pitch is working. A growing number of states are embracing China’s message, and Chinese open-weight models are gaining users across the developing world.\nIf the United States wants to maintain its lead and make meaningful progress on safety, it needs to treat the dialogue as part of the competition with China. To do so, it must ramp up pressure on China outside the talks and offer countries still choosing sides a more compelling vision for AI adoption and governance. And when U.S. and Chinese officials next meet, in November, Washington should test Beijing’s seriousness about safety. In short, the United States should approach AI diplomacy with the same strategic clarity China has.\nCHIPPING AWAY\nThe Biden administration’s first round of advanced semiconductor export controls in October 2022 and the release of ChatGPT a month later signaled that the United States had taken an early lead in the AI competition and would act to weaken China’s AI industry. Washington and its allies also seized the diplomatic initiative, taking the first steps toward global AI governance. In May 2023, the G-7 began intense discussions on AI governance that would eventually produce a code of conduct for developers. Weeks later, the United Kingdom announced it would host the first global AI safety summit at Bletchley Park.\nChina responded by rolling out a diplomatic script it has been honing ever since. Its core tenets first appeared in the Global AI Governance Initiative, published in October 2023. It called for countries to “put equal emphasis on development and security” (though it left security to be defined by individual states) and contrasted China’s focus on cooperation and development with U.S. export controls, attacking Washington for “creating barriers and disrupting the global AI supply chain through technological monopolies and unilateral coercive measures.” Despite Beijing’s growing body of AI regulations at home, the initiative offered little more than slogans on the technology’s risks.\nThat basic formula—cooperation and development, set against U.S. restrictions, with little to say about risk—has guided China’s AI diplomacy for the last three years. In March 2024, the UN General Assembly adopted a U.S.-led resolution on safe, secure, and trustworthy AI intended to appeal to both developed and developing countries. China supported the resolution, then introduced another resolution centered on help for poorer countries and “emphasizing that member states should enjoy equal opportunities” to develop and use AI. At a UN Security Council meeting on AI chaired by the United States in December that year, China’s UN ambassador, Fu Cong, once again counterposed Beijing’s stated interest in cooperation against “discriminatory barriers based on ideological differences.” In thinly veiled terms, Fu was charging that U.S. restrictions on China harmed the developing world.\n Much of the allure of China’s pitch rests on how the country’s developers share their technology.\nTo win the support of these countries as they built out their AI infrastructure, China needed a bloc of its own. In July 2025, Premier Li Qiang proposed the World Artificial Intelligence Cooperation Organization (WAICO), which promised developing countries technology, training, and a greater say in writing global AI rules. In a speech marking its launch a year later, Chinese leader Xi Jinping called for “openness,” shorthand for access to U.S. chips and the adoption of Chinese open-weight models. After urging countries to take the risks of AI seriously, Xi added that they should, “in the meantime,” jointly oppose “overstretching the national security concept in the f", "translation_ja": "", "vocab": []}, {"title_ja": "子どもは贅沢品へ", "title_en": "The Luxury of Children", "summary_ja": "世界の出生率が初めて人口置換水準を下回り、2055年頃に世界人口がピークを迎えて減少に転じると予想される。かつての仮説とは逆に、富裕層や先進国の方が貧困層や途上国よりも出生率が高くなるという傾向が見られている。現代社会の構造では子育てが経済的必需品から贅沢品へと変わり、経済格差と人口格差が一致することで、国内外の不平等が拡大する危険性がある。", "summary_en": "Why the baby bust is making the world more unequal.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/luxury-children", "state_media": false, "category": "オピニオン", "full_text": "The world’s fertility crisis is more severe than is commonly understood. Last year, humanity’s total fertility level dropped below what demographers call the replacement rate—that is, the average number of children that a woman must have to keep a population constant over the long run. This has never happened before. There have been periods when the human population declined because of wars or epidemics, such as the Black Death, in the fourteenth century, or the diseases brought by Europeans to the Americas in the fifteenth and sixteenth centuries. But now, simply as a function of their choices, humans will see the world population peak around 2055 and then begin to fall.\nThe story of the coming decades is not simply one of dwindling and aging. There is a great deal of variation in the baby bust. The most surprising trend may be one that has overturned basic assumptions about fertility rates. Where once it was thought that people—and, by extension, countries—with higher levels of income and education would have lower fertility rates than those who were poorer and less educated, the inverse is increasingly true. Many wealthier people and countries boast higher fertility rates than many poor people and countries.\nThe inversion is revealing of why governments have had a hard time coming to grips with the fertility crash. The best explanation for why people are no longer having babies is that child-rearing at the scale necessary to maintain populations is fundamentally at odds with the structures of modern life and modern societies. Once an economic necessity, children are now an economic luxury. That portends a world in which economic inequality is accentuated by demographic inequality, with widening fissures within countries and among them. The whole world is grappling with a decline in fertility, but in many different ways. And those differences will stoke further divisions, tensions, and even conflict.\nTHE CRASH\nHumanity falling below replacement has passed largely unnoticed. The central projections in the latest release of the United Nations World Population Prospects (in 2024), known as the report’s “medium variant,” still places the world’s total fertility rate slightly above replacement in 2026 and expects the global population to peak as late as 2084. But this medium variant does not fully incorporate the recent drops in births recorded by national statistical agencies, and its projections for future fertility rest on questionable assumptions, including forecasting a strong recovery of fertility rates in countries such as China. By comparison, the report’s “low variant” (the forecast that takes a more pessimistic view of future fertility) accords nearly exactly with my own assessment, which reflects more recent national statistics and takes a less optimistic view on the possible recovery of fertility. In that reading, the world has dropped below replacement fertility levels (approximately 2.2 children per woman) and will only keep dropping.\nFertility rates are plunging so fast that they are overturning many assumptions about demography. The steepest fertility declines have occurred in unexpected countries. Consider this test. Pick the state with the highest fertility rate among the following: Argentina, Brazil, Chile, Colombia, Jamaica, Iran, Malaysia, Thailand, Tunisia, Turkey, Sri Lanka, and the United States.\nThe United States, the wealthiest of the 12, has the highest fertility rate. This holds true even when just assessing the fertility rate of mothers born in the United States (immigrant mothers have a slightly higher fertility rate than native mothers). Dozens of other middle-income countries now have fertility levels below that of the United States.\nThat trend runs against the old explanation for demographic change, which held that fertility invariably falls as a community or society gets richer. That is demonstrably no longer the case. Among the countries in the Organization for Economic Cooperation and Development (OECD), richer members tend to have higher fertility rates than do poorer ones, even after controlling for migration flows. Take Mexico. According to the most recent survey, in 2024, a Mexican woman could expect to have 1.2 children over her lifetime, well below the 1.57 average of non-Hispanic white women in the United States. Mexico’s income per capita is only about 28 percent of the U.S. level. And just two decades ago, fertility rates in Mexico were much higher than those in the United States.\nThis dynamic obtains not just among countries but also within them. Richer and more educated households in the United States and other advanced economies now tend to have more children than poorer and less educated ones, reversing a pattern that had held for centuries.\nThere is no single, simple answer for why this has happened. Most theories do not hold up against international evidence. Factors that seem to contribute to lower fertility in the United States, for instance, such as higher ", "translation_ja": "", "vocab": []}, {"title_ja": "グローバルテロの新しい中心地", "title_en": "The New Epicenter of Global Terror", "summary_ja": "著者は、9月11日から25年が経った現在、世界の関心がテロ対策から他の地政学的課題へ移行している一方で、アフリカ大陸ではテロ活動が増加し続けていると主張しています。アフリカは過去5年間のテロ関連死亡の50%以上を占め、世界で最も致命的なジハード主義グループの3つを抱えており、特にサヘル地域で記録的な増加が見られています。著者は、世界の指導者たちがこのアフリカ大陸全域に広がるテロ脅威を軽視することは危険であり、大陸の安定と発展に対する重大な課題であると警告しています。", "summary_en": "How Africa’s weak states and rare earths drive transnational extremism.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/nigeria/new-epicenter-global-terror", "state_media": false, "category": "オピニオン", "full_text": "Twenty-five years after 9/11, much of the world has moved on from the war on terrorism. Following the defeat of the Islamic State in Iraq and Syria and the U.S. withdrawal from Afghanistan in 2021, Washington has turned to other major concerns; along with many of its European allies, ihadi ideology or extremist violence.\nWorld leaders overlook this continent-wide terrorist threat at their own peril. Not only have terrorist groups become a major challenge to African stability and development; they also pose a growing danger to global security. For now, these groups may appear to have little capacity to project their power beyond Africa’s borders. Yet amid the new scramble for Africa’s mineral resources—and for influence on the continent—this may change. Global powers, especially China and Russia, have been increasing their efforts to gain economic, political, and military leverage in Africa, which has in turn undermined collective international initiatives to fight terrorism. And many African jihadi groups themselves have strong anti-Western sentiments and have been using the resource wars to help build transnational networks.\nThus far, the global response to the African threat has largely focused on military operations, especially in the Sahel. But to truly address the phenomenon, outside powers and world leaders will need to understand the underlying forces that have led to this proliferation of extremist groups. Above all, they will need to find new ways to help African countries address the erosion of state institutions and governance that has made terrorism endemic across the continent.\nNEGLECTED YOUTH\nAfrica’s entanglement with terrorist and jihadi groups is hardly new. Al-Qaeda’s 1998 attacks on U.S. embassies in Dar-es-Salaam and Nairobi were planned from Sudan, where Osama bin Laden had been based between 1991 and 1996. After 9/11, security experts viewed those attacks as a crucial precursor that should have set off alarm bells. Then, in the early years of the twenty-first century, local African groups coalesced into al-Shabab, based in Somalia, which also began to pursue transnational terrorism as an affiliate of al-Qaeda. Later, al-Qaeda in the Islamic Maghreb formed a major foothold in Mali. These developments prompted a number of let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-11 00:58 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
