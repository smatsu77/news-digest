etween Yemen's Houthis and the Saudi-backed pro-government forces fighting them.\nToday he sits, surrounded by his family, on a tarpaulin spread over a sandy floor inside a vast open-sided warehouse at Markazi camp in Obock, northern Djibouti, packed with Yemeni families who have fled by boat across the narrow Bab al-Mandab Strait.\nAfter their sea crossing, Yemeni refugees have made their way by truck and on foot to this camp, jointly administered by the government and the UN.\n\"How could I just sit there when my kids are screaming and shaking in terror?\" says Ibrahim Issa. \"When the sound of the planes start, and the kids hear the planes, they begin shouting and screaming. As parents it is our responsibility, what can you do when you see this? That is why we fled, to save them.\"\n- UK to provide Saudi Arabia with 'defensive' military support, says Burnham \n  - Published2 hours ago\n- Lightning Houthi advance in Yemen may bring dangerous new dimension to Iran war \n  - Published11 September\nAs a fisherman, Ibrahim Issa already owned a boat large enough to bring out his family from Yemen.\nHe even brought several of the family's goats which I can now see nibbling at scraps nearby, foraging amidst the discarded canisters of cooking gas and empty plastic bottles. Some families have been able to bring small bundles of possessions with them from Yemen – one family has even brought a \"jeraak\", a tall metal shisha pipe – but others have arrived, exhausted, in just the clothes they left in.\nIn just the last few days more than 3,000 refugees have arrived here from Yemen, many entire families. The UN estimates that in all, more than 120,000 Yemenis have been displaced by the sudden surge in fighting along Yemen's Red Sea coast.\nThis month, the country's Houthis, who had already seized most of the populated parts of Yemen years ago, made a lightning dash down the coast towards Bab al-Mandab, the narrow, maritime chokepoint where the southern Red Sea flows into the Gulf of Aden and the wider Indian Ocean.\nSaudi Arabia, which backs the internationally recognised government of Yemen, has responded with hundreds of air strikes along the flat, coastal plain where the Houthis are now digging in. The Houthis have also launched hundreds of drones and missiles at cities and infrastructure in south-western Saudi Arabia.\n\"We don't care which side it is that's attacking,\" is the message I got loud and clear in Arabic from everyone here I spoke to. \"It's the bombs falling all around us that have caused us to flee.\"\nDjibouti, a tiny former French colony that sits just across the water from Yemen, has made it clear it has no intention of involving itself in the war between the Houthis and the Saudi-backed Yemeni government.\nAnd yet Djibouti is one of the most militarised nations in Africa. Since 2003, the US has run a huge multinational base here, Camp Lemonnier, once home to the French Foreign Legion. China too has a major base here, its largest military presence on the Indian Ocean and recently upgraded.\nBack in Markazi camp, one of those I spoke to is Qassim Abraham Abssy. Once also a fisherman, his identity card shows him to be 100 years old.\n\"What led us to come here?\" he asks rhetorically.\n\"It was the planes. The sounds of the planes, boom! That's what made us flee, for the sake of our children. It burns ours hearts. We don't know which side they are from. They are bombing everywhere, because the Houthis are everywhere, in the mountains, in the roads. A plane comes, bombs everywhere.\"\nOutside in the blazing 37C heat, close to the neat lines of tents supplied by the UN refugee agency, UNHCR, I met Mohammed Abdullarim from Aden, a 63-year-old former tour guide old enough to have been born when Aden was still a British protectorate.\nUnlike the new arrivals, Mohammed has been here since 2015. He fled to Djibouti soon after the fighting first flared up between the Houthis and the government of the now-ousted President Abdrabbuh Mansour Hadi.\nHe has been at the camp ever since but suddenly, as we were talking, the sadness of what is happening to his country overwhelmed him and he turned his head away, choking back tears.\n\"Most of the people here are in the worst condition, inside the tents here. I am very touched, I'm crying for these people, for my people, for their suffering. I want our voices to be heard by the NGOs and the Djibouti government. And I'm thankful to them for accepting us.\"\nHow long will they have to stay here? That depends, of course, on the fighting. Yemen has been wracked by a horrific civil war that has killed tens of thousands of people and displaced millions since 2014.\nA shaky, UN-brokered 2022 truce between the Saudis and the Houthis has broken down spectacularly in recent months, with the two sides trading missiles, drones and air", "translation_ja": "", "vocab": [{"word": "escalate", "definition": "紛争や対立の程度や強度を段階的に高める、エスカレートさせることを意味する。政治的、軍事的な状況が悪化することを示す。"}, {"word": "maritime chokepoint", "definition": "海上交通の要所で、通過を制御・監視できる地理的に重要な狭い海域のこと。国際貿易や軍事戦略上の重要な位置を指す。"}, {"word": "digging in", "definition": "防御的な立場や陣地を構築・強化することを意味する。軍事的文脈では、堀や塹壕を掘って防御体制を整える意味。"}, {"word": "brokered", "definition": "第三者が仲介して合意や協定を成立させたことを意味する。外交交渉などで、仲介者が両者の間を取り持つプロセスを指す。"}, {"word": "spectacularly", "definition": "劇的に、大々的に、またはめざましく何かが起こることを表す。通常は否定的な状況や失敗を強調する際に使用される。"}, {"word": "displaced", "definition": "自分の家やコミュニティから強制的に追い出された人々を指す。戦争や自然災害により、住んでいた場所を離れざるを得ない状態。"}]}, {"title_ja": "トランプ大統領のホワイトハウス出入り禁止に対してCNNなど3社が提訴", "title_en": "CNN, Politico, MS NOW sue Trump over White House press ban", "summary_ja": "CNN、ポリティコ、MS NOWの3つの主要米メディアが、ホワイトハウスからの出入り禁止に対してトランプ政権を提訴しました。この措置は、政府による報道の自由への干渉を懸念する5つの主要テレビネットワークがホワイトハウスの共有報道体制から撤退することにつながりました。", "summary_en": "Three major US news outlets filed a lawsuit against the Trump administration after being barred from the White House, claiming the ban violates First Amendment press freedoms. The move prompted five major TV networks to suspend their pooled White House coverage, citing concerns about government interference with independent journalism.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm0e32rwvrryo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "CNN, MS NOW and Politico file lawsuit against Trump's White House ban\n- Published\nCNN, Politico and MS NOW have said they will sue the Trump administration after the three US media outlets were barred from the White House.\nPresident Donald Trump announced the ban on Friday, accusing the organisations of writing \"fiction or lies\" about his team. The companies said their reporters were denied access to the building on Saturday.\nIn a joint statement on Monday, they said they were pursuing legal action to \"defend the principle that the government does not decide what the press reports\".\nMajor US TV networks later announced they would suspend their White House pooled coverage of Trump, leaving a potential gap as he heads to New York for the United Nations General Assembly.\nTrump later reacted to news of the lawsuit, calling the news organisations \"Third Rate Clowns\" and \"Crooked and Corrupt Press\" that \"trivialise and demean\" his achievements.\n\"Fake News people and publications that only write negatively, and who violate our National Security by writing false and defamatory stories with unknown 'sources,' shouldn't be allowed access to the most important Office anywhere in the World,\" Trump wrote on his Truth Social platform.\nHe added that \"almost without question\" his team will file an appeal.\nThe First Amendment forbids the government from \"abridging\" the freedom of the press - language that courts have traditionally interpreted as preventing the government from discriminating against the media based on the content of their coverage.\nThe statement from CNN, Politico and MS NOW said: \"Without notice or process, the White House revoked our journalists' credentials because it objected to our reporting.\n\"Left unchallenged, this threatens press freedom and the public's right to independent journalism free from government interference.\"\nThe media organisations filed the lawsuit on Monday in US District Court in Washington, asking a judge to quickly rule Trump's ban unconstitutional and prevent his aides from enforcing it.\nOn Monday morning, major US TV networks pulled out of White House pool duties, which sees media organisations share material with each other to save on costs and space when broadcasting presidential events to the American public.\nFox News Washington bureau chief Bryan Boughton, who currently holds a rotating role helping to organise media TV crews covering the White House, wrote in an email seen by the BBC that \"effective today, the TV pool will not be covering designated as pool coverage\" of President Trump.\nThe message said the move followed the White House \"preventing\" CNN from fulfilling its pool duties for Trump's trip to New York and that \"there will be no replacement pool put in place\".\nCNN - one of only five US news outlets in the White House press pool for live television - was originally due to cover Trump's trip to the UN General Assembly in New York on Monday and Tuesday.\nBut on Monday morning, the five-seat CNN booth in the basement of the White House press area - typically manned throughout the day from the early hours of the morning - was empty and closed. Screens and monitors inside were turned off.\nInstead, a CNN crew was outside the secured area of the White House grounds, broadcasting live from a public pavement.\nFive TV networks, ABC, CBS, CNN, Fox News and NBC, issued a joint statement: \"The public has a vital interest in receiving accurate, independent information about its government.\n\"No administration should restrict a news organisation because it objects to its reporting.\"\nThose five networks are considered the only ones with the money and infrastructure to distribute live coverage from the White House and presidential events.\nFor now, the White House media slot has remained vacant and instead the conservative TV outlet, Real America's Voice, was listed as \"secondary\" crew on Trump's trip to New York, where he will meet Mayor Zohran Mamdani and French President Emmanuel Macron on Monday.\nAnnouncing his ban on CNN, Politico and MS NOW last week, Trump did not mention specific stories or reporting that prompted the move, but later said \"it's really just cumulative stories over the last few years\".\nThe US president added that there \"may be others to join them\".\nWhen later asked by a reporter what he meant by this, Trump responded: \"Others to come in terms of fake news? Well, you know, the New York Times is fake news, the Washington Post is fake news.\"\nIn February, the White House announced it was taking control of the press pool which has access to Trump and had for more than a century been managed by the White House Correspondents' Association.\nThe same month, the administration moved to bar Associated Press (AP) reporters and photographers from spaces where access is limited, such as the Oval Office or Air Force One, because of the outlet's usage of the term \"Gulf of Mexico\" instead of \"Gulf of America\". AP filed a lawsuit and the case remains ongoing.\nThere have been a few", "translation_ja": "", "vocab": [{"word": "abridge", "definition": "制限する、短縮する、という意味の動詞。特に法律用語として「権利や自由を制限する」という文脈で使用されます。"}, {"word": "defamatory", "definition": "名誉毀損的な、誹謗中傷的なという意味の形容詞。個人や組織の評判を傷つけるような主張や発言に対して使われます。"}, {"word": "unconstitutional", "definition": "憲法に違反した、違憲の、という意味の形容詞。法的に無効または不当であることを示します。"}, {"word": "infrastructure", "definition": "基盤施設、インフラストラクチャーという意味の名詞。組織や産業が機能するために必要な基本的な設備や体制を指します。"}, {"word": "cumulative", "definition": "累積する、段階的に増える、という意味の形容詞。複数の事柄が時間とともに積み重なることを表します。"}, {"word": "pool", "definition": "共有する、共同で使用する、という意味の名詞・動詞。報道機関が資源やコンテンツを共有する仕組みを指します。"}]}, {"title_ja": "メルツ独首相、州議会選での敗北を受け連立政権の維持を誓約", "title_en": "Merz Vows to Keep Coalition Together Amid State Election Defeats", "summary_ja": "ドイツのフリードリヒ・メルツ首相は、2つの州議会選で極右政党AfDが大きく躍進した中、CDU・SPD連立政権を維持すると誓約した。CDUはメクレンブルク・フォアポンメルン州で5%の閾値に達せず、ベルリンでは左翼政党「左翼党」に次ぐ2位となり、メルツ首相の政治的将来に関する疑問が生じている。メルツ首相は、低い支持率だけが選挙敗北の原因ではないと否定しながらも、ドイツの政治体制が「根本的な転換点」にあることを認めた。", "summary_en": "German Chancellor Friedrich Merz has pledged to maintain his CDU-SPD coalition despite significant electoral setbacks in two state elections where the far-right AfD made major gains. The CDU failed to reach the 5% threshold in Mecklenburg-Vorpommern and came second to the hard-left Die Linke in Berlin, prompting questions about Merz's political future. Merz acknowledged the results represent a \"profound turning point\" for Germany's political system while rejecting the notion that his low popularity ratings alone caused the defeats.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqm27p8enwmko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Merz vows to keep coalition together for Germany's 'democratic future'\n- Published\nGerman Chancellor Friedrich Merz says he will keep his ruling coalition together for the sake of his country's \"democratic future\", following resounding defeats for his party in two state elections.\n\"We are determined to live up to the historic challenges our country is facing,\" Merz said, referring to the coalition between his Christian Democratic Unionist (CDU) party and the Social Democratic Party (SPD).\nMerz's position has come under mounting pressure after Sunday's election results. In the north-eastern Mecklenburg-Vorpommern, the far-right Alternative for Germany (AfD) party won the most votes, with the CDU failing even to reach the threshold to stay in the state parliament.\nMeanwhile in Berlin, the CDU came second to the hard-left Die Linke party, with the AfD also making significant gains.\n- Katya Adler: Merz's political crisis threatens Germany's obsession with stability \n  - Published10 hours ago\nSpeaking at the news conference on Monday, Merz described the result in Mecklenburg-Vorpommern as \"a heavy blow\" for the centre-right CDU.\n\"This election is a profound turning point. It is a dramatic, unprecedented result for the CDU in Germany,\" he acknowledged.\nMerz said there had been no discussion about his own position since the results and pushed back against the idea that his low popularity ratings alone were behind the election defeats.\n\"I know that I as an individual played a role in these state elections,\" Merz said, before adding: \"But the reasons for the results go far beyond just me.\"\n\"We are witnessing a profound transformation of Germany's political party system, as is happening in many other countries around the world.\"\nThere have been rumours Merz, who has only been in power for 16 months, could be replaced mid-term in a so-called chancellor swap due to his poor approval ratings.\nAsked earlier on Monday how long Merz has left in office, the AfD's co-leader Alice Weidel told the BBC: \"Pretty soon, he's going to leave.\"\nThe two elections took place on Sunday, a fortnight after the CDU saw its vote halved in the state of Saxony-Anhalt, where the AfD won a major victory.\nIn Mecklenburg-Vorpommern, the CDU fell short of a 5% threshold to enter parliament, underperforming against what had already been projected to be the party's worst ever result in the area. Merz earlier conceded that this result was \"a disaster\".\nWhile the AfD won the most votes in Mecklenburg-Vorpommern, it was far short of a majority and is unlikely to govern as other parties may refuse to work with it.\nSome branches of the party are classed as right-wing extremist by domestic intelligence, a designation it strongly rejects.\nBut its anti-immigration, Germany first, and Russian-friendly agenda has found fertile ground in the country's former communist east.\nIn Berlin, the CDU's defeat means Die Linke, which won the most votes, could now take power in a coalition.\nElif Eralp, who led the party to victory in the capital, promised to tackle unaffordable rent prices in remarks made after the results came out.\n\"The people of Berlin have clearly opted for a change in policy, specifically for an affordable Berlin, for policies that solve the rent crisis and put people first,\" she told German news outlet The Pioneer.\nDuring the election campaign, Eralp pledged to expropriate more than 200,000 housing units from private landlords. Merz has promised to pursue legislation to prevent such actions, citing the impact on foreign investment.", "translation_ja": "", "vocab": [{"word": "resounding", "definition": "非常に明確で印象的な、あるいは大きな音響を持つ。この文脈では「圧倒的な」という意味で、選挙での明白な敗北を表現するのに用いられている。"}, {"word": "mounting", "definition": "段階的に増加または高まることを意味する。政治的な圧力や困難が時間とともに増していく様子を表す。"}, {"word": "threshold", "definition": "ある行為や段階に入るために必要な最小限度。選挙では政党が議会に議席を得るために必要な最低得票率を指す。"}, {"word": "rumours", "definition": "確認されていない情報や噂。確実でない話題について使われ、政治的な推測や予測を表す際に用いられる。"}, {"word": "conceded", "definition": "自分が間違っていたことを認める、あるいは敗北を受け入れることを意味する。政治的な文脈では失敗や敗北を公式に認めることを表す。"}, {"word": "fertile ground", "definition": "成長や発展に適した環境や条件を示すイディオム。ある思想や運動が広がりやすい社会的背景を表す。"}, {"word": "designation", "definition": "公式に与えられた名称、地位、または分類。この文脈では、政党が当局から受ける公式な指定や分類を指す。"}]}, {"title_ja": "航空会社が2週間で2度目の障害で航空交通管制を批判", "title_en": "Airlines criticise air traffic control after second glitch causes major disruption", "summary_ja": "英国の航空交通管制システムが2週間で2度目の技術的障害を経験し、150便以上がキャンセルされました。EasyJetやWizz Airを含む航空会社は緊急改革を要求し、国営航空交通サービス(Nats)の耐障害性に疑問を呈しています。民間航空局は、乗客は臨時的事象ルールの下で補償を受ける可能性は低いと述べています。", "summary_en": "The UK's air traffic control system experienced a second technical failure in two weeks, causing major disruption with over 150 flights cancelled. Airlines including EasyJet and Wizz Air have called for urgent reform and questioned the resilience of National Air Traffic Services (Nats). The Civil Aviation Authority said passengers are unlikely to be eligible for compensation under extraordinary circumstances rules.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqp80p78mxx5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Airlines criticise air traffic control as second glitch causes more disruption\n- Published\nAirlines have criticised the UK's air traffic control system after a second technical problem in two weeks caused major disruption to UK flights.\nEasyJet said Monday's incident \"once again calls into question the resilience\" of the service, while Wizz Air said there was a \"national confidence crisis\" in National Air Traffic Services (Nats), which runs the UK's air traffic.\nNats said a \"connectivity issue\" at Prestwick was behind the disruption across Scotland, Northern Ireland and northern England - and had \"nothing to do\" with a separate software defect at Swanwick earlier this month.\nPrime Minister Andy Burnham said further issues today \"cause even greater concern\" about the UK's air traffic control.\nWhen asked by reporters whether he would look to fire the head of Nats, Burnham said \"these are clearly serious issues and they need to be fully investigated\".\nHe added that the transport secretary was taking the issues \"extremely seriously\" and initially it's a matter for her \"to get to the bottom of... and why there has been a recurrence.\"\nThe underlying issue causing Monday's disruption has since been resolved, with Nats saying it was running at \"full capacity\" although officials warned of knock-on effects.\nA spokesperson said they were now \"focused on working with our customers to recover their residual delays and help get their operations back to normal\".\nMore than 150 flights were cancelled at UK airports on Monday - including 140 departures and 137 arrivals, according to aviation analytics company Cirium.\nEasyjet was the worst affected airline, with 48 of its 670 scheduled departures cancelled, while British Airways has seen 13 cancellations from its 513 scheduled departures.\nThe UK Civil Aviation Authority (CAA) said passengers who had flights disrupted were \"unlikely\" to be entitled to compensation.\nIt said the technical issue is \"likely to be considered the result of 'extraordinary circumstances' under passenger rights rules\", meaning that \"although passengers should be looked after by airlines, they are unlikely to be entitled to compensation for delays or cancellations that were directly caused by the incident\".\nAn independent review by the CAA into the resilience of the UK's air traffic control system is under way and the results will be published \"within six months\", it said.\n- Repeated air traffic control failures leave us in worrying territory \n  - Published7 hours ago\n- Flight chaos caused by 'millisecond' software defect, report says \n  - Published3 days ago\n- UK flight delays continue after issue with air traffic control in Scotland is fixed \n  - Published11 hours ago\nIndustry representative body Airlines UK said both passengers and airlines \"deserve better\" service after \"yet another Nats failure\".\nManaging director of Wizz Air UK, Yvonne Moynihan, called for \"urgent reform\" of Nats, adding that she did not have confidence in its current leadership.\nAsked on BBC Radio 4's World at One programme if Nats chief Martin Rolfe should resign, Moynihan said: \"We need to look at the leadership at the top. But more than that, what are the board of directors doing?\"\nJet2 boss Steve Heapy called for \"urgent and accountable\" action to bolster the UK's air traffic control infrastructure.\nRyanair reiterated its calls for Rolfe to resign, saying he had failed to deliver\" either a reliable system or an effective back-up\". The latest outage affected 140 of the airline's flights and 25,000 passengers.\nBritish Airways said \"yet another technical fault with Nats\" was \"disappointing\".\nA Nats spokesperson apologised, saying: \"In the real world, we accept technology can and sometimes does fail. Our job is minimising disruption where possible.\n\"What isn't acceptable is any incident where safety is compromised - this is always our first priority.\"\nThey added that it was working to return air traffic to normal as quickly as possible and urged passengers to check their flight status with their airline.\nTransport Secretary Heidi Alexander acknowledged the situation was \"deeply frustrating\" for passengers.\nSteve Davies, 74, told the BBC he was \"cheesed off with air traffic control\" as technical issues with its systems seemed to be \"happening a lot\".\nHe and his wife Sadie became stuck at Birmingham airport after being told to disembark their EasyJet flight to Edinburgh on Monday morning.\nNicole McCloskey, from Kilmarnock, had been due to go to Disneyland Paris with her family before their flight was cancelled.\nShe told the BBC her family got a message to say the flight was delayed while they were travelling to Glasgow airport, but only found out it had been grounded altogether once they arrived.\nNicole said they have been rebooked on another flight on later on Monday and were hopeful \"it's sorted in time\".\nRebecca Freeman became stranded at Bristol Airport after her flight to Edinburgh for a business meeting was cancelled. She des", "translation_ja": "", "vocab": [{"word": "resilience", "definition": "システムや組織が困難な状況から回復し、継続して機能する能力を指します。航空交通管制の場合、技術的な問題が発生しても対応できる堅牢性を意味します。"}, {"word": "connectivity issue", "definition": "コンピュータネットワークや通信システムの接続に関する問題のことです。この場合、Prestwick空港の管制システムとのネットワーク接続に障害が生じたことを指します。"}, {"word": "extraordinary circumstances", "definition": "予測不可能で制御不可能な特殊な状況を指します。航空業界では、このような状況による遅延や欠航は航空会社の責任ではなく、乗客の補償対象外となります。"}, {"word": "defect", "definition": "製品やシステムの欠陥や不具合のことです。この記事では、航空交通管制システムのソフトウェア上の問題を指しています。"}, {"word": "disruption", "definition": "通常の業務や運営の中断や混乱のことです。この場合、航空交通管制システムの障害による便の遅延やキャンセルを意味します。"}, {"word": "resilience", "definition": "システムや組織が困難から回復し、継続して機能する能力です。航空交通管制の堅牢性と信頼性を評価する重要な指標です。"}]}, {"title_ja": "英国初のルワンダ大虐殺関連訴追", "title_en": "First UK charges brought over 1994 Rwanda genocide", "summary_ja": "ロンドン北部に住むルワンダ人男性が、1994年のルワンダ大虐殺に関連する犯罪で英国初の被告人となりました。ヴィンセント・ブラウン博士（65歳）は、他者による殺人と大虐殺行為の指示と扇動の罪に問われています。この訴追は、ロンドン警視庁の戦争犯罪チームによる7年間の捜査に続くものです。", "summary_en": "A Rwandan man living in north London has become the first person charged in the UK with offences related to the 1994 Rwanda genocide. Dr Vincent Brown, 65, is accused of directing and inciting acts of murder and genocide. The charges follow a seven-year investigation by the Metropolitan Police's War Crimes Team.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr2092216nywo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "First UK charges brought over 1994 Rwanda genocide\n- Published\nA Rwandan man, who has been living in north London, has become the first person charged in the UK with offences relating to the 1994 Rwanda genocide, the Crown Prosecution Service (CPS) has said.\nDr Vincent Brown, formerly Dr Vincent Bajinya, 65, has been charged with one offence of conduct ancillary to genocide and six offences of conduct ancillary to murder as a crime against humanity.\nFrank Ferguson, head of the CPS's Special Crime and Counter Terrorism Division, said Brown \"is alleged to have directed and incited acts of murder and genocide carried out by others\".\nBrown will appear at Westminster Magistrates' Court on Tuesday.\nFerguson said the decision to charge Brown was made \"after reviewing a file of evidence submitted by the War Crimes Team at the Metropolitan Police\".\n\"We concluded that our legal test for bringing criminal charges had been met,\" he added.\nThe War Crimes Team began their investigation in September 2019 after a formal request from the Rwandan government to investigate people allegedly involved in a genocide in the Rugenge district of Kigali in April 1994.\nOver the course of 100 days in 1994, an estimated 800,000 ethnic Tutsis and politically moderate Hutus people were killed in Rwanda by Hutu extremists.\nThey were targeting members of the minority Tutsi community, as well as their political opponents, irrespective of their ethnic origin.\nThe mainly Tutsi forces who took power following the genocide were alleged to have killed thousands of Hutu people in Rwanda in retaliation.\nThe Metropolitan Police said the charges against Brown follow \"a complex and extensive seven-year investigation\".\nCommander Helen Flanagan, head of Counter Terrorism Policing London, said: \"This case demonstrates the UK is not a safe haven for individuals suspected of committing international crimes.\n\"The War Crimes Teams remains committed to ensuring those suspected of involvement in genocide and other atrocity crimes are held accountable through due legal process.\n\"A number of other investigations remain ongoing into other individuals in the UK for similar offences related to the genocide in Rwanda.\"", "translation_ja": "", "vocab": [{"word": "ancillary", "definition": "補助的な、従属的なという意味で、主要な犯罪に関連する関与を指します。法律用語として使用されます。"}, {"word": "incited", "definition": "他人を行動や犯罪へと扇動する、駆り立てるという意味です。法的責任が問われる重要な行為です。"}, {"word": "atrocity", "definition": "極度に残虐で非人道的な行為、特に大量殺害や集団暴力を指します。"}, {"word": "retaliation", "definition": "報復、復讐行為という意味で、相手からの被害に対する反撃や応報を指します。"}, {"word": "haven", "definition": "避難所、逃げ場という意味で、追求から逃れることができる安全な場所を意味します。"}, {"word": "due process", "definition": "正当な法的手続き、法の適正手続きという意味で、公正な裁判を保証する法的原則です。"}]}, {"title_ja": "ティーズサイド地域の組織犯罪取り締まりで17人を逮捕", "title_en": "Seventeen arrested in Teesside organised crime raids", "summary_ja": "クリーブランド警察はミドルズブラ近郊のサウス・バンク、グランジタウン、イーストンで早朝の家宅捜索を実施し、薬物、暴行などの組織犯罪容疑で17人を逮捕した。約130人の警察官と国家犯罪庁の職員が参加した作戦であり、先月の警察官2人と民間人5人が死亡したA66での交通事故への対応の一環である。警察と地域指導者は、目に見える取締りを通じて犯罪に対処し、市民に安心感を与えることの重要性を強調した。", "summary_en": "Cleveland Police conducted early morning raids across South Bank, Grangetown and Eston near Middlesbrough, resulting in 17 arrests on suspicion of drugs, assault and other organised crime offences. The operation involved approximately 130 officers including National Crime Agency personnel and was part of a response to a fatal A66 crash last month that killed two police officers and five civilians. Police and community leaders emphasised the importance of tackling criminality and reassuring the public through visible enforcement action.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckjrxpz03w8no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Early morning police raids target organised crime\n- Published\nPolice have carried out a series of early morning raids targeting those suspected of being involved in organised crime.\nCleveland Police said 17 people had been arrested during the operation - involving about 130 officers including some from the National Crime Agency - across South Bank, Grangetown and Eston, near Middlesbrough, on Monday.\nIt is part of a high-profile response to a crash on the nearby A66 last month which came at the end of a police pursuit and left two officers dead.\nFive men also died when their Volkswagen Passat went the wrong way down the road and hit a Cleveland Police armed response vehicle heading in the opposite direction.\nThe force said Monday's raids had seen people arrested on suspicion of various offences including drugs and assault.\nA convoy of about a dozen vans started the operation shortly after 08:00 BST, with roads temporarily blocked by patrol cars.\nOfficers used battering rams to force entry to several properties as parents walked past with their children on the school run.\nAssistant Chief Constable Mark Hall said public support after the crash had been ''absolutely phenomenal\".\n\"It's clear criminality of any sort is not welcome on these estates and we are here to tell those people we've heard their concerns and we will act,\" he said.\nOfficers PC Matthew Blades, 37, and PC Tom Clough, 38, along with all five occupants of the Passat died at the scene of the A66 crash.\nCleveland's Police and Crime Commissioner Matt Storey said it was important for people to see officers on the streets targeting those responsible for crime.\nHe said: \"This makes people more reassured about what is really going in their communities. They see people arrested, charged and taken off the streets.\n\"It shows the public good work is happening, despite the problems we have.\"\nFollow BBC Tees on X,, external Facebook, external, Nextdoor and Instagram, external.\nGet in touch\nDo you have a story suggestion for BBC Tees?\n  - Published25 August", "translation_ja": "", "vocab": [{"word": "organised crime", "definition": "組織的な犯罪活動のことで、複数の個人による計画的で継続的な犯罪行為を指す。薬物取引、詐欺、暴力などが含まれる。"}, {"word": "raids", "definition": "警察や当局が家宅捜索や逮捕を目的として急襲すること。通常、事前の予告なしに行われる。"}, {"word": "conviction", "definition": "法廷で有罪と判決されること。また、何かを強く信じていることも意味する。"}, {"word": "apprehend", "definition": "犯人などを逮捕すること、または理解することの両方の意味を持つ。法執行用語としてよく使用される。"}, {"word": "phenomenal", "definition": "非常に優れた、または顕著な出来事や現象を表す形容詞。通常、肯定的な意味で使用される。"}, {"word": "criminality", "definition": "犯罪行為または犯罪的性質全般を指す名詞。犯罪活動の存在や程度を表現するのに用いられる。"}]}, {"title_ja": "英国：ルワンダ大虐殺への関与容疑で男性を起訴", "title_en": "UK Man Charged Over Suspected Role in Rwanda Genocide", "summary_ja": "英国当局が1994年のルワンダ大虐殺への関与容疑で65歳の男性を逮捕・起訴した。同国での初の起訴案件である。容疑者は1998年に亡命希望者として英国に入国し、2004年に英国籍を取得した後、2006年に大虐殺との関連で逮捕されていた。2017年の身柄引き渡しが失敗に終わったため、ルワンダ政府は英国当局に独自調査を要請していた。", "summary_en": "A 65-year-old man has been arrested and charged in the UK for alleged involvement in the 1994 Rwandan genocide, marking the first such arrest in Britain. The suspect, who entered the UK as an asylum seeker in 1998 and became a British citizen in 2004, is accused of directing and inciting acts of murder and genocide. This case demonstrates the UK's commitment to prosecuting international crimes committed abroad, following a failed extradition attempt in 2017.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/uk-man-charged-over-suspected-role-in-rwanda-genocide/a-79364493?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "UK: Man charged over suspected role in Rwanda genocide\nSeptember 21, 2026\nUK authorities arrested and charged a man on Monday over alleged links to the Rwandan genocide, prosecutors and the London police said. It was the first arrest of its kind, although authorities have been pursuing the case for several years.\nThe 65-year-old man has been charged with one count of being an ancillary to genocide and six offenses of aiding crimes against humanity in Rwanda, officials said.\n\"This case demonstrates the UK is not a safe haven for individuals suspected of committing international crimes,\" said Commander Helen Flanagan, head of counterterror policing.\nThe Rwandan genocide took place in 1994, where over 800,000 ethnic Tutsis and moderate ethnic Hutus were killed in a 100-day rampage, orchestrated and led by the Hutu ruling majority. Local officials and ordinary citizens were involved in the mass killing.\nUK law allows prosecutors to bring charges for some international offenses, including genocide and crimes against humanity, even if the crimes were committed abroad.\nIt is the latest case of an arrest in Europe of someone linked to Rwanda's genocide. In July, a German-Rwandan national was arrested for charges of taking part in the genocide and killing one person himself.\nMeanwhile, in the Netherlands, a man was sentenced to life in prison for having taken part in attacks on homes, including launching a grenade on sheltering Tutsi civilians.\nSuspect underwent name change\nUK's Metropolitan Police war crimes investigators opened the case against the suspect in 2019, following a request by the Rwandan government.\nThe 65-year-old is originally from Kigali but lived in London at the time of the arrest.\nHe reportedly entered the UK as an asylum seeker in 1998, according to Rwandan Justice Minister Tharcisse Karugarama.\nAfter being granted British citizenship in 2004, the man underwent a name change, and two years later, he was arrested over his connection to the genocide.\nHis extradition to Rwanda, along with four other men, was ultimately halted by a British UK court in 2017.\nThe failed extradition prompted the Rwandan government to urge UK authorities to investigate the matter themselves.\nFrank Ferguson, head of the Crown Prosecution Service's counterterror division, said the man is \"alleged to have directed and incited acts of murder and genocide carried out by others.\"\nAuthorities say investigations are ongoing for more suspects who are linked to the Rwandan genocide currently living in Britain.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "ancillary", "definition": "主要な役割ではなく、補助的または従属的な役割を果たすことを意味する。法律用語として「共犯」や「幇助」を表現する際に使用される。"}, {"word": "incite", "definition": "他人に対して行動を起こすよう促すまたは扇動することを意味する。多くの場合、暴力や犯罪行為を誘発させる文脈で使用される。"}, {"word": "orchestrated", "definition": "複数の要素や人々を計画的に組織し調整することを意味する。特に大規模な事件や計画を指揮する場合に使用される。"}, {"word": "haven", "definition": "安全な避難場所または保護される場所を意味する。本文では犯罪者が逃れる可能性のある国や地域を指す文脈で使用される。"}, {"word": "extradition", "definition": "ある国の容疑者または受刑者を別の国に引き渡す法的手続きを意味する。国際法に基づいて実行される。"}, {"word": "prosecution", "definition": "犯人を訴追し法的手続きを進める行為、またはそれを行う機関を意味する。刑事事件において告発側を表現する際に使用される。"}]}, {"title_ja": "米国と中国の対立がグローバル貿易を再構築、ヨーロッパは中間国家として葛藤", "title_en": "US-China Rivalry Reshapes Global Trade as Europe Navigates Middle Power Tensions", "summary_ja": "トランプ米大統領と習近平国家主席がワシントンで貿易緊張について協議する中、ヨーロッパは超大国間で揺れ動きながら、中国の技術進歩による経済的課題に直面している。EUは安価な中国製電気自動車と製造業競争に苦しみながら、同時にトランプ氏の関税脅迫と中国技術へのアクセス制限圧力に対処している。米国と中国の戦略的膠着状態は、ドイツやカナダなどの中堅国家が商業的利益と地政学的同盟のバランスを取ろうとする中で不確実性をもたらしている。", "summary_en": "As US President Trump and Chinese leader Xi Jinping meet in Washington to discuss trade tensions, Europe finds itself caught between competing superpowers while facing its own economic challenges from Chinese technological advances. The EU struggles with cheap Chinese electric vehicles and manufacturing competition, while simultaneously facing Trump's tariff threats and pressure to restrict Chinese technology access. This strategic stalemate between the US and China creates uncertainty for middle powers like Germany and Canada seeking to balance commercial interests with geopolitical alignment.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-china-rivalry-is-reshaping-global-trade-and-europe-is-caught-in-the-middle/a-79356540?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "As US and China talk, middle powers jostle for position\nSeptember 21, 2026\nLast week, German and Chinese business leaders met in the German city of Düsseldorf for an economic dialogue. Although the panel focused on trade, and investment between China and Europe, ongoing US-China rivalry was the elephant in the room.\nAs Xi Jinping and Donald Trump sit down in the US capital Washington this week, there is some hope that talks will show progress on alleviating the ongoing trade war launched by the US president. The last time the two leaders met at a Beijing summit in May did not yield any tangible results.\n\"The assumption in Beijing, and that's the way they're operating, is that China and the US will hold each other in check for the foreseeable future,\" Mikko Huotari, director of the Berlin-based China think tank MERICS, told a policy briefing last week.\n\"Xi really doesn't need a breakthrough in Washington. He needs more time. And the same is true for Washington. So we have this strategic stalemate situation, which I think is the best description of what we see currently.\"\nA deal could benefit Trump's Republican Party ahead of the important US midterm elections in November, but that outcome remains far from certain.\n\"We will discuss everything,\"Trump said about Xi's visit to the White House.\nCooperation on AI?\nBeijing and Washington are competing on multiple levels, and nowhere is this rivalry more consequential than with artificial intelligence (AI).\nThe US government prohibits the export of high-performance chips to China. Beijing, in turn, restricts the export of rare earth elements, which are indispensable for semiconductor production.\nAnd amid concerns about the dangers of unregulated AI, there is some expectation that Xi and Trump will discuss AI guardrails during their talks. Xi has called for international cooperation on AI development, while Trump sees its regulation as a threat to the US' leadership in the field.\nAfter meeting with Chinese Vice Premier He Lifeng in New York on Sunday, US Treasury Secretary Scott Bessent said that US and Chinese officials have already discussed creating a \"notification mechanism\" to share information about AI-related security incidents.\nEurope's 'China shock'\nFrom a European perspective, both China and the US are currently considered difficult partners.\nThe second \"China shock … is already here\" in Europe, said European Commission President Ursula von der Leyen in her 2026 State of the Union address last week.\nThe first \"China shock\" came 25 years ago, triggered by China's accession to the World Trade Organization (WTO), when inexpensive \"Made in China\" products began to flood the global markets.\nThe second one stems from Chinas technological progress in industries such as battery technology, green energy and mobility.\n\"It shows in our communities and in factories across our Union. It leads to deindustrialization in the industrial heartlands of Europe. This is unsustainable,\" von der Leyen said in her address.\nThe EU is aiming for a rapid transition to e-mobility and wants to drastically reduce CO2 emissions from road traffic. At the same time, Brussels is calling for additional tariffs on low-cost electric cars from China, as China enjoys competitive advantages with cheaper cars and high government subsidies.\nChina denies having an unfair advantage, and German automakers VW and BMW also oppose punitive tariffs due to potential revenue losses resulting from Chinese retaliatory measures.\nA Chinese participant at the Düsseldorf economic dialogue told DW anonymously that China's domestic consumption cannot absorb manufacturing.\n\"China's economy is weak. Companies are worried about their business and urgently need to tap into foreign markets,\" said the Chinese executive, who used to work in the European branch of a Chinese state-owned enterprise.\nTrump pressuring EU over China, but also on trade, security\n\"Against the backdrop of the ongoing escalation of strategic rivalry between the US and China, the US is constantly urging its allies to tighten restrictions on China in the areas of technology, supply chains, and security,\" said Yang Xiepu, director of the Center for Sino-German Cooperation at the Chinese Academy of Social Sciences (CASS).\nAt the same time, Trump frequently threatens the EU with tariffs while injecting instability into the strategic NATO alliance. When the EU offered Canada \"associate membership\" last week, Trump floated the possibility of new punitive measures from the US.\nWhile Carney expressed interest , Trump called the idea \"ridiculous.\"\n\"If I think it's at all a hostile act, I will put very serious tariffs or stop trading with Europe on many things,\" Trump said, without specifying what he considers about EU-Canada ties to be \"hostile.\"\nCopying Canada's 'middle' approach\nFacing Trump administration's tariff upsets and caustic rhetoric, Canadian Prime Minister Mark Carney is openly hedging his bets on the world stage.\n\"We know the old order is not c", "translation_ja": "", "vocab": [{"word": "stalemate", "definition": "進展や動きがない膠着状態を指す。特に交渉や競争において双方が譲歩できず、一進一退の状況を表す。"}, {"word": "indispensable", "definition": "どうしても必要で、なくてはならないという意味。製造やビジネスの文脈で、欠かせない要素や資源を説明する際に使用される。"}, {"word": "deindustrialization", "definition": "産業衰退を意味し、特に製造業が減少し地域経済が弱体化する現象。ヨーロッパなどの先進国で深刻な問題とされている。"}, {"word": "hedging", "definition": "リスク回避戦略を意味し、複数の選択肢を同時に追求して不確実性に対処する外交手法。"}, {"word": "retaliatory", "definition": "報復的な、仕返しの意味。特に国際貿易で一方の国が制裁に対して反撃的な措置を取ることを指す。"}, {"word": "accession", "definition": "国際機関や条約への加盟または正式な参入を意味する。中国のWTO加盟がここでの例である。"}]}, {"title_ja": "米ニュース媒体がトランプ大統領のホワイトハウス出入り禁止を提訴", "title_en": "US News Outlets Sue Trump Over White House Ban", "summary_ja": "CNNやMS NOW、ポリティコはホワイトハウスから出入り禁止にされたため、トランプ政権を相手に訴訟を起こし、修正第1条の権利侵害を主張している。トランプ大統領がこれらの報道機関を「フェイクニュース」と非難した後の禁止であり、他の主要テレビネットワークもこれに抗議してホワイトハウス共同取材を中止している。報道機関側は、大統領が単なる報道内容への不満を理由に報道の自由を奪うことはできないと主張している。", "summary_en": "CNN, MS NOW, and Politico filed a lawsuit against the Trump administration after being banned from the White House, citing violations of First Amendment rights. The ban followed Trump's accusations that the outlets reported 'fiction,' and other major TV networks suspended White House pool coverage in protest. The news organizations argue the president cannot deprive the press of constitutional rights based solely on dislike of their reporting.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-news-outlets-sue-trump-over-white-house-ban/a-79362618?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US news outlets sue Trump over White House ban\nSeptember 21, 2026\nUS news outlets CNN, MS NOW, and Politico plan to go to court against Donald Trump's administration, after he banned them from the White House, the three said in a statement on Monday.\n\"This morning, we notified the government that we are filing a lawsuit today to protect our First Amendment rights and defend the principle that the government does not decide what the press reports or publishes,\" CNN, MS NOW and Politico said in their statement.\nThe announcement comes after Trump accused the media outlets of reporting \"fiction\" and \"lied\" in their coverage of his administration.\nOn Monday, Trump wrote on social media that his administration was not targeting \"the Free Press\" but was \"instituting an assault on the FAKE NEWS, something that has grown like Cancer.\"\nTrump's media ban is the latest escalation in his long-running feud with several US media outlets. In 2017, as he began his first presidential term, he blasted the press as \"the enemy of the American people.\"\nWhat did CNN, MS NOW, Politico say?\nA day after Trump's announcement, the entry badges of reporters for CNN, MS NOW, and Politico had been disabled.\nThe news outlets accused the White House of revoking their journalists' credentials \"without notice or process\" because the administration \"objected to our reporting.\"\n\"Left unchallenged, this threatens press freedom and the public's right to independent journalism free from government interference,\" they said in the statement.\nThe banned news outlets argued in their lawsuit that the constitution \"does not allow a president or any other government official to deprive the press of their First Amendment rights and liberty and property interests with no notice or process based solely on his dislike of the content of their reporting.\"\nWhite House pool coverage suspended\nCNN is one of five news organizations, including broadcasters ABC, CBS, Fox News and NBC, that make up the White House television pool. The broadcasters share the costs of covering the president, take turns organizing coverage and share the footage with outlets around the country.\nOn Monday, in response to CNN's exclusion from the White House television pool, the other major TV networks said they have suspended their coverage, which effectively eliminates the most important video source for White House events.\nCNN had been scheduled to cover Trump's trip to New York for the United Nations General Assembly on Monday, but as a result of the ban, it was not able to provide a pool feed.\nBryan Boughton, who runs the Fox News Washington bureau and the current TV pool chair, announced the suspension in an email Monday.\n\"This follows the White House's position preventing CNN from fulfilling its assigned pool duties,\" Boughton added. \"There will be no replacement pool put in place,\" he added.\nThe lack of replacement reflected an effective boycott over the ban.\nABC, CBS, CNN, Fox and NBC addressed the situation in a statement, saying that \"the public has a vital interest in receiving accurate, independent information about its government. No administration should restrict a news organization because it objects to its reporting.\"\nEdited by: Roshni Majumdar\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や対立がより深刻化し、レベルが高まっていくことを意味する。政治的な対立や緊張関係が段階的に悪化する状況を表す。"}, {"word": "credentials", "definition": "信用や資格を証明する公式な書類や認定証のこと。ここではジャーナリストがホワイトハウスへのアクセス許可を示す身分証明書を指す。"}, {"word": "deprive", "definition": "何かを奪い取る、または与えないという意味の動詞。権利や特権などを誰かから取り上げる行為を表す。"}, {"word": "boycott", "definition": "抗議や圧力として、ある組織や商品との関係を断つ、または避ける行動のこと。ここでは他のテレビネットワークがCNNへの支援として報道を中止した行為を指す。"}, {"word": "pool coverage", "definition": "複数のメディア機関が報道費用を共有して、交代で大統領や重要なイベントを取材し、その映像を共有する仕組み。効率的な報道体制を確保するための業界慣行。"}, {"word": "restrict", "definition": "何かの活動や自由を制限する、また抑制することを意味する動詞。行動の自由度を減らすまたは限定する行為を表す。"}]}, {"title_ja": "トランプ氏がイランに対する中国の支援でシー主席に対抗すべき、議員らが主張", "title_en": "Lawmakers Call for Trump to Confront Xi Over China's Support for Iran", "summary_ja": "米国の議員らは、中国企業がイランに戦時中の衛星画像を提供したという報告をめぐり、トランプ大統領が中国指導部に直接異議を唱えるよう促している。情報は北京とテヘランの継続的な協力を示唆しており、中東での米国の外交政策目標を複雑にする可能性がある。", "summary_en": "U.S. lawmakers are urging President Trump to directly challenge China's leadership over reports that Chinese companies have provided wartime satellite imagery to Iran. The intelligence suggests ongoing cooperation between Beijing and Tehran that could complicate U.S. foreign policy objectives in the Middle East.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/lawmakers-trump-confront-xi-chinese-support-iran/story?id=136621188", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、世界中の速報ニュースとライブイベントを24時間体制でお届けしています。プラットフォームは、重要なニュースが展開する際にリアルタイムで報道を配信します。視聴者は複数のプラットフォーム上で継続的なニュース更新にアクセスできます。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events from around the world. The platform delivers up-to-the-minute reporting on major stories as they develop. Viewers can access continuous news updates across multiple platforms.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "通信機器障害後、北東部の便が再開、ダッフィー長官が確認", "title_en": "Northeast flights resume after equipment outage, Duffy confirms", "summary_ja": "ショーン・ダッフィー運輸長官は月曜夜、北東部の航空交通を混乱させた機器障害の後、通信回線が修復されたと発表した。同地域のすべての空港運用は現在正常に再開している。この障害は該当地域全体で大幅な便の遅延とキャンセルを引き起こしていた。", "summary_en": "Transportation Secretary Sean Duffy announced Monday evening that telecom lines have been repaired following an equipment outage that disrupted air travel across the Northeast. All airport operations in the region are now resuming normal operations. The outage had caused significant flight delays and cancellations throughout the affected area.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/northeast-airspace-closing-30-minutes-due-equipment-outage/story?id=136626017", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国の援助削減後、アフリカの医療が「増大する負担」に直面と報告書が警告", "title_en": "African Healthcare 'Under Growing Strain' After US Aid Withdrawal, Report Warns", "summary_ja": "新しい報告書は、USAIDなどの米国援助プログラムからの撤退がアフリカと世界南部の医療システムに深刻な負担をもたらしたと警告している。ガーナ大統領ジョン・ドラマニ・マハマ主導の報告書は、アフリカ諸国が西側援助に依存するのではなく、自国の医療発展の管理を強化することを求めている。2021年から2025年の間にアフリカの医療への外部資金提供は約70％減少し、各国は医療システムを急速に再構築することを余儀なくされた。", "summary_en": "A new report warns that US withdrawal from aid programs like USAID has severely strained healthcare systems across Africa and the Global South. The report, led by Ghana's President John Dramani Mahama, calls for African countries to take greater control of their health development rather than relying on Western aid. External financing for health in Africa contracted by nearly 70% between 2021 and 2025, forcing countries to rapidly restructure their healthcare systems.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/21/africa-healthcare-aid-program-withdrawl", "state_media": false, "category": "社会", "full_text": "The United States’ withdrawal from key aid programs has put has put healthcare in Africa and the Global South “under growing strain” a new report warns.\nThe report says the Trump administration’s cuts to programs such as US Agency for International Development (USAID), as well as the Covid-19 pandemic and rising costs of living globally have brought “new urgency” for the need to reform healthcare in the region.\nThe report, titled A Sovereign Future For Health, was created by the Accra Reset, a global health initiative led by John Dramani Mahama, Ghana’s president, that believes countries in Africa and the wider global south should have greater control over their health development rather than being dependent on aid from western countries and international institutions.\nA key statistic cited by Mahama and Accra Reset is that Africa produces less than 1% of its vaccines while carrying about 25% of the global disease burden.\nThe report cites how abrupt changes to global health financing, such as the US withdrawal from several global health initiatives, forced countries within the global south to urgently restructure their finances. The report points to the Trump administration’s decision to dissolve USAID, which pushed Nigeria to absorb the 28,000 health workers who were previously employed by the agency at a cost of $200m.\nExternal financing for health in Africa contracted by close to 70% between 2021 and 2025, the report notes, meaning that African countries historically dependent on aid were forced to adapt quickly.\nThe withdrawal of the US Emergency Plan for Aids Relief (Pepfar) funding for South Africa, which provided over $400m a year annually and is credited with saving 26m lives globally since 2003, led to HIV clinics closing across the country. That left 1.4 million people living with HIV to face uncertainty about their treatment.\nSuch funding cuts caused “severe and devastating” disruption globally, according to research presented at the 26th International Aids Conference in Brazil earlier this year.\nAt the World Health Assembly in May, Mahama said Ghana lost $78m following the closure of USAID programs which affected maternal healthcare, the treatment of malaria, nutrition and HIV/Aids interventions.\nThe initiative’s latest report, published on Monday, comes amid these major cuts to international aid and growing pressure on countries to take greater ownership of their health systems. Mahama refers to these aid cuts as a clear example that donor dependency is not sustainable.\n“The Accra Reset is not an argument for traditional donors to do less on global health. It is an argument for doing it differently and doing it better. As countries take greater ownership of their health futures, donor countries should step up to support that transition – following the lead of countries that set their own priorities, and work alongside them to determine where outside support is most valuable,” said Naveen Rao, senior vice-president of the health initiative at the Rockefeller Foundation. “The Accra Reset shows how we can evolve to back country-led solutions while advancing our shared health and economic interests.”\nMahama notes in the report that the “past few years have shaken global health cooperation to its foundations”.\n“The Covid-19 pandemic exposed the risks created by concentrated production and unequal access to essential health products; rising debt and fiscal pressures have constrained national health budgets; and declining development assistance is placing programs and services under growing strain,” he continued, adding: “These shocks have brought new urgency to reform debates that have continued for years with limited progress. It was in this context that we launched the Accra Reset and its Sovereign Health Agenda – to give renewed political force to the reform agenda and place the agency of countries of the Global South at its centre.”\nThe report comes alongside a recent survey revealing the progressive attitudes many US citizens have towards foreign aid. Some 75% of Americans – including more than one in two (52%) who primarily support Donald Trump – agree that the US should restore disease prevention aid to contain the Ebola virus, according to polling of over 2,000 US adults commissioned by the Rockefeller Foundation.\nThe polling also revealed that 65% of US adults support international cooperation even if it means compromising some national interests; 64% also believe Americans have a shared responsibility to others, including people in other countries whom they do not know.\nThe Guardian has contacted the Department of Health and Human Services (HHS) for comment.", "translation_ja": "", "vocab": [{"word": "contraction", "definition": "経済や数字の減少を意味する専門用語。この文脈では、医療資金提供が70％減少したことを指します。"}, {"word": "restructure", "definition": "組織やシステムを再度構築・改編すること。企業や政府機関が大きな変化に対応する際に使われます。"}, {"word": "fiscal", "definition": "政府や公共機関の予算・財務に関する形容詞。「fiscal pressure」は財政的な負担を意味します。"}, {"word": "donor dependency", "definition": "援助国に依存した状態を指します。発展途上国が外部援助に頼ることで自立性が損なわれる問題を表現します。"}, {"word": "abrupt", "definition": "突然の、予期しない変化を意味する形容詞。このテキストでは国際保健資金の急激な変化を表しています。"}, {"word": "disposition", "definition": "配置や配分、または性向を意味します。ここでは資源の配分や医療システムの配置に関連する意味で使われています。"}]}, {"title_ja": "トランプの秘密送還協定：移民が無関係な国に送られる", "title_en": "Trump's Secret Deportation Deals: Migrants Sent to Unrelated Countries", "summary_ja": "トランプ政権は25,000人以上を出身国と無関係の国に送還しており、迫害から逃れた亡命希望者を中央アフリカ共和国などの危険な国に送っている。連邦裁判所がこの慣行を違法と判断したが、政府は控訴して政策を継続する予定であり、人権団体はこれを移民を抑制するための「力の示威」と呼んでいる。", "summary_en": "The Trump administration has deported over 25,000 people to countries unrelated to their origin, including sending asylum seekers fleeing persecution to dangerous nations like the Central African Republic. A federal court ruled the practice unlawful, but the government plans to appeal and continue the policy, which human rights organizations describe as a \"show of force\" to discourage migration.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/ng-interactive/2026/sep/21/trump-deportation-deals", "state_media": false, "category": "経済", "full_text": "Nika’s story\nNo one would tell the shackled detainees onboard the US immigration plane where they were going. The officers in charge would taunt them when they asked, they said. It was only when the seat-back video screens finally showed a map that the 18 migrants worked it out.\nTheir destination was Central African Republic (CAR), a country few of them had even heard of.\nNika, a 32-year-old Iranian woman, recalled how the handcuffs dug into her wrists. She begged the officers to loosen them, but they did not. Other passengers had it worse, she said. Some of the men were restrained in black and yellow body wraps, as if mummified, after resisting orders to get on the plane.\nNika, who had fled Iran 18 months earlier after protesting against its regime, had imagined the US as a place of sanctuary. Iran was already one of the most repressive countries in the world when she left, and its horrors had only deepened since then: security forces gunned down thousands of other demonstrators this year, then Donald Trump’s administration launched the war there.\nAfter more than a year locked up in a US immigration detention centre, Nika, whose name the Guardian has changed to protect her family in Iran, was granted legal protections and freed on a judge’s orders. Within two weeks, the Department of Homeland Security had rearrested her, and days later she was on the plane heading 7,000 miles east.\n“They never told me they were going to deport me [to] this country,” she told the Guardian. “I don’t know anything about Africa.”\nThe Department of State warns US citizens not to travel to CAR because it says it is too dangerous. Nika spends most of her days there under a form of self-imprisonment, too scared to venture out from her small bedroom as she waits for an answer to the question on which her life depends: will she be sent back to Iran, and to a regime that could kill her?\nNika is one of more than 25,000 people deported by the Trump administration to countries that are not their own. About 20,000 people have been bussed to Mexico, according to a count by Refugees International and Human Rights First. And more than 5,000 others have been put on flights to countries in Africa, Latin America, the Caribbean and central Asia to which they have no connection, and then, often, returned to the countries where US immigration judges had ruled their lives or liberty were at risk.\nHuman rights lawyers describe these so-called third-country national arrangements as part of a “show of force” by the US intended to discourage migrants and asylum seekers from entering. People from Peru and Colombia have been sent to the Democratic Republic of the Congo (DRC). On 20 August, four Cubans, a Brazilian and a Cameroonian refused to disembark in Liberia, and were sent to Equatorial Guinea instead.\nIn order to compile the most comprehensive account of a policy that has mostly operated behind closed doors, the Guardian joined 23 other media organisations in the Deportation Project, a joint investigation coordinated by Paris-based Forbidden Stories. The consortium interviewed more than 100 people affected by, or involved in, the US drive to extinguish unauthorised immigration, and reviewed documents outlining details of the agreements made by US officials with governments around the world.\nIt has tracked more than 100 flights that have carried migrants and asylum seekers to 28 different countries. This is likely to be an undercount as the consortium’s dataset only includes flights it was able to independently verify.\nThe pace of flights is increasing. After an initial wave during the opening months of the second Trump administration, the number of deportations spiked in August again when, according to a count by Human Rights First, a record 16 flights carried people to 13 different countries that were not their own.\nA US federal appeals court ruled on Friday that third-country removals were unlawful, arguing that they violated due process because people are not notified with enough time to mount a legal challenge to the decision to send them to another country. Human rights lawyers suggested this should immediately ground third-country deportation flights. The government is expected to appeal against the judgment, and to press ahead with its policy.\nA state department spokesperson said implementing the Trump administration’s immigration policies was a “top priority” and “we are unwavering in our commitment to end illegal and mass immigration and bolster America’s border security”. They added: “The US government will use all legal means to remove those with no right to remain in our country.”\nThe Trump administration has said the people it deports are criminals. Yet documents obtained by the Washington Post as part of this project show that a majority of the 35 countries that have signed deals with the US have said they will not accept migrants with violent criminal records.\n The people forced on to planes include those who spent most of their liv", "translation_ja": "", "vocab": [{"word": "deportation", "definition": "国籍国以外の国への強制送還。不法滞在者や移民法違反者を元の国に戻すプロセスを指す。"}, {"word": "asylum seeker", "definition": "政治的迫害や危険から逃れるため、他国での保護を求める人。国際的に認められた法的地位を持つことを目指している。"}, {"word": "due process", "definition": "法律に基づいて公正かつ公平に扱われる権利。政府の行動が憲法的に正当であることを要求する法的原則。"}, {"word": "extinguish", "definition": "完全に消滅させる、廃止する。ここでは不法移民を完全に排除する目的を意味する。"}, {"word": "consortium", "definition": "共通の目的のために協力する複数の組織の集団。この場合、23のメディア機関が共同調査に参加している。"}, {"word": "bolster", "definition": "強化する、支持する。政策や制度をより強力またはより効果的にすることを意味する。"}]}, {"title_ja": "米国から赤道ギニアへ強制送還された人々が拘置ホテルで暴行を受ける", "title_en": "US Deportees Beaten at Equatorial Guinea Hotel, Lawyers Report", "summary_ja": "トランプ政権によって赤道ギニアに強制送還された2人の男性が、拘置ホテルで縛られ、頭に袋をかぶせられ、暴行を受けたと弁護士が報告している。これはメディアに悪劣な状況について話したことへの報復と見られている。約30人の米国人強制送還者がホテル・バミに閉じ込められたままであり、人権擁護団体は拷問、医療の欠如、独裁政権による組織的な人権侵害について警告している。", "summary_en": "Two men deported by the Trump administration to Equatorial Guinea were bound, beaten, and had bags placed over their heads at a detention hotel, allegedly in retaliation for speaking to media about poor conditions. About 30 US deportees remain trapped at Hotel Bamy, where human rights advocates warn of torture, lack of medical care, and systematic human rights abuses by the authoritarian government.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/18/us-men-deported-hotel-equatorial-guinea", "state_media": false, "category": "社会", "full_text": "Two men that the Trump administration expelled to Equatorial Guinea were bound, fitted with bags over their heads, beaten and pushed down a flight of stairs, all in plain view of other US deportees, according to witnesses and human rights lawyers.\nThe men – one from Egypt and one from Eritrea – were then taken to a prison. About 30 detainees from the US remain trapped at a hotel in the outskirts of the coastal city of Malabo after being deported from the US. Detainees have said they believe the men were beaten for telling the press and human rights advocates about the poor conditions and violence inside the hotel, and that they are haunted by flashbacks and terrified they will be retaliated against next.\nHuman rights advocates and experts have warned for months that conditions at the Hotel Bamy – a run-down establishment that has served as a detention center for US deportees – are dangerous.\nThe US has sent at least 66 people from different African countries, Cuba and Brazil to Equatorial Guinea, which has received $7.5m as part of a deal to cooperate with the US deportation program. The Trump administration has pursued dozens of similar deals with countries to take in immigrants that the US cannot deport directly to their home countries, where judges have deemed they would face torture or persecution. In the past, the US government allowed those people to live and work in the US indefinitely.\nThe Trump administration, however, has sought instead to expel them to third countries where they have no ties, do not speak the local language and have no legal status – trapping them in limbo.\nAdvocates have been especially concerned for deportees sent to Equatorial Guinea, where the authoritarian government is notorious for human rights abuses, including torture, according to the US state department. Detainees held at Hotel Bamy have told the Guardian that armed guards keep watch over them 24/7, and that they have not been provided any medical care or even fresh clothes since arriving there. One of the detainees, who has a severe stomach hernia that requires visits to the hospital to drain his stomach due to excessive fluid build-up, said he has been unable to see a doctor since arriving at Hotel Bamy.\nOther detainees have managed to obtain medication for HIV, diabetes and other conditions via human rights lawyers, but remain fearful that access to medications will be arbitrarily cut off.\nThe two men who were tortured – Ahmed Soliman, 31, of Egypt, and Samson Birhane, 47, of Eritrea – have since been transferred to a prison in Malabo. Multiple witnesses recounted that the police officers shouted, “Where is the phone? Where is the phone!” as they beat the men, who had initially been accused of breaking a mirror at the hotel before they were pulled aside and arrested.\nThe beating, which occurred on 11 September, followed the release of a video first reported by Reuters showing conditions at the hotel and the violent behavior of the guards. The detainees had been using cellphones to communicate with lawyers and the media about the conditions they were facing.\nIn the video taken by Soliman, which lawyers shared with the Guardian, authorities are seen pointing guns at the deportees. A Cuban man asked the officer for the return of his confiscated mobile phone so he could contact relatives and a lawyer, but was ignored. When officers noticed Soliman filming the exchange with his mobile phone, multiple officers rushed at him and others standing nearby, pointed their guns, and told Soliman to remain on his knees with his hands up for 10-15 minutes.\nIn another video, Soliman was able to film authorities forcibly sending US deportees to Ethiopia, where they are likely to face torture. When deportees resisted going with authorities, officials gave them the option to “go back to their home country” or “go to prison”. At least 12 people have been returned by Equatorial Guinea to their home country, where they face persecution.\nIn May, human rights experts at the United Nations issued a rare public appeal asking Equatorial Guinea to halt plans to return deportees to their home countries and to comply with international human rights standards and avoid refoulement, or the expulsion of people to countries where they face persecution.\n“This is a human rights catastrophe,” said Bella Mosselmans, director of the Global Strategic Litigation Council, who represents several of the deportees at Hotel Bamy. The US and Equatorial Guinea “must be held accountable for the atrocities they are committing”, she added.\nIn the week since Soliman and Birhane were beaten, police have also been searching the other detainees’ hotel rooms for cellphones, and have confiscated them. They have also barred lawyers from seeing the deportees. Authorities have told the 29 US deportees who remain at Hotel Bamy that they may never see Soliman or Birhane again, according to lawyers. One detainee who witnessed the beating said authorities treat them as if they ar", "translation_ja": "", "vocab": [{"word": "refoulement", "definition": "国際法において、難民や亡命希望者を迫害や拷問の危険がある国へ強制的に送還することを禁止する原則。この記事では、政治的迫害のリスクがある国への強制送還を指しています。"}, {"word": "authoritarian", "definition": "権力が一人の支配者または少数の指導者に集中し、個人の自由や民主的な参加を制限する政治体制。この記事では赤道ギニア政府の独裁的性質を説明しています。"}, {"word": "deportees", "definition": "その国に居住する権利がないため、母国または第三国へ強制的に送還された人々。この記事の主な対象は米国から送還された個人です。"}, {"word": "limbo", "definition": "不確実な状態にあること、または決定や結果が出ていない不安定な状況。この記事では、法的地位がない第三国に取り残された強制送還者の状況を表しています。"}, {"word": "arbitrarily", "definition": "理性的な理由や公正なルールなく、気まぐれや個人的な判断だけに基づいて行動すること。この記事では、当局が恣意的に医療へのアクセスを制限する可能性を指しています。"}, {"word": "atrocities", "definition": "特に戦争や権力の乱用の文脈での、極めて残酷で非人道的な行為や犯罪。この記事では、拘置施設での暴力や拷問を指しています。"}]}, {"title_ja": "セウタに滞留する数千人の移民が生存のために奮闘", "title_en": "Thousands of Migrants Stranded in Ceuta Fight for Survival", "summary_ja": "7月下旬にモロッコからスペイン領セウタへ記録的な72,000人の移民が2日間で流入した後、約10,000人がセウタに滞留したままになっています。現地の資源が圧倒され、深刻な人道危機が生じています。当局は状況の管理と避難民への適切な支援の提供に苦労しています。", "summary_en": "Following a record influx of 72,000 migrants from Morocco in late July, approximately 10,000 people remain stranded in the Spanish enclave of Ceuta. Local resources have been overwhelmed, creating a severe humanitarian crisis. Authorities are struggling to manage the situation and provide adequate support for the displaced population.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/21/how-thousands-of-migrants-stranded-in-ceuta-are-surviving?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "How thousands of migrants stranded in Ceuta are surviving\nNewsFeed\nHow thousands of migrants stranded in Ceuta are surviving\nAuthorities estimate that at least 10,000 people remain in the enclave of Ceuta after a record surge of 72,000 migrants crossed from Morocco to Ceuta over the course of two days in late July, overwhelming local resources and creating a humanitarian crisis.\nPublished On 21 Sep 2026", "translation_ja": "", "vocab": [{"word": "stranded", "definition": "取り残された、動けない状態にある。移民や難民が移動できず特定の場所に留まることを意味します。"}, {"word": "enclave", "definition": "周囲を他国に囲まれた領土や地域。セウタはモロッコに囲まれたスペイン領です。"}, {"word": "humanitarian crisis", "definition": "人命救助と人道支援が緊急に必要とされる大規模な人道的災害。食糧不足やシェルター不足を含みます。"}, {"word": "surge", "definition": "急激な増加や上昇。移民の大量流入など、短期間での劇的な増加を表します。"}, {"word": "overwhelm", "definition": "圧倒する、対処できなくなるほど大量の負担をかける。地域の資源や能力を超える状況を指します。"}]}, {"title_ja": "ガンビア前『死の部隊』指導者が軍事裁判に出廷", "title_en": "Former Gambian 'Death Squad' Leader Faces Military Trial for Desertion", "summary_ja": "ヤフヤ・ジャメの失脚後の2017年に国を逃れたガンビアの準軍事組織『ジャングラーズ』の元指導者サンナ・マンジャンが脱走罪で軍事法廷に出廷した。ジャメの20年間の統治中に起きた殺害事件の責任を問う別の試みであり、7月に殺人罪の告発が目撃者の召喚困難を理由に取り下げられていた。", "summary_en": "Sanna Manjang, the former head of The Gambia's paramilitary 'Junglers' unit, appeared in military court facing desertion charges after fleeing the country in 2017 following Yahya Jammeh's fall from power. This marks another accountability effort for killings committed during Jammeh's 20-year rule, after murder charges against Manjang were dropped in July due to witness unavailability.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/21/former-death-squad-leader-appears-in-military-trial-in-the-gambia?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Former ‘death squad’ leader appears in military trial in The Gambia\nSanna Manjang faces a military court for deserting the country’s army in 2017 after the end of Yahya Jammeh’s 20-year rule.\nThe former head of the Gambian paramilitary unit known as the “Junglers” has appeared in a military court to face charges of desertion.\nSanna Manjang is accused of deserting the armed forces when the lieutenant colonel fled the country in 2017 after the end of the 20-year rule of President Yahya Jammeh.\nThe case in the capital, Banjul, marks another official bid at accountability for killings which happened when Jammeh was in power, after a murder case against Manjang was dropped in July.\nHe is facing trial for an absence of “a continuous period of nine years with the intention of deserting”. Manjang was arrested in Senegal last November and was repatriated to The Gambia a month later.\nThe Junglers armed group, which operated independently from the Gambian army, has long been accused by the United Nations of extrajudicial killings and torture.\nLongtime leader Jammeh was forced into exile after losing power in 2016 to Adama Barrow, then opposition leader and now president.\nFollowing Jammeh’s departure, the country established the Truth, Reconciliation and Reparations Commission (TRRC). It investigated alleged crimes under his rule and found that between 240 and 250 people were killed by the state. It also found evidence of widespread extrajudicial killings, torture, kidnappings, witch hunts and other abuses.\nSeveral of Jammeh’s accomplices, including Junglers, have been detained and sentenced abroad in Germany, Switzerland and the United States.\nMurder charges dropped\nManjang was previously charged with four counts of murder, including that of AFP journalist Deyda Hydara in 2004, but the charges were dropped in July as The Gambia struggled to summon witnesses, some allegedly members of the death squad.\nIn addition to Hydara’s shooting, Manjang was accused of killing three other men, including one he personally decapitated.\nAfter the charges were dropped, Manjang was charged separately for the assault of two other men in an ongoing trial.", "translation_ja": "", "vocab": [{"word": "paramilitary", "definition": "政府の公式軍隊ではなく、軍事的な訓練と組織を持つ民間の武装集団を指す。通常、国家権力の側で活動する。"}, {"word": "extrajudicial", "definition": "司法制度を経ずに行われる、特に違法な殺人や懲罰を意味する。法の外での国家権力による行為。"}, {"word": "desertion", "definition": "軍隊や職務から無断で長期間離脱すること。軍事法では重大な犯罪とされる。"}, {"word": "repatriated", "definition": "逃亡や亡命中の人物を本国に送還すること。通常は国際協力によって行われる。"}, {"word": "accountability", "definition": "過去の違法行為や人権侵害に対して責任を問い、説明責任を果たすプロセスを指す。"}, {"word": "accomplices", "definition": "犯罪や不正行為に共謀または協力した者。共犯者を意味する。"}]}, {"title_ja": "ネットワークがボイコットする中、トランプ大統領のスピーチが聞き取り不可能に", "title_en": "Trump's White House Speech Drowned Out as Networks Boycott Event", "summary_ja": "トランプ大統領がホワイトハウスの新しいヘリコプター着陸台の公開式典を開催しましたが、ヘリコプターの騒音によりスピーチがほぼ聞き取り不可能となりました。CNNがホワイトハウスから出入り禁止にされたことに抗議して、米国の主要テレビネットワークがこのイベントをボイコットしました。", "summary_en": "US President Trump held a White House helicopter pad unveiling ceremony that was largely inaudible due to helicopter noise. Major American TV networks boycotted the event in protest of CNN being banned from the grounds, leaving only limited media coverage of the speech.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/21/trump-speech-inaudible-as-us-networks-boycott-white-house-event?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Trump speech inaudible as US networks boycott White House event\nNewsFeed\nTrump speech inaudible as US networks boycott White House event\nUS President Trump unveiled a new White House helicopter pad as major US TV networks stayed away in protest over CNN, a member of the network ‘pool’, being banned from the grounds. As Trump spoke, the thunder of a helicopter rendered the president inaudible from start to finish.\nPublished On 21 Sep 2026", "translation_ja": "", "vocab": [{"word": "boycott", "definition": "ある集団や国、企業などに対して、政治的または社会的な抗議の意思を示すため、その製品やサービスの利用を意図的に控えること。"}, {"word": "inaudible", "definition": "聞こえないか、聞き取ることが困難な状態を表する形容詞。音量が小さすぎたり、他の音に遮られたりして、耳に届きにくい。"}, {"word": "unveiled", "definition": "公開する、発表する、初めて人前に出すという意味の動詞。特に新しい製品やプロジェクトを正式に紹介する場合に使用される。"}, {"word": "grounds", "definition": "建物や施設の敷地、敷地内の土地を意味する名詞。ここではホワイトハウスの敷地全体を指す。"}, {"word": "pool", "definition": "ニュースメディアの文脈では、複数のメディア機関が共同で取材・報道するための協力体制を指す。"}]}, {"title_ja": "トランプ大統領、ニューヨークでの会談後に左派マムダニ市長を称賛", "title_en": "Trump praises leftist Mamdani after meeting in New York", "summary_ja": "米国のドナルド・トランプ大統領は2026年9月21日、ニューヨーク市のゾーラン・マムダニ市長と会談し、政治的相違を脇に置いて移民執行と210億ドル規模の住宅プロジェクトについて協議した。トランプは以前マムダニ市長を厳しく批判していたが、両者は驚くほど良好な関係を築いており、これが3回目の公開会談となった。マムダニ市長はニューヨーク市民に利益をもたらす問題でトランプとの協力を続ける意思を示しながらも、様々な政策問題では意見の相違があると述べた。", "summary_en": "U.S. President Donald Trump met with New York Mayor Zohran Mamdani on September 21, 2026, setting aside political differences to discuss immigration enforcement and a $21 billion housing project. Despite Trump's previous harsh criticism of the leftist mayor, the two have developed a surprisingly warm relationship with this being their third public meeting. Mamdani stated he would continue cooperating with Trump on issues benefiting New York while maintaining their disagreements on various policy matters.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-praises-leftist-mamdani-after-meeting-in-new-york/article71493261.ece", "state_media": false, "category": "社会", "full_text": "U.S. President Donald Trump heaped praise Monday (September 21, 2026) on New York Mayor Zohran Mamdani as the pair set aside their political differences to discuss immigration enforcement and a multi-billion dollar housing project.\nMr. Trump, a Republican, heavily criticised Mr. Mamdani before he took office in January — calling him \"my little communist\" and a \"total nut job\" — but the two men have since struck a surprisingly warm relationship.\n\"Hopefully, you're going to be a great [mayor]. I'll be able to say you're going to be a great one, and you're off to a start,\" Mr. Trump told Mr. Mamdani at a news conference.\nTheir closed-door talks in Manhattan, which lasted around an hour, marked the pair's third public meeting since Mr. Mamdani swept the mayoral election last year.\n\"We appreciate the president's commitment to the city,\" Mr. Mamdani said of Trump, who was visiting his hometown New York ahead of the United Nations General Assembly.\nThe 34-year-old said he expressed his \"very strong opinions about how we can keep New Yorkers safe\" when asked about Mr. Trump's culling of Temporary Protected Status for thousands of immigrants as part of mass deportation plans.\nMr. Mamdani said they also spoke about a 12,000-home building proposal in New York, which the pair previously discussed in February and would require an estimated $21 billion in federal government funding.\nHe said he planned to continue cooperating with Mr. Trump, despite acknowledging they have \"many disagreements.\"\n\"We've both spoken about very different approaches, very different beliefs, and I will continue to have conversations with the president, and frankly with anyone who can deliver relief to the people of this city,\" Mr. Mamdani said.\nMr. Trump's visit came as top U.S. television networks essentially boycotted coverage of the U.S. President in protest of his decision to ban three outlets, CNN, MS NOW and Politico, from the White House.\nMr. Mamdani said he had told Mr. Trump that all members of the press would be welcome at their joint press conference, held in front of the mayor's official residence.\n\"That is something that I believe in, is everyone, no matter the opinion or the critique, that we engage,\" he told reporters.\nMr. Trump, me
