e-worst territory.\nMaybe the Trump years will be an aberration, and we’ll see a natural return to the mean at some point down the line, but it’s getting harder and harder to believe that. When the US health secretary, Robert F Kennedy Jr, goes on a quest to “make America healthy again” while talking of his high-protein breakfast of “a cheeseburger and three eggs,” you have good reason to want to throw in the towel. When the Food and Drug Administration is recalling food as fast as under-regulated companies can poison it with salmonella, you have good reason to want to curl up into a ball and eat tainted blueberries until the lights go out.\nDon’t.\nThe net effects of the endless absurdities and depravities is disorientation and despair. The worst-case outcome is complacency. It’s overly generous to attribute strategic intent to the Trump administration when it rolls out stupidity at scale, though it’s possible a few of them might have a plan worked out. Either way, it doesn’t matter. The counter-plan, from those of us who want to resist, demands that we focus on the consequences of the Trump administration’s stupidity, and seek to build a broad coalition of those dedicated to addressing this challenge with serious, aggressive and sustained action.\nThe news that Canada and the European Union are considering an “associate status” for the decidedly not European country suggests that efforts at moving beyond US hegemony are under way. Whether such an arrangement would benefit Canada, the EU, both or neither is separate from the directional soundness of the effort: trying to leave the US behind, or at least minimising contact with it, is a good idea.\nTrump responded to the news by declaring that the US would consider a new Canada-EU relationship a “hostile act” and threatened to cut off trade with Europe. This reaction is a masterclass in proving the wrong point – and another instance of foolish tactics. By protesting too much, Trump betrays that he does care a great deal. Unwise. Unsound. Pathetic.\nWe can’t ignore the stupidity of the Trump administration and its true believers, but nor should we assume it’s a new, inevitable normal. Ultimately, there are more people who want a return to a saner world than t", "translation_ja": "", "vocab": [{"word": "hegemony", "definition": "ある国や勢力による支配的影響力。国際政治で、特定の大国が世界秩序に対して行使する優越的な力を指す。"}, {"word": "absurdity", "definition": "非常に荒唐無稽で理不尽なこと。常識に反する不合理な言動や状況を表す。"}, {"word": "petulance", "definition": "子どもっぽく不機嫌になる態度。ささいなことで怒ったり、わがままに振る舞う傾向。"}, {"word": "exasperated", "definition": "極度に怒った、または失望した状態。長く続く不快な状況に対する強い不満を示す。"}, {"word": "mitigation", "definition": "問題や損害を軽減または緩和すること。特に環境用語では、気候変動の悪影響を減らす対策を意味する。"}, {"word": "complacency", "definition": "自己満足的な態度。危険な状況でも安心しきっている無責任な心理状態。"}, {"word": "coalition", "definition": "共通の目的のために一時的に結合した複数の団体や国家の連合。"}]}, {"title_ja": "国連を縮小すべき", "title_en": "Shrink the UN", "summary_ja": "著者は、国連が野心的なグローバルガバナンスの目標を放棄し、危機予防、紛争解決、人道支援などの基本機能に焦点を当てるべきだと主張している。加盟国が一貫して実行に移さない包括的な国際協定を追求するのではなく、大国間競争に適応した縮小された国連こそが、この組織にとって唯一の実行可能な道かもしれないと述べている。", "summary_en": "The author argues that the UN should abandon its overambitious global governance agenda and instead focus on core functions like crisis prevention, conflict resolution, and humanitarian aid. Rather than attempting comprehensive international agreements that member states consistently fail to implement, a slimmed-down UN adapted to great-power competition may be the only viable path forward for the organization.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/united-nations-general-assembly-secretary-general", "state_media": false, "category": "オピニオン", "full_text": "The United Nations, international officials sometimes joke, is always in crisis. Since its inception in 1945, the organization has had to navigate deep geopolitical tensions, devastating humanitarian disasters, and periodic budget shortfalls. But as world leaders gather in New York for the annual General Assembly high-level week, the UN appears to be in particularly bad shape. China, Russia, and the United States, three of the five veto-wielding powers that dominate the Security Council, have prevented it from acting on wars in Iran and Ukraine and civil conflicts in Myanmar and Sudan. Poor countries complain that donor states have not met their UN pledges on development spending. And the Trump administration halted most U.S. funding to UN activities last year, forcing the organization to cut back on its peacekeeping and relief efforts.\nWith challenges mounting, an upcoming leadership transition may decide whether the UN can stabilize itself and perhaps even regain some credibility—or slide further into decrepitude. Current Secretary-General António Guterres plans to step down at the end of the year, having struggled to reverse the organization’s political fortunes in his decadelong tenure. He has spent much of his last two years in office grappling with staff reductions and other cost-cutting measures to ensure the UN secretariat does not go bankrupt on his watch. His has been a thankless task, but diplomats and UN officials hope a new leader will be able to take a longer-term approach to refreshing the institution and keeping governments committed to multilateralism.\nThe small crop of candidates to succeed Guterres include senior UN trade official Rebeca Grynspan, Director General of the International Atomic Energy Agency Rafael Grossi, and Guyana’s Ambassador to the UN Carolyn Rodrigues-Birkett. Regardless of who wins, Guterres’ successor will need to develop a new playbook for revitalizing the organization. Any serious effort must acknowledge an unpleasant reality: as long as the world remains competitive and chaotic, the UN’s ability to forge wide-ranging international agreements will remain constrained.\nThe next secretary-general’s best hope may thus be to relinquish some of the organization’s previous lofty ambitions and slim down, prioritizing international crisis prevention and conflict resolution, the efficient provision of humanitarian aid, and achievable international development goals. A UN that jettisons time-consuming diplomatic processes and inefficient bureaucracies for a few core functions may disappoint ardent advocates of global governance. But it also may be the only version of the organization still viable in an era of great-power competition and austerity.\nLESS MONEY, MORE PROBLEMS\nSince the end of the Cold War, UN chiefs have responded to moments of crisis by arguing that the institution should do more, not less. Boutros Boutros-Ghali, the first secretary-general of the post–Cold War era, envisioned the UN as a supercharged global peacemaking body, but during his final years in office, after blue helmet peacekeepers failed to prevent the Rwandan genocide in 1994 and the Srebrenica massacre in Bosnia in 1995, the organization briefly retrenched. Beginning in the late 1990s, Boutros-Ghali’s successor, Kofi Annan, set out a new approach, establishing fresh poverty-reduction goals, battling AIDS, and launching UN peace operations in Kosovo, Timor-Leste, and several African countries. The U.S. war in Iraq, in 2003, split the Security Council and temporarily derailed Annan’s agenda, but he organized a global summit in 2005 to persuade governments to recommit to multilateralism and led the establishment of a new Peacebuilding Commission and the Geneva-based Human Rights Council the following year.\nIn the two decades since Annan left office, his successors, Ban Ki-moon and Guterres, have had to contend with a mounting catalog of crises, above all the Syrian civil war, which divided the Security Council for over a decade. As the number of conflicts, humanitarian crises, and natural disasters increased, so, too, did the UN’s budget. The combined revenue of all UN entities rose from $40 billion in 2010 to a high of $74 billion in 2022, driven in considerable part by greater humanitarian spending.\nBan and Guterres also repeatedly appealed to UN members to show greater solidarity. Ban championed the Paris climate change pact in 2015. Guterres convened a “Summit of the Future” in 2024, at which member states promised to cooperate on issues as varied as artificial intelligence and intergenerational justice. These agreements demonstrated vision and extraordinary diplomatic effort; the Paris accord won particularly widespread public support. But UN member states have often failed to honor the commitments outlined in past agreements, breeding a skepticism over the effectiveness of multilateralism that has in turn made it harder to get mistrustful members to sign onto new deals with binding legal force", "translation_ja": "", "vocab": [{"word": "decrepitude", "definition": "衰退、劣化の状態。組織や制度が老朽化し機能が低下していくことを指す。"}, {"word": "jettison", "definition": "不要なものを捨てる、放棄する。通常は荷物を船から投げ捨てることが原義だが、比喩的に計画や政策を中止することを意味する。"}, {"word": "austerity", "definition": "緊縮、倹約。政府が支出を削減し経済を引き締める政策、または厳格で質素な状態を指す。"}, {"word": "retrenched", "definition": "縮小する、経費を削減する。組織が規模や活動を減らすことを意味する。"}, {"word": "multilateralism", "definition": "多国間主義。複数の国が協力して国際問題を解決する外交政策のアプローチ。"}, {"word": "binding", "definition": "拘束力のある、法的義務のある。契約や合意が当事者を法的に拘束することを意味する。"}]}, {"title_ja": "アメリカが必要とするもの、中国はまだ持っている", "title_en": "China Still Has What America Needs", "summary_ja": "著者は、トランプ政権が関税を通じて中国に対する優位性があると想定しているのは誤りであり、レアアースなど重要な投入物の支配により中国が経済的優位性を保持していると主張している。ゼロサムの貿易対立を追求する代わりに、米国は中国から戦略的商品の備蓄を進めつつ、長期的に代替供給源を構築する実用的な経済外交を追求すべきだと述べている。", "summary_en": "The author argues that the Trump administration's assumption of leverage over China through tariffs is misguided, as China maintains escalation dominance in the bilateral economic relationship due to its control of critical inputs like rare-earth elements. Rather than pursuing zero-sum trade confrontation, the U.S. should pursue pragmatic economic diplomacy focused on stockpiling strategic goods from China while building alternative supply chains over the longer term.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/china-still-has-what-america-needs-adam-posen", "state_media": false, "category": "オピニオン", "full_text": "The Trump administration approached its summit with Chinese leader Xi Jinping in October 2025 projecting confidence, asserting that it held leverage over China as the trade deficit country in the bilateral relationship. As U.S. Treasury Secretary Scott Bessent put it, “What do we lose by the Chinese raising tariffs on us? We export one-fifth to them of what they export to us, so that is a losing hand for them.” This was quickly shown to be folly. As I argued in Foreign Affairs, trade wars are easy to lose when countries depend upon an exporter for hard-to-replace inputs, yet still conceive of trade as a zero-sum game. China has escalation dominance over the United States, meaning that at any level of threat, the Chinese government has the ability to inflict more pain on the United States than vice versa. To ease Beijing’s restrictions on rare-earth elements, for example, which allow China to control 80 to 90 percent of production, the United States has conceded on tariffs, technology controls, and visa policies during various negotiations.\nBut Washington’s inability to immediately decouple, let alone extract concessions, from China through tariff threats should not mean giving up on economic diplomacy. For centuries, lesser powers in the world economy subject to escalation dominance have navigated relations with their more powerful adversaries by bargaining while avoiding confrontation. In fact, until recently, that is how China—and essentially all other countries—have viewed their economic interactions with the United States, to the occasional frustration of U.S. officials.\nEconomic relationships are not all or nothing; they have room for resistance and cooperation, even if one side would clearly lose if it came down to outright conflict. Despite the high distrust and strategic rivalry between the two countries, the U.S.-Chinese economic relationship does not have to be played as a zero-sum game. The benefits from trade and diversification for both economies remain substantial, and China’s escalation dominance would not spare its own economy pain if it were forced into a tit-for-tat conflict with Washington. Indeed, Beijing, comfortable with the status quo, has little interest in such escalation.\nAt the upcoming summit between Xi and President Donald Trump, the U.S. government should initiate a different approach to the economic relationship by pursuing increased imports of key strategic goods as well as increased foreign direct investment from China. This should be only one part of a broader economic strategy, of course. Cooperation with allies will be necessary to encourage any sustained changes in Chinese commercial behavior and to diversify sources of supply over the longer term. A more complex assessment of Xi’s strategic goals and China’s vulnerabilities will also be needed for longer-term strategic success. But this meeting—and any that follow—give Washington a valuable opportunity to buy time to address the country’s acute needs.\nSTART WITH STOCKPILING\nDespite a decade of denouncing the threat of Chinese imports and investment, under both the Trump and the Biden administrations, the U.S. government has failed to meaningfully decouple even the most sensitive industries from China. As the economists Mary Lovely and Christine Wan have shown, declining direct U.S. imports from China have simply resulted in supply chains becoming more attenuated and less transparent. China remains the source of rare earths, specialized magnets, and the lower-end semiconductors used in autos and appliances, even if intermediate steps of production now take place elsewhere. In the critical area of pharmaceuticals, for example, the United States may import numerous generic drugs from India, but India relies on China for the feedstocks and components to produce them.\nThis situation is precisely why industrial decoupling is such an uphill battle: strong economic fundamentals drove these commercial arrangements and unwinding them is slow and costly. For now, Washington’s most important priority should be to build up short-term inventories of those strategic goods ultimately sourced from China. In an ideal world, the United States would immediately get them from elsewhere, but the Trump administration, like the Biden administration before it, has not made significant progress on this front. Both tried, but failed, to incentivize the creation of alternative sourcing through wider access to the U.S. market or other compensation. And at their worst, in some benighted attempt to spontaneously create U.S. production through deprivation, both tried to force American businesses to do without Chinese inputs through tariffs and restrictions.\nMeanwhile, U.S. officials have wasted past summits and negotiations by trying to convince their counterparts in Beijing to increase Chinese imports of various nonstrategic goods, none of which China values most. These efforts may be rationalized by current and former officials as a bank shot to mak", "translation_ja": "", "vocab": [{"word": "escalation dominance", "definition": "相手が対抗措置を講じた場合に、より大きな経済的・戦略的ダメージを与える能力。国家間の紛争において一方が他方より有利な立場にあることを示す概念。"}, {"word": "decouple", "definition": "経済や産業の供給網を他国から分離・独立させること。中国からの依存を減らすため、代替供給源へと移行するプロセスを指す。"}, {"word": "attenuation", "definition": "供給網が複雑化し、透明性が低下する状態。中間段階が増えることで、最終的な出所が不明確になることを意味する。"}, {"word": "zero-sum game", "definition": "一方の利益が他方の損失と等しい状況。この場合、米中間の経済関係で一国の利益が他国の損失につながると考える競争的関係を指す。"}, {"word": "feedstock", "definition": "製造業や産業の生産に使用される原材料や基礎物質。医薬品製造の場合、原薬や中間化学品などの基本となる材料を指す。"}, {"word": "incentivize", "definition": "市場アクセスやその他の補償を通じて、特定の経済行動を促進または奨励すること。政府が企業や国に望ましい行動をとらせるための手段として使用される。"}]}, {"title_ja": "エボラは始まりに過ぎない", "title_en": "Ebola Is Only the Beginning", "summary_ja": "著者は、コンゴ民主共和国での現在のエボラ流行を抑制できないことが、世界的な保健安全保障システムの重大な欠陥を明らかにしていると主張している。自然発生的なウイルスがより頻繁に出現し、AI技術による病原体操作の生物学的リスクが増加し、国際保健インフラが弱体化する中で、世界は将来の生物学的脅威にますます対応できていない。", "summary_en": "The author argues that the inability to contain the current Ebola outbreak in the Democratic Republic of the Congo reveals critical failures in global health security systems. With naturally occurring viruses emerging more frequently, rising biosecurity risks from AI-enabled pathogen engineering, and weakened international health infrastructure, the world is increasingly unprepared for future biological threats.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/democratic-republic-congo/ebola-only-beginning", "state_media": false, "category": "オピニオン", "full_text": "The Ebola outbreak in the Democratic Republic of the Congo is a stunning indictment of the state of global health security. The epidemic should have been containable; few threats are as familiar to health officials and institutions as this one. Ebola viruses were first discovered in northern Congo (then Zaire) in 1976; since then, they have caused 16 outbreaks in that country and dozens more in the region. Ebola remains highly lethal, but over the past five decades, medical professionals and governments have learned how to diagnose the disease, detect its spread, and, when caught early, stop it. Yet the outbreak that has killed over 3,500 people across Congo since early this year is already the deadliest the country has experienced and the fastest spreading in history. Despite recent signs of progress, it is nowhere near being contained.\nThe difficulty containing this year’s Ebola outbreak does not bode well for the world’s ability to respond effectively to future biological threats. Naturally occurring viruses are emerging more frequently. There were 12 recorded outbreaks of Ebola and Marburg, another deadly disease from the same viral family, during the four years of the Biden administration, compared with five during the previous four years; the current Trump administration could well face even more, having already contended with five outbreaks in less than two years. And the risk of an accidental or deliberate release of a deadly virus is growing. A rising number of labs are handling high-risk pathogens, in part because of a research boom following the COVID-19 pandemic, and it is becoming easier and easier to engineer new viruses using artificial intelligence. Earlier this month, the American AI company Anthropic disclosed five cases in which scientists used its AI software Claude for research that could support biological weapons development, including on variants of bird flu that could evade human immunity. The report confirmed fears that AI models could help bad actors access biological weapons.\nThe global health system, meanwhile, has been weakened by the Trump administration’s cuts to disease surveillance and outbreak preparedness programs, both within the United States and abroad. But the system was shaky long before U.S. President Donald Trump arrived on the scene. Global threat monitoring processes have significant gaps, inconsistent funding models delay vaccine development, and most countries underinvest in regular, comprehensive health services. Washington and other donors often step up when a crisis emerges, but scrambling to put together an emergency response is far from the best way to handle a biological threat. That approach is struggling to contain Ebola today. When a new, lesser-known pathogen begins to spread, the world needs to be much better prepared.\nTHE CRISIS IN CONGO\nThe current outbreak in Congo likely began at least eight months ago. Residents of Mongbwalu, a small town in the northeastern part of the country, described entire families dying from a mysterious illness as early as January. The virus spread for months before the Congolese government, with help from the World Health Organization (WHO), was able to confirm the source of the outbreak in mid-May. By then, hundreds of cases had already been detected across multiple communities in Congo, and two cases had been confirmed in Uganda. Some delay in detection is to be expected, given the remote location of the earliest deaths, ongoing conflict in the area, and the rarity of this outbreak’s driver, the Bundibugyo virus. But the fact that no previous Ebola outbreak had spread as far before being detected suggests that the global health system is becoming less, not more, prepared to manage biological threats.\nFour months after the outbreak was confirmed, responders from the Congolese government, the WHO, and the Africa Centres for Disease Control and Prevention (Africa CDC) are still struggling to contain it. The death rate sits at around 50 percent, much higher than in past Bundibugyo outbreaks, and 60 percent of deaths between mid-July and late August happened outside health facilities. These two patterns suggest that the true numbers of illnesses and deaths are higher than the official figures and that the disease continues to spread beyond the reach of health officials. Although there have been some signs of progress recently, WHO Director General Tedros Adhanom Ghebreyesus has warned that, if the outbreak’s current trajectory continues, the death toll could exceed that of the world’s largest-ever Ebola outbreak, the epidemic that killed more than 11,000 people and infected nearly 30,000 across West Africa between 2014 and 2016.\nThe United States’ withdrawal from the WHO and dissolution of the U.S. Agency for International Development almost certainly weakened the capacity of both the WHO and the Congolese government to respond to the Ebola outbreak. Nicholas Enrich, a career civil servant who briefly led USAID’s global he", "translation_ja": "", "vocab": [{"word": "indictment", "definition": "強い批判や非難。ここでは世界保健体制の失敗を厳しく指摘する意味で使用されている。"}, {"word": "lethal", "definition": "死をもたらす、致命的な。ウイルスや病気が非常に危険であることを示す医学的な用語。"}, {"word": "pathogen", "definition": "病気を引き起こす微生物やウイルス。公衆衛生学で頻繁に使われる専門用語。"}, {"word": "surveillance", "definition": "疾病や脅威を監視・追跡すること。公衆衛生分野で、病気の流行を早期に発見するための活動。"}, {"word": "trajectory", "definition": "進行状況や経路。ここでは流行病がどのように進展していくかという動きを指している。"}, {"word": "scrambling", "definition": "急いで対応すること。緊急時に十分な準備なく対応しようとする様子を表す。"}]}];
const FOCUS = null;
let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-21 23:46 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
