anwhile, brushed off a suggestion that he had issued the media bans to distract the public from criticism of the war in Iran.\n\"It's interesting because they [the media] said they were going to boycott me, but they never boycott me, so I wasn't very worried about that,\" he said.\nPublished - September 22, 2026 04:25 am IST", "translation_ja": "", "vocab": [{"word": "heaped praise", "definition": "大量の賛辞を浴びせること。人や物事に対して、惜しみなく褒め言葉を与える表現です。"}, {"word": "culling", "definition": "不要なものを選別して削除、廃止すること。ここでは移民の一時保護ステータスを廃止する意味で使われています。"}, {"word": "boycott", "definition": "抗議や圧力を目的として、特定の企業やサービスの利用を拒否すること。政治的や社会的な主張の手段として用いられます。"}, {"word": "striking", "definition": "著しい、顕著な、印象的な。「striking warm relationship」は驚くほど良好な関係を意味します。"}, {"word": "Temporary Protected Status", "definition": "一時保護ステータス。米国が自然災害や紛争の影響を受けた国の国民に対して一時的に与える移民ステータスのことです。"}]}, {"title_ja": "不安定な宇宙空間：米国の軌道上宇宙制御兵器について", "title_en": "Unsafe space: On the U.S. and 'on-orbit space control weapons'", "summary_ja": "米国が敵対者からの防御を目的とした軌道上宇宙制御兵器を配備したことで、衛星セキュリティと潜在的な紛争に関する国際的な懸念が生じています。「敵対的行為」の構成要件とこれらの兵器の動作方法が不明確であるため、既存の国際条約が現代の二重用途衛星システムに対応できていないなか不安定性が増しています。国連と米政府は、宇宙での軍拡競争を防ぐために、明確なエスカレーション閾値を伴う多国間統治枠組みを確立すべきです。", "summary_en": "The U.S. has deployed orbital space control weapons to defend against adversaries, raising international concerns about satellite security and potential conflicts. The lack of clarity on what constitutes 'hostile action' and how these weapons operate creates instability, as existing international treaties are inadequate for modern dual-use satellite systems. The U.N. and U.S. government should establish multilateral governance frameworks with clear escalation thresholds to prevent an arms race in space.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/editorial/unsafe-space-on-the-us-and-on-orbit-space-control-weapons/article71476527.ece", "state_media": false, "category": "社会", "full_text": "Although the U.S. military doctrine was openly considering offensive and defensive space control by 2025, the admission on September 14 by U.S. Air Force Secretary Troy Meink, and confirmed by Space Force chief Gen. Douglas Schiess, that the country has deployed “on-orbit space control weapons” to “defend against hostile adversary action” is cause for concern. Satellite systems increasingly underpin communications, energy, and financial networks and many commercial systems serve civilian and military users. To that end, the U.S., Russia, China, and India, among others, have been developing counter-space capabilities while contributing to the technological and strategic environment rendering earth orbit the next major battlefield. The increasing military use of commercial satellites can endanger the protections they enjoy under international humanitarian law even as this law is underprepared for satellites being highly interconnected and often dual-use. That said, the details that justify the need for orbital defence systems also make poorly specified weapons a potential cause of instability. Mr. Meink described the weapon as defensive, but U.S. military doctrine defines “space control” as encompassing both offensive and defensive operations.\nCompounding the consequences of confusion when two steerable satellites approach each other without understanding the other’s intentions — including due to future autonomous satellites running artificial intelligence models onboard — is the lack of policy details. What constitutes “hostile action” and what the weapon can do remain unclear. While the Outer Space Treaty does not ban weapons in orbit per se, Article IV prohibits nuclear weapons or other weapons of mass destruction in orbit — a fluid line considering the centrality of satellite-based networks for contemporary society and the ability of conventional weapons to render damage en masse; its Article III also requires space activities to comply with international law. But when an autonomous, dual-use orbital asset operated by a commercial entity initiates an unwanted defensive strike, the existing rules, including the Liability Convention, cannot be applied straightforwardly to determine accountability. The rules have become too coarse for what contemporary technologies, and the declining esteem for a rules-based world order, warrant. The U.N. Open-Ended Working Group on the ‘Prevention of an Arms Race in Outer Space’ should offer governments an opportunity to address the disclosure. The U.S. government should also reveal the particulars of the weapons it has deployed, and enter into a multilateral governance arrangement that defines exact thresholds of action and escalation.\nPublished - September 22, 2026 12:10 am IST", "translation_ja": "", "vocab": [{"word": "on-orbit", "definition": "軌道上に配置された、またはその場で機能する。衛星やその他の宇宙資産が宇宙空間で実際に動作している状態を指します。"}, {"word": "counter-space capabilities", "definition": "敵の衛星やスペースシステムに対抗するための軍事的能力。衛星破壊やジャミング、電子戦などの技術を含みます。"}, {"word": "dual-use", "definition": "民間と軍事の両方の目的に使用できる。ここでは衛星システムが商用と軍事の両方で利用されていることを意味します。"}, {"word": "escalation", "definition": "段階的な緊張や紛争の拡大。軍事的対立が徐々に激化していくプロセスを指します。"}, {"word": "multilateral governance", "definition": "複数の国家または機関が参加する統治・管理体制。国際的な問題解決のために複数の関係者が協力する枠組みです。"}, {"word": "coarse", "definition": "粗い、不正確である。ここでは既存の国際法が現代の技術に対応するには不十分であることを表しています。"}]}, {"title_ja": "米国、建設現場の光ファイバーケーブル切断により東海岸の便を一時停止", "title_en": "U.S. halts East Coast flights after fiber cable cut at construction site", "summary_ja": "連邦航空局（FAA）は2026年9月21日、ニュージャージー州の建設現場で光ファイバーケーブルが誤って切断されたため、ニューヨーク、フィラデルフィア、ボストンの主要空港での便を一時停止した。600便以上が遅延し、ニューアークでは平均112分の遅延が発生した。FAA は代替回路がまもなく稼働するとし、早午後までに便が徐々に再開されると述べた。", "summary_en": "The Federal Aviation Administration halted flights at major East Coast airports in New York, Philadelphia, and Boston on September 21, 2026, after a fiber cable was accidentally cut by a construction crew in New Jersey. Over 600 flights were delayed, with Newark experiencing average delays of 112 minutes. The FAA stated a backup circuit would be operational soon, with flights gradually resuming by early afternoon.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-halts-flights-at-busy-east-coast-airports-says-fiber-line-cut-at-construction-site/article71493081.ece", "state_media": false, "category": "IT", "full_text": "The Federal Aviation Administration halted flights at busy East Coast airports in New York, Philadelphia and Boston on Monday (September 21, 2026), saying a fiber cable was accidentally cut at a construction site in New Jersey, U.S.A.\nHowever, President Donald Trump’s flight from Washington to New York was able to depart as scheduled.\nGround stops were issued for John F. Kennedy Airport and LaGuardia airports, as well as an airport in Teterboro, New Jersey, as 130 world leaders and dozens of ministers are arriving in New York for the annual high-level meeting of the United Nations General Assembly.\nFAA Administrator Bryan Bedford told reporters a backup fiber line had been cut accidentally by a construction crew in New Jersey, prompting significant flight cuts.\nHe said a new circuit would be operational imminently. It was not clear when the ground stops at the New York-area airports would be lifted.\nFlightAware, a flight-tracking site, said more than 600 flights at Newark and Philadelphia, or more than 20%, had been delayed at Philadelphia Terminal Radar Approach Control. Newark is a major United Airlines hub, while Philadelphia is an American Airlines hub.\nThe issue has also forced the diversion of a number of flights to other airports. Flightradar24, a flight-tracking site, said flights were being delayed by an average of 112 minutes at Newark.\nBy early afternoon, some flights were starting to resume at LaGuardia, Kennedy and Philadelphia. However, significant delays were expected through the rest of the day.\nSome airlines were allowing their customers to change flights without charging them fees. The FAA advised travelers to check the status of their flights with their airline before heading to the airport.\nIn May 2025, the facility that guides air traffic in and out of Newark Airport suffered a series of significant communications outages.\nThe FAA said last year a telecommunications outage impacted communications and radar displays at Philadelphia TRACON.\nLast year, Congress approved $12.5 billion to address the aging air traffic control system and boost controller hiring following decades of complaints over airport congestion and flight delays and a series of technology issues in recent years.\nPublished - September 22, 2026 01:08 am IST", "translation_ja": "", "vocab": [{"word": "ground stop", "definition": "航空機の着陸を一時的に禁止する措置。管制上の緊急事態時に発令される。"}, {"word": "diversion", "definition": "航空機が予定の目的地ではなく、別の空港に向かうこと。気象や技術的問題が原因となることが多い。"}, {"word": "TRACON", "definition": "Terminal Radar Approach Control の略称で、空港周辺の航空機管制を行う施設。レーダーと通信を使用して安全な着陸を指導する。"}, {"word": "telecommunications outage", "definition": "通信システムの突然の遮断。航空管制では特に重大な影響をもたらす。"}, {"word": "circuit", "definition": "通信やデータ伝送のための回線または経路。バックアップ回路は代替経路として機能する。"}]}, {"title_ja": "COVID時代の「自由」政治がポリエーブルの保守党を形作り続ける", "title_en": "COVID-era 'freedom' politics continue to shape Poilievre's Conservative Party", "summary_ja": "ピエール・ポリエーブルの保守党は、COVID-19パンデミック中に生まれた政治運動、特に「自由」メッセージング周辺の影響を受け続けている。これらのテーマは党のアイデンティティの中心的要素であり続けながら、同時にこの基盤を超えた支持を広げるための継続的な課題をもたらしている。", "summary_en": "Pierre Poilievre's Conservative Party continues to be influenced by the political movements that emerged during the COVID-19 pandemic, particularly around 'freedom' messaging. These themes remain central to the party's identity while simultaneously presenting ongoing challenges as they work to broaden their appeal beyond this base.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijAJBVV95cUxNM3B4eU01eWRMcmE0R2hMU0tSQjhHRm5SUzRBTGdEREJfNVBHaVlNaXZRQ1FOUVZFR080a25BSU9NVDdLS3Zrb29YWS04XzI1MjdGSjhOdWxLalp1YXk1RkJ6d2NFQTJjMUZJeEtZa3BjOEdKN urce": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "控訴裁判所、マグ氏の5年間の代理EFCC議長職は違法と判断", "title_en": "Appeal Court Rules Magu's Five-Year Acting EFCC Tenure Illegal", "summary_ja": "ナイジェリアの控訴裁判所は、2015年から2020年にかけてのイブラヒム・マグ氏による5年間の代理EFCC議長職は違法であると宣言し、下級裁判所の判決を覆した。裁判所は、上院による彼の正規議長候補の拒否にもかかわらず、マグ氏は代理職を無期限に継続することはできないと判決した。その後、2021年にアブドゥルラシード・バワ氏がEFCC正規議長に任命された。", "summary_en": "Nigeria's Court of Appeal has declared that Ibrahim Magu's five-year tenure as acting EFCC chairman from 2015 to 2020 was illegal, overturning a lower court decision. The court ruled that despite the Senate's rejection of his nomination for confirmation, Magu could not continue indefinitely in an acting capacity. Abdulrasheed Bawa has since been appointed as substantive EFCC chairman in 2021.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/911423-appeal-court-declares-magus-prolonged-acting-tenure-as-efcc-chairman-illegal.html", "state_media": false, "category": "政治", "full_text": "The Court of Appeal in Abuja has declared the prolonged tenure of Ibrahim Magu as the acting acting chairman of the Economic and Financial Crimes Commission (EFCC) for five years as ilegal.\nThe Court of Appeal came to that conclusion after overturning a judgement of the Federal High Court in Abuja allowing Mr Magu to remain in office in acting capacity from November 2015 to July 2020, despite the Nigerian Senate’s refusal to confirm his appointment.\nAccording to a report by Sahara Reporters, a three-member panel of the appellate court delivered the judgement on Monday in an appeal filed by Abuja-based lawyer and activist, Johnmary Jideobi, against the judgement of the Federal High Court, Abuja.\nMr Jideobi challenged Mr Magu’s continued stay in office after the Senate rejected his nomination as substantive EFCC chairman twice.\nThe Senate, the Attorney-General of the Federation, the EFCC and Mr Magu were respondents in the appeal.\nMr Jideobi filed the original suit on 2 March 2017, arguing that Mr Magu, who had been acting chairman since 2015, could not continue indefinitely after the Senate rejected his nomination.\nThe Senate rejected his nomination for confirmation as substantive chairman twice, with the second rejection coming in March 2017.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMr Jideobi argued that the Senate’s rejection brought Mr Magu’s acting appointment to an end and that he could not remain in the position indefinitely.\nHe also argued that the EFCC chairman’s tenure is four years, renewable once, and that Mr Magu had exceeded that period without Senate confirmation.\nWhat the Federal High Court said\nThe lower court judge Ijeoma Ojukwu dismissed the suit in her 2019 judgement.\nShe held that the EFCC Establishment Act did not specify how long an acting chairman could remain in office.\nAccording to the judge, the gap in the law left the the then-Presidrnt Muhammadu Buhari with discretion over the duration of an acting appointment.\nSection 2(3) of the EFCC Establishment Act provides that the chairman and members of the commission are appointed by the President subject to confirmation by the Senate.\nThe Act also provides for a four-year tenure for the chairman and members, renewable once.\nAppeal court overturns judgement\nThe Court of Appeal has now overturned the Federal High Court’s decision and ruled that Mr Magu’s prolonged acting tenure was unlawful.\nMr Magu’s tenure as acting EFCC chairman had already ended in July 2020, when then-President Buhari suspended him amid allegations of misconduct and irregularities.\nREAD ALSO: EFCC recovers, hands over N140 million to loan, investment company\nMr Magu denied the allegations and appeared before a presidential investigative panel headed by retired Justice Ayo Salami.\nAbdulrasheed Bawa was appointed substantive EFCC chairman in February 2021.\nThe Court of Appeal’s judgement therefore concerns the legality of Mr Magu’s former acting tenure and has no bearing on the current leadership of the EFCC.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "appellate", "definition": "控訴または上級審に関する。より高い裁判所による審査や決定を扱う法律用語。"}, {"word": "tenure", "definition": "職務を保持する期間。特に公職や重要な地位の在任期間を指す。"}, {"word": "substantive", "definition": "正式な、本質的な。一時的ではなく、正規または永続的な地位や役職を意味する。"}, {"word": "discretion", "definition": "裁量権、判断の自由。法律や規則の範囲内で個人が決定を下す自由。"}, {"word": "misconduct", "definition": "不正行為、職務怠慢。特に公務員や専門職の者による不正な行動や行為。"}, {"word": "overturned", "definition": "覆す、取り消す。前の判決や決定を無効にして新しい判断を下すこと。"}]}, {"title_ja": "ワイク氏、2027年上院議長へのウゾディンマ支持を決して行わないと誓約", "title_en": "Wike Vows Never to Support Uzodimma for Senate President in 2027", "summary_ja": "ナイジェリアのFCT大臣ニェソム・ワイク氏は、イモ州知事ホープ・ウゾディンマ氏の上院議長立候補を決して支持しないと公式に宣言し、自らの政治的野心を守るためにレインボー連立に反対していると非難した。ワイク氏は、ウゾディンマ氏が上院議長職への支持を固めるために他の知事に忠誠的な候補者の指名を強要していると主張し、議論の多い知事就任経路を踏まえた彼の政治的正統性に疑問を呈した。", "summary_en": "Nigeria's FCT Minister Nyesom Wike has publicly declared he will never support Governor Hope Uzodimma's bid to become Senate President, accusing him of opposing the Rainbow Coalition to protect his own political ambitions. Wike alleged that Uzodimma is pressuring other governors to nominate loyal candidates to consolidate support for his senatorial presidency, while questioning Uzodimma's political legitimacy given his controversial path to the governorship.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/headlines/911390-why-ill-never-support-uzodimma-to-become-senate-president-wike.html", "state_media": false, "category": "政治", "full_text": "Nigeria’s Minister of the Federal Capital Territory (FCT) Nyesom Wike has vowed that he will never support Governor Hope Uzodimma of Imo State to emerge as the country’s Senate President in 2027.\nMr Wike disclosed this on Monday night when he appeared as a guest on TVC News’ Journalists’ Hangout which was monitored by PREMIUM TIMES.\n“Of course, life or death, I will never support Hope Uzodinma to become the Senate President of Nigeria. Everybody knows that,” he said.\nThe FCT minister suggested that Mr Uzodimma was opposed to his Rainbow Coalition Movement because the governor believed the movement would affect his ambition to become Senate president.\nMr Wike runs the Rainbow Coalition, a multi-party political arrangement, to support President Tinubu’s 2027 re-election bid.\nThe All Progressives Congress governors, under the aegis of the Progressives Governors Forum (PGF), are opposed to the coalition, describing it as a political arrangement that could undermine the party and its candidates ahead of the 2027 elections.\nThe PGF is chaired by Mr Uzodimma, who has picked the APC’s ticket for Imo West District despite the fact that his tenure as governor will elapse in January 2028, six months after the next Senate would have been inaugurated in June 2027.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n‘Personal interests, ambition’\nSpeaking on the TV show, Mr Wike accused Mr Uzodimma of using his position to advance his personal political ambitions.\nHe argued that some governors who lost out in the APC’s nomination process found alternative platforms to contest the 2027 elections.\n“Now, the other people who they have removed and not given tickets have found an alternative to run. And he (Uzodimma) knows that if they run and they win, it means that they are not going to support him to be the Senate President and that knowing fully well that they are running under Wike’s support of PDP, they will not support them,” he said.\n‘How Hope Uzodimma planned to become Senate President’\nMr Wike alleged that Mr Uzodimma had perfected his plans to emerge as Senate President by convincing other governors to insist on nominating loyal senatorial and House of Representatives candidates.\n“He (Uzodimma) wants to run for Senate president, and what he does is to say to his colleagues, let us be the ones (governors) who will produce the senators and members of the House of Representatives and some of the Senators.\n“Of course, some of the governors are not experienced. So they will buy it, thinking that he is trying to make them powerful. Not knowing that he has his own interest and agenda to become Senate President,” he said.\n‘You came from fourth’\nMr Wike appeared to question Mr Uzodimma’s political strength, recalling how he became governor after taking fourth position in the 2019 governorship election in Imo State.\n“Hope Uzodinma. Maybe, to God be the glory, he became a governor by taking fourth position. To the glory of God, he became a governor and that is how this country will open her eyes and say what is going on,” he said.\nBackground\nMr Uzodimma became governor of Imo State in 2020 after the Supreme Court nullified the election of the then- Governor Emeka Ihedioha of the PDP, and declared Mr Uzodimma, who came fourth in the 2019 election, as the validly elected governor of the state.\nThe governor’s second term in office will elapse by January 2028.\nMeanwhile, the next Senate is expected to be inaugurated in June 2027.\nMr Uzodimma earlier represented the Imo West district in the Senate from 6 June 2011 to 9 June 2019.\nLooming resignation?\nMultiple sources, in April, claimed that Mr Uzodimma had perfected plans to resign his position as governor before his expiration of tenure to pursue his senatorial ambition.\nThe sources said the governor had struck a deal with his deputy, Chinyere Ekomaru, to willingly resign her position which will pave the way for the appointment of a new deputy governor.\nAccording to the alleged plot, the new deputy governor would serve as a “placeholder governor” in the event that he resigns to contest for Senate.\n“The governor is actually fighting to be the Senate President. He’s banking on Tinubu to help secure the (Senate President) position,” one of the sources said.\nREAD ALSO: Again, Wike defends Rainbow Coalition, says Tinubu’s re-election remains his concern\nBut Mrs Ekomaru’s office, in early May, refuted claims that she had resigned from her position, describing them as false and misleading.\n“This claim, as at this moment and the time it was trended, is entirely untrue and should be disregarded in its entirety,” the statement said, suggesting that the resignation could still happen in the nearest future.\n“For the avoidance of doubt, the Deputy Governor of Imo State, Chinyere Ekomaru, is currently engaged in official duties as the number two citizen of this great state and contin", "translation_ja": "", "vocab": [{"word": "vowed", "definition": "固く誓う、決意を表明することを意味する。政治的または個人的な強い意思を示す際に使用される。"}, {"word": "ambitions", "definition": "野心、強い願望、または高い目標を意味する。政治や事業などの領域で成功を目指す欲望を示す。"}, {"word": "disclosed", "definition": "公開する、明かす、秘密を伝えることを意味する。ニュースやメディアで重要な情報が明らかにされる際に使用される。"}, {"word": "alleged", "definition": "主張された、疑わしい、未確認の事実を指摘することを意味する。確実な証拠なしに何かが起きたと述べるときに使用される。"}, {"word": "perfected", "definition": "完璧にした、仕上げた、計画や戦略を完全に準備することを意味する。政治的な陰謀や作戦が周到に計画されたことを示す。"}, {"word": "consolidate", "definition": "統合する、強化する、散在する力や支持をまとめて強くすることを意味する。政治的な立場や権力を確実にする際に使用される。"}]}, {"title_ja": "ラゴス州政府、洪水危険地域の住民に安全地帯への移転を促促す", "title_en": "Lagos Government Urges Flood-Prone Residents to Relocate to Safer Areas", "summary_ja": "ラゴス州政府は、ナイジェリア水文局による9月19～25日の洪水警報に基づき、洪水危険地域の住民に高地への移転を警告した。環境水資源担当委員のワハブ氏は、エティオサ、ラゴス島、オグン川沿いのコミュニティなど脆弱地域を特定し、洪水上昇前の行動を促した。同州は豪雨、高潮位、排水インフラの不備、違法な埋立てによる洪水問題の解決に取り組んでいる。", "summary_en": "The Lagos State Government has warned residents in flood-prone communities to move to higher ground following a seven-day flood alert from Nigeria's Hydrological Services Agency covering 19-25 September. Commissioner Tokunbo Wahab identified vulnerable areas including Eti-Osa, Lagos Island, and communities along the Ogun River, urging residents to take action before floodwaters rise. The state continues addressing persistent flooding caused by heavy rainfall, high tidal levels, inadequate drainage infrastructure, and illegal land reclamation.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/911396-lagos-govt-urges-residents-of-flood-prone-communities-to-move-to-safer-ground.html", "state_media": false, "category": "社会", "full_text": "The Lagos State Government has urged residents in flood-prone communities to move to safer ground where necessary following a seven-day flood alert issued by the Nigerian Hydrological Services Agency (NiHSA).\nThe Commissioner for the Environment and Water Resources, Tokunbo Wahab, gave the warning in a post on his X account on Monday.\nThe alert, which covers 19 to 25 September, includes Lagos and 14 other states.\nMr Wahab urged residents in low-lying, riverine and coastal communities to take the warning seriously and act before floodwaters rise.\nHe identified Eti-Osa, Lagos Island, Oke-Ira Nla in Ajah, Kirikiri, Ilaje Waterfront and Jetty Terminal B among the areas requiring vigilance.\nOther locations he listed include communities along the Ogun River and other waterways, such as Isheri North, Kara, Itowolo, Ajegunle, Majidun, Ogolonto, parts of Agboyi and settlements downstream of Isheri Olofin.\n“Residents in vulnerable locations should move to safer and higher ground whenever necessary and should not wait for floodwaters to rise before taking action,” Mr Wahab said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“No property is worth risking a life.”\nGovernment monitors rainfall, river levels\nMr Wahab stated that the government was monitoring rainfall and river levels while working with relevant agencies to strengthen flood prevention and response measures.\nHe urged residents to keep drains and waterways clear of refuse and avoid walking or driving through flooded areas.\nThe commissioner also advised residents to rely on official flood forecasts and advisories rather than unverified information.\n“Our priority remains the protection of lives and property,” he noted, urging residents to remain calm and follow safety instructions.\nLagos continues to battle flooding\nThe warning comes as Lagos continues to deal with flooding in several communities during periods of heavy rainfall.\nIn its 2026 Annual Flood Outlook, NiHSA identified Lagos among states at risk of flooding, with intense rainfall, flash floods and coastal flooding posing potential threats to vulnerable communities.\nIn July, Governor Babajide Sanwo-Olu visited flood-affected communities in Eti-Osa East Local Council Development Area, including Ogombo, Monastery Road-Sangotedo, Gbetu and Iwerekun.\nResidents who met the governor and other government officials appealed for immediate relief and lasting solutions to recurring flooding, which they said had damaged homes and businesses and disrupted movement.\nThe visit followed days of heavy rainfall that submerged roads and affected movement in parts of the state.\nDrainage challenges persist\nMr Wahab had attributed some flooding incidents to heavy rainfall, high tidal levels and limitations in drainage infrastructure.\nHe said earlier interventions in Ajiran and Agungi had improved stormwater discharge after blocked drainage channels were cleared and natural waterways restored.\nHowever, he acknowledged that some communities, including Ajiran, continued to experience persistent flooding.\nAccording to the commissioner, illegal land reclamation by private landowners had contributed to some of the problems.\n“We are extending the drainage channels to the lagoon. Those are the issues we are addressing,” he said.\nREAD ALSO: Sanwo-Olu explains delay in opening Ojota-Opebi Link Bridge\nExplaining the cause of some flash floods, Mr Wahab stated that heavy rainfall coinciding with high tidal levels could temporarily prevent stormwater from draining into the lagoon and the Atlantic Ocean.\nFlooding in Lagos has also been associated with rapid urbanisation, inadequate drainage infrastructure, development on wetlands and the dumping of refuse in waterways.\nThe state government has repeatedly warned residents against disposing of waste in drainage channels, which can obstruct the flow of water during heavy rainfall.\nThe government urged residents in vulnerable communities to remain alert, monitor official weather and flood advisories, and take early action when necessary.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "flood-prone", "definition": "洪水が起こりやすい地域や場所を示す形容詞。定期的または頻繁に浸水被害を受ける傾向がある状態を表します。"}, {"word": "vigilance", "definition": "危険に対する注意深い監視と警戒を意味する名詞。潜在的な脅威に対して常に目を光らせている状態を指します。"}, {"word": "riverine", "definition": "河川に関連した、または河川沿いの地域を表す形容詞。川のほとり、川沿いの地域に関する事柄を説明する際に使用されます。"}, {"word": "reclamation", "definition": "土地造成または埋立てによって陸地を再生・拡張する過程を表す名詞。湿地帯や水域を利用可能な土地に変える行為を指します。"}, {"word": "stormwater discharge", "definition": "大雨時に排水システムを通じて流出する水を意味する用語。降雨後に下水道や水路を経由して流れ出る雨水を指します。"}, {"word": "tidal levels", "definition": "潮の満ち引きによる海面の高さを表す用語。時間と共に変化する海面の高度を測定する指標です。"}, {"word": "obstruct", "definition": "何かの流れや進行を妨害する、または塞ぐという意味の動詞。水の流れなどが物によって阻止される状態を表します。"}]}, {"title_ja": "イラク首相アル・ザイディ、イラン支援民兵組織の武装解除を誓約", "title_en": "Iraq's PM Al-Zaidi Pledges to Disarm Iran-backed Militias", "summary_ja": "政治的な新人であるイラクの首相アリ・アル・ザイディは、イラン支援の民兵組織の武装解除を約束した。インタビューで彼はこの目標を達成するための野心的なスケジュールを提示したが、専門家はその期限達成の可能性に疑問を呈している。彼の取り組みは、過去のイラク指導者たちが苦戦してきた課題での成功を目指すものである。", "summary_en": "Iraqi Prime Minister Ali al-Zaidi, a political newcomer, has committed to disarming Iranian-backed militias in the country. In an interview, he presented an ambitious timeline for achieving this goal, though experts question whether he can meet these deadlines. His efforts aim to succeed where previous Iraqi leaders have struggled.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/21/world/middleeast/iraq-prime-minister-interview-disarm-militias.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国連デジタル協力会談でAI暴走の脅威が浮上", "title_en": "U.N. Diplomats Debate Rogue A.I. Threats Amid Global Digital Cooperation Talks", "summary_ja": "国連総会の場で、外交官、高官、技術専門家がAIのリスクと可能性について議論するために集結しました。暴走するAIシステムがもたらす潜在的な脅威に対応するための国際的な枠組みを確立することを目指しています。急速に進化するAI技術への統一的なガバナンスの必要性について、世界的な懸念が高まっていることが反映されています。", "summary_en": "Diplomats, dignitaries and technology experts convened at the United Nations General Assembly to discuss artificial intelligence's risks and opportunities. The talks aimed to establish international frameworks for addressing potential threats posed by rogue A.I. systems. The discussions reflect growing global concern about the need for coordinated governance of rapidly advancing AI technologies.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/21/world/un-general-assembly-ai.html", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国連専門家、米国の違法薬物船への攻撃は国際法違反の可能性と指摘", "title_en": "U.S. Strikes on Drug Boats May Violate International Law, U.N. Says", "summary_ja": "国連人権調査官は、トランプ政権による違法薬物密輸船への攻撃が国際法に違反していると結論付けた。専門家はこれらの攻撃が人道に対する犯罪に該当する可能性があると警告し、他の法律専門家の懸念に同調している。", "summary_en": "A U.N. human rights investigator has concluded that Trump administration strikes on alleged drug smuggling vessels violate international law. The expert warned the attacks could constitute crimes against humanity, joining other legal experts in raising concerns about the operations.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/21/world/americas/us-boat-strikes-crimes-un.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事区域の通行を許可、パレスチナ人がガザ北部への帰還開始", "title_en": "Palestinians Return to Northern Gaza as Israel Lifts Military Crossing Restrictions", "summary_ja": "イスラエルがガザを二分する軍事地帯の通行を許可し、避難していたパレスチナ人の帰還が始まった。この決定は人質解放をめぐる行き詰まりが解決されたことを受けたものである。これまで北部への帰還を阻んでいた制限が緩和されたことで、多くの住民の移動が可能になった。", "summary_en": "Israel has allowed displaced Palestinians to cross through a military zone that divides Gaza following resolution of a hostage release deadlock. The movement marks a significant shift in restrictions that had previously prevented civilians from returning to the northern part of the enclave. This development comes after negotiations broke an impasse over the release of hostages held by Hamas.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発業者が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "China's Top Property Developer Reports Massive Loss Amid Deepening Real-Estate Crisis", "summary_ja": "中国の大手不動産開発業者である万科が巨額の損失を報告し、国内の不動産市場全体の低迷拡大への懸念が高まっている。経営危機は中国当局が苦戦するセクターの安定化に介入するかどうかという問題を提起している。業界専門家は、不動産危機が続く中で政府支援の兆候を注視している。", "summary_en": "Leading Chinese property developer Vanke has reported significant losses, raising concerns about the widening real-estate downturn across the country. The troubled results highlight whether Chinese authorities will intervene to stabilize the struggling sector. Industry experts are watching closely for signs of government support as the property crisis continues to spread.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日攻撃の破片が体内に残存", "title_en": "Freed Israeli Hostages Carry Shrapnel Wounds From October 7 Attack", "summary_ja": "イスラエルの医療関係者によると、ガザから解放されたイスラエル人人質の多くは、10月7日の攻撃による破片が体内に埋まったままであるという。女性人質の多くは8ヶ月間トンネル内に監禁され、中には長期間単独で拘束された者もいた。残存する負傷は、捕虜となった者たちが受けた深刻なトラウマを浮き彫りにしている。", "summary_en": "Several Israeli hostages released from Gaza captivity still have shrapnel embedded in their bodies from the October 7 attack, according to Israeli medical officials. Many of the women hostages spent eight months confined in tunnels, with some held in isolation for extended periods. The lingering injuries highlight the severe trauma experienced by those held captive.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エコノミスト誌の外信部門における有給インターンシップ募集", "title_en": "Paid Internship Opportunity on The Economist's Foreign Desk", "summary_ja": "エコノミスト誌は、志望するジャーナリストとライター向けに外信部門での有給インターンシップを募集しています。このポジションでは、国際ニュース報道における実務経験を積み、世界有数の出版社に貢献する機会が得られます。インターンは経験豊富な編集者や通信員と協力して、国際的なニュース報道に携わることになります。", "summary_en": "The Economist is offering a paid internship position on its foreign desk for aspiring journalists and writers. This opportunity provides hands-on experience in international news reporting and the chance to contribute to one of the world's leading publications. Interns will work alongside experienced editors and correspondents covering global stories.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/21/paid-interns-on-the-economists-foreign-desk", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ氏、グリーンランド領有権要求を撤回も信頼は失われたまま", "title_en": "Trump drops Greenland ownership demands, but damage remains", "summary_ja": "ドナルド・トランプ氏はグリーンランド買収要求を撤回し、デンマークおよびグリーンランドとの改正防衛協定に合意した。しかし、併合の脅しは外交的な悪影響をもたらし、地域における信頼を損なわせたと指摘されている。", "summary_en": "Donald Trump has withdrawn his demands to acquire Greenland, instead settling for a revised defence pact with Denmark and Greenland. However, experts suggest the annexation threats caused significant diplomatic harm and undermined trust in the region.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/19/donald-trump-drops-demands-to-own-greenland-but-the-harm-has-been-done", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI安全化への合意は不可能かもしれない", "title_en": "Agreeing to make AI safer may be impossible", "summary_ja": "人工知能をより安全にすることは技術的には実現可能だが、米国のテック企業と政府当局の間、および米国と中国の間に大きな意見の相違が存在している。これらの対立は、AI安全基準に関する国際的な協力を脅かしている。規制アプローチに関するコンセンサスの欠如は、共通の安全プロトコルを確立する取り組みを阻害している。", "summary_en": "While making artificial intelligence safer is technically feasible, significant disagreements persist between American tech labs and government authorities, as well as between the United States and China. These divisions threaten international cooperation on AI safety standards. The lack of consensus on regulatory approaches undermines efforts to establish shared safety protocols.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/15/agreeing-to-make-ai-safer-may-be-impossible", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "メルツ独首相、地域選挙での惨敗後に政治生命をかけた戦い", "title_en": "Merz Fights for Political Survival After CDU Regional Election Defeats", "summary_ja": "ドイツのフリードリヒ・メルツ首相は、9月6日と20日の地域選挙におけるCDU党の不振について単独責任を拒否し、辞任しないことを表明した。CDUの大敗にもかかわらず、メルツは連立相手の社会民主党（SPD）との改革交渉を再開することを誓った。", "summary_en": "German Chancellor Friedrich Merz has refused to take sole responsibility for his party's poor performance in recent regional elections on September 6 and 20, insisting he will not resign. Despite the CDU debacle, Merz has pledged to resume reform negotiations with his coalition partner, the Social Democratic Party (SPD).", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/22/friedrich-merz-fights-for-political-survival-after-cdu-debacle-federal-politics-played-a-major-role-and-so-did-i_6757795_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パレスチナ承認から1年、フランスの失われた幻想", "title_en": "France's Lost Illusions: A Year After Palestine Recognition", "summary_ja": "パレスチナ国家承認から1年が経過した中、マクロン大統領がイスラエルとの関係改善を試みたことで、フランスの外交メッセージが曖昧になった。この二股外交はパレスチナ支持者の失望を招き、同国のパレスチナへのコミットメントへの信頼が揺らいでいる。", "summary_en": "One year after officially recognizing Palestine, France's diplomatic efforts have become muddled as President Emmanuel Macron attempts to improve relations with Israel. This balancing act has diluted France's message and left Palestinian advocates disappointed with the country's commitment to their cause.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/21/a-year-after-recognizing-palestine-france-s-lost-illusions_6757790_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "元メンター、ジダンは「見解を押し付けずに選手の信頼を勝ち取る」とコメント", "title_en": "Zidane Seeks to Win Over Players Without Imposing Views, Says Former Mentor", "summary_ja": "元サッカー選手でコーチのギ・ラコンブは、フランス代表監督就任前のジダンのコーチング哲学について語っている。ラコンブによると、ジダンは戦術を指示するのではなく、選手の信頼と支持を得ることを優先する。このインタビューはジダンのリーダーシップスタイルを形作った方法についての洞察を提供している。", "summary_en": "Guy Lacombe, a former footballer and coach, discusses Zinédine Zidane's coaching philosophy ahead of his first match as French national team head coach. Lacombe emphasizes that Zidane's approach prioritizes gaining players' trust and buy-in rather than dictating tactics. The interview provides insight into the methods that shaped Zidane's leadership style.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/sports/article/2026/09/22/guy-lacombe-former-footballer-coach-and-trainer-above-all-zinedine-zidane-seeks-to-win-players-over-without-imposing-his-views_6757796_9.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の最新情報", "title_en": "Mindef Updates", "summary_ja": "2026年9月22日火曜日現在、国防省（Mindef）が最新情報を発表しました。読者はストレーツ・タイムズのニュースレターを購読することで、国防関連のニュースと最新情報を得ることができます。", "summary_en": "The Ministry of Defence (Mindef) has released updates as of Tuesday, September 22, 2026. Readers can subscribe to The Straits Times newsletters for more defence-related news and updates.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズの夕刊ニュースレターで、毎日のニュース更新を配信しています。読者は提供されたリンクから無料ニュースレターの購読登録および購読管理ができます。", "summary_en": "This is The Straits Times' evening newsletter providing daily news updates. Readers can subscribe to receive more free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズのモーニング・ブリーフィングは、毎日のニュース更新と主要なストーリーを提供しています。読者は同紙のウェブサイトを通じて追加の無料ニュースレターを購読し、購読設定を管理できます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and key stories. Readers can subscribe to additional free newsletters and manage their subscription preferences through the publication's website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、サウジアラビアの要請でフーシ派への攻撃を命令後に撤回と報道", "title_en": "Trump Reportedly Ordered then Reversed Strikes on Houthis at Saudi Arabia's Request", "summary_ja": "報道によると、トランプ大統領はイエメンの反政府勢力フーシ派に対する軍事攻撃を初め命じたが、その後サウジアラビアの要請を受けて決定を撤回したという。この撤回は、同地域における米国の軍事戦略の複雑な力学とサウジアラビアのアメリカ政策への影響力を浮き彫りにしている。", "summary_en": "According to reports, President Trump initially ordered military strikes against Houthi forces but subsequently reversed the decision following Saudi Arabia's request. The reversal highlights the complex dynamics of U.S. military strategy in the region and Saudi influence on American policy decisions.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikwJBVV95cUxOc0UzMFdrTzhjMU1zaUdPZXRsdlRDam9yY2xiZDZVbXRSdEppZTZYNHBYWDA2UTFBd0dkWF8ySlJMUmxYXzRta1ZqTlJJMUM2MjhBYzVzV2w4ek5yRjU1VFlESndZd2FFb3daSkpvWDNLNm5BZzRaZmVpLU5kVHJZVnliRWtZXzRxZWVkaC1iaEdwWDgwVjNmbWtRSXhGcDN2ZDZ4YU12anVEUGdNcGo2ZEprNHhtdEVod01SdDFBeFRIb0ItWUlKUTlsX05kMk51eHExb0NvVEEycTBlTHNZM2RHdW1naWptRFhGWWZ2TzNUU3dKQTRUR1ZnRDJ1VVhGZE1YQVBLS1ZkakNULUJWTFMyMA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フーシ派がバブ・エル・マンデブを掌握、イランの影響力と米国政策に挑戦", "title_en": "Houthis Seize Bab el-Mandeb, Challenging Iran's Influence and U.S. Policy", "summary_ja": "イエメンとジブチの間に位置する戦略的に重要な海峡バブ・エル・マンデブをフーシ派が掌握した。この動きはイランの地域的影響力と米国の中東政策の両方に挑戦することになる。この占領はフーシ派の軍事能力の増加と世界的な海運ルートを混乱させる能力を強調している。", "summary_en": "The Houthis have taken control of Bab el-Mandeb, a strategically critical strait between Yemen and Djibouti. This development challenges both Iranian regional influence and U.S. Middle East policy objectives. The seizure highlights the group's growing military capabilities and their ability to disrupt global shipping routes.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiigJBVV95cUxOckJnQW1EU3ZYZkY1dml1amV2N1paeXE4OGFBNTVlc2g1Ny1SX1RNSERpR2pSeHIzZlBLSmZsM3Zna0xPZVp2azRUSmdvb1ZIaHVvRnI3bXEyRmZCNVZvczFrbnlSdy1YVVRqV2VkUC11c2FZcDNfOXM2ZDRKNnBxREZqY3BJblExQm92M3UxdkFJT1Z3ZlhqWDFnbk1HcmQ0YXAxMEstT3Mtc19IZDJPaVFBU3BlZmdfc0FYT3NyN01zNlVNOFJUT290RG1Ncy1tVllyZU0xUXhUX1o3NWNyN0hRdk9EX01OZE1sX19KeTB2SmdqMDczMUxpTnI1RjNMQUFjdHRXMEU1UQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツ極左党がベルリン選挙で勝利、メルツ氏がユダヤ人保護を誓約", "title_en": "Merz Pledges to Protect German Jews as Far-Left Party Wins Berlin Election", "summary_ja": "CDU党首フリードリヒ・メルツ氏は、極左党がベルリン州選挙で勝利した後、ドイツのユダヤ人保護を誓約しました。この公約は、反ユダヤ主義と政治的過激主義に対するドイツの懸念の高まりを背景にしています。メルツ氏の約束は、ユダヤ人コミュニティに対する極右と極左の脅威に対抗する主流政党の取り組みを反映しています。", "summary_en": "CDU leader Friedrich Merz has vowed to protect German Jews following the far-left party's victory in Berlin's state elections. The pledge comes amid ongoing concerns about antisemitism and political extremism in Germany. Merz's commitment reflects broader efforts by mainstream parties to counter far-right and far-left threats to Jewish communities.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi_AFBVV95cUxPalFZVmppekJEWnVQRllpRHlJb1FnblBkbmZaZ1ZHOW96OGJYb1pGUnF4WHJBUld1eGVodTdUZTBtb3FvMDh3dDB4X2FTUDN4WWdoQjc5OHJVbTFoSVNFd0VxUXJJYTRETGt2U2xTam9wMFdqX1hSNVlfLUpwZnB0V3REaThpbmVSUEZQaUhSSDRMS2dJNGV2R2lSZVhBN3lTWjZMd21nT2NkRUdrUmhybm12cU9adlhZdHU3RGFWMHIyd1N5aFA0X1VBcmltb0s0OWxoZUh5RWNxcnp4T1BuUjNTOGVENmJ4ZmZRRDJIamhMbGpSWFY0RUdSRUc?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Anduril創業者、台湾に防衛生産・輸出拡大を促促", "title_en": "Anduril Founder Urges Taiwan to Expand Defense Production and Exports", "summary_ja": "防衛技術企業Andulirの創業者は、台湾に防衛製造能力の拡大と軍事装備輸出の拡張を呼びかけた。同地域での安全保障上の課題が増加する中、台湾の防衛能力強化の必要性から出た提言である。", "summary_en": "The founder of defense technology company Anduril has called on Taiwan to increase its defense manufacturing capacity and expand exports of military equipment. The recommendation comes as Taiwan faces growing security challenges in the region and seeks to strengthen its defense capabilities.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE80enJqcDh1QkFreDVfNmMxSThuUVZFdmdVdTZZVHlielZQck16bkQweUpMWTRhMEhodV9BenBiaUluRERpODN6bHA0dUZ5dEtvbmRMV3luYw?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タイ人女友人が冷凍庫で発見、台湾人男性が身柄拘束", "title_en": "Taiwanese Man Detained After Thai Girlfriend Discovered Dead in Freezer", "summary_ja": "台湾人男性が、冷凍庫で発見されたタイ人女友人の遺体に関連して身柄を拘束された。当局は彼女の死亡の経緯について調査を進めている。このケースはタイと台湾の当局の両方から注目を集めている。", "summary_en": "A Taiwanese man has been taken into custody following the discovery of his Thai girlfriend's body in a freezer. Authorities are investigating the circumstances surrounding her death. The case has drawn attention from both Thai and Taiwanese authorities.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBuckJ3eTBHd09EX2dBbDZ1a1RIV19UTWlhVWlOdnZIQ3lLMkw3cHp4Y21NbnBKeHh0OWl2enp3aXRRNXdCcEhyM1BMeGQwYjl5YnhRWUpB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾人男性がタイ人彼女の殺害容疑で拘束", "title_en": "Taiwanese man detained on suspicion of murdering Thai girlfriend", "summary_ja": "台湾人男性がタイ人彼女の殺害容疑で当局に拘束されました。事件は現在地元法執行機関による捜査が進行中です。死亡に至った経緯および事件の詳細については引き続き調査されています。", "summary_en": "A Taiwanese man has been detained by authorities on suspicion of murdering his Thai girlfriend. The case is currently under investigation by local law enforcement. Further details regarding the incident and circumstances surrounding the death are being determined.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBqc3VWTS1CTV9aN25NV05kN0JhMjVsMVQ0eTZJSURXWnc3Y0lCQ0EwSnFYcDJtS1RnRFByRER3TzlhSVlJM3dxT3Y0bXF1NUxXdHdFa2dn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ベルギーのWHO事務局長候補クルーゲ氏、中国・ヨーロッパの保健連携強化を呼びかけ", "title_en": "Belgium's WHO DG Nominee Kluge Calls for Stronger China-Europe Health Ties", "summary_ja": "CGTNは、WHO事務局長の候補者であるベルギーのクルーゲ氏が、中国とヨーロッパ間の保健協力強化を呼びかけたと報じている。報告によると、クルーゲ氏は世界的な健康課題への対応における国際協力の重要性を強調している。CGTNはこれを多国間保健パートナーシップの強化への呼びかけと位置づけている。", "summary_en": "CGTN reports that Belgium's nominee for WHO Director-General, Kluge, has urged the development of stronger health cooperation between China and Europe. The report highlights Kluge's emphasis on international collaboration in addressing global health challenges. CGTN characterizes this as a call for enhanced multilateral health partnerships.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-20/Belgium-s-WHO-DG-nominee-Kluge-urges-stronger-China-Europe-health-ties-1QzkRqfCSmk/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国、日本に侵略の歴史を深く反省するよう促す", "title_en": "China Urges Japan to Reflect on History of Aggression", "summary_ja": "中国外務省報道官の郭建民氏は、中国が日本に対して侵略の歴史と向き合い、深く反省するよう呼びかけていると述べた。CGTNが報じたところによると、中国は日本がアジア隣国および国際社会の信頼を具体的行動を通じて獲得する必要があると述べている。", "summary_en": "China's Foreign Ministry spokesperson Guo Jiakun reported that China is calling on Japan to face up to and deeply reflect on its history of aggression. According to CGTN, China stated that Japan must gain the trust of its Asian neighbors and the international community through concrete actions.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-18/China-urges-Japan-to-deeply-reflect-on-history-of-aggression-1QxvloMvYSQ/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国と米国が首脳会談の調整について継続協議", "title_en": "China, US Maintain Communication on Heads-of-State Interactions", "summary_ja": "CGTNが報じたところによると、中国と米国は今年内の首脳会談の実現に向けた調整について継続的に協議しているという。この発表は中国外交部の郭嘉昆報道官が金曜日に行った。両国間の高級レベルの二国間会談に関する外交的な協議が継続していることが示されている。", "summary_en": "CGTN reports that China and the United States are maintaining communication regarding arrangements for interactions between their heads of state within the current year. Chinese Foreign Ministry spokesperson Guo Jiakun made the announcement on Friday. The statement indicates ongoing diplomatic engagement between the two nations on high-level bilateral meetings.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-18/China-US-maintain-communication-on-heads-of-state-interactions-1QxrgnmGb1C/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、中東のエネルギー復興に50億ドル投資を計画", "title_en": "US Plans $5 Billion Middle East Energy Investment Fund", "summary_ja": "TASが引用したWSJの報道によれば、トランプ政権は中東のエネルギーインフラ復興に50億ドルの米国投資を提案している。TASが報じたところでは、この計画では米国の地域パートナー8カ国がこの投資額に相当する資金を拠出し、基金の総額は100億ドルに達する見込みだという。", "summary_en": "According to WSJ reporting cited by TASS, the Trump administration is proposing a $5 billion US investment in Middle Eastern energy infrastructure restoration. TASS reports that the plan requires eight regional US partners to match this investment, bringing the total fund to $10 billion.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2190815", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "FIFA会長がFIFA改革の協議に前向きな姿勢を示す", "title_en": "FIFA Chief Open to Discussing FIFA Reforms", "summary_ja": "TASS/RTの報道によると、FIFA会長は組織内の潜在的な改革についての協議に前向きな姿勢を示しているという。次のFIFA評議会会議は10月15日に予定されており、そこで改革についての議論が行われる可能性がある。", "summary_en": "According to TASS/RT, FIFA's chief has expressed openness to discussing potential reforms within the organization. The next FIFA Council meeting is scheduled for October 15, where such discussions may take place.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/sports/2190813", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イングランドの村バーナムが英国離脱の国民投票を計画", "title_en": "English village Barnham plans referendum on leaving UK", "summary_ja": "TASSは、人口600人を超えるサフォーク州のバーナム村が、英国からの離脱に関する国民投票を計画していると報じている。この報道は、イングランドの地域コミュニティで高まる分離主義的感情を示唆している。提案された国民投票の具体的な理由とスケジュールは、入手可能な抜粋には記載されていない。", "summary_en": "TASS reports that Barnham, a village in Suffolk with a population of over 600 people, is planning a referendum on leaving the United Kingdom. The report indicates growing separatist sentiment in English communities. The specific reasons and timeline for the proposed referendum were not detailed in the available excerpt.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2190811", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EU成長のための中央ヨーロッパモデル", "title_en": "A Central European Model for EU Growth", "summary_ja": "著者は、EUの政策立案者がアメリカや中国を模倣しようとするのではなく、特にポーランドを含む中央・東ヨーロッパ地域をモデルとして注目すべきだと主張している。この地域の成功は、ヨーロッパの経済復興が革新と発展途上国の経済的追いつきのバランスに依存していることを示唆している。", "summary_en": "The author argues that EU policymakers should look to Central and Eastern Europe, particularly Poland, as a model for economic growth rather than attempting to replicate the US or China. The region's success suggests that Europe's economic revival depends on balancing innovation with helping less developed member states catch up economically.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/central-and-eastern-europe-offers-blueprint-for-reviving-eu-dynamism-by-marcin-piatkowski-1-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Central European Model for EU Growth\nAs the European Union struggles to revive growth and loses ground to the United States and China, its economic future looks increasingly uncertain. Central Europe’s experience suggests that reversing that decline will require fostering innovation while helping poorer countries catch up.\nWARSAW—European policymakers have spent the past few years asking how Europe can become economically more like the United States or China. But they are overlooking the European Union’s fastest-growing members: Poland and the wider Central and Eastern European (CEE) region.", "translation_ja": "", "vocab": [{"word": "revive", "definition": "経済や活動などを復活させる、再び活性化させること。ビジネス文脈では停滞した成長の再開を意味する。"}, {"word": "policymakers", "definition": "政府の政策を決定・立案する人々を指す。経済政策や法律を策定する政治家や官僚を含む。"}, {"word": "overlooking", "definition": "見落とす、無視する、または注意を払わないこと。重要な事実や可能性を看過する場合に使用される。"}, {"word": "fostering", "definition": "発展を促進する、育成する、または成長を助長することを意味する。イノベーション、才能、関係などの向上に使われる。"}, {"word": "economic decline", "definition": "経済の衰退、経済成長率の低下または経済規模の縮小を指す。競争力喪失と関連する。"}]}, {"title_ja": "力ずくの正義はパックス・アメリカーナを終わらせるだろう", "title_en": "Might Makes Right Will End Pax Americana", "summary_ja": "著者は、ドナルド・トランプの強圧的な軍国主義への傾倒が、米国の世界的支配力を強化するのではなく弱体化させたと主張している。軍事力が決定的な勝利を達成できず、戦争と平和の線引きが曖昧になると、軍事力は力の道具としての信頼性を失う。", "summary_en": "The author argues that Donald Trump's embrace of coercive militarism has weakened rather than strengthened US global dominance. When military force fails to achieve decisive victory and the line between war and peace becomes blurred, military power loses credibility as a tool of strength.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/blurring-line-between-war-and-peace-erodes-us-dominance-and-opens-way-for-new-multilateralism-by-pedro-abramovay-and-julia-sakr-tierney-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Might Makes Right Will End Pax Americana\nand\nFar from bolstering US dominance, Donald Trump’s embrace of coercive militarism has eroded it. When the distinction between war and peace dissolves into a ceasefire that is neither, and months of bombardment fail to deliver anything like victory, force looks less like strength and more like pointless destruction.\nNEW YORK—From the moment it was announced, the ceasefire between the United States, Israel, and Iran has been marked by a different form of confrontation: peace on the precipice of war and war on the brink of resolution.", "translation_ja": "", "vocab": [{"word": "coercive", "definition": "強制的な、または力による。相手の意思に反して強引に従わせるさまを表す。"}, {"word": "militarism", "definition": "軍事力を重視し、軍事的解決を優先させる傾向や政策。戦争や武力行使を肯定する立場。"}, {"word": "dominance", "definition": "優位性、支配力。特に国際関係において、ある国が他国に対して持つ圧倒的な力や影響力。"}, {"word": "bombardment", "definition": "爆撃、砲撃。大量の砲弾やミサイルを継続的に投下する軍事作戦。"}, {"word": "ceasefire", "definition": "停戦、休戦。交戦中の勢力が合意して戦闘行為を一時的に中止すること。"}, {"word": "dissolution", "definition": "溶解、解散。明確な区別や境界線が曖昧になり、区別がつかなくなる状態。"}]}, {"title_ja": "次期国連事務総長のためのロードマップ", "title_en": "A Roadmap for the Next UN Secretary-General", "summary_ja": "2027年に就任する国連事務総長は、多国間主義の危機を根本的な改革の機会として捉えるべきだと著者フィリップ・シェーンロックは主張しています。新指導者は一貫したメッセージング、組織内の信頼再構築、国連のコンセンサスを弱めた政治的要因への対処を通じて早期の成果を実現する必要があります。成功には、勇敢なシニアリーダーシップの選抜、12万人のスタッフに新たな目的意識をもたらすこと、および実質的な変化をサポートするメンバー国のコミットメント確保が必要です。", "summary_en": "The incoming UN Secretary-General in 2027 must view the current multilateral crisis as an opportunity for fundamental reform. Author Philipp Schönrock argues that the new leader should focus on delivering early wins through consistent messaging, rebuilding trust within the organization, and addressing the political factors that have weakened UN consensus. Success requires selecting courageous senior leadership, instilling renewed purpose among 120,000 staff, and ensuring member states commit to supporting substantive change.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/roadmap-for-next-un-secretary-general-strong-reformer-manager-by-philipp-schonrock-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Roadmap for the Next UN Secretary-General\nPhilipp Schönrock\nThe next UN secretary-general will take over the most prominent position in multilateral governance at a time when multilateralism is arguably at its nadir. Adapting to today’s multipolar reality will require instilling a renewed sense of purpose and demanding more of member states.\nBOGOTÁ—Leading the United Nations has always been a balancing act, but the breakdown of the postwar global order has added a new dimension of complexity to the role. The next secretary-general, who will take office in 2027, will fill the most prominent position in multilateral governance at a time when multilateralism is arguably at its nadir. To rebuild trust in international cooperation, the UN’s leader must view this crisis for what it is: an unprecedented opportunity for fundamental reform.\nSeven candidates are vying to replace António Guterres, although the third UN Security Council straw poll has further narrowed the field (while indicating members’ willingness to respect the principle of regional rotation, according to which the next secretary-general will be from Latin America or the Caribbean). Rebeca Grynspan of Costa Rica and Carolyn Rodrigues Birkett of Guyana have emerged as the top two contenders, but the absence of a clear frontrunner could encourage a late entrant.\nWhomever is ultimately selected will need a transformative roadmap for the first 100 days (and beyond) to shape the UN’s trajectory and ensure that global governance is made fit for the 21st century. Cepei, the Bogotá-based think tank that I head, has partnered with organizations around the world and convened regional consultations with leading scholars, former diplomats, policymakers, practitioners, and other stakeholders to reflect on the agenda and priorities of the next UN secretary-general and the future of UN leadership more broadly.\nThese meetings show that expectations are high. Although the UN secretary-general’s independent powers are limited, an incumbent wields political capital, serves as the organization’s public voice, appoints senior officials, and oversees management. So, the question becomes, how can the next secretary-general demonstrate leadership, credibility, and direction in the first 100 days while operating within these limits?\nFor starters, the next secretary-general should focus on delivering consistent messaging and on using the largely predictable UN calendar to achieve some early wins. They should begin with political clarity, not thematic expansion; complete existing agendas, such as the Sustainable Development Goals and climate agreements; and shift the focus from proliferation to execution. More fundamentally, the new head must also commit to making power more transparent; embed inclusion across the UN system; strengthen coordination with member states; and ensure that financing is aligned with governance.\nThat means rebuilding trust from within. When appointing the senior leadership team, the next secretary-general should select people who demonstrate political courage, independent judgment, discipline in setting priorities, a willingness to take risks and withstand criticism, and a renewed commitment to mediation. Such leaders will be well-positioned in the long term to incentivize coordination, build coalitions that outlive their tenure, and pursue meaningful structural and organizational change backed by concrete accountability mechanisms.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nInstilling a renewed sense of purpose in a workforce of around 120,000 people struggling with low morale and impossibly tight budgets will require a compelling diagnosis of the UN’s challenges, a vision for its future, and priorities for action. The diagnosis should focus on political factors first and foremost, as many of its problems can be traced to choices made by member states, weakening consensus, and shifting power relations. To be sure, this limits what institutional reform—or the secretary-general alone—can realistically achieve. But, more importantly, it suggests that the selection and transition agenda should address not only the expectations for the next secretary-general, but also what member states are prepared to provide in return.\nThe secretary-general will inherit the unfinished UN80 Initiative, which aims to improve efficiency, review implementation of the body’s mandates, and examine possible structural changes and program realignments. In the first 100 days, important decisions must be made about which parts of the reform agenda to continue, which to adjust, and which to abandon, while keeping in mind the need to avoid reform fatigue and ensure that the next phase is shaped and owned by memb", "translation_ja": "", "vocab": [{"word": "multilateralism", "definition": "複数の国家が協力して国際関係を管理する原則またはシステム。多国間主義と呼ばれ、国連や国際条約など各国が共同で意思決定する枠組みを指します。"}, {"word": "nadir", "definition": "最も低い点、最悪の状態を意味する名詞。天文学では天体の最下点を指しますが、転じて事態や評判などの最低点を表します。"}, {"word": "stakeholder", "definition": "ある事業や組織に利害関係を持つ個人または団体。従業員、顧客、投資家、地域社会など、その意思決定に影響を受ける全ての関係者を指します。"}, {"word": "trajectory", "definition": "物体の進路や運動の経路を表す名詞。転じて組織や事業の進展方向、成長過程を指し、今後の進むべき方向性を意味します。"}, {"word": "incumbent", "definition": "現在その職にある人物を指す名詞または形容詞。政治職や重要ポストの現職者を指し、例えば現職大統領などの用語で使用されます。"}, {"word": "thematic expansion", "definition": "テーマ別または主題別に事業や活動を拡大することを指します。新しいテーマを追加するのではなく、既存のアジェンダに集中する方針を対比させる文脈で使用されています。"}, {"word": "reform fatigue", "definition": "組織が改革を繰り返すことによって生じる疲労や組織内の不安定さを指す概念。改革が多すぎると実行力が低下し、職員のモラル低下につながります。"}]}, {"title_ja": "カーニーのビジョン：米国抜きの西側同盟", "title_en": "Carney's Vision: Western Alliance Without the US", "summary_ja": "テッド・ウィドマーは、カナダの指導者マーク・カーニーが米国から独立して機能する中堅国家の新しい西側同盟を構築するケースを雄弁に主張していると述べています。トランプの不安定な政策、貿易紛争、同盟国への無礼さにより、カナダとEUはより緊密な協力を求め、EUはカナダに準加盟国資格を提供しました。ウィドマーは、80年間続いた米国の指導力に対する信頼を失った伝統的な同盟国により、これが世界的な権力動学の歴史的なシフトを表していると示唆しています。", "summary_en": "Ted Widmer argues that Canadian leader Mark Carney is making an eloquent case for a new Western alliance of middle powers that would function independently of the United States. Trump's erratic policies, trade disputes, and disrespect for allies have prompted Canada and Europe to seek closer cooperation, with the EU offering Canada associate membership. Widmer suggests this represents a historic shift in global power dynamics, as traditional US allies lose confidence in American leadership after 80 years.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/21/mark-carney-european-parliament-alliance", "state_media": false, "category": "オピニオン", "full_text": "The speeches keep coming, each building on the previous one, as the Canadian prime minister builds a case for a new world order that has strikingly little to do with the United States of America, the country that has led the west since the second world war.\nOn 20 January, in Davos, Mark Carney proposed that the world’s middle powers do more to support each other, in light of a “rupture” in the global order. That was clearly a reference to the destabilizing policies of Donald Trump, who had been inaugurated exactly one year earlier, and had spent most of that year insulting the US’s allies.\nOn Thursday, before the European parliament in Strasbourg, Carney delivered another powerful oration that outlined what a new west might look like, without its most powerful member. In his speech, Carney signaled his desire to build bridges across the Atlantic at a time when the US-Canadian relationship is badly strained over trade disputes and Donald Trump’s kindergarten taunts. The EU has offered to make Canada an “associate member”, and while it is unclear what that means (the EU has no such category), it’s a depressing sign that the US’s historic allies are seeking new solutions for a world in which they can no longer trust the United States – for 80 years, the bulwark of the alliance.\nThat this was a blow to American prestige was immediately evident from Trump’s angry reaction on social media: he called the idea “laughable” and threatened, as always, to impose more tariffs. That will only accelerate the growing trend to pay no attention to him.\nIn contrast, Carney expressed himself with seriousness and purpose. He began in French, thanking his hosts, then went confidently into Europe’s fraught history, exploring ambitious themes that are central to the continent’s identity. He quoted Goethe, and in German no less. The words (from Faust) were memorable: Nur der verdient sich Freiheit wie das Leben, der täglich sie erobern muß (“Freedom and life must be earned every single day”). With surgical precision, he then applied that thought to specific episodes in the 20th century, including the failed Hungarian revolution of 1956 (when Russian tanks crushed a people’s dream of freedom), and 1989, when the Berlin Wall came down, and the Iron Curtain finally began to crumble.\nIt was impressive to hear a world leader with a command of history, exploring both the failures and the successes of the past, before a knowledgeable audience. Hungary remains on the front lines of freedom, having voted out the odious Viktor Orbán in April. Carney offered knowing references to the first world war, a conflict that Canadians remember more vividly than Americans do (they entered the war in 1914, three years earlier than the US, and suffered more casualties).\nHe is also drawn to natural imagery; a moving story described a young Canadian soldier who gathered acorns from a French battlefield during the first world war, then planted them in Ontario, where they grew into a “majestic forest”. Today grafts from these Canadian oaks are being replanted at the original battlefield, completing “a profound circle of renewal”.\nThat language would be difficult to imagine in a speech by the US president, who cut down a historic tree on the White House campus, paved the Rose Garden’s lawn, and generally avoids references to nature, unless they involve golf. He also disdains history. In 2018, 100 years after the first world war ended, Trump raised hackles during a visit to France, when he refused to visit a cemetery of US war dead, out of concern that a helicopter flight would affect his hair. The Atlantic reported at the time that he had also dismissed the US war dead as “suckers” and “losers”.\nCarney went out of his way to say that the new EU-Canadian rapport did not stem from a desire to “dominate others” or seek to become a new great-power rival to those that already exist. But even as he expressed his values, there was a tone of defiance. Repeatedly, Carney stressed the issue of “sovereignty”, and it was not difficult to draw the lesson that Canadians and Europeans remain aghast over Trump’s longstanding fixation on Greenland. Canadians are also furious over the president’s repeated claim that he will make Canada – a larger country than the United States – the “51st state”. These episodes were audibly in the background as Carney delineated the reasons that Europeans and Canadians want to draw together “so that no one can control our open markets, impair our sovereignty, threaten our territorial integrity or undermine our freedoms, our democracies, our rule of law”.\nOther misadventures this week reveal how the strategy of demeaning allies is backfiring badly. For some time, Trump has been badgering South Korea for assistance, while scaling back US military support there, and bizarrely claiming that North Korea, a far greater nuclear threat than Iran, is “unthreatening and respectful”. Unsurprisingly, South Korea’s president, Lee Jae Myung, announced on Fr", "translation_ja": "", "vocab": [{"word": "rupture", "definition": "既存の秩序や関係の著しい破裂または断絶を意味します。この文脈では、国際的な政治体制や同盟関係における根本的な分裂を示しています。"}, {"word": "oration", "definition": "公式な場で行われる格調高い演説を指します。政治指導者や重要人物による、準備周到で説得力のある言論表現です。"}, {"word": "bulwark", "definition": "防衛的な砦または支援者を意味する名詞で、何かを保護または支持する主要な力を示します。ここでは米国が西側同盟の守り手であったことを表現しています。"}, {"word": "fraught", "definition": "困難や緊張に満ちた状態を表します。複雑な問題や危険な要素が多く含まれている状況を描写する際に使用されます。"}, {"word": "surgical precision", "definition": "医学の手術のような正確性と細密性を比喩的に表す表現です。非常に正確で慎重に計画された行動や分析を意味します。"}, {"word": "disdain", "definition": "何かに対する深い軽蔑または嫌悪感を表します。対象を見下す傾向や拒否的な態度を示す感情です。"}, {"word": "sovereignty", "definition": "国家が自らの領土や内政について持つ自主権や独立性を指します。他国の干渉を受けずに独立して意思決定する権利を意味します。"}]}, {"title_ja": "トランプ大統領のメディア規制に対抗するため、記者団はホワイトハウスイベントをボイコットすべき", "title_en": "Press Corps Should Boycott White House Events to Challenge Trump's Media Bans", "summary_ja": "マーガレット・サリヴァンは、CNNなどの禁止に対する法的措置は必要だが、主要メディアがホワイトハウスブリーフィングをボイコットして禁止されたメディアとの連帯を示すべきだと主張している。トランプ大統領は注目を求めてメディアアクセスを利用するため、記者がホワイトハウスイベントからの取材を撤回しない限り、メディア規制を続けるだろうと述べている。", "summary_en": "Margaret Sullivan argues that while legal action against Trump's ban of CNN, MS Now, and Politico is necessary, major news organizations must also take collective action by boycotting White House briefings and events to demonstrate solidarity with banned outlets. Sullivan contends that Trump exploits media access for attention and will only stop bullying the press if journalists withdraw coverage from White House events rather than treating him like a typical president.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/21/white-house-press-corps-boycott", "state_media": false, "category": "オピニオン", "full_text": "On Monday, the three news organizations that had been kicked out of the White House because of Donald Trump’s latest fit of pique sued the president and three top advisers.\nAn accompanying statement by CNN, MS Now and Politico accurately calls last week’s sudden lockout “a direct assault on the first amendment”.\nThe legal action is the right move, of course, and one that may prevail since the ban seems to be a clear case of what press-rights lawyers call “viewpoint discrimination”. In other words, Trump didn’t like their stories so he removed their access.\nThe president has been in a bad mood lately, for obvious reasons. Retaliating against the press is his favorite way to let off steam.\nBut something else, beyond legal action, is necessary, too.\n“Time for the New York Times, Washington Post and Wall Street Journal to report on the White House from off campus,” wrote Richard J Tofel, an attorney and the longtime president of the investigative news organization ProPublica, who writes a press-related newsletter, Second Rough Draft.\nIn other words, the biggest and most influential “print” news organizations – along with the major broadcast TV networks – should take collective action by boycotting that briefing room and similar White House events until their journalistic colleagues get their credentials back.\nThe major TV networks took a commendable step in that direction on Monday by deciding to suspend “pool coverage” of presidential events, since CNN was assigned to the duty of recording events and sharing them with the broader “pool” of news organizations.\n“There will be no replacement pool put in place,” stated Bryan Boughton, the Fox News Washington bureau chief and chair of the TV pool in a memo to the White House press corps.\nIt’s especially good to see because the White House press corps often talks a good game about solidarity and press rights, but they’ve mostly kept doing what they’ve always done – treating Trump like any other president.\nHe can ban the Associated Press from the briefing room for refusing to use the term “Gulf of America” instead of “Gulf of Mexico”. He can respond to a reporter’s question with the disrespectful command “Quiet, piggy.” He can (through his defense secretary) try to revoke journalistic access to the Pentagon and fire top staffers at Stars and Stripes, the military newspaper. His weaponized justice department can subpoena New York Times reporters or show up at a Washington Post reporter’s home and seize her devices.\nHe can even trash as the “worst” his loyal rightwing media outlet, Fox News, for its recent polling that showed Americans’ deep dissatisfaction with his handling of the economy. He’s an equal opportunity media-basher.\nBut, no matter, Trump still gets that annual invitation to the White House Correspondents’ Association’s fancy DC dinner, where he can insult the press and make personal attacks on reporters whom he finds displeasing or those he simply wants to single out for abuse.\nHe still gets treated with deference.\nAnd the reporters who are not in particular disfavor continue to go to White House briefings and press gaggles.\nIn other words, he mostly gets away with it.\nThis most recent ban is one of the most serious actions yet, as the scholar of authoritarianism, Ruth Ben-Ghiat, declared, calling it “a moment of reckoning for America”.\nIt’s not only, she said, “part of the autocratic playbook, but the timing is no coincidence. Trump is well into the autocratic backfire process, thus entire media outlets he sees as threats must be banished.”\nTo put it bluntly, Trump is a bully. And bullies will keep bullying until they get a punch in the nose.\nAs much as he professes to hate the mainstream media, Trump depends on it. He wants the constant attention. He loves being in the spotlight, where his every utterance – no matter how unhinged or false – is blasted out to the public.\nIt will get through to him if that kind of attention is withdrawn, as it was on Monday with the pool suspension.\nBack when the AP was banned last year, a former Washington bureau chief at the news service, Ron Fournier, had some broader advice for the press corps.\n“No self-respecting journalist should attend a White House briefing while the White House bans the AP for not accepting state-mandated language,” he wrote on social media, using the hashtag #BoycottTheBriefing.\nYes, media organizations may issue strongly worded statements, and may join in lawsuits, but solidarity is too often a theoretical thing, not a practical action with real-life consequences.\nThey offer a rationale, of course. It’s of utmost importance, journalists and their bosses will tell you, to cover the president. Not doing so would be a dereliction of duty and would stoop to the president’s level. It would be, God forbid, unprofessional.\nBut here’s the thing: reporters do not need to do their journalistic duty from inside the White House, or in an impromptu gaggle with Trump.\n“We don’t need our journalistic watchdog", "translation_ja": "", "vocab": [{"word": "viewpoint discrimination", "definition": "特定の意見や見方を理由に差別的扱いをすること。報道の自由に関する法律用語で、政府が特定の報道機関を差別的に扱う行為を指す。"}, {"word": "dereliction of duty", "definition": "職務を放棄すること、または職務を果たさないこと。専門家や公務員が負うべき責任を意図的に無視する行為。"}, {"word": "autocratic backfire", "definition": "独裁的な行為が逆効果となること。権力者の抑圧的な政策や行動が、国民や組織に対して反発や抵抗を生み出す現象。"}, {"word": "solidarity", "definition": "共通の目標や利益のために一致団結すること。グループのメンバーが互いに支援し、同じ立場を取ること。"}, {"word": "weaponized", "definition": "政治的な目的で道具や制度を意図的に使用すること。中立的であるべき機関や権限を攻撃の手段として利用する行為。"}, {"word": "disfavor", "definition": "好意や支持を失った状態。ある人物や団体が権力者から不満や不信を受けている状況を指す。"}]}, {"title_ja": "トランプ政権の愚行が相次ぐ中、カナダが新たな国際的パートナーを模索", "title_en": "Canada Seeks New Global Allies as Trump Administration Escalates Absurdities", "summary_ja": "デイビッド・モスクロップは、レイク・オンタリオの改名からカナダ高官への嘲笑まで、トランプ政権の幼稚な行動が大規模な混乱をもたらし、気候変動などの本当の危機への対応を妨げていると主張している。カナダとEUが米国支配からの脱却を探ることは妥当であり、トランプの報復脅迫は米国離脱の正当性を証明していると述べている。", "summary_en": "David Moscrop argues that Trump's juvenile antics—from renaming Lake Ontario to mocking Canadian officials—represent dangerous trolling at scale that disorients the world while real crises like climate change go unaddressed. He contends that Canada and the EU are right to explore alternatives to US dominance, as Trump's threatened retaliation only proves his desperation and the soundness of moving away from American hegemony.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/21/canada-donald-trump-mark-carney-global-eu", "state_media": false, "category": "オピニオン", "full_text": "The absurdities of the Trump administration and its hangers-on could be written off as a distraction if the stakes weren’t so high. People might be used to banal trolling on social media platforms, but the global hegemon has forced this petulance onto hundreds of millions of people who are worried about their future and the future of the world. That makes the trolling something worse than distracting.\nThe White House’s online personality is at once extremely disconcerting and extremely juvenile. It’s easy to be stunned by the scale and brazenness of it. During a trade dispute with Canada, and feeling insulted by the premier of Ontario, Doug Ford, the president of the United States decides to rename Lake Ontario Lake America, and then proceeds to share memes showcasing the renamed body of water – which remains Lake Ontario outside US borders (and inside it, for some states, such as New York). Not to be outdone, the US defense secretary, Pete Hegseth, posted an attack against a Canadian cadet and her instructor, mocking them and the Canadian armed forces.\nThis month, an exasperated Canadian prime minister, Mark Carney, implored the administration to stop “doing memes” and “throwing shade”, and to get serious about trade talks. That was a reasonable request – to which an unreasonable Trump responded by complaining that Canada was the “worst country to deal with”, while also claiming that its leaders are “dying to make a deal”. The inconsistency, as obvious as it is daft, betrays that for all the administration’s bluster, the Trump team wants – and needs – a deal, even if its negotiation tactics are beyond baffling.\nThere are signs that Trump’s stunts, which tend to play well with his base, are trying the patience of some clowns within the Republican circus tent. Podcaster Joe Rogan, typically a rightwing darling, said that renaming the lake doesn’t make any sense, and is a move meant to distract Americans “from the fact that we’re in a war that we can’t win in Iran”. The same critique applies, surely, to the strait of Hormuz and New Mexico, which are on notice for a potential name change too.\nBut Rogan might be giving Trump and company too much credit, as if the stupidity of the regime were strategic rather than a base expression of the id, a primal urge expressed without reflection by a group of people who neither expect nor fear consequences for their actions. The stupidity is the point, except for when it’s meant to underwrite cruelty.\nThe sadism plays on two levels: the brutality of bullying itself, and that of opportunity costs. While Trump was posting, the UN announced that the world has frittered away our best chance of avoiding the worst effects of climate change. We are now thoroughly in mitigation-of-th
