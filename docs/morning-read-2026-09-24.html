 and oil conglomerate headed by his father and billionaire tycoon Mukesh Ambani.\n\"Newcastle University is really stooping low here and making a mockery of sustainability,\" Lyla Mehta, a researcher at the Institute of Development Studies, affiliated with the University of Sussex, said on social media Thursday (September 24).\n\"Universities are supposed to be places that question power and hold corporations to account, not give them academic legitimacy,\" Ms. Mehta earlier told The Guardian, which first reported the story.\nControversies regarding Vantara\nWildlife conservationist Prerna Singh Bindra questioned the characterisation of Vantara, a sprawling 3,500-acre (1,416-hectare) facility, as a conservation site.\n\"It's a captive facility, a zoo. So how is this conservation? We need to protect wild animals in their natural habitats, not zoos,\" Ms. Bindra told AFP.\n\"When we're talking about a university, you're nurturing, mentoring, skilling a generation of conservationists,\" added Ms. Bindra.\n\"But here you are changing the entire paradigm of conservation from protecting them in their natural habitat, to one that says that accumulating animals in zoos is conservation.\"\nVantara has consistently denied any wrongdoing.\nPublished - September 25, 2026 01:04 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "Why a provincially backed firm spent $22M to bulk-buy unsold condos along Toronto’s Eglinton LRT - thestar.com", "title_en": "Why a provincially backed firm spent $22M to bulk-buy unsold condos along Toronto’s Eglinton LRT - thestar.com", "summary_ja": "Why a provincially backed firm spent $22M to bulk-buy unsold condos along Toronto’s Eglinton LRT thestar.com", "summary_en": "Why a provincially backed firm spent $22M to bulk-buy unsold condos along Toronto’s Eglinton LRT thestar.com", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihAJBVV95cUxOd05wWkRFZ0c5RHZhdkRtTmRncXBxTG9TS0RKZTF6QWFGTlotOW9SR2lmX0JzV3F -Sensitive Reporting: Olorunyomi warns journalists against misnaming, wrong use of language", "title_en": "Conflict-Sensitive Reporting: Olorunyomi warns journalists against misnaming, wrong use of language", "summary_ja": "Mr Olorunyomi encouraged journalists to report conflict with utmost sensitivity. The post Conflict-Sensitive Reporting: Olorunyomi warns journalists against misnaming, wrong use of language appeared first on Premium Times Nigeria .", "summary_en": "Mr Olorunyomi encouraged journalists to report conflict with utmost sensitivity. The post Conflict-Sensitive Reporting: Olorunyomi warns journalists against misnaming, wrong use of language appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/912221-conflict-sensitive-reporting-olorunyomi-warns-journalists-against-misnaming-wrong-use-of-language.html", "state_media": false, "category": "政治", "full_text": "PREMIUM TIMES publisher Dapo Olorunyomi on Thursday encouraged journalists to take cognisance of the narratives they push to the public.\nMr Olorunyomi said this is important because “narratives have now become a weapon; the same pen that records testimony can distort it.” He said this at the Premium Times Academy training for journalists in Abuja.\nPremium Times Academy is the capacity-building arm of the Premium Times Group. It began a two-day training on peace- and conflict-sensitive reporting for journalists from various media outlets across the country on Wednesday.\nIt brought together top academic and media experts to lead sessions aimed at improving conflict reporting in the country.\nFor over a decade, Nigeria has faced conflicts that have affected all its geopolitical regions. These include the Boko Haram attacks in the North-east, banditry and kidnapping in the North-west, communal crises in the North-central, militancy in the South-south, kidnappings, farmer-herder clashes in the South-west and agitations of secession in the South-east.\nMr Olorunyomi encouraged journalists to report conflict with utmost sensitivity. “Language can shape a situation; misnaming and appropriate naming are important,” he said, while stressing that poor narratives have devastating consequences, including deaths, displacements, and tearing families apart.\nMr Olorunyomi also stressed the importance of providing context while reporting conflict. “Suffuse your work with a lot of contexts; it weakens the harm and danger events could lead to.”\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nNews gathering and writing in era of hate speech\nSimilarly, PREMIUM TIMES’ Editor-in-Chief, Musikilu Mojeed, led the conversation on how the media could gather news and write in the era of hate speech.\nMr Mojeed said journalists must frame their stories to foster peace. “Peace is important. If you stoke a crisis, you might not know how it will end.”\nHe said media houses should not amplify hate propagandists but should portray them for who they are and ensure sufficient context condemning their claims.\nHe noted that hate speech undermines social cohesion, fuels division, and legitimises extremism, therefore, journalists must learn to distinguish legitimate criticisms from hate-filled rhetorics.\nDanger of ethnic profiling\nThe Executive Director, International Centre for Investigative Reporting (ICIR), Dayo Aiyetan, also said that the media “plays an important role in conflict.”\n“By doing our job, we can contribute to the resolution of conflict and not worsen it,” the ICIR boss said.\nWhile discussing the danger of ethnic profiling, Mr Aiyetan said ethnic profiling is irresponsible journalism. “If an individual commits a crime, is the factor of ethnicity relevant to the report?”\nHe urged the media to avoid using identity to explain behaviour. While he noted that journalists may reference ethnicity to tell a story when backed by evidence, he strongly condemned using it to fuel collective blame and criminality.\n“A careless description can travel much farther than the original story,” Mr Aiyetan emphasised.\nREAD ALSO: CJID, NHRC sign MoU to strengthen press freedom and journalists’ safety\nVerifying social media posts in the era of AI\nThe Research and Digital Investigations Manager, Centre for Journalism and Innovation Development (CJID), Silas Jonathan, taught participants how to spot and verify AI-related content sharing tools and experiences.\nDuring the session, Mr Jonathan raised a critical question that can help journalists identify AI content: “What narrative is the content trying to push?”\nHe explained that this is vital because AI accelerates the creation of disinformation, lowers the cost of fabrication, and can potentially escalate conflict.\nMr Jonathan encouraged media personnel to only “verify the people using AI to mislead the public.”\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "2027: El-Rufai, Akobundu, Oyegun, others to lead Atiku’s campaign", "title_en": "2027: El-Rufai, Akobundu, Oyegun, others to lead Atiku’s campaign", "summary_ja": "Atiku has contested Nigeria’s presidential elections multiple times, beginning with the 2007 general election, after serving as vice-president from 1999 to 2007 under President Olusegun Obasanjo. The post 2027: El-Rufai, Akobundu, Oyegun, others to lead Atiku’s campaign appeared first on Premium Tim", "summary_en": "Atiku has contested Nigeria’s presidential elections multiple times, beginning with the 2007 general election, after serving as vice-president from 1999 to 2007 under President Olusegun Obasanjo. The post 2027: El-Rufai, Akobundu, Oyegun, others to lead Atiku’s campaign appeared first on Premium Tim", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/headlines/912214-2027-el-rufai-akobundu-oyegun-others-to-lead-atikus-campaign.html", "state_media": false, "category": "政治", "full_text": "Atiku Abubakar, the presidential candidate of the African Democratic Congress (ADC), has constituted his presidential campaign council ahead of the 2027 general elections.\nAtiku, a former vice-president of Nigeria, appointed Austin Akobundu, a retired colonel and senator representing Abia Central, as the director-general and campaign manager.\nThe composition of the council was announced in a statement issued on Thursday by Phrank Shaibu, the senior special assistant on public communication to Atiku.\nKashim Ibrahim-Imam, a former governorship candidate in Borno State, will serve as chairman of the council, while Nasir El-Rufai, a former governor of Kaduna State, was appointed deputy chairman.\n“Mr Kashim Ibrahim-Imam will chair the Council, with Nasir El-Rufai as Deputy Chairman. Senator Austin Akobundu will serve as Director-General and Campaign Manager, responsible for turning strategy into coordinated action,” the statement said.\nAtiku also appointed Dele Momodu, a former presidential aspirant, as head of media and communications, while Dino Melaye, a former senator and governorship candidate in Kogi State, will lead the contact and mobilisation team.\nThe presidential candidate appointed six deputy director-generals to oversee operational directorates, alongside 30 other directors.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMohammed Hayatudeen, a former presidential aspirant, will chair the policy team, which includes Mohammed Sagagi, a professor and Kingsley Moghalu, a professor and former deputy governor of the Central Bank of Nigeria, among others.\nAccording to the statement, the team will develop policy proposals to address the country’s challenges.\nJohn Oyegun, a former national chairman of the ruling All Progressives Congress (APC), will chair the Campaign Advisory Board.\nAtiku said members of the campaign council would be held accountable for their performance, adding that the campaign would focus on addressing the cost of living, unemployment, insecurity and declining purchasing power.\n“This is a structure built for work. Every directorate has a duty. Every director has an assignment. Every appointee must account for results.\n“Our measure of success will be how clearly we address the cost of living, unemployment, insecurity and declining purchasing power—and how effectively we organise to make Nigeria affordable again,” he said.\nAtiku has contested Nigeria’s presidential elections multiple times, beginning with the 2007 general election, after serving as vice-president from 1999 to 2007 under President Olusegun Obasanjo.\nIn the 2007 general election, he contested on the platform of the defunct Action Congress (AC) and finished third behind Umaru Musa Yar’Adua of the Peoples Democratic Party (PDP) and Muhammadu Buhari of the defunct All Nigeria Peoples Party (ANPP).\nIn 2019, he contested as the PDP’s presidential candidate but lost to incumbent President Muhammadu Buhari of the APC, polling 11,262,978 votes against the late Buhari’s 15,191,847. He again flew the PDP’s flag in 2023, finishing second to Bola Tinubu of the APC, who secured 8,794,726 votes against Atiku’s 6,984,520.\nREAD ALSO: 2027: APC attacks Atiku over corruption allegations, urges Nigerians to reject his presidential bid\nBefore these presidential contests, Atiku had also sought a presidential ticket for the 1993, 2011 and 2015 elections but failed to secure the nomination.\nIn the 1993 Social Democratic Party (SDP) presidential primary in Jos, Plateau State, he withdrew from the race before the second ballot and asked his supporters to back Moshood Abiola while he lost the 2011 PDP primary to then-President Goodluck Jonathan, and the 2014 APC primary to Mr Buhari ahead of the 2015 election.\nHe said earlier this year that this would be his last contest.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "Awujale succession: New beginning for Fusengbuwa, duty to Ijebuland, By Seyi Bakare", "title_en": "Awujale succession: New beginning for Fusengbuwa, duty to Ijebuland, By Seyi Bakare", "summary_ja": "The Awujale is not an ordinary traditional title. It is one of the most respected traditional institutions in Yorubaland and occupies a special place in the history, culture and identity of the Ijebu people. The post Awujale succession: New beginning for Fusengbuwa, duty to Ijebuland, By Seyi Bakare", "summary_en": "The Awujale is not an ordinary traditional title. It is one of the most respected traditional institutions in Yorubaland and occupies a special place in the history, culture and identity of the Ijebu people. The post Awujale succession: New beginning for Fusengbuwa, duty to Ijebuland, By Seyi Bakare", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/912207-awujale-succession-new-beginning-for-fusengbuwa-duty-to-ijebuland-by-seyi-bakare.html", "state_media": false, "category": "社会", "full_text": "The emergence of Omooba Otukayode Hakeem Otufale as the new Olori Ebi of the Fusengbuwa/Jadiara Ruling House of Ijebu-Ode has opened a fresh chapter in the prolonged search for the next Awujale and Paramount Ruler of Ijebuland.\nComing after months of disagreements over the conduct of the succession exercise, competing claims to leadership of the ruling house and legal disputes, the development should be seen as an opportunity to reset the process and restore confidence in an institution whose decisions have consequences far beyond the walls of the family house.\nThe Awujale is not an ordinary traditional title. It is one of the most respected traditional institutions in Yorubaland and occupies a special place in the history, culture and identity of the Ijebu people. The succession process, therefore, must be handled with the dignity, restraint and transparency expected of an institution of such significance.\nThe crisis that preceded the emergence of the new Olori Ebi was not created by the vacancy alone. It was compounded by disagreements over the management of the selection process, questions about consultation, the participation of qualified members of the ruling house and the extent to which established procedures were followed.\nMembers of the ruling house have also raised questions about the handling of funds allegedly collected from aspirants, the absence of what they described as adequate financial accounting, and the submission of names to the kingmakers without satisfactory screening.\nThere have equally been allegations concerning the exclusion of some aspirants from meetings and disagreements over the authority of those managing the process. These are allegations made by members of the ruling house and should be properly established through the appropriate channels. They should not, however, be dismissed as mere family quarrels. The very fact that the earlier exercise became sufficiently contentious to require government intervention and subsequently generated litigation demonstrates the importance of getting the next stage right.\nIndeed, the Ogun State Government had earlier directed that the process be restarted after identifying procedural concerns that could lead to disputes. The government subsequently facilitated the resumption of the process. This is where the significance of the latest development lies.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe emergence of a new Olori Ebi provides the Fusengbuwa/Jadiara Ruling House with an opportunity to close the chapter of internal disagreements and concentrate on the responsibility before it: producing a credible process capable of commanding the confidence of the ruling house, the kingmakers and the wider Ijebu community. For this reason, the Ogun State Government deserves commendation for maintaining restraint and allowing the ruling house to resolve its internal leadership questions without turning the traditional institution into an arena for political contest.\nThe government’s role should be that of a fair regulator and guarantor of due process, not a participant in determining who eventually occupies the Awujale stool. Its responsibility is to ensure that the applicable laws and traditional procedures are respected, while allowing the ruling house and the kingmakers to perform their respective responsibilities. That distinction is important.\nThe credibility of the next Awujale must derive from the integrity of the selection process, not from any perception that the government imposed, sponsored or favoured a particular aspirant. Equally important, the traditional institution itself must be protected from political contamination. Once the process becomes perceived as a contest for government influence, the dignity and legitimacy of the eventual outcome could be unnecessarily compromised.\nRecent events have shown how easily disagreements within the ruling house can spill into public controversy. Reports have emerged of competing claims to leadership of the Fusengbuwa family, while members of the previous leadership have also instituted legal proceedings against other family members. The emergence of Otufale should therefore mark the beginning of reconciliation, rather than another phase of confrontation. The new Olori Ebi now has a historic responsibility.\nHe must move quickly to establish a process that is transparent, inclusive, fair and faithful to the customs and established procedures governing the selection of the Awujale. Every qualified aspirant should be treated equally. Every eligible member of the ruling house should understand the rules before the exercise begins. Screening should be conducted openly and according to clearly established criteria. Meetings should be properly documented. Where funds are legitimately required, there should be clear rules, accountability and proper documentation.\nMost importantly, the", "translation_ja": "", "vocab": []}, {"title_ja": "Haiti Turns to Roger Stone To Lobby Trump Administration", "title_en": "Haiti Turns to Roger Stone To Lobby Trump Administration", "summary_ja": "The Haitian government hired Mr. Stone, a confidant of President Trump, weeks after hundreds of thousands of Haitians lost deportation protection. The contract is worth nearly $800,000, a document shows.", "summary_en": "The Haitian government hired Mr. Stone, a confidant of President Trump, weeks after hundreds of thousands of Haitians lost deportation protection. The contract is worth nearly $800,000, a document shows.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/24/world/americas/haiti-roger-stone-migration.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "U.N. Live Updates: Netanyahu Lashes Out at Critics and Underscores Threats to Israel", "title_en": "U.N. Live Updates: Netanyahu Lashes Out at Critics and Underscores Threats to Israel", "summary_ja": "In a combative speech, the prime minister defended Israeli military action across the Middle East, and attacked Mayor Zohran Mamdani of New York. Dozens of delegates walked out of the hall as he took the podium.", "summary_en": "In a combative speech, the prime minister defended Israeli military action across the Middle East, and attacked Mayor Zohran Mamdani of New York. Dozens of delegates walked out of the hall as he took the podium.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/09/24/world/un-general-assembly-news", "state_media": false, "category": "政治 two countries could draw on their respective strengths as the global auto industry undergoes a rapid tech", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-24/German-auto-executives-call-for-deeper-cooperation-with-China-on-NEVs-1QH3YrNpRbq/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Why 'constructive strategic stability' matters for China-US relations", "title_en": "Why 'constructive strategic stability' matters for China-US relations", "summary_ja": "A survey conducted by CGTN of 12,000 respondents across 39 countries shows that 75% of the respondents believe a stable China-US relationship is vital to the international community.", "summary_en": "A survey conducted by CGTN of 12,000 respondents across 39 countries shows that 75% of the respondents believe a stable China-US relationship is vital to the international community.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-23/Why-constructive-strategic-stability-matters-for-China-US-relations-1QFObrKFKDu/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Iran may give up its highly enriched uranium if deal with US reached — president", "title_en": "Iran may give up its highly enriched uranium if deal with US reached — president", "summary_ja": "Masoud Pezeshkian told Fox News that Tehran would comply with the deal with Washington within the framework of international law", "summary_en": "Masoud Pezeshkian told Fox News that Tehran would comply with the deal with Washington within the framework of international law", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2192475", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Colombia severs diplomatic relations with Iran — Foreign Ministry", "title_en": "Colombia severs diplomatic relations with Iran — Foreign Ministry", "summary_ja": "The government of Colombia accused Tehran of \"presumed ties to international terrorist groups\"", "summary_en": "The government of Colombia accused Tehran of \"presumed ties to international terrorist groups\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2192473", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Lavrov meets with Malian counterpart at UN Headquarters", "title_en": "Lavrov meets with Malian counterpart at UN Headquarters", "summary_ja": "The sides reaffirmed their commitment \"to deepening political dialogue based on mutual trust and coordinating their efforts at the UN,\" the Russian Foreign Ministry said", "summary_en": "The sides reaffirmed their commitment \"to deepening political dialogue based on mutual trust and coordinating their efforts at the UN,\" the Russian Foreign Ministry said", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2192467", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "The Return of the German Question", "title_en": "The Return of the German Question", "summary_ja": "Until this month, a far-right, openly ethnonationalist party had never come so close to winning an absolute majority in an election in the Federal Republic of Germany. Now that it has, and with similarly pro-Russian forces on the rise in France, all Europeans must prepare for the worst.", "summary_en": "Until this month, a far-right, openly ethnonationalist party had never come so close to winning an absolute majority in an election in the Federal Republic of Germany. Now that it has, and with similarly pro-Russian forces on the rise in France, all Europeans must prepare for the worst.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/german-question-afd-far-right-nightmare-scenario-for-europe-by-joschka-fischer-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Return of the German Question\nUntil this month, a far-right, openly ethnonationalist party had never come so close to winning an absolute majority in an election in the Federal Republic of Germany. Now that it has, and with similarly pro-Russian forces on the rise in France, all Europeans must prepare for the worst.\nBERLIN—On September 6, the far-right Alternative für Deutschland (AfD) won 43.8% of the vote in the German federal state of Saxony-Anhalt, falling just short of an absolute majority. For the first time since the founding of the Federal Republic, an openly ethnonationalist (indeed, racist) party, campaigning on a political platform that is ideologically adjacent to National Socialism, is close to gaining government power.", "translation_ja": "", "vocab": []}, {"title_ja": "UN Peacekeeping in Crisis", "title_en": "UN Peacekeeping in Crisis", "summary_ja": "With the world facing the largest number of armed conflicts since 1946, the Trump administration’s continuing assault on the United Nations has prevented the organization from fulfilling its peacekeeping duties. A recent report by UN Secretary-General António Guterres shows how the organization has ", "summary_en": "With the world facing the largest number of armed conflicts since 1946, the Trump administration’s continuing assault on the United Nations has prevented the organization from fulfilling its peacekeeping duties. A recent report by UN Secretary-General António Guterres shows how the organization has ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/un-peacekeeping-crisis-africa-cannot-counter-trump-administration-by-adekeye-adebajo-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "UN Peacekeeping in Crisis\nWith the world facing the largest number of armed conflicts since 1946, the Trump administration’s continuing assault on the United Nations has prevented the organization from fulfilling its peacekeeping duties. A recent report by UN Secretary-General António Guterres shows how the organization has few, if any, levers to fight back.\nPRETORIA—As global leaders gather for the United Nations General Assembly in New York, the world is facing the largest number of armed conflicts since 1946, with 65 ongoing in 35 countries. There have been more battle-related deaths since 2021 than in the previous two decades. This has put UN peacekeeping under pressure, while a new age of warfare, featuring drones, autonomous weapons systems, and AI-driven cyber tools, has further complicated the task of protecting vulnerable civilians and advancing political solutions.", "translation_ja": "", "vocab": []}, {"title_ja": "Lies, Election Lies, and Trump’s Statisticians", "title_en": "Lies, Election Lies, and Trump’s Statisticians", "summary_ja": "An obviously amateurish brief published by the US Census Bureau should raise alarms for all businesses, investors, and others who rely on official government statistics. By recklessly undermining trust in what should be an apolitical public service, Donald Trump is jeopardizing a critical pillar of ", "summary_en": "An obviously amateurish brief published by the US Census Bureau should raise alarms for all businesses, investors, and others who rely on official government statistics. By recklessly undermining trust in what should be an apolitical public service, Donald Trump is jeopardizing a critical pillar of ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trump-corrupting-official-data-reporting-to-push-election-lie-by-michael-r-strain-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Lies, Election Lies, and Trump’s Statisticians\nAn obviously amateurish brief published by the US Census Bureau should raise alarms for all businesses, investors, and others who rely on official government statistics. By recklessly undermining trust in what should be an apolitical public service, Donald Trump is jeopardizing a critical pillar of American prosperity.\nWASHINGTON, DC—When US President Donald Trump fired the head of the US Bureau of Labor Statistics—claiming falsely that the agency’s economic data “were RIGGED” to make him “look bad”—we could at least take solace in the fact that the agency’s critically important work remained unadulterated.", "translation_ja": "", "vocab": []}, {"title_ja": "I was arrested protesting Netanyahu’s New York visit. Here’s why we took a stand | Darializa Avila Chevalier", "title_en": "I was arrested protesting Netanyahu’s New York visit. Here’s why we took a stand | Darializa Avila Chevalier", "summary_ja": "I refuse to play host to a man who has overseen the slaughter or injury of more than 64,000 children in Gaza with American taxpayer dollars. I refuse to be complicit in genocide Benjamin Netanyahu belongs at The Hague; not in the streets of New York City, and certainly not before the United Nations ", "summary_en": "I refuse to play host to a man who has overseen the slaughter or injury of more than 64,000 children in Gaza with American taxpayer dollars. I refuse to be complicit in genocide Benjamin Netanyahu belongs at The Hague; not in the streets of New York City, and certainly not before the United Nations ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/24/protester-netanyahu-gaza-new-york-arrested", "state_media": false, "category": "オピニオン", "full_text": "Benjamin Netanyahu belongs at The Hague; not in the streets of New York City, and certainly not before the United Nations general assembly. The international criminal court has a warrant out for his arrest for war crimes and crimes against humanity. The UN’s own commission of inquiry has found that Israel is committing genocide in Gaza and named Netanyahu as its chief architect.\nAs the Democratic nominee for New York’s 13th congressional district, I refuse to allow a war criminal to roam the streets of our city unchallenged. I refuse to play host to a man who has overseen the slaughter or injury of more than 64,000 children in Gaza with American taxpayer dollars. I refuse to be complicit in genocide.\nThat is why I was arrested today outside of the United Nations alongside hundreds of my fellow New Yorkers.\nIsrael has killed more than 73,000 people in Gaza. It has bombed hospitals, schools, places of worship, fishing boats, and refugee tents. It has collectively starved an entire population as a tool in its genocide.\nIt has subjected men, women and children to systematic sexual torture and imprisonment. It has threatened to kill people for flying kites, killed more than 1,000 people since its so-called ceasefire, and fired 335 bullets into a car carrying five-year-old Hind Rajab.\nAnd when it comes to consequences, world leaders offer carefully worded statements that don’t even amount to a slap on the wrist.\nHere in the US, establishment Democrats and Republicans alike have shielded Netanyahu from prosecution for his crimes and sent over $21bn of our tax dollars in just two years to fund Israeli bombs.\nThe Biden and Trump administrations both obscured evidence, lied about what Israel was doing in Gaza, funded the carnage, and isolated and arrested people that spoke out against it. Just last week, the Trump administration proposed a $2.8bn weapons sale to Israel including 2,000lb bombs.\nNew Yorkers refuse to be silent. That’s why today’s civil disobedience, led by Jewish Voice for Peace, NYC-DSA, Sunrise Movement, CAAAV, Palestinian Youth Movement, Adalah Justice Project, the US Campaign for Palestinian Rights and more had 400 participants including more than 100 people arrested to demand an end to this injustice.\nAnd NY-13, and New York City, is with us. This summer, Harlem, Washington Heights, Inwood and the West Bronx unseated a five-term, Aipac-backed incumbent. Their message was clear: invest in their babies here at home, not in bombs dropped abroad.\nThey made me their Democratic nominee with a mandate to pass legislation like the Block the Bombs Act and fight back against our country’s insatiable war machine. Across this city, New Yorkers elected candidates to Congress and the state assembly who’ll fight to stop the bombs, divest from death, and invest in a politics of life.\nFamilies in Palestine, Lebanon and Iran are not our enemies.\nOur enemy is a system where billionaires get rich from stoking hatred and war while our own communities go without. Tonight, shelters across uptown and the Bronx will be full. This past year, more than 100,000 children in New York City’s public schools have experienced homelessness. And right now, families are feeling the physical toll of cuts to Snap and Medicaid, and New York City Housing Authority residents are once again forced to sleep in inadequate housing.\nI ran for Congress because I am done being told that there is never enough money for our communities while watching our government write blank checks to enact atrocities. Every dollar spent on slaughtering communities abroad is a dollar stolen from our communities here at home.\nIn 1967, Dr Martin Luther King Jr stood at the pulpit of Riverside church in my district and warned that a country that spends more on war than “on programs of social uplift is approaching spiritual death”.\nMembers of Congress have a responsibility to act with courage in the face of grave injustice, not to continue funding it. Unfortunately, nearly 60 years later, not much has changed.\nPalestinians are facing unthinkable conditions every single day under an Israeli apartheid regime that that disappears men, women and children into military prisons known for their physical, sexual and psychological torture.\nAnd here at home, families in my district have to endure their schools, clinics and food assistance being cut to pay for war, and ICE kidnapping our neighbors for speaking up for Palestinians, while nearly 40% of the babies in my district are growing up in poverty.\nFrom NY-13 to Palestine, all children, and all people, deserve the safety and the resources to live dignified lives. That’s why I take to the streets, and that’s why I’m headed to Congress: to stop sending our tax dollars to arm genocide, to end senseless wars, and to build a government accountable to the working people of this country.\nOur communities deserve leaders with an unwavering moral compass, who understand that our shared humanity is sacred, and that fights to build a ", "translation_ja": "", "vocab": []}, {"title_ja": "In its push to subordinate women, the American right is embracing raunch", "title_en": "In its push to subordinate women, the American right is embracing raunch", "summary_ja": "Conservatives long promoted a politics of sexual prohibition. Now such morals have been shed in favor of male domination Under Kash Patel, the FBI will now hire you even if you have a history of hiring prostitutes, or of having sex with animals. The rightwing Maha influencer Alex Clark had a guest o", "summary_en": "Conservatives long promoted a politics of sexual prohibition. Now such morals have been shed in favor of male domination Under Kash Patel, the FBI will now hire you even if you have a history of hiring prostitutes, or of having sex with animals. The rightwing Maha influencer Alex Clark had a guest o", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/24/women-conservatives-male-domination", "state_media": false, "category": "オピニオン", "full_text": "Under Kash Patel, the FBI will now hire you even if you have a history of hiring prostitutes, or of having sex with animals. The rightwing Maha influencer Alex Clark had a guest on to her talk show to discuss the idea that wives should provide sex for their husbands on demand. A new ad for a sports gambling website is being hailed as a victory for the political right, because it features a nude Sydney Sweeney clutching footballs to her breasts. The Tate brothers, who encourage their male followers to pursue compulsive sexual conquest and who have been accused of sex trafficking and violence in the operation of their online cam porn business, have reportedly been friendly with members of Trump’s circle. A dizzying array of elites on both sides of the aisle – conservatives very much included – seem to have been socializing with a pedophile financier, and were so unfazed by his constant coterie of underaged girl companions that one begins to wonder whether they were habituated to such scenes. A prominent conservative writer, best known for her opposition to gender transition care for children, has announced a new book claiming to tackle the problem of young women who are supposedly unwilling to have enough sex. And the women of the president’s members club, Mar-A-Lago, are so well known for their dramatic facelifts, and their lips so stuffed with filler that they cannot quite close their mouths, that their faces are now a shorthand in the world of plastic surgery.\nRaunch, vulgarity, a boorish entitlement to women’s sexual service, and the aesthetics – and, indeed, the business – of pornography are being embraced by the right.\nFor those old enough to remember the rise of Pat Buchanan and Phyllis Schlafly in the Reagan era, or even the earnest displays of Christian faith that characterized the George W Bush administration, this can all be a bit dizzying. For decades, it was the left that embraced public sexuality, taking the lead on comprehensive sex education, gay rights, and abortion access, and celebrating the sexual revolution that was ushered in by the advent of the birth control pill in the 1960s. It was liberals who embraced feminism, and worked to make women’s new freedom to delay marriage and childbearing enforcible in civil rights law. It was the left that retheorized family and marriage, reshaping the age-old institutions into ones that could better accommodate gay relationships and women’s equality. It was the progressives who embraced abortion as a means of sexual freedom and women’s self-determination, and who fought for birth control and sexually transmitted disease testing to be funded by the federal government. And it was the left that championed pornography as a free speech issue – shouting down the feminists in their own camp who critiqued the misogyny of its content, and making porn production and distribution into cornerstones of the liberal vision of the first amendment.\nThe right, meanwhile, was long married – pun intended – to a politics of sexual prohibition. When the Christian right was at the peak of its power, the Republican party had many of the same policies it does now: demanding bans on abortion, opposing gay rights, looking askance at birth control, pushing cuts to sexual health programs, rolling their eyes at civil rights protections meant to protect women workers from sexual harassment, and opposing comprehensive sex education, favoring instead abstinence-only models. But back then, when Evangelicism and the prim repression of the Protestant right were the dominant cultural force within the Republican party, these policies came packaged in a distinct style: one of sexual prohibition and shaming, that emphasized a kind of sexual self-discipline in the guise of decency. Back then, it really was a scandal when a pastor was caught cheating on his wife, even when his partner in infidelity was an adult woman. Sexual morality was a virtue that the right trumpeted in a very particular style: no sex until marriage, and even then, only the baby-making, heterosexual kind.\nWas this all a ruse? The sexual morals of the Christian right seem to have evaporated as soon as the nation heard Donald Trump utter the words “grab ‘em by the pussy.” Now, an ostentatious lasciviousness reigns. In today’s Republican party, raunch is the coin of the realm, a “locker room talk” style of sexual vulgarity is de rigeur, and positions of power in the Trump world sometimes seem to go hand in hand with sexual assault allegations for men, and very specific kinds of surgical enhancements for women. The preachers have retreated, and the perverts have taken over. In the Maga era, sexual domination is synonymous with manliness, and porn is the lingua franca.\nBut is this really such a great change? After all, the transformation of the Republican party from a Christian culture that prioritized sexual prohibition to a pornified culture that celebrates sexual force has been a stylistic change, not a policy change: Repub", "translation_ja": "", "vocab": []}, {"title_ja": "The Guardian view on Russian disinformation: a foreign threat that relies on UK complicity | Editorial", "title_en": "The Guardian view on Russian disinformation: a foreign threat that relies on UK complicity | Editorial", "summary_ja": "Andy Burnham’s accusation against the Kremlin tells half the story. Domestic extremists amplified by US big tech are part of the same problem In November 2020, Barack Obama warned of an “ epistemological crisis ” facing western democracies. Polarisation and radicalisation were corroding trust in est", "summary_en": "Andy Burnham’s accusation against the Kremlin tells half the story. Domestic extremists amplified by US big tech are part of the same problem In November 2020, Barack Obama warned of an “ epistemological crisis ” facing western democracies. Polarisation and radicalisation were corroding trust in est", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/23/the-guardian-view-on-russian-disinformation-a-foreign-threat-that-relies-on-uk-complicity", "state_media": false, "category": "オピニオン", "full_text": "In November 2020, Barack Obama warned of an “epistemological crisis” facing western democracies. Polarisation and radicalisation were corroding trust in established information sources. “If we do not have the capacity to distinguish what’s true from what’s false, then by definition the marketplace of ideas doesn’t work,” the former US president said.\nThat vulnerability has grown since then. Democracy’s enemies have become more determined to exploit it. This is the threat that Andy Burnham highlighted in a speech at the United Nations this week. The prime minister accused Russia of waging an “industrial-scale assault” on the UK’s information environment using bot armies and fake websites to spread falsehoods, interfere in elections, foment discord and poison inter-community relations.\nThe prime minister announced the creation of a National Centre for Information Defence to thwart campaigns of epistemological sabotage by hostile actors. It is an overdue enhancement of Britain’s civil defence capabilities.\nMr Burnham is right to highlight the threat, but he told only part of the story. The Kremlin would be wasting its money pumping out disinformation if large US tech platforms didn’t provide convenient channels for the toxin to spread, if there weren’t a complicit audience in Britain sharing the offending material and if the market for spreading pernicious propaganda weren’t so lucrative. Information warfare is only effective when it exploits structural vulnerabilities in the target society. Far-right material sowing hatred against migrants is most fruitful where the terrain has been fertilised by domestic politics.\nEarlier this year, analysis by the Guardian found that more than half of accounts on X that were posting about racially aggravated riots in Belfast and civil disorder in Southampton were based outside the UK. Seven of the most-read tweets originated in the US, including one posted by X’s proprietor, Elon Musk, the world’s richest man.\nMr Musk has been assiduous in promoting a warped, dystopian idea of Britain as a failed state whose culture is being corroded by mass migration. His platform has been invaluable to far-right activists who have mustered gangs of masked men into mobs that obstruct roads, intimidate people and threaten asylum claimants at British ports. Last year, Mr Musk addressed a rally organised by the far-right activist Tommy Robinson, where he called for the Labour government to be removed. Earlier this year, Mr Robinson, whose real name is Stephen Yaxley-Lennon, travelled to Moscow on a trip funded by the Musk Foundation. He said the purpose of the trip was to “see the beauty of a civilised society”.\nMr Burnham did not address that side of the anti‑democracy equation in his speech, perhaps because he felt that it would be impolitic to impugn US big tech under the president’s nose. Mr Trump is also an originator and disseminator of falsehoods online, but the nature of transatlantic diplomacy prevents a UK prime minister confronting him with that record.\nUnder the circumstances, it made sense for Mr Burnham to concentrate his remarks on the threat from the Kremlin, but that must not signal the limit of his policy focus. British democracy is indeed under attack from Russia, but an effective campaign to build resilience has to recognise also the complicity of domestic extremists and the digital privileges they enjoy thanks to US technology companies.\n- \n  Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": []}, {"title_ja": "The Price of Arctic Ambition", "title_en": "The Price of Arctic Ambition", "summary_ja": "The Greenland deal proves self-reliance is not an option.", "summary_en": "The Greenland deal proves self-reliance is not an option.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/arctic-antarctic/price-arctic-ambition-greenland-iris-ferguson", "state_media": false, "category": "オピニオン", "full_text": "In 2016, a crack in the ice opened beneath the site of the U.S. Navy’s flagship Arctic exercise several hundred miles north of Prudhoe Bay, Alaska, forcing experiments to end early and leaving researchers scrambling to evacuate. Five years later, an early freeze trapped roughly two dozen commercial vessels in the East Siberian Sea; some had to wait weeks for Russian icebreaker assistance. And during a Canadian-led multinational military exercise in 2025, allied forces encountered a difficult combination of conditions: extreme cold grounded helicopters, broke snowmobiles, and knocked out communications equipment even as thinning sea ice forced U.S. pilots to search 25,000 miles of coastline for a location thick enough to land on.\nThese were not failures by unprepared or inexperienced Arctic actors. They involved three of the region’s most proficient nations, each operating in territory it knew well. But there was a common thread: the Arctic has a way of humbling those who operate there. Its distances, darkness, extreme weather, and sparse infrastructure expose the limits of even the most capable governments and militaries.\nThis fact creates a paradox. The Arctic is a main approach to the U.S. homeland and a platform for projecting power at the top of the world. That is precisely why, as geopolitical competition intensifies, Washington is becoming increasingly focused on protecting sovereignty and securing its interests in the region. Yet no single country, not even the United States, can see, maneuver, and sustain itself across the Arctic. Effective sovereignty there relies on building networks of dependence.\nThis week’s agreement between Greenland, Denmark, and the United States illustrates the point. After months of negotiation, the three parties struck a symbiotic deal codifying U.S. military access while affirming Danish and Greenlandic self-governance. U.S. President Donald Trump has called it a win for American interests; Denmark and Greenland a win for sovereignty. Both are true, as nearly every mission that makes Greenland strategically valuable—missile warning, submarine detection, basing, and resupply—works because the United States is embedded in an alliance system.\nThe agreement could mark a turning point in how Washington approaches Arctic security. Trump’s early talk of acquiring Greenland or making Canada the 51st U.S. state cast self-reliance as the goal and strained relations with key Arctic partners. This agreement signals a more productive direction. Working with allies preserves the advantages the United States already holds and closes the gaps, in both presence and allied political unity, that adversaries are eager to exploit.\nBut fully embracing the role that allies and partners must play for the United States to achieve its goals in the Arctic will require a shift in a long-held mindset. For the United States, pursuing interdependence is an uncomfortable strategy. Self-reliance remains closely associated with national power, and Washington has historically approached Arctic shortfalls by asking what additional U.S. capabilities it needs to generate. Decades of deprioritizing the Arctic, however, coupled with the region’s vast and forbidding geography, leave the United States with little choice but to work closely with partners. In practice, the interdependence it needs to have with allies in the Arctic is already found everywhere—now Washington must continue to build on it.\nSEEING TOGETHER\nThe United States’ basic ability to understand and communicate what is happening in the vast Arctic region depends on partnerships. Arctic awareness remains uniquely fragmented across three distinct regions: North America, Europe, and the Pacific. Information is further dispersed across a variety of militaries, scientific institutions, intelligence agencies, and local indigenous communities, whose knowledge of the changing environment far exceeds any new sensor.\nSince the early 1960s, just after the creation of the U.S.-Canadian North American Aerospace Defense Command (NORAD), the United States has intentionally based some of its most important missile-defense systems in Canada and Greenland. Because of gaps in its own coverage, the United States now relies on a Japanese satellite to detect the extent of Arctic sea ice, which is integral to understanding the evolution of commercial and military sea routes. The United States further depends on allied monitoring over the European Arctic to understand threats approaching U.S. territory and on allied judgment to interpret competitors’ intent in the Arctic. Nordic nations have decades of experience observing the Russian military’s behavior around the Kola Peninsula, home to much of the country’s nuclear capacity, making their observations indispensable to Washington’s ability to distinguish between routine and escalatory behavior. The United States, for its part, can see patterns of Chinese and Russian activity near Alaska that European allies might miss", "translation_ja": "", "vocab": []}, {"title_ja": "How Putin Escalates", "title_en": "How Putin Escalates", "summary_ja": "A new stage in Russia's confrontation with Ukraine—and the West.", "summary_en": "A new stage in Russia's confrontation with Ukraine—and the West.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/how-putin-escalates-ukraine-war-andrei-kolesnikov", "state_media": false, "category": "オピニオン", "full_text": "The overwhelming victory of President Vladimir Putin’s United Russia party in last weekend’s parliamentary elections was not only expected but planned. Compulsory voting in organizations dependent on the budget and in many corporations; standardized voting in the military, law enforcement agencies, and the so-called new territories; mechanical voting in the spirit of “take my vote and leave me alone”; the spread of electronic voting; and the pre-election removal of Yabloko, the only antiwar party still operating legally—all these and other factors assured a supermajority for the ruling party. Even votes cast for other parliamentary parties amounted to support for the government, because they, too, are controlled by the Kremlin.\nNonetheless, for Putin, this refreshed mandate offers renewed legitimacy for his “special military operation” in Ukraine, showing domestically what the Kremlin is projecting internationally: that Russia is in a position of strength and is ready to pursue its military objectives with even more abandon. The Kremlin’s main goal is to create the illusion of a total commanding majority, regardless of the actual situation. Everyone supports Putin, the results convey, and therefore they must also support the country’s military policies, relentless suppression of dissent, and anti-Western course; those who oppose him are outcasts and pariahs. Indeed, since 2022, elections in Russia have redefined citizenship as support for the war.\nReality is more complicated. Since April, public polling in Russia has consistently signaled that things are not going very well for the government. According to the independent Levada Center, which has been regularly asking the question, in July, the percentage of respondents who considered the special operation a success had fallen to 50 percent, a drop of nearly 20 percentage points from the previous year. In the same poll, the number of people who believed the country was moving in the right direction had fallen by ten percentage points from a year earlier, to 54 percent. Moreover, between July 2025 and July 2026, the president’s own approval rating declined 12 percent—a very significant drop in a personalist autocracy.\nAlongside this, general public morale has steadily declined. There is now constant anxiety over the protracted war and the possibility of further military mobilization, as well as about inflation, far-reaching Internet restrictions, and an unending fuel crisis. According to Levada Center surveys done in August, two-thirds of respondents said they faced problems with mobile Internet access, messaging apps, and gasoline shortages. Gasoline shortages seriously disrupted the lives of one in three respondents, while Internet restrictions affected one in five. Massive military spending and rising fuel prices have been major drivers of inflation, and starting in October, a spike in utility rates will add to those pressures.\nNow that elections have taken place, many Russians fear another military mobilization, although the Kremlin—wary of undermining the illusion of a somewhat normal life amid a war that has reached the heart of Russia in the form of drone attacks—seems to prefer selective and covert mobilization over a general call-up. But other new pressures cannot be ruled out. As long as Putin believes that time is on his side, and the people—apparently hypnotized by what the Kremlin calls the “unity” demonstrated during the elections—are ready to bear the burden of troubles, he will continue the war. And continuing means escalating, abroad and at home.\nAlready, the Russian president has rejected a new U.S. diplomatic push and stepped up the pace and nature of attacks in Ukraine. Meanwhile, pro-Kremlin foreign policy experts speak of the various ways, both nonnuclear and nuclear, that Russia can escalate further, especially during the coming winter, when the Kremlin plans to literally freeze Ukraine by striking its power grid. For Putin, escalation has become a principal means for maintaining power.\nTAKE IT UP A LEVEL\nFor weeks now, there have been many indications that Putin is preparing for a new stage in Russia’s conflict with Ukraine and the West. The Kremlin has been stoking a continual sense of emergency, peddling threats—what the late Russian political scientist Gleb Pavlovsky called the “Russian conflict conveyor belt,” a machine that must never be allowed to stop. At the same time, the government has imposed a siege mentality on the public, along with the need to maintain absolute unity, a dynamic that has been reinforced by the intensification of Ukrainian airstrikes deep inside Russia. This kind of threat amplification explains the sweeping crackdown on Yabloko in the runup to the parliamentary elections. Not only was the party banned from taking part in the elections, its members were arrested and one of its leaders, Lev Shlosberg, was sentenced to 11 years in prison. When a country requires a unified national mindset, no anti-war voice", "translation_ja": "", "vocab": []}, {"title_ja": "Europe Can’t Get Out of Its Own Way", "title_en": "Europe Can’t Get Out of Its Own Way", "summary_ja": "The real barriers to competitiveness and innovation are still in place.", "summary_en": "The real barriers to competitiveness and innovation are still in place.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/europe-cant-get-out-its-own-way-andrew-mcAfee", "state_media": false, "category": "オピニオン", "full_text": "The European economy is falling behind. At the turn of the century, EU labor productivity was on a steady upward trajectory and had reached almost 95 percent of U.S. levels. Then the trend reversed. EU productivity is now 20 percent lower than that of the United States. One important cause of this decline is Europe’s failure to participate in the digital revolution. Of the world’s 100 most valuable high-tech companies, only two are headquartered within the EU. The bloc has no global-scale companies in cloud computing, online advertising, mobile devices, or chip design, and it has only one competitor—France’s Mistral—remaining in the race to build the large language models powering the current AI surge.\nThe publication in 2024 of former Italian Prime Minister Mario Draghi’s report on European competitiveness heralded a shift in attitudes. The report recommended several policy interventions, including increased public investment in R & D and a capital markets union. By mid-2026, around 30 percent of its recommendations had been implemented. That is a good start. But even if the report’s proposals were fully adopted, they would not be enough to revive Europe’s flagging competitiveness—because they do not address the root cause.\nThe problem is not that the EU and its national governments are not doing enough to spur competitiveness. It is that they are doing too much to impede it. Through the slow accretion of layers of labor and tax policy, red tape, and technology regulation, they have erected barriers to the creation of the kind of large, vibrant startup ecosystem currently thriving in the United States. This ecosystem has been the cradle of many major innovative high-tech companies, as well as those sparking innovation and growth in other sectors. If the EU does not create the conditions for such companies to develop, then the bloc’s decline may become irreversible.\nDRIVE ON\nBig companies are hard to change. Global, long-standing, historically successful ones might be the hardest of all. And Europe has many of these. The 50 most valuable EU companies trace their origins back more than 150 years, on average. When such companies are confronted by fast, broad, and deep technological change, they struggle to respond effectively. The differing trajectories of the European and U.S. auto and space industries—which have historically driven growth and innovation—reveal the importance of fostering a healthy startup ecosystem.\nIn the first quarter of the twenty-first century, carmakers have experienced two immense changes. First, owing to a combination of regulation and demand, they have begun the transition from manufacturing internal combustion engine vehicles to manufacturing electric ones. Second, breakthroughs in digitization and automation have necessitated further changes in their offerings. Europe’s carmakers have floundered in the face of these changes. Volkswagen has probably tried hardest. It committed to an entirely new EV platform in 2015, announced ambitious electrification goals across the brands of the VW Group, and created Cariad, a new software subsidiary. Since then, Volkswagen has sold approximately two million EVs. But it is hard to label the carmaker’s overall electrification effort a success. Cariad was reorganized multiple times, updates arrived late, and several executives, including the CEO, left the company. Other brands within the VW Group, including Porsche, Audi, and Bentley, announced major delays of EV models and platforms, and Porsche took approximately $5 billion in write-downs associated with its electrification efforts.\nIn China, still VW’s largest overseas market, car buyers have shifted to EVs—but not European ones. As a consequence, profits from VW’s Chinese operations fell by 80 percent in the decade to 2026. The market capitalization of the entire VW Group followed a similarly dire trajectory, dropping by more than 60 percent in real terms between the end of 2015 and the second quarter of 2026. By the middle of 2026, VW Group as a whole was in deep trouble, with the Financial Times reporting that its CEO, Oliver Blume, proposed shuttering four factories in Germany, and laying off as many as 100,000 workers.\nEurope’s other large automakers have not fared much better. Mercedes’s market capitalization has declined by more than half since the end of 2015, and BMW’s by almost 60 percent, according to my analysis. Stellantis took more than $20 billion in EV-associated write-downs in 2026, and saw its market capitalization decline by 76 percent since it first floated shares in the first quarter of 2021. The auto industry is the source of approximately ten percent of EU manufacturing employment, or more than three million jobs, according to the European Automobile Manufacturers’ Association. That number seems likely to fall further, unless there is an increase in foreign-owned production, or a huge reversal in fortunes among legacy European automakers. The valuation trajectories of the", "translation_ja": "", "vocab": []}];
const FOCUS = null;
let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-24 23:31 JST";
  renderTabs();renderList();
})();
</script>
