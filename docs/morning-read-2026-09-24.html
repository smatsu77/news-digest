ite House in a court filing of having \"repeatedly violated\" the judge's ruling by turning away their journalists. The hearing was called off after access was restored.\nTrump initially said he barred the outlets because of \"fake news\". The White House later cited national security.\nBut in his overnight ruling, Judge Timothy Kelly cast doubt on the claim about national security concerns.\nThe chaotic standoff limited some TV coverage as Trump welcomed Chinese President Xi Jinping to the White House ahead of a state dinner later.\nJudge Kelly ruled the ban on the outlets should be temporarily lifted because it \"likely violated their constitutional due process rights\".\nCNN, Politico and MS Now all reported being denied entry to the White House on Thursday morning, prompting their request for an emergency hearing.\nIn response, the director of White House Operations said in a court filing that the press passes and confiscated badges had been restored by 09:45.\nShortly afterwards, all three outlets said they were allowed back in.\nHowever, networks including Fox News, NBC, CBS and ABC, which pulled out in solidarity, have yet to confirm they will resume broadcast coverage from the White House.\n- Judge dismisses Trump lawsuit against Iowa newspaper and pollster over 2024 race \n  - Published8 hours ago\nJudge Kelly ruled CNN, Politico and MS NOW were \"likely to succeed\" in showing the White House had not exercised \"adequate due process\" in the ban.\nThe judge also rejected the argument that national security concerns underpinned the exclusion, pointing out the president made no mention of this in his initial announcement.\n\"The record lacks factual support for defendants' contention that the revocation of plaintiffs' hard passes will in fact protect national security,\" Kelly wrote.\nHe ordered the immediate return of the outlets' press passes and a halt to enforcement of the ban for 14 days.\nIn a court filing on Tuesday, the US Department of Justice had accused the news outlets of threatening national security with their coverage.\nGovernment lawyers cited stories about missile stockpiles, the construction of the White House ballroom and the recent Republican midterm convention.\n- What is the White House pool and why is it in a row with Trump? \n  - Published2 days ago\nTrump first announced last Friday he was barring CNN, MS Now and Politico from the White House, accusing them of writing \"fiction or lies\" about his administration.\nBy Saturday morning, each outlet reported that they were denied entry to the White House grounds and that their press badges were confiscated.\nAll three outlets accused the Trump administration of violating their constitutional rights.\nIn a joint statement on Monday, they said they were pursuing legal action to \"defend the principle that the government does not decide what the press reports\".\nAnd more than 50 media organisations across the ideological spectrum filed an amicus brief in support of the lawsuit, including Fox News, the New York Times, the Washington Post and the Wall Street Journal.\nThere have been previous instances of administrations attempting to limit certain outlets' access.\nThe Obama administration tried to exclude Fox News from participating in a specific press pool interview with an administration official in 2009.\nBut after objections from the other four networks in the pool, Fox News was allowed in.\nRelated topics\n  - Published10 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "Hundreds of thousands expected in Paris for Pope's visit", "title_en": "Hundreds of thousands expected in Paris for Pope's visit", "summary_ja": "The highpoint of his time in Paris will be a giant Mass attended by more than half a million people.", "summary_en": "The highpoint of his time in Paris will be a giant Mass attended by more than half a million people.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmq8j904212po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Hundreds of thousands expected in Paris for Pope's visit\n- Published\nPope Leo XIV embarks on a four-day visit to France on Friday, with the highpoint being a giant Mass attended by more than half a million people in central Paris.\nFor Saturday's afternoon celebration, an altar has been built on the Place de la Concorde and a large area around the Champs-Élysées sealed off by police.\nSome 600,000 Catholic faithful are expected to cram the avenue up to the Arc de Triomphe and beyond.\nLarge crowds are also due at other stages in the Pope's itinerary, reflecting an enthusiasm that the Church attributes to growing spiritual thirst among the French and other Europeans.\nPresident Emmanuel Macron will greet the Pope at Orly airport on Friday morning, and then hold talks with him at the Élysée Palace on geopolitical issues and artificial intelligence (AI). He will also deliver a speech with the Pope in Metz.\nHowever, the president will not be at any of the Pope's Masses, largely to avoid breaching France's strict separation of state and religion.\nInstead, the Champs-Élysées Mass will be attended by his wife Brigitte and Prime Minister Sébastien Lecornu. Several candidates for next year's presidential election are also due, including Marine Le Pen of the nationalist right, centrists Edouard Philippe and Gabriel Attal, and conservative Bruno Retailleau.\nThere were reports of tensions between Macron and the Vatican team sent to make arrangements, with the president allegedly frustrated in his wish for a more ceremonial aspect to the visit.\nThis was dismissed this week by Élysée officials, who said it was customary to offer a visiting head of state – which the Pope is – a range of high-profile events, such as a cavalry escort down the Champs-Élysées. But they said it was never expected that the Pope would actually take the offer up.\nThey did confirm that Pope Leo turned down Macron's idea of a meeting with artisans who helped rebuild the fire-devastated Notre-Dame cathedral. This was because his agenda was too tight, they said.\nAfter a Popemobile ride through crowds to Notre-Dame cathedral on Friday afternoon, Pope Leo XIV will be joined in the evening by 80,000 young people at the Stade de France in northern Paris.\nOn Sunday 150,000 have signed up to attend mass in the Pyrenean sanctuary of Lourdes.\nOn Monday the Pope will be in Metz, in northeast France, where he will pay tribute to Robert Schuman (1886-1963), a founding father of the European Union and a fervent Catholic who is today a candidate for beatification.\nThe Pope will also meet a group of migrants in Paris, and in Lourdes some victims of sexual abuse by members of the Catholic clergy.\nBorn in Chicago in 1955, Pope Leo XIV was originally called Robert Prevost – a French name.\nIn fact his paternal grandmother was born in Le Havre in Normandy in 1894. When she married in the US many years later she and her Italian husband took the name Prevost, which had been her mother's maiden-name.\nFrance has a historically complex relationship with the Catholic Church of Rome. The country was long known as the \"Eldest Daughter of the Church\" because supposedly, but inaccurately, it was the first kingdom to convert to Christianity. Actually Armenia, Georgia and Ethiopia preceded it.\nIn the 14th Century the papacy came in exile to Avignon in southern France, and over following centuries French armies periodically intervened in Italian politics, where popes were secular rulers as well as heads of the Church.\nNapoleon held two popes in captivity.\nRecent popes have all come to France, most notably John-Paul II, who came several times between 1980 and 2004, and Pope Francis who came three times, but avoided Paris, going instead to Strasbourg, Marseilles and Corsica.\nToday France has secularised with the rest of Europe, and less than half of the population identifies as Catholic.\nThe number of regular worshippers has fallen from 35% of the population in 1960 to less than 5% today, while the number of priests has shrunk by two-thirds from 25,000 in 1990 to fewer than 9,000.\nBut in recent years there have been signs of a growing interest in religious tradition, with the number of adult baptisms more than doubling in five years to hit 10,000 in 2025.\n\"France has indeed secularised, but there is a void where God and values used to be,\" said Cardinal François Bustillo, Bishop of Ajaccio.\n\"People are searching for something. Maybe they go to India or Tibet or the Amazon. And now the Pope comes here from Rome, bringing a reminder to people of their own roots.\n\"It was John-Paul II who awoke the East. Now Leo XIV will awake the West,\" he said.\nRelated topics\n  - Published13 April\n  - Published30 November 2025", "translation_ja": "", "vocab": []}, {"title_ja": "Anti-migrant activist charged after dinghy slashed in Channel", "title_en": "Anti-migrant activist charged after dinghy slashed in Channel", "summary_ja": "Activist Daniel Thomas is charged in connection with an incident in the English Channel on Tuesday.", "summary_en": "Activist Daniel Thomas is charged in connection with an incident in the English Channel on Tuesday.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crkgwe3egpzgo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Anti-migrant activist charged after dinghy slashed in Channel\n- Published\nAnti-migrant activist Daniel Thomas has been charged with criminal damage after a video appeared to show him slashing at a dinghy in the English Channel.\nThe 37-year-old, known to his supporters as Danny Tommo, has also been charged with failing to disclose the PIN to his phone, Hampshire Police said.\nHe has been remanded in custody and is due to appear at Basingstoke Magistrates' Court via videolink on Friday, the force added.\nSeveral hundred people had gathered outside a police investigation centre in Basingstoke on Thursday evening believing Thomas was inside.\nThe demonstration, which seemed to pass off peacefully, began shortly before 18:30 BST. Protesters stood on the road outside the building and could be heard chanting \"free DT\".\nThe crowd began to disperse at about 21:45 BST after they learned of the charges against Thomas.\nChris Derrick, Deputy Chief Crown Prosecutor for The Crown Prosecution Service (CPS) Wessex, said in a statement: \"Our prosecutors have worked to establish that there is sufficient evidence to bring the case to court and that it is in the public interest to pursue criminal proceedings.\"\n\"We remind all concerned that proceedings against the defendant are active and he has the right to a fair trial.\"\nHampshire Police earlier said an arrest had been made after a \"boat that had an emergency responder on board\" was damaged in the Channel on Tuesday.\nThe force previously said it was examining the video, which had been live-streamed.\nA French coastguard official was on board when Thomas appeared to slash at the vessel.\nSome 50 migrants who had travelled in the boat from Normandy had already been transferred on to RNLI lifeboats. They were later moved on to a UK Border Force vessel and taken to Dover for processing.", "translation_ja": "", "vocab": []}, {"title_ja": "Crashed RAF jet steered to 'avoid built-up areas' before pilots ejected, commander says", "title_en": "Crashed RAF jet steered to 'avoid built-up areas' before pilots ejected, commander says", "summary_ja": "Gp Capt Gez Currie said the pilots are in hospital, and their families are with them.", "summary_en": "Gp Capt Gez Currie said the pilots are in hospital, and their families are with them.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crx2zlqqpn2do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Crashed RAF jet steered to 'avoid built-up areas' before pilots ejected\n- Published\nAn RAF jet was steered to \"avoid built-up areas\" before two pilots ejected out of the aircraft, an air force commander has said.\nGp Capt Gez Currie, Station Commander, said: \"The aircraft would have been aimed in a direction that the pilot believed was open field, in order to avoid built-up areas and anybody on the ground.\"\nThe Hawk T2 aircraft had been flying out of the RAF Valley station on Anglesey on Wednesday when it plummeted to the ground in nearby Pencarnisiog, narrowly avoiding homes.\nThe trainee and an experienced professional, who parachuted out of their plane moments before it crashed, are expected to make a full recovery after they were treated for minor injuries.\nHawk operations have been paused by the RAF as a \"precautionary measure\" while investigations into the crash are ongoing - the Red Arrows are included in the pause as the aerobatics display team use the T1.\nThe Ministry of Defence (MoD) confirmed that the squadron of Hawk jets at RAF Leeming, in Yorkshire, has also \"paused\" flying.\nCurrie said the pilots were in hospital being cared for and were with their families.\nHe would not give personal details about them and said the investigation was in its early stages, adding \"it's far too early to even suggest what has happened in this occasion\".\nHe said: \"It was a trainee, with a highly experienced instructor on a routine sortie, across the Anglesey area.\"\nAccording to the MoD, a sortie is \"one mission, one complete trip\".\nHe added that in the two-and-a-half years as station commander, and in his 30-year career as an air traffic controller, \"this is the first time I've experienced this\".\nEyewitness Ollie Zalot said he was initially concerned that people on the ground could have been hurt as the crash happened near buildings, while Anglesey councillor Neville Evans said he thought it had been a \"very lucky escape considering how close\" the crash was to a village and caravan park.\nA video of the crash shared on social media on Wednesday appeared to show the two pilots ejecting from the aircraft before it nosedives and crashes in flames.\nSeparate footage also showed a plume of smoke and flames rising from the rear of a jet as it rolled down the runway before the crash. As the jet climbed, the flames seemed to disappear.\nMikey Kay, a BBC security analyst who also served in the RAF for 20 years, told the BBC that while it was too early to say, it was possible that the cause of the crash was not an engine failure.\nIn a statement on social media, the RAF said: \"Both pilots are doing well, they are in extremely good spirits and expected to make a full recovery.\n\"A formal investigation into the circumstances surrounding the incident is now under way and, as a precautionary measure, the RAF has temporarily paused Hawk T1 and Hawk T2 flying operations.\"\n1 of 5\nThe Hawk T1, and newer T2 versions are transonic, two-seat training aircraft used to train fast jet pilots.\nThe Red Arrows, based at RAF Waddington in Lincolnshire, are included in the pause, however they were not due to fly again until Le Touquet Airshow in France this weekend in any event. It is not known when the restriction will be lifted.\nRelated topics\nMore top stories\n  - Published13 hours ago\n  - Published18 hours ago\n  - Published17 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "Man jailed for throwing bottle at migrant protest", "title_en": "Man jailed for throwing bottle at migrant protest", "summary_ja": "Del Somerville, 42, pleaded guilty to violent disorder following an overnight protest at Eastney.", "summary_en": "Del Somerville, 42, pleaded guilty to violent disorder following an overnight protest at Eastney.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8vgy7ww21rqo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Man jailed for throwing bottle at migrant protest\n- Published\nA father-of-two has become the first man jailed following an anti-migrant protest in Portsmouth after admitting throwing a plastic bottle and swearing at police.\nDel Somerville, 42, was given a two-year sentence after previously pleading guilty to violent disorder at the city's crown court following the overnight protest near Eastney Marina on 6 September.\nHundreds of protesters gathered after a boat carrying about 120 migrants was brought ashore near Eastney Beach.\nHe pleaded not guilty to a separate charge of assaulting a police officer, relating to an incident on 11 September, and will face trial at Portsmouth Magistrates Court at a later date.\nJudge Daniel Sawyer told Somerville that his sentence would act as a deterrent to others following subsequent protests in the area.\nDescribing him as a \"thug\", he told the defendant: \"Police officers dedicate their lives to the protection of the public regardless of their own views, the very least they can expect is that those who engage in protests treat them with respect and the courts punish those who assault them.\"\nThe court heard Sommerville, from Portsmouth, was among a large group of demonstrators protesting at the arrival of the migrants.\nThey were brought ashore by the RNLI after being picked up in the Channel. A number of volunteer lifeboat crew members were subject to online abuse following the incident.\nProsecutor Edward Warren said Somerville was part of an \"initially peaceful and lawful\" gathering of a number of people on Ferry Road.\nAt shortly before 23:30 BST, he was with a large group of men as they were held up by the police line.\nThe court was told he was identified in police body-worn video as throwing a small bottle and swearing at police.\nWhen later interviewed by police, he said he had found the bottle on the ground and was going to throw it into a nearby bush, but was angry and so threw it up into the air.\nDefence barrister Helen Easterbrook said Somerville had been \"caught up\" in the disturbances.\nShe said he had been attempting to be a \"calming influence\" on the crowd but had thrown the bottle \"in frustration\".\nFour other men are awaiting sentence having also been charged with violent disorder following the protest in Eastney.\nGet in touch\nYour Voice", "translation_ja": "", "vocab": []}, {"title_ja": "Jürgen Klopp starts Germany job with shaky Netherlands draw", "title_en": "Jürgen Klopp starts Germany job with shaky Netherlands draw", "summary_ja": "A late Netherlands goal denied Jürgen Klopp a win in his first match as Germany coach. The former Liverpool and Borussia Dortmund boss has big ambitions, but the game showed he's going to need more time to achieve them.", "summary_en": "A late Netherlands goal denied Jürgen Klopp a win in his first match as Germany coach. The former Liverpool and Borussia Dortmund boss has big ambitions, but the game showed he's going to need more time to achieve them.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/jürgen-klopp-starts-germany-job-with-shaky-netherlands-draw/a-79420143?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Jürgen Klopp starts Germany job with shaky Netherlands draw\nSeptember 25, 2026\nIt looked, until the final moments, as though Germany would somehow hold on and grant Jürgen Klopp a victory in his first game as Germany coach.\n\"It felt mostly good,\" Klopp told German broadcaster RTL after the match, with his voice strained after a typically energetic display on the sidelines. \"That was really exhausting for both teams today.\" He added that he naturally wanted a win but that he can \"live with the point, too.\"\nIn the end, an injury time Cody Gakpo goal meant Klopp and his team had to settle for a 1-1 draw in their Nations League opener against the Netherlands. While the timing of the equalizer will sting, Germany was second best for much of the contest, which turned a ill-tempered at times. Nevertheless, Klopp was upbeat.\n\"I was very, very, very satisfied with many of the individual performances,\" he said, before admitting that \"we can play better football and create more chances — that's for sure.\"\nGakpo plays his club football for Liverpool, where Klopp coached for more than eight years. So too does Dutch captain Virgil van Dijk, who thought he'd opened the scoring for the hosts early on, only to see his headed goal ruled out. A close-range finish from Lukas Nmecha then gave Germany the lead but not control of the game.\nNew faces, new coach, not yet new Germany\nWhile there were a few patches of attacking play that resembled the kind of high-intensity, exhilarating football that Klopp produced at Liverpool and, before that, at Borussia Dortmund, Germany looked shaky at the back and were thankful for some wasteful Dutch finishing.\nIt is, though, difficult to judge much at this early stage. Klopp replaced Julian Nagelsmann after another poor World Cup showing from Germany and, after naming two different squads for the four Nations Leagues games in an extended international period, is still assessing how to make the most of what he has. Three players — Younes Ebnoutalib, Yannik Engelhardt and Philipp Treu — made debuts on Thursday, and more are likely follow over the next three games.\n\"I won't promise anything [in terms of trophies]. What I can promise is that we will definitely give it a try,\" he told reporters ahead of the game. \"There's an impression that we have less quality than other countries. When things aren't working, you take a closer look and try to bring about changes. That's what we're working on now.\"\nAfter Germany lost Kai Havertz to injury in the first half, having already had to change to starting XI after Jamal Musiala pulled out of the match in the warmup, the team was left without much of their attacking experience and class.\nKlopp's record should buy him time\nBut Klopp won't panic. His methods, both tactically and emotionally, will take time to bear fruit. At Liverpool, it took nearly five years to win a trophy; at Dortmund, it took three.\n\"When the system isn't yet in place and the processes aren't yet established, then something like this happens,\" he said about Wednesday's performance. \"I was very pleased with the passion, the intensity, but we can definitely play better.\"\nUsually, waiting for success would not be acceptable for German national team fans. But after repeated recent failures, and with Klopp a popular figure, he has more credit in that bank than his predecessor, Julian Nagelsmann. The last coach to win a World Cup for Germany, Joachim Löw, said he will need it.\n\"It is crucial now to give him the necessary time and space to implement his ideas,\" he told the Münchner Merkur/tz newspaper. \"Jürgen stands for energy, intensity and a strong bond between the team and the fans. But even for him, not everything will work from one day to the next. After a disappointing World Cup, it takes trust, patience and a team that once again plays for Germany with great conviction.\"\nKlopp calls for German unity, seeks Greece win\nKlopp has already tried to unite the country behind the team. On the touchline in Amsterdam, he ran through his familiar repertoire of fist bumps, beaming smiles and growls at officials in a cap emblazoned with the words \"one of 83 million\" on it.\nThe headgear has already become a familiar sight. It's a reference to Germany's population and the 59-year-old has also referenced the importance of his team, and their flag, as a symbol of nationhood at a time when the far-right AfD (Alternative for Germany) are making substantial electoral gains.\n\"I'd like to reclaim the flag for myself — or for us,\" Klopp said. \"I want us to always wave it in a way that makes no one think: 'What's wrong with you?' But, rather, that people simply get the feeling that you're happy and understand how lucky you are to have been born, raised or moved to this wonderful country.\"\nWhile Klopp's charisma makes such a lofty ambition seem somewhat feasible, he's also pragmatic enough to know that for the German national team to be universally loved, it needs to win. Augsburg on Saturday, against Greece ", "translation_ja": "", "vocab": []}, {"title_ja": "UNGA: Gaza dominates agenda as Abbas, Netanyahu speak", "title_en": "UNGA: Gaza dominates agenda as Abbas, Netanyahu speak", "summary_ja": "Prime Minister Benjamin Netanyahu called accusing Israel of genocide in Gaza the \"greatest lie of the century.\" Many delegates walked out for his General Assembly speech. Mahmoud Abbas also spoke earlier. DW has more.", "summary_en": "Prime Minister Benjamin Netanyahu called accusing Israel of genocide in Gaza the \"greatest lie of the century.\" Many delegates walked out for his General Assembly speech. Mahmoud Abbas also spoke earlier. DW has more.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/unga-gaza-dominates-agenda-as-abbas-netanyahu-speak/live-79366211?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "UNGA: Gaza dominates agenda as Abbas, Netanyahu speak\nPublished September 22, 2026last updated September 25, 2026\nWhat you need to know\n- Israel's Prime Minister said attacking Iran was one of his 'easiest' decisions, as he had no real choice\n- Many representatives walked out of the UN General Assembly ahead of Benjamin Netanyahu's speech\n- Palestinian President Mahmoud Abbas earlier urged nations to support the two-state solution, and sharply criticized Israel and the US\n- The UK will host a meeting on the future of the Gaza Strip, while Saudi Arabia and Norway have called a ministerial meeting to discuss the implementation of the so-called two-state solution\n- Beyond the Middle East, day 3 of the UNGA will address the problem that rising sea levels pose for low-lying islands and coastal regions\nRead below for all the top headlines, videos and analyses on the 81 UN General Assembly from September 22-28, 2026:\nTired of missing our real-time updates? Click here to add us as a Preferred Source on Google. Then tap the \"Star\" or \"Preferred\" to keep DW News at the top of your feed.\nYemen, Kuwait stress freedom of navigation at UNGA\nYemen and Kuwait, both heavily impacted by the Iran war and its regional spillover, have used their General Assembly addresses to stress the importance of the freedom and safety of navigation, while condemning Iran and its proxies in the region.\nAbdullah Abdulkader Al Alimi-Bawzer, vice resident of Yemen's Presidential Leadership Council, represents the internationally recognized government, which has been at war with the Iran-backed Houthirebels for more than a decade.\nAlimi-Bawzer devoted his address to highlighting recent Houthi actions and their impact on global trade.\nThe Houthis' conflict with Saudi Arabia, which has led a coalition against them, has recently escalated, with the Yemeni rebels declaring a blockade on Saudi shipping in the Bab el-Mandeb Strait, a crucial global shipping route. This has further squeezed the Saudi kingdom as Iran continues to block access through the Strait of Hormuz.\n\"Ensuring security at sea begins with eliminating the source of the threat on land,\" Alimi-Bawzer said, in an apparent reference to the Houthis.\nKuwaiti Crown Prince Sheikh Sabah Khaled Al-Hamad Al-Sabah stressed that freedom and safety of navigation, as well as the right of passage through the Straits of Hormuz and Bab el-Mandeb, must be guaranteed.\n\"To inflict harm on the economies of the region and the world, and to disrupt global trade and oil markets, Iran is obstructing maritime navigation and closing the Strait of Hormuz, using it as a bargaining chip in the war, in violation of international law and relevant Security Council resolutions,\" he said.\nKuwait has been among the countries targeted by Iranian strikes since the start of the war, in retaliation for US and Israeli strikes.\nNigeria says don't 'surrender our technological future to paranoia'\nNigeria's Vice President Kashim Shettima addressed the assembly on behalf of President Bola Tinubu.\nAmong a range of issues, he weighed in on the question of AI with an appeal for an optimistic and proactive approach more than what he deemed undue caution.\n\"We refuse to surrender our technological future to paranoia,\" he said. \"An invention can be destructive or beneficial, depending on the purpose it serves and the judgment of those who use it. A knife can take a life in the hands of an assailant, and can save one in the hands of a surgeon.\"\nHe said that while AI could be used to wage war, it could also \"transform\" an array of areas like healthcare, education and agriculture.\n\"Muhc of the anxiety surrounding AI reflects the distrust we have allowed to grow amongst us,\" Shettima said.\nHe said Nigeria wished to invite the world \"to work with our inventive, resourceful and enterprising young people to direct AI towards humanity's advancement rather than its destruction.\"\nFiji calls for cheaper financial transfers for remittances, saying 'they are not aid'\nFijian President Ratu Naiqama Tawakecolati Lalabalavu addressed the chamber on behalf of one of the low-lying island nations at severe risk from climate change on Thursday.\nHe said that many of the UN's sustainable development goals remained off track with 2030 approaching and said that aid and financial assistance often did a poor job of reaching remote islands exposed to more natural disasters than average. But then he called for a wider financial system that would better enable Fijians to help themselves.\n\"There is one measure of delivery that reaches Fijian households directly,\" he said. \"Remittances are now Fiji's third-largest source of foreign exchange.\"\nLalabalavu said these funds paid for school fees, rebuilt homes after cyclones and sustained families between harvests.\n\"Your excellencies, they are not aid. They are earnings of Fijians abroad, sent home. Yet Pacific corridors remain among the most expensive in the world through which to send money.\"\nHe noted how the chamber had", "translation_ja": "", "vocab": []}, {"title_ja": "Three-way battle for power in world chess: Who will be elected FIDE president in Samarkand?", "title_en": "Three-way battle for power in world chess: Who will be elected FIDE president in Samarkand?", "summary_ja": "The era of Russian presidents is coming to an end at the World Chess Federation (FIDE). Two Germans and one Kazakh are up for election. Among the issues at play are money, Kremlin influence, and unanswered questions.", "summary_en": "The era of Russian presidents is coming to an end at the World Chess Federation (FIDE). Two Germans and one Kazakh are up for election. Among the issues at play are money, Kremlin influence, and unanswered questions.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/three-way-battle-for-power-in-world-chess-who-will-be-elected-fide-president-in-samarkand/a-79413301?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Three-way race: Who will win power in chess?\nSeptember 24, 2026\n\"Gens una sumus\" (\"We are one family\") is the motto of the World Chess Federation (FIDE). Yet when officials from some 200 countries gather for their congress in Samarkand on Saturday, September 26, it is not likely to feel like a joyous family reunion.\nA new FIDE president is to be elected in Uzbekistan, and a three-way, politically charged race for the post has erupted, with the outcome uncertain. It has been clear since July that the incumbent FIDE president, Arkady Dvorkovich, would not be standing for re-election. The European Union had placed the former Russian deputy prime minister on its sanctions list due to his support for Russia's war of aggression in Ukraine.\nThree entrepreneurs vying for the top job\nThe candidates standing for election are Kazakh billionaire Timur Turlov and two Germans: investor Jan Henric Buettner and entrepreneur Wadim Rosenstein, who is running as the official candidate of the German Chess Federation (DSB).\nFor the first time in over 30 years, FIDE will not be led by a Russian. Nevertheless, the three contenders repeatedly face two questions: What are their ties to Russia? And where do the millions come from that FIDE uses to finance itself and its competitions? For the Kremlin, chess remains a component of Russia's soft power, and little happens within FIDE without financial backers linked to Russia.\nJan Henric Buettner: The Formula 1 model\nBuettner is arguably the best positioned to answer these questions. A native of Hamburg, he has made a name for himself in the chess world through his collaboration with former world champion Magnus Carlsen. The 62-year-old German has no known ties to Moscow that would require explanation. On the contrary: \"We are the only team with no connection to Russia,\" Malcolm Pein — Buettner's candidate for vice president — told DW.\nBuettner and his running mate say they intend to reduce reliance on Russian financial backers and make chess commercially successful. Buettner plans to distribute 20% of FIDE's revenue to chess federations worldwide. The former AOL executive looks to Formula 1 motor racing as his model – a vision likely considered too radical by many officials in the chess world. Consequently, Buettner is seen as having only an outside chance of winning.\nTimur Turlov: The establishment candidate\nThe favorite to become FIDE's new president is Timur Turlov. Born in Moscow, he became a Kazakh citizen in 2022 and is one of the wealthiest men in the Central Asian nation. The entrepreneur is considered a close associate of outgoing President Dvorkovich and, by extension, a member of the FIDE establishment. Regarding finances, too, the status quo is likely to remain unchanged under the 38-year-old; after all, Turlov's publicly traded financial firm, Freedom Holding Corp., has been FIDE's main sponsor for many years.\nThe prospect of Turlov potentially holding the dual roles of FIDE president and major financial backer does not sit well with everyone in the chess community. Furthermore, Freedom Holding Corp. and its CEO are currently on Ukraine's sanctions list. Ukrainian authorities accuse Turlov's company of helping to finance Russia's war of aggression. Press reports also suggest that the US Securities and Exchange Commission (SEC) has taken an interest in Turlov's financial firm.\nReport: Hamburger Sparkasse closes account\nIn the spring of 2026, Turlov acquired the Hamburg-based chess software company Chessbase. Shortly thereafter, the German chess news website perlenvombodensee.de reported that the company's principal bank, Hamburger Sparkasse, had closed the Chessbase business account.\nChessbase declined to comment on the matter. Hamburger Sparkasse also did not address the specific case but told DW: \"If a business relationship falls under currently existing sanctions – for example, against countries such as Russia, Belarus, or Iran – this may unfortunately result in us being unable to continue specific business relationships.\"\nDW approached Timur Turlov for comment but had received no response by time of publication.\nThe position of Volodymyr Kovalchuk, vice president of the Ukrainian Chess Federation is clear.\n\"If Turlov wins the FIDE election and poses a threat to Ukraine's security, then we will push for him to be sanctioned by the EU as well,\" Kovalchuk told DW.\nHowever, there are now signs of a rapprochement between Turlov and the Ukrainians: Turlov is currently advocating for a Ukrainian official to be elected as a vice president on the FIDE board.\nWadim Rosenstein: Many outstanding questions\nThe third figure in the mix, Wadim Rosenstein, is also facing intense scrutiny in Ukraine.\n\"It is absolutely clear that we will not support such a candidate and, should he be elected, will also propose him for sanctions,\" Kovalchuk said.\nRosenstein was born in 1990 in what is now Ukraine and moved to Germany at the age of nine. In the autumn of 2022, the entrepreneur and amateur c", "translation_ja": "", "vocab": []}, {"title_ja": "Federal agency says it's moving on without DC, Virginia cooperation on Trump's arch", "title_en": "Federal agency says it's moving on without DC, Virginia cooperation on Trump's arch", "summary_ja": "Virginia agency says the Park Service hasn't tried to resolve opposition.", "summary_en": "Virginia agency says the Park Service hasn't tried to resolve opposition.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/federal-preservation-agency-terminating-required-consultation-local-officials/story?id=136730003", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Man who was shot during 2024 Trump campaign rally in Butler, Pennsylvania, has died", "title_en": "Man who was shot during 2024 Trump campaign rally in Butler, Pennsylvania, has died", "summary_ja": "James Copenhaver, one of three campaign rally attendees shot in 2024 during an assassination attempt on then-candidate Donald Trump, has died", "summary_en": "James Copenhaver, one of three campaign rally attendees shot in 2024 during an assassination attempt on then-candidate Donald Trump, has died", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/wireStory/man-shot-2024-trump-campaign-rally-butler-pennsylvania-136737152", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Rebel offensive against Ethiopian army stokes fears of return to civil war", "title_en": "Rebel offensive against Ethiopian army stokes fears of return to civil war", "summary_ja": "Fighting escalates after Tigrayan rebels form new coalition aimed at overthrowing Abiy Ahmed government There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance ai", "summary_en": "Fighting escalates after Tigrayan rebels form new coalition aimed at overthrowing Abiy Ahmed government There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance ai", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/24/fears-return-to-war-tigray-rebels-launch-offensive-against-ethiopian-army", "state_media": false, "category": "政治", "full_text": "There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance aimed at overthrowing the government of the prime minister, Abiy Ahmed.\nAbout 600,000 people died between 2020 and 2022 during a devastating war between the Ethiopian army and the political party and paramilitary group the Tigray People’s Liberation Front (TPLF). Both sides are now accusing the other of triggering a return to open conflict.\nOn Sunday, seven armed groups from around the country, including the TPLF, announced the formation of the Ethiopian Peoples’ Forces Alliance for Survival, aimed at deposing the government in Addis Ababa. Then, on Wednesday, the TPLF seized control of three airports from federal police. The state-owned carrier, Ethiopian Airlines, said it had suspended flights to the region “due to the current situation”.\nThe TPLF also launched attacks into Afar and Amhara. A humanitarian source in Afar told Agence France-Presse there were heavy artillery attacks by the group on Thursday as they attempted to take control of the town of Yallo, near the Tigrayan border.\nFlights to the historic Ethiopian town of Lalibela were also suspended on Thursday because of nearby fighting, while people in Tigray stocked up on food and cash, with one resident telling Reuters that people there feared they could face siege conditions similar to those during the previous war.\nA resident of Adigrat, a city close to the Eritrean border, described panic-buying and shops emptying. “Food shortages are worsening as market shelves sit empty … Essential medicines remain scarce and astronomically expensive,” he told Reuters. “Daily survival has become a constant calculation.”\nThe TPLF’s vice-president, Amanuel Assefa, told AFP: “We are in the situation of full-blown war now.” He confirmed Tigrayan forces were fighting alongside local armed groups in Afar and Amhara.\nThe group took control of Abala, also on the Tigray-Afar border, on Wednesday, a foreign security source based in Ethiopia told AFP, while a TPLF source said they had seized several other towns in Afar. The foreign security source also said there was fighting around the Amhara town of Weldiya – one of the few routes to the capital.\nIn its first public comments on the fighting, Ethiopia’s army said on Thursday it had foiled the attacks and killed, wounded or captured more than 500 enemy fighters.\nAnalysts say the TPLF has support from Ethiopia’s neighbour and historic adversary Eritrea, which fears landlocked Ethiopia is planning to invade its territory to gain access to the Red Sea. The TPLF’s Assefa told AFP “we have no information about Eritrea’s plan”. Asked if they would request Eritrean intervention, he said: “Not yet.”\nThe current fighting reflects shifting dynamics from the civil war, when Eritrea and Fano, an insurgent group that is now part of the new alliance, both fought with the government against the Tigrayans.\nSpeaking at the UN general assembly on Wednesday, the Ethiopian president, Taye Atske-Selassie Amde, decried “the forces of destruction and mayhem” and “interference in our internal affairs by adversarial elements”. He said Ethiopia had exercised “immense restraint” and made progress with its neighbours.\nAbiy’s spokesperson, Billene Seyoum, said members of the alliance had been collaborating for a while with the financial backing of Eritrea. Eritrea has repeatedly denied similar accusations.\nThe TPLF ruled Ethiopia from 1991 to 2018 before being sidelined by the rise of Abiy, eventually triggering the civil war.\nThe renewed fighting marks the most serious challenge yet to the 2022 Pretoria agreement, which ended the civil war and maintained an uneasy calm until late last year, when clashes resumed.\nIt raises fears of a broader regional conflict that could draw in armed groups from across and further destabilise a region already strained by war in neighbouring Sudan and tensions along the Red Sea.\nOn Wednesday, the African Union chair, Mahmoud Ali Youssouf, urged “utmost restraint” from the warring parties and resumption of direct talks. An EU spokesperson called for “immediate de-escalation” and a recommitment to the Pretoria agreement.\nIn the 2020-22 war, Tigray was largely cut off from the outside world as communications were severed, and access to food, cash and medicines was severely restricted, pushing hundreds of thousands of people into famine-like conditions.\nAFP and Reuters contributed reporting", "translation_ja": "", "vocab": []}, {"title_ja": "Indian billionaire’s payments firm plots biggest London flotation in years", "title_en": "Indian billionaire’s payments firm plots biggest London flotation in years", "summary_ja": "Sunil Bharti Mittal’s Airtel Money targets $9bn IPO in boost for ailing UK stock market Nils Pratley: Does this mark the end of London’s listing drought? Not yet A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float", "summary_en": "Sunil Bharti Mittal’s Airtel Money targets $9bn IPO in boost for ailing UK stock market Nils Pratley: Does this mark the end of London’s listing drought? Not yet A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/business/2026/sep/23/indian-billionaire-payments-firm-london-flotation-airtel-money", "state_media": false, "category": "経済", "full_text": "A payments business that operates across Africa and is ultimately controlled by an Indian billionaire has announced its intention to float on the struggling London Stock Exchange.\nAirtel Money, the mobile money arm of Airtel Africa, is planning one of the biggest UK listings in years, in a boost for the shrinking London market that has faced a string of recent departures.\nThe company is understood to be hoping to raise about $800m (£601m) from the initial public offering (IPO) and is targeting a valuation of $8bn to $9bn, which would make it one of London’s largest listings in recent years.\nAirtel Money has 53 million monthly active users across 13 countries in sub-Saharan Africa, including Uganda, Zambia and the Democratic Republic of Congo.\nIt operates through a network of branches and kiosks, which enable customers to load money on to their phones, withdraw cash and access other money services, and the company generated revenues of just under $1.4bn in the last financial year.\nAirtel Money’s parent company is Airtel Africa, a telecoms provider that is part of the Indian conglomerate Bharti Enterprises, which is ultimately controlled by the billionaire Sunil Bharti Mittal. Airtel Africa is already listed on the FTSE 100 but said it wanted Airtel Money to be listed separately.\n“From a company perspective, [the listing] gives us flexibility for the future,” said Airtel Money’s chief executive, Ian Ferrao.\n“We evaluated multiple [stock] exchanges, including the Middle East because we’ve got a headquarters in Dubai, along with European and North American exchanges. Ultimately, shareholders felt that London was the right choice. We still believe there is deep capital available … all the global institutional investors are here.”\nFerrao added: “Most importantly there’s a deep understanding of emerging markets in the London market and Africa specifically.”\nAirtel Money said it would announce more details about the float in early October, including the indicative price range and number of shares to be offered, with final pricing to follow later in the month.\nAirtel Africa had originally targeted a listing in the first six months of 2026 but delayed it to the second half of the year, blaming unfavourable market conditions as a result of the US-Israeli war on Iran. Several other companies also pushed back planned IPOs amid the market volatility caused by the conflict.\nAirtel Africa owns just under 78% of Airtel Money and will remain a long-term investor after the IPO. Minority stakes are held by TPG, Mastercard, the Qatar Investment Authority and Chimetech Holding.\nRevenue in Airtel Money’s most recent quarter to 30 June climbed 38% to £399m, according to Airtel Africa.\nThe decision to float Airtel Money in the UK could mark a turning point for the City, which has struggled to attract listings in recent times and has also been hit by departures, partly as a result of overseas takeovers of UK companies.\nAirtel Money’s planned listing could be one of the biggest debuts since the international payments company Wise floated in 2021 with a valuation of £8.75bn. Wise has since moved its main listing from London to New York.", "translation_ja": "", "vocab": []}, {"title_ja": "Top South African police officer charged with raping woman, 18, and grooming 16-year-old girl", "title_en": "Top South African police officer charged with raping woman, 18, and grooming 16-year-old girl", "summary_ja": "Arrest of Shadrack Sibiya comes as country reels from cases of femicide and alleged police corruption and criminality One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corru", "summary_en": "Arrest of Shadrack Sibiya comes as country reels from cases of femicide and alleged police corruption and criminality One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corru", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/23/south-africa-top-police-officer-shadrack-sibiya-charged-rape-grooming", "state_media": false, "category": "政治", "full_text": "One of South Africa’s most senior police officers has been charged with raping an 18-year-old woman and grooming a 16-year-old girl, as the country’s police face allegations of corruption and failing to tackle violence against women and girls.\nShadrack Sibiya, who was already suspended from his role as deputy national police commissioner over allegations he interfered with political killings investigations, was arrested on Monday. He is facing charges of rape, people trafficking, promoting the sexual grooming of a child and two counts of grooming a child.\nSibiya appeared briefly in a Johannesburg court on Tuesday. He was then taken to prison in the capital, Pretoria, before a bail hearing on 29 September, as prosecutors had argued he was an escape risk.\nSouth Africa is reeling after the discovery of nine women’s bodies across Ekurhuleni, the municipality east of Johannesburg, in September. Meanwhile, the Madlanga Commission judicial inquiry has been examining allegations of corruption and criminality within the police for the last year.\nPuleng Dimpane, the acting national police commissioner, said: “Police officers are entrusted with protecting women and children. They cannot themselves be implicated in conduct that undermines this responsibility. As the country continues to confront the scourge of gender-based violence and femicide, there can be no room for anyone within the police service who is alleged to abuse their position or violate the rights of women and children.”\nSibiya is accused of raping an 18-year-old woman at a hotel in May in the Sandton business district of Johannesburg. The alleged rape took place “whilst she was passed out due to intoxication administered by the accused”, according to a copy of the charge sheet.\nThe alleged grooming of the 16-year-old girl took place over WhatsApp between 20 July and 3 August, according to the charge sheet. This allegedly included Sibiya sending the girl naked photos of herself, which she had not sent to him.\nSibiya did not enter a plea at the hearing on Tuesday. His lawyer told the court that they needed more time to consult with and get instructions from him, according to News24.\nFiroz Cachalia, the acting police minister, said: “We strongly condemn the alleged conduct.\n“Where allegations of sexual offences are made against a member of the service, they must be investigated without fear or favour.”\nWhen Sibiya appeared before the Madlanga Commission in February he denied allegations that he had moved 121 political killings investigations from KwaZulu-Natal province to the national head office without explanation.\nSibiya also denied that he had received a gift of 20 impalas from Vusimuzi ‘Cat’ Matlala, a businessman who received an allegedly fraudulent 360m rand (£16.7m) police health services contract soon after the alleged gift.\nMatlala, who has been charged with attempted murder, alongside several other charges including fraud and money laundering, declined to comment on the impalas when he appeared at the Madlanga Commission in August. He said he did not want to incriminate himself as the matter was under investigation.", "translation_ja": "", "vocab": []}, {"title_ja": "Turkiye vs France: UEFA Nations League – teams, kickoff time, lineups", "title_en": "Turkiye vs France: UEFA Nations League – teams, kickoff time, lineups", "summary_ja": "Zinedine Zidane brings &#039;aura&#039; to his first France game as coach, against Turkiye in Nations League", "summary_en": "Zinedine Zidane brings &#039;aura&#039; to his first France game as coach, against Turkiye in Nations League", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/24/turkiye-vs-france-uefa-nations-league-teams-kickoff-time-lineups?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Turkiye vs France: UEFA Nations League – teams, kickoff time, lineups\nWho: Turkiye vs France\nWhat: UEFA Nations League\nWhere: Kocaeli Stadium in Izmit, Turkiye\nWhen: Friday, September 25, at 9:45pm (18:45 GMT)\nHow to follow: Al Jazeera Sport will have all the build-up from 15:45 GMT.\nZinedine Zidane was asked if taking charge of his first France game on Friday will feel just as special as his playing debut for Les Bleus more than 30 years ago.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Harry Kane eyes career as NFL kicker after football retirement\n- list 2 of 4UEFA Nations League 2026-27: All you need to know\n- list 3 of 4UEFA’s Ceferin says FIFA trust still broken after Infantino investment row\n- list 4 of 4Diomande stars as Ivory Coast and Ghana begin AFCON 2027 path – all to know\n“Even more so, maybe,” a smiling Zidane said on Thursday ahead of a Nations League game in Turkiye. “I feel an immense emotion being at the head of this France team.”\nZidane’s dream was realised when he replaced Didier Deschamps after the 2026 World Cup. His former teammate Deschamps was in charge for 14 years, winning the World Cup in 2018 and losing the 2022 final.\nNow it’s Zidane’s chance to make his mark on a team he once starred for.\nAffectionately nicknamed “Zizou”, his face was beamed onto the Arc de Triomphe in Paris the night France celebrated its first World Cup triumph in 1998.\nZidane scored two headers in the final in a 3-0 win over Brazil and later that year he won the Ballon d’Or. Two years later, he was instrumental in France winning the European Championship.\nHis rise to the top seemed almost fated, for his international career began brilliantly in 1994 with two stunning goals against the Czech Republic after coming on as a substitute.\nHe then won league titles with Juventus and Real Madrid and scored a brilliant volley to help Madrid win the Champions League in 2002.\nZidane understands expectations are high, given his achievements as a player and how he led Real Madrid to three straight Champions League titles as a coach.\n“It’s something new. I’m taking over as head coach so people are talking about it,” he said. “That makes sense.”\nAfter facing Turkiye, France plays Belgium away on Monday before hosting Italy on October 2, and Belgium three days later, with both those games at the Stade de France.\nMbappe given all clear for France’s trip to Turkiye\nFrance’s all-time top scorer Kylian Mbappe is set to captain the side, having shrugged off a minor injury.\nZidane was asked why, given that Mbappe is captain, he was not present at Thursday’s pre-match news conference. Instead, it was midfielder Adrien Rabiot who spoke to the media.\n“The obligation is to have one player and the coach,” Zidane said. “[Mbappe] is fine. He will be ready to play tomorrow.”\nRabiot is one of France’s vice-captains along with forward Ousmane Dembele and right back Jules Kounde.\nRabiot said the huge attention placed on Zidane gave the players a welcome back seat.\n“His aura means he commands a lot of attention,” Rabiot said. “In a way, it’s a good thing that the focus is more on the coach than the players. It gives them a bit more peace and quiet.”\nZidane understands the limelight but does not seek it.\n“You have to accept how things are. But I’m not here for that,” he said. “Winning matches is what interests me the most.”\nWhat happened the last time Turkiye played France?\nThe sides shared a 1-1 draw in Paris in 2019 in a qualifier for Euro 2020.\nOlivier Giroud gave the home side the lead in the 76th minute before Kaan Ayhan levelled for Turkiye five minutes later.\nHead-to-head\nThis will be the seventh meeting between the nations, with France claiming four wins to Turkiye’s one in the previous encounters.\nTurkiye team news\nTurkiye will be without the services of Hakan Calhanoglu and Kenan Yildiz due to injury. Real Madrid starlet Arda Guler, however, is available despite fears of a knock.\nTurkiye predicted starting lineup\nCakir; Celik, Demiral, Bardakci, Elmali; Ozcan, Kokcu, Yuksek; Guler, Yilmaz, Akturkoglu\nFrance team news\nZidane can choose from six new faces in his squad.\nStriker Esteban Lepaul (Rennes), defenders Leny Yoro (Manchester United) and Jeremy Jacquet (Liverpool), midfielder Lucas Da Cunha (Como), Andy Diouf (Inter Milan) and Guillaume Restes (Toulouse) are set for their debuts.\n“I’m happy with what I’ve seen so far. The French team is open to everyone,” Zidane said. “We’ve got a good squad, some veterans, some newcomers.”\nFrance predicted starting lineup\nMaignan; Kounde, Upamecano, Lacroix, Truffert; Camavinga, Rabiot; Dembele, Olise, Doue; Mbappe", "translation_ja": "", "vocab": []}, {"title_ja": "Benjamin Netanyahu attacks Israel’s enemies and allies in UN speech", "title_en": "Benjamin Netanyahu attacks Israel’s enemies and allies in UN speech", "summary_ja": "Israeli prime minister denounces Iran, NYC Mayor Mamdani and critics accusing Israel of crimes against Palestinians.", "summary_en": "Israeli prime minister denounces Iran, NYC Mayor Mamdani and critics accusing Israel of crimes against Palestinians.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/24/benjamin-netanyahu-attacks-israels-enemies-and-allies-in-un-speech?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Benjamin Netanyahu attacks Israel’s enemies and allies in UN speech\nIsraeli prime minister denounces Iran, NYC Mayor Mamdani and critics accusing Israel of violations against Palestinians.\nDelegates walk out of Netanyahu’s UN speech\nIsraeli Prime Minister Benjamin Netanyahu has used his platform at the United Nations General Assembly to attack detractors and allies alike, and his presence sparked uproar in the chamber.\nSpeaking before the UNGA on Thursday, Netanyahu attacked New York City Mayor Zohran Mamdani, critics and Iran’s leadership, as well as allied countries like the United Kingdom and France.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Israel’s policies threaten ‘very existence’ of Palestinians, Abbas tells UN\n- list 2 of 3Israel moves to ban main Palestinian-led lists from election\n- list 3 of 3Netanyahu blames ‘juvenile delinquents’ for violence in occupied West Bank\nBack home, the prime minister is locked in a tight race to stay in power ahead of an election on October 27, and analysts say his UNGA speech was aimed as much at people back home as it was at international viewers.\nDozens of envoys from around the world walked out as the speech began, some jeering and booing, while Netanyahu’s own team stood and applauded, and the speaker of the session shouted for order.\n“If there are any other moral cowards who haven’t left this hall, please do so now,” Netanyahu said to those turning their backs on him.\nHe addressed the war that the US and Israel launched on Iran in February, saying: “Devastating Iran’s nuclear facilities was hard, was very hard to do.”\n“But for me, it was one of the easiest decisions I’ve ever had to make as prime minister”, claiming that if he had not, “we’d all be dead”, he added.\nIn his own speech before the UNGA on Wednesday, Iranian President Masoud Pezeshkian also addressed the nuclear issue and called out the “double standard”.\n“The nuclear weapon is in Israel, but the inspectors are in Iran. Israel kills, but Iran is subject to sanctions,” Pezeshkian said.\nNetanyahu on Thursday said that Israel was fighting a “seven-front war”, including Gaza, the occupied West Bank, Syria, Lebanon, Iran, Yemen’s Houthis and militias in Iraq.\n“We are going to win. We have no other choice,” Netanyahu declared, repeating the words of his older brother Yonatan Netanyahu, who was killed in 1976 during Operation Entebbe in Uganda.\nCriticising allies\nThe United Kingdom and France, historic partners of Israel, were also in Netanyahu’s firing line. They have become increasingly outspoken in their criticism of the country’s actions and have both imposed limited sanctions on Israeli exports from the occupied West Bank.\n“They accuse Israel, tiny Israel, of colonialism – some colonialism. And who’s accusing us? Among them are people in Britain and in France. For God’s sakes, they invented the term,” he said.\nBut Netanyahu thanked his “friend”, United States President Donald Trump.\n“In this battle against the barbarians, we’ve had no greater partner than President Trump,” he said, as the US delegation joined the Israeli one in applauding Netanyahu’s remark.\n“I thank him,” said Netanyahu, adding that Israel and the US had acted together as pilots from both countries “flew joint missions over the skies of Iran”.\nNetanyahu said the US and Israel also “worked together to bring back our remaining hostages [from Gaza]”, as he defended Israeli actions in the enclave against charges of genocide.\n“To all those spreading lies about my country, whether they sit in this hall or in the office of the anti-Semitic mayor of New York, I say this: shame on you,” Netanyahu said as he attacked Zohran Mamdani, who had previously said he would push for the arrest of the Israeli prime minister during his visit to the city.\n“Mr Mamdani, you tried to stop me from coming here. You tried to silence me. Well, you can’t silence me,” Netanyahu said as he denied that Israel has committed genocide in Gaza.\nReacting to Netanyahu’s comments, Mamdani called the accusations against him “baseless lies” meant to “sanitise his genocide of Palestinians”.\nSince October 7, 2023, Israel has faced repeated accusations of genocide in Gaza, as well as systematic war crimes in Gaza and the occupied West Bank.\nThe Hague-based International Criminal Court (ICC) said in 2024 it had reasonable grounds to believe Netanyahu was responsible for war crimes in Gaza, where over 73,000 Palestinians have been killed. Netanyahu denies the ICC charges.\nNetanyahu attended the UNGA meeting despite an ICC warrant calling for his arrest. While he was welcomed, the Trump administration denied a visa for Palestinian President Mahmoud Abbas, who addressed the UNGA through a prerecorded video statement from Ramallah earlier in the day.\n‘War criminal’\nAs Netanyahu spoke, activists from US-based organisation Jewish Voice for Peace protested outside, accusing the United Nations of “playing host to a war criminal”.\n“All across New York, Jews, Palestinians and peopl", "translation_ja": "", "vocab": []}, {"title_ja": "DR Congo and Ivory Coast top Africa Cup of Nations qualifying opening wins", "title_en": "DR Congo and Ivory Coast top Africa Cup of Nations qualifying opening wins", "summary_ja": "DR Congo beat Equatorial Guinea, while Ivory Coast cruise by Ghana and Cameroon beat Comoros as AFCON qualifiers begin.", "summary_en": "DR Congo beat Equatorial Guinea, while Ivory Coast cruise by Ghana and Cameroon beat Comoros as AFCON qualifiers begin.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/24/dr-congo-and-ivory-coast-top-africa-cup-of-nations-qualifying-opening-wins?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "DR Congo and Ivory Coast top Africa Cup of Nations qualifying opening wins\nDR Congo beat Equatorial Guinea, while Ivory Coast cruise by Ghana and Cameroon beat Comoros as AFCON qualifiers begin.\nThe Democratic Republic of the Congo followed up their World Cup exploits with a 2-0 home win over Equatorial Guinea on the opening day of the group qualifiers for next year’s Africa Cup of Nations.\nCaptain Chancel Mbemba headed home the opening goal in the fourth minute, and Yoane Wissa added a second 18 minutes from time in Kinshasa on Thursday, although the scoreline might have been more emphatic after they twice struck the woodwork and also had two efforts ruled offside.\nIt was the first game for the Congolese after advancing through the first phase of the World Cup for the first time and running England close in their last-32 tie in Atlanta in July.\nHowever, there was no opportunity for home supporters to celebrate their achievement as the size of the crowd at the Stade des Martyrs was restricted to 20,000 after sanctions for fan violence that followed defeat by Senegal in World Cup qualification one year ago.\nMauritania and Namibia were also winners in Thursday’s early games, while Libya netted a last-gasp penalty to salvage a 2-2 draw at home to Botswana behind closed doors in Tripoli, where the stadium was also banned because of previous supporter violence.\nBotswana striker Tumisang Orebonye scored a double in the first half to put his side on course for a rare away win before Maruwan Alhibeeshi thrashed home from the edge of the area to pull one back in the 87th minute.\nBotswana substitute Mothusi Cooper gave away a stoppage-time penalty with a clumsy challenge, allowing Ezoo El Mariamy to rescue a draw.\nMauritania won 3-1 over the Central African Republic in Casablanca, Morocco, which included a superb chipped effort over the goalkeeper from Dawda Camara, while Bethuel Muzeu scored the only goal as Namibia edged Congo.\nIvory Coast beat Ghana 2-0 in a derby in Bouake in a Group C encounter.\nA stunning strike from Malick Yalcouye opened the scoring from outside the box in the first half, although the Ghana keeper, Lawrence Ati-Zigi, will feel he should have done better at his near post.\nFranck Kessie gave the Black Stars stopper no chance as he sent his opponent the wrong way with a side-footed second-half penalty.\nGhana, who failed to qualify for the 2025 edition of AFCON, are left to reflect on a match where they failed to register a shot on target until the 75th minute. They also conceded 61 percent of possession to their hosts.\nCameroon beat Comoros 3-1, while Tunisia were held to a 1-1 draw by Uganda in the pick of the other ties.", "translation_ja": "", "vocab": []}, {"title_ja": "Should permanent membership and veto powers of the UNSC be abolished?", "title_en": "Should permanent membership and veto powers of the UNSC be abolished?", "summary_ja": "", "summary_en": "", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/op-ed/should-permanent-membership-and-veto-powers-of-the-unsc-be-abolished/article71505505.ece", "state_media": false, "category": "社会", "full_text": "In the ongoing session of the UN General Assembly (UNGA), France has made a proposal to enhance the functioning of the UN, especially in dealing with collective security and the use of veto. France has been advocating that the use of veto in the UN Security Council (UNSC) be “regulated” when it comes to dealing with humanitarian crises such as in Sudan, Lebanon or in cases of genocide. France believes that the use of veto is not a matter of “privilege” but of “responsibility”. So, should permanent membership and veto powers of the UN Security Council be abolished? Amitabh Mattoo and Swaran Singh discuss the question in a conversation moderated by Kallol Bhattacherjee. Edited excerpts:\nIs it realistically possible to imagine an UNSC where veto would be “regulated” as the French proposal suggested?\nAmitabh Mattoo: What Emmanuel Macron (President of France) articulated in the UNGA on September 22 is not entirely new. What we are seeing is really a renewed push behind what used to be called the French-Mexican initiative, first launched in 2015, under which permanent members of the SC would voluntarily refrain from using the veto in situations involving genocide, crimes against humanity, and large-scale war crimes. It’s not an attempt to abolish the veto or amend the UN charter. It’s essentially an exercise in self-restraint by the P5 (permanent members of the UNSC: U.S., U.K., France, China and Russia). What gives the initiative fresh significance is not just Mr. Macron’s speech, but the political momentum behind it. France and Mexico both announced this week that 128 states now support the declaration, with 21 joining in the last four months. And the significant part is that the U.K., another P5 country, has now joined France in accepting the principle.\nSo for the first time, two of the five permanent members have committed themselves to this form of voluntary restraint.\nAlso read | Expanding permanent category with veto critical to real reform of UNSC: India\nBut I think we should also distinguish between three different questions which are often conflated — the use of the veto, accountability for the use of the veto, and the much larger question of reform of the Security Council. Mr. Macron’s initiative addresses only the first. It says in effect, even if the veto remains, surely there must be circumstances of exceptional human suffering in which a permanent member agrees not to exercise it. It is, as I said, a modest incremental proposition institutionally, but potentially significant normatively in terms of what we want the world to be like. It seeks to change the political behaviour of the five permanent countries without undertaking what seems to be the almost impossible task of rewriting the charter. So, it’s a modest proposal and it has got some momentum, but whether it translates into reality, we’ll have to wait and see.\nDoes the current situation in UNGA indicate that the P5 is now divided between the France-U.K. and Russia-U.S.-China factions on the use of veto?\nSwaran Singh: Clearly, the U.K. and France are not the heavyweights among the P5. Therefore, I think it is easier for France and the U.K. to make that principled position saying that the P5, which wield veto power, should be able to better regulate or manage how fundamentally the power is utilised; to make sure that the UNSC is able to take action and that it does not get paralysed. In fact, the contradiction of 2013 itself was driven by the fact that in the civil war in Syria, Chinese and Russian vetoes were making it impossible for the UNSC to pass any resolution condemning Syria. After the August 2013 chemical weapons attack in Ghouta in September, the then French President Francois Hollande had in his speech proposed a ‘code of good conduct’ for the UNSC. This is where, for the first time, a kind of proposition was made that the P5 could voluntarily restrain the use of veto in cases of genocide, crimes against humanity or larger war crimes. I think the attempt was to skirt amending the UN Charter and still make it much more contemporaneous. None of the P5 are talking of eliminating veto power that they have. There are multiple versions among the five as to how they wish to reform the UN Security Council.\nAlso read | We must reform the Security Council: UN chief Guterres in final UNGA address\nAs an ideal, we believe that we live in a world of sovereign equality, but in reality, because of the way power is distributed, it is impossible for any international organisation to survive — not just become effective — but even survive if they happen to take a decision against any of the major powers. Incidentally, veto is not a word mentioned in the UN Charter and it was created through a separate mechanism. But the premise is that any international organisation must not take a decision against the fundamental interests of any major power if they wish to survive.\nWhile doubts persist about the veto, the question is will veto continue to be extended", "translation_ja": "", "vocab": []}, {"title_ja": "Israel’s Netanyahu, at UN, calls accusations of genocide in Gaza ‘the biggest lie of the century’", "title_en": "Israel’s Netanyahu, at UN, calls accusations of genocide in Gaza ‘the biggest lie of the century’", "summary_ja": "‘Mr. Mamdani, since you were elected mayor of this city, many Jews no longer feel safe in New York; they talk to me, they tell me this isn’t the city we remember, it changed so quickly,’ said Benjamin Netanyahu", "summary_en": "‘Mr. Mamdani, since you were elected mayor of this city, many Jews no longer feel safe in New York; they talk to me, they tell me this isn’t the city we remember, it changed so quickly,’ said Benjamin Netanyahu", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/israels-netanyahu-at-un-calls-accusations-of-genocide-in-gaza-the-biggest-lie-of-the-century/article71505769.ece", "state_media": false, "category": "社会", "full_text": "Allegations of Israeli genocide in Gaza are not only false but “the biggest lie of the century,” Israel Prime Minister Benjamin Netanyahu told world leaders Thursday (September 24, 2026) in a defiant speech that asserted his nation’s right to wage war against Iran — and was not heard by scores of delegates who trooped out before he started speaking.\nMr. Netanyahu, his voice rising in emphasis, said attacking Iran “was one of the easiest decisions I’ve ever had to make” and denounced as “moral cowards” a mass of delegates who walked out of the UN General Assembly when he took the podium to speak.\n“In defending itself, Israel is also defending many of the countries whose delegates just left this hall,” Mr. Netanyahu said. “In fact, I want you to know that many of their leaders even thank us privately for taking out Iran’s nukes.”\nWhen Mr. Netanyahu walked to the rostrum, a mix of cheers, boos and mass walkouts erupted. Scores of delegates marched out and a majority of visible seats sat empty afterward. “Order in the hall, please,” General Assembly President Khalilur Rahman said repeatedly.\n“If there are any other moral cowards who have not yet left the hall, please do so now,” Mr. Netanyahu said.\nHis remarks — which at times sounded like a stump speech as Israel gears up for elections — came after a week filled with speeches by world leaders accusing Israel of genocide and war crimes in Gaza.’’\nPalestinians had called for a mass walkout\nThe Palestinian Mission to the UN said in a message to many of the 193 UN member nations to bring as many staff as possible to the assembly hall and “collectively walk out of the assembly” once the Israeli Prime Minister is announced.\n“This will send a clear message to Netanyahu and his government that no one is willing to aid, abet, or be complicit in its genocide and war crimes and illegal occupation, which all peace-loving states and peoples demand must come to an end,” the message said.\nIsrael rejects allegations that it committed genocide and war crimes and is illegally occupying Palestinian territory. All Israeli settlements are illegal under international law, but the Israeli government insists they are legal.\nMr. Netanyahu, who is prone to using visual aids during his General Assembly speeches, at one point held up a pager while reminding the audience of September 17, 2024, when Israel remotely detonated thousands of pagers that had been distributed to the Iran-backed Hezbollah militant group in Lebanon. The pager attack wounded more than 3,000 people and killed 12, including two children.\nHe reminded the assembly of the scale of the October 7, 2023, attack in which Hamas militants killed about 1,200 people. “This is equal to 40,000 innocent Americans slaughtered in less than 24 hours,” he said, or 16 times the death count on the 9/11 attacks that left nearly 3,000 people dead in New York.\nMr. Netanyahu thanked U.S. President Donald Trump for taking decisive action against Iran, and he insisted Israel would prevail: “We will continue to win because we have no other choice.”\nNetanyahu followed the Palestinian president’s remote speech\nPalestinian President Mahmoud Abbas also addressed the UN General Assembly earlier Thursday (September 24), delivering prerecorded remarks from his office in Ramallah after the United States denied him and other top Palestinian officials visas to attend the gathering for the second year in a row.\nThe 90-year-old leader’s popularity at home and relevance abroad have both waned. But in his remarks, Mr. Abbas made clear that he did not intend to quietly accept being sidelined.\n“We will not leave our homeland. We will not accept displacement. And we will not allow anyone to decide our future on our behalf,” Mr. Abbas said.\nThough world leaders have repeatedly invoked the plight of Palestinians in speeches throughout the week, Mr. Abbas urged the international community to take more tangible action against Israel.\n“How long will some countries continue to remain silent about Israel, or continue supplying it with weapons that it uses against our people? The world has witnessed the enormous cost in the Gaza Strip and the West Bank,” Mr. Abbas said. “What, then, is the international community waiting for before it acts to protect the Palestinian people?”\nNetanyahu is in the city of a mayor who wants him arrested\nIn past years, Mr. Netanyahu has used his General Assembly speech to both denounce the United Nations as biased and make Israel’s case to world leaders. His address — scheduled for prime time in Israel — is the cornerstone of an abbreviated trip to the United States unfolding under the shadow of New York City Mayor Zohran Mamdani calling him a “war criminal” and pushing for his arrest.\nMr. Mamdani has acknowledged that New York does not have the authority to execute an International Criminal Court warrant but urged federal authorities to do so.\nIsrael has grown increasingly isolated throughout the war in Gaza. The war began on October 7, 2", "translation_ja": "", "vocab": []}, {"title_ja": "Outrage over controversial U.K. professorship for business tycoon Anant Ambani", "title_en": "Outrage over controversial U.K. professorship for business tycoon Anant Ambani", "summary_ja": "Universities are supposed to be places that question power and hold corporations to account, not give them academic legitimacy, said Lyla Mehta, a researcher at the Institute of Development Studies", "summary_en": "Universities are supposed to be places that question power and hold corporations to account, not give them academic legitimacy, said Lyla Mehta, a researcher at the Institute of Development Studies", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/outrage-over-controversial-uk-professorship-for-business-tycoon-anant-ambani/article71505740.ece", "state_media": false, "category": "社会", "full_text": "Britain's Newcastle University faced criticism Thursday (September 24, 2026) for awarding a sustainability professorship to Anant Ambani, the son of Asia's richest man and owner of a scandal-hit giant wildlife centre in India.\nVantara, which calls itself the world's largest rescue centre, last month announced a major reset of its procedures following concerns about its rapid and vast acquisition of animals from around the world, including endangered species.\nNewcastle University said on September 14, it awarded the professorship of practice in sustainability to Mr. Ambani \"in recognition of his significant contributions to advancing a more sustainable future.\"\n\"Work at Vantara closely aligns with the University's world-leading research on global conservation and biodiversity targets,\" the university in northern England said.\nIt also noted his role as an executive director at Reliance Industries, a retail
