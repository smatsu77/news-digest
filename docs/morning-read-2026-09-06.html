d in my household. At most, my mother – lost in a reverie about her own mom’s gambling habits – would nostalgically purchase a Lotto Scratcher from the 7-11 down the street as a most illicit treat. She never won, which was just a reminder to me to keep my money away from such frivolous activities. I was told to save my earnings, be smart with my spending, and not to waste time on what amounts to jumping out a plane, DB Cooper-style, with a bag of cash and no parachute.\nMy parents weren’t alone in their disdain for the business of gambling. It was an activity relegated to dirty, sinful places such as Las Vegas, Atlantic City, and the alley behind the liquor store. But in other countries, like the UK, gambling has long been a legitimate big business – worth billions in revenue, with high street betting and online casinos advertised everywhere. America’s puritanical legacy meant gambling had to be sequestered and treated like a filthy habit to satisfy our moral outrage.\nThose days are done. Through innovations in mobile phone technology, insidious branding (“prediction markets”, “daily fantasy” and other mouthfuls of marketing nonsense), and our ", "translation_ja": "", "vocab": [{"word": "circumventing", "definition": "規則や法律を巧妙に回避すること。直接的に違反するのではなく、抜け穴を利用して制限を避けることを意味します。"}, {"word": "insidious", "definition": "一見無害に見えながら、徐々に悪い影響を与える様子。潜在的な危険性が隠れていることを表します。"}, {"word": "deleterious", "definition": "害をもたらす、悪影響を与える。健康や状態に対して否定的な結果をもたらすことを意味します。"}, {"word": "sequestered", "definition": "隔離される、分離される。社会から切り離されて特定の場所に限定されることを表します。"}, {"word": "puritanical", "definition": "厳格な道徳観念を持つ、禁欲的な。快楽や娯楽を否定し、禁止的な態度を示すことを意味します。"}, {"word": "euphemistic", "definition": "不快な言葉や概念を、より穏やかで受け入れやすい表現に置き換える。言語的なごまかしを指します。"}]}, {"title_ja": "グローバル危機：民主主義はいかに権威主義と紛争を克服できるか", "title_en": "Global Crisis: How Democracy Can Overcome Rising Authoritarianism and Conflict", "summary_ja": "サイモン・ティスダルは、世界が終わりなき戦争、人道的災害、経済不安、権威主義の拡大など、かつてない危機に直面していると主張しています。現在の地政学的混乱を認めながらも、民主的制度と国際協力の強化が、困難な状況の中でも希望に満ちた未来への道を提供すると示唆しています。", "summary_en": "Simon Tisdall argues that the world faces unprecedented crises including endless wars, humanitarian disasters, economic instability, and authoritarian expansion that threaten global security. While acknowledging these dire circumstances, he suggests that strengthening democratic institutions and international cooperation offers a path toward a more hopeful future despite current geopolitical chaos.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/06/world-brink-thugs-dictators-brighter-future-ordinary-people", "state_media": false, "category": "オピニオン", "full_text": "Don’t look up! The world is a mess. The sky could fall in any day. Unending wars, expanding humanitarian crises, rising authoritarianism, dysfunctional democracies, rampant racial and religious extremism, and unchecked lawlessness cast a dark cloud as the west’s new political year begins. Set all that against a backdrop of staggering global economic inequality, corporate and individual greed, irresponsible government indebtedness, dangerous AI gambles, climate breakdown and proliferating nuclear weapons, and a truly apocalyptic global outlook begins to take shape. It’s enough to make anyone shut their eyes, cover their ears and utter a Munch-like scream. And it’s only getting worse.\nDemocratic leaders who promise a better, safer, more optimistic future – what Britain’s freshly arrived prime minister, Andy Burnham, calls a “new era of possibility” – cannot escape this wider international context. Last week’s global bond market upheaval, sparked by external factors, left Burnham’s cash-strapped government struggling with sharply increased borrowing costs before he barely got started. The fact he chose Ukraine for his first overseas trip, while symbolically important, highlighted another grim reality. As a lead opponent of Vladimir Putin’s invasion, Britain now finds itself in a de facto state of war with Russia – and facing attack. Argentina, too, is eyeing UK defence vulnerabilities. These are not the sort of possibilities Burnham envisaged.\nLittle wonder some analysts believe a third world war has already begun. Those who say this is over-dramatic should consider the following snapshots of the state of the world in 2026. From Kyiv to Khorramshahr, Kordofan and Kachin, conflicts flare and subside but never seem to end. All-out Russian aggression in Ukraine, now mostly comprising daily attempts to murder and terrorise civilians, is into its fifth year. Trump has lost his Iran bet, but keeps killing and bombing with no end in sight. In southern Sudan, appalling atrocities go unchecked. In Myanmar, a people’s war against a brutal junta rages on. Israel’s response to the 2023 massacres has triggered an ongoing regional war embroiling Palestine, Lebanon, Syria, Yemen, Iraq, Iran and the Gulf states. Worldwide, record numbers of people are displaced by conflict.\nIncreasingly interconnected, these wars threaten to merge into one uncontrollable global conflagration. The alliance system, key pillar of the post-1945 order, is eating itself. Donald Trump taunts Europe and Nato with tariffs, troop withdrawals, barbs and insults at a time of acute vulnerability. Canada and the US are at daggers drawn as the White House bully fatuously threatens Venezuela – or Greenland-style annexation. China aids North Korea, which also aids Russia, which aids Iran, which aids Hezbollah and the Houthis. In Japan, South Korea, the Philippines and Australia, China looms menacingly as partnerships with Washington fray. In Taiwan, fears of invasion grow, aggravated by Trump’s obsequious appeasing of Xi Jinping.\nEverywhere you look, humanitarian crises caused by war, the climate crisis or natural disasters are producing chaotic mass migrations, malnutrition and disease. Increasingly, the suffering overwhelms a UN-led aid system crippled by US and UK funding cuts. In the fertile West Bank, 900,000 Palestinians, their homes and farms besieged by settler extremists, are now food insecure, the World Food Programme says. In Somalia, millions go hungry amid record drought and predicted El Niño-related flooding. Colombia and Afghanistan face similar perils. Humanitarian and human rights outrages take individual form, too. In Hong Kong, for example, an ailing Jimmy Lai, brave champion of free speech, languishes in 23-hour-a-day solitary confinement, a tortured casualty of Chinese communism’s hatred of democracy and civil rights.\nSkittish bond markets may be the least of the world’s economic and financial problems. Is a crash coming, reminiscent of 2008, only worse? The signs are ominous. The US just notched up a record $40tn in national debt. France, the UK, Japan and others are deep in the red, too. Unmanageable current-account deficits, rising inflation and the huge, draining diversion of investment into bloated AI tech companies all point to what market analysts cutely call a “disorderly correction”. By some estimates, the Nvidia chip-maker, plus Amazon, Google, Meta and Microsoft, are “worth” about 23% of the entire US stock market. Meanwhile, unaffordable northern-hemisphere energy and food prices loom this winter, exacerbated by Trump’s Middle East forever folly. In the worst case, all this could translate into global recession and yet more political instability. It’s a gigantic bubble waiting to burst.\nThe existential hazards posed by the climate crisis and global heating should require scant elaboration after the terrifying Nepal-Tibet flood disaster. Similarly inimical to life on Earth, in an avoidable, human-made way, is the rapid prolifer", "translation_ja": "", "vocab": [{"word": "conflagration", "definition": "大規模で制御不能な戦争や紛争。比喩的には、小さな問題が急速に拡大して全体的な危機になること。"}, {"word": "interconnected", "definition": "複数の事象や組織が相互に関連し、密接に結びついている状態。一つの問題が他の問題に影響を与えるシステムを表す。"}, {"word": "humanitarian crises", "definition": "戦争、飢饉、自然災害などにより、多くの人命が危機的状況にさらされる深刻な事態。国際的な人道支援が必要とされる。"}, {"word": "existential hazards", "definition": "人類の生存そのものを脅かす危険性。気候変動やAIの暴走など、文明レベルで対処する必要がある脅威を指す。"}, {"word": "obsequious", "definition": "過度に従順で、相手に媚びへつらう態度。権力者に対して卑屈に従う様子を表す。"}]}, {"title_ja": "次の飢饉を回避する", "title_en": "Avoiding the Next Famine", "summary_ja": "著者は、21億人に影響を与えている世界的な食料不安が単なる人道的危機ではなく、米国のリーダーシップと国益のための戦略的命令であると主張している。食料不安は政府を不安定化させ、紛争を助長し、世界経済に年間数兆ドルの損失をもたらす一方、中国は世界的な食料システムへの影響力を急速に増やしている。米国は食料安全保障に関する国際的な取り組みを主導し、米国のリーダーシップと自由主義的世界秩序への世界的信頼を回復すべきである。", "summary_en": "The author argues that global food insecurity affecting 2.1 billion people is not merely a humanitarian crisis but a strategic imperative for U.S. leadership and national interest. Food insecurity destabilizes governments, fuels conflict, and costs the world economy trillions annually, while China is rapidly gaining influence over global food systems. The U.S. should lead an international effort on food security to rebuild global confidence in American leadership and the liberal world order.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/avoiding-next-famine", "state_media": false, "category": "オピニオン", "full_text": "In a world of great-power standoffs, climatic tipping points, and technological arms races, global hunger may not seem like a particularly significant problem. Yet last year, a total of 2.1 billion people, or more than a quarter of the planet’s population, experienced food insecurity—meaning they either ran out of food over the course of a year or were forced to reduce the quality or quantity of their diet. Over 260 million faced acute food insecurity, meaning their lives or livelihoods were in immediate danger because they could not get enough to eat. Almost a quarter of all children under the age of five were permanently stunted because of malnourishment and will likely reach lower levels of education, earn less over the course of their lives, and live with more chronic health challenges than properly fed kids. And these startling figures do not reflect the food crises that could be unleashed this year by rising energy and fertilizer prices, decreases in grain exports from Russia and Ukraine, and an intensifying El Niño weather pattern.\nFood insecurity is terrible in and of itself. But it also has disastrous political consequences. It inhibits economic growth, heightens the risk of violent conflict, and destabilizes governments. These problems, in turn, create trouble for the whole world. That means countries that are not overwhelmed by food insecurity still have strong, self-interested reasons to tackle it—the United States included.\nIn fact, a U.S.-led effort to address hunger would do more than create a healthier and more stable planet. Given the waning goodwill toward the United States, Washington needs an agenda through which it can rebuild global confidence in its leadership and demonstrate the value of international cooperation. Addressing global food security could be at the center of such a plan. Different parts of the world, after all, may have different geopolitical ambitions. But almost no government—northern or southern, democratic or autocratic—wants to see so many people go hungry. There may be no better way to rebuild confidence in the liberal world order and in the United States as a committed member of it than for Washington to address this challenge.\nFOOD, GLORIOUS FOOD\nIt is difficult to overstate just how intertwined food security is with global development, state security, and even international competition. Malnutrition leads to reduced educational attainment, compromised human capital, and lost productivity, costing the world economy $3.5 trillion a year in forgone economic growth and in added health-care costs. Food price spikes can also exacerbate grievances and lead to riots that destabilize governments; anger over hunger, for example, set the conditions for the Arab Spring protests. In rural areas, food insecurity helps armed groups recruit soldiers and causes disputes over scarce land and water resources. And it causes people to migrate to wealthier states.\nThese reasons are, by themselves, enough for Washington to helm a global campaign to reduce hunger. But so should the fact that leading on global food security means helping shape the future of the world’s entire agricultural system—something China is on a path to do. In 2019, Beijing invested significant capital in securing leadership of the Food and Agriculture Organization of the UN, a role with substantial influence over how governments work together on food-related issues. It is also quickly developing other ways to lead the world on matters of food security. China spends double what the United States spends on public agricultural research and development, and its output of agricultural patents and scientific publications has skyrocketed while U.S. output has stagnated.\nThankfully for American officials, the United States is still well positioned to lead the world when it comes to food security. The United States is among the world’s largest agricultural exporters. It was instrumental in founding the UN architecture dedicated to food security, including the Food and Agriculture Organization and the World Food Program. And for much of these institutions’ history, Washington has been their largest donor. In fact, for decades, the United States’ international development agenda was the most ambitious in the world, and it was backed by a willing public.\n Washington retains many of the tools needed to combat global hunger.\nThe country still has such a public: in early 2026 polling, a strong majority said that the United States should be a moral leader in the world. But a strong majority didn’t believe it was. Perhaps this is because the United States has been walking away from this legacy and this opportunity to lead. In mid-2025, for example, Congress clawed back nearly $8 billion in foreign assistance funds. The United States is now a reluctant international donor and a surly member of key international organizations.\nWashington, however, still retains many of the tools needed to combat global hunger. In addition to incre", "translation_ja": "", "vocab": [{"word": "food insecurity", "definition": "食糧へのアクセスが不安定で、十分な栄養を確保できない状態。飢饉の寸前段階を含む包括的な概念。"}, {"word": "geopolitical", "definition": "地政学的な、国家間の権力関係と地理的条件の相互作用に関する。国際政治における戦略的利益に関連する。"}, {"word": "destabilize", "definition": "政治的・社会的な安定性を損なわせる、あるいは破壊する。国家や地域の秩序を乱す。"}, {"word": "helm", "definition": "先導する、指揮する。ある事業や運動の主導的立場に立つ。"}, {"word": "stagnate", "definition": "停滞する、進展しない。経済や生産などが成長を止める状態。"}, {"word": "liberal world order", "definition": "民主主義と市場経済に基づく国際秩序。第二次世界大戦後に構築された国際制度と価値観のシステム。"}]}, {"title_ja": "台湾が台湾海峡で勝つ方法", "title_en": "How Taiwan Can Win the Strait", "summary_ja": "著者は、台湾が大型で高価な水上艦艇の建造計画を放棄し、代わりにミサイルとドローンで武装した小型でステルス性の高いコルベットに投資すべきだと主張しています。大型軍艦は台湾海峡の狭い水域での最新の探知・標的システムに脆弱であり、一方、小型艦艇はより発見されにくく、同時に中国の上陸作戦を撃退する能力を保持できます。この戦略的転換は潜水艦、航空機、陸上移動式発射機と組み合わせることで、台湾の防衛ニーズに適合した分散防御システムが構築されます。", "summary_en": "The author argues Taiwan should abandon plans to build large, expensive surface ships and instead invest in smaller, stealthier corvettes armed with missiles and drones. Large warships are vulnerable to modern detection and targeting systems in the narrow Taiwan Strait, while smaller vessels would be harder to detect and destroy while remaining capable of repelling Chinese amphibious assault forces. This strategic shift, combined with submarines, aircraft, and shore-based launchers, would create a dispersed defense system better suited to Taiwan's defensive needs.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/taiwan/how-taiwan-can-win-strait", "state_media": false, "category": "オピニオン", "full_text": "Separated from China by a roughly 100-mile-wide strait, Taiwan relies on its navy as the first line of defense against a potential invasion. It must be able to prevent an assault by a Chinese force carried across the Taiwan Strait in large amphibious ships. Taiwan has traditionally favored large ships such as destroyers and frigates to form the core of its fleet, both as visible symbols of state power and as tools for signaling resolve in the face of Chinese coercion, and Taiwan’s current shipbuilding plans include replacing an aging surface fleet with large and expensive new ships.\nYet large surface ships are vulnerable in the narrow waters of the Taiwan Strait—a problem compounded by advances in technology that are making them easier to detect, track, and attack. China has invested in cutting-edge intelligence, surveillance, and reconnaissance (collectively known as ISR), as well as electronic warfare systems, drones, and missiles. Taiwan’s large surface ships are now a liability. But Taiwan has an advantage: these same technologies make China’s large amphibious ships more vulnerable in restricted waters, and those ships cannot be replaced by smaller, stealthier alternatives. Taipei can take advantage of this mismatch by replacing its destroyers and frigates with a greater number of smaller surface combatants that are more likely to survive an initial wave of Chinese strikes and remain capable of attacking a Chinese invasion fleet.\nThe Taiwanese navy is planning to invest heavily in large surface combatants, including a new 7,000-ton warship and as many as 12 3,000-ton light frigates. These large ships are impediments to the radical transformation of the Taiwanese navy that the Chinese threat requires. Building ships of this size with stealth features and defense systems to survive a battle in the Taiwan Strait would be prohibitively costly; without these features, they would be too vulnerable to play a major role in the navy’s primary wartime mission of denying a Chinese invasion force the use of the Taiwan Strait. Efforts elsewhere to build similarly capable ships have proved costly and difficult. The U.S. Navy’s Constellation-class frigate program, for example, budgeted roughly $1 billion per ship; the cost eventually rose to about $1.5 billion each before the Constellation program was canceled, and even at that price the ships lacked the capabilities needed to fight an advanced adversary in restricted waters. In comparison, the spending on Taiwan’s entire shipbuilding program is projected to be $1.5 billion annually.\nRather than spend resources on large ships, Taipei should build stealthy corvettes weighing between 700 and 1,000 tons, armed with missiles and drones, that are harder to detect and target but can retain enough firepower to attack Chinese ships crossing the strait. Combined with current plans to build shore-based mobile launchers, aircraft armed with antiship missiles, and eight submarines, Taiwan can create a dispersed and hard-to-destroy defense system that can withstand Chinese attacks and repel a potential amphibious assault.\nSITTING DUCKS\nLarge ships may be potent signals of national power, but they are relatively easy to target and politically costly to lose. When ships are fighting in narrow waterways under heavy surveillance, visibility quickly becomes a deadly liability. The sinking of a large ship can also have consequences beyond an immediate military setback. A highly visible and costly loss may make political and military leaders more cautious about risking additional warships as conflict continues.\nMajor naval engagements over more than the last four decades suggest that any navy expecting to fight near an enemy’s coast should be wary of building its force structure around expensive, irreplaceable hulls. The 1982 Falklands War between Argentina and the United Kingdom, for example, showed how a single successful strike on a warship can constrain an entire surface fleet. Argentina entered the Falklands conflict with powerful ships, including the cruiser General Belgrano and the aircraft carrier Veinticinco de Mayo. But after a British submarine sank the Belgrano, Argentina decided to keep much of the rest of its surface fleet, including the carrier, closer to coastal waters or in ports for the rest of the war.\nIn the Persian Gulf six years later, the U.S. Navy’s ability to combine surveillance, aircraft, ships, and precision weapons devastated Iranian naval forces during Operation Praying Mantis. In a single day, U.S. forces sank or badly damaged several Iranian surface vessels operating in the confined waters of the Gulf, including two large frigates. Whereas the Falklands War illustrated the political consequences of losing a major warship, Praying Mantis highlighted the danger for ships facing an adversary with a much more effective “kill chain”—the sensors and communications to detect, identify, track, target, and attack an opponent’s fleet. For Taiwan, the lesson is that ", "translation_ja": "", "vocab": [{"word": "amphibious", "definition": "水陸両用の、または両生類の。軍事用語では、海から陸地への着陸作戦を指します。"}, {"word": "corvette", "definition": "フリゲートより小型の軍艦。高速で機動性に優れた沿岸防御艦です。"}, {"word": "liability", "definition": "法的責任、または欠点・弱点を意味します。ここでは戦術的な弱点として使用されています。"}, {"word": "surveillance", "definition": "監視または監察。情報収集のため、人や物、地域を継続的に観察することです。"}, {"word": "kill chain", "definition": "敵を検出・特定・追跡・標的化・攻撃するまでの一連のプロセス。軍事用語として使われます。"}, {"word": "restricted waters", "definition": "航行が制限されている狭い水域。台湾海峡のような領海内の限定的な海域を指します。"}]}, {"title_ja": "イランとの膠着状態を求める論拠", "title_en": "The Case for a Stalemate With Iran", "summary_ja": "著者は、ホルムズ海峡における相互封鎖によって特徴づけられる米国とイランの現在の軍事・経済的膠着状態が、その費用にもかかわらずワシントンにとって最適な結果を表していると主張しています。エスカレーションや撤退を追求するのではなく、米国はこの現状を無期限に維持すべきであり、イランの経済を徐々に弱体化させながら過去の戦争に関連した莫大な支出と犠牲を回避することができます。この戦略により、米国はテヘランに圧力をかけ、将来の交渉において譲歩を余儀なくさせる可能性があります。", "summary_en": "The author argues that the current military and economic stalemate between the U.S. and Iran, marked by mutual blockades in the Strait of Hormuz, represents the optimal outcome for Washington despite its costs. Rather than pursuing escalation or withdrawal, the U.S. should maintain this status quo indefinitely, as it gradually weakens Iran's economy while avoiding the higher costs of military conflict. This strategy allows the U.S. to maintain pressure on Tehran and potentially force concessions in future negotiations without the massive expenditures and casualties associated with previous wars.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/case-stalemate-iran", "state_media": false, "category": "オピニオン", "full_text": "Six months in, the U.S. and Israeli war on Iran has settled into a stalemate. Neither Washington nor Tehran can achieve a clear military or diplomatic victory. Instead, the two sides have found themselves locked in a mutual blockade of oil and other shipments through the Strait of Hormuz and into Iranian ports, with no obvious way to change the status quo. The costs of accommodating the other side’s demands to end the stalemate are so high, and the costs of the stalemate sufficiently low, that a mutual blockade has emerged as the least bad option for both the United States and Iran for the foreseeable future.\nThis situation may not be ideal for Washington, but it avoids both defeat and escalation. It also works to the United States’ advantage over time: as the blockade drags on, Tehran’s position is likely to weaken faster than Washington’s. The United States has its own ample oil supplies to draw from, whereas nearly the entirety of Iran’s oil exports—and therefore much of its hard currency—has been cut off. An ongoing blockade that gradually ratchets up pressure on Iran could make Tehran more flexible in negotiations with the United States, leading to a compromise that Washington could accept. The challenge is to ensure that Tehran does not choose to respond to its worsening position by escalating its attacks and starting another regionwide conflict that ensnares the United States.\nU.S. policy should focus on avoiding the most disruptive contingencies, especially Iranian escalation, and settle for maintaining dual blockades indefinitely. If Iran is unwilling to concede, Washington can slowly erode the Iranian economy and military while ensuring that Tehran cannot rebuild the strong regional position it enjoyed before the Hamas attack on Israel on October 7, 2023. At this stage, maintaining the current U.S. position is the most effective way of fighting—and winning—this war.\nBEST OF THE WORST\nIn June, Washington and Tehran agreed to a memorandum of understanding to first establish a cease-fire and open the Strait of Hormuz and then to sign a permanent deal within 60 days to resolve long-term issues in the bilateral relationship, including restricting Iran’s nuclear program and removing U.S. and international sanctions and other financial penalties on Iran. But it fell apart before a final deal could be reached largely because Iran failed to fully open the strait. With diplomatic solutions going nowhere, both Washington and Tehran are now hoping that the economic pressure each can put on the other—and in the case of Iran, on the global economy—will force its counterpart back to the negotiating table on terms that will resolve the blockade in its favor.\nA blockade comes with costs for Washington. Keeping the strait closed is raising gas prices and increasing inflation in the United States, an especially sensitive issue as the November midterm elections approach. Prices could rise further if Iran finds a way to limit the millions of barrels of oil that bypass its blockade and are transported through the Strait of Hormuz daily. And the United States has already used up many critical munitions and strained its troops in the region by keeping the war going.\nBut the operation has been relatively affordable compared with past conflicts. The United States lost thousands of lives and spent trillions of dollars in Afghanistan and Iraq, whereas the ongoing conflict with Iran has resulted in 18 American service members killed and has likely cost tens of billions of dollars. (As of mid-July, estimates ranged from $37.5 billion to over $100 billion.) Most important, the mutual blockade has the advantage of being more palatable to political leaders in Washington than any of the alternative options.\nA full U.S. withdrawal from the Strait of Hormuz without gaining concessions from Iran, including ending its blockade, would be unthinkable even for the unorthodox Trump administration. It would allow Iran to tout a complete victory and give the regime in Tehran a powerful psychological boost that would undo much of the progress that the United States and Israel made in the past three years decimating Iran’s network of regional proxies. And it would probably not lead Iran to reopen the Strait of Hormuz for free passage—Tehran is likely to insist on installing some kind of tolling system in perpetuity. With Washington in retreat, Iran could also revive and rebuild its nuclear program, which would be a stunning failure for the United States.\n The United States can continue the mutual blockade at relatively low cost.\nMilitary escalation is an even less appealing option for Washington. The Iranian regime has already survived a massive bombing campaign; a new, even more aggressive offensive could take out much of Iran’s remaining military capabilities and its energy, transportation, and communications infrastructure, but such an offensive could not guarantee that Tehran would accept American terms on opening the strait or curtailing", "translation_ja": "", "vocab": [{"word": "stalemate", "definition": "どちらの側も進展できない膠着状態のこと。政治や軍事の文脈では、相互に有利な結果を得られない相手対抗の状況を指します。"}, {"word": "blockade", "definition": "物資や人の移動を阻止する封鎖のこと。軍事・経済戦略として、相手国の貿易や流通を制限するために実施されます。"}, {"word": "concessions", "definition": "譲歩や譲り合いのこと。交渉の過程で一方が相手方の要求に応じて譲ること。政治交渉では重要な要素です。"}, {"word": "escalation", "definition": "段階的な拡大や激化のこと。紛争やテンションが徐々に高まることを意味し、紛争の危険性が増す状況です。"}, {"word": "bilateral", "definition": "二国間の、または双方に関わるという意味です。国家間の協定や関係に関する文脈でよく使用されます。"}, {"word": "erode", "definition": " let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-06 22:30 JST";
  renderTabs();renderList();
})();
</script>
