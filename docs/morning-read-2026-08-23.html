urce": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwy4ypzvd7po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Zelensky should be asked what he knew about government corruption, sacked minister tells BBC\n- Published\nUkrainian President Volodymyr Zelensky should be asked questions about corruption in his government, his sacked defence minister Mykhailo Fedorov has told the BBC.\nFedorov, a popular minister who modernised the military and pioneered drone warfare, was fired last month after reportedly falling out with the head of Ukraine's armed forces.\nHe told the BBC a money laundering investigation announced last week meant Zelensky should be asked about his awareness of potential corruption in his inner circle.\nBut he said he had not himself seen the president engage in any corrupt activity.\n\"In all the time that I worked with him, not a single time have I received from him any task or assignment that would go against law or my sense of integrity\", Federov said.\nThe former minister also repeated his appeal for elections to be held in Ukraine, days after releasing a video where he called for a wartime vote.\n\"Democracy should not be the hostage of Putin\", he said - but stopped short of declaring his own political ambitions.\nThere were angry protests over Fedorov's sacking but his support dwindled and demonstrations ended on Wednesday, after his replacement was confirmed. His call for a vote has been widely rejected.\nAsked whether he missed his old job, the 35-year-old replied \"No\", citing the relentless stress of managing Ukraine's war with Russia while transforming its defence ministry.\nUkraine has been under martial law since Russia's full-scale invasion in 2022, meaning elections are suspended. Zelensky's five-year presidential term ended in May 2024.\nBut Fedorov said it was his \"moral right\" to start the conversation about elections.\n\"We should not be afraid of discussing  phrases it as though these were somehow different governments without him. As everyone remembers, we didn't hear any strong statements from him back then.\"\nFedorov claimed he had rooted out elements of corruption from defence procurement but warned it was still affecting Ukraine's frontline capacity.\nThe former minister said he'd had no contact with the president for \"a couple of weeks\", and had no evidence the president was personally corrupt.\n\"In all the time that I worked with him, not a single time have I received from him any task or assignment that would go against law or my sense of integrity. So that's my personal experience with him.\"\nAs defence minister and previously digital transformation minister, Fedorov is credited with innovating to replace soldiers with an \"army of drones\", saving lives on the battlefield and enabling long-range Ukrainian strikes on Russian military targets, oil refineries and distribution warehouses - thousands of kilometres over the border.\nHe said he would continue to promote new ways to fight the war and confirmed a visit to the United States in the coming weeks, where he hopes to meet Elon Musk.\nThe billionaire businessman's Starlink satellite communications system has be", "translation_ja": "", "vocab": [{"word": "misappropriate", "definition": "不正に流用する、横領する。資金や財産を違法に自分のものにすることを意味します。"}, {"word": "procurement", "definition": "調達、購買。特に組織が商品やサービスを大規模に取得するプロセスを指します。"}, {"word": "martial law", "definition": "戒厳令。戦争や緊急事態時に軍が行政権を掌握し、通常の法律が一時停止される状態です。"}, {"word": "disinformation", "definition": "虚偽情報、デマ。意図的に広められた偽の情報のことを指します。"}, {"word": "integrity", "definition": "廉潔性、誠実性。法律や道徳的原則に従う個人の品質を表します。"}, {"word": "relentless", "definition": "絶え間ない、容赦ない。継続的で激しく、弱まることのない状態を表します。"}]}, {"title_ja": "トランプ大統領、貿易交渉決裂後「カナダは米国の州の利益を望んでいる」とコメント", "title_en": "Trump says Canada wants 'benefits' of US state after trade talks collapse", "summary_ja": "米国とカナダの貿易交渉が金曜日に決裂し、トランプ大統領はカナダが米国の州になることなく州の利益を望んでいると嘲笑した。カナダのカーニー首相は新たな50%の米国関税を計算違いと ked,\" Carney said.\nOn Sunday, while speaking to Fox News, Trump said the Canadians were \"foolish\" to engage in a trade war with the US and think they will \"actually win\".\nBoth countries were optimistic of a deal earlier in the week, but talks fell apart after both sides accused the other of making last-minute changes.\nThe new 50% US tariffs will apply to a range of Canadian goods, in addition to existing US tariffs on Canadian steel, aluminium, automobiles and lumber.\nThey are limited in scope, covering about $20bn (£15bn; C$28bn) of Canadian imports, or about 5% in total, including wine, dairy, cement, clothing and hockey equipment.\nThe prime minister said Canada was retaliating \"reluctantly\" to protect its interests. Details of the counter-measures will be released in the coming days, he said.\n- Carney faces crucial test after walking away from Trump's deal \n  - Published1 day ago\nLeaders of other federal parties in Canada, including the Conservative opposition, voiced support for the prime minister, as have the leaders of some Canadian provinces.\nTariffs - a tax placed on imports from other countries - have been a key component of Trump's trade policy, with the US president arguing they will boost American manufacturing and create jobs at home.\nCritics, however, say tariffs have raised prices for American consumers and have disrupted and damaged the global economy.\nCarney's speech on Saturday was his first address to Canadians after he announced late on Friday night that a deal would not be reached, accusing the Americans of making \"last-minute changes\" that were \"unfair\" and \"uneconomic\".\nUS negotiators, meanwhile, accused Canada of making \"new demands and walk backs\" on terms which had been previously agreed.\nOn Saturday, US trade representative Jamieson Greer told Fox News there were no plans to resume talks.\nHe added that the US had been prepared to cut some of its tariffs on Canada as part of the ill-fated deal.\nCarney, however, said the US presented \"unacceptable\" terms that were too restrictive, including curbing Canada's ability to strike new trade deals with other countries.\nHe also rejected the assertion that Canada had made last-minute requests: \"We clarified what was on offer and were continually disappointed by the answers.\"\nDoug Ford, the leader of Canada's most populous province Ontario, backed Carney and said Trump \"can't be trusted\".\nBritish Columbia Premier David Eby said the US demand for restrictions on Canada's ability to have other trade deals \"would reduce us to the economic equivalent of the 51st state\".\n\"It was never acceptable to Canadians,\" Eby said.\nThe Conservative opposition leader Pierre Poilievre also appeared to support Carney, calling the latest US levies \"unjustified\".\nQuebec's premier, Christine Fréchette, warned jobs would likely be lost as a result of the new US tariffs.\n\"Behind these numbers are real people,\" she said, vowing to introduce measures to support impacted sectors.\nAlberta Premier Danielle Smith, whose oil-rich province has worked to make inroads with the Trump administration, urged both sides to resume talks.\nThe collapse comes after more than a year of on-again, off-again trade talks, which intensified in recent weeks after a US-imposed deadline to strike a deal or face further tariffs.\nThe two countries were also engaged in a mandatory review of an existing North American free trade agreement, known as USMCA, with Mexico.\nThe pact was signed by Trump during his first term to replace the 1994 North American Free Trade Agreement. It underpins $1.6tn (£1.2tn) in annual trilateral trade across Canada, the US and Mexico.\nEarlier this summer, Canada and Mexico had formally requested for USMCA to", "translation_ja": "", "vocab": [{"word": "collapse", "definition": "交渉や計画などが失敗または終了すること。ここでは貿易交渉が決裂したことを意味します。"}, {"word": "triggered", "definition": "何かの原因となって引き起こすこと。ここでは交渉決裂が新たな関税を招いたことを表します。"}, {"word": "miscalculation", "definition": "間違った判断または推定。政治的な決定が判断を誤ったことを指しています。"}, {"word": "integrated", "definition": "密接に結合または統合されている状態。ここでは米国とカナダの貿易関係が深く結びついていることを表します。"}, {"word": "levies", "definition": "政府が課す税金または手数料。ここでは関税を意味しています。"}, {"word": "underpins", "definition": "基礎や支えになること。ここでは貿易協定が多国間の商取引を支えていることを表します。"}]}, {"title_ja": "ギニアのゴミ埋め立て地の崩壊で30人が死亡", "title_en": "Guinea Rubbish Landfill Collapse Kills 30", "summary_ja": "ギニアの首都コナクリの廃棄物処理場で、夜間の大雨の後、大量のゴミの山が崩壊し、少なくとも30人が死亡した。さらに22人が負傷し、軍を含む救助隊が散乱したゴミの中から生存者を捜索している。死傷者数がさらに増加する可能性が懸念されている。", "summary_en": "At least 30 people were killed when a massive mound of rubbish collapsed at a waste site in Conakry, Guinea's capital, following heavy overnight rain. Another 22 people were injured, with rescue efforts involving military personnel and excavators searching through scattered debris. Fears are growing that the death toll may rise further.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4g3g36z7p6o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Guinea rubbish landfill collapse kills 30\n- Published\nAt least 30 people have been killed after a mound of rubbish at a major waste site collapsed on to nearby homes in Guinea's capital Conakry, the government has said.\nAnother 22 people were injured, including six seriously, in the city's Dar-es-Salam area.\n\"Significant\" resources and personnel - including the military - have been deployed to search for survivors after the collapse at about 02:00 local time following heavy rain overnight, the government added in a statement.\nOne woman told local media her five children had died in the disaster. There are fears that the death toll will rise further.\nRescuers were later seen using excavators to comb through a mountain of scattered rubbish at the site as local residents gathered nearby.\nGuinea's Prime Minister Mamadou Oury Bah visited the scene to assess the situation and oversee the search efforts.\nNeighbourhood leader Lancine Sylla had earlier told the AFP news agency he feared there would be a heavy death toll.\n\"We have pulled out 18 bodies that were taken to the morgue,\" he said.\nAnother landslide at the site killed 10 people in 2017.", "translation_ja": "", "vocab": [{"word": "landfill", "definition": "廃棄物を埋め立てるために使用される土地区域。ゴミを処分する大規模な施設を指します。"}, {"word": "deploy", "definition": "特定の目的のために人員や資源を配置または展開すること。災害対応や軍事作戦で頻繁に使用されます。"}, {"word": "survivors", "definition": "危険な事故や災害から生き残った人々。捜索救助活動の対象になります。"}, {"word": "excavators", "definition": "土や瓦礫を掘り起こすための大型建設機械。救助活動や建設現場で使用されます。"}, {"word": "toll", "definition": "災害や事故によって生じた死傷者の数。「死亡者数」を意味します。"}]}, {"title_ja": "A66衝突事故で殉職した警察官、家族から英雄と称賛される", "title_en": "Police Officers Hailed as Heroes After A66 Crash", "summary_ja": "追跡中のフォルクスワーゲン・パサートが対向車線を走行中の警察車両と衝突し、PC トム・クロウとPC マシュー・ブレイズの2人の警察官が殉職した。家族は2人を職務中に命を失った英雄として称賛し、15万ポンド以上が募金されている。", "summary_en": "Two police officers, PC Tom Clough and PC Matthew Blades, died when a Volkswagen Passat they were pursuing collided head-on with their vehicle on the A66 near Middlesbrough. Their families have released tributes describing them as heroes who died in the line of duty, with over £150,000 raised for the officers' families.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4gvgy3de37o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "PCs killed in A66 crash were heroes, say families\n- Published\nTwo police officers who died when a car travelling the wrong way down a dual carriageway crashed into their vehicle have been hailed as heroes by their families.\nPC Tom Clough, 38, and PC Matthew Blades, 37, died when a Volkswagen Passat, which officers had been pursuing until seconds before, collided with their marked armed response car on the A66 near Middlesbrough on Saturday.\nThe Passat's occupants Michael Robert Cahill, 23, Jacob Matusiak, 23, Theo Rae, 17, Makai Saddington, 18, and Cole Robert Worthy, 17, also died.\nIn tributes released by Cleveland Police, PC Clough's family said he was \"willing to help anyone\", while PC Blades' wife described him as \"loved beyond words\".\n\"No words will ever feel like the right words to honour our Matt,\" she said, adding he was a \"beloved husband\" and the \"most devoted father\" to their two young sons who would grow up knowing what an \"incredible\" dad he was.\n\"He gave his life in the line of duty, protecting and serving others with courage, dedication and selflessness,\" she said.\n\"The pain of losing him is beyond words, and our lives will never be the same.\n\"Neither will the love he gave us ever fade.\n\"He may have left this world committed to the duty he believed in, but his greatest legacy will always be the love he gave to his family.\"\nShe ended the tribute to her husband: \"Forever loved. Forever missed. Forever our superhero. Our Matt and Dad.\"\nPC Clough's family said he had a \"fantastic sense of humour\" and \"jumped into action whenever needed\", adding he was \"our hero\" and always \"willing to help anyone for any reason\".\nThey also said he \"proudly fought for his country to make the world a better place\" and was \"always on public duty throughout his short life\".\nIn other tributes, a man who knew PC Clough posted on social media he was a \"true friend, fantastic soldier and I have no doubt even better police officer\".\nSeaton Carew FC, where PC Blades had recently become a coach and was preparing for his first season with its under-sevens team, said the officer and his family were \"much loved members\" of the club.\nFC Hartlepool, where PC Blades had coached the under-10s team, said he was a \"role model, mentor [and] friend\" who the children \"looked up to and admired\".\n\"His kindness, patience, and infectious personality made him loved by all who had the privilege of knowing him,\" the club added.\nFunds raised for families\nCarmel College in Darlington, where PC Blades taught English before joining the police, said he was an \"intelligent, kind an approachable teacher\" who \"gave generously of himself to the young people in his care\".\nOn Sunday evening, more than £150,000 had been raised for the officers' families in an online fundraiser set by Cleveland Police Federation, who said the two officers had \"paid the ultimate sacrifice in the line of duty\".\n\"They leave behind heartbroken loved ones who will struggle to come to terms with the loss of their loved one,\" the federation said, adding the organisation would support the families \"at this unfathomable moment\" with the money to be used \"as they so wish\".\nEarlier a group of police officers laid floral tributes at the police cordon on Eston Road.\nSome removed their hats and bowed their heads and took a brief moment of silence to remember their colleagues.\nThey spoke briefly to other officers at the scene before leaving, with some hugging each other as they walked away.\nLocal residents Elisia and Vincent Haarhoff also went to the scene to express their solidarity with the police.\n\"No family deserves that,\" Elisia said, adding: \"God bless all the families, honestly.\n\"We wanted to come... [the police here have] always been so lovely.\"\nThe Independent Office for Police Conduct (IOPC), which is investigating the crash, said PC Clough and PC Blades were \"in the area to assist in a search\" for the Passat.\nCleveland Police had received reports linking the car, which was believed to be using cloned registration plates that activated an ANPR camera, to \"numerous incidents\", the watchdog said.\nOfficers were pursuing it for almost seven minutes before the Passat turned the wrong-way on to the A66, the IOPC spokesman said.\nAbout 10 seconds later, at 03:39 BST, the car hit the officers' vehicle which was on the correct side of the dual carriageway, the IOPC said.\nSecurity footage from a house on Lime Road in Middlesbrough appears to show a car being pursued by police vehicles three minutes before the crash.\nRedcar and Cleveland Borough Council said the section of A66 in South Bank between Eston Road and Normanby Road would remain closed until Monday while repairs were carried out on the carriageway.\nFollow BBC Tees on X,, external Facebook, external, Nextdoor and Instagram, external and listen to Radio Tees on BBC Sounds.\nGet in touch\nDo you have a story suggestion for BBC Tees?\nRelated topics\n  - Published6 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "hailed", "definition": "称賛される、歓迎される。人や業績が広く認められ、肯定的に評価されることを意味する。"}, {"word": "dual carriageway", "definition": "分離された2本の車線を持つ道路。イギリスの用語で、中央分離帯で分かれた高速道路を指す。"}, {"word": "tributes", "definition": "故人への敬意の表現。故人の功績や人格を讃える言葉や行為のこと。"}, {"word": "ANPR camera", "definition": "自動ナンバープレート認識カメラ。車のナンバープレートを自動で読み取り記録する技術。"}, {"word": "cloned registration plates", "definition": "違法に複製されたナンバープレート。他の車と同じナンバーを偽造し、追跡を逃れるために使用される。"}, {"word": "cordon", "definition": "警察が現場を保護するために張る柵や境界線。立ち入り禁止の区域を作る。"}, {"word": "unfathomable", "definition": "理解できない、計り知れない。深すぎて底が見えない状態を表す比喩的な表現。"}]}, {"title_ja": "監視機関が発表：致命的な衝突の約10秒前に警察が追跡を中止", "title_en": "Police abandoned pursuit 10 seconds before fatal crash kills seven, watchdog confirms", "summary_ja": "ミドルズブラ付近のA66で警察はフォルクスワーゲン・パサートの追跡を中止してから約10秒後に、その車が警察車両と正面衝突し、乗員5人と警察官2人が死亡した。独立警察非違行為委員会の調査によると、追跡はほぼ7分間続き、車が対向車線に入ると中止されたが、衝突はその直後に発生した。", "summary_en": "Police called off a high-speed pursuit of a Volkswagen Passat on the A66 near Middlesbrough just before it crashed head-on into a police vehicle, killing all five occupants and two officers. The Independent Office for Police Conduct investigation found the pursuit lasted nearly seven minutes before officers abandoned it when the car entered the wrong side of the dual carriageway, but the collision occurred approximately 10 seconds later.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cdj0j8enpzyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Pursuit 'abandoned' seconds before crash killed seven\n- Published\nPolice abandoned the pursuit of a car seconds before it crashed going the wrong way down a dual carriageway, killing all five men aboard and two officers, investigators have said.\nMichael Robert Cahill, 23, Jacob Matusiak, 23, Theo Rae, 17, Makai Saddington, 18, and Cole Robert Worthy, 17, died when a Volkswagen Passat struck a Cleveland Police vehicle on Saturday on the A66 near Middlesbrough.\nPC Matthew Blades, 37, and PC Tom Clough, 38, who were on the correct side of the road and were helping search for the car, were also killed.\nThe Independent Office for Police Conduct (IOPC) said the force had been pursuing the Passat following reports of \"numerous incidents\" linked to it.\nThe watchdog, which launched an immediate investigation, said the Passat was believed to be using cloned registration plates which activated an ANPR camera.\nAnalysis of footage from one of the police vehicles showed the pursuit lasted just under seven minutes before the Passat travelled on to the wrong side of the A66, at which point officers \"abandoned\" it, the IOPC said.\nThe pursuing officers continued to travel on the correct side of the carriageway but approximately 10 seconds later at about 03:39 BST, the Passat collided with the vehicle of PC Blades and PC Clough, who were \"in the area to assist in a search\" for the car, a spokesman said.\nSecurity footage from a house on Lime Road in Middlesbrough appears to show a car being pursued by police vehicles three minutes before the crash.\nChief Constable Victoria Fuller said on Saturday it was an \"incredibly sad day for Cleveland\", adding: \"No one should leave their home and not return safely.\"\nFuller said she and her deputy chief constable visited the officers' families to \"offer our condolences, support one another, and begin to come to terms with this unimaginable loss\".\nPoliticians, including the prime minister and home secretary, have remembered the officers, with Andy Burnham saying he was \"devastated\" by the news.\nThe Great North Air Ambulance said it \"will be felt across our communities and among all those who responded and supported the emergency response\".\nAnna Turley, MP for the Redcar constituency where the crash happened, said it was \"devastating\" to think about the grief of the families involved.\n\"There were seven lives cut short needlessly in the early hours of yesterday morning and that's a tragedy for the community here, it's a tragedy for the Cleveland Police family. Everybody today is really mourning the loss of those lives.\"\nShe paid tribute to the \"bravery\" of PC Blades and PC Clough and said \"no one should not come home to their families at the end of their shift.\"\nCleveland Police Federation chairwoman Lauren Somerville said the loss of the officers was \"unfathomable\", adding: \"Words cannot describe the pain the Cleveland Police family are feeling today.\"\nWhen someone dies following police contact, it is mandatory for the case to be referred to the IOPC.\nIOPC Director of Engagement Derrick Campbell said the watchdog recognised the \"devastating impact\" the incident had had on the force and \"wider policing community\".\nHe said: \"We have obtained initial accounts of officers involved in the pursuit, the incident log and in-car footage of the incident.\n\"Work is ongoing to obtain additional material.\n\"IOPC investigators will continue to review and analyse all the evidence available to us.\"\nCleveland Police and Crime Commissioner Matt Storey said it was important to let the IOPC do its investigation.\n\"I would advise anybody who has opinions or hearing things on social media to make sure that misinformation doesn't spread and we let the IOPC do its work,\" he said.\nPC Blades, a married father of two, had recently become a coach at Seaton Carew FC and was preparing for his first season teaching its under-sevens Seahawks squad, the club said.\nThe officer and his family were \"much-loved members of our club and football family\", it added.\nThe A66 - the major artery through Teesside - remained closed on Sunday with the location of the crash surrounded by industrial units and factories.\nRelated topics\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "abandoned", "definition": "何かを意図的に中止・放棄すること。この文脈では、警察が追跡を続けることを決定的にやめたことを意味します。"}, {"word": "watchdog", "definition": "政府機関や組織を監視・監督する独立した機関。ここでは警察の行動を調査する独立警察非違行為委員会を指します。"}, {"word": "collision", "definition": "2つ以上の物体が激しく衝突すること。交通事故や物理的な接触を表す正式な用語です。"}, {"word": "dual carriageway", "definition": "中央分離帯で左右に分かれた道路。各方向が別々の車線を持つ高速道路のことです。"}, {"word": "cloned registration plates", "definition": "他の車の登録番号をコピーして作られた偽の車両ナンバープレート。違法な車両追跡を避けるために使われます。"}, {"word": "ANPR camera", "definition": "自動ナンバープレート認識システムの装置。車のナンバープレートを自動で読み取り、登録情報と照合する技術です。"}]}, {"title_ja": "電力遮断によりクロスカントリーが英国のほぼすべての運行をキャンセル", "title_en": "CrossCountry cancels 'almost all' UK services after power cut", "summary_ja": "英国の鉄道事業者クロスカントリーは、バーミンガムの制御センターでの電力遮断により、ほぼすべてのサービスをキャンセルした。この停電により鉄道管理に必要な多くのシステムが利用できなくなり、グラスゴーからペンザンス、リーズからマンチェスターまでの路線に影響を及ぼしている。電力が復旧する間、他の鉄道事業者がクロスカントリーのチケットを受け入れ、代替サービスを提供することを申し出ている。", "summary_en": "UK rail operator CrossCountry has cancelled almost all its services following a power outage at its Birmingham control centre on Saturday. The outage has disabled many systems needed to manage the railway, affecting routes from Glasgow to Penzance and Leeds to Manchester. Other rail operators have offered to accept CrossCountry tickets and provide replacement services while power is restored.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy9w9y0lz5go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "CrossCountry cancels 'almost all' UK services after power cut\n- Published\nTrains across the UK have been cancelled by rail operator CrossCountry after a power cut at its control centre.\nThe power outage started in Birmingham on Saturday and as a result, many of the systems used to manage the railway are unavailable, the operator said.\nCancellations are affecting most routes, from Glasgow to Penzance and Leeds to Manchester, until further notice because of \"significant and unforeseen disruption\", said CrossCountry, ranked Britain's worst rail operator, in June.\nTransport Secretary Heidi Alexander said she was \"concerned to hear about a power outage\" and had asked publicly owned operators to provide \"extra services where possible\".\n\"We've also sent Network Rail power teams who are onsite and working to restore power and systems as soon as possible,\" she added.\nPassengers are venting their anger on social media, saying the situation is the \"worst case scenario\" at the weekend, with some taking coaches before continuing their train journey with another operator.\nMajor routes between Manchester and Birmingham, which passes through Stoke-on-Trent, Coventry and Wolverhampton, along with routes from Leeds to York, Cheltenham to Cardiff and Glasgow to Edinburgh, are all affected.\nCrossCountry confirmed tickets for Sunday would remain valid until Wednesday.\nOne user on X asked the operator if the situation would be resolved on Monday.\nIt responded: \"We would hope so, but at the moment we have no further updates.\"\n'Frustrating and unacceptable'\nFans travelling to football fixtures have been warned that services to and from Manchester, Liverpool and Newcastle might be \"extremely busy\".\nReese Proctor described the cancellations as \"frustrating and unacceptable\" as he tried to get to Manchester's Etihad Stadium in time for a 14:00 BST kick-off against Bournemouth.\nHe had hoped to get a train from Reading to Manchester, but instead resorted to driving more than 100 miles to his friend's house in Leicester before driving on to the stadium.\nThe 22-year-old told BBC Newsbeat the drive had added an extra two hours to his journey, leaving him \"fuming\".\n\"If I couldn't drive, or have [my friend] to drive... I wouldn't have been able to go to the match. That would have been a waste of a match ticket,\" he said.\nAnother passenger, posting on X, said: \"A massive thank you to Cross Country Trains for cancelling my train this morning to Birmingham. You are truly not fit for service. You have also cancelled my train coming back but that is immaterial. Useless. Utterly useless.\"\nServices to Plymouth and Penzance are also disrupted with customers relying on Great Western Railway operators as a replacement.\n\"We are working closely with relevant partners and will provide further updates as soon as possible,\" a CrossCountry spokesperson said.\nChiltern Railways said it had added services between Birmingham Moor Street and Oxford to help with the disruption, adding it will accept \"all CrossCountry tickets via any reasonable route\".\nLondon North Eastern Railway also confirmed it would accept CrossCountry tickets \"to help get affected customers to their destination\".\nAt New Street station, the barriers to all platforms are open and there are regular announcements to passengers about the disruption.\nThe digital boards in the concourse are carrying a Special Notice to warn passengers of the cancellation to CrossCountry services.\nWhile the operator usually calls at more than 100 stations, it said that the only route expecting a \"near-normal\" service was between Peterborough, Cambridge and Stansted Airport.\nThe company apologised to passengers affected and said tickets were being accepted by other operators.\nCustomers are entitled to Delay Repay compensation if their train is delayed by 30 minutes or more, while those who choose not to travel can claim a refund for their journey.\nNational Rail said affected customers could use London Underground services at no extra cost and also West Midlands Metro services between Wolverhampton and Birmingham New Street.\nTrain tickets purchased for travel on CrossCountry services on Sunday will be valid for travel until Wednesday, it added.\nThe organisation told football fans: \"You may need to stand for part or all of your journey.\n\"If you require any assistance, please speak with a member of staff.\"\nGet in touch\nHave you been affected by the disruption?\nFollow BBC Birmingham on BBC Sounds, Facebook, external, X, external and Instagram, external.\n  - Published18 June\n  - Published29 April\n  - Published11 February", "translation_ja": "", "vocab": [{"word": "outage", "definition": "電力供給の中断。一時的な停電またはサービス停止を指す。「power outage」は電力遮断の意味で頻繁に使用される。"}, {"word": "disruption", "definition": "通常の流れや事業の中断・混乱。「unforeseen disruption」は予期しない障害を意味する。"}, {"word": "compensation", "definition": "損害や不便に対する補償金。「Delay Repay compensation」は遅延に対する払い戻しを指す。"}, {"word": "venting", "definition": "感情や不満を表現・発散する。「vent anger」で怒りを表現するという意味になる。"}, {"word": "resort to", "definition": "やむを得ず～に頼る・～に訴える。困った時に他の手段を使わざるを得ない状況を表す。"}, {"word": "immaterial", "definition": "重要でない・本質的でない。その事柄が大して問題ではないことを示す。"}]}, {"title_ja": "カザフスタン与党が議会選挙で圧勝、大統領の権力を強化", "title_en": "Kazakhstan's Ruling Party Wins Parliamentary Election, Solidifying President's Control", "summary_ja": "カザフスタンの親大統領派・アディレト党は日曜日の新一院制クルルタイ議会選挙で投票率70～72%を獲得した。この選挙は3月の憲法改革に続くもので、上院が廃止され、トカエフ大統領の任期制限が事実上リセットされた。インフレと報道抑圧の中で実施された選挙では、野党は立候補が禁止されている。", "summary_en": "Kazakhstan's pro-presidential Adilet party won between 70-72% of votes in Sunday's parliamentary election for the new unicameral Kurultai, according to exit polls. The election follows a March constitutional reform that abolished the Senate and effectively reset presidential term limits, allowing President Tokayev to potentially run again in 2029. The vote took place amid economic strain, press crackdowns, and restrictions on opposition parties.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/kazakhstan-parliamentary-vote-cements-president-s-power/a-78474598?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Kazakhstan parliamentary vote cements president's power\nPublished August 23, 2026last updated August 23, 2026\nKazakhstan's ruling party comforably won an election for the country's new, single-chamber parliament on Sunday, according to exit polls.\nState television shared three exit polls giving the Adilet party between 70% and 72% of the vote.\nThe vote comes after a new constitution approved in March did away with the Senate to create a new unicameral Kurultai — a reference to the medieval councils of the region's nomadic past.\nBackers of the new body say it will give parliament more say in decision making, critics argue it will only cement the power of President Kassym-Jomart Tokayev.\nThe 73-year-old took the reins from authoritarian Nursultan Nazarbayev — who himself ruled the country for 30 years after the collapse of the Soviet Union — in 2019.\nThe pro-presidential Adilet party was expected to win an overwhelming majority in Sunday's vote, while exit polls showed four smaller parties loyal to Tokayev also won seats in the new parliament.\nSeven state-approved parties have been allowed to field candidates for the 145-seat parliament while genuine opposition parties have been banned.\nThe election took place amid soaring inflation (which is hovering around 10.2%) and rising taxes, fueling concerns for the government — and particularly Tokayev — of a repeat of January 2022 cost of living unrest that left 238 protesters and police dead.\nPress crackdown and financial strain color Kazakhstan's election\nBeyond financial strain, Sunday's vote also took place against the background of crackdowns on press freedom, with numerous reporters under house arrest and official criminal cases being brought against 10 independent journalists and bloggers.\nTokayev, a former Soviet official and Kazakh diplomat who worked at the UN, touted his reforms and justified the many changes he has initiated — including the introduction of the new constitution — as necessary in a fast-changing world.\n\"Without a doubt, these elections will be remembered as perhaps the most interesting in our country's history,\" said Tokayev on Friday.\n\"Amid unprecedented geopolitical tensions and mounting global challenges, we must firmly and consistently implement our strategy to transform Kazakhstan into a truly developed state,\" he added.\nTokayev has sought to maintain a delicate balance between Moscow — with their shared Soviet ties — and the West since sanctions were imposed on Russia over its invasion of Ukraine. Resource-rich and strategically located Kazakhstan also has ties to China and the European Union.\nAlthough Tokayev has said that he has no plans of staying in power beyond his current term, the constitutional reform that 87% of voters backed this March effectively reset term limits for the office — making him eligible to run for another seven-year stint in 2029 should he change his mind.\nEdited by: Natalie Muller and Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "unicameral", "definition": "一院制の議会制度を指す。二院制（上下両院）ではなく、単一の議会から構成される政治体制のこと。"}, {"word": "cement", "definition": "強化する、確実にする、堅固にするという意味の動詞。ここでは大統領の権力をさらに強固にすることを表している。"}, {"word": "authoritarian", "definition": "権威主義的な、独裁的なという形容詞。個人の自由を制限し、権力を集中させる政治体制を説明する際に使われる。"}, {"word": "geopolitical", "definition": "地政学的な、地理と政治の関係性に基づくという形容詞。国家間の戦略的な位置関係や利益を分析する際に用いられる。"}, {"word": "incumbent", "definition": "現職の、現在の職務にある人を指す形容詞または名詞。ここでは現大統領を意味している。"}, {"word": "crackdown", "definition": "取り締まり、弾圧という名詞。政府が特定の活動や言論に対して厳しく抑圧する行為を表す。"}]}, {"title_ja": "ゼレンスキー大統領、ノルド・ストリーム攻撃への関与を否定", "title_en": "Zelenskyy Denies Ukraine's Involvement in Nord Stream Pipeline Attack", "summary_ja": "ウクライナのゼレンスキー大統領は、2022年のノルド・ストリーム・パイプライン破壊事件への関与を再度否定しました。ドイツ当局が国家関与を主張していますが、同大統領はヨーロッパの信頼を失わないことの重要性を強調し、調査への協力を表明しています。", "summary_en": "Ukrainian President Volodymyr Zelenskyy reiterated that Ukraine had no role in the 2022 Nord Stream pipeline sabotage, despite German authorities alleging state involvement. He emphasized the importance of maintaining trust with European partners while assisting with the ongoing investigation.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/zelenskyy-repeats-ukraine-not-behind-nord-stream-attack/a-78478791?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Zelenskyy repeats Ukraine not behind Nord Stream attack\nAugust 23, 2026\nUkrainian President Volodymyr Zelenskyy reiterated on Sunday that Ukraine was not involved in the 2022 attack on the Nord Stream underwater gas pipelines.\n\"Ukraine has never officially taken part in any operation related to the blowing up of Nord Stream,\" Zelenskyy told reporters on Sunday in response to a question about the ongoing investigation.\nHe said that Germany was \"well aware that Ukraine did not stand behind the execution or the very conception of this operation.\"\nZelenskyy hopes 'not to lose trust'\nGerman authorities alleged last month that the attack had been ordered by the Ukrainian state, while a second Ukrainian national was also detained over the blasts this week.\nZelenskyy said Ukraine was assisting German authorities with their investigation.\n\"It is very important for us not to lose our partnership, not to lose the trust of European countries that have been helping Ukraine since the very beginning of this war,\" he said.\nGerman authorities implicate Ukraine\nThe Nord Stream 1 pipeline ran under the Baltic Sea and delivered gas from Russia to Germany and other countries in Europe. A second pipeline called Nord Stream 2 was constructed but never went into use.\nIn September 2022, both pipelines were sabotaged with undersea explosions. No group claimed responsibility for the attack.\nIn early 2026, German authorities detained the first suspect, a Ukrainian national Serhii K., and alleged that he and six accomplices had acted \"on the orders of state authorities in Ukraine.\"\nProsecutors said the plan was to \"destroy the Nord Stream 1 and Nord Stream 2 pipelines\" with the objective of \"permanently halting gas supplies via the pipelines and preventing Russia from using the revenue from natural gas trade to finance its war efforts.\"\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "reiterated", "definition": "同じことを何度も繰り返して述べること。特に既に言及されたポイントを強調するために使用されます。"}, {"word": "sabotaged", "definition": "意図的に破壊、損傷、または機能を妨害すること。通常、政治的または軍事的目的で行われます。"}, {"word": "alleged", "definition": "公式な証拠なしに、誰かが何かをしたと主張または示唆すること。裁判前の段階でよく使われます。"}, {"word": "implicate", "definition": "誰かを犯罪や不当な行為に関与させているとほのめかすこと。関係または関連性を示唆します。"}, {"word": "permanently", "definition": "永続的に、恒久的に、または二度と変わらない方法で。長期的または永遠の変化を示します。"}]}, {"title_ja": "ギリシャの収容施設で移民が警察と衝突、35人が脱出", "title_en": "Migrants Clash with Police at Greek Detention Center, 35 Escape", "summary_ja": "ギリシャ北部の収容施設で移民が警察と衝突し、境界フェンスを切断して35人が脱出しました。当局は対立中にフラッシュバン手榴弾を使用し、逃げた者のうち17人を再捕捉しましたが、18人はまだ逃げたままです。少なくとも5人の移民が負傷して入院しました。", "summary_en": "Migrants at a detention center in northern Greece clashed with police, resulting in 35 people escaping after cutting through a perimeter fence. Authorities used flash-bang grenades during the confrontation and recaptured 17 of the escapees, with 18 still being sought. At least five migrants were injured and hospitalized.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/greece-migrants-clash-with-police-at-detention-center/a-78478650?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Greece: Migrants clash with police at detention center\nAugust 23, 2026\nMigrants clashed with police at a detention center in northern Greece, with 35 having escaped the premises after cutting through a perimeter fence before police detained about half of them again, authorities said on Sunday.\nGreece is a major point of entry for migrants to Europe, and the country's conservative prime minister has introduced tough rules to deport those who've been denied asylum in the country.\nGreece, along with other European Union countries, for example, is in talks with African countries about establishing centers for failed asylum-seekers, a move that has drawn criticism from international rights groups.\nPolice deploy flashbangs during clashes\nPolice said they called for reinforcement to the detention center in Sintiki, a few kilometers from the Bulgarian border, after migrants threw rocks at police.\nAuthorities used flash-bang grenades against people during those clashes, which they said lasted until the early hours of Sunday morning.\nAt least five migrants were injured and taken to the hospital. Police recaptured 17 of those who escaped and the search continued for 18 others.\nThe temporary accommodation center houses about 450 people while their applications are processed, a protracted procedure that can take a long time.\nEdited by: Sean Sinico\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button so you'll see our verified news first.", "translation_ja": "", "vocab": [{"word": "perimeter", "definition": "敷地や区域の周囲の境界線。セキュリティや管理の文脈で、施設の外側の境界を指します。"}, {"word": "protracted", "definition": "長く続く、長引く。時間がかかる過程や手続きを説明するときに使われます。"}, {"word": "flash-bang grenades", "definition": "強い光と音を発して人を一時的に行動不能にする非致死性の手榴弾。警察や軍隊の制圧作戦で使用されます。"}, {"word": "reinforcement", "definition": "追加の支援や強化。警察が対応するために派遣された追加要員を指します。"}, {"word": "detention center", "definition": "不法移民や難民申請者を一時的に保管する施設。移民管理当局により運営されます。"}]}, {"title_ja": "USPS、郵便投票の新ルールを導入", "title_en": "USPS Implements New Rules for Mail-in Ballots", "summary_ja": "米国郵便公社（USPS）は郵便投票の取り扱いと処理を管理する新しい規制を発表しました。これらの変更は、裁判所が現在の差し止め命令を解除するまで発効しません。新しいルールは投票用紙の処理および配達手続きの合理化を目指しています。", "summary_en": "The United States Postal Service has announced new regulations governing the handling and processing of mail-in ballots. These changes will not take effect until a court lifts its current injunction on the policy. The new rules aim to streamline ballot processing and delivery procedures.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/usps-makes-new-rules-mail-ballots/story?id=135879673", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：速報と生中継イベント", "title_en": "ABC News Live: Breaking News and Live Events Coverage", "summary_ja": "ABCニュースライブは、速報と生中継イベントを24時間体制で配信しています。世界中の主要なニュースをリアルタイムで報道し、視聴者に最新情報を提供します。このライブストリーミングサービスを通じて、継続的なニュース更新と特別なイベント報道にアクセスできます。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events as they unfold. The platform delivers up-to-the-minute reporting on major stories from around the world. Viewers can access continuous news updates and special event coverage through this live streaming service.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジェフリーズとクシュナー氏が共通点協議で会談", "title_en": "Jeffries and Kushner Meet to Explore Common Ground", "summary_ja": "大統領の外部顧問を務めるジャレッド・クシュナー氏がジェフリーズと会談し、共通点の可能性について協議した。この会談は重要な問題における超党派的協力を模索する継続的な取り組みを示している。クシュナー氏は政権の非公式な顧問役を果たし続けている。", "summary_en": "Jared Kushner, serving as an outside adviser to the president, met with Jeffries to discuss potential areas of common ground. The meeting signals ongoing efforts to find bipartisan cooperation on key issues. Kushner continues to play an informal advisory role in the administration.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/jeffries-kushner-met-privately-discussed-potential-areas-common/story?id=135882503", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権、新協定の下でリベリアに20人を強制送還", "title_en": "US Deports 20 People to Liberia Under Trump's Third-Country Agreement", "summary_ja": "米国はトランプ政権とリベリアの新協定の一環として、最初のグループとして20人をリベリアに強制送還した。この協定では最大1,200人の移民がこの西アフリカ諸国に送られる予定である。批評家によれば、トランプ政権は少なくと35カ国と協定を結び、約23,000人を第三国に強制送還しており、この慣行は亡命保護をめぐることになると指摘されている。", "summary_en": "The United States has deported 20 people to Liberia as the first group under a new agreement that will see up to 1,200 migrants sent to the West African country. The Trump administration has reached deals with at least 35 countries to deport roughly 23,000 people to third countries, a practice critics say circumvents asylum protections. Previous reports indicate that over 80% of those deported to third countries have returned home, often at additional taxpayer expense.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/aug/20/liberia-deportation-agreement", "state_media": false, "category": "社会", "full_text": "Twenty deportees from the United States arrived in Liberia on Thursday, as part of a new agreement that will see the west African country receive as many as 1,200 people under the Trump administration’s immigration crackdown.\nThe group arrived at the Roberts international airport outside the capital, Monrovia. The Liberia-US agreement is one of the largest third-country deportation arrangements pursued by the administration since Trump returned to office last year.\nThe Liberian information minister, Jerolinmek Piah said the 1,200 deportees will include African nationals as well as nationals from North America, South America and the Caribbean.\nDuring a briefing on Tuesday, Liberia’s justice minister, Natu Oswald Tweh, said that the majority of the deportees had committed migration-related violations and offenses, and that they could seek asylum in the west African country if they wished.\nThe US has agreed to extend visitor visas for Liberians from 12 to 36 months and pledged $124m in assistance as part of the arrangement.\nUnder a series of often-secret agreements, the Trump administration has deported thousands of people to nearly two dozen countries that are not their own, advocates say, with about 10 of them in Africa. A new report by Refugees International and Human Rights First say the Trump administration has reached deals with at least 35 countries and has sent roughly 23,000 people to 26 of them as of early August, and makes the Liberia agreement the largest single arrangement so far.\nImmigration lawyers have said the Trump administration uses deportations to third countries as a legal loophole to indirectly force asylum seekers back to their home countries.\nIn many cases, migrants are deported to countries they have never been to or where they face safety risks and are left with little choice other than to return to the home countries they were fleeing from.\nA February report by Senate foreign relations committee Democrats found the Trump administration had paid more than $32m to five governments, several with poor human rights records, to accept about 300 third-country deportees – including $1.1m per person to Rwanda for seven deportees, and $7.5m to Equatorial Guinea for 29, a sum exceeding all US aid to that country over the previous eight years.\nThe report found more than 80% of those sent to third countries had since returned home anyway, often at further cost to taxpayers, and cited cases where deportees with US court-ordered protections were removed to Ghana and Equatorial Guinea before being sent onward within days.\nThe state department disputed the report’s characterization of its enforcement record.\nThe Associated Press contributed reporting", "translation_ja": "", "vocab": [{"word": "third-country deportation", "definition": "自国ではなく第三国への強制送還。亡命希望者を直接的に本国へ戻すのではなく、仲介国を経由する方法で、法的な抜け穴として機能することがある。"}, {"word": "loophole", "definition": "法律や規則の不備や隙間を利用した抜け穴。意図的な規制回避に使用されることが多い。"}, {"word": "asylum seekers", "definition": "自国で迫害や危険から逃れるために他国に庇護を求める人々。国際法により基本的な保護の対象となる。"}, {"word": "enforcement", "definition": "法律や合意事項の執行。この文脈では政府による移民・強制送還政策の実行を指す。"}, {"word": "human rights records", "definition": "国家による人権尊重状況の履歴や実績。国際的な評価の対象となり、人権侵害が多い国は記録が悪いとされる。"}, {"word": "circumvent", "definition": "法律や規則の直接的な適用を避けるための迂回策を用いること。法的責任を逃れるための行動を指す。"}]}, {"title_ja": "中央アフリカ共和国の金鉱山崩落で100人以上が死亡", "title_en": "Over 100 Dead After Goldmine Collapse in Central African Republic", "summary_ja": "中央アフリカ共和国西部の小規模金鉱山で火曜日に地滑りが発生し、100人以上が死亡した。ザンボイエ村で地下坑道が崩落し、CAR及びカメルーン国籍の鉱夫らが埋まった。救助活動は継続中だが、当局は回収作業の進行に伴い死亡者数が増える可能性があると警告している。", "summary_en": "A landslide caused the collapse of an artisanal goldmine in western Central African Republic on Tuesday, killing more than 100 people. The incident occurred in the village of Zamboye when underground tunnels caved in, burying miners from CAR and Cameroon. Rescue efforts are ongoing, though authorities warn the death toll may rise as recovery operations continue.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/20/gold-mine-collapse-deadly-landslide-central-african-republic", "state_media": false, "category": "IT", "full_text": "More than 100 people have died after an artisanal goldmine at a small village in western Central African Republic (CAR) caved in due to a landslide, local officials and aid workers said on Wednesday.\nThe landslide happened on Tuesday afternoon in the village of Zamboye, about 50km (31 miles) from the town of Baboua and close to the border of Cameroon. Footage on social media appeared to show an avalanche of sand descend on a group of people, likely the miners, and cover them.\nA statement by a local public prosecutor said many others were trapped under the deluge. It did not mention the number of fatalities. However, Gervais Ganagoroh, a Red Cross volunteer involved in the relief effort, told the Associated Press news agency on Wednesday that more than 100 bodies had been recovered from the collapse and a senior official at a local mining association confirmed that number to Reuters.\nLocal media in CAR reported that authorities had launched an investigation into the incident. A second prosecutor from Baboua told the press that the incident is believed to have been caused by “the collapse of several underground tunnels in which miners were operating”.\n“The ground completely collapsed and buried people,” Cedric Mbango, a miner at the site, told the AFP news agency, describing the incident as “catastrophic”.\nRescuers are racing to retrieve the bodies of victims and find survivors among the miners, believed to be nationals of CAR and Cameroon. Authorities in Cameroon’s Eastern region said at least three of its citizens have been identified as victims in the incident.\nGrégoire Mvongo, the region’s governor told state-owned radio on Wednesday that he was “working in close collaboration with our Central African colleagues to deal with the aftermath of this tragedy”.\nBertrand Be Yangué, a member of the Zamboye youth council, said that “finding them alive would be a miracle.” He added: “We are saddened and heartbroken to see young men and women perish after coming to the mines to save their families from despair.”\nThe toll is expected to rise as the rescue efforts continue, added Yangué.\nThe Central African news website Corbeau News reported that heavy machinery, including tractors, was being used in the retrieval mission and could jeopardise the rescue of those still alive under the landmass.\nThe exact number of people who were in the mine at the time of the cave-in remains unknown.\nSmall scale artisanal mines are common in different parts of Africa, despite regulations criminalising them, as unemployment continues to drive able-bodied men to abandoned or unused mines, to eke a living. The mining sites often operate with weak safety standards leading to repeated incidents: at least 40 people have died in several mining incidents in CAR this year alone.", "translation_ja": "", "vocab": [{"word": "artisanal", "definition": "小規模で伝統的な手作業による採掘や製造を指す。通常、正式な規制や安全基準がないことが多い。"}, {"word": "landslide", "definition": "山や斜面の土地が突然大量に滑り落ちる自然災害。ここでは鉱山での大量の土砂崩落を意味する。"}, {"word": "deluge", "definition": "大量の液体や物質の急激な流れ。転じて圧倒的な量で押し寄せることを表す。"}, {"word": "aftermath", "definition": "ある事件や災害の後に続く時期や結果。ここでは災害後の対応や影響を指す。"}, {"word": "jeopardise", "definition": "何かを危険にさらす、危機的状況に置く。rescue effortsを危険にさらすという意味で使用されている。"}, {"word": "toll", "definition": "災害や事故による死傷者の数。損失や犠牲の規模を示す。"}]}, {"title_ja": "ケニア北部でサファリヘリコプター墜落、7人死亡（米国人5人含む）", "title_en": "Seven killed in safari helicopter crash in Kenya; five Americans among victims", "summary_ja": "ケニア北部で水曜日朝、サファリ用ヘリコプターが墜落し、乗員乗客7人全員が死亡した。犠牲者には米国人5人のほか、テレムンド放送局フロリダ支局長ホセ・スアレス氏とエクアドル国家情報センター長ミシェレ・センシ・コントゥージ氏が含まれている。レディ・ロリ・ヘリコプターズが運航していたユーロコプター機は、2つの保護区間を飛行中にケニア北部の遠隔山岳地帯で墜落した。", "summary_en": "A safari helicopter carrying six passengers and a pilot crashed in northern Kenya on Wednesday morning, killing all seven people onboard, including five US citizens. Among the deceased were José Suárez, president of Telemundo stations in Florida, and Michele Sensi-Contugi, director of Ecuador's national intelligence service. The aircraft, a Eurocopter EC130 B4 operated by Lady Lori Helicopters, was flying between two conservancy areas when it went down in a remote mountainous region.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/19/kenya-helicopter-safari-crash", "state_media": false, "category": "社会", "full_text": "Seven people, including five Americans, were killed when a safari helicopter crashed on Wednesday morning in a remote part of northern Kenya, according to local police and the state department.\nAmong the dead were an executive with Telemundo, the US-based Spanish-language network owned by NBC Universal, and the director of Ecuador’s national intelligence service.\nThe helicopter crashed at 9.13am while flying from the Loisaba Conservancy to the Ewaso Nyiro area in Samburu county, according to the Kenya Civil Aviation Authority, which said in a statement that an investigation was under way. It said there were seven people onboard – six passengers and the pilot.\nLate on Wednesday, David Nkoroi, the police commander for Samburu, told reporters that all seven people onboard had died.\nIn Washington, the state department said five of those killed were US citizens. “The US embassy is in touch with local authorities and is providing consular assistance,” it said. “We extend our deepest condolences to the families and loved ones on their loss.”\nThe identities of the victims were not revealed but a local television station in Miami, Florida, said that José Suárez, 55, president and GM of several Telemundo stations in Florida, was among those killed.\n“We are heartbroken to learn the tragic news that José was killed in a helicopter accident in Kenya,” the NBC affiliate in Miami quoted from a joint statement from NBC Universal and Telemundo leadership.\nThe helicopter crashed in a rugged area in the foothills of Mount Ololokwe, a popular tourist destination in the country, local media reported. The helicopter, owned by local company Lady Lori Helicopters, was carrying guests with the travel company +Beyond.\nLady Lori Helicopters said in a statement that the aircraft was operating a charter flight when it crashed.\nTropic Air Kenya, a local safari operator, said in a statement that it dispatched two of its helicopters to aid search and rescue operations.\nThe aviation authority said the aircraft was a Eurocopter EC130 B4.\nEcuador confirmed later on Wednesday that Michele Sensi-Contugi, director of the country’s national intelligence center, died in the helicopter crash in Kenya.\nIn a statement posted on X, the presidency said: “In this moment of deep sorrow, the government extends its heartfelt condolences to his family, loved ones and close associates.”\nSensi-Contugi was visiting Kenya as a tourist with his wife, Stephany Hollihan Vasconez, who also died in the crash. She was a US and Ecuadorian citizen. They are survived by their two children.\nHelicopter crashes have happened with increasing regularity in Kenya, which has a thriving tourism industry that depends on domestic carriers to ferry visitors to distant places like Mount Ololokwe.\nIn February, a legislator was among six people who died after a helicopter crash in a hilly area of western Kenya.", "translation_ja": "", "vocab": [{"word": "conservancy", "definition": "野生動物や自然環境の保護を目的とした私有の保全地区。観光やビジネスと保護活動を両立させる目的で運営されることが多い。"}, {"word": "consular assistance", "definition": "領事が提供する公式な支援サービス。海外で問題が生じた自国民に対して、領事館が行う法的・行政的支援を指す。"}, {"word": "charter flight", "definition": "航空会社が特定の顧客や団体のために専用に運航する飛行。定期便ではなく、目的地や時間を顧客の要望に合わせて設定する。"}, {"word": "thriving", "definition": "繁栄している、成長している。ビジネスや産業が好調で活発な状態を表す形容詞。"}, {"word": "remote", "definition": "遠隔地の、人里離れた。都市部から遠く、アクセスが困難な場所を意味する。"}, {"word": "rugged", "definition": "険しい、ごつごつした地形。山や岩が多く、歩行困難な地況を描写する形容詞。"}]}, {"title_ja": "イスラエルのE1計画：占領下のヨルダン川西岸の分割の可能性", "title_en": "Israel's E1 Plan: Potential Division of Occupied West Bank", "summary_ja": "イスラエルは占領下のヨルダン川西岸を二分する可能性のある「E1」計画を推し進めており、パレスチナ国家の将来的実現性を大きく脅かしている。この計画はパレスチナの領土一体性と二国家解決の見通しに対する懸念を引き起こしている。アルジャジーラはこの議論の多い展開の詳細と影響を検証している。", "summary_en": "Israel is advancing its 'E1' plan, which could split the occupied West Bank in half and significantly threaten the viability of a future Palestinian state. The initiative raises concerns about Palestinian territorial integrity and the prospects for a two-state solution. Al Jazeera examines the details and implications of this controversial development.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/23/occupied-west-bank-division-ps?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Is Israel about to split the occupied West Bank in half?\nNewsFeed\nIs Israel about to split the occupied West Bank in half?\nIsrael is moving forward with its ‘E1’ plan. What is it and why could it threaten the future of a Palestinian state? Al Jazeera’s Lina Sirine explains.\nPublished On 23 Aug 2026", "translation_ja": "", "vocab": [{"word": "occupied", "definition": "軍事的に支配下に置かれた地域を指す。国際法の文脈で使用され、ある国が他国の領土を支配している状態を表す。"}, {"word": "threaten", "definition": "〜に危険や悪い結果をもたらす可能性がある。政治的文脈では、ある計画や行動が目標達成を阻害する恐れがある状況を表す。"}, {"word": "Palestinian state", "definition": "パレスチナ人による独立した国家。中東紛争の解決策として提案されている政治的単位で、パレスチナ領土の自治を意味する。"}, {"word": "territorial", "definition": "領土に関連する。地理的領域の所有権や支配に関わる政治的または法的な問題を指す。"}, {"word": "viability", "definition": "実現可能性または生存可能性。政治的文脈では、計画やシステムが実際に機能する可能性の程度を示す。"}, {"word": "controversial", "definition": "議論や意見の対立を引き起こす。多くの人が異なる見方を持つ問題や政策を指す。"}]}, {"title_ja": "イタリアの空港でテマックに4機の航空機が強風で転倒", "title_en": "Severe winds toss four aircraft across Italian airport tarmac", "summary_ja": "イタリアのエミリア・ロマーニャ州フォルリを襲った時速約120km/hの猛烈な風により、空港の駐機場に駐機していた軽飛行機4機が押し流され転倒しました。この悪天候のため、当局は約1時間の間、空港を一時的に閉鎖しました。", "summary_en": "Extreme winds reaching approximately 120 km/h swept through Forlì Airport in Italy's Emilia-Romagna region, pushing and overturning four light aircraft. The severe weather event forced authorities to temporarily close the airport for about one hour while conditions were assessed.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/23/severe-winds-toss-four-aircraft-across-italian-airport-tarmac?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Severe winds toss four aircraft across Italian airport tarmac\nNewsFeed\nSevere winds toss four aircraft across Italian airport tarmac\nWinds reaching around 120 km/h swept through Forlì in Italy’s Emilia-Romagna region, pushing and overturning four light aircraft on the airport tarmac. The severe weather forced the temporary closure of Forlì Airport for about an hour.\nPublished On 23 Aug 2026", "translation_ja": "", "vocab": [{"word": "tarmac", "definition": "飛行場の滑走路や駐機場の舗装面を指す。航空業界用語で、特に航空機が駐機や移動する場所を示す。"}, {"word": "severe weather", "definition": "危険な気象条件を表す表現で、暴風、豪雨、落雷など激しい天候現象を意味する。"}, {"word": "overturn", "definition": "物が転倒する、ひっくり返るという意味。人が決定を覆す場合にも使用される。"}, {"word": "swept through", "definition": "嵐や風などが急速に通り抜ける様子を描写する表現で、広い地域を素早く通過することを意味する。"}, {"word": "temporary closure", "definition": "施設や施設が一時的に営業停止またはアクセス不可になることを指す。通常は短期間での対応措置である。"}]}, {"title_ja": "トランプ大統領の「フリーダム250グランプリ」でインディカーがワシントンDCの名所を競走", "title_en": "IndyCars Race Through Washington DC in Trump's Freedom 250 Grand Prix", "summary_ja": "米国建国250周年を記念してトランプ大統領が創設した「フリーダム250グランプリ」で、インディカードライバーたちがワシントン記念塔や米国議会議事堂などの著名なランドマークを通るストリートレースに参加しました。25人のドライバーが147周回で合計400km走行し、インディカー史上2番目に長いストリートレースとなりました。約10万人の観客の参加が予想されていました。", "summary_en": "IndyCar drivers competed in the Freedom 250 Grand Prix, a new street race created by President Trump that wound through Washington DC's iconic landmarks including the Washington Monument and US Capitol. The event marked the 250th anniversary of the United States, with 25 drivers racing 147 laps totaling 400km, making it the second-longest street race in IndyCar history. Up to 100,000 spectators were expected to attend the inaugural event.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/gallery/2026/8/23/photos-indycars-speed-past-washington-landmarks-ahead-of-freedom-250?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "In Pictures\nPhotos: IndyCars speed past Washington landmarks as part of Freedom 250\nRace cars take over central Washington, DC, as the Trump-created Freedom 250 Grand Prix debuts.\nRace cars have roared through the streets of Washington, DC, in the shadow of its landmarks as the Freedom 250 Grand Prix, created by United States President Donald Trump, has kicked off.\nBefore Sunday’s first-of-its-kind race, IndyCar drivers tested open-wheel cars at speeds of up to 298 kilometres per hour (185 miles per hour) on Saturday over the bumps and bends of a seven-turn, 2.7km (1.7-mile) course that winds around the Washington Monument, the US Capitol, the National Gallery of Art and the Smithsonian National Air and Space Museum along the National Mall.\nSpain’s Alex Palou, the championship leader with six wins this season, claimed his seventh pole position of the campaign with a qualifying lap of 56.899 seconds after setting the fastest practice time of 56.614 seconds.\nBut results took a back seat to the dramatic backdrop for Sunday’s race, which Trump established by executive order as part of celebrations marking the 250th anniversary of the US.\nOrganisers expected up to 100,000 people to attend, including Trump.\nA field of 25 drivers contested 147 laps on Sunday over a total distance of 400km (250 miles), making it the second-longest street race in IndyCar history after 500km (310-mile) events held in Cleveland in 1982 and 1983.", "translation_ja": "", "vocab": [{"word": "inaugural", "definition": "初めての、最初の。新しく始まるイベントや式典が初めて開催されることを表します。"}, {"word": "contested", "definition": "競争する、競い合う。複数の参加者が同じ目標を目指して競合する状況を示します。"}, {"word": "backdrop", "definition": "背景、舞台設定。イベントや活動が行われる場所や環境を劇的に描写する際に使われます。"}, {"word": "executive order", "definition": "大統領令、行政命令。大統領が議会を通さずに直接発令する公式な指示のことです。"}, {"word": "qualifying lap", "definition": "予選ラップ。レースで参加資格を得るために走行し、スターティングポジションを決定する周回走行のこと。"}]}, {"title_ja": "シリア外相、ヨルダンでモサド長官と会談、緊張緩和を目指す", "title_en": "Syria FM meets Mossad chief in Jordan to ease tensions", "summary_ja": "シリアのアサド・アル・シャイバーニ外相は2026年8月23日、ヨルダンでイスラエルのモサド長官ロマン・ゴフマンと会談し、イスラエルとシリア新政権間の重要な交渉の場となった。両者は米国の監督下でヨルダンに特別作戦室を設置し、対立を防ぐことを目指している。この会談は月初のイスラエルによるシリア空軍基地への空爆に続くもので、より広範な安全保障協定に向けた進展を示している。", "summary_en": "Syria's Foreign Minister Assad al-Shaibani met with Israel's Mossad chief Roman Gofman in Jordan on August 23, 2026, marking significant negotiations between Israel and Syria's new authorities. The talks aimed to establish a special operations room under U.S. supervision to prevent confrontations and address Israeli military actions in southern Syria. The meeting followed an Israeli airstrike on a Syrian airbase earlier in the month and represents progress toward a broader security agreement.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/syria-fm-meets-mossad-chief-in-jordan-sources/article71382226.ece", "state_media": false, "category": "政治", "full_text": "Syria’s Foreign Minister met the head of Israel’s Mossad intelligence agency in Jordan on Sunday (August 23, 2026), two sources told AFP, a move aiming to ease tensions after an Israeli attack on an airbase in Syria’s northwest.\nThe talks, which restarted negotiations between Israel and Syria’s new authorities, came after the sides in January agreed to establish an intelligence-sharing mechanism as they edge towards a security agreement.\nThey also came after Israel on Tuesday (August 18, 2026) bombed the disused Abu Duhur base in Syria, claiming it wanted to avert Turkish troops deploying to the facility, while Ankara denied any visit to the site.\nRequesting anonymity, a diplomatic source and a Syrian government source said Foreign Minister Assad al-Shaibani and Mossad chief Roman Gofman discussed issues such as establishing “a special operations room” in Jordan under U.S. supervision to prevent any confrontation in Syria including involving Turkey.\nThe meeting, first reported by news outlet Axios, was not confirmed officially by either side, with a spokesperson for the office of Israeli Prime Minister Benjamin Netanyahu telling AFP they had no comment.\nU.S. envoy for Syria Tom Barrack this week slammed Israel’s attack on the airbase as an “unnecessary escalation that does not advance regional stability”.\nMr. Netanyahu and Turkish President Recep Tayyip Erdogan, an ally of Damascus, have traded barbs since the incident.\nSouthern Syria\nThe Syrian government source said the talks on Sunday (August 23, 2026) were the first negotiations between Israel and Syria in some time, while the diplomatic source said they were the first in several months.\nIsrael and Syria’s new authorities have held several rounds of direct talks, and after negotiations in Paris in January they agreed to establish a dedicated communication cell under U.S. supervision to lower bilateral tensions.\nAn Arab diplomat in Damascus had told AFP at the time that a joint operations room based in Jordan would follow issues including security coordination and border control.\nThe two sources also said Mr. Shaibani and Mr. Gofman on Sunday (August 23, 2026) discussed Israeli incursions into southern Syria.\nIsrael has launched hundreds of strikes on Syria since the December 2024 toppling of longtime ruler Bashar al-Assad by Islamist forces whom it considers jihadists.\nIt has also sent troops into a UN-patrolled buffer zone that for decades had separated Israeli and Syrian forces on the Israeli-annexed Golan Heights.\nIsrael has also carried out repeated incursions deeper into Syrian territory and has vowed to keep troops in a so-called “security zone” in southern Syria, where it seeks a broader demilitarised area.\nThe talks came a day after Israel struck what it said was a militant in southern Syria, as Damascus said one person was wounded in the strike which it called a “flagrant violation” of its sovereignty.\nIsrael captured most of the Golan Heights from Syria in the 1967 Arab-Israeli War and later annexed the areas under its control, in a move only recognised by the United States and, this month, also Colombia.\nU.S. President Donald Trump has been pushing for a security deal between Syria and Israel, but Israel remains distrustful of Syria’s authorities.\nPublished - August 24, 2026 01:53 am IST", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や対立が段階的に悪化・拡大すること。政治的・軍事的危機が深刻化する過程を表す。"}, {"word": "demilitarized", "definition": "軍隊や軍事施設を除去または制限した状態。兵器や軍事活動が禁止される地域を指す。"}, {"word": "incursions", "definition": "他国や領域への侵入や侵攻。国境を越えた軍事的な一時的な侵害を意味する。"}, {"word": "buffer zone", "definition": "紛争当事者間に設置される緩衝地帯。両者の直接衝突を防ぐための中立的な領域を指す。"}, {"word": "bilateral", "definition": "2国間の関係や協定。両国間の相互的な交渉や合意を表す。"}, {"word": "distrustful", "definition": "信頼していない、疑わしいと考える状態。相手方の意図や能力に対する懐疑心を示す。"}, {"word": "sovereignty", "definition": "国家の主権や自主権。他国の干渉を受けない独立した統治権を意味する。"}]}, {"title_ja": "ギニアのごみ埋め立て地で地滑りが発生、30人が死亡", "title_en": "Landslide at Guinea landfill kills 30 after heavy rains", "summary_ja": "ギニアの首都コナクリのごみ埋め立て地で日曜日早朝に地滑りが発生し、30人が死亡した。夜間の大雨により大量のごみの堆積が崩落し、近くのテントや簡易住宅を埋めた。ギニア政府は雨季中の危険性を理由に、3日前にこのごみ埋め立て地を閉鎖する計画を発表していた。", "summary_en": "A landslide at a landfill in Conakry, Guinea's capital, killed 30 people early Sunday after heavy overnight rains caused a massive mound of waste to collapse. The disaster buried nearby tents and shacks in the Gbessia commune, with rescue operations ongoing. Guinea's government had announced plans to close the landfill just three days prior due to safety concerns during the rainy season.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/several-dead-many-injured-in-a-landslip-triggered-by-heavy-rains-at-a-landfill-in-conakry-guinea/article71382052.ece", "state_media": false, "category": "政治", "full_text": "A landslide at a landfill in Guinea’s capital killed 30 people, the government said on Sunday (August 23, 2026), after heavy rains overnight prompted the collapse of a massive mound of waste that engulfed nearby tents and shacks.\nThe incident occurred at around 2 a.m. (0200 GMT) in the Gbessia commune of Conakry, according to a government statement.\nThe death toll was 30, with six people seriously injured and 16 more lightly injured, the statement said.\nRescue operations were continuing at the site of the landslide, which witnesses said was large enough to bury an apartment building along with more precarious dwellings.\nOne woman, Cire Diallo, told reporters at the scene that her five children were killed. “I have lost all my children. All I can do is put my trust in God,” she said.\nGuinea holds the world’s largest bauxite reserves and richest untapped iron ore deposit at Simandou, where a massive mining project was launched in November. But the West African country has poor infrastructure and widespread poverty, with 3.7 million of its 15.1 million people living on less than $4.20 per day, according to a World Bank report published in April.\nGuinea’s Minister of Territorial Administration, Djenab Toure, announced on Thursday (August 20, 2026) that the government was closing the landfill because of the danger it posed, especially during the ongoing rainy season, and said the waste was to be relocated outside Conakry.\nPublished - August 23, 2026 11:05 pm IST", "translation_ja": "", "vocab": [{"word": "landfill", "definition": "ごみを埋め立てる場所のこと。産業廃棄物や生活ごみを地面に埋めて処分する施設を指します。"}, {"word": "engulfed", "definition": "完全に包み込む、飲み込む、という意味。ここでは崩落したごみが周辺の建物や人々を完全に覆ったことを表しています。"}, {"word": "precarious", "definition": "危険で不安定な、という意味の形容詞。ここではごみ埋め立て地の近くの不安定で危険な住居のことを指しています。"}, {"word": "bauxite reserves", "definition": "ボーキサイト資源のこと。ボーキサイトはアルミニウムの主要な鉱石で、ギニアが世界最大の埋蔵量を保有しています。"}, {"word": "infrastructure", "definition": "インフラストラクチャー、基盤施設のこと。道路、橋、電力網など、社会経済活動を支える基本的な施設を指します。"}, {"word": "relocation", "definition": "移転、再配置という意味。ここではコナクリの外にごみを移動させることを指しています。"}]}, {"title_ja": "インドネシア警察が森林火災の疑いで72人を逮捕", "title_en": "Indonesian Police Arrest 72 Suspects in Forest Fire Investigation", "summary_ja": "インドネシア警察は、インドネシア中部および西部に危険な煙をもたらす森林火災と泥炭地火災を意図的に開始した疑いで72人を逮捕しました。逮捕はボルネオとスマトラの89件の火災事件に関連しており、調査官は企業が土地開拓に資金を提供したかどうかを調査しています。プラボウォ大統領は火災との戦いのための政府資源を誓約し、責任のある企業を説明責任に問うことを誓いました。", "summary_en": "Indonesian police arrested 72 people suspected of deliberately starting forest and peatland fires that have created hazardous smoke across central and western Indonesia. The arrests are connected to 89 fire cases across Borneo and Sumatra, with investigators examining whether companies financed the land clearing operations. President Prabowo Subianto pledged government resources to combat the fires and vowed to hold accountable any companies found responsible.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/indonesian-police-arrest-72-people-suspected-of-starting-forest-fires/article71382001.ece", "state_media": false, "category": "経済", "full_text": "Indonesianpolice on Sunday (August 23, 2026) arrested 72 people suspected of starting some of the recent forest and peatland fires as huge blazes in central and western parts of the country triggered a harmful cloud known as a choking haze.\nIndonesia has been battling fires driven by an intensifying El Nino pattern and a prolonged dry season, generating dense smoke that crossed into Malaysia, according to Indonesia's National Disaster Management Agency, or BNPB.\nFires are a regular problem in the country and often strain relations with neighbours.\nPlantation owners and traditional farmers often start fires to clear land for farming, said Mohammad Irhamni, director of special crimes at the National Police's Criminal Investigation Agency.\nThe arson suspects were being investigated in connection with 89 forest and land fire cases across five provinces on the island of Borneo and four on Sumatra, Mr. Irhamni said.\nHe said most of the suspects were accused of deliberately burning land to clear areas for plantations at lower cost. Investigators were still tracing financial records to determine whether companies financed or ordered the land clearing, signalling the probe could expand beyond those arrested.\n“We will not stop at the perpetrators on the ground,” Mr. Irhami said in a news conference Sunday (August 23) in the capital, Jakarta. “We will determine who benefited from these activities and who was ultimately behind them.” The suspects face charges that carry penalties ranging from hefty fines to prison terms of up to 15 years, he said.\nIndonesian President Prabowo Subianto flew on Saturday (August 22) to Central Kalimantan province, where more than 7,600 hectares (18,700 acres) have burned, to encourage authorities to get the haze cloud under control.\nMr. Prabowo promised government resources required to contain the fires, including helicopters and water pumps, and vowed to hold accountable any companies found to have contributed to the fires.\n“I hope we can control this soon,” Mr. Prabowo said during the visit. “We have experienced worse forest and land fires in the past, and we were able to overcome them.”\nAccompanying the President was Prasetyo Hadi, the head of the State Secretariat. He said at least four companies in West Kalimantan province are under investigation for allegedly using fire to clear land. If they are proven to have intentionally set the fires, they could face sanctions, including the revocation of their operating permits, he added.\nSmoke from the fires on Sunday (August 23) blanketed parts of Borneo, the world's third-largest island shared by Indonesia, Malaysia and Brunei. Indonesia administers about three-quarters of the island, where the country's Environment Ministry recorded more than 3,700 hot spots on Sunday.\nBNPB chief Mr. Suharyanto said fire activity had increased in West, Central and South Kalimantan provinces on Borneo, where many blazes worsen due to peatlands, prolonging the dangerous haze in several areas.\nFires that appear \"extinguished on the surface may still contain embers underneath, so sufficient rainfall is crucial to rewet the peat and fully suppress the fires,” said Mr. Suharyanto, who, like many Indonesians, uses a single name.\nThe western island of South Sumatra also battled fires, with more than 1,700 hot spots detected on Sunday (August 23), causing a choked haze cloud and reducing visibility to only 10 metres (33 feet) in some areas, the ministry said.\nCloud-seeding resumed over Kalimantan on Sunday, with 30 helicopters for water-bombing and aerial patrol missions, and another 22 helicopters covering Sumatra.\nMeanwhile, Malaysia has suffered severe smoke from the fires, with its eastern state of Sarawak among the hardest hit. One district recorded “very unhealthy” air quality on Friday (August 21), while eight others posted unhealthy readings, prompting the closure of nearly 600 schools and affecting about 200,000 students, the Sarawak government said.\nPublished - August 23, 2026 10:26 pm IST", "translation_ja": "", "vocab": [{"word": "arson", "definition": "放火のこと。意図的に他人または自分の財産に火をつける犯罪行為を指します。"}, {"word": "peatland", "definition": "泥炭地のこと。泥炭（ピート）が堆積した湿地帯で、火災が長引きやすく消火が困難です。"}, {"word": "perpetrator", "definition": "犯人、容疑者のこと。犯罪や違法行為を実行した人を指す法律用語です。"}, {"word": "haze", "definition": "霞やもやのこと。大気中に微粒子が浮遊して視界が悪くなる現象を指します。"}, {"word": "trajectory", "definition": "軌跡、進路のこと。物体や事象が移動する経路や方向を示します。"}, {"word": "revocation", "definition": "取り消し、失効のこと。許可やライセンスなどを公式に取り消す行為を指します。"}]}, {"title_ja": "米国の最後通告がカナダの他国との取引を制限していた可能性、首相が説明", "title_en": "Last-second U.S. demands would have restricted Canadian deals with other nations", "summary_ja": "カナダの首相は、交渉の最終段階で米国が行った要求により、カナダが他国との通商協定を締結する能力が制限されていた可能性があると説明した。首相は、これらの要求は受け入れられず、カナダの国際商取引における主権を損なわせるものだったと示唆している。", "summary_en": "Prime Minister explains that the United States made eleventh-hour demands during negotiations that would have limited Canada's ability to conduct trade agreements with other countries. The PM suggests these demands were unacceptable and would have undermined Canadian sovereignty in international commerce.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiuAJBVV95cUxNVndoVnNTTFcwM3hITWVhbnJ2WjhmZHJZS2JwMDdfVzhySHRSWVZ3aDZQMTYxTUtwLTZrVm5XaXJvX3hzM3AyXzdyWUtIOS12enA1Zmw0cWh4U n Crash Involving Federal University Registrar's Vehicle", "summary_ja": "ニジェール州の道路で、ミンナ連邦工科大学の新任登録官が運転する車がタイヤバーストを起こし、商用バイク運転手と運賃を交渉中の女性に衝突し、女性が死亡、2人が負傷した。この事件はニジェール州における致命的な交通事故の頻発を浮き彫りにしている。", "summary_en": "A woman died and two others were injured when a car driven by the newly appointed registrar of Federal University of Technology, Minna suffered a tyre burst on a road in Niger State. The vehicle veered off and struck the woman who was negotiating a motorcycle fare with a commercial rider. The incident highlights recurring fatal road accidents in Niger State.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/north-central/904995-woman-dies-as-varsity-registrars-car-crashes.html", "state_media": false, "category": "社会", "full_text": "A woman has died while two other persons are receiving treatment following a road crash along IET New Horizons Road in the Old Airport Quarters area of Minna, Niger State.\nThe crash occurred when a vehicle reportedly driven by the Registrar of the Federal University of Technology, Minna, Danladi Mallam, suffered a tyre burst while in motion.\nAccording to eyewitness accounts, the vehicle lost control and veered off, hitting a woman standing beside a commercial motorcyclist.\nThe woman was reportedly negotiating the fare for a trip with the motorcyclist when the vehicle crashed into them.\nThe registrar’s brother was also in the vehicle when the incident occurred.\nResidents and other eyewitnesses at the scene assisted in evacuating the victims to a nearby Primary Health Care Centre in Old Airport Quarters for emergency treatment.\nThe woman was later confirmed dead at the health facility, while two other victims are still receiving treatment.\nThe university announced Mallam’s appointment as its seventh substantive registrar in January 2025, following approval by its Governing Council.\nThe latest crash comes amid recurring fatal road accidents in Niger State.\nIn June, five people were confirmed dead and eight others critically injured in a crash involving a passenger trailer and a tanker in Agaie.\nThe National Emergency Management Agency said the crash occurred after a trailer attempting to avoid a faulty tanker stationed on the road lost control.\nEarlier, in February 2025, 12 people were killed in a collision between a passenger bus and a trailer at Nami village along the Lapai-Agaie road.\nREAD ALSO: Nine die in crash on Bida-Kutigi-Mokwa road\nThe Federal Road Safety Corps confirmed the fatalities and said the cause of the crash was being investigated.\nAlso in January 2025, eight farmers were killed in a collision involving a Toyota Corolla and a tanker trailer on the Batati-Lanle road in Lavun Local Government Area. The crash reportedly occurred when the car attempted to overtake another vehicle.\nThese incidents have continued to raise concerns over speeding, dangerous overtaking, vehicle roadworthiness and other factors contributing to fatal crashes on Niger State roads.\nAuthorities are expected to investigate the latest incident and establish the circumstances that led to the death of the woman and the injuries sustained by the other victims.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "tyre burst", "definition": "タイヤが急に破裂すること。走行中に突然空気が抜け、車両の制御が失われる危険な状況を指す。"}, {"word": "veered off", "definition": "予定の進路から急に逸脱すること。車両が予想外の方向に向かうことを意味する。"}, {"word": "fatalities", "definition": "死亡事故や死者を指す公式な用語。特に複数の死亡者がいる事故の統計報告で使用される。"}, {"word": "substantive", "definition": "正式な、本当の、実質的なという意味。ここでは暫定的でなく正式に任命された職位を指す。"}, {"word": "roadworthiness", "definition": "車両が安全に走行できる状態にあること。定期検査に合格し、法的に走行可能な自動車の状態を意味する。"}]}, {"title_ja": "信仰の記事：神の盲目の僕たち（第2部）", "title_en": "Article of Faith: The Blind Servants of God (2)", "summary_ja": "この精神的評論は、世俗的な知恵が神の真理の理解を妨げるという精神的な盲目性のパラドックスを探求しています。著者は、プライドがいかに心を盲目にするかについて議論し、自分たちの無知を認識することができない人々を調べ、イザヤが真に見ることを拒否する人々を精神的に盲目にする
