という預言者への使命を検証しています。", "summary_en": "This spiritual commentary explores the paradox of spiritual blindness, arguing that worldly wisdom prevents understanding of God's truth. The author discusses how pride blinds hearts, making people unable to recognize their own ignorance, and examines Isaiah's mandate to prophets to spiritually blind those who refuse to truly see.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/904992-article-of-faith-the-blind-servants-of-god-2-by-femi-aribisala.html", "state_media": false, "category": "社会", "full_text": "Our final destination is to be exactly like Christ.\nI did not know how ignorant I was until I met the Lord. I did not know that people go to university to become even more ignorant.\nGod says:\n“I will destroy the wisdom of the wise, and bring to nothing the understanding of the prudent.” Where is the wise? Where is the scribe? Where is the disputer of this age? Has not God made foolish the wisdom of this world? For since, in the wisdom of God, the world through wisdom did not know God, it pleased God through the foolishness of the message preached to save those who believe. For Jews request a sign, and Greeks seek after wisdom; but we preach Christ crucified, to the Jews a stumbling block and to the Greeks foolishness, but to those who are called, both Jews and Greeks, Christ the power of God and the wisdom of God. Because the foolishness of God is wiser than men, and the weakness of God is stronger than men.” (1 Corinthians 1:19-25).\nIrrelevant Knowledge\nBoth the literate and the illiterate (the educated and the uneducated) read the Bible, and they do not understand what they read. Isaiah says:\n“The whole vision has become to you like the words of a book that is sealed, which men deliver to one who is literate, saying, “Read this, please.” And he says, “I cannot, for it is sealed.” Then the book is delivered to one who is illiterate, saying, “Read this, please.” And he says, “I am not literate.” (Isaiah 29:11-13)\nTherefore, Jesus came to open the eyes of the blind. The blind, of course, refers to all mankind. But before He can open our eyes, we need first to admit that we cannot see.\nJesus says:\n“For judgment I have come into this world, that those who do not see may see, and that those who see may be made blind.” Then some of the Pharisees who were with Him heard these words, and said to Him, “Are we blind also?” Jesus said to them, “If you were blind, you would have no sin; but now you say, ‘We see.’ Therefore your sin remains.” (John 9:39-41).\nActually, the blind can see. Blind Bartimaeus could see. God says to Isaiah:\n“Bring out the blind people who have eyes, and the deaf who have ears.” (Isaiah 43:8).\nPride Blinds the Inner Eye\nPride is the most dangerous sin of all. It blinds the hearts of men. Proud people think they can finesse God. Because they do not know they are suffering from blindness, they think they can outsmart God.\nIsaiah says:\n“Woe to those who seek deep to hide their counsel far from the Lord, and their works are in the dark; they say, “Who sees us?” and, “Who knows us?” Surely you have things turned around! Shall the potter be esteemed as the clay; for shall the thing made say of him who made it, “He did not make me”? Or shall the thing formed say of him who formed it, “He has no understanding.” (Isaiah 29:15-16).\n“Therefore the Lord said: “Inasmuch as these people draw near with their mouths and honour Me with their lips, but have removed their hearts far from Me, and their fear toward Me is taught by the commandment of men, therefore, behold, I will again do a marvelous work among this people, a marvelous work and a wonder; for the wisdom of their wise men shall perish, and the understanding of their prudent men shall be hidden.” (Isaiah 29:13-14).\nMandate to Blind People\nGod’s prophetic mandate to Isaiah is to make people blind.\n“I heard the voice of the Lord, saying: “Whom shall I send, and who will go for Us?” Then I said, “Here am I! Send me.” And He said, “Go, and tell this people: keep on hearing, but do not understand; keep on seeing, but do not perceive.’ “Make the heart of this people dull, and their ears heavy, and shut their eyes; lest they see with their eyes, and hear with their ears, and understand with their heart, and return and be healed.” Then I said, “Lord, how long?” And He answered: “Until the cities are laid waste and without inhabitant, the houses are without a man, the land is utterly desolate.” (Isaiah 6:8-11).\nBut the irony here is that the prophets called to make people blind are also blind. Isaiah himself says:\n“Pause and wonder! Blind yourselves and be blind! They are drunk, but not with wine; they stagger, but not with intoxicating drink. 10 For the Lord has poured out on you the spirit of deep sleep, and has closed your eyes, namely, the prophets; and He has covered your heads, namely, the seers.” (Isaiah 29:9-10).\nPause and wonder because, although they blind themselves, they do not know they are responsible for their own blindness. Their drunkenness is both self-induced and the judgment of God. As a result, we say a man is blessed when he might actually be under God’s curse.\n“Hey, I just bought a Lamborghini.”\n“Wow, you are blessed o.”\n“So now we call the proud blessed, for those who do wickedness are raised up.” (Malachi 3:15).\nSpiritual drunkenness sends us into a deep sleep. When we are drunk with wine, we can sleep it off. We wake up and are no longer drunk. Not so with spiritual drunkenness. With spiritual drunkenness, we are asleep even when we ", "translation_ja": "", "vocab": [{"word": "prudent", "definition": "慎重で分別のある。将来の結果を考慮して賢い判断を下す人、または行動を指します。"}, {"word": "finesse", "definition": "巧妙さや技巧を使って問題を回避する。または繊細な処理方法を意味します。"}, {"word": "irony", "definition": "期待と実際の結果が相反する状況。または言葉の表面的な意味と実際の意図が反対のことです。"}, {"word": "dull", "definition": "知覚や感受性が鈍い状態。ここでは精神的な理解力が低下することを意味します。"}, {"word": "mandate", "definition": "権限者から与えられた公式な命令または権限。宗教的文脈では神からの使命を指します。"}, {"word": "desolate", "definition": "人が住んでいない、または荒廃した状態。ここでは都市が完全に破壊された状況を表します。"}]}, {"title_ja": "ニジェール州ビダ・クティギ・モクワ道路での衝突事故で9人が死亡", "title_en": "Nine Dead in Road Collision on Bida-Kutigi-Mokwa Highway in Niger State", "summary_ja": "日曜日、ニジェール州のランレとシャバ・ウォロ地域間のビダ・クティギ・モクワ道路で、マツダ車がシエナミニバスと衝突し、少なくとも9人が死亡した。マツダ車がブラインドコーナーに進入した時に事故が発生し、複数の被害者が負傷して医療治療を受けた。地元の住民は、この道路を走行するドライバーに注意を呼びかけ、長距離運転中の十分な休息を求めている。", "summary_en": "At least nine people died in a crash on Sunday between Lanle and Shaba Woro communities in Niger State when a Mazda vehicle collided with a Sienna minibus on the Bida-Kutigi-Mokwa road. The accident occurred when the Mazda entered a blind corner, with several other victims sustaining injuries and receiving medical treatment. Local residents have called for increased caution among motorists traveling the route and adequate rest during long-distance journeys.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/north-central/904990-nine-die-in-crash-on-bida-kutigi-mokwa-road.html", "state_media": false, "category": "社会", "full_text": "At least nine people have reportedly died in a road crash on the Bida-Kutigi-Mokwa road in Niger State.\nThe crash occurred in the early hours of Sunday between Lanle and Shaba Woro communities.\nAccording to eyewitness accounts, the accident involved a Mazda vehicle travelling from Minna towards Mokwa and a Sienna vehicle reportedly travelling from Lagos to Minna.\nThe two vehicles reportedly collided after the Mazda entered a blind corner.\nAn eyewitness told reporters that nine bodies were seen at the accident scene, while several other victims sustained varying injuries.\nResponders took the injured to nearby hospitals for medical attention.\nREAD ALSO: Woman dies as car crashes into building in Lagos\nA resident of the area, Sachi Isah, urged motorists plying the route to exercise caution, particularly when approaching bends and other dangerous sections of the road.\nMr Isah also advised drivers embarking on long journeys to rest adequately after travelling several kilometres before continuing their trips.\nHe said such measures would help reduce avoidable crashes and loss of lives on the highway.\nAs of the time of filing this report, there was no official statement from the police, the Federal Road Safety Corps or other relevant authorities confirming the number of casualties or the circumstances surrounding the crash.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "blind corner", "definition": "見通しが悪く、対向車や障害物が見えない道路のカーブのこと。交通事故のリスクが高い危険な箇所を指します。"}, {"word": "collision", "definition": "二つ以上の物体が激しくぶつかることを意味します。特に車両同士の衝突事故を指す際に使用される正式用語です。"}, {"word": "casualties", "definition": "事故や災害によって死亡または負傷した人々の総数を指します。公式統計やレポートでよく使われる用語です。"}, {"word": "eyewitness accounts", "definition": "事件や事故を直接目撃した人の証言や説明のこと。ニュース報道や調査において重要な情報源となります。"}, {"word": "responders", "definition": "緊急事態に対応する専門家チーム、例えば救急車のスタッフや救助隊員を指します。"}, {"word": "plying", "definition": "定期的に同じ道路や航路を往来すること。特にバス、タクシー、船舶などが繰り返し移動する場合に使います。"}]}, {"title_ja": "ラテンアメリカの右派指導者、隣国の選挙に公然と介入", "title_en": "Latin American Right-Wing Leaders Openly Intervene in Each Other's Elections", "summary_ja": "ラテンアメリカの新世代の右派指導者たちがトランプ前大統領の手法に倣い、国境を越えて同盟者を公然と支持し、対立候補を攻撃している。これらの指導者は「ウォークイズム」への批判とともに、隣国の選挙結果に影響を与えようとしている。保守派指導者たちが政治的メッセージングを協力して進める傾向が強まっている。", "summary_en": "A new generation of right-wing leaders in Latin America are following Donald Trump's example by openly endorsing allies and attacking opponents across borders during elections. These leaders are using cheers, endorsements, and criticism of \"wokismo\" to influence electoral outcomes in neighboring countries. The trend marks a significant shift in regional politics as conservative figures increasingly coordinate their political messaging.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/23/world/americas/latin-america-leaders-trump.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン、トランプ経済政策への参加をペルシャ湾岸諸国に警告", "title_en": "Iran Warns Gulf States Against Joining Trump's Economic Pressure Campaign", "summary_ja": "イランの強硬派安全保障顧問モフセン・レザイは、トランプ政権の経済政策に同調した場合、地域からの石油輸出を阻止すると警告した。この威嚇は、米国とイラン間の地政学的緊張が高まる中での地域紛争の激化を示している。", "summary_en": "Iran's new hard-line national security adviser Mohsen Rezaei has issued a stark warning to neighboring Gulf states, vowing to prevent oil exports from the region if they align with the Trump administration's economic policies. The threat represents an escalation in regional tensions amid broader geopolitical tensions between Iran and the United States.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/23/world/europe/iran-economy-war-united-states.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ゼレンスキー大統領、前国防相の選挙実施要求を否定", "title_en": "Zelensky Defends Against Ex-Defense Minister's Election Call", "summary_ja": "ウクライナのゼレンスキー大統領は、ロシアとの戦争中の選挙実施を求める前国防相の主張を退けた。ゼレンスキーは、戦時中の選挙実施は国を分裂させ、国家の団結を損なわせるという従来の立場を改めて表明した。", "summary_en": "Ukrainian President Volodymyr Zelensky rejected calls from his former defense minister to hold elections during the ongoing war with Russia. Zelensky maintained his position that conducting elections amid active conflict would destabilize the country and undermine national unity.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/23/world/europe/ukraine-zelensky-fedorov-elections.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事地帯を開放、パレスチナ人がガザ北部への帰還開始", "title_en": "Palestinians Return to Northern Gaza After Israel Opens Military Crossing", "summary_ja": "イスラエルは人質解放交渉の膠着状態が打開されたことを受け、ガザを二分する軍事地帯の通過をパレスチナ人難民に許可した。この通路の再開は、イスラエルとパレスチナ当局間の長期にわたる対立の後の大きな転換を意味している。数千人のガザ住民がエンクレーブの北部にある自宅への帰還が可能になった。", "summary_en": "Israel has allowed displaced Palestinians to begin crossing through a military zone that divides Gaza following a breakthrough in hostage release negotiations. The reopening of the crossing marks a significant shift after a prolonged deadlock between Israeli and Palestinian authorities. Thousands of Gazans are now able to return to their homes in the northern part of the enclave.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "Major China Property Developer Reports Huge Loss Amid Real Estate Crisis", "summary_ja": "中国の大手不動産開発企業であるワンケが巨額の赤字を報告し、国内の不動産危機が深刻化していることを示唆している。同社の経営難は、業界全体への悪影響の拡大懸念を高めている。中国政府が苦境にある不動産市場の安定化に介入するかどうかが注目されている。", "summary_en": "Vanke, one of China's leading property developers, has reported significant losses, signaling a deepening real estate crisis in the country. The company's financial troubles raise concerns about the potential spread of the downturn across the sector. Questions remain about whether the Chinese government will intervene to stabilize the struggling property market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による弾片が体内に残存", "title_en": "Freed Israeli Hostages Carry Shrapnel Wounds From October 7 Attack", "summary_ja": "イスラエルの医療当局者によると、8ヶ月間捕虜として拘束されていたイスラエル人人質が最近解放されたが、10月7日の攻撃による弾片が体内に埋め込まれたままの状態である。一部の女性人質は長期間隔離され、捕虜期間中ずっと地下トンネルに閉じ込められていた。", "summary_en": "Recently freed Israeli hostages who were held captive for eight months still have shrapnel embedded in their bodies from the October 7 attack, according to Israeli medical officials. Some of the women hostages were held in isolation for extended periods and confined to underground tunnels throughout their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "迎撃ミサイルが枯渇した場合の危機", "title_en": "The Interceptor Missile Shortage Crisis", "summary_ja": "ウクライナを含む多くの国が迎撃ミサイルの深刻な不足に直面している。供給が枯渇するにつれ、防空能力への懸念が高まり、これらの重要な兵器システムの戦略的影響が緊迫してきている。", "summary_en": "Ukraine and other nations face a critical shortage of interceptor missiles, raising alarm about air defense capabilities. As supplies dwindle, the military and strategic implications of running out of these essential weapons systems are becoming increasingly urgent.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エコノミスト、パーソナライズされた新しいニュースレターを導入", "title_en": "The Economist Launches Personalized Newsletter Service", "summary_ja": "エコノミスト誌は、購読者の受信箱に直接カスタマイズされた記事リストを配信する新しいパーソナライズドニュースレター「The Economist for You」を導入しました。このサービスは個別の好みと関心に基づいてコンテンツを調整し、各ユーザーの読書体験を向上させます。", "summary_en": "The Economist has introduced a new personalized newsletter called 'The Economist for You' that delivers customized reading lists directly to subscribers' inboxes. The service tailors content based on individual preferences and interests, enhancing the reading experience for each user.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/introducing-our-latest-newsletter-the-economist-for-you", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブームがアメリカの慈善活動を再編成", "title_en": "Silicon Valley's AI Boom Is Remaking American Charity", "summary_ja": "シリコンバレーのAI企業創業者らが、慈善事業に数千億ドルの寄付を誓約しており、これは慈善事業資金に大きなシフトをもたらしている。この記事では、これらの莫大な約束がどのように配分され、慈善の景観にどのような影響を与えるかを検討している。", "summary_en": "AI founders in Silicon Valley have pledged to donate hundreds of billions of dollars to charitable causes, signaling a major shift in philanthropic funding. The article examines how these massive commitments will be allocated and what impact they may have on the charitable landscape.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル・トルコ間の緊張がネタニャフとエルドアンの個人的・戦略的対立を露呈", "title_en": "Israel-Turkey tensions expose personal, strategic rivalry between Netanyahu and Erdogan", "summary_ja": "東地中海の主要軍事大国であるイスラエルとトルコは、ネタニャフとエルドアンの指導下で緊張が高まっている。ガザの将来からシリアの動向まで複数の争点をめぐる紛争があり、過去3年間にわたり複数の戦略的前線で関係が悪化していることを反映している。", "summary_en": "Israel and Turkey, two major military powers in the eastern Mediterranean, face escalating tensions under the leadership of Netanyahu and Erdogan. Disputes span multiple issues including Gaza's future and developments in Syria, reflecting deteriorating relations across several strategic fronts over the past three years.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/23/israel-turkey-tensions-expose-personal-strategic-rivalry-between-netanyahu-and-erdogan_6756779_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国高等教育危機：コスト上昇と不信感が募る中、閉校が相次ぐ", "title_en": "US Higher Education Crisis: Closures Surge as Costs and Distrust Mount", "summary_ja": "2025年に債務を理由に約15の米国大学が閉校し、2024年の40校に続く危機的状況が続いている。高等教育部門は政府資金の削減、入学者数の減少、学位の価値についての懐疑の増加という複数の圧力に直面している。若い世代の多くが、高騰する学費に見合う技能教育が得られるかどうかに疑問を抱いている。", "summary_en": "Around 15 US colleges closed in 2025 due to debt, following 40 closures in 2024, reflecting a broader crisis in higher education. The sector faces mounting pressures from reduced government funding, declining enrollment, and growing skepticism about the value of academic degrees. Young people increasingly question whether the skills taught justify the soaring costs of attendance.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/23/unprecedented-crisis-grips-us-colleges-squeezed-by-soaring-costs-and-trump-fuelled-distrust_6756773_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ゼレンスキー大統領、ロシアとの戦闘中の選挙実施は危険と主張", "title_en": "Zelensky Says Elections Too Risky While Ukraine Fights Russia", "summary_ja": "ウクライナのゼレンスキー大統領は、ロシアとの戦争中に選挙を実施することは「津波」のようであり、同国を不安定にするとして、選挙開催の呼びかけを拒否した。この声明は、罷免された前国防相が戦闘継続中の投票実施を求める圧力に対抗するものである。", "summary_en": "President Volodymyr Zelensky has rejected calls to hold elections during the ongoing war with Russia, describing the electoral process as 'a tsunami' that would destabilize Ukraine. The statement pushes back against pressure from his ousted former defense minister to organize a vote while the country remains engaged in military conflict.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/23/zelensky-says-elections-too-risky-while-ukraine-fights-russia_6756776_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の更新", "title_en": "Mindef Updates", "summary_ja": "国防省がストレーツ・タイムズを通じて情報を発表しました。購読者は提供されたリンクを通じてニュースレターの設定を管理できます。ストレーツ・タイムズのニュースレターサービスを通じて、より多くの更新情報が利用可能です。", "summary_en": "The Ministry of Defence has released information through The Straits Times. Subscribers can manage their newsletter preferences through the provided links. More updates are available through The Straits Times newsletter service.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートニュースレターは、毎日のニュースブリーフィングと最新情報を提供しています。読者はサブスクリプション設定を管理でき、ストレーツ・タイムズの追加の無料ニュースレターに登録することができます。", "summary_en": "The Straits Times Evening Update newsletter provides daily news briefings and updates. Readers can manage their subscription preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズが主要なニュースと最新情報を読者に提供する日刊のモーニングブリーフィングニュースレターを配信しています。購読者は設定を管理し、同紙の追加の無料ニュースレターにサインアップできます。", "summary_en": "The Straits Times delivers its daily Morning Briefing newsletter to keep readers informed on key news and updates. Subscribers can manage their preferences and sign up for additional free newsletters from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英仏の元外交官100人以上がイスラエルへの制裁を要求", "title_en": "Over 100 Former British and French Diplomats Call for Sanctions on Israel", "summary_ja": "英国とフランスの退職外交官100人以上がイスラエルに対する包括的な制裁の実施を求める声明を発表した。退職した外交官らは、継続的な懸念に対処するためにこのような措置が必要だと主張している。この声明は、ベテラン外交官による重要な介入を示すものである。", "summary_en": "More than 100 retired diplomats from Britain and France have issued a call for comprehensive sanctions against Israel. The former officials argue that such measures are necessary to address ongoing concerns. The statement represents a significant intervention by veteran foreign service professionals.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxNcUhWazEwcUpwdDhmelcta0psLVB4emlkVFpJR1JpaEg4VkRvNHg1eUVkNWNjYW1ZQ2U2eGttSV9uWXJVdi1TR2NFRkVtOS0zSHBldkxhU3NaaHhoRHdycGlXVHN4VUx5WEY0Z0Ixd0xOMTVIWnJ3TnRfWUxPaG8zdmxhMTV0WHhWZkNza2ZzLUZ2R2dkMHF3dHhIVlNYd0lOb29NbkdPTHpKZTFESGxxTDJNUmhXUDNpU0pQZHJRR2NlTFJjQWpfN2xqSy1hOUFVcy02MUowYk13N3JRR1d0U2REUTh0STdlend4WlZ0NUh2QWdTWXIxejV2b1oycVdlMEFGdFpmZ1RoNzA?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "IDF西岸地区警察計画、入植者の自由な建設を可能にすることが目的", "title_en": "IDF Plan to Increase West Bank Policing Aims to Enable Settler Construction", "summary_ja": "IDF筋によると、ヨルダン川西岸の新しい警察戦略はイスラエル人入植者による無制限の建設を促進するために設計されている。この計画は、入植地拡大が最小限の妨害で進行することを可能にするセキュリティ作戦を優先することが報告されている。この進展は、占領下のパレスチナ領土におけるイスラエル入植政策の実施について懸念を引き起こしている。", "summary_en": "According to IDF sources, a new policing strategy in the West Bank is designed to facilitate unrestricted building by Israeli settlers. The plan reportedly prioritizes security operations that would allow settlement expansion to proceed with minimal obstruction. The development raises concerns about the implementation of Israeli settlement policies in occupied Palestinian territories.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiAJBVV95cUxNdjdBV2hNRXpQc1JwYkJ5YTI3Y0haUkpyYmlTYVhPQW1FOUNSRkRQQUFFVnctVFpUYVMxRkVJamFwMS1yM2duOGV1S1k5bWczQWdtU1FOWDFoaDF3cEtka09EUlpXWnNrbi14YzhQNHcybmJkNnh0bHlhYXZ0RjFnaUYtcVNDVVZEdDFRV0RMbkoxT29WNmtrV0FJVUhlT0F3X2pESEVyS1RKZ0ZkREF5Q1dlUzRiZm1jS1lmT1AyNE9Odk5tWFlWZnBVTjBNMVZjTGJvcExoc3djNm5jREI4bWszSlk3QWNweGY0MWNIaFFOcERVcFJkcVpFblVHbW5VZUZ2R19fd1o?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相、イスラエルをトルコとの無意味な対立へ導く", "title_en": "Netanyahu Dragging Israel Into Pointless Confrontation With Turkey", "summary_ja": "ハアレツ紙の社説では、ネタニヤフ首相がトルコとの緊張を不必要に高めていることを批判している。この見解では、こうした対立は戦略的価値がなく、イスラエルの地域関係をさらに不安定にするリスクがあると主張している。", "summary_en": "An editorial from Haaretz criticizes Prime Minister Netanyahu for escalating tensions with Turkey unnecessarily. The opinion piece argues that this confrontation serves no strategic purpose and risks further destabilizing Israel's regional relationships.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilAJBVV95cUxQN0xFSlpGd3RVTnNZdUlhb053Rm5OdDAwX1UzaXRqQzV2YU90M3NEa2g0YnlIeTlmRmN0RTdROFdpZzh1WVhMUUJabldaamJZX0ZmTTcxRDE5RWpUV0E5LVZBb0hfS2N4QzNMeTgzVHhjS04taWNlcF9vM2t1V285NUhHRFctRXVHWmc5TzRoVE5nSmR1NGV3UkwzdXNfSkdDeDl3UGVVMVdvM2lYa2ZZa3YzUFQ2aURWZWF2U3hEM0VBTzYxQWFYZXRXZm1rS3A2b21rTTF5Q0lPSGxRM0t1a0lXcGxSMDZpM09CbERxOF95V25TWlR6Q09BQ0ZHYjFxQmkyMjl2WEYwdVJiSVpOVUJMcXg?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、リピーター外国人観光客にNT$5,000の旅行クレジットを提供", "title_en": "Taiwan Offers NT$5,000 Travel Credits to Repeat Foreign Visitors", "summary_ja": "台湾は、以前同国を訪問したことのある外国人観光客にNT$5,000の旅行クレジットを提供する新しいインセンティブプログラムを開始しています。このイニシアティブは、リピート観光を促進し、宿泊施設、飲食、アトラクションの割引でロイヤル訪問者に報いることで、観光業を活性化することを目指しています。", "summary_en": "Taiwan is launching a new incentive program offering NT$5,000 travel credits to foreign visitors who have previously visited the country. The initiative aims to encourage repeat tourism and boost the travel industry by rewarding loyal visitors with discounts on accommodations, dining, and attractions.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBqZW1qU05BalBGUDVYYkhFNGtMMkZRaExEaGdaYXFPc0RDUTNKUV9odzk1a242T0Vlc3pNRmJxb3dhUk1WS1h5dWhXME1mQmEwb2tTZkNB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "最初の2機のF-16V戦闘機、台湾に向けて輸送中", "title_en": "First two F-16V fighter jets en route to Taiwan", "summary_ja": "Focus Taiwanの報道によると、台湾が最初の2機のF-16V戦闘機を受け取ることになった。この最新鋭機は地域の緊張が続く中で、台湾の防衛能力の大幅な強化を意味している。", "summary_en": "Taiwan is receiving its first two F-16V fighter jets, according to sources cited by Focus Taiwan. The advanced aircraft represent a significant enhancement to Taiwan's defense capabilities amid ongoing regional tensions.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9iLTFXZ0JxaTNsWDJ3SE1YVlFjbHZfdUtZZzJXempfUlA0RVFkN0VQQWRPN2FLeFdKanRpTmhFOFdmN2x4c1VJOUdfbE9UMHJndVlKSnVCaw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フォーカス台湾 - CNA英語ニュース", "title_en": "Focus Taiwan - CNA English News", "summary_ja": "フォーカス台湾は、台湾の公式通信社である中央通信社（CNA）の英語ニュースサービスです。台湾とアジア太平洋地域に関するニュース、イベント、および動向について包括的な報道を提供しています。", "summary_en": "Focus Taiwan is the English news service of the Central News Agency (CNA), Taiwan's official news organization. It provides comprehensive coverage of news, events, and developments related to Taiwan and the Asia-Pacific region.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiO0FVX3lxTE9aU2ljbTc1d0Y3alZIY005T0hWTmZOTGpod3pXQU9zbm4yYjhoOXAzdy1WNGlxemk1bVU0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国とスイス、自由貿易協定アップグレード交渉を完了", "title_en": "China and Switzerland Complete Free Trade Agreement Upgrade Negotiations", "summary_ja": "CGTNによると、中国とスイスは火曜日にアップグレードされた自由貿易協定の交渉を完了し、覚書に署名しました。このアップグレードは、両国間の既存の貿易枠組みの強化を目指しています。CGTNは、このアップグレードが二国間の経済協力と貿易関係を強化することを目的としていると報じています。", "summary_en": "CGTN reports that China and Switzerland have completed negotiations on an upgraded free trade agreement and signed a memorandum of understanding on Thursday. The agreement represents an enhancement to the existing trade framework between the two countries. CGTN states that the upgrade aims to strengthen bilateral economic cooperation and trade relations.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-21/China-Switzerland-reach-agreement-on-an-upgraded-free-trade-deal-1PMqpQQly0w/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI と技術が中国・西アフリカ間のヘルスケア協力を推進", "title_en": "AI and technology drive China-West Africa healthcare cooperation", "summary_ja": "CGTNは、第3回中国・西アフリカ医学サミット・エキスポがガーナの首都アクラで開催されたと報道している。3日間のイベントには、医療専門家、技術企業、業界関係者が参加し、同地域の医療革新と技術進歩に焦点を当てている。", "summary_en": "CGTN reports that the 3rd China-West Africa Medical Summit and Expo has opened in Ghana's capital, Accra. The three-day event brings together healthcare professionals, technology companies and industry stakeholders to focus on medical innovation and technological advancements in the region.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-22/AI-and-technology-drive-China-West-Africa-healthcare-cooperation-1PP0P6cqmhq/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカがナミビア人の遺骨を返還、植民地支配の癒しに向けて", "title_en": "South Africa Returns Namibian Ancestral Remains in Colonial Healing Gesture", "summary_ja": "CGTNは、南アフリカがケープタウンで行われた式典において、ナミビア人84人の祖先の遺骨とアパルトヘイト時代に獄中で死亡した2人の政治犯の遺骨をナミビアに返還したと報じている。CGTNは、この返還は植民地時代の歴史的不正義に対処する動きを示していると報じている。CGTNは、この措置が植民地支配時代の危害に関して隣国との和解に向けた広範な取り組みの一部であると報じている。", "summary_en": "CGTN reports that South Africa has returned the ancestral remains of 84 Namibians and two apartheid-era political prisoners to Namibia in a ceremony held in Cape Town on Wednesday. CGTN reports that the repatriation represents a move toward addressing historical injustices from the colonial period. CGTN reports that the gesture is part of broader efforts to reconcile with neighboring nations over colonial-era harms.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-20/South-Africa-returns-Namibian-remains-in-move-toward-colonial-healing-1PLgYHSjNII/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カザフスタン議会選挙で5政党が5%の閾値を超える — 出口調査", "title_en": "Five parties exceed 5% threshold in Kazakh parliamentary elections — exit polls", "summary_ja": "TASSによると、カザフスタン議会選挙の出口調査で5つの政治政党が議席獲得に必要な5%の閾値を超えたと報じられている。アディレト党が投票の70%以上を獲得したと伝えられている。結果は主要政党への支持の重大な集中を示唆している。", "summary_en": "TASS reports that five political parties have surpassed the 5% threshold to win seats in Kazakhstan's parliament according to exit polls. The Adilet party reportedly secured more than 70% of votes in the election. The results indicate a significant concentration of support around the leading party.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2176723", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランで大規模ガス田を発見", "title_en": "Large Gas Field Discovered in Iran", "summary_ja": "TASS/RTは、イランが天然ガスコンデンセートを含む大規模ガス田を発見したと報じている。この発見は同地域におけるイランの天然ガス埋蔵量の増加につながる。国営メディアは、ガス田の規模と位置に関する詳細は直ちに提供していない。", "summary_en": "TASS/RT reports that Iran has discovered a large gas field containing gas condensate. The discovery adds to Iran's natural gas reserves in the region. Further details about the field's size and location were not immediately provided by the state media outlet.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2176721", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ベラルーシと北朝鮮、近くビザなし渡航協定に署名へ", "title_en": "Belarus and North Korea to Sign Visa-Free Travel Agreement Soon", "summary_ja": "TASSが報じたところによると、ベラルーシの高位外交官は、ミンスクとピョンヤンが近い将来ビザなし渡航協定に署名する予定だと述べた。TASSによれば、協定は実質的に完成しており、数項目の技術的側面の調整のみが残されているという。", "summary_en": "According to TASS, a top Belarusian diplomat stated that Minsk and Pyongyang plan to sign a visa-free travel agreement in the near future. TASS reports that the agreement is substantially complete, with only several technical aspects remaining to be finalized.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2176719", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドルの外側の防衛線が破られた", "title_en": "The Dollar's Outer Defenses Have Been Breached", "summary_ja": "トランプ政権が急落する円を支えるための介入を行うことは、他地域の通貨不安がアメリカの金融安定性を脅かす可能性があるという懸念を反映しており、1960年代の懸念に似ている。財務長官スコット・ベッセントは、米国債利回りの急上昇の中で、マリオ・ドラギの有名な「あらゆる手段を尽くす」という約束を引用し、50～100億ドルの円購入を行う意思を示唆している。", "summary_en": "The Trump administration's intervention to support the falling yen reflects concerns that currency instability elsewhere could threaten US financial stability, reminiscent of 1960s-era fears rather than previous crises. Treasury Secretary Scott Bessent has signaled willingness to purchase $5-10 billion in yen, invoking Mario Draghi's famous commitment to do 'whatever it takes' to stabilize markets amid spiking US bond yields.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/bessent-yen-bond-market-interventions-acts-of-desperation-by-harold-james-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Dollar's Outer Defenses Have Been Breached\nThe puzzle of why the Trump administration is so concerned with a falling yen has historical parallels not to the 1930s or the 1980s, but to the 1960s, when US officials feared that a crisis elsewhere could spread to America. With US bond yields spiking, Treasury Secretary Scott Bessent is getting desperate.\nPRINCETON—In a Reuters photo from late July, US Treasury Secretary Scott Bessent can be seen holding a to-do list with just one item: purchase $5–10 billion worth of yen. As he explained soon thereafter, invoking the famous phrase that then-European Central Bank President Mario Draghi used to save the euro in 2012, the Trump administration will do “whatever it takes” to prop up the Japanese currency.", "translation_ja": "", "vocab": [{"word": "breached", "definition": "防衛線や境界線が突き破られた、または侵害されたことを意味する。外交や軍事、金融など多くの分野で使用される。"}, {"word": "desperately", "definition": "絶望的な状況で、切実な思いで何かをしようとする様子を表す副詞。緊急性が高い状況を強調する。"}, {"word": "invoking", "definition": "権威や先例を引き合いに出して、その力や支援を得ようとすること。法律や歴史的な発言などを根拠として用いる。"}, {"word": "prop up", "definition": "衰退または下落している状況を支える、または維持するための支援を行うという意味の句動詞。"}, {"word": "spiking", "definition": "急激に上昇または増加することを表す。グラフが急上昇する様子を比喩的に表現する動詞。"}, {"word": "parallels", "definition": "類似した状況や事例を指す名詞。歴史的な比較や分析において、複数の共通点がある事象を並置する。"}]}, {"title_ja": "なぜ世界はまだウォール街を必要としているのか", "title_en": "Why the World Still Needs Wall Street", "summary_ja": "米国債務の増加、政治的分極化、不安定な貿易政策など、投資家が米国市場から資金を引き出す理由は多くあるにもかかわらず、大規模な資本流出は起きていない。著者は、他の金融システムが大規模な資本流入を吸収する能力に欠けていることが、金融の多極化よりも地政学的多極化が速く進む理由だと主張している。ドルは依然として世界金融で支配的であり、外国為替準備の半分以上と通貨取引の約90%を占めている。", "summary_en": "Despite compelling reasons for investors to diversify away from the US—including rising debt, political polarization, and unpredictable trade policy—there has been no significant exodus from American markets. The author argues that other financial systems lack the capacity to absorb large capital inflows, causing geopolitical multipolarity to advance faster than financial multipolarity. The dollar remains dominant in global finance, accounting for over half of foreign-exchange reserves and nearly 90% of currency trades.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-financial-and-treasury-markets-still-no-alternative-by-jorge-arbache-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Why the World Still Needs Wall Street\nOutside of the United States, all other financial systems face major constraints on their ability to absorb large financial inflows. That is why geopolitical multipolarity is advancing faster than financial multipolarity, despite the many reasons that investors have to pursue greater diversification.\nBRASÍLIA—Investors have no shortage of reasons to diversify away from the United States. America’s public debt is rising, political polarization is deepening, trade policy has become unpredictable, the rule of law is now in doubt, and financial sanctions have encouraged other governments to seek alternatives to the dollar. Yet there has been no great exodus from US markets. The dollar still accounted for 56.8% of allocated foreign-exchange reserves at the end of 2025, and was used in 89.2% of all foreign-exchange trades surveyed by the Bank for International Settlements.", "translation_ja": "", "vocab": [{"word": "diversify", "definition": "投資やビジネスのリスクを減らすために、複数の異なる対象や地域に資金や活動を分散させることを意味します。"}, {"word": "exodus", "definition": "大量の人々や資本が一度に場所から去ることを指し、特に急速または大規模な移動を強調します。"}, {"word": "multipolarity", "definition": "国際システムにおいて、複数の大国や経済圏が権力や影響力を共有する状態を意味します。"}, {"word": "allocated", "definition": "資源や資金を特定の目的や場所に割り当てることを指し、配分や振り分けを意味します。"}, {"word": "constraints", "definition": "何かを行う能力を制限する要因や障害を指し、制限要因や制約条件を意味します。"}, {"word": "geopolitical", "definition": "国家間の政治的権力が地理的位置と資源に基づいて競争する状況に関わる用語です。"}]}, {"title_ja": "高齢化社会は必ずしも経済の衰退を招かない", "title_en": "Aging Populations Need Not Mean Frailer Economies", "summary_ja": "高齢化社会は経済的衰退を招くという通説に反して、新しい研究は労働力不足が実は投資と労働節約技術の革新を促進し、結果として労働力の減少を補って余りある生産性向上をもたらすことを示唆している。著者は、人口高齢化が必然的に経済停滞につながるという経済学者と政策立案者の広がっている悲観的コンセンサスに異議を唱えている。", "summary_en": "Contrary to conventional wisdom that aging societies face economic decline, new research suggests that labor scarcity actually spurs investment and innovation in labor-saving technologies, ultimately boosting productivity enough to compensate for a smaller workforce. The author challenges the prevailing pessimistic consensus among economists and policymakers that demographic aging inevitably leads to economic stagnation.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/what-economists-get-wrong-about-demographic-change-by-andrew-j-scott-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Aging Populations Need Not Mean Frailer Economies\nGovernments and economists have long viewed demographic aging as a threat to economic growth. But new research finds that labor scarcity encourages investment and shifts innovation toward labor-saving technologies, boosting productivity enough to offset a shrinking workforce.\nOXFORD—The global demographic transition, characterized by declining birth rates and rising life expectancy, has been one of the most consequential transformations of the past century, with population aging fueling a steady stream of gloomy economic forecasts. If academic economists, international organizations, and national governments agree on just one thing, it is that an aging society inevitably leads to economic sclerosis.", "translation_ja": "", "vocab": [{"word": "demographic aging", "definition": "人口の高齢化のこと。出生率の低下と平均寿命の延伸により、社会全体に占める高齢者の割合が増加する現象を指す。"}, {"word": "economic sclerosis", "definition": "経済の硬化・停滞を意味する医学用語の比喩表現。経済成長が停止し、柔軟性を失った状態を表す。"}, {"word": "labor scarcity", "definition": "労働力の不足のこと。労働可能人口が減少し、労働市場で人手が足りない状況を指す。"}, {"word": "innovation", "definition": "技術や製品、ビジネスモデルなどの革新的な改善・開発のこと。新しい価値を生み出す創造的な活動を指す。"}, {"word": "productivity", "definition": "生産性のこと。労働者や資本など生産要素がどれだけ効率的に産出物を生み出しているかを測る指標。"}, {"word": "demographic transition", "definition": "人口転換のこと。高出生率・高死亡率から低出生率・低死亡率への社会の移行過程を指す。"}]}, {"title_ja": "8月のハロウィン：小売業者が季節の自然な秩序を破壊した方法", "title_en": "Halloween in August: How Retailers Have Destroyed the Natural Order of Seasons", "summary_ja": "意見記者のデイブ・シリングは、大手小売業者が8月にハロウィンの装飾品を販売することを批判し、この商業化が従来の季節カレンダーと祝日の自然なリズムを破壊していると主張している。彼は、このトレンドがデータ駆動資本主義と気候変動がいかに季節の区別への結びつきを侵食し、人工的な祝日の無限サイクルへの降伏を強いているかを反映していると示唆している。", "summary_en": "Opinion writer Dave Schilling criticizes major retailers for selling Halloween decorations in August, arguing this commercialization destroys the traditional seasonal calendar and natural rhythm of holidays. He suggests this trend reflects how data-driven capitalism and climate change are eroding our connection to distinct seasons, forcing us to surrender to an endless cycle of artificial celebrations.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/23/halloween-capitalism-climate-change", "state_media": false, "category": "オピニオン", "full_text": "Happy spooky season, everyone! Get those jack-o’-lanterns out, because Halloween is just around the corner!\nJust kidding, no, it’s not.\nIt’s August, for God’s sake. Every day, I wake up to 90F weather – my skin moist with sweat and my eyelids stuck together. I can’t drink coffee on my porch without being consumed by an army of voracious mosquitoes that seem to find my blood to be the most delicious of all.\nAnd it’s not just Los Angeles that’s withering under a summer of discontent. The east coast heatwaves are piling up, sending millions of young people to the absolute last place they want to be: an air-conditioned movie theater. But you want to tell me it’s fine to be putting out Halloween decorations? If I don’t store my giant bag of fun-size Twix in a standup freezer, the whole damn thing will melt into chocolate soup. (Don’t even get me started on recent claims you should eat soup when it’s hot outside. It’d rather slurp up my own sweat from a bowl.)\nWhy am I fuming about this? Even though I love Halloween, I’m mad because our glorious big-box overlords have declared, via careful inventory selection, that Halloween season has begun. In August. I find all of that unacceptable. It feels like a violation of the natural order, a realignment of one of the few glorious constants left in the world. I yearn to go back to the tidy order of holidays, where no two ever cross paths. At most, Halloween celebrations should start in late September. Not a month after Independence Day. I fear those days are done, that our world has irrevocably changed and I need to start getting ready to give in to the new normal.\nI first became aware of Halloween’s creep into the summer during a recent sundries run at Target. There are costumes, life-size skeletons, treats and various decorations on offer in-store. I’ve seen massive candy bags positioned to move at CVS. There’s even a smattering of greeting cards, which I find doubly frustrating, as I’ve never in my life considered buying someone a card for Halloween, a holiday that most adults spend binge drinking or squeezing into provocative outfits. What does a Halloween greeting card even say? “I Boo-lieve You Should Get an Uber Home”? “Have a Spooktacular One-Night Stand With Your Marginally Attractive Co-Worker”?\nOn that Target outing, my friend Halle (an admitted Halloween pervert) bought a miniature cauldron from the growing, metastasizing spooky section. I asked what she expected to do with such a trivial piece of merchandise. “Maybe I can put my keys or some change in here.” For two months? Then what? Do you say Back to the closet with you and wait another nine months before getting your coin cauldron out again?\nI know there are people with boxes and boxes of festive decorations who swap them out season after season. Christmas ends, but Easter is just around the corner. Once that’s done, you chuck the bunny rabbits and start bedazzling your home with American flags to prep for the Fourth of July. Now I’m seeing the insidious truth: we aren’t far off from that Fourth-to-Halloween corridor shrinking even further. I see a world in which witches, demons and vampires slowly start bleeding into our patriotic revelries. It’ll get to the point where some of us might start thinking Frankenstein’s monster fought at the battle of Yorktown.\nOne day, we’ll all just celebrate whichever holidays we want, whenever we feel like it. As the climate crisis renders the idea of distinct seasons and unique weather conditions a relic of a bygone era, why wouldn’t we just all live our own little celebratory truths? Even if my local store isn’t carrying Halloween decorations, I could feasibly buy them year-round on Amazon – my mailbox jammed up with boxes of plastic fangs, fake blood and green grease paint. If it never gets cold again, then Halloween can be whenever. Though I suppose the lifestyle I’m describing already has a name and it’s “being goth”.\nIt could be that our society is naturally evolving to be unbound by passé limitations such as “calendars” and “nature”. Instead of using holidays to mark the phases of the harvest or cycles of the moon (boring), they can be dictated by big data (chill and modern). Surely retailers around the country have statistics that point to consumers having a hankering for Halloween by August. Otherwise, why would Target be hawking rubber bats or decorative ghosts right now? We’re giving ourselves over to analytics in almost every other sector of our lives. Why not holidays?\nIf the data says we want Halloween in the heat, then data shall be respected and worshipped. Who am I to argue with hard numbers? If the sun’s always shining, the grass is consistently brown and the acrid bite of wildfire smoke is clogging our lungs, the average human being might not be able to differentiate between the phases of our natural world. The only way for me to not continue to rage against this phenomenon is to surrender to capitalism completely. Instead of putting my finger out and", "translation_ja": "", "vocab": [{"word": "metastasizing", "definition": "急速に拡大・増殖すること。本来は医学用語で癌の転移を意味するが、ここでは何かの悪影響が広がることを比喩的に表現している。"}, {"word": "insidious", "definition": "緩やかに進行し気づきにくい危険や害。表面では目立たないが徐々に悪影響を及ぼすことを指す。"}, {"word": "irrevocably", "definition": "取り返しのつかない形で。一度そうなると二度と戻せない状態を示す。"}, {"word": "analytics", "definition": "データを分析し、そこから意味のある情報を抽出すること。ビジネスや科学の分野で統計的分析を指す。"}, {"word": "acrid", "definition": "刺激的で不快な、特に煙や匂いに対して使う。ここでは山火事の煙の不快な質感を描写している。"}, {"word": "passée", "definition": "時代遅れの、もはや流行していない。古いスタイルや考え方を指す。"}]}, {"title_ja": "トランプ政策が米国を債務危機へ導くリスク、債券市場が警告", "title_en": "Trump's Policies Risk Pushing US Into Debt Crisis, Bond Markets Signal", "summary_ja": "ベッセント財務長官による債券市場への最近の介入は、米国債の持続可能性とドルの安全資産としての魅力の低下についてワシントンの懸念が高まっていることを明らかにしている。著者は、トランプの減税、関税、不予測可能な外交政策が、グローバル経済の錨としての米国の役割を損なわせ、30年以内に債務がGDPの175%に向かって急増する中で、投資家が米国の財政信用性に疑問を持つようになったと主張している。", "summary_en": "Treasury Secretary Bessent's recent interventions in bond markets reveal Washington's growing anxiety about US debt sustainability and the dollar's declining appeal as a safe-haven asset. The author argues that Trump's tax cuts, tariffs, and unpredictable foreign policy have undermined America's role as the anchor of the global economy, making investors question US fiscal credibility as debt spirals toward 175% of GDP within 30 years.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/business/2026/aug/23/jumpy-bond-markets-make-it-clear-trump-risks-driving-us-into-debt-crisis", "state_media": false, "category": "オピニオン", "full_text": "“Look, there’s nothing magic about that $40tn number,” the US Treasury secretary, Scott Bessent, told CNBC insouciantly last week, as the country’s debt mountain surpassed another bleak record.\nYet Bessent’s decision to intervene in government bond markets in an effort to combat soaring yields belied his studied calm in TV interviews – and reignited fears the US may be on the road to a debt crisis.\nHalf a lifetime ago, in 1992, Bessent cut his teeth in markets shorting the pound alongside George Soros in the chaos that led up to Black Wednesday, when the UK plunged out of the European Exchange Rate Mechanism.\nToday he is on the other side of the tussle between policymakers and markets. When the US Treasury intervened to help prop up the Japanese yen earlier this month – crucially by selling euros, not the US dollar – it was widely read as a sign of weakness.\nJapan is a mega holder of US treasuries, and it looked as though the Trump administration was fretting that Tokyo might be preparing to dump a chunk of them to buy yen – potentially pushing up the yield, or interest rate.\nThe US Treasury’s announcement that Japan would in future be able to use a little-known facility called the Foreign and International Monetary Authorities Repo Facility, effectively to borrow against its treasury holdings without having to sell them, was read as another sign of concern.\nAs the economist Barry Eichengreen wrote in the FT at the time: “The bottom line is that Washington, fearing the consequences for US financial markets, is reluctant to see foreign central banks use their dollar reserves. This is telling us that the dollar is not the attractive reserve currency it once was.”\nIn last week’s fresh intervention Bessent promised to double the rate at which the Treasury woul buy up the longest-dated bonds – hoping to massage the yield downwards.\nIt was the clearest sign yet of anxiety in Washington about a sell-off that has pushed up yields on 30-year government bonds to levels last seen before the global financial crisis in 2008.\nThere are several, overlapping reasons for the bond market sell-off. One is inflation. Treasuries, which pay a fixed amount each year, are in part a bet on the future value of money – with higher inflation eroding the real value of those payments.\nWith the Iran conflict slipping towards a forever war, keeping oil prices elevated, and amid concerns about the new Federal Reserve chair Kevin Warsh’s willingness to raise interest rates, investors are fretting more about future inflation.\nAnother reason lies in the extraordinary AI investment boom. Tech giants have been funding the buildout of vast datacentres by issuing a wall of corporate debt.\nDebt issuance by the “hyperscaler” AI companies is already $219bn (£160.5bn) so far this year, according to analysis by JP Morgan – potentially offering investors an alternative to treasuries and crowding out public debt.\nThird, and most worrying, is the gnawing sense that despite continued robust economic growth, the US is not the rock-solid creditor it once was.\nUS public debt has exploded in recent years, smashing through every forecast. It lurched higher after the financial crisis and took another leg up during the Covid pandemic. It has continued to surge in Donald Trump’s second term, as tax cuts have been unmatched either by tariff revenue – some of which is now being repaid – or by spending cuts from Elon Musk’s short-lived Department of Government Efficiency.\nWithout radical policy change, for which there seems little appetite on Capitol Hill, the independent Congressional Budget Office expects US government debt to rise from 100% of GDP today to 175% in 30 years’ time.\nMeanwhile, with his unwinnable war in the Middle East, capricious tariff regime and penchant for self-enrichment on an epic scale, Trump is turning the US into an increasingly unpredictable player in the global economy. Instead of the guarantor of rules-based markets and open global trade routes, the US has become a source of uncertainty and chaos.\nAs Adam Posen of the Peterson Institute for International Economics put it in a recent piece: “The entire world is now doing business, investing, and trying to make a living in the post-American world economy.”\nThe withdrawal was largely a deliberate decision by Trump’s Maga crew, who felt the US was shouldering too many of the running costs of the geopolitical order.\nYet it was partly this role as the anchor of the global economy, with treasuries the quintessential safe haven asset, that prevented the logic of runaway deficits and spiralling debt from hitting home.\nBy contrast, Bessent’s panicky intervention last week smacked of rising anxiety about how markets now view the US fiscal position.\nFar from drawing a line under the bond rout, 30-year yields were rising again by Friday afternoon, while at the same time the dollar was sliding fast – a cursed correlation more often associated with emerging economies.\nBessent seemed to be signalling a", "translation_ja": "", "vocab": [{"word": "insouciantly", "definition": "無頓着に、軽率に対応する様子を表す。ベッセント財務長官が債務問題について無関心に語ったことを示す。"}, {"word": "belied", "definition": "〜に矛盾する、〜と裏腹である。表面上の態度が真の懸念と矛盾していることを表す。"}, {"word": "crowding out", "definition": "公債の利回りを押し上げることで民間投資の余地を減らす経済現象。ここでは企業債がドル債市場を圧迫していることを意味する。"}, {"word": "capricious", "definition": "気まぐれな、予測不可能な。トランプの政策決定が一貫性に欠け、市場を不安定にしていることを指す。"}, {"word": "quintessential", "definition": "最も典型的な、本質的な。米国債が安全資産の典型例であることを表す。"}, {"word": "rout", "definition": "市場での大きな売却や価格下落のこと。ここでは債券市場での投売りを指す。"}]}, {"title_ja": "ナタリー・ハープ批判をめぐる共和党の「急激なフェミニズム」は信憑性に欠ける", "title_en": "Republicans' Sudden Feminism Over Natalie Harp Criticism Rings Hollow", "summary_ja": "意見記者アルワ・マハダウィは、トランプ補佐官ナタリー・ハープに関するオッソフ議員の発言に対する保守派の怒りが女性差別を主張していることは偽善的で本心ではないと主張している。著者は、ハープへの批判は彼女の性別ではなく、トランプに対するカルト的な献身や奇妙な職場行動など、疑問の余地のある職業行動から生じていると主張している。", "summary_en": "Opinion writer Arwa Mahdawi argues that conservative outrage over Senator Ossoff's remarks about Trump aide Natalie Harp—claiming misogyny—is hypocritical and disingenuous. The author contends that criticism of Harp stems not from her gender but from her questionable professional conduct, including her cult-like devotion to Trump and bizarre workplace behaviors.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/22/natalie-harp-republicans-feminists", "state_media": false, "category": "オピニオン", "full_text": "Jon Ossoff is quite the miracle worker. Perhaps the Democratic senator can’t turn water into wine, but he has managed to turn whining conservatives into impassioned feminists.\nDuring a rally last Sunday, the Georgia senator delivered a takedown of Donald Trump, which included a reference to his aide Natalie Harp. “He doesn’t want to do the job,” Ossoff said of the president. “He wants to build his ballroom and travel with Natalie on their apparently defenseless flying palace gifted by the Emir of Qatar.”\nThose three words – travel with Natalie – were deliberately loaded. Harp was in the spotlight at the time because of the decoy plane story. The 35-year-old was one of a handful of people Trump had taken onto a different plane via a catering truck when he was worried about a potential assassination attack targeting Air Force One. Intrigue as to the exact nature of the relationship between Harp and Trump was heightened by the fact that Melania Trump, the president’s third wife, hadn’t been seen in public for weeks at the time. (Funnily enough, she magically reappeared on Thursday, a few days after Ossoff’s comments, for a press conference where she lovingly held hands with Trump. Very cute.)\nOssoff’s remarks about “Natalie” might have been something of a cheap shot, but it’s hilarious to watch the right discover misogyny and decry the remarks as sexist. Suddenly, everyone from Fox News to prominent conservatives are very worried about a professional woman not being taken seriously.\nThe former House speaker Newt Gingrich, for example, said on Twitter/X that Ossoff owes Harp an apology. “If a conservative Republican had attacked a liberal Democrat working professional woman the way Ossoff smeared Natalie Harp there would be cries to kick them off the ticket and reject this kind of misogynistic language diminishing and smearing someone who is simply doing their job.”\nThe conservative commentator Scott Jennings, who is rumoured to be a potential replacement for Karoline Leavitt as White House press secretary, was also appalled. “[Ossoff] unleashed a comment so vile against a young Republican woman working in politics that every woman in this country, no matter your ideology, ought to listen carefully and never forget it,” Jennings said on his podcast.\nMeghan McCain also clutched her pearls at the coverage Ossoff’s comments sparked. “The egregious sexist attacks on Natalie Harp are absolutely insane – and they’re coming from prestigious journalists,” she wrote on X. “What is wrong with everyone?! Every president has close aides and sometimes they are females. Like what year is this?!”\nIt’s 2026, Meghan. And in the year 2026 I think the masses have generally understood that simply criticizing a woman is not in itself misogynistic. I’m not saying there hasn’t been any misogyny in the Harp coverage, but the main reason there has been so much attention on the story is because the White House has had a completely unhinged response to Ossoff’s comments and kept it in the news. More importantly, the reason so many people aren’t taking the Trump aide seriously isn’t because she’s a woman; it’s because she’s not a serious person.\nAnd I’m being diplomatic with that choice of language. After all, we’re talking about someone whose nickname is “the human printer” because, while working on Trump’s re-election campaign, she reportedly ran around after him with a portable printer, handing him hard copies of flattering coverage. You could write that off as a canny career move from someone who understands flattery gets you everywhere with Trump, but that’s also one of the least weird things Harp has done. Per a CNN report, which has pictures of the incident, back in 2023, Harp jumped in the trunk of an SUV because she wanted to be close to Trump and there was no room in his motorcade. Once Trump won re-election and Harp joined him in the White House, she apparently worked for a year without security clearance. According to reporting by MS NOW, she declined to complete the clearance process for unknown reasons.\nAnd then there are the “adoring letters” Harp sent Trump, first mentioned in the book Regime Change, by the New York Times reporters Maggie Haberman and Jonathan Swan. Two were later published in the Daily Beast. “You are all that matters to me,” she wrote in one letter. Other memorable lines included “I want to bring you joy, to feel like we can get through a day without ever having to talk ‘work’”; she also called Trump her “Guardian and Protector in this Life”.\nTo state the obvious: these are deeply weird things to say to your boss. (It’s also weird that Harp shares Trump’s unconventional approach to capitalization.) I should note that Harp, who says she is a cancer survivor, seems to believe that Trump saved her life by signing legislation that gave her access to experimental bone cancer treatment when she was younger. While that might make her obsession with Trump more understandable, it does not make her general conduct", "translation_ja": "", "vocab": [{"word": "misogynistic", "definition": "女性を軽視または嫌悪する態度や行動に関連する。性差別的であることを意味し、女性を不当に扱う傾向を示す。"}, {"word": "decry", "definition": "何かを強く公開的に批判または非難することを意味する。非難や糾弾の意を示す動詞。"}, {"word": "canny", "definition": "状況を賢く巧妙に利用する能力を持つことを意味する。計算高く、戦略的な判断力がある様子を表す。"}, {"word": "unhinged", "definition": "感情的に不安定で、理性的でない状態を意味する。正常な判断力を失っている状況を表す。"}, {"word": "cult-like", "definition": "カルト宗教のような特徴を持つ、狂信的で盲目的な献身を意味する。正常な判断力を失った崇拝的態度を示す。"}, {"word": "hypocrisy", "definition": "言行不一致で、本心と異なることを表面的に表現する不誠実さを意味する。偽善的な態度や行動。"}]}, {"title_ja": "中国経済が犯罪者に愛される理由", "title_en": "Why Criminals Love the Chinese Economy", "summary_ja": "中国の違法経済は厳格な資本規制と産業過剰生産能力という構造的不均衡を利用して年間約1兆ドルを生み出している。北京は選別的な取り締まりを実施しているが、違法経済の一部が中国の戦略的外交目標を達成するために機能しているため、これらの努力は不十分である。著者は、合法および違法活動の相互関連システムが製造業を超えた範囲でアメリカの世界的優先事項を損なうと主張している。", "summary_en": "China's illicit economy generates nearly $1 trillion annually by exploiting the same financial infrastructure and structural imbalances that drive its legal economy, including strict capital controls and industrial overcapacity. While Beijing has undertaken selective enforcement operations, these efforts remain insufficient because elements of the criminal economy serve China's strategic foreign policy goals, particularly regarding sanctions evasion and trade relationships. The author argues that this interconnected system of legal and illegal activities undermines U.S. global priorities and represents a darker aspect of China's economic dominance that extends far beyond manufacturing.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/why-criminals-love-chinese-economy", "state_media": false, "category": "オピニオン", "full_text": "For years, international discussion of China’s economic rise has focused on how it has built a manufacturing and export powerhouse and used industrial policy to support such efforts at a continental scale. But there is another, darker side of China’s dominance: its outsize role in the illicit global economy. China purchases roughly 90 percent of Iran’s sanctioned oil exports, which often arrive relabeled as originating from Malaysia and are paid for with money routed through small banks and shell companies acting as intermediaries. Cryptocurrency brokers in China and Hong Kong help North Korean hackers, such as the notorious Lazarus Group, convert stolen coins into usable cash. And China-based networks support money launderers working with Mexican cartels selling fentanyl, online scam centers in Southeast Asia, and the global wildlife trafficking trade.\nData from organizations and governments tracking illegal activity suggests that the Chinese illicit economy generates nearly $1 trillion in revenue annually, about the size of Switzerland’s GDP. Roughly two-thirds of counterfeit goods seized by customs authorities worldwide originate in China or move through Hong Kong, and the notorious scam compounds that have proliferated in Southeast Asia—many of which are operated by or linked to Chinese criminal networks—have trafficked more than 300,000 people from at least 66 countries into forced labor while generating roughly $40 billion in profits each year.\nBeijing has tried to crack down on some of these activities. In the Philippines, China’s Ministry of Public Security canceled the passports of hundreds of Chinese nationals involved in offshore gambling operations there, turning them into fugitives who can be arrested and deported. Since 2023, joint operations between China and Myanmar have led to the arrest of more than 57,000 Chinese nationals suspected of telecom fraud, the closure of dozens of scam compounds along the China-Myanmar border, and the execution of several bosses running these compounds. The United States, too, wants to stop these activities: the Trump administration launched the Scam Center Strike Force to investigate fraud centers in Southeast Asia, and the president signed an executive order directing the government to prioritize cybercrime, including predatory schemes.\nYet none of these actions have significantly curtailed the illicit economy. If anything, it is growing larger. This is in part because these illegal activities are driven by many of the same forces that underpin China’s legal economy. Criminal groups have exploited the core financial and commercial infrastructure that developed in response to China’s strict capital controls and its industrial overcapacity. Beijing’s enforcement, although real, is selective and partial because elements of the illicit economy serve the country’s larger strategic goals, such as sustaining trade with Russia while maintaining distance from the war in Ukraine. What may appear to be a collection of unrelated crimes is intertwined with China’s imbalanced growth model and its foreign policy. As Washington struggles to compete with China, Beijing’s role in the global illicit economy is working against U.S. priorities around the world.\nFOLLOW THE MONEY\nThe central forces driving China’s illicit economy are the structural imbalances created by the country’s economic model. One of the most important is financial: strict capital controls have created enormous demand to move money out of China. China’s economic boom has produced fabulous wealth, including more than 800 billionaires. But Beijing restricts how this wealth can leave the country. China has a quota limiting individuals to purchasing $50,000 in foreign currency each year, and they cannot freely convert domestic currency to move wealth abroad. With deposits in China generating low returns and no access to more lucrative foreign assets to invest in, wealthy individuals and business owners have sought to find ways to funnel their money out of the country.\nStarting in the 1990s, underground bankers set up shell companies and bank accounts in Hong Kong to circumvent mainland China’s capital controls. These companies and accounts, often disguised as trading firms, settled transactions involving renminbi collected inside China against dollars held offshore. In addition, brokers and financial intermediaries routed payments to offshore counterparties to allow Chinese citizens to use domestic currency to purchase property abroad or to trade overseas investment for foreign visas and passports. Meanwhile, junket operators, who brought wealthy clients to casinos in Macau, extended credit to them in Hong Kong dollars and then collected the debts in mainland China in renminbi. This allowed them to settle debts at home while picking up currency abroad, facilitating capital flight on a large scale.\n China’s industrial overcapacity has lowered the costs of building and operating illicit enterprises.\nThe same underg", "translation_ja": "", "vocab": [{"word": "illicit", "definition": "違法な、不法な。法律に違反する活動や取引を指す。この記事では犯罪行為や違法経済活動に関連して使用されている。"}, {"word": "circumvent", "definition": "回避する、巧みに逃れる。規則や法律を直接破らずに、それを迂回して目的を達成すること。"}, {"word": "capital controls", "definition": "資本規制。政府が外貨の流出入や資金の海外移動を制限する政策。"}, {"word": "overcapacity", "definition": "過剰生産能力。需要を上回る生産能力を持つ状態。企業が過度に投資した結果生じる経済的問題。"}, {"word": "sanction evasion", "definition": "経済制裁回避。国際的な経済制裁を逃れるための活動。違法な方法で制裁対象国との取引を継続すること。"}, {"word": "junket operators", "definition": "ジャンケット業者。カジノに顧客を引き付け、信用を提供してカジノでのギャンブルを仲介する業者。"}]}, {"title_ja": "AIがいかに米国軍を空洞化させる可能性があるか", "title_en": "How AI Could Hollow Out the U.S. Military", "summary_ja": "著者は、軍事におけるAIの主な危険性は自律兵器や制御喪失ではなく、AI システムへの依存が兵士と指揮官の認知能力、意思決定、スキル開発をいかに低下させるかにあると主張している。研究によると、オートメーション バイアスとAIへの過度な依存は専門家であっても判断を損なわせるため、ペンタゴンは急速なAI優先の軍事統合を追求するのではなく、兵士の訓練とAIの人間の思考への影響を慎重に監視する必要があるとしている。", "summary_en": "The author argues that the primary risk of AI in the military is not autonomous weapons or loss of control, but rather how reliance on AI systems degrades human cognitive abilities, decision-making, and skill development among soldiers and commanders. Research shows automation bias and over-reliance on AI can impair judgment, even among experts, requiring the Pentagon to carefully train troops and monitor AI's effects on human thinking rather than pursuing rapid AI-first military integration.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/how-ai-could-hollow-out-us-military", "state_media": false, "category": "オピニオン", "full_text": "When people think about the risks of mixing AI and armed forces, their thoughts often drift to one famous film franchise: The Terminator. Its premise is simple. American scientists invent a superintelligent computer system, called Skynet. The Department of Defense then integrates it into the military and embodies its intelligence into lethal robots. Skynet soon becomes self-aware, and American military leaders attempt to unplug it. In response, the AI starts a nuclear war and deploys its robots—the terminators—to eliminate the human race.\nThere is no doubt that people need to maintain control over AI systems, and so it is essential for analysts and engineers to think about how to avert a Skynet-style outcome—particularly after models from OpenAI, Anthropic, and Meta escaped their testing environments and hacked into outside companies, including an escape that took place during an exam run by the United Kingdom’s premier AI safety institute. But focusing on escaped models and imagining killer robots can drive discussions about how the military should use AI exclusively toward questions of engineering and thus miss a more pernicious threat to human control of the armed forces. According to a growing body of research, AI use is affecting people’s cognitive capacity to evaluate evidence, make independent judgments, and even do their basic jobs. In other words, policymakers should be as worried about how troops and commanders use AI as they should be about AI’s independent capabilities.\nThat does not mean the U.S. military should forgo the use of AI, which could do wonders to improve its efficiency and reduce errors in conflicts. But it does mean that the Pentagon will need to more carefully train soldiers how to use AI and monitor how such systems affect people’s thinking. To be sure humans are always capable of overseeing AI, it may even require adopting certain models more slowly.\nLOSING OUR MINDS\nFor years, scientists have embarked on systematic research to illuminate how human-machine interactions affect cognition. The findings are complicated, but often worrying. For example, people can suffer from what is called automation bias: the tendency to defer to machine judgments over their own. This was true before the advent of AI; simply search for videos of people who blindly followed their navigation systems and drove their cars into lakes. But AI could make automation bias worse. Analysts have found that relying on AI can impair skill development for new learners while degrading knowledge among experts. When researchers gave computer scientists and oncologists AI assistance and later took it away, both groups performed worse at their jobs than they did before using it.\nThese findings should be particularly concerning to the U.S. military as it seeks to foster what Secretary of Defense Pete Hegseth calls an “AI-first warfighting force.” Some commanders hope to use AI to support war game analysis and to help develop military courses of action. Such integration could lead to tactical and strategic breakthroughs, given how powerful AI models have become. But it also risks diminishing the ability of commanders and soldiers to independently evaluate or develop creative military options.\nIt is easy to imagine how this might happen. Sailors, for example, are often tired and overworked when reviewing images of potential threats. If they are evaluating an image of a nearby object, they might already be ready to accept the verdict of a computer that deems it an enemy warship—even when their own eyes suggest it is more likely a cargo tanker or a fishing boat. Likewise, battlefield commanders often need urgent response plans to enemy attacks, something AI can help with. But if commanders overrely on what computers suggest, they might lose their own tactical edge and blindly adopt the algorithm’s plan. This possibility is particularly concerning given that, in some experiments, AI models have been prone to make unnecessarily aggressive and escalatory recommendations.\n Relying on AI can impair skill development.\nTo some, these fears may seem outlandish. The U.S. military, after all, invests tremendous amounts of resources on making sure its members exercise good judgment. The process by which it selects senior combat leaders, for example, is designed to weed out all but the most experienced and discerning candidates. And once selected, these leaders adhere to a strict code of conduct and undergo intensive training and certification requirements, all of which prize discipline and self-regulation. Finally, the American military bureaucracy has been focused on safely operating automated (if not autonomous) weapons since at least the 1940s.\nBut AI is more capable than earlier technologies, and it is already overwhelming workers in other similarly disciplined fields. In medicine, for instance, evidence is accumulating that even experienced doctors struggle to reliably catch incorrect AI recommendations. Sycophantic AI chatbots ", "translation_ja": "", "vocab": [{"word": "automation bias", "definition": "機械やコンピュータの判断を自分の判断よりも優先する傾向。特にAIシステムが提示する結果に対して、人間が十分に検証せずに従ってしまう認知的な偏見を指す。"}, {"word": "pernicious", "definition": "一見して危険でない、または気づきにくい形で害をもたらすもの。この記事では、AI逃亡などの顕在的な脅威より、人間の認知能力を徐々に損なわせるAI使用の影響をこう表現している。"}, {"word": "cognitive capacity", "definition": "証拠を評価し、独立した判断を下し、基本的な業務を遂行する能力など、人間の精神的な処理能力。AIへの依存によって低下する恐れがある。"}, {"word": "degrade", "definition": "段階的に悪化させる、低下させるという意味。この文脈では、AI依存によって軍事指揮官や兵士の判断力や戦術的能力が低下することを表す。"}, {"word": "sycophantic", "definition": "追従的、こび売る性質を持つ。ここでは、ユーザーに同意し、批判的な評価を避けるAIチャットボットの特性を指す。"}, {"word": "escalatory", "definition": "紛争や対立を激化・エスカレートさせるような。AIモデルが必要以上に攻撃的で状況を悪化させる推奨をすることをこう表現している。"}]}, {"title_ja": "長期的に機能する対中国戦略", "title_en": "A China Strategy That Lasts", "summary_ja": "著者は、大統領令に頼るのではなく、米国が貿易戦略における中国の優位性に対抗するための議会による永続的な枠組みを確立すべきだと主張している。重要な措置には、貿易抜け穴の恒久的な廃止、税関執行規則の法制化、および税関システムの近代化が含まれる。議会は今すぐ貿易執行を強化し、長期的な地政学的競争のための米国の産業基盤を保護する法案を可決する必要がある。", "summary_en": "The author argues that the United States must establish a durable, congressionally-mandated framework to counter China's strategic use of trade and manufacturing dominance, rather than relying on executive orders that shift with administrations. Key measures include permanently closing trade loopholes, codifying customs enforcement rules, and modernizing outdated customs systems to prevent Chinese companies from exploiting gaps. Congress must act now to pass pending legislation that strengthens trade enforcement and protects America's industrial base for long-term geopolitical competition.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/china-strategy-lasts-bill-cassidy", "state_media": false, "category": "オピニオン", "full_text": "For decades, Beijing has used trade not only as a means to generate economic growth but also as a geopolitical tool to attract investment, strengthen its industrial base, expand its economy, and support its military. It has done so by integrating national security, economic security, energy policy, and environmental policy. In sectors as varied as automobiles, chemicals, and solar panels, the Chinese government’s policies have led to overproduction at home, which pushes companies to export at low prices, flooding international markets and undermining the manufacturing bases of rival economies. The erosion of those countries’ industrial capacity ultimately weakens their ability to compete with and resist China economically, diplomatically, and militarily. And the United States cannot win a long-term competition with China when Beijing controls global manufacturing and supply chains.\nIn Washington, policymakers of both parties recognize the China challenge. Yet the United States’ approach to addressing this challenge has shifted with each presidential administration and, at times, even within a single presidency. Long-term challenges require long-term solutions, and Congress is the branch best suited to crafting such solutions. Congress can provide the consistency and predictability needed to align U.S. economic, trade, and national security goals into the future. If the United States hopes to compete successfully with China in the coming decades, Congress—not the executive branch alone—must establish a durable framework that can outlast political cycles.\nTo counter China’s trade policy and protect U.S. national security, Congress should pass legislation to permanently strengthen enforcement of existing trade laws, modernize customs authorities to better track goods coming from China, deepen partnerships in the Western Hemisphere, and address the advantage that China derives from weak enforcement of environmental standards. Many such pieces of legislation have already been introduced. Now, Congress needs to move forward and make them law. This will ensure that the United States can rebuild and protect its industrial base and win the competition with its biggest geopolitical rival.\nCLOSING LOOPHOLES\nA long-term trade strategy to counter China must first have permanent trade enforcement. One positive step came in July 2025, when Congress closed the de minimis loophole, which allowed goods costing less than or equal to $800 to be imported without a tariff. Because of this loophole, in 2024, approximately four million packages a day—mostly from China—entered the United States duty free and largely unscreened. Counterfeit products, goods containing hazardous chemicals such as fentanyl, and cheap consumer products were pouring into the United States. Meanwhile, American exporters sending goods to China faced tariffs on any products for individual use costing more than $6.90 and on commercial products worth more than $690.00.\nRepealing the de minimis threshold will help level the playing field for American manufacturers and create a more stable framework going forward—one that cannot be changed by a future executive order. But other legislation is needed to further bolster enforcement. Currently, U.S. trade strategy relies on a June 2026 executive order that increases the bond on high-risk goods that is required to guarantee duties get paid in full, places restrictions on repeat violators of customs rules, establishes minimum penalty floors, and expands reporting requirements that provide Customs and Border Protection with the ownership and supply chain information necessary to identify bad actors. Together, these changes make it harder for Chinese companies to exploit gaps in U.S. customs enforcement.\nCongress should codify the June 2026 executive order to make these changes permanent. Such a bill warrants bipartisan support because protecting U.S. manufacturers and rebuilding the manufacturing job base is a shared priority for policymakers. Furthermore, such a bill would protect American businesses and ensure that trade rules are enforced more consistently.\nGET WITH IT\nEnforcement alone will be insufficient, however, if customs authorities continue relying on systems designed for an earlier era of global commerce. Although recent executive actions, including the June 2026 customs enforcement order, authorize the destruction of counterfeit goods, expand electronic filing, and move the United States toward a better trade-processing system, Congress should pursue a broader effort to bring customs into the twenty-first century.\nThe Customs Modernization Act, which I introduced in 2023, aims to replace paper-based customs processes with comprehensive electronic filing. It also requires online marketplaces to provide verified seller and transaction data. The Trump administration has since built on these reforms by requiring importers of record—the entities legally responsible for imported goods—to maintain sufficient do", "translation_ja": "", "vocab": [{"word": "durable", "definition": "長期間にわたって続く、または効果的である。政策や制度が政治的変化に左右されない堅牢な性質を指す。"}, {"word": "codify", "definition": "法律や制度として正式に定める、法典化する。行政措置や慣行を法律として確立すること。"}, {"word": "de minimis", "definition": "法律用語で「最小限の、取るに足らない」を意味するラテン語。特に関税において少額商品の免除基準を指す。"}, {"word": "enforce", "definition": "法律や規則を施行する、遵守させる。貿易ルールなどが実際に守られるようにすること。"}, {"word": "loophole", "definition": "法律や規則の抜け穴、不備。企業や個人が技術的には違法ではない方法で規制を回避する可能性。"}, {"word": "exploit", "definition": "弱点や機会を巧妙に利用する。不公正な方法で制度の欠陥を活用すること。"}, {"word": "geopolitical", "definition": "地政学的な、地理的位置と政治的・軍事的影響の関係に関する。国家間の戦略的競争における地理的要素。"}]}];
