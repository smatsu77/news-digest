der crossings between Nepal and Tibet, sweeping away all in its path as hundreds of people fled for their lives.\nThe scenes, captured by CCTV cameras, quickly spread on social media and onto screens around the world.\nExcept here, in China.\nOnly a single still-frame shot has been broadcast so far by the country's state-run flagship news bulletin.\nIt has also been difficult to find the video on China's heavily censored internet. It is just as hard to even find posts describing the flash flooding that has claimed hundreds of lives, with just as many still unaccounted for since Wednesday.\nBeijing has launched a massive rescue operation involving hundreds of emergency workers, which is continuing, and President Xi Jinping chaired an emergency meeting with officials to co-ordinate efforts.\nBut when you compare the country's internet content to what much of the world has been seeing online these past few days, China's firewall becomes more visible than ever.\nTibet, which Beijing annexed in the 1950s, had long resisted rule by the Chinese Communist Party.\nChina has quashed protests over the years, sometimes violently, and has been accused of grave rights violations in the Buddhist region. It has labelled the exiled spiritual leader, the Dalai Lama, a separatist.\nThat history means the very name Tibet draws China's censors. Beijing's sensitivities are especially apparent at times likes this.\nThere have been daily updates on the missing and the dead, and Beijing has also been posting updates on the rescue operations, as well as the dangers posed by a barrier lake that has been at risk of overflowing.\nBut there is little detail beyond that. There are no accounts from survivors in Tibet, and almost no user-generated footage showing the deadly moments or their aftermath.\nWe are yet to hear from anxious families of those missing. Trying to contact people there is near-impossible during regular times.\nAs a journalist who has covered North Korea, it has often been easier for me to contact interviewees in Pyongyang than it is in the Tibetan capital, Lhasa.\nOn Thursday night, as global headlines led on the devastation in a Himalayan valley, China's state broadcaster opened its main bulletin with the launch of Xi's new book, a selection of his \"most important and fundamental works\".\nForeign journalists cannot travel to Tibet without government permission. We have just a few hours to get as much information as we can on huge stories like this before videos are scrubbed and voices stifled.\nInstead, we have to rely on state media, which has so far focused on incredibly dramatic rescue efforts.\nSpecialist search teams scaling mountains and cliff faces, or crossing raging rivers to try to get to the worst-affected areas. We don't yet know what happened afterwards, or who they were able to save.\nThis is not to say that Beijing is unconcerned. Rather, they are very concerned.\nChina's Premier Li Qiang was quickly despatched to the region, where he was seen inspecting debris removal - a rare visit by the country's second-most important leader so soon after a major disaster.\nThe reason for what the world might see as a muted response is to preserve the one thing Xi covets for his country: stability.\nThe Communist Party will fear that such a disaster could fuel discontent, either with the response or the lack of foresight to prevent it.\nIt may also fear the impact of a tragedy like this and its potential to be a rallying factor, especially in a community where faith has long played a central role.\nAlthough the region has not seen protests in a long time, Tibetan groups abroad have expressed concern over increasing Chinese control, such as new education laws that they say aim to weaken the role of monasteries and the Buddhist faith.\nJust hours after the disaster struck, the Communist Party machine tried to rally its grassroots to stem any signs of discontent of its handling of the landslide.\nA notice came from the local party office urging members to step up and help in disaster relief efforts in their area and provide emotional guidance or psychological support to affected residents.\nThe key line instructs them to \"make every effort to maintain social order and ensure stability and public confidence in the disaster areas\". Those who perform well would be rewarded - and those who do badly \"would be held accountable\".\nIt is a warning that will not be taken lightly. Tibetans in the region can be detained or arrested for speaking to journalists or posting anything online that is seen as contrary to the government narrative, according to rights activists.\nThat is making it difficult for Tibetans outside the region to find out what has happened to their relatives.\nThe International Campaign for Tibet, while praising the wo", "translation_ja": "", "vocab": [{"word": "firewall", "definition": "検閲や規制によって情報の流れを制限するシステムを指す。ここでは中国による情報統制の仕組みを比喩的に表現している。"}, {"word": "annexed", "definition": "領土や地域を一方的に自国に組み込む、併合することを意味する。通常、軍事力や政治力を背景に行われる。"}, {"word": "muted", "definition": "弱められた、控えめなという意味。ここでは表面上抑制された対応や反応を示す。"}, {"word": "discontent", "definition": "不満や不安定な感情。社会的な不満が広がり、政権に対する反感が生まれることを指す。"}, {"word": "rallying factor", "definition": "人々を結集させる要因となるもの。共通の関心事や悲劇が集団の団結を促進する場合を指す。"}, {"word": "scrubbed", "definition": "消される、削除されるという意味。ここではオンラインから情報が削除されることを示す。"}]}, {"title_ja": "トランプ、ベネズエラの石油650億バレル支配の「歴史的」取引を発表", "title_en": "Trump Announces Historic Deal for US Control of Venezuela's 65bn Oil Barrels", "summary_ja": "トランプ大統領は、ベネズエラの確認埋蔵量650億バレル以上をアメリカが支配する歴史的合意を発表し、米国の石油準備金を倍増させガソリン価格を低下させると主張した。取引の下では、米国政府が17の戦略的油田を100年間運営する合弁事業の55%を保有し、1000億ドルの民間投資が予想される。この合意は、ニコラス・マドゥロ前大統領のアメリカによる逮捕に続くもので、外国の主権的資源に対するアメリカの支配権の異例の主張を表している。", "summary_en": "President Trump announced a landmark agreement granting the US control over more than 65 billion barrels of Venezuela's proven oil reserves, claiming it will double American reserves and lower gas prices. Under the deal, the US government will retain 55% control of a joint venture operating 17 strategic oil fields for 100 years, with an expected $100 billion in private investment. The agreement follows the US capture of then-President Nicolás Maduro and represents an unusually broad assertion of American governance over a foreign nation's sovereign resources.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cx2zlwe7qj1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Trump hails 'historic' deal for US to control 65bn barrels of Venezuela's oil\n- Published\nThe US has reached a deal with Venezuela to control more than 65 billion barrels of its proven oil reserves, President Donald Trump announced.\n\"This Historic Transaction MORE THAN DOUBLES American Oil Reserves, greatly increases our Oil Supply, and will substantially lower Gas Prices for all Americans,\" Trump posted on social media.\nVenezuela's interim President, Delcy Rodriguez, hailed the agreement as one that would help her nation's economic revival.\nTrump vowed to tap Venezuela's reserves, the world's largest, after the US captured its then-President Nicolás Maduro this year. More recently, Trump has been under pressure to tame domestic petrol prices, which spiked amid the Iran conflict.\nSecretary of State Marco Rubio called the oil deal \"a huge win for both the American and Venezuelan people\". Details have not been released.\n\"For the Venezuelan people, this deal will bring nearly $100 billion in private investment, support thousands of high-paying jobs, and drive the reconstruction of Venezuela's economy,\" Rubio said on social media.\nIn his post, Trump said Rubio and Defence Secretary Pete Hegseth had reached the agreement with Venezuela's leadership \"through a partnership with private business\".\nHe did not elaborate on the partnership or describe possible commitments and terms for the US in the deal, but he claimed the agreement was reached \"at no cost to the American Taxpayer\".\nVenezuela's interim President Rodriguez said in a statement that the agreement would have \"a significant impact on our nation' revival\", by bringing in investment in the infrastructure needed to develop its hydrocarbon industry.\nThe deal calls for the development of 17 strategic oil fields with a proven potential of 65 billion barrels, as well as \"an investment of more than $100 billion, and more than $209 billion in taxes for the State\", Rodriguez said.\n\"These investments will contribute not only to the recovery and modernization of our industry, but also to our country's economic growth, the energy security of our hemisphere, and greater balance in international markets,\" she said.\nUnder the deal the US government will retain 55% control of a joint venture with an \"experienced private operator in Venezuela\", a US official told the BBC's media partner CBS News.\nRodriguez gave the venture a 100-year concession to operate in the oil fields, according to the official.\nTrump gave few details of the highly unusual agreement, which appears to grant the US direct governance over a foreign country's sovereign national resources.\nThe deal would appear to be wider in scope than the US-led Coalition Provisional Authority's control over Iraq's oil revenues after Saddam Hussein was ousted in an American-led invasion in 2003.\nBut it is unclear whether the Venezuela agreement could face legal and constitutional challenges in the South American nation.\nThen-President Maduro and his wife, Cilia Flores, were seized in a US special forces operation authorised by Trump on 3 January.\nIn the hours after the raid, Trump said his administration would run Venezuela until a \"safe, proper and judicious transition\" could take place, adding that the US would indefinitely control the sale of the country's oil.\nVenezuela has the largest proven oil reserves in the world - an estimated 303 billion barrels. However, production has plummeted since its peak in the late 1990s.\nTrump has asked US oil firms to invest at least $100bn (£75bn) to restore the country's oil industry.\nHe has also claimed the rights to Venezuela's oil after alleging that the country had in the past \"unilaterally seized and sold American oil, American assets and American platforms, costing us billions and billions of dollars\".\n  - Published30 January", "translation_ja": "", "vocab": [{"word": "interim", "definition": "正式な任命までの間、一時的に職務に当たっている状態。ここではロドリゲス氏がベネズエラの暫定大統領として機能していることを示している。"}, {"word": "concession", "definition": "政府が民間企業に与える特定の権利や特権。ここでは米国がベネズエラの油田を100年間運営する権利のことを指す。"}, {"word": "joint venture", "definition": "二つ以上の企業や組織が共同で事業を行う企画。ここでは米国とベネズエラが石油開発で協力する事業形態を意味する。"}, {"word": "sovereign", "definition": "国家の独立性と自決権。ここではベネズエラの国家が自国の資源を完全にコントロールする権利を指している。"}, {"word": "hydrocarbon", "definition": "石油と天然ガスなどの炭化水素系燃料の総称。エネルギー産業で頻繁に使用される技術用語。"}, {"word": "plummeted", "definition": "急激に下落する、急減する。ここではベネズエラの石油生産量が大幅に減少したことを表している。"}]}, {"title_ja": "9.11テロ首謀者と疑惑のサウジスパイの関係を明かす大家", "title_en": "Landlady Reveals Links Between 9/11 Hijackers and Alleged Saudi Spy", "summary_ja": "サンディエゴの元物件管理人が、25年間の沈黙を破り、2人の9.11テロ首謀者を彼女に紹介したサウジアラビア人オマル・アル・バヨウミについて証言した。ニューヨーク裁判所への彼女の証拠陳述はバヨウミの当局への説明に矛盾し、テロ首謀者との調整の証拠を提供している。この事件により9.11被害者遺族はサウジアラビア王国に対する1兆ドル規模の訴訟を進めることが可能になった。", "summary_en": "A former property manager in San Diego has broken her 25-year silence about Omar al-Bayoumi, a Saudi resident who introduced her to two 9/11 hijackers. Her testimony in a lawsuit against Saudi Arabia contradicts Bayoumi's account to authorities and provides evidence of coordination with the hijackers. The case has allowed families of 9/11 victims to proceed with a $1 trillion lawsuit against the Kingdom of Saudi Arabia.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c99dvm39mreo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Landlady to 9/11 hijackers reveals their links to alleged Saudi spy\n- Published\nHolly Ratchford still cannot believe that the man who moved into the residential complex she once managed would go on to be accused of involvement in the darkest day in recent US history.\n\"It's almost impossible for me to wrap my head around who he said he was, and who he really is. I still struggle with that,\" she tells the BBC.\nThe man, Omar al-Bayoumi - a Saudi in his early 40s - moved to the complex in San Diego, California, with his family in September 1999.\nThe new resident at number 152 Parkwood Apartments quickly became a regular at Ratchford's pool parties. \"He was always so bubbly and smiling,\" she recalls, \"and just very, very friendly.\"\nA few months later, Bayoumi would introduce Ratchford to two apparently unassuming, \"polite\" men, who would also become her neighbours.\nThe pair would become infamous for hijacking American Airlines flight 77, and crashing it into the Pentagon, in the 9/11 attacks.\nRatchford has been haunted by her connection to these three men for the past 25 years. She feels she was taken in by Bayoumi from the start.\n\"Whenever I had parties he would come and be a part of the activities,\" she recalls, adding that his family would invite her in for food.\n\"I enjoyed going over.\"\nBut Bayoumi, the one-time resident of 152 Parkwood, is now at the centre of the $1 trillion (£733bn) lawsuit brought against the Kingdom of Saudi Arabia by several thousand families of victims and as well as survivors of 9/11.\nOn 11 September 2001, four passenger aircraft were hijacked by 19 members of the Islamist extremist network, al-Qaeda. In addition to the crash at the Pentagon - the US military's headquarters near Washington DC - two planes were flown into the twin towers of the World Trade Center in New York, causing both buildings to collapse. A fourth crashed in a field in Pennsylvania, following resistance from passengers on board.\nIn all, almost 3,000 people were killed, including about 300 firefighters and other emergency workers at the World Trade Center.\nBayoumi is alleged to have facilitated the 9/11 plot through the support he provided for the first two hijackers to arrive in the US - Nawaf al-Hazmi and Khalid al-Mihdhar - who lived at Parkwood for several months prior to the attacks.\nThe federal judge in the 9/11 families' lawsuit in New York found a year ago that the evidence created \"a reasonable inference\" that Bayoumi and a Saudi diplomat based in the US had been \"co-ordinating with the Saudi government when providing assistance to the hijackers\".\nThe judge's ruling has allowed the families' case to move forward. Saudi Arabia is appealing it and, together with Bayoumi, has always denied the allegations.\nEver since the attacks, Bayoumi has been the subject of reporting and speculation.\nRatchford - who saw him interacting with the hijackers and witnessed him providing a crucial act of support for them - has given a sealed declaration to the New York court.\nBut she has never spoken publicly about what she saw.\nFinding Holly Ratchford was not easy.\nAfter unwittingly becoming embroiled in the investigation into what the US government has described as \"the most egregious criminal act on American soil in modern history\", she moved about as far from humanity as you can get in the United States.\nI tracked her down to the high desert in the western US - rattlesnake country. She told me she avoided the news, and definitely did not speak to journalists. But, to my surprise, she agreed to talk.\nHer interview with me casts doubt on the version of events Bayoumi has told police, the FBI and the New York court, and features in the BBC Radio 4 podcast, Intrigue: A 9/11 Story, and an upcoming BBC Panorama, 9/11: The Saudi Connection.\nIntrigue: A 9/11 Story\nTwenty-five years on from the deadliest terror attack in history, Jane McMullen asks why thousands of grieving families are still fighting for answers.\nIn early 1999, Ratchford landed on her feet. Life before then had been untethered - she had moved around, been married, pregnant and divorced before she was 21. But now, aged 27, she had a job she loved and a home.\nAs the new property manager of Parkwood Apartments, a squat complex of 175 low-rise apartments and townhouses in the San Diego suburbs, she says she excelled. Properties were never empty for long. But it was not the paperwork, nor the healthy pay check, that made the job a dream, it was the people.\nRatchford not only worked at Parkwood, she lived there too. Her clients were also her neighbours. And many were more than that - she says they became her friends.\n\"I always told my staff: 'You make them feel like this is their home, and they'll stay,'\" she recalls.\nAs Ratchford made her mark at Parkwood, she was happy and secure in the world she had built - a world in which she knew everyone and everything.\nThen, things fell apart in a dramatic and unexpected way.\nOmar al-Bayoumi moved into Parkwood claiming to be a ", "translation_ja": "", "vocab": [{"word": "egregious", "definition": "非常に悪質で許しがたい、極めて悪い行為を指す形容詞。政治やメディアで深刻な犯罪や不正を強調する際に使用される。"}, {"word": "embroiled", "definition": "深く関わってしまう、巻き込まれるという意味の過去分詞。通常はネガティブな状況や紛争に意図せずして巻き込まれることを表す。"}, {"word": "facilitate", "definition": "何かが起こりやすくする、援助する、促進するという意味の動詞。ビジネスや法律用語として、ある行為を支援または容易にすることを指す。"}, {"word": "sealed declaration", "definition": "法廷に提出されるが公開されない秘密の宣言書。法的手続きにおいて、プライバシー保護や安全上の理由から非公開とされる証拠を指す。"}, {"word": "inference", "definition": "与えられた事実や証拠から論理的に導き出される結論。法律用語として、直接の証拠なしに状況から合理的に推測できることを意味する。"}, {"word": "untethered", "definition": "束縛されていない、固定されていない状態を表す形容詞。比喩的に安定性や方向性を欠いた生活状態を描写する際に使われる。"}]}, {"title_ja": "ネパール洪水で行方不明のイギリス人33人", "title_en": "33 British Nationals Missing in Nepal After Deadly Floods", "summary_ja": "壊滅的な洪水と土砂崩れによってネパール国内で行方不明となったイギリス人33人の家族が現地へ向かっている。この災害により少なくとも538人が死亡し、イギリスは危機対応チームをカトマンズに派遣している。行方不明者には巡礼者や看護師、チベット国境付近にいた家族が含まれており、さらなる洪水の危険性があるにもかかわらず捜索活動は継続している。", "summary_en": "Families of 33 missing British nationals are traveling to Nepal following catastrophic floods and landslides that killed at least 538 people. The UK is deploying a crisis response team to Kathmandu, and the missing include pilgrims, nurses, and families who were near the Tibet border when the disaster struck. Search efforts continue despite risks of further flooding, with some operations being coordinated by Chinese authorities.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c93v70w79gxo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Who are the 33 British nationals missing in Nepal?\n- Published\nFamilies are flying out to Nepal to help the ongoing search for 33 British nationals still missing after deadly floods hit the country.\nThe brother of Neetu Goyal Tiwari, one of the missing Brits who has not been seen since Wednesday, has appealed to officials to locate his sister.\n\"Please help us find her\", Naresh Goyal told the BBC as he struggled to hold back his emotions.\nOn Friday, Nepalese authorities named 573 tourists who are still missing in the country and despite fears of a second wave of flooding, search efforts have continued.\nTo help, the UK is deploying a rapid deployment team to Nepal to support British nationals affected in the region.\nThe specially-trained crisis response team is expected to arrive in Kathmandu on Saturday, a move that follows Prime Minister Andy Burnham's pledge of £5m worth of humanitarian support for relief and recovery efforts.\nAnd as rescue efforts continue in the aftermath of the disaster which killed at least 538 people, details of the missing are slowly emerging.\n- What we know about deadly Nepal-Tibet floods \n  - Published6 hours ago\nTiwari, 51, had travelled to Nepal to take part in the Kailash Mansarovar Yatra pilgrimage, which was \"her dream\", her brother Naresh Goyal told the BBC.\nShe travelled to Delhi from London before heading to Kathmandu on 14 August with a group from the spiritual organisation Isha Foundation.\nTiwari was expected to return to India on Thursday and meet her brother and parents. But now, the family is desperately searching for answers.\n\"We have called every helpline given by the Indian government and reached out to the British Embassy in Kathmandu as well,\" Goyal said.\n\"Please help us find her,\" he said, his voice breaking. \"We are all very scared.\"\nNeetu's husband, Shantanu, added she had been at the Gyirong checkpoint when the floods struck, so the search for her is being coordinated by China.\nAnant Patel told BBC Your Voice that he is still waiting for news on his missing parents, Bipin and Mala Patel, who are from Coventry.\nThe 29-year-old believes his parents - who are also on a pilgrimage - crossed into Tibet from Nepal moments before the the landslide hit the Gyirong border crossing.\nHe and his brother Deepesh are in touch with the Foreign and Commonwealth Office, and he told the BBC: \"It's a difficult situation for us all, and we are doing our best to stay strong as best as we can in the circumstances.\"\nPramod Poudel, who lives in Uckfield in East Sussex, told the BBC he has not heard from his wife Sumitra Sapkota and family since the flood hit on Wednesday.\n\"It's a very, very difficult time for me and for my family and my country at this moment, but obviously I have to go and see what's happening there,\" he said.\nPoudel, who goes by the name Pedro, said he is travelling home to Nepal because \"my family needs me\".\nThe daughter of Hemangini Patel, 65, said she is still yet to hear from her mother or her aunt Hema Amin, 63.\nPatel told BBC Your Voice her mother's last known location is from a TikTok video shared at 06:00 Nepal time, crossing into Tibet.\nShe said her mother and aunt had been travelling with the Alpine Eco Trek tour when the flooding hit.\n\"We are trying to get through to British embassy in China but can't even get through,\" Patel said.\nEssex nurse Rajendra Pudasaini said his relatives were \"swept away\" by the floods.\n\"My wife's auntie and uncle, and their granddaughter and her husband are missing, and my godson as well,\" he said.\n\"They're gone. The speed the water came, they couldn't be saved, they were just swept away.\"\nTanay Ranjan told the BBC he hasn't heard from his older brother Ankit Ranjan, 39, and sister-in-law Ankita Chandra, 35.\nHe said he'd last heard from Ankit on 26 August when he had been travelling with tour operator Kailash Journey on a pilgrimage.\nThe whole group is now missing, Ranjan said, adding: \"We don't know if they crossed the border... We don't have a clue where they are. We are very much devastated.\"\nAlso missing is Sarada Simkhada, a senior nurse at Darent Valley Hospital in Kent.\nHer brother Shambhu said that her family was desperately waiting for news of her safety after she lost contact with her relatives while on a pilgrimage to Mount Kailash.\n\"My dear sister, wherever you are, please stay strong. We are praying for your safety every moment and waiting desperately for you to return home,\" he wrote on social media.\nA family of four, including an 18-year-old A-Level student and a 13-year-old girl, from Surrey are also among the missing.\nSpandan Sahu, 18, was in Nepal with his father Santosh Sahu, 46, his mother Surabhi Manmath Padhy, 44, and sister Syna Kumari Sahu, 13.\nSpandan had just finished his A-levels at Royal Grammar School Guildford.\nIn a statement, a spokesperson for the school said: \"It is with great concern that we have been informed that a former student, along with members of his family, have been reported missing ", "translation_ja": "", "vocab": [{"word": "humanitarian", "definition": "人道的な、または人道支援に関する。被災地の救援や復興支援などの人命救助目的の活動を指す。"}, {"word": "pilgrimage", "definition": "宗教的な聖地への巡礼の旅。信仰心からの参詣や霊的な目的地への旅程を表す。"}, {"word": "cordoned", "definition": "ロープや柵で区域を仕切る、または隔離する。捜索や危険地域の立入制限に用いられる。"}, {"word": "landslide", "definition": "斜面の土砂が大量に崩落する現象。山地での自然災害の一種。"}, {"word": "deployment", "definition": "人員や資源を配置すること、または派遣すること。緊急時の組織的な人的配置を意味する。"}, {"word": "devastated", "definition": "深刻な被害を受けた、または精神的に打ちのめされた状態。肉体的・心理的な大きなダメージを表す。"}]}, {"title_ja": "英国の銀行休場の週末、強風と雷嵐が予報される", "title_en": "Strong winds and thunderstorms set to disrupt UK bank holiday weekend", "summary_ja": "英国は今回の銀行休場の週末に劇的な天候の変化に直面し、最近の熱波に代わって豪雨、雷嵐、強風が予想されています。イングランド南部とウェールズは最悪の状況に見舞われ、時速50マイルまでの突風と局地的な洪水を引き起こす可能性のある豪雨が予想されています。フェスティバル参加者は地域によって条件が大きく異なるため、時間ごとの予報を確認する必要があります。", "summary_en": "The UK faces a dramatic weather shift this bank holiday weekend, with heavy rain, thunderstorms, and strong winds replacing the recent heatwave. Southern England and Wales will experience the worst conditions, including gusty winds up to 50mph and torrential downpours that could cause flash flooding. Festival-goers should check hourly forecasts as conditions will be highly variable across regions.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/weather/articles/c1l6g7gqm37o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Strong winds and thunderstorms kick off the bank holiday weekend\n- Published\nAfter weeks of scorching heat and drought the summer's swan song is set to be one of frequent downpours as well as gales for some.\nAreas of heavy rain and showers are expected to sweep across parts of the UK on each day of the weekend, which is a bank holiday for many.\nThis could make for some soggy moments at many of the festivals taking place over the coming days.\nStrong winds and gales may also cause problems for travellers and holidaymakers in southern parts of the UK.\nWill it rain everywhere this weekend?\nLet us start with the good news - for many of us it won't be a complete washout of a weekend. It is certainly worth looking deeper into your weather app forecasts to see the hourly breakdown as showers can sometimes be tricky to forecast.\nMost areas will still see some drier and sunnier moments through the three days, with parts of north and west Scotland perhaps seeing very little rainfall at all. During the sunnier spells the late August sunshine still has enough strength to make it feels reasonably warm too.\nHowever, on Saturday the forecast shows several zones of heavy showers sweeping across England and Wales especially. Like recent days some of these could be torrential and thundery, especially in the southern half of England and Wales. For northern parts of England the showers are likely to merge into longer spells of rain during the afternoon.\nGiven the downpours already this week, some parts of the Midlands and northern England are more susceptible to the risk of flash flooding.\nA large portion of Scotland and Northern Ireland will stay dry.\nSunday may start dry and bright for many, perhaps with some mist and fog patches in central and northern areas of the UK.\nIt is northern parts this time where there may be some early showers, but through the afternoon another zone of heavy and thundery showers are expected to sweep across the country from the west. For some in East Anglia and south-east England it may stay dry until late in the day.\nSouth-eastern parts of the UK might get lucky again on bank holiday Monday. Scattered showers in the west during the morning will gradually develop more widely through the day, but these shouldn't be as intense as those on the previous two days.\nGusty winds in southern areas\nIf bouts of rain wasn't enough, parts of southern England and Wales will be buffeted by strong winds at times too. This may make travel and camping a challenge at times.\nThe strongest winds of the weekend are expected on Saturday across southern counties of England and Wales as well as the Channel Islands. Some hills and coasts could experience gusts of 40 to 50mph.\nMonday will be a blustery day more widely across the UK, but again it will be southern areas seeing the strongest gusts - generally 30-40mph.\nThis will make for a cooler feeling spell of weather at times. Throughout the weekend temperatures across the UK will be around 15 to 22 Celsius, a shade below the average for the time of year.\nWith numerous festivals on this weekend, including Reading and Leeds, Creamfields and the Notting Hill Carnival it is worth keeping across the forecast. Should any weather warnings be issued you can find them on your BBC Weather app or on our website.\n  - Published11 August\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "swan song", "definition": "最後の作品や活動のこと。ここでは夏の終わりの時期を指しています。"}, {"word": "torrential", "definition": "激しく大量に降る（雨など）ことを意味する形容詞。時間当たりの降雨量が非常に多い状態を表します。"}, {"word": "susceptible", "definition": "〜の影響を受けやすい、〜に対して脆弱である、という意味の形容詞。here, susceptible toで「〜の危険性が高い」と表現します。"}, {"word": "gusty", "definition": "突風が吹く、阿吹く風が不規則である、という意味の形容詞。天気予報では強い風が時々吹く状態を表します。"}, {"word": "buffeted", "definition": "（風などで）激しく打ち叩かれる、揺さぶられるという意味の動詞の過去分詞形。ここでは強い風に襲われることを表します。"}, {"word": "blustery", "definition": "風が強く吹く、荒々しい天気である、という意味の形容詞。不安定で風の強い気象状況を表現します。"}]}, {"title_ja": "需要が供給を上回る中、イングランドが水不足危機に直面", "title_en": "England Faces Water Shortage Crisis as Demand Outpaces Supply", "summary_ja": "気候変動と消費量増加により、イングランドは2055年までに日量50億リットルの深刻な水不足に直面する可能性がある。農民はすでに干ばつ時に灌漑制限を経験しており、根本的な原因はイングランド住民がデンマーク人より1人当たり約40%多くの水を消費していることにあり、これはシャワー頻度の増加と節水を促さない低い水道料金が一因である。", "summary_en": "England could face a severe water shortage by 2055, with projections showing a daily deficit of five billion litres due to climate change and increased consumption. While farmers already experience irrigation restrictions during droughts, the root cause lies in English residents consuming nearly 40% more water per person than Danes, partly due to higher shower frequency and lower water prices that fail to incentivize conservation.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyrv84yd9ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "One evening in early August, farmer Daniel Sizer's phone buzzed with a message.\nIt was from his local water board and it read: \"River levels are low but have recovered enough to allow one night of irrigation tonight.\"\nLike much of the lower half of England, Daniel's fourth-generation farm had seen barely any rain in nearly three months.\nHe shows us what is left of the peas and wheat crop at his 300-hectare site in Suffolk.\n\"There's no water in the river so half my crop is completely and utterly ruined.\"\nWith river levels falling so low that taking any more water out of them risked endangering wildlife, in July the Environment Agency (EA) temporarily stopped Daniel and thousands of other farmers from watering their crops from the river.\nEngland has long been used to hosepipe bans over the summer.\nBut what Daniel has experienced points to something newer and more worrying. The kind of increasingly frequent heatwaves and greatly reduced rainfall that we have seen over successive summers, plus a projected increase in demand for water, have raised the prospect that England could at some point run out of water.\nThe result could be that by 2055 England will face a shortfall of five billion litres in public water supply a day, almost enough to fill Wembley Stadium four and a half times daily. A mixture of low rainfall, high temperatures and demand put pressure on water supply in England more so than elsewhere in the UK.\nIt is all a far cry from when, in 1818, John Keats wrote: \"It is impossible to live in a country which is continually under hatches… Rain! Rain! Rain!\"\nBut what is really to blame for England finding its water supply so under threat? And are there ways of securing its future?\nGrowing consumption\nBack in the 1980s, people in England and Denmark were using water at a similar rate. But no longer.\nResidents in Denmark now consume 97 litres of water per person per day, according to Danva, the country's water and wastewater industry body. The daily consumption per person in England is 136.5 litres.\n\"We've actually doubled the amount of water we use per person, on average, in the last 50, 60 years,\" points out Nicci Russell, who runs Waterwise, a water efficiency campaign organisation.\nShe points to changing habits over generations - from a family having a shared bath once a week to having multiple showers a week, sometimes a day.\nHouseholds are responsible for nearly 60% of water use in England and Wales. If we had domestic water consumption patterns more like Denmark, Russell says, more than half the 2055 shortfall would be wiped out.\nSo how could water use in England come down to the levels seen in Denmark?\nRussell says, even with projected population growth, if everyone in England knocked a minute off their shower time, for example, it would save nearly one billion litres of water a day by 2050.\nBut water companies have been running campaigns urging us to use less water, seemingly with limited success.\nWill Willoughby, director of water supply at Wessex Water, acknowledges that the negative public perception of the water industry has limited the impact of the message, and the government may be better placed to deliver it.\n\"I think that would absolutely go a long way to… undoing some of the disdain towards the water companies and get people on board to help look after our water resources.\"\nWhat really separates England and Denmark is price. As well as water meters being mandatory in Denmark, they also pay far more for their water than we do here.\nDespite climbing water bills across the UK - and with them outrage aimed at water companies who stand accused of paying dividends to shareholders when they should have been investing in infrastructure - there is an argument to be made that consumers are actually not paying enough.\nIn Denmark, the average cost of water and wastewater is £9.45 per cubic metre, here it is significantly lower. Thames Water - one of the cheapest - charges £4.21 and Southern the most expensive at £7.06.\nDaniel Johns, managing director of Water Resources East, an organisation working with farmers, water companies and local authorities, says water in England is \"too cheap\".\n\"People assume that it will always be readily available. And we need to wean ourselves off that kind of idea that water will always be there.\"\nAs it happens, price increases in Denmark were originally implemented for improved sewage treatment, the same reason people in England now face rising bills.\nThe behaviour change followed naturally as people became more careful with using the newly expensive utility, and it became embedded in the culture. School children have outings to waterworks to understand how precious the resource is, and households have embraced water-saving devices for shower heads and toilet cisterns.\nThis summer commentators have been discussing surge charging in England - higher rates for those using more water - but as prices are fixed in advance this is not possible under industry regulations.\nFe", "translation_ja": "", "vocab": [{"word": "shortfall", "definition": "必要とされる量と実際に供給される量の不足分のこと。特に経済や資源管理の文脈で用いられます。"}, {"word": "consumption", "definition": "商品やサービス、資源が使用・消費される量のこと。この文脈では水の使用量を指しています。"}, {"word": "embedded", "definition": "文化や習慣として深く組み込まれている、根付いているという意味。"}, {"word": "surge charging", "definition": "使用量が多いほど料金が段階的に高くなる料金体系。需要抑制を目的とします。"}, {"word": "incentivize", "definition": "人々にある行動をするよう動機づけることを意味します。通常は報酬や罰則を通じて行われます。"}, {"word": "infrastructure", "definition": "水道、電気、道路などの公共施設やシステムの総称。社会基盤を支える基本的な構造です。"}, {"word": "disdain", "definition": "ある対象に対する軽蔑や嫌悪感。この場合、水道会社に対する国民の否定的な感情を指しています。"}]}, {"title_ja": "米国とベネズエラが「歴史的な」石油取引を発表", "title_en": "US, Venezuela announce 'historic' oil deal", "summary_ja": "米国とベネズエラが、米国にベネズエラの石油埋蔵量650億バレルへのアクセスを与える大規模な石油協定を発表しました。国務長官マルコ・ルビオと国防長官ピート・ヘグセスがベネズエラ暫定大統領デルシー・ロドリゲスと交渉したこの取引は、ベネズエラに1000億ドルの民間投資と2090億ドル以上の税収をもたらすと予想されています。この協定は、米国がニコラス・マドゥーロを権力から排除してから9ヶ月後に発表されました。", "summary_en": "The United States and Venezuela have announced a major oil agreement that would give the US access to 65 billion barrels of Venezuelan oil reserves. The deal, negotiated by Secretary of State Marco Rubio and Defense Secretary Pete Hegseth with Venezuelan interim President Delcy Rodriguez, is expected to bring $100 billion in private investment and over $209 billion in tax revenue to Venezuela. The arrangement comes nine months after US forces removed Nicolas Maduro from power.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-venezuela-announce-historic-oil-deal/a-78553607?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US, Venezuela announce 'historic' oil deal\nAugust 29, 2026\nUS President Donald Trump said on Friday the US had reached a deal to take control of part of Venezuela's vast oil reserves.\nHe said the deal was negotiated by Secretary of State Marco Rubio, Defense Secretary Pete Hegseth and Venezuelan interim President Delcy Rodriguez.\n\"The United States of America has just entered into an agreement with the country of Venezuela on, THE BIGGEST OIL DEAL IN WORLD HISTORY!\" Trump wrote on his Truth Social platform.\nHe added that it would be \"at no cost to the American taxpayer.\"\nRodruiguez welcomed the \"historic\" deal that would \"have a significant impact on the rebirth of our nation.\"\nShe said it would bring in $100 billion (€86.3 billion) in private investment and generate more than $209 billion in tax revenue for the treasury.\nWhat do we know about the deal?\nFew details were clarified in Trump's initial announcement, but the deal promises to eventually more than double US oil stocks at a time when the strategic petroleum reserve is at a 40-year low.\nTrump said the deal would cover 65 billion barrels worth of oil — a little over a fifth of the country's proven reserves.\nNews agency Reuters reported that one model under consideration would see Venezuelan oil fields leased to US producers.\nAmerican news website Axios, meanwhile, reported that the deal was a kind of \"public-private partnership\" between both governments and US oil companies.\nRubio said the deal would secure \"stable reserves and low-cost oil\" for the US while also driving \"the reconstruction of Venezuela's economy.\"\n\"This deal is a huge win for both the American and Venezuelan people,\" he said.\nThe world's largest oil reserves\nThe deal comes nearly nine months after US forces deposed and kidnapped Venezuelan leader Nicolas Maduro. He is now detained in New York City, where he faces federal narcoterrorism and drug trafficking charges.\nSince then, and under intense pressure, Rodriguez has moved to open up Venezuela's oil sector to American investment.\nVenezuela has the world's largest proven oil reserves totaling 303 billion barrels. But production has long lagged behind other major oil producing countries due to chronic mismanagement, decaying infrastructure and sanctions.\nEdited by: Sean Sinico\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "strategic petroleum reserve", "definition": "国家的な緊急事態に備えて政府が備蓄する石油備蓄量のこと。米国では戦略的に重要なエネルギー資源として管理されています。"}, {"word": "proven reserves", "definition": "現在の技術と経済条件で採掘可能と確認された鉱物資源やエネルギー資源の量のこと。石油やガス産業で頻繁に使用される用語です。"}, {"word": "chronic mismanagement", "definition": "長期間にわたって継続する管理不善や運営の失敗のこと。組織や国家のパフォーマンスが悪化する原因となります。"}, {"word": "public-private partnership", "definition": "政府と民間企業が協力してプロジェクトを実施する仕組みのこと。両者がリスクと利益を共有します。"}, {"word": "narcoterrorism", "definition": "麻薬取引と結びついたテロ活動のこと。麻薬組織が暴力や恐怖を使用して政治的目的を達成しようとする犯罪です。"}]}, {"title_ja": "米当局が極右扇動家ミロ・ヤイアノポロスを逮捕", "title_en": "US Arrests Far-Right Provocateur Milo Yiannopoulos for Overstaying Visa", "summary_ja": "英国の右翼評論家ミロ・ヤイアノポロスが、ニューオーリンズ国際空港でビザ超過滞在の容疑で米移民税関捜査局（ICE）に逮捕されました。彼は入国管理裁判への出頭に失敗した後、国外追放命令を受けていました。かつてトランプ支持者であり厳格な移民政策を推進していた彼は、その後トランプ運動から離別しており、極右活動家ローラ・ルーマーがICEとFBIへの通報を主張しています。", "summary_en": "British right-wing commentator Milo Yiannopoulos was arrested by US Immigration and Customs Enforcement at New Orleans International Airport on Thursday for overstaying his visa after failing to appear at an immigration hearing. Once a Trump supporter and advocate for strict immigration policies, Yiannopoulos has since fallen out with the Trump movement. Far-right activist Laura Loomer claimed credit for reporting him to ICE and the FBI.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-arrests-far-right-provocateur-milo-yiannopoulos/a-78553559?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "US arrests far-right provocateur Milo Yiannopoulos\nAugust 28, 2026\nUS authorities have detained right-wing commentator Milo Yiannopoulos and plan to deport him, the Department of Homeland Security said on Friday.\nImmigration and Customs Enforcement (ICE) agents arrested the British provocateur at New Orleans International Airport on Thursday for overstaying in the US, the department said, describing him as an \"illegal alien from the United Kingdom.\"\n\"Yiannopoulos was issued a final order of removal by an Immigration Judge on July 22, after failing to show up for his immigration hearing,\" the agency said. \"He will remain in ICE custody pending removal.\"\nICE directed family and legal representatives to contact the agency’s office in Alexandria, Louisiana, which serves as a deportation hub for international flights.\nFar-right activist Laura Loomer, who routinely takes credit for action against those who have fallen out with the US president, posted about the incident shortly after.\n\"I was the first person to report on the fact that Milo was in the US illegally where he incited violence against President Trump and worked for Marjorie Traitor Greene,\" Loomer wrote on X, referring to the former US congresswoman Marjorie Taylor Greene who stepped down after a feud with Trump.\nLoomer went on to say that she \"reported him to ICE and the FBI.\"\nYiannopoulos previously supported ICE\nOnce a Donald Trump supporter and advocate of the president's immigration crackdown, Yiannopoulos has since fallen out with the Trump movement.\nYiannopoulos first gained notoriety in the early 2010s as a writer for the right-wing website Breitbart News, where he played a key role in the \"Gamergate\" anti-feminist harassment campaign.\nHe resigned from Breitbart in 2017 after a video of him appearing to condone pedophilia resurfaced online. He later apologized for the remarks.\nYiannopoulos has continued to espouse far-right views, including calling for a stop to immigration and mass deportations.\nAs recently as June last year, he said California \"needs ICE checkpoints at supermarket entrances, gas stations, strip malls, intersections and government buildings, with on the spot deportation for anyone who can't prove they are in the US legally.\"\nCelebrity news website TMZ suggested that Yiannopoulos may have been in New Orleans ahead of a scheduled performance by Ye, the rapper formerly known as Kanye West. Yiannopoulos has worked for Ye in various capacities, first as part of his aborted 2024 presidential campaign, followed by a brief stint at fashion label Yeezy, and most recently as a personal spokesperson.\nEdited by: Sean Sinico\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "provocateur", "definition": "意図的に対立や議論を引き起こすことを目的とした人物。政治的または社会的議論において、故意に炎上や反発を招く行動をとる人を指します。"}, {"word": "overstay", "definition": "ビザやパスポートの有効期限を超えて滞在すること。許可された期間を超えて外国に留まる違法行為です。"}, {"word": "espouse", "definition": "特定の思想や信念を支持し、積極的に推進すること。公開的にまたは個人的に信念を採用し、主張することを意味します。"}, {"word": "condone", "definition": "不正な行為や悪い行動を暗黙のうちに認める、許容する。明確に許可はしないが、見て見ぬふりをすること。"}, {"word": "notoriety", "definition": "否定的な理由で広く知られていること。悪評や悪行によって有名になることを指します。"}, {"word": "aborted", "definition": "計画されていた活動や事業が中止されたこと。完成前に、または途中で中断されたことを意味します。"}]}, {"title_ja": "スペイン、セウタの移民処理でフロンテックスに支援を要請", "title_en": "Spain Requests Frontex Assistance for Ceuta Migrant Processing", "summary_ja": "スペインは、7月のモロッコからの越境に伴い、セウタに留まる数千人の移民を処理するため、EU国境警察機関フロンテックスからの支援を要請しました。7万人の移民のうちほとんどが速やかに国外退去させられましたが、約5,000人がスペイン領土に留まっており、国際法は個別審査なしの一括国外退去を禁止しています。地元住民の怒りが高まっており、暴力的な抗議活動が発生し、スペインは本土への移送を排除しています。", "summary_en": "Spain has requested help from the EU's Frontex agency to process thousands of migrants remaining in Ceuta following a July crossing from Morocco. Though most of the 70,000 migrants were quickly deported, approximately 5,000 remain in the Spanish territory, and international law prohibits mass deportations without individual assessments. Local residents' growing anger has led to violent protests, with Spain ruling out mainland relocation.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/spain-asks-eu-s-frontex-for-help-in-processing-ceuta-migrants/a-78553545?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Spain asks Frontex for help in processing Ceuta migrants\nAugust 28, 2026\nSpain has asked for help from the European Border and Coast Guard Agency (Frontex) in processing migrants who crossed into Ceuta last month and still remain in the North African Spanish territory.\nSpanish Interior Minister Fernando Grande-Marlaska sent a request to Beate Gminder, the European Commission's director general for migration and home affairs, to help with screening migrants in Ceuta.\nMadrid has also requested 10 more Frontex officers to help with the screening.\nFrontex is the European Union agency responsible for managing the bloc's external borders and fighting cross-border crime.\nWhy is Spain asking for help with the Ceuta migrants?\nOver 70,000 migrants crossed from Morocco to Ceuta illegally in late July. The incident triggered a massive EU migration emergency and brought Spain's leftist government much criticism.\nThough the majority of people were quickly sent back to Morocco, at least 5,000 migrants still remain in the Spanish territory of roughly 80,000 residents.\nMadrid cannot deport the remaining migrants quickly as a collective return without individual assessment is prohibited under international law and Spanish court rulings.\nRising anger against migrants in Ceuta\nCeuta's residents loudly reject the migrants' continued presence and have made their voice heard via protests which have sometimes turned violent.\nSpain has ruled out moving the migrants into the mainland as that would invite further criticism from the opposition as well as some EU members.\nMigrants have set up camp on Trampolin Beach, where some tents have been attacked and set on fire amid the residents' rising anger.\nOn Thursday, protests turned violent with 12 migrants arrested after stoning an army vehicle, injuring one soldier and other migrants. Spanish newspaper El Pais reported that 11 migrants were expelled from the territory, citing sources from the city's main court.\nEdited by: Sean Sinico\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "screening", "definition": "移民や渡航者などを安全保障上の観点から審査・検査するプロセス。申請者の身元確認や背景調査を含む。"}, {"word": "deport", "definition": "違法入国者や国籍保持者でない者を法的に本国に送り返すこと。政府が強制執行する国外退去。"}, {"word": "cross-border crime", "definition": "国境を越えて行われる犯罪活動。密輸、人身売買、不法移民など複数の国にまたがる違法行為。"}, {"word": "incident", "definition": "重大な出来事や事件。特に国際関係や公共問題における予期しない出来事を指す。"}, {"word": "collective return", "definition": "複数の人を一括で本国に送り返すこと。国際法では個別の事情を考慮する必要があるため制限される。"}, {"word": "invoke", "definition": "法律や規則を引き合いに出して適用する、または支援を求める。権利や理由を主張する行為。"}]}, {"title_ja": "カリフォルニア州の女性がネパール洪水から生存、「蛇のように立ち上がっていた」", "title_en": "California Woman Survives Deadly Nepal Flood: 'It Stood Like a Serpent'", "summary_ja": "カリフォルニア州のアンジャナ・ラージャ氏は、高さ50フィートに達するネパールの壊滅的な洪水から生き残った恐ろしい経験を語った。彼女は、大量の水が近づいてくる中で、夫と一緒に取った一瞬の決断について説明している。彼女の証言は、この致命的な自然災害の第一人称の視点を提供している。", "summary_en": "Anjana Raja of California recounts her harrowing experience surviving a devastating flood in Nepal that reached heights of 50 feet. She describes the split-second decision she and her husband made as the massive wall of water approached them. Her account provides a firsthand perspective on the deadly natural disaster.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/stood-serpent-staring-us-american-survived-deadly-nepal/story?id=136030121", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間速報ニュース配信", "title_en": "ABC News Live: 24/7 Breaking News and Live Event Coverage", "summary_ja": "ABCニュースライブは、世界中の速報ニュースと重大なライブイベントを24時間体制で配信するプラットフォームです。リアルタイムレポートと分析により、視聴者は進展する事件について常に最新情報を得ることができます。", "summary_en": "ABC News Live provides continuous, around-the-clock coverage of breaking news and major live events from around the world. The platform delivers real-time reporting and analysis to keep viewers informed of developing stories as they unfold.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、ガソリン価格低下を目指す米国・ベネズエラ歴史的石油取引を発表", "title_en": "Trump Announces Historic US-Venezuela Oil Deal to Lower Gas Prices", "summary_ja": "ドナルド・トランプ大統領は、米国とベネズエラが数十億バレルの石油埋蔵量の大多数の支配権を米国に与える重要な石油取引に達したと発表した。トランプ大統領は、この合意がアメリカ消費者のガソリン価格低下に役立つと主張している。この取引は米国・ベネズエラ関係における大きな転換を示している。", "summary_en": "President Donald Trump announced that the U.S. and Venezuela have reached a significant oil deal giving the U.S. majority control of billions of barrels of oil reserves. Trump claims the agreement will help lower gas prices for American consumers. The deal marks a major shift in U.S.-Venezuela relations.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/trump-announces-historic-us-venezuela-oil-deal-lower/story?id=136046002", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウィーンの美術館で盗まれたエジプト王妃の673ダイヤモンドネックレス", "title_en": "Egyptian Queen's 673-Diamond Necklace Stolen in Vienna Museum Heist", "summary_ja": "2人の男がウィーンの応用美術館で、200カラットのプラチナネックレス（673個のダイヤモンド付き）を昼間に盗み出した。このネックレスはかつてエジプトのナズリ王妃が所有していたもので、評価額は430万ドルであった。この盗難は、ヨーロッパ全域で多発している美術館からの盗難事件の一部である。", "summary_en": "Two men stole a 200-carat platinum necklace with 673 diamonds from Vienna's Museum of Applied Arts during a daytime smash-and-grab raid. The necklace, once owned by Egyptian Queen Consort Nazli, was valued at $4.3 million. The theft is part of an escalating wave of high-profile museum robberies across Europe.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/artanddesign/2026/aug/28/egyptian-queen-diamond-necklace-stolen-vienna-raid", "state_media": false, "category": "社会", "full_text": "Austrian police are hunting two men alleged to have stolen a 200-carat platinum necklace encrusted with 673 diamonds that was on loan to a museum in Vienna and once belonged to Egyptian royalty.\nAuthorities in the capital released pictures of the suspects captured by security cameras during the heist at the Museum of Applied Arts (MAK), amid a rash of spectacular smash-and-grab thefts from European cultural institutions.\nThe unmasked men bought tickets to the exhibition before shattering a glass display case with a hammer during opening hours on Thursday afternoon and making off with the diamond necklace.\nIn an appeal for information from the public, police said: “The perpetrators fled with the jewellery in an unknown direction.”\nOfficers fanned out through the city centre and deployed a police tracking dog to search for the suspects. The Kronen newspaper said investigators believed the men were probably carrying out a “contract job” on behalf of a criminal gang.\nMAK said the piece had been snatched from a jewellery exhibition that had been on display since June, featuring more than 300 works by the French designers Van Cleef & Arpels. No one was hurt, although there were several witnesses in the room at the time.\nDocumentation for the show said the necklace once belonged to Queen Consort Nazli of Egypt, who wore it at the 1939 wedding of her daughter Fawzia to Iran’s then crown prince, Mohammad Reza Pahlavi, who later became shah. The necklace was sold by Sotheby’s in New York in 2015 for $4.3m.\nThe MAK said the exhibition brought together about 200 “unique and rarely seen objects” from its own collection and pieces spanning the 120-year history of the Parisian jewellery house, from the Van Cleef & Arpels patrimonial collection.\nA guided tour planned for Friday afternoon was listed as “cancelled” on the museum website and the exhibition, which was due to end on 27 September, was temporarily closed.\nEuropean museums have been hit by a string of high-profile heists since thieves broke into the Louvre museum in Paris during the day last October and escaped within minutes with crown jewels worth €88m.\nIn Spain on Thursday, thieves raided the Treasure of Villena, a collection of bronze age gold artefacts described as one of Europe’s most important prehistoric hoards.\nThis month, four of the most important works by the 15th-century Renaissance master Antonello da Messina were stolen during a national holiday from a museum in the Sicilian port city of Messina.\nTwo days earlier, Italian police said they had recovered three paintings by the French masters Paul Cézanne, Pierre-Auguste Renoir and Henri Matisse that were taken this year from a private museum near the northern city of Parma.\nA report by Europol this month found that robberies at European museums are becoming increasingly violent, with thieves sometimes brandishing guns, assaulting staff and using sledgehammers, axes and even explosives to smash their way to targeted loot.", "translation_ja": "", "vocab": [{"word": "smash-and-grab", "definition": "素早く侵入して物を盗み出す強盗行為のこと。ガラスを割るなど暴力的な手段を使うことが特徴。"}, {"word": "perpetrators", "definition": "犯罪や悪い行為を実行した人々のこと。加害者や犯人を指す法律用語。"}, {"word": "contract job", "definition": "他の人や組織に依頼されて実行される仕事のこと。特に犯罪組織に指示された違法行為を意味する。"}, {"word": "heist", "definition": "大規模な盗難事件や強盗のこと。特に計画的で大胆な盗難を指す。"}, {"word": "patrimorial collection", "definition": "企業や機関が長年保有する文化的・歴史的価値のある所蔵品。遺産として守られるべき重要なコレクション。"}, {"word": "escalating", "definition": "事態や問題が次第に大きくなったり悪化したりしていく様子。段階的に増加すること。"}]}, {"title_ja": "メタの米国和解：グローバルな説明責任の問題が未解決のまま", "title_en": "Meta's US Settlement: A Limited Victory That Leaves Global Accountability Questions Unanswered", "summary_ja": "メタは若年層向けの依存性の高い製品に関連する訴訟で米国の29州と180億ドルで和解し、利用時間制限とプラットフォーム変更に同意しました。しかし、この和解はフェイスブックが暴力的投稿を拡散した後に父親が殺害されたアブラハム・ミアレグの事件のようにアルゴリズムの増幅問題に対処しておらず、他の司法管轄区域での訴訟は未解決のままです。", "summary_en": "Meta settled a $18bn lawsuit with 29 US states over addictive products targeting young people, agreeing to implement usage limits and changes to its platforms. However, the settlement does little to address algorithmic amplification issues that have caused real-world harm globally, as cases like that of Abrham Meareg—whose father was killed after Facebook promoted violent posts—remain unresolved in other jurisdictions.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/technology/2026/aug/28/meta-facebook-us-lawsuit-settlement-world-impact", "state_media": false, "category": "政治", "full_text": "In October 2021, Abrham Meareg’s father, a professor of chemistry in Ethiopia’s northern town of Bahir Dar, was shot at close range and died outside his family home. This was in the middle of the country’s civil war.\nFor weeks, Facebook’s algorithm had actively promoted posts calling for the academic to be murdered, according to Meareg and Foxglove, a nonprofit organisation supporting Meareg’s lawsuit against the company in Kenya. These posts included photos of his father and his home address.\nMeareg filed the lawsuit in 2022. He said he repeatedly asked Facebook to remove the posts and the company did nothing. Nearly four years later, the case has still not been heard. Foxglove said Meta, Facebook’s parent company, had “fought tooth and nail to avoid responsibility”.\nMeareg said: “It’s a matter of numbers to them, a matter of statistics. It has been proven multiple times that our lives do not matter to them.”\nOn Wednesday, Meta settled a lawsuit brought by 29 US states who argued it had designed addictive products that hooked young people. The social media company agreed to pay $18bn and to change certain features of its platform in the US. California’s attorney general said it was a victory that would make “a world of difference for children and their families”.\nBut elsewhere in the world, in jurisdictions as far flung as Amsterdam and Nairobi, other claims have yet to be heard. Far bigger questions about the power of a single US technology company to shape politics and democracy everywhere on Earth are still to be answered.\nFor the US, the settlement is a victory. A jury has done what the US Congress could not – put controls on a powerful tech company. As a part of the settlement, Meta has said it will set time limits on children’s use of its platforms Facebook and Instagram and block night-time usage.\nFor Meta, the settlement is also a victory. Its share price rose in the hours after the deal was announced. Its CEO, Mark Zuckerberg, was not forced to testify. The sum it is to pay, while not meaningless, is far less than the states had sought – $200bn – or the amount Meta itself had suggested in a court filing it might have to pay, which was up to $1.4tn.\nFor the rest of the world, however, the picture is more mixed. The limits Meta will put on its US platform are, in large part, similar to limits the UK and Australia have already achieved through regulation. There are certain concessions Meta has now made that other governments could also demand: for example, while the UK plans to ban under-16s from social media platforms, it may wish to ask Meta to impose a default daily use limit of two hours for under-18s, which is what the company has agreed to in the US.\nNone of this meaningfully changes the equation for Meareg or what his case represents, which is that a massive US company, unaccountable to voters, unbound by transparency requirements, owns a worldwide digital commons that shapes reality for billions of people.\nWhether courts and governments outside the US have the power to confront this fact is a far thornier question.\nThe central issue of Meareg’s case is Meta’s algorithm. This is the system that decides what content to show users of Facebook and Instagram. It sees you linger over a video about knitting sweaters, for example, and then decides you’ll like one about how to care for your spider plant.\nIt sees teenage girls watch diet content and shows them anorexia influencers. It sees young men search for bodybuilding content and shows them Andrew Tate. It is alleged to have amplified content that promoted the ethnic cleansing of the Rohingya in Myanmar. It contributed to the election victory of Donald Trump.\nMeareg’s lawsuit rests on the claim that this algorithm promoted the posts that called for the death of his father, and that Facebook’s sparse moderation in east Africa did almost nothing to prevent this.\nIn the early days of the Meta trial in the US, it seemed plausible that states would push the social media firm to finally make some changes to this algorithm. Those changes had the potential to fundamentally alter how the company does business. Meta’s algorithm is intended to keep users scrolling, stuck on the platform, and then it shows them ads.\nBut that is not what appears to have happened. The terms of the settlement will slightly change what is shown to minors, in that they will not necessarily have personalised feeds. But it is hard to see this concession changing the equation in war zones or creaking democracies.\nArturo Béjar, an ex-Facebook employee and whistleblower, said the limitations were “the equivalent of saying: ‘Well, you can smoke as many cigarettes as you can in two hours a day.’ It doesn’t make the cigarettes any safer.”\nIt may be up to groups and individuals elsewhere in the world to try to push for these larger changes. It will be an uphill struggle.\nIn Kenya, the high court recently ruled that Meareg’s case against Meta could go ahead, after years of legal manoeuvring", "translation_ja": "", "vocab": [{"word": "algorithm", "definition": "ユーザーに表示するコンテンツを決定するコンピューターシステムの計算方法。このケースでは、プラットフォームがユーザーを引き付けるための特定のコンテンツを優先的に表示する仕組みを指しています。"}, {"word": "amplified", "definition": "拡大された、増幅された。ここでは、有害なコンテンツがソーシャルメディアのアルゴリズムによってより多くのユーザーに見えるようになることを意味します。"}, {"word": "accountability", "definition": "責任を負うこと、説明責任。大規模なテクノロジー企業が自社のプラットフォームでの悪影響に対して責任を取るべきという議論で使用されています。"}, {"word": "jurisdiction", "definition": "裁判所や政府が法的権力を持つ地域。異なる司法管轄区域では異なる規制が適用されることを示しています。"}, {"word": "concession", "definition": "譲歩、譲り合い。ここでは、メタが訴訟で合意した要求や変更を指しており、通常は当初の主張より少ないものです。"}, {"word": "moderation", "definition": "モデレーション、監視・管理。プラットフォーム上の違反コンテンツを削除したり管理したりするプロセスを指します。"}, {"word": "ethnic cleansing", "definition": "特定の民族グループを特定地域から排除することを目的とした暴力的行為。ミャンマーのロヒンギャ問題はこの例です。"}]}, {"title_ja": "英国、エジプト在住の妹の活動に関連して逮捕された英国エジプト系女性の釈放を支援するよう促される", "title_en": "UK Urged to Help Free British-Egyptian Woman Arrested in Cairo Over Sister's Activism", "summary_ja": "45歳の英国エジプト系女性エマン・エルシャズリーが、エジプト政府を批判するYouTubeチャンネルを運営する妹のために、8月16日にカイロで逮捕されたと主張されている。人権団体は、エジプト当局が海外の政治批評家の親族を逮捕して異議を唱える行為を沈黙させるパターンを記録しており、英国外務省は介入するよう促されている。エマンの弁護士は、彼女は政治的関与がなく、病気の母の世話をするために訪問しただけだと主張している。", "summary_en": "Eman el-Shazly, a 45-year-old British-Egyptian woman, was arrested in Cairo on August 16 allegedly because her sister Mona runs a YouTube channel critical of the Egyptian government. The UK Foreign Office has been asked to intervene, as human rights organizations have documented a pattern of Egyptian authorities arresting relatives of overseas political critics to silence dissent. Eman's lawyer argues she has no political involvement and was merely visiting to care for her ill mother.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/27/uk-urged-to-help-free-british-egyptian-arrested-in-cairo-over-sisters-activism", "state_media": false, "category": "政治", "full_text": "The UK Foreign Office has been asked to intervene to secure the release of a British-Egyptian woman who it is claimed has been arrested in Cairo because of her sister’s political activism.\nEman el-Shazly, a 45-year-old based in Birmingham, was arrested on 16 August while visiting Egypt. Her lawyers say she has been detained in an attempt to silence her sister Mona, a relentless and harsh critic of the Egyptian government on her UK-based YouTube channel.\nHer two brothers have already spent three years in jail and, in May, were rearrested. They were previously held in pre-trial detention, facing charges of “promoting the ideas of a terrorist organisation on social media, as well as broadcasting false news harmful to state security”.\nThe UK Foreign Office has confirmed to the husband of Eman that she is being held in the Ramadan rehabilitation centre and her case has been given the same file number as that of her two brothers, Hassan and Eid.\nThe government of President Abdel Fatah al-Sisi has faced allegations that it frequently arrests relatives of political critics to put indirect pressure on the dissidents to end their overseas criticism of his rule or of state corruption. Much of Mona’s activism focuses on alleged cases of corruption inside the security services or public utilities, a highly sensitive subject in Egypt.\nArfan Rashid, the lawyer acting for Eman’s husband with whom she has four children, says that unlike Mona his wife has never been involved in politics, and had gone to Cairo two months ago to look after her ill mother after the arrest of her two brothers.\n“There is ample evidence that Eman has been arrested to silence Mona,” Rashid said. He added that Eman had told the security officials she was no longer in contact with her sister, and that many family members had repeatedly asked her to stop her political activism in the UK, but to no effect.\nMona confirmed to the Guardian that she had been asked to halt her activism by other family members, including to take down her YouTube videos.\nBut she added: “I have done nothing wrong nor broken any law … I am a very strong woman, but it is very traumatic for me since 11 or 12 children are without their parents. It is a horrible situation, but the Egyptian government will not stop if I appear weak. The government is close to collapsing.”\nRashid said the UK government had recognised the practice of “punishment by proxy” in Egypt in its country profile policy and information note published in March 2026. Human Rights Watch and the House of Commons library warned in 2021 of an escalating pattern in which Egyptian family members of critics living abroad were being targeted.\nMona runs a YouTube channel in the UK that has 130,000 subscribers. She is also active on X, making specific and controversial claims about government officials.\nThe UK’s Foreign Office representation in Cairo has asked for access to see Eman but has not yet received a positive reply.\nEman’s husband, Zeesharn Moustapha, has said Egyptian police and security officers attended the family home where she was staying a few days before the arrest, and demanded that Eman tell Mona to stop publishing material against the Egyptian government.\nOn X, Mona has claimed as many as five members of her family have been detained or harassed by the Egyptian authorities. She wrote: “Kinship is something beyond my family’s will, and I invite them to disown me to save themselves from this despicable, illegitimate dictator. I am the one opposing Sisi, not five individuals from my family. This is a crime against humanity that does not lapse with time.” She has lived in the UK for 18 years.\nEman became a British citizen through marriage. Her lawyer has asked whether Alistair Burt, the UK’s new envoy on complex consular cases, should be asked to intervene by the Foreign Office. Burt was appointed a month ago and has been tasked with working to secure the release of British citizens held abroad.\nBurt has already met Gurpreet Singh Johal, the brother of Jagtar Singh Johal, who has been detained by the Indian authorities for nearly nine years without a conviction.\nThe Foreign Office has been approached for comment.", "translation_ja": "", "vocab": [{"word": "detention", "definition": "逮捕・拘留された状態。法的手続きを待つ間、当局が個人を保持すること。"}, {"word": "dissent", "definition": "公式な見解や当局の方針に対する不同意や反対意見。政治活動の文脈では異議を唱える行為。"}, {"word": "proxy", "definition": "代わりの者という意味。政治的には、目的地の人物に影響を与えるために代替対象を標的にすること。"}, {"word": "escalating pattern", "definition": "時間とともに増加・悪化する傾向。ここでは、抑圧の行為がだんだん増えていく様子を指す。"}, {"word": "consular", "definition": "領事館に関連する。外国にいる自国民を支援する外交機能に関すること。"}, {"word": "intervention", "definition": "状況に関与・干渉すること。通常、問題を解決または影響を与えるために当事者が行動する。"}]}, {"title_ja": "ギニアビサウ、大統領権限強化の憲法改正に投票", "title_en": "Guinea-Bissau votes on constitutional reform to strengthen presidency", "summary_ja": "ギニアビサウは8月30日、大統領の権限を大幅に強化し選挙制度を再編する新憲法案に投票する。改正は権限関係を明確にして政治的不安定性を軽減することを目指しているが、批評家は大統領への権力集中と議会のチェック機能の弱体化を懸念している。投票は軍事クーデターから9カ月後、予定されている民主的選挙の3カ月前に行われる。", "summary_en": "Guinea-Bissau will vote on August 30 on a new constitution that would significantly strengthen presidential powers and reshape its electoral system. The reform aims to reduce political instability by clarifying authority, but critics argue it concentrates too much power in the presidency and weakens parliamentary checks. The vote comes nine months after a military coup and three months before scheduled democratic elections.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/29/guinea-bissau-votes-on-a-stronger-presidency-whats-at-stake?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Guinea-Bissau votes on a stronger presidency: What’s at stake?\nThe proposed constitution would give the president more power and reshape parliament and elections.\nVoters in Guinea-Bissau will decide on August 30 whether to approve a new constitution that would significantly strengthen the presidency and reshape the country’s electoral system.\nThe vote comes nine months after the military seized power and installed General Horta Inta-A Na Man as transitional president, and just more than three months before presidential and legislative elections scheduled for December 6.\nSupporters of the reform say it would provide clearer lines of authority and help address years of political instability and disputes between state institutions. Critics argue that it would concentrate too much power in the presidency and have questioned the process through which the draft was produced.\nThe African Party for the Independence of Guinea and Cape Verde (PAIGC), one of Guinea-Bissau’s main opposition parties, has rejected the referendum and called for a boycott.\nThe referendum will determine whether the constitution approved by the National Transitional Council (CNT) enters into force and provides the framework for the country’s return to elected government.\nWhy is Guinea-Bissau changing its constitution?\nThe process began after the November 26, 2025, military coup.\nPresidential and legislative elections had been held three days earlier. The military seized power while the electoral process was still under way, one day before the electoral commission was due to announce the presidential results.\nHorta, then army chief of staff, became transitional president.\nThe transition charter established a National Transitional Council (CNT), which was given legislative powers during the transition. The council approved the proposed constitutional text on January 13, 2026.\nGuinea-Bissau is a small Portuguese-speaking country on the West African coast, bordered by Senegal to the north and Guinea to the east and south. It gained independence from Portugal in 1974 and has experienced repeated coups and political crises since independence.\nUnder the existing constitution, Guinea-Bissau operates a semi-presidential system in which executive authority is shared between the president and prime minister.\nThe proposed constitution would substantially alter Guinea-Bissau’s existing semi-presidential system, giving the president significantly greater executive authority and reducing the prime minister’s role in government.\nWhat would change?\nUnder the proposed constitution, the president would have greater control over the government, including the appointment and dismissal of the prime minister and members of the government.\nThe president would also chair the Council of Ministers and have the power to create or abolish ministries.\nThe proposed constitution would reduce parliament from 102 seats to 65 and cut the number of electoral constituencies from 29 to 12.\nIt would also introduce new requirements for presidential candidates.\nCandidates would have to have lived permanently in Guinea-Bissau for the five years preceding an election. They would also have to pay a 50 million West African CFA franc deposit, or approximately $90,000.\nPolitical parties sponsoring presidential candidates would need at least 5,000 members, including at least 300 in each region.\nThe proposed constitution would also establish a Constitutional Court.\nWhy is a stronger presidency controversial?\nGuinea-Bissau’s political system has repeatedly been marked by disputes between presidents, prime ministers and parliament.\nSupporters of the reform argue that giving the president clearer authority over the government could reduce institutional conflicts and make decision-making more effective.\nCritics fear that concentrating executive authority in the presidency would weaken parliament and other checks on government, significantly altering the balance between the executive and legislature.\nCritics have also raised concerns about the proposed reduction in the number of electoral constituencies, arguing that it could affect political representation and weaken parties that rely on strong local support.\nThe new financial and membership requirements have likewise drawn criticism from those who argue that they could make it harder for smaller political movements to contest presidential elections.\nThere is a separate dispute over how the constitution was produced.\nThe draft was prepared during a military-led transition rather than by a restored elected parliament. Opposition parties and civil society groups have criticised the process and questioned whether the drafting process was sufficiently inclusive.\nIs the referendum about Horta Inta-A Na Man?\nHorta has led the transition since the coup, but the referendum is not simply a vote on his political future.\nThe transition framework bars the transitional president and prime minister from running in the elections at the end of the transition.", "translation_ja": "", "vocab": [{"word": "semi-presidential system", "definition": "大統領と首相の間で執行権が分かれている政治体制。大統領と首相が同時に存在し、権限が共有される制度を指す。"}, {"word": "constituency", "definition": "選挙区のこと。特定の代表者を選出するために区分けされた地理的地域を意味する。"}, {"word": "institutional conflict", "definition": "政府機関間の対立や紛争。大統領、首相、議会などの異なる公式機関間における権力争いを指す。"}, {"word": "checks and balances", "definition": "権力分立の仕組み。政府の一部門の権力が過度に集中しないよう他の機関が制限する制度。"}, {"word": "transition charter", "definition": "移行期における政治体制の基本ルール。クーデター後など政治体制が不安定な時期に、一時的に権力行使の枠組みとなる文書。"}, {"word": "boycott", "definition": "不買運動または参加拒否。政治的抗議の手段として、特定の組織や活動に参加しないこと。"}]}, {"title_ja": "トランプ大統領、ベネズエラとの「世界最大の石油取引」を発表", "title_en": "Trump Announces 'Biggest Oil Deal in World History' with Venezuela", "summary_ja": "トランプ大統領は、米国がベネズエラの確認埋蔵量である650億バレル以上の大部分を支配下に置く歴史的協定を発表した。この協定はベネズエラの臨時大統領デルシー・ロドリゲスと交渉され、米国の石油埋蔵量を倍増させ、ガソリン価格を低下させると見込まれている。ベネズエラの経済復興と石油産業の再活性化が期待されており、約2090億ドルがベネズエラの国庫にもたらされると予想されている。", "summary_en": "President Trump announced a historic agreement giving the US majority control of over 65 billion barrels of Venezuela's proven oil reserves at no cost to American taxpayers. The deal, negotiated with Venezuelan interim President Delcy Rodriguez, is expected to bring approximately $209 billion to Venezuela's treasury while substantially increasing US oil reserves and potentially lowering gas prices. Venezuela's current oil production of 1.25 million barrels per day is expected to be revived through American investment and long-term access to Venezuelan oilfields.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/29/trump-announces-biggest-oil-deal-in-world-history-with-venezuela?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Trump announces ‘biggest oil deal in world history’ with Venezuela\nUS president says deal secures majority US control of more than 65 billion barrels of proven oil reserves in Venezuela.\nThe United States has struck a deal with Caracas that would give them control of some 65 billion barrels of Venezuela’s proven oil reserves, President Donald Trump has announced, while reviving the OPEC nation’s battered energy industry.\nIn a post on Truth Social, Trump said the “historic transaction more than doubles American oil reserves” and “will substantially lower gas prices for all Americans”.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Talks between government and opposition mark a new chapter for Venezuela\n- list 2 of 3US refineries taking in half of Venezuela’s oil output, official says\n- list 3 of 3US nears deal to secure stake in Venezuelan oil fields, insiders say\n“At my direction, Secretary of State Marco Rubio, and Secretary of War Pete Hegseth, working closely with Highly Respected Interim President of Venezuela, Delcy Rodriguez, and, through a partnership with private business, have secured majority US control of more than 65 BILLION BARRELS of proven Oil Reserves in Venezuela, at no cost to the American Taxpayer,” Trump wrote.\nVenezuela’s interim President Delcy Rodriguez welcomed the deal, which is expected to bring about $209bn to the state’s treasury.\nThe announcement followed weeks of negotiations over an agreement that would give American companies long-term access to a group of Venezuelan oilfields and guarantee the resulting crude supply to the US.\nVenezuelan officials are preparing to sign agreements next week granting new oil exploration and production rights to a number of companies, particularly US firms.\nSources previously told Reuters news agency that a lease model was under consideration, with fields potentially auctioned to US producers, but the arrangement could face legal and constitutional challenges in Venezuela, where the state retains control over core oil industry activities.\nThe new deal would represent a dramatic expansion of Washington’s role in Venezuela’s oil industry as the Trump administration seeks to revive the country’s production and secure more crude for US refineries. Venezuela holds the world’s largest proven oil reserves, but produces only 1.25 million barrels per day, far below its potential after years of underinvestment, mismanagement and sanctions.\nTrump did not disclose the structure of the agreement, the fields or companies involved, nor how the US would exercise majority control over the reserves.\nSecretary of State Marco Rubio described the agreement as a win for both countries, saying on X that it would secure stable, low-cost oil for the US and help lower petrol prices.\nFor Venezuela, Rubio said the deal would bring nearly $100bn in private investment, support thousands of high-paying jobs and help rebuild the country’s economy.", "translation_ja": "", "vocab": [{"word": "battered", "definition": "ひどく傷つけられた、打撃を受けた。長期間の困難や悪い状況により深刻な被害を受けている状態を表す。"}, {"word": "interim", "definition": "暫定的な、一時的な。正式な任期開始までの期間、または次のものが決まるまでの間に使用される。"}, {"word": "treasury", "definition": "国庫、財務省。政府の財政を管理する機関、またはそこに集められた資金を指す。"}, {"word": "constitutional", "definition": "憲法に関連する、または憲法に基づいている。法的には憲法の範囲内であるかどうかに関わる。"}, {"word": "underinvestment", "definition": "過小投資、投資不足。必要とされる適切な金額よりも少ない投資しかなされていない状態。"}, {"word": "revive", "definition": "復活させる、復興させる。衰退していたものを再び活動や機能させる。"}]}, {"title_ja": "トゥアレグ反政府勢力、捕虜交換でマリ兵士60人以上を解放", "title_en": "Tuareg Rebels Free 60 Malian Soldiers in Prisoner Exchange", "summary_ja": "トゥアレグ反政府勢力が、2025年にナイジェリア治安部隊に逮捕された有力指導者インキナネ・アグ・アッタヘルとの捕虜交換により、マリ兵士約60人を解放した。ニジェール政府の仲介とアルジェリアの支援により実現した今回の交換は、マリにおける紛争の最中における一連の人質解放の最新例である。マリ軍とアルカイダ系グループ間の戦闘が継続する中、公式には交渉を否定しながらも通信チャネルは開かれたままである。", "summary_en": "Tuareg rebels have released approximately 60 Malian soldiers in a prisoner swap for Inkinane Ag Attaher, a prominent rebel leader arrested by Nigerian forces in 2025. The exchange, mediated by Niger's government with Algerian assistance, marks the latest in a series of hostage releases amid ongoing conflict in Mali. The development occurs as fighting persists between the Malian military and al-Qaeda-linked groups, though communication channels remain open despite official denials of negotiation.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/29/tuareg-rebels-free-more-malian-soldiers-in-prisoner-swap-sources-say?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Tuareg rebels free more Malian soldiers in prisoner swap, sources say\nTuareg rebels have freed about 60 Malian soldiers in exchange for one of their own leader
