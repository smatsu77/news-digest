nable and will eventually require painful adjustment. Because major economies disagree on the causes and solutions, coordinated action is unlikely, making a crisis inevitable. History demonstrates that such imbalances resolve through economic contraction that disproportionately affects different nations based on their debt levels and economic power.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/great-rebalancing-coming", "state_media": false, "category": "オピニオン", "full_text": "The trade imbalances that have come to characterize the global economy are fundamentally untenable. China, Germany, and a handful of other economies run large, persistent trade surpluses, while the United States absorbs much of these surpluses by running the world’s largest trade deficit. Sooner or later, something must give. For an advanced, capital-rich economy such as that of the United States, an enduring trade deficit will bring with it either rising unemployment or rising debt, neither of which is sustainable.\nIn theory, the major surplus and deficit economies could agree on a coordinated adjustment in which surplus countries would expand domestic demand and deficit countries would gradually reduce their dependence on debt-fueled consumption, allowing the imbalances to shrink without a sharp contraction in global demand. That would be the sensible solution.\nBut because the major players disagree about the causes of the imbalances, they are unlikely to come to such a solution. China attributes them to excessive U.S. consumption and fiscal deficits; the United States blames foreign industrial, trade, and currency policies; and Europe has yet to settle on a coherent diagnosis. As a result, they all have proposed remedies that are at odds with one another. Beijing wants deficit countries to save more and prefers not to change China’s growth model. Washington wants surplus countries to reduce their surpluses by redistributing income to the household sector. European leaders continue to advocate for multilateral cooperation and rules-based trade. This makes the chances of a coordinated response slim. And as the economic analyst Martin Wolf wrote in the Financial Times earlier this year, if there is little prospect of preemptive action, “the second-best option is to prepare for a crisis.”\nIndividual economies are now doing just that. History shows that trade imbalances of this scale almost always end painfully—and that the pain of the adjustment is not distributed evenly. High levels of debt combined with low productivity makes a country more likely to bear the burden of a trade adjustment, but economic and political power can also give it the tools to pass the burden off to others. Among the three main economic players today, China is the most vulnerable, the United States has the most capacity to reduce its exposure, and Europe possesses latent power but a dubious ability to use it. None of their maneuvers to protect themselves are likely to reduce the risk or overall cost of a crisis. The question is only who will feel the brunt of the losses when it arrives.\nHISTORY REPEATS ITSELF\nLarge, persistent trade imbalances have cropped up periodically over the past century, and they are rarely benign. One such episode occurred during the 1920s, when a surge in American productivity was not accompanied by rising wages. Production soared past consumption, and the United States ran enormous trade surpluses. Europe ran the corresponding deficits, as many countries borrowed heavily abroad to rebuild economies devastated by war. Germany in particular borrowed extensively to finance both domestic growth and its reparations payments. American domestic debt also rose rapidly, much of it to fund consumption and asset speculation.\nAs the imbalances persisted and U.S. manufacturing expanded at the expense of European manufacturing, protectionist pressures intensified. France devalued its currency in 1927, the United Kingdom abandoned the gold standard in 1931, and the same year Germany imposed import restrictions and rationed access to foreign currency. Even the United States, whose manufacturers and farmers complained that weak demand was threatening domestic production and employment, passed the Smoot-Hawley Tariff Act in 1930.\nThe adjustment came in the form of a collapse in global trade during the Great Depression of the early and mid-1930s. Nearly every major economy suffered from the contraction, but they did not suffer equally. Those with large deficits, such as the United Kingdom, recovered more quickly and suffered less severe financial distress than the United States, which absorbed a disproportionate share of the costs. American exports fell faster than imports, domestic investment imploded, banks failed, and bankruptcies surged.\n Trade imbalances on a large scale almost always end painfully.\nThe next major episode of persistent trade imbalances was the rare case in which the imbalances faded away without causing major disruption. During the 1950s and 1960s, the United States again ran very large surpluses while Europe and Japan ran corresponding deficits. Similar to the situation in the 1920s, these deficits financed the reconstruction of postwar economies as resources poured into infrastructure and manufacturing. But unlike in the earlier period, governments maintained strict controls over capital flows and imported capital mostly to fund investments that generated enough future income to service the associated", "translation_ja": "", "vocab": [{"word": "untenable", "definition": "維持または正当化できない状態を意味する。議論や立場が論理的に成り立たないか、長期間継続できないことを示す。"}, {"word": "imbalances", "definition": "均等でない、または対称でない状態のこと。特に経済学では、収入、支出、または供給と需要の間の不一致を指す。"}, {"word": "benign", "definition": "害がない、または危険でない状態を示す。医学や経済学の文脈で使用され、深刻な悪影響がないことを意味する。"}, {"word": "protectionist", "definition": "国内産業を外国の競争から守るための政策や措置を支持する立場。関税や輸入制限を用いることが多い。"}, {"word": "contraction", "definition": "経済活動、生産、または規模の減少を意味する。GDPの低下や失業率の上昇を伴う時期を指す。"}, {"word": "latent", "definition": "まだ明らかになっていない、または発動されていない能力や力が存在する状態。将来的に発揮される可能性がある。"}]}, {"title_ja": "ヨーロッパはヨーロッパ人に任せよ", "title_en": "Leave Europe to the Europeans", "summary_ja": "著者は、トランプ政権がヨーロッパでの米軍駐留を大幅に削減すべきであり、これによってNATO加盟国に自国の防衛の主要責任を負わせるべきだと主張している。米国が40兆ドルの債務を抱えながら毎年ヨーロッパ防衛に1000億ドルを費やしている中、米軍の撤退により米国の過度な負担が緩和され、ヨーロッパの数十年にわたる対米依存が終わるという。", "summary_en": "The author argues that the Trump administration should substantially reduce U.S. military presence in Europe to force European NATO members to take primary responsibility for their own defense. With the U.S. facing $40 trillion in debt while spending $100 billion annually on European defense, withdrawing forces would relieve American overextension and end decades of European dependence on Washington's military leadership.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/leave-europe-europeans", "state_media": false, "category": "オピニオン", "full_text": "In a 1987 New York Times advertisement, long before he became president, Donald Trump insisted that “America should stop paying to defend countries that can afford to defend themselves.” This has been a consistent theme of his foreign policy rhetoric since he first moved into the White House, and he has been especially focused on applying it to Europe.\nDuring his first term, Trump jolted European allies by threatening to withdraw the United States from NATO, arguing that its members were not spending enough on their own defense and were free-riding on American taxpayers. Ultimately, he did not make good on the threat. All his administration mustered was a late, failed effort in the summer of 2020 to remove 12,000 troops from Germany.\nThis time around, his administration has adopted burden shifting as a rallying cry and seems poised to act on it. Almost immediately after taking office, Secretary of Defense Pete Hegseth traveled to Brussels to inform his counterparts that the United States would have to focus on priorities other than Europe’s defense. Europe itself, he said, needed to “take ownership of conventional security on the continent.” Last month, to turn this vision into reality, the Pentagon launched its Europe Posture Review, which is intended to be a critical assessment of U.S. troop deployments and basing commitments on the continent. Announcing it at the NATO defense ministerial, Hegseth was clear: “Europe can and must take primary responsibility for its conventional defense.” Such an outcome would amount to a transformation in the transatlantic alliance.\nSince the founding of NATO after World War II, the United States has underwritten Europe’s defense and held the top military command position in the alliance. More than 75 years later, it still accounts for about 60 percent of NATO members’ military expenditures and stations some 80,000 troops on the continent and in the United Kingdom. Decades of American dominance have left Europe reliant on U.S. leadership, technology, and spending.\nIf the Trump administration is serious about shifting defense responsibilities to Europe, then the posture review offers a rare opportunity. A substantial reduction in the U.S. military presence in Europe over the next two years would force the continent to build forces it has so far left to the United States, while also putting Washington on sounder defense footing. The United States is $40 trillion in debt and adding roughly $2 trillion per year, with no prospect of major fiscal reforms. Despite this dire fiscal picture, it spends about $100 billion on Europe’s defense each year.\nThe problem is not new. Although U.S. administrations since Dwight Eisenhower have urged Europe to do more for its own defense, Europeans have consistently shirked their obligations. Even today, some European leaders hold out hope that if they can wait out Trump’s second term, NATO will return to “normal.” Only the withdrawal of U.S. forces will convince allies that the United States truly intends to turn over responsibility for the region’s conventional defense. Nothing else will force them to plan for a future in which Washington is no longer in the lead. Such a move will draw resistance from European leaders and the U.S. Congress. But a smaller footprint is vital to relieve U.S. overextension, and it can be done without harming American interests.\nA TEMPORARY SHIELD\nThe presence of U.S. military personnel in Europe in the late 1940s and early 1950s was supposed to be a temporary shield as Western European states rebuilt economies devastated by war. But the troops stayed long after that rebuilding was complete. At the height of the Cold War, the United States had more than 400,000 troops on the continent. When the Soviet Union collapsed, NATO lost its formal justification.\nFor Washington, the alliance became primarily about institutionalizing U.S. power and influence, and although the total number of U.S. forces stationed in Europe declined over time, it has never dropped below 60,000. With the Soviet threat gone, European governments were happy to capitalize on the “peace dividend” and expanded their social programs while gutting military spending. At the same time, the alliance took on new commitments, offering Moscow’s tiny, vulnerable neighbors promises of protection with little thought of what their defense would require. By 2014, when Russia annexed Crimea, Europe was deeply dependent for its security on the United States, which was already tied up in the Middle East and increasingly focused on China’s rising military power. That situation persists today.\nThe Pentagon last conducted a formal review of global U.S. military posture in 2021, in the first year of the Biden administration. It made a few modest recommendations, but its general conclusion was that the existing arrangement was just about right. In Asia, it advised seeking more places to operate from and pledged to harden U.S. bases there. But it did little to increase ", "translation_ja": "", "vocab": [{"word": "underwritten", "definition": "保証する、支援する。ここでは米国がヨーロッパの防衛費用と責任を引き受けてきたことを意味する。"}, {"word": "posture review", "definition": "態勢見直し。軍事的な配置や戦略の評価と変更を検討するプロセスを指す。"}, {"word": "overextension", "definition": "過度な拡大、過度な負担。国や機関が自らの資源を超えて責任や義務を負うことを意味する。"}, {"word": "shirked", "definition": "責任から逃げる、回避する。欧州諸国が防衛責任を十分に果たしていないことを表現している。"}, {"word": "institutionalizing", "definition": "制度化する、組織化する。米国の権力と影響力をNATO同盟の構造に組み込むことを指す。"}, {"word": "dividend", "definition": "配当、恩恵。ここでは冷戦終結による平和による経済的利益を意味する。"}]}, {"title_ja": "解決不可能な中東", "title_en": "The Impossible Middle East", "summary_ja": "著者は、2月28日以降のアメリカとイスラエルによるイランへの軍事行動がエスカレートし、中東全域を不安定化させ、湾岸諸国とアメリカの信頼関係を損なわせていると主張している。中東の政府はアメリカの軍事保護に代わる実行可能な選択肢がないまま、中国、ロシア、ヨーロッパなどとのパートナーシップを積極的に多様化させようとしている。", "summary_en": "The author argues that escalating U.S.-Israel military actions against Iran since February 28 have destabilized the entire Middle East region, deepening existing rifts between Gulf states and eroding their trust in American security guarantees. Middle Eastern governments are now seriously diversifying partnerships with China, Russia, Europe, and others, though no viable alternative to U.S. military protection currently exists, leaving the region in an untenable position.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/middle-east/impossible-middle-east", "state_media": false, "category": "オピニオン", "full_text": "The Middle East is no stranger to conflict. But even by its standards, the last six months have been extraordinarily chaotic. Ever since the United States and Israel went to war against Iran on February 28, countries in the region have faced cycles of drone and missile strikes against their military bases, energy infrastructure, and water desalination plants. Their airports and oil refineries have repeatedly needed to pause operations. And their regular ports have at times sat idle, thanks to Iranian attacks on ships in the Strait of Hormuz.\nDespite months of negotiations, Tehran and Washington seem poised to keep fighting on and off in an effort to wear down the other’s materiel and willpower. In fact, the war has expanded. More members of Iran’s regional proxy network, including the Yemen-based Houthis and Iranian-aligned Iraqi militias, joined the fray, and a port in Egypt was hit by drones. (No country has claimed responsibility for that attack, but the United States blamed Iran.)\nAs the conflict drags on, damage to the Middle East will extend far beyond infrastructure. It will deepen the Middle East’s fault lines. Some economies will be affected more than others, which could upend even the Gulf states’ traditionally stable politics. Institutions central to the region, such as OPEC+, could further come under extreme stress. There are measures that Middle Eastern governments can take to address these challenges, but none are straightforward, and all have their own set of consequences. To survive an era of increased disorder, then, the region’s countries will have to rethink how they relate to the wider world—and, most important, to each other.\nA HOUSE DIVIDED\nMiddle Eastern states have long had their differences. They have feuded, for example, about Israel, political Islam, and oil policy. Saudi Arabia and the United Arab Emirates have contrasting visions for the region and beyond, including Libya, Sudan, and Yemen. But the war is deepening all these rifts and creating new ones. The UAE has resented the muted nature of the condemnations that Oman, Qatar, and Saudi Arabia have made of Iran’s attacks on Emirati infrastructure. The countries have differences on how to handle the war itself and an unpredictable Trump administration. These disagreements have piled onto existing disputes, feeding resentment and making the region’s differences harder to manage. They are frustrating efforts to adapt to the evolving war.\nThe conflict has also begun to divide the Gulf from the United States, its main security guarantor. When U.S. President Donald Trump returned to the White House, many Gulf governments believed that their relationship with Washington would improve after a turbulent four years under the Biden administration. After all, Trump had a friendly and transactional political approach toward the region during his first term. Middle Eastern officials made ostentatious efforts to win him over, including by pledging to spend trillions of dollars in the United States, raising oil output, funneling investment deals to the president’s own family, and, in the case of Qatar, gifting him a private jet. But then Trump launched not one but two wars against Iran, prioritizing Israel’s desire to debilitate the Islamic Republic over the Arab states’ desire for stability. This showed the region that Washington cannot be trusted.\nThe Middle East has long worried about its dependence on the United States and has thus been diversifying its partnerships since the Arab Spring, in 2011. But in the past, these efforts were largely aimed at threatening or coercing Washington to act in their favor. Now they are more serious. This month, for example, Saudi Arabia forged a mutual defense pact with Pakistan and Turkey. Regional governments are buying more weapons from suppliers in Europe, South Korea, Turkey, and even Ukraine. Finally, they continue to look to China and Russia for political and economic partnerships. They are especially interested in forging more economic ties with China, which already trades hundreds of billions of dollars worth of goods with the region. China is currently the top destination for crude from the region.\nAny pivot away from the United States will be limited. There is no alternative security partner, at least right now: China is loath to use its economic might to offer military assistance, Russia is bogged down in its own war, and Europe struggles to coordinate on defense issues. (From the Gulf’s perspective, Europe is also too focused on Gulf domestic issues.) These governments are also unhappy with Chinese and Russian efforts to assist Iran in the war by, respectively, offering Tehran material that it can use to rebuild its defense industrial base and helping it improve its targeting. And although American bases can make host states targets, regional governments still want a U.S. military presence and American protection.\nBut unlike past efforts to diversify, this limited shift away from Washington w", "translation_ja": "", "vocab": [{"word": "fault lines", "definition": "社会や地政学的な構造内の深刻な分裂や対立の可能性がある領域。地震の断層線から転じた用語で、大きな紛争や危機につながる可能性のある根本的な相違を指す。"}, {"word": "transactional", "definition": "相互利益に基づく実利的で契約的な関係を重視する姿勢。感情的な結びつきや長期的な共有価値観よりも、個別の取引や短期的な利益交換を優先する。"}, {"word": "debilitate", "definition": "何かの力や能力を弱める、または著しく低下させる。軍事文脈では、対抗国の軍事力や防御能力を削弱することを意味する。"}, {"word": "diversifying", "definition": "リスクを減らすため、または選択肢を増やすために、様々な異なる相手や源からパートナーシップや関係を広げる行為。単一の依存を避ける戦略。"}, {"word": "coerce", "definition": "脅迫や強圧を使って相手に特定の行動をさせる。国際関係では、より強い国が弱い国に対して政策変更を強いることを指す。"}, {"word": "loath", "definition": "何かをすることに強く不本意である、またはしたくないという状態。reluctantと同義だが、より強い嫌悪感を示す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-29 22:55 JST";
  renderTabs();renderList();
})();
</script>
