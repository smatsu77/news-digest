ter tearing through Gyirong Port, one of the main border crossings between Nepal and Tibet, sweeping away all in its path as hundreds of people fled for their lives.\nThe scenes, captured by CCTV cameras, quickly spread on social media and onto screens around the world.\nExcept here, in China.\nOnly a single still-frame shot has been broadcast so far by the country's state-run flagship news bulletin.\nIt has also been difficult to find the video on China's heavily censored internet. It is just as hard to even find posts describing the flash flooding that has claimed hundreds of lives, with just as many still unaccounted for since Wednesday.\nBeijing has launched a massive rescue operation involving hundreds of emergency workers, which is continuing, and President Xi Jinping chaired an emergency meeting with officials to co-ordinate efforts.\nBut when you compare the country's internet content to what much of the world has been seeing online these past few days, China's firewall becomes more visible than ever.\nTibet, which Beijing annexed in the 1950s, had long resisted rule by the Chinese Communist Party.\nChina has quashed protests over the years, sometimes violently, and has been accused of grave rights violations in the Buddhist region. It has labelled the exiled spiritual leader, the Dalai Lama, a separatist.\nThat history means the very name Tibet draws China's censors. Beijing's sensitivities are especially apparent at times likes this.\nThere have been daily updates on the missing and the dead, and Beijing has also been posting updates on the rescue operations, as well as the dangers posed by a barrier lake that has been at risk of overflowing.\nOn Saturday, new footage from Chinese state media showed rescue teams wandering in a wasteland of mud and rock while calling out to anyone trapped.\nBut there is little detail beyond that. There are no accounts from survivors in Tibet, and almost no user-generated footage showing the deadly moments or their aftermath.\nWe are yet to hear from anxious families of those missing. Trying to contact people there is near-impossible during regular times.\nAs a journalist who has covered North Korea, it has often been easier for me to contact interviewees in Pyongyang than it is in the Tibetan capital, Lhasa.\nOn Thursday night, as global headlines led on the devastation in a Himalayan valley, China's state broadcaster opened its main bulletin with the launch of Xi's new book, a selection of his \"most important and fundamental works\".\nForeign journalists cannot travel to Tibet without government permission. We have just a few hours to get as much information as we can on huge stories like this before videos are scrubbed and voices stifled.\nInstead, we have to rely on state media, which has so far focused on incredibly dramatic rescue efforts.\nSpecialist search teams scaling mountains and cliff faces, or crossing raging rivers to try to get to the worst-affected areas. We don't yet know what happened afterwards, or who they were able to save.\nThis is not to say that Beijing is unconcerned. Rather, they are very concerned.\nChina's Premier Li Qiang was quickly despatched to the region, where he was seen inspecting debris removal - a rare visit by the country's second-most important leader so soon after a major disaster.\nThe reason for what the world might see as a muted response is to preserve the one thing Xi covets for his country: stability.\nThe Communist Party will fear that such a disaster could fuel discontent, either with the response or the lack of foresight to prevent it.\nIt may also fear the impact of a tragedy like this and its potential to be a rallying factor, especially in a community where faith has long played a central role.\nAlthough the region has not seen protests in a long time, Tibetan groups abroad have expressed concern over increasing Chinese control, such as new education laws that they say aim to weaken the role of monasteries and the Buddhist faith.\n wn.\"\nZelensky said the decision to store explosives in the village was \"absolutely unacceptable\", adding: \"Criminal proceedings have been opened on charges of official negligence.\"\nThe office of Ukraine's prosecutor general earlier said it was reviewing the \"legality of the placement and storage of explosive objects and materials\" near residential buildings in Myla.\nIt said the \"actions of officials who made the relevant decisions\" would also be investigated.\nHowever, Zelensky earlier stated that \"there are regulations in place - ammunition cannot be stored near homes or other residential areas\", adding \"appropriate conclusions will certainly be drawn\".\nHe referenced the strike on an ammunition warehouse in Vyshneve in July, which caused a secondary detonation that killed nine, injured dozens more and damaged more than 280 homes.\nFriday night's explosion has raised fresh questions about why munitions were being stored so close to people's homes, especially given the regularity of Russian aerial attacks.\n\"The authorities, the Ministry of Defence - why was this allowed at the depots, in a place where there used to be food?\" Borys Daniyluk, 61, said.\n\"Why were ammunition and weapons stored there, next to a populated village? There are no words, just emotions.\"\nUkrainian Prime Minister Sergiy Koretsky expressed regret that a \"lesson\" had not been learned following the explosion in Vyshneve.\nThe investigation into that incident revealed serious failings on the part of a state-owned company that had not complied with regulations regarding storage of explosives near residential buildings.\nZelensky indicated that the Myla depot had been operated by Ukraine's armed forces.\n\"In the fifth year of the full-scale invasion, making the same mistakes over and over is criminal negligence,\" Koretsky said on Telegram.\n\"Everyone responsible, without exception, must face severe punishment so that such situations never happen again.\"\nMeanwhile, Tkachenko said a 14-year-old was killed in a separate attack in the Boryspil district, while Kyiv Mayor Vitaliy Klitschko said a two-year-old had died after a Russian drone crashed in Obolonskyi.\nHe added that five people, including an 18-year-old girl, were injured in fresh strikes on the capital on Saturday morning. Five people have been killed across the country over the past day, according to local officials.\nZelensky reported further overnight strikes in Odesa, Dnipropetrovsk, Sumy and Zaporizhzhia, as the Ukrainian army said it had shot down 233 Russian drones.\nRussia and Ukraine have been intensifying their aerial attacks in recent months, with Kyiv focusing its operations on Russian economic targets.\nUkraine has for weeks struck sites belonging to Wildberries, the country's biggest online retailer, describing the firm as a legitimate target because it supplied components to the military, which Moscow denies.\nIn Russia, local officials said two people had been killed and 25 injured in strikes in the Belgorod and Rostov regions in the past 24 hours.\nThe Moscow-appointed governor of the occupied Ukrainian region of Zaphorizhzhia said four people were injured after a Ukrainian strike hit a shopping centre.\nRussian online retailer Ozon said one of its logistic centres had been hit in an overnight Ukr", "translation_ja": "", "vocab": [{"word": "depot", "definition": "物資や武器などを大量に保管する施設。軍事用語では特に弾薬庫や兵站基地を意味する。"}, {"word": "detonate", "definition": "爆発物が爆発する、または爆発させる。火薬や爆弾が意図的にまたは偶発的に爆発することを表す。"}, {"word": "negligence", "definition": "注意義務を怠ること。職務上必要とされる注意や予防措置を施さない過失を指す。"}, {"word": "munitions", "definition": "弾薬や爆発物などの軍事用の武器・装備品。ammunition と同じ意味で使われることが多い。"}, {"word": "secondary detonation", "definition": "爆発により引き起こされる二次的な爆発。貯蔵された爆発物が初爆により連鎖的に爆発する現象。"}, {"word": "aerial attack", "definition": "空中から行われる攻撃。航空機やドローンなどが上空から目標に対して行う攻撃のこと。"}]}, {"title_ja": "右派評論家ミロ・ヤイアノプロス、米国から英国へ強制送還", "title_en": "Right-wing commentator Milo Yiannopoulos deported from US to UK", "summary_ja": "英国の右派政治評論家ミロ・ヤイアノプロスが、米国移民税関捜査局(ICE)に拘束され、米国から英国に強制送還された。41歳の元ブライトバートニュース編集者は、2019年5月に米国に入国後、ビザを超過滞在していた。厳格な移民管理と強制送還を唱えていたヤイアノプロスが、皮肉にも自らが送還されることになった。", "summary_en": "British right-wing political commentator Milo Yiannopoulos has been deported from the United States to the UK after being detained by Immigration and Customs Enforcement (ICE). The 41-year-old former Breitbart editor overstayed his visa after entering the US in May 2019. Yiannopoulos, known for controversial statements on various social issues, had ironically advocated for stricter immigration controls and deportations before his own removal.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqlw52vr0dwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Right-wing commentator Milo Yiannopoulos deported from US to UK\n- Published\nBritish right-wing political commentator Milo Yiannopoulos has been deported from the United States after being detained by Immigration and Customs Enforcement (ICE).\nYiannopoulos, 41, a former editor of Breitbart News and one time political aide to rapper Kanye West, was deported on Friday, according to the Department of Homeland Security (DHS).\nYiannopoulos, \"an illegal alien from the United Kingdom\" had been sent \"back to his home country\", a DHS spokesperson said in a statement given to the BBC.\nThe self-styled provocateur has called himself the \"most fabulous supervillain on the internet\" and advocated for stricter US immigration controls. His critics call him a purveyor of hate speech.\nYiannopoulos, who grew up in Kent in the south of England, was arrested on 27 August after arriving at Louis Armstrong New Orleans International Airport.\nHe flew into the US in May 2019 and \"chose to overstay his welcome in violation of our nation's laws\", the DHS said.\nHe has previously cheered on ICE raids, last year calling for \"total legal immunity for ICE agents when they're on duty\".\nHe wrote on social media in 2025: \"We have got to deport millions and millions of people. Without that, nothing else matters.\"\nYiannopoulos also advocated \"on the spot deportation for anyone who can't prove they are in the US legally\" on social media.\nYiannopoulos was an early supporter of Donald Trump during the 2016 election, headlining an event that year called Gays for Trump during the Republican National Convention.\nThe commentator has since become a critic of the US president, but still voices support for his agenda. He wrote on X in March this year that Trump had \"lost his way, bought off by foreign interests\".\nYiannopoulos has courted controversy with his comments on transgender people, Muslims, Black Lives Matter, feminists and gay people, even though he himself identified as gay. He now calls himself an \"ex-gay\".\nIn 2020, he assisted West in the rapper's unsuccessful bid to become president. He also worked for Marjorie Taylor Greene, a former Republican congresswoman who fell out with Trump and became a fierce critic before resigning from office.\nLaura Loomer, a far-right commentator and Trump ally who has feuded with Yiannopoulos, took credit for his arrest by ICE, claiming on X on Friday night that his flight back to the UK had already departed.\n\"This subversive foreign agent is already out of the United States and DHS tells me he's NEVER allowed to come back to the United States ever again,\" she wrote.\nIn 2017, he was disinvited from speaking at CPAC, a US conservative conference that also hosted Trump, after footage emerged of Yiannopoulos appearing to condone paedophilia. He also later apologised and resigned from Breitbart.\nHe denied the allegations and said he had been speaking about his own experiences as a child.\nYiannopoulos was once regularly linked with the alt-right, a disparate group that is outspoken against political correctness and feminism, and which includes neo-Nazis and white supremacists among its ranks.\nHe has said he did not consider himself part of the alt-right, although he has called it \"energising and exciting\".\nRelated topics\n  - Published22 hours ago", "translation_ja": "", "vocab": [{"word": "deported", "definition": "国から強制的に退去させられること。特に不法滞在者や法律違反者が該当国から追い出される法的手続きを指す。"}, {"word": "overstay", "definition": "ビザやパスポートの有効期限を超えて滞在し続けること。入国管理法違反に該当する行為。"}, {"word": "commentator", "definition": "特定のトピックに対して専門的な意見や分析を公開で述べる人。メディアやSNSを通じて社会的影響力を持つ。"}, {"word": "provocateur", "definition": "意図的に議論や反発を引き起こすような発言や行動をする人。社会的な物議をかもす人物を指す。"}, {"word": "alt-right", "definition": "政治的正当性と左翼的アイデオロギーに反対する右派ムーブメント。ポピュリズムと民族主義の傾向を持つ。"}, {"word": "subversive", "definition": "既存の制度や秩序を破壊または弱体化させようとする行為や個人。政治的に危険とみなされることもある。"}]}, {"title_ja": "キリスト教フェスティバルで男性が死亡、主催者が「深く悲しむ」", "title_en": "Christian Festival 'Devastated' After Man's Death at Big Church Festival", "summary_ja": "ウェストサセックス州で開催されたビッグチャーチフェスティバルで、大きな木製の看板が落下し、41歳の男性が死亡、他6人が負傷しました。フェスティバルの主催者はイベントの残りの部分をキャンセルし、緊急サービスと労働衛生委員会と協力しています。カンタベリー大主教は被害者、負傷した参加者、およびフェスティバルコミュニティのために悲しみと祈りを表明しました。", "summary_en": "A 41-year-old man died and six others were injured when a large wooden sign fell at the Big Church Festival in West Sussex on Friday. Festival organisers cancelled the remainder of the event and are cooperating with emergency services and the Health and Safety Executive. The Archbishop of Canterbury expressed sadness and prayers for the victim, injured attendees, and festival community.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c158939pz4do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Christian festival 'devastated' after man's death\n- Published\nOrganisers of a Christian festival say they are \"devastated\" after a man died and six other people were injured by a falling sign.\nSussex Police said it had been called to the Big Church Festival at Wiston Park, near Steyning in West Sussex, at about 15:38 BST on Friday.\nIt was later confirmed a 41-year-old man from Eastbourne in East Sussex had died.\nThe Archbishop of Canterbury said she was \"sad and shocked\" to hear about the fatal incident.\nDame Sarah Mullally said: \"I pray for his family, friends and loved ones as they grieve. I pray for those receiving treatment, and the healthcare workers looking after them.\n\"And I pray too for the other festival goers, staff and event organisers as they come to terms with these tragic events.\n\"May the God of comfort and healing be with them all.\"\nSouth East Coast Ambulance service said four of the six people injured were taken to local hospitals for further treatment, with two people having serious injuries.\nThe Big Church Festival, which describes itself as the UK's biggest Christian festival, was founded in 2009.\nThe festival began on Friday and was due to continue until Sunday, but a decision was made by organisers to cancel the remainder of the event after the incident.\n\"We are working with the emergency services, police and the Health and Safety Executive as they establish the circumstances surrounding today's incident,\" the organisers said.\n\"We are incredibly grateful to everyone who responded, and to our teams and community for the care they have shown one another.\"\nOn social media, author Andrew Ollerton said he was \"reeling\" after seeing the incident.\n\"My wife Charlotte and I were walking just a few paces behind when a huge overhead sign came crashing down on the people in front of us,\" he said.\n\"We rushed with others to lift the sign off them and then administered first aid with others as best we could until the paramedics arrived.\"\nJudah Martin, from Kent, was at the event and said he saw vehicles \"speeding\" towards the area where the incident happened before campers were told to return to their tents \"immediately\".\n\"As we had no internet connection, we were unable to access information, except that word spread that there were serious injuries due to a falling sign,\" the 20-year-old told Your Voice.\n\"The sign in question was a huge wooden sign on the top of a hill which we walked under earlier that day.\"\nRayanne Walters celebrated her birthday on Friday at the festival and spent the night before returning to her home in London on Saturday.\n\"You could hear people crying in the middle of the night,\" she said.\n\"People were crying because we were just so upset.\"\nJessica Schuffenhauer travelled from Leipzig in Germany for the festival.\nShe said people were \"united\" inside after the incident as they sang and prayed together.\nCarla Diamond, from Hertfordshire, said: \"We've got lots of friends here and it was really uncertain not knowing who was directly involved and if people were safe.\"\nPeter Heard, from Wiltshire, said him and his friends were \"all pretty bewildered\" after the incident and \"a little dazed\".\n'Emotional whiplash'\nThe Reverend James Di Castiglione, rector of the parish of Chanctonbury in which Big Church Festival takes place, says the incident has been a \"huge shock to everyone locally\".\n\"We are all experiencing emotional whiplash about what's happened really because Big Church Festival is such a time of joy and unity and love and celebration,\" he added.\nDi Castiglione said at the event there was \"just a sense of confusion and shock that was rippling across the site\".\n\"[It is] just the worst lightning bolt of tragic news striking everybody's hearts,\" he said.\nThe Salvation Army in Hove had opened its hall on Friday to allow people to stay the night if they could not get home after the event was cancelled.\nMartin Bellshaw, from the Hove branch, said they welcomed about 20 people from Bristol and the north-west of England.\nChristian parent support charity ParentFuel said its people at the festival were all safe.\n\"We cannot praise the BCF (Big Church Festival) team enough for the way things have been handled,\" they said on social media on Saturday morning.\n\"We are currently sat in the volunteer tent with a brew in hand, worship music being played and the warmth of chatter around us.\"\nThe charity said it was a \"freak accident\".\n\"Life is so precious and so, so short. This weekend brought that ever closer for us all,\" they added.\nSussex Police is urging anyone with information about the incident to contact them.\nThe Health and Safety Executive and local authority had also been informed, the force added.\nAdditional reporting by Kris Bramwell\nGet in touch\nDid you attend this festival? Get in touch.\nFollow BBC Sussex on Facebook, external, X, external, and Instagram, external and listen to BBC Radio Sussex on Sounds. Send your story ideas to southeasttoday@bbc.co.uk , external or WhatsApp us on ", "translation_ja": "", "vocab": [{"word": "devastated", "definition": "深く悲しんでいる、または打ちひしがれた状態を示す。強い感情的なショックや失望を表現します。"}, {"word": "circumstance", "definition": "ある事象が起こった状況や条件。文脈に応じて事情、状況、環境などの意味になります。"}, {"word": "freak accident", "definition": "予測不可能で珍しい偶然の事故。通常は予防措置では避けられない突然の出来事を指します。"}, {"word": "emotional whiplash", "definition": "急激な感情の変化による精神的な揺さぶられた状態。喜びから悲しみへの急速な転換を表します。"}, {"word": "rippling", "definition": "波紋のように広がっていく、または連鎖的に影響が広がることを意味します。比喩的に使われます。"}, {"word": "urging", "definition": "～するよう強く促す、または勧める行為。緊急性を伴って何かを実行することを求めることです。"}]}, {"title_ja": "クレバリー議員が影の内閣を辞任し、ロンドン市長選出馬を表明", "title_en": "Cleverly Quits Shadow Cabinet to Run for London Mayor", "summary_ja": "保守党のジェームス・クレバリー議員は、影の住宅長官の職を辞任して、2028年5月のロンドン市長選挙における保守党候補指名を目指すことを明らかにした。リシ・スナック前首相の下で外相を務めた同氏は、現職のラボア系市長サディク・カーン氏に対抗することを目指している。クレバリー氏は、ロンドンはラボアに軽視されており、首都の評判を回復するには行政能力以上のものが必要だと主張している。", "summary_en": "Conservative MP Sir James Cleverly has resigned from his position as shadow housing secretary to pursue the Conservative nomination for London mayor in the May 2028 election. The former foreign secretary, who previously lost a bid for party leadership, aims to challenge the incumbent Labour mayor Sir Sadiq Khan. Cleverly argues that London has been neglected by Labour and requires more than administrative leadership to restore the capital's reputation.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5ye8p8xpg4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Cleverly quits shadow cabinet to run for London mayor\n- Published\nConservative MP Sir James Cleverly has said he is resigning from the shadow cabinet to run for London mayor.\n\"I am putting myself forward to be the Conservative candidate for mayor of London, because our capital needs more than an administrator,\" he wrote in the Times, external.\nSir James said he has told Tory leader Kemi Badenoch he is stepping down as shadow housing secretary, saying: \"I must be free to speak about every aspect of London's future and concentrate fully on winning this race.\"\nThe capital is not set to vote on a new mayor until May 2028. Labour incumbent Sir Sadiq Khan is yet to confirm whether he will seek an unprecedented fourth term.\nThe Conservatives are yet to pick their candidate for the London mayoral race.\nA source close to Badenoch said Cleverly \"is a formidable politician and will out-campaign Khan\".\nSir James, who was foreign secretary under former Prime Minister Rishi Sunak, wrote that he intended to make London a city to be proud of again.\n\"We must rebuild its reputation and make it, once again, the best place in the world to live, work, invest and build a business,\" he added.\nA senior Conservative politician, Sir James has held a number of ministerial positions under three prime ministers - including roles as home secretary and education secretary.\nThe army reservist represented the Tories on the London Assembly before his election as MP for Braintree in 2015.\nAfter rising through the backbenches, he unsuccessfully ran for Conservative party leader in 2024, losing out to Badenoch.\nReacting to Sir James's announcement, a source said Badenoch \"really didn't want James to leave shadow cabinet\", but believed \"he will be a big asset in London\".\nCurrent London Mayor Sir Sadiq began his first term in 2016. Cleverly wrote that the capital has been \"let down by Labour\".\nHe accused Prime Minister Andy Burnham of treating London as a \"cash cow: somewhere to tax, regulate, raid and blame\".\nSir James said: \"Londoners need homes they can afford to buy or rent. Entrepreneurs need to be able to start and grow businesses without being strangled by cost and regulation.\"\nThe last time Londoners voted for their mayor in May 2024, Sir Sadiq beat Conservative rival Susan Hall by more than 275,000 votes - representing a swing of 3.2% to Labour.\nThe mayor won nine of the 14 constituencies including two gains from the Tories, and gained 43.8% of the vote share.\nReform UK revealed its candidate for the May 2028 election in January when it announced Westminster City councillor Laila Cunningham would be standing.\nReacting on social media, Reform UK leader Nigel Farage wrote the Conservatives are \"done for\", and said Cleverly \"will not be the first Tory MP to give up any hope of winning their seat in Essex\".\nCleverly has not resigned as an MP yet.\nHis announcement follows speculation in recent weeks that he would step down and launch a bid to become London's next mayor.\nDuring his time at the London Assembly, Cleverly chaired the London Fire and Emergency Planning Authority, and also worked for Boris Johnson while he was mayor of London.\nRelated topics\nSee also\n  - Published12 hours ago\n  - Published21 hours ago", "translation_ja": "", "vocab": [{"word": "incumbent", "definition": "現職の、職務中の。特に公職にある人が現在その職にあることを指す。この場合、現職のロンドン市長を意味する。"}, {"word": "formidable", "definition": "手ごわい、強大な、恐ろしい。相手として対抗が難しい能力や力を持っていることを表す。"}, {"word": "candidacy", "definition": "候補者としての地位や立候補。政治選挙などで候補者になる状態またはプロセスを指す。"}, {"word": "strangle", "definition": "絞殺する、圧迫する、阻害する。ここでは比喩的に、ビジネスの成長を規制や費用で妨げることを意味する。"}, {"word": "unprecedented", "definition": "前例のない、かつてない。過去に起こった例がない新しい事柄や状況を表す。"}]}, {"title_ja": "サラ・ファーガソン前ヨーク公爵夫人、間もなくUK帰国へ", "title_en": "Sarah Ferguson Expected to Return to UK Shortly", "summary_ja": "ヨーク公爵夫人の前身であるサラ・ファーガソンは、10月にロイヤル・ロッジからの強制退去後、海外で過ごした時間を経てUKへの帰国が間近と予想されている。スイスのアルペンシャレーで滞在していたと報告されており、ホーム・カウンティーズの6寝室の賃貸物件への引っ越しが予定されている。ジェフリー・エプスタイン・スキャンダルに巻き込まれた後、王族の称号を失った。", "summary_en": "Sarah Ferguson, the former Duchess of York, is expected to return to the UK imminently after spending time abroad following her forced departure from Royal Lodge in October. She has reportedly been staying at an Alpine chalet in Switzerland and is set to move into a six-bedroom rental property in the Home Counties. Ferguson lost her royal titles after becoming embroiled in the Jeffrey Epstein scandal.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ce8xn9ge6xeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Sarah Ferguson expected back in the UK 'shortly', source says\n- Published\nThe former Duchess of York is expected \"back in the UK shortly\", a source close to her has told the BBC.\nSarah Ferguson was thought to be living abroad after she was forced to move out of Royal Lodge in Windsor, which she shared with her ex-husband Andrew Mountbatten-Windsor, in October.\nFerguson was last seen in public at the Duchess of Kent's funeral the previous month.\nShe is reportedly renting a gated property in the Home Counties, according to the Sun newspaper.\nMountbatten-Windsor and Ferguson relinquished their royal titles following increased scrutiny and revelations surrounding their links to disgraced financier and sex offender Jeffrey Epstein.\n- Who is in the Epstein files? \n  - Published26 February\nFerguson is expected to move into the six-bedroom home \"imminently\", which could be as soon as next week, the Sun reported, external.\nIt is believed she has been spending her time out of the public eye at an Alpine chalet in Verbier, Switzerland, since leaving Royal Lodge. Her belongings were collected from Mountbatten-Windsor's home in Sandringham this week, the newspaper added.\nShe had been keeping a low profile since losing her titles alongside Mountbatten-Windsor after she became mired in the scandal about her connections to Epstein, and faced calls to speak to US authorities after last year's release of millions of documents shed new light on their relationship.\nIn one email exchange from 2011, she appeared to privately apologise for her public rejection of Epstein, saying: \"You have always been a steadfast, generous and supreme friend to me and my family.\"\nA spokesperson for the duchess previously said the email was sent after Epstein had threatened to sue her for defamation - in an effort to convince him not to.\nAnother email suggested Ferguson took her daughters to see Epstein in the US days after he was released from prison for child sex crimes.\nThe emails do not indicate any wrongdoing.\nEpstein was also ultimately the downfall of Mountbatten-Windsor, who was stripped of his titles by the King because of \"serious lapses of judgment\" over his friendship with the late paedophile. Mountbatten-Windsor has always denied any wrongdoing in relation to Epstein.\nFerguson lost her courtesy royal divorcee title and reverted to her maiden name, and also lost the freedom of the city of York after councillors voted unanimously to remove the honour over the scandal.\nHer expected return comes just days after the Duke and Duchess of Sussex came back to Britain with their children to begin a new life after six years living in the US.\n  - Published5 February\n  - Published31 January", "translation_ja": "", "vocab": [{"word": "relinquished", "definition": "権利や地位などを自発的にまたは強制的に放棄する、手放すという意味。この記事では王族の称号を失ったことを表している。"}, {"word": "scrutiny", "definition": "詳しく厳密な調査や検査を意味する。ここでは王族の関係者に対する詳細な検証と注視を指している。"}, {"word": "disgraced", "definition": "名誉や信用を失った、不名誉な状態にある人物を表す形容詞。この文脈ではエプスタインの悪評を指す。"}, {"word": "imminently", "definition": "非常に近い将来に、間もなくという意味の副詞。ここでは引っ越しがすぐに起こることを示している。"}, {"word": "mired", "definition": "困難な状況や問題に深く関わっている、身動きが取れない状態を表す。スキャンダルに巻き込まれたことを強調している。"}, {"word": "defamation", "definition": "他人の名誉や信用を傷つけることで、法的な言葉として名誉毀損を意味する。ここではエプスタインが訴訟を検討していた犯罪行為。"}]}, {"title_ja": "ノルウェーのハーコン国王、故ハラルド父王を追悼する君主初演説", "title_en": "Norway's King Haakon Honors Late Father Harald in First Speech as Sovereign", "summary_ja": "ノルウェーのハーコン8世国王は、30年以上の在位期間を経て89歳で亡くなった父ハラルド5世の死後、国民への初の演説を行った。テレビ放映された感情的なスピーチで、ハーコンは父親を献身的な家族思いの改革者として追悼しながら、ノルウェーの立憲君主制と民主的価値観を守ることを誓った。新国王は火曜日に議会で宣誓を行う予定であり、国家喪の期間が宣言されている。", "summary_en": "King Haakon VIII of Norway delivered his first address to the nation following the death of his father, King Harald V, at age 89 after over 30 years on the throne. In an emotional televised speech, Haakon paid tribute to his father as a dedicated family man and reformer while pledging to uphold Norway's constitutional monarchy and democratic values. The new king will swear an oath in parliament on Tuesday, with a national period of mourning declared and Harald's funeral date to be announced.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/norway-s-new-king-haakon-remembers-dear-father-harald-in-first-speech-as-sovereign/a-78560155?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Norway: New King Haakon makes first speech to the nation\nAugust 30, 2026\nKing Haakon VIII of Norway paid tribute to his late father, King Harald V, calling him \"such a wonderful papa\" in his first address to the nation as monarch.\n\"Above all, you were a person who remained committed to your values and dedicated to your duties,\" Haakon said Saturday in a televised speech. \"We greatly mourn his loss. At the same time, it gives us consolation and strength to know that there are so many who are grieving with us.\"\nNorway's King Harald died at 89, after more than three decades on the throne, during which time he became known as a reformer and a popular monarch. In a televised speech from the palace, Haakon praised his father as a \"warm and devoted family man.\"\nHaakon became emotional while speaking about his widowed mother, Queen Sonja. He noted that his parents would have celebrated their 58th wedding anniversary on Saturday.\nEarlier on Saturday, Haakon met at the palace with leaders of the Church of Norway, parliament and the Supreme Court. He also received Prime Minister Jonas Gahr Store, who viewed the late king’s casket after it was brought to the palace from Oslo University Hospital on Friday evening.\nFlags flew at half-mast Saturday as mourners continued to gather at the palace, laying flowers alongside tributes left the previous day by more than 20,000 people.\nHaakon stresses he will do things 'his own way'\nHaakon said he would follow his own path, as his father did before him, while reaffirming the principles of Norway’s constitutional monarchy. He is due to swear an oath in parliament on Tuesday to uphold the country’s constitution and laws.\n\"We believe in our system of self-governance — and in democracy. We believe in a society built on the rule of law, where every individual has equal worth,\" he said.\nHaakon automatically became king following his father’s death. Norway does not hold coronations, which were abolished by parliament in 1908.\nBut, like his father and grandfather before him, Haakon could opt for a consecration ceremony at Trondheim Cathedral, where Norwegian monarchs were crowned between 1814 and 1906.\nThe Norwegian prime minister told Reuters news agency that Haakon shared many of his father’s qualities, particularly his \"ability to create an atmosphere of togetherness.\"\nMourning and challenges for the royal family\nA national period of mourning has been declared, with no date yet set for Harald’s funeral. Churches across Norway will hold memorial services Sunday, including one in Asker, south of Oslo, which the royal family was scheduled to attend.\nHarald was widely regarded as a symbol of an open and tolerant Norway and praised for leading a modern, modest monarchy.\nThe king had been hospitalized in Oslo since August 17 with hemolytic anemia, a condition that causes the rapid destruction of red blood cells and can lead to fatigue and shortness of breath. His health had deteriorated in recent years, forcing him to reduce his official duties.\nThe royal family has also faced a series of challenges. Haakon’s wife, Queen Mette-Marit, has come under scrutiny over her ties to the late US sex offender Jeffrey Epstein.\nIn June, her son from a previous relationship was sentenced to four years in prison for two rapes, a sentence he is appealing.\nMette-Marit, 53, who has a serious lung disease, underwent a lung transplant in July.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "sovereign", "definition": "最高権力を持つ統治者、または国家の主権者のこと。君主や独立国の指導者を指す正式な表現。"}, {"word": "constitutional monarchy", "definition": "憲法により権力が制限された君主制。君主は象徴的な役割を果たし、法律や国民の権利によって支配される政治体制。"}, {"word": "consecration", "definition": "宗教的な儀式によって神聖な物や人を奉献すること。王や聖職者の正式な就任式を指すことが多い。"}, {"word": "hemolytic anemia", "definition": "赤血球が急速に破壊される血液疾患。疲労と呼吸困難を引き起こす医学的な病状。"}, {"word": "scrutiny", "definition": "厳密な検査や調査、注視のこと。疑わしい事柄や重大な関心事について詳しく調べることを意味する。"}, {"word": "deteriorated", "definition": "悪化した、または品質や状態が低下したこと。時間とともに状況が悪くなったことを表す。"}]}, {"title_ja": "トルコとソマリア軍がソマリア沖で海賊に占拠された船舶を解放", "title_en": "Turkish and Somali Forces Free Vessel Seized by Pirates", "summary_ja": "トルコ海軍とソマリア武装勢力は、8月17日にソマリア沖で海賊に乗っ取られたカメルーン船籍の船舶MV LUTUFを無事救出した。10日間の作戦中に14人の海賊が殺害され、海賊が使用していた4隻のボートが破壊された。この作戦は、2026年にソマリア沖での攻撃が少なくとも15件記録されているアフリカの角地域における海賊行為の復活を浮き彫りにしている。", "summary_en": "Turkish naval forces and Somali armed forces successfully freed the MV LUTUF, a Cameroon-flagged vessel hijacked on August 17 off Somalia's coast. During the 10-day operation, 14 pirates were killed and four pirate boats were destroyed. The operation highlights the resurgence of piracy in the Horn of Africa, with at least 15 attacks recorded off Somalia's coast in 2026.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/turkish-somali-forces-free-vessel-seized-by-pirates-in-somalia/a-78560087?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Turkish, Somali forces free pirate-seized vessel in Somalia\nAugust 29, 2026\nTurkey’s navy and Somali armed forces have freed a hijacked vessel in Somali waters and killed 14 alleged pirates following a battle that lasted several days, Somalia’s government said on Saturday.\n\"During the 10-day operation, four boats used by the pirates were destroyed and 14 pirates were killed,\" said a Somali Defense Ministry statement. \"The sustained military pressure finally forced the remaining pirates to abandon the ship.\"\nThe MV LUTUF, a Cameroon-flagged vessel, was hijacked on August 17 off the coast of the Nugaal region of Puntland state. The joint Turkey-Somalia operation was carried out as part of a defense cooperation agreement between the two countries.\nThe ministry did not provide details about any casualties or the well-being of the crew aboard the vessel but said, \"The forces subsequently secured the MV LATUF, which has now safely resumed its journey.\"\nAccording to AFP news agency sources, at least eight members of the crew were on board, including one Turkish national.\nResurgence of piracy along Somalia’s coast\nThe Horn of Africa has seen a resurgence in piracy since April, according to figures from the International Maritime Organization, with at least 15 attacks off the coast of Somalia this year.\nAt least five cargo ships were held hostage, the most recent of which was seized on August 20 off Yemen.\nThese attacks are the highest since 2013. Piracy was rampant off the coast of Somaliain the 2000s. It peaked in 2011 before being curbed by international naval deployments and new protection measures for commercial shipping.\nThe resurgence of piracy in the Horn of Africa is adding to mounting challenges for international shipping in the Middle East, where vessels are already navigating around the contested Strait of Hormuz and seeking to avoid Houthi attacks in the Red Sea.\nIn recent years, pirate attacks have also increased along the West African coast, adding another layer of risk for commercial shipping.\nEdited by: Sean Sinico\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "hijacked", "definition": "不法に乗っ取られた、強制的に奪い取られたという意味。航空機や船舶などの乗り物が武装した者たちによって制御下に置かれた状況を指す。"}, {"word": "resurgence", "definition": "再び勃発すること、復活という意味。以前あった問題や現象が再び増加・拡大すること。"}, {"word": "rampant", "definition": "広く蔓延している、猖獗を極めているという意味。ある悪い状況や問題が制御不能なほど広がっている状態を表す。"}, {"word": "curbed", "definition": "抑制された、制限されたという意味。ある行為や現象を制御・制限する措置が取られたことを指す。"}, {"word": "maritime", "definition": "海洋の、海事に関するという意味。海、船舶、海上輸送などに関連する事柄を表す。"}, {"word": "deployment", "definition": "配置、展開という意味。兵力や資源を戦略的に配置・活動させることを指す。"}]}, {"title_ja": "イスラエル人入植者がヨルダン川西岸のパレスチナ人の家を襲撃", "title_en": "Israeli settlers attack Palestinian homes in West Bank", "summary_ja": "仮面をかぶったイスラエル人入植者が土曜日にヨルダン川西岸を占領するパレスチナ人を襲撃し、石を投げて住民を家に閉じ込めた。パレスチナの住民はイスラエル軍によるペッパースプレーと催涙ガスの使用、殴打を報告し、イスラエル軍が暴力の最中に入植者を保護したと主張した。この攻撃はネタニヤフ首相とハッカビー駐イスラエル米国大使から珍しい批判を招き、大使は過激派入植者を『イスラエルのテロリスト』と呼んだ。", "summary_en": "Masked Israeli settlers attacked Palestinians in the occupied West Bank on Saturday, pelting them with rocks and trapping residents in their homes during the first major incident since a siege began earlier in August. Palestinian residents reported being pepper sprayed, tear gassed, and beaten by Israeli forces, while some claimed the IDF protected the settlers during the violence. The attack drew rare criticism from Prime Minister Netanyahu and US Ambassador Mike Huckabee, who labeled radical settlers as 'Israeli terrorists.'", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/israeli-settlers-attack-palestinian-homes-in-west-bank/a-78560116?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Israeli settlers attack Palestinian homes in West Bank\nAugust 29, 2026\nMasked Israeli settlers attacked Palestinians in the occupied West Bank on Saturday, pelting them with rocks and trapping residents in their homes.\nThe incident was the first major attack by Israeli settlers since they began a siege in the villages of Qusra and neighboring Jalud earlier this month.\nOn Saturday, settlers descended on Qusra and began pelting Palestinians with rocks. When dozens of residents sought to barricade themselves in a home, settlers followed them in, according to the Israel Defense Forces (IDF).\n\"The security forces who arrived at the scene initially operated to remove the rioters from the home and separate the groups, in order to protect the residents inside the house,\" said an IDF statement.\nWho is the IDF protecting in such situations?\nAlthough the IDF said settler vehicles had been impounded and authorities were gathering evidence, Palestinian media said the IDF protected the settlers during the melee.\nA number of Palestinians said they were injured after being pepper sprayed by settlers, and reported that other Israeli settlers had tried to burn nearby fields owned by Palestinians.\nOne Palestinian said the IDF had fired tear gas into the home that he was in and held several people inside while at the same time letting Israeli settlers go free.\nOther Palestinians said IDF officers had handcuffed, blindfolded and beaten residents trapped inside before letting them go.\nLocal Palestinians told international news teams that they had been trapped in their homes for hours waiting for help from the IDF.\nThe IDF did not comment on the use of tear gas nor accusations of handcuffs and beatings.\nSaturday attacks elicit rare criticism from Netanyahu\nSaturday's attacks took place just yards away from three other Qusra homes that radical Jewish settlers targeted in a siege that began three weeks ago.\nDespite a massive Israeli military presence that local Palestinians say has kept them imprisoned in their houses, residents report near-daily settler encroachments.\nRights groups say settler aggression is part of an — illegal — effort to seize land from residents in the occupied West Bank, where Palestinians hope to one day found their own independent state. The Israeli government has rejected accusations of illegality. Various Israeli political figures have justified the settlements for security reasons or argued there are biblical grounds for the creation of the settlements.\nThe IDF has said it will continue \"to operate in the areas of Qusra and Jalud to prevent further disturbances and restore order in the area.\"\nAlthough settlers have been emboldened by the stance of Israel's far-right government — which has encouraged settlement building despite broad international opposition — the Saturday attack managed to elicit rare criticism from Prime Minister Benjamin Netanyahu.\nOn Saturday, Netanyahu released a statement on X saying, \"I strongly condemn the criminal acts of violence committed in the villages of Qusra and Jalud by a handful of rioters who are violating the law, causing a grave injustice to the law-abiding Jewish community, interfering with the IDF in carrying out its missions, and harming Israel's standing in the world.\"\nIncreasing Israeli settler violence has even garnered criticism from US Ambassador to Israel Mike Huckabee, who recently denounced radical settlers in the West Bank as \"Israeli terrorists,\" adding that those behind the siege of Qusra could face US sanctions.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.\nEdited by: Wesley Dockery", "translation_ja": "", "vocab": [{"word": "siege", "definition": "都市や施設を軍事力で取り囲み、補給を遮断する戦術。ここでは入植者がパレスチナの村を取り囲んで住民を監禁する行為を指す。"}, {"word": "encroachment", "definition": "他者の領土や権利に徐々に侵入すること。ここではイスラエル人入植者がパレスチナ人の土地に継続的に侵害する行為を意味する。"}, {"word": "emboldened", "definition": "勇気や自信を持つようになること。ここでは政府の支持によってイスラエル人入植者が違法行為をより大胆に行うようになったことを表す。"}, {"word": "denounce", "definition": "公式に非難または批判すること。ここではハッカビー大使が過激派入植者を公に非難する行為を指す。"}, {"word": "melee", "definition": "多くの人が関わる混乱した乱闘や衝突。ここでは入植者とパレスチナ住民の間で起きた激しい争いを表す。"}, {"word": "impounded", "definition": "政府機関が没収または差し押さえすること。ここではイスラエル当局が入植者の車両を没収したことを意味する。"}]}, {"title_ja": "ネパール大洪水で死者数増加、数千人がなお行方不明", "title_en": "Nepal death toll rises from massive flood as thousands still missing", "summary_ja": "水曜日にネパール・チベット国境地域を襲った壊滅的な土砂崩れにより、約3,000人が行方不明になっている。災害から数日経った現在も、救助・復旧活動が続く中、死者数は増加し続けている。洪水により被災地域の大部分が破壊された。", "summary_en": "A devastating flash flood struck the Nepal-Tibet border region on Wednesday, leaving nearly 3,000 people missing. The death toll continues to rise as rescue and recovery efforts proceed days after the disaster. The flooding obliterated parts of the affected region, causing widespread destruction.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/hundreds-dead-1000-remain-missing-massive-nepal-tibet/story?id=136022919", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースと生中継イベントを24時間体制で提供しています。主要なニュースがリアルタイムで展開される中、常に最新情報を得られます。国内および国際的なニュースについて包括的なレポートにアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. Stay informed with real-time updates on major stories as they develop. Access comprehensive reporting on national and international events.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英国の極右扇動家ミロ・ヤイアノプロスがICEによって国外追放", "title_en": "British Far-Right Commentator Milo Yiannopoulos Deported by ICE", "summary_ja": "英国の極右政治評論家ミロ・ヤイアノプロスが米移民関税執行局（ICE）に拘束され、その後英国に国外追放された。この逮捕と国外追放は、英国の扇動家の米国での法的地位に関する重大な進展である。", "summary_en": "Milo Yiannopoulos, a controversial British far-right political commentator, was detained by U.S. Immigration and Customs Enforcement (ICE) and subsequently deported to the United Kingdom. The arrest and deportation mark a significant development regarding the British provocateur's legal status in the United States.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/milo-yiannopoulos-british-commentator-detained-ice/story?id=136038107", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウィーン美術館で盗難されたエジプト王妃の673個のダイヤモンド首飾り", "title_en": "Egyptian Queen's 673-Diamond Necklace Stolen in Vienna Museum Heist", "summary_ja": "2人の男がウィーン応用美術館で200カラットのプラチナ製首飾り（673個のダイヤモンド嵌入）を昼間に盗んだ。この首飾りはかつてエジプトの王妃ナズリに所有され、430万ドルの価値があった。この盗難はヨーロッパ全体での美術館泥棒の波の一部である。", "summary_en": "Two men stole a 200-carat platinum necklace with 673 diamonds from Vienna's Museum of Applied Arts during a daytime smash-and-grab raid. The necklace, once owned by Egyptian Queen Consort Nazli and worth $4.3 million, was on loan for a Van Cleef & Arpels exhibition. The theft is part of a growing wave of high-profile museum robberies across Europe.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/artanddesign/2026/aug/28/egyptian-queen-diamond-necklace-stolen-vienna-raid", "state_media": false, "category": "社会", "full_text": "Austrian police are hunting two men alleged to have stolen a 200-carat platinum necklace encrusted with 673 diamonds that was on loan to a museum in Vienna and once belonged to Egyptian royalty.\nAuthorities in the capital released pictures of the suspects captured by security cameras during the heist at the Museum of Applied Arts (MAK), amid a rash of spectacular smash-and-grab thefts from European cultural institutions.\nThe unmasked men bought tickets to the exhibition before shattering a glass display case with a hammer during opening hours on Thursday afternoon and making off with the diamond necklace.\nIn an appeal for information from the public, police said: “The perpetrators fled with the jewellery in an unknown direction.”\nOfficers fanned out through the city centre and deployed a police tracking dog to search for the suspects. The Kronen newspaper said investigators believed the men were probably carrying out a “contract job” on behalf of a criminal gang.\nMAK said the piece had been snatched from a jewellery exhibition that had been on display since June, featuring more than 300 works by the French designers Van Cleef & Arpels. No one was hurt, although there were several witnesses in the room at the time.\nDocumentation for the show said the necklace once belonged to Queen Consort Nazli of Egypt, who wore it at the 1939 wedding of her daughter Fawzia to Iran’s then crown prince, Mohammad Reza Pahlavi, who later became shah. The necklace was sold by Sotheby’s in New York in 2015 for $4.3m.\nThe MAK said the exhibition brought together about 200 “unique and rarely seen objects” from its own collection and pieces spanning the 120-year history of the Parisian jewellery house, from the Van Cleef & Arpels patrimonial collection.\nA guided tour planned for Friday afternoon was listed as “cancelled” on the museum website and the exhibition, which was due to end on 27 September, was temporarily closed.\nEuropean museums have been hit by a string of high-profile heists since thieves broke into the Louvre museum in Paris during the day last October and escaped within minutes with crown jewels worth €88m.\nIn Spain on Thursday, thieves raided the Treasure of Villena, a collection of bronze age gold artefacts described as one of Europe’s most important prehistoric hoards.\nThis month, four of the most important works by the 15th-century Renaissance master Antonello da Messina were stolen during a national holiday from a museum in the Sicilian port city of Messina.\nTwo days earlier, Italian police said they had recovered three paintings by the French masters Paul Cézanne, Pierre-Auguste Renoir and Henri Matisse that were taken this year from a private museum near the northern city of Parma.\nA report by Europol this month found that robberies at European museums are becoming increasingly violent, with thieves sometimes brandishing guns, assaulting staff and using sledgehammers, axes and even explosives to smash their way to targeted loot.", "translation_ja": "", "vocab": [{"word": "smash-and-grab", "definition": "短時間で窓やケースを壊して品物を盗む手口。素早い盗難犯罪を指します。"}, {"word": "heist", "definition": "大規模な盗難や強盗事件。特に組織的で計画的な盗難を意味します。"}, {"word": "perpetrators", "definition": "犯罪や悪行を実行した人物。犯人や容疑者を指す正式な用語です。"}, {"word": "contract job", "definition": "依頼された仕事や契約による犯罪。誰かに指示されて実行される犯行を意味します。"}, {"word": "patrimonial", "definition": "相続財産や家族代々の所有物に関する。文化遺産や家宝を指します。"}, {"word": "hoard", "definition": "集められて保管された貴重品や遺物の蓄積。歴史的な宝物の集合を意味します。"}]}, {"title_ja": "メタの米国和解：アメリカの勝利だが、世界の他の地域はどうなるのか？", "title_en": "Meta's US Settlement: A Victory for America, But What About the Rest of World?", "summary_ja": "メタが米国の29州に180億ドルの支払いに同意し、未成年向けの使用制限を実施することになりました。これは米国での規制上の勝利を示しています。しかし、この和解はエチオピアの内戦中に暴力につながるコンテンツを宣伝したメタの役割についてケニアで提起された訴訟を含む、世界中の重大な案件を未解決のままにしており、同社の世界的な説明責任の欠落を浮き彫りにしています。", "summary_en": "Meta agreed to pay $18 billion to 29 US states and implement usage limits for minors, marking a regulatory victory in the US. However, the settlement leaves unresolved critical cases worldwide, including a lawsuit in Kenya over Meta's role in promoting content that led to violence during Ethiopia's civil war, highlighting the company's global accountability gap.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/technology/2026/aug/28/meta-facebook-us-lawsuit-settlement-world-impact", "state_media": false, "category": "政治", "full_text": "In October 2021, Abrham Meareg’s father, a professor of chemistry in Ethiopia’s northern town of Bahir Dar, was shot at close range and died outside his family home. This was in the middle of the country’s civil war.\nFor weeks, Facebook’s algorithm had actively promoted posts calling for the academic to be murdered, according to Meareg and Foxglove, a nonprofit organisation supporting Meareg’s lawsuit against the company in Kenya. These posts included photos of his father and his home address.\nMeareg filed the lawsuit in 2022. He said he repeatedly asked Facebook to remove the posts and the company did nothing. Nearly four years later, the case has still not been heard. Foxglove said Meta, Facebook’s parent company, had “fought tooth and nail to avoid responsibility”.\nMeareg said: “It’s a matter of numbers to them, a matter of statistics. It has been proven multiple times that our lives do not matter to them.”\nOn Wednesday, Meta settled a lawsuit brought by 29 US states who argued it had designed addictive products that hooked young people. The social media company agreed to pay $18bn and to change certain features of its platform in the US. California’s attorney general said it was a victory that would make “a world of difference for children and their families”.\nBut elsewhere in the world, in jurisdictions as far flung as Amsterdam and Nairobi, other claims have yet to be heard. Far bigger questions about the power of a single US technology company to shape politics and democracy everywhere on Earth are still to be answered.\nFor the US, the settlement is a victory. A jury has done what the US Congress could not – put controls on a powerful tech company. As a part of the settlement, Meta has said it will set time limits on children’s use of its platforms Facebook and Instagram and block night-time usage.\nFor Meta, the settlement is also a victory. Its share price rose in the hours after the deal was announced. Its CEO, Mark Zuckerberg, was not forced to testify. The sum it is to pay, while not meaningless, is far less than the states had sought – $200bn – or the amount Meta itself had suggested in a court filing it might have to pay, which was up to $1.4tn.\nFor the rest of the world, however, the picture is more mixed. The limits Meta will put on its US platform are, in large part, similar to limits the UK and Australia have already achieved through regulation. There are certain concessions Meta has now made that other governments could also demand: for example, while the UK plans to ban under-16s from social media platforms, it may wish to ask Meta to impose a default daily use limit of two hours for under-18s, which is what the company has agreed to in the US.\nNone of this meaningfully changes the equation for Meareg or what his case represents, which is that a massive US company, unaccountable to voters, unbound by transparency requirements, owns a worldwide digital commons that shapes reality for billions of people.\nWhether courts and governments outside the US have the power to confront this fact is a far thornier question.\nThe central issue of Meareg’s case is Meta’s algorithm. This is the system that decides what content to show users of Facebook and Instagram. It sees you linger over a video about knitting sweaters, for example, and then decides you’ll like one about how to care for your spider plant.\nIt sees teenage girls watch diet content and shows them anorexia influencers. It sees young men search for bodybuilding content and shows them Andrew Tate. It is alleged to have amplified content that promoted the ethnic cleansing of the Rohingya in Myanmar. It contributed to the election victory of Donald Trump.\nMeareg’s lawsuit rests on the claim that this algorithm promoted the posts that called for the death of his father, and that Facebook’s sparse moderation in east Africa did almost nothing to prevent this.\nIn the early days of the Meta trial in the US, it seemed plausible that states would push the social media firm to finally make some changes to this algorithm. Those changes had the potential to fundamentally alter how the company does business. Meta’s algorithm is intended to keep users scrolling, stuck on the platform, and then it shows them ads.\nBut that is not what appears to have happened. The terms of the settlement will slightly change what is shown to minors, in that they will not necessarily have personalised feeds. But it is hard to see this concession changing the equation in war zones or creaking democracies.\nArturo Béjar, an ex-Facebook employee and whistleblower, said the limitations were “the equivalent of saying: ‘Well, you can smoke as many cigarettes as you can in two hours a day.’ It doesn’t make the cigarettes any safer.”\nIt may be up to groups and individuals elsewhere in the world to try to push for these larger changes. It will be an uphill struggle.\nIn Kenya, the high court recently ruled that Meareg’s case against Meta could go ahead, after years of legal manoeuvring", "translation_ja": "", "vocab": [{"word": "algorithm", "definition": "ユーザーに表示するコンテンツを決定するコンピュータプログラムやシステム。メタの場合、ユーザーの行動に基づいて広告やコンテンツを選別し、プラットフォームに留めるよう設計されています。"}, {"word": "accountability", "definition": "組織や個人が自らの行動に対して責任を負い、説明する義務のこと。この記事ではメタが世界的な有権者に対して説明責任を果たしていないことが論じられています。"}, {"word": "jurisdiction", "definition": "裁判所や政府が法律を適用できる地理的または法的な領域。アムステルダムやナイロビなどの異なる司法管轄区では、メタに対する異なる法的請求が提起されています。"}, {"word": "amplified", "definition": "情報やコンテンツを拡大・増幅させること。メタのアルゴリズムがミャンマーの少数民族に対する扇動的なコンテンツを拡散させたと主張されています。"}, {"word": "moderation", "definition": "オンラインコンテンツの監視と管理。違法または有害なコンテンツを削除または制限するプロセスです。この記事では東アフリカでのメタの監視が不十分だと指摘されています。"}, {"word": "concession", "definition": "譲歩や譲り合い。交渉で一方が相手の要求に応じて譲ること。メタは米国との和解で未成年者向けのいくつかの譲歩をしました。"}]}, {"title_ja": "英国、姉の活動を理由にカイロで逮捕された英国系エジプト人女性の釈放を支援するよう促される", "title_en": "UK urged to intervene for British-Egyptian woman arrested in Cairo over sister's activism", "summary_ja": "英国系エジプト人女性エマン・エル=シャズリ（45歳）が8月にカイロで逮捕され、エジプト政府を批判するYouTubeでの姉モナの政治活動に対する報復と見られている。英国外務省に介入を求める声があり、専門家はエジプトが海外の批評家を沈黙させるため、家族を逮捕する「代理罰」戦術を使用していると警告している。", "summary_en": "Eman el-Shazly, a 45-year-old British-Egyptian woman, was arrested in Cairo in August, allegedly as retaliation for her sister Mona's political activism on YouTube criticizing the Egyptian government. The UK Foreign Office has been asked to intervene, as experts warn Egypt uses 'punishment by proxy' to silence overseas critics by detaining their family members.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/27/uk-urged-to-help-free-british-egyptian-arrested-in-cairo-over-sisters-activism", "state_media": false, "category": "政治", "full_text": "The UK Foreign Office has been asked to intervene to secure the release of a British-Egyptian woman who it is claimed has been arrested in Cairo because of her sister’s political activism.\nEman el-Shazly, a 45-year-old based in Birmingham, was arrested on 16 August while visiting Egypt. Her lawyers say she has been detained in an attempt to silence her sister Mona, a relentless and harsh critic of the Egyptian government on her UK-based YouTube channel.\nHer two brothers have already spent three years in jail and, in May, were rearrested. They were previously held in pre-trial detention, facing charges of “promoting the ideas of a terrorist organisation on social media, as well as broadcasting false news harmful to state security”.\nThe UK Foreign Office has confirmed to the husband of Eman that she is being held in the Ramadan rehabilitation centre and her case has been given the same file number as that of her two brothers, Hassan and Eid.\nThe government of President Abdel Fatah al-Sisi has faced allegations that it frequently arrests relatives of political critics to put indirect pressure on the dissidents to end their overseas criticism of his rule or of state corruption. Much of Mona’s activism focuses on alleged cases of corruption inside the security services or public utilities, a highly sensitive subject in Egypt.\nArfan Rashid, the lawyer acting for Eman’s husband with whom she has four children, says that unlike Mona his wife has never been involved in politics, and had gone to Cairo two months ago to look after her ill mother after the arrest of her two brothers.\n“There is ample evidence that Eman has been arrested to silence Mona,” Rashid said. He added that Eman had told the security officials she was no longer in contact with her sister, and that many family members had repeatedly asked her to stop her political activism in the UK, but to no effect.\nMona confirmed to the Guardian that she had been asked to halt her activism by other family members, including to take down her YouTube videos.\nBut she added: “I have done nothing wrong nor broken any law … I am a very strong woman, but it is very traumatic for me since 11 or 12 children are without their parents. It is a horrible situation, but the Egyptian government will not stop if I appear weak. The government is close to collapsing.”\nRashid said the UK government had recognised the practice of “punishment by proxy” in Egypt in its country profile policy and information note published in March 2026. Human Rights Watch and the House of Commons library warned in 2021 of an escalating pattern in which Egyptian family members of critics living abroad were being targeted.\nMona runs a YouTube channel in the UK that has 130,000 subscribers. She is also active on X, making specific and controversial claims about government officials.\nThe UK’s Foreign Office representation in Cairo has asked for access to see Eman but has not yet received a positive reply.\nEman’s husband, Zeesharn Moustapha, has said Egyptian police and security officers attended the family home where she was staying a few days before the arrest, and demanded that Eman tell Mona to stop publishing material against the Egyptian government.\nOn X, Mona has claimed as many as five members of her family have been detained or harassed by the Egyptian authorities. She wrote: “Kinship is something beyond my family’s will, and I invite them to disown me to save themselves from this despicable, illegitimate dictator. I am the one opposing Sisi, not five individuals from my family. This is a crime against humanity that does not lapse with time.” She has lived in the UK for 18 years.\nEman became a British citizen through marriage. Her lawyer has asked whether Alistair Burt, the UK’s new envoy on complex consular cases, should be asked to intervene by the Foreign Office. Burt was appointed a month ago and has been tasked with working to secure the release of British citizens held abroad.\nBurt has already met Gurpreet Singh Johal, the brother of Jagtar Singh Johal, who has been detained by the Indian authorities for nearly nine years without a conviction.\nThe Foreign Office has been approached for comment.", "translation_ja": "", "vocab": [{"word": "retaliation", "definition": "報復や仕返しの行為。他者の行動に対する反撃や懲罰的な応答を指す。"}, {"word": "proxy", "definition": "代理人や代替物を意味し、ここでは間接的な手段や方法を指す。「punishment by proxy」は家族を標的にして本人を間接的に罰すること。"}, {"word": "escalating", "definition": "段階的に増加・悪化すること。問題やパターンが徐々に深刻になる過程を表す。"}, {"word": "consular", "definition": "領事に関する、または領事館の業務に関する形容詞。外国で国民を支援する公式の役割を指す。"}, {"word": "dissidents", "definition": "政府や権力に対して異議を唱える人々。政治的な反対派や反体制活動家を指す。"}]}, {"title_ja": "米国がベネズエラの石油埋蔵量の支配権を確保", "title_en": "US Secures Control of Venezuelan Oil Reserves in Major Deal", "summary_ja": "トランプ政権は、ベネズエラの650億バレルの石油埋蔵量の大部分を支配する協定を発表した。この取り決めは、マドゥーロ前大統領の逮捕とロドリゲス暫定大統領の就任に続くもので、資源の乗っ取りとして批判されている。", "summary_en": "The Trump administration announced a deal giving the US majority control over 65 billion barrels of Venezuelan oil reserves across 17 strategic oil fields. The arrangement, criticized as a resource takeover, follows Trump's authorization of an operation that led to former President Maduro's arrest and the installation of interim President Rodriguez.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/29/whats-behind-the-us-deal-to-seize-control-of-venezuelan-oil-reserves?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "What’s behind the US deal to seize control of Venezuelan oil reserves?\nFew details have emerged about the arrangement between Washington and Caracas, criticised as a takeover of Venezuela’s resources.\nThe United States has announced that it has secured control of a substantial portion of Venezuela’s vast oil reserves, after President Donald Trump pledged to “take back” the South American country’s energy resources.\nOn Friday, Trump announced that his government and that of Venezuela’s interim President Delcy Rodriguez had reached a deal to give the US majority control over more than 65 billion barrels’ worth of proven oil reserves.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Trump announces ‘biggest oil deal in world history’ with Venezuela\n- list 2 of 3US nears deal to secure stake in Venezuelan oil fields, insiders say\n- list 3 of 3Venezuela and Israel restore consular ties as relations warm\nDetails remain unclear. But the deal will involve 17 strategic oil fields in Venezuela. The US government has said it will partner with a private business to extract the fuel.\n“The United States of America has just entered into an Agreement with the Country of Venezuela on, THE BIGGEST OIL DEAL IN WORLD HISTORY!” Trump wrote in a social media post celebrating the announcement.\nWhat has been said so far, and what could the new deal mean for US-Venezuela relations? We answer those questions and more in this explainer.\nHow much oil is involved?\nThe deal reportedly involves 65 billion barrels of Venezuelan oil reserves.\nThat amounts to roughly a fifth of Venezuela’s proven oil reserves. As of 2023, the US government estimates that Venezuela has 303 billion barrels of oil reserves, the largest known deposit in the world.\nApproximately 17 percent of the world’s oil supply is estimated to be in the South American country.\nBut some analysts have questioned the 65-billion-barrel total Trump announced. With no fixed terms released, there has been speculation that Trump may have made a splashy announcement to help jumpstart the US economy.\n“The 65 billion barrel number is a red herring and will have little relevance to any actual deals — the real relevant details of which are still almost entirely unknown,” oil market researcher Rory Johnston said in a social media post.\n“It’s just a classic big number that Trump was sure to jump all over and will repeat ad nauseam going forward.”\nHow will this affect US oil supplies?\nTrump has said that the deal “MORE THAN DOUBLES American Oil Reserves”.\nGovernment estimates indicate that proven US oil reserves are declining, standing at approximately 46 billion barrels by the end of 2024.\nThe US government also operates a Strategic Petroleum Reserve, an emergency supply of oil to help ensure steady domestic supplies.\nBut the emergency stockpile is shrinking, with only 289.7 million barrels in storage facilities designed to hold up to 714 million barrels. Trump has indicated that Friday’s deal will help restore the US oil reserves, which have hit their lowest levels since 1982.\nWhat led to this moment?\nThe year 2026 has seen dramatic changes for Venezuela and its relationship with the US.\nSince 2013, the South American country had been led by socialist President Nicolas Maduro, whose tenure had been defined by a series of disputed elections and crackdowns on political dissent.\nTrump and Maduro had repeatedly clashed, with Trump accusing the Venezuelan leader of sending drug-traffickers into the US, and Maduro accusing Trump of foreign interference in domestic politics.\nTheir conflict came to a head on January 3. For weeks, US military vessels had been amassing off the shore of Venezuela, and during the early morning hours, Trump authorised an operation to abduct and imprison the Venezuelan leader.\nMaduro now awaits trial on drug- and weapons-related charges in New York.\nIn the aftermath of the attack, Trump backed Maduro’s former vice president, Rodriguez, to lead the government in Caracas. She was sworn in shortly afterwards.\nThe Trump administration also announced that Washington would take control of Venezuela’s oil exports “indefinitely”.\nCritics have pointed out that the Trump administration has pressured Rodriguez to comply with its demands. “If she doesn’t do what’s right, she is going to pay a very big price, probably bigger than Maduro,” Trump told The Atlantic magazine in January.\nWhat are Trump’s claims to Venezuela’s oil?\nExperts have denounced US intervention in Venezuela as illegal under international law.\nBut the Trump administration has made the claim to Venezuelan oil resources a key pillar in its involvement in the South American country.\nIn the lead-up to the January 3 attack, Trump and his allies advanced an argument that Venezuela’s oil supplies belonged to the US, due to a history of early fuel exploration in the country.\nThey also denounced the Venezuelan government’s efforts to expropriate oil resources from private companies, as part of an effort to nationalise the", "translation_ja": "", "vocab": [{"word": "expropriate", "definition": "政府や権力者が私有財産を公的目的のために没収または接収すること。ベネズエラが石油企業から資源を国有化する場合に使用される。"}, {"word": "strategic", "definition": "長期的な目標達成のために慎重に計画された戦略的な。この場合、石油産出に重要な17の油田を指す。"}, {"word": "pillar", "definition": "重要な支えや基盤となるもの。トランプ政権のベネズエラ介入における石油資源支配が主要な柱であることを意味する。"}, {"word": "stockpile", "definition": "将来の使用のために大量に蓄積または保管すること。米国の戦略石油備蓄のような緊急用の備蓄を指す。"}, {"word": "tenure", "definition": "職位や地位を保持する期間。ニコラス・マドゥーロがベネズエラの大統領を務めた期間を指す。"}]}, {"title_ja": "ネパール政府の洪水対応に怒り増加、支援物資の遅延が批判", "title_en": "Nepal Faces Public Anger Over Slow Disaster Response to Flash Flood", "summary_ja": "ネパール北部のヌワコット地区の住民は、水曜日にネパール・チベット国境付近で起きた壊滅的な洪水の後、政府が人道支援の提供と行方不明者の捜索に遅延していることに対して不満を高めている。被災者たちは当局の対応不足と緩慢さを非難している。この事件は、被害地域における災害管理と政府責任の問題を浮き彫りにしている。", "summary_en": "Residents of Nuwakot district in Nepal are growing increasingly frustrated with government delays in delivering humanitarian aid and locating missing persons following a devastating flash flood near the Nepal-Tibet border on Wednesday. Survivors have accused authorities of inadequate and slow response efforts to the natural disaster. The incident highlights concerns about disaster management and government accountability in the affected region.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/29/anger-mounts-in-nepal-over-the-governments-response-to-flash-flood?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Anger mounts in Nepal over the government’s response to flash flood\nNewsFeed\nAnger mounts in Nepal over the government’s response to flash flood\nAnger is growing in the flood-hit Nuwakot district as survivors accuse the government of delays in delivering aid and finding missing loved ones after a flash flood devastated the area near the Nepal-Tibet border on Wednesday, Al Jazeera’s Barnaby Lo reports.\nPublished On 29 Aug 2026", "translation_ja": "", "vocab": [{"word": "devastated", "definition": "極度に破壊された、または心理的に大きなダメージを受けた状態。自然災害や悲劇的な出来事によって甚大な被害をもたらすことを表す。"}, {"word": "survivors", "definition": "困難な状況や危機的な出来事から生き残った人々。自然災害や事故などの後、存命している被害者を指す。"}, {"word": "accountability", "definition": "責任を持つこと、または行動や決定に対して説明と責任を負う義務。特に公的機関や政府が市民に対して持つべき責務。"}, {"word": "humanitarian", "definition": "人道的な支援や援助に関する形容詞。人命救助や人間の福祉を目的とした活動や物資を指す。"}, {"word": "mounting", "definition": "段階的に増加または上昇することを意味する。問題や感情などが次第に大きくなっていく過程を表す。"}]}, {"title_ja": "アイスランド、EU加盟交渉再開を問う接戦の国民投票を実施", "title_en": "Iceland Holds Tight Referendum on Resuming EU Membership Talks", "summary_ja": "アイスランドは土曜日、欧州連合（EU）加盟交渉の再開を決定するための国民投票を実施しました。同国がEU加盟交渉を中断してから13年ぶりの重要な投票となります。クリストゥルン・フロスタドッティル首相も投票に参加し、結果は接戦になると予想されています。", "summary_en": "Iceland held a referendum on Saturday to decide whether to resume negotiations for European Union membership, marking the first major vote on EU accession since the country paused talks 13 years ago. Prime Minister Kristrún Frostadóttir participated in the vote, which is expected to be closely contested. The outcome will determine whether Iceland moves forward with formal EU membership negotiations.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/29/iceland-votes-in-a-tight-race-on-whether-to-resume-talks-to-join-the-eu?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Iceland votes in a tight race on whether to resume talks to join the EU\nNewsFeed\nIceland votes in a tight race on whether to resume talks to join the EU\nIceland’s Prime Minister, Kristrún Frostadóttir, cast her vote on Saturday as the country held a referendum to decide whether to resume talks on joining the European Union (EU). The vote comes 13 years after Iceland paused its previous EU accession talks.\nPublished On 29 Aug 2026", "translation_ja": "", "vocab": [{"word": "referendum", "definition": "国民投票、住民投票のこと。重要な政策決定を国民の直接投票で行う民主的な手続きを指します。"}, {"word": "accession", "definition": "加盟、参加することを意味します。特に国家が国際機関や条約に加わる場合に使われる正式な用語です。"}, {"word": "paused", "definition": "一時停止した、中断したという意味です。交渉やプロジェクトが一度中止され、後に再開される可能性がある状態を表します。"}, {"word": "tight race", "definition": "僅差の競争、接戦を意味するイディオムです。投票結果が不確実で、どちらの立場が勝つか予測困難な状況を表します。"}, {"word": "negotiations", "definition": "交渉、協議を意味します。複数の当事者が合意に達するために行う正式な協議プロセスを指します。"}]}, {"title_ja": "ネタニャフ首相、ヨルダン川西岸のパレスチナ村への入植者攻撃を非難", "title_en": "Netanyahu Condemns Settler Attack on Palestinian Village in West Bank", "summary_ja": "2026年8月29日、イスラエル入植者がヨルダン川西岸北部のパレスチナ村クスラを攻撃し、住民に石を投げ、パレスチナ人が中にいる家に立てこもりました。ネタニャフ首相は暴力行為を犯罪と呼んで非難し、イスラエルの国際的地位を傷つけるとコメントしました。この事件は、入植者がパレスチナ住民への物資供給を遮断し、ジャーナリストを攻撃してきた数週間の緊張に続くものです。", "summary_en": "Israeli settlers attacked the Palestinian village of Qusra in the occupied West Bank on August 29, 2026, throwing stones and barricading themselves inside a Palestinian home. Prime Minister Netanyahu issued rare condemnation of the violence, calling it criminal acts that harm Israel's standing. The incident follows weeks of tensions as settlers have blocked supplies to Palestinian residents and attacked journalists.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/netanyahu-condemns-settler-attack-in-flashpoint-west-bank-village/article71405975.ece", "state_media": false, "category": "政治", "full_text": "Dozens of Israeli settlers attacked the Palestinian village of Qusra in the northern occupied West Bank on Saturday (August 29, 2026) after nearly three weeks of tension in the area, drawing rare condemnation from Prime Minister Benjamin Netanyahu.\nEarlier in August, a group of settlers began blocking supplies from entering Palestinian houses on the outskirts of the village near Nablus, trapping residents inside and drawing unusually strong criticism from the U.S. Ambassador.\nWeeks later, Israeli forces continue to operate in the area while settlers still roam the surrounding hills.\nOn Saturday (August 29), Qusra residents and the military said dozens of settlers had descended on the village, throwing stones at residents and barricading themselves inside a house while Palestinians were inside.\nIn nearby Jalud, NBC News said masked settlers attacked and injured members of its reporting team and a Palestinian woman it had gone to interview.\n\"I strongly condemn the criminal acts of violence committed in the villages of Qusra and Jalud by a handful of rioters who are violating the law, causing a grave injustice to the law-abiding Jewish community, interfering with the IDF in carrying out its missions, and harming Israel's standing in the world,\" Mr. Netanyahu said in a statement.\nPresident Isaac Herzog also condemned the attack in Qusra, while Israel's Foreign Ministry called the violence \"a disgrace\".\nIn Qusra, resident Yussef Abdul Kareem Hassan told AFP that a handful of villagers were doing work on a house on Saturday when they were approached by a small group of settlers.\nThe settlers then called for backup and returned with dozens more, Hassan said, adding that they surrounded the Palestinians inside the house and began throwing stones.\nAFP footage of Qusra on Saturday showed dozens of Israeli forces deployed to the site.\nSoaring violence\nThe Israeli military said soldiers and border police forces were dispatched \"following reports that Israeli rioters had arrived in the area and that violent clashes had occurred, including stone-hurling toward Palestinians and additional civilians\".\n\"Upon their arrival, the security forces identified dozens of rioters who had barricaded themselves inside a Palestinian home while Palestinian residents were inside,\" the military said in a statement, adding that it was \"aware of reports of Palestinian injuries\".\nIt said forces had worked to remove the settlers from the house, separate the groups and confiscate vehicles \"that were suspected of having been used to reach the area\".\nThe vehicles would be used as evidence in a police investigation that has been opened, it said, adding that forces continued to operate in the area \"to prevent further disturbances and restore order\".\nViolence by Israeli settlers towards Palestinians in the West Bank has persisted for years, often with little or no legal consequence, but recent months have seen a surge in attacks.\nMore than 500,000 Israelis live in settlements in the Palestinian territory, which are illegal under international law, among some three million Palestinians.\nIsrael has occupied the West Bank since 1967.\nAccording to an AFP tally based on data from the Palestinian health ministry, Israeli forces or settlers have killed at least 1,103 Palestinians in the West Bank, including both militants and civilians, since the start of the Gaza war in October 2023.\nIsraeli figures show that at least 48 Israelis, including civilians and security personnel, have been killed in Palestinian attacks or during Israeli military operations during the same period.\nPublished - August 30, 2026 02:40 am IST", "translation_ja": "", "vocab": [{"word": "condemnation", "definition": "強い非難や批判を表明すること。政治的または道徳的に問題のある行為に対して公式に反対を示します。"}, {"word": "flashpoint", "definition": "紛争や暴力が突然起こりやすい地域または状況のこと。緊張が高まっている場所を指します。"}, {"word": "barricade", "definition": "防御または遮蔽するために、障害物を使って出入口を塞ぐこと。ここでは入植者が家に立てこもった状態を表します。"}, {"word": "escalation", "definition": "紛争や暴力の程度が段階的に増加・悪化すること。激化を意味します。"}, {"word": "retaliation", "definition": "害を受けたことに対して反撃や報復を行うこと。相手方の攻撃に応じて行われる行為です。"}, {"word": "confiscate", "definition": "政府または当局が没収すること。証拠として車両などを押収するために使用されます。"}]}, {"title_ja": "ネパール洪水被害の死者数が675人に、救助活動が続行中", "title_en": "Nepal Flash Floods Death Toll Reaches 675 as Rescue Operations Continue", "summary_ja": "ネパール・チベット国境近くの氷河崩壊により引き起こされた壊滅的な洪水により、少なくとも675人が死亡し、外国人163人を含むほぼ3,000人が避難した。降雨の警告にもかかわらず捜索救助活動は4日目も継続しており、ネパール政府は再建に40～50億ドルが必要と推定している。インドは懸念を表明し、被災地への救援物資を送付している。", "summary_en": "Devastating flash floods triggered by a glacier collapse near the Nepal-Tibet border have killed at least 675 people, with nearly 3,000 evacuated including 163 foreigners. Search and relief operations continue on the fourth day despite warnings of fresh rainfall, while Nepal's government estimates $4-5 billion needed for reconstruction. India has expressed concern and is sending relief material to the flood-affected country.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nepal-flash-floods-death-toll-missing-persons-fresh-flood-threat-glacier-collapse-live-updates-august-29-2026/article71403315.ece", "state_media": false, "category": "社会", "full_text": "Sonu Adhikari looks for remains at her house that was destroyed in the devastating flash floods at Galchhi area, in Dhading district of central Nepal.\n| Photo Credit:\nPTI\nDevastating flash floods in the Nepal-Tibet border region have killed at least 675 people, Nepali police said on Saturday (August 29, 2026). The Chinese state media earlier confirmed that seven were dead on the Tibetan side. Nearly 3,000 stranded people, including 163 foreigners, were evacuated by rescue teams in Nepal, as search and relief operations continued on the fourth day.\nNepal’s meteorology department has warned of fresh rainfall and thunderstorms in the flash flood-affected areas on Saturday, threatening to disrupt ongoing rescue and relief operations amid the worsening crisis, according to a media report. Meanwhile, Chinese authorities said the threat of a lake formed after a glacier collapse bursting near the Nepal-Tibet border has decreased. Satellite images from Thursday to Saturday morning suggest that water in the lake – straddling the border at the confluence of two rivers – has been slowly flowing through, decreasing the reservoir gradually, state broadcaster CCTV reported citing the Water Resources Ministry.\nAccording to the Nepal Army’s Public Relations Directorate, 2,465 people have been evacuated so far, including 163 foreigners — 113 Indians, 26 Chinese, 15 South Koreans, four Germans, two each from Italy and the U.S., and one Omani national. As many as 191 workers were evacuated from tunnels of various hydropower projects in Trishuli and Rasuwa, it said.\nNepal needs $4 billion to $5 billion for rebuilding after the devastating flood that struck its border areas this week, Finance Minister Swarnim Wagle said. “This is just an estimate. Loss and damage is being assessed,” he said. More than ₹2.295 billion has been collected for the Prime Minister’s Disaster Relief Fund (PMDRF) by Friday night (August 29, 2026
