s, security sources said.\nTuareg rebels have freed about 60 Malian soldiers in exchange for one of their own leaders, a former Malian army officer turned defector named Inkinane Ag Attaher, security sources have said.\nAg Attaher was a prominent figure in the Tuareg-led Azawad Liberation Front (FLA) when he was arrested by Nigerian security forces near the Niger-Nigeria border in 2025. He was accused of orchestrating drone training, coordinating deadly attacks in Mali and acting as an international liaison.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Mali says 82 soldiers captured by armed groups have been freed\n- list 2 of 3How armed group alliances are reshaping Mali’s conflict and the wider Sahel\n- list 3 of 3Why Mali’s northern conflict has entered a dangerous new phase\n“Around 60 soldiers were transported yesterday [Thursday] to Niger to be exchanged for Inkinane Ag Attaher and individuals allegedly linked to JNIM [Jama’at Nusrat al-Islam wal-Muslimin],” a group affiliated with al-Qaeda, a Malian security source told AFP news agency.\nThe agreement was directly overseen by Niger’s government, a second security source said.\nMohamed El Maouloud Ramadane, an FLA spokesman, welcomed Ag Attaher’s release in a post on Facebook, sending him “wishes of courage, strength and serenity for the continuation of the struggle”.\nThe development is the latest in a series of releases of prisoners taken hostage in northern Mali by al-Qaeda-linked fighters and Tuareg rebels, including Russian mercenaries. The Tuareg rebels said some of their own men held in Malian prisons were also freed.\nSources in Mali have told Al Jazeera that Algeria has been helping to mediate over the release of its soldiers.\nOn Monday, General Abdoulaye Maiga, Mali’s prime minister, visited Algiers in a bid to re-establish high-level talks with the Algerian government after tensions caused by disagreements over regional security.\nBamako has publicly ruled out talks with groups it calls terrorists, but the releases suggest channels of communication remain open while the fighting continues.\nJNIM and the FLA claimed responsibility for a series of attacks on April 25 targeting Bamako’s airport and several other locations. That day, Defence Minister Sadio Camara was killed in a bombing at his residence in Kati.\nThe two groups also claimed responsibility for attacks on army positions across Mali on July 4.\nElisee Jean Dao, chief of the general staff of Mali’s armed forces, issued a warning to those who continue to fight against the Malian army.\n“Wherever the enemy is, we will go after them and defeat them, until they lay down their weapons. For those who are Malians, our country has a peace process that allows them to come back. So I want to make that appeal again. It is not too late. The door is still open,” he said.\nAl Jazeera correspondent Nicolas Haque said fighting is continuing beyond Mali’s borders and across the Sahel, but the prisoner releases and Algeria’s mediation could see more soldiers freed.\nMali has been fighting a civil war since 2012, when a Tuareg separatist rebellion in the north gave way to armed campaigns by groups linked to al-Qaeda and ISIL (ISIS).\nThe military has ruled the country since a 2021 coup, pledging to restore order and unite the country.\nJNIM has gained in strength since the Malian soldiers who seized power expelled French forces and some 15,000 United Nations peacekeepers, and turned to Russian paramilitaries for defence support.\nWhile the FLA presents itself as a secular nationalist movement seeking independence for Mali’s Azawad region and JNIM is an al-Qaeda-affiliated group, the two sides have set ideological differences aside to confront the Malian government.", "translation_ja": "", "vocab": [{"word": "defector", "definition": "自分が属していた組織や国家から、敵対する側に転じた人物。政治的または軍事的な背景で使用される。"}, {"word": "liaison", "definition": "異なる組織や団体間の連絡・仲介役を務める人、またはそのような関係のこと。"}, {"word": "mediate", "definition": "対立する当事者間で仲裁者として働き、合意や解決に導くこと。"}, {"word": "mercenaries", "definition": "金銭報酬と引き換えに軍事行動に従事する傭兵。国籍や政治的立場とは無関係に戦う。"}, {"word": "rhetoric", "definition": "言語表現や演説の技法。ここでは公式声明と実際の行動のギャップを指す。"}, {"word": "separatist", "definition": "独立や分離を求める政治運動に従事する人、またはそのような運動そのもの。"}, {"word": "ideological", "definition": "政治や思想体系に基づいた。政治的信条や価値観に関連する形容詞。"}]}, {"title_ja": "ネパール洪水：4,400人以上が救出、死者586人に達する", "title_en": "Nepal Flash Floods: Over 4,400 Rescued as Death Toll Reaches 586", "summary_ja": "2026年8月26日の氷河崩壊によって引き起こされた津波のような水と破片の壁により、ネパールは大規模な洪水救援作戦を展開している。2,400人以上が行方不明で586人の遺体が回収されたなか、ネパールと中国の救助隊はヒマラヤ山脈国境地域での捜索を続けている。この災害は2015年の地震以来、ネパールにおける最も致命的な出来事である。", "summary_en": "Nepal mobilizes massive flood relief operations following a devastating glacial collapse that triggered a tsunami-like wall of water and debris on August 26, 2026. With over 2,400 people missing and 586 bodies recovered, rescue teams from Nepal and China continue searching across the Himalayan border region. The disaster, caused by a glacial collapse according to the US Geological Survey, is Nepal's deadliest since the 2015 earthquake.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nepal-flash-floods-death-toll-missing-persons-fresh-flood-threat-glacier-collapse-live-updates-august-29-2026/article71403315.ece", "state_media": false, "category": "社会", "full_text": "Nepal flash floods LIVE updates: Over 4,400 rescued as Nepal mobilises massive flood relief op., says PM Balen Shah\nRescuers were battling through mud even as the threat of new floods loomed, with emergency teams recovering 586 bodies so far -- and some of the dead swept downstream\nA satellite image shows the remaining buildings and roads after flash floods and a mudslide, in Timure, Nepal, on August 28, 2026. Photo: Vantor/Handout via Reuters\nRescuers in Nepal and China were still battling Saturday (August 29, 2026) to locate thousands of people missing days after a deadly, tsunami-like wall of water and debris swept through the Himalayan region, engulfing villages.\nThe number of missing soared past 2,400 on Friday (August 28, 2026) as emergency teams said they had recovered 586 bodies -- with some of the dead swept downstream as far away as India. The new figures came as Nepal’s disaster authority added 933 hydropower workers to a missing persons list already including trekkers and pilgrims to Tibet’s sacred Mount Kailash.\nThe US Geological Survey said the disaster -- the deadliest for Nepal since a 2015 earthquake -- was caused by a glacial collapse that triggered a vast flow of icy debris.\n(With inputs from agencies)\nFollow live updates here:\nAugust 29, 2026 08:13\nWatch | Nepal flash floods live coverage\nNepal and China have resumed rescue operations after a brief halt caused by fears of a fresh flood from a newly formed lake following the August 26 glacier collapse. Rescue teams are searching devastated communities and infrastructure on both sides of the border, while authorities continue monitoring unstable glacial lakes for further flooding.\nAugust 29, 2026 08:09\nNepal needs help in technical areas, not search and rescue, Foreign Minister says\nNepal needs foreign help in specialised and technical areas in which it does not have expertise in the aftermath of the devastating flood that hit its Himalayan border with China this week, but not in search and rescue, its foreign minister told Reuters.\nShisir Khanal said Kathmandu needs foreign help in areas such as rescuing people stuck in tunnels, opening transport and communication services in places where bridges have been destroyed, identification of dead bodies, DNA testing and storing bodies for longer durations.\nNumber of missing in Nepal, China floods soars past 2,400\nRescuers in Nepal and China were still battling Saturday (August 29, 2026) to locate thousands of people missing days after a deadly, tsunami-like wall of water and debris swept through the Himalayan region, engulfing villages.\nThe number of missing soared past 2,400 on Friday as emergency teams said they had recovered 586 bodies -- with some of the dead swept downstream as far away as India.\nIn an area home to vast energy infrastructure projects, Nepal’s disaster authority added 933 hydropower workers to a missing persons list already including trekkers and pilgrims to Tibet’s sacred Mount Kailash.\nThose that made it out say they have lost everything and now face an agonising wait to discover the fate of missing loved ones, and the prospect of rebuilding their lives from nothing.\n- AFP\nAugust 29, 2026 07:11\nThird flight with assistance from India reaches Kathmandu: Jaishankar\nLate on Friday (August 28, 2026) night, the third flight with assistance from India reached Kathmandu.\nAugust 29, 2026 06:59\nNo update on group of 77 pilgrims of Isha Foundation missing in Tibet\nThere has been no update on the whereabouts of a group of 77 pilgrims from the Isha Foundation that went missing after a massive flash flood struck areas near the China-Nepal border two days ago, the group’s coordinator said.\nThe 77-member group, led by Isha Foundation, an organisation founded by Indian spiritual leader Jaggi Vasudev, Sadhguru, has remained out of contact.\nMaa Gambhiri, a coordinator at the group, told PTI that Sadhguru wanted to visit Gyirong, the ground zero of the disaster, to help but did not get the necessary approval.\nShe said they had participants from 19 nationalities and they reached out to every embassy in India, China and Nepal to get all the support they could. She said they also reached out to various offices and ministries in India and Nepal to get any information and help.\n- PTI\nAugust 29, 2026 06:58\nRelief as stranded Maharashtra citizens return from flood-hit Nepal, express gratitude to CM Office, Centre\nA group of Maharashtra residents stranded in flood-ravaged regions of Nepal has safely returned to India and is currently en route to their home state.\nFollowing their successful evacuation, the citizens interacted with Chief Minister Devendra Fadnavis via video call to share their relief and convey their appreciation for the State government’s quick action.\nMeanwhile, an 11-member specialised medical and tunnel rescue team arrived in Nepal aboard the Indian Air Force’s third assistance flight, marking a critical transition in India’s disaster response from immediate supply delivery to com", "translation_ja": "", "vocab": [{"word": "glacial collapse", "definition": "氷河が急激に崩壊すること。通常、気候変動や地質的変動による大規模な氷塊の分離や落下を指す。"}, {"word": "debris", "definition": "破壊された建物や物質から生じた散乱した破片や瓦礫。災害後の残骸を表す。"}, {"word": "mobilise", "definition": "資源や人員を組織化して対応に当たらせること。緊急時に力を集中させる意味で使用される。"}, {"word": "engulfing", "definition": "完全に飲み込む、包み込むこと。洪水が村全体を覆うような大規模な災害の状況を表す。"}, {"word": "hydropower workers", "definition": "水力発電施設で勤務する労働者。ダムやエネルギー関連の大規模プロジェクトに従事する人々を指す。"}, {"word": "stranded", "definition": "予期しない状況により、ある場所に取り残された状態。交通手段がなく移動できない状況を表す。"}]}, {"title_ja": "ネパール、氷河崩壊後の技術支援を要請―捜索救助は自力で対応", "title_en": "Nepal Seeks Technical Aid, Not Search and Rescue Help After Glacier Collapse", "summary_ja": "ネパールの外相は、約600人の死者を出した氷河崩壊後、捜索救助活動は自国で対応できるが、トンネル救助、橋梁復旧、遺体身元確認などの専門的な外国支援が必要だと述べた。インドと中国には、被災地のヒマラヤ地域の交通・通信を回復させるための bailey bridges の提供が要請されている。", "summary_en": "Nepal's Foreign Minister stated that while the country can handle its own search and rescue operations following a devastating glacier collapse that killed nearly 600 people, it needs specialized foreign assistance in areas like tunnel rescue, bridge reconstruction, and body identification. India and China have been requested to provide bailey bridges to restore transport and communication in the disaster-affected Himalayan region.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nepal-flash-flood-nepal-needs-help-in-technical-areas-not-search-and-rescue-foreign-minister-says/article71403371.ece", "state_media": false, "category": "政治", "full_text": "Nepal needs foreign help in specialised and technical areas in which it does not have expertise in the aftermath of the devastating flood that hit its Himalayan border with China this week, but not in search and rescue, its foreign minister told Reuters.\nA glacier collapse on Wednesday (August 26, 2026) unleashed a huge torrent of rock, ice, mud and debris through Himalayan mountain river systems, killing nearly 600 people in Nepal and China’s Tibet, with more than 2,000 still unaccounted for.\nNepal flash floods updates on August 29. 2026\nShisir Khanal said Kathmandu needs foreign help in areas such as rescuing people stuck in tunnels, opening transport and communication services in places where bridges have been destroyed, identification of dead bodies, DNA testing and storing bodies for longer durations.\n“We have already made requests for such specialised services and technical assistance in areas where we don’t have enough expertise and technical knowhow,” Mr. Khanal said late on Friday (August 28, 2026).\nGiant neighbours India and China, between whom the Himalayan country is wedged, have been requested for bailey bridges to reopen early transport and communication in a disaster-hit area where about two dozen bridges had been destroyed.\nEarlier on Friday (August 28, 2026), Nepal’s Foreign Ministry had said that Kathmandu could manage the rescue efforts on its own for now and declined foreign involvement.\nAsked about that stance of his government, Mr. Khanal said there was no need for assistance in general search and rescue which was being done by Nepali rescuers. “We think there is no need for repetition in this,” he said.\nPublished - August 29, 2026 08:08 am IST", "translation_ja": "", "vocab": [{"word": "glacier collapse", "definition": "氷河が急速に崩壊する現象。大量の氷、岩石、泥が一度に流れ出す自然災害で、洪水や土石流を引き起こします。"}, {"word": "unleashed", "definition": "抑制されていた力や物が一気に放出される、解き放たれるという意味。ここでは氷河の崩壊が大量の土砂や水を一気に流すことを表します。"}, {"word": "unaccounted for", "definition": "所在が不明な、消息不明の状態を示す表現。特に災害時に人の生死が確認できていない場合に使われます。"}, {"word": "specialised services", "definition": "特定の分野における高度な技術や知識を必要とするサービス。通常は一般的な対応では不十分な場合に専門家による支援が必要になります。"}, {"word": "bailey bridge", "definition": "軍事用に開発された組立式の仮設橋。災害時に迅速に設営でき、被災地の交通を一時的に回復させるために使用されます。"}, {"word": "stance", "definition": "ある問題や事柄に対する立場や姿勢。政府や個人の公式な見解や政策上の位置付けを指します。"}]}, {"title_ja": "ネパール-チベット国境で大規模洪水、160人以上が死亡", "title_en": "Catastrophic Flash Flood Devastates Nepal-Tibet Border Region, Over 160 Dead", "summary_ja": "2026年8月26日、岩石と氷の地滑りによって引き起こされた大規模な洪水がネパール北部を襲い、少なくとも160人が死亡し、数百人が行方不明になった。この災害はボテコシ川とトリシュリ川沿いの村々に影響を与え、初期報告では洪水に先立つ氷雪崩をトリガーした地震の可能性が示唆されている。専門家は、この地域の急速なインフラ開発と水力発電拡大により、災害対策とリスク軽減に関する深刻な懸念が高まっていると警告している。", "summary_en": "A massive flood triggered by a rock-and-ice landslide swept through northern Nepal on August 26, 2026, killing at least 160 people and leaving hundreds missing. The disaster affected villages along the Bhote Koshi and Trishuli rivers, with preliminary reports suggesting an earthquake may have triggered an ice avalanche preceding the flood. Experts warn that rapid infrastructure development and hydropower expansion in the region have raised serious concerns about disaster preparedness and risk mitigation.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nepal-flash-flood-massive-flood-sweeps-through-northern-nepal/article71394951.ece", "state_media": false, "category": "社会", "full_text": "Catastrophic flooding on the Nepal-Tibet border unleashed waves of water and debris that have killed at least 160 people and left hundreds more missing. The exact sequence of events is still unclear, but on Wednesday (August 26, 2026) morning, torrents of water and debris crashed downstream on both sides of the border.\nSurveillance video from the Chinese side showed a wall of mud and water crashing over a building as terrified people ran away. In Nepal, a surge of water hit villages and towns on the path of two rivers - Bhote Koshi and Trishuli.\nThe disaster was intially described as a flood on the Nepalese side, and a mudslide by Chinese authorities. While preliminary satellite analysis points to a rock-and-ice landslide as the immediate cause, experts say a thorough assessment is needed to establish the sequence of events and whether a glacial process also contributed to the flood.\nNepal flash floods LIVE- August 27, 2026\nNepal’s National Disaster Risk Reduction and Management Authority, citing a preliminary analysis of Planet Labs satellite imagery, said in the evening that a rock-and-ice landslide along the Nepal-China border, about 20 km northeast of the Rasuwagadhi border crossing, caused a debris-laden flood in the Lhende River, a tributary of Bhotekoshi, that flowed through Timure and entered the Trishuli River. Earlier, Foreign Minister Shishir Khanal told Parliament that preliminary information suggested an earthquake around 8.37 a.m. triggered an ice avalanche, which was followed by the flood around 8.40 a.m. “The information needed further verification,” he said.\nThe recurrence of extreme floods has raised concerns among experts about disaster preparedness, infrastructure planning and risk mitigation. A construction spree along rivers in Nepal’s northern regions, driven in part by the country’s push to expand hydropower as an economic booster, has remained a concern for environmentalists and climate experts.\nPublished - August 27, 2026 10:36 am IST", "translation_ja": "", "vocab": [{"word": "catastrophic", "definition": "非常に大きな被害や損失をもたらす極度に悪い事態を指す。災害や危機的な状況を表現する際に用いられる高度な形容詞。"}, {"word": "debris", "definition": "爆発や破壊の後に散り散りになった破片や残骸。洪水や災害の文脈では、流れてくる泥や岩石などの物質を意味する。"}, {"word": "landslide", "definition": "山腹や斜面の土砂が大量に崩れ落ちる現象。地すべり、土砂崩れを指す地質学用語。"}, {"word": "tributary", "definition": "より大きな川に流れ込む小さな川。支流を意味する地理学的な用語。"}, {"word": "preparedness", "definition": "将来の事態や危機に対する準備が整った状態。特に防災や災害対応の準備体制を指す。"}, {"word": "mitigation", "definition": "悪影響や危険性を軽減または緩和する行動や措置。リスク管理の文脈でよく用いられる。"}]}, {"title_ja": "アイビーリーグの教授がカナダの新しい5億4100万ドルの研究プログラムに参加するため米国から移住", "title_en": "Ivy League Professors Relocate to Canada Amid New $541M Research Initiative", "summary_ja": "名門アイビーリーグから多くのアメリカ人学者がカナダに移住し、新たに立ち上げられた5億4100万ドルの研究プログラムに参加している。この移住の背景には米国の政治的環境への懸念があり、カナダが世界的な人材の確保に力を入れていることが反映されている。このイニシアチブはカナダが世界トップクラスの研究者を引き付け、維持するための戦略的投資を示している。", "summary_en": "American academics from prestigious Ivy League institutions are relocating to Canada to participate in a newly launched $541-million research program. The migration reflects concerns about the current political climate in the United States and Canada's efforts to attract top-tier talent. This initiative represents Canada's strategic investment in retaining and recruiting world-class researchers.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi3AFBVV95cUxOSjk3cXNDOUh4d1lVamJXWGVEZ3N4dElHTjVFREVGc25jR1l5TC01eTljbHg3SWdiaGRwMHl6QllGSmRDb2xIbmlXVzZQY2hWMzRtTS1UVVhCMUgtTXZyaUI0X0kwSG12dDBQcGZNdy01cm9ZLUo0V1lraHZhazcyMXlpUmthZm1sUkQzT3NMaEVhSVlWSkRTSncyXzltbDMteFZWZEtqTWlURmlQVm9ZeTdaZHh1bFB0Z2YzU21Bc3ZJdnJaVUJEdUZmOEhjOXY3aGNuSU5OMmJEWnVL?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプの「アメリカ湖」構想は見た目以上に深刻な脅威である", "title_en": "Trump's 'Lake America' Plan Is More Serious Than It Seems", "summary_ja": "アンドリュー・フィリップスは、カナダの水をそらして「アメリカ湖」を作るというドナルド・トランプの提案を単なる言辞として無視すべきではないと警告している。この計画はカナダの水資源と主権に対する真の脅威を表しており、一見すると馬鹿げているにもかかわらず、政策立案者から真摯な注目を集める必要があると論じている。", "summary_en": "Andrew Phillips warns that Donald Trump's proposal to create 'Lake America' by diverting Canadian water should not be dismissed as mere rhetoric. The plan represents a genuine threat to Canada's water resources and sovereignty. Phillips argues this initiative deserves serious attention from policymakers despite its seemingly outlandish nature.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi8gFBVV95cUxNMTFiQ1hoeC1aOHRDYXRpdy1Iek5uSG1fS1h0MW layer is expected to make significant strides in international competitions this year. O Globo highlights why tennis fans should keep a close eye on his development and performances.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE1MNWptTnpaTlFMQTc3WmpTYXdqMVluczNiTHhZQUotNnJoRWZydHZtdm1HdjJqOGVQXzFNT0t6cUZzODBVV3F0TmZDNTNCQVdrUmRQWDdtR1ZYLXMtMURzUnU5Y0RnS3U3eWc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ベテラン記者ドトゥン・オラディポ氏の葬儀日程が発表される", "title_en": "Family Announces Funeral Arrangements for Veteran Journalist Dotun Oladipo", "summary_ja": "『ザ・イーグル・オンライン』の出版社でベテラン記者のドトゥン・オラディポ氏の遺族が、9月10日から11日にラゴスで葬儀を行うと発表しました。56歳で亡くなったオラディポ氏は2017年から2021年まで企業オンライン出版社ギルド（GOCOP）の会長を務め、ナイジェリアのオンライン出版業界に大きな貢献をしました。GOCOPの指導部は、オンライン出版社をナイジェリアのメディアランドスケープの重要な一部として確立する上での彼の役割に敬意を表しました。", "summary_en": "The family of Dotun Oladipo, veteran journalist and publisher of The Eagle Online, has announced funeral rites for September 10-11 in Lagos. Oladipo, who died at age 56, served as president of the Guild of Corporate Online Publishers from 2017 to 2021 and made significant contributions to Nigeria's online publishing industry. GOCOP leadership paid tribute to his role in establishing online publishers as an important part of Nigeria's media landscape.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/906076-family-announces-funeral-arrangements-for-late-journalist-dotun-oladipo.html", "state_media": false, "category": "政治", "full_text": "The family of veteran journalist and publisher of The Eagle Online, Dotun Oladipo, has announced 10 and 11 September for his funeral rites.\nMr Oladipo died on Tuesday in Lagos at the age of 56.\nAccording to a statement issued by the Guild of Corporate Online Publishers (GOCOP) on Friday, a service of songs will be held at Daystar Church, Oregun, Ikeja, on Thursday, 10 September.\nHis burial service will take place at the same venue on Friday, 11 September, followed by his interment.\nMr Oladipo was president of GOCOP from 2017 to 2021 and was among the publishers who helped build the organisation during its formative years.\nGOCOP President Danlami Nmodu said the late publisher made significant contributions to the development of online publishing in Nigeria.\n“Dotun played an important role in the development of GOCOP. He led the Guild for four years at a time when there was still a lot of work to be done to establish online publishers as an important part of the media. His contribution will always be remembered,” Mr Nmodu said.\nHe said Mr Oladipo brought his experience in journalism and publishing to the leadership of the guild.\n“Dotun understood journalism and he understood the business of publishing. He was passionate about the place of online media in Nigeria and he gave his time to the growth of the Guild. We are saddened by his passing,” he said.\nALSO READ: Tinubu mourns journalist, Eagle Online publisher Dotun Oladipo\nMr Oladipo began his journalism career in the traditional media before moving into online publishing and establishing The Eagle Online.\nHe was also a member of the Nigerian Guild of Editors and the International Press Institute (IPI) Nigeria.\nHis death has attracted tributes from media organisations, colleagues and associates who have highlighted his contributions to journalism and the development of Nigeria’s online publishing industry.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "veteran", "definition": "長年の経験を持つ専門家。特定の分野で長く活動し、深い知識と経験を積んだ人物を指します。"}, {"word": "formative years", "definition": "発展の初期段階。組織や個人の基礎が築かれる重要な時期を意味する表現です。"}, {"word": "interment", "definition": "埋葬、埋蔵。遺体を地中に埋める行為または儀式を指す正式な用語です。"}, {"word": "tributes", "definition": "敬意の表現、追悼の言葉。故人の業績や人格を讃える言葉や行動を意味します。"}, {"word": "landscape", "definition": "全体的な状況、分野全体。比喩的に、ある業界や分野の全体像を表します。"}]}, {"title_ja": "アフリカは年間900億ドルの債務返済、さらに750億ドルのリスク・プレミアムを負担", "title_en": "Africa Spends $90bn Yearly on Debt Service, Pays Additional $75bn Risk Premium", "summary_ja": "アフリカ諸国は年間900億ドルの債務返済に充てており、借入リスクの高さから750億ドルの追加利息を支払っている。これにより各国政府は債務返済と保健・教育・気候変動対策への投資の間で難しい選択を迫られている。ケニアの外交担当次官は、このリスク・プレミアムを主要な外交問題と指摘し、債権者構成がパリクラブからロンドンやニューヨークなどの民間債券保有者にシフトしていることで、債務交渉が複雑化しアフリカの主権が低下していると述べた。", "summary_en": "African countries spend $90 billion annually servicing debt and pay an extra $75 billion in interest due to high risk premiums on borrowing, forcing difficult choices between debt repayment and investments in health, education, and climate resilience. Kenya's Principal Secretary for Foreign Affairs highlighted this 'Africa risk premium' as a major foreign policy issue, noting that the composition of creditors has shifted from Paris Club lenders to private bondholders, complicating debt negotiations and reducing African sovereignty.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/906070-africa-spends-90bn-yearly-servicing-debt-pays-75bn-risk-premium-kenya-govt.html", "state_media": false, "category": "経済", "full_text": "African countries spend about $90 billion every year servicing debt and pay another $75 billion in additional interest because of the high risk premium attached to borrowing, Kenya’s Principal Secretary for Foreign Affairs, Korir Sing’oei, has said.\nMr Sing’oei stated that the cost was forcing African governments to make difficult choices between servicing debt and spending on health, education and climate resilience, even as the continent requires about $1.3 trillion annually to achieve the Sustainable Development Goals.\nHe spoke on Friday in Nairobi, Kenya, at the closing ceremony of the sixth African Conference on Debt and Development (AfCoDD VI), organised by the African Forum and Network on Debt and Development (AFRODAD).\n“Africa pays $90 billion a year in debt service. That is more than aid and climate finance combined,” Mr Sing’oei said.\nHe noted that the continent’s debt burden was not simply the result of frequent defaults, arguing that African countries generally default less than is often assumed. Rather, he said, they pay more because of the risk premium attached to African borrowing.\nHe described the additional $75 billion paid in interest as a “trust tax”.\n“This Africa risk premium forces an unpleasant choice between servicing expensive debt and investing in the health, education and climate resilience of our people,” he said.\nThe pressure is also visible in Nigeria, where the government says it incurred N10.61 trillion in additional debt-service costs between June 2023 and December 2025.\nThe amount was N4.14 trillion more than the N6.47 trillion spent on strategic infrastructure during the same period, according to a scorecard released by the Ministry of Finance.\nThe bulk of the additional cost — N9.37 trillion — was linked to the depreciation of the naira and its effect on external debt servicing, while higher interest rates added another N1.24 trillion to domestic debt-service costs.\nTogether, the additional debt-service costs represented about 34.6 per cent of the government’s N30.64 trillion incremental expenditure during the period, compared with 21.1 per cent for strategic infrastructure.\nThe Nigerian figures offer a local illustration of the broader problem Mr Sing’oei was spotlighting: governments can secure financing, but changes in exchange rates and interest rates can substantially increase what they ultimately pay.\nNigeria’s Finance Minister and Coordinating Minister of the Economy, Taiwo Oyedele, has acknowledged that the economic reforms that contributed to those costs have imposed a significant burden.\nThe Nigerian government attributed the increase in external debt-service costs largely to the depreciation of the naira following foreign exchange reforms, while higher monetary policy rates increased the cost of domestic borrowing.\nMr Sing’oei said the cost of capital had become a major foreign policy issue for Africa and should no longer be left mainly to finance ministries and national treasuries.\n“In the 1960s, foreign policy on the continent was about political independence and political sovereignty,” he stated.\n“In the 1990s, when state capacity was hollowed out through structural adjustment programmes, it shifted to aid, when Africa was knocking on doors for more aid.\n“Today, I submit, the central theme of foreign policy for Africa is the cost of capital.”\nHe explained that Africa’s financing needs were too large for foreign policy institutions to remain on the sidelines of discussions about debt, bonds, equities, securities and other financial instruments.\nAccording to him, many foreign policy officials do not have enough expertise in complex financial matters, while officials in finance ministries may not always have a sufficient understanding of the geopolitics and history behind international lending.\nHe said the gap sometimes leaves African countries negotiating financing arrangements on terms that are less favourable to them.\nThe nature of Africa’s creditors has also changed considerably, making debt negotiations more complicated.\nMr Sing’oei stated that about 70 per cent of Africa’s debt was owed to Paris Club creditors in the 1990s.\nToday, he said, about 40 per cent is held by private bondholders in financial centres including London, Hong Kong and the Gulf states.\nHe noted that the change has made debt restructuring more difficult.\nHe cited Zambia, where the restructuring of the country’s debt took four years amid disagreements between China and the Paris Club.\nKenya’s own Eurobond negotiations, he said, involved traders in Paris, London, New York and elsewhere.\n“This is not just a loss of finance; it is also a loss of sovereignty,” Mr Sing’oei stated.\nHe noted that some loans came with explicit conditions, including collateral and mineral offtake arrangements, while other forms of leverage were less direct.\nA country that defaults, he said, can face a downgrade in its credit rating, reduced access to capital and increased pressure on its government.\nThe high cost", "translation_ja": "", "vocab": [{"word": "risk premium", "definition": "借り手の信用リスクが高いと見なされた場合に、貸し手が要求する追加の利息。リスクが高いほど、プレミアムが増加する。"}, {"word": "debt restructuring", "definition": "返済困難な債務の条件を変更・再交渉するプロセス。返済期間の延長や利率の引き下げなどが含まれる。"}, {"word": "credit rating", "definition": "政府や企業の信用度を格付け機関が評価した等級。低下すると資金調達コストが上昇する。"}, {"word": "Paris Club", "definition": "フランス・パリを本拠とする先進国債権国の非公式グループ。途上国への公式債務の再交渉を行う。"}, {"word": "collateral", "definition": "ローンのデフォルト時に貸し手が回収できる担保。鉱物採掘権などが含まれることもある。"}, {"word": "Eurobond", "definition": "発行国の通貨以外で国際市場で発行される債券。多くの場合、ドル建てでロンドンなどで取引される。"}]}, {"title_ja": "リーダーシップ機関がパレード場に：回想録がNIPSSのいじめ文化を暴露", "title_en": "Leadership Institute Becomes Parade Ground: Memoir Exposes NIPSS Bullying Culture", "summary_ja": "PR実践家ユシャウ・シュアイブの回想録は、ナイジェリアの国家政策戦略研究所（NIPSS）でのいじめと屈辱について詳述しており、高級軍事将校が優秀な民間人専門家に軍事的規律を強要したと主張しています。この記述は、批判的思考よりも同調性が優先されることと、私的メールへの不正アクセスについて重大な懸念を提起しており、当局は1年以上前に提出された請願書を無視していると報告されています。", "summary_en": "A memoir by PR practitioner Yushau Shuaib details institutional bullying and humiliation at Nigeria's National Institute for Policy and Strategic Studies (NIPSS), where a senior military officer allegedly subjected accomplished civilian professionals to military-style discipline. The account raises serious concerns about conformity being prioritized over critical thinking and alleged unauthorized access to private emails, with authorities reportedly ignoring petitions filed over a year ago.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/906066-from-policy-institute-to-parade-ground-by-nuhu-mohammed.html", "state_media": false, "category": "社会", "full_text": "The NIPSS experience, as recounted in this memoir, serves as a cautionary tale about what happens when leadership development becomes divorced from its foundational principles. An institute that cannot treat its participants — distinguished professionals in their own right — with respect and dignity cannot credibly claim to be developing leaders for the nation. When the pursuit of knowledge is subjugated to the exercise of petty authority, everyone loses.\nI recently received two books by award-winning PR practitioner and PRNigeria publisher Yushau A. Shuaib – MNI Versus MNIPR in NIPSS: Tackling Institutional Bullying and AI in Crisis Communication in Nigeria. Of the two, the NIPSS memoir immediately stood out.\nBy the nature of his private business and the exorbitant course fee, Shuaib begins by acknowledging that he reluctantly accepted his nomination by the Nigerian Institute of Public Relations (NIPR) to attend Senior Executive Course 47 at the National Institute for Policy and Strategic Studies (NIPSS). The programme demanded a substantial financial commitment, including a ₦18.5 million fee, which he says he was only able to raise through the support of several institutions and high‑level offices.\nThe early chapters offer an engaging account of learning and interaction at Nigeria’s foremost policy institute. But the narrative soon takes a troubling turn, becoming an account of what Shuaib describes as intimidation, humiliation and institutional bullying that ultimately led to his withdrawal from the programme.\nAt the centre of the most disturbing allegations is Rear Admiral AA Mustapha, a naval officer and directing staff member at the institute.\nAccording to Shuaib, the turning point came after PRNigeria published a report on NIPSS’ digital transformation. He maintains he neither wrote nor authorised the report and had formally disengaged from the management of his media organisation before joining the course.\nYet he recounts being summoned alongside his Study Group Chairman and allegedly ordered by Rear Admiral Mustapha to remain standing while being questioned over the publication. Shuaib, a civilian professional in his fifties, describes the encounter as his first experience of adult bullying.\nThis episode raises an uncomfortable question: should a senior military officer treat an accomplished civilian professional in an executive leadership programme as though he were a recruit undergoing military discipline?\nNIPSS is not a barracks. Its Senior Executive Course brings together military officers, public servants, academics and private sector professionals to exchange ideas and develop strategic leadership capacity. Discipline is essential, but discipline should never require the humiliation of participants.\nThe situation reportedly worsened when Shuaib received a formal query. He says his initial explanation — that he had no editorial responsibility for the PRNigeria report — was rejected for not being sufficiently apologetic. He was allegedly encouraged to rewrite his response in an acceptable “NIPSS style,” eventually adding an expression of regret after interventions by Professor Elias Wahab and fellow participant Dr. Samuel Osime, who was also a NIPSS staff member.\nThe memoir paints a picture of an institution where conformity is prized over critical thinking and where directing staff wield authority like weapons. Shuaib describes a disciplinary panel where he was allegedly not permitted to speak before receiving a “Final Warning” — despite never having received a prior warning. This is not leadership development; it is institutional bullying.\nA conversation with Dr Osime — who had himself been queried for commending Governor Caleb Mutfwang during a courtesy visit — made Shuaib question whether earning the mni designation required conformity “akin to joining a cult.”\nShuaib further alleges that another query followed an opinion article he wrote on Nigeria’s Blue Economy, even though NIPSS was not mentioned. Most troubling, he claims NIPSS officials accessed his private email without authorisation, including a restricted PRNigeria editorial correspondence used during the disciplinary process. If true, this is not merely an institutional breach but a potential criminal act under Nigerian data protection laws.\nThat this serious allegation has reportedly been ignored by the Nigeria Police Force and the Nigeria Data Protection Commission (NDPC) — whom he petitioned more than a year ago — speaks to a broader failure of institutional accountability extending well beyond the gates of the Kuru campus.\nAnother incident during the Abuja tour — where a directing staff allegedly prevented a Permanent Secretary from engaging informally with participants — reinforces the image of a system obsessed with control. In another episode, a directing staff member allegedly insulted an elderly participant who raised concerns about staff behaviour outside the campus.\nRear Admiral Mustapha’s alleged behaviour reveals a tr", "translation_ja": "", "vocab": [{"word": "divorced from", "definition": "～から切り離された、～と関係を断たれた。通常は、本来結びついているべきものが分離されている状態を表します。"}, {"word": "exorbitant", "definition": "法外に高い、不当に高い。通常の相場よりも大幅に高い価格や費用を指します。"}, {"word": "allegation", "definition": "根拠のない主張、告発。証拠なしに他者が何かをしたと述べることを意味します。"}, {"word": "institutional accountability", "definition": "機関の説明責任、組織が自らの行為について説明し責任を取る義務。"}, {"word": "conformity", "definition": "同調、一致。個人の独立した判断より集団や権威の規範に従うことを指します。"}, {"word": "humiliation", "definition": "屈辱、恥をかかされること。人格を傷つけられ、恥ずかしい思いをさせられる状態を意味します。"}, {"word": "wield", "definition": "権力や影響力を行使する、振るう。力や権限を使って支配する意味で用いられます。"}]}, {"title_ja": "ネパール洪水災害で行方不明者が倍増、被害の規模拡大", "title_en": "Nepal Doubles Missing Person Count as Flood Disaster Escalates", "summary_ja": "ネパール災害救援機関は、最近の洪水の影響を受けた水力発電プロジェクトで約900人が行方不明となり、行方不明者の総数を1,900人に修正しました。継続的な洪水リスクと困難な状況により、救助活動は大きな課題に直面しています。捜索および復旧活動の継続に伴い、災害の規模は拡大し続けています。", "summary_en": "Nepal's disaster relief agency has revised its missing persons count to 1,900, with approximately 900 people unaccounted for at hydropower projects affected by recent flooding. Rescue operations face significant challenges due to ongoing flood risks and difficult conditions. The scale of the disaster continues to grow as search and recovery efforts intensify.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/08/28/world/nepal-tibet-flash-floods", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフガニスタンの少女向け秘密学校", "title_en": "Inside Afghanistan's Secret Schools for Girls", "summary_ja": "タリバンによるアフガニスタン少女への教育禁止に対し、秘密の抵抗運動が広がっている。ニューヨーク・タイムズの記者らは、生徒と教師と保護者が危険を冒して学習を続ける隠れた教室を記録した。これらの秘密学校は、少女教育への制限に対する不屈の抵抗を象徴している。", "summary_en": "The Taliban's ban on education for Afghan girls has prompted a clandestine resistance movement. Times journalists documented hidden classrooms where students, teachers, and parents risk consequences to continue learning. These secret schools represent a defiant response to restrictions on girls' education.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/28/world/asia/afghanistan-girls-education.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランの経済危機深刻化で市民の希望喪失", "title_en": "Iranians Lose Hope as War Deepens Economic Crisis", "summary_ja": "紛争開始から6ヶ月が経過し、イラン国民は戦争による経済危機の悪化に直面している。トランプ大統領の意図に対する不信感の高まりとともに、政府の危機対応能力への信頼も急速に低下している。", "summary_en": "After six months of conflict, Iranians face mounting desperation amid an economic crisis exacerbated by the ongoing war. Growing skepticism about President Trump's intentions has further eroded public confidence in the government's ability to navigate the crisis.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/28/world/middleeast/iran-war-six-months-israel-us.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、ガザ北部への通行を許可 人質交渉の進展受け", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Military Restrictions", "summary_ja": "イスラエルは人質解放交渉の膠着状態が打開されたことを受け、ガザを二分する軍事地帯の通過を認めた。この回廊の再開は、イスラエル当局とパレスチナ勢力間の長期的な対立の後、重要な転機となった。数千人のガザ住民は現在、徒歩でガザ北部の自宅に戻ることができるようになった。", "summary_en": "Israel has allowed displaced Palestinians to cross through a military zone that divides Gaza, following a breakthrough in hostage release negotiations. The reopening of this corridor marks a significant shift after a prolonged deadlock between Israeli authorities and Palestinian groups. Thousands of Gazans are now able to return to their homes in the northern part of the enclave on foot.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発業者が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "China's Leading Property Developer Reports Huge Loss Amid Real Estate Crisis", "summary_ja": "中国大手不動産企業バンケが巨額損失を報告し、不動産セクターの危機がさらに深刻化していることを示唆している。同社の経営難は不動産市場の潜在的なシステミックリスクを示し、中国当局が業界の安定化に介入するかどうかについての疑問を生じさせている。", "summary_en": "Vanke, one of China's largest property developers, has reported substantial losses, raising concerns about the deepening real estate sector crisis. The company's financial troubles signal potential systemic risks in the property market and spark questions about whether Chinese authorities will intervene to stabilize the industry.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From Oct. 7 Attack", "summary_ja": "最近解放されたイスラエル人人質の体から10月7日の攻撃による破片がまだ埋め込まれた状態で発見された。イスラエルの医療当局者によると、女性の一部は長期間隔離状態で拘束され、8ヶ月間トンネルに閉じ込められていたという。この発見は、人質が拘束中に受けた深刻な身体的トラウマを浮き彫りにしている。", "summary_en": "Recently released Israeli hostages were found to still have shrapnel embedded in their bodies from the October 7 attack. Some of the women were held in isolation for extended periods and spent eight months confined in tunnels, according to Israeli medical officials. The discovery highlights the severe physical trauma experienced by the hostages during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIが宗教を変え、宗教がAIを変えようとしている", "title_en": "AI is changing religion and religions are trying to change AI", "summary_ja": "チャットボットと人工知能は宗教実践を再構成し、イマームや司祭からの精神的指導に取って代わるのか、それとも彼らの牧師職を強化するのかという問題を提起しています。宗教機関は同時に、AI開発に影響を与えて自らの価値観と教えに合致させることを試みています。テクノロジーと信仰の交差点は、より広い宗教的普及の機会と伝統的な牧師の役割への課題の両方をもたらしています。", "summary_en": "Chatbots and artificial intelligence are reshaping religious practice, raising questions about whether they will replace spiritual guidance from imams and priests or enhance their ministry. Religious institutions are simultaneously attempting to influence AI development to align with their values and teachings. The intersection of technology and faith presents both opportunities for broader religious outreach and challenges to traditional pastoral roles.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/27/ai-is-changing-religion-and-religions-are-trying-to-change-ai", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領の権力が揺らぐ中、その危険性はかつてないほど高まる", "title_en": "As Trump's Presidency Falters, He Becomes More Dangerous", "summary_ja": "ドナルド・トランプ大統領の任期が困難に直面する中、彼は権力と支配力を維持するためにより攻撃的な戦術を使用する傾向が強まっている。典型的なレームダック指導者ではなく、トランプは自らの地位を守るために激しく戦う老獪なゴリラに例えられている。エコノミスト誌は、政治的弱さと好戦的な姿勢のこの組み合わせが重大なリスクをもたらすと警告している。", "summary_en": "As Donald Trump's presidency faces mounting challenges, the president is increasingly willing to use aggressive tactics to maintain power and dominance. Rather than becoming a typical lame-duck leader, Trump is compared to an aging silverback gorilla willing to fight fiercely to defend his position. The Economist warns that this combination of political weakness and combative behavior poses significant risks.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/25/as-his-presidency-flounders-trump-is-more-dangerous-than-ever", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "迎撃ミサイル不足の危機", "title_en": "The Interceptor Missile Shortage Crisis", "summary_ja": "ウクライナおよび同盟国は、防空需要が供給を上回る中で迎撃ミサイルの深刻な不足に直面している。備蓄枯渇に対する懸念の高まりは、軍事態勢と現在の防衛戦略の持続可能性についての不安を引き起こしている。", "summary_en": "Ukraine and allied nations face a critical shortage of interceptor missiles as air defense demands exceed supply. The growing panic over depleted stockpiles raises concerns about military readiness and the sustainability of current defense strategies.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネパール洪水：行方不明者が2,500人近くに、2015年以来最悪の災害", "title_en": "Nepal floods: Nearly 2,500 reported missing in deadliest disaster since 2015", "summary_ja": "ネパールは深刻な洪水に見舞われ、約2,500人が行方不明となっており、2015年の壊滅的な地震以来、同国で最も被害の大きい自然災害となっています。この災害は多くの人命喪失と被災地域全体での広範な破壊をもたらしています。救出と支援活動が行方不明者の捜索と被災コミュニティへの支援のため進行中です。", "summary_en": "Nepal has been struck by severe flooding that has resulted in nearly 2,500 people missing, marking the country's deadliest natural disaster since the devastating 2015 earthquake. The disaster has caused significant loss of life and widespread destruction across affected regions. Rescue and relief operations are underway to locate missing persons and assist affected communities.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/28/nepal-floods-number-of-missing-jumps-to-over-2-000_6756944_4.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、ベネズエラ石油権益を確保する歴史的な取引を発表", "title_en": "Trump announces historic US oil deal securing major stake in Venezuelan reserves", "summary_ja": "米国大統領ドナルド・トランプは、米国がベネズエラの莫大な石油埋蔵量における重大な権益を獲得する「世界史上最大の石油取引」と称する協定を発表した。ベネズエラ大統領はトランプ発表直後にこの歴史的合意を確認し、米国とベネズエラのエネルギー関係に大きな転換をもたらした。", "summary_en": "US President Donald Trump announced what he described as the 'biggest oil deal in world history,' which would give the United States a significant stake in Venezuela's vast oil reserves. Venezuela's president confirmed the historic agreement shortly after Trump's announcement, marking a major shift in US-Venezuelan energy relations.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/29/trump-announces-deal-for-huge-us-stake-in-venezuelan-oil-reserves_6756954_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアの黒海封鎖がウクライナの穀物輸出を圧迫", "title_en": "Russia's Black Sea Blockade Strangles Ukraine's Grain Exports", "summary_ja": "ロシアがウクライナの黒海港湾への出入船舶への攻撃を強化し、1ヶ月以上にわたり海上輸送が停止している。この封鎖は主要な穀物輸出企業に脅威をもたらし、企業の物流に深刻な課題をもたらしている。世界有数の穀物生産国であるウクライナは、輸出収入の著しい減少に直面している。", "summary_en": "Russia has intensified attacks on ships in Ukraine's Black Sea ports, halting maritime traffic for over a month. The blockade threatens major grain exporters and creates severe logistical challenges for businesses. Ukraine, a key global grain producer, faces significant loss of export revenue.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/28/ukraine-s-black-sea-port-blockade-strangles-grain-exports_6756947_4.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の最新情報", "title_en": "Ministry of Defence Update", "summary_ja": "国防省(Mindef)が購読者向けの最新情報を発表しました。読者はストレーツ・タイムズのポータルを通じてニュースレターの購読を管理できます。追加の無料ニュースレターが利用可能です。", "summary_en": "The Ministry of Defence (Mindef) has released an update for subscribers. Readers can manage their newsletter subscriptions through The Straits Times portal. Additional free newsletters are available for sign-up.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートは、購読者向けの最新ニュースと情報を提供します。このニュースレターは、読者が最新のニュースと発展を把握できるように、厳選されたコンテンツを配信しています。", "summary_en": "The Straits Times Evening Update provides the latest news and information for subscribers. This newsletter offers curated content to keep readers informed on current events and developments.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズのモーニング・ブリーフィングは、読者に重要なニュース更新と分析を提供します。購読者は自分のニュースレター設定を管理したり、ザ・ストレーツ・タイムズからの追加の無料ニュースレターに登録することができます。", "summary_en": "The Straits Times Morning Briefing provides readers with essential news updates and analysis. Subscribers can manage their newsletter preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル将校：『ガザで戦争犯罪を犯す武装民兵を保護しなければならない』", "title_en": "Israeli Officer: 'I Must Protect Armed Militias Committing War Crimes in Gaza'", "summary_ja": "イスラエル軍の将校が、ガザで活動する武装民兵が戦争犯罪を犯しているにもかかわらず、彼らを保護することを余儀なくされていると述べた。この発言は、紛争における説明責任と非国家主体の行為をめぐる深刻な問題を提起している。", "summary_en": "An Israeli military officer has expressed grave concerns about armed militias operating in Gaza, claiming they are committing war crimes while he is required to provide protection. The statement raises serious questions about accountability and the conduct of non-state actors in the conflict.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimwJBVV95cUxNOVpLbXZ1Y0xNYzFGNFk5Z3BfbWwwckM3QzNneHllVWtldnpDV2lmaHNTamstMXB1VHJnY2pqUUJKbFRJLTVQaS1GVVNtbi1CWDBoclhsZVF1MjY2S0ZQMVN0b3c2OXpBa08zMExyblY2TWk5LTdkMk8yM2Vnd28xLXFmeTBOR3hpWUpaVUZ6aGtQd1EwVmdmbjNZdzJtSWJHc2pqNnlkWjRhQ01KNmhVZkFsR1RXRnpVQTh5R1JsWFdDQnh6U1NWQjZXSWxsWVFrSWJZSlEwUmJhc1EyM0Y3dThUUmtWWDloWHFTU3ZfclQ1N3JENnZlTUJqUkF6TDJQMW5mSnBxWTdlV195TUZSbzYtNVZjZnZYWEgw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マーク・ラファロ：権力批判は反ユダヤ主義ではないと主張", "title_en": "Mark Ruffalo Defends Criticism of Power as Not Antisemitic", "summary_ja": "オピニオン記事は、俳優マーク・ラファロが権力者への批判が自動的に反ユダヤ主義と烙印を押されるべきではないと主張することが正しいと論じている。この記事は、正当な政治批判と反ユダヤ主義的言辞の混同に異議を唱えている。", "summary_en": "An opinion piece argues that actor Mark Ruffalo is correct in asserting that criticizing those in power should not be automatically labeled as antisemitism. The article challenges the conflation of legitimate political criticism with antisemitic rhetoric.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiAJBVV95cUxPcGF2SnJIZTNPUFRnWVpDc1NhVTNNbDdNVVdsY29XY1BOdVAtREFYblQ1NUh4cFR6VWFoUVlMOWpaeFJBd2ZNakpxNnFZcFpSMVNhTVh3TWNwRHhWVVpRdUppT01JclJIblhDeW80ZkhRcDJmWTNrMU5UUTUtXzVybGNjTWxVaFdzcXV0NWIzclhtQThkSlpNckgza0xwTUhTWG5ycGcxSlNKNU5MXzdQLW12VFdGYU9zNFRCRjZNM08xejhwMURoNDR0TTB0ZDlRUTJuNmFCb0dNOU5LQ1FLcUpETUxaR1BEd1VIOWtyVTZoMXlZRm1icHBYc1kxby1tRU1MczllY3Q?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル裁判所、エルサレム旧市街での修道女暴行事件の被告人を無罪判決", "title_en": "Israeli Court Acquits Man Accused of Assaulting Nun in Jerusalem's Old City", "summary_ja": "イスラエルの裁判所は、エルサレム旧市街での修道女への暴行疑惑に関する訴訟で被告人に無罪判決を言い渡した。この判決により、当該事件の法的手続きが終結した。", "summary_en": "An Israeli court has acquitted a man of charges related to an alleged assault on a nun in Jerusalem's Old City. The court's decision marks the conclusion of the legal proceedings against the defendant in this case.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihAJBVV95cUxPSFRmX3BwNENqaTVIbmMtUUZ4Q0x1UXJNdEhXQzJKRnBNZzhndzRJcV9qSldqdS1jZFhDZUlrRVhGVGllbEdTTkVTODkzS3o4eWlfYldSOWw0T3ZfNTNYT2l5dldTZmxZWVpUT3pQZWxqd3pDX2Nla0tyc0ZYR19aRHpBbGkxRzJVSjRDZDdHZ0phc0VXRmcwR0hJY0hvRjQyeE9jVm5iT3N1ek42alhYYm5GTTlJcFg4ODAwdE5zakRlaHk1M2xDUXlhMm54alQ4aW0tVGRhdk5NYkhYM1JyUEk2cFFLOXZGUW04aGdQMFNQNXBxbmhlZFAzY3VCaTIyQVJLeQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、ネパール・チベット洪水を受けて捜索救助チームを派遣準備", "title_en": "Taiwan Prepares Search and Rescue Team for Nepal-Tibet Flood", "summary_ja": "台湾はネパールとチベットを襲った大洪水に対応するため、捜索救助チームを動員している。チームは被災地域での緊急対応活動を支援するために準備されている。台湾の人道的支援は、自然災害危機への地域協力を示している。", "summary_en": "Taiwan is mobilizing a search and rescue team in response to severe flooding that has affected Nepal and Tibet. The team is being prepared to assist with emergency response efforts in the disaster-stricken regions. Taiwan's humanitarian response demonstrates regional cooperation in addressing the natural disaster crisis.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1XQTh5eGVNWW9VaVF6ekdSaFRTQ2JHWHFlRTJsNUtHdWFMVlpnTUZsUUoycUNodDFaZDdfREsxV1RvTFI5R3RieDdkWmVkS1N5b1hpb0t3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の交通事故死傷者数、2023年比で15%減少 2026年上半期", "title_en": "Taiwan Traffic Fatalities Drop 15% in First Half of 2026", "summary_ja": "台湾は2026年上半期における交通事故死傷者数を2023年同期比で15%削減することに成功しました。この改善は、道路安全対策の強化と全国での取り締まり強化を反映しています。この成果は、台湾の交通死傷者削減への取り組みが進展していることを示しています。", "summary_en": "Taiwan has achieved a significant reduction in traffic fatalities, with deaths declining 15% in the first half of 2026 compared to 2023. This improvement reflects enhanced road safety measures and increased enforcement efforts across the country. The decline demonstrates progress in Taiwan's commitment to reducing traffic-related deaths.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1JdlNtb2xVZlMtQ3dqRHdsZ0JDYkgxdURTdmktSm5zZW5DWUptN1VkSGY0NWRPZVN2Tks5WlVEVndIalpPQlRGQWduVkRpb3N0aEVKamd3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "立法院、無人機調達法案の競合案について木曜日に投票予定", "title_en": "Legislature to Vote on Competing Drone Procurement Bills", "summary_ja": "台湾の立法院は木曜日に、無人機調達に関する競合する法案について投票を予定している。この投票は、どの無人航空機取得案が前に進むかを決定する。この決定は台湾の防衛能力と軍事近代化努力にとって重要である。", "summary_en": "Taiwan's legislature is scheduled to vote on Thursday on competing bills regarding drone procurement. The vote will determine which proposal for acquiring unmanned aerial vehicles will move forward. This decision is significant for Taiwan's defense capabilities and military modernization efforts.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9BdURNQlRPM3ktdWVqNUxNeFVnVDlwSE8tZHdXeXFBcDlmZGx5YmVBM3hUdUNFYnZMWm1sTGhzbklkV0poLXFHTjE1MHlLelhrczNvQmc5WQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コンゴ民主共和国東部に停戦検証チームが到着", "title_en": "Ceasefire verification team arrives in eastern DR Congo", "summary_ja": "CGTNは、停戦検証チームがコンゴ民主共和国南キブ州に到着し、政府軍とM23反政府勢力の間の違反疑惑を調査していると報じた。チームの派遣は平和プロセスの努力が続く中でも戦闘が継続している状況での展開となっている。CGTNは、調査が当該地域での停戦合意の遵守を監視することを目的としていると報じている。", "summary_en": "CGTN reports that a ceasefire verification team has arrived in South Kivu province in the Democratic Republic of the Congo to investigate alleged violations between government forces and M23 rebels. The team's deployment comes as fighting continues despite renewed peace process efforts. CGTN reports the investigation aims to monitor compliance with ceasefire agreements in the conflict-affected region.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-25/Ceasefire-verification-team-arrives-in-eastern-DR-Congo-1PTztchDeBW/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EAC諸国、教育改革と若年層スキル育成への取り組みを更新", "title_en": "EAC Countries Renew Commitment to Education Reforms and Youth Skills", "summary_ja": "CGTNが報じたところによると、東アフリカ共同体加盟国は教育システムの改革と職業訓練プログラムの拡大に力を入れている。ナイロビで開催された地域会議で、指導者らはスキルギャップに対処し経済成長を支援するため、技術、教員研修、能力ベースの学習への投資拡大を呼びかけた。", "summary_en": "CGTN reports that East African Community member states are intensifying efforts to reform education systems and expand vocational training programs. At a regional conference in Nairobi, leaders called for increased investment in technology, teacher training, and competency-based learning to address skills gaps and support economic growth.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-27/EAC-countries-renew-commitment-to-education-reforms-and-youth-skills-1PWZz2z5ZFm/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン革衛隊：米国がイランの条件を受け入れなければホルムズ海峡は閉鎖され続ける", "title_en": "IRGC: Hormuz Strait to remain closed without US acceptance of Iran's terms", "summary_ja": "CGTNが報じたところによると、イランのイスラム革命防衛隊（IRGC）は、米国がイランの条件を受け入れない場合、ホルムズ海峡は閉鎖され続けると述べている。この声明は、経済制裁、外交交渉、軍事的懸念など複数の領域にわたるテヘランとワシントン間の緊張の激化を反映している。この紛争は、両国間の広範な地政学的対立を浮き彫りにしている。", "summary_en": "CGTN reports that Iran's Islamic Revolutionary Guard Corps (IRGC) has stated the Strait of Hormuz will remain closed if the United States does not accept Iran's conditions. The announcement reflects escalating tensions between Tehran and Washington across multiple fronts, including economic sanctions, diplomatic negotiations, and military concerns. The dispute underscores the broader geopolitical standoff between the two nations.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-27/IRGC-Hormuz-Strait-to-stay-closed-if-US-does-not-accept-Iran-s-terms-1PWxjRhceyY/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国務省、ウクライナへの渡航警告を継続", "title_en": "State Department warns Americans against Ukraine travel due to ongoing hostilities", "summary_ja": "米国務省は、継続する武力紛争を理由にウクライナへの米国市民の渡航を控えるよう勧告していると報じられている。TASS/RTによると、米国務省はウクライナにおけるアメリカ人のリスク要因として「市民不安」を挙げている。この警告は当該地域の安全保障上の課題を強調している。", "summary_en": "The U.S. State Department reports that it continues to advise American citizens against traveling to Ukraine, citing ongoing hostilities as a primary concern. TASS/RT reports that the State Department has listed 'civil unrest' among the risk factors for Americans in the country. The warning underscores the security challenges facing the region.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2179193", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ワシントンでトランプ政策に対する数千人規模のデモが実施", "title_en": "Thousands protest against Trump policies in Washington DC", "summary_ja": "TASSの報道によると、ワシントン中心部で数千人の抗議者がトランプ政策に対するデモ行進を行った。報道では、デモ参加者が『トランプよ選挙に手を出すな』や『この大統領は我々の価値に見合わない』などのメッセージが書かれたプラカードを掲げていたと伝えている。", "summary_en": "TASS reports that several thousand protesters gathered in downtown Washington to demonstrate against Trump's policies. According to the report, demonstrators carried signs with messages including 'Trump, hands off the elections!' and 'This president is unworthy of us,' calling for an end to the current course.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2179191", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロドリゲス大統領、米国ベネズエラ石油協定で17油田開発へ", "title_en": "US-Venezuela Oil Deal to Develop 17 Fields, Says Rodriguez", "summary_ja": "ベネズエラのデルシー・ロドリゲス大統領は、米国とベネズエラ間の石油協定により17油田の開発が進むと報告している。ロドリゲス大統領によれば、この協定は経済成長、地域のエネルギー安全保障、および国際市場のより大きなバランスに貢献するという。", "summary_en": "Venezuelan President Delcy Rodriguez reports that a US-Venezuela oil agreement will support development of 17 oil fields. According to Rodriguez, the deal contributes to economic growth, hemisphere energy security, and greater balance in international markets.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2179189", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英国がより公正なグローバル経済構築を支援する方法", "title_en": "How Britain Can Help Build a Fairer Global Economy", "summary_ja": "著者ダニー・スリスカンダラジャは、英国のアンディ・バーナム首相がG20とG7の議長職を利用して、防御的な外交政策ではなく債務救済、金融フローの規制、富裕層への課税などの具体的行動を通じてより公正なグローバル経済の構築をリードすべきだと主張している。彼は経済協力に基づく新しい国際主義を受け入れ、世界的コンセンサスを必要としない新興の「有志連合」を支援することを提唱している。", "summary_en": "Author Danny Sriskandarajah argues that UK Prime Minister Andy Burnham should use Britain's G20 and G7 presidencies to lead on creating a fairer global economy through concrete action on debt relief, financial flows, and wealth taxation, rather than adopting a defensive foreign policy. He advocates for embracing new internationalism grounded in economic cooperation and supporting emerging \"coalitions of the willing\" that test innovative approaches to global challenges without requiring universal consensus.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/andy-burnham-g7-g20-presidencies-opportunity-to-reshape-global-economy-by-danny-sriskandarajah-2026-08", "state_media": false, "category": "オピニオン", "full_text": "How Britain Can Help Build a Fairer Global Economy\nDanny Sriskandarajah\nWith the United Kingdom poised to preside over both the G20 and the G7, Prime Minister Andy Burnham has a unique opportunity to usher in a new internationalism grounded not in military posturing, but in the pursuit of a fairer global economy. But he must abandon his predecessor’s defensive approach.\nLONDON—Andy Burnham faces no shortage of challenges as the United Kingdom’s latest prime minister. Fortunately, he also has a unique opportunity to lead the way in addressing major global economic issues and redesigning outdated institutions.\nBurnham took over after a tumultuous decade bookended by the UK’s decision to leave the European Union in 2016 and the premiership of Keir Starmer, who struggled to convince the public that international cooperation serves British interests. Burnham therefore inherits a foreign policy that feels both defensive and diminished, focused on holding fragile alliances together and cutting foreign-aid budgets dramatically in the name of “progressive realism”—a tagline that inspires no one.\nAlthough threat management may be unavoidable in today’s world, it does not offer people a positive vision. To do that, Burnham should set out to help shape norms and institutions that will outlast today’s chaos. The payoff would be a new internationalism grounded not in military postures, but in the pursuit of a fairer global economy that enables people everywhere to flourish. Such a framing would mirror Burnham’s promise of renewal at home and position Britain to lead on economic cooperation precisely when the old order is being undermined.\nThe timing is ideal because the UK will hold the G20 presidency in 2027 and the G7 presidency in 2028. Such opportunities are rare; those who seize on them benefit. Many still recall how Prime Minister Gordon Brown helped steady the world economy in 2009, and how his predecessor, Tony Blair, used the 2005 G8 to advance debt relief and aid for Africa.\nBurnham should be similarly bold. The safe option is to keep Britain’s head down, flatter a difficult US president, and avoid controversy. But defensiveness will not deliver meaningful results. Launching something new, even without a full consensus, is the better option. That is what South Africa did with the International Panel on Inequality during its G20 presidency, and it is what Brazil did by putting taxation of the super-rich in its Rio leaders’ declaration.\nBritain, for its part, could urge concrete action on the debt crises that are strangling dozens of countries, crack down on illicit financial flows, or introduce a minimum tax on billionaires. Leading by example on any of these issues would signal that it wants to shape the future rather than merely salvage remnants of the past. A prime minister who promised to “build a new economy” that delivers fairer outcomes for his constituents in Makerfield should embrace the same goal for people struggling to get by in Maputo or Mumbai.\nTo that end, Burnham also has an opportunity to break ground on building new institutions for global cooperation. The international legal, political, and economic institutions that Britain helped design in the 20th century increasingly seem ineffective, and some are facing ruthless attacks from allies or even some British politicians (in the case of the European Convention on Human Rights). The answer is not to defend the status quo but to help create a new one.\nA good place to start is with the “coalitions of the willing” that are already bringing together small groups of states (often odd bedfellows) to advance a shared agenda. For example, Barbados, France, and Kenya are co-chairing a Global Solidarity Levies Task Force to develop new international fees on aviation, premium flyers, shipping, fossil-fuel extraction, and financial transactions to generate revenues for climate and development finance. Similarly, Colombia and the Netherlands have led an effort to drive progress on the transition away from fossil fuels, and other groupings are working on debt relief, central-bank swap lines, and wealth taxes.\nBy joining, funding, or simply giving airtime to these initiatives at the G7 or the G20, the UK would send a strong signal that it is not relying only on existing international mechanisms to pursue global goals. It would also help convince countries across the Global South that their voices and leadership are valued.\nThough building global consensus seems impossible nowadays, these ongoing efforts should give us hope that progress is still possible. The building blocks of a new 21st century internationalism are already being assembled. In some cases, like the proposal to tax polluting activities through solidarity levies, new initiatives allow a small group of countries to test and study novel approaches without having to achieve a global consensus or overcome vetoes from powerful countries. In other cases, such as the International Panel on Inequality, t", "translation_ja": "", "vocab": [{"word": "tumultuous", "definition": "激動的で混乱に満ちた状態を意味する形容詞。政治的・社会的な不安定な時期を描写する際に使用される。"}, {"word": "defensive", "definition": "守勢的で後ろ向きな姿勢を示す形容詞。積極的な行動ではなく、現状維持や自己防衛に焦点を当てている状態。"}, {"word": "illicit", "definition": "違法で隠密な取引や活動を意味する形容詞。特に犯罪的な金銭移動や取引に関連して使用される。"}, {"word": "coalition", "definition": "共通の目標を持つ複数の国家や団体が一時的に結成する同盟を意味する名詞。通常は特定の目的達成のための結合。"}, {"word": "veto", "definition": "提案や決定を強制力を持って否定する権力を意味する名詞。国連常任理事国など、決定権を持つ国が使用できる拒否権。"}, {"word": "levy", "definition": "政府や機関が徴収する税金や料金を意味する名詞。特に環境保全や特定目的のために課される税金に使用される。"}, {"word": "bedfellows", "definition": "通常は異なる立場や利益を持つが、一時的に共通の目標のため協力する者たちを意味する名詞。奇妙な同盟相手の意味で用いられる。"}]}, {"title_ja": "テクノクラシーはヨーロッパを救えない", "title_en": "Technocracy Can't Fix Europe", "summary_ja": "ヨーロッパの一流ビジネスと技術リーダーによる新しい民間イニシアティブ「ライン・グループ」は、ヨーロッパのイノベーションと成長を促進することを目指しています。しかし、著者は、ヨーロッパが直面する根本的な問題は技術的というより政治的な性質のものであり、テクノクラート的な解決策だけでは解決できないと主張しています。", "summary_en": "The Rhine Group, a new private initiative led by elite European business and tech leaders, aims to boost European innovation and growth. However, the author argues that the fundamental problem Europe faces is political in nature, not merely technical, and therefore cannot be solved by technocratic solutions alone.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/rhine-group-eu-reform-mission-technocratic-fixes-wont-fix-political-problems-by-alberto-alemanno-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Technocracy Can’t Fix Europe\nA new private initiative bringing together the crème de la crème of European business, financial, economic, and tech elites could well prove useful in kick-starting European growth and innovation. But first, it must recognize that the problem it hopes to solve is fundamentally political.\nALPBACH—The Rhine Group, launched this week with the goal of restoring Europe’s capacity to innovate, grow, and compete globally, is an unusual initiative: a private club assembled to do what public institutions are supposed to do. Nonetheless, it has brought together many household names, with former European Central Bank President Mario Draghi and the tech entrepreneur Patrick Collison serving as co-chairs. Luis Garicano, an LSE economist and former liberal member of the European Parliament, is the executive director.", "translation_ja": "", "vocab": [{"word": "technocracy", "definition": "技術専門家や行政官僚による統治体制。政治的判断よりも技術的・専門的知識を優先させる政治形態を指します。"}, {"word": "crème de la crème", "definition": "フランス語の慣用句で「最高級の人材」「エリート中のエリート」を意味します。最も優れた人物たちを指します。"}, {"word": "kick-start", "definition": "何かを始動させる、軌道に乗せるという意味の句動詞です。停滞している事業やプロセスを活性化させることを表します。"}, {"word": "initiative", "definition": "新しい計画や事業を開始することを指します。主に改革や改善を目指した積極的な取り組みの総称です。"}, {"word": "fundamentally", "definition": "「根本的に」「本質的に」という意味の副詞です。表面的ではなく、より深い層での性質や原因を示します。"}]}, {"title_ja": "FRBと財務省は現実を直視していない", "title_en": "The Fed and the Treasury Are in Denial", "summary_ja": "著者は、米国の政策立案者がアメリカの金融的特権の減少についての現実否定に苦しんでいると主張し、米国債とドルが常に買い手を見つけるという時代遅れの前提に頼っていると述べています。歴史的な科学的否認主義と比較しながら、経済学者と政策立案者が完全に効率的な市場という正統的な信念にしがみついており、金融市場が理論とは異なって機能しているという証拠を無視していると主張しています。", "summary_en": "The author argues that US policymakers suffer from denial about America's diminishing financial privileges, relying on outdated assumptions that US debt and currency will always find willing buyers. Drawing a parallel to historical scientific denialism, the piece contends that economists and policymakers cling to an orthodox belief in perfectly efficient markets despite evidence that financial markets operate differently than theory suggests.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/fed-treasury-in-denial-about-their-entanglement-in-financial-markets-by-katharina-pistor-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Fed and the Treasury Are in Denial\nFor most of the postwar era, the United States has enjoyed a privileged position as an issuer of both sovereign debt and US dollars that always found takers. But the US may no longer be able to rely on stable demand for its debt or its currency, forcing policymakers to face the truth about how financial markets are made.\nNEW YORK—For centuries, the Catholic Church upheld the dogma that the world was flat and that the sun revolved around it, despite evidence to the contrary. It would take a technological, scientific, and cultural revolution to undermine this doctrine fully. Today, we are at a similar juncture when it comes to finance, where the orthodoxy of “flat” markets in pursuit of efficient outcomes maintains its grip on the minds of many economists and, more problematically, policymakers.", "translation_ja": "", "vocab": [{"word": "orthodoxy", "definition": "広く受け入れられている伝統的な信条や理論。ここでは経済学における支配的な理論的枠組みを指します。"}, {"word": "sovereign debt", "definition": "国家が発行する借金。政府債券やその他の政府が発行する債務証券を意味します。"}, {"word": "policymakers", "definition": "政策を決定し実行する立場にある人々。政府の高官や中央銀行の指導者などを指します。"}, {"word": "juncture", "definition": "重要な転機や分岐点。物事の方向性が大きく変わる可能性のある時点を意味します。"}, {"word": "efficient outcomes", "definition": "資源が最適に配分され、浪費がない結果。経済学では市場が効率的に機能して得られる理想的な状態を指します。"}]}, {"title_ja": "ドリー・パートンの遺産とトランプ大統領のいじめと失敗の対比", "title_en": "Dolly Parton's Legacy Contrasts with Trump's Pattern of Bullying and Failure", "summary_ja": "ロバート・ライシュは、ドリー・パートンとトランプ大統領の価値観と人格を比較し、イランでの外交政策の失敗とカナダとの貿易紛争は、強さではなく弱さから反撃するいじめっ子としてのトランプを露呈していると主張しています。ライシュは、裁判所の却下から国際的な報復まで、トランプが蓄積した屈辱が、無能さと腐敗を隠すための見せかけとしての不敗のイメージを明かしていると述べています。", "summary_en": "Robert Reich compares the values and character of Dolly Parton with those of President Trump, arguing that Trump's foreign policy failures in Iran and trade disputes with Canada reveal him as a bully lashing out from weakness rather than strength. Reich contends that Trump's mounting humiliations—from court rejections to international retaliation—expose his carefully constructed image of invincibility as a facade masking incompetence and corruption.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/28/dolly-parton-trump-canada", "state_media": false, "category": "オピニオン", "full_text": "I’m still grieving Dolly Parton. I never met her and always wanted to. She was almost exactly my age and my height and had values I deeply admired. Her death leaves a hole in the firmament.\nWhich brings me to the person whose values are as far from Dolly Parton’s as any human could possibly be and still claim to be human. I’m referring, of course, to the current occupant of the Oval Office.\n“I knew her a little bit,” Trump boasted about Parton on Glenn Beck’s radio show. “She really liked me, I will tell you!” at which Beck laughed out loud.\nTrump has become mad as a hatter. Loonier than looney tunes. Totally nuts. An enraged, engorged child who’s frightened to death of being seen as a loser.\nHe’s losing his war in Iran – the war he decided to start without consulting Congress, without even telling the American people his goal or exit strategy.\nNow he’s trapped there – with a stronger and more extreme group in control of Iran than before his attack, probably more intent on making a nuclear bomb, blocking the strait of Hormuz (it was open before Trump attacked), causing oil prices to rise again.\nHis current attempt to stop other countries from dealing with Iran is a bad joke. Iran is becoming the dominant power in the Gulf, having demonstrated its ability to damage the oil and gas infrastructure of its neighbors.\nBesides, China can supply almost everything Iran needs and has a strong incentive to do so.\nSo – now clearly revealed as a loser – what does Trump do? Like any bully, he lashes out.\nIf the courts won’t allow him to put his name on the Kennedy Center, he’ll demolish it. If they say he doesn’t have authority to build his ballroom, he’ll fight to build it anyway.\nIf his blue paint on the reflecting pool is peeling and the green algae are back and his US attorney won’t prosecute “vandals” for causing the problem, he’ll stick to his story and blame vandals anyway.\nIt’s all going so badly for Trump that his lizard brain is compelled to show he can bully someone. So who does Trump choose? Our old neighbor and friend Canada, who has always gone along with whatever the American colossus ever wanted.\nTrump imposed 50% tariffs on all cars, trucks, auto parts and steel coming from Canada.\nWhy? Because, he says: “Canada has been ripping off the United States of America for years. On Trade, and in other ways, also, they are among the worst Nations in the World to deal with. They feel entitled, and yet, WE DON’T NEED CANADA, THEY NEED US!”\nIn other words, we’re in a trade war with Canada because, well, Trump wants one. A trade war with Canada probably seemed easier to win than a hot war with Iran. And he had to save face somehow, right?\nEven though the supreme court found his attempt to use emergency powers for his last round of tariffs to be unconstitutional, he’s now using the Smoot-Hawley Tariff Act of 1930 – which, not incidentally, worsened the Great Depression.\nBut maybe a trade war with Canada won’t be all that easy to win. Canada has now retaliated with its own tariffs of up to 50% against about 700 American products.\nAs the Canadian prime minister, Mark Carney, noted on Saturday: “Last spring, I warned that America is trying to break us so they can own us, and I promised that will never, ever happen. We are keeping that promise.”\nCarney is now a hero in Canada with approval ratings in the 60s, while Trump’s have sunk to the low 30s.\nHumiliation upon humiliation for the man who can’t stand to be humiliated.\nIt gets worse by the day.\nNetanyahu has rejected Trump’s plan for Gaza. Congressional Republicans are blasting him for increasing imports of ground beef.\nUniversities are rejecting his latest directives. ABC has sued his regime for threatening its broadcast licenses.\nEven the bond market won’t be cowed. It’s in open revolt against his bonkers fiscal policies.\nThank goodness for him that Darline Graham won South Carolina’s special election Republican runoff to replace her brother. Trump had made her race all about himself – of course – telling supporters that her opponents were “only fighting Darline because they want me to lose”.\nI’m sure that’s what he’s telling himself about his many losses and humiliations – that they’re all due to his opponents plotting and scheming against him.\n(Hopefully, he’s about to lose Congress, too.)\nThat’s an easier story for Trump to accept than the truth: that his carefully cultivated aura of invincibility has just about disappeared.\nThe would-be emperor has no clothes. Almost everybody now sees the thin-skinned, peevish, petty, incompetent, corrupt, naked infant who’s been parading around in presidential garb.\nAnd they’re not going to obey him any more.\nDolly Parton was a huge winner, bless her soul. Trump is the biggest loser on the planet.\n- \n  Robert Reich, a former US secretary of labor, is a professor of public policy emeritus at the University of California, Berkeley. He is a Guardian US columnist and his newsletter is at robertreich.substack.com. His new book, Com", "translation_ja": "", "vocab": [{"word": "aura", "definition": "人物や事物の周囲にある雰囲気や印象のこと。通常は肯定的なイメージを伝える無形資産を指します。"}, {"word": "petty", "definition": "小さくてつまらない、または重要でない事柄に関わることを意味します。狭い心や些細な対立を表現するのに使われます。"}, {"word": "retaliate", "definition": "相手の攻撃や不正に対して同等の報復をすることを意味します。国家間の経済紛争では報復関税などの措置を指します。"}, {"word": "fiscal", "definition": "政府の予算、税金、支出などの財政に関わることを意味します。経済政策を論じる際に頻繁に使われます。"}, {"word": "humiliation", "definition": "恥ずかしめられたり、尊厳を傷つけられたりすることから生じる強い不快感や屈辱感を表します。"}, {"word": "lizard brain", "definition": "脳の最も古い部分に由来する、理性的思考ではなく本能的反応を支配する部分を比喩的に指しています。"}]}, {"title_ja": "トランプの中間選挙キャンペーンテーマは片思い", "title_en": "Trump's Midterm Campaign Theme is Unrequited Love", "summary_ja": "シドニー・ブルーメンタールは、トランプの2024年中間選挙キャンペーンが共和党候補者からの絶対的な忠誠心と愛情の要求に基づいていると主張しています。政策問題に対処する代わりに、トランプは選挙を個人への忠誠のテストとして位置付け、恐怖と従順さを愛情と同等視しながら、自らが招いた危機により政治的立場が悪化しています。ブルーメンタールは、以前の大統領不人気とは異なり、トランプの衰退はより早期に始まり、より持続的で、加速しており、失策や報復的行為を二倍にしながら誤りを認めていないと主張しています。", "summary_en": "Sidney Blumenthal argues that Trump's 2024 midterm campaign centers on demanding absolute devotion and loyalty from Republican candidates, treating political support as a measure of personal love for him. Rather than addressing policy issues, Trump frames the election as a test of loyalty, equating fear and subservience with affection while his political standing deteriorates due to self
