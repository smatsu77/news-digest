). The Ministry of Finance said the deposits were made to accounts held at 10 different commercial banks.\nMaharashtra government in touch with 338 of the 404 stranded in Nepal\nMaharashtra government is coordinating efforts to assist 338 of 404 stranded tourists in Nepal after recent floods.\nAugust 29, 2026 23:06\nGovernment of Nepal releases photographs and descriptions of the deceased\nThe Embassy of India, Kathmandu is working closely with Nepali authorities, including the Nepal Police to ensure that the mortal remains of Indian nationals can be handed over to the next of kin after identification. The Embassy will provide further updates on this matter in coordination with Nepali authorities.\nAugust 29, 2026 22:47\n287 Indians missing\nAt least 287 Indians remained missing while 88 others were rescued following the devastating flash floods along the Nepal-Tibet border four days ago, the Ministry of External Affairs (MEA) said.\nIt said 128 persons of Indian origin have also been uncontactable. The MEA also said that 120 Indian nationals stranded on the Chinese side have safely crossed over to Nepal.\nFour Indian nationals -- Ripu Kumar, Chaneshwar Narzary, Kripa Shankar and Mohammed Minhajuddin -- were rescued from a hydropower project in Rasuwa, it said, adding they are expected to reach Kathmandu soon.\nPTI\nAugust 29, 2026 22:16\nSeven Keralites remain uncontactable after Nepal floods, says NORKA Roots\nSeven people from Keralam, including four Australian citizens, remain unreachable following the flash floods in Nepal, while the safety of 45 others has been confirmed, NORKA Roots said.\nNORKA Roots is the Keralam government agency that coordinates overseas affairs and welfare services for non-resident Keralites. In a statement, NORKA Roots said that details of the seven people who remain uncontactable have been shared with the Ministry of External Affairs.\nNORKA Roots said 16 people from the State who had contacted its help desks have returned home, including Rineeth Mohan, a native of Piravom in Ernakulam, who had travelled to Nepal on August 23.\nPTI\nAugust 29, 2026 19:52\nIndia worried about flood crisis in Nepal: Rajnath\nDefence Minister Rajnath Singh said India too is worried about the crisis in Nepal and that relief material is being sent to the flood-ravaged country.\nThe death toll from flash floods in Nepal reached 669, while nearly 2,000 people are still missing.\nSpeaking to reporters in Lucknow, Mr. Singh said, “It is not only Nepal that is concerned about the crisis that has arisen there; India too is concerned. Our Prime Minister has said India is ready to provide whatever assistance is required. Relief material from here is being sent to the flood-ravaged country.” Bodies have been found from all eight affected districts in Nepal as search-and-rescue operations continue on a war footing.\nAn ice-rock avalanche following a glacial collapse near the Nepal-Tibet border sent a torrent of water, mud and debris downstream, wiping out towns and villages, damaging crucial infrastructure and washing away hydropower st", "translation_ja": "", "vocab": [{"word": "stranded", "definition": "孤立した、身動きが取れない状態にある。災害や事故により、ある場所に取り残された人々を指す。"}, {"word": "devastated", "definition": "壊滅的に破壊された、完全に打撃を受けた。大規模な災害により、地域や建物が大きな被害を受けた状態。"}, {"word": "confluence", "definition": "合流点、二つの川や道が合わさる場所。地理学的に重要な位置を示す専門用語。"}, {"word": "mortal remains", "definition": "遺体、亡くなった人の遺骨。遺族への返還や埋葬に関連する正式な表現。"}, {"word": "avalanche", "definition": "雪崩、大量の雪や氷が山から急速に流れ落ちる現象。今回は氷と岩石が混在した岩雪崩。"}, {"word": "torrent", "definition": "激流、大量の水が勢いよく流れる状態。比喩的に大量の何かが一気に押し寄せる現象。"}]}, {"title_ja": "ウクライナのザポリージャ原発が電力供給を喪失、非常用発電機に依存", "title_en": "Ukraine's Zaporizhzhia Nuclear Plant Loses Power Supply, Relies on Emergency Generators", "summary_ja": "ウクライナのザポリージャ原発が1週間以上にわたって外部電力を喪失し、現在は緊急用ディーゼル発電機に依存していると国際原子力機関（IAEA）が発表した。敷地内のディーゼル燃料供給は10日分のみで、6ヶ月間オフサイト貯蔵施設への納入がない状況が続いている。停電はドニプロ川付近の軍事活動に伴い発生し、IAEAは電気設備の修復を可能にするための局地的な停戦交渉を試みている。", "summary_en": "The Zaporizhzhia nuclear power plant in Ukraine has been without off-site power for over a week and is now dependent on emergency diesel generators, according to the IAEA. With only a ten-day diesel supply on site and no deliveries to off-site storage in six months, the plant faces critical fuel availability concerns. The power loss followed military activity near the Dnipro River, and the IAEA is attempting to negotiate a local ceasefire to facilitate repairs to electrical infrastructure.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/ukraines-nuclear-plant-has-lost-power-supply-iaea/article71405971.ece", "state_media": false, "category": "経済", "full_text": "The Zaporizhzhia nuclear power plant in Ukraine has been without off-site power for more than a week and is currently relying on emergency diesel generators, the UN's nuclear watchdog said on Saturday (August 29, 2026).\nThe plant, which needs power to keep its six non-operating reactors cool, has only a ten-day diesel supply on site, the International Atomic Energy Agency said in a statement.\nIt has not had a delivery to an off-site storage facility in about six months, but the plant had been supplied with diesel Thursday and Friday from another off-site location, the IAEA added.\n\"The availability of diesel fuel is of paramount importance whenever a nuclear power plant loses off-site power,\" said IAEA Director General Rafael Grossi.\n\"The current situation once again shows why reliable external power and secure supply routes are indispensable for nuclear safety and security.\"\nThe plant lost its regular power supply \"following military activity on the northern side of the Dnipro River\", the statement said.\nThe Vienna-based group said it was trying to negotiate a local ceasefire to allow repairs to electrical lines.\nOn Friday, the IAEA said there had been three incidents this week involving drones at the Zaporizhzhia plant, injuring two employees, and raising renewed safety concerns.\nThe plant, in southern Ukraine, was seized by the Russian army in March 2022, just weeks after its full-scale invasion.\nBoth sides in the conflict regularly accuse the other of attacking the site on the banks of the Dnipro river that marks the frontline in the sector.\nIAEA teams have had a permanent presence at the plant since September 2022. Zaporizhzhia's six reactors have been shut down since 2022.\nPublished - August 30, 2026 02:10 am IST", "translation_ja": "", "vocab": [{"word": "paramount", "definition": "最も重要な、最高位の。何よりも大切で、他のすべてより優先されるべきことを意味する。"}, {"word": "indispensable", "definition": "絶対に必要な、欠くことのできない。ないと困る、必須のという意味で使われる。"}, {"word": "off-site", "definition": "敷地外の、本施設の外にある。原発などの施設から離れた別の場所を指す。"}, {"word": "ceasefire", "definition": "停戦、銃火の中止。紛争地域で一時的に戦闘を停止する協定または状態のこと。"}, {"word": "drone", "definition": "無人航空機、ドローン。遠隔操作またはプログラムで自動的に飛行する無人機を意味する。"}, {"word": "frontline", "definition": "前線、最前線。戦争地域で敵と対面する最前方の戦闘地域を指す。"}]}, {"title_ja": "アイビーリーグの教授たちがカナダの5億4100万ドル研究プログラムへ移籍", "title_en": "Ivy League Professors Flee to Canada's $541M Research Program", "summary_ja": "米国の政治的不確実性の中、名門アイビーリーグ大学の一流研究者たちがカナダの新しい5億4100万ドルの研究イニシアティブに参加するため移住している。このプログラムは、カナダが世界的に活躍する研究者を惹きつけ、科学能力を強化しようとする取り組みを示している。この動きは、現在の米国の政治情勢における研究環境と資金調達の見通しについて学者たちが抱く広範な懸念を反映している。", "summary_en": "Amid political uncertainty in the United States, top academics from prestigious Ivy League universities are relocating to Canada to participate in a new $541-million research initiative. The program represents Canada's effort to attract world-class researchers and strengthen its scientific capabilities. The migration reflects broader concerns among scholars about the research environment and funding prospects in the current U.S. political climate.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi3AFBVV95cUxOSjk3cXNDOUh4d1lVamJXWGVEZ3N4dElHTjVFREVGc25jR1l5TC01eTljbHg3SWdiaGRwMHl6QllGSmRDb2xIbmlXVzZQY2hWMzRtTS1UVVhCMUgtTXZyaUI0X0kwSG12 cab": []}, {"title_ja": "2025年に注目すべきブラジルのテニス新星ジョアン・フォンセカ", "title_en": "João Fonseca: Brazil's Tennis Star to Watch in 2025", "summary_ja": "ジョアン・フォンセカは2025年に向けてブラジルで最も有望なテニス選手として注目されている。若き選手は今年、国際テニス大会で大きな影響を与える立場にある。", "summary_en": "João Fonseca emerges as Brazil's most promising tennis talent heading into 2025. The young player is positioned to make significant impact on the international tennis circuit this year.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE1MNWptTnpaTlFMQTc3WmpTYXdqMVluczNiTHhZQUotNnJoRWZydHZtdm1HdjJqOGVQXzFNT0t6cUZzODBVV3F0TmZDNTNCQVdrUmRQWDdtR1ZYLXMtMURzUnU5Y0RnS3U3eWc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コパカバーナ大晦日フェスティバル：ゴスペル、ファンク、MPB、サンバが共演", "title_en": "Copacabana New Year's Eve Celebrates Diverse Music: Gospel, Funk, MPB, and Samba", "summary_ja": "リオデジャネイロの象徴的なビーチ、コパカバーナで大晦日を迎える祝賀イベントが、多様な音楽ジャンルを特徴とした豪華なラインアップを展開します。ゴスペル音楽、ファンク、MPB（ブラジル・ポピュラー音楽）、サンバのパフォーマンスが披露され、あらゆる音楽愛好家を楽しませます。このイベントはブラジルの豊かな音楽遺産を反映しています。", "summary_en": "Rio de Janeiro's iconic Copacabana beach will host a New Year's Eve celebration featuring a diverse musical lineup spanning multiple genres. The festivities will showcase gospel music, funk, MPB (Música Popular Brasileira), and samba performances, offering something for every music lover. This multicultural celebration reflects Brazil's rich musical heritage.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi4wFBVV95cUxQdkJ5QUYtN1VFbXVPSWVvbDNnd0R0RC1rOFJ1ZnRIQXpqQm5ZeGtjaHdIQ2VQZTYtSEcwR2JTaFU2aXlZMlZxRE14SExNTEpzVXFpQV9sckpoZXFXaTZPNmhMSE1mN2Q5VlQyek5zTmJId3d6U3ZqWW9WekZqUkNqMzBBRWZ5NWRmNjJkQ3Fhd0hNUUpRMEc4TDJBcGR4ZHB4NFltcEg4NXU4OHZqQlJYc2lmaVFXalhBaUIydnBnR0RjeDJGeFRGN2t3VGoyOTgyV0hCSDdVbkc3bkRnWEdwRVFDVdIB8gFBVV95cUxPWXo1WGF3VGVqVFlPQUcyWUZNbVc3bExHQnoyZU5LXzBTeUhucDZFMU11R2laZzdCLUpaemlPOEw2MDhRSEd2dW41UWhnenV2NWZwdVFzb3JHb2l1Z2FnTVh6Yi1IRkNnUTZTcE5RbHlrTFVmRWxlejB4TEo0UmR6RjI3SE80alI0RDRxNEpGRlpXWUFCSHo3RllKQ0owVm1aQzMwcFlkMzBYbF9nRlhmT3NBZ2hUOXJUMDNxSWh6SXUwZ1ZUa1AxYllsbk5sVW9wZ09RYUlIeFZ6VGJQaE0zYkhpdUZucW4zX1VBaUhkWV9Bdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリア警察がバイク乗車者の射殺に関与した警察官を逮捕", "title_en": "Police Detain Officer Over Alleged Shooting Death of Motorist in Rivers State", "summary_ja": "ナイジェリアのリバーズ州警察は、言い争い中にバイク乗車者アンソニー・オボドを銃撃した警察曹長とそのチームを逮捕した。木曜日に発生したこの事件では、故人のほか通行人2人が負傷している。警察は射撃を「全く非難に値する」ものと述べ、遺族は正義を求めており、事件が過失放火と言い張られることを懸念している。", "summary_en": "Nigerian police in Rivers State have detained a corporal and his team following the fatal shooting of motorist Anthony Obodo during an altercation. The incident, which occurred on Thursday, also injured two passersby, and police described the shooting as 'totally condemnable' and unprofessional. The family of the deceased has demanded justice while expressing concerns that the incident could be mischaracterized as an accidental discharge.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/906244-police-detain-officer-over-alleged-shooting-that-killed-motorist.html", "state_media": false, "category": "社会", "full_text": "The police in Rivers State have detained an officer and members of his team following the alleged shooting of a motorist, Anthony Obodo, during an altercation in the state.\nIn a statement posted on its Facebook page on Friday, the police spokesperson in the state, Blessing Agabe, said the incident occurred on Thursday and resulted in the death of Mr Obodo and injuries to two passersby.\nPolice give details\nAccording to the police, preliminary information indicated that an altercation occurred between Mr Obodo and one of the police officers before a fracas ensued, during which a gun was fired.\nThe officer, identified as “Alfred Louis, a corporal, was subsequently attacked and assaulted by an angry mob, sustaining multiple injuries,” the police said.\nMs Agabe said the officers involved had been taken into custody at the State Criminal Investigation Department (SCID) and would face appropriate disciplinary action subject to the outcome of the investigation.\nHe described the alleged shooting as “totally condemnable,” saying the conduct did not reflect professionalism in policing.\n“The Rivers State Police Command is not a shield for anybody engaging in unethical conduct or putting the Nigeria Police Force in disrepute,” the statement said.\nFamily demands justice\nA video circulating on Facebook and referenced by the police shows mourners gathered at what appears to be the deceased’s family compound, where two police operatives were seen speaking with relatives.\nOne of the officers appeared to acknowledge that a police operative had pursued the deceased on foot before firing his weapon.\n“That is exactly what happened. The next thing, he cocked his gun and fired,” the officer said.\nA relative, however, challenged the account, alleging that the police operatives had been drinking before pursuing Mr Obodo.\nThe family also expressed concern that the incident could later be described as an accidental discharge.\nIn response, the police officer assured the family that “there must be justice,” while urging them not to allow grief to overwhelm them.\nOne of many cases\nThe latest incident comes amid several reports of alleged police brutality and unlawful use of firearms in Nigeria.\nIn 2023, PREMIUM TIMES reported the arrest of police operatives in the state after a viral video showed operatives assaulting a motorist. One of the officers was later demoted after an administrative trial.\nThe same year, a police officer in Delta State was detained after allegedly shooting a man who reportedly refused to pay N100 at a checkpoint. The officer was subsequently dismissed from service.\nMore recently, police in Delta arrested officers filmed publicly shooting a handcuffed man. The Force Disciplinary Committee later recommended their dismissal and prosecution after finding the principal officer had acted unlawfully and in violation of regulations governing the use of firearms.\nThe police in Rivers State said its investigation into the latest incident would determine what happened and the appropriate disciplinary measures against the officers involved.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "altercation", "definition": "激しい口論や争い。通常、二人以上の人々の間で起こる短期間の言い争いを指す。"}, {"word": "fracas", "definition": "混乱した騒動や乱闘。複数の人が関わる荒れ狂った争いや喧嘩を意味する。"}, {"word": "condemnable", "definition": "非難されるべき、または非難に値する。道徳的または倫理的に悪いと考えられる行為を描写する。"}, {"word": "disciplinary action", "definition": "不適切な行動に対する罰や懲罰措置。組織が従業員の規則違反に対して取る対応を指す。"}, {"word": "disrepute", "definition": "名誉の失墜や悪い評判。個人や組織の信用や評判が傷つけられた状態を意味する。"}, {"word": "operative", "definition": "活動中の工作員または職員。特に警察や政府機関で実際の業務に従事する人を指す。"}, {"word": "accidental discharge", "definition": "銃が意図せず発火する現象。不慮の過失による武器の発砲事件を意味する。"}]}, {"title_ja": "ティヌブ大統領、NDDC にワリ・サペレ・ベニン道路の再建を指示", "title_en": "Tinubu Orders NDDC to Reconstruct Warri-Sapele-Benin Road", "summary_ja": "ボラ・ティヌブ大統領はニジェール・デルタ開発委員会（NDDC）に対し、デルタ州の東西道路のワリ・サペレ・ベニン区間の再建を指示しました。このプロジェクトは、コミュニティを孤立させ、商品と人員の輸送を妨害している悪い道路状況に関する苦情に続くものです。2つの建設業者が再建事業を担当し、南ナイジェリア全体の接続性を改善することが期待されています。", "summary_en": "President Bola Tinubu has directed the Niger Delta Development Commission (NDDC) to reconstruct the deteriorating Warri-Sapele-Benin section of the East-West Road in Delta State. The project follows complaints about poor road conditions that have isolated communities and disrupted transportation of goods and people. Two contractors are expected to handle the reconstruction, which aims to improve connectivity across southern Nigeria.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/906243-tinubu-orders-nddc-to-reconstruct-warri-sapele-benin-road-official.html", "state_media": false, "category": "政治", "full_text": "President Bola Tinubu has directed the Niger Delta Development Commission (NDDC) to commence the reconstruction of the Warri-Sapele-Benin section of the East-West Road in Delta State.\nThe NDDC Managing Director, Samuel Ogbuku, was quoted as saying this in a report published by The Guardian Newspaper on Saturday. The report said Mr Ogbuku stated this during an inspection of the road, following persistent complaints about the deteriorating condition of the major highway.\nHowever, the newspaper did not specify when the inspection took place.\nTinubu’s Directive\nMr Ogbuku said the directive followed an inspection of the Benin-Agbor and Benin-Warri corridors by the Minister of Works, David Umahi.\n“We are here because Mr President gave a directive to the NDDC to work on the road,” he said.\nHe explained that the commission had obtained the project design from the Ministry of Works and was set to commence reconstruction.\nMr Ogbuku also apologised to residents and motorists affected by the poor condition of the road, assuring them that the NDDC would work to address the situation.\nAccording to the report by The Guardian, two contractors are expected to handle the reconstruction project.\nSapele Cut Off\nThe Delta representative on the NDDC board, Monday Igbuya, said the deplorable state of the road had effectively isolated Sapele from Warri and other parts of Delta State.\nHe appealed to the commission to extend its intervention to other failed roads in the area, including the Eku Road, which he said had made movement difficult for residents and students.\nUmahi’s 14-Day Ultimatum\nThe development comes after Mr Umahi gave CCECC a 14-day ultimatum to repair severely damaged portions of the Benin-Asaba Highway.\nPREMIUM TIMES reported that Mr Umahi stated this during an inspection of the road. He ordered the contractor to urgently restore damaged sections, including portions around Ubulu-Okiti and Onicha-Ugbo.\nThe directive followed reports of severe traffic congestion and prolonged delays along the highway.\nSome motorists and passengers reportedly spent days on the road as a result of the deteriorating sections, underscoring the scale of the transportation crisis in the area.\nMajor Transport Corridor\nThe Warri-Sapele-Benin and Benin-Asaba corridors are important routes for the movement of people, agricultural produce and commercial goods between Edo, Delta and other parts of southern Nigeria.\nThe NDDC intervention is therefore expected to improve connectivity and reduce the hardships faced by commuters and businesses using the routes.\nThe Guardian reported that the reconstruction of the Warri-Sapele-Benin section followed a presidential directive to the NDDC.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "deteriorating", "definition": "悪化している、劣化している状態を示す。ここでは道路の状態が時間とともに悪くなっていることを表します。"}, {"word": "directive", "definition": "指導者や上位者からの命令や指示。正式で強制力のある指示を意味します。"}, {"word": "intervention", "definition": "問題解決のために他者が関与すること。ここでは政府機関が道路改修プロジェクトに乗り出すことを指します。"}, {"word": "connectivity", "definition": "異なる地域や場所を結ぶ接続性や通信性。交通や流通のネットワークが機能している状態を表します。"}, {"word": "corridor", "definition": "移動や通行のための通路。ここでは特定の地域間を結ぶ重要な交通路を意味します。"}, {"word": "deplorable", "definition": "非常に悪い、嘆かわしい状態。社会的または物質的に許容できないレベルの悪さを表します。"}]}, {"title_ja": "オスン州APC候補オイェバミジが敗北を認め、アデレケを祝福", "title_en": "Osun APC candidate Oyebamiji concedes defeat, congratulates Adeleke", "summary_ja": "オスン州のAPC州知事候補ボラ・オイェバミジは敗北を認め、511,067票で再選されたアデメラ・アデレケ知事を祝福しました。オイェバミジの得票は444,815票でした。選挙結果を受け入れつつも、オイェバミジは選挙後の暴力を非難し、知事に対して政治的所属に基づくハラスメントから市民と企業を保護するよう求めました。", "summary_en": "Bola Oyebamiji, the APC governorship candidate in Osun State, has conceded defeat and congratulated Governor Ademola Adeleke on his re-election victory with 511,067 votes versus Oyebamiji's 444,815 votes. While accepting the election outcome, Oyebamiji condemned post-election violence and called on the governor to ensure security and protect businesses from harassment based on political affiliations.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/906241-osun-apc-governorship-candidate-oyebamiji-concedes-defeat-congratulates-adeleke.html", "state_media": false, "category": "政治", "full_text": "The All Progressives Congress (APC) governorship candidate in Osun State, Bola Oyebamiji, has finally congratulated Governor Ademola Adeleke on his re-election for second term.\nMr Oyebamiji, in a statement posted on X on Saturday after addressing APC leaders and members in Osogbo, said he has accepted the outcome of the election and congratulated Mr Adeleke who emerged victorious in the election. He, however, mourned the victims who lost their lives in the pre-election violence in the states\nHe also condemned the reported post-election killings, harassment and intimidation of party members and called on Mr Adeleke to use his constitutional powers to protect lives and property across the state.\n“In the spirit of democracy and as we commemorate the 35th anniversary of the creation of our dear Osun State, I congratulate His Excellency, Senator Ademola Adeleke, the Executive Governor of Osun State, on his victory in the August 15, 2026 governorship election as declared by the Independent National Electoral Commission,” he said while addressing the party members in Osogbo.\nFollowing the 15 August governorship election, the Independent National Electoral Commission (INEC) declared Mr Adeleke, the Accord Party candidate, winner after defeating his closest challenger, Mr Oyebamiji of the APC, to secure another four-year term.\nThe governor was presented a certificate of return on 19 August in Osogbo by INEC National Commissioner representing the South-west, Kunle Ajayi.\nMr Oyebamiji’s concession comes about two weeks after Mr Adeleke was announced the winner of the election.\nMr Adeleke won the election with 511,067 votes, defeating Mr Oyebamiji of the APC, who polled 444,815 votes. The victory secured Mr Adeleke a second term in office\nMr Oyebamiji, however, said the reported violence against APC members and other residents must stop, urging the governor to ensure the safety of citizens and their businesses.\n“The senseless killings, harassment and intimidation of members and supporters of our party must therefore stop forthwith. Attacks on innocent citizens and their businesses must not be allowed to continue,” he said.\nPREMIUM TIMES reported that no fewer than 73 election-related violent incidents occurred ahead of the state’s governorship election leading to 29 deaths with Osogbo, the state capital, emerging as the worst-hit. The violence has also continued in the post-election period, with clashes killing no fewer than two people.\nHe also alleged that some small and medium-sized businesses had been attacked because of the perceived political affiliations or non-allegiance of their owners to the Accord Party.\n“For a state that aspires to achieve economic growth, attract investment and create sustainable employment opportunities for its people, the provision of security and a conducive environment for businesses to thrive is not negotiable,” Mr Oyebamiji said.\nDespite conceding the election outcome, the APC candidate said consultations were ongoing with party leaders and other stakeholders on the party’s next course of action.\n“As a party committed to the rule of law, we shall continue to pursue justice and fairness through lawful and constitutional means, particularly in relation to our electoral processes,” he said.\nHe urged APC members not to be discouraged, saying the party must remain united as it prepares for the 2027 general election.\nMr Oyebamiji also called on APC leaders and members in the state to close ranks and begin mobilisation for President Bola Tinubu’s re-election and other candidates of the party.\n“We must close ranks, strengthen our structures and work tirelessly to secure incontrovertible victories for Mr President and all our candidates in Osun State,” he said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "concede", "definition": "敗北を認める、または譲歩することを意味します。政治的文脈では、選挙での敗北を公式に認めることを指します。"}, {"word": "senseless", "definition": "理由や目的がない、無意味なという意味です。本文では「無意味な殺人行為」という文脈で使用されています。"}, {"word": "conducive", "definition": "〜に適した、有利な状況を作り出すという意味です。ビジネスや発展に良い環境を指しています。"}, {"word": "alleged", "definition": "主張される、または疑わしいとして述べられることを意味します。証拠なしに言及される場合に使用される法的用語です。"}, {"word": "incontrovertible", "definition": "否定の余地がない、疑う余地のないという意味です。疑問の余地なく明白なことを表します。"}, {"word": "mobilisation", "definition": "資源や人員を集結・活動させることを意味します。政治的文脈では選挙活動に向けた準備と組織化を指します。"}]}, {"title_ja": "ネパール洪水で2,400人が行方不明、「甚大な」被害の中で捜索活動継続", "title_en": "Search Continues for 2,400 Missing in Nepal Floods Amid Massive Devastation", "summary_ja": "ネパールの洪水で約2,400人が行方不明になっており、救助活動は4日目に入った。破壊の規模が明らかになり、この脆弱な国全体で広範な被害が明らかになっている。災害の規模を考えると、復旧作業は大きな課題に直面している。", "summary_en": "Rescue operations in Nepal have entered their fourth day as authorities search for approximately 2,400 people missing in devastating floods. The scale of destruction has become clearer, revealing extensive damage across the vulnerable nation. Recovery efforts face significant challenges given the scale of the disaster.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/29/world/asia/nepal-flood-rescue.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "キーウ近郊の民間地域の武器庫へのロシア攻撃で37人が死亡", "title_en": "37 Killed in Russian Strike on Kyiv Weapons Depot in Civilian Area", "summary_ja": "ロシア軍がキーウ近郊の民間地域に位置する武器庫を攻撃し、37人が死亡しました。ウォロディミル・ゼレンスキー大統領は、この施設が人口密集地に存在すべきではなかったと批判しています。ウクライナは、住宅地にある施設の配置について過失責任を問っています。", "summary_en": "A Russian military strike hit a weapons depot located in a civilian area near Kyiv, killing 37 people. President Volodymyr Zelensky criticized the depot's placement, stating it should never have been situated in a populated zone. Ukraine has blamed negligence for the facility's location in the residential area.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/29/world/europe/russia-ukraine-strike-kyiv-drones.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネパール洪水：900人の行方不明労働者に到達するためトンネル掘削を実施", "title_en": "Nepal Rescuers Tunnel Through Mountains to Reach 900 Workers Trapped After Floods", "summary_ja": "ネパール軍が主導する大規模な救助作戦が展開され、洪水後に取り残された約900人の労働者に到達することを目指しています。救助隊は困難な山岳地帯でトンネルを掘削し、行方不明の労働者にアクセスしようとしています。軍、産業団体、民間救助機関の連携が行われています。", "summary_en": "The Nepal Army has launched a major rescue operation to reach approximately 900 workers trapped after devastating floods, more than a day after the disaster struck. Rescue teams are boring through tunnels in difficult mountainous terrain to access the missing workers. The effort involves coordination between the military, industry groups, and private rescue organizations.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/29/world/asia/nepal-flood-hydropower-tunnels-rescue-missing-workers.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルがガザ北部への移動制限を解除、パレスチナ人が帰宅開始", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "イスラエルがガザを二分する軍事地帯の通行を許可し、避難していたパレスチナ人の帰宅が始まった。この決定は人質解放をめぐる交渉の僵局が打破されたことを受けたもである。数千人の住民がガザ北部の自宅への帰宅を開始している。", "summary_en": "Israel has allowed displaced Palestinians to cross a military zone that divides Gaza, following a breakthrough in negotiations over hostage releases. The reopening of the crossing marks a significant shift after a prolonged deadlock between Israeli authorities and Palestinian groups. Thousands of residents are now able to return to their homes in the northern part of the enclave.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、業界危機の深刻化を示唆", "title_en": "China's Top Property Developer Reports Massive Loss Amid Real Estate Crisis", "summary_ja": "中国の大手不動産開発企業バンケが巨額損失を報告し、不動産危機の深刻化への懸念が高まっている。同社の経営悪化は、不動産セクターの低迷が大型開発企業にまで広がっていることを示唆している。中国政府が業界の混乱を緩和するための追加的介入措置を講じるかどうかについて、疑問の声が上がっている。", "summary_en": "Leading Chinese property developer Vanke reported a significant loss, raising concerns about the deepening real estate crisis in China. The company's financial struggles suggest the property sector downturn is spreading beyond smaller developers to major industry players. Questions are mounting over whether the Chinese government will implement additional intervention measures to stabilize the troubled sector.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による弾片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From Oct. 7 Attack", "summary_ja": "8ヶ月間トンネルに閉じ込められていたイスラエル人人質の一部は、10月7日の攻撃による弾片が体内に埋め込まれたまま解放された。複数の女性が抑留中に独房に入れられていた。医療関係者は解放された人質の身体的外傷を記録している。", "summary_en": "Some Israeli hostages released after eight months in tunnels still have shrapnel embedded in their bodies from the October 7 attack. Several women were held in solitary confinement during their captivity. Medical officials are documenting the physical injuries sustained by the freed hostages.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIが宗教を変え、宗教がAIを変えようとしている", "title_en": "AI is changing religion and religions are trying to change AI", "summary_ja": "チャットボットなどの人工知能が宗教実践と交差する機会が増えており、これらの技術が宗教指導者に取って代わるのか、それとも彼らの活動を拡大するのかについての疑問が生じています。宗教機関はこれらのテクノロジーが自らの価値観と教えに沿うように、AI開発に関与しています。この議論は、技術革新と伝統的な宗教的権威との間のより広い緊張を反映しています。", "summary_en": "Artificial intelligence and chatbots are increasingly intersecting with religious practice, raising questions about whether they will replace spiritual advisors or enhance their reach. Religious institutions are engaging with AI development to ensure these technologies align with their values and teachings. The debate reflects broader tensions between technological innovation and traditional religious authority.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/27/ai-is-changing-religion-and-religions-are-trying-to-change-ai", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "揺らぐトランプ大統領、かつてないほど危険に", "title_en": "Trump's Floundering Presidency Makes Him More Dangerous Than Ever", "summary_ja": "ドナルド・トランプ大統領の政権が揺らぐ中、同大統領は自らの政治的支配力を守るため、ますます予測不可能で攻撃的になりつつある。エコノミスト誌は、彼の行動を加齢した銀背ゴリラに例え、任期末の数ヶ月間、より大きなリスクをもたらす可能性があると指摘している。典型的なレームダック大統領とは異なり、トランプ氏は支配力と影響力を維持することに決意している。", "summary_en": "As Donald Trump's presidency struggles, the outgoing president is becoming increasingly unpredictable and willing to defend his political dominance aggressively. The Economist compares his behavior to that of an aging silverback gorilla, suggesting he may pose greater risks during his final months in office. Rather than acting as a typical lame-duck president, Trump appears determined to maintain control and influence.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/25/as-his-presidency-flounders-trump-is-more-dangerous-than-ever", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "迎撃ミサイルが枯渇したときに何が起こるか", "title_en": "The Interceptor Missile Shortage Crisis", "summary_ja": "ウクライナおよび他国が迎撃ミサイルの深刻な不足に直面し、防空能力に対する懸念が高まっている。需要が生産能力をはるかに上回る中、供給の枯渇は広範な警戒を招いている。軍事専門家は、この不足が進行中の紛争における防衛戦略に大きな影響を与える可能性があると警告している。", "summary_en": "Ukraine and other nations face a critical shortage of interceptor missiles, raising serious concerns about air defense capabilities. The depleting supplies are causing widespread alarm as demand far exceeds production capacity. Military experts warn this shortage could significantly impact defense strategies in ongoing conflicts.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "今夏の気候災害はフランスの政治家と市民を行動へ駆り立てるか", "title_en": "Can Summer Climate Disasters Spur French Action on Climate Change?", "summary_ja": "フランスは今夏、気候変動により激化した熱波、山火事、干ばつに直面している。公的態度の変化には通常強力な政治的指導力が必要だが、市民と政治家の間で具体的な保護措置と気候対策の必要性を認識する共識が急速に高まっている。", "summary_en": "France experiences intensifying heatwaves, wildfires, and droughts driven by climate change this summer. While public attitude shifts typically require strong political leadership, emerging consensus suggests citizens and politicians increasingly recognize the need for concrete protective measures and climate action.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/environment/article/2026/08/29/will-this-summer-s-climate-disasters-push-french-politicians-and-citizens-to-act_6756972_114.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アイスランドのEU国民投票、加盟交渉再開への関心は低迷", "title_en": "Iceland's EU Referendum Shows Lukewarm Support for Rejoining Negotiations", "summary_ja": "アイスランドは8月29日、2015年から中断されているEU加盟交渉の再開の是非を問う国民投票を実施する。漁業、農業、経済問題がキャンペーンの中心争点となっている。現在の世論調査では賛成派がわずかに優位に立つものの、反対派との差は小さい。", "summary_en": "Iceland will hold a referendum on August 29 to decide whether to resume EU membership negotiations, which have been suspended since 2015. Key campaign issues include fishing rights, agriculture, and economic concerns. Current polls show only a marginal lead for the 'yes' camp over the 'no' camp.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/28/in-iceland-the-prospect-of-joining-the-eu-generates-little-enthusiasm-ahead-of-referendum_6756945_4.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ニジェール軍事政権指導者ティアニ将軍がクーデター未遂に直面", "title_en": "Niger Junta Leader General Tiani Faces Attempted Coup", "summary_ja": "ニアメの大統領宮殿と首都空港内の空軍基地周辺で昼夜を問わず銃撃戦が発生し、ティアニ将軍の軍事政権に対するクーデター未遂の兆候が見られている。銃撃は前夜から継続しており、首都での武力衝突が活発化している。ティアニ将軍は2023年7月の軍事クーデターで権力を掌握して以来、地域および国際的な圧力に直面している。", "summary_en": "Gunfire erupted around Niger's presidential palace in Niamey and an air base at the capital's airport overnight, signaling an attempted coup against General Tiani's junta-led government. The shooting has continued since the previous night, indicating active armed confrontation in the capital. General Tiani seized power in a military coup in July 2023 and has faced growing regional and international pressure.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/le-monde-africa/article/2026/08/29/niger-junta-led-by-general-tiani-faces-attempted-coup_6756970_124.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省ニュース", "title_en": "Mindef Updates", "summary_ja": "シンガポール国防省は定期的なニュースレターで最新情報を配信しています。本号は2026年8月29日に発行されました。購読者はストレーツ・タイムズのウェブサイトで購読設定を管理できます。", "summary_en": "The Ministry of Defence shares regular updates and news with subscribers. This newsletter edition was published on August 29, 2026. Readers can manage their subscription preferences through The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートニュースレターは、読者に最新のニュースと情報を提供します。購読ポータルを通じて定期的な更新を受け取り、ニュースレター設定を管理できます。", "summary_en": "The Straits Times Evening Update newsletter provides readers with the latest news and updates. Subscribe to receive regular updates and manage your newsletter preferences through their subscription portal.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズのモーニングブリーフィングは、読者に重要なニュース更新と情報を提供します。ストレーツ・タイムズから定期的な無料ニュースレターを受け取るために購読し、購読設定を管理できます。", "summary_en": "The Straits Times Morning Briefing provides readers with essential news updates and information. Subscribe to receive regular free newsletters and manage your subscription preferences through The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "入植者がパレスチナ人を負傷させ、ヨルダン川西岸で外国人ジャーナリストを攻撃", "title_en": "Settlers wound Palestinians, attack foreign journalists in West Bank", "summary_ja": "イスラエルの入植者数十人がヨルダン川西岸でパレスチナ人と外国人ジャーナリストを攻撃し、民間人に怪我を負わせた。この事件は紛争地域における緊張の激化を示している。ハアレツが入植者グループによる暴力的な対立を報じている。", "summary_en": "Dozens of Israeli settlers attacked Palestinians and foreign journalists in the West Bank, causing injuries to civilians. The incidents represent escalating tensions in the disputed territory. Haaretz reports on the violent confrontations involving settler groups.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihwJBVV95cUxOWVE0X2JTdnhRTlpQVE8tMTBNbTM2NW5uM2lqdlVvTW9GcFc1Nmo5M1dGZGROMUs3VUUtNlQ2eG9ZMEVJYW5SUG5reWZOR3pCMzJsSDh4cmRFa2FEMzBON1VYb0hueTlMTmFqSUJOZG5YeUY4cUZObkZRSUw3WmRuSlZDS094M1ZMWVFIZXVrYWtjOVNObjdTZGdyQW9IejJwdmZnSm5xdms3QjA1WF90QjFKajlIRTBVRWQ3NE9CdldEeGd2c1d5NUJPdDhoMzItMV9ZQ1J3b2V6R1VXc2RMdXlHdDE1amtWRWI3NnBzQVpGX3F6bWlyNGFSaGZ0ZkVfUFdUZnc3aw?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの指導者たちが悪役を受け入れている", "title_en": "Israel's Leaders Embracing the Role of Villain", "summary_ja": "ハアレツのオピニオン記事は、イスラエルの指導部が国際関係において対抗的な立場を採用していることを批判している。この記事は、現在のイスラエル指導者たちが否定的な認識に対抗するのではなく、それを強化していることを示唆している。", "summary_en": "A Haaretz opinion piece critiques Israeli leadership for adopting antagonistic positions in international relations. The article suggests that current Israeli leaders are reinforcing negative perceptions rather than working to counter them.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi_gFBVV95cUxObk84cjEtbUVjalZUbVU4YmlGazBLSC1PM24ybXpQSThNSllvME1HMU5qZ0VEcjNtengwUS15SWN6S1BTTlp4d0xDUnl3WFNJaFNHQTh1OV9aV2tONV9UcXNLdFlobHdhQkJqVWc4eEhfMHJJdmV1MTJMVlVqOWNEWnJoRl9EcTM3ZW9jZk1Ya1Y3UUNacDZkN0ZDRVQ1dkpfVXdUWHV5a1VWZGhwd3NGdXdOR01BTUNZSWl0amdZUENsMU40b25iYzJJOXBYZjhhdFd3STMtT0V4d3l6cm9vaU5CUHhjcWQtaXg3ekZhM0J5c3VtR25lOUxfWEI0dw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相、パレスチナ村を襲撃した入植者を『無法な暴徒』と非難", "title_en": "Netanyahu Calls Settlers Who Raided Palestinian Village 'Lawless Rioters'", "summary_ja": "イスラエルのネタニヤフ首相は、パレスチナ村を襲撃した入植者らを『無法な暴徒の一握り』と表現しました。この発言は、イスラエル政府と入植者運動との間の緊張関係を反映しています。この事件は、入植地拡大とパレスチナ側の安全保障懸念をめぐる継続的な紛争を浮き彫りにしています。", "summary_en": "Israeli Prime Minister Benjamin Netanyahu has characterized settlers involved in a raid on a Palestinian village as a 'handful of lawless rioters.' The statement reflects tensions between the Israeli government and settler movements in the occupied territories. The incident highlights ongoing conflicts over settlement expansion and Palestinian security concerns.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiigJBVV95cUxNUjBxa1o4Z3ZPN2JNSnRSQ3lfM1RfdHNIaDd3Nkhsc1VIaU5LYW9HM2czbW5DenZDRS13c2hSRVpHSzEwVlBxemFXTW1NUVhnNWl0b0lDdlVaNE04NUhIa2NpQTAyLTVPd2h1VEVaUU9sSGQzZmVCVUJ2dXdtMTFSVDdoYm9VTTVYRkpIMEdpTzBTQjBCTmk3WFpyRWRKRUQ4V2lYXzZlZFdCejQ4MC1CakNKY3YwSVZodzRsLVVzWTNONm04N0dTM3l1VGhzNWZpM0lpcVNsc3d4QTdYXy1Gb291QVdPdWt2U1RaOU5sTFBBVmllSUhyaHlTbC1xSG1sbmNPUElMcmdZdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の中央選挙委員会が原子力政策国民投票を承認、その他の提案を却下", "title_en": "Taiwan's CEC Approves Nuclear Policy Referendum, Rejects Other Proposals", "summary_ja": "台湾の中央選挙委員会は原子力政策に関する国民投票を承認する一方で、体罰と交通罰金に関する提案を却下した。この決定は、公開投票の法的要件を満たす提案についての委員会の評価を反映している。", "summary_en": "Taiwan's Central Election Commission has approved a referendum on nuclear policy while rejecting proposals related to corporal punishment and traffic fines. The decision reflects the commission's assessment of which proposals meet legal requirements for public voting.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE45MlRLMG5peU5KYXhXZFI1anJXd2NvVHREa0VNNC1oSHY0UUVBb0w1UGN0VUlKQTA1OWp5MmtCcm5RbEhLQUxReG9Cei1KVUJ6RDVSdTRLYw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "新しいドローン法が台湾の軍事調達を遅延させる可能性：アナリスト", "title_en": "New Drone Act Could Slow Taiwan Military Procurement: Analysts", "summary_ja": "台湾の新しいドローン規制は、防衛アナリストによると、軍事調達プロセスに遅延をもたらす可能性がある。この法律は、台湾軍がモダナイゼーションに必要な無人航空システムを取得する速度に影響を与える可能性がある。", "summary_en": "A new drone regulation in Taiwan may create delays in military procurement processes, according to defense analysts. The legislation could impact the speed at which Taiwan's armed forces acquire unmanned aerial systems needed for modernization.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1HaTRLQ1BJYXlZOWVENXA1UE1BOFEzRk9EWVZ4ckY3YnBvYlM2alh3eWNOTldEUXR3eVQtbWpMS1BXb0xwc3lVa1lWLXpXSHBpbGNNY01tdw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フォーカス台湾 - CNA英語ニュース", "title_en": "Focus Taiwan - CNA English News", "summary_ja": "フォーカス台湾は、台湾の公式通信社である中央通信社（CNA）の英語ニュースサービスです。台湾全域のニュース、イベント、および台湾に関心のある国際的なトピックスについて、包括的な報道を提供しています。", "summary_en": "Focus Taiwan is the English news service of the Central News Agency (CNA), Taiwan's official news organization. It provides comprehensive coverage of news, events, and developments across Taiwan and international topics of interest to Taiwan.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiO0FVX3lxTE9aU2ljbTc1d0Y3alZIY005T0hWTmZOTGpod3pXQU9zbm4yYjhoOXAzdy1WNGlxemk1bVU0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国裁判官が9/11テロ容疑者の自白を却下", "title_en": "US Judge Throws Out Confessions of Alleged 9/11 Mastermind", "summary_ja": "CGTNは、9/11テロ攻撃の首謀者とされる容疑者の自白を米国の裁判官が却下したと報じている。CGTNによると、この決定は取調べ中に得られた陳述の妥当性に疑問を投げかけている。CGTNは、この展開が2001年のテロ事件に関連する継続中の法的手続きに重大な影響を与える可能性があると報じている。", "summary_en": "CGTN reports that a US judge has thrown out confessions from the alleged mastermind of the 9/11 attacks. The decision raises questions about the validity of statements obtained during the detainee's interrogation. CGTN reports this development may have significant implications for ongoing legal proceedings related to the 2001 terrorist attacks.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-29/US-judge-throws-out-confessions-of-alleged-9-11-mastermind-report-1PZQSUCZdZe/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国のイラン制裁：「最大圧力」戦略は機能するか", "title_en": "US Sanctions Iran: Will 'Maximum Pressure' Strategy Succeed?", "summary_ja": "CGTNが報じるところによると、米国はイランに対する「最大圧力」政策の一環として制裁を課しています。この報告書は、このアプローチが意図された目標を達成するかどうかを検討しています。アナリストはイランの行動変化をもたらすための経済措置の有効性に疑問を呈しています。", "summary_en": "CGTN reports that the US has imposed sanctions on Iran as part of a 'maximum pressure' policy. The report examines whether this approach will achieve its intended objectives. Analysts question the effectiveness of such economic measures in changing Iran's behavior.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-28/US-sanctions-Iran-Will-maximum-pressure-work--1PXkDzIomLC/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "キルギスの観客が映画で中国の遺産と文化を鑑賞へ", "title_en": "Kyrgyz Audiences Set to Explore Chinese Heritage and Culture Through Film", "summary_ja": "CGTNが報じるところによると、中国の文化的コンテンツがキルギスの観客に向けて映画を通じて紹介される予定です。このイニシアチブは中国の遺産と両国間の文化理解の促進を目的としています。このプログラミングは文化交流と国民間の関係強化を意図しています。", "summary_en": "CGTN reports that Chinese cultural content will be showcased to Kyrgyz audiences through cinema. The initiative aims to promote Chinese heritage and cultural understanding between the two nations. The programming is intended to strengthen cultural exchange and people-to-people connections.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-26/Kyrgyz-audiences-to-see-Chinese-heritage-culture-on-screen-1PVBrc6VDdC/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "プーチン大統領、ロシアが世界第2位の石炭埋蔵量を保有していると述べる", "title_en": "Putin says Russia holds world's second-largest coal reserves", "summary_ja": "TASSは、プーチン大統領がロシアが世界第2位の石炭埋蔵量を保有していると述べたと報じている。国営メディアの報道によれば、プーチン大統領はコークス、鉄鉱石およびその他の鉱物がロシア国家経済の基礎であり続けていると述べたという。", "summary_en": "TASS reports that Russian President Putin stated Russia possesses the world's second-largest coal reserves. According to the state media account, Putin noted that coke, iron ore, and other minerals remain foundational to the Russian national economy.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2179387", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア外務省、米国がヨーロッパでの核兵器使用を真剣に検討していると主張", "title_en": "Russia Says US Seriously Considering Nuclear Weapons Use in Europe", "summary_ja": "TASSが報じたところによると、ロシア外務省のアンドレイ・ベロウソフ氏は、米国がヨーロッパでの核兵器使用を検討していると主張した。ベロウソフ氏は、ロシアの非戦略核兵器に関する議論を開始する米国の努力は、ヨーロッパに配備されている米国の核兵器によるもたらされる脅威から国際的な注意をそらすためのものだと述べた。", "summary_en": "TASS reports that Russian Foreign Ministry official Andrey Belousov claimed Washington is considering the use of nuclear weapons in Europe. Belousov stated that US efforts to discuss Russia's non-strategic nuclear weapons are intended to distract from what he characterized as threats posed by American nuclear weapons stationed in Europe.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2179385", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "仏世論調査：ルペン氏が2027年大統領選決選投票で勝利と予測", "title_en": "French poll predicts Le Pen victory in 2027 presidential runoff", "summary_ja": "タスは、極右候補マリーヌ・ルペン氏が2027年の大統領選決選投票で勝利する可能性があると予測するフランスの世論調査があると報道している。報告書は、現職のエマニュエル・マクロン大統領がフランスの憲法の任期制限により3期目の立候補資格がないことを指摘している。抜粋では予測される対戦についての詳細な世論調査情報は記載されていない。", "summary_en": "TASS reports that a French poll predicts far-right candidate Marine Le Pen could win a 2027 presidential runoff. The report notes that incumbent President Emmanuel Macron will be ineligible to seek a third consecutive term due to France's constitutional two-term limit. Further polling details regarding the predicted matchup were not specified in the excerpt.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2179383", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英国は公正なグローバル経済構築にどう貢献できるか", "title_en": "How Britain Can Help Build a Fairer Global Economy", "summary_ja": "ダニー・スリスカンダラジャ著。アンディ・バーナム首相が近い将来のG20およびG7議長職を活用して、軍事的姿勢ではなく経済的公正性に焦点を当てた新しい国際主義を推進すべきだと主張している。防守的な政策の代わりに、英国は債務救済、違法な資金流出、富裕層課税などの具体的な問題でリーダーシップを発揮し、既に世界協力を進めている有志国家連合を支援すべきである。", "summary_en": "Danny Sriskandarajah argues that Prime Minister Andy Burnham should use the UK's upcoming G20 and G7 presidencies to champion a new internationalism focused on economic fairness rather than military posturing. Instead of defensive policies, Britain should lead on concrete issues like debt relief, illicit financial flows, and wealth taxation while supporting innovative coalitions of willing nations already advancing global cooperation.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/andy-burnham-g7-g20-presidencies-opportunity-to-reshape-global-economy-by-danny-sriskandarajah-2026-08", "state_media": false, "category": "オピニオン", "full_text": "How Britain Can Help Build a Fairer Global Economy\nDanny Sriskandarajah\nWith the United Kingdom poised to preside over both the G20 and the G7, Prime Minister Andy Burnham has a unique opportunity to usher in a new internationalism grounded not in military posturing, but in the pursuit of a fairer global economy. But he must abandon his predecessor’s defensive approach.\nLONDON—Andy Burnham faces no shortage of challenges as the United Kingdom’s latest prime minister. Fortunately, he also has a unique opportunity to lead the way in addressing major global economic issues and redesigning outdated institutions.\nBurnham took over after a tumultuous decade bookended by the UK’s decision to leave the European Union in 2016 and the premiership of Keir Starmer, who struggled to convince the public that international cooperation serves British interests. Burnham therefore inherits a foreign policy that feels both defensive and diminished, focused on holding fragile alliances together and cutting foreign-aid budgets dramatically in the name of “progressive realism”—a tagline that inspires no one.\nAlthough threat management may be unavoidable in today’s world, it does not offer people a positive vision. To do that, Burnham should set out to help shape norms and institutions that will outlast today’s chaos. The payoff would be a new internationalism grounded not in military postures, but in the pursuit of a fairer global economy that enables people everywhere to flourish. Such a framing would mirror Burnham’s promise of renewal at home and position Britain to lead on economic cooperation precisely when the old order is being undermined.\nThe timing is ideal because the UK will hold the G20 presidency in 2027 and the G7 presidency in 2028. Such opportunities are rare; those who seize on them benefit. Many still recall how Prime Minister Gordon Brown helped steady the world economy in 2009, and how his predecessor, Tony Blair, used the 2005 G8 to advance debt relief and aid for Africa.\nBurnham should be similarly bold. The safe option is to keep Britain’s head down, flatter a difficult US president, and avoid controversy. But defensiveness will not deliver meaningful results. Launching something new, even without a full consensus, is the better option. That is what South Africa did with the International Panel on Inequality during its G20 presidency, and it is what Brazil did by putting taxation of the super-rich in its Rio leaders’ declaration.\nBritain, for its part, could urge concrete action on the debt crises that are strangling dozens of countries, crack down on illicit financial flows, or introduce a minimum tax on billionaires. Leading by example on any of these issues would signal that it wants to shape the future rather than merely salvage remnants of the past. A prime minister who promised to “build a new economy” that delivers fairer outcomes for his constituents in Makerfield should embrace the same goal for people struggling to get by in Maputo or Mumbai.\nTo that end, Burnham also has an opportunity to break ground on building new institutions for global cooperation. The international legal, political, and economic institutions that Britain helped design in the 20th century increasingly seem ineffective, and some are facing ruthless attacks from allies or even some British politicians (in the case of the European Convention on Human Rights). The answer is not to defend the status quo but to help create a new one.\nA good place to start is with the “coalitions of the willing” that are already bringing together small groups of states (often odd bedfellows) to advance a shared agenda. For example, Barbados, France, and Kenya are co-chairing a Global Solidarity Levies Task Force to develop new international fees on aviation, premium flyers, shipping, fossil-fuel extraction, and financial transactions to generate revenues for climate and development finance. Similarly, Colombia and the Netherlands have led an effort to drive progress on the transition away from fossil fuels, and other groupings are working on debt relief, central-bank swap lines, and wealth taxes.\nBy joining, funding, or simply giving airtime to these initiatives at the G7 or the G20, the UK would send a strong signal that it is not relying only on existing international mechanisms to pursue global goals. It would also help convince countries across the Global South that their voices and leadership are valued.\nThough building global consensus seems impossible nowadays, these ongoing efforts should give us hope that progress is still possible. The building blocks of a new 21st century internationalism are already being assembled. In some cases, like the proposal to tax polluting activities through solidarity levies, new initiatives allow a small group of countries to test and study novel approaches without having to achieve a global consensus or overcome vetoes from powerful countries. In other cases, such as the International Panel on Inequality, t", "translation_ja": "", "vocab": [{"word": "preside", "definition": "会議や組織の長として主導・統括すること。ここではG20とG7の議長国となることを意味する。"}, {"word": "ushering", "definition": "新しい時代や状況を導入・開始すること。変化をもたらす主導的な役割を果たす。"}, {"word": "diminished", "definition": "減少した、弱体化した状態。ここでは英国の国際的影響力が低下していることを表す。"}, {"word": "illicit", "definition": "違法な、不正な活動。脱税や資金洗浄など規則に違反する金銭的取引を指す。"}, {"word": "coalitions of the willing", "definition": "共通の目標を掲げた国々の有志連合。必ずしも全ての国の同意を必要とせず、志を同じくする国々が協力する形態。"}, {"word": "solidarity levies", "definition": "連帯税制。特定の活動（航空、船舶など）に課せられ、気候変動や開発支援に充てられる国際的な課税。"}]}, {"title_ja": "テクノクラシーではヨーロッパは修復できない", "title_en": "Technocracy Can't Fix Europe", "summary_ja": "新たに設立されたライン・グループは、ヨーロッパの一流ビジネス・テクノロジーリーダーを集めてイノベーションと成長を促進しようとしているが、著者はヨーロッパの根本的な課題は技術的ではなく政治的であると主張している。テクノクラートによるプライベート・イニシアティブがいかに善意であっても、政治的意志と制度改革を必要とする問題は解決できないという論点である。", "summary_en": "While the newly launched Rhine Group brings together elite European business and tech leaders to boost innovation and growth, the author argues that Europe's fundamental challenges are political rather than technical. A private initiative of technocrats, however well-intentioned, cannot solve problems that require political will and institutional reform.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/rhine-group-eu-reform-mission-technocratic-fixes-wont-fix-political-problems-by-alberto-alemanno-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Technocracy Can’t Fix Europe\nA new private initiative bringing together the crème de la crème of European business, financial, economic, and tech elites could well prove useful in kick-starting European growth and innovation. But first, it must recognize that the problem it hopes to solve is fundamentally political.\nALPBACH—The Rhine Group, launched this week with the goal of restoring Europe’s capacity to innovate, grow, and compete globally, is an unusual initiative: a private club assembled to do what public institutions are supposed to do. Nonetheless, it has brought together many household names, with former European Central Bank President Mario Draghi and the tech entrepreneur Patrick Collison serving as co-chairs. Luis Garicano, an LSE economist and former liberal member of the European Parliament, is the executive director.", "translation_ja": "", "vocab": [{"word": "technocracy", "definition": "技術者や専門家による統治体制。政策決定が政治的判断ではなく技術的専門知識に基づくシステム。"}, {"word": "crème de la crème", "definition": "フランス語由来の表現で、最高レベルのエリート、最上級の人物たちを指す。"}, {"word": "initiative", "definition": "新たに開始された計画やプログラム。主導権を持って物事を始める行動。"}, {"word": "kick-start", "definition": "何かを急速に始める、推進する。停滞している物事に新たな活力を与える。"}, {"word": "household names", "definition": "一般的に広く知られている著名人や有名企業。家庭でも知られているほど有名な人物。"}, {"word": "institutional reform", "definition": "組織や制度を改革し、より効率的で機能的にすること。既存の制度の構造的な改善。"}]}, {"title_ja": "連邦準備制度と財務省は現実を直視していない", "title_en": "The Fed and the Treasury Are in Denial", "summary_ja": "著者は、米連邦準備制度と財務省が時代遅れの経済的正統性にしがみつき、米国債とドルへの安定した需要が永遠に続くと仮定していると主張しています。教会の歴史的な科学的証拠の否定に例えながら、政策立案者は市場効率性の理論を追求するのではなく、金融市場が実際にどのように機能しているかを認識する必要があると述べています。", "summary_en": "The author argues that the US Federal Reserve and Treasury are clinging to outdated economic orthodoxy, assuming stable demand for US debt and currency will persist indefinitely. Drawing parallels to the Church's historical denial of scientific evidence, the piece contends that policymakers must acknowledge how financial markets actually function rather than pursuing theories of market efficiency.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/fed-treasury-in-denial-about-their-entanglement-in-financial-markets-by-katharina-pistor-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Fed and the Treasury Are in Denial\nFor most of the postwar era, the United States has enjoyed a privileged position as an issuer of both sovereign debt and US dollars that always found takers. But the US may no longer be able to rely on stable demand for its debt or its currency, forcing policymakers to face the truth about how financial markets are made.\nNEW YORK—For centuries, the Catholic Church upheld the dogma that the world was flat and that the sun revolved around it, despite evidence to the contrary. It would take a technological, scientific, and cultural revolution to undermine this doctrine fully. Today, we are at a similar juncture when it comes to finance, where the orthodoxy of “flat” markets in pursuit of efficient outcomes maintains its grip on the minds of many economists and, more problematically, policymakers.", "translation_ja": "", "vocab": [{"word": "postwar era", "definition": "戦後の時期を指す。第二次世界大戦終了後から現在までの期間、特に国際経済や政治体制が形成された時代。"}, {"word": "sovereign debt", "definition": "国家が発行する債務。政府が国内外から借り入れた資金で、国債などの形態で存在する。"}, {"word": "orthodoxy", "definition": "正統的な見方や信念体系を指す。経済学や政策において広く受け入れられている従来の理論や考え方。"}, {"word": "dogma", "definition": "疑問の余地なく受け入れられているべき教義や原則。科学的根拠よりも信仰や伝統に基づく固定観念。"}, {"word": "juncture", "definition": "重要な転換点や分岐点を意味する。歴史的に重要な決定や変化が必要とされる時点。"}, {"word": "efficient outcomes", "definition": "最適な結果や効率的な成果のこと。経済学では市場が資源を最も有効に配分することを意味する。"}]}, {"title_ja": "トランプ大統領の湖の改名は失政から目をそらすための絶望的な戦術", "title_en": "Trump's Lake Renaming is a Desperate Distraction from Failures", "summary_ja": "ガーディアン紙のコラムニスト、アルワ・マハダウィは、トランプ大統領がオンタリオ湖を「アメリカ湖」に改名する行政命令を出したことは、イラン戦争の失敗、支持率の急落、国際関係の悪化など政権の深刻な失敗から目をそらすための哀れな戦術だと主張している。彼女は、メキシコ湾の改名に続くこの改名は、知的・外交的能力に欠ける弱い大統領が、普通のアメリカ人に影響する現実の課題を無視して些細な象徴的ジェスチャーに訴えていることを明らかにしていると述べている。", "summary_en": "Guardian columnist Arwa Mahdawi argues that Trump's executive order to rename Lake Ontario as 'Lake America' is a pathetic distraction tactic from his administration's serious failures, including a disastrous Iran war, collapsing approval ratings, and damaged international relations. She contends that the rebranding—following his similar renaming of the Gulf of Mexico—reveals a weak president lacking intellectual and diplomatic ability, who resorts to trivial symbolic gestures while ignoring real issues affecting ordinary Americans.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/29/lake-america-trump-approval-ratings", "state_media": false, "category": "オピニオン", "full_text": "Don’t mention the war! Or the economy, for that matter. Or the Epstein files. Or Natalie Harp. Or “affordability”, which, as Donald Trump recently said at a rally, is a word that was “never used” by the media before he took office. Best not to talk about anything that affects ordinary people or embarrasses the president, really. Instead, let’s all rejoice in Trump’s latest triumph: renaming Lake Ontario, which is shared by Canada and the US, as Lake America.\nOn Thursday, Trump signed an executive order directing federal agencies to America-fy the lake’s name on US maps and documents, which is an excellent use of time and resources. I suppose we can at least be thankful that the president, who is trying to slap his own name on everything from airports to the Kennedy Center, didn’t decree that the body of water be called Lake Trump.\nThis is not an isolated embarrassment: the Lake Ontario name change follows the president’s rebranding of the Gulf of Mexico to the Gulf of America last year. “We have a gulf and we have a lake – now all we need is an ocean. Maybe we’ll have to change the name of the Atlantic and/or the Pacific,” Trump told reporters.\nGive it a few more months of the disastrous war in Iran and a bruised Trump may well make good on that threat: the man will do anything to distract from his failings.\nAs well as being a distraction, this pathetic maneuver is supposed to be a middle finger to Canada. Trade negotiations between the US and Canada recently collapsed, with the Trump administration imposing a 50% tariff on some goods and the Canadian prime minister, Mark Carney, promising a “dollar for dollar” response. One suspects that Trump thinks Lake Ontario is named after the Canadian province it borders. Ergo he reckons a unilateral name change is a good way of showing the US’s northern neighbour who is boss.\nHowever, as Carney was forced to point out on social media, the name Lake Ontario has been used for more than 400 years and comes from the Indigenous Wendat/Huron word Ontari’io, meaning: “The lake is beautiful, the lake is big.” It predates both the Confederation of Canada and the US Declaration of Independence.\nA US president ordering the name change of a Great Lake in order to antagonize one of its closest allies would have been headline news for weeks in a normal timeline. Now it’s just another Thursday. Still, this is more than a silly stunt that both Canada and the governor of New York have made clear they are going to ignore. It’s a glaring demonstration of just how desperate, isolated and out of ideas Trump is. His approval ratings have hit a new low, sliding 14 points from 47% at the start of his second term to 33% now amid rising costs. The Iran war, which was sold as a “little excursion” that would only last a few weeks has hit the six-month mark, and there isn’t a decent off-ramp in sight. And Canada isn’t the only former ally angry with Trump’s US; the country’s reputation has plummeted globally. A 36-country survey conducted by Pew earlier this year found overall ratings for the US are largely negative; only seven countries rate the US positively, with Israel at the top of the list. Trump is weak and floundering: because he lacks the intellectual and diplomatic ability to reshape reality to his liking, he’s trying to rebrand it instead. But it doesn’t matter how many executive orders he signs; people will be calling Lake Ontario by its original name long after we can all stop calling Trump “president”.\nFlorida ‘deputy of the year’ allegedly used Flock camera surveillance system to stalk ex\nBrevard county’s 2025 deputy of the year has now resigned from the sheriff’s office after an investigation found numerous examples of “egregious misconduct”, including images of him putting a gun in his ex-girlfriend’s mouth and a claim he used the Flock license plate readers to look up his ex-girlfriend. He also appeared to have posted a photo of himself sporting a Hitler-like moustache while performing a Nazi salute. (He denies that he used Flock to stalk his ex, and said the photo was merely a joke.) This is not a one-off: there are numerous allegations involving law enforcement officers using Flock to stalk people. Just this week a police officer in Kentucky was accused of using the Flock camera system to search for and track his ex more than 2,000 times.\nTate brothers reportedly rented supercars to appear ‘uberwealthy’\nThe self-styled misogynist Andrew Tate and his brother Tristan were arrested in the US in July as part of a UK police investigation into alleged sexual offences. Part of their lawyers’ strategy to fight extradition seems to be to paint them as posers who just pretended to be “uberwealthy” online in order to generate attention. “[T]he $2.1m Aston Martin and $5m and $7m Bugattis featured in Tristan’s videos were rented,” one legal submission notes. “The valuation of Andrew’s watch collection is based on a third-party enthusiast publication.”\nWomen using HRT may be at lower risk", "translation_ja": "", "vocab": [{"word": "distract", "definition": "人の注意や関心を他に向けさせる、気をそらす。政治的文脈では、重要な問題から国民の注意をそらすために使われる。"}, {"word": "rebranding", "definition": "企業や組織、概念などに新しいイメージやアイデンティティを与えること。ここではトランプが地名を変更して政治的メッセージを発信する戦術を指す。"}, {"word": "egregious", "definition": "非常に悪い、ひどい、明らかに間違った。極めて深刻な不品行や違反行為を形容する。"}, {"word": "diplomatic", "definition": "外交に関連した、または慎重で配慮に満ちた。国家間の関係構築や交渉能力に関する。"}, {"word": "floundering", "definition": "困惑状態にあり、どうすべきかわからず右往左往する。政治的には指導力を失い、有効な対策が打てない状態。"}, {"word": "off-ramp", "definition": "ハイウェイからの出口。政治的には困難な状況から抜け出すための解決策や出口を意味する。"}, {"word": "trivial", "definition": "重要でない、取るに足らない、つまらない。政治的に実質的な意味のない象徴的行為を形容する。"}]}, {"title_ja": "ドリー・パートンの遺産とトランプ大統領の失敗したリーダーシップの対比", "title_en": "Dolly Parton's Legacy Contrasts Sharply With Trump's Failed Leadership", "summary_ja": "ロバート・ライシュは、トランプ大統領がドリー・パートンの称賛に値する価値観の正反対を象徴していると主張し、彼を外交政策の失敗と国内での敗北の後に暴力的に報復するいじめっ子と特徴付けている。ライシュは、カナダとの貿易戦争や失敗した行政権力の乱用の試みを含むトランプの不規則な行動が、不敗のイメージが崩壊した無能で薄っぺらいリーダーを明かしていると主張している。", "summary_en": "Robert Reich argues that President Trump represents the opposite of Dolly Parton's admirable values, characterizing him as a bully lashing out after humiliating foreign policy failures and domestic defeats. Reich contends that Trump's erratic actions—including a trade war with Canada and failed attempts at executive overreach—reveal an incompetent, thin-skinned leader whose carefully maintained image of invincibility has crumbled.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/28/dolly-parton-trump-canada", "state_media": false, "category": "オピニオン", "full_text": "I’m still grieving Dolly Parton. I never met her and always wanted to. She was almost exactly my age and my height and had values I deeply admired. Her death leaves a hole in the firmament.\nWhich brings me to the person whose values are as far from Dolly Parton’s as any human could possibly be and still claim to be human. I’m referring, of course, to the current occupant of the Oval Office.\n“I knew her a little bit,” Trump boasted about Parton on Glenn Beck’s radio show. “She really liked me, I will tell you!” at which Beck laughed out loud.\nTrump has become mad as a hatter. Loonier than looney tunes. Totally nuts. An enraged, engorged child who’s frightened to death of being seen as a loser.\nHe’s losing his war in Iran – the war he decided to start without consulting Congress, without even telling the American people his goal or exit strategy.\nNow he’s trapped there – with a stronger and more extreme group in control of Iran than before his attack, probably more intent on making a nuclear bomb, blocking the strait of Hormuz (it was open before Trump attacked), causing oil prices to rise again.\nHis current attempt to stop other countries from dealing with Iran is a bad joke. Iran is becoming the dominant power in the Gulf, having demonstrated its ability to damage the oil and gas infrastructure of its neighbors.\nBesides, China can supply almost everything Iran needs and has a strong incentive to do so.\nSo – now clearly revealed as a loser – what does Trump do? Like any bully, he lashes out.\nIf the courts won’t allow him to put his name on the Kennedy Center, he’ll demolish it. If they say he doesn’t have authority to build his ballroom, he’ll fight to build it anyway.\nIf his blue paint on the reflecting pool is peeling and the green algae are back and his US attorney won’t prosecute “vandals” for causing the problem, he’ll stick to his story and blame vandals anyway.\nIt’s all going so badly for Trump that his lizard brain is compelled to show he can bully someone. So who does Trump choose? Our old neighbor and friend Canada, who has always gone along with whatever the American colossus ever wanted.\nTrump imposed 50% tariffs on all cars, trucks, auto parts and steel coming from Canada.\nWhy? Because, he says: “Canada has been ripping off the United States of America for years. On Trade, and in other ways, also, they are among the worst Nations in the World to deal with. They feel entitled, and yet, WE DON’T NEED CANADA, THEY NEED US!”\nIn other words, we’re in a trade war with Canada because, well, Trump wants one. A trade war with Canada probably seemed easier to win than a hot war with Iran. And he had to save face somehow, right?\nEven though the supreme court found his attempt to use emergency powers for his last round of tariffs to be unconstitutional, he’s now using the Smoot-Hawley Tariff Act of 1930 – which, not incidentally, worsened the Great Depression.\nBut maybe a trade war with Canada won’t be all that easy to win. Canada has now retaliated with its own tariffs of up to 50% against about 700 American products.\nAs the Canadian prime minister, Mark Carney, noted on Saturday: “Last spring, I warned that America is trying to break us so they can own us, and I promised that will never, ever happen. We are keeping that promise.”\nCarney is now a hero in Canada with approval ratings in the 60s, while Trump’s have sunk to the low 30s.\nHumiliation upon humiliation for the man who can’t stand to be humiliated.\nIt gets worse by the day.\nNetanyahu has rejected Trump’s plan for Gaza. Congressional Republicans are blasting him for increasing imports of ground beef.\nUniversities are rejecting his latest directives. ABC has sued his regime for threatening its broadcast licenses.\nEven the bond market won’t be cowed. It’s in open revolt against his bonkers fiscal policies.\nThank goodness for him that Darline Graham won South Carolina’s special election Republican runoff to replace her brother. Trump had made her race all about himself – of course – telling supporters that her opponents were “only fighting Darline because they want me to lose”.\nI’m sure that’s what he’s telling himself about his many losses and humiliations – that they’re all due to his opponents plotting and scheming against him.\n(Hopefully, he’s about to lose Congress, too.)\nThat’s an easier story for Trump to accept than the truth: that his carefully cultivated aura of invincibility has just about disappeared.\nThe would-be emperor has no clothes. Almost everybody now sees the thin-skinned, peevish, petty, incompetent, corrupt, naked infant who’s been parading around in presidential garb.\nAnd they’re not going to obey him any more.\nDolly Parton was a huge winner, bless her soul. Trump is the biggest loser on the planet.\n- \n  Robert Reich, a former US secretary of labor, is a professor of public policy emeritus at the University of California, Berkeley. He is a Guardian US columnist and his newsletter is at robertreich.substack.com. His new book, Com", "translation_ja": "", "vocab": [{"word": "aura", "definition": "人物や事物が周囲に放つ特有の雰囲気や印象のこと。「彼の不敗のオーラ」というように、その人物が持つ特有のイメージを示す。"}, {"word": "petty", "definition": "些細で取るに足らない、または小心者の意味。大事な問題ではなく、つまらないことにこだわる様子を表す。"}, {"word": "peevish", "definition": "ちょっとしたことで怒りやすく、機嫌が悪い様子を指す。気難しく、いらいらしている状態を表現する。"}, {"word": "lash out", "definition": "激怒して攻撃的に反応する、または強く批判するという意味の句動詞。感情的に反発する状況で使われる。"}, {"word": "humiliation", "definition": "屈辱や恥辱を受けた状態のこと。自分の尊厳が傷つけられた不快な感情を指す。"}, {"word": "retaliate", "definition": "報復する、仕返しをするという意味。相手の行動に対して同等の反撃を加えることを表す。"}]}, {"title_ja": "トランプの中間選挙キャンペーンテーマは片思いの愛", "title_en": "Trump's Midterm Campaign Theme Is Unrequited Love", "summary_ja": "シドニー・ブルーメンサルは、トランプの中間選挙戦略が共和党からの絶対的な忠誠心と献身を求めることを中心としており、政治的イデオロギーというより感情的な依存関係であると主張している。著者は、トランプの人気低下と検証への執着した必要性が、貿易戦争やつまらないジェスチャーなどの気まぐれな政策を駆動し、恐怖を愛と同等視し、支持者からの完全な服従を要求していると述べている。", "summary_en": "Sidney Blumenthal argues that Trump's midterm strategy centers on demanding absolute devotion and loyalty from Republicans, framing it as a form of emotional dependence rather than political ideology. The author contends that Trump's declining popularity and obsessive need for validation drive his erratic policies, such as trade wars and petty gestures, while he equates fear with love and requires complete submission from his followers.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/28/trump-midterm-campaign-devotion", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump has framed his theme for the midterm elections. It has come to him as naturally and inevitably as staring into the mirror, beyond any logic or argument, his definitive answer to no specific issue, providing no understanding of any particular problem, but transcending all of them. His political theme is more primal than programmatic, more instinctive than analytical, a heartfelt expression to protect his greatest romantic attachment, his obsessive fixation, his idealized object: himself.\nTrump’s campaign theme is unrequited love. Unlike the pollsters, media consultants and pundits, he alone has grasped the magnitude and the source of the existential crisis threatening his politics. He has identified the problem for the Republicans as the faltering measure of complete devotion to him. His demand has nothing to do with mutual affection. It is a ploy to reassert his slipping control, a manipulative test to prove loyalty to him, or else. There can be no absolute rule without an absolute ruler; no absolute ruler without absolute submission; no absolute submission without the expression of absolute love. His sadness at its fading gives way to anger, paranoia and greater acts of retribution. He equates the fear he instills as a form of love. Trump accepts subservience, from whatever motive, as affection or its closest equivalent. He cares nothing about sincerity, so it’s all in the show. The less love displayed, the more fear required. Yet there is no rebound, but only deeper rejection.\nTrump is heading toward the floor for presidential unpopularity – Nixon during Watergate on the eve of his resignation, Truman late in his second term at the depth of the Korean war, and George W Bush at the 2008 financial crash. But Trump’s breakdown differs uniquely from theirs. His decline has come earlier in his term, been more sustained, and his disintegration has not stabilized but is accelerating. He is being crushed by the accumulation of catastrophic events of his own making to which his impulsive response is to double down in each and every area. Stalemated in his reckless Iran war, he has now launched a heedless trade war against Canada that will devastate Republican candidates in the northern tier of states. His latest vanity project is gestural retribution to rename Lake Ontario as “Lake America”, a watery ballroom. Admission of error for Trump would be the denial of self-love.\nTrump began his campaign on his unrequited love theme on 16 August during a Fox News interview in which he discussed his press secretary, Karoline Leavitt, leaving her job after just having a baby. He had held her up as meeting his highest criterion in remarks last December: “Isn’t she great? Is Karoline great? … She gets up there with that beautiful face and those lips that don’t stop, ba ba ba like a little machine gun.” Now, he tried to make a joke of her departure that expressed resentment at abandonment. “In fact, she likes her children more than she likes Trump. I’m very concerned about that,” he said. Then he repeated his unfunny “joke” at a campaign rally in South Carolina on 21 August: “I just learned she loves the baby more than she loves Donald Trump, and I’m very angry …” Trump’s lame attempt at humor was a rare instance of his truth-telling and self-revelation, a contemporary illustration of Freud’s Jokes and Their Relation to the Unconscious.\nTrump was in South Carolina to campaign for his chosen candidate in the Republican primary, Darline Graham, who he had insisted be appointed to the Senate seat of her brother Lindsey Graham after he died on 11 July. Darline Graham confessed to cluelessness when asked in a debate about her position on Taiwan. “National security is not my thing,” she answered. “I’m not … that informed on national security.” But she was fully informed on the necessity of obedience to Trump. “You saved our country, and I want to thank you for that,” she said at the rally. Trump praised his worshipper: “She’s got a good gene pool.” She was born to love him. She stood in stark contrast to the immigrants he had described as “poisoning the blood of our country”.\nThen Trump called on the crowd to embrace his new theme. “So what I really want you to do is pretend, please, that I’m on the ballot … So just say that I’m on the ballot one more time. You got to say it.” He wishes every candidate to sound like Darline Graham in proclaiming him the national savior. He insists he is beloved, and if those who revere him turn out the Republicans must win. In fact, though he is not on the ballot in the midterm elections, Trump is the central issue. Voters do not have to “pretend, please”.\nTrump intuitively comprehends that the midterm elections are about him in a way that makes this midterm unlike any other. In the marrow of his bones, he senses it is a crisis of his cult of personality.\nTrump’s Maga was never a new party structure, but constructed on his wreckage of the old Republican party. In its place, every partic", "translation_ja": "", "vocab": [{"word": "unrequited", "definition": "一方的な、返されない感情や行動を指す。特に愛情が相手に返されていない状況を表す。"}, {"word": "existential", "definition": "存在に関わる根本的な、または人生の根本的な意味や価値に関する。実存的な問題や危機を意味する。"}, {"word": "primal", "definition": "原始的な、本能的な、または最初の・最も基本的な。理性よりも本能に基づいた行動や感情を指す。"}, {"word": "impulsive", "definition": "衝動的な、思慮分別なく感情や衝動に従う。計画性や慎重さを欠いた行動を意味する。"}, {"word": "disintegration", "definition": "崩壊、分解、または統一性の喪失。組織や人物が徐々に衰退・崩壊していく過程を指す。"}, {"word": "cult of personality", "definition": "個人崇拝、または指導者への極度の献身と崇拝に基づいた政治体制。理性的評価よりも感情的忠誠が優先される。"}]}, {"title_ja": "大規模な経済バランスの調整が迫っている", "title_en": "A Great Rebalancing Is Coming", "summary_ja": "著者は、中国とドイツが大幅な貿易黒字を計上し、米国が赤字を吸収している現在のグローバル貿易不均衡は持続不可能であり、最終的には苦痛を伴う調整が必要になると主張している。主要経済国が原因と解決策について異なる見解を持っているため、協調行動の可能性は低く、危機は不可避である。歴史が示すように、このような不均衡は経済縮小を通じて解決され、各国の債務水準と経済力に基づいて異なる国々に不均衡な影響を与える。", "summary_en": "The author argues that current global trade imbalances—with China and Germany running large surpluses while the US absorbs deficits—are unsustai
