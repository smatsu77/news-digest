-inflicted crises. Blumenthal contends that unlike previous presidential unpopularity, Trump's decline is earlier, more sustained, and accelerating, as he doubles down on failed policies and retaliatory gestures instead of admitting error.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/28/trump-midterm-campaign-devotion", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump has framed his theme for the midterm elections. It has come to him as naturally and inevitably as staring into the mirror, beyond any logic or argument, his definitive answer to no specific issue, providing no understanding of any particular problem, but transcending all of them. His political theme is more primal than programmatic, more instinctive than analytical, a heartfelt expression to protect his greatest romantic attachment, his obsessive fixation, his idealized object: himself.\nTrump’s campaign theme is unrequited love. Unlike the pollsters, media consultants and pundits, he alone has grasped the magnitude and the source of the existential crisis threatening his politics. He has identified the problem for the Republicans as the faltering measure of complete devotion to him. His demand has nothing to do with mutual affection. It is a ploy to reassert his slipping control, a manipulative test to prove loyalty to him, or else. There can be no absolute rule without an absolute ruler; no absolute ruler without absolute submission; no absolute submission without the expression of absolute love. His sadness at its fading gives way to anger, paranoia and greater acts of retribution. He equates the fear he instills as a form of love. Trump accepts subservience, from whatever motive, as affection or its closest equivalent. He cares nothing about sincerity, so it’s all in the show. The less love displayed, the more fear required. Yet there is no rebound, but only deeper rejection.\nTrump is heading toward the floor for presidential unpopularity – Nixon during Watergate on the eve of his resignation, Truman late in his second term at the depth of the Korean war, and George W Bush at the 2008 financial crash. But Trump’s breakdown differs uniquely from theirs. His decline has come earlier in his term, been more sustained, and his disintegration has not stabilized but is accelerating. He is being crushed by the accumulation of catastrophic events of his own making to which his impulsive response is to double down in each and every area. Stalemated in his reckless Iran war, he has now launched a heedless trade war against Canada that will devastate Republican candidates in the northern tier of states. His latest vanity project is gestural retribution to rename Lake Ontario as “Lake America”, a watery ballroom. Admission of error for Trump would be the denial of self-love.\nTrump began his campaign on his unrequited love theme on 16 August during a Fox News interview in which he discussed his press secretary, Karoline Leavitt, leaving her job after just having a baby. He had held her up as meeting his highest criterion in remarks last December: “Isn’t she great? Is Karoline great? … She gets up there with that beautiful face and those lips that don’t stop, ba ba ba like a little machine gun.” Now, he tried to make a joke of her departure that expressed resentment at abandonment. “In fact, she likes her children more than she likes Trump. I’m very concerned about that,” he said. Then he repeated his unfunny “joke” at a campaign rally in South Carolina on 21 August: “I just learned she loves the baby more than she loves Donald Trump, and I’m very angry …” Trump’s lame attempt at humor was a rare instance of his truth-telling and self-revelation, a contemporary illustration of Freud’s Jokes and Their Relation to the Unconscious.\nTrump was in South Carolina to campaign for his chosen candidate in the Republican primary, Darline Graham, who he had insisted be appointed to the Senate seat of her brother Lindsey Graham after he died on 11 July. Darline Graham confessed to cluelessness when asked in a debate about her position on Taiwan. “National security is not my thing,” she answered. “I’m not … that informed on national security.” But she was fully informed on the necessity of obedience to Trump. “You saved our country, and I want to thank you for that,” she said at the rally. Trump praised his worshipper: “She’s got a good gene pool.” She was born to love him. She stood in stark contrast to the immigrants he had described as “poisoning the blood of our country”.\nThen Trump called on the crowd to embrace his new theme. “So what I really want you to do is pretend, please, that I’m on the ballot … So just say that I’m on the ballot one more time. You got to say it.” He wishes every candidate to sound like Darline Graham in proclaiming him the national savior. He insists he is beloved, and if those who revere him turn out the Republicans must win. In fact, though he is not on the ballot in the midterm elections, Trump is the central issue. Voters do not have to “pretend, please”.\nTrump intuitively comprehends that the midterm elections are about him in a way that makes this midterm unlike any other. In the marrow of his bones, he senses it is a crisis of his cult of personality.\nTrump’s Maga was never a new party structure, but constructed on his wreckage of the old Republican party. In its place, every partic", "translation_ja": "", "vocab": [{"word": "unrequited", "definition": "一方的な、応答されない。相手から同じレベルの返答や愛情が返ってこない状態を表します。"}, {"word": "primal", "definition": "原始的な、根源的な。理性や分析ではなく、本能的で基本的な性質を持つことを意味します。"}, {"word": "transcending", "definition": "超越する、乗り越える。特定の限界や範囲を超えて存在することを表します。"}, {"word": "retribution", "definition": "報復、懲罰。不正や不満に対する仕返しや罰を意味します。"}, {"word": "disintegration", "definition": "崩壊、分解。システムや個人の統一性が失われ、徐々に壊れていく過程です。"}, {"word": "vanity", "definition": "虚栄心、自尊心。自分の外見や重要性についての過度な関心や誇りを示します。"}, {"word": "marrow", "definition": "骨髄、本質。比喩的には、ものごとの最も深い、基本的な部分を意味します。"}]}, {"title_ja": "ドリー・パートンの普遍的な魅力が米国の団結について教えてくれること", "title_en": "What Dolly Parton's Universal Appeal Teaches Us About American Unity", "summary_ja": "マーガレット・サリバンは、深く分断されたアメリカ人を統一することができたドリー・パートンの能力が、分裂した国家に対する教訓を提供していると主張する。自己嘲笑的なユーモア、真摯な慈善活動、そして政治的立場に関係なく誰もが受け入れられる「根本的な受容」を通じて、パートンは真正性、謙虚さ、そして心からの親切が党派を超越できることを示した。", "summary_en": "Margaret Sullivan argues that Dolly Parton's ability to unite deeply divided Americans offers lessons for a fractured nation. Through self-deprecating humor, genuine generosity, and \"radical acceptance\" that never alienated any political group, Parton demonstrated that authenticity, humility, and heartfelt kindness can transcend partisan divisions.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/28/dolly-parton-america-divide", "state_media": false, "category": "オピニオン", "full_text": "The moment that the world found out that Dolly Parton had died, I was in a hair salon in the reddest congressional district in New York state. The neighborhood on the shore of Lake Erie where I move every summer voted solidly for Donald Trump in 2024.\nI often pass a lawn sign that has something misogynistic to say about New York’s Democratic governor, Kathy Hochul, and the mere mention of Kamala Harris’s name can bring derisive jokes. Of course, there certainly are liberals and independents to be found, but on balance the area leans right.\nOn my errands around town, I’ve heard scornful comments about transgender people, and the local Catholic church where I sometimes attend mass has a priest who, during a homily this summer, praised Trump for his war in Iran.\nA lot of the people I’ve chatted with around town are outspoken about being anti-vaccine.\nBut when cellphones started pinging with the news about Dolly, it’s not overstating things to say that everybody was devastated. Stylists and customers alike seemed to feel a personal connection – to her music, to her philanthropy, to her sheer goodness.\nHow did Dolly, a rags-to-riches country music superstar with a Tennessee twang and bedazzled everything, manage to endear herself to Americans of every political stripe?\nWhat was her secret – and does it hold some wisdom for the those who seek unity in this divided nation, who appreciate civility, who believe there’s an American ethos that transcends our ugly politics?\nSome of it, surely, was that she had a gift for poking fun at herself, and joining in the laughter, as when she would say she didn’t mind being called a dumb blonde because she knew, after all, that she wasn’t dumb – and that she wasn’t a blonde. After her illness made headlines last year, she took to social media to make a simple point: “I ain’t dead yet.” She called herself a “Backwoods Barbie” in a song of that name.\nThen there was her remarkable generosity. Her organization, Imagination Library, gave more than 330m books to children around the world. She founded it, in part, she said, because her father couldn’t read or write.\nShe never forgot where she came from, as she raised money for a new hospital in her home country in Tennessee, or offered $500 awards to local teenagers when they graduated from high school.\nStill, how did she manage not to alienate the Maga world when she promoted the Covid-19 vaccine (the research for which she had helped fund)?\nAgain, the humor helped, as when she changed the words of one of her most famous songs, Jolene to something that rhymed, and sang “vaccine, vaccine” in promotional videos. You had to smile, and maybe decide to get the jab, or at least to tolerate those who did. And she never made it political.\n“She practiced a unique brand of radical acceptance,” wrote Jad Abumrad in a New York Times essay this week. “No one would ever be thrown out of the Big Dolly Tent.”\nAnd, though she is being mourned as something of an angel on earth, she was a razor-sharp businessperson. She was smart and savvy about it all, as befitted the superstar who chalked up 25 No 1 country singles over the years.\nAs Abumrad learned while interviewing and observing her at length as he created the podcast Dolly Parton’s America, she always told her own story.\n“If a male talkshow host made a joke about her figure, she’d make an ever better joke about it. She was always two steps ahead of you. She never allowed herself to be a part of a story of which she was not the author.”\nCan what Dolly Parton did be bottled somehow? Can her serendipitous mixture of humor, humility and humanity be sprinkled over our troubled waters to calm and soothe them?\nProbably not – there is only one Dolly Parton – but that doesn’t mean we can’t learn something from this rare individual.\nThe rest of us might channel Dolly a bit more, and remember that a self-deprecating joke goes a long way toward easing tensions. We might recognize that financial success need not turn into ego glorification or arrogance.\nAnd most of all, we might keep in mind that genuine generosity – if it comes from the heart – has the power to transcend politics.\nDolly Parton’s legacy, of course, resides in her wonderful songs, from Coat of Many Colors to 9 to 5. That’s what she would want.\nBut I don’t think she’d object if we also kept in mind her authentic kindness, her disarming wit – and the “radical acceptance” that fueled it all.\n- \n  Margaret Sullivan is a Guardian US columnist writing on media, politics and culture", "translation_ja": "", "vocab": [{"word": "transcend", "definition": "超える、乗り越える。特に制限や分類を越えて、より高い次元に達することを意味する。例：政治的な対立を超えた関係性。"}, {"word": "endear", "definition": "好感を持たせる、愛される存在にする。人々の心に好意的な感情を生じさせる。例：その行動は彼を観客に好かれる存在にした。"}, {"word": "alienate", "definition": "疎遠にする、敵に回す。人の支持や好感を失わせること。例：過激な発言は多くの有権者を疎遠にした。"}, {"word": "serendipitous", "definition": "幸運な偶然による。予期しない幸運な出来事や組み合わせが起こること。例：その成功は幸運な偶然の産物だった。"}, {"word": "disarming", "definition": "警戒心を解く、相手を和らげる。敵意や疑いを減らす効果を持つ。例：その親切な笑顔は相手の警戒心を解いた。"}, {"word": "ethos", "definition": "特定の文化や集団に特有の価値観や信条。その集団の本質的な特性や道徳的性格。例：アメリカの民主主義的倫理観。"}]}, {"title_ja": "大規模な経済的再調整が到来する", "title_en": "A Great Rebalancing Is Coming", "summary_ja": "著者は、中国とドイツが大幅な黒字を計上し、米国が赤字を吸収する現在のグローバル貿易不均衡は根本的に持続不可能であり、最終的に崩壊すると主張しています。理想的な協調的調整とは異なり、主要経済国は原因と解決策について意見が一致していないため、危機の可能性が高まっています。歴史が示すように、このような不均衡は必ず苦痛をもたらし、調整の負担は各国の経済的脆弱性と政治的力に基づいて不均等に配分されます。", "summary_en": "The author argues that current global trade imbalances—with China and Germany running large surpluses while the US absorbs deficits—are fundamentally unsustainable and will eventually collapse. Unlike the coordinated adjustment that would be ideal, major economies disagree on causes and solutions, making a crisis likely. History shows such imbalances end painfully, with the burden of adjustment falling unevenly on different nations based on their economic vulnerabilities and political power.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/great-rebalancing-coming", "state_media": false, "category": "オピニオン", "full_text": "The trade imbalances that have come to characterize the global economy are fundamentally untenable. China, Germany, and a handful of other economies run large, persistent trade surpluses, while the United States absorbs much of these surpluses by running the world’s largest trade deficit. Sooner or later, something must give. For an advanced, capital-rich economy such as that of the United States, an enduring trade deficit will bring with it either rising unemployment or rising debt, neither of which is sustainable.\nIn theory, the major surplus and deficit economies could agree on a coordinated adjustment in which surplus countries would expand domestic demand and deficit countries would gradually reduce their dependence on debt-fueled consumption, allowing the imbalances to shrink without a sharp contraction in global demand. That would be the sensible solution.\nBut because the major players disagree about the causes of the imbalances, they are unlikely to come to such a solution. China attributes them to excessive U.S. consumption and fiscal deficits; the United States blames foreign industrial, trade, and currency policies; and Europe has yet to settle on a coherent diagnosis. As a result, they all have proposed remedies that are at odds with one another. Beijing wants deficit countries to save more and prefers not to change China’s growth model. Washington wants surplus countries to reduce their surpluses by redistributing income to the household sector. European leaders continue to advocate for multilateral cooperation and rules-based trade. This makes the chances of a coordinated response slim. And as the economic analyst Martin Wolf wrote in the Financial Times earlier this year, if there is little prospect of preemptive action, “the second-best option is to prepare for a crisis.”\nIndividual economies are now doing just that. History shows that trade imbalances of this scale almost always end painfully—and that the pain of the adjustment is not distributed evenly. High levels of debt combined with low productivity makes a country more likely to bear the burden of a trade adjustment, but economic and political power can also give it the tools to pass the burden off to others. Among the three main economic players today, China is the most vulnerable, the United States has the most capacity to reduce its exposure, and Europe possesses latent power but a dubious ability to use it. None of their maneuvers to protect themselves are likely to reduce the risk or overall cost of a crisis. The question is only who will feel the brunt of the losses when it arrives.\nHISTORY REPEATS ITSELF\nLarge, persistent trade imbalances have cropped up periodically over the past century, and they are rarely benign. One such episode occurred during the 1920s, when a surge in American productivity was not accompanied by rising wages. Production soared past consumption, and the United States ran enormous trade surpluses. Europe ran the corresponding deficits, as many countries borrowed heavily abroad to rebuild economies devastated by war. Germany in particular borrowed extensively to finance both domestic growth and its reparations payments. American domestic debt also rose rapidly, much of it to fund consumption and asset speculation.\nAs the imbalances persisted and U.S. manufacturing expanded at the expense of European manufacturing, protectionist pressures intensified. France devalued its currency in 1927, the United Kingdom abandoned the gold standard in 1931, and the same year Germany imposed import restrictions and rationed access to foreign currency. Even the United States, whose manufacturers and farmers complained that weak demand was threatening domestic production and employment, passed the Smoot-Hawley Tariff Act in 1930.\nThe adjustment came in the form of a collapse in global trade during the Great Depression of the early and mid-1930s. Nearly every major economy suffered from the contraction, but they did not suffer equally. Those with large deficits, such as the United Kingdom, recovered more quickly and suffered less severe financial distress than the United States, which absorbed a disproportionate share of the costs. American exports fell faster than imports, domestic investment imploded, banks failed, and bankruptcies surged.\n Trade imbalances on a large scale almost always end painfully.\nThe next major episode of persistent trade imbalances was the rare case in which the imbalances faded away without causing major disruption. During the 1950s and 1960s, the United States again ran very large surpluses while Europe and Japan ran corresponding deficits. Similar to the situation in the 1920s, these deficits financed the reconstruction of postwar economies as resources poured into infrastructure and manufacturing. But unlike in the earlier period, governments maintained strict controls over capital flows and imported capital mostly to fund investments that generated enough future income to service the associated", "translation_ja": "", "vocab": [{"word": "untenable", "definition": "支持不可能な、継続できない状態を意味します。経済や議論の文脈で、長期的には維持できない立場や状況を表すのに使われます。"}, {"word": "enduring", "definition": "長期間続く、永続的なという意味です。一時的ではなく、ずっと続く状態や問題を指します。"}, {"word": "fiscal", "definition": "政府の財政に関連する、という意味です。税金や支出、予算などの政府の金銭管理に関する経済用語です。"}, {"word": "preemptive", "definition": "先制的な、事前対応的なという意味です。問題が発生する前に事前に対策を講じることを表します。"}, {"word": "benign", "definition": "害のない、穏やかなという意味です。医学用語としても使われますが、ここでは経済的に悪影響を与えない状態を指します。"}, {"word": "protectionist", "definition": "保護主義的なという意味です。自国産業を保護するため、輸入品に対して関税や制限を課す政策や姿勢を表します。"}]}, {"title_ja": "ヨーロッパをヨーロッパ人に委ねよ", "title_en": "Leave Europe to the Europeans", "summary_ja": "著者は、トランプ政権によるヨーロッパでの米軍駐留削減計画がNATO内での負担分担の必要な転換を示していると主張している。米軍を大幅に撤退させることで、ヨーロッパは米国の支出と指導力への依存を続けるのではなく、独自の従来型防衛に責任を持つよう強制されると同時に、米国の財政過剰支出の緩和にも役立つだろう。", "summary_en": "The author argues that the Trump administration's plan to reduce U.S. military presence in Europe represents a necessary shift in burden-sharing within NATO. By substantially withdrawing American forces, Europe would be forced to take responsibility for its own conventional defense rather than continuing to rely on U.S. spending and leadership, while also helping address America's fiscal overextension.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/leave-europe-europeans", "state_media": false, "category": "オピニオン", "full_text": "In a 1987 New York Times advertisement, long before he became president, Donald Trump insisted that “America should stop paying to defend countries that can afford to defend themselves.” This has been a consistent theme of his foreign policy rhetoric since he first moved into the White House, and he has been especially focused on applying it to Europe.\nDuring his first term, Trump jolted European allies by threatening to withdraw the United States from NATO, arguing that its members were not spending enough on their own defense and were free-riding on American taxpayers. Ultimately, he did not make good on the threat. All his administration mustered was a late, failed effort in the summer of 2020 to remove 12,000 troops from Germany.\nThis time around, his administration has adopted burden shifting as a rallying cry and seems poised to act on it. Almost immediately after taking office, Secretary of Defense Pete Hegseth traveled to Brussels to inform his counterparts that the United States would have to focus on priorities other than Europe’s defense. Europe itself, he said, needed to “take ownership of conventional security on the continent.” Last month, to turn this vision into reality, the Pentagon launched its Europe Posture Review, which is intended to be a critical assessment of U.S. troop deployments and basing commitments on the continent. Announcing it at the NATO defense ministerial, Hegseth was clear: “Europe can and must take primary responsibility for its conventional defense.” Such an outcome would amount to a transformation in the transatlantic alliance.\nSince the founding of NATO after World War II, the United States has underwritten Europe’s defense and held the top military command position in the alliance. More than 75 years later, it still accounts for about 60 percent of NATO members’ military expenditures and stations some 80,000 troops on the continent and in the United Kingdom. Decades of American dominance have left Europe reliant on U.S. leadership, technology, and spending.\nIf the Trump administration is serious about shifting defense responsibilities to Europe, then the posture review offers a rare opportunity. A substantial reduction in the U.S. military presence in Europe over the next two years would force the continent to build forces it has so far left to the United States, while also putting Washington on sounder defense footing. The United States is $40 trillion in debt and adding roughly $2 trillion per year, with no prospect of major fiscal reforms. Despite this dire fiscal picture, it spends about $100 billion on Europe’s defense each year.\nThe problem is not new. Although U.S. administrations since Dwight Eisenhower have urged Europe to do more for its own defense, Europeans have consistently shirked their obligations. Even today, some European leaders hold out hope that if they can wait out Trump’s second term, NATO will return to “normal.” Only the withdrawal of U.S. forces will convince allies that the United States truly intends to turn over responsibility for the region’s conventional defense. Nothing else will force them to plan for a future in which Washington is no longer in the lead. Such a move will draw resistance from European leaders and the U.S. Congress. But a smaller footprint is vital to relieve U.S. overextension, and it can be done without harming American interests.\nA TEMPORARY SHIELD\nThe presence of U.S. military personnel in Europe in the late 1940s and early 1950s was supposed to be a temporary shield as Western European states rebuilt economies devastated by war. But the troops stayed long after that rebuilding was complete. At the height of the Cold War, the United States had more than 400,000 troops on the continent. When the Soviet Union collapsed, NATO lost its formal justification.\nFor Washington, the alliance became primarily about institutionalizing U.S. power and influence, and although the total number of U.S. forces stationed in Europe declined over time, it has never dropped below 60,000. With the Soviet threat gone, European governments were happy to capitalize on the “peace dividend” and expanded their social programs while gutting military spending. At the same time, the alliance took on new commitments, offering Moscow’s tiny, vulnerable neighbors promises of protection with little thought of what their defense would require. By 2014, when Russia annexed Crimea, Europe was deeply dependent for its security on the United States, which was already tied up in the Middle East and increasingly focused on China’s rising military power. That situation persists today.\nThe Pentagon last conducted a formal review of global U.S. military posture in 2021, in the first year of the Biden administration. It made a few modest recommendations, but its general conclusion was that the existing arrangement was just about right. In Asia, it advised seeking more places to operate from and pledged to harden U.S. bases there. But it did little to increase ", "translation_ja": "", "vocab": [{"word": "burden-shifting", "definition": "責任や負担を他者へ移行させること。政治・外交で、一国が担っていた責任を同盟国などに転換させる政策を指す。"}, {"word": "underwrite", "definition": "財政的に支援・保証すること。ここではアメリカがヨーロッパの防衛費を実質的に負担していることを表す。"}, {"word": "posture review", "definition": "軍事的な配置・展開戦略の全面的な検討。ペンタゴンが軍隊配置の妥当性を評価するプロセスを指す。"}, {"word": "transatlantic alliance", "definition": "大西洋を隔てた北米とヨーロッパ間の同盟関係。主にアメリカとヨーロッパ諸国間のNATOなどの協力体制を意味する。"}, {"word": "institutionalizing", "definition": "制度化する、組織化する。ここでは米国の権力と影響力を形式的な同盟構造として確立することを指す。"}, {"word": "overextension", "definition": "過度に拡大展開されている状態。軍事力や資源が広すぎる地域に分散されている状況を表す。"}, {"word": "fiscal", "definition": "政府予算や財政に関する。財政政策や政府支出に関連する事柄を表す形容詞。"}]}, {"title_ja": "インドはアメリカとの関係を維持している—当面は", "title_en": "India Is Sticking With America—for Now", "summary_ja": "トランプ大統領の関税やパキスタン宥和政策、中国との関係強化にもかかわらず、インドは「アメリカ・プラス戦略」を通じてアメリカとの戦略的パートナーシップを維持している。モディ首相は挑発に対して自制心を示しており、アメリカがインドの経済・安全保障上最も重要なパートナーであることを認識している。しかし、国内政治的圧力の高まりとアメリカの信頼性への懸念が、やがてニューデリーの方針転換を強要する可能性がある。", "summary_en": "Despite Trump's tariffs, threats toward Pakistan appeasement, and warming ties with China, India maintains its strategic partnership with the United States through what analysts call an \"America plus\" strategy. Prime Minister Modi demonstrates restraint despite provocations, recognizing that the U.S. remains India's most critical great-power partner for economic and security interests. However, rising domestic political pressure and perceived American unreliability could eventually force New Delhi to reassess its alignment.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/india/india-sticking-america-now", "state_media": false, "category": "オピニオン", "full_text": "President Donald Trump, in his second term, has severely tested the U.S.-Indian relationship. He has slapped tariffs on India, threatened to impose secondary sanctions, gotten considerably closer to Pakistan, and enthusiastically engaged with China—the country India considers its biggest long-term military threat. Yet these strains have not led to the rupture that some observers had predicted. Nor have they forced a fundamental reorientation of Indian foreign policy. Instead, New Delhi has adopted what might be called an “America plus” strategy, in which it seeks to sustain partnership with the United States while widening its engagement with other powers, namely U.S. allies.\nIndian Prime Minister Narendra Modi has responded with unusual restraint to Trump’s provocations and has resisted demands to pull away from Washington. With the United States, India has continued trade negotiations, increased defense cooperation, and expanded technological and commercial ties. In addition, he has sustained the Quad, a regional security organization that also includes Australia, Japan, and the United States; drawn closer to U.S. allies; preserved relations with Russia; and sought to lower tensions with China. These efforts do not represent a retreat from the United States or a strategy of multialignment. India is trying to reduce its exposure to American volatility, but it still recognizes that Washington is its most important partner.\nAfter all, when it comes to cultivating a great-power patron, India doesn’t have better options. China and Russia will never buy Indian goods and services on the scale that the United States does, nor can Russia help India balance China. These realities have protected the U.S.-Indian relationship so far. But if Trump continues to bully India, public opinion could force Modi to abandon his restrained approach.\nGROWING APART?\nThrough 2024, Modi and his ruling Bharatiya Janata Party were excited at the prospect of Trump’s return to power. Modi had established an unusually warm personal relationship with the president during the latter’s first term. In 2019 and 2020, they headlined rallies together in Houston and Ahmadabad, expanded bilateral cooperation on defense, and developed a common approach to Asian security.\nAt the start of Trump’s second term, it seemed the friendly personal relationship between the two leaders would continue. At a White House meeting in February 2025, they announced an ambitious agenda for trade, defense, energy, and technology. To signal goodwill, the Indian prime minister accommodated Trump by slashing some of India’s tariffs on U.S. products and accepting a planeload of deported immigrants.\nBut the relationship soon soured. Trump took credit in May 2025 for ending a brief military conflict between India and Pakistan. While the Pakistanis hailed Trump’s intervention, the Indians refused to acknowledge that the president had done anything of the sort, sticking to New Delhi’s standard position that its disputes with Islamabad are purely bilateral and do not require outside mediation. Trump then took a shine to Pakistan’s army chief, Syed Asim Munir, and elevated Pakistan in the White House’s diplomatic priorities by using Islamabad as a mediator in negotiations with Iran and blessing the trilateral security pact between Pakistan, Saudi Arabia, and Turkey.\n Modi has largely avoided confrontations with Trump.\nTrump also became friendlier with China, another Indian rival. In his first term, he sought to build stronger partnerships with Australia, India, Indonesia, and Japan to construct a new regional architecture in Asia to balance China. But in his second term, he has spent a significant amount of time engaging with Chinese leader Xi Jinping—even talking loosely of establishing a “G-2,” under which China and the United States would meet regularly to hash out global problems. Trump has also failed to hold the annual summits of the Quad, raising doubts that the United States is committed to that security partnership and to preventing Chinese dominance across Asia.\nTrade tensions have also inflamed U.S.-Indian relations. When Trump punished India with high tariffs for its protectionism and for buying Russian oil, many Indians felt that their country was being unduly singled out. Washington had carved out exceptions for itself and some European countries to buy Russian oil, and the Biden administration had even encouraged India to buy Russian oil under a price cap as part of a plan to stabilize the global oil market. By late 2025, India faced some of the highest tariffs of any U.S. partner.\nIt is for these reasons that Indian public opinion started to turn against Trump in 2025. The opposition leader Rahul Gandhi accused Modi of surrendering to American pressure. Long-standing skeptics of the United States argued that Washington had proved itself unreliable. Critics of Modi started mobilizing farmers against a U.S.-Indian trade deal by characterizing the careful opening ", "translation_ja": "", "vocab": [{"word": "rupture", "definition": "関係や協力の完全な決裂や断絶を意味する。外交的な関係が修復不可能なほどに損なわれた状態を表す。"}, {"word": "reorientation", "definition": "政策や戦略の方向性を大きく変えること。外交政策の根本的な転換を指す。"}, {"word": "multialignment", "definition": "複数の大国と同時に同盟関係を結ぶ戦略。特定の国に過度に依存しない外交姿勢を意味する。"}, {"word": "volatility", "definition": "政策や態度が予測不可能で急激に変わる不安定な状態。トランプ政権の一貫性のない対応を指す。"}, {"word": "bilateral", "definition": "二国間の関係や協議を意味する。一方的ではなく両国が対等に関わることを強調する。"}, {"word": "inflamed", "definition": "状況や対立を悪化させる、激化させることを意味する。紛争や緊張が高まった状態を表す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-29 03:02 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
