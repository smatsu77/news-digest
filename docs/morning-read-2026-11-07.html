s on Friday morning, with an unexpectedly strong 165,000 jobs added to the economy in September.\nOn Thursday, businesses closely linked to artificial intelligence development took a hammering on stock markets, particularly chip and semiconductor makers.\nBut the Nasdaq Composite bounced back slightly on Friday, ending the day up 1.1%, partly reversing some of its 5.5% fall.\nThe S&P 500, which tracks the share prices of the largest publicly-traded US companies, closed up 0.3%, while the Dow Jones Industrial Average was flat through the day before ending slightly down 0.4%.\nCompanies that lost hundreds of billions in market value recovered some ground on Friday, including Nvidia, SpaceX and Tesla.\nHowever, stock markets in Asia and Europe fared worse.\nThe Kospi in South Korea closed down 6% on Friday, with shares in chipmaker SK Hynix plunging more than 10%. European markets also fell, with the main indexes in Germany, France and Spain ending the day down.\nIn the UK, the FTSE 100, which tracks the largest companies on the London Stock Exchange, declined 1.01%.\nIn addition to the recent market volatility, UK traders were also digesting the latest Bank of England decision to raise interest rates and the signal that another rate rise could be on the cards to curb rising prices.\n'Market purgatory'\nThe market fluctuations also come after the sweeping Democrat victory in the midterm elections.\nA number of Democrats campaigned for new rules and regulations for artificial intelligence (AI) and data centres, and the party has since won control of both houses of congress as well as key contests in states that have been part of the AI data centre race.\nUS President Donald Trump on Friday reiterated his supported for what he calls \"super intelligence\", saying only \"foolish leadership\" would \"say no to the riches they bring\".\nHowever, there have also been concerns over whether the enormous amounts of money being spent on AI will pay off.\nRuss Shaw, founder of global tech advocacy firm Tech London Advocates, said the election result was sending a message that a rethink was needed on AI.\n\"The incoming Congress is going to really focus on AI in a very dramatic way,\" he told the BBC's Business Today.\n\"I'm a big fan of AI, but I'm watching what these companies are doing, and they're not communicating effectively at all, particularly in the US, about what the benefits of AI are all about.\"\nPierre Baqué, chief executive of AI platform Neural Concept, said the share movements were a \"necessary market correction\" that reflected a legitimate concern about the amount of money being poured into AI infrastructure.\n\"The industry must move beyond unchecked infrastructure investment and demonstrate greater financial discipline,\" he said.\n\"We are entering a critical transition phase, a market purgatory where raw tech must prove its widespread economic value.\"\nDan Coatsworth, head of markets at AJ Bell, said it had been a brutal week for markets, and the key question was whether the jump in the S&P 500 and Nasdaq would be sustained.\n\"Once investors have had the weekend to catch their breath, next week could give a clearer indication of whether the tech trade is going down the pan or fighting back.\"\n- Could the US midterms put a pin in the AI bubble? \n  - Published5 hours ago\n- Elon Musk appears to signal the end of the road for Cybertruck \n  - Published2 hours ago\nStrong jobs figures could ease market fears\nAs well as the fallout of the midterms and the plunge in artificial intelligence stocks, US traders will also be digesting the latest jobs figures.\nAnd those numbers were better than expected: US employers added 165,000 new jobs in October, well above the average monthly increase and more than double what analysts had expected.\nOverall the unemployment rate, which counts the number of people who are out of work but actively looking for a job, eased slightly to 4.1% from 4.2% in September.\nThe Bureau of Labor Statistics (BLS) said the unemployment rate has remained in the narrow range of 4.1% to 4.3% since March.\nNeil Birrell, chief investment officer at investment firm Premier Miton, said while the jobs figures may feel like second billing to the market movements they were still important.\n\"The US economy is running hard which may mean the risks the markets are worrying about at the moment", "translation_ja": "", "vocab": []}, {"title_ja": "2028年ホワイトハウス選挙戦に向けた中間選挙の4つの教訓", "title_en": "Four midterms takeaways for 2028 White House race", "summary_ja": "米国の中間選挙でデモクラット党が大幅な議席獲得を果たし、2028年のホワイトハウス選挙戦へ向けた政治情勢が変わりつつある。ジョン・オソフ上院議員やジョシュ・シャピロ州知事らの民主党の有力候補者たちが中間選挙で好成績を上げ、大統領選への立候補に向けた機運が高まっている。一方、共和党側ではJDバンス副大統領が党の敗因を振り返り、2028年の大統領選出馬に向けた動きを見せている。", "summary_en": "The buzz about the presidential election is already under way - here's what we learned this week.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq1m41n3v7mmo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Four midterms takeaways for 2028 White House race\n- Published\nBallots are still being counted in the US midterm elections but the political landscape is already pivoting to the 2028 White House race.\nBuoyed by major gains in Congress, Democrats will have momentum as they prepare for the contest to succeed President Donald Trump.\nBut a good showing in the midterms does not guarantee a White House win two years later. Barack Obama was re-elected in 2012 despite huge Republican gains in 2010.\nNo one has yet entered the presidential race but potential candidates will be preparing behind the scenes.\nVice-President's JD Vance's reflection on where the midterms went wrong for Republicans has been interpreted as him paving the way for a 2028 run.\nThe results of Tuesday's election and the historic size of Democratic gains could shape the White House race in several ways. Here are four takeaways.\n1. Big winners in the midterms now have momentum\nSeveral prominent potential presidential candidates were running in the 2026 midterms - and some emerged looking strong.\nGeorgia Democratic Senator Jon Ossoff won by a sizeable margin in the politically competitive state that Trump won in 2024.\nWhile he has previously said he has no plans to run for president, his successful campaign, with several viral moments, helped boost his national profile.\nAnother potential Democratic nominee, Pennsylvania Governor Josh Shapiro, swept aside his Republican challenger.\nShapiro has not committed to a 2028 run but analysts point to his broad appeal in swing-state Pennsylvania as a sign that he could be competitive on the national stage.\nIllinois Governor JB Pritzker also won after a campaign pundits in his state described as a \"tune-up\" for a presidential run.\nCalifornia Governor Gavin Newsom could not run for re-election in the midterms but he is invested in the outcome of a ballot initiative to tax the state's wealthy residents which he campaigned against.\nOn the Republican side, there were two potential 2028 names running in Arkansas.\nRepublican Senator Tom Cotton and Governor Sarah Huckabee Sanders - a one-time Trump administration press secretary - were able to stay in office by a narrower margin than before, both earning just above half of the votes in the conservative state.\n- Trump names Stephen Miller as new chief of staff \n  - Published4 hours ago\n- What Democrats can and can't do with their new power after taking Congress \n  - Published2 days ago\n2. JD Vance and Trump's allies under pressure\nExit polls suggest the swing against Republicans was partly due to anger felt by voters at the actions of the Trump administration.\nThat could present a challenge to his potential successors who come from the ranks of the current leadership, including Vice-President JD Vance and Secretary of State Marco Rubio.\n\"The one person who has been hurt badly by this election campaign is Vance,\" said Karen Beckwith, a professor of political science at Case Western Reserve University in Ohio.\nVance has already sought to distance himself from defeat - and from a foreign policy adventure in Iran that was politically disastrous for his party.\n\"The reason we lost is the war,\" he wrote on X.\nRubio has denied reports he is considering leaving his post ahead of a 2028 presidential run.\nOther possible Republican candidates may benefit from not being part of the administration. Some have been staking out a position on what went wrong and what next.\nIn a lengthy post on X, Senator Ted Cruz, who was not running this year, said that too many Republican politicians seem like \"they didn't care\" about the economic issues faced by voters.\n\"It is dark right now, but it is always darkest before the dawn, and morning is coming,\" he wrote. \"That is my fervent prayer, and that is my commitment to you.\"\nFlorida Governor Ron DeSantis, who abandoned his 2024 presidential run after being trounced by Trump early on, was similarly critical and pointed to Republican victories in Florida as a sign of what can be accomplished.\n3. Left and centre Democrats in fight for future\nBoth the centrist and left wings of the Democratic Party have claimed victory from the results as each side sifts through possible 2028 contenders.\nDozens are already making moves, Obama's former adviser Jim Messina has told the BBC.\nEl-Sayed's win in Michigan was a breakthrough moment for left-wing Democrats because he triumphed in a swing state.\nHis supporters now claim his win could supercharge left-wing candidates in the 2028 election.\n\"The old notions of electability are out the door, and bold economist populist outsiders proved they can win in battleground states,\" said Adam Green, the co-founder of the Progressive Change Campaign Committee.\nGreen added that the \"water is now warm\" for candidates such as New York Democratic representative Alexandria Ocasio-Cortez to run in presidential primaries and \"know that they can win.\"\nModerate Democrats, however, claimed victories across the country, with the \"Blue ", "translation_ja": "", "vocab": []}, {"title_ja": "フランス東部でバス事故、2人死亡", "title_en": "Two dead after bus crashes in France, officials say", "summary_ja": "フランス東部のラン町で、リヨンとブール=アン=ブレス間を走行していたバスが木に衝突する事故が発生し、少女と18歳の男性が死亡しました。バスには43人の乗客が乗っており、うち15人が子どもでした。3人が重篤な状態で、少なくとも13人が軽傷を負っており、検察は過失致死罪での捜査を開始しています。", "summary_en": "One child and one young adult were killed in the crash, local authorities say, with more injured.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmly00l4p3lwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Two dead after bus crashes in France, officials say\n- Published\nA young girl and an 18-year-old man have died after a bus crashed in eastern France, local authorities have said.\nThe bus was travelling between Lyon and Bourg-en-Bresse when it crashed at around 07:00 local time on Friday in the town of Lent.\nThe bus was carrying 43 passengers, including 15 children, the Bourg-en-Bresse prosecutor's office said. Three people are in a critical condition and at least 13 others have sustained minor injuries.\nFrench President Emmanuel Macron said his thoughts were with the victims, the injured, and their families.\nIn a post on X, he said the nation stood by their side and thanked the rescue teams involved.\nThe town's mayor Yves Cristin told French media the bus \"left the road and hit a tree in the ditch\".\nThe two people killed have been identified by authorities. However, there have been differing reports as to the age of the girl.\nThe prosecutor's office said it was \"opening an investigation into the incident, on charges of road homicide and aggravated road traffic injuries\".\nThe driver has been taken to hospital after sustaining injuries and has not yet been questioned by police. French Transport Minister Philippe Tabarot said initial tests indicated there were no traces of alcohol or drugs in his blood.\nPhotos circulating in French media show a blue and white bus tilted in what appears to be a ditch on the roadside. Trees line the side of the road. The front of the bus appears to be heavily damaged.\nLocal mayor Cristin told BFM TV: \"I arrived minutes after the accident and people were in shock.\n\"The side of the bus was torn off, and clearly, the people who were on that side must have been seriously injured.\"\nAddressing weather conditions at the time of the crash, the mayor told Le Figaro \"there was a bit of fog, the road was wet\" but there were \"no major difficulties\".\nSpeaking to the same paper, Fabrice Pannekoucke, head of the Auvergne-Rhône-Alpes region, said: \"At this stage, there are no particular explanations or interpretations that can be given.\"\nTabarot said the bus did not operate \"exclusively on school routes\" but that there were \"many schoolchildren on board\".\nFrench Prime Minister Sébastien Lecornu said the accident was tragic, and thanked the firefighters, medical teams and police who attended the scene.\nEarlier, French Education Minister Édouard Geffray said it was \"always difficult when our children are victims of accidents of this nature\".\nEmergency services were at the scene and medical helicopters were deployed to take victims with serious injuries to a specialised hospital.\nMore than 100 firefighters and 50 gendarmes were also at the scene.\nThe local town hall was opened to provide shelter and coordinate with emergency services, the local mayor said.\nRelated topics\n  - Published1 day ago", "translation_ja": "", "vocab": []}, {"title_ja": "ラッセル・ブランドへのさらなる告発が出る可能性も、ロンドン警視庁トップが言及", "title_en": "Met Police boss 'wouldn't be surprised' if more allegations made about Brand", "summary_ja": "ラッセル・ブランドがレイプ罪1件と性的暴行罪3件で有罪判決を受けたことを受け、ロンドン警視庁のマーク・ローリー長官は、さらに多くの被害者が名乗り出る可能性があると述べました。ローリー長官は、ブランドに対する2件の継続中のレイプ捜査があることを明かし、勇敢に証言した女性たちを称賛しました。同長官は、セレブリティに関わる事件だけでなく、大多数の性的虐待は権力濫用に関連していると強調しました。", "summary_en": "Sir Mark Rowley tells the BBC that what he heard reported from Brand's trial came close to \"victim blaming\".", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmly00r44jgvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Met Police boss 'wouldn't be surprised' if more allegations made about Brand\n- Published\nThe head of the Metropolitan Police said he \"wouldn't be surprised\" if more people came forward to make allegations about entertainer and comedian Russell Brand.\nOn Thursday, Brand was found guilty of one count of rape and three counts of sexual assault.\nMet Police boss Sir Mark Rowley also told BBC Radio 4's Today programme on Friday that what he heard reported from Brand's trial at Southwark Crown Court came very close to \"victim blaming\".\nBrand was acquitted of two other rape charges and one allegation of attempted indecent assault. The 51-year-old will be sentenced on Monday.\nSpeaking to the BBC, Sir Mark said that he \"wouldn't be surprised if more people came forward\" about Brand and said there were \"two ongoing rape investigations\" into him.\nBrand has already been interviewed under caution in relation to those allegations.\nSir Mark praised the bravery of the women who came forward to tell their story to the police and during the trial.\n\"That's a real challenge for anyone having gone through something so ghastly and you have to admire them.\"\nThe head of the Met also said that whilst Brand's case \"may look different because it's about celebrity, the majority of sex offending is about people abusing power\", adding that victims will be believed.\n\"We will do everything we can to bring to justice the powerful person who is responsible for probably the most ghastly moment in your life,\" he said.\n- How 2000s lad culture helped Russell Brand to hide in plain sight \n  - Published12 hours ago\n- Burnham says he was not aware of Brand's 'horrific' crimes \n  - Published8 hours ago\n- Watch: Met Police releases Brand interview footage \n  - Published1 day ago\nPrime Minister Andy Burnham has also spoken about the case, seeking to explain the Labour Party's previous association with Brand, saying \"it's not always the case that people know everything about people in public life\".\nSome within the party attempted to court Brand's support more than a decade ago, before police began investigating him.\nEd Miliband, then the Labour leader, was interviewed by Brand in the run-up to the 2015 general election.\nNow foreign secretary, Miliband has since said he regrets the interview. The BBC has approached Miliband for comment.\nIn 2014, Burnham, then the shadow health secretary, posted in support of Brand on Twitter following allegations about the comedian's housing arrangements.\nIt is not clear what Burnham had been referring to in his tweet, but the previous day, The Sun claimed Brand had paid rent at a property owned by a landlord in a tax haven, while at the same time campaigning against tax avoidance.\nBrand threatened to sue the newspaper and said he would give the money to victims of the Hillsborough disaster, a group Burnham has long campaigned with.\nIn his 2014 tweet, Burnham said it was \"depressing to see media mission to discredit someone who stops playing their game\" and urged Brand to \"keep going\".\nSpeaking on Friday, Burnham told the BBC: \"His crimes are horrific\".\n\"All I can say is I had no idea of the full extent of what he was doing or what he went on to do.\"\nIt was put to Sir Mark during an interview with BBC Radio 4's Today programme that Brand's defence barrister \"told jurors none of the complainants had in his words 'resisted, screamed or even tried to leave'\".\nSir Mark said that what he heard reported from the trial was \"very close to victim blaming\".\nAsked whether he would support the Victim's Commissioner's call for a legal duty in the Courts and Tribunals Bill that would require judges to direct juries on rape myths and misconceptions in every rape trial.\nHe said he would \"strongly support\" such a decision, adding: \"It shouldn't be possible for inaccurate statements to be made to a jury to suggest that because a rape victim didn't behave in one way that somehow undermines their case.\"\nBrand was refused bail following his conviction on Thursday and will now spend the weekend in custody before a return to court on Monday for sentencing.\nHe is expected to face a substantial prison sentence.\nOnce the trial was over, it was reported that Brand is also facing further rape allegations made by two women and has already been questioned by officers in relation to the complaints. The Metropolitan Police said its investigation \"remains ongoing\".\nDetails in legal documents from a hearing at London's Southwark Crown Court before Brand's criminal trial began suggest that one of the women was 16 years old at the time and featured in a Channel 4 documentary.\nThe actor and comedian denied the allegations.\nNone of the women who featured in the media investigation were the complainants from Brand's criminal trial.\nDuring a pre-trial hearing in October, Brand tried unsuccessfully to have his criminal case thrown out.\nHis lawyers argued that the actor and entertainer could not receive a fair trial because of the publicity following the Dispat", "translation_ja": "", "vocab": []}, {"title_ja": "ラッセル・ブランド事件の弁護士、記者との対立後に規制当局に自己報告", "title_en": "Brand's barrister refers himself to regulator after report he confronted journalist", "summary_ja": "ラッセル・ブランド被告の弁護人であるイアン・ウィンター弁護士は、2023年の調査報道に携わったサンデー・タイムズ記者との対立が報道された後、法曹規制委員会に自己報告した。記者は法廷での評決後にウィンター弁護士と対面した際、彼が不適切な言葉を使って応じたと主張している。ウィンター弁護士は、報道の内容を踏まえ、専門的職務として規制当局の調査を受けるべきと判断し報告した。", "summary_en": "Ian Winter allegedly confronted a reporter outside court who had investigated the comedian.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8kgee9yxvn7o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Brand's barrister refers himself to regulator after report he confronted journalist\n- Published\nRussell Brand's defence barrister has referred himself to the regulator after reports that he confronted a Sunday Times journalist who was involved in a media investigation into Brand in 2023.\nIn a Times and Sunday Times podcast on Thursday, Rosamund Urwin said she introduced herself to Ian Winter KC outside court after verdicts were delivered.\nShe claimed he responded with a \"snarl\" and said \"I hope you're pleased with yourself\".\n\"Apparently I said, but I can't actually remember this but I've read it in reporting, 'I am pleased that justice has been done'\", Urwin said.\nShe said that Winter replied \"it wasn't\" and suggested she was to blame using a profanity.\nIn a statement, Winter said the \"ways matters have been characterised\" in the media meant they should be \"subject to proper scrutiny\".\nOn Friday, Winter said he considered his professional duty required him to self-report the allegations to the Bar Standards Board.\nThe Bar Standards Board regulates barristers in England and Wales in the public interest.\nIn a statement, Winter said: \"Having seen the ways matters have been characterised in today's press I consider my professional duty requires me to self-report those allegations to the Bar Standards Board, so the matter can be subject to proper scrutiny. I have made such a report.\"\nFour women variously accused Brand of rape, sexual assaults and emotional abuse in a joint investigation by Channel 4 Dispatches and the Times and Sunday Times in September 2023.\nThe actor and comedian denied the allegations.\nOn Thursday, he was found guilty of one count of rape and three counts of sexual assault following a four-week trial.\nNone of the women who featured in the media investigation were the complainants from Brand's criminal trial.\nDuring a pre-trial hearing in October, Brand tried unsuccessfully to have his criminal case thrown out.\nHis lawyers argued that the actor and entertainer could not receive a fair trial because of the publicity following the Channel 4 Dispatches, Sunday Times and Times programme.\nProsecutors opposed Brand's application to have his case stopped.\nBrand is also being investigated over two more rape allegations made by two other women.\nCourt documents from a hearing at London's Southwark Crown Court, held before Brand's criminal trial, suggest one of the women was 16 at the time of the alleged offence and appeared in a Channel 4 documentary. Brand has denied the allegations.\nOn Friday, Metropolitan Police Commissioner Sir Mark Rowley said he \"wouldn't be surprised\" if more people came forward to make allegations against Brand.\nSpeaking on BBC Radio 4's Today programme, Sir Mark praised the \"bravery\" of the women who reported their allegations to police and gave evidence during the trial.\nHe said police would \"do everything we can to bring to justice the powerful people who are responsible for probably the most ghastly moment in your life\" when sexual assault allegations are made to them.\nPrime Minister Andy Burnham has been asked about Labour's past association with Brand.\nSome party figures sought his support more than a decade ago, before police began investigating him.\nAt the time, Brand had gained a following for his left-wing political punditry.\nThen Labour leader Ed Miliband was interviewed by Brand shortly before the 2015 election, and in 2014 Burnham publicly backed Brand during a row over claims about the comedian's housing arrangements.\nAt the time he said it was \"depressing to see media mission to discredit someone who stops playing their game\" and urged Brand to \"keep going\".\nSpeaking on Friday, Burham said: \"It's not always the case that people know everything about people in public life.\"\nHe described Brand's crimes as \"horrific\" and said he had been rightly held to account, adding: \"I had no idea of the full extent of what he was doing.\"\nBrand is being held in custody ahead of his sentencing on Monday.\nAfter the jury returned its verdicts, Mr Justice Bennathan told him to expect a \"significant custodial term\".\nRelated topics\n  - Published11 hours ago\n  - Published8 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "グロスターの学校封鎖：少年が剣で負傷、2人の容疑者を逃亡中", "title_en": "Manhunt after boy injured by sword, sparking Gloucester school lockdowns", "summary_ja": "グロスターのセント・ピーターズ・ハイスクール近くで、剣を持った男が関わる事件により17歳の少年が軽傷を負いました。警察は2人の容疑者を追跡中で、学校は安全のため封鎖されました。1人の女性が逃亡幇助の容疑で逮捕されており、警察は依然として2人の男性容疑者の行方を探しています。", "summary_en": "Two schools went into lockdown following the incident and one woman has been arrested.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6ly3343yj5po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Manhunt after boy's sword injury sparked lockdowns\n- Published\nPolice are hunting for two suspects, one of whom is believed to have been carrying a sword, following an altercation that left a teenager injured.\nArmed police were called to the incident near St Peter's High School in Gloucester earlier. The school and Willow Primary Academy were put into lockdown while officers searched for the group who had fled the scene.\nA woman has been arrested on suspicion of assisting an offender and remains in custody, but officers are still hunting for the two men who were reportedly chasing two boys.\nOfficers remain outside both schools, but all pupils have now been sent home.\nA 17-year-old boy sustained a superficial wound believed to have been caused by the sword, said police. Police initially said he was taken to hospital, however this was not correct.\nAnother victim, also 17, was not injured.\nPolice described both suspects as white males. One is aged in his late teens to early 20s, of a medium to large build, and about 6ft tall. He was wearing white sliders at the time of the incident.\nThe other suspect is described as being about 5ft 5ins tall, of slim build and wearing black clothing.\nSt Peter's High School pupil Jimmy said the situation was \"really scary\" and he was still in shock.\nAfter getting into the Tuffley school for the day, he said his friends came in and told him something had happened near his home.\nHe said the school's alarm then went off and the computer he was on displayed a message saying \"This is a lockdown\".\n\"The computers are not accessible at all and we've all had to turn the lights off, lock the doors, turn all the blinds down, and we've had to get on the ground,\" he said.\n\"At the time I was scared. My heart was racing,\" he added.\nJimmy said pupils were locked in their classrooms for two to three hours.\n\"[When police cars arrived] I thought this is getting serious, I'm getting worried, I don't know what's going on,\" he said.\nThe 15-year-old said he was able to message his mother when the school let students use their phones after about an hour.\n\"When I was able to eventually get out, she was giving me a bunch of hugs,\" he said.\n\"What I am is shocked. I'm surprised that this happened,\" he added.\nJimmy said the school had previously run lockdown drills but a real event had never happened before.\nAdam, whose daughter attends the same school, said he felt frightened even though he had texted her and knew she was OK.\n\"I don't think this should happen at school. Thank God she is safe,\" he said.\nThe school had messaged parents to say everything was under control, he added.\nAnother parent outside the school gates earlier, whose daughter is in Year 8 and nephew is in Year 7, said the family was \"so worried\".\n\"I'm slightly calmer now the police have told us they're safe but I want to take them home.\n\"I haven't heard from them because they aren't allowed phones in school,\" she added.\nAddressing parents outside St Peter's High School, an officer said a police presence would remain at the site for the rest of the school day.\n\"That is not there for a safety reason, it is to provide reassurance to yourselves and answer any questions. It is not because there is any risk or threat to anyone,\" she said.\n'Extremely troubling'\nDet Insp Sophie Dawkins, from Gloucestershire Police, said she understood the concern \"this incident would have caused, especially when it happened near a school at drop off time\".\n\"We've had armed officers searching the area, along with support from our drone unit and the National Police Air Service, and work is ongoing to identify and locate those involved,\" she added.\nDawkins said \"numerous\" inquiries had been taking place.\n\"We are now keen to hear from anyone who has not already spoken to police who witnessed what happened or who has dashcam or any other footage,\" she added.\nDelroy Ellis, youth mentor and the service director of city charity Increase The Peace, said it had been a \"really sad\" day.\nHe added that the school had previously held lockdown drills as a precaution to prepare staff and students for emergency events like this, but stressed that the school was \"safe\".\n\"It's shocking for [crime] to be on our doorsteps,” he said.\n\"To have a lockdown... the trauma and impact and ripple effect that's going to have on all students, but especially for staff as well.”\n'Stand together'\nAlex McIntyre, Gloucester's MP, said his thoughts are with \"the young person who was injured and their family\".\n\"I have also been in contact with the Department for Education who stand ready to provide any support necessary to St Peter's,\" added McIntyre.\nLorraine Campbell, an independent councillor who represents the Tuffley area, said although police stressed there was no ongoing risk, the incident was still \"very concerning\" and there was \"a great deal of uncertainty\".\n\"There is always a big shock when we hear of something happening very literally on our doorsteps, it's of great concern. Hopefully it g", "translation_ja": "", "vocab": []}, {"title_ja": "パラグアイ上院、銀行危機でサンティアゴ・ペーニャ大統領を解任", "title_en": "Paraguay Senate dismisses President Santiago Pena over bank crisis", "summary_ja": "パラグアイ上院は11月7日、数百万人が預金にアクセスできなくなった銀行危機に関連して、サンティアゴ・ペーニャ大統領を職務行為不当の罪で弾劾・有罪判決した。ペーニャはすでに前日に辞任していたが、弾劾により終身上院議席と元大統領の免責特権を失い、起訴される危険にさらされている。副大統領ペドロ・アリアーナが後任となり、2028年8月までの任期の残りを務める。", "summary_en": "Paraguay’s Senate has ousted President Santiago Pena over the collapse of a major bank tied to his government. Millions of customers' accounts are frozen, with public pension and health care funds also tied up.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/paraguay-senate-dismisses-president-santiago-pena-over-bank-crisis/a-79868484?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Paraguay Senate dismisses President Santiago Pena over bank crisis\nNovember 7, 2026\nParaguay's Senate on Friday impeached President Santiago Pena over a banking crisis that left millions of people unable to access their deposits.\nSenators voted overwhelmingly to remove Pena for misconduct in office.\nThe move cleared the way for Vice President Pedro Alliana to succeed him. He will serve the rest of the presidential term, which ends in August 2028.\nPena had already resigned on Thursday, but by impeaching and convicting him instead of accepting his resignation, senators stripped him of the lifetime Senate seat and immunity granted to former presidents, leaving him vulnerable to prosecution.\nFollowing the Senate vote, prosecutors ordered the arrest of the ousted president alongside former central bank chief Carlos Carvallo as part of a criminal investigation.\nOfficials later said Pena was placed under house arrest pending a decision by the public prosecutor's office on the final charges against him.\nDozens of protesters gathered outside his residence in the capital Asuncion, while police maintained a security cordon around the property.\nWhy did Pena face impeachment?\nPena's rapid downfall came amid mounting pressure over the collapse of digital lender Ueno, one of the country's biggest banks, with which he had ties.\nThe bank's accounts — also used to process pension payments — are frozen, leaving millions of customers unable to access their money. Ueno also held hundreds of millions of dollars in public funds.\nPena's resignation on Thursday followed the withdrawal of support by Congress President Basilio Nunez and ruling conservative Colorado Party leader Horacio Cartes.\nThirty-five opposition lawmakers and ruling-party dissidents had submitted impeachment articles in the 80-seat Chamber of Deputies, accusing Pena of conflicts of interest, misuse of pension funds and institutional cover-ups linked to Ueno.\nPena sold his shares in Ueno Holding, whose businesses include the bank, in April 2025. Lawmakers also cited two loans he received from Ueno as part of allegations of improper financial gain.\nThey alleged improper presidential interference in the Social Security Institute, known as IPS, and preferential treatment for Ueno. IPS manages pension and health care funds for most Paraguayan workers and held $355 million at the bank — about 9% of its investments, according to financial manager Gladys Vera.\nThe motion also questioned Pena's 2023 appointment of central bank chief Carvallo, who previously chaired Financiera Ueno. According to the document, the central bank approved the company's conversion into a bank just 83 days after his appointment.\nWhat happened to Ueno Bank?\nUeno served about 2.94 million customers, roughly 60% of Paraguay's adult population.\nAs of last month, the bank said it held roughly $800 million in public-sector deposits — about a quarter of its total deposits — including money from the operators of Paraguay's giant hydroelectric dams.\nParaguay's central bank ordered a resolution or closure process Tuesday after finding that Ueno's solvency ratio had fallen below half the required minimum.\nUeno's app, card payments and transfers stopped working, while branches closed, leaving customers queuing outside unable to withdraw their savings.\nHundreds of employees of Ueno and other companies in its parent conglomerate protested outside the Labor Ministry Thursday, demanding unpaid wages and severance.\nRetirees, depositors, students and workers had marched through Asuncion a day earlier, demanding Pena's impeachment and holding signs saying \"Give us back our money.\"\nWhat have authorities done?\nAuthorities detained eight senior executives, including founder Miguel Vazquez and bank president Juan Manuel Gustale. Prosecutors also charged 27 bank officials and business associates with offenses including breach of trust and attempted fraud.\nLawyers for several detainees said they needed time to review the allegations before commenting.\nPena had sought to reassure customers in a video message Wednesday, pledging legislation \"that will return to every saver what they are entitled to as quickly as possible.\"\nThe crisis also forced him to cancel his attendance at the Ibero-American summit in Madrid.\nPena, a conservative economist, took office in August 2023 for a five-year term.\nEditor's Note: This piece, originally published on November 5, was updated on November 7 to reflect the latest developments.", "translation_ja": "", "vocab": []}, {"title_ja": "教皇レオ14世、南米ツアー開始でウルグアイに到着", "title_en": "Pope Leo arrives in Uruguay at start of South America tour", "summary_ja": "教皇レオ14世は肺がん手術からわずか数週間後の11月6日、ウルグアイに到着し、3つの南米諸国を巡る12日間の疲労困憊するツアーを開始しました。71歳の教皇は到着時にモンテビデオの広場で約3万人の群衆を前に演説し、法の尊重と交渉の重要性について語りました。ウルグアイは世俗的な国として知られていますが、教皇の訪問チケットは2日間で売り切れるなど、予想外の熱狂を見せています。", "summary_en": "Pope Leo has arrived in Uruguay at the start of a 12-day trip through three South American nations. His trip, which is intense with a packed itinerary, comes just weeks after his lung cancer surgery.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/pope-leo-arrives-in-uruguay-at-start-of-south-america-tour/a-79872584?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Pope Leo arrives in Uruguay at start of South America tour\nNovember 6, 2026\nPope Leo XIV arrived in Uruguay on Friday at the start of a grueling 12-day tour through three South American countries, just weeks after his lung cancer surgery.\nThe 71-year-old pontiff told reporters he was very happy to be in Uruguay, having flown a nearly 14-hour flight from Rome to get to Montevideo.\n\"I confess that from the first day, I had no doubt and was convinced that this trip had to go forward,\" he told reporters aboard the papal plane.\nLeo hit the ground running on arrival, drawing huge crowds in Montevideo as he pulled into town in his open-sided popemobile.\nThe Vatican estimated 30,000 people had turned out to watch him go by and attend his first event in a country that is largely secular and where membership in the Church is declining.\n\"In an age when differences can easily become a source of conflict, persevering in respect for the law, negotiation and the patient search for agreements is a service that Uruguay can continue to offer its neighbors,\" Leo told crowds in Montevideo's main square.\nUruguayan President Yamandu Orsi, leader of the center-left alliance, was present there too.\nLeo is then planning to visit the Casavalle neighborhood, which is notorious for its high rates of poverty and violence.\nWith starting in Uruguay, Leo marks the first papal visit to the country in nearly four decades, with Pope John Paul II having last visited in 1988.\nWhat to know about Pope Leo's taxing itinerary\nThe pontiff will spend three days in Uruguay before heading on to Argentina on Sunday.\nHe then travels to Peru, where he spent half his priestly life, before he was elected pontiff last year. He became a naturalized Peruvian citizen in 2015.\nLatin America is home to around 40% of the world's 1.4 billion Catholics, for whom the pope is their spiritual leader. However, fewer and fewer people on the continent identify as Catholic.\nEnthusiasm around Leo's visit a surprise in Uruguay\nUruguay, the most secular Latin American country, was the first country in the world to legalize recreational marijuana use and has since legalized abortion, same-sex marriage and assisted dying, all against opposition from the Catholic Church.\nHowever, the enthusiasm around Leo's visit has come as a bit of a surprise, with tickets for his prayer vigil at Montevideo's Centenario Stadium selling out in just two days.\nWhat will Pope Leo do in Argentina?\nOn Sunday, Leo will cross over to neighboring Argentina, the home of his papal predecessor Francis, who, however, disappointed his native compatriots by never returning home as pope.\nAt the beginning of Francis's papacy, some 71% of Argentinians identified as Catholic, according to the Pew Research Center. By 2024, this had fallen to 58%.\nLeo is set to meet with Argentinian President Javier Milei, who has come under criticism from the Catholic Church for his sweeping cuts that have hampered programs for the poor and needy.\nHe is also planning to meet with business leaders, trade unions, workers and social representatives.\nPope Leo to return to Peru for last leg of trip\nThe final leg of the trip, on Wednesday, will see Leo return to Peru, where he lived and preached for two decades.\nThere is excitement about his visit to Peru, with the pope planning to celebrate Mass in his old diocese of Chiclayo as well as in the mountain village of Santa Cruz de Succhabamba.\nThe pope will also celebrate Mass in the former Incan capital city of Cusco before honoring Peru's indigenous population by traveling to Pucallpa in the Peruvian Amazon.\nThe excitement can be seen in the street vendors selling T-shirts and rosaries with his likeness, while bakeries have been selling Leo bread.\nPeru has also seen a weakening of the faithful in recent years, with the Catholic population falling from 76% in 2013-2014 to around 67% now.", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア産ディーゼルを運ぶタンカーが進路を変更、米国向けから他国へ", "title_en": "Tankers carrying Russian diesel to the US change course", "summary_ja": "米国東海岸に向かっていたロシア産ディーゼルを運ぶ複数のタンカーが、ブラジルと地中海方面へ進路を変更したと報告されています。トランプ大統領がロシアへの制裁を緩和して大量のディーゼルを米国に供給することで合意したものの、ロシア側は報告を「偽情報」と否定しており、当局や州知事は違法な取引への警告を発しています。", "summary_en": "Despite an ostensible deal between Donald Trump and Vladimir Putin to bring diesel to the US, tankers are reportedly unable to dock due to existing sanctions.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/tankers-carrying-russian-diesel-to-the-us-change-course/a-79870807?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Tankers carrying Russian diesel to the US change course\nNovember 6, 2026\nSeveral sanctioned tankers headed for the US carrying Russian diesel are said to have changed course, one toward Brazil and the other into the Mediterranean, according to data from marine data company Kpler and vessel traffic site MarineTraffic.com.\nThe tankers reportedly departed from the Baltic Sea port of Primorsk last month and had declared their destinations as the US east coast.\nThis all comes after US President Donald Trump eased sanctions on Russian oil last month, in a deal with with Russian leader Vladimir Putin to secure a large amount of diesel directly to the US at a time when diesel prices have skyrocketed across the country.\nThe agreement caused shock and drew criticism in Ukraine and Europe. But it also was a logistical challenge, given that sanctions against Russia still remain in place.\nIt was also widely reported at the time that the amount of diesel in question was a fraction of the US daily demand.\nRussia says reports are 'fake'\nUK newspaper The Financial Times (FT) reported Wednesday that two of the tankers appeared to have changed their destination and were no longer headed to the United States.\nRussian envoy and negotiator Kirill Dmitriev said on Thursday that the US-bound diesel tankers were still on course.\n\"Fake. Tankers destined for the US continue on course,\" Dmitriev said on X, linking to the FT story.\nPutin's spokesman Dmitry Peskov said detail of shipments were a \"commercial\" matter that could not be made public.\n\"All diesel will find its buyers,\" he added, without elaborating.\nA third vessel was still in the North Atlantic headed toward the US but changed its destination from New York to a vague \"for orders,\" without listing an unloading point.\nNJ governor threatens 'harsh penalties'\nDespite the fact that the US Treasury Department temporarily authorized Russian diesel transactions, New Jersey Governor Mikie Sherrill warned port and terminal operators to turn away ships carrying the fuel.\nIn a letter earlier this week, she warned that \"any effort to profit from the illegal trade in Russian fuel will be met with harsh penalties.”\nSherrill accused the Trump administration of lacking authority in overriding the import ban enacted by Congress more than four years ago.\nShe said New Jersey would act to prevent state facilities and companies from handling Russian fuel.\nIn a letter dated October 27, Connecticut Senator Richard Blumenthal warned shipping companies against violating US sanctions forbidding imports of Russian fuel.\n\"No president can unilaterally override a statute. Trump's license will not absolve you of legal and moral accountability,\" the letter read.", "translation_ja": "", "vocab": []}, {"title_ja": "コーネル大学の教職員会議、学校指導部への信任決議を否決", "title_en": "Cornell faculty senate votes no-confidence in school's leadership", "summary_ja": "学生への集団暴力事件に続いて、コーネル大学の教職員会議はキャンパスにおける性暴力への対応を非難する信任決議を可決しました。この決議は、大学の指導部がこうした重大な問題に適切に対処していないことへの不信を表明しています。", "summary_en": "Following the alleged gang rape of a student, Cornell's faculty senate passed a no-confidence resolution condemning the school's handling of sexual violence on campus.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/cornell-faculty-senate-release-result-confidence-vote/story?id=137911777", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABC News Live: リアルタイム速報", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは24時間体制で最新のニュースと生中継イベントをお届けしています。世界中で発生する重要なニュースをリアルタイムで報道し、視聴者に最新の情報を提供しています。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "里親が保護下にある10歳の少女殺害の容疑で逮捕：当局発表", "title_en": "Foster parent accused of murdering 10-year-old girl in her care: Officials", "summary_ja": "行方不明だったマライシア・アルフォード少女は、緊急捜索の結果、今週ニュージャージー州の車両内で発見されました。里親が彼女の殺害容疑で告発されています。当局が事件の詳細について調査を進めています。", "summary_en": "The missing girl, Malayshia Alford, was located in a vehicle in New Jersey this week following the urgent search, officials said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/foster-parent-accused-murdering-10-year-girl-care/story?id=137926563", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ケニアの黙示録系カルト指導者、190人の子どもを含む殺人罪で200年の懲役刑を受ける", "title_en": "Kenyan doomsday sect leader jailed for 200 years for murder of 190 children", "summary_ja": "ケニアの沿岸都市モンバサの裁判所は、カルト指導者ポール・マッケンジーに対し、190人の子どもと1人の大人の殺害罪で200年の懲役刑を言い渡した。マッケンジーは「良きたより国際教会」という黙示録系カルトを率い、信者たちに世界の終焉前に天国へ行くため飢餓死するよう命じていた。2023年の逮捕後、ケニア南東部のシャカホラ森林で400以上の遺体が発見されている。", "summary_en": "Paul Mackenzie convicted over deaths of children and one adult after followers were ordered to starve themselves and their families The leader of a Kenyan doomsday sect has been sentenced to 200 years in prison for the murders of 190 children and one adult in one of the world’s worst cult disasters ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/06/kenyan-doomsday-sect-leader-jailed-murders-paul-mackenzie", "state_media": false, "category": "社会", "full_text": "The leader of a Kenyan doomsday sect has been sentenced to 200 years in prison for the murders of 190 children and one adult in one of the world’s worst cult disasters in recent history.\nThe sentence, comprising 100 years for murder by starvation and 100 years by direct homicide, came two weeks after the court in Kenya’s coastal city of Mombasa found the cult leader guilty of the crimes.\nProsecutors said Paul Mackenzie and his Good News International church ran a Christian doomsday sect whose members were ordered to starve themselves and their children to death to go to heaven before the world ended.\nHis accomplices threatened and beat victims to ensure they followed his orders. The emaciated bodies were found scattered in shallow graves and dumped in latrines. Some had been buried alive.\nMackenzie was arrested in 2023 after police received a tipoff, and weeks later authorities began uncovering bodies in shallow graves in the Shakahola forest near the coast in south-eastern Kenya.\nIn total, more than 400 bodies have been recovered. Many were severely decomposed and only 26 could be identified.\nMackenzie denied murder charges, saying he did not force the victims to starve, but the court rejected that argument.\nThe Shakahola tragedy has gripped Kenya since the discovery of mass graves in the forest more than three years ago.\nIt raised questions about how Mackenzie was able to continue operating despite being on the radar of the authorities since 2017, when police searched his premises.\nIn 2019, authorities shut down Mackenzie’s church and he relocated to the Shakahola forest, police said.\nThe case has also led to calls for tougher oversight of churches and other religious organisations in a country where religious faith plays a prominent role in public life.\nMackenzie, a former taxi driver, forbade cult members from sending their children to school and from going to hospital when they were ill, describing such institutions as satanic.\nCult members lived in makeshift homes of polythene sheeting and thatch that Mackenzie divided into areas with biblical names such as Jerusalem and Judea.\nThe plight of his followers began to emerge in March 2023, when a man told police his brother and wife had starved their children to death in the forest on Mackenzie’s orders.\nMackenzie was arrested but released on bail, after which relatives said he brought forward the date on which he told his followers the world would end. Police rearrested him and started combing through the forest more systematically and began exhuming mass graves.\nLast month’s judgment covered 191 deaths while investigations into more than 200 other deaths are continuing.\nJustice Diana Kavedza-Mochache said in a hearing lasting more than eight hours that in some cases children were isolated and denied food while their parents watched.\nMackenzie faces other charges over the forest deaths, including those of terrorism, which he has denied.\nProsecutors said that while he was in detention he also directed the deaths of 52 people in Kwa Binzaro village, about 18 miles from Shakahola. Mackenzie has pleaded not guilty in that case.\nReuters contributed reporting", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカ地方選挙でANCが大敗、得票率30%以下に低下", "title_en": "ANC faces bruising defeat in South African local elections with 80% of ballots counted", "summary_ja": "南アフリカの地方選挙で、ネルソン・マンデラ率いた旧与党ANCが得票率31.8%と過去最低水準に落ち込み、大敗を喫している。失業率の上昇や汚職、不十分な公共サービスなどを背景に、有権者がANCから離れている。投票率は54.5%と前回の46%から上昇し、最終結果は日曜日に発表される予定である。", "summary_en": "Former liberation movement’s share of national vote almost 14 percentage points below 2021 result The African National Congress is on course to suffer a bruising defeat in South Africa’s local elections, with the once dominant party of Nelson Mandela falling to under a third of the vote nationally w", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/06/anc-faces-defeat-south-african-local-elections", "state_media": false, "category": "政治", "full_text": "The African National Congress is on course to suffer a bruising defeat in South Africa’s local elections, with the once dominant party of Nelson Mandela falling to under a third of the vote nationally with more than 80% of ballots counted.\nWednesday’s fragmented vote marks another stage in the decline of the ANC, which has led national governments since the end of white minority apartheid rule in 1994. High unemployment, crime, corruption and poor local service delivery have all contributed to voters turning away from the party.\nThe former liberation movement is projected to lose its status as the biggest party in the two most populous provinces, Gauteng and KwaZulu-Natal, as parties began coalition negotiations behind closed doors. The final results are expected to be announced on Sunday.\nThe ANC was on 31.8% of the vote nationally, almost 14 percentage points below its 2021 local election result. The centre-right, white-led Democratic Alliance (DA) had 24.1% of the vote, while the uMkhonto weSizwe (MK) party of the former ANC president Jacob Zuma was on 9.3%.\nTurnout also rose in Wednesday’s poll. The election commission estimated that 54.5% of registered voters cast their ballot, up from 46% five years ago.\nThe final shape of coalitions in some of the country’s biggest cities remained unclear with the final votes still being counted. Senior figures in key parties said they would talk with almost anyone, while keeping negotiating strategies under wraps.\nIn Johannesburg, South Africa’s commercial capital and biggest city, with 4.8 million people, voters have had to contend with regular water and power cuts, uncollected rubbish and potholes. The municipality, which has seen 10 changes of mayor in the last decade amid unstable coalitions, has admitted to a 220bn rand (£9.9bn) infrastructure spending backlog.\nWith just over half of votes counted in Johannesburg, the DA was leading with 40%, having run an energetic campaign under Helen Zille, a 75-year-old former Cape Town mayor. The ANC, which leads the current coalition, was in second place on 17.5%. ActionSA, a rightwing party led by Herman Mashaba, was on 15.5%. Mashaba has pledged never to work with Zille, whom he calls “racist”, something she vehemently denies.\nMany of the ANC’s township strongholds have yet to report full results. The Council for Scientific and Industrial Research (CSIR), a respected thinktank, has projected the DA will finish with 34%, the ANC 20% and ActionSA 16.8%.\nCoalitions in Gauteng’s three city municipalities are often negotiated together. The DA is leading in all three.\nThe MK party, led by 84-year-old Zuma as he continues to weather and deny numerous corruption allegations, is expected to displace the ANC as the largest party in KwaZulu-Natal. Founded in 2023, it mixes socially conservative Zulu nationalism with pledges to redistribute land and wealth from white to black South Africans.\nWith half of votes counted in eThekwini municipality, which contains Durban, the MK had 41%, meaning other parties could form a coalition to keep it out of power. Meanwhile, the DA is projected to maintain its majority in Cape Town, despite growing middle-class anger over rising housing costs.\nVoters choose a local councillor and a party, with seats allocated via proportional representation. Councillors will then have two weeks to elect mayors and form municipal governments.", "translation_ja": "", "vocab": []}, {"title_ja": "英国の医療従事者がコンゴ民主共和国からエボラ熱で英国に搬送される", "title_en": "British healthcare worker with Ebola evacuated from DR Congo to UK", "summary_ja": "コンゴ民主共和国で人道支援活動に従事していた英国人医療従事者がエボラ熱に感染し、英国に搬送されることが確認されました。患者は安定した状態にあり、ロンドンの高度な感染症治療施設に入院する予定です。現在のエボラ熱の流行は記録上2番目の規模で、10,000件以上の症例と5,000人以上の死亡者が報告されています。", "summary_en": "Patient is ⁠in ​stable condition and will be transferred to a specialist ‘high consequence’ infectious disease unit A British healthcare worker with Ebola is being evacuated from the Democratic Republic of the Congo to the UK for medical treatment, it has been confirmed. “A British citizen currently", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/04/british-healthcare-worker-ebola-evacuated-drc-to-uk-document-shows", "state_media": false, "category": "政治", "full_text": "A British healthcare worker with Ebola is being evacuated from the Democratic Republic of the Congo to the UK for medical treatment, it has been confirmed.\n“A British citizen currently in the DR Congo has tested positive for Ebola,” a spokesperson for the UK government said in a statement on Wednesday. “The UK has well-established procedures for dealing with cases like this, and those processes have been activated … The risk to the UK public from Ebola remains low.”\nThe patient, whose identity is unknown, is in a stable condition and is expected to arrive in the UK on Wednesday or Thursday before being transferred in a specialist ambulance to a “high consequence” infectious disease unit, according to an official document seen by Reuters.\nA humanitarian organisation sent the worker to DR Congo to help in the response to the outbreak, which is the second largest on record. It is the first case involving a British national contracting Ebola in the current outbreak.\nThe Royal Free hospital in London has a high-level isolation unit for infectious diseases such as Ebola; other centres are in Newcastle and Liverpool.\nEbola is a highly contagious, severe and often fatal illness. It is spread through direct contact with body fluids such as the blood or vomit of infected people, or dead bodies.\nThe current outbreak, declared on 15 May by DR Congo’s health ministry, has surpassed 10,000 cases, and 5,000 deaths. It is the 17th in DR Congo since Ebola was identified, was caused by the Bundibugyo virus, and has become the largest and deadliest in the country’s history. The Bundibugyo virus has no approved treatment, though vaccine trials are under way.\nSince the outbreak started, it has spread to Kenya and Uganda in east Africa, while last month Nigeria confirmed a case in the capital, Abuja, after a woman who arrived from Uganda tested positive for the virus. She, along with a close contact, were evacuated to Switzerland for treatment.\nIn an interview with the Guardian last month, Dr Jean Kaseya, the director general of the Africa Centres for Disease Control and Prevention (CDC), said the “unprecedented” spread of the Ebola outbreak meant it could reach the UK and other countries.\n“We want all countries to know that they are not safe if they don’t take appropriate measures,” he said. “Each country, not only in the African region, but all continents, must now increase the preparedness level and the possibility for treatment.\n“It is the first time three African regions have been affected [by Ebola]. The geographic extension of this outbreak is unprecedented.”\nOther patients who have been medically evacuated for specialised care since the start of the outbreak include two sent to Germany and one to the Netherlands. Another case was reported in France in July.\nBritish health authorities say the risk to the wider public from imported Ebola cases remains low and the NHS has procedures in place to manage suspected and confirmed infections.\nThere have only been four confirmed cases recorded in Britain since 1976, according to the UK Health Security Agency.", "translation_ja": "", "vocab": []}, {"title_ja": "イラン戦争ライブ：カタールが米国とイランに平和合意の遅延を警告", "title_en": "Iran war live: Qatar says US, Iran should not wait to reach a peace deal", "summary_ja": "カタールの首相兼外相シェイク・モハンマド・ビン・アブドゥルラフマン・ビン・ジャシム・アルサーニ氏は、米国とイランに対し戦争終結のための平和合意に向け、「完璧な瞬間」を待つべきではないと警告した。オックスフォード大学でのインタビューで、両国は待つ余裕がないと述べた。一方、イランの公式通信社IRNAは、ホルムズ海峡のキシュム島に2発のミサイルが着弾したと報じており、半公式メディアは死傷者はなかったと伝えている。", "summary_en": "Qatar&#039;s prime minister urges the US and Iran not to wait for a &#039;perfect moment&#039; to reach a deal to end the war.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/11/7/iran-war-live-qatar-says-us-iran-should-not-wait-to-reach-a-peace-deal?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: Qatar says US, Iran should not wait to reach a peace deal\nQatar’s prime minister urges the US and Iran not to wait for a ‘perfect moment’ to reach a deal to end the war.\nPublished On 7 Nov 2026\n- Qatar’s Prime Minister and Foreign Minister Sheikh Mohammed bin Abdulrahman bin Jassim Al Thani urges the US and Iran to reach a peace deal to end the war, warning during an interview at Oxford University that they cannot afford to wait for a “perfect moment”.\n- Iran’s official news agency IRNA reports two missiles have struck Qeshm Island in the Strait of Hormuz, while semi-official outlets report there were no casualties.", "translation_ja": "", "vocab": []}, {"title_ja": "ニュージーランド国民が投票最終日に投票所へ", "title_en": "New Zealanders head to polls on final day of voting", "summary_ja": "ニュージーランドでは生活費の上昇と経済状況への懸念を背景に、投票最終日となる土曜日に投票所が開かれた。全有権者の半数以上である160万人以上がすでに期日前投票を済ませており、中道右派の与党国民党と中道左派の野党労働党が競っている。選挙結果は土曜夜までに投票所の95%から速報値が発表される予定である。", "summary_en": "More than half of New Zealand’s voters cast early ballots in the tightly contested race.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/6/new-zealanders-head-to-polls-on-final-day-of-voting?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "New Zealanders head to polls on final day of voting\nMore than half of New Zealand’s voters cast early ballots in the tightly contested race.\nPolls have opened on the final day of voting in New Zealand against a backdrop of concerns over the rising cost of living and the broader state of the economy.\nPolling stations opened at 9am on Saturday (20:00 GMT Friday) and close at 7pm (06:00 GMT Saturday).\nVoting already began on October 26. More than 1.6 million voters, out of nearly 3.8 million in total, had cast their ballots by the end of Thursday, according to the country’s Electoral Commission.\nThe country has strict laws banning any talk of politics on election day.\nThe 19-hour election day blackout, which ends when polling places close on Saturday evening, bars everyone, including political parties, news outlets and social media users, from commenting on likely election outcomes, campaign issues and anything else that might encourage or discourage people from voting in a particular way.\nBillboards and advertising must be removed. Bumper stickers, T-shirts and even social media profile pictures are also covered by the law.\nBreaches of the law can incur a fine of up to 20,000 New Zealand dollars ($11,000).\nOpinion polls ahead of the tightly contested election suggest the governing centre-right National Party and the opposition centre-left Labour Party neck and neck, with neither on course to win enough seats to govern alone.\nNew Zealand’s Electoral Commission aims to release preliminary results from 95 percent of polling stations by the end of election night on Saturday. A final result, which will reflect ballots cast by New Zealanders abroad, is expected by November 27.\nNew Zealand elections\nMost parties are campaigning on the economy, but their suggested solutions differ widely.\nThe National Party is pledging to return the budget to surplus through fiscal discipline while expanding the national pension scheme.\nThe Labour Party is focusing on the cost of living, promising cheaper healthcare and transport.\nRecent polls show no clear winner. A handful of seats either way could decide who governs.\nNew Zealand holds a general election every three years under a mixed-member proportional system.\nVoters do not elect a leader of the country but instead select a local electorate candidate and a political party.\nElectorate winners earn a seat in the typically 120-seat parliament, as do the highest-ranked members of the party based on their national party vote.", "translation_ja": "", "vocab": []}, {"title_ja": "EUがTikTokに「有害な」フィード改善を要求、罰金を脅す", "title_en": "EU tells TikTok to fix ‘harmful’ For You feed, threatens fines", "summary_ja": "欧州連合はTikTokのアルゴリズムがユーザーを脱出困難な「ウサギの穴」に導いていると指摘し、デジタルサービス法違反で改善を命じました。同社が十分な対策を講じていないとして、最大6%の罰金を科す可能性があります。TikTokはこの指摘を否定し、ユーザー保護と安全性への取り組みが強いと主張しています。", "summary_en": "TikTok&#039;s algorithm &#039;leading users down rabbit holes they cannot easily escape from&#039;, European Commission says.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/6/eu-tells-tiktok-to-fix-harmful-for-you-feed-threatens-fines?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "EU tells TikTok to fix ‘harmful’ For You feed, threatens fines\nTikTok’s algorithm ‘leading users down rabbit holes they cannot easily escape from’, European Commission says.\nThe European Union has ordered TikTok to change the algorithm powering its For You feed, threatening the social media platform with large fines.\nOn Friday, Brussels accused TikTok of violating the EU’s Digital Services Act over the “harmful ‘rabbit holes’ effect” by feeding users similar video clips based on what they’ve previously viewed or liked, even if they are “triggering”.\n“Every time a user scrolls or likes a video on TikTok, the algorithm serves more of the same, leading users down rabbit holes they cannot easily escape from,” European Commission Executive Vice President Henna Virkkunen, who oversees tech sovereignty, said in a statement.\n“Today’s preliminary findings show again that TikTok needs to step up its efforts to protect users’ well-being, including those of minors.”\nThe algorithm, according to the EU, results in the “endless” exposure of users to “content about sadness, isolation or body image.”\nThe EU said that although TikTok had made some changes to mitigate the risks highlighted by the commission, the tweaks were not enough.\nTikTok rejected the EU’s findings, saying they are “fundamentally inaccurate and distort our platform’s architecture and our commitment to user safety”.\nTikTok has “a strong record of protecting our community while giving users direct and intuitive control over their content experience”, a spokesperson for the tech giant said.\nBrussels’ fines on the Chinese-owned platform could increase by up to 6 percent, according to regulators, unless the platform resolves the issue. The company will have a chance to respond before the commission issues its final decision.\nRecent efforts in countries like France, Spain and England have focused on protecting minors on social media platforms from predatory behaviour, cyberbullying, deteriorating mental health and eating disorders. Several countries introduced social media bans for children below the age of 15.\nEarlier EU findings\nIn February, the EU found that TikTok did not “adequately assess how these addictive features could harm the physical and mental well-being of its users, including minors and vulnerable adults”.\nWhereas the EU’s February findings focused on features such as the impact of notifications, Friday’s order went after the algorithm itself, a senior EU official told the AFP news agency.\nIn July, the bloc accused TikTok of exposing children to risks like cyberbullying and predatory behaviour.\nIn the same month, Brussels ordered Meta to change Facebook’s and Instagram’s feeds in an investigation into the platforms’ violations of the bloc’s Digital Services Act.", "translation_ja": "", "vocab": []}, {"title_ja": "銀行危機をめぐりパラグアイ大統領ペーニャが弾劾される", "title_en": "Paraguayan President Pena impeached over banking crisis", "summary_ja": "パラグアイの上院議員は11月6日、大手銀行の経営破綻により約半分の国民がアカウントにアクセスできなくなり、広範な抗議活動を招いたことに関してサンティアゴ・ペーニャ大統領を弾劾する投票を行いました。44票の賛成と1票の棄権により、大統領は職務の遂行不良で有罪宣告されました。約300万人の国民が火曜日の中央銀行によるウエノ銀行の管理下から資金にアクセスできずにいます。", "summary_en": "Santiago Pena had offered his resignation over the disaster, but lawmakers pressed ahead with impeachment proceedings that would strip him of immunity granted to former Presidents", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/paraguayan-president-pena-impeached-over-banking-crisis/article71676251.ece", "state_media": false, "category": "政治", "full_text": "Paraguayan Senators on Friday (November 6, 2026) voted to impeach President Santiago Pena over the collapse of a major bank that locked almost half the population out of their accounts and triggered widespread protests.\nMr. Pena had offered his resignation over the disaster, but lawmakers pressed ahead with impeachment proceedings that would strip him of immunity granted to former Presidents.\nHe did not attend the trial in the Senate despite earlier pledging to defend himself.\nThe President “is declared guilty of poor performance in his duties,” Senate President Basilio Nunez declared after a vote of 44 in favor of impeachment and one absence out of 45 senators.\nAround three million people have been unable to access their money since the Central Bank took control of Ueno Bank on Tuesday and froze its accounts over concerns about its solvency.\nA Central Bank official told AFP that advance payments to some affected depositors had begun on Thursday (November 5, 2026) afternoon.\nThe bank’s demise brought thousands of people onto the streets demanding repercussions for U.S.-backed Mr. Pena, who until last year had a stake in Grupo Vazquez, which controlled Ueno.\nLawmakers from Mr. Pena’s own party backed his impeachment. Mr. Pena, 47, apologized during an address to the nation on Thursday (November 5, 2026).\n“It was never my intention to betray the trust you placed in me,” he said in a video statement.\n‘Hurt’\nAround 250 people were gathered outside Congress awaiting the outcome of the trial, one of them waving a sign that read: “Pena in prison.”\nOn Thursday (November 5, 2026), thousands protested for a third consecutive night in Asuncion and other cities to demand the return of their money.\n“Santiago Pena has hurt so many Paraguayans, so many families, business owners and small business people, including my own son, who had savings in Ueno Bank,” Cynthia Farina told AFP at a protest in the capital that police dispersed with tear gas and water cannons.\nAdvance payments to an unspecified number of impacted depositors began on Thursday afternoon, Jose Maciel of the Central Bank’s Deposit Guarantee Fund told AFP.\nThe first phase of aid deposits, up to around $1,600, will go to clients who don’t have loans and have an account at another bank or institution in Paraguay to receive the funds, Mr. Maciel said.\nThe next beneficiaries “will be announced progressively over the course of the payment process,” he said.\nUeno began as a small fintech company with a digital-first model that attracted low-income customers, rapidly becoming a major bank that handled state pensions and the accounts of several state entities.\nThe opposition accuses Mr. Pena of a conflict of interest, which he denies.\nThe Attorney General said it was investigating him for “acts related to the supervision and resolution of Ueno Bank S.A. and the placement of public funds in said entity.”\nThe U.S. Embassy in Paraguay expressed “its solidarity with the Paraguayan people” on Friday (November 6, 2026), without mentioning the president.\n‘Victims’\nUeno’s downfall shocked the South American country, which is generally considered economically and politically stable.\nBy impeaching him rather than letting him resign, lawmakers have prevented Mr. Pena from becoming a senator for life and enjoying immunity from prosecution, constitutional experts and lawmakers told AFP.\nVice President Pedro Alliana is preparing to complete the current mandate until 2028.\nThe scandal has claimed the heads of Central Bank President Carlos Carvallo and Interior Minister Enrique Riera.\nEight Ueno executives have been arrested.\nProsecutors on Friday (November 6, 2026) raided the offices of technology company ITTI, which is part of Grupo Vazquez, confiscating hard drives, computers and other items.\n“We found a large amount of documents that will be useful for the investigation,” prosecutor Francisco Cabrera told reporters.\nNearby Argentina felt the impact of the crisis as some 1,000 ITTI employees were suspended for 30 days without pay.\nFootball also took a hit.\nUeno Bank sponsors several first division teams as well as the national team.\n“We were also victims of this situation,” members of the national team said in a statement on X.\nPublished - November 07, 2026 04:46 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "中期選挙後、米司法省から相次ぐ辞任", "title_en": "Wave of resignations from U.S. Justice Department after midterms", "summary_ja": "トランプ大統領の個人弁護士出身のトッド・ブランシュ司法長官は、公民権担当司法次官ハルミート・ディロン氏を含む複数の上級司法省職員の辞任を発表した。ディロン氏はトランプ氏の共和党が大敗した中期選挙前に、30州以上から有権者登録リストを入手しようとする試みに関与していた。また、国家安全保障担当司法次官と南フロリダ地区の米国弁護士も同時期に辞任している。", "summary_en": "The Justice Department under Donald Trump has pursued cases against a number of perceived enemies, and several prosecutors have lost their jobs over their reluctance or inability to bring charges", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/wave-of-resignations-from-us-justice-department-after-midterms/article71676248.ece", "state_media": false, "category": "社会", "full_text": "Several senior U.S. Justice Department officials have resigned, including its civil rights chief and a prosecutor investigating allegations of conspiracy against President Donald Trump.\nU.S. Attorney General Todd Blanche, a former personal lawyer for Mr. Trump, announced on Thursday (November 5, 2026) that he had accepted the resignation of Assistant Attorney General for Civil Rights Harmeet Dhillon.\nIn this role, Mr. Dhillon was directly involved in unsuccessful attempts to obtain voter registration lists from some 30 states ahead of this week’s midterm elections that dealt heavy defeats to Mr. Trump’s Republican Party.\nIn her resignation letter, cited by U.S. media outlets, Mr. Dillon said that she submitted it in October and agreed to remain in her position until the election.\nMs. Blanche also announced on Friday (November 6, 2026) the resignations of Assistant Attorney General for National Security John Eisenberg, and Jason Reding Quinones, U.S. attorney for the Southern District of Florida.\nMr. Quinones oversaw an investigation into former intelligence officials whom Mr. Trump accused of seeking to remove him from power.\nThe Justice Department under Mr. Trump has pursued cases against a number of perceived enemies, and several prosecutors have lost their jobs over their reluctance or inability to bring charges.\nIn one high-profile case brought by the department, James Comey, the former director of the FBI, was indicted in April for allegedly threatening Mr. Trump’s life in an Instagram post of seashells.\nPublished - November 07, 2026 04:10 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、中間選挙敗北後にスーザイ・ワイルズをスティーブン・ミラーに交代", "title_en": "Trump replaces Susie Wiles with Stephen Miller as chief of staff after GOP’s midterm defeat", "summary_ja": "ドナルド・トランプ大統領は、共和党が中間選挙で議会の支配権を失った数日後の11月6日、スティーブン・ミラーをホワイトハウス首席補佐官に任命することを発表しました。前首席補佐官のワイルズは、女性として初めてこの職に就いた人物で、移民政策の強硬派として知られるミラーに交代されます。ワイルズはトランプ大統領の政治組織で引き続き働くと述べられています。", "summary_en": "On his social media site, Donald Trump praised Susie Wiles and said she’d continue working for his political organisation", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-replaces-susie-wiles-with-stephen-miller-as-chief-of-staff-after-gops-midterm-defeat/article71676063.ece", "state_media": false, "category": "政治", "full_text": "President Donald Trump said Friday (November 6, 2026) that Stephen Miller was replacing Susie Wiles as White House chief of staff, mere days after Republicans lost control of Congress in the midterm elections.\nOn his social media site, Mr. Trump praised Ms. Wiles and said she’d continue working for his political organisation. Ms. Wiles also released a social media statement on Friday (November 6, 2026).\n\"Serving President Trump in the White House has been the honour of a lifetime. I’m so proud to have been a part of what we’ve accomplished together, from securing our border and cutting taxes to strengthening our economy and putting America First,” Wiles said in a social media post shortly after Trump’s announcement. She added that her commitment to “the President and the mission” will not change.\nMr. Miller, long a key member of Mr. Trump’s inner circle, is a key architect of the administration’s hard-line immigration policies.\nMs. Wiles, the steely political operator and longtime adviser to Mr. Trump, was the first woman to ever serve in that post.\nMs. Wiles' departure comes almost immediately after the GOP's midterm thrashing on Tuesday (November 3, 2026). She will be replaced by Stephen Miller, a longtime trusted aide to Mr. Trump.\nThe departure also came months after Ms. Wiles indicated she no longer showed evidence of breast cancer after she underwent months of treatment for the disease, a diagnosis she went public with in March 2026.\nMs. Wiles is the longest-serving White House chief of staff for Mr. Trump, who cycled through four of them during his first four-year term.\nMr. Miller is one of Mr. Trump’s closest and longest-serving advisers, having jumped on board during his long-shot 2016 presidential campaign as a speechwriter. He currently serves as White House deputy chief of staff, and though he has a wide-ranging portfolio, Mr. Miller is most closely aligned with Mr. Trump’s immigration policy and rhetoric on immigration.\nMr. Miller is a former aide to hardliner former Sen. Jeff Sessions, R-Ala., who would go on to serve as Mr. Trump’s first Attorney General.\nPublished - November 07, 2026 01:10 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ライアン・ウェディングの保護者とされたカルテルボスがメキシコ警察との銃撃戦で射殺される", "title_en": "Cartel boss accused of being Ryan Wedding’s protector is shot dead in gunfight with Mexican police - Toronto Star", "summary_ja": "トロント発のニュースによると、ライアン・ウェディングの保護者であると指摘されていたカルテルのボスがメキシコ警察との銃撃戦で射殺されました。この事件は、国際的な犯罪ネットワークと警察の対立を浮き彫りにしています。", "summary_en": "Cartel boss accused of being Ryan Wedding’s protector is shot dead in gunfight with Mexican police Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikgJBVV95cUxPYnN5cWljdktNMVNkYkFqaC1nZnV6VDZLd2xTUk5RQ3JOSGRtOGhSaVhQMnRBX0ZNUkhRekpMem9ndG92LUxDNGN2QlEtMGhMZ0I2OGdta1VPeXZ3OEZKd3dOQ0Q5clhFN3AyM1ZpMDZjU1RxaHhvdHhmVDUtdFFubmVUTkMyLWZFREFFMkVvN3k1Zy04ZEpVakl4Mm82Uk5tNEZsdDg2U19vQVlKQV9vZHZMR25YdzRVdnU0dWZrS2I5R29qa0hVTWtraHNITXpNdVZkdVpKRkR1RjMxQ2Z1ZkFhb3BHMHVmVGZNa1JsOVhBRE44RGpHYWswVnpuTHNpeG1yVk9kQ01nNUt1LXZmelV3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カーニー政府、移民目標を維持し、20万人の一時滞在者に永住権申請を許可", "title_en": "Carney government holds immigration targets steady, allows 200,000 temporary residents to apply for permanent status - Toronto Star", "summary_ja": "カーニー政府は移民受け入れ目標を現状維持する一方、20万人の一時滞在者に永住権の申請資格を与える政策を発表しました。この措置により、カナダで既に滞在している多くの一時的労働者や学生が、永住者への移行を目指す機会が広がります。同政府は経済と労働市場のニーズに対応しながら、移民政策の安定性を保つ方針を示しています。", "summary_en": "Carney government holds immigration targets steady, allows 200,000 temporary residents to apply for permanent status Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMirwJBVV95cUxOZ2QyNHNCV2I1em1MNDhKR0ZtZ3RmTzhldl9XX3djMEtndzFsQS1TdHVlWFdGMktiaXdTYk9EMjU3NzlRNXUtNk5PZVQ3d2dreUtnZjNVTDdGR3BiRHFrR1RRZlVlVWZLbFFxY2F4ZmJFX0paVmVsM1RncjhYOTUzVDJDM0FJT0pSWUZqajIwS
