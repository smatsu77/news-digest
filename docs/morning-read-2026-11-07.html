ors and members across the state, charging them to prioritise grassroots governance and ensure effective communication of government policies and projects across the state.\nSpeaking at the swearing-in ceremony at the International Conference Centre, Enugu, on Thursday, Mbah reminded the appointees that the oath of office constituted a social contract and a commitment to serve with integrity.\nHe said the Development Centres remained a critical component of his administration’s governance model because they represented the closest tier of government engagement with the people.\n“Government is about the people, and we do not have an arm of government that is closer to the people than the Development Centres,” he said.\nMbah explained that the appointees were expected to take government policies, programmes and projects closer to communities, particularly women, families and other grassroots populations, while complementing rather than replacing the statutory responsibilities of local governments.\nHe urged them to work closely with their respective local government chairmen to ensure that government interventions and development initiatives reached their intended beneficiaries.\nThe governor further tasked the 68 administrators with understanding government policies at both state and local government levels and effectively communicating their benefits to residents, especially those in rural communities.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nUsing the administration’s investments in Smart Green Schools and Type 2 Primary Healthcare Centres as examples, Mbah said the appointees should go beyond merely announcing government projects to explaining their practical benefits to the people.\nHe charged them to educate communities on how the modern healthcare facilities would reduce maternal and child mortality, ensure timely childhood immunisation and improve access to essential healthcare services.\nHe also urged them to sensitise residents on government interventions in water supply, sanitation and the campaign to make Enugu an open-defecation-free state.\n“I want you to carry the energy and zest I see in you to our communities. Carry the energy to your various homes and communities,” he charged them.\nOn the political front, Mbah urged the appointees to communicate the administration’s achievements and policies to the electorate, challenging opposition politicians to present their programmes and records in governance.\nHe also disclosed that the administration would take its campaign and performance assessment engagements to the various Development Centres to showcase projects and achievements across communities and wards.\n“Our campaign is going to be at the different Development Centres. We are going to go to all our Development Centres to point out to Ndi Enugu what we have done, not just at the Development Centre level, but even at the wards and our communities,” he said.\nThe governor reaffirmed his administration’s commitment to its 10,000-kilometre road development target, adding that significant progress had also been recorded in tourism, transportation and other sectors.\nHe expressed satisfaction with his administration’s payment of gratuities to retired workers, noting that the intervention was being implemented at both state and local government levels.\nEarlier, the Special Adviser to the Governor on Political Matters, Frank Anioma, described the inauguration as another demonstration of Mbah’s commitment to effective grassroots administration and development.\nHe charged the appointees to mobilise grassroot support for the governor’s re-election bid in their respective.\nResponding on behalf of the appointees, an Administrator from Enugu North, Kenechukwu Ikenegbu, expressed appreciation to the governor for the appointments and pledged their commitment to advancing the administration’s development agenda at the grassroots.\nHe said the appointees would serve as the governor’s representatives in their respective communities, taking the administration’s achievements to residents through sustained engagement and door-to-door mobilisation.\nIkenegbu also pledged their support for the All Progressives Congress (APC) and its candidates in the forthcoming elections, assuring that they would intensify grassroots mobilisation across the state.\nSpeaking to newsmen, the Administrator, Nkanu East South Development Centre, Hon Emmanuel Edeh, enthused that with over 10,000 verifiable milestones, Mbah had given the appointees so much to campaign on.\nThe swearing-in conducted by the State Attorney General and Commissioner for Justice, Osinachi Nnajieze, was witnessed by party leaders, members, and other stakeholders, including: the Minister of Innovation Science and Technology Dr Kingsley Udeh, the Speaker ", "translation_ja": "", "vocab": []}, {"title_ja": "EFCC、米国詐欺事件で163,592ドルの没収を最終決定", "title_en": "EFCC secures final forfeiture of $163,592 proceeds of US fraud", "summary_ja": "ナイジェリア経済金融犯罪委員会（EFCC）は、米国の法律事務所と詐欺行為を行ったナイジェリア人実業家アクパシ・オジエグベから163,592ドルの最終没収を確保したと発表しました。オジエグベは米国企業の元従業員になりすまし、労災示談金の詐取に成功していました。連邦高等裁判所の判事は、オジエグベが資金の正当な所有権を証明できなかったため、没収命令を認めました。", "summary_en": "The impersonator instructed the lawyers to deduct their fees and transfer the balance to a bank account he supplied. The post EFCC secures final forfeiture of $163,592 proceeds of US fraud appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/923290-efcc-secures-final-forfeiture-of-163592-proceeds-of-us-fraud.html", "state_media": false, "category": "政治", "full_text": "The Economic and Financial Crimes Commission (EFCC) says it has secured the final forfeiture of $163,592 obtained through an alleged fraud involving a United States-based law firm and a Nigerian businessman, Akpasi Oziegbe.\nTrial judge M. S. Liman of the Federal High Court in Abuja granted the forfeiture order on Friday after an application by the EFCC.\nAccording to a statement by EFCC spokesperson Dele Oyewale, the judge held that Mr Oziegbe failed to establish legitimate ownership of the money, which the commission traced to his domiciliary account operated under the name Micoz Bluelink Enterprise at United Bank for Africa (UBA).\nThe statement noted that Mr Oziegbe obtained the money by impersonating Edward Campbell, a former employee of Applied Industrial Technologies, a US company, who had sustained an accident at work.\nThe commission said Mr Oziegbe approached Steven J. Mandel & Co., a US law firm, on 27 June 2022, posing as Mr Campbell and claiming that the company had failed to pay an agreed settlement arising from the workplace accident.\nInformation obtained from the United States Federal Bureau of Investigation (FBI) showed that the law firm was later informed that Applied Industrial Technologies had issued a cheque for $165,157 to Mr Campbell as settlement.\nThe impersonator instructed the lawyers to deduct their fees and transfer the balance to a bank account he supplied.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe firm transferred $163,592 to the account on 20 July 2022. The following day, JPMorgan Chase Bank notified the lawyers that the cheque had been altered and was fictitious.\nThe law firm contacted Applied Industrial Technologies, confirmed the fraud and reported the matter to the US Secret Service and the FBI.\nUBA had also flagged the transaction as suspicious and sought confirmation through its correspondent bank, Citi Bank. After confirming the transaction was fraudulent, UBA placed a lien on the funds following a refund request from JPMorgan Chase Bank.\nMr Oziegbe later petitioned the EFCC, accusing some UBA officials of conspiracy, forgery and obtaining money under false pretences.\nThe commission stated that its Extractive Industry Fraud Section began investigating the matter in May 2024 after receiving a petition from GAIA & Montgomery Legal on his behalf.\nHowever, the EFCC said its investigation, supported by information and documents from the FBI, established that the money came from the alleged fraudulent transaction and not from any legitimate business deal.\nALSO READ: US extradites convicted ex-Ghanaian official over $6 million fraud\nMr Oziegbe had claimed that the money was payment for materials supplied to the United States, but the commission said he failed to provide documents to support the claim.\nThe EFCC obtained an order freezing the account on 9 September 2024 in Suit No. FHC/ABJ/CS/1297/2024 to prevent the withdrawal of the funds.\nOn 15 August 2025, the court granted an interim forfeiture order over the money and directed anyone with an interest in it to show cause why it should not be finally forfeited.\nProsecution lawyer, Ekele Iheanacho, a Senior Advocate of Nigeria (SAN), led the EFCC’s legal team in securing the final forfeiture order.\nThe commission said the money was to be forfeited to Steven J. Mandel & Co. through the Federal Government of Nigeria.\nThe EFCC had earlier declared Mr Oziegbe wanted in connection with the alleged fraud.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "リフ判事の判決がADC、アティクに与える影響について知っておくべき10の重要なこと", "title_en": "10 key things to know about Justice Lifu’s judgment affecting ADC, Atiku, By Abdulrahman Abdulaziz", "summary_ja": "ナイジェリアの連邦高等裁判所がピーター・リフ判事により下した判決により、セネーター・デイヴィッド・マーク主導のアフリカ民主会議（ADC）の指導部が無効とされ、アティク・アブバカルの2027年大統領立候補資格が取り消された。この判決は、ADC内の北東部地域指導部の紛争からの訴訟によってもたらされたもので、アティク派による「無秩序な党乗っ取り」とそれに伴う党内の激しい権力争いが背景にある。", "summary_en": "The Atiku camp caused the ADC's current misfortune by treating the party's internal democracy with impunity and hijacking its leadership structures. The post 10 key things to know about Justice Lifu&#8217;s judgment affecting ADC, Atiku, By Abdulrahman Abdulaziz appeared first on Premium Times Niger", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/923281-10-key-things-to-know-about-justice-lifus-judgment-affecting-adc-atiku-by-abdulrahman-abdulaziz.html", "state_media": false, "category": "社会", "full_text": "The political landscape has been thrown into fresh turbulence after the Federal High Court delivered a judgment by Justice Peter Lifu that voided the leadership of the African Democratic Congress (ADC) under Senator David Mark and nullified Atiku Abubakar’s presidential candidacy for the 2027 elections.\nHere are 10 key things to know about the judgment, the events that led to it, and the underlying political battles.\n1. The Core Ruling and Immediate Casualties\nJustice Peter Lifu’s judgment nullified the leadership of the Senator David Mark-led National Working Committee (NWC) of the ADC. Alongside sacking the party leadership, the court invalidated the primary elections conducted under their watch, effectively stripping Atiku Abubakar of his 2027 presidential nomination and nullifying the candidacies of other party flagbearers.\n2. Triggered by the North-East Zonal Leadership Dispute\nThe legal onslaught against the Mark-led leadership began with a suit marked FHC/ABJ/CS/1819/2025, filed by Nafiu Bala Gombe, the former ADC National Deputy Chairman (North-East). Gombe challenged the legitimacy of the transition process that installed the new leadership after the resignation of the former National Chairman, Chief Ralph Nwosu.\n3. The “Haphazard” Takeover by the Atiku Camp\nThe crisis began with a sudden, intense political realignment that saw the Atiku camp sweep into the ADC. Critics and aggrieved party stalwarts described the influx as a “haphazard takeover,” arguing that political heavyweights hijacked the party’s structures overnight, brushed aside internal party mechanisms, and sidelined foundational stakeholders who had built the platform over the years.\n4. The Fierce Battle for Party Control\nThe takeover triggered an internecine war for the soul and structure of the ADC. Factional leaders and aggrieved members—such as Nafiu Bala Gombe—argued that the installation of Senator David Mark, Ogbeni Rauf Aregbesola (as National Secretary), and other caretaker committee members blatantly violated the party’s constitution and provisions of the Electoral Act. This internal friction morphed into a fierce proxy war over who legitimately controlled the party apparatus.\n5. Escalation of Interlocutory Issues to the Supreme Court\nAs the battle for control intensified, factions rushed to court, triggering a flurry of interlocutory injunctions, counter-injunctions, and appeals. These interlocutory battles moved swiftly through the court hierarchy, eventually landing on the Supreme Court docket as camps sought interim legitimacy or tried to block opponents from running party affairs.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n6. The Trial Court Remand Order\nAt a previous stage of the protracted legal tussle, appellate reviews and procedural assessments led to orders directing parties back to the trial court. Rather than resolving the substantive issues at the appellate level immediately, higher courts returned the matter to the Federal High Court for a proper trial and determination of the core substantive claims regarding leadership rights and structural compliance.\n7. Yesterday’s Judgment and Findings on Infractions\nFollowing the procedural trajectory, Justice Lifu took up the substantive case and ruled in the plaintiff’s favour. The court held that the emergence of the Mark-led NWC violated both the ADC constitution and the Electoral Act, making all actions, congresses, and primary elections conducted under their administration legally unsustainable and void.\n8. Atiku and the ADC’s Sharp Condemnation\nReacting swiftly to the judgment, Atiku Abubakar (through his campaign organisation) condemned the ruling, labelling it a panicked move by the ruling All Progressives Congress (APC) to weaken the opposition. The ADC similarly rejected the verdict, characterising it as legally indefensible and a coordinated assault on multi-party democracy in Nigeria. The embattled politician, however, remained silent on the undemocratic role he and his colleagues played in stoking the crisis.\n9. Jubilation from the Opposing Faction\nConversely, the faction loyal to Nafiu Bala Gombe hailed Justice Lifu’s verdict as a triumph of the rule of law. Proponents of this view argued that political parties cannot treat their internal constitutions with impunity and that leadership must emerge through transparent, lawful processes rather than imposition.\n10. The Next Legal Frontier: Heading to the Appeal Court\nThe legal war is far from over. Representatives of the ADC and affected camps have announced their resolve to challenge yesterday’s judgment at the Court of Appeal. With the 2027 general elections drawing closer, the legal status of the party’s leadership and its presidential ticket hangs in a delicate balance, setting the stage for another high-stakes judicial showdown.\nUltimately, the Atiku camp stands as the true architect of ", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル選挙後、誰が政府樹立の最初の機会を得るのか", "title_en": "After Israel’s Election, Who Will Get the First Chance to Form a Government?", "summary_ja": "イスラエルの結論の出ない選挙の後、アイザック・ヘルツォグ大統領は政党指導者や関係者との2日間の協議を経て、政府樹立を試みる候補者を指名する予定です。大統領はこの困難な交渉プロセスを通じて、どの候補者が連立政権を形成する最適な立場にあるかを判断します。", "summary_en": "President Isaac Herzog is set to task a candidate with trying to form a government, following two days of talks with party leaders and officials after an inconclusive election.", "source": "New York Times", aaretz", "summary_ja": "イスラエルの政治情勢の中で、アイゼンコット氏がネタニヤフ首相の後任として少数派政権の樹立に向けた準備が整っていることを示唆した。この発言は、現政権の不安定性と指導部交代の可能性を示唆するものである。同氏の動きは、イスラエル国内の政治的な権力構図の変化を反映している。", "summary_en": "Eisenkot Signals Readiness for Minority Government to Replace Netanyahu Haaretz", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimwJBVV95cUxNLXZVVmdCVHY0ejRHSmVBRjkxWjhvR1BVcmtxdjN6NHBGeG0weTFHMGgzdTF3VWRVVXVHSHA2NGhHVnhhRUZoYlVKdkcxdWh1VmZxeVVIUVoxc2Q4eTdBMjNaYmpQX0Vyc3BSMlJJdmhoN2NNaFpacV9vOVdVOE1JVmowdG02QXNUek51bk91amRnS2pDYTBNRmljc3NvU1psVmxjbFRGZmlBSGdEM2Y1TDdCQktwbzdER19iU09CX2Zkb1AtaUt2Q0RWbThFeUhDbnlDM19LWS1acDktYUhxSHd1eUdwLU5Kc2hNbkJ1VkxEd1RyaVhmTzNYbWhzREJUel83ZUM0MXI2c014b3FGQjRGTmR6WFN3NUdJ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "TSMC が値幅制限下限に達し、台湾加権指数は取引初盤で3,700ポイント以上急落", "title_en": "Taiex plunges over 3,700 points in early trading as TSMC hits limit down - Focus Taiwan", "summary_ja": "台湾の主要株価指数である台湾加権指数が取引初盤で3,700ポイントを超える大幅な下落を記録しました。この急落は、半導体大手のTSMC（台湾積体電路製造）が値幅制限下限に達したことが主な要因となっています。市場全体に売り圧力が高まっている状況が続いています。", "summary_en": "Taiex plunges over 3,700 points in early trading as TSMC hits limit down Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9VaTNQM1Mtdmtjb1YwSm84a2ZkUUljNlpUMmhrSjZ2NnFMZFJtT282YWZ2cW0zZHdfZ3BLOG9laTVuUl9Nby1OVTJTY2NGTUM3TWNSWmpDRQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "高金議員が国家安全保障と腐敗容疑で起訴される", "title_en": "Lawmaker Kao Chin indicted on national security, corruption charges - Focus Taiwan", "summary_ja": "台湾の議員である高金氏が、国家安全保障関連の容疑と汚職容疑で起訴された。この起訴は司法当局による調査の結果となっている。詳細な容疑内容については、進行中の事件の展開を注視する必要がある。", "summary_en": "Lawmaker Kao Chin indicted on national security, corruption charges Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFB5Z "summary_en": "Global dialogue discusses China's governance and worldwide development", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-11-06/Global-dialogue-discusses-China-s-governance-and-worldwide-development-1RPOeP5SiRy/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカのエルニーニョ対策：早期警報から早期対応へ", "title_en": "Africa's El Nino readiness: From early warning to early action", "summary_ja": "CGTNは、強まるエルニーニョ現象がサブサハラアフリカを二分し、東アフリカでは深刻な洪水、南部アフリカでは干ばつが発生していると報じています。同メディアは、現代の気候科学がこうした環境危機を数ヶ月前に予測できるようになったと指摘しています。", "summary_en": "The intensifying El Nino weather phenomenon has divided Sub-Saharan Africa along extreme meteorological lines, precipitating a dual crisis. East Africa faces severe flooding and Southern Africa suffers from parched droughts. Modern climate science successfully anticipates these environmental shocks ", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-11-04/Africa-s-El-Nino-readiness-From-early-warning-to-early-action-1RMjIeXKeCk/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国連海事機関、ホルムズ海峡での船員死亡数が2月28日以降25人に達したと報告", "title_en": "UN Maritime Organization says 25 sailors died in Strait of Hormuz since February 28", "summary_ja": "TASS/RTが伝えたところによると、国連海事機関は2月28日以降、ホルムズ海峡において25人の船員が死亡したと報告している。同地域では商船への攻撃が130件に上っているという。この報告は国家管理メディアのソースからのものである。", "summary_en": "The number of attacks on commercial vessels in the region stands at 130", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2214123", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン、ペルシャ湾のゲシム島上空で米無人機を撃墜したと報告", "title_en": "Iran shoots down US drone over Qeshm island — agency", "summary_ja": "タスニム通信社によると、イランの防空システムがMQ-9無人機を撃墜したとのことです。この報道は国営メディアのTASS/RTが伝えています。事件の詳細な状況については、現在のところ確認中です。", "summary_en": "As reported by Tasnim, an MQ-9 drone was destroyed by the air defense system", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2214121", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パラグアイ前大統領ペーニャ氏、銀行破綻事件で拘束 — 新聞報道", "title_en": "Paraguay ex-president Pena detained over case of bank collapse — newspaper", "summary_ja": "TASS/RTが報道したところによると、パラグアイの前大統領サンティアゴ・ペーニャ氏が銀行破綻事件に関連して拘束されました。検察庁は信任濫用の罪でペーニャ氏を起訴しており、ウエノ銀行を通じた資金横領への関与が疑われています。", "summary_en": "The Prosecutor’s Office previously filed charges of abuse of trust against Santiago Pena and suspects him of involvement in the embezzlement of funds through Ueno Bank", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2214119", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの戦争による経済的負担", "title_en": "The Economic Toll of Israel’s Wars", "summary_ja": "イスラエルの経済は表面的には堅調に見えるが、3年間の戦争は株式市場の好調さや通貨高騰が示唆するよりもはるかに大きな損害をもたらしている。防衛支出と政府債務が急増し、生産と投資の減少は長期的な景気後退を指し示している。著者は、今後発足する政府がイスラエルの継続的な戦争にかかる増加し続ける経済的コストに対処する必要があると主張している。", "summary_en": "Israel’s economy may look strong, but three years of war have inflicted far greater damage than its robust stock market and appreciating currency suggest. Defense spending and government borrowing have risen sharply, while falling output and investment point to a prolonged recession.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/israel-economic-resilience-is-an-illusion-by-joseph-zeira-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Economic Toll of Israel’s Wars\nIsrael’s economy may look strong, but three years of war have inflicted far greater damage than its robust stock market and appreciating currency suggest. Defense spending and government borrowing have risen sharply, while falling output and investment point to a prolonged recession.\nJERUSALEM—Israel’s election results make weeks of political negotiation all but certain. What is equally clear is that whatever government eventually takes office will need to begin reckoning with the mounting costs of Israel’s ongoing wars.", "translation_ja": "", "vocab": []}, {"title_ja": "自然の帳簿を再均衡させる", "title_en": "Rebalancing Nature’s Books", "summary_ja": "クンミン・モントリオール生物多様性枠組みの実施評価は低迷しており、その主な理由は政府の無関心ではなく、グローバルな経済・金融システムが自然破壊に報酬を与え、自然保護に罰を課しているためである。2023年に自然に投資される1ドルに対し、30ドルが自然破壊に費やされており、年間700億ドルの生物多様性資金ギャップを埋めるには、自然に害をもたらす補助金を年間500億ドル削減し、年間200億ドルの追加資金を動員する必要がある。根本的な問題は、市場の失敗だけでなく、経済的価値評価と自然の真の価値のミスマッチにあるという。", "summary_en": "The first report card on the implementation of the Kunming-Montreal framework was issued at this year’s UN Biodiversity Conference in Yerevan, and the marks were dismal. The problem is not a lack of targets, but a global financial system that pays to destroy nature and penalizes those who protect it", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/meeting-nature-targets-in-kunming-montreal-framework-requires-focus-on-bioeconomy-by-homi-kharas-et-al-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Rebalancing Nature’s Books\nHomi Kharas, Julie McCarthy, and Ichiro Sato\nThe first report card on the implementation of the Kunming-Montreal framework was issued at this year’s UN Biodiversity Conference in Yerevan, and the marks were dismal. The problem is not a lack of targets, but a global financial system that pays to destroy nature and penalizes those who protect it.\nWASHINGTON, DC—Four years ago, the United Nations Biodiversity Conference in Montreal adopted the Kunming-Montreal Global Biodiversity Framework, hailed at the time as the “Paris agreement for nature.” But the first assessment of the framework’s implementation, released at October’s UN Biodiversity Conference (COP17) in Yerevan, makes for sobering reading. The State of Biodiversity Action report finds that while nearly 90% of countries have set targets to protect 30% of land and sea areas, restore 30% of degraded ecosystems, and halt human-caused extinctions, fewer than half of the assessed targets are on track to be met by 2030.\nUN Secretary-General António Guterres called COP17 “our moment of accountability.” But while accountability is long overdue, finding a solution requires accurately diagnosing the problem. The Kunming-Montreal framework is faltering not because governments are indifferent to nature, but because global economic and financial systems reward nature’s destruction and penalize its protection. According to the UN Environment Programme, in 2023, $7.3 trillion—roughly 7% of world GDP—flowed into activities that directly harm nature. For every dollar invested in nature that year, $30 was spent destroying it.\nThe Kunming-Montreal framework calls for closing the biodiversity finance gap, which amounts to $700 billion annually, by reducing nature-harming subsidies by $500 billion per year and mobilizing $200 billion per year in incremental finance, including $30 billion from external official sources. Well over half of that investment is needed to implement sustainable management practices for farmland, rangeland, fisheries, and forests. The remainder is for ecosystem restoration and preservation.\nThe issue is bigger than market failures. As David Obura argues in our co-edited volume Nature, People, and Sustainable Development, there is a fundamental mismatch between what we value and what is needed. At best, prices capture nature’s usefulness. To reflect nature’s relational or intrinsic worth requires reframing the problem as not just conservation, which looks like a cost—land tied up and growth forgone—that rich countries foist on poor ones. Credit-ratings agencies, pointing to the risk of slower growth, then downgrade developing countries’ credit ratings.\nA far better approach is to emphasize the bioeconomy’s potential, which positions protecting nature as a growth strategy. Around 55% of global GDP—equivalent to $58 trillion—already depends directly on nature. The bioeconomy, which uses biological resources in a regenerative and nature-positive way, is worth about $4 trillion today; unlocking its potential could boost its value to $30 trillion by 2050 and link producers to global supply chains that can steer them toward higher value-added activities.\nThe problem of underinvestment is most acute in countries with abundant natural resources but limited fiscal space, including Indonesia, Brazil, Peru, Zambia, Ecuador, the Philippines, and Mozambique. These governments often rely on extractive activities such as logging, mining, and plantation agriculture to earn foreign exchange, which tends to go toward servicing their external debt. The resulting ecological damage leaves them more exposed to floods, droughts, storms, and other climate disasters that usually lead to rating downgrades. By contrast, debt frameworks do not properly account for the benefits of building resilience to such shocks.\nCreating the right incentives is especially important in commodity supply chains. For example, Côte d’Ivoire and Ghana produce nearly two-thirds of the world’s cocoa supply, almost entirely on small farms. But 73–90% of households producing cocoa in these countries earn little income from it, and cannot afford the fertilizer and weed-control costs of replanting aging trees, so they push into forests where it is cheaper to plant new ones.\nBut with chocolate trading, processing, and manufacturing concentrated in a handful of firms, a few players can have an outsize impact on global outcomes. The European Union, which imports about 58% of the world’s cocoa beans, will begin to apply the Deforestation Regulation to large operators starting in December, making access to the European market for cocoa, coffee, and other commodities conditional on deforestation-free supply chains. But to improve compliance, some of the big traders should be encouraged to finance replanting and traceability efforts, so that smallholder farmers can meet the rules and earn more by doing so.\nProtecting nature is also a security imperative, with environmental crime—il", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの民主主義を復活させることができるのはアラブ系政党だけ", "title_en": "Only Israel’s Arab Parties Can Restore Its Democracy", "summary_ja": "イスラエルの最近の選挙は期待されていた変化をもたらさず、膠着状態に陥った。著者は、野党勢力がアラブ系主導政党と連立を組むことで、ネタニヤフ首相だけでなく、彼が体現する暴力的で人種差別的なイデオロギーも打ち負かし、イスラエルの民主主義を復活させることができると主張している。", "summary_en": "While Israel’s recent election did not deliver the transformation for which many might have hoped, it could open the way to restoring Israeli democracy. By building a coalition with the Arab-led parties, the opposition bloc could defeat not only Benjamin Netanyahu but also the violent, racist ideolo", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/israel-liberal-bloc-must-form-a-coalition-with-arab-parties-by-shlomo-ben-ami-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Only Israel’s Arab Parties Can Restore Its Democracy\nWhile Israel’s recent election did not deliver the transformation for which many might have hoped, it could open the way to restoring Israeli democracy. By building a coalition with the Arab-led parties, the opposition bloc could defeat not only Benjamin Netanyahu but also the violent, racist ideology he embodies.\nTEL AVIV—Before Israel’s election, I warned that no one should pin high hopes on the outcome. Sadly, that advice has been vindicated. An electorate deeply split along tribal and cultural lines did not hold Prime Minister Benjamin Netanyahu accountable for multiple prolonged wars, overseeing countless war crimes, and decimating Israel’s global standing. Instead, the vote delivered a deadlock.", "translation_ja": "", "vocab": []}, {"title_ja": "AIバッシュに関するガーディアン見解：米国民は自らの未来に発言権を求めている", "title_en": "The Guardian view on the AI backlash: American voters want a say in their future | Editorial", "summary_ja": "今週の中間選挙でAIブームの政治的代償が現れた。民主党の勝利は、データセンター拡大への抵抗と関連する支出増加や債務増加への懸念が、多くの米国民の優先事項であることを示している。トランプ前大統領はAI規制への有権者の要求を無視したため、共和党は選挙で代償を払い、データセンター建設に批判的な民主党候補が全米で勝利した。", "summary_en": "Tech stocks have lost trillions while voters have rejected the industry’s political champions. The billionaire-led boom is facing a democratic reckoning This week’s midterms showed that the political bill for the AI boom is falling due. The Democratic sweep intensified fears over runaway spending, m", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/06/the-guardian-view-on-the-ai-backlash-american-voters-want-a-say-in-their-future", "state_media": false, "category": "オピニオン", "full_text": "This week’s midterms showed that the political bill for the AI boom is falling due. The Democratic sweep intensified fears over runaway spending, mounting debt and resistance to datacentres, sending tech shares tumbling. On Thursday Wall Street suffered its worst day since the pandemic as $3.2tn was wiped from markets. Anthropic, developer of the Claude chatbot, is hoping to float within the next fortnight for $1.5tn (£1.1tn), but it may not now get even a trillion dollars. The dominant AI chipmaker Nvidia saw its value crash by more than $400bn. The world’s richest man, Elon Musk, lost $113bn in two days.\nWhile a few very rich people may be a little less wealthy, the sell-off may not be a bad thing. It brings a needed dose of reality to an industry whose spending plans and valuations depend on heroic expectations of future profits. That is a view held by many influential figures – from Goldman Sachs’ research boss to Nobel laureate Daron Acemoğlu. AI may transform the economy. That does not guarantee investors will earn back the sums being poured into it.\nDonald Trump is the other big loser. He rejected concerns about AI and the need to impose stricter rules despite most Americans wanting more safeguards. He called concerns about the potential dangers of AI development a “hoax”. Republicans paid a price for his refusal to listen. Mr Trump argued computing capacity was a national asset that needed to expand rapidly, while dismissing resistance to the infrastructure and the companies building it. The US president was deaf to voter frustration over electricity prices, water demand and disruption. Democrats could campaign against those costs falling on residents while the gains went to tech billionaires and their companies, which donated money to Mr Trump’s favoured causes.\nMr Musk’s SpaceX, a combined space, satellite-connectivity and AI group, warned in its June 2026 prospectus that new regulations could derail its growth plans. He spent $200m in Texas for Republicans as Democrats took aim at AI datacentres in a state where there was rising voter discontent over the industry’s rapid expansion. Mr Musk could not buy this election. Democrats won a US senate seat, the state governorship and wiped out every other statewide Republican office, taking the Texas house with a comfortable margin. Across the US, the blue wave saw wins for Democrats who have been critical of datacentre construction and pledged to slow or pause their rollout.\nDemocrats say they intend to make AI companies answerable for the environmental and societal costs of their infrastructure buildup as well as the harm their products cause. The new Congress is likely to be much more ready to shield voters from rising prices caused by datacentre expansion, ensure independent safety testing for advanced AI and clarify liability for possible harms. Democrats’ willingness to take public fears about AI seriously is welcome. People need confidence that elected governments can protect their livelihoods and communities.\nWhatever happens to tech stocks, the genie of AI won’t be put back into its lamp. This year alone the technology was given as the reason 120,000 Americans lost their jobs. Politicians ought to strengthen workers’ bargaining power and ensure that productivity gains are fairly shared. Just letting the markets decide will only deepen the economic insecurity and political distrust that is corroding democracy.\n- Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": []}, {"title_ja": "歴史上最も多様で反体制的な議会の誕生は楽観の理由", "title_en": "The most diverse, anti-establishment Congress in history is cause for optimism", "summary_ja": "本論考は、中間選挙の結果、米国民が歴史上最も多様で反体制的な議会を選出したことを指摘する。著者は、候補者たちが有権者に自らを映し出させ、人種差別的・排外主義的・トランスフォビア的なレトリックの拒否につながったと主張する。政治的な怒りや無感覚に代わり、共感と希望の感情が生まれたことが、民主主義の回復と人間らしさへの許可を意味していると述べている。", "summary_en": "After years of outrage or numbness being the main options for dealing with politics, Tuesday’s results were permission to be optimistic This was originally published in the Stakes 2026, a newsletter about the midterm elections. Sign up to get it in your inbox We shed some tears this midterm cycle. U", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/us-news/2026/nov/05/congress-midterms-diverse", "state_media": false, "category": "オピニオン", "full_text": "We shed some tears this midterm cycle.\nUS politics always makes people emotional, but I heard from friends and colleagues many times this year that speeches, campaigns and underdog success stories moved people in unexpected ways, whether it was this ad of Michigan senator-elect Abdul El-Sayed doing bedtime, a photo of newly elected Texas Democrats James Talarico and Gina Hinojosa at a Whataburger, or Georgia’s Keisha Lance Bottoms becoming the first Black female governor in the entire country.\nWhile you might reduce this to Democrats being happy about historically defeating the Republican party and Trumpism, there’s something much deeper to be seen and felt in Tuesday’s election results. A broad coalition of Americans, including Republicans, independents and those who had never voted before, decided to elect the most diverse, anti-establishment Congress in history.\nPeople saw themselves reflected in the candidates, some first rejected by party leaders. In Maine, Troy Jackson, who entered the race at the last minute after the spectacular collapse of Graham Platner’s campaign, has bona fide blue collar credentials. El-Sayed is a son of Michigan, reflecting communities that have long resided in the state but never been represented in the Senate. Annie Andrews in South Carolina came from a true grassroots effort to elect pro-science candidates at a time when children are dying from measles.\nAlong with that came a repudiation of some of the racist, xenophobic, transphobic and other rhetoric that has escalated in recent years. Bo French, the Texas politician who had posted a racist diatribe about south Asian students at a football game, lost his election, along with Vivek Ramaswamy and his abhorrent attack ad, Ken Paxton with his transphobic AI ads, and Mike Collins and his multiple associations with neo-Nazis. At a time when the Trump administration itself peddles racist tropes on its X account and at rallies, there were tears of relief and cautious hope of an era of decency.\nWhen people told me in recent months that something made them cry they seemed almost embarrassed. But I see it as a very good sign. After years of outrage or numbness – fight or flight – being the main options for dealing with political news and the impacts of those in power, this kind of catharsis and joy feels like permission to be human and to be optimistic.\nThis is not to say voters in the US have any illusions that the newly elected public servants will immediately resolve political gridlock and restore normalcy to the country. Trump is unlikely to go quietly into the night his final two years in office, and Democrats have a track record of bungling opportunities to make big, bold progress. But seeing engagement and investment in the future take the place of the nihilism that has characterized the Trump era has been refreshing.\nIt’s a feeling that some are comparing to Barack Obama’s first election. As congresswoman Alexandria Ocasio-Cortez herself said in a video to young voters who helped power the massive political shift: “If you want to understand millennial cringe … this earnestness, imagine all the seats we flipped last night plus on top of it electing the first Black president ever, and on top of that you did it the first time you voted.”\nIn an election that did what has recently seemed impossible: turning Texas blue, dumping Trump’s handpicked candidates, openly rejecting bigotry, the tears and the cringe are just history being made.", "translation_ja": "", "vocab": []}, {"title_ja": "奇妙な選挙後の感覚とは？ああ、そうか—純粋な喜びだ", "title_en": "What is this strange, post-election feeling? Oh right – it’s utter joy | Dave Schilling", "summary_ja": "本論説では、著者デイブ・シリングが選挙当夜に感じた珍しい感情——喜びと楽観主義——について論じている。過去10年間の絶え間ないネガティブなニュースの中で、左派支持者たちは選挙結果に驚喜し、この感情を表現する言葉さえ見つからないほどであった。著者は、この予想外のポジティブな感覚が、現代アメリカ人にとっていかに異質で貴重であるかを強調している。", "summary_en": "A decade of political misery does terrible things to the mind. Tuesday’s wins came with a sense of unreality Late on Tuesday night, the comedian Alex Edelman asked a poignant question on social media : “I know we’ve never had to ask this before tonight, but what’s the opposite of doomscrolling?” I d", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/06/post-election-feeling-optimism", "state_media": false, "category": "オピニオン", "full_text": "Late on Tuesday night, the comedian Alex Edelman asked a poignant question on social media: “I know we’ve never had to ask this before tonight, but what’s the opposite of doomscrolling?”\nI don’t have a definitive answer to that, though I did offer the term “boomscrolling”, accompanied by a gif of the social media sensation and Costco enthusiast Big Boom AJ.\nAJ and his son became famous for yelling “Boom!” after biting down on revolting, sodium-infused food from Costco’s food court while flexing meaty biceps.\nIt strikes me as an apt illustration of how we all felt as election day unspooled before us. After every miraculous call, I couldn’t help but flex my muscles and let out a howl to the heavens. How is this real? Boom, indeed.\nThose of us who consider ourselves liberal or left or progressive or whatever buzzword my media colleagues want to ascribe to general human decency were left somewhat incapable of making literal sense of what we were witnessing on Tuesday night. Texas and Iowa and Kansas? Mississippi and Alaska in play?\nIt’s like a democracy simulation game spit up an outcome so improbable that you start to wonder if it’s glitching out. The soaring, optimistic oration from Jon Ossoff and James Talarico had us crying. At least I was. I’m a large baby-man who cries when a bonus curly fry accidentally lands in my takeout bag.\nAbdul El-Sayed’s righteous anger at the Trump administration had me ready to run through a brick wall. And the thousand-yard death stares of conservative pundits on the various cable news channels delivered the schadenfreude my life has sorely lacked.\nThe feelings were potent, but deeply unfamiliar. It was not all progressive triumph – anti-trans bills passed in numerous states and California’s one-time billionaire tax seems destined to fail – but the macro-message sent by voters was clear. Maybe this Trump thing didn’t work out quite like his people hoped.\nIt’s been over a decade since Donald Trump announced his candidacy for president. In that decade, I’ve aged 20 years. A steady dearth of good news does terrible things to the body and the mind.\nNo wonder people are tweeting about not having a name for how they feel. Happiness and optimism are as foreign to the people of 2026 as a Samsung Galaxy would be to a Victorian-era eel merchant. Good cheer is an invading antigen to modern Americans, but one I welcome with open arms. There’s no cure for what I have, and thank God for that.\nTuesday was like the intermission in the middle of The Brutalist – a chance to go outside and breathe fresh air before a third act where things could potentially get worse. I famously don’t watch cable news, but I stayed up past midnight with the glee of a child on Christmas Eve. I was as elated and giggly as Rachel Maddow throwing away a statement from President Trump live on the air. I chortled at the thought of John Fetterman – the Democratic senator some feared would turn Republican – losing his remaining shred of relevance in the Senate and returning to his old job, carrying Krang from the Ninja Turtles around in his stomach.\nBut, despite my numerous suggestions to the LA mayor-elect, Nithya Raman, we can’t have an election every day. This euphoria will fade, and then we’re stuck with the drudgery of actual day-to-day governance by the Democratic congressional majority.\nWhat will the priorities be? Abolishing the electoral college? Impeachment? Medicare-for-all? Ending funding for the Iran war? Crazy hat day on the Senate floor? Coca-Cola Freestyle machines at every bus stop?\nI think part of the dizziness that is afflicting the liberal American populace is that, in some ways, anything is possible. If the electorate speaks with such a clear voice, what’s stopping us from accomplishing something remarkable?\nSome people will understandably point to the limited ambition and moderate rhetoric from Democratic leadership. They’ll roll their eyes and point to the countless times the Democrats controlled Congress, bungled it and handed it back to the Republicans.\nI get that impulse. The worst thing we on the left can do is to cheer for an electoral victory and then take a two-year nap until the presidential election. But I fully support “libbing out” and enjoying the open road, the possibilities, and the potential.\nFor the first time in years, the Democratic bench is full of superstar politicians. The wind is at our backs, and the mood of the country matches our thirst for change.\nFor the next two months, I’m going to huff these fumes. I’m periodically going to tune into Fox News to see Jesse Watters fumble for his words while he silently dreams of getting a Russian passport.\nIt’s the holiday season, after all. Before Thanksgiving, before Christmas and New Year’s, I’m going to treat the glorious halo of this election like its own holiday. A holiday away from fear, panic and self-loathing. A respite from doomscrolling. A time for boomscrolling. I’m going to flex on the haters. I’ll be living my life on the t", "translation_ja": "", "vocab": []}, {"title_ja": "民主党は外交政策革命を起こす機会を無駄にすべきではない", "title_en": "Democrats Shouldn’t Squander Their Chance to Launch a Foreign Policy Revolution", "summary_ja": "著者は、米国の最大の安全保障上の脅威は外部ではなく国内にあり、民主党は新議会で単なるトランプ政権の批判にとどまらず、数十年にわたる米国の軍国主義的思考を根本から改革すべきだと主張しています。イラン戦争の終結と同時に、政治的腐敗や経済的不平等に対処することで、初めて真の外交政策の転換が実現すると述べています。民主党指導部は議会の権力を用いて、トランプ政権の監視だけでなく、米国外交の説得力のある代替案を提示すべきだと強調しています。", "summary_en": "The imperative of ambition in a new Congress.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/matthew-duss-democrats-squander-chance-foreign-policy-congress-midterms", "state_media": false, "category": "オピニオン", "full_text": "Tuesday’s election made clear that endless wars, political corruption, and the high cost of living are three of the American public’s top concerns. They are deeply interrelated—and the new Congress must address all three. That will require a true foreign policy revolution that grapples not just with the outrages and failures of the Trump administration’s foreign policy but also with the ways in which past Democratic or Democrat-supported foreign policies have contributed to today’s crisis. There will be a temptation among some Democratic leaders, in Congress and beyond, to limit the scope or pace of change. But to find a way out of today’s crisis and move beyond the failures that have afflicted American foreign policy for the past several decades, Democrats will need to have the courage to face a hard truth: that President Donald Trump’s abuses of power and unilateral warmaking are not so much a break from Washington’s militarist mindset as they are a particularly aggressive, predatory expression of it.\nThe incoming Democratic majority will face a national security environment in which the most severe challenges to U.S. safety and prosperity come from within. That’s why Congress should shut down the Iran war immediately but also recognize that it can make the United States more secure only if it pairs a foreign policy shift with a frontal assault on spiraling costs and political corruption. Political polarization; government corruption and dysfunction; increasing dominance of political and economic life by a small handful of mercurial oligarchs; and a president who recklessly and unilaterally launches unauthorized military interventions while relentlessly seeking opportunities to enrich himself, his family, and his cronies—all pose more immediate danger to the safety and prosperity of the American people than does any foreign enemy.\nWhen Democrats take control of Congress in January, they will have considerable power to challenge the corruption and malfeasance of the Trump administration. Control of committees and of the congressional calendar will provide the opportunity for sorely needed oversight. But although the Trump administration deserves aggressive investigation, Democrats must aim higher—and use the opportunity to articulate a genuinely compelling alternative for American foreign policy.\nA HARD LOOK\nThe first and most urgent task will be ending the Iran war, a reckless and unpopular conflict that has become even less popular as Americans have felt its effects on their wallets. Congress must respond to widespread bipartisan anger among voters at Trump’s war and abuse of war powers by using all the tools it has, especially its power to cut funding. It has been encouraging to see Democrats continuing to oppose any supplemental budget request by the administration for the war. It is an area where Democrats have gotten tripped up in the past when they’ve been afraid of accusations that they don’t “support the troops” if they oppose funding for foolish, counterproductive wars. With Democrats having held firm against any additional funding for the war, those days appear to be gone. That is good.\nBut Democrats need to go further. They should be prepared to oppose all funding for the military, including blocking votes on the National Defense Authorization Act, the annual bill setting out the broad scope and budget for the Defense Department, in order to put an end to hostilities in Iran. In fact, not only should they be willing to withhold funding from the Pentagon, but they should also be willing to withhold funding for the entire government, and threaten another government shutdown if the bill does not prohibit any funding for Trump’s war. December 11 is the deadline for a continuing resolution to keep the government funded and operating. If ever there was a reason for Democrats to threaten to withhold their votes, stopping a blatantly illegal and globally destructive war that American voters have now resoundingly rebuked is it.\nDemocrats must also be willing to take a hard look at the continuity between Trump’s use of military violence and past uses of force by administrations of both parties, and the bipartisan support for that violence. The groundwork for the Iran war was laid by the Biden administration’s unstinting support for Israel’s genocide in Gaza (as even some former administration officials have acknowledged), but also by years of U.S. refusal to impose any consequences on the Israeli government despite clear evidence of ongoing violations of human rights and international law. Trump’s strikes on alleged “narcoterrorist” drug boats in the Caribbean represent the logical evolution of long-standing treatment of the United States’ drug problem as a “war,” and of casually applying the label of “terrorist” to justify any and all measures, including execution without due process. Seeking accountability for these abuses will require acknowledging the past complicity of both Republicans and Democrats", "translation_ja": "", "vocab": []}, {"title_ja": "権力の真の意味", "title_en": "The True Meaning of Power", "summary_ja": "本論説は、国際政治の古典的理論家モーゲンソーの思想が単なる権力追求の正当化ではなく、権力と道徳性の調和を求めるものであったことを主張している。著者は、モーゲンソーがナチス・ドイツからの亡命者として、米国が国益を守りながらも権力を慎重に行使し、道徳的価値のために権力を活用すべきだと考えていたことを強調する。米国の過度な権力行使は、その権力の基盤を弱体化させるという警告が含まれている。", "summary_en": "What the godfather of realism can teach Trump.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/true-meaning-power-david-sacks", "state_media": false, "category": "オピニオン", "full_text": "“International politics, like all politics, is a struggle for power.” Hans Morgenthau wrote this sentence from his desk in Chicago at the dawn of the Cold War, as the United States and the Soviet Union embarked on an open-ended competition for global dominance. Politics Among Nations, the volume that Morgenthau ultimately produced, would quickly become the most widely adopted international relations textbook in the United States and provide an intellectual framework—realism—that would guide generations of scholars and policymakers.\nAlthough much has changed in the nearly eight decades since Morgenthau’s most influential work was published, the fundamentals remain the same. Human nature, which for Morgenthau drove the struggle for power, is unmoved. States are still the most significant actors in the international system and compete for influence. Great powers continue to drive the course of history. Much of today’s world would seem to affirm Morgenthau’s conclusions: Russia’s attempts to establish a sphere of influence in Eastern Europe, China’s quest for hegemony in East Asia, and the United States’ revival of the Monroe Doctrine in the Western Hemisphere all suggest the enduring primacy of national interests over moral aspirations and international norms.\nFor many, Morgenthau’s contributions begin and end with his identification of power as the key determinant of state behavior. But this reading misses one of his core observations: that even if humans tend to be power-maximizing creatures, they are also moral beings who seek to limit their own power. Morgenthau’s writings reveal a dialectic between power and morality—two seemingly incompatible concepts that he spent his life attempting to reconcile. Far from romanticizing power, Morgenthau saw the need to tame it.\nAn immigrant who escaped Nazi Germany and owed his life to the United States, Morgenthau had specific guidance to offer his fellow Americans. Even as he urged the United States to protect its vital interests by maintaining a favorable balance of power in key regions, he implored the country to wield its power prudently. Morgenthau saw the United States as the only country with both the capacity and the will to fight on behalf of transcendent values that he believed power had to serve. He was committed to preserving American power as a check on the violence and bigotry he experienced. Yet he feared that U.S. overreach would hollow out the foundations of that power. This, for Morgenthau, would be a tragedy for humanity.\nPerhaps no government has misread Morgenthau more than the second Trump administration. Its officials revel in the exercise of military force around the world, from Iran to Venezuela and the Caribbean, while dismissing concerns of alleged war crimes and threatening long-standing allies. White House Deputy Chief of Staff Stephen Miller typified the Trumpian outlook when, in January, he invoked the “iron laws of the world,” one “governed by strength,” “governed by force,” and “governed by power.”\nSome analysts have also erroneously rooted the Trump administration’s actions in realism. A lengthy essay in The New York Times Magazine, for instance, ran under the headline “The Theory That Gives Trump a Blank Check for Aggression.” This is understandable, as the Trump administration has repeatedly claimed its actions are underpinned by “flexible realism.”\nBut any reading of realism that does not consider the moral dimensions of Morgenthau’s theory is both mistaken and dangerous. When the United States limits its own power, abiding by international norms, consulting allies and partners, and wielding its strength in pursuit of transcendent values, countries find American influence more palatable, which helps sustain it. But if Washington’s actions become untethered from these restraints, others will no longer defer to American prerogatives, and the world will become a more dangerous place.\nReturning to the foundations of realism—to the man who introduced this intellectual tradition to Americans—is critical. If Morgenthau were to witness this moment in U.S. history, he would conclude that the country had overlearned his lessons about the importance of power and erred in equating it with the use of force. He would see a need to elevate moral questions and rebuild normative constraints on the exercise of power. And he would warn against foreign entanglements that undermine American democracy, which remains the wellspring of the country’s power. These are the lessons that will help the United States navigate an era of intensified great-power competition, one in which the margin for error is thin and the cost of miscalculation could be catastrophic.\nOUT OF EUROPE\nMorgenthau was born into an assimilated, middle-class Jewish family in southern Germany in the winter of 1904. His conservative and authoritarian father, Ludwig, raised his only child to revere the monarchy and take pride in their country’s achievements. Morgenthau’s childhood might hav", "translation_ja": "", "vocab": []}, {"title_ja": "富裕層への課税強化は避けるべき", "title_en": "Don’t Soak the Rich", "summary_ja": "本論説は、富の集中が民主主義を脅かすという主張が西側民主主義圏で広がっており、富裕税などの没収的課税が解決策として提案されていることを指摘しています。著者は、富豪による政治的影響力そのものが民主主義の脅威ではなく、むしろそうした利益から国民を守るために設計された政治・市民機関の強さがより重要であると主張しており、富裕税ではなく民主主義機関の強化に焦点を当てるべきだと提言しています。", "summary_en": "Weak institutions—not private fortunes—deform democracy.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/dont-soak-rich", "state_media": false, "category": "オピニオン", "full_text": "As private wealth continues to grow to levels never before seen in modern history, a powerful idea is taking hold in the West: the accumulation of great fortunes poses an existential threat to democracy. This idea is not novel. Over a decade ago, the political scientists Jacob Hacker and Paul Pierson asserted that the rise of plutocracy has been a defining trend of American politics since the late 1970s. The economist Paul Krugman argued in 2011 that the “extreme concentration of income is incompatible with real democracy.”\nLately, however, it has begun to gain traction in the halls of power of Western democracies. In his farewell address, former U.S. President Joe Biden argued that an “oligarchy of extreme wealth, power, and influence” was threatening “our entire democracy, our basic rights and freedoms.” Spanish Prime Minister Pedro Sánchez echoed the sentiment at a 2025 G-20 summit, warning that concentrated wealth “corrodes democratic institutions.”\nSome now see confiscation as the answer. After a bitter debate and over $300 million of cumulative spending by supporters and opponents, Californians rejected a statewide “billionaires’ tax” ballot measure in this week’s midterm elections. But the proposal counted among its proponents six Nobel laureates in economics, including Daron Acemoglu, Peter Diamond, and Joseph Stiglitz, who endorsed the tax in a letter framing it as “a turning point in the battle between democracy and oligarchy.” The French economist Gabriel Zucman called the measure’s defeat “just the beginning” and vowed that though “Silicon Valley billionaires have won this battle … they will lose this war.” Several European political leaders, including the former German Green Party leader Annalena Baerbock and Danish Prime Minister Mette Frederiksen, have floated wealth tax proposals of their own in recent years.\nThe risk they have identified is genuine. Democratic societies are not doing enough to prevent the superrich from unduly influencing politics. But their diagnosis—not to mention their preferred solution—is incorrect. Billionaires’ participation in politics does not in itself indicate that a democracy has been captured by moneyed interests. The strength of the political and civil institutions meant to protect against the exercise of those interests is a far more important indicator.\nInstead of imposing wealth taxes, countries that are serious about safeguarding their political systems should take their cues from those democracies that have successfully insulated their politics from the influence of large fortunes. They should adopt transparent election laws and restraints on private campaign contributions and encourage a strong, independent media. Such measures will help make societies more democratic. Taxing wealth will simply make them poorer.\nTHE EIGHT PERCENT OF THE ONE PERCENT\nArguments in favor of taxing wealth in the name of democracy often hinge on an understanding of billionaires as a monolithic bloc, committed to an agenda that runs counter to the public interest. These claims contain a kernel of truth. According to the benchmark V-Dem and Freedom House indices, the United States has indeed been in a state of democratic decline since the early 2010s. But it does not follow that billionaires as a group are responsible for this decline—or that such a unified group even exists.\nTo empirically determine its existence, I classified the richest Americans in the 2026 Forbes 400 listing according to their traceable political donations, analyzing both their average annual giving and their total giving over the past three decades. This method is no doubt imperfect—donations can be informal or hidden and are not the only way to achieve political influence—but the pattern that emerges should nonetheless cast doubt on the idea of a single billionaire class marching on Washington.\nThe evidence shows that roughly 30 individuals, or eight percent of U.S. billionaires in the Forbes 400, are high-level donors, giving more than $1 million each year for political purposes. Roughly half of American billionaires give on average less than $30,000 a year, 35 percent give less than $10,000, and 15 percent, or 60 of the listed billionaires, have no visible political footprint. Just 16 donors—four percent—have given more than $50 million over the last 30 years. This small minority may well plow enough money into elections to make up for the majority of billionaires with no apparent interest in politics (although if Elon Musk’s midterm outlay is any indication, even vast sums of money are no guarantee of political outcomes). But the very fact that both these groups exist suggests that the presence of the ultrawealthy alone is not necessarily responsible for American democratic decay. The weakness of the institutions meant to check their influence, on the other hand, is.\nBUYING POWER\nFor the American billionaires who do engage in politics, federal rules and institutions make it easy to achieve disproportio", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-07 00:27 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
