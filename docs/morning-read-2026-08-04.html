ews/articles/cn4n03xg981o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Video shows Russian drone chasing Ukrainian street vendor in 'human safari' attack\n- Published\nUkraine's President Volodymyr Zelensky has shared a video on social media of a drone hunting down a man in southern Ukraine, saying it showed an instance of a Russian \"safari\" attack against civilians.\nThe video shows the drone pursuing a street vendor on a city street in the Kherson region. The man moves away from the drone hovering above, before it chases him as he runs around a white van. Eventually, the drone swoops down on him and explodes on impact.\nThe man escaped with multiple shrapnel wounds, concussion and trauma, a doctor said.\nSometimes called \"human safari\", the deployment of remotely-operated drones against civilians has often been used by Russians to terrify residents of front line areas in Ukraine.\n\"The world must see this,\" Zelensky wrote on Telegram. \"It must see every piece of evidence that Russia has gone mad, and every fact that Russian soldiers are enjoying killings and tormenting people.\"\nThe video showed a \"barbaric war crime\", said Ukraine's Foreign Minister Andrii Sybiha.\nThe safaris were a \"deliberate and systemic Russian strategy,\" Sybiha said. \"The sadist operating this drone knows full well that he is targeting a civilian.\"\nHe added the attack was part of a deliberate Russian campaign to intimidate civilians and demanded international condemnation.\nThe Kherson regional governor later posted a video showing the man - identified as Yuriy, a 52-year-old street vegetable vendor - speaking from a hospital bed following the drone attack.\nYuriy said he and his wife had started to lay out crates of vegetables next to his van when he heard a distinctive buzzing sound overhead.\nWhen his wife ran away, the drone turned to him instead. He held up some heads of garlic towards the drone's camera to show the operator that 近い5%の下落を見せ、米財務長官は数日以内に合意に達する可能性を示唆しました。しかし、過去の交渉失敗により市場は不安定であり、アナリストらは潜在的な合意の脆弱性について慎重です。", "summary_en": "Oil prices dropped to three-week lows after US officials announced progress in talks with Iran to reopen the Strait of Hormuz, a critical shipping waterway. Brent crude fell nearly 5% to under $80 per barrel, while US Treasury Secretary Scott Bessent suggested a deal could be reached within days. However, previous failed negotiations have made markets volatile, and analysts remain cautious about the fragility of any potential agreement.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cpw9v0gnzxwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Oil prices fall on hopes Strait of Hormuz could reopen\n- Published\nOil prices fell to a three-week low on Tuesday as senior US officials raised hopes of a deal with Iran to reopen the key Strait of Hormuz waterway.\nUS Secretary of State Marco Rubio and Treasury Secretary Scott Bessent both announced talks had progressed to allow shipments to potentially resume as soon as this week.\nThe cost of a barrel of Brent crude, the global benchmark for oil prices, fell by almost 5% to under $80 (£60) on the news of supply disruptions potentially being eased.\nBut the failure of previous negotiations in recent months to de-escalate the conflict between the US and Iran has led to a volatile oil market, with drivers ultimately being hit by higher fuel prices at the pumps.\nOn Tuesday, along with the drop in Brent crude, US West Texas Intermediate prices were down more than 5%, to $76 a barrel. Both contracts dropped to their lowest levels since 13 July.\nRubio said there had been progress made in discussions on getting more ships through the strait with Iran and Oman.\n\"There's been progress made in those talks, but not finality yet. We're hoping that will happen very shortly,\" he told reporters at the State Department.\nBessent said a deal to reopen the Strait of Hormuz could be agreed as soon as Tuesday or Wednesday.\nThere was a \"chance we may have a deal today or tomorrow to open the strait and move towards a more normalized position in this conflict,\" he told CNBC.\n\"It would be freedom of movement,\" he added, when asked whether Iran would be allowed to charge for ships passing through.\nWhile senior figures in the US government have announced talks have been progressing, no details of what a potential deal may look like have been released.\nIran has said it is not negotiating with the US - and has no plans to do so - and is instead talking to Oman.\nA spokesman for Iran's foreign ministry said that talks with Oman, a mediator in negotiations, on a new mechanism for vessels going through the Strait, had been positive.\nQatar, which is a key mediator between Washington and Tehran, said it was continuing efforts with other mediators to try to achieve a diplomatic resolution to the war, but admitted no direct talks were currently planned.\nThe Strait of Hormuz has been a central point in negotiations between the US and Iran. Before the conflict began in late February, the waterway handled about one-fifth of global daily oil and liquefied natural gas supplies.\nIran has halted most traffic through the Strait since the conflict began, while the US has also imposed a naval blockade of Iranian ports in the region.\nAnother blockade is in place on Saudi Arabia's ports in the Red Sea, imposed by Yemen's Iran-backed Houthis since 20 July.\nThe route had become a crucial alternative since Iran blocked the strait, but it has become increasingly dangerous, with a spate of attacks on vessels reported in the past week.\nOn Tuesday, a projectile sank an Indian-flagged vessel near Yemeni waters, the India's shipping minister said, with all 14 on board rescued.\nAnalysts believe the threat to ships carrying oil in the Middle East is at its worst since the Iran war started.\n\"Investors are acutely aware of how many times we've already been at this point in the war and how fragile the process of securing lasting agreements can be,\" said Danni Hewson, head of financial analysis at AJ Bell.\nThe disruption has sent prices at the pumps up across the world. In the UK petrol prices are now at levels seen at the start of the conflict, with the average cost of a litre of petrol hitting £1.60, according to the RAC motoring group.\nIn the US, gasoline prices are on average above $4 a gallon, according to the AAA. Diesel is almost $5.40 a gallon.\nPrices have surged to above $120 when the conflict has escalated and plunged in response to previous talks suggesting a breakthrough.\nThe elevated prices have led to major oil companies, such as BP, Shell, Chevron and Exxon Mobil, to report bumper profits.\nHowever, Hewson added that despite the huge revenues, oil companies were \"at the mercy\" of US President Donald Trump's \"machinations\".\nOn Monday, Trump warned Iran faced its \"last chance\" to agree a deal to allow commercial shipping to resume in the Strait.\nHe said he had called off \"massive\" strikes on the country for talks to resume.\nUS stock markets were trading higher on Tuesday following news of the negotiations lowering oil prices and also in response to corporate results related to Artificial Intelligence.\nInvestors have experienced jitters on Wall Street as results from Big Tech firms indicate spending on the technology is set to continue to soar.\nRelated topics\n  - Published14 July", "translation_ja": "", "vocab": [{"word": "de-escalate", "definition": "対立や紛争の程度を軽減する、緊張を和らげるという意味の動詞。ビジネスや国際外交の文脈で、問題を悪化させないための努力を表現する際に用いられます。"}, {"word": "volatility", "definition": "価格や市場が急激に変動しやすい状態を示す名詞。金融市場で予測不可能な価格変動の特性を表現するために頻繁に使用されます。"}, {"word": "blockade", "definition": "軍事的または政治的目的で港湾や地域への出入りを遮断する行為を指す名詞。貿易や物資の移動を制限するための戦略として用いられます。"}, {"word": "diplomatic resolution", "definition": "交渉や仲介を通じて紛争を平和的に解決することを指す表現。戦争や対立を終わらせるための外交的手段を意味します。"}, {"word": "bumper profits", "definition": "予想を大きく上回る利益や収益を指す表現。企業が異常に良い経営成績を上げた際に使用されるビジネス用語です。"}, {"word": "fragile", "definition": "壊れやすい、もろい状態を示す形容詞。協議や合意などが簡単に崩れる可能性がある場合に比喩的に使用されます。"}]}, {"title_ja": "EUがセウタの移民危機に対するスペインの対応を称賛", "title_en": "EU Praises Spain's Response to Ceuta Migrant Crisis", "summary_ja": "EUは、北アフリカのスペイン領土セウタへ2日間で約72,000人の移民が流入し、その後約70,000人がモロッコに送還されたことに対するスペインの迅速な対応を称賛した。イタリアが国境検査を一時停止するなど、一部のEU加盟国がスペインの対応を批判したにもかかわらず、EU内務大臣は連帯を表明し、移民問題への統一的なヨーロッパ的アプローチの必要性を強調した。", "summary_en": "The EU commended Spain's swift handling of a migrant surge in Ceuta where around 72,000 people crossed into the Spanish territory in North Africa over two days, with approximately 70,000 subsequently returned to Morocco. Despite some EU nations criticizing Spain's response, including Italy suspending border checks, EU interior ministers expressed solidarity and emphasized the need for a unified European approach to migration.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c80n3j55g0do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "EU commends Spain's 'swift response' to Ceuta migrant crisis\n- Published\nThe European Union has praised Spain's \"swift response\" to the migrant crisis in Ceuta, following a meeting of the bloc's interior ministers on Tuesday.\nAround 72,000 migrants crossed into the Spanish territory in North Africa between 30 and 31 July, Spain's Interior Minister Fernando Grande-Marlaska said. He added that an estimated 70,000 have since been returned to Morocco.\nAt least 75 people died on the Spanish side of the border, while 11 deaths were reported in Morocco.\nTuesday's meeting was called after several EU members expressed concern over Spain's handling of the crisis, with Italy describing images from Ceuta as \"shocking\" and suspending its Schengen agreement with Spain.\nIrish Justice Minister Jim O'Callaghan, who chaired Tuesday's meeting, said the EU stood in solidarity with Spain and that migration required \"a united European response\".\nThe meeting had been expected to draw some tension, following earlier criticism of Spain from some EU nations.\nOn Thursday, Italy's right-wing Prime Minister Giorgia Meloni said such \"uncontrolled immigration\" was a security threat to Europe.\nItaly suspended its Schengen zone agreement with Spain on free movement on Friday, but since the two countries do not share a land border, this would only apply, effectively, to flights - which appears simply to mean extra checks for passengers.\nThe Schengen agreement eliminates border checks and now encompasses more than 450 million people and 29 countries in Europe.\nFinland and Denmark backed Italy's move, while Czech Prime Minister Andrej Babiš urged a temporary suspension of Spain's Schengen membership.\nItaly, along with Denmark and 20 other nations, later sent a letter expressing their concern over the Ceuta migrant crisis.\nIn response, Spanish Prime Minister Pedro Sánchez said he had \"serious concerns\" about some European governments and pointed out that Ceuta was not part of the Schengen area.\nWhile most had shown \"support and solidarity\", he said other European governments had chosen to attack Spain, \"driven by prejudice, fake news, ignorance, or political interest\".\nSpeaking after the meeting on Tuesday, Grande-Marlaska said the Schengen zone had not been compromised and that he hoped Italy would lift any added controls \"as soon as possible\".\nDenmark's immigration minister Morten Bødskov said he was \"very satisfied\" with Spain's quick response, but added that the incident showed \"it is absolutely crucial that we have control over the EU's borders\".\nSpeaking afterwards, EU commissioner Magnus Brunner said the incident had been a \"test\" of European resilience and border security - which he said it had successfully \"passed\".\nBrunner added that the EU had offered Spain emergency financial support to strengthen its borders and manage the crisis.\nIt is unknown exactly what led the tens of thousands of migrants to cross from Morocco into Ceuta in a span of just a few hours last week.\nBrunner said it is thought that the influx was fuelled by criminal networks and social media disinformation.\nAyoub, a 23-year-old administrative assistant from Casablanca in Morocco, said he decided to swim across to Ceuta after seeing the situation unfold on social media.\nSpeaking to BBC World Service Newshour programme, he described it as \"the most traumatic experience I've ever had in my life\".\nAyoub said he wanted to reach Europe for a better quality of life.\n\"I haven't risked my life for nothing, I want to be free, I want to pursue my studies and I want a chance in life,\" he said.\nThe crossings came after Spain's Supreme Court ruled that migrants stopped at sea while trying to reach Ceuta or Melilla, another Spanish exclave, cannot be summarily returned to Morocco.\nMoroccan authorities later said that it had warned Spain the ruling would cause \"a problem\", but Spain rejected this claim, with a government spokeswoman saying it had no evidence or intelligence \"that alerted us to the magnitude of this unprecedented event\".\nSpain's interior minister said he was working \"firmly\" with Morocco to avoid further \"violations\" of Spain's borders and added that any migrants still in Ceuta would be returned to Morocco as soon as possible.\nImages from inside Ceuta on Tuesday showed crowds of migrants gathering near the beach to receive food, water and other aid. Some held makeshift banners with the word 'asylum' written on them.\nSeveral people were also pictured sleeping on the beach and on streets across the city.\nConcerns have been raised over the treatment of the remaining migrants, in particular of unaccompanied minors, with local media reporting some 800 children being held in facilities across the city.\nAhmed Haroun, a 29-year-old Sudanese migrant, said it had been his \"dream\" for years to reach Ceuta.\nHe told the Reuters news agency that he has family waiting for him, adding: \"I want to help them.\"\nHe said the situation had improved over the last few days and that he wa", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "周囲を他国の領土に囲まれた領土。スペインがモロッコ領土内に保有するセウタやメリリャなど、地理的に孤立した領土を指す。"}, {"word": "disinformation", "definition": "意図的に流布される虚偽の情報。この記事では、移民の大量流入をあおったソーシャルメディアの偽情報を意味する。"}, {"word": "solidarity", "definition": "共通の利益や目標のため、団結して支援する態度。EUがスペインの危機に対して示した共同の支援と結束を表す。"}, {"word": "Schengen agreement", "definition": "ヨーロッパ諸国間で国境検査を廃止し、自由な移動を実現する協定。29カ国以上が参加する協定で、イタリアが一時停止した対象。"}, {"word": "influx", "definition": "大量の流入または急激な増加。この記事では、セウタへの短時間での大規模な移民流入を指す。"}, {"word": "summarily", "definition": "迅速で簡潔な方法で、通常の手続きを経ずに。スペイン最高裁が移民の一時送還を禁止した判決を指す。"}]}, {"title_ja": "法務長官が受刑者早期釈放制度で被害者家族に謝罪", "title_en": "Justice Secretary Apologises to Families Over Early Release Scheme", "summary_ja": "アレックス・ノリス法務長官は、受刑者の早期釈放制度の影響を受けた家族に謝罪し、彼らが「過去の失敗のツケを払わされている」と述べた。強姦罪、児童買春、重大な児童性的虐待の有罪判決を受けた受刑者は除外されることになったが、刑務所の過剰収容の制約から、愛する者を殺害した受刑者の釈放適格性が残っているため、多くの家族は依然として落胆している。", "summary_en": "Justice Secretary Alex Norris has apologised to families affected by a prisoner early release scheme, acknowledging they are \"carrying the can from previous failures.\" While prisoners convicted of rape, grooming, and serious child sex offences will now be excluded, some families remain devastated that killers of their loved ones remain eligible for early release due to prison overcrowding constraints.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c20e15d0z6zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Justice secretary apologises to families affected by early release scheme\n- Published\nJustice Secretary Alex Norris has apologised to families affected by the early release scheme, saying they were \"carrying the can from previous failures\".\nFamilies, including a man whose pregnant partner died after being hit by a speeding driver, criticised the prisoner early release scheme, saying it comes \"at the expense of victims\".\nAndy Burnham announced that prisoners convicted of rape, grooming, and serious child sex offences will be excluded from the scheme in England and Wales. The prime minister said he wanted to exclude more, but prison overcrowding prevented this.\nCalvin Buckley said he was \"shocked and disappointed\" the killer of his partner and unborn child could be released early.\nThe mother of PC Andrew Harper also said she was \"devastated\" to learn two men jailed after her son was killed will still be eligible.\nThe prime minister said making more prisoners exempt was not possible without the prison system collapsing and putting the public \"at much greater risk\".\nJustice Secretary Alex Norris also warned a prison capacity crisis would be likely if fewer prisoners were allowed early release.\nNorris later said he spoke to the families as \"it is really important to express that this shouldn't be where it is\".\nHe also said he was confident the prisons would have adequate room now that about 1,000 extra prisoners will not be released early.\n\"We have modelled it very carefully,\" he said.\nPC Harper, 28, was killed in 2019 when he was dragged by a car down a country road as three teenagers fled the scene of a quad bike theft in Berkshire.\nHis family previously said they had received a letter from the Ministry of Justice confirming that two of the offenders could be included in the early release scheme.\nWhile the driver of the vehicle, Henry Long, received a 16-year sentence and would not be eligible, Jessie Cole and Albert Bowers, who were passengers in the car and sentenced to 13 years for manslaughter could apply for early release after serving half of their sentences.\nThe Sentencing Act was amended in January, with the eligibility for early release based on the length of fixed sentence, rather than the type of offence.\nThe act already excluded some of the most serious and dangerous offenders, such as murderers serving life sentences or those on extended sentences.\nBut last month the prime minister promised to \"review the policy\" and paused the scheme after a backlash from survivors.\nAnnouncing the changes on Monday, he said: \"I fully understand the anger, anxiety and distress that's been caused. I've heard that loud and clear.\"\nBut PC Harper's mother Debbie Adlam, told BBC Newsnight: \"It feels like we're letting Andrew down again\" to hear his killers might still be eligible for release.\n\"We've been through the justice system, we thought we'd done as best as we could.\n\"Now we're standing up to fight again... so I just feel really let down, for Andrew's sake as well as ours.\"\nShe added that Norris had called her to explain the situation and apologise.\nLater, on BBC Breakfast, Adlam called for more support from the probation service, stressing: \"I need to know at the very, very least if they are going to be released that we're kept in mind of what's happening and we are informed\".\nOther families have also criticised the early release scheme.\nCalvin Buckley's partner Frankie Jules-Hough and unborn child died in May 2023.\n\"Our justice is being taken away, I understand there's a crisis, I agree that it needs to be addressed, but not at the expense of victims,\" he told BBC Breakfast.\nClaire Corkery, whose parents, Sue and Tom, were killed by a speeding driver in January 2024, said \"it's almost like a tiered system, treating what has happened to us as less serious\".\nThe justice secretary said 5,000 extra releases will take place in 10 batches from October.\nBut the Prison Governors' Association (PGA) said it was \"unclear\" how many prisoners will have their sentences recalculated.\n\"We don't know if it is tens, hundreds or thousands,\" it said, adding that there will now be \"huge pressure on prison and probation staff to get the work of identifying prisoners now excluded and recalculating their sentences done\".\nThe justice secretary told the Today programme approximately 1,000 prisoners will now not be released early following the revision to the scheme.\n\"If we drew it any wider we would have a prison capacity crisis,\" Norris explained.\nPrisoners released on licence, Norris stressed, will be subject to \"very significant controls on their lives,\" adding victims will be consulted about these.\nLissie Harper, PC Harper's widow, said it was \"disgusting\" that his killers could be eligible for early release.\nShe said she was \"beyond appalled and bristling with anger to hear that Andrew's killers are soon to be free to roam the streets\".\nAnd Thames Valley Police Chief Constable Jason Hogg said the decision not to exclude them was \"d", "translation_ja": "", "vocab": [{"word": "backlash", "definition": "強い反発や反応。特に政策や決定に対する社会的な反対意見を指す。"}, {"word": "eligible", "definition": "特定の条件や基準を満たしており、何かの対象となる資格がある状態を意味する。"}, {"word": "capacity crisis", "definition": "施設や組織が受け入れ能力の限界に達し、正常な機能を果たせなくなる危機的状況。"}, {"word": "amended", "definition": "法律や規則などの内容を改正または変更することを意味する。"}, {"word": "manslaughter", "definition": "故意ではなく過失や一時的な感情で人を殺害した罪。殺人罪より軽い犯罪。"}, {"word": "licence", "definition": "有条件釈放された受刑者が社会で従わなければならない監視条件や規制を指す。"}]}, {"title_ja": "イギリス海峡で船が火災、170人以上の移民が救助される", "title_en": "Over 170 migrants rescued after boat catches fire in English Channel", "summary_ja": "火曜日の朝、フランスからイギリスへの渡航中にボートのエンジンが炎上し、170人以上の移民が救助されました。この事件は海峡を渡ろうとした単一の船舶としては最大規模となり、違法な小型ボート渡航の危険性を浮き彫りにしています。", "summary_en": "More than 170 migrants were rescued when their boat's engine caught fire while crossing the Channel from France to the UK on Tuesday morning. The incident marks the largest single vessel attempt to cross the Channel, surpassing the previous record of 165 people, and highlights the dangers of illegal small boat crossings.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4gkpeppjyqo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "More than 170 migrants rescued after boat catches fire in Channel\n- Published\nMore than 170 migrants have been rescued after the boat they were using to cross the Channel caught fire on Tuesday morning, as the UK government said \"all will be returned\" to France.\nThe boat was attempting to cross to the UK when its engine caught fire, according to the French maritime prefecture of the Channel and North Sea.\nIt had originally reported 157 migrants were rescued, but has since revised that figure up to 173. All have been taken to Boulogne-sur-Mer in France, with 11 people suffering from minor injuries.\nFrench prosecutors have opened an investigation, and an Egyptian national has been taken into policy custody in connection with the incident.\nBorder Security Minister Anna Turley said the incident \"shows the dangers of these illegal crossings and the ruthless gangs behind them\".\n\"That's why we are bearing down on them,\" she said.\nFrench authorities said the boat left France on Monday night.\nOvernight \"five people on board the vessel required rescue... the remaining people on board refused the assistance offered by the French patrol boats\", the French maritime prefecture said.\n\"Determined to reach the United Kingdom, migrants crossing the Channel in small boats refused assistance offered by French emergency service, accepting it only in situations of extreme emergency,\" it said in a statement.\nBecause of the \"structural fragility\" of boats used to cross the Channel, it said they decided not to intervene further at that stage.\nBut this morning the engine caught fire and the \"vessel's integrity deteriorated very rapidly\".\nRescue boats went to the scene from France and the UK, including the RNLI Eastbourne lifeboat and the UK Border Force vessels BSC Contender and BSC Courageous.\nThe French maritime prefecture said the operation involved 40 firefighters, 13 police officers, seven interpreters, and a number of medical personnel.\nIt had previously reported that 157 migrants were rescued, but on Tuesday afternoon revised that figure up to 173.\nOn top of the initial five rescued, two French boats rescued 105 migrants and the British boats rescued 63. All of them were taken to Boulogne-sur-Mer for treatment.\nThe total number on the boat broke the previous record of 165 people, who reached the UK late last month in a 42ft (13m) boat, making it the largest single vessel to attempt to cross the Channel carrying migrants.\nA UK government spokesperson said the Border Security Command was alerted to an incident in the Channel this morning \"concerning a migrant small boat in distress in French waters\".\nIt said British vessels assisted in the operation, adding that so far there have been no fatalities reported.\nThey added that the incident \"underlines the terrible dangers of small boat crossings\".\n\"We continue to work relentlessly with the French and our partners overseas to prevent these perilous journeys,\" they said.\nShadow home secretary Chris Philp said: \"This is why it's so wrong that French police stand by and do nothing while the illegal migrant boats embark – lives are being risked.\"\nReform UK leader Nigel Farage said in a post on X: \"We must put a stop to this. Our plan will save lives.\"\nEarlier this week, his party said if in government it would deploy the navy to ward off crossings.\nPolitical discussions around the UK's policies on illegal migration have resurfaced since tens of thousands of migrants swam into the Spanish exclave of Ceuta on Thursday.\nThe Conservatives have said that Labour has not delivered on its promises on migration, while the Lib Dems said the government should increase efforts to improve relationships with Europe and cut down the asylum backlog.\nThe number of migrants who have arrived in the UK on small boats since Burnham became prime minister a fortnight ago surpassed 2,000 on Saturday.\nLast Wednesday was the busiest day for crossings so far this year, with 752 migrants arriving in the UK.\nMost people attempt the crossing in the summer when conditions are better. It's also become the most common way for people to be detected entering the UK illegally.\nHome Office figures show the number of crossings so far this year are down about 43% compared to this time last year. The number peaked in 2022 and has been on a downward trend ever since.\nDuring a visit to Dover on Monday, Prime Minister Burnham pledged his government will be \"relentless\" in curbing the number of people arriving in the UK on small boats.\nHe said progress had been made in curbing the number of people arriving in the UK on small boats, adding that \"people want to see this issue addressed\".\nBurnham said enforcement officers tackling people-smuggling gangs have been doubled on both sides of the Channel, but \"a system that offers safe routes for people\" needs to be built as well.\nIn April, the UK and France struck a £662m (773m euro) deal aiming to stop illegal migrants from crossing the Channel.\nThe three-year agreement included plans", "translation_ja": "", "vocab": [{"word": "maritime", "definition": "海洋や海運に関連する。海事の、海上の。この記事では「French maritime prefecture」と使われ、海洋に関する行政機関を指します。"}, {"word": "deteriorated", "definition": "状態が悪くなる、劣化する。この文脈では船の構造的な完全性が急速に悪化したことを意味します。"}, {"word": "perilous", "definition": "危険な、非常にリスクのある。小型ボートでの渡航のような非常に危険な行為を表現するのに使用されます。"}, {"word": "fraught", "definition": "（fraught withの形で）～に満ちた、～に充ちた。この場合、危険や困難に満ちた状況を意味します。"}, {"word": "relentless", "definition": "絶え間ない、容赦ない、執拗な。政府の継続的で譲歩しない努力や取り組みを表現するのに使用されます。"}, {"word": "exclave", "definition": "飛び地。領土内で分断された地域、または他国に囲まれた領土。セウタはスペインの飛び地です。"}]}, {"title_ja": "ウェールズの山火事、意図的に放火された可能性 消防隊が消火活動を継続", "title_en": "Mountain fires deliberately started as crews battle blaze in Wales", "summary_ja": "ウェールズのランウォノ山で土曜日から続く大規模な山火事で、月曜夜に意図的な放火の報告があった。消防隊は低い雲や霧などの困難な状況の中で消火活動を続けており、大気汚染の影響を受ける住民のために避難所が設置されている。当局は疑わしい放火を調査中で、公衆に該当地域を避けるよう呼びかけている。", "summary_en": "Firefighters have been tackling a major wildfire on Llanwonno mountain in the Rhondda Valley since Saturday, with reports of deliberate fire setting on Monday night. Emergency services continue working in challenging conditions including low cloud and mist, while a rest centre has been established for residents affected by poor air quality. Authorities are investigating the suspected arson and have urged the public to avoid the area.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cz05xp0vvpro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Fires started 'deliberately' on mountain as crews tackle blaze\n- Published\nFires are believed to have been deliberately started on a mountain where crews have been tackling a blaze since the weekend.\nThe fire at Llanwonno, near Ferndale in the Rhondda Valley, began on Saturday afternoon with emergency services remaining at the scene.\nIt remains a major incident due to the scale of the fire and \"challenging conditions\" on the mountain, including low cloud, mist and rain.\nSouth Wales Fire and Rescue Service (SWFRS) said there were reports of \"deliberate fire setting\" on the mountain overnight on Monday, while firefighters continued working to contain the blaze.\nLocals have not been forced to evacuate, but a rest centre has been set up for people who do not wish to stay at home because of poor air quality.\nA spokesperson for SWFRS said it continued to work with partner agencies to contain and extinguish the wildfire on Llanwonno mountain and prevent further spread, helping to protect nearby properties and communities.\n\"There were reports of deliberate fire setting on the mountain [on Monday night],\" they said.\n\"Firefighters worked throughout the night in challenging conditions to tackle the fire and protect properties.\"\nResident Caryl Holmes said most of her family live around the area, with her daughter's house \"practically on the mountain\".\n\"I've been checking in on everybody making sure the fire wasn't near their homes, but it was near my daughter's,\" she said.\n\"It was so close and very frightening to be honest. She wasn't allowed to come home 'til it was put out.\"\nShe said the fire was particularly bad on Monday night when \"the smoke was so thick I couldn't breathe\" and added that the firefighters had been \"amazing\".\nIan Putland said even with the windows closed he could smell the fire.\n\"I heard about it a couple of days ago, and didn't think it would affect me... but then I came out yesterday and saw ash on the car and it indicated how close the fire was,\" he said.\n\"I was then alarmed with all the fire people about.\"\nHe added that he was \"frustrated that the fires had been started deliberately\".\n\"There's the wildlife killed, people are being put in danger and it takes emergency services away. It is a real waste of resources.\"\nChristian Hadfield, area manager at SWFRS, said crews had been at the incident since Saturday but declared it a major incident on Monday in order to protect homes in the area.\n\"We are putting fire breaks in and monitoring the area,\" he said.\nHe added there were reports of \"pockets of deliberate fire setting\" which put the crews \"under really critical conditions and stretches the service\".\nThe fire was \"unpredictable and complex work\", he said, and firefighters could be there \"for many days to come\".\nHadfield said a specialist firefighting helicopter had been secured to help crews fight the blaze but could not be deployed due to the poor weather conditions.\nHe added that residents affected by smoke were advised to keep windows and doors closed where possible.\nSWFRS said road closures remained in place and members of the public were asked to avoid the affected area.\nAnyone with any information is being asked to contact South Wales Police.\nMore top stories\n  - Published16 hours ago", "translation_ja": "", "vocab": [{"word": "deliberately", "definition": "意図的に、故意に。何かを計画して意図を持って行うことを意味する。"}, {"word": "challenging conditions", "definition": "困難な状況。対処が難しい環境や状態を表す。"}, {"word": "major incident", "definition": "重大事象。規模が大きく、複数の機関の対応が必要な事態。"}, {"word": "extinguish", "definition": "消す、鎮圧する。火や光を完全に消すことを意味する。"}, {"word": "deployed", "definition": "配備する、展開する。資源や人員を効果的に配置すること。"}, {"word": "arson", "definition": "放火罪。故意に建物や物を火つける犯罪行為。"}]}, {"title_ja": "ガザ新平和計画：米国はイスラエルに受け入れを強要するか", "title_en": "New Gaza Peace Plan: Will US Pressure Israel to Accept?", "summary_ja": "トランプ政権が発表した新しい15項目のガザ平和計画はイスラエルからの抵抗に直面しているが、ハマスは武装解除に同意するという歴史的な譲歩を行った。専門家は、特に2026年10月のイスラエル選挙を控えて、米国がネタニヤフに受け入れを強要するかどうかが計画の成功を左右すると指摘している。", "summary_en": "A new 15-point Gaza peace deal announced by the Trump administration faces resistance from Israel, though Hamas has made a historic concession by agreeing to disarm. Experts suggest the plan's success depends on whether the US will pressure Netanyahu to accept, particularly given upcoming Israeli elections in October 2026.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/new-gaza-peace-plan-will-us-pressure-israel-to-accede/a-78237611?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "New Gaza peace plan: Will US pressure Israel to accede?\nAugust 4, 2026\nUS President Donald Trump touted it as a \"historic breakthrough.\"\nBut so far the new Gaza peace deal, announced last week and meant to help end the fighting and ease the ongoing humanitarian crisis in the coastal enclave, only seems to have resulted in another standoff between the key belligerents.\nHowever, experts point out, there are some differences between this new peace deal and previous arrangements that could be positive.\nFor one thing, it is much more detailed and substantive. For another, statements by Trump indicate he might be more willing to push Israel towards accepting the deal. And finally, after resisting the idea for years, this month the Gaza-based group Hamas has agreed to disarm.\nIt was Hamas that sent fighters into Israel on October 7, 2023, an attack that resulted in over 1,000 deaths and sparked nearly three years of an ongoing Israeli military campaign in Gaza. The Israeli military has since killed over 73,000 people there, causing a UN independent commission of inquiry to classify its behavior as a genocide.\nOne of the main sticking points of any peace plan for Gaza has been the sequencing of events. Israel has demanded that Hamas disarm before it withdraws its troops from Gaza. But up until last month, Hamas had refused to disarm until Israel withdrew its troops. This led to an ongoing stalemate.\nEarly in July, Hamas agreed to hand over power to the National Committee for the Administration of Gaza, or NCAG, a group of independent technocrats set up to govern Gaza. Later in July, the group also agreed to hand over their weapons to the NCAG.\nWhy did Hamas do this?\nHamas agreeing to disarm after years of promoting armed resistance against Israel should be taken seriously, says Muhammad Shehada, a visiting fellow with the Middle East and North Africa program at the European Council of Foreign Affairs, who is originally from Gaza.\nHamas has been under pressure from negotiators from other countries like Egypt and Qatar and this could also be something of a political tactic \"to expose that Israel is the party that is obstructing any progress in Gaza under [Prime Minister Benjamin] Netanyahu's government,\" Shehada concedes.\nBut, he added, \"they would not have made such a major, historic concession unless their backs were totally against the wall and they fully understood that this is the only way forward.\"\nShould Israel agree to the new peace plan, there would also be no way Hamas could renege.\n\"They would be locked in,\" Shehada told DW. \"Because if they renege or violate the decommissioning arrangements, they would give Israel the ultimate pretext to resume military operations in Gaza and collapse the whole Trump deal. Hamas would then be blamed by the entire Palestinian public.\"\nOn the other hand, Hamas probably also understands that Israel is unlikely to agree, so there's no fear disarmament is going to happen immediately, he added.\nIsrael's political problem with peace plan\nIsrael expressed its displeasure with the new 15-point deal almost immediately.\n\"The version that has been made public does not reflect Israel's positions,\" a spokesperson for the Israeli prime minister's office told news agency AFP.\nFar-right Israeli minister Itamar Ben-Gvir dismissed the deal as \"unacceptable\" on social media, adding that \"assassinations in Gaza must continue.\"\nIsrael will hold elections in October and Netanyahu faces tough competition. If he makes any concessions on Gaza, he would likely face a public outcry and a lack of potential coalition partners from the far right.\n\"Netanyahu faces a critical election in less than 90 days from now and although there may be some flexibility on other issues like Lebanon or Iran, he cannot appear flexible on Hamas,\" explains Aaron David Miller, a senior fellow at the Carnegie Endowment for International Peace. \"The shadow of October 7 hangs heavy and dark on Israel, and will for a very long time.\"\nUntil elections happen, Netanyahu will try to sabotage any kind of Gaza peace deal because it would be \"political suicide\" for him, Shehada adds.\nAfter a Monday meeting between Netanyahu and the US-led Board of Peace, it was announced that Hamas' disarming and an Israeli withdrawal would now not happen in phases, as the new 15-point plan had detailed. Gradual progress would have given each side time to build trust, observers argued.\nBut after the Israeli complaints, the plan seemed to revert back to absolutes: Israel would only be asked to withdraw once Hamas was completely disarmed.\nWould US pressure Israel?\nThere is really only one way to change this and that would be via pressure from the US, Shehada and other experts say.\n\"Israel … will be under enormous pressure from Trump to go along or risk his ire by sabotaging what he is touting as a historic success,\" Alan Pino, a senior fellow with the Atlantic Council's Middle East programs wrote in an op-ed for the US think tank last week.\nThere has b", "translation_ja": "", "vocab": [{"word": "substantive", "definition": "実質的で内容のある、という意味。表面的ではなく具体的で重要な内容を持つことを表す。この文脈では、平和協定が詳細で実質的な内容を含んでいることを示している。"}, {"word": "stalemate", "definition": "膠着状態、行き詰まり、という意味。双方が互いに譲歩せず、進展がない状況を表す。交渉や紛争で相手側と対等の力関係が続き、前に進めない状態を指す。"}, {"word": "renege", "definition": "約束や合意を破る、撤回する、という意味。一度同意したことを後から翻して守らなくなることを表す。"}, {"word": "pretext", "definition": "口実、言い訳、という意味。真の理由を隠して、別の理由をもっともらしく言うこと。本来の目的を隠すために使われる表向きの理由を指す。"}, {"word": "sabotage", "definition": "破壊活動、妨害する、という意味。計画や協定を意図的に失敗させるために破壊や妨害を行うこと。政治的な対立で協定の成立を妨げることを指す。"}, {"word": "displeasure", "definition": "不満、不快感、という意味。何かに対して満足せず、不愉快に感じている状態を表す。公式な表現で不満を示すときに使われる。"}]}, {"title_ja": "イタリアのゴミ収集作業員が女性の100万ユーロ宝くじ当選券を回収", "title_en": "Italian Garbage Workers Recover Woman's €1 Million Lottery Ticket", "summary_ja": "イタリアのビトント市のゴミ収集作業員が、ごみ満載のトラック全体を検索して100万ユーロの宝くじ当選券を発見した。女性は「支払い不可」というメッセージを落選だと勘違いして当選券を捨ててしまったが、家族が実は当選していたことに気づいた。廃棄物管理会社は専門サイトで丸1日かけて危険なごみの中から奇跡的に無傷の当選券を回収した。", "summary_en": "Garbage workers in Bitonto, Italy found a €1 million lottery ticket after searching through an entire truck of trash. The woman had mistaken a \"non-payable\" message for a losing ticket and discarded it, but family members discovered she had actually won. The waste management company spent a full day searching through hazardous waste at a specialized site to recover the miraculously intact ticket.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/italy-garbage-workers-help-woman-find-€1-million-jackpot/a-78237944?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Italy: Garbage workers help woman find €1 million jackpot\nAugust 4, 2026\nGarbage workers in the city of Bitonto, Italy recovered a €1 million ($1.15 million) lottery ticket, after having to search through an entire truck full of trash. Waste management company SANB administrator Roberto Nicola Toscano told AFP news agency that the ticket was found \"miraculously still in one piece.\"\nToscano received the panicked call from the woman who had won the big prize and lost it.\nThe unnamed woman entered the Saturday lottery and on Sunday she went to check her ticket's result at her local shop.\nBut the machine read \"non-payable,\" a common message indicating the prize was too large for the small retailer to redeem. She mistook the message to say that there were no winnings.\n\"The winner always played the same numbers, as they were associated with a loved one,\" Toscano said. According to Italian newspaper Corriere Della Sera, the woman's winning combination was 2, 4, 8, 10, and 51. A family member of the woman noticed the combination was the winning one and informed her, but she had already discarded the ticket.\nBy the time they returned to the shop, a garbage truck had already collected the trash bin that held her ticket.\nHow did was the ticket found?\nAfter SANB was contacted by the woman, the garbage company moved quickly to reconstruct the journey of the ticket, Toscano told AFP. They were able to identify the correct truck and stopped it.\nCombing through collected trash would pose the risk of potentially dangerous material in the waste, so the vehicle was taken to a special site equipped to do the search, Toscano said.\nIt took the workers one day of \"working in conditions that were anything but pleasant\" to find the ticket, Toscano told Corriere Della Sera.\nToscano said the woman cried when she found out, over the phone, that the ticket was found.\nHe told the paper that professionalism, organization, and a great deal of luck made the moment happen, saying the impossible result could not have happened without the garbage workers.\nAs a SANB is a public entity, the cost of the search would be covered by taxpayers, but Toscano told AFP that the woman had promised to \"cover all of the additional costs.\"\nEdited by: Darko Janjevic\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "redeem", "definition": "賞金や報酬を受け取る、換金する。宝くじやクーポンなどの価値を現金に変えるプロセスを指す。"}, {"word": "discarded", "definition": "不要だと判断して捨てる、破棄する。ごみ箱に入れるなどして処分することを意味する。"}, {"word": "reconstruct", "definition": "情報や証拠から事実の流れや経過を再度組み立てる。過去の出来事を詳しく明らかにするプロセス。"}, {"word": "professionalism", "definition": "専門職としての高い技能と倫理的な態度。仕事を真摯に取り組む職業意識や姿勢を表す。"}, {"word": "entity", "definition": "独立した存在、組織、または機関。特に法的に認められた企業や公共機関を指す。"}]}, {"title_ja": "セウタ国境殺到の責任は誰にあるのか？", "title_en": "Who is responsible for the Ceuta border surge?", "summary_ja": "モロッコはスペイン領セウタへの大量移民越境事件の責任を否定し、偽情報とデジタル操作のせいにした。専門家の意見は分かれており、モロッコが政治的メッセージを送ろうとしたが状況をコントロールできなかった可能性を指摘する者もいれば、モロッコの不作為が越境を可能にしたと主張する者もいる。", "summary_en": "Morocco initially denied responsibility for a mass migrant crossing into the Spanish exclave of Ceuta, attributing it to misinformation and digital manipulation. Experts disagree on Morocco's culpability, with some suggesting the country may have wanted to send a political message but likely lost control of the situation, while others believe Moroccan inaction made the breach possible.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/who-is-responsible-for-the-ceuta-border-surge/a-78237295?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Who is responsible for the Ceuta border surge?\nAugust 4, 2026\nFor a long time, the Moroccan government chose not to comment on the Ceuta border crisisthat saw tens of thousands of migrants surging into the Spanish exclave on the African continent. It was not until Sunday that Moroccan interior ministry spokesperson Rachid El Khalfi said \"the malicious exploitation of the digital space,\" \"misleading information\" and misinterpretations of a Spanish Supreme Court ruling were to blame for the incident. Morocco has since said it never intended for the border surge to happen and has promised full cooperation with Spain.\nSpain, however, was quick to suspect Moroccan involvement, with Prime Minister Pedro Sanchez calling the border breach an \"attack on our territorial sovereignty.\" Videos have, after all, surfaced showing Moroccan security forces doing nothing to stop the crowd surging forward.\nEfforts have been made to try and explain what caused the migrant crisis. Some have said Spain's recent rapprochement with Algeria may have angered Marocco, while others have speculated US influence may have played a role, although there is no reliable evidence to support the latter theory.\nA complex situation\nDW spoke with two analysts who caution against simplistic explanations. They do, however, ascribe different degrees of responsibility to Marocco for causing the crisis.\n\"I think the situation today is significantly different from what it was in 2021,\" says Isabelle Werenfels, a Maghreb regional expert at the German Institute for International and Security Affairs (SWP). Back then, Morocco was interested in exerting foreign policy pressure on Spain over the Western Sahara dispute, she says. Today, Moroccowould have \"a great deal to lose, above all, international credibility and investment\" if found to have deliberately orchestrated the Ceuta migrant surge.\nJochen Oltmer, a migration researcher at the University of Osnabrück in Germany, also warns against jumping to conclusions, telling DW \"you have to keep in mind the many different interests at play.\" He points to Ceuta's unique status as a European exclave on the African continent, decades of migration flows, the impact of social networks, and the hopes of many migrants to build better lives abroad.\nOltmer says Moroccan authorities carry considerable responsibility for the Ceuta crisis, as \"such a border crossing could never have taken place if the Moroccan side hadn't looked the other way.\" It was this inaction that made possible a border breach of this magnitude in the first place, he told DW.\nWerenfels does not dispute this assessment. Yet she also believes Morocco may have wanted to send a political signal to Spain, perhaps over its recent rapprochement with Algeria and its decision to grant Spanish citizenship to individuals born in Western Sahara before September 1977.\n\"But there is a significant difference between making a political statement and orchestrating a migration surge on this scale,\" Werenfels says. The expert thinks it is \"unlikely\" that Morocco had planned the latter, even though it cannot be ruled out, while stressing a lot of information remains extremely unclear-\nWho bears responsibility?\nThere is some evidence to suggest that Morocco played a part in the border surge to push its own political agenda, says Oltmer. For years, the country has viewed itself as an indispensable partner to the European Union in the context of migration policy, he says, adding that Morocco has repeatedly emphasized how much the bloc depends on its cooperation. Yet the conflict over Western Sahara, and Morocco's rivalry with Algeria, also plays an important role, Oltmer explains. That is why he \"ultimately cannot imagine that the recent events would have been possible without Morocco.\"\nWerenfels advocates for a more nuanced analysis. She suspects it's possible that Morocco wanted to send a message but that matters got out of control. Werenfels says it is hard to imagine that Morocco would want to risk a lasting rift with Spain and the European Union. This is all the more true given that Morocco will be hosting the next football World Cup together with Spain and Portugal, and also depends on Spanish gas supplies. In 2025, one-quarter of Spain's total natural gas exports went to Morocco.\nEven if Morocco had wanted to send a political message, that does not automatically mean that it deliberately orchestrated a migration surge of this magnitude, Werenfels says. Doing so would carry enormous political and economic risk.\nNo evidence of third-party involvement\nNeither of the experts believe a third country played a part in the Ceuta migration crisis. That said, Werenfels does entertain the possibility that other governments or political actors may have attempted to exploit the situation propagandistically for their own political interests and thereby may have amplified the crisis.\nWerenfels also says it remains unclear how the situation escalated so quickly. There is much to ", "translation_ja": "", "vocab": [{"word": "rapprochement", "definition": "関係改善や親密化のこと。特に国家間の対立の緩和や友好的な関係の構築を指します。"}, {"word": "orchestrate", "definition": "複数の要素や人々を計画的に組み合わせて何かを実現すること。通常は大規模な計画を実行することを意味します。"}, {"word": "indispensable", "definition": "必要不可欠な、なくてはならないという意味。ある状況において絶対に必須となる存在や物を指します。"}, {"word": "amplify", "definition": "何かを拡大する、強める、または増幅することを意味します。情報やメッセージがより広く、より強く広がることを表します。"}, {"word": "entertain", "definition": "考慮に入れる、可能性として認める、という意味で使われます。実現するかどうかは別として、その可能性を検討することを表します。"}, {"word": "breach", "definition": "壊すこと、破ること、または違反のこと。国境やルールなど、本来守られるべきものを突き破ることを意味します。"}]}, {"title_ja": "ミシガン州有権者が上院・下院の重要な選挙に投票", "title_en": "Michigan voters to decide key Senate, House races and gubernatorial contest", "summary_ja": "ミシガン州の有権者は、任期制限のあるホイットマー知事の後任候補が複数名出馬する中、重要な上院・下院選挙に投票する。州全体の政治情勢を左右する可能性のある主要選挙である。連邦および州の重要な選挙レースは、有権者の投票を大きく集めると予想されている。", "summary_en": "Michigan voters are heading to the polls for critical Senate and House races, with multiple candidates competing to replace term-limited Governor Whitmer. The elections represent major contests that could shape the state's political landscape. Key races across federal and state offices are expected to draw significant voter participation.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/michigan-voters-weigh-critical-senate-house-races/story?id=135120856", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間速報ニュース配信", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースと生中継イベントを24時間体制で配信しています。プラットフォームは主要なニュースが展開する際にリアルタイム更新を提供します。視聴者はこのライブストリーミングサービスを通じて、国内および国際ニュースの包括的な報道にアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. The platform delivers real-time updates on major stories as they develop. Viewers can access comprehensive reporting on national and international news through this live streaming service.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ニュージャージー州のICE施設での収容者死亡、遺族が真相究明を要求", "title_en": "Family Demands Answers After Man Dies in ICE Custody in New Jersey", "summary_ja": "41歳のエドウィン・ロペス・コルネホ氏がニュージャージー州ニューアークのディレニーホール収容施設で土曜日に亡くなりました。ICEは医学的緊急事態が原因だと述べています。遺族は彼の死の状況について説明を求めており、この事件は施設の状況と医療体制に関する疑問を生じさせています。", "summary_en": "Edwin Lopez-Cornejo, 41, died on Saturday at the Delaney Hall detention facility in Newark, New Jersey, following what ICE described as a medical emergency. His family is demanding answers about the circumstances surrounding his death. The incident has raised questions about conditions and medical care at the facility.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/family-demands-answers-death-man-ice-custody-new/story?id=135358139", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セウタ危機後、EUはより強固な国境が必要—フォン・デア・ライエン欧州委員長", "title_en": "EU must strengthen borders after Ceuta crisis, von der Leyen says", "summary_ja": "欧州委員会のウルスラ・フォン・デア・ライエン委員長は、スペイン領セウタへの数万人の移民流入を受けて、EU国境警備の強化を呼びかけました。同委員長はスペインの迅速な対応を称賛する一方で、非EU諸国との協力強化、物理的障壁、密輸ネットワークの解体の必要性を強調しています。この危機は移民政策をめぐるEU内の深刻な分裂を露呈させ、一部加盟国はスペインの無証移民の適正化を批判しています。", "summary_en": "European Commission President Ursula von der Leyen has called for stronger EU border security following the arrival of tens of thousands of migrants in Spain's Ceuta enclave. She praised Spain's swift response while emphasizing the need for better cooperation with non-EU countries, physical barriers, and dismantling of smuggling networks. The crisis has exposed deep divisions within the EU over migration policy, with some member states criticizing Spain's regularization of undocumented migrants.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/03/stronger-eu-borders-physical-barriers-ceuta-von-der-leyen", "state_media": false, "category": "政治", "full_text": "The president of the European Commission has called for action to strengthen Europe’s borders after tens of thousands of people arrived and quickly left the Spanish territory of Ceuta, triggering a furious row between Madrid and other European countries.\nIn a letter to Spain’s prime minister, Pedro Sánchez, on Monday, Ursula von der Leyen said: “From this incident, it is clear that we must do more to further strengthen our borders at critical points, including vigilant monitoring and the use of physical barriers where needed.”\nShe praised the Spanish socialist leader’s swift handling of the crisis, after the vast majority of migrants left Ceuta and Spanish officials began installing a 500-metre (1,640ft) floating barrier at the border with Morocco. “Order has been restored and the returns system in place worked,” she wrote in the letter.\nSpain estimates that about 69,500 migrants have returned to Morocco over the past four days, exceeding initial estimates of 50,000 having arrived in the enclave in north Africa on Thursday. Authorities in Ceuta reported that 88 people died trying to reach the territory, while at least 11 deaths have been recorded in Morocco.\nCeuta and Melilla, another Spanish enclave, have the EU’s only land borders with Africa. There are periodic surges in attempted crossings to both cities, although neither permits onward free movement to the EU as they are outside the border-free Schengen zone.\nEU interior ministers will hold emergency talks on Tuesday, which von der Leyen said would be a chance to draw lessons from the crossings.\nShe said the EU should double down on five areas: strengthening cooperation with non-EU countries to prevent migration; stronger external borders; implementing early warning systems; dismantling smuggling networks; and boosting returns of people with no right to stay.\nItalian media reported that Giorgia Meloni’s government wanted to accelerate the opening of offshore migration centres, which Europe’s top human rights expert recently said risked becoming “human rights black holes”.\nThe EU opened the door to offshore detention centres in June in an unprecedented departure from legal norms as part of a law aiming to increase the deportations of people with no legal right to stay.\nAmid heavy criticism of the EU’s divided response to the Ceuta border crossings, von der Leyen stressed that Spain could access EU funds as well as support from the Frontex border agency. So far Madrid has not requested the assistance of Frontex.\nThe crossings – seized on by far-right politicians across Europe – have exposed deep divisions over migration that have left Spain’s leader isolated.\nOver the weekend, Sánchez criticised other governments for failing to support Spain, after Italy and Denmark led calls for its temporary exclusion from the Schengen zone. Sánchez said such an attitude was “driven by prejudice, fake news, ignorance or political interest” and contrary to European and humanitarian law “and the principles of solidarity that bind us together”.\nItaly and Denmark organised a letter signed by 20 other EU member states that appeared to blame the crisis on Sánchez’s decision to regularise the status of 500,000 migrants without documents. “We have a duty to effectively deter and relentlessly combat illegal migration,” the 22 leaders wrote, arguing for the need to address “all policies that can serve as pull factors, such as the regularisation of [a] very large number of irregular migrants”.\nEU member states favouring a tough approach to migration are expected to raise the issue of “pull factors” on Tuesday. “There is some concern that the regularisation of 1.2 million people can be used to paint a picture that the door is open,” an EU diplomat said, referring to the approximate number of people who applied for regularisation under the 2026 Spanish government programme.\nAcademic research has found no evidence of a pull effect from regularisation programmes on arrivals of irregular migrants.\nMichele LeVoy, the director of Picum, an umbrella group that campaigns for the rights of undocumented migrants, said regularisation programmes had been criticised by EU governments for the last two decades. “If an EU country offers regularisation possibilities, other member states believe that it may invite secondary movement [onward movement to other EU member states] – that is what EU member states don’t want and that explains most likely the harsh response.”\nAmid widespread suspicion that Morocco helped fuel the crisis, von der Leyen described the country as “an important strategic partner”, especially in combating “illegal migration”.\nOfficials said that before the Ceuta crossings, the European Commission was looking to upgrade the EU’s diplomatic relationship with Morocco to a “strategic and comprehensive partnership”. The EU already has similar wide-ranging agreements with Egypt and Tunisia, which include pledges to stem migration, but which have been heavily criticised by rights group", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "周辺地域から隔離された領土や地域。政治的・地理的に他の地域から分離された飛び地を指します。"}, {"word": "vigilant", "definition": "警戒心を持った、用心深い。危険や問題に対して常に注意を払う状態を表します。"}, {"word": "offshore", "definition": "沿岸から遠く離れた海上の、または国外の。本国から離れた外国領土や海域に関連する場合に使用されます。"}, {"word": "deter", "definition": "阻止する、思いとどまらせる。罰や脅迫によって行動を防止することを意味します。"}, {"word": "regularisation", "definition": "正規化、合法化。違法な身分を合法的なものに変える行政手続きやプロセスを指します。"}, {"word": "pull factor", "definition": "引き寄せ要因。移民や難民を特定の地域に引き付ける条件や利点を指す用語です。"}]}, {"title_ja": "セウタ移民危機がヨーロッパ内の深刻な分裂を露呈", "title_en": "Ceuta Migrant Crisis Exposes Deep Divisions Within Europe", "summary_ja": "モロッコからスペイン領セウタへ数万人の移民が流入し、多数の死傷者が発生してスペイン国内で政治危機が勃発した。この事件はEU加盟国からの批判を招き、移民政策と国境管理をめぐるヨーロッパ連合内の重大な意見の相違が明らかになった。", "summary_en": "Tens of thousands of migrants crossed from Morocco into the Spanish enclave of Ceuta, resulting in dozens of deaths and triggering a major political crisis in Spain. The incident has drawn criticism from EU member states, revealing significant disagreements over migration policy and border control within the union.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/news/audio/2026/aug/03/how-ceuta-migrant-crisis-exposes-divisions-within-europe-the-latest", "state_media": false, "category": "政治", "full_text": "How Ceuta migrant crisis exposes divisions within Europe - The Latest\nDozens of people died attempting to reach the Spanish enclave of Ceuta after an estimated 50,000 crossed from Morocco last week. The incident has led to a political crisis in Spain and criticism from EU countries.\nLucy Hough speaks to the Guardian’s European community affairs correspondent, Ashifa Kassam – watch on YouTube", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "他国の領土に囲まれた特定国の領土のことで、ここではスペイン領の飛び地セウタを指す。地政学的に特殊な領土境界を表す用語。"}, {"word": "migrant crisis", "definition": "難民や移民の大量流入による社会的・政治的問題のこと。国家や地域の対応能力を超える移民現象を指す。"}, {"word": "expose", "definition": "隠れていた問題や真実を明らかにする、露呈させるという意味。ニュース報道で頻出の動詞。"}, {"word": "divisions", "definition": "意見や立場の相違、分裂のこと。政治的・社会的な対立や意見の不一致を指す。"}, {"word": "political crisis", "definition": "政府や国家の安定性が脅かされる深刻な政治的状況のこと。通常は権力闘争や政策対立から生じる。"}]}, {"title_ja": "セウタ指導者、大量国境越えでモロッコを非難", "title_en": "Ceuta Leader Accuses Morocco of Orchestrating Mass Border Crisis", "summary_ja": "スペイン領北アフリカのセウタが前例のない危機に直面し、約69,500人の移民が1週間でモロッコから越境し、人口84,000人の領土を圧倒した。地域指導者とスペイン当局者はモロッコが越境を容認または許可したと非難し、2021年の同様の事件と比較した。ただし、スペイン情報機関は流入がモロッコ直接の指示ではなく、ソーシャルメディアの虚偽情報によって引き起こされた可能性が高いと結論づけている。", "summary_en": "Spain's Ceuta enclave faced an unprecedented crisis when approximately 69,500 migrants crossed from Morocco in a single week, overwhelming the territory of 84,000 residents. Local leaders and Spanish officials accused Morocco of facilitating or permitting the crossing, drawing parallels to a similar incident in 2021, though intelligence suggests the influx may have been triggered by a social media hoax rather than direct Moroccan orchestration.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/03/ceuta-leader-border-crossing-morocco-spain", "state_media": false, "category": "社会", "full_text": "A growing chorus of voices has accused Morocco of helping to fuel the crisis in Ceuta, with the leader of the Spanish enclave describing last week’s border crossings as an attack on Spain’s territorial integrity that was seen as being “if not orchestrated, at least encouraged or permitted by Morocco”.\nSpanish officials said on Monday that an estimated 69,500 people who had arrived late last week in Ceuta, a tiny Spanish territory in north Africa, had returned to Morocco in recent days. About 2,500 people who had made the crossing were believed to still be in Ceuta.\nThe extraordinary influx had overwhelmed the city of 84,000 people and set off a political crisis across the EU as some member states laid blame on Spain.\nIn Ceuta, leaders pointed to the broader picture of what had transpired. “It’s an atrocity,” said Juan Jesús Vivas, the long-serving conservative leader of the territory. “There are 88 bodies in the morgue, and there are more on the other side of the border.”\nHe said local people watched the events play out with a mix of sadness, worry and anguish. “People see this not as a migration crisis; it was fundamentally an attack, a violation of Spain’s territorial integrity,” Vivas told El País newspaper. “People felt that this, if not orchestrated, was at least encouraged or permitted by Morocco.”\nHe drew a parallel with May 2021, when Rabat loosened border controls, allowing 10,000 people to cross into Ceuta over the course of two days, during a diplomatic standoff over Madrid’s decision to allow a Western Sahara independence leader to be treated for Covid-19 in Spain.\nThis time around, analysts have suggested that Spain’s recent rapprochement with Rabat’s arch-enemy Algeria could have triggered a response from Morocco.\nSpeaking on Monday, Spain’s defence minister, Margarita Robles, also seemingly signalled Rabat’s involvement. “Neither Spain nor Morocco can look the other way when it comes to this tragedy,” she told reporters. “I ask the Moroccan government to fully investigate what happened.”\nThe insinuation appeared to be backed by the preliminary assessment of Spanish intelligence services, who cited suspicions that the influx had not been planned by Moroccan authorities but concluded that Morocco had failed to stem the tide of people rushing towards the border and in some cases had even facilitated their passage.\nIntelligence sources told El País that the roots of the influx probably lay in a hoax that had swiftly spread across social media after a Spanish supreme court ruling that migrants arriving by sea could not be summarily deported. As the hoax gained steam online, Moroccan border surveillance dwindled to a minimum until it was completely lifted late last week, allowing tens of thousands of people to stream through.\nIn Ceuta on Monday, hundreds of people continued to sleep rough on the beach or near Ceuta’s mosques. One local official told reporters that those who remained in the city included 862 unaccompanied minors.\nAshraf, 28, said he had defied his mother’s warnings against crossing into Spain after spotting posts on social media that said the border had been opened. While he had made it to Ceuta, what had followed was a days-long ordeal as he scrambled to find food and shelter while fending off the memories of what he had lived through.\n“You might see me smile a little but inside I’m shattered,” the Moroccan national said as he recalled swimming past bodies to reach Ceuta. “There were so many people in the sea. Everyone was trying to grab on to you to save themselves, and you were trying to escape and move forward so they wouldn’t drag you down or drown you. The Moroccan police were pushing us toward the water and telling us ‘swim, swim’.”\nOthers were desperately seeking loved ones who were missing. One mother said she had been roaming the streets of Ceuta for days, frantically searching for any sign of her children, aged 13 and 16.\nShe had left Morocco alone, finding out later that her two children had followed her by plunging into the sea to make their way around the border.\n“I need help,” she said as she held up a photo of a smiling young boy flashing a thumbs-up sign. “Some migrants told me they had seen them in Ceuta, but I can’t find them.”\nAcross the EU, the crisis in Ceuta had seemingly ushered in a moment of reckoning after a handful of EU countries responded to the crisis by calling for Spain to be suspended from the Schengen free-movement zone. Italy said it had suspended passport-free Schengen travel arrangements with Spain for one month, despite the fact that Ceuta is not part of Schengen.\nBefore an emergency video meeting of interior ministers on Tuesday to address the crisis, Spain’s foreign minister said the country would demand solidarity from EU members after several had, in his view, “fallen short” of what was expected.\n“There was a synchronised reactionary international effort that very quickly amplified what was happening, spreading lies and fake news about the ", "translation_ja": "", "vocab": [{"word": "orchestrated", "definition": "計画的に組織されたこと。複数の要素や人を意図的に調整して実行されることを意味する。政治的陰謀や作戦の文脈でよく使用される。"}, {"word": "territorial integrity", "definition": "領土保全、ある国家が自国の領土を侵害されない権利。国家主権の基本的要素の一つ。"}, {"word": "facilitated", "definition": "容易にしたこと、手助けしたこと。何かが起こるのを助長または促進することを意味する。"}, {"word": "insinuation", "definition": "ほのめかし、暗にほのめかすこと。直接的に述べずに、間接的に示唆することを指す。"}, {"word": "preliminary assessment", "definition": "初期評価、予備的な判断。最終的な結論に至る前の、早期段階での評価や意見。"}, {"word": "surveillance", "definition": "監視、監督。人や場所の活動を観察・監視すること、特に政府機関が実施する。"}]}, {"title_ja": "イラン・キシュム島への米国攻撃で殺害された家族の葬儀が開催", "title_en": "Funeral Held for Family Killed in US Strike on Iran's Qeshm Island", "summary_ja": "イラン・キシュム島への米国による軍事攻撃で殺害されたカップルと2歳の子供の犠牲者の葬儀が行われた。イランの首席交渉官であり議会議長のモハンマド・バゲル・ガリバフは、米国がこの死亡事件の対価を払うと宣言し、両国間の緊張が高まった。", "summary_en": "A funeral was conducted for victims of a recent US military strike on Iran's Qeshm Island that killed a couple and their two-year-old child. Iran's chief negotiator and parliamentary speaker Mohammad Bagher Ghalibaf declared that the US would face consequences for the deaths, escalating tensions between the two nations.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/4/funeral-for-family-killed-in-us-strike-on-irans-qeshm-island?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Funeral for family killed in US strike on Iran’s Qeshm Island\nA funeral was held for the victims of last week’s US strike on Iran’s Qeshm Island, where a couple and their two-year-old child were killed. Iran’s chief negotiator and parliamentary speaker, Mohammad Bagher Ghalibaf, vowed the US would “pay the price” for their deaths.\nPublished On 4 Aug 2026", "translation_ja": "", "vocab": [{"word": "vowed", "definition": "厳粛に約束する、誓う。特に困難な状況下で決意を表明する際に使用される。"}, {"word": "negotiator", "definition": "交渉担当者、仲介者。複数の当事者間の合意を達成するために交渉する責任者。"}, {"word": "escalating", "definition": "段階的に増加または悪化させる。特に紛争や対立が深刻化することを指す。"}, {"word": "casualties", "definition": "戦闘や事故で負傷または死亡した人々。軍事用語として頻繁に使用される。"}, {"word": "strike", "definition": "軍事攻撃。航空機やミサイルによる急襲的な攻撃を指す。"}]}, {"title_ja": "インド・アッサム州の洪水被害で死者87人に増加", "title_en": "Death toll rises to 87 in India's flood-stricken Assam", "summary_ja": "モンスーンの豪雨によってインドのアッサム地区で大規模な洪水が発生し、死者数が87人に達しました。洪水の被害者たちは仮設シェルターに避難しており、自宅と農地は水没したままです。村民たちは筏を使って洪水地域で荷物を運んでいます。", "summary_en": "Monsoon rains have caused severe flooding in India's Assam district, with the death toll reaching 87 people. Flood victims are sheltering in makeshift structures while their homes and farmland remain submerged. Villagers are using rafts to transport their belongings through the flooded areas.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/4/aje-onl-nf_death-toll-rises-to-87-in-assam-040826?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Death toll rises to 87 in India's flood-stricken Assam\nDeath toll rises to 87 in India’s flood-stricken Assam\nFlood victims in India’s Assam district are living in makeshift shelters after monsoon rains caused widespread flooding. Villagers used rafts to move belongings as homes and farmland remained submerged.\nPublished On 4 Aug 2026", "translation_ja": "", "vocab": [{"word": "flood-stricken", "definition": "洪水の被害を大きく受けた状態を示す形容詞。災害の深刻さと広範な影響を表現するために使用されます。"}, {"word": "monsoon", "definition": "南アジアで見られる季節的な風のパターンで、大量の降雨をもたらす気象現象。特定の季節に発生する周期的な現象です。"}, {"word": "makeshift", "definition": "一時的または急遽準備された、本来的な目的以外に使用されるもの。緊急時に利用可能な資材で作られた構造物を指します。"}, {"word": "submerged", "definition": "水中に沈んだ、または完全に水に覆われた状態。洪水や浸水により土地や建造物が水の中に沈むことを表します。"}, {"word": "toll", "definition": "災害や事故による人命喪失の数。negative eventの影響度を測定する重要な指標として使われます。"}]}, {"title_ja": "ベイルート港湾爆発から6年、被害者遺族はなお正義を待つ", "title_en": "Six Years On, Beirut Blast Families Still Await Justice", "summary_ja": "ベイルート港湾爆発の被害者遺族は6周年を迎え、当局に真実と説明責任を求めた。起訴が間近だという約束が繰り返されているにもかかわらず、多くの遺族は司法手続きの長期化と解決しない悲しみについて不満を表明している。", "summary_en": "Families of victims from the Beirut port explosion marked the sixth anniversary by demanding truth and accountability from authorities. Despite renewed promises that an indictment is imminent, many families express frustration over prolonged delays in the justice process and unresolved grief.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/4/six-years-on-beirut-blast-families-still-await-justice?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Six years on, Beirut blast families still await justice\nFamilies of victims of the Beirut port blast marked six years since the explosion by demanding truth and accountability. Despite renewed promises that an indictment is nearing, many say justice has been delayed for too long and their grief remains unresolved.\nPublished On 4 Aug 2026", "translation_ja": "", "vocab": [{"word": "accountability", "definition": "説明責任、または何らかの行為に対して責任を負わせることを意味する。政治や法律の文脈で、当事者が自らの行動について説明し、その結果に対する責任を取ることを指す。"}, {"word": "indictment", "definition": "起訴状、または公式な犯罪告発を意味する。法律用語で、検察が被告人を特定の犯罪で告発するために発行する文書のこと。"}, {"word": "imminent", "definition": "差し迫った、または非常に近い未来に起こると予想される状態を意味する。通常、危険や重要な出来事が間もなく発生することを示す。"}, {"word": "prolonged", "definition": "長引いた、または延長された期間を意味する。何かが予想より長く続く状態、または意図的に時間を長くすることを指す。"}, {"word": "unresolved", "definition": "未解決の、または決着がついていない状態を意味する。問題や懸案事項がまだ解決されていない、または決定されていない状況を表す。"}]}, {"title_ja": "ケニア航空機のタイヤ故障でケープタウン空港滑走路が一時閉鎖", "title_en": "Cape Town Airport Runway Closed After Kenya Airways Plane Tire Failure", "summary_ja": "2026年8月4日、ケープタウン国際空港の主滑走路がケニア航空機のタイヤ故障により一時閉鎖された。着陸時にタイヤが故障したが、全乗客は安全に脱出した。故障した航空機は数時間にわたり滑走路上に残され、到着便は他の空港へ迂回され、国内線の出発は継続した。", "summary_en": "The main runway at Cape Town International Airport was temporarily closed after a Kenya Airways aircraft experienced tire failure during landing on August 4, 2026. All passengers were safely evacuated from the disabled plane, though it remained on the runway for several hours. The incident disrupted airport operations, with arriving flights diverted to other airports while domestic departures continued.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/cape-town-airport-runway-closed-after-planes-tyres-fail-passengers-safe/article71307006.ece", "state_media": false, "category": "社会", "full_text": "The main runway at Cape Town International Airport was temporarily closed after a Kenya Airways plane's tyres failed on landing, but all passengers were safely taken off the plane, South Africa's airports operator said on Tuesday (August 4, 2026).\nAirports Company South Africa said the tyre failure happened around 1525 local time (1325 GMT). As of 1800 local time the plane was still disabled on the runway, a spokesperson said.\nAll arriving flights are being diverted to other airports. Domestic departures are operating but not international departures. Cape Town is a popular tourist city and its main airport the second-busiest in South Africa.\nPublished - August 05, 2026 01:47 am IST", "translation_ja": "", "vocab": [{"word": "divert", "definition": "本来の目的地から別の場所へ向かう、あるいは向かわせることを意味する。航空業界では、到着予定地の状況により飛行機を別の空港へ向かわせる際に使用される。"}, {"word": "disabled", "definition": "機能不全の状態にあることを意味する。ここでは飛行機が損傷や故障により動作不能な状態にあることを示している。"}, {"word": "operator", "definition": "事業や施設を運営・管理する企業や組織を指す。この記事では空港の運営会社を意味する。"}, {"word": "tyre failure", "definition": "タイヤの破裂や故障のこと。特に航空機の着陸時などの重要な局面で発生すると大きな影響を及ぼす。"}, {"word": "evacuate", "definition": "危険な場所から人を安全に移動させることを意味する。緊急時に建物や乗り物から人を脱出させる行為を指す。"}]}, {"title_ja": "インド船籍の商船が紅海でイエメン沖から攻撃を受け沈没", "title_en": "Indian-flagged vessel attacked and sinks in Red Sea off Yemen", "summary_ja": "2026年8月4日、インド船籍の商船「MSV Faize Noore Oliya」がイエメン沖の紅海で攻撃を受け沈没しました。乗船していた13人のインド国籍者は全員イエメン当局の支援により救助されました。インド外務省はこの攻撃を非難し、同地域での商船への攻撃終止と国際海路の自由な通航の回復を呼びかけています。", "summary_en": "An Indian-flagged merchant vessel, MSV Faize Noore Oliya, was attacked and sank off the coast of Yemen on August 4, 2026, with 13 Indian nationals aboard. All crew members were successfully rescued with assistance from Yemeni authorities. India's Ministry of External Affairs condemned the attack and called for an end to targeting commercial shipping in the region.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/indian-flagged-vessel-comes-under-attack-in-red-sea/article71306885.ece", "state_media": false, "category": "社会", "full_text": "An Indian-flagged merchant vessel with 13 Indian nationals aboard came under attack off the coast of Yemen on Tuesday (August 4, 2026), the Ministry of External Affairs (MEA) said.\nAll the Indians have been rescued, it said.\nNew Delhi condemned the attack and said targeting of commercial shipping in the region must stop.\n\"We condemn the attack on the Indian-flagged commercial vessel, MSV Faize Noore Oliya that sank in the Red Sea, off the coast of Yemen on August 4,\" the MEA said.\n\"All 13 Indian nationals have been rescued. Our Embassy in Riyadh is closely monitoring the situation and proactively coordinating with the Yemeni authorities for the safety and security of the crew,\" it added.\nThe MEA thanked the Yemeni authorities for their support in rescuing the Indians.\n\"The continuing incidents of attacks on commercial shipping in the region are deeply worrisome,\" it said.\n\"The targeting of commercial shipping in the region must end, and free and unimpeded navigation and commerce through the international waterways in the region, in keeping with international law, must be restored at the earliest,\" the MEA said in a statement.\nPublished - August 04, 2026 11:24 pm IST", "translation_ja": "", "vocab": [{"word": "merchant vessel", "definition": "商業目的で貨物や乗客を運搬する船舶。国際貿易で重要な役割を果たします。"}, {"word": "condemned", "definition": "強く非難する、批判することを意味します。公式な政治的または外交的な文脈で使われることが多いです。"}, {"word": "unimpeded", "definition": "妨げられない、阻害されない状態を示します。自由で制限のない通航や通行を表現する際に用いられます。"}, {"word": "proactively", "definition": "積極的に先手を打って行動することを意味します。問題が起きてから対応するのではなく事前に対策を講じることです。"}, {"word": "worrisome", "definition": "心配や懸念の原因となる状況や事柄を表します。継続的な問題や危機的な状況を描写するのに使われます。"}]}, {"title_ja": "ロシアとウクライナのドローン攻撃で両国それぞれ5人以上が死亡", "title_en": "Russian and Ukrainian drone strikes kill at least 5 in each country", "summary_ja": "ウクライナのドローン攻撃によりモスクワ地域で5人が死亡し、複数のワイルドベリーズ倉庫が被害を受けました。一方、ロシアの攻撃によりウクライナでも5人以上の民間人が死亡し、スムイ地域では子どもを含みます。両国は空中作戦を激化させており、ロシアは一夜で320機のウクライナドローンを撃墜したと報告し、ウクライナの港湾施設を攻撃しています。黒海での攻撃の激化により、民間船舶と世界食糧安全保障への脅威が国際的な懸念となっています。", "summary_en": "Ukrainian drone attacks killed five people in the Moscow region and damaged multiple Wildberries warehouses, while Russian strikes caused at least five civilian deaths in Ukraine, including children in the Sumy region. Both nations have escalated aerial operations, with Russia reporting it shot down 320 Ukrainian drones overnight and striking Ukrainian ports and shipping infrastructure. The intensifying Black Sea attacks have raised international concerns about threats to civilian shipping and global food security.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/russian-and-ukrainian-drone-strikes-kill-at-least-5-in-each-country/article71306871.ece", "state_media": false, "category": "社会", "full_text": "Ukrainian drone attacks in the region around Moscow killed five people, local officials said Tuesday (August 4, 2026), while authorities in Ukraine said Russian aerial strikes there also caused at least five civilian deaths.\nSince Russia's invasion more than four years ago, Ukraine has developed long-range drones that can hit targets deep inside Russia. In the past year, they have battered oil facilities, major storage depots and other key infrastructure.\nMore than 16,000 civilians have been killed in Ukraine since the start of Russia's full-scale invasion, according to the United Nations, with the vast majority of them occurring in areas under the Ukrainian government's control. Casualties have risen steadily each year.\nMeanwhile, escalating attacks by both sides on shipping in the Black Sea has reawakened fears that global food security could be put at risk.\nRussia says a Ukrainian drone killed 7 on Black Sea coast\nThe death toll from a drone strike Monday (August 3) in the Russian Black Sea resort of Arkhipo-Osipovka rose to seven, including four children, regional authorities said.\nOn Tuesday (August 4) morning, Krasnodar regional authorities updated the number of wounded to 58, with 21 of them hospitalised.\nFootage circulating online showed a drone slamming into a crowded beach, with what sounded like rapid gunfire ringing in the background. Ukraine has not commented on the strike.\nUkrainian drones attack near Moscow and St Petersburg\nA Ukrainian drone attack in the Moscow region, which surrounds but doesn't include the Russian capital, killed five people and wounded 10 others wounded on Tuesday morning, the region's Governor Andrei Vorobyov said.\nMost damage from the attack occurred in the Chekhov municipal district, where several fires erupted at the Novoselki industrial zone, Mr. Vorobyov said.\nIn the latest in a string of attacks attack on Russia's biggest online retailer, Wildberries said Tuesday that its warehouse in the Leningrad region, which lies adjacent to St Petersburg, was on fire.\nIn the Tver region, located between Moscow and St Petersburg, drone debris inflicted “partial” damage on a wall of a Wildberries warehouse in the village of Emmaus, the region's governor Vitaly Korolyov said.\nUkrainian drones have over the past 18 days targeted 15 Wildberries warehouses, 13 of which have caught fire, Ukraine's Unmanned Systems Forces commander Robert Brovdi said. Ukrainian officials say the company provides goods that can be us
