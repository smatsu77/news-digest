r with the United States on Wednesday (September 2, 2026) after the heaviest exchanges in weeks left at least 19 Iranians dead, including four at a wedding -- an incident slammed as a “war crime” by Tehran. A wave of Iranian attacks earlier targeted US bases in Jordan, the UAE, Kuwait, Bahrain and Iraq’s autonomous Kurdistan region, after extensive U.S. bombardment hit sites across Iran.\nU.S. President Donald Trump had warned earlier of “much harder and higher” attacks if Iran retaliated to the U.S. strikes, which Iran’s military and state media said killed 18 people. U.S. Central Command (CENTCOM) spokesperson Tim Hawkins said “the U.S. military never targets civilians, unlike the IRGC”, referring to Iran’s Revolutionary Guards.\nThe latest flare-up is part of a cycle of retaliation that followed U.S. strikes on Iran, with fighting over the Hormuz strait expanding to Washington’s Gulf allies, military bases and commercial shipping. It began when Washington hit Iranian targets on Sunday (August 30, 2026), the first known strikes in several weeks, after which Tehran’s forces targeted US troops in Jordan and the United Arab Emirates, and projectiles struck two oil tankers in unclaimed attacks.\nIran, U.S. trade threats after escalation in fighting\nIran and the United States traded threats after some of the heaviest military exchanges in weeks, including a strike on a wedding party that Tehran blamed on Washington and branded a “war crime.”\nPresident Donald Trump said U.S. forces staged a “very heavy attack” on Iranian targets overnight and are “prepared to do another one any time we want.”\nIran’s security chief warned that the United States would face a “new strategy” in the war that began in late February with US and Israeli attacks on the Islamic Republic.\n“You will soon see that Iran’s new strategy on the battlefield, in diplomacy and in confronting the economic blockade will shatter your foundations,” Supreme National Security Council Secretary Mohsen Rezaei wrote on X.\n-AFP\nSeptember 02, 2026 22:59\nIran's rial drops to new low of 2.2 million to the dollar, tracking websites show\nIran’s currency has dropped to a record low of more than 2.2 million rials per U.S. dollar, two websites tracking the free market rate showed on Wednesday (September 2, 2026), amid renewed military strikes.\nThe rial has dropped about 10% in the past week. The troubled currency has lost about half of its value in a year of tightening U.S. sanctions and U.S. and Israeli attacks that began in February.\nReuters\nSeptember 02, 2026 22:56\nTrump aides seek 'quiet' in Iran war, but say attacks may intensify after November midterm elections: report\nTop aides to President Donald Trump are pushing to keep the Iran war from escalating before November’s midterm elections to staunch Republican electoral losses, four people familiar with the discussions said, a strategy already under strain as the U.S. and Iran exchanged back-and-forth attacks overnight.\nWhite House officials will consider ramping up military action after the November 3 vote, said the sources, who requested anonymity to describe internal thinking, though any return to full-scale conflict is far from a given. The U.S. military said its latest strikes were retaliation for recent attacks on American forces and marine traffic in the region.\nTrump aides seek 'quiet' in Iran war, but say attacks may intensify after November midterm elections: report\nTrump aides aim for a calm in the Iran conflict until November elections, but tensions and attacks may escalate.\nSeptember 02, 2026 22:10\nTrump floats renaming Strait of Hormuz as 'Trump Strait'\nU.S. President Donald Trump on Wednesday (September 2, 2026) suggested renaming the Strait of Hormuz as “Trump Strait” despite the fact that the crucial waterway remains contested amid the war with Iran.\n“Now that we have it under U.S.A. control, should we change the name Hormuz Strait to TRUMP STRAIT??? Like America itself, it would be ‘hotter’ than ever before!” Trump said on his Truth Social network.\nAFP\nSeptember 02, 2026 21:06\nIran blacklists more ships trying to sail through Hormuz, govt. website shows\nIran has added more ships it deems as non-compliant and subject to fines, confiscation or detention if they try to sail through the Strait of Hormuz, according to a government website.\nTehran said on August 24 it had blacklisted 45 tankers that had broken its rules for navigating the Strait of Hormuz, and would take action against any vessels transferring loads, escalating its threats over the key waterway six months into a war that began with U.S. and Israeli strikes on Iran.\nIn an update on the website of the Persian Gulf Strait Authority (PGSA), a body set up by Iran to manage the strait, 11 more ship", "translation_ja": "", "vocab": [{"word": "blacklist", "definition": "違反者や非準拠対象を記録し、取引制限や罰則の対象とするリスト。ビジネスや規制の文脈で、資格を失った企業や個人を指定する際に使用される。"}, {"word": "escalation", "definition": "紛争や対立の段階的な拡大・激化。軍事衝突や交渉が徐々に深刻化していく過程を示す。"}, {"word": "strait", "definition": "陸地に挟まれた狭い海峡。国際的な海運の通路として戦略的に重要な地理的位置を持つ。"}, {"word": "retaliation", "definition": "相手方の攻撃や行為に対する報復行動。国際紛争では軍事的な反撃を意味することが多い。"}, {"word": "rhetoric", "definition": "政治的・外交的な説得力のある言説や主張。実際の行動と区別されることもある。"}, {"word": "sanctions", "definition": "国家が他国に対して経済的・政治的圧力を加えるための制限措置。輸出入禁止や資産凍結などが含まれる。"}]}, {"title_ja": "ウクライナ、ロシア領空は『安全でない』とUN航空監視機関に警告", "title_en": "Ukraine Warns UN Aviation Body That Russian Airspace 'Not Safe'", "summary_ja": "ウクライナは、繰り返される無人機攻撃を受けてロシア領空が安全でないことを国際民間航空機関に正式に通知した。ゼレンスキー大統領を含むウクライナ当局者は、戦争中にロシア領空を完全に危険な状態にすると警告した。ロシア航空監視機関はこの警告を不当なものとして拒否し、モスクワはウクライナの攻撃に対応して空港を閉鎖している。", "summary_en": "Ukraine formally notified the International Civil Aviation Organization that Russian airspace is unsafe following repeated Ukrainian drone strikes on Russian territory. Ukrainian officials, including President Zelensky, warned that drone operations would make Russian airspace completely unsafe for the duration of the conflict. Russia's aviation watchdog rejected the warnings as illegitimate, while Moscow has increasingly closed airports in response to Ukrainian strikes.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/ukraine-tells-un-aviation-watchdog-that-russian-airspace-not-safe/article71421217.ece", "state_media": false, "category": "政治", "full_text": "Ukraine said on Wednesday (September 3, 2026) it had formally notified the International Civil Aviation Organization that Russian airspace was \"not safe\", following repeated Ukrainian drone strikes on Russian territory.\nThe ICAO, a United Nations agency that regulates and establishes standards for civil aviation, made no immediate public comment.\nRussia's aviation watchdog called Ukraine's warnings illegitimate and \"invalid\".\nSince Russia invaded Ukraine in February 2022, Kyiv has launched retaliatory drone strikes on targets inside Russia, hitting energy and military infrastructure hundreds of kilometres from the front line.\nThe strikes come at a time when Moscow has launched waves of deadly drone and missile barrages at Ukrainian towns and cities.\n\"Against the backdrop of Russia's drastic escalation of terror against Ukraine, Russian airspace is becoming increasingly unsafe,\" Ukraine's Foreign Minister Andriy Sybiga said on X.\n\"We urge everyone to avoid it... Russia has been deliberately ignoring the existing threats as a result of its aggression against Ukraine, which has already led to several incidents in the past years,\" he said.\nUkrainian President Volodymyr Zelensky warned Tuesday his military's drones would make Russian airspace \"completely unsafe\" for the duration of the war.\nRussian President Vladimir Putin described Zelensky's comments as \"a declaration of state terrorism\".\nRussia's aviation watchdog regularly closes airports in response to Ukrainian drone strikes.\nIn 2024, Russian air defences accidentally downed an Azerbaijani passenger jet during what Moscow said was a Ukrainian drone attack.\nUkraine's airspace has been closed to civilian traffic since Russia's invasion.\nPublished - September 03, 2026 01:15 am IST", "translation_ja": "", "vocab": [{"word": "retaliatory", "definition": "報復的な、応報としての。相手からの攻撃や行動に対して、これを懲らしめるために行われることを意味する。"}, {"word": "escalation", "definition": "段階的な激化や増加。紛争や問題が時間とともに大きくなり、より深刻になっていく過程を表す。"}, {"word": "infrastructure", "definition": "基盤施設、インフラストラクチャー。電力網、道路、橋など、社会や経済の基本となる施設群を指す。"}, {"word": "aviation watchdog", "definition": "航空監視機関。航空業界を監督し、安全基準を維持する政府機関または国際機関のこと。"}, {"word": "declaration", "definition": "宣言、声明。公式に、またはしばしば重要性を持って何かを発表することを意味する。"}, {"word": "inadvertently", "definition": "不注意に、うっかりと。意図せずに何かが起こることを表す。ここでは文脈から「誤って」という意味で使用される。"}]}, {"title_ja": "貿易交渉の崩壊でアメリカの蒸留所が数億ドルの売上損失に直面", "title_en": "American distilleries face hundreds of millions in lost sales as trade talks collapse", "summary_ja": "貿易交渉の決裂により、アメリカの蒸留酒メーカーは深刻な打撃を受けている。この交渉の失敗により、業界は数億ドルの売上機会を失うことになった。", "summary_en": "American distillery companies are reeling from the breakdown of trade negotiations, which has resulted in significant financial losses. The collapse of trade talks has devastated the industry, with hundreds of millions of dollars in potential sales now at risk.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihgJBVV95cUxPdHBCaW5nVnJfY1o5dERPbkNmUHpkaXBzNVEwUjBvV25NTnk1T2libW1TZTV3emg5MXcySlJqa1oxUDFSdVhmdXB5ZXkwb09ZYnI3ZG1RV0pzTDZCZGJfRUJLV3FBRllaOTBGNFdYbUZkdUR4emFVQW1VMGxpcmpQVHZFenJtTmNFWndkbmZRTW13c0g5dTVUdEU4OGlSZWNpSWVIdkUxdkJKMFZqT3N3YXBtZ1RPYVNyT0oyM2N4bVVyLU1sdTdIWnJxVzBtMHNUZDRwcU15aUxjc00tT19ibG40aS1TNmoydWdyM3BDX2pNNzZKZExlOVllZ0VOdTdUZm9rMWln?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オンタリオ州の教師が指定ポータルより安い価格をStaplesの通常ウェブサイトで発見", "title_en": "Ontario Teachers Find Cheaper Staples Prices Outside Mandated Portal", "summary_ja": "オンタリオ州の教師は指定されたStaplesポータルから学用品を注文する必要がありますが、Staplesの通常ウェブサイトでより安い価格を発見しました。この価格差は、教育者向けの義務化された調達システムの費用対効果に関する疑問を生じさせています。", "summary_en": "Ontario teachers are required to order school supplies through a designated Staples portal, but have discovered significantly lower prices on Staples' regular website. This pricing discrepancy raises questions about the cost-effectiveness of the mandated procurement system for educators.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiuwJBVV95cUxQb0ZWRG9TcVNSUV9LdDRhdHp1WEZTWmxBUVhBcklqNEdXZGZwR2E2SURxZ3lfUFZnaWRycjZDX0VtaHlLd2h4VnJlX2hEbE5XZ3htbTFDeEhrMTlJNGc0UEMwc2dvVmhoRWw3RHlxeUR2T2NMTTVQZTAzTzNnLVFOM3NWYWRGNXRaNUxhbk90QzJQUzdrYzRHSVpoa0V6SXVWSlo4NjhBaTJrSnNXOEdpYUNUSFY5X3ZjdVZjZm5sWm5JejlZUWZuclZpWThNQmN6Q3lQc0ZVRm9tWWREOWRvYk4teEhaVXNFcHBDQlEwWEpZY3diUEtmY0FMUmZEendGcWJCMzhza0Q2d1Iyamx4X1p5M1pDX2JrcFZibXNoU0U3Nmh0Nm85VUFrR2lmZFRwdTJlZVIyRnhQUlU?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スーザン・デラクール：ピエール・ポワリエヴルの消失", "title_en": "Susan Delacourt: The disappearance of Pierre Poilievre", "summary_ja": "スーザン・デラクールは、保守党指導者ピエール・ポワリエヴルが最近公の場から姿を消していることを検証している。このコラムは、彼が政治舞台から消えることが党と指導力にとって何を意味するかを探る。デラクールは、重要な時期における彼のメディア露出の減少の影響を分析している。", "summary_en": "Susan Delacourt examines the recent absence of Conservative Leader Pierre Poilievre from public view. The column explores what his disappearance from the political spotlight might mean for his party and leadership. Delacourt analyzes the implications of his reduced media presence during a critical period.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi1AFBVV95cUxOMmw4OUJkWVEzb296MVZuLWU2VGRZbDRFM1EzbkxPb29kUjQtM0dSaDhuOGUwX1NYOFIzMy1wVnRkRnAwbkt3ajVVN1VNbnRmYkRCZTZ5dzhLdk1oa3hlVmlacHpaNUZmVVJHYUJBbG5LVzVqd2RWSzNlcjBpTTB5TXYtN1BCLTJmLWNpbFdRLU9XTTBWd3k5cXd5bWIzLXlWYlZKVDM5b3Y3T1JXZHEyY1NFbXFuMzNUZGpEZE5jRWE0UjY1QnRmdFR1WHZsU3lkMGRKTA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O グロボ英語ニュース", "title_en": "O Globo English News", "summary_ja": "O グロボが英語での最新ニュース報道を提供しています。この出版物は、現在の出来事と発展についての包括的なレポートを提供しています。O グロボの国際ニュースサービスで最新情報をご覧ください。", "summary_en": "O Globo presents its latest news coverage in English. This publication provides comprehensive reporting on current events and developments. Stay informed with O Globo's international news service.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE00WVFsTjVqR2xZQjFKaFZSNHBGUkpwZ2RhZXRRVUpPeHpoNXlfWENGNkN1VW9xOEtmby1oNVpYZVc2Y2huaWh2SnpvdExUbEJvZWhhc3ZXWnRFM2xIcVFiajR4UHA4NENhYXc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "百年の物語：O GLOBOと長年の購読者が2025年に100周年を祝う", "title_en": "Centenarians and a Century: O GLOBO Celebrates 100 Years with Long-Time Subscribers", "summary_ja": "ブラジルの新聞O GLOBOは2025年に創刊100周年を迎えるにあたり、同じく100歳の誕生日を迎える購読者たちのストーリーを紹介しています。この企画は、ブラジル史を通じて出版社とその最も忠実な読者の並行した人生の歩みを祝うものです。", "summary_en": "O GLOBO newspaper marks its centennial in 2025 by highlighting the stories of subscribers who have also reached their 100th birthday. The feature celebrates the parallel journeys of the publication and its most loyal readers over a century of Brazilian history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi4gFBVV95cUxQckNyQXRYdHI5dHNKNGFDT0ZIU1dlRnZxRFpYdkFYR1hoTFpkaDRobkZ6Mkxpd21oeVhRUU1qR3hCTjQyZmVRVlo3R1p0aGptR2JqVU5MR1lORGxJRTJXQ1B1eGNHVndIZXgyb1pqU0V3eURHRHFWYXFheE5sdkRBS3laU01nQzl5YVp0a2hiT3hzOHExNFRQUnlWLXUxOVJsSWJNbDQtdXhodVlSRGlWVFRVSjlSREZpaGFOelU5UmlxRmVVNEY4RG5GSjRDUWpWc3N6eWVzS3gtMkdkYi1kU1pn0gHwAUFVX3lxTE5mTnRybnZhQWpFUWpqZTloM0lHcjA5UFZQWWZyX05SclVVTXFxRU9lQnJnYVRLTkd5Z1FYOHgtOHNZV0I2dlZsRTBwZVdDVlFETkFuTWQxRFdTZE5mZXVjMXZPdEVQSjZIamJzWkdZX3ZXUFo3TEZfYm9ISzJjUFZ2eUVsaVhGTktPQkg2UlkwZEh5M3dRU2xZQUtBVkh6NEV2UmpOQ2Q4aC10TW9pdldLdUJieXVLaU1NWEZqbVhXYW52UUdIWjcya3c4WWMtb1VBUGI0OVk4bUlnZHo3cEtILVFRVS0ybUYtYmoyVVNWNg?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グルーポ・グローボ、創立100周年に向けた企画を準備中", "title_en": "Grupo Globo Prepares Initiatives for Centennial Year", "summary_ja": "ブラジル最大級のメディア企業グルーポ・グローボが、創立100周年を祝う特別な企画の準備を進めている。同社は、企業の歴史における重要なマイルストーンを記念するため、様々なプロジェクトやイベントを計画している。", "summary_en": "Grupo Globo, one of Brazil's largest media conglomerates, is preparing special initiatives to celebrate its centennial year. The company plans various projects and activities to mark this significant milestone in its history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イボ族の伝統的指導者がオス・カースト制度の廃止を呼びかけ", "title_en": "Igbo Traditional Rulers Call for End to 'Osu Caste' Practice", "summary_ja": "ナイジェリアのイボ族の伝統的指導者たちが、オス・カースト制度を差別的であり人間の平等と矛盾していると述べ、その廃止を呼びかけた。彼らはこの有害な慣行とイボランドのコミュニティへの影響に対処する新しいナリウッド映画「Properties of the Gods」を祝福する際に、この訴えを行った。", "summary_en": "Igbo traditional rulers in Nigeria have called for the abolition of the Osu caste system, describing it as discriminatory and inconsistent with human equality. They made the appeal while blessing a new Nollywood film titled 'Properties of the Gods' that addresses the harmful practice and its effects on Igboland communities.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/907119-igbo-traditional-rulers-others-seek-an-end-to-osu-caste-practice.html", "state_media": false, "category": "社会", "full_text": "The traditional rulers are Obi of Onitsha, Alfred Achebe; the Traditional Ruler of Nnewi, Kenneth Orizu, both in Anambra, and Samuel Asadu, the Enugu State Chairman, Traditional Rulers Council.\nThey made the call when the producer, directors and crew of the new Nollywood movie, “Properties of the Gods”, visited their palaces separately on Wednesday.\nThey described the practice as discriminatory and inconsistent with the equality of human beings. They said the visit was to seek their blessings ahead of the movie’s nationwide cinema premiere.\nThe movie – ‘Properties of the Gods’\nThe News Agency of Nigeria reports that the movie, produced by renowned Nollywood actor Joseph Okechukwu, addresses the Osu caste practice and its effects on people in Igboland.\nThe movie is scheduled to premiere in cinemas nationwide on 4 September.\nReceiving the team at his palace, Mr Achebe said ignorance was responsible for many superstitious beliefs and practices that had persisted despite advances in knowledge and civilisation.\nHe said all human beings were equal before God and that no individual or group had the right to regard another person as an underclass.\n“Ignorance drives superstition, which is anachronistic in the 21st century.\n“All human beings are equal in the eyes of God, who created all of us. Whether you are black, yellow or white, tall or short, man or woman, we are all created in His own image,” he said.\nThe traditional ruler described the Osu caste system as a “disgrace” and urged communities where the practice still existed to abolish it, saying that “This discrimination must end forever”.\nHe said increased knowledge and education had helped society to overcome several superstitious beliefs, adding that the same approach should be applied to the Osu system.\nMore than legislation needed to end Osu caste – Achebe\nMr Achebe said legislation alone might not be sufficient to eradicate the practice, stressing the need for mass mobilisation and a change in people’s mindset.\nHe noted that Onitsha did not operate the Osu caste system in the conventional sense, explaining that the traditional institution had a different understanding of the term.\nAccording to him, the abolition of discriminatory practices requires sustained advocacy and social acceptance.\n‘Nnewi had abolished it’\nAlso speaking, Mr Orizu, who addressed the visitors through the Crown Prince of Nnewi, Obi Orizu, recalled the Nnewi traditional institution’s decision to abolish the Osu system.\nHe said the decision was driven by the question of why some people should continue to live in bondage and be denied freedom and opportunities to prosper.\n“On his own initiative, and after consultations with the traditional authorities, he decided to abolish the system.\n“The ban was significant because immediately after the pronouncement was made, he was put to the test,” Mr Orizu said.\nMr Orizu said the decision had continued to yield benefits and should serve as an example to other communities.\n“We cannot say that our forefathers were enslaved and then turn around and enslave other people ourselves. That would be contradictory,” he said.\nOn his part, the Chairman of the Enugu State Council of Traditional Rulers, Samuel Asadu, endorsed the movie, describing it as a timely and welcome development.\nA philanthropist and media personality, Emmanuel Oko, popularly known as Okwuluora Ndigbo, said the Osu issue was one of the factors hindering the progress and unity of Igbo people.\nMr Oko commended the filmmakers for using cinema as a tool to reshape people’s mindset and promote inclusion.\nREAD ALSO: Igbo-Eze South chairman receives Africare’s excellence award\n“I am from Nkanu, where the practice is worse. People still tell me to avoid those they call Osu, yet some of the people helping me most in Enugu are those they call Osu. I still do not understand it,” he said.\nHe urged people, particularly in communities where the practice remained prevalent, to watch “Properties of the Gods” and support the campaign against discrimination.\nWhy we visited traditional rulers – Producer\nEarlier, Mr Okechukwu, the movie’s producer, said the team visited the traditional rulers to seek their blessings ahead of the film’s release.\nMr Okechukwu said the movie was not produced to create conflict or attack anybody, but to advance the conversation on the need for Igbo people to embrace one another.\n“Our mission is to advance the conversation to a point where our people can easily understand that the time has come for us to embrace one another rather than scatter one another,” he said.\nHe said the position expressed by the royal fathers demonstrated the need for other traditional rulers in the South-east to embrace inclusion.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "anachronistic", "definition": "時代遅れで現代に合わない、または時代錯誤的である。21世紀では古い信念や慣行に対して使用される。"}, {"word": "eradicate", "definition": "何かを完全に除去または根絶することを意味する。差別的慣行や問題を完全になくすために使用される。"}, {"word": "abolish", "definition": "法律または制度的な慣行を正式に廃止または終了させることを意味する。カースト制度などの制度的差別を終わらせるために使用される。"}, {"word": "endorse", "definition": "公式に支持または承認することを意味する。提案、映画、または行動方針に対して賛成を表明する際に使用される。"}, {"word": "advocacy", "definition": "特定の原因または変化を支持するための積極的なキャンペーンまたは活動。社会変化や改革を推し進める行為を指す。"}, {"word": "prevalent", "definition": "広く存在する、または一般的である。特定の地域またはグループ内で広く普及している状態を表す。"}, {"word": "superstition", "definition": "科学的根拠のない信念や慣行。知識や教育の欠如に基づいて人々が信じる迷信を指す。"}]}, {"title_ja": "元議員がゾーニング主張を拒否、ウゴチニェレの再選を支持", "title_en": "Ex-Lawmaker Rejects Zoning Claims, Backs Ugochinyere for Second Term in Imo", "summary_ja": "元下院議員ルーファス・オメイレは、イデアト連邦選挙区がゾーニング制度を運用しているという主張を否定し、現職議員イケンガ・ウゴチニェレが回転制ではなく投票者の選択によって議席を獲得したと主張している。オメイレは2023年の選挙でウゴチニェレがイデアト南からの現職者に勝利したことを、地理的な回転制が存在しないという証拠として挙げており、投票者に地理的回転よりもパフォーマンスを優先するよう促している。", "summary_en": "Former House member Rufus Omeire has dismissed claims that Ideato Federal Constituency operates under a zoning arrangement, arguing that incumbent lawmaker Ikenga Ugochinyere earned his seat through voter choice, not rotation. Omeire cited Ugochinyere's 2023 victory over the incumbent from Ideato South as evidence that no binding geographical rotation exists, and urged voters to prioritize performance over geographical rotation.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-east/907114-2027-ex-lawmaker-rejects-zoning-claim-backs-ugochinyere-for-second-term-in-imo-constituency.html", "state_media": false, "category": "社会", "full_text": "A former member of the House of Representatives, Rufus Omeire, has rejected claims that the Ideato Federal Constituency seat in Imo State is subject to a zoning arrangement between Ideato North and Ideato South.\nMr Omeire, who is the Action Peoples Party (APP) senatorial candidate for Imo West, said the latest agitation over the constituency’s 2027 representation was an attempt to undermine the incumbent lawmaker, Ikenga Ugochinyere (APP, Imo).\nMr Ugochinyere, who represents Ideato North/South Federal Constituency, is the Chairman of the House Committee on Petroleum Resources (Downstream).\nIn a statement issued in Abuja on Wednesday, Mr Omeire argued that Mr Ugochinyere did not emerge through zoning but through the decision of voters in the constituency.\n“Ikenga is not a product of zoning. He is a product of our people’s decision to elect a messenger they have confidence in, even while he was in exile,” he said.\nMr Omeire, who is from Ideato South, said the constituency had never operated a formal zoning arrangement for the federal House seat.\n“We don’t have zoning, and he can’t be a product of what does not exist,” he said.\nHe cited Mr Ugochinyere’s victory in the 2023 election over the then incumbent, Paschal Obi, who is from Ideato South, as evidence that voters in the constituency had not been bound by a rotational arrangement.\n“His closest challenger, who was the incumbent, was from Ideato South, went even up to the court, and Ikenga defeated him,” Omeire said.\nMr Omeire said he had personally attempted to secure a second term when he represented the constituency from Ideato South, but was not returned, which he cited as further evidence that there was no binding arrangement guaranteeing successive terms to a particular area.\nAccording to him, voters should be allowed to determine who represents them based on performance rather than geographical rotation.\n“The people love Ikenga because he is a light and a messenger who will one day host the Ideato flag at the centre of national and international politics,” he said.\nMr Omeire argued that repeatedly replacing representatives after a single term could undermine continuity and development in the constituency.\n“We are short-changing ourselves in this quest to always change our Reps after one tenure. We can never achieve any meaningful development from the federal level like this. We have finally gotten it right with Ikenga, so he should continue the wonderful work he is doing,” he said.\nThe former lawmaker also defended Mr Ugochinyere’s record, particularly his role in attracting federal attention to infrastructure in Ideato.\nHe credited the incumbent with securing President Bola Tinubu’s approval for N26 billion for the Ideato Bridge, claiming the intervention was obtained before the Imo State Government subsequently approached the Ministry of Works to take over the project.\nMr Omeire challenged the Imo State Government to identify projects it had initiated independently in the federal constituency.\n“Until they start the Amanator-Isiekenesi-Dikenafai Road and finish it, nobody can say they have done anything for us,” he said.\nMr Omeire, however, dismissed Mr Ugochinyere’s critics as “roadside clowns,” accusing them of mounting what he described as a “kindergarten attack” against the lawmaker.\nHe urged those behind the agitation to abandon what he called an attempt to create unnecessary tension and attract political attention.\n“This desperate show of shame was only an act to beg for the extension of their tenure, which has already expired,” he said.\nBackstory\nMr Ugochinyere was declared the winner of the 2023 election by the Independent National Electoral Commission (INEC) after polling 13,026 votes. Mr Obi, who contested on the Labour Party platform, came second with 5,696 votes, while the All Progressives Congress candidate (APC), Chika Abazu, scored 2,368 votes.\nThe election was subsequently challenged at the tribunal. In September 2023, the Imo State National and State House of Assembly Election Petitions Tribunal ordered Mr Ugochinyere’s removal and a supplementary election after ruling on the validity of his nomination. However, the Court of Appeal later overturned the tribunal’s decision and affirmed Ugochinyere’s election.\nREAD ALSO: 2027: Bende stakeholders back House of Reps deputy speaker, deny zoning agreement\nThe disagreement over zoning is not entirely new. While there is no evidence of a formal statutory or legally binding zoning arrangement for the federal constituency, available records show that the seat has historically alternated between politicians from the two LGAs, although not in a strict one-term-each pattern.\nRecords of the Fourth Republic show that ThankGod Ezeani and Patricia Udogu, both from Ideato North, represented the constituency between 1999 and 2007 before Mr Omeire, from Ideato South, took over from 2007 to 2011. The seat returned to Ideato North with Eddie Mbadiwe and was subsequently retained by Austin Chukwukere, both", "translation_ja": "", "vocab": [{"word": "zoning", "definition": "政治領域や選出権を特定の地域グループに割り当てる制度。多くの場合、複数の地域が順番に代表者を選出する取り決めを指す。"}, {"word": "incumbent", "definition": "現在その職務についている者。特に選挙の文脈では、再選出馬する現職の政治家を意味する。"}, {"word": "rotational arrangement", "definition": "複数の団体や地域が順番に特定の役職や権利を交代で担当する制度。"}, {"word": "agitation", "definition": "社会的または政治的な変化を求める熱心で組織的な活動や運動。"}, {"word": "continuity", "definition": "物事が中断なく続く状態。政治や行政では、同じ代表者による政策の継続性を指す。"}, {"word": "supplementary election", "definition": "元の選挙結果を無効にした場合に、再度投票を実施する追加的な選挙。"}]}, {"title_ja": "ワイク大臣、2027年の大統領選挙でティヌブ大統領にリバーズ州とFCTを勝利させると約束", "title_en": "Wike Vows to Deliver Rivers and FCT to Tinubu in 2027", "summary_ja": "ナイジェリアのFCT大臣ニョーソム・ワイクは、リバーズ州と連邦首都地域の政治構造を支配下に置いていることを宣言し、2027年の選挙でティヌブ大統領にこれら両地域を勝利させることを誓った。野党PDP党員である元州知事ワイクは、公職を保有することが政治的影響力を支配するために必要ではないと主張した。また、緑地への無許可承認を与えたFCTA職員に対する懲戒処分を発表し、アブジャでの最近の洪水の原因を違反的な土地侵害に帰した。", "summary_en": "Nigeria's FCT Minister Nyesom Wike declared he remains in charge of political structures in Rivers State and the FCT, pledging to deliver both territories to President Tinubu in the 2027 election. Wike, a former governor and opposition PDP member, insisted that holding office is not necessary to control political influence. He also announced disciplinary actions against FCTA officials for unauthorized approvals in green areas and blamed encroachment violations for recent flooding in Abuja.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/907112-2027-wike-vows-to-deliver-rivers-fct-to-tinubu.html", "state_media": false, "category": "政治", "full_text": "The Minister of the Federal Capital Territory, Nyesom Wike, has declared that he remains in charge of the political structures in Rivers State and the FCT, vowing to deliver them to President Bola Tinubu in the 2027 presidential election.\nMr Wike made the declaration on Wednesday during a media chat in Port Harcourt, where he described himself as the “General Commander of the Political Infantry” and dismissed the suggestion that only a sitting governor could control a state’s political structure.\n“You do not need to be governor before you can be in charge. I am the General Commander of the Political Infantry; therefore, I am in charge. So also in FCT. I owe the President to give these two,” he said.\nMr Wike, a former governor of Rivers State, has remained one of Mr Tinubu’s strongest political allies outside the ruling All Progressives Congress (APC), despite retaining his membership of the opposition Peoples Democratic Party (PDP).\nHe has repeatedly pledged to mobilise support for Mr Tinubu in Rivers ahead of the 2027 election.\nIn February, Mr Wike said supporters of the president in Rivers did not need a sitting governor to mobilise votes for him, arguing that he and his allies had enough political structures across the state to deliver the president.\nHis latest declaration comes amid continuing questions over the balance of political influence in Rivers State, where Governor Siminalayi Fubara has returned to the political centre after last year’s crisis with Mr Wike.\nMr Wike, however, insisted that occupying the governorship was not the only route to political control.\n‘I owe Tinubu Rivers, FCT’\nExplaining his political role, Mr Wike said his objective was to ensure that Mr Tinubu wins both Rivers and the FCT.\nHe said he would not sit back and allow opposition politicians to take the territories from the president.\n“Politics, of course, this is the time. You want me to fold my hand for Atiku to come and win the election?” he asked.\nThe minister also dismissed suggestions that he was relocating to Rivers State, saying his return was partly to reconnect with his political base and spend time with his family.\nHis comments come as politicians intensify preparations for the 2027 election.\nSuspension of FCTA director\nThe minister also announced the suspension of an FCTA director for allegedly issuing unauthorised temporary approvals to commercial operators on designated green areas.\nMr Wike said the action was part of the administration’s response to violations of the Abuja master plan, particularly the encroachment of green areas and waterways.\n“Beyond structural enforcement, the FCTA is also taking stern administrative action against officials within the administration who facilitate illegal encroachment into green areas and the waterways,” he said.\nHe said another official had faced disciplinary action for allegedly reallocating parkland under the guise of security clearing.\nThe sanctions followed recent flooding in parts of Abuja, particularly along the Airport Road corridor and in Lokogoma.\nMr Wike said the Executive Secretary of the Federal Capital Development Authority (FCDA) and the Director of Development Control had been dispatched to inspect affected communities.\n“When I heard of the incident, the executive secretary of the FCDA and the director, development control had to go to the place, not only at the Airport Road but also in Lokogoma,” he said.\nREAD ALSO: Wike orders crackdown on car dealers operating in Abuja’s green areas\nHe blamed part of the flooding on years of violations of the Abuja master plan, particularly developments that blocked waterways and road corridors.\n“From our studies, Lugbe has always violated the Abuja master plan. All over the years, you see people building without approval and blocking where there is supposed to be a roadway. As an administration, we are not taking it lightly,” he said.\nMr Wike vowed to remove structures found to be obstructing waterways and road corridors.\nHe also rejected claims that government approvals should protect structures built in prohibited areas.\n“You got approval to do something wrong, sometimes, it’s under influence. government policy is that nobody should do anything on green areas,” he said.\n“Now you go with the spirit that nothing will happen, and then when we come to enforce, you say you have approval. It is not going to be accepted.”\nThe FCTA has intensified enforcement against structures built on waterways and other prohibited areas following flooding in several parts of Abuja.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "encroachment", "definition": "未許可の土地侵害や不正な使用のこと。特に政府の制限区域に建物や構造物を違法に建設することを指す。"}, {"word": "mobilise", "definition": "サポーターや資源を組織化して活動させることを意味する。政治的支持を集めるために動員することを指す。"}, {"word": "facilitate", "definition": "何かが起こるのを容易にすること。通常は違法行為や不正行為を可能にすることを示唆する。"}, {"word": "enforcement", "definition": "法律や規則を厳格に実行すること。違反者に対して罰則を適用するプロセス。"}, {"word": "disciplinary action", "definition": "規則違反に対する懲罰や処分措置のこと。職員の不正行為に対する組織的な対応を指す。"}, {"word": "obstruct", "definition": "何かが通路を塞いだり、機能を妨害することを意味する。建物が水路や道路を塞ぐ場合に使用される。"}]}, {"title_ja": "米国とイラン、激しい夜間攻撃後の被害を調査", "title_en": "U.S. and Iran Survey Damage After Night of Intense Strikes", "summary_ja": "米軍はイランに対する報復攻撃を実施し、最近の米軍とマリタイム交通への攻撃に対応した。イラン当局者は攻撃中にウェディング式場が被撃されたと報告し、民間人の死傷者があったと主張している。両国は夜間の軍事衝突後の被害を評価している。", "summary_en": "The U.S. military launched a retaliatory barrage against Iran in response to recent attacks on American forces and maritime traffic. Iranian officials reported that a wedding was struck during the attacks, with claims of civilian casualties. Both nations are now assessing the damage from the overnight military exchange.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/02/world/middleeast/us-iran-strikes.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネパール洪水で奇跡的に生き残った「奇跡の家」", "title_en": "The 'Miracle House' That Survived Nepal's Floods", "summary_ja": "ネパールの緑色に塗られた家が、周囲を襲った壊滅的な洪水の中で奇跡的に生き残り、希望の象徴となっています。ピャクレル家の住宅は、暴走する洪水が周辺地域を壊滅させる中でも立ち続けました。この珍しい構造を写真に収めるため、多くの訪問者がこの家を訪れています。", "summary_en": "A green-painted house in Nepal has become a symbol of hope after miraculously surviving devastating floods that destroyed everything around it. The Pyakurel family's home remained standing as rampaging floodwaters devastated the surrounding area. The house has since attracted visitors who come to photograph this remarkable structure.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/02/world/asia/nepal-flood-miracle-house-dhunge-bazaar.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "黒海での攻撃が世界的穀物供給を脅かす", "title_en": "Black Sea Attacks Threaten Global Grain Supply", "summary_ja": "ロシアとウクライナによる港と船舶への攻撃により穀物輸出が混乱し、農家の経営危機を招いている。紛争により海上輸送ルートが危険化し供給が遮断される中、世界的な食糧危機が再び起こる可能性がある。", "summary_en": "Strikes on ports and vessels by Russia and Ukraine are disrupting grain exports, putting farmers at financial risk. The conflict could trigger another worldwide food crisis as shipping routes become increasingly dangerous and supplies are blocked.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/02/world/europe/russia-ukraine-port-attacks-farmers-grain.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事境界線の通過を許可、パレスチナ人が北ガザへ帰還", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Military Crossing Restrictions", "summary_ja": "イスラエルは人質解放交渉の行き詰まりが解消された後、ガザを二分する軍事地帯の通過をパレスチナ人に許可した。この措置は、北部地域への帰還を阻止していた制限の大きな転換を意味する。通過の許可は、長期にわたる膠着状態の後の進展を示すものである。", "summary_en": "Israel has allowed displaced Palestinians to begin crossing a military zone that divides Gaza following a breakthrough in hostage release negotiations. The move marks a significant shift in restrictions that had prevented residents from returning to the northern part of the enclave. The crossing represents progress after a prolonged deadlock between Israeli and Palestinian authorities.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発業者が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "Leading China Property Developer Reports Huge Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国最大級の不動産開発業者である万科集団が巨額の損失を報告し、不動産セクターの危機が深刻化していることを示している。同社の経営危機は業界全体への波及効果への懸念を高め、中国当局が追加的な救済措置を講じるかどうかという問題を提起している。", "summary_en": "Vanke, one of China's largest property developers, has reported substantial losses, signaling a deepening crisis in the real estate sector. The company's financial struggles raise concerns about the contagion effect across the industry and whether Chinese authorities will implement additional rescue measures.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による弾片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From October 7 Attack", "summary_ja": "イスラエルの医療関係者によると、解放された女性人質の一部は長期間孤立した状態で拘束され、8ヶ月間トンネル内に閉じ込められていた。人質の体内には10月7日の初期攻撃による弾片が残っており、彼らが拘禁中に被った外傷の深刻さを示している。", "summary_en": "Some of the women released from captivity were held in isolation for extended periods and spent eight months confined in tunnels, according to Israeli medical officials. The hostages' bodies retained shrapnel from the initial October 7 attack, highlighting the trauma they endured during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ戦争の激化：スウェーデンがロシアとの50年間の対立に備える", "title_en": "Ukraine War Intensifies: Sweden Prepares for 50 Years of Russian Confrontation", "summary_ja": "ウクライナ紛争は激化・拡大しており、解決の見通しは立っていない。ウクライナの同盟国となったスウェーデンは、ロシアとの対立が数十年間続く可能性に備えている。この悲観的な見通しは、地政学的な対立の長期化についての懸念の高まりを反映している。", "summary_en": "The Ukraine conflict is escalating and expanding with no clear resolution in sight. Sweden, now a Ukrainian ally, is bracing for a prolonged confrontation with Russia that could last five decades. The pessimistic outlook reflects growing concerns about the long-term nature of the geopolitical standoff.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/01/the-ukraine-war-is-intensifying-expanding-and-stuck", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIが宗教を変え、宗教がAIを変えようとしている", "title_en": "AI is Changing Religion and Religions are Trying to Change AI", "summary_ja": "チャットボットなどの人工知能と宗教的実践がますます交差し、イマームや司祭などの伝統的な精神的指導を置き換えるのか、それとも信仰者に届く能力を強化するのかという疑問が生じている。宗教機関はAI技術がどのようにその使命に役立つかを判断しながら、神学的および倫理的影響についての懸念に対処するために取り組んでいる。この議論は、技術進歩と信仰共同体の中心となる人間的要素の保存との間のより広い緊張を反映している。", "summary_en": "Artificial intelligence and chatbots are increasingly intersecting with religious practice, raising questions about whether they will replace traditional spiritual guidance from clergy or enhance their ability to reach believers. Religious institutions are engaging with AI technology to determine how it can serve their missions while addressing concerns about its theological and ethical implications. The debate reflects broader tensions between technological advancement and preserving the human elements central to faith communities.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/27/ai-is-changing-religion-and-religions-are-trying-to-change-ai", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領の権力が衰退する中、その危険性はかつてないほど高まる", "title_en": "As Trump's Presidency Falters, He Becomes Increasingly Dangerous", "summary_ja": "エコノミスト誌は、弱体化したトランプ政権が従来のレームダック状態よりも大きなリスクをもたらすと指摘している。老年のゴリラが支配権を守ろうとする様子に例えられ、政治力が低下するにつれて大統領がより攻撃的に行動する可能性があると分析されている。", "summary_en": "The Economist argues that a weakened Trump presidency poses greater risks than a typical lame duck administration. Drawing a comparison to an aging silverback gorilla defending its dominance, the analysis suggests the president may act more aggressively as his political power erodes.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/25/as-his-presidency-flounders-trump-is-more-dangerous-than-ever", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル右派、選挙敗北の危機で分裂し急進化", "title_en": "Israel's Right Wing Fractures as Election Nears, Rhetoric Hardens", "summary_ja": "10月27日の選挙を控え、イスラエルの右派連立政権内に亀裂が生じており、特にネタニヤフ首相と国家安全保障相ベン＝グヴィル間で緊張が高まっている。右派から極右政党まで各派閥は、選挙敗北の可能性への懸念の中で、支持者を動員するため修辞をエスカレートさせている。", "summary_en": "With elections scheduled for October 27, Israel's governing right-wing coalition is showing signs of strain, particularly between Prime Minister Netanyahu and National Security Minister Ben-Gvir. Political factions across the right to far-right spectrum are intensifying their rhetoric to mobilize supporters amid concerns about potential electoral losses.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/02/israel-s-right-threatened-with-possible-electoral-defeat-fractures-and-radicalizes_6757096_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナとロシアの非対称な消耗戦", "title_en": "Ukraine and Russia's Asymmetric War of Attrition", "summary_ja": "キーウとモスクワは経済を弱体化させ士気を損なうため、相互のインフラへの攻撃を強化している。ウクライナは弾道ミサイルを保有していないため、領土を狙う兵器の迎撃がますます困難になっており、より大きな代償を払っている。この非対称紛争はウクライナの民間人と防衛能力に重い負担をもたらしている。", "summary_en": "Kyiv and Moscow have intensified attacks on each other's infrastructure to weaken economies and undermine morale. Ukraine faces a disadvantage due to its lack of ballistic missiles and increasing difficulty in intercepting incoming strikes. This asymmetric conflict has placed a heavier burden on Ukraine's civilian population and defense capabilities.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/02/ukraine-and-russia-s-asymmetric-war-of-attrition_6757076_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン首相サンチェス、セウタ危機の統制回復を模索", "title_en": "Spain's PM Sanchez Seeks Control Over Ceuta Crisis Amid Rising Tensions", "summary_ja": "スペインのペドロ・サンチェス首相は、経済支援、緊急シェルター、国王フェリペ6世の訪問を含む緊急措置を実施し、スペイン領セウタでの緊張激化に対応している。これらの努力にもかかわらず、サンチェス首相は野党だけでなく政権内からも批判の矢面に立たされている。", "summary_en": "Spanish Prime Minister Pedro Sanchez is implementing emergency measures including economic aid, shelter, and a royal visit to address escalating tensions in the Spanish enclave of Ceuta. Despite these efforts, Sanchez faces mounting criticism from both opposition parties and within his own government coalition.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/02/spain-s-prime-minister-pedro-sanchez-seeks-to-regain-control-over-ceuta-crisis_6757101_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省ニュースレター", "title_en": "Mindef Newsletter", "summary_ja": "これは海峡時報の国防省コンテンツを特集したニュースレターです。読者は提供されたリンクを通じて追加の無料ニュースレターに登録し、購読を管理できます。", "summary_en": "This is a newsletter from The Straits Times featuring content from the Ministry of Defence. Readers can sign up for additional free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートニュースレターは、日々のニュース報道と分析を提供しています。読者は提供されたリンクを通じて追加の無料ニュースレターを購読し、購読を管理できます。", "summary_en": "The Straits Times Evening Update newsletter provides daily news coverage and analysis. Readers can subscribe to additional free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング - 2026年9月2日", "title_en": "Morning Briefing - September 2, 2026", "summary_ja": "ストレーツ・タイムズのモーニング・ブリーフィングは、読者に毎日のニュース更新と主要な記事を提供しています。購読者は、ニュースレターの設定を管理し、出版物から追加の無料コンテンツに登録できます。", "summary_en": "The Straits Times Morning Briefing provides readers with daily news updates and key stories. Subscribers can manage their newsletter preferences and sign up for additional free content from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヴァンスが「血の中傷」を理解していないことが反ユダヤ主義への認識を問う", "title_en": "Vance's Lack of Knowledge About Blood Libel Raises Questions on Antisemitism", "summary_ja": "JDヴァンスは、ユダヤ人に対する歴史的で致命的な虚偽の告発である「血の中傷」についての理解が著しく欠けていることを示した。この事件は、ヴァンスが反ユダヤ主義的な言説と憎悪の性質と深刻さを理解しているかについて深刻な疑問を投げかけている。", "summary_en": "JD Vance has demonstrated a concerning lack of understanding regarding the historical blood libel—a false and deadly antisemitic accusation. The incident raises serious questions about whether Vance comprehends the nature and severity of antisemitic tropes and hate.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMioAJBVV95cUxQVzBwNmExLThZdEFUZnFTZ3hLQXZlQ3RKNG1UNDlKTXBMLWM1X1VVXzZtd1c2N0NaUk5GQU9SQXV1MWV2SnhvYmM4ZTZBcnR4aFRHX2wydGtvR3BsX0RuTUNselQ3QnVBY0ItNkIzVy1iWWItUVRzNFQ2VnZ0TFdvVGh1V1VjUDdCdTREaDhobE9naUotSExkcFg5dWNfbEVYVWNSUzAxU2FyWjV1UEVzd05zVmgzRDB5V3I2bWU1eWhmb0ExM3RZejRPb2k4NmtYNnVUQWdnX2hua1BGRzJ4bkNCS1gzanhNbHZqNjRDSndXNy1FdDdIOTRlQUV2WVNqa1B4dkRJdFlEQ0wzemZxZlNaWXFtTVNVVGtpSVJnWjI?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "サラ・ネタニヤフによるヤイル・ゴラン攻撃は政府に逆効果となる可能性", "title_en": "Sara Netanyahu's Attacks on Yair Golan May Backfire on Government", "summary_ja": "10月7日の英雄ヤイル・ゴランに対するサラ・ネタニヤフの批判が論争を引き起こし、この攻撃が元軍事指導者に政治的に有利に働く可能性があると指摘されている。この事件は、政府の政策を批判する軍事指導者とネタニヤフ家の間の継続的な緊張を浮き彫りにしている。", "summary_en": "Sara Netanyahu's criticism of October 7 hero Yair Golan has sparked controversy, with some suggesting the attacks may ultimately benefit the former military leader politically. The incident highlights ongoing tensions between the Netanyahu family and military figures critical of the government's policies.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikgJBVV95cUxOZE5FUEVjeGVhTmpzcFkwRkpaa1YtZTE2S2ttUy11SGFYYmRIQ3JHLU92TktIZExDenRBeWdXXzh6ZGh5anJraFp5bFktQjllaThyN0V0S2sycnlHNVBWZGlDLUE5SnJRbjQwUEx0Wms4V01ON1E3OHFYRWtYdDVnZ0V2ZmVvMTUzdnYzMmVCXzRQb1FBaElfOXFTcGQ1dEJEbHJFRUJocGdOdUdZZzh6VnRvdF9UQk5yMGpKQVlsaVQwVm93SGwwYTVzNVFlbFB1VEM3Mk4xd2JlSGhjOVVUMHJGdWlQSUJpRjF0NUFENzdYUlloTndNZmJCeWR6M1dGaXFMc3FHUE1wS0ctOU5yYUN3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、海軍封鎖を懸念 弱体化した海軍では対抗困難の可能性", "title_en": "Israel Fears Naval Blockade as Depleted Navy Struggles to Respond", "summary_ja": "イスラエルは経済と安全保障に大きな影響を与える可能性のある海軍封鎖の脅威に直面している。すでに逼迫しているイスラエル海軍は、このような脅威に効果的に対抗するための十分なリソースを欠いており、同国の海洋防衛能力について疑問が生じている。", "summary_en": "Israel faces growing concerns about a potential naval blockade that could severely impact its economy and security. The Israeli Navy, already stretched thin, may lack sufficient resources to effectively counter such a threat, raising questions about the country's maritime defense capabilities.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimgJBVV95cUxPMmhuVFg1dWJCSUNXcDdOSWxoUWVUQXRLeTdoYmVVZ0RVN3VNZjNrWlRWamJLLXRCeVY0SWozNVcyeE95UFcyZmpSSWxlQ2FROU5BTVdMSk03SlJXRTF2YlYwTjV2Ul9BWm9oNHVvc2d4WVV0alBwZnhTRjNXTGl3YnMxWEVhLURfVHBSbzdOdGVRLWtoMlRSN1RzUTkyNHNpaFhpWmpsUWRoV3NzSW5tQ0xvRFVHcU1TUVJVcjJuOE94N0hRamYyWDNaMkFVQ1hjN3BlNUdVSnFibUh3eDVIRjVVZFBHTjB1OVV3dzA4OWNnWUpRWWlRR2d2d3lBeFhtWGgtTHFxcWVVYzdfY1FGdWxNSzZWR3k0TlE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "新報告書は人民解放軍が統合島嶼上陸能力を優先していることを示す", "title_en": "PLA Prioritizing Joint Island-Landing Capabilities: Report", "summary_ja": "新しい報告書は、中国人民解放軍が統合島嶼上陸能力の開発に注力していることを示唆している。アナリストは、これが台湾を標的とした潜在的な軍事作戦に向けた戦略的準備を反映していると示唆している。統合的な水陸両用作戦への強調は、人民解放軍の近代化の優先事項における重大なシフトを表している。", "summary_en": "A new report indicates China's People's Liberation Army is focusing on developing joint island-landing capabilities. Analysts suggest this reflects strategic preparations for potential military operations targeting Taiwan. The emphasis on coordinated amphibious operations represents a significant shift in PLA modernization priorities.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1WcWFlM1F2MUhNbmVTMjNkXzc0eUZfbnd6bS15bnRTbG1QdTZBQUpLYk5EcHFCa3ZVWWlpQkYxSGF6aFV5alI4bVpLUWdFM19WYXpaaFllQQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マイクロン台湾、労組がストライキを計画する中で過去最高のボーナスを配布", "title_en": "Micron Taiwan to Distribute Record Bonuses as Union Plans Strike", "summary_ja": "マイクロン台湾は労組がストライキを予定している中、従業員に過去最高のボーナスを配布することを発表した。この動きはメモリチップメーカーの台湾事業所における労働紛争に対処しようとする試みと見られている。相反する展開は経営陣と労働者の間での報酬と労働条件についての交渉が継続していることを浮き彫りにしている。", "summary_en": "Micron Taiwan announced it will distribute record bonuses to employees despite union plans to stage a strike. The move appears to be an attempt to address labor tensions at the memory chip manufacturer's Taiwan operations. The conflicting developments highlight ongoing negotiations between management and workers over compensation and working conditions.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5WcWUyZDZpY3g4TTJLcWYwcWItWnM3aTNpV0tEY1dKQXNBTHNhMnZPNV9DUlRGTnpuOGVwbkJtTm5kT0diQTFJQXJNSTdCSVUtT05aM2xzMA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "頼清徳総統、欧州にとの投資・租税協定署名を促促", "title_en": "Lai Urges Europe to Sign Investment and Tax Agreements with Taiwan", "summary_ja": "台湾の頼清徳総統は欧州諸国に対し、台湾との投資・租税協定の締結を呼びかけた。この動きは台湾と欧州諸国間の経済関係強化と二国間貿易の円滑化を目指すものである。このような協定は、相互投資の保護と商業協力の枠組みを提供することになる。", "summary_en": "Taiwan's President Lai Ching-te has called on European nations to establish investment and tax agreements with Taiwan. The move aims to strengthen economic ties and facilitate bilateral trade between Taiwan and European countries. Such agreements would provide a framework for enhanced commercial cooperation and protection of mutual investments.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5RQXFZX0hoYmpBNkoxcDRrMnlVZERicEl5TmdFR1AzOVEtSElzVFJ4Zk5XOE1xRzhmVkg1eFUzdHY0WEt6d2xmSml2YTFRYm00N3EydVJSOA?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ビシュケクのSCOプラス会議でのxi近平の重要な発言", "title_en": "Xi Jinping's Key Quotes at SCO Plus Meeting in Bishkek", "summary_ja": "CGTNは、中国の習近平国家主席がキルギスのビシュケクで開催された上海協力機構プラス会議で発言したと報じている。国営メディアは、参加国間の地域協力と多国間協力に対する習主席の重要な発言を強調している。", "summary_en": "CGTN reports that Chinese President Xi Jinping delivered remarks at the Shanghai Cooperation Organization Plus meeting held in Bishkek, Kyrgyzstan. The state media outlet highlights key quotes from Xi addressing regional cooperation and multilateral engagement among participating nations.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-01/Xi-Jinping-s-key-quotes-at-the-SCO-Plus-meeting-in-Bishkek-1Q5Fnf9srew/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国の新たな攻撃後、イランが報復を実施し地域緊張が激化", "title_en": "Iran retaliates after US launches new strikes, escalating regional tensions", "summary_ja": "CGTNによると、米国はイランに対する新たな攻撃を実施し、イランの報復を招き、ホルムズ海峡周辺の緊張がさらに高まったと報じている。同メディアは、ワシントンとテヘランが非難と追加軍事行動の脅威を交わしたと伝えている。この緊張激化は、両国間の地域軍事緊張の大幅な増加を示している。", "summary_en": "CGTN reports that the US has launched new strikes against Iran, prompting reported Iranian retaliation that has further escalated tensions around the Strait of Hormuz. According to the state outlet, Washington and Tehran have traded accusations and threats of additional military action. The escalation marks a significant increase in regional military tensions between the two countries.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-02/Iran-hits-back-after-US-launches-new-strikes-1Q6rP6bAqY0/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国がイランを攻撃、革命防衛隊が報復を実施", "title_en": "US strikes Iran; IRGC reports casualties on Larak Island", "summary_ja": "CGTNは、イランの革命防衛隊がホルムズガン州のララク島への米国とイスラエルの共同攻撃で、日曜夜に複数の軍要員と民間人が殺傷されたと主張したと報じています。この攻撃は1ヶ月間の休戦期間の後に行われたものとみられています。CGTNは、イランがその後、米軍基地に対する報復攻撃を実施したと報じています。", "summary_en": "CGTN reports that Iran's Islamic Revolutionary Guard Corps claimed a US-Israeli attack on Larak Island in Hormozgan province killed or wounded multiple military personnel and civilians on Sunday night. The report indicates this strike follows a month-long pause in hostilities. CGTN reports that Iran subsequently conducted retaliatory strikes against US military bases.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-31/news-1Q2Z34oDxMk/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "TASS：キエフ軍がDPRを28回砲撃、4人が死亡", "title_en": "TASS reports Kiev troops shelled DPR 28 times, killing four", "summary_ja": "TASSは、ウクライナ軍がドネツク人民共和国に対して過去24時間で28回の砲撃を実施し、4人が死亡したと報じている。国営メディアによると、これらの攻撃により5つの民間インフラ施設、複数の車両、バス、および特殊車両が損傷した。TASS通信は、これらの事件を民間地域への攻撃として特徴付けている。", "summary_en": "TASS reports that Ukrainian forces conducted 28 artillery strikes against the Donetsk People's Republic in the past day, resulting in four deaths. According to the state-controlled source, the attacks damaged five civil infrastructure sites, multiple vehicles, a bus, and special equipment. TASS characterizes the incidents as attacks on civilian areas.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2181521", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "NBCが報じる：米国がイランの結婚式への攻撃について調査", "title_en": "US Investigates Strike on Wedding in Iran, NBC Reports", "summary_ja": "NBCは米国がイランの結婚式への攻撃の状況について調査していると報じている。同報告書によれば、武器情報の専門家は、その攻撃は米国が空中投下する精密誘導兵器を使用した可能性があると述べている。この事件は米国とイランの関係における重要な外交的展開となっている。", "summary_en": "NBC reports that the US is investigating circumstances surrounding a strike on a wedding in Iran. According to the report, an arms intelligence expert stated that the attack likely involved US air-delivered precision guided weapons. The incident marks a significant diplomatic development in US-Iran relations.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2181517", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ノルウェー、スヴァールバル諸島でロシア船舶モルチャノフ教授号を差し押さえ", "title_en": "Norway seizes Russian vessel Professor Molchanov in Svalbard", "summary_ja": "TASSの報道によると、ノルウェーはスヴァールバル諸島でロシアの調査船モルチャノフ教授号を差し押さえた。同船はスヴァールバル県知事の決定を待つ間、現在地からの離去が禁止されているとされている。この差し押さえは北極圏におけるロシアとノルウェー間の緊張の高まりを反映している。", "summary_en": "TASS reports that Norway has seized the Russian research vessel Professor Molchanov in Svalbard. The vessel is reportedly prohibited from leaving its current location pending a decision by the Governor of Svalbard. The seizure reflects ongoing tensions between Russia and Norway in the Arctic region.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2181515", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツの政治的防火線が崩壊している", "title_en": "Germany's Political Firewall Is Crumbling", "summary_ja": "著者は、ドイツの伝統的な極右政党への共同戦線が弱まっており、ドイツのための選択肢党が初めて州政府の支配を獲得する可能性があると主張している。単に政治的合意を通じて極端主義政党を排除することは不十分であり、民主主義の衰退を防ぐには効果的な統治と国民の懸念への対処が必要だと述べている。", "summary_en": "The author argues that Germany's traditional consensus against far-right parties is weakening, with the Alternative für Deutschland potentially gaining control of a state government for the first time. The piece contends that merely excluding extremist parties through political agreement is insufficient; effective governance and addressing citizens' concerns are necessary to prevent democratic backsliding.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/germany-brandmauer-firewall-faces-reckoning-in-saxony-anhalt-by-michael-broning-2026-09", "state_media": false, "category": "オピニオン", "full_text": "Germany’s Political Firewall Is Crumbling\nThe upcoming election in Saxony-Anhalt could give the far-right Alternative für Deutschland control of a state government for the first time in Germany’s postwar history. Its rise offers a crucial lesson for democracies elsewhere: closing ranks against extremist parties is no substitute for effective governance.\nNEW YORK—On May 8, 1654, the mayor of Magdeburg appeared before the Imperial Diet at Regensburg with two hollow copper hemispheres and 30 horses. Nothing joined the metal halves, yet the horses could not pull them apart. The hemispheres were held together by the vacuum within and the weight of the atmosphere around them. Only when a valve was opened and air rushed in did the spheres fall apart.", "translation_ja": "", "vocab": [{"word": "firewall", "definition": "政治的または社会的な障壁のこと。ここでは、極右政党を排除するための政党間の合意や共同戦線を指しており、不正アクセスを防ぐコンピュータセキュリティ用語から転じた表現。"}, {"word": "extremist", "definition": "極端な政治的または思想的立場を持つ人またはグループのこと。民主主義や社会規範から大きく逸脱した行動や主張を特徴とする。"}, {"word": "postwar", "definition": "第二次世界大戦終結後の時期を指す。ドイツの場合は1945年以降の歴史的時期を意味する。"}, {"word": "consensus", "definition": "複数の政党や団体が合意した共通の見解や方針のこと。意見の相違を乗り越えて達成された一般的な合意を示す。"}, {"word": "governance", "definition": "政治的・行政的な統治や管理のプロセスのこと。政府が市民のニーズにどの程度対応できているかを評価する際に使用される。"}, {"word": "crumbling", "definition": "徐々に壊れたり、弱くなったりしている状態を表す。比喩的に、政治体制や社会的合意が侵食されることを意味する。"}]}, {"title_ja": "スイム可能な都市テスト", "title_en": "The Swimmable City Test", "summary_ja": "マリアナ・マッツカートは、ロンドンが2035年までに全ての家庭から15分以内に安全な水泳施設を提供するという野心的な目標を達成するには、個別プロジェクトではなく統一された公共ミッションとして扱う必要があると主張しています。彼女は省庁横断的な調整、成果志向の調達、グリーンファイナンス、および強い条件付けが社会的公平性と経済機会をもたらしながら気候インフラニーズに対応できると論じています。", "summary_en": "Mariana Mazzucato argues that London's ambitious goal to provide safe swimming within 15 minutes of every home by 2035 requires treating the initiative as a unified public mission rather than separate projects. She contends that cross-ministerial coordination, outcomes-oriented procurement, green financing, and strong conditionalities can unlock both social equity benefits and economic opportunities while addressing climate infrastructure needs.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/swimmable-city-case-for-mission-approach-to-public-policy-by-mariana-mazzucato-2026-09", "state_media": false, "category": "オピニオン", "full_text": "The Swimmable City Test\nMariana Mazzucato\nIn committing to provide a safe swimmable place within 15 minutes of every home by 2035, London Mayor Sadiq Khan has set a measurable, time-bound goal that cannot be met through a single program or line item on the budget. Instead, it requires a public mission capable of mobilizing all ministries and shaping markets.\nLONDON—Had you visited a London pool during this sweltering summer, you would have found it quieter than expected. Since the COVID-19 pandemic, the city’s public swimming amenities have moved to booking systems that favor those who can plan days ahead, pay upfront, and spare an adult for the afternoon. Many Londoners fail that test.\nBut London Mayor Sadiq Khan has committed to making the city swimmable. His Clean Rivers and Waterways Plan, launched in July, seeks to widen access across ten strategic locations by 2036, with partners committing around £1.8 billion ($2.4 billion) by 2030. Still, the plan’s success will depend on whether its 48 projects are governed as one portfolio with a single overarching objective, as opposed to featuring 48 projects with 48 separate owners. That is the difference between a program and a mission.\nCities around the world are recognizing pools and other “blue spaces” as critical forms of climate infrastructure. After modernizing its sewers and treatment facilities through the 1990s, Copenhagen opened its first harbor bath at Islands Brygge in 2002, lending momentum to a model that has since been exported to Oslo and New York City. Paris spent €1.4 billion ($1.6 billion) cleaning up the Seine, which now offers public-access, lifeguarded bathing sites—the first legal swimming in the river since 1923. These cities all share the same level of ambition, and they now have an opportunity to develop a shared method of delivery.\nDoing so would unlock both social and economic benefits. Sport England’s Active Lives survey shows that 82% of children from affluent households can swim 25 meters (82 feet) unaided, against 39% of those from lower down the economic ladder. Similarly, 47% of children attending school in the most deprived geographic areas can swim the same distance, against 69% in the least deprived areas. The Black Swimming Association reports that 96% of Black adults in England do not swim regularly, though the equivalent figure for white British adults is 90%. What the children priced and planned out of water access have in common is income and postal codes.\nBut access to swimming is not just a social issue. Restoring a river is also a productive activity that requires someone to design the wetland, lay the sustainable drainage, build and run the treatment and reuse facilities, monitor water quality, maintain the banks, staff the swimming areas and teach children to swim. Public spending on that scale requires a full procurement pipeline, and procurement pipelines shape markets.\nOrganizing the plan as a mission is key. Providing a safe swimmable place within 15 minutes of every home by 2035 is a measurable, time-bound goal that requires health, environment, education, and transportation ministries to work together with local governments and water regulation authorities.\nFive elements are needed to complete such a mission. The first is governance, specifically a cross-ministerial board with authority over decision-making sequencing and budget alignment (as opposed to a forum that merely shares information and defers decisions upward). Someone must own the outcome. Melbourne, for example, started by identifying which work streams its council actually controls, then built a coalition to secure commitments on the rest.\nThe second element is procurement. Public purchasing power remains one of the most underused market-shaping instruments governments hold. Working with Camden Council, my team at University College London has shown that outcomes-oriented procurement—judging contracts by the public value they deliver rather than by cost savings—can reshape how an authority commissions everything from housing to leisure services. And in New YorkCity, Mayor Zohran Mamdani has brought the same insight to bear on the provision of food, using public demand to build supply where private markets have not.\nThe third element is finance. Green-blue bonds issued at the national level would spare councils from competing against one another for small, short-term grant funding; staff could focus on delivery instead of paperwork. There is already a precedent here. In 2019, the European Bank for Reconstruction and Development raised $700 million through the first dedicated climate-resilience bond, and the United Kingdom’s own green gilt program has financed a substantial share of the Environment Agency’s flood investment.\nThe fourth element is strong conditionalities. When public finance, concessions, and discharge permits flow to water companies and contractors, they should carry obligations on pollution reduction, reuse, apprenticeships, and ", "translation_ja": "", "vocab": [{"word": "mission-oriented", "definition": "目標達成に向けて複数の部門や機関が統一された目的で協力する方針。単なる個別プロジェクトではなく、横断的で包括的なアプローチを意味します。"}, {"word": "procurement", "definition": "政府や組織が商品やサービスを購入・調達するプロセス。公的な購買力を活用して市場を形成する手段として機能します。"}, {"word": "conditionalities", "definition": "資金援助や許可の条件として課される義務や要件。企業や請負業者が満たすべき基準を指します。"}, {"word": "blue spaces", "definition": "水環境に関連する公共スペース。池、河川、港湾浴場など、都市の気候インフラとして機能する水域を指します。"}, {"word": "portfolio", "definition": "複数のプロジェクトや資産をまとめた総合的な計画や構成。一つの統一的な目標に基づいて管理される複数要素の集合を意味します。"}, {"word": "outcomes-oriented", "definition": "最終的な結果や成果に基づいて判断・評価する姿勢。コスト削減よりも公共価値の実現を優先する調達方式です。"}, {"word": "equitable", "definition": "公正で不公正がない状態。所得や地域に関わらず、全ての人が平等にアクセスできる条件を指します。"}]}, {"title_ja": "経済学の物語：主流派経済学に異議を唱える新著", "title_en": "The Tale of Economics: A Book That Challenges Mainstream Discipline", "summary_ja": "ケンブリッジ大学のアンタラ・ハルダルによる新著『Everyman: The Untold Story of Economics』が経済学の起源と本来の目的を検証していることを称賛するオピニオン記事。本書は主流派経済学を批判しながら、経済学の主流派が基本的な真実をどのように隠蔽してきたかに異議を唱える新しい視点を提供している。", "summary_en": "An opinion piece praising Antara Haldar's new book 'Everyman: The Untold Story of Economics' for examining the origins and original purpose of economics as a discipline. The book critiques mainstream economics while offering fresh perspectives that challenge how major economic schools have obscured fundamental truths about the field.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/tale-of-economics-from-adam-smith-to-today-by-james-k-galbraith-2026-09", "state_media": false, "category": "オピニオン", "full_text": "The Tale of Economics\nA new book tells the story of the economics discipline and its original purpose with a degree of verve and imaginativeness that puts dreary mainstream economists to shame. In the process, it gets at fundamental truths that major schools within the discipline have managed to obscure.\nTOWNSHEND, VERMONT—The legitimacy of economics as an academic discipline and policymaking tool has been under sustained attack at least since the 2008 financial crisis. But few critiques seek to reckon with the origins of the discipline and the purpose behind it. Now, Antara Haldar, a legal studies scholar at the University of Cambridge, has called attention to both questions in a new book, Everyman: The Untold Story of Economics.", "translation_ja": "", "vocab": [{"word": "legitimacy", "definition": "ある事柄や組織が正当で信頼できるという状態。学問分野や政策決定ツールとしての正当性や信用性を示す際に用いられる。"}, {"word": "sustained", "definition": "継続的で絶え間ない状態を指す。2008年の金融危機以来ずっと続いている批判のように、長期間にわたって持続していることを表現する。"}, {"word": "reckon with", "definition": "ある事柄と向き合う、考慮する、対処するという意味の表現。経済学の起源と目的の問題に真摯に取り組むことを示す。"}, {"word": "obscure", "definition": "事実や真実を隠す、不明確にするという動詞。経済学の主流派が基本的な真実をわかりにくくしてきたことを指す。"}, {"word": "verve", "definition": "活力、熱意、生き生きした精神のこと。本の執筆スタイルが主流派経済学者とは異なり、より活気に満ちていることを表現する。"}]}, {"title_ja": "トランプ政権の人種差別的難民政策：白人南アフリカ人には数十億ドル、黒人とラテン系住民には強制送還", "title_en": "Trump Admin's Racist Refugee Policy: Billions for White South Africans, Deportations for Black and Brown People", "summary_ja": "著者ヘバ・ゴワイードは、トランプ政権が2025-2026年の再定住難民のほぼ全員を白人南アフリカ人から受け入れながら、同時にハイチ出身のTPS保有者35万人を強制送還することは、米国の移民政策における体系的人種差別を露呈していると主張している。政権は一人あたりの初期難民支援を4,500ドルに倍増したが、これはアパルトヘイトの受益者である白人にのみ適用され、人道的保護が必要な非白人移民には支援を拒否している。", "summary_en": "Author Heba Gowayed argues that the Trump administration's decision to admit nearly all 2025-2026 resettled refugees from white South Africa while simultaneously deporting 350,000 Haitian TPS holders exposes systemic racism in US immigration policy. The administration doubled initial refugee support to $4,500 per person—a long-overdue increase—but only for white beneficiaries of apartheid, while denying assistance to non-white immigrants who actually need humanitarian protection and have no pathway to citizenship.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/02/trump-deportation-refugees-south-africa", "state_media": false, "category": "オピニオン", "full_text": "The United States once led most other nations on resettling refugees from all over the world. But in the fiscal year 2025- 2026, except for three people from Afghanistan, all of the 10,258 people admitted through resettlement were white South Africans.\nBut admitting en masse the beneficiaries of South African apartheid, while simultaneously cancelling temporary protected status (TPS) for 350,000 Haitians, and making a spectacle of detaining and shackling them, is just the tip of the racist iceberg: the Trump administration is reportedly using this moment to double the initial resettlement support that refugees receive to $4,500 per person.\nAs an expert on resettlement, I have been advocating for years for an increase in resettlement support. In 2022, I wrote a book showing the inadequacy of existing systems of support, and even consulted for the office of refugee resettlement on the issue.\n  Yet, when the refugees weren’t white, the advocacy was not heard.\nResettled refugees are an anomaly in the United States landscape for immigrant support, in that they are one of the very few legal categories of immigrants to receive any form of cash assistance. That is because they are selected, in theory, on the basis of humanitarian need. The people in my book were Syrians who had escaped war, many of whom had children with chronic health issues.\nThis is yet another reason why this administration’s politicization of the refugee resettlement protection – at the exclusion of people who actually need it – is so pernicious.\nStill, the financial assistance received by refugees was always inadequate, pushing these people – once business owners and skilled artisans who had lost everything in war– into menial work within months of arrival, and into the experience of US poverty, which is no one’s salvation. Their downward mobility was by design – refugee support drew from a threadbare social safety net, eroded by anti-Black and anti-immigrant racism.\nDespite nativism, which stoked anti-immigrant sentiment, white Europeans who migrated to the US at the turn of the 20th century during the Progressive Era and New Deal received generous social support. Archival research by the sociologist Cybelle Fox shows that social workers did not deny them assistance on the basis of legal status, and shielded them from immigration enforcement. At the time, most immigrants to the United States were white, owing to racial quotas that limited travel to the country to people from western Europe.\nHowever, in the aftermath of the civil rights movement, as explicit discrimination was outlawed, and whites-only racial quotas for immigration abolished – the right, beginning with Ronald Reagan, set their eyes on destroying cash assistance for poor families of color.\nThe welfare reforms were supported by the caricature of the “welfare queen” – an image of a single Black mother with “too many” kids who raked in thousands in government support fraudulently, only to spend it frivolously. Of course it did not matter that the actual woman accused of these acts, Linda Taylor, was white on the census.\nThe goal for the poor, whether in the Refugee Act of 1980 or in federal welfare policy, became explicitly “self-sufficiency” – or nonreliance on government services, language that places the onus for poverty at the level of the individual – a moral failing caused by laziness or a lack of discipline rather than a societal one caused by redlining, or overpolicing, or even recovering from war.\nBy 1996, the Personal Responsibility and Work Opportunity Reconciliation Act (PRWORA), a pillar of Newt Gingrich’s “Contract With America” – a part of the Republican Revolution meant to slash government benefits – was signed into law by Bill Clinton, not only turning welfare into workfare, but also excluding the vast majority of immigrants, documented and not, from any forms of cash assistance except for refugees and asylum seekers (and later survivors of trafficking).\nHolders of temporary protected status, like the Haitians now being deported, were never eligible for any of the forms of support that today’s white South Africans are eligible for. Instead, they paid taxes into a social service system that they could not benefit from.\nMeanwhile the white South Africans, are eligible, as resettled refugees, not only for the doubled initial assistance – often called Resettlement and Placement or “Welcome Money” – but also for cash assistance through Temporary Assistance for Needy Families (the official name for welfare post-1996 reforms) or Refugee Cash Assistance.\nAnd while the Haitians, or Venezuelans, or Somalis on temporary protected status never had a pathway to citizenship, these white South Africans will be eligible to become legal permanent residents (green card holders) in a year, and citizens five years after that.\nWhat makes this even more sickening is that TPS is a form of protection – designated for people whose countries are unsafe. The choice to deny them a pathway to", "translation_ja": "", "vocab": [{"word": "pernicious", "definition": "悪質で有害な、狡猾で危険な。政策や行為が見た目は別として実は深刻な害をもたらすことを指す。"}, {"word": "anomaly", "definition": "通常の規則や期待から外れた異常な事例。通常と異なる珍しいケースを意味する。"}, {"word": "archival", "definition": "歴史的記録や公文書に関する。過去の文書館資料を調査する際に使用される学術用語。"}, {"word": "nativism", "definition": "自国民を優遇し外国人や移民を排除する政治的立場。排外主義的なイデオロギーを指す。"}, {"word": "caricature", "definition": "実際より誇張して描いた似顔絵や表現。ステレオタイプを過度に強調した描写を意味する。"}, {"word": "redlining", "definition": "銀行や保険会社が特定の地域（特に黒人居住地）への融資を意図的に拒否する差別的慣行。"}, {"word": "reconciliation", "definition": "対立や不一致を解決して調和させること。法律の文脈では異なる利益を調整する政策を指す。"}]}, {"title_ja": "トランプのカナダへの脅迫戦術は裏目に出ている、とロバート・ライヒが指摘", "title_en": "Trump's Bullying of Canada is Backfiring, Says Robert Reich", "summary_ja": "前労働長官ロバート・ライヒは、トランプのカナダとの貿易戦争は脅迫行動に根ざした戦略的な失策だと主張しています。屈服を達成する代わりに、トランプの関税はカナダ国民を団結させ、カーニー首相への支持を高め、米国内では57%の国民が反対しています。", "summary_en": "Former Labor Secretary Robert Reich argues that Trump's trade war with Canada is a strategic blunder rooted in bullying behavior. Rather than achieving submission, Trump's tariffs have unified Canadians against him, boosted support for Prime Minister Carney, and weakened separatist movements while facing domestic opposition from 57% of Americans.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/02/trump-canada-tariffs-trade-war-backfiring", "state_media": false, "category": "オピニオン", "full_text": "What do bullies do when someone stands up to their bullying and punches them in the face? They look for someone weaker to bully who won’t punch back.\nPresumably that’s why Donald Trump has now taken on Canada, after Iran punched back so hard in the cage match the US president began more than six months ago as to leave him humiliated and baffled.\nTrump wants to be the bully who humiliates others and forces them into submission. Needing to assert his dominance, Trump has now started a trade war with our northern neighbor, friend, second-largest trading partner (after Mexico) and, at least until now, reliable ally.\nHe’s hammering Canada on his Truth Social and in media appearances, saying Canada has “ripped off” the US for years, and signing an order to rename Lake Ontario “Lake America”.\nThis is pure bunk, of course – more empty Trump bravado and ignorant belligerence. Canada? Really? If Mel Brooks were still making movies, this would be a comedy. But as all else with Trump, it’s no laughing matter.\nTrump apparently assumed that Canada would quickly surrender because it had more to lose. The tariffs Trump has imposed on Canada – along with those he’s threatening if Canada retaliates – affect a tiny portion of the US’s total imports but a huge portion of Canada’s total exports.\nJamieson Greer, Trump’s US trade representative, says the duties are too small to pose a problem for the US and are “more [Canada’s] emergency than ours”.\nBut bullies like Trump rarely think about the effects of their bullying on the thinking and attitudes of their targets.\nTrump’s bullying of Iran has not only reinforced its hardline regime but shown them that control over the strait of Hormuz is an effective means of gaining concessions from other Gulf states as well as the US, and likely strengthened their resolve to build a nuclear weapon.\nTrump’s bullying of Canada, meanwhile, is igniting a patriotism that has often eluded that nation, which separatist factions have long threatened to pull apart.\nMark Carney’s decision to stand up to Trump – through “dollar for dollar” retaliation on goods coming from key industries in states including Ohio and Texas with competitive Senate elections – has led to a surge of support for the prime minister’s Liberal party. Liberals won three special by-elections on Monday.\nTrump’s trade war with Canada has also dimmed the prospects of Canada’s separatist movements, at least in the short term. A candidate from Carney’s Liberal party edged out a Quebec separatist in one of Monday’s special by-elections, in a district hit hard by US tariffs.\nThis is a good omen for Canada before 5 October’s vote in Quebec on whether the province’s secessionist party,
