Parti Québécois, gains additional seats in the province’s legislative body, and 19 October’s vote in Alberta on whether to hold a referendum to secede from the rest of Canada.\nTrump may also have underestimated the negative reactions to his trade war at home. According to a new Reuters/Ipsos poll, 57% of Americans oppose Trump’s moves to impose tariffs on Canadian imports. About 63% oppose his peevish order to rename Lake Ontario “Lake America”. Only 20% support the higher tariffs on Canadian goods.\nThe negative response is especially pronounced in border states whose economies are tightly interconnected with Canada.\nIn Michigan, for example, where overwhelming majorities oppose Trump’s tariffs on Canada, Democrats have launched new attack ads on the Republican Senate candidate Mike Rogers for refusing to denounce the tariffs. The Democratic Senate candidate Abdul El-Sayed called Trump an “asshole” for launching the trade war.\nThere’s still time for the US and Canada to avoid the worst of the economic and political fallout from this. Carney’s “dollar for dollar” retaliation goes into effect on 8 September but Trump’s counter-counter measure – threatened 50% tariffs on autos and auto parts – won’t go into effect until New Year’s Day.\nStill, no one should expect an easy resolution to what may go down in history as the stupidest of all the stupid foreign policies Trump has initiated. And given the extent of Trump’s dumb international moves, that is saying something.\n- \n  Robert Reich, a former US secretary of labor, is a professor of public policy emeritus at the University of California, Berkeley. He is a Guardian US columnist and his newsletter is at robertreich.substack.com. His new book, Coming Up Short: A Memoir of My America, is out now in the US and in the UK", "translation_ja": "", "vocab": [{"word": "belligerence", "definition": "敵意的で挑戦的な行動や態度。特に国家間の対立や攻撃的姿勢を指す。"}, {"word": "retaliation", "definition": "相手の攻撃や不正行為に対する報復や返撃。国際関係では相互的な対抗措置を意味する。"}, {"word": "secessionist", "definition": "独立や分離を求める勢力や人物。特に地域や少数民族が国から分離することを目指す者。"}, {"word": "hardline", "definition": "妥協を許さない厳格で強硬な立場や方針。柔軟性のない対応を示す。"}, {"word": "precedent", "definition": "過去の判例や慣例として将来の行動の基準となるもの。参考となる先例。"}, {"word": "peevish", "definition": "些細なことで怒りやすく、不機嫌な態度。子どもっぽい不満や不平を表す。"}]}, {"title_ja": "トランプのNBC記者クリステン・ウェルカーへの攻撃は報道の自由への脅威", "title_en": "Trump's Attack on NBC Journalist Kristen Welker Is an Assault on Press Freedom", "summary_ja": "マーガレット・サリヴァンは、トランプがFCCに対してNBC記者クリステン・ウェルカーを罰するよう脅迫したことが、政府権力を乱用して批判的なメディアを抑圧する危険な行為だと主張しています。彼女は、この攻撃をトランプが有色人種の女性記者を標的にする長年のパターンと、修正第1条を違反する連邦機関の濫用という広い文脈の中で位置づけています。", "summary_en": "Margaret Sullivan argues that Trump's threat to have the FCC punish NBC journalist Kristen Welker for her factually accurate criticism of his endorsement record represents a dangerous abuse of governmental power against the press. She contextualizes this attack within Trump's broader pattern of targeting female journalists of color and weaponizing federal agencies to suppress critical media coverage, which violates First Amendment protections.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/02/trump-nbc-fcc-kristin-welker", "state_media": false, "category": "オピニオン", "full_text": "With his approval ratings tanking, the crucial midterm elections looming, and his war with Iran turning into a quagmire, Donald Trump has entered full freak-out mode.\nIt’s not hard to tell. Just look at what happened this week when he lashed out at Kristen Welker, the well-respected host of NBC’s Meet the Press, and one of the best-known journalists in the nation.\nWelker observed recently that Trump – while having significant influence – has a “mixed record” on making successful endorsements this year. An innocuous statement, made in advance of the Sunday show during her analytical comments to a network affiliate station in Washington.\nBut not harmless in Trump’s opinion.\nFurious, he called on the Federal Communications Commission to go after Welker, saying she “will be reported to the FCC for rebuke or punishment”.\nIn fact, as the Hill newspaper reported this week, while Trump “boasts a 100 percent record in Senate Republican primary contests this election cycle, several of his high-profile gubernatorial picks have lost”.\nThat sounds like a mixed record, doesn’t it? Not to Trump, who called Welker’s comments “purposeful inaccuracy”.\n“The Press is a Disgrace to our Nation, and I hope that Chairman Brendan Carr, and the fine people of his Commission, will take this Threat to our Country very seriously,” he wrote on Truth Social. He later added: “FCC to the rescue.”\nThe threat is absurd. It would seem even more so if Trump had not already been using the agency as a weapon in his long-running campaign against the reality-based press.\nCarr is a partisan, fully devoted to Trump’s mission, and he has shown himself more than willing to do the bidding of the president who appointed him during this second presidential term.\nThe FCC is intended to be bipartisan and independent but under Trump, it has skewed heavily Maga – and clearly political.\nCarr himself seems to embrace without embarrassment the role of Trump’s media attack dog. He has warned that he would use the FCC’s power to issue broadcast licenses to go after what he and his boss call “fake news”.\nThe skirmishes are widespread. ABC has sued the FCC, charging that the agency’s early review of eight local broadcast licenses violates the first amendment.\nThe FCC is supposed to adhere to first amendment restrictions in dealing with broadcast licenses or in any punitive measures at all. “While the FCC has the limited ability to revoke stations’ broadcast licenses, it has not done so in over 40 years and its powers do not include revoking licenses because of a disagreement over a viewpoint expressed on the station,” the Washington Post noted this week.\nIt’s no surprise that Trump has singled out Welker for this unwarranted attack. He has a long and shameful history of going after female journalists and seems to particularly relish criticizing female journalists of color. In his first term, his targets included Yamiche Alcindor, then of PBS, April Ryan of American Urban Radio and Abby Phillip of CNN.\nIn one particularly vicious moment, he went after Welker herself during an interview earlier this year, saying: “You’re either crooked or you’re stupid.”\nThis new attack on Welker brings together some of his favorite techniques – trashing a Black female journalist, cracking down on free speech in apparent violation of first amendment protections and using what should be an independent government body (including, of course, the justice department) to carry out his retaliation efforts.\nAlthough this new chapter is part of a well-established pattern, it feels especially desperate when seen in context.\nIn recent days, Trump’s efforts to control the media through threats and punishment have ramped up. The administration has barred reporters from three major news organizations from covering the G20 meetings, even as top journalists at Stars and Stripes, the military newspaper with a long history of independence, have been fired.\nTrump’s reality has turned sour, so he certainly doesn’t want that reality reflected in the news media.\nThreatening Kristen Welker – like so much of what he’s doing – is obvious over-reach.\nIf the FCC does somehow attempt to punish her or her network, there’s a solid first amendment case to be made in response. NBC, which has staunchly defended Welker, is likely to make it.\nWelker did nothing wrong, not in terms of the facts and not in terms of her journalistic role.\nAs for Trump, his attacks against the mainstream media will continue.\nPointless and misguided as his media revenge tour is, it seems to be all he knows how to do.\n- \n  Margaret Sullivan is a Guardian US columnist writing on media, politics and culture", "translation_ja": "", "vocab": [{"word": "quagmire", "definition": "複雑で解決困難な状況のこと。特に軍事的・政治的な悪循環を指す。Sullivan はイランとの対立が泥沼化していると比喩的に表現しています。"}, {"word": "partisan", "definition": "政党や政治的立場に強く偏った人物のこと。FCC委員長Carrがトランプを支持する立場に強く傾いていることを批判しています。"}, {"word": "skirmish", "definition": "小規模な衝突や争いのこと。複数の小さな紛争が起きていることを指す。ここではメディアとトランプ政権の対立を表します。"}, {"word": "unwarranted", "definition": "正当な理由のない、根拠のないという意味。Welker への攻撃が理由なく行われたことを強調しています。"}, {"word": "retaliation", "definition": "報復、仕返しのこと。トランプが自分を批判するメディアに対して行う報復的な行動を指します。"}, {"word": "overreach", "definition": "権限や能力を超えた越権行為のこと。トランプが大統領の権限を越えて行動していることを批判しています。"}]}, {"title_ja": "中国への好感度上昇の裏にある経済的現実", "title_en": "Global Favorability Toward China Masks Complex Economic Preferences", "summary_ja": "ピュー・リサーチ・センターの調査では、世界が初めてアメリカより中国を好意的に見ていることが示されたが、筆者はこの解釈は表面的だと主張する。より詳細な分析によると、ほとんどの国は依然として中国よりアメリカとの経済的パートナーシップを望んており、これは大国間競争への適応であって、ソフトパワーの決定的な転換ではないことを示唆している。", "summary_en": "While recent Pew Research data shows the world views China more favorably than the United States for the first time in two decades, the author argues this interpretation is misleading. A deeper analysis reveals that most countries still prefer economic partnerships with the U.S. over China, suggesting the world is navigating great-power competition rather than experiencing a decisive shift in soft power dominance.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/how-does-world-really-view-china", "state_media": false, "category": "オピニオン", "full_text": "In July, the Pew Research Center found that for the first time in roughly two decades of global polling, the world now views China more favorably than the United States. The sentiment was not universal, but in 25 of the 36 countries surveyed this year, the percentage of respondents who gave favorable marks to China exceeded that for the United States, including several close U.S. allies. Some analysts have taken these findings as confirmation that the golden era of American soft power is over and China is ascendant. According to them, Trump’s policies on tariffs, aid, and allies have eroded the United States’ standing, opening the door for people across the world to switch their allegiance to China.\nBut this interpretation, convenient as it may be, deserves more scrutiny. A closer examination of the data reveals that although global opinion of the United States has indeed plummeted and opinion of China has risen since 2022, most of the world still prefers the United States as an economic partner—including most of the countries that now view China in a more positive light. This is a critical distinction, since economic partnerships and interests tend to drive national policies. Indeed, it signals something more nuanced is happening than simply the end of American hegemony and an imminent age of Chinese global supremacy.\nThe world’s increasingly pro-Chinese attitude is not meaningless. That more and more people think better of Beijing than of Washington could eventually prove important as Beijing seeks to build up its soft power. For now, however, what the numbers actually show is a world adjusting to the new reality of great-power competition, feeling forced to choose one side without the luxury of liking it.\nSTILL ON TOP\nFavorability is, in essence, a feeling. When people are asked to say how favorably they view something, they are really being asked whether and how much they like it—and little else. Pew’s favorability question also asked only whether respondents hold a positive or a negative impression of China and the United States, not whether they liked one more than the other. Still, Beijing clearly came out on top in these questions. Favorable views of the United States fell significantly in 15 of the 24 countries surveyed in both 2025 and 2026. Moreover, in several U.S. ally countries, including Canada, France, Germany, Italy, South Korea, and the United Kingdom, favorability ratings are now at or near their lowest since Pew began polling in 2002. In contrast, China’s image has consistently improved in several Western countries. The percentage of Italian respondents with a favorable opinion of China, for instance, increased from 31 percent in 2022 to 51 percent in 2026. In Spain, China’s favorability rose from 37 percent in 2025 to 54 percent in 2026.\nMedia outlets and observers have fixated on these numbers, but the same Pew survey asks another, more consequential question: “Is it more important for your country to have strong economic ties with China or with the United States?” This prompt forces respondents to weigh the two powers against each other and pick one. Critically, it asks them to consider not just how they feel about each country but also which they would rather work with. In 2025, the last year for which country-by-country, individual-level data is available, more respondents in 20 out of 24 countries chose economic ties with the United States over ties with China.\nIn seven of those 20 countries, answers to the two questions diverged. More respondents in Canada, France, Greece, the Netherlands, Spain, Sweden, and Turkey rated China more favorably than the United States, yet more people chose economic ties with the United States over China, sometimes by wide margins. In Sweden, for example, respondents preferred U.S. economic ties to Chinese economic ties by 48 percentage points. Turkish respondents rated China 13 percentage points more favorably than they did the United States but preferred economic ties with the United States by ten percentage points anyway.\nAs the only country that favors Chinese economic ties but views the United States more favorably, Australia is an outlier. This is not much of a surprise given that China is already the country’s largest export destination, accounting for 30 percent of everything Australia sells to the world. But it is noteworthy that half of Australians believe China is the country that threatens Australia most, and a full third believe the United States is Australia’s most important ally, compared with seven percent who believe China is. When asked, however, whether Australia’s economy should have closer ties to China or to the United States, 54 percent picked China, compared with 43 percent that picked the United States. Favorability, it appears, cannot adequately capture the nuance of public opinion on the two countries, much less divine a shift in the balance of soft power.\nGlobally, the individual respondents who preferred China as an econom", "translation_ja": "", "vocab": [{"word": "hegemony", "definition": "ある国や勢力による支配的な優位性のこと。国際関係において、特定の大国が他国に対して政治的・経済的・文化的な圧倒的な影響力を持つ状態を指す。"}, {"word": "diverged", "definition": "異なる方向へ分かれることを意味する動詞。ここでは、favorabilityと経済関係の選好という異なる質問への回答が相反する結果を示すことを表す。"}, {"word": "nuanced", "definition": "微妙な違いや複雑さを持つことを意味する形容詞。単純な二項対立では表現できない、より複雑で多面的な状況を指す。"}, {"word": "consequential", "definition": "重要で影響力のあることを意味する形容詞。favorabilityよりもこちらの質問の方が実際の政策決定に影響を与える可能性が高いという意味で使用されている。"}, {"word": "eroded", "definition": "徐々に削られたり減少したりすることを意味する動詞。ここではアメリカの国際的な地位や信用が少しずつ低下していることを表す。"}]}, {"title_ja": "イスラエルは永遠の戦争を終わらせることができるのか？", "title_en": "Can Israel End Its Forever Wars?", "summary_ja": "著者は、ネタニヤフ首相の継続的な軍事行動戦略が、人命、経済、国際的評判における多大なコストを無視していると主張している。軍事的背景と中道的なアプローチを持つ対立候補ガディ・アイゼンコットは潜在的な代替案を提供する可能性があるが、意味のある政策変化はアメリカの関与に大きく依存し、劇的というより段階的なものになるだろう。", "summary_en": "The author argues that Prime Minister Netanyahu's strategy of perpetual military action ignores significant costs in lives, economy, and international standing. While challenger Gadi Eisenkot offers a potential alternative through his military background and centrist approach, meaningful policy changes would likely depend on U.S. engagement and would be incremental rather than transformative.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/israel/can-israel-end-its-forever-wars", "state_media": false, "category": "オピニオン", "full_text": "As he prepares to face Israeli voters next month after three years of incessant war, Israeli Prime Minister Benjamin Netanyahu has formulated a new strategy. Ignoring the huge costs in blood and treasure, let alone in support for Israel in the United States and elsewhere, he now publicly and explicitly supports waging wars without end. As a lesson of Hamas’s October 7, 2023, massacre, he asserts that Israel needs to take preemptive military action against every potential security threat it faces, regardless of the consequences. This has left many wondering how much of this hard-line approach might change if Gadi Eisenkot, the veteran military official who is running ahead of Netanyahu in the polls, manages to defeat him.\nThus far, Eisenkot, a classic centrist, has been blunt and sometimes caustic in making the case against the prime minister. But apart from vague statements about ending the longest war in Israeli history, he has generally avoided going into detail about his own national security strategy. On some issues, such as dealing with Hamas in Gaza, he has sounded more hawkish than Netanyahu. And when he is asked about the future of the conflict with the Palestinians—Israel’s most politically explosive issue—he has been extremely careful to avoid binding commitments. In a rare statement on such matters in August, Eisenkot said he was opposed to a Palestinian state, endorsing what is by now a consensus position across Israel’s political center and even parts of the center left as well as the right.\nFrom such statements, it might be tempting to conclude that an Eisenkot government would be little different from its right-wing predecessor. Indeed, some analysts have argued that there will be no real differences on major security issues at all. But that ignores a number of important areas, from the crisis in the West Bank to Israel’s approach to Syria to the conflict in Gaza, where new strategies could yield real dividends, even if the changes are most likely to be incremental rather than dramatic. The extent to which an opening emerges will depend greatly on U.S. President Donald Trump and the nature of his relationship with a post-Netanyahu government, if Israelis elect one. The most important question is not whether change is possible but what kinds of changes, and with what kinds of engagement from Washington.\nRIGHTWARD DRIFT\nAccording to Israeli polls, Netanyahu, chairman of the right-wing Likud Party, will find it extremely difficult to form a government after the October 27 elections. For now, he appears to be devoting most of his efforts to forcing a deadlock that would prevent his rivals from assembling the next coalition. At the same time, he has promoted his strategy of continuous war.\nThe new Netanyahu preaches zero concessions and zero compromises. To his domestic audience, he also emphasizes what he claims is another achievement: Israel’s seizure of territory on almost every border—in southern Lebanon, in Syria, in the Gaza Strip—as self-styled security zones. Defense Minister Israel Katz takes this approach one step further, claiming that Israel will remain in these zones for many years as part of the price it is exacting from its enemies. Katz and other ministers are constantly searching for new military foes: they have claimed that Turkish President Recep Tayyip Erdogan, who is deeply hostile to Israel but difficult to portray as a direct military antagonist, is now as much of a threat as Hezbollah and Hamas, an assertion that Netanyahu has also taken up. Some of these cabinet members have even maintained, without a shred of evidence, that Syria’s president, the former jihadist Ahmed al-Shara, is preparing to attack Israel.\nThis belligerent stance completely ignores the heavy price of the Netanyahu strategy. With large numbers of soldiers deployed on the forward fronts for months at a time, the Israel Defense Forces has had no time to train, and reservists are now bearing an enormous burden, serving on average more than 100 days a year since the 2023 attack. The Israeli economy has also taken an immense hit. According to the latest estimates, Israel has spent about $142 billion on the war since it began—equivalent to more than half of the country’s total annual budget. This is aside from the calamitous damage that the wars have wrought on Israel’s international reputation.\nAmid these spiraling problems and the widespread unpopularity of the current right-wing coalition, Eisenkot has opened a substantial lead in the polls. As the IDF’s former chief of staff with a deep background in the security establishment, he presents a clear contrast with Netanyahu and his right-wing ministers: he has been in politics only a short time—he entered the fray just four years ago. He joined Netanyahu's government as a member of the war cabinet four days after the October 7 massacre. But he quickly fell out with Netanyahu about the conduct of the war, in particular over the prime minister’s insistence on s", "translation_ja": "", "vocab": [{"word": "incessant", "definition": "絶え間ない、止まらない。継続的かつ際限なく続く状態を表す。"}, {"word": "preemptive", "definition": "先制的な、事前に対抗する。敵の行動を防ぐために先に行動を起こすことを意味する。"}, {"word": "hawkish", "definition": "好戦的な、強硬派的な。軍事力の使用を支持する姿勢を示す。"}, {"word": "incremental", "definition": "段階的な、漸進的な。急激でなく、少しずつ増加または変化することを意味する。"}, {"word": "belligerent", "definition": "好戦的な、けんか腰の。攻撃的で対立的な態度や行動を表す。"}, {"word": "calamitous", "definition": "壊滅的な、悲劇的な。大惨事をもたらす深刻な結果を意味する。"}]}, {"title_ja": "カナダとの貿易戦争の真の危険性", "title_en": "The Real Risk of a Trade War With Canada", "summary_ja": "著者は、北米の高度に統合されたサプライチェーンが中国の経済的強制に危険にさらされていると主張し、2025年の北京の半導体輸出禁止が大陸全体の自動車生産を麻痺させたことで実証されたと述べています。米国、カナダ、メキシコは相互間の貿易紛争に焦点を当てるのではなく、USMCA再交渉を利用して中国の重要産業における独占力の増大に対する防御を調整すべきだと主張しています。", "summary_en": "The author argues that North America's highly integrated supply chains are dangerously exposed to Chinese economic coercion, as demonstrated by Beijing's 2025 semiconductor export ban that crippled auto production across the continent. Rather than focusing on trade disputes among themselves, the U.S., Canada, and Mexico should use USMCA renegotiations to coordinate defense against China's growing monopoly power in critical sectors.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/real-risk-trade-war-canada", "state_media": false, "category": "オピニオン", "full_text": "In late October 2025, the automaker Honda had to indefinitely shutter a Mexican plant that manufactures its SUVs, thanks to an unanticipated shortage of parts. More than 2,000 miles away, in Canada, it had to slash the production of its popular Civic model in half. The shortage panicked companies across North America. Stellantis created a war room to monitor the availability of critical components, and Ford began to track the run-out dates for its inventory. Hundreds of thousands of Mexican and Canadian jobs were at risk if the impact of the parts shortage spread across supply chains that were highly integrated with those in the United States. Honda would later report production-related losses of roughly $300 million from the incident.\nThe cause was a simple but deliberate Chinese policy. Beijing had suddenly banned global exports of semiconductors made by Nexperia, a little-known Chinese company whose parts go into airbags, braking systems, and other automotive essentials. Chinese President Xi Jinping made the move as retaliation against actions taken by the Dutch government and by U.S. President Donald Trump. Xi reversed the throttling of Nexperia’s exports only when Trump agreed, later that month, to delay the implementation of a new U.S. export control regime.\nThis episode bluntly revealed just how integrated North American supply chains have become—and how exposed they now are to Chinese economic coercion. An auto component can cross the U.S.-Canadian or U.S.-Mexican border seven or eight times before it ends up in a fully assembled vehicle. If Beijing targets even one country, the entire North American supply chain could shut down.\nYet all three North American governments are looking the other way. Trump’s tariffs on Canada and Mexico in 2025 and his escalating trade war with Canada this year have turned the countries’ attentions inward, onto disputes among the three partners, at precisely the moment when the threat is coming from the outside.\nWashington’s refusal to renew the U.S.-Mexico-Canada Agreement (USMCA) on July 1 has set up an implicit renegotiation of the pact. The debate must not focus on the terms the three countries impose on one another; rather, it should focus on the terms they set to help one another counter China. China’s monopoly power across a variety of sectors fundamental to the North American economy is growing fast—and the more it expands, the more Mexico City, Ottawa, and Washington each become vulnerable to the relationships the other two have with Beijing. On a continent that is already tightly integrated, Washington cannot fix its own exposure to Chinese coercion unless Mexico City and Ottawa fix theirs, too.\nSince 2018, Washington has begun experimenting aggressively with a mix of policies to fight back against China’s growing market dominance. Canada and Mexico will need to make a more coherent and concerted effort to join these campaigns—and the United States will need to work much harder to invite them along. The USMCA renegotiation is the place to start.\nMISSING THE FOREST\nIn his 1992 presidential campaign, the American entrepreneur Ross Perot famously warned that the North American Free Trade Agreement would create a “giant sucking sound” as U.S. industries relocated south of the border to take advantage of Mexican workers’ lower wages. Although the pact did depress the earnings of U.S. blue-collar workers in areas with industries most exposed to new import competition from Mexico, the antipathy was mostly misplaced. One comprehensive 2015 study that added up NAFTA’s impact on consumers, workers, and industries found that it increased the United States’ economic well-being, albeit modestly, by 0.08 percent. (The impact on Mexico was slightly more positive, at 1.30 percent, and slightly negative for Canada, at negative 0.06 percent.)\nNAFTA nonetheless became a political vulnerability for Democrats. After Trump entered the White House in 2017, he made renegotiating it an immediate priority. When the USMCA officially replaced NAFTA in 2020, Trump declared that its improvements constituted a “colossal victory.” The reality, however, is that the two agreements differed very little. Both mainly reduced trade barriers and committed all three governments to avoid policies that inhibited commercial flows with one another. (The second Trump administration, with its tariffs on Canada and Mexico, has subsequently proved that commitment to be meaningless.)\nBoth agreements, in other words, were designed to encourage trade among the three countries—not to deal with the risks posed by Chinese monopoly power. But that threat is now pressing. Xi’s 2025 semiconductor ban was his second attack on North American auto supply chains in less than six months. His first responded to Trump’s April 2025 imposition of a 145 percent tariff on imports from China; Beijing then halted global exports of rare-earth permanent magnets, another essential input for car seats, windshield wipers, motors, and", "translation_ja": "", "vocab": [{"word": "coercion", "definition": "強制力や圧力によって他者の意思に反して行動させることを意味します。国家間の経済関係において、一国が別の国に対して経済的な圧力や制裁を用いて政治的譲歩を強いる場合に使用されます。"}, {"word": "monopoly", "definition": "市場において単一の企業や国が製品やサービスの供給を独占し、競争がない状態を指します。価格設定や供給量を自由に決定できる支配的な市場地位を意味します。"}, {"word": "integrated", "definition": "複数の要素や国が密接に関連し、統合された状態を示します。供給チェーンの文脈では、製造工程が複数国にわたって相互依存している状況を指します。"}, {"word": "antipathy", "definition": "強い嫌悪感や反感を表す感情的な対立を意味します。政治経済の文脈では、特定の政策や協定に対する国民の根強い反対感情を指します。"}, {"word": "vulnerability", "definition": "攻撃や危機に対して弱い状態や弱点を指します。国家間の関係では、経済制裁やサプライチェーン遮断によって被害を受けやすい立場を意味します。"}, {"word": "concerted", "definition": "複数の主体が共通の目標に向かって計画的に協力する様子を表します。「concerted effort」で複数国が一致協力して行う統調された努力を意味します。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-02 22:58 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
