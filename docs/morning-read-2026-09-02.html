s Spain over the government's handling of the influx of migrants to the Spanish exclave of Ceuta on the north African coast.\nSpanish opposition parties accuse Prime Minister Pedro Sánchez of abandoning the residents of Ceuta, while the government says right-wing parties are exploiting the crisis.\nOn Wednesday a police report said Moroccan security forces showed \"total permissiveness\" during the unprecedented influx, days after Sánchez insisted Morocco was not responsible.\nHe has blamed trafficking gangs and online misinformation for encouraging people to cross the border. Morocco has denied orchestrating or being involved in the mass crossing.\nAt least 72,000 migrants crossed from Morocco into Ceuta on 30 and 31 July and although most have returned, as many as 5,000 remain in makeshift camps or scattered across the city's streets or on the beach - leading to unrest in the autonomous city in North Africa and a crisis for Sánchez.\nThere have been near-daily protests by locals, with demonstrators calling for the migrants to be sent back to their countries of origin or redistributed across Spain.\nWednesday's rallies were called by city councils across Spain where opposition parties - the conservative Partido Popular (PP) and the far-right Vox party - govern or have significant popularity.\nDemonstrators called on Sánchez to resign.\nPP leader Alberto Núñez Feijóo was at the rally in Madrid, where more than 50,000 people gathered, according to government figures.\n\"A Spanish city has been invaded, occupied and, unfortunately, this happened with the knowledge of the Government of Spain,\" he said.\nVox leader Santiago Abascal meanwhile said Sánchez was \"at the service, like a lackey, of the Moroccan regime\".\nThere was also a major rally in Ceuta itself, with participants chanting: \"Ceuta is not for sale, Ceuta must be defended.\"\n\"The response has been inadequate, late and, to top it all, has involved a complete dereliction of duty on the part of the government,\" 45-year-old teacher David Hernandez told Reuters.\n\"We cannot be second-class citizens, and our border must not be sidelined.\"\nPressure on Sánchez's government has intensified after Spanish media said the report submitted by the National Police's National Immigration and Borders Centre (CENIF) to the National Court pointed to the involvement of Moroccan gendarmes in the migrant crossings.\nThe police report claimed that the Moroccan police deployment around the border \"was clearly smaller than usual\" and cited migrants who spoke of a \"passive attitude\" as the crossings happened.\nHowever the report did not categorically accuse Morocco of being behind the influx.\n- Sexual assaults happening almost every day in Ceuta, prosecutors say \n  - Published1 day ago\nMorocco has a long-standing claim over Ceuta and its fellow autonomous city of Melilla, which have long been a flashpoint in diplomatic relations between the two countries.\nA large number of social media posts appeared in August portraying the border fence between Morocco and Ceuta as safe and easy, even though at least 100 people died while trying to swim around the border fence, according to figures from the mayor.\nSpanish fact-checking website Maldita said before 30 July, when the influx began, messages circulated on Moroccan social media encouraging people to attempt the crossing, after a June ruling by Spain's Supreme Court.", "translation_ja": "", "vocab": [{"word": "exclave", "definition": "母国から地理的に分離された領土のこと。スペインはアフリカ北部にセウタとメリリャという飛び地領土を保有している。"}, {"word": "permissiveness", "definition": "厳格な規制や監視がなく、許容的な態度を示すこと。この文脈では、モロッコの治安部隊が移民の越境を黙認したことを意味する。"}, {"word": "trafficking gangs", "definition": "人身売買や密輸を行う犯罪組織のこと。政府はこれらの集団が移民に越境を促していると主張している。"}, {"word": "orchestrating", "definition": "複数の要素や人員を計画的に調整して、何かを組織立てて実行すること。モロッコが大量越境を意図的に計画・指揮したか否かが問題となっている。"}, {"word": "dereliction of duty", "definition": "職務や責任を怠ること。この文脈では政府がセウタ危機への対応責任を果たさなかったことを指している。"}, {"word": "flashpoint", "definition": "紛争や対立が発生しやすい地点や問題のこと。セウタはスペイン・モロッコ間の長年の外交紛争の焦点である。"}]}, {"title_ja": "EUとNATOがライプツィヒ無人機攻撃後、ロシアへの圧力強化を誓約", "title_en": "EU and NATO Vow to Step Up Pressure on Russia After Leipzig Drone Attack", "summary_ja": "EUとNATO指導部は、ドイツのライプツィヒ空港での失敗に終わった無人機攻撃をロシアの非対称戦争の危険なエスカレーションとして非難した。この事件は拡大制裁、ビザ制限、ウクライナ支援のためのロシア資産凍結の使用を含む、より強力な協調対応への呼びかけを促している。ロシアは告発を否定し、ドイツに対する「鏡像」報復を威嚇している。", "summary_en": "EU and NATO leaders have condemned Russia for a failed drone attack on Leipzig airport in Germany, marking what they describe as a dangerous escalation of hybrid warfare on European soil. The incident has prompted calls for stronger coordinated responses, including extended sanctions, visa restrictions, and potential use of frozen Russian assets to support Ukraine. Russia has rejected the accusations and threatened mirror-image retaliation against Germany.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ce9e810pg7ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "EU and Nato vow to step up pressure on Russia after 'new escalation' in Germany\n- Published\nThe heads of Nato and the European Commission have warned that Russia is growing increasingly reckless and vowed to respond to a \"new normal\".\n\"Leipzig marks a new escalation on European Union soil directly attributed to Russia,\" said Commission President Ursula von der Leyen, a day after Germany blamed Russia for a failed drone attack last month on Leipzig airport.\n\"We have to step up and that means being ready to respond to Russia's recklessness faster and better,\" von der Leyen said. Nato Secretary General Mark Rutte said the whole alliance, which includes the US, stood \"in full solidarity with Germany\".\nRussia has rejected German accusations that a drone carrying explosives deliberately targeted a Ukrainian cargo plane on 4 August.\nThe drone was defused by a robot at Leipzig/Halle airport and a second drone is thought to have collided with another cargo plane.\nA third drone was reportedly found 10 days later at the airport, which is an important Nato hub and is regularly used by Ukrainian Antonov transport aircraft.\nIt was not until Tuesday that the German government said police investigations and intelligence finding had proved that Russia was behind the incidents.\nThe interior minister said that the drone's configuration, components, explosives and detonator were all known from other Russian hybrid operations.\nTwo suspects have reportedly been identified in the Leipzig attack, including a Belarusian with a Russian passport who entered on a tourist visa, and another with Latvian and Russian passports who arrived by plane in Berlin and flew out two days before the failed attack.\nBerlin has said it will close the Russian consulate in Bonn as well as the Russian House cultural institution, widely suspected in Berlin of acting as a propaganda outlet for the Kremlin.\nThe Russian foreign ministry promised to respond in \"mirror-image\" fashion and said Berlin had offered no evidence to back its claims. Germany's chargé d'affaires Bernd Finke was summoned to hear Moscow's rejection of Berlin's \"entirely unfounded accusations\".\nVladimir Putin has condemned Germany's measures as a serious mistake that \"clearly runs counter to the interests of the German people\".\nAsked whether Moscow would be prepared to sever relations with Berlin, Russian Deputy Foreign Minister Alexander Grushko answered \"maybe\", but said for now it was giving diplomacy a chance.\nCritics in Germany suggested the German response was relatively weak, but Berlin has its eye on a more co-ordinated response with its allies, including extended EU sanctions and entry restrictions on Russian visitors across the bloc.\n- Rosenberg: Putin's veiled threat to UK part of Russia's campaign against West \n  - Published11 hours ago\n- Germany says Russia behind Leipzig airport drone attack \n  - Published20 hours ago\nVon der Leyen was clear in her statement that the Leipzig attack had involved \"military-grade material carried out by Russian operatives on European Union soil\".\n\"We will not tolerate it,\" she said.\nWhile she was meeting Rutte in Brussels, EU foreign ministers had gathered at Wicklow in Ireland, where France's Foreign Minister Jean-Noël Barrot said action could be taken on a European level against Russia's so-called \"shadow fleet\" of ships carrying oil and other cargo aimed at avoiding EU sanctions.\nBarrot and fellow ministers from Belgium and the Netherlands said they had summoned Russian ambassadors in protest at the attack.\nLithuania's Foreign Minister Kestutis Budrys said it was obvious that Russia saw no political cost in its hybrid operations against European allies.\nEU foreign policy chief Kaja Kallas said they were working on how to tighten enforcement of existing sanctions, and added there was broad support for an EU visa entry ban on Russian ex-combatants as well as stricter visa limits on Russian tourists.\nSeveral EU countries, including Sweden, the Netherlands, Poland and Spain, are pushing for more than €193bn (£165bn) in frozen Russian assets to be used to help Ukraine. The idea was first planned at the end of 2025, and rejected by Belgium where the money is held. However, Belgium's position is unchanged because it fears being held financially liable by the courts.\nThe Leipzig attack was part of a broader pattern of increasingly dangerous incidents, including drones and interference with critical infrastructure, von der Leyen said.\nMark Rutte added there had been increased risk to Europeans from drones and missiles crossing into countries on the Alliance's eastern flank, and there had been more \"malign activities targeting our territory directly, whether it is fires set in factories producing defence equipment for Ukraine or indeed the Russian hybrid attack in Leipzig\".\nSeveral acts of suspected sabotage have been reported in Germany in the past 24 hours alone, including two attacks on electricity substations, one in the east and one in the west n", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "段階的な増加や悪化。特に紛争や緊張が徐々に高まることを指す。本記事ではロシアの攻撃的行動が段階的に激化していることを意味する。"}, {"word": "hybrid operations", "definition": "従来の軍事作戦と非軍事的手段（サイバー攻撃、情報戦、破壊活動など）を組み合わせた戦術。直接的な宣戦布告なしに敵を弱体化させることが目的。"}, {"word": "consulate", "definition": "外国に設置された領事館。大使館よりも規模が小さく、国民の保護や商業関係などを担当する外交機関。"}, {"word": "mirror-image", "definition": "鏡に映したように同じ形で返すこと。報復や相互関係で、相手と同等の行動を取ることを意味する表現。"}, {"word": "malign activities", "definition": "害意のある悪質な活動。政治的・軍事的意図を持った破壊的またはスパイ行為を指す。"}, {"word": "sabotage", "definition": "意図的に機械や施設を破壊・無能にする行為。敵対国や組織による妨害活動を意味する。"}, {"word": "tighten enforcement", "definition": "規則や制裁の執行をより厳しくする。既存の政策をより効果的に適用すること。"}]}, {"title_ja": "バーナム首相、借入コスト上昇の中で初めての首相質問会で経済問題に直面", "title_en": "Burnham faces economy pressure at first PMQs amid rising borrowing costs", "summary_ja": "アンディ・バーナム首相は保守党指導者ケミ・バデノックとの初めての首相質問会で、支出計画と英国の借入コスト上昇について追及された。バーナムは財政責任を強調し前政権を批判した一方、バデノックは新しい政策の資金源について質問した。政府債の金利が18年ぶりの高水準に達したことから、政府の債務管理能力への懸念が反映されている。", "summary_en": "Prime Minister Andy Burnham faced his first Prime Minister's Questions against Conservative leader Kemi Badenoch, who pressed him on spending plans and rising UK borrowing costs. Burnham emphasized fiscal responsibility and blamed the previous government, while Badenoch questioned where funding would come from for his new policies. The debate reflects concerns about the government's ability to manage debt as interest rates on government bonds reached 18-year highs.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cn9wv7pene2o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham pressed on economy at first PMQs as borrowing costs surge\n- Published\nAndy Burnham said his government would be \"grounded in fiscal responsibility\" as his first Prime Minister's Questions took place against a backdrop of rising UK borrowing costs.\nConservative leader Kemi Badenoch called on Burnham to say where spending would be cut and how he would deal with the UK's increasing debt, after the cost of borrowing for the UK reached a new 18-year high on Wednesday.\nHe blamed the previous Tory government, saying the \"turbulence on global markets are because of that exposure that they left behind\".\nBurnham took over from Sir Keir Starmer in July before Parliament's summer recess, meaning Wednesday was the first time he had faced Badenoch at PMQs.\nBurnham sought to stress his administration's fiscal responsibility and said ministers were taking steps to reduce debt.\nHe told MPs: \"This will be a government grounded in fiscal responsibility. It will stick to the fiscal rules, but at the same time, we will help reduce cost-of-living pressure on our constituents, and that's the approach that we will take.\"\nInterest rates on government bonds have been going up, with the yield on a 10-year bond at its highest level since 2008, while the yield on a 30-year bond is at its highest since 1998.\nThis means it costs the government more to borrow over the long term and could constrain its spending choices as the 28 October Budget approaches.\nBurnham's PMQs debut came after he used the summer recess to tour the UK, announcing a series of eye-catching policies mainly aimed at tackling the cost of living.\nOn Wednesday, Badenoch said the prime minister had set out plenty of spending plans but no detail of how he would be paying the bill.\n\"The markets are clearly worried that we now have a spendthrift prime minister who wants to say yes to everyone but cannot tell us where the money is coming from,\" she said.\n\"He needs to pay for all his new promises and he has a choice - higher taxes, more borrowing, or spending cuts.\n\"Yesterday he said change begins with honesty, so will he be honest and tell us: is he preparing to raise taxes again, yes or no?\"\nBurnham had earlier said he had already cut taxes, including VAT on energy bills and a cut in business rates for hospitality.\n\"I've already indicated my first moves were to cut tax, but I'm not going to do what any prime minister has done and write the budget here,\" he said, adding he and Chancellor John Healey had agreed on an earlier date for the Budget to reduce speculation.\nIn the Commons, Badenoch also raised comments from economist and cross-bench peer Lord Jim O'Neill, who had been tipped to become Burnham's chief economic adviser, but who ruled out joining Burnham's government.\nSpeaking to the BBC, Lord O'Neill had praised the PM for \"a great first five weeks\" which he said had helped lift consumer and business confidence; adding the current spike in market interest rates for government debt would force Labour to start \"dealing with the triple lock\" on the state pension, and \"excessive\" welfare spending.\nBadenoch pointed to a warning from Lord O'Neill that the prime minister's tone during his Tuesday Commons debut would have unsettled investors, although the peer had also said that spike was mostly mirroring US market upheaval concerning the Iran conflict.\n\"Lord O'Neill, a close friend of the prime minister, said yesterday's statement in the Commons was the last thing investors wanted to hear,\" Badenoch said.\n\"Lord O'Neill is a serious economist. He knows what he's talking about and, sure enough, yesterday the cost of government borrowing rose to its highest in 18 years.\n\"How does he plan to tackle the government's rising debt costs?\"\nBurnham replied that he and Lord O'Neill did \"not always agree\", before attacking Badenoch's shadow cabinet reshuffle for bringing MPs who were in the leadership team of former Conservative prime minister Liz Truss back to her front benches.\nTo shouts of \"point-scoring!\" from the Conservative side, he said: \"Can I also say to her and the whole of her new shadow cabinet, the majority of whom were part of a government that lasted for 49 days, a short-lived government that crashed confidence in the economy and hammered people's mortgages.\n\"She took a decision at the weekend, she removed a shadow chancellor who said that the Truss mini budget was a mistake, and she replaced that shadow chancellor with one that helped to write the Truss mini budget.\"\nIn the Tory reshuffle, Andrew Griffith replaced Sir Mel Stride as shadow chancellor.\nBadenoch said Burnham had not ruled out tax rises, claiming: \"The reason why that budget failed was because spending was announced before the money to pay for it, which is exactly what he is doing right now.\"\n- Burnham's PMQs debut shows the challenge of delivering new style of politics \n  - Published8 hours ago\n- Why are UK borrowing costs rising and what does it mean for me? \n  - Published11 hours ago\nThe oppositio", "translation_ja": "", "vocab": [{"word": "fiscal responsibility", "definition": "財政的責任のことで、政府や組織が支出と収入のバランスを取り、持続可能な予算管理を行うことを意味する。"}, {"word": "constraint", "definition": "制限や制約のことで、何かの行動や選択肢を制限する条件や要因を指す。ビジネスや政策の文脈ではしばしば使用される。"}, {"word": "spendthrift", "definition": "浪費癖のある人、またはお金を無駄遣いする傾向を持つ状態を表す。財政管理が不十分な人物を批判的に表現する際に使われる。"}, {"word": "yield", "definition": "債券や投資から得られる利回りのこと。金融市場では、政府債や企業債から投資家が得られる利息を指す。"}, {"word": "constrain", "definition": "〜を制限する、〜を制約するという意味の動詞。政策や行動の選択肢を狭めることを表す。"}, {"word": "triple lock", "definition": "英国の年金制度の保障メカニズムで、年金を最低限度まで上げることを保証する仕組みを指す。"}]}, {"title_ja": "ファラージ氏、改革党資金調査の最中に「イギリスは苦情社会」と主張", "title_en": "Farage says UK is 'complainants' society' amid Reform funding probe", "summary_ja": "改革党の指導者ナイジェル・ファラージ氏は、党の財政に関する継続的な調査を、新しい政治的挑戦者に対抗する支配層の「エコシステム」の一部として一蹴している。ファラージ氏は、イギリスが「苦情社会」として機能していると主張し、苦情が自動的に調査を引き起こすと述べながらも、改革党は寄付規則を遵守していると主張している。世論調査の支持率の低下にもかかわらず、ファラージ氏は改革党が次の総選挙で勝利する可能性があると主張している。", "summary_en": "Reform UK leader Nigel Farage has dismissed ongoing investigations into his party's finances as part of an establishment 'ecosystem' fighting against new political challengers. He claims the UK operates as a 'complainants' society' where complaints automatically trigger investigations, while maintaining Reform has complied with donation rules. Despite declining poll ratings, Farage insists Reform still has a chance of winning the next general election.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cd6857j2v1qo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Reform up against 'complainants' society', Farage tells BBC\n- Published\nNigel Farage has said the UK is a \"complainants' society\", as he faces ongoing questions about both his and his party's finances.\nSpeaking to the BBC ahead of the party's annual conference this week, the Reform UK leader said a \"whole ecosystem\" didn't want \"new kids on the block succeeding\".\nIt comes after a summer dominated by headlines about the party's finances and £5m he received from a party supporter before the last election.\nFarage acknowledged his party's poll ratings had taken a hit compared to last year, but said it would rebound and still had \"every chance\" of winning the next general election.\nReform's annual conference begins in Birmingham on Thursday, with both Farage and the party facing renewed questions over money.\nA parliamentary investigation into £5m he received from major Reform donor Christopher Harborne was relaunched following Farage's re-election in Clacton, after a by-election he called in the Essex seat.\nThe Metropolitan Police is also investigating whether payments to Reform in the weeks before the last election complied with donation laws.\nThe police probe is examining donations given directly to the party by Fiona Cottrell, mother of longstanding Farage ally George Cottrell.\nIt is also examining payments from a company controlled by Reform's deputy leader Richard Tice, which received £1m from Fiona Cottrell in June 2024.\n'Existential threat'\nAsked if he knew whether or not money donated by Fiona Cottrell had come from her son George, Farage said he was not \"involved in the transactions\".\nHowever, he added that he \"had been told it's her money\". Reform has insisted it has always complied with donations rules.\nHe added: \"The point is, we live in a complainants' society. If you complain about me, automatically that triggers an investigation.\"\nHe said that political parties were \"constantly writing to all the authorities\", meaning Reform was \"under investigation every day for virtually everything we do\".\n\"There's a big picture here. The old two-party system that has dominated since the end of the First World War feels for the first time it faces an existential threat.\n\"There is a whole ecosystem with a century of development around this. And we come along from virtually nowhere and threaten the whole thing.\n\"So I think what you're seeing is the establishment, in a very co-ordinated way, fighting back.\"\nPressed on what he meant, he added: \"I'm talking about normal human behaviour.\n\"People who hold positions of power, influence and money don't want new kids on the block succeeding. It's the whole ecosystem, it's everything.\"\nFarage said he expected it \"won't be too long\" before he is interviewed by Parliament's standards commissioner Daniel Greenberg as part of his probe into whether he should have publicly declared the £5m he received from Harborne.\nHe continued to insist the sum, which he says was a personal gift, did not require registration under Commons rules.\nHe added he had \"no questions\" about Greenberg's impartiality, but hit out at the \"political composition\" of the standards committee that will recommend what action should be taken on his findings.\nThe 14-member panel includes seven MPs from Labour, the Conservatives and Liberal Democrats, but none from Reform UK.\nHe added: \"Have you seen who's on the committee? I think we know the outcome already. I'm not going to say anything more than that.\"\n\"To be judged by members of Parliament by other political parties who you're fighting against in by-elections or general elections, I think that raises a question, I really do,\" he added.\n'Fundamental changes'\nElsewhere in his interview, Farage acknowledged that Reform was \"down a bit\" in its poll ratings compared to 2025, after failing to win in by-elections this year including Gorton and Denton and Makerfield, which saw Andy Burnham's re-election as an MP ahead of becoming Labour leader.\nBut he added that \"markets don't move in straight lines\", adding that the party still had \"every chance\" of winning the next general election, due by 2029.\nHe said the party was continuing to look \"outside of the political sphere\" to fill frontbench positions, following a raft of appointments earlier this year to senior posts within the party.\nAnd he said he continued to hold to his previous prediction there would be an election next spring \"forced on the government\" by the markets, amid rising costs to public borrowing.\nReform's conference, he said, would be a chance for the party to set out details of the \"fundamental changes\" it would make within 100 days of winning power.\nHe added that whilst his and other parties had announced a number of new policies in recent weeks, what most interested voters was who is \"actually going to deliver\" than the specifics of individual policies.\nRelated topics\n  - Published14 August\n  - Published14 August", "translation_ja": "", "vocab": [{"word": "existential threat", "definition": "存在自体を脅かす脅威。ここでは二大政党制の支配力が根本的に危険にさらされていることを意味する。"}, {"word": "ecosystem", "definition": "相互に関連する制度や権力構造の複雑な相互関係。政治的支配構造全体を指す。"}, {"word": "impartiality", "definition": "党派心なく公正であること。特に司法や調査機関に求められる中立性を意味する。"}, {"word": "relaunched", "definition": "再び開始または再開すること。調査が中止後に改めて始まった状況を表す。"}, {"word": "complainants", "definition": "苦情を申し立てる人々。訴えを起こす側の人間を指す。"}, {"word": "frontbench positions", "definition": "議会の前列に座る高位の政治家の職。党の最高指導部の主要職を意味する。"}]}, {"title_ja": "ルーシー・レットビー事件で裁判所の匿名命令が解除され医師が名指しされる", "title_en": "Doctor Named as Court Order Lifted in Lucy Letby Case", "summary_ja": "有罪判決を受けた看護師ルーシー・レットビーと共に働いていた医師マーク・ディーキンが、裁判所の匿名命令が解除されたことで公に身元が明かされた。53歳で7月に亡くなったディーキンは、レットビーと1000件以上のフェイスブックメッセージを交わし、彼女が病院配置を確保するのを助けていたが、後に彼女に操作されたと主張している。患者の守秘義務違反で解雇されたとの報道を受け、彼の死について司法審問が開かれる予定である。", "summary_en": "Mark Deakin, a doctor who worked alongside convicted nurse Lucy Letby, has been publicly identified after a court anonymity order was lifted. Deakin, who died in July aged 53, had exchanged over 1,000 Facebook messages with Letby and helped her secure a hospital placement, later claiming he was manipulated by her. An inquest into his death will be opened following reports he was dismissed for breaching patient confidentiality.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy8z3jv98xyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Letby 'boyfriend' doctor named as court order lifted\n- Published\nThe doctor described during Lucy Letby's trial as her \"boyfriend\" can now be identified.\nMark Deakin, who died in July aged 53, had been protected by a court anonymity order that has now been lifted.\nDeakin worked alongside Letby, now 36, at the Countess of Chester Hospital during the period in which she murdered seven babies and attempted to murder seven others in 2015 and 2016.\nDeakin, who was married, continued his medical career after leaving the Countess of Chester, later working as a consultant at Alder Hey Children's Hospital in Liverpool.\nThere have been reports that Deakin died shortly after learning that he had been sacked after it was found he had breached patient confidentiality in text message exchanges with Letby.\nIt is understood that he had been unwell. An inquest into the circumstances surrounding Deakin's death will now be opened.\nDetails of Deakin's personal interactions with Letby were revealed during the Thirlwall inquiry into how the nurse's murders were able to take place.\nThe inquiry heard that the pair had exchanged more than 1,000 Facebook messages and that Deakin helped Letby secure a placement at Alder Hey hospital after she was suspected of murdering babies.\nDeakin told the inquiry he had been \"misled\" and \"maybe manipulated\" by Letby and that he was tricked into giving her information about babies she had attacked.\nHe added that it \"had been a massive mistake\" to help Letby and said he had \"a lot of regrets\".\nThe inquiry is due to publish its findings on 15 September.\nDenial\nLetby - who has always maintained her innocence - is serving 15 whole life prison terms. The Criminal Cases Review Commission (CCRC) is conducting a review of Letby's convictions.\nAt her criminal trial - the longest murder trial in UK history - Deakin gave evidence in relation to several babies. He was granted special measures as well as anonymity. These allowed him to give evidence from behind a screen so that Letby, the public gallery, and the media were prevented from seeing him.\nDeakin's evidence provided detail of some of the emergency calls and resuscitations which he and Letby were jointly involved in. Their long nights of text messaging were laid bare and many of the messages shown to the jury.\nWhen he was sworn in, on the first occasion he testified, Letby burst into tears, in what was the first display of emotion from her during the trial.\nDuring her cross-examination, Letby was forced to deny that Deakin was her boyfriend, though she did accept that they had gone on a trip to London together.\nThe prosecuting barrister, Nick Johnson KC, said Letby \"tried to get out the back of the dock\" when the doctor first came to the witness box.\nLetby said: \"Yes, because I felt unwell.\"\nJohnson said: \"No, it's because you didn't like hearing your boyfriend giving evidence, did you?\"\nLetby said: \"That's unfair.\"\nProsecutors also went through a WhatsApp message exchange between Letby and a friend who had teased her for being \"flirty\" with Deakin.\nJohnson said: \"She knew you were sweet on Mark, didn't she?\"\nLetby said: \"What do you mean, sweet?\"\nJohnson said: \"That you had a crush on him.\"\n\"No,\" said Letby.\n\"There was nothing between me and that Mark.\"\nJohnson told the court that Letby told her friend she had received a \"strange message\" from the doctor.\nHer colleague responded: \"Did you? Saying what? Go Commando [laughing face emoji].\"\nWhile some media reports have described him as \"a key witness\", Deakin was one of many former colleagues of Letby's whose joint testimony helped to build the prosecution case against her, and none of the convictions rested solely on his evidence.\nCorrection: The original version of this story was published with an incorrect picture which has since been amended\nGet in touch\nTell us which stories we should cover in Cheshire\nRead more stories from Cheshire on the BBC, watch BBC North West Tonight on BBC iPlayer and follow BBC North West on X, external. You can also send story ideas via Whatsapp to 0808 100 2230.\nRelated topics\n  - Published18 August 2023\n  - Published21 October 2024", "translation_ja": "", "vocab": [{"word": "anonymity order", "definition": "法廷により個人の身元を秘密にすることを命じる命令。証人やその他の関係者の保護のために発令される。"}, {"word": "breach", "definition": "契約や法律の違反、または規則や約束を破ること。この場合、患者の守秘義務に対する違反を意味する。"}, {"word": "inquest", "definition": "死亡の原因や状況を調査するために行われる公式な司法手続き。特に不可解または不自然な死亡の場合に実施される。"}, {"word": "manipulated", "definition": "他者の感情や行動を巧妙にコントロールすること。通常、不誠実な方法で相手を自分の目的のために使うことを意味する。"}, {"word": "testimony", "definition": "法廷における証人の宣誓証言。事実や出来事に関する個人的な知識や観察に基づく陳述。"}, {"word": "Thirlwall inquiry", "definition": "ルーシー・レットビー事件の調査を行う公式な審問。看護師による殺人がいかにして発生したかを調べるために設置された。"}]}, {"title_ja": "マルタ：実業家がジャーナリスト殺害事件で無罪となる", "title_en": "Malta: Businessman Acquitted in Journalist's Murder Case", "summary_ja": "44歳のマルタの実業家ヨルゲン・フェネッシュは、2017年の調査報道記者ダフネ・カルアナ・ガリツィア爆弾殺害事件の実行を指示した容疑で無罪判決を受けた。陪審団は8対1の多数で無罪評決し、終身刑を免れた。カルアナ・ガリツィアの家族は制度的な失敗に対して不満を表明し、殺害事件に関連して有罪判決を受けた5人は獄中にいる。", "summary_en": "Yorgen Fenech, a 44-year-old Maltese businessman, was acquitted of commissioning the 2017 car bomb murder of investigative journalist Daphne Caruana Galizia, despite being accused of ordering her death over her corruption investigations. The jury cleared him by an 8-1 margin, avoiding a potential life sentence. Caruana Galizia's family expressed frustration over institutional failures, while five others convicted in connection with the murder remain imprisoned.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/malta-businessman-acquitted-of-journalist-s-murder/a-78814305?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Malta: Businessman acquitted of journalist's murder\nSeptember 2, 2026\nA Maltese businessman was acquitted after being accused of being behind the murder of investigative journalist Daphne Caruana Galizia.\nYorgen Fenech, 44, was accused of commissioning the car bomb killing of Caruana Galizia in 2017 in a case that sent waves across Europe.\nCaruana Galizia, who was 53 years old at the time of her murder, was driving near her home when the bomb detonated.\nCaruana Galizia's journalistic investigations included extensive information about suspected corruption in politics and business in Malta. She faced about 40 libel suits at the time of her murder.\nLife in prison avoided\nFenech, who would have faced up to life in prison had he been found guilty, was cleared of both complicity for murder and criminal association to commit murder with a jury margin of 8-1. He denied the allegations that he had wanted the journalist dead due to an investigation about him being about to be published.\nFenech did not comment after leaving the courtroom, with a crowd of people waiting outside the court shouting insults in his direction.\nFamily's demand for justice continues\nCaruana Galizia's family responded to the acquittal by saying that the institutional failures that led to the murder \"remain unaddressed and unreformed.\"\n\"Lasting justice means no person should ever face the same risks again. Our country failed to protect Daphne's life. It owes it to her to prevent other lives being lost.\"\nDaphne Caruana Galizia's sons were in the courtroom when the verdict was read out.\nFive people were convicted in connection to the murder, with three of them being found guilty of carrying it out.\nAll five are currently in jail.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "acquitted", "definition": "法廷で無罪判決を受けた、あるいは告発から解放されたことを意味する。刑事事件において被告人が有罪ではないと判断されることを指す。"}, {"word": "commissioning", "definition": "他の者に特定の行為や仕事を実行するよう依頼・指示することを意味する。この文脈では犯罪の実行を他者に指示することを指す。"}, {"word": "complicity", "definition": "犯罪や不正行為に参加することで有罪責任を共有することを意味する。共謀罪や共犯責任に関連する法律用語。"}, {"word": "institutional failures", "definition": "政府機関や公式な組織が職務を適切に遂行できなかったことを意味する。この場合、記者を保護する責任を果たさなかったことを指す。"}, {"word": "verdict", "definition": "陪審員または裁判官が行う最終判決を意味する。刑事事件や民事事件における公式な司法判断。"}, {"word": "convicted", "definition": "法廷で有罪と判断された、あるいは有罪判決を受けたことを意味する。acquittedと対義語の関係にある。"}]}, {"title_ja": "ベルリンの懲罰的措置はプーチンを抑止する可能性は低い：専門家", "title_en": "Berlin's Punitive Measures Unlikely to Deter Putin: Experts", "summary_ja": "ドイツの専門家は、ベルリンが最近実施したロシアに対する制裁（ボンのロシア領事館の閉鎖やベルリンのロシアンハウス文化センターの閉鎖を含む）は主に象徴的であり、モスクワの戦略的行動を変える可能性は低いと主張しています。これらの措置は相互的な制限を引き起こす可能性がありますが、専門家はプーチンの意思決定に本当に影響を与えるためにはより調整されたEUレベルの行動とロシアのシャドウフリートへの圧力が必要であると示唆しています。", "summary_en": "German experts argue that Berlin's recent sanctions against Russia—including closing the Russian consulate in Bonn and shutting down the Russian House cultural center—are largely symbolic and unlikely to change Moscow's strategic behavior. While the measures may trigger reciprocal restrictions, experts suggest that more coordinated EU-level action and pressure on Russia's shadow fleet would be needed to truly influence Putin's decision-making.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/berlin-s-punitive-measures-unlikely-to-deter-putin-experts/a-78803217?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Berlin's punitive measures unlikely to deter Putin: experts\nSeptember 2, 2026\nThe practical impact of Germany's latest measures against Russia may be limited, according to Russian political scientist Dmitry Oreshkin, who described the response as largely symbolic.\nHowever, Berlin's decision to publicly attribute the attempted drone attack at Leipzig/Halle Airport on August 4 to Moscow reflects a growing willingness to respond to Russian President Vladimir Putin and what Berlin sees as hostile actions on its territory.\n\"It's only a source of joy for Putin. After all, he is restoring this Iron Curtain between Russia and all the other countries. And now he's getting help from the other side as well,\" Oreshkin told DW. \"Putin is someone who cannot be stopped by anything other than escalation and tough restrictions.\"\nBerlin's decision to close the Russian consulate in the western city of Bonn, terminate the contract for the Russian House cultural center in Berlin and tighten entry controls for Russian citizens does not go far enough, according to Boris Bondarev, a former diplomat who worked for the Russian permanent mission to the UN Office at Geneva.\nBondarev, who resigned his post in 2022 over Russia's full-scale invasion of Ukraine, said reducing staff and restricting diplomatic activities may complicate Russian operations in Germany, but they will not fundamentally alter Moscow's strategic calculus.\n\"I'm not sure this will be perceived in Russia as something that will make them think twice,\" he said. \"Unless there are other, more coordinated steps at the EU level, they won't stop provocations. At most, they may force them to coordinate a little differently and look for more professional operatives.\"\nBoth experts agreed, however, that Germany's measures could have an effect even if they fail to deter Moscow — by setting off another cycle of reciprocal restrictions.\nHow will Russia respond?\nSpeaking on Tuesday, President Putin called Germany's response \"another mistake, a serious one,\" with the Kremlin telling the German Press Agency that Russia would respond \"in kind.\"\nGerman security policy expert Wolfgang Richter said the risk of escalation has increased compared with the early years of the Russia-Ukraine war, but said the next phase of confrontation between Berlin and Moscow is likely to remain in the areas of diplomacy and culture.\n\"They will, for example, close the Goethe-Institut,\" said Richter, a colonel with Germany's military until his retirement in 2010. \"I would not quite exclude that they could also escalate a little bit and do more — for example, limit the number of diplomats in the German embassy in Moscow.\"\nFormer diplomat Bondarev, however, said the Kremlin's reaction could be difficult to predict.\n\"Moscow officials can surprise you. They could say: 'We have all these people under surveillance anyway, so why expel them? Let them work, and we'll continue monitoring them.' It could go either way. But most likely, there will be some high-profile retaliatory steps,\" he said.\nThe dispute over organizations such as the Goethe-Institut and the Russian House in Berlin reflects a deeper divide in how Moscow and Western governments view their role. The Goethe-Institut, founded in 1951 to promote German language and culture abroad, is seen by Moscow through the lens of its broader suspicion of Western institutions, said Oreshkin. And, he added, the Kremlin tends to assume that such organizations serve intelligence purposes because it projects its own security-service worldview onto Western structures.\n\"The Russian system of thinking among the security services assumes that all Western institutions are organized in exactly the same way. This symmetrical picture of the world is deeply mistaken,\" he said.\nOreshkin said it's unlikely the Kremlin will escalate much further than the level of diplomacy and culture.\n\"Launching a missile strike — that's something Putin doesn't have the guts to do. And all these acts of sabotage and subversion — supporting alternative political movements, like Alternative for Germany — they're already doing that anyway,\" he said. \"So I don't think Putin can escalate much beyond that. He can, in fact, escalate the rhetoric, and that's what he's doing.\"\nReal pressure point: Russia's shadow fleet\nAnnouncing the measures on Monday, German Foreign Minister Johann Wadephul told reporters that the EU would continue to work on additional sanctions \"in the coming weeks.\" That included tougher action against Russia's \"shadow fleet,\" though he didn't provide further details.\nRussian officials have repeatedly warned that attempts to detain or seize vessels linked to Russia's network of ships accused of circumventing fuel sanctions would be regarded as hostile acts.\nOreshkin said if Europe really wants to put pressure on the Kremlin, targeting the financial flows behind the shadow fleet would be more effective. But he pointed to a major obstacle: European governments are constrained by their o", "translation_ja": "", "vocab": [{"word": "punitive", "definition": "罰したり懲らしめたりすることを目的とした、懲罰的な。政治的対立において相手国に対して報復的な措置を取ることを指します。"}, {"word": "deter", "definition": "～することを思いとどまらせる、抑止する。威嚇や制裁を通じて相手が行動を起こすのを防ぐことを意味します。"}, {"word": "reciprocal", "definition": "相互的な、互いに同等の。一方の行動に対して相手方が同様の対抗措置を取ることを表します。"}, {"word": "strategic calculus", "definition": "戦略的計算。国家が政策を決定する際に考慮する利益と損失のバランスを指す表現。"}, {"word": "circumvent", "definition": "～を回避する、巧みに避ける。制裁などのルールを迂回して目的を達成することを意味します。"}, {"word": "escalation", "definition": "段階的な増加、エスカレーション。紛争や対立が徐々に激化することを指します。"}, {"word": "shadow fleet", "definition": "シャドウフリート。制裁を回避するために使用される登録が不透明な船舶のネットワークを指します。"}]}, {"title_ja": "リビア統一への道：対立する政府が選挙に合意、分裂は終わるか", "title_en": "Libya's Governments Agree on Elections: Can Unity Finally End Decade-Long Division?", "summary_ja": "国連の仲介により、リビアの東西対立する政府は2年以内に議会・大統領選挙を実施することに合意し、10年以上続く政治分裂終結の可能性が生まれた。しかし専門家らは過去の合意が実現していないことを警告し、選挙が真に自由かつ公正なものか、それとも単にエリート層の権力分配を形式化するだけか懸念している。外部勢力の関与と人口が多い西部と権力が弱い東部との構造的不均衡が、真の民主改革の見通しを複雑にしている。", "summary_en": "Libya's rival eastern and western governments have agreed under UN mediation to hold parliamentary and presidential elections within two years, marking a potential end to over a decade of political division. However, experts warn that past agreements have failed to materialize, and concerns remain about whether elections will be truly free and fair or merely formalize elite power-sharing deals. External actors and structural imbalances between the more populous west and less powerful east complicate prospects for genuine democratic reform.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/unity-at-last-is-libya-s-damaging-power-struggle-at-an-end/a-78758325?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Unity at last: Is Libya's damaging power struggle at an end?\nSeptember 2, 2026\nThere have been other attempts made in the past but this time, those involved hope it will finally work out: Thanks to mediation by the United Nations, the two opposing governments in the west and east of Libya have agreed that they will hold parliamentary and presidential elections within the next two years.\n\"The agreement marks an important step in advancing Libya towards national elections and ending the transitional period,\" the UN's Support Mission in Libya, or UNSMIL, said in a statement.\nAmong other things, the country's electoral commission will be restructured and, according to the UN, various points about the legal framework for the elections that had previously led to disagreements have now been resolved.\nBut whether all this will actually result in free and fair elections in Libya remains to be seen.\nDivided for over a decade\nAfter former Libyan dictator Moammar Gadhafi was overthrown in 2011, Libya ended up divided in two.\nSince 2014, the country has been split between opposing governments located in the east and west of the country. A UN-backed administration known as the Government of National Unity is based in Tripoli in the west, and its rival, known as the House of Representatives, is based in the east, in Tobruk.\nFormer warlord-turned-politician Khalifa Haftar, is based in the east while Prime Minister Abdul-Hamid Dbeibah is in charge in the west.\nEach is supported by a number of local militias and foreign powers, and each has tried to wrest control from the other. Up until now, attempts to hold an election that would unite the country have failed.\nFor Andreas Dittmann, a geographic conflict expert and professor at the University of Giessen in Hesse, central Germany, the apparent unity is a positive.\n\"Things could not continue the way they were,\" he told DW.\nAfter years of civil war and political division, the desire of many Libyans to end the fighting permanently has only grown. Dittmann believes the attitudes of political actors have also changed in this regard.\nPreviously foreign actors had supported just one Libyan government, but now that has also changed and the prevailing argument seems to be that Libya can only develop further if both sides are incorporated into one administration.\nThis is why the UN is trying to go beyond simply arranging a date for elections. It also wants to strengthen the electoral commission and work on electoral laws. The new and united government will be responsible for establishing the conditions for a secure and trusted electoral process.\nThe UN has also set up what it calls \"Structured Dialogues,\" during which consensus was sought on questions of leadership, security, the economy and reconciliation.\nPast agreements didn't work out\nMichael Bauer, who heads the Tunisia office of Germany's Konrad Adenauer Foundation, believes the agreement is an important, if limited, step. Its success will depend on how binding any decisions are, he argued.\nAfter all, Bauer said, there have been plenty of political agreements in Libya in the recent past but none were really ever implemented.\nParallel to the UN process, the US is also trying to work on bringing the disparate leadership together. Massad Boulos, the Trump administration's senior adviser on Arab and Middle Eastern affairs, has been trying to bring the Dbeibah and Haftar families together.\nIn June, Haftar's son Saddam was in Washington where he met with US Secretary of State Marco Rubio.\nBauer said the American way of dealing with Libya differentiates from the UN plan. \"While the UN mission has basically been very inclusive, in my opinion, the American mission is trying to bring about a kind of deal between the country's elites,\" he told DW.\nHe questions how such a deal would fit into free and fair elections in Libya.\n\"Elections can only be meaningful if the outcome has not already been decided beforehand,\" Bauer said. The same is true for any pre-election allocation of political positions.\nElites strike a deal?\nUK-based think tank Chatham House has already warned that a deal like this, around ministries and resources, will only institutionalize the existing rivalry between Libya's ruling elites. With such an arrangement the rival actors would just divide the state's resources between themselves, and corruption and patronage systems would continue.\nThe country's division into east and west will be hard to overcome. A new united government would have to deal with preexisting power structures, rather than starting anew.\nDittmann said there is a further problem. Much of the Libyan population lives in the western areas, especially in the Tripoli region. This would see the eastern half of the country lose power if elections are held.\n\"If there are elections, and if those elections proceed mostly according to democratic principles, then the east can really only lose,\" he explained.\nAdditionally, there are also external actors to consider. ", "translation_ja": "", "vocab": [{"word": "mediation", "definition": "紛争当事者の間に第三者が入って、合意や解決に向けた仲介活動を行うこと。国際紛争の解決手段として用いられる。"}, {"word": "wrest", "definition": "相手から強引に何かを奪い取る、または支配権を奪うことを意味する。暴力的または強圧的な行為のニュアンスを含む。"}, {"word": "institutionalize", "definition": "慣行や制度を公式的かつ恒久的な形で確立または定着させること。組織や社会制度の一部として定着させるプロセスを指す。"}, {"word": "patronage", "definition": "権力者が自らの支持者や縁者に便宜を図り、見返りに忠誠や支持を得る体制。腐敗や利益誘導と結びつくことが多い。"}, {"word": "disparate", "definition": "性質や特徴が大きく異なった、統一性に欠けた状態。多様で相互に関連性のない要素を指す。"}, {"word": "transitional", "definition": "ある状態から別の状態へ移行する過程の、または過渡的な段階に関する。正規の制度が確立されるまでの暫定的な状態を示す。"}]}, {"title_ja": "ミネアポリスの銃撃事件で複数の被害者、警察官2人を含む", "title_en": "Multiple Victims Including 2 Officers Shot in Downtown Minneapolis", "summary_ja": "ミネアポリスのダウンタウンで銃撃事件が発生し、警察官2人を含む複数の被害者が出たと当局が発表しました。負傷の程度や詳細な状況はまだ調査中です。当局は犯人の身元や動機についてはまだ発表していません。", "summary_en": "A shooting incident occurred in downtown Minneapolis, leaving multiple victims including two police officers, according to officials. The exact circumstances and severity of injuries are still being assessed. Authorities have not yet released details about the shooter or motive.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/multiple-victims-including-2-officers-minneapolis-shooting-officials/story?id=136157683", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースと生放送イベントの24時間体制のカバレッジを提供しています。主要なストーリーが展開する際にリアルタイムの更新をお届けします。視聴者はいつでも包括的なニュースカバレッジにアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. The service delivers real-time updates on major stories as they develop. Viewers can access comprehensive news coverage at any time.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "リンゼイ・クランシー裁判：陪審団が2度目の意見不一致", "title_en": "Lindsay Clancy Trial: Jury Deadlocked for Second Time", "summary_ja": "2023年1月に3人の幼い子どもを殺害した罪に問われているマサチューセッツ州の母親リンゼイ・クランシーの裁判は、陪審団が2度目の意見不一致を報告し、重大な局面を迎えている。この事件は大きな注目を集める中、裁判の最終段階に入っている。意見不一致は評決が下るかどうかについて疑問を投げかけている。", "summary_en": "The trial of Massachusetts mother Lindsay Clancy, accused of killing her three young children in January 2023, has reached a critical juncture as the jury reports being deadlocked for the second time. The case has drawn significant attention as it enters its final stages. The deadlock raises questions about whether a verdict will be reached.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/News/live-updates/lindsay-clancy-trial-jurors-resume-deliberations/?id=136086599", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ギニアビサウ、大統領権限を拡大する新憲法を承認", "title_en": "Guinea-Bissau Voters Approve Constitution Expanding Presidential Powers", "summary_ja": "ギニアビサウの有権者が、大統領権限を大幅に拡大し、議会議席を102から65に削減する新憲法を70%の承認率で可決した。民主主義を損なうと批判されているが、12月の選挙に向けて実施された。昨年11月の大統領選挙の混乱後、軍事主導の暫定評議会がこの憲法的変化を実行した。", "summary_en": "Guinea-Bissau voters have approved a new constitution that significantly expands presidential powers and reduces parliamentary seats from 102 to 65, despite critics warning it will undermine democracy. The 70% approval rate comes ahead of December elections in the west African nation, which has experienced multiple coup attempts since independence. The military-led transitional council implemented the constitutional changes following a disputed presidential election last November.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/02/guinea-bissau-voters-approve-constitution-elections", "state_media": false, "category": "政治", "full_text": "Guinea-Bissau voters have approved a new constitution, which critics say will undermine democracy, that significantly expands presidential powers ahead of elections due in December.\nAccording to provisional results, 70% of voters approved sweeping changes in the tiny west African state’s first constitutional amendment since revisions that ended the one-party socialist state more than three decades ago.\nThe turnout for Sunday’s referendum was reportedly over 55%, amounting to an estimated 544,060 people.\nThe new constitution will reduce the number of seats in parliament from 102 to 65 and cut electoral constituencies from 29 to 12. New provisions will require presidential candidates to have lived continuously in the country for at least five years before the vote, which is believed to target diaspora-based politicians with significant followings.\nThe referendum’s outcome is expected to pave the way for December’s elections, which many hope will steady the political landscape in Guinea-Bissau, which has been through a series of politically turbulent periods since its declaration of independence from Portugal was globally recognised in 1974. Since then it has had at least 10 coup attempts, half of which have been successful.\nThe most recent came after last November’s disputed presidential elections. Both candidates declared themselves winners, citing electoral malpractice by the other’s camp. The military forcefully intervened, setting up a transitional ruling council headed by Gen Horta Inta-A Na Man, a former military chief of general staff.\nNa Man said: “What we want after this referendum is to allow whoever wins the elections to see out their mandate without hindrance.”\nNelson Moreira, the second vice-president of the transitional council, said the outgoing constitution, which came into effect in 1993, had often been cited as “the cause of instability in Guinea”.\nThe leading opposition party, the African Party for the Independence of Guinea and Cape Verde (PAIGC), which was barred from fielding a presidential candidate in the 2025 election, had asked its supporters to boycott the referendum, which it called a democratic farce.\n“What will happen on 30 August is the continuation of the coup d’état carried out on 26 November,” its leader, Domingos Simões Pereira, had said.", "translation_ja": "", "vocab": [{"word": "provisional results", "definition": "正式決定前の暫定的な結果を意味します。確定前の中間報告として使用される表現です。"}, {"word": "constitutional amendment", "definition": "憲法の条文を修正または追加することです。国の根本法を変更する公式な手続きを指します。"}, {"word": "diaspora-based", "definition": "国外に分散して住む同一民族の人々に基づいているという意味です。国外居住の同胞を対象とした政策や人物を表します。"}, {"word": "transitional council", "definition": "恒久的な政府樹立まで一時的に権力を行使する統治機構です。政治的変動期の暫定的な支配体制を指します。"}, {"word": "electoral malpractice", "definition": "選挙過程における不正や違法行為を意味します。投票や集計の不適切な行為を指摘する際に使用されます。"}, {"word": "boycott", "definition": "抗議の意思表示として、何かに参加しないまたは利用しないことです。政治的反発の表現方法として機能します。"}]}, {"title_ja": "世界の農民の約半数が毎年農薬中毒に、専門家が調査で明らかに", "title_en": "Nearly Half of World's Farmers Poisoned by Pesticides Annually, Study Finds", "summary_ja": "包括的な研究により、世界の9億3,400万人の農民の約46%が毎年農薬の意図しない急性中毒を経験していることが判明しました。推定402～433百万件の事例が毎年発生し、農薬中毒による死亡は約11,000件で、そのうちの近60%がインドで発生しています。専門家らは、危険な農薬の段階的廃止とより安全な代替品への農民のアクセス確保のための緊急行動を求めています。", "summary_en": "A comprehensive study reveals that approximately 46% of the world's 934 million farmers experience unintentional acute pesticide poisoning each year, with an estimated 402-433 million cases occurring globally. The research found nearly 11,000 deaths annually from pesticide poisoning, with southern Asia, southeast Asia, and east Africa reporting the highest numbers. Experts are calling for immediate implementation of UN recommendations to phase out highly hazardous pesticides and provide farmers with safer alternatives.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/sep/02/50-per-cent-world-farmers-poisoned-pesticides-every-year-experts", "state_media": false, "category": "社会", "full_text": "Almost half of the world’s farmers are poisoned by pesticides every single year, a study has found.\nUsing publicly available data from 2006-2023, the study, which was commissioned by Pesticide Action Network, found there to be an estimated 402-433m cases of unintentional acute pesticide poisoning of farmers and farm workers every year.\nBased on a worldwide farming population of 934 million, this means approximately 46% of farmers are being poisoned every year. The greatest estimated number of poisonings was in southern Asia, followed by south-east Asia and east Africa.\nThe overall highest national incidence of poisoning was in Burkina Faso in west Africa, where nearly 84% of farmers and farm workers were reported to have experienced poisoning.\nThe study, published in the journal Frontiers in Public Health on Wednesday, also found that an estimated 11,000 deaths occur every year due to pesticide poisoning, with nearly 60% of these in India.\nJayakumar Chelaton, the executive director of Pesticide Action Network India, said the research exposed a “crisis that can no longer be ignored”.\nThe authors of the study are calling for “immediate action”, including the implementation of a UN recommendation to phase out highly hazardous pesticides.\nThe study states that despite global efforts to highlight the dangers, pesticide use has continued to grow steadily, with 3.8m tonnes used in 2023, a doubling since 1990.\nDr Sheila Willis, the head of international programmes at Pesticide Action Network UK, said: “Now that the scale of suffering has been revealed, farmers must be supported to access safer alternatives to protect their health and that of their families.”\nThe study did not consider the impact of pesticide exposure on the estimated 84 million children working in agriculture and did not look at the long-term health impacts, with acute pesticide poisoning defined in the study as any illness or health effect experienced a short time after exposure.\nGénon Jensen, the executive director of the Health and Environment Alliance, said: “We are extremely concerned about the devastating health impacts from pesticide poisonings – both the acute impacts mentioned in this study but also chronic exposures that farm workers and communities suffer.”\nHélène Nicora, the director general of Parkinson’s Europe, said there was also “overwhelming evidence” to suggest that Parkinson’s was an environmentally driven disease, with growing evidence linking pesticide exposure to the development of Parkinson’s.\nParkinson’s disease is a progressive disorder in which parts of the brain become damaged over time, affecting movement and balance. The global burden of the disease is rising, with France, Germany and Italy all recognising it as an occupational disease for farmers.\nFarmers and farm workers are mainly exposed to pesticides during preparation and application, as well as when touching treated crops and contaminated equipment or clothing.\nSpeaking at a webinar organised by Friends of the Earth Europe earlier this year, Rendert Algra said he believed his Parkinson’s disease was linked to the pesticides he had used when working at his family farm in the Netherlands.\n“Being the eldest son, I did all the spraying of pesticides in our fields for several years in a row,” he said.\nDespite being the most robust study to date, the report highlights that available information on pesticide poisoning is inadequate, with the authors calling for standardised surveillance and reporting protocols so that pesticide-related poisonings become reliable and comparable.", "translation_ja": "", "vocab": [{"word": "acute", "definition": "短期間に急速に発生または悪化する状態を指します。医学用語として、症状が急激で激しいが通常は一時的な状態を表します。"}, {"word": "robust", "definition": "しっかりしている、堅牢である、または信頼性が高いという意味です。研究方法が厳密で信頼性が高いことを示す学術用語として使われます。"}, {"word": "incidence", "definition": "特定の出来事や病気の発生率や件数を指す統計用語です。「発生頻度」という意味で医学や公衆衛生の分野でよく使用されます。"}, {"word": "surveillance", "definition": "継続的な監視や観察を意味します。医学分野では疾病発生の監視・追跡システムを指し、公衆衛生対策に重要な役割を果たします。"}, {"word": "phase out", "definition": "段階的に廃止する、あるいは徐々に使用を止めることを意味します。政策用語として、ある物質や制度を時間をかけて終了させるプロセスを表します。"}, {"word": "hazardous", "definition": "危険な、有害な、または危険性のある物質を指します。特に化学物質や環境問題の文脈で、健康や安全に対する潜在的な脅威を示します。"}]}, {"title_ja": "南アフリカ航空がラグビー試合前の超低空飛行を擁護", "title_en": "South African Airline Defends Dramatic Low-Level Flyby Before Rugby Match", "summary_ja": "ケープタウン・スタジアムの屋根からわずか12～14メートルの高さで2機の旅客機が飛行し、5万6千人の観客を魅了したが、安全上の懸念も生じた。航空会社エアリンクは、南アフリカ民間航空局の承認を得た綿密な計画であると主張している。しかし、航空専門家は極めて低い高度ではエラーの余地がほとんどなく、同様の危険な前例を生む可能性があると警告している。", "summary_en": "Two passenger jets operated by Airlink flew just 41-46 feet above Cape Town Stadium before a rugby union Test match between South Africa and New Zealand, thrilling 56,000 spectators but raising safety concerns. The airline defended the stunt as carefully planned and approved by aviation authorities, with three senior captains on each aircraft. However, aviation experts warned that the extremely low altitude left little margin for error and could set a dangerous precedent for similar stunts.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/sport/2026/aug/31/south-african-airline-defends-dramatic-low-level-flyby-before-rugby-union-springboks-new-zealand", "state_media": false, "category": "IT", "full_text": "A pre-game stunt involving two passenger jets flying dramatically low over a stadium in South Africa drew huge cheers from the estimated crowd of 56,000 people, but also sparked a major debate over safety risks. The flyby by two Embraer jets, operated by the local airline Airlink, happened on Saturday before the second rugby union Test between South Africa and New Zealand in Cape Town.\nThe flight tracking service Flightradar24 estimated that the lead jet passed just 41-46 feet (12-14 metres) above the roof of Cape Town Stadium, with the crowd and the world’s top-ranked rugby teams below. The second jet, which was very close behind, flew through a cloud of pink dust that shot up from the stadium roof as part of the show.\nAirlink, a sponsor of the South Africa rugby union team, said the flyby was conducted according to safety regulations. The airline said that it was carefully planned and rehearsed, with the aircraft flying at 150 knots (172 mph), when they went over the stadium. Each jet had three senior captains on board, Airlink said, operating in the roles of a commander, a co-pilot and a safety officer. The jets were not carrying any passengers.\n“Airlink notes the concerns expressed in various social media and online forums regarding yesterday’s formation flyby over Cape Town’s DHL Stadium,” Airlink said on Sunday. “The flight demanded careful planning and rehearsal, as it required navigating at low altitude, at around 150 knots. The South African Civil Aviation Authority and Air Traffic Navigation Services provided valuable guidance, approval and support to ensure a safe flyby.”\nSouth African rugby union has a tradition of stadium flybys at big games, starting when a Boeing 747 flew over a stadium in Johannesburg before the 1995 World Cup final between the same teams, who are fierce rivals. But the flyby last weekend was especially low and dramatic, generating global interest after it was shown as part of the pre-game broadcast, and sparking a flurry of videos shot by witnesses.\nSome aviation experts questioned whether the margin for error was too small. “Basically, that lead aircraft … was kind of like dodging over the roof and climbing over the one side and dipping below and then climbing over the other side. That was a little bit uncomfortable,” Chris Martinus, president of Aircraft Owners and Pilots Association South Africa, said. “[If] something adverse happens, you just don’t have options at that kind of altitude.”\nKeith Tonkin, an Australian aviation consultant and former military and commercial pilot, said yesteron Monday that the Embraer passenger jets – which are small-to-medium jets designed for regional flights – were not designed or intended for that kind of low-level operation and warned against the precedent.\n“The bigger picture is that a benchmark has been established and others may expect to do something similar, and that’s not going to end well,” Tonkin said. He added that turbulence or a bird strike at such a low altitude could leave the pilots with too little room to manoeuvre without hitting the stadium.Airlink said flight data recorded by both aircraft confirmed their flights were performed within civil aviation safety limits for speed and altitude.", "translation_ja": "", "vocab": [{"word": "flyby", "definition": "航空機が目標地点の上を低く、または高速で通過すること。軍事デモンストレーションやイベント演出で使用される航空用語。"}, {"word": "margin for error", "definition": "失敗や問題が生じても許容できる余裕や範囲。ここでは操縦士が危険を回避できる余地の意味。"}, {"word": "precedent", "definition": "将来の参考や基準となる先例。同じ行為を繰り返す根拠となる過去の例を指す。"}, {"word": "manoeuvre", "definition": "目的を達成するために巧妙に計画された動きや操作。航空用語では飛行機の操作や方向転換を意味する。"}, {"word": "civil aviation authority", "definition": "民間航空の安全性と運航を監督・規制する政府機関。各国が航空法令の遵守を管理する。"}, {"word": "turbulence", "definition": "大気の乱れによる航空機の揺れや不安定な気流。操縦を困難にする気象条件の一つ。"}]}, {"title_ja": "OpenAIがタンブラーリッジ銃乱射事件をめぐる訴訟の波に直面", "title_en": "OpenAI Faces Wave of Lawsuits Over Tumbler Ridge Mass Shooting", "summary_ja": "OpenAIは米連邦裁判所に30件の新たな訴訟を提起され、カナダのタンブラーリッジで2月に発生し8人が殺害された銃乱射事件にChatGPTが関与したと主張する7件の初期訴訟に加わりました。訴訟では、同社とCEOのサム・アルトマンに対し、銃撃者がChatGPTに銃暴力のシナリオを説明していたことを知りながら法執行機関に警告しなかったとして、過失と銃乱射事件の幇助を非難しています。同社はフロリダ州立大学での銃撃事件に関連するケースを含め、他の管轄区域でも同様の主張に直面しています。", "summary_en": "OpenAI is facing 30 new lawsuits filed in U.S. federal court, joining seven initial cases, alleging that ChatGPT played a role in the February mass shooting in Tumbler Ridge, Canada that killed eight people. The lawsuits accuse the company and CEO Sam Altman of negligence and aiding and abetting, claiming they knew the shooter had described gun violence scenarios to ChatGPT but failed to alert law enforcement. The company is also facing similar allegations in other jurisdictions, including a case related to a shooting at Florida State University.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/economy/2026/9/2/openai-faces-new-lawsuits-over-tumbler-ridge-mass-shooting-tragedy?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "OpenAI faces new lawsuits over Tumbler Ridge mass shooting tragedy\nMultiple new cases have been filed against OpenAI, alleging ChatGPT played a role in the Tumbler Ridge mass shooting.\nOpenAI is facing another wave of lawsuits in the wake of the February mass shooting in Tumbler Ridge in Canada’s province of British Columbia, which left eight people dead.\nOn Wednesday, 30 new complaints were reportedly filed in a United States federal court in California, including teachers and students who were witnesses and survivors at the school where most of the shooting took place, joining seven initial lawsuits filed in April.\nRecommended Stories\nlist of 4 items\n- list 1 of 4AI used to create viruses not found in nature for first time\n- list 2 of 4US pushes looser approach to AI regulation, while EU pushes new law\n- list 3 of 4John Ternus succeeds Tim Cook as Apple CEO after 15 years\n- list 4 of 4OpenAI says it detected malign activity months before Hugging Face attack\nThe lawsuits accuse the San Francisco, California-based artificial intelligence giant and its CEO, Sam Altman, of negligence, as well as aiding and abetting a mass shooting.\nThe suits, brought by lawyer Jay Edelson, allege that the company knew about the intentions of the 18-year-old shooter who, in her interactions with OpenAI’s chatbot ChatGPT, had described scenarios involving gun violence, but that the leadership did not report their concerns to law enforcement, echoing earlier lawsuits on the matter.\nIn April, Altman penned a letter to the community apologising that the company did not alert law enforcement about the shooter, Jesse Van Rootselaar.\n“While I know words can never be enough, I believe an apology is necessary to recognize the harm and irreversible loss your community has suffered,” Altman wrote in the letter.\nAuthorities say that Van Rootselaar killed her mother and half-brother before going to the Tumbler Ridge Secondary School and opening fire. Five children and one educator were killed at the school. More than 25 others were wounded before Van Rootselaar died from what police described as a self-inflicted gunshot wound.\nOne of the new cases filed was on behalf of a 13-year-old identified as A C, who played dead after watching the shooter kill their classmates and the teacher. Another new case was brought by a grade seven teacher named Deidre Rushlow, who hid under her desk with her students during the rampage.\n“There isn’t a day that goes by that I don’t think about what happened at Tumbler Ridge, or the victims of this devastating tragedy and their families. It’s a constant and sobering reminder of the important and incredibly difficult work that many people in my team do each and every day,” Jason Kwon, OpenAI’s head of strategy, wrote in a post on X on Wednesday.\n“We’ve been approaching this litigation with respect for both the legal process and the families and victims of this tragedy, and we’ll continue to engage in good faith with that process.”\nEdelson did not respond to Al Jazeera’s request for comment.\nGrowing legal pressure\nIn July, British Columbia’s Attorney General Niki Sharma announced that the province would also pursue “all legal avenues to hold OpenAI and its decision-makers accountable” for the shooting.\nThe company has faced a growing slate of suits, apart from the ones from British Columbia, alleging that its product played a role in incidents that led to users harming others and themselves.\nA recent lawsuit in Florida alleges that the company “actively assisted and encouraged the mass shooting” at Florida State University in April 2025.\nThere are other complaints filed on behalf of victims across the US and Canada alleging that the victims took their own lives after being pushed by ChatGPT to do so, including a case in Quebec earlier this year.", "translation_ja": "", "vocab": [{"word": "negligence", "definition": "法的責任に基づく過失または不注意の行為。適切な注意を払う義務を怠ることを意味します。"}, {"word": "aiding and abetting", "definition": "犯罪行為を知ったうえで、その実行を助長または支援する行為。法律用語として共犯を示します。"}, {"word": "litigation", "definition": "法的紛争を解決するための訴訟またはその過程。複数の訴訟事件を指すこともあります。"}, {"word": "slate", "definition": "一連の関連する事項や予定されたリスト。ここでは複数の訴訟事件の集まりを意味します。"}, {"word": "rampage", "definition": "暴力的で破壊的な行為を伴う激怒状態や暴行。ここでは銃乱射事件の継続中の暴力的行為を指します。"}, {"word": "accountability", "definition": "行動や決定に対する責任を負うこと。組織や個人が自らの行為に対して説明責任を果たすことを意味します。"}]}, {"title_ja": "共和党上院議員、トランプ大統領にヘグセス国防長官の解任を要求", "title_en": "Republican Senator Calls on Trump to Fire Defense Secretary Hegseth", "summary_ja": "共和党のトム・ティリス上院議員は、ピート・ヘグセス国防長官の無能な経営管理と軍内の指導力の空白化を理由に、トランプ大統領に彼の解任を公開で要求した。ティリス議員は、ヘグセス長官が現代戦争の課題に対応するのではなく、文化戦争問題に焦点を当てていることを批判し、米国がイラン戦争で苦戦していると指摘した。", "summary_en": "Senator Thom Tillis, a Republican, has publicly called for President Trump to remove Defense Secretary Pete Hegseth, citing inept management and creation of a leadership void in the military. Tillis criticized Hegseth's focus on culture war issues rather than addressing modern warfare challenges as the U.S. struggles in its war with Iran.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/2/republican-senator-calls-on-trump-to-fire-secretary-of-defence-hegseth?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Republican senator calls on Trump to fire Secretary of Defence Hegseth\nSenator Thom Tillis accuses Pentagon chief of ‘inept mismanagement’ as US military is strained by war on Iran.\nUnited States Senator Thom Tillis has called on President Donald Trump to fire Secretary of Defence Pete Hegseth for creating a “leadership void” within the military amid the ongoing war with Iran.\nIn a social media post on Wednesday, Tillis contrasted Hegseth unfavourably with former Army Secretary Dan Driscoll, who submitted his resignation on Monday amid reported disagreements with the Pentagon chief.\nRecommended Stories\nlist of 3 items\n- list 1 of 3US Army Secretary Daniel Driscoll submits resignation, media reports say\n- list 2 of 3Why are US Republicans losing faith in War Secretary Pete Hegseth?\n- list 3 of 3Iran targets American bases in Jordan in retaliation to US strikes\n“I have never witnessed more inept management of the brave men and women who serve our country. He is intimidated by competence and retreats to ginning up culture wars instead of soberly attending to the vital work of our national defense and the health and well-being of our fighting force,” the North Carolina senator wrote.\n“I urge the President to find a new leader at the Pentagon who will retain and empower our military talent rather than diminish it.”\nTillis is a member of Trump’s Republican Party. But in recent years, he has become an increasingly vocal critic from within the party over policies he fears harm democracy.\nIn June 2025, amid criticism from Trump, Tillis announced he would not be seeking re-election in November’s congressional midterm polls. His term ends in January.\nEarly in Trump’s second term as president, Tillis was among the senators who voted to confirm Hegseth, a military veteran and former TV host, despite criticisms of his conduct towards women and his past work.\nTillis only confirmed his vote in favour of Hegseth at the last minute, appearing to share some of the concerns being debated in the Senate.\nSince taking office as defence secretary, Hegseth has pursued controversial changes to the Pentagon, including attempts to limit journalistic access to the Defence Department.\nHe has also undertaken a wide-ranging effort to root out what he calls “wokeness” from the military.\nThat effort has reportedly included firing top military leaders, blocking promotions, removing transgender service members and reviewing admissions standards for top military academies.\nIn Wednesday’s post, Tillis pointed to some of those efforts, questioning why Hegseth appeared fixated on culture war issues rather than modernising the military.\nHe pointed to evolving forms of warfare in Russia’s invasion of Ukraine, and in the US-Israeli war against Iran.\n“Our understanding and assumptions of warfare are being challenged in places like Ukraine and Iran, and Dan [Driscoll] understands the old way of doing business no longer applies,” said Tillis.\nThe senator then proceeded to imply that Driscoll’s departure was a direct result of Hegseth’s mismanagement.\n“If we had a Secretary of Defense who maintained the same priorities and forward-thinking, he would be fighting to retain talented leaders like Dan and the many flag officers he has forced into retirement. Instead, he is creating a leadership void at the top of our military ranks,” Tillis added.\nHegseth has faced growing scrutiny in recent months as the US struggles to achieve its goals in the war on Iran, launched on February 28. The war hit its six-month mark last week with no end in sight.\nMedia reports indicate that the war has left the Pentagon struggling with shrinking munitions stockpiles that could hinder the US military in future actions.\nThe war has also taken a toll on the popularity of the Trump administration, which has seen approval numbers sink ahead of the November congressional election.\nSince the war began, fuel prices have skyrocketed, and the conflict has spread across the Middle East.\nMore than two-thirds of Americans disapprove of the administration’s handling of the war, according to a University of Massachusetts poll released on August 31.", "translation_ja": "", "vocab": [{"word": "inept", "definition": "能力や技術に欠けた、不適切なという意味の形容詞。ここではヘグセス長官の管理能力の欠如を指摘している。"}, {"word": "void", "definition": "空白、欠落、不在を意味する名詞。文脈では指導力の不在を指す。"}, {"word": "mismanagement", "definition": "不適切な経営や管理を意味する名詞。組織運営の失敗を表現する。"}, {"word": "wokeness", "definition": "社会正義やポリティカル・コレクトネスに関する意識や取り組みを指す現代用語。"}, {"word": "munitions", "definition": "弾薬や軍事用の爆発物を意味する名詞。軍事用語として使用される。"}, {"word": "shrinking", "definition": "減少する、縮小するという意味の形容詞または動詞。ここでは弾薬備蓄の減少を表す。"}, {"word": "scrutiny", "definition": "厳密な調査や精査を意味する名詞。メディアと政治家による詳細な検討を指す。"}]}, {"title_ja": "イスラエル首相、イラン政府転覆に向けて活動中と発表", "title_en": "Israeli PM Says Israel Working to Overthrow Iran's Government", "summary_ja": "ベンジャミン・ネタニヤフ・イスラエル首相は、イスラエルがイラン政府を転覆させるために積極的に取り組んでいると述べた。i24ニュースとのインタビューで、ネタニヤフ首相は自らの指揮下にあるすべてのシステムがイラン体制の打倒に焦点を当てていると宣言した。", "summary_en": "Israeli Prime Minister Benjamin Netanyahu stated that Israel is actively working to bring down Iran's government. In an interview with i24 News, Netanyahu declared that all systems under his direction are focused on defeating the Iranian regime.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/2/israeli-pm-says-israel-is-working-to-overthrow-irans-government?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Israeli PM says Israel is working to overthrow Iran’s government\nNewsFeed\nIsraeli PM says Israel is working to overthrow Iran’s government\nIsraeli Prime Minister Benjamin Netanyahu said on Wednesday that his country is working to overthrow Iran’s government. In an interview with i24 News, Netanyahu said: ‘All of our systems, under my direction, are working to bring down this regime and defeat it.’\nPublished On 2 Sep 2026", "translation_ja": "", "vocab": [{"word": "overthrow", "definition": "政権や支配者を武力または権力で排除して倒すこと。政治的な転覆や革命の文脈で使用される。"}, {"word": "regime", "definition": "特定の支配者や権力によって統治される政治体制のこと。政治的な統治方式を指す。"}, {"word": "direction", "definition": "指導や管理のもと、あるいは指揮下という意味。上級者による統制や監督を示す。"}, {"word": "declare", "definition": "公式に、または明確に発表や宣言すること。声明や意見を公開する際に使う。"}, {"word": "actively", "definition": "積極的に、または能動的に何かを行うこと。消極的ではなく、主体的に活動する様子を示す。"}]}, {"title_ja": "米国国土安全保障長官搭乗機がエンジン故障後に無事着陸", "title_en": "U.S. Homeland Security Chief's Plane Safely Lands After Engine Failure", "summary_ja": "米国沿岸警備隊が運航するガルフストリームV型ジェット機がアトランタからワシントンD.C.への飛行中に右エンジンが故障した。操縦士は巧みにレーガン・ワシントン・ナショナル空港に方向を変え、搭乗者14人を乗せたまま単一エンジンでの着陸に成功した。マルキン国土安全保障長官は沿岸警備隊操縦士の専門性を称賛し、このような状況での単一エンジン着陸は彼らにとって初めての経験だったと述べた。", "summary_en": "A U.S. Coast Guard Gulfstream V jet carrying Homeland Security Secretary Markwayne Mullin experienced a right engine failure while flying from Atlanta to Washington, D.C. on Wednesday. The pilot skillfully diverted to Reagan Washington National Airport and executed a single-engine landing safely with 14 people on board. Mullin praised the Coast Guard pilots for their professionalism, noting it was their first single-engine landing in such circumstances.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/plane-carrying-us-dhs-chief-lands-after-suffering-engine-failure/article71421392.ece", "state_media": false, "category": "社会", "full_text": "A U.S. Coast Guard-operated Gulfstream V jet carrying Homeland Security Secretary Markwayne Mullin safely diverted to Reagan Washington National Airport on Wednesday (September 2, 2026) after suffering an engine failure.\nThe pilot declared an emergency after the right engine failed on a flight from Atlanta to the Washington, D.C., area and landed at Reagan, according to Mullin and air traffic control audio.\nThe C-37A plane had 14 people on board, according to the pilot. It landed around 1:35 p.m. ET (1735 GMT)\n“The United States Coast Guard pilots made the single engine landing feel routine,” Mullin said on X. “No panic, just straight professionalism.” He added: “After we landed, the pilots told me that was a first for them! We could not have been in better hands.”\nThe Federal Aviation Administration declined to comment and referred questions to the Coast Guard, which did not immediately comment.\nThe plane has been in service since 2002 and is based at Air Station Washington.\nPublished - September 03, 2026 03:57 am IST", "translation_ja": "", "vocab": [{"word": "diverted", "definition": "予定されたルートから別のルートに変更すること。航空業界では緊急時に別の空港に向かうことを意味する。"}, {"word": "declared an emergency", "definition": "パイロットが航空管制官に緊急状態を公式に通知すること。安全が脅かされている状況を示す。"}, {"word": "professionalism", "definition": "職業人としての高い技能と責任感を持った行動や態度。特に緊急時における冷静さと経験を示す。"}, {"word": "Federal Aviation Administration", "definition": "米国の民間航空を規制・監督する政府機関。航空安全基準の制定と運用を担当する。"}, {"word": "Air Station", "definition": "航空機が配備され、運用される軍事施設またはコーストガード基地。保守と訓練が行われる場所。"}]}, {"title_ja": "ホルムズ海峡の対立激化、イランが非準拠船舶の黒リストを拡大", "title_en": "Iran Blacklists More Ships in Hormuz Strait Amid Escalating US Conflict", "summary_ja": "イランはホルムズ海峡での規則違反とみなされた56隻の船舶を新たに黒リストに追加し、罰金・没収・拘留を脅迫している。米国との軍事衝突が激化する中での行動であり、両国は相互に空爆を実施して対抗している。この紛争はイランの経済にも打撃を与え、リアルは対ドルで過去最低の220万レート付近に下落している。", "summary_en": "Iran has expanded its blacklist of ships deemed non-compliant in the Strait of Hormuz to 56 vessels, threatening fines, confiscation, or detention. This escalation occurs amid intensifying military exchanges between Iran and the United States, with both sides trading threats and conducting heavy strikes. The conflict has also impacted Iran's economy, with the rial dropping to a record low of 2.2 million per dollar.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/west-asia-war-us-attack-on-iran-live-updates-donald-trump-strait-of-hormuz-news-september-2-2026/article71418027.ece", "state_media": false, "category": "政治", "full_text": "A person holds a fragment of a projectile bearing a warning in English at a site that Iranian media said was hit in a U.S. strike in Kuhestak, southern Iran, on September 2, 2026.\n| Photo Credit:\nAP\nIran threatened to take a tougher line in its wa
