reductively brands 2020’s social justice movement – as prominent liberal voices reflect on that time period with disappointing hindsight. During a recent appearance on ABC’s This Week, when asked about 2020-era demands to abolish prisons and police, Alexandria Ocasio-Cortez, the US congresswoman from New York, abandoned her previous support of the “defund the police” movement, and instead joked: “Woke 1 was crazyyyyy.”\nOcasio-Cortez, a democratic socialist, implied that the still-resounding calls for municipalities to reduce police budgets and to divert aid to poor communities were worth advocating for during the 2020 uprising, but are now “crazyyyyy”. In 2020, she noted that “a lot of people cannot fathom what an abolitionist America looks like. Tell them it looks like a suburb. Affluent white communities already live in a world where they choose to fund youth, health, housing more than they fund police.” But she has since backtracked on that idea.\nOn 9 August, she told This Week co-host Jonathan Karl: “We all share the goals of having as low a crime rate as possible [but] rhetoric in that time is not rhetoric that we would use today.” Days later, Zohran Mamdani, the progressive New York mayor, echoed her sentiment by surmising: “Sometimes, what you believe can change and develop.” But their reversing course on abolition isn’t development; it’s a devolution.\nThe backlash to Ocasio-Cortez’s comments was widespread from leftists who felt as if her disavowal of the abolition and “defund the police” movements was an attempt to appease the Democratic establishment at their expense. Others, however, agreed with the assertion that “Woke 1” was defined by overly rigid radicalism, much of which occurred on social media, as with Chi Ossé’s 2021 post on Twitter declaring that “a cis white man should not be the next speaker of the council”. Ossé, a New York City council member, coined the term “Woke 1” after being confronted this past May with his old tweet.\nWhile everyone weighed in on “Woke 1”, though, I was more concerned with why the hell we were using branding co-opted by conservatives to discuss a movement against state-sanctioned killings of Black people. “Woke” has long shifted from Black America’s prideful adjective to a mocking noun that has been weaponized to ridicule Black liberation movements. Progressive liberals now adopting that dismissive language while placing confines on the movement for Black lives is damning.\nThe term “woke” originated in Black American communities, and was popularized by a 2008 Erykah Badu lyric: “Even though you go through struggle and strife / To keep a healthy life, I stay woke.” The term became popular parlance in the 2010s; to “stay woke” meant you understood the components of white supremacy enough to identify them anywhere, whether in a work of art or a politician’s dog-whistling comments.\nBut, as with other terms that originated in Black culture (“Blexit”, “Black fatigue”), the phrase was co-opted by rightwingers who claimed that calls for progressive policy were divisive and reactionary. By 2020, as the police killings of George Floyd and Breonna Taylor sparked a worldwide uprising, the burning of Minnesota’s third precinct, and widespread calls for radical change, conservatives pushed back by vilifying the word “woke”.\nIn 2022, Ron DeSantis, the Florida governor, introduced the Stop Woke Act (Stop Wrongs to Our Kids and Employees Act), which tried to restrict schools and businesses from discussing critical race theory, misogyny and other oppressive dynamics. The then minority leader in the Senate, Mitch McConnell, warned that corporations should stop listening to our calls for equity lest they become “a woke parallel government”. The conservative commentator Ben Shapiro held live events to discuss “how wokeness is destroying America”. And a Santa Barbara Independent op-ed lauded the late far-right podcaster Charlie Kirk for “going into the lion’s den of woke”.\nSo Ocasio-Cortez and Ossé evoking “woke” with the same pretense as these sectarian conservatives is cringeworthy. And when they do it to scoff at a movement against the police system’s predation of Black people, it’s dangerous. These comments come at the same time that Maga-world is engaged in a full-scale assault on Black people’s past, present and future, including the rollback of diversity measures leading to mass layoffs of Black employees, the systematic erasure of Black history from schools and attempts to repeal our voting rights.\nThe phrase “Woke 1” is also off-putting because it’s dismissive of the work that abolition advocates and social justice organizations have been doing before and after 2020. What happened at the start of the decade wasn’t momentary advocacy; it’s in lockstep with what freedom fighters have been seeking since the inception of this country. It behooves some Democrats to realize the vitality of grassroots movement work isn’t", "translation_ja": "", "vocab": [{"word": "disparaging", "definition": "他者や物事を見下す、軽蔑的な態度を示すこと。ネガティブな表現や批判を行う行為を指す。"}, {"word": "reductively", "definition": "複雑な事象をあまりに単純化して説明すること。本来の意味や重要性を失わせるような説明方法。"}, {"word": "abolitionist", "definition": "廃止論者のこと。特に警察制度や監獄制度などの完全廃止を主張する人々を指す。"}, {"word": "devolution", "definition": "発展や進化の逆で、後退や衰退。より低い段階への移行や権限の委譲。"}, {"word": "co-opted", "definition": "他の者や立場に利用される、あるいは自分たちの立場に取り込まれること。本来の意味が歪められる。"}, {"word": "vilifying", "definition": "言葉や表現で他者や概念を激しく非難し、悪いイメージを広める行為。"}, {"word": "sectarian", "definition": "特定の宗教、政治グループに属する人物の立場。狭い視点や排他的な態度を指すことが多い。"}]}, {"title_ja": "長期的な中国戦略の構築", "title_en": "A China Strategy That Lasts", "summary_ja": "著者は、行政府の一貫性を欠く政策ではなく、議会が制定した恒久的な通商戦略により、中国の地政学的ツールとしての貿易慣行に対抗する必要があると主張している。議会は通商執行の強化、税関システムの近代化、デミニミス閾値などの抜け穴を閉じることで、米国の産業基盤と製造業を再構築すべきである。", "summary_en": "The author argues that the U.S. must establish a durable, congressionally-mandated trade strategy to counter China's systematic use of trade as a geopolitical weapon, rather than relying on inconsistent executive branch policies. Congress should permanently strengthen trade enforcement, modernize customs systems, and close loopholes like the de minimis threshold to rebuild America's industrial base and manufacturing capacity.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/china-strategy-lasts", "state_media": false, "category": "オピニオン", "full_text": "For decades, Beijing has used trade not only as a means to generate economic growth but also as a geopolitical tool to attract investment, strengthen its industrial base, expand its economy, and support its military. It has done so by integrating national security, economic security, energy policy, and environmental policy. In sectors as varied as automobiles, chemicals, and solar panels, the Chinese government’s policies have led to overproduction at home, which pushes companies to export at low prices, flooding international markets and undermining the manufacturing bases of rival economies. The erosion of those countries’ industrial capacity ultimately weakens their ability to compete with and resist China economically, diplomatically, and militarily. And the United States cannot win a long-term competition with China when Beijing controls global manufacturing and supply chains.\nIn Washington, policymakers of both parties recognize the China challenge. Yet the United States’ approach to addressing this challenge has shifted with each presidential administration and, at times, even within a single presidency. Long-term challenges require long-term solutions, and Congress is the branch best suited to crafting such solutions. Congress can provide the consistency and predictability needed to align U.S. economic, trade, and national security goals into the future. If the United States hopes to compete successfully with China in the coming decades, Congress—not the executive branch alone—must establish a durable framework that can outlast political cycles.\nTo counter China’s trade policy and protect U.S. national security, Congress should pass legislation to permanently strengthen enforcement of existing trade laws, modernize customs authorities to better track goods coming from China, deepen partnerships in the Western Hemisphere, and address the advantage that China derives from weak enforcement of environmental standards. Many such pieces of legislation have already been introduced. Now, Congress needs to move forward and make them law. This will ensure that the United States can rebuild and protect its industrial base and win the competition with its biggest geopolitical rival.\nCLOSING LOOPHOLES\nA long-term trade strategy to counter China must first have permanent trade enforcement. One positive step came in July 2025, when Congress closed the de minimis loophole, which allowed goods costing less than or equal to $800 to be imported without a tariff. Because of this loophole, in 2024, approximately four million packages a day—mostly from China—entered the United States duty free and largely unscreened. Counterfeit products, goods containing hazardous chemicals such as fentanyl, and cheap consumer products were pouring into the United States. Meanwhile, American exporters sending goods to China faced tariffs on any products for individual use costing more than $6.90 and on commercial products worth more than $690.00.\nRepealing the de minimis threshold will help level the playing field for American manufacturers and create a more stable framework going forward—one that cannot be changed by a future executive order. But other legislation is needed to further bolster enforcement. Currently, U.S. trade strategy relies on a June 2026 executive order that increases the bond on high-risk goods that is required to guarantee duties get paid in full, places restrictions on repeat violators of customs rules, establishes minimum penalty floors, and expands reporting requirements that provide Customs and Border Protection with the ownership and supply chain information necessary to identify bad actors. Together, these changes make it harder for Chinese companies to exploit gaps in U.S. customs enforcement.\nCongress should codify the June 2026 executive order to make these changes permanent. Such a bill warrants bipartisan support because protecting U.S. manufacturers and rebuilding the manufacturing job base is a shared priority for policymakers. Furthermore, such a bill would protect American businesses and ensure that trade rules are enforced more consistently.\nGET WITH IT\nEnforcement alone will be insufficient, however, if customs authorities continue relying on systems designed for an earlier era of global commerce. Although recent executive actions, including the June 2026 customs enforcement order, authorize the destruction of counterfeit goods, expand electronic filing, and move the United States toward a better trade-processing system, Congress should pursue a broader effort to bring customs into the twenty-first century.\nThe Customs Modernization Act, which I introduced in 2023, aims to replace paper-based customs processes with comprehensive electronic filing. It also requires online marketplaces to provide verified seller and transaction data. The Trump administration has since built on these reforms by requiring importers of record—the entities legally responsible for imported goods—to maintain sufficient do", "translation_ja": "", "vocab": [{"word": "geopolitical", "definition": "地政学的な、国家間の権力や影響力に関わる。国際関係や戦略的な利益に基づいた政治的行動を指す。"}, {"word": "durable", "definition": "耐久性のある、長期間持続する。政策文脈では、時間の経過や政治的変化に耐える安定性を意味する。"}, {"word": "codify", "definition": "法律や規則として正式に制定する、法典化する。行政命令を永続的な法律に変えることを指す。"}, {"word": "de minimis", "definition": "法律用語で「ごく少量の」という意味。特に税関では、低額商品の関税免除規定を指す。"}, {"word": "enforcement", "definition": "法律や規則の執行、実施。通商文脈では、貿易規則が適切に守られていることを確認する行為。"}, {"word": "undermine", "definition": "基盤を弱める、損なう。徐々に力や信頼性を低下させることを意味する。"}]}, {"title_ja": "アメリカの失われた軍事革命", "title_en": "America's Missing Military Revolution", "summary_ja": "元Apple幹部で国防総省イノベーション責任者の著者は、米軍の時代遅れの調達制度が最新の民間技術の迅速な採用を妨げていると主張している。ロシア、中国、イランなどの敵対国が軍事技術を継続的に革新・展開する一方、アメリカの複雑な調達プロセスは数年要し、システムが配備される前に陳腐化してしまう。改革の必要性についての超党派的コンセンサスが存在するにもかかわらず、国防総省は必要な規模での変革的な改革を実施できていない。", "summary_en": "The author, a former Apple executive and Pentagon innovation official, argues that the U.S. military's outdated acquisition system prevents it from rapidly adopting cutting-edge commercial technology. While adversaries like Russia, China, and Iran continuously innovate and deploy new military technologies, America's Byzantine procurement process takes years, making systems obsolete before deployment. Despite bipartisan consensus on the need for reform, the Pentagon has failed to implement transformational changes at the necessary scale to maintain military superiority.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/americas-missing-military-revolution-doug-beck", "state_media": false, "category": "オピニオン", "full_text": "Imagine buying new iPhones for yourself and your family. You visit a store to see the latest model, the iPhone 17, and then go to Apple’s website to buy yours. But before finalizing your purchase, you have to spend two to three years experimenting with your pick. By then, Apple will have released two newer models, perhaps an iPhone 18 and iPhone 19. Yet you are not allowed to upgrade your order—you have to stick with the model you tested.\nEven then, your already two-year-old iPhone 17 cannot be delivered for two more years, at which point the iPhone 20 and 21 have been unveiled. And only your phone will be delivered at that time—your kids and spouse won’t get their iPhone 17s for another year or two. You may also be locked into whatever operating software was available on the iPhone 17 when you first tested it.\nThis is how the Defense Department has long been forced to buy technology, including missiles, drones, and the software that controls them. When Pentagon officials identify a problem, the process of finding a system that can solve it and purchasing it typically takes years. It then takes years more to acquire enough of that solution to meet the military’s requirements. By then, the solution is outdated. Relentless private-sector competition has spawned new technologies, but the military cannot buy them, much less do so at scale, because they have not gone through the same cumbersome testing, evaluation, and purchasing processes.\nHaving lived at the cutting edge of one side of this equation, as an Apple executive, and then at the other, as the official charged with driving defense innovation for the Pentagon, I’ve seen both sides up close and personal.\nThe entrenched, byzantine system for acquiring things is why the most sophisticated country in human history is at risk of no longer having the world’s most sophisticated military. The U.S. private sector sets the global standard for creativity, nowhere more than in tech hubs such as Silicon Valley. Yet the way the United States buys and deploys military technology is, like the rigid, Soviet-style five-year plans that even China and Russia have long since jettisoned, mind-numbingly bureaucratic. And despite real progress, the United States is still not changing this process fast enough, or at sufficient scale, to keep America safe in an increasingly dangerous world.\nBattlefields from Ukraine to the Middle East have demonstrated with brutal clarity just how much warfare has changed. The breakneck pace of technological innovation makes it possible to roll out new autonomous weapons, AI algorithms, and other sophisticated systems that are updated constantly and easy to scale. The Russians are demonstrating every day in Ukraine that their army of developers can crank out new drones while updating hardware and software, sometimes daily, to match Kyiv’s constant advancements, which continue, in turn, to allow Ukraine to keep Russia at bay even though its armed forces and economy are far larger. China has embarked on a massive military buildup, including increasing its production of ships, satellites, missiles, and drones, and has demonstrated the ability to adopt and integrate the latest technology into them. Even Iran has successfully used new technologies to effectively close the Strait of Hormuz this year, despite being completely outmatched by American military power.\nThe United States faces simultaneous challenges from China, Russia, Iran, North Korea, and elsewhere. Chinese leader Xi Jinping has told his military to be prepared to defeat the United States in the Taiwan Strait by 2027. War with China is neither inevitable nor imminent. But Washington and its allies must be able to deter Xi, and they must be ready to win if forced to fight. To do so, they must harness the power of commercially derived technology.\n It is nearly impossible for the Pentagon to make bets on truly new technologies.\nAmericans understand that the acquisition system is broken. The Trump administration, the Biden administration before it, Democrats and Republicans in Congress, military leaders, and the tech sector’s founders and funders have all called for dramatically changing the way the Department of Defense buys and deploys technology. This consensus represents progress. Ten years ago, only a small group of people were arguing that the Pentagon needed to make such a transformation, or that Silicon Valley’s commercial technology was pivotal for military power. Now, it is central to every defense-related conference, to policies originating in the Pentagon and on Capitol Hill, and to the investment theses of an ever-growing, dynamic defense tech sector.\nBut Americans would be foolish to think that Washington is anywhere near solving this problem. It is not. The United States is not yet delivering on this strategic imperative or making the permanent transformational changes necessary to do so. Progress has been relatively isolated. Successes have captured the news, but improvement", "translation_ja": "", "vocab": [{"word": "Byzantine", "definition": "複雑で理解しがたい制度や手続きを指す。ビザンチン帝国の複雑な官僚制度に由来し、非効率で迷路のような組織構造を表現する際に使用される。"}, {"word": "Procurement", "definition": "商品やサービスの調達・購買プロセスを意味する。特に政府や大規模組織が必要な物資を供給者から取得する過程を指す。"}, {"word": "Entrenched", "definition": "深く根付いた、確立された状態を表す。変更が難しい既得権益や慣習が組織内に定着している状況を描写する。"}, {"word": "Deter", "definition": "抑止する、行動を思いとどまらせるという意味。軍事文脈では、敵対国の攻撃を防止するために圧倒的な軍事力を保有することを指す。"}, {"word": "Strategic imperative", "definition": "戦略的に必須の要件や課題。国家安全保障の維持に不可欠で、優先的に取り組むべき事項を意味する。"}, {"word": "Breakneck pace", "definition": "危険なほど速い速度、猛烈なペースを表す。技術進化や変化が急速に進む状況を強調する際に使用される。"}]}, {"title_ja": "AIと新たなバイオウェポンの時代", "title_en": "AI and the New Age of Bioweapons", "summary_ja": "著者は、AIとバイオテクノロジーの統合により、非国家主体、テロ組織、個人によるバイオウェポン開発のリスクが前例のないレベルに達し、従来の抑止戦略が機能しなくなったと主張する。生物学的攻撃を完全に防ぐことは不可能であるため、米国は早期警戒、迅速な対応、ワクチン生産、犯人特定に焦点を当てた「復旧力による抑止」戦略を採用する必要があると述べている。2024年のH5N1流行時に明らかになったように、現在の米国システムは生物学的脅威に効果的に対抗するために必要な調整、資源、ツールが不足している。", "summary_en": "The author argues that AI integration with biotechnology has created unprecedented risks of bioweapon development by non-state actors, terrorists, and individuals, making traditional deterrence strategies obsolete. Since biological attacks cannot be entirely prevented in this new threat landscape, the U.S. must adopt a \"resilience by deterrence\" strategy focused on early detection, rapid response, vaccine production, and attribution of perpetrators. Current U.S. systems lack the coordination, resources, and tools demonstrated necessary during the 2024 H5N1 outbreak to effectively contain biological threats.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/ai-new-age-bioweapons-sherwood-randall", "state_media": false, "category": "オピニオン", "full_text": "Pathbreaking scientific discoveries can create transformational possibilities. They can also create catastrophic risks. The integration of artificial intelligence, biotechnology, and bioengineering is already enabling life-changing achievements, from combating disease to supercharging agricultural productivity to solving energy challenges. But it is also generating capabilities that can be weaponized more easily than ever by a growing number of actors. The United States is unprepared for these threats.\nIn the foreseeable future, a terrorist group with minimal skills could access a jailbroken AI model (one that has evaded safety controls) trained on the world’s most comprehensive biological data set. The group could use the model to design a new strain of H5N1 avian influenza that is more lethal and more easily spread from animals to humans than existing strains. Connecting remotely to one of the new generation of fully equipped, contract-for-service “cloud” labs, it could anonymously arrange for the virus to be built and tested and then sent to a biomanufacturing facility to be produced at scale. From there, the group could stealthily disperse the new strain through air-handling systems at major livestock farms across the United States.\nBefore long, the American poultry, beef, and dairy industries would suffer massive losses. When the virus inevitably jumped to the human population, it would cause severe illness and could result in hundreds of thousands or even millions of deaths. The response from U.S. public and private institutions—lacking both an integrated strategy and adequate tools—would be too slow, too uncoordinated, too underresourced, and too overwhelmed to stop the spread and mitigate the consequences. And soon, the virus would also cross borders, triggering food insecurity, widespread sickness, and mass casualties around the world.\nU.S. policymakers have long contended with the possibility of biological attacks from hostile nation-states. Along with surveillance and global risk-reduction initiatives, Washington successfully deterred such attacks with the threat of significant retaliation, including the use of nuclear weapons. Yet that strategy was effective because only a small number of governments were developing the most dangerous biological weapons. It no longer works in a world in which AI allows more actors—rogue states, terrorist groups, even individuals—to develop new bioweapons of their own.\nIn this new threat landscape, biological attacks are unlikely to be prevented entirely, given the proliferation of biological capabilities and the fact that some actors cannot be deterred by traditional means. Policymakers need a new strategy in response—one that accepts that biological attacks are likely and prepares to contain the harm, helps the country recover more quickly, and uses new tools to identify and hold perpetrators accountable. Ultimately, this resilience to biological attacks could dissuade malicious actors from attempting to use them in the first place, knowing that the effects will be minimized—a strategy of deterrence by resilience.\nConsider the attack scenario described above, but with a comprehensive strategy in place. The U.S. government would use a sophisticated biological monitoring system to provide early warning of the emergence of a new viral pathogen. Employing many of the same technologies that enable the threat in the first place, federal laboratories would determine its origin from telltale signatures in the AI model used to design the virus—enabling prompt efforts to track and target the perpetrators. Public health authorities would have the tools to integrate scientific and intelligence data to suppress the disease’s spread. Based on pre-negotiated contracts to provide surge capacity, the biomanufacturing sector would accelerate the production of diagnostics, therapeutics, and vaccines. Although the crisis would not have been prevented entirely, its effects would be speedily and effectively contained: vulnerable human and animal populations protected, contagion minimized, agricultural production recovered, public confidence restored.\nSuch bioresilience is far from today’s reality. In 2024, H5N1 bird flu spread from poultry to dairy and beef herds and eventually to more than 70 humans. As the White House homeland security adviser at the time, I coordinated the federal response to this potentially catastrophic threat. The virus was naturally occurring, not the result of a deliberate attack. It nevertheless showed that even in this base case, there were considerable weaknesses and gaps in U.S. prevention, monitoring, attribution, and response systems. Data on disease incidence and spread were hard to acquire and exasperatingly incomplete. Mobilizing sufficient preventive action by the poultry and cattle industries proved difficult and slow. And in order to deliver sufficient quantities of human vaccines to protect the American people, we needed to provide substantial n", "translation_ja": "", "vocab": [{"word": "pathbreaking", "definition": "革新的で新しい道を切り開く性質を持つことを意味します。科学や技術の分野で、従来の限界を超える発見や成果に対して使用されます。"}, {"word": "jailbroken", "definition": "AIモデルなどのセキュリティ制限や安全装置を回避した状態を指します。本来の制限を無効化されたシステムを説明する際に用いられます。"}, {"word": "proliferation", "definition": "危険な物質や技術、能力などが急速に広がり増殖することを意味します。核兵器やバイオウェポンなどの拡散を描写する際に使用されます。"}, {"word": "resilience", "definition": "困難や危機から回復し、適応する能力を意味します。システムやコミュニティが被害を受けても機能を維持・回復する強靭性を表します。"}, {"word": "telltale", "definition": "何かの正体や起源を明らかにする特徴的な痕跡や兆候を指します。犯人特定や原因追跡の文脈で用いられる形容詞です。"}, {"word": "bioresilience", "definition": "生物学的脅威に対する社会やシステムの復旧力と耐性を意味します。パンデミックや生物兵器攻撃からの回復能力を説明する造語です。"}, {"word": "attribution", "definition": "攻撃やイベントの原因や責任者を特定・判定するプロセスを意味します。サイバー攻撃やテロ行為の犯人追跡において重要な概念です。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-19 21:12 JST";
  renderTabs();renderList();
})();
</script>
