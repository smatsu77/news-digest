er must be lifted,\" said Mr. Turk.\nAnd in twin statements on X, European Commission chief Ursula von der Leyen and European Council head Antonio Costa the court \"must be able to act independently and without external pressure.\"\nGermany's foreign ministry also called the court's independence \"of central importance,\"; while the Netherlands, which hosts the court at The Hague, also voiced its disapproval.\nJoining the chorus of condemnation, Spain described the court as \"the cornerstone of the international criminal justice system\".\nAnd the court itself said in a statement: \"These sanctions are a flagrant attack against the independence of an impartial judicial institution.\"\n\"Such measures targeting judges, prosecutors and staff... undermine the rule of law.\"\nJapan objects\nWashington's latest move follows sanctions it imposed on several ICC officials, seen as largely in response to the court's investigations involving Israel, a U.S. ally.\nJapan also objected to the sanctions, saying the country has \"consistently supported the ICC... in its efforts to prosecute and punish the most serious crimes of concern to the international community and to uphold the rule of law.\"\nThe measures are \"very unfortunate,\" foreign ministry press secretary Toshihiro Kitamura said in a statement.\nJapan is the biggest funder of the ICC and a close U.S. ally -- which is not a party to the international treaty that established the court.\nU.S. Secretary of State Marco Rubio earlier said in a statement, without providing examples, that the sanctioned \"individuals have directly engaged in efforts by the ICC to investigate, arrest, detain, or prosecute officials whose government has not consented to ICC jurisdiction\".\nEstablished in 2002, the ICC prosecutes individuals accused of the gravest atrocities and acts as a last resort when countries do not have adequate legal systems to ensure accountability.\nIsraeli support\nPresident Donald Trump's administration has already imposed sanctions against officials of the ICC, which issued in 2024 an arrest warrant for Israeli Prime Minister Benjamin Netanyahu over the war in Gaza.\nThe measures bar them from entering the U.S. and from carrying out transactions in the US financial system.\nIn an X post Tuesday (August 18, 2026), Mr. Netanyahu applauded the U.S. sanctions and called the ICC \"a kangaroo court that cloaks its abuse of power in the language of international law\".\nLast month, Washington launched a major diplomatic offensive against the ICC, accusing it of \"threatening\" Americans and calling on partners to withdraw from the body -- a move already announced by Chad and Venezuela, which has aligned with the United States since it captured leader Nicolas Maduro.\nThe ICC expressed concern that such withdrawals risked undermining the collective pursuit of justice.\n'Assault'\nThe U.S. signed the Rome Statute establishing the ICC but never ratified the treaty. Israel, Russia and China are not ICC members either.\n\"The Trump Administration has been clear: the International Criminal Court is a corrupt and fatally politicised supranational court that has maliciously abused its authority and exceeded its mandate,\" said Mr. Rubio's statement.\n\"We will not tolerate its assault on state sovereignty.\"\nLast week, four human rights groups sued Mr. Trump in a New York court over his sanctions targeting the ICC, arguing the measures blocked victims of war crimes from pursuing justice.\nIn 2023, the ICC issued an arrest warrant for Russian President Vladimir Putin over the war in Ukraine, prompting Moscow to issue its own arrest warrants for senior court officials.\nThese included Akane, 70, an ICC judge since 2018 who was elected as the court's president in March 2024.\n\"Even if one judge were to die, we are easily replaceable, so there is really no value in targeting us,\" she said after the Russian announcement.\nPublished - August 19, 2026 10:47 pm IST", "translation_ja": "", "vocab": [{"word": "flagrant", "definition": "極めて目立つ、あるいは明らかに不当である様子を表す。法律や規則の重大な違反を指すことが多い。"}, {"word": "politicised", "definition": "政治的な影響を受けて、党派的または不公正になることを意味する。中立性や独立性が失われた状態を示す。"}, {"word": "sovereignty", "definition": "国家が自らの領土と人民に対して持つ最高の権力。他国からの干渉を受けない独立した権利を示す。"}, {"word": "jurisdiction", "definition": "特定の裁判所や機関が法的権限を行使できる範囲や領域。どの地域や人物に対して権力が及ぶかを定義する。"}, {"word": "ratified", "definition": "条約や協定を正式に承認し、法的に効力を持たせること。国の議会や指導部が公式に同意する行為。"}, {"word": "diplomatic offensive", "definition": "国家が他国や国際機関に対して集中的に行う政治的な圧力や説得活動。複数の手段を使った戦略的な働きかけを指す。"}, {"word": "maliciously", "definition": "悪意を持って、または故意に害を与えるために行動することを示す副詞。違法または不正な意図を伴う行為に用いられる。"}]}, {"title_ja": "ラジナート・シン防衛相、小泉防衛相とインド・日本防衛関係のロードマップを協議へ", "title_en": "Rajnath Singh, Koizumi to discuss roadmap for India-Japan defence ties", "summary_ja": "インドのラジナート・シン防衛相は、日本の小泉シンジロー防衛相とニューデリーで会談し、インド太平洋地域における二国間防衛・安全保障協力を強化する予定である。協議は海洋安全保障、『メイク・イン・インディア』枠組みの下での防衛技術協力、および戦略的ロードマップの策定に焦点が当たる。小泉防衛相の訪問は、モディ首相との最近の日本の高市首相の首脳会談に続くものであり、インド・日本防衛パートナーシップの勢いの増加を反映している。", "summary_en": "Indian Defence Minister Rajnath Singh will meet with Japanese counterpart Shinjiro Koizumi in New Delhi to strengthen bilateral defence and security cooperation in the Indo-Pacific region. The discussions will focus on maritime security, defence technology collaboration under the 'Make in India' framework, and developing a strategic roadmap. Koizumi's visit follows Japanese PM Takaichi's recent summit with PM Modi, reflecting growing momentum in India-Japan defence partnerships.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/national/rajnath-singh-koizumi-to-discuss-roadmap-for-india-japan-defence-ties/article71365180.ece", "state_media": false, "category": "政治", "full_text": "Defence Minister Rajnath Singh will hold a bilateral meeting with his Japanese counterpart, Shinjiro Koizumi, in New Delhi on Thursday (August 20, 2026), with the two sides expected to discuss ways to further strengthen defence and security cooperation and enhance strategic trust in the Indo-Pacific.\nAccording to the Ministry of Defence, the Ministers are expected to exchange views on deeper maritime security cooperation and closer collaboration in defence equipment and technology under the ‘Make in India’ framework, particularly following Japan’s revision of its Three Principles on Transfer of Defence Equipment and Technology.\nThe meeting is also expected to provide an opportunity to identify new areas of collaboration and prepare a roadmap for advancing bilateral defence and security cooperation, with both countries sharing a vision of a free, open, resilient and prosperous Indo-Pacific.\nKoizumi, on his maiden visit to India, visited the Western Naval Command in Mumbai on Wednesday (August 19, 2026). He held discussions with Chief of the Naval Staff Admiral Krishna Swaminathan and Flag Officer Commanding-in-Chief, Western Naval Command, Vice Admiral Sanjay Vatsayan.\nThe Japanese Defence Minister was briefed on the roles, responsibilities and operational capabilities of the Indian Navy. He inspected a Guard of Honour at the Western Naval Command and earlier laid a wreath at the Gaurav Stambh at the Naval Dockyard. He also visited the indigenously built guided-missile destroyer INS Chennai.\nThe two-day visit underscores the growing momentum in India-Japan defence ties and comes weeks after Japanese Prime Minister Sanae Takaichi’s visit to New Delhi for the Annual Summit with Prime Minister Narendra Modi, where the two sides agreed to deepen defence and security cooperation.\nThe Rajnath Singh-Koizumi meeting is expected to further consolidate the strategic partnership between the two countries, particularly in the maritime and defence technology domains.\nPublished - August 19, 2026 08:11 pm IST", "translation_ja": "", "vocab": [{"word": "bilateral", "definition": "2つの国や当事者の間で行われる、相互的な関係や合意を指す。国際関係や政治的交渉の文脈でよく使用される。"}, {"word": "consolidate", "definition": "複数の要素や関係を統合し、より強固で安定した状態にすること。ビジネスや政治的パートナーシップの強化を表す。"}, {"word": "maritime", "definition": "海や海洋に関連する、または海上輸送・海軍活動に関するものを指す。海洋法や海洋安全保障の文脈で頻出する。"}, {"word": "resilient", "definition": "困難や危機から回復する能力がある、または柔軟性を持つという意味。政治や経済システムの強度を説明する際に使われる。"}, {"word": "momentum", "definition": "勢い、推進力、または段階的な進行を指す。外交関係や交渉の進展状況を表現する際に使用される。"}, {"word": "underscores", "definition": "何かの重要性や意義を強調する、または明確にするという意味の動詞。ニュース記事で事象の重要性を強調する際に用いられる。"}]}, {"title_ja": "ジョン・タバレス、2018年の大型契約交渉の詳細を明かす、800万ドルの税務問題と対峙", "title_en": "John Tavares Details Negotiations Behind Lucrative 2018 Deal Amid $8M Tax Battle", "summary_ja": "トロント・メープルリーフスのスター選手ジョン・タバレスが、2018年のフリーエージェント契約に至った交渉の詳細を明かした。同選手は現在、この契約に関連した800万ドルの税務問題と対峙している。", "summary_en": "Toronto Maple Leafs star John Tavares has revealed details of the negotiations that led to his lucrative 2018 free-agent contract. The hockey player is currently fighting an $8-million tax bill related to the deal.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi7gFBVV95cUxONEt3djRrVHlZZFlic09jVUVPazlrUjRSUE1SRTVzc1htQU9yU04wMnJtMFc2dDZxVklTVWRybXhwOHJFcnBxRGZMaUNQdXFFWUMyb2xVNU13dTh6Qklkdk4wbzdPdG1uRUM2WFZfSktWN0dScnp6NjFRRHE1R3plcnBISmVHN2dwU2Y3T3hOemRETGwzOTVfYmljR0FoYUZJTVRTbWhNd1UwZm1JLWFGM3BGcnMxUExtaWJaclJTTmN0S0xkWVlEVjNnclBqeHM4VXRWLVB0TzJYSlhYcjRGcFR3ZG52Q2JnLTJqY2dB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カーニー氏によるニューファンドランド・ケベック州間の電力取引、有権者に重大な選択肢をもたらす", "title_en": "Carney's Newfoundland-Quebec electricity deal presents major choice for voters", "summary_ja": "マーク・カーニー氏がニューファンドランド州とケベック州間で重要な電力取引を仲介し、地域のエネルギー政策を再編成する可能性がある。この合意は巨大なダムからの水力発電を中心としており、ケベック州の有権者に同州のエネルギー将来について重要な決断を迫るものである。", "summary_en": "Mark Carney has brokered a significant electricity deal between Newfoundland and Quebec that could reshape energy policy in the region. The agreement centers on hydroelectric power from massive dams, presenting Quebec voters with important decisions about their province's energy future.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiyAJBVV95cUxQZXRDem5lbEwyZlY1aXpoeTkwangyWWF5eG5MMFMyQWZLdGY3RlVYTGlBSzRRVjVUZTlOVmY0SUFQd0t2N2tuUmlnamFTSlowWWFUVFVRdHJYWDdHSEVuQ1UwXzZDOXo0WUdkWm5tTGplaDM4MDh4TzhXMEdCc053cEZ3Y29XZU1xbXByazUzUXdlSTI4WjNDS0pJNWUwbS1SampMbG1odmN0dnhvQUhSeUM1V1dVRkpDV1V6NlBvODRsT2xIY20tUXpQRFE4VW9IWmd6ZWlFTmhLQjlFd2c3QVlEa2tCV0RhVldtNXNEOHpqd2JQUTJJYUx0LTFfQUlJd3lMR1ZHTDF4ejNQQWxxaTZPUHl1OUVwMjEtaG92R3FHMFJPRXlnc0tUaU1IZl9JR0M4RVV0V1RMT2ZRdEdsTG1pa1I5akhL?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、カナダへの50%関税を延期 貿易協議を理由に", "title_en": "Trump Delays 50% Canada Tariffs, Cites Trade Deal Progress", "summary_ja": "ドナルド・トランプ大統領は、カナダからの輸入品に対する予定されていた50%の関税の実施を延期すると発表しました。米国とカナダ間の貿易交渉の進展を理由としています。この決定は、脅迫していた関税からの一時的な猶予を示唆しています。", "summary_en": "Donald Trump announced a delay to his planned 50% tariffs on Canadian imports, citing progress in trade negotiations. The move suggests ongoing discussions between the U.S. and Canada regarding trade terms. Trump's decision represents a temporary reprieve from the threatened tariffs.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMigAJBVV95cUxNMWJ0eURnOWd2S0JiUldVT25CWkRyVVFCcWZ3MHlDMmxKU09iYjRIekF6VVV0MTZabXFsWWVFa210Y1oyZG02bHdGeXNBQzlPZlFxc3JmdmtWRW9VVUNaODRrcWR1RFctNmFDdEdxWjFCUlczVlRDSFRoMk1iTWdvMmVxc0RVLTVFbWlQT2dmMWd4MkZrZHEyaVdNOHhzRkNlR24tSW9kQkI3eFpYeTBVelFITUFmeTllOVZQcjVQTUdTRG9sMjktQV9ZZTF3dmppS0VuRVhXLVVvNDJIOGlkSU9KaEFEYkstc2xpeUpQeXg1RXNCRGhSS3JlQlpkUTNG?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グルーポ・グロボ、創立100周年に向けた取り組みを準備", "title_en": "Grupo Globo Prepares Initiatives for Centennial Year", "summary_ja": "グルーポ・グロボは創立100周年を記念する特別な企画を計画している。メディア大手は企業史における重要なマイルストーンを祝うため、複数のプロジェクトを展開する予定である。", "summary_en": "Grupo Globo is planning special initiatives to celebrate its 100-year anniversary. The media conglomerate is developing projects to mark this significant milestone in its corporate history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2025年、ブラジルテニスの才能ジョアン・フォンセカに注目すべき理由", "title_en": "Why João Fonseca is Brazil's Tennis Star to Watch in 2025", "summary_ja": "ジョアン・フォンセカは2025年に向けてブラジルで最も有望なテニス選手として注目されています。若い選手はプロサーキットで大きな進歩を遂げると予想されており、世界中のテニスファンとアナリストから注目を集めています。", "summary_en": "João Fonseca has emerged as Brazil's most promising tennis talent heading into 2025. The young player is expected to make significant strides on the professional circuit, attracting attention from tennis fans and analysts worldwide.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE1MNWptTnpaTlFMQTc3WmpTYXdqMVluczNiTHhZQUotNnJoRWZydHZtdm1HdjJqOGVQXzFNT0t6cUZzODBVV3F0TmZDNTNCQVdrUmRQWDdtR1ZYLXMtMURzUnU5Y0RnS3U3eWc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オ・グロボ：歴史に誇りを持ち、未来へ目を向ける", "title_en": "O Globo: Proud of Our History, Looking to the Future", "summary_ja": "ブラジルの主要新聞社オ・グロボが、豊かな編集の歴史を振り返りながら、今後の方向性を示している。同紙は質の高いジャーナリズムへの取り組みとブラジルメディア界における役割の重要性を強調している。", "summary_en": "O Globo, a leading Brazilian newspaper, reflects on its rich editorial legacy while charting its course forward. The publication emphasizes its commitment to quality journalism and its role in shaping Brazilian media landscape.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "バシル・エル=ルファイの前妻が2024年の離婚とシングルマザーとしての人生を語る", "title_en": "Ex-wife of Bashir El-Rufai Opens Up on 2024 Divorce and Single Motherhood", "summary_ja": "バシル・エル=ルファイの前妻ハリマ・カザウレが、双子の息子たちが2歳の時に2024年に結婚が終わったことについて個人的なエッセイを発表した。Substackに掲載された彼女の文章では、結婚に対する生涯の懐疑心、損失を予測する苦闘、そして離婚後の恋愛経験について探求している。", "summary_en": "Halima Kazaure, former wife of Bashir El-Rufai, has published a personal essay reflecting on her marriage ending in 2024 when their twin sons were two years old. In her Substack piece, she explores her lifelong skepticism about marriage, her struggle with anticipating loss, and her experience falling in and out of love after the divorce.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/entertainment/naija-fashion/904114-my-marriage-ended-in-2024-bashir-el-rufais-ex-wife-opens-up-on-divorce-single-motherhood.html", "state_media": false, "category": "社会", "full_text": "Halima Kazaure, former wife of Bashir El-Rufai, son of ex-Kaduna State Governor Nasir El-Rufai, has opened up about the end of their marriage, revealing that the union ended in 2024 when their twin sons were two years old.\nPREMIUM TIMES earlier reported that her ex-husband said she made advances towards him and eventually proposed to him. He said he divorced Halima because he had no time to deal with “Gen Z problems”.\nIn a deeply personal essay titled “Memoirs of a Single Nigerian Twin Mum with ADHD”, published on her Substack on Wednesday, Ms Kazaure reflected on divorce, single motherhood, heartbreak and the emotional toll of appearing capable while struggling privately.\nThe lawyer said she had never placed much faith in marriage, attributing her scepticism to the relationships she witnessed growing up.\n“I became a single mother when my boys were two. My marriage ended in 2024. The truth is that I had never had much faith in marriage. I didn’t grow up surrounded by enough examples that convinced me men were particularly safe places to put your heart.\n“Somewhere inside me, I think I knew my marriage would end before it even began. Imagine entering a marriage already preparing for its funeral,” she wrote.\nFear\nShe went further, admitting that she entered the marriage with an underlying fear that it would eventually fail.\n“Somewhere inside me, I think I knew my marriage would end before it even began. Imagine entering a marriage already preparing for its funeral.”\nMs Kazaure’s new essay, however, does not dwell on the circumstances that caused their marriage to collapse or make allegations against her former husband. Instead, she uses the experience to reflect on her complicated relationship with love and her tendency to anticipate loss even when things are going well.\nShe described herself as someone who is constantly “waiting for the next shoe to drop”, including during happy periods.\nLove again\nAdditionally, she disclosed that after her marriage to Mr Bashir ended, she fell in and out of love.\nMs Kazaure described men as people who could stain someone’s white garment. She said she preferred to own her embarrassing experiences before anyone could use them against her.\n“Then my marriage actually ended. And somehow, several months later, I fell in love again. Of course I did. For someone with so little faith in men, I have a ridiculous amount of faith in love. I trusted again. Hoped again. Imagined again. And got my heart broken again.\n“There is a saying that men will stain your white. The irony is that I love wearing white. I spent almost an entire month wearing white to work. This is a terrible choice because I am clumsy and perpetually rushing. My friend at work asks me: “Why do you bother wearing white? Every time we eat, you stain yourself””, Ms Kazaure added.\nAccording to her, her twins are the only part of her life she has never grown tired of.\nShe noted that businesses have come and gone, hobbies have changed, and some friendships have suffered along the way.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "scepticism", "definition": "何かを信じることに対する不信感や疑い。この文脈では、結婚制度や男性への不信感を指します。"}, {"word": "underlying", "definition": "表面下にある、潜在的な。ここでは、結婚に入る際に隠れていた恐怖感を意味します。"}, {"word": "dwell", "definition": "何かのことを長く考え続ける、深く掘り下げる。この文章では、結婚破綻の詳細について深く言及することを意味します。"}, {"word": "irony", "definition": "期待と実際の結果が逆になる状況や矛盾。ここでは、男性不信でありながら愛情を信じることの矛盾を指します。"}, {"word": "perpetually", "definition": "常に、いつも、絶え間なく。この文脈では、著者がいつも急いでいる状態にあることを意味します。"}, {"word": "toll", "definition": "何かによって引き起こされるダメージや負担。ここでは、離婚や社会的期待による精神的影響を指します。"}]}, {"title_ja": "ナイジェリア、国際支援で干ばつと土地劣化に対抗", "title_en": "Nigeria Combats Drought and Land Degradation With International Support", "summary_ja": "ナイジェリアの砂漠化・土地劣化管理局は、農民と牧畜民の紛争や食糧不安を引き起こす劣化した土地の復元と干ばつ管理に取り組んでいる。同国は国連砂漠化対処条約に基づき土地劣化中立性の達成を約束し、持続可能な牧草地管理とエコシステム復元に注力している。", "summary_en": "Nigeria's Desertification and Land Degradation Management Department works to restore degraded lands and manage drought threats that fuel farmer-herder conflicts and food insecurity. The country commits to achieving land degradation neutrality under the UN Convention to Combat Desertification, focusing on sustainable rangeland management and ecosystem restoration.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/904112-interview-how-unccd-fao-world-bank-back-nigerias-fight-against-drought-land-degradation-official.html", "state_media": false, "category": "経済", "full_text": "In this interview, Etim William, Director of the Desertification, Land Degradation and Drought Management Department of the Federal Ministry of Environment, the factors contributing to the degradation of Nigeria’s rangelands and how desertification, land degradation and drought are worsening farmer-herder conflicts and threatening food security across major agricultural hubs in the country.\nExcerpt:\nPT: What does your department do?\nMr William: Going by the name of the department — Desertification, Land Degradation and Drought Management — our mandate is to combat desertification, address land degradation by restoring degraded lands, and manage drought. Those are the mandates of the department.\nPT: In commemoration of World Desertification and Drought Day, what does the ministry hope to achieve? What is the aim and objective of the event?\nMr William: Desertification, drought and land degradation are global menaces. There is hardly any country in the world that does not face land degradation. Desertification and drought also affect many countries. That is why the United Nations Convention to Combat Desertification (UNCCD), one of the Rio Conventions, was established to address desertification, land degradation, and drought.\nEvery year, the convention commemorates the fight against desertification and drought on June 17. The event seeks to raise public awareness of the impact of drought, land degradation, and desertification on humans, animals, and the environment. Life on land depends on the health of the land. From the land, we get food and natural resources. We have forests, vegetation, animals and genetic resources. So, if the land is degraded, you lose biodiversity and species, both flora and fauna. You lose ecosystems and genetic resources. Agricultural production will also decline because we do not farm in the air; we farm on land. That will inadvertently lead to food insecurity, hunger and poverty. It can also lead to migration because when land is degraded, people tend to leave their original communities in search of greener pastures. This creates competition for land resources, which can also result in conflicts, including farmer-herder conflicts.\nThis is because rangelands are no longer available in sufficient quantity; many have been degraded. Nobody seems to pay adequate attention to rangelands and their sustainable management. If the rangelands were available and sustainably managed, pastoralists would have less reason to take their herds through people’s farms.\nPT: Do we have rangelands in Nigeria?\nMr William: Yes, we have rangelands.\nPT: How many rangelands are there in Nigeria?\nMr William: I may not know the exact number. The Ministry of Livestock Development may have conducted an assessment of our rangelands, but I cannot tell you the exact number.\nPT: What are rangelands?\nMr William: They are basically grasslands and shrublands. We have grasslands throughout the savanna, including the Guinea and Sudan Savannas.\nPT: When you say some of these rangelands are degraded, what do you mean?\nMr William: They are overexploited. Sometimes people set them on fire. Most of them are being converted to croplands, and in the process of clearing the land, fire is used, which contributes to land degradation. Some are also converted to urban infrastructure and other uses.\nPT: Are there gazetted rangelands in Nigeria?\nMr William: I think we have a few gazetted ones, but I am not in a position to provide details, as we do not have a direct mandate to manage rangelands. That should be the responsibility of the Ministry of Livestock Development. Our interest is that they are degraded landscapes and degraded ecosystems under the purview of the United Nations Convention to Combat Desertification, and Nigeria is a party to that convention.\nPT: What is Nigeria’s commitment to the UNCCD as a signatory?\nMr William: Land degradation neutrality is one of our commitments. The convention focuses on restoring degraded lands, combating desertification and managing drought. All these issues — desertification, land degradation and drought — are closely connected to land. The UNCCD is the only convention that takes land as a critical factor in socioeconomic development. That is why degraded land needs to be restored.\nPT: Under the convention, do we have specific targets that Nigeria wants to achieve?\nMr William: Yes. We have a land degradation neutrality target.\nLand degradation neutrality is a programme designed by the UNCCD to address land degradation and achieve neutrality, as enshrined in Sustainable Development Goal 15.3.1. The target is to achieve land degradation neutrality.\nPT: What does land degradation neutrality mean?\nMr William: Land degradation neutrality is a state or condition where there is no net degradation of land. It is essentially about achieving zero net land degradation. This means maintaining land cover, land productivity and soil organic matter in a productive condition. There should be no net loss in ", "translation_ja": "", "vocab": [{"word": "desertification", "definition": "砂漠化、つまり湿潤地が砂漠へと変わるプロセス。過度な利用、干ばつ、気候変動により起こり、農業生産性の低下や生物多様性の喪失をもたらす。"}, {"word": "land degradation neutrality", "definition": "土地劣化中立性、つまり土地の純劣化がゼロの状態。土地被覆、生産性、土壌有機物を維持し、正味の土地喪失がないことを目指す。"}, {"word": "rangelands", "definition": "牧草地や灌木地などの放牧用土地。家畜飼養の基盤だが、過度利用や火災により劣化が進む。"}, {"word": "biodiversity", "definition": "生物多様性、つまり動植物や微生物など多様な生命形態が存在する状態。土地劣化により失われるリスクがある。"}, {"word": "sustainable management", "definition": "持続可能な管理、つまり将来世代のためにリソースを保全しながら現在の需要を満たす方法。牧草地管理では重要な概念。"}, {"word": "ecosystem", "definition": "生態系、つまり生物とその環境が相互作用する統合的なシステム。土地劣化により破壊される。"}, {"word": "mandate", "definition": "委任、つまり政府機関や組織に与えられた公式な責任や権限。当部門は砂漠化対処が主な委任事項である。"}]}, {"title_ja": "ナイジェリア電力規制委員会、アクワ・イボム州への電力市場監督権を移譲", "title_en": "NERC Transfers Electricity Market Oversight to Akwa Ibom Regulatory Commission", "summary_ja": "ナイジェリアの電力規制機関NEARCは、新たに設立されたアクワ・イボム州電力規制委員会（AKSERC）に対して同州の電力市場の規制監督権を移譲することを決定し、2026年8月18日から効力が生じます。AKSERCは州内の電気料金設定、消費者保護、紛争解決を担当し、NEARCは国家送電網と接続する越州取引と発電・送電事業に対する権限を保持します。ポートハルコート電力配給会社は州内の電力供給・配給を担当する子会社を設立する必要があります。", "summary_en": "Nigeria's electricity regulator NERC has transferred regulatory oversight of Akwa Ibom State's electricity market to the newly established Akwa Ibom State Electricity Regulatory Commission (AKSERC), effective August 18, 2026. AKSERC will control tariffs, consumer protection, and dispute resolution within the state, while NERC retains authority over cross-border and grid-connected transactions. The Port Harcourt Electricity Distribution Company must establish a subsidiary to handle intrastate electricity supply and distribution.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/904109-nerc-transfers-electricity-market-oversight-to-akwa-ibom-regulatory-commission.html", "state_media": false, "category": "経済", "full_text": "The Nigerian Electricity Regulatory Commission (NERC) has ordered the transfer of regulatory oversight of the electricity market in Akwa Ibom State to the Akwa Ibom State Electricity Regulatory Commission (AKSERC).\nThe transfer, contained in an order signed by NERC Chairman Musiliu Oseni and Commissioner for Legal, Licensing and Compliance, Dafe Akpeneye, takes effect from 18 August 2026.\nThe order is posted on the commission’s website and its official Facebook page.\nThe order, NERC/2026/087, directs the Port Harcourt Electricity Distribution Company (PHED) Plc to incorporate a subsidiary for electricity supply and distribution in Akwa Ibom.\nThe development follows the state government’s notification to NERC that it had fulfilled the legal requirements for assuming regulatory control of its intrastate electricity market under the Electricity Act 2023.\nAKSERC to control tariffs, consumer protection\nUnder the new arrangement, AKSERC will have exclusive responsibility for determining and adopting the end-user tariff methodology applicable within its regulatory jurisdiction.\nNERC said the final end-user tariffs approved by AKSERC will be the exclusive tariffs applicable in Akwa Ibom, while tariff policy support for end-use customers will remain the responsibility of the state government.\nAKSERC will also assume sole responsibility for customer complaint handling, dispute resolution and consumer protection within the state.\nHowever, NERC will retain regulatory authority over cross-border transactions involving the national grid and generation and transmission services connected to grid-connected plants.\n“The Commission exercises regulatory oversight of the Nigerian Electricity Supply Industry (“NESI”) as the apex sectoral regulator in accordance with powers conferred by the Electricity Act 2023 (“EA” or the “Act”),” the order states.\nThe commission said all transfers under the order must be completed by 17 February 2027.\nPHED ordered to create Akwa Ibom subsidiary\nNERC directed PHED to incorporate the new subsidiary, to be known as PHED SubCo, within 60 days of the order taking effect.\nThe subsidiary is expected to apply to AKSERC for a licence to undertake intrastate electricity supply and distribution.\nPHED must also identify the geographical boundaries of its distribution zone in Akwa Ibom and carve out its network in the state as a standalone network.\nThe company is required to install boundary meters at points where its network crosses from Akwa Ibom into neighbouring states.\nIt must also prepare an asset register of its electricity infrastructure in Akwa Ibom, evaluate contractual obligations and liabilities attributable to its operations in the state, identify energy offtake points and determine the employees required to operate the new subsidiary.\nNERC directed PHED to subsequently transfer the identified assets, liabilities, contractual obligations and employees to PHED SubCo.\nThe commission will also prepare a register of electricity licensees and other authorised operators in Akwa Ibom and notify those whose activities are limited to the state that regulatory oversight has moved to AKSERC.\nMove follows Eno’s electricity reform\nThe transfer is the latest step in Governor Umo Eno’s electricity reform programme, which began with the state’s electricity summit in September 2025.\nAt the summit, Mr Eno said electricity should not be treated as a luxury and described it as a fundamental enabler of development. He also said electricity access was central to his administration’s Arise Agenda, particularly its rural development objective, this newspaper reported.\nThe summit culminated into the development of a roadmap for establishing a sub-national electricity market aimed at improving supply, attracting investment and expanding access to underserved communities.\nThe state subsequently enacted the Akwa Ibom State Electricity Law 2025 and established AKSERC.\nIn June 2026, Mr Eno inaugurated the commission’s five-member pioneer board and gave it an 18-month mandate to overhaul the state’s electricity sector.\nHe described AKSERC as “the sole regulator of all electricity business conducted between buyers and sellers within Akwa Ibom State” and directed the commission to work with federal agencies and PHED towards establishing a dedicated state electricity distribution company.\nThe governor also said the state had incorporated Ibom Electricity Holding Limited as a vehicle for managing state electricity assets and investments and had begun regularising its shareholding interests in 4Power Consortium Limited and PHED as a precursor to establishing a dedicated state distribution subsidiary.\n‘Reforms beginning to yield results’\nAkwa Ibom Commissioner for Information, Aniekan Umanah, told PREMIUM TIMES on Wednesday that the transfer represented a major milestone in Governor Eno’s electricity reforms.\n“The achievement means a lot for the electricity reforms that Governor Eno championed. He started with the electricity su", "translation_ja": "", "vocab": [{"word": "regulatory oversight", "definition": "規制当局による監視・統制。ここでは、政府機関が特定産業の運営や規則遵守を監督する権限を指します。"}, {"word": "intrastate", "definition": "州内の、または特定の州の境界内で行われる。cross-border（州間）に対比され、1つの州内に限定された活動を意味します。"}, {"word": "tariff methodology", "definition": "電気料金やその他のサービス料金を決定する計算方式や手法。正当性と透明性を確保するための体系的なアプローチです。"}, {"word": "subsidiary", "definition": "親会社の支配下にある子会社。独立した法人であり、特定の事業活動を担当するために設立されます。"}, {"word": "contractual obligations", "definition": "契約に基づく法的義務。契約当事者が履行する必要がある責任や負債を指します。"}, {"word": "asset register", "definition": "企業が保有する資産（設備、機械、不動産など）の記録簿。資産の価値や状態を管理・追跡するために使用されます。"}, {"word": "apex regulator", "definition": "最高位の規制機関。特定業界全体を統括し、下級の規制機関に対する権限を持つ機関を指します。"}]}, {"title_ja": "トランプ大統領、イランへの経済的圧力を再び強化—選択肢に乏しい状況で", "title_en": "Trump Uses Economic Pressure Against Iran Despite History of Sanctions Resistance", "summary_ja": "トランプ政権はイランに対する経済制裁を主要な政策手段として追求しており、イランが数十年間の過去の制裁に耐えてきた歴史があるにもかかわらず、そうしている。アナリストは、経済的圧力の強化がイランの譲歩ではなく、むしろ緊張激化を招く可能性が高いと警告している。この戦略は、政権が利用できる外交的選択肢の限定性を反映している。", "summary_en": "The Trump administration is pursuing economic sanctions against Iran as a primary policy tool, despite Iran's demonstrated ability to withstand decades of previous sanctions. Analysts warn that increased economic pressure is more likely to provoke Iranian escalation rather than capitulation. The strategy reflects limited diplomatic alternatives available to the administration.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/19/world/europe/iran-trump-economic-sanctions-leverage.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ前国防相、ゼレンスキーとの決別を示し選挙実施を呼びかけ", "title_en": "Ukraine's Ex-Defense Minister Calls for Election, Breaking With Zelensky", "summary_ja": "先月解任された人気の若き指導者ミハイロ・フェドロフが、ウクライナの選挙実施を呼びかけている。同氏は、ロシアがウクライナ国民の次期指導者選出時期を決定することは許されないべきだと主張し、ゼレンスキー大統領との公的な対立を深めている。", "summary_en": "Mykhailo Fedorov, a popular young leader who was fired last month, is calling for elections in Ukraine. He argues that Russia should not be allowed to dictate when Ukrainians can choose their next government, deepening his public rift with President Zelensky.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/19/world/europe/ukraine-fedorov-zelensky-elections.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプとカナダのカーニー、関税交渉で進展も懸念残す", "title_en": "Trump and Canada's Carney Make Progress on Tariff Deal Amid Lingering Questions", "summary_ja": "期限延長後、米国の関税脅迫は水曜日の交渉で解決に向かっているように見えた。しかし、カナダが何を譲歩し、何と引き換えに得るのかについては多くの疑問が残っている。", "summary_en": "After extending a deadline, U.S. tariff threats appeared to be moving toward resolution on Wednesday in discussions between Trump administration officials and Canada's representatives. However, significant questions remained about what concessions Canada would need to make and what benefits it would receive in return.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/19/world/canada/trump-canada-tariffs-carney-deal-trade.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが検問所制限を解除、パレスチナ人がガザ北部への帰還開始", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "イスラエルはガザを分断する軍事地帯の通行を許可し、避難していたパレスチナ人の帰還が始まった。この決定は人質解放をめぐる交渉の膠着状態が打破されたことに続くもので、住民の移動制限が解除された。", "summary_en": "Israel has allowed displaced Palestinians to resume crossing a military zone that divides Gaza, following a breakthrough in negotiations over hostage releases. The decision ends a period of restricted movement and enables residents to return to the northern part of the enclave.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産企業が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Widening Real Estate Crisis", "summary_ja": "中国最大級の不動産開発企業バンケが巨額の赤字を報告し、全国的な不動産危機の深刻化への懸念が高まっています。経営難に陥った同社の経営状況により、中国政府がこの分野の安定化に介入するかどうかが問われています。", "summary_en": "Vanke, one of China's largest property developers, has reported significant losses, raising concerns about the deepening real estate crisis across the country. The troubled company's financial struggles prompt questions about whether the Chinese government will intervene to stabilize the sector.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃の破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From Oct. 7 Attack", "summary_ja": "イスラエルの医療当局によると、解放されたイスラエル人人質の体内には10月7日の攻撃による破片が残存していた。一部の女性人質は長期間にわたって単独で拘束され、8ヶ月間トンネルに閉じ込められていた。医学的調査結果は、被捕虜者が被った深刻な身体的外傷を明らかにしている。", "summary_en": "Released Israeli hostages retained shrapnel fragments in their bodies from the October 7 attack, according to Israeli medical officials. Some women hostages were held in isolation for extended periods and spent eight months confined in tunnels. The medical findings highlight the severe physical trauma endured by those held captive.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "西側がインターセプターミサイル不足に直面", "title_en": "The West faces a critical shortage of interceptor missiles", "summary_ja": "ウクライナをはじめとする同盟国からの急増する需要により、西側諸国は防空インターセプターミサイルの深刻な不足に直面している。生産能力の制約が供給を逼迫させており、ウクライナの防衛能力とNATO全体のセキュリティに懸念を生じさせている。この不足は重要な時期に防空システムを危険にさらす可能性がある。", "summary_en": "Western nations are experiencing a growing shortage of air defense interceptor missiles, raising serious concerns about Ukraine's defensive capabilities and broader NATO security. The supply constraints are becoming acute as demand from Ukraine and other allied nations strains production capacity. This shortage threatens to undermine air defense systems at a critical time.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-the-west-runs-out-of-interceptor-missiles", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エコノミスト、新しいパーソナライズニュースレターを開始", "title_en": "The Economist Launches Personalized Newsletter for Readers", "summary_ja": "エコノミスト誌は、購読者の受信箱に直接カスタマイズされた記事一覧を配信する新しいパーソナライズニュースレター「The Economist for You」を開始しました。このサービスは個々の読者の好みと関心に基づいてコンテンツをカスタマイズします。この取り組みは、読者がエコノミスト誌の豊富な記事をより効率的にナビゲートできるようにすることを目的としています。", "summary_en": "The Economist has introduced a new personalized newsletter called \"The Economist for You\" that delivers a customized reading list directly to subscribers' inboxes. The service tailors content based on individual reader preferences and interests. This initiative aims to help readers navigate The Economist's extensive coverage more efficiently.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/introducing-our-latest-newsletter-the-economist-for-you", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブーム、米国慈善事業を再構築", "title_en": "Silicon Valley's AI Boom Reshapes American Philanthropy", "summary_ja": "AI企業の創業者たちが数千億ドルの慈善寄付を約束し、米国の慈善活動に大きな変化をもたらしています。AI起業家からの急増する資金は慈善事業の優先順位を大きく変える可能性がありますが、これらの資金がどの程度効果的に使用されるか、どの分野が最も恩恵を受けるかについては疑問が残ります。", "summary_en": "Tech founders riding the AI wave are pledging hundreds of billions of dollars to charitable causes, signaling a major shift in philanthropic priorities. The influx of wealth from AI entrepreneurs could reshape American charity, though questions remain about how effectively these funds will be deployed and what causes will benefit most.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タリバンによる女性医療従事者養成の中止がアフガニスタン女性の健康危機を招く", "title_en": "Afghan Women's Health Crisis as Taliban Halts Female Medical Training", "summary_ja": "アフガニスタンのタリバン政権は、女性医師、看護師、助産婦の養成を中止し、女性の医療アクセスを著しく制限している。女性は男性付き添いの強制など医療治療への危険な障壁に直面しており、深刻な健康被害と精神衛生の悪化をもたらしている。この危機はタリバン政策がアフガニスタン女性の福祉に不釣り合いな害を与えていることを浮き彫りにしている。", "summary_en": "Afghanistan's Taliban regime has stopped training female doctors, nurses, and midwives, severely restricting women's access to healthcare. Women face dangerous barriers to medical treatment, including mandatory male supervision, leading to tragic health outcomes and deteriorating mental health. The crisis highlights how Taliban policies disproportionately harm Afghan women's wellbeing.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/summer-reads/article/2026/08/19/i-worked-day-and-night-to-become-a-doctor-i-was-so-close-afghan-women-s-health-is-put-at-risk-by-the-taliban_6756683_183.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス、記録的な猛暑で7,300人以上の超過死亡を記録", "title_en": "France records over 7,300 excess deaths during historically hot summer", "summary_ja": "フランス保健機関サンテ・パブリック・フランスは、相次ぐ3つの熱波により、今夏すでに7,300人以上の超過死亡が発生したと報告した。このデータは、フランス全土で経験された歴史的に高い気温の健康への重大な影響を浮き彫りにしている。この数字は、極端な熱波イベントがもたらす深刻な公衆衛生上のリスクを強調している。", "summary_en": "French health agency Santé Publique France has reported more than 7,300 excess deaths so far this summer, driven by three successive heatwaves. The data highlights the significant health impact of the historically high temperatures experienced across the country. The figure underscores the serious public health risks posed by extreme heat events.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/08/19/new-data-show-more-than-7-300-excess-deaths-in-france-s-historically-hot-summer-so-far_6756677_7.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス、大量児童虐待で有罪判決を受けた外科医に対する新たな調査を開始", "title_en": "France Opens New Investigation Into Surgeon Convicted of Mass Child Abuse", "summary_ja": "フランス検察当局は、元外科医ジョエル・ル・スクアルネック容疑者に対する約50件の追加的な性的暴力およびレイプ容疑の調査を進めている。ル・スクアルネック容疑者は昨年、数十年間にわたり299人の患者を虐待した罪で懲役20年の判決を受けた。新たな調査はフランス史上最も重大な医療虐待事件の範囲を拡大するものである。", "summary_en": "French prosecutors are investigating approximately 50 additional allegations of sexual assault and rape against former surgeon Joël Le Scouarnec. Le Scouarnec was sentenced to 20 years in prison last year for abusing 299 patients over several decades. The new investigation expands the scope of one of France's most serious medical abuse cases.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/08/19/france-launches-new-investigation-into-surgeon-convicted-of-mass-child-sex-abuse_6756684_7.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省", "title_en": "Mindef", "summary_ja": "提供されたテキストはニュースレターのヘッダー情報と管理詳細のみを含んでおり、防衛省に関する実質的なニュースコンテンツがないため、要約を生成できません。", "summary_en": "Unable to generate summary. The provided excerpt contains only newsletter header information and administrative details without substantive news content about the Ministry of Defence.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "夜間ニュース速報", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズの日々の夜間ニュース要約。読者は提供されたリンクを通じて追加の無料ニュースレターを購読し、購読を管理できます。", "summary_en": "The Straits Times delivers its daily evening news roundup. Readers can subscribe to additional free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズは、読者に主要なニュースと動向を知らせるために毎日朝のブリーフィングニュースレターを提供しています。購読者はニュースレターの設定を管理し、出版社からの追加の無料ニュースレターに登録できます。", "summary_en": "The Straits Times provides a daily morning briefing newsletter to keep readers informed on key news and developments. Subscribers can manage their newsletter preferences and sign up for additional free newsletters from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相の中東戦略計画", "title_en": "Netanyahu's Plan to Reshape the Middle East", "summary_ja": "ハアレツは、ネタニヤフ首相の中東地政学に対する戦略的ビジョンと地域再編成について検証している。この分析は、提案されている政策がイスラエルと近隣諸国との関係、および地域の安定性に及ぼす影響を探るものである。", "summary_en": "Haaretz examines Netanyahu's strategic vision for Middle Eastern geopolitics and regional realignment. The analysis explores the implications of proposed policies on Israel's relationships with neighboring countries and regional stability.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi8AFBVV95cUxOUHhQMG9fM3E3dGhPVkVidnlIRFA0aE1QblhDTW0xcWp6RWNYMkV3SlZtOFJBMGlUbUlUaFZuYzhrQzhzTzNON1FzZ2hKSEFFdHBIbzBQb0N5eWY0QS0ySDI2enRaeUw0ZkFWcVFOVzRvWXlPYTFoOFJLNzZnMzh0WTRPUUZjVWdNMlh2cGhvN2pVWUE5X2ZkSE1KdmRYR016bEp4ZnFGYlJhOWFYZXN1cEYtRHdCZk1sX1YtOWpLbWtPT05rUWFQUklydmdnSHZDSGdCQjhWalhVcW5JRTZYWTJOLXZDWkpYRnFybVpJc3M?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツのメルツ氏がベン=グヴィルを非難、同盟国は制裁が「長期延期されている」と主張", "title_en": "Germany's Merz Condemns Ben-Gvir as Allies Call for Overdue Sanctions", "summary_ja": "ドイツの政治家フリードリヒ・メルツがイスラエルの国家安全保障大臣イタマル・ベン=グヴィルを批判し、彼の政治同盟国は同大臣への制裁が長期延期されていると主張している。この非難は、ベン=グヴィルの物議を醸す政策と発言に対する国際的な懸念の高まりを反映している。", "summary_en": "German politician Friedrich Merz has criticized Israeli National Security Minister Itamar Ben-Gvir, with his political allies suggesting that sanctions against the minister are overdue. The condemnation reflects growing international concern over Ben-Gvir's controversial policies and statements.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijwJBVV95cUxQV3JLdDNCM2RfX3NBOFNUMi1ONU92ZTE1RC1YT0xWUFN5VjQyN2VyelpRdW83WWt6MF8wNlZ1akd6Z1RLazczNlNpNWtrbmtJcE5Xb0NJTVc2Rzd6TlhsUmlzZlJHbnZ2ZWpNSHdZM0wxczZvZzZqSTJWaFFDZExwNXBTcFplSlhoU1R2RzRsV1Y3ckpCUF96LWFFeHpodjRya0tlZEplMklpUFlzekVzRWlXZjN2cGhpcmNRWUNYcm5KYUJ5cUdEVTcxdmlfcXQ2cHBfUjhYUzd6UmRxY0QtMlU2S2l2enlZenlIUnZ5YktwaHBCX1FOYzhGWlBMZG1WZW9rR0szWENranRYRDY4?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルのシリア攻撃、トルコとの直接紛争のリスクあり＝イスラエル大使", "title_en": "Israel's Syria strike risked direct conflict with Turkey, envoy says", "summary_ja": "イスラエルの大使は、最近のシリアに対するイスラエル軍事攻撃がトルコとの直接紛争にエスカレートするリスクがあったと警告した。シリア領土内での攻撃は、トルコの軍事対応の可能性と地域的緊張を高めた。この事件は、イスラエル、シリア、トルコが関与する東地中海の複雑な地政学的状況を浮き彫りにしている。", "summary_en": "An Israeli envoy has warned that recent Israeli military strikes in Syria risked escalating into direct conflict with Turkey. The strikes, conducted in Syrian territory, raised concerns about potential Turkish military response and regional tensions. The incident highlights the complex geopolitical situation in the Eastern Mediterranean involving Israel, Syria, and Turkey.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxQeXQzSmNYdS1WWmRub0JoOXV2TzFLU3NreDJ1d2hzSXZ5dDN3d1RGeHRfQVZZS0JVcVRkYm5MdTN4YjgzVjFqX0llNWJ4UlJIN3NwMTNyNzlFNW1CdGxYdmJvWjl2Zl9URzN4YWpCeU9IQkJwRERxTkE4LVdES1VjbUlpQUFubUxQR1p5aTNQbXVrSERaLXV3RHRlMHJhSXU0MW5MZ1hGT3pyZVFWbVRWRS1paWhoT1B5Z3dTRmk4ai1DTl9fNkNEMlp0SFBpckl1bkcwd2JpR2FpNW9oYzFDeUttaF96Q2xvSmtkZ0FYUC1kYWhYN3pkdEpzMHBxamYwV1ZCTnFuaDNkajg?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、2027年度予算に1万台湾ドルの普遍的給付金を含める方針", "title_en": "Taiwan to Include NT$10,000 Universal Cash Handout in 2027 Budget", "summary_ja": "台湾の頼清徳大統領は、2027年度予算に全国民向けの1万台湾ドルの給付金を含める計画を発表した。この措置は政府の財政計画の一環として、国民への経済的支援を目的としている。", "summary_en": "Taiwan's President Lai announced plans to include a universal NT$10,000 cash handout for all citizens in the 2027 budget. The measure aims to provide economic support to the population as part of the government's fiscal planning.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE05XzRjUDdhQzJtSTNnVkJTdllxbHUxbkpHbXNIYUROOFJya08xcWRQdWVWcU9UTkd3bHVnYWR5ZjAxazZxYTdlUXlldFdIZkFPNTRmdHJkQQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国民党、頼総統の1万台湾ドル給付金で「二重基準」を非難", "title_en": "KMT Accuses Lai of 'Double Standard' Over NT$10,000 Cash Handout", "summary_ja": "国民党は1万台湾ドルの現金給付政策に関して頼総統が二重基準を適用していると批判している。野党は政府の財政支援プログラムへのアプローチが一貫性を欠いていると主張している。この紛争は、財政政策をめぐる与野党間の継続的な政治的緊張を浮き彫りにしている。", "summary_en": "The KMT has criticized President Lai for applying double standards regarding a NT$10,000 cash handout policy. The opposition party argues the government's approach to the financial assistance program is inconsistent. The dispute highlights ongoing political tensions between the ruling and opposition parties over fiscal policy.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE15X05tSHNKeU51ZWlSZjVkeFZiYzZ4S2FCaXVMVllrWVlUMkpuVEtTM0VnT1ZnMm0zeTExSE1PS0J1dElXVWZFa3Y4MjZ4V3BOWi1Rb0YyZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Focus Taiwan - CNA英語ニュース", "title_en": "Focus Taiwan - CNA English News", "summary_ja": "Focus Taiwanは台湾の公式通信社である中央通信社（CNA）の英語ニュースサービスです。台湾およびアジア太平洋地域全体のニュース、イベント、および動向に関する包括的な報道を提供しています。", "summary_en": "Focus Taiwan is the English news service of the Central News Agency (CNA), Taiwan's official news organization. It provides comprehensive coverage of news, events, and developments in Taiwan and the broader Asia-Pacific region.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiO0FVX3lxTE9aU2ljbTc1d0Y3alZIY005T0hWTmZOTGpod3pXQU9zbm4yYjhoOXAzdy1WNGlxemk1bVU0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "インドネシア南ニアス沖でM6.1の地震が発生", "title_en": "M6.1 earthquake strikes off South Nias, Indonesia", "summary_ja": "CGTNが報じたところによると、インドネシアの南ニアス沖でマグニチュード6.1の地震が発生しました。この地震は顕著な地殻変動活動で知られている地域で起きました。被害や津波警報の詳細については、初期報告では明記されていません。", "summary_en": "CGTN reports that a magnitude 6.1 earthquake has struck off the coast of South Nias, Indonesia. The seismic event occurred in a region known for significant tectonic activity. Details regarding any potential damage or tsunami warnings have not been specified in the initial report.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-18/news-1PHTgMNiUKY/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "韓国、DPRK・米国の対話の可能性は朝鮮半島の平和を促進する可能性があると述べる", "title_en": "ROK Says Potential DPRK-US Talks Could Boost Korean Peninsula Peace", "summary_ja": "CGTNは、韓国が北朝鮮とアメリカ間の潜在的な対話について楽観的見方を示していると報じています。国営メディアの報道によれば、このような会談は朝鮮半島の緊張緩和と平和努力の進展に貢献する可能性があるとのことです。", "summary_en": "CGTN reports that South Korea has expressed optimism about potential dialogue between North Korea and the United States. According to the state media report, such talks could contribute to reducing tensions and advancing peace efforts on the Korean Peninsula.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-18/ROK-says-potential-DPRK-US-talks-to-boost-peace-on-Korean-Peninsula-1PIlSnWWGic/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン、ホルムズ海峡からの米軍追放を主張", "title_en": "Iran Claims US Forces Expelled from Strait of Hormuz", "summary_ja": "CGTNによると、イラン軍最高司令官アミール・ハタミ氏は日曜日、米軍がペルシャ湾、オマーン湾、ホルムズ海峡から追放されたと述べた。CGTNが伝えるところによれば、ハタミ氏は米軍がこれらの戦略的に重要な水域への復帰を禁止されていると主張している。", "summary_en": "CGTN reports that Iran's Chief Commander of the Army Amir Hatami stated on Sunday that US forces have been expelled from the Persian Gulf, Gulf of Oman, and the Strait of Hormuz. According to CGTN, Hatami claimed that US forces are prohibited from returning to these strategically important waterways.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-16/news-1PF0yw2QU8M/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相、シリアでのトルコ軍駐留は容認しないと警告", "title_en": "Netanyahu warns Israel won't tolerate Turkish military presence in Syria", "summary_ja": "TASSが報じたところによると、イスラエルのベンヤミン・ネタニヤフ首相は、シリアでのトルコ軍の駐留をイスラエルが受け入れないと述べ、この問題に関する以前の警告が十分に聞き入れられなかったと主張している。ネタニヤフ首相の発言は、地域の軍事作戦と中東におけるシリアへの影響力をめぐるイスラエルとトルコ間の緊張の激化を示唆している。", "summary_en": "TASS reports that Israeli Prime Minister Benjamin Netanyahu stated Israel will not accept Turkey's military presence in Syria, claiming previous warnings on the matter were not sufficiently heeded. Netanyahu's comments suggest escalating tensions between Israel and Turkey over regional military operations and influence in Syria.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2175347", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン中央銀行総裁が石油輸出の事実上の停止を報告", "title_en": "Iran's Central Bank Governor Reports Virtual Halt to Oil Exports", "summary_ja": "TASSが報じたところによると、イラン中央銀行総裁アブドルナセル・ヘンマティ氏は、同国が対外市場への石油輸出を事実上停止していると述べた。報道によれば、ヘンマティ氏は輸出削減にもかかわらずイランは十分な外貨準備を保有していると示唆している。", "summary_en": "TASS reports that Iran's central bank governor Abdolnaser Hemmati stated the country has virtually halted oil exports to foreign markets. According to the report, Hemmati indicated that Iran maintains sufficient foreign exchange reserves despite the export reduction.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2175345", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、パイプラインはホルムズ海峡の重要性を低下させる可能性があると述べる", "title_en": "Trump says pipelines can reduce Hormuz Strait's importance", "summary_ja": "TASSが報じたところによると、トランプ米大統領はパイプラインインフラの拡張がホルムズ海峡の戦略的重要性を低下させる可能性があると述べた。同大統領は現在、記録的な数のパイプラインが建設されていると指摘し、この動向がグローバルなエネルギー輸送ルートを変える可能性があると示唆した。", "summary_en": "TASS reports that US President Trump stated that expanding pipeline infrastructure could diminish the strategic importance of the Hormuz Strait. Trump noted that record numbers of pipelines are currently being constructed, suggesting this development could alter global energy transportation routes.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2175343", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIが人類の進路を変える3つの方法", "title_en": "Three Ways AI Will Change the Course of Humanity", "summary_ja": "著者は、AI の影響は生産性と雇用喪失を超えて、病気対策、戦争、経済成長の3つの主要分野を通じて人類の存在そのものを根本的に再構成すると主張しています。コストを削減し、様々な部門で生産性を向上させることで、AI は歴史を通じて最大の変革を促してきた3つの力にどのように取り組むかを革新します。", "summary_en": "The author argues that AI's impact extends far beyond productivity and job displacement to fundamentally reshape human existence through three major areas: disease prevention, warfare, and economic growth. By reducing costs and increasing productivity across sectors, AI will revolutionize how humanity addresses these three forces that have historically driven the greatest transformations throughout history.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-will-redefine-disease-management-warfare-and-economic-prosperity-by-dambisa-moyo-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Three Ways AI Will Change the Course of Humanity\nThe AI debate has largely focused on productivity gains and job displacement, but its consequences will reach much further By revolutionizing how we combat disease, wage wars, and stimulate income growth, AI could fundamentally alter the terms of human existence.\nLONDON—Over the long sweep of history, three forces have driven humanity’s greatest transformations, for good and ill: disease, war, and economic growth. By reducing costs and increasing the availability and productivity of a vast array of goods and services, AI will have a profound impact on all three.", "translation_ja": "", "vocab": [{"word": "consequences", "definition": "結果や影響のこと。特に重要な事柄から生じる結果や帰結を指します。"}, {"word": "fundamentally", "definition": "根本的に、本質的にという意味の副詞。物事の基本的な性質や根拠に関わる変化を表します。"}, {"word": "profound", "definition": "深刻な、深い影響力を持つという形容詞。表面的ではなく、深い意味や大きな影響を示唆します。"}, {"word": "transformations", "definition": "大規模な変化や変革のこと。構造や性質が根本的に変わることを意味します。"}, {"word": "sweep", "definition": "広がり、範囲を指す名詞。\"long sweep of history\"で歴史全体の流れを意味します。"}]}, {"title_ja": "世界経済の収斂が停滞している", "title_en": "Global Economic Convergence Is Stalling", "summary_ja": "著者は、新興経済と先進国間の急速な経済収斂が2016年以降停滞していると主張している。これは先進国が改善したのではなく、すべての経済がパフォーマンスを低下させたためである。2008年の金融危機、ブレグジット、米中対立などの世界的なショックが、新興国と先進国の両方の軌道を根本的に変えた。", "summary_en": "The author argues that the rapid economic convergence between emerging markets and advanced economies has stalled since 2016, not because developed nations improved, but because all economies have underperformed. Global shocks including the 2008 financial crisis, Brexit, and US-China tensions have fundamentally altered the trajectory of both emerging and advanced economies.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/imf-world-economic-outlook-shows-changing-convergence-patterns-among-major-economies-by-keun-lee-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Global Economic Convergence Is Stalling\nFor a while, the world’s advanced economies (other than the US) were rapidly losing ground to their emerging counterparts. But the BRICS' catch-up momentum has stalled since 2016, not because the G7 has been doing better, but because everyone has been doing worse.\nSEOUL—The global economy has undergone a dramatic transformation over the past two decades, driven not least by the 2008 global financial crisis, the United Kingdom’s 2016 vote to leave the European Union, and the escalating rivalry between the United States and China. The International Monetary Fund’s latest World Economic Outlook, published this past April, shows how such shocks have affected the fortunes of emerging and advanced economies.", "translation_ja": "", "vocab": [{"word": "convergence", "definition": "異なる状態や価値が同じ点に向かって近づくこと。経済学では、発展段階の異なる国々の経済格差が縮小する現象を指す。"}, {"word": "emerging markets", "definition": "急速な経済成長と工業化を経験している発展途上国の市場。新興国市場とも呼ばれ、投資機会が豊富な反面、リスクも高い。"}, {"word": "momentum", "definition": "勢い、推進力。経済用語では、継続する成長や発展の傾向を指す。"}, {"word": "stall", "definition": "停止する、停滞する。進展や成長が中断される状態を表す。"}, {"word": "escalating rivalry", "definition": "段階的に高まる対立や競争関係。国家間や企業間の競争が激化する様子を描写する。"}]}, {"title_ja": "大型エネルギープロジェクトが失敗に終わるとき", "title_en": "When a Big Energy Project Turns Bad", "summary_ja": "中央アジアの電力送電プロジェクト「CASA-1000」は数億ドルの投資にもかかわらず事実上失敗に終わった。急速な経済成長と国内エネルギー需要の急増により、地域の電力余剰輸出という基本的な経済前提が崩壊したためである。著者は国際金融機関に説明責任を求め、中央アジア諸国は電力輸出ではなく原子力発電に注力すべきだと主張している。", "summary_en": "The CASA-1000 electricity transmission project in Central Asia has effectively failed despite hundreds of millions in investment, as the fundamental economic premise—regional electricity surpluses for export—has collapsed due to rapid economic growth and rising domestic energy demand. Author Djoomart Otorbaev argues that international financial institutions that conceived and financed the project must be held accountable, and that Central Asian countries now face energy deficits and should focus on nuclear power rather than exporting electricity.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/institutions-that-promoted-casa-1000-must-take-responsibility-for-collapse-of-economic-logic-by-djoomart-otorbaev-2026-08", "state_media": false, "category": "オピニオン", "full_text": "When a Big Energy Project Turns Bad\nDjoomart Otorbaev\nAfter hundreds of millions of dollars were invested by developing-country governments, and before a single watt of energy was transferred, the CASA-1000 infrastructure project in Central Asia has effectively failed. The international institutions that conceived, financed, and promoted the project must answer for this.\nBISHKEK—For a major infrastructure project to succeed, it must be underpinned by sustained political support and sound economics. When political and strategic considerations are allowed to dominate decision-making, and long-term economic assessments suffer as a result, projects can fail before they start. This appears to have been the case with the Central Asia-South Asia Electricity Transmission and Trade Project (CASA-1000).\nFunded jointly by the European Bank for Reconstruction and Development, the Islamic Development Bank (IDB), the World Bank, and others, CASA-1000 was introduced in 2006 as a means of transmitting surplus hydropower from Kyrgyzstan and Tajikistan to alleviate energy shortages in Afghanistan and Pakistan. Construction on the 1,387-kilometer (862-mile), 1,300-megawatt energy-transmission infrastructure began a decade later.\nWhile CASA-1000 was presented as an energy-trade project, it served a wider strategic objective. Beyond fostering inter-regional cooperation between Central Asia and South Asia, it became a pillar of the United States’ short-lived “New Silk Road” strategy, announced by then-Secretary of State Hillary Clinton in 2011. By strengthening North-South economic integration and reducing Central Asian countries’ dependence on Russian electricity connections, the project was supposed to shift the region’s geopolitical orientation.\nDespite this grand vision, CASA-1000 has run into repeated delays. Initially scheduled to begin operating in 2020, completion is now expected no earlier than 2027. In the meantime, Kyrgyzstan has invested some $216 million in the project, with financing largely coming through concessional loans from the European Investment Bank, the IDB, and the World Bank. Tajikistan’s costs have surpassed $250 million. Both countries will be servicing these loans for many years to come.\nYet the economic assumption underlying this investment—that Central Asia would possess long-term structural electricity surpluses to export—has already collapsed. Over the last two decades, Central Asia has become one of the world’s fastest-growing regions economically. As industrial production has expanded, urbanization has accelerated, incomes have risen, and digital infrastructure has proliferated, electricity consumption has surged.\nDomestic consumers have now absorbed the electricity surplus of 2006—and then some. In fact, Central Asia faces an energy deficit of some 10–15 billion kWh per year. With regional governments expecting electricity demand to rise by another 40% by 2030, these countries will need to ramp up domestic electricity generation just to meet their own needs.\nPS Deep Dive: Oligarchy\nA collection of PS commentaries examining how a few individuals amassed unprecedented wealth—and how they are using it to dismantle democracy. Featuring insights from Cristina Enache, Brooke Harrington, James Livingston, Michael Madowitz, Ann Pettifor, Matt Simonton, and Quinn Slobodian.\nSubscribe and save 30%\nThis is not lost on Central Asian governments, which are already moving to introduce nuclear power into their national energy systems. Following a nationwide referendum, Kazakhstan has begun work on its first commercial nuclear power station. Uzbekistan has likewise begun building its first nuclear plant, including two 1,000-MW reactors and two small modular reactors, which together are expected to meet approximately 15% of national electricity demand. Kyrgyzstan has incorporated nuclear generation into its medium-term energy strategy.\nEven under optimistic scenarios, however, it will take years for these nuclear-power projects to bear fruit. The specter of domestic electricity shortages thus looms large. Against this backdrop, the last thing Central Asian countries need is to pour yet more money into infrastructure whose only purpose is to export the energy they generate.\nIn fact, Kyrgyzstan recently proposed using the CASA-1000 system in reverse, importing electricity from Pakistan during winter months. But this is no solution. Pakistan relies significantly on thermal electricity generation, powered by imported natural gas, liquefied natural gas (LNG), and petroleum products. Generation costs regularly reach 8–10 US cents per kilowatt-hour—far higher than the costs of power generation in Central Asia. Without massive subsidies, importing electricity from Pakistan to Central Asia is economically unworkable.\nAfter hundreds of millions of dollars in investment by developing-country governments, and before a single watt of energy was transferred, CASA-1000 has effectively failed. The international financial inst", "translation_ja": "", "vocab": [{"word": "concessional loans", "definition": "開発途上国向けの優遇条件付き融資のことで、市場金利より低い金利や長い返済期間が特徴。国際開発銀行や先進国が提供することが多い。"}, {"word": "structural surplus", "definition": "一時的ではなく、経済の根本的な特性に基づいて生じる継続的な余剰。この文脈では、長期的に期待された電力余剰を指す。"}, {"word": "geopolitical orientation", "definition": "国や地域が国際政治における立場や同盟、影響力の方向性。ここでは、ロシアへの依存を減らしアメリカ寄りに傾くことを意味する。"}, {"word": "pillar", "definition": "戦略や政策の基本的な支柱や要素。重要な基盤となる部分を指す比喩表現。"}, {"word": "modular reactors", "definition": "小型で建設可能性が高い次世代原子炉で、必要に応じて複数設置できる特徴がある。大規模施設が難しい地域での導入に適している。"}, {"word": "specter", "definition": "将来起こりうる悪い事態や脅威を幽霊のように形容する文学的表現。ここでは電力不足という懸念を指す。"}]}, {"title_ja": "国際援助がなぜ重要なのか：コンゴ民主共和国のエボラ危機から学ぶ教訓", "title_en": "Why International Aid Matters: Lessons from the DRC's Ebola Crisis", "summary_ja": "本社説は、コンゴ民主共和国で発生したエボラ出血熱の大惨事が、西側諸国による国際援助削減と直結していると主張しています。著者は、トランプ政権によるUSAID廃止とWHOからの米国撤退、およびヨーロッパ諸国による援助削減が、コンゴの保健インフラと監視体制を著しく弱体化させ、現在の危機に対応する能力を失わせたと指摘しています。", "summary_en": "The Guardian editorial argues that the catastrophic Ebola outbreak in the Democratic Republic of Congo, which has already surpassed the 2014-16 West African epidemic in deaths, is directly linked to Western cuts in international aid. The author contends that the Trump administration's dismantling of USAID and US withdrawal from the WHO, combined with reduced aid commitments from European nations, have severely weakened the DRC's health infrastructure and surveillance capacity, leaving the country defenseless against the crisis.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/19/the-guardian-view-on-the-ebola-outbreak-in-the-drc-a-case-study-in-why-international-aid-matters", "state_media": false, "category": "オピニオン", "full_text": "For months health experts have warned that the scale of the Ebola outbreak in the Democratic Republic of the Congo (DRC) could surpass the one that swept west Africa in 2014-16. This week, the authorities in the DRC announced that a grim milestone has already been passed: at least 2,325 people have died from the virus, making it the deadliest of the country’s 17 outbreaks and the fastest-growing in history.\nThere is no effective vaccine against Bundibugyo – a rare strain of the virus that spread fatally undetected during the spring, often being misdiagnosed as malaria or typhoid. In contrast to neighbouring Uganda, which succeeded in eliminating an outbreak, multiple factors are combining to let the disease rip through the DRC. The worst-affected region is contested by armed groups, and a context of population displacement and chronic insecurity has made monitoring and surveillance more difficult. Ebola treatment centres have been attacked as a result of misinformation and community distrust.\nThe impact of this dire set of circumstances has been disastrously compounded by choices made in the west and, above all, in the United States. International aid cuts have deprived the DRC of vital human and material resources with which to fight back. In 2014, as the scale of the Ebola crisis in Liberia, Sierra Leone and Guinea became clear, Barack Obama addressed the United Nations general assembly and mobilised a global response that was crucial in containing the outbreak. The US Agency for International Development (USAID) led efforts to train local health workers, pursue contact tracing and implement an eventual vaccination programme.\nThe contrast with the Trump administration is stark and shaming. Last year, as the de facto head of the now defunct “department of government efficiency”, Elon Musk was given licence to implement swingeing cuts that led to the eventual dismantling of USAID. In the DRC, the direct consequence was the weakening of local health infrastructure and surveillance capacities, leaving one of the poorest countries in the world still more vulnerable. Also lost was a wealth of institutional experience and expertise gained in combating emergencies such as the one now unfolding.\nThe US has further undermined the capacity for coordinated international action by withdrawing from the World Health Organization, to which it had been one of the biggest donors. European countries, notably Britain, Germany and France, have also been viewing international aid as luxury expenditure and cutting back. Last year, Sir Keir Starmer announced that from 2027 UK aid would be reduced from 0.5% of GDP to 0.3%.\nAgainst such a backdrop, the lack of diplomatic urgency over the current crisis, compared with 2014, should not perhaps come as a surprise. But that does not make it any less disappointing. The Ebola outbreak in west Africa laid bare the risk of regional and global disruption as a result of inadequate health infrastructure. A thousand pieties were then uttered in the wake of the Covid pandemic regarding the need to invest in global health security and future preparedness.\nSubsequent actions by governments have belied those words, leaving the DRC exposed to an epidemic that is threatening to spiral out of control. Belatedly, the global community needs to mobilise to address the threat. More fundamentally, it needs to draw the right lessons from a case study in why international aid matters.\nDo you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": [{"word": "grim milestone", "definition": "不吉な節目、あるいは悲劇的な到達点を意味する表現です。ここでは死亡者数が過去最多となった状況を指しています。"}, {"word": "compounded", "definition": "悪い状況がさらに悪くなることを意味します。複数の負の要因が組み合わさって、問題が増幅される状態を表現します。"}, {"word": "surveillance", "definition": "病気の発生状況や感染者の追跡など、公衆衛生上の監視活動を意味する専門用語です。"}, {"word": "institutional experience", "definition": "組織や機関が長年にわたって蓄積した知識や経験を指します。ここでは過去の危機対応で得られた専門知識を意味します。"}, {"word": "belied", "definition": "言葉や約束が実際の行動と矛盾していることを意味する動詞です。政府の言葉が行動と相反する状況を表現します。"}, {"word": "pieties", "definition": "宗教的または道徳的な建前や美辞麗句を指します。ここでは危機後の空虚な約束や言葉を意味しています。"}]}, {"title_ja": "サリヴァン論評：トランプ大統領が制約なく私腹を肥やす", "title_en": "Trump Enriches Himself Without Restraint as President, Sullivan Argues", "summary_ja": "マーガレット・サリヴァンは、トランプが2025年に22億ドルの収益を得ており、さまざまな利益相反行為があると批判し、この行動は米国史上最も露骨な腐敗した政権であると主張している。法的境界線は不明確なままで、議会が監督を提供していないため、トランプは事業を続けることができている。", "summary_en": "Margaret Sullivan criticizes Trump's $2.2 billion in 2025 revenues and various enrichment schemes, arguing his behavior represents the most openly corrupt administration in U.S. history. Despite widespread public disapproval and ethical concerns, legal boundaries remain unclear while Congress provides no oversight, allowing Trump to continue his ventures unimpeded.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/19/trump-money-democrats-midterms", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump is essentially unrestrained when it comes to enriching himself during his second term, with no sign of stopping. If anything, he’s ramping things up.\nThe numbers so far are astonishing. He amassed $2.2bn in 2025 revenues, the Guardian and other news outlets have reported.\nAnd despite widespread criticism of this astonishing fact, very little is standing in the way of his reaping even more.\n“The Congress has decided not to commit oversight to this topic, and that’s just the fact of the matter at this point,” Eric Lipton, an investigative reporter for the New York Times, told National Public Radio recently.\nWhile his actions appall historians, academics and millions of ordinary Americans, they may be within legal boundaries.\nMoral or ethical boundaries? Not so much.\n“While Trump’s second term is less than half over, it already looks like the most openly corrupt administration in our history,” Larry Noble, a law professor and former general counsel at the Federal Election Commission, told the Guardian’s Peter Stone.\nDespite his loyal base of followers, much of the American public isn’t happy about it. Two-thirds of Americans polled by CNN said that this president doesn’t put the good of the United States over his personal gain.\nHis overall approval ratings have tanked to 33% – the lowest level of his presidency – with a disapproval rating at 64%, according to a new Reuters/Ipsos poll.\nStartling as the details of his enrichment may be, his mindset – full speed ahead, don’t bother me with past practices – reflects his behavior in other realms. He glories in knowing no restraints or boundaries, and shrugs off criticism.\nHis power is held back only by his “own morality”, he told the New York Times in January. “It’s the only thing that can stop me.”\nHe was speaking specifically about being restrained on the international stage – his freedom to use any military, economic or political power for what he sees as American supremacy.\nBut it’s a mentality he apparently brings into feathering his and his family’s own nest. As Lipton told NPR, queries about apparent conflicts of interest are brushed off, and the party line is that the Trump family’s extracurricular businesses are building the US economy.\nIn earlier presidencies, his actions surely would have political consequences, perhaps impeachment. (He was impeached twice, but not convicted, first in 2019 for abuse of power and obstruction of Congress, then for incitement of the violent insurrection at the US Capitol on 6 January 2021.)\nTrump has amassed at least $1.4bn last year from his cryptocurrency ventures alone, the Guardian reported, noting that others fared less well; about a million investors in one of his crypto projects suffered nearly $4bn in losses as the value of their holdings cratered.\nThen there are the wealthy foreigners who have invested in the Trump family’s hotel and golf-resort projects, creating potential conflicts of interest.\nHis media company, Truth Social, has been another major source of wealth. Now there’s a new plan to offer early access to his posts for a fee of $100,000. Those posts, of course, have the power to move markets. It’s come under heavy criticism – and prompted lawsuits from media organizations and advocacy groups such as the Freedom of the Press Foundation that argue it’s unconstitutional.\nBut, to date, as with so much of what Trump does, it’s proceeding brazenly.\nEvery once in a while, the courts step in to provide some restraints.\nTrump tried to use his already weaponized federal justice department to settle his $10bn lawsuit against the Internal Revenue Service. The initial result was to provide him and his family immunity from earlier audits of their tax returns, which might save the Trumps about $100m. But in a rare bit of accountability, a federal judge – one appointed by Barack Obama – nullified major parts of the agreement. The legal status is still being contested, and the stakes are high.\nAll of this has the power to shock those paying attention to news reports. But there, too, Trump has given himself a form of protection by constantly playing on citizens’ mistrust of legacy media and to brand such investigations as “fake news”.\nThe result, as author and journalist Craig Unger put it recently on Substack, is that nothing “moves the needle”. Not that long ago, he wrote, the press could “root out corruption, topple presidents, and end wars”. But now, even the biggest scoops and the most dramatic revelations seem to have little impact, Unger argues; that’s because the national citizenry doesn’t share an agreed-upon set of facts as it used to do.\nTrump’s low approval ratings do seem to tell a different story, however, and voters will get a chance to make their voices heard soon. At the very least, some restraint on Trump’s excesses might be accomplished if November’s midterm elections give Democrats more power with a majority in one or both chambers of Congress.\nMany forecasters think the Democrats may well", "translation_ja": "", "vocab": [{"word": "feathering one's nest", "definition": "自分や家族のために不正な手段で金銭を得ること。私腹を肥やすという慣用句で、倫理的に問題のある利益獲得を指す。"}, {"word": "brazen", "definition": "厚かましい、堂々とした、恥知らずなという意味。ここでは、批判や反対があるにもかかわらず堂々と行動を続けることを表している。"}, {"word": "incitement", "definition": "扇動、煽動という意味。ここでは、2021年1月6日の連邦議事堂襲撃事件に対する責任を指す。"}, {"word": "conflicts of interest", "definition": "利益相反。公職者が公的職務と私的利益の間で相反する利益を持つ状況。"}, {"word": "nullified", "definition": "無効にする、取り消すという意味。裁判官が合意の主要部分を無効にしたことを表している。"}, {"word": "weaponized", "definition": "兵器化する、政治的目的のために悪用するという意味。ここでは司法制度を不正に使用することを指す。"}]}, {"title_ja": "保守派の言葉を採用して2020年の社会正義運動を軽視するリベラル派", "title_en": "Liberals Embracing Conservative Language to Dismiss 2020 Social Justice Movements", "summary_ja": "著者は、アレクサンドリア・オカシオ・コルテスなどの進歩的民主党員が、2020年の人種正義運動、特に『警察予算削減』の取り組みから距離を置くために、保守派の用語『Woke 1』を採用していると主張している。黒人解放運動を嘲笑するために右翼の言葉遣いを採用することは、政治的進化ではなく退化であり、特に保守派が多様性措置を廃止し、黒人の歴史を消し去ろうとしている中での行動である。", "summary_en": "The author argues that progressive Democrats like Alexandria Ocasio-Cortez are adopting the conservative term 'Woke 1' to distance themselves from 2020's racial justice movements, particularly 'defund the police' efforts. This adoption of rightwing rhetoric to mock Black liberation movements is not political evolution but regression, especially as conservatives actively roll back diversity measures and erase Black history.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/19/woke-1-aoc-rightwing", "state_media": false, "category": "オピニオン", "full_text": "August has brought us a referendum on “Woke 1” – a term that
