stating that Israel's internal inquiries cannot be regarded as credible mechanisms of accountability.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crl7yjlpx2po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Israel confirms soldiers fired at car in which Hind Rajab was killed and opens criminal investigation\n- Published\nThe Israeli military has confirmed for the first time that it opened fire on a car carrying five-year-old Palestinian girl Hind Rajab, who was killed along with six relatives in Gaza in 2024.\nRajab initially survived the attack and answered a telephone call during which she pleaded for help. The call lasted hours.\nAn ambulance sent to reach her – in a move co-ordinated with the Israeli army - was then shelled, killing two paramedics. Hind's body was recovered days later, along with the others killed.\nIn a statement, the Israel Defense Forces (IDF) said that it would open a criminal investigation into Hind, her family and the paramedics' killings, as well as the killing of 15 Palestinians, including medics and a UN worker, in March 2025.\n- 'Will you come and get me?' Gaza girl's desperate plea before losing contact \n  - Published5 February 2024\n- Families' agonising search for answers as thousands still missing in Gaza \n  - Published16 hours ago\n- Film about Gaza child's killing gets record ovation at Venice \n  - Published4 September 2025\nBoth incidents drew international condemnation.\nThe IDF said of the killing of Hind: \"Due to alleged failures in the co-ordination of the movement of the Palestine Red Crescent ambulance, it has been decided to initiate a criminal investigation of the incident by Military Police Criminal Investigation Division.\"\nIt added that the findings of its examination \"indicate that IDF troops fired at a vehicle\" that was \"travelling contrary to the advanced notice that had been published in an announcement by the IDF Spokesperson to residents of the area\".\nThe IDF initially stated that none of its troops were in the area at the time of Hind's killing. However, that suggestion was soon questioned.\nThe IDF later said it had \"conducted raids on terror targets\" with forces operating in neighbourhoods in Gaza City, including Tel al-Hawa, where Hind was located.\nHind's killing was internationally condemned after a desperate recording of her speaking to paramedics of the Palestinian Red Crescent Society (PRCS) was broadcast around the world.\nThe sound of Hind's fragile voice on the other of the line that day haunted the Red Crescent operators long after her death, as she described seeing tanks directly in front of the car, moving towards her.\n\"Hide under the seats,\" the operators told her. \"Don't let anyone see you.\"\nOperator Rana Faqih stayed on the line with Hind for hours, as the Red Crescent team appealed to the Israeli army to allow their ambulance to access the location.\nFaqih said the child appealed to her over and over again for someone to come and rescue her.\n\"At one point, she told me it was getting dark,\" Rana told the BBC in February 2024. \"She was scared. She asked me how far away my house was. I felt paralysed and helpless.\"\nThree hours after the call began, an ambulance was finally cleared to approach the area, and was despatched to rescue Hind.\nIt was after dark when the crew - Yusuf al-Zeino and Ahmed al-Madhoun - notified operators that they were nearing the location, and were about to be checked for entry by Israeli forces.\nIt was the last operators heard from them – or from Hind.\nAfter that, the line to both paramedics, and to the girl they came to rescue, disconnected for good.\nThe PRCS later confirmed that both Yusuf al-Zeino and Ahmed al-Madhoun were killed when the ambulance was bombed by Israeli forces.\n\"The [Israeli] occupation deliberately targeted the Red Crescent crew despite obtaining prior coordination to allow the ambulance to arrive at the scene to rescue the child Hind,\" the organisation said in a statement.\nThe story was made into an Oscar-nominated film called The Voice of Hind Rajab.\nThe UN cited her case in a commission of inquiry, accusing Israel of war crimes, which it denies.\nFollowing the Israeli army's announcement, the Hind Rajab Foundation, which is based in Brussels and seeks to address alleged Israeli violations in Gaza, said it had \"no confidence\" in the investigation.\n\"These reported investigations, even if they do occur, should not be mistaken for a genuine step toward justice,\" it said in a statement.\nIt added that Israel's internal investigations were \"fundamentally flawed and cannot be regarded as credible mechanisms of accountability\".\nThe IDF's statement on Wednesday said: \"For more than a thousand days, the IDF has been conducting intensive combat across numerous fronts, carrying out a wide range of military missions in an exceptionally complex operational reality.\n\"As part of the IDF's obligations under international law and Israeli domestic law, the IDF examines exceptional incidents that occurred during combat.\"\nAside from the criminal investigation into Hind, her family and the paramedics, the IDF also said it would investigate the killing of 15 Palestinians, after an IDF unit fired on ambulances, a fire engine and a ma", "translation_ja": "", "vocab": [{"word": "condemnation", "definition": "強い非難や批判のこと。国際社会が特定の行動や政策に対して公式に表明する否定的な見解を指します。"}, {"word": "credible", "definition": "信頼できる、信用に値するという意味。情報源や機関が正当性と信頼性を備えているかどうかを判断する際に使用されます。"}, {"word": "accountability", "definition": "説明責任、責任を負う義務のこと。権力機関が自らの行動について公開的に説明し、その結果に責任を持つべき原則です。"}, {"word": "coordination", "definition": "複数の組織や個人の行動を調整し、協力させることを意味します。特に軍事作戦において異なるグループが効果的に連携する必要があります。"}, {"word": "commission of inquiry", "definition": "特定の事件や問題を調査するために設立された公式な調査委員会のこと。通常、独立した専門家で構成されています。"}, {"word": "mechanism", "definition": "仕組み、制度、メカニズムのこと。何らかの目的を達成するための組織的な構造や方法を指します。"}]}, {"title_ja": "解任されたウクライナ国防相が戦時中の大統領選挙を要求", "title_en": "Sacked Ukrainian Defence Minister Calls for Wartime Elections", "summary_ja": "ウクライナの前国防相ミハイロ・フェドロフ氏が、戦時中の大統領選挙実施を呼びかけており、ロシアの全面侵攻以来、ゼレンスキー大統領に対する最大の異議となっています。わずか6ヶ月で解任されたフェドロフ氏は、民主主義はロシアに人質にされるべきではないと主張しています。数百万人のウクライナ国民が国外に逃れ、数十万人が前線で従軍しているため、この提案は実現に向けて大きな課題に直面しています。", "summary_en": "Ukraine's former defence minister Mykhailo Fedorov has called for presidential elections during wartime, marking the strongest challenge to President Zelensky's leadership since Russia's full-scale invasion. Fedorov, who was dismissed last month after only six months in office, argues that democracy cannot be held hostage by Russia. The proposal faces significant practical challenges, as millions of Ukrainians have fled the country and hundreds of thousands are serving on the front lines.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cdew8n9erlwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Sacked Ukrainian defence minister calls for presidential election\n- Published\nUkraine's popular ex-defence minister Mykhailo Fedorov has called for wartime elections, in what is widely seen as the biggest challenge to Volodymyr Zelensky's presidency since Russia's full-scale invasion four and a half years ago.\n\"Democracy cannot be held hostage by Russia,\" said Fedorov, 35, in a video posted to YouTube on Tuesday, adding that Ukraine is fighting \"precisely because we want to remain a free European state\".\nSince the war broke out in 2022 Ukraine has been under martial law, meaning elections are suspended.\nFedorov, who did not mention Zelensky by name in the video, was unexpectedly fired from his role as defence minister last month, just six months after his appointment.\nZelensky has not directly responded to the video from Fedorov, whose dismissal sparked protests across the country.\nBut in his own video message late on Wednesday, the Ukrainian president mentioned the tasks the newly-confirmed Defence Minister Yevhenii Khmara faced, including defending against deadly Russian aerial attacks and expanding Ukraine's \"deep-strike capabilities\" inside Russia.\nMeanwhile, a source in the presidential office told the BBC it was \"highly bizarre to plan elections amidst missiles and drones. This demonstrates a complete lack of realism\".\nA number of Ukrainian analysts have also questioned whether it would be possible to properly organise the voting for millions of Ukrainians who have fled the country and also hundreds of thousands of soldiers on the front line.\nZelensky - whose five-year presidential term ended in May 2024 - has been under pressure from both Washington and Moscow to hold new elections.\nWhen US President Donald Trump suggested last year that Kyiv was \"using war\" to avoid a vote, Zelensky said Ukraine was \"ready for elections\" within 60-90 days if its allies helped guarantee security for them.\nHolding a fair and safe vote would present considerable challenges for a country under repeated Russian bombardment and many Ukrainians saw Trump's remarks as reflecting Vladimir Putin's narrative that Zelensky is not a legitimate leader.\nIn the latest Russian attacks on Wednesday, four people were killed when a drone hit a minibus in the southern city of Kherson. Buses and minibuses in Kherson have been repeatedly targeted in recent months, killing drivers and passengers alike.\nIn the central city of Zhytomyr, two police officers were killed and another 20 people injured in a Russian drone strike on the regional police headquarters, a local official said.\nIn a separate development, Ukraine's two anti-corruption agencies said they were conducting a special operation targeting current and former MPs as well as an unnamed official in the presidential office.\nHours later, Zelensky's office said its deputy head Iryna Mudra had been dismissed, amid local media reports of a raid on her premises.\nThere was no immediate comment from Mudra, although MP Vadym Stolar, whose home was searched as part of the operation, said he was co-operating with anti-corruption officials.\nIn his video, Fedorov complained that corruption was depriving the military of weapons and equipment and making it harder for Kyiv to win the war. He spoke of Ukraine facing a \"systemic crisis of governance\" and being \"scared of change\".\nAbout 100 protesters gathered outside the Ukrainian parliament on Wednesday morning, chanting \"bring back Fedorov as minister of defence\" and \"we are fed up, we want dialogue\".\nFedorov is a charismatic politician, and during his tenure as defence minister, he was credited with energising the ministry, heading a drive against corruption, challenging outdated military structures and transforming the battlefield with new technology.\nHis dismissal in mid-July is believed to have resulted from tensions between him and army commander-in-chief, Oleksandr Syrskyi.\nWithin days Syrskyi was also replaced, as mounting protests calling for Fedorov's reinstatement piled pressure on the Ukrainian president.\nThe ousted minister was offered other posts in the government, including deputy prime minister for military innovation, but he made clear he would only return as defence minister.\nFedorov spoke in the video of a sense of injustice, warning it was \"particularly dangerous when society develops the feeling that the main criterion for an appointment is not professionalism, results, or the ability to transform the country, but personal loyalty to the system\".\nThe protests have continued weekly, with younger Ukrainians especially disappointed to see the established armed forces chief favoured over the fresh-faced digital innovator.\nHe gave no indication of his own political plans in the YouTube video, instead focusing on the need for a \"legal, safe, and realistic mechanism that will allow Ukraine to restore a full democratic process even amidst a prolonged war\".\nIn the space of a month, he has gone from saying he would only return to governme", "translation_ja": "", "vocab": [{"word": "martial law", "definition": "戦時法。国家が危機的状況で軍隊に統制権を与え、通常の法律の代わりに軍事的規制を施行する状態。"}, {"word": "bombardment", "definition": "砲撃、爆撃。大量の爆発物や砲火を継続的に対象地域に落とすこと。"}, {"word": "tenure", "definition": "在職期間、職務期間。特定の職位にある期間を指す。"}, {"word": "charismatic", "definition": "カリスマ的な、人を惹きつける魅力的な。強い個人的な魅力で他者に影響を与える能力を持つ。"}, {"word": "systemic crisis", "definition": "構造的な危機。システム全体の根本的な問題から生じる危機的状況。"}, {"word": "reinstatement", "definition": "復職、復帰。以前の職位や地位に戻されることを指す。"}]}, {"title_ja": "イスラエル、西岸地区E1地域の入植プロジェクトで入札受付を開始", "title_en": "Israel Opens Bids for Controversial West Bank E1 Settlement Project", "summary_ja": "イスラエルは占領下の西岸地区E1地域に約1,200戸の入植住宅を建設するための入札を開始しました。10月の総選挙前に意図的に期限を設定することで、将来の政府がこの計画を撤回することを困難にしています。このプロジェクトは西岸地区を事実上二分し、東エルサレムを孤立させることになり、パレスチナ国家の樹立の可能性に大きな打撃を与える可能性があります。", "summary_en": "Israel has launched tenders for approximately 1,200 settlement homes in the E1 area of the occupied West Bank, strategically timed before the October election to make it harder for future governments to reverse. The project, long condemned internationally, would effectively divide the West Bank and isolate East Jerusalem, dealing a major blow to prospects for a Palestinian state. The bid deadline is set for just days before the election, allowing the government to lock in contractor agreements.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cly50gn1e54o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Israel opens up bids for highly-sensitive West Bank settlement project\n- Published\nIsrael has opened up tenders for the construction of some 1,200 settlement homes in a strategically important part of the occupied West Bank, as the government seeks to end any chance of a Palestinian state.\nPlans to build on the so-called E1 area - east of Jerusalem - have long been internationally condemned.\nThe development would in effect divide the West Bank in two and isolate East Jerusalem.\nThe deadline for bids is days before Israel's October's general election, making it much harder for any future government to overturn any tenders issued.\nSettlements are illegal under international law.\nIsrael has built about 160 settlements housing 700,000 Jews since it occupied the West Bank and East Jerusalem - land Palestinians want, along with Gaza, for a hoped-for future state - during the 1967 Middle East war. An estimated 3.3 million Palestinians live alongside them.\nDespite the fierce international opposition, successive Israeli governments have allowed settlements to grow.\nHowever, expansion has risen sharply since Prime Minister Benjamin Netanyahu returned to power in late 2022 at the head of a right-wing, pro-settler coalition, as well as the start of the Gaza war, triggered by Hamas's 7 October 2023 attack on Israel.\nUnder international pressure, Israel held off for decades on plans to build in E1.\nMany of its allies and Palestinians argued these would deal a major blow to hopes of a two-state solution, effectively bisecting the West Bank.\nBut the current Israeli government gave the go-ahead for E1 construction a year ago, expressly to \"erase\" the idea of a Palestinian state.\nDespite an Israeli court challenge to the plans by Bedouin Palestinians living in the area and Israeli peace groups, the housing ministry has now issued a tender for 1,234 of the 3,401 housing units approved by the Israeli government last August.\nIt covers about 12 sq km (4.6 sq miles) between East Jerusalem and the settlement of Maale Adumim.\nAt the time of their unveiling, Finance Minister Bezalel Smotrich, who is ultranationalist and settler, said the idea of a Palestinian state was \"being erased\".\nThe deadline for bids is 19 October, just days before Israel's general election on 27 October. That should enable the government to sign deals with contractors that it would be much harder for a future government to cancel.\nIsrael captured the West Bank, including East Jerusalem, from Jordan in the 1967 Middle East War. It annexed East Jerusalem in 1980, in a move not recognised by the vast majority of the international community.\nOpponents of the E1 project have warned that it would effectively block the establishment of a Palestinian state because it would cut off the north of the West Bank from the south, and prevent the development in the centre of a contiguous Palestinian urban area connecting Ramallah, East Jerusalem and Bethlehem.\nPeace Now, an Israeli anti-settlement watchdog that has challenged the plans in court, said: \"The government is trying to sign contracts with contractors before the elections so that it will be much harder for the next government to cancel the construction.\"\nIt said even the partial implementation of the construction plans would \"fundamentally\" alter \"the geographic and strategic character of the area by severing the northern West Bank from the south and isolating East Jerusalem\".\n\"Building in E1 will ruin the possibility of reaching an end to the conflict and a peace arrangement based on two states,\" it said.\nJamal Juma, a Palestinian activist for the Stop the Wall campaign, who lives in Jerusalem, said the project would have a devastating impact on Palestinians.\n\"It is destruction of the communities, it's destruction of families... this is a disaster\", he told the BBC.\nHe added that more than 40 Bedouin communities would be affected and would have to be evicted.\nA spokesperson for the UN's Secretary-General António Guterres said he was \"deeply alarmed\" by the new tenders.\n\"The Secretary-General calls on Israel to refrain from taking any further steps in this regard\", they said.\n  - Published9 August\n  - Published24 February 2025", "translation_ja": "", "vocab": [{"word": "tenders", "definition": "公開入札または契約提案のこと。ここではイスラエル政府が建設業者から建設計画の提案を募集する過程を指します。"}, {"word": "strategically important", "definition": "政治的・軍事的に重要な意味を持つという意味。E1地域が西岸地区の分断に直結する重要な位置にあることを表します。"}, {"word": "bisecting", "definition": "地域や領土を二つに分割することを意味します。E1開発が西岸地区を北と南に分ける結果をもたらすという文脈で使用されています。"}, {"word": "contiguous", "definition": "隣接して連続している、つながっている状態を意味する。ここではパレスチナの各地域が地理的に繋がっていることの重要性を表します。"}, {"word": "implementation", "definition": "計画や政策を実行に移すこと。建設プロジェクトの実現や遂行を指します。"}, {"word": "evicted", "definition": "土地や建物から強制的に退去させられることを意味する。ここではベドウィンコミュニティがE1開発によって立ち退かされることを指します。"}]}, {"title_ja": "ショーラム沖の海で家族3人が死亡", "title_en": "Three family members die in sea off Shoreham", "summary_ja": "55歳のハッサン・エルハワスと37歳の妻ゼイナ・アレイン、そして14歳の娘サラが火曜日にサセックス州ショーラムフォート近くの海で溺れて死亡しました。より若い娘は病院で重篤な状態のままです。警察はCCTVの映像を確認した後、この死亡事故は第三者の関与がない悲劇的な事故だと考えています。", "summary_en": "Hassan El-Khawas, 55, his wife Zeina Alayn, 37, and their 14-year-old daughter Sara died after entering the water near Shoreham Fort in Sussex on Tuesday. A younger daughter remains in critical condition in hospital. Police believe the deaths were a tragic accident with no third-party involvement after reviewing CCTV footage.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cvgvr336z2po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Family named after three die in sea off Shoreham\n- Published\nThree members of the same family who died after getting into difficulty in the sea off Shoreham have been named by police.\nHassan El-Khawas, 55, and Zeina Alayn, 37, and their 14-year-old daughter Sara El-Khawas are thought to have gone into the water near Shoreham Fort on Tuesday, Sussex Police said.\nA younger girl from the same family, who was pulled from the water with them, remains in hospital in a critical condition.\nPolice said the family had travelled from their London home to visit Shoreham and after reviewing CCTV footage investigators say they believe the deaths were a tragic accident with no third-party involvement.\nThe Palestinian Forum said the family were British citizens of Palestinian origin, with roots in the Rashidieh refugee camp in Lebanon. Earlier, the Palestinian embassy in London told the BBC that Hassan El-Khawas had been a refugee.\nAdnan Hmidan, chairman of the Palestinian Forum in Britain, said the community was \"deeply shocked and saddened\" by what had happened.\nHe said two other children were on the shore at the time of the incident.\n\"Our thoughts and prayers are with the entire family, particularly the children, who are facing an unimaginable loss,\" he said.\nThe Palestinian Embassy in London said it was closely monitoring the incident and contacting British authorities to establish the circumstances and check on the condition of the girl in hospital.\nA statement issued by the embassy sent condolences to the family and the UK's Palestinian community and wished the girl a speedy recovery.\nPrime Minister Andy Burnham warned of the dangers of open water swimming after the incident, which he described as \"a terrible family tragedy\".\n\"The thing I can say today – and there is still, I think, a further heatwave to come in this summer period – it is just to remind people about the dangers of open water swimming,\" he said.\n\"The coldness, even when it feels hot outside, it can shock people and that can cause the difficulties. So people just need to remember that at all times.\n\"I do need to praise the emergency services who I know were on scene very quickly yesterday. They've had a busy summer but they were there and we thank them.\"\nCh Supt James Collis, of Sussex Police, said: \"The events of Tuesday afternoon are a heartbreaking tragedy which has devastated a family and their friends and had a profound impact on the Shoreham community.\"\nEmergency services were called shortly before 15:00 BST on Tuesday to reports of four people in trouble in the water near Shoreham.\nCoastguard crews, RNLI lifeboats, air ambulances, police officers and ambulance teams were involved in the response.\nAfter learning that three people in the same family had died, local shop owner Neha Patel said she was \"still shaking\" at what had happened.\n\"I think it's a shock to everyone around here,\" she said. \"I hope the one girl in the hospital gets better.\"\nThroughout the day people laid floral tributes near the beach where the tragedy unfolded.\nFriends Liz Donnelly and Lee Smith, who were among them, described the family's deaths as \"a real shock to such a small town\".\nSmith said: \"Our kids were here the night before. It makes you realise how thankful we are that it wasn't one of them, but at the same time the sadness of another family that are now going to go through this.\"\nThe Good Shepherd church, close to the beach, opened its doors for reflection and prayer.\nThe Rev Jane Bartlett, associate vicar, said the church wanted to support the community \"in whatever way we can\".\nAdur District Council chair, Julia Watts, said: \"We obviously don't know the circumstances of how they got into difficulty but the sea will never be completely safe.\n\"Many of us swim every day weather permitting and for people to lose their lives on a warm day in August seems unfathomable.\"\nRobina Baine, also an Adur councillor for the Southwick Green ward where the RNLI lifeboat station is, said: \"I have been here for 46 years and this is the most tragic incident there has been.\"\nPolice inquiries are continuing and a file is being prepared for the coroner.\nThe deaths are among a number of fatal incidents on the coast in recent months, including several in Sussex.\nIn May, three sisters, Jane Adetoro, 36, Christina Walters, 32, and Rebecca Walters, 31, died in the sea off Brighton, in what police described as a \"tragic incident\".\nIn July, two men were pulled from the sea at West Wittering, and one of the men was confirmed dead at the scene, while the other was taken to hospital.\nThis month, an 18-year-old man died after getting into difficulty in the sea at Camber Sands. He had travelled to the coast from London with friends.\nIn Essex, Shelina Rahman, 41, and her 15-year-old daughter Sameeha Rahman, died after getting into difficulty in the water on the Essex coast at West Mersea, where they were trying to help a seven-year-old boy.\nFollow BBC Sussex on Facebook, external, X, external, and ", "translation_ja": "", "vocab": [{"word": "devastated", "definition": "精神的に非常に傷つけられた、大きな打撃を受けた。感情的な苦痛や損失の深刻さを強調する表現です。"}, {"word": "profound", "definition": "非常に深い、強烈な影響を及ぼす。単なる大きさではなく、深さや重要性を伴った影響を意味します。"}, {"word": "unfathomable", "definition": "理解不可能な、測り知れない。予想外で納得がいかないような状況を表現します。"}, {"word": "fatal", "definition": "死をもたらす、致命的な。死亡につながる事故や病気などに使用される形容詞です。"}, {"word": "inquiries", "definition": "調査、質問。特に公式な調査や詳細な聞き取り調査を指します。"}, {"word": "coroner", "definition": "検死官、検視官。不審な死亡の原因を調査する公式な法医学関係者です。"}]}, {"title_ja": "イーストサセックス州の脱線現場近くで線路の欠陥が判明", "title_en": "Track defect found near derailment site in East Sussex", "summary_ja": "鉄道事故調査局（RAIB）は、先週木曜日に列車が脱線したイーストサセックス州ルウェス近くの線路に不規則性があることを発見しました。事故の直前に33℃の高温が記録されており、熱による線路の変形が事故の原因となった可能性があります。継続中の調査では、線路の保守管理、盛土の状態、および気象対応策について検査される予定です。", "summary_en": "Investigators found an irregularity in railway track geometry near Lewes, East Sussex, where a train derailed last Thursday, injuring 30 people. The Rail Accident Investigation Branch also noted that high temperatures of 33°C preceded the incident, suggesting heat-related track movement may have contributed to the accident. The ongoing investigation will examine track maintenance, embankment conditions, and weather mitigation measures.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4gx12v8z51o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Track defect found near derailment site - report\n- Published\nA defect was found on railway tracks in East Sussex at the site where a train derailed leaving 30 injured, a report says.\nInitial findings from the Rail Accident Investigation Branch (RAIB) found an \"irregularity\" with the tracks near Lewes where three carriages tumbled down an embankment last Thursday.\nThe RAIB, which is continuing to investigate the derailment, said it had received \"several reports of rough riding at the location of the derailment from passengers on other trains\".\nNetwork Rail and Greater Thameslink Railway, whose Southern Rail train was involved in the crash, said in a joint statement they were \"sorry this happened on our railway\".\nInvestigators from the RAIB have said CCTV from a train which passed through the crash site at 14:04 BST showed the \"irregularity\" with the track geometry just before the point where the train came off the tracks.\nThe 14:24 service from London Victoria to Eastbourne derailed in the Landport area of Lewes at about 15:54 BST.\nThe derailment left two people seriously injured, and 18 were taken to hospital with less serious injuries. The 18 have since left hospital.\nThe eight-carriage train was travelling at about 65 mph when it derailed - within the 70mph speed limit - and the driver had begun to brake as the train approached the site.\nThe RAIB update also highlighted that the accident took place during a sustained period of hot and dry weather.\nTemperatures as high as 33°C (91.4°F) were registered shortly before the crash.\nThe RAIB says the clay embankment and the material underneath it are sensitive to changes in moisture content, and may move as moisture levels change.\nThe continuing investigation will now consider elements including how that section of track was inspected and maintained, the condition and maintenance of the embankment, the weather conditions and how effective any hot weather mitigation measures were.\nIn a joint statement, Lucy McAuliffe, Network Rail's route director for Sussex, and John Whitehurst, chief executive of Greater Thameslink Railway, apologised for the derailment.\nThey added: \"We will carefully consider any recommendations arising from the investigation and work across the industry to implement them, with the shared goal of making an already safe railway even safer for our customers, colleagues and the communities we serve.\"\nLast Friday, Network Rail's group safety and engineering director Martin Frobisher told the BBC speed restrictions were not in place along the section of track when the derailment happened.\nHe insisted the railway was safe, and that Network Rail took various measures to manage the impact of weather on tracks and other railway equipment.\nThe Department for Transport released a statement saying \"safety remains the absolute priority across our rail network\".\nThe statement added: \"The UK's railways remain among the safest in the world, with the number of delays caused by track faults falling by 45% since the late 2000s.\"\nFollow BBC Sussex on Facebook, external, X, external, and on Instagram, external and listen to BBC Radio Sussex on Sounds. Send your story ideas to southeasttoday@bbc.co.uk, external or WhatsApp us on 08081 002250.\n  - Published1 day ago\n  - Published4 days ago", "translation_ja": "", "vocab": [{"word": "irregularity", "definition": "通常の状態から逸脱した、不規則な状態を指します。この場合、線路の幾何学的形状の異常を意味し、技術的な検査で発見される問題です。"}, {"word": "embankment", "definition": "鉄道や道路を支える為に築かれた盛土・斜面を指します。この記事では、列車が転覆した斜面の状態が調査対象になっています。"}, {"word": "moisture content", "definition": "材料に含まれる水分の量のことで、特に粘土などの素材では含水量の変化が構造に影響を与えます。"}, {"word": "mitigation measures", "definition": "リスクや悪影響を軽減するための対策を指します。この場合、高温による線路への悪影響を減らすための措置を意味しています。"}, {"word": "sustained", "definition": "継続的な、持続する状態を表しており、この記事では継続する高温天候期間を指しています。"}, {"word": "geometry", "definition": "幾何学的な形状や配置を指し、線路の場合は正確な形状と位置を意味します。"}]}, {"title_ja": "イングランド・ウェールズの男性受刑者施設、3月以来の最低空き室数に直面", "title_en": "English male prisons hit lowest vacancy rate since March amid overcrowding crisis", "summary_ja": "イングランド・ウェールズの男性刑務所の空き室数が1,800室未満となり、3月以来の最低水準に達した。現在83,000人以上の受刑者が収容されており、1年以下の刑期を避けるという政府方針にもかかわらず、仮釈放条件違反による再投獄率が高いため、確保した空き室の効果が相殺されている。政府は10月から約5,000人の受刑者を早期釈放する予定である。", "summary_en": "Male prisons in England and Wales have fewer than 1,800 available spaces, the lowest level since March, with over 83,000 inmates currently housed. Despite the government's policy to avoid jailing offenders for under one year, high rates of prisoners being recalled for license breaches have negated the freed-up space. The government plans to release approximately 5,000 inmates early starting in October to address the overcrowding.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c1w1v9elzvdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Male prisons in England and Wales have fewer than 1,800 spaces\n- Published\nMale prisons have fewer than 1,800 spaces available in England and Wales, the lowest level since March.\nMore than 83,000 spaces are occupied by male inmates, despite the government introducing a presumption against jailing anyone for under one year to free up more space.\nPrison staff told the BBC the high level of offenders being recalled to prison for breaching license conditions given on their release or re-offending has cancelled out much of the extra room. Since June, there has been a downward trend in the number of vacant spaces.\nThe spike comes before the government is set to release about 5,000 inmates early from October to alleviate overcrowding.\n- Plan to scrap most short jail terms comes into effect \n  - Published23 March\nThe Ministry of Justice (MoJ) said it was building more prisons while exploring early release options and expanding electronic tagging.\nThe figures come after Prime Minister Andy Burnham made more prisoners exempt from the upcoming early release scheme following backlash from victims.\nBurnham came under further pressure after the killers of PC Andrew Harper would still be eligible for early release.\nPC Harper, 28, was killed in 2019 when he was dragged by a car down a country road as three teenagers fled the scene of a quad bike theft in Berkshire.\nLast week, Burnham said he was \"confident\" PC Harper's killers could be excluded from the government's early release scheme\nOn August 3, Burnham said in a written article, external he had \"wanted to go even further\" but had \"pushed to the very limits of what is possible to do\".\nA spokesperson for the MoJ said \"public safety will always be our priority\".\n\"We are fast-tracking a plan to keep more of the most serious offenders behind bars, on top of murderers, anyone on life sentences and those in prison for rape, serious child sexual abuse and grooming offences who are already blocked from any changes,\" they said.\n\"We share the public's anger that these options are even being considered, after we inherited a prison system on the brink of collapse.\"", "translation_ja": "", "vocab": [{"word": "presumption against", "definition": "〜に対する強い反対または否定の傾向を示す法的・制度的立場。ここでは短期懲役刑を避けるべきという政策原則を意味する。"}, {"word": "recalled", "definition": "仮釈放や条件付き釈放から刑務所に戻される、または呼び戻される状態。ライセンス条件違反や再犯により強制的に収監されることを指す。"}, {"word": "alleviate", "definition": "問題や苦痛を軽減または緩和すること。ここでは刑務所の過密状況を改善するために行われる。"}, {"word": "exemption", "definition": "通常のルールや処置から除外されることを意味する法律用語。ここでは早期釈放制度の対象から外されることを指す。"}, {"word": "backlash", "definition": "政策や決定に対する激しい反発または批判。特に被害者遺族などから受けた強い非難を指す。"}, {"word": "fast-tracking", "definition": "通常のプロセスをスキップして優先的かつ迅速に進めること。計画を加速化する意味。"}]}, {"title_ja": "スペイン、セウタから本土への脆弱な若者500人の移送を計画", "title_en": "Spain to Transfer 500 Vulnerable Youths from Ceuta to Mainland", "summary_ja": "スペイン政府は、北アフリカの飛び地セウタから本土へ、主に9～17歳の女児を含む約500人の付き添いのない脆弱な若者を児童保護機関を通じて移送する計画を発表した。移送はセウタが法的後見権を保持しながら、適応された施設での改善されたケアを提供することを目的としている。この措置は7月下旬にモロッコから約80,000人が越境した後の移民急増に対応するものである。", "summary_en": "Spain's government plans to relocate approximately 500 unaccompanied vulnerable youths, primarily girls aged 9-17, from the North African exclave of Ceuta to mainland Spain through child protection organizations. The transfer aims to provide improved care in adapted facilities while Ceuta retains legal guardianship until placement. This measure follows a major migration surge in late July when around 80,000 individuals crossed from Morocco, leaving thousands of minors in precarious conditions.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ceuta-madrid-to-transfer-500-vulnerable-youths-to-mainland/a-78437405?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Ceuta: Madrid to transfer 500 vulnerable youths to mainland\nAugust 19, 2026\nSpanish immigration and youth services officials have come up with a plan to transfer roughly 500 particularly vulnerable unaccompanied youths from the North African Spanish exclave of Ceuta to mainland Spain.\nSpain's Ministry of Youth and Children says the plan has a mechanism that will allow \"child protection organizations to take in and care for the most vulnerable individuals — including girls — in adapted facilities on the mainland, without the need to transfer custody to [regional authorities].\"\nWhat else do we know about the measure?\nOn Wednesday, Spain's Migration Minister Elma Saiz told public broadcaster RNE that Madrid is working with Ceuta and Spain's regional governments to organize the transfer and placement of the children, mainly girls, in foster homes as well as under government care.\nSpain's EFE news agency quoted government officials saying that a royal decree would establish \"the binding and solidarity-based reception of minors by all regions.\"\nMigration Minister Saiz emphasized the fact that the \"overriding welfare of the children\" must be protected at all cost.\nUNICEF Spain's Lara Contreras said the approach would see Ceuta retain legal guardianship of the girls until they were transferred to child protection organizations \"willing to take them in\" on the Spanish mainland.\nContreras said that 97 of the 500 girls selected — aged 9 to 17 — have already been moved to improved facilities and will be transferred as soon as possible.\nContreras says it is \"urgent\" that authorities properly identify unaccompanied children and denounced the fact that \"hundreds of them are wandering the streets alone, in unsanitary conditions.\"\nWhat is the situation in Ceuta?\nThe children are among the roughly 80,000 individuals who crossed into Ceuta from Morocco on July 30 in hopes of starting a better life in Europe.\nThough most migrants have since returned to Morocco, Spanish Interior Minister Fernando Grande-Marlaska recently said that around 5,000 remain in Ceuta.\nSpain's national police have reportedly identified 2,168 unaccompanied minors living on the streets since the border crossing and handed them over to local authorities on July 30.\nEdited by: Saim Dušan Inayatullah\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "exclave", "definition": "ある国の領土であるが、その本国領土から地理的に分離されている地域。セウタはスペインの飛び地であり、モロッコに囲まれている。"}, {"word": "unaccompanied", "definition": "成人の監督者なしで旅行または滞在している人。特に移民や難民の文脈では、親や保護者がいない未成年者を指す。"}, {"word": "vulnerable", "definition": "危害や悪影響を受けやすい状態にある。この記事では、保護が必要な子どもたちの脆弱な立場を指す。"}, {"word": "guardianship", "definition": "法律上、未成年者や行為能力のない人の利益を保護し代理する責任。セウタが子どもたちの法的後見人として機能することを意味する。"}, {"word": "solidarity-based", "definition": "共通の関心または目標に基づいて団結する原則に基づく。各地域がスペイン全体の利益のために協力することを意味する。"}, {"word": "overriding", "definition": "他のすべての懸念や考慮事項より優先される、最も重要な。この場合、子どもたちの福祉が最優先事項であることを強調する。"}]}, {"title_ja": "ザンビア：ムンドゥビレ野党指導者が選挙結果の覆滅を裁判所に申し立て", "title_en": "Zambia: Mundubile seeks to overturn election result in court", "summary_ja": "ザンビアの野党指導者ブライアン・ムンドゥビレは、投票手続きと結果報告における文書化された不規則性を理由に、大統領選挙結果に対する法的異議を申し立てる計画を発表しました。選挙委員会は現職のハカインデ・ヒチレマ大統領を60%の得票率で勝者と宣言し、国際オブザーバーは透明性への懸念を指摘し、政府は選挙期間中に野党指導者を逮捕しました。", "summary_en": "Zambian opposition leader Brian Mundubile announced plans to legally challenge the presidential election results, citing documented irregularities in voting procedures and result transmission. The electoral commission declared incumbent President Hakainde Hichilema the winner with 60% of the vote, while international observers raised concerns about transparency and the government arrested opposition figures during the election period.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/zambia-mundubile-seeks-to-overturn-election-result-in-court/a-78436788?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Zambia: Mundubile seeks to overturn election result in court\nAugust 19, 2026\nZambian opposition leader Brian Mundubile said on Wednesday that he plans to challenge the results of this month's presidential election result in court.\nZambia's electoral commission declared incumbent President Hakainde Hichilema the winner of the election on Tuesday, giving him a second five-year term. He has been in power since 2021.\nThe election was marred by accusations of interference and by arrests of opposition figures.\nWhat did Mundubile say about his push to challenge the election result?\nWhile announcing his intention to legally challenge the result, Mundible pointed to irregularities and other issues with the election.\n\"Our campaign has documented serious irregularities, inconsistencies and circumstances surrounding the conduct, counting, transmission and declaration of results\", Mundubile said in a statement issued from an undisclosed location.\nThe politician had earlier said he was under protection due to threats.\nMundubile received 38% of the vote on Tuesday, while Hichilema took 60%, according to the electoral commission.\nWhile the vote itself was largely peaceful, some 11 people — including leading figures in the opposition — were arrested on the night of the election. The government said that the arrests were part of a raid against \"militia activity.”\nMundubile's National Reconciliation Party for Unity and Prosperity (NRPUP) said that shots were fired during the raid of the opposition figure's home. The party also denied any ties to militias.\nVote counting was also suspended for multiple hours on Friday after the electoral commission reported attacks against polling officials and theft of some ballets.\nUN rights chief calls for Zambia to halt arrests, EU mission notes irregularity\nThe United Nations High Commissioner for Human Rights, Volker Türk, said he was concerned by reports of arrests of opposition members.\nIn a statement, he urged authorities \"to stop arresting people arbitrarily and to uphold fully the due process rights of all those detained.\"\nMeanwhile, an electoral observer mission for the European Union raised concerns around transparency.\n\"Observers reported extended breaks during the results tabulation process in almost half of observations, as the returning officers seemed to wait and receive instructions from... headquarters before announcing results,\" the mission said.\nEdited by: Mark Hallam\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "irregularities", "definition": "予期しない、または通常と異なる状況や不適切な行為。この文脈では、選挙プロセスにおける異常事態や不規則な手続きを指します。"}, {"word": "incumbent", "definition": "現在その職にある人。通常は政治的地位や公職にある現職者を指します。"}, {"word": "marred", "definition": "何かの質や完全性を損なう、傷つける。この場合、選挙が否定的な出来事によって悪い影響を受けたことを意味します。"}, {"word": "arbitrarily", "definition": "理由や根拠なく、気まぐれに行動すること。法的文脈では、正当な理由がない不当な行為を指します。"}, {"word": "transparency", "definition": "情報が開かれており、隠蔽されていない状態。政治や行政において、プロセスや決定が明確で追跡可能なことを意味します。"}, {"word": "tabulation", "definition": "データや情報を表形式で整理・集計すること。選挙では投票結果を集計するプロセスを指します。"}]}, {"title_ja": "リベリア、米国の第三国籍者1,200人の強制送還を受け入れへ", "title_en": "Liberia to Accept 1,200 US Third-Country Deportees Over Next Year", "summary_ja": "リベリアは、米国の裁判所命令により本国への強制送還ができない米国の強制送還者1,200人を今後12ヶ月間で受け入れることに合意した。トランプ政権は、安全保障上の懸念から強制送還が阻止されている人々を管理するため、複数のアフリカ諸国と同様の取引を締結している。リベリアは強制送還者をゲストとして扱い、出国または亡命を申請することを許可すると述べている。", "summary_en": "Liberia has agreed to accept up to 1,200 deportees from the United States who cannot be legally returned to their home countries within the next 12 months. The Trump administration has struck similar deals with several African nations to manage deportations blocked by US courts due to safety concerns. Liberia stated the deportees will be treated as guests and allowed to depart or seek asylum.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/liberia-says-it-s-taking-in-1-200-third-country-us-deportees/a-78436127?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Liberia says it's taking in 1,200 third-country US deportees\nAugust 19, 2026\nLiberia has agreed to accept up to 1,200 third-country deportees from the United States in the next 12 months, the government said this week.\nIt said that the first group of 20 were expected to arrive on Thursday.\nDonald Trump's administration has recently struck several deals with African countries to take in people it cannot legally send back to their home countries — typically because of US court orders ruling that doing so would put them in danger.\nWhat did Liberia say about the agreement?\n\"Liberia intends to accept up to 1,200 persons to be transferred from the United States of America within a year,\" the Liberian government said in a statement published on Tuesday.\nIt said that the people would be received \"as guests\" and that they would be \"free to depart the country when they so desire\" or to apply for asylum.\nThe government's statement said the deportees \"will include citizens or nationals of African and Western Hemisphere countries who are medically authorized to travel.\"\nIt said that the deal did not involve a quid pro quo with the US and that it was not demanding and had not received any direct compensation.\nHowever, it also said that it would receive \"support to help manage the program and strengthen its migration system more broadly,\" without elaborating.\nThe statement also referenced Liberia's 19th century history as a refuge for freed slaves from the US, and its \"long history of accepting people seeking refuge from political and other crises.\"\nWhy is the US looking for support of this kind from African countries?\nThe announcement follows around a year after Liberian President Joseph Boakai visited the White House among a group of African leaders and held talks with Trump.\nSeeking a way to deport would-be migrants that it cannot send back to their countries of origin — very often because of US courts ruling that doing so would put them at risk of torture or other abuses — the Trump administration has been seeking agreements with third countries willing to take some of the people.\nThe US government has defended such agreements as lawful, although some rights groups and advocates have said the details are often opaque and that many of the deportees are ultimately repatriated.\nBeyond Monrovia's description, no information was immediately available on where exactly the deportees hailed from.\nOther African countries including the Democratic Republic of Congo, the Central African Republic, Equatorian Guinea, Cameroon, Ghana and Sierra Leone have reached similar accords with the US.\nThe EU is currently looking into somewhat comparable plans that would allow member states to send rejected asylum seekers to so-called \"return hubs\" in third countries as part of bilateral or multilateral agreements, provided various conditions were met.\nEdited by: Saim Dušan Inayatullah\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "quid pro quo", "definition": "一方が他方に与える見返りとして行われる取引や合意。ここでは、リベリアが金銭補償なしに強制送還者を受け入れることを意味しています。"}, {"word": "deportee", "definition": "強制送還される人、または強制送還された人。自国に戻すことができない移民を指します。"}, {"word": "bilateral agreement", "definition": "2つの国家または団体間で結ばれた協定。この場合、米国とリベリアの間の強制送還に関する合意を指します。"}, {"word": "opaque", "definition": "透明性が低く、内容や詳細が明確でない状態。政策や協定の詳細が不明確であることを表します。"}, {"word": "repatriate", "definition": "人や物を元の国に返す、または送り返すこと。強制送還者が最終的に母国に戻されることを意味します。"}, {"word": "accord", "definition": "合意、協定、または一致。国家間の正式な合意を指す外交用語として使用されます。"}]}, {"title_ja": "トランプ大統領、ホワイトハウス建設推進のため宴会場を「軍事施設」と称呼", "title_en": "Trump Calls Ballroom a 'Military Complex' to Advance White House Construction", "summary_ja": "トランプ政権はホワイトハウスの宴会場建設プロジェクトに関連する国家安全保障上の側面について、その修辞を強化している。当局者らは建設完了の迅速化を図るため、この構造物を軍事的用語で表現している。この動きは、当政権が進行中の建設構想を正当化する方法の転換を示している。", "summary_en": "The Trump administration is escalating its rhetoric regarding national security aspects of a White House ballroom construction project. Officials are framing the structure in military terms as part of efforts to expedite completion. The move represents a shift in how the administration is justifying the ongoing construction initiative.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-calls-white-house-ballroom-military-complex-supreme/story?id=135782053", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース配信", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースと生中継イベントの24時間体制での報道を提供しています。このプラットフォームは、主要なストーリーが展開される際にリアルタイム更新を配信し、視聴者が最新情報を得られるようにしています。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events throughout the day and night. The platform delivers real-time updates on major stories as they develop, ensuring viewers stay informed on current events.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カルメロ・アンソニー事件の裁判官が解任、少年が新審判を求める", "title_en": "Judge Removed from Karmelo Anthony Murder Case as Teen Seeks New Trial", "summary_ja": "19歳のカルメロ・アンソニーは、高校トラック大会で同級生を刺殺した罪で6月に有罪判決を受け、懲役35年の判決を言い渡された。裁判官がアンソニーの新審判請求に伴い事件から外されることになった。この決定は、若き被告人が関わる注目される事件における重要な進展を示している。", "summary_en": "Karmelo Anthony, 19, was convicted and sentenced to 35 years in prison in June for fatally stabbing a fellow student at a high school track meet. The trial judge has been removed from the case as Anthony pursues a new trial. The decision marks a significant development in the high-profile case involving the teenage defendant.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/trial-judge-recused-karmelo-anthony-case-teen-seeks/story?id=133756722", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ケニアのサファリヘリコプター墜落で7人が死亡、アメリカ人5人を含む", "title_en": "Seven killed in safari helicopter crash in Kenya, including five Americans", "summary_ja": "水曜日の朝、ケニア北部でサファリヘリコプターが墜落し、乗員乗客7人全員が死亡しました。犠牲者には米国市民5人、エクアドルの国家情報局長、そしてフロリダのテレムンド局幹部が含まれています。", "summary_en": "A safari helicopter crashed in northern Kenya on Wednesday morning, killing all seven people onboard, including five US citizens and Ecuador's national intelligence director. Among the victims was José Suárez, president of several Telemundo stations in Florida, and Michele Sensi-Contugi, who was visiting Kenya as a tourist with his wife.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/19/kenya-helicopter-safari-crash", "state_media": false, "category": "社会", "full_text": "Seven people, including five Americans, were killed when a safari helicopter crashed on Wednesday morning in a remote part of northern Kenya, according to local police and the state department.\nAmong the dead were an executive with Telemundo, the US-based Spanish-language network owned by NBC Universal, and the director of Ecuador’s national intelligence service.\nThe helicopter crashed at 9.13am while flying from the Loisaba Conservancy to the Ewaso Nyiro area in Samburu county, according to the Kenya Civil Aviation Authority, which said in a statement that an investigation was under way. It said there were seven people onboard – six passengers and the pilot.\nLate on Wednesday, David Nkoroi, the police commander for Samburu, told reporters that all seven people onboard had died.\nIn Washington, the state department said five of those killed were US citizens. “The US embassy is in touch with local authorities and is providing consular assistance,” it said. “We extend our deepest condolences to the families and loved ones on their loss.”\nThe identities of the victims were not revealed but a local television station in Miami, Florida, said that José Suárez, 55, president and GM of several Telemundo stations in Florida, was among those killed.\n“We are heartbroken to learn the tragic news that José was killed in a helicopter accident in Kenya,” the NBC affiliate in Miami quoted from a joint statement from NBC Universal and Telemundo leadership.\nThe helicopter crashed in a rugged area in the foothills of Mount Ololokwe, a popular tourist destination in the country, local media reported. The helicopter, owned by local company Lady Lori Helicopters, was carrying guests with the travel company +Beyond.\nLady Lori Helicopters said in a statement that the aircraft was operating a charter flight when it crashed.\nTropic Air Kenya, a local safari operator, said in a statement that it dispatched two of its helicopters to aid search and rescue operations.\nThe aviation authority said the aircraft was a Eurocopter EC130 B4.\nEcuador confirmed later on Wednesday that Michele Sensi-Contugi, director of the country’s national intelligence center, died in the helicopter crash in Kenya.\nIn a statement posted on X, the presidency said: “In this moment of deep sorrow, the government extends its heartfelt condolences to his family, loved ones and close associates.”\nSensi-Contugi was visiting Kenya as a tourist with his wife, Stephany Hollihan Vasconez, who also died in the crash. She was a US and Ecuadorian citizen. They are survived by their two children.\nHelicopter crashes have happened with increasing regularity in Kenya, which has a thriving tourism industry that depends on domestic carriers to ferry visitors to distant places like Mount Ololokwe.\nIn February, a legislator was among six people who died after a helicopter crash in a hilly area of western Kenya.", "translation_ja": "", "vocab": [{"word": "conservancy", "definition": "自然保護や野生動物保護を目的とした組織または保護区域。観光地やサファリ地域でよく使用されます。"}, {"word": "consular assistance", "definition": "領事館が提供する公式な支援・援助のこと。外交的支援や市民サービスを含みます。"}, {"word": "aviation authority", "definition": "航空機の運航・安全を監督・規制する政府機関。事故調査も担当します。"}, {"word": "charter flight", "definition": "特定の顧客や団体のために貸し切りで運航する飛行。定期便ではなく随時運航です。"}, {"word": "thriving", "definition": "繁栄している、活況を呈している状態。経済や産業が成長・発展していることを示します。"}, {"word": "rugged", "definition": "険しい、ごつごつした地形。整備されていない自然のままの広大な地域を表現します。"}]}, {"title_ja": "スペイン、セウタの移民児童500人の本土移送を決定 強硬姿勢から方針転換", "title_en": "Spain Reverses Course, Will Relocate 500 Migrant Children from Ceuta to Mainland", "summary_ja": "スペイン政府は硬化した姿勢を翻し、セウタからの付き添い者のない移民児童約500人を本土に移送することに合意した。数百人の児童が路上生活を強いられていることを受けた決定だが、保守派および極右政党からは児童をモロッコに返却すべきだという反発を受けている。", "summary_en": "Spain's government has reversed its hardline stance and agreed to transfer approximately 500 unaccompanied migrant children from Ceuta to the mainland, citing legal obligations to care for minors. The decision comes after hundreds of children were left living on streets, though the plan has drawn opposition from conservative and far-right political parties who argue the children should be returned to Morocco.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/19/spain-allows-500-migrant-minors-in-ceuta-to-relocate-to-the-mainland-in-u-turn", "state_media": false, "category": "政治", "full_text": "The Spanish government has U-turned and said it will allow 500 migrant children in Ceuta to relocate to the mainland.\nThe majority of the estimated 70,000 people who crossed into Ceuta – a Spanish territory on the coast of north Africa – on 30 July have returned to Morocco. However, under Spanish law, the state has a duty of care to young, unaccompanied migrants until they reach the age of 18.\nOn 13 August, the interior minister, Fernando Grande-Marlaska, had said: “Anyone who illegally enters Ceuta or Melilla [another Spanish enclave in north Africa] knows they will be sent back because Spain and Morocco work together to this end. They will not reach the peninsula, nor the European continent and nor will they remain indefinitely in Ceuta or Melilla.”\nThe transfer of the children to the Spanish mainland is a sensitive political topic as several regions governed jointly by the conservative People’s party and the far-right Vox are reluctant or opposed to receiving their quota.\nTo minimise conflict, the youth ministry, in coordination with the Ceuta government, is devising an urgent plan under which NGOs and child protection agencies take charge of the most vulnerable children, girls in particular, without transferring their guardianship to Spain’s regional governments.\nRubén Pérez Correa, the secretary of state for children, has been in Ceuta since Sunday in an effort to resolve a situation in which hundreds of children are living on the street and existing on handouts from Ceuta residents.\nNews of the government’s plan came only hours after the European Commission said that under EU law all of the migrants should be returned to Morocco. Asked to clarify, the commission’s spokesperson on internal affairs, Markus Lammert, said that by law all irregular migrants remaining in Ceuta should be sent back, “including unaccompanied minors”.\nThe People’s party has rejected the government plan, saying the best place for the children is with their families. “If Morocco has asked for the children to be returned and if Europe says the illegal immigrants should all be returned, whether children or not, what more does the government need?” the People’s party deputy finance spokesperson, Juan Bravo, said in a television interview.\nThe mixed messages partly derive from the fact the latest European pact on immigration has not yet been incorporated into Spanish law and therefore Spain’s own legislation on the treatment of unaccompanied minors remains in force.\nAccording to Spain’s ministry of inclusion and migration, as of last March 21,104 people aged 16-23 were guardians of the state, of whom about 3,500 were under 17. Approximately 50% were from Morocco. Girls made up about 8% of the total.", "translation_ja": "", "vocab": [{"word": "U-turn", "definition": "政策や立場の大幅な方向転換。政治家や政府が以前の決定を撤回して全く反対の立場を取ることを指す。"}, {"word": "unaccompanied", "definition": "付き添い者がいない状態。特に移民や難民の文脈では、親や保護者なしで移動する児童を指す。"}, {"word": "enclave", "definition": "周囲を別の領土に囲まれた地域。異なる国や地域の中にある飛び地的な領土を意味する。"}, {"word": "quota", "definition": "割り当て数や許可数。特に難民や移民の受け入れに関して、各地域が受け入れることを求められる人数。"}, {"word": "guardianship", "definition": "後見人としての法的責任。未成年者や判断能力のない者の世話と法的保護を行う地位。"}, {"word": "irregular migrants", "definition": "不法移民。国の入国手続きや滞在許可を経ずに入国・滞在する移民を指す。"}, {"word": "incorporate", "definition": "組み込む、統合する。法律の文脈では、国際的な取り決めを国内法に取り入れることを意味する。"}]}, {"title_ja": "コンゴ民主共和国のエボラ出血熱、同国史上最悪の流行に", "title_en": "DRC's Ebola outbreak becomes deadliest in country's history with 2,325 deaths", "summary_ja": "コンゴ民主共和国のエボラ出血熱の流行により、2,325人の死亡が確認され、同国の過去最悪の流行を超えた。稀なブンディブギョ株が急速に拡大しており、WHOはこれが世界史上最大のエボラ流行になる可能性があると警告している。医療施設への攻撃、誤った情報、および地域社会の治療受診拒否により、対応の努力が妨げられている。", "summary_en": "The Ebola outbreak in the Democratic Republic of the Congo has surpassed the country's previous deadliest outbreak, with 2,325 confirmed deaths and 4,945 cases. The rare Bundibugyo strain is spreading rapidly, with the WHO warning it could become the largest Ebola outbreak in global history. Response efforts are hampered by healthcare facility attacks, misinformation, and community reluctance to seek treatment.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/17/ebola-outbreak-drc-democratic-republic-of-congo-deadliest-in-history", "state_media": false, "category": "政治", "full_text": "The Ebola outbreak in the Democratic Republic of the Congo is now the deadliest in the country’s history, with at least 2,325 people dead, according to government data, surpassing the toll from the 2018-20 outbreak.\nThe DRC’s public health institute said confirmed cases had risen to 4,945, including 101 detected in the previous 24 hours.\nThe World Health Organization has said the outbreak is on track to surpass west Africa’s 2014-16 Ebola outbreak as the biggest in history. The 2014-16 outbreak resulted in 28,616 cases and 11,325 deaths across Guinea, Liberia and Sierra Leone, according to WHO data.\nOn Friday, the UN said Ebola “is winning in the Democratic Republic of the Congo” and said the epidemic was killing one person every 30 minutes.\nSix of DRC’s 26 provinces have been affected, mainly those along the country’s north-eastern border. More than 3,400 of the cases have been recorded in Ituri province, where the outbreak was first reported.\nThe latest numbers of confirmed cases of Ebola in the DRC have made this outbreak – the 17th in the country’s history – the fastest-growing in the known history of the virus. It took almost five months for the 2014-16 west Africa outbreak to reach 1,000 deaths, compared with more than 2,000 deaths in less than three months in this outbreak.\nThere are no approved vaccines or treatments yet for the rare Bundibugyo strain of the virus that is responsible for the current surge in cases. Nonetheless, 1,000 people in the DRC have recovered from the infection, with 730 still in healthcare or isolation facilities.\nClinical trials of two possible treatments for the strain began last month in Ituri. Tedros Adhanom Ghebreyesus, the WHO director general, said last week that two vaccines developed specifically for Bundibugyo were now being tested on people.\nThomas Parisch, a public health specialist recently deployed to the DRC with Médecins Sans Frontières, said: “Normally, as an outbreak progresses, the case fatality ratio should fall as contact tracing improves and patients are identified and treated earlier. Instead, we’re still seeing many cases detected very late, when treatment is less likely to succeed, with many identified only after they die in the community.”\nUganda has reported at least 20 cases, all in the capital, Kampala. The last case reported there was on 21 June and no community transmission has been recorded. The government declared the country Ebola-free on 28 July after the last Ebola patient, a Congolese national, was discharged on 16 July.\nIn May, the WHO declared the outbreak in the DRC and Uganda as a public health emergency of international concern. It said sequencing showed the outbreak had started months earlier, in February.\nEbola is transmitted to people from wild animals and then spreads in the human population through direct contact with the blood, secretions, organs or other body fluids of infected people, including dead bodies, and with contaminated surfaces and materials such as bedding or clothing.\nAccording to the WHO, symptoms can include fever, fatigue, malaise, muscle pain, headache and sore throat. These are followed by vomiting, diarrhoea, abdominal pain, rash and symptoms of impaired kidney and liver functions.\nThe response to this outbreak has been hampered by attacks on healthcare facilities, often fuelled by misinformation about safe burial practices, as well as strikes by some unpaid health workers. Decades of unrest and outside interference on traumatised communities, as well as poor health and road infrastructure have also complicated the picture.\nMore than 70% of people die in the community and not in health centres, said Mohamed Janabi, the WHO’s regional Africa director.\nJean-Paul Malo Lotsima, a civil society official in the Djugu area of Ituri, told the AFP news agency: “People prefer to be treated at home, thinking it is a case of poisoning or some other illness.”\nHe added: “It’s often at the last minute, when the family realises that the situation is getting worse, that patients are taken to hospital. And sometimes, they die on the way.”\nFlavier Ngurima, who lives in Nizi, one of the hotspots of the outbreak in Ituri, said his brother died before reaching the treatment centre. “We had called on a nurse from the family to treat him at home because the patient and the family members were afraid to go to the ETC [treatment centre],” he said. “They said that over there, a lot of people die.”", "translation_ja": "", "vocab": [{"word": "surpass", "definition": "～を上回る、～を超える。期待や以前の記録を越えることを意味する。"}, {"word": "fatality ratio", "definition": "致死率。感染者のうち死亡した患者の割合を示す医学用語。"}, {"word": "sequencing", "definition": "遺伝子配列解析。ウイルスのDNAまたはRNAの塩基配列を決定するプロセス。"}, {"word": "hampered", "definition": "～を妨害する、～を阻害する。進展や活動を困難にすることを意味する。"}, {"word": "misinformation", "definition": "誤った情報、虚偽情報。事実でない不正確な情報が広がることを指す。"}, {"word": "transmission", "definition": "伝播、感染。病原体がある個体から別の個体へ移る過程を表す医学用語。"}]}, {"title_ja": "イスラエルのシリア空軍基地への最新攻撃：原因と影響", "title_en": "Israel's Latest Syria Airbase Attack: Causes and Consequences", "summary_ja": "イスラエルがシリアの空軍基地を攻撃し、国際的な非難を招いた。米国特使はこの攻撃がトルコ軍との直接的な軍事衝突を引き起こす危険があると警告した。この事件はイスラエルの戦略的動機とより広い地域への影響について疑問を提起している。", "summary_en": "Israel conducted an attack on a Syrian airbase that has drawn widespread international condemnation. A US envoy warned the strike risked triggering direct military confrontation with Turkish forces. The incident raises questions about Israel's strategic motivations and broader regional implications.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/inside-story/2026/8/19/whats-behind-israels-latest-attack-on-syria?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Inside Story\nWhat’s behind Israel’s latest attack on Syria?\nUS envoy warns Israel’s strike could have sparked direct confrontation with Turkish forces.\nAn Israeli attack on a Syrian airbase has been widely condemned.\nThe United States envoy warns the incident could have caused a direct confrontation with Turkish forces.\nSo why did Israel attack the base? And what are the implications?\nPresenter: Anna Burns-Francis\nGuests:\nMurat Yesiltas – Director of Foreign Policy Studies at the Foundation for Political, Economic and Social Research (SETA) think tank\nHaid Haid – Consulting fellow with the Middle East and North Africa Programme at Chatham House\nMichael Mulroy – Former US deputy assistant secretary of defence for the Middle East\nPublished On 19 Aug 2026", "translation_ja": "", "vocab": [{"word": "envoy", "definition": "政府または国家の代表として派遣される外交使節のこと。特に特定の目的や交渉のために派遣される高位の代表者を指します。"}, {"word": "confrontation", "definition": "対立や衝突のこと。特に敵対する勢力や国家間の直接的で緊張した対峙を意味します。"}, {"word": "implications", "definition": "ある事象から生じる結果や影響のこと。直接的には述べられていないが、論理的に導き出される意味や結果を指します。"}, {"word": "condemned", "definition": "厳しく批判する、非難することを意味します。特に政府や国際社会が公式に反対や不賛成を表明する場合に使われます。"}, {"word": "sparked", "definition": "～を引き起こす、きっかけを作るという意味の動詞。特に急速に広がる反応や対立を生じさせることを表します。"}]}, {"title_ja": "ケニア北部のヘリコプター墜落で7人が死亡、エクアドル情報機関幹部と米国ジャーナリストを含む", "title_en": "Seven killed in Kenya helicopter crash; Ecuador official and US journalist among dead", "summary_ja": "ケニア北部でサファリツアー客を乗せたヘリコプターが墜落し、乗員乗客7人全員が死亡した。死亡者にはエクアドルの情報機関トップであるミケーレ・センシ・コントゥギと米NBCユニバーサルのジャーナリスト、ホセ・スアレスが含まれている。ケニア民間航空局は調査を開始し、墜落現場での回収作業が続いている。", "summary_en": "A helicopter carrying tourists crashed in northern Kenya on Wednesday, killing all seven people on board including Ecuador's intelligence chief Michele Sensi-Contugi and NBCUniversal journalist Jose Suarez. The aircraft was operating a safari charter flight in a remote area of Samburu County when it went down at 9:13am local time. The Kenya Civil Aviation Authority has launched an investigation as recovery operations continue at the crash site.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/19/seven-mostly-tourists-killed-in-helicopter-crash-in-northern-kenya?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Seven people, mostly foreign tourists, killed in helicopter crash in Kenya\nEcuador’s intelligence chief Michele Sensi-Contugi and NBCUniversal journalist Jose Suarez are among the dead.\nA helicopter taking tourists on a safari has crashed in a remote part of northern Kenya, killing all seven people on board, including an Ecuadorian official and an American journalist.\nThe helicopter crashed at 9:13am local time (06:13 GMT) on Wednesday while flying from the Loisaba Conservancy to the Ewaso Nyiro area in Samburu County, according to the Kenya Civil Aviation Authority, which said in a statement that an investigation was under way.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Eleven killed in Kenya plane crash near Maasai Mara National Reserve\n- list 2 of 3Medical plane crash in Kenya kills at least six, injures two\n- list 3 of 3Bus carrying mourners overturns in Kenya, killing 25 people\nHelicopter crashes have happened with increasing regularity in Kenya, which has a vibrant tourism industry that depends on domestic carriers to ferry visitors to distant places like Mount Ololokwe.\nSix passengers and the pilot were on board the helicopter, officials said. David Nkoroi, the police commander for Samburu, told reporters that all seven people had died but did not reveal their identities.\nLater on Wednesday, Ecuador’s Transport Minister Roberto Luque said the country’s intelligence chief Michele Sensi-Contugi and his wife, Stephany Hollihan, were among those killed in the crash.\n“Today Michele and Stephany left us too soon. Thinking of their family, especially their children and parents,” Luque wrote on X.\nSensi-Contugi, 42, is a former businessman appointed as head of Ecuador’s National Intelligence Center in 2024. He was a close associate of right-wing President Daniel Noboa, whose country is mired in a security crisis.\nUS broadcaster NBCUniversal also said its journalist Jose Alberto Suarez – president and general manager of Telemundo 31, Telemundo 49, and Telemundo Fort Myers–Naples – was among those killed.\nA spokesperson for the United States Department of State said five US citizens were among the dead.\n“The US Embassy is in touch with local authorities and is providing consular assistance,” he said. “We extend our deepest condolences to the families and loved ones on their loss.”\nRecovery operations continue\nThe helicopter crashed in a rugged area in the foothills of Mount Ololokwe, a popular tourist destination in the country, local media reported.\nThe helicopter, owned by local company Lady Lori Helicopters, was carrying guests with travel company &Beyond. Lady Lori Helicopters said in a statement that the aircraft was operating a charter flight when it crashed.\nTropic Air Kenya, a local safari operator, said in a statement that it dispatched two of its helicopters to aid search and rescue operations.\nThe aviation authority said the aircraft was a Eurocopter EC130 B4.\nThe Kenya Red Cross said that its emergency response teams were “participating in a multiagency response effort as rescue teams work to access the crash site”.\nThree bodies were still trapped in the wreckage as of Wednesday evening, with recovery operations to continue on Thursday due to the ongoing flames at the crash site, Kenya’s Daily Nation reported.\nIn February, a Kenyan legislator was among six people who died after a helicopter crash in a hilly area of western Kenya.", "translation_ja": "", "vocab": [{"word": "intelligence chief", "definition": "国家情報機関の最高責任者。政府の機密情報や国家安全保障に関する業務を統括する重要な行政職。"}, {"word": "charter flight", "definition": "特定の顧客や団体向けに専用で運航される航空便。定期便ではなく、利用者の都合に合わせて運用される。"}, {"word": "aviation authority", "definition": "航空業界を監督・規制する政府機関。安全基準の設定や航空事故の調査などを担当する。"}, {"word": "consular assistance", "definition": "大使館領事部が提供する外国人への支援。パスポート手続きや緊急事態時の援助などが含まれる。"}, {"word": "multiagency response", "definition": "複数の異なる政府機関や組織が協力して対応すること。大規模な災害や緊急事態の際に実施される。"}, {"word": "wreckage", "definition": "墜落や衝突後に残された壊れた機体の残骸。事故の原因究明のために調査される。"}]}, {"title_ja": "スリランカの集団埋葬地で582体の遺骨を発見、子どもも含まれる", "title_en": "582 Skeletons Including Children Discovered in Sri Lanka Mass Grave", "summary_ja": "スリランカの集団埋葬地の発掘により、582体の遺骨が発見されました。これには乳幼児と子どもが含まれており、内戦中のタミル人民間人に対する軍による殺害疑惑に関連しています。この現場への調査は30年間遅延しており、戦争犯罪への責任追及と正義の実現に関する疑問が生じています。", "summary_en": "Excavations at a mass grave site in Sri Lanka have uncovered 582 skeletons, including infants and children, linked to alleged military killings of Tamil civilians during the country's civil war. The investigation into the site has been delayed for 30 years, raising questions about accountability and justice. Al Jazeera reports on this significant discovery that may shed light on decades-old allegations of war crimes.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/19/582-skeletons-including-children-discovered-in-sri-lanka-mass-grave?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "582 skeletons, including children discovered in Sri Lanka mass grave\nNewsFeed\n582 skeletons, including children discovered in Sri Lanka mass grave\nA Sri Lankan mass grave excavation has uncovered 582 skeletons, including babies and children. The site is linked to allegations of military killings of Tamil civilians during the civil war, with investigations delayed for 30 years. Al Jazeera’s Minelle Fernandez reports.\nPublished On 19 Aug 2026", "translation_ja": "", "vocab": [{"word": "excavation", "definition": "考古学的または地質学的目的で地面を掘ること。ここでは埋葬地から遺物や遺骨を掘り出す作業を指します。"}, {"word": "allegations", "definition": "証拠なしに誰かが何かをしたと主張すること。犯罪や不正行為の疑いを指摘する際に使用されます。"}, {"word": "accountability", "definition": "自分の行動に対して責任を取らなければならない状態。特に公務員や組織が違法行為の責任を問われることを意味します。"}, {"word": "civil war", "definition": "同じ国内の異なるグループ間で起こる武装紛争。スリランカではタミル人グループと政府軍の間で長年にわたり続きました。"}, {"word": "delayed", "definition": "予定より後に行われること、または遅延すること。ここでは調査開始が長期間延期されている状況を指します。"}]}, {"title_ja": "トルコ代表団訪問数時間後、イスラエルがシリア空軍基地を空爆", "title_en": "Israeli strikes hit Syrian air base hours after Turkish delegation visit", "summary_ja": "2026年8月18日、イスラエルはシリア北部のアブドゥフール空軍基地を空爆し、トルコ軍事代表団の出発から数時間後の攻撃となった。ネタニヤフ首相の事務所はシリアがトルコ軍配置を認めることで安全保障合意を違反していると主張した。トルコと国際社会は攻撃を非難し、トルコはシリアとの軍事協力を再確認しながら無許可の軍事駐留を否定した。", "summary_en": "Israel conducted airstrikes on the Abu Duhur air base in northern Syria on August 18, 2026, hours after a Turkish military delegation departed. Netanyahu's office claimed Syria was breaching security agreements by allowing Turkish troop deployment. Turkey and international observers condemned the attack, with Turkey denying unauthorized military presence while reaffirming military cooperation with Syria.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/israeli-strikes-hit-an-air-base-hours-after-a-turkish-delegation-visit-syrian-officials-say/article71366480.ece", "state_media": false, "category": "社会", "full_text": "A Turkish delegation had visited an air base in northern Syria the day before it was hit by Israeli airstrikes, Syrian officials said.\nThe Israeli strikes hit the Abu Duhur base early Tuesday (August 18, 2026), hours after the delegation had left, causing damage but no casualties. Israeli Prime Minister Benjamin Netanyahu's office said in a statement that Israel had attacked the base because Syria was “on the verge of breaching” an agreed-upon “status quo in security matters” by allowing Turkish troops to deploy there.\nTwo Syrian officials who spoke on condition of anonymity because they were not authorised to comment publicly said the Turkish delegation had visited the air base in the northwestern province of Idlib on Monday (August 17, 2026) to review rehabilitation work underway at the facility.\nIt was the first confirmation of a Turkish presence at the Abu Duhur base.\nTurkish and Syrian officials have not publicly commented on Turkiye's role there but have condemned the attack, as did Tom Barrack, the U.S. ambassador to Turkiye, who also serves as special envoy to Syria, and several Arab countries.\nTurkish officials on Wednesday (August 19, 2026) did not comment on the reported presence of a Turkish military delegation. But Turkiye's communications directorate accused Netanyahu of making “untenable allegations ... intended to legitimise Israel's unlawful airstrikes targeting Syria's sovereignty and territorial integrity.” It alleged that Netanyahu aimed “to pursue expansionist and destabilising policies in the region ahead of the elections in Israel.” Turkiye “will resolutely continue to cooperate with the Syrian Government on a legitimate basis for the establishment of peace, stability, and prosperity in Syria, and will never allow the destabilisation of Syria,” it said.\nThe Abu Duhur air base lies at a strategic location near the borders between Idlib, Aleppo and Hama provinces. During the time of former Syrian President Bashar al-Assad, who was ousted by a rebel offensive in December 2024, MiG-23 and MiG-21 fighter jets and L-39 aircraft operated out of the base.\nTurkiye has been supporting Syria's effort to rebuild its armed forces by training Syrian personnel at Turkish military schools and bases, and by supplying equipment and logistical support. Officials have not disclosed the types of equipment involved. The two countries signed an agreement last year that formalised their military cooperation.\nEarlier this year, Syrian troops also took part in military exercises held in Turkiye.\nTurkish officials have repeatedly stated that Ankara does not consider Syria's security separate from its own.\nIsrael, meanwhile, has remained suspicious of the new authorities in Damascus, led by former Islamist insurgents. Syria's interim President Ahmad al-Sharaa has said repeatedly that he does not want a conflict with Israel.\nIsrael carried out hundreds of airstrikes around Syria after Assad's fall, mainly destroying assets of the Syrian army to keep them out of the hands of his successors. The Israeli military also seized control of a U.N.-patrolled buffer zone in southern Syria, which it continues to occupy.\nThe Israeli army's chief of staff, Lt. Gen. Eyal Zamir, on Wednesday (August 19, 2026) toured the occupied area in Syria and told troops, “We will not allow hostile forces to establish themselves on our borders, and we will know how to use our operational capabilities precisely where and when needed.” Turkiye, a NATO member that also recently signed a defence pact with Saudi Arabia and Pakistan, did not indicate that it would respond militarily to the Israeli strikes in Syria, but the incident added further strain to already tense Turkish-Israeli relations.\nTurkiye and Israel once were close allies, but the relationship has been marked by deep frictions under Turkish President Recep Tayyip Erdogan's more than two-decade rule, despite brief periods of reconciliation. Erdogan is an outspoken critic of Israel's policies toward the Palestinians, while Israel has been angered by Erdogan's support for the Hamas militant group.\nThe fall of Assad's government further strained their relations as the two rivals sought to curb each other's influence in the neighbouring country, with some analysts fearing that they could be headed toward a proxy war.\nPublished - August 19, 2026 10:59 pm IST", "translation_ja": "", "vocab": [{"word": "breach", "definition": "合意や法律などを破る、違反する行為を指す。ネタニヤフ声明では、シリアが安全保障上の合意条件を違反しようとしていると主張した文脈で使用されている。"}, {"word": "untenable", "definition": "支持や正当化ができない、防守不可能な状態を示す。トルコはネタニヤフの主張が根拠のないものだと批判する際に用いている。"}, {"word": "expansionist", "definition": "領土や影響力を拡大しようとする政策や姿勢を指す。トルコはイスラエルの地域における覇権拡張の意図を批判する際に使用している。"}, {"word": "interim", "definition": "一時的な、暫定的な状態を表す。シリアの新しい指導体制が正式な政府確立までの過渡期であることを示している。"}, {"word": "proxy war", "definition": "直接戦わず、他国や勢力を通じて間接的に争う戦争形態。トルコとイスラエルがシリアで相互の影響力を争う可能性を指している。"}, {"word": "frictions", "definition": "政治的または外交的な対立や緊張を指す。トルコとイスラエル間の長年にわたる関係悪化を表現している。"}]}, {"title_ja": "ICC、米国の制裁を「司法独立への露骨な攻撃」と非難", "title_en": "ICC Condemns U.S. Sanctions as 'Flagrant Attack' on Court Independence", "summary_ja": "国際刑事裁判所（ICC）は、会長トモコ・アカネと検察官アブドゥラエ・セイェに対する米国の制裁を、司法独立への露骨な攻撃として非難した。イスラエル関連の捜査に対する米国の反発の一環である同制裁は、国連、EU、日本など多くの国から広く批判を受けた。この制裁は対象者の米国への入国とその金融システムへのアクセスを禁止している。", "summary_en": "The International Criminal Court denounced U.S. sanctions against its president Tomoko Akane and prosecutor Abdoulaye Seye as a flagrant assault on judicial independence. The U.S. action, part of Washington's campaign against the court over investigations involving Israel, drew widespread condemnation from the UN, EU, Japan, and other nations. The sanctions bar the officials from entering the U.S. and accessing its financial system.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/icc-says-us-sanctions-flagrant-attack-on-court-independence/article71366455.ece", "state_media": false, "category": "政治", "full_text": "The International Criminal Court on Wednesday (August 19, 2026) lashed out at the United States after Washington slapped sanctions on ICC president Tomoko Akane, calling it a \"flagrant attack\" on the court's independence.\nThe U.S. sanctioned Akane of Japan and trial lawyer Abdoulaye Seye of Senegal on Tuesday (August 18, 2026), as part of Washington's campaign against what it calls a \"corrupt and fatally politicised\" body.\nThe United Nations’ rights chief Volker Türk and the EU's top officials threw their support behind Akane and her top officials.\n\"Unacceptable new sanctions imposed by the USA against the International Criminal Court's President and a prosecution staff memb
