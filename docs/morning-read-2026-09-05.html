on": "国際銀行間通信協会。世界中の金融機関の支払い指示を安全に伝達するメッセージネットワークであり、国際決済システムの基盤となっています。"}, {"word": "foreign exchange margins", "definition": "為替手数料。通貨を変換する際に銀行が上乗せする利益幅。複数回の通貨変換により、手数料が累積する問題があります。"}, {"word": "monetary policies", "definition": "金融政策。中央銀行が金利やマネーサプライをコントロールして経済を調整する措置。ドル基軸システムでは米国の政策が他国に影響を与えます。"}, {"word": "bilateral", "definition": "二国間の。2つの国の間で直接行われる取引や協定。個別の二国間システム構築は拡張性が低いという課題があります。"}, {"word": "scalability", "definition": "拡張性。システムがより多くの利用者や取引量に対応できる能力。個別の二国間リンクでは大規模なネットワーク構築には向きません。"}, {"word": "hub", "definition": "中心地点。複数の参加国が共通のプラットフォームに接続する中央システムのこと。Project Nexusはこのハブ方式を採用しています。"}]}, {"title_ja": "中国、氷河崩落の懸念にもかかわらずブラマプトラ川メガダム建設を継続", "title_en": "China Proceeds With Brahmaputra Mega Dam Despite Glacial Collapse Concerns", "summary_ja": "中国はネパール・中国国境での壊滅的な氷河崩落の懸念にもかかわらず、チベットのヤルン・ザンポ川（ブラマプトラ川）上での大規模水力発電プロジェクト建設を進めている。「世紀のプロジェクト」と称される本計画は120兆元の投資で、年間60GW容量と3000億キロワット時以上の発電が見込まれている。インドは貯水量、トンネルが下流流量に与える影響、および中国からの水文データ共有の欠如について懸念を表明している。", "summary_en": "China is moving forward with construction of a massive hydropower project on the Yarlung Zangbo (Brahmaputra) River in Tibet despite fresh concerns from a devastating glacial collapse on the Nepal-China border. The project, described as the 'project of the century' with 1.2 trillion Yuan investment, is expected to generate 60 GW capacity and over 300 billion kilowatt-hours annually. India has expressed concerns about water storage, tunnel impacts on downstream flows, and the lack of hydrological data sharing from China.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/china-to-proceed-with-brahmaputra-mega-dam-despite-new-concerns/article71432282.ece", "state_media": false, "category": "経済", "full_text": "Fresh concerns triggered by the devastating glacial collapse along the Nepal-China border are unlikely to sway Beijing's plans to go ahead with the construction of a mega dam on the lower reaches of the Yarlung Zangbo, or the Brahmaputra River, in a seismically active region in Tibet near the border with India.\nOn July 23, 2026, a month before the August 26 flash flood and mudslides, China released its 15th Five-Year Plan for renewable energy, which called for advancing the construction of major projects, including the Yarlung Zangbo Lower Reaches Hydropower Project, as the mega dam project is referred to in China.\nUnderscoring the importance accorded to the plan, China’s Vice Premier Zhang Guoqing visited Nyingchi in Tibet, near the border, in April this year. \"We must shoulder the principal responsibility for project‑building and build this landmark mega project of the new era,” he was quoted as saying, adding that the government would “put quality first, safety as the foundation, strictly enforce construction standards and ecological‑environmental‑protection requirements, and keep construction progress subordinate to quality and safety.”\n‘Project of the century’\nAt a groundbreaking ceremony in July 2025, China’s second-ranked leader and Premier Li Qiang, who travelled to Nyingchi, announced the start of construction of what he called “the project of the century”. A total investment of 1.2 trillion Yuan (around ₹14 lakh crore) was announced for the construction of five power stations.\nSince then, there has been little public information about the project, although Mr. Zhang’s visit this year shed some light on how the project will go forward, including the setting up of the new State-run China Yajiang Group to run the entire project, which he inspected.\nChina has already opened one major dam on the middle reaches of the Yarlung Zangbo at Zangmu. A State media report earlier this month lauded the construction of the dam, saying it had “provided a solution to nearly 26 percent of electricity demand in Southwest China’s Xizang [Tibet] Autonomous Region”, the report said, detailing an elaborate “fishway” designed to help fish move between upstream and downstream sections. The report quoted design engineer Zhang Lianming as saying the fishway would likely be used for future projects.\nIn June this year, a “final acceptance meeting” of the Zangmu project was held, declaring that the dam, which started construction in 2010, had generated 22.2 billion kilowatt-hours of energy “equivalent to saving approximately 7.4 million tonnes of standard coal and cutting carbon dioxide emissions by around 22.2 million tonnes”.\nThe energy generation of the new project near the India border, where the course of the Yarlung Zangbo stunningly falls over the “great bend” and turns towards India, is expected to easily dwarf Zangmu.\nWhile there have been no official projections, Chinese analysts project 60 GW installed capacity and 300 billion kilowatt-hours of power a year, more than three times the Three Gorges.\nWhile the project has been described as a “run-of-the-river” dam, it will also involve the construction of a reservoir. This is likely to be located in the town of Mainling, upstream of Nyingchi, a prefecture-level city that is also home to a key airport, according to an analysis published on Wednesday by David Fishman, a Shanghai-based analyst writing on energy who looked at reports of relocations to ascertain the likely location. The water will be diverted at the top of the great bend into an approximately 40-km-long tunnel, Mr. Fishman wrote on his Substack, “Crossing the River”, as its descending force powers five 12-GW powerhouses before rejoining the river.\nIndia’s concerns\nOf concern to India is how much water is likely to be stored in the reservoir and how the tunnel will affect downstream flows, as well as possible broader ecological impacts. The lack of information has posed an obstacle in assessing the possible impact.\nLater this month, India and China will hold a meeting of the Expert-Level Mechanism on Trans-border Rivers. However, the sharing of hydrological data, officials say, has not been regular and has on occasion been suspended during difficult periods in relations.\nAsked about the project, China’s Foreign Ministry spokesperson Guo Jiakun said last year that Beijing “always maintained a highly responsible attitude toward transboundary river development and has rich experience in hydropower project development”. He said the “construction of the project is beneficial for disaster prevention and mitigation throughout the entire river basin and will not have adverse effects on downstream areas”.\n“China has conducted hydrological reporting, flood control, and disaster reduction cooperation with relevant downstream countries and has also engaged in necessary communication regarding the project,” he said.\nPublished - September 05, 2026 09:37 pm IST", "translation_ja": "", "vocab": [{"word": "seismically active", "definition": "地震活動が活発な地域または地帯を指す。地質学や土木工学では、構造物の安全性評価に重要な用語。"}, {"word": "transboundary", "definition": "国境を越えた、複数の国にまたがる事項を指す。河川や環境問題など国際協力が必要な分野で使用される。"}, {"word": "hydrological data", "definition": "水の流量、降水量、水位などに関する科学的データを意味する。ダム建設や水資源管理で重要な情報。"}, {"word": "run-of-the-river", "definition": "川の流れをそのまま利用して発電するダムの形式。大規模な貯水池を持たない設計方式を指す。"}, {"word": "installed capacity", "definition": "発電所などが最大限に発揮できる電力出力能力。GW（ギガワット）などの単位で表される。"}, {"word": "ecological impacts", "definition": "生態系や環境に対する悪影響や変化。開発プロジェクトの環境評価で重要な検討項目。"}]}, {"title_ja": "ドナルド・トランプが残す長期的な悪影響", "title_en": "The Lasting Damage of Donald Trump's Presidency", "summary_ja": "スーザン・デラクール氏は、ドナルド・トランプの政治的影響力が彼の任期を大きく超えて続くことを分析している。同氏は、トランプが引き起こした分裂、制度的損害、民主的規範の侵食が政治舞台から去った後も長く残ると主張している。", "summary_en": "Susan Delacourt examines how the impact of Donald Trump's political career extends far beyond his time in office. The columnist argues that the divisions, institutional damage, and erosion of democratic norms he has caused will persist long after he leaves the political stage.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9wFBVV95cUxPSWtUdGV6bnNXM1lCWGNWMlJoU0p4NDRlUDBMSjVOel8wNWtWdTBoQ1drZTV3LTBtNU1IdnhZRHZvVUpaTkNzYk16NEV6W ている。", "summary_en": "O Globo, a prominent Brazilian newspaper, reflects on its storied past while positioning itself for future growth and innovation. The publication emphasizes its commitment to quality journalism and its role in Brazil's media landscape.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "リオのサント・ダイメ指導者、元信者への詐欺的性的暴力で告発", "title_en": "Santo Daime Leader Accused of Sexual Assault Against Former Followers in Rio", "summary_ja": "サント・ダイメ宗教運動の著名な指導者パドリーニョ・パウロ・ロベルト氏が、リオデジャネイロの教会で元信者に対する詐欺的性的暴力の告発に直面している。疑惑は宗教的権威を利用した虐待を伴っている。本件は精神的コミュニティ内での不正行為の可能性に注目を集めている。", "summary_en": "Padrinho Paulo Roberto, a prominent leader of the Santo Daime religious movement, faces accusations of sexual violation through fraud against former followers at a church in Rio de Janeiro. The allegations involve the abuse of his position of religious authority. The case has drawn attention to potential misconduct within the spiritual community.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilAJBVV95cUxPRjJ4Skl2TDVtc2F0UXdMazZwSEJrNWMzTEJBOEVYS0dGSEJMV1l1eE9qVVg3akhZNFdNX2ZwZGVpdGtidFVaQmFES01FamdHS1c2Sk9nYkV2Q1YwZ1RjMV9UY0VBTWVBWHhTa3dmWndzVEVaQUNsWkVvb2FPVm9rLWJENExSdlJrY2g2dFN1UVpyQm00eHpxR3Y1Qy0zV2lrZXBzUlhzVmxtVkwtZXFyUnZnQzJRNkVLbU1qMDBlTTRGZVFkNGwzeFIxUGtCbzY2QU5lQ1BHZVJodDBMQjJGYm9OTmpleFVXbFdtU09HS3BfTTFoWVdEeE9jZDE1VXBoN1ZDd293azVGdlN2aHBGUlBwa1bSAaMCQVVfeXFMUGhIUHhkTFRmSnRVRmFGTjZCTy1DNzNFdW5XRGhNdmJmNUp5U3RRY05OcTJKUDNLa2J6Z1d2TThpMmlKUDNndFM0X0dPZGo4TFlPb0U4QWNsbmlYV3B1Q1oxbEZvN1RldXQ1dEctaXA2dVVSSGxJTkFYOWo4NjBkMzg2UWpxZTNCQTVSSUNqbDFBX2ZpbzhtdlFvMmNqb3V2cWEtWHd1N01heUhubjdzUVlyQTZKZm1sSWpWdW90ZnQ5Z0VXdXNOM2oyVUxOZGhYckpSbW93MWlDMTItaEdBTlZIYjd0dUZHWDhZNmhvaG13aDFvVDRLN05DNlN2SC1QYTlfNWZDM1dCNDg1aDhrbmJBMk11RFhOX2hDM09UN0J4UUtN?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シューティングスターズ、CAF連盟杯でCS スファクシアンに初戦勝利", "title_en": "Shooting Stars secure slim first leg victory over CS Sfaxien in CAF Confed Cup", "summary_ja": "アベオクタのMKO アビオラ スポーツアリーナで行われたCAF連盟杯初戦で、イバダンのシューティングスターズがチュニジアのCS スファクシアンを1-0で下した。ラッキー・エマヌエルが25分に決勝ゴールを決め、ナイジェリアのチームは後半のCS スファクシアンの猛攻に対してもディフェンスで踏ん張った。この勝利は来週末の第2戦に向けて重要なアドバンテージをもたらした。", "summary_en": "Shooting Stars of Ibadan defeated Tunisian side CS Sfaxien 1-0 in their CAF Confederation Cup first leg match at the MKO Abiola Sports Arena in Abeokuta. Lucky Emmanuel scored the decisive goal in the 25th minute, and the Nigerian side's defense held firm despite strong pressure from CS Sfaxien in the second half. The victory gives Shooting Stars an important advantage heading into the second leg next weekend.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/sports/football/907655-caf-confed-cup-shooting-stars-secure-slim-first-leg-victory-over-cs-sfaxien.html", "state_media": false, "category": "社会", "full_text": "Shooting Stars of Ibadan secured a 1-0 victory over Tunisian side, CS Sfaxien in their CAF Confederation Cup encounter at the MKO Abiola Sports Arena, Abeokuta, on Saturday.\nLucky Emmanuel scored the decisive goal in the 25th minute to give the Nigerian side a deserved lead before the break.\nCS Sfaxien came out strongly in the second half, piling pressure on Shooting Stars in search of an equaliser but the goal keeper was too good to let in any goal.\nHowever, the Shooting Stars defence remained resolute, frustrating the Tunisian side and preventing them from finding a way through.\nREAD ALSO: D’Tigress suffer second straight World Cup defeat against Hungary\nShooting Stars had opportunities to extend their lead towards the end of the match but failed to convert the chances.\nThe victory gave Shooting Stars an important advantage ahead of the second leg of their CAF Confederation Cup campaign next weekend.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "confederation", "definition": "複数の団体や国が共通の目的で協力する組織のこと。スポーツの文脈では、大陸単位のサッカー連盟などを指す。"}, {"word": "resolute", "definition": "困難な状況でも揺るがない、確固とした態度や決意を示す形容詞。守備が堅固であることを表現する際に用いられる。"}, {"word": "decisive", "definition": "試合や競争の結果を左右する重要な行動や瞬間を表す形容詞。特にゴールが試合を決める際に使われる。"}, {"word": "piling pressure", "definition": "相手に対して継続的に負荷や圧力をかけるという意味の表現。スポーツでは攻撃を仕掛け続けることを指す。"}, {"word": "frustrating", "definition": "相手の期待や目標を達成させないようにする、または相手を困らせるという意味の動詞。防御側が攻撃側を阻止する場合に使う。"}, {"word": "advantage", "definition": "競争や試合において有利な立場または状態。次の試合で有利になるポジションを示す。"}]}, {"title_ja": "税務改革の成功は納税者体験の向上で測定される—NRS議長が言及", "title_en": "Tax Reform Success Measured by Improved Taxpayer Experience, Says NRS Chairman", "summary_ja": "ナイジェリア歳入庁のザック・アデデジ議長は、税務改革の最終的な成功の指標は、歳入徴収の改善、コンプライアンスの向上、納税者体験の向上を含むと述べた。実施開始から1年で、18の州が調和した税法を国内法化し、徴収項目を50以上から9に削減した。また、カドゥナ州の税務コンプライアンスは35%から65%に上昇した。", "summary_en": "Dr Zacch Adedeji, Chairman of Nigeria Revenue Service, stated that the ultimate measure of tax reform success includes improved revenue mobilisation, greater compliance, and better taxpayer experience. One year into implementation, 18 states have domesticated harmonised tax laws, reducing collection items from over 50 to nine, while tax compliance in Kaduna State rose from 35% to 65%.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/907653-ultimate-measure-of-success-of-tax-reform-is-better-taxpayer-experience-adedeji.html", "state_media": false, "category": "社会", "full_text": "The Chairman of Joint Revenue Board (JRB) and the Nigeria Revenue Service (NRS), Dr Zacch Adedeji has stated that the ultimate measure of success of the nation’s tax reform must be improved revenue mobilisation, greater compliance, a better taxpayer experience and stronger contribution to national development.\nIn his opening remarks at the 160th Joint Revenue Board meeting in Kaduna on Wednesday, Dr Adedeji said that encouraging progress has been recorded in institutional reform of the tax ecosystem. The Joint Revenue Board Chairman who was represented by Muhammad L Abubakar, Executive Director in charge of Finance and Corporate Services, Nigeria Revenue Service (NRS), further listed digitalisation, data integration, harmonisation and collaboration as other aspects of the revenue architecture that have recorded significant progress since the introduction of the new tax regime.\nDr Adedeji described the theme of the 160th meeting, “One Year of Reform: Assessing Progress and Addressing Challenges”, as a call on the Board to take stock of the progress made in the implementation of the reform, remediate identified gaps and confront the challenges that May emerge.\nGiving an overview of the progress made one year into the implementation of the tax reform during the meeting, the Executive Secretary of the Joint Revenue Board, Mr Olusegun Adesokan, hinted that 18 State Houses of Assembly have domesticated the model harmonised taxes and levies law as the nation’s apex tax authorities move to curb the menace of tax overlapping and duplication across Nigeria.\nThe Executive Secretary said the new legislation has reduced the over 50 collection items hitherto administered by States and Local Government Areas to nine sub-heads.\nThe model law also abolishes cash collection and mounting of roadblocks for collection of revenue. The JRB Executive Sectetary said the measure has recorded a significant success in the harmonisation of taxes and levies by the subnational.\nAddressing the misconception that the tax reform has increased taxes, Mr Adesokan said the reform has rather reduced tax burden on low-income earners and eliminated multiple nuisance taxes while providing reliefs for low income-earners and micro-scale businesses.\nThe Executive Secretary appreciated the Kaduna State Governor, Uba Sani for hosting the 160th meeting and for his consistent support of the tax reform initiative. He particularly appreciated the governor for nominating a member of the Board and outgoing Executive Chairman of Kaduna State Internal Revenue Service, Mr Jerry Adams as his running mate for the 2027 gubernatorial election.\nThe Board, which is the apex body for revenue administration in Nigeria, took an assessment of the progress and challenges of the tax reform, one year into the commencement of its implementation.\nThe Board held that it was imperative for revenue authorities to come together to reflect on their experiences under the new revenue regime and chart the way forward where concerns arise.\nThe meeting which took place on Wednesday in Kaduna and was declared open by the host State Governor, Senator Uba Sani.\nGovernor Sani said the tax reform has expanded the opportunities for domestic resource mobilisation for the development of the country, stating that the deeper benefits of the reform would be to build institutions that will sustain the gains of the reform and command the confidence of taxpayers.\n“The objective of the reform should not be simply to collect revenue, it should be to build a tax system in which compliance becomes easier, enforcement becomes more intelligent and voluntary compliance becomes a norm”, he cautioned.\nEarlier in his welcome address, the outgoing Executive Chairman of Kaduna State Internal Revenue Service, Mr Jerry Adams, acknowledged the collaboration between revenue authorities and other stakeholder agencies within the tax ecosystem, saying that such relationship has proven useful in the implementation of the tax reforms.\nMr Adams said tax compliance in Kaduna State has risen from about 35 percent to 65 percent in the last three years under Governor Sani, a win he attributed to increased taxpayers’ confidence in the performance of the Governor whom he said has delivered many life-touching projects cutting across sectors including health, agriculture, education and infrastructure.\nThe Joint Revenue Board is composed of the 38 revenue authorities in the country, including the Nigeria Revenue Service, the 36 States and the FCT Internal Revenue Services. It also has the Federal Ministry of Finance, the Nigeria Immigration Service, the Nigeria Customs Service, Revenue Mobilisation, Allocation and Fiscal Commission, Federal Road Safety Commission, National Identity Management Commission and the Chartered Institute of Taxation of Nigeria.\nThe 160th meeting was the second held by the Board in 2026.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "domesticated", "definition": "国内法として採択または統合されたことを意味する。国際的な法律や制度を各国の法律体系に組み込むプロセスを指す。"}, {"word": "harmonised", "definition": "異なる規則や法律を統一または調整することを意味する。複数の地域や組織間で一貫性を作り出すために標準化すること。"}, {"word": "mobilisation", "definition": "資源やお金を集めて有効に活用するために組織することを意味する。特に経済的な資源を目的達成のために動員すること。"}, {"word": "apex", "definition": "組織や体系の最頂点または最高位の地位を意味する。最も高い権限や重要性を持つレベルを示す。"}, {"word": "remediate", "definition": "問題や欠陥を修正または改善するための行動を取ることを意味する。特に環境や制度における問題解決プロセスを指す。"}, {"word": "subnational", "definition": "国家レベルより下の行政区域（州や地方自治体など）に関連することを意味する。中央政府以外の地域の権限体制を指す。"}]}, {"title_ja": "ティヌブ政権と恫喝政治", "title_en": "Tinubu Administration and the Politics of Intimidation", "summary_ja": "野党指導者アティク・アブバカルの追及が真の反腐敗活動か政治的生き残り戦術かを問う批評的分析。政権による対立者への積極的な追及と、ティヌブ大統領が米国でFBI記録を隠す法的努力との矛盾を指摘。著者は国家機関の選別的な武器化が民主主義原則を損なわせ、公正な選挙競争を脅かすと警告している。", "summary_en": "A critical analysis questioning whether the Tinubu administration's pursuit of opposition leader Atiku Abubakar represents genuine anti-corruption efforts or political survival tactics. The article contrasts the government's aggressive scrutiny of opponents with President Tinubu's legal efforts to withhold FBI records about himself in the US. The author warns that selective weaponization of state institutions undermines democratic principles and threatens fair electoral competition.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/907649-the-tinubu-administration-and-the-politics-of-intimidation-by-paul-ibe.html", "state_media": false, "category": "政治", "full_text": "The Tinubu administration owes Nigerians an answer. Until it provides one that withstands scrutiny, Nigerians are entitled to question whether what is being presented as an anti-corruption operation has become entangled with the politics of political survival.\nThere comes a point in the life of every government when its actions begin to tell a story far more revealing than its words.\nThe story now being told by the Tinubu administration is increasingly difficult to ignore: When an incumbent government begins to feel politically threatened, the institutions of state suddenly become intensely interested in its opponents.\nThe latest episode is the move to bring former Vice President and African Democratic Congress (ADC) presidential candidate, Atiku Abubakar, under the scrutiny of the Economic and Financial Crimes Commission (EFCC).\nThe question Nigerians should be asking is not merely: What is the allegation?\nIt is: WHY NOW?\nIn September 2017, Atiku Abubakar publicly challenged anyone with evidence of his involvement in corruption or the embezzlement of public funds to submit such evidence to the appropriate anti-corruption agencies.\nHe has reiterated that challenge over the years.\nThis is not a man who has been hiding from scrutiny.\nAs Vice President from 1999 to 2007, Atiku was subjected to investigations by the government of President Olusegun Obasanjo. He subsequently fought several legal battles arising from allegations against him and efforts to damage his reputation, winning important victories in court, which have deepened our democracy.\nThen came nearly two decades during which different administrations controlled the machinery of the Nigerian state.\nGovernments came and went. Political parties changed. Presidents changed. Anti-corruption agencies continued to operate.\nYet no successive administration found it necessary to prosecute Atiku Abubakar for corruption.\nUntil now. Now, as Nigeria moves toward another presidential election, Atiku has emerged as the principal opposition challenger to President Bola Tinubu.\nAnd suddenly, an old allegation acquires new urgency.\nSuddenly, the EFCC is being drawn into the matter. Suddenly, an opposition presidential candidate is facing precisely the kind of state attention that inevitably raises questions about political motivation.\nBut there is an even more troubling dimension to this. It is difficult to reconcile the administration’s professed commitment to transparency and accountability with President Tinubu’s own ongoing legal effort in the United States to prevent the release of FBI, DOJ and DEA records relating to historical investigations involving him.\nThe records sought in that FOIA litigation include FBI materials and interview records from the early 1990s concerning investigations into drug-trafficking allegations. Tinubu’s legal team has asked the US court to maintain redactions and withholdings, arguing, among other things, that the records are protected by privacy rights.\nTo be clear, the existence of those records or the ongoing FOIA dispute does not itself establish criminal wrongdoing by President Tinubu.\nBut that is precisely why the contrast is so striking.\nHow can an administration demand maximum scrutiny of an opposition candidate, while simultaneously resisting the public release of records that could help Nigerians understand longstanding questions surrounding the President himself?\nIf transparency is the principle, it must apply to everyone. If accountability is the standard, it cannot be selectively applied. And if anti-corruption agencies are genuinely independent, they must not be engineered into instruments for achieving political ends.\nNigerians understand the difference between genuine accountability and politically convenient accountability. They understand that corruption must be investigated regardless of who is involved.\nBut they also understand that the selective deployment of state institutions can itself become a form of political corruption.\nThe Tinubu administration must therefore answer a simple question: what changed?\nDid investigators suddenly uncover evidence that successive administrations did not have? Did new facts emerge? Or did Atiku simply become politically inconvenient?\nThat question becomes even more important in light of the wider concerns surrounding the treatment of opposition politicians and the use of state institutions in the political contest ahead of 2027.\nTaken individually, each incident may be explained away. Taken together, however, they paint a disturbing picture.\nAnd Nigerians should be concerned. Because democracy is not merely about holding elections. It is about ensuring that the competition preceding those elections is free, fair and conducted on a level playing field.\nAn incumbent government possesses enormous advantages: control of state resources, visibility, security agencies, regulatory institutions and the machinery of government. That power comes with an obligation not to weaponise the ", "translation_ja": "", "vocab": [{"word": "entangled", "definition": "複雑に絡み合った、巻き込まれた状態を意味する。政治的動機と反腐敗活動が相互に絡み合っている状況を表現するのに使われます。"}, {"word": "scrutiny", "definition": "厳密な調査や検査。政治家や機関が詳細に調べられる状況を指す。"}, {"word": "embezzlement", "definition": "横領、公的資金や信託資金の個人的な流用。犯罪行為として使用される法律用語です。"}, {"word": "selective deployment", "definition": "選別的な配置・展開。ここでは、国家機関が特定の政治的目的を達成するために意図的に使い分けられることを意味します。"}, {"word": "weaponize", "definition": "武器化する、政治的目的のために制度や権力を悪用すること。民主的プロセスを損なわせる行為を指します。"}, {"word": "incumbent", "definition": "現職の、在職中の。権力を持つ現政権や現職者を指す政治用語です。"}, {"word": "withstands scrutiny", "definition": "詳細な検査に耐える、厳密な検証を経ても成立する。主張や証拠の信頼性を評価する際に使われます。"}]}, {"title_ja": "プーチン大統領、トランプ大統領の特使クシュナーとウィトコフとモスクワで会談し、ウクライナ戦争について協議", "title_en": "Putin Meets Trump's Envoys Kushner and Witkoff to Discuss Ukraine War", "summary_ja": "ウラジーミル・プーチン大統領は、トランプ大統領の特使ジャレド・クシュナーとスティーブ・ウィトコフとの会談を前に、キーウへの攻撃を一時的に中止するよう命じた。この会談はウクライナ紛争に対処するための外交的取り組みを示している。プーチンの軍事作戦の一時停止決定は、交渉への潜在的な開放性を示唆している。", "summary_en": "President Vladimir Putin ordered a temporary halt to strikes on Kyiv ahead of meetings with President Trump's envoys, Jared Kushner and Steve Witkoff. The talks represent a diplomatic effort to address the ongoing Ukraine conflict. Putin's decision to pause military operations signals a potential openness to negotiations.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/05/world/europe/russia-ukraine-witkoff-kushner-moscow.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネパールの洪水で埋もれた家から女性が生存したまま救出される", "title_en": "Nepal Floods Buried a House. The Woman Inside Was Still Alive.", "summary_ja": "ネパールの洪水で埋もれた家から女性が生存したまま救出され、被災地に希望をもたらした。同日午前には別の生存者がトンネルから救出されており、災害地域での救助活動が続いている。", "summary_en": "A woman was rescued alive from a house buried by flooding in Nepal, providing a glimmer of hope to a devastated community. Earlier on Saturday, another survivor had been extracted from a collapsed tunnel, offering continued encouragement for rescue efforts in the disaster-stricken region.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/05/world/asia/nepal-floods-chinese-worker-rescue.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハカビー駐イスラエル米国大使、入植者によるパレスチナ人攻撃を非難", "title_en": "Huckabee Condemns Settler Attacks on Palestinians Following International Pressure", "summary_ja": "イスラエル駐在米国大使マイク・ハカビーは、イスラエル入植者によるパレスチナ人への暴力的攻撃に対する国際的な批判を受け、ウェストバンクでパレスチナ人との対話集会に臨んだ。この訪問は緊張関係に対処するための珍しい外交的取り組みを示している。ハカビーはこれらの攻撃をテロ行為として非難する声明を出した。", "summary_en": "U.S. Ambassador to Israel Mike Huckabee made an unusual visit to meet with Palestinians in a West Bank town hall, responding to global criticism over violent attacks by Israeli settlers. The visit represents a rare diplomatic engagement aimed at addressing tensions following the controversial incidents. Huckabee's statements condemned the attacks as acts of terrorism.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/05/world/middleeast/huckabee-west-bank-settler-attacks.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事区域の通行を許可、パレスチナ人がガザ北部へ戻る", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Military Crossing Restrictions", "summary_ja": "イスラエルは人質解放交渉の膠着状態が解決した後、ガザを二分する軍事地帯の通行をパレスチナ難民に許可した。この決定により、長期間にわたり通行を阻まれていた数千人の住民がガザ北部への帰還を開始できるようになった。この通行再開は、人質交換をめぐる膠着状態の打開を示すものである。", "summary_en": "Israel has allowed displaced Palestinians to resume crossing through a military zone that divides Gaza following a breakthrough in hostage release negotiations. The move enables thousands of residents to return to the northern part of the enclave after being blocked from crossing for an extended period. The reopening marks a significant shift after the deadlock over hostage exchanges was resolved.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Deepening Real-Estate Crisis", "summary_ja": "中国最大級の不動産開発企業であるVankeが巨額の損失を報告し、同国の不動産低迷の拡大への懸念が高まっている。この損失は大手開発企業の経営安定性に関する疑問を生じさせており、中国当局が不安定な不動産セクターの安定化に向けた追加的な介入措置を講じるかどうかが注視されている。", "summary_en": "Vanke, one of China's largest property developers, has reported a significant loss, intensifying concerns about the spread of the country's real-estate downturn. The losses raise questions about the stability of major developers and whether Chinese authorities will implement additional intervention measures to stabilize the troubled sector.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃の破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From Oct. 7 Attack", "summary_ja": "イスラエル医療当局によると、最近解放されたイスラエル人人質は10月7日の攻撃による砲弾の破片が体内に埋め込まれたままの状態にある。一部の女性は長期間隔離され、8ヶ月間トンネルに閉じ込められていたという。医学的知見は、人質が拘束中に被った重大な外傷と負傷を浮き彫りにしている。", "summary_en": "Recently freed Israeli hostages retained shrapnel embedded in their bodies from the October 7 attack, according to Israeli medical officials. Some women were held in isolation for extended periods and spent eight months confined in tunnels. The medical findings highlight the severe trauma and injuries sustained by hostages during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "仕事が家族をより平等にする方法", "title_en": "How Work Makes Families More Equal", "summary_ja": "エコノミスト誌は、就労を通じた経済的自立がいかに家族ダイナミクスを変え、世帯内の不平等を減らすかを探究しています。同誌は、従来の構造ではなく、稼ぐ能力がパートナー間のより均衡した関係を生み出すと主張しています。", "summary_en": "The Economist explores how financial independence through employment transforms family dynamics and reduces inequality within households. The article argues that earning capacity, rather than traditional structures, creates more balanced relationships between partners.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/03/how-work-makes-families-more-equal", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ戦争の激化と膠着：スウェーデンが50年のロシア対峙に備える", "title_en": "Ukraine War Intensifies as Sweden Prepares for Decades of Russian Confrontation", "summary_ja": "ウクライナでの紛争は激化・拡大する一方で、戦場では膠着状態が続いている。ウクライナの同盟国となったスウェーデンは、50年間にわたるロシアとの対峙に備えている。この悲観的な見通しは、戦争の長期的展開と地域の安定性に対する深刻な懸念を反映している。", "summary_en": "The conflict in Ukraine is escalating and expanding while remaining deadlocked on the battlefield. Sweden, now a Ukrainian ally, is bracing for a prolonged confrontation with Russia that could last 50 years. The grim outlook reflects deep concerns about the long-term trajectory of the war and regional stability.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/01/the-ukraine-war-is-intensifying-expanding-and-stuck", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIが宗教を変え、宗教がAIを変えようとしている", "title_en": "AI is Changing Religion and Religions are Trying to Change AI", "summary_ja": "チャットボットなどの人工知能は宗教的指導と実践を再構築しており、これらのテクノロジーが伝統的な精神指導者に取って代わるのか、それとも彼らのメッセージを広げるのかという疑問が生じています。世界中の宗教機関は、信仰の中核をなす人間関係を保ちながらAI技術を活用する方法を模索しています。この緊張は、伝統的に聖職者と精神的指導者が仲介してきた人間生活の親密な側面におけるAIの役割についての広範な懸念を反映しています。", "summary_en": "Artificial intelligence and chatbots are reshaping religious practice and guidance, raising questions about whether they will replace traditional spiritual advisors or amplify their reach. Religious institutions worldwide are grappling with how to leverage AI technology while maintaining the human connection central to faith. The tension reflects broader concerns about AI's role in intimate aspects of human life traditionally mediated by clergy and spiritual leaders.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/27/ai-is-changing-religion-and-religions-are-trying-to-change-ai", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "バルデラ氏、ルペン党首のスカーフと年金政策から距離を置く", "title_en": "Bardella distances himself from Le Pen's headscarf and pension policies", "summary_ja": "フランス極右政党国民連合の副党首ジョルダン・バルデラ氏は、マリーヌ・ルペン党首のスカーフと年金に関する主要公約から距離を置いた。党内の主要選挙公約をめぐる意見の相違と、スタッフ離職に関する矛盾を示唆している。", "summary_en": "Jordan Bardella, deputy leader of France's far-right Rassemblement National, has distanced himself from Marine Le Pen's flagship proposals on headscarves and pensions. The move signals internal disagreement within the party over key electoral promises and contradictions regarding staff departures.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/09/06/far-right-figure-bardella-is-uneasy-about-le-pen-s-election-platform-on-headscarves-and-pensions_6757203_5.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "プーチン大統領、ウクライナ戦争終結に向けて米国特使との会談を実施", "title_en": "Putin meets US envoys Witkoff and Kushner for Ukraine peace talks", "summary_ja": "ロシアのプーチン大統領は土曜日、ウクライナ戦争終結を目指す米国特使との会談を開始した。この戦争は4年以上続いており、数十万人の死者と数百万人の避難民を生み出している。プーチン大統領は、モスクワが今夏集中砲撃を行っているキーウでの米国特使の安全を保証することを述べた。", "summary_en": "Russian President Vladimir Putin held talks with US envoys on Saturday aimed at ending the four-year-long Ukraine war that has caused hundreds of thousands of deaths and millions of displacements. Putin pledged to ensure the safety of the American envoys in Kyiv, despite Moscow's recent intensified strikes on the Ukrainian capital. The discussions represent a significant diplomatic effort to negotiate a resolution to the ongoing conflict.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/04/trump-sends-envoys-to-moscow-and-kyiv-with-a-proposal-to-end-the-war_6757178_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "人種差別といじめ：フランスの田舎町が21歳青年の自殺後に真実を求める", "title_en": "Racism and Hazing: French Town Seeks Answers After 21-Year-Old's Suicide", "summary_ja": "21歳のジョリス・ローランサン青年の家族は、7月の自殺が若い男性とその仲間からの人種差別的な侮辱と繰り返されたいじめに関連していると確信している。当局はいじめ、言葉の暴力、人種に基づく死の脅迫、心理的嫌がらせ、および自殺の扇動について調査を開始した。この事件はフランスの田舎のコミュニティに差別と青年暴力の問題に直面することを促している。", "summary_en": "The family of 21-year-old Joris Laurencin believes his suicide in July was linked to racist insults and bullying by a young man and his gang. Authorities have launched an investigation into hazing, verbal abuse, death threats based on race, psychological harassment, and incitement to suicide. The case has prompted the rural French community to confront issues of discrimination and youth violence.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/09/05/racist-insults-and-hazing-after-the-suicide-of-21-year-old-joris-a-rural-french-town-searches-for-answers_6757199_7.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省ニュースレター更新", "title_en": "Mindef Newsletter Update", "summary_ja": "これは海峡時報が配信した防衛省（Mindef）のニュースレター通知です。読者は提供されたリンクを通じて追加の無料ニュースレターを購読し、購読設定を管理できます。", "summary_en": "This is a notification from the Ministry of Defence (Mindef) newsletter distributed by The Straits Times. Readers can subscribe to additional free newsletters and manage their subscription preferences through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートニュースレターは、毎日のニュースブリーフィングと最新情報を提供します。読者は提供されたリンクから追加の無料ニュースレターを購読し、購読設定を管理できます。", "summary_en": "The Straits Times Evening Update newsletter provides daily news briefings and updates. Readers can subscribe to additional free newsletters and manage their subscription preferences through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツタイムズは、読者に最新のニュースと情報を提供するための日刊モーニングブリーフィングニュースレターを配信しています。購読者はニュースレターの設定を管理し、ストレーツタイムズからの追加の無料ニュースレターに登録することができます。", "summary_en": "The Straits Times provides a daily morning briefing newsletter to keep readers informed on the latest news and updates. Subscribers can manage their newsletter preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グロリア・スタイネム：フェミニズムの象徴と反ユダヤ主義への抵抗", "title_en": "Gloria Steinem: Feminist Icon and Voice Against Antisemitism", "summary_ja": "伝説的なフェミニスト活動家グロリア・スタイネムは、女性の権利のための先駆的な提唱者であると同時に、反ユダヤ主義に対する声高い反対者でもありました。この記事は、スタイネムがどのようにプラットフォームを使用して、どこに現れても差別に立ち向かったかを強調しており、差別への抵抗が共有された責任であるという原則を体現しています。", "summary_en": "Gloria Steinem, the legendary feminist activist, was not only a pioneering advocate for women's rights but also a vocal opponent of antisemitism. The article highlights how Steinem used her platform to confront prejudice wherever it appeared, embodying the principle that standing against discrimination is a shared responsibility.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijgJBVV95cUxOaTRQdWVWbDdoQ21NOHozd20yYVYxZ0RhZi1feXBhN2EyMXJQTlZzbEtMaHdESWpsb21SS3JMUEJMSGNMOUtOTlg0X3dkbS1kYWxDSkVjZUtKSEJHZmVEMThha0RpMXZyQUxXYjFCeHlabEgxeGs1eHU1NVctOUc3eHFoYW9VRW1nMldXWFpnN0FuTjd6aEpNY3FWWHROTmF2R25LSHNEbDFEeWx5eF9wTjA4b1gwdDBGZUlpQWpRNERzSDI4Z1lDOFBFMWxqc013ZFdLYmdqZ0sycTNBak92aTRBWGZRYWdHQ1FLSVZSNHhHMDBRSThGV3JSdWVIWjczanB3bHY5WjFzcTBMN3c?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "超正統派がシャバット時のバス運行に抗議、エルサレム入口を封鎖", "title_en": "Ultra-Orthodox Protesters Block Jerusalem Entrance Over Shabbat Bus Services", "summary_ja": "エルサレムの超正統派プロテスタントが、ユダヤ教の安息日であるシャバット中のバス運行に反対して市内への主要な入口を封鎖した。この抗議はイスラエルの世俗的コミュニティと宗教的コミュニティ間で続く緊張を反映しており、週の休息日の公共交通政策をめぐる対立が深刻化している。", "summary_en": "Ultra-Orthodox protesters in Jerusalem have blocked a major city entrance to oppose the operation of bus services on Shabbat, the Jewish Sabbath. The demonstration reflects ongoing tensions between secular and religious communities in Israel over public transportation policies during the weekly day of rest.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijAJBVV95cUxNazlybTlSNldHWFhwLXJFMEVBZGExQWhITWpqdjRETFp4NDZCbVNYVnpvcDU1dThROUNrZUhKbGY4eTZwLUR3clBxVnRFbGFqcXk0ejJXcUNkZTRxTTM5LWplRDNZcmlrX042bWU3TmdiME9KQ2JxeGZjdFkwWnB6TWtRZXpYcTBTR0dybGlvOGhTeDJIcG1WdzZvT0R5Zzh2X1gtWGJiVlUtRTBjd05UcVE5LWs1a05nZ3VWUmhOdXZpUjZLM2wtRXFoQlczYkYxbUdIMi1kZjdSY0dUX3pselJrQnV1MXRwVlJtVkhfMXdCcnNLWng5WHZKaWJBMlNyTUhBY3FCNzF4azVo?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル記者がシリアのスパイと国境で遭遇、後に殺害計画が判明", "title_en": "Israeli Journalists Encounter Syrian Spies Planning Attack at Border", "summary_ja": "ハアレツの記者たちはシリア・イスラエル国境でシリア情報機関の工作員と遭遇した。後にこの工作員らが記者たちに対する暴力的な攻撃計画を立てていたことが判明した。", "summary_en": "Haaretz journalists met with individuals at the Syrian-Israeli border who were later revealed to be intelligence operatives. The operatives were allegedly planning a violent attack, including beheading, against the journalists.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMipwJBVV95cUxNYWxLOVVwbDd2R1Zkd1RydHFlS3ZtTTFiRnZZNmxOa1FuZGlKZk1sRmhkcmRjTGhFcUF4dkZxckcySklRSk04ODJ5ZHZ6aHRJU2h4bm1lZnRqSTRGLW41UjZXb1RMcDctQVptVjhENzdQNk9nbWFQOUNTdHJpcHFSNmxlQi15VGVYbkdyMmJ0Tm01c2pTZlJyQmFKSU93RXkzaXRnejlFMkE5elFCMlZvaXlMTUpkUEwwdjlDSlNPSlFxaXBuRU92YjBIUVdXSDNnc1NiY3JZck5fZVdTX09RX0pXUTlkenRHUG1WV2ZndGJxcVNHbHhLdUQ5dHJncG9ESmQ1Q1B6WTdFNU5nMDR4LW9vWjRnZnFwMFc3R2VlbkdNalYwWUo0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "日本、台湾人エンターテイナーが国宝破損で50万円の罰金を科す", "title_en": "Japan Fines Taiwanese Entertainer 500,000 Yen for National Treasure Vandalism", "summary_ja": "台湾人エンターテイナーが日本の国宝を破損させたとして、日本当局から50万円の罰金を科されました。この事件は、日本の文化遺産サイトの保護に関する懸念を浮き彫りにしています。", "summary_en": "A Taiwanese entertainer has been fined 500,000 yen by Japanese authorities for vandalizing a national treasure. The incident highlights concerns about the protection of cultural heritage sites in Japan.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE11Wm1HVWZjNnl5aWJ3TURqV3dEY0stZmpMVlByRmNoam5XY0poUHdzb3JlUTliVWZYNF9uMWRFbzhsSXNESXB0VHY0eGhaS1hoUmJJMXlB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、太平洋島嶼フォーラムで太平洋同盟国との協力強化を誓約", "title_en": "Taiwan pledges closer cooperation with Pacific allies at PIF gathering", "summary_ja": "台湾は太平洋島嶼フォーラムの集会で、太平洋島嶼国の同盟国との協力強化に貢献することを誓約した。この誓約は、地域諸国との外交経済関係を深める目的としている。", "summary_en": "Taiwan has committed to strengthening cooperation with its Pacific island allies during the Pacific Islands Forum gathering. The pledge aims to deepen diplomatic and economic ties with the region's nations.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1Jckp4b2FSMmhOMVBkaE1DUjItaHd5N29mbE51eG9TeFVrSnRJWFlVS2xpVVliTThlWHh6T1hpaGlNbTdQcVJoT01MU2ZGVDJuUVBSTWdBZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "内閣が191億2000万米ドルの補正予算を提案", "title_en": "Cabinet Proposes US$19.12 Billion Supplementary Budget", "summary_ja": "台湾の行政院は、財政需要と経済優先事項に対応するため、191億2000万米ドルの補正予算を提案しました。追加資金は、主要な政府イニシアティブと経済開発プログラムを支援することを目的としています。具体的な配分分野の詳細は、正式な審査プロセスに続いて明らかになる予定です。", "summary_en": "Taiwan's Cabinet has proposed a supplementary budget of US$19.12 billion to address fiscal needs and economic priorities. The additional funding aims to support key government initiatives and economic development programs. Details on specific allocation areas are expected to follow formal review processes.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1aU2I1TGlhMk92Y01PdDZGNXNMaUxWNEE1QlRNZG1Mbm5ub0ZqbFpHQ0cyYXB3c3ltSU1SU1JUa0pMSkpmb0tvQlduNHFVWm5keGgzMGwzMA?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国ブランドがエジプトで存在感を高める", "title_en": "Chinese brands gain ground in Egypt", "summary_ja": "CGTNは、スマートフォン、電気自動車、家電製品を中心に、中国製品がエジプト全域で一般的になってきたと報じています。国営メディアによると、このトレンドはエジプト消費者の中国ブランドに対する関心の高まりを反映しているとのことです。", "summary_en": "CGTN reports that Chinese products are becoming increasingly visible across Egypt, particularly in smartphones, electric cars, and household appliances. According to the state-controlled outlet, this trend reflects growing consumer interest in Chinese brands among Egyptian shoppers.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-09-05/Chinese-brands-gain-ground-in-Egypt--1QaLPDA1vyM/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカCDCがコンゴ民主共和国のエボラ流行はまだ制御されていないと警告", "title_en": "Africa CDC warns DRC Ebola outbreak remains uncontrolled", "summary_ja": "アフリカCDCは、コンゴ民主共和国のエボラ流行がまだ制御下に置かれていないと報告している。この警告は、影響を受けた地域における疾病伝播と封じ込め対策に関する継続的な懸念を強調している。保健当局は引き続き状況を密切に監視している。", "summary_en": "The Africa CDC reports that the Democratic Republic of Congo's Ebola outbreak has not yet been brought under control. The warning highlights ongoing concerns about disease transmission and containment efforts in the affected regions. Health authorities continue monitoring the situation closely.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-09-05/Africa-CDC-warns-that-the-DRC-s-Ebola-outbreak-not-yet-under-control-1QaGwkuoRoY/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ペルーのアンデス地域、氷河洪水の危機に直面", "title_en": "Peruvian Andes at Risk of Glacial Flooding", "summary_ja": "CGTNは気候変動と氷河融解により、ペルーのアンデス地域が氷河洪水のリスク増加に直面していると報じている。国営メディアは、急速な氷河後退が地域コミュニティとインフラに危険な洪水をもたらす可能性があると警告している。CGTNは、ペルーの高地氷河への気候影響が水資源の安全保障と災害対応態勢に重大な課題をもたらしていると指摘している。", "summary_en": "CGTN reports that the Peruvian Andes face increasing risks from glacial flooding due to climate change and melting ice. The state-controlled outlet warns that rapid glacier retreat in the region could trigger dangerous flooding events affecting communities and infrastructure. CGTN indicates that climate impacts on Peru's high-altitude glaciers pose significant challenges for water security and disaster preparedness.", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-09-03/Peruvian-Andes-at-risk-of-glacial-flooding-1Q62uqj0RZS/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "開発途上国がより少ない資源でより多くを実現する方法", "title_en": "How Developing Countries Can Do More With Less", "summary_ja": "外国援助予算が削減される中、アフリカ諸国は援助国が定義した指標よりも地域の知識とコミュニティの優先事項を重視する公平な評価実践を導入すべきである。『アフリカ発』の評価アプローチを採用し、地域がデータ収集と解釈においてより大きな役割を果たすことで、開発途上国は限られた資源をより効果的に配分しながら、グローバルな開発ガバナンスを援助国の支配から転換できる。", "summary_en": "As foreign aid budgets decline, African countries should implement equitable evaluation practices that prioritize local knowledge and community priorities over donor-defined metrics. By adopting 'Made in Africa Evaluation' approaches and giving communities a greater role in data collection and interpretation, developing nations can allocate limited resources more effectively while reshaping global development governance away from donor control.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/equitable-evaluation-is-crucial-to-decolonize-development-in-africa-by-takunda-chirau-et-al-2026-09", "state_media": false, "category": "オピニオン", "full_text": "How Developing Countries Can Do More With Less\nTakunda Chirau , Steven Masvaure, and Hlanganani Mnguni\nEvaluation frameworks for development projects have long been influenced by donor priorities. But foreign-aid cuts have created an opportunity for African countries to implement equitable evaluation practices, both to channel limited resources more effectively and to shape the future of global development governance.\nJOHANNESBURG—As donor governments slash aid budgets, and multilateral institutions come under increasing financial strain, development organizations must confront the combination of growing need and declining resources. How to address persistent challenges such as poverty and inequality, climate change, and humanitarian crises with fewer resources is an especially urgent question in Africa, where many countries have long relied on external financing to support essential programs and services.\nThe answer lies in how development is monitored and evaluated, often framed as a neutral, technical exercise measuring whether projects have achieved their objectives. In fact, evaluation is deeply political: it reflects what is seen as important and whose knowledge is trusted, and it influences which programs continue to receive funding. Thus, evaluation determines how resources are allocated and whose solutions are supported and expanded.\nMore significantly, the standards by which development projects are assessed are important not only for deciding where to channel limited resources, but also for shaping the future of global development governance. The African Union and its member states have long called for reforms to the international development and financial architecture, advocating greater representation, more equitable financing, and a stronger voice for Africa in global decision-making. But these reforms, while important, often overlook another powerful driver of change: control over knowledge and evidence.\nTo date, evaluation frameworks have largely been influenced by donor priorities, with the aim of tracking and comparing results across contexts. As a result, they often fail to capture the realities within communities and rarely reflect local values. When funders define success, the communities most affected by development programs are treated as sources of data rather than partners in deciding what constitutes meaningful change and how to measure it. As argued in the volume Equitable Evaluation: Voices from the Global South (which two of us co-edited), donors’ expectations and desired outputs take precedence over those of local communities.\nWith fewer resources now available, and their allocation increasingly dependent on evidence demonstrating impact, there is no better time to implement equitable evaluation practices, which challenge the idea that development can be understood through universal indicators alone. This methodological innovation is grounded in the belief that evidence is shaped by history, context, culture, and power, and that these factors must be considered if evaluation is to advance equity.\nAfrican countries and communities, in particular, could adopt Made in Africa Evaluation approaches, which seek to assess development projects according to African realities, values, and priorities. That means recognizing Indigenous knowledge, local institutions, and community experiences as important sources of evidence, while emphasizing that evaluation should reflect the social, cultural, and political contexts in which development takes place. Such a shift ultimately reshapes who holds authority over knowledge itself.\nCommunity participation forces governments to be accountable to citizens, not just funders. For example, when rural health committees monitor clinic performance using community-designed scorecards rather than relying on donor audits, facility managers can identify and respond more quickly to drug shortages, long wait times, or service gaps, while health authorities gain access to locally generated evidence.\nSimilarly, when farmers help assess irrigation projects, evaluations have revealed practical constraints—such as unreliable water supplies, inadequate maintenance, and inequitable land distribution—that may be overlooked by externally designed indicators. These data can also inform national priorities, resulting in more responsive and efficient development spending. And if regional institutions build their own evaluation capacities, countries will become less dependent on frameworks that may not reflect their development goals.\nAs such examples show, giving African countries a greater say in international institutions is not enough to reform global development governance. Structural transformation requires giving them a greater role in the collection, interpretation, and use of data and evidence. Without significant changes to evaluation and the resulting knowledge production, calls to “decolonize development” will continue to ring hollow.\nThe current aid landscape ", "translation_ja": "", "vocab": [{"word": "equitable", "definition": "公平で不公正でない状態を意味する。開発や分配が全ての関係者に対して公正に行われることを表す。"}, {"word": "framework", "definition": "基本的な構造や枠組みを指す。ここでは評価基準や制度的な枠組みの意味で使用されている。"}, {"word": "governance", "definition": "統治や管理の方法を意味する。政治的・制度的な意思決定と権力の行使のプロセスを指す。"}, {"word": "methodological", "definition": "研究や実践における方法論に関連する。手法や手段の体系的で理論的な側面を表す。"}, {"word": "decolonize", "definition": "植民地支配の影響や考え方を除去する。特に開発分野では西洋中心の価値観から脱却することを意味する。"}, {"word": "allocation", "definition": "資源や予算を配分・振り分けることを意味する。どのように限られた資源を配置するかの決定プロセスを指す。"}, {"word": "architecture", "definition": "基本的な構造設計を意味する。ここでは国際開発・金融体制の根本的な仕組みを指す。"}]}, {"title_ja": "アメリカ海軍の危機", "title_en": "America's Naval Disaster", "summary_ja": "著者は、1970年代以降、アメリカの造船業が大幅に衰退し、莫大なコストと慢性的な遅延により、米国防総省が中国の海軍拡張に対抗できないと主張している。トランプ大統領の産業再生の取り組みは根本的な構造的問題に対処せず、数千億ドルを無駄に費やすリスクがある。", "summary_en": "The author argues that American shipbuilding has declined dramatically since the 1970s, plagued by exorbitant costs and chronic delays that prevent the US Navy from matching China's naval expansion. Trump's efforts to rebuild the industry fail to address fundamental structural problems and risk wasting hundreds of billions of dollars without achieving meaningful results.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trump-plans-to-resurrect-american-shipbuilding-could-sink-it-further-by-anne-o-krueger-2026-09", "state_media": false, "category": "オピニオン", "full_text": "America’s Naval Disaster\nPlagued by exorbitant costs and chronic delays, American shipbuilders cannot produce enough vessels to keep pace with China. US President Donald Trump’s push to rebuild the industry does little to address its underlying problems and threatens to squander hundreds of billions of dollars.\nWASHINGTON, DC—At the end of World War II, the US Navy was by far the world’s largest. As late as 1975, the United States remained a major shipbuilding power, although its preeminence had already begun to diminish. By the end of the 20th century, however, American shipbuilding was in steep decline, despite government efforts to revive it.", "translation_ja": "", "vocab": [{"word": "exorbitant", "definition": "通常の相場や価格より著しく高い。不当に高額な費用や値段を指す。"}, {"word": "chronic", "definition": "長期間続く、慢性的な。一時的ではなく、繰り返し発生する問題を表す。"}, {"word": "preeminence", "definition": "他より優れている状態、卓越性。特定の分野で最高の地位や優位性を示す。"}, {"word": "diminish", "definition": "減少する、低下する。規模や重要性、影響力などが小さくなることを意味する。"}, {"word": "steep decline", "definition": "急速で著しい低下。グラフが急に下がるように、大幅かつ迅速に悪化することを指す。"}, {"word": "squander", "definition": "浪費する、無駄に使う。貴重な資源やお金を不適切に消費することを表す。"}]}, {"title_ja": "アメリカの非米国的なAI企業", "title_en": "America's Un-American AI Companies", "summary_ja": "著者は、米国のAI企業が民主的監視と法の支配を受け入れる代わりに規制に対してロビー活動を行うことで、米国の競争優位性を損なっていると主張しています。米国が中国をAIで上回るには、開かれた社会の強みを活用する必要がありますが、それには企業がセキュリティリスクという主張をせず、合理的な規制を受け入れることが必須です。", "summary_en": "The author argues that American AI companies undermine U.S. competitive advantages by lobbying against accountability rather than embracing democratic oversight and rule of law. The U.S. can outpace China in AI by leveraging open society strengths, but this requires companies to accept reasonable regulation instead of claiming security risks.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/american-ai-companies-avoiding-democratic-oversight-unamerican-by-yaqiu-wang-and-nicholas-bequelin-2026-09", "state_media": false, "category": "オピニオン", "full_text": "America’s Un-American AI Companies\nand\nThe United States can prevail in the AI race against China by leaning into the strengths of an open society: democratic oversight, the rule of law, robust competition, and open public debate. But that won’t happen as long as American AI companies aggressively lobby against accountability and cozy up to the state.\nPHILADELPHIA—In Washington, nearly every serious proposal that could constrain American AI companies runs into the same objection: restrictions would endanger national security and future prosperity by giving China the advantage. As OpenAI CEO Sam Altman put it at a 2025 Senate hearing, the United States needs “sensible regulation” that “does not slow us down.”", "translation_ja": "", "vocab": [{"word": "constrain", "definition": "制限する、制約する。ビジネスや政策の文脈で、規制によって活動や自由度を限定することを指します。"}, {"word": "lobby", "definition": "ロビー活動をする、政治家に働きかける。特定の利益を代表して政策決定に影響を与えようとする活動。"}, {"word": "cozy up to", "definition": "～に擦り寄る、仲良くなる。通常は利己的な目的で権力者などと親密になることを指す表現。"}, {"word": "robust", "definition": "堅牢な、強力な。ビジネス文脈では競争メカニズムが強くて有効であることを表します。"}, {"word": "accountability", "definition": "説明責任、説明の義務。企業や政府が自らの行動や決定に対して責任を持ち、説明する義務。"}, {"word": "prospectus", "definition": "見通し、展望、前景。prosperity（繁栄）ではなく、今後の成長の可能性や見通しを指します。"}]}, {"title_ja": "司法長官の「性的移行パンデミック」主張は政治的議題を隠蔽している", "title_en": "AG's 'Gender Transition Pandemic' Claim Masks Political Agenda", "summary_ja": "アルワ・マハダウィは、司法長官トッド・ブランシュが学校における「性的移行のパンデミック」について主張していることを、トランプ政権の実際の不正を隠すために作られた架空の道徳的パニックだと批判している。彼女は、カンザス州の学区に対する司法省の訴訟が学生の名前の呼び方に関する日常的なガイドラインを誇張しており、ブランシュはエプスタイン捜査などより深刻な問題を無視していると主張し、彼の優先事項は子どもの福祉ではなくトランプの利益に奉仕していることを示唆している。", "summary_en": "Arwa Mahdawi critiques Attorney General Todd Blanche's claims about a 'pandemic' of gender transitions in schools as a fabricated moral panic designed to distract from the Trump administration's actual misconduct. She argues that the Justice Department's lawsuit against a Kansas school district exaggerates routine guidelines about student name preferences, while Blanche ignores more serious issues like the Epstein investigation, suggesting his priorities serve Trump's interests rather than children's welfare.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/05/todd-blanche-gender-transitions-schools", "state_media": false, "category": "オピニオン", "full_text": "Being a public school teacher in the US these days is tough. You’ve got to pay for a lot of your own supplies, deal with smartphone-addicted children and perform gender-affirming surgeries on your lunch break.\nLuckily our intrepid attorney general, Todd Blanche, is on the case. Blanche appeared on Fox News this week to decry a “pandemic” of gender transitions in schools across the US. “There’s not a parent in America, no matter where you live, that would want their school to change and call their child by a different name and not expect to be told about that. We partnered with the Department of Education recently to combat this very trend and, really, pandemic that’s happening in some school districts around the country,” Blanche said. He seemed more concerned with name changes than with surgery, but the president himself has suggested on several occasions that schools are furtively doing surgery on children. During a campaign speech in 2024, for example, Donald Trump said: “Can you imagine … your son leaves the house and you say: ‘Jimmy, I love you so much. Go have a good day in school,’ and your son comes back with a brutal operation? Can you even imagine this?”\nNo, I can’t even imagine this. The public schools near me can’t afford air conditioning, so I’m not sure where they are getting all these operating theaters and surgeons from.\nStill, don’t let my lack of imagination stop you from getting outraged over this totally-not-invented moral panic, which is consuming valuable government resources. Blanche’s Fox News interview came shortly after the justice department filed what it described as a “first-of-its-kind lawsuit” against a Kansas school district, aimed at stopping it from “facilitating secret ‘gender transitions’ for children at school without their parents’ knowledge or consent”. The district, which denies wrongdoing, risks losing almost $70m in federal funds if it is found to have violated federal law.\nWhile this all sounds terribly dramatic, the substance of the Kansas public school lawsuit is actually rather mundane. It seems what is riling the Trump administration up are some extremely reasonable internal school guidelines, never adopted as formal policy, which state, according to the justice department complaint, that if a transgender student doesn’t want their parents notified about their preferred names and pronouns “that request will be evaluated on a case-by-case basis”.\nThere’s certainly a sensible conversation to be had about whether teachers should inform parents if their child wishes to be known by a different name. And Blanche might actually want to ask the vice-president to weigh in on that matter, considering JD Vance has changed his own name multiple times. But let’s not pretend that Blanche and Fox News are interested in sensible conversations. One suspects they just want to whip viewers up into a frenzy about trans people, a favourite boogeyman, in order to distract from the fact that the Trump administration is pillaging the country for personal gain.\nLet’s also not pretend that the attorney general, who was confirmed last month, is in his job because he is deeply invested in the wellbeing of America’s young people. Blanche was Trump’s personal criminal defense lawyer before he was brought into the White House; he eventually became attorney general following the ousting of Pam Bondi. He is a Trump loyalist who once said he’d tell the president: “Thank you very much. I love you, sir” if Trump nominated someone else for the job. He’s got his job, I’d wager, because he’s made it clear he’ll protect the president and advance Trump’s agenda. Indeed, one of the very first things that Blanche’s justice department did after he was confirmed as attorney general was to issue an opinion stating that the president’s “executive privilege” can extend to advisers who don’t work for his administration. Which makes it harder for Democrats to investigate Trump in the future.\nBut maybe I’m being uncharitable here. Maybe the attorney general isn’t just interested in advancing his own career by finding ways to give Trump carte blanche to do whatever he likes. Maybe he really does care about vulnerable young people. In which case, may I suggest he focus some of his attention on revisiting the Jeffrey Epstein files? I’m sure that I don’t need to remind you that the only person in jail right now because of their connection to the late sex offender is Ghislaine Maxwell. An awful lot of powerful people seem to have successfully dodged any accountability.\nOne would think an unpunished international pedophilia ring might worry Blanche more than schoolkids experimenting with their names in Kansas. However, Blanche seems a little resistant to taking the investigation much further – possibly because Trump is named in the Epstein files thousands of times. The attorney general also made sure to stress on Fox News earlier this year that “it isn’t a crime to party with Mr Epstein”.\nStill, it doesn’t matter how", "translation_ja": "", "vocab": [{"word": "decry", "definition": "～を強く非難する、糾弾する。公開的かつ激しく反対の意をを表明すること。"}, {"word": "furtively", "definition": "こっそりと、秘密裏に、隠れて行うさま。何かを隠そうとして行われる行為。"}, {"word": "mundane", "definition": "日常的な、ありふれた、退屈な。特に注目する価値がないほど普通の。"}, {"word": "boogeyman", "definition": "恐怖の対象、悪役として描かれる存在。特に政治的に都合よく利用される象徴。"}, {"word": "carte blanche", "definition": "完全な自由、白紙委任。特定の人物が全権を握り好きなように行動できる権限。"}, {"word": "dodged", "definition": "～を避ける、逃れる。特に法的責任や追及から逃げ切ること。"}]}, {"title_ja": "フットボールのCTE問題：視聴をやめるべき健康危機", "title_en": "CTE in Football: A Health Crisis That Demands We Stop Watching", "summary_ja": "新しいBMJ研究により、亡くなった元NFLプレイヤーの実質的多数派がCTEに罹患していることが判明し、有病率は24.5～97.7％と推定されている。著者は、5歳から始まるフットボールの繰り返される頭部外傷は公衆衛生危機に相当すると主張し、予防可能な死亡と神経学的損傷を受け入れるのではなく、ファンがスポーツ視聴をやめるよう呼びかけている。", "summary_en": "A new BMJ study reveals that CTE affects a substantial majority of former NFL players who died, with evidence suggesting 24.5-97.7% prevalence rates. The author argues that repeated head trauma in football—starting as early as age 5—constitutes a public health crisis and calls for fans to stop watching the sport rather than accepting preventable deaths and neurological damage.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/sport/2026/sep/05/cte-football-players-nfl", "state_media": false, "category": "オピニオン", "full_text": "As a new NFL season begins this Wednesday, the danger of America’s most-watched sport has never been more clear.\nA new and widely circulated study published in the British Medical Journal examined the donated brains of former NFL players who died between 2016 and 2021 and compared them with the overall number of players who died during that period. Of the 235 donated brains in that period, 215 had evidence of the degenerative brain condition chronic traumatic encephalopathy (CTE). That group of 215 comprised 24.5% of the former players who died during that period in total. Given the finding, the study’s authors estimate that the prevalence of CTE among players who died in that period was at minimum 24.5% to a maximum of 97.7%, with the actual rate likely somewhere in between.\nThe implication of that finding cannot be overstated: it suggests that CTE is a disease that may affect a substantial share of those who spend their careers in the NFL. The players taking the field this season are being exposed to the same fundamental risk: the repeated blows to the head that have been linked to the disease. When we watch players deliver and receive those devastating if also thrilling hits, when we watch the lines collide on every play, we are watching the repetitive head trauma that puts players at risk of developing CTE. We are watching lives being permanently altered in ways that will in the end result in heartbreak.\nAnd yet, as recently as Friday, the Wall Street Journal published an op-ed by former senator Ben Sasse that makes the titular claim “America needs its boys to play football.” That sentiment isn’t just a vestige of should-be-antiquated gender politics – it is better understood as tantamount to child endangerment.\nBecause, perhaps the most disconcerting statistic is one that we already know: every 2.6 years of participation in football doubles the chances of developing CTE, in large part because a typical high school or college football season can deliver between 600 and 1,000 subconcussive blows to a single athlete, and that these blows heavily predict later-life clinical depression, apathy, executive dysfunction and cognitive impairment. We also know that participation in football increases the chances of developing Parkinson’s disease by 61% compared with athletes in other organized sports (and that risk is 2.93 times greater for those who play football at the college/pro level compared with youth/high school).\nWhen you put these figures in the context of the reality that in many parts of the United States, children are enrolled in tackle football as early as 5 years old, it becomes clear that this is a potential public health crisis.\nThe statistics only tell part of the story. In our 2024 book The End of College Football: On The Human Cost of an All-American Game, we talked to former big-time college football players – a level lower than the NFL, meaning fewer total head impacts than those at the pinnacle of the game – about how their lives had been affected by head injury in the sport. These players understood that their lives were at stake. One told us frankly: “I feel like there’s a good chance that I will have CTE. Especially if I kept playing, it’ll probably be guaranteed. But I won’t find out until I die, which isn’t comforting at all.”\nAnother explained, “The scariest part about that for me is I don’t know the price that I paid in terms of cognitive ability, in terms of how many concussions did I play through, how many times did I have a concussion and didn’t report it?”\nA third player told us that his career had bequeathed him a “panic disorder related to probably all the sub-concussive blows”.\nOne player said that after enduring 10 concussions, “I could barely do school. … I would forget what I was talking about mid-sentence. I’d be forgetting everything that happened like 10 minutes ago. I would just completely zone out sometimes. It was like I was halfway there. I couldn’t really control it.”\nStill a different player told us, “I played with guys in the NFL that took their own lives and then were diagnosed with CTE when they did the autopsy, so you think about that, like, ‘Boy, I hit my head against that guy’s head, so what’s going on with me if that was obviously was going on with him?’”\nNo one wants to see football players die for this sport. But they are. In 2025 alone, nine former NFL players under the age of 48 died. Seven of those deaths were a result of suicide, underscoring the fears surrounding the long-term neurological and psychiatric consequences of repeated head trauma.\nThe tragedy of death by football is thus happening whether we realize it or not. Far too much evidence now exists that the sport systematically produces life-altering head trauma for us to continue with business as usual when we know that football is morally unsustainable.\nThe NFL will of course never turn itself off. So, starting this season, it’s up to us as fans to do that. There are too many lives at stake.\n-", "translation_ja": "", "vocab": [{"word": "chronic traumatic encephalopathy (CTE)", "definition": "反復的な頭部外傷によって引き起こされる進行性の脳疾患で、認知機能低下、うつ病、自殺リスク増加などの症状を特徴とします。"}, {"word": "prevalence", "definition": "特定の人口集団における疾患や状態の発生率または存在の程度を指す医学統計用語です。"}, {"word": "subconcussive blows", "definition": "脳震盪と診断されないほどの軽度の頭部外傷ですが、繰り返されると長期的な神経障害を引き起こす可能性があります。"}, {"word": "bequeathed", "definition": "遺す、後に残すという意味で、通常は遺産や負の結果が後世に残されることを表現する際に使用します。"}, {"word": "neurological consequences", "definition": "脳や神経系の損傷から生じる身体的・精神的な悪影響や結果を指します。"}, {"word": "morally unsustainable", "definition": "倫理的または道徳的観点から長期的に継続できない、または正当化できない状態を意味します。"}]}, {"title_ja": "トランプの中間選挙破壊工作：自滅的な政策が共和党の勝利を危うくする", "title_en": "Trump's Midterm Sabotage: Self-Destructive Policies Hurt Republican Chances", "summary_ja": "ジョナサン・フリードランドは、トランプのイラン戦争、カナダとの貿易紛争、不人気なデータセンター支持など、外交・国内政策が中間選挙での共和党の勝利を意図的に損なわせているように見えると主張している。フリードランドはトランプが共和党の敗北を気にしていないか、あるいは密かに望んでいる可能性を示唆し、彼がインフレと雇用に影響する重要な問題で有権者の大多数と対立する立場を一貫して取り続けていることを指摘している。", "summary_en": "Jonathan Freedland argues that Trump's foreign and domestic policies—including a war with Iran, trade conflicts with Canada, and support for unpopular datacenters—appear deliberately designed to damage Republican prospects in the midterm elections. Freedland suggests Trump either doesn't care about Republican losses or may covertly desire them, given his consistent positioning against majority voter preferences on critical issues affecting inflation and employment.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/04/donald-trump-winning-midterms-us-president", "state_media": false, "category": "オピニオン", "full_text": "What is Donald Trump playing at? If it’s true that the best way of understanding the behaviour of an organisation is to assume it’s controlled by a secret cabal of its enemies, perhaps that same logic extends to the current conduct of the president of the United States. Maybe he secretly wants Republicans to lose the looming midterm elections that will decide the balance of power in the US for the next two years and for which the first postal ballots were sent out today.\nThat’s not as mad a theory as it sounds. Indeed, there are at least two reasons why Trump might either be unbothered by Republican defeat in November or even covertly desire it. We’ll come to those, but let’s start with a pattern of behaviour that is hard to explain as anything other than calculated self-sabotage.\nAt the centre of it is the single act that is already defining Trump’s second term: his reckless, failed war of choice against Iran. No matter how many times he declares mission accomplished or claims to have destroyed the Iranian military or to have reopened the strait of Hormuz, the facts keep telling a different story. In the past week, the two sides shifted from an economic standoff back to a shooting war, with the US firing on Iranian targets that included a wedding party, killing four, and Tehran striking out all over the neighbourhood, hitting Iraq, Kuwait, Jordan and Bahrain.\nThe impact on US voters is severe, felt most directly through rising petrol prices and grocery bills. But look at the graph measuring the cost the US government must pay to borrow money: it’s been a steep upward climb since 28 February, the day the war began, hitting a fresh high on Tuesday. For consumers, that rise translates into an expected jump in interest rates. It means that many of those casting ballots are likely to be doing so just as they start paying more on their credit card bills and mortgages. Given that Trump was elected in November 2024 on a promise to bring down inflation, it’s hard to think of a worse environment for a governing party about to face the voters’ verdict. And that’s before you consider the disenchantment of the Maga faithful, who thought the whole point of Trump was an end to forever wars in the Middle East.\nAnd yet, Iran may not even be the most electorally damaging of Trump’s foreign adventures. He is, and it would once have been absurd to write this sentence, leading his country into a state of war with … Canada. It’s easy to laugh at the petty gestures, such as Trump’s renaming of Lake Ontario as Lake America, a move shamefully followed, and therefore endorsed, by Apple and Google in their map apps. But the economic confrontation is serious – and seriously damaging to Republicans’ electoral prospects.\nFor which US states are hit hardest by Canada’s “dollar-for-dollar” response to Trump’s tariffs? Why, it’s Michigan, Ohio, Maine, Iowa and Texas, all of which just happen to have key senate contests this year. Republican candidates in those states now have to explain why a crucial and previously friendly export market – Canada takes nearly a third of Iowa’s exports, for example – has suddenly turned icy.\nWhat’s odd is that Trump’s trade wars are also wars of choice, and they are hurting especially badly what should be a reliable Republican constituency: farmers. Take Iowa: Democrats have not won a senate seat in that farming state for nearly 20 years, yet now, thanks to Trump’s tariffs, they have a genuine shot.\nStill, perhaps the most egregious illustration of Trump’s apparent determination to ruin Republican chances in the midterms is his support for datacentres. Few issues have seen their salience rise so quickly and in such a clear direction: almost overnight, they have become objects of fear and loathing across the country and across the political spectrum, with seven in 10 Americans saying they would not want one anywhere near where they live. Even among Republicans, there is deep concern over their environmental impact, energy consumption and water use. For others, datacentres have become a lightning rod for a broader anxiety over AI and what it may do to our jobs and our lives. Either way, they are kryptonite to voters.\nSo where does Trump stand? “The only reason that communities throughout the USA should not want data centres is if they want to end up being backwards and poor,” the president posted on Monday. In that remark, he not only put himself at odds with most US voters, he insulted them too.\nIt’s almost a talent, this ability of Trump’s to land on the wrong side of so-called 80/20 issues, siding with one-fifth of the electorate against the rest. Likewise, strong majorities oppose his vanity projects, whether demolishing the East Wing of the White House to build a ballroom or putting his signature on the dollar bill, yet he persists not only in doing them but in talking about them constantly.\nAnd all the while, he has hobbled his party by endorsing radioactively unpopular candidates. Few politicians in t", "translation_ja": "", "vocab": [{"word": "reckless", "definition": "注意深さや慎重さを欠く、無謀な。危険性や悪い結果を無視する行動や決定を表す。"}, {"word": "calculated self-sabotage", "definition": "意図的かつ計画的に自分自身の利益や目標を損なう行為。戦略的に失敗を招く行動パターン。"}, {"word": "disenchantment", "definition": "かつての期待や信念が失われた状態；失望感。理想が現実と異なることで生じる幻滅。"}, {"word": "egregious", "definition": "明らかに悪質で許しがたい；非常に目立つ過ち。特に悪い例や行動を強調するときに使う。"}, {"word": "kryptonite", "definition": "比喩的に、特定の人や組織の弱点となるもの。元々はスーパーマンの弱点となる物質を指す。"}, {"word": "salience", "definition": "ある事柄がどの程度目立つか、または重要と見なされるかの程度。社会的認識や注目度を示す。"}, {"word": "hobbled", "definition": "行動の自由や能力を制限する；弱める。足を引っ張られるように進行を妨げられた状態。"}]}, {"title_ja": "次の飢饉を回避する", "title_en": "Avoiding the Next Famine", "summary_ja": "著者は、21億人に影響を及ぼす世界的な食糧不安が単なる人道的危機ではなく、国際的安定性、経済成長、米国の地政学的影響力に対する戦略的脅威であると主張しています。米国は飢饉と戦うための協調的なグローバル努力を主導すべきであり、これは道徳的義務であるとともに、農業政策と食糧安全保障における中国の支配力の増加に対する必要な対抗手段です。このアジェンダは米国の信頼性を回復し、国際協力と自由主義的世界秩序の価値を示すのに役立つでしょう。", "summary_en": "The author argues that global food insecurity affecting 2.1 billion people is not merely a humanitarian crisis but a strategic threat to international stability, economic growth, and U.S. geopolitical influence. The U.S. should lead a coordinated global effort to combat hunger, both as a moral imperative and as a necessary response to China's growing dominance in agricultural policy and food security leadership. This agenda would help rebuild American credibility and demonstrate the value of international cooperation and the liberal world order.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/avoiding-next-famine", "state_media": false, "category": "オピニオン", "full_text": "In a world of great-power standoffs, climatic tipping points, and technological arms races, global hunger may not seem like a particularly significant problem. Yet last year, a total of 2.1 billion people, or more than a quarter of the planet’s population, experienced food insecurity—meaning they either ran out of food over the course of a year or were forced to reduce the quality or quanti
