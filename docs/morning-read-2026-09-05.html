ty of their diet. Over 260 million faced acute food insecurity, meaning their lives or livelihoods were in immediate danger because they could not get enough to eat. Almost a quarter of all children under the age of five were permanently stunted because of malnourishment and will likely reach lower levels of education, earn less over the course of their lives, and live with more chronic health challenges than properly fed kids. And these startling figures do not reflect the food crises that could be unleashed this year by rising energy and fertilizer prices, decreases in grain exports from Russia and Ukraine, and an intensifying El Niño weather pattern.\nFood insecurity is terrible in and of itself. But it also has disastrous political consequences. It inhibits economic growth, heightens the risk of violent conflict, and destabilizes governments. These problems, in turn, create trouble for the whole world. That means countries that are not overwhelmed by food insecurity still have strong, self-interested reasons to tackle it—the United States included.\nIn fact, a U.S.-led effort to address hunger would do more than create a healthier and more stable planet. Given the waning goodwill toward the United States, Washington needs an agenda through which it can rebuild global confidence in its leadership and demonstrate the value of international cooperation. Addressing global food security could be at the center of such a plan. Different parts of the world, after all, may have different geopolitical ambitions. But almost no government—northern or southern, democratic or autocratic—wants to see so many people go hungry. There may be no better way to rebuild confidence in the liberal world order and in the United States as a committed member of it than for Washington to address this challenge.\nFOOD, GLORIOUS FOOD\nIt is difficult to overstate just how intertwined food security is with global development, state security, and even international competition. Malnutrition leads to reduced educational attainment, compromised human capital, and lost productivity, costing the world economy $3.5 trillion a year in forgone economic growth and in added health-care costs. Food price spikes can also exacerbate grievances and lead to riots that destabilize governments; anger over hunger, for example, set the conditions for the Arab Spring protests. In rural areas, food insecurity helps armed groups recruit soldiers and causes disputes over scarce land and water resources. And it causes people to migrate to wealthier states.\nThese reasons are, by themselves, enough for Washington to helm a global campaign to reduce hunger. But so should the fact that leading on global food security means helping shape the future of the world’s entire agricultural system—something China is on a path to do. In 2019, Beijing invested significant capital in securing leadership of the Food and Agriculture Organization of the UN, a role with substantial influence over how governments work together on food-related issues. It is also quickly developing other ways to lead the world on matters of food security. China spends double what the United States spends on public agricultural research and development, and its output of agricultural patents and scientific publications has skyrocketed while U.S. output has stagnated.\nThankfully for American officials, the United States is still well positioned to lead the world when it comes to food security. The United States is among the world’s largest agricultural exporters. It was instrumental in founding the UN architecture dedicated to food security, including the Food and Agriculture Organization and the World Food Program. And for much of these institutions’ history, Washington has been their largest donor. In fact, for decades, the United States’ international development agenda was the most ambitious in the world, and it was backed by a willing public.\n Washington retains many of the tools needed to combat global hunger.\nThe country still has such a public: in early 2026 polling, a strong majority said that the United States should be a moral leader in the world. But a strong majority didn’t believe it was. Perhaps this is because the United States has been walking away from this legacy and this opportunity to lead. In mid-2025, for example, Congress clawed back nearly $8 billion in foreign assistance funds. The United States is now a reluctant international donor and a surly member of key international organizations.\nWashington, however, still retains many of the tools needed to combat global hunger. In addition to incre", "translation_ja": "", "vocab": [{"word": "food insecurity", "definition": "食料への安定したアクセスがない状態。十分な食料を得られないために、食料の質や量を削減せざるを得ない状況を指します。"}, {"word": "exacerbate", "definition": "状況や問題をさらに悪化させる、激化させる。苦情や不満などがより深刻になることを表します。"}, {"word": "tipping point", "definition": "小さな変化が大きな結果をもたらす決定的な瞬間。気候変動などで、これ以上の変化が回復不可能な状態に至る地点を意味します。"}, {"word": "helm", "definition": "船舶の操舵輪のように、指導権を握る、主導する。組織やプロジェクトを率いることを指します。"}, {"word": "stagnate", "definition": "停滞する、進歩が止まる。経済や産業などが成長や改善を停止することを表します。"}, {"word": "liberal world order", "definition": "民主主義と市場経済に基づいた国際秩序。自由と開放性を重視する世界的な規則と制度のシステムです。"}, {"word": "claw back", "definition": "返金させる、取り戻す。政府が支出や補助金を削減したり回収したりすることを指します。"}]}, {"title_ja": "台湾が台湾海峡で勝利するための戦略", "title_en": "How Taiwan Can Win the Strait", "summary_ja": "著者は、台湾が高価な大型水上艦の建造戦略を放棄し、中国の潜在的な侵攻に対抗するために、より小型でステルス性に優れたコルベット艦への投資を重視すべきだと主張しています。現代の監視技術とミサイル技術により、台湾海峡の狭い水域では大型艦が脆弱になる一方、中国の両用攻撃艦はより小型の代替案では置き換えられず、台湾が活用すべき非対称的な利点を生み出しています。", "summary_en": "The author argues that Taiwan should abandon its strategy of building large, expensive surface warships and instead invest in smaller, stealthier corvettes to defend against potential Chinese invasion. Modern surveillance and missile technology make large ships vulnerable in the narrow Taiwan Strait, while China's amphibious assault ships cannot be replaced by smaller alternatives, creating an asymmetric advantage Taiwan should exploit.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/taiwan/how-taiwan-can-win-strait", "state_media": false, "category": "オピニオン", "full_text": "Separated from China by a roughly 100-mile-wide strait, Taiwan relies on its navy as the first line of defense against a potential invasion. It must be able to prevent an assault by a Chinese force carried across the Taiwan Strait in large amphibious ships. Taiwan has traditionally favored large ships such as destroyers and frigates to form the core of its fleet, both as visible symbols of state power and as tools for signaling resolve in the face of Chinese coercion, and Taiwan’s current shipbuilding plans include replacing an aging surface fleet with large and expensive new ships.\nYet large surface ships are vulnerable in the narrow waters of the Taiwan Strait—a problem compounded by advances in technology that are making them easier to detect, track, and attack. China has invested in cutting-edge intelligence, surveillance, and reconnaissance (collectively known as ISR), as well as electronic warfare systems, drones, and missiles. Taiwan’s large surface ships are now a liability. But Taiwan has an advantage: these same technologies make China’s large amphibious ships more vulnerable in restricted waters, and those ships cannot be replaced by smaller, stealthier alternatives. Taipei can take advantage of this mismatch by replacing its destroyers and frigates with a greater number of smaller surface combatants that are more likely to survive an initial wave of Chinese strikes and remain capable of attacking a Chinese invasion fleet.\nThe Taiwanese navy is planning to invest heavily in large surface combatants, including a new 7,000-ton warship and as many as 12 3,000-ton light frigates. These large ships are impediments to the radical transformation of the Taiwanese navy that the Chinese threat requires. Building ships of this size with stealth features and defense systems to survive a battle in the Taiwan Strait would be prohibitively costly; without these features, they would be too vulnerable to play a major role in the navy’s primary wartime mission of denying a Chinese invasion force the use of the Taiwan Strait. Efforts elsewhere to build similarly capable ships have proved costly and difficult. The U.S. Navy’s Constellation-class frigate program, for example, budgeted roughly $1 billion per ship; the cost eventually rose to about $1.5 billion each before the Constellation program was canceled, and even at that price the ships lacked the capabilities needed to fight an advanced adversary in restricted waters. In comparison, the spending on Taiwan’s entire shipbuilding program is projected to be $1.5 billion annually.\nRather than spend resources on large ships, Taipei should build stealthy corvettes weighing between 700 and 1,000 tons, armed with missiles and drones, that are harder to detect and target but can retain enough firepower to attack Chinese ships crossing the strait. Combined with current plans to build shore-based mobile launchers, aircraft armed with antiship missiles, and eight submarines, Taiwan can create a dispersed and hard-to-destroy defense system that can withstand Chinese attacks and repel a potential amphibious assault.\nSITTING DUCKS\nLarge ships may be potent signals of national power, but they are relatively easy to target and politically costly to lose. When ships are fighting in narrow waterways under heavy surveillance, visibility quickly becomes a deadly liability. The sinking of a large ship can also have consequences beyond an immediate military setback. A highly visible and costly loss may make political and military leaders more cautious about risking additional warships as conflict continues.\nMajor naval engagements over more than the last four decades suggest that any navy expecting to fight near an enemy’s coast should be wary of building its force structure around expensive, irreplaceable hulls. The 1982 Falklands War between Argentina and the United Kingdom, for example, showed how a single successful strike on a warship can constrain an entire surface fleet. Argentina entered the Falklands conflict with powerful ships, including the cruiser General Belgrano and the aircraft carrier Veinticinco de Mayo. But after a British submarine sank the Belgrano, Argentina decided to keep much of the rest of its surface fleet, including the carrier, closer to coastal waters or in ports for the rest of the war.\nIn the Persian Gulf six years later, the U.S. Navy’s ability to combine surveillance, aircraft, ships, and precision weapons devastated Iranian naval forces during Operation Praying Mantis. In a single day, U.S. forces sank or badly damaged several Iranian surface vessels operating in the confined waters of the Gulf, including two large frigates. Whereas the Falklands War illustrated the political consequences of losing a major warship, Praying Mantis highlighted the danger for ships facing an adversary with a much more effective “kill chain”—the sensors and communications to detect, identify, track, target, and attack an opponent’s fleet. For Taiwan, the lesson is that ", "translation_ja": "", "vocab": [{"word": "amphibious", "definition": "水陸両用の、陸上と水中の両方で行動可能な。特に軍事用語では、海上から陸上へ兵力を投入する作戦を指します。"}, {"word": "corvette", "definition": "コルベット艦、フリゲート艦より小型の軍艦。警備や哨戒任務に用いられることが多い。"}, {"word": "asymmetric", "definition": "非対称的な、片側が他方より優位にある状態。戦略では敵と異なる強みを活かして対抗する戦術を指します。"}, {"word": "surveillance", "definition": "監視、偵察。特に軍事・セキュリティ分野では、敵の動きや活動を継続的に監視することを意味します。"}, {"word": "stealth", "definition": "隠密性、見つかりにくさ。軍事用語では、レーダーや目視で検出されにくい船舶や航空機の性質を指します。"}, {"word": "constrainment", "definition": "制約、制限。特に軍事戦略では、敵の行動や展開を制限することを意味します。"}]}, {"title_ja": "イランとの膠着状態を支持する論拠", "title_en": "The Case for a Stalemate With Iran", "summary_ja": "著者は、現在の米国とイランの相互封鎖状態は不完全だが、軍事的エスカレーションや完全撤退と比べて米国にとって最も費用対効果が高いと主張している。相互的な経済圧力は、イランの経済がより脆弱であるため、時間とともに米国に有利に働く。米国政策は、この膠着状態を無期限に維持することで、段階的にイランの立場を弱め、危険なエスカレーションを防ぐことに焦点を当てるべきである。", "summary_en": "The author argues that the current U.S.-Iran blockade stalemate, while imperfect, is the least costly option for Washington compared to military escalation or full withdrawal. The mutual economic pressure favors the United States over time since Iran's economy is more vulnerable to sanctions than America's diversified energy resources. U.S. policy should focus on maintaining this stalemate indefinitely to gradually weaken Iran's position and prevent dangerous escalation.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/case-stalemate-iran", "state_media": false, "category": "オピニオン", "full_text": "Six months in, the U.S. and Israeli war on Iran has settled into a stalemate. Neither Washington nor Tehran can achieve a clear military or diplomatic victory. Instead, the two sides have found themselves locked in a mutual blockade of oil and other shipments through the Strait of Hormuz and into Iranian ports, with no obvious way to change the status quo. The costs of accommodating the other side’s demands to end the stalemate are so high, and the costs of the stalemate sufficiently low, that a mutual blockade has emerged as the least bad option for both the United States and Iran for the foreseeable future.\nThis situation may not be ideal for Washington, but it avoids both defeat and escalation. It also works to the United States’ advantage over time: as the blockade drags on, Tehran’s position is likely to weaken faster than Washington’s. The United States has its own ample oil supplies to draw from, whereas nearly the entirety of Iran’s oil exports—and therefore much of its hard currency—has been cut off. An ongoing blockade that gradually ratchets up pressure on Iran could make Tehran more flexible in negotiations with the United States, leading to a compromise that Washington could accept. The challenge is to ensure that Tehran does not choose to respond to its worsening position by escalating its attacks and starting another regionwide conflict that ensnares the United States.\nU.S. policy should focus on avoiding the most disruptive contingencies, especially Iranian escalation, and settle for maintaining dual blockades indefinitely. If Iran is unwilling to concede, Washington can slowly erode the Iranian economy and military while ensuring that Tehran cannot rebuild the strong regional position it enjoyed before the Hamas attack on Israel on October 7, 2023. At this stage, maintaining the current U.S. position is the most effective way of fighting—and winning—this war.\nBEST OF THE WORST\nIn June, Washington and Tehran agreed to a memorandum of understanding to first establish a cease-fire and open the Strait of Hormuz and then to sign a permanent deal within 60 days to resolve long-term issues in the bilateral relationship, including restricting Iran’s nuclear program and removing U.S. and international sanctions and other financial penalties on Iran. But it fell apart before a final deal could be reached largely because Iran failed to fully open the strait. With diplomatic solutions going nowhere, both Washington and Tehran are now hoping that the economic pressure each can put on the other—and in the case of Iran, on the global economy—will force its counterpart back to the negotiating table on terms that will resolve the blockade in its favor.\nA blockade comes with costs for Washington. Keeping the strait closed is raising gas prices and increasing inflation in the United States, an especially sensitive issue as the November midterm elections approach. Prices could rise further if Iran finds a way to limit the millions of barrels of oil that bypass its blockade and are transported through the Strait of Hormuz daily. And the United States has already used up many critical munitions and strained its troops in the region by keeping the war going.\nBut the operation has been relatively affordable compared with past conflicts. The United States lost thousands of lives and spent trillions of dollars in Afghanistan and Iraq, whereas the ongoing conflict with Iran has resulted in 18 American service members killed and has likely cost tens of billions of dollars. (As of mid-July, estimates ranged from $37.5 billion to over $100 billion.) Most important, the mutual blockade has the advantage of being more palatable to political leaders in Washington than any of the alternative options.\nA full U.S. withdrawal from the Strait of Hormuz without gaining concessions from Iran, including ending its blockade, would be unthinkable even for the unorthodox Trump administration. It would allow Iran to tout a complete victory and give the regime in Tehran a powerful psychological boost that would undo much of the progress that the United States and Israel made in the past three years decimating Iran’s network of regional proxies. And it would probably not lead Iran to reopen the Strait of Hormuz for free passage—Tehran is likely to insist on installing some kind of tolling system in perpetuity. With Washington in retreat, Iran could also revive and rebuild its nuclear program, which would be a stunning failure for the United States.\n The United States can continue the mutual blockade at relatively low cost.\nMilitary escalation is an even less appealing option for Washington. The Iranian regime has already survived a massive bombing campaign; a new, even more aggressive offensive could take out much of Iran’s remaining military capabilities and its energy, transportation, and communications infrastructure, but such an offensive could not guarantee that Tehran would accept American terms on opening the strait or curtailing", "translation_ja": "", "vocab": [{"word": "stalemate", "definition": "互いに有利な立場を得られず、進展のない対立状態のこと。政治交渉や紛争で双方とも勝利を達成できない膠着状態を指す。"}, {"word": "blockade", "definition": "相手国の物資やエネルギーの流出入を遮断する経済的・軍事的措置。通常、戦略的な圧力をかけるために実施される。"}, {"word": "escalation", "definition": "紛争や対立の段階的な拡大・悪化のこと。小規模な衝突から大規模な戦争へと進むプロセスを指す。"}, {"word": "erode", "definition": "徐々に減少・縮小させること。経済力や軍事力などが時間とともに弱まる過程を表す。"}, {"word": "contingencies", "definition": "予期しない事態や不測の事態。将来起こりうる可能性のある状況を指す。"}, {"word": "palatable", "definition": "受け入れやすい、容認できるという意味。政治家や国民にとって好ましい、支持しやすいことを表す。"}, {"word": "unorthodox", "definition": "従来の方法や慣例にとらわれない、変わった、異なるやり方を取ることを意味する。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-05 22:30 JST";
  renderTabs();renderList();
})();
</script>
