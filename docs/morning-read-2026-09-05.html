ed attacks on three US-affiliated vessels in response, as well as three oil tankers travelling along an \"unauthorised\" route through the Strait of Hormuz.\nThe BBC has approached Centcom for comment.\nFighting has flared up again over the past week, with little apparent progress towards ending the six-month war.\nIranian state media outlet Irib reported that there were no casualties in Saturday's attack on the tanker near Kharg Island, and that footage indicated the vessel's cooling system put out the fire within an hour.\nKharg Island hosts Iran's main terminal to export oil. Some 90% of the country's crude oil comes through the island, transported through pipes from the mainland.\nThe crews aboard the two attacked tankers in the Gulf of Oman were taken to shore in lifeboats, Irib reported. One of those tankers was empty and the other was carrying a load of oil, it added.\nIrib later reported that Iran's Islamic Revolutionary Guard Corps (IRGC) had retaliated against six ships in the region - three oil tankers in the Strait of Hormuz and three vessels \"affiliated\" with the US \"in other areas\".\nAccording to Irib, the IRGC said the three oil tankers were using \"unauthorised\" routes through the strait and it warned other ships not to do so.\nThe strait, which is crucial to the world's oil and gas industry, has been effectively closed since the war began in February, and has become a major source of leverage for Iran.\nTehran has insisted it will not give up some measure of control over the waterway and has previously targeted vessels using a southern route through Omani waters that avoids its preferred route through Iranian waters.\nDespite the Iranian attacks, US President Donald Trump has declared that the strait is \"open\" and the US military has been helping ships navigate the southern route.\nThe news of Iran's latest retaliation came hours after Defence Secretary Pete Hegseth wrote on social media: \"It's simple: if Iran shoots at US ships, we will destroy (and sink) their oil tankers.\"\nCentcom said it \"successfully evaded\" multiple attacks from the IRGC earlier in the day, which were targeting a US aircraft carrier and guided-missile destroyer. No American troops were harmed, it said.\nCentcom, which oversees US military operations in the Middle East, claimed that the three Iranian oil tankers were \"part of a multi-billion-dollar shadow network that funds the IRGC and its regional proxies\".\nThe strikes come nearly a week after attacks restarted between the US and Iran, following a period of relative calm between the warring sides.\nThe US resumed attacks last Sunday, when it said it had struck two rocket launchers to prevent them being used to lay naval mines in the Strait of Hormuz.\n- How could US-Iran conflict end? Three experts give their views \n  - Published1 day ago\nOn Tuesday, Trump said the US had launched a further \"very heavy attack\", but claimed the renewed fighting would not last \"too long\".\nThe strikes prompted Iran to retaliate against US targets in the region, including in the United Arab Emirates (UAE), Bahrain, Kuwait and Jordan.\nOn Thursday, US Vice-President JD Vance also addressed claims by Iran that American strikes killed at least four people, including two children, at a wedding in southern Iran. He said he was \"extremely sceptical\" over reports of the alleged strike, but confirmed the US would investigate.\nHumanitarian group the Iranian Red Crescent Society said shrapnel from a missile hit the ceremony at a home in Sirik on Tuesday, prompting Tehran to declare it a \"war crime\".\n- What we know about reported strike on Iran wedding celebrations \n  - Published3 days ago\nA 60-day ceasefire between the US and Iran formally expired last month, with little sign of a further diplomatic settlement on the horizon.\nDays after the ceasefire expired, Trump said the US would launch tougher economic measures against Iran, as well as any country that helps or does business with it.\nThe US and Israel first launched wide-ranging strikes on Iran on 28 February, with Iran responding by attacking Israel, US bases and allied states in the Gulf, and effectively closing the Strait of Hormuz to marine traffic.\nThe Strait of Hormuz previously served as one of the busiest oil-shipping routes, carrying about 20% of the world's oil and liquefied natural gas supplies.\nThe squeeze on the strait has raised energy prices globally. And, ahead of the US midterm elections in November, Trump is facing pressure over how much the war is costing American consumers.\nOn Friday,", "translation_ja": "", "vocab": [{"word": "retaliation", "definition": "相手からの攻撃に対する報復行為のこと。軍事紛争や対立において、一方が他方に対して行う応報的な攻撃を指します。"}, {"word": "leverage", "definition": "交渉や圧力において優位性を得るための手段や材料のこと。ここではホルムズ海峡の支配がイランの交渉上の有利な立場となっていることを意味します。"}, {"word": "evaded", "definition": "攻撃や危険をうまく避けるor回避すること。軍事用語として、敵の攻撃から逃れることを表します。"}, {"word": "diplomaticsettlement", "definition": "紛争を交渉と合意を通じて平和的に解決すること。軍事行動ではなく外交手段による問題解決を指します。"}, {"word": "ceasefire", "definition": "紛争当事者間で合意された戦闘停止期間のこと。通常は一時的な休戦で、本格的な和平交渉への前段階として機能します。"}, {"word": "commodities", "definition": "石油やガスなどの国際市場で取引される商品のこと。経済用語として、基礎的な天然資源や農産物を指します。"}]}, {"title_ja": "リンゼイ・クランシー殺人事件、陪審団が意見一致できず公判無効宣言", "title_en": "Mistrial declared in Lindsay Clancy murder case after jury deadlocks", "summary_ja": "マサチューセッツ州の判事は、陪審団が3人の子どもを殺害した罪でのリンゼイ・クランシーの刑事責任について全員一致の決定ができなかったため、公判無効を宣言した。クランシーの弁護側は産後精神病に苦しんでいたため刑事責任を問われるべきではないと主張し、検察側は彼女が行動をコントロール下に置いていたと主張した。9月29日の公聴会で、検察側が新たな裁判を追求するか示談合意を求めるかが決定される。", "summary_en": "A Massachusetts judge declared a mistrial in the Lindsay Clancy case after jurors could not unanimously agree on her criminal liability for killing her three children. Clancy's defense argued she suffered from postpartum psychosis and should not be held criminally responsible, while prosecutors maintained she was in control of her actions. A hearing on September 29 will determine whether prosecutors pursue a new trial or seek a plea agreement.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cpwlrj2je1po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Mistrial declared in Lindsay Clancy murder case, after jury deadlocks\n- Published\nWarning: This story contains distressing details and discussion of attempted suicide\nA Massachusetts judge has declared a mistrial in the murder case against Lindsay Clancy after jurors conceded they would not be able to unanimously decide whether she should be held criminally liable for killing her three young children after a week of deliberating.\nThe case against Clancy has both captivated and heavily divided the American public, even spurring remarks from the US president.\nThere was a sense of disbelief in the courtroom as the case - and Clancy's future - were left in limbo.\nClancy's lawyer led a dramatic last-ditch attempt to halt the mistrial and force a verdict, which was unsuccessful. A hearing later this month could establish what happens next in the case.\n- What happens next after Lindsay Clancy's murder case ends in a mistrial? \n  - Published18 hours ago\n- Key moments from Lindsay Clancy's trial over children's killings \n  - Published1 day ago\n\"At this point, I'm going to declare that the jury is deadlocked and I'm going to declare a mistrial,\" Judge William Sullivan told the jury on Friday, dismissing them after weeks of testimony, seven days mulling Clancy's fate and the panel signalling three times that they were deadlocked.\nThe deadlock - known as a hung jury - does not mean prosecutors have proven their case, nor does it mean the defendant is not guilty.\nA hearing was scheduled for 29 September, in which prosecutors could outline their next steps in the case.\nMeanwhile, the 36-year-old former nurse will remain held on the same murder charges and continue to stay in the mental health facility in which she is currently housed.\nProsecutors could decide from a host of options as to what happens next, including holding another trial or coming to a plea agreement with Clancy over the strangulation of her children - five-year-old Cora, Dawson, three, and eight-month-old Callan - in their Massachusetts home.\nAfter killing the children, Clancy cut herself with a knife and jumped from a second-story window in an attempt to take her own life, which left her paralysed.\nClancy does not deny killing the children in 2023 but pleaded not guilty to the three first-degree murder charges, with her lawyers arguing she was suffering from postpartum psychosis and so should not be held criminally responsible.\nThe grim case led to a series of dramatic twists and turns as the jury deliberated Clancy's fate.\nOn Friday, a court session began with Clancy's attorney Kevin Reddington pushing for a juror on the panel to be removed, after the jury indicated a day prior in a note that a member of the panel had not been following instructions on reasonable doubt.\nUnder US law, a jury must unanimously believe \"beyond a reasonable doubt\" that someone is guilty to convict them of a crime.\nThe designation is the strictest standard in the US legal system. It places the burden on the government to prove that the accused is guilty, instead of the accused to prove their innocence.\nThe judge denied the request and sent jurors back to deliberate. About an hour later, the panel came back to say they still could not reach a verdict.\nIt was then that Sullivan said he had no choice but to declare a mistrial. Reddington immediately pleaded for a temporary pause so they could file an emergency appeal with the Massachusetts Supreme Judicial Court.\nIn the filing, Reddington asked the state's highest court to order the judge to force the jury to continue deliberating and for the judge to question the panel over the alleged holdout juror that led to the deadlock.\nThe state's high court denied the request, paving the way for the mistrial.\nClancy appeared downcast as the judge made the ruling official. It was surprisingly quiet in courtroom.\nShe remained expressionless but her lawyer looked visibly upset by the decision. He continued to push back, insisting the judge had the power to dismiss the one holdout juror.\n\"Unfortunately, they're not holding out based on a good-faith issue,\" he said.\nReddington said he intended to file another motion essentially requesting that the mistrial be reconsidered. This could come up at the next hearing later this month.\n\"There will be no decisions made today,\" Plymouth County District Attorney Timothy Cruz said on Friday concerning what could happen next in the case.\nHe said he would meet the rest of their legal team to decide whether they would pursue a new trial.\n\"The facts are Lindsay Clancy killed her three children and the evidence suggested to us that she was in control of her actions when she committed those homicides,\" Cruz said.\nOutside the court on Friday, Reddington said he believed 11 of the 12 jurors would have delivered a verdict that favoured Clancy had it not been for the one holdout.\nBut it remains unclear what position any member of the jury took or what occurred in the deliberation room.\nFor weeks, the case gripp", "translation_ja": "", "vocab": [{"word": "mistrial", "definition": "陪審団が評決に達することができないか、重大な手続き上の誤りがあった場合に宣言される、無効な裁判。この場合、新たな裁判が行われる可能性がある。"}, {"word": "deadlock", "definition": "陪審団の12人のメンバーが全員一致できず、評決に到達できない状況。米国法では全員一致が必要とされるため、評決不能となる。"}, {"word": "hung jury", "definition": "デッドロックと同じ意味で、陪審団メンバーが有罪か無罪かについて意見が分かれ、全員一致に達することができない状態。"}, {"word": "postpartum psychosis", "definition": "出産後に発症する精神疾患で、幻覚や妄想、判断力の低下などの症状を伴う深刻な精神障害。法廷では刑事責任能力の判断に関連する。"}, {"word": "criminally liable", "definition": "法的に犯罪行為に対して責任を負う状態。被告人が犯罪を犯したと証明され、刑罰の対象となることを意味する。"}, {"word": "plea agreement", "definition": "被告人が特定の罪を認める代わりに、検察側がより軽い罪での起訴や減刑を提案する司法取引。審判を経ずに事件を解決する方法。"}, {"word": "beyond a reasonable doubt", "definition": "米国刑事法における有罪判決に必要な証拠の基準。検察側が被告人の有罪を合理的な疑いなく証明する必要があり、これは最も厳格な法的基準である。"}]}, {"title_ja": "ドーバー港が大規模な「ボート停止」デモで混乱", "title_en": "Port of Dover Disrupted by Large 'Stop the Boats' Protest", "summary_ja": "土曜日に黒装束のマスクをした数百人の抗議者がドーバー港をブロックし、大規模な交通混乱と反移民スローガンを引き起こした。ケント警察は逮捕者なしで事件を自発的なものと説明したが、反ヘイト団体は極右ネットワークが組織したと主張している。昼までに運用は正常に戻り、フェリー運営者が影響を受けた乗客を支援した。", "summary_en": "Hundreds of masked protesters blocked the Port of Dover on Saturday, causing major traffic disruption and chanting anti-migration slogans. Kent Police, which made no arrests, described the event as spontaneous, though anti-hate organizations claim far-right networks organized it. Operations returned to normal by midday, with ferry operators assisting affected passengers.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy8znyzgkjjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Disruption at Port of Dover due to 'stop the boats' protest\n- Published\nThere has been major disruption at the Port of Dover due to a large group of masked men holding a demonstration.\nHundreds of protesters, dressed in black and wearing face coverings, blocked roads and were heard chanting \"stop the boats\".\nTraffic was stopped from going in and out of the port, with the government saying it condemned \"the behaviour in Dover and the travel disruption it has caused\".\nKent Police, which made no arrests, described it as a \"spontaneous\" protest, while Mike Tapp MP said questions need to be asked around why it appeared the police \"didn't know about it\".\nOfficers moved the crowd from the port to Dover Priory railway station at about 11:30 BST and said \"all involved had dispersed by 12:00\".\nPaul King, Reform UK councillor for Dover West, said he had been told it was a \"stop the boats protest\".\nKent Police has not yet commented on who was behind the demo.\nAnti-hate organisation Hope Not Hate claims that the Patriot Platform network arranged the protest, saying the group began meeting in July and has brought together members of anti-migrant groups from around the country.\nDemonstrators told the BBC they did not want to talk to the media, although one said \"send them back\" and another said \"stop the boats\" when approached.\nFar-right activists Tommy Robinson and Danny Thomas both posted about it on X, praising those involved.\nThomas wrote: \"The experience on the ground today, was the overwhelming majority of the women and local people we spoke to were thankful that people were actually doing something.\"\nDover and Deal MP Mike Tapp said the incident, which started at about 07:00, caused \"absolutely awful disruption\" for residents.\n\"I am fed up with idiots coming to Dover,\" he said on Facebook.\n\"I bet if you asked any one of those 'protesters' they wouldn't know small boat crossing are down by 40% and we are working hard to fix the mess.\n\"I will be looking urgently on Monday to ask questions around why we didn't know about this,\" he added.\n\"In this instance, it would appear that the police didn't know about it, and the resources were pretty thin on the ground, to be quite honest from what I saw.\"\nResponding on X, Thomas said Tapp \"might want to take a look at what your own constituents are saying. The comments from people in and around Dover speak for themselves.\"\nLabour leader of Dover District Council Kevin Mills told BBC Radio 4 low policing levels contributed to the disruption protestors caused.\nHe said that the police presence improved over the day, though it was initially \"pretty low\".\nThe Port of Dover said operations had returned to normal and routes in and out of the town had all reopened.\n\"We thank our customers and local community for their patience whilst the police managed the public order incident,\" it said.\nP&O said it would get passengers on to the next available sailing if they had missed their scheduled crossing, as did ferry operator DFDS.\nFerry passenger Remco van Schellen arrived from the Netherlands at about 08:00.\nHe said: \"When we wanted to leave the ferry terminal with the car, we couldn't go any further.\n\"There were people blocking the roads, the roundabout, just outside of the ferry terminal in Dover.\n\"There were people in black clothing, their faces masked, so we couldn't see who they were.\"\nRafael Pittman, a tour guide from London, said the area had been \"absolute chaos\" in the three hours that he was there, waiting to pick up a group of tourists who had docked at Dover.\nHe said: \"Passengers didn't disembark and we couldn't enter the terminal as it was blocked by freight trucks.\n\"The hooded protesters arrived en masse, passed the trucks and headed towards the cruise terminal, followed by the police.\"\nPittman added that, while the protesters \"looked quite frightening\", they were \"friendly-ish\" and told him that they were protesting against illegal migration.\nLania Tkaczyk, from Cheshire, saw men dressed in black outside her hotel in Dover.\nShe said she was unable to leave on time to see her two children take part in a Channel swimming relay at nearby Folkestone.\n\"It was quite intimidating seeing the men head-to-toe in black,\" she said.\n\"Because of the protest I've been delayed but I hope to get to Folkstone to see my children soon.\"\nDemonstrations against immigration are common in Dover, as it is the location where migrants picked up from small boats in the English Channel are brought to shore.\nThey are typically advertised in advance, however, and Saturday's protest was on a larger scale.\nThe Crime and Policing Act 2026 made it an offence to conceal your identity at a protest in England and Wales, but only if the area has been designated by a police officer of a rank of at least inspector.\nIn order to designate an area, the police officer needs to believe offences are likely to take place.\nThe section to do with concealing your identity, external came into force in June.\nReform leader Nigel ", "translation_ja": "", "vocab": [{"word": "disruption", "definition": "通常の活動や運営が妨害されること。ここでは港の交通が遮断されたことを指す。"}, {"word": "spontaneous", "definition": "事前の計画や準備なく、自然発生的に起こることを意味する。警察が予期していなかったデモの特性を表現している。"}, {"word": "constituents", "definition": "議員の選挙区に住んでいる有権者のこと。地域代表としての政治家の支持者を指す。"}, {"word": "designated", "definition": "公式に指定または任命されること。ここでは警察が特定地域を法的に指定することを指す。"}, {"word": "conceal", "definition": "何かを隠したり、秘密にすることを意味する。この文脈ではデモ中に身元を隠すことを指す。"}, {"word": "en masse", "definition": "大勢で一度に、集団で何かをすること。多数の人々が同時に行動することを表現する。"}]}, {"title_ja": "ファラージ氏、外国人ドナー疑惑の話し合いで「聞いていなかった」と主張", "title_en": "Farage Claims He 'Wasn't Listening' During Foreign Donor Scandal Talks", "summary_ja": "ナイジェル・ファラージ氏は、英国拠点の仲介者を通じた外国からの寄付に関する会話に注意を払っていなかったと述べて、改革UK党への外国人寄付の便宜供与疑惑を弁明しました。チャンネル4の秘密調査の後、改革党の2人の高級幹部がその職を解かれており、ファラージ氏は不正行為を否定し選挙法違反がないと主張しています。このスキャンダルは改革党の党大会を影響下に置き、警察による調査要求を促しています。", "summary_en": "Nigel Farage has defended himself against allegations of facilitating foreign donations to Reform UK, stating he was not paying attention during conversations about funneling money through a UK-based intermediary. Two senior Reform officials have been removed from their positions following an undercover investigation by Channel 4, while Farage denies any wrongdoing and insists electoral law was not broken. The scandal has overshadowed Reform's party conference and prompted calls for a police investigation.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c0qxgn7q1vdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Nigel Farage tells BBC he 'wasn't listening' during foreign donor talks filmed undercover\n- Published\nNigel Farage has said he \"frankly wasn't listening\" during a conversation with his former chief of staff and an undercover reporter discussing what appears to have been a scheme to funnel foreign money to Reform UK.\nHis former chief of staff Dan Jukes and ex-head of policy James Orr have both been removed from their jobs after an investigation recorded them talking about how to get money to the party from an American donor and asking a fake company to pay for polling.\nJukes has denied doing anything wrong. Orr has told Sky News he will co-operate fully with Reform's internal investigation.\nIn an interview with the BBC, the Reform leader said he was not listening to the discussion and revealed his family are \"begging\" him to leave his job amid increasing pressure.\nIn a film by Verbatim Investigations and Channel 4 News, Farage and Jukes were present during a conversation in which it is suggested the US donor gives £500,000 to Reform through his UK-based son.\nUnder electoral law, donors to UK political parties must be a UK registered voter, or a company registered in the UK, so cannot give money from abroad through a British resident.\nThe proposed donation was never made as it was part of an undercover sting, but that it was seemingly entertained has sparked questions.\nWhen asked about the exchange by reporters at Reform's party conference on Friday, Farage said he was questioning whether the arrangement was above board.\nIn an interview to be broadcast on Sunday with Laura Kuenssberg, he has now said: \"I am not a compliance officer. I was in the middle of canvassing in the Clacton by-election. I turn up. I frankly wasn't even listening.\"\n\"I was told there was a global family office based in London, so the money could have come from Singapore,\" he said of the conversation in the Channel 4 film.\n\"The money could come from all over the world, you know. Income could have came from all over the world into a family office based in London. I know electoral law. I know donation law better than anybody.\n\"Frankly, the two individuals involved here have never been involved in fundraising before and they shouldn't have been involved directly in fundraising. They should have done basic checks and nobody, nobody should be brought to me, unless they've been vetted from.\"\nThe row over the Channel 4 film has threatened to capsize Reform's conference, with Labour and the Liberal Democrats calling on the Metropolitan Police to investigate the claims. The force is assessing whether or not to investigate.\nJukes and Orr - both senior figures in Farage's inner circle - have stood down pending the outcome of the party's internal investigation, but political opponents are demanding that Farage is investigated and takes accountability.\nFarage categorically denied that Reform had ever taken money from a foreign entity by channelling it through a UK donor.\nBut as pressure ramps up on Farage in the latest crisis to rock Reform, he also told the BBC that \"for the first time\", he does not have his family's support to be in politics.\n\"They would rather I packed it up and walked away,\" he said.\nHe added he had not considered standing down, but \"when you've got your family begging you to, it's not easy\".\nFarage also condemned the hundreds of masked \"stop the boats\" protesters who descended on the Port of Dover on Saturday morning, causing major travel disruption.\nFarage said he \"deplored\" anyone wearing masks or balaclavas at public demonstrations.\nHe added: \"You should not be allowed to be masked up, balaclava-ed up and go out and protest on the streets of our country. It is wrong at every level. So I deplore what is happening in Dover today.\"\nAnalysis: Farage may have to pay more attention\nThere's no question the allegations in the Channel 4 film have been embarrassing for Reform, and disrupted what they hoped would be a conference about their plans for office if they win the next General Election.\nEverywhere around the huge, draughty exhibition hall in Birmingham are giant posters and placards saying, \"Reform - the first 100 days\".\nThey wanted to herald their deal with a serious contender to be the next French President, Jordan Bardella, to deal with small boats.\nThey were keen to highlight the promise to cut income tax if they win the election, scheduled to be in 2029.\nThey wanted to talk about their proposals for education, welfare, planning, and the rest.\nParty members, delighted to have a reason to get together, have taken part in those sessions, applauded and cheered in the hall; gone wild for Farage on stage.\nBut for the rest of the country, most of the noise from the conference will have been the huge and awkward story about the toxic mix of politics and money.\nWhat is harder to assess is the impact this mess will have on Farage's standing with the public, after a tricky summer and a recent poll slump.\nAt the top of the party there ", "translation_ja": "", "vocab": [{"word": "undercover", "definition": "秘密裏に実行される調査や作戦のこと。身元を隠して情報を収集する活動を指します。"}, {"word": "funnel", "definition": "資金や物資を特定の方向へ導く、またはルートを通して送ること。政治資金が迂回ルートで流れることを意味します。"}, {"word": "compliance officer", "definition": "法令順守を監督する職務。企業や組織が法律や規制に従っているかを確認する責任者を指します。"}, {"word": "electoral law", "definition": "選挙に関する法律。政党への寄付や献金ルールなどを規定する法律体系を意味します。"}, {"word": "capsize", "definition": "船が転覆するという意味ですが、比喩的に計画や組織が崩壊することを表します。"}, {"word": "sting", "definition": "詐欺や不正を暴露するための秘密作戦。当番組ではジャーナリストによる真実追求を指します。"}, {"word": "vetting", "definition": "徹底的な調査や審査。候補者や提案が適切であるかどうかを厳密に確認するプロセスです。"}]}, {"title_ja": "ウィリアム皇太子、ノルウェーのハラルド国王葬儀に参列へ", "title_en": "Prince William to Attend King Harald's Funeral in Norway", "summary_ja": "ウィリアム皇太子は父親のチャールズ国王の代理として、9月9日にオスロで行われるノルウェーのハラルド5世国王の葬儀に参列する。アン王女も新国王ハーコン8世の名付け親として個人的に参加する。35年間の在位中にノルウェーの王制を近代化させた故国王は、親しみやすい人物として人気があった。", "summary_en": "Prince William will represent King Charles at the funeral of Norway's King Harald V on September 9 in Oslo. Princess Anne will also attend in a personal capacity as godmother to the new King Haakon VIII. The late king, who modernized the Norwegian monarchy during his 35-year reign, was a popular figure known for his down-to-earth approach.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cp301rw6kvro?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Prince William to attend King Harald's funeral in Norway\n- Published\nThe Prince of Wales will attend the funeral of King Harald V of Norway on Wednesday in Oslo, Buckingham Palace has announced.\nAlso going to the funeral, in a personal capacity, is Princess Anne, who is godmother to Norway's new monarch, King Haakon VIII.\nThe late King Harald, a popular, modernising figure who had been on the Norwegian throne for 35 years, died last month at the age of 89.\nRoyal sources say Prince William's attendance, representing his father King Charles, follows the convention that the monarch does not usually go to the funeral of another head of state.\nLarge crowds are expected for the farewell to King Harald on 9 September, with a funeral procession to be followed by a service at Oslo Cathedral.\nThousands have queued to pay their respects to the late king, during his lying in state in the chapel of the Royal Palace in the Norwegian capital.\nAt the funeral, alongside Prince William, will be the widowed Queen Sonja, members of the Norwegian royal family including new King Haakon VIII, and other European royals.\nThe service will be followed by a private burial in Norway's royal mausoleum in the Akershus Fortress.\nAmong the tributes to King Harald was an emotional televised speech by his son King Haakon, who said: \"Thank you for being such a good dad.\"\nHarald had been seen as a down to earth \"people's king\" who had helped to modernise the monarchy, broken with tradition by marrying a commoner and served as a unifying figure.\nHis son said he represented the values of a \"society built on law and justice, where everyone is of equal value\".\nKing Charles's message praised his cousin King Harald for serving his people with \"unwavering dedication, guiding Norway through times of great change with warmth and humility\".\nKing Haakon assumes his role at a difficult time, with the Norwegian royal family facing scandals this year.\nHis wife, Queen Mette-Marit, came under scrutiny when it was revealed she had maintained a three-year friendship with the sex offender Jeffrey Epstein, for which she publicly apologised.\nHer son from a previous relationship, Marius Borg Høiby, was convicted in June of rape and other offences and sentenced to four years in prison. He is appealing.\nWhile Prince William will be in Norway, King Charles has returned to Scotland, after meeting President Macron of France at the Bayeux Tapestry exhibition in London this week.\nThe King will be hosting Andy Burnham at Balmoral this weekend, in the traditional annual visit of the prime minister to stay with the monarch.\n- Who is Norway's new King Haakon VIII? \n  - Published28 August\n- Norway mourns King Harald as Haakon VIII ascends throne \n  - Published28 August\n- Norway's new king remembers 'my dear father' in first speech \n  - Published7 days ago\nSign up here to get the latest royal stories and analysis every week with our Royal Watch newsletter. Those outside the UK can sign up here.", "translation_ja": "", "vocab": [{"word": "modernising", "definition": "伝統的な方法や制度を新しい方法に変えること。王制の場合、より民主的で時代に適応した形に改革することを意味する。"}, {"word": "convention", "definition": "長年の慣例や一般的な合意に基づく行動規範。外交儀礼では君主が他国の国家元首の葬儀に参列しないという慣行のこと。"}, {"word": "lying in state", "definition": "故人が棺に入った状態で公開され、市民が弔問する儀式。王族や重要人物の葬儀の準備段階として行われる。"}, {"word": "mausoleum", "definition": "王族や著名人を埋葬するための大規模な石造の墓所。歴史的な記念碑として機能することが多い。"}, {"word": "unwavering", "definition": "揺るがない、一貫した。信念や決意が変わらないことを表す。"}, {"word": "scrutiny", "definition": "厳密な調査や批判的な検討。スキャンダルが報道される際に、詳しく調べられることを意味する。"}]}, {"title_ja": "シリア人の多くがアサド死刑判決では不十分だと感じる理由", "title_en": "Why Many Syrians Feel Assad Death Sentence Isn't Enough", "summary_ja": "2026年8月、ダマスカス裁判所は旧シリア独裁者バッシャール・アサドを戦争犯罪と人道に対する罪で欠席のまま死刑判決した。しかし、アサドはロシアで安全に生活しているため、多くのシリア人はこれを象徴的なものと見なしている。刑事裁判を超えて、シリアの過渡期正義プロセスは、被害者を中心に、行方不明者、拷問調査、賠償、制度改革に対処する必要がある。", "summary_en": "A Damascus court sentenced former Syrian dictator Bashar Assad to death in absentia in August 2026 for war crimes and crimes against humanity, but many Syrians view this as largely symbolic since Assad lives safely in Russia. Beyond criminal trials, Syria's transitional justice process must address missing persons, torture investigations, reparations, and institutional reforms with victims at the center.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/why-many-syrians-feel-assad-death-sentence-isn-t-enough/a-78985915?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Why many Syrians feel Assad death sentence isn't enough\nSeptember 5, 2026\nHuda Khayti often finds herself returning to the place where she lost almost everything. Khayti, a Syrian women's rights activist, survived a 2013 chemical weapons attack on the east Ghouta region by forces of the former Syrian dictator Bashar Assad.\nHer brother was killed by the bombs of the Assad regime and its allies. Her women's center was destroyed along with her home and in 2018, she had to leave her hometown of Douma — a major city in Ghouta — and flee to Idlib, a rebel stronghold in northern Syria.\nToday, Khayti regularly visits her hometown, which is about 10 kilometers (about 6 miles) northeast of the country's capital, Damascus. Since the Assad regime was overthrown in late 2024, Khayti has traveled regularly between Idlib and Douma, where she's even working on opening a new women's center.\n\"Ghouta means so much to me emotionally,\" she told DW. But every time she returns there, she is also confronted with remnants of the civil war. \"When I'm traveling through the country I see traces of war everywhere, so many houses and so much infrastructure destroyed. So much suffering. So much trauma.\"\nAlmost two years since the overthrow of the Assad regime, Syria has started a process to examine the crimes of the regime in court. In mid-August a Damascus court sentenced Bashar Assad and other high-ranking members of his regime to death in absentia. Assad is currently living in Russia, where he fled after his government was overthrown. Many senior officials are also there or hiding elsewhere.\nAmong other things, Assad was found guilty of premeditated murder, torture and depriving individuals of their liberty. The court said these were war crimes and crimes against humanity.\n\"Of course, this conviction of Assad is a good thing,\" Khayti said. \"Even if it's only on paper. Bashar Assad may have been convicted but he just continues to live his life in Russia — like so many other Syrian criminals who fled to Russia.\"\nJustice served in Syria?\nThe court's conviction had a big impact in Syria anyway. \"The verdict had a lot of echoes by people, they were so happy,\" said Lina Chawaf, a Syrian journalist, media expert and researcher at Harvard University's Center for Middle Eastern Studies. \"Many media celebrated the verdict on the statement day as a victory and consider it as part of transitional justice.\"\nStill, it remains unclear whether there will be any actual punishment following the conviction. Although Russia and Syria agreed on an extradition treaty in 2023, observers say it's unlikely Russia would send Assad, a long-time ally, back to Syria. Additionally, according to the treaty, if the death penalty is likely, that could prevent extradition too.\nIn August, Syria's Deputy Justice Minister Mustafa al-Qassem said the country had established a commission to cooperate with Interpol and that cooperation with other countries in extraditing fugitive suspects would speed up legal proceedings.\nRana Sheikh-Ali, founder of Daret Salam (Peace Circuit in English), which uses technology to build peace and empower women, believes the Assad trial in August should be seen as largely symbolic. From a human rights perspective, she opposes the death penalty, but at the same time she says many locals saw the death sentences as just.\nBut the prosecution of high-ranking regime members is only one aspect of the transitional justice process.\nTransitional justice isn't just about criminal trials. Other aspects include searching for missing people, investigating crimes, deciding on reparations and formulating institutional reforms. With all that, the focus should be on victims and survivors.\nNumbers supplied by the Syrian Network for Human Rights indicate just how big the task is. In an article, the advocacy network reports that over 234,805 civilians were killed during the civil war, at least 202,000 of them by the Assad regime and its allies.\nIn addition, there are also at least 181,312 cases of arbitrary arrest and enforced disappearance to investigate as well as 45,339 deaths resulting from torture. It's thought that the actual numbers are likely far higher. The network has also documented 217 chemical weapons attacks by the Assad regime.\nVictim-centered process needed\nWomen's rights activist Khayti was just a few kilometers from the epicenter of one of those attacks in eastern Ghouta in 2013. \"I remember it like it was yesterday,\" she recounted. \"I can't forget the screams of the victims. I kept thinking we were next. I felt that scratchiness in my throat, that burning in my eyes.\"\nFor a system of transitional justice that is truly victim-centered, it's not enough to just have survivors act as witnesses in court. \"Victims must also participate in every detail related to the transitional justice process,\" she explained.\nAdditionally, those who were impacted by the crimes must be able to participate voluntarily and be protected as they do, Sheikh-Ali added. The", "translation_ja": "", "vocab": [{"word": "in absentia", "definition": "被告人が法廷に出廷しない状態で下された判決や裁判のこと。欠席したままの状態を意味するラテン語由来の法律用語。"}, {"word": "transitional justice", "definition": "紛争や独裁体制の終焉後に、過去の犯罪を調査・処罰し、被害者を支援し、社会的和解を促進するプロセスのこと。"}, {"word": "extradition", "definition": "ある国の当局が他国に対して、その国にいる容疑者や有罪判決を受けた者の引き渡しを求めるプロセス。"}, {"word": "enforced disappearance", "definition": "政府またはその代理人が人を逮捕・拘禁し、その人の行方を隠蔽する人権侵害行為。"}, {"word": "victim-centered", "definition": "司法制度や政策において被害者のニーズと権利を最優先に置くアプローチのこと。"}, {"word": "reparations", "definition": "過去の犯罪や損害に対して被害者に対して行われる補償。金銭的補償、名誉回復、制度改革などを含む。"}]}, {"title_ja": "クロアチア：違法な有毒廃棄物貯蔵に抗議する数万人", "title_en": "Croatia: Tens of Thousands Protest Over Illegal Toxic Waste Storage", "summary_ja": "クロアチアの首都ザグレブで、政府の対応不足に抗議する数万人が集結しました。ゴスピッチ近郊の埋立地に違法に貯蔵されている有毒廃棄物が問題となっており、イタリア、ドイツ、スロベニアから35,000トンの廃棄物が違法に投棄されたことが明らかになっています。プレンコビッチ首相は10月中旬までに汚染されたゴスピッチサイトをカバーすることを約束しています。", "summary_en": "Tens of thousands of people gathered in Zagreb to protest against Croatia's government over illegal toxic waste storage at a landfill near Gospic. The protest, which included demands for clearing illegal landfills and banning waste imports, follows an ongoing investigation into 35,000 tons of waste illegally dumped from Italy, Germany, and Slovenia. Prime Minister Andrej Plenkovic promised to cover the contaminated Gospic site by mid-October before waste removal begins.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/croatia-toxic-waste-protest-draws-tens-of-thousands/a-79049228?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Croatia: Toxic waste protest draws tens of thousands\nSeptember 5, 2026\nA protest in Zagreb against Croatia's government drew tens of thousands of people who blamed the government for its lack of action over the illegal storage of toxic waste.\nA landfill near the town of Gospic, located some 200 kilometers (124.2 miles) to Zagreb's southwest, is being used to hold toxic waste from several countries, including Germanyand Italy, according to reports.\nThe demonstration saw signs such as \"ecocide equals slow genocide\" and \"halt waste import,\" with many of the people in attendance also holding Croatian flags.\nThe protesters called for all illegal landfills to be cleared due to them polluting groundwater, as well as a new waste management plan across the country within the next 20 days. They also demanded that the government put a temporary ban on waste imports in place.\nInvestigation underway\nAn investigation in relation to illegal waste dumps has been ongoing since the arrests of 13 people in February 2025, with Europol cooperating with Croatian authorities in the investigation. Four companies are also under investigation.\nAccording to Europol, most of the 35,000 tons of waste had come from Italy, but also from Slovenia and Germany, and consisted of plastic refuse and toxic hospital waste, bringing about a profit of some €4 million ($4.6 million) for the suspects, who had also likely forged documents falsely declaring plastic waste as suitable for recycling.\nLocal environmental activists dispute the number of waste tons and say 37,000 tons had been illegally dumped in Gospic alone.\nProsecutors also published a report in August that confirmed the Gospic soil contamination, also saying it had spread beyond the site itself.\nThis presents a \"significant risk for the environmentand people's health,\" the report said, despite the drinking water in Gospic remaining so far unaffected, health authorities said.\nConservative Prime Minister Andrej Plenkovic promised the toxic waste site in Gospic would be covered by mid-October before the waste gets removed from it.\nEdited by: Srinivas Mazumdaru", "translation_ja": "", "vocab": [{"word": "ecocide", "definition": "生態系に対する大規模な破壊や環境犯罪を指す造語で、ジェノサイド（大量殺人）になぞらえて環境破壊の深刻さを表現する言葉です。"}, {"word": "groundwater", "definition": "地表面の下に存在する地下水を指し、多くの地域で飲料水や農業用水の重要な水源となっています。"}, {"word": "contamination", "definition": "有害物質や汚染物質が混入して汚れた状態を指し、土壌汚染や水質汚濁などの環境問題を表します。"}, {"word": "forged", "definition": "文書や証拠を偽造する、または不正に作成することを意味し、詐欺や違法行為に該当する行為です。"}, {"word": "Europol", "definition": "欧州警察機構の略称で、加盟国間の警察協力と国際的な犯罪捜査を調整するEUの機関です。"}, {"word": "landfill", "definition": "廃棄物を埋め立てる場所で、ゴミを地中に埋めて処理する施設を指します。"}]}, {"title_ja": "マスク姿の反移民デモ隊がイギリスのドーバー港を封鎖", "title_en": "Masked anti-migrant protesters block UK's Dover terminal", "summary_ja": "数百人のマスク姿のデモ隊が土曜日にイギリスのドーバー港での交通を遮断し、フランスと英国間のフェリー便を停止させました。2026年の移民横断が40%減少したにもかかわらず、抗議活動は極右勢力の関心を反映しています。警察は数時間後に通常の交通を再開し、政府は混乱を非難しながら平和的抗議の権利を認めました。", "summary_en": "Hundreds of masked protesters blocked traffic at England's Dover port on Saturday in an anti-migrant demonstration, halting ferry services between France and the UK. Despite migrant crossings dropping 40% in 2026, the protest reflects the far-right's focus on the issue. Police resumed normal traffic after several hours, and the government condemned the disruption while affirming the right to peaceful protest.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/masked-anti-migrant-protesters-block-uk-s-dover-terminal/a-79046929?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Masked anti-migrant protesters block UK's Dover terminal\nSeptember 5, 2026\nHundreds of masked people blocked traffic at England's port of Dover on Saturday as part of an anti-migrant protest, halting ferry traffic between France and the UK.\nVideo footage showed demonstrators in balaclavas chanting \"stop the boats,\" in a reference to refugees and migrants who attempt the dangerous English channel crossing in a bid to reach Great Britain.\nThis came despite the fact that crossing dropped 40% between January and August 2026 compared to the previous year. However, the perceived threat of migrant boats has become a rallying cry for the far-right Reform UK party.\nPolice said that they were \"engaging\" with protesters and that normal traffic had resumed at the port after several hours.\nGovernment condemns 'travel disruption'\n\"The right to peaceful protest is fundamental to our democracy, but we condemn the behavior in Dover and the travel disruption it has caused,\" said a spokesman for the government of Prime Minister Andy Burnham.\nUnder Burnham and his predecessor Keir Starmer, migrant crossings have been greatly reduced in part due to closer cooperation with French authorities.\nDover is the UK's biggest international ferry port, handling some 15,000 passengers a day during the summer and welcoming more than a third of the UK's trade goods with the European Union.\nEdited by: Srinivas Mazumdaru", "translation_ja": "", "vocab": [{"word": "balaclava", "definition": "顔全体を覆うニット帽。特に寒冷地や抗議活動などで身元を隠すために着用されることがあります。"}, {"word": "engrossing", "definition": "警察が抗議者と対話する、または交渉するという意味です。ここでは警察が状況に対応していることを示しています。"}, {"word": "rallying cry", "definition": "特定の大義名分や目的の下で人々を結集させるスローガンやメッセージのこと。政治運動などで支持者を動員するために使われます。"}, {"word": "disruption", "definition": "正常な活動や秩序が中断されること。この場合、交通や運輸サービスの混乱を指しています。"}, {"word": "cooperation", "definition": "複数の者や機関が共通の目標のために協力することを意味します。ここでは英国とフランスの当局間の協力を指しています。"}, {"word": "perceived threat", "definition": "実際に存在するかどうかに関わらず、人々が感じている、または信じている脅威のこと。客観的な事実とは異なる可能性があります。"}]}, {"title_ja": "米国がイランの報復措置として3隻の石油タンカーを攻撃", "title_en": "US Strikes Iranian Oil Tankers in Retaliation Amid Strait of Hormuz Tensions", "summary_ja": "米国はイランに対する報復措置として3隻の石油タンカーへの攻撃を実施しました。ホルムズ海峡は両国間の継続的な紛争における主要な緊張地点のままです。この事件は世界で最も重要な海上通路の一つにおける緊張をエスカレートさせています。", "summary_en": "The United States has conducted strikes against three Iranian oil tankers in a retaliatory military action. The Strait of Hormuz remains the primary flashpoint in the ongoing conflict between the two nations. The incident escalates tensions in one of the world's most critical maritime passages.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates-centcom-targeted-iranian-forces-posed/?id=136080582", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース配信", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、速報ニュースと生中継イベントの24時間体制の配信を提供しています。視聴者は主要なニュースが展開する際のリアルタイム更新にアクセスできます。このプラットフォームは、国内および国際的なニュースイベントに関する包括的なレポートを配信します。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events throughout the day. Viewers can access real-time updates on major stories as they develop. The platform delivers comprehensive reporting on national and international news events.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "判事、トランプ圧力キャンペーンがリフレクティングプール事件を永遠に沈める可能性を示唆", "title_en": "Judge Signals Trump Pressure Campaign May End Reflecting Pool Case", "summary_ja": "判事はハーン氏の行為に関する検察の調査が継続しているかどうかを質問した。検察官は積極的な調査を行っていないことを確認し、トランプ周辺の圧力キャンペーンが事件の恒久的な却下または終結をもたらす可能性があることを示唆している。", "summary_en": "A judge questioned whether prosecutors were continuing their investigation into Hearn's conduct related to the Reflecting Pool case. Prosecutors confirmed they were not actively investigating, suggesting the pressure campaign surrounding Trump may result in the case being permanently dismissed or concluded.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/judge-trumps-pressure-campaign-permanently-sink-reflecting-pool/story?id=136210636", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エジプトのテレビ司会者、麻薬密売事件で死刑判決を受ける", "title_en": "Egyptian TV presenter sentenced to death in major drug trafficking case", "summary_ja": "エジプトの裁判所は、テレビ司会者サラ・ハリーファ氏（39歳）と他11人に対し、麻薬製造・密売の罪で死刑判決を言い渡した。当局は750kg以上の違法薬物と原材料を押収し、実験室として使用されていた2つのアパートを発見した。この判決はエジプト法で必須とされているグランド・ムフティの宗教的見解の審査後に下され、控訴の対象となっている。", "summary_en": "An Egyptian court sentenced television presenter Sarah Khalifa, 39, and 11 others to death for manufacturing and trafficking narcotics in a sprawling organized crime case. Authorities seized over 750kg of drugs and raw materials, discovering two apartments used as laboratories. The verdict, which required consultation with Egypt's Grand Mufti as required by law, is subject to appeal.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/05/egyptian-tv-presenter-among-12-sentenced-to-death-for-drug", "state_media": false, "category": "社会", "full_text": "An Egyptian court sentenced a well-known television presenter and 11 others to death for manufacturing and trafficking narcotics in a sprawling drug case, official media reported on Saturday.\nThe presenter, Sarah Khalifa, 39, is best known for her programme Mission Impossible, which dealt with issues concerning security and crime.\nThe state-linked Al-Ahram newspaper said a Cairo court sentenced “Khalifa and 11 other defendants to death by hanging on charges of forming an organised criminal gang specialising in procuring materials used in manufacturing narcotics, with the intent to traffic them, and possessing and carrying unlicensed firearms and ammunition”.\nThe verdict came after the court consulted the Grand Mufti of Egypt for his religious opinion, a procedure required by Egyptian law in capital cases.\nThe verdict is subject to appeal.\nKhalifa also owns a cosmetic surgery clinic and a production company that specialises in organising parties and events.\nAccording to the state-run Akhbar el-Yom newspaper, the defendants were charged with “manufacturing synthetic drugs with the intent to traffic them, by importing the materials used in manufacturing from abroad”.\nAl-Ahram reported that authorities seized more than 750kg of narcotics and raw materials, and found two apartments used as laboratories as well as unlicensed firearms and ammunition.\nThe court also sentenced Khalifa and others to five years in prison over a separate case involving the kidnapping and assault of a young man.\nEgypt applies the death penalty for premeditated murder, terrorism, some rape offences and drug trafficking.\nAccording to the Egyptian Commission for Rights and Freedoms, 541 death sentences were issued in Egypt in 2025.", "translation_ja": "", "vocab": [{"word": "sprawling", "definition": "広がった、複雑に絡み合った大規模な事件や組織を指す形容詞。複数の関係者や広い地域に及ぶ場合に使われます。"}, {"word": "narcotics", "definition": "麻薬、特に違法薬物を指す技術用語。医療や法律の文脈で使われることが多いです。"}, {"word": "premeditated", "definition": "事前に計画された、故意にという意味の法律用語。犯罪の悪質性の程度を示す際に使われます。"}, {"word": "verdict", "definition": "裁判所が下す判決や判定を指す法律用語。陪審団による判断や法廷での最終的な決定を意味します。"}, {"word": "trafficking", "definition": "違法な品物の密売・密輸を指す犯罪用語。麻薬や武器などの不法な取引活動を意味します。"}]}, {"title_ja": "国連、アフリカの実際の大きさを正確に表示する新しい世界地図を採択", "title_en": "UN Adopts New World Map to Accurately Display Africa's True Size", "summary_ja": "国連は16世紀のメルカトル図法を廃止し、2018年の「等面積図法」に置き換えることを投票で決定しました。164カ国が支持し、米国のみが反対票を投じました。この決議は教育カリキュラムと技術の更新を目指し、アフリカを視覚的に矮小化してきた数世紀の地図投影法の歪みに対処するものです。拘束力はありませんが、従来の地図表現に組み込まれた偏見を正し、認識を脱植民地化する世界的な取り組みを象徴しています。", "summary_en": "The United Nations voted to officially retire the 16th-century Mercator map projection in favor of the 2018 Equal Earth design, which more accurately represents Africa's actual size. The resolution, supported by 164 countries with only the US voting against it, aims to update educational curriculums and technology, addressing centuries of cartographic distortion that visually minimized Africa. While non-enforceable, the vote signals a global effort to decolonize perceptions and correct biases embedded in traditional map representations.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/04/un-vote-world-map-mercator-equal-earth-africa", "state_media": false, "category": "政治", "full_text": "The United Nations has voted to adopt a resolution for the world to formally phase out the traditional Mercator map of the globe in favour of one that more accurately displays Africa’s size.\nIn a session at its headquarters in New York, the UN general assembly officially retired the 16th-century Mercator projection in favour of one based on the more accurate 2018 Equal Earth design.\nAt the session, 164 countries voted in favour of the resolution. Only the US voted no, with its representative saying the resolution was “superfluous”. There were six abstentions.\nUN resolutions are non-enforceable, so countries and institutions will not be mandated to use only the new projection or forbidden from using the old one. However, the outcome is expected to result in an update of classroom curriculums and everyday technology given the wide usage of the Mercator projection in education, technology and governance.\nTogo, which spearheaded a campaign for the resolution on behalf of the African Union, said the resolution “recognises and affirms that disproportionate cartographic representations, particularly those resulting from the Mercator projection, have had lasting cognitive, educational, cultural, geopolitical and socioeconomic effects, contributing to a drastic reduction in the perceived size of Africa and other regions of the world in the global collective imagination”.\nSpeaking before the resolution passed, Robert Dussey, Togo’s foreign affairs minister, said: “This discussion is not a political discussion [but] a scientific discussion, because there is scientific proof so we all have to accept the reality.”\nThe Mercator layout was introduced by the Flemish cartographer Gerardus Mercator in 1569 to help sailors navigate the seas. Almost five centuries later, it remains the global standard.\nBecause of its projection style, however, regions near the equator appear significantly smaller than they are, whereas high-latitude areas look much larger. For example, the map shows Africa as being similar in size to Greenland, but the continent is 14 times larger than the Danish territory.\n“You could fit the United States, China, India, Japan, Mexico and much of Europe into Africa and still have land to spare,” says a petition on Change.org for the #CorrectTheMap campaign, which has more than 11,000 signatures. The African Union endorsed the campaign in August 2025 and then asked Togo to spearhead its adoption.\nOn Friday, before the vote, France’s foreign minister spoke in support of the resolution. “[We] will abandon the Mercator projection in favour of map representations tailored to specific uses, more faithful to actual surface areas and in line with the recommendations of cartographers and scientists,” Jean-Noël Barrot said during a speech at the Sorbonne University in Paris, in a move seen as part of France’s push to increase goodwill among its former colonies. France will now use the Eckert IV projection, which is close to the Equal Earth projection recommended in the resolution.\nHistorians and geographers have said for years that the Mercator projection is rooted in western stereotypes. Activists have echoed this, with some coining the term “cartographic colonialism”.\nSome argue that the map has subtly shaped international power dynamics by minimising the physical presence of the global south and visually inflating northern hemisphere nations while shrinking equatorial regions. This is said to have reinforced systemic biases in international trade, development priorities and educational frameworks.\nOne of the Mercator projection’s most prominent critics was Arno Peters, a German historian, who launched the Peters world map based on the Gall–Peters projection in 1973. It has often been used as an alternative to the Mercator map.\nTogo’s #CorrectTheMap campaign promoted the use of the 2018 Equal Earth design, which was developed by an international team of cartographers. Supporters say it will help to reverse perceptions of Africa and decolonise global curriculums.\nSome analysts agree. JJ Enoch, a London-based senior associate at JS Held, a geopolitical risk advisory firm, said the Mercator projection visually diminished Africa’s true scale. He linked the campaign to a quest by African nations for “greater influence in global institutions and greater control over how the continent is represented”.\nHe said: “Adopting an equal-area map … would provide a more accurate basis for education and public understanding, while signalling that Africa’s demographic, economic and geopolitical importance should no longer be viewed through inherited and distorted conventions.”\nTogo’s government is planning an event in Lomé, the Togolese capital, with Unesco, the African Union and tech brands such as Google Maps during the first quarter of next year to map out the implementation of the resolution.\nSpeaking before the vote, Dussey said: “To those who say why now, I say: why not? When we look at the world map … it is time for us to change ", "translation_ja": "", "vocab": [{"word": "projection", "definition": "地図を平面に表現する際の数学的な投影方法を指します。メルカトル図法など異なる投影法により、同じ地域でも見た目が大きく異なります。"}, {"word": "disproportionate", "definition": "本来の大きさや比率と合わない状態を意味します。記事ではメルカトル図法によるアフリカの不釣り合いな小さな表現を指しています。"}, {"word": "cartographic", "definition": "地図製作や地図表現に関連する形容詞です。地図の作成、表現、または解釈に関わる専門的な用語です。"}, {"word": "geopolitical", "definition": "地理的要因が国際政治や権力関係に与える影響を扱う分野です。地域の支配力や国際的影響力を分析する際に用いられます。"}, {"word": "equator", "definition": "地球を東西に二分する仮想線で、北緯0度の位置を指します。赤道付近の地域はメルカトル図法で不正確に表現されます。"}, {"word": "colonialism", "definition": "先進国が発展途上国を支配・統治する歴史的体制を指します。記事の「cartographic colonialism」は地図を通じた西洋中心的な支配の影響を表現しています。"}, {"word": "reinforce", "definition": "既存のパターンや信念をさらに強める、または支援することを意味します。メルカトル図法が国際的なバイアスを強化してきたことを説明しています。"}]}, {"title_ja": "スペイン首相、モロッコがセウタ国境侵入を計画したとの証拠はないと主張", "title_en": "Spain's PM denies Morocco planned Ceuta border breach despite police report", "summary_ja": "スペインのペドロ・サンチェス首相は議会で、7月後半のセウタへの大量国境越えをモロッコが計画または助長したという証拠はないと述べた。警察報告書は異なる主張をしているが、首相はモロッコの協力を擁護し、モロッコ軍が10時間の期間中に越境を許可したことを認めた。", "summary_en": "Spanish Prime Minister Pedro Sánchez told parliament that Spain has found no evidence Morocco planned or facilitated the mass border crossing into Ceuta in late July, despite a police report suggesting otherwise. Sánchez defended Morocco's cooperation in returning most migrants and acknowledged Moroccan forces allowed crossings during a 10-hour period, while addressing political criticism over his handling of the crisis.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/03/spain-pm-evidence-morocco-ceuta-border-breach", "state_media": false, "category": "政治", "full_text": "Spain has seen no evidence “whatsoever” that Morocco planned or facilitated a mass border breach into its north African territory of Ceuta, the Spanish prime minister, Pedro Sánchez, has told parliament.\nThe address on Thursday followed the emergence of a police report, commissioned by a judge and widely quoted in the media, claiming Moroccan border forces had actively aided about 70,000 people to cross the border in late July.\n“I can assure you that no institution – not the diplomatic service, nor the European Commission, nor any international body – has provided the Spanish government with any solid evidence that Morocco planned or carried out the incident. None whatsoever,” Sánchez told parliament.\nSpeaking the morning after about 50,000 people marched in Madrid to protest his handling of the Ceuta crisis, the socialist prime minister also denied the government had received any warning of the mass breach, saying no reports to authorities had anticipated “the scale or probability of what eventually happened”.\nSánchez has repeatedly defended Morocco during the crisis, highlighting Rabat’s cooperation in returning most of the migrants in the days after the surge.\nBut he said on Thursday that Spain had summoned Morocco’s ambassador on 21 August because of “unacceptable statements” made by two ministers over Ceuta and Melilla, another Spanish north African territory. Last month, Morocco’s justice minister, Abdellatif Ouahbi, publicly reiterated Rabat’s sovereignty claims over the cities.\nSánchez said he had “for now” ruled out Moroccan government involvement but conceded that Moroccan forces had allowed crossings to occur during a key 10-hour period on 30 July.\nMany of those who crossed said in interviews they had been actively encouraged to do so. Moroccan officials have denied enabling the crossing.\nAlberto Núñez Feijóo, the leader of the conservative People’s party, called on Sánchez to resign for his “incompetence and complicity”.\nIn response to Sánchez summoning the Moroccan ambassador to discuss the crisis, Santiago Abascal, the leader of the far-right Vox party, said: “Morocco doesn’t need an ambassador in Spain – you are its ambassador.”\nAs many as 141 people are thought to have died trying to enter Ceuta at the end of July. The influx unleashed a political crisis, a humanitarian emergency and reignited tensions within the EU over immigration.\nOn Thursday, Sánchez appealed for European solidarity over the crisis. He did not single out any countries by name but, in a pointed passage apparently aimed at Italy and Denmark, the two countries that had led public criticism of Spain, said the principle of solidarity should apply to Ceuta as much as it applies to Greenland and Lampedusa.\nAlthough 90% of the people had returned to Morocco within 24 hours, several thousand, including at least 500 minors, are thought to remain, either living on the street or in makeshift shelters.\nAmid calls from Vox to return them to Morocco, Sánchez reminded parliament that under Spanish, European and international law, migrants had a right to be treated as individuals. “You can’t just grab someone by the arm and drag them across the frontier as though they were a sack of dirt,” he told MPs.\nIn reference to the hundreds of destitute minors, Aina Vidal of the leftwing group Sumar, said: “They’re children, not invaders, not soldiers. They didn’t come carrying bombs, they arrived wearing water wings, in tears.”\nIt seems likely the government will invest in facilities in Ceuta to accommodate the remaining migrants rather than risk the political backlash both in Spain and across Europe were they to bring them to the mainland.\nThere is also evidence that, faced with hunger as well as hostility from many local people, some migrants have already begun going back to Morocco.\nHowever, as Sánchez told parliament, the per capita income of Ceuta is eight times that of Morocco and “even if we build a wall 100 metres high there will still be people prepared to throw themselves into the sea to get across”.\n“We will not stop working until Ceuta emerges from this difficult situation: stronger, more prosperous, and more integrated with the rest of Spain and the EU,” he added.\nAdditional reporting by Jakub Krupa", "translation_ja": "", "vocab": [{"word": "facilitated", "definition": "～を容易にした、助成したという意味。特に政治や外交の文脈では、ある行動や計画を積極的に支援・促進することを指す。"}, {"word": "breach", "definition": "ここでは国境や防御線の違反・侵入を意味する。一般的には約束や契約の破棄も指す。"}, {"word": "sovereignty", "definition": "主権を意味し、国家が自らの領土と人民に対して完全な権力を行使する権利。国際関係で重要な法的・政治的概念。"}, {"word": "conceded", "definition": "～を認める、譲歩するという意味。交渉や議論で相手の主張の一部を受け入れることを表す。"}, {"word": "solidarity", "definition": "連帯、一体性を意味し、共通の利益や価値観に基づいて団結する姿勢。EUなど国際機構で強調される原則。"}, {"word": "destitute", "definition": "極度に貧困した、無一文の状態を意味する。特に食糧やシェルターなど基本的な生活必需品がない状況を指す。"}]}, {"title_ja": "米国特使ウィトコフ、クシュナーがプーチン大統領とウクライナ戦争について会談", "title_en": "US envoys Witkoff and Kushner meet Putin to discuss Ukraine peace talks", "summary_ja": "米国の特使スティーブ・ウィトコフとジャレッド・クシュナーは土曜日にクレムリンでロシアのプーチン大統領と会談し、ロシア・ウクライナ紛争の終結を目指す交渉の再開を試みました。この会談は両国間の膠着した外交交渉を再開させるための努力を示しています。戦争が明確な解決の見通しのないまま継続する中での会談となりました。", "summary_en": "US envoys Steve Witkoff and Jared Kushner held talks with Russian President Vladimir Putin at the Kremlin on Saturday to attempt reviving negotiations aimed at ending the Russia-Ukraine conflict. The meeting represents efforts to restart stalled diplomatic discussions between the two powers. The talks took place as the war continues with no clear resolution in sight.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/5/us-envoys-witkoff-kushner-meet-putin-for-talks-on-ukraine-war?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US envoys Witkoff, Kushner meet Putin for talks on Ukraine war\nNewsFeed\nUS envoys Witkoff, Kushner meet Putin for talks on Ukraine war\nUS envoys Steve Witkoff and Jared Kushner met Russian President Vladimir Putin at the Kremlin on Saturday for talks to try to revive stalled negotiations to end the Russia-Ukraine conflict.\nPublished On 5 Sep 2026", "translation_ja": "", "vocab": [{"word": "envoy", "definition": "特使または外交使節を意味する。政府から派遣された公式な代表者であり、通常は外交交渉や特定の任務を担当します。"}, {"word": "stalled", "definition": "停滞または中断した状態を指す。交渉や進行中のプロセスが進展せず、停止している状況を表現します。"}, {"word": "revive", "definition": "再開する、復活させるという意味。特に中断された活動や計画を再び開始させることを指します。"}, {"word": "conflict", "definition": "紛争または対立を意味する。国家間または集団間の武力や対抗関係を表現する一般的な用語です。"}, {"word": "negotiations", "definition": "交渉または協議を指す。二者以上が合意や解決策に達するために行う公式な話し合いのプロセスです。"}]}, {"title_ja": "北インドで豪雨後に高層建築物が倒壊", "title_en": "Multi-storey Building Collapses After Heavy Rain in Northern India", "summary_ja": "北インドのムラダバードで数日間の豪雨後に高層建築物が倒壊し、電力線を引き裂いて火花を散らしました。建物は雨による亀裂が生じた後に避難されていました。この事故による死傷者は報告されていません。", "summary_en": "A multi-storey building in Muradabad, northern India, collapsed after days of heavy rain, tearing through power lines and creating sparks in the street. The building had been evacuated after cracks appeared in its structure due to the prolonged rainfall. No casualties were reported in the incident.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/5/09-05-sv-india-building-collapse-mp4?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Building collapses after heavy rain in northern India\nNewsFeed\nBuilding collapses after heavy rain in northern India\nA multi-storey building collapsed in Muradabad, northern India, tearing through power lines and sending sparks into the street. Local media say it had been evacuated after cracks appeared following days of rain. No casualties were reported.\nPublished On 5 Sep 2026", "translation_ja": "", "vocab": [{"word": "multi-storey", "definition": "複数階建ての建物を指します。建築業界で建物の階数を示す重要な用語で、通常は3階以上の建物に使われます。"}, {"word": "collapsed", "definition": "建物や構造物が突然崩れ落ちることを意味します。建築や工学用語として、構造的な失敗を示す重要な表現です。"}, {"word": "evacuated", "definition": "危険な場所から人々を急いで退出させることです。緊急事態や安全上の理由で建物から人を避難させるときに使用します。"}, {"word": "casualties", "definition": "事故や災害で死傷した人々を指します。ニュース報道で被害状況を述べる際に頻繁に使われる専門用語です。"}, {"word": "tearing through", "definition": "何かが勢いよく破り進む状態を描写します。物理的な破壊や急速な移動を強調する表現です。"}]}, {"title_ja": "アルゼンチンがフォークランド諸島領有権紛争を再燃させる理由とは？", "title_en": "Why is Argentina Reigniting the Falklands Dispute?", "summary_ja": "アルゼンチンのハビエル・ミレイ大統領は、数十年間休止していたフォークランド諸島の領土紛争を復活させ、列島北岸での英国・イスラエルの石油探査事業に関与する企業への制裁を脅迫している。ドナルド・トランプ米大統領がこの領土に対する米国の立場を再検討する可能性があるとコメントしたことで、この緊張が高まった。この紛争は、休止状態にあった紛争がアルゼンチンと英国の間で武力衝突に発展する可能性をもたらしている。", "summary_en": "Argentina's President Javier Milei has revived the decades-long territorial dispute over the Falkland Islands, threatening sanctions against companies involved in British-Israeli oil exploration near the archipelago. The escalation was fueled by Donald Trump's recent comment about potentially reconsidering the US position on the territory. The conflict raises concerns about whether the dormant dispute could lead to another armed confrontation between Argentina and the United Kingdom.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/inside-story/2026/9/5/why-is-argentina-reigniting-the-falklands-dispute?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Inside Story\nWhy is Argentina reigniting the Falklands dispute?\nPresident Javier Milei says sovereignty over the islands remains a national objective.\nIt has been dormant for decades, but the row between Argentina and the United Kingdom over the Falkland Islands has been revived.\nIt started with a joint British-Israeli oil exploration project off the archipelago’s north coast, to which Buenos Aires vehemently objected.\nPresident Javier Milei has now threatened to sanction companies operating there.\nHis push to reclaim the islands was bolstered by United States President Donald Trump’s comment that he may reconsider Washington’s position on the territory.\nBritain and Argentina went to war over the islands more than four decades ago.\nCould the dispute escalate into another armed confrontation?\nPresenter: Cyril Vanier\nGuests:\nDiego Guelar – Former Argentinian ambassador to the US, European Union and China\nChristopher Sabatini – Director of the Latin America programme at Chatham House\nJavier Farje – Journalist and historian specialising in Latin American affairs", "translation_ja": "", "vocab": [{"word": "vehemently", "definition": "強く激しく反対する様子を表す副詞。政治的立場や感情的な反発を強調する場合に使用される。"}, {"word": "dormant", "definition": "表面上は活動していない状態を示す形容詞。紛争や問題が一時的に静かになっているが、完全には解決していない状況を指す。"}, {"word": "archipelago", "definition": "複数の島々から構成される地域を指す名詞。地理用語として、島嶼地域全体を表現する際に使われる。"}, {"word": "escalate", "definition": "段階的に拡大・悪化する動詞。紛争や危機的状況が深刻化することを意味する。"}, {"word": "confrontation", "definition": "対立や直接的な衝突を指す名詞。国家間、個人間での激しい対峙や武力衝突を表す。"}, {"word": "bolstered", "definition": "支援や強化を意味する動詞の過去形。何かの立場や主張が外部的な要因によって強められた状態を示す。"}]}, {"title_ja": "プーチン大統領、米国特使との和平交渉でキーウ空爆72時間停止を命令", "title_en": "Putin Orders 72-Hour Kyiv Strike Pause as U.S. Envoys Hold Peace Talks", "summary_ja": "ロシアのプーチン大統領は、ウクライナ戦争終結に向けて米国特使ジャレッド・クシュナーとスティーブ・ウィットコフと3時間の会談を行い、真夜中からキーウへの空爆72時間停止を命令した。特使は9月6日にキーウ訪問を予定しており、4年間の紛争後、トランプ政権による停滞している和平努力の再開が進められている。", "summary_en": "Russian President Vladimir Putin met with U.S. envoys Jared Kushner and Steve Witkoff for three hours of talks on ending the Ukraine war, and ordered a 72-hour pause in strikes on Kyiv starting at midnight. The envoys plan to visit Kyiv on September 6, 2026, as part of the Trump administration's renewed push to revive stalled peace efforts after four years of conflict.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/russian-president-vladimir-putin-orders-72-hour-pause-in-strikes-on-kyiv/article71432032.ece", "state_media": false, "category": "政治", "full_text": "Russian leader Vladimir Putin held around three hours of late-night talks in the Kremlin with U.S. envoys Jared Kushner and Steve Witkoff on ending over four years of war with Ukraine on Saturday (September 5, 2026), ahead of their first visit to Kyiv on Sunday (September 6, 2026).\nU.S. President Donald Trump has said his son-in-law Kushner and business ally Mr. Witkoff were bringing a “proposal” on ending fighting.\nTalks ended after just over three hours, past 11.00 p.m. in Moscow.\n72-hour pause in strikes on Kyiv\nMr. Putin ordered a 72-hour pause in strikes on Kyiv, the Kremlin said Saturday (September 5, 2026), as Mr. Witkoff and Mr. Kushner arrived in Moscow to try to revive a stalled push to end Russia’s full-scale invasion of Ukraine.\n“Putin has ordered that no strikes be carried out against Kyiv for three days, starting at midnight today,” presidential spokesperson Dmitry Peskov told Russia’s Tass news agency. He said the decision was tied to preparations for Mr. Witkoff and Mr. Kushner’s planned visit to the Ukrainian capital, which Kyiv has said will take place on Sunday (September 6, 2026).\nThe envoys’ trip comes as both sides escalate aerial attacks, some 4.5-years after the Kremlin invaded its neighbour. Ukrainian President Volodymyr Zelenskyy said Friday (September 4, 2026) that Ukraine would halt airstrikes during the envoys’ visit and urged Moscow to do the same.\nWashington’s push to end the fighting, now in its fifth year, has lost momentum as U.S. attention has been focused for the last six months on its war with Iran. The last known visit to Moscow by Mr. Witkoff and Mr. Kushner, U.S. President Donald Trump’s son-in-law, was in January, when they met Russian President Vladimir Putin in the Kremlin. They had never previously visited Kyiv.\nThe envoys were met at the airport by Russian envoy Kirill Dmitriev, Tass reported. Mr. Dmitriev shared photos of him meeting the U.S. delegation as they disembarked, alongside the caption, “Welcome to Moscow Peacemakers.” With peace efforts stalled, Russia has intensified its attacks on Kyiv and other cities with relentless bombardments recently stretching into daylight hours, taking advantage of Ukraine’s shortage of air defence systems.\nOn Friday (September 4, 2026), a Russian drone hit one of the most important government buildings in Kyiv -- the headquarters of Ukraine’s Security Service, known as the SBU, which is one of the agencies involved in carrying out deep-strike operations inside Russia.\nThe long-range strikes by Ukraine have hit Russian military facilities, oil refineries and e-commerce hubs, seeking to undermine the Kremlin’s war effort and economy, as well as make ordinary citizens feel the consequences of the war.\nZelenskyy links Russian strikes to envoys’ visit\nThe air war between Russia and Ukraine has intensified as troops have struggled to make progress along the 1,250-kilometre front line. Russia has recently been using fast-flying, jet-powered drones, and the recurring wail of air-raid sirens has become part of daily life in Kyiv.\nDo not gamble: On the Russia-Ukraine conflict\nIn a social media post on Saturday (September 5, 2026), Mr. Zelenskyy said that Russia had carried out overnight strikes on Kyiv and Boryspil international airports, and linked the attack to the planned U.S. visit.\n“Clearly, these Russian strikes on the airports are a reaction to the discussions and preparations for the possibility of the U.S. side using an aircraft to travel to Ukraine,” he said.\n“We have taken note of this Russian move, and next week we will adjust our operation accordingly regarding Russian airspace, which has become dangerous because of our drones and missiles in the sky. Of course, there are and will be no threats to diplomacy from our side.”\nStrikes kill 5 at Ukrainian industrial site\nRussian attacks killed five people and wounded five more at an industrial facility in Ukraine’s southern Dnipropetrovsk region, local military administration head Oleksandr Hanzha said. He described those killed as employees at the site. “A locksmith, an electrician, a plumber and a machinist. People of peaceful professions. They were simply working their shift. They were doing their job when enemy missiles cut off their lives,” he said.\nA 62-year-old man was wounded and several homes and an apartment building were damaged in a separate attack on the region’s Nikopol district, Hanzha said.\nIn a statement on Saturday (September 5, 2026), Russia’s Ministry of Defence said it had carried out strikes on two metallurgical plants in the region, describing them as “major suppliers of metal products for Ukraine’s military production.” A further two people were wounded in an overnight Russian attack on Ukraine’s Kyiv region, said Tymur Tkachenko, head of the regional military administration. In the Boryspil district, a fire sparked by a strike partially destroyed a nine-story residential building.\nRussian forces also repeatedly struck a shopping centre in the souther", "translation_ja": "", "vocab": [{"word": "envoy", "definition": "特定の任務を帯びて派遣された外交官や代理人。通常、国家間の交渉や連絡を担当します。"}, {"word": "stalled", "definition": "進展が止まった、または動きが止まった状態。ここでは和平交渉が進まなくなった状況を指します。"}, {"word": "intensified", "definition": "程度や強度が増した、または激化した。ここではロシアの軍事攻撃が増加したことを意味します。"}, {"word": "relentless", "definition": "容赦がない、または止まらない。継続的で厳しい状況や行動を表します。"}, {"word": "bombardment", "definition": "砲撃や空爆による激しい攻撃。大量の爆弾や砲撃による継続的な攻撃を指します。"}, {"word": "escalate", "definition": "段階的に増加または悪化させること。ここでは紛争の激化や攻撃の強化を意味します。"}]}, {"title_ja": "BRICSはなぜ国境を越えた決済システムの改革を探索しているのか？|解説", "title_en": "Why is BRICS exploring cross-border payments? |Explained", "summary_ja": "BRICS加盟国は、国家間の決済システムを直接つなぎ、中央銀行デジタル通貨を活用することで、国際送金コストを削減しドル依存を減らすことを目指しています。現在の国境を越えた決済は複数の仲介機関を経由し、通貨換算手数料が発生し、ベルギーを拠点とするSWIFTがシステムを支配しています。提案されている改革は取引コストを低下させ、支配的な通貨発行国の金融政策への依存を軽減することを目的としています。", "summary_en": "BRICS countries are seeking to reform international payment systems by creating direct links between national payment systems and central bank digital currencies to reduce costs and dependency on dollar-based transactions. Current cross-border payments involve multiple intermediaries, currency conversions, and high fees, with the process controlled largely by SWIFT, a Belgium-based institution. The proposed changes aim to lower transaction costs and reduce exposure to monetary policies of dominant currency-issuing nations.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/why-is-brics-exploring-cross-border-payments-explained/article71433307.ece", "state_media": false, "category": "経済", "full_text": "The story so far:\nThe 18th BRICS summit in New Delhi to be held in September, with India as the Chair, is expected to push for mechanisms to facilitate cross-border payments between members, including links between digital payment systems and central bank digital currencies (CBDCs), according to a report in The Hindu businessLine. Ahead of the summit, finance ministries’ and central bank representatives from BRICS countries met in Jaipur on August 12-13 to discuss financial cooperation, payments, and the wider use of national currencies in settling trade between members.\nHow do current cross-border payments work?\nSending money from one country to another requires a chain of transactions. Let’s say, an importer in Cape Town is buying passenger cars from an exporter in Chennai. The payment does not travel directly from the South African bank to the Indian one. It travels via a series of intermediaries called correspondent banks that hold accounts with each other. Since the South African bank does not hold an account with the Indian one (and vice versa), the payment is routed through a larger international bank that deals with both and is typically headquartered in London or New York. Because very few banks hold both rupees and rand, the payment involves converting rand to dollars and dollars to rupees where, in essence, the dollar acts like a vehicle currency, even though no American is involved in the trade.\nWhat is SWIFT?\nNow, apart from the money, there are also instructions that travel between the banks. This is handled by SWIFT (Society for Worldwide Interbank Financial Telecommunication), which is a Belgium-based cooperative and overseen by the National Bank of Belgium along with the G-10 central banks, including the U.S. Federal Reserve. SWIFT is a messaging network, like a secure post-office. It enables institutions to exchange payment instructions through it and settle amounts separately. It is used directly by more than 11,000 institutions in over 200 countries. Smaller banks reach it indirectly through larger banks that are part of the SWIFT network, which is why it has become crucial and hard to displace.\nWhat are the costs involved in each step?\nEvery intermediary charges a fee and the currencies are converted twice (rand to dollar and dollar to rupees). So the foreign exchange margins are paid twice. A 2019 BRICS survey of cross-border payment systems, conducted by Brazil, found that Brazilian respondents reported foreign exchange margins of 2.5% with the figure rising to 8.5% for payments in Africa and, in some cases, as high as 20%.\nWhile speed of transactions used to be a major issue, SWIFT claims that its SWIFT Global Payments Innovation has helped reduce transaction times significantly. Some structural delays remain even as the transaction chain has also become thinner. The Bank for International Settlements (BIS) found that active correspondent banking relationships fell by 20% between 2011 and 2018 with regional declines varying from 12% to 30% and Latin America being the worst affected. The reasons for this decline were largely commercial. Payment volumes kept growing during this period, even as they travelled through a smaller network.\nWhy does BRICS want to change this system?\nFor developing economies, though, payments in a handful of dominant currencies such as the U.S. dollar, the euro and the Japanese yen expose countries to the monetary policies of the countries that issue them. The 2024 BRICS report under Russia’s chairmanship argued that this part of the financial system is monopolised by a single institution, raising transaction costs. Alternatives to the system suffer from the fact that they have to convince a large number of banks and regulators to join before being useful. A bank that uses an alternative system to deal with sanctioned entities — several Russian banks were cut off from SWIFT in 2022, following Russia’s invasion of Ukraine — also risks sanctions, which deters others from joining. A sanctions-hit Russia has pushed hardest for an alternative and is also the reason why others are wary of joining one.\nWhat changes can be envisaged in the BRICS discussions?\nThe idea being explored is a payment system where, instead of payments moving through several correspondent banks with dollar conversions, national payment systems would connect to each other directly. This could be done in pairs as India and Singapore have already done for remittances by linking the former’s Unified Payments Interface (UPI) and the latter’s PayNow systems. But building bilateral systems individually will not scale appropriately.\nAn alternative could be via a shared hub that each country joins. One such effort is Project Nexus, designed by the BIS and handed over to a company set up by six central banks, including India’s Reserve Bank of India. It is set to go live only in 2027. Notably, it is not a BRICS initiative.\nThe BRICS discussions would extend this idea to the use of central bank digital ", "translation_ja": "", "vocab": [{"word": "correspondent banks", "definition": "国際送金を仲介する銀行。直接の取引関係がない銀行同士が資金を移動させる際に、両国の銀行と口座を持つ大規模な銀行が仲介役となります。"}, {"word": "SWIFT", "definiti
