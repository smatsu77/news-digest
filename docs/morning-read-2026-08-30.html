History, Looking to the Future", "summary_ja": "ブラジルの主要新聞であるグロボ紙は、その豊かな過去を振り返りながら、将来の成長とイノベーションに向けて自らを位置づけている。同紙は質の高いジャーナリズムへのコミットメントとブラジルメディア史における自らの役割を強調している。", "summary_en": "O Globo, a prominent Brazilian newspaper, reflects on its storied past while positioning itself for future growth and innovation. The publication emphasizes its commitment to quality journalism and its role in Brazilian media history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ルーラ大統領と習近平主席、ブラジリアで37件の協定に調印、ブラジルは一帯一路に参加せず", "title_en": "Lula and Xi Jinping Sign 37 Deals in Brasília, Brazil Declines Belt and Road", "summary_ja": "ブラジルのルーラ大統領と中国の習近平主席がブラジリアでの訪問中に37件の二国間協定に調印し、両国間の経済的結びつきを強化した。しかし、外交協力の拡大にもかかわらず、ブラジルは中国の一帯一路構想への参加を注目すべき形で見送った。", "summary_en": "Brazilian President Lula and Chinese leader Xi Jinping signed 37 bilateral agreements during Xi's visit to Brasília, strengthening economic ties between the two nations. However, Brazil notably declined to join China's Belt and Road Initiative despite the expansion of diplomatic cooperation.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMizwFBVV95cUxPOWw3MVRSY3hFbEgyT1A1OFNaNXA4d05OVlV3ZGtPVUx5VDB1N2VMeXB1S0U0Q1BzdlppNTN0ZF9oR0ZqSmhnMlp2ellMVFpyS3ZISnlfNlNQNzg2Z1BnQzBUUUNVdDdUdVRwTzgxbGtFcVg5Yzg4S2pjNDFBUU91YU5jQTR6MkFfVkdWbE04Mno2VTAtT0FWLVNVQmZuNVpzWTI4WWV5eDVQRDM4MENndF9KM0NUbWlINlc0eDVHdXM3Q09HTExRTGZiblZGVk3SAd4BQVVfeXFMTVhOaS00d3dBNFlTZkRiOFVPWURfTWloN2NBWDk1LUNiVXNfRmRjbkFJaXBRc3BXWVBFdVk1OUJoSk95N2pNSWZYYzI3dnhpa093ZkxNWGVEN2ltTkNYc1FKSUZCTl9xYU5yVVVJV2tjS0lVbWxWdEpQWTUwYkJsMXBaT0xBX0pWRVdzaEdQcndtQVFMeXNnRFgwY24xdktQTzNYR1I4S3VRYUtGNzZPNjdxUlNPSUstQUZrcUdPZGhqcHhuN25VcjgyZEd3NVU2MEtkTlhDRTJPd3M2VHFn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "洪水で数千人が行方不明 ネパールが集団埋葬に", "title_en": "Nepal Turns to Mass Burials as Thousands Remain Missing from Floods", "summary_ja": "ネパールは2,500人以上が行方不明となった大規模な洪水で集団埋葬を実施している。行方不明者のごく一部しか遺体で発見されていないため、当局は今後数日間で死者数が増え続けると予想している。この災害の規模は地域のリソースとインフラに圧倒的な負担をもたらしている。", "summary_en": "Nepal is conducting mass burials as the country grapples with devastating floods that have left over 2,500 people missing. With only a fraction of the missing being found among the dead, authorities expect the death toll to continue rising in the coming days. The scale of the disaster has overwhelmed local resources and infrastructure.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/30/world/asia/nepal-floods-mass-burials-missing.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "チベット洪水で23カ国から261人の外国人が行方不明と中国が報告", "title_en": "China Reports 261 Foreigners From 23 Countries Missing in Tibet Flood", "summary_ja": "中国当局は、チベットでの壊滅的な洪水により23カ国から261人の外国人が行方不明だと発表した。この発表は、当局がこれまで事件に関する詳細を隠してきた中国側での災害の規模についてまれな洞察を提供している。", "summary_en": "Chinese authorities disclosed that 261 foreign nationals from 23 countries are missing following a devastating flood in Tibet. The announcement provides rare insight into the disaster's scale on the Chinese side of the border, as officials have previously withheld substantial details about the incident.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/30/world/asia/tibet-nepal-flood-death-toll-china.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "弘前市民4000人が古城を手作業で移動、日本の伝統文化「曳家」を実践", "title_en": "Japanese Town Moves Historic Castle Using Ancient Hand-Pulling Tradition", "summary_ja": "日本の古い伝統である曳家の技法を用いて、弘前城を移動させるプロジェクトに約4000人の市民が参加しました。縄とローラーを使用した手作業によるこの方法は、数世紀前から受け継がれている文化的実践です。このイベントは、地域社会が歴史的建造物と伝統技術の両方を保存することへの献身を示しています。", "summary_en": "In a remarkable display of Japan's ancient hikiya tradition, approximately 4,000 residents of Hirosaki gathered to move Hirosaki Castle using ropes and rollers. This labor-intensive method, which dates back centuries, represents a unique cultural practice of relocating buildings without modern machinery. The event showcases the community's commitment to preserving both their historical landmark and traditional techniques.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/30/world/asia/japan-hirosaki-castle-moving.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事地帯の通過を許可、パレスチナ人がガザ北部に帰還", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "イスラエルは人質解放交渉の膠着状態が解除された後、ガザを二分する軍事地帯の通過をパレスチナ人に許可した。数千人の住民が数ヶ月の避難生活を経て、徒歩で北部地域への帰還を開始している。この動きは飛び地内の移動制限における重大な転換を示している。", "summary_en": "Israel has permitted displaced Palestinians to cross a military zone dividing Gaza following a breakthrough in hostage release negotiations. Thousands of residents are returning on foot to the northern region after months of displacement. The move marks a significant shift in movement restrictions within the enclave.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発業者が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Widening Real Estate Crisis", "summary_ja": "中国最大級の不動産開発業者であるヴァンケが巨額の損失を報告し、国内の不動産危機が深刻化していることへの懸念が高まっている。同社の経営難は、中国政府が苦境にある業界を安定させるために介入するかどうかについての疑問を浮き彫りにしている。", "summary_en": "Vanke, one of China's largest property developers, has reported a significant loss, raising concerns about the deepening real estate crisis in the country. The troubles at the company highlight questions about whether the Chinese government will intervene to stabilize the struggling sector.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片が体内に残る", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From October 7 Attack", "summary_ja": "解放されたイスラエル人人質は、10月7日の攻撃による破片が体内に埋め込まれた状態で重篤な状態にあるという。一部の女性は長期間隔離された状態で拘束され、8か月間トンネルに閉じ込められていたとイスラエルの医療関係者が述べた。人質らは初期攻撃で受けた負傷に対する継続的な医学的治療に直面している。", "summary_en": "Released Israeli hostages remained in critical condition with shrapnel embedded in their bodies from the October 7 attack. Some women were held in isolation for extended periods and spent eight months confined in tunnels, according to Israeli medical officials. The hostages face ongoing medical treatment for their injuries sustained during the initial attack.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIが宗教を変え、宗教がAIを変えようとしている", "title_en": "AI is Changing Religion and Religions are Trying to Change AI", "summary_ja": "チャットボットなどの人工知能ツールが宗教実践に影響を与え始めており、これらのツールが宗教指導者に取って代わるのか、それとも彼らの活動を拡大するのかという問題が生じています。宗教共同体はこれらのテクノロジーが自らの価値観と教えに合致するよう確保するため、AI開発に積極的に関与しています。テクノロジーと信仰の交差点は、宗教的指導の普及の機会と従来の聖職者の役割が失われることへの懸念の両方をもたらしています。", "summary_en": "Artificial intelligence tools like chatbots are beginning to influence religious practices, raising questions about whether they will replace spiritual advisors or enhance their reach. Religious communities are actively engaging with AI development to ensure these technologies align with their values and teachings. The intersection of technology and faith presents both opportunities for spreading religious guidance and concerns about displacing traditional clergy roles.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/27/ai-is-changing-religion-and-religions-are-trying-to-change-ai", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領の政権が揺らぐ中、彼はより危険な存在となっている", "title_en": "As Trump's presidency flounders, he becomes increasingly dangerous", "summary_ja": "典型的なレームダック大統領とは異なり、ドナルド・トランプは自らの支配権を守る老いたゴリラのように行動している。政権が弱体化する中で、彼の行動はより不安定で予測不可能になっている。", "summary_en": "Rather than a typical lame duck president, Donald Trump is acting like an aging silverback gorilla defending his dominance. As his presidency weakens, he is becoming more volatile and unpredictable in his actions.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/25/as-his-presidency-flounders-trump-is-more-dangerous-than-ever", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "迎撃ミサイル不足の危機", "title_en": "The Interceptor Missile Shortage Crisis", "summary_ja": "ウクライナおよび同盟国は、防空需要の急増に伴い迎撃ミサイルの深刻な不足に直面している。この品不足は、空中攻撃からの防御能力と進行中の紛争における軍事態勢の維持についての懸念を広げている。", "summary_en": "Ukraine and allied nations face a critical shortage of interceptor missiles as air defense demands surge. The scarcity is causing widespread concern about the ability to defend against aerial attacks and maintain military readiness in ongoing conflicts.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パリ・オペラ座の天井画論争：60年以上経った今も決着つかず", "title_en": "Paris Opera Ceiling Feud: Chagall's 1960 Modernization Still Contested", "summary_ja": "1960年、フランス文化相アンドレ・マルローはマルク・シャガールに、オペラ・ガルニエの天井画を近代化するよう委託し、19世紀の巨匠ジュール＝ウジェーヌ・ルネップヴーの作品を隠した。この物議を醸す決定は文化遺産についての二つのビジョンの衝突を反映していた。今、ルネップヴーの子孫の一人が祖先の作品の復元に執念を燃やしている。", "summary_en": "In 1960, French Culture Minister André Malraux commissioned Marc Chagall to paint over the 19th-century ceiling of the Opéra Garnier, covering Jules-Eugène Lenepveu's original work. This decision sparked a debate between two visions of cultural heritage that persists today. One of Lenepveu's descendants is now fighting to restore the ancestor's creation.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/m-le-mag/article/2026/08/30/more-than-60-years-after-it-was-redone-the-feud-over-the-paris-opera-s-ceiling-isn-t-over_6756992_117.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "NASAの新型宇宙望遠鏡ローマン、ダークエネルギーと系外惑星の探査に出発", "title_en": "NASA's Roman Space Telescope Launches to Search for Dark Energy and Exoplanets", "summary_ja": "NASAの新型宇宙望遠鏡「ローマン」が日曜日、フロリダ州ケープカナベラルからSpaceXロケットで打ち上げられました。同望遠鏡は2021年のジェームス・ウェッブ宇宙望遠鏡以来、米国宇宙局による最も野心的な科学ミッションです。ローマンはダークエネルギーの探査と系外惑星の発見を目的としています。", "summary_en": "NASA's Roman space telescope successfully launched Sunday aboard a SpaceX rocket from Cape Canaveral, Florida. The telescope represents the agency's most ambitious scientific mission since the James Webb Space Telescope launched in 2021. Roman is designed to search for dark energy and discover exoplanets.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/science/article/2026/08/30/roman-nasa-s-new-space-telescope-sets-out-to-search-for-dark-energy-and-exoplanets_6756983_10.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アイスランド、EU加盟交渉再開の提案を否決", "title_en": "Iceland Rejects EU Membership Talks in Referendum", "summary_ja": "アイスランドの有権者は土曜日の国民投票でEU加盟交渉の再開提案を否決した。投票は国家主権と独立性に関する懸念が中心となった。この結果は北欧地域のEU拡大努力に対する別の挫折を意味している。", "summary_en": "Icelandic voters rejected a bid to resume European Union membership negotiations in a Saturday referendum. The vote was dominated by concerns about national sovereignty and independence. The result marks another setback for EU expansion efforts in the Nordic region.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/30/iceland-rejects-bid-to-resume-eu-membership-talks_6756985_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省ニュース", "title_en": "Mindef Update", "summary_ja": "これはシンガポール海峡時報から国防省（Mindef）に関するニュースレター更新です。読者は購読設定を管理し、出版物から追加の無料ニュースレターに登録できます。", "summary_en": "This is a newsletter update from The Straits Times related to Ministry of Defence (Mindef) matters. Readers can manage their subscription preferences and sign up for additional free newsletters from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニングアップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズのイブニングアップデートニュースレターは、購読者に毎日のニュースブリーフィングを提供しています。読者はザ・ストレーツ・タイムズのウェブサイトを通じて、購読を管理し、追加のニュースレターにサインアップできます。", "summary_en": "The Straits Times Evening Update newsletter provides daily news briefings to subscribers. Readers can manage their subscriptions and sign up for additional newsletters through The Straits Times website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズは、読者に主要なニュースと最新情報を知らせるための日々のモーニング・ブリーフィングを配信しています。無料ニュースレターの購読登録とサブスクリプション設定は同プラットフォームで管理できます。", "summary_en": "The Straits Times delivers its daily morning briefing to keep readers informed on key news and updates. Subscribe to receive free newsletters and manage your subscription preferences through their platform.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル入植者に拉致された英国活動家、イスラエルが国外退去処分へ", "title_en": "Israel to deport U.K. activist detained after settlers abducted him", "summary_ja": "イスラエルは、入植者による拉致後に拘束された英国の活動家を国外退去させる計画である。活動家の弁護士によると、イスラエル入植者による事件の後に国外退去命令が出されたという。この事件は、紛争地域における拘束手続きと活動家の権利について懸念を生じさせている。", "summary_en": "Israel plans to deport a British activist who was detained following an abduction by settlers. According to the activist's lawyer, the deportation order comes after the incident involving Israeli settlers. The case raises concerns about detention procedures and activist rights in the disputed territories.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijwJBVV95cUxQeFIxWjBzU1lBTFAtc1hTekZ6NFh3UlNESjMzcElqYW9VZWFCaWZoQ1FfOEUycnpuS2RTY0ZSSXlMLXFYZGRVbUFYRm5kMTRGYmdaZy0zazNBekd4MlBpTjNqQXNWczA1QzR6R3R2MlVzRHJhZTg2ejJtVXQ2eklYQTJXUl8tU1VQaGRBdGZaZWU4Z1dpN25WWmUtUldjZWJTREZSemNfd0hUQngtSkk4X1VZME5OUzhFSVN3dlhvc3hCZWliNWRIeWFpWlFSSWU2ckNfYndKS0dTcFhFN0YwWTctWnBjR2pMYnE3TkZ1WXJJamlUdS1QckdIbGlmU3VyRk1FdjJzUVpSSEdhUjFB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの刑務所における十代の少年の医療放置問題", "title_en": "Teen's Medical Neglect in Israeli Prison Raises Serious Concerns", "summary_ja": "ハアレツの調査により、イスラエルの刑務所施設に拘留された十代の少年が受けた深刻な医療放置が明らかになった。医療専門家らは拘留者への不十分な医療提供に懸念を表明している。本件はイスラエルの刑務所医療基準の制度的な問題を浮き彫りにしている。", "summary_en": "A Haaretz investigation reveals severe medical neglect experienced by a teenager held in an Israeli prison facility. Medical professionals quoted in the report express alarm at the lack of adequate healthcare provided to the detained youth. The case highlights systemic issues in prison medical care standards.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiowJBVV95cUxOV05STFl1TTU0Szd4Q1RsX05hWVF6WHFOTzVGUE5vd3UzYjNBZmlWaHg4bkcxTVlfYngwWi1YUG5EMGJpaFNWWDY1RC03U3Q2TXFBX0ZLbWlHb3FvTVNjVTlzZ1lRQldSVHVrWWd5aW54U2RNREYxQkxmN0RjS0w3NVpVSFlza2FtTkhQYUNBbWJjbm1MSllMdkJCa1VCcmdoUUozdFliNkdLMGp3RlU3eGRFR1F0bXdoU3ZBRTJIZk5ocWUtMkdzMU5PdnFEUWhuaFFHWlJHZHkxckRnU0c3ck1MQndONS1PMjk2NEJ2Sjg5MVRTTlUtdlJ5bzFvTURGNzQ0ejhaRmxWaUU3cWtvTFIxeW5SNUlDQlNMODBUTHk1QnM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "数十人の入植者がパレスチナ人を負傷させ、ヨルダン川西岸で外国人ジャーナリストを攻撃", "title_en": "Dozens of Settlers Wound Palestinians, Attack Foreign Journalists in West Bank", "summary_ja": "イスラエルの数十人の入植者がヨルダン川西岸でパレスチナ人と外国人ジャーナリストを攻撃し、パレスチナ人が負傷した。この事件は占領地におけるユダヤ人入植者とパレスチナ人間の緊張の高まりを浮き彫りにしており、暴力の際に国際メディア関係者も標的にされた。", "summary_en": "Dozens of Israeli settlers attacked Palestinians and foreign journalists in the West Bank, resulting in injuries to Palestinians. The incident highlights escalating tensions between settlers and Palestinians in the occupied territory, with international media personnel also targeted during the violence.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihwJBVV95cUxOWVE0X2JTdnhRTlpQVE8tMTBNbTM2NW5uM2lqdlVvTW9GcFc1Nmo5M1dGZGROMUs3VUUtNlQ2eG9ZMEVJYW5SUG5reWZOR3pCMzJsSDh4cmRFa2FEMzBON1VYb0hueTlMTmFqSUJOZG5YeUY4cUZObkZRSUw3WmRuSlZDS094M1ZMWVFIZXVrYWtjOVNObjdTZGdyQW9IejJwdmZnSm5xdms3QjA1WF90QjFKajlIRTBVRWQ3NE9CdldEeGd2c1d5NUJPdDhoMzItMV9ZQ1J3b2V6R1VXc2RMdXlHdDE1amtWRWI3NnBzQVpGX3F6bWlyNGFSaGZ0ZkVfUFdUZnc3aw?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "新しいドローン法がタイワン軍事調達を遅延させる可能性", "title_en": "New Drone Act Could Slow Taiwan Military Procurement", "summary_ja": "防衛アナリストによると、台湾の新しいドローン法は軍事調達プロセスに遅延をもたらす可能性がある。安全保障基準を確保することを目的とした規制枠組みだが、無人機システムの取得スケジュールを複雑にする可能性がある。専門家は、地域の安全保障上の懸念の中で、これが台湾の防衛近代化努力に影響を与える可能性があると警告している。", "summary_en": "Taiwan's new drone legislation may create delays in military procurement processes, according to defense analysts. The regulatory framework, while intended to ensure safety and security standards, could complicate the acquisition timeline for unmanned systems. Experts warn this could impact Taiwan's defense modernization efforts amid regional security concerns.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1HaTRLQ1BJYXlZOWVENXA1UE1BOFEzRk9EWVZ4ckY3YnBvYlM2alh3eWNOTldEUXR3eVQtbWpMS1BXb0xwc3lVa1lWLXpXSHBpbGNNY01tdw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾中選会が原子力政策国民投票を承認、体罰と交通罰金案は却下", "title_en": "CEC Approves Nuclear Policy Referendum, Rejects Caning and Traffic Fine Proposals", "summary_ja": "台湾の中央選挙委員会は原子力政策に関する国民投票を承認する一方、体罰法案と交通罰金引き上げ案を却下しました。この決定は、同国における原子力エネルギーと刑事司法改革をめぐる継続的な議論を反映しています。", "summary_en": "Taiwan's Central Election Commission has approved a referendum on nuclear policy while rejecting proposals for corporal punishment legislation and traffic fine increases. The decision reflects ongoing debates about nuclear energy and criminal justice reform in the country.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE45MlRLMG5peU5KYXhXZFI1anJXd2NvVHREa0VNNC1oSHY0UUVBb0w1UGN0VUlKQTA1OWp5MmtCcm5RbEhLQUxReG9Cei1KVUJ6RDVSdTRLYw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の交通事故死亡者数、2023年上半期比で15%減少", "title_en": "Taiwan Traffic Fatalities Down 15% in First Half of 2026", "summary_ja": "台湾は2026年上半期の交通事故死亡者数を2023年同期比で15%削減することに成功しました。この改善は、全国で実施された道路安全対策と国民啓発キャンペーンの強化を反映しています。データは、台湾の交通関連死亡者数削減に向けた継続的な取り組みの進展を示唆しています。", "summary_en": "Taiwan has achieved a significant reduction in traffic fatalities, with a 15% decrease compared to the same period in 2023. This improvement reflects enhanced road safety measures and public awareness campaigns implemented across the nation. The data suggests positive progress in Taiwan's ongoing efforts to reduce traffic-related deaths.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1JdlNtb2xVZlMtQ3dqRHdsZ0JDYkgxdURTdmktSm5zZW5DWUptN1VkSGY0NWRPZVN2Tks5WlVEVndIalpPQlRGQWduVkRpb3N0aEVKamd3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「習近平が引用する古典」がSCO諸国で放映開始", "title_en": "'Classics Quoted by Xi Jinping' TV Program to Air Across SCO Countries", "summary_ja": "CGTNが報じたところによると、中国メディアグループが制作した多言語テレビ番組「習近平が引用する古典」は日曜日からシャンハイ協力機構（SCO）加盟国のメインストリーム・メディア放送局で放映開始される。同番組は中国の指導部による古典の引用を特徴とするコンテンツをSCO地域の視聴者に届けることを目指している。", "summary_en": "CGTN reports that a multilingual television program titled 'Classics Quoted by Xi Jinping,' produced by China Media Group, will begin broadcasting on mainstream media outlets across Shanghai Cooperation Organization member countries starting Sunday. The program aims to reach audiences throughout the SCO region with content featuring classical references cited by Chinese leadership.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-29/-Classics-Quoted-by-Xi-Jinping-to-air-across-SCO-countries-1Q0kxXnGcwg/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "キューバ、医療用医薬品へのアクセス制限をめぐり米国を非難", "title_en": "Cuba Denounces US Restrictions on Medical Access", "summary_ja": "CGTNは、キューバが医療用医薬品、医療用品、および同国の生物医薬品産業に必要な原材料へのアクセスを制限する米国の措置を非難したと報じている。キューバ政府はこれらの制限をヘルスケアと医薬品開発への障害と位置付けた。CGTNは、キューバがこれらの措置を島国に影響を与える広範な米国経済政策の一部と見なしていると報じている。", "summary_en": "CGTN reports that Cuba has denounced US measures restricting its access to medicines, medical supplies, and raw materials needed by the country's biopharmaceutical industry. The Cuban government characterized these restrictions as obstacles to healthcare and pharmaceutical development. CGTN reports that Cuba views these measures as part of broader US economic policies affecting the island nation.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-28/Cuba-slams-US-restrictions-on-access-to-medicines-medical-supplies-1PY8MqD3s76/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カナダ、報復関税から米国シーフードを除外", "title_en": "Canada Excludes US Seafood From Retaliatory Tariffs", "summary_ja": "CGTNが報じたところによると、カナダは報復関税措置から米国の水産物を除外した。この決定はカナダの米国関税への対抗措置において注目すべき例外である。この動きは、両国間のエスカレートする貿易紛争における交渉の余地または抑制の可能性を示唆している。", "summary_en": "CGTN reports that Canada has excluded US seafood products from its retaliatory tariff measures. The decision marks a notable exception in Canada's trade response to US tariffs. The move suggests a potential area of negotiation or restraint in the escalating trade tensions between the two countries.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-27/Canada-excludes-US-seafood-from-retaliatory-tariffs-1PX1O7SSQ1y/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランのファルス通信社がヨルダンでの爆発を報道", "title_en": "Iran's Fars News Agency Reports Explosions in Jordan", "summary_ja": "イランの国営通信社ファルス通信がTASS/RTを通じてヨルダンで爆発が発生したと報じています。現時点では、爆発の場所、原因、死傷者に関する詳細情報は不明です。状況の推移に伴い、さらなる情報が期待されています。", "summary_en": "Iran's state-controlled Fars news agency reports that explosions have occurred in Jordan, according to TASS/RT. No additional details about the location, cause, or casualties are currently available. Further information is expected as the situation develops.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2179629", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "湾岸諸国の航空交通に制限なし、航空管制官が報告", "title_en": "No air traffic restrictions in Gulf countries, controllers report", "summary_ja": "TASSは、航空管制官がペルシャ湾岸諸国における航空交通に制限が課されていないと述べたと報じています。この声明は、イランがホルムズ海峡でUS艦船に対してミサイル攻撃を実施したという同日の報告に続くものです。", "summary_en": "TASS reports that air traffic controllers stated no restrictions have been imposed on air traffic in Gulf countries. This statement comes after reports earlier in the day that Iran conducted a missile attack on US ships in the Strait of Hormuz.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2179627", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア、北極圏でのNATO軍事活動は壊滅的な結果をもたらす可能性があると警告", "title_en": "NATO Arctic military activities risk catastrophic consequences, Russia warns", "summary_ja": "ロシアのラヴロフ外相は、NATOの「北極圏哨戒作戦」がロシアの北部国境付近での集約的な軍事準備を含んでいるとTASSは報じています。ラヴロフはこれらの活動が壊滅的な結果をもたらす可能性があると警告したとロシア側は主張しています。この声明は、北極圏でのNATO軍事プレゼンスの増加に対するモスクワの懸念を反映しています。", "summary_en": "Russian Foreign Minister Lavrov reports that NATO's Operation Arctic Sentry involves intensive military preparations near Russia's northern borders. TASS reports Lavrov warned these activities may lead to catastrophic consequences. The statement reflects Moscow's concerns about increased NATO military presence in the Arctic region.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2179615", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英国がG20とG7の議長国として主導するグローバル経済改革の機会", "title_en": "Britain's Opportunity to Lead Global Economic Reform Through G20 and G7", "summary_ja": "ダニー・スリスカンダラジャは、英国のバーナム首相が防守的な外交政策を放棄し、2027年のG20議長国および2028年のG7議長国の立場を活かして、債務救済や富豪への課税など具体的な経済改革を推し進めるべきだと主張している。時代遅れの国際機関を防衛するのではなく、課税や気候資金、富の再分配に関する革新的なアプローチを試みている「有志連合」を支持すべきだとしている。", "summary_en": "Danny Sriskandarajah argues that UK Prime Minister Andy Burnham should abandon defensive foreign policy and use Britain's upcoming G20 and G7 presidencies to champion concrete economic reforms like debt relief, taxing billionaires, and combating illicit financial flows. Rather than merely defending outdated institutions, Burnham should support emerging \"coalitions of the willing\" that are testing innovative approaches to global cooperation on taxation, climate finance, and wealth distribution.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/andy-burnham-g7-g20-presidencies-opportunity-to-reshape-global-economy-by-danny-sriskandarajah-2026-08", "state_media": false, "category": "オピニオン", "full_text": "How Britain Can Help Build a Fairer Global Economy\nDanny Sriskandarajah\nWith the United Kingdom poised to preside over both the G20 and the G7, Prime Minister Andy Burnham has a unique opportunity to usher in a new internationalism grounded not in military posturing, but in the pursuit of a fairer global economy. But he must abandon his predecessor’s defensive approach.\nLONDON—Andy Burnham faces no shortage of challenges as the United Kingdom’s latest prime minister. Fortunately, he also has a unique opportunity to lead the way in addressing major global economic issues and redesigning outdated institutions.\nBurnham took over after a tumultuous decade bookended by the UK’s decision to leave the European Union in 2016 and the premiership of Keir Starmer, who struggled to convince the public that international cooperation serves British interests. Burnham therefore inherits a foreign policy that feels both defensive and diminished, focused on holding fragile alliances together and cutting foreign-aid budgets dramatically in the name of “progressive realism”—a tagline that inspires no one.\nAlthough threat management may be unavoidable in today’s world, it does not offer people a positive vision. To do that, Burnham should set out to help shape norms and institutions that will outlast today’s chaos. The payoff would be a new internationalism grounded not in military postures, but in the pursuit of a fairer global economy that enables people everywhere to flourish. Such a framing would mirror Burnham’s promise of renewal at home and position Britain to lead on economic cooperation precisely when the old order is being undermined.\nThe timing is ideal because the UK will hold the G20 presidency in 2027 and the G7 presidency in 2028. Such opportunities are rare; those who seize on them benefit. Many still recall how Prime Minister Gordon Brown helped steady the world economy in 2009, and how his predecessor, Tony Blair, used the 2005 G8 to advance debt relief and aid for Africa.\nBurnham should be similarly bold. The safe option is to keep Britain’s head down, flatter a difficult US president, and avoid controversy. But defensiveness will not deliver meaningful results. Launching something new, even without a full consensus, is the better option. That is what South Africa did with the International Panel on Inequality during its G20 presidency, and it is what Brazil did by putting taxation of the super-rich in its Rio leaders’ declaration.\nBritain, for its part, could urge concrete action on the debt crises that are strangling dozens of countries, crack down on illicit financial flows, or introduce a minimum tax on billionaires. Leading by example on any of these issues would signal that it wants to shape the future rather than merely salvage remnants of the past. A prime minister who promised to “build a new economy” that delivers fairer outcomes for his constituents in Makerfield should embrace the same goal for people struggling to get by in Maputo or Mumbai.\nTo that end, Burnham also has an opportunity to break ground on building new institutions for global cooperation. The international legal, political, and economic institutions that Britain helped design in the 20th century increasingly seem ineffective, and some are facing ruthless attacks from allies or even some British politicians (in the case of the European Convention on Human Rights). The answer is not to defend the status quo but to help create a new one.\nA good place to start is with the “coalitions of the willing” that are already bringing together small groups of states (often odd bedfellows) to advance a shared agenda. For example, Barbados, France, and Kenya are co-chairing a Global Solidarity Levies Task Force to develop new international fees on aviation, premium flyers, shipping, fossil-fuel extraction, and financial transactions to generate revenues for climate and development finance. Similarly, Colombia and the Netherlands have led an effort to drive progress on the transition away from fossil fuels, and other groupings are working on debt relief, central-bank swap lines, and wealth taxes.\nBy joining, funding, or simply giving airtime to these initiatives at the G7 or the G20, the UK would send a strong signal that it is not relying only on existing international mechanisms to pursue global goals. It would also help convince countries across the Global South that their voices and leadership are valued.\nThough building global consensus seems impossible nowadays, these ongoing efforts should give us hope that progress is still possible. The building blocks of a new 21st century internationalism are already being assembled. In some cases, like the proposal to tax polluting activities through solidarity levies, new initiatives allow a small group of countries to test and study novel approaches without having to achieve a global consensus or overcome vetoes from powerful countries. In other cases, such as the International Panel on Inequality, t", "translation_ja": "", "vocab": [{"word": "defensive", "definition": "攻撃的でなく、自己を守ることに焦点を当てた姿勢。国際政策の文脈では、現状維持に終始し、新たなイニシアティブを取らない消極的なアプローチを指す。"}, {"word": "illicit", "definition": "法律や規制に違反する、または許可されていない活動。ここでは違法な資金の流れや不正な経済活動を意味する。"}, {"word": "levy", "definition": "政府が国民や企業に課す税金や強制的な金銭的負担。特定の活動や商品に対して課される課税制度を指す。"}, {"word": "coalition", "definition": "共通の目標を達成するために一時的に結合した複数の団体や国家。異なる立場の者が協力して特定の課題に取り組む形態。"}, {"word": "veto", "definition": "決定や提案を拒否・禁止する権力。国際交渉では、強力な国が他国の提案を一方的に否定する行為を指す。"}, {"word": "consensus", "definition": "複数の関係者が合意に達した共通見解や決定。国際協力では全参加国の同意を得ることが目標とされる。"}]}, {"title_ja": "テクノクラシーではヨーロッパは修正できない", "title_en": "Technocracy Can't Fix Europe", "summary_ja": "著者は、マリオ・ドラギやパトリック・コリソンなどのヨーロッパの精鋭による民間イニシアティブ「ライン・グループ」がヨーロッパの成長と革新を促進するかもしれないが、本質的な問題を誤解していると主張しています。ヨーロッパが直面する真の課題は専門知識やリソースの不足ではなく、テクノクラートの解決策だけでは対処できない政治的なものです。", "summary_en": "The author argues that while the Rhine Group—a new private initiative led by elite European business and tech figures—may help stimulate European growth and innovation, it fundamentally misunderstands the problem. The real challenge facing Europe is not a lack of expertise or resources, but a political one that technocratic solutions alone cannot resolve.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/rhine-group-eu-reform-mission-technocratic-fixes-wont-fix-political-problems-by-alberto-alemanno-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Technocracy Can’t Fix Europe\nA new private initiative bringing together the crème de la crème of European business, financial, economic, and tech elites could well prove useful in kick-starting European growth and innovation. But first, it must recognize that the problem it hopes to solve is fundamentally political.\nALPBACH—The Rhine Group, launched this week with the goal of restoring Europe’s capacity to innovate, grow, and compete globally, is an unusual initiative: a private club assembled to do what public institutions are supposed to do. Nonetheless, it has brought together many household names, with former European Central Bank President Mario Draghi and the tech entrepreneur Patrick Collison serving as co-chairs. Luis Garicano, an LSE economist and former liberal member of the European Parliament, is the executive director.", "translation_ja": "", "vocab": [{"word": "technocracy", "definition": "専門家や技術者による統治体制。政治的決定を技術的・合理的な観点のみで行うシステムを指します。"}, {"word": "crème de la crème", "definition": "フランス語由来の表現で、「最高級の人々」「エリート中のエリート」という意味の慣用句です。"}, {"word": "kick-start", "definition": "停滞している状態を始動させる、または新しく開始させることを意味します。プロジェクトや経済成長などに使用されます。"}, {"word": "initiative", "definition": "主導的に立ち上げられた計画や事業。新しい取り組みやプロジェクトのことを指します。"}, {"word": "fundamentally", "definition": "根本的に、本質的に。表面的ではなく、最も基本的なレベルでという意味の副詞です。"}]}, {"title_ja": "FRBと財務省は現実を直視していない", "title_en": "The Fed and the Treasury Are in Denial", "summary_ja": "著者は、FRBと米財務省が米国債とドル需要の安定性について時代遅れの仮定に基づいて行動していると主張しており、市場の現実を無視する正統派経済学説に執着していると述べている。歴史的な教会の科学的証拠否定と並行させ、政策立案者は完全に効率的な市場への信仰を放棄し、金融市場が実際にどのように機能するかに直面する必要があると警告している。", "summary_en": "The author argues that the US Federal Reserve and Treasury are operating under outdated assumptions about stable demand for US debt and currency, clinging to orthodox economic theories that ignore market realities. Drawing parallels to the Church's historical denial of scientific evidence, the piece warns that policymakers must abandon their faith in perfectly efficient markets and confront how financial markets actually function.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/fed-treasury-in-denial-about-their-entanglement-in-financial-markets-by-katharina-pistor-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Fed and the Treasury Are in Denial\nFor most of the postwar era, the United States has enjoyed a privileged position as an issuer of both sovereign debt and US dollars that always found takers. But the US may no longer be able to rely on stable demand for its debt or its currency, forcing policymakers to face the truth about how financial markets are made.\nNEW YORK—For centuries, the Catholic Church upheld the dogma that the world was flat and that the sun revolved around it, despite evidence to the contrary. It would take a technological, scientific, and cultural revolution to undermine this doctrine fully. Today, we are at a similar juncture when it comes to finance, where the orthodoxy of “flat” markets in pursuit of efficient outcomes maintains its grip on the minds of many economists and, more problematically, policymakers.", "translation_ja": "", "vocab": [{"word": "postwar era", "definition": "戦後の時代を指す。特に第二次世界大戦後の国際関係や経済体制の時期を表す。"}, {"word": "sovereign debt", "definition": "政府が発行する国債。国家が借金として発行する債務を意味する。"}, {"word": "orthodoxy", "definition": "正統的な考え方や理論。広く認められ支配的な信念体系を指す。"}, {"word": "efficient markets", "definition": "効率的市場。すべての利用可能な情報が価格に反映されていると仮定する経済学説。"}, {"word": "dogma", "definition": "教条。疑問の余地なく真実と考えられている信念や原則。"}, {"word": "policymakers", "definition": "政策立案者。政府の方針や法律を決定する権限を持つ人物や機関。"}]}, {"title_ja": "レアアース供給網の確保は重要な戦略である", "title_en": "Securing Rare Earth Supply Chains is Essential Strategy", "summary_ja": "ガーディアン紙の社説は、各国が中国の優位性から離れてレアアース供給網の多様化を急遽実現する必要があると主張している。米国と同盟国は代替源のリサイクル革新への投資を開始しているが、依存度を減らし環境被害を緩和するには多国間協力と強い同盟国パートナーシップが必要である。", "summary_en": "The Guardian editorial argues that countries must urgently diversify rare earth supply chains away from China's dominance, which poses geopolitical and economic risks. While the US and allies have begun investing in alternative sources and recycling innovations, a multilateral approach with stronger partnerships and substantial investment is necessary to reduce dependence and mitigate environmental damage.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/30/the-guardian-view-on-rare-earths-its-common-sense-to-secure-essential-supply-chains", "state_media": false, "category": "オピニオン", "full_text": "The alarm sounded 16 years ago. In 2010, China blocked exports of key rare earths to Japan in a row over disputed islands in the East China Sea. The critical minerals are essential to everything from advanced weaponry and iPhones to electric vehicle batteries and wind turbines, so the rest of the world took note. But it didn’t take much action. China still accounts for about 70% of rare-earth mining globally and 90% of separation and processing.\nThen, last year, Beijing forced Donald Trump to back away from his trade war – not with its retaliatory tariffs, but the curbing of rare-earth exports. A scramble for new supplies began in earnest. The year-long trade truce is due to expire in November. The price of erbium, an element essential to communications infrastructure, has already jumped because of fears that export controls will soon be renewed.\nThe 17 metals known as rare earths are far from rare; their name refers to the low concentrations in which they are found. Extraction and processing are costly, complex and often dirty, while returns are low. That’s why the US – which dominated the industry in the 1980s – and others outsourced production to China. Any plan to diversify supply chains must somehow build in predictable demand and pricing to succeed. Even now, US rare earths are reportedly flowing to Asia because of the lack of domestic demand. While “Big shovel” is becoming the new driver of geopolitics, rare earths are a tiny slice of the critical minerals market – worth less than $6bn globally last year.\nEfforts to diversify supply chains had already begun. But the US-China standoff accelerated them. Last autumn, the Pentagon became the single largest investor in the US firm MP Minerals. In February, the Trump administration announced that it would spend $12bn to create a critical minerals reserve, focusing initially on rare earths. US officials have reportedly described their plan to create new supply chains as a “Manhattan Project” for rare earths. Others question the strategy behind the splurge of money and projects.\nChina, which imports rare earths for processing and has seen them affected by the war in Myanmar, also wants to diversify its supplies. Washington and Beijing are looking to South Africa, Greenland and, in particular, Brazil, raising grave concern about the ecological impact. Innovation, particularly in finding ways to recycle rare earths or extract them from mining waste or runoff, could help meet demand and reduce environmental damage. But it will not stop the extraction drive.\nEarlier this year, the US launched a critical minerals coalition with 54 partners, including Australia, the European Commission and the UK. A multilateral approach is essential. But Europe and others know it would be extremely risky to count on Washington solely, given the unreliability of the Trump administration, its wild use of trade weapons and its threats to invade Greenland. Stockpiles of essential rare earths, serious investment and stronger partnerships with likeminded allies will be central to a solution. The 2025 European Critical Raw Materials Act set targets for reducing import dependence by 2030. France is already home to the biggest facility outside China to process all 17 rare earths, and a deal for Brazilian minerals is under discussion. But many fear that European countries are moving too slowly. That must change.", "translation_ja": "", "vocab": [{"word": "diversify", "definition": "供給源や事業内容などを多様化する、複数の分野に広げることで、リスクを分散させる戦略的な経営手法を指す。"}, {"word": "outsourced", "definition": "外部の企業や国に業務や生産を委託すること。低コスト化やリソース効率化のため、製造業などで一般的な経営戦略である。"}, {"word": "geopolitics", "definition": "地理的条件や資源配置が国家間の政治力学や戦略に与える影響を研究する分野。国際関係における大国間の競争を分析する。"}, {"word": "extraction", "definition": "天然資源や鉱物を地中から採掘・抽出するプロセス。環境負荷が大きいため、持続可能性が課題となる。"}, {"word": "multilateral", "definition": "複数の国または団体が参加する、多国間による協調的なアプローチ。二国間ではなく広範な国際協力を意味する。"}, {"word": "stockpiles", "definition": "戦略的に備蓄された物資や資源。有事の際の供給不足に対する緊急対応として各国が保有する備蓄量。"}]}, {"title_ja": "政治的な中傷として「ビーガン」を使用することの問題点", "title_en": "Why Using 'Vegan' as a Political Slur Misses the Point", "summary_ja": "エマ・ベディントンは、米国共和党が「ビーガン」を政治的な中傷として武器化することは問題のある偏見を示していると主張し、民主党の候補者たちはビーガニズムを擁護するのではなく防御的に距離を置いていると述べている。彼女は、ビーガンは公共の利益への献身と証拠に基づいた環境懸念のため、実際には公職に適していると主張している。", "summary_en": "Emma Beddington argues that US Republicans weaponizing 'vegan' as a political insult reveals a troubling bias, while Democratic candidates defensively distance themselves from veganism rather than defending it. She contends that vegans are actually well-qualified for public office due to their commitment to the greater good and evidence-based environmental concerns.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/30/why-is-vegan-suddenly-being-used-as-a-slur", "state_media": false, "category": "オピニオン", "full_text": "Cool news, fellow soy boys and girls – we’ve been promoted from feeble, tofu-eating wokerati to dangerous radicals unfit for public office. Politico reports that US Republicans have started throwing “vegan” around as a tactic to tarnish their political opponents. “He’s a vegan,” Trump warned of Democratic Texas senatorial candidate James Talarico in May, while Talarico’s opponent, state attorney-general Ken Paxton, is trying to get the nickname “Tofu Talarico” to stick. Paxton also called him “a vegan who thinks God is non-binary”, which I find hilarious as a political put-down – give the man a Netflix special. (Sidenote: I investigated, and according to the Catholic catechism, God is “neither man nor woman”.)\nRepublicans have also been digging up past pro-plant-based statements from Colorado congressional candidate Manny Rutinel: a campaign committee press secretary described him on X as “a far-left vegan activist who wants to end animal agriculture”, posting an old pic of Rutinel bare-chested and wearing a Peta anti-meat banner. Other Dems have also been accused of, erm, liking animals and eating plants: Arizona congressional candidate Amish Shah has been attacked for his “wacky liberal agenda pushing vegan policies” and Lindsay James in Iowa drew heat for merely supporting the idea of “meatless May”.\nIt’s ridiculous but also depressing. Because hang on: does America actually think veganism disqualifies a person for political responsibilities? Apparently, when you look at how these candidates reacted. A Talarico spokesperson issued an official response to “vegan accusations” (“accusations” – the word you’d use for say, corruption or sexual assault): a picture of him wrapping his face around a giant hunk of meat. The candidate himself joked, spicily, “I’ve been eating barbecue since before Ken Paxton’s first indictment” (despite many years of legal issues, Paxton has never been found guilty of any crime).\nRutinel, meanwhile, clarified he’s not vegan now, saying he needs to “enjoy the delicious products that Colorado ranchers make”. His Reddit posts supporting animal rights, he said, were “the views of a 22-year-old kid,” giving the impression his veganism was youthful folly, like taking a puff of a joint in college – he tried a tempeh wrap, but he didn’t finish it! A spokesperson for James said she has “always sided with Iowa farmers”.\nObviously harbouring vegan sympathies plays badly in agricultural communities (claiming your opponent is a seitan worshipper is a canny strategy when you’re appealing to ranchers), so I understand the emphatic denials. But rather than playing into this notion that vegans are extreme-left fantasists who can’t be trusted, I wish someone would defend the idea that they’re actually perfectly well qualified for political office.\nWhy wouldn’t they be? Sure, people think we’re pleased with ourselves and boring (guilty), but that never excluded other politicians from power. We’re not so weakly undernourished that we couldn’t survive the rigours of the job, either – these days, plant proteins are thrust at us from every angle.\nAnd actually, there are plenty of reasons why vegans can make great public servants. For a start, anyone who has gone vegan for planetary or animal welfare reasons is OK with a spot of self-denial for the greater good. You think we’ve forgotten how delicious butter is? Believe me, I remember. I’m not suggesting vegans live heroic lives of self-sacrifice (there are vegan pistachio croissants now!), or that not eating animals makes us better people. But any politician with a sense that there are things more important than their own gratification is welcome.\nVegans are used to ridicule, and being the target of people’s strongly voiced opinions – that’s always handy in politics. We’re also – and apologies for veering into classic vegan self-righteousness – basically right, no? Talarico’s 2022 comment, that reducing meat consumption to fight climate change is an “existential” matter, has been weaponised against him, but meat production alone accounts for nearly 60% of agriculture’s greenhouse gas emissions. Thomas Poore, lead author of the landmark 2018 study on the environmental impact of agriculture from which that statistic comes, concluded that excluding meat and dairy from your diet is “the single biggest way to reduce your impact on planet Earth”.\nPoliticians who think individuals can make a difference, and that collectively we can mitigate the worst impacts of climate breakdown and stop things getting even worse, are exactly who I want to see in power. Because they give us something even better than a plant milk that doesn’t curdle in hot tea: hope.\nEmma Beddington is a Guardian columnist\nDo you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": [{"word": "weaponised", "definition": "論争や対立で相手を攻撃するための道具として意図的に利用すること。政治的な議論において、相手の発言や行動を批判の材料として使用する場合に用いられる。"}, {"word": "disqualifies", "definition": "ある役職や立場に就く資格をなくす、あるいは適格性を失わせることを意味する。特に法的または倫理的な理由で不適切と判断される場合に使用される。"}, {"word": "canny", "definition": "精妙で巧妙な、あるいは計算された戦略的手段を指す。政治戦略や交渉において、相手の弱点をうまく利用する方法を説明する時に用いられる。"}, {"word": "mitigation", "definition": "悪影響や問題の深刻さを軽減または緩和すること。気候変動や災害などの悪影響を減らすための対策や政策を指す。"}, {"word": "existential", "definition": "人間の存在そのものに関わる、または生存自体に関係する根本的な問題を表す。生死や種族存亡に関わる危機や課題を指す場合に使用される。"}]}, {"title_ja": "イタリアの横断歩道での携帯電話禁止：日常の迷惑行為を犯罪化する第一歩", "title_en": "Italy's Phone Ban While Crossing Streets: A Start to Criminalizing Daily Annoyances", "summary_ja": "デイブ・シリングはイタリアの横断歩道での携帯電話使用に対する罰金案を支持し、それが実在する安全上の危険と社会的迷惑に対処していると主張している。彼はこのコンセプトをユーモアで拡張し、着信音の使用、会話の中断、レストランでの椅子の放置、歩道でのスクーター乗車など、他の迷惑行為に対する罰金を提案している。", "summary_en": "Dave Schilling applauds Italy's proposed fine for pedestrians using phones in crosswalks, arguing it addresses a genuine safety hazard and social nuisance. He extends this concept humorously, proposing fines for other annoying behaviors like using ringtones, interrupting conversations, leaving chairs out at restaurants, and riding scooters on sidewalks.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/30/italy-phone-street-ban", "state_media": false, "category": "オピニオン", "full_text": "Imagine driving in Italy, with its narrow, cobblestone streets and scooter enthusiasts. I find it hard enough to drive in Los Angeles, a city designed specifically with the automobile in mind. I’d probably squash a pedestrian or two trying to navigate Italian roads.\nThe modern world is just too hectic for the ancient streets of Europe, so Italy is considering doing the only sensible thing it can: outlawing texting in crosswalks. The Italian government’s updated draft of its highway code proposes fines of €75 or more for anyone caught sending a DM, updating their LinkedIn, finishing Wordle on the fifth guess, or anything else phone-related that might make them miss an oncoming metal projectile. I’m sure most people will risk the slap on wrist to get that message off, but it at least sends a signal to the Italian people that paying attention to traffic is actually kind of important.\nDistracted pedestrians aren’t just a problem in Italy, though. If I’m turning right on a red light, chances are there will be someone inching slowly toward the intersection with their thumbs furiously smashing against the glass of their iPhone, oblivious to the fact that I am planning to drive into the parcel of land they are currently occupying. It’s not just that this behavior is dangerous. It’s also deeply annoying. I’m forced to pay attention for both of us, like I’m a guardian angel or the arbiter of whether you, the clueless phone person, live or die. Sure, I might briefly get off on the power trip of having such authority over our mutual safety, but I’d much rather be thinking about where to have dinner instead of how long I should wait to honk at the drooling simpleton preventing me from turning.\nI applaud the Italian government for their forward thinking. Actually, I think it’s time we criminalize more small annoyances. Such as …\nUsing a ringtone\nSomeone please explain to me why anyone bothers with leaving their ringer on. We are decades past the era when, for a dollar, you could buy that Crazy Frog song and impress your friends every time you got a call. Now, it’s just pure sonic detritus, clogging up our ears with aural poison – bleeps, bloops, pings and plops. When AMC Theaters tells an auditorium full of grown adults to silence their phones before a movie, all I can think is: “Unless they’re an on-call heart surgeon, their phone should always be silent.” Fine amount: $200\nInterrupting me when I’m not done talking\nI understand and accept that I have a lot to say. I make my meager living from writing, so pontificating just comes naturally to me. Sometimes, I wish it didn’t. But most of the time, what I’m saying is pretty important and you should be listening. Not waiting for your turn. I just listened to you try to captivate me with a treatise on gender roles in Christopher Nolan’s films. I respected you, even if I didn’t want to. Either let me finish or you’re fined! Fine amount: $200\nNot pushing in your chair when stepping away from a table at a restaurant\nWould you like to see the server at your favorite Olive Garden location break their tibia because you left your chair in the middle of a walkway? If that’s what you think of our restaurant industry workers, I’ve got a mind to go outside to my patio and bang on some pots and pans like it’s Covid lockdown to thank everyone carrying a plate of shrimp scampi who has to avoid rude customers. When you get up from your table, push in your chair. It takes two seconds and it could save a life … and a plate of delicious pasta. Fine amount: $250\nRiding an electric scooter on the sidewalk\nI would like to remind everyone that scooters from companies such as Lime and Lyft explicitly say to not ride these vehicles on the sidewalk. The sidewalk is called a sidewalk because it, much like Nancy Sinatra’s boots, was made for walking. A motorized conveyance doesn’t belong on the sidewalk, especially ones that actually can get some real speed behind them. Use the bike lane, for God’s sake. Or take the bus. Or anything else, really. It’s just beyond dangerous to be tooling around on a scooter while people are trying to go about their business.\nI mean, what if I’m looking at my phone and texting? Shame on you, scooter guy. Fine amount: $500\n- \n  Dave Schilling is a Los Angeles-based writer and humorist", "translation_ja": "", "vocab": [{"word": "distracted", "definition": "注意が散漫になった、気が散った状態。運転や歩行中に別のことに気を取られて、周囲の危険に気づかない様子を表す。"}, {"word": "pontificating", "definition": "権威的に、または偉そうに意見を述べる行為。自分の考えを立派そうに長々と述べることを指す。"}, {"word": "sonic detritus", "definition": "音に関する不要なゴミ。ここでは、着信音などの不快で不要な音を指す比喩的表現。"}, {"word": "conveyance", "definition": "乗り物、輸送手段という意味の正式な用語。スクーターやバイクなどの移動手段全般を指す。"}, {"word": "aural poison", "definition": "耳に不快な音、聴覚的害悪を指す表現。不要な着信音などの望まない音を強調して表現している。"}, {"word": "arbiter", "definition": "仲裁者、判定者という意味。ここでは、他者の生死を左右する力を持つ存在を指す比喩的用法。"}]}, {"title_ja": "ヨーロッパはヨーロッパ人に任せよ", "title_en": "Leave Europe to the Europeans", "summary_ja": "著者は、トランプ政権によるヨーロッパからの米国軍事駐留削減計画が、数十年にわたる米国の防衛支出がヨーロッパの同盟国を自立ではなく依存させてきたため、負担共有の必要な転換を表していると主張している。撤退には抵抗があるが、大陸に駐留する8万人の米国兵を大幅に削減することで、ヨーロッパに独自の防衛能力構築を強制し、米国の年間1000億ドルのヨーロッパ安全保障負担を軽減できるという。", "summary_en": "The author argues that the Trump administration's plan to reduce U.S. military presence in Europe represents a necessary shift in burden-sharing, as decades of American defense spending have made European allies dependent rather than self-reliant. While the withdrawal would face resistance, substantially reducing the 80,000 U.S. troops stationed on the continent could force Europe to build its own defense capabilities while relieving America's fiscal burden of $100 billion annually on European security.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/leave-europe-europeans", "state_media": false, "category": "オピニオン", "full_text": "In a 1987 New York Times advertisement, long before he became president, Donald Trump insisted that “America should stop paying to defend countries that can afford to defend themselves.” This has been a consistent theme of his foreign policy rhetoric since he first moved into the White House, and he has been especially focused on applying it to Europe.\nDuring his first term, Trump jolted European allies by threatening to withdraw the United States from NATO, arguing that its members were not spending enough on their own defense and were free-riding on American taxpayers. Ultimately, he did not make good on the threat. All his administration mustered was a late, failed effort in the summer of 2020 to remove 12,000 troops from Germany.\nThis time around, his administration has adopted burden shifting as a rallying cry and seems poised to act on it. Almost immediately after taking office, Secretary of Defense Pete Hegseth traveled to Brussels to inform his counterparts that the United States would have to focus on priorities other than Europe’s defense. Europe itself, he said, needed to “take ownership of conventional security on the continent.” Last month, to turn this vision into reality, the Pentagon launched its Europe Posture Review, which is intended to be a critical assessment of U.S. troop deployments and basing commitments on the continent. Announcing it at the NATO defense ministerial, Hegseth was clear: “Europe can and must take primary responsibility for its conventional defense.” Such an outcome would amount to a transformation in the transatlantic alliance.\nSince the founding of NATO after World War II, the United States has underwritten Europe’s defense and held the top military command position in the alliance. More than 75 years later, it still accounts for about 60 percent of NATO members’ military expenditures and stations some 80,000 troops on the continent and in the United Kingdom. Decades of American dominance have left Europe reliant on U.S. leadership, technology, and spending.\nIf the Trump administration is serious about shifting defense responsibilities to Europe, then the posture review offers a rare opportunity. A substantial reduction in the U.S. military presence in Europe over the next two years would force the continent to build forces it has so far left to the United States, while also putting Washington on sounder defense footing. The United States is $40 trillion in debt and adding roughly $2 trillion per year, with no prospect of major fiscal reforms. Despite this dire fiscal picture, it spends about $100 billion on Europe’s defense each year.\nThe problem is not new. Although U.S. administrations since Dwight Eisenhower have urged Europe to do more for its own defense, Europeans have consistently shirked their obligations. Even today, some European leaders hold out hope that if they can wait out Trump’s second term, NATO will return to “normal.” Only the withdrawal of U.S. forces will convince allies that the United States truly intends to turn over responsibility for the region’s conventional defense. Nothing else will force them to plan for a future in which Washington is no longer in the lead. Such a move will draw resistance from European leaders and the U.S. Congress. But a smaller footprint is vital to relieve U.S. overextension, and it can be done without harming American interests.\nA TEMPORARY SHIELD\nThe presence of U.S. military personnel in Europe in the late 1940s and early 1950s was supposed to be a temporary shield as Western European states rebuilt economies devastated by war. But the troops stayed long after that rebuilding was complete. At the height of the Cold War, the United States had more than 400,000 troops on the continent. When the Soviet Union collapsed, NATO lost its formal justification.\nFor Washington, the alliance became primarily about institutionalizing U.S. power and influence, and although the total number of U.S. forces stationed in Europe declined over time, it has never dropped below 60,000. With the Soviet threat gone, European governments were happy to capitalize on the “peace dividend” and expanded their social programs while gutting military spending. At the same time, the alliance took on new commitments, offering Moscow’s tiny, vulnerable neighbors promises of protection with little thought of what their defense would require. By 2014, when Russia annexed Crimea, Europe was deeply dependent for its security on the United States, which was already tied up in the Middle East and increasingly focused on China’s rising military power. That situation persists today.\nThe Pentagon last conducted a formal review of global U.S. military posture in 2021, in the first year of the Biden administration. It made a few modest recommendations, but its general conclusion was that the existing arrangement was just about right. In Asia, it advised seeking more places to operate from and pledged to harden U.S. bases there. But it did little to increase ", "translation_ja": "", "vocab": [{"word": "underwritten", "definition": "財政的支援や保証を提供すること。ここでは、米国がヨーロッパの防衛費を負担・保証してきたという意味で使用。"}, {"word": "posture review", "definition": "軍事態勢・配置の包括的な見直し。軍事戦略上、兵力配置や基地配置などを評価・改善するプロセス。"}, {"word": "burden shifting", "definition": "責任や負担を他の当事者へ移行させること。ここでは防衛責任をヨーロッパに移譲する政策概念として使用。"}, {"word": "shirked", "definition": "義務や責任を回避・怠ること。ここでは、ヨーロッパが防衛義務を継続的に回避してきたという批判的なニュアンス。"}, {"word": "overextension", "definition": "資源や力を過度に広げすぎた状態。米国が世界中に軍事的関与を展開しすぎて負担過大になっていることを指す。"}, {"word": "institutionalizing", "definition": "制度化する、体系的に組み込むこと。NATOを通じて米国の影響力を永続的・構造的に確立することを意味する。"}]}, {"title_ja": "大規模な経済的リバランスが到来する", "title_en": "A Great Rebalancing Is Coming", "summary_ja": "著者は、中国とドイツが大幅な貿易黒字を計上する一方、米国が巨額の赤字を抱える現在のグローバル取引不均衡は根本的に持続不可能であり、やがて崩壊すると主張している。主要経済国が原因と解決策について意見が対立しているため、協調的な調整の可能性は低く、痛みを伴う危機は避けられない。歴史は、このような不均衡は必ず破壊的に終わり、各国の経済的脆弱性と政治力に基づいて負担が不均等に分配されることを示している。", "summary_en": "The author argues that current global trade imbalances—with China and Germany running large surpluses while the US maintains massive deficits—are fundamentally unsustainable and will eventually collapse. Since major economies disagree on the causes and proposed solutions, coordinated adjustment is unlikely, making a painful crisis inevitable. History shows such imbalances end disruptively, with the burden distributed unevenly based on each country's economic vulnerability and political power.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/great-rebalancing-coming", "state_media": false, "category": "オピニオン", "full_text": "The trade imbalances that have come to characterize the global economy are fundamentally untenable. China, Germany, and a handful of other economies run large, persistent trade surpluses, while the United States absorbs much of these surpluses by running the world’s largest trade deficit. Sooner or later, something must give. For an advanced, capital-rich economy such as that of the United States, an enduring trade deficit will bring with it either rising unemployment or rising debt, neither of which is sustainable.\nIn theory, the major surplus and deficit economies could agree on a coordinated adjustment in which surplus countries would expand domestic demand and deficit countries would gradually reduce their dependence on debt-fueled consumption, allowing the imbalances to shrink without a sharp contraction in global demand. That would be the sensible solution.\nBut because the major players disagree about the causes of the imbalances, they are unlikely to come to such a solution. China attributes them to excessive U.S. consumption and fiscal deficits; the United States blames foreign industrial, trade, and currency policies; and Europe has yet to settle on a coherent diagnosis. As a result, they all have proposed remedies that are at odds with one another. Beijing wants deficit countries to save more and prefers not to change China’s growth model. Washington wants surplus countries to reduce their surpluses by redistributing income to the household sector. European leaders continue to advocate for multilateral cooperation and rules-based trade. This makes the chances of a coordinated response slim. And as the economic analyst Martin Wolf wrote in the Financial Times earlier this year, if there is little prospect of preemptive action, “the second-best option is to prepare for a crisis.”\nIndividual economies are now doing just that. History shows that trade imbalances of this scale almost always end painfully—and that the pain of the adjustment is not distributed evenly. High levels of debt combined with low productivity makes a country more likely to bear the burden of a trade adjustment, but economic and political power can also give it the tools to pass the burden off to others. Among the three main economic players today, China is the most vulnerable, the United States has the most capacity to reduce its exposure, and Europe possesses latent power but a dubious ability to use it. None of their maneuvers to protect themselves are likely to reduce the risk or overall cost of a crisis. The question is only who will feel the brunt of the losses when it arrives.\nHISTORY REPEATS ITSELF\nLarge, persistent trade imbalances have cropped up periodically over the past century, and they are rarely benign. One such episode occurred during the 1920s, when a surge in American productivity was not accompanied by rising wages. Production soared past consumption, and the United States ran enormous trade surpluses. Europe ran the corresponding deficits, as many countries borrowed heavily abroad to rebuild economies devastated by war. Germany in particular borrowed extensively to finance both domestic growth and its reparations payments. American domestic debt also rose rapidly, much of it to fund consumption and asset speculation.\nAs the imbalances persisted and U.S. manufacturing expanded at the expense of European manufacturing, protectionist pressures intensified. France devalued its currency in 1927, the United Kingdom abandoned the gold standard in 1931, and the same year Germany imposed import restrictions and rationed access to foreign currency. Even the United States, whose manufacturers and farmers complained that weak demand was threatening domestic production and employment, passed the Smoot-Hawley Tariff Act in 1930.\nThe adjustment came in the form of a collapse in global trade during the Great Depression of the early and mid-1930s. Nearly every major economy suffered from the contraction, but they did not suffer equally. Those with large deficits, such as the United Kingdom, recovered more quickly and suffered less severe financial distress than the United States, which absorbed a disproportionate share of the costs. American exports fell faster than imports, domestic investment imploded, banks failed, and bankruptcies surged.\n Trade imbalances on a large scale almost always end painfully.\nThe next major episode of persistent trade imbalances was the rare case in which the imbalances faded away without causing major disruption. During the 1950s and 1960s, the United States again ran very large surpluses while Europe and Japan ran corresponding deficits. Similar to the situation in the 1920s, these deficits financed the reconstruction of postwar economies as resources poured into infrastructure and manufacturing. But unlike in the earlier period, governments maintained strict controls over capital flows and imported capital mostly to fund investments that generated enough future income to service the associated", "translation_ja": "", "vocab": [{"word": "untenable", "definition": "持続不可能な、支持できない状態を表す。論理的または実践的な理由で維持することが不可能であることを意味する。"}, {"word": "benign", "definition": "害のない、温和な状態を表す。特に経済用語では、悪影響を与えない或いは好影響をもたらす状況を指す。"}, {"word": "imbalance", "definition": "不均衡、バランスの不均等を示す。経済において、収入と支出、輸出と輸入の間の不釣り合いを表す。"}, {"word": "persistent", "definition": "継続的な、粘り強く続く状態を表す。特に問題や状況が長期間繰り返されることを意味する。"}, {"word": "protectionist", "definition": "保護主義的な、自国産業を外国との競争から守ろうとする政策や姿勢を指す。"}, {"word": "contraction", "definition": "収縮、縮小を表す。経済用語では、GDP成長率が低下し経済規模が縮小する状況を意味する。"}, {"word": "disproportionate", "definition": "不均衡な、相応しくない程度の大きさを表す。期待値以上に大きい或いは小さい割合を示す。"}]}, {"title_ja": "不可能な中東", "title_en": "The Impossible Middle East", "summary_ja": "著者は、2月28日以降の米国・イスラエルによるイラン戦争の拡大が中東内の分裂を深め、湾岸諸国と米国の関係を緊張させ、地域各国にセキュリティパートナーシップの再考を迫っていると主張している。アラブ諸国は実行可能な代替案の欠如から米国の保護から完全に方向転換することはできないが、米国の信頼性への懐疑の高まりにより、ヨーロッパ、中国、ロシア、および地域大国との本格的な多様化努力を促進している。", "summary_en": "The author argues that the escalating US-Israel war against Iran since February 28 is deepening divisions within the Middle East, straining relationships between Gulf states and the US, and forcing regional governments to reconsider their security partnerships. While Arab states cannot fully pivot away from American protection due to lack of viable alternatives, their growing skepticism of US reliability is prompting serious diversification efforts with Europe, China, Russia, and regional powers.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/middle-east/impossible-middle-east", "state_media": false, "category": "オピニオン", "full_text": "The Middle East is no stranger to conflict. But even by its standards, the last six months have been extraordinarily chaotic. Ever since the United States and Israel went to war against Iran on February 28, countries in the region have faced cycles of drone and missile strikes against their military bases, energy infrastructure, and water desalination plants. Their airports and oil refineries have repeatedly needed to pause operations. And their regular ports have at times sat idle, thanks to Iranian attacks on ships in the Strait of Hormuz.\nDespite months of negotiations, Tehran and Washington seem poised to keep fighting on and off in an effort to wear down the other’s materiel and willpower. In fact, the war has expanded. More members of Iran’s regional proxy network, including the Yemen-based Houthis and Iranian-aligned Iraqi militias, joined the fray, and a port in Egypt was hit by drones. (No country has claimed responsibility for that attack, but the United States blamed Iran.)\nAs the conflict drags on, damage to the Middle East will extend far beyond infrastructure. It will deepen the Middle East’s fault lines. Some economies will be affected more than others, which could upend even the Gulf states’ traditionally stable politics. Institutions central to the region, such as OPEC+, could further come under extreme stress. There are measures that Middle Eastern governments can take to address these challenges, but none are straightforward, and all have their own set of consequences. To survive an era of increased disorder, then, the region’s countries will have to rethink how they relate to the wider world—and, most important, to each other.\nA HOUSE DIVIDED\nMiddle Eastern states have long had their differences. They have feuded, for example, about Israel, political Islam, and oil policy. Saudi Arabia and the United Arab Emirates have contrasting visions for the region and beyond, including Libya, Sudan, and Yemen. But the war is deepening all these rifts and creating new ones. The UAE has resented the muted nature of the condemnations that Oman, Qatar, and Saudi Arabia have made of Iran’s attacks on Emirati infrastructure. The countries have differences on how to handle the war itself and an unpredictable Trump administration. These disagreements have piled onto existing disputes, feeding resentment and making the region’s differences harder to manage. They are frustrating efforts to adapt to the evolving war.\nThe conflict has also begun to divide the Gulf from the United States, its main security guarantor. When U.S. President Donald Trump returned to the White House, many Gulf governments believed that their relationship with Washington would improve after a turbulent four years under the Biden administration. After all, Trump had a friendly and transactional political approach toward the region during his first term. Middle Eastern officials made ostentatious efforts to win him over, including by pledging to spend trillions of dollars in the United States, raising oil output, funneling investment deals to the president’s own family, and, in the case of Qatar, gifting him a private jet. But then Trump launched not one but two wars against Iran, prioritizing Israel’s desire to debilitate the Islamic Republic over the Arab states’ desire for stability. This showed the region that Washington cannot be trusted.\nThe Middle East has long worried about its dependence on the United States and has thus been diversifying its partnerships since the Arab Spring, in 2011. But in the past, these efforts were largely aimed at threatening or coercing Washington to act in their favor. Now they are more serious. This month, for example, Saudi Arabia forged a mutual defense pact with Pakistan and Turkey. Regional governments are buying more weapons from suppliers in Europe, South Korea, Turkey, and even Ukraine. Finally, they continue to look to China and Russia for political and economic partnerships. They are especially interested in forging more economic ties with China, which already trades hundreds of billions of dollars worth of goods with the region. China is currently the top destination for crude from the region.\nAny pivot away from the United States will be limited. There is no alternative security partner, at least right now: China is loath to use its economic might to offer military assistance, Russia is bogged down in its own war, and Europe struggles to coordinate on defense issues. (From the Gulf’s perspective, Europe is also too focused on Gulf domestic issues.) These governments are also unhappy with Chinese and Russian efforts to assist Iran in the war by, respectively, offering Tehran material that it can use to rebuild its defense industrial base and helping it improve its targeting. And although American bases can make host states targets, regional governments still want a U.S. military presence and American protection.\nBut unlike past efforts to diversify, this limited shift away from Washington w", "translation_ja": "", "vocab": [{"word": "materiel", "definition": "戦争や軍事作戦に必要な物資・装備・兵器などの総称。ここでは、イランとアメリカが相互に消耗させようとしている物質的資源を指す。"}, {"word": "fault lines", "definition": "対立や分裂の潜在的な地点。地質学用語の比喩的用法で、地域内の深刻な相違や紛争の原因となる根本的な違いを意味する。"}, {"word": "ostentatious", "definition": "見せびらかすような、わざとらしい。ここでは湾岸諸国がトランプ大統領に好印象を与えるため、意図的に目立つように行った努力を指す。"}, {"word": "debilitate", "definition": "衰弱させる、弱体化させる。軍事的文脈では敵の戦闘能力や国力を低下させることを意味する。"}, {"word": "diversifying", "definition": "多様化する。政治・経済的には、複数のパートナーとの関係を構築することで、特定国への依存リスクを減らすこと。"}, {"word": "loath", "definition": "嫌がる、躊躇する。ここでは中国が軍事援助を提供することに消極的であることを示す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";

  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-30 23:02 JST";
  renderTabs();renderList();
})();
</script>
