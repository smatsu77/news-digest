rrying 259 passengers and eight crew members when it began taking on water after departing the coastal town of Kyrenia.\nThe ship's captain and seven crew members have been detained as part of an investigation into \"how this tragedy occurred\", Üstel wrote on social media.\nA search and rescue operation to find the passengers still unaccounted for is under way, which Turkish authorities have joined.\nThe privately owned ferry left the popular holiday resort of Kyrenia at about 12:30 local time (09:30 GMT).\nÜstel said the boat had been scheduled to travel to Turkey on Saturday, but had been delayed due to poor weather conditions.\nHe told Turkish media outlet TRT that the boat was hit by two waves before it capsized.\nWhile the captain of the vessel was trying to recover from the first wave, a second wave hit and it began taking on water, he told the outlet.\nHelicopters and coastguard boats have been dispatched to the scene, while ambulances have been stationed on the beach ready to receive rescued passengers.\nÜstel wrote on social media that the \"priority right now is human life\", adding that security forces, rescue teams and health officials were all on the scene.\nHe added the disaster will be thoroughly investigated and \"even the slightest negligence will be uncovered\".\n\"No one will be spared, regardless of who they are, who is found to be at fault or responsible,\" Üstel said.\nErhan Arikli, the transport minister of the self-declared Turkish Republic of Northern Cyprus (TRNC), which is only recognised by Turkey, told local media that 100 passengers had been taken to shore.\nTurkey's President Recep Tayyip Erdogan sent his condolences to Turkish Cypriots and said efforts to reach those who were still missing \"continue uninterrupted\".\n\"Immediately after the accident, we launched extensive search-and-rescue operations in co-operation with the authorities of the Turkish Republic of Northern Cyprus,\" he said at a military ceremony on Sunday.\nMustafa  forces have conducted strikes on two Iranian missile launchers on Larak Island, marking the first known American military action against Iran since late July. The US Central Command stated that IRGC forces were preparing to launch rockets with sea mines into the Strait of Hormuz. Iran's Islamic Revolutionary Guard Corps vowed a response, calling the attack a \"strategic and fatal mistake\" by the Trump administration.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cx2z72x5z1po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "US strikes Iranian launchers on Larak Island in first known attack in weeks\n- Published\nUS forces have struck two Iranian launchers on Iran's Larak island, a US official said, marking the first known American strikes on Iran since late July.\n\"Islamic Revolutionary Guard Corps (IRGC) forces were observed preparing to launch rockets with sea mines into Strait of Hormuz,\" the BBC's US partner CBS News quoted US Central Command spokesman Cdr Tim Hawkins as saying.\nThe IRGC said the attack on Sunday killed and wounded several people, and vowed \"response and punishment\".\nIt marks the first known US strike in Iran since US President Donald Trump paused a renewed military campaign in late July. The US said it had finished clearing all mines from the strait's main shipping lane earlier this month.\n- How the US could try to seize Iran's Kharg Island \n  - Published30 March\n- US plans to cut off military aid to key Middle East ally, BBC told \n  - Published2 days ago\n- Iran says it is 'fully prepared' to counter widened US economic sanctions \n  - Published5 days ago\nLarak Island is just offshore from the key port of Bandar Abbas and sits right on the Strait of Hormuz, a vital waterway for global shipping.\nIran is currently making tanker traffic pass by this island for checking and reportedly forcing vessels to pay $2m (£1.5m) to cross.\nHossein Mohebbi, the IRGC's spokesman called the attack a \"strategic and fatal mistake by the Trump regime\" and said that the \"enemy will pay the consequences of this miscalculation in both the economic and military fields\".\nIran's Tasnim news agency, which is affiliated with the IRGC, said earlier that the attack was carried out by drones. Reports indicate that two people were killed and two others injured, it said.\nTrump said last week that all mines placed in the Strait of Hormuz by Iran as part of its efforts to blockade the route had been detonated or removed. He said Iran had been warned that any ship or boat deploying new mines would be destroyed.\nIran's Deputy Foreign Minister Kazem Gharibabadi described Trump's claim as a \"propaganda\" deception.\nIran is facing renewed economic pressure after Washington announced a fresh sanctions campaign on 24 August aimed at further isolating Tehran and expanding secondary sanctions against its allies.\nIranian officials and state media have largely dismissed the campaign as a continuation of previous US economic measures, which they argue followed Washington's military failure in the recent conflict.\nThe US and Israel launched wide-ranging strikes on Iran on 28 February, with Iran responding by attacking Israel, US bases and allied states in the Gulf, and effectively closing the Strait of Hormuz to marine traffic. The Iran war has now crossed its six-month mark.\nSome 20% of the world's oil and liquefied natural gas used to travel through before the war began.", "translation_ja": "", "vocab": [{"word": "launcher", "definition": "ロケットやミサイルを発射する装置または機構。軍事用語として使用され、兵器システムの一部を指します。"}, {"word": "strait", "definition": "二つの陸地に挟まれた狭い水路。ホルムズ海峡のように国際的に重要な航路として機能します。"}, {"word": "blockade", "definition": "軍事的に港湾や地域を封鎖して物資の移動を阻止する行為。戦争や紛争時に使用される戦略です。"}, {"word": "detonated", "definition": "爆発装置や爆弾が爆発すること。detonate（爆発させる）の過去形で、意図的に爆弾を起動させることを意味します。"}, {"word": "secondary sanctions", "definition": "主要対象国と取引する第三国や企業に対して課せられる制裁。直接制裁ではなく、間接的な経済圧力を与えます。"}, {"word": "propaganda", "definition": "特定の政治的目的のために意図的に広められる情報や主張。真実性が疑わしく、世論操作を目的とします。"}]}, {"title_ja": "アイスランド、EUへの加盟交渉再開を投票で否決", "title_en": "Iceland votes against restarting EU membership talks", "summary_ja": "アイスランドは国民投票で政府のEU加盟交渉再開提案を否決し、52.8%が反対票を投じた。投票率82.5%という高い参加率となった同国民投票は、北極圏の国際的緊張にもかかわらず、安全保障問題よりも漁業権への懸念が主に投票結果を左右した。", "summary_en": "Iceland has rejected a government proposal to resume EU membership negotiations in a referendum, with 52.8% voting against. The referendum, which had an 82.5% turnout, was primarily driven by concerns over fishing rights rather than security issues, despite international tensions in the Arctic region.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c70le8ed1plo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Iceland votes against restarting EU membership talks\n- Published\nIceland has voted against resuming talks on joining the European Union 13 years after they were broken off.\nPublic broadcaster RUV reported that 52.8% of the more than 225,000 people who voted had rejected the government's proposal, while 47.2% had backed it. Some 12,600 votes separated them.\nPrime Minister Kristrún Frostadóttir's centre-left government promised to hold a referendum by 2027, but brought it forward because of international tensions, including US President Donald Trump's threats against Greenland.\nHowever, debate in this island nation of almost 400,000 people centred more on its fishing industry rather than security concerns.\nWith some 270,000 people eligible to vote, RUV reported the turnout of 82.5% was the highest in any Icelandic election since 2009.\nAlready part of the EU's single market and Schengen border-free zone, full EU membership would bring Iceland into the customs union and eventually the eurozone currency union.\nIceland began its application to join the EU in 2009 in the aftermath of the 2008 financial crisis and the collapse of Iceland's banking system.\nIts application was already well advanced when a eurosceptic government came to power in 2013 and put those talks on hold.\nFishing rights were the biggest obstacle to Icelandic accession then - as they remain today.\nIceland fought successfully to protect its fisheries from foreign fishermen during the Cod Wars with the UK in the 1970s - shortly after gaining independence from Denmark - and the country's fish and marine industries still account for almost 40% of its exports.\nMany No voters feared EU membership would mean ceding some control of these lucrative fishing grounds under the bloc's policies, which control how much a member state can catch.\n\"The No side was much more skillful in sort of tapping into the political national identity in Iceland, which emphasises formal independence, coming out of a long independence struggle coming out of Denmark,\" Eirikur Bergmann, a professor of politics at Bifröst University, told the BBC.\n\"And so they were able to appeal to people's very fundamental feelings.\"\nOn the other hand, the Yes campaign \"ran an overtly technical campaign, never really explaining the purpose or the passion in why Iceland join the EU\", he said.\nIceland's EU referendum results\nVotes cast: 225,031\nThe referendum campaign fuelled debate about Iceland's place in the world, Kristrún said after casting her ballot in the capital on Saturday.\nShe told a news conference on Sunday afternoon that the issue of EU membership would not be revisited while her government was in office.\nOne of her ministers denied that the result had been a setback for the government, pointing to the high turnout for the vote.\nThere was a significant geographical divide in which way people voted, with the capital, Reykjavík, backing EU accession talks and rural areas being more in against them.\nThe question on the ballot was: \"Should Iceland resume accession negotiations with the European Union?\"\nA Yes vote would not have been a final decision on joining the EU, but a move towards an accession agreement, which would then have to be approved by a second referendum.\nEqually, the No vote does not rule out the chance of Iceland resuming talks at some point in the future.\nWhile economic concerns dominated the referendum campaigns, security issues also featured.\nIceland is a founder member of Nato but has no military and relies on its allies for defence. Being a part of the EU would have granted it full access to the bloc's joint defence infrastructure.\nThe country has backed Ukraine during Russia's full-scale invasion and officials have also been alarmed by Russia's increased maritime manoeuvres near the island.\nBut Trump's expressed interest in subsuming another Arctic island, Greenland, into the US has raised concerns more recently.\nIceland's Foreign Minister Katrín Gunnarsdóttir told Sunday's news conference that she would seek to strengthen the country's defence relations with other countries following the referendum.\nHowever, Bergmann said: \"The debate was firmly domestic, it was called prior to the second term of Donald Trump, and the tumults of the world didn't really penetrate into the debate.\"\nJacob Funk Kirkegaard, a senior fellow at the European think tank Bruegel, told RUV that the EU had failed in \"selling itself\" even though it \"clearly would like to see itself as also a security actor, particularly in the Arctic\".\nHe said the result \"will be viewed as a missed opportunity - certainly for Iceland, but also the EU\".\nAn unnamed EU diplomat appeared to agree with this assessment, telling news agency Reuters that the outcome was \"a clear setback for Brussels\" while noting that issues of fishing and independence had been decisive.\nThe win for the No camp was met with applause from eurosceptics elsewhere.\nReform UK leader Nigel Farage, one of the main proponents of the UK's exit", "translation_ja": "", "vocab": [{"word": "eurosceptic", "definition": "EUの統合に懐疑的であり、EUの権力拡大や政策に反対する立場。欧州懐疑主義者を指す政治用語。"}, {"word": "accession", "definition": "国家が国際機関や同盟に加入すること。EU加盟交渉では、正式な加盟に至るプロセスを指す。"}, {"word": "customs union", "definition": "加盟国間で関税障壁を廃止し、域外国に対して統一的な関税率を適用する経済統合の形態。"}, {"word": "ceding", "definition": "領土や権利などを他国や他者に譲り渡すこと。政治交渉で使用される正式な表現。"}, {"word": "maritime manoeuvres", "definition": "海上での軍事的な活動や演習。通常、軍艦やその他の海軍資産による戦略的な行動を意味する。"}, {"word": "subsume", "definition": "より大きなカテゴリーや組織に含める、統合する。通常、支配下に置くまたは吸収することを意味する。"}, {"word": "setback", "definition": "計画や目標の達成に対する挫折、後退。期待していた進展が得られない状況を指す。"}]}, {"title_ja": "早期釈放受刑者が急速に刑務所に戻っている、刑務所長が警告", "title_en": "Early Release Prisoners Rapidly Returning to Jail, Prison Governors Warn", "summary_ja": "刑務所長らは、2024年の早期釈放制度で釈放された受刑者が急速に再犯と釈放条件違反により刑務所に戻っていると報告している。バーナム首相は10月の早期釈放制度に新たな制限を発表し、違法殺人で有罪となった者を除外することを決めたが、すでに97%の収容率の刑務所に数百人がさらに留置されることになる。", "summary_en": "Prison governors report that inmates released under the 2024 early release scheme are quickly reoffending and returning to jail, creating a 'revolving door' effect that strains facilities. Prime Minister Burnham has announced new restrictions on the October early release scheme, excluding those convicted of unlawful killing, though this will keep hundreds more in already overcrowded prisons at 97% capacity.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c14dlm5e22ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Prisoners freed early are returning to jail at rapid rate, governors tell BBC\n- Published\nPrisoners who were freed under the government's last early release scheme are returning to jail at a rapid rate, prison governors have told the BBC.\nThey say they are seeing the same inmates, who were let out as part of the 2024 early release scheme to ease overcrowding, coming back after reoffending - including for breaching their conditions.\n\"The churn is what stresses me out,\" said one governor in the Midlands, describing it as a \"revolving door\".\nIt comes as Prime Minister Andy Burnham announced changes to the next early release scheme, starting in October, following outrage that the killers of PC Andrew Harper were among those eligible to be released.\nOn Sunday, Burnham announced that they will not be, telling the BBC that anyone convicted of unlawful killing will be excluded from the scheme.\nHe conceded that it means \"hundreds\" more people will stay in prison - as prisons in England and Wales reach breaking point at more than 97% full.\nThe government says there are plans to create more prison space by deporting foreign inmates and releasing some who are serving indefinite sentences, but they are unlikely to create much more space by the time the first batch of inmates are released in October.\nBBC News spoke to three serving prison governors in England to gauge the state of correctional facilities and how staff are dealing with overcrowding. Prison staff are not supposed to speak to the media so their names and the prisons they govern will not be mentioned to protect their identity.\nOne governor from a prison in the north of England said the PM's plans to ease overcrowding \"is all short-term solutions and we need space now\".\n\"Providing additional cells in existing prisons will mean more prison staff needed to monitor that - it's not easy,\" they said, adding that staff shortages mean \"prisoners are not living in a safe and decent environment\".\nThe governor also said they were frustrated by the rate of prisoner recalls, saying: \"We see the same people coming back after being released early and reoffending again, or breaking their [release] rules.\"\n- Burnham gets the early prison release changes he wanted - but at what cost? \n  - Published14 hours ago\n- What's behind having to release some prisoners early? \n  - Published4 August\nThere were 51,419 licence recalls in the year ending March 2026 - when a person is sent back to prison because they breached their release conditions or raised new risk concerns. The number went up from 40,259 in the previous year - a 28% increase.\nAlthough recalls in January to March were slightly lower than the previous three-month period, they remain well above historical levels.\n'The system will grind to a halt'\nAnother prison governor who also works in the north of England told the BBC that something needs to be done about overcrowding and prisoner recalls, or \"the criminal justice system will grind to a halt\".\n\"You release someone to serve the rest of their sentence in the community and you think 'now I have some extra room', but then they're back again and you just go round in circles.\n\"It's a big problem in the [men's prisons] and you worry that this is what will happen again when all these new people are let out.\"\nAs of March this year, more than 70,000 people had been released under the 2024 early release scheme.\nBut there are still almost 87,000 people in prisons across England and Wales - with just over 2,000 spaces remaining. With a backlog in the criminal courts of tens of thousands of cases, prison staff say that simply isn't enough space.\nA rise in gang tensions within prisons is another impact of the overcrowding crisis, one of the governors from the north of England said.\nThey explained that due to the lack of space, more people from different parts of the country are being placed in the same facility, therefore increasing the chances of regional rivalries.\n\"When you've got inmates from Manchester and Liverpool for example, there is a worry there could be gang tension. Or having people from different parts of London could mean an escalation in threat levels because of rival gangs,\" they said.\n\"This has always happened, but it's happening more because so many prisons are full, and so people are sent to prisons far away,\" they added.\nThe lack of space has also led to cells, which are designed to hold one person, being used for two inmates, the other governor from northern England said, which raises \"serious health and safety concerns\".\n\"The single cells are small and they have a workspace for eating and an open toilet... so you're eating and going to the loo in a very small area and then you have to put another person in there and they're doing it all together,\" they said.\n\"Prisons are already dealing with an infestation issue and this could make it worse.\"\nThe BBC understands that work has begun to create more cells in prisons by re-purposing existing spaces, but that is expe", "translation_ja": "", "vocab": [{"word": "licence recalls", "definition": "受刑者が釈放条件に違反したか新たなリスク懸念が生じたため、刑務所に送り返されることを指す法的手続き。"}, {"word": "revolving door", "definition": "人や物が継続的に出入りを繰り返す状況。ここでは受刑者が何度も釈放と再投獄を繰り返すシステムを比喩的に表現している。"}, {"word": "overcrowding", "definition": "施設内に許容量以上の人数が詰め込まれた状態。刑務所の過剰収容問題を指す。"}, {"word": "reoffending", "definition": "釈放後に再び犯罪を行うこと。受刑者が再び法律違反を起こす行為。"}, {"word": "backlog", "definition": "未処理または遅延している案件の蓄積。ここでは刑事裁判所での未決済事件の膨大な数を指す。"}, {"word": "grind to a halt", "definition": "徐々に速度が落ちて完全に停止すること。システムや機関が機能停止する状態を表現するイディオム。"}]}, {"title_ja": "バーナム首相、獄中期間短縮の方針転換を実現——しかし課題は残る", "title_en": "Burnham Secures Early Prison Release Changes Amid Capacity Concerns", "summary_ja": "アンディ・バーナム首相は、数百人の受刑者をより長く投獄し続けるための措置を発表し、数週間前から追求していた目標を達成した。しかし、成人男性受刑施設が既に98%の収容率で稼働している中、これらの変更をどのように実施するかについて疑問が生じている。政府関係者は、立法上の変更と国外追放などの長期的な措置には数ヶ月から数年かかることが見込まれることを認めている。", "summary_en": "Prime Minister Andy Burnham announced measures to keep hundreds of criminals in prison longer, fulfilling a goal he had pursued for weeks. However, the announcement raises questions about how these changes will be implemented, as the prison system is already operating at 98% capacity. Government officials acknowledge that short-term solutions remain unclear, with longer-term measures like legislative changes and deportations expected to take months or years.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cdx5zw4e2x9o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham gets the early prison release changes he wanted - but at what cost?\n- Published\nThe prime minister's announcement that he will keep hundreds of criminals behind bars who would otherwise have been released early is one he has wanted to make for weeks.\nAndy Burnham had already expanded the list of people ineligible for early release and had consistently said he wanted to go further.\nWhat is not clear is exactly what has changed to allow him to do so.\nEarlier this month, the Ministry of Justice warned that exempting any more prisoners risked \"prisons reaching capacity and collapsing\".\nThe prime minister himself previously said he had \"pushed to the very limits of what is possible to do\".\nIn his exclusive interview with BBC Breakfast, Burnham picked out the release of people on controversial indefinite sentences and the deportation of foreign criminals as measures that had made his latest intervention possible.\nIt is understood extra capacity will also be created by immediately beginning work to create new cells in existing prisons.\nBut none of these are short-term solutions.\nEnding indefinite sentences will require new legislation, meaning it could be years before space is freed up.\nPrevious governments have struggled to quickly deport foreign offenders and there are not thought to be any new returns agreements with other countries. The case of grooming gang ringleader Shabir Ahmed, who Pakistan has resisted attempts to deport, is one example.\nRetrofitting prisons to create more cells is also expected to take months.\nPeople in government concede that in the short-term, Burnham will only be able to follow through on today's announcement by making prisons even more full.\nWith the adult male prison estate already running at 98% capacity, it is a move that could worry some in the sector.\nBut in the end, the prime minister believed he simply had to act.\nThe extra exemptions Burnham has announced are being described within government as a \"political decision\".\nThat is not surprising given the intense pressure that had built up, especially around the potential for PC Andrew Harper's killers to be released early.\nBurnham's inner circle are mindful that political misjudgements at the start of Sir Keir Starmer's premiership caused long-lasting damage.\nThey believe Sir Keir never recovered from early rows over freebies and winter fuel payments, and point to a lack of major mishaps in Burnham's first six weeks in office as evidence of a more slick political operation.\nThere was some surprise in Downing Street about how much media attention the issue of early release received over the summer.\nThat is one reason why the prime minister's aides are relishing the new parliamentary term, when news stories come along at a faster rate and so are less likely to linger in the headlines.\nAfter the initial flip-flopping on whether the government would be able to exempt more prisoners, the mother of PC Harper told BBC Breakfast that the handling of the situation had been a \"hash\".\nGovernment officials working on the plans have spoken to the families of victims, who made it clear they did not want the new measures to be dripped out in leaks to the media.\nInstead it was decided one big announcement would be the neatest option.\nIt had seemed likely that would come in the form of a parliamentary statement on Tuesday from the justice secretary.\nInstead, the prime minister decided to make the announcement himself in an interview with BBC Breakfast.\nIt is understood Burnham was mindful of mounting speculation and wanted to give victims and the public as much certainty at the earliest possible opportunity.\nIn doing so, he may have risked the ire of the Speaker Sir Lindsay Hoyle, who is generally disdainful of governments that make major announcements outside of Parliament.\nHe may also have offered up ammunition to the Conservative leader Kemi Badenoch, who has already accused Burnham of being a \"people pleaser\" who finds it difficult to say no to people.\nThat characterisation is likely to be tested again when more stories inevitably appear about the victims of prisoners who will still be released early.\nIt already started on Sunday morning, when the domestic abuse commissioner said she remained \"deeply concerned about the number of abusers\" still set to be freed.\nWhile this is not the first time Burnham has said he has pushed the system to the limit, Whitehall sources are now adamant there will be no more additional exemptions.\nGet in touch\nAre you affected by the early release scheme? Share your views and questions.\nRelated topics\n  - Published1 day ago\n  - Published13 hours ago", "translation_ja": "", "vocab": [{"word": "exempting", "definition": "除外する、免除することを意味する。法律や規制の対象から特定の人や事柄を外すことを指す。"}, {"word": "collapsing", "definition": "崩壊する、システムが機能不全に陥ることを意味する。ここでは獄中システムが処理能力を超えて破綻することを指す。"}, {"word": "indefinite sentences", "definition": "不定期刑、期限が定められていない懲役刑を意味する。刑期が予め決められていない判決形式。"}, {"word": "retrofitting", "definition": "既存の施設に新しい機能や設備を後から追加することを意味する。ここでは既存の刑務所に新しい房を建設することを指す。"}, {"word": "disdainful", "definition": "軽蔑的な、侮蔑的な態度を表す。相手を見下す、つまらないと思う感情を示す。"}, {"word": "ammunition", "definition": "銃弾の意味の他に、比喩的に議論や批判の際に使用できる材料や根拠を意味する。"}]}, {"title_ja": "致命的な火災事件で容疑者1人を釈放、もう1人は取り調べ中", "title_en": "Police Release One of Two Suspects in Fatal House Fire Investigation", "summary_ja": "グレンジタウンの火災事件で殺人容疑で逮捕されていた31歳の男性が不起訴で釈放された。火災では7歳の女児を含む2人が死亡し、現在23歳の男性が取り調べを受けている。", "summary_en": "A 31-year-old man arrested on suspicion of murder in connection with a fatal house fire in Grangetown has been released without further action. Two people, including a 7-year-old girl, died in the blaze, while a 23-year-old man remains in custody for questioning.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c207r26qxwzo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Police release one of two fatal fire suspects\n- Published\nA 31-year-old man arrested on suspicion of murder over a fatal house fire has been released with no further action while a second man, aged 23, continues to be questioned.\nNatalie McDonald, 34, died in the blaze in Grangetown, near Middlesbrough, in the early hours of Wednesday, along with her niece Valentina Foster, seven.\nCleveland Police said a 48-year-old woman had been left in a critical condition in hospital and another three people had injuries that were not life-threatening.\nThe force added enquiries were ongoing.\nNatalie's mother, Lisa Kirton, described her as \"a beautiful soul, who would have done anything for anybody\".\nValentina, who was known as Tina, was staying at the house for the summer holidays and had been \"dancing around the living room\" only the previous night.\n\"She was a cute little kid,\" Kirton said. \"I can't believe it, seven years old - it's just a disgrace.\"\nIn an update on Friday afternoon, Cleveland Police ACC Dave Sutherland said the force was not currently linking the fire to a crash on the A66, in which seven people died, including two police officers.\nFollow BBC Tees on X,, external Facebook, external, Nextdoor and Instagram, external and listen to Radio Tees on BBC Sounds.\nGet in touch\nDo you have a story suggestion for BBC Tees?\nRelated topics\n  - Published3 days ago\n  - Published4 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "arrested on suspicion of", "definition": "～の疑いで逮捕されるという意味。犯罪を犯した可能性があるとして警察に身柄を拘束されることを表す。"}, {"word": "blaze", "definition": "激しく燃える火災のこと。特に制御不能な大火を指す。"}, {"word": "critical condition", "definition": "患者の状態が非常に危険で、生死が危ぶまれる状態。医療用語として使用される。"}, {"word": "enquiries", "definition": "調査や問い合わせのこと。特に警察や公式機関による調査プロセスを指す。"}, {"word": "no further action", "definition": "これ以上の法的措置を取らないという意味。容疑者を釈放する際に使われる。"}, {"word": "linking", "definition": "2つ以上の事柄を関連付けることを意味する。この場合、火災と交通事故の関連性を調べている。"}]}, {"title_ja": "米軍、数週間ぶりにイラン・ララク島を攻撃", "title_en": "US Military Strikes Iran's Larak Island in First Attack in Weeks", "summary_ja": "米軍は日曜日、ホルムズ海峡のイラン・ララク島にあるイラン軍のロケット発射装置を攻撃し、1ヶ月以上ぶりの対イラン攻撃となりました。イスラム革命防衛隊が国際航路に海上地雷付きロケットを発射する準備をしていたのを標的にしました。イランの革命防衛隊は報復を誓っています。", "summary_en": "The US military conducted strikes on Iranian rocket launchers on Larak Island in the Strait of Hormuz on Sunday, marking the first American attack on Iran in over a month. The strikes targeted Islamic Revolutionary Guard Corps forces preparing to launch rockets with sea mines into international shipping routes. Iran's Revolutionary Guard has vowed to retaliate against the attack.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/iran-war-us-military-strikes-iran-s-larak-island/live-78566992?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Iran war: US military strikes Iran's Larak Island\nPublished August 30, 2026last updated August 30, 2026\nWhat you need to know\n- The US conducted its first strikes on Iran in weeks\n- The strikes targeted Iranian rocket launchers on Larak Island in the Strait of Hormuz\n- Iran's Revolutionary Guard has vowed to retaliate against the attack\nRead below for top headlines from the Iran war and other developments in the Middle East region on Monday, August 31, 2026.\nTired of missing our real-time updates? Click here to add us as a Preferred Source on Google. Then tap the \"Star\" or \"Preferred\" to keep DW News at the top of your feed.\nUS redirected dozens of ships to enforce Iran blockade\nUS forces have redirected dozens of ships as part of efforts to enforce a maritime blockade against Iran, the US Central Command said on Sunday night.\nThe US imposed a naval blockade on Iran in April, after Iran blocked most international shipping in the Strait of Hormuz in late February.\n\"As of August 30, CENTCOM forces have redirected 83 commercial vessels, disabled 3 and boarded 2 to ensure compliance with the blockade,\" CENTCOM said on social media.\nUS forces attack Iran for first time in weeks\nUS forces reportedly stuck Iranian military sites in the Strait of Hormuz on Sunday night — the first US strikes on Iran in over a month.\n\"Earlier today, US forces struck two Iranian launchers on Larak Island,\" US Navy Captain Tim Hawkins said in a message to the AFP news agency.\n\"Islamic Revolutionary Guard Corps forces were observed preparing to launch rockets with sea mines into the Strait of Hormuz.\"\nIranian media reported explosions near Larak Island.\nThe US said last week that it had finished clearing Iranian sea mines from the strait's international shipping routes.\nThe IRGC said in a statement that the attack on Sunday night \"will be answered by the sons of Iran and will result in the punishment of the aggressor.\"\nWelcome to our coverage\nWelcome to DW's latest blog on the ongoing hostilities in the US-Iran war.\nUS forces reportedly attacked Iran's Larak Island in the strike on Iranian territory in over a month.\nIran's Revolutionary Guard has vowed respond in a way that \"will result in the punishment of the aggressor.\"", "translation_ja": "", "vocab": [{"word": "blockade", "definition": "敵対国との貿易や通信を遮断するために、ある地域を軍事的に包囲する行為。ここでは米軍がイランへの海上輸送を制限している。"}, {"word": "retaliate", "definition": "相手からの攻撃や不正行為に対して、報復や反撃を行うこと。イランが米国の攻撃に対して反撃することを意味する。"}, {"word": "compliance", "definition": "ルールや指示に従うこと、または従わせること。ここでは米軍が海上封鎖に従うよう商船を強制している。"}, {"word": "maritime", "definition": "海に関連する、または海洋に関する。海上輸送、海上戦闘、海上法などで使用される用語。"}, {"word": "aggressor", "definition": "最初に攻撃を仕掛ける者、または侵略者。イランの声明では米国を攻撃者と呼んでいる。"}, {"word": "hostilities", "definition": "敵対的な行動や武力紛争。戦闘状態や対立関係を指す正式な用語。"}]}, {"title_ja": "ファクトチェック：ドイツ首相メルツが難民削減と経済成績を過大主張", "title_en": "Fact Check: German Chancellor Merz Overstates Asylum and Economic Records", "summary_ja": "ドイツのメルツ首相はARDの夏のインタビューで複数の誤解を招く主張をしました。難民申請の削減率を60%以上と主張しましたが、実際の数字は35～46%の減少です。事実確認委員会は、彼の債務水準と気候政策に関する説明も異議を唱え、格付けと二酸化炭素排出量に関する彼の声明が選別されているか不完全だと判断しました。", "summary_en": "Chancellor Friedrich Merz made several misleading claims during an ARD summer interview, including overstating asylum reductions to over 60% when actual figures show 35-46% decreases. Fact-checkers also disputed his characterizations of Germany's debt levels and climate policies, finding his statements on credit ratings and CO2 emissions selectively framed or incomplete.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/fact-check-germany-s-merz-misstates-record-in-ard-interview/a-78566319?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Fact check: Germany's Merz misstates record in ARD interview\nAugust 30, 2026\nAs part of an annual tradition, Chancellor Friedrich Merz sat down with public broadcaster ARD on Sunday evening for a wide-ranging summer interview. Amid drooping poll numbers, Merz tried to use the interview to tout his government's work on economic, migration and energy policy.\nAt the same time, Merz made a number of misleading claims, often overstating his administration's work and misrepresenting climate science.\nDW Fact check, in collaboration with colleagues across the ARD fact-checking network, reviewed Merz's interview live.\nDid Merz cut asylum numbers by 60%?\nClaim: \"One of the main issues in the last federal election campaign was the migration crisis, and together with the federal government, we've been able to reduce the numbers by over 60% in just over a year.\"\nVerdict: Misleading\nThis is misleading for several reasons — it is both questionable what exactly Merz meant by migration, and also not clear to which period he is referring.\nThe number of asylum-seekers in Germany has fallen significantly, but not to the extent Merz said. According to the Federal Office for Migration and Refugees (BAMF), a total of 56,547 asylum applications were filed in the first half of 2026, including 39,646 first-time applications. Compared with the same period last year, the number of first-time applications fell by 35.4% — significantly less than the figure cited by Merz. Comparing the number of initial asylum applications for the second half of 2025 and the first half of 2026 with the same period of the previous year, the number of initial asylum applications fell from 169,671 to 91,546 – a decrease of 46 percent.\nComparing individual months reveals significant fluctuations: In July 2026, the number of initial asylum applications, at 4,311, was even around 48 percent lower than in the same month of the previous year. A decline of almost 60 percent was recorded only once, inAugust 2025 compared to August 2024, when looking at individual months since Merz took office .\nIn addition, the downward trend began even before the Merz government took office in May 2025. After the fall of Syrian ruler Bashar Assad in December 2024, the number of asylum-seekers in Germany declined. At the European level, the number of asylum applications also fell in the first half of 2025.\nOfficial statistics also show a decline in general migration. According to the Federal Statistical Office, around 235,000 more people immigrated to Germany in 2025 than emigrated. This means that net immigration was 45% below the previous year's figure of 430,000 people. But that's mostly due to the number of arrivals falling, while the number of departures remained almost stable.\nGermany's debt, in context\nClaim: \"We are still one of the least indebted countries in Europe. We are still a country that has by far the best credit rating of any European nation. No one doubts the debt sustainability of our country or our economy; we are operating within reasonable limits here.\"\nVerdict: Misleading\nThere are three important ways to measure how much debt EU countries hold: debt-to-GDP ratio, deficit spending and credit rating.\nOn the first — debt-to-GDP ratio, or how a country's total debt compares to its annual economic output — Germany receives a failing grade. The eurozone requires countries to keep this ratio below 60%. Germany and 11 other countries are above that limit, versus 15 countries which are in compliance, putting Germany smack in the middle of the eurozone.\nOn the second — government deficits, or a country's net borrowing — Germany is just scraping by. The eurozone asks its members to keep this figure below 3%. Germany's net borrowing is at 2.7%, joining 16 other countries that are also below the limit. Of the 17 countries that meet that requirement, Germany comes the second closest to hitting the 3% limit.\nAs for credit rating — a grade from investors on how likely a country is to repay its debts — Germany does indeed earn the highest marks possible. But it shares that grade with several other countries. There are only 11 countries in the world with an AAA rating from S&P: Germany joins Denmark, Liechtenstein, Luxembourg, the Netherlands, Norway, Sweden and Switzerland in earning the grade.\nIn 2009, Germany amended its constitution by adding a so-called \"debt brake,\" mandating the government to keep deficits to 0.35% of GDP. In 2020, that restriction was suspended to deal with the COVID pandemic and then again in 2022 and 2025 to allow for an increase in defense spending.\nReal CO2 balance of electric cars\nClaim: \"At the European level, the issue with internal combustion engines has nothing to do with CO2 emissions. We want climate-friendly and climate-neutral cars, but we don't want to dictate the technology — it's not up to politicians to decide that. What matters is how much CO2 such a car emits, and the CO2 balance of electric mobility isn't as rosy as it's often po", "translation_ja": "", "vocab": [{"word": "misrepresenting", "definition": "事実と異なる方法で情報や状況を説明または表現すること。政治的な発言や報告において、意図的に誤った印象を与えるために使用されます。"}, {"word": "debt-to-GDP ratio", "definition": "国の総債務を年間経済生産高（GDP）で割った値で、国の経済規模に対する債務水準を示す重要な経済指標です。"}, {"word": "deficit spending", "definition": "政府が収入より多く支出し、その不足分を借金で補う財政状況。赤字財政とも呼ばれます。"}, {"word": "eurozone", "definition": "ユーロを公式通貨として採用しているEU加盟国のグループ。これらの国は共通の金融政策と財政規則に従います。"}, {"word": "sustainability", "definition": "長期間にわたって維持・継続できる状態のこと。債務の持続可能性は、国が将来も借金を返済できるかどうかを示します。"}, {"word": "internal combustion engine", "definition": "ガソリンやディーゼルなどの燃料を燃焼させてエネルギーを生み出すエンジン。従来の自動車に使用されます。"}]}, {"title_ja": "メルツ首相、AfD支配下のザクセン・アンハルト州での「問題」を警告", "title_en": "Merz Warns of 'Problems' in Saxony-Anhalt Under AfD", "summary_ja": "ドイツのメルツ首相は、来週の州選挙で極右政党AfDが勝利した場合、ザクセン・アンハルト州が深刻な経済・外交的問題に直面するだろうと予測し、国際投資家がこの地域を避けるだろうと警告した。メルツは有権者を過激派政党から遠ざけるため、州内で2度キャンペーンを行うことを約束した。またドイツはNATOとEUの同盟国と協調してロシアのハイブリッド脅威に対応する計画を発表した。", "summary_en": "German Chancellor Friedrich Merz predicted significant economic and diplomatic problems for Saxony-Anhalt if the far-right AfD wins next week's state election, warning that international investors would avoid the region. Merz pledged to campaign twice in the state to persuade undecided voters away from extremist parties. Germany also announced plans to respond to Russian hybrid threats in coordination with NATO and EU allies.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/germany-news-merz-warns-of-problems-in-saxony-anhalt-under-afd/live-78555302?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Germany: Merz warns of 'problems' in Saxony-Anhalt under AfD\nPublished August 29, 2026last updated August 30, 2026\nWhat you need to know\n- Merz predicts 'significant problems' for Saxony-Anhalt under AfD\n- Merkel calls on Germans to 'fight for this democracy'\n- German politicians call for ban on radical AfD state branches\nHere is a roundup of top stories from and about Germany on Saturday, August 29, and Sunday, August 30.\nTired of missing our real-time updates? Click here to add DW as a Preferred Source on Google.\nGamescom attendance comes close to record high\nThe international video games trade fair Gamescom came to a close in the western German city of Cologne on Sunday after being attended by an almost record number of visitors.\nAround 368,000 gamers attended the event, 11,000 more than in 2025 and 33,000 more than in 2024. The record attendance of 373,000 set in 2019 wasn't quite reached — but Gamescom is getting closer.\nDigital reach was once again substantial, with various online formats recording 624 million views worldwide — roughly the same number as before. On the ground in the sprawling halls of Cologne's trade fair, there were 1,743 physical exhibitions — a significant increase on last year (1,568).\n\"Gamescom has solidified its position as the biggest event in the gaming world,\" said Felix Falk, Managing Director of the industry association Game.\n\"At the same time, the unique atmosphere and enthusiasm on site demonstrated how games forge a strong, creative, and diverse community out of people from all walks of life,\" he added.\nMerz: Germany to respond to hybrid threats 'in coming days'\nGerman Chancellor Friedrich Merz has said that Germany will respond to Russian hybrid threats in the coming week — in coordination with international allies.\n\"We're largely in agreement within the government as to how to react and we will make this known in the coming days,\" he told public broadcaster ARD as part of Sunday's summer interview.\nThe Chancellor's remarks come following the recent drone attack on Leipzig/Halle Airport. While an explosive-laden drone failed to detonate on August 5, the incident has put Germany's security and defense infrastructure in the spotlight.\nAsked whether Germany was in any position to respond to such threats in an appropriate manner, Merz responded: \"Let's wait and see what we mean by an appropriate response.\"\nEither way, he continued, any German response will be coordinated with allies. \"Our European Union and NATO partners will not be surprised,\" he said.\nMerz predicts 'significant problems' for Saxony-Anhalt under AfD\nElection victory for the far-right Alternative for Germany (AfD) in Saxony-Anhalt next week would do serious damage to the eastern German state, according to Chancellor Friedrich Merz.\n\"Should it come to that, this state would face significant problems,\" Merz told public broadcaster ARD in his annual summer interview.\n\"I cannot imagine that international investors would want to be seen attending the first spades in the ground for new factories or businesses in Saxony-Anhalt alongside an AfD state premier,\" he said.\nAccording to the latest polls ahead of next Sunday's vote, the AfD maintains a commanding lead with 40% — far ahead of Merz's conservative Christian Democratic Union (CDU) with 23%, the Left Party (13%), the Social Democrats (SPD) (9%) and the Greens (6%).\nMerz said he would be appearing twice himself in Saxony-Anhalt over the coming week in order to convince undecided voters (which still make up a good 20% of the electorate, according to polls) not to vote for the far-right.\n\"We will do everything we can to prevent Saxony-Anhalt falling to extremists,\" he said, adding: \"And that applies to the Left Party, too.\"\nAsked how the CDU intended to form a coalition government in Saxony-Anhalt with such low ratings and while refusing to work with either the AfD or the Left Party, Merz said: \"We will look at that once we have the results.\"\nThe current state premier, Sven Schulze (CDU), however, has expressed a willingness to form a coalition with the SPD, Greens and the Left Party.\nHockey: Germany's men retain World Cup title\nGermany retained their men's field hockey World Cup title with a hard-fought 1-0 victory over Spain in Sunday's final in Wavre, Belgium. The triumph secured Germany's fourth World Cup crown, moving them level with Pakistan as the tournament's joint-record winners.\nMichel Struthoff scored the decisive goal in the 44th minute, beating the Spanish goalkeeper to turn the ball into the net and give Germany the lead. Spain pushed for an equalizer, but Germany's disciplined defense held firm through the closing stages.\nGoalkeeper Jean-Paul Danneberg was instrumental in preserving the advantage, making several crucial saves and keeping out all four of Spain's penalty corners. Germany, who are also the reigning European champions, absorbed increasing pressure late in the match to see out the victory.\nThe title adds to Germany's previous World Cup", "translation_ja": "", "vocab": [{"word": "hybrid threats", "definition": "従来の軍事的脅威と非軍事的脅威（サイバー攻撃、情報操作、インフラ破壊など）を組み合わせた複合的な安全保障上の脅威のこと。現代の国家間紛争で使用される戦術。"}, {"word": "commanding lead", "definition": "圧倒的な優位性や大きなアドバンテージを持つことを意味する表現。選挙や競争などの文脈で、他者と大きく差をつけている状態を示す。"}, {"word": "coalition government", "definition": "単一の政党が議席の過半数を占めない場合に、複数の政党が協力して樹立する政府のこと。安定性を確保するための政治体制。"}, {"word": "retain", "definition": "タイトルや地位などを保持し続ける、失わないという意味の動詞。前回のチャンピオンが再び優勝する場合などに用いられる。"}, {"word": "disciplined defense", "definition": "組織的かつ規律正しく実行される防御戦術のこと。スポーツの試合で相手のプレーに秩序をもって対抗する防御方式を指す。"}, {"word": "extremists", "definition": "極端な思想や行動を持つ人々を指す名詞。民主主義や主流の政治から大きく外れた過激派や原理主義者を指すことが多い。"}]}, {"title_ja": "米軍がイラン2カ所のロケット発射地点を攻撃、ホルムズ海峡が紛争の焦点に", "title_en": "US Forces Strike Iranian Rocket Launch Sites; Strait of Hormuz Remains Flashpoint", "summary_ja": "米軍がイラン2カ所のロケット発射地点に対して攻撃を実施し、両国間の緊張が激化している。ホルムズ海峡が紛争における主要な火種であり続けている。今回の攻撃は進行中の地域緊張における重大な軍事行動を示している。", "summary_en": "US military forces have conducted strikes against two Iranian rocket launch sites in an escalation of tensions between the two nations. The Strait of Hormuz continues to serve as the primary area of conflict concern. The strikes represent a significant military engagement in the ongoing regional tensions.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates/?id=135895428", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間速報ニュース放送", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、世界中の速報ニュースとライブイベントを24時間体制でカバーしています。視聴者は主要なストーリーの最新情報をリアルタイムで受け取ることができます。ABCニュースの特派員による包括的なニュース報道を提供しています。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. Viewers can access up-to-the-minute reporting on major stories as they develop. The platform offers comprehensive news updates from ABC News correspondents worldwide.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドリー・パートン、ナッシュビルで密葬される", "title_en": "Dolly Parton Laid to Rest in Private Nashville Burial", "summary_ja": "カントリーミュージックの伝説ドリー・パートンが、死去後ナッシュビルで密葬されました。グランド・オール・オプリーは、彼女の逝去から数日後に象徴的なパフォーマーを追悼し、カントリーミュージック界での彼女の卓越した遺産を祝いました。", "summary_en": "Country music legend Dolly Parton was buried in a private ceremony in Nashville following her death. The Grand Ole Opry honored the iconic performer days after she passed away, celebrating her extraordinary legacy in country music.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Culture/dolly-parton-laid-rest-private-nashville-burial/story?id=136074943", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スーダン内戦：エルオベイド難民都市が劣悪な状況に直面", "title_en": "Sudan's El Obeid faces dire conditions as war displaces thousands daily", "summary_ja": "スーダン内戦により、7月以来15,000以上の家族がエルオベイドに逃げ込み、今年前半に到着した200,000人と合流している。過密状態にある都市と周辺キャンプは食料、水、医療用品の深刻な不足に直面しており、ドローン攻撃と暴力の継続により人道状況が悪化している。食料価格は過去1年間で2倍以上に上昇し、最近の攻撃で破損した重要インフラは修復されないままである。", "summary_en": "Over 15,000 families have fled to El Obeid since July, joining 200,000 displaced earlier this year amid Sudan's ongoing civil war. The overcrowded city and surrounding camps face severe shortages of food, water, and medical supplies, with humanitarian conditions deteriorating as drone strikes and violence persist. Food prices have more than doubled in the past year, and critical infrastructure damaged by recent attacks remains unrepaired.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/30/humanitarian-crisis-worsening-refuge-civilians-sudan-el-obeid", "state_media": false, "category": "政治", "full_text": "Humanitarian conditions in the Sudanese city of El Obeid and two camps on its outskirts are dire and deteriorating, according to people on the ground, as civilians displaced by fighting between the Sudanese Armed Forces and Rapid Support Forces (RSF) militia continue to pour in from the surrounding countryside.\nThe UN says more than 15,000 families have arrived since mid-July, joining more than 200,000 people who arrived in the first half of the year, according to government figures cited by Save the Children.\n“The situation is very harsh and is deteriorating as El Obeid is receiving IDPs [internally displaced people] on a daily basis … The city is shockingly overcrowded,” said Maryam, a humanitarian volunteer whose name has been changed for her safety.\nThe new arrivals came on foot, carrying almost nothing, she said. “They also suffer from a shortage of food and they definitely arrive traumatised.”\nThe city, the capital of North Kordofan province, was home to around half a million people before the war broke out more than three years ago.\nWhile many of the new arrivals have been absorbed into the city, tens of thousands are living in two main tented camps. According to analysis of satellite data by the Yale Humanitarian Research Lab, 800 new tents appeared in one of the camps between 4 and 25 August.\n“During my visit, I saw 450 arrivals coming from the surrounding villages just that morning,” said Paul Byars, the Sudan country director for the Danish Refugee Council, who was in El Obeid last week. “The authorities’ estimates are correct, that 85% of them are women and children. Most of the men are staying behind because this is the only time for farming.”\nCivil war erupted in Sudan’s capital, Khartoum, about 250 miles (400km) north-east of El Obeid, on 15 April 2023, when a power struggle between the armed forces and RSF descended into open conflict.\nSince then, about 11.3 million people have been displaced, more than a fifth of the population. Some parts of the country, including El Obeid and surrounding areas, are at risk of famine.\nEstimates of the number of people killed in the war range from tens to hundreds of thousands. More than 10,000 people are thought to have been massacred by the RSF in El Fasher over two days when they seized the city in Sudan’s western Darfur region in October 2025 after an 18-month siege.\nA surge in RSF drone strikes on El Obeid and nearby areas in June led the UN to warn that the city could face a repeat of what happened in El Fasher.\nThe number of strikes has since fallen. The armed forces also recaptured a key road leading north to Khartoum in late July, which at least partly lifted the threat of besiegement. However, drones are still killing and injuring civilians, while violence rages in the surrounding districts, pushing people to the city.\nRecently, volunteers in El Obeid had noticed more “double-tap” drone strikes, where a second drone follows the first, hitting rescuers at the scene, Maryam said. “It is hard, so hard, living with this, hearing the sound of a drone hitting somewhere,” she said. “It’s very disturbing.”\nSudan’s civil war has become dominated by drones, accounting for half of all violent incidents, up from 4% at the start of the war, said Nohad Eltayeb, who monitors Sudan for Acled, a conflict tracking group.\nBoth sides used drones, but the RSF’s usage had become more volatile since the US war with Iran began to interrupt supply lines in February, she said. “They rely on fewer, very targeted strikes.”\nSo far this year, there have been 322 incidents of violence affecting civilians in the wider Kordofan region, compared with 388 for the whole of 2025, according to Acled data. While the RSF was responsible for half of those, the SAF has also killed and injured civilians. On 10 August, armed forces and an allied militia killed five civilians and injured 10 about 60 miles north-east of El Obeid, according to Emergency Lawyers, a non-governmental group.\nWith the threats to delivery trucks, food prices have rocketed. In north Kordofan in July, according to World Food Programme data, a litre of groundnut oil cost 17,000 Sudanese pounds (£21), up from 13,000 in June and 7,700 a year ago. The prices of wheat flour and goat and sheep meat have also more than doubled in the last year.\nMeanwhile, El Obeid’s power and water infrastructure still has not fully recovered from RSF drone strikes in June.\n“The main problem is the big [water] source that is in the north of the city has been severely damaged and it has not been repaired,” said Esperanza Santos, an emergency coordinator in Sudan for Médecins Sans Frontières. “The water pipes in the city have [also] been impacted. So mostly, both in the city – for example, in the hospital – and also in the IDP camps, they are relying on water trucking and it’s not enough.”\nConditions in the camps were poor too, Santos said. “In terms of sanitation, it’s very, very bad. It’s not enough. The ratio of latrines per person is impos", "translation_ja": "", "vocab": [{"word": "deteriorating", "definition": "悪化している、低下している状態。時間とともに状況が悪くなっていくプロセスを表す。"}, {"word": "internally displaced persons (IDPs)", "definition": "国内避難民。紛争や災害により自国内で強制的に移動させられた人々を指す国際的な用語。"}, {"word": "volatile", "definition": "不安定で予測不可能な。急激な変動や激変を示す状態を表す技術用語。"}, {"word": "besiegement", "definition": "包囲、封鎖。都市や地域を軍事的に取り囲み、出入りを遮断する状態。"}, {"word": "famine", "definition": "飢饉、大飢饉。食料不足により多くの人々が飢える深刻な状況。"}, {"word": "infrastructure", "definition": "インフラストラクチャー、基盤施設。水道、電力、道路などの社会の基本的な施設のこと。"}]}, {"title_ja": "ウィーン美術館から盗まれたエジプト王妃の673ダイヤモンド製ネックレス", "title_en": "Egyptian Queen's 673-Diamond Necklace Stolen in Vienna Museum Heist", "summary_ja": "ウィーン応用美術館で、エジプト王妃ナズリー元王妃が所有していた200カラットのプラチナネックレス（673個のダイヤモンド付き）が盗まれた。2人の容疑者が営業時間中にハンマーでガラスケースを割り、盗難品を持ち去った。この事件は、ヨーロッパ全域で急増する美術館強盗の波の一部である。", "summary_en": "Two suspects stole a 200-carat platinum necklace with 673 diamonds from Vienna's Museum of Applied Arts during a daytime smash-and-grab raid. The piece, once owned by Egyptian Queen Consort Nazli and worth $4.3 million, was on loan for a Van Cleef & Arpels exhibition. The theft is part of a growing wave of high-profile museum robberies across Europe.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/artanddesign/2026/aug/28/egyptian-queen-diamond-necklace-stolen-vienna-raid", "state_media": false, "category": "社会", "full_text": "Austrian police are hunting two men alleged to have stolen a 200-carat platinum necklace encrusted with 673 diamonds that was on loan to a museum in Vienna and once belonged to Egyptian royalty.\nAuthorities in the capital released pictures of the suspects captured by security cameras during the heist at the Museum of Applied Arts (MAK), amid a rash of spectacular smash-and-grab thefts from European cultural institutions.\nThe unmasked men bought tickets to the exhibition before shattering a glass display case with a hammer during opening hours on Thursday afternoon and making off with the diamond necklace.\nIn an appeal for information from the public, police said: “The perpetrators fled with the jewellery in an unknown direction.”\nOfficers fanned out through the city centre and deployed a police tracking dog to search for the suspects. The Kronen newspaper said investigators believed the men were probably carrying out a “contract job” on behalf of a criminal gang.\nMAK said the piece had been snatched from a jewellery exhibition that had been on display since June, featuring more than 300 works by the French designers Van Cleef & Arpels. No one was hurt, although there were several witnesses in the room at the time.\nDocumentation for the show said the necklace once belonged to Queen Consort Nazli of Egypt, who wore it at the 1939 wedding of her daughter Fawzia to Iran’s then crown prince, Mohammad Reza Pahlavi, who later became shah. The necklace was sold by Sotheby’s in New York in 2015 for $4.3m.\nThe MAK said the exhibition brought together about 200 “unique and rarely seen objects” from its own collection and pieces spanning the 120-year history of the Parisian jewellery house, from the Van Cleef & Arpels patrimonial collection.\nA guided tour planned for Friday afternoon was listed as “cancelled” on the museum website and the exhibition, which was due to end on 27 September, was temporarily closed.\nEuropean museums have been hit by a string of high-profile heists since thieves broke into the Louvre museum in Paris during the day last October and escaped within minutes with crown jewels worth €88m.\nIn Spain on Thursday, thieves raided the Treasure of Villena, a collection of bronze age gold artefacts described as one of Europe’s most important prehistoric hoards.\nThis month, four of the most important works by the 15th-century Renaissance master Antonello da Messina were stolen during a national holiday from a museum in the Sicilian port city of Messina.\nTwo days earlier, Italian police said they had recovered three paintings by the French masters Paul Cézanne, Pierre-Auguste Renoir and Henri Matisse that were taken this year from a private museum near the northern city of Parma.\nA report by Europol this month found that robberies at European museums are becoming increasingly violent, with thieves sometimes brandishing guns, assaulting staff and using sledgehammers, axes and even explosives to smash their way to targeted loot.", "translation_ja": "", "vocab": [{"word": "smash-and-grab", "definition": "短時間でショーウィンドウなどを壊して商品を盗む強盗行為。素早さが特徴の窃盗犯罪スタイル。"}, {"word": "heist", "definition": "大胆で計画的な盗難事件、特に価値のある品物を対象とした強盗。映画や報道でよく使われる。"}, {"word": "perpetrators", "definition": "犯罪や悪行を実行した人物、犯人。刑事事件や公式な文脈で使用される。"}, {"word": "contract job", "definition": "依頼人からの指示で実行される仕事、特に犯罪組織が外部の者に依頼する犯行を意味する。"}, {"word": "patrimonial", "definition": "家族や組織が代々受け継いできた財産や遺産に関する。文化的・歴史的遺産を指すことが多い。"}, {"word": "hoard", "definition": "貴重品や金品を蓄積・隠蔵したもの。考古学では埋蔵されていた品物の集合体を指す。"}, {"word": "brandishing", "definition": "武器を威嚇的に振り回す、示す行為。暴力や脅迫を伴う犯罪で使用される表現。"}]}, {"title_ja": "メタの米国和解：国内での勝利、世界的な課題は未解決のまま", "title_en": "Meta's US Settlement: Victory at Home, Questions Remain Globally", "summary_ja": "メタは29の米州との訴訟を18億ドルで和解し、児童のプラットフォーム使用制限と安全機能の実装に同意した。しかし、ケニアなど他国での類似事件は未解決のままで、民主主義を形作るメタのグローバルな説明責任とアルゴリズムの責任に関する問題が浮き彫りになっている。", "summary_en": "Meta settled a lawsuit with 29 US states for $18bn, agreeing to limit children's platform usage and implement safety features. However, similar cases in other countries like Kenya remain unresolved, raising questions about Meta's global accountability and algorithmic responsibility in shaping democracy worldwide.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/technology/2026/aug/28/meta-facebook-us-lawsuit-settlement-world-impact", "state_media": false, "category": "政治", "full_text": "In October 2021, Abrham Meareg’s father, a professor of chemistry in Ethiopia’s northern town of Bahir Dar, was shot at close range and died outside his family home. This was in the middle of the country’s civil war.\nFor weeks, Facebook’s algorithm had actively promoted posts calling for the academic to be murdered, according to Meareg and Foxglove, a nonprofit organisation supporting Meareg’s lawsuit against the company in Kenya. These posts included photos of his father and his home address.\nMeareg filed the lawsuit in 2022. He said he repeatedly asked Facebook to remove the posts and the company did nothing. Nearly four years later, the case has still not been heard. Foxglove said Meta, Facebook’s parent company, had “fought tooth and nail to avoid responsibility”.\nMeareg said: “It’s a matter of numbers to them, a matter of statistics. It has been proven multiple times that our lives do not matter to them.”\nOn Wednesday, Meta settled a lawsuit brought by 29 US states who argued it had designed addictive products that hooked young people. The social media company agreed to pay $18bn and to change certain features of its platform in the US. California’s attorney general said it was a victory that would make “a world of difference for children and their families”.\nBut elsewhere in the world, in jurisdictions as far flung as Amsterdam and Nairobi, other claims have yet to be heard. Far bigger questions about the power of a single US technology company to shape politics and democracy everywhere on Earth are still to be answered.\nFor the US, the settlement is a victory. A jury has done what the US Congress could not – put controls on a powerful tech company. As a part of the settlement, Meta has said it will set time limits on children’s use of its platforms Facebook and Instagram and block night-time usage.\nFor Meta, the settlement is also a victory. Its share price rose in the hours after the deal was announced. Its CEO, Mark Zuckerberg, was not forced to testify. The sum it is to pay, while not meaningless, is far less than the states had sought – $200bn – or the amount Meta itself had suggested in a court filing it might have to pay, which was up to $1.4tn.\nFor the rest of the world, however, the picture is more mixed. The limits Meta will put on its US platform are, in large part, similar to limits the UK and Australia have already achieved through regulation. There are certain concessions Meta has now made that other governments could also demand: for example, while the UK plans to ban under-16s from social media platforms, it may wish to ask Meta to impose a default daily use limit of two hours for under-18s, which is what the company has agreed to in the US.\nNone of this meaningfully changes the equation for Meareg or what his case represents, which is that a massive US company, unaccountable to voters, unbound by transparency requirements, owns a worldwide digital commons that shapes reality for billions of people.\nWhether courts and governments outside the US have the power to confront this fact is a far thornier question.\nThe central issue of Meareg’s case is Meta’s algorithm. This is the system that decides what content to show users of Facebook and Instagram. It sees you linger over a video about knitting sweaters, for example, and then decides you’ll like one about how to care for your spider plant.\nIt sees teenage girls watch diet content and shows them anorexia influencers. It sees young men search for bodybuilding content and shows them Andrew Tate. It is alleged to have amplified content that promoted the ethnic cleansing of the Rohingya in Myanmar. It contributed to the election victory of Donald Trump.\nMeareg’s lawsuit rests on the claim that this algorithm promoted the posts that called for the death of his father, and that Facebook’s sparse moderation in east Africa did almost nothing to prevent this.\nIn the early days of the Meta trial in the US, it seemed plausible that states would push the social media firm to finally make some changes to this algorithm. Those changes had the potential to fundamentally alter how the company does business. Meta’s algorithm is intended to keep users scrolling, stuck on the platform, and then it shows them ads.\nBut that is not what appears to have happened. The terms of the settlement will slightly change what is shown to minors, in that they will not necessarily have personalised feeds. But it is hard to see this concession changing the equation in war zones or creaking democracies.\nArturo Béjar, an ex-Facebook employee and whistleblower, said the limitations were “the equivalent of saying: ‘Well, you can smoke as many cigarettes as you can in two hours a day.’ It doesn’t make the cigarettes any safer.”\nIt may be up to groups and individuals elsewhere in the world to try to push for these larger changes. It will be an uphill struggle.\nIn Kenya, the high court recently ruled that Meareg’s case against Meta could go ahead, after years of legal manoeuvring", "translation_ja": "", "vocab": [{"word": "algorithm", "definition": "ユーザーに表示するコンテンツを決定するコンピューター・プログラムの計算手順。メタの場合、ユーザーの行動を分析して関心のありそうな投稿を自動的に表示する仕組みを指す。"}, {"word": "settlement", "definition": "訴訟を裁判による判決ではなく、当事者間の合意で解決すること。通常、金銭支払いと条件変更を含む。"}, {"word": "accountability", "definition": "企業や組織が自らの行動に対して責任を負い、説明する義務。権力を持つ組織が市民や利害関係者に対して果たすべき責務。"}, {"word": "transparency requirements", "definition": "企業がその事業内容や意思決定プロセスを公開し、外部から監視可能にすることを求める規制。民主的な監督を可能にするための要件。"}, {"word": "amplified", "definition": "アルゴリズムが特定のコンテンツをより多くのユーザーに表示することで、その影響力を拡大させること。社会的な影響を大きくする。"}, {"word": "moderation", "definition": "オンライン・プラットフォームで違法または有害とされるコンテンツを削除・制限する監視活動。ソーシャルメディアの安全管理プロセス。"}]}, {"title_ja": "バルセロナのラミネ・ヤマル選手、トップレベルへの復帰が進行中とフリック監督が語る", "title_en": "Barcelona's Lamine Yamal Returning to Top Form, Coach Flick Says", "summary_ja": "バルセロナのハンジ・フリック監督は、19歳のウィンガー、ラミネ・ヤマル選手がシーズン開幕のエルチェ戦では苦戦したものの、アスレティック・ビルバオ戦では改善されたと述べ、最高のパフォーマンスへの復帰が進んでいることを示唆しました。フリック監督は、スペインの選手の最近のハムストリング損傷とワールドカップ参加を認め、木曜日の試合で断片的に素晴らしいプレーを見せたと述べています。監督はヤマル選手の回復に自信を示し、才能あるウィンガーへのチームのサポートを強調しました。", "summary_en": "Barcelona coach Hansi Flick indicated that 19-year-old winger Lamine Yamal is regaining his best form after struggling in the season opener against Elche but improving against Athletic Bilbao. Flick acknowledged the Spanish player's recent hamstring injury and World Cup participation, noting he performed well in patches during Thursday's match. The coach expressed confidence in Yamal's recovery and emphasized the team's support for the talented winger.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/8/30/lamine-yamal-getting-back-to-top-level-barcelona-coach-flick-says?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Lamine Yamal getting back to ‘top level’, Barcelona coach Flick says\nTeenager struggled in Barca’s La Liga start at Elche but improves against Athletic Bilbao, according to Hansi Flick.\nBarcelona coach Hansi Flick has indicated that teenage star Lamine Yamal is finding his way back to his “top level” before Monday’s La Liga clash against Rayo Vallecano.\nThe 19-year-old struggled in Barca’s first match of the season at Elche but improved against Athletic Bilbao in the second, Flick said, although he did not find the net.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Can Barca do a ‘three-peat’ or will Real bounce back? La Liga returns\n- list 2 of 4La Liga: Five key talking points heading into Barcelona’s 2026-27 season\n- list 3 of 4Raphinha scores again as Barcelona ease past Athletic Club in La Liga\n- list 4 of 4Barcelona scraps Spain World Cup tribute amid fans’ Catalan flag support\n“I know everyone is worried about how is Lamine, how is he doing. And of course, look at his situation – he played a World Cup after a huge injury,” Flick told reporters on Sunday.\nFlick said the Spanish World Cup winner is returning to his best, which Yamal has not hit since suffering a hamstring injury in April.\nThe winger returned at the World Cup but, despite Spain’s success, had limited individual impact at the tournament.\n“Now he’s coming back after three weeks holiday, and also the first game maybe was not his best game.\n“But I said this, I was very happy that he starts the game and he worked for the team.”\nYamal disappointed in the first half against Athletic on Thursday but stepped up a gear after the break.\n“He played 90 minutes against Bilbao. And for him at the moment, it’s also good to [have] 90 minutes on the pitch,” Flick continued.\n“We saw him in some situations really on this top level. And now, you couldn’t see this in the training today, but I saw it, and it was excellent.\n“Everyone loves Lamine, and he’s in a good way. And we have to support him, and we do that.”\nYamal seemed in a bad mood after the game against Elche but happier in training before the Rayo clash.\n“Of course, it’s always good when the players are smiling, but it’s not every day the same way,” Flick added.\n“I’m also not smiling every day. It’s like that.”\nBarca won both of their opening fixtures with Raphinha playing as a makeshift number nine after the champions were unable to land top target Julian Alvarez from Atletico Madrid.\n“Of course, I’m happy with my team. [Sporting director] Deco is working on that to strengthen the team. We don’t have pressure,” Flick said, reiterating he is content with the players available to him if Barca don’t sign a new striker.", "translation_ja": "", "vocab": [{"word": "hamstring injury", "definition": "太ももの裏側の筋肉（ハムストリング）の損傷のことで、アスリートが経験する一般的なスポーツ外傷です。復帰に時間がかかることが多くあります。"}, {"word": "makeshift", "definition": "本来の目的とは異なる一時的な代替手段や方法のことです。ここではラファイーニャが正規のストライカーではなく一時的に代わりを務めていることを示しています。"}, {"word": "reiterating", "definition": "同じことを何度も繰り返して述べることです。強調や確認のため、既に述べた内容をもう一度言うことを意味します。"}, {"word": "top target", "definition": "最優先の獲得候補選手のことで、クラブが特に欲しいと考えている選手を指します。ここではフリック監督が最も署名したい選手を意味しています。"}, {"word": "patch", "definition": "一時的な期間や局面のことで、特に良い状態や悪い状態が限定的に続く期間を表します。スポーツでは試合中の特定の時間帯を指すこともあります。"}]}, {"title_ja": "ガザでのイスラエル軍の攻撃により3歳の子どもを含む2人が死亡", "title_en": "Israeli Strike Kills 3-Year-Old Child in Gaza", "summary_ja": "ガザのデイル・アル・バラにおけるイスラエル軍の攻撃で、3歳の子どもを含むパレスチナ人2人が殺害されました。休戦が宣言されているにもかかわらず、攻撃は続いており、休戦開始以来1,300人以上のパレスチナ人が殺害され、4,300人以上が負傷しています。", "summary_en": "An Israeli military strike on Deir el-Balah in Gaza killed two Palestinians, including a 3-year-old child. The incident occurred amid ongoing violence despite a declared ceasefire, with over 1,300 Palestinians killed and 4,300 injured since the ceasefire began.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/30/israeli-strike-kills-3-year-old-child-in-gaza?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Israeli strike kills 3-year-old child in Gaza\nNewsFeed\nIsraeli strike kills 3-year-old child in Gaza\nA deadly Israeli strike on Deir el-Balah killed two Palestinians including a 3-year-old child. Their deaths come amid near-daily Israeli attacks despite the so-called ceasefire, with at least 1,303 Palestinians killed and 4,336 injured since it began.\nPublished On 30 Aug 2026", "translation_ja": "", "vocab": [{"word": "ceasefire", "definition": "敵対行為の停止または休戦のこと。戦争や紛争における一時的な軍事行動の中断を指します。"}, {"word": "amid", "definition": "〜の最中に、〜の途中でという意味の前置詞。特定の状況や環境の中でという文脈で使用されます。"}, {"word": "deadly", "definition": "死をもたらす、致命的なという形容詞。人命が失われるような深刻な状況を表現します。"}, {"word": "strike", "definition": "軍事攻撃またはミサイル・空爆などの攻撃を指す名詞。政治・ビジネス用語では労働者による仕事の中断も意味します。"}]}, {"title_ja": "ホセ・アンドレス氏、ガザのWCK職員殺害事件の調査再要求", "title_en": "Jose Andres Renews Call for Investigation into WCK Gaza Staff Killings", "summary_ja": "ワールド・セントラル・キッチン創設者のホセ・アンドレス氏は、2024年4月にガザでイスラエル軍の空爆により殺害された7人の支援職員に関する独立調査を再び要求している。職員らは3台の明確に標識された車両で移動しており、イスラエル当局に承認され、その指示に従っていた経路上にいた。", "summary_en": "World Central Kitchen founder José Andrés is again calling for an independent investigation into Israeli strikes that killed seven aid workers in Gaza in April 2024. The workers were traveling in three clearly marked vehicles on a route that had been approved by and was in compliance with Israeli authorities.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/30/jose-andres-renews-call-for-investigation-into-wck-gaza-staff-killings?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Jose Andres renews call for investigation into WCK Gaza staff killings\nNewsFeed\nJose Andres renews call for investigation into WCK Gaza staff killings\nWorld Central Kitchen founder José Andrés is renewing his call for an independent investigation into Israeli strikes that killed seven aid workers in Gaza in April 2024. The workers were traveling in three clearly marked vehicles on a route approved by and in compliance with Israeli authorities.\nPublished On 30 Aug 2026", "translation_ja": "", "vocab": [{"word": "renew", "definition": "以前の行動や要求を繰り返す、または再び始めることを意味する。ここでは、アンドレス氏が調査要求を何度も繰り返していることを表す。"}, {"word": "independent investigation", "definition": "政府や関係当事者から独立した、公平な第三者による調査のこと。政治的圧力や影響を受けない公正な調査を指す。"}, {"word": "compliance", "definition": "法律や指示に従うことを意味する。ここでは、支援職員たちがイスラエル当局の指示やルールに従っていたことを示す。"}, {"word": "marked vehicles", "definition": "視認性を高めるため、特別な標識や色が施された車両のこと。人道支援団体の車両を識別するために使用される。"}, {"word": "authorized route", "definition": "公式に許可された特定の経路やルート。ここではイスラエル当局が事前に承認した移動経路を意味する。"}]}, {"title_ja": "米軍がホルムズ海峡のイラン・ロケット発射装置を攻撃", "title_en": "U.S. Forces Strike Iranian Rocket Launchers on Strait of Hormuz", "summary_ja": "米軍がララク島近くのホルムズ海峡でイランの革命防衛隊ロケット発射装置を攻撃し、数週間ぶりの軍事行動となった。イランの革命防衛隊は犠牲者の報告と報復の誓いを表明した。米軍は海峡の国際航行ルートの機雷除去を先週完了していた。", "summary_en": "U.S. military forces conducted strikes against Iranian Revolutionary Guard Corps rocket launchers near Larak Island on the Strait of Hormuz, marking the first military action in weeks. Iran's Revolutionary Guards reported casualties and vowed to respond to the attack. The U.S. had recently completed clearing sea mines from the strait's international shipping routes.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-forces-strike-iran-rocket-launcher-donald-trump-updates/article71408837.ece", "state_media": false, "category": "政治", "full_text": "U.S. forces have struck Iranian rocket launchers on the Strait of Hormuz in the first military action in a month, a U.S. official said Sunday.\nSemiofficial news outlets in Iran reported sounds of explosions near Larak island on the strait.\nForces with the Revolutionary Guard Corps were observed preparing to launch rockets with sea mines into the strait, according to the official, who spoke on condition of anonymity to detail sensitive military movements.\nThe U.S. military last week completed clearing sea mines from the strait’s international shipping routes.\nIran’s Revolutionary Guards vow response to U.S. attack on Larak island\nIran’s Revolutionary Guards said a U.S. attack on Larak Island killed and wounded several Iranian fighters and civilians, and vowed to respond and punish those responsible, state broadcaster IRIB reported.\nThe Guards did not provide a precise casualty toll.\n(With inputs from AP and Reuters)\nPublished - August 31, 2026 01:44 am IST", "translation_ja": "", "vocab": [{"word": "Revolutionary Guard Corps", "definition": "イランの精鋭軍事組織で、イスラム革命後に設立された。通常RGCと略され、イランの政治的・軍事的活動を主導する重要な機関です。"}, {"word": "Strait of Hormuz", "definition": "ペルシャ湾とオマーン湾を結ぶ重要な海路で、世界の石油輸送の約3分の1が通過する戦略的に重要な海峡です。"}, {"word": "sea mines", "definition": "海底または海水中に設置された爆発装置で、船舶が接触すると爆発する兵器です。海上輸送を妨害するために使用されます。"}, {"word": "sensitive military movements", "definition": "機密性の高い軍事作戦や部隊配置のこと。情報公開の制限が必要な軍事行動を指します。"}, {"word": "vow", "definition": "厳粛に約束または誓約すること。特に重大な決意や報復の意思を表明する際に使われます。"}, {"word": "casualty toll", "definition": "戦闘や事故による死傷者の総数。損失の程度を示す統計的な表現です。"}]}, {"title_ja": "ネパール洪水の死者数788人に達する；救助活動が継続", "title_en": "Nepal Flash Floods Death Toll Reaches 788; Rescue Operations Continue", "summary_ja": "2026年8月30日現在、ネパール地域の大規模な洪水による死者数は788人に達し、2,500人以上が今なお行方不明となっている。インド法医学チームの支援を受けたDNA分析を含む救助活動が進行中であり、河川の水位は危険な状態にある。この災害はカイラス巡礼から帰路中のタミルナドゥ州の49人を含む、中国側の数千人にも影響を与えている。", "summary_en": "Death toll from devastating flash floods in Nepal has risen to 788 with over 2,500 people still missing as of August 30, 2026. Rescuers are conducting intensive operations including DNA analysis with help from Indian forensic teams, while water levels in rivers remain dangerously high. The disaster has also affected thousands on the Chinese side, including 49 Tamil Nadu pilgrims returning from Kailash yatra.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nepal-flash-floods-live-updates-death-toll-rescue-operation-missing-person-tibet-border-glacier-collapse-news/article71406948.ece", "state_media": false, "category": "政治", "full_text": "Armed Police Force officers work on transporting bodies to the pit at the Devghat mass burial site for victims of deadly flash floods and mudslides in Chitwan, Nepal, on August 30, 2026.\n| Photo Credit:\nReuters\nThe death toll from flash floods in Nepal rose to 788 on Sunday (August 30, 2026), with more bodies being recovered, even as more than 2,500 people are still missing. The National Disaster Risk Reduction and Management Authority (NDRRMA) further said that at least 2,502 people are still missing, while 9,435 people were rescued from flood-hit areas so far.\nIt killed 16 people on the Chinese side as well, while nearly 550 people remain missing in Tibet, according to Chinese media reports.\nNepal’s scenic Chitwan district, known for its forests and rivers, has become the site of mass burials for hundreds of unidentified victims whose bodies were swept away by the flash floods.\nIn a statement issued on Sunday (August 30, 2026), the NDRRMA warned that water levels in the Bhotekoshi River had risen again. “The water level in the flooded Bhotekoshi River has risen to some extent; all concerned are urged to take precautionary measures,” it said, adding that it will provide updates on the situation after receiving additional information.\n49 TN yatris were on China side when disaster struck, missing: Chennai tour operator\nAs many as 49 yatris from Tamil Nadu, after completing the Kailash pilgrimage, were on the China side when the flash floods struck and they are among the missing, the owner of a travel firm who organised the yatra said on Sunday.\nExpressing deep concern about the missing pilgrims, Maravel Nagappan, the firm owner, said that over 40 yatris from Tamil Nadu had completed the Kailash yatra and were waiting to enter Nepal from the China side when the disaster struck on August 26, 2026.\nThe travel firm owner requested the Central government to get information about the untraceable yatris from the Chinese authorities.\nThe Kailash yatra he organised commenced on August 14, he said.\n-PTI\nAugust 30, 2026 23:02\nFresh flood in Trishuli River sweeps away suspension bridge in Nepal\nA suspension bridge in central Nepal was swept away on Sunday morning (August 30, 2026) due to a fresh flood in the Trishuli River, officials said.\nThe bridge connected Ghyalchowk of Gandaki Rural Municipality-8 in the Gorkha district of Gandaki province with Charaudi along the Prithvi Highway.\nThe flood, which lasted for around three hours, swept away the bridge at around 11.30 am, said security officials.\nWith the flood washing away the bridge, residents of Gandaki Rural Municipality 7 and 8 have lost their access to the Prithvi Highway.\n- PTI\nAugust 30, 2026 22:59\nEight people from Assam rescued in Nepal after flash flood: Himanta\nAt least eight people from Assam have been rescued in Nepal, which was struck by a devastating flash flood on August 26, and are being brought back to the state, Chief Minister Himanta Biswa Sarma said.\nThe Assam State Disaster Management Authority (ASDMA) said nine more people from Assam are still missing in the Himalayan country.\nThe State Government is coordinating with the authorities concerned to trace missing people and bring them back safely to Assam, Sarma said in a social media post on Saturday.\n“I just spoke to eight people from Assam, who have been safely rescued in Nepal,” Mr. Sarma said.\n- PTI\nAugust 30, 2026 22:57\nIndian forensic team in Kathmandu helps in analysis of DNA samples\nA 19-member specialised forensics team from India began functioning in Kathmandu on Sunday to help augment the analysis of DNA samples for the identification of victims’ mortal remains, in the wake of the devastating flash floods in Nepal, officials said. The spokesperson of the Ministry of External Affairs (MEA), Randhir Jaiswal, shared the update in a post on X.\n“Indian nationals who have safely crossed into Nepal from China today: 403 (as per local government sources on China side),” he s
