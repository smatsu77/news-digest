d the suspects following an intelligence-led operation, the police said.\nThe police identified the suspects as Victor Ifeanyi, 24, alias Big Boby, from Aguleri Community, Otuocha Local Government Area of Anambra State, and Aniekan Michael, 36, alias Duff Man, from Ikot Ukpor, Essien Udim Local Government Area of Akwa Ibom State.\nThe state police spokesperson, Blessing Agabe, disclosed this in a statement posted on Facebook on Monday.\nAccording to the police, the victim, identified as Mr Hassan, a resident of Rivers State, was abducted on 6 September 2026 near Fidelity Bank, Garrison, Port Harcourt.\nThe kidnappers allegedly took him to Igbugulu Waterside, Borikiri, Port Harcourt, where he was held captive for three days.\nThe police said the victim was released after his relatives paid a ransom of ₦10.3 million.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nPolice launch investigation\nThe command said it received credible information about the abduction on 7 September and immediately deployed operatives of the VCRU-AKU to investigate the incident.\nThe intelligence-led operation subsequently led to the arrest of the two suspects.\n“Preliminary investigation revealed that the suspects confessed to their alleged involvement in the operation,” the police said.\nThe suspects reportedly told investigators that the gang consisted of six members and that they used a white mini-bus, popularly known as a Keke bus, during the operation.\nThe police said efforts were ongoing to arrest the four other members of the syndicate.\nREAD ALSO: Police commissioner in Bayelsa orders crackdown on cult groups\nPolice intensify anti-kidnapping operations\nThe arrests come amid other recent police operations against suspected kidnappers in Rivers State.\nIn one recent case, police arrested four suspected kidnappers and rescued an abducted woman in the state. This newspaper reported that the operation was part of efforts by security agencies to dismantle kidnapping networks operating in the region.\nIn another operation, police rescued a kidnap victim and apprehended a suspect, PREMIUM TIMES reported.\nThe Police Commissioner in the state, Olugbenga Adepoju, urged residents to provide credible information that could help the command identify and arrest criminal elements.\nMr Adepoju assured the public that the command would treat such information in confidence.\nHe said the command would continue to deploy intelligence-led operations to disrupt kidnapping syndicates and other criminal networks across the state.\nThe commissioner also urged residents to remain calm and cooperate with security agencies.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "syndicate", "definition": "犯罪組織や違法な目的のために協力する人々のグループ。この記事では、誘拐事件に関わる6人の組織を指しています。"}, {"word": "operatives", "definition": "特定の組織（警察や諜報機関など）のために行動する職員や代理人。ここでは暴力犯罪対応部隊の職員を意味します。"}, {"word": "credible", "definition": "信頼できる、または信じるに値する情報や証拠。警察が信頼できる情報に基づいて捜査を開始したことを示しています。"}, {"word": "confessed", "definition": "犯罪や不正行為を認める、または白状すること。容疑者が自分たちの関与を認めたことを表します。"}, {"word": "dismantle", "definition": "組織や体制を解体する、または破壊する。警察が誘拐ネットワークを根絶する努力を示しています。"}]}, {"title_ja": "PNC 2026: NCDMB, DMG affirm collaboration with Bayelsa govt, unveil new activities", "title_en": "PNC 2026: NCDMB, DMG affirm collaboration with Bayelsa govt, unveil new activities", "summary_ja": "This commitment was affirmed on Tuesday during a strategic engagement between officials of NCDMB and DMG Events with the Deputy Governor of Bayelsa State, Peter Pereotubo Akpe, at the Government House in Yenagoa The post PNC 2026: NCDMB, DMG affirm collaboration with Bayelsa govt, unveil new activit", "summary_en": "This commitment was affirmed on Tuesday during a strategic engagement between officials of NCDMB and DMG Events with the Deputy Governor of Bayelsa State, Peter Pereotubo Akpe, at the Government House in Yenagoa The post PNC 2026: NCDMB, DMG affirm collaboration with Bayelsa govt, unveil new activit", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/915108-pnc-2026-ncdmb-dmg-affirm-collaboration-with-bayelsa-govt-unveil-new-activities.html", "state_media": false, "category": "政治", "full_text": "As preparations intensify for the 2026 edition of the Practical Nigerian Content (PNC) Forum, slated for 30 November – 3 December 2026, the Nigerian Content Development and Monitoring Board (NCDMB) and its partner, DMG Events, have strengthened their long-standing collaboration with the Bayelsa State Government, to ensure seamless hosting of the flagship industry gathering.\nThis commitment was affirmed on Tuesday during a strategic engagement between officials of NCDMB and DMG Events with the Deputy Governor of Bayelsa State, Peter Pereotubo Akpe, at the Government House in Yenagoa.\nThe meeting was convened to appreciate the State Government for its close partnership in convening the PNC over the past 15 years and to solicit continued assistance for the 15th edition, which will hold at the NCDMB Conference Centre, Yenagoa, Bayelsa State.\nLeading the delegation to the meeting, General Manager, Corporate Communications Division, NCDMB, Obinna Ezeobi, highlighted the economic impact of the PNC Forum, as well as other NCDMB’s activities and programmes in Bayelsa State.\nHe conveyed the appreciations of the Executive Secretary of NCDMB, Felix Omatsola Ogbe to the Bayelsa State Government for its significant contributions to the PNC, particularly in hosting the opening banquet and supporting the Youth PNC segment, which exposes young persons in the Niger Delta region to emerging opportunities in the oil and gas industry and core competencies for successful careers in other key sectors of the economy.\nEzeobi also alluded to new initiatives introduced for the 2026 PNC Forum, designed to invigorate the conference and enhance value for participants, while Senior Manager, Zonal Coordination, NCDMB, Mr Adebayo Joseph, spoke on plans for the Youth PNC.\nLeader of the DMG team, Ms Olamide Oloko, outlined the main PNC programme and the new ideas such as the Local Content Roundtable for November 30 and the twoday programme for Local Community Contractors (LCCs), to help scale their operations.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nOther innovative initiatives at this year’s PNC include the breakout session, designed to gather stakeholders’ perspectives that will shape the trajectory of Nigerian Content over the next decade, and the Townhall Session with key industry leaders, including the Executive Secretary of NCDMB, the Group CEO of NNPC Ltd, the Chief Executive of NUPRC, the Chairman of OPTS, and the Chairman of PETAN.\nIn his response, Deputy Governor Akpe pledged Bayelsa State’s continued collaboration, assuring delegates of adequate security and reaffirming the State’s tradition of hosting the gala dinner and actively participating in the main conference as well as the Youth PNC. He commended NCDMB for integrating some participants from the 2025 edition of the Youth PNC into its capacitybuilding programmes, and demanded for increased participation of senior oil and gas industry officials in the welcome gala dinner.\nThe Practical Nigerian Content Forum, hosted annually by NCDMB and DMG Events, serves as a strategic platform to review and track local content implementation and chart new directions for investment and growth in Nigeria’s oil and gas industry. The 2026 edition is expected to deepen collaboration, strengthen local participation, and enhance value retention across the sector.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "intensify", "definition": "準備や活動が段階的に強まる、または激しくなることを意味する。ビジネス文脈では、イベントの開催に向けて努力が増加していく様子を表す。"}, {"word": "flagship", "definition": "企業や組織の最も重要で代表的な製品やイベントを指す。ここでは業界を代表する重要なフォーラムを意味する。"}, {"word": "solicit", "definition": "正式に誰かに援助や意見を求めることを意味する。ビジネスや公式な場面で使用される。"}, {"word": "alluded", "definition": "直接的に言及せず、遠回しに何かに言及することを意味する。\"allude to~\"の形で使用される。"}, {"word": "trajectory", "definition": "物事の進行方向や発展の傾向を指す。ここでは今後10年間のナイジェリアコンテンツの進むべき方向性を意味する。"}]}, {"title_ja": "Otti mourns Abia-born Squadron Leader Man-Ugwueje, commiserates with FG over plane crash", "title_en": "Otti mourns Abia-born Squadron Leader Man-Ugwueje, commiserates with FG over plane crash", "summary_ja": "In a statement on Tuesday by Ferdinand Ekeoma, his special adviser on media and publicity, Mr Otti described Squadron Leader Man-Ugwueje’s death and those of other military personnel aboard the Nigerian Air Force plane as painful and devastating. The post Otti mourns Abia-born Squadron Leader Man-Ug", "summary_en": "In a statement on Tuesday by Ferdinand Ekeoma, his special adviser on media and publicity, Mr Otti described Squadron Leader Man-Ugwueje’s death and those of other military personnel aboard the Nigerian Air Force plane as painful and devastating. The post Otti mourns Abia-born Squadron Leader Man-Ug", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/915102-otti-mourns-abia-born-squadron-leader-man-ugwueje-commiserates-with-fg-over-plane-crash.html", "state_media": false, "category": "政治", "full_text": "The Governor of Abia State, Alex Otti, has expressed deep sadness over the death of Abia-born Squadron Leader Ahamefule Aham Man-Ugwueje, one of the pilots of the Nigerian Air Force ATR-42 aircraft, NAF 931, which crashed in Igbokoda, Ondo State, on Monday, 5 October.\nIn a statement on Tuesday by Ferdinand Ekeoma, his special adviser on media and publicity, Mr Otti described Squadron Leader Man-Ugwueje’s death and those of other military personnel aboard the Nigerian Air Force plane as painful and devastating.\nAccording to the Governor, “This accident is both painful and devastating, because it has brought untold sorrow and anguish to the victims’ families, their friends and loved ones, the Nigerian Air Force, and the nation at large.”\nGovernor Otti regretted that Squadron Leader Man-Ugwueje perished in the air disaster just about two weeks after he wedded his beloved wife, Flight Lieutenant Damilola Adekunle, in Abuja, a sad development that has robbed the couple of the opportunity to spend their lives together as husband and wife.\nGovernor Otti, on behalf of his family, the Government and people of Abia State, sends his deepest condolences to the families of the victims, the people of Umuahia where Squadron Leader Man-Ugwueje hailed from, the Nigerian Air Force and the Federal Government of Nigeria, and prays for the peaceful repose of their souls in God’s bosom.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "devastating", "definition": "深刻な損害や悲しみを与える様子。ここでは航空機事故による精神的・感情的な大きな打撃を表している。"}, {"word": "anguish", "definition": "激しい苦痛や深い苦しみの状態。身体的というより精神的・感情的な苦しみを指す。"}, {"word": "perished", "definition": "死ぬ、滅びるという意味の過去形。特に悲劇的な事故や災害などにより命を失うことを表す。"}, {"word": "condolences", "definition": "哀悼の意、お悔やみの言葉。亡くなった人の遺族に対して示す同情と敬意の表現。"}]}, {"title_ja": "Student Protests Expand to More Than 40 French Cities", "title_en": "Student Protests Expand to More Than 40 French Cities", "summary_ja": "Union members, parents and teachers joined the demonstrations, broadening the student-led protest movement that has closed hundreds of French high schools since late September.", "summary_en": "Union members, parents and teachers joined the demonstrations, broadening the student-led protest movement that has closed hundreds of French high schools since late September.", "source": "New York Times", "tier": "paper", um=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Christa Pike faces lengthy recovery after botched execution attempt — lawyers", "title_en": "Christa Pike faces lengthy recovery after botched execution attempt — lawyers", "summary_ja": "According to their statement, Pike's prognosis remains unclear", "summary_en": "According to their statement, Pike's prognosis remains unclear", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/society/2198507", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Kim Jong Un assures Putin of unwavering support for Russia — KCNA", "title_en": "Kim Jong Un assures Putin of unwavering support for Russia — KCNA", "summary_ja": "The North Korean leader congratulated the Russian president on his birthday", "summary_en": "The North Korean leader congratulated the Russian president on his birthday", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2198505", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "United States does not need Iranian oil, President Donald Trump declares", "title_en": "United States does not need Iranian oil, President Donald Trump declares", "summary_ja": "The US leader separately stated that Washington had prevented Tehran from acquiring nuclear weapons", "summary_en": "The US leader separately stated that Washington had prevented Tehran from acquiring nuclear weapons", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2198503", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Why the US-China Trade Truce Matters", "title_en": "Why the US-China Trade Truce Matters", "summary_ja": "Chinese President Xi Jinping and US President Donald Trump’s agreement to extend their trade truce reflects the fact that both sides have leverage over the other. In a world where the rules-based trading system is not functioning, the current fragile equilibrium may be the best one can hope for.", "summary_en": "Chinese President Xi Jinping and US President Donald Trump’s agreement to extend their trade truce reflects the fact that both sides have leverage over the other. In a world where the rules-based trading system is not functioning, the current fragile equilibrium may be the best one can hope for.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-china-trade-truce-extension-global-significance-by-shang-jin-wei-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Why the US-China Trade Truce Matters\nChinese President Xi Jinping and US President Donald Trump’s agreement to extend their trade truce reflects the fact that both sides have leverage over the other. In a world where the rules-based trading system is not functioning, the current fragile equilibrium may be the best one can hope for.\nNEW YORK—Chinese President Xi Jinping’s state visit to Washington in September produced no major new agreement. But it did result in an extension of the trade truce that Xi and US President Donald Trump struck in Busan, South Korea, last October. Instead of expiring on November 10, the truce will expire on January 10, 2027. Though modest, this achievement has given an unstable world economy a reprieve.", "translation_ja": "", "vocab": [{"word": "truce", "definition": "一時的な戦闘停止または対立の中断。ここでは米中間の貿易紛争を一時的に緩和する合意を指す。"}, {"word": "leverage", "definition": "相手に影響力を及ぼす力や手段。交渉で自分の立場を強くするために使える資源や力のこと。"}, {"word": "equilibrium", "definition": "均衡や平衡状態。複数の力がバランスしている状態を意味し、経済や政治の文脈でよく使われる。"}, {"word": "fragile", "definition": "壊れやすい、脆弱な。ここでは経済的な状況が不安定で、簡単に崩れる可能性がある状態を表す。"}, {"word": "reprieve", "definition": "一時的な猶予、延期、あるいは苦しい状況からの一時的な救済。ここでは世界経済の危機が一時的に回避されたことを指す。"}]}, {"title_ja": "Brazil’s Voters Have Moved", "title_en": "Brazil’s Voters Have Moved", "summary_ja": "A strong performance by the right-wing, Donald Trump-aligned candidate in the first round of Brazil’s presidential election demonstrates that the left-wing ruling party has failed to keep up with the times. The Brazilian electorate is older, more devout, and more preoccupied with crime and personal ", "summary_en": "A strong performance by the right-wing, Donald Trump-aligned candidate in the first round of Brazil’s presidential election demonstrates that the left-wing ruling party has failed to keep up with the times. The Brazilian electorate is older, more devout, and more preoccupied with crime and personal ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/brazilian-election-why-bolsonaro-won-first-round-by-robert-muggah-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Brazil’s Voters Have Moved\nA strong performance by the right-wing, Donald Trump-aligned candidate in the first round of Brazil’s presidential election demonstrates that the left-wing ruling party has failed to keep up with the times. The Brazilian electorate is older, more devout, and more preoccupied with crime and personal security than it once was.\nBERLIN—Brazilians awoke on Monday to a changed political map. Flávio Bolsonaro, the son of former Brazilian President Jair Bolsonaro, who is now under house arrest for attempting to overturn the last presidential election, has received 47% of the vote in the first round of this year’s presidential election, while the incumbent, Luiz Inácio Lula da Silva, received 45%. Brazil appears poised to join the growing ranks of rightward-veering countries.", "translation_ja": "", "vocab": [{"word": "electorate", "definition": "選挙権を持つ国民全体、投票者の集団。政治的な傾向や特性を分析する際に使われる。"}, {"word": "incumbent", "definition": "現職の政治家や公務員。特に大統領や知事など公職にある人を指す。"}, {"word": "veering", "definition": "方向や立場が急に変わること。政治的・経済的な方向転換を表現する際に使用される。"}, {"word": "overturn", "definition": "決定や判断を覆す、反対する。法的・政治的な文脈で権力や判決を無効にすることを意味する。"}, {"word": "demonstrates", "definition": "明確に示す、証明する。データや事実に基づいて何かが真実であることを立証する際に用いられる。"}]}, {"title_ja": "Does Inclusive Finance Really Need Stablecoins?", "title_en": "Does Inclusive Finance Really Need Stablecoins?", "summary_ja": "Today, 1.3 billion adults—more than half of them women—remain excluded from the formal financial system, and lower-income consumers still struggle to find and access the financial products and services they need. Contrary to much hype, stablecoins are not the best way to solve either of these proble", "summary_en": "Today, 1.3 billion adults—more than half of them women—remain excluded from the formal financial system, and lower-income consumers still struggle to find and access the financial products and services they need. Contrary to much hype, stablecoins are not the best way to solve either of these proble", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/stablecoins-are-not-the-key-to-financial-inclusion-by-michael-wiegand-2-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Does Inclusive Finance Really Need Stablecoins?\nMichael Wiegand\nToday, 1.3 billion adults—more than half of them women—remain excluded from the formal financial system, and lower-income consumers still struggle to find and access the financial products and services they need. Contrary to much hype, stablecoins are not the best way to solve either of these problems.\nSEATTLE—Much progress has been made on financial inclusion over the last 15 years, with account ownership in low- and middle-income countries surging from 42% in 2011 to 75% today. This largely reflects the rise of new banking models, such as mobile money, which have lowered both costs and technological barriers substantially, especially by enabling people to access their accounts using basic mobile phones. But 1.3 billion adults—more than half of them women—remain excluded from the formal financial system, and lower-income consumers still struggle to find and access the financial products and services they need.\nStablecoins are being touted as the technology that will finally bring the world’s unbanked poor into the financial system. But the hype is unwarranted.\nEveryday domestic payments are the cornerstone of financial inclusion, and money and bank accounts linked through an inclusive instant payment system are clearly superior to stablecoins for this purpose. Both options offer 24-hour access and instant low-cost financial transfers. But traditional accounts can be accessed through regular phones using simple messages, whereas stablecoins require a smartphone or internet-connected computer, not to mention a much higher level of digital literacy. For a woman farmer in northern Kenya, who has a basic phone and no data connection, stablecoins are no solution.\nData support this assertion, showing that the vast majority of stablecoin transactions are limited to uses like cryptocurrency purchases. Even where governments have pushed hard to launch their own digital currencies, such as in China and Nigeria, there has been little uptake, because people see no advantage in adopting them. For some, digital currencies might even represent a disadvantage: stablecoins transmit risk from payer to payee in a way that instant payment systems do not, partly because their value on traded markets can differ from their face value.\nSome argue that stablecoins are better for cross-border payments. They point out that remittances sent in the form of a dollar-backed stablecoin could reach, say, Kampala from anywhere else in the world in seconds and at low cost. But the recipient would still need to convert the stablecoin into Ugandan shillings, and the market for doing so is a fraction of the size of the market banks and money-transfer operators draw on, with worse exchange rates. As a result, money-transfer operators like Wise or Remitly generally offer better value end-to-end; they are certainly easier to access for most low-income recipients.\nCross-border bank transfers are still slower and more expensive than such operators (and stablecoins), but this can be addressed by linking domestic instant-payment systems, as envisioned in the G20 Roadmap for Cross-Border Payments. This approach is already being implemented in some regions: the Nexus payment system, for example, links India, Malaysia, the Philippines, Singapore, and Thailand.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nOf course, financial inclusion entails more than just payments. Financial systems must offer all consumers a range of products that meet their needs. Fortunately, we may well be on the verge of an explosion in new financial products for low-income customers. The key ingredient is data: critical information about an individual (shared with their consent) can increasingly be used to build tailored financial products.\nThis approach is already beginning to transform lives. In Ethiopia, a regulatory reform on data exchange enabled the Cooperative Bank of Oromia to launch a lending product called Michu, built not on collateral but on transaction data, and tailored to the borrower’s specific needs. Within a year, Michu had built a customer base that was more than one-third women.\nFor farmers—who typically do not have extensive transaction histories, since most agriculture payments are still made with cash—different types of data could be used. Governments already increasingly collect data on the land farmers hold, the crops they grow, and even the rainfall on their fields (verified via satellites), primarily to provide advice. Shared with consent, such data could enable a lender not only to estimate farmers’ current income accurately, but also to structure loan-repayments to match their cash-flow cycle.\nLenders could even use these d", "translation_ja": "", "vocab": [{"word": "excluded", "definition": "正式な金融システムから外されている、または利用できない状態にあること。金融包摂の文脈では、銀行口座やサービスへのアクセスがない人々を指す。"}, {"word": "touted", "definition": "ある製品やサービスが優れていると大々的に宣伝・推奨されること。多くの場合、実際の価値が過大評価されている状況で使われる。"}, {"word": "cornerstone", "definition": "基本となるもの、最も重要な基盤となる要素のこと。比喩的に用いられ、建築における隅石から転じて根本的な構成要素を意味する。"}, {"word": "uptake", "definition": "新しい製品やサービス、考え方などが人々に採用・受け入れられる程度や速度のこと。市場での普及率を示す。"}, {"word": "remittances", "definition": "海外で働く人が故国の家族に送金すること、またはその送金額のこと。国際的な経済活動における重要な資金移動を指す。"}]}, {"title_ja": "JD Vance and Ted Cruz are fighting for control of the GOP. The problem? Neither is called Trump | Arwa Mahdawi", "title_en": "JD Vance and Ted Cruz are fighting for control of the GOP. The problem? Neither is called Trump | Arwa Mahdawi", "summary_ja": "Having seemingly written off the midterms, the Republican bigwigs are making their pitches for 2028. But the current commander-in-chief could be looking closer to home The US midterm elections are a month away and it’s looking rough for the Republicans. I wouldn’t discount devious schemes behind the", "summary_en": "Having seemingly written off the midterms, the Republican bigwigs are making their pitches for 2028. But the current commander-in-chief could be looking closer to home The US midterm elections are a month away and it’s looking rough for the Republicans. I wouldn’t discount devious schemes behind the", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/06/jd-vance-ted-cruz-fighting-control-gop-trump-midterms", "state_media": false, "category": "オピニオン", "full_text": "The US midterm elections are a month away and it’s looking rough for the Republicans. I wouldn’t discount devious schemes behind the scenes, but, on the face of it, the president and his entourage seem to be flailing. Donald Trump is desperately dangling money in front of voters and promising “a big surprise”. Meanwhile, the vice-president, JD Vance, and the GOP senator Ted Cruz seem more concerned with fighting over who will be Trump’s heir than with the midterms.\nIf the polls are to be believed, Vance is the frontrunner for the Republican presidential nomination in 2028. But while he may have great name recognition, Vance is also unlikable. According to the CNN analyst Harry Enten, he is one of the least popular vice-presidents in history. He’s also apparently made enemies within his own party, largely because of his scepticism about the Iran war. His detractors include Cruz, who told MS Now in August that Vance wasn’t a shoo-in for the nomination. The party, Cruz said, was still figuring out the best candidate and needed “to decide who we are, what do we believe”.\nThese remarks did not go unnoticed by the ever-observant vice-president. “It is really obvious to me that, at this very moment, Ted Cruz is running for president,” Vance said in an interview with NBC News on Friday. “At this moment, I’m not. I’m trying to help elect Republicans.”\nCruz, in turn, denied he was thinking about 2028 yet and suggested Vance may have a chip on his shoulder. “In my experience, people engage in political bomb-throwing when they’re feeling insecure,” Cruz told Politico on Saturday. “So he’s welcome to make whatever comments he likes.”\nYes, please continue making whatever comments you like, JD! In fact, I’d strongly suggest you take it up a notch and remind people of Cruz’s greatest hits. There was the time he fled to Cancún on holiday when his state, Texas, was facing deadly, record-breaking freezing temperatures, for example. And the time his official Twitter account “liked” a pornographic tweet (apparently it was “a staffing issue, and it was inadvertent”). And there’s the longstanding joke, which started with a meme in 2013, that Cruz is the Zodiac killer. Obviously, this was baseless, but it went viral because apparently it is believable. Indeed, a 2016 poll found that 10% of voters in Florida thought Cruz was the Zodiac killer and an additional 28% said they were not sure.\nThat said, Vance should be careful about what he dishes out: he’s been the subject of a few memes himself. Who can forget the (completely unfounded) viral rumours about the vice-president having sexual relations with a couch?\nWhile Vance and Cruz may be butting heads now, I suspect they’ll eventually kiss and make up. They are pragmatists, which is a polite way to say soulless opportunists. They had similar journeys when it comes to Trump, for example. In 2016, Cruz called Trump, who nicknamed him Lyin’ Ted, a “serial philanderer” and a “pathological liar”. Around the same time, Vance wondered if Trump was “America’s Hitler” and called him “the most-raw expression of a massive finger pointed at other people”. Now, of course, it’s a very different story. Vance is veep and Cruz has become such a staunch Trump ally that the president calls him Beautiful Ted.\nWith the news as grim as it is, you’ve got to find satisfaction where you can. And it’s certainly satisfying to watch Vance (who absolutely does not fornicate with furniture) and Cruz (who is definitely not the Zodiac killer) feud. Ultimately, though, it may turn out that we don’t have to worry about either man come 2028. MS Now’s Rachel Maddow thinks the president may follow the authoritarian playbook and install a family member as his successor.\n“If he wants [his family] to not end up in jail or prosecuted or having their … gains investigated … he’s got to make sure that the next president is also a Trump,” Maddow opined on a recent podcast. Potus himself has said “there could be” a Trump dynasty and seemed to suggest his daughter-in-law Lara may be his successor. Take a seat on a comfy couch for this one, JD: you’re going to have a tough time trumping a Trump.\nArwa Mahdawi is a Guardian columnist", "translation_ja": "", "vocab": [{"word": "entourage", "definition": "政治家や著名人の周辺にいる側近や随行者のグループ。特に権力者を取り囲む人々を指す。"}, {"word": "flailing", "definition": "無秩序に手足を動かすように、効果的な戦略なく右往左往している状態。政治的に苦戦している様子を表す。"}, {"word": "frontrunner", "definition": "競争や選挙において最も有利な立場にいる候補者や参加者。最有力候補を意味する。"}, {"word": "detractors", "definition": "特定の人物や物事を批判したり、その価値を下げようとする人々。批評家や反対者を指す。"}, {"word": "inadvertent", "definition": "故意ではなく無意識のうちに行われた；うっかりした。意図しない行為や結果を表す。"}]}, {"title_ja": "Sorry, but I’m bringing my iced coffee to the job interview | Tayo Bero", "title_en": "Sorry, but I’m bringing my iced coffee to the job interview | Tayo Bero", "summary_ja": "What, exactly, about the drink is so distracting? The viral debate raises bigger questions about who defines ‘professionalism’ The great iced coffee debate of 2026 is the latest submission to the young-people-just-don’t-get-it discourse and, of course, it’s as polarizing as ever. Recruiters say you ", "summary_en": "What, exactly, about the drink is so distracting? The viral debate raises bigger questions about who defines ‘professionalism’ The great iced coffee debate of 2026 is the latest submission to the young-people-just-don’t-get-it discourse and, of course, it’s as polarizing as ever. Recruiters say you ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/06/iced-coffee-job-interview-professionalism", "state_media": false, "category": "オピニオン", "full_text": "The great iced coffee debate of 2026 is the latest submission to the young-people-just-don’t-get-it discourse and, of course, it’s as polarizing as ever.\nRecruiters say you shouldn’t bring iced coffee to interviews, while young people are (rightly) asking: what’s the big deal? It’s one of those conversations that makes me cringe, given just how eagerly it springs up from the generational divide plaguing mainstream culture. And as usual, gen Z are cast as the entitled morons who want to live life with no rules or responsibilities, all to the detriment of the millennials and gen X-ers who have to deal with them.\nIced-coffeegate blew up on social media after the president of a recruiting firm shared a TikTok saying the drink “looks a little too casual” to hiring managers. With thousands of outraged responses across TikTok and Twitter/X, I was stunned to see so many people up in arms about someone bringing a coffee to an interview. Per one of my favorite comments: “It’s an iced coffee, not a bomb!”\nStill, these discussions are a reminder of the deep chasms that exist generationally and culturally when it comes to notions of professionalism and how we’re supposed to show up in public life. As I scrolled through endless posts lamenting how terrible youth culture is, I wondered seriously: what is it about an iced coffee that feels so distracting or unprofessional?\nThen again, so much of this is tied up in the cultural symbolism and associations we create with the world around us. Iced coffee? So gen Z. But what if it was a warm coffee, in a nice, grown-up looking travel mug? Or what if it was just water? See how silly and arbitrary it all is?\nBut let’s put the iced coffee to the side.\nThe bigger picture is that for the most part, rules of professionalism are rooted in racist constructs. From Eurocentric dress and hair codes to the weaponization of “what’s appropriate to say at work” to suppress dissenting discourse and discourage non-conformity, “professionalism” is and has always been about social control. These unknowable norms are mostly code for whiteness, and are regularly and violently weaponized against racialized, disabled, poor, young or otherwise minoritized people.\nUnfortunately, much of how we are able to show up in public overall is also guided by workplace rules – a clear sign of the death grip that capitalism has on us. Workplaces function as enforcement agents of white supremacy in the office, in ways that inevitably spill over into our lives outside it. As oppressive dress codes limit religious expression, and hair discrimination pushes Black women to alter their natural hair textures, the workplace has become the arbiter of how we are allowed to exist.\nEven higher institutions are complicit in pushing the importance of professionalism. Just a few months ago, Tuskegee University, a historically Black institution, announced a new dress code prohibiting students from wearing bonnets and durags in class or any official campus spaces.\nTheir reasoning? Well, in an email to the student body, the Tuskegee president, Dr Mark Anthony Brown, said the new rules were intended to “prepare [students] with a solid foundation for the workforce.\n“Employers are less forgiving and too often presentation may overrule stellar preparation,” he wrote.\nWe spend far too much time policing irrelevant things like iced coffees, while gen Z languishes in a punishing job market amid the steadily rising cost of living. And as long as we remain beholden to professionalism culture and its shackles, we’ll continue the generational culture wars while young people bear the cost.\n- Tayo Bero is a Guardian US columnist", "translation_ja": "", "vocab": [{"word": "polarizing", "definition": "意見や立場を二つに分ける、対立させる。議論が分かれて対立するような状況を表す。"}, {"word": "discourse", "definition": "特定のテーマについての会話や議論。学術的な議論や社会的な対話を指すことが多い。"}, {"word": "entitled", "definition": "正当な理由なく権利があると思い込んでいる、わがままな。権利意識が過剰である状態を批判的に表現する。"}, {"word": "chasm", "definition": "大きな溝、深い断裂。物理的な溝だけでなく、意見や立場の大きな違いを隠喩的に表す。"}, {"word": "weaponization", "definition": "武器化する、ある物事を意図的に攻撃や抑圧の道具として使用すること。"}]}, {"title_ja": "Rightwing ‘great replacement’ fears mask tech's real great replacement | Jason Stanley", "title_en": "Rightwing ‘great replacement’ fears mask tech's real great replacement | Jason Stanley", "summary_ja": "While adherents to the racist theory condemn a shadowy global elite, Silicon Valley is working toward the replacement of humans with AI Across the world, “great replacement” theory has been employed again and again as the political foundation for fascism . Some of its fundamental tenets, such as the", "summary_en": "While adherents to the racist theory condemn a shadowy global elite, Silicon Valley is working toward the replacement of humans with AI Across the world, “great replacement” theory has been employed again and again as the political foundation for fascism . Some of its fundamental tenets, such as the", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/06/great-replacement-theory-ai", "state_media": false, "category": "オピニオン", "full_text": "Across the world, “great replacement” theory has been employed again and again as the political foundation for fascism. Some of its fundamental tenets, such as the view that “whites are a dying minority”, have been amplified by tech billionaires and their platforms.\nAccording to the version of this theory most employed in Europe and the United States, white replacement theory, white populations are being “replaced” by non-white populations, a replacement engineered by a shadowy global elite. For example, the need for skilled labor is supposedly being used by global elites as an excuse to bring in non-white immigrants to replace white workers.\nGreat replacement theory – a phenomenon Ibram X Kendi extensively documents in his recent book, Chain of Ideas – is the governing ideology of Europe’s far-right parties. It also serves as a justification for the US’s remorseless and violent politics of mass deportation or “remigration”, the term introduced by the far-right Austrian nationalist Martin Sellner in a 2024 book of that title. While a powerful international far right promotes this theory, a real great replacement is happening: of humanity with artificial intelligence.\nAlternative für Deutschland (AfD) is Europe’s most prominent extreme far-right party, whose central platform is, essentially, remigration. Elon Musk is a vocal supporter of this party, having given a speech remotely at the AfD campaign launch in January 2025, stating: “You have to go all out to convince people to vote for AfD.” AfD’s party program for Saxony-Anhalt explicitly uses the concerns of the fake great replacement theory to justify implementing the real one. Point 28 of its agenda for “Immigration and Remigration” begins:\n An AfD-led state government will develop a strategy for Saxony-Anhalt focused on technological upgrading, digitalization, and AI. This strategy is intended to help alleviate bottlenecks in the local labor market. Furthermore, it aims to avoid the immigration of skilled workers from culturally dissimilar backgrounds.\nAfD proposes “financial support for technological upgrading, digitalization, and the use of AI by small and medium sized enterprises through the establishment of a dedicated funding program” as well as other kinds of support for companies to adopt AI. Again, this is not listed as part of AfD’s economic program – that is another section. Replacement of human jobs by AI is rather part of its immigration program – that is, its program motivated specifically by its central ideology of great replacement theory.\nPalantir’s multibillionaire CEO, Alex Karp, while rejecting AfD’s Russia-friendly politics, has argued that AI will make mass migration obsolete, by obviating the need for skilled immigration into western countries.\nAt the same time as the global far right is promoting fear about non-white populations replacing white populations, tech companies are engineering the mass replacement of humanity by AI.\nThe panic about the replacement of white populations by non-white populations distracts attention from this real great replacement.\nThe global elite are in fact in a conspiracy to replace people. But the global elites in this instance are not liberals or Jews or Marxists or Islamists – they are the heads of giant companies. And their productions threaten not the replacement of white people by non-white people – they threaten to replace all people with AI agents.\nOn 18 April, Palantir posted a 22-point summary of Alex Karp and Nicholas Zamiski’s book The Technological Republic: Hard Power, Soft Belief, and the Future of the West. Point 21 was:\n Some cultures have produced vital advances; others remain dysfunctional and regressive. All cultures are now equal. Criticism and value judgments are forbidden. Yet this new dogma glosses over the fact that certain cultures and indeed subcultures … have produced wonders. Others have proven middling, and worse, regressive and harmful.\nAccording to this ideology, what makes for a superior culture are the skills and crafts it nurtures, and the productions (the “wonders”) that are the result of these skills.\nIf the goals of its creators are met, AI will replace human skills, and with it, human skilled production – indeed, even human cognitive skill by the cognitive labor of AI agents. And if you are in the game of ranking cultures, and in the business of replacing human production with AI production, you are going to logically end up with the view that humanity itself should ultimately be discarded.\nTranshumanism is the view, popular among the Silicon Valley tech elite, that humans can be technologically augmented to give rise to a superior species, the “transhuman” (Elon Musk’s company Neuralink is devoted to merging humanity with AI).\nTranshumanism can be viewed as a contemporary version of eugenics, the project of using genetics and selective breeding to engineer supposedly “superior” humans, an endeavor central to Nazism.\nBut I believe almost as popular as transhumanis", "translation_ja": "", "vocab": [{"word": "tenets", "definition": "主義や理論の基本的な信条や原則のこと。政治的・宗教的な信仰体系の中心となる考え方を指す。"}, {"word": "amplified", "definition": "影響力や重要性を増大させること。情報や声が広がり、より大きな効果を持つようになることを表す。"}, {"word": "remigration", "definition": "移民が自国に戻ることを指す造語。特に政治的文脈で使用され、非白人移民の強制送還を含意する。"}, {"word": "remorseless", "definition": "後悔や同情の念がない、冷徹な。道徳的配慮を欠いた行動や態度を表す。"}, {"word": "alleviate", "description": "問題や苦しみを軽減・緩和すること。完全に解決するのではなく、負担を減らすことを意味する。"}]}, {"title_ja": "The New Red Sea Wars", "title_en": "The New Red Sea Wars", "summary_ja": "Conflicts in the Middle East and the Horn of Africa have become inseparable.", "summary_en": "Conflicts in the Middle East and the Horn of Africa have become inseparable.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/middle-east/new-red-sea-wars", "state_media": false, "category": "オピニオン", "full_text": "On June 3, U.S. Secretary of State Marco Rubio told the U.S. Congress that the fighting that had raged for three years in Sudan was now a “proxy war” and blamed Saudi Arabia and the United Arab Emirates (UAE) for frustrating American efforts to bring the conflict to an end. Rubio was saying out loud what many observers already knew: what started as a domestic power struggle has morphed into a wider regional war, drawing in outside powers and spilling across Sudan’s borders.\nThe spread of the conflict in Sudan is part of a larger geopolitical transformation. For much of the past century, policymakers have treated the Horn of Africa and the Arabian Peninsula as separate strategic regions divided by the Red Sea. That distinction is now evaporating. Wars on one side of the sea increasingly alter the military calculations on the other. This entanglement is only deepening in the wake of the United States’ and Israel’s decision in February to launch a war on Iran, driving a deeper wedge between Abu Dhabi and Riyadh (which were already at odds), weakening the American-anchored security order in the region, and underscoring the importance of securing the Red Sea for shipping.\nFor the past decade, the UAE has been the most aggressive outside player in the Horn of Africa, establishing ports and military bases, offering large financial packages to key allies, and involving itself extensively in Sudan’s civil war. But the recent war in Iran, along with the breakdown of the Emirati-Saudi security partnership in Yemen last December, made Riyadh less confident of Washington’s protection, more anxious about the UAE’s security ties to Israel, and more intent on controlling the Red Sea’s security picture. And so as Saudi Arabia has leaned into an alignment with Egypt, Turkey, and Pakistan, it has also brought that alignment to bear to strengthen key partnerships in the Horn. It is trying to counter factions in the Horn that are backed by the UAE or Israel even as it struggles to manage threats from Iran and its allies—including the Houthis, who have seized control of Yemen’s Red Sea coast.\nAt the same time, the risk of conflict is increasing between the Sudanese armed forces (SAF), backed by Saudi Arabia and its allies, and Ethiopia, an ally of the emirates, as well as the chance that another direct war could erupt between Ethiopia and Eritrea. A new war between Ethiopia and Eritrea on the Red Sea would likely turn into a regional conflict that overlaps with the one in Sudan. And it would not only be aggravated by the existing Emirati-Saudi rift—it might well deepen that divide.\nSome Middle Eastern governments once saw the Horn of Africa as a low-stakes theater in which they could compete for leverage at relatively little cost. But as wars in the Middle East and the Horn become inextricably linked, a single security sphere is coalescing. Unless leaders in both the Middle East and the Horn recognize how interconnected their security dilemmas have become, instability will continue to ricochet in both directions, and the overlapping conflicts and disputes will become harder to resolve.\nseparation of powers\nIn some respects, the growing entanglement between the Horn of Africa and the Middle East is a return to a historical norm. Over millennia, the sea connected present-day Djibouti, Eritrea, Ethiopia, and Yemen, and people, goods, and cultural trends moved regularly among them. Amharic, Ethiopia’s dominant language, and Tigrinya, widely spoken in Eritrea and northern Ethiopia, are both Semitic tongues. Christianity spread early to what is now northern Ethiopia, making it home to one of the world’s oldest Christian Orthodox traditions.\nIn the sixth century, an Aksumite ruler based in modern-day Ethiopia briefly conquered parts of Yemen. Not long afterward, the Prophet Muhammad sent some of his earliest followers across the Red Sea to take refuge with a Christian Aksumite king there. Islam later spread across the sea and along Africa’s Indian Ocean coast. From the sixteenth to the twentieth century, the Ottoman Empire ruled territory on both sides of the Red Sea, and Omani rulers built an empire tying the Arabian Peninsula to much of East Africa’s coastline, eventually moving their capital from Muscat to Zanzibar. These links persisted into the modern age. When the Saudi kingdom conquered the Hejaz region on the western Arabian Peninsula in the early twentieth century, elites in the port city of Jeddah sent their families across the Red Sea to Port Sudan for safety. And in April 2023, when war erupted in Khartoum, many Sudanese took refuge in Jeddah.\nStarting in the twentieth century, however, a separation began to harden between the two sides of the Red Sea as European colonialism and nationalist movements severed governance links crisscrossing the Red Sea and the Gulf of Aden. Connections remained—for instance, Persian Gulf wealth flowed to nearby African countries and African labor and exports flowed the other way after a 1970s", "translation_ja": "", "vocab": [{"word": "proxy war", "definition": "代理戦争。大国が直接対立せず、第三国の勢力を支援する形で間接的に戦う紛争のこと。"}, {"word": "morphed", "definition": "変形する、変容する。元の形状や性質から別のものへと段階的に変わることを意味する。"}, {"word": "geopolitical", "definition": "地政学的な。国家間の政治的・軍事的関係が地理的位置や資源に基づいて形成される状況に関する。"}, {"word": "entanglement", "definition": "複雑に絡み合った状態、巻き込まれ。複数の国や利益が相互に結びついて分離不可能な状況を指す。"}, {"word": "evaporating", "definition": "消え去る、蒸発する。物理的または抽象的な区別や違いが徐々に消滅することを意味する。"}]}, {"title_ja": "The Myth of Military Victory", "title_en": "The Myth of Military Victory", "summary_ja": "The dangerous idea driving today’s wars of choice.", "summary_en": "The dangerous idea driving today’s wars of choice.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/myth-military-victory", "state_media": false, "category": "オピニオン", "full_text": "Military victory is an alluring idea. A short, violent campaign that defeats the enemy promises payoffs at a tolerable price. The Trump administration expected such an outcome in Iran in February 2026. The Netanyahu government sought it in Gaza in October 2023, then in Lebanon and Iran. Russian President Vladimir Putin assumed his 2022 invasion of Ukraine would deliver it. Many critics of U.S. policy in Afghanistan and Iraq decry a failure to achieve military victory, contrasting such wars with the decisive battlefield outcomes they believe were achieved in the 1990–91 Gulf War and World War II. And until recently, the debate over U.S. aid to Ukraine featured widespread calls to help the country win a military victory, dismissing negotiations as appeasement.\nYet those who invoke the term rarely define it. “Victory” means achieving the political aims for which one went to war. But “military victory” implies more. The adjective signals that those aims are secured through combat rather than at the bargaining table. Negotiation requires compromise and invites stalling that can exhaust political will. Battlefield victory, by contrast, promises a prostrate enemy with no meaningful choice but to accept the victor’s terms on the victor’s timetable. That promise is what makes the idea so attractive and so ubiquitous.\nBut the notion of military victory is a dangerous myth. All modern wars end in negotiated settlements; talks are not a second-best fallback. To end a war, both sides must choose to stop fighting, and those choices always require nontrivial bargaining. Destruction matters, of course. It is what distinguishes war from peacetime politics. But its role is to shape the bargain, not to annihilate the enemy, which almost never happens.\nThe myth of military victory has repeatedly led governments to start or prolong wars on false premises about how those wars would end. The Trump administration believed force could compel Iran’s unconditional surrender; instead, the United States finds itself in a stalemate. The Netanyahu government’s conviction that it can defeat Hamas militarily has lengthened the Gaza war in pursuit of an unattainable goal. Putin’s expectation of battlefield victory in Ukraine has mired both countries in a war with no apparent endgame.\nIf Chinese leader Xi Jinping makes the same mistake, an attack on Taiwan could ensnare Beijing in a conflict that is easier to start than to stop, with stakes far beyond the Taiwan Strait. And if the United States assumes that it could secure a military victory in a war with China, then it, too, could find itself exhausted in a fight it cannot easily end.\nMuddled thinking about how wars conclude also breeds prewar errors in intelligence, modernization, and force design. And misunderstanding the relationship between bargaining and fighting produces a systematic failure to integrate negotiating strategy with campaign planning. As long as policymakers do not grasp that wars end only when both sides are ready to lay down their arms, they will continue to be frustrated by the inability of military force to achieve their political goals.\nCARTHAGE WAS THE EXCEPTION\nNo modern war has destroyed an enemy’s ability to resist. Combatants can always keep fighting if they choose, even after enemies sweep their military from the field or capture their capital. Such persistence can reverse fortunes and decide wars. Winning a war requires offering surviving (and potential) fighters a deal they prefer to continued resistance. These deals can be one-sided. But terms and bargaining always matter: no war ends unless both sides choose to accept a settlement and stop.\nThe only alternative is to physically annihilate one’s enemies. Rome succeeded in doing so when it ended the Third Punic War by enslaving Carthage’s surviving citizens and, according to legend, salting the city’s ruins so nothing would grow there again. But no war in the modern era has met this criterion, and few have come close. Since the Napoleonic Wars ended, in 1815, the defeated parties in interstate wars have lost a median of eight percent of their forces. In two-thirds of those cases, that figure was under ten percent. The only country to lose more than 90 percent of its forces was Paraguay, in the Triple Alliance War (1864–70). Most belligerents accept defeat—settlement on unfavorable terms—long before their capacity to resist runs out.\nWar-ending settlements can be explicit or tacit. Explicit negotiations involve direct communication, offers, and counteroffers; examples include the Korean War armistice and the 1995 Dayton accords that concluded the Bosnian war. Tacit bargaining uses actions, threats, or declarations to signal acceptance or rejection of terms without formal talks.\nThe 1990–91 Gulf War, for example, ended when the U.S.-led coalition announced a unilateral cease-fire, and the Iraqis stopped fighting, too, without diplomatic exchanges. Combat had shown Iraqi President Saddam Hussein that continued ", "translation_ja": "", "vocab": [{"word": "alluring", "definition": "魅力的で人を惹きつける。ここでは軍事的勝利がいかに人々の心を捉えるかを表現している。"}, {"word": "ubiquitous", "definition": "至る所に存在する、どこにでもある。軍事的勝利という概念がいかに広く信じられているかを示す。"}, {"word": "prostrate", "definition": "打ちのめされた、完全に支配された状態。敵が全面的に屈服した状態を意味する。"}, {"word": "nontrivial", "definition": "些細でない、重大な、簡単でない。ここでは交渉には軽視できない取引が必要であることを示す。"}, {"word": "ensnare", "definition": "罠にかかる、巻き込まれる。中国がある状況に深く引き込まれることを表現している。"}]}, {"title_ja": "The Triumph of Tech-Fueled Propaganda", "title_en": "The Triumph of Tech-Fueled Propaganda", "summary_ja": "America isn’t ready for the next wave of foreign influence operations.", "summary_en": "America isn’t ready for the next wave of foreign influence operations.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/triumph-tech-fueled-propaganda", "state_media": false, "category": "オピニオン", "full_text": "In April and May, hundreds of users of the social media platform Bluesky discovered that their accounts had been hijacked and used to spread content about Ukraine. Researchers at Clemson University later attributed the campaign to the Social Design Agency, a Russian consulting firm sanctioned by the U.S. Department of Treasury for running Kremlin-directed malign influence campaigns. The Bluesky effort turned out to be only one piece of the SDA’s much larger portfolio of recent operations: leaked documents obtained by the news portal Delfi Estonia and shared with the Organized Crime and Corruption Reporting Project revealed plans for real-world acts of vandalism, intimidation, and election interference.\nMost discussions of online influence and disinformation campaigns assume that attacks such as the one on Bluesky are discrete efforts. But as the SDA’s operations show, influence operations are increasingly interconnected and part of propaganda strategies that transcend traditional boundaries. Sophisticated states such as China, Iran, and Russia routinely combine overt public messaging with covert influence and mix broadcast channels with social media platforms. State media outlets, official government accounts, paid influencers, fake personas, hacked accounts, and bot armies are parts of the same system. This integrated approach, which we call “full-spectrum propaganda,” is now the norm for U.S. adversaries trying to spread their message abroad.\nIn full-spectrum propaganda, as we outlined in a recent Security Studies article, the many channels that states can use reinforce each other, making narratives seem more credible and allowing them to proliferate more widely. A story publicized on a state-backed broadcast channel may reach one audience, while social media accounts catch the attention of another. Official outlets can quote from posts on fake accounts whose creators masquerade as ordinary members of the public, making a fringe claim seem normal. Paid influencers can tailor messages in a style that resonates with niche audiences. The rapid expansion of artificial intelligence is making this strategy even more powerful: states are increasingly integrating AI into every level of their propaganda operations, allowing small groups or individuals to conduct propaganda campaigns that would previously have required far greater resources.\nStrategies that merely address discrete foreign influence campaigns will fail to meet the challenges presented by full-spectrum propaganda. The United States needs to be able to understand, assess, and counter influence operations holistically, yet as the threat grows, the United States has been undercutting the capacity that would allow it to do so. Politicians have been dismantling the government agencies designed to track foreign influence, and social media companies are raising barriers to research on their platforms, leaving the country unprepared. As AI accelerates the spread and expands the reach of global propaganda, Washington is blinding itself to the challenge.\nEVERYTHING EVERYWHERE ALL AT ONCE\nFor much of the last decade, politicians and the public understood foreign influence operations on social media through the parts that first became visible. Most often, this would be a network of fake accounts discovered by social media companies as part of their efforts to eliminate bots, scams, and online deception on their platforms. After taking down such accounts, companies would write reports and researchers (including us) would publish analyses to explain the evolving tactics, techniques, and procedures of online influence campaigns. The focus on the specifics of each individual operation led people to think of the threats as narrow, distinct incidents.\nBut the fragment of what is visible is not the whole story. State-backed propagandists do not have to choose between state media and fake accounts, between covert personas and overt broadcasters, or between a spoofed media outlet or a Telegram channel. They can use all of them together—and they are increasingly doing so.\nThe SDA, for instance, documented its own work in the style of a consultancy reporting to a client. That client, the leaked documents suggest, was the administration of Russian President Vladimir Putin, whose officials appear in the agency’s internal communications overseeing its work. The consulting firm’s covert operations are just one component of a much broader Russian propaganda apparatus that also includes state media networks, official government channels, and fake personas. Moscow and its proxies use all of these tools in tandem to amplify propaganda messages and reach many types of audiences.\n Looking at foreign influence campaigns as a social media problem is too limited.\nAs the Organized Crime and Corruption Reporting Project and other news outlets explained, the SDA was behind a fake video in June 2025, branded to appear as if it were made by the Saudi media outlet Al Arabiya, which claimed t", "translation_ja": "", "vocab": [{"word": "malign", "definition": "悪意のある、有害な。ここでは、クレムリンが指揮する有害な影響キャンペーンを指すように、国家が意図的に引き起こす悪意のある活動を説明するために使用されています。"}, {"word": "portfolio", "definition": "複数のプロジェクトや事業のまとまった集合。この文脈では、ロシアの機関が実行している様々な作戦や活動の総体を指しています。"}, {"word": "transcend", "definition": "～を超える、越える。ここでは、プロパガンダ戦略が従来のメディアとデジタルメディアなどの伝統的な境界線を越えていることを表しています。"}, {"word": "proliferate", "definition": "急速に増える、広がる。この文脈では、プロパガンダのナラティブがあらゆるチャネルを通じて広く普及することを意味しています。" let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-07 00:12 JST";
  renderTabs();renderList();
})();
</script>
