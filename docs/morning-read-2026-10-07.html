y person to survive a lethal injection.\nHer lawyers called her progress \"medically unprecedented\", and while her prognosis remains unclear, \"at a minimum, we expect a long recovery\".\nDeborah Denno, a criminologist and professor at Fordham Law School, said she was \"absolutely astonished\" that Pike is conscious and speaking.\nThere were seven other cases where prisoners survived slated executions, but in those cases, executioners were not able to inject anything into the inmates' veins, Denno told the BBC.\nPike \"is the only person for whom some kind of toxin has been injected,\" she said.\n\"They did everything they were supposed to do as part of the execution process, and it simply didn't work,\" Denno said. \"This has never happened before.\"\nAuthorities have not yet said whether they will try again to execute Pike. They have also not offered an explanation for what went wrong after injecting her with the chemical pentobarbital.\nTennessee Governor Bill Lee suspended all executions for the rest of the year - and the head of prisons in the state said over the weekend that he plans to resign.\nPike was 18 when she and her then-boyfriend, Tadaryl Shipp, beat, tortured and killed 19-year-old Slemmer, whom they had met at a job training camp for troubled teens.\nPike's attorneys are scheduled to appear in court in Nashville on Wednesday. They also plan to hold a news conference outside the court.\nDr Joel Zivot, an anaesthesiologist advising Pike's defence team, said on Tuesday that the likelihood of recovering from lethal injection is low.\n\"Most people who get lethal injection die from it,\" he told the BBC. \"In fact, pretty well everyone, except Christa. So, the fact that she survived it ... was unusual.\"\nBut there remains a lot of uncertainty and many unknowns, he said, including how much of the pentobarbital got into her system, what her blood levels were after the injection and what her recovery will look like.\n\"I would not, in any way, say at this es for schools and an end to what they called police repression.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8x23706pvz3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Tear gas in Paris and Marseille as school protests grow across France\n- Published\nHundreds of thousands of people have taken to the streets across France, as a wave of protests by high-school pupils spread to their parents, university students and unions.\nCrowds of teenagers marched from the Place de la République in Paris, calling for more resources for schools, and what they called less repression from police.\nPolice clashed with demonstrators in Lyon, used tear gas in Paris and Marseille and water cannon in Rennes, but there was little of the serious trouble that marred previous protests.\nPrime Minister Sébastien Lecornu condemned the earlier violence and said since the protests had begun 215 students and 85 staff had been hurt as well as 715 police officers.\nThe government said there had been disruption in 891 high schools on Tuesday - almost a quarter of all lycées - and said more than 250,000 demonstrators had taken to the streets during the day.\nStudents' unions put the number at 450,000, and said the number of high schools blockaded was 1,800 on what the protesters dubbed \"Act Three\" of their movement.\nIn Marseille, thousands of demonstrators moved around this city, stopping momentarily to chant before moving on as police changed direction.\nA group of masked protesters grabbed bollards and bins and tried to barricade themselves off from police. Riot officers fired tear gas, and the protesters dispersed.\n\"Most of us aren't violent,\" said Alissa, a student in Marseille. \"We're going to the streets because they've closed our schools... schools are falling apart.\"\nHer friend, Sacha, said the ceilings in Marseille's schools were leaking and conditions were generally rather poor, \"so we can't reall ed in unclear circumstances near a school in the northern city of Lens.\nAuthorities say he picked up the \"sting ball\" grenade which then exploded, but students allege he was hit directly after an officer fired.\nThe grenade is considered a non-lethal weapon and the local prefect has said the incident took place when police were confronted by a group of 200-250 students throwing stones and fireworks.\nWhat began with local anger at overcrowded classrooms, a lack of teaching staff and dilapidated school buildings in the northern Paris suburb of Seine-Saint-Denis in mid-September has since spread across the country, and extended to some universities too.\nLate on Tuesday, the French interior ministry said a total of 6,547 had been stopped or arrested by police since 28 September.\nTuesday's protests drew people of all ages. One couple in their 70s, Alain and Michèle, joined the march in central Paris, to show their support for young students, explaining that as former teachers they understood the problems that France's education system was facing.\n\"We are the grandparents of three students who are all mobilised. They have protested peacefully in front of their respective high schools in Paris in recent days, but they were still tear-gassed,\" Alain told the BBC, his voice trembli", "translation_ja": "", "vocab": [{"word": "repression", "definition": "抑圧や弾圧のこと。政府や権力者による国民の行動や表現の自由を無理に抑える行為を指す。"}, {"word": "disruption", "definition": "混乱や妨害のこと。通常の活動や秩序が乱される状態を表す。"}, {"word": "blockaded", "definition": "封鎖する、遮断するという意味。ここでは学校の出入口を塞いで機能を停止させることを指す。"}, {"word": "radical-left", "definition": "急進的左翼のこと。従来の左翼政党よりも急進的で革命的な政治姿勢を持つ勢力を表す。"}, {"word": "infiltrated", "definition": "浸透する、潜入するという意味。組織や集団の中に密かに入り込むことを指す。"}]}, {"title_ja": "Former German spy chief arrested for espionage and treason", "title_en": "Former German spy chief arrested for espionage and treason", "summary_ja": "August Hanning is accused of obtaining classified information for a foreign power.", "summary_en": "August Hanning is accused of obtaining classified information for a foreign power.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c58jzyer1kr0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Former German spy chief arrested for espionage and treason\n- Published\nFormer German spy chief August Hanning has been arrested on suspicion of espionage, treason and obtaining classified information for a foreign power, the German Federal Prosecutor's Office says.\nHanning headed the Federal Intelligence Service (BND) from 1998 to 2005 and has since been working as a private consultant.\nProsecutors allege that he used classified intelligence to \"draft an analysis\" for one foreign intelligence service and maintained contact with another foreign spying service. Investigators have not disclosed which foreign powers were involved.\nPolice also arrested former BND employee Manfred D, accusing him of passing Hanning about 2,000 classified documents for money.\nManfred D, who was Hanning's bureau chief and remained in the BND until this year, is charged with aiding and abetting attempted treason and treasonous espionage.\nLocal media reported Hanning was arrested at his home in Nordwalde near Münster while Manfred D was arrested in Bavaria. Hanning is due in court on Wednesday and Manfred D will appear on Tuesday.\nProsecutors say Manfred D, who also served as the chief of staff for Hanning's successors between 2012 and 2026, used his role to gain access to highly confidential information which he then passed on to Hanning \"in exchange for remuneration\".\n\"The current findings suggest that, over the years, Manfred D provided Hanning with approximately 2,000 documents, many of which contained classified information to be used exclusively by the Federal Intelligence Service for internal purposes,\" the statement says.\n\"On one occasion, Hanning used classified intelligence ... to draft an analysis for an officer of a foreign intelligence service,\" prosecutors said, noting it was not clear if \"the material reached the intended recipient\".\nHanning is also accused of being \"in close contact with a representative of another foreign intelligence service, to whom he passed on political information, partially based on material provided by Manfred D, for several years\".\nLocal media say Hanning's alleged possession of intelligence documents came to light during a separate case relating to German steakhouse heiress Christina Block.\nHamburg public prosecutor's office accused Block of orchestrating the kidnapping of her two youngest children in 2023 due to a custody dispute. Investigators allege Hanning was involved in an earlier attempted kidnapping of the children, which he denies.\nState criminal police officers reportedly discovered an electronic data storage device containing sensitive information including recent BND documents.\nIt is not the first time the BND has faced similar controversy. A high-ranking German intelligence officer was charged with treason in 2023 for allegedly passing state secrets to Russia.\nProsecutors alleged Carsten L shared intelligence about the war in Ukraine and the Wagner mercenary group and received roughly €400,000 ($450,000; £340,000). His trial is ongoing.", "translation_ja": "", "vocab": [{"word": "espionage", "definition": "スパイ活動や諜報活動のこと。他国の機密情報を秘密裏に入手する違法行為を指す。"}, {"word": "treason", "definition": "反逆罪のこと。自国の政府や君主に対する裏切り行為。重大な犯罪と見なされる。"}, {"word": "remuneration", "definition": "報酬や給与のこと。労働やサービスに対する金銭的な対価を意味する。"}, {"word": "aiding and abetting", "definition": "共犯または幇助のこと。犯罪者を手助けまたは支援する行為を法律用語で表現する。"}, {"word": "confidential", "definition": "機密の、秘密の、という意味。限られた人々にのみ知らされるべき情報を指す。"}]}, {"title_ja": "Three arrested after raid on gang accused of helping migrants pretend to be gay to get asylum", "title_en": "Three arrested after raid on gang accused of helping migrants pretend to be gay to get asylum", "summary_ja": "Those targeted by Home Office immigration enforcement officers are accused of charging migrants up to £4,500 for fabricated evidence.", "summary_en": "Those targeted by Home Office immigration enforcement officers are accused of charging migrants up to £4,500 for fabricated evidence.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmp3gnd1e4gyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Three arrested after raid on gang accused of helping migrants pretend to be gay to get asylum\n- Published\nImmigration enforcement have made arrests in connection with a suspected criminal network believed to be behind dozens of fake asylum claims from people pretending to be gay.\nIt follows a BBC investigation earlier this year, which revealed that law firms and advisers were helping migrants pose as gay in an effort to get asylum.\nThose targeted by Home Office immigration enforcement officers this morning are accused of charging migrants up to £4,500 for fabricated evidence, including staged photographs and fake documents.\nThey are thought to have aided dozens of asylum claims from Bangladeshi men, claiming they would be in fear for their lives if they returned home.\nTwo people were arrested at addresses in London this morning on suspicion of fraud and immigration offences, with Home Office officers also seizing phones, jewellery and thousands of pounds in cash. A third person was arrested on suspicion of being in the country illegally.\nChris Foster, a regional lead for criminal investigations at the Home Office, said the fake claims were connected to a Bangladeshi community LGBT organisation called Apanjon, which is based in Whitechapel, east London.\nHe said asylum caseworkers had initially spotted patterns in suspicious claims, which raised concerns about the group, and that immigration officers had been investigating for several months.\n\"We've got some intelligence that they can provide fake letters and documents, and they could charge anywhere between £1,000 and £4,500,\" Foster said.\n\"It could be letters of support from Apanjon, it could be staged photographs, suggesting that these people are gay, it could be letters from people claiming to be in a friendship or a sexual relationship - [a] same-sex relationship - as the claimants.\"\nMore than 100 asylum claims linked to the criminal network are being reviewed by the Home Office. Foster said some of the fake asylum applications would have \"undoubtedly\" been granted.\nImmigration judges have previously criticised evidence from Apanjon as unreliable or not credible and found that an applicant who claimed to have attended the group's events had submitted staged photographs.\nThe Home Office said the group would often vouch for men who claimed asylum on the basis they were gay only after having initially been refused on political grounds. In one case, a man didn't raise his sexuality until nine years after his original claim.\nThe group is accused of using the same tactics as those pushed by advisers exposed in the BBC's investigation earlier this year.\nA Home Office spokesperson said it was continuing to review asylum claims linked to that reporting, which led to two arrests in May.\nIn the BBC report, published in April, an adviser called Tanisa Khan told an undercover reporter she could provide a \"comprehensive package\", including photographs at gay clubs and other supporting evidence.\nShe was linked to a community group called Worcester LGBT, which she told the reporter they should attend in order to add to evidence for his fake claim.\nMen attending one of the group's events at a community centre in Beckton, east London, claimed they were not really gay. One said: \"Nobody is a gay here. Not even 1% are gay. Not even 0.01% are gay.\"\nThe investigation also revealed how bogus medical conditions and fake news websites were being used to bolster fraudulent asylum claims.\nWorcester LGBT has since closed. Its founder previously said the group did not create or support fabricated evidence in asylum claims and it was not up to the organisation to determine whether any individual was actually gay.\nKhan blamed communication difficulties for a \"misunderstanding\" and denied advising the reporter to make a false claim or offering to create fabricated evidence.\nHome Secretary Shabana Mahmood said \"those faking persecution are beneath contempt and mock real victims who need protection\".\n\"To the gangs profiting from this disgraceful fraud: you will be prosecuted, stripped of your dirty money and shut down,\" she said.\n\"And to those cheating the system, your claim will be thrown out, and you will be removed from this country.\"\nA conviction for asylum fraud carries a maximum sentence of up to 10 years in prison.", "translation_ja": "", "vocab": [{"word": "fabricated", "definition": "偽造された、作られた。証拠や文書などが意図的に偽りの内容で作成されたことを意味する。"}, {"word": "caseworkers", "definition": "個々の案件を担当する職員。移民局や福祉機関などで個別のケースを処理・調査する専門家を指す。"}, {"word": "vouch", "definition": "保証する、身元引受人になる。ある人物の信頼性や正当性について公式に確認・支持することを意味する。"}, {"word": "credible", "definition": "信頼できる、信憑性のある。証拠や証言などが十分な根拠があり信じるに値することを表現する。"}]}, {"title_ja": "Asos confirms hackers sent 'unauthorised' notification to app users", "title_en": "Asos confirms hackers sent 'unauthorised' notification to app users", "summary_ja": "Asos confirmed an \"unauthorised customer notification\" was sent out via its app on Tuesday, after users raised alarm.", "summary_en": "Asos confirmed an \"unauthorised customer notification\" was sent out via its app on Tuesday, after users raised alarm.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cj62ylzpr6d3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Asos confirms hackers sent 'unauthorised' notification to app users\n- Published\nAsos says it is investigating \"unauthorised activity\" involving third-party platforms it uses after customers received a notification from its app sent by hackers.\nDozens of people told the BBC they received the strange \"ASOS HACKED\" message from the clothing and beauty store's app on Tuesday morning - with some saying it left them \"scared\" to open the app.\nThe notification was addressed to the company's data protection officer and IT teams in what cyber security experts said looked like a \"brazen\" extortion attempt.\nAsos acknowledged the \"unauthorised customer notification\" on Tuesday afternoon, saying some \"basic personal information\" may have been accessed.\nIn an email to customers on Tuesday night, the company apologised and urged customers not to engage with the notification. And it said the website and app are \"operating as usual\" promising customers they can \"shop with confidence\" while it investigates the incident.\nThe company has not as of yet informed the UK's data watchdog, the Information Commission's Office (ICO), about any breach.\nExactly how many Asos customers received the notification on Tuesday remains unclear, but Google's Play store says the ASOS app has been downloaded to android devices more than 10 million times.\nThe British retailer has a substantial global footprint - serving around 17 million customers each year across more than 150 markets.\nSome Asos app users in Australia, France, Sweden and the Republic of Ireland had also received the notification, according to local reports on Tuesday.\nHackers seeking to pile pressure on potential victims by informing their customers is rare, as most extortions happen in private, so this incident may go down as a significant moment in cyber-attack history.\nShares in the company fell by around a tenth on Tuesday.\nCharlotte Wilson, head of enterprise at cyber-security firm Check Point, called it a \"deeply serious\" and \"brazen\" attack whereby the hackers had apparently \"turned Asos' own app into their ransom note\".\nBut she told the BBC that Asos customers should not be \"scared and frightened\" - encouraging those worried to change their passwords, avoid clicking on the notification's link and be cautious about possible scam emails or texts.\n- What can I do to protect myself after 'Asos hacked' message? \n  - Published4 hours ago\nExtortion message\nUsers of the Asos app appeared to have received the alarming notification at around 10:00 BST on Tuesday.\nHeadlined \"ASOS HACKED\" and addressed to the company's data protection officer and IT teams, it said: \"We have fully compromised the Snowflake instance.\"\n\"Engage with us, or we will leak it,\" it added, before linking to a Telegram channel.\nThe message left many ASOS customers confused.\n\"At first I thought it was an ad or a fun promotion like 'ASOS HACKED get 50% off everything for a limited time only',\" Jodie, an analyst from Edinburgh, told the BBC.\n\"Then I read the rest of the message which clearly showed that it wasn't an ad and instead a message to IT.\"\n\"My main concern is that my information, such as bank information, home address, telephone number, has been compromised,\" said Erin, a student at the University of Sheffield.\nShe told the BBC that while her friends have expressed similar concerns about a potential data leak, her sister did not receive the notification on the Asos app.\n\"So the question is what is the extent? Are all customers affected even if they didn't get the notification? It's poor from Asos on all fronts.\"\nAsos said in its statement that it took \"immediate action to restrict access to the notification platforms\" on Tuesday - adding it was working with specialists within and outside the company, as well as relevant authorities.\nIt said it does not believe payment-card information or account passwords were impacted, and that its site and app are \"operating as normal\".\n\"Customer trust is incredibly important to us, and if the situation changes an update will be provided as appropriate,\" it said.\nThe BBC understands the National Cyber Security Centre has offered assistance to Asos.\nMeanwhile Snowflake - whose tools are used by dozens of firms to collect, analyse and store data - told the BBC its investigation was ongoing, but it had so far found \"no compromise\" of its platform.\nThe company's services have, however, been the subject of many high profile data breaches in recent years.\nAccording to cybersecurity expert Jen Ellis, Snowflake collects data from multiple sources for analysis, and an \"enormous\" firm like Asos will have lots of data about how people shop globally.\nHowever Dan Bird, from cybersecurity firm Horizon3, said the message implied the apparent hackers' access had gone beyond the Snowflake database.\n\"Sending a push notification to Asos's app users would require access to the company's notification system, which is separate from the Snowflake data platform the attackers claim to have compr", "translation_ja": "", "vocab": [{"word": "brazen", "definition": "厚かましい、大胆不敵な。ここでは、堂々と公然と行われた大胆な犯罪行為を指す。"}, {"word": "extortion", "definition": "恐喝、脅迫による金銭要求。犯罪者が被害者に対して脅迫によって金銭や利益を無理やり奪う行為。"}, {"word": "breach", "definition": "違反、侵害、またはセキュリティシステムの破られた状態。データ漏洩やセキュリティ侵害を意味する。"}, {"word": "footprint", "definition": "足跡、痕跡、または企業などの事業展開範囲。ビジネスの規模や影響範囲を表す。"}, {"word": "incident", "definition": "事件、出来事。特にネガティブな予期しない出来事を指し、ビジネスやセキュリティの文脈で頻出する。"}]}, {"title_ja": "British national arrested in connection with RAF Fairford incident", "title_en": "British national arrested in connection with RAF Fairford incident", "summary_ja": "It is the seventh arrest in connection to the incident near RAF Fairford last month.", "summary_en": "It is the seventh arrest in connection to the incident near RAF Fairford last month.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqlye0xd72wdo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "British national arrested in connection with RAF Fairford incident\n- Published\nA 22-year-old British national has been arrested on suspicion of preparation of terrorist acts in connection with an incident close to RAF Fairford, counter-terror police said.\nHe was arrested in Westminster, London, on Tuesday as part of the investigation into the incident near the airbase in Gloucestershire on 27 September.\nIt is the seventh arrest in connection to the incident but no one has been charged.\nA major incident was declared and dozens of homes were evacuated after police were alerted to three \"suspicious vehicles\" near the airbase.\nSenior national coordinator for Counter Terrorism Policing, Vicki Evans, said it \"remains a live investigation\" and police are continuing to \"pursue multiple lines of enquiry\".\nFive men were arrested on 27 September near the base in connection with the incident and were subsequently released on police bail.\nThe men, aged between 23 and 25, were detained in the early hours of the morning after vehicles were reported to be travelling towards the base.\nThey were arrested on suspicion of explosives offences and later on suspicion of preparing a terrorist act, before being released on bail in what police called an \"investigative decision\" that was \"grounded in experience and strategy\".\nA sixth man, a 25-year-old dual Iranian-British national, was arrested on 1 October in Westminster and was also later released on bail.\nRAF Fairford, near the village of Whelford, has been used by the US Air Force for decades.\nIn recent months, the US has flown B-1 and B-52 bombers from the base to the Middle East, after the UK approved a request for Fairford to be used for defensive strikes against Iran.\nOn Sunday, it emerged the US had pulled its bombers out of the base and returned them to America.\nUS President Donald Trump said the aircraft were removed due to \"some threats\" to the base without giving specific details.\nWhile speaking to a group of reporters outside the White House on Monday, Trump was asked if a \"specific threat\" had led the US to pull its bombers from the airbase.\nHe replied: \"Yeah I think we can say that. They didn't fly out by accident.\n\"There were some threats. And rather than tempting the enemy, we'll capture the enemy and beat the enemy.\n\"But why should we leave them there? So we moved them around a little bit. Not very far.\"\nEarlier, US Vice-President JD Vance said the bombers were moved \"out of an abundance of caution\".\nThe comments came after US media reports suggested the decision was made after intelligence suggested Iran was plotting a drone attack. The BBC has not verified those reports.\nOn Tuesday, a spokesperson for US European Command, which coordinated American military activity in Europe, said it would be \"inappropriate to discuss matters of intelligence\" but that the US would \"continue to assess the threat environment\" at bases.\nThe spokesperson added the US remains at the \"highest state of readiness\" and would take \"appropriate actions to protect our people, our platforms, and the bases where our forces operate\".\nPrior to Trump's intervention on Monday, a No 10 spokesperson had insisted RAF Fairford was safe and pointed to his previous comments, where he praised the UK's \"police, defence and security services\" in relation to the base.", "translation_ja": "", "vocab": [{"word": "counter-terror", "definition": "テロ対策に関する。テロ行為を防止・制圧するための活動や組織を指す。"}, {"word": "airbase", "definition": "空軍基地。軍用飛行場のこと。航空機の運用や軍事作戦の拠点となる施設。"}, {"word": "suspicious", "definition": "疑わしい、不審な。犯罪や危険の可能性があると考えられる状態を表す。"}, {"word": "bail", "definition": "保釈金。被告人が釈放される条件として支払う金銭、または釈放そのものを指す。"}, {"word": "abundance of caution", "definition": "念のため、用心のために。リスク回避のため予防的に行動することを意味する表現。"}]}, {"title_ja": "Christa Pike awake after failed Tennessee execution: lawyers", "title_en": "Christa Pike awake after failed Tennessee execution: lawyers", "summary_ja": "A death row inmate who survived a botched execution last week is conscious and talking in hospital, according to her lawyers, who want to commute her death sentence to life imprisonment without parole.", "summary_en": "A death row inmate who survived a botched execution last week is conscious and talking in hospital, according to her lawyers, who want to commute her death sentence to life imprisonment without parole.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/christa-pike-awake-after-failed-tennessee-execution-lawyers/a-79569867?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Christa Pike awake after failed Tennessee execution: lawyers\nOctober 7, 2026\nA prisoner who survived an attempt to carry out the death penalty in Tennessee, the United States, last week is conscious and speaking as she continues to receive treatment in hospital.\n\"Against all odds, Christa Pike is conscious, speaking, and continues to receive critical medical care,\" the inmate's attorneys said in a statement on Tuesday.\n\"Despite the severe damage she endured to her arms, she is still handcuffed and shackled to the bed. Her recovery is medically unprecedented.\"\nPike, who was sentenced to death for the beating, stabbing and murder of a classmate in 1995, survived two doses of the lethal injection drug pentobarbital – which her lawyers said left her arms burned and blistered.\nChrista Pike not 'free of further serious risk'\n\"She's still in the ICU,\" said Dr. Joel Zivot, a professor of anesthesiology and surgery in Atlanta in neighboring Georgia, who consulted as an expert for Pike's legal team.\n\"She has recovered to a certain degree that she's able to be off a ventilator and able to speak, but in no way would I announce her free of further serious risk. There's still a lot of bad things that can happen here, even when everyone is doing their job well.\"\nTuesday's updates were the first indication that Pike's condition has improved since the failed execution attempt at a Nashville prison last Wednesday.\nHer attorneys thanked first responders and medical staff who they said have \"treated Christa like a human and have provided exceptional care to her\" – as they prepare to go to court on Wednesday seeking to learn more about what went wrong with the lethal injection.\nPike's attorneys seeking to commute sentence\nThe lawyers are seeking a court order requiring the Tennessee Department of Correction to preserve evidence, including drug lot numbers, records and other information from the attempted execution.\nUltimately, they are looking to have Pike's sentence commuted to life in prison without the possibility of parole.\nWhile Dr. Zivot said Pike's current state \"bodes well for a good recovery,\" her attorneys warned that her prognosis is still \"unclear\" and said she faces \"a long recovery.\"\n\"Christa is a survivor and will take recovery one day at a time,\" they said.\nAccording to the Death Penalty Information Center, which publishes data and analysis on capital punishment in the United States, Pike is the first prisoner ever to survive \"after being injected with lethal doses of execution drugs.\"\nEdited by: Rana Taha\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "lethal", "definition": "致命的な、死をもたらす。毒性物質や危険な状況が人命を奪う能力を持つことを指す。"}, {"word": "unprecedented", "definition": "前例のない、これまでに起こったことのない。医学的または科学的な文脈で、新しい記録や異例の事例を説明する際に使用される。"}, {"word": "commute", "definition": "（刑罰を）減刑する、軽減する。裁判所または行政機関が懲役刑を短縮したり、より軽い刑罰に変更する法律的行為。"}, {"word": "prognosis", "definition": "予後、将来の見通し。医学用語として、患者の病状や回復の可能性について医師が示す見通しや予測。"}, {"word": "preserve", "definition": "保存する、守る。証拠や記録を法廷での使用のために維持し、改ざんや破棄から保護すること。"}]}, {"title_ja": "Munich up against at least six competitors for 2036 Olympics", "title_en": "Munich up against at least six competitors for 2036 Olympics", "summary_ja": "The International Olympic Committee has revealed the six other countries intending to bid for the 2036 Olympic Games. This comes after Germany selected Munich as its Olympic candidate.", "summary_en": "The International Olympic Committee has revealed the six other countries intending to bid for the 2036 Olympic Games. This comes after Germany selected Munich as its Olympic candidate.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/munich-up-against-at-least-six-competitors-for-2036-olympics/a-79566678?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "2036 Olympics: Munich up against at least six rivals\nOctober 6, 2026\nMunich's bid for the 2036 Summer Olympics will be up against at least six candidates from Europe, Asia and Africa. On Tuesday, the International Olympic Committee (IOC) announced that, in addition to Germany, Hungary, Turkey, India, Qatar, South Korea and South Africa all intend to bid for the Games. All are currently engaged in the Continuous Dialogue stage of the bidding process with the IOC.\nHowever, there could be further applicants, as the deadline for interested parties to submit a bid is October 31. The candidates are to present their plans virtually to the Future Host Commission in November. In March 2027, the IOC is to deliberate, analyze, and narrow down the field of applicants to a group selected to enter into the Strategic Dialogue stage.\nA subsequent Targeted Dialogue stage with one or more bidders is planned for 2028, with the final decision on the 2036 Olympic host expected at the IOC Session in the summer of 2029.\nHowever, the IOC did not disclose exactly which cities, alongside Munich, are in the running – although Ahmedabad, Doha, Budapest and Istanbul are seen as possible hopefuls.\nMunich secured its bid late last month after beating the Cologne/Rhine-Ruhr region in a vote by delegates of the German Olympic Sports Confederation. The city last hosted the Games in 1972. Berlin had withdrawn its bid in the days leading up to the vote.\n'Best possible experience for the athletes'\n\"Wherever the Games take place, one thing must never change: Athletes have to be at the heart of everything we do,\" IOC President Kirsty Coventry said.\n\"As an athlete, you spend years working to make your Olympic dream come true. The experience you have when you finally reach the Olympic Games stays with you for the rest of your life,\" added the former swimmer who won gold in the 200-meter backstroke for Zimbabwe at the 2004 Athens and 2008 Beijing Summer Games.\n\"That is why, for every future host, delivering the best possible experience for the athletes must always be the starting point.\"\nMunich bid sees itself as well-positioned\nThe IOC is to evaluate the bidders' proposals based on \"technical factors.\" These include a master plan for competition venues and the athlete experience, the financing strategy, political and public support, the capacity to deliver the event, and a sustainability strategy. The German Olympic Sports Confederation believes Munich is well-positioned in all these areas.\nThe Munich bid is not focused solely on 2036 but was also designed with 2040 and 2044 in mind. If it misses out on 2036, Munich can expect to face a similarly large pool of competitors for the following two Summer Games. According to an IOC statement, there are National Olympic Committees \"taking part in noncommittal talks with the IOC about hosting future Olympic Games beyond 2036.\"\nThis article was adapted from German.", "translation_ja": "", "vocab": [{"word": "deliberate", "definition": "慎重に検討する、熟考する。重要な決定を下す前に十分な時間をかけて考えること。"}, {"word": "disclose", "definition": "情報や事実を明かす、公開する。秘密にしていたことを公表すること。"}, {"word": "applicant", "definition": "申し込み者、応募者。特定の立場や機会を求めて正式に申請する人。"}, {"word": "sustainability", "definition": "持続可能性、継続可能性。長期間にわたって維持・継続できることを指す環境・経済用語。"}]}, {"title_ja": "French AI company announces new, private model", "title_en": "French AI company announces new, private model", "summary_ja": "The company's new model, named \"Le Chonk,\" is its first release in five months. Mistral says it outruns some of its Chinese competitors in several areas.", "summary_en": "The company's new model, named \"Le Chonk,\" is its first release in five months. Mistral says it outruns some of its Chinese competitors in several areas.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/french-ai-company-announces-new-private-model/a-79569597?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "Mistral: French firm announces Le Chonk, a private AI model\nOctober 6, 2026\nFrenchtech company Mistral on Tuesday announced the upcoming release of \"Le Chonk,\" its biggest AIopen-weight model, aimed at users wanting to keep their data private.\nPopular AI models from companies like Anthropic and OpenAIrely on closed models.\nLe Chonk, officially named Mistral Large 4, will be made publicly available on October 27, with cybersecurity experts and government authorities receiving access to a version of the model with fewer safety restrictions to test its capabilities.\nLast month, Mistral raised €3 billion euros ($3.4 billion), Europe's biggest technology fundraising.\nThe new AI model allows users to download and customize \"weights\" that determine how it computes on their own servers.\nAn open-weight model means a user can download the software and run it on their own hardware. While the top US models run on their own models, many of their Chinesecompetitors are open-weight.\nEurope's AI hope\nMistral, considered Europe's leading AI company, said the new model outperforms many rival open-weight models.\nLe Chonk is the three-year-old company's first new model release since May.\nAccording to Mistral CEO Arthur Mensch, the new model is \"actually above the Chinese models\" in certain areas, including cyber.\n\"The narrative that Europe cannot compete is something that is not true,\" Mensch said at the company's event in Abu Dhabi, without specifying which Chinese models he was referring to.\nMIstral has positioned itself as a safer European alternative in comparison to its main US competitors, especially given the latter companies' recent warnings regarding AI's dangers.\nEdited by: Sean Sinico\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "open-weight", "definition": "AIモデルにおいて、ユーザーがソフトウェアをダウンロードして自身のサーバーやハードウェア上で実行・カスタマイズできる公開型の構造を指す。プロプライエタリなクローズドモデルの対義語。"}, {"word": "customize", "definition": "特定のニーズや要件に合わせて製品やサービスを修正・調整すること。ここではAIモデルのパラメータを個別の用途に最適化することを意味する。"}, {"word": "outperforms", "definition": "競合他社や他製品よりも優れた成果や性能を発揮すること。比較対象となるものより高い効率性や品質を示す。"}, {"word": "proprietary", "definition": "企業や個人が独占的に所有・管理する技術やシステムのこと。外部利用者は完全なアクセスや改変ができない限定的な性質を持つ。"}, {"word": "narrative", "definition": "特定の観点や立場から形成された物語や言説。ここでは「ヨーロッパは競争できない」という主張や見方を指す。"}]}, {"title_ja": "Christa Pike conscious and speaking after botched execution: Attorneys", "title_en": "Christa Pike conscious and speaking after botched execution: Attorneys", "summary_ja": "Christa Pike is conscious and speaking nearly a week after a botched execution left her critically injured and temporarily on a ventilator, her attorneys said Tuesday.", "summary_en": "Christa Pike is conscious and speaking nearly a week after a botched execution left her critically injured and temporarily on a ventilator, her attorneys said Tuesday.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/christa-pike-conscious-speaking-after-botched-execution-attorneys/story?id=137039461", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Chicago woman shot 5 times by an immigration officer sues the US government", "title_en": "Chicago woman shot 5 times by an immigration officer sues the US government", "summary_ja": "An American-born citizen who survived being shot by a federal immigration officer in Chicago is suing the US government.", "summary_en": "An American-born citizen who survived being shot by a federal immigration officer in Chicago is suing the US government.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/chicago-woman-shot-5-times-immigration-officer-sues/story?id=137032935", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Kenya confirms first Ebola case as virus ‘surges’ in DR Congo province", "title_en": "Kenya confirms first Ebola case as virus ‘surges’ in DR Congo province", "summary_ja": "Health minister says 28 contacts identified after death of citizen who arrived from DRC on Saturday Kenya has reported its first-ever Ebola death, the health minister announced on Tuesday, as the disease continues to spread rapidly through the north-east of the Democratic Republic of Congo (DRC), wh", "summary_en": "Health minister says 28 contacts identified after death of citizen who arrived from DRC on Saturday Kenya has reported its first-ever Ebola death, the health minister announced on Tuesday, as the disease continues to spread rapidly through the north-east of the Democratic Republic of Congo (DRC), wh", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/06/kenya-first-ebola-case-death-drc", "state_media": false, "category": "政治", "full_text": "Kenya has reported its first-ever Ebola death, the health minister announced on Tuesday, as the disease continues to spread rapidly through the north-east of the Democratic Republic of Congo (DRC), where the outbreak was announced in May.\nThis is the 17th outbreak of the highly infectious, often deadly disease in the DRC. As of 2 October, 4,082 people had died out of 8,463 confirmed cases in the country since the emergence of the Bundibugyo strain of the Ebola virus, for which there is still no vaccine nor specific treatment.\nA Kenyan man who had been living in the DRC for seven years died after returning to Kenya, the Kenyan health minister Aden Duale told reporters.\nThe man, who has not been named, had been treated in the DRC after falling ill about a month ago. He then travelled overland to the Ugandan capital, Kampala, before flying to Nairobi on 3 October.\nKenya has previously never reported a case of Ebola, but neighbouring Uganda recorded 20 – almost all people who had travelled from the DRC – and two deaths, before being declared Ebola-free in August.\nDuale said the man was taken by a relative and a friend from Nairobi’s international airport to Nairobi hospital, where he was immediately isolated, suffering from “fever, chills, intense fatigue, weakness, muscle pain, painful swallowing, sore throat and bleeding under the skin at the injection sites”.\nHe said the man was subsequently screened and confirmed positive for the virus, but “regrettably passed on last night at around 1130” in the evening (2030 GMT).\nDuale said officials had listed 28 contacts of the deceased, including family members and healthcare workers, but that so far “only one test has turned positive and is the one that we have just discussed”.\nHe added that authorities were looking for another 23 passengers and four crew members who were on the same flight with the man and that “arrangements” for quarantine for those at risk had been prepared. “I wish to assure the public not to panic, as all systems are in place to mitigate the spread of the disease,” he said.\nDuale said a “safe and dignified burial” of the man had been planned for later in the day, in line with public health standards, but did not give further details.\nKenyans reacted furiously to government plans earlier this year to allow the US to set up an Ebola facility at Laikipia airbase, about 125 miles from Nairobi.\nAfter starting in the DRC’s north-eastern Ituri province, the current outbreak has spread to seven provinces in the country’s north and east.\nThe response to the virus in the vast central African country has been hindered by instability, including clashes between armed groups, mistrust of authorities – which has led to violence against health workers and other officials – and a lack of resources amid huge cuts in international aid.\nThe medical charity Médecins Sans Frontières warned on Monday of an “alarming surge” in cases in eastern North Kivu province, which borders Uganda. The province now accounts for 40% of all new Ebola cases, compared with 24% at the end of August, the NGO said.\n“It is like fighting a megafire,” said Stephanie Hoffmann, coordinator at MSF’s Ebola treatment centre in the city of Butembo. “Multiple outbreaks are developing at the same time, with varying intensity and in different locations.”\nThe wider Butembo health zone is home to around 2 million people and only has four Ebola treatment centres, two of which only opened recently, MSF said.\nHoffman said: “Because there are not enough beds available, we are sometimes forced to refer confirmed Ebola patients elsewhere, despite the significant risk this poses to the wider community. In addition, standards of care in some peripheral facilities do not always meet the requirements for Ebola treatment.”\nNorth Kivu is particularly affected by conflict, with 134 violent incidents there in the past month, according to tracking group Armed Conflict Location and Event Data, more than any other province.\nAgence France-Presse contributed to this report", "translation_ja": "", "vocab": [{"word": "infectious", "definition": "感染性のある、伝染性のある。ウイルスや病気が人から人へ急速に広がる能力を持つことを表す。"}, {"word": "emergence", "definition": "出現、発生。新しい病気や現象が初めて現れることを意味する。"}, {"word": "screened", "definition": "検査する、スクリーニングする。病気や感染の有無を調べるために検査を受けることを指す。"}, {"word": "mitigate", "definition": "軽減する、緩和する。問題の深刻さや影響を減らすことを意味する。"}, {"word": "quarantine", "definition": "隔離、検疫。感染病が広がるのを防ぐため、人や物を一定期間隔離する措置を指す。"}]}, {"title_ja": "Tigray rebel groups ‘forcibly recruiting boys as young as 15’ as fighting spreads", "title_en": "Tigray rebel groups ‘forcibly recruiting boys as young as 15’ as fighting spreads", "summary_ja": "Civilians try to flee as men and boys rounded up on streets by new alliance as Ethiopia conflict erupts again As renewed fighting has threatened a fresh humanitarian crisis in the northern region of Ethiopia, reports are emerging that a new alliance of armed groups in Tigray has been forcibly recrui", "summary_en": "Civilians try to flee as men and boys rounded up on streets by new alliance as Ethiopia conflict erupts again As renewed fighting has threatened a fresh humanitarian crisis in the northern region of Ethiopia, reports are emerging that a new alliance of armed groups in Tigray has been forcibly recrui", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/06/ethiopia-tigray-conflict-tplf-rebels-forcibly-recruit-boys-war-crimes", "state_media": false, "category": "政治", "full_text": "As renewed fighting has threatened a fresh humanitarian crisis in the northern region of Ethiopia, reports are emerging that a new alliance of armed groups in Tigray has been forcibly recruiting men and boys to its ranks.\nRenewed conflict erupted on 23 September between Ethiopia’s federal government and the Tigray People’s Liberation Front (TPLF), which rules the region, shattering the fragile Pretoria peace agreement signed between the two sides in November 2022.\nThe latest fighting started after months of escalating tensions when the TPLF launched an attack in what it claims was a response to drone strikes by the federal government.\nWitnesses who spoke to the Guardian described a broad campaign of forced recruitment in Tigray, targeting men and boys between the ages of 15 and 65.\nThe Eritrean Defence Forces and Amhara militias, which committed war crimes and crimes against humanity during the 2020-22 conflict, have switched allegiance and are now fighting in support of the TPLF.\nAlong with this new alliance, testimonies of forced recruitment, child soldiers and fresh humanitarian crises are emerging out of the already battered region.\nGezu*, 34, who fought with the Tigrayan forces in the 2020-22 war, lost many of his friends on the battlefield and was grateful to survive the deadly conflict. He was planning to start a family when he received a call from the TPLF authorities to join their armed group after the latest outbreak of hostilities.\n“I refused to join the war,” he said. “I responded to them to kill me rather than ever force me back to the horrors of the battlefield.\n“When they saw no one would join their army willingly, and people fleeing to the capital city, they started rounding up people from the streets. I didn’t want to leave my home town until things started getting worse.”\nIn the past few months, Tigrayans with the means to leave have been heading for the capital, Addis Ababa, fearing that war was coming. But on 23 September, Ethiopian Airlines suspended flights to and from the Tigray region, stranding many people, after Tigrayan forces seized the airport in Mekelle, the capital of Tigray region.\nSolomon*, a 52-year-old man who was able to flee to Addis Ababa, said: “The main targets are those between the ages of 15 and 40. I have seen the armed group of the TPLF rounding up people as young as 15 and 16 at gunpoint from the streets and public transportation areas.\n“I know parents who tried to save their children by showing medical certificates. The officers don’t care whatever internal disease you have; they forcefully recruit anyone whose hands, eyes and feet work.”\nEphrem, 40, is a father of three who, fearing conscription, was planning to leave the region weeks before the fresh fighting erupted. “Every time I go outside the house, my wife and the kids are anxious. The kids cry fearing that I will be rounded up from the street.\n“People who have money protect themselves and their children from the forced recruitment by bribing the officers. It is devastating; no one wants to join the war,” he said.\nThe Tigray region has been under siege for the past week, when citizens’ bank accounts were abruptly frozen by the federal government, leaving people unable to withdraw their money. The banks have since reopened with a daily withdrawal limit of 2,000 birr (£9) and with long queues forming outside.\nNegus*, an elderly man in Mekelle, said: “We don’t know for how long the siege and the war are going to stay. A daily withdrawal limit of 2,000 birr can hardly afford to buy the skyrocketing food prices. It is impossible to leave this embattled region. There is no way for relatives outside to send medicine or cash. I am just hoping it all ends soon.”\nInternet and phone communications were also cut off on the orders of the TPLF until this week, leaving families desperate for news of relatives in the region.\nMeanwhile, the Ethiopian government has been accused of carrying out indiscriminate drone airstrikes and there have been reports of attacks by the opposition forces coming close to Addis Ababa.\nAn estimated 300,000 to 800,000 civilians died during the Tigray conflict, according to the British government. The Ethiopian army, Eritrean forces and Amhara nationalist “fano” militias, have previously committed grave atrocities against the Tigrayan population that amount to war crimes and crimes against humanity, according to the UN International Commission of Human Rights Experts on Ethiopia. Tigrayan forces were also accused in an Amnesty report of committing atrocities during the war.\n* Names have been changed to protect their identities", "translation_ja": "", "vocab": [{"word": "humanitarian", "definition": "人道的な、人命救助に関する。戦争や災害などの人的被害に対する援助や支援に用いられる。"}, {"word": "shattering", "definition": "完全に破壊する、打ち砕く。脆弱な平和協定などが崩壊することを表現する際に使われる。"}, {"word": "escalating", "definition": "段階的に増加・悪化させる。紛争や問題が次第に激しくなっていく過程を指す。"}, {"word": "allegiance", "definition": "忠誠心、帰属。政治的・軍事的勢力への忠誠を表し、「allegiance to A」で「Aへの忠誠」を意味する。"}, {"word": "testimonies", "definition": "証言、供述。複数の人物による目撃証言や体験談を指す。"}]}, {"title_ja": "Guardian readers fund life-changing surgery for Somali boy injured in US airstrike", "title_en": "Guardian readers fund life-changing surgery for Somali boy injured in US airstrike", "summary_ja": "After Guardian investigation uncovered drone strike that killed 12 civilians and injured many more, seven-year-old Abdiqadir Salah underwent vital operation in Mogadishu On the rickshaw ride to the hospital, Marian Haji Abdi Guled felt a mixture of joy and apprehension: the day they had been waiting", "summary_en": "After Guardian investigation uncovered drone strike that killed 12 civilians and injured many more, seven-year-old Abdiqadir Salah underwent vital operation in Mogadishu On the rickshaw ride to the hospital, Marian Haji Abdi Guled felt a mixture of joy and apprehension: the day they had been waiting", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/05/guardian-readers-fundraising-somalian-boy-injured-in-us-strike-surgery-abdiqadir-salah", "state_media": false, "category": "経済", "full_text": "On the rickshaw ride to the hospital, Marian Haji Abdi Guled felt a mixture of joy and apprehension: the day they had been waiting for had finally arrived.\nAlmost a year earlier, her then seven-year-old son, Abdiqadir Salah, had been seriously injured, alongside his two siblings, in what a Guardian investigation found was a US drone strike on the village of Jamaame in Somalia that killed at least 12 civilians, including eight children.\nAbdiqadir’s small body had been impaled by shrapnel in the attack, and several chunks remained embedded in his back.\nDoctors feared that without an operation to remove them, the boy would lose his ability to walk, but Guled had no money for an operation. For 10 months, the family had languished in Mogadishu with growing expenses and no income – unable to afford surgery, but unwilling to let the boy return to the village without it.\nAfter the investigation, which told the story of Guled and other civilians affected by the attack, a group of Guardian readers from across the globe fundraised for Abdiqadir’s surgery and recovery.\nWithin a few hours, enough money was raised to cover his treatment and rehabilitation, as well as any medical expenses and treatment for her other two children, who sustained less extensive injuries.\n“I was so happy when I found out that Guardian readers raised the money needed for my son’s surgery. I didn’t know people like this existed,” Guled said.\n“The people who contributed to the surgery – I really appreciate their support and how they stood by our family when we needed it the most.”\nOn a Saturday morning in September, Guled waited anxiously as Abdiqadir was finally taken for surgery at Kaafi hospital in Mogadishu.\n“Other patients were taken into surgery after him and came out before him – so I worried maybe something went wrong,” she said. “I got to a point where I knocked on the operating room door asking if my son was still alive, then was held back by other patients.”\nFinally, her son emerged. Doctors told Guled the surgery had been successful, but complex. While the first two pieces of shrapnel from the missile had been successfully removed, taking out the final piece was considered too risky, possibly resulting in paralysis, so they concluded that it was safer to leave it and monitor his condition.\nWhen the Guardian visited Abdiqadir a few weeks later, he appeared bright, energised and visibly happy. “I have one piece of metal still in me, and if they touch it, I might become paralysed,” the seven-year-old said. “[But] I don’t have any problem with the last piece of metal in my body, because I’m no longer in pain.”\nThe Guardian investigation into the US airstrikes that injured Abduqadir raised myriad questions about US military intelligence, such as how the targets were selected and why children were hit while they were clearly visible and out in the open. The US has not responded to any questions about the Jamaame attack.\nIn the months since then, US attacks on the area have continued: from December 2025 to July 2026, it carried out at least three airstrikes around Jamaame, according to research by New America, a security thinktank that documents US military operations abroad. Residents say drones continue to fly above the town.\n“We cannot return to Jamaame because what caused my children to be hurt is still there,” Guled said. “I fled Jamaame with my wounded children because of the drones, and the drones are still [flying].”\nWith the remaining financial support she received from Guardian readers, Guled plans to relocate with her children to the government-controlled port city of Kismayo, which has not been the target of drone strikes, and where Abdiqadir can receive further surgery if needed.\nShe still wants answers from the US government, nearly a year after they were bombed. “My son has been left scarred for life,” she said.\n“I want the US government be held accountable for what they did to my family and for the US to stop bombing our community.”", "translation_ja": "", "vocab": [{"word": "apprehension", "definition": "不安や恐れの感情。ここでは喜びと同時に感じる心配や懸念を表しており、将来への漠然とした不安を意味します。"}, {"word": "embedded", "definition": "深く埋め込まれた、組み込まれた状態。医学的文脈では、破片が体内に深く刺さったまま留まっていることを表します。"}, {"word": "languished", "definition": "苦しみながら過ごす、衰弱する。困難な状況で無力感を持ちながら時間が経過することを意味し、ネガティブな状態の継続を表現します。"}, {"word": "rehabilitation", "description": "リハビリテーション、回復過程。医学的には手術後の機能回復や身体機能の改善プログラムを指します。"}, {"word": "paralysis", "definition": "麻痺、身体の機能停止。医学用語として、神経や筋肉の損傷により身体の一部が動かなくなる状態を意味します。"}]}, {"title_ja": "Iran war live: Yemen forces claim control over strategic Taiz mountain peak", "title_en": "Iran war live: Yemen forces claim control over strategic Taiz mountain peak", "summary_ja": "Yemeni forces claim they have tightened control over the highest peak in the Jabal Habashi district of Taiz.", "summary_en": "Yemeni forces claim they have tightened control over the highest peak in the Jabal Habashi district of Taiz.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/10/7/iran-war-live-yemen-forces-claim-control-over-strategic-taiz-mountain-peak?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: Yemen forces claim control over strategic Taiz mountain peak\nHouthi military spokesperson Yahya Saree says the group has thwarted attempts by Yemeni government forces to advance toward the Bab al-Mandeb Strait.\nlive\nThis video may contain light patterns or images that could trigger seizures or cause discomfort for people with visual sensitivities.\nPublished On 7 Oct 2026\n- Saudi-backed Yemeni forces say they have tightened control over the highest peak in the Jabal Habashi district of Taiz as part of the “Dawn of Yemen” operation to reclaim territory from Houthi fighters.\n- The Saudi-led coalition says the Houthi-controlled capital of Sanaa and the governorates of Saada and Amran serve as the sources of Houthi missile threats against Saudi Arabia.", "translation_ja": "", "vocab": [{"word": "thwarted", "definition": "計画や努力を阻止する、妨害する。相手の意図や行動を阻止する際に使われる。"}, {"word": "tightened", "definition": "支配や管理を強化する、より厳しくする。ここでは軍事的な統制をより強固にすることを意味する。"}, {"word": "governorates", "definition": "州や県などの地域行政区画を指す。中東やアフリカで使われる行政用語で、特に統治される地域単位を表す。"}, {"word": "coalition", "definition": "共通の目的のため一時的に結成された連合体、連携。ここでは複数国が協力する軍事同盟を指す。"}]}, {"title_ja": "Electric car bursts into flames at charging station in Turkiye", "title_en": "Electric car bursts into flames at charging station in Turkiye", "summary_ja": "Turkiye’s first domestically produced electric SUV, the Togg T10X burst into flames at a charging station.", "summary_en": "Turkiye’s first domestically produced electric SUV, the Togg T10X burst into flames at a charging station.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/6/10-7-ev-blowsup-turkiye-clip-mp4?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Electric car bursts into flames at charging station in Turkiye\nNewsFeed\nElectric car bursts into flames at charging station in Turkiye\nTurkiye’s first domestically produced electric SUV, the Togg T10X burst into flames at a charging station. No one was injured and the operator says the car was not charging when the fire started. EVs reportedly accounted for 52% of new car sales in Turkiye so far this year.\nPublished On 6 Oct 2026", "translation_ja": "", "vocab": [{"word": "bursts", "definition": "突然激しく起こる、勢いよく破裂する。ここでは火が急激に燃え上がったことを表現しており、瞬間的で激烈な出来事を示す動詞。"}, {"word": "domestically", "definition": "国内で、自国で製造された。このニュースでは、トルコ国内で生産されたという意味で使われており、地域限定や生産地を明示する副詞。"}, {"word": "accounted for", "definition": "～を占める、全体の一部を構成する。統計やデータを示す際に、特定の割合や数字が何を表すかを説明する表現。"}]}, {"title_ja": "‘We are desperate’: Venezuela’s power cuts fuel growing public anger", "title_en": "‘We are desperate’: Venezuela’s power cuts fuel growing public anger", "summary_ja": "Frequent outages have fuelled protests against the government of interim Venezuelan President Delcy Rodriguez.", "summary_en": "Frequent outages have fuelled protests against the government of interim Venezuelan President Delcy Rodriguez.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/longform/2026/10/6/we-are-desperate-venezuelas-power-cuts-fuel-growing-public-anger?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "The hum of the kidney dialysis machine that Onasis Munoz is connected to suddenly stops. The fluorescent lights overhead flicker out, and his room at a clinic in Valencia, Venezuela, is plunged into darkness.\nIt is not the first time a power cut has interrupted one of the three weekly sessions Munoz needs to do the work his failing kidneys can no longer do, filtering waste and excess fluid from his blood.\nFor years, electricity would go out every couple of days across parts of Venezuela's Carabobo state.\nBut in recent months, Munoz said, the outages have grown to be daily, lasting around seven hours. The clinic's emergency batteries have since been depleted, and its backup generator no longer works.\nHe explained that the frequent power failures have disrupted his treatment. His health has slumped as a result.\n\"I arrive home, exhausted, as if I had run a marathon,\" the 34-year-old said.\nBut often there is no electricity there either, and recent weeks have been sweltering. \"I can't switch on the air conditioning. I cannot rest because of the heat and the mosquitoes. There's no relief,\" Munoz said.\nAcross Venezuela, the prolonged outages are riling locals, as the electricity supply to homes, businesses and essential services becomes unstable.\nSome of the cuts are deliberate, as the government of interim President Delcy Rodriguez rations electricity.\nThe resulting frustration has spilled onto the streets, where demonstrators hold \"cacerolazos\" – a traditional form of protest that involves banging pots and pans.\nSome have gone as far as blocking roadways and setting tyres on fire. The electricity crisis has also raised concerns about how the government is managing the country's vast oil supply, a key source of income for the country.\n\"We are desperate. We cannot understand how a country so rich in resources can be practically left in the dark,\" said Patricia Cueva, a lawyer from Maracaibo, the capital of oil-rich Zulia state.\n\"We cannot rest. We cannot work. Our children cry.\"\nA recent study by ANOVA Policy Research, a consultancy firm, found that 62.8 percent of Venezuelan households – or nearly two out of every three families – experienced daily electricity cuts in 2026, compared with 37.1 percent in 2024.\nOnly 6.9 percent reported a continuous supply of electricity.\nThe energy crisis has its roots in multiple causes. Previous governments have blamed foreign sanctions for weakening Venezuela's economy.\nThe Rodriguez administration, meanwhile, has cited the climate phenomenon El Niño for the crisis. Some 90 percent of Venezuela's electricity is generated by hydropower, making the system vulnerable to extreme heat and drought.\nBut energy specialist Nelson Hernandez is among the Venezuelans pointing a finger at the government for this year's surge in outages.\nHernandez acknowledges that climate conditions can have an impact on electricity production. But he underscored that Venezuela's electricity crisis is not a \"random event\".\n\"Practically the entire crisis stems from the systematic neglect of the infrastructure,\" he told Al Jazeera, pointing to what he called \"profound failures\" in management, lack of strategic planning and ageing technology.\nHe also signalled that shifting government policies towards oil extraction plays a key role.\nVenezuela sits on the largest proven oil reserves in the world.\nMuch of the oil industry was nationalised, but that started to change in January, after the US conducted a military operation to abduct and imprison Venezuela's then-President Nicolas Maduro.\nSince then, relations between Washington and Caracas have shifted. Under pressure from US President Donald Trump, Rodriguez – Maduro's former vice president – has implemented reforms to allow greater foreign investment in the country's oil sector.\nTrump, meanwhile, has eased restrictions on the oil's export and expanded the US role in the industry.\nThe result has been an uptick in output. Oil production in Venezuela has risen by almost 30 percent this year, from 924,000 barrels per day in January to 1.201 million in August, according to the Organization of the Petroleum Exporting Countries (OPEC).\nAs Venezuela revives its dilapidated oil industry, Hernandez says increased production is putting pressure on an already strained electricity system.\n\"Because electricity supplies to oil fields cannot be rationed without jeopardising oil production, the burden of adjustment and the power cuts fall directly on the residential and commercial sectors,\" he said.\nHernandez estimates the oil industry requires around 1,600 megawatts or more for extraction, pumping, transportation and refining.\nThe Rodriguez government says it is working to stabilise the system, with plans to add 1,300 megawatts of generation in the final quarter of the year.\nIt has also put in place legal measures that compel energy companies to invest in their own electrical infrastructure, to lessen the strain on the public power grid.\nBut industry experts say lasting soluti", "translation_ja": "", "vocab": [{"word": "plunged", "definition": "急に深い状態に入る。ここでは暗闇に突然包まれたことを表す。文語的で急激な変化を強調する表現。"}, {"word": "depleted", "definition": "完全に使い尽くされた、枯渇した。リソースや供給物が全く残っていない状態を指す。"}, {"word": "prolonged", "definition": "長く続く、延長された。通常よりも長い期間継続する状況を描写する際に使用される。"}, {"word": "rations", "definition": "配給する、制限する。政府が供給を意図的に制限・管理することを表す経済用語。"}, {"word": "consultancy", "definition": "経営コンサルティング、助言業務。専門知識を提供する企業やサービスを指す。"}]}, {"title_ja": "French riot police fire tear gas as more than 2,50,000 rally nationwide for school funding", "title_en": "French riot police fire tear gas as more than 2,50,000 rally nationwide for school funding", "summary_ja": "The protests increased pressure on the administration of outgoing President Emmanuel Macron.", "summary_en": "The protests increased pressure on the administration of outgoing President Emmanuel Macron.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/france-paris-student-protests-updates-october-7-2026/article71554062.ece", "state_media": false, "category": "政治", "full_text": "Police fired tear gas to control crowds in Paris and elsewhere in France on Tuesday (October 6, 2026) as more than a quarter of a million people rallied nationwide to support high school students demanding more education funding, according to government figures.\nThe protests increased pressure on the administration of outgoing President Emmanuel Macron.\nAs pupils blockaded high schools, large crowds waving flags and placards gathered in Marseille, Strasbourg and other cities. The demonstrations showed how protests that began at a high school in the Paris region in mid-September have grown into a nationwide movement — the latest of many that have marked Macron's nearly decade-long tenure.\n“We need to listen to them,” said Léa Monimart, an adult demonstrator in the northern city of Lille. “They are 17 years old; they are not completely clueless, and they know what they are talking about. It's important to show that there are adults who support them.”\nThe Interior Ministry estimated that 2,66,000 people took part in demonstrations across the country on Tuesday (October 6, 2026), including 56,000 in Paris, where small groups of protesters clashed with riot officers at a city square at the end of a largely peaceful march.\nNearly 500 people were detained Tuesday (October 6, 2026), the Ministry said. The widespread use of arrests, tear gas and riot-control weapons against teenagers is fueling defiance and angering some parents and teachers. Some student groups called for new protests Thursday (October 8, 2026).\nInterior Minister Laurent Nuñez said the police response had been proportionate in “almost all cases” and that the protests had at times turned into riots, requiring police intervention.\nFrench Prime Minister Sébastien Lecornu said the government and school leaders must listen to students' concerns and find solutions.\nQuestioned in parliament on Tuesday (October 6, 2026) about the protest movement, Mr. Lecornu denounced “ultra violence” threatening schools. Responding to criticism of police tactics, he pledged that any “accidents” would be investigated and described allegations that the police are racist as a “lie.”\nPublished - October 07, 2026 05:30 am IST", "translation_ja": "", "vocab": [{"word": "blockaded", "definition": "建物や場所への出入りを封鎖・遮断すること。ここでは学生たちが高校への進入を物理的に防いだという意味。"}, {"word": "tenure", "definition": "特定の職務や地位を保持している期間。マクロン大統領の在任期間を指している。"}, {"word": "proportionate", "definition": "状況に対して適切で、バランスの取れていること。警察の対応が必要に応じた程度だったという主張。"}, {"word": "pledged", "definition": "公式に約束・誓約すること。ここでは政府が捜査を行うことを公約した。"}, {"word": "defiance", "definition": "権威や指示に対する反抗・抵抗。警察の対応に対する学生たちの反発心。"}]}, {"title_ja": "Trump says he has call scheduled with Putin to discuss possible case of pneumonic plague in Russia", "title_en": "Trump says he has call scheduled with Putin to discuss possible case of pneumonic plague in Russia", "summary_ja": "Mr. Trump said the U.S. is in “very deep discussions” on the topic", "summary_en": "Mr. Trump said the U.S. is in “very deep discussions” on the topic", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-says-he-has-call-scheduled-with-putin-to-discuss-possible-case-of-pneumonic-plague-in-russia/article71553314.ece", "state_media": false, "category": "社会", "full_text": "President Donald Trump on Tuesday (October 6, 2026) said he has a call scheduled with Russian President Vladimir Putin to discuss a possible case of plague at a Siberian research institute.\nSpeaking to reporters at the White House, Mr. Trump said he would be talking with Mr. Putin about the case “very soon.” Health authorities are investigating after the death of an employee at an anti-plague institute, which authorities attributed to pneumonia with an unknown cause.\nAsked what the U.S. intelligence community was saying about the case, Mr. Trump said the U.S. is in “very deep discussions” on the topic. “We’ll be able to report about it, probably tomorrow,” Mr. Trump said.\nThe World Health Organization on Tuesday (October 6, 2026) said the case presents a “very low” risk outside Russia. The United Nations agency said it was in contact with Russian authorities following reports of the death last week of a woman who worked at the Irkutsk Anti-Plague Research Institute of Siberia and the Far East.\nOn Monday (October 5, 2026), Mr. Trump said the U.S. would be willing to help Russia with the situation. “It’s a rough disease. You know, that’s a disease we used to be able to control, but somehow those microbes have gotten stronger and smarter. They’re like an army,” Trump told reporters at the White House.\nThe call also comes as the Trump administration faces an Oct. 18 deadline to decide which Russian entities, if any, it will sanction under the Lindsey O. Graham Sanctioning Russia and Iran Act, which Trump signed into law on Sept. 18.\nUkraine has given the administration and Congress a wish list of Russian companies, vessels and individuals it would like to see hit with U.S. sanctions under that law.\nPublished - October 07, 2026 05:21 am IST", "translation_ja": "", "vocab": [{"word": "attributed", "definition": "原因を帰する、～のせいにする。ある事象や結果がどの要因によって起こったかを指摘する際に用いられる。"}, {"word": "pneumonia", "definition": "肺炎のこと。肺の感染症で、医学用語としてTOEIC高得点の受験者に求められる語彙。"}, {"word": "entity", "definition": "実体、団体、組織のこと。ビジネスや政治文脈で、企業や国家などの法的主体を指す。"}, {"word": "sanction", "definition": "制裁を加える、～に対して罰則や規制を課する。国際関係において、政治的圧力手段として用いられる。"}, {"word": "microbes", "definition": "微生物のこと。バクテリア、ウイルス、菌類などの微小な生物を示す医学・生物学用語。"}]}, {"title_ja": "Christa Pike is conscious and speaking after Tennessee failed execution, her attorneys say", "title_en": "Christa Pike is conscious and speaking after Tennessee failed execution, her attorneys say", "summary_ja": "The statement was the first indication that Pike has improved since an ambulance carried her away from a Nashville prison", "summary_en": "The statement was the first indication that Pike has improved since an ambulance carried her away from a Nashville prison", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/christa-pike-is-conscious-and-speaking-after-tennessee-failed-execution-her-attorneys-say/article71553181.ece", "state_media": false, "category": "社会", "full_text": "Christa Pike, a Tennessee inmate who survived Tennessee's attempt to execute her, is awake and speaking as she receives treatment at a hospital, her attorneys said Tuesday (October 6, 2026).\n“Against all odds, Christa Pike is conscious, speaking, and continues to receive critical medical care. Despite the severe damage she endured to her arms, she is still handcuffed and shackled to the bed. Her recovery is medically unprecedented. Her prognosis remains unclear but, at a minimum, we expect a long recovery,” attorneys for Pike said in a statement.\nHer attorneys said they are grateful for the first responders and the medical team at the hospital “who treated Christa like a human and have provided exceptional care to her.”\nThe statement was the first indication that Pike has improved since an ambulance carried her away from a Nashville prison last Wednesday (September 30, 2026).\nPike survived two doses of pentobarbital as Tennessee officials attempted to put her to death.\nPublished - October 07, 2026 05:35 am IST", "translation_ja": "", "vocab": [{"word": "pentobarbital", "definition": "死刑執行に使用される鎮静薬。医学的には麻酔薬や鎮静剤として使用される医薬品で、過剰摂取は致命的となる。"}, {"word": "unprecedented", "definition": "前例のない、これまでに起こったことのない状態。医学や科学の分野で新しい現象や結果を説明する際に使用される。"}, {"word": "prognosis", "definition": "医学用語で、患者の病状や回復の見通し・予後のこと。医者が患者の将来の健康状態について予測する際に用いられる。"}, {"word": "crit
