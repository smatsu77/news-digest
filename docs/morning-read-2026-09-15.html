nslation_ja": "", "vocab": []}, {"title_ja": "スーダンの飢饉危機が深刻化する中、WFPの資金が急減", "title_en": "WFP Funding for Sudan Plummets as Hunger Crisis Deepens", "summary_ja": "世界食糧計画（WFP）はスーダンでの活動資金が著しく減少する一方で、同国の飢餓率は急速に上昇している。WFP事務局長は、財政支援の削減により、食糧不安に直面する数百万人のスーダン国民への支援能力が脅かされていると警告した。この資金不足は、地域の継続的な紛争と人道的課題の中で生じている。", "summary_en": "The World Food Programme is facing a critical funding shortage for its operations in Sudan, even as hunger rates surge across the country. The WFP head warned that reduced financial support threatens the ability to assist millions of Sudanese facing acute food insecurity. The funding gap comes amid ongoing conflict and humanitarian challenges in the region.", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMiuAFBVV95cUxOYllnSGVJMkVWVkZYWll6Zktld1d4Xzk4ZUVmUkhtLWNyMnd1NkJKdXRiQ2p4VDRFOGlJUTQ0WTVqclNpWGRDTlR5ZmtWUmF0d0hZQ0lwM2V2ejlwZEM3RURrSDNlOUlOSWYxc0RPY1ZuMllXSG5hel9MR0gxbWh3RjRnVllqekVFWG5jNVJQZmluT2h4QmR3aDVicEdQaVNkUTM1MVc5WHZ5dWJlMkZZU05wVHlkVFVr?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パレスチナ支持発言でマックルモア降板後、エド・シーランのツアー全サポートアクトが辞退", "title_en": "Ed Sheeran's US tour support acts quit after Macklemore dropped over Gaza remarks", "summary_ja": "エド・シーランの米国ツアーの全サポートアクトが、ステージでのパレスチナ支持発言によりラッパーのマックルモアが降板させられたことを受けて辞退した。フィニアス、ルーカス・グラハム、アーロン・ロウを含むアーティストたちは、芸術的自由と被抑圧者のための発言の権利を理由に挙げた。シーランは政治的問題に対する中立姿勢を擁護し、政治活動よりも外交と対話を促進するために自身のプラットフォームを使用していると述べた。", "summary_en": "All remaining support acts on Ed Sheeran's US tour have quit following the removal of rapper Macklemore for making pro-Palestinian statements on stage. Artists including Finneas, Lukas Graham, and Aaron Rowe cited concerns about artistic freedom and speaking up for the oppressed. Sheeran defended his neutrality on political issues, stating he uses his platform for diplomacy rather than political activism.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3vgyn49y4l7o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "All support acts on Ed Sheeran's US tour quit after Macklemore dropped\n- Published\nAll of the remaining support acts on Ed Sheeran's US tour have quit, after the rapper Macklemore was dropped from the line-up for making pro-Palestinian remarks on stage.\nAmong them were Finneas, the brother of pop star Billie Eilish, who said in a statement: \"Artists must not be silenced when they speak up for the oppressed.\"\nIrish singer-songwriter Aaron Rowe and Danish band Lukas Graham also announced their departure. Irish folk band Beoga, who perform with Sheeran on stage every night, dropped out too.\nThe announcements came hours after Sheeran said he would not be drawn into a public debate over Gaza, and stressed he was not responsible for Macklemore being removed from the tour.\n\"Macklemore coming off tour was the promoter's decision, it was not mine,\" Sheeran said on Instagram.\n\"I would never let down the fans who had made plans, nor would I abandon the touring crew and the other support acts and musicians who rely on me for work and to make a living.\"\nEarlier this month, Macklemore - real name Benjamin Haggerty - called for a \"free Palestine\" and showed images of devastation in Gaza during two concerts in New Jersey.\nHis comments drew criticism from Jewish groups, after which some venues put pressure on the tour promoters to drop him from the tour.\nIn his statement, external, Sheeran said he had spoken with the venues \"at length all week to try and build a bridge\" - but the promoters, Messina Touring Group, had ultimately pulled the plug.\nWhile the star said he was “appalled by the conflict between Israel and Palestine\" and that the \"suffering and pain caused on both sides is a human tragedy\", he also attempted to explain his decision to keep political issues at arm’s length.\n\"I am not complicit,\" he wrote. \"I have my personal views on this devastating conflict. Just because I choose not to speak publicly, it doesn't mean I don't have them, and it doesn't mean I don't care.\n\"Nor does it mean I don't support causes in my own, personal way.\"\nHe continued: \"There is a reason I do not use my professional platform for politics - my audience includes young people, often children, of all backgrounds.\n\"Those who come to my shows do not expect a political forum. I respect Macklemore's strength of purpose to stand up and shout for what he believes.\n\"However, there is room for multiple approaches to the same end: Peace.\n\"I choose to use my fame and platform to be a place of safety and sanctuary, to maintain diplomacy and keep conversations open, not closed. If we only focus on shouting the loudest, nothing will ever change. There are different approaches to being an advocate for change.\"\nSheeran added that, “as with all my support acts\", Macklemore had been allowed to choose his own setlist.\nIf the statement was meant to placate his fans and other artists on the line-up, it has seemingly had the opposite effect.\nWriting on Instagram, Lukas Graham said: \"We should be able to speak about war, about civilians being killed, about children who deserve to grow up. Wherever they live. Whatever flag flies over them.\"\nRowe, who opened on the Australian leg of the tour earlier this year and resumed as a support act for the US in June, said that he did not \"take the decision [to quit] lightly,\" adding: \"Ed has been a friend to me and has changed my life, I could never thank him enough for this.\"\nHind's Hall performance\nThe controversy began on 4 September, when Macklemore performed at Ed Sheeran's concert at the MetLife Stadium in New Jersey.\nHe told the audience: \"A big part of the reason why I wanted to do this tour in the first place is so that I could stand up in stadiums like this and say two words that are very, very dear to my heart: Free Palestine.\"\nHe then performed his song Hind's Hall, which is dedicated to pro-Palestinian protestors at Columbia University and condemns Israel's military action in Gaza, while video footage of the devastation in Gaza was shown on the big screen.\nSome of the audience cheered - but there was almost immediate criticism online.\nThe Israeli American Council launched a petition demanding his removal from the tour; while the campaign group StopAntisemitism said the musician had ambushed fans with propaganda - a claim that was amplified by the pop star Pink, who reposted it on Instagram.\nThe next night, Macklemore returned to the same stage and directly addressed his \"Jewish brothers and sisters\" in the audience.\n\"Criticism of Israel, criticism of apartheid, being against genocide, is in no way a criticism of you,\" he said, adding that he wanted people in Gaza and the West Bank to know they had not been forgotten.\nIsrael rejects allegations of genocide. It says its troops conduct self-defence operations in Gaza and the occupied West Bank in accordance with international law.\nThe Israeli military launched a campaign in Gaza in response to an unprecedented Hamas-led attack on southern Israel on 7 October 20", "translation_ja": "", "vocab": [{"word": "complicit", "definition": "共謀者としての立場にある、また悪事や不正に加担しているという意味。シーランがこの紛争に加担していないと主張する際に使用された。"}, {"word": "placate", "definition": "人を宥める、機嫌を取るという意味。シーランの声明が批判的なファンや他のアーティストを落ち着かせることを目的としていたが失敗したことを示す文脈で使用。"}, {"word": "diplomacy", "definition": "外交、駆け引きを通じた問題解決という意味。シーランが政治的プラットフォームではなく安全な場所としての役割を強調する際に言及。"}, {"word": "ambushed", "definition": "予期しない方法で奇襲する、突然襲いかかるという意味。批評家がマックルモアのパフォーマンスをファンへの予期しない政治的主張と見なした。"}, {"word": "petition", "definition": "請願書、署名運動を意味する。イスラエル系米国評議会がマックルモアのツアーからの除外を要求するために開始した。"}]}, {"title_ja": "デンマーク、ロシア軍艦が軍用ヘリに照明弾を発射したと主張", "title_en": "Denmark accuses Russian warship of firing flares at military helicopter", "summary_ja": "デンマークはバルト海での定期監視作業中に、ロシアの軍艦がヘリコプターに向けて照明弾を発射したと非難し、ロシア大使を召喚しました。フレデリクセン首相はこの行動を「無謀」と非難し、ロシアが威嚇と分裂を狙っていると主張しましたが、ロシア側はデンマークのヘリコプターが危険な機動を行ったと反論しています。", "summary_en": "Denmark has accused a Russian warship of firing emergency flares at one of its helicopters during a routine monitoring operation in the Baltic Sea, prompting the Danish government to summon the Russian ambassador. Prime Minister Mette Frederiksen branded the action \"reckless\" and accused Russia of attempting to intimidate and divide, while Russia countered that Danish helicopters had conducted dangerous manoeuvres near its vessels.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwn8mjl31p5yo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Denmark says Russian warship fired flares at military helicopter\n- Published\nDenmark has accused a Russian warship of firing two emergency flares at one of its helicopters while it was tracking the vessel in the Baltic Sea.\nThe Danish government has summoned the Russian ambassador over the incident, which it said happened during a \"routine\" monitoring operation on Monday.\nPrime Minister Mette Frederiksen branded the Russian action \"reckless\" and said it was designed to \"intimidate and divide\".\nRussia said it would \"thoroughly investigate\" the incident but accused Danish helicopters of making \"dangerous manoeuvres\" near Russian warships.\nIt came on the same day that Nato forces shot down a drone over Lithuania in the latest security scare on the alliance's eastern flank, where tensions remain high amid Russia's full-scale invasion of Ukraine.\nIn a statement detailing the incident in the Baltic Sea, the Danish armed forces said: \"One of the air force's Fennec helicopters was today fired at with flares during a routine photographic operation of a Russian frigate, which was located in international waters off Gedser.\"\nOf the two flares fired at the helicopter, one passed close to it, the statement added.\nThe Danish foreign ministry described the incident as \"completely unacceptable\".\nDanish Foreign Minister Lars Lokke Rasmussen accused Russia of \"gradually shifting the boundary for what they consider acceptable behaviour\", adding: \"That is something we cannot accept.\"\nIn a statement, Russian ambassador Vladimir Barbin said Moscow would \"thoroughly investigate all the circumstances of the incident\" but accused the Danish helicopter of carrying out \"provocative actions\".\nBarbin said this was \"not the first time that Danish Air Force helicopters have carried out dangerous manoeuvres near Russian warships\".\nHe said he had complained about a similar incident last year, adding that the latest event showed that \"communication problems lie not with the Russian Navy's vessels, but with the Danish side\".\nRussia's behaviour was \"reckless and dangerous,\" the President of the European Commission Ursula von der Leyen said in a post on social media.\nThis incident – together with the drone over Lithuania – was \"part of a broader pattern of Russian aggression and provocation against Europe\", she added.\nDanish Defence Minister Jeppe Bruus told Reuters no attempt to make contact with helicopters had been made by the frigate's crew.\nOvernight, Nato fighter pilots shot down a drone that entered Lithuania's airspace.\nAuthorities said the drone likely entered southern Lithuania, near the second-largest city of Kaunas, from neighbouring Belarus shortly after midnight on Tuesday.\nThe origins of the drone have yet to be determined, the Lithuanian national crisis management centre said, but the country's president pointed to increased Russian aggression in recent months.\nPresident Gitanas Nausėda wrote on X: \"With Russia intensifying its aggression against Ukraine, such readiness is vital for our region. Together with our Nato Allies, Lithuania will defend its airspace.\"\nLithuania shares a large part of its southern and eastern border with Belarus, a key Russian ally.\nPoland also announced there had been \"aviation operations\" in its airspace on Monday night \"due to the activity of Russian Federation's jet-powered unmanned aerial vehicles conducting strikes on Ukrainian territory\".\nIt said the overnight operations were of a \"preventive nature\" and aimed at \"securing airspace and its protection, especially in areas adjacent to threatened regions\".\nNato jets have been scrambled several times to shoot down stray Ukrainian drones that have crossed into Baltic countries Estonia and Latvia this year.\nUkraine has blamed the stray drones on Russian electronic warfare, technology designed to change the flight paths of Ukrainian drones.\n  - Published6 hours ago", "translation_ja": "", "vocab": [{"word": "reckless", "definition": "危険を顧みない、無謀な。結果を考慮せずに無責任な行動をする様子を表します。"}, {"word": "manoeuvres", "definition": "機動、操作。航空機や船舶が意図的に行う複雑な動きや戦術的な行動を指します。"}, {"word": "provocation", "definition": "挑発、刺激。相手を怒らせたり反応させたりするために行われる行為です。"}, {"word": "escalation", "definition": "エスカレーション、段階的な増加。紛争や緊張が徐々に激しくなることを意味します。"}, {"word": "breach", "definition": "違反、侵害。国際法や協定など定めたルールに対する違反行為を指します。"}, {"word": "frigate", "definition": "フリゲート艦、護衛艦。海軍が用いる中規模の軍艦で、複数の武器を装備しています。"}]}, {"title_ja": "米国が宇宙に配備した兵器は何か？", "title_en": "What weapon could the US have put into space?", "summary_ja": "米国は地球軌道に宇宙兵器を配備したと発表し、宇宙での軍事能力に関する疑問が生じています。専門家は電子戦争機器または運動兵器の可能性を示唆しており、ロシアと中国も同様の対衛星能力を保有していると考えられています。この展開は、大国が宇宙での支配権を競うにつれて、宇宙の軍事化が進んでいることを反映しています。", "summary_en": "The US has announced deployment of a space weapon in Earth's orbit, raising questions about military capabilities in space. Experts suggest it could be electronic warfare equipment or kinetic weapons, while Russia and China are also believed to possess similar anti-satellite capabilities. The development reflects growing militarization of space as great powers compete for dominance.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmy4zqgk97wlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "What weapon could the US have put into space?\n- Published\nThe announcement by the United States that it has deployed a space weapon in Earth's orbit has raised questions about what weaponry is actually in space, and what role it could play in efforts by great powers to dominate that arena.\nWashington has given away little in its announcement. Secretary of the Air Force Troy Meink said the \"on orbit\" weapon was necessary to safeguard US forces against hostile enemy action, but gave no details about the weapon's capabilities or when it was put into orbit.\nSo what could this weapon be, and what is the wider picture like for military developments in space? Who else could have similar weaponry?\nSpace has been a militarised domain since the start of the space age - in the late 1960s, the Soviet Union deployed weapons up there. The Istrebitel Sputnikov (IS; Satellite Destroyer) programme was made up of satellites that were designed to release projectiles that detonated, releasing shrapnel into the path of another (usually American) satellite.\nNowadays, advanced militaries deploy satellites in space for a range of purposes, including reconnaissance, secure communications, detecting missile launches and providing precise location information for targeted strikes.\nAs warfare becomes more technologically advanced, analysts expect the use of military hardware in space to increase.\nDr Bleddyn Bowen, an associate fellow in military sciences at the Royal United Services Institute and associate professor in astropolitics at Durham University, said he was only able to hazard a guess about the weapon announced by the US.\n\"I would expect there to be some kind of electronic warfare or radio-jamming platform, possibly, this would be a non-destructive kind of anti-satellite weapon,\" he told BBC Radio 4's Today programme.\nSuch weaponry already exists on Earth and can disrupt satellite communications, he said. \"If you take out the radio links then your satellite is very useless.\"\nBowen also would not rule out a riskier and more disruptive type of weaponry, which could create debris and destruction.\n\"Less likely would be a kinetic kill vehicle of some sort, so a vehicle that would release a projectile that could ram into a satellite and destroy it,\" he said.\nA type of \"close inspection and grappling satellite would be another possibility as well.\"\nAs to whether rivals such as Russia and China have similar weaponry already in orbit, is difficult to tell.\n\"If we're looking towards China and Russia, they have both displayed activity,\" Juliana Suess, a former research fellow at RUSI and researcher at the Stiftung Wissenschaft und Politik (German Institute for International and Security Affairs), told the BBC.\n\"For example, with Russia, we've seen some activity that hints at being a co-orbital weapons test. So we saw something that might indicate that they shot a projectile as a test in orbit.\n\"There are others out there, but without knowing the details, what the American [weapon] is, it's difficult to draw comparisons.\"\nBut while the weapon placed in orbit may be unusual, the US - and indeed its Russian and Chinese rivals - have had weapons that can be pointed and shot into space for some time.\nIn a later BBC interview, Bowen was dismissive of China's reaction to the US announcement which warned against an arms race in space, describing it as \"the pot calling the kettle black\".\n\"If you're already an expert... you know how hollow those words are coming from the Russian and Chinese governments,\" he said.\n\"The United States, Russia and China and also India have all developed different kinds of anti-satellite or counter-space weapons, and Russia and China have put a lot of technologies in space which have a lot of weapons potential,\" he added.\nIn fact in the past 10 years, Russia and China have been doing a lot more manoeuvres in space, known as rendezvous and proximity operations (RPOs) - \"buzzing\" Western satellites.\n\"Theoretically, these RPO [satellites]can become hunter-killer satellites by physically colliding with them or by nudging them out of orbit,\" Dr Rod Thornton, reader in Russian Defence and Security Studies at King's College, London, told the BBC.\nBowen added that the Chinese have demonstrated \"space tug capability\", saying: \"A vehicle can go up to a satellite, can grapple it and move it into a different orbit.\"\nThis, he said, could be a positive development - a way of removing space junk as well as knocking out working satellites.\nHowever, some types of space weaponry also have the potential to create huge amounts of space junk.\nDr Mark Hilborne, a specialist in space security and weaponisation at King's College, said direct ascent anti-satellite missile tests, such as one carried out by China in 2007, leave a great deal of debris in orbit for a very long time.\nSuess said debris from that test was still in orbit and still dangerous.\n\"It doesn't have to be a sort of huge piece of metal to do any damage, it can be a tiny piece", "translation_ja": "", "vocab": [{"word": "militarised", "definition": "軍事的な目的のために使用または開発された状態。この文脈では、宇宙が軍事的な活動や兵器配備の対象領域になったことを意味します。"}, {"word": "kinetic kill vehicle", "definition": "物理的な衝突によって目標を破壊する無誘導兵器。衛星などの敵目標に直接衝突する発射体を放出するメカニズムを指します。"}, {"word": "co-orbital weapons", "definition": "同じ軌道上または近い軌道上で活動し、目標の衛星に接近して攻撃できる兵器システム。宇宙での対衛星作戦に使用されます。"}, {"word": "rendezvous and proximity operations", "definition": "宇宙船が他の衛星に接近し、その周辺で操縦する活動。軍事的には敵衛星を監視または無力化する能力を示します。"}, {"word": "grapple", "definition": "つかむ、把握する、または物理的に保持する行動。宇宙では衛星が他の物体をつかんで移動させたり操作したりすることを意味します。"}, {"word": "debris", "definition": "爆発や破壊により宇宙に散らばった破片やがれき。宇宙兵器の使用は大量のデブリを生成し、他の衛星に危険をもたらします。"}]}, {"title_ja": "ルーシー・レットビー事件後、新生児病棟へのカメラ導入計画が発表される", "title_en": "Baby Ward Cameras Planned After Inquiry Finds Lucy Letby Crimes Were Preventable", "summary_ja": "英国の病院での看護師ルーシー・レットビーの殺人事件に関する調査では、経営陣の失敗と不十分な安全対策により彼女の犯罪が続いていたことが判明した。保健大臣イヴェット・クーパーは、新生児病棟への映像配信カメラの導入と調査で推奨される他の改革を緊急に進める計画を発表した。報告書は、病院の指導部がレットビーに関する懸念を却下し、複数の介入の機会があったにもかかわらず警察関与が遅れたことを批判している。", "summary_en": "An inquiry into nurse Lucy Letby's murders at a UK hospital found that management failures and poor safeguarding allowed her crimes to continue unchecked. Health Secretary Yvette Cooper announced plans to urgently introduce live-streaming cameras on baby wards and implement other reforms recommended by the inquiry. The report criticized hospital leadership for dismissing concerns about Letby and failing to involve police earlier, despite multiple opportunities to intervene.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cw1l6zn56e3zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Baby 'cot cams' plan after inquiry finds Lucy Letby crimes could have been prevented\n- Published\nHealth Secretary Yvette Cooper has said officials will \"urgently develop plans\" to introduce live-streaming cameras on England's baby wards after an inquiry into Lucy Letby's murders and attempted murders.\nInquiry chair Lady Justice Thirlwall called for a series of urgent reforms to neonatal units, including CCTV for all cots and incubators, and restricting access to insulin.\nThirlwall said some of the babies Letby killed could have been saved if managers at the Countess of Chester Hospital had taken action earlier.\nHer report criticises a \"complete failure to protect babies\" and a \"profound failure of management, governance and safeguarding\" at the hospital.\nThirlwall said this was because \"no one seems to have understood that safeguarding action is required when a member of staff is suspected of causing deliberate harm and does not require colleagues to be sure of guilt.\"\nShe said it would never be possible to know exactly how many lives could have been saved if safeguarding procedures had been properly followed.\nOne of the senior doctors who tried to raise concerns about Letby with hospital managers, consultant paediatrician Dr John Gibbs, now retired, told the BBC the Thirlwall Inquiry report was \"grim reading\".\nIn a rare interview he said he accepted that consultants must bear \"collective\" responsibility for some of the failings identified in the report, and said he wished they had been \"brave enough to follow our suspicions and escalate things to the police earlier\".\nChief executive and registrar at the Nursing and Midwifery Council (NMC), Paul Rees, said he was \"truly sorry for the NMC's failings\" in the Letby case and that \"we also did not act quickly enough to suspend Lucy Letby\".\nSharing her findings at Liverpool Town Hall, Thirlwall described \"dysfunctional management and governance, a gulf between hospital leadership and clinicians, and failure to understand the fundamentals of safeguarding\".\nLetby was moved on to administrative duties in July 2016 after consultants expressed concerns about her to the hospital's executive team.\nBut the inquiry has found that alarm bells should have been sounded earlier.\nThere were several \"missed opportunities\" for hospital bosses to intervene, the report said, including when three babies died in one cluster in June 2015.\nParents of the babies were \"kept in the dark for years\" over the concerns that their babies might have been deliberately harmed, the inquiry also found.\nThirlwall described the lack of consideration shown to parents as \"reprehensible\".\nThe report is highly critical of managers at the Countess of Chester Hospital.\nHospital bosses carried out a number of internal reviews into increased infant mortality in 2015 and 2016, but did not invite Cheshire Police to investigate until May 2017.\nLetby remained on site until her arrest more than a year later.\nCheshire Police said it would \"carefully review\" the contents of the report and \"fully consider\" relevant recommendations.\nThirlwall said the hospital's former chief executive Tony Chambers behaved in a \"dictatorial manner\" and had \"intended\" to obstruct a police investigation into deaths on the ward.\nChambers, along with director of nursing and head of safeguarding Alison Kelly and medical director Ian Harvey, \"dismissed the idea that Letby was deliberately harming babies\", Thirlwall added.\nBut whether these managers believed Letby was harming babies or not was \"irrelevant\", Thirlwall said, adding that action should have been taken as soon as concerns were raised.\nIn a joint statement, Chambers, Kelly and Harvey along with the hospital's former HR director Sue Hodkinson said: \"We are carefully reviewing the Thirlwall report and its recommendations.\n\"Given that there are a number of investigations under way, and that the work of the Criminal Cases Review Commission has not yet completed, it would be inappropriate for us to offer any further comment at this time.\n\"Our thoughts remain with the families affected by the tragic events that took place at the Countess of Chester Hospital.\"\nThe inquiry also condemned wider NHS culture, finding evidence of \"toxic negativity\" that discouraged whistleblowers.\nThe chair of the British Medical Association said on Tuesday that whistleblowers in the NHS \"deserve strong protections, and the inquiry makes it clear that these doctors did not get them\".\nRegulator the Care Quality Commission (CQC) was also criticised, with the report saying it did not show enough curiosity to look beyond what it was being told by the Countess of Chester Hospital.\nResponding to the report, the CQC's chief inspector of hospitals said \"crucial information\" was not shared by the Countess of Chester, but that the commission as a regulator did not take a \"sufficiently investigative and inquiring\" approach.\nDr Tony Onon said the regulator had since changed its approach to assessments.\nHealth Secretary", "translation_ja": "", "vocab": [{"word": "dysfunctional", "definition": "機能していない、または適切に機能していない状態を示す。組織やシステムが本来の目的を果たせていない場合に使用される。"}, {"word": "safeguarding", "definition": "特に子どもや脆弱な人々を危害から保護するための措置と手続き。組織的な責任と方針を伴う。"}, {"word": "governance", "definition": "組織や機関の経営・統治の方法と構造。意思決定権限と責任体制を指す。"}, {"word": "reprehensible", "definition": "非難されるべき、強く批判される価値のある。道徳的に許されない行為を表現する。"}, {"word": "obstruct", "definition": "何かの進行や実行を妨害する、または阻止する。特に法的または公式な手続きを意図的に遅延させることを指す。"}, {"word": "toxic", "definition": "有害で有毒な環境や文化を表す。組織内での不健全で悪影響を及ぼす状態。"}]}, {"title_ja": "レットビー事件の調査報告書は「痛ましい読み物」と医師が語る", "title_en": "Senior Doctor Says Letby Inquiry Report 'Grim Reading'", "summary_ja": "ルーシー・レットビーについての懸念を提起した小児科コンサルタントが、シルウォール調査報告書は痛ましい内容だとBBCに語った。報告書は新生児集中治療室での赤ちゃん保護の完全な失敗を指摘し、病院管理職が医師らの懸念を繰り返し無視していたことが判明した。ギブス博士は、医師らの集団的責任を認めながら、レットビーの有罪判決に関する独立した再審査を支持している。", "summary_en": "A consultant paediatrician who raised concerns about Lucy Letby told the BBC the Thirlwall Inquiry report makes for grim reading, acknowledging that doctors failed to escalate suspicions to police early enough. The 822-page report found a complete failure to protect babies on the neonatal unit, with hospital managers repeatedly dismissing consultants' concerns. Dr John Gibbs emphasized collective responsibility among senior doctors while supporting the ongoing independent review of Letby's convictions.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm3eqdv90977o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Letby hospital consultant says inquiry makes for grim reading\n- Published\nOne of the senior doctors who tried to raise concerns about Lucy Letby with hospital managers has told the BBC the final inquiry report makes for \"grim reading\".\nConsultant paediatrician Dr John Gibbs worked at the Countess of Chester Hospital throughout the period in 2015 to 2016 when Letby murdered seven babies, and attempted to murder seven more, on the neonatal unit.\nHe said that he accepted that consultants must bear \"collective\" responsibility for some of the failings identified in the report.\n\"I wish we consultants had been brave enough to follow our suspicions and escalate things to the police earlier,\" he told the BBC.\n\"When I say, 'we consultants', I am responsible as well and if my other consultant colleagues didn't go to the police, I should have.\"\nThe Thirlwall Inquiry was launched after former nurse Letby was convicted in 2023, and the final report was published on Tuesday.\nIn the 822-page document, Lady Justice Thirlwall described \"a complete failure to protect babies on the neonatal unit at the Countess of Chester Hospital\".\nThe report found that the police \"should have been notified earlier than they were\" and that hospital managers had repeatedly dismissed consultants' concerns.\nReflecting on the findings for the first time, Gibbs said: \"I wasn't expecting it to be an easy read and it certainly isn't. I'd imagine it's an extremely difficult read for the parents of the babies concerned.\n\"As I admitted when I appeared before the inquiry to give evidence, I feel we failed the babies and I apologise to the families for that.\"\nGibbs, who began working in Chester in 1994 and is now retired, agreed with the report's finding that hospital executives had multiple opportunities to act and potentially save babies' lives while the deaths were happening.\n\"But it was during that 11 months after Lucy Letby was moved off the unit, before the police got involved, that it was a very difficult atmosphere, very tense, very stressful dealing with the managers,\" he added.\nManagers \"were determined to ensure that we accepted Lucy Letby had been wrongly suspected of doing any harm,\" the senior doctor explained.\nHe also spoke of the failures of his and his wider team, specifically referencing a doctor who disregarded blood test results that suggested a baby had been poisoned with insulin in August 2015.\nWhile one of his colleagues had missed the relevance of the results when they came back from the lab, it had been a collective team failure, Dr Gibbs concluded.\n\"Others of us were on call and covering the neonatal unit over the next week or two before the baby moved out of the unit. We all had the opportunity to review the notes.\"\nLetby is serving 15 whole-life terms for the murders and has twice been denied permission to appeal against her convictions.\nThe Criminal Cases Review Commission (CCRC), an independent body set up to examine potential miscarriages of justice, is currently reviewing her convictions.\nIn the weeks and months after Letby was convicted, questions about the case arose in the form of online conspiracy theories and discourse from serious academics, including medical experts and statisticians.\nGibbs said that the continuing support for Letby had taken a toll on him and other consultants, and that claims she had been wrongly convicted were \"frustrating and difficult\" to hear.\n\"I particularly find the misinformation that's on the internet is difficult to deal with,\" he said.\nHe added: \"I haven't changed my mind that I think Lucy Letby is guilty.\"\nHowever, he emphasised that, because of the \"calibre of some of the people who've raised concerns\", it is \"important\" that the evidence used to convict Letby is being examined by the CCRC.\nRelated topics\n  - Published7 hours ago", "translation_ja": "", "vocab": [{"word": "escalate", "definition": "問題や状況を上級管理職や当局に報告して対応を求めること。段階的に深刻化させることも意味する。"}, {"word": "dismissive", "definition": "提案や懸念などを軽視して受け入れない態度。相手の意見を無視する姿勢のこと。"}, {"word": "neonatal", "definition": "新生児（生まれてから28日以内）に関連する医学用語。新生児医療や新生児集中治療室（NICU）などで使用される。"}, {"word": "conviction", "definition": "裁判で有罪と判決されること、または確固たる確信や信念を持つこと。この文脈では司法判断の意味。"}, {"word": "collective responsibility", "definition": "グループやチーム全体が一緒に責任を負うこと。個人ではなく団体全体の責任を意味する。"}, {"word": "miscarriage of justice", "definition": "司法制度の失敗により無実の者が有罪となること、または有罪者が適切に罰せられないこと。"}, {"word": "calibre", "definition": "人の能力や水準、またはものの質や規格を表す。「高い水準の人物」という意味で使用される。"}]}, {"title_ja": "英国の国家年金が年間£13,000を超える見通し、賃金上昇率は3.9%に鈍化", "title_en": "UK State Pension Expected to Exceed £13,000 Annually Amid Wage Growth Slowdown", "summary_ja": "英国の国家年金は三重ロック政策に基づき年間488ポンド上昇し、13,000ポンドを超える見込みです。この政策は賃金上昇、インフレ、または2.5%のいずれか最も高いものに基づいて増加を保証しています。しかし経済学者はこの政策の長期的な費用は実質的で持続不可能であると警告しており、年金が個人控除額を超えるため、年金受給者は初めて所得税に直面する可能性があります。", "summary_en": "The UK state pension is projected to rise by £488 annually to over £13,000 under the triple lock policy, which guarantees increases based on the highest of wage growth, inflation, or 2.5%. However, economists warn the policy's long-term costs are substantial and unsustainable, with pensioners potentially facing income tax for the first time as the pension exceeds the personal allowance threshold.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c2l8v7l0djqo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "State pension likely to top £13,000 a year as UK wage growth slows to 3.9%\n- Published\nThe state pension is expected to top £13,000 a year, reigniting the debate about its long-term affordability and generational fairness.\nThe full, flat-rate state pension is expected to rise by £488 a year in April, based on the latest official earnings figure released on Tuesday.\nThe so-called triple lock pension policy guarantees that the state pension will increase by either average wage growth, inflation or 2.5% - whichever is highest.\nLabour made a manifesto pledge to keep the triple lock until 2029, however economists have warned about the cost of the policy ahead of the Budget although pensioner groups say many people still face poverty in old age.\n'Substantial' cost\nThe triple lock was designed to ensure the value of the state pension was not overtaken by the increase in the cost of living or the incomes of working people.\nAlthough the state pension age is rising to 67, the cost to the government has risen considerably too. Forecasts suggest state pension spending, already at £154bn this year, could go up by a further £600m a year by 2029-30.\nThe policy is \"crazy,\" Ruth Curtice, the chief executive of the Resolution Foundation think tank, told the BBC.\nThe triple lock is creating a \"ratchet effect\" where \"pensioners' living standards grow even faster than just a typical worker,\" she added.\n\"Pensioners have seen living standards grow three times more than typical workers over the last 20 years.\"\nJonathan Cribb, deputy director of Institute for Fiscal Studies (IFS) think tank, said: \"Each increase in spending builds upon the last and so the long-run cost is substantial but very uncertain.\"\nHow much could pensioners receive?\nThe state pension is expected to match wage growth in the next calculation and is likely to be higher than the rate of inflation.\nAverage wage growth, including bonuses, stood at 3.9% between May and July, according to the Office for National Statistics (ONS), external, down from 4.2% between April and June.\nBut it is higher than average pay growth, not including bonuses, which rose by 3.5%.\nThis means:\n- the flat-rate state pension - for those who reached state pension age after April 2016 – will likely be £250.70 a week, or £13,036.40 a year. That would be an increase of £488\n- the old basic state pension - for those who reached state pension age before April 2016 – will likely be £192.10 a week, or £9,989.20 a year, an increase of £374.40\nPensioner groups have said older people face significant cost of living pressures, such as high energy bills and the state pension itself remained relatively small compared with state provision across Europe.\nWill pensioners pay tax?\nAlmost 13 million people receive the state pension in the UK. If it does rise by 3.9%, it would take the flat-rate state pension above the personal allowance of £12,570 and therefore be liable for income tax.\nThe government said it has recommitted to exempting people whose only income is the state pension from tax.\nThe Labour government - when Rachel Reeves was chancellor - promised that pensioners who rely solely on the state pension would not be required to complete a tax return, nor be chased to pay.\nWhen asked by the BBC on Tuesday morning, Business Secretary Jonathan Reynolds refused to confirm that pensioners reliant on the state pension will be exempted from paying income tax.\nLater, pensions minister Torsten Bell, said: \"In line with the commitment made at Budget 2025, pensioners who only just the exceed the personal allowance will not pay small amounts of tax in this parliament which we know is an administrative burden.\n\"The chancellor will set out further details on how that commitment will be delivered at the Budget.\"\nAnalysis by consultants LCP suggested that only one in 16 pensioners would benefit under the government's pledge, saving about £91 each a year.\nThe majority of pensioners have additional pension income and so pay income tax already.\n\"The government's plans to address this point are a mess,\" said Sir Steve Webb, a partner at LCP and a former Liberal Democrat pensions minister.\nPrior to the government saying it had recommitted to its pledge on tax and pensions, shadow chancellor Andrew Griffith said: \"People living on nothing but their state pension are now facing a tax bill for the first time ever.\n\"Many will spend the last years of their lives filing tax returns or hanging on HMRC telephone helplines.\"\nThe ONS also published figures on the UK labour force.\nWhile the unemployment rate was unchanged at 4.9%, the number of vacancies and employees on payrolls fell in recent months.\nGet in touch\nWill the increase see you pay tax for the first time?\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": [{"word": "triple lock", "definition": "政府が年金の最低上昇率を保証するメカニズム。賃金上昇率、インフレ率、固定率（通常2.5%）のうち最も高いものに基づいて年金を調整する政策。"}, {"word": "ratchet effect", "definition": "一度上昇したものが二度と元の水準に戻らない現象。ここでは年金が毎年上昇を続け、将来の政策コストが累積的に増加する状況を指す。"}, {"word": "manifesto pledge", "definition": "選挙時に政党が有権者に約束する公約。政策実行の意志を示す公式な約束のこと。"}, {"word": "affordability", "definition": "負担可能性、支払い能力があるかどうかの度合い。政府や個人が経済的に耐えられるか評価すること。"}, {"word": "liable for", "definition": "～に対して法的責任を負うべき状態。ここでは所得税を支払う対象となることを意味する。"}, {"word": "generational fairness", "definition": "異なる世代間の公平性。高齢世代と若年世代が負担と利益を公正に分担しているかどうかを評価する概念。"}]}, {"title_ja": "AI業界が規制を要求する一方、トランプ大統領は「デマ」と一蹴", "title_en": "AI Leaders Push for Regulation as Trump Dismisses Safety Concerns", "summary_ja": "OpenAI、Anthropic、Googleなどの大手AI企業は、研究者や業界指導者の安全性に関する懸念の高まりを受けて、金融業界の監視をモデルにした自主規制機関の開発を進めている。一方、トランプ政権はこれらの規制要求を「デマ」として一蹴しており、小規模なAI企業は自主規制が優位企業に有利に働く可能性があると警告している。", "summary_en": "Major AI companies OpenAI, Anthropic, and Google are developing a self-regulatory body modeled after financial industry oversight, amid growing safety concerns from researchers and industry leaders. The Trump administration has dismissed these regulatory calls as \"hoaxes,\" while smaller AI companies warn that self-regulation may unfairly disadvantage them in favor of dominant firms.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ai-leaders-call-for-regulations-trump-dismisses-hoaxes/a-79284638?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "AI leaders call for regulations, Trump dismisses 'hoaxes'\nSeptember 16, 2026\nSome of the top names in AI are working on creating a standards body they say would regulate the industry amid rising fears about its dangers and an apparent US reluctance to police its speedy development.\nChatGPT-maker OpenAI on Tuesday said it was working with top competitors Anthropic and Google on a self-regulatory body.\nThis comes amid rising calls for stricter control on the technology that is growing at lightning speed and not without dangerous precedents, calls that have thus far gone unanswered by the Donald Trump administration.\nWhat do we know about the proposed self-regulatory body?\nThe regulatory body, proposed by Google DeepMind's Demis Hassabis, would be modeled after the Financial Industry Regulatory Authority, which oversees US brokers and investment firms.\nHassabis had called in July for a federal organization that would test the most powerful AI systems before they are released to the public.\nHe suggested funding would come from the industry to \"attract world-class technical talent and provide the necessary compute resources for large-scale testing.\"\nThe proposal comes amid growing concerns about AI safety, which have escalated in recent weeks amid warnings from two former workers at major AI developers.\nResearcher Jacob Coxon, a former OpenAI employee, resigned from Anthropic last week, sounding the alarm that AI companies were \"gambling with our lives.\"\nOn Monday, former Google DeepMind researcher Bilal Chughtai echoed his concerns, warning that \"AI has the potential to kill us all, and that we might be running out of time to avoid this outcome.\"\nEven top names within the industry have raised similar concerns.\nOn Saturday, Anthropic CEO Dario Amodei called for a slowdown in the industry's development, with OpenAI CEO Sam Altman, xAI's Elon Musk and Hassabis all supporting the sentiment.\nHow has the US government under Trump reacted to the calls?\nTrump has dismissed the calls to better curb AI's development as \"hoaxes\" and a \"conspiracy,\" while a divided Congress, narrowly controlled by Trump's Republicans, has failed to act.\nThe looming midterm elections make it unlikely any action will come soon despite AI and the power-hungry data centers needed to run it being a concern for many voters.\nTrump's dismissal has been applauded by Nvidia CEO Jensen Huang, whose chipmaking company powers the vast majority of AI systems. Huang thanked the US president for \"seeing through\" the warnings on AI.\nThe dire prediction that AI could destroy humanity \"is not grounded on science,\" Huang said.\nLeading Republicans, including Vice President JD Vance, have, however, expressed caution.\nAmid Washington's persistent apathy toward regulation, smaller AI companies have warned any self-regulatory measures would come at their expense.\nCanadian AI company Cohere's chief, Aidan Gomez, has accused the dominant American AI labs of forming a \"cartel\" under the guise of safety.\n\"AI needs guardrails. That is not the dispute and never has been. The dispute is over who writes them, who gets to participate and whose interests the rules are protecting,\" Gomez wrote in a blog post on Sunday.\nEdited by: Sean Sinico\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "self-regulatory", "definition": "業界自身が定めたルールに基づいて自らを規制する様子。政府ではなく企業や団体が自発的に管理する仕組みを指す。"}, {"word": "escalated", "definition": "状況や問題がより深刻になること、または急速に悪化することを意味する。段階的に進展する状況を表す。"}, {"word": "persistent apathy", "definition": "継続的で根強い無関心や無頓着の状態。特定の問題に対して長期間にわたり関心を示さない態度を指す。"}, {"word": "cartel", "definition": "特定の目的のため複数の企業や団体が協力し、市場を支配する不正な同盟。独占を目的とした企業グループを意味する。"}, {"word": "guardrails", "definition": "安全装置や制限措置のこと。特に技術やシステムの危険な使用を防ぐための規制や制限を指す。"}, {"word": "looming", "definition": "差し迫って現れる、または不気味に迫ってくる様子。近い将来に起こる危険な出来事を示唆する。"}]}, {"title_ja": "トルコにおけるLGBTQ+への強制捜査に対する批判が高まっている", "title_en": "Criticism of LGBTQ+ raids in Turkey is growing", "summary_ja": "トルコ当局は週末にLGBTQ+活動家および団体を標的とした強制捜査を実施し、逮捕とアカウント削除をもたらした。政府は「家族と人口の10年」計画の一部として作戦を正当化したが、女性の権利団体、医師会、政治家から差別およびデジタル検閲と呼ばれる厳しい批判に直面した。", "summary_en": "Turkish authorities conducted raids targeting LGBTQ+ activists and organizations over the weekend, resulting in arrests and account blockages. The government justified the operations as part of a \"Decade of Family and Population\" scheme, but faced sharp criticism from women's rights groups, medical associations, and politicians who called it discrimination and digital censorship.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/criticism-of-lgbtq-raids-in-turkey-is-growing/a-79284021?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Criticism of LGBTQ+ raids in Turkey is growing\nSeptember 15, 2026\nRaids targeting LGBTQ+ activists and organizations took place in Turkey over the weekend. Several people were arrested by the Turkish authorities and many social media accounts were blocked. The Turkish government's actions have drawn sharp criticism from across the country and also from Brussels.\nTurkish President Recep Tayyip Erdogan had announced the operation as part of the \"Decade of Family and Population” scheme, a national strategy proclaimed in May 2025 that was to counter the drastic decline in the country's birthrate and strengthen the traditional, conservative family view in Turkey.\nOn Tuesday, Istanbul saw demonstrations again. Turkish LGBTQ+ associations emphasized in a joint declaration that it wasn't a crime to set up an association and advocate for rights.\n\"Freedom of assembly, freedom of opinion, protection of privacy and presumption of innocence apply to LGBTQ+ people as well,\" the declaration stated.\nThe LGBTQ+ community also received support from the women's movement. 120 women's rights organizations signed a joint declaration in which they criticized authoritarianism in Turkey.\n\"As women, we stand against the operations carried out in the name of 'keeping the family safe.' We know that the repression of our bodies, our lives, our identities, and our right to organize is part of the same authoritarian politics. Being [LGBTQ+] is not a crime! Organizing as [LGBTQ+] people is not a crime!\", the organizations stated.\n'The aim is criminalization'\nThe government is trying to criminalize the LGBTQ+ community, says Yildiz Taghizade of Women for Women's Human Rights (WWHR), an organization that co-signed the declaration. This criminalization did not just start with the operations of the past few days, but had already been going on for a few years, according to Taghizade.\n\"The aim is not only to target LGBTQ+ people, but to practically ban the LGBTQ+ community from engaging in politics, getting organized, claiming rights and showing presence in the public sphere,\" Taghizade said.\nIt was no coincidence that the operation came with the slogan \"My family is safe.\"\n\"The government is trying to justify its actions by invoking the protection of families and children, but this narrative doesn't work. Because when we look at Turkey today and what is actually a factor of uncertainty for families, we come across very concrete issues such as poverty, the housing crisis, unemployment, care work [caring for and tending to relatives, the ed.] passed on to women, and male violence against women,\" Taghizade said.\nCriticism from medical community, trade associations, politicians\nOther organizations also criticized the government's actions. The Turkish Medical Association (TTB) described them as a violation of human rights, demanding an end to the politics of discrimination. It was unacceptable, it said, to treat gender identity and sexual orientation as a crime, take people out of their homes at night and block digital channels — all in the name of family protection and security.\nThe chairman of the Workers' Party of Turkey (TIP), Erkan Bas, called for the immediate release of those arrested, arguing that the mere existence of LGBTQ+ persons was no crime.\nBut all those who did not share the government's views were \"'called to order' by judiciary, truncheon and censorship. If they had their way, they'd love nothing more than to enshrine the criminal offense of 'being an opponent of the government' by law and sit back,\" Bas said.\nIn the name of 'national security'\nThe raids took place on Sunday in Istanbul, Ankara and Izmir. Over the weekend, numerous websites and social media accounts belonging to LGBTQ+ groups, various organizations and activists were blocked. On the day of the raids, another 32 accounts were suspended. On the following day, the number of blocked accounts reached a total of more than 100.\nAmong those affected were Amnesty International Turkey, the left-leaning Evrensel newspaper, the Academics for Peace initiative, the Lawyers for Justice association, the women's rights organization Mor Dayanisma, the LGBTQ+ rights group Kaos GL and the Media and Law Studies Association (MLSA).\nThe legal basis was a ruling by an Istanbul court announced on September 13. The Public Prosecutor's Office in Bakirkoy justified the suspensions by citing investigations into accounts that had spread \"obscene content and LGBTQ+ propaganda.\"\nAccording to several media outlets, the accounts were also blocked on grounds of \"national security.\"\nCritics called the move digital censorship.\nHomosexuality not a criminal offense\nHomosexual relationships are not a criminal offense in Turkey. However, the Turkish government had repeatedly referred to the LGBTQ+ community as a movement of \"perverts.\"\nJustice Minister Akin Gurlek had previously accused LGBTQ+ organizations of \"promoting immorality.\" He declared in a social media post that \"no criminal organization, abus", "translation_ja": "", "vocab": [{"word": "criminalization", "definition": "違法と見なすこと、または犯罪化すること。政府がある行為や集団を法的に犯罪と定義するプロセスを指す。"}, {"word": "authoritarianism", "definition": "権力の集中と個人の自由の制限を特徴とする支配体制。政府が市民の権利をコントロールする傾向を示す。"}, {"word": "digital censorship", "definition": "インターネットやソーシャルメディアでの情報流通を制限または遮断すること。政府が特定のオンラインコンテンツを削除またはブロックする行為。"}, {"word": "discrimination", "definition": "特定の集団または個人に対する不公正な扱い。年齢、性別、人種などの属性に基づいて人々を差別することを指す。"}, {"word": "obscene", "definition": "道徳的に不快である、または法律で禁止される可能性のある露骨な内容。社会的に受け入れられないと見なされるコンテンツを説明する。"}, {"word": "presumption of innocence", "definition": "有罪が証明されるまで誰もが無罪と見なされるべきという法的原則。司法制度における基本的人権。"}]}, {"title_ja": "ドイツ政府を悩ます高騰する燃料価格、対策は不確定のまま", "title_en": "High fuel prices challenge German government as relief measures remain uncertain", "summary_ja": "ドイツの燃料価格が1リットル3ユーロを超える記録的な高さに達し、怒った運転者たちが隣国での給油を求めている。メルツ首相は迅速な政府対応を約束しているが、連立政権は通勤者への税制優遇と価格上限設定の間で意見が分かれており、予算制約が選択肢を制限している。", "summary_en": "Germany faces record fuel prices exceeding €3 per liter, prompting angry drivers to seek alternatives across neighboring borders where gas is significantly cheaper. Chancellor Merz promises swift government action, but the coalition government remains divided between proposing tax relief for commuters versus implementing price caps, while budget constraints limit available options.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/high-fuel-prices-challenge-the-german-government/a-79282456?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "High fuel prices challenge the German government\nSeptember 15, 2026\nGas stations in Germany are only allowed to raise their fuel prices once a day, at 12 noon. In Berlin, on the morning of September 15, E10 gasoline cost about €2.25 ($2.60) per liter and diesel about €2.37. At noon, prices rose by about €0.20 per liter. The highest prices were recorded at a highway gas station in southern Berlin, where Super Plus cost €3.03 per liter.\nDrivers are angry. While it's possible to use public transportation in large cities, residents of rural areas have hardly any realistic alternative to driving. Those living in regions near national borders have an advantage. On September 7, filling up a 60-liter tank with E10 gasoline cost about €31 less in the Czech Republic and Poland than in Germany. In Luxembourg, the difference was €28, and in Austria, €25. These figures were calculated by the Federal Statistical Office.\nGermany has nine neighboring countries. Gasoline is significantly cheaper in seven of them, and diesel is cheaper in six. Only in the Netherlands and Denmark do drivers have to pay more for fuel than in Germany.\nGerman government expresses 'great and growing' concern\nBut relief is in sight. That's what Chancellor Friedrich Merz(CDU) has promised.\n\"Many people who need their cars every day have reached their breaking point,\" Merz said Tuesday at an event hosted by the German Foreign Trade Association (BGA) in Berlin. \"I believe we must take action.\"\nHowever, the chancellor added that the \"exact measures\" have not yet been determined.\n\"We are therefore in close dialogue within the federal government and with the German states.\" A proposal will be announced \"very soon,\" Merz said.\nBut what might that look like? On Monday (Sept. 14) in Berlin, deputy government spokesperson Steffen Meyer rejected any government responsibility for the high prices.\n\"It's not the actions of the federal government or anything like that causing prices to rise so sharply. Rather, it's largely due to the escalating situation in the Middle East, attacks on oil pipelines and the blockade of shipping lanes,\" Meyer said.\nThe fact is, however, that Germany imposes higher taxes and levies on fuels. The ADAC automobile club has pointed out that while the oil price remains below previous peaks, E10 gasoline is more expensive than ever before.\n\"From the ADAC's perspective, there is therefore a need to provide greater clarity, especially regarding refinery and wholesale markets,\" said an ADAC spokeswoman.\nPrice gouging at the pumps\nHerbert Rabl of the Gas Station Interest Group (TIV) puts it more bluntly.\n\"They're raking it in. The oil companies aren't cutting into their profit margins at all,\" Rabl told the Rheinische Post newspaper.\nHe said that this is an issue that has long been the subject of political debate, but that the federal government remains divided on what, if anything, can be done about it.\nHowever, the problem that the conservative bloc of Christian Democratic Union/Christian Social Union (CDU/CSU) and the center-left Social Democratic Party (SPD) face as coalition partners is that the state coffers are empty, and the federal government cannot cover its budget shortfall without taking on a historically high level of new debt.\n\"Ultimately, the only way to bring these prices down is to end the hostilities and ensure the freedom of navigation,\" said spokesperson Meyer.\nA new fuel rebate or tax relief?\nFaced with rising oil prices that followed the outbreak of the war on Iran, the German government introduced a fuel rebate in the spring. From May 1 through June 30, 2026, the energy tax on gasoline and diesel was temporarily reduced. Factoring in value-added tax, this was expected to lower fuel prices by about €0.17 per liter.\n\"We had a fuel rebate; we subsidized prices,\" Federal Economy Minister Katherina Reiche (CDU) told the n-tv network.\nBut she says that won't be possible again: \"Together, we in the coalition have decided that we don't have the financial scope for that at the moment.\"\nAs an alternative, the conservatives are exploring the possibility of at least providing tax relief for commuters or supporting low-income earners with direct payments.\nBut that's not enough for the SPD. It is proposing a completely different approach and, as it did shortly after the outbreak of the Iran war, is advocating for a government-imposed cap on fuel prices. One of the ways they plan to finance this relief is through an excess profit tax on energy companies. In addition, the SPD supports a temporary reduction in energy taxes to deal with crisis situations. Their goal is an immediate price reduction at the gas pump.\nAfD standing to profit from bickering\nBut while the federal government continues to debate and weigh its options amid internal disagreements, other parties feel time is running out. Regional elections will be held in two states on September 20.\nIn Mecklenburg-Western Pomerania, SPD Premier Manuela Schwesig is fighting to stave", "translation_ja": "", "vocab": [{"word": "escalating", "definition": "段階的に悪化または激化すること。この文脈では、中東情勢の悪化により油価が上昇していることを指す。"}, {"word": "blockade", "definition": "軍事的または政治的な目的で、特定の地域や物資への出入りを遮断すること。ここでは海上輸送ルートの遮断を意味する。"}, {"word": "levies", "definition": "政府が課す税金や料金のこと。燃料に対して課される各種の税制上の負担を指す。"}, {"word": "coalition", "definition": "共通の目標のために一時的に結成された複数の政治政党や組織の連合体。CDUとSPDの政治同盟を指す。"}, {"word": "subsidy", "definition": "政府が特定の産業や個人に対して提供する資金援助。燃料価格の引き下げを目的とした政府支援を意味する。"}, {"word": "excess profit tax", "definition": "通常の利益を超える部分に対して課せられる特別税。エネルギー企業の過度な利益に対する課税を指す。"}]}, {"title_ja": "トランプ・ジュニアへのロシア富豪からの結婚祝いについての捜査は行われない見込み", "title_en": "Investigation Unlikely Into Russian Oligarch's Wedding Gift to Trump Jr.", "summary_ja": "マンハッタン地方検事アルビン・ブレイク氏は、ロシア富豪ウマル・クレムレフからトランプ・ジュニアへ贈られた結婚祝いについての捜査が行われる見込みはないと述べた。トランプ家はクレムレフとのいかなる関係も否定している。この声明は、潜在的な外国との接触についての継続的な精査の中で発表された。", "summary_en": "Manhattan District Attorney Alvin Bragg indicated that an investigation into a wedding gift allegedly from Russian oligarch Umar Kremlev to Trump Jr. is unlikely to proceed. Trump family members have denied any connection to Kremlev. The statement comes amid ongoing scrutiny of potential foreign contacts.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/blanche-investigation-russian-oligarchs-wedding-gift-trump-jr/story?id=136462728", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、世界中の速報ニュースとライブイベントを24時間体制でカバーしています。主要なニュースの展開をリアルタイムで視聴できます。ABCニュースのライブ報道と専門家による分析で常に最新情報をお届けします。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events from around the world. Watch continuous news updates and major developing stories as they unfold. Stay informed with ABC News' live reporting and expert analysis.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI がもたらす主な脅威と懸念すべき理由", "title_en": "Top AI Threats and What You Should Know", "summary_ja": "AI 業界の有力人物らが最近、人工知能がもたらす潜在的なリスクについて深刻な警告を発表しました。これらの警告は、AI 技術がますます強力になる中で、安全性、悪用、および予期しない結果についての懸念を強調しています。専門家は、利害関係者と一般市民がこれらの脅威を真摯に受け止めるよう促しています。", "summary_en": "Leading figures in the AI industry have recently issued serious warnings about potential risks posed by artificial intelligence. The warnings highlight concerns about safety, misuse, and uncontended consequences as AI technology becomes increasingly powerful. Experts are urging stakeholders and the public to take these threats seriously.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Business/top-threats-posed-ai-worried/story?id=136419658", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領の難民再定住計画の後、米国への難民資格を否定された南アフリカの白人たち", "title_en": "White South Africans denied US refugee status after Trump's resettlement program", "summary_ja": "2025年2月のトランプ大統領による南アフリカの白人難民プログラムの発表に続き、数千人が米国に到着しましたが、6月以降、数十人の申請者が理由不明の却下通知を受け取っています。却下された申請者は、軽微な犯罪記録から行政上の誤りまで、さまざまな問題を報告しており、条件付き承認に基づいて家を売却した後、困惑し経済的に打撃を受けています。", "summary_en": "Following Trump's February 2025 announcement of a refugee program for white South Africans, thousands have arrived in the US, but since June, dozens of applicants have received rejection letters with unclear reasoning. Rejected applicants report issues ranging from minor criminal records to administrative errors, leaving them confused and financially devastated after selling their homes based on conditional approvals.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/15/white-south-africans-denied-refugee-status-us", "state_media": false, "category": "社会", "full_text": "When Donald Trump announced in February 2025 that the US would accept Afrikaners from South Africa as refugees, many white South Africans who believed that they were victims of racism in their country thought that their prayers had been answered.\nHowever, in the past few months, dozens of applicants to the refugee programme have been rejected, with many left dismayed and confused as to why they would be left to face what Trump has falsely claimed is a “white genocide” in South Africa.\nAfter Trump’s February 2025 executive order announcing the resettlement programme, which was expanded to include members of a “racial minority”, the first group of 68 white South Africans arrived in the US that May. The US also shut down the refugee programme for anyone else fleeing war and persecution.\nSince then, more than 13,000 have moved to the US, according to state department figures. Arrivals are also accelerating, with more than 2,600 admitted in August.\nAfrikaners, descended from Dutch and French settlers, ruled South Africa during apartheid. The regime repressed the black majority, while keeping white people safe and wealthy.\nSince the end of apartheid more than 30 years ago, affirmative action policies have helped to create a black elite and middle class. But about 38% of black South Africans are unemployed, compared with 9% of white South Africans, according to official data.\nMeanwhile, the “black economic empowerment” policies, along with high crime rates that affect everyone, have fostered a feeling among some white South Africans that they are now the victims of racial discrimination.\nThe racist far right has also long highlighted brutal murders of white South African farmers, claiming them as evidence of white people being targeted. Official crime data does not show farmers or white people experiencing crime at higher rates. That has not stopped Trump amplifying these claims, in the face of the South African government’s furious rebuttals.\nOn 30 June, Facebook and WhatsApp groups for prospective and successful refugee applicants began to light up with news that people had begun to receive rejection letters.\n“We are writing to inform you that, following review, USCIS [US Citizenship and Immigration Services] found your application to be ineligible for continued processing for resettlement to the United States at this time. This cannot be appealed,” the letters said, according to multiple rejections seen by the Guardian.\nIt is unclear how many have been found ineligible. USCIS did not provide data on the total number of refugee applications and rejections. One WhatsApp group set up to support rejects, called Hope beyond the Letter, had 311 members as of 10 September, according to one of the administrators, who noted that the membership fluctuated.\nWhile the ineligibility letters did not give reasons for rejection, some applicants were given more information after making Freedom of Information Act (FOIA) requests. The WhatsApp group administrator, a 64-year-old freelance TV professional, who did not want his identity disclosed, found that his case was initially “recommended for approval”. However, the recommendation was reversed because his ex-girlfriend, whom he had applied with, had a marijuana conviction.\n“I cried like a baby,” he said, of receiving the rejection letter on 30 June, having finished the screening process in November. “It was something I actually believed was attainable. I believed the hype.”\nPieter and Liesl (not their real names) were told they were “conditionally approved” as refugees last November. Both are Afrikaners who had a grandparent killed on a farm and were managing a farm when they applied to become refugees.\nPieter said he was convicted of trespassing in 2014, for which he said he paid a fine and did not go to court. He was granted multiple temporary visas to work on farms in the US between 2011 and 2024.\nThe couple’s youngest daughter was born in the US and is a US citizen. In the response to their FoI request, they noticed that USCIS had recorded her nationality as South African and incorrectly said that she would be left behind if they moved to the US as refugees.\nThey had already sold their house, car and many of their possessions when they received a rejection letter on 24 July. “We have to start all over again,” Pieter said.\nAnother applicant blamed not being able to speak in his native Afrikaans for what he claimed were misunderstandings that led to him and his wife being rejected. The reasons given in response to their FoI request were “crime involving moral turpitude” and “commission of acts of torture or extra judicial killing”.\nThe 67-year-old had admitted to shooting at least one black person when working as a security guard in 1995, but said it was in self-defence while responding to the mass break-in of an alcohol shop. “I was thoroughly investigated by the authorities,” he said. “I was not charged, because I did not break the law.”\nIn an emailed response that did not ", "translation_ja": "", "vocab": [{"word": "ineligible", "definition": "適格でない、要件を満たさないという意味。申請や参加の資格がないことを示す公式な用語です。"}, {"word": "conditional approval", "definition": "条件付き承認という意味で、最終的な決定の前に特定の条件を満たす必要がある承認状態を指します。"}, {"word": "moral turpitude", "definition": "道徳的堕落を意味する法律用語で、誠実さ、善良性、道徳性に根本的に反する犯罪行為を指します。"}, {"word": "extrajudicial", "definition": "司法制度外でという意味で、法廷を通さずに行われる行為を指す法律用語です。"}, {"word": "apartheid", "definition": "南アフリカで1948年から1994年まで実施された人種隔離制度。白人支配層が黒人やその他の有色人種を抑圧した政策です。"}, {"word": "affirmative action", "definition": "積極的差別是正措置という意味で、過去の差別による不利を補うため、特定のグループに優遇措置を与える政策です。"}]}, {"title_ja": "コンゴ民主共和国のエボラ流行がピークに、感染率が低下", "title_en": "Ebola outbreak in DRC peaks as infection rates slow, authorities say", "summary_ja": "コンゴ民主共和国の保健当局は、エボラ流行がピークに達したと発表し、1日の感染者数が120人から80人に減少したと述べた。5月に宣言されたブンディブギョ変種の流行は、9月中旬時点で7,200人以上の確認症例と3,475人以上の死亡者に影響を与えている。しかし、一部の当局者は制御の時期尚早な宣言に対して警告を発し、疫学的データの透明性と継続的な封じ込め努力を求めた。", "summary_en": "Congolese health authorities announced that the Ebola outbreak has reached its peak, with daily infection cases declining from 120 to 80. The Bundibugyo variant outbreak, declared in May, has affected over 7,200 confirmed cases with more than 3,475 deaths as of mid-September. However, some officials cautioned against premature declarations of control, calling for transparency in epidemiological data and sustained containment efforts.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/sep/15/ebola-outbreak-in-drc-has-peaked-say-authorities-as-infection-rates-slow", "state_media": false, "category": "社会", "full_text": "Authorities in the Democratic Republic of the Congo have announced that the Ebola outbreak ravaging parts of the country has reached its peak.\nFor the first time since the epidemic was declared in May, the numbers of people becoming infected is slowing down, according to officials.\nStressing that strict adherence to preventive measures needed to be kept in place, Samuel Roger Kamba, the Congolese health minister, said there was a decline in transmission of the Bundibugyo variant of Ebola.\n“We are fighting a very dangerous virus that is killing many of our people. Today, we can say that the outbreak is under control,” he said. “At one point, we were recording about 120 cases per day; today, we’re seeing about 80 per day. So the number of new cases is decreasing every day.\n“It has been more than 22 days since 10 of the 62 health zones have reported new cases. And so we can now definitively remove six health zones from the list because they have gone more than 42 days without new cases, and we can remove four health zones that have gone more than 21 days without a new case,” Kamba said.\nLast week, the Sud-Ubangi region, on the DRC’s borders with Congo-Brazzaville and Central African Republic, became the sixth province to report the disease.\nThe Bundibugyo virus outbreak was declared by Congolese authorities on 15 May and is concentrated primarily in Ituri province, where ongoing conflict has created challenging conditions for those responding to the disease. It is the 17th outbreak of Ebola in the DRC since the highly contagious disease was first identified and named in 1976.\nNo effective treatment for the Bundibugyo variant has been found so far but there are clinical trials in the region. The DRC received more than 70,000 doses of the Ervebo vaccine last month, which is the only approved treatment for the more common Zaire Ebola virus.\nAccording to the latest data from the Congolese health ministry, the number of confirmed cases stood at more than 7,200, including more than 3,475 deaths, as of 14 September.\nWhile welcoming the progress made, Iracan Gratien de Saint-Nicolas, an MP for Bunia, warned against what he called “triumphalism” and stressed that efforts must intensify to show people that the disease was under control.\nGratien Iracan called for lessons to be learned from failures in epidemiological surveillance that contributed to the rapid spread of the disease.\nThe MP also expressed some scepticism over the government announcement. “Claims that an epidemic is under control must be supported by objective indicators. If the indicators show that the epidemic is indeed under control, let’s make them public. Transparency in the data will strengthen public confidence,” he said.\nHe warned that some indicators that showed an epidemic was under control seemed to have been omitted by the DRC authorities, such as a sustained decline in new cases (over seven to 21 days), a decrease in deaths, a reduction in areas with active transmission, the majority of new cases originating from contacts already identified, and a high rate of contact tracing, as well as dignified and safe burials.\nEarly last month, Jean Kaseya, the director general of the African Centres for Disease Control and Prevention, visited Bunia – capital of Ituri and a centre of the current Ebola outbreak – and said then that there was no way of knowing when the peak might be reached but that containment and contact tracing were still not effective enough.\nKaseya said: “A large portion of the mortality – 60 to 70% of deaths – comes from the community. The list of contacts we have just keeps growing. Epidemiologists say we’ve reached the peak when all cases come from the list of contacts.”\nIn Rwampara, a town in Ituri, people are exhausted from the past few months of living with the dread of the disease. Léa Munyere, 36, a mother of four, said she was relieved that the health authorities had announced that Ebola was under control. Two of her close friends had died and she was still struggling to come to terms with the loss, she said.\n“We hope the disease will soon be declared over. It has robbed us of the people we cherish so much since it was first reported,” she said. “We just want to get back to our normal lives.”", "translation_ja": "", "vocab": [{"word": "epidemiological", "definition": "疫学に関する、感染症の発生・蔓延を統計的に研究することに関連する。疾病の流行や感染パターンの分析に用いられる専門用語。"}, {"word": "transmission", "definition": "伝播、感染の拡がり。病原体がある人から別の人へ移ることを指す医学用語。"}, {"word": "contagious", "definition": "伝染性の、感染力が強い。病気が人から人へ容易に広がることを意味する。"}, {"word": "containment", "definition": "封じ込め、拡大防止。感染症の蔓延を制限・抑制するための対策を指す。"}, {"word": "triumphalism", "definition": "過度な勝利宣言、根拠のない楽観主義。問題が完全に解決していないのに成功を大げさに喧伝する態度。"}, {"word": "variant", "definition": "変異体、亜種。ウイルスなどの病原体が遺伝的に変化したもので、異なる特性を持つ。"}]}, {"title_ja": "奴隷貿易投資家の富で建設されたロンドン病院", "title_en": "London Hospital Built With Wealth From Slave Trade Investors", "summary_ja": "ロンドンの聖バーソロミュー病院は、大西洋奴隷貿易から利益を得た裕福な寄付者によって資金提供されたことが、イギリス奴隷商人登録簿の研究により明らかになった。この登記簿は、病院に寄付した奴隷制度に関連する少なくも50人を特定しており、その中には1694年の航海で死亡率が50%近かった船ハンニバルの所有者サー・ジェフリー・ジェフリーズも含まれている。この発見は、アフリカ人奴隷の苦しみがイギリスの主要機関に資金を供給し、今日でもなお記念されていることを浮き彫りにしている。", "summary_en": "St Bartholomew's Hospital in London was funded by wealthy donors who profited from the transatlantic slave trade, according to research from the Register of British Slave Traders. The register identifies at least 50 people with financial ties to slavery who donated to the hospital, including Sir Jeffrey Jeffreys, whose ship the Hannibal had a mortality rate near 50% during a 1694 voyage. The discovery highlights how enslaved African people's suffering financed major British institutions that are still commemorated today.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/uk-news/ng-interactive/2026/sep/14/london-hospital-st-barts-funded-donors-invested-slave-trade", "state_media": false, "category": "経済", "full_text": "Inside the Great Hall of St Bartholomew’s North Wing, alongside stately portraits of the apostle from whom London’s oldest hospital takes its name and King Henry VIII, extravagant commemorative boards adorn the walls.\nThe Great Hall was a grand, formal space where governors weighed their philanthropic donations and drafted their wills, many while investing in the stock of companies built on the trafficking of enslaved Africans. Today, many of those donors are commemorated in acrylic gold paint on the boards.\nThe Register of British Slave Traders, a joint venture between Lancaster University, the University of Manchester and University College London, includes biographical data on every known investor in Britain’s transatlantic trafficking of enslaved African people from the 16th to 19th centuries.\nIt reveals how wealthy individuals, often enriched by the proceeds from racialised chattel enslavement, donated to hundreds of church parishes and helped to fund schools, hospitals and charities across the country.\nProf William Pettigrew, who led the project, said the register had established connections with roughly 900 organisations. “Most of those organisations sought to improve the lives of ordinary Britons,” he added.\nThe register reveals at least 50 people with deep financial ties to Barts who are directly linked to this history.\nAmong the names etched on to the boards in the Great Hall is Sir Jeffrey Jeffreys, a London merchant who left an unspecified sum to the hospital in his will. In 1694, the Jeffreys-funded ship Hannibal, commanded by Capt Thomas Phillips, docked in Barbados. This concluded a harrowing journey in which only 372 of the 700 enslaved African people bought at Whydah (Ouidah in modern-day Benin) survived the Atlantic crossing.\nPhillips’s journal, one of the few surviving records of the voyage, details the horrors onboard, where captives were subjected to branding and calculated psychological cruelty. “Then we marked the slaves we had bought in the breast or shoulder, with a hot iron, having the letter of the ship’s name on it,” he wrote. The Africans on his ship, he recorded, held “a more dreadful apprehension of Barbadoes than we have of hell”.\nPhillips recalled using African overseers, who were enslaved themselves, to keep order, whipping any plotters of mutiny. There were grave consequences of the squalid conditions on the ship; many who died on the Hannibal were killed by smallpox, dysentery, starvation and suicide. Some were thrown overboard when dead or dying to prevent the spread of disease and to protect profits.\nThe voyage’s mortality rate was close to 50%, cementing its place as one of the deadliest crossings in the history of the transatlantic trafficking of enslaved Africans.\nThe 1694 Hannibal crossing was one of 13 to which Jeffreys was financially linked. The London merchant was a director of the Royal African Company from 1684-86, and from 1692-98. His latter term coincided with the end of the company’s royal monopoly on trading enslaved Africans, from which he profited handsomely. He also inherited a fortune from his tobacco-trading uncle, John Jeffreys, in 1688. During Jeffrey Jeffreys’ time with the RAC, the organisation made 170 crossings.\nOthers commemorated at Barts have links to the trafficking of enslaved Africans. Edward Colston, whose statue was toppled by Black Lives Matter protesters in Bristol in June 2020, appears in the register. William Prichard, once president of Barts and a leading City merchant, bought £600 of RAC stock in January 1678.\nSir Robert Geffrye, who left money to the hospital and other philanthropic causes in his will, was a substantial investor in the trafficking of enslaved Africans, selling £1,600 (the equivalent of £350,000 today) of RAC stock on 5 January 1692 alone. Diane Abbott, the MP for Hackney North and Stoke Newington, has called for the removal of Geffrye’s statue at the Museum of the Home in Hoxton.\nThese connections run through the heart of the City of London’s political structure, with several lord mayors commemorated in the Great Hall. Sir William Humphreys, who left legacies to three London hospitals including Barts, sat on the RAC’s court of assistants from 1683-85 and from 1688-90. In 1711, he attended Board of Trade hearings on the company’s operations on the west African coast, three years before he became lord mayor.\nHis predecessor, Samuel Stanier, who also left money to Barts in his will, sold off most of his substantial £4,000 holding in the RAC in February 1698, before his lord mayoralty started in 1713.\nAfter the British crown was restored in 1660, the trafficking of enslaved Africans became more formalised and was a lucrative source of funds for merchants.\nThe private banker Sir Robert Vyner (also known as Viner) became a central figure in the City and was lord mayor of London from 1674-75. He first invested in the Company of Royal Adventurers in January 1663; by August, his holding had grown to two shares, worth £800", "translation_ja": "", "vocab": [{"word": "chattel enslavement", "definition": "個人が所有物（チャッテル）として売買される奴隷制度を指す。人間を完全な財産として扱う法的・経済的システムのことである。"}, {"word": "transatlantic trafficking", "definition": "大西洋を横断してアフリカからアメリカ大陸への奴隷の強制移送を指す。歴史的な奴隷貿易の中心的な流れである。"}, {"word": "mortality rate", "definition": "一定期間における死亡者数の割合を示す統計指標。ここでは航海中に死亡した奴隷の比率を意味する。"}, {"word": "commemorated", "definition": "歴史上の人物や出来事を記念・記録として保存し、その名前や功績を永遠に残すことを意味する。"}, {"word": "lucrative", "definition": "利益が大きく、金銭的に非常に有利であることを表す。収益性の高いビジネスや投資を指す。"}, {"word": "monopoly", "definition": "特定の商品やサービスを独占的に供給・販売する権利を持つ状態。市場において競争がない状態を意味する。"}]}, {"title_ja": "共和党下院議員、国防長官ヘグセスの弾劾を要求", "title_en": "Republican Congressman Calls for Impeachment of US Defense Secretary Hegseth", "summary_ja": "共和党のトーマス・マッシー下院議員は、国防長官ピート・ヘグセスに対して議会の承認なしに軍事作戦を実施し、民間人の犠牲者を軽視したとして弾劾手続きを開始しました。トランプ政権の軍事介入の批評家であるマッシーは、ヘグセスが憲法上の権限を濫用したと主張しています。弾劾決議案は共和党多数派の下院では可決の可能性が低いですが、右派内の少数派からの批判が高まっています。", "summary_en": "GOP Representative Thomas Massie has initiated impeachment proceedings against Defense Secretary Pete Hegseth, accusing him of conducting military operations without congressional approval and disregarding civilian casualties. Massie, an outspoken critic of the Trump administration's military interventions, argues that Hegseth has abused his constitutional powers. The impeachment resolution faces long odds in the Republican-majority House despite growing criticism from a small faction of right-wing figures.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/15/republican-congressman-calls-to-impeach-us-defence-secretary-pete-hegseth?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Republican congressman calls to impeach US Defence Secretary Pete Hegseth\nGOP Representative has emerged as outspoken critic of war on Iran and overseas military interventions.\nUnited States Republican Representative Thomas Massie, an outspoken critic of the Trump administration’s war on Iran, has sought to force a long-shot vote in the US Congress on the impeachment of Secretary of Defence Pete Hegseth.\nMassie read articles of impeachment against Hegseth in the US House of Representatives on Tuesday, accusing the Pentagon chief of waging war without congressional approval, carrying out extrajudicial killings, and paying little mind to civilian casualties in military operations.\nRecommended Stories\nlist of 3 items\n- list 1 of 3How Thomas Massie came to represent Republican dissent in age
