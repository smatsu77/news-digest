of Trump\n- list 2 of 3‘Unpatriotic’: Trump decries Republicans who voted to constrain Iran war\n- list 3 of 3Massie race breaks spending record as pro-Israel groups target Trump critic\n“Secretary Hegseth abused the powers entrusted to him as secretary of defence by subordinating the constitutional limits on the use of military force and the laws governing the conduct of hostilities to his own policy objectives,” Massie said, adding that Hegseth has shown a “profound disregard” for the impact of US military operations on civilians.\nThe Pentagon chief has faced criticism for the US-Israel war on Iran and his record of disparaging remarks about protections meant to minimise civilian casualties and ensure adherence to the law by US forces, which he has dismissed as “stupid” and “politically correct” rules of engagement that hinder the military.\nThe resolution for Hegseth’s impeachment could receive a vote in the coming days, but faces long odds of success in the Republican-majority US House of Representatives.\nThe Pentagon has said that it supports Hegseth.\n“The entire Department is unified behind the Secretary’s vision and will continue working to put our warfighters and America first,” Pentagon press secretary Kingsley Wilson told the news service Reuters in an emailed statement.\nWhile polls show that most Republicans support the otherwise unpopular war on Iran, a handful of figures on the political right, including Massie and media personality Tucker Carlson, have become increasingly critical of the Trump administration’s interventionist foreign policy.\nPresident Donald Trump, who pledged to wind down US involvement in conflicts around the world during his 2024 presidential campaign, has previously slammed Massie over his opposition to the war on Iran and efforts to force the government to release the Epstein Files.\nMassie lost his primary election in May to a Trump-backed challenger and a barrage of spending by pro-Israel groups.", "translation_ja": "", "vocab": [{"word": "subordinating", "definition": "～を従属させる、～を下位に置くこと。ここでは、憲法上の制限を個人の政策目標に従わせることを意味します。"}, {"word": "extrajudicial", "definition": "司法手続きを経ない、法的手続きなしに行われることを指す形容詞。政府による違法な殺害などを描写する際に使用されます。"}, {"word": "disparaging", "definition": "軽蔑的な、貶す内容の。ここでは民間人保護ルールに対する否定的で侮辱的な発言を指しています。"}, {"word": "interventionist", "definition": "他国の内政に積極的に介入する政策立場のこと。軍事的な国際干渉を支持する傾向を示す用語です。"}, {"word": "barrage", "definition": "集中砲火、猛烈な攻撃。ここでは親イスラエル団体による多額の選挙資金支出による集中的な政治的攻撃を意味します。"}]}, {"title_ja": "エド・シーランがマックレモア削除を「ツアープロモーター」のせいにと主張", "title_en": "Ed Sheeran Blames Tour Promoter for Dropping Macklemore Over Palestine Support", "summary_ja": "エド・シーランは、パレスチナ支持を表明したラッパーのマックレモアをツアーから外したのはプロモーターの決定であり、自分の決断ではないと主張しました。NFLのオーナー、ロバート・クラフトはマックレモアが反ユダヤ的な発言をしたとして、会場オーナーに圧力をかけたことを認め、複数のサポートアーティストがマックレモアへの連帯を表明してツアーから脱退しました。", "summary_en": "Ed Sheeran attributed the removal of rapper Macklemore from his US tour to venue operators and promoters, not his own decision, after Macklemore voiced support for Palestine. NFL owner Robert Kraft confirmed he pressured venues to ban Macklemore, citing concerns about antisemitic rhetoric, while several supporting artists subsequently quit the tour in solidarity with the rapper.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/15/ed-sheeran-blames-us-tour-promoter-for-dropping-macklemore?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Ed Sheeran blames US tour promoter for dropping Macklemore\nThe English musician said it was important to “set out some facts” after US rapper Macklemore voiced support for Palestine.\nPop star Ed Sheeran has blamed the promoter of his United States tour for dropping Macklemore after the rapper voiced support for Palestine.\nIn a series of six slides on an Instagram post, Sheeran on Tuesday said it was important to “set out some facts”.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Egypt’s el-Sisi meets MBS, backs Saudi call for secure Red Sea navigation\n- list 2 of 4US speaker rejects AI pause, warns of losing edge to China\n- list 3 of 4What makes these midterms so pivotal?\n- list 4 of 4US Senate crypto bill collapses in blow to industry\nThe decision to remove Macklemore from the US Loop Tour, Sheeran said, came after venues said they would pull future shows if they included Macklemore. The rapper, whose real name is Ben Haggerty, drew criticism after making “Free Palestine” and other pro-Palestine comments while on tour with Sheeran at MetLife Stadium in New Jersey earlier this month.\n“I was informed that this stance was based on how Macklemore conveyed part of this message during his performance, rather than on everything that was said,” Sheeran wrote. “I spoke with the venues at length all week to try and build a bridge.”\nSome musical artists, including supporting acts, said later on Tuesday that they were quitting Sheeran’s tour after Macklemore’s ouster. They included Irish singer-songwriter Aaron Rowe, Irish band Beoga, Danish band Lukas Graham and musician Finneas. They voiced support for Macklemore and expressed solidarity with Palestinians.\nRobert Kraft, the owner of the National Football League’s New England Patriots, confirmed he pressured Sheeran to drop Macklemore from the tour. The billionaire said Macklemore was barred from appearing at the team’s Gillette Stadium in Massachusetts during a performance later this month due to what he described as a “broader history of antisemitic rhetoric and imagery”.\nIn an Instagram post, Macklemore said Sheeran told him Kraft had organised a boycott among other stadium owners unless he was thrown off the tour for his pro-Palestine remarks.\n“I told him that if those words were more offensive than the tens of thousands of Palestinian children being killed by Israel, then there was a fundamental disconnect between where those people stood and where I stood,” Macklemore said of his conversation with Sheeran.\n‘I am not complicit’\nSheeran said the decision to boot Macklemore off the tour was the promoter’s, not his. The British musician added that he was “appalled by the conflict between Israel and Palestine”.\n“I am not complicit. I have my personal views on the devastating conflict. Just because I choose not to speak publicly, it doesn’t mean I don’t have them, and it doesn’t mean I don’t care. Nor does it mean I don’t support causes in my own, personal way,” Sheeran said.\nKraft, in a statement to Al Jazeera, said the decision to ban Macklemore from his venue wasn’t about “diminishing the suffering of innocent Palestinians” but argued “advocacy should not come at the expense of the Jewish community or obscure the responsibility of Hamas”.\nMacklemore, who described Sheeran as a close friend, said the two artists had discussed the issue over the past week.\n“He couldn’t get past his public-facing, ‘I don’t take sides,’” Macklemore wrote, referring to Sheeran’s reluctance to take a public stance on Israel’s war on Gaza.\nSheeran explained why he doesn’t use his “professional platform for politics”, writing that audiences who attend his shows “do not expect a political forum”.\n“I respect Macklemore’s strength of purpose to stand up and shout for what he believes,” Sheeran said. “However, there is room for multiple approaches to the same end: peace. I choose to use my fame and platform to be a place of safety and sanctuary, to maintain diplomacy and keep conversations open, not closed.”", "translation_ja": "", "vocab": [{"word": "complicit", "definition": "共謀している、つながっている。不正や悪い行為に加担していることを示します。シーランは自分が削除決定に「共謀していない」と述べています。"}, {"word": "advocacy", "definition": "支持者として活動すること、主張を公に推し進めること。特に社会的・政治的な大義を主張・推進する行為を指します。"}, {"word": "rhetoric", "definition": "修辞法、言葉遣い、説得的な表現。ここではクラフトがマックレモアの言論を指して用いており、発言内容の表現方法を意味しています。"}, {"word": "diplomatic", "definition": "外交的な、慎重で配慮のある。対立を避けて関係を良好に保つ姿勢や行動を表します。"}, {"word": "appalled", "definition": "非常にショックを受けた、呆れた。強い否定的な感情や不承認を表現する動詞です。"}, {"word": "profound", "definition": "深刻な、深い影響を与える。表面的ではなく、根本的で重大な性質を指します。"}]}, {"title_ja": "極右がなぜ暗号資産を受け入れているのか", "title_en": "Why is the far-right embracing crypto?", "summary_ja": "暗号資産は極右政治運動によってますます活用されており、右翼政党を支援する億万長者から活動家によるビットコイン資金調達まで広がっている。アルジャジーラは政治右派と暗号資産採用の増加する関連性を検証している。この傾向は、従来の金融システムと資金提供の制限を回避するための幅広い取り組みを反映している。", "summary_en": "Cryptocurrency is increasingly being used by far-right political movements, from billionaire donors supporting right-wing parties to activists raising funds in Bitcoin. Al Jazeera examines the growing connection between the political right and cryptocurrency adoption. The trend reflects broader efforts to circumvent traditional financial systems and funding restrictions.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/15/why-is-the-far-right-embracing-crypto?traffic_source=rss", "state_media": false, "category": "IT", "full_text": "Why is the far-right embracing crypto?\nNewsFeed\nWhy is the far-right embracing crypto?\nFrom billionaire donors backing parties to far-right activists raising funds in Bitcoin, cryptocurrency is increasingly being connected with the political right. Al Jazeera’s @avawarrinerr explains what is behind the growing relationship.\nPublished On 15 Sep 2026", "translation_ja": "", "vocab": [{"word": "far-right", "definition": "極端な右翼または保守的な政治思想を持つ人々や運動を指す。民族主義的、権威主義的、反体制的な立場を特徴としている。"}, {"word": "embracing", "definition": "何かを積極的に受け入れたり採用したりすることを意味する。通常、新しい考え方や技術などに対して前向きな態度を示す。"}, {"word": "cryptocurrency", "definition": "ブロックチェーン技術を用いた暗号化された仮想通貨。ビットコインやイーサリアムなどが代表的で、中央銀行を介さない取引が可能である。"}, {"word": "circumvent", "definition": "規制や制限を巧妙に回避することを意味する。通常、公式な手続きを避けて目的を達成しようとする行為を指す。"}, {"word": "billionaire donors", "definition": "億万長者の寄付者を指す。政治運動や団体に大規模な資金援助を行う富豪のことを意味する。"}]}, {"title_ja": "ロシア、米国の軌道兵器展開を非難　宇宙紛争リスクを警告", "title_en": "Russia Criticizes U.S. Deployment of Orbital Weapons, Warns of Space Conflict Risks", "summary_ja": "ロシア外務省は、米国が軌道兵器の展開を認めたことを非難し、宇宙紛争による壊滅的な結果を無視し、宇宙活動の長期的な安定を脅かしていると主張した。米空軍長官トロイ・メインク氏が軌道上宇宙制御兵器の保有を確認したことに対し、ロシアは米国の積極的な宇宙追求を批判し、西側の反衛星兵器モラトリアムの偽善性を非難している。", "summary_en": "Russia's Foreign Ministry condemned the U.S. acknowledgement of deploying orbital weapons, arguing it ignores catastrophic consequences of space-based conflict and threatens long-term stability. U.S. Air Force Secretary Troy Meink confirmed possession of on-orbit space control weapons, prompting Russian criticism of what it calls American aggressive space pursuits while accusing the West of hypocrisy on anti-satellite weapon moratoria.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-acknowledgement-of-orbital-arms-ignores-space-conflict-consequences-russia/article71470157.ece", "state_media": false, "category": "社会", "full_text": "Russia’s Foreign Ministry said on Tuesday (September 16, 2026) the U.S. acknowledgement that Washington had deployed orbital weapons ignored the possible consequences of a conflict and threatened long-term stability in space-based activity.\n“In pursuit of its narrow self-interests, Washington is ready to completely ignore the catastrophic consequences for humanity of any armed conflict in orbit,” Ministry spokesperson Maria Zakharova said in a commentary on the Ministry website.\nMs. Zakharova said the presence of U.S. weapons in space risks the prospects for space exploration.\n“Colossal risks are created for numerous socio-economic processes on Earth and people’s well-being directly depends on them,” she said.\nU.S. Air Force Secretary Troy Meink told a conference near Washington, D.C., on Monday (September 14, 2026) that the United States possessed “on-orbit space control weapons capable of defending the Joint Force against hostile adversary action.”\nThe statement was the strongest admission by a U.S. official of American weapons in space amid rising space tensions with Russia and China.\nMs. Zakharova described the acknowledgement as part of attempts to “distract world attention from the U.S.’ own aggressive strivings in terms of space,” including “absurd” accusations that Moscow was developing anti-satellite weapons.\n“The moratorium on testing ... anti-satellite missiles promoted by the so-called ‘collective West’ is laden with hypocrisy, as in reality it does not affect the use of weapons that the U.S. already has and does not apply to other types of anti-satellite systems that Washington is seeking to develop,” she said.\nMs. Zakharova said resolutions co-authored by Russia on barring deployment of space-based weapons and transparency in using space would be presented to the U.N. General Assembly next month.\nPublished - September 16, 2026 04:32 am IST", "translation_ja": "", "vocab": [{"word": "orbital", "definition": "軌道上の、または軌道に関連した。衛星や宇宙兵器が地球周辺の軌道を回ることに関する用語として使用される。"}, {"word": "moratorium", "definition": "一定期間、特定の活動を停止または延期する正式な協定または法律。ここでは反衛星兵器実験の一時的な禁止を指す。"}, {"word": "adversary", "definition": "敵対者または対立する相手。国家間の軍事的または政治的な敵を意味する正式な用語。"}, {"word": "deployment", "definition": "戦力や兵器を戦略的に配置または展開すること。軍事用語として特定の位置に兵器を配備することを意味する。"}, {"word": "transparency", "definition": "情報公開の透明性、あるいは行動や意思決定の過程が明確で隠蔽されていない状態。国際関係における信頼構築に重要とされる。"}, {"word": "laden", "definition": "～で満たされた、あるいは～で重くなった。ここでは偽善性で満ちた、という意味で使用されている。"}, {"word": "socio-economic", "definition": "社会的および経済的な側面に関連した。社会構造と経済活動の両方に影響を与える事象や政策を説明する際に使用される。"}]}, {"title_ja": "FBI長官パテル、上院公聴会で採用方針変更を擁護", "title_en": "FBI Chief Patel Defends Hiring Policy Changes at Contentious Senate Hearing", "summary_ja": "FBI長官カッシュ・パテルは、売春および獣姦の経歴を持つ応募者の採用を認める方針変更を擁護し、この変更は犯罪の被害者を自動失格から保護するためだと主張した。上院司法委員会の激しい公聴会では、パテルと民主党議員の間で、トランプ前大統領の捜査に関与した職員の解雇と選挙投票所への職員派遣を否定しなかったことについて、激しい論争が繰り広げられた。", "summary_en": "FBI Director Kash Patel defended policy changes allowing applicants with histories of prostitution and bestiality to be considered for employment, claiming the modifications protect victims from automatic disqualification. The contentious Senate Judiciary Committee hearing featured heated exchanges between Patel and Democrats over his firing of agents involved in Trump investigations and his refusal to rule out deploying agents to polling places on Election Day.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/fbi-chief-kash-patel-defends-hiring-policy-changes-on-prostitution-bestiality-at-fiery-hearing/article71470146.ece", "state_media": false, "category": "政治", "full_text": "FBI Director Kash Patel defended on Tuesday (September 16, 2026) a recent policy change to allow some applicants who have engaged in prostitution and bestiality to be considered for employment, insisting that the move was made to enable victims of those acts to apply for a job without fear of automatic disqualification.\nThe subject arose during a fiery Senate Judiciary Committee hearing in which Mr. Patel clashed with Democrats over his firing of agents who participated in investigations of President Donald Trump and suggested that agents might be dispatched to the polls on Election Day amid Justice Department and White House concerns about voter fraud.\nThe hours-long hearing featured the name-calling and bitingly personal exchanges that have come to define Mr. Patel's appearances on Capitol Hill, with Democrats characterising the Trump appointee as unqualified, criticising him for politically charged investigations into Mr. Trump's enemies and highlighting travel that has included a trip to the Winter Olympics in Italy in which he partied with U.S. hockey players and a snorkeling excursion at the Pearl Harbor memorial in Hawaii.\n“He's an incompetent lackey. He's like an 18-year old-kid who wants to join a fraternity that he could never be a member of, doing keg stands and chugging with friends. He's an embarrassment to the agency and wouldn't qualify even to be an FBI agent,” said an exasperated Sen. Cory Booker of New Jersey, his voice rising in anger.\nALSO WATCH FBI Director and US Senator have heated exchange at hearing over drinking allegations report\n“What a mockery you are,” he added.\nMr. Patel shot back, “You are the biggest mockery in the United States Senate, and you're sitting next to Schiff.” That was a reference to Sen. Adam Schiff, a California Democrat and outspoken Patel critic.\nPatel pressed on the FBI's hiring standards\nThe FBI quietly issued guidance this past spring lifting a categorical hiring restriction on applicants who had previously participated in prostitution. The bureau made a similar change with regard to childhood experience in bestiality.\nUnder questioning, Mr. Patel denied that the changes reflected a lowering of employment standards and insisted they were designed to prevent victims who'd been forced to engage in that conduct from being automatically disqualified.\n“We did not want to punish victims of bestiality, victims who were trafficked. We did not want to make it an automatic disqualification for the FBI to consider you if you were a victim of these awful, heinous acts,” Mr. Patel said. “We are not going to target victims and prevent them from serving in their capacity to serve this country.” The questioning spanned partisan lines, with Republican Sen. John Kennedy of Louisiana grilling Patel about the rationale for a change that the FBI director said was proposed to him by subordinates.\n“When you saw bestiality, I say this with respect: The person who recommended it, why didn't you just say what planet did you parachute in from?” Sen. Kennedy asked.\nMr. Patel conceded that was his initial response, but “they then explained to me and showed me cases in which people were forced into it and applied to the FBI and so I thought they should be considered. It's not an automatic disqualification.”\nThe Associated Press reported last month that the FBI still intends to bar some applicants who are revealed to have previously engaged in prostitution, including if they've done so within the last 10 years.\nPatel did not rule out sending agents to polling places on Election Day\nThe hearing took place two months before the midterm elections in November and at a time when the FBI has opened investigations related to the 2020 contest, including by seizing voter data in Fulton County, Georgia.\nMr. Trump regularly makes false claims that elections are rigged and riddled with fraud, especially in the months before an election. But there is no widespread fraud in American elections. Local election officials have detailed processes for auditing the accuracy of the vote after ballots are tallied.\nEven as he disputed his loss in 2020, audits, reviews and recounts in the battleground states where he challenged the outcome all affirmed Democrat Joe Biden's win.\nThose voter fraud claims, and the FBI's efforts to investigate the 2020 race, have spurred Democratic concerns that Patel could plunge the bureau into the upcoming election.\nAsked whether the FBI has the general authority to monitor elections, Mr. Patel replied that responsibility rests with the Department of Homeland Security. He said the FBI's presence on Election Day will be “housed” with election crimes coordinators at each of the bureau's 56 field offices, but under questioning, he declined to rule out that agents would be dispatched to the polls in the event of problems or reports of interference.\n“Do you pledge that you will not in any way interfere in the will of the American people when they go to the polls in November?” asked D", "translation_ja": "", "vocab": [{"word": "categorical", "definition": "絶対的で、条件なしの意味。ここでは「無条件の採用制限」という意味で使用されている。"}, {"word": "disqualification", "definition": "資格喪失または不適格とされること。採用試験や競技などから除外されるという意味で使用されている。"}, {"word": "partisan", "definition": "特定の政治党派を強く支持する立場。ここでは党派を超えた質問という意味で使用されている。"}, {"word": "concede", "definition": "相手の主張や事実を認める、または譲歩すること。通常、やむを得ず認める場合に使用される。"}, {"word": "riddled", "definition": "至るところに穴が開いている、または多くの問題や欠陥に満ちているという意味。ここでは「不正に満ちている」という意味。"}, {"word": "spurred", "definition": "刺激を与える、または促す意味の動詞。ここでは懸念を引き起こしたという意味で使用されている。"}, {"word": "plunge", "definition": "急速に陥る、または深く入り込むこと。ここでは組織を困難な状況に陥らせるという意味で使用されている。"}]}, {"title_ja": "ゼレンスキー大統領、過渡中のモルドバでロシアドローン攻撃が2度発生したと発表", "title_en": "Zelenskyy says Russian drones attacked Moldova twice during his transit", "summary_ja": "ウクライナのゼレンスキー大統領は、キシナウ空港での過渡中にロシアドローンがモルドバ領空を2度攻撃したと報告した。最初の事件は9月9日、ノルウェーへの出発時に発生し、2番目の事件はカナダからの帰国時の9月14日に発生した。モルドバ当局はドローン侵入を確認し、これらのセキュリティ脅威中に領空を閉鎖した。", "summary_en": "Ukrainian President Zelenskyy reported that Russian drones attacked Moldovan airspace on two separate occasions while he was in transit through Chisinau airport. The first incident occurred on September 9 when his aircraft was departing for Norway, and the second on September 14 upon his return from Canada. Moldovan authorities confirmed drone incursions and closed airspace during these security threats.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/ukraines-zelenskyy-says-russian-drones-attacked-moldova-twice-while-he-was-in-transit/article71469993.ece", "state_media": false, "category": "政治", "full_text": "Ukrainian President Volodymyr Zelenskiy said in an interview broadcast on Tuesday (September 15, 2026) that Russian drones attacked Moldovan airspace twice while he was in the country aboard his aircraft in transit.\nMr. Zelenskyy told the U.S. television network CBS that he was in Moldova on Ukraine’s western border, at Chisinau airport, on his way to and from a trip abroad when the incidents occurred.\n“In Moldova, my presidential jet was there and that’s why they attacked Moldova, the airspace of Moldova. Maybe they didn’t want to attack me personally...,” Mr. Zelenskyy said. “When we came back home, again through Chisinau, again they did the same.”\nOn September 9, a Moldovan government spokesperson said the departure of Mr. Zelenskyy’s aircraft for Norway was delayed as Moldovan authorities closed the country’s airspace over a drone alert.\nTwo Russian drones entered Moldovan airspace on that day. One landed in a field north of the capital, triggering a fire, while the second carried on into Romanian airspace.\nMr. Zelenskyy had not previously spoken of the second incident. It was not clear exactly when the President was again in transit in Moldova on his way back to Ukraine from Canada.\nMoldovan authorities said two drones entered the country’s airspace on Monday (September 14, 2026) for about 10 minutes each over the space of an hour before noon local time.\nPublished - September 16, 2026 03:30 am IST", "translation_ja": "", "vocab": [{"word": "transit", "definition": "移動中や経由中の状態を指す。特に国際旅行や航空機での移動時に使用される用語で、出発地から目的地への経過地点を通過すること。"}, {"word": "incursion", "definition": "領域や領空への無許可の侵入や侵略を意味する。軍事的な文脈で敵が境界を超えて入ってくることを表す。"}, {"word": "airspace", "definition": "国家が主権を行使する空域を指す。領土の上空で、その国が航空交通を管理する区域のこと。"}, {"word": "spokesperson", "definition": "公式に声明や情報を発表する権限を持つ人物。政府機関や組織を代表して報道機関に対応する役割を担う。"}, {"word": "previously", "definition": "以前に、既に過去において。時系列で先に起こったことを示す副詞。"}]}, {"title_ja": "キャスリーン・ウィン前オンタリオ州首相が自由党指導者レースの候補者を支持", "title_en": "Kathleen Wynne Endorses Candidate in Liberal Leadership Race", "summary_ja": "オンタリオ州の前首相キャスリーン・ウィンは、自由党の指導者選挙に出馬する候補者への支持を表明しました。この支持表明は、党が新しいリーダーシップを選出しようとする中で行われています。ウィンの支持は、彼女がオンタリオ州の自由党政治に継続的に関与していることを示しています。", "summary_en": "Former Ontario Premier Kathleen Wynne has announced her endorsement of a candidate competing in the Liberal Party leadership race. The endorsement comes as the party seeks to select a new leader to guide its direction moving forward. Wynne's support signals her continued involvement in provincial Liberal politics.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijwJBVV95cUxOcVZ2c1hxd2E1a25zZTd6Wkp0aWVFSk5PSHI1V0dDNThCeFpXUjRVTzRWdGJLX1FONWl5M1Qzb1YzOHRBTXdUcW4zVlJna05tZm9IWVd3ZmxOSzVSTHM4aFZJa2poVGN4SUNTSU1TemZJYzFleXZ1RDdGdVB5TUc2cmN2VzBmanNjQktJd0drWnJrYVluUDN0V2daMHlIXzRMckFxajBqbl9PWnZNdmZBSXMzcGdkVU1Yb1FoUFFuQmlKcmRfUXJjSTYxV1Qtc01JU3pFcC12RThONXhyS2twUzVGM1I1X3NVVGNrM24xWlg2VWJmUG9Dem9FUzBvUjFrN2k3Z19GZEFOeGdzMENz?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カーニー政府、カナダの空港への民間投資を許可へ", "title_en": "Carney Government to Allow Private Investments in Canadian Airports", "summary_ja": "カーニー政府はカナダの空港を民間投資に開放する計画を発表しました。この政策転換は空港インフラの近代化と全国的なサービスの向上を目指しています。この動きはカナダの空港の資金調達と運営方法における大きな方針転換を示しています。", "summary_en": "The Carney government has announced plans to open Canadian airports to private investment. This policy shift aims to modernize airport infrastructure and improve services across the country. The move represents a significant change in how Canadian airports will be funded and operated.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi7wFBVV95cUxPSmswclRuWDlibDQyOWF1c0J5MEhUeGgxWFdfQzhhN2lkTTNWdUZSbmNIbjlDaGN5MHhkcmU5eTBnRFhJdUwyZjViREhOY05YbHVNOHlBS2VMZnV6MWFwS1Nwazh6Wi1qNGVMZ1c5aVNwcnd1Q0NoRjVZZG94Z0dodUJCQ1dkc1M3bzVuV2stZktxN19wZW9DX2xBRnBBVFdnTmFTS3Q2N2FhcnlUTGp0SHpCcUpUVUJIbWpPN0hVTjIxd195NzdKSzNjdlVRUnBnUmJ0UTlXM2lWTGx2a3lkdzhFQjFhZmt5VmtZNEZKMA?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カーニー投資サミット開催に合わせ、カナダがビジネス環境の「最大の課題」である税制改革に着手", "title_en": "Canada Tackles Top Business Criticism With Tax Reform at Carney Summit", "summary_ja": "マーク・カーニー氏の投資サミットが開始される中、カナダはビジネスの最大の懸念事項を解決するため新しい税制改革を実施している。政府は税制改革を通じて国の競争力を向上させ、より多くの投資を呼び込むことを目指している。この取り組みは、カナダでのビジネスに対する最も頻繁に指摘される障害に対処している。", "summary_en": "Canada is addressing a major complaint from businesses by implementing new tax changes as Mark Carney's investment summit begins. The government aims to improve the country's competitiveness and attract more investment through these tax reforms. The initiative targets one of the most frequently cited obstacles to doing business in Canada.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBM BBV19Hc3BscHNUSzZiMU9CRjJFMWxyYnZv?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O Globo：歴史を誇りに、未来へ向かって", "title_en": "O Globo: Proud of Our History, Looking to the Future", "summary_ja": "ブラジルの著名な新聞であるO Globoは、その豊かな歴史を振り返りながら、将来の成長と関連性の向上に向けて自らを位置付けている。同紙は質の高いジャーナリズムへの取り組みと、進化するメディア環境への適応を強調している。", "summary_en": "O Globo, a prominent Brazilian newspaper, reflects on its storied past while positioning itself for future growth and relevance. The publication emphasizes its commitment to quality journalism and adaptation in an evolving media landscape.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "サントダイメの指導者、信者への性的暴力で起訴", "title_en": "Santo Daime Leader Accused of Sexual Misconduct Against Followers", "summary_ja": "リオデジャネイロのサントダイメ宗教団体の指導者パドリーニョ・パウロ・ロベルトが、詐欺行為を通じた元信者への性的暴力で起訴されている。疑惑は宗教コミュニティ内での不当な行為を含む。複数の元信者がこの著名な宗教指導者に対して訴えを起こしている。", "summary_en": "Padrinho Paulo Roberto, a leader of the Santo Daime religious group in Rio de Janeiro, faces accusations of sexual violations committed through fraud against former church followers. The allegations involve misconduct within the religious community. Multiple former followers have come forward with complaints against the prominent religious figure.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilAJBVV95cUxPRjJ4Skl2TDVtc2F0UXdMazZwSEJrNWMzTEJBOEVYS0dGSEJMV1l1eE9qVVg3akhZNFdNX2ZwZGVpdGtidFVaQmFES01FamdHS1c2Sk9nYkV2Q1YwZ1RjMV9UY0VBTWVBWHhTa3dmWndzVEVaQUNsWkVvb2FPVm9rLWJENExSdlJrY2g2dFN1UVpyQm00eHpxR3Y1Qy0zV2lrZXBzUlhzVmxtVkwtZXFyUnZnQzJRNkVLbU1qMDBlTTRGZVFkNGwzeFIxUGtCbzY2QU5lQ1BHZVJodDBMQjJGYm9OTmpleFVXbFdtU09HS3BfTTFoWVdEeE9jZDE1VXBoN1ZDd293azVGdlN2aHBGUlBwa1bSAaMCQVVfeXFMUGhIUHhkTFRmSnRVRmFGTjZCTy1DNzNFdW5XRGhNdmJmNUp5U3RRY05OcTJKUDNLa2J6Z1d2TThpMmlKUDNndFM0X0dPZGo4TFlPb0U4QWNsbmlYV3B1Q1oxbEZvN1RldXQ1dEctaXA2dVVSSGxJTkFYOWo4NjBkMzg2UWpxZTNCQTVSSUNqbDFBX2ZpbzhtdlFvMmNqb3V2cWEtWHd1N01heUhubjdzUVlyQTZKZm1sSWpWdW90ZnQ5Z0VXdXNOM2oyVUxOZGhYckpSbW93MWlDMTItaEdBTlZIYjd0dUZHWDhZNmhvaG13aDFvVDRLN05DNlN2SC1QYTlfNWZDM1dCNDg1aDhrbmJBMk11RFhOX2hDM09UN0J4UUtN?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ラゴスの道路渋滞で自動車運転者が3時間以上立ち往生", "title_en": "Heavy Traffic Strands Motorists on Lateef Jakande Road for Hours", "summary_ja": "火曜日の午後6時30分からラゴスのレイテフ・ジャカンデ道路で3時間以上の交通渋滞が発生し、原因は不明なままLASTMAからの説明がなかった。ラゴス・イバダン高速道路ではカラ橋での40フィートコンテナトラックの衝突による追加の交通渋滞が発生し、橋の拡張ジョイント修理工事が進行中だった。", "summary_en": "Motorists were stuck in gridlock on Lateef Jakande Road in Lagos for over three hours starting at 6:30 p.m. on Tuesday, with the cause remaining unclear as LASTMA provided no explanation. Additional congestion occurred on the Lagos-Ibadan Expressway due to a container truck crash at Kara Bridge, where repair work on expansion joints was underway.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-west/909922-gridlock-strands-motorists-on-lateef-jakande-road-isheri-berger.html", "state_media": false, "category": "社会", "full_text": "Motorists were still stuck in traffic on Tuesday night along the Lateef Jakande Road, Omole Phase 1, Isheri and Ojodu Berger axis, more than three hours after the gridlock began.\nThe traffic started around 6:30 p.m. and was still heavy as of 10:19 p.m., with vehicles moving slowly along several parts of the route.\nThis PREMIUM TIMES reporter who walked from Omole Phase 1 towards Berger saw long queues of vehicles on the road.\nAt Isheri, the traffic was particularly heavy, with many workers and business owners returning home caught in the gridlock.\nThe immediate cause of the traffic was not known at the time of filing this report.\nThe Lagos State Traffic Management Authority (LASTMA) had also not given an explanation for the congestion on its X account as of 10:19 p.m.\nNo LASTMA official was seen along some of the affected sections during the reporter’s walk from Omole Phase 1 to Berger.\nTraffic was also heavy around the Lagos-Ibadan Expressway, where a 40-foot container-laden truck crashed at the exit of Kara Bridge on Tuesday.\nLASTMA said the truck suffered brake failure and rammed into the road demarcation blocks and other vehicles.\nThe agency stated that its officials and police personnel were deployed to the scene to control traffic and evacuate the affected vehicles.\nThe crash happened while repair work was ongoing on Kara Bridge.\nThe federal government began a two-week repair of damaged expansion joints on the bridge on 8 September. The work is expected to end on 22 September.\nREAD ALSO: Lagos assembly approves N4.445trn 2026 budget reordering\nThe Acting Controller of the Federal Ministry of Works in Ogun State, Richard Adeleye, stated that the repairs were necessary because the expansion joints had exceeded their service life and posed risks to motorists.\nMr Adeleye noted that the work was being done in phases to reduce its effect on traffic.\n“There will be traffic control here from the 8th of this month, which will last for two weeks, precisely because of the curing that is expected before it is opened to traffic,” he said during an inspection of the affected section.\nThe repairs have led to traffic restrictions around Kara Bridge and adjoining sections of the Lagos-Ibadan Expressway.\nLASTMA also reported another crash on Tuesday involving a loaded trailer and a Sport Utility Vehicle on the bridge inward to Mowe.\nThe agency advised motorists using the route to drive carefully and obey the instructions of traffic officials.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "gridlock", "definition": "交通が完全に停止した状態のこと。車が互いに道をふさいで身動きが取れなくなる状況を指します。"}, {"word": "demarcation", "definition": "境界線や区切り線を引くこと、または区域を明確に分けることを意味します。道路の区切りブロックなどに使われます。"}, {"word": "expansion joints", "definition": "温度変化に対応するために材料の膨張と収縮を許容する継ぎ目のこと。橋などの構造物に使用されます。"}, {"word": "brake failure", "definition": "ブレーキシステムが機能しなくなる状態のこと。車両が停止できなくなる危険な状況です。"}, {"word": "congestion", "definition": "特に交通における混雑や混混状態のこと。車両が密集して移動が遅くなる状況を指します。"}]}, {"title_ja": "2027年選挙：権力配分と候補者交代の紛争がジガワ州のADCの見通しを脅かす", "title_en": "ADC's 2027 prospects in Jigawa threatened by power-sharing disputes and candidate substitution", "summary_ja": "ナイジェリアの野党アフリカ民主会議（ADC）がジガワ州で2027年選挙を前に内部混乱に直面している。知事候補サボ・ナクドゥが党幹部バシル・ジャンボとの権力配分合意を公式に否定し、偽造疑惑へと エスカレートしている。この紛争は党内の派閥対立を露呈させ、ADS州選挙と大統領候補アティク・アブバカルの選挙見通しの両方を危険にさらしている。", "summary_en": "Nigeria's opposition African Democratic Congress (ADC) in Jigawa State faces internal turmoil ahead of the 2027 elections, with governorship candidate Sabo Nakudu publicly disavowing a power-sharing agreement with party chieftain Bashir Jumbo. The dispute has exposed factional divides within the party and risks damaging both the ADC's state campaign and presidential candidate Atiku Abubakar's electoral prospects.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/909917-2027-power-sharing-candidate-substitution-disputes-threaten-adcs-chances-in-jigawa.html", "state_media": false, "category": "政治", "full_text": "As campaigns for the 2027 general elections get underway, the opposition African Democratic Congress (ADC) in Jigawa State is struggling to put its house in order.\nAllegations that the ADC leadership replaced primary election winners are at the heart of the crisis.\nAlso, the governorship candidate, Sabo Nakudu, and party chieftain Bashir Jumbo have had public spats over a power-sharing arrangement, further complicating an uphill battle against the ruling All Progressives Congress (APC) in the Northwestern state.\nIn August, Mr Nakudu issued a public disclaimer regarding a purported 60:40 power-sharing agreement. His action is more than a routine legal disavowal; it exposed a deep fracture in the opposition party ahead of the general election.\nMr Nakudu’s statement revealed an opposition platform bitterly split along factional fault lines.\nCrisis and failed internal reconciliation\nThe governorship primary had pitted Mr Jumbo—a four-term House of Representatives veteran and pillar of the ADC in Jigawa—against Mr Nakudu, a late defector from the ruling APC.\nMr Jumbo petitioned the party’s election appeal committee, alleging widespread irregularities, intimidation, and interference by party leadership in the primary. His camp views Mr Nakudu’s emergence as a hijack by wealthy latecomers, while Mr Nakudu’s camp accused Mr Jumbo’s of being bitter losers.\nA leaked document—indicating a 60:40 power-sharing agreement between the camps, the concession of the deputy governorship slot, and cabinet appointments—appeared to be an attempt to broker a truce between the two factions.\nBut Mr Nakudu’s aggressive repudiation of the document indicated that negotiations not only collapsed, but have degenerated into open warfare.\n“I, Senator Sabo Mohammed Nakudu, CON, Governorship Candidate of the African Democratic Congress (ADC), Jigawa State, for the 2027 General Elections, hereby categorically disclaim and repudiate the purported agreement currently in circulation and allegedly entered into between me and Hon. Bashir Adamu Jumbo, OFR.\n“I did not negotiate, execute, approve, authorise, consent to, adopt or ratify the said agreement, nor am I aware of or bound by its purported terms.\n“I specifically dissociate myself from the provisions relating to the alleged 60:40 power-sharing formula, Deputy Governorship arrangement, allocation of elective positions and Federal or State appointments. NI authorised no person or group to make such commitments on my behalf.\n“I therefore urge all persons, institutions, political actors and media organisations to refrain from treating, publishing or circulating the document as an agreement duly executed or authorised by me, and to correct any contrary representation.\n“In view of the seriousness of the matter, I shall pursue all appropriate legal and lawful remedies against any person found responsible for fabricating, altering, falsely attributing, unlawfully using or circulating the document or my purported signature”, Mr Nakudu stated in August.\nObservers stated that Mr Nakudu has crossed the point of no return because when intra-party disputes escalate from political horse-trading to accusations of forgery and criminal fabrication, formal party reconciliation mechanisms become ineffective.\nStrategic fallout ahead of the election\nThe ongoing crisis leaves the ADC structurally compromised on two major fronts: Mr Jumbo is strong in his Jigawa North-west (Kazaure zone) home district. If his loyalists feel excluded and manipulated by forged agreements, the party risks a mass exodus or silent sabotage at the polls.\nInstead of mounting a common campaign against the ruling APC, the ADC is burning critical momentum, resources, and public credibility on internal litigation and media warfare.\nAnalysts say that while Mr Nakudu’s disclaimer may protect his legal position and executive leverage, it confirmed that the Jigawa ADC is divided.\nUnless the party hierarchy manages an extraordinary intervention, this bitter battle may render the ADC ineffective well before the first ballot is cast in 2027.\nThe rift is also threatening to undermine the chances of the ADC presidential candidate, Atiku Abubakar, in the state.\nMr Jumbo’s faction accused Mr Nakudu of refusing to campaign for Atiku, noting that his campaign posters do not feature an image of the presidential candidate.\nSpeaking on Freedom Radio, Nasiru Laraba, a loyalist of Mr Jumbo, accused Mr Nakudu of working to weaken Atiku’s support base for the benefit of President Bola Tinubu.\nMr Laraba challenged Mr Nakudu to openly campaign for Atiku, who is widely believed to have backed Mr Jumbo in the party’s primary.\n“Why is the governorship candidate not campaigning for Atiku in this state, as is being done elsewhere?” Mr Laraba asked.\nHe added that individuals who joined the party only a few months ago were attempting to destabilise it.\nSubstitution of candidates\nMr Nakudu is reportedly furious over the party headquarters’ decision to substitute his runnin", "translation_ja": "", "vocab": [{"word": "disclaimer", "definition": "公式な否定または法的な責任回避声明。通常、過去の発言や行為への関与を否定する場合に使用される。"}, {"word": "intra-party", "definition": "政党内部の、または政党内で起こる。政党の異なるグループ間の対立や紛争を指すことが多い。"}, {"word": "factional", "definition": "グループ内の小派閥に関する、または派閥による。政治組織内での対立する小グループ間の分裂を表す。"}, {"word": "degenerate", "definition": "徐々に悪化する、低下する。良好な状態から悪い状態へ進む過程を示す。"}, {"word": "repudiate", "definition": "強く拒否する、否定する。法的または道徳的な責任や主張を完全に否認することを意味する。"}, {"word": "exodus", "definition": "大規模な離脱、集団での去脱。多数の人々が同時に組織や場所から去ることを指す。"}, {"word": "sabotage", "definition": "意図的な妨害破壊。特に政治的または組織的な目標を達成するために行われる秘密の破壊行為。"}]}, {"title_ja": "ラゴス州議会、2026年予算再編成で4.445兆ナイラを承認", "title_en": "Lagos Assembly Approves N4.445 Trillion 2026 Budget Reordering", "summary_ja": "ラゴス州議会は政府機関による実施率の違いに基づいて、2026年度の4.445兆ナイラ予算の再編成を承認した。6月30日現在の予算執行率は69%で、経常支出に2.077兆ナイラ、資本プロジェクトに2.368兆ナイラが配分される。この調整は、各省庁が初期配分をどの程度効果的に実行したかの検査後に行われた。", "summary_en": "The Lagos State House of Assembly approved a reordering of the state's N4.445 trillion 2026 budget, adjusting allocations based on differing implementation rates across government agencies. The review showed overall budget performance at 69 percent as of June 30, with N2.077 trillion allocated for recurrent expenditure and N2.368 trillion for capital projects covering infrastructure, healthcare, and security. The adjustment followed examination of how effectively ministries, departments and agencies had executed their initial allocations.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-west/909904-lagos-assembly-approves-n4-445trn-2026-budget-reordering.html", "state_media": false, "category": "経済", "full_text": "The Lagos State House of Assembly on Tuesday approved the 2026 Budget Reordering Bill, adjusting the allocation of the state’s N4.445 trillion budget.\nThe bill was passed after lawmakers considered and adopted the report of the House Committee on Economic Planning and Budget, TVC reported.\nPresenting the report, the committee chairman, Olumoh Sa’ad, said the review followed differences in the implementation of capital projects by ministries, departments and agencies (MDAs).\nHe stated that some MDAs had recorded higher implementation of their capital allocations, while others had spent less than what was provided for their projects.\nThe committee explained that the state’s overall budget performance stood at 69 per cent as of 30 June.\nIt put recurrent revenue performance at 79 per cent, while recurrent and capital expenditure stood at 73 per cent and 66 per cent respectively.\nUnder the reordered budget, N2.077 trillion will be spent on recurrent expenditure, while N2.368 trillion is allocated to capital projects.\nThe areas covered include transportation infrastructure, hospital projects, housing, environmental sanitation and waste management, security and emergency equipment.\nAfter the debate, the lawmakers adopted the committee’s recommendations and passed the bill following a vote by Speaker Mudashiru Obasa.\nMr Obasa directed the Clerk to communicate the resolutions of the House to the relevant authorities.\nThe assembly later adjourned plenary to 2 November.\nREAD ALSO: Container truck crashes into vehicles on Lagos-Ibadan Expressway\nBackground\nThe assembly approved Lagos’ 2026 budget in January at N4.444 trillion, after Governor Babajide Sanwo-Olu presented a N4.237 trillion proposal to the lawmakers in November 2025.\nThe governor described the proposal as the “Budget of Shared Prosperity” and said it was intended to improve infrastructure, support economic growth and improve residents’ welfare.\nThe budget approved in January provided N2.107 trillion for recurrent expenditure and N2.338 trillion for capital projects.\nGovernor Sanwo-Olu later signed the appropriation bill into law.\nThe latest review came after the Assembly examined the implementation of the budget by the state’s MDAs during the year.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "reordering", "definition": "予算や優先事項を再整理・再配分すること。政府予算の文脈では、初期配分を変更して各部門に新たに配分することを意味します。"}, {"word": "allocation", "definition": "特定の目的や部門に配分された資金や資源。予算管理において、予算額を様々な用途に振り分けることを指します。"}, {"word": "recurrent expenditure", "definition": "毎年度継続的に支出される経費で、給与や運営費などが含まれます。一度きりの支出ではなく反復的な支出を意味します。"}, {"word": "capital projects", "definition": "インフラストラクチャや建設など、長期的な資産を作成するための投資プロジェクト。通常、複数年にわたって実施されます。"}, {"word": "implementation", "definition": "計画や政策を実際に実行すること。予算の文脈では、予算配分を実際に使用して目標を達成するプロセスを指します。"}, {"word": "appropriation", "definition": "議会が特定の目的のために公的資金を正式に配分・認可すること。予算法案が成立して法的効力を持つことを意味します。"}]}, {"title_ja": "ウクライナ戦争の影響で、キルギスタンの経済がブーム状態に", "title_en": "Kyrgyzstan's Economy Booms as Key Conduit for Goods to Russia", "summary_ja": "中央アジアの国キルギスタンの経済は昨年11%成長しました。これはロシアへの物資流通の重要な中継地となっているためです。国際的なロシア制裁の中で、キルギスタンはロシア向けの商品や商取引の仲介役となることで経済成長を遂げています。この経済好況は、地政学的な混乱がいかに周辺地域に予期しない利益をもたらすかを示しています。", "summary_en": "Kyrgyzstan's economy grew 11 percent last year, driven partly by its role as a crucial trade corridor for goods flowing into Russia amid the Ukraine war. The Central Asian nation has capitalized on international sanctions against Russia by serving as an intermediary for goods and commerce. This economic surge highlights how geopolitical disruptions can create unexpected winners in neighboring regions.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/15/world/asia/kyrgyzstan-economy-russia-war.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イエメンの フーシ派、自製兵器の高度化を展示", "title_en": "Yemen's Houthis Display Growing Sophistication in Homemade Weaponry", "summary_ja": "イエメンのフーシ派は、人工知能などの技術を活用して高度な兵器を独自に製造する能力を高めている。兵器生産における自給能力の向上により、イラン支援への依存度が低下し、彼らの作戦能力に大きな転換をもたらしている。", "summary_en": "The Houthi movement in Yemen is increasingly manufacturing advanced weapons independently, utilizing artificial intelligence and other technologies. This growing self-sufficiency in weapons production reduces their reliance on Iranian support, marking a significant shift in their operational capabilities.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/15/world/middleeast/yemen-houthis-weapons.html", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ベネズエラの高官アレックス・サーブ、有罪を認め協力に合意", "title_en": "Venezuelan Official Alex Saab Pleads Guilty, Agrees to Cooperate", "summary_ja": "ニコラス・マドゥロ前大統領の側近であったベネズエラの元高官アレックス・サーブが、有罪を認め米国の調査当局への協力に合意した。サーブの協力により、マドゥロ政権の内部および違法行為に関する重要な情報がもたらされる可能性がある。この発展は、ベネズエラ政権に関連する腐敗と経済制裁違反の調査努力における重要な進展を示している。", "summary_en": "Alex Saab, a former Venezuelan official and close associate of Nicolás Maduro, has pleaded guilty and agreed to cooperate with U.S. investigators in Florida. Saab's cooperation could provide valuable insights into Maduro's inner circle and alleged illegal activities. The development marks a significant development in efforts to investigate corruption and sanctions violations linked to the Venezuelan regime.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/14/us/alex-saab-maduro-money-laundering-plea.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "人質解放交渉の進展受け、パレスチナ人がガザ北部への帰還開始", "title_en": "Palestinians Return to Northern Gaza After Military Zone Opens", "summary_ja": "イスラエルは人質解放交渉の行き詰まりが解消された後、ガザを二分する軍事地帯の通過をパレスチナ難民に許可した。この通過は家族の分離と飛び地内での移動制限の大きな転換を示している。数千人の住民が徒歩でガザ北部の故郷へ帰還している。", "summary_en": "Israel has allowed displaced Palestinians to cross a military zone that divides Gaza following a breakthrough in hostage release negotiations. The crossing marks a significant shift in restrictions that had separated families and prevented movement across the enclave. Thousands of residents are returning on foot to their homes in the north.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "Leading China Property Developer Reports Huge Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国の大手不動産開発企業であるVankeが多額の損失を報告し、中国の不動産危機の深刻化への懸念が高まっている。同社の経営難は、より広範な不動産部門の景気後退が今後も広がるかどうかという問題を浮き彫りにしている。市場の安定化に向けた政府介入の可能性について、懸念が増している。", "summary_en": "Vanke, a major Chinese property developer, has reported substantial losses, raising concerns about the deepening real estate crisis in China. The financial troubles at the company highlight whether the broader property sector downturn will continue to spread. Questions are mounting about potential government intervention to stabilize the struggling market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による砲弾片が体内に残存", "title_en": "Freed Israeli Hostages Recover From Injuries Sustained in October 7 Attack", "summary_ja": "最近解放されたイスラエル人人質は、10月7日の攻撃で受けた砲弾片の傷からまだ回復中である。イスラエルの医療当局者によると、一部の女性は長期間隔離され、捕虜中の8ヶ月間をトンネル内で過ごしていたという。", "summary_en": "Recently released Israeli hostages are still recovering from shrapnel wounds sustained during the October 7 attack. According to Israeli medical officials, some of the women were held in isolation for prolonged periods and spent eight months confined in tunnels during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI安全化は不可能ではないが、合意に至ることは難しいかもしれない", "title_en": "Making AI safer is not impossible, but agreeing to do so may be", "summary_ja": "本記事はAI安全対策についての合意達成の課題を探る。米国のAIラボと規制当局の間、および米国と中国の間に緊張が存在し、国際的な安全基準の確立を複雑にしている。", "summary_en": "The article explores the challenges in achieving consensus on AI safety measures. Tensions exist between American AI laboratories and regulatory authorities, as well as between the United States and China, complicating international efforts to establish common safety standards.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/15/making-ai-safer-is-not-impossible-but-agreeing-to-do-so-may-be", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国は米国後の世界に準備できていない", "title_en": "China is not ready for a post-American world", "summary_ja": "ドナルド・トランプ大統領のイラン政策の失敗は中国に機会をもたらしていますが、北京が世界的リーダーシップを担う準備が整う前に生じています。米国の戦略的誤算が短期的には中国に利益をもたらす可能性がある一方で、経済・軍事面の構造的限界が米国の国際的影響力の空白を埋める中国の能力を制限しています。", "summary_en": "Donald Trump's foreign policy crisis in Iran has created opportunities for China, but arrives before Beijing is prepared to assume global leadership. The timing of American strategic missteps may benefit China in the short term, yet structural economic and military limitations constrain China's ability to fill the void left by U.S. withdrawal from international affairs.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/15/china-is-not-ready-for-a-post-american-world", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "世界指導者たちが核戦争への恐怖を失いつつある", "title_en": "World leaders are losing their terror of nuclear war", "summary_ja": "プーチン、トランプ、習近平は地球上で最も強力な核兵器庫を支配しているにもかかわらず、核紛争の壊滅的なリスクを過小評価しているようである。エコノミスト誌は、世界大国が核兵器の脅威をより真摯かつ慎重に扱うべきだと主張している。地政学的緊張が高まる中、核抑止の心理的効果の低下は前例のない危険をもたらす。", "summary_en": "Putin, Trump, and Xi control the world's most powerful nuclear arsenals, yet appear to be underestimating the catastrophic risks of nuclear conflict. The Economist argues that major world powers should treat nuclear weapons threats with greater seriousness and caution. As geopolitical tensions rise, the erosion of nuclear deterrence psychology poses unprecedented dangers.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/08/world-leaders-are-losing-their-terror-of-nuclear-war", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヒンドゥー教代表団への対応で女性スタッフを排除、エッフェル塔の所長が危機に直面", "title_en": "Eiffel Tower Director Faces Crisis Over Female Staff Exclusion for Hindu Delegation", "summary_ja": "エッフェル塔の所長が、保守的なヒンドゥー教宗教団体の訪問時に女性スタッフを排除したことで大きな反発に直面し、ストライキと調査が発生しました。この事件は、象徴的な建造物を管理する企業内の深刻な問題、特に経営上の紛争、社会的緊張、および政治的監視の不足を露呈させました。", "summary_en": "The Eiffel Tower's director has faced significant backlash after female staff members were sidelined during a visit by members of an ultra-conservative Hindu religious group, triggering strikes and investigations. The incident has exposed deeper issues within the company managing the iconic monument, including management disputes, social tensions, and weak political oversight.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/economy/article/2026/09/15/eiffel-tower-director-faces-turmoil-after-sidelining-of-female-staff-at-request-of-hindu-delegation_6757556_19.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国際観光客が記録的増加、一方フランス人の海外旅行は減少", "title_en": "French tourists travel less as record international visitors flock to France", "summary_ja": "フランスへの国際観光客数と観光収入は今夏、記録的な高さに達した。一方、フランス国内の観光は大幅に減少し、7月から8月に旅行したフランス人は少なくなり、生活費の上昇と最近の熱波により、旅行期間を短縮し支出を削減している。", "summary_en": "International visitor numbers and revenues reached record highs in France this summer, but French domestic tourism declined significantly. Fewer French citizens traveled during July and August, with those who did taking shorter trips and reducing spending due to rising cost of living and recent heatwaves.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/09/15/french-tourists-travel-less-while-record-number-of-internationals-visit-france_6757560_7.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "亡命中のロシア経済学者：地方でガソリン不足と高騰が深刻化", "title_en": "Russian Economist in Exile: Fuel Shortages and Price Inflation Hit Remote Areas", "summary_ja": "モスクワ高等経済学院の元教授でベルリン在住のアンドレイ・ヤコブレフ氏は、ロシアの地方がガソリン不足に直面し、大都市より2～3倍高い価格で販売されていると指摘している。同経済学者は9月の選挙を前にインフレと供給網の混乱がロシア国民に影響を与えていると述べている。", "summary_en": "Andrei Yakovlev, a former Moscow Higher School of Economics professor now based in Berlin, discusses how Russian regions face severe gasoline shortages and prices 2-3 times higher than major cities. The economist highlights inflation and supply chain disruptions affecting the Russian population ahead of September elections.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/economy/article/2026/09/16/andrei-yakovlev-russian-economist-in-exile-in-many-areas-gasoline-is-either-unavailable-or-sold-at-prices-two-to-three-times-higher-than-in-major-cities_6757567_19.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の最新情報", "title_en": "Ministry of Defence Update", "summary_ja": "国防省が公式コミュニケーションを発表しました。読者はストレーツ・タイムズから更新情報を受け取るために購読できます。提供されたサブスクリプションリンクでニュースレターの設定を管理してください。", "summary_en": "The Ministry of Defence has released an official communication. Readers can subscribe to receive more updates from The Straits Times. Manage your newsletter preferences through the provided subscription link.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニングアップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニングアップデートは、毎日のニュースハイライトと情報を提供しています。読者は提供されたリンクから購読設定を管理できます。ストレーツ・タイムズの無料ニュースレターで最新情報をお届けします。", "summary_en": "The Straits Times Evening Update provides daily news highlights and information. Readers can manage their subscription preferences through the provided links. Stay informed with free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズが毎日のモーニングブリーフィングニュースレターで読者に最新情報を提供しています。購読者はニュースレター設定を管理し、同紙の追加無料コンテンツに登録することができます。", "summary_en": "The Straits Times delivers a daily morning briefing newsletter to keep readers informed on current events and news. Subscribers can manage their newsletter preferences and sign up for additional free content from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "10月7日の被害者家族、ネタニヤフ首相がハマス攻撃前の警告を意図的に無視したと主張", "title_en": "Netanyahu Allegedly Ignored Warnings Before Oct. 7 Hamas Attack: Families", "summary_ja": "10月7日の攻撃の被害者家族は、イスラエルのネタニヤフ首相がハマスの攻撃前の事前警告を意図的に無視したと非難している。重要な情報が見落とされ、攻撃の実行を可能にした可能性があると指摘されている。この疑惑は政府の事前対応と意思決定に対する精査を強化させている。", "summary_en": "Families of October 7 attack victims have accused Prime Minister Netanyahu of deliberately disregarding advance warnings before the Hamas attack on Israel. The allegations suggest that critical intelligence was overlooked, potentially allowing the assault to proceed. This accusation has intensified scrutiny on the government's pre-attack preparedness and decision-making.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikAJBVV95cUxOTXdwck41YWRMYmJNUTZ3YTdSdW1kWGtyTy1uN2hUNjlzd3pQZGN2V3RMZWNxNUFmRldlS0pkVktsRDJMVVpVY1E5cmd2MTRJVFlLV3dwNlpReUYtcU5hVExHWk9sTWdFY1VCWnFpd0hZMVpHTjkzdnE5TzRLMHYtLVR3bzJNeERCWWlrR2RTRmxMTUgtZzVMU0xrLVNFeWZWMmw1M2hhLVJvZmtMdk5RRDR4NUlRSnJ1Q2pWRzdBV1VIZEllQjEzQ2F1bVUxdmdNSW94MkxHVzk0MFhmdXhsWUVRS19VWG0zSENINGNZazJNUlFDWlNEeFBrN3VMQW9haHc4Q1hPTjU3bEwzSldwLQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロバート・クラフト対マックルモア：「パレスチナ解放」論争の新たな現実", "title_en": "Robert Kraft vs. Macklemore Reveals New Reality in 'Free Palestine' Debate", "summary_ja": "ニューイングランド・ペイトリオッツのオーナー、ロバート・クラフトとラッパーのマックルモアがパレスチナ支持の発言をめぐり公然と対立し、米国社会におけるイスラエル・パレスチナ問題に関する議論の変化する状況が浮き彫りになった。この衝突は、セレブや公人の間でパレスチナ支持がいかに主流化しているかを示している。この事件は、言論の自由、社会運動、紛争の両側への支持をめぐるより広範な緊張を反映している。", "summary_en": "A public clash between New England Patriots owner Robert Kraft and rapper Macklemore over pro-Palestine statements highlights the shifting landscape of discourse around Israeli-Palestinian issues in American society. The disagreement underscores how support for Palestinian causes has become increasingly mainstream among celebrities and public figures. The incident reflects broader tensions about free speech, activism, and support for different sides of the conflict.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimwJBVV95cUxPaTB0UHBKbmltNTgwbHFYTkFZQWtHTzFwTzZQUWNkeGo2RXVVY2N6aGVCQW9xQVdGQ01jRGxQUThMRDRRZS1RS0pBWkZVS3pxLXM4cnhuOVFVTUJ3RWhuMHpkZjgtNFNIYUYzZWpweXFyMVZ4Z3dSSHJ0bFNiQzQxdy1tazdWd1pmb2hyZ3dHY0FTdWR5N01mU1h2MDQ2MElET3JnNUp1QzB5UmlRelBFdmZ0RWFjalROYzJMZGhpSzlZal9xajAyLXJXREtJdXZnMndZV1Zka0ZhbVRTNjdDeUlrajhmcnhGNE5rWm1ueWFvSHVFdy0wbU0yQ2JpVXFPb0lwSnQ2al9TQnh2VFQ3Rk9hRXpDejJnVW93?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの法学者がガザ紛争での戦争犯罪調査を要求", "title_en": "Israeli Law Scholars Call for Investigation into Gaza War Crimes", "summary_ja": "イスラエルの法律専門家グループがガザ紛争中に行われた可能性のある戦争犯罪に関する独立調査の実施を要求しました。学者らは、軍事行動の説明責任と徹底的な検証が、正義とイスラエルの国際的地位の両方にとって不可欠であると主張しています。", "summary_en": "A group of Israeli legal experts has issued a call for an independent investigation into potential war crimes committed during the Gaza conflict. The scholars argue that accountability and thorough examination of military conduct are essential for both justice and Israel's international standing.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihgJBVV95cUxPNEMyN2RyVXQtaDlfRVpnYVQtWXdLaUdEMHhqNmJ3Nl9CYWZpNVg4RzFtcXVmS0hiNVpKeUFHT3B3YzNSaXptZ0k1RFBIS2R1eUswU2Zka2xYRjVNRWw0Q1VObmF1NzVUYk44Sm5mSmdjT1JnUlFtbTdmSkJYa3ZRT3pMSWszU3J5Rm1JUnVNNGs3Qk1SajJUMmRUa0Y1TXNpZ093T1Q1bDlvOWZLc25UN3pDMlhDYUxQOWJwS1dFYUJxcjUxZ3Q5SF9SQ3NxVERxRnFnT005bWt5S3FkVkJid3NVT3EzLWlYd3MxV3NnZUZFbjA1bUZmamtSdVQtaTFmem9HaUt3?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マイクロン台湾労組が一時的な報奨パッケージを拒否", "title_en": "Micron Taiwan Union Rejects One-Time Reward Package", "summary_ja": "マイクロン・テクノロジーの台湾事業所の労働組合は、同社が提示した一時的な報奨パッケージを拒否しました。この拒否は、経営陣と労働者の間での報酬と福利厚生をめぐる継続的な紛争を示唆しています。労組の決定は、半導体メーカーの台湾施設における広範な労働交渉を反映しています。", "summary_en": "The labor union at Micron's Taiwan operations has rejected a one-time reward package offered by the company. The rejection suggests ongoing disputes between management and workers over compensation and benefits. The union's decision reflects broader labor negotiations at the semiconductor manufacturer's Taiwan facility.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5VWjJIc3YyN0hhVnBtanBfMWdub2IwRGNJbV82VmI5dE1DSHRwV0YzbjhrSS1pYUhRamdCdzJTVXJUZEdJSGNvMlB3Z3daRmJ2RGRfS3ZLOA?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾のホスピタリティ業界に初の外国人技能労働者が到着", "title_en": "First Foreign Skilled Workers Arrive for Taiwan Hospitality Sector", "summary_ja": "台湾はホスピタリティ業界を支援するため、初の外国人技能労働者を受け入れました。このイニシアチブはホテル、レストラン、関連サービス部門の労働力不足に対応することを目的としています。このプログラムは、観光とホスピタリティ分野の増加する需要に対応しながら、国際的な人材を誘致する台湾の取り組みを示しています。", "summary_en": "Taiwan has welcomed its first batch of foreign skilled workers to support the hospitality industry. This initiative aims to address labor shortages in hotels, restaurants, and related service sectors. The program represents Taiwan's effort to attract international talent while meeting growing demand in the tourism and hospitality fields.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9VU1JXZ250VXVMSWVRQWtvRVZkVVVqNTR5ZU9LdDlXRXRQYU81SlBZVEJOdmZZM1Y1UVU2Umx5TnhwMHFtN1djVkF6dXhqdHlPdEpMTjNB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾でMQ-9B『スカイガーディアン』ドローンの飛行試験が実施", "title_en": "MQ-9B 'SkyGuardian' Drones Undergo Flight Testing in Taiwan", "summary_ja": "台湾はMQ-9B『スカイガーディアン』無人航空機の飛行試験を実施していると、情報筋が報じました。この試験は台湾の防衛能力における重要な発展を表しています。これらの高高度・長時間滞空型ドローンは、監視および偵察任務用に設計されています。", "summary_en": "Taiwan is conducting flight tests of the MQ-9B 'SkyGuardian' unmanned aerial vehicles, according to sources. The testing represents a significant development in Taiwan's defense capabilities. These high-altitude, long-endurance drones are designed for surveillance and reconnaissance missions.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE93c1gzbURKZjVTb29vR1dWbVlKOWlTUkppRDN6Vlo3NWk3dk55dTFNV3dlNGRjRmd2cl9YRUhEb2tvbHlydmtRcE8zaTZHdEliMjZGNXlxQQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "気候予報だけではアフリカの最貧困農民を保護できない", "title_en": "Climate forecasts alone won't protect Africa's poorest farmers", "summary_ja": "CGTNは、研究者が早期気候警報は、アフリカの脆弱な牧畜民が干ばつに備えるための財政的・実践的支援と組み合わせる必要があると強調していると報じている。同報告書は、適切なリソースと実施戦略のない予報が、最貧困農業コミュニティの保護において限定的な効果しかないことを示唆している。専門家は気候予測技術と並行して包括的な支援体制の必要性を強調している。", "summary_en": "CGTN reports that researchers emphasize early climate warnings must be accompanied by financial and practical support to help vulnerable pastoralists in Africa prepare for drought. The report suggests that forecasts without adequate resources and implementation strategies have limited effectiveness in protecting the poorest farming communities. Experts stress the need for comprehensive support systems alongside climate prediction technology.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-09-14/Climate-forecasts-alone-won-t-protect-Africa-s-poorest-farmers-1Qr1AFC5nzi/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スウェーデン選挙、予備結果で中道左派陣営が先行", "title_en": "Center-left bloc leads Swedish election, preliminary results show", "summary_ja": "CGTNが報じたところによると、スウェーデン選挙の予備結果では中道左派陣営が投票で先行しているという。国営メディアは、この初期段階の結果を最近の選挙戦から提示しており、開票作業が続く中で最終結果が期待されている。", "summary_en": "CGTN reports that preliminary results from the Swedish election show the center-left bloc leading in voting. The state-controlled outlet presents these initial findings as the country counts votes from the recent electoral contest. Final results are expected as the counting process continues.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-14/news-1Qqk2iyAsSY/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "習近平主席、中東・湾岸地域での戦争に警告", "title_en": "Xi Jinping warns against war in Middle East and Gulf region", "summary_ja": "CGTNが報じたところによると、中国の習近平主席は土曜日、中東・湾岸地域での継続的な紛争が地域全体に深刻な被害をもたらしていると述べた。習近平主席は状況の推移に伴い、この戦争が国際社会の共通利益に資していないと懸念を表明したと報道されている。", "summary_en": "CGTN reports that Chinese President Xi Jinping stated Saturday that the ongoing conflict in the Middle East and Gulf region has caused severe humanitarian losses. Xi Jinping reportedly expressed concern that the war does not serve the common interests of the international community as the situation continues to evolve.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-12/Xi-Jinping-warns-against-war-in-Middle-East-and-Gulf-region-1QnG2jac9TG/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン・ケシュム市で爆発音が報告される", "title_en": "Explosions reported in Iranian city of Qeshm", "summary_ja": "TASS/RTによると、イラン国営通信社(IRNA)の情報源によってイラン南部のケシュム市で爆発音が聞こえたと報告されている。この音は海からの発生だと伝えられている。", "summary_en": "TASS/RT reports that explosions were heard in the Iranian city of Qeshm according to sources cited by IRNA. The state-controlled news agency reports that the sounds originated from the sea.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2188117", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナがDPRの住宅地域への攻撃を実施、1人負傷", "title_en": "Ukraine carries out attacks on residential areas in DPR, one injured", "summary_ja": "TASSは、ウクライナが過去24時間でドネツク人民共和国の住宅地域に対して2回の攻撃を実施したと報じている。国営メディアによると、事件で民間人1人が負傷したという。報告書には、攻撃地域や被害の詳細についての情報は含まれていない。", "summary_en": "TASS reports that Ukraine conducted two attacks on residential areas in the Donetsk People's Republic over the past day. According to the state-controlled source, one civilian was reported injured in the incidents. The report did not provide additional details about the locations or extent of damage.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2188115", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2024年選挙後、トランプ大統領の資産が27億ドル増加", "title_en": "Trump's wealth increases by $2.7 billion following 2024 election", "summary_ja": "TASSが報じたところによると、フォーブスは米国大統領トランプ氏の純資産が2024年選挙後に27億ドル増加したと伝えている。情報源は暗号資産事業と海外ビジネス取引からの利益増加にこの増加を起因していると述べている。フォーブスはこれらの金融展開を資産蓄積の主要因として挙げている。", "summary_en": "TASS reports that according to Forbes, US President Trump's net worth grew by $2.7 billion following the 2024 election. The source attributes the increase to gains from cryptocurrency ventures and overseas business deals. Forbes cites these financial developments as key factors in the wealth accumulation.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2188113", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヨーロッパが見落とした戦略的資産：土壌の重要性", "title_en": "Europe Must Recognize Soil as a Strategic Asset", "summary_ja": "著者らは、急速に劣化しているヨーロッパの土壌が、半導体やバッテリーと同等の戦略的資産として扱われるべきだと主張しています。健全な土壌は食糧生産と気候レジリエンスを支える重要なインフラですが、EUは農民に対して測定可能な土壌改善への報酬を与える統合的な枠組みを欠いているとしています。同論説は、EUの気候レジリエンス枠組みが土壌サービスの生態系会計を義務化し、土壌保全を促進するための成果ベースの財政報酬を拡大することを求めています。", "summary_en": "The authors argue that Europe's soil, which is rapidly degrading, should be treated as a critical strategic asset comparable to semiconductors or batteries. They contend that healthy soil is vital infrastructure supporting food production and climate resilience, yet the EU lacks an integrated framework to reward farmers for measurable soil health improvements. The piece calls for the EU's climate resilience framework to mandate ecosystem accounting for soil services and extend outcome-based financial rewards to incentivize soil conservation.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/europe-must-recognize-value-pay-for-healthy-soil-by-adrien-geiger-et-al-2026-09", "state_media": false, "category": "オピニオン", "full_text": "The Strategic Asset Europe Has Overlooked\nAdrien Geiger , Brune Poirson, and Bertrand Badré\nEurope’s soil is gradually dying, and yet the continent has still not recognized it as a strategic asset. Fortunately, the EU has many of the tools it needs to act, but doing so will require an overarching framework that helps farmers access financial rewards for measurable soil outcomes.\nGENEVA/PARIS—When the European Union determines which assets are strategic, it tends to focus on those where a rival already dominates production (or could one day). That is why we hear so much about semiconductors, batteries, rare earths, and hydrogen. But we almost never hear about an EU asset that cannot be replicated elsewhere: Europe’s soil.\nOften regarded as part of the landscape, soil is, in fact, vital infrastructure. It is the foundation of our food systems, producing 95% of the food the world consumes. Moreover, European soils hold some 75 billion tons of carbon, several times that in the living biomass of its forests, and its porous structure serves as a buffer against droughts and floods—destructive events that have become increasingly common features of European summers.\nBut Europe’s soil is dying. According to the European Commission, an estimated 60–70% of EU soils are unhealthy, and their degradation costs the economy more than €50 billion ($58 billion) annually. Given that it can take up to a thousand years for a few centimeters of fertile topsoil to form, continuing down this path could have severe consequences.\nThe problem is that what is not counted cannot be protected—and policymakers rarely price the value of healthy soil. When a country’s soil ecosystem collapses, its GDP barely moves, although it is undoubtedly poorer. Europe, in particular, knows the risks of unaccounted-for dependencies: after gas supplies from Russia were cut following the Kremlin’s full-scale invasion of Ukraine, European governments had to allocate roughly €500 billion to shield their citizens and industries from soaring energy prices.\nThe degradation of soil is different because it is a gradual process for which we are wholly responsible. Because this is not a case of a foreign adversary deciding overnight to withhold a critical input, policymakers often fail to recognize that healthy soil builds robustness—the ability to continue functioning in the face of perturbations.\nEncouragingly, the EU has many of the tools it needs to act. The Soil Monitoring Law, in force since December, sets out a common framework for assessing carbon content, erosion, biological activity, and the capacity to retain and infiltrate water. A 2024 regulation requires member states to compile accounts for seven specific ecosystem services (although the services provided by soil, chief among them water retention, remain marginal). And in July, the European Commission adopted certification methodologies that will help farmers access financial rewards for measurable soil outcomes.\nSecure your copy of PS Quarterly: Slopocalypse Now\nAI-generated content already accounts for half the articles published online, and not even digital forensics experts can tell what’s real anymore. Can those still offering a humanistic vision of online life make themselves heard over the din?\nSUBSCRIBE & SAVE $50\nWhat the bloc lacks, however, is an overarching plan for connecting these measures and turning healthy soil into an advantage for those who maintain it. The Common Agricultural Policy pays for sustainable practices, but not for verifiable improvements in soil health and water retention. The Commission has an opportunity to change that with its framework for European climate resilience and risk management, expected later this year.\nAs business leaders, investors, and advisers across these value chains, we believe that the framework, which aims to make resilience a guiding principle for investment, should include three commitments. For starters, it should expand mandatory ecosystem accounting to the services provided by healthy soil, starting with water retention, and call for their inclusion in national economic accounts. It should also extend outcome-based rewards beyond carbon to soil health and water retention, so that farmers and land managers can gain from measurable results. Lastly, it should ensure that these indicators guide public support and investment decisions, just as carbon metrics do today.\nSome will argue that Europe cannot afford these commitments. Quite the contrary: dead soil leads to lower yields, higher food prices, and greater exposure to drought and flood, all of which are expensive. Worse, this form of fragility is a regressive hidden tax. To prevent the people with the least from being squeezed by higher food prices and subject to intensifying climate disasters, we must abandon the fiction that degrading soil has no real costs.\nEurope is not alone. In August, the 17th Conference of the Parties (COP17) to the United Nations Convention to Combat Desertificati", "translation_ja": "", "vocab": [{"word": "strategic asset", "definition": "戦略的に重要な資産や資源のこと。国家や地域の競争力や安全保障に直接的に影響を与える経営資源を指します。"}, {"word": "degradation", "definition": "品質や機能の低下、劣化のこと。この文脈では土壌の肥沃性が時間とともに失われていく過程を意味します。"}, {"word": "ecosystem services", "definition": "自然生態系が人間に提供する機能やサービスのこと。水の浄化、炭素貯蔵、洪水制御など、自然資本からもたらされる利益を指します。"}, {"word": "outcome-based rewards", "definition": "特定の成果や結果に基づいて与えられるインセンティブや報酬のこと。測定可能な改善結果に対して支払われる仕組みです。"}, {"word": "robustness", "definition": "困難な状況でも機能し続ける能力や堅牢性のこと。外的ショックや変化に対する耐性や抵抗力を指します。"}, {"word": "perturbations", "definition": "システムや平衡状態に対する外部からの乱れや撹乱のこと。予期しない変化や不安定化する要因を意味します。"}]}, {"title_ja": "インドがウクライナ平和を望む理由—中国がそうでない理由", "title_en": "Why India Wants Peace in Ukraine—and China Doesn't", "summary_ja": "インドと中国はともにウクライナ問題でロシアとの関係を維持していますが、根本的な動機が異なります。インドは戦争終結によってアジア地域における中国への対抗手段としてロシアを保持したいのに対し、中国は長引く紛争によってロシアの北京への依存を深めることが有利です。この相違は、ロシアとの関係よりも、各国のアジア地域における力学に関する戦略的利益を反映しています。", "summary_en": "India and China both maintain ties with Russia over Ukraine, but their underlying motivations differ fundamentally. India seeks an end to the war to preserve Russia as a counterbalance to Chinese influence in Asia, while China benefits from prolonged conflict that deepens Russia's dependence on Beijing. The divergence reflects each nation's strategic interests regarding regional power dynamics rather than their relationship with Russia itself.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/india-fears-russia-growing-dependence-on-china-owing-to-ukraine-war-by-nina-l-khrushcheva-2026-09", "state_media": false, "category": "オピニオン", "full_text": "Why India Wants Peace in Ukraine—and China Doesn’t\nThe Ukraine war has turned Russia into a junior partner of China. This serves China's economic and strategic interests, but it creates major risks for India, which has long counted on Russia to help it counterbalance Chinese influence in the region.\nNEW YORK—At first glance, India and China seem to be taking almost identical positions on the Ukraine war: maintain close ties with the Kremlin, buy Russian oil, and refuse to join the West’s campaign to isolate Russia. But scratch the surface, and a fundamental divergence appears: whereas India wants the war to end, China has no problem with letting the fighting continue. These positions have less to do with how China and India each feel about Russia, and more to do with how they feel about each other.", "translation_ja": "", "vocab": [{"word": "divergence", "definition": "異なる方向に向かう状態、または意見・立場などが分かれること。政治や戦略の文脈で、国家間の対立する利益や目標を示します。"}, {"word": "counterbalance", "definition": "別の力や影響力によって、ある力や影響力を釣り合わせ、中立的な状態に保つこと。地政学的な文脈で大国間の力の均衡を表します。"}, {"word": "strategic interests", "definition": "国家が長期的に追求する政治・経済・軍事上の重要な目標。国家の外交政策や同盟関係を決定する根本的な要因です。"}, {"word": "junior partner", "definition": "同盟や協力関係において、より小さな影響力や従属的な立場にある国家や組織。より強い力を持つパートナーに依存する状態を指します。"}, {"word": "isolate", "definition": "国家を国際社会から切り離し、外交的・経済的な制裁や圧力を加えること。対象国の影響力や行動を制限する戦略です。"}, {"word": "underlying", "definition": "表面には見えないが、根底にある、基本的な。表に現れた現象の背後にある根本的な原因や理由を指します。"}]}, {"title_ja": "AI と壊れたキャリア・ラダー", "title_en": "AI and the Broken Career Ladder", "summary_ja": "AI の全体的な雇用への影響はマクロデータでは不明確だが、タスクレベルと企業レベルでは既に混乱が生じており、特に初期キャリアの労働者に影響を与えている。著者は、職業喪失の明確な証拠を待つことは遅すぎると主張し、政策立案者は AI の経済的利益を公平に分配するため、スキル形成、仕事の再編成、利益配分に積極的に対処すべきだと述べている。", "summary_en": "While AI's overall employment impact remains unclear from aggregate data, disruption is already occurring at the task and firm level, particularly affecting early-career workers. The author argues that waiting for definitive evidence of job losses would be too late; policymakers must proactively address skill formation, work reorganization, and equitable distribution of AI's economic gains to ensure shared prosperity.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-policymakers-must-focus-rebuilding-bottom-rung-of-career-ladder-by-eric-hazan-2026-09", "state_media": false, "category": "オピニオン", "full_text": "AI and the Broken Career Ladder\nAI can broaden access to expertise, support innovation, and boost economic growth. But shared prosperity will depend less on the performance of the next frontier model than on our ability to preserve skill formation, reorganize work, and distribute the gains equitably.\nPARIS—The debate over artificial intelligence and employment has become preoccupied by a false choice. One side predicts large-scale job destruction; the other notes that aggregate data still show little. Both observations can be true. While AI’s economy-wide employment effects remain limited, the conditions for disruption are already emerging at the level of tasks, firms, and early careers. Given this, waiting for clear evidence that the shock has arrived would be a mistake. The data that eventually settle the argument may arrive only after the opportunity to shape the outcome has passed.", "translation_ja": "", "vocab": [{"word": "preoccupied", "definition": "～に夢中になっている、～に没頭している状態。ここでは議論が特定の観点に偏っていることを表す。"}, {"word": "aggregate", "definition": "集計した、全体的な。複数のデータや統計を合わせた結果や総計を指す。"}, {"word": "disruption", "definition": "混乱、阻害。既存のシステムやプロセスが大きく変わることを意味する。"}, {"word": "equitably", "definition": "公平に、公正に。利益や負担が公正に分配されることを示す副詞。"}, {"word": "frontier", "definition": "最先端の、最新の。特に技術やビジネスにおける最新の発展段階を指す。"}, {"word": "proactive", "definition": "先制的な、積極的な。問題が起きてから対応するのではなく、事前に対処することを意味する。"}]}, {"title_ja": "AIによる人類滅亡の危機を警告する技術リーダーたち、政治家らは後手に回る", "title_en": "Tech Leaders Warn of AI Extinction Risk While Politicians Play Catchup", "summary_ja": "ジョン・クレイスは、技術業界の指導者たちが10年以内にAIが人類を絶滅させる可能性について正当に警告している一方で、トランプのような政治家はこれらの懸念をデマとして一蹴し、政府はリスクを軽視していると主張する。クレイスは辛辣な皮肉を用いて、情報を得た技術専門家と無関心な政治指導者の溝を批判し、人類はAIが滅亡させるよりも早く自滅に向かっているかもしれないと示唆している。", "summary_en": "John Crace argues that while tech industry leaders legitimately warn of potential AI-driven human extinction within a decade, politicians like Trump dismiss these concerns as hoaxes and governments downplay the risks. Crace uses biting satire to criticize the gap between informed tech experts and dismissive political leaders, suggesting humanity may be driving itself toward c
