nd gas financing - Reuters", "summary_ja": "Bessent calls for World Bank reforms, including upstream oil and gas financing Reuters", "summary_en": "Bessent calls for World Bank reforms, including upstream oil and gas financing Reuters", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMiuAFBVV95cUxOdmVBc2lZeXZJNlZpZ3VMVkdXTENJanEzampXOWtLcmRpVkFoOFFKTktkTWI2akVZTG9wV1UyY1ZreW02TzBDTG5LWUxiOUl4bnl0TW5JRG52X21aT3A1TkdyRV9ObEVBZWl3TmxKODB5aUVQLXFCa0NBY1VCQ2pZUEtDZUpiaDYxUjhoanZPQ0FCam8xcmJuVS13b3lQLXBPb2dSb044ZTlvYnF6X293STlMOXJBa21k?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Inside Ukrainian offensive pushing Russia back - with Starlink playing a key role", "title_en": "Inside Ukrainian offensive pushing Russia back - with Starlink playing a key role", "summary_ja": "The BBC joins Ukraine's Operation Vivaldi as it regains crucial territory in the Donbas, but optimism has been dampened by souring relations with President Trump.", "summary_en": "The BBC joins Ukraine's Operation Vivaldi as it regains crucial territory in the Donbas, but optimism has been dampened by souring relations with President Trump.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cvx284w16z1po?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Inside Ukrainian offensive pushing Russia back - with Starlink playing a key role\n- Published\nA Russian drone zips across the computer screen, startling the commanders keeping watch over the battlefield via a live stream in their bunker.\nCigarette in one hand, radio in the other, one of them calls in their own drone to bring it down and warns the soldiers below of the threat. The men are dangerously exposed, on the long walk across open ground from their front line positions. They are being replaced after three months forcing the Russians back.\nThis is part of Operation Vivaldi, a Ukrainian counter-offensive which they say has liberated 277 sq km (106 square miles) in the eastern Donbas region in recent months.\nThe name reflects the offensive's four stages, or seasons - like the Italian composer's violin concerto. The successful assault blunted an attempted Russian pincer movement that threatened to encircle the key Fortress Belt cities still under Ukrainian control.\nWhile Russia this month pummels Ukraine from the air, crippling its energy infrastructure and killing scores of civilians across the country, at the front, it is Ukraine that has made recent gains. Kyiv says it has inflicted heavy losses - 8,000 Russian casualties in Vivaldi alone, and close to 50,000 along the front in the month of September – and suffered few casualties in return.\nThe Institute for the Study of War reported that pro-Russian military bloggers had acknowledged the Ukrainian advances, and expressed fears this could lead to more losses for Russia in the future. No Russian official has publicly acknowledged the Ukrainian gains. Russian ministry of defence briefings say only that they were \"repelling attacks\" in the Lyman region, or \"improving the tactical position at the front\".\nDespite Ukraine's forward moves, Russian drones are still ever-present. Phoenix, Commandant of the Revenge Brigade's Silver Trinity unit, tells me his men face 10 on an average day.\nHe is fixed on the live stream as a Ukrainian snare swoops in, hovers for a few seconds and drops a net on to the drone, dragging it from the sky. This Russian drone was for reconnaissance, but if it had locked on to the soldiers, another drone carrying explosives would have followed.\nThis moment of peril illustrates the layers making up the modern battlefield. The command bunker receives live pictures from a hovering camera, while below a Ukrainian attack drone attacks another enemy spotter which would have called in more flying firepower.\nIntegrated in all of this is Starshield, the military version of Elon Musk's Starlink satellite communications network, providing broadband connectivity across the battlefield.\nUkraine said this week, as Operation Vivaldi concluded, that the system had restrictions imposed without warning, limiting their capability.\nMusk and media reports suggest the order may have come from the White House. While Ukraine is not wholly reliant on Starshield, it is a key tool in their arsenal, vital for interceptor and mid-range strike drones. And knowing this tool can be restricted without any warning or consultation has sparked major concern in Ukraine.\nBeneath the battle for aerial superiority, unmanned ground vehicles scurry back and forth delivering supplies, evacuating the wounded or, increasingly, leading the charge against the enemy.\nEverything here relies on digital connectivity - to see, to move, to fly, to communicate, to fire. But at the bottom of this stack, it is still human beings in trenches who are holding the ground.\nThe weary soldiers have made it safely to the command post. After 95 days pushing forward on the front line there is an emotional reunion.\nAn infantryman with the call-sign Dealer tells me he feels strong, but it is good to be finally heading home: \"It's an impressive operation. Over three months, we moved positions four times.\"\nHe tells me the most frightening threat was Russian drones, piloted remotely and determined to hunt down their target.\nCommandant Phoenix said the preparation for the offensive was \"enormous\".\n\"The men trained for months. We had to completely restructure our approach because previously we had been defending, and now we had to go on the offensive.\"\nRobots and drones led the assault on Russian positions and, for the first time, remote-controlled explosive vehicles were dropped behind Russian lines - 250 Russians surrendered. According to Ukrainian commanders, their year-long campaign has freed 16 settlements from Russian occupation.\nIn Karpivka, a village occupied since April, the Ukrainians found one local resident remaining - 61 year old Volodymyr Zamota, the last man standing when his neighbours fled the Russian advance in 2025. He says he survived for eight months in total isolation.\n\"As they say, hope dies last,\" he told me. \"I'm the only person left in the whole village, and the village has been almost completely destroyed.\"\n\"I thought I would live to old age without experiencing anything like this, ", "translation_ja": "", "vocab": [{"word": "counter-offensive", "definition": "敵の攻撃に対抗するための反撃作戦。防御から攻撃に転じる軍事作戦を指す。"}, {"word": "blunted", "definition": "先端を丸くする、または比喩的に勢いや効果を弱める。ここでは敵の作戦の威力を減少させたことを表す。"}, {"word": "encircle", "definition": "周囲を囲む、包囲する。敵軍を四方から取り囲んで逃げ場をなくす戦術。"}, {"word": "pummels", "definition": "繰り返し殴る、たたく。ここでは激しく爆撃や攻撃を加え続けることを意味する。"}, {"word": "reconnaissance", "definition": "敵の位置や状況を把握するための偵察活動。軍事作戦において情報収集目的で行われる。"}]}, {"title_ja": "Palestinians and US journalist injured by Israeli settlers in West Bank harvest attack", "title_en": "Palestinians and US journalist injured by Israeli settlers in West Bank harvest attack", "summary_ja": "The BBC sees masked settlers attack Palestinians trying to harvest olives, amid a surge in similar incidents.", "summary_en": "The BBC sees masked settlers attack Palestinians trying to harvest olives, amid a surge in similar incidents.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c65ynk7212vqo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Palestinians and US journalist injured by Israeli settlers in West Bank harvest attack\n- Published\nDozens of masked settlers have attacked Palestinians and set fire to cars and olive trees during the annual olive harvest in the occupied West Bank.\nA BBC team witnessed one of several attacks in farmland near the Palestinian village of Abu Falah. A local official said the attacks had injured 12 Palestinians, including four dual Palestinian American citizens. A foreign journalist was also among those hurt.\nDriving into the area early in the morning, we came across the first signs of the violence: a stream of cars carrying wounded Palestinian olive farmers racing out along the narrow stony track, piled high with olive picking equipment, as smoke rose from several fires nearby.\nThe bloodied face of Majdi Fheed peered out from the backseat of one car.\n\"We were getting our olive trees and almost 15 Jewish guys … started attacking us with guns, with rocks, with special weapons. They hit me on my head [and] my neck – look, I am bleeding!\"\nYaser AlKam, a council member from the neighbouring village of Turmus Aya told me Majdi - an American citizen - was attacked by settlers with nail-studded sticks, and needed treatment for deep wounds on his head. His elderly mother was also injured.\nAnother man ferrying the injured to hospital told us that settlers had attacked them with sticks while they harvested their olives, and had burned three cars – including one of his own.\n\"As soon as we got to the land and put our things on the ground, they started to come, so we ran away\" said a woman next to him.\nAsked about the violence, a US State Department spokesperson said they were aware of the reports.\n\"We condemn criminal violence by any party in the West Bank and call for investigations, arrests, and convictions, of those responsible,\" the spokesperson said.\nWatching the vehicles stream past her, 73-year-old Imm Khaldoun told me emphatically that, no matter what happened, she would always return to her land. \"This is my land. It's my right [to be here]\" she told me.\nThe UN says the past two weeks have already seen more attacks by violent Israeli settlers than during the entire harvest season last year.\nOlive picking in the West Bank is now a test of speed, with trees rapidly stripped of fruit as soon as the sun rises, before violent Israeli settlers attack.\nIn another olive orchard nearby, we watched as dozens of farmers used power-tools to strip the trees as fast as they could – one eye on the ridge above us, where a group of settlers at a new illegal outpost had already gathered, and were watching the olive harvest below.\nStanding on ladders, the Palestinian farmers worked quickly, sending streams of olives onto the plastic sheets laid out under the trees. Three villages had come together to harvest these olives, the landowner Amin Khalil, told me, as a form of protection against attack. He said his land was now surrounded by seven Jewish settlements and outposts.\nAll Israeli settlements are illegal under international law. Outposts – small encampments on hilltops – are illegal under Israeli law as well, but many still receive state support.\n\"This is a hotspot – there are seven settlements around here,\" Amin Khalil told me. \"This year, all the people came together because when there are just a few people working alone at the edge of the village, the settlers attack. So all the families are working together today.\"\nBut the tactic doesn't work today. As we watch, dozens of settlers, all dressed in black, begin moving down the hill towards us, setting fire to several groups of olive trees.\nThere are shouts of panic from the Palestinian farmers, yelling for children to get out of the field. Some begin swiftly wrapping up the olives to leave.\nBut with large numbers of people on both sides, the confrontation stalls into an uneasy stalemate. We see settlers with slingshots hurl stones towards us, and young Palestinian men running to throw stones in return.\nAs Israeli forces arrive, the standoff explodes into action. Settlers begin running down towards us as the farmers swiftly retreat. Some Palestinians set off fireworks to try and push the settlers back.\nAmerican journalist Heidi Levine of the Washington Post was injured in the attack. She described how dozens of settlers ambushed her as she was reporting at the scene.\n\"I got jumped,\" she said. \"I was on the ground and they were kicking me and I was trying to hold onto my camera and my bag. I had my helmet and flak jacket on which protected me. They made me stand up and they kicked me again, and this went on for at least 10 minutes.\"\nIn a statement, Washington Post executive editor Matt Murray said Levine had been clearly identifiable as a journalist.\n\"We are outraged by this unwarranted attack on a journalist doing her job and urge a thorough investigation and follow-through from authorities,\" he said.\nDespite the video evidence and testimony, the Israeli prime minister's office s", "translation_ja": "", "vocab": [{"word": "condemn", "definition": "強く非難する、批判する。政治的・道徳的に受け入れられない行為に対して公式に反対を表明することを意味します。"}, {"word": "perpetrators", "definition": "犯罪や不正行為の実行者、加害者。「those responsible」と同義で使われ、責任を負うべき者を指します。"}, {"word": "inaugural", "definition": "初めての、開始を記念する。ここでは年間の恒例イベントの意味で使われていますが、通常は新しく始まる重要な出来事を表します。"}, {"word": "dual citizen", "definition": "二重国籍保持者。複数の国の国籍を同時に持つ人物を指します。"}]}, {"title_ja": "Trump denies limiting Ukraine access to Starlink network", "title_en": "Trump denies limiting Ukraine access to Starlink network", "summary_ja": "Speed curbs limited Ukraine's defences against deadly Russian attacks on Tuesday night.", "summary_en": "Speed curbs limited Ukraine's defences against deadly Russian attacks on Tuesday night.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckz65g34wyd8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Trump denies limiting Ukraine access to Starlink network\n- Published\nUS President Donald Trump has denied limiting Ukraine's access to Starlink's sister internet network Starshield after it restricted drone speed, hampering Kyiv's ability to protect itself from Russian attacks.\n\"It wasn't me and I don't think it was [Starlink owner] Elon [Musk],\" Trump said, hours after Ukrainian President Volodymyr Zelensky said speed had yet to be restored.\nMusk himself suggested the US government might have been behind the restrictions, while Reuters news agency reported on Thursday that the order had come from inside the White House.\nUkraine was hit by several deadly strikes on Tuesday after the network slowdown.\nStarlink is a civilian-use high-speed internet network operated by Musk's SpaceX. Starshield - which relies on Starlink- is its military-grade sister service that was designed for the Pentagon.\nThe US had previously warned it could withhold sharing intelligence, crucial for Kyiv's defences, if Ukraine did not stop hitting Russian oil refineries.\nTension has been brewing between Washington and Kyiv for days over a recent controversial diesel deal between Russia and the US.\nZelensky - angered by the deal - resumed targeting Russian oil refineries this week in a move criticised by Trump three days after he announced a ceasefire on energy infrastructure. Kyiv said it would stop the strikes if Russia did the same but Moscow never confirmed the ceasefire and continued its attacks.\n\"If I don't stand up to this... who else will?\" Zelensky asked EU leaders at a summit on Friday.\nTrump had also said that Zelensky was \"more difficult to deal with than [Russian President Vladimir] Putin\".\nBut speaking to reporters as he left the White House on Friday, the US president said he had a good relationship with his Ukrainian counterpart.\nAsked about Starshield, he said he was \"not sure\" it \"ever came down\".\nMusk earlier explained that Starshield was managed by the US government, and that the Pentagon could have been responsible.\nIn its report about the alleged order regarding Starshield, Reuters quoted two US officials and a Western official briefed on the matter.\nThe US government has allowed Ukraine to use Starlink and Starshield in its defence against Russia. Musk cut Moscow's access to the service in February, giving Kyiv an advantage in the conflict.\nOn Tuesday night, Starlink restricted speed limits to 100mph (160km/h), meaning any weapons that travelled faster than that lost connectivity to the network.\nSome 600,000 in Ukraine were left without power as communications and energy facilities used by Ukraine's military were also hit in the deadly attacks.\nA bipartisan group of US senators has signed a letter demanding an investigation into the disruptions to the network.\n\"Restrictions reportedly degraded Ukraine's ability to conduct defensive operations against Russian drone and missile attacks on civilian infrastructure,\" the letter read.\nOn Friday, French President Emmanuel Macron vowed that EU states would not abandon Ukraine.\nSpeaking at the end of the two-day summit in Brussels attended by Zelensky, Macron said it was Europe's job to hold the line in the face of some people's \"ambiguities\". That was apparently a reference to signs of wavering US support for Ukraine.\nFunding for Ukraine and helping it get through another freezing winter - its fifth since Russia's full-scale invasion in 2022 - topped the summit's agenda.\nThe war will cost €155bn (£131bn; $174bn) next year, Zelensky told the European Council, with at least €70bn needed to come from the EU for defence and weapons.\nMacron said Europe was working to help Ukraine with its satellite and early warning systems, and Ukraine's friends would look at its request for further aid.\n  - Published8 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "hamper", "definition": "妨害する、邪魔をする。何かの進行や能力を制限・阻止する状態を表す。"}, {"word": "withhold", "definition": "保留する、与えない。情報やリソースなどを意図的に提供しないこと。"}, {"word": "brewing", "definition": "醸造する、増大する。問題や紛争が徐々に発展・悪化している状態を表す。"}, {"word": "alleged", "definition": "疑われている、申し立てられた。事実であると確認されていない主張や報告に対して使う。"}, {"word": "counterpart", "definition": "相手方、対応する人。同等の立場にある別の人物や機関を指す。"}]}, {"title_ja": "Dad fined after son, 2, died in Cyprus hotel fall", "title_en": "Dad fined after son, 2, died in Cyprus hotel fall", "summary_ja": "Joshua Foster \"lost control\" of his son while showing him the view of a water park from a window.", "summary_en": "Joshua Foster \"lost control\" of his son while showing him the view of a water park from a window.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cvj6j1klez88o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Dad fined after son, 2, died in Cyprus hotel fall\n- Published\nA father whose two-year-old boy fell from a fourth floor window of a Cyprus hotel has been fined €3,000 (£2,500) for causing his death.\nJoshua Foster thought the window was closed when he placed his son on a sill to show him the view of a waterpark and \"lost control\" of him, Paphos District Court previously heard.\nThe toddler fell nearly 40ft (12.1m) at the five-star King Evelthon Beach Hotel and Resort on 12 July, the first day of the family's holiday in Chlorakas.\nFoster, 37, from Essex, admitted causing death through a reckless, rash or dangerous act and was sentenced earlier.\nHe told reporters afterwards: \"Thank you for the support. I'm looking forward to going home and being with my wife and daughter.\"\nLater, the family said in a statement: \"We are relieved that this process is now over, but for our family, the consequences of this tragedy will never end.\n\"Our son was deeply loved and will be forever missed. His loss is something we carry with us every day.\"\nFoster, an auditor, arrived in Cyprus hours before the incident with his wife, two children and in-laws.\nThey enjoyed various activities and swimming, before getting ready for dinner in the evening.\nAt about 18:00, Foster, his father-in-law and son were walking towards a lift when the boy noticed a waterpark outside.\nFoster pushed the lift button, placed the child on the windowsill and the \"inconceivable\" unfolded before he could react, the court heard.\nThe boy was taken to Paphos General Hospital and later pronounced dead.\n\"The window did not appear to carry markings that would necessarily have alerted the defendant to the fact that one section was open,\" said District Judge Froso Christodoulidou.\nHis failure to establish that the window was not closed led to the tragic result, the judge added.\n\"It was a momentary error which created a dangerous situation with fatal consequences,\" he said.\nThe judge added there was \"no evidence that the defendant deliberately exposed the child to danger\", according to a translation of proceedings.\nShe added no sentence could outweigh the \"personal consequences of the loss of his child\".\nIn a voluntary statement to police, Foster said when he placed his son on the windowsill, the boy \"fell before he had a chance to grab him\".\nWhile Foster had alcohol in his system, it did not form a significant part of the case against him and his lawyer Alexandros Alexandrou said there was no testimony he was drunk.\nAfter the sentencing, Foster's lawyer, Alexandros Alexandrou, told reporters the case should have \"never gone to court\".\nHe said Foster was held in custody for eight days immediately after the incident and he had to call his daughter from custody to explain what had happened.\n\"Within this three months, there was a lost opportunity for this man to grieve as he wanted to, to be with his family,\" he said.\nHe described his client as an \"incredible father\".\n\"[He is] an exemplary family man with a beautiful family behind him, that support him, that embraces him, that has always been by his side.\"\nDo you have a story suggestion for Essex? Contact us below.\nGet in touch\nYour Voice\nFollow Essex news on BBC Sounds, Facebook, external, Instagram, external and X, external.\n  - Published6 October\n  - Published22 September", "translation_ja": "", "vocab": [{"word": "reckless", "definition": "危険性を無視した、無謀な。法律用語として「過失致死」など重大な結果をもたらす行為を説明する際に頻出します。"}, {"word": "inconceivable", "definition": "考えられない、想像できない。予測不可能で信じられないような出来事を表現する際に使用される高度な語彙です。"}, {"word": "defendant", "definition": "被告人、被告。法律や裁判関連の文脈で、訴えられている人物を指す法律用語です。"}, {"word": "proceedings", "definition": "訴訟手続き、審理。法廷での一連の手続きや裁判の過程を示す法律用語です。"}, {"word": "voluntary statement", "definition": "自発的陳述、任意供述。法執行機関に対して本人が自らの意思で述べた陳述を意味します。"}]}, {"title_ja": "Woman says she was left 'bewildered and confused' by alleged Russell Brand assault", "title_en": "Woman says she was left 'bewildered and confused' by alleged Russell Brand assault", "summary_ja": "The 51-year-old faces three counts of rape, three of sexual assault and one of indecent assault, all of which he denies.", "summary_en": "The 51-year-old faces three counts of rape, three of sexual assault and one of indecent assault, all of which he denies.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck8dz6m1d2n6o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Woman says she was left 'bewildered and confused' by alleged Russell Brand assault\n- Published\n- Warning - this report contains graphic content\nA woman who alleges she was indecently assaulted by Russell Brand has told his trial she was left feeling \"bewildered and confused\".\nThe woman, who worked at MTV at the time, said the entertainer went from \"jovial\" to a \"wild-eyed maniac\" as he attempted, she alleged, to pull her into a toilet.\nBrand, 51, faces seven charges in the trial - three counts of rape, three charges of sexual assault and one of indecent assault.\nThe allegations, made by six female complainants, span a 10-year period between 1999 and 2009. He denies the charges.\nThe woman gave evidence on Friday from behind a screen at Southwark Crown Court in London, on the third day of Brand's trial.\nShe told the jury the alleged incident at MTV lasted for about 20 seconds, adding: \"It was a very short exchange.\"\nAsked how she felt after the alleged attack by Brand, the woman said: \"Bewildered, confused, 'what the hell happened there?'\"\nShe said Brand went from someone who was \"affable\" to a \"wild-eyed maniac trying to pull me into the toilet\".\n\"I was confused that that actually just happened - anyone would be,\" she said.\nThe complainant told jurors on Friday she met Brand in 2001 when she worked at MTV.\nShe said she recognised him straight away and said there was \"banter\" between them initially.\nAfter noticing his \"distinctive T-shirt\" with the words \"I am Spartacus\", she told Brand she \"loved it\" and wanted it.\n\"He said, 'you can have it'\", the woman told the jury, to which she said she replied: \"Make sure it gets a good wash first.\"\nBrand then asked her for directions to the bathroom.\nThe woman, who was in her thirties at the time, said she offered to show him the way because she was going in the same direction.\nProsecutor Riel Karmy-Jones KC asked her what happened next.\nShe said his \"demeanour changed\" when they got to the bathroom door.\n\"He grabbed my forearm, he was leaning into the door and he was quite forceful,\" she said, adding that it took her \"unaware\".\nAsked by the prosecutor what she meant by his demeanour changing, the witness said: \"He grabbed me by the arm, started to pull me in.\"\nShe said Brand then said to her \"come on\" while still holding her forearm.\nThe woman said while Brand was trying to pull her into the bathroom, she was trying to pull herself away.\n\"I said to him, 'What are you doing, are you mad, let me go'... and then he started to... plead almost,\" she said.\nThe woman told the court she managed to \"wrench\" herself from Brand's grip because of her own strength.\nShe told jurors Brand went from \"jovial, affable, friendly to suddenly turning into this wild-eyed manic so I was quite confused this was happening, as anyone would be\".\nAsked by the prosecutor why she did not report what had happened to her employer, she said: \"I was scared... I thought it would be my word against his.\"\nBut she did tell two of her colleagues, she said.\nJurors heard that she reported the allegation to the police in 2023 after watching a Channel 4 documentary about Brand.\n\"I thought it was the right thing to do to come forward,\" she told the court.\nBrand's barrister challenged the complainant on the fact that she did not report Brand for what he had allegedly done until after watching the documentary.\n\"You didn't think there was any need to report him,\" Ian Winter KC said.\n\"It would have been my word against his,\" she replied. \"He didn't manage to rape me. I managed to get out of the situation.\"\nThe defence barrister said: \"It was only after you saw the television programme that you think he was trying to rape you in the toilet.\"\nThe woman responded: \"Why else would you drag someone into the toilet if you weren't going to assault them.\"\nWinter KC continued: \"Twenty-two years before that, you hadn't thought he was trying to get you in there to rape you...\"\nThe woman denied that, adding: \"You don't grab someone by the arm. You don't grip someone and try to drag them in, that's not consensual.\"\nFame Under Fire: Russell Brand on Trial\nYou can follow the trial day by day on the BBC podcast Fame Under Fire: Russell Brand on Trial - available on BBC Sounds, YouTube, iPlayer, or wherever you get your BBC podcasts\nThe woman was speaking after a former flatmate of Brand's, Andrew Dobson, earlier told the jury that \"sex was a huge preoccupation\" for the entertainer.\nDobson gave evidence after another woman told the court on Thursday that Russell Brand raped her in a hotel room in Bournemouth in 1999.\nShe said she had met Brand, before he was famous, while she was attending the Labour Party conference.\nDobson told the court on Friday he attended the Bournemouth conference and had written music for a fringe event that Brand was part of.\nKarmy-Jones asked Dobson how he would describe Brand's character as he got to know him before he was famous.\nDobson told the court Brand was a \"very vibrant character, very egotistica", "translation_ja": "", "vocab": [{"word": "bewildered", "definition": "困惑した、呆然とした状態。予期しない状況で混乱し、理解できない心理状態を表す。ビジネス文脈では、複雑な情報や予期しない結果に対する困惑を描写する際に使用される。"}, {"word": "indecent assault", "definition": "わいせつ暴行、無礼な暴力行為。法的用語で、同意なく他者に対して行われた不適切または下品な身体接触を指す。"}, {"word": "jovial", "definition": "陽気な、上機嫌な。楽しい雰囲気や良い気分を示す形容詞。対比的に使われることが多く、急激な気分の変化を表現する際に効果的である。"}, {"word": "affable", "definition": "愛想の良い、親しみやすい。人当たりの良く、友好的な性格や態度を表す。ビジネスやソーシャル場面で好意的な印象を与える人物を描写する際に用いられる。"}, {"word": "demeanour", "definition": "態度、身ぶり、外面的な振る舞い。人の見た目や行動から読み取られる全体的な印象や態度を指す。心理状態や気分の変化を示す重要な手がかりとなる。"}]}, {"title_ja": "Nurse stole £750k from 99-year-old woman for cosmetic surgery and home improvements", "title_en": "Nurse stole £750k from 99-year-old woman for cosmetic surgery and home improvements", "summary_ja": "Rebecca Louise Burwood saw the vulnerable victim \"as her nanna\" but stole to fund her lifestyle.", "summary_en": "Rebecca Louise Burwood saw the vulnerable victim \"as her nanna\" but stole to fund her lifestyle.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm9qzx43rlzjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Nurse stole £750k from 99-year-old woman for cosmetic surgery and home improvements\n- Published\nA nurse who stole £750,000 from a vulnerable 99-year-old and spent the money on cosmetic surgery and home improvements has been struck off.\nRebecca Louise Burwood exploited the resident who was living at Bryn Yr Haul Care Home in Mold, Flintshire, where she was deputy manager, for her own personal and financial gain.\nShe coerced the pensioner from 2017 to 2023 and also bought a car and campervan with the stolen money, as well as obtaining ownership of the woman's home.\nA Nursing and Midwifery Council (NMC) hearing found Burwood's fitness to practise was impaired by reason of misconduct and imposed a striking-off order, meaning she will be removed from the nursing register.\nThe NMC hearing was told Burwood had a longstanding relationship with the woman before she moved into the home in 2018.\nThe panel heard the resident had no family members and was vulnerable after a fall. She was dependent on Burwood for friendship and social contact.\nIt found that, between 2017 and 2023, Burwood abused a position of trust and power, becoming the resident's lasting power of attorney, while also overseeing her care.\nBurwood withdrew money from the woman's bank account, accepted ownership of her house and received thousand of pounds, which was used for her own benefit, including for building work and the purchase of vehicles.\nEvidence presented showed more than £370,000 had left the resident's account over five years, with £160,000 of that from making large cash withdrawals at ATMs.\nShe also took the resident to the solicitors and got her to transfer the ownership of her £400,000 house.\nThe hearing was told there was \"evidence to show Mrs Burwood used the funds for house improvements, utility bills and council tax\", and there were \"allegations that Mrs Burwood used some of the funds for personal cosmetic surgery\".\nShe convinced the resident to pay £20,000 for a car and £9,000 for a campervan, which she said was purchased so the pair could go on days outs.\nBurwood claimed the work on her home had been so the elderly woman could live with her in the event of another outbreak of Covid - however it had been paid for before any Covid lockdown in the UK.\n'Almost blackmailing'\nBurwood told the tribunal the woman asked her to withdraw cash from her bank account and make donations to charities each week.\nShe claimed the donations, which were between £250 and £500 each time, would usually go towards charities that supported the blind or those with heart issues.\nBurwood said she would either put the cash in charity pots while she was out and about, or hand donations directly to staff in local charity shops.\nHer legal representative Victoria Rees said the resident had told her \"she didn't want anything to be left by the time she died, as she didn't want the government to have her money\", adding Burwood \"didn't keep any records of the amount of money she withdrew or the amount of money she donated\".\nThe pensioner's bank referred the matter to North Wales Police and the force launched an investigation.\nThe resident's bank account was frozen following concerns about spending, but Burwood attempted to have restrictions lifted and took the resident to a bank branch.\nBank staff claimed Burwood was \"almost blackmailing\" the woman, and told her to ask for the accounts to be unlocked.\nThe panel found Burwood told the woman she would not be able to take her on outings if she could not access her money.\nThe hearing was told the resident later told safeguarding staff she was shocked by the amount of money that had been spent from her account.\nAnother nurse also said they overheard Burwood tell the woman, \"I will give you the money back\" and \"sign here\".\nShe reported the conversation as evidence of financial abuse and it was decided Burwood would only make supervised visits to the woman.\nBurwood claimed she had only been asking the pensioner to \"sign a condolence card\" and it was \"not in relation to signing a document\".\nShe claimed the resident's eyesight was \"very poor\" so she had held the card for her, showed her where she should sign and stopped her from signing over the printed words in the card.\nPolice investigated, but the woman did not want to take further action as she described Burwood as a friend, and believed she had \"learned from her mistakes\".\nThe panel concluded there had been a significant imbalance of power in the relationship.\nIn its ruling, the panel said Burwood had engaged in a \"sustained, calculated course of conduct\" and had manipulated the resident for personal gain.\nIt added Burwood had taken advantage of the trust the woman had placed in her and \"weaponised\" it against her.\nThe panel also found Burwood acted dishonestly by failing to tell her employer she held financial lasting power of attorney for a resident at the care home where she worked.\nIt said her actions amounted to serious misconduct, breached fundamental nursing standa", "translation_ja": "", "vocab": [{"word": "exploit", "definition": "弱い立場の人を不正な方法で利用して利益を得ること。ここでは看護師が高齢者の信頼を悪用してお金を盗んだという意味で使われている。"}, {"word": "coerce", "definition": "強制や圧力を使って誰かに何かをさせること。記事では2017年から2023年にかけて高齢者に金銭的な行為を強要したことを指す。"}, {"word": "impaired", "definition": "能力や機能が損なわれた、または低下した状態を表す。ここでは看護師としての適性が職務怠慢により害されたことを意味する。"}, {"word": "striking-off order", "definition": "医療専門家などの登録簿から名前を削除する処分のこと。これにより看護師は職務を行う資格を失う。"}, {"word": "lasting power of attorney", "definition": "法的に誰かの財産や医療上の決定を管理する権限を与えられた人。この場合、看護師が高齢者の代理人としての立場を悪用した。"}]}, {"title_ja": "Brazil: Amazon deforestation lowest in nearly 40 years", "title_en": "Brazil: Amazon deforestation lowest in nearly 40 years", "summary_ja": "The latest figures show that 3,335 square kilometers of the Amazon rainforest were cleared in the year ending in July, the lowest level since 1988. The drop has been described as an \"historic achievement.\"", "summary_en": "The latest figures show that 3,335 square kilometers of the Amazon rainforest were cleared in the year ending in July, the lowest level since 1988. The drop has been described as an \"historic achievement.\"", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/brazil-amazon-deforestation-lowest-in-nearly-40-years/a-79684906?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Brazil: Amazon deforestation lowest in nearly 40 years\nOctober 17, 2026\nBrazil has recorded the lowest level of deforestation in the Amazon rainforest in nearly 40 years.\nAccording to data released by the Brazilian space research agency Inpe on Friday, between August 2025 and July 2026, 3,335 square kilometers (1,288 square miles) of forest were cleared, the lowest level witnessed since records began in 1988.\nThe numbers showed a nearly 42% decrease from last year's figure of 5,731 square kilometers.\nThe Amazon is the world's largest tropical rainforest and one of its most biodiverse ecosystems, most of which lies in Brazil.\nIt also extends into parts of Peru, Colombia and other South American countries. Deforestation and the illegal exploitation of resources have been pushing it closer to a climate tipping point.\nDrop hailed as 'historic achievement'\n\"It's an absolutely stratospheric drop...it's like a dream,\" said Environment Minister Joao Paulo Capobianco at a press conference in the capital, Brasilia.\n\"Our goal is to achieve zero illegal deforestation by 2030,\" said President Luiz Inacio Lula da Silva in a post on X.\n\"The figures released today are a historic achievement,\" said Marcio Astrini, executive secretary at climate advocacy group Observatorio do Clima.\n\"They put Brazil at the forefront of the forest protection agenda and show the world that, with political will, it is possible to stop the chainsaws and curb greenhouse gas emissions,\" Astrini said on his organization's website.\nObservatorio do Clima said the figures were the result of a \"sustained commitment\" to protecting the environment by the government, which introduced greater monitoring and stiffer penalties for illegal logging.\nThe news comes ahead of the October 25 runoff election between Lula and conservative senator Flavio Bolsonaro with the two running neck and neck according to polls.\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.\nEdited by: Sean Sinico", "translation_ja": "", "vocab": [{"word": "stratospheric", "definition": "非常に高い、急激な増加を表す。通常、数値や成長が極めて大きいことを強調するために使用される。"}, {"word": "tipping point", "definition": "システムや状況が不可逆的な変化を起こす臨界点。この点を超えると、劇的な変化が起こる。"}, {"word": "advocacy", "definition": "特定の原因や立場を積極的に支持・推進する行動。政治的・社会的活動を通じて支援することを意味する。"}, {"word": "exploitation", "definition": "資源や人を不正または過度に利用すること。搾取や悪用を指す。"}, {"word": "stifle", "definition": "制限する、抑圧する。本来は息ができなくする意味だが、発展や成長を妨げることに使われることもある。"}]}, {"title_ja": "Ukrainian President Zelenskyy speaks at EU summit amid spat with Donald Trump", "title_en": "Ukrainian President Zelenskyy speaks at EU summit amid spat with Donald Trump", "summary_ja": "EU leaders reaffirmed support for Ukraine at the Brussels summit. But souring relations with the US over Russia and Starlink and a big hole in the budget will make for a difficult winter for Ukraine.", "summary_en": "EU leaders reaffirmed support for Ukraine at the Brussels summit. But souring relations with the US over Russia and Starlink and a big hole in the budget will make for a difficult winter for Ukraine.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukrainian-president-zelenskyy-speaks-at-eu-summit-amid-spat-with-donald-trump/a-79684340?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Ukraine's Zelenskyy speaks at EU summit amid spat with Trump\nOctober 16, 2026\nUkrainian President Volodymyr Zelenskyy was applauded by EU leaders when he appeared at this week's summit in Brussels. But getting what he needs from Europe will be tough, and a public dispute with US President Donald Trump has put him in a very difficult position.\nSpeaking to press at the summit, he said that \"Putin wants to destroy us\" and that Ukraine must prepare for a hard winter.\nExperts view the upcoming cold season as a rough one for Ukraine as well.\n\"Ukraine is arguably entering the most difficult winter since [Russia's] full scale invasion,\" Olena Prokopenko, a senior fellow at the German Marshall Fund of the United States, a nonpartisan think-tank, told DW.\nThree painful topics were on the table at the summit for discussion between Zelenskyy and EU leaders: US relations with Russia, Starlink ― and money.\nIs the US siding with Russia?\nZelenskyy's visit to Brussels comes at a time when he needs European support more than ever. That's because his relationship with the US is worsening. Worries are growing in the EU and Ukraine that the US is growing more sympathetic to Russia.\nPresident Trump told US news channel Newsmax: \"I think I find Zelenskyy to be more difficult to deal with than [Russian President Vladimir] Putin.\"\nTrump struck a deal to buy Russian diesel on October 12, which signifies a step back from sanctions placed on Russia and a blow for Ukraine.\nWhen Zelenskyy ordered Ukrainian forces to conduct fresh strikes on Russia's oil refineries, Trump labelled the Ukrainian leader's decision as \"a disgrace.\"\nAt the press conference at the summit on Friday, Zelenskyy told reporters that he knows that US-built missiles \"are being sent to the Middle East, so it is no secret that we are not a priority.\"\nHe is asking Europe instead to supply the military power Ukraine needs to get through the winter.\nSince the beginning of Russia's full-scale invasion of Ukraine in February 2022, the US has been the biggest military donor to Ukraine. But the relationship between the two countries has become more difficult since the start of Donald Trump's second term in the White House.\nThe Starlink slowdown\nUkraine uses Starlink, a satellite Internet service developed by tech billionaire Elon Musk. The country also uses Starshield, the military-grade version, for battlefield communications, mid-range strikes on Russian-occupied territory and interceptor drones, though not for long-range strikes in Russia.\nAt the summit, Zelenskyy spoke of his \"deep and unpleasant\" surprise upon finding out that Ukraine was experiencing disruptions to the systems. He said this has hobbled Ukraine's ability to defend itself.\nBoth Elon Musk and the White House say they are not responsible for the slowdown.\nThe EU's foreign policy chief Kaja Kallas told the press at the summit before the talks began: \"Starlink is really necessary for Ukraine and unfortunately in [the] short term Europe can't replace this capability.\"\nProkopenko said that this was the reason \"why Ukraine's most credible medium-term solution here is to continue relying on the US. And the EU is critical in this context in terms of backing Ukraine's requests for the US administration to keep those technologies on offer\" for Kyiv.\nSpeaking to journalists at the summit, Zelenskyy said the speed of Starlink had still not been fully restored but had improved. He said Ukraine is cooperating with various countries, including France, to search for a partial solution.\nUkraine's budget problem\nZelenskyy urged EU leaders Friday to keep backing Kyiv financially as well, asking for nearly $80 billion (€70 billion) more next year.\n\"This is a realistic amount and I ask you to find this support,\" Zelenskyy said. \"It will help us hold Russia back.\"\nThe EU gave Kyiv an approximately $100 billion (€90 billion) loan last year, making the EU Ukraine's biggest international backer. But the Ukrainian government is saying it needs more.\n\"The war is becoming objectively more expensive, and the Ukrainian economy is increasingly affected by the Russian strikes, leading to a drastic decline in tax and customs revenues,\" Prokopenko said. \"So the needs will continue growing.\"\nSo will Ukraine get what it needs? Closing the summit, President of the European Council Antonio Costa said that Ukraine \"remains a priority\" and asked the European Commission to come up with a proposal to pull together more funds for the country in 2027.\nEssentially, it looks as though the EU will try to find a way to meet Ukraine's cash demands ― though it is not yet clear how.\nEuropean Commission President Ursula von der Leyen promised the EU will \"continue to lead\" but urged international partners to step up as well.\nUkraine to 'keep living and fighting with dignity'\nZelenskyy will leave Brussels without concrete promises or numbers, but with renewed commitments for support from Europe.\nThe Ukrainian president concluded his press conference with an", "translation_ja": "", "vocab": [{"word": "sympathetic", "definition": "ある立場や意見に同情的である、または支持的である。政治的文脈では、ある国や勢力に対して好意的な姿勢を示すことを意味する。"}, {"word": "signifies", "definition": "何かが重要な意味や象徴的な意味を持つことを示す。特に、小さな行動や出来事がより大きな傾向や政策の変化を表すことを意味する。"}, {"word": "sanctions", "definition": "ある国の不正な行為に対する罰として、他国が実施する経済的または政治的措置。多くの場合、貿易の制限や資産の凍結などが含まれる。"}, {"word": "nonpartisan", "definition": "政治的に中立で、特定の政党や派閥に偏らない立場。客観的で公平な分析や意見を提供する組織や人物を表す。"}, {"word": "interceptor", "definition": "敵の攻撃や物体を発見して撃墜または阻止する目的で使用される航空機またはシステム。軍事防御における重要な装備である。"}]}, {"title_ja": "West Bank: US journalist injured by Israeli settlers", "title_en": "West Bank: US journalist injured by Israeli settlers", "summary_ja": "Washington Post journalist Heidi Levine said she was beaten by Israeli settlers in the occupied West Bank. Reporters Without Borders slammed the attack as \"brazen violence.\"", "summary_en": "Washington Post journalist Heidi Levine said she was beaten by Israeli settlers in the occupied West Bank. Reporters Without Borders slammed the attack as \"brazen violence.\"", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/west-bank-us-journalist-injured-by-israeli-settlers/a-79684181?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "West Bank: US journalist injured by Israeli settlers\nOctober 16, 2026\nWashington Post journalist Heidi Levine was injured on Friday after being attacked by a group of Israeli settlers while on assignment in the occupied West Bank, according to the publication.\nThe Post said that the incident took place near the village of Abu Falah, northeast of Ramallah, and involved \"dozens of masked Israeli settlers\" who attacked Palestinian villagers gathering the autumn olive harvest.\nWashington Post says Levine clearly identifiable\nMatt Murray, the paper's executive editor, called for an investigation into the incident.\n\"This morning, a Washington Post photographer, Heidi Levine, was attacked by Israeli settlers while reporting in the West Bank,” Murray said. Levine is a US citizen.\n\"She was wearing visible markings clearly identifying her as a journalist. While we are relieved that Heidi has received medical care and is safe, we are outraged by this unwarranted attack on a journalist doing her job and urge a thorough investigation and follow-through from authorities.\"\nSpeaking from a hospital bed later, veteran photojournalist Levine, who is in stable condition, said: \"I was attacked, pushed to the ground. Luckily I had my flak jacket and helmet, otherwise I probably wouldn't even be here, because they just kept kicking me and kicking me.\"\nBlogger Andrey Khrzhanovskiy filmed the incident and told The Post that the settlers beat Levine with sticks while journalists and villagers were forced back.\nNetanyahu's office says facts 'remain unclear'\nThe office of Prime Minister Benjamin Netanyahu issued a statement saying it was not yet clear exactly what had happened.\n\"The facts surrounding the confrontation near Abu Falah, during which Washington Post photojournalist Heidi Levine was allegedly assaulted, remain unclear and are under investigation.\nNetanyahu's office went on to say there were reports that \"some 200 Arabs and far-left activists confronted approximately 40 Israeli youths.\" It said that there was footage of masked individuals from both sides \"hurling objects.\"\n\"Other footage appears to show Levine knocked down and immediately helped to her feet by the same unidentified individual. The investigation must establish the facts, including who initiated the violence,\" Netanyahu's office said.\nThe Israel Defense Forces (IDF) said that both the IDF and the Israel Border Police attended the scene.\n\"Foreign media personnel were present at the scene and a female journalist was injured during the confrontation. All details of the incident will be examined. Upon arriving to the scene, the forces acted to disperse the confrontation using riot dispersal means,\" the IDF said in a statement on X.\n\"The IDF strongly condemns this incident. Attempts to incite friction between populations undermine security in the area,\" the IDF said.\nUS condemns 'criminal violence'\nThe US said it condemned \"criminal violence by any party\" in the occupied West Bank.\n\"We condemn criminal violence by any party in the West Bank and support appropriate investigations as well as legal accountability for those responsible,\" the AFP news agency quoted a State Department official as saying, on condition of anonymity, without directly criticizing the settlers.\n\"The Department has reached out to the Washington Post to offer consular assistance,\" the official told AFP.\nUS Democratic Senator Chris Coons of Connecticut, in a post on X, called the attack \"appalling\" and said \"there must be swift justice and accountability for perpetrators of violent extremism in the West Bank, which stands in the way of regional peace and is escalating an already unpredictable and dangerous situation.\"\nAttack condemned by press association and advocacy group\nThe Foreign Press Association represents international media in Israel and the Palestinian territories and said Levine's passport, phone, wallet and equipment were stolen by the attackers.\n\"This is the latest in a long line of violent attacks by Israeli settlers against journalists and other civilians in the occupied West Bank,\" it said.\n\"Yet our repeated calls for action to confront this lawlessness have been ignored by Israeli authorities,\" it added.\nInternational press watchdog Reporters Without Borders strongly condemned the attack and called on Israeli authorities to \"put an end to this impunity and prosecute the perpetrators of this heinous assault.\"\n\"This brazen violence... is evidence of the impunity with which extremist Jewish settlers operate, often under the protection of Israeli armed forces,\" added the advocacy group, known by its French initials RSF.\nEdited by: Wesley Dockery\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "unwarranted", "definition": "正当な理由がない、根拠のない。不当な攻撃や批判などに対して使われる。"}, {"word": "veteran", "definition": "長年の経験を持つ、熟練した。特に職業や分野で豊富な実績がある人を指す。"}, {"word": "confrontation", "definition": "対立、衝突。二つの勢力やグループが直接対面して対立する状況。"}, {"word": "alleged", "definition": "主張されている、疑わしい。確実でなく、まだ証明されていない事柄に用いられる。"}]}, {"title_ja": "Bend, Oregon, shooting: Suspect ID'd, previously attended elem. school, police say", "title_en": "Bend, Oregon, shooting: Suspect ID'd, previously attended elem. school, police say", "summary_ja": "Three children and one teacher are dead after a shooter forced his way into a Bend, Oregon, elementary school and opened fire, authorities said.", "summary_en": "Three children and one teacher are dead after a shooter forced his way into a Bend, Oregon, elementary school and opened fire, authorities said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/multiple-people-injured-shooting-oregon-elementary-school-suspect/story?id=137303119", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Judge tosses indictment against actor Timothy Busfield", "title_en": "Judge tosses indictment against actor Timothy Busfield", "summary_ja": "A New Mexico judge has dismissed an indictment against actor and director Timothy Busfield on four counts of sexual contact of a minor.", "summary_en": "A New Mexico judge has dismissed an indictment against actor and director Timothy Busfield on four counts of sexual contact of a minor.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Culture/judge-tosses-indictment-actor-timothy-busfield/story?id=137332942", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LGBTQ+ people go into hiding in Senegal as hundreds are arrested", "title_en": "LGBTQ+ people go into hiding in Senegal as hundreds are arrested", "summary_ja": "At least 320 people detained for ‘acts against nature’ after law criminalising homosexuality toughened, HRW reports Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report . More than 320 in", "summary_en": "At least 320 people detained for ‘acts against nature’ after law criminalising homosexuality toughened, HRW reports Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report . More than 320 in", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/15/senegal-homosexuality-criminalised-anti-lgbtq-arrests-hiv-testing-human-rights-watch", "state_media": false, "category": "社会", "full_text": "Mass arrests, forced HIV testing and barriers to legal representation are part of an escalating crackdown against LGBTQ+ people in Senegal, according to a new report.\nMore than 320 individuals have been arrested and detained on allegations of “acts against nature” since February, according to HIV Justice Network, an organisation quoted in the Human Rights Watch (HRW) report. Among these, at least 84 were charged with “voluntary HIV transmission”, solely on the basis of their HIV status.\nThe intensifying crackdown comes as the law criminalising homosexuality in the country was toughened earlier this year. On 11 March, Senegal’s parliament amended the penal code, doubling the maximum prison term for consensual same-sex relations to 10 years.\nThe new law introduced penalties of up to seven years in prison and a fine of 500,000 to 5m CFA francs (£650–£6,500) for promoting homosexuality, or supporting or financing LGBTQ+ people and organisations.\nLarissa Kojoué, LGBTQ+ rights researcher at Human Rights Watch, said: “LGBTQ+ people are being forced to curb their normal activities … for fear of arrest and increased stigma. Senegal’s government should call a halt to this crackdown, which threatens everyone’s rights.”\nSame-sex sexual activity was criminalised in Senegal in 1965, but hostility towards LGBTQ+ individuals has grown in recent years. During the 2024 presidential campaign, Bassirou Diomaye Faye, who ended up winning the election, and the former prime minister Ousmane Sonko promised to strengthen laws criminalising same-sex relations, framing the issue as a national priority.\nArrests of men and women have happened all over the country. The police say they have arrested people based on information extracted from seized phones, third-party allegations or raids on private premises.\nThe changes to the penal code have had a chilling effect on lawyers, who said they were afraid to represent people for fear of being prosecuted themselves, according to the report. Doctors told Human Rights Watch that the changes were discouraging people from seeking HIV testing and treatment.\nWhile there was a 49% fall in new HIV infections in western and central Africa from 2010 to 2022, sub-Saharan Africa remains disproportionately affected by the virus, with 64% of all people living with HIV globally.\nSylvie Beaumont, a consultant with HIV Justice Network, said she had received anecdotal evidence that HIV clinics had seen a drop in attendance. “Obviously this is not good for the HIV response because people are going without treatment, they’re not going to get tested,” she said.\n“The consequences are really bad and it’s sad because Senegal was a country that was doing well with their HIV response. They are shooting themselves in the foot.”\nShe said while the law criminalising deliberate HIV transmission was not part of the reforms to the penal code this year, there had been an “unprecedented” rate of arrests in recent months. She labelled the charges “nonsensical” because it was reported that most people had either only discovered their status upon arrest; were arrested with condoms; or were on treatment that renders transmission of the virus impossible.\nThe report said police had breached confidentiality of ongoing criminal investigations involving suspected LGBTQ+ people by leaking details to the media, which reported personal and confidential information, including HIV status – exposing individuals to social stigma, family rejection, threats and violence.\nLGBTQ+ people interviewed by Human Rights Watch said the crackdown was instilling fear among their community, and causing them to feel anxious and depressed. Many have gone into hiding, restricted their movements or relocated; some have left the country.\nThe report pointed out that the crackdown flew in the face of domestic and international laws that guaranteed the right to a fair trial, privacy and non-discrimination.\nThe changes to Senegal’s penal code is part of a trend across sub-Saharan Africa towards more punitive legislation directed against LGBTQ+ people.\nThere have been dozens of arrests in Niger since it criminalised “sexual relations with a person of the same sex” in February. It was the first time in the country’s history that homosexuality had been criminalised, and followed the introduction of similar laws and penal codes in neighbouring Mali and Burkina Faso within the past two years. All three are ruled by military juntas.\nIn May, Ghana, which already outlaws gay sex, passed legislation criminalising LGBTQ+ “activities”. The bill, which has not been signed into law by the president, is the latest iteration of legislation first proposed in 2021. In 2023, Uganda’s Anti-Homosexuality Act made homosexual acts punishable by death.", "translation_ja": "", "vocab": [{"word": "escalating", "definition": "段階的に、または急速に増加・悪化していくこと。状況が次第に深刻になることを表す。"}, {"word": "crackdown", "definition": "不法行為や反対勢力に対する厳しい取り締まりや弾圧。強制的な取り締まり活動。"}, {"word": "penal code", "definition": "犯罪と刑罰に関する法律体系。国の刑法典全体を指す。"}, {"word": "chilling effect", "definition": "恐れや脅威によって人々が正当な活動を控えるようになる心理的影響。法的規制が自由な行動を萎縮させる現象。"}, {"word": "disproportionately", "definition": "不均等に、または不相応なほど高い割合で。本来の割合以上に偏って影響を受けていることを表す。"}]}, {"title_ja": "Zimbabwean author Simbarashe Kundizeza denies using AI to write prize-winning story", "title_en": "Zimbabwean author Simbarashe Kundizeza denies using AI to write prize-winning story", "summary_ja": "Article in Atlantic claims The Blue Fighter was artificially generated, days after it won Caine prize for African writers The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost comple", "summary_en": "Article in Atlantic claims The Blue Fighter was artificially generated, days after it won Caine prize for African writers The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost comple", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/technology/2026/oct/14/zimbabwean-author-simbarashe-kundizeza-denies-ai-story", "state_media": false, "category": "IT", "full_text": "The Zimbabwean writer Simbarashe Kundizeza has denied using AI to write a prize-winning short story after an article in the Atlantic said software had flagged it as almost completely AI-generated.\nKundizeza’s story The Blue Fighter was announced as the winner of the prestigious Caine prize for African writers on 6 October. Five days later, The Atlantic published an article by the author and journalist Vauhini Vara titled: “Yet Another Literary prize winner Seems to Be AI.”\nVara said that she had run the story through the AI-detection software Pangram, which itself uses AI, and it had deemed the story to be almost completely artificially generated. The exception, she said, was an epigraph from what is described as an unpublished poem by the South African writer Vangile Gantsho.\nVara said that when she read the story, she “was struck by the proliferation of language that is common in AI-produced writing: the not x, but y sentence constructions; the glut of metaphors; the platitudinous aphorisms”.\nShe said: “Taste is subjective, but trust me, this story is bad – maudlin and full of tired tropes.”\nKundizeza responded in a statement on X: “For the avoidance of doubt, I wrote ‘The Blue Fighter’. I did not use generative AI to write it. It is entirely my own work.\n“I look forward to continuing to work with the Caine prize team, and to celebrating this recognition with the people who helped bring this story into the world. Most importantly, I will continue to write.”\nSimilar claims have been made recently about other literary prize winners. In July, the Trinidadian writer Jamir Nazir won the Commonwealth Foundation’s short story prize with The Serpent in the Grove, despite critics on social media claiming it had “obvious markers” of AI writing.\nLast month, the Canadian-Haitian writer Thélyson Orélien’s novel C’était Ça Ou Mourir (It Was That or Die) was removed from the longlist of France’s most prestigious literary prize, the Goncourt, after an anonymous online account alleged the book was “almost entirely” written by AI.\nThe Caine prize said in a statement that it was reviewing the allegations that Kundizeza had used AI. It said: “When such claims are made, it is our responsibility to look into them. We aim to do this by taking a human-centred approach, ensuring that writers are supported and cared for during the process.”\nIts chair questioned the reliability of AI-detection software itself.\nEllah Wakatama told the BBC’s Front Row radio show: “As someone who chairs a prize, I’m obviously not against AI, but what I am against is it being used as a final arbiter in this case, regardless of what the Atlantic says, because they have already proclaimed our winner to be a cheater without investigating it properly.\n“I am not happy for the work of writers, and in this case especially black writers, to form the testing ground for something that is at best still rough and ready.”\nVara said in her article, and repeated in an interview with Front Row, that she had read a 2021 story by Kundizeza that was tonally and stylistically different from The Blue Fighter.\nIn his statement, he responded: “To suggest that a writer cannot write in different styles or genres, or improve his writing substantially after five or more years fundamentally misunderstands the craft of writing.”\nVara pointed to Pangram’s own research that found that false positives were rare, including for non-native English speakers writing in English, as well as a peer-reviewed journal article that found Pangram had “strong accuracy” when assessing mock academic papers created fully, partly or with no AI. However, she acknowledged to the BBC that there was “relatively little third-party research” on the accuracy of AI detection software.", "translation_ja": "", "vocab": [{"word": "proliferation", "definition": "急速な増加や拡大のこと。特に望ましくない何かが急速に増える場合に用いられる。文中ではAIが生成した文章に共通する言語表現が大量に存在することを指す。"}, {"word": "platitudinous", "definition": "ありふれた、平凡な、陳腐な思想や表現を指す。退屈で創意工夫に欠ける言葉遣いを批判する際に使われる高度な表現。"}, {"word": "maudlin", "definition": "感情的に過度にセンチメンタルであるか、悲しげな状態を示す。やや嘲笑的なニュアンスを含み、不適切に感情的であることを批判する。"}, {"word": "alleged", "definition": "証拠がないまま主張されている、疑わしいと言われている状態。法的文脈で「容疑をかけられている」という意味で頻繁に使用される。"}, {"word": "avoidance", "definition": "何かを避けることや回避すること。ビジネスや法的文脈で「疑問の余地をなくすために」という意味で「for the avoidance of doubt」というフレーズとして使われる。"}]}, {"title_ja": "Guinea-Bissau denies it has approved controversial vaccine trial in newborns", "title_en": "Guinea-Bissau denies it has approved controversial vaccine trial in newborns", "summary_ja": "Health minister says government ‘did not authorize’ Danish-led hepatitis B trial in babies backed by RFK Jr Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on ", "summary_en": "Health minister says government ‘did not authorize’ Danish-led hepatitis B trial in babies backed by RFK Jr Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/14/guinea-bissau-vaccine-hepatitis-b-trial-denial", "state_media": false, "category": "政治", "full_text": "Guinea-Bissau has not approved the controversial hepatitis B study in newborns that would be funded by the US government and private partners, the African country’s minister of health said on Tuesday.\nThe study, which would not investigate the safety or effectiveness of vaccines but would instead track “nonspecific” health outcomes like overall mortality or neurodevelopmental conditions, has been championed by Robert F Kennedy Jr, secretary of the US Department of Health and Human Services (HHS) and a longtime anti-vaccine activist.\nMembers of a Danish research ethics committee were informed that officials in Guinea-Bissau had approved an updated design of the study, which influenced some committee members’ votes to proceed with the trial last week.\nBut the health ministry never agreed to or authorized the trial, said Quinhin Nantote in Portuguese at a press briefing, where he referred to the study as “tests”.\n“The ministry did not authorize the tests under the terms presented in the publications currently in circulation,” the health minister said. He said officials in Guinea-Bissau were “surprised” to see media reports that the country had given approval to the study.\n“Any scientific research initiative involving human beings, particularly children, must strictly comply with applicable national legislation, international ethical principles, competent evaluation and approval mechanisms,” Nantote said.\nHe spoke after convening an emergency meeting in Guinea-Bissau with the Bandim Health Project, the local ethics committee, the National Institute of Public Health (Inasa) and the Expanded Vaccination Program (PAV).\nThe Bandim Health Project is run by the Danish researchers Peter Aaby and Christine Stabell Benn, whose decades of research have been called into question in the past year.\nThe claims made in nearly all of their papers are “highly misleading”, said Charlotte Strøm, a Danish researcher who has co-authored research showing that Aaby, Stabell Benn, and their co-authors had no significant findings in 24 out of 25 studies and that they’ve chosen not to publish research that may not support their viewpoints.\n“When researchers operate like this and abandon proper methodological rigor, they literally decide on the results themselves, and that is not science,” Strøm said, calling it “problematic, questionable [and] unethical”.\nShe added: “I believe there is serious cause for concern.”\nKennedy has repeatedly praised their work, which he says shows that after vaccination, “you can have mass injuries, and catastrophic injuries, and they’re hiding in plain sight”.\nAaby, Stabell Benn and Frederik Schaltz-Buchholzer did not respond by press time to the Guardian’s questions about why the Danish ethics committee members were told the trial had been approved by local authorities and why it could not be held in Denmark.\nIn Denmark, infants born to hepatitis B-negative parents do not receive the shot, there is widespread testing for and low incidence of the virus, and the robust healthcare system can track health outcomes and provide timely and comprehensive medical care – making it an ideal location for such a study.\n“It’s completely unethical that this trial is even proposed,” because a safe and effective vaccine has been available for decades, said BK Titanji, a researcher at Emory University.\nIt’s “reassuring” to see Guinea-Bissau pushing back on the trial, Titanji said, adding: “A study like this one needs the highest level of ethical scrutiny. You are going to be conducting a study on the most vulnerable population, which is newborn babies, in a country that is resource-constrained.”\nWhen Titanji recently applied for approval of a collaborative study in Cameroon, she had to include extensive documentation in her application – and it was a survey, not medical research on human subjects, she said. “I can’t come to Emory’s [institutional review board] and just be like: ‘I got permission from Cameroon.’ I have to provide the document.”\nThe researchers should release these documents and an updated protocol showing how the study would be conducted, she said.\nExperts have decried the African experiment as “horribly unethical and cruel”, “neocolonialist” and “damaging”.\n“For the government of Guinea-Bissau to stand up against the United States and Denmark exploiting its children is no small statement,” said Colette Delawalla, a researcher and founder and CEO of the non-profit Stand Up for Science. “We absolutely must respect their sovereignty as a nation.”\nIt would cost approximately $13,200 to buy enough vaccines through Unicef and Gavi, the Vaccine Alliance, to immunize all newborns in Guinea-Bissau each year, Delawalla pointed out.\nEveryone involved should work together to ensure that every baby in Guinea-Bissau receives the birth dose of the hepatitis B vaccination, she added. “This is not muddy water: we can use Black babies to further pseudoscience or we can save children’s lives with a 20-cent shot.”\nIt is unclear", "translation_ja": "", "vocab": [{"word": "controversial", "definition": "議論の余地がある、物議を醸す。ある事柄について異なる意見や見方が存在し、議論や批判の対象となっていることを表す。"}, {"word": "championed", "definition": "推し進める、強く支持する。ある人や主張を積極的に応援し、その実現や普及に力を注ぐことを意味する。"}, {"word": "rigor", "definition": "厳密性、厳格さ。学問や研究などにおいて、高い基準を維持し、細かく正確に検証する姿勢のことを指す。"}, {"word": "methodological", "definition": "方法論的な。研究やプロセスの手法や進め方に関わることを表す学術的な用語。"}, {"word": "authorize", "definition": "正式に認可する、承認する。適切な権限を持つ者が、ある行為や計画を公式に認め、実行を許可することを意味する。"}]}, {"title_ja": "Families demand justice after Pakistan school collapse", "title_en": "Families demand justice after Pakistan school collapse", "summary_ja": "Parents are demanding accountability after a school roof collapse in Pakistan&#039;s Peshawar killed 34 children.", "summary_en": "Parents are demanding accountability after a school roof collapse in Pakistan&#039;s Peshawar killed 34 children.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/16/families-demand-justice-after-pakistan-school-collapse?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Skip links\nSkip to Content\nLive\nSign up\nNavigation menu\nNews\nShow more news sections\nMiddle East\nAfrica\nAsia\nUS & Canada\nLatin America\nEurope\nAsia Pacific\nExplained\nSport\nOpinion\nVideo\nInteractives\nMore\nShow more sections\nOriginals\nFeatures\nEconomy\nHuman Rights\nClimate Crisis\nInvestigations\nIn Pictures\nScience & Technology\nPodcasts\nTravel\nSponsored Content\nLive\nClick here to search\nSign up\nFamilies demand justice after Pakistan school collapse\nNewsFeed\nFamilies demand justice after Pakistan school collapse\nPublished On 16 Oct 2026\n16 Oct 2026\nSave\nShare Families demand justice after Pakistan school collapse on social media\nShare\nAdd Al Jazeera on Google", "translation_ja": "", "vocab": [{"word": "collapse", "definition": "建物や構造が突然に崩壊・崩れ落ちること。また、システムや組織の完全な機能停止を意味する。"}, {"word": "demand", "definition": "強く要求すること。権利として何かを求める行為を指し、ビジネスや法律文脈では重要な語彙。"}, {"word": "justice", "definition": "正義や公正さを意味し、法的な観点では正当な扱いや適切な処罰を受けることを指す。"}]}, {"title_ja": "Yemen’s government says Houthis fired two missiles at Aden airport", "title_en": "Yemen’s government says Houthis fired two missiles at Aden airport", "summary_ja": "Attack comes as Yemeni gov&#039;t forces claim advances in Marib and say they &#039;neutralised&#039; 430 Houthi fighters in 24 hours.", "summary_en": "Attack comes as Yemeni gov&#039;t forces claim advances in Marib and say they &#039;neutralised&#039; 430 Houthi fighters in 24 hours.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/16/yemens-government-says-houthis-fired-two-missiles-at-aden-airport?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Yemen’s government says Houthis fired two missiles at Aden airport\nAttack comes as Yemeni gov’t forces claim advances in Marib province and say they ‘neutralised’ 430 Houthi fighters in 24 hours.\nYemen’s internationally recognised government says the Houthis have launched missiles at the airport in Aden, a day after carrying out a deadly attack targeting the presidential palace in the port city.\nYemeni Information Minister Moammar al-Eryani said two missiles landed near the runway at Aden International Airport on Friday, 500 metres (1,640 feet) from an aircraft that was preparing to take off.\nAll passengers and crew were safe, he said on X, thanking “divine providence” for preventing a potential “horrific humanitarian catastrophe” and calling the attacks on the airport “a grave violation of international laws and norms”.\nThe Houthis, in a statement attributed to a military source, said on Friday that they launched an attack on “the Saudi forces’ command headquarters in the Badr camp in Aden province” as well as a weapons depot, the AFP news agency reported.\nThe latest attack in Aden, which is the seat of the internationally recognised government, comes amid continued heavy fighting in Yemen’s reignited civil war between the Saudi-backed government and the Iran-aligned Houthis.\nYemeni government forces said earlier on Friday that troops had advanced in Marib province northeast of Sanaa.\nMilitary spokesman Majed al-Nazili said Yemeni government forces, with air support, had made significant “territorial gains” in the eastern part of the province, securing “key positions”.\nHe also said Yemeni forces had “neutralised” more than 430 Houthi fighters in 24 hours, while destroying or disabling more than 100 of their vehicles and military assets.\nElsewhere, in Taiz governorate, which has emerged as a key battlefront in the war, Yemeni government forces claimed to have fended off several “large-scale” Houthi attacks, inflicting “heavy losses” on the group.\nYemeni government forces also claimed to have captured a specialised drone team affiliated with the Houthis in the Taiz area.\nIn recent weeks, Houthi forces have encircled the city of Taiz — Yemen’s third largest urban centre — by cutting its main road south to Aden, causing widespread displacement and worsening a humanitarian crisis.\nMissiles over Riyadh\nElsewhere on Friday, the Saudi-led coalition fighting Yemen’s Houthis said it had downed missiles and drones over Riyadh and other parts of Saudi Arabia.\nSaudi Arabia has accused Iran of encouraging Houthi attacks against the kingdom, including by arming and training the group.\nBut Iran’s Ministry of Foreign Affairs on Friday rejected the accusation, saying Tehran had not played a role in any Houthi operations. The ministry also reiterated a proposal to mediate between the Houthis and Riyadh.\nThe war in Yemen erupted in 2014 when the Houthis, an armed group also known as Ansar Allah (Arabic for Supporters of God), seized the capital, Sanaa, and forced the government to flee.\nAn international military coalition led by Saudi Arabia intervened in support of the internationally recognised government in 2015, leading to years of fighting between the warring sides.\nA 2022 UN-backed truce halted most fighting, but tensions have been high in Yemen since the Houthis declared a naval blockade of Saudi Arabian ports and shipping passing through the Bab al-Mandeb Strait in July.\nIn September, the Houthis carried out a lightning ground offensive on Mocha, pushing back forces loyal to Yemen’s government from the Red Sea port city.\nThe same month, the group’s forces again swept through and seized territory along the western coast and the Bab al-Mandeb Strait, including the strategically located Mayyun Island in the strait.", "translation_ja": "", "vocab": [{"word": "neutralised", "definition": "敵対勢力や脅威を無害化する、または戦闘不能にすることを意味する。軍事や政治の文脈でよく使用される。"}, {"word": "territorial gains", "definition": "戦争や紛争において、敵から奪取した領土や地域的な支配権を指す。軍事戦略の成功を表す。"}, {"word": "humanitarian catastrophe", "definition": "大規模な人命喪失や苦難をもたらす災害的事態を意味する。国際的な人道的危機を表現する際に使われる。"}, {"word": "encircled", "definition": "軍事的に敵を包囲する、または四方を囲むことを意味する。戦術用語として使用される。"}, {"word": "coalition", "definition": "共通の目的のために一時的に結成された複数の国家や勢力の同盟。国際政治や軍事作戦で頻出する。"}]}, {"title_ja": "Meta employees say Lula’s accounts restricted in Brazil election: Report", "title_en": "Meta employees say Lula’s accounts restricted in Brazil election: Report", "summary_ja": "The messages, reported by a Brazilian daily, say the platform recommended Bolsonaro&#039;s profile and his WhatsApp channel.", "summary_en": "The messages, reported by a Brazilian daily, say the platform recommended Bolsonaro&#039;s profile and his WhatsApp channel.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/economy/2026/10/16/meta-employees-say-lulas-accounts-restricted-in-brazil-election-report?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Meta employees say Lula’s accounts restricted in Brazil election: Report\nThe messages, reported by a Brazilian daily, say the platform recommended Bolsonaro’s profile and his WhatsApp channel.\nEmployees at Meta have acknowledged in internal communications that the Instagram accounts of Brazilian President Luiz Inacio Lula da Silva were negatively affected by restrictions during the country’s election, media reports say.\nThe messages, reported on Friday by Brazilian daily Folha de S Paulo, also acknowledged the platform recommended the profile of Lula challenger Senator Flavio Bolsonaro, as well as his WhatsApp channel. Folha, the Sao Paulo-based paper, cited messages it had reviewed.\nMeta told the Reuters news agency that the technical issues cited in the report were already public and the conversations it referenced related solely to the severity of the issues, not political interference.\n“Any suggestion that Meta favors one side is false,” it added in a statement.\nLula, the left-wing incumbent, will face right-wing challenger Bolsonaro in a presidential runoff on October 25, following a stronger-than-expected performance by the senator in the first-round vote earlier this month.\nFriday’s report came on the heels of a Brazilian court ruling on Thursday that ordered Meta to immediately adopt measures to provide equal treatment of the two candidates ahead of the runoff.\nThe ruling by a judge in Brazil’s top electoral court was made shortly after Lula filed a complaint that accused the tech giant – which owns Instagram, Facebook and WhatsApp – of using biased algorithms and AI restrictions to favour opposition candidate Bolsonaro ahead of the election.\nJustice Marco Aurelio Bellizze ruled that Meta cannot reduce the distribution of political content, restrict searches or remove po
