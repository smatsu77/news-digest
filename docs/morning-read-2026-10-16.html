sts in a way that creates an imbalance between Lula and Bolsonaro. His ruling also orders the company to ensure its artificial intelligence tool applies identical criteria to both candidacies.\nBellizze said in his ruling that Meta must pay a fine of 500,000 reais ($98,700) per day if it fails to comply.\nAccording to Lula’s party, some of his posts appeared without a share button and had reduced reach. Options for reactions, sharing, audio or accelerated speed were also missing.", "translation_ja": "", "vocab": [{"word": "incumbent", "definition": "現職の、在職中の。政治的文脈では、現在その職務についている人物を指す。"}, {"word": "algorithm", "definition": "アルゴリズム、計算手順。コンピュータやプログラムが問題を解くために使用する論理的手順のこと。"}, {"word": "compliance", "definition": "遵守、従順。法律や規則、命令に従うこと、または従う行為そのもの。"}, {"word": "imbalance", "definition": "不均衡、バランスの欠如。二つ以上のもの間に平等性や公平性が欠けている状態。"}, {"word": "biased", "definition": "偏った、先入観を持った。一方的な見方や不公正な判断を示すこと。"}]}, {"title_ja": "White House Press Secretary Katie Zacharia ‘let go’ just days into role", "title_en": "White House Press Secretary Katie Zacharia ‘let go’ just days into role", "summary_ja": "Donald Trump said he had told her to reconsider the job following public scrutiny", "summary_en": "Donald Trump said he had told her to reconsider the job following public scrutiny", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/white-house-press-secretary-katie-zacharia-let-go-just-days-into-role/article71594137.ece", "state_media": false, "category": "社会", "full_text": "White House Press Secretary Katie Zacharia was “let go” from the role, a White House official said on Friday (October 16, 2026), after U.S. President Donald Trump said he had told her to reconsider the job following public scrutiny.\n“I told her: ‘I think you’re better off being happy, and I’m not sure you can ever be happy in this stuff.’ There’s nothing easy about this stuff,” Mr. Trump told reporters while departing the White House.\nHe added: “I said to her honestly, ‘If I were you, I’d reconsider... think about it. But I would reconsider.’”\nFox News, citing a White House official, later reported that Ms. Zacharia was “transitioning” out of the role of press secretary.\nMs. Zacharia started the job on Monday and held her debut White House briefing on Tuesday.\nShe had said she received a call about the role of press secretary last Wednesday and got offered the job to succeed Karoline Leavitt last Friday.\nMr. Trump later announced her appointment. In his announcement, he described her an attorney.\nOver the last week, the question of whether Ms. Zacharia, a graduate of Pepperdine University Law School, had actually passed the bar — making her an attorney — came under fire.\nOn Friday, during a Fox News interview on Thursday, Ms. Zacharia said she did not pass the bar. Anthony Scaramucci served director of communications for 10 days during Trump’s first administration.\nPublished - October 17, 2026 12:13 am IST", "translation_ja": "", "vocab": [{"word": "scrutiny", "definition": "厳しい検査や調査のこと。ここでは、公開の場での厳しい批判や注視を意味します。"}, {"word": "transitioning", "definition": "移行や変更の過程を示す表現。職を離れる際に、その過程や移行を指します。"}, {"word": "debut", "definition": "初めての公式な出演や登場のこと。ここでは、ブリーフィングの初めての開催を意味します。"}, {"word": "appointed", "definition": "正式に職位や役職に任命されることを示します。公式な決定による就任を表現します。"}, {"word": "administration", "definition": "政府や行政機関、または経営陣の総称。ここではトランプ前政権の時期を指しています。"}]}, {"title_ja": "U.S. midterms — Donald Trump’s test, India’s stakes", "title_en": "U.S. midterms — Donald Trump’s test, India’s stakes", "summary_ja": "The midterm elections will test the U.S. President’s leadership, congressional control and the future of India relations", "summary_en": "The midterm elections will test the U.S. President’s leadership, congressional control and the future of India relations", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/op-ed/us-midterms-donald-trumps-test-indias-stakes/article71593689.ece", "state_media": false, "category": "政治", "full_text": "With less than three weeks to go before Americans vote in the midterm elections on November 3, 2026; the polls are so called because they fall midway through a President’s four-year term. The President is not on the ballot. Unlike India’s Election Commission, the United States’ federal Election Assistance Commission does not run elections, and voter registration, voting and counting are managed primarily by state and local authorities under a decentralised system. Each State has its own rules, and thousands of counties and towns print ballots, establish polling centres and count votes. Many Americans vote early, by post or in person, and counting can take days.\nVoters will choose the Congress that shapes the President’s last two years. All 435 seats in the House of Representatives are due for election, since members serve two-year terms. In the Senate, where members serve six years, 35 of the 100 seats are up for election, including special elections in Ohio and Florida. Republicans hold a narrow majority in the House, where 218 seats are needed for control, and 53 seats in the Senate, so the Democrats need a net gain of four. Voters in States, including California, Texas and Florida, will also elect 39 Governors. Those elected now will be in office for the 2028 presidential election, and many will sign off on its results.\nOn the forecasts\nThe forecasts favour the Democrats in the House, where the Cook Political Report expects them to gain between five and 15 seats. The Senate is closer, with Democrats narrowly ahead in Texas, Iowa and Michigan.\nIndian readers would closely follow the race for Ohio Governor. Vivek Ramaswamy, who sought the Republican presidential nomination in 2024, would be the State’s first Indian-American Governor. He now trails the Democrat, Amy Acton, a former State Health director, by six points in one recent poll and nine in another. A poor national mood for Republicans explains much of this.\nHis campaign has also faced open hostility towards his Indian heritage and Hindu faith, from a primary rival and online — part of a wider rise in anti-Indian rhetoric on the American right since the H-1B debate.\nMidterms usually serve as a verdict on the President, and the President’s party usually loses seats. In this case, President Donald Trump has made this election about himself, even if many Republican candidates would have preferred otherwise. In September, the Republicans held their first-ever midterm convention, in Dallas, built around Mr. Trump. He is now on a rally tour of at least 17 States, telling supporters to “pretend I’m on the ballot”. His approval stands at about 30%, and registered voters prefer the Democrats for Congress by around eight points.\nThe key issues\nFive issues dominate. The first is the cost of living, as groceries, housing and fuel grow dearer and tariffs push prices up. The second is the war with Iran, launched with Israel in late February 2026, which is unpopular and has made fuel costlier. The third is immigration, where large deportation raids have cost the Republicans their old advantage. The fourth is health care, where cuts to Medicaid, the public insurance programme for low-income Americans, are among the administration’s least popular measures. The fifth, crime in America’s cities, is the Republicans’ strongest card, and the issue on which Mr. Trump polls best.\nThe campaign is also shadowed by fears about the vote itself. Mr. Trump has pushed for proof of citizenship to register, pressed Republican States to redraw their congressional maps in mid-decade, and called on Republicans to “take over” voting in some places.\nHe has not ruled out sending immigration agents or the National Guard to polling stations. Federal law bars armed agents from polling places, and officials say immigration agents will not patrol them, but the threat alone may keep some voters at home. Asked whether he would accept a defeat, Mr. Trump said he would, if the elections are honest.\nImpact on India\nFor India, the election comes at a difficult moment. U.S. tariffs on Indian goods rose to 50% in 2025 before a February framework cut them to 18%, and the interim deal is still unsigned. On September 18, Mr. Trump signed a law allowing tariffs of up to 100% on the largest buyers of Russian energy, including India, with 58 House Democrats voting for it. The $1,00,000 fee on new H-1B visas and Washington’s warmth towards Pakistan add to the strain.\nA recent study by the Takshashila Institution, based on 42 interviews in Washington, found that support for India in Congress is wide but shallow. Groups opposed to cheap imports, skilled migration, and Russian oil money are smaller, but they care more, and they vote. India had friends rather than costs: many members liked India but no member paid a price for harming it.\nA Democratic House could ease the treatment of Indian students and workers and press to end a war that has raised India’s oil bill. It is unlikely to change the tariffs or the ", "translation_ja": "", "vocab": [{"word": "decentralised", "definition": "権力や責任が中央から地方に分散されている状態。アメリカの選挙制度では、連邦政府ではなく州や地域が選挙を管理する仕組みを指す。"}, {"word": "incumbent", "definition": "現在その職にある人、現職者。文脈によっては、地位や権力を保持している状態を表す。"}, {"word": "rhetoric", "definition": "説得力のある言語表現や演説技法。ここでは政治的な主張や発言パターンを指す。"}, {"word": "mandate", "definition": "選挙などによって与えられた権限や使命。政党や候補者が得た支持に基づく行動の正当性。"}, {"word": "incumbent", "definition": "現職の、現在その地位にある。政治選挙で現在の職務にある者を指す用語として頻出する。"}]}, {"title_ja": "China says ready to address each other’s concerns after FM Sitharaman flags trade barriers", "title_en": "China says ready to address each other’s concerns after FM Sitharaman flags trade barriers", "summary_ja": "Reacting to India’s trade deficit with China crossing $100 billion in the first nine months, Nirmala Sitharaman said the growing trade imbalance and persistent restrictions on market access for Indian products remained major concerns, despite years of engagement with Beijing", "summary_en": "Reacting to India’s trade deficit with China crossing $100 billion in the first nine months, Nirmala Sitharaman said the growing trade imbalance and persistent restrictions on market access for Indian products remained major concerns, despite years of engagement with Beijing", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/china-says-ready-to-address-each-others-concerns-after-fm-sitharaman-flags-trade-barriers/article71593446.ece", "state_media": false, "category": "経済", "full_text": "China on Friday (October 16, 2026) said it was ready to work with India to address “each other’s” economic and trade concerns after Finance Minister Nirmala Sitharaman criticised Beijing’s restrictions on market access for the country's products.\n“What I can tell you is that China never aims for trade surplus”, Chinese Foreign Ministry spokesperson Mao Ning told a media briefing, replying to a question on Ms. Sitharaman’s comments reiterating China’s stand on India’s concerns over the trade deficit.\n“We stand ready to work with India to address each other’s economic and trade concerns in a balanced way and promote the steady development of bilateral relations”, she said, stating that the question is to be addressed to relevant Chinese authorities.\nReacting to India’s trade deficit with China crossing $100 billion in the first nine months, Ms. Sitharaman on Friday (October 16, 2026) said the growing trade imbalance and persistent restrictions on market access for Indian products remained major concerns, despite years of engagement with Beijing.\nIndia has consistently sought market access in China for products such as generic medicines, bovine meat, vegetables and other perishable goods, but made little progress despite years of engagement, Ms. Sitharaman said in an interaction with the Atlantic Council on the sidelines of the IMF-World Bank annual meetings in Bangkok, Thailand.\n\"Non-tariff barriers are the biggest hurdle in the trade between India and China,\" she said, adding that China had used phytosanitary measures and other non-tariff restrictions despite the potential for discussions and investigations to resolve such issues. She said India had not adopted the approach of imposing punitive tariffs on trading partners to correct large trade imbalances, preferring instead to pursue negotiations, even if the process was time-consuming.\nMs. Sitharaman was reacting to nine-month trade data released by China Customs on Wednesday (October 14, 2026), revealing India’s trade deficit with China widened to $105.93 billion, which is a 20.7% increase compared to last year.\nThe total bilateral trade grew to $144.45 billion, registering 25.4%, according to the data for January to September released by China Customs.\nChina’s exports to India touched $125.19 billion, registering a 23.3% increase.\nIndian exports to China too continue to grow, touching $19.26 billion, registering a 40.7% increase compared to the same period last year.\nPublished - October 16, 2026 11:11 pm IST", "translation_ja": "", "vocab": [{"word": "phytosanitary", "definition": "植物の健康と安全に関する措置のこと。輸入品が病害虫や病気を持たないことを確認するための規制を指す。"}, {"word": "non-tariff barriers", "definition": "関税以外の貿易障壁のこと。規制や基準などを利用して輸入品の流入を制限する手段。"}, {"word": "bilateral relations", "definition": "二国間の関係のこと。特に政治・経済・外交における国家間の相互関係を指す。"}, {"word": "punitive tariffs", "definition": "懲罰的な関税のこと。不公正な貿易慣行に対する報復手段として課される高い関税。"}, {"word": "trade imbalance", "definition": "貿易収支の不均衡のこと。ある国の輸出額と輸入額の差が大きく異なる状態を指す。"}]}, {"title_ja": "Ontario government hid study on rates of problem gambling, internal documents reveal - Toronto Star", "title_en": "Ontario government hid study on rates of problem gambling, internal documents reveal - Toronto Star", "summary_ja": "Ontario government hid study on rates of problem gambling, internal documents reveal Toronto Star", "summary_en": "Ontario government hid study on rates of problem gambling, internal documents reveal Toronto transferring him to the EFCC.\nFaisal had been on the run since 2020 after he was arraigned by the EFCC on a three-count charge bordering on money laundering. Although he was granted bail, he allegedly breached his bail conditions and fled the country.\nBoth the media unit of the SSS and the spokesperson for the EFCC have not responded to PREMIUM TIMES’ requests for comments about the matter.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nPREMIUM TIMES will provide more updates in subsequent reports.\nBackground\nFaisal’s trial continued in his absence, culminating in his conviction by the Federal High Court in Abuja in October 2021. He was sentenced to 14 years’ imprisonment on money laundering charges.\nThe trial judge, Okong Abang, held that the EFCC had established that Faisal operated a fictitious account with United Bank for Africa (UBA), through which his father allegedly laundered N58.1 million.\nALSO READ: Maina’s son, Faisal, has fled to U.S., EFCC tells court\nAccording to the court, the funds were deposited into an account operated in the name of “Alhaji Faisal Farm 2” and subsequently withdrawn by Faisal and his father between October 2013 and June 2019.\nIn November 2022, the Court of Appeal upheld Faisal’s conviction but reduced his sentence from 14 years to seven years. The appellate court held that the trial court should not have imposed the maximum sentence on a first-time offender.\nHis father, Mr Maina, served an eight-year prison sentence at the Kuje Correctional Centre in Abuja for laundering N2 billion in pension funds.\nHe was released earlier this year, but has since been declared wanted over an alleged case of receiving stolen property.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "fugitive", "definition": "逃亡中の人、または逃げている状態。法執行機関から逃げている犯罪者を指す。"}, {"word": "arraigned", "definition": "法廷に出廷させられた、または起訴された。刑事裁判の手続きで被告人が正式に起訴されることを意味する。"}, {"word": "breach", "definition": "契約や合意の条件を破る、または違反する。法的な義務や約束を守らないこと。"}, {"word": "conviction", "definition": "有罪判決、または有罪と認定されること。裁判所が被告人が有罪であると判断する法的な結果。"}, {"word": "appellate", "definition": "上訴に関する、または上級裁判所での審査に関する。下級裁判所の判決を再審査する裁判所の機能を指す。"}]}, {"title_ja": "NSIB kicks off probe into aircraft door loss incident", "title_en": "NSIB kicks off probe into aircraft door loss incident", "summary_ja": "In a statement issued on Friday and signed by its director-general and CEO, Alex Badeh Jr., the NSIB said the missing door has been recovered and secured at its wreckage hangar. The post NSIB kicks off probe into aircraft door loss incident appeared first on Premium Times Nigeria .", "summary_en": "In a statement issued on Friday and signed by its director-general and CEO, Alex Badeh Jr., the NSIB said the missing door has been recovered and secured at its wreckage hangar. The post NSIB kicks off probe into aircraft door loss incident appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/917686-nsib-kicks-off-probe-into-aircraft-door-loss-incident.html", "state_media": false, "category": "社会", "full_text": "The Nigerian Safety Investigation Bureau (NSIB) has begun an investigation into an incident involving a foreign-registered aircraft operated by Triton Aviation after the airline’s crew reported that a door of the aircraft opened mid-air shortly after taking off from Abuja on Thursday.\nThe Challenger 604 aircraft, with registration number T7-SEI, departed the Nnamdi Azikiwe International Airport on Thursday for Lagos.\nIt was about three nautical miles from the airport, climbing through 3,500 feet, when its crew declared a Mayday emergency, according to the NSIB.\nThe aircraft returned to Abuja and landed safely on Runway 22 at 16:34 Coordinated Universal Time (UTC), with nine people on board, comprising three crew members and six passengers.\nIn a statement issued Friday and signed by its director-general and CEO, Alex Badeh Jr., the NSIB said it recovered the missing door and secured it at its wreckage hangar.\n“The bureau has commenced its investigation to establish the circumstances surrounding the occurrence,” the statement said.\nPREMIUM TIMES earlier reported that the aircraft’s crew declared a Mayday emergency after reporting that a door had opened during flight shortly after take-off.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAirport fire, rescue personnel and medical teams were placed on standby while air traffic controllers directed the aircraft back to Abuja.\nThe aircraft landed safely, and the air traffic controller subsequently observed that the door was missing from the fuselage.\nA video circulating on social media also appears to show the missing door. In the footage, an unidentified man said farmers had found the object while returning from their farm in the Abuja area.\nThe NSIB said its investigation will establish the circumstances surrounding the incident, including what caused the door to detach and the sequence of events during the flight.\nThe aircraft is registered in San Marino, a small European country surrounded by Italy, according to the NSIB statement.\nThe bureau said it will provide further updates as the investigation progresses.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "fuselage", "definition": "航空機の胴体部分を指す。翼やエンジンを除いた主要構造体のこと。"}, {"word": "detach", "definition": "何かから分離する、切り離すという意味。ここでは飛行中にドアが機体から外れた状況を表している。"}, {"word": "Mayday", "definition": "航空機や船舶が極度の危険に直面した際に発する国際的な遭難信号。最高レベルの緊急事態を示す。"}, {"word": "wreckage", "definition": "破壊された物体や機械の残骸。ここでは航空機の部品を保管する格納庫を指している。"}, {"word": "commence", "definition": "公式に何かを始める、開始するという意味。ビジネスや法的文脈でよく使用される形式的な表現。"}]}, {"title_ja": "Ebola: Kenya records third case, continues contact tracing", "title_en": "Ebola: Kenya records third case, continues contact tracing", "summary_ja": "The latest case involves a 65-year-old woman who tested positive while in quarantine, as Kenyan authorities continue contact tracing and report no evidence of community transmission. The post Ebola: Kenya records third case, continues contact tracing appeared first on Premium Times Nigeria .", "summary_en": "The latest case involves a 65-year-old woman who tested positive while in quarantine, as Kenyan authorities continue contact tracing and report no evidence of community transmission. The post Ebola: Kenya records third case, continues contact tracing appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/917681-ebola-kenya-records-third-case-continues-contact-tracing.html", "state_media": false, "category": "社会", "full_text": "Kenya has confirmed a third case of Ebola after a 65-year-old woman tested positive while in quarantine.\nThe woman is a close relative of Kenya’s first confirmed patient, a 40-year-old who died from Ebola on 5 October, two days after arriving in Kenya from the Democratic Republic of the Congo (DRC).\nThe Associated Press (AP) reported that the woman had been in quarantine since 6 October and developed symptoms before testing positive. She has since been transferred to an infectious disease unit for treatment.\nThe second patient, a 39-year-old man from the same family, remains stable, according to Kenya’s Ministry of Health.\nThe ministry said there was no evidence of community transmission, as all three cases were linked to the first patient and the individuals had been in quarantine.\nNigeria’s preparedness\nThe development comes as Nigeria continues to monitor the regional outbreak and strengthen preparedness against possible importation of the virus.\nPREMIUM TIMES reported on 7 October that the Nigeria Centre for Disease Control and Prevention (NCDC) was reviewing the country’s preparedness after Kenya confirmed its first imported case of the Bundibugyo strain of Ebola.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nIn a statement issued on 6 October, the NCDC said the case highlighted the risk of international importation through travel and population movement, including the possibility of the virus entering Nigeria.\nThe agency said it was working with the Federal Ministry of Health and Social Welfare, Port Health Services, state governments and other partners to strengthen surveillance, early detection, laboratory diagnosis, isolation, contact tracing and infection prevention.\nIt also said Nigeria conducted a national Ebola preparedness simulation exercise to assess its readiness to respond to a possible case.\nAs of 6 October, the NCDC said Nigeria had no confirmed Ebola case.\nContact tracing continues\nKenya’s first case involved a 40-year-old man who had been living in the DRC and travelled through Uganda before arriving in Nairobi. He tested positive for Ebola and died on 5 October.\nThe confirmation of a second case on 14 October raised concerns about further infections among people exposed to the initial patient.\nPREMIUM TIMES reported on 14 October that the second patient, a 39-year-old close relative of the first case, developed symptoms while in quarantine.\nAt the time, Kenyan authorities had identified 128 contacts linked to the first patient, with 113 located and efforts ongoing to trace the remaining 15.\nIn its report on Friday, AP said three contacts of the initial patient remained unaccounted for, while authorities continued efforts to trace people who might have been exposed.\nThe latest case brings the number of confirmed Ebola infections in Kenya to three.\nRegional outbreak\nThe cases in Kenya are linked to the ongoing Ebola outbreak in the DRC, where the Bundibugyo virus has caused thousands of infections and deaths.\nThe World Health Organisation (WHO) said the DRC had recorded 7,890 confirmed cases and 3,799 deaths as of 23 September.\nThe outbreak has raised concerns about cross-border transmission, particularly as people travel between affected areas and neighbouring countries.\nThe Bundibugyo virus is a distinct species of Ebola virus. No vaccine or treatment has been specifically approved for this strain.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "quarantine", "definition": "感染症の可能性がある人や物を隔離する状態のこと。医学用語として、病気の拡大を防ぐために特定期間隔離することを指す。"}, {"word": "importation", "definition": "病気やウイルスが他国から持ち込まれること。特に感染症が国境を越えて伝わることを示す公式用語。"}, {"word": "surveillance", "definition": "疾病や感染症の発生を監視・追跡すること。公衆衛生分野で継続的に情報を集める活動を意味する。"}, {"word": "preparedness", "definition": "将来の危機や感染症の発生に備えた準備状態のこと。予防策や対応体制の整備程度を表す。"}, {"word": "transmission", "definition": "病気や感染症が人から人へ、または環境を通じて広がること。感染の拡大経路を指す医学用語。"}]}, {"title_ja": "The Arab Kingmaker in Israel’s Election Who Wants a Partnership With Jews", "title_en": "The Arab Kingmaker in Israel’s Election Who Wants a Partnership With Jews", "summary_ja": "Mansour Abbas, a dentist-turned-lawmaker, helped oust Benjamin Netanyahu once before. Now, he and a Jewish ex-police commander have teamed up to try to do it again.", "summary_en": "Mansour Abbas, a dentist-turned-lawmaker, helped oust Benjamin Netanyahu once before. Now, he and a Jewish ex-police commander have teamed up to try to do it again.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/16/world/middleeast/israel-mansour-abbas.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "The Rupturing Trump-Zelensk o Trump he slow down Starlink in Ukraine — Daily Telegraph", "title_en": "Musk suggested to Trump he slow down Starlink in Ukraine — Daily Telegraph", "summary_ja": "According to the news agency, the US President agreed to Elon Musk's proposal", "summary_en": "According to the news agency, the US President agreed to Elon Musk's proposal", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2203387", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "North Korea tests latest torpedo using AI — KCNA", "title_en": "North Korea tests latest torpedo using AI — KCNA", "summary_ja": "According to scientists, AI was integrated into the control and target-seeking system", "summary_en": "According to scientists, AI was integrated into the control and target-seeking system", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2203385", "state_media": true, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "US not to supply Ukraine with weapons at expense of its own security — columnist", "title_en": "US not to supply Ukraine with weapons at expense of its own security — columnist", "summary_ja": "Jude Russo pointed out that a war with Iran \"will always tend to demand more attention and resources than the proxy conflict in Europe", "summary_en": "Jude Russo pointed out that a war with Iran \"will always tend to demand more attention and resources than the proxy conflict in Europe", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2203381", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "A Global Euro Must First Win Over Europe", "title_en": "A Global Euro Must First Win Over Europe", "summary_ja": "In a world of competing currency blocs, the euro is the dollar’s most credible rival. But for it to become a genuine counterweight to the greenback, the European Union must strengthen its financial foundations and expand its reach, starting with the member states that have not adopted it despite bei", "summary_en": "In a world of competing currency blocs, the euro is the dollar’s most credible rival. But for it to become a genuine counterweight to the greenback, the European Union must strengthen its financial foundations and expand its reach, starting with the member states that have not adopted it despite bei", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/euro-cannot-realize-full-potential-without-bringing-in-remaining-eu-holdouts-by-piroska-nagy-mohacsi-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Global Euro Must First Win Over Europe\nIn a world of competing currency blocs, the euro is the dollar’s most credible rival. But for it to become a genuine counterweight to the greenback, the European Union must strengthen its financial foundations and expand its reach, starting with the member states that have not adopted it despite being obliged to do so.\nLONDON—As the global monetary order becomes increasingly fragmented, the European Union has a rare opportunity to shape the emerging system and bolster the euro’s international role. But for the euro to become genuinely global, it must first become more European.", "translation_ja": "", "vocab": [{"word": "credible", "definition": "信頼できる、信憑性のある。ここでは、ユーロがドルの対抗馬として十分な信頼性と説得力を持っていることを表現している。"}, {"word": "counterweight", "definition": "釣り合いを取るもの、均衡を保つための重し。経済用語として、ドルの支配に対抗する勢力や通貨を意味する。"}, {"word": "fragmented", "definition": "断片化した、分裂した。ここでは世界の金融秩序が複数の通貨圏に分かれていることを表現している。"}, {"word": "bolster", "definition": "強化する、支援する。政策や立場を強めるために努力することを意味し、ビジネス文脈で頻出。"}, {"word": "monetary order", "definition": "通貨制度、金銭的秩序。国際的な経済システムにおける通貨と金融の仕組みや階層構造を指す。"}]}, {"title_ja": "Japan Needs Higher Interest Rates", "title_en": "Japan Needs Higher Interest Rates", "summary_ja": "In 2012, when Japan was dealing with chronic deflation, policymakers were right to embrace monetary easing, including lower interest rates. Today, however, Japan faces the opposite problem: a weak yen, combined with higher interest rates in the US, calls for a much tighter monetary policy.", "summary_en": "In 2012, when Japan was dealing with chronic deflation, policymakers were right to embrace monetary easing, including lower interest rates. Today, however, Japan faces the opposite problem: a weak yen, combined with higher interest rates in the US, calls for a much tighter monetary policy.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/bank-of-japan-should-raise-interest-rates-and-reduce-the-money-supply-to-combat-inflation-by-koichi-hamada-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Japan Needs Higher Interest Rates\nIn 2012, when Japan was dealing with chronic deflation, policymakers were right to embrace monetary easing, including lower interest rates. Today, however, Japan faces the opposite problem: a weak yen, combined with higher interest rates in the US, calls for a much tighter monetary policy.\nNEW HAVEN—On a recent visit to Sapporo, the city on Japan’s northern island where my parents came from, my wife and I found gentle people, mild autumn days, and excellent food. As tourists who live and work in the United States, we also enjoyed very low prices: lunch at a high-quality restaurant cost only about $20 per person. While that was convenient for us, like so many other tourists who have headed to Japan to take advantage of favorable exchange rates, the cheap yen (yen yasu) has been hard on Japan’s economy.", "translation_ja": "", "vocab": [{"word": "chronic", "definition": "慢性的な、長期間続く状態。医学用語としても経済用語としても使われ、一時的ではなく継続的な問題を指す。"}, {"word": "embrace", "definition": "～を受け入れる、採用する。政策や考え方などを積極的に取り入れることを意味する。"}, {"word": "easing", "definition": "緩和、軽減。特に金融用語で金銭供給量を増やしたり金利を下げたりする政策を指す。"}, {"word": "tighter", "definition": "より厳格な、より制限的な。金融政策文脈では通貨供給を制限し金利を上げる政策を意味する。"}, {"word": "favorable", "definition": "有利な、好ましい。特定の立場や利益にとって都合の良い状況や条件を表す。"}]}, {"title_ja": "A Middle-Powers Grand Strategy to Prevent Atrocities", "title_en": "A Middle-Powers Grand Strategy to Prevent Atrocities", "summary_ja": "Many governments have leverage to prevent atrocity crimes, yet lack the machinery to turn warnings into consistent, accountable action before it is too late. Now that three of the five permanent members of the Security Council are undercutting the postwar legal order, middle powers most close the ga", "summary_en": "Many governments have leverage to prevent atrocity crimes, yet lack the machinery to turn warnings into consistent, accountable action before it is too late. Now that three of the five permanent members of the Security Council are undercutting the postwar legal order, middle powers most close the ga", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/atrocity-prevention-middle-powers-need-stronger-processes-by-aarif-abraham-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Middle-Powers Grand Strategy to Prevent Atrocities\nMany governments have leverage to prevent atrocity crimes, yet lack the machinery to turn warnings into consistent, accountable action before it is too late. Now that three of the five permanent members of the Security Council are undercutting the postwar legal order, middle powers most close the gap.\nLONDON—“Never again” to genocide is one of the international community’s most brittle postwar promises, often invoked only after the killing has begun. Yet mass atrocities seldom arrive without warning. Attacks on the rule of law, discrimination, dehumanization, and impunity for earlier crimes are familiar, easily discernible precursors.", "translation_ja": "", "vocab": [{"word": "leverage", "definition": "影響力や交渉力。特定の目的を達成するために使用できる力や手段を指し、ビジネスや政治交渉の文脈でよく使われます。"}, {"word": "machinery", "definition": "機構や仕組み。物理的な機械ではなく、組織や制度といった抽象的なシステムを意味する比喩的な表現です。"}, {"word": "brittle", "definition": "もろい、脆い。物質的なもろさだけでなく、約束や関係が不安定で壊れやすい状態を表します。"}, {"word": "precursors", "definition": "前兆、先触れ。ある出来事が起こる前に現れる兆候や警告信号を意味します。"}, {"word": "impunity", "definition": "罰せられない状態、不処罰。犯罪や違法行為を行っても法的な責任を問われないことを指します。"}]}, {"title_ja": "Of course Trump is helping Russia in Ukraine – he’s a master of the art of betrayal | Jonathan Freedland", "title_en": "Of course Trump is helping Russia in Ukraine – he’s a master of the art of betrayal | Jonathan Freedland", "summary_ja": "The old certainties have gone. We will have to spend whatever it takes to protect ourselves in this new and dangerous world Donald Trump must find it oddly frustrating. He keeps showing the world exactly who he is, and yet the world keeps refusing to believe it. As clearly as he can, he is announcin", "summary_en": "The old certainties have gone. We will have to spend whatever it takes to protect ourselves in this new and dangerous world Donald Trump must find it oddly frustrating. He keeps showing the world exactly who he is, and yet the world keeps refusing to believe it. As clearly as he can, he is announcin", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/16/donald-trump-russia-ukraine-protect-world", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump must find it oddly frustrating. He keeps showing the world exactly who he is, and yet the world keeps refusing to believe it. As clearly as he can, he is announcing that he is not the leader of the free world, that he is not even a reliable member of the democratic west, that he is in fact an ally of its enemies – but the west, including Britain, either doesn’t fully get the message or can’t quite bring itself to draw the obvious conclusion.\nTrump had another go this week, finding multiple ways to declare that in the war between Russia and Ukraine, he is no mediator or peace broker but a partner of Vladimir Putin. In fairness to him, the US president had loudly issued that declaration within weeks of his return to the White House when, in February 2025, he delivered an on-camera dressing down of Volodymyr Zelenskyy in the Oval Office, seeking to humiliate the Ukrainian leader by telling him “you don’t have the cards”, even as JD Vance demanded their visitor show gratitude. That should have made Trump’s position sufficiently plain, but in the past few days he has all but put it up in lights.\nEarlier this week Ukrainian forces found that an essential piece of kit – a version of Elon Musk’s Starlink system used by Kyiv to guide its drones – was no longer working at speeds greater than 100mph. That meant not only a sudden shrinking of Ukraine’s ability to strike behind the frontlines, but also the hobbling of an air defence system vital in protecting the capital from Russian jet-propelled drones. This was no technical hitch. Starshield, the military-grade version of Starlink, is owned and controlled by the US government – and, as Reuters reported, the order to limit its use in Ukraine came from the White House. Put simply, Trump actively intervened in the war to weaken Ukraine’s ability to defend itself. “The decision will bring a lot of human losses,” Zelenskyy told Piers Morgan. “Of course, people will die.”\nTrump’s move was hardly a bolt from the blue. This same week, Ukraine endured at least two nights of Russian bombardment without the usual advance warnings from the US of when or where Moscow was about to strike. Trump denied that he had broken off long-established intelligence sharing with Kyiv, but that’s exactly what it looked like.\nAll this followed the US president’s decision to break the international sanctions regime on Moscow, by agreeing to buy $4bn worth of Russian diesel oil. That volume will barely make a splash in the US market, where high diesel prices are imperilling the Republicans’ midterm chances in several rural states that rely on the stuff, but it will come as a welcome cash infusion for Putin’s war machine. Just as Russia’s military position was looking precarious, Donald Trump has come riding to the rescue. Throw in the US invitation to Putin to attend December’s G20 meeting at one of Trump’s golf clubs in Florida, and you have a US president who might as well be skywriting his support for Russia and his betrayal of Ukraine.\nIn Trump’s first term, much energy was spent trying to work out what dark secret lay behind this apparent affinity with Moscow. I tend to the view advanced by my expert colleague Luke Harding, who, when asked if Trump is a tool of the Russian intelligence services, answers with a question of his own: if Trump were a Russian asset, in what way would he behave any differently from the way he behaves now?\nWhatever the motive, or whether, as Harding suggests, it’s some combination of greed, ideology, dictator envy and kompromat, the facts are unarguable. The most powerful member of the western alliance is, at best, an unreliable partner and, at worst, in league with the alliance’s chief enemy. Why this matters should not need spelling out, least of all in the week when the head of MI5 described Russia as “aggressor number one”. For years now, the Kremlin has demonstrated its willingness to attack Nato member states, usually in the form of hybrid or “grey zone” operations that are not overt acts of war but come instead with a patina of deniability. One study found that there have been than no fewer than “151 confirmed Russian-directed industrial sabotage incidents in Europe between February 2022 and February 2026”, while last weekend brought credible reports of a Russian intention to assassinate executives of key European defence firms.\nWhat should the US’s erstwhile allies do about this new reality? The first task is to keep supporting Ukraine, all the more energetically given that Washington has, in effect, switched sides. The second is to avoid an error that is looming. The midterm elections, which are little more than a fortnight away, are expected to deliver big gains for the Democrats and a big blow to Trump. If Democrats retake one or both houses of Congress, plenty of European leaders will be tempted to exhale deeply, conclude that the orange storm has passed and that normal transatlantic service is about to resume. That would be a grave mistake.", "translation_ja": "", "vocab": [{"word": "mediator", "definition": "紛争や対立を仲介する第三者。争っている両者の間に立って、合意や解決に導く人のこと。"}, {"word": "humiliate", "definition": "誰かを恥ずかしめる、屈辱を与える。相手の尊厳や名誉を傷つける行為を指す。"}, {"word": "hobbling", "definition": "何かの機能や能力を制限する、低下させる。自由な動きや活動を妨げる状態にすること。"}, {"word": "intervention", "definition": "事態に直接関わること、介入すること。特に外部から他者の問題や紛争に踏み込む行為を指す。"}, {"word": "sanctions regime", "definition": "複数の国が協力して行う経済制裁。特定の国家に対する貿易や金融取引を制限する国際的な仕組み。"}]}, {"title_ja": "Digested week: No Nobel again for Trump but he looks a cert to retain Fifa peace prize | John Crace", "title_en": "Digested week: No Nobel again for Trump but he looks a cert to retain Fifa peace prize | John Crace", "summary_ja": "With his war in Iran and siding with Russia, it’s hard to think of someone who has done more to make the world a safer place It might have been more, shall we say, diplomatic if Donald Trump had taken some deep breaths after finding out he had been overlooked for the Nobel peace prize for the second", "summary_en": "With his war in Iran and siding with Russia, it’s hard to think of someone who has done more to make the world a safer place It might have been more, shall we say, diplomatic if Donald Trump had taken some deep breaths after finding out he had been overlooked for the Nobel peace prize for the second", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/uk-news/2026/oct/16/digested-week-no-nobel-trump-fifa-peace-prize", "state_media": false, "category": "オピニオン", "full_text": "Monday\nIt might have been more, shall we say, diplomatic if Donald Trump had taken some deep breaths after finding out he had been overlooked for the Nobel peace prize for the second year running before virtually declaring war on Norway. But maybe we should just be grateful he refrained from rubbishing the South African human rights activist Navi Pillay, who picked up the award, and shelved his plans to livestream the execution of the Norwegian prize committee. There again, you can understand his frustration. It’s hard to think of someone who has done more to make the world a safer place. Where would we be had not The Donald started a war with Iran which he shows no sign of knowing how to finish and which has forced up the price of global energy? And it was so good to see him intervening so positively in Russia’s war with Ukraine by appearing to side with the aggressor. These are just the things everyone is looking for in a Nobel peace laureate. The president is also put out that no one has noticed he has personally ended eight global conflicts; though it would be helpful if he could let us know which ones. Are they ones he has personally started – Trump appears disappointed that Argentina hasn’t invaded the Falklands again – or ones that only he knows about. During a press conference at Chequers in 2025, he claimed to have brought about a lasting peace between Albania and Azerbaijan. Maybe there are other wars going on we just don’t know about. Perhaps Australia and New Zealand have been bombing each other for years with neither side noticing. And perhaps the border between France and Italy has been a no-go zone ever since the fight between Zinedine Zidane and Marco Materazzi in the 2006 World Cup final. Still, Trump looks a cert to retain Gianni Infantino’s Fifa peace prize – if only because it seems likely to be scrapped, making him the only winner.\nTuesday\nWe may be facing higher levels of global threat and energy costs, but the political outlook isn’t all bleak. You’d need to have a major sense of humour failure not to be enjoying Reform sliding in the polls and falling out with one another. Things seemed to start going wrong when the Guardian exposed Nigel Farage’s £5m bung from the Thai-based crypto-billionaire Christopher Harborne. Nige has still not come up with a convincing explanation of how the money would be spent. Other than maintaining an expensive lifestyle. Then there was the Channel 4 sting when two of Farage’s closest political allies were caught allegedly trying to take an illegal overseas donation. Nige’s excuse? He wasn’t listening to his conversation with the donor. Who hasn’t dozed off when there’s £500,000 at stake? Since then everyone in Reform appears hell-bent on being the worst versions of themselves as the party loses support by tacking ever further to the right. On Monday, Robert Jenrick declared he would personally be happy to give the order for the Royal Navy to blow every small boat crossing the Channel out of the water. This was too much for Zia Yusuf. Zia is widely loathed within the Reform elite but no one has found a way of saying no to his money, so he gets to call himself the bogus title of shadow home secretary. His main objection to Honest Bob’s plan is that he wasn’t the one to think of it first. Meanwhile, Nige just sits back and pockets the money. Seemingly unable to stop his party collapsing around him.\nWednesday\nAfter several years of consultation, the Bank of England has announced the four animals, insects and birds that will appear on the new banknotes. What goes on what denomination has yet to be decided, but the ones chosen are the European hedgehog, the barn owl, the buff-tailed bumblebee and the Atlantic puffin. And while I’d have quite liked to have seen my much-missed dog Herbie, who died last year, on one of the notes, they all seem reasonable choices to me. I guess the last thing the Bank wanted was to start a war between cat and dog lovers. But not everyone is happy. Partly because they are mad but mostly because they don’t apparently understand how the selection process worked. It was the public who got to choose both the theme of the banknotes and the actual creatures. Needless to say, leading the charge against the new notes are Kemi Badenoch and Nigel Farage, who see the hedgehog and the puffin as some kind of woke symbols. A country going to the barn owls and the bumblebees. They have moaned, what was wrong with having Winston Churchill? Are we now ashamed of our past? No, you halfwits. You don’t have to plaster Churchill’s face on everything to prove you are British. Most of us are secure enough in our identity not to need countless flags and symbols as a reminder. It’s just nice to have a change from time to time. And how many people used to see Churchill’s face on a £5 note and feel a well of pride every time you wanted to buy a sandwich? For that matter, how many people even use cash these days? Mind you, once AI has mined all our data from ", "translation_ja": "", "vocab": [{"word": "diplomatic", "definition": "外交的な、慎重で機転の利いた対応。政治的な場面で相手を傷つけないような配慮のある言動のこと。"}, {"word": "rubbishing", "definition": "~を酷評する、けなす。何かを否定的に批評したり非難したりする行為。"}, {"word": "laureate", "definition": "栄誉ある賞を受けた人、受賞者。特にノーベル賞受賞者などの権威的な受賞者を指す。"}, {"word": "cert", "definition": "確実なこと、間違いないこと。英国英語で「確実だ」という意味で使われる口語表現。"}, {"word": "bung", "definition": "賄賂、不正な金銭。政治腐敗に関連して、裏で支払われる違法な金銭のこと。"}]}, {"title_ja": "Trump should fear the BBC. Instead he’s picked a fight – and he seems to be losing | Emma Brockes", "title_en": "Trump should fear the BBC. Instead he’s picked a fight – and he seems to be losing | Emma Brockes", "summary_ja": "The president is used to bullying his media targets. The quagmire that is his libel actions shows the broadcaster is working to a different script For the greatest account of the BBC’s finest hour, one must turn to Penelope Fitzgerald’s novel, Human Voices, written in 1980 and set 40 years earlier, ", "summary_en": "The president is used to bullying his media targets. The quagmire that is his libel actions shows the broadcaster is working to a different script For the greatest account of the BBC’s finest hour, one must turn to Penelope Fitzgerald’s novel, Human Voices, written in 1980 and set 40 years earlier, ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/15/donald-trump-bbc-lawsuit-public-broadcaster-truth-power-noels-house-party", "state_media": false, "category": "オピニオン", "full_text": "For the greatest account of the BBC’s finest hour, one must turn to Penelope Fitzgerald’s novel, Human Voices, written in 1980 and set 40 years earlier, at the corporation’s Portland Place wartime HQ. Flanked by sandbags and infused with a smell of cooking “from the deep hold that suggested more strongly than ever a cruise on the Queen Mary”, the organisation that Fitzgerald describes is at once noble and deeply eccentric. “Broadcasting House stood headed on a fixed course south,” she writes. “With the best engineers in the world, and a crew varying between the intensely respectable and barely sane, it looked ready to scorn any disaster.”\nIn other words, a formidable foe, one that in the spring of 1940, in the face of anticipated Nazi invasion, decided “without prompting, that truth was more important than consolation, and, in the long run, would be more effective”. I bring this up in respect to the gathering storm of Donald Trump versus the BBC, a fight triggered by the US president’s $10bn defamation lawsuit – $10bn! It’s a wonder he didn’t go for $10 gazillion – brought against the corporation at the end of last year in response to a poorly edited episode of Panorama. The BBC was at fault, editing together comments made by the US president at a rally on 6 January 2021 to give, as the corporation’s apology put it, “the mistaken impression that President Trump had made a direct call for violent action”. But it is fighting the lawsuit.\nThis will have come as a surprise to the president, who in his own country has had great success frightening media companies into craven submission. This week, as news broke that the BBC has been cleared by a judge to serve legal papers on Trump’s children, while still seeking judicial intervention to force him to show up to his own deposition, the president must be wondering what’s going on. In August, Trump applied to the court to block the BBC from deposing Donald Trump Jr and Ivanka Trump, and yet … the corporation simply ignored him and ploughed on with its mission.\nWell. Welcome to the British Broadcasting Corporation, Mr President, let me give you a little insight into what you’re up against. There is no institutional power in the world to rival the BBC’s ability to drone on, a constant background hum for the nation. We all, at some level, consist of an interior mix-tape made up of Melvyn Bragg saying, “Hello. In the 13th century …” and Libby Purves opening an episode of Midweek with, “all my guests this week are time travellers, in a way”. The US president simply has no idea of the effect on this country’s nervous system of the opening bars of EastEnders, or a BBC newsreader interrupting normal programming with the line, “This is BBC television from London.”\nNor will he have encountered that very particular BBC mindset, which, unlike the workforce at Google, doesn’t run on can-do energy and corporate good cheer, but rather on toxic gas released by an underpaid, overworked labour force, seething with resentment and, as Fitzgerald put it, “bitterly loyal” to its employers – which, as it happens, is a very high standard of loyalty indeed. You don’t get that at Fox News.\nOr indeed at ABC News, which in December 2024, agreed to pay Trump $15m in an uncontested defamation suit. And while CNN, MS Now and Politico are all suing the White House for banning them, CBS rolled over like a dog, announcing it would be axing Stephen Colbert’s highly critical show days after settling another defamation suit with the president. Meanwhile the Federal Communications Commission, the regulatory body run by arch-conservative Brendan Carr, threatened to review the licences of misbehaving broadcasters. A day after the president called for Trump-mocking Jimmy Kimmel’s dismissal from his late night ABC show, Carr ordered an early licence review of all eight of Disney’s ABC television stations.\nThe BBC isn’t bound by these forces. There are financial pressures on it to settle, of course, but in public broadcasting money is never the be-all and end-all, and I would bet Trump has never come up against a force so stubborn, so irrational, so inexplicable to the American corporate or political mindset as his opponents at Langham Place. If the president prizes his own unpredictability as a key weapon in his arsenal, I’d like to introduce him to the people who brought us Noel’s House Party and Grandstand.\nYes, the BBC loves nothing more than to don a hair shirt and report on its own failings. Yes, it could do with relying a bit less on Clare Balding. And yes, the corporation is a lunatic in so many ways. But it’s our lunatic and if you come for it, you come for us all. In the BBC’s long history of standing up to tyranny, it has seen off bigger enemies than Trump. I would bet the Shipping Forecast it will come out victorious.\n- Emma Brockes is a Guardian columnist", "translation_ja": "", "vocab": [{"word": "formidable", "definition": "非常に強力で、対抗することが難しい。ビジネス文脈では、競争相手や困難な課題などを説明する際に使用される。"}, {"word": "craven", "definition": "臆病で、勇敢さに欠ける。特に政治的・職業的な文脈で、恐怖に屈する態度を表す。"}, {"word": "deposition", "definition": "法廷での証言。法的手続きで被告人や証人が宣誓の下で行う口述録取のこと。"}, {"word": "drone on", "definition": "退屈で単調な話し方で延々と話し続ける。または継続的に背景音として存在する。"}, {"word": "eccentric", "definition": "普通ではなく、常識的ではない。変わった特性や行動を持つ人や組織を表す。"}]}, {"title_ja": "The Axis of Upheaval Goes to War", "title_en": "The Axis of Upheaval Goes to War", "summary_ja": "Andrea Kendall-Taylor and Richard Fontaine, former members of the National Security Council, argue that the members of what they call the “axis of upheaval”—Russia, China, Iran, and North Korea—are deepening their cooperation. Meanwhile, Washington is creating friction with many of its own partnersh", "summary_en": "Andrea Kendall-Taylor and Richard Fontaine, former members of the National Security Council, argue that the members of what they call the “axis of upheaval”—Russia, China, Iran, and North Korea—are deepening their cooperation. Meanwhile, Washington is creating friction with many of its own partnersh", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/axis-upheaval-goes-war", "state_media": false, "category": "オピニオン", "full_text": "On July 17, an Iranian missile struck Muwaffaq Salti Air Base in Jordan, killing three American soldiers and wounding four others. The strike was unusually precise. In the weeks that followed, U.S. officials discovered that before the attack, Tehran had received high-resolution satellite images of the base that could aid its targeting. Afterward, Iran obtained more imagery, potentially helping it assess the damage and hone future attacks. The images came from Chinese entities.\nChina is not alone in assisting Iran. Russia, too, has helped Tehran find and hit American and allied targets. Two days before the March 27 attack on Prince Sultan Air Base in Saudi Arabia that wounded 12 American personnel, 14 Russian spy satellites passed overhead. U.S. officials later concluded that Moscow had fed Iran satellite intelligence that aided Iranian precision strikes. Moscow has also provided Iran with weapons and military expertise, including upgraded versions of Iranian drones refined on the battlefield in Ukraine, and Russian engineers are helping Iran develop supersonic cruise missiles that could evade U.S. and Israeli air defenses.\nNeither Russia nor China has directly entered Iran’s war with the United States. They haven’t needed to. By providing intelligence on American targets, military technology and components, and economic and diplomatic support, they can give Iran what it needs without joining its war.\nThe United States entered the conflict with advantages its adversaries lacked: a vast network of formal allies, military bases, intelligence-sharing arrangements, defense partnerships, and interoperable forces spanning Europe, the Middle East, and Asia. Yet many of Washington’s traditional partners were reluctant to associate themselves with the campaign, and some denied the United States specific forms of military access, at least for a time. Others publicly resisted U.S. calls to help secure the Strait of Hormuz.\nThe contrast illustrates a striking shift since we first described Russia, China, Iran, and North Korea as an axis of upheaval in Foreign Affairs two years ago. The United States’ adversaries began this war with this weaker network, and Washington with the far stronger one. But after helping Russia fight its war in Ukraine over the past few years, members of the axis are now finding ways to make their network work in a new theater. They are fine-tuning their cooperation to make their partners more resilient—and more dangerous to the United States—while limiting costs and risks. Washington, for its part, is creating friction in many of its partnerships instead of deepening them, and risks squandering its network just as its adversaries are learning to make more of theirs.\nSOURCES OF UPHEAVAL\nMuch has changed since 2024. Most obviously, the United States itself has become a source of upheaval in the international system. The Trump administration has challenged international institutions, strained traditional alliances, and adopted a more transactional approach to foreign policy. It has upended trade agreements, threatened the sovereignty of allies such as Canada and Denmark, and embraced unpredictability. It has also pursued improved relations with China, North Korea, and Russia while seeking to weaken Iran. None of this has loosened the ties among the United States’ adversaries.\nEarly in the Trump administration, U.S. officials expressed hope that normalizing relations with Moscow might peel Russia away from the group. Yet President Donald Trump’s oft-expressed bonhomie toward the Kremlin has opened no gaps with the other three. As seen from Moscow, the administration has been unable to deliver a deal on Ukraine, and any Trump-driven rapprochement with Washington is unlikely to endure: Congress continues to pressure Russia, and a future administration may well adopt a tougher approach.\nMore fundamentally, attempts to weaken the axis misunderstand what holds it together. Its members object to an international order that they see as enshrining Western dominance at their expense. But more pointedly, they oppose the United States’ extraordinary power to constrain, isolate, and punish them, and potentially to threaten their regimes. Recent U.S. actions have only rekindled those concerns. The United States’ capture of Venezuelan leader Nicolás Maduro and the killing of Iranian Supreme Leader Ali Khamenei reinforce long-standing fears in Beijing, Moscow, Pyongyang, and Tehran about U.S. intervention and regime security.\nThe axis countries may moderate their anti-American rhetoric when doing so is tactically useful, but their motivation to reduce their vulnerability to American power remains. The Trump administration’s own skepticism about international order will not ease minds in axis capitals. On the contrary, Trump’s efforts to create a more transactional and coercive world may increase the value of their partnerships. As rules and institutions constrain less and brute power matters more, countries will s", "translation_ja": "", "vocab": [{"word": "precision", "definition": "正確性、精密性。ここでは攻撃の的確さを指し、目標を正確に打撃する能力を意味している。"}, {"word": "hone", "definition": "研ぎ澄ます、改善する。元々は刃物を研ぐ意味だが、ここではスキルや戦術を磨いて向上させることを指している。"}, {"word": "interoperable", "definition": "相互運用可能な。異なるシステムやアクター間で円滑に連携・協働できる状態を示す専門用語。"}, {"word": "reluctant", "definition": "気が進まない、しぶしぶの。伝統的な同盟国がある行動や参加に対して進んで賛同しない様子を表している。"}, {"word": "resilient", "definition": "回復力がある、弾力的な。ここでは国家や連合体が困難に耐え、さらに強化される能力を意味している。"}]}, {"title_ja": "The Nuclear Deal That Could Save NATO", "title_en": "The Nuclear Deal That Could Save NATO", "summary_ja": "Former U.S. NATO ambassador Ivo Daalder argues that the scramble to shore up Europe's conventional defense risks overlooking the continent's greatest security weakness: nuclear deterrence. Europe knows it can't fully trust Washington's guarantee anymore. But he lays out a middle path between depende", "summary_en": "Former U.S. NATO ambassador Ivo Daalder argues that the scramble to shore up Europe's conventional defense risks overlooking the continent's greatest security weakness: nuclear deterrence. Europe knows it can't fully trust Washington's guarantee anymore. But he lays out a middle path between depende", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/nuclear-deal-could-save-nato", "state_media": false, "category": "オピニオン", "full_text": "At a meeting earlier this year, top foreign ministry officials from several European countries were asked who among them still believed that the United States would come to their defense if they were attacked. Not a single hand went up. It was a stark indication of the extent to which European governments have concluded that the United States—for so long the backbone of European and NATO security—is no longer a reliable ally. Over the past 18 months, conversations in Brussels and in other NATO capitals have revolved around how to boost the continent’s conventional defense to make up for Washington’s retrenchment. But a quieter and more urgent discussion is also taking place, focused on the status of the ultimate deterrent: the U.S. nuclear guarantee.\nMore than half a century ago, the Great Debate, as the French strategist Raymond Aron termed it, broke out between European countries and the United States over how to preserve European nuclear deterrence in the face of the Soviet Union’s expanding nuclear capabilities. Then, European leaders feared that Washington’s growing emphasis on the conventional defense of the continent reflected an increasing reluctance to protect Europe with nuclear weapons—especially as Moscow developed missiles that could reach the U.S. homeland. Would the United States be willing to risk Boston to defend Berlin? That debate was ultimately resolved through a new grand bargain: in return for a commitment from European countries to forgo developing nuclear weapons, the United States would invite more European participation in nuclear decision-making. That essential bargain stuck for 60 years, helping secure both the United States and Europe and preventing nuclear proliferation.\nNow, however, that bargain has come undone. Washington says that it wants a new division of labor: the Europeans need to take on primary responsibility for their conventional defense while the United States continues to ensure their nuclear defense. But that hardly addresses the problem. “If you don’t believe in the United States’ Article 5 commitment,” one of the officials attending the meeting told me, “then extended deterrence is effectively dead.” Already, alternative options are being considered. In some European capitals, officials are quietly raising the possibility of acquiring their own nuclear weapons. France, meanwhile, has offered to adapt its nuclear policy to help defend its European allies.\nEach of these options has real logic. But none of them adequately addresses the problem of ensuring European security without risking further proliferation. A better approach would be a fourth alternative: a renewed U.S.-European nuclear bargain, this time with a real European core. Led by France and the United Kingdom, NATO’s European members need to take on a larger role in their nuclear deterrence while working to restore the transatlantic defense link that has been the foundation of U.S. and European security for so many decades.\nFOUNDATION OF PEACE\nThe Soviet Union’s 1957 launch of the Sputnik satellite posed a profound dilemma for NATO. Until then, the alliance had counted on U.S. nuclear weapons deployed in Europe to deter an attack by a much larger Soviet conventional force. But once Moscow demonstrated its ability to launch intercontinental rockets, Europeans feared that the United States would no longer be willing to use nuclear weapons to prevent a Soviet invasion of Europe.\nThese concerns prompted a fierce debate within NATO about how the continent could ensure its nuclear defense. Some, led by France, were convinced that European countries needed their own nuclear weapons. Others sought less costly ways to restore some control over nuclear deterrence. One American idea that gained substantial traction was to create a so-called multilateral force—a fleet of vessels carrying some 200 missiles. Such a multilaterally operated and funded force could give Europeans a sense of ownership and control over the use of nuclear weapons, the thinking went, while preserving the U.S. president’s final authority over their launch.\nThe debate exposed a fundamental problem with extending U.S. nuclear deterrence to allies, especially if an ocean separates those allies from Washington. An adversary might be deterred from attacking an American ally by even the small possibility of a U.S. nuclear retaliation; the consequences of a miscalculation would be catastrophic. But that same small possibility would offer little comfort to the ally, who needs to believe that Washington would actually risk nuclear devastation on its behalf. Denis Healey, the United Kingdom’s defense secretary throughout much of the 1960s, postulated what became known as the Healey theorem: “It takes only a five percent credibility of American retaliation to deter an attack, but it takes a 95 percent credibility to reassure the allies.”\n The Sputnik launch posed a profound dilemma for NATO.\nThe debate was ultimately resolved through a bargain. Washi", "translation_ja": "", "vocab": [{"word": "retrenchment", "definition": "支出や活動の縮小、撤退。ここでは米国がヨーロッパへの防衛関与を減らしていることを指す。"}, {"word": "deterrent", "definition": "抑止力、防止手段。攻撃を思いとどまらせるための脅威や能力のこと。"}, {"word": "reluctance", "definition": "嫌がること、不本意。ここでは米国がヨーロッパを核兵器で守ることに消極的であることを表す。"}, {"word": "proliferation", "definition": "増殖、拡散。核兵器が複数の国に広がることを指す。"}, {"word": "undone", "definition": "無効になる、破棄される。長く続いていた協定や取り決めが終わることを意味する。"}]}, {"title_ja": "Ukraine Can Turn Imminent Peril to Its Advantage", "title_en": "Ukraine Can Turn Imminent Peril to Its Advantage", "summary_ja": "How a true “energy cease-Fire” can curb Putin.", "summary_en": "How a true “energy cease-Fire” can curb Putin.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/ukraine-can-turn-imminent-peril-its-advantage", "state_media": false, "category": "オピニオン", "full_text": "Ukraine is facing its most precarious moment since the early days of the war. Since late July, Russia has used its growing stockpile of ballistic missiles and a new generation of jet-powered drones to dramatically intensify its long-range attacks. It is now targeting Ukrainian population centers all over the country, with a focus on logistics, transportation, and commercial infrastructure. According to Ukrainian intelligence reports, the Russian government is planning an even more intense campaign against energy and water supplies this winter in an attempt to decisively break Ukraine’s economy and society.\nOn October 9, U.S. President Donald Trump seemed to make Ukraine’s situation even more perilous when he announced a deal with Moscow to unilaterally lift sanctions on Russian diesel and called on Ukraine to suspend strikes on Russian oil refineries. Those strikes have been one of Ukraine’s most potent forms of counterpressure in recent months. But Trump’s unexpected announcement is not necessarily a major setback for Ukraine. It comes amid a broader shift by the Trump administration in recent weeks to move away from pursuing an elusive comprehensive peace agreement in favor of a mutual cease-fire on strikes against energy infrastructure—a shift that could ultimately be beneficial to Kyiv. Moreover, in his angry retort to Ukrainian President Volodymyr Zelensky’s criticism of the diesel deal, Trump revealed a potential way forward: as long as Ukraine stopped hitting Russian refineries, the president said, “you can do whatever you want to Russia.”\nUkraine should take Trump at his word. If upheld by Moscow as well as Kyiv, an energy cease-fire would be a crucial step toward containing the war. Framed in the right way, it would also leave open other forms of pressure by Ukraine that could help compel Russian compliance. Ideally, a reciprocal halt in long-range air and missile attacks could then be replicated across other sectors—maritime, commercial, and transportation—thus forming the basis of a broader aerial cease-fire.\nThus far, Russian President Vladimir Putin has given no indication that he is prepared to halt or even curtail his strike campaign. He sees the widespread destruction of Ukrainian cities and infrastructure as his most direct path to victory. But Putin is also under pressure from the widening war. In part, his accelerating air campaign reflects weakness on the frontlines, where Russia has achieved negligible progress throughout 2026 and Ukraine has even begun to make some gains in the Donbas. Russia also faces growing costs at home from Ukraine’s long-range strikes, which have disrupted energy and commercial infrastructure and heightened public anxiety over a prolonged war.\nThe United States and Europe can capitalize on Russia’s mounting challenges if they allow Ukraine to apply targeted pressure to convince Moscow to agree to pause or significantly limit its reckless air campaign. To be effective, this approach needs to be combined with focused diplomacy aimed at that specific objective. In fact, there are tools available for this purpose, and the barriers to putting them quickly into play are far more surmountable than has been commonly recognized.\nThe key will be credibly signaling that critical Russian military and economic assets will be at risk if Russian forces continue pummeling Ukraine’s civilian economy and society. Only then might Putin conclude that his current approach has reached the point of diminishing returns—and then pivot, as he has done at other junctures in the war. At the same time, this diplomatic play must be hitched to a broader effort by Kyiv’s Western partners to help it urgently shore up its air defenses and finances ahead of winter. Such a strategy may not immediately succeed, but failing to try would all but ensure that Ukraine suffers an extraordinary degree of damage that will be much harder to reverse.\nPRESSURE POINTS\nThe Trump administration’s repeated failure to advance its stated goal of brokering peace between Russia and Ukraine has led many observers to write off diplomacy as a waste of time. Over the past 21 months, the Trump administration has gotten nowhere in its attempts to mediate a comprehensive peace settlement. Russia’s war aims and Ukraine’s requirements—on such thorny issues as territory, Ukrainian security arrangements, and Russia’s future relations with the West—are simply too far apart. Washington also missed opportunities to build meaningful leverage over Russia, instead lavishly courting it with potential commercial deals and other incentives while pressuring Kyiv to accept Moscow’s conditions.\nYet that experience has helped drive the administration’s current efforts to achieve more plausible and narrowly defined goals. Following their visits to Moscow and Kyiv in early September, Trump’s envoys, Jared Kushner and Steve Witkoff, pivoted toward a more limited energy cease-fire. Since then, the president has also reiterated his support for s", "translation_ja": "", "vocab": [{"word": "precarious", "definition": "危険で不安定な状態。ここでは、ウクライナが戦争で極めて危機的な局面に置かれていることを表現している。"}, {"word": "unilaterally", "definition": "一方的に、相手の同意なく独断的に行動することを意味する。トランプが一国で制裁を解除したことを説明している。"}, {"word": "potent", "definition": "強力で効果的な、影響力を持つという意味。ウクライナの石油精製所への攻撃がロシアに対する強い抑止力であることを示している。"}, {"word": "elusive", "definition": "捉えにくい、達成困難な状態を表す。包括的な平和協定の実現が難しいことを示唆している。"}, {"word": "negligible", "definition": "無視できるほど小さい、わずかな進展のことを表現。ロシアが前線で得た成果がほとんどないことを示している。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-16 23:05 JST";
  renderTabs();renderList();
})();
</script>
