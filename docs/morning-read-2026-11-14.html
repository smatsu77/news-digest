 on the Mississippi,\" Moreno said.\nCalls about the collision came in around 13:30 EST (18:30 GMT) on Friday when people began trying to help passengers escape the boat as it took on water, Port of New Orleans Chief Melanie Montroll told the news conference.\nThere were about 129 passengers, in addition to crew members, on the American Heritage at the time of the collision, according to Port of New Orleans.\nPassengers began disembarking from the paddlewheeler vessel, operated by American Cruise Lines, as it started listing before tipping on to its side, Mayor Moreno said.\nTugboat operators, police and other rescuers rushed to help and officials shut down the Mississippi River for the search effort.\nThe American Heritage was finishing an eight-day cruise to Mississippi River destinations in Louisiana and Mississippi.\nPresident Donald Trump posted on Truth Social that the rescue was an \"incredible job\".\nSecretary of Homeland Security Markwayne Mullin said the US Coast Guard also supported local rescue operations.\nGovernor Jeff Landry also hailed the rescue as a \"miracle on the Mississippi\" given the \"sheer number of people who were on that cruise ship\" who were rescued.\nShips have operated safely on the Mississippi River for years, Landry said, pledging to investigate what happened.\nJamie Holford, a witness to the crash, told the BBC's US partner CBS that he saw the cruise ship hit the dock following the collision.\n\"It sounded like a war movie. Just imagine tons of steel crunching. That's what it sounded like,\" he said. \"It looked like something off the Titanic.\"\nHolford added that he saw passengers and crew members \"hollering\" and \"crying\" as they tried to get off the ship while it was sinking.\nThe American Heritage can carry up to 150 guests and features a glass-enclosed restaurant, fitness centre and three guest lounges, according to its website.\nBuilt in 2015, the vessel has at least four decks.", "translation_ja": "", "vocab": []}, {"title_ja": "マイクロソフト、約24時間の世界規模障害で「深くお詫びします」と表明", "title_en": "Microsoft 'deeply sorry' for global outage after almost 24 hours of disruption", "summary_ja": "マイクロソフトは、OutlookやTeamsなどの製品に発生した世界規模の障害について、「深くお詫びします」とコメントしました。この障害は70カ国以上に影響を及ぼし、約24時間後の金曜日午後には回復が進みましたが、完全復旧時期は未定とのことです。同社は、ネットワーク容量のアップグレード中に生じた技術的問題が原因であり、サイバー攻撃やAIエージェント関連ではないと説明しています。", "summary_en": "Experts say the event is a \"stark reminder\" of how heavily the world relies on a small group of big tech providers.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6rrg51rkz09o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Microsoft 'deeply sorry' for global outage after almost 24 hours of disruption\n- Published\nMicrosoft has said it is \"deeply sorry\" for the service outage to its products, including Outlook and Teams, which has caused disruption around the world.\nServices were broadly recovering by Friday afternoon, nearly 24 hours after issues began. Microsoft said it was making \"encouraging progress\", but added it does not know when services will fully recover.\nThe outage hit more than 70 countries, disrupting everything from business operations to government services and personal users. More than 430 million people use the affected products worldwide.\nMicrosoft said it was a technical issue introduced during a \"network capacity upgrade\" and not related to cyber or artificial intelligence agents.\nExperts said the event was a \"stark reminder\" of how heavily businesses and vital services rely on a small group of big tech providers.\nUsers began reporting they were having trouble accessing Microsoft 365 products on Thursday.\nBy Friday, the far-reaching issue was affecting institutions from the Japanese government and the Philippines Supreme Court to the Australian spy agency, and trains, hospitals and courts in North America.\n- Why is Microsoft's outage lasting so long and will emails be lost? \n  - Published6 hours ago\n- Courts, spies and MPs: How the Microsoft outage has been felt around the world \n  - Published7 hours ago\nIn the UK, some parts of the NHS, including GPs and hospitals, were affected, as were some schools and police forces.\nUK cyber minister Liz Lloyd said the incident had \"limited\" impact on critical frontline services such as 999 calls, and there had been no disruption to the transport network.\nIn Canada, however, the national rail network said passengers may not be able to receive email updates about their trips, and hospitals across the country also had issues with emails.\nIn the US, staff members from the House of Representatives told Politico it had set back an entire day of legislative work as everything was on Microsoft's Outlook.\nSingapore's government acknowledged some of its systems had been impacted, and in India, the outage disrupted work for many on Friday.\nIn Turkey, advisers and officials attending the COP31 climate summit in Antalya were left frustrated by being unable to access Outlook.\nThe issues also affected smaller businesses and individuals.\nPeter Pentz, a winemaker in South Africa, said his entire business was basically brought to a \"standstill\".\nHis winery's communication with exports was also brought to a standstill, he said, and \"critical production work\" was been halted as the Cape West Coast winery \"relies on these systems for parts of our day-to-day operations\".\nGeorgia from Staffordshire in England said she was due to complete her first house purchase today after waiting eight months to get to this point - but the outage has delayed that.\n\"The solicitor mentioned there may be a delay due to not being able to contact other agencies.\n\"We're not the only one completing today, there are hundreds of houses and for them to ring everyone in time is unfeasible,\" Georgia said.\n'Encouraging recovery signals'\nMicrosoft first acknowledged users in the Americas were unable to access Exchange Online mailboxes at 17:54 GMT on Thursday, and shortly after warned the disruption was possibly affecting Microsoft 365 globally.\nWhile it launched an investigation and engineers began working to restore services, by 04:36 on Friday Microsoft was reporting only a \"partial recovery\" in some parts of the world.\nBy 13:32, the tech giant said there were \"broader improvements\" in North America, \"sustained improvements\" across much of Europe and \"encouraging recovery signals\" in the Asia Pacific region.\nMicrosoft said it restored services gradually due to the scale of the problem and to help ensure services remain stable once they are up and running again.\n\"We are deeply sorry for the disruption this incident has caused our customers and partners,\" a Microsoft spokesperson said.\n\"We know the trust they place in our services and take that responsibility extremely seriously.\"\nMicrosoft said it has no \"ETA\" for when services will be fully recovered.\nA full post-incident report will be released once Microsoft has completed a review.\nExperts said while workers may have been happy to not have email access for the day, the incident showed the dependence many organisations have on these cloud-based services.\n\"The global Microsoft outage is a stark reminder of how heavily we rely on a handful of big tech providers,\" said Rob Demain, chief executive of cybersecurity firm e2e-assure.\nMatt Saunders, field chief technology officer at tech consultancy Adaptavist, said it would be challenging to mitigate against a similar problem.\n\"Classic IT disaster planning strategies suggest using a second service for resilience, but in practice, it's almost impossible for a business to function without tools such as Microsoft,\" he said.\n\"", "translation_ja": "", "vocab": []}, {"title_ja": "マイクロソフトの大規模障害が長引く理由とメールの喪失リスク", "title_en": "Why is Microsoft's outage lasting so long and will emails be lost?", "summary_ja": "マイクロソフトの大規模障害により、世界74カ国以上の学校、医療機関、企業などのサービスが影響を受けています。TeamsやOutlookなどのサービスは障害発生から約24時間後に復旧が進んでいますが、ネットワーク容量アップグレード中の技術的問題が原因とされています。メール配信は遅延する可能性があり、マイクロソフトはメールのタイムアウトウィンドウを48時間に延長して対応しています。", "summary_en": "Microsoft says it is continuing to restore services including Outlook and Teams following a global outage.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwvg238zrnm5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Why is Microsoft's outage lasting so long and will emails be lost?\n- Published\nA major Microsoft outage has impacted schools, healthcare systems, businesses, courts and governments around the world.\nServices including Teams, Outlook and AI software Copilot, are being restored almost 24 hours since issues first surfaced.\nMicrosoft said the outage was not a cyber-security incident and was caused by a technical issue. It has apologised for the disruption.\nHere's what we know about the services affected and what went wrong.\nWhat happened?\nSome Microsoft 365 services have been affected by \"connectivity problems\" with problems reported in at least 74 countries.\nFrom late on Thursday, customers reported varying levels of access - many were unable to send or receive emails, view certain files or details on their calendar apps.\nBut some users were able to use Teams, messaging and online meeting functions without issues.\nAs of Friday afternoon, Microsoft said it had seen \"encouraging recovery progress\" in Europe and improvement in North America.\nThe company added that it was focused on \"addressing the remaining areas of disruption\" but warned \"some users may still experience intermittent issues\".\nIn a later statement, the company said it was continuing to see improvements \"with email queues significantly reduced and approaching normal levels\".\nThe company attributed the ongoing outage to an issue during an earlier network capacity upgrade.\n\"We have addressed the underlying issue and continue to restore service to remaining customers and regions,\" it said on Friday.\nWill emails affected by the outage ever arrive?\nAlthough services are beginning to resume, Microsoft has warned of continued \"intermittent access issues\", meaning some users will still struggle to load their inboxes and could experience \"delayed email delivery\".\nIn other words, it is not quite safe to assume every email you send is going to arrive in its intended recipient's inbox right away.\nEarlier, Microsoft said it would be extending the \"timeout window\" to 48 hours \"to help protect delayed messages as delivery catches up\".\nThe email timeout window refers to the amount of time Outlook will wait to receive an email.\nWhen they do show up, the timestamp will be when they were delivered rather than when they were sent.\nWhy has it taken so long to fix?\nAlthough email service Outlook appears to be resuming, the outage has so far lasted for more than 20 hours - in outage terms that is considered a long time.\nProf James Ferryman from the University of Reading's department of computer science said the details the company has disclosed provide some clues.\n\"What Microsoft has told us is that the part of its servers that sets up secure connections is getting swamped, and once that happens the server just stops answering,\" he said.\n\"The trouble is that this kind of failure snowballs.\n\"One server falls over, its work gets passed to the next one, and meanwhile huge numbers of phones and laptops keep trying to get back in.\n\"You can't just turn it all back on at once. You have to bring it back bit by bit.\"\nThe challenge is therefore not just fixing the fault, but managing the huge surge of devices trying to reconnect once services start coming back online.\nGergely Orosz, a former leading software engineer at several major tech companies including Skype and Uber, said this could be the \"most disruptive\" business email outage \"of all time\".\nHe said it was still difficult to know just how many people have been affected by the disruption, but added he \"cannot recall\" an outage over business email ever taking this long to return to normal.\nAustralian cyber-security expert Troy Hunt told the BBC the outage could have far-reaching consequences.\n\"Microsoft is a massive part of the internet backbone and reminds us how critical email still is.\n\"Not only does this outage affect many people's ability to work but also things like the ability to communicate about appointments, purchase things that need verification, create or access accounts and services,\" he said.\nIn a statement, Microsoft said it was \"deeply sorry for the disruption this incident has caused our customers and partners.\n\"We know the trust they place in our services and take that responsibility extremely seriously. We are seeing broad recovery and stability across our services.\"\nHow many people have been affected?\nMore than 430 million people use Microsoft 365 apps according to Microsoft's website. The full scale of the outage has not been confirmed.\nMicrosoft 365 is used by companies worldwide and is expected to have a knock-on effect to other services.\nTech giants OpenAI and Anthropic both earlier reported problems as a result of the outage.\nChatGPT-maker OpenAI said it was investigating an issue affecting its connections to Microsoft's services, which had caused some tools to not work as expected.\nFrom city governments in the US to Australian spy agencies, disruption across the globe has been widespread.\nCourts fr", "translation_ja": "", "vocab": []}, {"title_ja": "米空軍がRAF Lakenheath上空の「無人機の可能性」に対応と発表", "title_en": "US Air Force says it responded to 'suspected drones' over RAF Lakenheath", "summary_ja": "米空軍は金曜夜、イギリスのサフォーク州にあるRAF Lakenheath上空での「不正な無人機活動の可能性」に対応したと発表しました。国防省によると、職員や航空機、インフラに被害はなく、状況は解決されたとのことです。イラン関連の脅威が高まっている中、イギリスの米軍基地ではセキュリティ体制が強化されています。", "summary_en": "The American military says there were no injuries or damage after \"suspected unauthorised drone activity\" this evening.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6jd75geegzyo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "US Air Force says it responded to 'suspected drones' over RAF Lakenheath\n- Published\nThe US Air Force said it responded to \"suspected unauthorised drone activity\" over RAF Lakenheath in Suffolk on Friday evening.\nNo personnel, aircraft or infrastructure were affected, a spokesperson for the US Air Force said.\nIt comes after unconfirmed reports that sirens were sounded at the base, which residents reported hearing from a nearby village.\nA Ministry of Defence spokesperson told the BBC it was \"coordinating with all relevant parties\", adding that US Air Force security personnel responded to the reports and the situation was resolved.\n\"We are working closely with them to establish the facts,\" they added.\nWest Suffolk MP Nick Timothy said he had been in touch with authorities at the base, and was told \"there is no threat to the public, and the incident is now resolved\".\n\"Given the raised threat level, I continue to encourage everyone to report anything suspicious or out of the ordinary to the authorities,\" he added in a social media post.\nEarlier this week, at least 12 US Air Force aircraft departed the nearby RAF Mildenhall base.\nThey included two Boeing Stratotanker KC-135 refuelling aircraft, with one apparently headed towards Germany and another seen landing at Prestwick Airport near Glasgow.\nThere has been heightened security activity at US bases in the UK following an incident at RAF Fairford in September that Prime Minister Andy Burnham said Iran played a part in.\nPolice said petrol but no explosives were found during searches of vans near the base.\nTwo men have been charged by the Crown Prosecution Service over their alleged involvement in the incident.\nWhile Iran denied any responsibility, the US removed all of its bombers from the base in October.\nThe Wall Street Journal reported the departure of the US aircraft from RAF Mildenhall this week was in response to a further threat from Iran but the BBC has not independently verified the claim.\nEarlier this week, Downing Street insisted British airbases were safe and that their security is a \"top priority\".\nRAF Lakenheath hosts the US Air Force's 48th Fighter Wing, or the Liberty Wing as it is also known, which has nearly 7,000 active-duty personnel, some of whom are stationed at the base.\nThe Liberty Wing is the largest US fighter operation in Europe, its website says, employing four combat ready fighter squadrons.\nGet in touch\nHave you witnessed any unusual activity near an RAF base?\n  - Published3 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "ラトビアから逃亡した少年殺害容疑者の身柄引き渡しに向けた2年間の闘い", "title_en": "Family's two-year fight to bring killer driver back from Latvia", "summary_ja": "イギリスのコヴェントリーでひき逃げにより12歳の少年ケートンを殺害したラトビア人男性アレクサンダース・ドラルスは、事件直後にラトビアへ逃亡した。両親を中心とした2年間の執念深い追跡の末、彼は逮捕され9年4ヶ月の懲役刑を言い渡された。", "summary_en": "How the parents of Keaton Slater, 12, battled to bring the man who killed him to justice.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6dxwxn71gx0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Family's two-year fight to bring killer driver back from Latvia\n- Published\nDays after her 12-year-old son was killed by a BMW driver travelling at 70mph, Louise Slater sat outside the suspect's home, gathering the courage to plead with his family to hand him in.\nShe had been given the name and address of Aleksanders Dolars after her son Keaton was killed in a hit-and-run in Coventry.\nDistraught, she was preparing to knock on the door when a neighbour approached and asked what she was doing.\nWhen she explained, he told her the family, from Latvia, had packed up and left a day or two earlier.\nKeaton's suspected killer had fled just hours after leaving him dying in the road.\nWhat followed was a relentless two-year fight by his parents to track him down and bring him back to England to face justice.\nHe was finally jailed on Friday, for nine years and four months.\nThis article contains details some readers may find upsetting\nDolars' name had been already circulating locally before police identified him as their main suspect on 18 June 2024, four days after Keaton was killed.\nA family waiting at nearby traffic lights said their seven-seater \"shook violently\" as a BMW driver sped past at what appeared to be far more than the 30mph limit. Moments later, they saw something fly into the air behind them.\nThe car did not stop.\nAs it disappeared from view, the family noticed a black rucksack and a single shoe lying in Radford Road and realised a child may have been hit.\nKeaton's father Clint was taken to the scene where he watched as his 12-year-old son's body was covered.\nHe called his wife.\n\"We just stood there for ages, letting family know what had happened and the whole time I kept thinking, 'he's going to come running up to us in a minute',\" she said.\n\"Then the police came over with a bag and asked, 'is this his'? It was demolished.\"\n- Driver who fled to Latvia after killing schoolboy jailed \n  - Published4 hours ago\n- Killer of boy, 12, ordered to face victim's family at sentencing \n  - Published5 November\n- Man admits killing schoolboy in hit-and-run crash \n  - Published3 September\nIn the days after Keaton's death, police reassured Louise airports had been alerted and the suspect would be stopped if he tried to leave the country.\nShe had been told the family lived on the same road as them and was given a house number.\nSummoning the courage to go there, she hoped to appeal to his parents face to face.\n\"All I was going to say was, 'how can you live with yourselves'?,\" she said.\n\"I'd tell them to hold their hands up. Do the right thing. Tell him to face what he's done.\"\nBut when she arrived, the family had already gone.\nSoon afterwards, people in Latvia contacted her to say Dolars was there. Police later confirmed he had travelled to the country in the weeks after Keaton's death, having tracked him through phone records.\nThe community quickly rallied around the family and, by August, a petition calling for his extradition had been started.\nYet bringing Dolars back to the UK would prove far from straightforward.\nWith no extradition treaty in place between the UK and the EU following Brexit, prosecutors and authorities faced a lengthy and complex legal battle requiring co-operation from both countries.\nThe family intensified their campaign, contacting the Latvian embassy and securing in April 2025 a meeting with Atis Lots, Latvia's ambassador to the UK.\nThey began by asking whether he was a father. When he said he was, they told him Keaton's story.\nAfterwards, they came away convinced they had found an ally.\nBound by confidentiality over much of the discussion, Louise would not reveal details but said the ambassador left them feeling hopeful.\n\"They wouldn't even call him by his name,\" she said. \"They called him the black sheep of Latvia.\n\"[They said] 'we don't want him here. We'll do anything we can to get him into your prisons'.\n\"To walk out of there hearing that, we thought, 'oh my God'.\"\nTaiwo Owatemi, MP for Coventry North West, was working behind the scenes to build political support.\nColleagues in Westminster had warned her that, without an extradition agreement between the UK and EU, securing Dolars' return would be extremely difficult.\nHowever, she was encouraged by the Latvian ambassador telling her his country did not want a difficult relationship with the UK, given the proximity of the country to Ukraine and its continuing war with Russia.\nShe also learned from him that Latvians were angry at what had happened and that Dolars was bringing shame on their country.\n\"When you have Latvians in Latvia asking for justice, when you have Latvians in the UK asking for justice, that's his number one job as ambassador,\" Owatemi said.\nLatvians were also proactive identifying where Dolars was in the country, she said.\nLouise said she had received messages from families there via a Facebook page set up within the community after Keaton's death.\nShe said people were saying, \"we don't want him here, he's scum\".\nThey also s", "translation_ja": "", "vocab": []}, {"title_ja": "保護観察官が給与と早期釈放制度に対して労働争議を実施へ", "title_en": "Probation officers to take industrial action over pay and early release scheme", "summary_ja": "保護観察官の労働組合Napoは、5%の昇給提案を拒否し、11月23日から残業拒否を開始することを決議しました。政府の囚人早期釈放制度による業務負担の増加と不十分なスタッフ配置が理由です。政府は1,300人の追加採用と綿密な監視体制の確保を主張していますが、労働組合は深刻な人員不足と資源不足の中での実施を指摘しており、さらなるストライキ措置も示唆しています。", "summary_en": "It comes as prisons prepare to free more inmates early in the coming months.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6pv92pl02kpo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Probation officers to take industrial action over pay and early release scheme\n- Published\nProbation officers have voted to reject a 5% pay rise and take industrial action, citing growing pressure created by the government's prisoner early release scheme.\nMembers of Napo, the probation service union, voted to refuse overtime from 23 November - and could take strike action should the union \"deem that option to be necessary\".\nIts general secretary Ian Lawrence said the service was \"already in crisis\" before the early release scheme came into force, which relies on probation staff monitoring freed prisoners in the community.\nA Ministry of Justice spokesperson said the government had put forward a \"strong offer\" and was recruiting an extra \"1,300 officers to significantly cut workloads\".\nThey added that the government has \"robust contingency plans in place\" to ensure offenders \"are still subject to the same rigorous supervision\" in the event of industrial action.\nProbation service unions have warned that officers have too many cases and the rate at which staff are leaving the profession has increased.\nThe service has come under renewed pressure in recent months as a result of the early release scheme, the union said, which the government introduced as prisons were dangerously close to capacity.\nSeven-hundred eligible offenders originally sentenced to up to 19 months were released on 1 October, with another two groups of 650 prisoners released on 13 October and 10 November.\nAnother nine groups are expected to leave prison in the next seven months, with inmates who received longer sentences included in the later cohorts.\nSome 250 prisoners serving more than 12 years are expected to be released on 9 June.\nNapo's leader said staff had tried \"desperately\" to implement early release schemes introduced by the Labour government and previous Conservative government, but had been asked to do so with \"inadequate staff and a lack of resources\".\nThe government has said electronic tags and probation intervention will help to manage prisoners freed early.\nThe Probation Service uses electronic monitoring to track curfews and conditions of a court or prison order, with most of those eligible for early release now requiring tagging.\nBut a September report by His Majesty's Inspectorate of Probation (HMIP) found that almost half of electronic tags used to track offenders' movements were not fitted on time.\nRelated topics\n  - Published3 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "FAA、米国内全便の運航停止を発令", "title_en": "FAA issues US national ground stop on all flights", "summary_ja": "米連邦航空局（FAA）は11月13日、通信システムの一時的な障害により米国内全便の運航を停止した。この決定により3,500便以上がキャンセルされ、1万便以上が遅延した。FAA当局者は安全上の懸念から「念のため」の措置だと述べ、攻撃の兆候はないと確認した。", "summary_en": "The US federal aviation regulator announced a nationwide ground stop for all airports. Federal officials blamed a communications outage and said technicians are investigating.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/faa-issues-us-national-ground-stop-on-all-flights/a-79945062?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "FAA issues US national ground stop on all flights\nNovember 13, 2026\nThe US Federal Aviation Administration (FAA) on Friday issued a ground stop on all national flights. The FAA is the US government agency responsible for air traffic control.\nOver 3,500 flights were canceled and over 10,000 flights within, into, or out of the United States were delayed, according to the FlightAware aviation tracker. With some 11,000 flights scheduled to depart from US airports after 4 p.m. local time (2200 UTC), more cancellations were expected, according to Cirium, an aviation analytics company.\nThere was no immediate information on when departures could resume.\nWhat do we know so far?\n\"All departing traffic should remain groundstopped until further notice,\" the FAA said.\nThe agency said the ground stop is \"due to extraordinary circumstances and reasons for safety.\" The FAA cited a temporary telecommunication outage and said, \"Every flight has been accounted for and international flights will be handled on a case by case basis.\"\nThe agency said flights were halted \"out of abundance of caution.\"\nIn a post on X, US Secretary of Transportation Sean Duffy said the stop was due to a communication issue impacting all Air Route Traffic Control Centers.\n\"FAA technicians are investigating the issue. We will provide immediate updates as we have them,\" he wrote.\nUS Homeland Security Secretary Markwayne Mullin told reporters at the White House that there was no indication this was an attack against the US.\n\"This is a telecommunications outage,\" Mullin said. \"All the flights are accounted for.\"\n\"Everybody's safe. There's no reason to be concerned about your loved ones if they're flying,\" he said, adding, \"There was no indication as of yet this was a nefarious attack.\"\nThe European Organisation for the Safety of Air Navigation, Eurocontrol, said all flights departing for US airports from its 42 member states were suspended following a request from the FAA to deal with technical issues.\nCanada implementing 'traffic management' measures at major airports\nCanada's air navigation service provider, NAV Canada, said it is closely monitoring the US ground stop and later said, \"It was implementing traffic management measures at Toronto Pearson, Montreal-Trudeau, Calgary and Vancouver to safely manage traffic volumes.\"\n\"Travelers should expect delays and check with their airline. Our systems are operating normally,\" NAV Canada added.\nToronto Pearson Airport said flights between Toronto and the US have been impacted by the ground stop.\nThe FAA ground stop order came a day after Duffy asked Congress for $30 billion to upgrade and modernize the US Air Traffic Control System.\n\"This investment is critical to complete the modernization of our national airspace — delivering a resilient telecommunications backbone for air traffic controllers, modern hardware and software, state-of-the-art control towers, and world-class airport infrastructure,\" Duffy and Office of Management and Budget Director Russell Vought wrote in a letter to lawmakers.\nIt's the first nationwide ground stop since January 2023, when the FAA dealt with a system outage. Prior to that, the last ground stop was after the September 11, 2001 terror attacks.", "translation_ja": "", "vocab": []}, {"title_ja": "ニューオーリンズでタンカーと客船が衝突、30人以上が入院", "title_en": "Tanker collides with cruise ship on Mississippi in New Orleans", "summary_ja": "米ニューオーリンズのミシシッピ川でフレイターが客船「アメリカン・ヘリテッジ」に衝突し、180人以上が救出された。30人以上が入院したが死亡者は報告されておらず、ニューオーリンズ市長は「ミシシッピの奇跡」と述べた。客船は衝突後に転覆し、救助隊が水中の乗客と乗員を救助した。", "summary_en": "A freighter collided with a cruise ship carrying around 130 people in New Orleans, causing the paddlewheel vessel to capsize. More than 30 people were hospitalized, but all passengers survived and were accounted for.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/tanker-collides-with-cruise-ship-on-mississippi-in-new-orleans/a-79945080?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "More than 30 hospitalized after cruise ship collision in New Orleans\nNovember 13, 2026\nMore than 30 people were hospitalized but no deaths were reported after a freighter collided with a cruise ship on the Mississippi River in the US on Friday.\nAuthorities said at least 180 passengers and crew were rescued. New Orleans Mayor Helena Moreno described it as \"a miracle on the Mississippi,\" adding that none of those hospitalized had critical injuries.\nFootage showed the paddlewheel cruise boat, called The American Heritage, capsizing after the impact with the much larger cargo vessel and rescue teams rushing to get people in life jackets out of the water.\n'It was just chaos'\nThe accident happened near the port of New Orleans when the freighter Atlantic Asphalt hit the cruise ship while it was docked.\n\"It was just chaos,\" local witness Devon Flanagan was quoted by news agency AP.\n\"You had all types of ships, like other barges and other companies down there trying to help out, which also was a little convoluted because you had people still in the water,\" he described the scene.\nThe company operating The American Heritage , American Cruise Lines, said in a statement that \"guests and crew were evacuated, and we are deeply concerned for everyone involved.\"\nAccording to AP, the cruise ship was built in 2015, is five stories tall and can hold up to 150 passengers. It was finishing an eight-day cruise to several Mississippi River destinations in Louisiana and Mississippi.\nWhen news of the collision broke, it was initially unclear whether there were any fatalities and how many people were injured or missing.\nLouisiana Governor Jeff Landry said he was on his way to New Orleans.\n\"We are aware of the incident on the Mississippi and we are in close contact with local officials and law enforcement,\" he wrote on X.\nUS Department of Homeland Security Secretary Markwayne Mullin wrote on social media that \"we are throwing every asset we have to helping rescue missing passengers\" and that his department was coordinating closely with state officials.", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ情勢：EUが潜在的な平和交渉に統一戦線を送る準備", "title_en": "Ukraine updates: EU to send united front to potential peace talks", "summary_ja": "EUは欧州の統一した代表団としてフランス、ドイツ、イタリア、ポーランド、英国の5カ国から構成されるチームをロシア・ウクライナの潜在的な平和交渉に派遣することを決定した。一方、ロシア外務省はジャレッド・クシュナー米特使がプーチン大統領が欧州代表団の参加に同意したと述べたことを否定し、その問題は協議で取り上げられていないと主張している。", "summary_en": "Germany, France, the UK, Italy and Poland — as well as the EU itself — will jointly represent Europe in possible peace talks. Meanwhile, a second car bomb in two days has exploded in Moscow. DW has more.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-updates-eu-to-send-united-front-to-potential-peace-talks/live-79937459?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ukraine updates: Europe to send united front to potential peace talks\nPublished November 13, 2026last updated November 13, 2026\nWhat you need to know\n- The EU has named its representatives to attend possible peace talks between Russia and Ukraine\n- EU foreign policy chief Kallas said Russia does not want 'anybody strong' at the negotiating table\n- The Kremlin said it wants to see 'genuineness' before allowing EU into the talks\n- Germany's Merz called on Trump to make 'no surprises' at his next meeting with Putin\nHere are the latest developments from the Russia's war in Ukraine on Friday, November 13:\nRussian Foreign Ministry contradicts Kushner on European participation in talks\nRussian Foreign Ministry spokeswoman Maria Zakharova on Friday directly contradicted US envoy Jared Kushner's Thursday statement that President Vladimir Putin had voiced willingness to have European representatives join upcoming talks designed to end his war of aggression against Ukraine.\nResponding to a request for comment from Germany's DPA news agency, Zakharova said, \"As far as Russia's Foreign Ministry is aware, the issue was not discussed during the talks with Steve Witkoff and Jared Kushner in Moscow.\"\nNo Foreign Ministry representatives were present during a Thursday meeting between Putin and US envoys Kushner and Steve Witkoff according to Russian state media, which said Putin was accompanied by his own foreign policy advisor Yuri Ushakov, Russia's chief negotiator Vladimir Medinsky and envoy Kirill Dmitriev.\nEurope to send five-nation team to Russia-Ukraine peace talks\nEuropean Council President Antonio Costa on Friday said the EU will take part in future peace talks aimed at ending Russia's invasion of Ukraine, and will jointly represent Europe with France, Germany, Italy, Poland and the UK.\n\"Europe must speak with one clear voice and united voice in all discussion that shape the future of Ukraine and the security of our continent. And this is ultimately a team effort,\" Costa said after a European leaders' meeting in Dublin.\nEuropean and Ukrainian leaders have long insisted on the format, while Russia has rejected the idea and the US appeared indifferent under the Trump administration.\nThe situation appears to have changed slightly, with US envoy and presidential son-in-law Jared Kushner saying late Thursday, \"We cannot conclude this deal without the Europeans being at the table,\" adding that Russian President Vladimir Putin \"is willing to give it a try.\"\nDespite consensus about wanting peace after nearly five years of Russia's war of aggression, Europe lacks unanimity as to who should be representing the interests of the continent and member states.\nRussia and the US have called for one single representative to be present, whereas several nations have called for a diplomatic team.\nThe question of who will represent the EU itself remains unresolved.\nThe bloc's foreign affairs boss Kaja Kallas — a staunch critic of Russia and its war — said Friday, \"I'm the one who is representing Europe in the foreign and security policy.\" Adding, \"I know that the Russians don’t want me, but, you know, do we have a say, who is representing Russia?\"\nWith frustration growing over Russian aggression on Europe's doorstep, Latvian Prime Minister Andris Kulbergs put things in perspective. Pointing to the fact that Europe is more populous, richer and more militarily powerful than Russia, he said Friday, \"We as Europe, have to grow some bigger balls.\"\nZelenskyy says 'no clear explanations given' for the Starshield speed issues\nUkrainian President Volodymyr Zelenskyy said no clear explanations have been given for recent speed issues with Starshield.\nThe Ukrainian president said on Thursday that Ukraine's military faced new \"systematic restrictions\" to tech billionaire Elon Musk's Starshield satellite internet.\nZelenskyy doubled down on his comments on Friday, saying the issue remained unsolved.\nHe said the connections were only working when devices were moving slower than 161 kilometres (100 miles) per hour.\n\"This makes it impossible, in particular, to use interceptors against jet-powered 'Shaheds.'\" he added. The Ukrainian president also said he instructed his ministers to step up contacts with the US side.\nThe Starshield military communications system — the military-grade version of satellite-based communication network Starlink — is operated by Musk's SpaceX and plays a key role for frontline communications.\nUkraine first flagged issues with Starshield last month after a dispute between Zelenskyy and US President Donald Trump over a US deal allowing more Russian diesel into global markets.\nThe Wall Street Journal reported that Musk \"capped the speeds at which Ukrainian hardware could stay connected to the satellite-based network.\"\nTech billionaire and US president both denied throttling Ukrainian access, but Musk later accused Ukraine of using the service for military purposes while Trump said Musk had \"put it back.\"\nMerz asks Trump for 'no sur", "translation_ja": "", "vocab": []}, {"title_ja": "FAA運用停止ライブ更新: 5,000便がキャンセル、『悪質な』行為の兆候なし", "title_en": "FAA ground stop live updates: 5,000 flights canceled, no indication a 'nefarious' act", "summary_ja": "米国運輸保安局(TSA)が大規模な運用停止を実施し、約5,000便がキャンセルされた。国土安全保障省のマークウェイン・マリン長官は、この事象は『通信障害』が原因であると述べた。当局は現在のところ、悪質な行為や意図的な破壊活動の兆候は認められていない。", "summary_en": "DHS Secretary Markwayne Mullin said it was due to a \"telecommunications outage.\"", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/live-updates/faa-ground-stop-live-updates-hundreds-flights-canceled/?id=138125140", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "FAA、全国規模の一時停止を発令 「悪意のある攻撃」の兆候なし", "title_en": "FAA issues rare nationwide ground stop; no indication of 'nefarious attack'", "summary_ja": "米連邦航空局（FAA）は金曜日、全国のすべての空港を対象とした稀な一時停止を命じました。この措置は、すべての航空路管制センターに影響を与える通信システムの障害が原因です。当局は、この問題が悪意のある攻撃によるものではないことを示唆しています。", "summary_en": "The Federal Aviation Administration ordered a nationwide ground stop Friday for all airports due a communication issue impacting all Air Route Traffic Control Centers.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/nationwide-ground-stop-ordered-airports-faa/story?id=138121848", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "「奇跡」ニューオーリンズの転覆した河川船からタンカー衝突で全員救出", "title_en": "'Miracle': All rescued from capsized New Orleans riverboat in tanker collision", "summary_ja": "ミシシッピ川で金曜日に発生した事故では、タンカーとの衝突により河川船が転覆しました。しかし、奇跡的にすべての乗員が無事に救出されました。この救出作業は当局の迅速な対応により成功に終わりました。", "summary_en": "The incident occurred Friday on the Mississippi River.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/vessel-collision-port-new-orleans-emergency-crews-responding/story?id=138119847", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジンバブエの著者シムバラシェ・クンディゼザ、AI使用疑惑から無罪放免 受賞作品は「人間が執筆」と確認", "title_en": "Zimbabwean author Simbarashe Kundizeza cleared of using AI to write prize-winning story", "summary_ja": "ジンバブエの著者シムバラシェ・クンディゼザが、受賞作品『The Blue Fighter』のAI使用疑惑について無罪放免となった。権威あるケイン賞は1ヶ月の調査後、同作品は「人間によって執筆された」と結論付けた。クンディゼザは疑惑が晴れたことに安堵を表明し、調査プロセスが包括的で公正であったと評価された。", "summary_en": "After a month-long investigation it was concluded that Kundizeza’s story The Blue Fighter, which won the £10,000 Caine prize, was ‘human-written’ The Zimbabwean author Simbarashe Kundizeza has been cleared of using AI to write a prize-winning short story, after the prestigious Caine prize for Africa", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/books/2026/nov/12/zimbabwean-author-simbarashe-kundizeza-cleared-ai-caine-prize-winning-story", "state_media": false, "category": "経済", "full_text": "The Zimbabwean author Simbarashe Kundizeza has been cleared of using AI to write a prize-winning short story, after the prestigious Caine prize for African writers concluded that his entry was “human-written” after a month-long investigation.\nKundizeza’s story The Blue Fighter, which charts the declining fortunes of a family after the father invests in fish tanks, was announced as the winner of the £10,000 prize on 6 October.\nFive days later, the Atlantic published an article titled “Yet another literary prize winner seems to be AI”, in which the author and journalist Vauhini Vara said the AI-detection software Pangram, which itself uses AI, had deemed the story to be almost completely artificially generated.\nThe Caine prize chair, Ellah Wakatama, said in a statement: “From our detailed investigation, we feel the evidence is clear: The Blue Fighter was human-written. We now look forward to awarding and celebrating Simbarashe Steyn Kundizeza … before the end of the year.”\nShe said: “When concerns were raised, we have a duty as an organisation to look at them carefully and fairly,” adding that the prize had taken a “human-centred” approach to its investigation.\n“Our review included interviews with the author, the 2026 judging panel and The Shallow Tales Review, where the story was first published,” Wakatama said. “It also included independent and expert-led metadata analysis of drafts written by the author.”\nKundizeza, who had strongly denied using generative AI to write the story, said he was “relieved” that the allegations had been dismissed after the investigation. “It was not necessary in the first place, I am happy to put all this behind me and continue with my writing journey,” he said.\nVara’s article prompted outrage online, with many claiming that Black writers, and Africans in particular, were being unfairly singled out by allegations of the use of AI.\nAssociated Press contributed to this report", "translation_ja": "", "vocab": []}, {"title_ja": "ルイス・ハミルトン、エジプトのラファ検問所とガザ支援施設を訪問", "title_en": "Lewis Hamilton visits Egypt’s Rafah crossing and Gaza aid facilities", "summary_ja": "7度のF1ワールドチャンピオン、ルイス・ハミルトンがエジプトのラファ検問所を訪れ、ガザへの人道支援を送る組織と会合しました。ハミルトンはイスラエルの空爆で殺害されたガザの子どもたちについてソーシャルメディアで頻繁に投稿し、停戦を呼びかけています。訪問はエジプト赤新月社の物流倉庫も含み、ガザへの援助物資の流入状況を学ぶことが目的でした。", "summary_en": "Seven-time F1 world champion tours border area and logistics warehouses operated by Egyptian Red Crescent Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory. The seven-time Formula One world champion has spoken", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/10/lewis-hamilton-egypt-rafah-crossing-gaza-aid-facilities", "state_media": false, "category": "政治", "full_text": "Lewis Hamilton has visited Egypt’s Rafah border crossing with the Gaza Strip to meet organisations sending humanitarian aid to the territory.\nThe seven-time Formula One world champion has spoken out about conflict and humanitarian crises in the region, and has called for peace. He has frequently posted on social media about children killed in Israeli airstrikes in Gaza and called for a ceasefire.\n“I think we need to make sure we’re pushing to free Congo, free Sudan, free Syria, free Palestine. I think there’s a lot of peace that I’m hoping we get to at some stage,” Hamilton said in October.\nA ceasefire agreement reached last year has halted major combat operations in Gaza, but the amount of aid reaching the territory continues to fall far short of the agreed-upon minimum of 600 trucks a day.\nIsraeli forces have continued to advance, expanding their control from 53% of the territory to at least 60%, an independent commission of UN experts said last month.\nAirstrikes also continue, and Israeli fire along the advancing front has killed at least 196 Palestinians, including 18 women, 32 boys and 11 girls, the commission said.\nHamilton toured Egypt’s Rafah border crossing with Gaza before visiting logistics warehouses operated by the Egyptian Red Crescent, which facilitates the entry of aid to Gaza.\nAt the crossing, Hamilton greeted aid workers with “Assalamu alaikum” a widely used Arabic greeting meaning “peace be upon you.” He shook hands and briefly spoke to workers and officials.\nKhaled Megawer, the governor of North Sinai, where Rafah is located, said the visit was intended to help Hamilton learn about Egypt’s efforts to send aid to Gaza.\nThe visit comes after Hamilton made his 400th race start on Sunday at the São Paulo Grand Prix at Interlagos.\nThe first black F1 driver, he made his debut with McLaren in 2007. He is only the second F1 driver to start 400 races after his former teammate Fernando Alonso, who achieved the milestone in 2024.", "translation_ja": "", "vocab": []}, {"title_ja": "エジプトで2列車が衝突、少なくとも7人が死亡", "title_en": "Collision of two trains in Egypt kills at least seven", "summary_ja": "エジプトの首都カイロ南方約50km地点で日曜日に2列車が衝突し、少なくとも7人が死亡、125人以上が負傷しました。ファイユーム州行きの列車がアスワン州行きの停止中の列車の後部に衝突したもので、一部の乗客は車両内に閉じ込められました。エジプトではインフラの老朽化と保守不良により列車事故が頻繁に発生しており、政府は鉄道網の近代化を進めています。", "summary_en": "President orders prompt investigation after one train derails in collision in al-Ayyat about 50km from Cairo Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said. The crash occurred in al-Ayyat district in Giza prov", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/08/egypt-two-trains-deadly-collision", "state_media": false, "category": "政治", "full_text": "Seven people were killed and at least 125 injured when two trains collided on Sunday south of the Egyptian capital, Cairo, officials said.\nThe crash occurred in al-Ayyat district in Giza province, about 50km (30 miles) south of Cairo, when a train travelling to Fayoum province crashed into the rear of a train heading to the southern province of Aswan, according to the transport ministry.\nAn inspection indicated that the Cairo-Aswan train had been stationary on the same track, officials said.\nThe health ministry gave the casualty toll, adding more than 70 of the injured were discharged after receiving treatment.\nTrain derailments and crashes are common in Egypt, where the railway system has a history of mismanagement and poor maintenance of equipment. In recent years the government has announced modernisation initiatives to improve its railways.\nAyman Gamal, a resident of Kafr Girza in al-Ayyat where the crash occurred, said people rushed to the scene, pulled out survivors and called ambulances.\nGamal said he saw about 80 of the injured being taken by ambulances to hospital. Some passengers were trapped inside one of the carriages of the stationary train and died, he said.\nEgypt’s president, Abdel Fatah al-Sisi, said in a social media post that he had ordered a prompt investigation.\nOutside al-Wasta central hospital in Beni Suef province, where some of the injured were taken for treatment, survivors said passengers were in shock and struggling to breathe because of all the dust that was kicked up. Nearby villagers eventually got them out, they said.\nFarha Gamal, a survivor who was inside the Fayyoum train, said she saw some of the passengers who appeared dead and others were struggling to find their way out of the car. “There were other cars that were completely mangled,” she said in an interview.\nEmergency teams and cranes were dispatched to the crash site to clear the wreckage and restore train services to their normal schedule as soon as possible, the Egyptian railway authority said.\nLast September, a train driver and his assistant were injured after two freight trains collided in the same district.\nEgypt’s deadliest train crash was in 2002 when more than 300 people were killed after a fire broke out on an overnight train journeying from Cairo to southern Egypt.", "translation_ja": "", "vocab": []}, {"title_ja": "英警察がコメディアン・作家デイビッド・ウォリアムズを性犯罪容疑で捜査開始", "title_en": "UK police open sex offence probe into comedian and author David Walliams", "summary_ja": "英国の警察は、複数の女性や少女への性的虐待やグルーミングの疑いでコメディアンで児童文学作家のデイビッド・ウォリアムズを捜査しています。ウォリアムズ容疑者は容疑を否定していますが、BBCや文芸事務所から降板・契約解除されました。ITV ニュースとガーディアン紙は3年間の調査に基づき、2003年にさかのぼる複数の告発者の証言を報じています。", "summary_en": "The British TV personality, 55, denies sexual assault allegations, saying he has not broken the law.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/14/uk-police-open-sex-offence-probe-into-comedian-and-author-david-walliams?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "UK police open sex offence probe into comedian and author David Walliams\nThe children’s author and comedian denies the sexual assault allegations, says he has not broken the law.\nLondon’s police have opened an investigation into allegations of serious sexual offences after media reports accused British comedian and children’s author David Walliams of grooming and sexually abusing girls and young women.\nWalliams, 55, denies the allegations.\nThe Metropolitan Police said in a statement on Friday that it “has received a number of allegations of non-recent serious sexual offences involving a man now in his 50s”.\nIn the statement, Met Police Detective Superintendent Mike Cagney urged anyone affected to come forward.\nThe Met said the new allegations are separate from those reported this week by ITV News and The Guardian.\nThe two news organisations published reports on Tuesday that several women had accused Walliams of sexual misconduct, with the allegations dating back as far as 2003.\nThe reports came out a day after comedian Russell Brand was sentenced to more than 10 years in jail for rape and sexual assault.\nMultiple allegations\nThe Guardian and ITV said they spoke to more than 100 people during a three-year investigation.\nOne woman said Walliams sexually assaulted her at his London home when she was 15, while others accused him of grooming them as teenagers. The reports also included allegations that he harassed young female colleagues.\nIn a letter to ITV and The Guardian, he said: “Whilst a power imbalance is inevitable when one party is famous, abusing that power is something else entirely and it is something that I never did.”\nHe added: “I am not a sexual predator … I have not broken the law.”\nThe investigative reports were published after he lost a High Court bid to block the media outlets from naming him.\nThe judge, Matthew Nicklin, said an injunction would be “an exceptionally serious interference” with the media’s rights.\nDropped by BBC, literary agency\nA spokesperson for the BBC told the AFP news agency that it had taken down some shows involving Walliams, including all episodes of Little Britain, the comedy sketch show that made him famous.\nHis literary agency, Independent Talent Group, said it was “no longer representing him in any capacity”.\nWalliams’s publisher, HarperCollins, dropped him last year, following accusations that he harassed female staff, which he had also denied.\nWalliams rose to fame as a comedian with sketch shows Little Britain and Come Fly With Me. He was also a judge on ITV’s Britain’s Got Talent.\nHe penned children’s books that have reportedly sold more than 50 million copies, including Mr Stink, Gangsta Granny and The Boy in the Dress.", "translation_ja": "", "vocab": []}, {"title_ja": "マイクロソフトのサービス、世界規模の障害から復旧開始", "title_en": "Microsoft services begin recovering after global outage", "summary_ja": "マイクロソフトは14日、70カ国以上でOutlookとTeamsに影響を与えた世界規模の障害から復旧を開始しました。同社は「負荷の上昇」が原因であり、サイバー攻撃ではないと述べています。この障害は裁判所、薬局、政府機関など多くの機関に影響を及ぼしました。", "summary_en": "Microsoft services began recovering on Friday after a global outage disrupted Outlook and Teams.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/14/microsoft-services-begin-recovering-after-global-outage?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Microsoft services begin recovering after global outage\nNewsFeed\nMicrosoft services begin recovering after global outage\nMicrosoft services began recovering on Friday after a global outage disrupted Outlook and Teams in more than 70 countries, affecting courts, pharmacies and government agencies. The company blamed an ‘elevated load’ and ruled out a cyberattack. Al Jazeera’s Matthew Torres reports.\nPublished On 14 Nov 2026", "translation_ja": "", "vocab": []}, {"title_ja": "アフガニスタンの新しい中国への道は国境で閉ざされたまま", "title_en": "Afghanistan’s new road to China ends at a closed border", "summary_ja": "タリバン政権がワハン回廊に新道路を開通させ、パキスタンへの依存を減らし新たな貿易ルートを開拓することを望んでいる。しかし、中国は慎重な姿勢を崩していない。標高4900メートル近いワハジル峠に造られた未舗装の道路は国境に到達しているが、中国側に税関施設はなく、ベイジングからの商業利用再開の見通しは立っていない。", "summary_en": "Taliban government hopes its Wakhan Corridor road will open new trade routes and reduce reliance on Pakistan.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/features/2026/11/14/wakhan-corridor-afghanistan-china-taliban?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Afghanistan’s new road to China ends at a closed border\nTaliban government hopes its Wakhan Corridor road will open new trade routes and reduce reliance on Pakistan, but Beijing remains wary.\nAt an altitude of nearly 4,900 metres, at the Wakhjir Pass, Afghanistan ends and China begins. Snow closes the pass for at least five months of the year, and people cross it only sporadically in the months when it is passable.\nThere is no official border crossing here, and yet, on October 4, Afghanistan’s Taliban-led government celebrated the opening of a road leading to the frontier – but crucially not crossing it.\nAfghanistan’s Ministry of Rural Rehabilitation and Development said the road through the Wakhan Corridor in Badakhshan province had been built in two phases for 365 million afghanis ($5.5m).\nIt is a basic road – an unpaved track covered with gravel. On the other side of the border, there is no Chinese customs facility, and China’s Ministry of Foreign Affairs has not commented on the road’s opening.\nFor the moment, the road leads to a closed border, with no indication of when Beijing might open it to commercial traffic.\nThe corridor\nThe Wakhan Corridor is a narrow protruding stretch of land extending for about 350 kilometres (220 miles). It lies between Tajikistan to the north and Pakistan to the south, but is entirely within Afghan territory, connecting it with China.\nThe corridor’s unusual shape was determined by the competition between Britain and Russia over the region in the 19th century. An agreement between the two powers in 1895 delineated Afghanistan’s northern boundary with Russian territories (that now make up modern-day Tajikistan), and left Wakhan under Kabul’s control to separate the Russian-controlled land from British India.\nChina was not a party to the conflict, however, and Kabul and Beijing did not settle the border until 1963.\nThe area – on both sides of the border – is remote. But in recent years it has gradually become one of Asia’s most sensitive geopolitical crossroads, where China’s security concerns, Afghanistan’s economic ambitions, the interests of Pakistan and Iran, and Central Asian countries’ regional connectivity projects intersect.\nAs competition intensifies over trade and logistics routes across Asia, this narrow corridor could take on a role far beyond its geographical limits: a potential link between South, East and Central Asia, and a key to reshaping patterns of trade and influence in the region.\nProject long in the works\nSerious discussion of a road through Wakhan began in June 2009, during discussions between the Afghan and Chinese governments.\nHowever, the project went no further than preliminary studies at the time, with the corridor’s rugged terrain cited as a major obstacle to implementation.\nThe Chinese press at the time also noted concerns over national security, particularly that Uighur fighters could use the corridor as an entry point into China.\nThe project was frozen until 2019, when Afghanistan began building a road in Wakhan, according to former Afghan ambassador to China, Javid Qaem.\nSixty kilometres (37 miles) were completed, “but the sudden change of government in Afghanistan in August 2021 led to the plan being postponed”, Qaem told Al Jazeera, in reference to the Taliban takeover.\nFormer Afghan acting defence minister, Shah Mahmoud Miakhel, who served in the position in 2021 and left a few months before the Taliban took power, told Al Jazeera that “the presence of [United States] and foreign forces and the security situation” prevented the road project from being implemented.\n“Beijing considered those circumstances to be limiting the prospects for developing the corridor,” Miakhel said.\nThe Taliban government, however, picked up the project in the years since, making it one of its strategic projects while strengthening political and diplomatic contacts with Beijing.\nIt hopes to turn the corridor from an isolated border area into a gateway connecting Afghanistan to Chinese and Central Asian markets and strengthening its position in regional trade networks.\n“The Taliban resumed construction of the Wakhan road in September 2023, seeking financial support from China to build this future trade route, but China has not yet agreed to open its border with Afghanistan because of security threats,” Qaem said.\nIn January 2024, the Taliban announced that the road had reached the Chinese border. In March 2025, the rural development ministry signed a contract with local companies for a second, 71-kilometre (44-mile) phase. The authorities say the project was funded from Afghan government resources, and the available information does not indicate any Chinese funding.\nBeijing: Security before trade\nIn August 2025, Chinese Foreign Minister Wang Yi – the most senior Chinese official to visit Afghanistan since the Taliban returned to power – made his second visit to Kabul since the takeover.\nIn his meeting with Afghan Interior Minister Sirajuddin Haqqani, Wang said China", "translation_ja": "", "vocab": []}, {"title_ja": "米国内全便が通信障害で運航停止、旅行混乱が発生", "title_en": "All departing U.S. flights grounded due to communication outage", "summary_ja": "2026年11月13日、通信障害により米国の全空港で運航停止命令が発令され、数万人の乗客が足止めされた。政府関係者は「悪意のある攻撃ではない」と強調し、単なる通信障害だと述べた。9月11日以降、全米規模の運航停止はこれが2度目である。", "summary_en": "The incident marked only the second time such an alert was given in U.S. airspace since the 9/11 attacks; Homeland Security Secretary Markwayne Mullin said there was no sign of a threat to the country and “this isn’t another 9/11”", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/all-departing-us-flights-grounded-due-to-communication-outage/article71700667.ece", "state_media": false, "category": "社会", "full_text": "All flights in the U.S. were grounded on Friday (November 13, 2026), sparking travel chaos across the vast country, after what government officials said was a major communications outage, insisting it was not the result of any “nefarious attack.”\nThe nationwide stop left tens of thousands of passengers in limbo, with some pulled off planes moments before departure by airline staff who appeared in the dark about unfolding events.\nThe incident marked only the second time such an alert was given in U.S. airspace since the 9/11 attacks.\n“So supposedly, nobody’s flying, but they haven’t told the public yet,” said an exasperated Joseph Anderson, 72, who was trying to fly from Las Vegas to Oakland, California.\n“We’re trying to debate whether or not we need to reschedule or drive or what, but if the whole country is stopped, that means the highways are going to be jammed too.”\nThe Federal Aviation Administration “issued a nationwide ground stop for all U.S. airports following a communication issue impacting all Air Route Traffic Control Centres,” the agency said. “FAA technicians are investigating the issue.”\nIn a subsequent message on X, the agency described the problem as “a temporary telecommunications outage” and said it was acting “out of an abundance of caution.”\nHomeland Security Secretary Markwayne Mullin said there was no sign of a threat to the United States.\n“This isn’t another 9/11,” he said.\n“There was no indication, as of yet, that this was a nefarious attack against us, it’s just a telecommunication outage, as of right now,” Mr. Mullin said, adding officials were “not ruling out anything at this point.”\nThere was a short nationwide stop in January 2023 when a pilot notification system failed, but the only other national stop happened in the wake of the 9/11 attacks, when no aircraft took to the skies for days.\nFriday’s (November 13, 2026) FAA order came a day after U.S. Transportation Secretary Sean Duffy formally asked Congress for $30 billion to upgrade and modernise the U.S. Air Traffic Control System.\n“This investment is critical to complete the modernization of our national airspace — delivering a resilient telecommunications backbone for air traffic controllers, modern hardware and software, state-of-the-art control towers, and world-class airport infrastructure,” Mr. Duffy and Office of Management and Budget Director Russell Vought wrote in a letter to lawmakers.\nIt also came the same day that Microsoft apologised for a global outage that wreaked havoc for millions of users, public services and businesses worldwide.\nThe company ruled out any malicious “cyber or AI” activity as the cause of the disruption, which affected several Microsoft products from Thursday. Most operations had resumed by late Friday (November 14, 2026).\nConfusion and delays\nAt New York’s LaGuardia Airport, Tiara Johnson said she had been trying to get to Orlando for a concert with a friend.\n“They just keep delaying it... So it started out at 7:55. Then it went to 8:30, 9:30. Now it’s at 10:30. So we don’t know when it’s gonna leave,” she told AFP.\n“I feel very frustrated because you know, you come to the airport and then all of a sudden your whole plans have changed and you don’t know when you’re leaving, We’re kind of stuck.”\nAt Harry Reid International Airport in Las Vegas, airline staff gave conflicting information about the length of the ground stop, with one suggesting eight hours and another saying it could be 24.\nTravellers were left in the dark, with some saying they had been told their flight was delayed because of wind, while others were left to gather what information they could.\nBoards at the airport continued to show departures leaving as normal, while mobile boarding passes held by those stuck on the ground appeared to show their flight on its way.\nStranded passengers were scrambling to find alternatives, with long lines forming at rental car counters at the airport in Las Vegas.\nSusan Sardina said she had boarded her flight back to Orange County, California when staff told passengers there was a problem.\n“We were already on our flight to leave and we were told to get off,” she told AFP as she stood in a lengthy queue for a rental car.\nPublished - November 14, 2026 05:34 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "マイクロソフト障害 LIVE: 完全復旧の見通しなし、同社が発表", "title_en": "Microsoft Outage LIVE: No ETA yet on full recovery, company says", "summary_ja": "マイクロソフトは11月13日、Outlookメールサービスを含む複数のワークプロダクトに影響する大規模な障害を経験しました。同社は技術的な問題が原因であり、サイバー攻撃やAIとは関連がないと述べています。現在、サービスの段階的な復旧が進行中ですが、完全復旧のめどは立っていません。", "summary_en": "Microsoft services are beginning to come back online after a massive global outage left millions of users without access for nearly 18 hours", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/technology/microsoft-outage-live-updates-november-13-2026-steps-to-fix-outlook-and-other-apps-ongoing/article71696624.ece", "state_media": false, "category": "社会", "full_text": "Explained | Microsoft Outage: Why did Microsoft Outlook and other products go offline globally?\nThe story so far: Software giant Microsoft is facing a widespread outage affecting users of its Outlook email service, as well as its other workplace products. Thousands of Microsoft users in India awakened on Friday (November 13, 2026) to find their inboxes inaccessible, losing hours of productivity. According to DownDetector, over 100,000 users had initially registered complaints about Microsoft Outlook.\n- November 14, 2026 05:50No indication FAA’s nationwide ground stop is related to any Microsoft services: Microsoft “We have no indication that the FAA’s nationwide ground stop is related to any Microsoft services,” Microsoft said in an update on social media. To read more on the ground stop, click here\n- November 14, 2026 01:56No ETA yet on full recovery, says Microsoft Microsoft says that the company does not have an ETA for a full recovery of Microsoft 365 services yet. “Still draining queued messages and rebalancing traffic; customers may see improved sign-in/access,” the company said. - Reuters\n- November 13, 2026 22:32Microsoft apologises for outage, says it was not linked to cyber or AI Microsoft, in a post on X, said it was “deeply sorry” for the disruption and was seeing “broad recovery and stability” across its services. It said the outage was a technical issue “not related to cyber or AI / agents”, introduced during an earlier network capacity upgrade and surfaced after a recent network change. It said services were restored gradually, validating stability at each stage, and promised a full post-incident report once its review is complete.\n- November 13, 2026 22:24Microsoft outage impacts IndiGo and Air India’s email support services IndiGo said its email support services have been impacted by the Microsoft service disruption. In a post on X, the country’s largest airline said all other support channels remain available. “Due to a global Microsoft service disruption, our email support services are currently impacted, and we may not be able to receive your emails,” the carrier said. Read more here\n- November 13, 2026 21:42Microsoft 365 reports recovery progress; rules out cyberattack Microsoft 365 has reported improving service availability and email delivery performance across affected infrastructure, adding that there is no indication that the outage was caused by malicious or cyber activity. The company said its teams are reviewing the incident and working to prevent similar disruptions in the future.\n- November 13, 2026 20:06Microsoft begins restoring Outlook, Teams and other services after global outage Microsoft says service availability is improving, with email queues significantly reduced and approaching normal levels. However, some users may continue to face intermittent access issues and delayed email delivery as the company restores affected infrastructure and monitors recovery.\n- November 13, 2026 19:00Broader recovery seen in North America, much of Europe Microsoft said it was seeing continued recovery progress across affected regions, with broader improvements in North America and across much of Europe.\n- November 13, 2026 18:54Microsoft says email delivery recovering across growing portion of affected 365 systems Microsoft said service availability and email delivery were improving across a growing portion of the affected Microsoft 365 infrastructure, though some users may still face intermittent issues. It is prioritising reducing the email queue and backlog, and the extended 48-hour email timeout window stays in place to protect delayed messages.\n- November 13, 2026 17:25Microsoft outage having ‘serious impact’ on UK health service An issue affecting Microsoft products worldwide was having a “serious impact” on Britain’s National Health Service (NHS), Rachel Harrison, public services head at the GMB union, said on Friday (November 13, 2026). Staff receiving emergency calls were “unable to refer patient details in the normal way,” creating “a massive backlog,” though emergency and life-threatening call-outs “appear to be unaffected,” she said. Microsoft ruled out “malicious” activity. The National Pharmacy Association said the outage was delaying prescriptions by affecting pharmacies’ communication with doctors’ offices. -AFP\n- November 13, 2026 17:20Recovery actions completed across parts of Asia Pacific infrastructure: Microsoft Microsoft said that traffic was being gradually restored, with improvements in key customer scenarios, and that recovery actions had been completed across portions of the affected infrastructure in the Asia Pacific region. It said the focus was now on extending recovery across affected infrastructure in other regions. -Reuters\n- November 13, 2026 16:36Supreme Court of U.K. not receiving emails “The Court is aware of the global outage affecting Microsoft systems. The Court is currently not receiving emails, but the Portal and contact forms are still functionin", "translation_ja": "", "vocab": []}, {"title_ja": "ニューオーリンズのミシシッピ川でタンカーが河川クルーズ船に衝突、180人乗船、救助活動進行中", "title_en": "Tanker hits a river cruise boat on Mississippi River in New Orleans; rescue operations under way", "summary_ja": "ニューオーリンズで11月13日、操舵を失ったアスファルトタンカーが、180人を乗せた係留中の河川クルーズ船「アメリカン・ヘリテージ」に衝突しました。乗客乗員全員が生き残りましたが、船が傾いて転覆し、32人が病院に搬送されました。ニューオーリンズのモレーノ市長は、この事故を「ミシシッピ川の奇跡」と呼びました。", "summary_en": "All aboard survived after the crash prompted a massive rescue operation for passengers and crew who plunged into the Mississippi River as the ship took on water and began to topple over; ‘miracle on the Mississippi”, says New Orleans Mayor", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/new-orleans-usa-tanker-ship-river-cruise-crash-updates/article71699607.ece", "state_media": false, "category": "社会", "full_text": "A tanker in New Orleans that apparently lost its steering slammed into a docked river cruise boat with 180 people aboard on Friday (November 13, 2026), the Mayor said. All aboard survived after the crash prompted a massive rescue operation for passengers and crew who plunged into the Mississippi River as the ship took on water and began to topple over.\nVideo from the scene showed the much larger Atlantic Asphalt tanker hit the cruise boat while it was docked as metal and glass crashed and crunched.\nTugboat operators, nearby workers, police and several other rescuers rushed to help. New Orleans Mayor Helena Moreno called it “a miracle on the Mississippi.”\nThe Mayor said 32 people were taken to the hospital, but none of them had critical injuries.\nThe boat started listing within minutes and flipped while emergency workers were still trying to get everyone off the ship.\nDozens of people on board and at least two police officers were dragged from the 19°C river onto nearby ships.\nDevon Flanagan was at his job nearby at the Port of New Orleans when workers rushed down the dock. He got out of his truck and saw the American Heritage on its side and passengers in the water.\n“It was just chaos,” he said. “You had all types of ships, like other barges and other companies down there trying to help out, which also was a little convoluted because you had people still in the water.”\nThe cruise ship was built in 2015 and operated by American Cruise Lines. It is five stories and can hold up to 150 passengers.\nThe American Heritage was finishing an eight-day cruise to several Mississippi River destinations in Louisiana and Mississippi.\nThe cruise line said it was working with the Coast Guard and would share more information when it can.\nThe tanker involved in the crash specialises in carrying large quantities of asphalt and bitumen, a semi-solid substance that is often used for road construction and roofing, according to the live shipping tracker MarineTraffic.\nShips carrying asphalt and bitumen are often heated well above 120°C to prevent the asphalt from solidifying on the ship, according to the maritime periodical Marine Insights. It is not immediately clear whether the ship was carrying any materials when the crash occurred.\nThe 160-metre-long vessel had a final destination in New Orleans, according to MarineTraffic, and was sailing under a flag for the Marshall Islands.\nPublished - November 14, 2026 02:23 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "マイクロソフト、Outlookの大規模障害で謝罪、AI エージェントとの関連を否定", "title_en": "Microsoft apologizes for widespread Outlook outage, denies it was related to AI agents - Toronto Star", "summary_ja": "マイクロソフトは、Outlookで発生した広範な障害について謝罪しました。同社は、この障害がAIエージェントに関連していないことを明確に否定しています。", "summary_en": "Microsoft apologizes for widespread Outlook outage, denies it was related to AI agents Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9AFBVV95cUxPWUE5djBSS3ZlSG1vZGpVTmQxOXgxOFQx
