・ティヌブを迎えて大規模集会を開催", "title_en": "Zamfara stands still as Gov Lawal hosts First Lady, Remi Tinubu for mega rally", "summary_ja": "ナイジェリアの大統領夫人オルレミ・ティヌブ上院議員がザムファラ州を訪問し、全進歩大会（APC）北西部女性大規模集会・支援プログラムに参加しました。ティヌブ夫人は、不安全、貧困、経済的機会の限定に直面する女性たちの福祉向上への連帯と支援を表明し、大統領がザムファラ州のために継続して取り組むことを伝えました。ダウダ・ラワル知事は、更新された希望イニシアティブを通じた彼女の継続的な支援に感謝しました。", "summary_en": "Mrs Tinubu described her visit as a powerful expression of solidarity and compassion, as well as a commitment to women’s welfare and advancement The post Zamfara stands still as Gov Lawal hosts First Lady, Remi Tinubu for mega rally appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/925054-zamfara-stands-still-as-gov-lawal-hosts-first-lady-remi-tinubu-for-mega-rally.html", "state_media": false, "category": "社会", "full_text": "The First Lady of Nigeria, Senator Oluremi Tinubu, received a rousing welcome from thousands of residents and supporters during her visit to Zamfara State.\nOn Tuesday, the Zamfara State Government hosted the APC North-West Women’s Mega Rally and Empowerment Programme at the Trade Fair Complex in Gusau.\nThe event, led by Zamfara First Lady Huriyya Dauda Lawal, brought together former Zamfara governors, the first ladies of the North-West, ministers and other key All Progressives Congress stakeholders.\nBefore the rally, Senator Tinubu met with the Zamfara State traditional rulers to seek their blessings.\nIn her remarks, Mrs Tinubu described her visit as a powerful expression of solidarity and compassion, as well as a commitment to women’s welfare and advancement, especially for those facing insecurity, poverty and limited economic opportunities.\nShe said, “This is the happiest day of my life. Except for Zamfara, I have been in all 36 states of Nigeria, including the FCT. I have always wanted to come to Zamfara, and today I have fulfilled that. Because it is now easy to come, this is just the beginning; I am coming back again. Mr President is also coming.\n“Before I start, I want to commiserate with you all for all the lives that were lost; they are very precious to us. May God forgive them, grant them Al-Jannatul Firdaus, and continue to be with us.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“Today is Juma’at; we have to be fast; we have empowerment to give to women. This is the only party that empowers during the campaign, and it is not about the campaign; we have been empowering from day one. And that is why it is not politics.\n“Earlier, I was also given a title in Zamfara, the ‘Jagaban Matan Arewa’ by the Chairman of the Zamfara State Council of Chiefs and Emir of Anka, Alhaji Attahiru Muhammad Ahmad. I thanked all the Emirs.\n“I love Zamfara. I am happy to be here. Mr President said I should tell you he will continue working for you. Nigeria will continue to prosper, in sha Allah.”\nEarlier, Governor Dauda Lawal thanked Senator Tinubu for her continued support through the Renewed Hope Initiative, including its Food Outreach Programme.\n“Your Excellency, Mother of the Nation, your presence today represents more than an official visit. You have set a record in the history of our dear Zamfara State.\n“Your Excellency, Distinguished ladies and gentlemen, in Zamfara State, we firmly believe that empowering women is not only our responsibility as a government; it is a needed and bankable investment in social and societal morality, economic prosperity, family stability, and sustainable peace.\n“I assure Your Excellency that Zamfara’s government and people unwaveringly support Mr President’s second term. With the women here and the men supporting them, Zamfara and the North West will deliver for Mr President come January 2027.”\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "気候変動対策の資金は発展途上国を『債務と災害』の悪循環から脱却させるべき──国連気候変動トップが主張", "title_en": "Finance must break developing countries from ‘debt and disaster’ loop – UN climate chief", "summary_ja": "国連気候変動枠組条約事務局のサイモン・スティール事務局長は、発展途上国が債務と災害の悪循環に陥っていると指摘し、気候資金は金額だけでなく条件を改善する必要があると述べました。2024年の気候資金の約70％がローンであり、サハラ以南のアフリカ諸国は受け取った気候資金の2倍以上を外債返済に充てているという現実があります。先進国主導による年3000億ドルの資金提供目標の実現には、助成金と譲許的融資を特に最貧国や島嶼開発途上国に優先する必要があると強調されています。", "summary_en": "“Meeting a financial target does not always meet countries’ needs. To do that, we need to look at how finance is delivered,” Mr Stiell said on Friday at the opening of a high-level ministerial dialogue on climate finance in Antalya, Turkey. The post Finance must break developing countries from ‘debt", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/925050-finance-must-break-developing-countries-from-debt-and-disaster-loop-un-climate-chief.html", "state_media": false, "category": "政治", "full_text": "The executive secretary of UN Climate Change, Simon Stiell, told the ministers at COP31 that climate finance must be redesigned to lift developing countries out of a cycle of debt and disaster, adding that meeting a headline figure will not do it.\n“Meeting a financial target does not always meet countries’ needs. To do that, we need to look at how finance is delivered,” Mr Stiell said on Friday at the opening of a high-level ministerial dialogue on climate finance in Antalya, Turkey.\nCountries agreed at COP29 that developed nations would lead in providing $300 billion a year by 2035, as part of a wider effort to raise $1.3 trillion annually from all sources.\nMr Stiell said the roadmap for reaching those sums “must become reality”, but that the terms of the money mattered as much as the amount.\n“Many developing countries are trapped in a downward loop of debt, disaster, and devastating capital costs,” he said. “The threat of floods, fires, storms and droughts hangs over them, pushing up the price of borrowing even before disaster strikes.”\nHe stated that the terms of finance should reflect each country’s debt position.\n“Private finance, loans and guarantees are essential to achieving our collective goals. But grant-based and highly concessional finance will remain critical, particularly for Least Developed Countries, Small Island Developing States and other very vulnerable economies,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nAccording to him, broader action on debt is also needed to prevent countries from being forced to choose between repayments and resilience.\nInternational climate finance for developing countries reached about $137 billion in 2024, and almost 70 per cent of it came in the form of loans, according to a UN Women flagship report released on Tuesday in Antalya.\nCountries in sub-Saharan Africa paid more than twice as much in external debt service between 2021 and 2023 as they received in climate finance, according to an analysis published by the Heinrich Böll Foundation.\nThe analysis found that interest payments consumed more than 10 per cent of government revenue in 27 African countries in 2024.\nThe chair of the African Group of Negotiators, Nana Antwi-Boasiako Amoah, has said that a transition could not be called just if poorer countries have to “mortgage their futures” to pay for it.\nThe group lost a bid on Monday for a separate agenda item on tripling adaptation finance. It now wants the target prioritised in the summit’s cover decision.\nNigeria is not on the UN’s list of least developed countries, which places it among the states the UN climate chief expects to rely more on loans, guarantees and private capital.\nIt needs about $337 billion between 2026 and 2035 to implement its climate commitments, according to the National Council on Climate Change.\nOmotenioye Majekodunmi, the agency’s director-general, said more than 80 per cent of that will have to come from private investment, commercial debt, and international carbon finance.\nAbout $2.5 billion a year went to climate action in Nigeria in 2021 and 2022, counting domestic and international sources, according to the Climate Policy Initiative’s tracking.\nThe dialogue was the last in a series that began in 2013, and its conclusions will go to COP32 in Ethiopia next year, Mr Stiell said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリアの妊産婦死亡の大部分が北部地域に集中 - 報告書", "title_en": "North accounts for most of Nigeria’s recorded maternal deaths – Report", "summary_ja": "ナイジェリア北部の女性は妊産婦死亡で不均衡な負担を抱えており、北西部と北東部の地政学的地域が医療施設での報告死亡の約4分の3を占めています。農村部の妊産婦死亡率は10万出産あたり656件と都市部の444件を上回っており、地域と都市部で大きな格差があります。ナイジェリアの妊産婦死亡率は10万出産あたり572件で、2030年のSDG目標である70件を大きく上回っており、依然として深刻な公衆衛生上の課題となっています。", "summary_en": "According to the report, Nigeria recorded thousands of maternal deaths in health facilities between January and September 2026. The post North accounts for most of Nigeria&#8217;s recorded maternal deaths – Report appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/925047-north-accounts-for-most-of-nigerias-recorded-maternal-deaths-report.html", "state_media": false, "category": "社会", "full_text": "Women in northern Nigeria continue to bear a disproportionate burden of maternal deaths, with the Northwest and Northeast geopolitical zones accounting for about three-quarters of reported fatalities in health facilities, according to the 2026 Joint Annual Review (JAR) Statistical Book.\nThe report also highlights significant disparities in maternal health outcomes between rural and urban areas, with rural women recording a maternal mortality ratio of 656 deaths per 100,000 live births, compared with 444 deaths per 100,000 live births in urban areas.\nProduced by the Federal Ministry of Health and Social Welfare, the report reviews the third year of implementation of the Health Sector Strategic Blueprint. It was presented at the third Nigeria Health Sector Joint Annual Review in Abuja on 10 November.\nThe findings highlight persistent inequalities in maternal healthcare access and outcomes, despite a reported decline in maternal deaths across health facilities nationally.\nAccording to the report, Nigeria recorded thousands of maternal deaths in health facilities between January and September 2026, although the figures represent only deaths captured by the facility reporting system.\nThe ministry acknowledged that the figures could be underreported or overreported but described the data as reliable for monitoring trends in the health sector.\nMaternal mortality remains high\nMaternal mortality refers to the death of a woman during pregnancy, childbirth or within 42 days of the termination of pregnancy from causes related to or aggravated by the pregnancy or its management.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMost maternal deaths are preventable through timely access to quality antenatal care, skilled birth attendance, emergency obstetric services and appropriate postnatal care.\nDespite the reported improvements, Nigeria’s maternal mortality ratio remains a major public health concern.\nThe JAR Statistical Book puts the country’s maternal mortality ratio at 572 deaths per 100,000 live births, significantly above the Sustainable Development Goal (SDG) target of fewer than 70 deaths per 100,000 live births by 2030.\nThe burden is particularly concerning given Nigeria’s contribution to global maternal deaths.\nIn its 2023 report, titled “Improving Maternal and Newborn Health and Survival and Reducing Stillbirths: Progress Report 2023”, the World Health Organisation (WHO) estimated that Nigeria recorded 82,000 maternal deaths, 181,000 stillbirths and 277,000 neonatal deaths in 2020.\nThe combined 540,000 deaths accounted for 12 per cent of global maternal, stillbirth and neonatal deaths, despite Nigeria contributing only six per cent of global live births.\nThe report ranked Nigeria second after India among countries with the highest combined burden of maternal deaths, stillbirths and neonatal deaths.\nReported maternal deaths decline\nThe JAR data indicate a downward trend in facility-reported maternal deaths over the review period.\nThe country recorded 5,391 maternal deaths in health facilities in 2024, compared with 4,455 in 2025.\nThe figure declined further in 2026, although the exact total requires confirmation against the final statistical table. The quarterly data also indicate improvements.\nFollowing a peak in the second quarter of 2024, maternal deaths and the maternal mortality ratio generally declined. By the third quarter of 2026, the maternal mortality ratio had fallen to 128 deaths per 100,000 live births, representing a reduction of about 46 per cent from the earlier peak.\nMaternal deaths during the same period also declined by approximately 40 per cent to 947.\nHowever, these improvements have not been evenly distributed across the country.\nNorthern states bear the burden\nAccording to the report, maternal deaths over the past three years were heavily concentrated in the Northwest and Northeast geopolitical zones.\nBy 2026, the two zones together accounted for approximately three-quarters of all documented maternal deaths in health facilities.\nThe five northern states with the highest maternal mortality burden were Kano, Borno, Jigawa, Yobe and Katsina.\nWhile the national figures showed a downward trend, maternal deaths reportedly increased across the two northern zones, contrasting with reductions recorded in southern parts of the country.\nALSO READ: Faith leaders urged to confront beliefs, family decisions driving maternal deaths in Kano\nIn most southern states, fewer than 50 maternal deaths were reported. The states with the lowest recorded numbers included Osun (four deaths), Abia (five), Enugu (eight), Ekiti (nine), and Bayelsa (nine).\nMaternal morbidity\nBeyond deaths, the report also highlights the burden of maternal morbidity, including complications that can have lasting effects on women’s health, wellbeing and livelihoods. In 2026, approximately 3,060 women were diagnosed with v", "translation_ja": "", "vocab": []}, {"title_ja": "アイゼンコット前参謀総長、ネタニヤフ首相のアラブ人に対する「人種差別的」敵意扇動を非難", "title_en": "Eisenkot Accuses Netanyahu of Fueling ‘Racist’ Hostility Against Arabs", "summary_ja": "イスラエルの前参謀総長ガディ・アイゼンコット氏は、ベンヤミン・ネタニヤフ首相が分裂的な演説でアラブ系議員を攻撃した数日後に、同首相を厳しく批判した。アイゼンコット氏は首相がアラブ人に対する「人種差別的」な敵意を煽っていると指摘している。", "summary_en": "Gadi Eisenkot sharply criticized Prime Minister Benjamin Netanyahu days after the Israeli leader attacked Arab lawmakers in a divisive speech.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/13/world/middleeast/eisenkot-netanyahu-racism-arabs.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "殺し屋の間に挟まれて：一方にはエボラ、もう一方にはイスラム国", "title_en": "Caught Between Killers: Ebola on One Side, Islamic State on the Other", "summary_ja": "コンゴの急速に拡大する感染症の新たな震源地は、反政府勢力による暴力で傷ついた地域です。この地域での医療対応者の支援活動は、武装勢力による危険と感染拡大という二重の脅威に直面しています。エボラウイルスの封じ込めと地域の治安維持という極めて困難な課題に、国際的な対応が急務となっています。", "summary_en": "The new epicenter of Congo’s fast-spreading outbreak is a region scarred by rebel violence. Responders are struggling to help it.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/11/13/world/africa/ebola-congo-isis.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国とイスラエルの関係は破綻している。アイゼンコットが修復する方法", "title_en": "The U.S.-Israel Relationship Is Broken. Here’s How Eisenkot s Taiwan", "summary_ja": "マレーシアのコーヒーショップ「ポーラム・コピティアム」の店主が、顧客の死亡につながった中毒事件の責任で22ヶ月の懲役刑を言い渡された。本事件は食品衛生管理の重大な過失を巡る法廷審理の結果である。", "summary_en": "Polam Kopitiam owner sentenced to 22 months in fatal poisoning case Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE5WVDRrM3VFYVA5UGtZRXg0ZVhQN3d3QVVtV2VkZnNzcHVpMWtsVjhnejY4eW9YNFo0MXFxbnlYUUhhQkJ5TTAtRWU3RWhjWkE1bmhxX29n?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エイサー創業者スタン・シー氏、2026年APEC首脳会議台湾代表に任命", "title_en": "Acer founder Stan Shih named Taiwan's envoy to 2026 APEC summit - Focus Taiwan", "summary_ja": "台湾のコンピュータメーカー、エイサーの創業者であるスタン・シー氏が、2026年にタイで開催されるAPEC首脳会議における台湾の特使に任命された。この任命は、経済的影響力を持つ国際的な舞台における台湾の代表を務める重要な役割である。シー氏の豊富なビジネス経験と国際的な地位が、台湾の外交活動を強化すると期待されている。", "summary_en": "Acer founder Stan Shih named Taiwan's envoy to 2026 APEC summit Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1wZFNnQzFPU1dMcTAxUXl6R0NwOHdRUTVBRnlrM1JrOE1IQlZKR2QwODJwenFoaTByeVdxdng3UWw1Qi1xTkV2aUNnWWZGLUo3NXFwOTl3Zw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イタリアの複数の学校が爆弾脅迫メールで避難", "title_en": "Several schools in Italy evacuated after emailed bomb threats", "summary_ja": "CGTNが報じたところによると、イタリアの複数地域の学校が木曜日に爆弾脅迫メールを受け取りました。ベネト州、リグーリア州、ウンブリア州、ラツィオ州およびシチリア州を含む各地の学校が対象となったと地元メディアが伝えています。", "summary_en": "New bomb threat emails have been sent to schools in several parts of Italy on Thursday, including the Veneto, Liguria, Umbria and Lazio regions, as well as Sicily, local media reported.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-12/news-1S0WU96uphK/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "COP31でグローバルリーダーが緊急の気候行動と資金改革を呼びかけ", "title_en": "Global leaders call for urgent climate action, finance reform at COP31", "summary_ja": "CGTN報道によると、国連気候変動会議第31回会議(COP31)のアンタルヤ首脳サミットが水曜日に開幕し、気候公約を具体的行動に転換することに焦点が当てられています。この会議では、緊急の気候対策と国際的な資金メカニズムの改革が主要な議論テーマとなっています。", "summary_en": "The Antalya Leaders' Summit of the 31st United Nations Climate Change Conference (COP31) opened on Wednesday, with a focus on turning climate commitments into concrete action.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-12/Global-leaders-call-for-urgent-climate-action-finance-reform-at-COP31-1S0sfls2GeA/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ氏のワシントンD.C.の壮大なアーチは現実になるのか？", "title_en": "Will Trump’s grand Washington D.C. arch become a reality?", "summary_ja": "CGTNは、トランプ前大統領がワシントンD.C.に壮大なアーチの建設を計画していると報道している。同メディアは、この建設プロジェクトが実現するかどうかについて検討している。プロジェクトの実現可能性と政治的影響については、今後の注視が必要とされている。", "summary_en": "Will Trump’s grand Washington D.C. arch become a reality?", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-11-11/Will-Trump-s-grand-Washington-D-C-arch-become-a-reality--1RYvixPdyo0/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英国軍事基地でセキュリティサイレンが本日2度目の発動 — 新聞報道", "title_en": "Security siren goes off at UK military base for second time today — newspaper", "summary_ja": "TASSの報道によると、イギリス東部ノーフォーク州に位置するフェルトウェル基地でセキュリティサイレンが本日2度目に鳴動したとのこと。基地の警報システムが複数回作動したこの事態について、詳細は現在のところ明らかにされていない。", "summary_en": "The Feltwell base is located in Norfolk in eastern England", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2218063", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国で1万便以上が遅延またはキャンセル——ウェブサイト", "title_en": "Over 10,000 flights delayed or canceled in US — website", "summary_ja": "RTが報じたところによると、米国の複数の空港からの便の運航停止が発生し、1万便以上が遅延またはキャンセルされたという。米国国土安全保障長官マークウェイン・マリンは、当局が現在のところこの事態が「悪意のある」行為によって引き起こされたという兆候は見ていないと述べた。", "summary_en": "US Secretary of Homeland Security Markwayne Mullin said that the authorities currently see no signs that \"nefarious\" acts caused the suspension of flights from airports across the country", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2218061", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米当局、航空交通管制システムの障害におけるAIの役割の可能性を調査", "title_en": "US authorities investige potential role of AI in air traffic control systems' malfunction", "summary_ja": "TASSは、全国の空港からの便が22の航空路交通管制センターの機器の問題により運航停止されたと報じている。米当局は航空交通管制システムの障害におけるAIの潜在的な役割について調査を進めているとTASS/RTが伝えている。", "summary_en": "The authorities have suspended flights from all airports nationwide due to equipment problems at 22 Air Route Traffic Control Centers", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2218059", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "レアアース・ゲーム", "title_en": "The Rare-Earth Game", "summary_ja": "著者は、中国はレアアース禁輸を実際には実行しないが、その脅威を生かし続け、西側諸国は完全な自給率を達成しないものの、コストのかかる生産能力の重複とストックパイルを通じてサプライチェーン・ショックへの脆弱性を減らそうとし続けると論じている。経済安全保障は各国政府の重要な関心事であり、大経済圏特にEUと米国が具体的な措置を実施している一方で、小規模経済は経済的いじめや強制に対する脆弱性を減らすための唯一の現実的な選択肢として多角化を必要とすると述べている。", "summary_en": "China will probably not impose a rare-earth embargo, but it will keep the specter of one alive. And the West will probably not achieve self-sufficiency in this critical sector, but it will keep seeking to reduce its vulnerability to a supply shock through expensive capacity duplication and stockpile", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-rare-earth-embargo-unlikely-but-us-and-eu-will-pay-a-high-price-to-prepare-for-one-by-daniel-gros-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nThe Rare-Earth Game\nChina will probably not impose a rare-earth embargo, but it will keep the specter of one alive. And the West will probably not achieve self-sufficiency in this critical sector, but it will keep seeking to reduce its vulnerability to a supply shock through expensive capacity duplication and stockpiles.\nBERLIN—Economic security is top of mind for governments around the world. But it is mostly the largest economies, especially the European Union and the United States, that are implementing concrete measures aimed at bolstering it, whether by forcing their economic partners to alter their behavior or finding alternatives. For smaller economies, the only real option for reducing vulnerability to bullying and coercion is diversification.", "translation_ja": "", "vocab": []}, {"title_ja": "なぜ研究が重要なのか", "title_en": "Why Research Matters", "summary_ja": "著者は、研究に最も効果的に活用してきた国が、研究予算の削減、研究機関の閉鎖、助成金決定の政治化、そして大学への圧力を加えていることに警告を鳴らしている。研究は人々の寿命延長、健康促進、生活の質向上をもたらす不可欠なツールであり、その軽視がもたらす代償は多くの人々が認識しているよりもはるかに大きいと主張している。", "summary_en": "Over the past 21 months, in the country that has leveraged research to greatest effect, the government is slashing funding for it, closing centers where it is done, politicizing grant-making decisions, and bullying its single biggest engine: universities. The costs will be far greater than many real", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trump-white-house-attacks-on-research-by-peter-n-miller-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nWhy Research Matters\nOver the past 21 months, in the country that has leveraged research to greatest effect, the government is slashing funding for it, closing centers where it is done, politicizing grant-making decisions, and bullying its single biggest engine: universities. The costs will be far greater than many realize.\nROME—If you learned that there was a tool that could expand your understanding of every aspect of the world you lived in, helping you lead a longer, healthier life and providing inventions that would make that life more pleasant and interesting, would you want it? Would you pay for it? Would you want your government to support it?", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカに必要な異なる形の気候資金", "title_en": "Africa Needs a Different Kind of Climate Finance", "summary_ja": "アフリカへの気候資金の約51%が債務の形で供給されており、その82%が市場金利で貸し出されている。多国間および二国間開発金融機関が、既に高い債務負担を抱えているアフリカ経済に対して商業金利で融資しているという矛盾が存在している。気候資金の形態を変え、より多くの譲許的支援（グラント）と低利融資を提供することが、アフリカの財政的余裕を最大化するために必要であると著者は主張している。", "summary_en": "Roughly half of the climate finance that flows to Africa comes in the form of debt, with multilateral and bilateral development-finance institutions often lending at commercial rates to economies already struggling to carry the added costs. To maximize fiscal space, the instruments used to deliver c", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/africa-needs-less-debt-based-climate-finance-by-penelope-gregoriou-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nAfrica Needs a Different Kind of Climate Finance\nRoughly half of the climate finance that flows to Africa comes in the form of debt, with multilateral and bilateral development-finance institutions often lending at commercial rates to economies already struggling to carry the added costs. To maximize fiscal space, the instruments used to deliver climate finance need to change.\nJOHANNESBURG—Discussions about climate finance follow a familiar script: a financing gap is declared, pledges are announced, and the size of the commitments is the main concern. But the form that financing takes matters as much as the amount of money pledged, particularly in Africa.\nAccording to the Climate Policy Initiative’s most recent data, climate-finance flows to Sub-Saharan Africa reached $55 billion in 2024, more than double the 2019 level. This represents important progress. But the continent still faces several challenges.\nFor starters, the CPI’s report “Landscape of Climate Finance in Africa 2024” showed high levels of concentration, with ten countries receiving 50% of Africa’s climate-finance flows, while the continent’s ten most climate-vulnerable countries received only 10%. The difference is even starker for private climate finance, 76% of which goes to ten countries, further narrowing access to capital. Meanwhile, multilateral climate funds under the United Nations Framework Convention on Climate Change, which are meant to deliver concessional support, account for only 2% of Africa’s climate finance.\nPerhaps more importantly, the report found that as much as 51% of climate finance to Africa comes in the form of debt, evenly split between concessional and market-rate borrowing. By contrast, debt accounts for only 18% of climate finance in East Asia and the Pacific, and 20% in Latin America and the Caribbean.\nIt is also worth noting that 82% of Africa’s debt-based climate finance priced at market rates comes from official sources, mainly multilateral and bilateral development-finance institutions. The contradiction is glaring. Institutions that are supposed to support sustainable economic growth, create jobs, and improve social outcomes by financing businesses and projects deemed too risky or unattractive for private investment are lending at commercial rates to economies already struggling to carry the added costs.\nTo be sure, this is partly a response to Africa’s immense climate-finance needs, which are estimated at just under $2 trillion until 2030, of which only 23% is currently being met. But instead of continuing to rely on debt-based lending, development-finance institutions must change the instruments through which climate finance is delivered.\nAs ActionAid’s new report finds, debt is a major barrier to green investment. In 2026, 54 of the world’s most climate-vulnerable countries, many of them in Africa, will spend $304.8 billion on servicing debt, compared to $12.3 billion on climate action. That is a ratio of nearly 25 to one. While most of this debt was not borrowed specifically for climate action, servicing it still leaves policymakers with limited fiscal space for investing in such measures, with debt repayment absorbing 65% of their combined national revenue.\nThe implications for national climate plans, known as nationally determined contributions (NDCs), are profound. The climate-vulnerable countries assessed in ActionAid’s report have budgeted for only one-quarter of their combined unconditional NDC costs, with Tanzania allocating 0.9% of its unconditional NDCs costs and Malawi allocating 10.3%. Zambia has devoted just 0.32% of its budget to climate policies, highlighting the constraints debt-burdened governments face in using public finance to fund their NDCs.\nAddressing these countries’ fiscal constraints requires reporting climate finance in a way that reflects its actual worth. A loan that must be repaid with interest is currently counted the same as a grant of equivalent size, which ends up overstating how much support is reaching Africa. Reporting a loan’s concessional portion rather than its full value would provide a clearer picture. The OECD’s Development Assistance Committee uses this method to measure official development assistance.\nMoreover, the recipient country’s debt position should be taken into consideration when determining the concessionality of loans, so that countries at moderate or high risk of debt distress receive grants rather than being saddled with an even heavier burden.\nThere is also a strong case for lending in local currencies, so that borrowers are not also carrying exchange-rate risk, and mobilizing Africa’s domestic capital. Even though international sources provide 87% of Africa’s tracked climate finance, the continent has roughly $2.4 trillion in domestically managed bank, insurance, and pension assets.\nRecent domestic issuances have shown what is possible with the right regulatory frameworks and financial instruments. In February 2024, Tanzania", "translation_ja": "", "vocab": []}, {"title_ja": "チャック・シューマーとクリス・ヴァン・ホレンの上院指導部選挙が意味するもの", "title_en": "What the choice between Chuck Schumer and Chris Van Hollen for Senate leader is all about | Bernie Sanders", "summary_ja": "バーニー・サンダース議員は、民主党上院指導部選挙はシューマー現指導者とヴァン・ホレンの間の人格的な競争ではなく、民主党の将来についての根本的な議論であると主張している。富豪の献金者や業界ロビイストが支配する現状維持派に対抗し、労働家族を代表する草の根政党へと党を変革すべきだと述べている。所得格差、医療制度改革、気候変動、移民政策など、既得権益に立ち向かい、普通のアメリカ人の利益を守る指導者の選出が必要だというのが主張の要点である。", "summary_en": "This is not a personality contest. This is a debate about the future of the Democratic party The election for Democratic Senate leader between Chuck Schumer and Chris Van Hollen must be understood for what it is. This is not a personality contest. This is a debate about the future of the Democratic ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/13/chuck-schumer-chris-van-hollen-senate-leader", "state_media": false, "category": "オピニオン", "full_text": "The election for Democratic Senate leader between Chuck Schumer and Chris Van Hollen must be understood for what it is.\nThis is not a personality contest. This is a debate about the future of the Democratic party. It is a debate about whether the Democratic party remains a top-down party dominated by billionaire campaign contributors, inside-the-beltway consultants and 30-second TV ads, or whether we can transform it into a grassroots party of, by and for the working families of our country.\nThe election for Democratic Senate leader will determine whether we continue to tinker around the edges and maintain status quo policies, or whether we finally have the courage to take on enormously powerful special interests and address the unprecedented crises that we face.\nFor example:\nDo we address the issue of oligarchy, obscene income and wealth inequality, and the reality that never before in the history of our country have so few people held so much wealth and so much power?\nDo we address the issue of a corrupt campaign finance system and their Super Pacs, which enables billionaires to buy elections and undermine our democracy?\nDo we address the issue that, in the wealthiest country in the history of the world, 60% of our people live paycheck to paycheck, we have the highest rate of childhood poverty of any major country and millions of seniors are unable to retire with dignity\nDo we address the reality that our current healthcare system is dysfunctional, wildly expensive and that we are the only major country on earth that does not guarantee healthcare for all as a human right?\nDo we address the reality that artificial intelligence, the most transformative technology in history, is being pushed down our throats by a handful of big tech billionaires who couldn’t care less about the wellbeing of ordinary Americans?\nDo we address the reality that climate change is causing deadly heatwaves, massive forest fires, drought and extreme weather disturbances and will only get worse if don’t transform our energy systems away from fossil fuels and into energy efficiency and sustainable energy?\nDo we address the reality that our immigration system is broken and that we have, with ICE, a domestic army that has killed Americans in cold blood and has acted in cruel, illegal and unconstitutional ways?\nDo we address the reality that the wars in Vietnam, Iraq and the current war in Iran were based on lies and that we need to fundamentally rethink our foreign policy, including continued military funding to the extremist government in Israel?\nBottom line: whether we like it or not, our country faces some extraordinary and unprecedented crises. Do we seriously address these difficult challenges, and restore the faith of the American people that their government can improve their lives, or do we continue the same old, same old politics?\nIn large measure, that is what this Senate Democratic leadership election is all about.\n- Bernie Sanders is a US senator, and ranking member of the health, education, labor and pensions committee. He represents the state of Vermont and is the longest-serving independent in the history of Congress", "translation_ja": "", "vocab": []}, {"title_ja": "ガーディアン論説：報道の自由について－独裁者がジャーナリズムを標的にするのはそれが重要だからである", "title_en": "The Guardian view on press freedom: authoritarians target journalism because it matters | Editorial", "summary_ja": "本論説は、エジプト、ロシア、その他の国々でジャーナリストに対する抑圧が急速に増加していることを指摘している。報道の自由は過去25年間で最低水準に達しており、ジャーナリストの殺害件数は2025年に過去最高を記録した。著者は、高品質のジャーナリズムが偽情報やAI生成コンテンツの蔓延に対抗するために今まで以上に必要であり、職業的メディア組織の消滅は陰謀論や虚偽情報の広がりを招くと主張している。", "summary_en": "From Cairo to Moscow to Washington, governments are turning up the pressure on media workers Lina Attalah is an influential Egyptian journalist. Yet until last month, even she was unaware of a major and concerning piece of news: her own conviction. In 2024, a court issued her a one-year sentence for", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/13/the-guardian-view-on-press-freedom-authoritarians-target-journalism-because-it-matters", "state_media": false, "category": "オピニオン", "full_text": "Lina Attalah is an influential Egyptian journalist. Yet until last month, even she was unaware of a major and concerning piece of news: her own conviction. In 2024, a court issued her a one-year sentence for “spreading false news” and running a website without a licence – which she had repeatedly sought to obtain – after trying her in absentia, even though she was in the country. Ms Attalah learned of the case only after she was separately tried in October, resulting in a large fine and an order for the closure of the Mada Masr website. She faces retrial later this month.\nMeanwhile, the entire newsroom of the fact-checking website Matsadash remain in detention weeks after authorities snatched the six journalists on charges including joining and financing a terrorist group and spreading false news. Their lawyers say that they have been tortured and forced to record fabricated confessions.\nOn Monday, Russia finally succeeded in silencing the famed Novaya Gazeta, which had spent decades battling growing repression. Six of its journalists, including Anna Politkovskaya, paid for their coverage with their lives. But the newspaper continued until, stripped of its newsroom, donation platforms and right to publish, it was forced to turn the lights off. (The separate Novaya Gazeta Europe, founded by many of its alumni, continues.)\nThese cases are part of a wider pattern. Press freedom is at its lowest ebb for a quarter of a century, Reporters Without Borders said this spring, judging more than half of the 180 countries it surveys to have “difficult” or “very serious” conditions for journalists. The rising tide of war worldwide is also increasing the pressures and dangers: the Committee to Protect Journalists recorded a new peak of 129 deaths of reporters and other media workers in 2025. Unesco said last week that almost nine out of 10 killings of journalists go unpunished.\nHigh-quality journalism has never been more necessary in a world of rising conflict, AI slop and malicious fabrications spreading on platforms run by big tech firms who barely nod to ethical responsibilities. As Ms Attalah herself has pointed out, the disappearance of professional media organisations enlarges the space for conspiracies and disinformation.\nYet while the US previously pressed the case of threatened journalists overseas, sometimes helping to ease their conditions, it is now led by a man who has called news media “the enemy of the American people”, whose FBI raided a correspondent’s home in January, and who is currently pursuing a $10bn lawsuit against the BBC. Donald Trump has also sought to dismantle federally funded organisations which were an important source of independent reporting on many repressive nations.\nThis week, an appeals court panel ruled that the administration had illegally fired the head of Voice of America. VoA, Radio Free Asia and Radio Free Europe have all struggled on thanks to dedicated staff, though hugely diminished. Recent elections in Serbia, Brazil and the US are evidence that journalism, alongside activism, can stem the erosion of democracy. Thousands of people protested in Turkey last month against Recep Tayyip Erdoğan’s media crackdown. Large parts of the public still want the truth and, against the odds, courageous journalists worldwide persist in finding it out and sharing it. That authoritarians target them so relentlessly only testifies to their importance.", "translation_ja": "", "vocab": []}, {"title_ja": "若い男性は青い波の鍵だった。私たちの研究がその理由を明かす | ブリジッド・シュルテとヘイリー・スウェンソン", "title_en": "Young men were key to the blue wave. Our research offers a reason why | Brigid Schulte and Haley Swenson", "summary_ja": "本稿は、2024年の選挙で若い男性が民主党の圧勝に貢献したことについて、著者らが実施した調査結果を基に分析している。調査によると、若い男性の60%以上がケアワーク（育児や介護）を有給労働と同等に価値があると考えており、70%が父親として積極的に関わることが男らしさの重要な部分だと考えている。著者らは、若い男性が政治的に求めているのは経済的安定性とともに、ケアに時間を割くことができる生活であり、トランプ政権が推進した有毒な男らしさのイデオロギーとは相容れないと主張している。", "summary_en": "Amid concerns over the influence of the manosphere, our findings show that young men are concerned about caregiving When young men helped propel Donald Trump into the White House in 2024, the administration doubled down on a brand of toxic masculinity popular in the so-called manosphere. They touted", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/13/young-men-us-midterms-democrats", "state_media": false, "category": "オピニオン", "full_text": "When young men helped propel Donald Trump into the White House in 2024, the administration doubled down on a brand of toxic masculinity popular in the so-called manosphere.\nThey touted high testosterone, male supremacy, and a “biblically-based family” where men work and provide, and deferential women stay home to bear children and care for others.\nIn a complete reversal, on 3 November, young men powered the blue tidal wave that swept away Maga’s hold on political power. Men 18 to 29 shifted nearly 40 points to help Democrats capture both Houses of Congress, flip seats in state legislatures, and win some unexpected governorships.\nTurns out, young men may not be so toxic after all. So what do they want?\nThe election results made clear that young men want financial stability at a time when the cost of living is soaring and jobs have become precarious, disposable and threatened by AI. But they also want time to give care.\nThat’s according to recent research we produced with NORC at the University of Chicago on men’s attitudes and experiences with care, based on a nationally representative survey of more than 3,000 Americans, with an oversample of young men 18-29.\nWe found that more than six in 10 young men value caregiving as much as paid work, even though many of them are not yet fathers or caring for a loved one.\nThirty percent of young men identify as caregivers, including 44% of young Hispanic men, who swung for Democrats by 47 points from 2024. Nearly six in 10 young men who have worked while giving care have reduced their work hours. Providing care while still earning enough to live is a major concern.\n“Everything is so expensive these days that a young person can’t even consider taking care of someone, as they can barely take care of themselves,” a 23-year-old male caregiver from Ohio shared in the survey.\nEight in 10 say that being an involved father is an important part of being a man. Seven in 10 say they’d be at least somewhat interested in being a stay-at-home parent if they had the choice.\nIn fact, six in 10 young men, compared to about four in 10 young women, said they’d be at least somewhat interested in being a full-time caregiver – hardly the answers politicians pandering with UFC fights on the White House lawn might have expected.\nAbdul, one of our survey respondents, began caring for his chronically ill father at age 19 because no one else in his family was available, and they couldn’t afford the high cost of paying for care. He missed classes, quit his job, and moved in with his extended family in order to care for his father until his death.\n“It was always nice for me to be there for my father, because he was there for me when I was young,” Abdul, now 26, told us. “I have no regrets. I would do it again.”\nOur survey did find that some young men hold traditional views on gender.\nMen ages 18 to 29 are nearly three times more likely than women of the same age group to say that it’s OK for men to do some care work, but women are better suited to do most of it (32% versus 12%). Young men are also more likely than young women to say that men’s role in the family should be providing financial support while women run the household (32% versus 14%).\nStill, these are minority viewpoints. More than 70% of young men say that care should be divided equally between men and women. Sixty percent said mothers and fathers do an equally good job of caring for a newborn, compared to just 52% of men over 30. And young men are more likely than young women to say gender does not play a role in who is best suited to care for an adult.\nHalf of young men said they are “somewhat” or “very” likely to need paid leave from work to care for a child in the future, about the same share as young women, and 44% anticipated needing leave to care for an adult family member.\nAmong young fathers who took paid leave to care for a child, 70% said having access to paid leave through their employer or state was a major reason they took it.\nAnd when we asked men who wanted to take caregiving leave from work, but didn’t, the most common reasons were that they couldn’t afford it, worried their careers would suffer, or that their workplaces weren’t supportive. Just 5% said taking leave wasn’t “manly”.\nNearly one-third of young men say they have “no control” over their work schedules, and while 33% work from home at least some of the time, 68% would prefer to, a 35-percentage-point gap between what young men have and what they want.\nPerhaps what young men want is what we all want: good work with living wages that ensure the ability to have and care for a family.\nInstead of disgruntled Republicans working to thwart Democrats at every turn in the next Congress, policymakers would do well to raise the minimum wage, help all families cover the high cost of care, and pass federal paid family and medical leave, and measures to give workers more flexibility and control over their schedules.\nEvidence suggests young men are moving beyond toxic ma", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ・習近平・プーチン首脳会談の正当性", "title_en": "The Case for a Trump-Xi-Putin Summit", "summary_ja": "本論説は、トランプ米大統領が中国の習近平指導者とロシアのプーチン大統領との三者首脳会談に参加すべきだと主張している。ヤルタ会談の再現や民主主義同盟国の売却への懸念は理解できるが、米国は専制主義国家との対話を正常化し、地政学的対立を緩和する必要があると述べている。著者は、トランプが限定的であっても意味のある進展を目指して、ウクライナ終結などの重要課題で三者間の対話から利益を得ることができると結論づけている。", "summary_en": "In just a few days’ time, U.S. President Donald Trump, Chinese leader Xi Jinping, and Russian President Vladimir Putin could be holding a three-way summit on the sidelines of next week’s Asia-Pacific Economic Cooperation meeting in Shenzhen, China. According to The Wall Street Journal, Putin floated", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/case-trump-xi-putin-summit", "state_media": false, "category": "オピニオン", "full_text": "In just a few days’ time, U.S. President Donald Trump, Chinese leader Xi Jinping, and Russian President Vladimir Putin could be holding a three-way summit on the sidelines of next week’s Asia-Pacific Economic Cooperation meeting in Shenzhen, China. According to The Wall Street Journal, Putin floated the idea of a trialogue last month as an opportunity to discuss ending the war in Ukraine. No firm plan has yet been announced, but even the prospect of this meeting has provoked widespread consternation. Polish Foreign Minister Radoslaw Sikorski warned against a repeat of the Yalta Conference of 1945, when U.S. President Franklin Roosevelt and British Prime Minister Winston Churchill capitulated to Soviet leader Joseph Stalin’s push for the Soviet Union to dominate Eastern Europe. U.S. Senator Chris Coons posted on X that “there can be no talks about Ukraine’s future without Ukraine at the table, and there can be no real negotiations as long as Trump signals weakness and servitude to Xi and Putin at every opportunity.”\nThese worries are entirely justified; Trump has a track record of cozying up to autocrats and turning his back on democratic allies. Should he sit down with Xi and Putin, he must avoid selling out European and Asian partners who will not be at the table. And given the three leaders’ headstrong personalities and competing national interests that pit the United States against what Xi calls a “no limits” partnership between China and Russia, the meeting might ultimately yield little progress on major issues.\nNevertheless, Trump would be right to join a summit with Xi and Putin. No U.S. president has ever held a trilateral meeting with the leaders of China and Russia, and the proposed talks would break the ice and begin to normalize much-needed dialogue. Authoritarianism is not going away, so autocracies and democracies must learn not only to live comfortably alongside one another but also to work together to tame geopolitical rivalry and tackle global challenges in an interdependent world. Americans will not find it easy to get along with the likes of Russia and China, whose political systems threaten the U.S. commitment to spreading democracy. But Trump is taking a bold step in the right direction by engaging with the heads of the world’s leading autocracies.\nIf he meets with Xi and Putin, Trump should aim low and focus on making meaningful, if limited, progress on a small number of core issues that could benefit from a three-way conversation: the flash points of the Korean Peninsula, Ukraine, and Iran, as well as arms control and strategic stability. But even if the summit yields no concrete results, it will nonetheless have been worthwhile. Trump, Xi, and Putin are paving the way for their successors to advance great-power cooperation across ideological lines and stabilize a fragmented world.\nCONCERTED EFFORT\nI have argued previously, including in a 2021 Foreign Affairs essay with Richard Haass, that a global concert—an informal steering group of great powers modeled on the nineteenth-century Concert of Europe—offers the best hope of curbing geopolitical competition and enabling collective action in a multipolar world. In addition to the United States, China, and Russia, a new concert would include India, Japan, the European Union, and representatives from Africa, Latin America, the Middle East, and Southeast Asia. Concerts sacrifice representation for efficacy and give only the geopolitically influential states that must be there a seat at the table. They set aside ideological differences and bring democracies and autocracies together to focus on international cooperation. Because concerts eschew binding, enforceable procedures in favor of informal consensus building, they can succeed when formal institutions such as the UN Security Council are paralyzed and when the United States wavers in its commitment to rules-based multilateralism.\nBut the time has not come for a global concert. Concerts function effectively only when their members are committed to the territorial status quo, are willing to exercise strategic restraint and pursue mutual benefits, and are ready to settle disputes diplomatically. Putin’s 2022 invasion of Ukraine and Xi’s decision to back Russia have, for now, scuttled hopes that the great powers will normalize restraint and the peaceful settlement of disputes. Meanwhile, Trump’s “America first” statecraft shuns joint action and mutual gain in favor of unilateralism.\nYet even though Trump, Xi, and Putin are the wrong leaders at the wrong time to establish a great-power steering group that other major players would eventually join, Trump’s iconoclastic diplomacy sets a useful precedent. His Alaska summit with Putin last year and two summits with Xi this year were admittedly long on pageantry and short on substance. But by taking the controversial step of pursuing joint talks with the two leaders, Trump is widening the diplomatic Overton window and expanding what is politically ", "translation_ja": "", "vocab": []}, {"title_ja": "世界最後の平和の機会", "title_en": "The World’s Last Chance for Peace", "summary_ja": "著者は、過去10年間で戦争が当たり前のものとして受け入れられるようになったことが最も危険だと主張している。第二次世界大戦後、国際社会は戦争を違法化する努力をしてきたが、イラク戦争以降その取り組みが弱まり、軍事支出や核兵器保有の検討が増加している。著者は、第三次世界大戦という大惨事を避けるため、各国が戦争を制約し国際機関を強化する「最大限の多国間主義」を実践する必要があると述べている。", "summary_en": "How to avert a new world war.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/spain/pedro-sanchez-world-last-chance-peace-avert-world-war", "state_media": false, "category": "オピニオン", "full_text": "At some point during the last decade, the world started accepting war as inevitable. Wars of aggression, from Ukraine to Lebanon to Iran, are on the rise, bringing horror, ruin, and the specter of a wider international confrontation. Governments increasingly treat war as something to budget and prepare for. Military spending is climbing, technological and arms races are intensifying, and more and more countries are considering whether they should acquire a nuclear deterrent to guarantee their security.\nNothing is more dangerous than the normalization of war. It represents a return to a norm that persisted for most of human history, when war was the main organizing principle of the international system. Armed conflict was the natural way for states to settle disputes or enlarge their territory at the expense of weaker neighbors.\n[Leer en español aquí.]\nYet the vast wreckage of World Wars I and II in the first half of the twentieth century made the status quo unacceptable. Countries united behind an effort to turn war from a legitimate instrument of statecraft into an outlawed act. Wars did not end in 1945, but for years after they were overwhelmingly condemned by the international community.\nIn recent decades, however, governments’ commitment to the cause of peace has weakened. Millions of people took to the streets in hundreds of cities to oppose the U.S.-led invasion of Iraq in 2003, but the war proceeded nonetheless. Fought on false premises and in violation of international law, it brought destruction to Iraq, fed regional instability, and fueled resentment and terrorism directed at Western countries. The conflict also marked a turning point. Ever since, the pursuit of peace has steadily receded from the international agenda amid deepening geopolitical competition and inattention or indifference to the multilateral efforts that for decades discouraged acts of war.\nAt the end of this path lies another world war—the catastrophe the twentieth-century order was designed to prevent. With that dire future looming, governments must relearn the art of opposing war. It is the responsibility of every country, including my own, Spain, to take direct action that constrains others’ ability to wage war and to strengthen the international institutions that will serve as guarantors of peace.\nThe success of this project will depend on an expansive multilateralism that I call “maxilateralism”—cooperation that embraces as many countries as possible, rather than being limited to small, ad hoc groupings. Its ambition is to make war increasingly impractical, even unimaginable. In 2003, protesters across Spain chanted “No a la guerra!’’—“No to war!” The world cannot afford to ignore them again.\nA DANGEROUS ESCALATION\nInternational efforts to reject war as an instrument of national policy date back to the Kellogg–Briand Pact of 1928, a treaty signed in Paris by 15 countries and joined by dozens more later. It was insufficient to prevent World War II, but it planted a seed. When representatives of 50 countries gathered in San Francisco in 1945 to create the United Nations, they revived the spirit and principles of Kellogg–Briand and gave them what they had lacked: institutional form. The UN Charter prohibited the threat or use of force against the territorial integrity or political independence of another state. And, unlike its 1928 predecessor, it backed up the prohibition with institutions empowered to enforce it.\nIn the decades that followed, these institutions established an order that penalized violations and created incentives for diplomacy and cooperation. At the same time, public opposition to war was growing stronger around the world. Popular defiance of Cold War militarism was visible in worldwide resistance to the Vietnam War and in mass movements against nuclear weapons. Pacifism reached its high-water mark in the 1990s, when a vibrant global civil society mobilized to defend humanitarian causes and when the United Nations held sufficient authority to champion a sweeping peace agenda.\nToday, however, there is more armed conflict than at any time since 1946. According to the Uppsala Conflict Data Program, there were 65 active conflicts involving governments in 2025, double the number in 2010. An estimated 250,000 people died in those conflicts—the highest annual death toll in 30 years, since the Rwandan genocide. Close to 120 million people worldwide have been forcibly displac rio a costa de vecinos más débiles.\n[Read in English here.]\nPero la inmensa devastación que produjeron las dos guerras mundiales en la primera mitad del siglo XX hizo inaceptable ese statu quo. Los países se unieron en un empeño común: que la guerra dejara de ser un instrumento legítimo de la política de Estado y pasara a ser un acto ilegal. Las guerras no terminaron en 1945, pero durante años la comunidad internacional las condenó de forma abrumadora.\nEn las últimas décadas, sin embargo, el compromiso de los gobiernos con la causa de la paz se ha debilitado. En 2003, millones de personas salieron a las calles en cientos de ciudades para oponerse a la invasión de Irak liderada por Estados Unidos. Y, aun así, la guerra siguió adelante. Iniciada a partir de premisas falsas y en violación del derecho internacional, arrasó Irak, agravó la inestabilidad regional y avivó el resentimiento y el terrorismo contra los países occidentales. Aquel conflicto marcó, además, un punto de inflexión. Desde entonces, la búsqueda de la paz ha ido retrocediendo en la agenda internacional, arrinconada por la creciente competencia geopolítica y la desatención o la indiferencia hacia los esfuerzos multilaterales que durante décadas pusieron freno a la guerra.\nEste camino conduce a una nueva guerra mundial: la catástrofe que el orden del siglo XX se propuso evitar. Ante ese futuro sombrío en el horizonte, los gobiernos deben reaprender el arte de oponerse a la guerra. Todos los países, incluido el mío, España, tienen la responsabilidad de actuar para limitar la capacidad de otros de librar la guerra y para fortalecer las instituciones internacionales que han de ser garantes de la paz.\nEl éxito de este proyecto dependerá de un multilateralismo expansivo, al que yo llamo «maxilateralismo»: una cooperación que abarque al mayor número posible de países, en lugar de limitarse a pequeñas coaliciones ad hoc. Su ambición es que la guerra resulte cada vez más inviable, incluso inimaginable. En 2 let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-14 01:07 JST";
  renderTabs();renderList();
})();
</script>
