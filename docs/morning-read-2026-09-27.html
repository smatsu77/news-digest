l production, and oil refining", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2193691", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Russia open to practical proposals from India on Ukraine conflict — ambassador", "title_en": "Russia open to practical proposals from India on Ukraine conflict — ambassador", "summary_ja": "Denis Alipov recalled that for decades, right up until 2022, Russia had done everything possible to persuade NATO to sit down at the negotiating table and agree on common principles of security in Europe", "summary_en": "Denis Alipov recalled that for decades, right up until 2022, Russia had done everything possible to persuade NATO to sit down at the negotiating table and agree on common principles of security in Europe", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2193689", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Oligarchy Is a Symptom, Not a Cause", "title_en": "Oligarchy Is a Symptom, Not a Cause", "summary_ja": "The deepening political dysfunction plaguing the US can be traced not to wealth inequality, as some argue, but to the fact that different groups of voters believe different facts. A political strategy that takes this into account might eventually lead to wealth redistribution, but it must begin with", "summary_en": "The deepening political dysfunction plaguing the US can be traced not to wealth inequality, as some argue, but to the fact that different groups of voters believe different facts. A political strategy that takes this into account might eventually lead to wealth redistribution, but it must begin with", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/inequality-is-not-the-root-cause-of-us-political-dysfunction-by-jeffrey-frankel-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Oligarchy Is a Symptom, Not a Cause\nThe deepening political dysfunction plaguing the US can be traced not to wealth inequality, as some argue, but to the fact that different groups of voters believe different facts. A political strategy that takes this into account might eventually lead to wealth redistribution, but it must begin with improved critical-thinking skills.\nCAMBRIDGE—It has become a common refrain among Americans that the US political system is broken. The question is how it reached this point—and how to get US politics back on track.", "translation_ja": "", "vocab": []}, {"title_ja": "The Immigrants Leading the Anti-Immigrant Far Right", "title_en": "The Immigrants Leading the Anti-Immigrant Far Right", "summary_ja": "Right-wing populists have turned hypocrisy into a successful electoral strategy. But those voting for nativism in Europe and the United States should be careful what they wish for: They may end up expelling their own family members, if not their own political leaders.", "summary_en": "Right-wing populists have turned hypocrisy into a successful electoral strategy. But those voting for nativism in Europe and the United States should be careful what they wish for: They may end up expelling their own family members, if not their own political leaders.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/immigrants-leading-anti-immigrant-right-by-slawomir-sierakowski-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Immigrants Leading the Anti-Immigrant Far Right\nRight-wing populists have turned hypocrisy into a successful electoral strategy. But those voting for nativism in Europe and the United States should be careful what they wish for: They may end up expelling their own family members, if not their own political leaders.\nWARSAW—Earlier this month, Germany’s far-right Alternative für Deutschland (AfD) won 43.8% of the vote in Saxony-Anhalt, a state where foreign nationals make up 7.9% of the population—roughly half the national average. Yet because it fell three seats short of a majority, it needs to secure the support of another anti-immigrant party, the Sahra Wagenknecht Alliance, which is led by a woman whose father came from Iran.", "translation_ja": "", "vocab": []}, {"title_ja": "The Great AI Gamble", "title_en": "The Great AI Gamble", "summary_ja": "As the two world leaders in AI development and adoption, the United States and China are each operating under assumptions that justify ever-faster progress, regardless of the risks. The current thinking is not unlike the rationale once given for Stalinist brutality in the name of rapid modernization", "summary_en": "As the two world leaders in AI development and adoption, the United States and China are each operating under assumptions that justify ever-faster progress, regardless of the risks. The current thinking is not unlike the rationale once given for Stalinist brutality in the name of rapid modernization", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-china-both-betting-everything-on-ai-regardless-of-risks-by-harold-james-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Great AI Gamble\nAs the two world leaders in AI development and adoption, the United States and China are each operating under assumptions that justify ever-faster progress, regardless of the risks. The current thinking is not unlike the rationale once given for Stalinist brutality in the name of rapid modernization.\nPRINCETON—The summit between US President Donald Trump and Chinese President Xi Jinping comes at a time when both are gambling everything on AI—or “superintelligence,” as Trump now insists on calling it. Both leaders, viewing the technology as the key to economic, political, and military dominance, are trapped in a dangerous zero-sum logic.", "translation_ja": "", "vocab": []}, {"title_ja": "I spent a full hour watching Trump TV. It’s a digital pathway to hell | Dave Schilling", "title_en": "I spent a full hour watching Trump TV. It’s a digital pathway to hell | Dave Schilling", "summary_ja": "The streaming channel was full of the president’s vanity and myopia. It was also deeply, deeply dull Are you currently at an airport? Strapped to a hospital bed, with various tubes protruding from your body? Maybe you’re on a treadmill or visiting an elder care facility? Chained to a radiator in the", "summary_en": "The streaming channel was full of the president’s vanity and myopia. It was also deeply, deeply dull Are you currently at an airport? Strapped to a hospital bed, with various tubes protruding from your body? Maybe you’re on a treadmill or visiting an elder care facility? Chained to a radiator in the", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/27/trump-tv-cable-news", "state_media": false, "category": "オピニオン", "full_text": "Are you currently at an airport? Strapped to a hospital bed, with various tubes protruding from your body? Maybe you’re on a treadmill or visiting an elder care facility? Chained to a radiator in the basement from the Saw movies?\nIf you said yes to any of these questions, you might be watching cable news while reading this column. Or maybe you’re one of the hundreds of people currently watching Donald Trump’s answer to cable news, Trump TV – a YouTube streaming channel that airs nothing but White House-sanctioned content 24 hours a day, seven days a week.\nKudos to you for multitasking, and thank you for the click. I know Jacob Soboroff is hard to look away from, but at least finish this.\nI don’t typically watch cable news. Or broadcast news. I feel like the best way to consume vital information is through the glorious written word, full of context and detail, rather than various “experts” yelling at each other about which one is the harbinger of the antichrist. Instead, I can yell all I want at a newspaper or an internet article and no one can tell me not to. Except the people in the dentist waiting room with me.\nTrump TV is kind of like cable news, if it served absolutely no purpose and had even fewer human beings watching. I gave myself the challenge of watching this neverending digital pathway to hell for one single hour, hoping I could capture whatever joy is being derived from this American horror story.\nWhen I first logged onto the stream, I was “treated” to a 11 March 2016 speech Donald Trump gave in Hebron, Kentucky – which Trump on more than one occasion pronounced “Keentucky”, presumably to mimic local speech patterns. That Donald Trump is just a good ol’ country boy, after all.\nI came in right smack-dab in the middle of the remarks, which very clearly were not prepared. As someone hyper-allergic to cable news, I don’t often witness the president’s speeches in full. I immediately felt as though I were succumbing to a form of intense psychosis, where reality had begun to melt before my eyes, like an ice cream cone that’s sat out in the sun too long.\nTrump was describing the stairs at the event, stairs he had to walk up and down. Stairs that he traversed despite his own natural sense of self-preservation. “I might slip, it’s soaking wet,” he said of the stairs. “They’re steel stairs. Four sets of stairs.” I immediately begin to imagine him counting the stairs. Slowly.\nFrom there, he played his greatest hits and mocked Joe Biden for falling down. But the big swerve was a backhanded compliment to Barack Obama for not falling down. “The only thing is how he bobbed down. He bobbed. I couldn’t believe that he made it without a major, noticeable fall.” The shock on his face that a healthy adult man would not trip on his descent from an airplane certainly made me wonder. You can tell this man has thought a lot about the best ways to not fall down stairs. Eventually, Dr Oz showed up, and I needed to mute my computer. My Uber Eats order had just arrived, and I didn’t want my neighbors getting the wrong idea when I opened the front door.\nWe got a brief respite from Trump up next, with a re-airing of Melania’s ad … excuse me, speech about how great artificial intelligence is, from 16 January. “The most powerful skill is knowing what to ask,” she declares. I realized the thing I should be asking right then was: “Why am I watching this?”\nI hung in a little longer for one more event: the National Prayer Breakfast from 6 February. Paula White-Cain, senior adviser to the White House Faith Office, opened the proceedings by saying: “No president in modern history or perhaps all of history has done more to elevate and protect religious liberty” than Donald Trump has. Except maybe George Washington, who presided over the ratification of the first amendment to the US constitution. The first amendment enshrined freedom of religion into the country’s laws. Also, awkwardly, freedom of speech and freedom of the press. You know, the press Donald Trump kicked out of the White House.\nTrump TV seems like the next escalation of the president’s obsession with and animosity toward cable news. I remain flabbergasted that someone could care about anything on television that much.\nAt last census count, 342 million people live in the United States. Of that population, between 2 and 3 million watch cable news in a given day. The vast majority of those people watch Fox News. And the majority of that majority is over the age of 54.\nWhen I say “no one watches cable news,” I am only being mildly hyperbolic. To coin a term, I’m being “semibolic”. Just a “hint of bolic”.\nYes, there are people who can’t seem to just turn their TV off out there, but MSNOW, CNN, and Fox News aren’t capturing the same level of enthusiasm as the latest episode of HBO’s Lanterns or your local bird-watching club. That cable news retains any significance in our daily discourse is a testament to how fiercely committed our nation’s leaders are to using it as a battlef", "translation_ja": "", "vocab": []}, {"title_ja": "Kamala Harris is belatedly courting progressives. Is it too little, too late? | Arwa Mahdawi", "title_en": "Kamala Harris is belatedly courting progressives. Is it too little, too late? | Arwa Mahdawi", "summary_ja": "As she mulls another presidential run, the former VP is building bridges with progressive and Arab American leaders Does Donald Trump secretly want Republicans to get annihilated in the midterms? Because he’s certainly acting that way . He continues to brush off concerns about the cost of living, sa", "summary_en": "As she mulls another presidential run, the former VP is building bridges with progressive and Arab American leaders Does Donald Trump secretly want Republicans to get annihilated in the midterms? Because he’s certainly acting that way . He continues to brush off concerns about the cost of living, sa", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/26/kamala-harris-progressives-arab-americans", "state_media": false, "category": "オピニオン", "full_text": "Does Donald Trump secretly want Republicans to get annihilated in the midterms? Because he’s certainly acting that way. He continues to brush off concerns about the cost of living, saying last week that high gas prices are a very “inexpensive price to pay” for the war on Iran.\nAnd, of course, the president seems to have no plans to end that disastrous war, apart from making vague threats about blowing the entire country up. Trust me, he keeps saying, everything will get better after the midterms. But by the looks of his dismal polling numbers, not many people are swallowing his empty promises anymore.\nStill, despite the mess the Republicans have made of the country, I wouldn’t feel too optimistic about the Democrats returning to power: the party is famous for snatching defeat from the jaws of victory. Instead of evolving, it has a tendency to do the same thing over and over again, expecting different results.\nSee, for example, the fact that there are once again loud murmurings that Kamala Harris plans to run for president in 2028. The former vice-president hasn’t made any sort of official announcement yet – she told voters in Detroit this week that she’s still deciding what to do – but she seems to be testing the political waters through midterm campaigning.\nThis week she flew to Michigan, one of the states she lost to Trump in 2024, to join the Senate candidate Abdul El-Sayed at a roundtable focused on Black maternal health. Harris will also be campaigning with the senator Jon Ossoff in Georgia next month and attending an event in Las Vegas with the Nevada attorney general, Aaron Ford, for his gubernatorial bid.\nHarris’s appearance in Michigan wasn’t some spur-of-the-moment attempt to be helpful; it was a highly calculated move designed to put her back on the national political stage.\nThe New York Times reported this week that Harris’s aides had circulated a donor prospectus in July “that showed how she would try to maintain her influence atop the Democratic Party as she considered another run for president in 2028”. The document, which solicited funds for campaign travel, explained how Harris could boost midterm candidates. It also asserted that the current moment is “uniquely suited to Vice President Harris and a broad coalition already in motion”.\nBut not everyone agrees it’s Harris’s time to shine. Numerous Democratic candidates have publicly stated that they don’t want Harris’s toxic brand anywhere near their elections.\nEl-Sayed, meanwhile, seems to have decided that an alliance with Harris is mutually beneficial. It gives the progressive candidate an inroad into the establishment and might help him win more support with Black voters.\nHarris, who alienated many progressives and Arab Americans by her stance on Gaza, clearly thinks that associating with El-Sayed might improve her reputation among that cohort of voters. El-Sayed has said he opposes military aid to Israel and termed the situation in Gaza a genocide – as have numerous human rights groups and genocide experts.\nEl-Sayed isn’t the only progressive that Harris appears to be trying to build bridges with. Last year, Harris offered only the most lukewarm of endorsements for Zohran Mamdani, stating: “He’s the Democratic nominee, and he should be supported.” Now that it’s clear that Mamdani embodies the political zeitgeist, she’s a lot more keen to be besties. In early July, Axios reported that Harris called up the New York mayor a couple of days after three leftwing candidates he’d endorsed won their primaries over establishment-backed candidates.\nIn fact, Harris has been working the phones pretty hard. The same Axios piece noted that she’d reached out to a number of pro-Palestinian activists and Arab American leaders including James Zogby, founder and president of the Arab American Institute. He told Slate this week that the two had had a “long talk”, which he felt good about.\nIn 2024, the Democrats took progressives for granted. They assumed that young progressives would show up to vote blue no matter who, even when the party treated them with disdain. Instead many of these voters stayed home.\nThe Democrats are still loath to admit that Gaza was a factor in their defeat: a 2024 autopsy report released by the Democratic National Committee did not mention the issue once. However, it looks like Harris is waking up to the realization that her almost unconditional support for Israel hurt her in the previous election and is something she will have to rectify if she wants to run again. Particularly since polls show a record 60% of US adults now have an unfavourable view of Israel and the vast majority of Democrats support an arms embargo.\nIs all this too little too late for the former nominee’s brand? I don’t know. But it’s certainly too late for the tens of thousands of Palestinians the Biden-Harris administration were complicit in killing.\nThe murder of nine women causes a reckoning in South Africa\nThe bodies of nine women have been found across the ", "translation_ja": "", "vocab": []}, {"title_ja": "ICE has abducted a college athlete. What are the NCAA and universities going to do about it?", "title_en": "ICE has abducted a college athlete. What are the NCAA and universities going to do about it?", "summary_ja": "Aminata Seck’s detention shows the bargain facing international college athletes: universities eagerly recruit them, but support can disappear when their immigration status becomes precarious Earlier this week, news broke for the first time that Senegalese Division II Kentucky State women’s basketba", "summary_en": "Aminata Seck’s detention shows the bargain facing international college athletes: universities eagerly recruit them, but support can disappear when their immigration status becomes precarious Earlier this week, news broke for the first time that Senegalese Division II Kentucky State women’s basketba", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/sport/2026/sep/26/aminata-seck-ice-international-college-athletes", "state_media": false, "category": "オピニオン", "full_text": "Earlier this week, news broke for the first time that Senegalese Division II Kentucky State women’s basketball player Aminata Seck was abducted by Immigration and Customs Enforcement (ICE) at Louisville’s Muhammad Ali International Airport on 7 August during a trip to attend the HBCU All-Star game in New York. Seck is listed as a Kentucky State senior and last year started 20 of 26 games, earning third-team all-conference honors and an SIAC Elite 16 award for academic achievement. According to a lawyer involved with her case, Sadiqa Reynolds, Seck has been moved through four different ICE facilities since her initial apprehension: Clay County, Chicago, Clark County and Grayson County. Reynolds noted that the reason for Seck’s imprisonment was a missed student visa deadline – what she characterized as “a paperwork situation” – due to back surgery. Reynolds also said that Seck has been suffering from an ACL injury while detained and has received only ibuprofen but no proper medical care.\nICE arrests in Kentucky have risen by 70% this year.\nThe Department of Homeland Security told USA Today on 23 September that Seck “chose to overstay her welcome in violation of our nation’s laws”, adding, “To be clear: a pending application or work authorization does not confer legal status in the United States.” DHS also claimed that an immigration judge issued a final order of removal for Seck on 8 September 2025, after she purportedly “failed to show up for her immigration hearing”, Notably, they emphasized that “she will remain in ICE custody pending removal proceedings”,\nMargaret Fleming of Front Office Sports reported that a DHS spokesperson told her, “Upon entrance examination, medical personnel noted Seck was wearing a leg brace to support a knee injury that occurred prior to detention. On 21 September, she was referred to the local hospital, where she is receiving treatment for knee pain.” Yet, in the same statement, DHS remarks that it is “longstanding practice to provide comprehensive medical care from the moment an alien enters ICE custody”. This strongly suggests that Seck was denied appropriate medical care for approximately one and a half months in direct contravention of DHS policy until the case became public, at which point, after additional days passed, she was finally provided treatment.\nAdditionally, Hishem Alsalman, lawyer for Seck in her federal habeas corpus petition, told Fleming that the Kentucky State player “never received notice of the hearing that resulted” in her removal order and that, “far from knowingly ignoring her immigration obligations, she was actively taking steps to ensure that her student status remained intact while continuing her education at Kentucky State University.”\nMoreover, Alsalman also shared with Fleming that Seck has experienced seizures during her time in detention and is currently in hospital as of 23 September.\nReynolds reported that Seck has been receiving considerable support from Kentucky State coach Amani Williams, saying that “she has treated her like a mother would treat their child”. Williams’s response should be commended, but the safety of an international athlete cannot depend on the extraordinary efforts of an individual coach. Institutions that recruit international athletes and benefit from their athletic labor must build systems capable of supporting them when their immigration status places them at risk, rather than leaving coaches to shoulder that responsibility alone.\nThis case raises significant questions about the safety of international college athletes (ICAs) during a moment when the White House has more than doubled the ICE complement, claims to have deported some 605,000 people, and operates with the goal of deporting one million people per year. Indeed, just before the Seck case entered the news cycle, the official US Department of Education X account posted a photo of white fans in the crowd at the University of Texas under the banner “Make College Football Great Again” in reference to recent viral images of South Asian fans in the crowd at a Texas game. This after Ohio Senator Jon Husted introduced legislation on 14 September calling for a cap on ICAs at no more than 20% per team on the grounds that “foreign interference” is stealing opportunities from American student-athletes. The foghorn-volume insinuation of these developments is evidently that non-white, international-coded students are no longer welcome in the world of college sport.\nThat is a rather stunning slap in the face of ICAs given that it has previously been demonstrated beyond a reasonable doubt that they are a “cash cow” for universities in the United States through the contribution of tuition, fees and housing to institutional revenue. While this is less true for profit-generating sports (which includes Division I women’s basketball at some schools), it certainly applies to Division II, where scholarship limitations are in effect such that, for instance, a school can only awar", "translation_ja": "", "vocab": []}, {"title_ja": "How Iran Changed War", "title_en": "How Iran Changed War", "summary_ja": "The lessons of Tehran’s use of precise mass.", "summary_en": "The lessons of Tehran’s use of precise mass.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/how-iran-changed-war-united-states-michael-horowitz", "state_media": false, "category": "オピニオン", "full_text": "When the United States began bombing Iran, it expected to quickly overwhelm the country’s government. In the war’s first 24 hours, American and Israeli forces hit roughly 1,000 targets. Over the following 37 days, they blew up 12,000 more, laying waste to much of Iran’s military infrastructure. The strikes killed Iranian Supreme Leader Ali Khamenei, Iran’s minister of defense, and the head of the Islamic Revolutionary Guard Corps.\nBut more than six months later, the Iranian regime not only remains intact; it is perhaps stronger than before. It immediately replaced lost officials and struck back at Washington and its regional partners. And it shuttered the Strait of Hormuz, driving up energy prices around the world and winning newfound political leverage—all to the great frustration of U.S. officials.\nThere are several reasons why Iran performed surprisingly well. For one, the country had long planned for American and Israeli attacks, so it was prepared to reconstitute its government when top leaders were killed. It was also able to import enough goods to keep its economy from completely collapsing despite a U.S. naval blockade. But one of the most significant factors is that the Islamic Republic had built up a large arsenal of cheap yet accurate drones and missiles. These munitions made Iran’s counterattacks effective and allowed it to close the strait—and thus deter American escalation.\nIn doing so, Iran has demonstrated something broader. The age of what I called precise mass—or high-volume, low-cost, precision-guided weapons—is well underway. It is no longer possible for the U.S. military, or any military, to win a full-blown war simply by using small numbers of exquisite weapons to dazzle opponents. Weaker countries can match stronger ones through offensive barrages. Offense is currently cheaper than defense: the price of effective interceptors has yet to fall to the level of attack drones and missiles, which means defending against precise mass is extremely costly. After all, militaries cannot endlessly block salvos of $35,000 Shahed-136 attack drones with $4 million Patriot missiles.\nTo be sure, the war in Iran also shows that advanced technology remains essential. The United States, for example, had great success hitting valuable Iranian sites because it has artificial intelligence systems that can identify and recommend targets faster than ever before. American exquisite weapons are still much harder to stop than cheaper ones, and they are more likely to destroy targets in a single strike. But the world is learning from Iran, building on what Ukraine had already made clear: the future of war lies in part in precise mass. Everyone will now embrace the imperative of producing and using hosts of cheap and disposable weapons systems, changing warfare and the military balance.\nSET IN ONE’S WAYS\nIn war, it might seem as if wealthy states always benefit from new military capabilities. But the reality is more complicated. If a new system is expensive, it indeed favors rich incumbents. But if it is cheap and demands large organizational changes to adopt, other countries can take advantage just as quickly—if not faster. In fact, the most powerful militaries in the world often struggle in the face of required disruptive organizational change, as their prior success has created bureaucracies and organizational biases that make adaption harder. As a result, they have a hard time integrating new capabilities that cannot be plugged into their existing structures.\nPrecise mass is just such a capability. The most conventionally powerful militaries are organized around small numbers of exquisite, expensive, hard-to-produce weapons and platforms such as Tomahawk missiles and F-35s. Their units train and plan around these systems. They thus cannot easily adjust to precise mass capabilities, which require different kinds of training and entirely new conceptions of how to fight. Exquisite systems, for instance, are scarce, so units must take great care not to waste systems and to minimize the risk of destruction. With precise mass, by contrast, units are supposed to move quickly and not make the perfect the enemy of the good. This helps explain why the United States has struggled to adapt to precise mass—even though the country invented precision guidance and boasts the best military in the world.\nIran, meanwhile, has been broadly locked out of some more advanced military capabilities. As a result, it had to invest heavily in long-range, one-way attack systems and cheap ballistic missiles. The result is a war where Iran has dramatically outperformed expectations. Tehran could not go blow-for-blow with the U.S. military’s exquisite weapons, but it did not need to, because it could rapidly fire relatively accurate drones and cheap missiles at U.S. bases and the region’s critical infrastructure. The United States has dealt billions of dollars of damage to Iran in turn, but only by burning through its stockpiles of Tomahawks", "translation_ja": "", "vocab": []}, {"title_ja": "The Coming Taiwan Crisis", "title_en": "The Coming Taiwan Crisis", "summary_ja": "Use today’s calm to prepare for the next perfect storm.", "summary_en": "Use today’s calm to prepare for the next perfect storm.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/taiwan/coming-taiwan-crisis-china-jonathan-czin", "state_media": false, "category": "オピニオン", "full_text": "As U.S. President Donald Trump and Chinese leader Xi Jinping meet in Washington this week, the Taiwan Strait, the waterway that has long been a flashpoint between the two countries, has seemed remarkably quiet. Chinese fighter jets regularly cross the centerline between Taiwan and the mainland. Chinese warships maneuver to the east of the island. And Beijing uses its coast guard to continually harass ships in the area. Yet for nearly a year, Beijing has avoided the large-scale military exercises that had become a regular feature of its coercion of Taiwan after former U.S. Speaker of the House Nancy Pelosi’s visit to the island, in 2022.\nThat shift stems in large part from renewed optimism in Beijing. Although the Trump administration has not formally changed its policy toward Taiwan, Trump’s statements after his prior meeting with Xi in May undermined Taipei’s confidence in the United States’ commitment to the island. “I’m not looking to have somebody go independent,” he said at the time. “And, you know, we’re supposed to travel 9,500 miles to fight a war. I'm not looking for that.”\nFor years, many in Washington and across the Asia-Pacific region assumed that 2027 would be the next potential pivot point for Beijing’s Taiwan policy, because Xi had directed the People’s Liberation Army to be prepared for a cross-strait military confrontation by that date. Yet as 2027 approaches, it appears exceedingly unlikely that Xi is gearing up to employ lethal force any time soon. Xi has been willing to conduct systematic purges of his military high command, in part because he is not worried about a cross-strait crisis in the near future. For now, Xi seems to feel confident that he can effectively manage both Washington and Taipei.\nBut Xi remains deadly serious about organizing his force for a conflict over Taiwan in the coming years. The next pivotal date will not be 2027, when Xi is expected to begin a fourth term, but 2028, when both the United States and Taiwan will hold presidential elections that will determine the future trajectory of the cross-strait dynamic. In all likelihood, Xi will find himself frustrated by the outcome of Taiwan’s next election, which will make the situation more fraught than it is now. The coming two years are thus a crucial window for Washington to work with Taipei to prepare for what will likely be a far more turbulent period in the Taiwan Strait after 2028.\nRather than let doubts about its support for Taipei deepen, Washington should lean into its relationship with the island. In many ways, Taiwan has refashioned itself into a model partner, both by reorienting its economy toward the United States and away from China and by boosting investments in its own defense. At the very least, Trump should approve the $14 billion arms package that is on his desk, even if that means dividing the sale into smaller tranches to avoid escalating tensions with Beijing.\nChina will not welcome a series of U.S. arms sales, but historically Beijing has shown far more concern for high-profile gestures of political support for Taiwan, such as Pelosi’s visit, than over the bureaucratic details of U.S. weapons transfers. And leaving arms sales in abeyance carries its own long-term costs. By forgoing this minimum step, the administration will be complicit in Beijing’s bid to establish a veto over U.S. arms sales and, by extension, over the cross-strait dynamic. After 2028, the diplomatic price of such support for Taipei is likely to rise, as an aging Xi may conclude that further delay on Taiwan no longer works in his favor.\nSOONER OR LATER\nXi’s optimism is predicated on the hope that the opposition Kuomintang party (KMT) will regain power in 2028 after a dozen years of rule by the Democratic Progressive Party, which the mainland reviles as separatist. Beijing has had no visible engagement with the government since the DPP came to power in 2016—a marked departure from Xi’s approach to the previous administration. In 2015, Xi became the first Chinese leader since Mao Zedong to shake hands with his Taiwanese counterpart, a precedent he must have relished. Yet rather than becoming part and parcel of what Xi and his propagandists call the “new era” for China under his rule, Taiwan has steadily drifted away from the mainland, frustrating his ambitions to begin the political process of annexing the island. Annexation, not a costly and likely catastrophic military invasion, is his ultimate goal.\nXi’s hopes rose in November 2025, when Cheng Li-wun unexpectedly became chair of the KMT. Cheng has advocated a much softer line toward China, emphasizing the common Chineseness of citizens on both sides of the strait and the need for cross-strait dialogue. In April 2026, she traveled to Beijing to meet with Xi just weeks before he hosted Trump. The meeting positioned Xi to depict his Taiwan policy as conciliatory and reasonable, despite his hard-line approach to the ruling party over the past decade. His willingness to receive C", "translation_ja": "", "vocab": []}, {"title_ja": "The Price of Arctic Ambition", "title_en": "The Price of Arctic Ambition", "summary_ja": "The Greenland deal proves self-reliance is not an option.", "summary_en": "The Greenland deal proves self-reliance is not an option.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/arctic-antarctic/price-arctic-ambition-greenland-iris-ferguson", "state_media": false, "category": "オピニオン", "full_text": "In 2016, a crack in the ice opened beneath the site of the U.S. Navy’s flagship Arctic exercise several hundred miles north of Prudhoe Bay, Alaska, forcing experiments to end early and leaving researchers scrambling to evacuate. Five years later, an early freeze trapped roughly two dozen commercial vessels in the East Siberian Sea; some had to wait weeks for Russian icebreaker assistance. And during a Canadian-led multinational military exercise in 2025, allied forces encountered a difficult combination of conditions: extreme cold grounded helicopters, broke snowmobiles, and knocked out communications equipment even as thinning sea ice forced U.S. pilots to search 25,000 miles of coastline for a location thick enough to land on.\nThese were not failures by unprepared or inexperienced Arctic actors. They involved three of the region’s most proficient nations, each operating in territory it knew well. But there was a common thread: the Arctic has a way of humbling those who operate there. Its distances, darkness, extreme weather, and sparse infrastructure expose the limits of even the most capable governments and militaries.\nThis fact creates a paradox. The Arctic is a main approach to the U.S. homeland and a platform for projecting power at the top of the world. That is precisely why, as geopolitical competition intensifies, Washington is becoming increasingly focused on protecting sovereignty and securing its interests in the region. Yet no single country, not even the United States, can see, maneuver, and sustain itself across the Arctic. Effective sovereignty there relies on building networks of dependence.\nThis week’s agreement between Greenland, Denmark, and the United States illustrates the point. After months of negotiation, the three parties struck a symbiotic deal codifying U.S. military access while affirming Danish and Greenlandic self-governance. U.S. President Donald Trump has called it a win for American interests; Denmark and Greenland a win for sovereignty. Both are true, as nearly every mission that makes Greenland strategically valuable—missile warning, submarine detection, basing, and resupply—works because the United States is embedded in an alliance system.\nThe agreement could mark a turning point in how Washington approaches Arctic security. Trump’s early talk of acquiring Greenland or making Canada the 51st U.S. state cast self-reliance as the goal and strained relations with key Arctic partners. This agreement signals a more productive direction. Working with allies preserves the advantages the United States already holds and closes the gaps, in both presence and allied political unity, that adversaries are eager to exploit.\nBut fully embracing the role that allies and partners must play for the United States to achieve its goals in the Arctic will require a shift in a long-held mindset. For the United States, pursuing interdependence is an uncomfortable strategy. Self-reliance remains closely associated with national power, and Washington has historically approached Arctic shortfalls by asking what additional U.S. capabilities it needs to generate. Decades of deprioritizing the Arctic, however, coupled with the region’s vast and forbidding geography, leave the United States with little choice but to work closely with partners. In practice, the interdependence it needs to have with allies in the Arctic is already found everywhere—now Washington must continue to build on it.\nSEEING TOGETHER\nThe United States’ basic ability to understand and communicate what is happening in the vast Arctic region depends on partnerships. Arctic awareness remains uniquely fragmented across three distinct regions: North America, Europe, and the Pacific. Information is further dispersed across a variety of militaries, scientific institutions, intelligence agencies, and local indigenous communities, whose knowledge of the changing environment far exceeds any new sensor.\nSince the early 1960s, just after the creation of the U.S.-Canadian North American Aerospace Defense Command (NORAD), the United States has intentionally based some of its most important missile-defense systems in Canada and Greenland. Because of gaps in its own coverage, the United States now relies on a Japanese satellite to detect the extent of Arctic sea ice, which is integral to understanding the evolution of commercial and military sea routes. The United States further depends on allied monitoring over the European Arctic to understand threats approaching U.S. territory and on allied judgment to interpret competitors’ intent in the Arctic. Nordic nations have decades of experience observing the Russian military’s behavior around the Kola Peninsula, home to much of the country’s nuclear capacity, making their observations indispensable to Washington’s ability to distinguish between routine and escalatory behavior. The United States, for its part, can see patterns of Chinese and Russian activity near Alaska that European allies might miss", "translation_ja": "", "vocab": []}];
const FOCUS = null;
let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-27 23:26 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
