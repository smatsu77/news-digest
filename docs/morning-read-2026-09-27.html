es and in some cases names for the suspects.\nIn Cape Town, five victims died at the scene and a further five people died in hospital.\nNo arrests had been made in either case on Sunday morning.\nThe two mass shootings came days after 11 people were killed in the city of Durban when gunmen stormed a house in the KwaMakhutha township.\nIllegal weapons are prevalent in South Africa and gun violence has been a persistent problem for decades, with about 60 murders recorded every day in the country of 62 million.\nBut a recent spate of mass shootings has raised fears that the problem is deepening, with violence often linked to turf wars between gangs engaged in drug trafficking and illegal mining.\nIn February, President Cyril Ramaphosa called organised crime \"the most immediate threat to our democracy, our society and our economic development\".\nEarlier this year, the military was deployed alongside police in areas with the highest murder rates in an effort to reduce armed violence.\nOn Saturday, a tenth woman's body was found in Ekurhuleni, to the east of Johannesburg, with local police saying they were unable to rule out a serial killer operating in the area with similarities between the deaths.", "translation_ja": "", "vocab": []}, {"title_ja": "Embattled Serbian president resigns, paving way for early elections", "title_en": "Embattled Serbian president resigns, paving way for early elections", "summary_ja": "Aleksandar Vučić's administration has been dogged by prolonged protests over allegations of corruption.", "summary_en": "Aleksandar Vučić's administration has been dogged by prolonged protests over allegations of corruption.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ckpq0g7z5pjjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Embattled Serbian president resigns, paving way for early elections\n- Published\nSerbia's president has resigned after more than a year of student-led es after three \"suspicious vehicles\" were reported travelling towards an RAF base, police have said.\nA major incident was declared and dozens of homes near RAF Fairford in Gloucestershire were evacuated following the report at about 00:45 BST on Sunday.\nAn Army explosive ordnance disposal team has been examining vehicles near the base, which is used by the United States Air Force (USAF), as counter-terror police lead the investigation.\nResidents evacuated from the nearby village of Whelford have been told they will not be able to return home overnight, but officials say they believe the incident is contained.\nAerial pictures showed a remote-controlled robot approaching stationary white vans in a wooded area, though its use has not been confirmed by police.\nA 400m cordon has been placed around the area, where a hazardous area response team was deployed as part of a major emergency service response.\n- What we know about RAF Fairford counter-terror probe \n  - Published3 hours ago\n- More questions than answers after major incident near airbase \n  - Published3 hours ago\nPrime Minister Andy Burnham was kept updated on the \"deeply concerning\" situation near the base.\nThe site shares a long history with the American military, and has recently been used by US warplanes as a staging post for defensive strikes on Iran.\nPresident Donald Trump said those arrested had been \"looking to do big damage\", adding: \"We had them under view for a long time, and we got them.\"\nUK Defence Secretary Wes Streeting said he had been in contact with his US counterpart, Pete Hegseth.\nA USAF spokesperson said its personnel remained vigilant but did not discuss specific force protection methods.\nThe US Department of Defense meanwhile raised the threat level at RAF Lakenheath in Suffolk - which hosts the USAF's 48th Fighter Wing - to its second-highest category.\nCounter Terrorism Policing (CTP) and Gloucestershire police said the probe was in its early stages, with the five men still in custody as of Sunday evening.\nThe BBC understands the operation was not intelligence led. The men were initially arrested by Gloucestershire police and detained on suspicion of committing offences under the Explosives Act, before being further arrested on suspicion of preparation of a terrorist act.\nAsked whether police were seeking other individuals, Gloucestershire Constabulary's temporary Chief Constable Maggie Blyth told a news conference late on Sunday that she believed the matter was \"contained\".\nAn image purporting to show the moment five men were arrested was sent to the BBC.\nIt showed detained men in Whelford, about 350m (1,148ft) from runway access at Crash Gate 6A at RAF Fairford.\nThe BBC has been unable to verify the original source, but BBC Verify has geolocated the image and confirmed it appeared to be authentic.\nA local resident told the BBC she alerted the police to suspicious activity near the base early on Sunday.\nThe woman, who did not want to be named, said she initially called the Ministry of Defence (MoD) police but nobody answered, and then called 999. She said she had seen three parked vans and a group of men wearing masks.\nThe MoD declined to comment.\nSeveral residents said they had been led from their homes in the early hours and evacuated to a leisure centre.\nJulian Tudsbury said he was woken up at 07:00 by police banging on his door in Whelford, where 85 households were advised to evacuate.\n\"There were several police, three police cars in the drive, and they said you need to evacuate, there's been a major incident, said he couldn't elaborate,\" he said.\nHe said another local had seen three vehicles making their way to the base and called the police \"straight away\".\nAnother resident, who gave his name only as Jeff, said he heard shouting outside at 02:00.\n\"[I] looked out the window and saw men were being held by police outside the house. They were armed, it was surreal.\nGloucestershire police said displaced residents had been told they would not be able to return to their homes on Sunday night.\nOvernight accommodation would be found by Costwold District Council for those affected who were unable to stay with family and friends, according to deputy chief executive David Stanley.\nGet in touch\nDid you witness what happened? Or have you been evacuated? Share your experiences\nFollow BBC Gloucestershire on Facebook, external, X, external and Instagram, external. Send your story ideas to us on email or via WhatsApp on 0800 313 4630.", "translation_ja": "", "vocab": []}, {"title_ja": "More questions than answers after major incident near RAF Fairford", "title_en": "More questions than answers after major incident near RAF Fairford", "summary_ja": "The vital US launchpad in England has long been a possible target, writes diplomatic correspondent James Landale.", "summary_en": "The vital US launchpad in England has long been a possible target, writes diplomatic correspondent James Landale.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm4gd1r8dk1ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "More questions than answers after major incident near RAF Fairford\n- Published\nRAF Fairford is a slice of America in the heart of England; a forward operating base for the US Air Force since the Cold War.\nIts two-mile runway is so long it was once an emergency backup for the US space shuttle programme.\nNow it is a vital launchpad for the vast, lumbering bombers President Donald Trump uses to strike Iran, the only airbase with such capabilities available to the US in Europe.\nAnd that – by definition – has long made it a potential target.\n- What we know about RAF Fairford counter-terror probe \n  - Published3 hours ago\nIn July, Iran's foreign ministry accused the UK of being complicit in war crimes for allowing the US to use Fairford as a staging post for defensive strikes in its war against Tehran.\nAnd it warned \"any party that, in any manner, participates in military aggression against Iran will bear responsibility for the consequences and repercussions of its decision\".\nThat was seen as an explicit threat.\nThere is also a stalemate in diplomatic efforts to end the war. That has given rise to speculation Iran could seek to step up pressure on the US, perhaps with an attack outside the Middle East, to try to shift the dial ahead of the US midterm elections in November.\nWhen Ed Miliband met his Iranian counterpart Abbas Araghchi at the United Nations last week, the foreign secretary explicitly warned of the UK's \"unwavering resolve to combat threats from Iranian-linked groups\" and said it would not tolerate any \"hostile activity\" on UK soil.\nBut some eyes, too, have turned to Moscow.\nDanish intelligence warned last week Russia could in the coming months launch a limited military attack on a Nato country.\nGermany has already formally accused Russia of using a drone carrying explosives in an attempted attack on Leipzig in August.\nOver the summer, the Russian embassy in London warned the UK against allowing Ukraine to use British drones deep inside Russian territory: \"The deeper [the UK's] involvement in the conflict and the greater its support for Kyiv's terrorist machinery, the higher price it will pay.\"\nThat, too, was seen as a direct threat.\nThere are also possibilities of some kind of Islamist attack, or even an incident of direct action by a group opposed to both the US-Israeli war on Iran or the use of UK bases to launch strikes.\nOne central question is whether the authorities were prepared for such an attack.\nThe US handles security within the base; the UK is responsible all threats outside the perimeter. What did the authorities know?\nPresident Trump said the suspects had been under investigation \"for a long time\".\nBut there are also suggestions the incident was foiled only because a passing driver reported strange vans to the police.\nAt the time of the explicit Iranian threat against the UK, a spokesman for the Ministry of Defence said: \"Our armed forces are ready to keep the United Kingdom safe from any kind of attacks, whether it's on our soil or from abroad. The UK stands ready 24/7 to defend itself.\"\nSo for now, there remain more questions that facts.\nWas a hostile foreign state involved, or were proxies acting on its behalf? What was intended and what was the potential risk to local people?\nOne thing is clear: the threat from conflicts involving the UK will not always stay overseas.", "translation_ja": "", "vocab": []}, {"title_ja": "Healey to promise 'new age of industrialisation' for UK in conference speech", "title_en": "Healey to promise 'new age of industrialisation' for UK in conference speech", "summary_ja": "The chancellor will unveil policies aimed at boosting British shipbuilding in his speech to Labour's annual conference on Monday.", "summary_en": "The chancellor will unveil policies aimed at boosting British shipbuilding in his speech to Labour's annual conference on Monday.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cjdx53edkglgo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Healey to promise 'new age of industrialisation' for UK in conference speech\n- Published\nJohn Healey will promise \"a new age of industrialisation\" for the UK, when he delivers his first Labour conference speech as chancellor on Monday.\nHealey will tell delegates \"our coal mines are not coming back\", but that Labour will remake Britain's industrial past \"for the modern age\" by backing advanced manufacturing.\nHe will also announce plans to boost Britain's shipbuilding industry, with new orders for Royal Navy floating docks and a maritime research vessel.\nWith just a month to go until his first Budget, the chancellor is under pressure to cut spending or raise taxes to tackle the ballooning cost of government borrowing.\nBut he is not expected to reveal any details about his Budget plans in his speech at Labour's annual conference in Liverpool.\nInstead, he will attempt to set out a positive vision for the future of British industry, based around what he will call a \"new confidence in Britain\".\nThe former defence secretary will announce that three new floating docks at HM Royal Naval Base Clyde, at Faslane, will be built in the UK, rather than put out to international tender.\nPlans for the new docks were first set out in 2023 and are expected to upgrade Faslane's facilities for the next generation of British submarines.\nThe docks form part of a wider £15bn upgrade programme for the Royal Navy's shipyards and are expected to come into service in the early 2030s.\nFirst Secretary of State Louise Haigh said in a speech on Sunday that the government would also commission a new marine research vessel as part of plans for a \"new era of reindustrialisation\".\nThe chancellor is expected to announce £115m in funding for the ship, which is also set to come into service in the early 2030s.\nAhead of his speech, Healey said: \"By backing British shipyards, we are not only boosting national security but also securing resilience in the industries that will drive growth today while building the capabilities the country needs for the future.\"\nShadow chancellor Andrew Griffith said the plans were \"reheated announcements\" with \"no clarity on where the money is coming from\".\nHe added: \"Labour are running scared of making the tough choices needed to pay for Britain's defence.\n\"All they can offer is reannounced docks and more hot air from Healey. Only the Conservatives will cut the welfare bill to fund defence.\"\nCharlotte Brumpton-Childs, national secretary of the GMB union, which has campaigned for the move, said it would be a \"massive boost\" for the UK's shipbuilding sector.\n\"For too long juicy contracts have been sent to overseas - often subsidised - yards.\n\"This policy could reinvigorate UK yards and the communities that depend on them,\" he added.\nPrime Minister Andy Burnham - who is due to deliver his big conference speech on Tuesday - has previously spoken about his ambition to \"reindustrialise\" Britain, including in talks last week with US President Donald Trump.\nBut in a survey to be published on Monday, the Confederation of British Industry (CBI) will highlight falling economic activity across key sectors such as retail and services in the three months to September, with manufacturing declining more moderately.\nCBI deputy chief economist Alpesh Paleja said rising energy and employment costs combined with weak demand were continuing to put pressure on profit margins.\nHe added: \"Uncertainty ahead of next month's Budget is also holding back activity in some sectors.\n\"Against the backdrop of renewed fiscal pressures, the Budget must draw a clear red line under any more rises in the cost of hiring, investing and doing business.\"\nThe chancellor is also under pressure from some of Labour's trade union backers to do more to tackle the cost of living.\nSharon Graham, general secretary of the Unite union, has called on Healey to \"do something for workers and the working class\" in his Budget.\nShe urged him to unfreeze income tax thresholds \"to put money back into people's pockets\" and take further action on energy bills.\nIn his conference speech, Healey will also announce plans to bring back a training scheme run by trade unions, to help workers in England gain new skills and adapt as technology, including AI, changes the workplace.\nThe Union Learning Fund will get £15m in taxpayers' money, taken from existing government budgets.\nEmployees do not need to be union members to benefit, with support options ranging from essential English, maths and digital skills, to training for jobs in growing industries, such as advanced manufacturing.\n- Faisal Islam: The two big decisions the chancellor must make \n  - Published1 day ago\n- Burnham proposes NHS-style social care system for England \n  - Published9 hours ago\n- Social care reform could mean big risks and big rewards for Burnham \n  - Published8 hours ago\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": []}, {"title_ja": "Serbian President Aleksandar Vucic announces resignation", "title_en": "Serbian President Aleksandar Vucic announces resignation", "summary_ja": "Aleksandar Vucic will now be running to be prime minister in the upcoming snap parliamentary elections slated for next month.", "summary_en": "Aleksandar Vucic will now be running to be prime minister in the upcoming snap parliamentary elections slated for next month.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/serbian-president-aleksandar-vucic-announces-resignation/a-79450358?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Serbian President Aleksandar Vucic announces resignation\nSeptember 27, 2026\nSerbia's long-time President Aleksandar Vucic announced on Sunday that he would resign from his post in order to run for prime minister in the upcoming October snap elections.\nFrom the presidential palace in Belgrade, Vucic spoke to supporters: \"I am resigning as president.\"\n\"Tomorrow morning I will hand over my duties to the parliament speaker,\" he added \"This is the last evening for me in this building,\" Vucic declared.\n\"I served you faithfully. I served all of you, and our homeland Serbia, honourably and honestly throughout my presidential term,\" Vucic told supporters. \"The fight is only beginning,\" he added.\nDominating Serbian politics\nVucic is banned by the Serbian Constitution from seeking a third term. He was serving his second term and would have left office in May of 2027.\nThe 56-year-old, who has ties to Serbian nationalism and had once served as minister under the administration of Slobodan Milosevic, has dominated Serbian politics for more over a decade.\nVucic supporters praise him for his stability, stated commitment to development projects in Serbia and his patriotism, in a country long overshadowed by war in the 1990s and subsequent international isolation.\nOpponents, however, have decried what they see as increasingly authoritarian tendencies and leading a government accused of endemic corruption.\nAbroad, Vucic has had to juggle the competing interests of his country's European Union aspirations and its close ties to Russia.\nOpposition had sought snap elections\nEarlier in September, Vucic called for snap elections for October. He cited \"major turbulence on the domestic political scene,\" as the reason.\nVucic was referring to the political movement and major setback for his government that was triggered by a tragedy in Serbia's second-largest city of Novi Sad. In November 2024, an awning of a newly reconstructed railway station in Novi Sad collapsed, killing 16 people.\nThe disaster triggered nationwide protests by students and the opposition. They demanded accountability for those responsible for the disaster, transparency in public procurement, an end to systemic corruption, and an early parliamentary vote.\nVucic's government repeatedly denied accusations, but still, several officials, including two ministers, were arrested or resigned after the incident. The upcoming snap election will test Vucic's popularity and political survival.\nEdited by: Srinivas Mazumdaru, Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Yemen: Houthis report deadly Saudi strikes on Taiz market", "title_en": "Yemen: Houthis report deadly Saudi strikes on Taiz market", "summary_ja": "The Houthi-run health ministry accused the Saudi Air Force of committing an \"abominable crime,\" vowing to retaliate. The Houthis' account of the attack cannot be independently verified.", "summary_en": "The Houthi-run health ministry accused the Saudi Air Force of committing an \"abominable crime,\" vowing to retaliate. The Houthis' account of the attack cannot be independently verified.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/yemen-houthis-report-deadly-saudi-strikes-on-taiz-market/a-79450102?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Yemen: Houthis report deadly Saudi strikes on Taiz market\nSeptember 27, 2026\nYemen's Houthi rebels on Sunday accused the Saudi Arabian Air Force of having struck a shopping area around the central market of Taiz. The Iran-aligned Houthis said at least seven people had been killed and dozens injured.\nWhat do we know so far?\nThe group's Al-Masirah TV channel showed footage of large plumes of smoke and a destroyed warehouse stacked with food in cardboard boxes. Al-Masirah TV also reported that children were among those wounded, citing the Houthis' health ministry.\nTaiz is currently under the control of Yemeni government forces, but it has long been besieged by Houthi fighters and remains one of the main fronts in the country's civil war. Taiz is located in southwestern Yemen.\nThe escalation in fighting comes after a fragile truce between Yemeni government forces and Houthi rebels broke down months ago and new regional tensions sparked by the Iran war.\nThe Houthi health ministry accused the Saudi Air Force of committing an \"abominable crime,\" saying it was directly and deliberately targeting civilian sites in Taiz.\nHouthi military spokesman Yahya Saree accused Saudi Arabia of launching two air raids that hit the market, adding that blood was \"unjustly and aggressively spilled\" in a statement posted online.\nThe group has vowed to retaliate.\nThe claims made by the Houthis cannot be independently verified.\nIn response to the Houthi report, troops loyal to the internationally recognized government in Yemen confirmed that their air force had struck a Houthi depot and vehicles in the area.\nSaudi-backed coalition ramps up attacks after new Houthi offensive\nThe civil war in Yemen began in 2014, when the Houthis seized the capital Sanaa from the Saudi-backed government. They went on to take control of vast swaths of the country's north.\nSaudi Arabia joined forces against the Houthis the following year, leading an international coalition against them. But so far, Yemen's government forces have not been able to effectively repel the latest Houthi offensive.\nFighting has spiked in September as the Houthis launched a lightning offensive that saw them seize Yemen's entire Red Sea coast. The rebels have also launched a blockade on Saudi energy exports to coincide with Iran's closure of the Strait of Hormuz.\nRenewed clashes are is under way in several parts of the country, with at least 125,000 people displaced by it.\nThe Yemeni government has meanwhile called for a general mobilization, urging Yemenis to join the army and security forces.\nYemen is one of the poorest in the world and remains gripped by a vast humanitarian crisis.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Avalanche in Nepal leaves 2 dead, several missing", "title_en": "Avalanche in Nepal leaves 2 dead, several missing", "summary_ja": "An avalanche has struck the Himlung Himal base camp in Nepal after days of severe weather. Two guides are confirmed dead and at least 14 people remain missing in the remote region.", "summary_en": "An avalanche has struck the Himlung Himal base camp in Nepal after days of severe weather. Two guides are confirmed dead and at least 14 people remain missing in the remote region.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/avalanche-in-nepal-leaves-2-dead-several-missing/a-79450101?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Nepal avalanche kills at least 2, leaves several missing\nSeptember 27, 2026\nTwo people have died when an avalanche struck the base camp of a mountain in Nepal with at least 14 others still missing.\nThe avalanche hit the 7,126-meter (23,380-foot) Himlung Himal after several days of heavy rain and snowfall across the region.\nThe dead and missing are all mountain guides and staff of Nepalese expedition companies who had been preparing the base camp for paying customers to climb the mountain.\n\"There were a total of 14 kitchen staff members and two climbing guides from different companies who were missing,\" the Nepal National Mountain Guide Association said. \"The two climbing guides have been found, but sadly, both were found deceased.\"\nUnclear how many are missing\nThere was conflicting information as to how many people were in the affected area near the border with Tibet at the time of disaster. Local police said there were at least 22 people at the base camp when the avalanche struck on Sunday morning.\nBibhuti Chand Thakur, head of trekking company Himalayan Holidays Nepal, told news agency DPA that search and rescue operations were under way. \"The chance of survival remains high because of fresh snow,\" he said, adding that he did not yet have a definitive number of missing or survivors, as the area is remote and cut off from communication.\nAuthorities had warned of severe weather across Nepal over the weekend. Rain has affected much of the country since Thursday, with snowfall reported in the higher northern regions. The conditions have disrupted roads and trekking routes and led authorities to suspend climbing and trekking activities on several mountains.\nThe Himalayan nation is home to eight of the world's 14 mountains higher than 8,000 meters, and trekking and mountaineering tourism is vital to the country's economy.\nThe latest avalanche comes as Nepal continues to recover from devastating floods in August that killed more than 1,400 people and left thousands missing.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Hurricane Nolo lashes Hawaii as new threat of 'volcanic hail' arises", "title_en": "Hurricane Nolo lashes Hawaii as new threat of 'volcanic hail' arises", "summary_ja": "Millions of Hawaii residents are on alert as Hurricane Nolo closes in and is forecast to bring heavy rain and winds.", "summary_en": "Millions of Hawaii residents are on alert as Hurricane Nolo closes in and is forecast to bring heavy rain and winds.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/hawaii-high-alert-hurricane-nolo-closes-islands/story?id=136782145", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "UK police arrest 5 men under terrorism, explosives acts close to US air base", "title_en": "UK police arrest 5 men under terrorism, explosives acts close to US air base", "summary_ja": "British police announced on Sunday morning that five people were arrested \"on suspicion of offenses under the explosives act\" close to a major air base.", "summary_en": "British police announced on Sunday morning that five people were arrested \"on suspicion of offenses under the explosives act\" close to a major air base.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/uk-police-arrest-explosives-act-major-incident-us/story?id=136793301", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "At least 27 dead after two mass shootings in South Africa, police say", "title_en": "At least 27 dead after two mass shootings in South Africa, police say", "summary_ja": "Seventeen people killed near Johannesburg in suspected ‘illegal goldmining turf war’, as 10 killed in separate incident at barbecue venue near Cape Town Two separate mass shootings near South Africa’s two biggest cities killed at least 27 people, as the country grapples with one of the world’s highe", "summary_en": "Seventeen people killed near Johannesburg in suspected ‘illegal goldmining turf war’, as 10 killed in separate incident at barbecue venue near Cape Town Two separate mass shootings near South Africa’s two biggest cities killed at least 27 people, as the country grapples with one of the world’s highe", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/27/mass-shootings-south-africa-johannesburg-cape-town", "state_media": false, "category": "政治", "full_text": "Two separate mass shootings near South Africa’s two biggest cities killed at least 27 people, as the country grapples with one of the world’s highest murder rates amid investigations into corruption and criminality within the police.\nThe South African police service said on Sunday that 17 people were killed on Saturday night when eight suspects armed with AK-47 assault rifles and pistols opened fire at a bar in Wedela township, about 50 miles south-west of central Johannesburg. At least 15 other people sustained gunshot injuries in that attack, police said.\nIn a separate statement, police said 10 people had been killed in a mass shooting at an entertainment venue selling grilled meat, known as shisanyama, in Lwandle, near Cape Town. Another 11 people were wounded in that shooting. Police said they were searching for multiple suspects, without giving an exact number.\nThe two attacks happened days after a mass shooting by three gunmen at a house party near the east-coast city of Durban killed 11 people, including a pregnant woman.\nNo arrests had been made in the two latest mass shootings, police said.\nSouth Africa has struggled with high rates of violent crime for years, but the series of mass shootings this week were shocking even to a country used to some of the highest violent crime rates in the world.\n“This cannot go on like this,” South Africa’s president, Cyril Ramaphosa, told local TV news channels. “This is the level of criminality that we must bring down, and our security forces are now going to continue pulling out all stops.”\nPolice in the province of Gauteng said on Sunday morning they had launched a manhunt for the unidentified eight suspects in the Johannesburg tavern shooting, with no arrests yet made.\n“It is alleged that patrons were drinking inside and outside the tavern when the suspects arrived and opened fire on those outside,” a police spokesperson, Capt Tintswalo Sibeko, said in a statement.\n“The suspects then entered the tavern and continued shooting at patrons inside. The suspects were reportedly armed with AK-47 rifles and pistols. They allegedly searched some patrons and took their cellphones before fleeing the scene in two unidentified motor vehicles. Two vehicles were also set alight during the incident.”\nWhile many local residents did not want to speak about the shooting, one said that illegal goldminers were active in the area. Gauteng province’s police commissioner, Tommy Mthombeni, told reporters that one of their lines of inquiry was that the shooting was part of a “turf war in terms of illegal mining”.\nIllegal miners, known as zama zamas, which means “to take a chance” in Zulu, are usually part of powerful gangs, with multiple mass shooting incidents around Johannesburg blamed on them in recent years.\nMthombeni also said Saturday’s shooting could have been retaliation for another at the same tavern about a month ago.\nWestern Cape police said they had set up a team led by serious violent crime detectives to investigate the Cape Town shooting, in which the gunmen entered the shinsanyama venue at about 1.46am on Sunday and starting shooting at customers.\n“Five individuals died on the scene while five others succumbed to injuries sustained after being transported to medical facilities,” the statement said. “Eleven others are receiving medical treatment for injuries sustained … Detectives are hard at work in search of the perpetrators of the shooting incident, with no arrests effected yet. The identities of the deceased persons will be released once their next of kin are informed.”\nA police official said that “business jealousy might have been the issue”, citing reports that people had been buying cheaper alcohol elsewhere and then bringing it to the venue to drink.\nSouth Africans are already reeling after the discovery of numerous women’s bodies near Johannesburg’s airport since July, most of which were found in the last few weeks. The killings led to renewed anger about high rates of gender-based violence in the country, and have piled pressure on police and politicians to do more about it.\nAlongside this, the Madlanga commission judicial inquiry has been examining allegations of corruption and criminality within the police in televised hearings for the past year.\nSouth Africa had a murder rate of almost 40 per 100,000 people in 2024, according to the UN office on drugs and crime. That was the ninth-highest in the world that year, with only Caribbean countries higher.\nIn the 12 months to 30 June, more than 22,700 people were murdered in South Africa, according to police data.\nAssociated Press and Reuters contributed to this report", "translation_ja": "", "vocab": []}, {"title_ja": "‘It’s hard to sell a house when it’s covered in baboon faeces’: Cape Town divided over plan to remove its monkeys", "title_en": "‘It’s hard to sell a house when it’s covered in baboon faeces’: Cape Town divided over plan to remove its monkeys", "summary_ja": "Two troops of chacma baboons are breaking into homes and shops but animal rights activists insist coexistence is the answer Cape Town’s city council has said it will “imminently” round up two baboon troops coming into repeated conflict with residents . The animals will be sterilised and permanently ", "summary_en": "Two troops of chacma baboons are breaking into homes and shops but animal rights activists insist coexistence is the answer Cape Town’s city council has said it will “imminently” round up two baboon troops coming into repeated conflict with residents . The animals will be sterilised and permanently ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/sep/27/baboons-cape-town-divided-over-plan-to-remove-its-monkeys-aoe", "state_media": false, "category": "社会", "full_text": "Cape Town’s city council has said it will “imminently” round up two baboon troops coming into repeated conflict with residents. The animals will be sterilised and permanently moved to a newly constructed sanctuary. The plan has been fiercely criticised by animal rights activists, who say the monkeys should remain roaming freely, and that less destructive options have not been properly considered.\nCape Town’s baboon problem has been brewing since the 2000s, after the city stopped culling troops in the late 1990s after pressure from the public. But in the past two years it has reached boiling point. A 2025 census found that the population had grown by a third since 2000, from 360 baboons to 493, now living in 12 managed troops.\nAs a result of the population boom, troops of chacma baboons on the city’s peninsula regularly rip off roof sheeting, sneak into unlocked cars and raid food pantries. Some monkeys are now staying up late into the night to break into homes in Simon’s Town and nab snacks from convenience stores. Residents can no longer barbecue or host garden parties for fear of the marauding baboons.\n“It’s depreciated property values because it’s hard to sell a house when it’s covered in baboon faeces and paw prints, and you know they’re coming every day,” said Justin O’Riain, a behavioural ecologist at the University of Cape Town who has long studied the local baboons.\nCape Town’s geography is partially to blame. Much of the problem is confined to the Cape Peninsula, a narrow sliver of land stretching from the city centre to Cape Point. Here, baboons are boxed in between the steep, protected area of Table Mountain national park and the sprawling urban development that stretches to the Atlantic Ocean.\n“The underlying issue is that baboons will seek low-lying land. That is their natural drive – it’s better access to water and more productive vegetation,” said Joselyn Mormile, who leads the Cape Baboon Partnership (CBP), a nonprofit organisation that works with the city and local conservation authorities to manage the baboons. “But throughout the peninsula, we’ve developed most of those places. It’s a constant battle between the two.”\nInitially, the CBP’s 2025 management plan proposed to move four troops to a sanctuary. That was revised, Mormile said, to give two other troops living in the northern section of the peninsula “the benefit of the doubt to see if they can adjust in that remaining space … We believe that they could settle quite nicely.”\nThe baboons have proved an especially divisive – and expensive – issue. Cape Town’s baboon management programme costs about 20m rand for 18 months (£920,000), with full-time rangers watching over most of the troops to try to head off any trouble.\nIn addition to moving the Waterfall and Seaforth troops to a sanctuary, a baboon-proof northern boundary fence will be erected between urban areas and nearby mountains.\nAnimal rights activists, who have been staging peaceful protests for months, and some scientists say the city should build a fence to exclude the Waterfall and Seaforth troops rather than remove the animals from their environment.\nHowever, O’Riain said it was likely that the baboons would simply move along to the next area of low-lying land where the fence ends, as there was not enough food for the baboons behind the proposed southern fenced area.\nOpponents argue that removing the other baboons will cause long-term psychological distress and social disruption, and that the baboons play an important ecological role by dispersing plant seeds.\nChacma baboons are not considered endangered. And the welfare of the animals is already in question: baboons are being poisoned, hit by cars, chased by dogs and shot.\n“No one should ever shoot a baboon, but if people feel the authorities are not doing anything, they will take action – and that action is never nice,” O’Riain said. “Just a few days ago, a baboon was shot straight through the chest.\n“How many more millions of rand are we going to throw into these troops only to end up in exactly the same place in another 10 years’ time?” he said. “Which is shocking baboon welfare, shocking baboon health, and a very poor quality of life for the people who are living in these areas.”\nFind more age of extinction coverage here, and follow the biodiversity reporters Rebecca Ratcliffe, Phoebe Weston and Patrick Greenfield in the Guardian app for more nature coverage.", "translation_ja": "", "vocab": []}, {"title_ja": "Rebel offensive against Ethiopian army stokes fears of return to civil war", "title_en": "Rebel offensive against Ethiopian army stokes fears of return to civil war", "summary_ja": "Fighting escalates after Tigrayan rebels form new coalition aimed at overthrowing Abiy Ahmed government There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance ai", "summary_en": "Fighting escalates after Tigrayan rebels form new coalition aimed at overthrowing Abiy Ahmed government There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance ai", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/24/fears-return-to-war-tigray-rebels-launch-offensive-against-ethiopian-army", "state_media": false, "category": "政治", "full_text": "There are growing fears of a return to civil war in Ethiopia after an offensive by fighters from Tigray into the neighbouring states of Afar and Amhara and the formation of a new rebel alliance aimed at overthrowing the government of the prime minister, Abiy Ahmed.\nAbout 600,000 people died between 2020 and 2022 during a devastating war between the Ethiopian army and the political party and paramilitary group the Tigray People’s Liberation Front (TPLF). Both sides are now accusing the other of triggering a return to open conflict.\nOn Sunday, seven armed groups from around the country, including the TPLF, announced the formation of the Ethiopian Peoples’ Forces Alliance for Survival, aimed at deposing the government in Addis Ababa. Then, on Wednesday, the TPLF seized control of three airports from federal police. The state-owned carrier, Ethiopian Airlines, said it had suspended flights to the region “due to the current situation”.\nThe TPLF also launched attacks into Afar and Amhara. A humanitarian source in Afar told Agence France-Presse there were heavy artillery attacks by the group on Thursday as they attempted to take control of the town of Yallo, near the Tigrayan border.\nFlights to the historic Ethiopian town of Lalibela were also suspended on Thursday because of nearby fighting, while people in Tigray stocked up on food and cash, with one resident telling Reuters that people there feared they could face siege conditions similar to those during the previous war.\nA resident of Adigrat, a city close to the Eritrean border, described panic-buying and shops emptying. “Food shortages are worsening as market shelves sit empty … Essential medicines remain scarce and astronomically expensive,” he told Reuters. “Daily survival has become a constant calculation.”\nThe TPLF’s vice-president, Amanuel Assefa, told AFP: “We are in the situation of full-blown war now.” He confirmed Tigrayan forces were fighting alongside local armed groups in Afar and Amhara.\nThe group took control of Abala, also on the Tigray-Afar border, on Wednesday, a foreign security source based in Ethiopia told AFP, while a TPLF source said they had seized several other towns in Afar. The foreign security source also said there was fighting around the Amhara town of Weldiya – one of the few routes to the capital.\nIn its first public comments on the fighting, Ethiopia’s army said on Thursday it had foiled the attacks and killed, wounded or captured more than 500 enemy fighters.\nAnalysts say the TPLF has support from Ethiopia’s neighbour and historic adversary Eritrea, which fears landlocked Ethiopia is planning to invade its territory to gain access to the Red Sea. The TPLF’s Assefa told AFP “we have no information about Eritrea’s plan”. Asked if they would request Eritrean intervention, he said: “Not yet.”\nThe current fighting reflects shifting dynamics from the civil war, when Eritrea and Fano, an insurgent group that is now part of the new alliance, both fought with the government against the Tigrayans.\nSpeaking at the UN general assembly on Wednesday, the Ethiopian president, Taye Atske-Selassie Amde, decried “the forces of destruction and mayhem” and “interference in our internal affairs by adversarial elements”. He said Ethiopia had exercised “immense restraint” and made progress with its neighbours.\nAbiy’s spokesperson, Billene Seyoum, said members of the alliance had been collaborating for a while with the financial backing of Eritrea. Eritrea has repeatedly denied similar accusations.\nThe TPLF ruled Ethiopia from 1991 to 2018 before being sidelined by the rise of Abiy, eventually triggering the civil war.\nThe renewed fighting marks the most serious challenge yet to the 2022 Pretoria agreement, which ended the civil war and maintained an uneasy calm until late last year, when clashes resumed.\nIt raises fears of a broader regional conflict that could draw in armed groups from across and further destabilise a region already strained by war in neighbouring Sudan and tensions along the Red Sea.\nOn Wednesday, the African Union chair, Mahmoud Ali Youssouf, urged “utmost restraint” from the warring parties and resumption of direct talks. An EU spokesperson called for “immediate de-escalation” and a recommitment to the Pretoria agreement.\nIn the 2020-22 war, Tigray was largely cut off from the outside world as communications were severed, and access to food, cash and medicines was severely restricted, pushing hundreds of thousands of people into famine-like conditions.\nAFP and Reuters contributed reporting", "translation_ja": "", "vocab": []}, {"title_ja": "Pope pledges action on clergy child abuse in meeting with French survivors", "title_en": "Pope pledges action on clergy child abuse in meeting with French survivors", "summary_ja": "Head of the Roman Catholic Church holds &#039;emotional&#039; two-hour meeting with seven abuse victims in French town of Lourdes.", "summary_en": "Head of the Roman Catholic Church holds &#039;emotional&#039; two-hour meeting with seven abuse victims in French town of Lourdes.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/27/pope-pledges-action-on-clergy-child-abuse-in-meeting-with-french-survivors?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Pope pledges action on clergy child abuse in meeting with French survivors\nHead of the Roman Catholic Church holds ’emotional’ two-hour meeting with seven abuse victims in French town of Lourdes.\nPope Leo XIV has thanked a group of survivors of clerical abuse “for their painful testimony” and “reaffirmed his commitment” to end harm by Catholic priests at a meeting in southwestern France, the Vatican said.\nThe leader of the world’s 1.4 billion Catholics is on a four-day visit to France.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Photos: Pope Leo draws hundreds of thousands for open-air Mass in Paris\n- list 2 of 3What has Pope Leo warned about AI – and why that’s significant\n- list 3 of 3French Parliament approves landmark assisted-dying bill\nOn Sunday, the pontiff visited the pilgrimage town of Lourdes, where he privately met seven survivors of child abuse, now adults, and promised to further efforts to reform the Church in the wake of the global sexual abuse scandal.\nThe group said in a later news conference that the meeting was emotional and touching.\n“When he saw the state I was in, he took me into his arms,” survivor Jean-Marie Delbos said, adding, “It was an extraordinary moment.”\nThe 80-year-old was abused as a pupil at the nearby boarding school of Notre-Dame de Betharram, where staff have been accused of physical and sexual abuse over several decades.\nThe survivors said they felt heard and that they were impressed by Leo’s compassion and knowledge of their individual cases.\nBut they hoped the words would be accompanied by action.\nJerome Guillement, who has written about a priest abusing him as a teenager, said at the news conference that the pope understood the “systemic” nature of sexual abuse in the Church.\n“From his point of view, the perpetrators are individuals, but what allows it to continue is the systemic dimension within the institution,” he said.\n“He certainly believes that the Church has done a great deal in France, but he also believes that the Church in France still has a tremendous amount left to do.”\nLocal leaders hoped Leo’s visit would help repair the Church’s standing after a 2021 independent inquiry found that some 330,000 French children had been abused by Catholic clergy and lay leaders over seven decades.\nThe pope told an estimated 150,000 people gathered for a Mass in a field near the famed Catholic shrine in Lourdes earlier on Sunday that the Church must have the courage to face its past.\nVeronique Garnier, another survivor who met with the pontiff, said she had found the Mass, in which Leo referred to abuse without directly apologising for it, troubling and wondered why she had attended.\nBut she said she was encouraged by her meeting with Leo.\n“I do indeed believe there is hope – hope that there can be change and truly listening to us at a deep level, rather than just superficially with beautiful words that are never followed by any real action,” she said.\nLeo also spoke about the abuse scandals in a closed-door meeting with French bishops on Sunday, according to a Vatican-provided text.\nHe was expected to visit the northeastern city of Metz on Monday before returning to Rome the same day.", "translation_ja": "", "vocab": []}, {"title_ja": "Man City’s 115 Charges — The Scandal, The Escape, and Pep’s Own Past", "title_en": "Man City’s 115 Charges — The Scandal, The Escape, and Pep’s Own Past", "summary_ja": "Man City just got found guilty on 114 of 115 financial charges — but the story behind it is much more complex.", "summary_en": "Man City just got found guilty on 114 of 115 financial charges — but the story behind it is much more complex.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/27/man-citys-115-charges-the-scandal-the-escape-and-peps-own?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Man City's 115 Charges — The Scandal, The Escape, and Pep's Own Past\nNewsFeed\nMan City’s 115 Charges — The Scandal, The Escape, and Pep’s Own Past\nMan City just got found guilty on 114 of 115 financial charges — but the story behind it involves a convicted hacker, a five-year loophole, and a manager who’s spent three decades standing next to scandals. Al Jazeera’s Basel Ghazoghli breaks it down.\nPublished On 27 Sep 2026", "translation_ja": "", "vocab": []}, {"title_ja": "Powerful storm floods US Northeast, causes power outages", "title_en": "Powerful storm floods US Northeast, causes power outages", "summary_ja": "The nor&#039;easter causes another round of flooding in low-lying areas in New Jersey and New York City and knocks out power.", "summary_en": "The nor&#039;easter causes another round of flooding in low-lying areas in New Jersey and New York City and knocks out power.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/27/powerful-storm-floods-us-northeast-causes-power-outages?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Powerful storm floods US Northeast, causes power outages\nThe nor’easter causes another round of flooding in low-lying areas in New Jersey and New York City and knocks out power to tens of thousands of homes into New England.\nA powerful storm is pummelling the shoreline in the northeastern United States for a second day, causing another round of flooding in low-lying areas and knocking out power to tens of thousands of homes.\nTidal surges swamped low-lying neighbourhoods in New Jersey on Sunday, while wind gusts toppled trees on New York’s Long Island, damaging homes and bringing down utility poles.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Three killed, four injured in shooting at Detroit, Michigan, strip club\n- list 2 of 3Israel revokes Dutch diplomats’ status over sanctions on settlements\n- list 3 of 3Ireland defeats Israel in controversial UEFA Nations League match\nIn New York City, streets in the Howard Beach neighbourhood of Queens were inundated.\nThe slow-moving storm, which killed a New York City housing authority worker when a tree fell on Saturday, was expected to linger through Sunday, with heavy rain, strong winds and dangerous surf all the way to New England.\nExtreme amounts of rain – more than 10cm (4 inches) since Friday in some spots in New Jersey – combined with a surging ocean led to flooding amounts not seen for close to a decade in places used to dealing with high water, residents said.\nThe storm, known as a nor’easter, triggered memories of Hurricane Sandy, which left behind more than $60bn in damage across the eastern US in 2012. While this storm’s impact has been nowhere near that, it could be the first of several along the East Coast this fall because of an El Nino climate pattern disrupting this year’s weather.\nImages of waves crashing into sea walls and onto beaches raised concerns about coastal erosion.\nMore than 100,000 customers were without power across the Northeast and mid-Atlantic at times on Sunday, according to PowerOutage.us. The most widespread outages were in counties along the coast from New Jersey to Connecticut.\nNumerous flights were cancelled or delayed up and down the coast. More than 250 flights had been cancelled at Boston Logan International airport by late Sunday morning as wind gusts reached 64km/hour (40 mph), according to the Massachusetts Port Authority.\nThe worst of the remaining rainfall was expected on Sunday from northern New Jersey into southern New England.\nWhile the storm was gradually weakening, tidal flooding would stay through high-tide cycles Sunday night, said Bob Oravec, a lead forecaster with the National Weather Service in College Park, Maryland.", "translation_ja": "", "vocab": []}, {"title_ja": "3 people killed, 4 injured in shooting at Detroit strip club, police say", "title_en": "3 people killed, 4 injured in shooting at Detroit strip club, police say", "summary_ja": "“A fight occurred, an altercation occurred, and as a result individuals decided to settle it with gun violence,” he said.", "summary_en": "“A fight occurred, an altercation occurred, and as a result individuals decided to settle it with gun violence,” he said.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/people-killed-injured-in-shooting-at-detroit-strip-club-police-say/article71517417.ece", "state_media": false, "category": "政治", "full_text": "Three people were killed and four more were injured when an argument led to gunfire at an after-hours strip club Sunday (September 27, 2026) morning in Detroit, officials said.\nPolice responding to the 7:21 am shooting on a largely residential street found three men who had been fatally shot, Detroit Police Chief Todd Bettison told reporters at a news conference.\nFour more people — two men and two women — were taken in private cars to area hospitals. None are thought to have life-threatening injuries.\nAll the victims are thought to be in their 20s and 30s, Mr. Bettison said.\n“A fight occurred, an altercation occurred, and as a result individuals decided to settle it with gun violence,” he said.\n“This address is not new to the Detroit Police Department,” he said, noting police had seven calls to the location this year. He said the department had leads but wouldn't discuss them any further.\n“This was an after-hours location,” he said of the shooting scene. “Imagine a strip club. … I'll leave it at that.”\nDetroit Mayor Mary Sheffield urged anyone with information to contact authorities.\n“We know that we need more people to speak up to bring justice to the situation,” she said at the news conference. “It's heartbreaking and our community should not suffer from this type of violence.”\nEarlier Sunday (September 27, 2026), a shooting broke out at a birthday party at a park in Macon, Georgia, leaving 12 teens with gunshot wounds, Bibb County Sheriff David Davis said during a news conference. Two of the injured were in critical condition, while the others were stable. There were no immediate arrests, but Davis said investigators had several persons of interest.\nPublished - September 28, 2026 04:14 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "Israeli media says Netanyahu made unannounced visit to UAE", "title_en": "Israeli media says Netanyahu made unannounced visit to UAE", "summary_ja": "The premier's office did not immediately comment", "summary_en": "The premier's office did not immediately comment", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/israeli-media-says-netanyahu-made-unannounced-visit-to-uae/article71517298.ece", "state_media": false, "category": "社会", "full_text": "Israeli media reported on Sunday (September 27, 2026) that Prime Minister Benjamin Netanyahu had made an unannounced visit to the United Arab Emirates to meet with the Gulf state's leader.\nTV channels 12 and KAN as well as the newspapers Haaretz and The Jerusalem Post said that Mr. Netanyahu undertook a one-day visit to the UAE to meet President Mohamed bin Zayed Al Nahyan.\nThe premier's office did not immediately comment.\nThe reported visit comes with the West Asia still gripped by the Israel-U.S. war launched against Iran in February.\nIt also comes weeks after a bombshell Israeli media report that said the Emirati president warned Mr. Netanyahu ahead of Hamas's October 7, 2023 attack on Israel, which the Israeli premier did not pass on to the security services.\nMr. Netanyahu has denied the story.\nIsrael and the UAE formally established diplomatic relations in 2020 as part of the U.S.-negotiated Abraham Accords.\nPublished - September 28, 2026 02:07 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "U.K. police arrest five for preparing ‘terrorist act’ as incident near air base probed", "title_en": "U.K. police arrest five for preparing ‘terrorist act’ as incident near air base probed", "summary_ja": "Some 85 households in the nearby village of Whelford were advised to evacuate and army bomb disposal experts were called in.", "summary_en": "Some 85 households in the nearby village of Whelford were advised to evacuate and army bomb disposal experts were called in.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/uk-london-fairford-air-base-bomb-threat/article71515604.ece", "state_media": false, "category": "社会", "full_text": "British counter-terrorism police were on Sunday probing “a major” incident near a base used by the U.S. air force after arresting five men on suspicion of “preparing a terrorist act”, police said.\nArmed officers detained the group in the early hours after a call to emergency services about three “suspicious vehicles which appeared to be travelling towards the air base”, London’s Metropolitan Police said in a statement.\nThe suspects were initially held near the Royal Air Force (RAF) Fairford air base in Gloucestershire, southwest England, on suspicion of explosives offences.\nSome 85 households in the nearby village of Whelford were advised to evacuate and army bomb disposal experts were called in.\n“Counter Terrorism Policing can now confirm they are leading an investigation into an incident which took place overnight near RAF Fairford in Gloucestershire,” the Metropolitan Police statement added.\nIn March, then Prime Minister Keir Starmer granted permission for “defensive” U.S. action against Iranian missile sites from two U.K. bases including Fairford.\nPrime Minister Andy Burnham was being kept updated on the incident, a government spokesperson said.\n“We are grateful to the emergency services, who have acted quickly to detain several suspects and put measures in place to keep the community safe,” the spokesperson said.\nU.S. President Donald Trump said on Sunday that the suspects were aiming to do significant damage to the base. “We had them under investigation. They, they were looking to do big damage to our fort, and working with the British worked out great,” Mr. Trump said. “We had them under view for a long time, and we got them.”\nDefence Minister Wes Streeting thanked “emergency and specialist teams” deployed to the scene. “We can be reassured that this is being dealt with,” he said on X.\nFairford is the U.K. base of the 501st Combat Support Wing, a U.S. air force administrative support wing, which said in a statement that no U.S. air force personnel had been involved in the incident.\nPublished - September 27, 2026 02:13 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "Bruce Arthur: Could AI be a trap for humanity? The evidence seems to be piling up - Toronto Star", "title_en": "Bruce Arthur: Could AI be a trap for humanity? The evidence seems to be piling up - Toronto Star", "summary_ja": "Bruce Arthur: Could AI be a trap for humanity? The evidence seems to be piling up Toronto Star", "summary_en": "Bruce Arthur: Could AI be a trap for humanity? The evidence seems to be piling up Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9wFBVV95cUxOTHdFeTdMb3poRVcwNlNVQ05HYllsQlNrMVJoR0tMaU9YUzU5QWZ4RU5TSEFBWWlzRENHcVQ0VFVHN0c0V1F5WUpGT1RFNVhNUUdpMmhQclh6cVE5dTZKNC1taUdTNGUyVXVMWVBad1M5ZXQxbWNucnhzaWloeDNBUXJ0UGg2bjcxSGpmcXdVRXItNDZmM2pGSUg5QmZrV3c3Y2lHcHZPbEhyalQ0SjVQSHp0U0tVeXFoWFB0ellLQWpBVnB6OFJnbUxiQklLTFB4YlY4OTNoRXVEeTBiZHFBdl9mUlZZLS1DeFJ2b3hEN2EweU1MNUtZ?oc=5", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Ontario is launching free flu and COVID-19 shots next week as vaccination rates decline - Toronto Star", "title_en": "Ontario is launching free flu and COVID-19 shots next week as vaccination rates decline - Toronto Star", "summary_ja": "Ontario is launching free flu and COVID-19 shots next week as vaccination rates decline Toronto Star", "summary_en": "Ontario is launching free flu and COVID-19 shots next week as vaccination rates decline Toronto Star", "source": "The Star", "tier": "paper", "link": "http to Douala has opened a new chapter in regional connectivity, linking Enugu directly with Cameroon while creating fresh opportunities for trade, tourism, investment and stronger economic ties between both countries, writes Gideon Arinze SourceAircraft Parts\nAt exactly 2:48 p.m. on Wednesday, 23 September the Enugu Air aircraft touched down at the Douala International Airport, bringing cheers, applause and a sense of anticipation from passengers and officials gathered to receive the historic flight.\nFor those on board, the moment was the physical manifestation of a journey that had begun in Enugu and, for the first time, crossed Nigeria’s borders under the banner of the state’s own airline.\nAs the aircraft taxied to its position, the atmosphere around the airport changed. Cameroonian authorities, airport officials, members of the Nigerian community, diplomatic representatives and other guests gathered to welcome the aircraft and its passengers. The excitement was palpable.\nSome of the first set of passengers that joined Enugu Air to Douala – Mrs Chukwuma, Mrs Love Chidiogarum, and Mr Ogbonna Jude – were rewarded with gifts by the airline to appreciate their patronage.\nMrs Chidiogarum, expressed delight that she doesn’t need to travel to Lagos anymore to catch a flight going to Douala. SourceAircraft Parts\n“I doubted this initially when I was booking. Before, we normally travel first to Lagos and in some instances, we need to book hotels. All these come with cost. But now, we have a direct flight and in less than one hour, I am in Cameroun.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“I am so happy because I come to Enugu often. I have a school in Enugu. So, next month I will still fly Enugu Air back to Enugu,” she added.\nAnother passenger, an elated Arsenal Bruno Chiagozie, commended the state government for the feat and urged travellers to patronise the airline.\n“I am happy and proud to be an Enugu man. I believe that very soon this airline will conquer Africa,” he added.\nThe inaugural flight marked Enugu Air’s first major step beyond Nigeria and the launch of a direct air connection between Enugu and Douala, Nigeria and Cameroon, and the South-east and Central Africa. For businesses, connectivity means access to markets. For traders, it can mean shorter journeys and easier movement of goods. For tourists, it means greater accessibility. For families and communities, it means people can move more easily between countries. For governments, it creates another channel through which economic and cultural relationships can deepen.\nAnd for Enugu, the route creates the possibility of positioning the state not merely as a destination within Nigeria but as an emerging regional gateway.\nFor a state that has historically looked to Lagos and Abuja for much of its international air connectivity, the significance of the moment was not lost on the delegation from Enugu. It was, in many respects, Enugu announcing itself to a wider African market. And for Enugu Air, it was the beginning of an ambition to transform Enugu into a place from which people, goods, businesses and ideas can move into Africa and, eventually, the wider world.\nEnugu State Governor, Peter Mbah, described the development as part of a broader master plan to reposition the state as a preferred destination for investment, business, tourism and habitation, as his administration pursues its ambition of growing the state’s economy to $30 billion.\n“Months ago, right here, we watched Enugu take to the skies. In just barely six months after a rigorous regulatory process, Enugu Air obtained her Air Operator’s License. This is not a mean feat,” Mbah said.\n“Today, 14 months after, we can see that dream flying beyond our expectations, as Enugu Air is one of the fastest-growing airlines in Nigeria, without a doubt.” SourceAircraft Parts\nAccording to him, Enugu Air was conceived as part of a larger development strategy rather than simply as a state-owned aviation venture.\n“But we did not conceive of Enugu Air as a bragging right or because of the clamour, or to gain some political acclaim. Enugu Air is part of the masterplan to make Enugu State the premier destination for investment, living, business and tourism. For us, Enugu Air is part of connecting the dots,” he added.\nFrom Enugu to Douala\nThe significance of the inaugural flight was amplified by the long-standing relationship between the people of Nigeria and Cameroon.\nAt the Douala reception, the General Manager of Aéroports du Cameroun, Thomas Assoumou, recalled that the name Enugu was not unfamiliar to Cameroonians.\nHe pointed to the sporting history between Canon Yaoundé and Enugu Rangers as one of the longstanding links between the two places.\n“Today, however, we are witnessing a new partnership and a new connection between our two states,” Assoumou said.\nFor him", "translation_ja": "", "vocab": []}, {"title_ja": "Guild of Editors tour Mbah’s projects, confirm solid infrastructure on ground", "title_en": "Guild of Editors tour Mbah’s projects, confirm solid infrastructure on ground", "summary_ja": "The editors who were in Enugu for the 2026 All Nigerian Editors Conference (ANEC), attended by over 300 editors, senior media executives and veterans, bared their minds at the weekend during an interactive session with Governor Mbah, after a tour of several mega projects executed by the state govern", "summary_en": "The editors who were in Enugu for the 2026 All Nigerian Editors Conference (ANEC), attended by over 300 editors, senior media executives and veterans, bared their minds at the weekend during an interactive session with Governor Mbah, after a tour of several mega projects executed by the state govern", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/912803-guild-of-editors-tour-mbahs-projects-confirm-solid-infrastructure-on-ground.html", "state_media": false, "category": "政治", "full_text": "Leaders of the country’s media sector under the umbrella of Nigerian Guild of Editors (NGE) have commended what they described as Governor Peter Mbah’s exceptional leadership in Enugu State, noting that he had built solid infrastructure needed for growing the state’s economy.\nThe editors bared their minds at the weekend during an interactive session with Mbah at the Government House after a tour of several mega projects executed by the administration on the sidelines of the 2026 All Nigerian Editors Conference (ANEC), attended by over 300 editors, senior media executives and veterans.\nNGE’s President, Eze Anaba, noted that Mbah’s infrastructural revolution was a clear testament to what a sub-national government could achieve when its leadership was visionary, altruistic, and deliberate.\n“There’s a solid infrastructure on ground that will grow the economy, that will expand the state. If a sub-national like Enugu can deploy resources effectively and can be this dedicated in terms of infrastructure, in terms of dedication to governance, then there is hope for Nigeria.\n“We were here last year for the NGE biennial convention. We saw Smart Schools. We saw the ultramodern Technical, Vocational Education and Training College at GTC. We saw roads. We saw the modern transport terminals, the rehabilitated moribund industries and those nearing completion at the time. We saw pipe-borne water that people had not seen in years. We saw many projects.\n“Today, we saw the Enugu International Hospital completed. Today, we saw an incredible road network. That includes the 40km Owo-Ubahu-Amankanu-Umualor-Ikem dual carriageway that we were told would now serve as a new gateway to the North Central.\n“Today, we saw the fully resuscitated and functional state assets like the Hotel Presidential. Today, we saw one of the mega Smart Secondary Schools that it had almost completed. We saw the massive tourism complex at Ngwo Pines where they also built a zipline. We saw the ongoing Integrated livestock hub, which the Secretary to the State Government, Prof Chidiebere Onyia, said could take up to 40,000 cattle. Of course, we saw the ultra-modern Command and Control Centre that has helped the administration to drive down the crime rate significantly.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“At the opening ceremony two days ago, you said that ‘Tomorrow is here.’ And with what we saw today, I believe you.”\nNoting the decision of some state governments to send their officials to understudy some policies, projects and programmes of the Mbah Administration, Eze commended the prevailing peer-review mindset among some state governors.\nHe said peer review would help states to develop faster, as governors learn from their colleagues’ areas of strength.\n“It is no mean feat for a governor to attract the respect, the regard of his colleagues,” he stressed, commending Mbah’s leadership results.\nMeanwhile, speaking at the gala to mark the end of the conference, former governor of Ogun State and a media veteran, Chief Segun Oshoba, extolled Mbah’s infrastructural milestones, especially in the area of security, urging other states to emulate Enugu in building hi-tech statewide surveillance systems.\nOsoba cited the swift deployment of the state’s security assets to track down and capture kidnappers, who breached security at Affa in Udi LGA, while also ensuring that the two hostages returned unharmed.\n“I was so confident that it can’t happen in Enugu and that the criminals would not go free. Thank you, Mr. Governor. You proved me right that there is no room for kidnappers in Enugu State.\n“Keep it up, Governor Mbah. I will keep reminding the President that other governors should do what you are doing in Enugu State in the area of security and other areas,” Osoba stated.\nMbah, on his part, thanked the media executives for taking out time to see some of the projects, noting that the projects were mutually reinforcing and deliberately designed to fulfil his campaign promise to grow Enugu State’s economy from $4.4bn to $30bn and make the state the preferred destination for investment, business, tourism, and living.\n“But for us, what you saw – the security, the transport, the investments, tourism, and all that – are all interconnected. They are mutually reinforcing. They’re all designed to achieve a common objective.\n“When we took office, we laid out a few things. One was to grow the economy of the state exponentially. We also undertook to eradicate poverty and also to create a state where people can live, work, invest, and build futures. And all you saw were all connected to actualising those promises,” he said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "El-Rufai’s betrayers and betrayals, By Festus Adedayo", "title_en": "El-Rufai’s betrayers and betrayals, By Festus Adedayo", "summary_ja": "My first encounter with Nasir El-Rufai was in year 2000 at the Akodo Resort, a popular Lagos beachfront getaway along the Lekki-Epe Expressway in Ibeju-Lekki. As Director-General of the Bureau of Public Enterprises (BPE), he had come to sell to his audience the talismanic powers of the BPE in unbund", "summary_en": "My first encounter with Nasir El-Rufai was in year 2000 at the Akodo Resort, a popular Lagos beachfront getaway along the Lekki-Epe Expressway in Ibeju-Lekki. As Director-General of the Bureau of Public Enterprises (BPE), he had come to sell to his audience the talismanic powers of the BPE in unbund", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/912801-el-rufais-betrayers-and-betrayals-by-festus-adedayo.html", "state_media": false, "category": "政治", "full_text": "My first encounter with Nasir El-Rufai was in year 2000 at the Akodo Resort, a popular Lagos beachfront getaway along the Lekki-Epe Expressway in Ibeju-Lekki. As Director-General of the Bureau of Public Enterprises (BPE), he had come to sell to his audience the talismanic powers of the BPE in unbundling the potential of the Olusegun Obasanjo administration. I saw a super-brilliant man.\nA pint-sized frame trapping a mountainous intellect, Nasir spoke with verve and conviction. In a voice barely above a whisper, he bored deep into the hearts of his audience as one of the standout talents of that era. Yet, as the years rolled by, El-Rufai unraveled into a classic political polymath undone by his own hubris. Locked away in what is undoubtedly a political witch-hunt, he is a quintessential brilliant strategist whose restless tongue and lack of tact ultimately became his Achilles’ heel. El-Rufai’s predicament reflects the tragedy of an impolitic genius: a hugely capable operator perpetually limited by a total absence of a political filter.\nNow, a wound inflicted by a friend does not heal. This African proverb must capture the current state of mind of the stormy petrel of Kaduna State. In that mind, the ironies of power hang thickly in the damp air. Locked beyond iron bars in the custody of the Independent Corrupt Practices and Other Related Offences Commission (ICPC) in Abuja for over 200 days now, life must have dealt Nasir a humbling blow. As he penned the short epistle entitled “Mr Relationship And Its Aftermath” on his X handle last week, psychoanalysis would reveal a mind gutted by regrets, ruptured by guilt, and quietly ruminating on the unforgiving nature of political power.\nIn that X post of his, El-Rufai offered two theses to chew: his relationships, and their aftermath. Nasir’s relationships have always mirrored his historical combativeness. He is never a politician who believed that gentleness was an art of statecraft. His public trajectory shows an uncompromising bulldozer who laid political waste to opponents; a sharp-tongued, untouchable power broker of Abuja and Kaduna.\nEl-Rufai brings to mind the fable of the old, hunting-weary lion who feigned illness and invited all animals to visit his cave, and who slaughtered them one after another for a meal. Similarly, El-Rufai’s path is littered with the carcasses of political associates and bosses whose flesh he mangled for personal convenience. The trail is long: from Atiku Abubakar, to Obasanjo, Muhammadu Buhari, and beyond. The paradoxical question arising from that Nasir X reflection on his relationships is this: Can a man who weaponized political leverage; who wasted associations and friendships in the process, now complain when that same cold, unfeeling apparatus turns its fangs on him?\nConsider the lineage of his battles. El-Rufai is credited with a controversial statement made at a Kaduna APC stakeholders’ meeting in September 2017, where he reportedly declared that his political adversaries always meet an unfortunate end. To validate this, he pointed to his battles with Presidents Umaru Yar’Adua and Goodluck Jonathan. It was widely interpreted as a boast that, while his opponents faced downfall or death, he always survived. Today, the sphinx is at the end of his tethers.\nYet, like a paradox, from the flipside of that same lens, El-Rufai put his combativeness, fearlessness, and acerbic tongue in the service of friendship. The most prominent beneficiaries of that hubris remain former Emir of Kano, Sanusi Lamido Sanusi, and President Bola Ahmed Tinubu.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nUpon the dethronement of Sanusi II in March 2020, El-Rufai demonstrated the truth of the classic Yoruba adage that it is in moments of adversity that true friendship is tested —“Ìgbà ìpónjú l’a ń mò’ré.” As governor of Kaduna State, El-Rufai shielded the embattled Emir, standing resolutely by his side like the Wall of Gibraltar. He intervened through a series of bold, calculated moves, at great risk to his office and political future. By then, insiders who knew said that Buhari’s grievance was beyond what the rest of the world could see. It was encapsulated by the ire of a grieving man seeking vengeance for the trampling of his inviolable “Oza room” by a man whose libido knew no bounds.\nEl-Rufai’s first adversarial and bold, daring move against an Almighty Buhari presidency was a swift, deadly punch delivered with masterly finish: immediate institutional solidarity for the deposed Emir. To fill the public vacuum created by the dethronement, on the very day of his deposition, El-Rufai appointed Sanusi Vice-Chairman of the Kaduna Investment Promotion Agency. Barely 48 hours later, he named him Chancellor of Kaduna State University. It was a massive fortification of brotherly ties at a time when the fear of Buhari’s Villa cabal had caused othe", "translation_ja": "", "vocab": []}, {"title_ja": "5 Arrested on Suspicion of Terrorism Near RAF Fairford Air Base in UK", "title_en": "5 Arrested on Suspicion of Terrorism Near RAF Fairford Air Base in UK", "summary_ja": "The British counterterrorism police say the men were arrested after three suspicious vehicles appeared to be traveling toward R.A.F. Fairford early on Sunday.", "summary_en": "The British counterterrorism police say the men were arrested after three suspicious vehicles appeared to be traveling toward R.A.F. Fairford early on Sunday.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/27/world/europe/raf-fairford-airbase-arrests.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Serbia’s Longtime President Aleksandar Vucic Resigns Post", "title_en": "Serbia’s Longtime President Aleksandar Vucic Resigns Post", "summary_ja": "Aleksandar Vucic, one of Euro
