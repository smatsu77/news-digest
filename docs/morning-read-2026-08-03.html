cles/cr7kmnyrdn7o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Russia says seven killed and 40 injured by Ukrainian drone hitting busy beach\n- Published\nA drone hit a busy beach in southern Russia, killing seven people including three children, local authorities have said.\nIn social media footage verified by the BBC, a drone can be seen hurtling towards a cliffside before crashing into a fireball on the beach below as tourists look on from the shore and in the water.\nThe total number of injured reached 40, with 17 people hospitalised, said the governor of the Krasnodar region Veniamin Kondratyev.\nHe accused Ukraine of \"a deliberate strike on civilians\". Ukraine has not commented. Both sides deny targeting civilians deliberately.\nIt is unclear what the drone was targeting. Some Ukrainian Telegram channels have claimed it crashed onto the beach as a result of electronic warfare which jammed the drone's signal. Several eyewitnesses were quoted by Russian media as saying gunfire preceded the explosion, indicating that air defences may have tried to shoot the drone down.\nThe crash occurred on a beach near the village of Arkhipo-Osipovka on the Black Sea. With its warm climate, long beaches and developed tourist infrastructure it is a popular holiday destination for Russians, in particular since sanctions have curtailed international travel for many.\nTourists and residents of Arkhipo-Osipovka told local media outlets that no sirens sounded ahead of the drone attack.\n\"We covered ourselves with sun loungers, and didn't see where it exploded,\" said one holidaymaker. Another person said that while they did not see the drone hit they could hear \"gunfire, like a machine gun\" followed by an explosion.\n\"This all happened in front of my children. My child is having a nervous breakdown,\" said a third.\nOver the course of the last year Ukraine has had increasing success in carrying out long-range strikes deep into Russia, hitting energy infrastructure and commercial warehouses it says are used for military purposes.\nOn several occasions these strikes have caused civilian deaths, with eight people in different Russian cities killed at the weekend.\nRussia meanwhile has launched attacks on residential areas and cities from the start of its full-scale invasion of Ukraine in February 2022, killing and injuring thousands of civilians.\nOn Saturday, at least nine people were killed and dozens injured in Russian ballistic missile strikes on Kyiv, according to Ukrainian President Volodymyr Zelensky. The city's mayor said a residential building in the Shevchenkivskyi district was partially destroyed, trapping people inside. Last week a strike on a building in Ukraine's Kryvyi Rih area killed a family of 10.\nIn recent weeks Ukrainian strikes have in particular targeted warehouses belonging to Wildberries – a large online retailer dubbed the \"Russian Amazon\".\nThe latest strike hit a warehouse in the Vladimir region, east of Moscow, overnight into Monday. Dozens of Wildberries warehouses dotted around Russia – many located thousands of kilometres from the Ukrainian border – have now been hit.\nKyiv says Wildberries depots are used to supply the Russian military, which Moscow denies. Yet the platform sold a variety of military-related goods such as body armour until recently, alongside items with both civilian and drone-production applications.\nRelated topics\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "curtailed", "definition": "制限または削減されたという意味。国際旅行が制裁により制限されたという文脈で使用されている。"}, {"word": "infrastructure", "definition": "基盤となる施設や構造のこと。観光施設やビーチなどの公共設備を指す。"}, {"word": "ballistic missile", "definition": "弾道ミサイルのこと。宇宙空間を通って目標に到達する兵器。"}, {"word": "depots", "definition": "倉庫や貯蔵施設のこと。軍需品や商品を保管する場所。"}, {"word": "deliberate", "definition": "意図的で計画的であるという意味。故意に行われたことを強調する際に使用される。"}, {"word": "electronic warfare", "definition": "電子戦のこと。敵の通信やセンサーを妨害する軍事技術。"}]}, {"title_ja": "トランプ大統領が交渉再開を主張する中、イランは米国との協議を否定", "title_en": "Iran Denies US Talks While Trump Claims Negotiations Resuming", "summary_ja": "米国のトランプ大統領は、イラン紛争終結に向けた協議が月曜日に開始され、この目的のため軍事攻撃を延期したと発表した。しかし、イランは米国との協議を否定し、代わりにオマーンとの交渉を行っていると述べた。ホルムズ海峡の閉鎖解決の可能性に市場が反応し、トランプの発表に続いて石油価格は4.5%下落した。", "summary_en": "US President Trump announced that negotiations to end the Iran conflict would begin Monday and that he had postponed military strikes for this purpose. However, Iran denied engaging in talks with the US, stating it was negotiating with Oman instead. Oil prices fell 4.5% following Trump's announcement, as markets reacted to potential resolution of the Strait of Hormuz closure.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c23579jzv08o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Iran says it is in talks with Oman but not the US after Trump says negotiations to resume\n- Published\nIran says it is negotiating with Oman to reach \"an understanding\" over a temporary route through the Strait of Hormuz to allow commercial shipping to resume.\nThe statement came after US President Donald Trump said new talks on ending the war in Iran would begin on Monday - and that he had called off \"massive\" strikes on the country for this purpose.\nTrump did not specify who would take part in the talks. Iran, however, said it was not negotiating with the US - and had no plans to do so.\nTehran's denial appears to have irked the US president, who later wrote on his Truth Social media platform that Iran's leadership was \"unbelievably duplicitous\".\nSpeaking to reporters at the White House later, he insisted talks were in fact taking place.\n\"They're going on right now... this is the last chance for them to sign a good document,\" he said.\nAt the weekend, Trump had said the \"perimeters\" of a deal had been agreed - and would include reopening Hormuz, the vital waterway whose closure by Iran has sent oil prices soaring.\nTehran has repeatedly closed off the strait since the US and Israel started attacks on the country in February.\nSpeaking on board Air Force One on Sunday, he said Iran \"knew the extent\" of the planned US strikes \"because they saw it forming\".\nTrump declined to outline a deadline for a deal to be struck with Tehran, adding: \"We'll just see how it is. We're ready to go anytime we want... I'm not looking to kill people.\"\nTrump added that Saudi Arabia's Crown Prince Mohammed Bin Salman - as well as US partners such as the United Arab Emirates and Qatar - had urged him against conducting strikes over the weekend.\n\"We were all set to go,\" Trump said. \"The reason they asked is [that] they think there's a deal,\" he said. \"There's a deal on Hormuz, and there will be a deal on the nuclear.\"\nGlobal oil prices fell on Monday morning in Asia trading after Trump's announcement. Brent Crude oil was down by 4.5% at $83.98 (£62.26), while US-traded oil was 4.6% lower at $80.74 (£59.85).\nEnergy prices have fluctuated since the conflict started on 28 February as traders reacted to disruptions to shipping through the Strait of Hormuz.\nAround 20% of the world's crude oil and liquefied natural gas (LNG) usually flows through the strait.\nVessel-tracking data from trade intelligence company Kpler suggests commercial shipping through the strait has slowed - with 51 vessel crossings between 30 July and 2 August. This is a drop of around 28% compared to the previous 4 days, in which 71 crossings were recorded through the strait.\nTalks to end the conflict - mostly facilitated by mediators - collapsed last month, ending a ceasefire agreed in April.\nTrump has repeatedly vowed that a negotiated end to the war is near, only for tit-for-tat strikes to resume.\n- Threat to oil tankers in Middle East worst since start of Iran war, analysts say \n  - Published5 hours ago\nWhile it is unclear what negotiations may - or may not - be happening away from the public eye, Trump and the White House have often accused Iran of saying one thing privately and another publicly.\nBack on 7 April, the US president warned that \"a whole civilisation will die tonight\" if Iran refused to engage in peace talks.\nThat threat did result in historic face-to-face talks in Pakistan, led by Vice-President JD Vance. However, those negotiations did not result in a deal.\nThe following month, he again said that he had withheld planned military operations at the behest of regional allies amid \"serious negotiations\", which he followed by a promise to hit Iran \"very hard\".\nIn the latter instance, he claimed that positive negotiations with Iranian leaders had prompted the operation to be called off.\nAt times, the White House has suggested that Iran's public statements are also aimed at a domestic audience that includes hardline members of the government and the powerful military who are opposed to making concessions to the US.\nAny escalation could prove politically tricky for President Trump's Republican allies.\nThe Trump administration has been largely dismissive of data showing the war - and its economic impact - are broadly unpopular with Americans, including with many Republicans.\nPolls showing widespread dissatisfaction with the handling of the war have prompted alarm among some conservative strategists ahead of the coming November midterms.\nOne poll, released by Reuters/Ipsos at the end of last week, found that only a third of Americans support the conflict, the lowest total since the war began, with the bulk of respondents pointing to unclear or shifting objectives.\nWith additional reporting from James Chater, Peter Hoskins, and BBC Verify's Kayleen Devlin and Becky Dale\nGet in touch\nWhat questions do you have on this topic?\nRelated topics\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "duplicitous", "definition": "二重性のある、二心のある。特に、表面的には異なることを言ったり行ったりして、信頼できない態度や行動を指します。"}, {"word": "perimeters", "definition": "境界線、範囲、限界。交渉の文脈では、合意の基本的な枠組みや基本条件を意味します。"}, {"word": "mediated", "definition": "仲介された、仲裁された。第三者が当事者間の合意や解決を助ける過程を指します。"}, {"word": "tit-for-tat", "definition": "報復的な、相互に報いる。一方が行動すれば他方も同じ行動で応じることを意味する表現。"}, {"word": "withhold", "definition": "差し控える、保留する、与えない。情報や物、行動などを意図的に提供しないことを指します。"}, {"word": "concessions", "definition": "譲歩、譲り合い、妥協。交渉で一方が他方に与える譲り合いや認める点を意味します。"}]}, {"title_ja": "中東の石油タンカーへの脅威、イラン戦争開始以来最悪レベルに到達", "title_en": "Middle East Oil Tanker Threats at Worst Level Since Iran War Began", "summary_ja": "海運専門家らは、イラン紛争開始以来、中東の石油タンカーへの脅威が最悪のレベルに達したと警告しており、紅海での攻撃がホルムズ海峡への代替ルートを塞いでいます。ホルムズ海峡の通過船舶は1日100隻以上から8～11隻に激減し、紅海でのフーシ派によるサウジアラビアのタンカー攻撃がさらに世界的な石油流を制限し、多くの船舶が検出を避けるために自動識別装置を無効化するよう強いられています。", "summary_en": "Shipping experts warn that threats to oil tankers in the Middle East have reached their worst point since the Iran conflict started, with attacks on the Red Sea blocking an alternative route to the Strait of Hormuz. Traffic through the Strait of Hormuz has plummeted from over 100 ships daily to just 8-11, while Houthi attacks on Saudi tankers in the Red Sea have further constrained global oil flows and forced many vessels to disable their transponders to avoid detection.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cjrv0dy2e90o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Threat to oil tankers in Middle East worst since start of Iran war, analysts say\n- Published\nThe threat to ships carrying oil in the Middle East is at its worst since the Iran war started, experts have said, after a spate of attacks on another key route in the region.\nThe warning comes after a number of attacks on vessels in the Red Sea, an alternative waterway that some tankers had been using since Iran blocked the Strait of Hormuz.\nIran has denied Donald Trump's claim that it was in talks with the US over reopening the strait, but said it was speaking to Oman about securing the shipping lane.\n\"In terms of threat to the trade of crude, we're at the worst period that we've been in since this since this crisis began,\" said Matthew Wright, an analyst at ship-tracking firm Kpler.\nThe number of ships passing through the Strait of Hormuz was just eight on Sunday and 11 on Saturday, compared with more than 100 per day before the war began, according to Kpler.\nBefore the conflict, about 20% of the world's oil and gas passed through the strait.\nThe temporary peace deal with the US struck in early June led to numbers rising again, but the resumption of strikes between the two countries roughly a month later have significantly reduced traffic.\nMany ships have been \"going dark\" when crossing the strait, meaning they turn off their transponder to avoid detection.\nFor much of the war, some ships carrying oil from Saudi Arabia had instead passed through an alternative shipping lane in the Red Sea, between the kingdom and west Africa.\nBut a recent spate of attacks by Yemen's Houthi fighters on Saudi tankers using the alternative waterway has further heightened the risks.\nThe Iranian-backed Houthi militia announced what it called a blockade on Saudi Arabia's Red Sea ports on 20 July and the UK Maritime Trade Operations agency has reported several attacks on ships in the past week.\n\"Not only is the ongoing situation in the Strait of Hormuz constraining oil flows, but now a big factor that was helping to balance the market is now also under threat. It's a problem stacked on top of a problem,\" Wright said.\nTim Wilkins, the managing director of Intertanko, a trade body representing tanker owners, said the industry was \"facing a broadening, deteriorating, and increasingly complex security situation\".\n\"We now have the high-risk area going up to Saudi Arabian waters and extending into parts of the Red Sea. So that's having another impact on the market, on freedom of navigation as well.\"\nThe number of commodity vessels that passed through the Bab el-Mandeb strait was 28 on Saturday and six of them had their transponders turned off, according to Kpler data, indicating that they were trying to avoid detection.\n- As the US pauses the war with Iran, is Trump really running out of weapons? \n  - Published7 days ago\n- Why Iran is risking so much over the Strait of Hormuz \n  - Published21 July\n- Tankers make sharp U-turns after Houthi shipping threat \n  - Published22 July\nNot all vessels are deterred from passing through because the Houthi threat is only targeted at Saudi shipping, with the total number sitting at about 50% of pre-attack levels.\nBut the number of ships loading crude oil for export to Asia passing through has dropped to about four per day, Kpler added, the lowest point since the start of the war.\nA spokesperson for Hapag-Lloyd, the global shipping giant, said some of its vessels were still passing through the Red Sea but that it would \"monitor developments closely and will adjust the network if circumstances change\".\n\"If the Strait of Hormuz reopened, most ships could probably leave the region fairly quickly. However, restoring normal cargo flows would take much longer.\n\"Services have been suspended and ships redeployed elsewhere, so a return to normal flows would most likely take three to four months.\"\nDespite the talks with Oman, Iran has said that no deal is imminent that would reopen the strait to normal traffic.\nIts foreign ministry ministry spokesman Esmaeil Baqaei said any agreement would not lift the current restrictions while US \"aggression\" continued.\nKpler's Wright said that while talks with Oman could be productive, any deal would need the involvement of the US and the fear is that current negotiations could be a \"false start\" without concessions on at least one side.\nNonetheless, oil prices fell sharply after Trump said he would cancel planned strikes on Iran based on the potential for upcoming talks.\nBrent crude was trading 4.4% lower at $84.05 a barrel, after it fell as much as 7.3% to $81.55 a barrel earlier in the day.\nPeter Sand, chief analyst at Xeneta, another ship-tracking company, said the fighting had taken the shipping industry \"back to to square one\" and that things were in \"a terrible state, regardless of which shipping type you're you're looking at\".\n\"The alternatives for getting cargo, whether that's hydrocarbons or container shipping, are really not great… it is really still troubling times wit", "translation_ja": "", "vocab": [{"word": "spate", "definition": "短期間に相次いで起こる出来事や事柄の連続。「攻撃の相次ぐ」という文脈で使用されており、複数の類似した事象が急速に連続して発生することを意味します。"}, {"word": "transponder", "definition": "船舶や航空機が位置情報を自動的に送信する電子機器。本記事では船舶が意図的に無効化して検出を避けることが説明されています。"}, {"word": "constrain", "definition": "制限する、制約を加える。石油の流れや市場活動などを制限または抑制することを示す動詞です。"}, {"word": "deteriorating", "definition": "悪化していく、質が低下する。安全保障環境や市場状況が段階的に悪くなっていく状態を表します。"}, {"word": "imminent", "definition": "今にも起きそうな、切迫した。すぐ近い将来に発生する可能性が高い状態を表す形容詞です。"}, {"word": "concession", "definition": "譲歩、妥協。交渉において一方が相手の要求の一部を受け入れることで、この文脈では協議の成功に必要な相互的な譲歩を指しています。"}]}, {"title_ja": "インファンティーノ反対派がFIFAとの「非協力」を脅す", "title_en": "Infantino Opponents Threaten 'Non Co-operation' with Fifa", "summary_ja": "FIFAのジャンニ・インファンティーノ会長に反対する勢力は、彼が辞任しない限りFIFAとの協力を拒否すると脅している。これはFIFA大会のステークスを民間投資家に売却する計画が中止になった後のことである。ウェールズが3月の再選支持を取り下げ、イングランドのFAも同様に従う見込みで、複数国が反対に加わっている。", "summary_en": "Opponents of Fifa president Gianni Infantino are threatening to withdraw cooperation with the governing body unless he steps down, following his scrapped plan to sell stakes in Fifa competitions to private investors. The rebellion intensifies as Wales withdraws support for his re-election bid in March, with England's FA expected to follow, and several countries joining the opposition. An emergency Fifa Council meeting could potentially force Infantino's resignation if enough members call for one.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/sport/football/articles/cp30vg829nxo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Infantino opponents threaten 'non co-operation' with Fifa\n- Published\nOpponents of Fifa president Gianni Infantino are threatening \"non co-operation\" with the governing body unless he steps down, according to senior Uefa sources.\nSome of those involved in the rebellion vow \"there is no going back\" for as long as Infantino remains in position, as the fallout over his scrapped plans to sell off stakes in Fifa competitions to private investors intensifies.\nWhile the details of the proposed disruption remain unclear, one senior figure said they would \"certainly expect\" a refusal to participate in Fifa meetings.\nIt comes after European football's governing body Uefa threatened legal action over the proposals, and Wales publicly withdrew backing for Infantino's bid for a fourth term as Fifa president, with England's Football Association set to follow suit.\nIn March, Infantino is set to stand for re-election for a final term as president and would need 106 votes from Fifa's 211 members to win.\nSources have told BBC Sport the Scottish FA's position on the future of Infantino remains aligned with Uefa's lack of confidence in the 56-year-old.\nInfantino's leadership had already been publicly questioned by football's governing bodies in Europe, North and Central America and the Caribbean, with Uefa and Concacaf releasing statements criticising the plans.\nAs the pressure grows on Infantino with Serbia, Sweden and Finland also withdrawing their support, Morocco, Qatar, Lebanon, Kuwait and Sri Lanka among the countries to have pledged their support for his Fifa leadership to continue.\nUefa has 55 votes, Africa 54, Asia 46, Concacaf 35, Oceania 11 and Conmebol 10.\nThe Asian Football Federation (AFC) has said it stands in \"solidarity\" with Uefa and Concacaf, while Africa, Conmebol and Oceania have not criticised Infantino's plan.\nHowever, the Fifa Council could try to force Infantino to resign through an emergency meeting.\nThat would be triggered if 19 of the 37 Fifa Council members call for one and the meeting must take place within two weeks.\nUefa has nine members, AFC has seven, Concacaf five, Africa has six, Conmebol five and Oceania three. It is completed by Infantino and secretary general Mattias Grafstrom.\nFifa and Infantino wanted to create a commercial subsidiary to run its main events, including its World Cups, and external investors would have been able to buy stakes in it.\nWorld football's governing body said it would \"invite third parties to make minority, non-controlling investments\" in a new subsidiary called Fifa Forward Enterprise (FFE).\nAs first reported by The Telegraph, Uefa said in a letter to Infantino \"it is actively considering legal action, arbitration, and/or regulatory complaints (together, the 'proceedings') arising out of and in connection with the FFE plan proposed by Fifa\".\nUefa added it wants \"immediate steps\" to \"preserve all documents and electronically stored information\" in Fifa's possession \"independent\" of their internal policies that may result in \"routine document destruction or deletion\".\nBBC Sport has approached Fifa for comment.\n- If Infantino goes, who might replace him as Fifa president? \n  - Published8 hours ago\n- A bruising 24 hours - what next for Fifa and under-pressure Infantino? \n  - Published1 day ago\n- Is Infantino finished? Could Uefa boycott World Cup? What happens now? \n  - Published3 days ago\nInfantino wrote to all 211 Fifa member associations saying they would receive $40m (£30m) if they backed his controversial proposal, setting a deadline of 19 September if they wanted to access an initial $20m (£15m).\nThrive Eternal was expected to lead the proposed investor group for FFE.\nThrive is an American venture capital firm founded by Joshua Kushner - the brother of US President Donald Trump's son-in-law Jared.\nUefa's request for all documents regarding the investment plan, included \"email, instant messages (WhatsApp, Signal, Teams, Slack or any other platform), SMS, written correspondence and meeting notes\", and those which involved \"any Fifa officer, employee, committee member, consultant or agent, or any Fifa member association, confederation, broadcaster, sponsor, or financial institution\".\nIn reference to the 19 September deadline, Uefa added it wanted documents to be retained \"relating to the payment structure for Fifa member associations, including the design, modelling, legal basis, approval and communications to member associations\".\nUefa asked Infantino to acknowledge receipt of its letter in writing within five business days, to confirm he had \"received and understood this notice\" and that he has \"taken immediate steps to preserve relevant materials as required\".\nUefa vice-president Laura McAllister described the prospect of legal action by European football's governing body as \"a very clear call for action really for what's been an abysmal governance process leading up to the FFE initiative\".\nSpeaking to BBC Radio 5 Live, she added: \"We need to learn from this ", "translation_ja": "", "vocab": [{"word": "intensifies", "definition": "紛争や問題が激しくなる、または悪化することを意味する。ここでは反発や対立が強まることを示している。"}, {"word": "subsidiary", "definition": "親会社の支配下にある子会社を意味する。FFE（Fifa Forward Enterprise）のように、大企業が特定の事業を運営するために設立する組織。"}, {"word": "minority stake", "definition": "企業の50%未満の所有権を指す。支配権を持たない部分的な投資を意味する。"}, {"word": "governance", "definition": "組織やグループの管理・運営方式のこと。企業や公共機関の意思決定や責任体制の在り方を指す。"}, {"word": "fallout", "definition": "ある事件や決定による悪い結果や影響を意味する。ここでは計画撤回によって生じた紛争や反発を指す。"}, {"word": "withdrawal", "definition": "支持や参加を取り下げることを意味する。ここでは国がインファンティーノへの支持を撤回する行為を指す。"}]}, {"title_ja": "フランス、難民船を海軍で送還するイギリス改革党の計画を非難", "title_en": "France Condemns Reform UK's Navy Plan to Return Migrant Boats", "summary_ja": "フランスは、イギリス海峡の移民船をイギリス海軍で拿捕し、フランスの同意なく仏港に送還するというイギリス改革党の提案に強く反発しました。フランス政府はこの計画がフランスの主権と国際海事法に違反すると主張しています。法律専門家と労働党大臣は、この提案にはフランスの同意が必要であり、成功する可能性は低いと述べています。", "summary_en": "France has strongly opposed Reform UK's proposal to use the Royal Navy to intercept migrant boats in the English Channel and return them to French ports without French consent. The French government claims the plan violates French sovereignty and international maritime law. Legal experts and Labour ministers argue the proposal would require French agreement and is unlikely to succeed.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr59qyy4l5yo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "France hits out at Reform UK plan to return migrants using Navy\n- Published\nFrance has hit out at a Reform UK plan to return migrant boats using the Navy, saying the proposals would violate its sovereignty and breach international law.\nNigel Farage's party announced that if it was in power it would intercept boats crossing the English Channel and return migrants to French ports, even if France disagreed.\nOpposition parties branded the plan unworkable, while a Labour minister said it would lead to \"a lot of time arguing with France\" instead of \"actually getting to grips with the problem\".\nResponding to the French government, a Reform spokesperson said: \"We will always stand up for British interests and protect our people, whether Emmanuel Macron likes it or not.\"\nThe spokesperson added: \"Humanitarian missions do not violate maritime or international law.\"\nUnder the plans, which Reform said it would bring in if it entered government after the next election, military-crewed inflatable boats deployed from 10 Navy patrol vessels would be used to \"come alongside\" migrant boats crossing the English Channel.\nBorder Force officers and police stationed onboard would be tasked with arresting people in the boats, and they would then be returned to France or Belgium by Navy personnel or Marines.\nThe party said returns operations would be conducted by military personnel with Border Force officers on hand in case of \"non-compliance\", with a Bay Class landing ship providing \"detention capacity at sea\" for up to 700 people.\nSpeaking at a news conference on Monday, Reform's home affairs spokesman Zia Yusuf said the party would aim to get agreement to disembark arrested migrants at French ports.\nHe added: \"If the Elysee Palace refuses, make no mistake - His Majesty's Royal Marines will disembark them safely on the very shore they left that morning\".\nSpeaking alongside him, Farage played down the prospect of a diplomatic confrontation with the French, claiming that attitudes in France towards the idea were \"softening\".\nBut in a statement issued later on Monday, the French interior ministry said: \"This would constitute a violation of French sovereignty, as well as a violation of the law of the sea and international law.\"\nA spokesperson for the department added that measures agreed with the UK, as well as \"operations deployed at the local level\", had already led to a reduction in crossings so far this year compared to the same period in 2025.\nIn a policy document, the party argued the plan would be legal under international law because it would be protecting the lives of migrants in dangerous boats.\nIt cited the United Nations Convention on the Law of the Sea (UNCLOS), which talks of a duty on states to \"render assistance to any person found at sea in danger of being lost\".\nFarage said he was confident his party's policy of \"securely picking people up and safely taking them back to France\" would fall within \"other conventions of international law\".\nYusuf accepted the plan could trigger a \"diplomatic argument\" with France, but insisted it had a \"commitment under international law\" to process migrants.\nAndrew Serdy, an expert on the public international law of the sea at the University of Southampton, argued Reform's proposals \"would require the agreement of France, which is a bold assumption to make, as there is no reason to expect it to agree.\"\nJames Turner KC, a lawyer at Quadrant Chambers with expertise in maritime issues, told BBC Verify that UNCLOS gave states rights to prevent infringement of immigration laws in a \"contiguous zone\" up to 24 nautical miles from their coasts.\nHowever, he added this did not entitle a country to \"collect asylum seekers in its contiguous zone - or anywhere else - and take them back to the state they set off from\".\n'Model is working'\nMore than 2,000 migrants have arrived in the UK on small boats since Andy Burnham became prime minister two weeks ago, and 326 people crossed the English Channel on Saturday. Home Office figures show crossings so far this year are down around 43% compared to the same period in 2025.\nThe number of small boats crossing the Channel have been on an overall downward trend since it peaked in 2022, Home Office figures show.\nSpeaking earlier, Energy Secretary Miatta Fahnbulleh said the Labour government's push for greater action against smuggling gangs was a \"model that is working\".\nShe added that she did not believe Reform's plan would work, citing the involvement of the Navy as an example of \"gimmicky\" ideas explored by the previous Conservative government.\n\"You'd spend a lot of time arguing with France, and not enough time actually getting to grips with the problem,\" she added.\nThe prime minister visited Dover at the weekend, where he said the government was \"changing the whole approach\" to small boats, as the numbers of enforcement officers tackling people-smuggling gangs doubled on both sides of the Channel.\nAccording to the Home Office, the number of National Crime Age", "translation_ja": "", "vocab": [{"word": "sovereignty", "definition": "国家が自らの領域と国民を統治する独立した権力のこと。フランスが自国の領海での自由な行動が侵害されることに反発している文脈で使われています。"}, {"word": "breach", "definition": "法律や約束を破ること、または侵害すること。フランス政府が国際法違反だと主張する際に用いられている表現です。"}, {"word": "maritime", "definition": "海や船舶に関連する事柄を指す形容詞。海事法や海洋領域での法律問題を表現する際に使われます。"}, {"word": "contiguous zone", "definition": "領海の外側に設定された最大24海里の海洋区域。沿岸国が移民や税務に関する法律を適用できる地域を指します。"}, {"word": "non-compliance", "definition": "命令や指示に従わない行為のこと。移民が協力しない場合に対応する必要がある状況を指しています。"}, {"word": "infringement", "definition": "法律や権利を侵害・侵犯すること。特に移民法の違反を防ぐ権利について論じる際に用いられます。"}, {"word": "gimmicky", "definition": "見た目の効果を狙った、実質的でない手法や工夫を指す形容詞。労働党大臣が改革党の案を批判する際に使用されています。"}]}, {"title_ja": "ウェストハム会長サリバン氏、非行疑惑でホームゲーム出席を勧告される", "title_en": "West Ham Co-owner Sullivan Advised to Avoid Home Matches Amid Misconduct Allegations", "summary_ja": "BBC Panoramaとタイムズ紙の共同調査で性的非行疑惑が明かされた後、ウェストハム副会長デイビッド・サリバン氏がホームゲーム出席を控えるよう勧告された。サリバン氏は会長職から退任したが最大株主のままであり、7人の女性による疑惑を完全に否定している。スタジアム運営者はサポーターの不安定な行動の懸念を理由に挙げているが、クラブは彼の試合出席を支援する予定である。", "summary_en": "West Ham co-owner David Sullivan has been advised by London Stadium to stay away from home matches following allegations of sexual misconduct revealed in a BBC Panorama and Times investigation. Sullivan, who stepped down as joint chairman but remains the largest shareholder, has categorically denied the allegations made by seven women. The stadium operator cited concerns about potential fan unrest and demonstrations, though West Ham intends to facilitate his attendance at games.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c77gzjjmgleo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "West Ham co-owner David Sullivan advised to stay away from home matches\n- Published\nWest Ham co-owner David Sullivan has been advised to stay away from the club's home matches in the wake of a BBC Panorama and Times investigation into allegations of sexual misconduct.\nA spokesperson for London Stadium, where West Ham play their home games, told BBC News it had \"recommended\" to West Ham that Sullivan does not attend matches because of concerns about fan unrest.\nLondon Stadium has asked for advance notice of any planned visits by the billionaire businessman in order to implement additional safety and operational measures.\nHowever, it is understood that the club expects Sullivan to defy the request not to attend home matches and has told London Stadium this.\nPredator: The Billionaire Football Boss\nAn investigation into the behaviour of David Sullivan\nThe recommendation from London Stadium comes after a joint investigation by BBC Panorama and The Times revealed that seven women have accused Sullivan of sexually exploitative and predatory behaviour. He has categorically denied the allegations.\nHe stood down as joint chairman of the club shortly before the investigation was broadcast, saying he wanted to focus on fighting what he called \"factually incorrect and entirely false, decades-old allegations concerning my personal life\". He remains the club's largest shareholder.\nThe investigation also revealed that Sullivan has been banned from contact with West Ham's women's and youth teams for three years due to safeguarding concerns. London Stadium were unaware of the restrictions until the BBC's report.\nSullivan was banned after a historic allegation about his conduct was raised with the Football Association in 2023. He has previously said the allegation was false and that because he had never met any academy or women's team players \"1-2-1\" during his 16 years at the club, he accepted what he saw as a \"meaningless restriction…for a quiet life\".\nWest Ham were relegated from the Premier League in May and are due to play their first home game of the new season, a Carabao Cup match against Portsmouth, on Saturday.\nSullivan was a regular attendee at the London Stadium last season, where he was photographed watching games from the directors' box.\nA spokesperson for London Stadium, the operator of the publicly owned venue, said that \"following media reports at the end of the season regarding a safeguarding matter being managed by the club, London Stadium sought further information to ensure it could fulfil its own safeguarding responsibilities\".\nIt said that West Ham had told it that the \"matter was investigated and that the club does not consider there to be an ongoing safeguarding risk associated with Mr Sullivan attending the stadium\".\nHowever it said that, despite this, it had recommended the businessman stay away from games because of the \"potential for demonstrations and anti-social behaviour by some spectators\".\nSullivan has previously faced criticism from fans over his running of the club, with thousands joining a protest in September last year calling for his departure.\nWest Ham declined to comment. It is understood that the club intends to work with the stadium operators to facilitate Sullivan's attendance at games.\nSullivan has not responded to a request for comment.\nMeanwhile, presenter Tony Livesey left BBC Radio 5 Live on Monday after 16 years at the station, the corporation announced.\nLivesey stepped back from his weekday late night talk show in June, following allegations made against Sullivan. He had previously worked as editor-in-chief of Sullivan's Daily and Sunday Sport publications.\nOne alleged victim said that Livesey had arranged a meeting between her and Sullivan in 1999.\nLivesey said he had \"no recollection\" of introducing the young woman to Sullivan and that it was \"not part\" of his job to do so.\nHe added that he had \"great sympathy for a woman who may have become a victim\", but rejected any suggestion that he had played \"any role whatsoever in that scenario\" and said he found the allegation \"abhorrent\".", "translation_ja": "", "vocab": [{"word": "predatory", "definition": "略奪的で、他人を搾取する行為。特に性的な非行や不正な行為を指すことが多い。"}, {"word": "safeguarding", "definition": "組織内での児童や脆弱な立場の人の安全と福祉を保護する手段や対策のこと。"}, {"word": "defy", "definition": "明示的な命令や勧告に逆らって行動することを意味する。"}, {"word": "banned", "definition": "公式に禁止されたり、アクセスを遮断されたりした状態。"}, {"word": "allegations", "definition": "証拠なしに誰かが何かをしたと主張する告発や疑惑のこと。"}, {"word": "facilitate", "definition": "何かが起こるのを容易にする、または支援すること。"}]}, {"title_ja": "若い世代がより高いがんリスクに直面する理由を明かす研究", "title_en": "Study Reveals Why Younger Generations Face Higher Cancer Risk", "summary_ja": "ワシントン大学の研究では、若い世代が生物学的年齢と実年齢の間の差が大きくなっており、細胞レベルでより速く老化していることが判明しました。この加速老化は、特に50歳未満の人々における早期発症がんの増加と関連しています。運動と食事などのライフスタイル要因は生物学的年齢の約50%に影響を与えることができますが、残りの50%は遺伝的に決定されています。", "summary_en": "A study from Washington University has found that younger generations are experiencing a wider gap between their biological and chronological ages, causing them to age faster at the cellular level. This accelerated aging is linked to a sharp increase in early-onset cancers, particularly gastrointestinal cancers in people under 50. While lifestyle factors like exercise and diet can influence about 50% of biological age, the other 50% is genetically predetermined.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/study-shows-why-younger-generations-may-be-more-cancer-prone/a-78163655?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Study shows why younger generations may be more cancer-prone\nAugust 3, 2026\nSusanna was just 28 years old when she was diagnosed with bowel cancer. Andre developed lung cancer when he was only 34. Both of them have turned to social media to talk about their fight against the disease. Neither of them are medical outliers — not anymore.\nThe German Cancer Research Center (DKFZ) has reported a sharp increase in gastrointestinal cancer cases for patients between the ages of 20 and 39. In the US, researchers have observed a similar development, with an even higher disease ratio than in Germany. Younger people are also increasingly being diagnosed with other types of cancers, including those that affect patients' bone marrow or uterus.\nCancer is usually regarded as an age-related disease. According to the German Cancer Aid non-profit, the average age for men and women with cancer is around 69. Cancer cells form when certain sections of the genetic sequence mutate and can no longer be repaired. The older we get, the less reliable our repair system becomes.\nGap between chronologal and biological gap increasing\nA study by researchers at Washington University School of Medicine, US, has now found a link that could help explain why an increasing number of people under 50 are developing early-onset cancer. The reason, they suggest, is that younger generations are displaying a wider gap between their biological and their chronological ages. In short, they are aging faster.\nWhile the chronological age counts how many years have passed since a person's birth, their biological age describes how much their body has aged, based on the cellular damage accumulated. Individual organs and tissues can age at varying speeds.\nIn other words, the same person's liver, heart and brain could each have different biological ages, all of which could differ still from the person's actual age.\nThe recent study has now for the first time established a link between the increasing gap between biological and chronological ages in younger generations on the one hand, and the risk of early-onset cancer on the other, Ron Jachimowicz explains. He's an attending physician and hematologist at the University Hospital Cologne, as well as head of the Max Planck Research Group for Biology of Aging.\n\"Don't forget, this is a correlative study,\" Jachomowicz cautions.\nCorrelation refers to two things appearing in concert, so it looks like they are related. It does not prove causation, which we speak of when one factor causes another.\nWhile results can provide certain indications that seem quite plausible, researchers were already well aware of the fact \"that there is an association between biological age and the risk of developing cancer,\" Jachomowicz says.\nDNA, bloodmarkers and telomeres: How to determine one's biological age\nIt's not easy to determine a person's biological age. Calculating it requires a number of parameters — there is no single, precise test. Instead, epigenetic tests are used to determine chemical alterations of DNA sequences, evaluating certain blood values and measuring the length of so-called telomeres — that is, the repetitive DNA sequence located at the end of chromosomes that function as protective caps.\nThere are also physiological tests, to monitor various body and organ functions, as well as cognitive evaluations.\nResearchers in the study at hand applied a combination of these various measurement techniques to analyze the data of more than 150,000 individuals drawn from the UK Biobank, a British biometric dataset.\nThey found that people born between 1965 and 1974 had a significantly higher gap between their chronological and biological ages than people born between 1950 and 1954. The younger the cohort examined, the wider that gap appeared to grow.\nAn investigation involving more than 10,000 US individuals revealed an even higher deviation for participants born between 1990 and 1999, compared to a cohort born between 1965 and 1969.\n\"In Australia, Canada, the United Kingdom (UK) and the US, people born in the 1990s face at least fourfold higher risk of early-onset colorectal cancer compared with those in the 1960s,\" the authors write in the study.\nCan I improve my biological age?\nWe used to assume that a healthy lifestyle could make up 75% to 90% of one's biological age. Now we know that's not true, Jachimowicz explains.\n\"We can influence about 50% of it,\" he says, \"while the other 50% are genetically predetermined.\"\nTo help slow the aging process, he recommends \"typical lifestyle interventions,\" such as working out regularly, eating a balanced diet, getting enough sleep, and avoiding drugs and alcohol.\nAnd the value of social contacts should not be underestimated, he adds.\nIt's not easy to say why, on a biological level, younger generations are aging faster than their parents and grandparents. But there are a few hypotheses.\n\"Younger people are being exposed to earlier and longer obesity,\" says Tanwei Yuan, an epidemiologist in th", "translation_ja": "", "vocab": [{"word": "epigenetic", "definition": "遺伝子の塩基配列そのものではなく、DNAの化学的な修飾による変化を指す用語。生物学的年齢の測定に用いられます。"}, {"word": "telomere", "definition": "染色体の末端にある反復的なDNA配列で、細胞老化の指標として機能します。長さを測定することで生物学的年齢を推定できます。"}, {"word": "correlation", "definition": "2つの事象が同時に現れて関連があるように見える関係性を指します。因果関係とは異なり、一方が他方を引き起こすことを意味しません。"}, {"word": "causation", "definition": "一つの要因が別の結果を直接的に引き起こす関係性です。相関関係とは異なり、明確な因果メカニズムの存在を示唆します。"}, {"word": "cohort", "definition": "研究対象として選定された、特定の時期に生まれたグループや統計分析の対象集団を指します。"}, {"word": "predetermined", "definition": "事前に決定された、または避けられない状態を意味します。ここでは遺伝的に既に決まっていることを指しています。"}]}, {"title_ja": "ドナウ川の干ばつが中欧の原子力発電所を脅かす", "title_en": "Danube River Drought Threatens Nuclear Power Plants in Central Europe", "summary_ja": "ドナウ川の記録的な水位低下により、ルーマニアとハンガリーの原子力発電所は稼働能力を削減するか閉鎖を余儀なくされており、各国は長期の高温乾燥気候の中で電力不足に苦しんでいます。ルーマニアは軍がチェルナボダ発電所への給水を改善するため岩盤を爆破し、ハンガリーはパークス発電所を10%の稼働率に削減し、住民と産業界に電力消費の削減を呼びかけました。", "summary_en": "Record low water levels on the Danube River are forcing nuclear power plants in Romania and Hungary to reduce capacity or face shutdown, as countries struggle with power shortages amid prolonged hot and dry weather. Romania's military demolished a rocky outcrop to improve water flow to its Cernavoda plant, while Hungary reduced its Paks plant to 10% capacity and appealed to residents and industries to cut electricity consumption.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/dry-danube-river-threatens-nuclear-power-in-romania-hungary/a-78223402?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Dry Danube River threatens nuclear power in Romania, Hungary\nAugust 3, 2026\nSeveral central and eastern European countries are facing power shortages and impacts on industry amid prolonged hot and dry weather and record low levels on the Danube River and other waterways.\nHungary narrowly averted switching off its lone nuclear plant, but had still powered it down to a fraction of capacity. In Romania, the navy demolished a rocky outcrop exposed in the Danube's riverbed, trying to improve the water flow.\nAnd in Serbia, hydroelectric power output was severely impacted by the dry conditions.\nContinued hot and dry weather is forecast during the week, providing little sign of relief.\nHow did Romania try to feed the Cernavoda power plant?\nRomania's military detonated a rocky outcrop exposed by the low water levels on a branch of the Danube, seeking to improve the flow of cooling water to the Cernavoda nuclear plant, which typically supplies about one-fifth of the country's power.\nThe plant draws all of its cooling water from the Danube.\nSoldiers detonated a rock some 50 kilometers (roughly 30 miles) upstream. The debris would be taken to a strategic spot and sunk to help raise the water level.\nDefense Minister Radu Miruta said the operation was a success, and also said the military had been waiting for a chance to access and demolish the rocks for decades.\nIf the partial diversion of the water fails, Miruta said, the plant would likely have to shut down entirely by Thursday.\nCaretaker Prime Minister Ilie Bolojan said that carmakers Dacia and Ford had agreed to suspend production in Romania until August 19, following a crisis meeting with representatives of the energy-intensive industry. He said that other companies would be taking similar steps.\nWhat was the situation at Hungary's Paks power plant?\nHungarian Prime Minister Peter Magyar said it was possible to avoid the unprecedented total shutdown of the Paks nuclear power plant on Monday that was originally announced last week.\nBut the four-reactor station that typically generates almost half of Hungary's electricity production and around a third of its consumption was running at little more than 10% capacity on Monday.\nHungary had asked industrial users to curb consumption and households to make voluntary savings. Electric-powered freight trains were also stopped on Monday to reduce the load on the grid.\nMagyar thanked people for their restraint on Monday evening.\n\"We have entered the critical period. The network is stable, consumption is currently well below planned levels, thanks to self-restraint. The last Paks turbine is operational. I will report back shortly from the (grid operator) MAVIR control room,\" he said.\nMagyar also said slightly earlier on Monday that \"water management forecasts for the coming days have become slightly more optimistic.\"\nHow was Serbia affected?\nIn Serbia, the vast Iron Gate hydroelectric plant on the Danube was operating at only around one-fifth capacity on Monday.\nPrime Miniser Djuro Macut convened an emergency meeting on Monday to discuss the energy problems.\nHe appealed to residents to \"minimize the use of big consumers of electricity in their homes, such as air conditioners,\" having described the situation as \"serious an demanding\" late on Sunday.\nFar upstream in Bavaria, the Danube's levels were also affecting freight transport.\nNew German Transport Minister Steffen Bilger said the historic low levels on the Danube, and particularly the Rhine to the west — Europe's busiest inland freight waterway — were providing a first challenge for his tenure.\n\"It is indeed a very tense situation with the low waters,\" Bilger told Reuters TV on Monday, saying he would chair a crisis meeting on Thursday. \"We are used to repeated low water situations, but this is really a very early point in the calendar year for problems of the kind we're currently experiencing.\"\nTypically European rivers reach their lowest levels slightly later in the summer — it's entirely possible that several more weeks of predominantly hot and dry weather are yet to come.\nEdited by: Dmytro Hubenko\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "averted", "definition": "危機や不幸な事態を回避する、防ぐ。ここではハンガリーが原発の完全閉鎖を避けたという意味で使われています。"}, {"word": "outcrop", "definition": "地表に露出した岩盤や鉱物層。ドナウ川の水位低下で露出した岩盤を指しており、航行や水流に支障をきたす障害物となっています。"}, {"word": "curtail", "definition": "削減する、制限する。ここではハンガリーが産業ユーザーに電力消費を削減するよう求めたという意味です。"}, {"word": "tenure", "definition": "職務や地位の在任期間。ドイツの新しい運輸大臣が就任して初めての課題という文脈で使われています。"}, {"word": "unprecedented", "definition": "前例のない、これまでにない。ハンガリーの原発完全閉鎖がかつて経験したことのない事態であることを強調しています。"}, {"word": "diversion", "definition": "転用、迂回、流路の変更。ここでは川の水をコントロールして発電所に送水することを意味しています。"}]}, {"title_ja": "トランプ大統領、合意なければイランに「斬首」脅迫", "title_en": "Trump Threatens Iran With 'Decapitation' if No Deal Reached", "summary_ja": "米国トランプ大統領は、交渉が続いているとし、合意しないイランに「斬首」の脅迫を行いました。テヘランはこの主張を否定しています。トランプ大統領は米海軍がホルムズ海峡を支配していると主張し、合意または「完全降伏」なしには何もイランに届かないと警告しました。", "summary_en": "US President Donald Trump demanded Iran make a deal or face 'decapitation,' claiming negotiations were ongoing despite Tehran's denials. Trump asserted the US Navy controls the Strait of Hormuz and warned nothing would reach Iran without a deal or 'total surrender.' Iran announced separate negotiations with Oman on a temporary shipping corridor in the strategic waterway.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/iran-war-trump-tells-iranian-leaders-to-make-deal-or-surrender/live-78210315?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Iran war: Trump tells Iranians to make deal or surrender\nPublished August 3, 2026last updated August 3, 2026\nWhat you need to know\n- \n\tTrump calls Iran's leaders 'duplicitous,' tells them to make deal or surrender\n- \n\tIran and Oman plan new route for Strait of Hormuz vessels, Tehran says\n- \n\tUS President Donald Trump said new round of Iran talks set for Monday\n- \n\tHe made the statement after calling of attacks on Iran\n- \n\tIran says there are no talks underway with Washington\n- \n\tTwo tankers with Saudi oil exit Red Sea\nThis blog covers the latest developments in the US-Israel war with Iran and the wider fallout across the Middle East on Monday, August 3.\nTired of missing our real-time updates? Click here to add DW as a Preferred Source on Google.\nTrump threatens Iran with 'decapitation' if no deal is reached\nUS President Donald Trump insisted that negotiations with Iran were ongoing, adding that the Islamic Republic was facing a \"last chance before decapitation.\"\nTrump told reporters at the White House that he agreed to continue to pursue talks with Iran at the request of Saudi Arabia, the United Arab Emirates, Qatar and other countries.\nBut Iran's foreign ministry has so far denied that negotiations with Washington were taking place.\n\"We are talking right now,\" Trump said.\n\"This is a last chance for them to sign a good document,\" the US president added. \"I want to give them every last chance before decapitation.\"\nThe remarks were similar to last week's threat by Trump that Iran would be hit \"very hard,\" facing potentially with renewed attacks against energy infrastructure. But the US president backed down later, saying the \"perimeters\" of a deal were there.\nBoard of Peace: Gaza deal possible only with 'complete' Hamas disarmament\nUS President Donald Trump's Board of Peace said that an Israeli withdrawal in Gaza requires the militant group Hamas's \"complete\" disarmament.\nThe board made the statement on the social media platform X, following a meeting with Israeli Prime Minister Benjamin Netanyahu.\n\"We note that the full withdrawal of the IDF beyond the Yellow Line will take place only once decommissioning (of weapons) is complete, as Hamas committed to the mediators,\" the board wrote, making reference to a line between the area under Hamas control and that held by the Israeli army.\n\"Israel and the Board of Peace share a common understanding of the ultimate objectives,\" the statement added.\nMeanwhile, Netanyahu's office said Israel demanded concrete disarmament by Hamas.\n\"Israel has conveyed its comments and concerns on the proposed framework to our American counterparts. The version that has been made public does not reflect Israel's positions,\" Doron Spielman, spokesman for the prime minister's office, told the AFP news agency.\nTrump calls Iran's leaders 'duplicitous,' tells them to make deal or surrender\nUS President Donald Trump lashed out at Iran, criticizing it for seeking to work directly with Oman on a solution to the backlog in the Strait of Hormuz.\n\"Iranian Leadership is unbelievably duplicitous! They ask for a meeting, some would say 'beg,' talks begin, with more scheduled in the immediate future, and they say, openly and proudly, that they’re not having any discussions, that nothing is being talked about, and they’re only dealing with 'Oman,'\" Trump wrote on his social media platform Truth Social.\nThe remarks come after Iran announced it was negotiating a joint temporary shipping corridor with Oman.\nTrump asserted, however, that the Strait of Hormuz is \"already completely controlled by the United States Navy\" and the blockade it has imposed on it.\n\"Nothing gets through to Iran, unless we want it to, and nothing will get through, unless a Deal, or Total Surrender, is accomplished,\" Trump wrote.\nThe US president also again vowed that Iran would not obtain a nuclear weapon.\nTehran: Iran and Oman plan new route for Strait of Hormuz vessels\nIranian Foreign Ministry spokesman Esmaeil Baghaei said the country is negotiating a joint temporary shipping corridor in the strategically important Strait of Hormuz with Oman.\nAccording to the state news agency IRNA the idea would involve a circular route rather than several separate lanes until a final arrangement was reached.\nThe announcement comes after US President Donald Trump announced a new round of talks with Iranian representative.\nUnder the plan, tankers or cargo ships would enter the Strait of Hormuz on a northern route through Iranian territorial waters.\nAfter calling at ports in Iran or in Arab Gulf states, the ships would use a southern route through Omani territorial waters for the return journey.\nIran hangs two convicted of espionage\nIran says it executed two men on Monday after they were convicted of spying for Israel.\nIt is the latest in a series of hangings on espionage allegations carried out by Tehran since the start of the war with Israel and the US in late February.\n\"Omid Behzad and Pouria Safvat were hanged this morning for transmitting the", "translation_ja": "", "vocab": [{"word": "duplicitous", "definition": "二重性のある、または詐欺的な行動をする様子を表します。相手が表面と裏で異なることを言っているときに使用されます。"}, {"word": "decapitation", "definition": "軍事用語として、敵の指導部を破壊することを意味します。ここでは攻撃による脅迫を示しています。"}, {"word": "decommissioning", "definition": "兵器などを使用不可能にするプロセスを指します。軍事交渉や紛争解決の文脈で重要な用語です。"}, {"word": "blockade", "definition": "港湾や地域への出入りを軍事的に封鎖することです。物資供給を制限するために使用されます。"}, {"word": "espionage", "definition": "他国や組織のために秘密情報を収集する行為を意味します。スパイ活動とも呼ばれます。"}, {"word": "perimeters", "definition": "ここでは交渉の枠組みや条件の範囲を意味します。契約や合意の基本的な要素を示す外枠を指します。"}]}, {"title_ja": "ミシガン州でサイクロスポーラ症の流行が広がる中、2人の死亡が報告される", "title_en": "2 Deaths Reported in Michigan as Cyclosporiasis Outbreak Spreads", "summary_ja": "ミシガン州保健局は、同州で進行中のサイクロスポーラ症の流行に関連する最初の2人の死亡を発表しました。寄生虫感染はミシガン州全域で続いています。保健当局は流行の原因を調査し、さらなる感染の封じ込めに取り組んでいます。", "summary_en": "Michigan's health department announced the first two deaths linked to an ongoing cyclosporiasis outbreak in the state. The parasitic infection continues to spread across Michigan. Health officials are investigating the source of the outbreak and working to contain further cases.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Health/2-deaths-reported-cyclosporiasis-outbreak-michigan-cases-surpass/story?id=135329968", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースとライブイベントの24時間体制での報道を提供しています。世界中の主要なニュースについて、リアルタイムの更新情報を入手できます。ABCニュースのジャーナリストによる継続的な報道と分析にアクセスしてください。", "summary_en": "ABC News Live provides round-the-clock coverage of breaking news and live events as they unfold. Stay informed with continuous updates on major stories from around the world. Access real-time reporting and analysis from ABC News journalists.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "キャピタル・ワンがマネーロンダリング対策を理由にトランプ氏の口座を閉鎖", "title_en": "Capital One Closed Trump Accounts for Anti-Money Laundering Reasons", "summary_ja": "キャピタル・ワンは2021年にトランプ大統領およびその関連企業に関連する数百の口座をマネーロンダリング対策を理由に閉鎖したと、企業申告書で明らかにした。同銀行は規制要件を口座閉鎖の理由として挙げている。この開示により、金融機関がトランプ関連企業との関係を終わらせる決定についての詳細が明らかになった。", "summary_en": "Capital One closed hundreds of accounts associated with President Trump and his businesses in 2021 due to anti-money laundering compliance measures, according to a company filing. The bank cited regulatory requirements as the reason for the account closures. The disclosure provides details on the financial institution's decision to end its relationship with Trump-related entities.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/capital-closed-hundreds-trumps-bank-accounts-2021-anti/story?id=135273257", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セウタ危機後、EUはより強い国境対策が必要—フォン・デア・ライエン委員長が声明", "title_en": "EU Must Strengthen Borders After Ceuta Crisis, von der Leyen Says", "summary_ja": "欧州委員会のウルスラ・フォン・デア・ライエン委員長は、スペイン領セウタへの大量の移民流入を受けて、EU国境管理の強化を呼びかけた。スペインの迅速な対応を評価しながらも、非EU諸国との協力強化、早期警戒システムの改善、密輸ネットワークの解体の必要性を強調した。この事件はEU加盟国間の移民政策をめぐる分裂を露呈させ、イタリアとデンマークが正規化プログラムが移民を招くインセンティブになっていると主張する声が高まっている。", "summary_en": "European Commission President Ursula von der Leyen called for stronger EU border controls following a surge of tens of thousands of migrants crossing into Spain's Ceuta enclave. She praised Spain's swift response while emphasizing the need for better cooperation with non-EU countries, improved early warning systems, and dismantling of smuggling networks. The incident has exposed divisions among EU member states over migration policy, with Italy and Denmark leading calls to address regularisation programs they claim act as pull factors.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/03/stronger-eu-borders-physical-barriers-ceuta-von-der-leyen", "state_media": false, "category": "政治", "full_text": "The president of the European Commission has called for action to strengthen Europe’s borders after tens of thousands of people arrived and quickly left the Spanish territory of Ceuta, triggering a furious row between Madrid and other European countries.\nIn a letter to Spain’s prime minister, Pedro Sánchez, on Monday, Ursula von der Leyen said: “From this incident, it is clear that we must do more to further strengthen our borders at critical points, including vigilant monitoring and the use of physical barriers where needed.”\nShe praised the Spanish socialist leader’s swift handling of the crisis, after the vast majority of migrants left Ceuta and Spanish officials began installing a 500-metre (1,640ft) floating barrier at the border with Morocco. “Order has been restored and the returns system in place worked,” she wrote in the letter.\nSpain estimates that about 69,500 migrants have returned to Morocco over the past four days, exceeding initial estimates of 50,000 having arrived in the enclave in north Africa on Thursday. Authorities in Ceuta reported that 88 people died trying to reach the territory, while at least 11 deaths have been recorded in Morocco.\nCeuta and Melilla, another Spanish enclave, have the EU’s only land borders with Africa. There are periodic surges in attempted crossings to both cities, although neither permits onward free movement to the EU as they are outside the border-free Schengen zone.\nEU interior ministers will hold emergency talks on Tuesday, which von der Leyen said would be a chance to draw lessons from the crossings.\nShe said the EU should double down on five areas: strengthening cooperation with non-EU countries to prevent migration; stronger external borders; implementing early warning systems; dismantling smuggling networks; and boosting returns of people with no right to stay.\nItalian media reported that Giorgia Meloni’s government wanted to accelerate the opening of offshore migration centres, which Europe’s top human rights expert recently said risked becoming “human rights black holes”.\nThe EU opened the door to offshore detention centres in June in an unprecedented departure from legal norms as part of a law aiming to increase the deportations of people with no legal right to stay.\nAmid heavy criticism of the EU’s divided response to the Ceuta border crossings, von der Leyen stressed that Spain could access EU funds as well as support from the Frontex border agency. So far Madrid has not requested the assistance of Frontex.\nThe crossings – seized on by far-right politicians across Europe – have exposed deep divisions over migration that have left Spain’s leader isolated.\nOver the weekend, Sánchez criticised other governments for failing to support Spain, after Italy and Denmark led calls for its temporary exclusion from the Schengen zone. Sánchez said such an attitude was “driven by prejudice, fake news, ignorance or political interest” and contrary to European and humanitarian law “and the principles of solidarity that bind us together”.\nItaly and Denmark organised a letter signed by 20 other EU member states that appeared to blame the crisis on Sánchez’s decision to regularise the status of 500,000 migrants without documents. “We have a duty to effectively deter and relentlessly combat illegal migration,” the 22 leaders wrote, arguing for the need to address “all policies that can serve as pull factors, such as the regularisation of [a] very large number of irregular migrants”.\nEU member states favouring a tough approach to migration are expected to raise the issue of “pull factors” on Tuesday. “There is some concern that the regularisation of 1.2 million people can be used to paint a picture that the door is open,” an EU diplomat said, referring to the approximate number of people who applied for regularisation under the 2026 Spanish government programme.\nAcademic research has found no evidence of a pull effect from regularisation programmes on arrivals of irregular migrants.\nMichele LeVoy, the director of Picum, an umbrella group that campaigns for the rights of undocumented migrants, said regularisation programmes had been criticised by EU governments for the last two decades. “If an EU country offers regularisation possibilities, other member states believe that it may invite secondary movement [onward movement to other EU member states] – that is what EU member states don’t want and that explains most likely the harsh response.”\nAmid widespread suspicion that Morocco helped fuel the crisis, von der Leyen described the country as “an important strategic partner”, especially in combating “illegal migration”.\nOfficials said that before the Ceuta crossings, the European Commission was looking to upgrade the EU’s diplomatic relationship with Morocco to a “strategic and comprehensive partnership”. The EU already has similar wide-ranging agreements with Egypt and Tunisia, which include pledges to stem migration, but which have been heavily criticised by rights group", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "他国領土に囲まれた飛び地のこと。ここではスペイン領セウタはモロッコに囲まれた領土を指す。国際関係や地政学的な文脈でよく使用される。"}, {"word": "regularisation", "definition": "不法滞在者の法的地位を正規化すること。移民政策の文脈で、書類のない移民に合法的な身分を与えるプログラムを指す。"}, {"word": "pull factor", "definition": "人々が特定の場所に移動するよう引き寄せる要因のこと。移民論では、寛容な政策が移民増加をもたらす誘因となることを指す。"}, {"word": "smuggling networks", "definition": "違法に人や物を国境を越えて運ぶ犯罪組織のネットワーク。移民危機の文脈では密輸業者による人身売買組織を意味する。"}, {"word": "Frontex", "definition": "欧州連合国境管理協力庁の略で、EU加盟国の国境管理を支援する機関。加盟国が要請すれば人員や装備を派遣する。"}, {"word": "offshore detention", "definition": "陸地から離れた海上や島嶼部に設置された移民収容施設のこと。本土から隔離された場所での拘束を指す。"}, {"word": "solidarity", "definition": "共通の利益や目標に基づいた団結や一致団結の精神。EU加盟国間の相互支援と協力の原則を表す。"}]}, {"title_ja": "セウタ移民危機がヨーロッパの分裂を露呈", "title_en": "Ceuta Migrant Crisis Exposes European Divisions", "summary_ja": "モロッコからスペイン領セウタへ約50,000人の移民が渡ろうとし、数十人が死亡してスペインで政治危機が発生しました。この事件はEU加盟国からの批判を招き、移民政策と国境管理をめぐるヨーロッパ内の深刻な分裂を露呈させています。", "summary_en": "An estimated 50,000 migrants crossed from Morocco into the Spanish enclave of Ceuta, resulting in dozens of deaths and triggering a political crisis in Spain. The incident has drawn criticism from EU member states, revealing deep divisions within Europe over migration policy and border management.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/news/audio/2026/aug/03/how-ceuta-migrant-crisis-exposes-divisions-within-europe-the-latest", "state_media": false, "category": "政治", "full_text": "How Ceuta migrant crisis exposes divisions within Europe - The Latest\nDozens of people died attempting to reach the Spanish enclave of Ceuta after an estimated 50,000 crossed from Morocco last week. The incident has led to a political crisis in Spain and criticism from EU countries.\nLucy Hough speaks to the Guardian’s European community affairs correspondent, Ashifa Kassam – watch on YouTube", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "周囲を他国に囲まれた領土のこと。セウタはスペインの領土ですがモロッコに囲まれています。"}, {"word": "divisions", "definition": "グループや国家間の意見や利益の相違。ヨーロッパ内での政策の不一致を示します。"}, {"word": "migrant crisis", "definition": "大量の人口移動による社会的・政治的問題。難民や移民の急増が引き起こす状況を指します。"}, {"word": "exposes", "definition": "隠れていた問題や真実を明らかにする。ここでは危機がヨーロッパの内部問題を明るみに出したことを意味します。"}, {"word": "triggering", "definition": "特定の事象や反応を引き起こす。セウタの事件がスペインの政治危機を招いたことを示します。"}]}, {"title_ja": "セウタ指導者、大量越境危機でモロッコを非難", "title_en": "Ceuta leader accuses Morocco of orchestrating mass border crossing crisis", "summary_ja": "スペイン当局は先週セウタに約69,500人の移民が越境したと主張し、領土指導者はこの流入をスペインの領土保全への攻撃と描写し、モロッコが助長または許可したと述べた。この危機はEU全体で政治的混乱を引き起こし、一部の加盟国はスペインのシェンゲン圏からの停止を要求しており、スペイン情報部はモロッコが越境を防止しなかったか容易にしたと示唆している。", "summary_en": "Spanish officials claim approximately 69,500 migrants crossed into Ceuta last week, with the territory's leader describing the influx as an attack on Spain's territorial integrity that was encouraged or permitted by Morocco. The crisis has sparked a political upheaval across the EU, with some member states calling for Spain's suspension from the Schengen zone, while Spanish intelligence suggests Morocco failed to prevent or facilitated the border crossing.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/03/ceuta-leader-border-crossing-morocco-spain", "state_media": false, "category": "社会", "full_text": "A growing chorus of voices has accused Morocco of helping to fuel the crisis in Ceuta, with the leader of the Spanish enclave describing last week’s border crossings as an attack on Spain’s territorial integrity that was seen as being “if not orchestrated, at least encouraged or permitted by Morocco”.\nSpanish officials said on Monday that an estimated 69,500 people who had arrived late last week in Ceuta, a tiny Spanish territory in north Africa, had returned to Morocco in recent days. About 2,500 people who had made the crossing were believed to still be in Ceuta.\nThe extraordinary influx had overwhelmed the city of 84,000 people and set off a political crisis across the EU as some member states laid blame on Spain.\nIn Ceuta, leaders pointed to the broader picture of what had transpired. “It’s an atrocity,” said Juan Jesús Vivas, the long-serving conservative leader of the territory. “There are 88 bodies in the morgue, and there are more on the other side of the border.”\nHe said local people watched the events play out with a mix of sadness, worry and anguish. “People see this not as a migration crisis; it was fundamentally an attack, a violation of Spain’s territorial integrity,” Vivas told El País newspaper. “People felt that this, if not orchestrated, was at least encouraged or permitted by Morocco.”\nHe drew a parallel with May 2021, when Rabat loosened border controls, allowing 10,000 people to cross into Ceuta over the course of two days, during a diplomatic standoff over Madrid’s decision to allow a Western Sahara independence leader to be treated for Covid-19 in Spain.\nThis time around, analysts have suggested that Spain’s recent rapprochement with Rabat’s arch-enemy Algeria could have triggered a response from Morocco.\nSpeaking on Monday, Spain’s defence minister, Margarita Robles, also seemingly signalled Rabat’s involvement. “Neither Spain nor Morocco can look the other way when it comes to this tragedy,” she told reporters. “I ask the Moroccan government to fully investigate what happened.”\nThe insinuation appeared to be backed by the preliminary assessment of Spanish intelligence services, who cited suspicions that the influx had not been planned by Moroccan authorities but concluded that Morocco had failed to stem the tide of people rushing towards the border and in some cases had even facilitated their passage.\nIntelligence sources told El País that the roots of the influx probably lay in a hoax that had swiftly spread across social media after a Spanish supreme court ruling that migrants arriving by sea could not be summarily deported. As the hoax gained steam online, Moroccan border surveillance dwindled to a minimum until it was completely lifted late last week, allowing tens of thousands of people to stream through.\nIn Ceuta on Monday, hundreds of people continued to sleep rough on the beach or near Ceuta’s mosques. One local official told reporters that those who remained in the city included 862 unaccompanied minors.\nAshraf, 28, said he had defied his mother’s warnings against crossing into Spain after spotting posts on social media that said the border had been opened. While he had made it to Ceuta, what had followed was a days-long ordeal as he scrambled to find food and shelter while fending off the memories of what he had lived through.\n“You might see me smile a little but inside I’m shattered,” the Moroccan national said as he recalled swimming past bodies to reach Ceuta. “There were so many people in the sea. Everyone was trying to grab on to you to save themselves, and you were trying to escape and move forward so they wouldn’t drag you down or drown you. The Moroccan police were pushing us toward the water and telling us ‘swim, swim’.”\nOthers were desperately seeking loved ones who were missing. One mother said she had been roaming the streets of Ceuta for days, frantically searching for any sign of her children, aged 13 and 16.\nShe had left Morocco alone, finding out later that her two children had followed her by plunging into the sea to make their way around the border.\n“I need help,” she said as she held up a photo of a smiling young boy flashing a thumbs-up sign. “Some migrants told me they had seen them in Ceuta, but I can’t find them.”\nAcross the EU, the crisis in Ceuta had seemingly ushered in a moment of reckoning after a handful of EU countries responded to the crisis by calling for Spain to be suspended from the Schengen free-movement zone. Italy said it had suspended passport-free Schengen travel arrangements with Spain for one month, despite the fact that Ceuta is not part of Schengen.\nBefore an emergency video meeting of interior ministers on Tuesday to address the crisis, Spain’s foreign minister said the country would demand solidarity from EU members after several had, in his view, “fallen short” of what was expected.\n“There was a synchronised reactionary international effort that very quickly amplified what was happening, spreading lies and fake news about the ", "translation_ja": "", "vocab": [{"word": "influx", "definition": "短期間に大量に流入すること。通常、人や物が急速に増加して押し寄せる状況を指す。"}, {"word": "orchestrated", "definition": "計画的に組織され、指揮されたこと。複数の要素が一つの目的に向けて巧妙に配置される様子を表す。"}, {"word": "facilitated", "definition": "何かが起こりやすいようにすること、または容易にすること。支援や仲介を通じて進行を助ける意味。"}, {"word": "territorial integrity", "definition": "国家の領土主権と完全性を保つこと。他国からの侵害や侵犯を受けない状態を指す。"}, {"word": "hoax", "definition": "意図的に広められた偽りの情報や詐欺的な情報。通常、多くの人を欺くために拡散される。"}, {"word": "preliminary assessment", "definition": "最終的な結論に至る前の初期段階の評価。調査や検査に基づいた暫定的な判断。"}]}, {"title_ja": "セウタでの難民受け入れ：飢えと渇きの中での待機", "title_en": "Migrants Await Asylum in Ceuta Amid Hunger and Thirst", "summary_ja": "数千人の移民がスペイン領セウタに殺到し、多くが難民申請の看板を掲げてビーチで数日間を過ごしています。食料と水の深刻な不足に直面し、移民たちは足止めされたままで、地元当局は大量流入への対応に苦労しています。この人道的危機は、ヨーロッパの国境地域における継続的な課題を浮き彫りにしています。", "summary_en": "Thousands of migrants have rushed to the Spanish territory of Ceuta, with many spending days on beaches holding asylum signs. Facing severe shortages of food and water, the migrants remain stranded as local authorities struggle to manage the mass influx. The humanitarian crisis highlights the ongoing challenges at European border regions.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/3/aje-onl-nf_migrants-await-asylum-in-ceuta-amid-hunger-thirst-030826?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Migrants await asylum in Ceuta amid hunger and thirst\nMigrants rushed to receive water and beverages in Ceuta, Spain, where many have spent days on a beach holding signs seeking asylum. Hungry and thirsty, they remain in the tiny Spanish territory as authorities struggle to manage thousands after a mass border rush.\nPublished On 3 Aug 2026", "translation_ja": "", "vocab": [{"word": "asylum", "definition": "難民保護や亡命者の受け入れを求める法的地位。政治的迫害や戦争から逃れた人々が、安全な国での保護を求める際に用いられます。"}, {"word": "migrant", "definition": "より良い生活条件や経済的機会を求めて他の地域や国に移住する人。難民とは異なり、主に経済的理由で移動します。"}, {"word": "influx", "definition": "大量の人間や物質が急速に流入すること。ここでは多くの移民が短期間に大量到着したことを指します。"}, {"word": "humanitarian", "definition": "人道的な、または人間の苦しみを軽減することに関する。医療や食料などの基本的ニーズに関わる国際支援の文脈で使用されます。"}, {"word": "territory", "definition": "国家または権力者が支配下に置く特定の地理的領域。セウタはスペインが統治する北アフリカの領土を指します。"}, {"word": "manage", "definition": "複雑な状況や大量の人数を効果的にコントロール・対処すること。ここでは当局が移民危機への対応能力について述べています。"}]}, {"title_ja": "ハマスが武装解除すればイスラエルはガザから撤退するのか？", "title_en": "Will Israel Withdraw from Gaza if Hamas Disarms?", "summary_ja": "イスラエルはハマスの武装解除の約束に疑問を示しており、完全な武装解除をイスラエル軍のガザからの撤退の前提条件としている。トランプ米大統領が仲介した平和計画では、イスラエル撤退後に国際安定化軍が治安を管理することになるが、ハマスがイスラエル軍の先行撤退を要求しているため、膠着状態が続いている。", "summary_en": "Israel has expressed doubts about Hamas's commitment to disarm, stating complete disarmament is a prerequisite for Israeli military withdrawal from Gaza. Under Trump's US-brokered peace plan, an International Stabilization Force would take control of security after Israeli withdrawal, but a standoff remains as Hamas wants Israeli troops to leave first.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/inside-story/2026/8/3/will-israel-withdraw-from-gaza-if-hamas-disarms?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Will Israel withdraw from Gaza if Hamas disarms?\nIsrael says it has doubts about the Palestinian group laying down its weapons.\nDisarming means giving up weapons. Nothing less.\nThose were the words of Israeli government officials after Hamas announced it was ready to disarm.\nRecommended Stories\nlist of 3 items\n- list 1 of 3The Board of Peace is a failed body and should be abandoned\n- list 2 of 3Fetus found among the ruins of a deadly Israeli strike on Gaza\n- list 3 of 3Israel defies Trump’s peace plan as it escalates deadly attacks on Gaza\nThe move is part of a United States-brokered plan to end Israel’s war on Gaza.\nUS President Donald Trump’s proposal includes the withdrawal of the Israeli military from the Gaza Strip.\nAn International Stabilization Force (ISF) would then take control of security, working alongside a new Palestinian police force.\nBut Israel says it has no plans to leave — unless Hamas completely disarms.\nAnd Hamas wants Israeli troops to pull out before it lays down its weapons.\nSo, how will Trump implement his plan?\nPresenter: Frankie McCamley\nGuests:\nXavier Abu Eid — Political analyst and former adviser to the Palestinian negotiating team\nMichael Mulroy — Former US deputy assistant secretary of defence for the Middle East\nNimrod Novik — Former special envoy and senior adviser to Israeli Prime Minister Shimon Peres", "translation_ja": "", "vocab": [{"word": "disarm", "definition": "武装を放棄する、武器を手放すことを意味します。政治や軍事の文脈では、紛争終結のための重要な条件として使用されます。"}, {"word": "stabilization force", "definition": "紛争地域の秩序を維持し、安定をもたらすための国際的な軍事展開を指します。通常は平和維持活動の一環として機能します。"}, {"word": "brokered", "definition": "仲介者として交渉や合意を成立させることを意味します。国家間の協議で第三者が解決策をまとめる場合に用いられます。"}, {"word": "prerequisite", "definition": "何かが実現する前に必要不可欠な条件を指します。要件や前提条件として使用される重要な語彙です。"}, {"word": "escalate", "definition": "問題や紛争が段階的に悪化・拡大することを意味します。軍事や政治紛争の悪化を表現する際に頻出します。"}, {"word": "standoff", "definition": "双方が譲らず、膠着状態になった状況を指します。交渉が進まない対立的な状態を表します。"}]}, {"title_ja": "ミシガン州民主党上院予備選でエルサイードとスティーブンスが対立", "title_en": "El-Sayed and Stevens Compete in Michigan Democratic Senate Primary", "summary_ja": "ミシガン州の有権者は火曜日に、進歩派の候補者アブドゥル・エルサイードと下院議員ヘイリー・スティーブンスの間で民主党上院予備選を行う。この選挙はイスラエル支持派ロビー団体の政治的影響力と党の方向性を左右する可能性があるため注目されている。", "summary_en": "Michigan voters will choose between progressive candidate Abdul El-Sayed and Representative Haley Stevens in a Democratic Senate primary election on Tuesday. The race is significant as it could influence the party's direction and the political power of pro-Israel advocacy groups.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/3/el-sayed-stevens-face-off-in-michigan-democratic-senate-primary?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "El-Sayed, Stevens face off in Michigan Democratic Senate primary\nVoters in the US state of Michigan will cast ballots Tuesday in a Democratic Senate primary between progressive Abdul El-Sayed and Rep. Haley Stevens that could reshape the party and the influence of pro-Israel lobbying groups.\nPublished On 3 Aug 2026", "translation_ja": "", "vocab": [{"word": "primary", "definition": "本選挙の前に行われる予備選挙。政党内で候補者を決定するための選挙プロセスを指す。"}, {"word": "progressive", "definition": "進歩的な政治思想を持つ人物または立場。より広範な社会改革を支持する傾向を示す。"}, {"word": "reshape", "definition": "根本的に変形する、改造する。この文脈では政党の構造や方向性を大きく変えることを意味する。"}, {"word": "lobbying", "definition": "特定の利益のため政治家や政府機関に働きかける活動。圧力団体による政治的影響力行使を指す。"}, {"word": "cast ballots", "definition": "投票する、選票を投じる。選挙に参加して投票行為を行うことを表す。"}]}, {"title_ja": "トランプ大統領、新たなイラン交渉を「最後の機会」と表明、米国の軍事的エスカレーションを回避するため", "title_en": "Trump Says New Iran Talks Are 'Last Chance' to Avoid Escalation", "summary_ja": "トランプ大統領は、イランとの予定された交渉を合意に達し、米国のさらなる軍事的エスカレーションを防ぐための最終的な機会であると発表した。交渉はホルムズ海峡の再開とイランの核問題への対処を目指しているが、トランプは何度も大規模な攻撃を脅迫した後に撤回している。批評家たちは、脅迫に続く抑制というトランプのパターンは不安定なアプローチを反映しており、軍事力だけではイランの降伏を強制できないという認識を示唆していると述べている。", "summary_en": "President Trump announced planned negotiations with Iran as a final opportunity to reach a deal and prevent further US military escalation. The talks aim to reopen the Strait of Hormuz and address nuclear concerns, though Trump has repeatedly threatened major strikes before backing down. Critics say Trump's pattern of threats followed by restraint reflects an erratic approach and possible recognition that military force alone may not compel Iran's surrender.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/new-talks-last-chance-for-iran-to-forge-deal-avoid-escalation-of-us-strikes-trump/article71302832.ece", "state_media": false, "category": "社会", "full_text": "Newly planned talks with Tehran a
