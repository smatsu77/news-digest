re the “last chance” for Iran to forge a deal and avoid an escalation of US strikes on the country, President Donald Trump said on Monday (August 3, 2026).\nMr. Trump, speaking at the Oval Office, said he expects negotiations that will reopen the Strait of Hormuz and create a pathway for Iran to address the United States' concerns about its nuclear programme will begin in the next day or two.\n“The first phase is the opening of the straits. The second phase will be the denuclearisation,\" the Republican President said. “And that will take a little while.”\nWhile Trump has revelled in the US military decimating layers of Tehran's leadership and devastating its air force and navy, Iran is betting it can outlast Trump as he faces diminished stockpiles of munitions and the difficulty of executing a war that is unpopular with the American electorate ahead of November's midterm election.\nMr. Trump said he decided to hold off on ordering American forces to carry out new massive strikes against Iran at the urging of Gulf allies Qatar, Saudi Arabia, and the United Arab Emirates.\nHe said that a plan was in place for U.S. forces to carry out “the biggest attack since World War II” on Sunday. But he decided to scrap the plan and give diplomacy more time to play out after hearing from key Gulf leaders — including Saudi Crown Prince Mohammed bin Salman — as well as at the request of unnamed Iranian officials.\nBut Mr. Trump reiterated that he's running out of patience with Iran.\n“This the last chance for them to sign a good document,” Mr. Trump told reporters.\nEarlier Monday (August 3), Mr. Trump had criticised Iran on social media as being “unbelievably duplicitous.”\nHis ire was raised by Iran claiming that its meetings with Oman on Monday (August 3) were focused solely on establishing a temporary route for safe navigation through the Strait of Hormuz, a critical waterway for the global oil trade.\n“They ask for a meeting, some would say 'beg,' talks begin, with more scheduled in the immediate future, and they say, openly and proudly, that they're not having any discussions, that nothing is being talked about, and they're only dealing with Oman,” Mr. Trump grumbled.\nMr. Trump said whether “Iran wants to admit it or not, we are, in fact, talking” about preventing Iran from developing nuclear weapons.\nMr. Trump has threatened to escalate attacks on Iran only to edge away from his threats several times since the start of U.S. and Israel strikes on February 28.\nAsked by a reporter how Americans view him repeatedly making grim threats on Tehran before backing away, Trump responded that he's showing patience out of a consideration for Iranian life.\n“I want to give them every last chance before decapitation,” Mr. Trump said. He added, “Hopefully, they'll come to their senses.”\nCritics see Trump reaching for a reset button in this pattern\nMr. Trump may still come to the conclusion that a massive escalation in the conflict with Iran is necessary.\nBut critics say his hesitation also might reflect an unspoken understanding inside the administration that U.S. military might alone may not be enough to compel Iran to back down and bring an end to a now monthslong war that Mr. Trump had earlier downplayed as a weekslong excursion.\n“I think what we're seeing here is a President who has an approach that's just rather erratic,” said Sen. Mark Kelly, an Arizona Democrat on the Senate Armed Services Committee, on CBS News' “Face the Nation.”\n“At this point, he's trying to get us back to February. And I think if he could — if he had a big reset button he could hit — he would certainly take that option.”\nThere have been several moments over the course of the conflict when Mr. Trump has demonstrated his proclivity for the bellicose only to back off at the last minute, while declaring his threats spurred progress: — In early April, the United States and Iran agreed to a two-week ceasefire in an announcement that came less than two hours before a deadline Mr. Trump had set for Tehran to capitulate or face attacks on bridges and power plants — strikes he said would mean “a whole civilization will die.”\nAfter days of dire threats against Iran, Mr. Trump announced on May 18 he was holding off on a major planned military strike because “serious negotiations” were underway, crediting Gulf allies for persuading him to show restraint.\nThen in June, Mr. Trump threatened to hit Iran “VERY HARD” and seize Iran's energy base on Kharg Island to \"assume total control of their Oil and Gas Markets,” he wrote on social media, only to call off the strikes in a later post after claiming that peace negotiations had progressed with high-level Iranian leaders.\nLeft unsaid by Mr. Trump was that such an endeavour would require U.S. troops on the ground in Iran — a risky proposition politically for a President who campaigned on avoiding foreign entanglements and criticised past administrations for getting bogged down in endless wars.\nCall wi", "translation_ja": "", "vocab": [{"word": "duplicitous", "definition": "二重性を持つ、虚偽的な、という意味で、表面的には協力的に見えながら実際には欺瞞的な行動をしていることを指す。外交交渉の文脈で頻繁に使われる。"}, {"word": "bellicose", "definition": "好戦的な、攻撃的な言動を示す、という意味。政治的な言論や軍事的な姿勢を説明する際に用いられる。"}, {"word": "proclivity", "definition": "特定の行動や傾向への自然な傾き、癖、という意味。人物の性格や習慣的な行動パターンを示す際に使用される。"}, {"word": "erratic", "definition": "不規則で予測不可能な、一貫性を欠いた、という意味。行動や政策が不安定で変わりやすい状況を説明する。"}, {"word": "entanglement", "definition": "複雑に絡み合った状況や関係性を意味し、特に国家が外交・軍事的に深く関与することで身動きが取れない状態を指す。"}, {"word": "capitulate", "definition": "降伏する、屈する、という意味の動詞。交渉や紛争の文脈で相手が要求に応じることを指す。"}]}, {"title_ja": "トランプ大統領が協議を発表した直後、イランが米国との交渉を否定", "title_en": "Iran Denies U.S. Negotiations After Trump Announces Talks", "summary_ja": "トランプ大統領は6ヶ月間続く紛争を終わらせるため月曜日にイランとの会談が開始されると発表したが、イラン外務省はいかなる交渉も行われていないと否定した。その代わりにイランは、戦争の主要な争点であるホルムズ海峡の通路についてオマーンと交渉していると主張した。紛争の中心は、この重要な海運ルートを支配し料金を徴収するというイランの主張と、それを拒否する米国の立場にある。", "summary_en": "President Trump announced talks with Iran would begin Monday to end their six-month conflict, but Iran's Foreign Ministry denied any negotiations were underway. Instead, Iran claimed it was negotiating with Oman over passage through the Strait of Hormuz, a major sticking point in the war. The dispute centers on Iran's insistence on controlling the critical shipping route and charging fees, which the U.S. rejects.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-claims-iran-talks-will-start-august-3-and-other-developments-in-west-asia/article71302731.ece", "state_media": false, "category": "政治", "full_text": "Iran denied any negotiations were taking place with the United States after President Donald Trump said new talks would begin Monday (August 3, 2026) in an effort to end their war, now in its sixth month.\nAslo Read: West Asia updates on August 3, 2026\nThe rebuttal by the Iranian Foreign Ministry follows Mr. Trump saying he had held off launching new strikes on the Islamic republic to allow for further diplomatic efforts, a familiar pattern in the conflict.\nWashington and Tehran have been at war since February 28, when the U.S. and Israel launched surprise strikes against Iran, though months of on-off diplomacy have led to periods of relative calm.\nMr. Trump last week threatened to hit Iran “very hard”, with the U.S. leader reportedly considering renewed attacks, including against energy infrastructure.\nBut the President pulled back from that threat Saturday, saying the “perimeters” of a deal were there.\nIran’s Foreign Ministry however denied there were currently negotiations taking place.\n“We are not currently negotiating with the United States. Our negotiations are with Oman to secure passage through the Strait of Hormuz,” said foreign ministry spokesman Esmaeil Baqaei during a weekly press briefing.\nThe Hormuz shipping route is a major sticking point in efforts to end the war. Iran has obstructed vessels attempting to pass the critical trade corridor, firing on commercial ships.\nBefore the war, there was free passage through the strait, but Iran now insists on retaining control and charging fees, something the U.S. rejects.\nTehran has refused to let ships travel any route other than one which hugs the Iranian coast.\nOn Sunday (August 2), Baqaei told state television that a deal was close on managing Hormuz together with Oman, which sits on the other side of the narrow waterway.\n“We are now going to reach an understanding on a route acceptable to both sides — neither the northern route nor the southern route — but one that respects the sovereign rights of both sides and safeguards our national interests and security,” he said.\nBut he insisted that such an agreement did not mean the reopening of the strait.\n‘It begins tomorrow’\nOn Sunday (August 2), a tanker off the coast of Oman reported hearing an explosion nearby, the United Kingdom Maritime Trade Operations (UKMTO) Centre reported, but the ship and crew were all reported safe.\nMr. Trump told reporters on Sunday that the new talks with Iran would cover Hormuz and ultimately the denuclearisation of Iran.\nThe U.S. President said at the start of the conflict that the war was necessary to deal with Iran’s nuclear programme. Western nations accuse Iran of seeking a bomb, though Tehran insists the programme is entirely civilian in nature.\n“Now what we’re doing is we’re talking to them in the form of a negotiation. It begins tomorrow afternoon,” Mr. Trump told reporters aboard Air Force One on Sunday, without providing details of the venue or participants.\nThe President said he had been asked by Iran as well as U.S. partners Saudi Arabia, the United Arab Emirates and Qatar to hold off on further strikes, which he claimed would have been “the biggest attack since World War II”.\nIranian media denied that Tehran had asked Mr. Trump not to strike.\nMr. Trump has repeatedly claimed a settlement to end the war is near, only for fighting to resume. He has previously issued apocalyptic warnings to Tehran, only to later backtrack by saying diplomacy was underway.\nA previous ceasefire deal between the foes fell through last month. It was supposed to open the Strait of Hormuz to ships carrying vital energy exports from the Gulf to feed the global economy.\nIranian lawmaker Hassan Ghashghavi, spokesman for the parliament’s national security commission, said on Sunday that mediators were trying to revive the U.S.-Iran memorandum of understanding that was agreed in June.\nThat agreement was not intended as a final peace deal, but as a stepping stone to negotiations on a comprehensive agreement, though it did include provisions on Hormuz.\n“They know that the main issue and, in fact, the key to the matter right now is the issue of the Strait of Hormuz, so yes, there is an exchange of views,” Mr. Ghashghavi said.\nPosting on X, Iranian President Masoud Pezeshkian said: “We must strive to compel the enemy to remain committed to what it has signed.”\nPublished - August 03, 2026 11:23 pm IST", "translation_ja": "", "vocab": [{"word": "rebuttal", "definition": "相手の主張や批判に対する反論や反対意見。ここではイラン外務省がトランプ大統領の交渉開始発表に対して反論したことを指す。"}, {"word": "obstructed", "definition": "進行を妨げたり、ふさいだりすること。この記事ではイランがホルムズ海峡を通過する船舶に対して妨害行為を行ったことを意味する。"}, {"word": "sticking point", "definition": "交渉や議論で進展を妨げる障害や問題点。この場合、ホルムズ海峡の通行権に関する意見の相違を指す。"}, {"word": "denuclearisation", "definition": "核兵器や核計画を放棄すること。米国はイランの核計画の廃止を交渉の目標としている。"}, {"word": "apocalyptic", "definition": "大惨事や世界の終末を予告するような、非常に深刻で悲劇的なこと。トランプ大統領がイランに対して行った極端な脅迫を描写している。"}, {"word": "mediators", "definition": "紛争や交渉において、双方の間に立って調停や仲介を行う第三者。この文脈では米国とイランの間に入って合意をまとめようとする者たち。"}]}, {"title_ja": "スーダン軍がダルフール地域の裁判所をドローン攻撃、35人が殺害", "title_en": "Sudan Army Drone Strike on Darfur Court Kills 35", "summary_ja": "スーダン軍は2026年8月2日、西部ダルフール地域の伝統的裁判所をドローンで攻撃し、地域の聴聞会開催中に35人を殺害した。この村はスーダン軍と2023年4月から激しく対立している準軍事勢力「急速支援部隊」の支配下にある。両勢力はドローン戦争に依存を高めており、2026年前半5ヶ月間で1000人以上の民間人がドローン攻撃で殺害されている。", "summary_en": "The Sudanese military conducted a drone attack on a traditional court in western Darfur on August 2, 2026, killing 35 people during a session of local hearings. The village of Garra al-Zawaya is controlled by the Rapid Support Forces (RSF), rival paramilitaries engaged in a brutal conflict with the army since April 2023. Both sides have increasingly relied on drone warfare, with over 1,000 civilians killed in strikes during the first five months of 2026.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/sudan-army-drone-attack-on-darfur-court-kills-35/article71302722.ece", "state_media": false, "category": "社会", "full_text": "The Sudanese army on Sunday (August 2, 2026) struck a traditional court in western Darfur with drones, killing 35 people and wounding others, a rights group said.\nThe Emergency Lawyers, which has documented abuses by both the army and its rival paramilitaries throughout the three-year conflict, said the strike hit the court in the village of Garra al-Zawaya in North Darfur state at around 1:00 p.m., as civilians had \"gathered to attend hearings on local cases and disputes\".\nThe village is under the control of the Paramilitary Rapid Support Forces (RSF), which have been locked in a brutal conflict with the army since April 2023.\n\"The court session was being held under a tree with the participation of local community leaders,\" a witness from the area told AFP on condition of anonymity for safety reasons.\nAmong those killed were \"four tribal leaders and two RSF commanders\", the witness added.\nThere was no immediate response from the army. The RSF's self-declared government condemned the attack as \"a horrific crime\", saying 37 people had been killed and 50 others wounded.\nDrone warfare\nGarra al-Zawaya lies near the town of Kabkabiya in North Darfur, about 150 kilometres (93 miles) west of El-Fasher, the army's last stronghold in Darfur before it was captured by the RSF in a bloody offensive last October.\nUN investigators have said violence linked to the RSF's siege and capture of El-Fasher bears \"the hallmarks of genocide\".\nFollowing its takeover of the city, the RSF, which emerged from the Janjaweed militia accused of atrocities in Darfur in the early 2000s, consolidated control over much of the region.\nSince El-Fasher campaign, both sides have increasingly relied on drone warfare. According to the United Nations, more than 1,000 civilians were killed in drone strikes during the first five months of this year.\nLast week, after losing control of a key highway linking the capital Khartoum and the city of El-Obeid, RSF commander Mohamed Hamdan Daglo released a video message in which he told his fighters to consider themselves \"unleashed\" in their war against the army.\nEl-Obeid, the largest city in the southern Kordofan region, has come under intense drone attacks in recent weeks, prompting the UN to issue a \"red alert\" over the unfolding \"catastrophe\" there, where the RSF has sought to reimpose a blockade and is feared to be preparing a ground offensive.\nThe UN has repeatedly warned that RSF advances in El-Obeid and the wider Kordofan region could lead to mass atrocities.\nThe war between Daglo and his former ally, army chief Abdel Fattah al-Burhan, has killed tens of thousands of people, displaced millions and created what the United Nations describes as the world's largest hunger and displacement crises.\nBoth sides have been accused of committing war crimes, including indiscriminate attacks on civilians, but the RSF has been particularly accused of systematic sexual violence, looting and mass atrocities.\nPublished - August 03, 2026 11:12 pm IST", "translation_ja": "", "vocab": [{"word": "paramilitary", "definition": "正規軍ではなく、軍事訓練を受けた民間組織または準軍事組織のことを指す。政府の公式な軍隊とは別に活動する武装集団を説明する際に使用される。"}, {"word": "consolidate", "definition": "権力や支配を確立し、強化することを意味する。複数の勢力や領域をまとめて、より強固な統制を確立する過程を表す。"}, {"word": "hallmarks", "definition": "特定の特徴や証拠を示す明確な兆候のこと。ある事象や行為の典型的な特性を指す際に使われる。"}, {"wor oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グルーポ・グロボ、創立100周年に向けた企画を準備", "title_en": "Grupo Globo Prepares Special Initiatives for Centennial Celebration", "summary_ja": "ブラジルの大手メディア企業グルーポ・グロボが創立100周年を記念する複数の企画を計画している。同社は歴史における重要なマイルストーンを祝うため、特別プロジェクトと記念事業を展開する予定である。", "summary_en": "Grupo Globo, one of Brazil's largest media conglomerates, is planning a series of initiatives to mark its 100-year anniversary. The company is developing special projects and commemorative activities to celebrate this significant milestone in its history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "元ガーディアン副支局長のベテランジャーナリスト、アニエティ・アクパン氏が死去", "title_en": "Veteran Journalist Anietie Akpan, Former Guardian Deputy Chief, Dies", "summary_ja": "ナイジェリア南南部のガーディアン紙の元副支局長であるベテランジャーナリスト、アニエティ・アクパン氏が死去しました。30年以上のジャーナリズム経験を持つ彼は、公務および児童人権問題の報道で高く評価され、後に独自の新聞Pillartoday.com.ngを設立しました。クロスリバー州のジャーナリスト仲間と公務員たちは、彼の献身と誠実さ、ジャーナリズムへの大きな貢献を惜しんでいます。", "summary_en": "Anietie Akpan, a veteran journalist and former deputy bureau chief of The Guardian in Nigeria's South-south region, has died at age unknown. With over three decades in journalism, he was recognized for his coverage of public affairs and child rights issues before founding his own newspaper, Pillartoday.com.ng. His death has been mourned by colleagues and officials who praised his dedication, integrity, and significant contributions to journalism in Cross River State.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/900480-former-deputy-bureau-chief-of-the-guardian-anietie-akpan-dies.html", "state_media": false, "category": "社会", "full_text": "Veteran journalist and publisher Anietie Akpan is dead.\nMr Akpan, a former deputy bureau chief of The Guardian in Nigeria’s South-south region, died on Sunday night, according to the Cross River State Council of the Nigeria Union of Journalists (NUJ).\nHe spent more than three decades in journalism, earning a reputation for his coverage of public affairs and child rights issues before leaving The Guardian to establish his own newspaper, Pillartoday.com.ng.\nIn a statement on Monday, the NUJ Cross River State Council described his death as “a monumental loss” to the journalism profession and the state.\n“The passing is a monumental loss, not only to the NUJ family but also to the media profession and Cross River State as a whole,” the statement signed by the council chairman, Archibong Bassey, said.\nThe union said Mr Akpan distinguished himself through “dedication, integrity and commitment to excellence” during a career that spanned over three decades.\nIt expressed condolences to his family and prayed for the strength to bear the loss, adding that funeral arrangements would be announced later.\nTributes\nLinus Obogo, the spokesman to Governor Bassey Otu of Cross River State, paid tribute to the late journalist in a message shared on Facebook on Monday.\n“Good night and rest peacefully in the Lord, Oga Anietie Akpan. You blazed the trail and paved the way for others to follow. The journalism profession just lost a gem,” Mr Obogo wrote.\nCareer marked by resilience\nMr Akpan was widely known in media circles in Cross River and neighbouring Akwa Ibom States for his extensive reporting career and mentorship of younger journalists.\nHe received a meritorious award from Safe Child Africa, a United Kingdom-based non-governmental organisation, in recognition of his work on child witchcraft issues in Cross River and Akwa Ibom states.\nIn what has now become one of his final published reports, titled “Marina Road Ruts Into Two,” Mr Akpan acknowledged his deteriorating health in the byline, writing: “By Anietie Akpan, from his sick bed with assistance by his wife, Imaobong, daughter Etinyene and neighbour Idongesit Otoobong.”\nREAD ALSO: Despite Cross River budgeting billions of naira for erosion control, deadly landslides expose prevention gaps\nThe story, published on 30 July, was about the recent landslide in Calabar caused by torrential rainfall.\nMr Akpan’s unusual byline reflected his determination to continue reporting despite his illness.\nHis death has drawn tributes from colleagues and public officials who described him as a respected journalist whose contributions helped shape journalism in Cross River and the South-south region.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "meritorious", "definition": "優れた業績や行為に対して与えられる栄誉または賞賛を意味する形容詞。特に専門分野での顕著な貢献や功績を表します。"}, {"word": "monumental", "definition": "非常に重要で深刻な影響を持つ、または大規模な規模のことを表す形容詞。通常は重大な損失や変化を説明するのに使用されます。"}, {"word": "tributes", "definition": "故人の成就や人格を敬意を持って述べられた言葉や表現。誰かの死後に彼らの功績や影響を認める発言のことです。"}, {"word": "resilience", "definition": "困難や逆境に直面しても回復力を持つ性質。継続的な課題に対して強さと決意を保つ能力を意味します。"}, {"word": "byline", "definition": "新聞や雑誌の記事で、著者の名前と関連情報が記載される行。記事の執筆者を明示するために使用されます。"}, {"word": "deteriorating", "definition": "状態が徐々に悪くなっていくプロセスを指す。健康や品質などが時間とともに低下することを表します。"}]}, {"title_ja": "アフリカとリーダーシップの必要性", "title_en": "Africa and the Imperatives of Leadership", "summary_ja": "トイン・ファロラ著者は、アフリカの発展課題は植民地支配の遺産だけでなく、弱い制度に根ざした根本的なリーダーシップ危機に由来すると主張しています。彼は、カリスマ的な個人リーダーを求めるのではなく、信頼できる制度を構築することが持続可能なガバナンスに必要であり、個人的権力の集中よりも制度的発展を優先したネルソン・マンデラとセレツェ・カマの例を挙げています。", "summary_en": "Author Toyin Falola argues that Africa's development challenges stem not merely from colonial legacies but from a fundamental leadership crisis rooted in weak institutions. He contends that sustainable governance requires building trustworthy institutions rather than seeking charismatic individual leaders, citing examples like Nelson Mandela and Seretse Khama who prioritized institutional development over personal power consolidation.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/900482-africa-and-the-imperatives-of-leadership-by-toyin-falola.html", "state_media": false, "category": "政治", "full_text": "Africa has had good leaders throughout its history who have been empire builders, thinkers, traders, kings, diplomats, and freedom fighters, who have established civilisations and made their impact on World history. Certainly, before the rise of the modern nation-state, Africans already had elaborated political, trading, and intellectual networks, extending from Timbuktu to Great Zimbabwe, from Benin to Axum. But even if the continent has such a rich history, there is one issue that haunts the discussions about the future of Africa: why has a continent blessed like this not managed to create institutions of prosperity and good governance?\nThe usual answers are certainly not entirely off base. Colonialism had a significant impact on the politics and economy of Africa. Outside interference, imbalanced world markets, and geopolitical competition have historically prevented the continent from developing. While all that is true, it does not tell the full story. The crucial issue is not just what history has done to Africa, but what Africa has been doing with its history up until now. It is an inescapable issue of leadership.\nLeadership is often viewed simply in terms of people and elections. Public discourse fluctuates between berating corrupt politicians and hunting for a “saviour-president,” who will steer the country towards success. This approach is a misconception of the very essence of leadership. Leadership is not just the art of governing but the process of creating institutions, gaining people’s trust and wielding power for the benefit of society. It defines how governments enhance their societies or serve themselves.\nThis is why Africa’s problem with its leadership has outlasted all transitions in politics. There have been military governments, there have been democracies with constitutions and political parties, but in many African countries, the nature of the relationship between the state and the citizen has not evolved nearly as much as the language surrounding it. Governments may have changed, but too often, their styles of governance have remained locked into old cycles of patronage and centralisation. The historical origins of this phenomenon include the legacy of colonial government, which was intended to rule over subjects and not citizens. Its institutions were oriented towards extraction and not participation, obedience and not accountability, and administration and not democracy. Political independence brought about the transfer of sovereignty, but it did not prove so easy to change the cultures of governing as it was to raise new flags. Postcolonial governments have been bequeathed bureaucracies meant to rule over citizens and not serve them.\nYet history must not serve as an alibi for failure. It informs but does not dictate destiny. Africa’s history since independence illustrates that institutions emerge from political decisions. It is governments, judges, legislatures, media, academics, civil servants, and citizens who give their countries their institutional characteristics. The continent’s future will depend less on what it inherited and more on what it will create. That is why the leadership crisis facing Africa is also institutional. For decades, many societies have sought the exceptional individual that would save the state. At each election, the belief emerges anew that some charismatic leader will root out corruption, rejuvenate economies or unify divided states. History suggests little encouragement for that belief. Countries are not made stable by having occasional exceptional leaders but by having institutions that can continue good governance after those exceptional leaders have gone away.\nHowever, power and leadership are different. The first aims at perpetuation, whereas leadership is about taking responsibility. Power requires obedience, while leadership wins the trust of the people. Power centralizes it, while leadership diffuses it via institutions that will operate independently from the founder of such institutions. It is not just a philosophical statement. This difference affects the independence of courts, the credibility of elections, the professionalism of civil servants, and the belief of people in the fact that government exists for the benefit of the citizens. The African experience provides vivid examples of that. The legacy of Nelson Mandela, the President of South Africa, is not only his governance but his ability to show the way to exercise political power wisely. Likewise, Seretse Khama managed to build institutions in Botswana that remained even after his presidency. Both leaders achieved success not because of the amount of power they had but because of their institutions. Personal governments face difficulties in surviving the political transition.\nStrong institutions need more than just constitutions; they need intellectual confidence. Any nation that continuously questions the legitimacy of its knowledge cannot be considered an institution. Discussions ", "translation_ja": "", "vocab": [{"word": "imperatives", "definition": "必要不可欠な要件または命令。ここでは、アフリカが直面する避けられない課題や要求を指します。"}, {"word": "patronage", "definition": "権力者が支持者に利益や仕事を与えるシステム。多くのアフリカ諸国で、公正な制度的管理ではなく個人的な関係に基づく統治を特徴づけています。"}, {"word": "bureaucracies", "definition": "官僚体制や行政機構。植民地統治から継承された、市民に奉仕するのではなく支配することを目的とした機関を指します。"}, {"word": "perpetuation", "definition": "何かを継続させたり、永続させたりすること。権力は自己保存を目指すのに対し、リーダーシップは責任を負うという対比で使用されています。"}, {"word": "charismatic", "definition": "個人的な魅力や説得力を持つ。指導者が腐敗を根絶するなど問題を解決すると信じられる能力を描写しています。"}, {"word": "credibility", "definition": "信頼性や信用。制度が適切に機能する際の選挙の信頼性など、ガバナンスの重要な側面を指します。"}, {"word": "diffuses", "definition": "広く分散させること。リーダーシップは権力を多くの独立した制度に分配することが特徴と述べられています。"}]}, {"title_ja": "オンド州大学講師、政府による11億ナイラ承認にもかかわらず給与支払いを待機", "title_en": "Ondo University Lecturers Await Salary Payments Despite N1.1bn Government Approval", "summary_ja": "ナイジェリアのオンド州アデクンレアジャシン大学の講師と職員は、ラッキーアイエダティワ知事が6日前に11億ナイラの支援基金を承認したにもかかわらず、給与を受け取っていない。労働組合の議長は銀行の遅延を指摘し、他の大学が採用している新しい連邦給与体系の実施に失敗した場合、さらなるストライキ行動の警告を発した。", "summary_en": "Lecturers and workers at Adekunle Ajasin University in Ondo State, Nigeria, remain unpaid despite Governor Lucky Aiyedatiwa approving N1.1 billion in intervention funds six days ago. The union chair cited banking delays and warned of further strike action if the state fails to implement a new federal salary structure already adopted by other universities.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/900477-strike-ondo-varsity-lecturers-yet-to-receive-payments-despite-n1-1bn-approval-by-gov.html", "state_media": false, "category": "政治", "full_text": "Workers and lecturers at Adekunle Ajasin University, Akungba Akoko (AAUA), Ondo State, have yet to receive payment of their outstanding salaries despite the N1.1 billion that Governor Lucky Aiyedatiwa approved for the institution about six days ago.\nThe Chairperson of the AAUA chapter of the Academic Staff Union of Universities (ASUU), Bolu Oshodi, disclosed this to journalists in Akure, the state capital, on Monday.\nThe union embarked on a strike action on 10 July to demand the payment of salaries.\nThe funds, dubbed the intervention fund, were meant to settle the backlog of workers’ salaries and other expenditures of the institution.\nMr Oshodi said the union has yet to receive payment alerts from the banks, despite information that the government had released the funds.\n“As we speak now, the latest information is that the government has released the money to the university, but the university is still waiting for the money to drop into its account.\n“They said the problem is with the bank, but as far as we are concerned, what our members are waiting for is the alert. As we speak, we are yet to receive any alert.\n“It is not just lecturers this time around, it is all the staff of the university, both lecturers and non-academic staff.”\nThe chairperson expressed concern over the recurring funding crisis at the institution, noting that even if the immediate salary arrears are resolved, the institution could face a deeper crisis.\nHe revealed that the monthly subvention of N223 million released for July is grossly inadequate to cover the university’s wage bill of N550 million.\n“If N223 million has been released again for July, how will the university get over N300 million to augment it? Without any prejudice, by all indications, if we are already due to receive July salary, as we speak now, we are being owed three months’ salary,” Mr Oshodi stated.\nHe further noted that the situation had been compounded by the state government’s failure to implement the new salary structure for university lecturers agreed upon between the federal government and ASUU in December 2025.\nAccording to him, federal universities and several state universities, including EKSU, BOUESTI, UNIOSUN, LAUTECH, and KWASU, have implemented the new salary structure, while Ondo State has yet to follow suit.\nHe warned that the union is prepared to take further action if the government fails to implement the new salary structure, saying, “Our members can no longer continue to hope. All the state universities around us have started enjoying this new salary structure. We are just surprised why Ondo State has not implemented it.”\nHe added, “With the way things are, the AAUA ASUU branch is ready to embark on another action if the new salary structure is not implemented immediately. Beyond the issue of two or three months’ salary, there is a bigger issue ahead.”\nMr Oshodi disclosed that the university had not received any capital grant for infrastructure from the Ondo State Government in the past eight years.\nREAD ALSO: Strike: Ondo gov approves ₦1.1bn for varsity, urges lecturers to return to work\n“The university has not received the money that is meant for infrastructure, which is known as a capital grant annually in the last eight years, not a single kobo from the state government,” he said.\n“It is really a difficult situation; our members are groaning, frustrated and frustration can make anybody do anything but in academics, we are still trying to hold on. But the way things are now, when our members look around, all the universities around have started enjoying the new salary structure.”\nResponding, the Chief Secretary to the Governor, Ebenezer Adeniyan, said the workers would receive their pay before the end of the week.\n“Approvals don’t become alerts in two days. Financial transactions of government go through a laid-down process. They should be able to receive their payments this week,” Mr Adeniyan stated.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "intervention fund", "definition": "政府が特定の問題を解決するために緊急に拠出する資金のこと。ここでは給与滞納を解決するための臨時的な資金を指す。"}, {"word": "subvention", "definition": "政府や公的機関から提供される補助金や経常費のこと。大学など公的機関の運営経費として支給される資金。"}, {"word": "arrears", "definition": "支払い期限を過ぎた未払い金や滞納金のこと。給与やローンなどで過去に遡って支払うべき金額を指す。"}, {"word": "augment", "definition": "何かを増やしたり補ったりすることを意味する動詞。ここでは不足している資金を上乗せして増やすという意味で使われている。"}, {"word": "capital grant", "definition": "インフラストラクチャーや設備投資など、資本的支出のために政府から交付される補助金のこと。"}, {"word": "laid-down process", "definition": "事前に定められた、確立された手続きやプロセスのこと。政府の財務手続きなど、決められた順序に従う必要がある。"}]}, {"title_ja": "セウタ移民危機、モロッコの若者の経済的絶望を露呈", "title_en": "Ceuta Migration Crisis Reveals Economic Despair Among Morocco's Youth", "summary_ja": "スペイン飛び地セウタへ押し寄せるモロッコ人移民の急増は、モロッコの若者が直面する経済的困難を浮き彫りにしている。移民たちは、仕事の見通しの悪さと経済的絶望感が国境を越えた危険な移動を促したと述べている。この危機は、モロッコの若い世代を悩ます深刻な経済的課題を強調している。", "summary_en": "A surge of Moroccan migrants crossing into the Spanish enclave of Ceuta has shed light on the economic hardships facing young people in Morocco. Migrants describe their bleak job prospects and financial desperation as the primary drivers behind their dangerous journey across the border. The crisis underscores the deep economic challenges plaguing Morocco's younger generation.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/03/world/middleeast/morocco-ceuta-spain-migrants.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領がホルムズ海峡交渉の進展を主張、イランは現在の米国との交渉を否定", "title_en": "Iran Denies Current U.S. Talks After Trump Claims Progress on Hormuz Strait", "summary_ja": "トランプ大統領は週末にイランへの軍事攻撃の脅威をキャンセルする際に、交渉の進展を挙げた。しかし、イランはこの主張に矛盾し、米国との現在の交渉は存在しないと述べた。両国の相反する声明は、米国とイラン間の外交関与に関する緊張と誤解を浮き彫りにしている。", "summary_en": "President Trump cited progress in negotiations when canceling a threatened military attack on Iran over the weekend. However, Iran contradicted this statement, claiming there are no current talks occurring between the two nations. The conflicting statements underscore the tensions and miscommunications between the U.S. and Iran regarding diplomatic engagement.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/03/world/middleeast/iran-talks-us-oman-strait-hormuz-trump.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ恩赦後、ホンジュラス前大統領エルナンデス氏が母国で訴追される", "title_en": "After Trump Pardon, Former Honduras President Hernández Faces Domestic Charges", "summary_ja": "ホンジュラス前大統領ファン・オルランド・エルナンデス氏は、トランプ前大統領による恩赦で米国での麻薬密売有罪判決が覆された後、母国で詐欺とマネーロンダリングの罪で訴追されることになった。大統領任期最終日に与えられた恩赦は、ホンジュラス当局による訴追から同氏を守ることができなかった。同氏は複数の法的リスクに直面し続けている。", "summary_en": "Juan Orlando Hernández, former president of Honduras, now faces fraud and money laundering charges in his home country following a Trump pardon that overturned his drug-trafficking conviction in the United States. The pardon, granted in the final days of Trump's presidency, has not shielded Hernández from prosecution by Honduran authorities. He remains vulnerable to significant legal jeopardy on multiple fronts.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/03/world/americas/juan-orlando-hernandez-trump-honduras.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事地帯の通過を許可、パレスチナ人がガザ北部に戻る", "title_en": "Palestinians Return to Northern Gaza After Israeli Military Checkpoint Opens", "summary_ja": "イスラエルは人質解放交渉の行き詰まりが解決した後、ガザを二分する軍事地帯の通過をパレスチナ難民に許可した。この通過は長期の膠着状態の後の大きな転換を示し、住民が徒歩でガザ北部への帰還を開始することが可能になった。", "summary_en": "Israel has permitted displaced Palestinians to cross a military zone dividing Gaza following a breakthrough in hostage release negotiations. The crossing marks a significant shift after a prolonged deadlock, allowing residents to begin returning to the northern part of the enclave on foot.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "Leading China Property Developer Reports Huge Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国の大手不動産開発企業ヴァンケが巨額の損失を報告し、国内不動産部門の深刻化を示している。同社の経営危機は業界全体への波及懸念を高めている。中国政府が市場安定化のために介入するかどうかが注目されている。", "summary_en": "Vanke, a major Chinese property developer, has reported significant losses, signaling deeper troubles in the country's real estate sector. The company's financial struggles raise concerns about whether the crisis will spread further across the industry. Questions remain about potential government intervention to stabilize the troubled market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による砲弾片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From October 7 Attack", "summary_ja": "イスラエルの医療当局者によると、解放されたイスラエル人人質は8ヶ月間のトンネル内での拘禁後も、10月7日の攻撃による砲弾片を体内に保持していた。一部の女性は拘禁期間中、長期間の隔離状態に置かれていた。この発見は、長期拘禁中に人質が被った深刻な身体的外傷を浮き彫りにしている。", "summary_en": "Released Israeli hostages retained shrapnel wounds from the October 7 attack in their bodies after eight months of captivity in tunnels, according to Israeli medical officials. Some of the women were held in isolation for extended periods during their detention. The discovery highlights the severe physical trauma endured by hostages during their prolonged captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "38トンの装甲兵員輸送車の内部", "title_en": "Inside a 38-tonne Armoured Infantry Fighting Vehicle", "summary_ja": "エコノミスト誌の国際編集者ジョナサン・ローゼンタールが、最新の歩兵戦闘車の性能を直接体験する。本記事では、この重装甲軍事車両の設計、機能、運用上の特性を探索している。", "summary_en": "The Economist's international editor Jonathan Rosenthal experiences firsthand the capabilities of a modern infantry fighting vehicle. The piece explores the design, functionality, and operational features of this heavily armoured military machine.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/03/the-war-room-newsletter-inside-a-38-tonne-armoured-beast", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "戦争室: 歴史上最も重要な包囲戦", "title_en": "The War Room: History's Most Significant Sieges", "summary_ja": "エコノミスト誌は、歴史を通じて行われた重要な包囲戦がいかにして軍事キャンペーン全体の結果を決定し、文明の運命を形作ったかを探索しています。シニアエディターのリチャード・コケットが、これらの軍事作戦の戦略的重要性と世界的事象への長期的な影響を検証しています。", "summary_en": "The Economist explores how pivotal sieges throughout history have determined the outcome of entire campaigns and shaped the fate of civilisations. Senior editor Richard Cockett examines the strategic importance of these military engagements and their lasting impact on world events.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/31/the-war-room-newsletter-the-most-significant-sieges-in-history", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "レストラン業界は急速に変革している", "title_en": "The Restaurant Business is Transforming Rapidly", "summary_ja": "テクノロジーの進化、インフレ圧力、消費者の嗜好の変化により、レストラン業界は未曾有の変革を遂行している。これらの相互に関連した要因は、スタッフ配置、サプライチェーンから顧客体験、ビジネスモデルまで、レストラン経営のあり方を再形成している。業界は急速な環境変化の中で生き残るために素早く適応する必要がある。", "summary_en": "The restaurant industry is undergoing unprecedented changes driven by technological advancement, inflationary pressures, and evolving consumer preferences. These interconnected forces are reshaping how restaurants operate, from staffing and supply chains to customer experience and business models. The sector must adapt quickly to survive in this new landscape.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/30/the-restaurant-business-is-changing-beyond-recognition", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "南西フランスの大規模火災：初期対応の管理巡り疑問の声", "title_en": "Southwest France Megafire: Residents Demand Inquiry Into Crisis Response", "summary_ja": "ジロンド県で4万2000ヘクタールを焼いた大規模火災は土曜日から鎮火されているが、被災地の住民は当局の対応を追及するよう要求している。約1000人の住民が火災の初期段階での対応に関する訴状を提出したいと望んでおり、危機管理に関する疑問が生じている。", "summary_en": "A massive wildfire that burned 42,000 hectares in the Gironde department has been controlled since Saturday, but residents of affected areas are demanding accountability. Nearly 1,000 residents want to file a complaint over the handling of the fire's critical early hours, raising questions about crisis management.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/environment/article/2026/08/03/fires-in-southwest-france-questions-raised-over-management-of-blaze-s-first-hours_6756122_114.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "メローニ首相、2023年の欧州連帯を受けながらスペインの孤立化を狙う", "title_en": "Meloni Seeks European Leadership on Migration Despite Past Solidarity", "summary_ja": "イタリアの極右首相ジョルジャ・メローニは、アイデンティティ政治が支配する選挙キャンペーンを前に、移民政策におけるヨーロッパの指導者として自らを位置づけようとしている。2023年にランペドゥーサを含むイタリアが移民危機で欧州連帯から恩恵を受けたこととは対照的である。メローニの戦略はスペインの移民対応への孤立化を狙ったものである。", "summary_en": "Italian Prime Minister Giorgia Meloni is positioning herself as a European leader on migration policy ahead of upcoming elections dominated by identity politics. This represents a shift from 2023 when Italy, particularly Lampedusa, benefited from European solidarity during the migration crisis. Meloni's strategy aims to isolate Spain's approach to immigration issues.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/03/meloni-who-benefited-from-european-solidarity-in-lampedusa-in-2023-seeks-to-isolate-spain_6756110_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス、移民対策での英国海軍使用計画を批判", "title_en": "France Criticizes UK Plan to Use Navy Against Channel Migrants", "summary_ja": "英国の右派政党指導者がイギリス海軍をチャネルに展開し、小型ボートをフランスに戻す計画を提案した。フランス内務省はこの計画をフランスの主権と国際海事法違反だと非難している。", "summary_en": "A UK hard-right party leader has proposed deploying the Royal Navy to intercept small boats in the Channel and return them to France. The French interior ministry condemned the plan as a violation of French sovereignty and international maritime law.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/08/03/france-blasts-uk-hard-right-plan-to-use-navy-to-stop-channel-migrants_6756127_7.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省ニュースレター更新", "title_en": "Mindef Newsletter Update", "summary_ja": "国防省がニュースレター更新をリリースしました。読者は海峡タイムズからより多くの無料ニュースレターにサインアップできます。既存の購読者向けに購読管理オプションが利用可能です。", "summary_en": "The Ministry of Defence has released a newsletter update. Readers can sign up for more free newsletters from The Straits Times. Subscription management options are available for existing subscribers.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニングアップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニングアップデートニュースレターは、毎日のニュースハイライトと重要な記事を提供しています。読者は購読を管理し、ストレーツ・タイムズからの追加の無料ニュースレターを利用できます。", "summary_en": "The Straits Times Evening Update newsletter provides daily news highlights and important stories. Readers can manage their subscriptions and explore additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズが購読者向けの毎日のモーニングニュースアップデートを配信しています。本ブリーフィングは、その日の重要なニュースカバレッジと情報を提供します。", "summary_en": "The Straits Times delivers daily morning news updates to subscribers. This briefing provides essential news coverage and information for the day ahead.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルのエルビット社がアラブ首長国連邦に武器を供給していたことが文書で明らかに", "title_en": "Documents Reveal How Israel's Elbit Armed the United Arab Emirates", "summary_ja": "イスラエルの大手防衛企業エルビット・システムズがアラブ首長国連邦に武器や軍事装備を供給していたことが、新たに公開された文書から明らかになった。この開示は、武器移譲協定とイスラエルの防衛産業が中東地域で構築する関係について疑問を投げかけている。", "summary_en": "Newly revealed documents show that Israel's Elbit Systems, a major defense contractor, supplied weapons and military equipment to the United Arab Emirates. The disclosure raises questions about arms transfer agreements and Israel's defense industry relationships in the Middle East.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxQS2t6YTFodzQ4blo3SHNSa0NtcnNuWldSYUNNYjdXSXJ6a1gyM1ZzS1B2NWRqdHJ6aGVvNDc0eFRWdFBtUzFjUnRtTl9kRXNuXzlsRXhpVTVwdW9obXhGcUU1UnZGYlJsOHk2T0tGc0Q2dzdqWjdURnlMS2Nzc0Z5REdTQ0pqVWE3UnBVX296RUxoSWhiVHh6bzg1RUhwYnNXekRUZmRBYXM3REFhemdqNWFUMFV2cDZQQV8teHZkTU95VTRqZzhaOHNHT2R5U2xSVHRrTjN6YTF3clU5Q05sQUc0NnNHOTViOUJ5cTBJZmMzLUI0WUlmU1BsR3NqcTNwenEteS1MZkg5RVU?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防大臣がIDF西岸地区司令官をテレビ生放送で解任、陸軍参謀総長に事前通知なし", "title_en": "Defense Minister Fires IDF West Bank Commander Live on Air", "summary_ja": "イスラエルの国防大臣は、陸軍参謀総長への事前通知なしにテレビ生放送中にIDFの西岸地区司令官を解任した。この予期しない公開解任は、イスラエルの防衛部門における軍の指揮命令系統と意思決定プロセスについての疑問を招いた。", "summary_en": "Israel's Defense Minister dismissed the IDF's West Bank commander during a live broadcast without prior notification to the Army Chief of Staff. The unexpected public firing raised questions about military chain of command and decision-making protocols within Israel's defense establishment.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijwJBVV95cUxQTWRGMmhIakpTaU9Md193RkliYktRZGppbmptSFNCS0J1c0tPbE03WVJzdWYtanFKXzFGbmZtXzhOdkpnOWFCMUJKYzFNcDFpYzZCYktXU2x4cGlCWlVGSXAwbkhNWmN4TzFza19OZWUtekhCS0g5ZDYxbjM3M2JhZmxjQVdZVXNyS2JMb09sWEM2b0lYaWY3QWFQSVI1UnhqOTlZaU5sMzFDOXRFQmQteDdUMDJ1VWhsU3R1dnFQNDlfSk43STBuempxRWRkUEYyVXEweW5xWkhxSlBzamRORUwwRDgycl9xbF9md2p0Wm5jb0xxbE1BMzJ0N3FLN3d6ZTJrcElfMk9MUkEtRDEw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハレディムは世俗的なユダヤ人より道徳的だと主張", "title_en": "Haredim Claimed to Be More Moral Than Secular Jews", "summary_ja": "ハレディ（超正統派ユダヤ人）コミュニティが世俗的なユダヤ人と比べてより高い道徳性を示しているという主張がある。この指摘は、イスラエル社会における異なるユダヤ人コミュニティ間の価値観と倫理基準に関する文化的および宗教的対立を反映している。", "summary_en": "A statement claims that Haredi (ultra-Orthodox Jewish) communities demonstrate greater morality compared to secular Jews. The assertion reflects ongoing cultural and religious tensions within Israeli society regarding values and ethical standards between different Jewish communities.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi-AFBVV95cUxNc0hWTDZwM09JTHhuRjZOcjZJd2xGb3NMRTgzak1Rejd3bUk1YTI3ODFSM1pNSXV4MjdXZ1JNZjRSblNFYTlGRGJlQ29SaW9vMTB3T0U1NHlYNFlVYzRWQUNqUWluZWJpYzVDNVN2Q1pMMk1iOHVnM1FqakVDXzMzN3poUGxQbE1FZHRvbm9SeVVqdFBXVy1QZWt4ZWs0b056NXBsM09PVnpOM3FLeDZWaW1mUTVwWUlKQWJNLVZxVVBQdWFLcUEybVNoRF9SOFR1eGxtOXJqNjhDOVktS2dKYWE0Z0RGWS1VNk9nX1AtOHE3d0IyYmRYZA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の2026年防衛演習「漢光」：米式戦術、新型戦車、予備役拡大を強化", "title_en": "Taiwan's 2026 Defense Drill to Feature U.S. Methods, New Tanks, and Reserve Forces", "summary_ja": "台湾の漢光2026年防衛演習は、米国式の軍事手法を導入し、新型戦車と拡大された予備役部隊を展開する予定です。この演習は潜在的な脅威に対する台湾の防衛能力を強化することを目的としています。演習は台湾の軍事作戦の近代化と態勢整備への取り組みを示しています。", "summary_en": "Taiwan's Han Kuang 2026 defense exercise will incorporate U.S.-style military methods and showcase newly acquired tanks and expanded reserve forces. The drill aims to strengthen Taiwan's defensive capabilities against potential threats. The exercise represents Taiwan's commitment to modernizing its military operations and preparedness.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1nR2xDb1RCaTgzUEFFRGxXMjFsYkFPV1MyLWFGMlFuekRIWEFJZl95T1NqZHBOT1ZYdWdXbG9zVDAzU3ItQW1rQjZwNVJ2UHZPbjZVSHZhaw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台風ドルフィンが来週台湾北部に大雨をもたらす可能性：気象庁", "title_en": "Typhoon Dolphin Expected to Bring Heavy Rain to Northern Taiwan Next Week", "summary_ja": "中央気象局は、台風ドルフィンが来週台湾に接近し、北部地域で大雨をもたらす可能性があると警告しています。影響を受ける地域の住民は、悪天候や洪水の可能性に備える必要があります。", "summary_en": "Typhoon Dolphin is forecast to approach Taiwan next week, with the Central Weather Administration warning of potential heavy rainfall in northern regions. Residents in affected areas should prepare for adverse weather conditions and possible flooding.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1MNDNUU0RVOG5xMkttZDJtQnNTWXpsVFQwWUJEYUd1Ukc2MU4zSXJPOVVDZktvMlA1SFlQXzFickdJYVNhNWEzejY0NEQ2LWF0WXJkNjFR?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、台湾管轄海域での中国パトロールを「不安定化させる」と非難", "title_en": "U.S. Calls China's Patrols in Taiwan-Managed Waters 'Destabilizing'", "summary_ja": "米国は、台湾が管理する海域における中国の軍事パトロール活動を地域の不安定化要因として批判した。この声明は、台湾周辺における中国の軍事プレゼンスの増加に対する米国の懸念の高まりを反映している。ワシントンは台湾海峡の平和と安定を維持するという約束を改めて表明している。", "summary_en": "The United States has criticized China's military patrols in waters administered by Taiwan as destabilizing activities in the region. The statement reflects growing U.S. concern over increased Chinese military presence near Taiwan. Washington has reiterated its commitment to maintaining peace and stability across the Taiwan Strait.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBvZmFUSDVGczNzblNvTmVjMUZ3d2xrOEFNdnhrZW00andYSDFFYW4tcGZOMGg4RjRzY3F1T0dIdGczaHJmUUpUakpIaldTNDhYamVtOVlfZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、イランへの攻撃延期を表明", "title_en": "Trump Says US to Hold Off Attacks on Iran", "summary_ja": "CGTNが報じたところによると、米国のドナルド・トランプ大統領は土曜日、イランへの新たな攻撃を控えることに同意したと述べた。この発表は、両国間のエスカレーション修辞学における転換を示すものである。CGTNは、トランプ大統領がイランとの継続的な緊張に関する声明を出したと述べている。", "summary_en": "CGTN reports that US President Donald Trump stated on Saturday that he has agreed to hold off fresh attacks against Iran. The announcement marks a shift in escalation rhetoric between the two countries. CGTN notes that Trump made the statement regarding the ongoing tensions with Iran.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-02/news-1Ph3KHhmY8w/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハマスがガザ停戦ロードマップを支持、課題は依然として残存", "title_en": "Hamas Backs Gaza Ceasefire Roadmap Despite Ongoing Challenges", "summary_ja": "CGTNの報道によると、ハマスはガザ停戦合意の第2段階実施を目指したロードマップの最新草案を承認し、2年半以上続く紛争の後、交渉における潜在的な転機となる可能性を示している。報告書は進展を示す一方で、実施過程における課題の継続を指摘している。この承認は、飛び地における長期的な人道危機の解決に向けた重要な一歩を示すものである。", "summary_en": "CGTN reports that Hamas has approved the latest draft of a roadmap for implementing the second phase of a Gaza ceasefire agreement, potentially marking a breakthrough after over two and a half years of conflict. The development suggests progress in negotiations, though the report indicates that challenges persist in the implementation process. The approval represents a significant step toward resolving the prolonged humanitarian crisis in the enclave.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-01/Challenges-persist-despite-Hamas-backing-Gaza-ceasefire-roadmap-1PfmDv8ZTUs/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "日本が新しい情報機関を設立、軍事力強化への懸念が高まる", "title_en": "Japan launches new intelligence body amid military buildup concerns", "summary_ja": "CGTNは、日本が新しい国家情報機関を設立し、長距離巡航ミサイルの初試験発射を実施したと報じている。同メディアはこれらの動きを日本の加速する軍事力強化の一部と位置付けており、安全保障上の懸念を引き起こしている。CGTNはこれらの展開を国家安全保障機構拡大の潜在的に危険なステップと表現している。", "summary_en": "CGTN reports that Japan has established a new national intelligence agency and conducted its first test launch of a long-range cruise missile. The state-controlled outlet characterizes these moves as part of Japan's accelerating military strengthening, which has sparked security concerns. CGTN frames these developments as potentially dangerous steps to expand the country's security apparatus.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-07-31/Japan-officially-launches-new-intelligence-body-Why-is-it-dangerous--1PdPlb5zuOk/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア外務省、西側の「成熟した対応」があれば対ウクライナ交渉に応じる用意があると表明", "title_en": "Russia Ready for Ukraine Negotiations With 'Mature Approach' From West: MFA", "summary_ja": "TASSの報道によると、ロシア外務省はロシアが西側が「成熟した対応」を示せばウクライナ問題の交渉に応じる準備があると述べた。ミハイル・ガルージン報道官はロシアがその意思を「繰り返し示してきた」と主張している。この発言はウクライナ紛争をめぐるロシアと西側諸国の継続的な外交的緊張の中で出されたものである。", "summary_en": "TASS reports that Russia's Foreign Ministry stated Moscow is prepared for negotiations on Ukraine if the West adopts a 'mature approach.' Ministry spokesperson Mikhail Galuzin claimed Russia has 'repeatedly demonstrated' its willingness to engage in talks. The statement comes amid ongoing diplomatic tensions between Russia and Western nations over the Ukraine conflict.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2168603", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カタール、エジプト、トルコがガザでのイスラエルの停戦違反を非難", "title_en": "Qatar, Egypt, Turkey condemn Israel's ceasefire violations in Gaza", "summary_ja": "TASSが報じたところによると、カタール、エジプト、トルコはガザにおけるイスラエルの停戦違反の疑いを非難した。仲介国らは特に医療施設および医療インフラの標的化を批判し、TASSはこれが民間人の死傷者をもたらしたと報じている。", "summary_en": "TASS reports that Qatar, Egypt, and Turkey have condemned what they describe as Israeli ceasefire violations in Gaza. The mediators particularly criticized the targeting of healthcare facilities and medical infrastructure, which TASS reports has resulted in civilian casualties.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2168599", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ベルゴロド近郊でウクライナドローンが車を攻撃、1人死亡2人負傷", "title_en": "Ukrainian drone strikes car near Belgorod, killing one and wounding two", "summary_ja": "タス通信によると、ウクライナのドローンがベルゴロド近郊のオクチャブリスキー集落で車両を攻撃し、1人が死亡、2人が負傷したと報じられている。事件はロシアの西部国境地域で発生した。ロシア国営メディアはこの攻撃をウクライナ軍による行為と報道している。", "summary_en": "TASS reports that a Ukrainian drone struck a vehicle in the settlement of Oktyabrsky near Belgorod, resulting in one death and two injuries. The incident occurred in Russia's western border region. State-controlled Russian media attributed the attack to Ukrainian forces.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2168593", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米中G2がアジア安全保障にもたらす意味", "title_en": "What a Sino-American G2 Would Mean for Asian Security", "summary_ja": "著者は、トランプが提案する米中G2（二大国体制）概念は本来的に不安定であり、アジアの一極化を招く危険性があると主張している。代わりに日本は、インドを重要なパートナーとする「自由で開かれたインド太平洋」枠組みがより効果的であると主張している。", "summary_en": "The author argues that Trump's proposed G2 (two-power) concept between the US and China is inherently unstable and risks creating a unipolar Asia. Instead, Japan advocates for the more effective 'free and open Indo-Pacific' framework with India as a key partner to maintain regional balance and security.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trump-g2-concept-is-far-inferior-to-the-free-and-open-indo-pacific-vision-by-brahma-chellaney-2026-07", "state_media": false, "category": "オピニオン", "full_text": "What a Sino-American G2 Would Mean for Asian Security\n                        The G2 concept that Donald Trump has lately been touting is a highly unstable proposition, which could make the emergence of a unipolar Asia more likely. Fortunately, Japan remains committed to advancing the far more effective “free and open Indo-Pacific” framework, with India as an indispensable partner.\n                    \n                        TOKYO—Grand foreign-policy strategies rarely disappear overnight. More often, they are dismantled gradually through subtle rhetorical shifts, bureaucratic adjustments, and changing diplomatic priorities. America’s Indo-Pacific strategy is no exception.\n        https://prosyn.org/Y7ziLr4", "translation_ja": "", "vocab": [{"word": "unipolar", "definition": "一つの大国によって支配される国際秩序を意味する。多極体制の対義語で、一国の支配が強く他国の自律性が制限される状況を指す。"}, {"word": "dismantled", "definition": "戦略や制度などを段階的に解体・廃止することを意味する。ここでは段階的な修正を通じた政策の実質的な転換を指す。"}, {"word": "rhetorical", "definition": "言葉遣いや表現方法に関する。政策の実質的変化ではなく、公式声明や表現方法の変化を示唆する。"}, {"word": "indispensable", "definition": "なくてはならない、不可欠な存在を意味する。戦略や協力において重要な役割を果たす国やパートナーを指す。"}, {"word": "proposition", "definition": "提案や計画のこと。ここではトランプのG2構想という政治的提案の実現可能性を評価している。"}]}, {"title_ja": "通貨障壁を取り払う", "title_en": "Tearing Down the Currency Wall", "summary_ja": "著者ジャヤント・シンハは、途上国への世界的な気候金融が失敗する理由は、プロジェクト品質の低さではなく、通貨リスクとヘッジコストが硬い通貨資本をローカル入札で競争不可能にする構造的障壁にあると主張しています。彼は3つの解決策を提案しています：年金基金と政府系ファンドを通じた長期国内資本の動員、ブラジルのエコ・インベスト・ブラジルのようなメカニズムによる通貨リスクの直接的な対処、そして社会的価値が資金調達コストを上回るプロジェクトへのグローバル資本フローの確保です。", "summary_en": "Author Jayant Sinha argues that global climate finance fails to reach developing economies not due to poor project quality, but because currency risk and hedging costs create a structural barrier that makes hard-currency capital uncompetitive in local auctions. He proposes three solutions: mobilizing long-duration domestic equity through pension funds and sovereign wealth funds, directly tackling currency risk through mechanisms like Brazil's Eco Invest Brasil, and ensuring global capital flows to projects where social value exceeds financing costs.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/structure-of-price-formation-prevents-global-capital-from-reaching-emde-climate-projects-by-jayant-sinha-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Tearing Down the Currency Wall\nJayant Sinha\nNEW DELHI—The world possesses an enormous stock of long-term savings, and the Global South boasts a robust pipeline of commercially sound climate projects. But the channel connecting them is blocked by what amounts to a currency wall.\nStandard explanations for global capital’s failure to reach developing-economy climate projects emphasize poor project quality, weak institutions, and political risk. But solar parks in India, wind programs in South Africa, and electric-bus fleets in Latin America deploy proven technologies through competitive procurement and reward their domestic investors. The real barrier lies in the structure of price formation.\nAccording to the Independent High-Level Expert Group on Climate Finance, emerging-market and developing economies (EMDEs, excluding China) will have to invest some $2.4 trillion annually in climate action by 2030. Domestic savings cannot meet this target, given the need to finance other priorities, such as housing, factories, highways, and data centers. This is as true for India, which saves about 32% of GDP, as it is for countries with smaller savings pools, such as Mexico, Nigeria, and South Africa. The same expert group estimates that roughly $1 trillion of the annual total must come from external finance.\nBecause climate infrastructure does not have a unified global market, prices are set on a project-by-project basis, through auctions, regulated tariffs, and long-term concessions. In EMDEs like India, the domestic capital pool is deep enough to price the market, but too shallow to finance the transition. While the marginal investor is domestic, the missing investor is global.\nThis mismatch creates costs. In a solar auction, for example, the clearing tariff is set according to the cost of equity in the local currency—the same currency in which investors’ returns are denominated. An investor accountable in dollars must then convert their rupee, rand, or rupiah cash flows. Expected depreciation and volatility, or hedging costs, can add 5–6 percentage points to the required equity return.\nThis wedge often outstrips the true risk: in many markets, hedging costs have persistently exceeded realized depreciation by some two percentage points annually. With a 2:1 debt-to-equity ratio, the weighted average cost of capital rises by 1–2 percentage points. Since financing and construction dominate the lifetime cost of renewables, hard-currency capital often cannot compete in auctions priced by locally funded investors. For global funds that have participated anyway, 15-18% gross rupee returns have been reduced to just 8-9% returns in dollars—well below what international investors require.\nPS Deep Dive: Oligarchy\nA collection of PS commentaries examining how a few individuals amassed unprecedented wealth—and how they are using it to dismantle democracy. Featuring insights from Cristina Enache, Brooke Harrington, James Livingston, Michael Madowitz, Ann Pettifor, Matt Simonton, and Quinn Slobodian.\nSubscribe and save 30%\nAfter a locally funded developer wins an auction, the discovered price hardens into a benchmark: no distribution company can pay more for power, and no municipality more for electric buses, than the last tender established. Regulators then face political pressure to match this price, and aggressive bids from thinly capitalized developers push the benchmark lower still.\nBut the aggregate project pipeline can far exceed the domestic financial system’s capacity to supply long-duration equity and debt. The adjustment then comes mainly through delays and underinvestment, rather than price increases, which would draw in global capital. The result is low project prices, insufficient capital, and inadequate climate investment.\nWhile this is privately rational, it is globally suboptimal. Since nearly all emissions growth in the coming decades will come from developing economies, every gigawatt of renewable energy not built in these countries carries costs for everyone. More expensive global capital is worth tapping when a project’s social value exceeds the extra financing cost. The Global North should view the provision of such funding as risk-sharing, rather than aid, with investors bearing the costs of currency depreciation.\nMeanwhile, three steps can go a long way toward dismantling the currency wall. The first is to mobilize long-duration domestic equity in EMDEs, with regulators enabling pension funds and insurers to allocate substantially more capital to professionally managed infrastructure investment vehicles. National investment funds along the lines of Singapore’s state-owned investment firm Temasek and sovereign wealth fund GIC can anchor projects and crowd in private co-investors.\nThe second step is to tackle currency risk directly, as Brazil has done. Eco Invest Brasil, launched in 2024 in partnership with the Inter-American Development Bank, combines blended-finance auctions, foreign-exchange liquidity lines, ", "translation_ja": "", "vocab": [{"word": "wedge", "definition": "2つのグループ、概念、または価値の間に生じる分裂や隔たり。ここではヘッジコストがもたらす予想リターンと実際のリターンの間の差を指す。"}, {"word": "clearing tariff", "definition": "オークションで需要と供給が一致する価格。この価格以下では供給者は応札せず、この価格以上では需要者は購入しない均衡点を示す。"}, {"word": "blended finance", "definition": "公的資金と民間資金を組み合わせて、高リスク・低リターン案件への投資を促進する融資手法。開発途上国のインフラ投資に用いられることが多い。"}, {"word": "suboptimal", "definition": "最適な状態より劣っている、または望ましくない結果をもたらす状態。個々の合理性は保つが全体的には効率が悪い場合に使用される。"}, {"word": "hedging", "definition": "将来のリスク（特に為替変動）に対して事前に対策を講じ、損失を防ぐ金融手法。追加的なコストが発生する可能性がある。"}, {"word": "pipeline", "definition": "開発・実現される準備が整った案件やプロジェクトの一連の流れ。ここでは実施待ちの気候関連プロジェクトを指す。"}, {"word": "aggregate", "definition": "個別の要素を合算した全体的な量または総計。ここでは全プロジェクト群を総体として捉えることを意味する。"}]}, {"title_ja": "「事業展開地税務制度」の導入を求める提言", "title_en": "The Case for a Pay-Where-You-Play Tax System", "summary_ja": "著者ジャヤティ・ゴッシュは、多国籍企業がタックスヘイブンに利益を計上できる現在の国際税務制度を、企業が実際に事業を展開している地域で課税する「事業展開地課税制度」に置き換えることを主張しています。研究によると、この改革により年間5000億ドルの追加法人税収を生み出す可能性があり、開発途上国にとって革新的な利益をもたらす一方で、先進国にも多大な利益をもたらします。", "summary_en": "Author Jayati Ghosh argues for replacing the current international tax system that allows multinational corporations to declare profits in tax havens with a 'pay-where-you-play' framework that taxes companies where they actually operate. Research suggests this reform could generate an additional $500 billion in annual corporate tax revenue globally, with transformative benefits for developing nations while also providing substantial gains for wealthy economies.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/un-tax-convention-opportunity-to-end-age-of-corporate-profit-shifting-by-jayati-ghosh-2026-07", "state_media": false, "category": "オピニオン", "full_text": "The Case for a Pay-Where-You-Play Tax System\nJayati Ghosh\nNEW DELHI—This week, delegates from around the world will gather in New York to negotiate the proposed United Nations Framework Convention on International Tax Cooperation, a landmark agreement aimed at making global tax cooperation more inclusive and effective. If adopted, the Convention would represent the most consequential overhaul of the global tax system in nearly a century, fundamentally changing how countries tax multinational corporations and, potentially, the world’s wealthiest individuals.\nNew research by the global union federation Public Services International (PSI) and the Tax Justice Network underscores the urgent need to reform the international tax system. Drawing on publicly available country-by-country reporting data, it estimates that governments could collect an additional $500 billion in corporate tax each year by replacing today’s “pay-where-you-say” system with a “pay-where-you-play” approach.\nThe current system is the product of century-old rules that are no longer fit for purpose. By allowing governments to tax multinational corporations where they declare their profits rather than where they generate them, it rewards companies for shifting taxable income into tax havens before reporting it.\nIn 2012, the G20 tasked the OECD with aligning where profits are reported with where companies actually operate. That effort failed, and profit shifting has only intensified. According to the PSI/Tax Justice Network report, taxing profits where they are actually earned would increase multinational corporations’ tax payments by 24% without requiring any country to raise its corporate tax rate.\nThe negotiations in New York represent the best opportunity in decades to replace the outdated “pay-where-you-say” model with a “pay-where-you-play” framework that taxes multinational corporations where they employ people and sell goods and services. This reform could make tax havens obsolete overnight and restore governments’ ability to tax economic activity taking place within their own borders.\nPS Deep Dive: Oligarchy\nA collection of PS commentaries examining how a few individuals amassed unprecedented wealth—and how they are using it to dismantle democracy. Featuring insights from Cristina Enache, Brooke Harrington, James Livingston, Michael Madowitz, Ann Pettifor, Matt Simonton, and Quinn Slobodian.\nSubscribe and save 30%\nUnder such a framework, the largest revenue gains would go to the world’s richest economies, but the greatest impact would be felt in the poorest. For many lower-income countries, the additional revenue would amount to several times what they currently collect from multinational corporations. This is consistent with the findings of the annual State of Tax Justice reports: while the largest economies lose the most to corporate tax abuse in absolute terms, lower-income countries suffer the greatest losses relative to the size of their tax bases.\nThat is not to say that advanced economies would not benefit. The United States, for example, would collect an estimated $35.5 billion in additional tax revenue—enough to increase spending on renewable energy 45-fold and create more than 265,000 jobs. The United Kingdom would receive $16.9 billion, enough to fund its newly introduced cost-of-living measures six times over. EU member states, meanwhile, would collect roughly $65.7 billion annually, enough to quadruple current spending on climate adaptation in agriculture, energy, and transport. Spain and France, both confronting their most devastating wildfire seasons on record, would receive and $4.2 billion and $25.5 billion, respectively.\nFor the Global South, the gains would be transformative. In a single year, the report estimates, lower-income countries would collect more than the total amount they currently owe the International Monetary Fund in outstanding loans.\nSo how do we move from today’s “pay-where-you-say” system to a genuine “pay-where-you-play” one? Article 5 of the draft UN Tax Convention—the product of two years of negotiations—tries to do just that by allocating taxing rights among countries based on clear, objective factors like sales, employment, and natural resources.\nIf adopted, the Convention would end the century-old practice of transfer pricing, through which multinationals use internal transactions to shift profits to low- or no-tax jurisdictions with little connection to where they actually do business. Every country except the most aggressive corporate tax havens stands to benefit from such a change, and even those jurisdictions can offset their losses by simply imposing moderate taxes on the profits earned within their borders.\nThat said, the draft Convention can still be strengthened. The commitment to a “pay-where-you-play” approach must be backed by practical measures, particularly country-by-country reporting (CbCR)—a simple yet powerful transparency tool that requires multinational corporations to report", "translation_ja": "", "vocab": [{"word": "transfer pricing", "definition": "多国籍企業が内部取引を使用して利益を低税率または無税の管轄区域に移す会計慣行。企業グループ内での商品・サービス・資産の取引価格を操作して税負担を減らすスキームです。"}, {"word": "multinational corporations", "definition": "複数の国で事業を運営する大規模企業。異なる国での利益計上や税務戦略が複雑になるため、国際税務改革の主な対象となります。"}, {"word": "tax havens", "definition": "法人税や個人所得税が極めて低い、または免除される国や地域。企業や富裕層が税負担を軽減するため利用されます。"}, {"word": "profit shifting", "definition": "多国籍企業が高税率国から低税率国へ利益を移転する行為。ペーパーカンパニーや内部取引を通じて実行されます。"}, {"word": "country-by-country reporting", "definition": "多国籍企業が各国での売上・利益・従業員数などを個別に報告する透明性メカニズム。企業の脱税行為を監視するための重要なツールです。"}, {"word": "jurisdiction", "definition": "租税または法的権限が及ぶ地域または国。国際税務において、どの地域がどの程度の課税権を持つかが重要な問題です。"}]}, {"title_ja": "ポチェッティーノのUS代表復帰はリスキー、高額、そしておそらく不要", "title_en": "Pochettino's US Return Is Risky, Expensive and Probably Unnecessary", "summary_ja": "著者は、マウリシオ・ポチェッティーノがUSMNTを成功裏に活性化させ堅実なワールドカップパフォーマンスを提供したが、2030年までの4年間の新契約はリスキーな賭けだと主張しています。ポチェッティーノは一流クラブのポジションのため早期に退任する可能性があり、歴史的データはUSMNT監督が2番目のワールドカップサイクルで成功することは稀であることを示唆しており、新しいコーチがチームの発展に役立つ可能性があります。", "summary_en": "The author argues that while Mauricio Pochettino successfully revitalized the USMNT and delivered solid World Cup performances, his new four-year contract through 2030 is a risky gamble. Pochettino may leave early for a top club position, and historical data shows USMNT managers rarely succeed in second World Cup cycles, suggesting a fresh coach could better serve the team's development.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/football/2026/aug/03/mauricio-pochettino-usmnt-return", "state_media": false, "category": "オピニオン", "full_text": "Mauricio Pochettino and US Soccer enjoyed their time together.\nOr, rather, they enshoyed it, as Pochettino would pronounce it in his thick Argentinian accent, which charmingly carries over when he speaks English.\nNevertheless, the two sides should have moved on from each other.\nFrom his 10 September 2024 appointment through the US men’s national team’s 4-1 last-16 World Cup elimination at the hands of Belgium on 6 July, Pochettino had broadly accomplished what he was brought in to do.\nHe energized a team who had grown stale. He found a playing system and style that suited a generation of USMNT players who were unprecedented in their pedigree and talent but lacked difference-makers on the World Cup stage. He coaxed from them two excellent performances – including a 4-1 hammering of Paraguay that was surely the best the Americans have ever looked at a World Cup – and two very good ones. Then it all caved in against Belgium after the good vibes had been ruined by a meddlesome president in all that Folarin Balogun suspension/unsuspension business.\nPochettino’s spell in charge was a success.\nNow, he will be back, having accepted a contract offer extended to him by the US Soccer Federation before the World Cup and kept on the table after the team was eliminated a round sooner than many had hoped they would reach. Pochettino’s new deal runs through the 2030 World Cup, giving him a full cycle to try again.\nThis is something of a gamble. The inclination to see what Pochettino will construct atop the sturdy foundations he laid is understandable, but it assumes that he even stays through the length of his new deal.\nIt feels like the Argentinian and his staff are still here on account of the absence of opportunity elsewhere, to coach the sort of club he has worked for over the course of a decade – the likes of Tottenham Hotspur, Paris Saint-Germain, Chelsea. Perhaps he settled for a prolonged stay with the US men by default; perhaps not. Before the World Cup, Pochettino was reportedly in talks with Milan, who ultimately hired Ruben Amorim as manager instead.\nIt seems unlikely Pochettino will actually stick around four more years as one top coaching job after another opens up and he invariably winds up on the lists of rumored candidates. Should he leave early, the team will once again be starting over mid-cycle.\nBesides, the job he returns to is very different from the one he has done.\nFor the USMNT, World Cup qualifiers for 2030 won’t even start until November of 2027, although there will be editions of the Concacaf Nations League and Gold Cup to slog through before then – to say nothing of a great many friendlies against teams you are largely supposed to beat every time. The final round of World Cup qualifying will be played in June of 2028 and the fall of 2029, after still more Nations League and Gold Cup duties. Mind you, Concacaf will have six places at the next World Cup, with a possible seventh through a playoff – as opposed to three automatic berths for the 2022 World Cup, the last edition before the tournament expanded and was hosted in this region. The stakes and peril will simply not be the same as before. The adrenaline rush of high-stakes games is an awfully long way off.\nThen there’s the history of USMNT managers staying on for a second World Cup cycle. It’s abysmal. Bruce Arena hung on for a second World Cup and watched helplessly as the side who stunned on their way to the brink of the semi-finals in 2002 got grouped in 2006. Bob Bradley made it just a year after 2010, getting sacked after a 4-2 Gold Cup final loss to Mexico the following summer. Jürgen Klinsmann’s second cycle was a debacle and sowed the seeds for the failure to reach the 2018 World Cup. Gregg Berhalter’s return to the job after 2022 was marred by a scandal and never really got going, ending in humiliation at the Copa América on home soil and his subsequent replacement by Pochettino.\nGranted, all of them got more of that first cycle than Pochettino did, who parachuted into the job less than two years before the World Cup. But what each second-term failure had in common was that all the coaches struggled to keep the program fresh when the process reset.\nWhile this remains a fairly young team, they could do with an injection of fresh faces, legs and ideas. Out of the team’s longstanding core of Christian Pulisic, Tyler Adams, Weston McKennie, Antonee Robinson, Sergiño Dest and Chris Richards, only McKennie has been spared major and repeated injuries. The scare over a late knock to Richards before the tournament emphasized that while the standard and quality on the field has inarguably improved, it nevertheless feels tentative. The US were never more than an injury or two away from calamity. This was especially apparent when Pulisic was pulled at half-time against Paraguay and did not play a full 90 minutes all tournament, lasting longer than an hour only once.\nThere is also something of an opportunity cost to keeping Pochettino on. Tax fi", "translation_ja": "", "vocab": [{"word": "meddlesome", "definition": "余計な干渉をする、おせっかいな。ここではUS Soccer会長がFolarin Balogun選手の出場停止問題に干渉したことを指します。"}, {"word": "slog", "definition": "困難な作業や苦労を伴う経験。ここでは多くの親善試合やトーナメントを通じて退屈に進むことを意味します。"}, {"word": "adrenaline rush", "definition": "興奮や緊張によってもたらされる急速なエネルギー上昇。高い利害関係のある試合から得られる興奮を指します。"}, {"word": "debacle", "definition": "大失敗、惨敗。クリンスマンの2番目のサイクルがスポーツ的な大惨敗であったことを示します。"}, {"word": "sow the seeds", "definition": "将来の問題や結果の原因を作る。ここでは失敗への道を作ることを意味します。"}, {"word": "tentative", "definition": "不確実な、確実でない。チームの改善が不安定で脆弱であることを示します。"}, {"word": "opportunity cost", "definition": "ある選択をすることで失われる代替選択肢の利益。ポチェッティー
