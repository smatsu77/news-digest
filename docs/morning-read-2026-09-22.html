lh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "61 Nigerian officials linked to $271 million US property holdings -Report", "title_en": "61 Nigerian officials linked to $271 million US property holdings -Report", "summary_ja": "The investigation examined how wealth linked to Nigerian political and economic elites moved into the US real estate market and identified recurring risk factors in the acquisition of the properties. The post 61 Nigerian officials linked to $271 million US property holdings -Report appeared first on", "summary_en": "The investigation examined how wealth linked to Nigerian political and economic elites moved into the US real estate market and identified recurring risk factors in the acquisition of the properties. The post 61 Nigerian officials linked to $271 million US property holdings -Report appeared first on", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/headlines/911696-61-nigerian-officials-linked-to-271-million-us-property-holdings-report.html", "state_media": false, "category": "経済", "full_text": "A new investigation has identified 284 properties in the United States, collectively valued at nearly $271 million, linked to 61 current and former high-level Nigerian officials, their families, associates and affiliated companies.\nThe properties, acquired from 1991 onwards, include 152 worth about $177 million that were purchased while the officials were in office, according to a report by the Platform to Protect Whistleblowers in Africa (PPLAAF), in partnership with the Anti-Corruption Data Collective (ACDC).\nThe findings were presented in Abuja on Tuesday at the launch of the report, titled “Nigeria: Dirty Deeds — How Top Nigerian Officials Bought a Piece of America.”\nThe investigation examined how wealth linked to Nigerian political and economic elites moved into the US real estate market, and identified recurring risk factors in the acquisition of the properties.\nThese included purchases made while officials were in office, transactions without apparent financing, and the use of companies and intermediaries that could obscure ownership.\nPPLAAF said 230 of the 284 properties, representing about 81 per cent, were purchased without apparent financing. The properties had a combined value of about $232 million.\nIt also found that 147 properties worth approximately $111 million were acquired by officials or their spouses in their own names or through legal entities registered in their names.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nA further 104 properties, valued at about $140 million, were purchased through companies. In 12 cases, Nigerian officials used US-incorporated entities that appeared to be affiliated with their Nigerian companies to purchase, hold or sell properties.\nCorruption links\nAccording to the report, 39 of the 61 individuals examined have been publicly accused, indicted or sentenced for corruption.\nAmong the 39 individuals named are Sambo Dasuki, a former National Security Adviser (NSA); Abdulrasheed Maina, former chairman of the Presidential Task Force on Pension Reforms; Orji Kalu, a former governor of Abia State and now a senator; Chimaroke Nnamani, a former governor of Enugu State; late Ajibola Ajimobi, a former governor of Oyo State; Stella Oduah, a former minister of Aviation; Dibu Ojerinde, a former registrar of the Joint Admissions and Matriculation Board (JAMB); late Alex Badeh, a former chief of defence staff; Abdulrahman Dambazau, a former minister of Interior and ex-chief of army staff; Chris Ngige, a former governor of Anambra State and later minister of Labour and Employment; Willie Obiano, a former governor of Anambra State; and Ronald (Roland) Ewubare, a former group chief operating officer of the Nigerian National Petroleum Corporation (NNPC).\nThe politically exposed persons were linked to 232 properties valued at approximately $238 million. Of these, 195 properties, worth about $208 million, were acquired without apparent financing during or after the officials’ tenure.\nThe investigation found that 94 properties, worth approximately $135 million, were acquired without an apparent source of financing while the officials were still in office.\nThe report also said 79 properties worth approximately $73 million remain connected to 27 individuals who have been publicly accused of corruption.\nIt said the properties could provide an opportunity for asset recovery where authorities establish that they were acquired with proceeds of corruption or are otherwise subject to applicable forfeiture laws.\nThe report said the significance of the findings was not only who acquired the properties, but also when and how they were acquired.\n“In numerous cases, substantial real estate was acquired while officials held public office, at precisely the moment when their access to state resources and influence was greatest,” the report said.\nMost of the other individuals examined were linked to institutions with a documented history of corruption allegations since Nigeria returned to civilian rule in 1999.\nSome of the individuals were also implicated in the Pandora Papers and other investigations into suspicious purchases in the United Arab Emirates, according to the report.\nHow the properties were acquired\nThe investigation found that 230 properties, worth about $232 million, were purchased without apparent financing.\nThe report said overseas property purchases can allow politically exposed persons (PEPs) to convert illicit gains into tangible assets, while the use of companies, trusts and intermediaries can make ownership more difficult to establish.\nIt said the trend of obscuring ownership appeared to have increased over the past two decades, particularly among PEPs who had encountered legal difficulties or become subject to judicial proceedings.\nThe report also identified professionals involved in some property transactions who allegedly failed to verify identity documents ", "translation_ja": "", "vocab": []}, {"title_ja": "DR Congo delegation begins study tour of NCDMB’s local content model", "title_en": "DR Congo delegation begins study tour of NCDMB’s local content model", "summary_ja": "The delegation from DR Congo arrived in Nigeria on Monday to understudy the Nigerian Content Development and Monitoring Board’s acclaimed local content framework for the oil and gas industry. The post DR Congo delegation begins study tour of NCDMB’s local content model appeared first on Premium Time", "summary_en": "The delegation from DR Congo arrived in Nigeria on Monday to understudy the Nigerian Content Development and Monitoring Board’s acclaimed local content framework for the oil and gas industry. The post DR Congo delegation begins study tour of NCDMB’s local content model appeared first on Premium Time", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/911703-dr-congo-delegation-begins-study-tour-of-ncdmbs-local-content-model.html", "state_media": false, "category": "社会", "full_text": "A high-level delegation from the Democratic Republic of Congo (DRC), led by Minister of Hydrocarbons, Simplice Stev Onanga has arrived in Nigeria to understudy the Nigerian Content Development and Monitoring Board’s acclaimed local content framework for the oil and gas industry.\nNigeria’s Minister of State for Petroleum Resources (Oil), Senator Heineken Lokpobiri, received the delegation in Abuja on Monday, reaffirming Nigeria’s commitment to knowledge-sharing with fellow African nations, particularly under the platform of the African Petroleum Producers Organisation (APPO).\nLokpobiri highlighted that Nigeria has achieved 61% local content capacity since the enactment of the Nigerian Oil and Gas Industry Content Development (NOGICD) Act 16 years ago.\nHe noted that the divestment of onshore oil and gas assets by international oil companies (IOCs) has created opportunities for indigenous firms such as Renaissance Africa Energy Company, SEPLAT Energy Producing Unlimited and Oando Energy Resources Nigeria Limited to acquire the divested assets and thrive.\n“The solution to Africa’s energy challenges lies within Africa,” Lokpobiri declared, stressing that Nigeria currently produces over 1.8 million barrels of crude oil per day.\nThe Minister explained that while deep offshore operations remain dominated by foreign companies, Nigerian oil and gas operating and service firms now control land and shallow water assets, driving local content growth. He emphasized that local content initiatives are industry-funded through a 1% Nigerian Content Development Fund (NCDF) levy on awarded upstream oil and gas contracts. Lokpobiri assured the DRC delegation that Nigeria would share its experiences openly, conveying greetings from President Bola Tinubu.\nNCDMB Executive Secretary, Felix Omatsola Ogbe, represented by Director of Corporate Services, Dr Abdulmalik Halilu, expressed the Board’s readiness to support the DRC in establishing a robust local content framework. He pointed to Nigeria’s institutional structures, regulatory synergy, and a 10-year strategic roadmap aimed at achieving 70% in-country value retention and creating over 300,000 direct jobs by 2027.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMinister Onanga praised Nigeria’s achievements, noting that it is the only African country to have attained significant self-sufficiency in oil and gas local content.\n“We are proud to be in Nigeria to witness what has been accomplished,” he said.\nThe understudy visit will continue till Friday and will include tours to the NCDMB Headquarters at Bayelsa State, Onne Free Zone fabrication workshops, NLNG supplier session and UniPort Gas Centre as well as LADOL/Nigerdock yards and other key engagements.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "NCDMB deepens energy ties with China, participates in oil and gas summit", "title_en": "NCDMB deepens energy ties with China, participates in oil and gas summit", "summary_ja": "The engagement formed part of the Board’s and oil industry’s participation in the 15th China Shale Oil and Gas Summit, convened from 20 to 23 September 2026 at the Chengdu Century City International Conference Centre The post NCDMB deepens energy ties with China, participates in oil and gas summit a", "summary_en": "The engagement formed part of the Board’s and oil industry’s participation in the 15th China Shale Oil and Gas Summit, convened from 20 to 23 September 2026 at the Chengdu Century City International Conference Centre The post NCDMB deepens energy ties with China, participates in oil and gas summit a", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/911697-ncdmb-deepens-energy-ties-with-china-participates-in-oil-and-gas-summit.html", "state_media": false, "category": "政治", "full_text": "The Nigerian Content Development and Monitoring Board (NCDMB) has intensified its drive to attract Chinese investment, technology and manufacturing capacity into Nigeria’s oil and gas industry, engaging more than 100 Chinese Original Equipment Manufacturers (OEMs) in Chengdu, China.\nThe engagement formed part of the Board’s and oil industry’s participation in the 15th China Shale Oil and Gas Summit, convened from 20 to 23 September 2026 at the Chengdu Century City International Conference Centre. The summit, themed “Empowering Efficient and Green Development via Intelligent Technologies, Innovating to Lead the Shale Oil and Gas Revolution,” provided a platform for NCDMB and representatives of key groups in the oil industry to showcase Nigeria’s local content framework and investment opportunities in manufacturing, technology and broader oil and gas services.\nRepresenting the Executive Secretary of NCDMB, Felix Omatsola Ogbe, the Director, Project Certification and Authorization Division (PCAD) and Senior Technical Adviser to the Executive Secretary, Austin Uzoka, delivered a keynote address on the first day of the summit titled, “Nigeria’s Local Content Journey and Opportunities for Chinese Collaboration in Oil and Gas Equipment Manufacturing.”\nHe explained that NCDMB was seeking to move the relationship between Nigerian oil and gas industry and Chinese manufacturers beyond the conventional buyer-seller model towards investment, manufacturing, technology transfer and stronger integration into global supply chains.\nHe assured that the Nigerian Oil and Gas Content Development (NOGICD) Act guarantees that any oil and gas equipment manufacturing facility that is established in the country will be patronised by the oil and gas industry, with further opportunities across the Gulf of Guinea.\n“We are looking beyond the traditional buyer-seller relationship. What can we build together? We want Chinese companies to see Nigeria not simply as a market for their products, but as a strategic investment destination, a platform for manufacturing and technology development, and a gateway to opportunities across the wider African market,” he said.\nThe Executive Secretary highlighted the Nigerian Oil and Gas Park Scheme (NOGaPS) as a platform for industrial investment, encouraging Chinese OEMs to establish manufacturing, assembly and service operations in Nigeria, with opportunities for technology transfer, technical arrangements and integration of Nigerian businesses into their supply chains.\nHe also identified China’s strength in manufacturing, engineering, technology and energy infrastructure as an opportunity to support Nigeria’s industrial development.\n“China has developed tremendous capabilities in manufacturing, engineering, technology and energy infrastructure. We want to explore how those capabilities can be connected with the opportunities that exist in Nigeria, for mutual benefits” he added.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nOn Nigeria’s local content journey, Austin explained that the agenda had evolved from increasing Nigerian participation in oil and gas projects to a broader drive for industrial capacity, manufacturing, technology ownership and global competitiveness.\n“Nigeria’s local content journey has evolved significantly since the Local Content Law was enacted in year 2010. What began primarily as an effort to increase Nigerian participation in the oil and gas industry has developed into a broader industrial development agenda focused on building capabilities, deepening manufacturing, promoting technology ownership and positioning Nigerian businesses to compete within regional and global markets,” he observed.\nThe second day of the summit featured a Business-to-Business (B2B) session organised by the Board, which drew participation from more than 100 Chinese equipment manufacturers and Nigerian oil and gas industry stakeholders to explore opportunities in local manufacturing, supply-chain integration, investment, technology development and market access.\nRepresentatives of the Petroleum Technology Association of Nigeria (PETAN), led by Mr Sylvester Ovunwese, participated alongside representatives of Project 100, including Mrs Olateju Oyelakun of Encapsulate Nigeria Limited and Mr Namdi Akudulu of Wider Energy. Renaissance African Energy Company was represented by its General Manager, Nigerian Content Development, Olarenwaju Lanre Olawuyi, who made a presentation on behalf of the company and Oil Producing Trade Session (OPTS).\nThe session provided an opportunity for Nigerian companies to showcase their capabilities, while Chinese manufacturers explored prospects for market entry, local production and technical cooperation. Consequently, the engagement generated significant interest among participating Chinese OEMs, with several expressing willingness to explore business relations", "translation_ja": "", "vocab": []}, {"title_ja": "U.N. Live Updates: As Trump Threatens Iran, Other Leaders Warn of Deep Divisions", "title_en": "U.N. Live Updates: As Trump Threatens Iran, Other Leaders Warn of Deep Divisions", "summary_ja": "President Trump said he must decide whether to make a deal or “annihilate” Iran, in a gathering where world leaders typically focus on declarations of global harmony.", "summary_en": "President Trump said he must decide whether to make a deal or “annihilate” Iran, in a gathering where world leaders typically focus on declarations of global harmony.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/09/22/world/un-general-assembly-trump-speech-news", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Sri Lanka Convicts 15 in Easter 2019 Bomb Attacks", "title_en": "Sri Lanka Convicts 15 in Easter 2019 Bomb Attacks", "summary_ja": "A court found 15 men guilty of coordinating a series of suicide bombings in hotels and churches, which killed more than 300 people.", "summary_en": "A court found 15 men guilty of coordinating a series of suicide bombings in hotels and churches, which killed more than 300 people.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/22/world/asia/sri-lanka-convictions-easter-2019-bomb-attacks.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Trump Praises Burnham as ‘Natural B standing of its Asian neighbors or the respect of the international community through militarism an", "summary_en": "At this historical milestone marking the 95th anniversary of the September 18 Incident, the alarm over the possible resurgence of Japanese militarism has rung once again. Japan can never earn the understanding of its Asian neighbors or the respect of the international community through militarism an", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-18/September-18-Incident-at-95-Beware-of-resurgent-militarism-in-Japan-1QxenFDwas0/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Expert: SCO states can cooperate to boost traditional medicine growth", "title_en": "Expert: SCO states can cooperate to boost traditional medicine growth", "summary_ja": "Expert: SCO states can cooperate to boost traditional medicine growth", "summary_en": "Expert: SCO states can cooperate to boost traditional medicine growth", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-18/Expert-SCO-states-can-cooperate-to-boost-traditional-medicine-growth-1Qx5n6nknKM/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Spain to reject Russian LNG despite its companies’ contracts — foreign minister", "title_en": "Spain to reject Russian LNG despite its companies’ contracts — foreign minister", "summary_ja": "Spanish Foreign Minister Jose Manuel Albares noted that Madrid would comply with the relevant restrictions previously adopted by the European Union", "summary_en": "Spanish Foreign Minister Jose Manuel Albares noted that Madrid would comply with the relevant restrictions previously adopted by the European Union", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2191361", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Xi Jinping’s visit to US: what to expect from talks with Trump?", "title_en": "Xi Jinping’s visit to US: what to expect from talks with Trump?", "summary_ja": "The agenda includes fentanyl precursors, mutual moratoriums, rare earth supplies, US tariffs, China’s access to advanced artificial intelligence chips and other high-tech products, and US arms supplies to Taiwan", "summary_en": "The agenda includes fentanyl precursors, mutual moratoriums, rare earth supplies, US tariffs, China’s access to advanced artificial intelligence chips and other high-tech products, and US arms supplies to Taiwan", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2191357", "state_media": true, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Russian foreign minister to begin working program at UN General Assembly high-level week", "title_en": "Russian foreign minister to begin working program at UN General Assembly high-level week", "summary_ja": "Russian Foreign Ministry Spokeswoman Maria Zakharova pointed out that the UN remains \"an indispensable and most representative universal platform for multilateral diplomacy\"", "summary_en": "Russian Foreign Ministry Spokeswoman Maria Zakharova pointed out that the UN remains \"an indispensable and most representative universal platform for multilateral diplomacy\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2191355", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Preventing an AI World War", "title_en": "Preventing an AI World War", "summary_ja": "Warnings that AI may lead to our extinction often overlook the most immediate risk: a war triggered by an attack that no human intended or approved. A mechanism for distinguishing unintended harm from deliberate attacks is urgently needed.", "summary_en": "Warnings that AI may lead to our extinction often overlook the most immediate risk: a war triggered by an attack that no human intended or approved. A mechanism for distinguishing unintended harm from deliberate attacks is urgently needed.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-china-agreement-on-ai-governance-must-include-mechanism-for-identifying-accidental-attacks-by-s-alex-yang-and-angela-huyue-zhang-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Preventing an AI World War\nand\nWarnings that AI may lead to our extinction often overlook the most immediate risk: a war triggered by an attack that no human intended or approved. A mechanism for distinguishing unintended harm from deliberate attacks is urgently needed.\nLONDON/LOS ANGELES—When President Donald Trump and Chinese President Xi Jinping meet in Washington this week, AI governance is expected to be at the top of the agenda. The United States and China have been racing to develop increasingly powerful AI systems, and neither has shown much appetite for slowing down. But not even the winner of the AI race will be exempt from the profound risks the technology poses.", "translation_ja": "", "vocab": []}, {"title_ja": "Post-Liberal Europe?", "title_en": "Post-Liberal Europe?", "summary_ja": "Another victory for the far right in a German state election has confirmed European liberals' worst fears. With many critical European elections approaching in 2027, debates about the proper limits of popular sovereignty and other fundamental tenets of liberalism are now of paramount importance.", "summary_en": "Another victory for the far right in a German state election has confirmed European liberals' worst fears. With many critical European elections approaching in 2027, debates about the proper limits of popular sovereignty and other fundamental tenets of liberalism are now of paramount importance.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/post-liberal-europe-far-right-illiberal-view-of-popular-sovereignty-by-zaki-laidi-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Post-Liberal Europe?\nAnother victory for the far right in a German state election has confirmed European liberals' worst fears. With many critical European elections approaching in 2027, debates about the proper limits of popular sovereignty and other fundamental tenets of liberalism are now of paramount importance.\nPARIS—Coming just a couple weeks after the far-right Alternative für Deutschland (AfD) won the largest share of the vote in Saxony-Anhalt’s state election, the electoral results in Mecklenburg-Vorpommern confirm that Germany has entered the same cycle of hyper-political polarization already visible across much of Europe.", "translation_ja": "", "vocab": []}, {"title_ja": "Germany’s Moment of Reckoning", "title_en": "Germany’s Moment of Reckoning", "summary_ja": "As its growth model runs out of road, Germany must decide whether to defend aging industries or enable new ones to emerge. To translate its research excellence into globally competitive companies, it needs deeper capital markets and a genuine European single market in which promising startups can gr", "summary_en": "As its growth model runs out of road, Germany must decide whether to defend aging industries or enable new ones to emerge. To translate its research excellence into globally competitive companies, it needs deeper capital markets and a genuine European single market in which promising startups can gr", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/germany-economic-malaise-is-also-an-opportunity-to-reinvent-itself-by-ulrike-malmendier-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Germany’s Moment of Reckoning\nAs its growth model runs out of road, Germany must decide whether to defend aging industries or enable new ones to emerge. To translate its research excellence into globally competitive companies, it needs deeper capital markets and a genuine European single market in which promising startups can grow.\nBERLIN—Germany’s economy in recent years has been battered by the COVID-19 pandemic, Russia’s invasion of Ukraine and the resulting energy crisis, the erosion of German manufacturers’ competitiveness vis-à-vis China, and a sharp rise in inflation. Together, these shocks have compounded the challenges posed by climate change and demographic shifts, dampening confidence among businesses and consumers alike. Little wonder that Germany’s predicament is often described as a “polycrisis.”", "translation_ja": "", "vocab": []}, {"title_ja": "Trump invades the UN with a brutish speech | Ted Widmer", "title_en": "Trump invades the UN with a brutish speech | Ted Widmer", "summary_ja": "Gone was any shred of US idealism. It was a spectacle of raw power – a power that is likely to only diminish in the years ahead Expectations were low for Donald Trump’s address to the UN on Tuesday, and yet somehow it was even worse than expected. He does not perform well in formal settings, like ch", "summary_en": "Gone was any shred of US idealism. It was a spectacle of raw power – a power that is likely to only diminish in the years ahead Expectations were low for Donald Trump’s address to the UN on Tuesday, and yet somehow it was even worse than expected. He does not perform well in formal settings, like ch", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/22/trump-un-speech", "state_media": false, "category": "オピニオン", "full_text": "Expectations were low for Donald Trump’s address to the UN on Tuesday, and yet somehow it was even worse than expected. He does not perform well in formal settings, like chambers of government, preferring a blingier room, like Mar-a-Lago, or an outdoor rally. For years, he has made no secret of his hostility to the UN, and the very principles of international order that define it.\nIn recent years, that hostility has deepened into something more like a full-on assault, with frequent attacks on the International Criminal Court (perhaps out of fear that he will someday be indicted), on the UN’s climate agenda, and on Unesco (which the US decided to withdraw from in July 2025).\nHis flamboyant effort to launch a so-called Board of Peace in January (just before launching his war of choice on Iran) was another attack on the UN, which, at times, the president wondered if his new creation might simply replace.\nFive months later, it has achieved little in the way of tangible results, except to demand huge sums of money from its small number of member nations, most of which are petrostates. Not one of those states can say that the Middle East is in better shape since the board came into existence, with a crisis that is deepening daily and may engulf Saudi Arabia soon.\nBut even by Trumpian standards, this was a hollow speech, long on snarling belligerence and short on ideas or policy proposals. The president read robotically from a teleprompter for long stretches, except when he remembered one of the many complaints about the world that he has memorized from his rallies, and a history of grievances that goes back to his rise as a xenophobic developer in the 1980s.\nIn short, he insulted nearly everyone in the room, from the Middle Eastern countries who are wondering about the validity of US security guarantees, to the European allies he habitually belittles, to Ukraine, whose leader, Volodymyr Zelensky was in the room, undoubtedly wondering why Trump is now asking him to pause his effective strikes on the Russian invader.\nA famous episode of Seinfeld introduced “Festivus”, a holiday for the sharing of grievances. It felt like that as Trump outlined his Hobbesian vision of the world, with touches of Rodney Dangerfield added in, from a president who complains endlessly that he gets no respect.\nIn one stretch, he seemed to be lobbying for a Nobel peace prize while boasting of all the conflicts he has solved, as audience members yawned and checked their phones. He mentioned that these wars had previously been “unendable”, an interesting word that effectively describes two wars today. The Ukraine-Russian war is still going strong despite his frequent promises (including today) to to stop it.\nThen, of course, there is the war of choice in Iran that he launched nearly seven months ago. As he has so many times in his social media outbursts, he ranged erratically from threats to “annihilate the Islamic Republic” with car-salesman promises to help Iran achieve greatness if they will just agree do work with him. Which, obviously, they will not, as they continue to defy US threats and even to solidify their position (which has improved markedly with Houthi gains in the last two weeks).\nTrump insisted that stocks of American weapons are increasing, when all news reports are they are rapidly being depleted.\nThere was a lengthy assault on climate change, claiming (falsely) that the earth’s climate is cooling, and that the science is a hoax when August tied a record for the hottest month ever recorded, and several important science reports in the last week confirmed how dire the situation is. In Tennessee, the temperature on the field of a football game between the Titans and the Philadelphia Eagles reached 157F. Perhaps that is what the president meant when he bragged that the US is the “hottest” country in the world? He may need a new speechwriter – that claim was also made in his 2025 speech to the UN.\nAnother neologism was “super-intelligence”, or “SI”, a term that the president is hoping will suddenly replace “AI”, much as he tried to rename Lake Ontario and the Gulf of Mexico. Time will tell, but it feels unlikely the new term will stick.\nOn the eve of an important summit and state dinner with Xi Jinping, this might have been an important moment to stake out ways the US and China might cooperate on AI, to mitigate risks and increase the potential for beneficial research into disease and other problems. That opportunity was not seized.\nOther topics that were not addressed included our rapidly deteriorating relationship with Canada, once the US’s greatest ally, and now enraged by Trump’s constant insults. Far from bending Canada to his will, they are achieving the opposite effect, as it always Elbows Up now. It will take years to repair the damage to a vital strategic relationship to the North.\nInstead, more attention was paid to Greenland. The president claimed the US would now be enjoying basing rights – which we already enjoy – ", "translation_ja": "", "vocab": []}, {"title_ja": "Call it a win: boredom but no temper tantrums in Burnham’s first face-to-face with America’s King Baby", "title_en": "Call it a win: boredom but no temper tantrums in Burnham’s first face-to-face with America’s King Baby", "summary_ja": "Meeting at the UN in New York, the UK prime minister showed signs he can handle trash-talking President Trump US politics live – latest updates How do you deal with a problem like The Donald? The simple answer is that you don’t. You can’t. The normal rules of political engagement don’t apply. The US", "summary_en": "Meeting at the UN in New York, the UK prime minister showed signs he can handle trash-talking President Trump US politics live – latest updates How do you deal with a problem like The Donald? The simple answer is that you don’t. You can’t. The normal rules of political engagement don’t apply. The US", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/politics/2026/sep/22/boredom-but-no-temper-tantrums-in-first-burnham-trump-meeting", "state_media": false, "category": "オピニオン", "full_text": "How do you deal with a problem like The Donald? The simple answer is that you don’t. You can’t. The normal rules of political engagement don’t apply. The US president is like a five-year-old child with the world as his set of toys: a King Baby.\nNothing is ever constant or predictable. What’s agreed one day can be forgotten the next. Any deal can be interrupted with a temper tantrum at any time. Trying to second-guess Donald Trump is a fool’s errand.\nSo the primary aim of Andy Burnham’s first face-to-face meeting with Trump was to get out alive with his – and the UK’s – self-respect intact. To take no incoming damage. And whatever he did, not to offer the president a third state visit. Keir Starmer never really lived that one down. Putting out on the first date only encourages the other person to think you’re a pushover.\nThe hoped-for result was a pleasant and almost forgettable bilateral meeting at the United Nations general assembly in New York. It was only scheduled to last 30 minutes, so more like speed dating – one step up from two world leaders shooting the breeze while getting to know each other. Where differences could be acknowledged without causing a major diplomatic incident.\nAll of which falls pretty comfortably within Burnham’s skill set. Andy’s stock in trade is an easy-going self-confidence. He’s comfortable in his skin in a way that Keir never was. Or maybe the artifice is just better concealed. He understands that trash-talking is all in a day’s work for most politicians. In the past, he may have called Trump all sorts of things. Poisoned politics. Someone who would be unwelcome in Manchester. Well, that was then, this is now. Things change. Just like Trump. Now he would be welcoming the US president to the G20 in Manchester next year. Who would have guessed?\nAnd it all looked to have gone pretty much to plan. Maybe Trump also wanted this meeting to go well. His poll ratings in the US are dire, the midterm elections look like trouble and The Donald needs all the friends he can get – even if he had just tried to lose a few more of them in his speech to the UN earlier. A speech that had been even wilder and madder than many of his previous ones. Still, at least he hadn’t threatened to invade a Nato country this time. And it’s always good to learn of countries you never knew existed. Anyone for “Kazakhistan”?\nTaking questions with Trump afterwards, Andy didn’t look quite as self-assured as usual – he seemed very much on edge – but who could blame him for that? This was his first time as prime minister at the UN and The Donald always has it in him to blow any meeting out of the water.\nIt was Andy who went first, trying to remember what they had just talked about. It had all been a bit of a blur. That was it – they had talked about Iran. In his earlier speech, The Donald had suggested it was a toss-up whether he came to a deal with Iran or whether he annihilated it. On the whole, Andy was in favour of a deal. Quickly if possible. The war was causing a massive hit to the cost of living. He chose not to highlight the irony of Trump calling on Volodymyr Zelenskyy to stop bombing Russian refineries as it was playing havoc with the cost of oil. Pots and kettles and all that.\nBurnham then bigged up the deal with Saudi Arabia. The one where we send one plane to refuel Saudi fighters that don’t need refuelling because their targets are only a few hundred miles away. Finally, he mentioned the Falklands. By now The Donald was looking a wee bit bored. Unsure where the Falklands are or why they had been talking about them. Perhaps he was wondering why he was looking even more orange than usual.\nThen came the actual questions. Was Andy a man with whom Trump could do business? Sure he was, said The Donald. Andy was a “great businessperson”. Really? And by the way he was a lot nicer and a lot more talented than his predecessor. Poor Keir. Not only is he no longer prime minister, but he’s still getting rubbished at meetings he would have been attending. He really can’t buy a break. But that’s Trump for you. Andy shouldn’t relax too much. That will be him getting trashed one day.\nOn we went. Immigration. Burnham deftly trying to give credit to the immigrants working in the NHS while going on to condemn illegal immigration. Trump was just dreaming of walls and border guards. What about patriotism? Which did the prime minister prefer: Manchester or Manhattan? By now Andy was feeling a bit more self-assured that the whole thing wasn’t about to go tits up, so he joked about the president calling Manchester “some town”. Trump just shrugged. It still is just some town to him, but he wasn’t going to labour the point. He was trying to be on his best behaviour. For a five-year-old.\nThen a question on the sanctions imposed on illegal settlements in the West Bank. Trump looked bewildered. Had never heard of them. Andy insisted he had personally called the White House to inform the president of the UK’s intentions. It had be", "translation_ja": "", "vocab": []}, {"title_ja": "The Pentagon has unveiled its secret weapon: two idiotic influencers | Arwa Mahdawi", "title_en": "The Pentagon has unveiled its secret weapon: two idiotic influencers | Arwa Mahdawi", "summary_ja": "Jake and Logan Paul were invited to give a motivational speech. Just don’t let them get involved with military policy We’re now approaching month seven of a war against Iran that Donald Trump repeatedly assured us would be over in a matter of weeks . Prices are rising, troop morale is plummeting , a", "summary_en": "Jake and Logan Paul were invited to give a motivational speech. Just don’t let them get involved with military policy We’re now approaching month seven of a war against Iran that Donald Trump repeatedly assured us would be over in a matter of weeks . Prices are rising, troop morale is plummeting , a", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/22/pentagon-unveiled-secret-weapon-idiotic-influencers-jake-logan-paul", "state_media": false, "category": "オピニオン", "full_text": "We’re now approaching month seven of a war against Iran that Donald Trump repeatedly assured us would be over in a matter of weeks. Prices are rising, troop morale is plummeting, and there is little evidence things will improve.\nThe situation is so desperate that the decision makers at the Pentagon have decided to bring out the big guns. I’m not talking about nuclear weapons, although Trump recently threatened to “blow the entire nation [of Iran] up”. No, I’m talking about influencers Jake and Logan Paul, who are famous for doing idiotic stunts on YouTube and getting hit in the face during boxing matches. Last Thursday, Pete Hegseth’s Department of Defense or whatever they’re calling it these days (the Department of War Crimes?) welcomed the Paul brothers to Washington DC “to meet with our warriors” and deliver a motivational speech. In response, former Republican congressman and air force officer Adam Kinzinger wrote, “We aren’t a serious country at the moment.” That about sums it up.\nThe Paul brothers, to be fair, rose to the occasion as best they could. In a speech which channelled Churchill, if Churchill had suffered several major blows to the head, Logan said that touring the Pentagon had been “a cool experience”. Albeit not quite as cool as being deployed to fight and possibly die in an illegal bombing campaign started by president Trump, a convicted felon, on the advice of Benjamin Netanyahu, an accused war criminal. “I don’t think there is any greater commitment to sacrifice than those who are willing to live, die and fight for their country,” Logan said. Which is why you won’t see him doing it; easier to pocket millions fighting on TV.\nAs well as giving a pep talk to the military, Jake met up with treasury secretary Scott Bessent and the US treasurer to discuss how “to get more young Americans financially empowered.” That must have been an interesting chat considering how, back in 2023, the Securities and Exchange Commission charged the YouTuber with unlawfully promoting crypto assets without disclosing that he was being paid to do so; he eventually settled without admitting or denying the charges. (Logan has also faced a lawsuit linked to a dodgy crypto venture, although the case was eventually dismissed). Exactly the sort of person you want the treasury secretary expending energy talking to when US debt recently topped $40tn for the first time ever and a financial crisis seems to be around the corner.\nJust how Jake Paul and Bessent hope to financially empower young Americans is unclear. But it is unlikely to be via the traditional method of working hard at school and then going to university. Jake very much shares the Trump administration’s contempt for education. In 2020 he tweeted that he’s “sick of our education system and how it’s teaching kids 0 real life skills for them to secure there [sic.] own future.” He also once described high school as “kids sitting in Geography to learn where Timbuktu is for no reason.” The reason you learn where Timbuktu is, Jake, is so the US can overthrow it after they’re done with Iran and Greenland.\nThere has always been a strong vein of anti-intellectualism in US politics. “[T]he subordination of men of ideas to men of emotional power or manipulative skill are hardly innovations of the twentieth century,” Richard Hofstadter wrote in his 1963 book Anti-intellectualism in American Life. “[T]hey are inheritances from American Protestantism.” But while this may not be a new impulse, the Trump administration’s embrace of ignorance is doing damage that can’t be easily undone. The US is stuck in a vicious vacuousness cycle: the Trump administration has slashed research funding and disrupted thousands of grants, leading many promising young academics to flee the US. As expertise is eliminated and critical thinking purged from government institutes, chancers like the Paul brothers are elevated.\nStill, I suppose we should count our blessings, before even they are affected by Iran-induced inflation. At least the boneheaded Paul brothers are simply having meetings with high-level Trump administration officials. At least they’re not directly involved with military or economic policy. Although, the way things are going it’s only a matter of time. “I’m going to make a prediction that you will be, in the not-too-distant future, running for political office,” Trump told Jake, who has been a vocal Maga supporter, on stage at a rally earlier this year. “You have my complete and total endorsement.” Could another blond buffoon with zero qualifications become president of the US? Tune in to find out in the next season of America: the Empire Implodes", "translation_ja": "", "vocab": []}, {"title_ja": "Syria’s Imperiled Transition", "title_en": "Syria’s Imperiled Transition", "summary_ja": "How shock therapy threatens the post-Assad peace.", "summary_en": "How shock therapy threatens the post-Assad peace.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/syria/syrias-imperiled-transition", "state_media": false, "category": "オピニオン", "full_text": "In Syria today, nearly everyone seems to be struggling. People of all classes and backgrounds can barely afford food, rent, utilities—the basics of a dignified life. The country is attempting to leave behind half a century of tyranny and 14 years of civil war for a new and freer political order. It is also recovering from an economic collapse so precipitous that it ultimately helped topple the dictator Bashar al-Assad in 2024. As the country has proceeded in its political transition under President Ahmed al-Shara, however, living conditions for most Syrians have only become worse. Costs have soared, and a promised post-Assad economic boom has not materialized. Syria’s new government has offered citizens some symbolic victories, including an end to international isolation, but, for most people, it has not delivered materially. In fact, a number of its policy choices have made their lives even harder.\nOf all the problems Syria now faces, including intercommunal violence and the possible fragmentation of the country, the economy is the biggest one. Yet the country’s new leadership has insisted on austerity measures that have made the cost of living even more unbearable for the average Syrian.\nSyria is by no means the only country experiencing an affordability crisis. But it is one of the world’s most politically fragile states. If the new government cannot provide for ordinary Syrians, it risks unrest that could derail the country’s post-Assad transition.\nBITING COSTS\nSyrian rebels led by the Islamist faction Hayat Tahrir al-Sham ousted the Assad government in December 2024. Shara, the group’s leader, eventually assumed the presidency and has since overseen the consolidation of the country’s new institutions and its postwar recovery.\nHis administration has scored some real wins. After decades of political isolation, Syria has gained the support of regional and global powers, including the United States, and secured the removal of most international economic sanctions. Shara’s government has for the time being kept the country from breaking apart; after defeating Kurdish-led forces in Syria’s northeast earlier this year, it is now working to reintegrate the formerly semiautonomous region. It has in large part reined in revenge attacks and sectarian killings, although pro-government partisans perpetrated two massacres of minority Alawites and Druze last year. And Shara has mostly shielded Syria from the effects of the U.S.-Israeli war on Iran, even as it has spread elsewhere through the region.\nWhere the new Syrian government has fallen short is in its management of the economy. Of course, reviving commerce and industry was going to be a formidable challenge for any post-Assad government. Fourteen years of civil war displaced more than half the country’s population and caused the economy to contract by more than 50 percent. The World Bank has estimated that the war caused more than $108 billion in physical damage, largely in and around three economically vital cities, Aleppo, Damascus, and Homs. The World Bank reckons that two-thirds of Syrians now live in poverty, with an income below $3.65 per person per day. According to the UN Development Program, 90 percent of Syrians are living in poverty, and 66 percent in extreme poverty.\nBy the last several years of Assad’s rule, conditions had grown miserable. In fact, economic collapse contributed to the regime’s implosion in December 2024, as half-starved Syrian soldiers abandoned the front lines in the face of a rebel advance. In these circumstances, even an amply resourced, expert-led government would now struggle to restart the economy. The Shara government is neither of those things.\n Of all the problems Syria now faces, the economy is the biggest one.\nSyrians, impoverished by economic mismanagement and war, cannot afford even the bare necessities. The cost of living far exceeds the average citizen’s income. Based on the current unofficial exchange rate, World Food Program estimates that monthly needs for a Syrian household of five, including food and utilities, cost about $197. The Syrian Center for Policy Research, a Damascus-based think tank, puts the monthly abject poverty line at roughly $255. Yet the official monthly minimum wage is equivalent to only $95. Many Syrians depend on remittances from relatives abroad to get by.\nTo make matters worse, the cost of living in Syria has been rising steadily. The World Food Program calculates that the cost of essentials increased by 34 percent between July 2025 and 2026. Syrians’ purchasing power has been further diminished by a weakened currency, which initially strengthened after December 2024 but has since approached Assad-era lows.\nMore than 80 percent of Syrians lack reliable access to sufficient food. A joint assessment by the government and World Food Program found some improvement on this front from 2024 to 2025, but only insofar as the proportion of food-secure Syrians increased from 11.1 to 18.4 percent. Aft", "translation_ja": "", "vocab": []}, {"title_ja": "The Trouble With the Nuclear-AI Analogy", "title_en": "The Trouble With the Nuclear-AI Analogy", "summary_ja": "In humanity’s quest to constrain the dangers from fast-advancing artificial intelligence, many have looked to the most revolutionary technology that preceded it: nuclear weapons. SpaceX CEO Elon Musk has called artificial intelligence “far more dangerous than nukes.” Anthropic CEO Dario Amodei, who ", "summary_en": "In humanity’s quest to constrain the dangers from fast-advancing artificial intelligence, many have looked to the most revolutionary technology that preceded it: nuclear weapons. SpaceX CEO Elon Musk has called artificial intelligence “far more dangerous than nukes.” Anthropic CEO Dario Amodei, who ", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/trouble-nuclear-ai-analogy", "state_media": false, "category": "オピニオン", "full_text": "In humanity’s quest to constrain the dangers from fast-advancing artificial intelligence, many have looked to the most revolutionary technology that preceded it: nuclear weapons. SpaceX CEO Elon Musk has called artificial intelligence “far more dangerous than nukes.” Anthropic CEO Dario Amodei, who assigns The Making of the Atomic Bomb to employees and has likened himself to the Manhattan Project scientist Leo Szilard, describes the most powerful AI models as “weaponizable nuclear materials.” When asked how a technology such as AI can be regulated, OpenAI CEO Sam Altman often references the world’s nuclear materials watchdog, the International Atomic Energy Agency. Even the director of the CIA, John Ratcliffe, has made the same comparison.\nThese comparisons capture real parallels. Like nuclear weapons, frontier AI is powerful and hard to control. Like nuclear technology, it can be used for good or for ill. And like the Cold War arms race, the race for AI breakthroughs may reorder the global balance of power. The nuclear analogy, then, seems to offer a blueprint for how to effectively govern a promising but potentially dangerous technology such as AI.\nBut even if efforts to control the bomb may be a source of inspiration, they are not a ready-made template for AI governance. The analogy paints too rosy a picture of nuclear weapons governance, crediting it with successes that are still debated and may yet be unearned. It also blurs key differences between AI and nuclear technology that reveal just how much more difficult AI governance will be. Nuclear materials can be traced and accounted for to a much greater extent than AI components can. Nuclear weapons were designed, built, and now remain under strict government control; AI is built principally by private companies with strong profit motives, which move faster than states can regulate them. Whereas nuclear technology’s use cases are narrow, AI’s cut across nearly every sector and security domain.\nAI governance also faces an additional challenge: policymakers need to mobilize support for action even as the scale of the threat remains abstract. Recent disclosures by OpenAI, Anthropic, Google, and Meta that their advanced models escaped testing environments and gained unauthorized access to the Internet have raised alarm in Washington about the risks of frontier AI. But the implications of these incidents remain ambiguous. They are removed from most people’s everyday experience and have not yet caused large-scale harm, so they are unlikely on their own to generate the sustained political pressure needed to build and maintain a durable oversight regime. Despite the many warnings from researchers and policymakers about AI’s myriad risks, the technology has yet to experience a decisive moment, such as when nuclear weapons were used at the end of World War II, which transforms fear into action. But the world cannot wait for such a moment to act. Looking to history may be a productive place to start—but it cannot provide a ready-made blueprint for the problem that AI poses. Artificial intelligence is unlike any technology of the past, and the order that governs it must be, as well.\nIMPROBABLY GOOD LUCK\nThe most ambitious international visions for regulating AI borrow from nuclear governance in the belief that such a framework can both help minimize AI’s potential harms and boost the United States’ ability to lead. Haydn Belfield, a research scientist at Google DeepMind, has proposed an arrangement modeled on the Nuclear Nonproliferation Treaty (NPT) that would allow only certain states with sufficient domestic regulation to possess powerful chips—a nonproliferation regime for AI. Others, including Altman, argue for an independent body of experts with broad inspection and verification powers over AI, more akin to the IAEA. A third cluster seeks to re-create the arms control practices and mutual vulnerability of the Cold War to stabilize the AI race between the United States and China.\nThe allure of these precedents is understandable. The nuclear order is among the few successes of postwar global governance. In a 1953 speech to the United Nations, then U.S. President Dwight Eisenhower outlined a plan, which became known as “Atoms for Peace,” aimed at curbing the technology’s risks while promoting its benefits: countries could access nuclear technology so long as they promised to forgo using it for weapons.\nThe proliferation problem wasn’t solved immediately. In 1963, President John F. Kennedy predicted that 15 to 25 states would become nuclear powers in the following decade, and many senior U.S. leaders believed a nuclear war was inevitable. But by the 1970s, the nuclear order’s cornerstone treaty, the NPT, entered into force, and the IAEA’s expert-led inspections and verification regime, backed by Washington and Moscow, had begun to police it. The two superpowers negotiated test bans, convened arms control summits, and set up a crisis hotline. Today, the NPT comma", "translation_ja": "", "vocab": []}, {"title_ja": "Shrink the UN", "title_en": "Shrink the UN", "summary_ja": "The next secretary-general must get back to basics", "summary_en": "The next secretary-general must get back to basics", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/united-nations-general-assembly-secretary-general", "state_media": false, "category": "オピニオン", "full_text": "The United Nations, international officials sometimes joke, is always in crisis. Since its inception in 1945, the organization has had to navigate deep geopolitical tensions, devastating humanitarian disasters, and periodic budget shortfalls. But as world leaders gather in New York for the annual General Assembly high-level week, the UN appears to be in particularly bad shape. China, Russia, and the United States, three of the five veto-wielding powers that dominate the Security Council, have prevented it from acting on wars in Iran and Ukraine and civil conflicts in Myanmar and Sudan. Poor countries complain that donor states have not met their UN pledges on development spending. And the Trump administration halted most U.S. funding to UN activities last year, forcing the organization to cut back on its peacekeeping and relief efforts.\nWith challenges mounting, an upcoming leadership transition may decide whether the UN can stabilize itself and perhaps even regain some credibility—or slide further into decrepitude. Current Secretary-General António Guterres plans to step down at the end of the year, having struggled to reverse the organization’s political fortunes in his decadelong tenure. He has spent much of his last two years in office grappling with staff reductions and other cost-cutting measures to ensure the UN secretariat does not go bankrupt on his watch. His has been a thankless task, but diplomats and UN officials hope a new leader will be able to take a longer-term approach to refreshing the institution and keeping governments committed to multilateralism.\nThe small crop of candidates to succeed Guterres include senior UN trade official Rebeca Grynspan, Director General of the International Atomic Energy Agency Rafael Grossi, and Guyana’s Ambassador to the UN Carolyn Rodrigues-Birkett. Regardless of who wins, Guterres’ successor will need to develop a new playbook for revitalizing the organization. Any serious effort must acknowledge an unpleasant reality: as long as the world remains competitive and chaotic, the UN’s ability to forge wide-ranging international agreements will remain constrained.\nThe next secretary-general’s best hope may thus be to relinquish some of the organization’s previous lofty ambitions and slim down, prioritizing international crisis prevention and conflict resolution, the efficient provision of humanitarian aid, and achievable international development goals. A UN that jettisons time-consuming diplomatic processes and inefficient bureaucracies for a few core functions may disappoint ardent advocates of global governance. But it also may be the only version of the organization still viable in an era of great-power competition and austerity.\nLESS MONEY, MORE PROBLEMS\nSince the end of the Cold War, UN chiefs have responded to moments of crisis by arguing that the institution should do more, not less. Boutros Boutros-Ghali, the first secretary-general of the post–Cold War era, envisioned the UN as a supercharged global peacemaking body, but during his final years in office, after blue helmet peacekeepers failed to prevent the Rwandan genocide in 1994 and the Srebrenica massacre in Bosnia in 1995, the organization briefly retrenched. Beginning in the late 1990s, Boutros-Ghali’s successor, Kofi Annan, set out a new approach, establishing fresh poverty-reduction goals, battling AIDS, and launching UN peace operations in Kosovo, Timor-Leste, and several African countries. The U.S. war in Iraq, in 2003, split the Security Council and temporarily derailed Annan’s agenda, but he organized a global summit in 2005 to persuade governments to recommit to multilateralism and led the establishment of a new Peacebuilding Commission and the Geneva-based Human Rights Council the following year.\nIn the two decades since Annan left office, his successors, Ban Ki-moon and Guterres, have had to contend with a mounting catalog of crises, above all the Syrian civil war, which divided the Security Council for over a decade. As the number of conflicts, humanitarian crises, and natural disasters increased, so, too, did the UN’s budget. The combined revenue of all UN entities rose from $40 billion in 2010 to a high of $74 billion in 2022, driven in considerable part by greater humanitarian spending.\nBan and Guterres also repeatedly appealed to UN members to show greater solidarity. Ban championed the Paris climate change pact in 2015. Guterres convened a “Summit of the Future” in 2024, at which member states promised to cooperate on issues as varied as artificial intelligence and intergenerational justice. These agreements demonstrated vision and extraordinary diplomatic effort; the Paris accord won particularly widespread public support. But UN member states have often failed to honor the commitments outlined in past agreements, breeding a skepticism over the effectiveness of multilateralism that has in turn made it harder to get mistrustful members to sign onto new deals with binding legal force", "translation_ja": "", "vocab": []}];
const FOCUS = null;
let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-22 23:18 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
