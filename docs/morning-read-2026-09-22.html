 two countries combine our expertise and innovation,\" the prime minister said.\nBurnham was also asked by reporters about the UK government seeking to hand over the Chagos Islands to Mauritius and pay to lease back the joint US-UK military base on Diego Garcia.\nIt was confirmed in April that the deal had been paused indefinitely because of Trump pulling his support.\nBurnham spoke to the Mauritian prime minister, Navin Ramgoolam, on Monday.\nHe was asked by reporters to outline what he had told Ramgoolam, whether he supported the deal and if he had a plan to convince Trump to back it.\nBurnham replied: \"I said that we remain determined to secure the long-term operation of the base, which is crucial to our security and that of our allies.\n\"The assurance I gave was I will work towards a resolution, at the moment we don't have that, but I gave an assurance that I would commit to working towards one.\"\n- Burnham says he's not embarrassed about hoax message exchange \n  - Published18 August\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.", "translation_ja": "", "vocab": []}, {"title_ja": "US to build two military bases in Greenland under new deal with Denmark", "title_en": "US to build two military bases in Greenland under new deal with Denmark", "summary_ja": "The defence deal signed at the UN General Assembly also re-affirms Denmark's sovereignty over its semi-autonomous Arctic territory.", "summary_en": "The defence deal signed at the UN General Assembly also re-affirms Denmark's sovereignty over its semi-autonomous Arctic territory.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c9dr74g32g8go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "US to build two military bases in Greenland under new deal with Denmark\n- Published\ eal allows the US to \"modernise and expand its activities\" there.\nIt also says that \"no state that is not a member of Nato shall be allowed to establish its own manned or unmanned military installations in Greenland nor shall they be allowed a persistent presence of military forces in Greenland\".\nAlthough the militaries of non-Nato countries are now explicitly barred from the island, it was highly unlikely that non-allied troops would have been allowed access in the first place.\nCritically, no territory is ceded to the US, and it recognises both Denmark's \"sovereignty and territorial integrity\" and Greenland's right to self-determination.\nOn one hand, that's a significant climb down from Trump's earlier calls to acquire the Arctic island.\nBut it does deliver a strengthened US military presence and expand on the previous agreement. Therefore to some American eyes, that will be perceived as a historic win.\nThe new deal must still be approved by both Denmark's and Greenland's parliaments.\nDespite months of crisis, the mood at Tuesday's signing ceremony appeared strikingly upbeat and friendly.\n\"We going to have a tremendous relationship, a secure relationship,\" Trump said.\n\"This is tremendous for Europe and for the United States, for everybody, and for Greenland it's going to be incredible.\"\nMeanwhile, Frederiksen described the signing of the deal as a \"milestone in our long-standing co-operation\".\n\"Seventy-five years ago we entered into an agreement about the defence of Greenland. Today, we're signing an even bigger and better agreement - a deal that can last forever.\"\nThe Danish prime minister stressed that the agreement \"respects sovereignty and territorial integrity of the Kingdom of Denmark, as well as Greenland's right to self-determination\".\nJens-Frederik Nielsen said that \"for Greenland, it is not only an agreement about us, it is [an] agreement with us.\n\"It takes into account the people of Greenland, our rights, our livelihoods and the development of our country.\n\"Greenland matters for North American security and for transatlantic security,\" he said, adding that the Nato had a key role to play in the North Atlantic in a changing security situation.\nThe agreement also confirmed Greenland would remain in Nato if it were to gain independence from Denmark.\nThe 1951 agreement already allowed the US to send as many troops as it wanted to Greenland. Washington already has more than 100 military personnel permanently stationed at its Pituffik base.\nTrump had tried for months to purchase or annex Greenland, arguing that it was vulnerable to adversaries, including Russia and China.\nHe argued the Arctic island was an essential piece of his plan to build a futuristic \"Golden Dome\" defence system to protect the US against missile attacks.\nHowever the deal only mentions the project once, and contains no concrete proposal.\nA Nato spokesperson said shortly afterwards that the military alliance welcome", "translation_ja": "", "vocab": []}, {"title_ja": "Burnham expects to find 'common ground' with Trump in first meeting", "title_en": "Burnham expects to find 'common ground' with Trump in first meeting", "summary_ja": "In New York, the prime minister will also deliver a speech to the UN General Assembly expected to be focused on AI.", "summary_en": "In New York, the prime minister will also deliver a speech to the UN General Assembly expected to be focused on AI.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqevwpmvpekeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Burnham expects to find 'common ground' with Trump in first meeting\n- Published\nAndy Burnham said he expects to find \"common ground\" with Donald Trump at the pair's first face-to-face meeting on Tuesday.\nThe prime minister and US president are in New York City for the annual gathering of world leaders at the United Nations.\nThe two men have spoken by phone twice since Burnham became prime minister in July, with Downing Street saying those calls established a \"productive relationship\".\n\"We've found a connection. So, I will go with where I feel it's right, to meet him where he is at, and search for that common ground, which I'm sure we'll find,\" the prime minister told reporters on his flight to the US, adding \"I'm looking forward to it.\"\nAsked about the state of the relationship between the UK and US, the prime minister said he believes it is \"as strong as it's ever been\".\nBurnham has travelled to New York with his wife, Marie-France van Heel, for a day of diplomacy and a speech to the UN General Assembly, which is expected to focus on the opportunities and dangers associated with artificial intelligence (AI).\nHe said: \"I will be making the case for closer international co-operation on AI, a just and lasting peace in Ukraine, and renewed efforts to bring an end to the conflict in the Middle East because what happens abroad impacts each and every one of us at home.\"\nThe prime minister will also announce the start of work on a new AI and Autonomy partnership between the UK and the US, focused on protecting critical national infrastructure using AI tech.\nLib Dem leader Sir Ed Davey is expected to criticise this plan at the final day of his party's conference, saying it \"doesn't come close to meeting the scale of the threat\" and \"only risks making us more dependent on a Trump administration in the pocket of the tech bros\".\nHe will also call for a global pause on superintelligent AI and propose a new International AI Safety Agency.\nHis criticisms come after a series of stark warnings from the AI industry about the technology's possible dangers.\nTorpedo exercise\nFor a new British prime minister, the first meeting with a US president has always been a pivotal encounter, but officials are well aware of the added jeopardy of a public appearance alongside the most unpredictable president in American history.\nIn advance of the meeting, the UK revealed that the UK and the US have, for the first time, fired an American torpedo from a British undersea drone in a military exercise.\nThe torpedo, described as \"heavyweight\" by UK officials, is \"designed to sink ships and deep diving submarines\", Downing Street said.\nIt was launched in UK waters last week from a 12-metre long undersea drone called Excalibur, made in Plymouth.\nIt is the first time either the UK or the US have launched a torpedo from an uncrewed underwater vessel, rather than a crewed submarine, and is seen as a breakthrough in attempts to protect vital infrastructure such as deep sea data cables.\n\"Our work together already shows what can be achieved when our two countries combine our expertise and innovation,\" the prime minister said.\nBurnham was also asked by reporters about the UK government seeking to hand over the Chagos Islands to Mauritius and pay to lease back the joint US-UK military base on Diego Garcia.\nIt was confirmed in April that the deal had been paused indefinitely because of Trump pulling his support.\nBurnham spoke to the Mauritian prime minister, Navin Ramgoolam, on Monday.\nHe was asked by reporters to outline what he had told Ramgoolam, whether he supported the deal and if he had a plan to convince Trump to back it.\nBurnham replied: \"I said that we remain determined to secure the long-term operation of the base, which is crucial to our security and that of our allies.\n\"The assurance I gave was I will work towards a resolution, at the moment we don't have that, but I gave an assurance that I would commit to working towards one.\"\n- Burnham says he's not embarrassed about hoax message exchange \n  - Published18 August\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.", "translation_ja": "", "vocab": []}, {"title_ja": "Plot targeting Manchester's Jewish community disrupted, say police", "title_en": "Plot targeting Manchester's Jewish community disrupted, say police", "summary_ja": "Two men were arrested in Manchester on Sunday, say counter-terror police.", "summary_en": "Two men were arrested in Manchester on Sunday, say counter-terror police.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq07ly8xzvn4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Plot targeting Manchester's Jewish community disrupted, say police\n- Published\nTwo men have been arrested over a suspected terrorist plot to target the Jewish community in Manchester, police have said.\nThe men, both in their 30s, were arrested on Sunday on the eve of Yom Kippur - considered to be the holiest day in the Jewish calendar - when thousands of British Jews were in synagogues already guarded with a heavy security and police presence.\nThe men were detained on suspicion of offences under Section 41 of the Terrorism Act 2000, according to the Metropolitan Police, which is leading the investigation.\nSources have told the BBC the suspected plot was \"fairly imminent\" and in the later stages of planning.\nHome Secretary Shabana Mahmood said the government would \"continue to do all in our power to address threats against our Jewish community\".\nShe added: \"We cannot expect our Jewish community to live behind higher walls.\n\"We must also tackle antisemitism at its source and root it out wherever it rears its head.\"\n'Remain viligant'\nDeputy Assistant Commissioner Vicki Evans said police were aware the news would cause \"further concern\" to the Jewish community \"especially given the significant High Holy day period\".\nThe two suspects remain in police custody after being taken to a London police station for questioning.\nPolice said the investigation related to a \"suspected terrorist plot to target the Jewish community in the Manchester area\".\n\"This has been a long-running proactive investigation which has led to the disruption of what we believe to be a plot to target the Jewish community in the Manchester area,\" said Evans.\n\"Counter-terrorism policing (CTP) continue to focus our efforts on identifying and disrupting those who wish to cause harm in our communities.\n\"Importantly, we do not believe there to be any ongoing threat to the public in relation to this matter, but as ever, we would ask that people remain vigilant and contact police with any concerns.\"\nThe two suspects were arrested on Newton Street in the Northern Quarter area of Manchester at 14:45 BST.\nDetectives have obtained warrants of further detention for both men, meaning they can remain in police custody until 27 September.\nPolice confirmed searches at properties on Epworth Street in Liverpool and Lancaster Road in Salford had now been completed.\nEvans, who is the senior national co-ordinator for CTP, said: \"We are acutely aware this news will cause further concern to the Jewish community, as well as the wider public, especially given the significant High Holy day period.\n\"I want to reassure them we are working incredibly closely with colleagues in Greater Manchester Police and partners to ensure we're doing everything we can to keep them and the wider public safe.\n\"And more broadly across the country, CTP is working with local police forces to provide protective security support and advice for areas with Jewish communities, and particularly during the High Holy Day period.\"\nA spokesperson for the Community Security Trust, which coordinates security for Jewish communities in the UK, said the suspected plot was \"utterly chilling coming so close to the anniversary of the terrorist attack at Heaton Park Synagogue last year\".\nThey added: \"[This] is another reminder of the serious terrorist threat facing Jewish communities in this current time.\"\nGet in touch\nTell us which stories we should cover in Greater Manchester\nListen to the best of BBC Radio Manchester on Sounds and follow BBC Manchester on Facebook, external, X, external, and Instagram, external. You can also send story ideas via Whatsapp to 0808 100 2230.", "translation_ja": "", "vocab": []}, {"title_ja": "Davey promises tax cuts for millions if UK rejoins EU single market", "title_en": "Davey promises tax cuts for millions if UK rejoins EU single market", "summary_ja": "The Lib Dem leader vows to raise tax thresholds if he becomes PM, in a speech to his party conference.", "summary_en": "The Lib Dem leader vows to raise tax thresholds if he becomes PM, in a speech to his party conference.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cj62e1wrpx73o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Davey promises tax cuts for millions if UK rejoins EU single market\n- Published\nThe Liberal Democrats will fight the next general election on a promise to cut taxes for millions of workers, Sir Ed Davey has said in a speech to his party conference.\nThe Lib Dem leader said that if he gained power, he would raise the annual tax-free personal allowance to £15,000.\nHe would also raise the 40p income tax threshold from £50,270 to £56,000, in a £17bn package funded by the economic boost he says would come from the UK rejoining the EU single market and customs union.\nHe claimed the plan would mean a £680 cut for \"most taxpayers\" but it would not come into full effect until the fifth year of a Lib Dem government - potentially up to eight years away.\nThe announcement was greeted with sustained applause by Lib Dem MPs and activists in the Brighton conference centre.\nThe £12,570 income tax allowance was frozen by the Conservatives in 2021, resulting in more people being dragged into paying the tax, and Labour has so far resisted calls from trade unions and some of its MPs to unfreeze it.\nThe Lib Dems said they would raise the threshold to £15,000 a year, and increase the starting point for paying employee National Insurance (NI) to the same level.\nAt their conference earlier this month, Reform UK promised to increase the income tax personal allowance to £15,000 within 100 days if they won power.\nSir Ed told the Lib Dem faithful \"the difference between us and Reform\" is that \"their tax cut is paid for through cruelty.\"\nHe said \"Reform's figures show they'd pay for it by ripping £22bn of crucial support away from disabled people.\"\nExplaining his pledge to raise the 40p income tax threshold, Sir Ed argued that more and more people were being dragged into a tax bracket that had originally been intended for higher earners.\n\"A tax band designed for stockbrokers is now holding back teachers and nurses\" he said, adding: \"That's not fair, it's not right.\"\nUnder the Lib Dem plan, based on research by think tank Frontier Economics, external, the economic boost from rejoining the single market would allow the party to spend £17bn on tax cuts by the end of the next Parliament.\nThe party says it would unfreeze personal allowances in the second year of a Lib Dem government, allowing them to rise with inflation, before bringing in big tax cuts in year five when the economic benefits of closer trading with the EU had kicked in.\nHowever, the move would depend on the party being able to negotiate a closer trading arrangement with the EU in just 12 months.\nStuart Adam, of the Institute for Fiscal Studies think tank, told BBC Verify the Lib Dem package would cost \"much more\" than the £17bn quoted by the party.\nReform has estimated that its policy, to raise the starting threshold to £15,000 just for income tax, would cost £21bn by the fifth year.\nThe Lib Dems say their policy would be funded by an extra £27bn from its plans for a \"growth and defence pact\" with the EU.\n'British values'\nSir Ed has been under pressure this week to set out bolder policies, with his party languishing in fourth or fifth place in national opinion polls.\nHe began his speech with a sombre and punchy attack on Reform UK leader Nigel Farage.\nHe stopped short of calling Reform fascists, but drew a link between the fascists in Britain in the 1930s with what he called \"thugs, in black shirts and balaclavas\" in reference to the protests in Dover and Portsmouth in recent weeks.\n\"This is a far-right movement that is given oxygen, and heat, and fuel by politicians and parties who claim to be serious contenders to lead our country,\" said the Lib Dem leader.\nThe solution, he said, was \"community politics\" that he argued was the hallmark of the Lib Dems.\n\"It will take more than a manifesto. It will take a movement, rooted in decency, fairness and community. British values. Liberal values,\" he said.\nRepositioning the Lib Dems as a tax cutting party is aimed at appealing to voters they are targeting in traditional Tory heartlands.\nAnd Sir Ed used his speech to attack Tory leader Kemi Badenoch over her policy shifts on climate change and human rights law.\n\"Millions of decent, moderate Conservative voters are getting her message, and they're turning away – increasingly, to us,\" he told the audience in Brighton.\nHe took a swipe at Prime Minister Andy Burnham for failing to commit to rejoining the EU single market, something the Lib Dems say they would do in their first year in government.\nLib Dem sources refused to say whether the income tax plan would be a condition of joining a coalition government with Labour or another party, saying the party's aim was to get as many MPs as possible.\nSir Ed has ruled out a coalition with Reform UK, and dismissed suggestions he could do a deal with the Conservatives, as his party did in 2010.\nThe Lib Dem leader also addressed the potential threat posed by AI in his speech, saying that \"handled badly, it concentrates more power in fewer hands tha", "translation_ja": "", "vocab": []}, {"title_ja": "EU drops sanctions for Russian oligarchs Usmanov and Fridman", "title_en": "EU drops sanctions for Russian oligarchs Usmanov and Fridman", "summary_ja": "France and Luxembourg were behind the sanctions exemptions for Alisher Usmanov and Mikhail Fridman, a move that Kyiv labeled \"shameful and unjustifiable.\"", "summary_en": "France and Luxembourg were behind the sanctions exemptions for Alisher Usmanov and Mikhail Fridman, a move that Kyiv labeled \"shameful and unjustifiable.\"", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/eu-drops-sanctions-for-russian-oligarchs-usmanov-and-fridman/a-79381048?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "EU drops sanctions for Russian oligarchs Usmanov and Fridman\nSeptember 22, 2026\nThe European Union on Tuesday reached a compromise to prolong sanctions for around 3,000 Russian individuals, entities and companies — but it also resulted in the lifting of sanctions on two Russian oligarchs, Alisher Usmanov and Mikhail Fridman.\nIt all comes after lengthy negotiations ahead of a Wednesday deadline to extend the sanctions, which required unanimity among EU countries to be approved.\n\"The compromise will involve an extension of the regime for 36 months, until 22 September 2029,\" a spokesman for Ireland, which holds the EU's rotating presidency, said.\n\"The decision was also taken to delist certain individuals under the regime,\" it added.\nPreviously, the sanctions were subject to six-month extensions, so Tuesday's agreement allows the EU to avoid another squabble over the sanctions for three years.\nUkraine denounced the EU's removal of oligarchs Usmanov and Fridman from its Russia sanctions list as \"shameful and unjustifiable.\"\n\"Moscow is celebrating because it got what it wanted: a sense of impunity, the humiliation of the EU, and division among Europeans,\" Ukrainian Foreign Minister Andrii Sybiha said on social media.\n\"Wars end through resolve and strength, not concessions to the aggressor's entourage,\" Ukrainian President Volodymyr Zelenskyy wrote on social media.\nZelenskyy did say he was \"grateful\" to EU Commissioner Ursula von der Leyen for \"her readiness to work on adding more Russian names to the EU sanctions list\".\nKyiv has called on EU countries to impose \"national\" sanctions on the two oligarchs.\nFrance and Luxembourg sought exemptions\nFrance was one of the countries demanding the removal of Russian-Uzbek billionaire Usmanov from the sanctions list.\nOfficials in Paris explained the decision as having to do with \"national security\" concerns. The French government has not provided any additional details.\nAccording to AFP, diplomatic sources say the demand was linked to a potential prisoner release deal involving French nationals held in Azerbaijan, whose regime is close to Usmanov.\nMeanwhile, Fridman's sanctions exemption was put forth by Luxembourg.\nSources say the move comes as Fridman sues Luxembourg for €15 billion ($17 billion) over his frozen assets, due to EU sanctions.\nWho are Usamov and Friedman?\nUsmanov and Fridman are two of Russia's best-known oligarchs, and both have a net worth of $14 billion and 16 billion respectively. They both are known to have close ties to Vladimir Putin.\nThe Uzbek-born Usmanov made his fortune in the metals industry and in telecom. He currently owns the USM holding company, as well as MegaFon, one of Russia's main mobile phone operators.\nFor his part, Fridman, has made his fortune as founder and one of the shareholders of Alfa Group, which includes Alfa Bank, Russia's largest and most important private commercial bank.\nFridman also co-founded investment firm LetterOne in Luxembourg and stepped down from its board of directors in 2022 after being targeted by European Union sanctions.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Amateur archeologist unearths Germany's largest trove of Roman coins", "title_en": "Amateur archeologist unearths Germany's largest trove of Roman coins", "summary_ja": "What began as a routine search in a field near Wesseling led to the discovery of nearly 1,000 Roman silver coins, one of the most significant archaeological finds in Germany in recent years.", "summary_en": "What began as a routine search in a field near Wesseling led to the discovery of nearly 1,000 Roman silver coins, one of the most significant archaeological finds in Germany in recent years.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/amateur-archeologist-unearths-germany-s-largest-trove-of-roman-coins/a-79379127?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Germany's largest-ever trove of Roman coins unearthed\nSeptember 22, 2026\nA massive trove of Roman silver coins dating back to the 2nd century AD have been discovered by an amateur archaeologist in Germany.\n\"It was clear to me that there was something significant here,\" said Oliver Riedl, describing the moment he found several coins near Wesseling, south of Cologne, a year ago.\nAfter making the discovery, Riedl contacted the authorities to report the find and request assistance. A team of experts began excavations and uncovered a total of 934 Roman silver coins, also known as \"denarii\".\nThe hoard was put on display on Tuesday at the LVR-LandesMuseum Bonn, located in what was once the capital of West Germany.\nAccording to the the local authority responsible for archaeological heritage preservation, this is the largest coin hoard from the era of Roman Emperor Hadrian ever found in Germany.\nA historic discovery\nRegional archeological authorities believe the coins were most likely buried during the second quarter of the 2nd century AD.\n\"Of course, we can only speculate about the reasons, but it is highly likely that someone wanted to keep this money safe. After all, banks did not exist at that time,\" said Erich Classen, the chief archaeologist of North Rhine-Westphalia.\nClassen noted that there is no explanation as to why the coins were not discovered earlier, nor is it known who buried them. He added that \"perhaps the owner died before being able to recover them or pass on knowledge of their location.\"\nCoin hoards from the Roman period and other distant historical eras are not uncommon in the region. However, according to officials, few 2nd-century discoveries are as extensive as the one found in Wesseling. The institution also said that the current value of the collection is difficult to estimate. Nevertheless, thanks to extensive documentation preserved in written sources, there is a useful point of reference.\nAt that time, an ordinary legionary earned about 300 denarii per year. However, approximately half of that amount was deducted to cover food and equipment costs,\" explained Rahel Otte, a researcher at the state's archaeological office.\n\"Therefore, a legionary would have had to save all of his disposable income for around six years to accumulate a treasure like the Wesseling hoard,\" she added.\nThe Cologne region remained under Roman control from approximately 39 BC to AD 459. The Romans established their presence in the area under the command of General Marcus Vipsanius Agrippa to secure the empire's frontier along the Rhine River. To that end, they founded a military outpost that later developed into Colonia Agrippina, present-day Cologne.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Military aircraft crashes near US air base in Spangdahlem, Germany", "title_en": "Military aircraft crashes near US air base in Spangdahlem, Germany", "summary_ja": "The F-16 pilot was able to safely eject from the plane and was taken to receive medical care. The incident occurred near Spangdahlem Air Base in the German state of Rhineland-Palatinate.", "summary_en": "The F-16 pilot was able to safely eject from the plane and was taken to receive medical care. The incident occurred near Spangdahlem Air Base in the German state of Rhineland-Palatinate.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/military-aircraft-crashes-near-us-air-base-in-spangdahlem-germany/a-79376025?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US Air Force fighter jet crashes near air base in Germany\nSeptember 22, 2026\nA fighter jet crashed near the US air base in Spangdahlem, Germany, on Tuesday.\nThe plane crash occurred at approximately 2:30 p.m. local time (12:30 UTC). The cause of the incident is currently under investigation.\nThe US military confirmed that the plane was an F-16 Fighting Falcon assigned to the 52nd Fighter Wing and that its pilot was able to safely eject from the aircraft.\n\"The pilot ejected safely and is receiving medical care,\" the base said in a statement.\nLocal authorities in the remote Eifel region also confirmed that one person had been injured.\n\"Following a plane crash in the vicinity of US Air Base Spangdahlem, fire and emergency response teams from the Eifel District of Bitburg-Prüm were dispatched to the scene,\" the district said on its website.\n\"No comments can be made on the further details of the event from the side of the Eifel district at this time.\"\nA NATO operations center\nSpangdahlem Air Base is a NATO operations center that was built in the early 1950s. The US Air Force's 52nd Fighter Wing is garrisoned there. The base is home to an F-16 fighter jet squadron comprising around 20 aircraft.\nIt is located north of the city of Trier in Rhineland-Palatinate, not far west of the border to Luxembourg.\nThe facility at Spangdahlem is considered one of the most important airfields for the US military in Germany, alongside Ramstein base, outside the city of Kaiserslautern.\nSome 5,000 US military and civilian personnel-plus dependents are stationed at Spangdahlem, with around 700 to 800 Germans also employed at the facility.\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "Iran live updates: Trump says team met with Iran delegation at UN", "title_en": "Iran live updates: Trump says team met with Iran delegation at UN", "summary_ja": "President Donald Trump said Iran faces \"potential greatness or obliteration,\" after his team met with the Iranian delegation in New York Tuesday.", "summary_en": "President Donald Trump said Iran faces \"potential greatness or obliteration,\" after his team met with the Iranian delegation in New York Tuesday.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates-irgc-ready-counteroffensive-us-attacks/?id=136611503", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Nolan Wells' parents make emotional plea for justice after no charges filed in death", "title_en": "Nolan Wells' parents make emotional plea for justice after no charges filed in death", "summary_ja": "Nolan Wells' family held a press conference Tuesday and said they will not give up after a grand jury found that no criminal charges are warranted in his death.", "summary_en": "Nolan Wells' family held a press conference Tuesday and said they will not give up after a grand jury found that no criminal charges are warranted in his death.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/nolan-wells-parents-make-plea-justice-after-charges/story?id=136645028", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Healthcare in Africa ‘under growing strain’ after US withdrawal from aid programs, report warns", "title_en": "Healthcare in Africa ‘under growing strain’ after US withdrawal from aid programs, report warns", "summary_ja": "Accra Reset’s report states countries in the region and global south should take greater control of their health development after USAID debacle The United States’ withdrawal from key aid programs has put healthcare in Africa and the Global South “under growing strain” a new report warns. The report", "summary_en": "Accra Reset’s report states countries in the region and global south should take greater control of their health development after USAID debacle The United States’ withdrawal from key aid programs has put healthcare in Africa and the Global South “under growing strain” a new report warns. The report", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/21/africa-healthcare-aid-program-withdrawl", "state_media": false, "category": "社会", "full_text": "The United States’ withdrawal from key aid programs has put healthcare in Africa and the Global South “under growing strain” a new report warns.\nThe report says the Trump administration’s cuts to programs such as US Agency for International Development (USAID), as well as the Covid-19 pandemic and rising costs of living globally have brought “new urgency” for the need to reform healthcare in the region.\nThe report, titled A Sovereign Future For Health, was created by the Accra Reset, a global health initiative led by John Dramani Mahama, Ghana’s president, that believes countries in Africa and the wider global south should have greater control over their health development rather than being dependent on aid from western countries and international institutions.\nA key statistic cited by Mahama and Accra Reset is that Africa produces less than 1% of its vaccines while carrying about 25% of the global disease burden.\nThe report cites how abrupt changes to global health financing, such as the US withdrawal from several global health initiatives, forced countries within the global south to urgently restructure their finances. The report points to the Trump administration’s decision to dissolve USAID, which pushed Nigeria to absorb the 28,000 health workers who were previously employed by the agency at a cost of $200m.\nExternal financing for health in Africa contracted by close to 70% between 2021 and 2025, the report notes, meaning that African countries historically dependent on aid were forced to adapt quickly.\nThe withdrawal of the US Emergency Plan for Aids Relief (Pepfar) funding for South Africa, which provided over $400m a year annually and is credited with saving 26m lives globally since 2003, led to HIV clinics closing across the country. That left 1.4 million people living with HIV to face uncertainty about their treatment.\nSuch funding cuts caused “severe and devastating” disruption globally, according to research presented at the 26th International Aids Conference in Brazil earlier this year.\nAt the World Health Assembly in May, Mahama said Ghana lost $78m following the closure of USAID programs which affected maternal healthcare, the treatment of malaria, nutrition and HIV/Aids interventions.\nThe initiative’s latest report, published on Monday, comes amid these major cuts to international aid and growing pressure on countries to take greater ownership of their health systems. Mahama refers to these aid cuts as a clear example that donor dependency is not sustainable.\n“The Accra Reset is not an argument for traditional donors to do less on global health. It is an argument for doing it differently and doing it better. As countries take greater ownership of their health futures, donor countries should step up to support that transition – following the lead of countries that set their own priorities, and work alongside them to determine where outside support is most valuable,” said Naveen Rao, senior vice-president of the health initiative at the Rockefeller Foundation. “The Accra Reset shows how we can evolve to back country-led solutions while advancing our shared health and economic interests.”\nMahama notes in the report that the “past few years have shaken global health cooperation to its foundations”.\n“The Covid-19 pandemic exposed the risks created by concentrated production and unequal access to essential health products; rising debt and fiscal pressures have constrained national health budgets; and declining development assistance is placing programs and services under growing strain,” he continued, adding: “These shocks have brought new urgency to reform debates that have continued for years with limited progress. It was in this context that we launched the Accra Reset and its Sovereign Health Agenda – to give renewed political force to the reform agenda and place the agency of countries of the Global South at its centre.”\nThe report comes alongside a recent survey revealing the progressive attitudes many US citizens have towards foreign aid. Some 75% of Americans – including more than one in two (52%) who primarily support Donald Trump – agree that the US should restore disease prevention aid to contain the Ebola virus, according to polling of over 2,000 US adults commissioned by the Rockefeller Foundation.\nThe polling also revealed that 65% of US adults support international cooperation even if it means compromising some national interests; 64% also believe Americans have a shared responsibility to others, including people in other countries whom they do not know.\nThe Guardian has contacted the Department of Health and Human Services (HHS) for comment.", "translation_ja": "", "vocab": []}, {"title_ja": "Banished to alien lands: Trump’s secret deportation deals", "title_en": "Banished to alien lands: Trump’s secret deportation deals", "summary_ja": "After a plane journey in shackles, an Iranian woman found herself in the middle of Africa in a country she did not know existed. She is one of thousands deported from the US on the back of shadowy deals made with dozens of countries. An in-depth investigation reveals the ‘show of force’ costing Amer", "summary_en": "After a plane journey in shackles, an Iranian woman found herself in the middle of Africa in a country she did not know existed. She is one of thousands deported from the US on the back of shadowy deals made with dozens of countries. An in-depth investigation reveals the ‘show of force’ costing Amer", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/ng-interactive/2026/sep/21/trump-deportation-deals", "state_media": false, "category": "経済", "full_text": "Nika’s story\nNo one would tell the shackled detainees onboard the US immigration plane where they were going. The officers in charge would taunt them when they asked, they said. It was only when the seat-back video screens finally showed a map that the 18 migrants worked it out.\nTheir destination was Central African Republic (CAR), a country few of them had even heard of.\nNika, a 32-year-old Iranian woman, recalled how the handcuffs dug into her wrists. She begged the officers to loosen them, but they did not. Other passengers had it worse, she said. Some of the men were restrained in black and yellow body wraps, as if mummified, after resisting orders to get on the plane.\nNika, who had fled Iran 18 months earlier after protesting against its regime, had imagined the US as a place of sanctuary. Iran was already one of the most repressive countries in the world when she left, and its horrors had only deepened since then: security forces gunned down thousands of other demonstrators this year, then Donald Trump’s administration launched the war there.\nAfter more than a year locked up in a US immigration detention centre, Nika, whose name the Guardian has changed to protect her family in Iran, was granted legal protections and freed on a judge’s orders. Within two weeks, the Department of Homeland Security had rearrested her, and days later she was on the plane heading 7,000 miles east.\n“They never told me they were going to deport me [to] this country,” she told the Guardian. “I don’t know anything about Africa.”\nThe Department of State warns US citizens not to travel to CAR because it says it is too dangerous. Nika spends most of her days there under a form of self-imprisonment, too scared to venture out from her small bedroom as she waits for an answer to the question on which her life depends: will she be sent back to Iran, and to a regime that could kill her?\nNika is one of more than 25,000 people deported by the Trump administration to countries that are not their own. About 20,000 people have been bussed to Mexico, according to a count by Refugees International and Human Rights First. And more than 5,000 others have been put on flights to countries in Africa, Latin America, the Caribbean and central Asia to which they have no connection, and then, often, returned to the countries where US immigration judges had ruled their lives or liberty were at risk.\nHuman rights lawyers describe these so-called third-country national arrangements as part of a “show of force” by the US intended to discourage migrants and asylum seekers from entering. People from Peru and Colombia have been sent to the Democratic Republic of the Congo (DRC). On 20 August, four Cubans, a Brazilian and a Cameroonian refused to disembark in Liberia, and were sent to Equatorial Guinea instead.\nIn order to compile the most comprehensive account of a policy that has mostly operated behind closed doors, the Guardian joined 23 other media organisations in the Deportation Project, a joint investigation coordinated by Paris-based Forbidden Stories. The consortium interviewed more than 100 people affected by, or involved in, the US drive to extinguish unauthorised immigration, and reviewed documents outlining details of the agreements made by US officials with governments around the world.\nIt has tracked more than 100 flights that have carried migrants and asylum seekers to 28 different countries. This is likely to be an undercount as the consortium’s dataset only includes flights it was able to independently verify.\nThe pace of flights is increasing. After an initial wave during the opening months of the second Trump administration, the number of deportations spiked in August again when, according to a count by Human Rights First, a record 16 flights carried people to 13 different countries that were not their own.\nA US federal appeals court ruled on Friday that third-country removals were unlawful, arguing that they violated due process because people are not notified with enough time to mount a legal challenge to the decision to send them to another country. Human rights lawyers suggested this should immediately ground third-country deportation flights. The government is expected to appeal against the judgment, and to press ahead with its policy.\nA state department spokesperson said implementing the Trump administration’s immigration policies was a “top priority” and “we are unwavering in our commitment to end illegal and mass immigration and bolster America’s border security”. They added: “The US government will use all legal means to remove those with no right to remain in our country.”\nThe Trump administration has said the people it deports are criminals. Yet documents obtained by the Washington Post as part of this project show that a majority of the 35 countries that have signed deals with the US have said they will not accept migrants with violent criminal records.\n The people forced on to planes include those who spent most of their liv", "translation_ja": "", "vocab": []}, {"title_ja": "Men deported from US bound and beaten in Equatorial Guinea detention hotel, lawyers say", "title_en": "Men deported from US bound and beaten in Equatorial Guinea detention hotel, lawyers say", "summary_ja": "Group trapped at Hotel Bamy after US removal as rights groups sound alarm over poor conditions and violence Two men that the Trump administration expelled to Equatorial Guinea were bound, fitted with bags over their heads, beaten and pushed down a flight of stairs, all in plain view of other US depo", "summary_en": "Group trapped at Hotel Bamy after US removal as rights groups sound alarm over poor conditions and violence Two men that the Trump administration expelled to Equatorial Guinea were bound, fitted with bags over their heads, beaten and pushed down a flight of stairs, all in plain view of other US depo", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/18/us-men-deported-hotel-equatorial-guinea", "state_media": false, "category": "社会", "full_text": "Two men that the Trump administration expelled to Equatorial Guinea were bound, fitted with bags over their heads, beaten and pushed down a flight of stairs, all in plain view of other US deportees, according to witnesses and human rights lawyers.\nThe men – one from Egypt and one from Eritrea – were then taken to a prison. About 30 detainees from the US remain trapped at a hotel in the outskirts of the coastal city of Malabo after being deported from the US. Detainees have said they believe the men were beaten for telling the press and human rights advocates about the poor conditions and violence inside the hotel, and that they are haunted by flashbacks and terrified they will be retaliated against next.\nHuman rights advocates and experts have warned for months that conditions at the Hotel Bamy – a run-down establishment that has served as a detention center for US deportees – are dangerous.\nThe US has sent at least 66 people from different African countries, Cuba and Brazil to Equatorial Guinea, which has received $7.5m as part of a deal to cooperate with the US deportation program. The Trump administration has pursued dozens of similar deals with countries to take in immigrants that the US cannot deport directly to their home countries, where judges have deemed they would face torture or persecution. In the past, the US government allowed those people to live and work in the US indefinitely.\nThe Trump administration, however, has sought instead to expel them to third countries where they have no ties, do not speak the local language and have no legal status – trapping them in limbo.\nAdvocates have been especially concerned for deportees sent to Equatorial Guinea, where the authoritarian government is notorious for human rights abuses, including torture, according to the US state department. Detainees held at Hotel Bamy have told the Guardian that armed guards keep watch over them 24/7, and that they have not been provided any medical care or even fresh clothes since arriving there. One of the detainees, who has a severe stomach hernia that requires visits to the hospital to drain his stomach due to excessive fluid build-up, said he has been unable to see a doctor since arriving at Hotel Bamy.\nOther detainees have managed to obtain medication for HIV, diabetes and other conditions via human rights lawyers, but remain fearful that access to medications will be arbitrarily cut off.\nThe two men who were tortured – Ahmed Soliman, 31, of Egypt, and Samson Birhane, 47, of Eritrea – have since been transferred to a prison in Malabo. Multiple witnesses recounted that the police officers shouted, “Where is the phone? Where is the phone!” as they beat the men, who had initially been accused of breaking a mirror at the hotel before they were pulled aside and arrested.\nThe beating, which occurred on 11 September, followed the release of a video first reported by Reuters showing conditions at the hotel and the violent behavior of the guards. The detainees had been using cellphones to communicate with lawyers and the media about the conditions they were facing.\nIn the video taken by Soliman, which lawyers shared with the Guardian, authorities are seen pointing guns at the deportees. A Cuban man asked the officer for the return of his confiscated mobile phone so he could contact relatives and a lawyer, but was ignored. When officers noticed Soliman filming the exchange with his mobile phone, multiple officers rushed at him and others standing nearby, pointed their guns, and told Soliman to remain on his knees with his hands up for 10-15 minutes.\nIn another video, Soliman was able to film authorities forcibly sending US deportees to Ethiopia, where they are likely to face torture. When deportees resisted going with authorities, officials gave them the option to “go back to their home country” or “go to prison”. At least 12 people have been returned by Equatorial Guinea to their home country, where they face persecution.\nIn May, human rights experts at the United Nations issued a rare public appeal asking Equatorial Guinea to halt plans to return deportees to their home countries and to comply with international human rights standards and avoid refoulement, or the expulsion of people to countries where they face persecution.\n“This is a human rights catastrophe,” said Bella Mosselmans, director of the Global Strategic Litigation Council, who represents several of the deportees at Hotel Bamy. The US and Equatorial Guinea “must be held accountable for the atrocities they are committing”, she added.\nIn the week since Soliman and Birhane were beaten, police have also been searching the other detainees’ hotel rooms for cellphones, and have confiscated them. They have also barred lawyers from seeing the deportees. Authorities have told the 29 US deportees who remain at Hotel Bamy that they may never see Soliman or Birhane again, according to lawyers. One detainee who witnessed the beating said authorities treat them as if they ar", "translation_ja": "", "vocab": []}, {"title_ja": "Celebrities at the Pentagon: How unusual was the Paul brothers’ visit?", "title_en": "Celebrities at the Pentagon: How unusual was the Paul brothers’ visit?", "summary_ja": "Logan and Jake Paul face social media backlash after Pentagon visit with Pete Hegseth.", "summary_en": "Logan and Jake Paul face social media backlash after Pentagon visit with Pete Hegseth.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/economy/2026/9/22/celebrities-at-the-pentagon-how-unusual-was-the-paul-brothers-visit?traffic_source=rss", "state_media": false, "category": "IT", "full_text": "Celebrities at the Pentagon: How unusual was the Paul brothers’ visit?\nLogan and Jake Paul face social media backlash after Pentagon visit with Pete Hegseth.\nInfluencers Logan and Jake Paul are the latest celebrities to visit the Pentagon, where they addressed troops and met with United States Defense Secretary Pete Hegseth.\nThe Paul brothers, who made the visit on Thursday, are content creators and are also known for combat sports. They shared photos and videos of the visit over the weekend on social media. The posts also included images from a separate meeting with US Treasury Secretary Scott Bessent.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Could US pull one-third of troops from Europe? What that would mean\n- list 2 of 4Trump says US has ‘permanent control’ of Greenland security: Does it?\n- list 3 of 4Influencers Jake and Logan Paul visit the Pentagon\n- list 4 of 4US strikes on alleged drug boats may be ‘crimes against humanity’, UN says\nIt remains unclear why the two visited the Pentagon, but the appearance comes amid a broader push to promote martial arts and physical fitness among service members, including efforts to recruit troops to attend the UFC event held at the White House in June.\nThe visit also comes ahead of the “State of the Force” address, Hegseth’s annual speech to troops slated for later this month. The Wall Street Journal reported last week that Hegseth asked commanders to nominate troops to attend the address, where they could also have the opportunity to “work out” with him.\nIs it unusual for a celebrity to visit the Pentagon?\nCelebrities and other public figures have visited the Pentagon during multiple administrations.\nIn 2019, during US President Donald Trump’s first term in office, actor Milo Ventimiglia of the television show This Is Us visited the Pentagon to discuss ways to strengthen the “civilian-military connection”. In 2018, actor Gerard Butler also visited the Pentagon to discuss his film Hunter Killer, which was made in collaboration with the US Navy.\nGene Simmons, the frontman of the band KISS and a prominent supporter of the military and veterans, visited the Pentagon in 2019 and addressed service members and reporters in the press room.\nSuch visits also took place during the administration of former US President Joe Biden, a Democrat. Actor David Boreanaz toured the Pentagon in October 2024 as part of a United Service Organizations (USO) tour, in which celebrities, musicians and other public figures travel to military bases around the world to entertain US service members. Boreanaz was there in connection with his role in the television series SEAL Team.\nDuring the administration of former US President Barack Obama, the Pentagon also shared information with filmmakers Mark Boal and Kathryn Bigelow on the hunt for Osama bin Laden, details that they used in the making of Zero Dark Thirty, a film about the operation that led to bin Laden’s killing. The visit was controversial because it gave the filmmakers unusually extensive access to the Pentagon’s workings.\nAre the Paul brothers particularly controversial?\nThe Paul brothers have been embroiled in controversy for years. Last week, Jake Paul said the Second Amendment of the US Constitution, which protects the right to bear arms, needs “updating”, claiming that shotguns and pistols would not be able to “upthrow” the government if needed, as weapon systems become more advanced.\n“We maybe need to be able to bear more advanced weapons systems as citizens,” Paul told an influencer at the All-In Summit.\nIn 2023, the Securities and Exchange Commission (SEC) charged Jake Paul over his promotion of Tronix (TRX), a cryptocurrency created by crypto entrepreneur Justin Sun. The SEC said he failed to disclose that he was paid about $25,000 in cryptocurrency to promote it in 2021 on X, then known as Twitter.\nThe brothers built their fame in part through stunts designed to attract attention. Logan Paul, for example, posted a video on YouTube that showed the body of an apparent suicide victim in Japan’s Aokigahara forest, colloquially dubbed the “suicide forest”, and made jokes at the victim’s expense before eventually removing the video.\nJake Paul was charged with trespassing after he was filmed inside an Arizona shopping mall during unrest and looting amid nationwide Black Lives Matter protests over the killing of George Floyd by a Minneapolis police officer in May 2020. The charges against Jake Paul were later dropped.\nWhat has the reaction been to the visit?\nThe visit prompted backlash. Adam Kinzinger, a former Republican congressman, reposted a video of the visit, writing, “We aren’t a serious country at the moment.”\nProgressive media outlet MeidasTouch Network also criticised the visit, writing, “Idiocracy didn’t go far enough,” in response to the clip.\nThe comments were among widespread criticism on social media in response to the brothers’ visit.\nIn a lengthy post of his own, Jake Paul pushed back against the criticism.\n", "translation_ja": "", "vocab": []}, {"title_ja": "US Republican calls for probe into Donald Trump Jr’s business dealings", "title_en": "US Republican calls for probe into Donald Trump Jr’s business dealings", "summary_ja": "US Senator John Curtis&#039;s letter marks a rare effort by a member of the president&#039;s own party to hold him accountable.", "summary_en": "US Senator John Curtis&#039;s letter marks a rare effort by a member of the president&#039;s own party to hold him accountable.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/22/us-republican-calls-for-probe-into-donald-trump-jrs-business-dealings?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US Republican calls for probe into Donald Trump Jr’s business dealings\nUS Senator John Curtis’s letter marks a rare effort by a member of the president’s own party to hold him accountable.\nA member of Donald Trump’s political party has issued a rare call for a congressional investigation into the foreign dealings of the United States president’s eldest son.\nUS Senator John Curtis, a Republican from the state of Utah, on Tuesday said “questions have arisen” about Donald Trump Jr’s relationships with foreign business figures and acceptance of “significant gifts”, alleging he may have personally benefited from his relationship with the president.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Trump says he could be impeached if Republicans lose Congress in midterms\n- list 2 of 3US president’s son Eric Trump invests in drone maker with gov’t contracts\n- list 3 of 3US President Trump, family granted immunity from pending tax audits\nIn a letter to the Republican and Democratic leaders of the US Senate Judiciary Committee, Curtis referenced a ProPublica report that found Trump Jr’s Bahamian wedding party in May was funded by a Russian oligarch.\n“These reports raise legitimate questions about foreign access to members of a sitting president’s family and whether such relationships can create actual or perceived expectations of favorable treatment,” Curtis wrote. “They also may create expectations of a returned favor that would not be in the best interests of the American people or our allies, and could even create national security vulnerabilities.”\nThe letter comes as a small but slowly growing number of Republicans have spoken out against Trump, who has largely avoided criticism from members of his own party. But record-low approval ratings sparked by the war in Iran and concerns over the cost of living in the US have forced some Republicans to reconsider that support as they face growing prospects of major losses in the congressional midterm elections.\nIf Democrats retake one, or both, chambers of the US Congress in November, investigations into Trump, including his family’s dealings, are likely. But those probes are less likely under Republicans wary of the president’s wrath.\nA spokesperson for the Senate Judiciary Committee, which is under Republican control, told the Associated Press that it had received Curtis’s letter but did not say whether there would be an investigation.\nTrump vs Biden\nCurtis, who isn’t up for re-election until 2030, also called on the chamber’s panel to subpoena Trump Jr, as well as the son of former US President Joe Biden, a Democrat.\n“The country should not have to accept one standard for the family of a Republican president and another for the family of a Democratic president,” Curtis wrote, referencing the scrutiny and investigation Biden’s son Hunter faced from Republicans.\nHunter Biden responded to Curtis’s letter in a post on social media, calling for the Senate committee to “bring it on” as he vehemently denied any foreign business dealings while his father was president.\n“I’ll sit next to Don Jr. and testify any time, any place,” Biden wrote on X as he called for the president’s youngest son, Eric, and son-in-law, Jared Kushner, who serves as a US envoy, to testify as well. “No need for a subpoena. Let’s all do it tomorrow.”\nAfter the ProPublica report, Trump Jr and his wife, Bettina, released a joint statement on social media saying the Russian oligarch, Umar Kremlev, was a “dear friend” who “very generously hosted two incredible nights of celebrations for us AFTER our wedding”.\nThe president, who did not attend the wedding, said his son had reimbursed Kremlev.\n“It’s totally allowed, and a lot of people give parties and things like that — but it’s totally allowed,” Trump said. “But as I understand it, he paid him back. He didn’t want it.”\nUS Senator Dick Durbin, the ranking member on the Senate Judiciary Committee, said that while Biden’s son “has already given a sworn deposition to Congress”, Trump Jr “has not”.\n“For the committee to ignore this matter is to run the risk of being complicit in a coverup,” Durbin said. “I will join in supporting Senator Curtis’ request of the Senate Judiciary Committee.”\nCurtis’s office did not immediately reply when asked by Al Jazeera what prompted the senator’s letter and whether any fellow Republicans have indicated if they would support an investigation into the president’s family.", "translation_ja": "", "vocab": []}, {"title_ja": "Palestinian Americans meet US lawmakers as Trump seeks $2.8bn for Israel", "title_en": "Palestinian Americans meet US lawmakers as Trump seeks $2.8bn for Israel", "summary_ja": "Organisers say more than 300 constituents met with House and Senate members from 26 states to demand US policy shift.", "summary_en": "Organisers say more than 300 constituents met with House and Senate members from 26 states to demand US policy shift.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/22/palestinian-americans-meet-us-lawmakers-as-trump-seeks-2-8bn-for-israel?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Palestinian Americans meet US lawmakers as Trump seeks $2.8bn for Israel\nOrganisers say more than 300 constituents met with House and Senate members from 26 states to demand US policy shift.\nWashington, DC – Palestinian Americans have held a day of advocacy at the United States Capitol under the spectre of a new $2.8bn arms transfer to Israel reportedly approved by the administration of US President Donald Trump.\nThe Americans for Justice in Palestine Action (AJP Action) group, which organised Tuesday’s event, said more than 300 constituents from across the country met with the offices of more than 100 US lawmakers. They advocated on behalf of a slate of legislative initiatives related to Israel’s genocidal war in Gaza, surging Israeli settler violence in the occupied West Bank, and efforts to use immigration law to stifle Palestinian advocacy in the US.\nRecommended Stories\nlist of 3 items\n- list 1 of 3UN Chief condemns Gaza destruction, West Bank settlements\n- list 2 of 3Trump: ‘My honour to settle eight wars’ including ‘war in Gaza’\n- list 3 of 3Erdogan slams Israel’s ‘genocidal mindset’ in blistering UN address\nJenna Escheik, a 19-year-old meeting with lawmakers and staffers from Virginia, including Democratic Senator Tim Kaine and Republican Representative Rob Wittman, said she was planning to speak with “some very challenging and interesting people”.\n“I think the main point that we’re trying to get across to every single office is that we’re all proud to be American, and we all have our taxpayer dollars that we just don’t want to see going to wars,” said Eschiek, who is originally from outside of Ramallah in the West Bank.\nYaseen Shaikh, a 22-year-old who travelled with a delegation from Cleveland, Ohio, said he will be meeting with the offices of Republican Senator Jon Husted, who faces a competitive midterm race against former Democratic Senator Sherrod Brown, as well as the state’s other Republican Senator, Bernie Moreno.\nBoth Republican senators have consistently voted against legislative efforts to limit arms sales to Israel.\n“As I stand among my peers here, among people who I stand on their shoulders, I can only feel hopeful and optimistic that we will make a difference and that change will come,” Shaikh told Al Jazeera.\n“We just have to be vehicles for that,” he said.\nPalestinian rights ‘catching up’ with lawmakers\nSuccessive presidential administrations, as well as Congress, have for decades resisted calls to condition US military aid to Israel, including throughout Israel’s latest war in Gaza, which will reach its three-year mark early next month.\nTo date, nearly 74,000 Palestinians have been killed in Gaza since October 7, 2023, with nearly 1,400 killed since a “ceasefire” agreement went into effect in October 2025.\nLast week, US media widely reported the Trump administration approved a US taxpayer-funded $2.8bn military package to Israel, which included 907kg (2,000-pound) MK-84 bombs known to have already caused widespread civilian devastation in the Palestinian enclave.\nThe package reportedly included 20,000 of those munitions, as well as 20,000 BLU-117s, a close variant.\nSeveral Democrats have vowed to block the transfer, with the ranking member of the House Foreign Affairs Committee, Gregory Meeks, using his leverage last week to at least slow congressional clearance.\nOsama Abu Irshaid, AJP Action’s executive director, said the new weapons package runs counter to public opinion polls, which have regularly found majority support for conditioning at least some weapons to Israel, as well as surging support for Palestinian rights.\nAbu Irshaid said the polls underscore a new political reality for lawmakers.\n“I think now we are functioning within this context, where what happens in Palestine, the genocide that took place and continues to take place, what the terrorist settlers are doing in the West Bank, what the US and Israel are doing in the Middle East is catching up with us here,” Irshaid said, “and we’re paying a price”.\nWhile entrenched support for arming Israel has persisted among some segments of the Democratic Party, advocates have hailed what they see as a historic shift in recent months.\nIn July of last year, 26 Democrats in the Senate voted to block some arms transfers to Israel, the first time in history a majority of Democratic lawmakers in the chamber did so. In April, similar resolutions gained a record 40 votes in the Senate, all Democrats, but ultimately failed to pass in the 100-member chamber.\nThe so-called Block the Bombs Act in the House, which calls for a partial arms embargo against Israel, reached 81 co-sponsors as of August.\nTwenty-two Democratic senators also introduced a resolution last week to force the US Department of State to conduct an investigation into the violence committed by Israeli forces and settlers in the West Bank, in which at least nine US citizens have been killed in recent years.\nAbu Irshaid was optimistic that headway could also be made among Repu", "translation_ja": "", "vocab": []}, {"title_ja": "Macron urges world to choose UN over ‘law of the jungle’", "title_en": "Macron urges world to choose UN over ‘law of the jungle’", "summary_ja": "‘What is our credibility worth if we remain inactive on Gaza; some claim that peace has been achieved, but this has not opened up humanitarian deliveries; it is a spectacle that shames us all,’ said Emmanuel Macron", "summary_en": "‘What is our credibility worth if we remain inactive on Gaza; some claim that peace has been achieved, but this has not opened up humanitarian deliveries; it is a spectacle that shames us all,’ said Emmanuel Macron", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/macron-urges-world-to-choose-un-over-law-of-the-jungle/article71497347.ece", "state_media": false, "category": "政治", "full_text": "French President Emmanuel Macron called Tuesday (September 22, 2026) for countries to recommit to international laws and the UN system over a resurgent \"law of the jungle.\"\nMr. Macron, giving his last speech to the UN's signature annual diplomatic gathering as president, also railed against the humanitarian situation in Gaza while calling for a moratorium on strikes against civilian and energy targets in the Ukraine-Russia war.\n\"The question put to us, in very simple terms, is whether we want to live in this state of nature, with a kind of return to the law of the jungle, or in a civilized international society,\" he said.\n\"My message is to stand firm. Do not yield to the situation which is developing...The rhetoric of defeat that is giving way to abuse of power by empires, threatening the sovereignty of some nations,\" Mr. Macron said.\nThe French President, who has been a stalwart supporter of Ukraine and raised the country's case in a meeting with U.S. President Donald Trump on Monday (September 21), called for Moscow and Kyiv to agree to a moratorium on striking civilian and energy targets.\n‘Barbaric acts’\n\"We've seen the destruction of civilian infrastructure, human rights violations. It's a new era of barbaric acts,\" he said.\n\"We must protect the civilian population, and this is why we'd like to express our support for a double moratorium, a moratorium on strikes on energy and civilian infrastructure,\" he added.\nHe also raised the plight of the Palestinian people in Gaza.\n\"What is our credibility worth if we remain inactive on Gaza? Some claim that peace has been achieved, but this has not opened up humanitarian deliveries. It is a spectacle that shames us all,\" he said.\nFollowing several other leaders at the UN rostrum who had raised alarm about the risks posed by artificial intelligence, Mr. Macron proposed an alternative architecture for its development.\n\"I don't want anyone to become the vassal of one of the great powers. Rather, we must come together to build an open-source frontier model, a cutting-edge model,\" he told the UN General Assembly, apparently in reference to AI powerhouses China and the U.S.\n\"Our investment capabilities must be pooled to build a cutting-edge open-source AI model, which we will share. We should not depend on somebody else.\"\nPublished - September 23, 2026 03:22 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "PhonePe secures UAE central bank approval for two payment licences", "title_en": "PhonePe secures UAE central bank approval for two payment licences", "summary_ja": "The digital payments firm will now work towards obtaining final approval before commencing commercial operations in the United Arab Emirates", "summary_en": "The digital payments firm will now work towards obtaining final approval before commencing commercial operations in the United Arab Emirates", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/business/phonepe-secures-uae-central-bank-approval-for-two-payment-licences/article71496967.ece", "state_media": false, "category": "政治", "full_text": "Fintech major PhonePe on Tuesday (September 22, 2026) announced that it has secured in-principle approval from the Central Bank of the UAE for two key operating licences, marking its first international expansion footprint.\nThe in-principle approval covers retail payment services and card schemes (RPSCS), as well as stored value facilities (SVF), the company said in a statement.\nThe digital payments firm will now work towards obtaining final approval before commencing commercial operations in the United Arab Emirates.\nUpon securing final regulatory clearances, PhonePe plans to partner with regional banks, licensed payment service providers, and local technology vendors.\nThe company also intends to explore opportunities to support the UAE's domestic payment rails, Aani and Jaywan, by leveraging its full-stack technology platform.\n\"The country’s vision and regulatory environment make it an ideal setting for our international journey. As the UAE advances toward an interconnected, digital-first economy, PhonePe aims to be a committed, long-term partner supporting its evolving ecosystem. By combining world-class technology with local partnerships, PhonePe intends to support the strong economic and trade corridors connecting the UAE, India, and global markets, while striving to deliver elevated everyday payment experiences across the Emirates,\" Ritesh Pai, CEO and Executive Director, International Payments at PhonePe, said.\nAt present, PhonePe enables outbound Indian travellers in the Emirates to scan local QR codes and make instant payments across NEOPAY and Network International terminals through a partnership with NPCI International Payments Limited (NIPL).\nPublished - September 22, 2026 11:02 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "Nicaraguan government responsible for at least 8 deaths in custody since 2018, U.N. report finds", "title_en": "Nicaraguan government responsible for at least 8 deaths in custody since 2018, U.N. report finds", "summary_ja": "A U.N. report says the Nicaraguan government is responsible for at least eight deaths in custody since 2018", "summary_en": "A U.N. report says the Nicaraguan government is responsible for at least eight deaths in custody since 2018", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nicaraguan-government-responsible-for-at-least-8-deaths-in-custody-since-2018-un-report-finds/article71496902.ece", "state_media": false, "category": "政治", "full_text": "The Nicaraguan government is responsible for at least eight deaths in custody since 2018 when it began a major crackdown on dissent and a dismantling of democratic institutions, U.N. experts said on Tuesday (September 22, 2026).\nThe report from the U.N. Group of Human Rights Experts on Nicaragua was the latest condemnation of the government of co-Presidents Daniel Ortega and Rosario Murillo, which has crushed dissent since 2018 mass protests and recently canceled elections.\n“A State that resorts to enforced disappearance and allows persons to die in its custody falls short of the minimum human rights standards required for credible democratic governance,” said Jan-Michael Simon, the group’s chair.\nThe report detailed inconsistencies in the government’s account of the in-custody death of Indigenous Miskito leader Brooklyn Rivera, who was imprisoned for 32 months with almost no contact with his family before he died in May.\nThe official statement after his death linked it to complications following a previous COVID-19 infection, which previous statements in the days before never mentioned. An independent assessment from Physicians for Human Rights said the explanation was “not medically coherent.”\nIts assessment also found that the “timing of the illness and the pattern of organisms identified both point to the infections having been acquired in custody or in hospital, rather than in the community.”\nThe statements around his death could not be independently verified because no independent investigation or autopsy was ordered, the report said. Its authors called on the government to release Rivera’s body to his family for a burial under Miskito traditions.\nMs. Murillo said Rivera received medical care and family support throughout his illness.\nFollowing a request for comment on the allegations, Nicaragua’s government sent an email statement declining to respond and saying only “thanks for your interest.”\nThe report also detailed the failures of care in the deaths of Ortega’s estranged brother Humberto Ortega, former Sandinista guerrilla fighter Hugo Torres and lawyer Carlos Cárdenas Zepeda.\nThe experts documented the disappearance of at least 161 people since 2018. It called on the government to release information on 29 people whose whereabouts remain unknown and to release anyone detained on political grounds.\nPublished - September 22, 2026 10:20 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "New Toronto election poll shows mayoral race getting tighter - Toronto Star", "title_en": "New Toronto election poll shows mayoral race getting tighter - Toronto Star", "summary_ja": "New Toronto election poll shows ma
