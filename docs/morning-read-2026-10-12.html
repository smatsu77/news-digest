irport in eastern Saudi Arabia, their military spokesman Brig Gen Yahya Saree said.\nHe vowed to continue the \"escalating operations deep inside Saudi Arabia\", warning that all Saudi airports were potential targets apart from those in the holy cities of Mecca and Medina.\nThe Houthis have said they are targeting Saudi Arabia over its support for government forces in Yemen's civil war, as well as an air strike on the airport in Sanaa.\nOn Sunday Maj Gen Turki al-Maliki, spokesman for the Saudi-led military coalition, said air defences had intercepted a missile near the airport in Riyadh, while authorities were dealing with the fire caused by an \"unknown projectile\" that hit Passenger Hall No 4.\nUS President Donald Trump has said the US would \"make a decision\" and \"move very quickly\" on whether to strike the Houthis, while UK Defence Secretary Wes Streeting suggested the UK could \"potentially\" provide more support for Saudi Arabia.\n- Riyadh airport attack another dangerous moment in already tense conflict \n  - Published8 hours ago\n- Who are the Houthis and what do they want? \n  - Published24 September\nSaturday's strike was the deadliest single attack on a Gulf Arab country since the war between Israel, the US and Iran began in February. The Saudi-led coalition vowed to respond, calling it a \"war crime\".\nFour Saudi nationals, two people from Bangladesh and one person each from the US, Jordan, Palestine, Syria, Sudan and Egypt were among the dead, the Saudi civil aviation authority said.\nThe Indian embassy in Saudi Arabia said on Sunday that an Indian man had succumbed to the injuries he sustained in the attack.\nUS Secretary of State Marco Rubio condemned the attacks and confirmed that a US citizen was killed in the strikes. Foreign Secretary Ed Miliband said he was \"appalled\".\nThe UK Foreign Office is advising against all travel to parts of Saudi Arabia, including areas within 10km (6.2 miles) of the border with Yemen, while other western embassies have warned their nationals about travel in the region.\nHouthi-run Al Masirah TV said \"the Saudi enemy\" had launched an air strike on Sanaa International Airport in Yemen's capital. A residential home in the city was also struck, killing a child and injuring six people, the media outlet reported.\nSaudi Arabia has not confirmed the attacks and the BBC has been unable to verify this report.\nAbdullah Al-Alimi Bawazir, vice-president of Yemen's internationally recognised government, called for \"decisive actions\" from regional and international partners.\nRiyadh's airport was struck on Thursday, an attack that killed three Saudi nationals. The Houthis claimed responsibility and said they had used cruise missiles to target the airport.\nThere were two other deadly attacks on Saudi airports in Abha and Riyadh in the two days prior to that.\nThe latest uptick in violence comes after a temporary ceasefire between the Houthis and Saudi-led forces, brokered in 2022, collapsed in July.\nThe conflict worsened after the Houthis seized strategically important stretches of the Red Sea coast in a rapid offensive, prompting Saudi strikes. Yemeni pro-government forces later said they had secured the regions.\nThe Houthis currently control around a quarter of Yemeni territory and as much as 80% of the country's population. The Iran-backed armed group hopes to eventually seize complete control.\nSaudi Arabia fears this would lead to the establishment of an Iranian satellite state on its southern border.\nIran's Foreign Minister Abbas Araghchi told his Saudi Arabian counterpart on Sunday that his country was ready to provide assistance to \"facilitate dialogue between Saudi Arabia and Yemen\", referring to the Houthi administration.\n  - Published5 days ago\n  - Published27 September\n  - Published16 September", "translation_ja": "", "vocab": [{"word": "projectile", "definition": "発射体、ミサイルなどの飛行物体を指す。軍事文脈で頻繁に使用される。"}, {"word": "escalating", "definition": "段階的に増加・拡大していくことを意味する。紛争や状況が悪化する過程を表す。"}, {"word": "intercept", "definition": "飛行中のミサイルなどを途中で捕捉・撃墜することを指す。防御システムの文脈で使用される。"}, {"word": "coalition", "definition": "共通の目的のために一時的に結成された連合体・同盟を意味する。政治・軍事的な提携を表す。"}, {"word": "casualties", "definition": "戦闘や事故による死傷者を指す。特に複数の被害者がいる状況で使用される。"}]}, {"title_ja": "Poland detains man suspected of planning assassination of PM Tusk", "title_en": "Poland detains man suspected of planning assassination of PM Tusk", "summary_ja": "Police received credible information about possible attacks against Donald Tusk and his defence minister.", "summary_en": "Police received credible information about possible attacks against Donald Tusk and his defence minister.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6n9rvynl5p5o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Poland detains man suspected of planning assassination of PM Tusk\n- Published\nPoland's Prime Minister Donald Tusk said a man accused of plotting an assassination attack against him and his defence minister has been detained.\nThe interior ministry earlier reported that police had received credible information about possible attacks against Tusk and Wladyslaw Kosiniak-Kamysz.\nPolish security services convened a special meeting on Sunday after receiving information about the planned attacks, with a spokesman saying officials were treating the threat as \"deadly serious\".\nTusk thanked the police for \"swift and decisive action\" in arresting the suspect.\nThe suspect was arrested in the Lower Silesia region and was a Polish national, Jacek Dobrzynski, a spokesman for the Special Services Co-ordinator told local media.\n\"In this case we are talking about a strong likelihood that these threats could actually be carried out,\" he said.\nThe plan was uncovered when an email with information about the potential attack was forwarded to police by the State Protection Service, which is responsible for ministers' security, Interior Ministry spokeswoman Karolina Galecka said.\nTusk has been Polish prime minister since 2023, having previously held the office from 2007 to 2014.\nHe served as president of the European Council from 2014 to 2019.\nRelated topics\n  - Published8 hours ago", "translation_ja": "", "vocab": [{"word": "detain", "definition": "身柄を拘束する、逮捕する。犯罪や違法行為の容疑で一時的に拘束することを指す。"}, {"word": "credible", "definition": "信頼できる、信憑性がある。情報や証拠などが信頼できる根拠があることを表す。"}, {"word": "convened", "definition": "会合を召集する、集める。会議や集会を開催するために人々を集めることを意味する。"}, {"word": "uncovered", "definition": "明かにする、発見する。秘密や隠されたことが明らかになることを表す。"}, {"word": "likelihood", "definition": "可能性、起こりそうな見込み。何かが起こる確率や可能性を表す。"}]}, {"title_ja": "PM says it is 'clear' Russia interfered with Brexit vote", "title_en": "PM says it is 'clear' Russia interfered with Brexit vote", "summary_ja": "He says voters were not \"sufficiently\" informed about how foreign actors sought to disrupt UK democracy.", "summary_en": "He says voters were not \"sufficiently\" informed about how foreign actors sought to disrupt UK democracy.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6jdm3zggl0ko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "PM says it is 'clear' Russia interfered with Brexit vote\n- Published\nAndy Burnham has said Russia did interfere with the Brexit referendum and warned that similar activities were taking place in France and Germany.\nThe prime minister told The Rest is Politics podcast, external that upon arriving in No 10, he had asked about possible Russian interference in the 2016 vote, adding: \"I've had the clear answer that, yes, there was.\"\n\"I think we've been too much on the back foot on that actually and we haven't informed people sufficiently about the extent to which people are seeking to disrupt the political process from overseas,\" he added.\nBurnham did not provide further details about the type or extent of Moscow's activity during the Brexit referendum.\nBritain Unbound, a pro-Brexit campaign group, said Burnham's comments were \"another crude attempt to undermine the legitimacy of the decision that the British people made in 2016\".\nIt said that foreign interference in UK elections was \"obviously unacceptable\" but added: \"There is no good reason to believe that Russian intervention influenced the outcome of the referendum in 2016.\n\"It is also insulting to suggest that voters were so easily duped.\"\nIn his interview, due to be released on Monday, Burnham said he had discussed the problem of Russian interference with Chancellor Friedrich Merz during his visit to Germany earlier this week.\n\"There is certainly misinformation, disinformation that is emanating from Russia into German politics,\" he said.\nHe continued: \"These things are important now to put clearly on the record and I believe help voters in Germany and France understand that some of this politics is instigated via our enemies, namely Russia.\"\nIt is the first time a UK prime minister has said Russia sought to sway the 2016 Brexit poll but there have long been warnings about efforts by the Kremlin to exert influence on UK politics.\nIn 2020, Parliament's Intelligence and Security Committee published a report into Russian interventions in UK elections and referendums.\nIt did not provide a definitive conclusion on whether Russia had attempted to influence the results of the EU referendum but did criticise successive governments for failing to fully assess or counter the threat.\nIn response, the Russian foreign minister dismissed the report out of hand and called it \"Russophobia\".\nAnd a Kremlin spokesman said Russia did not meddle in other countries' elections.\nIn the same year, however, the then-Conservative government said it was \"almost certain that Russian actors sought to interfere\" in the 2019 general election.\nBBC Verify has tracked Russian-linked disinformation campaigns including using AI to create fake videos which impersonate journalists and news organisations reporting on Ukraine.\nOne fake news website falsely claimed that Ukrainian President Volodymyr Zelensky had bought a mansion owned by King Charles at a discounted price.\nEarlier this year, Vijay Rangarajan, head of the UK Electoral Commission, told MPs that Russian deepfake videos had been \"used extensively in elections around the world\".\n\"There is no reason to assume Britain would be an exception,\" he added.\nLast month, during his speech to the United Nations, Burnham accused Russian agencies of using \"every means at their disposal to spread lies and disinformation and prey on people's fears\".\nHe announced that the UK would set up a new centre to \"stem the poisonous tide\" of disinformation.\nA Downing Street spokesperson said: \"We are focused on ensuring our citizens and our institutions are protected from foreign powers and their proxies seeking to threaten lives and undermine our democratic values.\n\"We are doing this by strengthening our powers through the National Security Act, strengthening the resilience of our institutions and critical national infrastructure, strengthening our borders, and strengthening our police and intelligence agencies.\"\n- The AI videos supercharging Russia's online disinformation campaigns \n  - Published27 February\n- Is Burnham right to blame Russia for spreading online disinformation? \n  - Published23 September\n- UK to fight Russian disinformation and push new global AI standards, Burnham says \n  - Published23 September\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": [{"word": "interfered", "definition": "干渉する、妨害する。政治的なプロセスや選挙などに外部から不正な影響を与えることを意味する。"}, {"word": "emanating", "definition": "発生する、流出する。情報や影響などが特定の源から広がることを表す。"}, {"word": "definitive", "definition": "決定的な、最終的な。疑問の余地がない、明確で決まった判断や結論を意味する。"}, {"word": "successive", "definition": "連続した、次々と続く。複数の政府や世代などが順番に続くことを表す。"}, {"word": "meddle", "definition": "干渉する、ちょっかいを出す。他国の政治などに不適切に関与することを意味する。"}]}, {"title_ja": "Wildlife park remains closed after fatal tiger attack", "title_en": "Wildlife park remains closed after fatal tiger attack", "summary_ja": "Yorkshire Wildlife Park remains closed after a man entered the tiger enclosure and was fatally attacked on Saturday.", "summary_en": "Yorkshire Wildlife Park remains closed after a man entered the tiger enclosure and was fatally attacked on Saturday.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmgr8221v4x1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Wildlife park remains closed after tiger attack\n- Published\nYorkshire Wildlife Park remains closed after a man climbed into a tiger enclosure and was fatally attacked by the animal.\nEmergency services were called to the park near Doncaster, South Yorkshire, at about 13:30 BST on Saturday after reports of a man climbing down into the enclosure from a walkway.\nAn eyewitness described seeing the man wearing headphones and \"pacing around\" near the enclosure before he went in and was attacked. Police said the man sadly died at the scene.\nA park spokesperson said their \"thoughts and heartfelt sympathies\" remain with the man's family and confirmed the Amur tiger, called Altai, remained in the enclosure and would not be euthanised.\nThe spokesperson says many people had contacted them about the tiger and he was safe and well.\nStaff who were at the scene who were \"deeply affected by events\" would receive specialist support, they added.\nSouth Yorkshire Police said the man's family were being supported by officers. \"Our thoughts are with them at this distressing time,\" the force said in a statement.\nIt added: \"We are aware of videos circulating online and we would encourage people not to share this footage.\"\nEarlier on Saturday, in a statement posted on its website, the park said its emergency response procedures had been \"immediately activated\" and it was \"working closely with the authorities to ascertain exactly what happened\".\nElla Ford, 24, from Moreton, Wirral, had visited the park with her boyfriend and filmed the tiger moments before the attack.\nShe described seeing a man by the tiger enclosure \"pacing around with his headphones in\".\nA few minutes later, she saw the same man had \"climbed up onto the barriers\".\nA woman was close by talking to him, she said, before \"he jumped in and crawled in front of the tiger, where the tiger was perched and just lay there\".\nFord said she then witnessed the tiger grab hold of the man, who she reported as \"shouting for help\".\nShe estimates around 15 to 20 people were on the enclosure's raised visitor walkway before staff quickly evacuated the area, and shortly afterwards, the park.\nShe described members of the public as being \"confused, like what on earth's going on?\"\n\"I just know some man was obviously trying to bang on the fence to try and deter the tiger away, but it obviously wasn't doing anything,\" she said.\nKarmelle Pelham, 39, from Worksop, had been enjoying a family day out when park staff told them the site was being evacuated.\nShe said she had heard what sounded like \"gunshots\" and an air ambulance had circled above.\nPelham added: \"There was a big, black tarpaulin over the tiger enclosure.\"\nShe praised park staff for their handling of the incident, saying it had been \"very, very well organised\".\nForeign Secretary and MP for Doncaster North Ed Miliband said he was \"deeply saddened\" to hear of the incident and sent his \"thoughts and deepest condolences to the family of the individual who died.\"\nHe added he was \"very grateful to the emergency services and staff of the park who responded.\"\nLee Pitcher, MP for Doncaster East and the Isle of Axholme, expressed his gratitude to emergency services for their response.\nIn a statement shared to social media, he said he was \"deeply saddened to hear about the tragic incident that has taken place at Yorkshire Wildlife Park today\".\nYorkshire Wildlife Park opened in 2009, with its Land of the Tigers area opening in 2011.\nThe purpose-built two-acre reserve is home to Amur tigers, an endangered subspecies with around 500 left in the wild.\nPhotos of the enclosure on the park's website shows a high walkway for visitors and fencing above the section where the tigers can roam.\nAdditional reporting by James Kelly\nGet in touch\nDid you witness the incident or do you have information that could help our reporting?\nRelated topics\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "enclosure", "definition": "動物を飼育するために柵や壁で囲まれた場所。野生動物公園やペット施設で使用される。"}, {"word": "euthanised", "definition": "苦痛を軽減するために動物の生命を意図的に終わらせること。医学的または人道的な理由で行われる。"}, {"word": "ascertain", "definition": "事実や情報を確認し、確実に知ること。調査や確認を通じて真実を明らかにする。"}, {"word": "evacuated", "definition": "危険な場所から人々を迅速に移動させること。緊急時に安全な場所へ人を移す行動。"}, {"word": "circulating", "definition": "情報やコンテンツが多くの人の間で広がり、共有されること。特にインターネット上で拡散する状況を指す。"}]}, {"title_ja": "Burnham to release details of Man City meetings", "title_en": "Burnham to release details of Man City meetings", "summary_ja": "Andy Burnham has faced criticism for comments he made in the wake of Manchester City being found guilty of all charges related to breaches of the Premier League's financial rules.", "summary_en": "Andy Burnham has faced criticism for comments he made in the wake of Manchester City being found guilty of all charges related to breaches of the Premier League's financial rules.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/sport/football/articles/c962y5nd273no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Burnham to release details of Man City meetings\n- Published\nPrime Minister Andy Burnham has said he will release details of his meetings with senior figures at Manchester City following criticism of his comments in the wake of the club being found guilty of all charges related to breaches of the Premier League's financial rules.\nAn independent commission found City had broken rules over a nine-year period between 2009 and 2018 by creating \"sham\" contracts with commercial partners to secretly funnel more than £830m into their football operations.\nBurnham's previous role as mayor of Greater Manchester has led to questions about his relationship with City's Abu Dhabi ownership, with Conservative leader Kemi Badenoch demanding No 10 release all details of meetings between the prime minister and senior figures at the club.\n\"I've been asked by the leader of the opposition to publish details of my meetings, which I'm happy to do and I'm going to,\" Burnham told the Rest is Politics podcast.\n\"I will quite clearly put out there everything that I have done working with them in my previous role as Mayor of Greater Manchester.\n\"None of it is recent, actually, in terms of the meetings I had. I only had one significant meeting, actually, and that was in 2021.\"\nThe prime minister initially told the BBC he would be \"really concerned\" if Manchester City's owners decide to sell up following the guilty verdict before later denying his reaction had \"downplayed the seriousness of the findings\".\nHowever, some Premier League clubs were so \"astonished\" by Burnham's stance that sources told BBC Sport they were \"concerned\" about political interference in the appeal process.\nSanctions are yet to be announced and City have lodged an appeal against the verdict.\nCity returned to action for the first time since the guilty verdict when they played at Liverpool on Sunday, winning 3-0.\nBurnham defends comments on Man City\nBurnham was mayor of Manchester from 2017 until earlier this year and his tenure took place during a sustained period of success for City.\nAs mayor, he championed investment from the Gulf as a way of growing Manchester's economy, a strategy which was initially pursued by the city's leaders before Burnham became the inaugural elected mayor of the Greater Manchester Combined Authority.\n\"I don't think I misspoke,\" said Burnham of his past comments on Man City's owners.\n\"What I would say is my mind hadn't been on all of the issues. My mind had been on Labour Party conference and I was doing interviews in relation to it.\n\"And also, I didn't link those two things. You know, the questions linked those two things. What I would say is they're very separate.\n\"The football issues are different from the investment issues. People will try and conflate those two things, but they shouldn't, in my view.\n\"The football issues, the findings of the independent commission are serious, as I said in the interview.\"\nThe entire process involving the charges against Manchester City is independent of the Premier League.\nAn independent commission held a 42-day hearing in 2024 which led to the verdict announced last month, with City also guilty of all charges except one relating to non-cooperation with the Premier League investigation.\nThe commission's report said that \"a number of important club witnesses gave false evidence in key respects and that some knowingly gave untrue and dishonest evidence\".\nA separate independent appeal board will hear City's appeal. The club continues to deny any wrongdoing.\nRelated topics\n  - Published8 June\n  - Published28 August", "translation_ja": "", "vocab": [{"word": "breaches", "definition": "ルールや契約などの違反。約束を破る行為を指します。"}, {"word": "funnel", "definition": "資金やリソースを特定の目的地に流す、または導く。ここでは不正に金銭を流用することを意味します。"}, {"word": "tenure", "definition": "特定の職務や地位を保有している期間。任期を指します。"}, {"word": "astonished", "definition": "非常に驚く、唖然とする。予想外の事態に強い驚きを感じる状態を表します。"}, {"word": "interference", "definition": "干渉、妨害。第三者が不適切に関与することを意味します。"}]}, {"title_ja": "Saudi Arabia: Second strike kills at least 1 at Riyadh airport", "title_en": "Saudi Arabia: Second strike kills at least 1 at Riyadh airport", "summary_ja": "Sunday's strike came as the King Khalid International Airport remained closed after a deadly attack on Saturday, and after a warning from Houthi rebels in Yemen that \"worse is yet to come.\" Dammam airport was also hit.", "summary_en": "Sunday's strike came as the King Khalid International Airport remained closed after a deadly attack on Saturday, and after a warning from Houthi rebels in Yemen that \"worse is yet to come.\" Dammam airport was also hit.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/saudi-arabia-second-strike-kills-at-least-1-at-riyadh-airport/a-79632306?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Saudi Arabia: Second strike kills 1 at Riyadh airport\nPublished October 11, 2026last updated October 12, 2026\nAt least one person was killed and 11 others were injured in a stike on Riyadh airport in Saudi Arabia on Sunday, a day after a similar attack killed 12 and injured hundreds.\n\"King Khalid International Airport in Riyadh was subjected to a new attack on Sunday afternoon,\" the General Authority of Civil Aviation said in a statement.\nIt later confirmed that the individual killed in the Sunday attack was a Pakistani national.\nA spokesperson for the Saudi-led coalition fighting Iran-backed Houthi rebels in Yemen said that a cruise missile had been intercepted by air defense systems in the vicinity of the airport, but no further details were immediately available.\nThe Houthis later claimed responsibility for the strikes, saying they had \"carried out four qualitative operations in the past 24 hours using ballistic and cruise missiles and drones.\"\nA spokesman said the group targeted the Riyadh airport multiple times, as well as the Dammam airport in the east of the country and two facilities belonging to the Saudi state oil company Aramco.\nLater on Sunday evening, Saudi authorities also confirmed an attack on Dammam airport.\nHouthis warn airlines to avoid Saudi Arabia\nThe latest Houthi strikes also came just hours after the rebel group warned airlines and travelers to avoid Saudi airports.\n\"We renew our warning to all airlines, experts, employees, workers and travelers against using Saudi airports and airspace, as they are vulnerable to attack and have become a theater of operations for our forces,\" read a statement released by the group on social media. It added that airports in the holy cities of Mecca and Medina would not be targeted.\n\"We urge everyone to take our warnings seriously,\" the statement continued, stating: \"Saudi Arabia bears responsibility for any failed interceptions.\"\nWhy are Saudi airports being targeted?\nSaudi Arabia has stepped up its military involvement in Yemen in recent weeks, launching strikes against the Houthis and backing a Yemeni government counteroffensive after the rebels seized strategic territory along the Red Sea coast last month, including around the vital Bab el-Mandeb Strait.\nThe Houthi-run health authority claimed this weekend that 91 Yemenis have been killed by the Saudi-led coalition in the last five weeks, 60% of them women and children. Earlier on Sunday, it said a child was killed and six people wounded in a suspected Saudi airstrike on a house in Sanaa.\nThe Houthi-run Al Masirah TV also reported that Saudi Arabia had struck the international airport in Sanaa on Sunday afternoon.\nThere was no immediate comment from Saudi authorities on the claims.\n\"Unless the Saudi enemy stops its aggression and interference in Yemen, worse is yet to come, God willing,\" the Houthi-run Foreign Ministry said in statements carried by Al Masirah TV on Sunday, adding that its actions would be guided by the principle of reciprocity.\nWhat has Saudi Arabia said about the Riyadh airport attacks?\nThe Saudi-led coalition, which supports the internationally recognized Yemeni government in its conflict against the Iran-backed Houthi rebels, vowed a tough response to the attack, which it labeled a \"full-fledged war crime.\"\nThe Houthi strikes on Riyadh come amid a surge in Houthi attacks on Saudi Arabia this week, which have targeted other airports, military sites and oil infrastructure.\nThe spike in attacks has followed a major military offensive by the Saudi-led coalition against the Houthis.\nThe rebels, one of Tehran's regional proxies, have been fighting Yemen's government, which is recognized by the international community, since the outbreak of a civil war over a decade ago.\nWhile a truce in 2022 froze the conflict, it failed to secure a lasting peace deal. The US-Israeli war with Iran has seen fighting flare up again in Yemen, worsening an already severe humanitarian crisis.\nHow has the international community reacted to the Riyadh strikes?\nUS President Donald Trump on Saturday said he would be speaking to Saudi Arabia's de facto leader, Crown Prince Mohammed bin Salman, in the wake of the attack, which he said was \"not acceptable.\"\nTrump also said that the US was \"going to look\" at potentially joining Saudi strikes against the rebels.\nOn Sunday, European leaders expressed their \"shock\" at the attack on Riyadh airport.\nThe president of the European Commission, Ursula von der Leyen, said the EU stands in \"solidarity with Saudi Arabia\" as she condemned the \"dangerous escalation.\"\n\"These attacks by Iran's proxies are pushing the region into a spiral of violence. They are destabilizing crucial global transport and energy nodes with shock waves sent through the world,\" von der Leyen said.\nGerman Foreign Minister Johann Wadephul \"firmly\" condemned what he described as \"a terrorist act against Saudi Arabia and civil aviation\".\n\"Our thoughts are with the victims and I send my sincere condolences ", "translation_ja": "", "vocab": [{"word": "subjected", "definition": "〜を受ける、〜にさらされるという意味。ここでは空港が攻撃にさらされたことを表現している。"}, {"word": "intercepted", "definition": "横取りする、妨害するという意味。ここではミサイルが防空システムによって撃ち落とされたことを指す。"}, {"word": "qualitative", "definition": "質的な、品質に関するという意味。ここでは単なる数ではなく、戦術的に重要な作戦を指す。"}, {"word": "vulnerable", "definition": "脆弱な、攻撃されやすいという意味。ここでは空港が防御が不十分で攻撃のリスクが高いことを表現している。"}, {"word": "counteroffensive", "definition": "反撃作戦、逆襲という意味。敵の攻撃に対して行う大規模な反撃軍事作戦を指す。"}]}, {"title_ja": "UK's Burnham accuses Russia of meddling in Brexit vote", "title_en": "UK's Burnham accuses Russia of meddling in Brexit vote", "summary_ja": "The UK prime minister called for voters in Europe to be made fully aware of Russia's attempts to influence politics.", "summary_en": "The UK prime minister called for voters in Europe to be made fully aware of Russia's attempts to influence politics.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/uk-s-burnham-accuses-russia-of-meddling-in-brexit-vote/a-79635264?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "UK's Burnham accuses Russia of meddling in Brexit vote\nOctober 12, 2026\nUK Prime Minister Andy Burnham on Sunday became the first British leader to openly complain of Russian tampering in the Brexit referendum a decade ago.\nBurnham, who took on the role in July from Keir Starmer, thinks leaving the European Union did \"more harm than good\" and has opened the door to closer ties, including possibly rejoining the bloc.\nWhat did Burnham say?\nBurnham told The Rest Is Politics podcast that he had posed the question upon first arriving in Downing Street, and was given a \"clear answer that yes, there was [a link to Russian interference].\"\nHe did not provide evidence of the Kremlin's efforts to influence the June 2016 vote, where the UK decided to leave the EU by a 52% to 48% majority.\nWith the rise of far-right parties in the UK and across the EU, Burnham said voters needed better information about efforts by rogue states to disrupt their democracies.\n\"These things are important now to put clearly on the record, and I believe, help voters in Germany and France understand that some of this politics is instigated via our enemies, namely Russia,\" he said.\nBurnham described how German Chancellor Friedrich Merz had told him during talks in Berlin this week that the AfD is \"clearly linked to Russia — funded, I believe.”\n\"There is certainly misinformation, disinformation that is emanating from Russia into German politics,” Burnham added.\n'Leaver' Johnson denied Russian meddling\nBurnham's Brexit remarks contrast with former Prime Minister Boris Johnson, who campaigned to leave the EU. In 2020, Johnson said there was no evidence of Russian sway.\nThe UK Parliament’s Intelligence and Security Committee found in 2020 that the government had failed to fully assess how Russian state-run media and “troll” accounts could have impacted the vote.\nIn its report, the Committee also found the Kremlin sought to influence Scotland's 2014 independence referendum, which was rejected by voters.\nThe UK's intelligence agencies believe Russia continues to spread disinformation to undermine public trust, alongside cyberattacks, sabotage and espionage. They say the issue is getting worse and is often aided by artificial intelligence (AI).\nRussia has long denied meddling in other countries' elections or referendums.\nAfter the Brexit vote, it cast some British politicians as gripped by anti-Russian hysteria.\nHow have UK attitudes toward Brexit changed?\nPolling firm YouGov runs a regular tracker on whether the UK was right or wrong to vote to quit.\nSince mid-2022, a majority of people surveyed said Britain was wrong to leave. Last month, the \"Bregret\" camp rose to 60% — the highest ever.\nLast month, Burnham said he would seek a political consensus on the country's future relationship with the EU, even suggesting he could campaign to take Britain back into the bloc at the next election.\nEU officials have welcomed the change in tone from London, while France and Spain have spoken positively about closer ties, including rejoining.\nSome experts remain skeptical, however. Professor Iain Begg of the London School of Economics thinks rejoining would reopen deep political divisions, be complicated from both the EU and UK sides and likely take years.\nEdited by: Dmytro Hubenko\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "tampering", "definition": "不正な方法で何かに手を加えること。政治的文脈では、選挙や投票に不正に干渉することを意味する。"}, {"word": "bloc", "definition": "共通の利益や目標を持つ国々や勢力のグループ。特に政治的・経済的な連合体を指す。"}, {"word": "disinformation", "definition": "意図的に広められる虚偽の情報。ミスインフォメーション（誤情報）と異なり、意図的かつ悪意をもって流布される。"}, {"word": "espionage", "definition": "敵国や競争相手から秘密情報を盗む行為。スパイ活動を指す政治・軍事用語。"}, {"word": "instigate", "definition": "他者に悪事や暴力などの行動を起こさせるよう促す、またはそのきっかけを作る。"}]}, {"title_ja": "Air strikes kill dozens of gold miners on Sudan-Egypt border", "title_en": "Air strikes kill dozens of gold miners on Sudan-Egypt border", "summary_ja": "A Sudan-based rights group said 72 people were killed in a remote, disputed area known for illegal gold mining.", "summary_en": "A Sudan-based rights group said 72 people were killed in a remote, disputed area known for illegal gold mining.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/air-strikes-kill-dozens-of-gold-miners-on-sudan-egypt-border/a-79634889?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Air strikes kill dozens of gold miners on Sudan-Egypt border\nOctober 11, 2026\nAt least 72 workers were killed in air strikes on a disputed border area between Sudan and Egypt that targeted artisanal gold miners, a human rights group said Sunday.\nThe attack, south of the remote Halayeb triangle, east of the River Nile, is the second of its kind this year.\nIt comes amid growing concern in Egypt over large-scale displacement from the three-and-a-half-year conflict in Sudan, which has spurred a cross-border exodus.\nWhat do we know?\nThe Sudan-based Emergency Lawyers, a human rights and legal advocacy organization, said the attack occurred on Saturday in rugged and mountainous territory that it said lies within Sudan.\nThe Halayeb triangle, which is claimed by both Egypt and Sudan, is known for mining and the gold trade, along with other illicit goods and human trafficking.\nThe rights group accused the Egyptian air force of carrying out the strikes.\n\"The repeated attacks on the gold- and mineral-rich border regions reflect a desire by Egyptian authorities to expand and assert control over Sudan's natural resources,\" it claimed.\nEgypt has yet to comment on the strikes, but has previously admitted conducting a \"large-scale operation\" against illegal gold mining within its borders.\nIndependent verification remains difficult because of the remote location.\nDeath toll expected to rise\nSudan Doctors Network warned on Facebook of an expected increase in the number of casualties \"due to the severity of some injuries and the difficulties in accessing medical care and essential services in the region.\"\nOne survivor told the AFP news agency there were thousands of people working at the remote site when it was hit.\n\"After the air strike, people scattered. Some people came to Al-Ansary [gold] market, others went in the other direction. That's why no one knows exactly how many were killed,\" he said.\nStrikes tied to war's gold economy\nSudan's civil war between Abdel Fattah al-Burhan's military junta and the paramilitary Rapid Support Forces (RSF) has killed more than 200,000 people and triggered a severe humanitarian crisis.\nDespite backing Sudan's army chief al-Burhan, Egypt considers the war at its border a threat to its security.\nThe RSF has funded its operations by smuggling thousands of tons of gold from Sudan's Darfur and Kordofan regions. According to the UK-based think tank Chatham House, as much as 60% of unofficial gold exports end up in Egypt.\nIn June, air strikes on mining sites in the same border area were followed by a large-scale Egyptian security operation.\nHundreds of people, including foreigners, were arrested, accused of illegal gold mining and smuggling.\nEdited by: Srinivas Mazumdaru\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "artisanal", "definition": "小規模で伝統的な方法で行われる産業のこと。特に採掘や製造業において、機械化されていない手工業的な生産方式を指す。"}, {"word": "exodus", "definition": "大量の人々の移住や脱出。通常は政治的危機や紛争によって引き起こされる大規模な人口移動を意味する。"}, {"word": "junta", "definition": "軍事クーデターによって権力を掌握した軍事政権や支配集団。民主的な選挙を経ずに統治する政治体制を指す。"}, {"word": "humanitarian", "definition": "人道的な、または人類全体の福祉と幸福を目的とした。特に紛争地域での援助活動や人権保護に関連して使われる。"}, {"word": "paramilitary", "definition": "正規軍ではなく、軍事的訓練と装備を持つ準軍事組織。政府機関ではなく独立した武装勢力を指すことが多い。"}]}, {"title_ja": "Russia strikes power plant in Ukraine after Trump announces energy ceasefire", "title_en": "Russia strikes power plant in Ukraine after Trump announces energy ceasefire", "summary_ja": "A thermal power plant was struck at least twice, Ukrainian officials said.", "summary_en": "A thermal power plant was struck at least twice, Ukrainian officials said.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/russia-strikes-power-plant-ukraine-after-trump-announces/story?id=137178264", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Some California beaches forced to close after 'unusually high' ocean water levels", "title_en": "Some California beaches forced to close after 'unusually high' ocean water levels", "summary_ja": "The remnants of Tropical Storm Rachel are fueling flooding in several Southern California coastal communities.", "summary_en": "The remnants of Tropical Storm Rachel are fueling flooding in several Southern California coastal communities.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/california-beaches-forced-close-after-unusually-high-ocean/story?id=137171773", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "title_en": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "summary_ja": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "summary_en": "Recommended dose of hepatitis B vaccine will be withheld from thousands of newborns by Danish researchers A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week. It is a central part of the vaccine vision for Rob", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/society/2026/oct/09/vaccine-trial-guinea-bissau-rfk-jr", "state_media": false, "category": "政治", "full_text": "A controversial research trial that will withhold hepatitis B vaccines from some African newborns was given approval to move forward this week.\nIt is a central part of the vaccine vision for Robert F Kennedy Jr, the secretary of the US Department of Health and Human Services (HHS) and a longtime vaccine opponent.\nAt an anti-vaccine conference last month, Kennedy praised the Danish researchers behind the trial and touted US-supported research on hepatitis B in newborns as exemplifying the Trump administration’s agenda for vaccines, which has included slashing vaccine recommendations and casting doubt on the safety and effectiveness of shots.\nKennedy “wants to make it so we don’t use a birth dose here in this country,” said Paul Offit, an infectious disease physician at Children’s Hospital of Philadelphia. “That’s the goal.”\nKennedy would never be able to do the trial in the US because of its significant ethical concerns, Offit added. “He’s taking advantage of a developing country … Is it because children in Africa are more expendable than children here?”\nDanish researchers plan to enroll 14,000 infants in Guinea-Bissau in the trial, giving the hepatitis B vaccine to half of the babies at birth and withholding it from the others for the first six weeks of life.\nAn ethics committee at the researchers’ home institution of the University of Southern Denmark voted this week to proceed with the trial, and officials in Guinea-Bissau have also greenlit the project, which the health minister, Quinhin Nantote, initially said was suspended after international uproar earlier this year.\nStig Børsen Hansen, a founding member who was one of two reviewers who presented the study to the Danish committee, resigned from the group in protest on Friday, citing major ethical issues with the study.\n“You are now enrolling newborns in a lottery to test a hypothesis,” Hansen said. The children who are randomly selected not to receive the birth dose of the vaccine, those who “lost the lottery”, face in their earliest days the risk of contracting hepatitis B, which can cause irreversible lifelong damage. “They contract hepatitis B in the context of being part of a research project,” Hansen said, which made their infection happen, in effect, “by design”.\nThree other members of the committee have also resigned in protest.\nThe US Centers for Disease Control and Prevention (CDC) has reportedly set aside $1.6m in this year’s budget for the project, and it will be matched with private funding from the Pershing Square Foundation, which was co-founded by the billionaire activist Bill Ackman, and the Bluebell Foundation.\nThe CDC, the Danish researchers, Pershing Square and Nantote have not responded to the Guardian’s questions about this trial.\nThe news that the trial was approved by the Denmark ethics committee was first reported on Thursday by CIDRAP News. This is the first time details of the updated protocol have been disclosed.\nThe Guinea-Bissau study protocol has changed since it was posted in January, according to details shared with the Guardian. The researchers will now test mothers for hepatitis B before they give birth. The babies of mothers who test positive will be given the vaccine and will not be included in the trial. But the babies of mothers whose tests are negative may be enrolled. The new protocol has not been shared publicly.\nIn previous research, half of children who contracted hepatitis B did so after birth, through community exposures. “This virus can be transmitted casually,” Offit said. It can live on surfaces for up to seven days, and it can be acquired by sharing washcloths, toothbrushes and fingernail clippers. In addition, the hepatitis B test has a 5% false negative rate, which could provide false assurance that a birthing parent does not have the virus.\nDecades of research make it clear that the vaccine would be beneficial, which means it would be unfair to place some children in the vaccinated group and some children in the unvaccinated group, said Henrik Støvring, a professor of statistics and pharmacometrics at Aarhus University in Denmark.\nAccording to the Helsinki declaration, international medical research must be approved by ethics committees in both the host and sponsor countries.\nThe Danish research ethics committee at the University of Southern Denmark had never considered medical studies before, but it changed the rules in order to vote on this one. While committee members with expertise argued against approving it, the majority ruled to move forward.\n“It’s very unusual to bring this into a committee like that,” Støvring said. The national ethics committee in Denmark oversees medical research, but this study was outside of their purview because it won’t take place in Denmark.\nYet “I don’t see why you couldn’t do it in Denmark,” Støvring said of the trial. In fact, several conditions make it a better location. The hepatitis B vaccine is not usually given to newborns in Denmark unless the mother is posit", "translation_ja": "", "vocab": [{"word": "withhold", "definition": "意図的に何かを与えない、または情報を隠すこと。この文脈では、ワクチンを故意に接種しないことを意味する。"}, {"word": "touted", "definition": "何かの利点や価値を大声で宣伝すること。広告や推薦の文脈でよく使われる。"}, {"word": "expendable", "definition": "不要であるとみなされる、または失ってもかまわないと考えられる。通常、否定的な含意を持つ。"}, {"word": "ethically", "definition": "道徳的に、または倫理的な観点から。研究や行動が道徳的に正当であるかどうかに関連する副詞。"}, {"word": "irreversible", "definition": "一度起こると元に戻すことができない、または修復不可能な状態。医学的には特に重大な影響を示す。"}]}, {"title_ja": "ICJ judge Navi Pillay wins Nobel peace prize for promoting international law", "title_en": "ICJ judge Navi Pillay wins Nobel peace prize for promoting international law", "summary_ja": "Committee recognises work of South African who chaired UN commission that concluded Israel was guilty of genocide in Gaza The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide i", "summary_en": "Committee recognises work of South African who chaired UN commission that concluded Israel was guilty of genocide in Gaza The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide i", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/09/navanethem-navi-pillay-wins-nobel-peace-prize", "state_media": false, "category": "政治", "full_text": "The Nobel peace prize has been awarded to Navi Pillay, the South African former UN human rights chief who chaired the UN commission that concluded Israel was guilty of genocide in Gaza.\nThe Norwegian Nobel committee said Pillay, who is serving as a judge at the international court of justice (ICJ), has “shown that legal measures can help prevent acts of war and violence”.\n“Navi Pillay’s commitment to universal legal principles and her firm moral compass are constants in a long career,” the committee said, mentioning her early work defending Nelson Mandela under South Africa’s apartheid regime, serving on the international criminal tribunal, and then as the UN high commissioner for human rights, as well as chairing the UN independent international commission of inquiry on the occupied Palestinian territory.\nThat commission concluded last year that the state of Israel was guilty of genocidal acts in Gaza “with the specific intent to destroy Palestinians in Gaza”, and said the country’s prime minister, Benjamin Netanyahu, its president, Isaac Herzog, and its former defence minister Yoav Gallant had “incited the commission of genocide”.\n“It is clear that there is an intent to destroy the Palestinians in Gaza through acts that meet the criteria set forth in the genocide convention,” Pillay said on the publication of the commission’s findings in September last year.\nIsrael refused to cooperate with the commission, arguing it was biased, and rejected its report as “scandalous”. The Israeli foreign ministry reacted furiously to news of Pillay’s award on Friday.\n“If there were an award for lies, hatred, and blood libels, Navi Pillay wouldn’t just be a contender. She’d be a frontrunner,” the ministry said on X, adding: “Awarding Pillay the Nobel Peace Prize isn’t a recognition of justice. It’s the grotesque weaponization of an award to legitimize anti-Israel hatred and prejudice.\n“Now that the Nobel commission has rewarded the biggest lie of the 21st century, Joseph Goebbels is certainly applauding from hell.”\nIn its statement, the Nobel committee said Pillay, 85, had “contributed to strengthen the institutions of international law”.\n“Her independence, expertise and steadfastness have made her one of the most respected international jurists of our time,” the committee said.\n“In awarding this year’s Nobel peace prize, the Norwegian Nobel committee wants to remind the world that the rule of law – national and international – underpins the system we have set up to ensure peace and resolve conflicts non-violently,” its statement said.\nThe committee said it had not been able to locate Pillay before its announcement on Friday morning. She was attending a meeting of human rights lawyers and jurists in Nuremberg, Germany, at the site of postwar war crimes trials of Nazi leaders, and heard the news from colleagues. She responded with disbelief.\n“I don’t know about it so much. The question is: is it true? Being a lawyer and a judge, I still want to verify it,” she said.\n“The last thing I did was the report on Gaza naming what’s happening there as genocide,” Pillay added. “One of the main reactions to that report was people [complimented] me for my courage. You can imagine how surprised I was. Why would you need courage to speak the truth. You interpret the law. You look at all the facts, so it’s an impartial decision.”\nPillay is currently overseeing a genocide case against Myanmar at the ICJ.\nThe ICJ, a UN body, rules on disputes between states, while the international criminal court (ICC) investigates and prosecutes individuals accused of atrocities and other grave international crimes.\nHours after the announcement, the Trump administration unveiled broad new sanctions against the ICC, on which Pillay also once served. The US secretary of state, Marco Rubio, said the measures were to ensure the court would never prosecute Americans.\nThe ICC has not charged any US nationals, and has previously pointed out that it is a court of last resort, unnecessary in the case of countries with effective legal systems. Last year, Donald Trump, who has long coveted the Nobel peace prize, imposed personal sanctions against ICC officials deemed to be involved in investigations of Americans or Israelis. The new sanctions target the court as an institution, blocking any ICC assets in the US and giving US companies and individuals six months to wind down any business with the court.\nThe ICC said the sanctions were “an attempt to obstruct the course of justice and to prevent the court from doing what it was created to do”.\n“It is an assault on the rule of law and on the very foundations of the international legal order which strikes at the simple principle that no one stands above the law,” the court said in a statement.\nPillay’s award was welcomed by human rights activists and hailed in South Africa, home to four previous laureates. The country’s president, Cyril Ramaphosa, said: “Justice Pillay’s crowning as winner of the Nobel prize allows us t", "translation_ja": "", "vocab": [{"word": "apartheid", "definition": "人種や民族に基づいて人々を分離し、抑圧する政治体制。南アフリカで1948年から1994年まで法律で認可された人種差別制度を指すことが多い。"}, {"word": "incited", "definition": "誰かに危険な行為や違法行為を行うように促す、または扇動する。通常、言葉や行動を通じて他者の行動を激化させることを意味する。"}, {"word": "weaponization", "definition": "何かを武器として使用する行為、または戦争や闘争の道具に変える過程。政治的または社会的な文脈では、ある概念や制度を特定の目標を達成するための戦術として利用することを指す。"}, {"word": "steadfastness", "definition": "困難な状況においても信念や行動から揺らがない性質。堅牢性や不変の決意を表現する正式な語彙。"}, {"word": "jurists", "definition": "法律の専門家であり、法律理論や判例の解釈に精通した学識者。判事や法学者、また法律に関する高度な知識を持つ専門職を指す。"}]}, {"title_ja": "Isaias strengthens to become first Atlantic hurricane of 2026 season", "title_en": "Isaias strengthens to become first Atlantic hurricane of 2026 season", "summary_ja": "Storm expected to make landfall on US’s northern Gulf coast with risk of flash floods and isolated river flooding Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it", "summary_en": "Storm expected to make landfall on US’s northern Gulf coast with risk of flash floods and isolated river flooding Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/oct/09/isaias-strengthens-first-atlantic-hurricane-2026", "state_media": false, "category": "社会", "full_text": "Isaias has become the first Atlantic hurricane of the 2026 season, with wind speeds of 80mph and a minimum pressure of 975mb. It is expected to strengthen to a category 2 hurricane as it approaches the US’s northern Gulf coast on Friday, according to the National Oceanic and Atmospheric Administration (NOAA).\nAs a result of the strong El Niño, it has been a notably quiet Atlantic hurricane season. The first hurricane of the season has not formed this late since 8 October 1905, which pre-dates the satellite era (1960s) for tracking hurricanes that has allowed for more non-landfall hurricanes to be discovered.\nIsaias is expected to make landfall on Friday evening local time, bringing an estimated 75-150mm (2.9-5.9in) of rainfall across the Gulf coast. There may be up to 250mm in places, with a possibility of flash flooding and isolated river flooding.\nThe NOAA also said there was increasing likelihood of life-threatening storm surge along portions of the northern Gulf coast and damaging hurricane-force winds over portions of the Florida panhandle, southern Alabama and Mississippi. A hurricane warning has been issued and people have been told to prepare for long power outages and to obey any evacuation orders issued.\nIn Zimbabwe, a state of disaster was declared in the south-east Masvingo province on Tuesday after a severe hailstorm caused widespread damage to homes and critical infrastructure.\nPreliminary assessments found the roofs had been torn off 8,500 homes. A further 15,300 people reported shattered windows, leaving many exposed to the elements as the rainy season begins.\nThe country’s power infrastructure was badly affected, disrupting drainage and sewerage systems, raising concerns about public health.\nIn Australia, a rare tornado hit the town of Ulladulla, about 140 miles (230km) south of Sydney, on 3 October. Tornadoes are relatively rare in Australia, where there are about 50 each year. This Ulladulla tornado damaged properties and felled trees.", "translation_ja": "", "vocab": [{"word": "El Niño", "definition": "赤道太平洋の海面水温が平年より高くなる気象現象。大気循環に影響を与え、世界的な気象パターンを変化させる。"}, {"word": "landfall", "definition": "熱帯低気圧やハリケーンが陸地に上陸すること。予報では上陸の時刻や場所が重要な情報となる。"}, {"word": "storm surge", "definition": "ハリケーンや台風の接近時に、気圧低下と強風により海面が異常に上昇する現象。沿岸地域に大きな被害をもたらす。"}, {"word": "infrastructure", "definition": "電力網、水道、道路などの社会基盤となる施設や設備。災害時にこれらが被害を受けると日常生活に支障が生じる。"}, {"word": "preliminary assessment", "definition": "本格的な調査の前に行われる初期段階の評価や調査。被害状況の概況を把握するために実施される。"}]}, {"title_ja": "Pakistani national killed in second Houthi strike on Riyadh airport", "title_en": "Pakistani national killed in second Houthi strike on Riyadh airport", "summary_ja": "Saudi authorities say a Pakistani national was killed and several people injured in a second strike on Riyadh’s Airport.", "summary_en": "Saudi authorities say a Pakistani national was killed and several people injured in a second strike on Riyadh’s Airport.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/11/pakistani-national-killed-second-houthi-strike-riyadh-airport?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Pakistani national killed in second Houthi strike on Riyadh airport\nNewsFeed\nPakistani national killed in second Houthi strike on Riyadh airport\nSaudi authorities say a Pakistani national was killed and several people injured in a second strike on Riyadh’s King Khalid International Airport. Sunday’s strike followed an attack on Saturday that killed 12 people and injured more than 300. Al Jazeera’s Malik Traina reports.\nPublished On 11 Oct 2026", "translation_ja": "", "vocab": [{"word": "strike", "definition": "軍事的な攻撃や空襲のこと。政治的な文脈では、敵対勢力による意図的な攻撃を指す。"}, {"word": "authorities", "definition": "公式な権限を持つ機関や当局者のこと。政府機関や公式な管理者を指す専門用語。"}, {"word": "casualty", "definition": "戦闘や事故で死傷した人のこと。被害者や損失を示す公式な報告用語として使われる。"}, {"word": "infrastructure", "definition": "空港や道路などの基本的な施設や設備のこと。社会の基盤となる重要な構造物を指す。"}]}, {"title_ja": "US Homeland Security secretary sees no ‘risk’ from livestreamed execution", "title_en": "US Homeland Security secretary sees no ‘risk’ from livestreamed execution", "summary_ja": "Decision to livestream Nidal Hasan execution has led to harsh criticism and warnings that it could encourage violence.", "summary_en": "Decision to livestream Nidal Hasan execution has led to harsh criticism and warnings that it could encourage violence.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/11/us-homeland-security-secretary-sees-no-risk-from-livestreamed-execution?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US Homeland Security secretary sees no ‘risk’ from livestreamed execution\nThe decision to livestream Nidal Hasan’s execution has triggered harsh criticism and warnings that it could encourage radicalisation.\nUnited States Homeland Security Secretary Markwayne Mullin has defended the planned livestreaming of Nidal Hasan’s execution, playing down warnings that images of his death by firing squad might be used as a propaganda tool for violent groups.\nIn an interview on Sunday with the CBS News show Face the Nation, Mullin framed the decision as part of President Donald Trump’s hardline approach to crime.\n“I follow President Trump. He’s a commander-in chief of the country,” Mullin said, crediting the Republican leader with “restoring America values”.\nMullin also brushed aside concerns that the images of Hasan’s execution could be leveraged against the US.\n“I don’t see an elevated risk at this point at all because of this,” Mullin said. “I think people need to understand, if you attack America, we will come after you, and we will make sure that the punishment fits the crime.”\nHasan, a former US Army major, was sentenced to death in August 2013 after being convicted of shooting and killing 12 unarmed active-duty soldiers and a retired serviceman at the Fort Hood military base in Texas.\nThe attack took place on November 5, 2009, when Hasan opened fire in a medical facility on the base where service members receive routine check-ups before deployment. The incident is considered one of the deadliest mass shootings to take place on a US military base.\nAnother 32 people were injured in the shooting. In the process of responding to the attack, police on the military base shot Hasan, leaving him paralysed from the waist down.\nCritics have questioned the optics of broadcasting a firing squad killing of a man in a wheelchair. The livestreamed execution is scheduled for December 3.\nBut Mullin dismissed those concerns, arguing that viewership is optional. “Once again, no one has to watch it if they don’t choose to,” Mullin said.\nSecretary of Defense Pete Hegseth had announced plans last week to livestream the upcoming execution, triggering a wave of criticism. But Trump on Saturday suggested he may reconsider the decision.\n“There are two thoughts: Don’t show it and show it. Because, you know, by showing it, maybe other people won’t be doing what he did,” Trump told reporters outside the White House.\n“So I’ll make a decision, ultimately. I know what the military would like to do, but we’ll make a decision.”\nLawmakers on both sides of the aisle, however, have denounced the idea of a public execution.\nIn a Sunday morning appearance on NBC’s Meet the Press, Republican Senator Thom Tillis warned that broadcasting Hasan’s death would “put at risk” US lives.\n“Terrorist organisations will use this as a recruiting tool. It will radicalise other people, and this is not who we are,” Tillis said.\n“Look, the Fort Hood shooter should be put to death, but there’s a way to deal with this that’s proper, and there’s a way to deal with this that’s more improper than I have ever observed in my life.”\nTillis, whose term as senator ends in January, also directed criticism at Hegseth for what he suggested was reckless leadership.\n“It’s another example of why Pete Hegseth and all of his bravado needs to get the hell out of the Department of Defense, because he is a failed leader,” Tillis said.\nThe senator was considered one of the deciding votes in Hegseth’s January 2025 confirmation vote, and he has since called his support for Hegseth’s cabinet nomination “the biggest regret” of his tenure.\nOther Republicans echoed Tillis’s concerns about the livestream. Senator Lisa Murkowski of Alaska, for instance, compared the public execution with something she would expect “from terrorists and dictators”.\nShe also argued that Hasan has sought public attention, something he would receive in a broadcast execution.\n“It would give this individual, who deserves no further notoriety, the martyrdom he seeks,” Murkowski added.\nRepublican Representative Tom Barrett of Michigan, a former military member, issued a statement on Friday explaining that he had trained at Fort Hood a year before the attack.\nHe also said he opposed the public execution, despite considering Hasan “evil”.\n“Secretary Hegseth should seriously reconsider this decision,” Barrett wrote on X.\n“Making a public spectacle out of an already tragic situation is unnecessary and does not serve a public interest.”\nMilitary executions are extremely rare in the US and can only be approved by the president under the Uniform Code of Military Justice.\nIf the order against Hasan is carried out, he will be the first member of the US military to be executed since 1961.", "translation_ja": "", "vocab": [{"word": "radicalisation", "definition": "過激思想への傾斜、または暴力的イデオロギーへの転向プロセス。テロ組織が新規メンバーを勧誘する際の懸念事項として使用されます。"}, {"word": "leveraged", "definition": "何かを有利に利用する、または影響力を行使すること。ここでは敵対勢力が実行映像を自分たちの目的のために利用する可能性を意味します。"}, {"word": "optics", "definition": "公開されたときの見た目や印象、特に政治的・道徳的な観点から。メディアや世論がどのように受け取るかを指します。"}, {"word": "dismissed", "definition": "懸念や異議を軽く扱う、または取り合わない。ここではセキュリティリスクについての警告を無視する行為を示します。"}, {"word": "incurred", "definition": "（損害や費用などを）被る、負担する。この文脈では銃撃事件による被害者数を指します。"}]}, {"title_ja": "Footage shows moment Russian strike hits Ukrainian grocery store", "title_en": "Footage shows moment Russian strike hits Ukrainian grocery store", "summary_ja": "CCTV footage shows the moment of a Russian strike on a residential street in Kharkiv, Ukraine.", "summary_en": "CCTV footage shows the moment of a Russian strike on a residential street in Kharkiv, Ukraine.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/11/footage-shows-moment-russian-strike-hits-ukrainian-grocery-store?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Footage shows moment Russian strike hits Ukrainian grocery store\nNewsFeed\nFootage shows moment Russian strike hits Ukrainian grocery store\nCCTV footage shows the moment of a Russian strike on a residential street in Kharkiv, Ukraine, followed by fires and debris. The attack hit a grocery store, killing three people and injuring 20, including two children, officials said.\nPublished On 11 Oct 2026", "translation_ja": "", "vocab": [{"word": "footage", "definition": "ビデオカメラやセキュリティカメラなどで撮影された映像や動画のこと。ニュースやドキュメンタリーで使用される記録映像を指す。"}, {"word": "strike", "definition": "この文脈では、軍事的な攻撃や空爆を意味する。目標に対する直接的な打撃や攻撃行動を表す。"}, {"word": "CCTV", "definition": "Closed-Circuit Television の略で、監視カメラシステムのこと。特定の場所を監視するために設置される防犯カメラを指す。"}, {"word": "debris", "definition": "爆発や破壊によって生じたがれき、破片、残骸のこと。建物や物体が壊れた後に残る散乱した物質を意味する。"}]}, {"title_ja": "Pope Leo to undergo surgery for growth on lung", "title_en": "Pope Leo to undergo surgery for growth on lung", "summary_ja": "The Pope says the small growth is ‘well-contained’ and was spotted early; recovery ​from surgery to take about a week, Vatican says", "summary_en": "The Pope says the small growth is ‘well-contained’ and was spotted early; recovery ​from surgery to take about a week, Vatican says", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/pope-leo-to-undergo-surgery-for-growth-on-lung/article71572904.ece", "state_media": false, "category": "社会", "full_text": "Pope Leo said on Sunday (October 12, 2026) that doctors had detected a small growth on his lung during a recent health check and he would be undergoing surgery this week to remove it, in the first health scare of the 71-year-old pontiff’s tenure.\nLeo told pilgrims in St. Peter’s Square for his weekly Sunday prayer that the growth was “well-contained” and had been spotted early.\n“Recently, during some medical examinations, doctors found a localized nodule in my lung,” said the pontiff. “It was detected at a very early stage and is well contained.”\n“The doctors believe it is advisable to intervene, so, following their advice, I have decided to undergo surgery to remove it,” he said. “The operation is already scheduled for the next few days.”\nA nodule on the lung is a small, localised lesion that can be benign. The American Thoracic Society says fewer than 5% of lung nodules overall prove cancerous, although risk rises with age, size, and other factors.\nLeo, elected pope by the world’s cardinals in May 2025, is relatively young for a Church leader. He enjoys sports, including tennis, and is not known to previously have had health issues.\nThe late Pope Francis, Leo’s predecessor, died at age 88 and was increasingly frail in his later years.\nThe Vatican press office said Leo’s recovery from surgery was expected to take about a week. It did not immediately provide further details about the pope’s health.\nLeo keeps a busy schedule and is due to make an 11-day tour of Uruguay, Argentina and Peru from November 6-17.\nBefore mentioning his health issue in his address on Sunday, the pope referred to the trip, thanking Catholics for their prayers “for the pastoral visit I will undertake.”\nPublished - October 12, 2026 05:15 am IST", "translation_ja": "", "vocab": [{"word": "pontiff", "definition": "教皇、ローマ教皇を指す。カトリック教会の最高指導者を正式に呼ぶ際に使用される格調高い用語。"}, {"word": "localized", "definition": "特定の限定された場所に限定されている状態を表す。医学用語では、病変が広がらず一箇所に留まっていることを意味する。"}, {"word": "tenure", "definition": "特定の職務や地位を占めている期間。ここでは教皇としての在任期間を指す。"}, {"word": "intervene", "definition": "事態に対して積極的に介入・干渉する、または医学的に治療的処置を加えることを意味する。"}, {"word": "pastoral", "definition": "宗教的指導者が信仰者の精神的ケアを行う活動に関する。牧師的な、牧羊的なという意味の形容詞。"}]}, {"title_ja": "Trump says Russia, Ukraine agree to ‘energy ceasefire’ but Kyiv says attacks continue", "title_en": "Trump says Russia, Ukraine agree to ‘energy ceasefire’ but Kyiv says attacks continue", "summary_ja": "Ukrainian President Zelenskyy said that while his country “welcomed” the announcement by Trump as “good news for everyone,” Russia was still hitting energy infrastructure in Kyiv and in the city of Kharkiv", "summary_en": "Ukrainian President Zelenskyy said that while his country “welcomed” the announcement by Trump as “good news for everyone,” Russia was still hitting energy infrastructure in Kyiv and in the city of Kharkiv", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-says-russia-and-ukraine-agree-to-energy-ceasefire/article71572265.ece", "state_media": false, "category": "政治", "full_text": "U.S. President Donald Trump said on Sunday (October 11, 2026) that Russia and Ukraine had agreed to an “energy ceasefire” in the 4 1/2-year-old war, but he offered no details on it, and Kyiv reported attacks by Moscow on energy sites after his statement.\nMr. Trump’s brief social media post said only that the ceasefire took effect immediately, adding: “Do not break it!”\nMoscow did not immediately comment. Ukrainian President Volodymyr Zelenskyy said that while his country “welcomed” the announcement by Trump as “good news for everyone,” Russia was still hitting energy infrastructure in Kyiv and in the city of Kharkiv.\n“Unfortunately, Ukrainian skies have been infested with Russian shaheds all day today,” he said in an evening address, referring to drones launched by Moscow. “There have been glide bomb strikes and strikes on our energy infrastructure too. A power plant in Kharkiv was attacked this evening.”\nThe presidential office confirmed the Kharkiv attack came after Trump’s ceasefire post.\nMr. Zelenskyy said Ukraine was “ready to refrain from striking Russian energy infrastructure -- and we count on the same readiness from Russia.”\nRussia has sought to deny Ukrainian civilians power, heat and running water during the war, hoping to wear down public resistance to Moscow’s full-scale invasion. Ukrainian officials describe the strategy as “weaponising winter.”\nMr. Zelenskyy said Ukraine has proposed many de-escalatory steps but Russian President Vladimir Putin “had one answer to all of them — nyet.’ We do hope that he will finally say something different to America, Ukraine, and the entire world.”\nHe said Kyiv is maintaining contact with the US, and he thanked Americans for their support. He said on X that he had spoken about the development with Canadian Prime Minister Mark Carney, Finnish President Alexander Stubb and NATO Secretary-General Mark Rutte.\nIn an interview broadcast earlier Sunday, Mr. Zelenskyy said Kyiv was ready to stop striking Russian refineries if Moscow halted attacks on Ukraine’s energy system, and he asked Trump to press the Kremlin to agree.\n“We are asking President Trump, (to) give them (a) signal, not (to) attack energy infrastructure of Ukraine,” he told ABC’s “This Week.”\nTrump spars with Zelenskyy\nMr. Trump said on Saturday it was time for Ukraine to get a new president, suggesting Zelenskyy has not done enough to end the war and blaming him for high diesel prices in the US\nMr. Zelenskyy said in response to Mr. Trump’s comments that Ukraine could hold elections if Russia agreed to a 60-day ceasefire.\n“Give us two months, 60 days off. Total ceasefire, 60 days, and we will organise elections,” he said, adding that Ukraine would be ready to accept whatever choice its people made.\n“With all respect to President Trump, it’s up to our society, up to our people to choose one or another leader,” he said. Holding an election during the war would be unlawful, and that Ukraine would need security guarantees to allow for safe voting, Mr. Zelenskyy added.\nUkraine has been under martial law since Mr. Putin launched the full-scale invasion in February 2022, and the Ukrainian Constitution bars elections while it remains in force. Beyond the legal barrier, a nationwide vote would be vulnerable to Russian attacks, and organising one is widely seen as logistically impossible, with roughly a fifth of the country held by Russia, millions of Ukrainians displaced abroad and soldiers on the front line. Mr. Zelenskyy’s term formally expired in May 2024, but the Constitution allows him to remain in office until a new president is sworn in.\nThe exchange came as Kyiv pressed its campaign against Russian infrastructure, with a drone attack on Sunday shutting down a data centre in the city of Vladimir, east of Moscow, run by technology giant Yandex. It was the third strike on the company’s facilities in four days.\nRussia and Ukraine have been waging a long-range aerial war while their armies remain largely deadlocked on the front line.\nMr. Trump, who on Friday struck a deal with Mr. Putin to buy diesel from Moscow in an attempt to address high fuel prices ahead of U.S. midterm elections, has been urging Zelenskyy for weeks to stop striking Russian energy infrastructure.\nHe has sought to blame record U.S. diesel prices on Ukraine rather than the U.S.-led war in Iran, which has driven up world energy prices. Ukrainian and European officials reacted to the diesel deal with dismay, saying it will help pay for Russia’s war effort.\nPublished - October 11, 2026 08:49 pm IST", "translation_ja": "", "vocab": [{"word": "ceasefire", "definition": "武力紛争の一時的な停止。戦闘行為をやめることを合意した状態を指す。"}, {"word": "infrastructure", "definition": "電力、水道、道路などの基盤となる重要な施設やシステム。国や地域の機能を支える根幹となるもの。"}, {"word": "de-escalatory", "definition": "緊張や対立の程度を減らすことを目的とした。エスカレーション（段階的な激化）を抑制する行動や措置を指す。"}, {"word": "weaponising", "definition": "非軍事的なものを兵器として利用すること。戦略的な目的のために日常生活に必要なものを攻撃対象にする戦術。"}, {"word": "spars", "definition": "言葉や意見で論争する、口論する。政治的・外交的な対立において批判や異議を唱えることを意味する。"}]}, {"title_ja": "Saudi-led coalition says a projectile struck passenger terminal at Riyadh airport", "title_en": "Saudi-led coalition says a projectile struck passenger terminal at Riyadh airport", "summary_ja": "There were no immediate details about the latest strike, which hit the same complex housing terminals 3 and 4 for domestic flights.", "summary_en": "There were no immediate details about the latest strike, which hit the same complex housing terminals 3 and 4 for domestic flights.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/saudi-led-coalition-says-a-projectile-struck-passenger-terminal-at-riyadh-airport/article71572331.ece", "state_media": false, "category": "社会", "full_text": "A Saudi-led coalition fighting Iran-backed Houthi rebels in Yemen said a projectile struck a passenger terminal at the international airport in Riyadh on Sunday (October 11, 2026), less than a day after a missile struck it and killed 12 people. Saudi civil aviation authority said that the latest attack caused injuries.\nYemen’s Houthis claimed responsibility for the attack. The group said that it has launched several attacks on Riyadh airport since Saturday (October 12, 2026).\nThere were no immediate details about the latest strike, which hit the same complex housing terminals 3 and 4 for domestic flights.\nThe sharp escalation in the new front in the Iran war threatens to draw in greater U.S. military involvement, as President Donald Trump has said he is weighing joining the fight against the rebels.\nThe strike came shortly after the Houthis said the airport under their control in the Yemeni capital of Sanaa had been struck again. They blamed the Saudis but provided no details.\nSaturday's missile attack on the Riyadh international airport was the deadliest in a Gulf Arab nation since the Iran war began. Over 300 people were wounded, some of them critically.\nThe strike on Sunday (October 11, 2026) occurred as King Khalid International Airport remained closed and authorities moved schools in the capital online.\nAt stake, again, are global supplies and prices of oil as well as commercial shipping through a crucial alternative waterway to the Iran-threatened Strait of Hormuz -- along with civilians and aviation throughout the region.\nTrump says he is weighing joining strikes against rebels\nMr. Trump on Saturday (October 10, 2026) said he was considering whether to join Saudi strikes against the rebels. He later said he planned to speak with Saudi Crown Prince Mohammed bin Salman.\nU.S. intervention could prompt the Houthis to halt shipping through the Bab el-Mandeb Strait at the southern end of the Red Sea off Yemen and further restrict the flow of oil out of the Persian Gulf.\nSaudi Arabia is running low on missile interceptors and has asked France, Britain, Pakistan and Egypt to deploy air defence support to the region, regional officials told The Associated Press last month, with one noting that the US has seen its own stock dwindle during the war with Iran.\nMeanwhile, deeper U.S. involvement in an unpopular regional war could further threaten Trump's Republican party in upcoming midterm elections. Both Trump and Iran insist the American election calendar has no effect on their decisions on how to end the seven-month-old conflict.\nHouthis have targeted Saudi airports, military and oil facilities\nAs the Riyadh airport remained closed until at least 9 pm Sunday, according to Flightradar24, fighting continued in Yemen.\nEarlier on Sunday (October 11, 2026), the Houthi-run health ministry said a child was killed and six people wounded in a suspected Saudi airstrike on a house in Sanaa. The ministry also said 91 Yemenis have been killed by the Saudi-led coalition in five weeks, 60 per cent of them women and children.\nThere was no immediate comment from Saudi authorities on the claims.\nAnd there remained no claim of responsibility for the Saturday attack on Riyadh airport, though the Houthis at times have kept silent when an attack brought widespread international condemnation.\nBut the rebels have acknowledged targeting Saudi airports and oil installations in recent days, and on Sunday they again warned: “all airlines, experts, employees, workers and travellers against using Saudi airports and airspace, as they are vulnerable to attack and have become a theatre of operations for our forces.\"\nBrig. Gen. Yahya Saree, the group's military spokesperson, wrote on X that airports in the holy cities of Mecca and Medina were exempt.\nThe dead in the airport attack included several nationalities\nThe missile on Saturday (October 10, 2026) struck an airport complex housing terminals 3 and 4 for domestic flights, a regional official said, speaking on condition of anonymity because they weren't authorised to speak to the media.\nA Saudi statement said the dead included four Saudi citizens, two Bangladeshi nationals, a Palestinian, a US citizen, an Egyptian, a Jordanian, a Syrian and a Sudanese.\nThe Egyptian woman was a flight attendant identified as Azza Ramzy, who worked for Saudi airline Flynas, according to Egyptian state-run TV.\nThe Syrian woman was a widowed mother of four who had been living in Saudi Arabia for five years, a relative told The Associated Press. The Syrian Embassy identified her as Buthaina Ahmad Oweida. Her niece, Nisreen Oweida, said she had left during Syria's civil war. She was living in Mecca and had been returning from a visit to her sister in Riyadh when she was killed.\nThe Houthis claimed attacks earlier in the week on King Khalid International Airport that killed three Saudis, including a pilot, and a Sudanese national. The airport has no military facilities.\nPublished - October 11, 2026 09:07 pm IST", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や対立が段階的に激化・拡大していくこと。ここでは戦闘の規模や激しさが急速に増していることを指す。"}, {"word": "threaten", "definition": "危険や悪い結果をもたらす可能性がある状態。政治的・軍事的な影響が及ぶリスクがある状況を表現する。"}, {"word": "dwindle", "definition": "数量や資源が徐々に減少していくこと。ここではアメリカのミサイル防御能力が戦争の継続により低下していることを意味する。"}, {"word": "intercept", "definition": "発射された兵器やミサイルを空中で捕捉・撃墜すること。防御システムの機能を表す専門用語。"}, {"word": "deployment", "definition": "軍隊や防御システムなどを戦略的に配置・展開すること。ここでは多国間による防空支援体制の構築を指す。"}]}, {"title_ja": "Alberta separatists are expected to lose. They’re not preparing to quit - Toronto Star", "title_en": "Alberta separatists are expected to lose. They’re not preparing to quit - Toronto Star", "summary_ja": "Alberta separatists are expected to lose. They’re not preparing to quit Toronto Star", "summary_en": "Alberta separatists are expected to lose. They’re not preparing to quit Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi8wFBVV95cUxOdGp1eU1Zek84Uk9pc2xIM3VRTERMcU95SlNCTlZycDUyYl91dnpNOTNEelFzS0FTX1BhVmxIYWVnaEY0RzZxRk9fajFYVjJORUl4b0l2VklDUDBPamRicjBnSHU1aC1WamE1QVRERlUwYTdxZDEtQTJmQlBmX3F5Vk5mdjdzNVhULXVqb2tRUnpIdmxjZDNub09ic21KV1lHVzJwOUp2Q3p4ZEhfdjhaNGVqMW1rWDNkVThYR0Y2b0tPYWpxTmN3TWp6bXoxTjJ0Sm9UUHMxdnk3TnJfWVFtWkpXSXBRRURUYWJ3ci1qaWhlZVU?oc=5", "state_media": false, "categor
