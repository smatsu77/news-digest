ion-season promises by politicians", "title_en": "2027: Nigerian governor urges residents to reject election-season promises by politicians", "summary_ja": "“Don’t use the ₦5,000, the ₦10,000, the wrapper or the rice they will give you and close the destiny of Abians for the next four years, because even prayer and fasting will not open it.” The post 2027: Nigerian governor urges residents to reject election-season promises by politicians appeared first", "summary_en": "“Don’t use the ₦5,000, the ₦10,000, the wrapper or the rice they will give you and close the destiny of Abians for the next four years, because even prayer and fasting will not open it.” The post 2027: Nigerian governor urges residents to reject election-season promises by politicians appeared first", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/ssouth-east/916252-2027-nigerian-governor-urges-residents-to-reject-election-season-promises-by-politicians.html", "state_media": false, "category": "政治", "full_text": "Governor Alex Otti of Abia State has urged voters to resist financial and material inducements from politicians, warning that such offers could undermine the state’s future in the 2027 general elections.\nMr Otti gave the advice on Sunday at the 2nd Session of the 7th Synod of the Anglican Communion, Diocese of Aba Ngwa North, held at All Saints Anglican Cathedral, Abayi-Umuocham, Aba.\nThe governor, represented by his Chief of Staff, Caleb Ajagba, charged citizens to prioritise long-term development over immediate material benefits offered by politicians.\nHe alleged that politicians responsible for the state’s challenges over 24 years were returning to seek voters’ support.\nMr Otti warned against allowing such politicians to derail the progress his administration was pursuing.\n“The people that created a problem that God now had to answer your prayer by sending someone after His own heart, are all over again.\n“But the Bible says surely they shall proceed no further. Please, let us be careful. When God opens a door, may we not close it.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“Don’t use the ₦5,000, the ₦10,000, the wrapper or the rice they will give you and close the destiny of Abians for the next four years, because even prayer and fasting will not open it.\n“May we not lose what God has given to us on the platter,” he said.\nCall for vigilance\nGovernor Otti also urged Christians to remain vigilant, warning that some politicians who previously neglected the Church were seeking its attention.\n“Like we have been told the season is here again and politicians are everywhere and as the Bible says we are not ignorant of the devices of the enemy.\n“These are devices because many of them who have not been coming to church have started coming to church.\n“Many of them who have not been accepting or taking your calls have suddenly started calling you. If you call them and you miss their call, they call you back. Those are devices,” he said.\nMr Otti said the first three years of his administration had focused largely on laying a foundation for development, adding that the next four years, beginning in 2027, would prioritise consolidation.\n“Those who build houses will understand that foundation-laying is the most crucial, and the foundation has been laid after 24 years of ruins.\n“What will now be happening is consolidation and beauty will emerge.\n“This present house (Abia State) you are seeing today, in the next four years, you will know that God has really come to tabernacle in the midst of man.\n“Today Abia State has become a point of reference,” he said.\nOn the church’s development projects, Mr Otti assured the congregation of his administration’s support towards their completion.\nHe, however, reiterated that public funds should be deployed to develop the state rather than finance religious projects.\nThe governor commended the guest speaker for delivering what he described as an appropriate and unadulterated message, urging Christians to verify information and examine issues critically before reaching conclusions.\nHe said the synod’s theme, “Don’t Just Absorb It; Think It Through,” drawn from Acts Chapter 17 verse 11 to 12, was relevant as the country approached another political season.\n“As Christians, we have the capacity to change the negative narrative of this nation; especially our state,” he said.\nREAD ALSO: Abia trains ward agricultural coordinators, extension personnel\nThe sermon\nEarlier, the Bishop of Aba Ngwa North Diocese, Anglican Communion, Nathan Kanu, said the theme challenged Christians to move beyond hearing messages to examining issues prayerfully and responding wisely.\nMr Kanu commended Governor Otti for identifying with the church and supporting its activities, presented gifts to the governor’s representative and prayed for God’s blessings on his administration.\nIn his sermon, the Guest Speaker and Bishop of Ohaji/Egbema Diocese, Chidi Oparajiaku, urged Christians to think critically before taking action.\nSpeaking on: “The Bereans Wisdom,” with his text from Acts, chapter 17, verse 12 and 15, Mr Oparajiaku said the synod’s theme was timely and encouraged believers to examine messages rather than accept or reject them without reflection.\n“The theme of the synod is very important and apt in this our time, it didn’t say throw it away, it says think through it,” he said.\nMr Oparajiaku regretted that Christians, who were expected to demonstrate sound judgement, sometimes fell victim to deception.\n“When members of the church know the Bible, they would not be deceived.\n“This is because the church refused to behave like the Bereans. The Bereans Christian never took everything for granted they always thought through whatever they heard,” he said.\nThe bishop thanked God for giving Abia the opportunity to be governed by Mr Otti, whom he credited with changing the fortunes of the state.\nThe sy", "translation_ja": "", "vocab": [{"word": "inducements", "definition": "人々を行動へと促すための金銭や物質的な報酬。政治家が有権者を買収するために提供する見返り。"}, {"word": "undermine", "definition": "基盤や土台を弱める、損なわせる。ここでは州の将来的な発展を阻害することを意味する。"}, {"word": "prioritise", "definition": "複数の事項の中から最も重要なものを優先させる。長期的な発展を目先の利益より重視する。"}, {"word": "derail", "definition": "本来の軌道から外す、計画や進行中のプロジェクトを中断させる。行政の進捗を妨害する意味で使用。"}, {"word": "vigilant", "definition": "注意深く目を光らせている状態。危険や不正を防ぐため常に警戒を怠らない。"}]}, {"title_ja": "2027: 241 candidates jostle for 36 elective positions in Cross River", "title_en": "2027: 241 candidates jostle for 36 elective positions in Cross River", "summary_ja": "NAN reports that out of the 241 candidates, 198 are males representing 82.2 per cent, while 43 are females, representing 17.8 per cent. The post 2027: 241 candidates jostle for 36 elective positions in Cross River appeared first on Premium Times Nigeria .", "summary_en": "NAN reports that out of the 241 candidates, 198 are males representing 82.2 per cent, while 43 are females, representing 17.8 per cent. The post 2027: 241 candidates jostle for 36 elective positions in Cross River appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/916247-2027-241-candidates-jostle-for-36-elective-positions-in-cross-river.html", "state_media": false, "category": "社会", "full_text": "No fewer than 241 candidates of various political parties have been cleared by the Independent National Electoral Commission (INEC) to contest 36 elective positions in Cross River State in the 2027 general elections.\nThe News Agency of Nigeria (NAN) reports that the positions comprise the governorship, Senate, House of Representatives and State House of Assembly seats.\nAccording to INEC’s final list of candidates, eight candidates are vying for the governorship seat, 25 for the three senatorial seats, 63 for the eight House of Representatives seats, and 145 for the 24 State House of Assembly seats.\nNAN reports that out of the 241 candidates, 198 are males representing 82.2 per cent, while 43 are females, representing 17.8 per cent.\nThe Calabar South State Constituency has the highest number of female candidates—seven of them.\nNAN also reports that the All Progressives Congress (APC), African Democratic Congress (ADC) and Nigeria Democratic Congress (NDC) each fielded five female candidates for the upcoming general election.\nNAN further reports that although 14 political parties are participating in the elections in the state, only the APC, ADC and NDC fielded candidates for all the elective positions.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe youngest candidate NAN investigation shows is 26-year-old Aboh Glady, who is contesting for the State House of Assembly seat on the platform of the Action Alliance (AA).\nThe oldest candidates are 69-year-old Asuquo Asuquo and Francis Ukpanyang, both of the Action Democratic Party (ADP), contesting for Calabar Municipal/Odukpani Federal Constituency and Calabar South State Constituency, respectively.\nIt will be recalled that five members of the National Assembly (NASS) representing Cross River failed to secure their parties’ tickets to seek re-election in 2027.\nREAD ALSO: 2027: ADC, NDC candidates not cleared for Cross River governorship\nCross River has 11 representatives at the National Assembly, comprising three senators and eight House of Representatives members, all of them members of the ruling APC.\nTwo of the three senators secured the APC tickets for the 2027 elections, while only three of the eight House of Representatives members seeking re-election succeeded in clinching their party’s tickets.\nThe successful House of Representatives members are Joseph Bassey, Calabar South/Akpabuyo/Bakassi Federal Constituency; Peter Akpanke, Obudu/Bekwarra/Obanliku Federal Constituency and Victor Abang, Ikom/Boki Federal Constituency.\nThose who lost their bids for re-election are Emil Inyang, Biase/Akamkpa Federal Constituency; Bassey Akiba, Calabar Municipal/Odukpani Federal Constituency; Godwin Offiono, Yala/Ogoja Federal Constituency; and Mike Etaba, Obubra/Etung Federal Constituency.\nHowever, Alex Egbona, representing Yakurr/Abi Federal Constituency, defected to the Peoples Democratic Party (PDP) shortly before the APC primaries.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "cleared", "definition": "公式に認可される、承認される。選挙委員会が候補者を正式に登録・認可することを意味する。"}, {"word": "vying", "definition": "激しく競争する、争う。複数の人が同じ地位や目標を得るために競い合う状況を表す。"}, {"word": "fielded", "definition": "候補者を立てる、出馬させる。政党が選挙に参加させるために候補者を提示することを意味する。"}, {"word": "recalled", "definition": "思い出す、回想する。過去の出来事を記憶から呼び起こすことを表し、文脈では「前回の選挙を思い起こすと」という意味。"}, {"word": "clinching", "description": "（勝利や契約などを）確実なものにする、確定させる。望みの地位や機会を確保することを意味する。"}]}, {"title_ja": "NPFL Roundup: Plateau United thrash Kano Pillars as Rangers cling to top spot", "title_en": "NPFL Roundup: Plateau United thrash Kano Pillars as Rangers cling to top spot", "summary_ja": "Plateau United produced one of their most convincing performances of the campaign, scoring four goals without reply against Kano Pillars The post NPFL Roundup: Plateau United thrash Kano Pillars as Rangers cling to top spot appeared first on Premium Times Nigeria .", "summary_en": "Plateau United produced one of their most convincing performances of the campaign, scoring four goals without reply against Kano Pillars The post NPFL Roundup: Plateau United thrash Kano Pillars as Rangers cling to top spot appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/sports/football/916234-npfl-roundup-plateau-united-thrash-kano-pillars-as-rangers-cling-to-top-spot.html", "state_media": false, "category": "社会", "full_text": "Plateau United delivered the standout result of Matchday 8 of the Nigeria Premier Football League (NPFL) season with a 4-0 thrashing of Kano Pillars, while Rangers International retained top spot after rescuing a late 2-2 draw against Barau FC.\nRangers moved to 17 points from eight matches, just one point ahead of Rivers United, who maintained their unbeaten start with a goalless draw against Abia Warriors.\nPlateau United climbed to third place with 14 points following their emphatic victory, while Sporting Lagos, Warri Wolves and Nasarawa United also recorded important wins in an eventful round of fixtures.\nPlateau United punish Kano Pillars\nPlateau United produced one of their most convincing performances of the campaign, scoring four goals without reply against Kano Pillars.\nPaul Samson opened the scoring after just three minutes, giving the hosts an early advantage. Kano Pillars struggled to contain Plateau United, who doubled their lead through Ekundayo Ojo in first-half stoppage time.\nSamuel Ayanrinde added a third in the 82nd minute before Nenrot Silas converted a penalty in the 90th minute to complete the rout.\nThe result lifted Plateau United to 14 points and third place in the standings, strengthening their early-season challenge.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nFor Kano Pillars, the defeat was a significant setback. The former champions remained on 11 points on 10th position\nRangers survive Barau scare\nRangers needed a late equaliser to preserve their position at the top after playing out a 2-2 draw against Barau FC in Kano.\nIfeanyi Okechukwu put the visitors ahead in the 38th minute, but Joseph Atule equalised for Barau from the penalty spot in the 56th minute.\nAliyu Sugau converted another penalty 12 minutes later to give the hosts the lead.\nRangers, however, refused to leave empty-handed, with Chidiebere Nwobodo scoring in the 90th minute to secure a point.\nThe draw took Rangers to 17 points from eight matches, keeping them narrowly ahead of Rivers United.\nRivers maintained their unbeaten record after a 0-0 draw with Abia Warriors, moving to 16 points and remaining firmly in contention for the top position.\nSporting Lagos fight back\nSporting Lagos came from behind to defeat Bendel Insurance 2-1 after conceding within the opening minute.\nBendel Insurance striker Kayode Oke scored after just 18 seconds, putting the visitors ahead almost immediately.\nSporting responded through Victor Samuel in the 14th minute before Gafar Olaniyan completed the comeback eight minutes later.\nThe victory lifted Sporting Lagos to 12 points level with Insurance.\nIkorodu City, Nasarawa United claim wins\nIkorodu City strengthened their position in the top half of the table with a 2-0 victory over Kwara United.\nKwara United finished with 10 players after Saheed Olaniyi was sent off in the 86th minute for a second bookable offence.\nNasarawa United also secured a 2-0 win, defeating Doma United through goals from Sunday Dapman in the 10th minute and Jofrank Istifanus, who converted a penalty in the 55th minute.\nKun Khalifat FC recorded another 2-0 victory, overcoming Shooting Stars to collect three points in their campaign.\nWarri Wolves boost survival bid\nWarri Wolves earned a valuable 3-1 victory over Inter Lagos as both sides sought to improve their positions in the standings.\nThe result provided a boost for Wolves, while Inter Lagos were left with work to do after the defeat.\nElsewhere, Ranchers Bees and Niger Tornadoes played out a goalless draw despite the hosts being reduced to 10 players.\nHabibu Yakubu received a straight red card for impeding a goal-bound move, but Niger Tornadoes were unable to capitalise on their numerical advantage, even with eight minutes of added time.\nEnyimba suffer another setback\nEnyimba’s difficult start continued with a 4-2 defeat to Katsina United.\nThe loss left the former African champions with seven points from eight matches and deep in the relegation zone.\nWith Rangers and Rivers United separated by just one point and Plateau United moving into third place, the early-season race remains closely contested.\nREAD ALSO: Messi’s retirement: FCTA ex-spokesman proposes FIFA Over-40 World Cup\nStandings after Match Day 8\nNPFL Matchday 8 results\n– Katsina United 4-2 Enyimba\n– Plateau United 4-0 Kano Pillars\n– Ikorodu City 2-0 Kwara United\n– Kun Khalifat 2-0 Shooting Stars\n– Sporting Lagos 2-1 Bendel Insurance\n– Nasarawa United 2-0 Doma United\n– Barau FC 2-2 Rangers International\n– Abia Warriors 0-0 Rivers United\n– Ranchers Bees 0-0 Niger Tornadoes\n– Warri Wolves 3-1 Inter Lagos\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "thrashing", "definition": "圧倒的な勝利のこと。スポーツでは相手に大差をつけて勝つことを意味する。"}, {"word": "emphatic", "definition": "強調的で印象的なこと。ここでは説得力のある、明確な勝利を表している。"}, {"word": "rout", "definition": "敵や相手を完全に打ち負かすこと。特に大差での敗北を指す。"}, {"word": "setback", "definition": "進展や成功を妨げる後退や挫折のこと。ここでは試合での敗北が示す悪い結果。"}, {"word": "contention", "definition": "競争や争いに参加していること。ここではリーグ上位を目指す争いに加わっていることを意味する。"}]}, {"title_ja": "Saudi Arabia Has Few Options as Houthis Aim at Heart of Its Ambitions", "title_en": "Saudi Arabia Has Few Options as Houthis Aim at Heart of Its Ambitions", "summary_ja": "Three deadly attacks by the Iran-backed Houthis in Yemen on an airport in the Saudi capital underscored the asymmetrical nature of their conflict with the kingdom.", "summary_en": "Three deadly attacks by the Iran-backed Houthis in Yemen on an airport in the Saudi capital underscored the asymmetrical nature of their conflict with the kingdom.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/10/11/  and people in the affected region following a magnitude-7.6 earthquake that struck Panama on Friday.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-10/China-expresses-sympathies-to-Panama-over-earthquake-1R8qmp4Mq1W/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "French president's diplomatic adviser to visit China", "title_en": "French president's diplomatic adviser to visit China", "summary_ja": "French President Emmanuel Macron's diplomatic adviser Emmanuel Bonne will visit China from October 9 to 13, a Chinese foreign ministry spokesperson announced on Thursday.", "summary_en": "French President Emmanuel Macron's diplomatic adviser Emmanuel Bonne will visit China from October 9 to 13, a Chinese foreign ministry spokesperson announced on Thursday.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-08/French-president-s-diplomatic-adviser-to-visit-China-1R4EJxyomxG/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Sunday’s attack on Riyadh Airport leaves one killed, 11 others injured — agency", "title_en": "Sunday’s attack on Riyadh Airport leaves one killed, 11 others injured — agency", "summary_ja": "At least 12 people were killed and 300 others were injured in a deadly attack on the same airport on October 10", "summary_en": "At least 12 people were killed and 300 others were injured in a deadly attack on the same airport on October 10", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2200609", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Ukrainian attacks on DPR leave one killed, two others injured over past day", "title_en": "Ukrainian attacks on DPR leave one killed, two others injured over past day", "summary_ja": "Seven residential houses and four civilian infrastructure facilities were damaged in the attacks", "summary_en": "Seven residential houses and four civilian infrastructure facilities were damaged in the attacks", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2200603", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Death toll from Israeli attacks on Lebanon nears 4,390 — health ministry", "title_en": "Death toll from Israeli attacks on Lebanon nears 4,390 — health ministry", "summary_ja": "Meanwhile, 12,424 people have being injured", "summary_en": "Meanwhile, 12,424 people have being injured", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2200599", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "A Global Economic Recovery Built on Shaky Foundations", "title_en": "A Global Economic Recovery Built on Shaky Foundations", "summary_ja": "The latest update of the Brookings-FT TIGER survey reveals that global growth has stabilized, with both advanced and emerging market economies showing positive momentum. But amid persistent inflation and fiscal profligacy, policymakers will still be forced to push forward with structural reforms to ", "summary_en": "The latest update of the Brookings-FT TIGER survey reveals that global growth has stabilized, with both advanced and emerging market economies showing positive momentum. But amid persistent inflation and fiscal profligacy, policymakers will still be forced to push forward with structural reforms to ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/global-economy-is-experiencing-timid-recovery-by-eswar-prasad-and-thomas-riveros-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "A Global Economic Recovery Built on Shaky Foundations\nand\nThe latest update of the Brookings-FT TIGER survey reveals that global growth has stabilized, with both advanced and emerging market economies showing positive momentum. But amid persistent inflation and fiscal profligacy, policymakers will still be forced to push forward with structural reforms to unleash productivity growth.\nITHACA—Despite heightened policy and geopolitical volatility, global growth has stabilized, with both advanced and emerging-market economies showing positive momentum. The October 2026 update of the Brookings-FT TIGER (Tracking Indexes for the Global Economic Recovery) reveals a world economy that, after a series of setbacks, looks set for a year of solid growth.", "translation_ja": "", "vocab": [{"word": "profligacy", "definition": "浪費癖や無駄遣い、特に政府や公的機関による財政の浪費を指す。責任感を欠いた過度な支出を意味する。"}, {"word": "geopolitical", "definition": "地政学的な、つまり地理的位置と政治・経済・軍事力の関係性に関連する。国家間の戦略的な競争や対立を指すことが多い。"}, {"word": "volatility", "definition": "変動性や不安定性を意味し、特に価格や政策環境が急激に変わりやすい状態を指す。市場や政治情勢の予測不可能性を表現する。"}, {"word": "unleash", "definition": "制限や束縛を解くことで、潜在的な力やエネルギーを解放する。経済における生産性の向上などの文脈で使用される。"}, {"word": "momentum", "definition": "勢い、推進力を意味し、経済が継続的に成長する傾向や、何かの動きが加速している状態を指す。"}]}, {"title_ja": "The French Far Right Embraces Austerity", "title_en": "The French Far Right Embraces Austerity", "summary_ja": "In a recent speech detailing her economic program, the French far-right leader Marine Le Pen offered what can only be described as a populist vision of fiscal consolidation. Whether she can make such a paradoxical formulation work will now determine her own future, and possibly that of Europe’s nati", "summary_en": "In a recent speech detailing her economic program, the French far-right leader Marine Le Pen offered what can only be described as a populist vision of fiscal consolidation. Whether she can make such a paradoxical formulation work will now determine her own future, and possibly that of Europe’s nati", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/marine-le-pen-austerity-program-by-laurent-warlouzet-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The French Far Right Embraces Austerity\nIn a recent speech detailing her economic program, the French far-right leader Marine Le Pen offered what can only be described as a populist vision of fiscal consolidation. Whether she can make such a paradoxical formulation work will now determine her own future, and possibly that of Europe’s nationalist right.\nPARIS—Marine Le Pen, the leader of the far-right National Rally (RN) in France, has unveiled an economic program centered on rapid fiscal consolidation—more commonly known as austerity. In doing so, she has broken sharply with her own party’s past and aligned herself more closely with a longstanding trend on the European right.", "translation_ja": "", "vocab": [{"word": "austerity", "definition": "政府支出の削減と財政緊縮政策を意味する経済用語。インフレーション抑制や赤字削減のために厳しい予算管理が行われることを指します。"}, {"word": "fiscal consolidation", "definition": "政府の財政を安定させるために、支出削減と税収増加を通じて赤字を減らすプロセス。austerityと同義で使用されることが多い経済政策用語です。"}, {"word": "paradoxical", "definition": "一見矛盾しているまたは論理的に相容れないように見える状態を表現する形容詞。通常、互いに反対の要素が同時に存在する場合に使われます。"}, {"word": "populist", "definition": "民衆の利益と権力を強調し、エリート層に対抗する政治的立場や戦略を指す形容詞。大衆的な支持を獲得することを目的とした政策を表します。"}, {"word": "unveiled", "definition": "隠されていたものを公開する、または新たな計画や製品を発表するという意味の動詞。reveal（明かす）と同様の文脈で使われることが多いです。"}]}, {"title_ja": "Rating Africa on Its Own Terms", "title_en": "Rating Africa on Its Own Terms", "summary_ja": "For decades, African countries' borrowing costs have been largely determined by major credit-rating agencies whose methods overlook key features of these economies' institutions and markets. The new Africa Credit Rating Agency could mark a turning point, challenging how the continent’s credit risk i", "summary_en": "For decades, African countries' borrowing costs have been largely determined by major credit-rating agencies whose methods overlook key features of these economies' institutions and markets. The new Africa Credit Rating Agency could mark a turning point, challenging how the continent’s credit risk i", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/new-africa-credit-rating-agency-could-mark-turning-point-for-the-continent-by-hannah-wanjie-ryder-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Rating Africa on Its Own Terms\nFor decades, African countries' borrowing costs have been largely determined by major credit-rating agencies whose methods overlook key features of these economies' institutions and markets. The new Africa Credit Rating Agency could mark a turning point, challenging how the continent’s credit risk is graded and priced.\nNAIROBI—Imagine taking an exam and answering every question correctly, only to fail because your paper was graded against the answer key for a different exam. That, in a nutshell, is what happens when African institutions are assessed by major credit-rating agencies like Fitch, Moody’s, and S&P.", "translation_ja": "", "vocab": [{"word": "overlooked", "definition": "見落とされた、軽視されている。ここでは、アフリカ経済の重要な特徴が主要格付け機関の評価方法では無視されていることを意味する。"}, {"word": "graded", "definition": "採点された、評価された。信用リスク評価の文脈では、ある基準に基づいて格付けされることを指す。"}, {"word": "credit-rating agencies", "definition": "信用格付け機関。国や企業の信用度を評価し、借入コストに影響を与ける重要な金融機関。"}, {"word": "credit risk", "definition": "信用リスク。借り手がローンなどの債務を返済できない可能性。格付け機関はこれを評価する。"}, {"word": "turning point", "definition": "転機、転換点。重大な変化や改善が起こる重要な時点を意味する。"}]}, {"title_ja": "The Guardian view on the US, Russia and the international criminal court: Trump’s assault on the rule of law intensifies | Editorial", "title_en": "The Guardian view on the US, Russia and the international criminal court: Trump’s assault on the rule of law intensifies | Editorial", "summary_ja": "A fuel deal with Vladimir Putin, and sanctions against the legal institution, ram home the president’s belief that might is right On Friday, Donald Trump drove home his belief that might is right and the rule of law is an obstacle rather than an essential foundation stone of international order. Fir", "summary_en": "A fuel deal with Vladimir Putin, and sanctions against the legal institution, ram home the president’s belief that might is right On Friday, Donald Trump drove home his belief that might is right and the rule of law is an obstacle rather than an essential foundation stone of international order. Fir", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/11/the-guardian-view-on-the-us-russia-and-the-international-criminal-court-trumps-assault-on-the-rule-of-law-intensifies", "state_media": false, "category": "オピニオン", "full_text": "On Friday, Donald Trump drove home his belief that might is right and the rule of law is an obstacle rather than an essential foundation stone of international order. First came the escalated assault on the international criminal court (ICC), sanctioning the body itself. Then he announced a deal with Russia to buy diesel.\nThe US has long chafed at the notion of being bound by the rule of law that it espoused publicly. That hypocrisy now appears as a lesser vice. The president has declared that “my own morality” is all that constrains him. His brazen flouting of the law, embrace of dictators and rhetorical attacks all undermine global standards.\nWeeks before the midterms, Mr Trump blames Ukrainian attacks on Russian energy facilities for high diesel costs. It is his own unlawful war on Iran that has raised prices. The weekend’s attacks on Riyadh’s international airport, suspected as the work of Tehran-backed Houthis from Yemen, underscored that he cannot simply park that conflict when it suits him.\nThe Moscow deal is unlikely to produce significant shipments; the Russian military runs on diesel. But Ukraine is supposed to heed its message to make life easier on Vladimir Putin. It is Mr Putin (for whom the ICC has issued a warrant) who launched the illegal war, and whose troops launched lethal attacks on civilians this weekend. But in a world turned upside down, Mr Trump blames Volodymyr Zelenskyy for failing to cut a peace deal and says the democratically elected leader should go.\nIt is similarly perverse to wield measures designed to target human rights abusers and war criminals against those who seek to defend their victims. Mr Trump’s attack on the ICC was fuelled first by its Afghanistan investigation – though it has suspended consideration of US actions there – and then the issuing of arrest warrants for Israel’s Benjamin Netanyahu and its former defence minister Yoav Gallant. The court has been preparing for these measures. Marco Rubio, the US secretary of state, said that companies have six months to wind down ties and that US allies must rein in the court: “Either the ICC will end its threats, or we will end the ICC.”\nIn stark (and intentional) contrast, the Nobel committee on the same day announced that this year’s peace laureate is Navi Pillay, a former ICC judge and chair of the UN commission which last year concluded that Israel had committed genocide in Gaza. It was not only a recognition of a remarkable career that began in apartheid‑era South Africa, but a reminder that institutions defending universal principles are under increasing pressure, and must be defended. “Peace requires justice,” the committee said.\nAs the ICC says, it cannot stand alone. The UK, EU and others too were right to criticise the US decision and declare their commitment to the court; invoking blocking statutes against sanctions would add heft to the rhetoric. They must show similar resolve in standing with Ukraine.\nThe nakedness of Mr Trump’s hostility to the rule of law has one benefit: no one can explain it away, or assume it is narrowly bounded. The war on Iran, kidnapping of Venezuela’s president, extrajudicial killings of alleged drug traffickers in the Caribbean and threats over Greenland and Canada have shown how far he will go, and overturned assumptions that allies will be safe. It is clear that the problem is not a “rogue court”, as Mr Rubio has claimed, but a rogue superpower.\n- Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": [{"word": "chafed", "definition": "(不満に)いらいらする、反発する。ある状況や制限に対して不快感や不満を感じている状態を表します。"}, {"word": "brazen", "definition": "厚かましい、ずうずうしい。恐れることなく公然と悪いことをする態度を指します。"}, {"word": "perverse", "definition": "ねじ曲がった、倒錯した。本来の目的や理性に反した、逆行する行動や判断を意味します。"}, {"word": "wield", "definition": "（権力・影響力を）行使する、振るう。力や権限を使って何かを支配・統制することです。"}, {"word": "laureate", "definition": "賞を受賞した人、受賞者。特に栄誉ある賞（ノーベル賞など）の受賞者を指します。"}]}, {"title_ja": "I need smart glasses. How else can I monetize every second of my life? | Dave Schilling", "title_en": "I need smart glasses. How else can I monetize every second of my life? | Dave Schilling", "summary_ja": "They’re the latest technological innovation no one asked for – now with added consent issues! I went to a party recently. A fancy one, filled with expensive people and interesting clothes. You might find this surprising, as I expend hundreds of words a week in this publication bemoaning human intera", "summary_en": "They’re the latest technological innovation no one asked for – now with added consent issues! I went to a party recently. A fancy one, filled with expensive people and interesting clothes. You might find this surprising, as I expend hundreds of words a week in this publication bemoaning human intera", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/11/smart-glasses-content-creation", "state_media": false, "category": "オピニオン", "full_text": "I went to a party recently. A fancy one, filled with expensive people and interesting clothes.\nYou might find this surprising, as I expend hundreds of words a week in this publication bemoaning human interaction, but I love parties. I like free champagne, passed appetizers and forced, go-nowhere small talk.\nParties in Los Angeles are even better, because they usually involve at least one celebrity. In the case of this most recent event, the celebrity in question was a Real Housewife of Beverly Hills. Well … technically a “friend of”, Bravo reality TV parlance for a person who isn’t in the main cast and appears sporadically on the show thanks to a social connection to one of the actual Housewives. It’s sort of like being Newman on Seinfeld, or the vice-president of the United States. Easy work, if you can get it.\nOf course, I had to inform my friends who are reality TV fans that an orbiting celestial body had entered my field of vision. But how to prove this encounter really happened? Could I truly get the reaction I wanted from them without photo evidence?\nI began to ponder how to snap a picture without her noticing. Perhaps a reflection in a mirror? Pretending I was taking a photo of the canapes and whoops, I got you in the corner of the frame. I opted for the clever mirror trick and got the whoa text back from my friends, which means they were sufficiently gobsmacked by my brush with fame.\nI was satisfied, but left with the lingering feeling that I was part of a persistent shattering of the few walls of privacy left in our teetering society. I spent actual time from the ticking clock of my life to assess how to take a candid photo of a famous person trying to drink a glass of wine.\nWhat the hell is my problem? At that moment, I felt like I was one more LA party away from tossing my morals in the trash and buying a pair of smart glasses.\nSmart glasses are the latest intrusive technological innovation that no one asked for. Instead of just helping you see better or blocking out the punishing light rays of the sun, smart glasses are essentially computers you wear on your face. They can mirror your phone or laptop screen, send and receive phone calls and text messages, and most importantly for the burgeoning creep economy, capture pictures, audio and video.\nSmart glasses – from companies like Meta and Viture, which cost about $300 to $500, or nearly $1,300 for a high-end variety from Xreal – are one more incursion by technology into what is left of the natural world. Fly some hideous graphics in my face while I tromp through the park, so I might quadruple-task (naturemaxxing, framemogging some unc feeding pigeons, checking in on my Kalshi, and livestreaming the whole thing) and optimize my 30-minute lunch break.\nI don’t think I actually need more gadgets, and yet the product lines keep expanding. I have a phone, a tablet, a watch and glasses that all connect to the internet and feed me hourly distractions and furiously pump me for data.\nThis is why I can’t imagine any company going to market with a brain implant with wifi capability. Once you’ve stuck a microchip in my head, you can’t sell me anything else to wear.\nThere are still so many more hunks of metal and plastic with touch screens or artificial reality interfaces to shove into my pocket or on my body. A nose ring that lights up when I get a new like on a YouTube video. Maybe a hat that broadcasts my TikToks 24/7. My body is not my own. It is the property of Meta, a vessel for the free flow of information into the company’s willing gullet.\nBut what if that sweet online engagement is driven by videos full of people who never agreed to participate?\nMany courts have banned smart glasses in their proceedings, but people are still trying to bring them in anyway. Cruise lines, movie theater chains and restaurants are restricting smart glasses, too. And now Norway is planning a temporary ban for certain public places. Eventually, there won’t be anywhere to use them, outside of an old barn, a closet or an abandoned Hooters restaurant.\nSo, if it seems like almost the entire world thinks smart glasses are primarily for perverts, why does the tech industry persist in suggesting consumers buy them? Surely the obscene profits that Apple collects from the umpteenth edition of the iPhone have seduced Silicon Valley into chasing another world-changing innovation that no one can live without.\nExcept, we already have the iPhone. And the Apple Watch. And the iPad. I have enough gadgets in my life to pretend like I’m a particularly washed James Bond, engaging in mundane adventures like “creating a shopping list” or “tracking how many times I blink”.\nWhen so much of our economy is tied to “content creation”, it makes some corrupted sense to give the workers trapped in the coalmines shinier pickaxes. I can’t just record an explainer video complaining about declining privacy or voracious technocapitalism. I need a fancier Bluetooth microphone, a camera stand for my phone, a ", "translation_ja": "", "vocab": [{"word": "expend", "definition": "時間やお金などを費やす、消費する。ここでは「週に何百語も費やす」という意味で使われており、特に資源や努力を使い切ることを表す。"}, {"word": "bemoan", "definition": "〜を嘆く、残念がる。ネガティブな感情や不満を表現する際に使われ、この記事では人間関係への不満を述べることを指している。"}, {"word": "parlance", "definition": "特定の分野や集団で使われる言葉遣い、専門用語。「Bravo reality TV parlance」は「ブラボーのリアリティTV業界用語」という意味で、特定の業界の言語や表現方法を指す。"}, {"word": "candid", "definition": "自然な、率直な、ぶっきらぼうな。写真の文脈では「意図していない、気づかれずに撮られた」という意味で、ここでは「無意識のうちに撮られた写真」を意味する。"}, {"word": "incursion", "definition": "侵入、侵害、侵略。ここでは技術が私生活やプライバシーという領域に無断で入り込んでくることを比喩的に表現している。"}]}, {"title_ja": "Fixated on AI, the world has forgotten what is staring it in the face: nuclear annihilation | Simon Tisdall", "title_en": "Fixated on AI, the world has forgotten what is staring it in the face: nuclear annihilation | Simon Tisdall", "summary_ja": "This is no scoffing matter. The accelerating proliferation of advanced nuclear weapons is bringing ‘end times’ closer by the day Humankind has fearfully and sometimes joyfully anticipated the end of the world ever since it began. The Bible’s Book of Revelation speaks of “end times”, a period of trib", "summary_en": "This is no scoffing matter. The accelerating proliferation of advanced nuclear weapons is bringing ‘end times’ closer by the day Humankind has fearfully and sometimes joyfully anticipated the end of the world ever since it began. The Bible’s Book of Revelation speaks of “end times”, a period of trib", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/11/ai-annihilation-advanced-nuclear-weapons", "state_media": false, "category": "オピニオン", "full_text": "Humankind has fearfully and sometimes joyfully anticipated the end of the world ever since it began. The Bible’s Book of Revelation speaks of “end times”, a period of tribulation, war, famine, plague, floods and environmental catastrophe that may seem a less absurd prospect today than perhaps it once did. Islam, too, posits a fateful day of judgment or day of reckoning. Christian evangelicals believe that, in the final rapture, a chosen few – the righteous or the “elect” – will be saved while sinners burn. It’s a minority view. Matthew’s gospel predicts most people will defy, ignore or ridicule warnings of imminent Armageddon. Peter, another of Jesus’s disciples, agreed: “In the last days, scoffers will come, scoffing and following their own evil desires.” Yet such worldly scepticism does not mean a universal cataclysm is less likely. It may make it more probable.\nDonald Trump’s blanket denials of the dangers ostensibly posed by artificial intelligence, whose uncontrolled development is seen by some as the latest harbinger of apocalypse, could be interpreted as fulfilling Peter’s prophecy. This US president, the nearest thing the world has to a one-man doomsday machine, is a great one for scoffing and evil desires. In Robert Harris’s 2019 novel, The Second Sleep, a worried scientist lists half a dozen ways the world might end. They include devastating climate change, pandemic disease, a giant asteroid collision with Earth, or some other overwhelming calamity. Few heed the fictional scientist’s fears. In the event, what destroys him and almost everybody else is a disturbingly plausible cyber crash – a global digital and internet meltdown.\nWhile arguments rage over whether large language models will acquire consciousness and moral agency – and the power to delete humanity – existential AI threats remain, as of now, open to mitigation. In sharp contrast, extraordinary complacency surrounds the most pressing, avoidable and proven human-made threat to life on Earth. It is as if the world has been seized by collective deafness and by a blind refusal to see what’s staring it in the face. This is no scoffing matter. The accelerating, global proliferation of advanced nuclear weapons is bringing real-time “end times” closer to home by the day. The question increasingly is not “if” but “when” limited or full-scale nuclear warfare will erupt. Eighty-one years after Hiroshima, how much longer can our luck hold?\nAlarm bells are ringing, if only people would listen. Desperate Vladimir Putin recently threatened to deploy Russia’s entire nuclear arsenal, comprising about 4,400 warheads, against Nato countries if they activated a supposed plan to invade the Baltic exclave of Kaliningrad. He offered no evidence for his claim, and it’s true that the frequent Kremlin nuclear sabre-rattling since its full-scale invasion of Ukraine went pear-shaped has diminished Moscow’s credibility. Yet that in itself is destabilising. To work, nuclear deterrence relies on an adversary believing the threat is real. Disbelief invites miscalculation. At the same time, Putin’s inability to halt Ukraine’s conventional drone and missile attacks deep inside Russia may be edging him closer to pressing the nuclear button, possibly in the form of low-yield tactical or “battlefield” nukes.\nTrump’s bottom-line justification for the illegal US-Israel war on Iran is his wilfully mendacious claim that Tehran was weeks away from obtaining the bomb. He claims to be protecting the world from nuclear war. Yet his reckless threat, issued at the UN, to “annihilate the Islamic Republic” implies a possible US nuclear attack. Trump’s hypocrisy is stunning. The US is upgrading its nuclear arsenal of 3,700 warheads and may resume nuclear tests. It unreservedly supports Israel’s hidden nuclear weapons programme. And Trump is pursuing a lucrative deal with Saudi Arabia, another bitter foe of Iran, to provide civilian nuclear technology that he knows could be repurposed to make weapons. That has prompted regional countries such as Turkey and Egypt to consider going nuclear.\nSimilarly perilous trends are evident across Asia. North Korea’s great panjandrum, Kim Jong-un, has succeeded in gaining de facto international acceptance of his country’s status as a nuclear weapons state. South Korea said in August that Pyongyang now possesses up to 120 warheads – which Kim brandishes to intimidate neighbours. All but discarded are the twin principles that underpinned the west’s postwar Korea policy: reunification and denuclearisation. Heedless of first-term humiliations, Trump is again seeking a summit with Kim, whom he bizarrely terms a friend. “As long as I’m around, he [Kim] is going to be fine,” he boasted. Japan and South Korea don’t share his confidence. Both debate acquiring nuclear weapons in self-defence. Meanwhile, China’s president, Xi Jinping, having again bamboozled a fawning Trump at their Washington summit, is reportedly building nukes like there’s no tomorrow – which", "translation_ja": "", "vocab": [{"word": "harbinger", "definition": "将来の悪い出来事の前触れ、兆候。何か悪いことが起こることを予示するもの。"}, {"word": "complacency", "definition": "自己満足、油断。現在の状況に満足して、潜在的な危険に気づかないか無視する状態。"}, {"word": "mitigation", "definition": "危機や問題の程度を軽減すること、緩和すること。被害や影響を減らすための対策を講じること。"}, {"word": "proliferation", "definition": "急速な増加や拡散。特に危険な物質や兵器などが広く広がること。"}, {"word": "existential", "definition": "人間の存在そのもの、または生存に関連する。存在そのものの脅威となるような極めて深刻なレベルの。"}]}, {"title_ja": "Iran’s Theory of Victory", "title_en": "Iran’s Theory of Victory", "summary_ja": "Tehran’s fight for great-power status in the post-American Middle East.", "summary_en": "Tehran’s fight for great-power status in the post-American Middle East.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/irans-theory-victory", "state_media": false, "category": "オピニオン", "full_text": "When it comes to Iran, the Trump administration has a decidedly dismal record. It failed to wear down the Islamic Republic with months of intense bombings. It could not bend Iran’s will at the negotiating table. Yet despite seven months of setbacks, U.S. officials believe that they have turned the page. They have implemented fresh sanctions while maintaining the existing American blockade of the country’s southern coast, throttling its access to outside commerce. As a result, they have concluded that the Islamic Republic will soon either concede or be downed. “We are going to economically asphyxiate this regime,” Treasury Secretary Scott Bessent declared on September 1.\nThere is no doubt that Washington has dealt significant damage to Iran. But the Islamic Republic does not believe it is unraveling. In fact, Tehran thinks that it will defeat the United States—and it isn’t hard to see why. The Iranian government did not merely survive the U.S.-Israeli bombardment. It retaliated ferociously, damaging American military bases and obstructing the Strait of Hormuz. Its people are paying a hefty economic price thanks to damage caused by the war and Washington’s cutoffs, but much of the population has rallied around the flag and seems to accept that hardship is necessary if Iran is to defend itself. As a result, Tehran has been emboldened. Its officials may not see eye to eye on each tactic. But they share the same ambitions: evicting U.S. forces from the Persian Gulf, forcing Washington to remove all its sanctions, and getting the United States to accept that Iran is a great power.\nThis agenda might sound overly audacious, given that Iran has been materially weakened. But the Islamic Republic thinks its aims are within reach. It believes its military can drive U.S. troops from the Persian Gulf by continuing to strike American bases directly and by getting Arab countries to push the United States to leave. It thinks that by wreaking havoc on energy markets, it can force Washington to lift economic restrictions, as well. Tehran’s theory of victory, in other words, is that it can hold out and inflict enough pain that the United States will end its containment of Iran.\nCLOSING RANKS\nNo one doubts that Iran has been battered by war. Months of American and Israeli bombs have damaged the country’s industries and infrastructure, spiking unemployment and pushing more Iranians into poverty. Washington’s sanctions and naval blockade have caused rampant inflation. And the American and Israeli militaries can count many tactical successes, including the assassination of former Iranian Supreme Leader Ali Khamenei.\nBut strategically, the conflict has been disastrous. U.S. officials believed that punishing aerial bombardments and sweeping efforts to degrade the Iranian economy would bring the Islamic Republic to its knees. They didn’t. Washington hoped that assassinating Khamenei would prompt a mass antigovernment uprising. That scheme also failed. Instead, Khamenei’s death brought out the Islamic Republic’s ardent supporters. They marched every night in the country’s main cities and were eventually joined by Iranians of other political hues, who rallied in support of their homeland. When the war started, Turkey planned to accommodate 70,000 Iranian refugees. But few people fled. In fact, as the war progressed, many Iranians living abroad returned home, including long-exiled cultural figures, journalists, and politicians, such as the singers Mohsen Namjoo and Bijan Mortazavi.\nThis surge in nationalism is not an endorsement of the Islamic Republic. Many Iranians remain deeply unhappy with the country’s leadership. But the anger at their government has been subsumed by their anger at Washington. Previously, most Iranians were skeptical of the Islamic Republic’s claim that the United States was bent on their country’s destruction and in fact hoped Tehran would seek better relations with Washington. But the bombings of Iranian cities and U.S. President Donald Trump’s repeated threats to annihilate the country’s civilization (saying, for example, that he might “blow the entire nation up” and drive it “into hell with no chance of survival”) have changed attitudes. Iranians across the political spectrum now do think that the United States wants to obliterate their country—or at least make it capitulate to every American demand.\n Iranians do not see the U.S.-Israeli war as liberating.\nThis conclusion was apparent in our lengthy conversations with Iranians of all ideologies, which we started conducting when Washington first bombed Iran, in June 2025, and have continued to the present, tracing their political attitudes over that period. The vast majority expressed deep distress and anger at their government after the massacres that took place in response to January’s mass protests. But we found that political opinions have shifted drastically as the war has dragged on and as Trump has upped his annihilatory rhetoric. “We believed so much in", "translation_ja": "", "vocab": [{"word": "asphyxiate", "definition": "窒息させる、息の根を止める。比喩的に経済的に圧迫して機能不全に陥らせることを意味する。"}, {"word": "ferociously", "definition": "猛烈に、激しく。激怒や激しい怒りをもって何かに対抗する様子を表現する。"}, {"word": "emboldened", "definition": "勇気づけられた、大胆になった。成功や利益により自信を持ち、さらに積極的な行動をとるようになった状態。"}, {"word": "audacious", "definition": "大胆な、勇敢な、あるいは無謀な。従来の限界を超えた野心的で冒険的な計画や主張を指す。"}, {"word": "rampant", "definition": "蔓延している、はびこっている。病気や社会問題などが制御不能に広がっている状況を表す。"}]}, {"title_ja": "Trump Is Gutting America’s Core Geopolitical Advantage", "title_en": "Trump Is Gutting America’s Core Geopolitical Advantage", "summary_ja": "Robert Zoellick, an expert on the global economy who served as U.S. trade representative and World Bank president, makes the authoritative case that President Donald Trump’s antagonism toward Canada and Mexico is destroying an economic and security partnership that that enables the United States to ", "summary_en": "Robert Zoellick, an expert on the global economy who served as U.S. trade representative and World Bank president, makes the authoritative case that President Donald Trump’s antagonism toward Canada and Mexico is destroying an economic and security partnership that that enables the United States to ", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/trump-gutting-americas-core-geopolitical-advantage", "state_media": false, "category": "オピニオン", "full_text": "The Trump administration’s attack on Canada and Mexico is cracking the foundation of the United States’ global power. Friendly relations with neighbors enhance security, promote mutual economic gain, and make it easier to handle transnational challenges. Weak neighbors export trouble. Today, Canadians perceive U.S. President Donald Trump’s high tariffs and belittling of their country as the “51st state” as assaults on Canada’s economy and independence. In Mexico, Trump’s economic coercion and threats of military intervention have revived deep historical anxieties about gringo hegemony.\nThe North American partnership took generations to forge. During the nineteenth century, the United States’ foreign policy concentrated on its home continent, where it competed with France, Mexico, Russia, Spain, the United Kingdom, and indigenous peoples for dominance. As the United States became a global power in the twentieth century, U.S. strategists took North American relations for granted. Washington turned its attention to Europe, the Asia-Pacific, and the Middle East. Since the closing years of the Cold War, however, U.S. presidents have recognized the need to invest in North America. Ronald Reagan laid out the strategic rationale clearly when he launched his presidential campaign in 1979: “The key to our own future security may lie in both Canada and Mexico becoming much stronger than they are today,” he explained. “It is time we stopped treating our nearest neighbors as foreigners.”\nGeopolitics begin with geography, and the United States’ geography gives it an enormous advantage over the world’s other major powers. China and Russia each have to manage relationships with 14 neighbors, many of which are unfriendly or carry resentments from histories of conflict. India must deal with six, including a nuclear-armed rival. All three powers’ access to the world’s seas depends on passage through maritime chokepoints. In contrast, the United States borders two benign neighbors and enjoys open sailing on two vast oceans. Close cooperation with Canada and Mexico enhances homeland security, attracts investment, promotes innovation, creates a huge market rich in resources and talent, and helps all three countries deal with criminal networks, illegal immigration, and threats to clean air, water, and wildlife.\nA safe, resilient, and adaptive North America is the starting point of U.S. global strategy. Washington is best positioned to navigate an uncertain world when the United States, Canada, and Mexico present a common front. Yet Trump’s bullying is driving the United States’ natural partners away. The president is destroying a precious geopolitical asset: a strong continental base from which Washington projects power.\nCONTINENTAL VISION\nWilliam Seward, who served as U.S. secretary of state from 1861 to 1869, first appreciated that good relations with the United States’ neighbors would boost the country’s global influence. He asserted that to have “control of this continent is to be . . . the controlling interest in the world.” When he was negotiating the U.S. purchase of Alaska in 1867, Seward observed that Alaska and the Aleutian Islands “extend[ed] a friendly hand to Asia.” He also tried to buy Greenland, Iceland, the Hawaiian Islands, and islands in the Caribbean, hoping that the purchases would help secure the United States’ oceanic approaches.\nSeward recognized, however, that the United States could also boost its power by strengthening economic links, not just by adding territory. He abhorred European imperial conquests of foreign lands. He had also opposed the 1846–48 U.S. war with Mexico. At the end of the U.S. Civil War in 1865, Seward prevented Generals Ulysses S. Grant and Philip Sheridan from invading Mexico to depose the Habsburg archduke whom the French had installed as emperor. He reasoned that an invasion would arouse Mexican hostility and that the Mexicans could depose the interloper themselves—which they did, in 1867.\n The United States’ geography gives it an enormous advantage.\nSeward dealt diplomatically with the United States’ northern neighbor, too. In 1867, the British government united its North American colonies to form the Canadian Confederation, in part to deter Washington from invading Canada in retaliation for London’s assistance to the Confederacy during the Civil War. Seward responded by choosing the peaceful path of arbitration to resolve wartime claims against the United Kingdom.\nSeward envisioned a North American union created through free choice, not coercion or conquest. He believed in the attractive power of the United States. Commerce, he maintained, would be the new “god of boundaries” that would redraw borders and pull countries together. Ernest Paolino, his biographer, termed this idea Seward’s “law of imperial gravity.”\nThe restoration of Mexican President Benito Juarez in 1867, the same year the Canadian Confederation was formed, offered the prospect of a democratic North America with", "translation_ja": "", "vocab": [{"word": "hegemony", "definition": "ある国や勢力による支配や覇権のこと。政治的・経済的な優位性を背景とした支配力を意味する。"}, {"word": "geopolitics", "definition": "地理的条件が国家間の政治関係や戦略に与える影響を研究する学問。地政学的という形容詞でも使われ、地理的位置に基づく戦略を指す。"}, {"word": "benign", "definition": "害をもたらさない、友好的である、穏和なという意味。医学では悪性ではない腫瘍などを指す。"}, {"word": "resilient", "definition": "困難や危機から回復する能力がある、弾力的である。ビジネス用語として組織や制度の持続可能性を表す。"}, {"word": "chokepoint", "definition": "通行が制限される戦略的に重要な地点。海峡や通路など、通過を支配できる場所を指す。"}]}, {"title_ja": "The Case for Economic Espionage", "title_en": "The Case for Economic Espionage", "summary_ja": "America should spy on foreign companies to help its own.", "summary_en": "America should spy on foreign companies to help its own.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/case-economic-espionage-david-cohen", "state_media": false, "category": "オピニオン", "full_text": "For decades, both adversaries and allies of Washington have spied on American companies to gain insights into innovation in the United States. During the Cold War, KGB spies routinely sought to steal trade secrets from U.S. industries. In the 1980s, French intelligence stalked American technology firms. In recent years, China has been especially aggressive on this front. The Center for Strategic and International Studies recorded 224 incidents of Chinese-sponsored espionage against the United States that occurred between 2000 and 2023, of which more than half targeted commercial technologies. Invariably, the goal of this kind of espionage is to help key sectors in the spying country rapidly replicate or surpass American advances. As the former National Security Agency director Keith Alexander memorably put it, cybertheft of U.S. technologies amounts to “the greatest transfer of wealth in history.”\nYet amid this brazen robbery, the U.S. intelligence community has long maintained a policy against spying on foreign companies to provide a commercial advantage to U.S. businesses. That self-imposed ban on economic espionage was reaffirmed repeatedly throughout the Cold War and in the decades since, including by President Barack Obama, who codified it in 2014 and tried to get China and other countries to follow suit. At the time, this made sense. U.S. economic policy had long forsworn government intervention in the private market, and providing select firms with secret intelligence would unavoidably distort the economy. In any case, through much of the Cold War and early post–Cold War era, most technological innovation important to national security emerged under government auspices rather than in the commercial market. Moreover, its lead in many technologies meant that the United States had much more to lose than to gain by legitimizing commercial spying.\nToday, these rationales no longer hold. To an ever-growing extent, U.S. national security now depends on private-sector innovations. In such disparate areas as artificial intelligence, semiconductors, quantum science, bioengineering, next-generation energy, and space, breakthroughs that are crucial to the country’s power and influence are emanating from private companies. At the same time, even as technological supremacy has become increasingly central to national security, the U.S. lead in many crucial advanced technologies is being contested or even erased by China. By abstaining from economic espionage, the United States has tilted the playing field against itself and magnified the Chinese threat.\nTo right the balance, the United States should allow U.S. intelligence agencies not only to collect commercial secrets from foreign companies but also to deliver that intelligence where it could have the greatest impact: to the firms producing the frontier technologies that will be vital to U.S. national security in the years to come. In September, the Trump administration appeared to take a step in this direction when it disclosed that the CIA and other intelligence agencies had begun to broaden their long-standing espionage efforts against China, including Chinese industry.\nBut a comprehensive strategy requires the United States to formally lift its existing prohibition on economic spying. The government must also establish robust rules and oversight to ensure that commercially valuable intelligence shared with the private sector serves the national interest, preserves competition, and, critically, is not used to advance partisan, political, or personal ambitions. Although economic espionage is not without risk, unilaterally renouncing the practice in the current global environment is far more dangerous.\nPARIS IS LISTENING\nAlthough the United States has generally avoided commercial spying, it is not without precedent in American history. During the founding period, both early states and the newly formed Republic paid bounties to private citizens to encourage the theft of crucial technology from Britain. To Alexander Hamilton, the first secretary of the treasury, obtaining pilfered industrial secrets was a crucial way to spur the country’s economic independence from its former colonial master. But as Hamilton’s economic interventionism gave way to Thomas Jefferson’s laissez-faire approach, the bounty programs faded away.\nThe first modern U.S. debates about economic espionage date to the Cold War. In the early 1970s, when Japanese manufacturers began to pose a threat to the American auto industry, the Nixon administration considered having the government provide intelligence to Detroit automakers to improve their commercial prospects. But the president’s Foreign Intelligence Advisory Board rejected the plan as “inappropriate.” During the Carter administration, Stansfield Turner, the director of the CIA, again broached the idea of economic espionage internally at the agency but also met with strong resistance. As let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-12 00:03 JST";
  renderTabs();renderList();
})();
</script>
</body>
