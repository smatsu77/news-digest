in retaliation to the latest wave of levies on Canadian imports imposed by President Donald Trump last weekend.\nThe Canadian tariffs will apply to nearly C$28bn ($20bn; £15bn) worth of American products, ranging from steel to furniture, fresh tuna and cotton T-shirts, officials announced on Tuesday.\nThe list of targeted products is designed to match Canadian goods hit by the US. The Canadian levies are set to come into effect on 8 September.\nIt is the latest escalation after US-Canada trade talks collapsed late last week, with each side accusing the other of making last-minute demands that were unreasonable.\nFinance Minister François-Philippe Champagne said that Canada's retaliation is in response to 50% tariffs imposed by the Trump administration on a range of Canadian goods after trade talks fell apart on Friday.\n\"Those tariffs will have real consequences for Canadian workers, businesses and communities across our nation,\" he said. \"Canada must respond.\"\nChampagne characterised Canada's retaliation as \"proportionate\" and \"strategic\".\nHe added that Canada will also offer businesses and workers impacted by US tariffs an additional C$7.5bn for support programmes designed to minimise job losses and keep companies afloat.\nPlacing taxes on trade between what are historically two of the world's closest trading partners will undoubtedly lead to pain on both sides of the border.\nSupply chains which have been developed over decades are set to see increased trading costs due the latest tariff announcements made from both the US and Canada, ultimately hitting businesses of all sizes and consumers through potentially higher prices.\nPolls suggest the majority of Canadians support their government in holding firm against the US.\nBut some questions remain on exactly why trade talks fell apart, with the Conservative opposition asking that the full text of the draft deal with the US be released.\nBusinesses have also expressed concerns about the impact of a prolonged trade war with Canada's largest trading partner.\nThe White House released a statement after Canada announced its counter-tariffs, saying that the US was prepared to offer Canada \"the most preferential market access of any country on Earth\" in recent trade talks.\n\"Instead of partnership, Canada chose unreasonable demands, walk-backs, and flat-out rejection,\" it said.\nIn a series of Tuesday posts on Truth Social, Trump also accused Canada of \"ripping off\" the US for decades and of charging American farmers steep tariffs.\n\"I deal with many countries, and Canada is easily the most difficult and unreasonable,\" Trump wrote. \"They feel entitled, but they are not a State, and will be entitled no longer!\"\nHe suggested that he will change the name of Lake Ontario, one of the Great Lakes on the US-Canada border, to Lake America, writing: \"We don't expect to doing much business with Ontario any longer.\"\nTrump threatened this week to hike US tariffs on Canadian automobiles to 50% as of 1 January.\nPrime Minister Mark Carney responded by accusing Trump of wanting to \"destroy\" Canadian industries including the automobile manufacturing and steel and aluminum sectors.\nPublic rhetoric on both sides reached a fever pitch on Monday, but some officials struck a more diplomatic tone on Tuesday with hopes that talks could be resumed.\nAfter calling Trump a \"loser\" on Monday at a news conference, Ontario Premier Doug Ford acknowledged in an interview with CNN that \"things got a little heated\".\n\"But I want to make a deal — a good deal for the American people, a good deal for Canadians,\" Ford said.\nThe escalation also puts into question the future of a North American free trade pact between Canada, the US and Mexico called the USMCA.\nPresident Claudia Sheinbaum had despatched her economy secretary, Marcelo Ebrard, to Washington for emergency talks after trade negotiations collapsed with Canada.\n- How Canada could hit back to hurt the US economy - and Trump y measures against what it called illegal unilateral sanctions. Analysts doubt the sanctions' effectiveness, noting China is unlikely to comply and roughly 90% of Iran's oil exports go to China.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyl8965j5go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "China hits out at 'illegal' new US sanctions on Iran and trading partners\n- Published\nChina has vowed to protect its interests after the US announced plans to widen economic sanctions against Iran and its trading partners, which include Beijing.\nForeign ministry spokesman Lin Jian said China was firmly opposed to what it called \"illegal unilateral sanctions\" and would take \"all necessary measures\" to safeguard its rights.\nThis came after US Treasury Secretary Scott Bessent announced the new measures on Monday, warning any nation financially partnering with Iran would be isolated.\nChina is the biggest buyer of Iranian oil, although the trade has declined under the US blockade of Iran's ports.\nLin said: \"Cooperation between China and Iran has always been conducted within the framework of international law and should not be interfered with or disrupted.\"\nBessent described the plans for sanctions as \"the single greatest financial offensive ever\" against Iran, warning banks and businesses would share in Iran's isolation if they refused to cut ties with the country.\nHe declined to focus on specific nations, but said US President Donald Trump would be phoning world leaders \"with specific requests to cease their interactions with the regime\".\nHowever, responding to a question about Chinese banks, Bessent said he wanted to make clear \"no one was above the reach of US sanctions\".\nThe announcement comes ahead of planned talks between Trump and Chinese President Xi Jinping next month.\nWashington is likely to be wary of potential retaliation from Beijing, which processes the majority of the world's rare earths and other critical minerals, crucial in the manufacture of many high-tech products.\nBeijing has already tightened export controls on rare earths as part of previous trade negotiations with the US.\nChina's response followed Iranian Economy Minister Ali Madanizadeh saying Tehran was \"fully prepared\" for the wider sanctions, which he said would lead to \"another defeat\" for the US.\n\"The government is and was ready and has a two-year plan to manage these events,\" he told state television.\n\"We also have our own tools and know how to play the game,\" he said, adding Tehran had been \"waiting for these plans for a long time\".\n- Iran says it is 'fully prepared' to counter widened US economic sanctions \n  - Published12 hours ago\nThe US has dubbed its latest sanctions \"Operation Economic Outcast\" and described them as an \"economic D-Day\" against Iran.\nIt comes almost six months after the start of the Iran war.\nThe conflict has since led to hikes in oil prices worldwide, with Tehran effectively blocking exports through the Strait of Hormuz - a waterway vital to the global economy. The US has also slowed traffic via its own naval blockade.\nRecent attempts to end the conflict via diplomacy have failed, and a 60-day ceasefire formally expired last week with no sign of a settlement.\nWith the announcement of new sanctions, the US treasury secretary claimed America was \"no longer managing the Iranian threat, we are ending it\".\nUK Chancellor John Healey said the British government supported \"US work to secure a diplomatic solution and welcome efforts to increase pressure\".\nIran is already under heavy sanctions from the US, but Bessent said these go further.\nHe said the Treasury had mapped financial channels, facilitators and networks used by Iran to evade sanctions to trade oil, imposing sanctions on almost 60 entities, individuals and vessels.\nBut analysts had cast doubt on the latest measures even before China's response.\nDavid Oxley, chief climate and commodities economist at Capital Economics, told the BBC the direct impact on Iran's energy revenues would be \"somewhat of a damp squib\".\n\"We suspect that the new package will have only a limited direct impact on Iranian energy flows in the short term,\" he added.\nThis is partly due to the fact roughly 90% of Iran's oil goes to China, he said, \"which has not recognised US sanctions in the past and is unlikely to be cowed this time either\".\nAli Vaez, deputy director of the Middle East and North Africa Program at the International Crisis Group, said: \"Generally, the Chinese are against unilateral sanctions. They would comply with multilateral or international sanctions, but unilateral sanctions just imposed by the US - they have always seen that as illegitimate.\"\nAnd although Iran's neighbours like Pakistan, Turkey and Iraq want to maintain good relationships with the US, they \"can't really afford to cut off ties with Iran\", Vaez told BBC Radio 4's Today programme.\nHe said putting economic pressure on Tehran \"doesn't work\" because the Iranian regime is willing to \"absorb any pain\" and pass it onto the people.\nOther trade partners that could be affected by the US announcement include India and Russia, who have not yet responded.", "translation_ja": "", "vocab": [{"word": "unilateral sanctions", "definition": "一方的に発動される経済制裁。複数国の合意なく単一国家（この場合は米国）が他国に対して独自に科す制裁措置を指します。"}, {"word": "safeguard", "definition": "保護する、守るという意味の動詞。権利や利益を危険や侵害から守るために必要な措置を取ることを表します。"}, {"word": "financial offensive", "definition": "経済的な攻撃戦略。金融面での圧力を通じて相手国に対して大規模な経済的打撃を与えることを意味します。"}, {"word": "retaliation", "definition": "報復措置。相手からの措置に対して同等またはそれ以上の対抗措置を取ることを指します。"}, {"word": "evasion", "definition": "回避、脱出という意味。この場合は制裁を逃れるために採られる戦術や手段を指します。"}, {"word": "damp squib", "definition": "期待外れ、がっかりした結果。予想されたほどの効果や影響を発揮しない措置を指す慣用表現です。"}, {"word": "multilateral", "definition": "複数国による、多国間による。二国間ではなく、複数の国々が協力して行う措置や協定を意味します。"}]}, {"title_ja": "CIA長官ラットクリフ、モスクワへの予告なし訪問で高官協議に臨む", "title_en": "CIA Chief Ratcliffe Makes Unannounced Trip to Moscow for High-Level Talks", "summary_ja": "CIA長官ジョン・ラットクリフは火曜日、予告なくモスクワを訪問し、ロシア当局者との協議に臨んだと報じられている。ワシントンとモスクワは訪問の詳細を確認していない。この異例の高官外交は、エスカレーション管理、捕虜釈放、ウクライナ関連問題に焦点を当てている可能性がある。", "summary_en": "CIA Director John Ratcliffe traveled to Moscow on Tuesday for unannounced talks with Russian officials, with neither Washington nor Moscow confirming details of the visit. The rare high-level diplomatic engagement may focus on escalation management, prisoner releases, or Ukraine-related matters. The trip marks one of the highest-level US official visits to Russia during President Trump's second term.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c87vg9x5d7do?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "CIA chief travels to Moscow for unannounced talks, US media reports\n- Published\nThe head of the US Central Intelligence Agency (CIA) has travelled to Moscow for unannounced talks, the BBC's US news partner CBS has reported.\nJohn Ratcliffe reportedly arrived in the Russian capital earlier on Tuesday. Neither Washington or Moscow have confirmed the nature of the visit or who he was due to meet.\nIn-person talks between high-level American and Russian officials are rare.\nFlight tracking data confirmed a large US military aircraft travelled to Russia from the US via Latvia on Tuesday. It departed later on Tuesday.\nBBC News has contacted the CIA, the White House and Pentagon for comment.\nFootage posted on social media showed the C-17 transport plane approaching Moscow's Vnukovo international airport.\nIt departed Riga airport at 05:50 GMT and appeared to have landed in the Russian capital at around 07:04 GMT, according to data from FlightRadar24. It returned to Riga shortly before 17:00 GMT.\nFootage on social media also purported to show a diplomatic motorcade travelling through Moscow.\nAhead of the trip, the US told Ukraine that a senior delegation would be travelling to Moscow and asked Kyiv to suspend strikes until they had left, a senior Ukrainian official told CBS.\nThe trip is thought to be Ratcliffe's first trip to Russia as CIA director, although he has maintained contact with his intelligence counterparts in Moscow.\nJohn Foreman, who served as a British military attaché to Moscow between 2019 and 2022, told Radio 4's PM programme that the visit could be focused on \"escalation management\" given speculation recent drone activity in Germany could be linked to Russia.\nHe said: \"The Americans don't normally send such a high ranking official to Moscow unannounced at short notice unless something is up.\"\nForeman said the trip could also concern the release of US detainees currently being held in Russia.\nRatcliffe played a role in negotiations for the release of Russian-American citizen Ksenia Karelina's, who was jailed in Russia for over a year after being accused of providing support to Ukraine.\nThe CIA was also involved in a 2024 prisoner swap deal with Russia that saw the release of Wall Street Journal reporter Evan Gershkovich, as well as former US marine Paul Whelan and Russian-American journalist Alsu Kurmasheva.\nThe US has had strained relations with Russia since it launched a full-scale invasion of Ukraine in 2022. Since then, Russia has been isolated on the world stage and faced international economic sanctions.\nRatcliffe appears to be one of the highest-ranking US officials to visit the country during President Donald Trump's second term.\nTrump met Russian President Vladimir Putin at a summit in Alaska last year but the meeting did not lead to a breakthrough. Subsequent US-led peace talks between Russia and Ukraine appear to have stalled.\nAdditional reporting by Washington correspondent Daniel Bush and BBC Verify", "translation_ja": "", "vocab": [{"word": "escalation management", "definition": "紛争や危機が拡大することを防ぐための戦略的対応。外交交渉で対立の激化を制御する目的で使用される。"}, {"word": "unannounced", "definition": "事前に告知されない、予告なしの。突然かつ秘密裏に行われることを意味する。"}, {"word": "detainee", "definition": "拘束者、被拘禁者。政治的理由や犯罪の容疑で拘留されている人物を指す。"}, {"word": "strained relations", "definition": "緊張した関係。国家間の信頼が失われ、敵対的になった状態を表す。"}, {"word": "breakthrough", "definition": "重大な進展、飛躍的な進歩。交渉などで重要な合意に至ることを意味する。"}, {"word": "counterparts", "definition": "対応する人、相当する立場の人。他国の同等の職位にある官職者を指す。"}]}, {"title_ja": "息子がA66衝突事故で死亡する前に父親の家が衝突される", "title_en": "Father's House Rammed Before Son Died in A66 Crash", "summary_ja": "コール・ウォーシー（17歳）は、反対方向を走行していたフォルクスワーゲン・パサートがクリーブランド警察の武装対応車両と衝突した際に死亡した5人の若者の1人です。この事故は、ミドルズブラの危険な運転事件の夜にボルボXC60がウォーシーの父親の家に衝突した後に起こりました。", "summary_en": "Cole Worthy, 17, was among five young men killed when a Volkswagen Passat traveling the wrong direction collided with a Cleveland Police armed response vehicle, also killing two officers. The crash followed a Volvo XC60 ramming Worthy's father's home during a night of dangerous driving incidents across Middlesbrough.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cevwjww8p08o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Father's house rammed before son died in A66 crash\n- Published\nA house rammed by a car before the fatal A66 crash in Middlesbrough belonged to the father of a teenager who died in the incident.\nCole Worthy, 17, was one of five young men who died when a Volkswagen Passat travelling in the wrong direction hit a Cleveland Police armed response vehicle, also killing two police officers.\nBefore the crash at 03:39 BST on Saturday, police had received multiple reports of two cars driving dangerously around the town and a Volvo XC60 was seen ramming properties.\nThe BBC understands that, after his father's home was rammed, Worthy and the four others set out in the Passat. Police said they were linking the activities of the Volvo XC60 and the Passat.\nThere is no suggestion Worthy's father was involved in criminal activity.\nPC Tom Clough, 38, and PC Matthew Blades, 37, died in the crash, as did Michael Robert Cahill, 23, Jacob Matusiak, 23, Makai Saddington, 18, Theo Rae, 17, and Worthy.\nThe Independent Office for Police Conduct said officers had been pursuing the Passat for almost seven minutes after it was connected to earlier alleged criminal activity, but the pursuit was abandoned 10 seconds before the crash when it turned on to the dual carriageway.\nBoth vehicles were operating with cloned number plates but were picked up by automated number plate recognition technology.\nThe rammed house is a red bricked semi-detached that sits in a quiet residential street in Acklam.\nThe downstairs bay window has been smashed, with bricks scattered beneath it, and an upstairs bedroom window has also been broken.\nNeighbours, who did not want to be identified, said Worthy sometimes stayed at his father's property.\nLocals described hearing loud bangs at around two in the morning on Saturday and said the street had been full of police all weekend.\nMeanwhile, nine men and three women, aged between 18 and 61, were arrested across Teesside on Monday as part of the investigation into the lead-up to the crash. They were held on a range of offences, including possession of a firearm and being part of an organised crime group.\nTwo men have since been charged.\nKai Beattie, of Foxrush Court, Redcar, has been charged with possession of a firearm with intent to endanger life.\nCameron George, of Micklow Close, Redcar, has been charged with possession of class A and class B drugs with intent to supply, and possession of criminal property.\nCleveland Police said on Tuesday that five further arrests had been made, including a 16-year-old boy and two men, 18 and 21, who were held on suspicion of participating in an organised crime group.\nA 55-year-old man was also arrested on suspicion of assisting an offender and a 23-year-old man on suspicion of making threats to kill.\nAll five remain in custody.\nThose previously arrested as part of the investigation are:\n- Three men, aged 24, 19 and 35, all held on suspicion of participating in an organised crime group and possession of an offensive weapon. They are in police custody.\n- A man, 21, held on suspicion of participating in an organised crime group, possession of an offensive weapon and criminal damage. He has been remanded on recall to prison\n- A 30-year-old woman arrested on suspicion of assisting an offender and who is in police custody\n- A 20-year-old man arrested on suspicion of threats to cause criminal damage and public order. He remains in custody\n- A 26-year-old man was charged with possession with intent to supply class A drugs, as well as the possession of criminal property. He was remanded in custody ahead of his next court hearing\n- Another man, 39, and a 47-year-old woman have been released on conditional bail after both being arrested on suspicion of possessing a firearm without a certificate, possession with intent to supply class A and class B drugs, and possession of class C drugs\n- An 18-year-old man has been released on unconditional bail after being arrested on suspicion of possessing a firearm without a certificate, possession with intent to supply class A and class B drugs, and possession of class C drugs\n- A 61-year-old woman has been released on conditional bail after being arrested on suspicion of possessing a firearm without a certificate\n- A 39-year-old man has been arrested on suspicion of threats to kill and has been released on conditional bail\nFollow BBC Tees on X,, external Facebook, external, Nextdoor and Instagram, external and listen to Radio Tees on BBC Sounds.\nRelated topics\n  - Published9 hours ago\n  - Published7 hours ago\n  - Published12 hours ago\n  - Published1 day ago\n  - Published1 day ago\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "rammed", "definition": "意図的に力を込めて衝突させること。犯罪行為や暴力的な行動の文脈でよく使用されます。"}, {"word": "armed response vehicle", "definition": "武装した警察官を乗せた対応車両。緊急事態や重大犯罪に対応するための特別な警察部隊の車両です。"}, {"word": "cloned number plates", "definition": "実在する車のナンバープレートを違法にコピーしたもの。追跡を回避するために犯罪者が使用します。"}, {"word": "organised crime group", "definition": "組織的に犯罪活動を行う複数の人物による集団。複数の犯罪を計画・実行する組織のことを指します。"}, {"word": "possession with intent to supply", "definition": "自分で使用するのではなく他人に販売する目的で違法物質を所持すること。麻薬関連の重大な犯罪です。"}, {"word": "remanded in custody", "definition": "裁判が行われるまでの間、拘束下に置かれること。被告人が保釈されず牢獄に留まる状態です。"}]}, {"title_ja": "イギリス全域で黄色警報発令、雷雨と洪水の予報", "title_en": "Yellow weather warnings issued as thunderstorms and flooding forecast across UK", "summary_ja": "気象庁は水曜日から木曜日にかけて、ロンドンを含むイギリス中部・南部地域で大雨、雷雨、洪水の危険性があるとして黄色警報を発令しました。一部地域では2～3時間で40～50mmの降雨が予想され、乾燥して硬い地面では雨水を吸収できず、洪水につながる可能性があります。落雷、大粒の雹、突風も予想されています。", "summary_en": "The Met Office has issued yellow weather warnings for Wednesday and Thursday as heavy rain, thunderstorms, and flash flooding are forecast across parts of the UK including London, the Midlands, and northern England. Some areas could receive 40-50mm of rain in just two to three hours, with the ground too dry to absorb such intense downpours. Lightning, large hail, and gusty winds are also expected during this widespread outbreak of severe weather.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/weather/articles/c770lyg4318o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Yellow weather warnings issued as thunderstorms and flooding forecast\n- Published\nYellow weather warnings have been issued by the Met Office as heavy rain and thunderstorms are forecast to break out over parts of the UK later this week.\nThe warnings span Wednesday and Thursday and include parts of east Wales, the Midlands, northern England, East Anglia and southern England - including London.\nIt is likely to be the one of the most widespread outbreaks of heavy rain across southern and central parts of the UK this summer.\nWhile good news for regions plagued by drought, significant accumulations could lead to flash flooding where the ground is too dry and hard to absorb the downpours. Lightning, large hail and gusty winds are also possible.\nThunderstorms to fire up on Wednesday morning\nThe storms, which will drift out of France and move northwards, will be sparked as warm and humid air sets in from the south.\nInitially, a few showers are likely to reach Cornwall and the West Country during Tuesday evening, but heavier downpours bringing thunder and lightning are likely to hit later in the night.\nThe first band of heavy showers may reach the southeast coast of England around midnight, and then cross Greater London before moving northwards into the home counties and East Anglia.\nThe first yellow weather warning is set to come into force at 03:00 BST on Wednesday and last until 22:00 BST.\nThough not all locations in the warning area will experience thunderstorms, flooding is possible in those that do, with 20-30mm of rain possible in less than an hour.\nThe hardest hit locations could see up to 40-50mm in two to three hours.\nFlash flooding is possible in areas where the ground is dry and very hard, making it difficult for rainfall to be absorbed. The most intense downpours could also bring large hail with gusty winds.\nDuring the morning on Wednesday, the storms may spread further north into the Midlands and the Peak District but the forecast becomes less certain in terms of location and intensity.\nThunderstorm and flood threat continues on Thursday\nThe storms and downpours which will have brought flash flooding and hail are forecast to continue into Thursday.\nA second weather warning for thunderstorms will come into force at 06:00 BST and last until 22:00 BST.\nSome may become slow moving across the Midlands, Wales and Northern England leading to more flash flooding.\nMany areas could see 20-30mm of rain in just three hours, with up to 50mm possible in some places.\nAccording to the Met Office, there is also a small chance of considerably higher totals, particularly over east-facing higher ground, where more than 75mm could fall within 12 hours.\nLightning may be frequent and hail of around 1-2cm could fall.\nWhy are rain and thunderstorms difficult to forecast?\nThunderstorms are notoriously difficult to predict because they can develop very quickly and on a relatively small scale.\nTiny differences in temperature, humidity, wind and atmospheric instability can determine whether a storm forms at all or where it moves.\nForecast models can often identify the risk of thunderstorms across a wider area, but pinpointing precisely where and when an individual storm will strike is very hard.\nEven a few kilometres can make the difference between a torrential downpour with thunder and lightning, and somewhere staying completely dry.\n  - Published5 hours ago\n  - Published14 hours ago", "translation_ja": "", "vocab": [{"word": "accumulations", "definition": "降水量の蓄積、または集積という意味。気象学では、降った雨や雪の総量を指します。"}, {"word": "downpours", "definition": "激しい降雨、土砂降り。短時間に大量の雨が降ることを表現する気象用語です。"}, {"word": "forecast", "definition": "天気予報、または予測という意味。気象や将来の出来事を予測することを指します。"}, {"word": "instability", "definition": "大気の不安定性。気象学では大気が変動しやすい状態を示し、thunderstorm形成の条件となります。"}, {"word": "pinpointing", "definition": "正確に特定する、または正確な位置を示すこと。「exactly identify」と同義です。"}, {"word": "widespread", "definition": "広範囲にわたる、広く分布している。この記事では大規模な範囲での悪天候を表しています。"}]}, {"title_ja": "警察追跡後のクラッシュで男性が死亡、ストラットフォード・アポン・エイボン近郊", "title_en": "Man Dies in Crash Following Police Pursuit Near Stratford-upon-Avon", "summary_ja": "月曜日にストラットフォード・アポン・エイボン近郊で、警察の停止命令に応じなかった19歳の運転手が黒いアウディを白いフォード・ピューマに衝突させて死亡した。フォードの女性2人が重傷を負い、運転手は重体状態にある。独立警察監察局がこの事件について調査を開始している。", "summary_en": "A 19-year-old driver died when his black Audi crashed into a white Ford Puma after failing to stop for police near Stratford-upon-Avon on Monday. Two women in the Ford were seriously injured, with the driver in critical condition. The Independent Office for Police Conduct has launched an investigation into the incident.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cly7ne4xegmo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Man dies in crash after police pursuit\n- Published\nA man has died and two women have been injured in a crash after a police pursuit near Stratford-upon-Avon.\nOfficers tried to stop a black Audi on Birmingham Road shortly before 17:30 BST on Monday but the driver failed to pull over, Warwickshire Police said.\nA pursuit began and 15 minutes later the Audi crashed into a white Ford Puma, the force added, with the Audi's 19-year-old male driver confirmed dead at the scene by paramedics.\nThe driver of the Ford, a woman, was seriously injured and remains in hospital in critical condition, while injuries to a second woman - her passenger - were serious but not believed to be life-threatening. An investigation by the police watchdog is under way.\nOfficers said after failing to stop, the Audi made off in the direction of the A46 before travelling back towards Stratford on the A439 Warwick Road where the crash occurred.\nA number of other cars were damaged during the pursuit, police said.\nWarwick Road was closed on Monday from the Marraway roundabout to its junction with Ingon Lane and Sand Barn Lane, with the stretch remaining shut on Tuesday morning.\nIt later reopened.\nA spokesperson for West Midlands Ambulance Service said paramedics found four patients in total at the scene.\nThey included a man who was in a critical condition to whom crews gave advanced life support.\n\"Despite their best efforts, it became clear that nothing more could be done to save him and he was confirmed deceased by ambulance staff at the scene,\" the spokesperson said.\nA woman who was driving the second car suffered life-threatening injuries, the ambulance service confirmed, and was taken to hospital in a critical condition. She was said by the Independent Office for Police Conduct (IOPC) to be in her 70s.\nA female passenger in the vehicle was also seriously hurt and taken to hospital, although her condition was not thought by the ambulance service to be life-threatening.\nInjuries to another patient from the car were not believed to be serious.\nSupt Steve Flavell said: \"Our thoughts are with the families of everyone involved in this collision... at this extremely difficult time.\n\"We made a mandatory referral to the IOPC because a death had occurred following police contact.\n\"They have declared an independent investigation and we will co-operate fully with their investigation.\"\nThe IOPC said the investigation was at an early stage and confirmed its officials attended the police's post-incident operation to gather information.\n\"We understand the driver of a black Audi A3 failed to stop for police and was then pursued for around six minutes before the vehicle was involved in a collision with a car being driven by a member of the public,\" a spokesperson said.\n\"We are also appealing for any car footage of the pursuit that other motorists may have recorded. Our investigators can be contacted at 0300 303 5609 or by email: WarwickRoadPursuit@policeconduct.gov.uk\n\"We have met with the families of the driver and the seriously injured woman to explain our role and will keep them regularly updated throughout our investigation, which is at an early stage.\"\nManuela Perteghella, Liberal Democrat MP for Stratford-on-Avon, said the incdent was \"incredibly tragic\".\n\"My thoughts are with the families of all those impacted. We must now let the investigation take its course.\"\nWorks were carried out on Warwick Road two years ago, aimed at reducing the number of crashes in the area.\nWarwickshire County Council added a one-way system, lowered the speed limit and implemented a protected turning lane at the Ingon Lane junction.\nStreet lighting was also boosted to improve visibility for crossing pedestrians at Fisherman's Car Park.\nGet in touch\nTell us which stories we should cover in Coventry & Warwickshire\nFollow BBC Coventry & Warwickshire on BBC Sounds, Facebook, external, X, external and Instagram, external.\n  - Published9 July 2024", "translation_ja": "", "vocab": [{"word": "mandatory referral", "definition": "法律または規則で義務付けられた報告や上級機関への送付。この場合、警察が死亡事故に関連する事件を独立監察機関に報告する法的義務を指す。"}, {"word": "pursuit", "definition": "逃げる者を追いかける行為。ここでは警察が停止に応じない車を追跡することを意味する。"}, {"word": "critically injured", "definition": "生命の危機的な状態にある重傷。医学的には生死を分ける重大な怪我の状態を表現する用語。"}, {"word": "collision", "definition": "2つ以上の物体が衝突する事故。交通事故の文脈では、車同士の衝突を指す。"}, {"word": "independent investigation", "definition": "利害関係のない第三者機関による調査。警察の行為に関わる問題について、公平性を確保するため外部機関が実施する調査。"}, {"word": "incident", "definition": "通常は好ましくない事象や出来事。ニュースでは事故や問題の発生を示す比較的中立的な用語として使用される。"}]}, {"title_ja": "アイコン、ドリー・パートンを悼んで：8つの事実", "title_en": "Remembering Dolly Parton: 8 facts about the icon", "summary_ja": "カントリーミュージックの伝説ドリー・パートンが2026年8月25日に亡くなり、1億枚以上のレコード売上と数え切れない慈善活動の遺産を残しました。この記事では、彼女の人生の8つの重要な事実、テネシー州の質素な出身から膨大なウィッグコレクション、そして『ドリーウッド財団』を通じた慈善活動について紹介しています。パートンの音楽と社会への影響は7十年間に及び、ヒット曲『ダム・ブロンド』からアイコン的な『ジョリーン』と『アイ・ウイル・オールウェイズ・ラヴ・ユー』まで、多くの名曲を生み出しました。", "summary_en": "Country music legend Dolly Parton passed away on August 25, 2026, leaving behind a legacy of over 100 million records sold and countless charitable contributions. The article highlights eight key facts about her remarkable life, including her humble Tennessee origins, her extensive wig collection, and her philanthropic work through The Dollywood Foundation. Parton's impact on music and society spans seven decades, from her breakthrough hit 'Dumb Blonde' to her iconic songs 'Jolene' and 'I Will Always Love You.'", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/remembering-dolly-parton-8-facts-about-the-icon/a-75503168?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Remembering Dolly Parton: 8 facts about the icon\nAugust 25, 2026\nMore than 100 million records sold, 25 No. 1 hits on the US country charts, 11 Grammys and three Emmys — country star Dolly Parton was one of the most successful singers in the world. On Tuesday, her nephew Bryan Seaver announced in a video shared on Parton's social media channgels that his aunt had passed away.\n\"Dolly... opened doors for generations of singers, songwriters, musicians and dreamers from every walk of life and across every continent,\" Seaver said in the video. \"She never saw a door she couldn't open, and the doors she opened made and changed history.\"\nHere are eight facts from eight decades of Dolly Parton.\n1. Cornmeal for the doctor\nDolly Parton came from humble beginnings, growing up with 11 siblings in Sevier County, Tennessee.\nBorn on January 19, 1946, her parents paid the doctor who assisted at her birth with a sack of cornmeal — though some sources claim it was oats.\nParton was born into a musical family and learned to play the guitar when she was 7. She gave her first performance on television at age of 10.\n2. No 'Dumb Blonde'\nMultiple sources have reported Parton's IQ to be at least 140. Her first song, which entered the US country charts on January 21, 1967, was \"Dumb Blonde.\" In it, she sings \"this dumb blonde ain't nobody's fool.\" It was a bold start for her entry into 1960s show business, at the time dominated by men.\n\"I'm not offended by all the dumb blonde jokes because I know I'm not dumb… and I also know that I'm not blonde,\" she said of the stereotype.\n3. Impressive parade of wigs\nAcross her seven-decade career, Parton loved following fashion trends — especially when it comes to hairstyles.\nHer trademark platinum blonde hair, though — as mentioned above — was never truly her own. Rather than spoil her hair with bleaching, she began wearing wigs from early on. It's said her collection numbered over 350 different wigs.\nParton never made a secret of her cosmetic surgeries. Over time, she used it to change her face and figure — but she always remained the friendly superstar with a big heart.\nIn 2025, Forbes magazine valued Parton's fortune at around $450 million (€387 million). She shared her wealth with people in need for decades — in particular in her home state of Tennessee, but also around the globe.\n4. Promoting reading for kids\nSince 1995, Parton's The Dollywood Foundation has been sponsoring books for children as part of her Imagination Library program. From the day a child is born, parents can apply to receive a book every month up until the age of 5. More than 300 million books have already been distributed in five English-speaking countries: the US, Canada, Australia, UK and Ireland.\nThe program is funded by the foundation itself, government support and private donors. Recently, however, some Republican-governed states in the US have announced plans to scrap financial support for the Imagination Library. Parton, who didn't have children of her own, founded the library program in honor of her father Robert Lee Parton — who was unable to read.\nEach year, the foundation also awards five university scholarships to high school graduates from Sevier County. The Dolly Parton Scholarships of $15,000 are aimed at \"students who have a dream they wish to pursue and who can successfully communicate their plan and commitment to realize their dreams,\" as stated on the foundation's website.\n5. A million dollars during COVID\nIn 2020, Parton donated $1 million to the Vanderbilt University Medical Center in Nashville, Tennessee, where the biotechnology company Moderna was working on a COVID-19 vaccine.\nOn the BBC's \"The One Show\" in November 2020, she said of her donation: \"I'm a very proud girl today to know I had anything at all to do with something that's going to help us through this crazy pandemic.\"\nA few months later, she received the vaccine on camera and rewrote her hit-song \"Jolene\" to \"Vaccine\" for the occasion.\n6. Hundreds of 'Jolene' covers\n\"Jolene\" is one of the most frequently covered songs in pop music history. The web portal cover.info notes over 80 official cover versions — from famous artists to indie musicians. Countless other versions can be heard on YouTube and other platforms.\nOne of the most popular covers was the raw and gritty 2004 interpretation by US duo The White Stripes. Parton herself has recorded several versions of her famous hit — accompanied by a cappella group Pentatonix, for instance, or alongside her famous godchild, pop star Miley Cyrus. In 2016, all of them got together to perform it live together on The Voice.\n7. Two world hits in one day\nParton wrote both \"Jolene\" and \"I Will Always Love You\" on the same day in 1972. When Whitney Houston covered the latter two decades later, it became an instant global hit.\nYou might be surprised to know that \"I Will Always Love You\" was never meant to be a romantic song. In fact, it was about Parton ending her professional collaboration with her men", "translation_ja": "", "vocab": [{"word": "humble beginnings", "definition": "貧しい、または平凡な出身環境や条件を指します。特に成功した人物がどのような背景から成功に至ったかを表現する際に使用されます。"}, {"word": "trademark", "definition": "ある人物や企業を象徴する特有の特徴や商標を意味します。個人的な特徴が広く認識されるようになった場合に使われます。"}, {"word": "philanthropic", "definition": "人道的で、慈善活動に関する活動や行為を指します。困っている人々を助けるための寄付や社会活動を説明する際に用いられます。"}, {"word": "frequently covered", "definition": "多くのアーティストによって繰り返し演奏または再現されることを意味します。音楽業界では、他のアーティストによって演奏される曲のことを指します。"}, {"word": "instant global hit", "definition": "世界中で急速に人気となった曲やコンテンツを指します。発表直後に国際的な成功を収めた作品を表現します。"}]}, {"title_ja": "米国カントリーミュージックの伝説ドリー・パートン、80歳で逝去", "title_en": "US Country Music Legend Dolly Parton Dies at 80", "summary_ja": "アメリカの伝説的なカントリーミュージックシンガー、ドリー・パートンが80歳で亡くなりました。彼女の甥のブライアン・シーバーがInstagramで彼女の死を発表し、彼女の数十年にわたるキャリアと多くのヒット曲やグラミー賞を記念しました。トランプ大統領を含む多くの指導者が、音楽と文化に対する彼女の永遠の影響に敬意を表しました。", "summary_en": "Dolly Parton, the iconic American country music singer, has passed away at age 80. Her nephew Brian Seaver announced her death on Instagram, noting her decades-long career that produced numerous hit songs and Grammy Awards. President Trump and other leaders paid tribute to her lasting influence on music and culture.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-country-music-legend-dolly-parton-dies-aged-80/a-78501931?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "US country music legend Dolly Parton dies aged 80\nAugust 25, 2026\nUS country music singer Dolly Parton has died at the age of 80.\nHer nephew Brian Seaver announced the news in a video posted to Parton's Instagram page.\nThe 80-year-old singer spent almost all of her life making music and is known all over the world for a series of major hits like \"Jolene,\" \"9 to 5\" and \"I Will Always Love You.\" Her decades-long career earned her 10 Grammys and 13 Academy of Country Music (ACM) awards.\nEarlier in the year, Parton canceled a series of shows in Las Vegas citing ongoing treatment for health problems. Late last year, she had rebuffed rumors about her health with typical good humor, declaring in a short video, \"I ain't dead yet!\"\nWhat did Parton's nephew say announcing her passing?\nParton's nephew and longstanding head of security Seaver said it was an \"honor that is mixed with absolute pride and great sadness,\" to issue this announcement on her behalf, saying she had asked him to do so long ago.\nHe hailed her influence both on his life and his family's but also on the wider world's.\n\"By her example, we believed anything was possible,\" he said of Parton. \"She never saw a door she couldn't open, and the doors she opened made and changed history.\"\n\"My family and I have shared a lifetime of beautiful memories with Dolly Parton, but so have you,\" he said. \"She has always been on your television, your record player, your CD and on your phone playlist, becoming an extended part of your family whether you liked it or not.\"\nTrump pays tribute, says flags will fly at half-staff for a week\nUS President Donald Trump said he had called for flags around the country to be \"lowered\" for one week starting on Tuesday night in memory of Parton.\n\"Rest in Peace, Dolly!\" Trump wrote on social media, describing her as \"one of the greatest Country singers, and far beyond, EVER.\"\n\"This is a true loss for millions of people. There has never been anyone like her, and never will,\" he wrote of a fellow famous member of the class of 1946.\nThe Academy of Country Music hailed Parton's \"unmistakable voice, unforgettable songs, generosity and larger-than-life spirit.\"\n\"Her music will live on, carrying her voice and her story forward for generations to come,\" it said.\nDemocratic Senate minority leader Chuck Schumer wrote simply: \"Rest in peace, Dolly Parton -- a true legend and force for good. May her memory be a blessing.\"\nWho was Dolly Parton?\nDolly Rebecca Parton was born on January 19, 1946 in Sevierville into what she called a \"dirt poor\" Tennessee family in the US south.\nShe was the fourth of 12 children, growing up in the family's small shack in the Great Smoky Mountains.\nFrom singing her first songs to chickens, Parton graduated to performing in a church, where her grandfather was a preacher.\nHer debut album, appropriately titled \"Hello, I'm Dolly,\" was released in 1967 with Parton having barely entered her 20s.\nShe was prolific in her output. By 1974, Parton was already releasing her 13th studio album. Entitled \"Jolene,\" it included what would become two of Parton's most famous songs, the eponymous first track and the opening track of side two, \"I Will Always Love You.\"\nShe released a staggering 49 solo studio albums in a career spanning well over half a century, concluding in 2023 with \"Rockstar.\"\nParton was known not only for her voice, stage presence, provocative costumes and ample bust, but also as a rapier wit and a stellar storyteller on stage when she had the mic in her hand between her songs.\nSometimes this would also spill over into her creative process. On a visit to the 2014 Glastonbury music festival in the UK, performing in front of an estimated 180,000 sodden fans braving horrendous weather, she said she had composed a special rap just for them earlier that morning, called \"Mud.\"\nCatchier lines included rhymes like \"Up to our bums in all this crud,\" while the crowd soon caught on to the chorus by the second go around — chanting \"mud, mud, mud!\" on her behalf.\nYou can read more about the iconic country music legend here: Remembering Dolly Parton: 8 facts about the icon\nEdited by: Rana Taha\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "prolific", "definition": "大量の作品を次々と生み出す能力を持つことを意味します。ここではパートンが短期間に多くのアルバムを発表したことを表しています。"}, {"word": "rapier wit", "definition": "鋭く素早い機知や会話のセンスのことです。槍のように鋭い知性を持つ人物の特徴を表す表現です。"}, {"word": "rebuffed", "definition": "提案や批判などを厳しく拒否することを意味します。パートンが健康に関する噂を否定したことを表しています。"}, {"word": "unforgettable", "definition": "忘れられないほど印象的であることを意味します。長く心に残る記憶や経験を表現します。"}, {"word": "spanning", "definition": "ある期間全体にわたって続くことを意味します。パートンの長いキャリアの期間を表しています。"}, {"word": "iconic", "definition": "その分野を代表する著名な人物や作品を表します。文化的に重要で広く認識されているものを意味します。"}]}, {"title_ja": "ウクライナの黒海港攻撃がロシアの穀物と石油輸出を混乱させる", "title_en": "Ukrainian attacks on Black Sea ports disrupt Russian grain and oil exports", "summary_ja": "ウクライナの無人機によるロシアの黒海港への激化した攻撃、特にノボロシースクへの攻撃は、穀物と石油輸出に深刻な混乱をもたらしている。ロシアのほとんどの穀物ターミナルが操業を停止し、アゾフ海・黒海盆地を経由するほぼすべての輸出がブロックされ、多くのロシア生産者の生き残りが脅かされている。この混乱は、ロシアが世界最大の小麦輸出国であるため、世界の小麦市場にも影響を与えている。", "summary_en": "Intensified Ukrainian drone strikes on Russia's Black Sea ports, particularly Novorossiysk, have severely disrupted grain and oil exports. Most Russian grain terminals have ceased operations, blocking nearly all exports through the Azov-Black Sea basin and threatening the survival of many Russian producers. The disruptions also impact global wheat markets, as Russia is the world's largest wheat exporter.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/grain-exports-stall-as-ukraine-steps-up-attacks-on-russia-s-black-sea-ports/a-78499629?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Grain exports stall as Ukraine steps up attacks on Russia\nAugust 25, 2026\nWhen Russian President Vladimir Putin spoke in 2014 about Russia's motives for annexing the Ukrainian peninsula of Crimea, and thus violating international law, he justified it by saying: \"We could not allow NATO forces to eventually come to the land of Crimea and Sevastopol, the land of Russian military glory, and cardinally change the balance of forces in the Black Sea area.\"\nWhat now? Intensified Ukrainian attacks on Novorossiysk, Russia's largest commercial Black Sea port, have caused significant disruptions to oil and grain shipments in recent weeks. The Russian navy no longer dominates the region. And exporting goods via the Black Sea is becoming increasingly difficult for Russia because of Ukraine's drone strikes. It is only possible to reorganize logistics partially.\nIf the attacks continue at such intensity, the consequences for Russian exporters and the national budget could be significant, experts told DW.\nNovorossiysk major Russian hub for exports\nNovorossiysk has been a major hub for Russian exports since the 19th century and even today it remains Russia's largest port in terms of cargo volume, as well as one of the largest in Europe. Up to a third of Russia's grain exports are handled through the hub, which is located close to the country's major agricultural regions. Crude oil, metals and containerized goods also pass through the port.\nRecent Ukrainian maritime and aerial drone attacks have severely disrupted shipments, particularly of grain. Andrei Sisov, the head of SovEcon, a research and consulting firm specialized in agriculture, uses Telegram to follow the developments. On August 12, he posted that the Novorossiysk Bread Products Plant (NKHP ) — one of Russia's largest grain export terminals — and the Novorossiysk grain terminal had ceased operations. A day later, KSK, one of Russia's largest deep-water grain terminals, also halted its operations. Operations at a major grain terminal in Taman had already come to a standstill at the end of July. Prior to that, Ukraine paralyzed operations at the shallow-water ports of the Sea of Azov.\nAt the time of publication, only Tuapse, the smallest of Russia's deep-water grain terminals, was still in operation. \"This means that virtually all Russian grain exports via the Azov-Black Sea basin are blocked,\" Sisov said.\nOil exports also affected\nThe situation regarding oil exports is not quite as dramatic but while they have not come to a complete standstill, they are frequently disrupted. According to the British news agency Reuters, the Sheskharis terminal — Russia's main oil export facility on the Black Sea, handling some 700,000 barrels of crude oil per day — halted loadings on August 14, which resumed only two days later.\nAccording to London-based Argus Media, a global energy and commodity price reporting agency, Russia could have 45 million metric tons of wheat — Russia's main agricultural export good — for export in 2026 to 2027. However, the situation in the Black Sea, through which about 90% of shipments are usually routed, will make it almost impossible to supply the global market.\nSisov of SovEcon estimated that \"many Russian producers will not survive this season, especially after several years of deteriorating financial conditions.\"\nBecause exports have come to a standstill, surplus grain will have to be sold on the domestic market, which is already putting downward pressure on prices. Even if exports were to recover over time, there will still be problems. August is usually when shipments peak and it will be difficult to deliver anything no sent this month because terminals tend to operate at full capacity during the autumn anyway.\nUkrainian grain exports also decrease\nThe escalation of hostilities in the Azov and Black Sea regions will also be felt on the global market since Russia is the world's largest wheat exporter.\nUkrainian grain exports have also fallen sharply since there are attacks on both sides. In the past month, Russia too has stepped up its attacks on Ukrainian ports and ships that are docked there.\n\"The disruptions have blocked out good wheat harvests in Ukraine and Russia from accessing global market,\" Xiaoyi Deng from Argus Media told DW. \"Both have struggled to work with alternative infrastructure, such as Baltic ports (via rail) or Danube River ports but the alternatives would not be up for full replacement.\"\nAccording to the Center for Research on Energy and Clean Air (CREA), a Helsinki-based think tank, the port of Novorossiysk \"loaded 30% less oil than during the same period last year\" in the first two weeks of August. The decline was preceded by a Ukrainian strike on the Caspian Pipeline Consortium (CPC) marine terminal on July 19.\nIsaac Levi, an energy analyst at CREA, pointed out that damage to infrastructure was not the only reason for shipments to fall. He said that \"strikes on vessels have discouraged ships from calling at ports conside", "translation_ja": "", "vocab": [{"word": "stall", "definition": "停止する、動かなくなる。ビジネスコンテキストでは、プロセスや活動が進まなくなることを意味する。"}, {"word": "disruption", "definition": "中断、混乱。通常の運営や流れが妨げられた状態を指す。"}, {"word": "logistics", "definition": "ロジスティクス、物流。商品や資源の輸送と配送の計画と実行。"}, {"word": "hub", "definition": "ハブ、中心地。複数の輸送ルートや通信が集中する中核施設。"}, {"word": "halt", "definition": "停止させる、中止する。活動や運用を完全に止めることを意味する。"}, {"word": "terminal", "definition": "ターミナル、終点施設。船舶が積み荷を積み下ろしする港湾施設。"}, {"word": "escalation", "definition": "エスカレーション、激化。対立や戦闘が段階的に増加すること。"}]}, {"title_ja": "カントリー音楽の伝説ドリー・パートン死去、80歳", "title_en": "Dolly Parton, Country Music Legend and Cultural Icon, Dead at 80", "summary_ja": "伝説的なカントリー音楽シンガーソングライターで慈善家のドリー・パートンが80歳で亡くなりました。彼女のキャリアは60年以上に及び、音楽史上最も影響力のある人物の一人となりました。パートンの遺産には、象徴的な楽曲、数々の賞、そして数百万人の人生に影響を与えた慈善活動が含まれています。", "summary_en": "Dolly Parton, the legendary country music singer, songwriter, and philanthropist, has passed away at age 80. Her career spanned more than six decades, during which she became one of the most influential figures in music history. Parton's legacy includes iconic songs, numerous awards, and extensive charitable work that touched millions of lives.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Culture/dolly-parton-country-music-legend-cultural-icon-dead/story?id=95381474", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースは、世界中の速報ニュースと生中継イベントを24時間体制でカバーしています。主要なニュースが展開する際にリアルタイムで最新情報と詳細なレポートを入手できます。オンデマンドでニュースフィードと生放送にアクセス可能です。", "summary_en": "ABC News provides continuous round-the-clock coverage of breaking news and live events from around the world. Stay updated with the latest developments and in-depth reporting on major stories as they unfold. Access real-time news feeds and live broadcasts on demand.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カナダが米国製品に対し最大50%の報復関税を発表", "title_en": "Canada Announces Retaliatory Tariffs Up to 50% Against US Products", "summary_ja": "カナダは火曜日、米国製品数百品目に対し最大50%の報復関税を発表しました。この措置は米国の貿易行動に対するカナダの対抗措置です。関税は米国製品の幅広い品目を対象としており、両国間の貿易紛争が激化しています。", "summary_en": "Canada announced retaliatory tariffs reaching as high as 50% on hundreds of U.S. products on Tuesday. The move represents Canada's response to U.S. trade actions. The tariffs target a wide range of American goods in an escalating trade dispute between the two nations.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Business/trump-hell-impose-new-tariffs-canada-january-escalating/story?id=135901297", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハリー王子、レンジャーの人権侵害問題でアフリカ・パークスの理事を辞任", "title_en": "Prince Harry quits African Parks board over rangers' human rights abuses", "summary_ja": "ハリー王子は、コンゴ共和国でコンゴの先住民バカ民族に対する人権侵害疑惑を受け、主要なアフリカ野生動物慈善団体アフリカ・パークスの理事を辞任しました。同慈善団体は昨年、レンジャーたちが先住民が祖先の森にアクセスするのを防ぐために暴行、水責め、性的暴力を加えたことを認めました。ハリー王子の辞任は人権団体からの圧力の後に来ましたが、彼はアフリカの保全活動への支持を続けると述べています。", "summary_en": "Prince Harry has stepped down from the board of African Parks, a major African wildlife charity, following allegations of human rights abuses by its rangers against Indigenous Baka communities in the Republic of the Congo. The charity admitted last year that its rangers committed beatings, waterboarding, and sexual violence to prevent locals from accessing their ancestral forests. Harry's departure comes after pressure from human rights organizations, though he stated he remains committed to conservation efforts in Africa.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/uk-news/2026/aug/24/prince-harry-quits-board-wildlife-charity-african-parks-human-rights-abuses", "state_media": false, "category": "社会", "full_text": "The Duke of Sussex has stepped down from the board of a major African wildlife charity that had been at the centre of a human rights controversy.\nPrince Harry’s spokesperson confirmed he was no longer a trustee of African Parks, which admitted last year that human rights abuses were committed by its rangers in the Republic of the Congo.\nThe charity’s admission followed an independent review into allegations made by members of the Baka community.\nIn a 2024 report published by the Mail on Sunday newspaper, community members accused African Parks rangers of beating, waterboarding and raping locals to stop them from accessing their ancestral forests, which are now in a conservation area.\nAfter the review, African Parks published a statement acknowledging that human rights abuses occurred in the Odzala-Kokoua national park, which it manages. It said that it had improved its safeguarding processes both at the park and institutionally.\nA spokesperson for Harry said the duke, who was president of the charity for six years before he became a member of its board of directors in 2023, remained an active and avid supporter of African Parks.\n“The duke is proud of his 10 years with African Parks and fully supports the ongoing strengthening of its board,” the spokesperson said.\n“His commitment to conservation in Africa continues, and he remains a supporter of African Parks’ mission.”\nSurvival International, a global human rights charity that campaigns for the rights of Indigenous people, had called on Harry to step down as a member of the board.\nCaroline Pearce, the executive director of Survival International, said it was “outrageous that for 10 years Prince Harry has served African Parks” while people working for it had “been responsible for abuse and violence against Indigenous people. His departure doesn’t undo that record — African Parks itself must now be held accountable, and must abandon this model of fortress conservation for good.”\nFounded 26 years ago, African Parks manages more than 20m hectares (50m acres) in partnership with 13 African governments and hundreds of local communities.\nAfrican Parks expressed “deep gratitude” to the duke on concluding his tenure after his 10-year commitment to the organisation.\n“His relationship with the organisation dates back to Malawi in July 2016, when he supported one of the largest elephant translocations in history. He served as president for six years before being appointed a member of the board of directors,” it said.\n“Over the years, the duke has brought global attention to the urgent need for biodiversity protection for the benefit of people and wildlife, and has contributed greatly to promoting philanthropy for the cause of conservation in Africa. The duke remains deeply committed to this cause, and remains a strong supporter of African Parks’ work.”\nThe announcement comes as the Duke and Duchess of Sussex are due to relocate to the UK from California with their children, Prince Archie, seven, and Princess Lilibet, five.\nFormer Suits star Meghan is said to be pursuing an acting role, with reports she has been in talks about a role in the third series of Guy Ritchie’s Netflix hit The Gentlemen, swiftly followed by other reports that the deal was off.\nThe couple are understood to be planning an “extended stay” in the UK, and their children are already enrolled in school, but it has not been confirmed for how long.", "translation_ja": "", "vocab": [{"word": "trustee", "definition": "団体や基金の資産や利益を管理・運営する責任を持つ人のこと。慈善団体などの理事として信頼できる人物を指します。"}, {"word": "waterboarding", "definition": "被疑者の顔に水をかけて溺れるような感覚を与える拷問方法。国際的に人権侵害として認識されています。"}, {"word": "fortress conservation", "definition": "地域住民を排除して自然保護区を管理する保全戦略。先住民の生活圏を奪う問題があります。"}, {"word": "biodiversity", "definition": "自然界に存在するあらゆる生物の多様性を指す概念。植物、動物、微生物など様々な生命形態の豊かさを表します。"}, {"word": "allegations", "definition": "根拠不十分な主張や告発のこと。法的に証明されていない、または調査中の違法行為の疑いを指します。"}, {"word": "tenure", "definition": "職務や地位に就いている期間のこと。特に長期間その職を占めていることを意味します。"}]}, {"title_ja": "ナイジェリアのモスク襲撃後、数百人が人質として拘束されていることを示すビデオ", "title_en": "Video Shows Hundreds Held Captive After Nigeria Mosque Kidnapping", "summary_ja": "武装勢力がナイジェリア北中部ニジェール州のモスク襲撃で誘拐された約600人の女性、子ども、高齢者を映したビデオを公開した。金曜礼拝中にデカラ村で発生したこの誘拐事件で、地元住民がビデオに映った人質の身元を確認している。北部ナイジェリアでは身代金目的の大量誘拐が急増し、武装勢力の活動は南部にも拡大している。", "summary_en": "An armed group released a video showing approximately 600 women, children, and elderly people abducted during an attack on a mosque in Niger State, Nigeria. The kidnapping occurred during Friday prayers in Dekara village, with residents confirming identities of some captives in the footage. Mass abductions for ransom have become increasingly common in northern Nigeria, with gangs expanding their operations southward.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/24/video-shows-hundreds-held-captive-after-nigeria-mosque-kidnapping", "state_media": false, "category": "社会", "full_text": "An armed group has posted a video showing what residents said were about 600 women, children and older people abducted in an attack on a mosque in Nigeria’s north-central Niger State last week.\nThe video, posted on Facebook and WhatsApp, showed large groups of people seated in a forested area surrounded by armed men. Several children could be heard crying in the background.\nMass kidnappings for ransom have become common in parts of north-western and north-central Nigeria, where heavily armed gangs frequently raid villages, schools and highways and hold them until paid large sums of money. The violence was previously focused in the north of the country, but gunmen have increasingly moved south.\nThe video surfaced two days after the latest kidnapping, when gunmen attacked worshippers at the mosque in Dekara village during Friday prayers, taking people away in what residents said were simultaneous raids on several communities.\nIn the video, a gunman speaking in Hausa addressed families of the captives and urged them to identify relatives among the people in the footage.\n“These are all your people. We are showing you this video so that you can identify your family members, your fathers, mothers, children and relatives,” the gunman said.\nReuters could not verify the exact date or the location where the video was filmed. However, no older version of the video was found posted online before Sunday.\nFour residents said they were able to confirm the identities of some of those seized.\n“The people in the video are from Dekara. I’ve identified 13 people that I know,” Ibrahim Abubakar said.\nAnother resident, Abdulmutallib Muqaddas Dindi, said those who appeared in the video had been seized during the prayers. “We have identified our elders, relatives, and some of us have seen their wives and children in the video,” he said.\nPolice and state authorities did not respond to requests for comment on Monday. Police had earlier confirmed an attack on worshippers in the area but said they could not verify the number of people abducted.\nJamilu Ibrahim, another resident, appealed to the federal and state authorities to secure the release of the captives, pointing out the number of mothers with infants and children among those shown in the footage.", "translation_ja": "", "vocab": [{"word": "abducted", "definition": "強制的に連れ去られた、誘拐された。不法に人を連れ去る行為を示す。"}, {"word": "ransoms", "definition": "身代金、人質解放のために要求される金銭。誘拐事件などで使用される。"}, {"word": "verify", "definition": "確認する、検証する。情報や事実が正確であることを確かめる。"}, {"word": "simultaneously", "definition": "同時に、一斉に。複数の出来事が同じ時間に起こることを表す。"}, {"word": "captives", "definition": "捕虜、人質。拘束されている人々を指す。"}, {"word": "authorities", "definition": "当局、行政機関。政府や警察などの公式な機関を表す。"}]}, {"title_ja": "ギニアビサウでのエムポックス流行で疑い患者の半数が子ども", "title_en": "Children make up half of suspected mpox cases in Guinea-Bissau as epidemic spreads", "summary_ja": "ギニアビサウは53件の疑い患者および確定患者のうち半数以上が子どもであるエムポックス流行を宣言しました。4歳未満の子どもが16人含まれています。地域の保健当局は、脆弱な監視システムにより、ウイルスが検出されないまま広がっている可能性が高いと警告しており、9月の学校再開を控えて重大なリスクが懸念されています。この流行は、西アフリカ地域の既存のインフラの課題と公衆衛生能力の制約を悪化させています。", "summary_en": "Guinea-Bissau has declared an mpox epidemic with over half of the 53 suspected and confirmed cases occurring in children, including 16 under age four. Local health authorities warn that fragile surveillance systems mean the virus is likely spreading undetected, posing significant risks as schools prepare to reopen in September. The outbreak compounds existing infrastructure challenges and public health capacity constraints in the west African nation.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/aug/24/children-half-mpox-disease-cases-guinea-bissau-epidemic-spreads-west-africa", "state_media": false, "category": "社会", "full_text": "More than half of the mpox cases reported in Guinea-Bissau have been among children, local authorities have said, almost two months since the country announced an epidemic.\nA national outbreak was declared on 4 July, just over a week after a 27-year-old woman became the first confirmed case of mpox in the west African country. Since then, there have been seven confirmed cases and 46 suspected cases. Half of those patients have been children, with 16 under the age of four.\nIn a statement on Thursday, Unicef warned that because the country’s health surveillance systems were fragile, the virus is probably spreading undetected, leaving even more children at risk.\nSandra Martins, the country’s deputy representative for Unicef, said: “This is the first time mpox cases have been reported in Guinea-Bissau, making even a small outbreak a major public health event.”\nMpox is an infectious viral disease that can be transmitted through close contact. There have been more than 2,000 mpox-related deaths among tens of thousands of cases recorded across east, central and west Africa since January 2024.\nHealth workers say the Clade variants are consistent with viruses circulating in neighbouring countries, meaning that a risk of cross‑border transmission in the region remains strong. The vast majority of confirmed cases are in the Bissau autonomous sector, where the capital is, while one case is in the nearby Biombo area. No deaths have been reported to date.\nDr Magda Robalo, a former health minister who led the country’s Covid-19 response, said that to eliminate the “biggest gaps in the health system right now”, increased surveillance would have to be prioritised and frontline capacity reinforced.\n“Even though the numbers are small, new cases have appeared intermittently over several weeks, which means transmission is ongoing,” said Robalo, who is also co-founder of the Institute for Global Health and Development and former director of communicable diseases for the World Health Organization.\nThe outbreak comes as the country grapples with infrastructure challenges and the aftermath of the suspension of last November’s presidential election by the military, which remains in power. There was no electricity throughout Thursday in Bissau for instance because of petrol scarcity since the weekend.\nMany public health laboratories in the region lack equipment to deal with epidemics but have institutional knowledge from handling other crises.\nIn Guinea-Bissau, that is no different but there is also a sense of urgency, with primary schools scheduled to reopen across the country in September. After the outbreak was declared, community health workers immediately began a door-to-door public awareness campaign with megaphones and translated leaflets, supported by the health ministry and international agencies.\nThese grassroots initiatives are seen as vital for building public trust in the public health sector. Earlier this year, the country suspended a controversial US-funded trial on hepatitis B vaccinations for newborns, citing ethical concerns and procedural flaws. The decision was lauded by many across the continent and has highlighted sensitivities around emergency health interventions.", "translation_ja": "", "vocab": [{"word": "epidemic", "definition": "特定の地域や期間に急速に広がる感染病の大流行を指します。パンデミックより限定的なスコープを持ちます。"}, {"word": "surveillance", "definition": "疾病や社会現象を監視・追跡する活動を指します。公衆衛生では感染症の発生や広がりを監視することを意味します。"}, {"word": "fragile", "definition": "壊れやすい、傷つきやすい、またはぜい弱な状態を示します。システムや環境の脆弱性を表現する際に使用されます。"}, {"word": "transmission", "definition": "病原体やウイルスが人から人へ、または動物から人へ移る過程を指します。感染症学における重要な概念です。"}, {"word": "institutional knowledge", "definition": "組織内に蓄積された経験や技術的ノウハウを指します。個人ではなく組織全体が保有する集団的知見を意味します。"}, {"word": "grassroots", "definition": "地域社会の基層から始まる、ボトムアップ的な取り組みやキャンペーンを指します。一般市民による活動を強調します。"}]}, {"title_ja": "レアル・マドリード対レアル・ソシエダ：モウリーニョ監督ホーム初試合でマドリード連勝狙う", "title_en": "Real Madrid vs Sociedad: Mourinho's Home Debut as Los Blancos Seek Consecutive Wins", "summary_ja": "ホセ・モウリーニョ監督の復帰後初のホームゲームとなる8月26日のラ・リーガでレアル・マドリードはレアル・ソシエダと対戦する。エスパニョールとの劇的な2-1勝利の直後、マドリードはムバッペ、ベリンガム、ヴィニシウスらスター選手を率いて勢いをつけることを目指している。モウリーニョ監督はロッカールームをコントロールし、バルセロナのラ・リーガ3連覇を阻止という課題に直面している。", "summary_en": "Real Madrid faces Real Sociedad on August 26 in La Liga as Jose Mourinho makes his first home appearance since returning as manager. Fresh off a dramatic 2-1 victory at Espanyol, Madrid aims to build momentum with star players Mbappe, Bellingham, and Vinicius leading the charge. Mourinho faces the challenge of controlling the dressing room and preventing Barcelona from securing a La Liga threepeat.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/8/25/real-madrid-vs-sociedad-la-liga-prediction-teams-lineups?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Real Madrid vs Sociedad: La Liga – prediction, team news, lineups\nKylian Mbappe and Jude Bellingham headline against Sociedad as Real seek consecutive wins to open La Liga season.\nWho: Real Madrid vs Real Sociedad\nWhat: Spanish football’s La Liga\nWhere: Bernabeu Stadium in Madrid, Spain\nWhen: August 26, at 9pm (19:00 GMT)\nHow to follow: Al Jazeera Sport will bring you all the buildup from 16:00 GMT ahead of our live text commentary stream\nAs Real Madrid and Real Sociedad go head-to-head on Wednesday, it will match up one of last season’s trophy winners in Spain against a side desperate to put their hands on silverware this time around.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Premier League: Chelsea start Alonso era with thrilling 3–2 win at Fulham\n- list 2 of 4Ex-Liverpool star Fabinho reunited with Mohamed Salah at Trabzonspor\n- list 3 of 4Eto’o says embattled FIFA President Infantino ‘hasn’t done anything wrong’\n- list 4 of 4Ceferin won’t challenge Infantino for FIFA presidency but tells him to quit\nEither Los Blancos or their rivals Barcelona have appeared in all but four of the last 12 finals of the Copa Del Rey, Spain’s premier cup competition, but Sociedad claimed victory last season, beating Atletico Madrid.\nReal, meanwhile, were struggling to keep pace with Barca in La Liga and head into the new term seeking to avoid a third season without a trophy.\nNot since 2006 have Real endured such a run.\nAl Jazeera Sport takes a look at the La Liga fixture where Jose Mourinho makes his first appearance in front of a home crowd on his return as Real manager.\nHow has Real Madrid’s La Liga season begun?\nMourinho’s second spell in charge of Los Blancos began with a last-gasp 2-1 victory at Espanyol in La Liga on Saturday\nReal needed substitute Carlos Espi to pounce in the 90th minute to grab the winner after Jude Bellingham opened the scoring in Los Blancos’ opening fixture of the season, before Alex Calatrava levelled for the home side in Barcelona.\n“I think that we deserved to win but that Espanyol didn’t deserve to lose,” Mourinho told reporters.\n“They didn’t have any players at the World Cup and have been working together for a long time, and you could see that.”\nOn top of the big-name starters, Mourinho sent on two more new arrivals in the form of record signing Yan Diomande and Marc Cucurella; however, it was only Espi’s strike – from a loose ball in the box – that saved the day.\nWhat challenges does Mourinho face at Real Madrid?\nBack in charge of Madrid 13 years after leaving, Portuguese veteran Mourinho must bring the dressing room under control after the chaos of last season – and prevent Barcelona from securing a La Liga threepeat.\nMourinho started the match at Espanyol with superstars Kylian Mbappe, Vinicius Junior and Bellingham, as well as handing debuts to Bernardo Silva, Denzel Dumfries and Ibrahima Konate.\nBellingham had an excellent first season at Madrid after arriving from Borussia Dortmund, but the subsequent two were disappointing, both for him and the club, who failed to win a major trophy in either.\nMourinho installed him in attacking midfield with a licence to roam, and the England international was heavily involved before his goal, which came via a header from Arda Guler’s dangerous crossed free-kick.\nMbappe got in behind on the right of the area in the early stages only to be denied by the keeper, and the French forward, La Liga’s top scorer in both of his two seasons at the club, was far from his lethal best.\nOn the left flank, Vinicius had little impact beyond winning a series of fouls from Espanyol players who were determined to shut him down by any means.\nWhy has Mourinho said Real Madrid’s Vinicius needs protection?\nMourinho, once known for his fiery personality and frequent touchline outbursts, says he wants to help Vinicius Junior control his emotions better.\nThe Real coach thinks Vinicius is being unfairly targeted, but the star forward can do better when reacting to provocations after the Brazilian was involved in several incidents with opposing fans and players at Espanyol.\n“There is on the field and off the field,” Mourinho said. “The reaction to fans and insults, obviously, if they are not racist or homophobic insults, but the typical insults by fans, then I think he can control it better.\n“In the game, when it comes to the fouls and the accumulation of frustration that he feels, that’s the responsibility of the referees, or the judges, as I like to call them, in terms of their responsibility to protect the players and the game.”\nHow is Mourinho’s relationship with Vinicius after Benfica controversy?\nMourinho said it’s harder to help Vinicius when it comes to the in-game incidents, but when it’s about his relationship with the opposing fans, then “it’s something that we can work on”.\nLast year, Mourinho was criticised for attacking Vinicius’ character after the player accused an opponent of racially insulting him during a Champions League match against Benfica. The co", "translation_ja": "", "vocab": [{"word": "tenure", "definition": "特定の職務や地位における任期間。ここではモウリーニョがレアル・マドリードの監督を務めていた期間を指す。"}, {"word": "lethal", "definition": "非常に効果的で危険性の高いさま。スポーツ用語として、得点能力が非常に高いプレイヤーの性質を表現する。"}, {"word": "provocation", "definition": "相手を怒らせたり不適切な行動をさせようとする行為。ここではビニシウスが対戦相手からの挑発に対する反応について言及している。"}, {"word": "accumulation", "definition": "時間をかけて少しずつ集まり増えていくこと。ここではビニシウスが試合を通じて感じるフラストレーションの蓄積を表す。"}, {"word": "threepeat", "definition": "同じチームが3年連続で優勝することを指すスポーツ用語。バルセロナが3連覇することを意味する。"}, {"word": "fiery", "definition": "激しい気性や情熱的な性格を示す形容詞。モウリーニョの過去の激高しやすい性格を表現している。"}]}, {"title_ja": "ナイジェリア、600人の誘拐被害者の救出作戦を開始", "title_en": "Nigeria Launches Rescue Operation for 600 Kidnapped Victims", "summary_ja": "ナイジェリアのボラ・アハメド・ティヌブ大統領は、デケラ村のモスクから誘拐された600人の被害者の救出作戦を火曜日に発表した。銃で武装した男らが被害者の映像を撮影し、フェイスブックとWhatsAppで配信したことを受けての発表である。", "summary_en": "Nigerian President Bola Ahmed Tinubu announced a rescue operation on Tuesday for 600 victims abducted from a mosque in Dekera village. The operation follows the release of a video by gunmen showing the captives, which was distributed on social media platforms including Facebook and WhatsApp.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/25/nigeria-launches-operation-to-rescue-600-kidnapped-victims?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Nigeria launches operation to rescue 600 kidnapped victims\nNewsFeed\nNigeria launches operation to rescue 600 kidnapped victims\nNigerian President Bola Ahmed Tinubu announced a rescue operation on Tuesday for victims of the 600-person mass abduction from a mosque in Dekera village. The statement comes after gunmen recorded and distributed a video of the victims on Facebook and WhatsApp.\nPublished On 25 Aug 2026", "translation_ja": "", "vocab": [{"word": "mass abduction", "definition": "大規模な誘拐事件のこと。複数の人が一度に誘拐される事件を指す。"}, {"word": "rescue operation", "definition": "捕虜や被害者を救出するために実行される軍事的または警察的な作戦。"}, {"word": "distributed", "definition": "情報や物などを広く配布する、配信すること。ここではビデオがソーシャルメディアで拡散されたことを意味する。"}, {"word": "gunmen", "definition": "銃を持った武装した男たち。犯罪者やテロリストを指すことが多い。"}, {"word": "announced", "definition": "公式に発表する、宣言すること。政府や権威者が重要な決定や計画を公に伝える。"}]}, {"title_ja": "新たなイラン制裁は米国の焦りを示す、専門家が指摘", "title_en": "New US Sanctions on Iran Signal Trump Administration's Desperation, Experts Say", "summary_ja": "米国はイランおよび同国と取引する世界中の企業に対する新たな制裁を「経済的D-Day作戦」として発表したが、専門家はこの経済的エスカレーションがイランに屈服を強いる可能性は低いと主張している。約6か月間の軍事作戦で弾薬備蓄が枯渇し素早い勝利を達成できなかった後、トランプ政権は最後の手段として経済的圧力へ転換したと分析家は述べている。", "summary_en": "The US announced new sanctions on Iran and global entities doing business with the country as part of \"Operation Economic Outcast,\" but experts argue this economic escalation is unlikely to force Iran to capitulate. After nearly six months of military operations that have depleted munitions stocks and failed to achieve quick victory, analysts say the Trump administration has shifted to economic pressure as a last resort.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/25/new-us-sanctions-signal-trump-desperation-on-iran-experts-say?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "New US sanctions signal Trump desperation on Iran, experts say\nEconomic escalation is unlikely to force the Iranian government to capitulate to US demands, according to experts.\nThe United States announced new sanctions on Iran and a slew of global entities doing business with the country on Monday, in what officials have called an “economic D-Day” and officially dubbed “Operation Economic Outcast”, in an effort to force Tehran to negotiate an end to the war.\nThe announcement followed repeated demands by US President Donald Trump that Iranian leaders take actions like dropping their claims over the Strait of Hormuz and return to talks to end its nuclear programme.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Trump’s latest wave of Iran sanctions: Which 60 entities are targeted?\n- list 2 of 3US launches Economic war on Iran\n- list 3 of 3Sanctions or missiles? How Gulf will view Trump’s new Iran approach\nNearly six months into its war on Iran, the US is seeing little impact from its military operations against the country. Crucial military munitions stocks have been depleted, and important tools used to project power globally have been redirected towards Iran.\nThe long-term implications of the war, analysts say, have pushed the Trump administration to try economic sanctions, but these are unlikely to compel Iran into meeting the demands.\n“The United States is returning to economic pressure because military force has failed to deliver the quick victory it expected,” Negar Mortazavi, senior fellow at the US-based Center for International Policy, told Al Jazeera. “The ‘economic D-Day’ declaration underscores the war’s failure so far to force Iran’s surrender or achieve Washington’s political objectives.”\nWhat prompted the new sanctions?\n“On paper, the US and Iran are a huge military mismatch,” Ryan Costello, policy director at the National Iranian American Council (NIAC), told Al Jazeera. “The US caused a lot of destruction with its munitions, but so too did Iran with its missiles and drones. So it is hard to describe the war to date as anything but a catastrophic mistake.”\nWhile the US has killed key Iranian political and military leaders, Tehran has leveraged its geography and vast arsenal of drones and missiles, striking out at key oil and gas infrastructure in a region that has depended on drawing investors by offering stability. And Tehran’s choking of traffic through the Strait of Hormuz has brought pain for consumers as far away as the US, who now pay about 40 percent more at the petrol pump than before the war.\n“It was a fundamental miscalculation Trump did in the outset that the threat of war will compel the Iranians to surrender,” Trita Parsi, head of the Washington, DC-based Quincy Institute, told Al Jazeera. “Instead they fought back, and they fought back very hard.”\nThe US supply of missile interceptors has fallen low, according to experts like those at the Washington, DC-based Center for Strategic and International Studies. In late July, the centre found it would take at least three years for the Pentagon to bring supplies back to pre-war levels. The White House has denied any such shortage exists, but analysts say the problem is very real, even if it is temporary, and the Pentagon has been forced to redirect resources away from adversaries like China.\nThat has included US aircraft carriers. The Pentagon has pulled a key asset away from China, dispatching the USS George Washington from Japan to relieve the USS Abraham Lincoln in the Gulf, whose sailors have been at sea for months longer than planned because of the war.\nKey US bases in the region – including the Navy’s Fifth Fleet headquarters in Bahrain – have been damaged or become unsafe for use, adding hundreds of kilometres to supply lines as ships look as far away as the Indian Ocean island of Diego Garcia for sourcing.\n“In my judgement, the US Armed Forces have probably permanently lost access to 15 Persian Gulf bases,” retired US Army four-star general Barry R McCaffrey wrote on X.\n“I think it became clear the US is running out of runway on this, so the administration pivoted to what it knows best, or has perceived as effective in the past, which is these economic tools,” said Jamal Abdi, head of the NIAC. “Really, it’s a way for the administration to scale back to where it was before this war but present it as this new enhanced pressure policy.”\n‘Why would I want to blow up the global financial system?’\nInstead of hitting Iran and others doing business with it, Monday’s sanctions announcement turned out to be little
