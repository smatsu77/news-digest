more than yet another warning, analysts say. While the US Department of the Treasury did sanction 60 new individuals and entities from around the globe over their business with Iran, it did not include major Chinese banks or others that help Tehran sell its oil.\nAt least 90 percent of Iran’s crude oil exports end up in China, netting Tehran tens of billions of dollars in revenue. Ending that trade would need the US to confro", "translation_ja": "", "vocab": [{"word": "capitulate", "definition": "相手の要求に屈して降伏する、または譲歩することを意味する動詞。交渉や紛争の文脈で、一方が他方の条件を受け入れることを指す。"}, {"word": "escalation", "definition": "紛争や対立が段階的に増大・悪化していくプロセスのこと。この場合、経済的圧力が徐々に強まることを指す。"}, {"word": "munitions", "definition": "銃弾や爆弾などの軍事用の弾薬や火器を指す名詞。軍事用語として頻繁に使用される。"}, {"word": "arsenal", "definition": "武器や軍事装備を大量に保有していることを指す名詞。比喩的には、何かを実行するための多くの手段や資源を意味することもある。"}, {"word": "miscalculation", "definition": "誤った判断や計算違いを意味する名詞。意図していた結果と異なる結果をもたらす誤った予測や戦略を指す。"}, {"word": "leverage", "definition": "影響力や優位性を使用して他者に圧力をかけることを意味する動詞。政治・ビジネス用語として重要な語彙である。"}]}, {"title_ja": "IAMCと宗教団体がモハン・バグワットのマディソン・スクエア・ガーデン講演に抗議", "title_en": "IAMC and Faith Groups Protest Mohan Bhagwat's Madison Square Garden Event", "summary_ja": "インド系アメリカ人ムスリム評議会（IAMC）および関連する宗教団体は、2026年8月25日にニューヨークで記者会見を開き、RSS指導者モハン・バグワットの8月29日のマディソン・スクエア・ガーデン講演に抗議した。「ヘイトに場を与えない」のバナーの下で開催された抗議には、ムスリム、ヒンドゥー、シーク、キリスト教、ダリット、および超宗派組織の代表者が集結した。バグワットはRSSの100周年記念グローバルアウトリーチプログラムの一部として米国、カナダ、英国を訪問しており、ディアスポラコミュニティとの関わりとヒンドゥー文化伝統の推進が目的である。", "summary_en": "The Indian American Muslim Council and allied faith organizations held a press conference in New York on August 25, 2026, to protest RSS chief Mohan Bhagwat's scheduled appearance at Madison Square Garden on August 29, describing him as a proponent of Hindu supremacist ideology. The protest, held under the banner 'No Platform for Hate,' brought together representatives from Muslim, Hindu, Sikh, Christian, Dalit and interfaith organizations who urged NYC Mayor Zohran Kwame Mamdani to prevent the venue from hosting the event. Bhagwat is visiting the U.S., Canada and UK as part of the RSS's centenary-year outreach program to engage with diaspora communities and promote Hindu cultural traditions.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/national/iamc-and-allied-faith-organisations-protest-against-mohan-bhagwats-event-at-madison-square-garden/article71390230.ece", "state_media": false, "category": "社会", "full_text": "The Indian American Muslim Council (IAMC) and allied community and faith organisations held a press conference in New York on Tuesday (August 25, 2026) to protest against an upcoming event featuring Rashtriya Swayamsevak Sangh (RSS) chief Mohan Bhagwat at Madison Square Garden on August 29.\nHeld under the banner “No Platform for Hate,” the protest brought together representatives of Muslim, Hindu, Sikh, Christian, Dalit and interfaith organisations. The organisers urged New York City Mayor Zohran Kwame Mamdani not to allow Madison Square Garden to provide a platform to Mr. Bhagwat, whom they described as a proponent of Hindu supremacist ideology and ‘RSS as ‘’anti-minority’ organisation.\n“New York must not lend its most iconic stage to a violent supremacist ideology,” said Safa Ahmed of IAMC.\nBrad Lander, who is running for the U.S. Congress, also joined the protest. He said there was “no room” for Mr. Bhagwat and what he described as the RSS’s hatred in New York City, arguing that the safety of communities with different religious and cultural backgrounds was interconnected.\n“We fight for the rights of people who worship differently than you, who look differently than you...everyone’s safety is bound together here...hence we must not allow Mohan Bhagwat to use this prestigious venue of our city as his organisation is known for foment violence against Sikhs, Muslims, Christian,” he added.\nKylie Madhav of Hindus for Human Rights said that Mr. Bhagwat is coming to New York to speak on ‘Oneness’, while for her, ‘all his oneness is for upper caste people in India’’.\nKshipra Uke of the Dalit Solidarity Forum alleged that Mr. Bhagwat has done nothing when the rapists of Bilkis Bano were felicitated after being released from jail.\n“He used temples to woo Hindu votes and failed to check scam in one of the India’s biggest temples,” she added.\nJapneet Singh from Sikh Coalition of New York said that his protest is not against Hinduism but Hindu nationalism.\n“This is not Hindu versus Sikh. This is not India versus America. This is about whether New York will stand for democracy, pluralism, and religious freedom, or whether we will give a platform to an ideology that places religious extremism above equality,” he added.\nSarita Pandey from the Save America From Hindutva said that “If this event proceeds, its most valuable output will be the photographs: the supreme leader of the RSS beneath the Madison Square Garden name, addressing thousands from a celebrated American stage. Those images will circulate worldwide as evidence that Bhagwat was welcomed and honored in New York.”\nMr. Bhagwat is scheduled to visit the United States, Canada and the United Kingdom as part of Sangh’s centenary-year global outreach programme. According to a communique from the RSS, the visit is aimed at engaging with Indian diaspora communities and broader audiences in the three countries, while highlighting India’s cultural traditions and the concept of ‘Vasudhaiva Kutumbakam’ (the idea that the world is one family). Mr Bhagwat is expected to participate in the Universal Oneness programme in New York and community leadership events in Toronto and London.\n“The outreach initiative will also focus on dialogue with mainstream institutions and communities on issues concerning Hindus and people of Indian origin living abroad,” a senior RSS functionary told The Hindu.\nCommenting on the protests and criticism surrounding Mr. Bhagwat’s event in the U.S., former RSS publicity in-charge and BJP vice president, Ram Madhav, said that countries like the U.S. have given a platform to the Taliban and have a problem with dialogues of RSS.\n“Speaking about Hinduism and our ideology doesn’t make us against any other religion or anti-minority,” Mr. Madhav said.\nPublished - August 26, 2026 01:26 am IST", "translation_ja": "", "vocab": [{"word": "supremacist", "definition": "特定の集団や民族が優れていると信じ、他の集団よりも支配的であるべきだと主張する者またはイデオロギーのこと。ここではヒンドゥー至上主義を指している。"}, {"word": "foment", "definition": "紛争や不安などを意図的に引き起こす、あおる、または促進することを意味する。暴力や反乱を助長することなどに使われる。"}, {"word": "pluralism", "definition": "異なる宗教、文化、政治的見解を持つ人々が平等に社会に参加できるという考え方または状態。多様性を尊重する社会体制を指す。"}, {"word": "centenary", "definition": "100周年を意味し、100年間の期間や記念イベントを指す。ここではRSSの創設から100年目の記念行事に関連している。"}, {"word": "diaspora", "definition": "元々の祖国から他の国々に散らばって生活する同じ民族や宗教のグループ。ここではインドから世界各地に移住したインド系コミュニティを指している。"}, {"word": "communique", "definition": "政府や組織が公式に発表する公報、声明、または情報。特に重要な情報や立場を公に知らせる文書。"}, {"word": "ideology", "definition": "ある集団や個人が持つ思想体系や信念体系。政治的、宗教的、または社会的な価値観や原則をまとめた考え方を指す。"}]}, {"title_ja": "NYC市長、RSS指導者のマディソン・スクエア・ガーデン・イベントに反対", "title_en": "NYC Mayor Opposes RSS Chief's Madison Square Garden Event", "summary_ja": "ニューヨーク市長ゾーラン・マムダニ氏は、RSS指導者モーハン・バグワット氏が2026年8月29日にマディソン・スクエア・ガーデンで行う予定の演説に反対を表明し、このイベントは多元的価値観に反する排他的なビジョンを推進していると述べた。マムダニ市長はこの集会に反対しながらも、民間事業のイベントをキャンセルする権限が市にない可能性があることを認めた。複数の宗教間団体と市民権組織もこの出演に抗議し、会場にキャンセルを求めた。", "summary_en": "New York City Mayor Zohran Mamdani expressed opposition to RSS chief Mohan Bhagwat's planned address at Madison Square Garden on August 29, 2026, stating the event promotes an exclusionary vision contrary to pluralistic values. While Mamdani opposed the rally, he acknowledged the city may lack jurisdiction to cancel the privately organized event. Several interfaith and civil rights organizations also protested the appearance, urging the venue to cancel.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/national/nyc-mayor-mamdani-opposes-rss-chief-bhagwats-madison-square-event/article71390368.ece", "state_media": false, "category": "社会", "full_text": "New York City Mayor Zohran Mamdani on Tuesday (August 25, 2026) said he does not support the planned event at Madison Square Garden where Rashtriya Swayamsevak Sangh RSS chief Mohan Bhagwat will address members of the Indian diaspora.\nHowever, he said the city may not have jurisdiction to cancel the “private\" event, which is scheduled for August 29.\nMr. Bhagwat arrived in the U.S. earlier in the day as part of the Rashtriya Swayamsevak Sangh's (RSS) centenary-year global outreach programme. During his stay in New York, he would participate in the Universal Oneness programme and address a gathering of around 5,000 people at the iconic Madison Square Garden (MSG) on Saturday (August 29, 2026).\n\"I don't support the rally, but I don't know if the city has any jurisdiction on cancelling a private event,” Mr. Mamdani said at a news conference in New York.\nThe Indian-origin mayor was responding to a question on RSS, the planned event at MSG and the protests against the event.\nHe was asked whether the “rally” at MSG should be cancelled.\n“I also stand here as the first Indian-American Mayor in our city's history, and my mother's family is all still in India,\" Mr. Mamdani said.\nHe said the vision of India that he was taught by his family and the one that he grew up being very familiar with was that of \"a pluralistic society, of a secular republic that believed in the belonging of each and every person who was from India\".\n“And it has been incredibly troubling to see the rise of a movement that is predicated on an exclusionary vision of any country, frankly, and so it is one that I find myself in deep opposition to, not only as an Indian-American but also as the Mayor of a city that believes deeply in the belonging of each and every person, no matter their colour, their creed, their religion, their faith, wherever they're from,” Mr. Mamdani said.\nSeveral interfaith and civil rights organisations held a press conference outside New York City Hall, the seat of the city government, opposing Mr. Bhagwat's appearance at MSG and urged the iconic venue to cancel the event.\nThe organisations included Hindus for Human Rights, Indian American Muslim Council and Interfaith Centre of New York, among others.\nThe Universal Oneness Celebration, organised by AHEAD Forum, which is hosting Mr. Bhagwat, said in a social media post that the RSS chief will attend the Universal Oneness Celebration in New York on August 29.\n“The event carries a timeless and universal message: 'The world is one family'. It calls upon us to look beyond artificial divisions and differences, recognise the bonds that unite humanity, and embrace a spirit of mutual respect, harmony, and oneness,” the post said.\nMr. Bhagwat is visiting the U.S., Canada and the U.K. as part of the Sangh’s centenary-year global outreach programme.\nPublished - August 26, 2026 12:48 am IST", "translation_ja": "", "vocab": [{"word": "jurisdiction", "definition": "ある機関や裁判所が法的権限を持つ範囲や領域のこと。この記事では、市長がイベントをキャンセルする権限があるかどうかについて述べられている。"}, {"word": "pluralistic", "definition": "異なる意見や文化、宗教など様々な要素が共存する社会や状況を指す形容詞。多元的、多様性を認める価値観を表す。"}, {"word": "exclusionary", "definition": "特定のグループや人々を排除または除外する傾向や政策を示す形容詞。包括的（inclusive）の対義語。"}, {"word": "secular", "definition": "宗教的支配から独立した、または宗教に基づかない政治体制や国家を指す。信仰の自由を尊重する原則。"}, {"word": "interfaith", "definition": "異なる宗教間の協力や対話に関わる形容詞。複数の宗教団体が共同で活動することを指す。"}, {"word": "outreach", "definition": "組織が外部の人々に接近し、影響力を広げようとする取り組みやプログラムのこと。普及活動や啓発活動を意味する。"}]}, {"title_ja": "米国のカントリーミュージック伝説ドリー・パートン80歳で死去", "title_en": "U.S. Country Music Legend Dolly Parton Dies at 80", "summary_ja": "テネシー州の貧困から身を起こし、「ジョリーン」や「愛し続けて」などのヒット曲で家庭の名前となった米国のアイコニックなカントリーミュージック伝説ドリー・パートンが80歳で亡くなりました。6十年間のキャリアで約3,000曲を作成し、49枚のスタジオアルバムをリリースした複数受賞アーティストは、最近健康上の懸念によるラスベガスコンサートをキャンセルしていました。彼女の家族は2026年8月25日に彼女の死を確認しましたが、具体的な原因は開示しませんでした。", "summary_en": "Dolly Parton, the iconic American country music legend who rose from poverty in Tennessee to become a household name with hits like \"Jolene\" and \"I Will Always Love You,\" has died at age 80. The multiple award-winning artist, who penned approximately 3,000 songs and released 49 studio albums over a six-decade career, had recently canceled Las Vegas concerts due to health concerns. Her family confirmed her death on August 25, 2026, without disclosing the specific cause.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/entertainment/music/us-country-music-legend-dolly-parton-dies-at-80-family/article71390340.ece", "state_media": false, "category": "政治", "full_text": "U.S. country music legend Dolly Parton, who grew up poor in Tennessee and became a household name with hits like “Jolene” and “Coat of Many Colors,” has died at age 80, her family said on Tuesday (August 25, 2026).\n“Dolly has lived in the light and is in the arms of Jesus,” her nephew said in a video on social media.\nHe said the multiple award-winning artist had “opened doors for generations of singers, songwriters, musicians, and dreamers from every walk of life.”\nThe family did not give a cause of death but the singer had spoken about her recent ill health. Her husband Carl Dean died last year.\nIn May, Parton had announced the cancellation of a series of Las Vegas concerts, citing ongoing health concerns. In videos posted to her social media accounts she said that while treatment for an unspecified illness was going well, she was not ready to be performing on stage.\nParton was prolific in a career spanning six decades during which she penned some 3,000 tunes, including the iconic ballad “I Will Always Love You,” which became an international smash for Whitney Houston.\nReleasing 49 studio albums and more than 100 compilation and collaboration albums, she earned the title of “queen of country music.”\n“By her example, we believed that anything was possible. She never saw a door she couldn’t open, and the doors she opened made and changed history,” her nephew Bryan Seaver said.\nPublished - August 25, 2026 11:53 pm IST", "translation_ja": "", "vocab": [{"word": "prolific", "definition": "大量の作品や成果を短期間に生み出す能力がある様子。ドリー・パートンが6十年間で3,000曲以上を作成したことを表現するのに使われています。"}, {"word": "iconic", "definition": "特定の文化や時代を象徴する、広く認識されている有名な存在。ドリー・パートンが国のカントリーミュージック業界を代表する伝説的な人物であることを示します。"}, {"word": "compilation", "definition": "異なるソースから集められた作品や記録をまとめたもの。複数のアルバムから曲を集めたアルバムを指します。"}, {"word": "ballad", "definition": "感情的なテーマを扱う長くゆっくりした歌曲。ドリー・パートンの代表曲「I Will Always Love You」のようなロマンティックな曲を指します。"}, {"word": "cite", "definition": "理由として言及する、引き合いに出す。パートンがコンサート中止の理由として健康問題を述べたことを表現します。"}]}, {"title_ja": "マーク・カーニーが示す米国にとってのカナダの重要性、トランプが注視すべき理由", "title_en": "Mark Carney Shows Why the U.S. Needs Canada, Trump Should Take Note", "summary_ja": "ジャスティン・リングは、マーク・カーニーの最近の発言が米国経済とセキュリティに対するカナダの戦略的重要性を示していると主張している。このコラムは、両国の相互依存的な性質を考えると、トランプ政権が米国・カナダ関係へのアプローチを再検討すべきであることを示唆している。", "summary_en": "Justin Ling argues that Mark Carney's recent statements demonstrate the strategic importance of Canada to the United States economy and security. The column suggests that the Trump administration should reconsider its approach to U.S.-Canada relations given the interdependent nature of the two nations.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9wFBVV95cUxQZ3Vfb3AzelpsYTVwUHZXRkZaVGEya2lBSzVmVHZROFlacG5HaG5lbEIzcXBhMjNkNGRUaW1xeWZ2OHRhc1BWTmtrVnJPU3FuLXA4ejMzbHA0ZTVMLTQ0S1hDaW9SX242cFpGRXNJeU92SW1hTWdtSTljZV9fcFdPZjN1OXZvMGJCT2gyUU02ckE5c3JiVW9ycFNHQmR4OVZPaXBCOFNINy1GeUVmRWp0bW53cjBNYm44dEpwLUljT05QdUV1Zk1DLWNhckVWd1pxRENSRUhLTmpLQ2lUUk1Nd0RqdTdUeEltSGttVUJVLUYyNXl0UlA0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ダグ・フォード、トランプのオンライン中傷に対抗 「彼は敗者だ」と批判", "title_en": "Doug Ford dismisses Trump's online insults, calls him 'a loser'", "summary_ja": "オンタリオ州のダグ・フォード首相は、ドナルド・トランプ前米大統領によるソーシャルメディア上の批判に対して、「彼は敗者だ」と反発した。カナダとアメリカの政治指導者間の緊張が続く中でのフォードの  "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O Globo 英語ニュースセクション", "title_en": "O Globo English News Section", "summary_ja": "O Globoは世界中の読者向けに英語での国際ニュース報道を提供しています。このセクションではブラジルと世界中の主要なニュースを配信しています。", "summary_en": "O Globo presents international news coverage in English for global readers. The section provides updates on major stories from Brazil and around the world.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE00WVFsTjVqR2xZQjFKaFZSNHBGUkpwZ2RhZXRRVUpPeHpoNXlfWENGNkN1VW9xOEtmby1oNVpYZVc2Y2huaWh2SnpvdExUbEJvZWhhc3ZXWnRFM2xIcVFiajR4UHA4NENhYXc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グロボ紙100周年：創刊と同じ年に生まれた読者たちの物語", "title_en": "Centenarian Subscribers: Stories of Loyalty as O Globo Marks 100 Years", "summary_ja": "ブラジルを代表する新聞オー・グロボは2025年に創刊100周年を迎えるにあたり、同紙と同じ年に生まれた購読者たちの感動的な物語を紹介している。この世紀を生きた読者たちは、ブラジルの歴史の変化とともに新聞の発展を見守ってきた。彼らの人生記は、質の高いジャーナリズムの価値と出版物と読者の深い結びつきを映し出している。", "summary_en": "O Globo celebrates its upcoming centennial in 2025 by highlighting the inspiring stories of its long-time subscribers who are also reaching their 100th birthday. These remarkable individuals have witnessed a century of history alongside Brazil's most prominent newspaper. Their personal narratives reflect both the enduring value of quality journalism and the deep connection between the publication and its readers.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi4gFBVV95cUxQckNyQXRYdHI5dHNKNGFDT0ZIU1dlRnZxRFpYdkFYR1hoTFpkaDRobkZ6Mkxpd21oeVhRUU1qR3hCTjQyZmVRVlo3R1p0aGptR2JqVU5MR1lORGxJRTJXQ1B1eGNHVndIZXgyb1pqU0V3eURHRHFWYXFheE5sdkRBS3laU01nQzl5YVp0a2hiT3hzOHExNFRQUnlWLXUxOVJsSWJNbDQtdXhodVlSRGlWVFRVSjlSREZpaGFOelU5UmlxRmVVNEY4RG5GSjRDUWpWc3N6eWVzS3gtMkdkYi1kU1pn0gHwAUFVX3lxTE5mTnRybnZhQWpFUWpqZTloM0lHcjA5UFZQWWZyX05SclVVTXFxRU9lQnJnYVRLTkd5Z1FYOHgtOHNZV0I2dlZsRTBwZVdDVlFETkFuTWQxRFdTZE5mZXVjMXZPdEVQSjZIamJzWkdZX3ZXUFo3TEZfYm9ISzJjUFZ2eUVsaVhGTktPQkg2UlkwZEh5M3dRU2xZQUtBVkh6NEV2UmpOQ2Q4aC10TW9pdldLdUJieXVLaU1NWEZqbVhXYW52UUdIWjcya3c4WWMtb1VBUGI0OVk4bUlnZHo3cEtILVFRVS0ybUYtYmoyVVNWNg?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コパカバーナ大晦日イベント、ゴスペルからファンク、MPB、サンバまで多彩な音楽を展開", "title_en": "Copacabana New Year's Eve to Feature Gospel, Funk, MPB, and Samba", "summary_ja": "リオデジャネイロを代表するコパカバーナビーチで、多様なブラジル音楽ジャンルを特徴とした大晦日セレブレーションが開催される。このイベントではゴスペルミュージック、ファンク、MPB（ブラジル大衆音楽）、サンバなど複数のジャンルのパフォーマンスが予定されており、幅広い観客を対象とした娯楽が提供される。", "summary_en": "Rio de Janeiro's iconic Copacabana beach will host a diverse New Year's Eve celebration showcasing multiple Brazilian music genres. The event will feature performances spanning gospel music, funk, MPB (Música Popular Brasileira), and samba, offering entertainment for a wide audience.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi4wFBVV95cUxQdkJ5QUYtN1VFbXVPSWVvbDNnd0R0RC1rOFJ1ZnRIQXpqQm5ZeGtjaHdIQ2VQZTYtSEcwR2JTaFU2aXlZMlZxRE14SExNTEpzVXFpQV9sckpoZXFXaTZPNmhMSE1mN2Q5VlQyek5zTmJId3d6U3ZqWW9WekZqUkNqMzBBRWZ5NWRmNjJkQ3Fhd0hNUUpRMEc4TDJBcGR4ZHB4NFltcEg4NXU4OHZqQlJYc2lmaVFXalhBaUIydnBnR0RjeDJGeFRGN2t3VGoyOTgyV0hCSDdVbkc3bkRnWEdwRVFDVdIB8gFBVV95cUxPWXo1WGF3VGVqVFlPQUcyWUZNbVc3bExHQnoyZU5LXzBTeUhucDZFMU11R2laZzdCLUpaemlPOEw2MDhRSEd2dW41UWhnenV2NWZwdVFzb3JHb2l1Z2FnTVh6Yi1IRkNnUTZTcE5RbHlrTFVmRWxlejB4TEo0UmR6RjI3SE80alI0RDRxNEpGRlpXWUFCSHo3RllKQ0owVm1aQzMwcFlkMzBYbF9nRlhmT3NBZ2hUOXJUMDNxSWh6SXUwZ1ZUa1AxYllsbk5sVW9wZ09RYUlIeFZ6VGJQaE0zYkhpdUZucW4zX1VBaUhkWV9Bdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アティクの燃料補助金提案対ティヌブ政権の対応", "title_en": "Atiku's Fuel Subsidy Proposal vs. Tinubu's Government Response", "summary_ja": "政治評論家ボラジ・アブドゥラヒは、アティク・アブバカルの燃料生産補助金提案は国民の苦しみに響く大胆なアイデアであると主張する一方、ティヌブ政権はそれをポピュリズムとして却下し実行可能な代替案を提供していないと述べています。著者はティヌブ大統領が燃料補助金を政治的・社会的影響を管理することなく性急に廃止したことを批判し、患者の脚を切断して松葉杖を提供しないようなものだと例えています。", "summary_en": "Political analyst Bolaji Abdullahi argues that Atiku Abubakar's proposal to subsidize fuel production is a bold idea resonating with Nigerians suffering from high cost of living, while the Tinubu administration has dismissed it as populism without offering viable alternatives. The author criticizes President Tinubu for hastily removing fuel subsidies without managing the political and social consequences, likening it to amputating a patient's leg without providing a crutch.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/905369-atikus-fuel-subsidy-and-tinubus-church-rat-by-bolaji-abdullahi.html", "state_media": false, "category": "政治", "full_text": "The APC and President Tinubu know that the Atiku solution to subsidise production as a way of lowering the pump price and bringing down the cost of living is a bold idea and they know it resonates with the people. This is why they have been quite busy of late. They have dismissed the idea as populist or election-pandering. But as long as they are not able to offer an alternative on how to make life better for the people, it remains the only idea on the table, and Nigerians will take it.\nThis must be one of the most exciting moments in our politics. Perhaps, for the first time in this republic the political campaign is being anchored on an issue that is most pertinent to most Nigerians: the issue of fuel subsidy. We have the presidential candidate of the African Democratic Congress (ADC), Alhaji Atiku Abubakar to thank for that.\nUnfortunately, the government has reacted mostly with personal abuse directed at Atiku or with statements that cynically denies the lived reality of the majority of citizens. Atiku’s subsidy declaration has effectively turned the table. The government has now found itself in opposition against a daring idea that is made popular largely due to its catastrophic mismanagement of a policy that used to be a point of consensus among presidential candidates. This administration has had three years to make the people see the wisdom in the removal of fuel subsidy, if not the full benefits, but they did not. They are not likely to achieve that before the elections.\nThe most important point that the government is missing is this: the debate that Atiku has started is not just about fuel subsidy. It is about bringing down the cost of living, which has soared beyond the reach of the majority. Fuel subsidy is therefore only a strategy in bringing down the cost of living and giving respite to suffering citizens. Even government has not been able to deny that the removal of fuel subsidy has caused so much pains to the people. They only say that the pains are necessary and would be worthy of the gains when they eventually arrive. When? They never could tell.\nEven as poorly as they have made their own case, there are a few areas where one would agree with the government. One is that the economy that was handed to Bola Tinubu in 2023 was tottering on the brink of collapse and required desperate measures to save it. Two is that the old subsidy regime had been mismanaged and the fiscal burden had become ruinous. On the second point, President Tinubu would not be the first to see that. Successive governments, perhaps, since General Babangida, also saw it. But they also recognised the dilemma and the political complexity.\nThe old fuel subsidy regime was like a highly toxic, but necessary medication. If you continue to administer it, it may eventually kill the patient. If you withdraw it, the patient faced terrible pains, and may eventually die, still. This dilemma was the reason past administrations did not see the removal of subsidy, even as attractive as it was, as a simple, easy solution. President Tinubu did not see this dilemma. He did not hesitate. He thought his predecessors were cowards. He mistook recklessness for courage. Heady with the supreme authority that was just conferred on him, he swaggered into the Intensive Care Unit (ICU) and pulled the life support.\nPublic policy is about managing alternatives. None of which may be cost-free in terms of the trade-offs or the loss to those who are likely to bear the brunt of change. But policy experts understand that the challenge is in finding the option that delivers the optimal outcome with minimal or, at least, manageable cost to the those who would be required to make adjustments as a result of change. They understand that reforms hardly fail because they are technically unsound. They fail because the reformers fail to manage the politics of it, especially in terms of what the people would be required to give up, and what alternatives or succour is being provided. Therefore, defending a reform on the promise of benefits that would arrive sometimes in an indeterminate future is never enough.\nThe presidency and some so-called experts have dismissed the ADC candidate’s promise to return subsidy as mere populism, unrealistic or even anachronistic. But merely discrediting an idea is not an alternative idea. If we agree that what we are faced with is, at least, the devil’s alternative, what the experts should be doing is to suggest alternatives rather than merely dismissing the one on the table.\nThose on the side of government have insisted that the removal of subsidy was absolutely necessary. Yes, it may be necessary to amputate a leg in order to save the entire body. But when you do that and you don’t provide, at least, a crutch, you do not blame the patient if he does not appreciate that you have crippled him.\nThe President’s men point at the humongous sum of ₦5.5 trillion shared in the month of July alone as evidence that the removal of subsidy has b", "translation_ja": "", "vocab": [{"word": "populist", "definition": "大衆的な支持を得るために過度に単純な解決策を提唱する主義。政策評論で、複雑な問題の本質を無視して民衆受けを狙う提案を指すことが多いです。"}, {"word": "fiscal", "definition": "政府の財政や金銭管理に関する形容詞。予算、税収、支出などの政府財務全般を指します。"}, {"word": "dilemma", "definition": "二つの困難な選択肢の間で決断を迫られる状況。どちらを選んでも悪い結果が生じる板挟みの状態を意味します。"}, {"word": "recklessness", "definition": "危険や結果を顧みずに無謀に行動する態度。注意深さや思慮を欠いた行為の傾向を指します。"}, {"word": "optimal", "definition": "最も良い、最も望ましい状態や条件。複数の選択肢の中で最良の結果をもたらすものを説明する時に使われます。"}, {"word": "anachronistic", "definition": "時代遅れの、現在の時代に合わない。昔の方法や考え方が現代では通用しないことを示唆します。"}, {"word": "humongous", "definition": "非常に大きい、巨大な。enormous や huge よりも非公式でインパクトのある表現で、驚くべき規模を強調します。"}]}, {"title_ja": "ナイジェリア専門家、土地劣化と農民遊牧民紛争に対処するため環境投資拡大を要求", "title_en": "Nigeria Must Invest More in Environment to Tackle Land Degradation, Expert Says", "summary_ja": "ナイジェリア保全財団のジョセフ・オノハ事務局長がモンゴルのCOP17で、ナイジェリアの深刻な土地劣化危機について議論している。彼は環境投資の増加と、劣化した景観を復元し国際融資機会にアクセスするための「グリーン・リカバリー・ナイジェリア」イニシアティブの必要性を強調している。", "summary_en": "Joseph Onoja, Director-General of the Nigerian Conservation Foundation, discusses Nigeria's critical land degradation crisis at COP17 in Mongolia. He emphasizes the need for increased environmental investment and the Green Recovery Nigeria initiative to restore degraded landscapes while accessing international financing opportunities.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/features-and-interviews/905376-interview-nigeria-must-invest-more-in-environment-to-tackle-land-degradation-farmer-herder-conflicts-expert.html", "state_media": false, "category": "経済", "full_text": "Joseph Onoja, Director-General of the Nigerian Conservation Foundation (NCF), speaks on Nigeria’s worsening land degradation, the financing gap in environmental protection and the need for greater synergy among the three major UN environmental conventions.\nIn this interview, Mr Onoja, who spoke with PREMIUM TIMES’s Abdulkareem Mojeed on the sidelines of the ongoing COP17 in Mongolia, shared insights into NCF’s Green Recovery Nigeria initiative and Nigeria’s prospects of accessing the $1.3 billion financing announced at COP17 in Ulaanbaatar, Mongolia on Monday.\nExcerpt:\nPT: Why is the Nigerian Conservation Foundation participating in COP17 in Mongolia?\nOnoja: One of the things we are interested in at NCF, and one of the reasons we are here at COP17, is to further our objectives while working very closely with the Nigerian government, especially the Federal Ministry of Environment. One of our flagship projects is Green Recovery Nigeria. It is an ambitious project through which we hope to galvanise efforts towards restoring Nigeria’s degraded landscapes, particularly the forest landscape. What we are seeing is that our landscape is being degraded. Sometimes, people erroneously think that when you talk about the UN Convention to Combat Desertification, you are only talking about deserts. It goes beyond deserts.\nIt also concerns forests and other landscapes because we are talking about land degradation. Nigeria has also committed to Land Degradation Neutrality (LDN). When you make that commitment, you have to ensure that your lands maintain the quality that supports livelihoods, agriculture, biodiversity and climate action. So, whether you are talking about the desert, savannah or forest, you need quality land across the landscape. That is why, as NCF, one of the things we have pledged to do is to galvanise efforts towards restoring Nigeria’s landscapes, particularly through Green Recovery Nigeria.\nPT: You are here in Mongolia at a time when finance is a major issue at COP17. How are you approaching the question of financing and how can Nigeria and Africa benefit from the opportunities being discussed?\nOnoja: Most of these finances are normally pledged to governments. So, as NCF, being a technical partner of the government, what we can do is help the government prepare bankable projects that can access these funds. There are different mechanisms and avenues through which the government can make that happen. That is domiciled with the Federal Government, through the Federal Ministry of Environment and the relevant department responsible for land management. Whatever funding we want to access through the UNCCD has to go through that process, although there are some other funding opportunities that organisations and NGOs can access directly. Platforms such as this conference provide an avenue for like-minded people to come together and interact.\nWhen you talk about finance, pledges will be made, but most of those pledges go to governments. However, these platforms also provide opportunities to create bilateral engagements with funding organisations willing to fund NGOs, local communities and indigenous peoples who are doing the actual work on the ground. That is where we come in as NCF. But it is not just about finance. It is about the project. What are you going to use the finance for? I think that is the first step. You have to prepare yourself to be able to access these funds because the finance is available. The question is: what are you going to use it for?\nThat is why, as NCF, we developed Green Recovery Nigeria. It is all-encompassing. By restoring our landscape, you promote biodiversity, climate action and other environmental objectives. It also serves as a nature-based solution to issues such as biodiversity loss and the effects of climate change.\nPT: Do you think Nigeria stands a good chance of accessing some of the financing announced at COP17, including the $1.3 billion pledge?\nOnoja: I think that is a question for the government to answer. All we can do is pledge our support to the government. As a technical partner, we can provide technical expertise in preparing bankable projects, identifying needs and identifying areas where interventions can take place. We can work together with the government to prepare these documents and make sure that the government positions itself to access these funds.\nPT: How serious is land degradation in Nigeria?\nOnoja: Nigeria has different ecotones and habitats. We have everything from the mangrove ecosystem all the way to the desert. We now have desertification advancing in parts of Nigeria. Areas that used to be Sahel savannah are increasingly experiencing desertification. We also have significant forest degradation. Nigeria is one of the countries with a very high rate of deforestation, and when that happens, it definitely contributes to land degradation. When you expose the land by removing the vegetation that provides land cover, you expose it to erosion.\nOnce eros", "translation_ja": "", "vocab": [{"word": "ecotones", "definition": "生態系が異なる2つの地域の間の遷移地帯。異なる環境条件を持つ地域間の境界領域を指す。"}, {"word": "desertification", "definition": "土地が砂漠化するプロセス。植生の喪失と土壌劣化により、かつての肥沃な土地が砂漠のような不毛の地に変わることを意味する。"}, {"word": "Land Degradation Neutrality", "definition": "土地の品質を維持し、劣化を中立化させるという国際的な約束。生計、農業、生物多様性、気候行動を支える土地の質を保つことを目標とする。"}, {"word": "bankable projects", "definition": "銀行や融資機関が融資可能と判断する事業計画。財務的に実行可能で、返済能力が確実な案件を指す。"}, {"word": "nature-based solutions", "definition": "自然の仕組みを利用して環境問題に対処する方法。生態系の復元などを通じて気候変動や生物多様性喪失に取り組むアプローチ。"}, {"word": "technical partner", "definition": "政府や国際機関に対して専門知識と技術的支援を提供する組織やNGO。プロジェクト企画や実施を支援する役割を果たす。"}]}, {"title_ja": "ナイジェリアの上級弁護士ガジャマ、3年間の職務停止に異議を唱える法的許可を獲得", "title_en": "Nigerian SAN Gadzama Wins Court Permission to Challenge 3-Year Suspension", "summary_ja": "アブジャの連邦高等裁判所は、法律実務家懲戒委員会（LPDC）が課した3年間の法律実務停止に対する司法審査を求めることをナイジェリアの上級弁護士ジョー・キャリ・ガジャマに許可した。ガジャマは有効な異議申し立て制度がないという憲法上の根拠に基づいて決定に異議を唱え、補償紛争における職務違反の疑いに関する委員会の判断に異議を唱えている。", "summary_en": "Federal High Court in Abuja granted Senior Advocate Joe-Kyari Gadzama leave to seek judicial review of his three-year suspension from legal practice imposed by the Legal Practitioners Disciplinary Committee. Gadzama challenges the decision on constitutional grounds, arguing there is no effective appeal mechanism available, and disputes the committee's findings regarding alleged professional misconduct in a compensation dispute.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/905362-gadzama-obtains-courts-leave-to-challenge-three-year-suspension-by-lpdc.html", "state_media": false, "category": "社会", "full_text": "The Federal High Court in Abuja has granted Joe-Kyari Gadzama, a Senior Advocate of Nigeria (SAN), leave to challenge his three-year suspension from legal practice by the Legal Practitioners Disciplinary Committee (LPDC).\nThe leave granted by Judge Obiora Egwuatu on 20 August gave Mr Gadzama permission to apply for judicial review and seek an order of certiorari to quash the LPDC’s Direction delivered on 29 July.\nThe court ordered him to file the substantive application within seven days of the order and adjourned the matter until 4 September for hearing, subject to service on the respondents.\nThe development followed an ex-parte application filed on 19 August by Mr Gadzama through his lawyers led by Bolaji Ayorinde, also a SAN.\nMr Gadzama is challenging the disciplinary decision over his alleged professional misconduct in the long-running dispute involving compensation for victims and survivors of the 2001 military operation in Zaki-Biam, Benue State.\nPREMIUM TIMES reported that the LPDC had suspended him for three years after finding him guilty of professional misconduct. It also suspended another lawyer, Ocha Ulegede, for two years over the same dispute.\nPrayers sought in main suit\nMr Gadzama seeks in his substantive suit seeks an order of certiorari quashing the Direction of the LPDC in complaint no. BB/LPDC/1314/2024 (Chris Alashi, Esq. v Ocha P. Ulegede, Esq. & Anor) delivered on 29 July.\nThe accompanying statement filed alongside the motion seeks the court’s declation that enforcement of the LPDC Direction, in the absence of an effective appeal mechanism, is inconsistent with sections 36(1), 36(2) and 287 of the Constitution.\nThe proposed judicial review also seeks orders restraining the respondents from implementing, publishing, transmitting or enforcing the LPDC Direction against him.\nMr Gadzama further wants the Chief Registrar of the Supreme Court stopped from making any disciplinary notation against him and wants the publication or dissemination of the Direction as a final disciplinary determination against him restrained.\nWhy Gadzama is challenging the suspension\nA central argument the senior lawyer made in the application is that there is currently no effective statutory mechanism for him to appeal the LPDC decision.\nHis lawyers relied on the Supreme Court’s decision in Ben Mene-Ejegi, delivered on 26 June, and a letter from the Body of Benchers dated 13 August, which they said confirmed that no Appeal Committee presently exists with appellate jurisdiction.\nThe lawyers therefore argued that “there is presently no effective statutory appellate mechanism” through which Mr Gadzama can challenge the LPDC Direction and contend that enforcing the Direction as a final disciplinary decision in those circumstances raises constitutional questions under sections 36(1) and 36(2)(b).\nThe application describes the continued enforcement of the decision, without an available appellate safeguard, as a “constitutional defect” that can be examined through judicial review.\nMr Gadzama also argues that implementation of the Direction would effectively deprive him of a practical avenue to challenge the disciplinary decision.\nThe application says the Body of Benchers and LPDC are statutory bodies exercising public powers and are therefore subject to judicial review.\nGrounds of challenge\nBeyond the constitutional argument, Mr Gadzama raises eight substantive grounds against the LPDC Direction. One of his main arguments concerns a document identified as Exhibit JK2.\nThe LPDC found the document to be forged because it carried the signature of Zaki Kaduna Mazan on a document dated 22 May 2015, although Mr Mazan had died on 11 September 2010. But Mr Gadzama’s lawyers argue that the finding that the document was forged did not, by itself, establish that he personally forged it.\n“The finding that Exhibit JK2 was forged did not, without more, establish that the Applicant personally forged the document, participated in its preparation or knew that it was forged when it was presented to him.”\nThey said, “The Committee, however, failed to identify any finding of fact or evidence establishing the Applicant’s personal knowledge, participation or culpability in respect of the alleged forgery before attributing professional misconduct to him.”\nThey also added that the LPDC failed to distinguish between the fact that the document was forged and the separate question of Mr Gadzama’s personal responsibility for the forgery. They also said it did not identify evidence showing that he knew of the alleged forgery, participated in its preparation or personally forged the document.\nThe application says the committee failed to distinguish between the existence of a forged document and the separate question of Mr Gadzama’s personal culpability.\nHis lawyers also challenge the LPDC’s finding that he poached or hijacked clients and failed to determine whether Mr Gadzama knew, or ought reasonably to have known, that the clients were already repr", "translation_ja": "", "vocab": [{"word": "certiorari", "definition": "裁判所が下級裁判所の決定を再検討するために発行する法的命令。司法審査における重要な救済手段であり、違法な行為を是正するために使用される。"}, {"word": "disciplinary committee", "definition": "専門職の違反や不正行為を調査・処罰する権限を持つ公式な委員会。法曹や医療専門家など様々な職業に存在する。"}, {"word": "ex-parte application", "definition": "一方の当事者のみが出席して行われる法的申請。相手方に事前通知なく申し立てられることが多く、緊急時に使用される。"}, {"word": "statutory mechanism", "definition": "法律によって定められた公式な手続きやシステム。法的枠組みの中で特定の目的を達成するために設計される。"}, {"word": "appellate jurisdiction", "definition": "下級裁判所の決定や判断に対する異議申し立てを聞く権限。上位の裁判所が持つ司法権の一種である。"}, {"word": "judicial review", "definition": "裁判所が政府機関や公的機関の行為の合法性を審査するプロセス。憲法や法律に違反していないかを確認する。"}, {"word": "culpability", "definition": "特定の行為に対して責任を負うべき状態または程度。個人の知識、参加、または故意が問題となる。"}]}, {"title_ja": "カナダがトランプ関税に報復、最大50%の関税を発動", "title_en": "Canada Retaliates With Up to 50% Tariffs in Escalating Trade War", "summary_ja": "カナダはトランプ政権の新たな関税に対抗するため、アルミホイル、食器洗い機、魚を含む米国製品に対して最大50%の報復関税を発表しました。カナダ政府は、この措置は米国の貿易措置の影響を受けた国内労働者、生産者、製造業者を保護するためのものだと述べています。", "summary_en": "Canada has announced retaliatory tariffs of up to 50% on American goods including aluminum foil, dishwashers, and fish in response to new Trump administration tariffs. The Canadian government says the measures are designed to protect domestic workers, producers, and manufacturers affected by the U.S. trade actions.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/25/world/canada/canada-tariffs-trump-carney-retaliatory.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国の経済制裁キャンペーン、イランの報復招く恐れ", "title_en": "Iran May Have Little to Lose as U.S. Tries to Squeeze Its Economy", "summary_ja": "米国がイランの経済を圧迫する制裁キャンペーンを展開する中、専門家らは軍事的エスカレーションを回避しようとする戦略が逆効果となり、衝突を招く可能性があると警告している。イランの指導部は湾岸地域全域での報復を宣言しており、経済圧力キャンペーンの有効性に関する懸念が高まっている。", "summary_en": "As the United States pursues economic sanctions against Iran to avoid military escalation, experts warn the strategy could backfire and provoke the opposite outcome. Iranian leaders have vowed retaliation across the oil-rich Gulf region, raising concerns about the effectiveness of pressure campaigns.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/25/world/middleeast/iran-us-economy-sanctions.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランからの逃亡者、トランプ政権の強制送還後、カナダで亡命許可を獲得", "title_en": "Christian Convert Fleeing Iran Finds Asylum in Canada After Trump Deportation", "summary_ja": "イランでの宗教的迫害から逃れたキリスト教信仰者のアルテミス・ガセムザデは、トランプ政権の移民取締強化により、パナマに強制送還されていた。不確かな将来に直面した後、カナダが彼女に亡命を認可し、新しい生活の場を提供した。", "summary_en": "Artemis Ghasemzadeh, a Christian convert who escaped religious persecution in Iran, was deported to Panama during Trump's immigration crackdown. After facing an uncertain future, Canada has granted her asylum, providing her with a new home and safety.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/25/world/middleeast/artemis-ghasemzadeh-iran-christian-us-deported-canada-asylum.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事地帯の通過を許可、ガザ北部へのパレスチナ人の帰還が再開", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "イスラエルはガザを二分する軍事地帯の通過を許可し、人質解放をめぐる交渉の膠着状態が打破された後、パレスチナ人難民の帰還が始まった。制限されていた移動期間を経て、住民は飛び地の北部地域への帰還が可能になった。この通過地点は停戦交渉における主要な争点となっていた。", "summary_en": "Israel has allowed displaced Palestinians to resume crossing a military zone that divides Gaza, following a breakthrough in negotiations over hostage releases. The move enables residents to return to the northern part of the enclave after a period of restricted movement. The crossing had been a major point of contention in ceasefire discussions.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国最大手不動産開発企業が巨額赤字を報告、不動産危機の深刻化を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国大手不動産開発企業のバンケは巨額の損失を報告し、中国の不動産セクター危機の深刻化を示している。同社の経営難は業界全体への波及効果への懸念を生じさせている。中国政府が苦しむ不動産セクターの安定化に介入するかどうかが注目されている。", "summary_en": "Vanke, a major Chinese property developer, has reported substantial losses, signaling the deepening property sector crisis in China. The company's financial struggles raise concerns about contagion across the real estate industry. Questions now focus on whether the Chinese government will intervene to stabilize the struggling sector.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片が体内に残存", "title_en": "Freed Israeli Hostages Carried Shrapnel From October 7 Attack", "summary_ja": "イスラエルの医療関係者によると、最近解放されたイスラエル人人質の体内には10月7日の攻撃による破片がまだ埋め込まれていたことが判明した。一部の女性人質は長期間隔離された状態で拘束され、約8か月間地下トンネル内に留置されていた。", "summary_en": "Recently released Israeli hostages were found to still have shrapnel embedded in their bodies from the October 7 attack, according to Israeli medical officials. Some of the women hostages were held in isolation for extended periods and spent approximately eight months in underground tunnels during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領の権力が揺らぐ中、その危険性はかつてないほど高まる", "title_en": "As Trump's presidency flounders, he becomes increasingly dangerous", "summary_ja": "トランプ大統領は政治的影響力の低下とともに弱体化するのではなく、むしろ自らの支配力を守ろうとする老いたゴリラのように行動している。エコノミスト誌は、窮地に追い詰められたトランプが、政治的に強い時期よりも安定性に対する脅威となる可能性があると警告している。", "summary_en": "Rather than becoming a weakened lame duck, President Trump is acting like an aging silverback gorilla defending his dominance as his presidency struggles. The Economist warns that a cornered Trump may pose greater risks to stability than during his stronger political position.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/25/as-his-presidency-flounders-donald-trump-is-more-dangerous-than-ever", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "迎撃ミサイルが枯渇したときに何が起こるか", "title_en": "What Happens When Interceptor Missiles Run Out", "summary_ja": "ウクライナなど複数国で、空中防衛需要の急増に伴う迎撃ミサイルの深刻な不足が発生している。この品不足は航空攻撃への防御能力についての広範な懸念を引き起こしている。防衛当局は、現在の消費速度に対して持続的なミサイル生産では不十分である可能性があると警告している。", "summary_en": "Ukraine and other nations face a critical shortage of interceptor missiles as air defense demands surge. The growing scarcity is causing widespread concern about the ability to defend against aerial attacks. Defense officials warn that sustained missile production may be insufficient to meet current consumption rates.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "『The Economist for You』パーソナライズされた新しいニュースレターの開始", "title_en": "The Economist Launches Personalized Newsletter", "summary_ja": "『エコノミスト』は、購読者の受信箱に直接キュレーションされた読書リストを配信する新しいパーソナライズされたニュースレター『The Economist for You』を立ち上げました。このサービスは個々の好みと関心に基づいてコンテンツをカスタマイズし、各ユーザーの読書体験を向上させます。", "summary_en": "The Economist has introduced a new personalized newsletter called 'The Economist for You,' designed to deliver curated reading lists directly to subscribers' inboxes. The service tailors content based on individual preferences and interests, enhancing the reading experience for each user.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/introducing-our-latest-newsletter-the-economist-for-you", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル兵がガザにおける情報戦術を明かす", "title_en": "Israeli Soldier Reveals Army's Information War Tactics in Gaza", "summary_ja": "ガザ南部のナセル病院への爆撃から1年が経ち、その爆撃ではジャーナリスト5人を含む22人が殺害された。イスラエル兵がル・モンドを含む複数のメディアに対し、イスラエル軍がいかに爆撃の犠牲者をハマスと結びつけようとしているかを明かした。この証言は紛争中の軍の情報管理戦略に光を当てている。この証言はガザにおける民間人被害の物語構成について疑問を投げかけている。", "summary_en": "One year after an Israeli bombing of Nasser Hospital in Gaza that killed 22 people including five journalists, an Israeli soldier has disclosed to media outlets including Le Monde how the Israeli military systematically attempts to link bombing victims to Hamas. The testimony provides insight into the military's information management strategies during the conflict. The account raises questions about the narrative construction surrounding civilian casualties in Gaza.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/25/soldier-testimony-sheds-light-on-how-israel-wages-information-war_6756830_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カナダが米国製品に15～50%の報復関税を発表、貿易紛争が激化", "title_en": "Canada Imposes 15-50% Counter-Tariffs on US Goods Amid Trade Escalation", "summary_ja": "カナダは米国の貿易措置に対抗して、米国製品に15～50%の報復関税を実施すると発表した。鋼鉄・アルミニウム製品は最高50%の関税に直面し、家電製品や乳製品、特定の派生製品は25%の関税が課される。この措置は両国間の貿易紛争の激化を示している。", "summary_en": "Canada has announced retaliatory tariffs ranging from 15% to 50% on American products in response to US trade actions. Steel and aluminum products will face the highest tariffs at 50%, while appliances, dairy products, and certain derivatives will be subject to 25% duties. The move marks an intensification of the trade dispute between the two nations.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/25/canada-unveils-counter-tariffs-of-15-to-50-on-us-goods-as-trade-war-intensifies_6756837_4.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米カントリーミュージックの伝説ドリー・パートン、『ジョリーン』の創作者が80歳で逝去", "title_en": "Dolly Parton, US Country Music Legend Behind 'Jolene,' Dies at 80", "summary_ja": "米国カントリーミュージックの伝説的なアーティスト、ドリー・パートンが80歳で亡くなりました。60年間のキャリアの中で、彼女は約3,000曲を作曲し、その中にはホイットニー・ヒューストンによって国際的なヒットとなった『アイ・ウィル・オールウェイズ・ラブ・ユー』が含まれています。", "summary_en": "Dolly Parton, an iconic American country music legend, has passed away at age 80. During her six-decade career, she composed approximately 3,000 songs, including the famous ballad 'I Will Always Love You,' which became an international hit through Whitney Houston's rendition.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/obituaries/article/2026/08/25/dolly-parton-us-country-music-legend-behind-iconic-song-jolene-dies-at-age-80_6756844_15.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の更新", "title_en": "Ministry of Defence Update", "summary_ja": "国防省（Mindef）が最新情報を発表しました。防衛・セキュリティに関するニュースをさらに知るために、海峡時報のニュースレターを購読してください。提供されたリンクから購読設定を管理できます。", "summary_en": "The Ministry of Defence (Mindef) has released an update. Subscribe to The Straits Times newsletters for more defence and security news. Manage your subscription preferences through the provided link.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニングアップデート", "title_en": "Evening Update", "summary_ja": "ストレーツタイムズのイブニングアップデートニュースレターは、読者に日々のニュース要約とキュレーションされたコンテンツを提供しています。購読者はニュースレターの設定を管理し、ストレーツタイムズの追加の無料ニュースレターに登録できます。", "summary_en": "The Straits Times Evening Update newsletter provides readers with daily news briefings and curated content. Subscribers can manage their newsletter preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズが主要なニュース展開について読者に最新情報を提供するための日刊朝刊ニュースレターを配信しています。ストレーツ・タイムズプラットフォームを通じて定期的なアップデートを受け取り、ニュースレターの設定を管理できます。", "summary_en": "The Straits Times delivers its daily morning briefing newsletter to keep readers informed on key news developments. Subscribe to receive regular updates and manage your newsletter preferences through The Straits Times platform.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハサン・ピカー、ハマス、反シオニズム、そしてアメリカ人のイスラエル離れについて語る", "title_en": "Hasan Piker on Hamas, anti-Zionism and American disenchantment with Israel", "summary_ja": "ストリーマーのハサン・ピカーがハアレツのインタビューで、ハマスと反シオニズムに関する彼の物議を醸す見解について論じている。彼はイスラエルに対するアメリカ人の懐疑心の高まりと、イスラエル・パレスチナ紛争に関する彼の率直な立場に対する反発に対処している。", "summary_en": "Streamer Hasan Piker discusses his controversial views on Hamas and anti-Zionism in an interview with Haaretz. He addresses growing American skepticism toward Israel and the backlash he faces for his outspoken positions on the Israeli-Palestinian conflict.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilwJBVV95cUxOSk1WYjdDQXdWUjhOcl9BUFJVaEhkQk84MlVmcWRGRWJDdFlQek9RcjQ5OHREbWJkZDJMaUhqdzJ0aUM5YmRsMnI3NFdrZXVPYW5jZU9TdG5SOW9FYlVSRUhlMjhzX1VFWGpoc3V4dk1vLV93NkRfVkk3c1VBc1VORDJKR3JEdnRTS0dJS2dmenpYcVdoOUh1ZzdpQnIyWERMRTYzUWo2UC14SzlBYXNVNGtVdktQaTc1YUllODZmeHg5YXFlQmFaaElZM2xLRHl6X2g2blV5b0hPcXpaeDNnZnVPdExxMzlZLXQ4cl9QZVNlaXV1SlozNm5oQ05WYnhaQW9iYXNVcWdNbVdMVWJGNWJham9aQzQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、宇宙兵器『神の杖』の開発を追求", "title_en": "Israel Pursues 'Rods From God' Space Weapon Technology", "summary_ja": "イスラエルが軌道上のプラットフォームから発射されるタングステン製投射体を使用した運動兵器システムの開発を進めているとされている。このプロジェクトは『神の杖』として知られるキネティック爆撃技術を含み、軍事能力の大幅な強化を示している。", "summary_en": "Israel is reportedly developing advanced space-based weapon systems, including kinetic bombardment technology known as 'Rods from God.' The project represents a significant escalation in military capabilities, utilizing tungsten projectiles delivered from orbital platforms for precision strikes.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiqAJBVV95cUxObXktRlJpN0NDWm4wemRrVjR2SjdEUEFSNlFRTVVPVjJRMUdKUXpBQVlNR0J3aVlyY19mQ29FU1gxblpjNHVzVlFNZ0pxSHg3TXUzSklZQ3dBZ1ZHZW1aWHoyR0pDRUdsVkhSZW9ZVmQ1R3JLcmFpNzY1cHBhdkt0WE94ZS11bHE0azU3dG51VXpZZTNtVGJlNEhKSmFsQXhGRWZWcUVzall2amktaGtoZkUzc0F5d1VFdjJLblBpdGI5QjRVQjRmVGlTVXM1RERTNGh4SkZheTFOUnJFR0JHU3RYQXQ2MjNkU2Q1MUpTQl84MnlnWGdDWmVSb1Y4RFZWMVlmNVBaWGZrVkpXX1JGb3ZqOXd1aWxCU0czQUYyeDJ3TU9WM2laTA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル警察、エルサレムの最後のUNRWA施設を強制捜査", "title_en": "Israeli Police Raid Last UNRWA Facility in Jerusalem", "summary_ja": "イスラエル警察がエルサレムで稼働する最後の国連パレスチナ難民救済事業機関(UNRWA)の施設に対して大規模な強制捜査を実施した。この作戦は同地域におけるUNRWAの活動をめぐる緊張の大幅な エスカレーションを示している。", "summary_en": "Israeli police conducted a major raid on the final remaining United Nations Relief and Works Agency (UNRWA) facility operating in Jerusalem. The operation marks a significant escalation in tensions surrounding UNRWA's operations in the region.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijwJBVV95cUxQbzJUYVNYQUxYTGxVN3ZjN0Y2RXJnOWZHTmxHRXdCdDJINktGZ3U3c0hTS1hWR2Vna3d2NldXZUdHQWJzRjg4SmRydG9qWVp1eDZWUk1JMzkxS0RSTmprV25sd2JOa1BQLXNlekt4YVFaN0lEXzBaMTJyZGN4cEJTZ3dLbGcxS3RRRG5vTTE5cjNZaEZfRURPWUxuZzRMT3hwaVBZbDg1dEpNaGljQnhKc1ZVNTNSa0l3ZGs4bEc2Rzc0UUtmLWNVNDRKV1BkSnNIVnhhYUNRczZ3MmgxYXBPNThaNDA5OHJPQ1hQQlhybTRDOTZxMnB5d004c1dJeVVRakZYdE5XOW5GR3ZBMnhZ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国への違法なNvidiaサーバー輸出で8人が起訴", "title_en": "Eight Indicted for Illegal Nvidia Server Exports to China", "summary_ja": "米国の輸出規制に違反して中国にNvidiaサーバーを違法に輸出したとして8人が起訴されました。同事件は地政学的緊張の中で中国への先端技術制裁を執行する米国の継続的な取り組みを浮き彫りにしています。被告らは高度な演算機器の販売制限を回避していたとされています。", "summary_en": "Eight individuals have been indicted for illegally exporting Nvidia servers to China, violating U.S. export control regulations. The case highlights ongoing efforts to enforce technology sanctions against China amid geopolitical tensions. The defendants allegedly circumvented restrictions on advanced computing equipment sales.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1VbWhuX25RbTUyZlJOb2dJUE1aUzItU2NzUFhSNGdtbkszMlI1QlNKYkE5QmNhVWpjNDl5anhlcnJ2LUNhX0ZFR3IwNll6RHdoak5VZFp3?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "最初の2機のF-16V戦闘機が台湾に向けて移送中", "title_en": "First Two F-16V Fighter Jets En Route to Taiwan", "summary_ja": "Focus Taiwan の報道によると、台湾が発注した F-16V 戦闘機の最初の2機が台湾に向けて移送中であるとのことです。この最新鋭航空機は、地域の緊張の中での台湾の防空能力の大幅な強化を示しています。この納入は台湾の軍事近代化の進展を示すものです。", "summary_en": "Taiwan is set to receive the first two of its ordered F-16V fighter jets, according to sources cited by Focus Taiwan. The advanced aircraft represent a significant enhancement to Taiwan's air defense capabilities amid ongoing regional tensions. The delivery marks progress on Taiwan's military modernization efforts.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9iLTFXZ0JxaTNsWDJ3SE1YVlFjbHZfdUtZZzJXempfUlA0RVFkN0VQQWRPN2FLeFdKanRpTmhFOFdmN2x4c1VJOUdfbE9UMHJndVlKSnVCaw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フォーカス台湾 - CNA英語ニュース", "title_en": "Focus Taiwan - CNA English News", "summary_ja": "フォーカス台湾は、台湾の公式通信社である中央通信社（CNA）の英語ニュースサービスです。台湾および地域の時事、政治、ビジネス、文化ニュースの包括的な報道を提供しています。", "summary_en": "Focus Taiwan is the English news service of the Central News Agency (CNA), Taiwan's official news organization. It provides comprehensive coverage of current events, politics, business, and cultural news from Taiwan and the region.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiO0FVX3lxTE9aU2ljbTc1d0Y3alZIY005T0hWTmZOTGpod3pXQU9zbm4yYjhoOXAzdy1WNGlxemk1bVU0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国高官、APEC加盟国に貿易障壁撤廃の努力強化を呼びかけ", "title_en": "Chinese Official Calls for APEC to Remove Trade Barriers", "summary_ja": "CGTNが報じたところによると、中国高官はAPEC加盟国に対し、貿易障壁の撤廃に向けた努力を強化するよう呼びかけた。この高官はアジア太平洋地域における経済協力と成長を促進するため、貿易制限の削減の重要性を強調した。CGTNが報じたところによると、この発言は地域的な貿易政策に関する議論の最中になされたという。", "summary_en": "CGTN reports that a Chinese official has called on APEC member economies to intensify efforts in dismantling trade barriers. The official emphasized the importance of reducing trade restrictions to promote economic cooperation and growth within the Asia-Pacific region. CGTN reports that the statement was made amid ongoing discussions on regional trade policies.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-22/Chinese-official-calls-for-more-APEC-efforts-to-remove-trade-barriers-1PP5Vw6qhI4/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2026年APECの中小企業閣僚会議が広州で開催予定", "title_en": "2026 APEC SME Ministerial Meeting Set for Guangzhou", "summary_ja": "CGTNが報じたところによると、第32回アジア太平洋経済協力（APEC）中小企業（SME）閣僚会議は広東省広州市で9月4日に開催される予定である。工業・情報化部（MIIT）によれば、本会議ではアジア太平洋地域のSME間のイノベーションと協力に焦点が当てられるという。", "summary_en": "CGTN reports that the 32nd Asia-Pacific Economic Cooperation (APEC) Small and Medium Enterprises (SME) Ministerial Meeting will be held on September 4 in Guangzhou, Guangdong Province. According to the Ministry of Industry and Information Technology (MIIT), the meeting will focus on innovation and cooperation among SMEs in the Asia-Pacific region.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-24/2026-APEC-SME-ministerial-meeting-to-focus-on-innovation-cooperation-1PSkCyrJME8/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国がイランに「経済的D-Day」を脅迫、湾岸石油輸出停止の脅威に直面", "title_en": "US threatens 'economic D-Day' against Iran as tensions escalate over Gulf oil", "summary_ja": "CGTNが報じるところによると、米国はイランに対して『これまでに集結された最大の金融攻撃』と称する経告を脅迫し、月曜日にイランの貿易相手国を対象とした経済制裁の実施を準備している。イランは湾岸石油輸出の停止で対抗すると脅迫している。緊張の高まりは中東の広範な懸念の中で米国とイランの関係が深刻化していることを反映している。", "summary_en": "CGTN reports that the US has threatened Iran with what it describes as 'the greatest financial offensive ever marshalled,' preparing to implement economic sanctions targeting Iran's trade partners on Monday. The move comes as Iran has threatened to halt Gulf oil exports in response. The escalating tensions reflect deepening US-Iran relations amid broader Middle Eastern concerns.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-24/US-vows-economic-D-Day-as-Iran-threatens-to-halt-Gulf-oil-exports-1PRAVYAsym4/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スウェーデン、セキュリティ脅威を理由にロシア人所有地の没収を検討", "title_en": "Sweden seeks to expropriate Russian-owned property near military base", "summary_ja": "TASSが報じたところによると、スウェーデンはセキュリティ上の懸念を理由に、ロシア国籍者が所有する不動産の没収を検討している。同報道によれば、この物件はムスコー島のスウェーデン軍事基地近くに位置している。この動きは、広範な地政学的紛争の中でのスウェーデンとロシア間の緊張の高まりを反映している。", "summary_en": "TASS reports that Sweden wants to expropriate a plot of real estate belonging to a Russian national, citing alleged security concerns. The property is reportedly located near a Swedish military base on the island of Musko. The move reflects heightened tensions between Sweden and Russia amid broader geopolitical disputes.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2177669", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナのDPR攻撃で民間人1人死亡、7人負傷", "title_en": "One civilian killed, seven wounded in Ukraine attacks on DPR", "summary_ja": "タス通信は、ドネツク人民共和国へのウクライナ攻撃により民間人1人が死亡、7人が負傷したと報じています。同国営メディアによると、攻撃により住宅3棟、民間インフラ施設6カ所、バス1台、トラック8台が被害を受けたとのことです。", "summary_en": "TASS reports that one civilian was killed and seven wounded in Ukraine's attacks on the Donetsk People's Republic during the day. According to the state source, the attacks damaged three dwelling houses, six civilian infrastructure facilities, a bus, and eight trucks.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2177667", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ブレント原油が8月中旬以来初めて1バレル87ドル下回る", "title_en": "Brent Crude Falls Below $87/barrel, First Time Since Mid-August", "summary_ja": "TASSは、ブレント原油がICE取引所で8月14日以来初めて1バレル87ドルを下回ったと報じている。9月配送のWTI原油先物は4.95%下落し、1バレル80.8ドルとなったと伝えられている。世界的な石油市場の軟調さを反映している。", "summary_en": "TASS reports that Brent crude oil has fallen below $87 per barrel on the ICE exchange for the first time since August 14. The report indicates that WTI crude oil futures with September delivery declined 4.95% to $80.8 per barrel. The decline reflects broader weakness in global oil markets.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2177665", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ケビン・ウォーシュは謝罪すべきだ", "title_en": "Kevin Warsh Owes Us an Apology", "summary_ja": "著者は新任のFRB議長ケビン・ウォーシュを、就任後数ヶ月で市場に混乱と不確実性をもたらしたとして批判している。ジャクソンホールでの講演は政策を明確にし信頼を回復する機会だが、状況をさらに悪化させるリスクもあると指摘している。", "summary_en": "The author criticizes newly appointed Federal Reserve Chair Kevin Warsh for creating market confusion and uncertainty in his first months in office. The piece suggests that Warsh should use his Jackson Hole symposium speech as an opportunity to clarify policy and restore confidence, or risk making the situation worse.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/kevin-warsh-first-jackson-hole-backdrop-of-policy-uncertainty-and-confusion-by-marco-buti-and-marcello-messori-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Kevin Warsh Owes Us an Apology\nand\nAfter only a few months in office, the chair of the US Federal Reserve has left market participants disoriented and confused. His first address to the annual monetary-policy symposium in Jackson Hole is an opportunity to set things aright—or to make matters even worse.\nFLORENCE—“Dear participants, I would like to apologize for the uncertainty I have created.” That is how Kevin Warsh, the recently installed chair of the US Federal Reserve, should begin his remarks at this year’s central-banking symposium in Jackson Hole, Wyoming.", "translation_ja": "", "vocab": [{"word": "disoriented", "definition": "方向感覚を失った、混乱した状態。ここでは市場参加者が政策の方向性を理解できず困惑している状況を表す。"}, {"word": "symposium", "definition": "学術的なテーマで専門家が集まる会議やセミナー。金融政策に関する重要な意見交換の場。"}, {"word": "monetary-policy", "definition": "中央銀行が行う金利調整や通貨供給量の管理などの経済政策。経済に大きな影響を与える政策決定。"}, {"word": "chair", "definition": "組織や委員会の最高責任者、議長。ここではFRBの最高指導者としての地位を指す。"}, {"word": "recently installed", "definition": "最近就任した、最近配置された。新しく役職に就いた状態を表すフレーズ。"}, {"word": "remarks", "definition": "公式な場での意見表明や発言。政策担当者による重要なコメントや声明。"}]}, {"title_ja": "トランプ財務省はパニック状態か？", "title_en": "Is the Trump Treasury Panicking?", "summary_ja": "著者は、GDP比6%近い連邦赤字と40兆ドルを超える国債に直面するトランプ財務省がパニックの兆候を示している可能性があると主張している。財務長官スコット・ベセントは、根本的な財政問題に対処するのではなく、債券市場を操作しようとしているようであり、信頼性を損なう可能性がある。世界最大の債務国である米国に対して、世界的な長期金利の上昇が経済的な圧力を生じさせている。", "summary_en": "The author argues that the Trump Treasury, facing a federal deficit near 6% of GDP and national debt exceeding $40 trillion, may be showing signs of panic. Rather than addressing fundamental fiscal problems, Treasury Secretary Scott Bessent appears to be attempting to manipulate the bond market, potentially damaging his credibility. The rising global long-term interest rates are creating real economic pressure on the US, the world's largest debtor.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trump-treasury-secretary-bessent-bond-market-intervention-is-backfiring-by-kenneth-rogoff-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Is the Trump Treasury Panicking?\nWith the federal deficit near 6% of GDP and the national debt surpassing $40 trillion, America’s fiscal position looks increasingly precarious. By trying to strong-arm the bond market rather than address the underlying problem, Treasury Secretary Scott Bessent may have squandered his hard-earned credibility.\nCAMBRIDGE—Are we seeing the first signs of panic in US President Donald Trump’s Treasury? The United States is by far the world’s biggest debtor, and the steady rise in global long-term interest rates—which I have long argued was inevitable—is starting to cause real pain.", "translation_ja": "", "vocab": [{"word": "precarious", "definition": "不安定で危険な状況を表す形容詞。経済や財政が危ぶまれている状態を描写する際に用いられます。"}, {"word": "strong-arm", "definition": "脅迫や圧力を使って目的を達成しようとする動詞。市場や相手に対して強制的に行動させることを意味します。"}, {"word": "credibility", "definition": "信頼性や信用度を表す名詞。人物や機関がどの程度信頼できるかを示す指標です。"}, {"word": "underlying", "definition": "表面下にある根本的な原因や問題を表す形容詞。見かけ上ではなく、本質的な問題を指します。"}, {"word": "inevitable", "definition": "避けられない、必然的なことを表す形容詞。起こることが確実であり、防ぐことができない状況を示します。"}, {"word": "bond market", "definition": "債券が取引される金融市場。政府や企業が資金調達するための市場であり、金利水準に大きな影響を与えます。"}]}, {"title_ja": "世界最古の銀行が示すEU金融統合の課題", "title_en": "Monte dei Paschi's Defensive Strategy Exposes EU Banking Integration Gaps", "summary_ja": "イタリア最古の銀行モンテ・デイ・パスキが、インテーザ・サンパオロによる306億ユーロの買収提案に対抗するため、他の2つのイタリア銀行に対する逆買収提案を実施した。著者は、このエピソードがEU政策立案者は国家銀行制度への政府の影響力を放棄させることよりも、欧州的な融資チャネルの構築を優先すべきであることを示していると主張している。", "summary_en": "Italy's oldest bank, Monte dei Paschi, launched counter-bids for two other Italian banks to fend off a €30.6 billion takeover attempt by Intesa Sanpaolo. The author argues this episode demonstrates that EU policymakers should prioritize building European financing channels rather than forcing governments to relinquish control over national banking systems.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/monte-dei-paschi-battle-shows-need-for-new-approach-to-eu-financial-integration-by-lucrezia-reichlin-2026-08", "state_media": false, "category": "オピニオン", "full_text": "What the World’s Oldest Bank Reveals About EU Financial Integration\nTo fend off an attempted takeover, Banca Monte dei Paschi di Siena has launched its own bids for two other Italian banks. The episode shows why EU policymakers should focus less on making governments surrender their influence over national banking systems and more on building a European financing channel.\nBOLOGNA—After seven hours of deliberations on August 20, the board of Banca Monte dei Paschi di Siena emerged with an extraordinary decision. Founded in 1472 and rescued by Italian taxpayers in 2017, Monte dei Paschi defended itself against Intesa Sanpaolo’s €30.6 billion ($35.7 billion) takeover bid by launching share-exchange offers for Banco BPM and Banca Generali, totaling roughly €34 billion, while distributing another €4 billion to its own shareholders.", "translation_ja": "", "vocab": [{"word": "takeover bid", "definition": "企業買収の提案。別の企業が対象企業の全部または大部分の株式を購入して支配権を得ようとする行為。"}, {"word": "share-exchange offer", "definition": "株式交換提案。買収企業が対象企業の株主に自社の株式を提供する買収方式。"}, {"word": "fend off", "definition": "防ぐ、撃退する。攻撃や要求などに対して防御する、または回避する。"}, {"word": "financial integration", "definition": "金融統合。複数の国や地域の金融市場やシステムが統一され、資本や金融サービスが自由に流動する状態。"}, {"word": "banking system", "definition": "銀行制度。銀行と金融機関から成る、国家や地域の金融システムの基盤。"}, {"word": "extraordinary decision", "definition": "異例の決定。通常と異なる、または特に注目すべき意思決定。"}, {"word": "financing channel", "definition": "融資経路。資金が流通する経路やメカニズム。特に企業や政府が資金調達するための仕組みを指す。"}]}, {"title_ja": "トランプの経済的威嚇は同盟国を代替案へ追いやる可能性がある", "title_en": "Trump's Economic Bullying May Backfire as Allies Seek Alternatives", "summary_ja": "ガーディアン紙の社説は、トランプがカナダ、イラン、中国を標的とした関税、制裁、金融強制を積極的に使用することで、米ドルと米国経済を支配的にしている信頼を損なうリスクがあると主張している。米国の経済力を繰り返し武器化し、その結果を顧みない姿勢により、トランプは他国をドル体制の代替案を模索するよう不本意ながら促す可能性がある。", "summary_en": "The Guardian editorial argues that Trump's aggressive use of tariffs, sanctions, and financial coercion—targeting Canada, Iran, and potentially China—risks undermining the trust that makes the US dollar and economy dominant globally. By repeatedly weaponizing American economic power without regard for consequences, Trump may inadvertently push other nations to seek alternatives to the US-dominated financial system.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/25/the-guardian-view-on-trumps-economic-threats-bullies-can-overplay-their-hand", "state_media": false, "category": "オピニオン", "full_text": "Three moves in the last week have exposed the limits of Donald Trump’s economic bullying. The US slapped 50% tariffs on another $20bn of Canadian goods – then threatened the same rate on the cars, trucks, parts and steel that America Inc depends on. On Monday, the Treasury secretary, Scott Bessent, menaced Iran’s trading partners with exclusion from the US financial network, hoping that coercion can deliver what months of war have not. And as the costs of war, tariffs and pro-billionaire tax cuts helped send US bond yields higher, the Treasury stepped in to tame long-term rates. These are not contradictory policies but a gamble: that US economic power can be repeatedly weaponised without reducing others’ willingness to depend on it.\nThe Trump administration’s “D-day” sanctions are potentially the most consequential because they expose the scaffolding of American financial power. While markets shrugged off the immediate threat, that calculation might change were the US to target a major Chinese refinery or bank. Such an escalation could spark a trade war with Beijing. The US has leverage. But China has pressure points – especially farmers in Republican states – that make using it costly. In the long run, there is a price to pay. Nations hold one another’s currencies partly because they trust the political relationship. Mr Trump is testing what happens when they don’t.\nThe moves to control the bond market are the most revealing. There is nothing new about Washington managing yields: the Federal Reserve has long been able to buy treasuries. What is new is Mr Bessent doing it so openly to deal with the fallout from failed policies. Mr Trump owns this: his tariffs raise input costs; his Iran war pushed up energy costs; his nonchalance about rising American grocery prices reassures no one. When that mixture helps produce higher inflation expectations and rising long-end bond yields, Mr Trump’s team steps in to prevent interest rates ticking up.\nThe US president is willing to use state power to lower borrowing costs while hiking others through tariffs, war and cuts to social programmes. Mr Bessent wants to stop rising long yields feeding into investment and Washington’s debt-interest bill. That his former mentor at George Soros’s hedge fund criticises him and wants bond markets to force spending cuts is not to be applauded. The better question for Mr Bessent is: why shield markets from the consequences of Mr Trump’s acts, but not households?\nThe trade war with Canada is economically stupid and legally dubious. In 2025, the Trump tariffs amounted to an average tax increase of $1,000 per US household. More than a quarter of Canadian exports to the US are now subject to significant tariffs or threatened with tougher ones. Ottawa’s retaliation will start in September. North American production has been organised around such trade flows and tariffs will make US manufacturing more expensive, not less.\nWhy Canada? Washington has largely given up trying to change China’s economic model. Canada is seen as a soft target. The Guardian columnist Robert Reich is surely right: Mr Trump picks on a friendly neighbour because that is what bullies do. This cannot go on. American economic power depends on other countries wanting to remain in a system the US dominates. Mr Trump thinks their dependence is his weapon. The more often he uses it against them, the harder they should look for the exit.", "translation_ja": "", "vocab": [{"word": "bullying", "definition": "弱い相手に対して力や権力を不当に使用して脅迫や強要をすること。転義的には、優位にある者が劣位にある者に対する不正な圧力を意味する。"}, {"word": "scaffolding", "definition": "建造物を支える足場を指す基本的な意味から、転義的には制度や権力構造を支える基盤や仕組みを意味する。"}, {"word": "coercion", "definition": "脅迫や強制力を使って相手に行動を強いること。政治的・経済的な文脈で、意思に反して無理矢理従わせる行為を指す。"}, {"word": "consequential", "definition": "重大な影響や結果をもたらす、重要な。事柄の影響度や重要性が大きいことを表す。"}, {"word": "nonchalance", "definition": "無関心や無頓着な態度。重要な事柄に対して冷淡または気にかけない態度を示すこと。"}, {"word": "dubious", "definition": "疑わしい、信頼できない、または疑問の余地がある。法的・道徳的な正当性が不確かであることを表す。"}]}, {"title_ja": "セックスアピールが票を獲得する―民主党が容姿を政治戦略に活用する理由", "title_en": "Sex Sells and Wins Votes – Why Democrats Are Playing the Attractiveness Game", "summary_ja": "著者アルワ・マハダウィは、民主党が意図的に身体的魅力と「スラスト・トラップ」ソーシャルメディア戦略を使ってイメージを変え、有権者にアピールしていると主張している。情報量が少ない保守派の有権者は特に候補者の容姿に影響されるという研究を引用し、この戦略は1960年のケネディ・ニクソン討論会など歴史的先例によって支持される実用的な政治戦術だと論じている。", "summary_en": "Author Arwa Mahdawi argues that Democrats are deliberately using physical attractiveness and 'thirst trap' social media content to rebrand their image and appeal to voters, citing research showing that low-information conservative voters are particularly influenced by candidates' looks. While acknowledging this strategy may seem superficial, Mahdawi contends it is a pragmatic political tactic supported by historical precedent, including the famous 1960 Kennedy-Nixon debate.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/25/sex-sells-and-wins-votes-the-democrats-know-it", "state_media": false, "category": "オピニオン", "full_text": "Despite being a card-carrying member of the International Order of Confirmed Homosexuals, I have spent quite a lot of time lately thinking about Abdul El-Sayed’s biceps. I mean, have you seen them? The progressive Michigan senate nominee is jacked and he knows it. He almost always wears a tight black T-shirt to show off his muscles and incorporates a lot of fitness content in his campaign.\nI’m not the only one who has noticed El-Sayed’s prominent muscles. They have had a lot of coverage, and are seen as part of a wider attempt to rebrand the Democratic party. Which, I don’t need to tell you, has a serious image problem; a poll in March found that the party is looked on even less favourably than the US Immigration and Customs Enforcement agency. So, to make it look less like a party that is full of out-of-touch technocrats who sound as if they are reading from a 500-page PowerPoint presentation every time they try to explain anything, Democrats seem to be trying to up the sex appeal.\n“Democrats enter their thirst trap era,” News website Axios recently declared, summing up the phenomenon. The piece observed that the Democrats’ main TikTok page has given “the thirst trap treatment” to big names including El-Sayed, Zohran Mamdani and senator Jon Ossoff (“nicknamed ‘Senator My Boo’ by internet fans”), by posting flirty photos and videos. Axios quotes a political analyst who explains that while female Democrats such as Alexandria Ocasio-Cortez have had their share of screen time, the Dems’ TikTok page has made a “very intentional choice to feature the most attractive male members”.\nFox News would appear to reluctantly agree with the assessment that Democrats are leaning into good looks to win the midterms. “El-Sayed is out in these tight T-shirts,” Fox News host Ainsley Earhardt said in a discussion last week. “AOC with her pretty smile. She’s beautiful. She’s got the red lipstick. You have Mamdani, always smiling … It doesn’t make their philosophy any less dangerous, right?… even with a tight T-shirt, it’s still socialism and it fails.”\nOver on CNN there was a little more jubilation about the Democrats’ vibe shift. “Dems are hot again,” strategist Yemisi Egbewole proclaimed. “They’re coming out of the closet as hot people and I’m so excited.” Egbewole added that it wasn’t just about physical attractiveness: “I think they’re learning from Trump. Entertainment really sells.”\nSex sells too: it’s well established that voters around the world prefer good-looking candidates. But, while we may all be shallow deep down, some of us are shallower than others. A 2016 study found that rightwing politicians in Europe, the US and Australia tended to be more attractive than their progressive counterparts. That’s partly because “low-information” conservative voters are particularly prone to choosing attractive candidates. “In low-information city elections, a beauty increase of one standard deviation attracts about 20% more votes for the average candidate on the right and about 8% more votes for the average candidate on the left,” an analysis of the study by the Washington Post noted. Which raises the question: if looks really are so important to low-information rightwing voters, how did we end up with Donald Trump as president? (Woke 1.0 is over, haven’t you heard? It’s OK to say things like this now.)\nSocial media may have brought a new visual element to politics, but the most famous anecdote about how looks can sway an election is almost 70 years old. In September 1960, 70 million Americans watched Richard Nixon debate John F Kennedy in the first nationally televised debate between presidential candidates. Nixon had been the favourite going in but he had just been in hospital for a couple of weeks and looked terrible. JFK, on the other hand, was tanned and rested and had good stage makeup.\nYou can quibble with the conventional wisdom that Nixon lost that election on looks, but it certainly played a part. In his memoir, Nixon
