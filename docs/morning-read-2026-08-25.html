wrote: “What hurt me the most in the first debate was not the substance of the encounter between Kennedy and me, but the disadvantageous contrast in our appearances. After the program ended, callers, including my mother, wanted to know if anything was wrong, because I did not look well.”\nIn short: if thirst traps are what it takes to get the US on a better path, then so be it. Jacked candidates in tight T-shirts may seem like a cheap trick, but even Nixon’s mother would agree that it’s a sound political strategy.\nArwa Mahdawi is a Guardian columnist\n- \n  Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here.", "translation_ja": "", "vocab": [{"word": "technocrat", "definition": "官僚的で専門的な知識を持つ政治家・管理職のこと。実際の人々の関心や感情から遠ざかっているという否定的なニュアンスで使われることが多い。"}, {"word": "thirst trap", "definition": "ソーシャルメディアに投稿された、見る人の注目や好意を意図的に集める写真や動画。英語のスラング表現で、特に魅力的な容姿を際立たせるコンテンツを指す。"}, {"word": "vibe shift", "definition": "社会や文化の雰囲気や感情の大きな変化を指す。この場合、民主党のイメージが変わることを意味する。"}, {"word": "pragmatic", "definition": "現実的で実用的なアプローチを指す。理想や原則より実際の効果や結果を重視することを意味する。"}, {"word": "precedent", "definition": "過去に起きた事例やそれに基づく先例のこと。将来の同様の事象を正当化するために引用される。"}]}, {"title_ja": "シュナイアーとラフィ：AIはまだ数学を終わらせない", "title_en": "AI Won't End Mathematics Yet, Say Schneier and Rafi", "summary_ja": "AIは単位距離予想の反例発見など印象的な数学的成果を達成しているが、著者らはこれらが既存技術を組み合わせたもので新しい理論的枠組みを必要としないと主張している。現在のAIシステムは既存の考え方の検索と再組み合わせに優れているが、完全に新しい数学理論を開発するために必要な深い概念的創造性に欠けており、この限界は長続きしないかもしれない。", "summary_en": "While AI has achieved impressive mathematical results like disproving the unit distance conjecture, the authors argue these represent relatively low-hanging fruit requiring existing techniques rather than new theoretical frameworks. Current AI systems excel at searching and recombining ideas but lack the deep conceptual creativity needed to develop entirely new mathematical theories, though this limitation may not persist long.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/25/ai-mathematics-careers", "state_media": false, "category": "オピニオン", "full_text": "Earlier this month, about 40 top mathematicians gathered at OpenAI’s offices to discuss the future of their profession. The meeting was off-the-record, but if recent articles by mathematicians are any guide, it was mostly pretty glum. People fear for their jobs, their careers and the work they love.\nWe think the contrary view is more likely, at least in the short-term. AI models are nowhere near as capable as experienced academic mathematicians.\nThis isn’t to say that AIs aren’t producing stunning mathematical results at the level of PhD researchers. In mid-May, OpenAI announced that its frontier AI model disproved the unit distance conjecture, a famous 80-year-old problem in discrete geometry. In July, Anthropic’s published two AI-derived results in academic cryptanalysis. Earlier this month, OpenAI published 10 new mathematical results from its latest AI model. And Anthropic published Claude’s attempt to prove the century-and-a-half-old Riemann hypothesis.\nThese results are both a vivid demonstration of the amazing capabilities of frontier AI in 2026 and an illustration of their limitations. In general, these AI-powered advances in mathematics fall into one of two categories. Some are counterexamples to mathematical statements that people had been trying to prove. Others are novel applications of known techniques to existing problems that human experts either did not know or did not think of using.\nThe counterexample to the Jacobian conjecture is the most notable example of the first kind. Once it had been found, checking it was quick and straightforward. The difficult part was finding it among a large number of possibilities. The AI seems to have combined some sort of intuition acquired through machine learning with extensive computational search, in order to find the right example.\nAn example of the second kind is the unit-distance conjecture. It was motivated by an elegant construction, and most mathematicians expected it to be essentially optimal – so they generally tried to prove rather than disprove it. The counterexample brings in ideas from elsewhere in mathematics: algebraic number theory. If an expert with that background deliberately set out to find a counterexample, they would probably have succeeded. But there was no reason for someone with precisely that expertise to focus on this problem. Because of its scope, AIs don’t have those same limitations.\nThese results are relatively low-hanging fruit for AI; none of them required developing an extensive new theory. This does not make the discoveries trivial, or the AI’s achievements less impressive. Choosing the right direction, and recognizing an unexpected connection between subjects, are themselves forms of creativity. They are the same sorts of capabilities that led to AIs playing the game of Go at the grandmaster level, or doing Nobel-prize level chemistry in the area of protein folding.\nWhat we have not yet seen is an AI developing a substantial new conceptual framework in order to solve a mathematical problem. Much of mathematics proceeds by identifying the objects that are truly central to a question and then developing a theory that helps us understand them. Current AIs are very strong at searching and recombining existing ideas, but they are weak at building any deep and sustained new theory.\nThis speaks to a more general limitation of current AI systems. They are creative in the sense that they can recombine existing ideas in novel ways. But they are not creative in others: they have not yet developed conceptually new theories or structures. And while they have larger working memories than humans do, know more about more different things than any particular human does, and can process information faster than humans, can, true novelty is still largely beyond their reach.\nOf course, that distinction may not survive for very long. Predictions are notoriously hard, especially about the future of AI. None of these mathematical capabilities were explicitly designed for, or palled. They’re all emergent properties of increasingly capable AI models. We are both confident that someday we will see AI models that are capable of the type of creativity required to do novel mathematics. Will that be in a few months, a few years or a few decades? Of course we don’t know, but our guess is sooner rather than later.\n- \n  Bruce Schneier is a security technologist who teaches at the Harvard Kennedy School at Harvard University and University of Toronto’s Munk School\n- \n  Kasra Rafi is a professor of mathematics at the University of Toronto", "translation_ja": "", "vocab": [{"word": "conjecture", "definition": "証明されていない数学的仮説のこと。未証明だが真実であると予想される命題を指します。"}, {"word": "counterexample", "definition": "ある命題が偽であることを示すための例。数学では仮説を反駁するために使用されます。"}, {"word": "conceptual framework", "definition": "複雑な問題を理解・分析するための基本的な概念や原理の体系。理論的な基盤を意味します。"}, {"word": "emergent properties", "definition": "個々の要素から予測できない、システム全体から現れる新しい特性。設計されていないのに自然に発生する性質です。"}, {"word": "low-hanging fruit", "definition": "最小限の努力で達成できる目標や成果。容易に得られるが重要性は限定的な成果を指します。"}, {"word": "sustained", "definition": "継続的な、長く続く。一時的ではなく持続性のある状態や活動を表現します。"}]}, {"title_ja": "イランへの最大圧力戦略は失敗する", "title_en": "Maximum Pressure on Iran Will Fail", "summary_ja": "著者は、トランプ大統領のイランに対する軍事的・経済的圧力キャンペーンが、決定的な転換ではなく47年間の根本的に欠陥のあるアメリカの戦略の継続であると主張している。戦争はイランを軍事的に弱体化させた一方で、逆に国内での政権の立場を強化し、アメリカの信用を著しく損ない、将来のいかなる政権にとっても従来の圧力戦術を無効にしてしまったと述べている。", "summary_en": "The author argues that Trump's military and economic pressure campaign against Iran represents a continuation of a fundamentally flawed 47-year U.S. strategy rather than a decisive break from it. While the war has weakened Iran militarily, it has paradoxically strengthened the regime domestically and severely damaged U.S. credibility, making traditional pressure tactics ineffective for any future administration.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/maximum-pressure-iran-will-fail", "state_media": false, "category": "オピニオン", "full_text": "For 47 years, the Islamic Republic has bedeviled U.S. presidents. The 1979 Iran hostage crisis helped doom Jimmy Carter’s reelection bid. The Iran-contra scandal in the mid-1980s badly tarnished Ronald Reagan’s foreign policy record. And Barack Obama’s 2015 nuclear deal with Iran, the Joint Comprehensive Plan of Action (JCPOA), led to an unprecedented situation in which the U.S. Congress invited a foreign leader, Israeli Prime Minister Benjamin Netanyahu, to Washington to argue against it.\nIn February, when he launched his war against Iran, President Donald Trump declared that he intended to break this embarrassing pattern once and for all. By crushing Iran militarily and effecting regime change, he boasted that whereas other presidents had only talked about the Iranian threat, he was taking decisive action to end it. But six months later, Trump has become yet another U.S. president facing a dangerous humiliation related to Iran; the fallout from his excursion threatens his party’s prospects in the midterm elections. Now, perhaps in desperation, Trump is attempting to squeeze Tehran with an economic noose. But as it is constructed, this economic-pressure operation poses a greater threat to U.S. credibility than it does to Iran’s economy.\nIn truth, the multifaceted war Trump has launched is not a break with precedent but the apotheosis of the same flawed strategy that has undergirded U.S. policy toward Iran from the Islamic Republic’s inception, in 1979. Iran’s theocratic regime has continually flummoxed U.S. administrations in part because it contains profound contradictions. It is simultaneously ideological and transactional. Tehran continues to adhere to the core features of its revolutionary ideology, including its anti-American and anti-Israeli foreign policy, but can also act with pragmatism when circumstances demand it. Iran accepted meaningful limits on its nuclear program in 2015, for instance, and reversed decades of hostility toward Saudi Arabia by normalizing ties in 2023. Iran’s relationship to the U.S. national interest is confusing, too. The regime does pose a direct threat to the United States because of its illicit nuclear program. And long before the current war began, the terrorism and proxy militias Iran funded were menacing U.S. citizens and shipping through the Red Sea. Yet for most Americans, Iran remains a distant afterthought. A war that has extensively destroyed Iranian infrastructure, distorted the country’s economy, and killed an entire echelon of leaders, as well as thousands of soldiers and civilians, has had almost no impact on the United States other than driving up gas prices.\nTo address these dualities, Washington has often stripped nuance from policymaking and oriented U.S. strategy around pressure as the primary tool to contain Iran and compel it to behave differently. This pressure strategy has rested on two pillars: establishing a credible military threat and engaging in economic coercion. But instead of resolving the perplexing paradoxes posed by the Islamic Republic, this approach only deepened them—especially as Trump has sought to intensify the pressure strategy. A wave of domestic protests in January showed that Iran is internally combustible, but the war proved that the Islamic Republic is resilient and will not capitulate. Airstrikes have weakened the regime militarily but strengthened its standing internally. Iran acknowledges that it needs sanctions relief, but it is also learning that time is on its side and that, by controlling the Strait of Hormuz, it can impose reciprocal consequences for pressure.\nThe irony of Trump’s failed war on Iran—and his stop-start negotiations to try to end it—is that it has so severely weakened Washington’s ability to exert pressure on Tehran that no future administration will ever be able to revert to the traditional U.S. playbook. But that could also be the only upside of a war that has already exacted a heavy toll on U.S. munitions and the global economy. The war could—and should—force a broader reckoning with 47 years of failed strategy and change Washington’s approach for good.\nOUR WAY OR THE HIGHWAY\nIn 2006, former U.S. Secretary of State Henry Kissinger wrote in The Washington Post that Iran’s leaders must “decide whether they are representing a nation or a cause.” He argued that Iran must choose between prioritizing stability and the well-being of its people—by engaging rationally with other states—or continuing to be driven by the revolutionary and ideological ambitions that defined the 1979 Iranian Revolution. This idea reflected U.S. policy toward Iran over the better part of 50 years. Washington wants Iran to abandon its revolutionary origins and aimed U.S. policy toward compelling that outcome. It has continually attempted to contain Iran’s influence and get Tehran to behave rationally using a mix of a few carrots and a lot of sticks; the biggest stick was the threat of a U.S. invasion.\nTehran itself has not seen a nee", "translation_ja": "", "vocab": [{"word": "apotheosis", "definition": "ある傾向や戦略の最高潮や最終形態を指す。ここでは、イランに対する圧力戦略が歴史的に繰り返されてきた同じ失敗した方針の最も極端な形態であることを意味する。"}, {"word": "theocratic", "definition": "宗教的指導者が支配する政治体制を形容する。イランのようにイスラム教の宗教指導者が国家権力を握っている体制を説明する際に使用される。"}, {"word": "coercion", "definition": "脅迫や強制によって相手を従わせる行為。ここではアメリカの経済制裁や軍事的脅威を通じたイランへの政治的圧力を指す。"}, {"word": "reciprocal", "definition": "相互的な、互いに同等の。ここでは、イランがアメリカの圧力に対して同等の対抗措置を講じることを意味する。"}, {"word": "reckoning", "definition": "過去の政策や行動を評価し、その結果に直面すること。ここでは47年間のイラン戦略の失敗を認識し、根本的に見直す必要があることを指す。"}, {"word": "combustible", "definition": "燃えやすい性質を持つ。比喩的には、社会的緊張が高まり爆発的な状況になりやすい状態を表す。"}]}, {"title_ja": "トランプ後の新右翼の大戦略", "title_en": "The New Right's Grand Strategy After Trump", "summary_ja": "トランプ政権の外交政策は、西洋文明を普遍的な自由主義原則ではなく、地理的領域、共有される祖先、キリスト教によって定義する新右翼イデオロギー「文明主義」によってますます形作られている。この新しい大戦略は、世界を地域的覇権国によって支配される文明圏に構造化することを目指し、自由主義的国際主義の普遍的野心と抑制学説の限定的介入の両方を拒否している。現在の政策は純粋な文明主義から外れているが、人口動態の傾向と中東介入への反対により、新右翼は共和党の外交政策議論においてより大きな影響力を得る立場にある。", "summary_en": "The Trump administration's foreign policy is increasingly shaped by 'civilizationism,' a New Right ideology that defines Western civilization by geographic territory, shared ancestry, and Christianity rather than universal liberal principles. This new grand strategy aims to structure the world into bounded civilizational spheres with regional hegemons, rejecting both liberal internationalism's universal ambitions and restraint doctrine's limited intervention. Although current policy diverges from pure civilizationism, demographic trends and opposition to Middle East interventions position the New Right to gain greater influence in Republican foreign policy debates.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/new-rights-grand-strategy-after-trump", "state_media": false, "category": "オピニオン", "full_text": "The debate about American grand strategy has long been shaped by familiar schools of thought: restraint, liberal internationalism, and primacy. But the intellectual movement that provided the ideological fuel for U.S. President Donald Trump’s rise to power, the New Right, is forging a new contender: call it “civilizationism.” References to Western civilization permeate strategy documents and speeches by key members of the administration. Vice President JD Vance set the tone in his February 2025 speech at the Munich Security Conference, stressing the “threat from within” to the fundamental values that characterize “our shared civilization.” The Trump administration’s National Security Strategy warned of “civilizational erasure.” This January, at Davos, Trump emphasized “the bonds we share with Europe as a civilization”; the next month, Secretary of State Marco Rubio called on the United States’ transatlantic partners to “renew the greatest civilization in human history.”\nThe notion that there is a Western civilization and that it is superior is, of course, not new. But the concept of the West espoused by the New Right—and how that concept ought to guide U.S. grand strategy—is fundamentally different from how most had previously understood it. It is not based on a creedal understanding of Western identity as rooted in a shared set of principles that anyone, regardless of origin, can espouse, such as constitutional democracy, liberty, and equality. Instead, for thinkers on the New Right, the West is defined by a specific geographic territory, a shared ancestry, and Christianity.\nExtended to the realm of foreign policy, this reimagination of the foundations of Western civilization demands a new and distinct grand strategy. Civilizationism is still a work in progress. Writings on foreign policy by New Right thinkers are limited, and the camp is internally divided. But by examining those texts and following the movement’s domestic ideas to their logical conclusion, it is possible to discern a distinct worldview. Civilizationists would aim to structure the world along bounded civilizational spaces, each dominated by a hegemon. They believe the United States is rightfully the hegemon of the West, dedicated to defending the civilization’s borders, urging Europe to uphold purported Western values, and pursuing coexistence with other civilizations, such as the Chinese, rather than aspiring to global leadership. They reject the universal ambitions of primacy and the constraints imposed on U.S. sovereignty by liberal internationalism. Civilizationism also differs from restraint, requiring dominance over the Western Hemisphere, by military intervention if necessary. And unlike realist visions that justify a great power’s control over its backyard by pointing to its legitimate security interests, civilizationism offers an ideological justification for spheres of influence and their boundaries.\nDespite the Trump administration’s embrace of civilizational rhetoric, in practice its foreign policy diverges from what civilizationism would advocate and many of Trump’s own backers hoped he would pursue. Even if Republicans win the White House again in 2028, that would not mean civilizationism will become U.S. grand strategy; the New Right would also have to prevail over the party’s establishment faction. But at least two factors seem to favor the New Right in the intraparty battle. One is demographic: most polling shows a generational divide among Republicans, with younger voters more supportive of positions such as scaling back the U.S. role in the Middle East and retreating from viewing China as a major threat. The other is Trump’s war on Iran. As the consequences of this strategically catastrophic campaign become ever more apparent, the New Right’s clout is set to grow, having opposed the war from the start.\nA NEW BLOB IN TOWN\nFor decades, Washington’s foreign policy establishment advocated for different varieties of liberal hegemony. Even during Trump’s first term, traditional foreign policy elites exercised great influence and maintained relative policy continuity abroad. But Trump’s second term has fundamentally disrupted the intellectual consensus that long governed foreign policy debates, bringing the New Right into the discussions that shape U.S. strategy. This movement is composed of various factions, as Laura Field has distilled in her authoritative work Furious Minds. The postliberals want to enforce a Catholic conception of the common good and morality. Idolizing the American founding, the Claremonters propose radical, counterrevolutionary action to restore government by consent, shatter the administrative state, and cultivate civic virtue. The national conservatives embrace Christian nationalism and seek to bulwark the homogeneous nation-state from threats from liberalism.\nWhat unites these disparate camps is a rejection of core tenets of traditional conservatism, such as limited government, neoliberal economics, a", "translation_ja": "", "vocab": [{"word": "civilizationism", "definition": "西洋文明を共有の地理的領域、祖先、宗教的信仰に基づいて定義し、世界を文明圏に分割して統治する外交戦略。普遍的な自由主義原則よりも文明的アイデンティティを強調する理論。"}, {"word": "hegemony", "definition": "特定の地域や国際システムにおける一国の支配的な影響力と優位性。経済的、政治的、軍事的な支配力を含む。"}, {"word": "creedal", "definition": "特定の信仰体系や原則的な信条に基づいた。普遍的な価値観や理想に根ざしたアイデンティティを指す場合に使用。"}, {"word": "spheres of influence", "definition": "大国が政治的・経済的支配を行使する地理的領域。特定の国家が他国に対して強い影響力を持つエリア。"}, {"word": "liberal internationalism", "definition": "民主主義、自由、平等などの普遍的価値観に基づいて国際秩序を構築し、世界的な制度や法による統治を推進する外交思想。"}, {"word": "intellectual consensus", "definition": "知識人や専門家の間で広く受け入れられている共通の見解や理論。学問的または政策的領域での主流の考え。"}, {"word": "intraparty", "definition": "政党内部での。同じ政党に属する異なる派閥やグループ間での対立や競争を指す。"}]}, {"title_ja": "タイの長期膠着状態の終焉か？", "title_en": "The End of Thailand's Long Stalemate?", "summary_ja": "タイの25年間に及ぶ王制派保守派と民主主義野党の政治的闘争は、2026年の選挙でブムジャイタイ党が確立派の支援を受けて予想外の勝利を収めたことで転換した。この以前は周辺的だった政党の台頭は、中立的な国家機関を通じて権力を統合する保守派の綿密な努力を示しており、タイ政治を今後数年間にわたって再形成する可能性がある。しかし、進歩的勢力を抑制する現在の成功にもかかわらず、この同盟は脆弱である可能性がある。", "summary_en": "Thailand's 25-year political struggle between royalist conservatives and democratic opposition has shifted following Bhumjaithai's surprising 2026 election victory with establishment backing. The rise of this previously marginal party represents a methodical conservative effort to consolidate power through neutral state institutions, potentially reshaping Thai politics for years. However, this alliance may prove fragile despite its current success in suppressing progressive forces.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/thailand/end-thailands-long-stalemate", "state_media": false, "category": "オピニオン", "full_text": "For more than 25 years, Thailand’s conservative establishment and opposition forces have been locked in a struggle for the soul of the country. Royalists want palace institutions insulated from public criticism, a military licensed to intervene in times of political crisis, deferential political parties and politicians, and free rein to clamp down on political actors who fail to toe the line. The opposition calls for a constitutional monarchy, a military that stays in the barracks, a competitive party system responsive to the people’s wishes, and predictable checks and balances that do not unduly punish elected politicians.\nMore often than not, the royalists have had the upper hand. They have mobilized protest movements, staged military coups, and banned opposition parties to prevent troublesome politicians from instituting changes that could limit their power and privileges. Yet every attempt to strike a decisive blow against the opposition has failed. Conservatives have not translated legal or extralegal victories into lasting governments. Opposition movements, meanwhile, have consistently reinvented themselves. Thaksin Shinawatra, the larger-than-life former policeman and telecom billionaire, built up enormous power as prime minister in the early 2000s, incurring the disdain of royalists. And even after a military coup removed Thaksin from the premiership in 2006, his parties remained electoral juggernauts. A yet more alarming challenge emerged on the horizon after a 2014 coup ousted Thaksin’s sister, Yingluck Shinawatra, from government: youth-based mass protests calling for reform of the monarchy in 2020 and progressive political parties who appealed to these younger voters.\nA stalemate had prevailed over Thai politics, with neither side able to overpower the other fully. That changed in February 2026, when Bhumjaithai, a low-profile party previously known primarily for campaigning to legalize cannabis, swept into power in national elections. With the implicit backing of the monarchy and the conservative establishment, Bhumjaithai has seized control of the Thai state, giving rise to a new mode of politics capable of both suppressing progressive forces in favour of cozy collaboration among elites and winning a general election without overt manipulation.\nFar from an electoral anomaly, the rise of Bhumjaithai is the culmination of a long effort by conservatives to retake the levers of power. In fact, the formerly also-ran party’s February triumph was part of a methodical, behind-the-scenes campaign to commandeer the state’s nominally neutral apparatuses, including its Senate and Constitutional Court. The alliance between the monarchical network and Bhumjaithai is more a marriage of convenience than a shared ideological project, and it may not last indefinitely. But shallow as it may be, it has already succeeded in decisively strengthening the conservative position, disempowering the major rival parties that threaten elite control, and potentially remaking the Thai state for years to come.\nRAINBOW COALITIONS\nThe origins of Thailand’s current political order date back to 1997, when a group of elite liberal royalists, claiming a mandate from civil society, introduced a landmark new charter. Often referred to as “the people’s constitution,” it was a reaction to a disastrous military coup in 1991 and its bloody aftermath, including the deadly suppression of unarmed protesters in May 1992. The reforms aimed to coup-proof the political system by introducing checks and balances to prevent elected politicians from abusing their power and facilitate a smooth royal succession. It established an electoral commission, a constitutional court, an anticorruption agency, and a human rights commission, as well as a fully elected, purportedly nonpartisan Senate.\nThe project backfired. It failed to stabilize Thai politics—probably an unrealistic goal to begin with—and the new parliamentary system allowed for the election of Thaksin as prime minister in 2001. A charismatic figure with populist authoritarian tendencies, he successfully mobilized lower-income voters in the heavily populated north and northeast regions of Thailand, melding them into an unbeatable electoral bloc. He used his considerable personal wealth, his party’s parliamentary dominance, and his bureaucratic connections to create a startlingly successful political machine. Thaksin bought off the Senate and the independent agencies, defanging them as neutral bodies, and installed loyalists in crucial posts intended to check the prime minister’s power.\nThe country’s traditional elites were deeply threatened by Thaksin’s ascendance. The so-called Yellow Shirt movement, which appropriated a royal color, sought to make Thailand ungovernable. Through mass street protests and the occupation of public spaces and buildings, it paralyzed opposition rule three times: in 2006, 2008, and in 2013–14. But for all its success in ousting opposition-led governments, the Yellow", "translation_ja": "", "vocab": [{"word": "stalemate", "definition": "互いに勢力が拮抗して動きが取れない状態。政治や紛争において、どちらかの側も相手を完全に支配できない膠着状態を指す。"}, {"word": "implicit", "definition": "明言されていないが、文脈から明らかに示唆されていること。直接的ではなく、暗黙のうちに理解される意味や支持を表す。"}, {"word": "commandeer", "definition": "権力や権限を使って強制的に支配下に置くこと。通常は政府機関や公共の施設を自分たちの目的のために奪取することを意味する。"}, {"word": "disempower", "definition": "誰かの力や影響力を奪う、弱体化させることを意味する。政治的文脈では、野党や対抗勢力の権限を削減することを指す。"}, {"word": "coup-proof", "definition": "軍事クーデターの発生を防ぐ、または回避できるようにするための仕組みや制度。クーデターに対して耐性のある政治体制を構築することを目指す。"}, {"word": "defang", "definition": "何かの力や脅威を取り除き、危険性を失わせること。機関や制度の権限や影響力を弱める目的で使用される。"}, {"word": "ascendance", "definition": "支配的な地位や影響力の上昇。権力や優位性が増加し、より影響力のある立場に移行することを示す。"}]}];

ている。", "perspective_ja": "自国も米国の関税政策の標的となっている中国の国営メディアとして、米国の一方的保護主義を国際的孤立と結びつけて批判する明確な政治的意図が反映されている。", "state_media": true}]};
let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-25 21:13 JST";
  renderTabs();renderList();
})();
</script>
