ur research, and that its voice pipeline appears to capture and retain more than users would expect.”\nStill, there may be simpler explanations, he says, “such as diagnostics or improving speech recognition … but even those involve keeping recordings from people’s homes without meaningful consent”.\nThe smart home is listening\nThe researchers also said that the televisions scanned home networks for other devices and collected information including internal IP addresses, nearby Wi-Fi networks and location data.\nLG said scanning for nearby devices is a “standard” smart-TV function.\nDevice discovery can serve “legitimate functions” such as screen casting, media sharing and connecting smart-home products, like Amazon’s Alexa, said Anna Maria Mandalari, a lecturer in communications and networking at University College London.\nLG stated that ACR, voice recognition and interest-based advertising are all “separate features”, each requiring “explicit user opt-in consent” and each of which can be disabled through the TV’s settings.\nDepending on how device discovery is implemented, Mandalari said, a television may “obtain the names, addresses, manufacturers and types of other devices on a household network” – information that can reveal the composition of a h", "translation_ja": "", "vocab": [{"word": "nonconsensual", "definition": "同意なしに、または許可なく行われることを意味します。個人情報やデータの収集に関してよく使用される法律用語です。"}, {"word": "ambient", "definition": "周囲にある、または背景にある状態を示す形容詞です。この文脈では、テレビの周囲で発生している会話や音を指します。"}, {"word": "purport", "definition": "～であると主張する、または～のように見えるという意味の動詞です。研究者の発見や主張を紹介する際に使用されます。"}, {"word": "transcripts", "definition": "音声や会話を文字に書き起こしたもの、または記録されたデータの記録です。音声認識システムが作成する文字化されたテキストを指します。"}, {"word": "hibernation", "definition": "デバイスがスタンバイモードまたは低電力状態にあることを意味します。通常、電源は完全に切られていない状態です。"}, {"word": "disclosure", "definition": "情報を公開する、または明らかにするプロセスです。プライバシーポリシーにおいて、企業がユーザーにデータ使用について伝えることを指します。"}, {"word": "profiling", "definition": "個人のデータを収集・分析して、その人物の特性や行動パターンを推測するプロセスです。広告ターゲティングに使用されることがあります。"}]}, {"title_ja": "ペルー、米国主導の「アメリカ防衛盾」安全保障同盟に参加", "title_en": "Peru Joins US-Led 'Shield of the Americas' Security Alliance", "summary_ja": "ペルーは麻薬カルテルと越境犯罪に対抗することに焦点を当てた米国主導の地域安全保障同盟「アメリカ防衛盾」に参加しました。フジモリ大統領はマルコ・ルビオ米国務長官との会談でこの決定を発表しましたが、米国の軍事的影響とラテンアメリカの主権に関する懸念から抗議活動が起きています。", "summary_en": "Peru has joined the 'Shield of the Americas', a US-led regional security alliance focused on combating drug cartels and transnational crime in Latin America. President Keiko Fujimori announced the move during talks with US Secretary of State Marco Rubio, though the decision has sparked protests from those concerned about US military influence and Latin American sovereignty.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/10/peru-joins-us-led-shield-of-the-americas-security-alliance?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Peru joins US-led ‘Shield of the Americas’ security alliance\nThe Fujimori administration is the latest right-wing government to join the alliance, which promises a more aggressive approach against crime in the Americas.\nPeru will join the “Shield of the Americas”, a regional security alliance led by the United States that shares intelligence and cooperates in military operations against drug cartels.\nKeiko Fujimori, Peru’s recently elected right-wing leader, announced the move on Thursday after talks with US Secretary of State Marco Rubio.\nRecommended Stories\nlist of 3 items\n- list 1 of 3US forces sink vessel ‘linked to Ecuador criminal gang’\n- list 2 of 3Marco Rubio says US seeks more economic and security ties in Latin America\n- list 3 of 3US announces $45m in security funding, additional naval vessels for Ecuador\n“We appreciate this opportunity [to join the initiative], because for us, having previously had to tackle terrorism, [we] know how difficult it is to confront criminality today,” Fujimori said.\nHer government also awarded Rubio the Order of the Sun, one of the country’s highest civilian honours.\nRubio’s visit to the Peruvian capital, Lima, caps his three-day, three-country tour of South America to shore up ties between US President Donald Trump and conservative allies in the region.\nThe diplomat praised Fujimori’s decision to join the Shield of the Americas, also known as the Americas Counter Cartel Coalition (ACCC), which has advocated for greater military involvement in the fight against crime.\n“It is a shield against these threats to the sovereignty of these independent nations,” Rubio explained.\n“It is a shield against these transnational criminal groups that, in many cases, have more money and better military equipment than the state. That is unacceptable, and the only way to defeat it is to confront it forcefully.”\nFujimori, a former first lady and the daughter of former President Alberto Fujimori, was sworn into office in July after campaigning heavily on security-related issues.\nPeru is the world’s second-largest producer of cocaine, behind Colombia, and reports of crimes like extortion have spiked in recent years.\nBut Washington’s involvement in the region remains a controversial prospect, given its history of past interventions and its support of right-wing leaders accused of human rights abuses.\nAl Jazeera correspondent Teresa Bo explained that the closer cooperation has also raised concerns about the prospect of eroding Latin American sovereignty.\n“This has generated lots of fear among many people in this part of the world of what a greater influence of the United States, of what a military influence of the United States, could bring about,” she said.\nRubio attempted to tamp down those concerns during his visit, saying the US would only intervene with the permission of local authorities.\n“We’re not going to do anything that our partners don’t ask us to do,” Rubio said. “We don’t want to do less than what you ask of us, but we’re not going to do more than what you ask of us.”\nNevertheless, in Lima, protesters gathered outside the government house where Fujimori’s meeting with Rubio was taking place. Some carried signs that read, “Marco Rubio out of Peru, no to Shield of the Americas.”\n“We have said that Peru is nobody’s colony, and it is not the back garden of any country in the world,” Soledad Lozano, one of the protesters, said.\nThe Trump administration has also indicated that it would like countries like Peru distance themselves from China, which overtook the US as Peru’s primary trading partner.\nIn February, for instance, the Trump administration criticised Peru for allowing China to construct a mega-port in Chancay, warning that “cheap Chinese money costs sovereignty”.\n“China has major investments in Peru right now,” Bo explained. “It controls a port that is 80km away from Lima, and what the US is trying to do is increase its presence in the Western Hemisphere and to try to cut a bit of economic dependency that many countries in Latin America have with China.”\nPeru is critical not only to US security strategy in Latin America, but also to its economic interests. It is an important source of mineral resources, as the world’s third-largest producer of copper.\nIn January, Washington designated Peru a major non-NATO ally, and the US State Department approved a possible $1.5bn foreign military sale for work at Callao Naval Base, Peru’s main naval hub near Lima.", "translation_ja": "", "vocab": [{"word": "transnational", "definition": "国境を越えて活動する、複数の国にまたがる。この場合、麻薬カルテルなど国境を越えた犯罪組織を指します。"}, {"word": "sovereignty", "definition": "主権、国の独立した権力。ラテンアメリカ諸国が米国の影響下に置かれることへの懸念を表します。"}, {"word": "eroding", "definition": "徐々に減少または衰退させる、蝕む。ここでは国の主権が徐々に失われることを意味します。"}, {"word": "tamp down", "definition": "（懸念や反発を）鎮静化させる、抑える。ルビオが国民の懸念を落ち着かせようとしたことを表します。"}, {"word": "designated", "definition": "公式に指定する、任命する。米国がペルーを重要な同盟国として公式に認定したことを意味します。"}, {"word": "geopolitical", "definition": "地政学的な、地理と政治の関係。国の経済的・戦略的利益が地域の位置関係に影響される状況を指します。"}]}, {"title_ja": "米国・カナダの貿易紛争がインドに与える厳しい教訓", "title_en": "U.S.-Canada Trade Dispute Offers Sharp Lessons for India's Trade Strategy", "summary_ja": "何十年にもわたる経済統合と成功した貿易パートナーシップがあるにもかかわらず、米国はカナダに高い関税を課してており、近い同盟国であっても優遇的扱いに頼ることはできないことを示している。インドは貿易協定だけでは関税圧力から保護されないことを学び、米国との合意に取り組む前に長期的な利点を慎重に検討する必要があります。", "summary_en": "Despite decades of economic integration and a successful trade partnership, the U.S. has imposed steep tariffs on Canada, demonstrating that even close allies cannot rely on favorable treatment. India should learn that trade deals alone do not guarantee protection from tariff pressures, and must carefully weigh the long-term advantages before committing to agreements with the U.S.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/editorial/rude-lessons-on-the-us-canada-trade-dispute-lessons-for-india/article71451767.ece", "state_media": false, "category": "政治", "full_text": "The U.S.-Canada trade dispute has a few sharp lessons for India. The two economies have been deeply economically integrated since at least 1965, when they established free trade in automobiles and their parts. This then widened into a full-fledged free trade agreement in 1989, which was expanded into the North American Free Trade Agreement (NAFTA) about five years later. The economic integration between the U.S. and Canada has steadily continued and, by all accounts, has worked well for both economies. The target for the much smaller Canadian economy was to achieve economies of scale by producing vast amounts of a few products. According to Nobel laureate Paul Krugman, Canada accounts for 70% of the oil refined in the American Midwest, and supplies 60% of the nation’s aluminium. It also supplies nearly all the types of lumber used in U.S. residential construction. Yet, despite this long and fruitful trade partnership, their economic relationship has fallen to a new low. Canada pulled out of negotiations over a new tariff deal citing last-minute insertions by the U.S. side. The U.S. has made a similar allegation against Canada. Canada recently levied reciprocal tariffs on the U.S. of up to 50% as a reaction to the 50% tariffs that the U.S. has imposed on imports from Canada. From September 29, the U.S. will outright ban certain Canadian alcoholic spirits, some dairy goods, and motorcycles. Statements by U.S. President Donald Trump are hardly conciliatory in nature.\nThe first lesson for India lies here: if this is how the U.S. treats a next-door neighbour, alliance member, and long-standing trade partner, India should not take for granted any favourable treatment that it might receive from the U.S. The second lesson is that barrelling ahead with trade deals might not always be the best plan. Before Canada, Malaysia also backed out of a deal it had signed with the U.S. It argued that once the U.S.’s reciprocal tariff system was deemed illegal, the benefit from a trade deal no longer outweighed the costs of opening up to the U.S. Despite the success of its recent trade pacts, India should weigh the same pros and cons when it comes to the U.S., especially since a deal might not be the end of the tariff pressure. India has faced this before. Despite the February 2026 agreement of 18% tariffs on imports from India, the U.S. has forged ahead with its forced labour and excess capacity investigations that could see tariff levels exceed that limit. India has done well to insist that a deal will not be struck until its advantage over its competitors is clear. The third lesson is that this advantage can vanish even after a deal is struck.\nPublished - September 11, 2026 12:20 am IST", "translation_ja": "", "vocab": [{"word": "reciprocal", "definition": "相互の、または相手方の行動に対して同等の対抗措置を取る。貿易や外交では、一方の国が関税や制限を課した場合、相手国が同じレベルで対抗することを指します。"}, {"word": "barrelling ahead", "definition": "勢いよく前に進む、または躊躇なく先へ進むという意味の慣用表現。計画や交渉を急速に進める場合に使われます。"}, {"word": "conciliatory", "definition": "和解的な、または対立を緩和しようとする態度や発言。敵意を減らし、相手方との合意を模索する姿勢を表します。"}, {"word": "economies of scale", "definition": "規模の経済。大量生産により単位あたりのコストが低下し、効率性が向上する経済現象を指します。"}, {"word": "outweigh", "definition": "より重要であるまたはより重大である。ある要素が別の要素よりも価値や重みが大きい場合に使われます。"}, {"word": "forged ahead", "definition": "前進し続ける、または前に進み続けるという意味。特に困難や反対にもかかわらず目標に向かって進み続けることを指します。"}]}, {"title_ja": "不正疑惑の中、WHO地域事務局長が辞任", "title_en": "WHO Regional Director Resigns Amid Fraud Allegations", "summary_ja": "バングラデシュ前首相シェイク・ハシナの娘であるサイマ・ワジェドがWHO東南アジア地域事務局長を辞任した。バングラデシュの汚職委員会による詐欺・偽造罪の告発を受けた辞任で、名誉博士号を学位として虚偽表示した疑いが含まれている。WHOは10月に後任者の推薦を募集する予定である。", "summary_en": "Saima Wazed, daughter of former Bangladesh PM Sheikh Hasina, resigned as WHO regional director for Southeast Asia following member state recommendations for her termination. Her resignation comes after fraud and forgery charges filed by Bangladesh's anti-corruption commission, including allegations that she misrepresented an honorary doctorate in her application. The WHO is expected to invite nominations for her successor in October.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/saima-wazed-hasina-daughter-resigns-as-who-regional-director-fraud-allegations-bangladesh/article71450449.ece", "state_media": false, "category": "社会", "full_text": "Saima Wazed, daughter of former Bangladesh Prime Minister Sheikh Hasina, resigned as the World Health Organisation’s (WHO) regional director for Southeast Asia. The resignation, according to sources, comes after member states recommended the termination of her appointment, bringing her five-year term to an early end. Ms. Saima Wazed’s tenure was marked by fraud-related investigations by both the WHO and Bangladeshi authorities.\nMs. Wazed’s resignation takes effect immediately. The WHO is expected to invite nominations for her successor in October. The Southeast Asia Region comprises 10 member states, including India and Bangladesh.\nMs. Wazed was placed on leave in 2025 after Bangladesh’s anti-corruption commission filed fraud and forgery charges against her. The charges included an allegation that she had presented an honorary doctorate as an academic qualification in her application for the regional director’s post. She has rejected the charges as politically motivated.\nThe action against Ms. Wazed came amid a sharp deterioration in relations between her family and the government that replaced Ms. Hasina after she left Bangladesh for India on August 5, 2024, following mass protests. Ms. Hasina is facing criminal cases in Bangladesh, including allegations relating to the crackdown on protesters. She has denied wrongdoing.\nSeparately, the WHO had been examining travel reimbursement claims relating to a trip to China. Ms. Wazed’s lawyers have described the issue as an administrative error.\nSaima Wazed | Rise of the daughter\nSaima Wazed was nominated by Bangladesh for the post of WHO regional director for Southeast Asia in August 2023 and was elected by the WHO Southeast Asia Regional Committee in November that year. The WHO executive board formally appointed her on January 23, 2024, and she assumed office on February 1, 2024 for a five-year term.\nMs. Wazed is a licensed school psychologist and holds a bachelor’s degree and a master’s degree in clinical psychology, as well as a specialist degree in school psychology, from Barry University, Florida.\nBefore becoming WHO regional director for Southeast Asia, she served as an adviser to WHO Director-General Tedros Adhanom Ghebreyesus on mental health and autism and was a member of the WHO Expert Advisory Panel on Mental Health.\nShe also chaired Bangladesh’s National Advisory Committee on Autism and Neurodevelopmental Disorders and the Shuchona Foundation, and served as a Commissioner of the Chatham House Commission for Universal Health. She became the first person from Bangladesh and the second woman to head the WHO’s Southeast Asia Region.\nPublished - September 10, 2026 12:08 pm IST", "translation_ja": "", "vocab": [{"word": "termination", "definition": "雇用契約や任命などの公式な終了。ここでは、その職務を解くことを意味します。"}, {"word": "fraud", "definition": "詐欺的な行為や不正行為。他者を欺いて金銭や利益を得ようとする違法行為。"}, {"word": "forgery", "definition": "公文書や証明書などを偽造すること。本物に見せかけて作成する犯罪行為。"}, {"word": "deterioration", "definition": "状況や関係が悪くなること。品質や状態が低下する過程を指します。"}, {"word": "misrepresented", "definition": "虚偽の情報を与えたり、事実を歪めたりすること。本来と異なる方法で示される。"}, {"word": "tenure", "definition": "特定の職位や地位にある期間。任期や在任期間を指す用語。"}]}, {"title_ja": "スリランカ最高裁、物議を醸す僧侶の大統領恩赦を取り消し", "title_en": "Sri Lanka Supreme Court Revokes Monk's Presidential Pardon in Landmark Ruling", "summary_ja": "スリランカ最高裁は、2019年に物議を醸す仏教僧侶ガラゴダアッテ・グナナサラに与えられた大統領恩赦を取り消し、その決定は恣意的で無効であると宣言した。裁判侮辱罪と犯罪的脅迫罪で有罪判決を受けた同僧侶は、当時のシリセナ大統領によって恩赦されていた。この判決は、行政決定に対する司法権の逆転の重要な事例である。", "summary_en": "Sri Lanka's Supreme Court overturned a 2019 presidential pardon granted to controversial Buddhist monk Galagoda Aththe Gnanasara, declaring the decision arbitrary and null. The monk, leader of the hardline Bodu Bala Sena organization, had been convicted of contempt of court and criminal intimidation but was pardoned by then-President Sirisena. The ruling marks a significant case of judicial reversal of executive action in the island nation.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/sri-lanka-supreme-court-revokes-controversial-monks-presidential-pardon/article71451913.ece", "state_media": false, "category": "政治", "full_text": "In a significant case of the judiciary reversing an executive decision, Sri Lanka’s Supreme Court on Thursday (September 10, 2026) overturned a presidential pardon granted to a reactionary Buddhist monk.\nIn May 2019, then President Maithripala Sirisena pardoned controversial monk Galagoda Aththe Gnanasara ‘Thero’ [as Buddhist priests in Sri Lanka are respectfully referred to], leader of the hardline Bodu Bala Sena (Buddhist Power Force or BBS), who was serving prison term at the time, following conviction for contempt of court and criminal intimidation.\nRead The Hindu Profile Galagodaaththe Gnanasara | The divisive monk\nColombo-based non-governmental organisation Centre for Policy Alternatives (CPA) and Sandya Eknaligoda, wife of dissident political cartoonist Prageeth Eknaligoda, forcibly disappeared since 2010, had challenged the pardon. Seven years later, the Supreme Court has ruled that President Sirisena’s action was “arbitrary”, and declared it “null and void”. The ruling assumes significance in the Sinhala Buddhist-majority island nation, where the Buddhist clergy wields considerable religious influence and political power.\nGnanasara Thero rose to prominence in 2012, when he founded the BBS. Widely known for his provocative anti-Muslim remarks and mobilisations, the firebrand monk, now 51, and his organisation became a prominent symbol for a surging anti-Muslim rhetoric in Sri Lanka after the country’s civil war ended in 2009.\nIn January 2016, Gnanasara Thero stormed the courtroom and openly threatened Ms. Eknaligoda, when a magistrate court was hearing a case of her disappeared husband.\nTwo years after President Sirisena pardoned the monk, his successor Gotabaya Rajapaksa appointed Gnanasara Thero to a Presidential Task Force to draft proposals on legal reforms, a move widely criticised by rights defenders. In 2024, the Colombo High Court sentenced him to four years’ rigorous imprisonment for fanning hatred against Muslims in a 2016 press conference. He was later granted bail.\nPublished - September 10, 2026 11:34 pm IST", "translation_ja": "", "vocab": [{"word": "arbitrary", "definition": "根拠や理由がなく、気まぐれで判断された状態を示す。法律用語として、正当な根拠なく下された決定や行為を指す。"}, {"word": "pardon", "definition": "犯罪者の刑罰を免除または軽減する公式な決定。通常は政治的権力者によって行われる。"}, {"word": "contempt of court", "definition": "法廷の権威や尊厳を損なわせる行為。裁判所の命令に違反したり、法廷を侮辱したりする法的違反。"}, {"word": "firebrand", "definition": "激しい言論や行動で紛争や扇動を引き起こす人物。政治的または社会的な論争を積極的に仕掛ける者。"}, {"word": "judiciary", "definition": "司法制度全体、または裁判官によって構成される機関。法律を解釈・適用する公式な権力部門。"}, {"word": "reactionary", "definition": "進歩的な変化に反対し、過去の状態への復帰を望む人物または思想。保守的で革新的な改革を拒否する姿勢。"}]}, {"title_ja": "カナダが米国との貿易戦争中にアルバータ州首相が米国で休暇を過ごすのはなぜか", "title_en": "Why would Alberta's premier vacation in the U.S. during a trade war?", "summary_ja": "コラムニストのジリアン・スチュワードは、カナダが米国との貿易紛争に直面している最中に、ダニエル・スミス首相が米国での休暇を取ることを疑問視している。この時期の米国への旅行は経済的緊張の中で政治的に不適切な見え方をすると懸念を表明している。", "summary_en": "Gillian Steward questions Premier Danielle Smith's decision to take a vacation in the United States while Canada is engaged in a trade dispute with the U.S. The column raises concerns about the optics of such a trip during a time of economic tension between the two nations.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihwJBVV95cUxNMHY0dEtEMHFrVnZHczM4d250NnZiUWZoRUZnM2dsbUlvRXh4Uzg2SGx2RHh6ZTNMVVFBT1VqekU2WWtzeGxia1NrTVJBTURpNUpmYklIM0kwc0UtczZYVGlUX1Z5dVJFZzI1ZWdGUU1qR1hpQ1p1TjN5NTBjN3lHRkZuVlEwSzlNOW1VWlhPdGVaRFhIVHpLOFNEbGJRT21vTVFkdzV5RDVCTFRFNEZZQTR5QWxwSmVkNTQzTUNZcGVkb3FYdGZJVFczS1AxNzBDV19MRmw1dHRITG50aE0zajdQbE82ZDdHOUFNbUplSTBjNzRYSjhfMFFONHg1VkxaLTNwOG5lMA?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナのゼレンスキー大統領がカナダとの「100年協定」を模索", "title_en": "Ukraine's Zelenskyy Seeks '100-Year Deal' with Canada", "summary_ja": "ウクライナのゼレンスキー大統領は、カナダとの長期的な戦略的パートナーシップを追求し、両国の関係を強化するための「100年協定」を提案しています。この協定は、安全保障、経済、人道支援を含む両国間の協力を網羅する可能性があります。このイニシアティブは、継続的な紛争の中で国際的支援を確保するためのウクライナの広範な努力を反映しています。", "summary_en": "Ukrainian President Volodymyr Zelenskyy is pursuing a long-term strategic partnership with Canada, proposing a '100-year deal' to strengthen bilateral ties. The agreement would likely encompass security, economic, and humanitarian cooperation between the two nations. This initiative reflects Ukraine's broader efforts to secure sustained international support amid ongoing conflict.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihwJBVV95cUxPSy1XR3FFTFpMNU5oc1NwbVdwckpXeVlIXzN5 d of Our History, Looking to the Future", "summary_ja": "ブラジルの大手紙O Globoは、栄光ある歴史を振り返りながら、将来の成長と革新に向けて自らを位置付けている。同紙は急速に変化するメディア環境において、質の高いジャーナリズムへのコミットメントと適応性を強調している。", "summary_en": "O Globo reflects on its storied past while positioning itself for future growth and innovation. The Brazilian newspaper emphasizes its commitment to quality journalism and adaptability in a changing media landscape.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アナンブラ州警察、殺人容疑者の釈放で₦600,000を受け取ったことを否定", "title_en": "Anambra Police Deny Collecting ₦600,000 to Free Murder Suspect", "summary_ja": "アナンブラ州警察は、殺人事件に関連する容疑者の釈放と引き換えに₦600,000を受け取ったという疑惑を否定しました。警察報道官は、女性容疑者の釈放は継続中の捜査と逃亡中の主要容疑者の身柄確保に協力するという申し出に関連していると述べました。警察は批評家に対し、横領や汚職の具体的な証拠を提示するよう求めています。", "summary_en": "The Anambra State Police Command has denied allegations that it collected ₦600,000 to secure the release of Jennifer Nwosu, one of 12 suspects linked to a murder case. Police spokesperson Tochukwu Ikenga stated that her release was connected to the ongoing investigation and her offer to help locate the principal suspect who remains at large. The police challenged critics to provide credible evidence of extortion or corruption.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/908733-anambra-police-deny-collecting-%e2%82%a6600000-to-free-murder-suspect.html", "state_media": false, "category": "経済", "full_text": "The police command in Anambra State has denied allegations that it collected ₦600,000 to free Jennifer Nwosu, one of the 12 suspects linked to the murder of Isaac Nwosu on 30 August 2026 in Awka.\nTochukwu Ikenga, the police spokesperson in Anambra, clarified during a news conference on Wednesday at the command headquarters in Awka.\n“The Anambra Police Command did not collect ₦600,000 to secure Miss Jennifer Nwosu’s release. Her arrest and subsequent release were connected to the ongoing investigation into the murder case.\n“We are not a collection of angels, but the Anambra Police Command did not demand or collect ₦600,000, or any money whatsoever, as a condition for Miss Jennifer Nwosu’s release,” he said.\nMr Ikenga said the command had arrested over 12 suspects allegedly linked to the murder of Awka-based public announcer, comedian and town crier, Mr Nwosu, popularly known as Aiza Nwosu.\nHe said they were also linked to other cult-related killings in Awka.\nAccording to him, his niece, Miss Nwosu, was among those arrested, while his nephew, Kenechukwu Nwosu, remains at large.\nHe dismissed the allegation as false and challenged anyone alleging extortion, corruption or other misconduct against police officers to produce credible and verifiable evidence.\nThe spokesperson explained that Mr Kenechukwu, who is at large, is also a suspect in the murder case.\nHe said Miss Nwosu was arrested based on information regarding the role she allegedly played during the investigation.\nAccording to him, during interrogation, Miss Nwosu initially claimed that she had neither seen nor spoken to her brother in the past five years.\n“However, investigators subsequently discovered that she had communicated with Mr Kenechukwu Nwosu on the night of Mr Isaac Nwosu’s murder.\n“The command is investigating a cult-related murder in Awka.\n“As part of that investigation, the police are examining individuals and circumstances that may assist in identifying the perpetrators and locating the principal suspect, who is at large.\n“During interrogation conducted in the presence of her lawyer, Miss Jennifer Nwosu denied communicating with the suspect for over five years,” he said.\nMr Ikenga, however, said information available to investigators indicated that there was communication between Miss Nwosu and the suspect on the night of the incident.\n“The communication under investigation included information concerning the death of the victim and an alert to the suspect that the police were closing in on him.\n“These are legitimate investigative issues that the police have a duty to clarify.\n“For clarity, being invited, arrested or questioned in connection with an investigation is not a declaration of guilt, and the command remains guided by due process and the presumption of innocence,” he said.\nWhy the suspect was released – Police\nThe police spokesperson said that Miss Nwosu was subsequently released after offering to assist the police in locating and apprehending the principal suspect, who remains at large.\nHe said her release was, therefore, connected to the ongoing investigation and the need to explore every lawful means of bringing the principal suspect to justice.\nREAD ALSO: Police arrest suspect over fake shutdown report targeting OPay\nMr Ikenga also said the command was mindful of Section 83 of the Criminal Code of Anambra, which provides for liability where a person becomes an accessory after the fact to a felony.\n“Similarly, the administration of criminal justice law provides the legal framework for bail and criminal proceedings.\n“The police will continue to exercise their investigative responsibilities within the law and will take necessary lawful steps where circumstances require further investigation,” he said.\nThe police were responding to an alarm raised by the Rule of Law and Accountability Advocacy Centre (RULAAC) regarding the whereabouts and safety of Miss Nwosu after she allegedly paid ₦ 600,000 for her release.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "extortion", "definition": "金銭や物品を脅迫や強要によって獲得する違法行為。ここでは警察による違法な金銭要求を指しています。"}, {"word": "allegation", "definition": "証拠なく何かが真実であると主張すること。ここでは警察への不正な金銭収受の告発を意味します。"}, {"word": "interrogation", "definition": "容疑者や証人に対して詳しく質問し、情報を引き出すプロセス。警察が行う尋問調査のことです。"}, {"word": "accessory after the fact", "definition": "犯罪が実行された後に、犯人を助け隠匿した者。法律用語で共謀罪の一種です。"}, {"word": "presumption of innocence", "definition": "有罪が証明されるまで、誰もが無実と見なされるべきという法的原則。法治国家の基本的な権利です。"}, {"word": "cult-related", "definition": "秘密結社やカルト組織に関連した。ここではギャング組織による殺人事件を指します。"}]}, {"title_ja": "アルジェリア、地域的緊張を理由にUAEとの外交関係を断絶", "title_en": "Algeria Severs Diplomatic Ties with UAE Over Regional Tensions", "summary_ja": "アルジェリアは挑発的で敵対的な行動を理由にUAEとの外交関係を断絶し、金曜日からUAE航空機に対する領空を閉鎖する。この決定は、イスラエルとの関係正常化に関する立場の相違、サヘル地域におけるUAEの影響力の拡大、そして西サハラに関する利益相反をめぐる数年間の緊張に続くもの。UAEは、この断絶が一時的であることを望むと応答した。", "summary_en": "Algeria has severed diplomatic relations with the UAE, citing provocative and hostile actions, and will close its airspace to UAE aircraft starting Friday. The decision follows years of tension over differing stances on Israel normalization, UAE influence in the Sahel region, and competing interests in Western Sahara. The UAE responded by expressing hope the severance would be temporary.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/foreign/908726-algeria-severs-ties-with-uae.html", "state_media": false, "category": "政治", "full_text": "Algeria has severed its diplomatic ties with the UAE over what it described as provocative and hostile actions despite repeated warnings.\nThe country’s foreign ministry announced the decision to cut ties with Abu Dhabi on Thursday in a statement. It comes after years of brewing diplomatic row over a range of issues.\nAl Jazeera, quoting Ennahar TV, an Algerian news channel, reported that Algeria plans to close its airspace to all UAE-registered civilian and military aircraft starting Friday. But it will allow UAE commercial flights to and from Algiers to use its airspace until the end of 2026, when the current contract expires.\nThe ministry also said it had summoned the UAE ambassador to inform them of the decision and give 48 hours to comply.\nAlgeria stated that it was opting to sever ties with the UAE because it had “exhausted all means of preserving bilateral relations.”\nHowever, the UAE, in response to this, said it hoped Algeria’s decision to cut diplomatic ties would be “temporary.”\n“In light of the decision by the People’s Democratic Republic of Algeria to sever relations with the United Arab Emirates, the UAE reaffirms the importance it attaches to its relations with all countries and its commitment to developing and strengthening them to serve shared interests and promote understanding, cooperation and prosperity,” the foreign ministry said on X.\nA reason for the strained relations between both countries has been their differing stance on regional issues, particularly on the normalisation of relations with Israel. The UAE normalised relations with Israel in 2020 after President Donald Trump successfully brokered a deal between both countries.\nThe deal took Palestinian leaders by surprise and led to the recall of the Palestinian ambassador to the UAE. At the time, a spokesman for President Mahmoud Abbas referred to the deal as amounting to “treason.”\nLast year, Algerian President Abdelmadjid Tebboune declared that the country will not normalise relations with Israel before the establishment of a Palestinian state.\nHe made clear that Algeria’s “priority is the establishment of a Palestinian state.”\nTension over Sahel, Morocco\nAlgeria is also displeased with the emirate’s growing influence in the Sahel, where its relations with states that are its southern neighbours have become increasingly strained.\nThe diplomatic rift between Algeria and Mali, and subsequently, Niger and Burkina Faso, worsened after juntas took over the government.\nInsecurity in the Sahel has been at the heart of the tensions between the parties. In 2024, Mali ended the Algiers Accord, introduced as a framework for peace and reconciliation between the Malian government and Tuareg armed groups in the north.\nThe move strained relations between Bamako and Algiers.\nMali accused Algeria of interference in its internal affairs, while Algeria raised concerns about the growing instability along their shared border.\nThe rift between the two countries grew after a Malian drone destroyed Algerian-owned trucks near the Mali border in March, and then two weeks later, Algeria shot down a Malian armed drone over Tin Zaoutine, a sensitive frontier zone.\nBoth countries insisted that the armed drone was in their airspace. Angered by Algeria’s action, Mali withdrew from the Comité d’Etat Major Opérationnel Conjoint (CEMOC), a regional counterterrorism initiative headquartered in Algeria. The other two AES states followed suit by recalling their ambassadors from Algiers.\nA few days later, Algeria and Mali both closed their airspace to each other’s aircraft.\nWhile Algeria’s rift with the AES states was intensifying, the UAE was expanding its influence in the central Sahel region. Dubai has been pursuing deeper engagement with the three states.\nAlgiers also accused the country of meddling in its internal affairs and causing destabilisation.\nAlgerian President Abdelmajid Tebboune has repeatedly referred to the UAE as a “micro-state” or “statelet” seeking to worsen tension in the region.\nDuring a televised interview in July, he said the UAE has had a “very negative impact, and that wherever they set foot, blood flows.”\n“We want them to stay away, so that blood does not flow in our country,” he declared.\nThe countries also stand on opposing sides on Western Sahara, a disputed territory in North Africa.\nWhile the UAE supports Morocco’s claim to the territory, Algeria supports the separatist Polisario Front, which is demanding an independent State.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "sever", "definition": "関係や結びつきを完全に断つことを意味する。外交関係や契約の終了など、公式な切断を表すために使用される。"}, {"word": "diplomatic ties", "definition": "二国間または複数国間の公式な関係を指す。通常、大使の交換や協力協定などを含む。"}, {"word": "normalization", "definition": "以前は敵対的または断絶していた状態を、通常または正常な関係に戻すこと。国家間の関係改善を示す。"}, {"word": "rift", "definition": "人々や国家間の深刻な不一致や分裂を意味する。関係の亀裂や対立を表す。"}, {"word": "strained relations", "definition": "緊張や不信感がある関係を示す。完全には断絶していないが、友好的ではない状態。"}, {"word": "meddle", "definition": "他国の内政に不当に干渉することを意味する。権限のない方法で事柄に関与すること。"}, {"word": "separatist", "definition": "より大きな政治体から独立や分離を求める個人またはグループを指す。独立運動の支持者。"}]}, {"title_ja": "イースト・ロンドン大学がMbah州知事に名誉博士号を授与", "title_en": "University of East London Honors Gov Mbah with Honorary Doctorate", "summary_ja": "ナイジェリア・エヌグ州のピーター・Mbah知事は、出身校であるイースト・ロンドン大学から名誉法学博士号を授与されました。大学は、法学生から起業家、州知事への彼の歩みを称賛し、ナイジェリアにおける教育とイノベーションへの投資を強調しました。Mbah知事は、破壊的イノベーション、目的主導のサービス、そして教育の変革力の重要性を強調しました。", "summary_en": "Governor Peter Mbah of Enugu State received an honorary Doctor of Law degree from the University of East London, his alma mater, in recognition of his academic excellence and leadership contributions. The university celebrated his journey from law student to successful entrepreneur and governor, highlighting his significant investment in education and innovation in Nigeria. Mbah emphasized the importance of disruptive innovation, purpose-driven service, and education as transformative forces.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/908722-university-of-east-london-confers-honorary-doctorate-on-gov-mbah-celebrates-his-leadership.html", "state_media": false, "category": "経済", "full_text": "Governor of Enugu State, Dr Peter Mbah, was on Thursday conferred with a Doctor of Law Degree, honoris causa, by his alma mater, the University of East London, UEL, in the United Kingdom.\nPresenting Mbah’s citation during the graduation ceremony at the Docklands Campus of UEL, Vice-Provost (Business) and Executive Dean, Royal Docks School of Business and Law, Prof Fatima Ana-Diab, recalled his academic and leadership excellence as a student, which, she said, he had also translated to resounding success as an entrepreneur and governor of Enugu State, Nigeria.\n“More than two decades ago, Peter Mbah walked these halls as a law student, developing the knowledge, determination and leadership that would take him from UEL to the Nigerian Bar, the world of business and ultimately to public office as Governor of Enugu State.\n“Peter’s leadership was already evident during his time at UEL. As President of the Students’ Law Society, he helped transform the society into one recognised as the University’s Most Productive Society of the Year.\n“He represented his fellow students on the Students’ Representative Council and School of Law Board, won UEL’s Mooting Competition and went on to represent the University at the International Negotiation Competition.\n“After graduating with his Bachelor of Laws in 2000, Peter returned to Nigeria, where he attended the Nigerian Law School and was called to the Nigerian Bar.\n“His pursuit of knowledge continued through a Master’s degree in Maritime and Commercial Law from Lagos State University, an MBA from IESE Business School in Spain, executive education at Lagos Business School and postgraduate study in Strategy and Innovation at the University of Oxford.\n“Peter went on to build a distinguished career spanning law, entrepreneurship and public service. As the founder of Pinnacle Oil and Gas, he demonstrated how ambition, innovation and enterprise can transform an organisation and contribute to economic development. His career in government has included service as Chief of Staff and Commissioner for Finance and Economic Development in Enugu State.\n“In May 2023, Peter Mbah took office as Governor of Enugu State, bringing his experience across law, business and public administration to the leadership of millions of people,” Prof. Ana-Diab stated.\n“At the heart of his approach is a belief in the transformative power of education. His administration has made significant investment in education and skills, seeking to move learning beyond traditional models and equip young people with the knowledge, competencies and confidence to participate in a changing global economy,” the citation added.\nThe university hailed Mbah’s investment in education and his philosophy that education is fundamentally the cornerstone of human progress, the bedrock upon which the future stands, which resonates strongly with the institution.\n“Peter’s journey from UEL law student to lawyer, entrepreneur and Governor demonstrates the possibilities that education can unlock and the responsibility that comes with using those opportunities to create change for others.\n“His commitment to development extends beyond education. Through public service, business and philanthropy, Peter has championed investment, innovation, infrastructure, healthcare and community development, bringing together the disciplines that have shaped his own career to pursue a wider vision for economic and social progress.\n“For our graduates today, his journey offers a powerful example of where a UEL education can lead. It reminds us that leadership is not defined simply by the positions we hold, but by what we choose to do with the knowledge, opportunities and influence entrusted to us,” Ana-Diab concluded.\nMeanwhile, in his acceptance speech, Mbah reiterated his firm belief in disruptive innovation, the power of education, service, and dreaming beyond one’s inherited circumstances.\n“One quality has always mattered to me: the willingness to disrupt. I have never been particularly interested in accepting the limits of my inherited circumstances.\n“But imagination is not enough. There must be purpose. For me, that purpose is service, because there will always be mornings when ambition alone will not get you out of bed; and moments when the road becomes difficult and the rewards seem far away. At those moments, it matters to have something that transcends self.\n“Education enlarges our capacity to transform the world. I believe that deeply. What we are given must somehow enlarge the possibilities available to others.\n“That is why, today, we invest 33 per cent of our state budget in education. We are building schools, tech hubs and opportunities for young people to participate in an economy that is increasingly driven by knowledge, innovation and technology,” he stated.\nHe thanked his alma mater profoundly for the honour and its immense contributions to the man he is today.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to y", "translation_ja": "", "vocab": [{"word": "honoris causa", "definition": "「名誉のために」という意味のラテン語表現で、大学が個人の貢献や成就を認めて授与する名誉学位を指します。通常、特別な業績や社会への貢献のある人物に与えられます。"}, {"word": "disruptive innovation", "definition": "既存の市場や業界の慣例を大きく変える革新的な技術や事業モデルのことです。従来の方法を置き換え、産業に劇的な変化をもたらします。"}, {"word": "citation", "definition": "公式な場面で個人の功績や業績を称える文章や言及のことです。特に学位授与式などで、受賞者の背景や成就を説明する文として読み上げられます。"}, {"word": "alma mater", "definition": "個人が卒業した学校や大学を指すラテン語表現です。出身校という意味で、特に愛着と敬意を持って使用されます。"}, {"word": "mooting", "definition": "法学教育における模擬法廷活動で、学生が実際の法的議論と主張の練習をする競争的な活動です。弁論能力と法的知識を培う重要な教育方法です。"}, {"word": "philanthropy", "definition": "富や資源を社会的利益のために寄付・投資する慈善活動のことです。個人や組織が社会福祉向上のために行う寄付や支援を指します。"}]}, {"title_ja": "フーシ派がイラン同盟国の大勝利として紅海の戦略的港湾を占領", "title_en": "Houthis Seize Strategic Red Sea Port in Major Victory for Iranian Ally", "summary_ja": "イラン支援のフーシ派民兵がイエメンの戦略的港湾都市モカを占領し、政府軍を撃破しました。この占領により、グループは世界的な海上貿易の重要な通路である紅海での商船脅迫の立場を強化します。この勝利はイラン同盟のフーシ派にとって重要な地政学的利益を示しています。", "summary_en": "Iran-backed Houthi militia forces have captured the strategic port city of Mokha in Yemen, defeating government forces in the region. The seizure strengthens the group's position to threaten commercial shipping in the Red Sea, a vital corridor for global maritime trade. The victory represents a significant geopolitical gain for the Iranian-aligned militia.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/10/world/middleeast/yemens-houthis-seize-strategic-red-sea-port-officials-say.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフガニスタンの「永遠の戦争」：25年間の写真記録", "title_en": "The 'Forever War' in Afghanistan: 25 Years in Pictures", "summary_ja": "ニューヨーク・タイムズは、9月11日攻撃直後からアメリカ軍の混乱した撤退まで、25年間にわたるアフガニスタンの紛争をフォトジャーナリズムで記録している。この写真集は、軍事作戦とアフガニスタン市民の日常生活の両方を捉えている。2021年のアメリカの撤退後のタリバンの復権で、この25年間の視覚的記録は幕を閉じる。", "summary_en": "The New York Times documents a quarter-century of conflict in Afghanistan through photojournalism, from the aftermath of the September 11 attacks to the chaotic U.S. withdrawal in 2021. The collection captures both the military operations and the daily lives of Afghan civilians throughout the prolonged war. The visual chronicle concludes with the return of Taliban rule following the American departure.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/10/world/asia/afghanistan-war-photojournalism.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "息子の死後、ナイジェリアはチママンダ・ンゴジ・アディーチェにとって悲しみの源となった", "title_en": "Nigeria Becomes Source of Pain for Chimamanda Ngozi Adichie After Son's Death", "summary_ja": "ナイジェリアの著名な作家チママンダ・ンゴジ・アディーチェは、ラゴスで幼い息子が亡くなったことに続き、故郷との関係に大きな変化を経験しました。この喪失は、ナイジェリアを文学的インスピレーションの源から深い苦痛の場所へと変えてしまいました。この個人的な悲劇により、アディーチェの故郷への結びつきは根本的に変わってしまいました。", "summary_en": "Renowned Nigerian author Chimamanda Ngozi Adichie has experienced a profound shift in her relationship with her homeland following the death of her toddler son in Lagos. The loss has transformed Nigeria from a source of literary inspiration into a place of deep pain for the celebrated writer. Adichie's connection to home has been fundamentally altered by this personal tragedy.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/10/world/africa/chimamanda-ngozi-adichie-nigeria-son-death.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パレスチナ人がガザ北部への徒歩での帰還を開始", "title_en": "Palestinians Stream Back to Northern Gaza on Foot", "summary_ja": "人質解放交渉の膠着状態が打開された後、イスラエルはガザを二分する軍事地帯の横断をパレスチナ難民に許可した。この通行許可はイスラエル当局とパレスチナ勢力の長期的な対立の後の重要な進展となっている。数千人のガザ住民が制限の緩和に伴い徒歩でガザ北部地域へ戻っている。", "summary_en": "Israel has allowed displaced Palestinians to begin crossing a military zone that divides Gaza following a breakthrough in hostage release negotiations. The crossing marks a significant development after a prolonged deadlock between Israeli authorities and Palestinian groups. Thousands of Gazans are returning to northern areas on foot as restrictions are eased.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発大手が巨額損失を報告、不動産危機の深刻化を示す", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国の大手不動産開発企業ヴァンケが巨額の損失を報告し、中国の不動産セクター危機の深刻化を示唆しています。この大手企業の経営難は、不動産市場全体の安定性について懸念を生じさせ、中国当局による介入の可能性について疑問を投げかけています。", "summary_en": "Vanke, a major Chinese property developer, has reported significant losses, signaling the deepening real-estate sector crisis in China. The developer's financial troubles raise concerns about the broader stability of the property market and whether Chinese authorities will intervene to stabilize the sector.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From October 7 Attack", "summary_ja": "数ヶ月間の捕虜状態から解放されたイスラエル人人質の体内には、10月7日の攻撃による破片が依然として埋め込まれたままとなっている。イスラエル医療当局によると、一部の女性は長期間孤立した状態で拘束され、約8ヶ月間トンネル内に監禁されていた。この発見は、捕虜状態中に人質が被った深刻な身体的トラウマを浮き彫りにしている。", "summary_en": "Israeli hostages released after months of captivity still have shrapnel embedded in their bodies from the October 7 attack. Some women were held in isolation for extended periods and spent approximately eight months confined in tunnels, according to Israeli medical officials. The discovery highlights the severe physical trauma endured by hostages during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "世界的リーダーが核戦争への恐怖を失いつつある", "title_en": "World leaders are losing their terror of nuclear war", "summary_ja": "プーチン、トランプ、習近平は地球上で最も強力な核兵器を支配しているにもかかわらず、その壊滅的なリスクに対してますます無視的な態度を示しています。エコノミスト誌は、この危険な無関心が世界の安定を脅かしており、核紛争の存在的脅威に対する新たな尊重が必要だと警告しています。", "summary_en": "Putin, Trump, and Xi control the world's most powerful nuclear arsenals, yet appear increasingly dismissive of the catastrophic risks they pose. The Economist warns that this dangerous complacency threatens global stability and calls for renewed respect for the existential threat of nuclear conflict.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/08/world-leaders-are-losing-their-terror-of-nuclear-war", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "十代の学生の学力は低下しているのか？世界規模の学力試験で衝撃的な新たな低下が判明", "title_en": "Are teenagers growing dimmer? Global school tests show shocking new declines", "summary_ja": "最新の国際学力調査により、多くの国で生徒の学業成績が懸念される下降傾向にあることが明らかになった。この低下は世界中の政策立案者と教育者から緊急の対応が必要とされる、十代の教育成果における重大な変化を示唆している。", "summary_en": "The latest international school assessments reveal concerning downward trends in student academic performance across multiple countries. These declines suggest a significant shift in teenage educational outcomes that warrants urgent attention from policymakers and educators worldwide.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/08/are-teenagers-growing-dimmer", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "仕事がいかに家族をより平等にするか", "title_en": "How work makes families more equal", "summary_ja": "エコノミスト誌は、雇用を通じた経済的自立がいかに家族のダイナミクスを変え、不平等を減らすかを検証している。特に女性の経済参加は家庭内の力関係を転換し、より公平な関係を生み出す。しばしば物質主義と批判される金銭追求は、実は社会的平等の基盤として機能している。", "summary_en": "The Economist examines how financial independence through employment transforms family dynamics and reduces inequality. Economic participation, particularly by women, shifts power balances and creates more equitable household relationships. The pursuit of financial security, often dismissed as materialism, actually serves as a foundation for greater social equality.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/03/how-work-makes-families-more-equal", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マクロンとメルツ：極右勢力への2つの失敗した戦略", "title_en": "Macron and Merz: Two losing strategies against the far right", "summary_ja": "ドイツの極右政党AfDがドイツの州選挙で歴史的な勝利を収め、マリーヌ・ルペンがフランスの大統領選で有力候補となっている。これらの展開は、極右運動に対抗するための欧州の主流政党の現在の戦略の無効性を浮き彫りにしている。この記事では、マクロンとメルツのようなリーダーがポピュリスト・ナショナリスト勢力の台頭を抑制できなかった理由を検討している。", "summary_en": "The far-right Alternative for Germany (AfD) achieved a historic victory in a German state election, while Marine Le Pen emerges as a frontrunner in France's presidential race. These developments highlight the ineffectiveness of current strategies employed by mainstream European parties to counter far-right movements. The article examines how leaders like Macron and Merz have failed to contain the rise of populist and nationalist forces.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/09/10/macron-and-merz-two-losing-strategies-against-the-far-right_6757396_5.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ミサイル防衛システムの不足が深刻化、ウクライナが厳しい冬に直面", "title_en": "Ukraine faces harsh winter as air defense systems struggle against Russian attacks", "summary_ja": "ミサイル迎撃兵器の不足により防空能力が限界に達する中、ウクライナは厳しい冬を迎えようとしている。ホワイトハウスとクレムリン間の外交交渉が紛争解決の見通しを示さない中、ロシアによるウクライナインフラへの攻撃は激化し続けている。空中爆撃に対する脆弱性の増加は、寒冷期における民間人の生存に大きな課題をもたらしている。", "summary_en": "Ukraine braces for another difficult winter as its air defense capabilities are stretched thin due to a shortage of missile interceptors. With diplomatic efforts between the White House and Kremlin showing no signs of resolving the conflict, Russian attacks on Ukrainian infrastructure continue to intensify. The country's vulnerability to aerial bombardment poses significant challenges for civilian survival through the cold months ahead.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/10/ukraine-braces-for-another-harsh-winter-as-air-defense-falls-short_6757391_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス政府、ロシア宣伝家の出演を許可したCNewsに制裁を警告", "title_en": "French Government Threatens CNews with Sanctions Over Russian Propagandist", "summary_ja": "フランスの内務大臣ローラン・ヌニェスは、億万長者ヴァンサン・ボロレが所有するCNewsに対し、国外追放されたロシア宣伝家クセニア・フェドロワの出演を許可した場合、制裁を加えると警告した。同大臣は、このチャンネルが国外追放命令を迂回し、ロシアによるフランスメディアへの干渉を助長していると非難している。", "summary_en": "France's Interior Minister Laurent Nuñez has warned that CNews, owned by billionaire Vincent Bolloré, faces sanctions if it allows deported Russian propagandist Xenia Fedorova to return on air. The minister accused the channel of circumventing a deportation order and facilitating Russian interference in French media.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/09/10/french-government-threatens-cnews-with-sanctions-if-russian-propagandist-returns-on-air_6757394_5.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の最新情報", "title_en": "Mindef Updates", "summary_ja": "これは海峡時報からの国防省（Mindef）ニュースに関するニュースレターの更新です。読者は購読設定を管理し、海峡時報からの追加の無料ニュースレターに登録することができます。", "summary_en": "This is a newsletter update from The Straits Times regarding Ministry of Defence (Mindef) news. Readers can manage their subscription preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "夕刊ニュース", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズの夕刊ニュースは、毎日のニュースハイライトと最新情報を提供しています。読者は同紙のウェブサイトを通じて追加の無料ニュースレターに登録し、購読設定を管理することができます。", "summary_en": "The Straits Times Evening Update provides daily news highlights and updates. Readers can subscribe to additional free newsletters and manage their subscription preferences through the publication's website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズが主要なニュース速報と分析を含む日刊のモーニング・ブリーフィングを配信しています。読者はウェブサイトを通じてさらに多くの無料ニュースレターを購読し、購読設定を管理することができます。", "summary_en": "The Straits Times delivers its daily Morning Briefing newsletter featuring key news updates and analysis. Readers can subscribe to receive more free newsletters and manage their subscription preferences through the publication's website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハアレツ紙、ネタニヤフ首相の脅迫に反発「法廷で真実を明かすことをためらわない」", "title_en": "Haaretz Defies Netanyahu Over Oct. 7 Exposé, Vows to Defend Truth in Court", "summary_ja": "イスラエルの大手紙ハアレツは、10月7日の事件に関する調査報道をめぐってネタニヤフ首相からの脅迫に対して強く反発した。同紙は法的手続きで報道を擁護し、真実を明かすことをためらわないと述べた。イスラエルのメディアは、ジャーナリズムの誠実性と説明責任への決意を改めて示した。", "summary_en": "Haaretz newspaper responded defiantly to threats from Prime Minister Netanyahu following their investigative reporting on October 7 events. The publication stated it will not hesitate to defend its reporting and expose the truth in legal proceedings. The Israeli media outlet reaffirmed its commitment to journalistic integrity and accountability.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMioAJBVV95cUxOLXF1cjRBaFNJSnFzemYtdnpzSThrNGdQYnRXa041UWpRTjFQRUVRRGxlUjQ4eUoyME1vODRya1V4X3pfRkM2VTh5UGtnZ1JCbkRjZEFEdy1XdzBNS24wTnFvUGZ0dF9VUVNSdHRpZkg5NEVaVF9lUDNWRERWYW9rbjJNUkxpVmdjRmEtLVdnakxCWDRXcjVFX05rZ2swNDU5MlBmOHhMOFcyVWk4a3dNWVB5VU50Tl8teEJCaE9IWFlaWWhMY3FHY3hTQlJqSVpiOWtCc2RiNWl5a25XamI2dUdJM1hLMzViOUpLVkVVMFlJNE5Hd0VUbU5IZUJ5aU54b3lLaUVTcXRwUkFVMHZpX2VoaHFGX0NJZ0h0N1VFZHQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルのサイバー企業が独裁政権に秘密裏に監視ツール提供", "title_en": "Israeli Cyber Firm Secretly Arming Autocrats Against LGBTQ+ Groups and Protesters", "summary_ja": "イスラエルのサイバーセキュリティ企業が、LGBTQ+個人と政治活動家を標的とする独裁政権に監視ツールを提供していることが明らかになった。同社の技術は抑圧的な政府が脆弱な集団を監視・弾圧することを可能にしており、公的な説明責任がない。", "summary_en": "A report reveals that an Israeli cybersecurity company has been providing surveillance tools to authoritarian regimes targeting LGBTQ+ individuals and political protesters. The firm's technology enables repressive governments to monitor and suppress vulnerable populations without public accountability.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMisAJBVV95cUxPTXBKWmhCekNFM05YQnBmYjBSMEhoTDMwaXNteUhXTUxaaXlSLW53SG55R1dFdmN2bWJsYnM3bUNSRGF0VzdCTkQyajAxUktTX0dmRUc3MHZhTjJfMXZ3eGpiY3UxS1BZTjZSZ3F5cUExVVhyNXBuelRjSWNsNG55THlQYWs3U21VckFPenFacGlnMzA3d2dYdlp0bEdZdXBVVXI2aUNhWElzaUJiVnA2M19YaFV6UldKRDVzUWZMank5SDROem0yR2YwQW1BMmRDWURLejlKRF9PbGpQRFRXb1dGc0JIVkRVR21nUFc5T1gyZW81cUtqUHFDZHZpQ2RhNVZGV0F6UVNxczdSQ2tKZXdqLVdmM0tCNmYwTlZCSUgzSVlWNjVJWmxENzdPOGlZ?oc=5", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相は10月7日前に警告を受けていた。国家調査がより重要に", "title_en": "Netanyahu Received Pre-October 7 Warnings; State Inquiry Becomes Crucial", "summary_ja": "分析によると、ネタニヤフ首相は10月7日の攻撃前にセキュリティ上の脅威について警告を受けていたことが明らかになった。情報機関の失敗と政府対応の説明責任を問うため、国家調査の実施がこれまで以上に重要になっている。", "summary_en": "An analysis reveals that Prime Minister Netanyahu was warned about security threats before the October 7 attacks. A state investigation into the intelligence failures and government response has become increasingly vital for accountability and understanding how the attack occurred.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMioAJBVV95cUxOSERlZHBuMG84X0RTN2Jrd0tvVjZwbzBUUUw4dHhmcjEzelhiZU1RcEc2d0FtTzJBdGV6Z1N5elBUYlAyZ2djaGRwcWMyZXlpaUxrRVZyaUktYmJOX2I2Q011aktKcGdyOWRzRHhGMEtoeWdtWEJPNTRYMHo0Rjk5VDBrN0l3LWgyWm40dzZZeWhVUWk2dGV1NUpYU25DRDVEZGtDa01lYXZZc3FxRTd4cWw1ZUN6VUxNcU9qV0RNTFQzX1FXTjl1SHYyOGZ5c0RWd2VjLUNXWlI3c1lxSmhneEZ2ekFpVlpiclJKTFk2cUN0cU9WWTZhdlNkajViOHBEY3NERjV3VUg1NUR3RV9zVTI4LTdLVkZfX0l5WEVvbUI?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の防衛動員法は大規模紛争への準備を示唆、専門家が指摘", "title_en": "China's Defense Mobilization Law Signals War Preparations, Analysts Say", "summary_ja": "中国の新しい防衛動員法は、専門家らによって大規模軍事紛争への準備の兆候と解釈されている。この法律は有事の際に民間資源を軍事利用に迅速に転換することを可能にするために設計されているようだ。専門家らは北京が大規模または長期の武力紛争に備えている可能性があると指摘している。", "summary_en": "China's new defense mobilization law is being interpreted by analysts as a signal of preparations for large-scale military conflict. The legislation appears designed to enable rapid conversion of civilian resources to military use in wartime. Experts view it as indicating Beijing may be planning for a prolonged or major armed confrontation.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9veTFqakFBdnFxd0JkWTRrZ19MZF9TNWxCUm52VGZ3OUNkX0JZQ1M5dXM3UnV5ZDhESkVoYWdhOWw2T3paTV9ZODdMdFZrVzJ5NlgxM3E4Yw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾と米国は中国のグレーゾーン圧力に対抗する必要がある：スタンフォード大学の学者", "title_en": "Taiwan and U.S. Must Counter China's Gray-Zone Pressure: Stanford Scholar", "summary_ja": "スタンフォード大学の学者は、台湾と米国が中国のグレーゾーン戦術に対抗するための強力な戦略を開発する必要があると警告しています。これらの戦術は直接的な軍事紛争には至らないものの、地域の安定性に対する重大な脅威です。サイバー攻撃、情報操作キャンペーン、軍事的脅迫などが含まれます。", "summary_en": "A Stanford scholar warns that Taiwan and the United States need to develop stronger strategies to counter China's gray-zone tactics, which fall short of military conflict but pose significant security challenges. Gray-zone operations include cyberattacks, disinformation campaigns, and military intimidation designed to destabilize the region without triggering direct warfare.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9TYVNsMTYydW1VYmtpMFpYQ3FIT0dFakxkRE04c29Ld2NfVDlGcVYzRGJfYTloSTlfS0N0ZlN3VjgzODZhX0tCUmFpWnNxOU44bVY4WlJQOA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "看護師死亡のひき逃げ事件で男を逮捕", "title_en": "Man arrested for alleged hit-and-run killing of nurse", "summary_ja": "看護師が死亡したひき逃げ事件に関連して、男が逮捕されました。容疑者は衝突後に現場から逃げました。当局は事件の状況を調査しています。", "summary_en": "A man has been arrested in connection with a hit-and-run incident that resulted in the death of a nurse. The suspect fled the scene following the collision. Authorities are investigating the circumstances of the incident.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE03MXpLYXhManlZTkFGZkJWZS1RVERrRXlPR2Q1dkh0VlNMd25vSElySzRWN1d2bm9kdjFONmZHNExvS0xKWXZPNS1KYTZCREF0cHJsRzR3?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国と韓国、FTA交渉第2段階で前向きな進展を達成", "title_en": "China, South Korea Make Positive Progress in FTA Talks", "summary_ja": "CGTNによると、中国と韓国は二国間自由貿易協定(FTA)の第2段階交渉第16回で、越境サービス貿易とネガティブリスト市場アクセスに関して前向きな進展を達成した。中国商務省が水曜日に発表した。両国の経済協力をさらに深化させるための継続的な取り組みを示している。", "summary_en": "CGTN reports that China and South Korea have achieved positive progress on cross-border services trade and negative-list market access during the 16th round of second phase negotiations for their bilateral Free Trade Agreement. The Chinese Ministry of Commerce announced the development on Wednesday. The talks represent ongoing efforts to deepen economic cooperation between the two nations.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-09/China-South-Korea-make-positive-progress-in-second-phase-FTA-talks-1QixfWb8y08/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米軍、イランによる軍艦攻撃報道を否定", "title_en": "US Military Denies Reports of Iranian Strikes on Warships", "summary_ja": "CGTNが伝えたところによると、米軍はイラン軍がアメリカの軍艦を攻撃したという主張を否定している。この否定は地域における緊張の高まりの中で出されたものである。報告されたこの事件に関するさらなる詳細は限定的である。", "summary_en": "CGTN reports that the US military has denied claims that Iranian forces struck American warships. The denial comes amid escalating tensions in the region. Further details regarding the alleged incident remain limited.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-09/news-1QiFO4BeBNK/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2026年中国国際サービス貿易交易会に関するオンライン調査", "title_en": "Online Survey on the 2026 China International Fair for Trade in Services", "summary_ja": "CGTNは、2026年の中国国際サービス貿易交易会（CIFTIS）に関するオンライン調査が実施されていると報じています。この調査は、今後のイベントについて参加者や関係者からのフィードバックと意見を収集することを目的としています。", "summary_en": "CGTN reports that an online survey is being conducted regarding the 2026 China International Fair for Trade in Services (CIFTIS). The survey aims to gather feedback and input from participants and stakeholders about the upcoming event.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-07/Online-Survey-on-the-2026-CIFTIS-1QfgnPqg5qw/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カナダとウクライナ、100年パートナーシップに向けた宣言に署名", "title_en": "Canada, Ukraine Sign Declaration Toward 100-Year Partnership", "summary_ja": "TASSが報じたところによると、カナダとウクライナは長期的なパートナーシップ枠組みを確立する宣言に署名しました。この協定には防衛生産の地域化やその他の二国間協力プロジェクトの規定が含まれています。", "summary_en": "TASS reports that Canada and Ukraine have signed a declaration establishing a long-term partnership framework. The agreement includes provisions for localizing defense production and other joint collaborative projects between the two nations.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2185795", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "プーチン大統領、BRICS首脳会議出席のためニューデリーに到着", "title_en": "Putin Arrives in New Delhi for BRICS Summit", "summary_ja": "タス通信は、ロシアのプーチン大統領がBRICS首脳会議出席のためニューデリーに到着したと報じている。国営メディアによると、プーチン大統領のIl-96航空機がパラム空軍基地に着陸した。この訪問は主要新興国会議へのロシアの参加を示すものである。", "summary_en": "TASS reports that Russian President Vladimir Putin has arrived in New Delhi for the BRICS summit. The state-controlled outlet indicates that Putin's Il-96 aircraft landed at Palam Air Force Station. The visit marks Russia's participation in the major emerging economies gathering.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2185791", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアの燃料危機に乗じた偽ガソリンスタンド地図によるデータ採集", "title_en": "Fake Gas Station Maps Exploit Russia's Fuel Crisis for Data Harvesting", "summary_ja": "国際ファクトチェックネットワーク会長によると、詐欺師がロシアの燃料不足の最中に個人情報を収集するため、オンライン上に偽のガソリンスタンド地図を作成しているとTASS/RTが報道している。詐欺師らは燃料供給が途絶える中、誤った位置情報を配布してロシア国民を狙っている。燃料を求めている市民がこうした詐欺的な地図情報の標的となっている。", "summary_en": "According to the Global Fact-Checking Network president, fraudsters have created fake gas station maps online to harvest personal data from Russian citizens amid fuel shortages. TASS/RT reports that scammers are exploiting the country's fuel crisis by distributing misleading location information. The scheme targets Russians searching for available fuel during supply disruptions.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2185787", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "9.11のその後の影響", "title_en": "9/11's Long Shadow", "summary_ja": "著者は、2001年9月11日のテロ攻撃は悲劇的だったが、アメリカのその対応が事件そのものよりもグローバルな環境をより根本的に変えたと主張しています。冷戦終結後に形作られるはずだったアメリカの原則を放棄し、その結果が過去25年間の世界を形作ってきたと述べています。", "summary_en": "The author argues that while the September 11, 2001 terrorist attacks were tragic, America's response to them fundamentally altered the global landscape more significantly than the attacks themselves. The piece contends that the United States abandoned its post-Cold War principles in the aftermath, leading to consequences that have shaped the world for the past 25 years.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/onpoint/9-11-s-long-shadow", "state_media": false, "category": "オピニオン", "full_text": "OnPoint Subscriber Exclusive\nThe Big Picture brings together a range of PS commentaries to give readers a comprehensive understanding of topics in the news – and the deeper issues driving the news. The Big Question features concise contributor analysis and predictions on timely topics.\n9/11’s Long Shadow\nAs tragic as the terrorist attacks of September 11, 2001, were, it was America’s response that truly changed the world. While it is difficult to pinpoint precisely which developments over the last 25 years were caused or compounded by 9/11, it seems clear that the event led the United States to abandon the principles that, with the Cold War over, were supposed to shape a better future.", "translation_ja": "", "vocab": [{"word": "compounded", "definition": "複雑にする、悪化させるという意味。問題や困難な状況がさらに深刻になることを表します。"}, {"word": "pinpoint", "definition": "正確に特定する、明確にするという意味。具体的な原因や場所を特定することを指します。"}, {"word": "principles", "definition": "原則、基本的な信条という意味。政治や道徳の基盤となる根本的な考え方を表します。"}, {"word": "abandon", "definition": "放棄する、捨てるという意味。これまで守っていた政策や価値観を手放すことを意味します。"}, {"word": "trajectory", "definition": "軌跡、進路という意味。事柄や状況が時間とともに進む方向性や傾向を表します。"}]}, {"title_ja": "西側衰退論の虚偽の政治学", "title_en": "The False Politics of Western Declinism", "summary_ja": "西側の政治指導者たちは、富が増加しているにもかかわらず、相対的な経済力の喪失と生活水準の低下を混同させ、社会が衰退していると虚偽に描いている。トランプの保護主義的貿易政策で例示されるこの言説は、ポピュリストに国内の不満を国家主義的な恨みに変える機会を与えている。", "summary_en": "Political leaders in the West falsely portray their societies as declining despite growing wealth, conflating relative economic power loss with falling living standards. This rhetorical framing, exemplified by Trump's protectionist trade policies, provides populists an opportunity to transform domestic grievances into nationalist resentment against international order.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/western-leaders-obsession-with-declinist-narratives-could-become-self-fulfilling-prophecy-by-carl-johan-dalgaard-and-mark-medish-2026-09", "state_media": false, "category": "オピニオン", "full_text": "The False Politics of Western Declinism\nand\nPolitical leaders on both sides of the Atlantic increasingly portray the West as being in decline, even as their societies grow richer. By conflating a loss of relative economic power with falling living standards, they give populists an opening to turn domestic grievances into nationalist resentment.\nCOPENHAGEN/LONDON—As President Donald Trump plunges the United States into another reckless trade war—this time with neighboring Canada, one of its largest trading partners, and a NATO ally—the irony is hard to miss. Despite being the main architect and beneficiary of the multilateral trading system since 1945, the US under Trump has recast itself—at least rhetorically—as the victim of an allegedly unfair economic order.", "translation_ja": "", "vocab": [{"word": "declinism", "definition": "衰退が避けられないという信念や主張。西側諸国が経済的・政治的に衰退しているという論調を指す。"}, {"word": "multilateral", "definition": "3つ以上の国や団体が関与する、多国間の。国際条約や貿易システムなどの文脈で使われる。"}, {"word": "populist", "definition": "一般大衆の利益を代表すると主張し、既得権層や専門家に対抗する政治的立場。感情に訴える傾向がある。"}, {"word": "nationalist resentment", "definition": "国家主義的な反発や怨嗟。自国優先主義に基づいて、他国や国際機関への不満が生じた状態。"}, {"word": "protectionist", "definition": "自国産業を保護するために関税や貿易制限を支持する政策立場。自由貿易に対する反対姿勢。"}, {"word": "reckless", "definition": "危険性や後果を顧みない無謀な。不注意で無責任な行動や決定を表現する。"}]}, {"title_ja": "大きな視点：9月11日の世界への影響を振り返る", "title_en": "The Big Picture: Reflecting on September 11's Global Impact", "summary_ja": "著者は2001年9月11日のテロ攻撃から25年を経て、その出来事を振り返っている。3,000人近くが亡くなったこのテロ事件により、アメリカと世界に対してもたらされた深刻で広範な影響は、当時はほぼ予測不可能だったと指摘している。", "summary_en": "The author reflects on the 25th anniversary of the September 11, 2001 terrorist attacks, which killed nearly 3,000 people. The piece emphasizes that while people remember the tragic events vividly, the profound and far-reaching consequences for the United States and the world were largely unpredictable at the time.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/9-11-s-long-shadow-doc-2026-09", "state_media": false, "category": "オピニオン", "full_text": "Most people above a certain age vividly recall when, 25 years ago, terrorists used hijacked civilian aircraft to strike the symbols of American power, killing nearly 3,000 people. But no one—not even the terrorists themselves—could have predicted just how profound an impact the events of September 11, 2001, would have on the United States and the world.\nhttps://prosyn.org/oPD4CoP\nRegister an account to continue reading with a $1 trial\nPlease log in or register to continue. Registration is free.\nLog in\nRegister\nEmailrequired\nPasswordrequiredRemember me?\nPlease enter your email address and click on the reset-password button. If your email exists in our system, we'll send you an email with a link to reset your password. Please note that the link will expire twenty-four hours after the email is sent. If you can't find this email, please check your spam folder.", "translation_ja": "", "vocab": [{"word": "profound", "definition": "深い、深刻な。影響や意味が非常に大きく、深い効果をもたらすことを意味する。"}, {"word": "hijacked", "definition": "乗っ取られた。飛行機や乗り物が武装した者によって無断で奪取されることを指す。"}, {"word": "civilians", "definition": "民間人。軍隊や公務員ではない一般市民のことを指す。"}, {"word": "symbols", "definition": "象徴。特定の国や組織の力や価値を代表するもの。"}, {"word": "predicted", "definition": "予測した。将来のことを前もって言い当てることを意味する。"}]}, {"title_ja": "デビッド・ベッカムは米国サッカー殿堂入りに値する理由", "title_en": "Why David Beckham Deserves a Place in the US Soccer Hall of Fame", "summary_ja": "著者パブロ・イグレシアス・マウラーは、デビッド・ベッカムがLA銀河での選手としての実績と、指定選手ルールを通じたメジャーリーグサッカーへの変革的な影響を理由に、米国サッカー殿堂にベテラン選手として入選する価値があると主張している。ペレの米国サッカーへの影響と比較しながら、ベッカムの存在がリーグを正当化し拡大させた貢献度がブラジルの伝説的選手のそれに匹敵すると述べている。", "summary_en": "Author Pablo Iglesias Maurer argues that David Beckham merits induction into the US Soccer Hall of Fame as a veteran player, citing his playing achievements with LA Galaxy and his transformative impact on Major League Soccer through the designated player rule. Drawing parallels to Pelé's influence on American soccer, Maurer contends that Beckham's mere presence legitimized and expanded the league, making his contribution comparable to the Brazilian legend's legacy.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/football/2026/sep/10/david-beckham-us-soccer", "state_media": false, "category": "オピニオン", "full_text": "Next spring, when the US Soccer Hall of Fame welcomes its newest class, there will be pomp and circumstance. The hall, which sits in a corner of Toyota Stadium, home of Major League Soccer’s FC Dallas, will feature the enshrineds’ signature red jackets. There will be glad-handing and speeches from players and coaches, misty-eyed reflections on their upbringings and their careers.\nMany involved will be American-born soccer legends, of course. Yet every once in a while, a player whose footprint extends well beyond the borders of the United States graces the stage. Such may be the case next year when the hall potentially welcomes English legend David Beckham into the fold.\nSome readers abroad – and certainly plenty of readers here in the States – will wonder why an ostensibly American Hall of Fame would admit non-Americans, something it’s done since its inception. The answer lies in the nature of the American game itself. Even our earliest heroes – Joe Gaetjens and the like – were immigrants, with Gaetjens scoring his famed goal against England in the 1950 World Cup when he wasn’t even a US citizen (he never ended up becoming one).\nAdvance through the decades and big-name, American-born heroes do start to emerge, but they are still outpaced by those from abroad. The history of the North American Soccer League is replete with foreign-born members of the country’s hall of fame such as Pelé, Franz Beckenbauer and Carlos Alberto. Even the Major Indoor Soccer League got its due eventually: just last year, Steve Zungul, the “lord of all indoors”, was inducted. Tatu, another foreign-born legend of the arena, seems likely to go in this year.\nAll of which is to say, there’s precedent for this. If you made a sizable contribution to soccer in the United States, you’re eligible – period. It’s the way it should be.\nBy that standard, there’s no doubting Beckham’s credentials. Perhaps the most direct analog for his contributions is the career of Pelé, who arrived stateside in 1977 and transformed the landscape of the game in this country. Like Beckham’s stay with the LA Galaxy, the Brazilian’s playing career was successful. He won a league championship in 1977 and was wildly productive throughout the entirety of his stay in the US. He did every interview, signed every autograph, more or less, and went on to found a soccer camp in New Jersey that produced thousands of soccer-mad children, more than one of whom went on to feature for the US men’s national team. He remained a presence for decades after his retirement.\nStill, after all of that, professional soccer in the US more or less collapsed within seven years of his departure.\nBeckham’s playing career with the Galaxy (2007-2012) was in some ways more successful than Pelé’s. Much has been made about his tumultuous arrival in the US, so expertly told by the late, great Grant Wahl in his book The Beckham Experiment. After the smoke cleared, though, Beckham was a mainstay for the Galaxy, working alongside Landon Donovan (a Hall of Famer himself) to lead the club to a pair of league titles and two Supporters’ Shields.\nHis true effect, though, came at a league level. Major League Soccer created an entirely new roster mechanism – the designated player rule – to accommodate Beckham’s arrival, a guideline that fundamentally changed its reality. Like Pelé, scores of uninitiated fans filled MLS stadiums to see Beckham. And just as the Brazilian did, Beckham stayed well beyond the end of his playing days, eventually founding Lionel Messi’s Inter Miami, the current standard bearer of the league.\nThe Hall of Fame inducts candidates in three categories: player, veteran and builder, the last of which is reserved for those whose work was primarily off the field. Beckham’s inclusion this year comes in the veteran category, where he’s nominated alongside nine other deserving candidates. The presence of his name has been the subject of much debate among the hall’s voters, of which I am one.\nArguments against his inclusion center on the fact that, in several years, Beckham’s name seems likely to come up on a list of “builder” nominees. Certainly, helping to found Inter Miami, and luring the greatest player in history to play there, is worth considering by that standard. So if he stands a good chance of making it in that way, then why not save this spot for someone else?\nTo me, though, voting him in now is an easy decision – why wait? Beckham’s playing career alone stacks up favorably against many members of the hall. And while he is unquestionably a “builder”, so much of that work was simultaneous with his career as a player.\nHis mere presence on field legitimized a still fledgeling league and led to a decade-long boom that saw it nearly double in size. This, of course, is not solely Beckham’s doing – far from it – but I could easily make an argument that Beckham’s influence on American soccer is as big as Pelé’s – and Pelé, of course, has a place in the hall.\nSo, English-born Beckham will be ", "translation_ja": "", "vocab": [{"word": "enshrinement", "definition": "名誉ある殿堂入り、または特定の場所や施設に永遠に保存されること。スポーツの殿堂入りなど、栄光や実績を永続的に記念することを指す。"}, {"word": "precedent", "definition": "過去の例や判例。「先例」という意味で、今後の判断や決定の根拠となる過去の事例を指す。"}, {"word": "analog", "definition": "類似物、または相当するもの。比較する際に、似た特性や機能を持つ別のもの・人物を指す。"}, {"word": "mainstay", "definition": "主要な支柱、中核的な存在。組織やチームの重要な一部を形成し、安定性をもたらす人物や要素を指す。"}, {"word": "tumultuous", "definition": "激動的な、波乱に満ちた。混乱や対立が多く、不安定な状況や時期を表す形容詞。"}, {"word": "fledgling", "definition": "創設間もない、発展途上の。まだ初期段階にあり、成長段階にある組織や産業を形容する。"}]}, {"title_ja": "トランプ政権の国勢調査への干渉が米国民主主義の基盤を脅かす", "title_en": "Trump's Census Interference Threatens US Democracy's Foundation", "summary_ja": "ダナ・ボイドは、トランプ政権が強制的な退職、統計手法の制限、データの政治化、人種データ収集の廃止など憲法上の変更提案を通じて、国勢調査局の制度的独立性を体系的に損なっていると主張している。これらの行動は、政治家が単に国勢調査の結果を操作するのではなく、正確で超党派的な人口調査に依存する民主的なインフラを直接破壊する危険なシフトを示している。", "summary_en": "Danah boyd argues that the Trump administration is systematically undermining the Census Bureau's institutional independence through forced retirements, restricting statistical methods, politicizing data, and proposing constitutional changes like eliminating race data collection. These actions represent a dangerous shift from politicians merely manipulating census results to directly sabotaging the democratic infrastructure that depends on accurate, nonpartisan population counting.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/10/census-trump-congress", "state_media": false, "category": "オピニオン", "full_text": "When the constitutional architects of the United States got together, they came up with a crazy plan: “What if we count everyone in the country and allocate political representation that way?”\nIt was a radical act. Until then, censuses had been used by kings to levy taxes and conscript men into war. With the penning of article 1, section 2 of the US constitution, being counted ensured that states would get financial resources and political representatives. Congress was tasked with building the processes to anchor representation to the population. People wanted to be counted. And politicians wanted their people to be counted more.\nFor more than
