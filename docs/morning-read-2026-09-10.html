m1FbjZ4RHhraHJHNmpDTGcxNXotVTFFRlpoVmZVd2xySXdQam44QWdXWnNPOUhj?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "8月が観測史上最も暑い月と並ぶ、科学者が発表", "title_en": "August Confirmed as Joint-Hottest Month on Record, Scientists Report", "summary_ja": "科学者らが8月が観測史上最も暑い月と並んだことを確認しました。この発表は地球温暖化と世界的な気温上昇についての懸念を強調しています。記録破りの暑さは世界中で観測されている極端な気象パターンの増加傾向を続けています。", "summary_en": "Scientists have confirmed that August was the joint-hottest month ever recorded, marking a significant milestone in global temperature records. The finding underscores ongoing concerns about climate change and rising global temperatures. This record-breaking heat continues a trend of increasingly extreme weather patterns observed worldwide.", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMitAFBVV95cUxPSG1VMGJxTjFMWlJ4Ul9YSWlQSUZxNDdWcVBfSDhNRFJWWnBYbGs0c25qSkRWcHBzNU96UzRtRDZicmlXMXRIWS1Nb3dSOXREdkVzRXpJMHpmWEI2R0EzZHgyQm1IZnFSZ0dFLTJERW13aG5wcFlVaXh5NDFFRG5UdnhYRXJEeU9IQ0JyWGtZYzNPa2dWRFJ1SHRYdTJUcHVPV3FCMmliUVhlQzZHSFF3SWVheWM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イエメンのフーシ派が戦略的に重要な紅海の港湾都市モカを占領", "title_en": "Yemen's Houthis Seize Strategic Red Sea Port of Mokha", "summary_ja": "イランを背後に持つフーシ派勢力がサウジアラビア支援の政府軍からモカ港湾都市を占領し、国際的に重要な海峡まで75km以内に接近した。この占領により数千人が避難を余儀なくされ、イエメン内戦の緊張が高まり、石油価格の上昇に寄与している。フーシ派は国際海運に脅威を与えないと主張しているが、サウジアラビア船舶への脅威は継続している。", "summary_en": "Iran-backed Houthi forces have captured the strategic Red Sea port city of Mokha from Saudi-backed government forces, bringing them within 75km of a critical international shipping strait. The seizure has displaced thousands of residents and escalated tensions in Yemen's civil conflict, contributing to rising oil prices. The Houthis claim they pose no threat to international shipping but maintain threats against Saudi vessels.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4g7vr0lngwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Yemen's Houthis reportedly seize strategic Red Sea port of Mokha\n- Published\nYemen's Houthis have seized the strategic Red Sea port city of Mokha from Saudi-backed pro-government forces, military sources and witnesses say.\nMokha's capture leaves the Iran-backed group only 75km (46 miles) away from the Bab al-Mandab Strait, the southern gateway to a trade route that links Asia and Europe.\nThe Houthis said they posed no threat to international shipping but reiterated their threat to target vessels from Saudi Arabia, which has relied on the Red Sea for oil exports since the US and Israel's war effectively closed the Strait of Hormuz in the Gulf.\nThe escalation of the conflict between the Houthis, Yemen's government and Saudi Arabia has contributed to a surge in oil prices.\nHundreds of people have reportedly been killed and thousands displaced since the Houthis launched an offensive in the south-west a week ago.\nA Saudi-led coalition has also carried out air strikes on Houthi-controlled areas in western Yemen in support of the pro-government forces, and the Houthis have launched missiles and drones at cities and oil facilities in southern Saudi Arabia.\nMokha residents said Houthi fighters moved into the city after fierce clashes with pro-government forces on Wednesday night, prompting many families to flee their homes.\n\"The takeover came without warning. Panic spread throughout the area, forcing people to flee amid distressing scenes of injured people lying in the streets with no-one there to help them,\" one man told BBC Arabic's Middle East Lifeline programme.\nAnother man said that Houthi fighters were patrolling the streets of Mokha on Thursday, while government offices and shops were closed.\n\"At the moment, we don't know what Ansar Allah will do,\" he added, using the group's formal name. \"Everyone is afraid for their safety.\"\nMany displaced families are heading east towards the city of Aden, where Yemen's internationally recognised Presidential Leadership Council and government are based.\n\"We fled with our children and kept running. We have no bedding, no home, nothing with us. Everything was destroyed within an hour. They didn't even give us a chance or warn us beforehand,\" one woman told BBC Arabic.\n\"We are women with no means of defending ourselves, and we have innocent children with us.\"\nThere was no immediate confirmation of Mokha's capture from the Houthis.\nBut the group's Supreme Political Council said in a statement on Thursday that clashes had \"ceased in the western coast districts after the expulsion of Saudi enemy mobilisations\", according to Houthi-run Al Masirah TV.\nTarek Salah, leader of the pro-government National Resistance Forces, also said he had moved his command centre on the west coast to a \"safe location\".\nHe added that his forces had paid \"a heavy price in recent days in the face of a Houthi offensive that was planned and supported by Iran\".\nA Yemeni military source told AFP news agency that Houthi fighters had also seized Zuqar Island in the Red Sea, about 80km north-west of Mokha, after launching a barrage of rockets and a ground assault using boats.\nMeanwhile, the head of the Presidential Leadership Council, Rashad al-Alimi, urged Arab states and other countries to help protect Yemen's coasts and restore state control.\nThe Houthis' Supreme Political Council asserted its \"right to defend [Yemen's] sovereignty and territorial waters while simultaneously reassuring the international community that navigation in the Red Sea remains safe\".\nHowever, the Houthi-run humanitarian operations co-ordination centre also stressed that the embargo on Saudi ships remained in place.\nHouthi military spokesman Yahya Sarea said Saudi warplanes carried out 64 strikes across the western provinces of Taiz, Hudaydah, Marib and Jawf over the previous 24 hours.\nThere was no immediate comment from the Saudi military.\nHowever, the spokesman of the Saudi-led coalition of Arab states fighting in Yemen said on Wednesday evening that it would respond to a series of Houthi missile and drone attacks on the south-western Saudi cities of Khamis Mushait, Abha and Jazan.\nOn Tuesday, the Houthis launched dozens of drones and missiles at southern Saudi Arabia, injuring 73 civilians and causing fires at several oil facilities that led to a temporary halt in operations, according to Saudi authorities.\nThe Houthis said they were retaliating for dozens of Saudi air strikes on territory they control in recent days, including one on a prison in the town of Hazm in Jawf province on Monday that they said killed at least 23 civilians.\nThe Saudi-led coalition has backed Yemen's government against the Houthis in the country's devastating civil war for more than a decade.\nA four-year-old informal ceasefire began to unravel in July, when the Houthis announced a \"maritime embargo\" against Saudi Arabia and began missile and drone attacks on Saudi airports, oil facilities and tankers in the Red Sea.\nThe Houthis said they were retaliating", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や対立が段階的に激化・拡大すること。この記事では軍事衝突の拡大を指している。"}, {"word": "strategic", "definition": "長期的な目標達成のために重要な位置づけ。この場合、国際貿易や軍事的観点から重要な港を意味する。"}, {"word": "embargo", "definition": "特定の商品や国との貿易を政治的目的で禁止すること。この記事ではサウジアラビアへの海上禁止を指す。"}, {"word": "retaliate", "definition": "相手の攻撃や行為に対して報復すること。軍事的・政治的な対抗手段を講じる。"}, {"word": "displaced", "definition": "元の居住地から強制的に移動させられた状態。戦争や災害により住まいを失った人々を指す。"}, {"word": "coalition", "definition": "共通の目的を持つ複数の国や勢力が一時的に連合すること。この記事ではサウジアラビア主導の同盟を指す。"}]}, {"title_ja": "トランプ大統領は全米成人に5,000ドルを支払えるのか？", "title_en": "Can Trump Really Pay $5,000 to Every American Adult?", "summary_ja": "トランプ米大統領は、共和党が中間選挙で勝利した場合、全米成人に5,000ドルの支払いを約束しましたが、専門家はこの計画の合法性と実現可能性に疑問を呈しています。この提案には約1.3兆ドルの費用がかかり、資金源の詳細が明らかにされていませんが、副大統領は関税収入がそれをカバーできることを示唆しています。法律専門家は、このような約束が違法な投票買収に該当するか、それとも合法的な減税公約であるかについて意見が分かれています。", "summary_en": "US President Trump promised $5,000 payments to every American adult if Republicans win the midterm elections, but experts question the legality and feasibility of the plan. The proposal would cost approximately $1.3 trillion and lacks details on funding sources, though Vice President Vance suggested tariff revenue could cover it. Legal scholars are divided on whether such an offer constitutes an illegal vote-buying scheme or a lawful tax-cut pledge.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8r6vj7r8rko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Can Trump really pay $5,000 to every American adult?\n- Published\nUS President Donald Trump has offered every adult American $5,000 (£3,700) if Republicans win November's midterm elections, but it is unclear how such a plan would be funded and whether it is legal.\nHis remarks prompted raucous applause from supporters at a party convention on Wednesday night, although Democrats labelled it an \"empty promise\".\nTrump also told the Republican conference that the money would have to be spent in the US, but it is unclear how that would be monitored.\nUS Vice-President JD Vance suggested it might be paid for by tariff revenue and that such cheques would not go to wealthy Americans.\nIs Trump's offer legal?\nUnder US federal law, it is illegal to give payments that are intended to influence the way a person is voting.\nHowever, some experts have said the offer made by Trump in Texas on Wednesday could be seen as a pledge to cut taxes, which is legal.\nDr Joan Mahoney, lecturer in law at the University of Southampton, told the BBC she thought the offer would be legal, though she said politicians \"don't usually do it quite this explicitly\".\n\"On the one hand it sounds a bit like a bribe, vote for the Republicans and you'll get money, which would be decidedly illegal,\" she said.\n\"But on the other hand it would go to everyone, regardless of how they voted so it isn't in that sense a bribe.\n\"I think it would be legal. It's the same kind of campaign pledge as saying 'if my party wins we'll reduce taxes'. Every party does that all the time... and that's obviously perfectly legal.\"\nHowever, Laurel Rapp, director of the US and North America programme at Chatham House, told the BBC that Trump's offer seemed to be \"a very different, very transactional agreement\" from the kind of promise usually made by candidates in an election period.\nHow much would it cost?\nAside from the question of legality, some have also asked whether Trump's offer would be feasible financially in the context of increasing US debt, partially as a result of the war in Iran.\nThere are nearly 270 million American adults, meaning a $5,000 payout would cost the US government some $1.3 trillion.\nTrump gave no details on how such cheques would be funded.\nCongress authorises spending in the US, but the president did not say whether he planned to ask for legislative approval for any payments.\nAnd legal experts said it was unlikely he could approve such a vast sum via a presidential executive order.\nErica York, a senior economist at the Washington DC-based Tax Foundation, told the BBC she would be \"extremely surprised\" if Congress approved any proposal.\n\"This would be one of the worst ways to use $1.3 trillion,\" she said.\n\"We're on a very unsustainable track, with deficits only projected to grow and grow,\" York added.\nCould tariff revenue fund it?\nSpeaking to Fox News after Trump's speech, Vice-President Vance indicated that the payments could be funded by money raised by the president from tariffs.\nHowever, such revenue to date falls far short of the money that would be needed to account for Trump's $5,000 cheques offer.\nAccording to the Bipartisan Policy Center, the US has brought in around $475bn in tariff and excise tax revenue since the beginning of 2025.\nBut more than $100bn has been refunded after the Supreme Court struck down many tariffs earlier this year.\nWhen asked how the payouts could work, the White House said in a statement to the BBC: \"The doomers and naysayers have consistently doubted President Trump.\"\n\"With the continued support of the American people, President Trump will keep delivering real results,\" added spokesman Davis Ingle.\nWhy has Trump made the offer?\nOne former Republican strategist and pollster said Trump's latest offer should be firmly seen in the context of an election that is now less than two months away.\n\"It is an extraordinary promise, and I'm not sure where that money is going to come from - but it is campaign season,\" Robert Moran told the BBC.\nChatham House's Rapp said Trump was thinking short term to try to keep hold of Congress as he enters the final two years of his term in office.\n\"Money is something that he is now resorting to because the polling is not looking good for Republicans and the polling is not looking good for him,\" she continued.\nHas anything similar happened before?\nTrump has previously proposed $2,000 cheques to be funded by tariff revenues, but those payouts have not materialised.\nFormer President Joe Biden was accused of buying votes when he promised $2,000 Covid stimulus cheques for Americans if Democrats won Senate elections in Georgia in January 2021.\nA similar controversy arose ahead of the 2024 presidential election, during which billionaire Trump supporter Elon Musk offered cash incentives to registered voters in seven swing states who signed a certain petition.\nAdditional reporting by Bernd Debusmann Jr, White House reporter\n  - Published18 hours ago\n  - Published21 hours ago", "translation_ja": "", "vocab": [{"word": "raucous", "definition": "大きくて耳障りな音、または騒々しい様子を表します。この記事ではトランプ支持者による大きな歓声と拍手を意味しています。"}, {"word": "transactional", "definition": "取引や交換に基づいた関係を示す形容詞です。政治的な約束が単なる取引のように見えることを表現しています。"}, {"word": "feasibility", "definition": "計画や提案が実現可能であるかどうかを検討する名詞です。この文脈では、トランプの提案が実行可能か否かを議論しています。"}, {"word": "unsustainable", "definition": "長期的に維持または継続することができない状態を表す形容詞です。米国の財政赤字が持続不可能な状況にあることを指しています。"}, {"word": "materialized", "definition": "計画や約束が実際に実現する、または具体的な形を持つようになることを意味する動詞です。この記事ではトランプの以前の公約が実現しなかったことを述べています。"}, {"word": "incentive", "definition": "人々に特定の行動を取るように動機付けるための報酬や奨励を意味します。この文脈ではマスク氏が有権者に現金を提供することを指しています。"}]}, {"title_ja": "アマゾン貨物機がマイアミ墜落前に速度超過を警告、データが示す", "title_en": "Pilot warned Amazon cargo plane going too fast before Miami crash", "summary_ja": "マイアミで発生したアマゾン貨物機の墜落事故に関するフライトデータから、機長が着陸前に繰り返し速度超過を警告していたことが明らかになった。ボーイング767-300は着陸時に時速158ノットで移動していたとき、自動安全警告が発動された。事故により地上作業員5名が殺害された。", "summary_en": "Flight data from an Amazon cargo plane crash in Miami shows one pilot repeatedly warned about excessive speed before the aircraft overshot the runway. The Boeing 767-300 was traveling at 158 knots during landing when automated safety warnings sounded, including alerts about sink rate and terrain proximity. Five ground crew members were killed in the incident.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cj4jynv59ddo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Pilot warned Amazon cargo plane going too fast before deadly crash, data shows\n- Published\nA pilot onboard an Amazon cargo plane that crashed in Miami, Florida, on Sunday noted it was going too fast before it overshot a runway, crashed into other vehicles and burst into flames, new flight data shows.\nThe investigation update from the US National Transportation Safety Board (NTSB) said one pilot warned the other in the cockpit multiple times about \"the aircraft's excessive speed\" but noted \"there was but not a consistent verbal response\", even as an altitude alarm sounded.\nThe Boeing 767-300's landing speed was 158 knots (292km/h), which experts have noted was on the high end.\nThe NTSB is leading the investigation into the crash that killed five people and injured five more.\nThe flight data released by NTSB included the plane's speed, altitude, and other details like flap deployment as it approached the runway. The update also included the summary of conversation between the two pilots.\nThe summary noted the pilot's cautions about speed occurred \"throughout the remainder of the recording\" as did the inconsistent verbal response.\nThe update said there was an electronic \"sink rate sink rate\" callout during the final minutes - an automated safety warning about the speed of descent.\nThere was also an electronic \"too low terrain\" callout, another automated verbal warning that the plane was flying too close to the ground without being properly prepared for landing.\nAviation attorney Pablo Rojas told CBS News, the BBC's US partner, that it was difficult to know without the actual recording what the NTSB was referring to when it noted the inconsistent verbal response.\n\"But, it really confirms that this was, in a way, a doomed approach,\" he said.\nRojas noted that flap deployment data included in NTSB's update also could be an area of concern. The flaps, located on the back of the wings, are \"part of what helps the plane kind of slow down and gently approach a landing\", he said.\n\"The flap deployment here happened much later in the accident sequence,\" Rojas said. \"That's maybe because the pilots were responding to the fact that they were going too fast.\"\nAfter it overshot the runway, the plane - Amazon Prime Air Flight 7598 - struck equipment on the ground, hit a white Ford van, then continued onward through a perimeter fence.\nIt then collided with a Toyota Corolla, before coming to rest about 1,300ft (394m) beyond the runway.\nThe five who died were part of a plane-cleaning crew in the van. Miami authorities on Tuesday identified them as Rolando Aleman Leon, 55; Yoel Rodriguez Naranjo, 53; Julio C Pineda, 75; Carlos Acosta Fajardo, 53; and Javierkys Reyes Quevedo, 47.\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "overshoot", "definition": "予定地点を超えて行き過ぎることを意味する。航空用語では、滑走路の端を超えて着陸してしまう状況を指す。"}, {"word": "flap deployment", "definition": "航空機の翼後部にあるフラップを展開させることで、着陸時に機体を減速させるために使用される。"}, {"word": "sink rate", "definition": "航空機が降下する速度を示す用語。安全な着陸には適切な降下率が必要であり、過度な降下は危険を示す。"}, {"word": "perimeter fence", "definition": "施設や区域の周囲に設置される境界を示すフェンス。空港ではセキュリティと安全のため滑走路周辺に配置される。"}, {"word": "inconsistent", "definition": "一貫性がない、矛盾している状態を示す。ここでは、パイロットからの返答が統一されていなかったことを意味する。"}, {"word": "automated safety warning", "definition": "危険な状況を検出したときに自動的に作動する安全警告システム。パイロットに直ちに対応を促すための装置。"}]}, {"title_ja": "イングランドの労働党首長、観光税を5%に上限設定することを約束", "title_en": "Labour mayors in England vow to cap tourist tax at 5%", "summary_ja": "イングランドの労働党系地域首長は、宿泊施設への新しい観光税を自発的に5%に上限設定することを約束し、この税が雇用に脅威をもたらす可能性があるという接客業界の懸念に対応した。政府は地域指導者がホテルなどの宿泊施設の利用客に手数料を課す権限を与える法案を導入する予定で、その収益は地域に再投資される。保守党と改革英国党の首長はこの措置に反対する可能性が高く、業界団体はこれが家族休暇の費用に100～120ポンド追加される可能性があると警告している。", "summary_en": "Labour regional mayors in England have pledged to voluntarily cap a new tourist tax on overnight accommodation at 5%, responding to concerns from hospitality businesses that the levy could threaten jobs. The government plans to introduce legislation allowing local leaders to charge visitors a fee on hotel and accommodation stays, with the revenue reinvested in local areas. Conservative and Reform UK mayors are likely to oppose the measure, while industry groups warn it could add £100-£120 to family holiday costs.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3wjnv3z8nxo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Labour mayors in England vow to cap tourist tax at 5%\n- Published\nLabour's regional mayors in England have pledged to cap a new fee on visitors' overnight stays at 5%, after hospitality bosses warned it could put jobs at risk.\nLocal leaders are set to gain new powers to charge an uncapped levy, dubbed a \"tourist tax\", as a percentage of the cost of hotels, bed and breakfasts and other types of accommodation.\nBut the Labour mayors in 10 city regions said they would voluntarily limit the charge if they do apply it, adding that they had listened to concerns over costs.\nReform UK's two regional mayors and the two Conservative ones are likely to oppose any levy given criticism from their national parties of the policy.\nIn a letter to Chancellor John Healey and Local Government Secretary Angela Rayner, the Labour metro mayors said 5% represented a \"reasonable ceiling\" on the tax.\n\"It provides a balance of ensuring that local levies are not excessive, or vary significantly between regions, while also leaving room for local variation as appropriate,\" they added.\nThey added this would still allow for \"meaningful investment\" in local areas, whilst stressing any future levies in their areas would be \"subject to local consultation\".\nThe letter was signed by Labour mayors in London, Greater Manchester, Liverpool City Region, West Midlands, North East, West of England, West Yorkshire, South Yorkshire, East Midlands and York and North Yorkshire.\nThe government had earlier pledged to protect budget holidays \"by making sure low-cost accommodation always pays lowest levy\" and said the extra cash could be invested in high streets and local transport.\nWhile Labour mayors have backed the new levy, others have expressed caution or signalled they will not bring it in.\nLocal leaders, including heads of Foundation Strategic Authorities where there is no mayor, will need to clarify by early 2028 how the revenue raised should be reinvested.\nThey will also be allowed to offer exemptions, such as for campsites.\nHowever, mayors will not be allowed to exempt whole localities within their regions from the tax, to avoid creating confusion for visitors and businesses.\nThe government said it would introduce a bill to Parliament \"in due course\" to bring in the levy, which would apply to both Britons and people visiting from abroad.\nAnother cost for family holidays\nLeading trade body UKHospitality has hit back, saying the levy means \"jobs are now at risk\".\nIts chief executive Allen Simpson claimed it would add about £100 to £120 on average to the cost of a family holiday in England, amid fears mayors would make use of the fact there is, in theory, no upper limit for the levy.\n\"We know, don't we, that local government is struggling for funds - it was hit very hard by austerity,\" he told BBC Radio 4's Today programme.\n\"If you only devolve one tax raising power, of course local mayors are going to pull that lever until it snaps.\"\nHe added: \"It will be the case that you'll have holiday parks which can't open in the shoulder seasons [between peak and low season] and of course people who go on holiday will just have that little bit less money in their pocket.\"\nConservative shadow housing secretary David Simmonds said: \"VAT is already charged at 20% on hotels - much higher than in other countries - and now they'll pay VAT on this tourism tax too: a Labour double whammy.\"\nReform UK leader Nigel Farage said his party's two mayors in Greater Lincolnshire and Hull and East Yorkshire \"won't touch\" the levy, which he described as a \"holiday tax\".\nThe idea was first raised under former Prime Minister Sir Keir Starmer in November and is similar to schemes running in Scotland and European destinations.\nTwo cities in England already run their own voluntary schemes - a £1 per room, per night City Visitor Charge in Manchester, introduced when Burnham was mayor of the region, and a £2 nightly charge in Liverpool. These are business-led schemes where hotels choose to pool the money raised to support local tourism.\nUntil now, regional mayors have not had the power to bring such fees in themselves - but they argue it is needed to boost economic growth.\nConservative Mayor of Tees Valley Ben Houchen ruled out, external introducing any tourist tax last year.\nJohn Chappell, who runs five caravan parks in Skegness, Lincolnshire, told BBC Your Voice that many English tourist resorts have visitors on tight budgets already struggling with the cost of car travel.\nHe said an extra cost would \"kill the industry off\".\n\"Tourists are the saviours of our resorts, not the demons and ill thought-out ideas like these show how out of touch with reality politicians are,\" he added.\nThe taxes are common in Europe and the rest of the world, with New York, Amsterdam and Rome applying overnight charges to accommodation stays to fund local services. However, they are capped in several European cities.\nIn Scotland local authorities can charge a visitor levy on overnight accommodation. In Edin", "translation_ja": "", "vocab": [{"word": "levy", "definition": "政府や地方自治体が法律に基づいて課す税金や手数料。ここでは観光客から宿泊料に対して徴収される税のこと。"}, {"word": "devolved", "definition": "中央政府から地方政府に権限や責任を移譲すること。地方分権の文脈で使われる。"}, {"word": "exemptions", "definition": "特定のもの、人、または場所が税金や規則から除外されること。キャンプ場などが観光税の対象外になるケースを指す。"}, {"word": "austerity", "definition": "政府が支出を削減する政策。経済危機時に財政を引き締めることをいう。"}, {"word": "shoulder seasons", "definition": "観光シーズンのピークと低シーズンの間の時期。繁忙期ほど収入がない観光業の時期のこと。"}]}, {"title_ja": "内務大臣、反移民デモに対して警察に全権力使用を指示", "title_en": "Home Secretary Directs Police to Use All Powers Against Anti-Migrant Protests", "summary_ja": "シャバナ・マハムード内務大臣は、ドーバーとポーツマスの反移民デモに対処するため、警察に全ての権力を駆使するよう指示しました。警察は特定地域でのマスク着用禁止権を使用することを検討しています。政府は警察がより充実した情報収集を行い、あらゆる犯罪行為に対して厳格に対処することを期待しています。", "summary_en": "Home Secretary Shabana Mahmood has instructed police to use all available powers to handle anti-migrant protests in Dover and Portsmouth, calling the demonstrations unacceptably disorderly. Police are now considering using recently-granted powers to ban face coverings in specific areas. The government expects police to make better use of intelligence and deal robustly with any criminal offences.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqjke44pr7zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Use all powers necessary on anti-migrant protests, home secretary tells police\n- Published\nHome Secretary Shabana Mahmood has told police chiefs that lessons must be learned from how they handled last weekend's anti-migrant protests in Dover and Portsmouth - saying she expects officers to use all powers necessary.\nIn a meeting on Thursday she asked for reassurance that plans were in place for the police to move quickly and effectively in dealing with far-right groups seeking to intimidate communities.\nIt comes after masked activists brought Dover to a standstill on Saturday and in a protest on Sunday in Portsmouth about 200 people tried to block migrants being driven away for processing.\nIn a summary of the meeting, the Home Office said the protests brought \"unacceptable disorder\".\n\"These scenes have caused disruption for people and, given that people are dressed in black wearing balaclavas, there is a fear factor and obvious malign intent being communicated to our residents,\" the Home Secretary said.\n\"This makes it different from other protests, so we need to make sure we are learning lessons.\"\nThe BBC understands that police chiefs are now actively considering using recently-granted powers to completely ban face coverings in specific areas, in light of that demonstration.\nSaturday's protest was followed 24 hours later with another in which men blocked the only road out of Langstone Harbour, near Portsmouth, after the RNLI had brought ashore 120 migrants.\nIt's unclear at this stage whether further such protests will go ahead - but in some areas of England local groups that have associated themselves with the Patriot Platform umbrella group have called for more demonstrations.\nThe meeting discussed the emergence of Patriot Platform with ministers believing the group aims to intimidate communities.\nMahmood is said to have told police chiefs to make better use of intelligence to make sure they had better plans in place ahead of this weekend.\nThat call came after Kent Police had earlier admitted it had been made aware of a potential demonstration in Dover but had not \"fully assessed\" the warning before the town's nationally critical port road was brought to a standstill.\nDuring the meeting, Mahmood is said to have made clear the government expected police to make full use of powers and to deal robustly with any criminal offences.\nSpeaking after the meeting, Deputy Chief Constable Andy Mariner, the National Police Chiefs Council lead for public order, said forces were \"continually assessing and preparing for protests and any potential impact on public safety\".\nThis includes working closely with \"local forces, specialist teams, communities and partners\" to ensure support is available when needed.\nHe added: \"Our priority is to keep people safe, maintain public order and support the right to peaceful and lawful protest. While people are entitled to express their views, anyone committing criminal offences can and should expect police action.\"\nMajor changes to protest law in the last three years mean officers can now intervene more quickly to end demonstrations that block critical national infrastructure, such as roads to ports.\nThey can also designate an entire area a face mask-free zone for the duration of a protest.\nIt's that second power that police chiefs are now considering using.\nPolice chiefs also say they have initiated an \"enhanced and co-ordinated\" approach to gathering as much intelligence as possible in the days ahead.\n  - Published3 days ago\n  - Published3 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "unacceptable disorder", "definition": "容認できない混乱や無秩序な状態を指します。公式な場面で、政府や当局が社会不安や秩序の乱れを厳しく批判する際に使われる表現です。"}, {"word": "malign intent", "definition": "悪質な意図や害を与えようとする目的を意味します。単なる悪意ではなく、他者を傷つけたり威嚇したりする明確な目的があることを示します。"}, {"word": "designate", "definition": "公式に指定する、任命するという意味です。政府や当局が特定の区域や役割を正式に定めるときに使う法律用語です。"}, {"word": "infrastructure", "definition": "基盤となる重要な施設や設備を指します。道路、港、空港など、社会の機能に不可欠な構造物全般を意味します。"}, {"word": "robustly", "definition": "強く、断固として行動することを意味します。警察が犯罪に対して力強く対処する姿勢を表す副詞として使われます。"}, {"word": "intelligence", "definition": "ここでは情報収集活動や秘密情報を指します。警察や当局が事前に得る情報で、予防的な対応に役立つものです。"}]}, {"title_ja": "バイユー・タペストリーがロンドンの大英博物館で初公開", "title_en": "Bayeux Tapestry displayed in UK for first time at British Museum", "summary_ja": "1066年のノルマン征服とヘイスティングスの戦いを描いた11世紀の刺繍「バイユー・タペストリー」が、作成以来初めてイギリスで公開されました。フランスの本拠地の改修中にこの歴史的美術品が大英博物館に貸与されています。歴史愛好家から興奮の声が上がる一方で、高い費用と極端な行列の問題が指摘されています。", "summary_en": "The Bayeux Tapestry, a 70-meter 11th-century embroidery depicting the Norman Conquest and Battle of Hastings in 1066, has gone on public display in the UK for the first time since its creation. The historic artwork is being loaned to the British Museum while its usual home in Normandy undergoes renovation. Despite excitement from history enthusiasts, some critics noted accessibility issues due to high costs and extreme queuing.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c158k4p22xwo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Bayeux Tapestry unveiled to UK public for first time at British Museum\n- Published\nThe Bayeux Tapestry has gone on public display in the UK for the first time since it was created nearly 1,000 years ago.\nIt was originally embroidered in England but kept for centuries in France, and tells the story of the Norman conquest of England and the Battle of Hastings in 1066.\nThe 70m (230ft)-long 11th Century tapestry is being loaned to the British Museum while its usual home in Normandy, France undergoes renovation.\nDoors at the museum opened at 10:00 BST, with shield-wielding re-enactors in costumes from the era waiting outside.\nIt's a loan almost 100 years in the making, but despite some opposition in France to it being moved, the French Culture minister recently said it arrived in a \"wonderful state\".\nHistory buffs arrived early en masse to catch a glimpse of the opening.\nAdrian Harris told BBC News that it was a \"real privilege\" to be one of the first members of the public to see the tapestry in England.\n\"I'm not a very emotive or expressive person but I was absolutely blown away by it,\" he said, moments after seeing the tapestry.\nHe described how he was taken aback when he had an uninterrupted view of it at the top of stairs at the start of the exhibition.\nSerena Smith took a tour inside the museum before her slot at 11:30 BST.\nWhen she bought her ticket, she was 4,000th in the queue, despite clicking on a link moments after receiving an email from the British Museum.\n\"I want you to write that I was first in the queue [today],\" she stressed.\nArmed with 24 pages of annotated notes, she said she was looking forward to trying to recognise the Normans from their round haircuts, and seeing their boats on board the ships they use to reach the English shores.\nCecilia and Fabio Zanini were completely wowed by the scale of the Bayeux Tapestry.\n\"I was amazed by the vibrancy of the colours. The detail of the characters,\" Cecilia said. \"It gave both of us goosebumps.\"\nFabio said he was constantly looking left and right to see all the action and he was surprised by the scale of the tapestry, particularly the number of Norman boats and cavalry.\n\"It feels like you're in the battlefield,\" he added, praising the \"real sense of movement\" in the embroidery.\n\"It really allowed you to go back to 1066.\"\nBut others told the BBC the event was \"out of reach\" because of its cost and London location.\nAngie in Leeds said the \"historic event\" was \"out of reach for many, many families in the north\" when you factor in the cost of train tickets and food costs on top of the museum tickets themselves.\n\"London-only cultural events alienate many families north of Watford,\" she added.\nAnother man spoke of the \"extreme queuing\" required to view the exhibit. Hadyn Blakeston said he felt like he was on a \"conveyor belt\" while moving along the tapestry.\n\"It's one long queue,\" he said. \"I know we're supposed to love queuing, but it was extreme queuing.\"\nThe tapestry has been inspiring artists since the Middle Ages.\nIts July journey from Bayeaux in Normandy to central London - similar to that made across the channel by William of Normandy with his army - was made in the dead of night in a special protective case, to avoid pothole damage, as the BBC's Culture Editor Katie Razzall reported.\nThe artwork depicts in 58 scenes events leading up to the Battle of Hastings and Norman Conquest of England in 1066.\n'Nothing could have prepared me for my first look at the tapestry' - writes BBC Culture editor, Katie Razzall\nRazzall said she had been preparing for the exhibition for months.\n\"I've read books and studied photographs of the tapestry. I was even lucky enough to witness the carefully choreographed unfurling from its case a few days after its arrival from France.\n\"But nothing prepared me for how I felt when I looked down on it for the first time, stretching the full length of the gallery,\" she added.\nMichael Lewis, one of the four curators for the exhibition, told the Press Association: \"1066 is, of course, one of the most important events in English history, and the tapestry is the ultimate reflection of that in terms of a visual narrative.\n\"Some people see it as akin to a graphic novel or a cartoon or something like that, it's immediately recognisable.\"\nHe described France allowing it to come to the UK and be displayed at the British Museum as \"an enormous act of diplomacy\".\nTickets to the exhibition are sold out until the next release on 21 October.\nThe Bayeux Tapestry is at the British Museum until 11 July 2027.\nRelated topics\n  - Published17 hours ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "embroidered", "definition": "針と糸で布に図柄や装飾を施すこと。本来的には手工芸品を指しますが、ここでは歴史的な刺繍芸術作品を説明するのに使われています。"}, {"word": "diplomacy", "definition": "国家間の外交的交渉や関係構築。ここではフランスがイギリスに重要な文化遺産を貸与することの政治的・外交的意義を示しています。"}, {"word": "alienate", "definition": "人々を疎外する、除外する、または距離を置かせることを意味します。ここでは地理的・経済的理由により特定地域の人々が文化的イベントにアクセスできない状況を表現しています。"}, {"word": "vibrancy", "definition": "色彩や音の鮮やかさ、生き生きとした活発な様子を指します。ここでは古い刺繍作品の色彩が予想外に鮮明で生き生きしていることを表しています。"}, {"word": "curators", "definition": "美術館や博物館などで収蔵品の選定、保存、展示を管理する専門家のこと。展示会の企画や解釈を担当します。"}, {"word": "loaned", "definition": "一時的に貸与する、返却を前提に他者に物を貸すことを意味します。ここでは重要な文化遺産が期間限定で貸与されている状況を示しています。"}]}, {"title_ja": "アルジェリア、敵対的行為を理由にUAEとの外交関係を断絶", "title_en": "Algeria Cuts Diplomatic Ties with UAE Over Hostile Acts", "summary_ja": "アルジェリアは木曜日、挑発的かつ敵対的な行為を理由にアラブ首長国連邦との外交関係を断絶し、金曜日からUAEに対する領空を閉鎖すると発表した。この決定は、北アフリカとサヘル地域におけるUAEの影響力拡大をめぐる数年間の緊張関係に続くもので、アルジェリアはアブダビがリビア、マリ、スーダンなどの国を不安定化させていると非難している。UAEの外務省はこの決定が一時的なものであることを望むと表明し、理性と明確なコミュニケーションに基づいた対話を求めている。", "summary_en": "Algeria severed diplomatic relations with the United Arab Emirates on Thursday, citing provocative and hostile actions, and will close its airspace to the UAE starting Friday. The move follows years of tension over the UAE's expanding influence in North Africa and the Sahel region, with Algeria accusing Abu Dhabi of destabilizing countries like Libya, Mali, and Sudan. The UAE's Foreign Ministry expressed hope the decision would be temporary and called for dialogue based on rationality and clear communication.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/algeria-cuts-diplomatic-ties-with-uae/a-79222141?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Algeria cuts diplomatic ties with UAE\nSeptember 11, 2026\nAlgeria severed diplomatic ties with the United Arab Emirates on Thursday, citing what it described as \"provocative and hostile acts.\"\nThe Algerian Defense Ministry said the country would close its airspace to the UAE beginning on Friday.\nHowever, commercial flights to and from Algiers will be allowed to continue until the end of 2026.\nRelations between the two countries have been strained for years over the UAE's expanding influence in northern and western Africa.\nWhat did Algeria and the UAE say about the decision?\nThe Algerian Foreign Ministry said that it had made the decision \"after exhausting all avenues to preserve bilateral relations\" with the Gulf country.\nIt added that the UAE had \"persisted in its actions, reaching a point where they could no longer be considered acceptable or tolerable.\"\nAlgiers said it had given the UAE's ambassador 48 hours to comply with the decision to cut ties.\nThe Emirati Foreign Ministry said that it hoped that the decision would be temporary.\n\"The UAE expresses hope that this decision will be temporary, in a manner that preserves the fraternal ties between the two brotherly peoples,\" the ministry said in a statement.\nIt said that it \"affirms the UAE's appreciation for the brotherly Algerian people and its pride in the bonds that unite the two peoples, particularly through the Algerian community residing in the UAE and Algerian visitors.\"\nFollowing the announcement, Anwar Gargash, the diplomatic advisor to UAE leader Mohamed bin Zayed Al Nahyan, said that diplomatic relations should be based on \"rationality, communication and clarity of interests\" rather than \"riddles and signals that require decoding.\"\nHe did not explicitly mention Algeria in his post on X.\nWhat are the tensions between Algeria and the UAE?\nAlgeria has in the past accused Abu Dhabi of working to destabilize countries in northern Africa and the Sahel such as Libya, Mali, and Sudan.\nThe UAE has been accused of supporting the RSF paramilitary in Sudan's civil war, a charge it denies.\nIt also backs former warlord Khalifa Haftar's Tobruk-based administration in eastern Libya, a rival to the UN-recognized government in Tripoli.\nIn July, Algerian President Abdelmajid Tebboune harshly criticized the UAE for its influence in other countries, saying \"wherever they set foot, blood flows.\"\n\"We want them to stay away, so that blood does not flow in our country.\"\nAlgeria also severed its diplomatic ties with neighboring Morocco in 2021, accusing Rabat of supporting Amazigh separatists in the coastal Kabylia region and amid longstanding tensions over the territory of Western Sahara.\nEdited by: Zac Crellin\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "sever", "definition": "関係や結びつきを完全に断つこと。外交関係の文脈では、国家間の公式な関係を終わらせることを意味する。"}, {"word": "provocative", "definition": "意図的に他者を怒らせたり、対立を引き起こそうとする行為や言動。外交では敵対心を刺激する行動を指す。"}, {"word": "bilateral", "definition": "二国間の、または二者間の関係や合意を指す。国際関係では二つの国家間の相互関係を意味する。"}, {"word": "paramilitary", "definition": "正規軍ではなく、軍事的な訓練と組織を持つ民間武装集団。政府系または非政府系の軍事力を指す。"}, {"word": "destabilize", "definition": "国や地域の政治的・社会的安定を損なわせること。不安定な状態を意図的に作り出す行為。"}, {"word": "exhaust", "definition": "あらゆる可能性やオプションを試し尽くすこと。外交では、平和的な解決手段をすべて試したことを意味する。"}]}, {"title_ja": "スイス東部でコーチバスが衝突、複数人が死亡", "title_en": "Several killed in coach crash in eastern Switzerland", "summary_ja": "2026年9月10日、スイスのグラウビュンデン州にあるスッシュ近郊の山岳地帯で、オランダからの観光客を乗せたバスが事故を起こし、複数人が死亡した。バスはスッシュとツェルネツ間の道路でガードレールに衝突し、乗客は約48人だったと報道されている。スイス当局は複数のヘリコプターを投入して救助活動を行い、徹底的な調査を約束した。", "summary_en": "A tourist coach carrying Dutch passengers crashed near the alpine village of Susch in Switzerland's Graubünden canton on September 10, 2026, resulting in multiple fatalities. The bus collided with a guardrail between Susch and Zernez around 4:45 p.m. local time, with approximately 48 people reportedly on board. Swiss authorities launched a comprehensive rescue operation involving multiple helicopters and pledged a thorough investigation.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/several-killed-in-coach-crash-in-eastern-switzerland/a-79221766?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Several killed in coach crash in eastern Switzerland\nSeptember 10, 2026\nSeveral people were killed and others injured in a tourist bush crash near the alpine village of Susch in Switzerland's eastern canton of Graubünden, police said on Thursday.\nLocal police said that emergency response teams had been dispatched to the site of the crash.\nDutch media reported that the bus was carrying tourists from the Netherlands.\n\"These are Dutch customers of [Dutch tour operator] OAD. We cannot yet say how many people have been killed or injured,\" a spokeswoman for Dutch travel association ANVR told the newspaper De Telegraaf.\nDe Telegraaf reported that 48 people were aboard the bus. The number has not been confirmed by police.\nThe crash occurred on the road between Susch and the nearby village of Zernez, where the bus collided with a guardrail around 4:45 p.m. local time (1445 UTC), according to Swiss broadcaster SRF.\nThe broadcaster reported that multiple helicopters were deployed as part of rescue operations.\nSwiss President Guy Parmelin expressed his condolences in a post on X.\n\"I am deeply shocked and dismayed by today’s tragic accident involving a Dutch coach in Graubünden,\" he said. \"I offer my sincere condolences to the families of those who lost their lives.\"\n\"The relevant Swiss authorities will ensure that a comprehensive and thorough investigation is carried out to establish all the circumstances surrounding this accident.\"\nMore to come…", "translation_ja": "", "vocab": [{"word": "dispatch", "definition": "緊急時に（人や物を）現地に急速に送ること。ここでは緊急対応チームを事故現場に派遣することを意味する。"}, {"word": "guardrail", "definition": "道路の側面に設置された安全柵。車両が道路外に飛び出すのを防ぐための金属製またはコンクリート製の安全施設。"}, {"word": "condolences", "definition": "誰かの死亡や悲劇に対して表明される同情と悲しみ。通常、公式な場面で遺族に対して述べられる。"}, {"word": "comprehensive", "definition": "広く包括的で詳細な。何かについてすべての側面を含む、または完全にカバーしていることを示す。"}, {"word": "alpine", "definition": "アルプス山脈またはその他の高い山々に関連する。高山地帯の気候や地形を特徴とする地域を表す。"}]}, {"title_ja": "デジタルデータの吸血鬼：テック企業が私たちのプロフィールで取引する仕組み", "title_en": "Digital Data Leeches: How Tech Companies Trade on Our Profiles", "summary_ja": "テック企業はユーザーの十分な同意なしにアプリから機密個人データを収集・販売しており、デーティングアプリGrindrがユーザーのHIV陽性状態を共有したとして€3000万で和解した事例がある。EUはGDPRなどの厳格なデータ保護規制を導入しているが、GoogleやMetaに課せられた罰金は企業の利益に比べて相対的に小さく、執行が効果的でない。", "summary_en": "Tech companies are collecting and selling sensitive personal data from apps without users' full consent, as exemplified by a €30 million settlement with dating app Grindr over allegedly sharing users' HIV status. The EU has implemented strict data protection regulations like GDPR, but fines imposed on tech giants like Google and Meta are relatively small compared to their profits, making enforcement ineffective.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/digital-data-leeches-trading-on-our-profiles/a-79219770?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "Digital data leeches: trading on our profiles\nSeptember 10, 2026\nEveryone has secrets. Things they wouldn't tell just anyone – except, perhaps, their dating app. What sort of partner they're looking for. Where they go to look for them. Their sexual preferences, maybe, or details about their health.\nThis information is meant to help the app find suitable matches. Selling the details on to other companies is not in the users' interest.\nBut this is what allegedly happened with Grindr, a dating app explicitly aimed at the LGBTQ+ community. Around 12,000 app users in Britain sued the company, which they said had shared highly sensitive personal information with advertisers — even, in some cases, a user's HIV status.\nThe lawsuit, filed in 2024, was settled earlier this week. Grindr has agreed to pay the claimants a total of 26 million pounds (€30 million; $35 million) – but stresses that this is not an admission of liability. Grindr continues to dispute the allegations, there has been no legal judgement.\nWhat happens to the data you entrust to apps?\nThis latest case is just one of many that raise the bigger question of what actually happens to the information we entrust to our apps on a daily basis.\nFor users, an app is primarily just a helpful product. But they are often supported by cloud services, analysis tools, advertising networks and other service providers. They save and transfer data, link and analyse it — often contrary to our interest.\nJan Penfrat, a digital policy expert, says that many of the big tech companies want to \"make it as difficult as possible for users and regulatory authorities to understand what data is gathered on our devices by which players, and for what purpose.\"\nPenfrat works for European Digital Rights (EDRi), a European network of NGOs and experts that campaigns to defend fundamental rights and freedoms in the digital realm.\nWe all know what it's like: An app, a messenger service, for example, is quickly installed, and when it asks if it has permission to use personal data, users will often just click \"yes.\"\nPhone numbers are stored on servers — without approval\nBut the devil is in the detail. When you install WhatsApp, for example, you give it access to all the contacts in your smartphone. The phone numbers are transferred to the server — including those of people who don't use WhatsApp themselves, and who have not given permission for their contact details to be passed on.\n\"All of this flows into an enormous profile,\" says Penfrat.\nCompanies like Google then offer so-called \"targeting\" products based on this data.\n\"This means a car or clothes manufacturer can say: I'd like to address these target groups, and I want my advertising to appear in their Google search, Google Mail, or any of the hundreds of millions of third-party websites with integrated Google advertising,\" Penfrat explains.\nSelling data profiles\nGoogle is just one of many companies that offer data profiles. Two types of data feed into these profiles. One is the data that every user voluntarily discloses when they state something in their profile, or upload private photos.\nBut in addition, many big tech companies have for years now made assumptions based on the data they receive.\n\"If they have access to my location data and know where I usually am at night, they can assume that this is my home address,\" Penfrat says.\n\"If, for example, it's in a very expensive part of town, they can immediately make assumptions about my income. If they see: Oh, he has geolocation switched on and he regularly goes to a gay club, then he's probably a member of the LGBTQ community. And all this goes straight into the profile.\"\nStrict regulation in Europe\nThe EU already has one of the strictest data protection regulations in the world. The General Data Protection Regulation (GDPR) aims to protect people's personal data and privacy.\nOther EU digital laws such as the Digital Markets Act or the Digital Services Act are intended to prevent big tech companies misusing their power over businesses and users. US businesses also have to abide by these laws if they offer their services to people in Europe, or observe their behavior.\nThe EU Commission has imposed numerous fines as punishment for violations of these regulations. In 2025, it fined Apple €500 million euros ($580 million). Meta, the company that operates Facebook, was fined another €200 million ($232 million).\nGoogle had to pay €890 million ($1.03 billion) in fines this year. That sounds like a lot — but a look at the net profit of the Google corporation Alphabet puts it into perspective. In 2025, Alphabet's net profit was around €117 billion ($136 billion).\n\"So these are sums that a company like Google or Amazon will make in just a few days,\" says Penfrat. \"They just include it in their budget.\"\nDependency on US digital services\nAs a result, it is not that easy for the EU to implement truly effective controls. The tech giants have global infrastructures, huge financial resources, and c", "translation_ja": "", "vocab": [{"word": "liability", "definition": "法律上の責任や義務。特に訴訟や損害賠償請求において、当事者が負うべき責任のこと。"}, {"word": "targeting", "definition": "特定の顧客層や消費者グループに焦点を当てて、広告やマーケティング戦略を展開すること。"}, {"word": "geolocation", "definition": "GPS技術やその他の方法を使用して、デバイスやユーザーの地理的位置を特定すること。"}, {"word": "misusing", "definition": "権力や立場を不正な目的のために使用すること。本来の用途と異なる悪い方法で使うこと。"}, {"word": "infrastructure", "definition": "企業や組織が機能するために必要な基本的な施設・設備・システムの総称。"}, {"word": "enforcement", "definition": "法律や規制を強制的に実行・遵守させること。違反に対する制裁を含む。"}]}, {"title_ja": "9月11日の英雄的な捜索救助犬たち、25年後に追悼", "title_en": "Hero Search-and-Rescue Dogs of 9/11 Remembered 25 Years Later", "summary_ja": "9月11日の攻撃に続いて、300頭以上の捜索救助犬がグラウンドゼロでの復旧活動に重要な役割を果たしました。これらの英雄的な犬たちは、ファーストレスポンダーとともに懸命に働き、生存者の捜索と復旧作業を支援しました。四半世紀が経った今も、彼らの貢献は敬意を持って記念されています。", "summary_en": "More than 300 search-and-rescue dogs played a crucial role in the recovery efforts at Ground Zero following the September 11 attacks. These heroic canines worked tirelessly alongside first responders to locate survivors and assist in the recovery process. A quarter-century later, their contributions continue to be honored and remembered.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/News/remembering-hero-search-rescue-dogs-911-25-years/story?id=136309285", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、世界中で起きている速報ニュースと重大なライブイベントの継続的なカバレッジを提供しています。このプラットフォームは、本日の最も重要なストーリーについてリアルタイムの更新と詳細なレポートを配信しています。視聴者はこの専用ライブニュースサービスを通じていつでも包括的なニュースカバレッジにアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and major live events happening around the world. The platform delivers real-time updates and in-depth reporting on the most important stories of the day. Viewers can access comprehensive news coverage anytime through this dedicated live news service.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "リンジー・クランシー弁護士が公判無効後の事件却下を求める", "title_en": "Lindsay Clancy's Attorney Seeks Case Dismissal Following Mistrial", "summary_ja": "リンジー・クランシーの弁護士は、公判無効が宣告された後、判事に事件の却下を求める動議を提出した。7日間の評議の後、陪審員が満場一致に達することができなかったため、公判無効が宣告された。この動議は再公判手続きを防ぐための法的な試みである。", "summary_en": "Lindsay Clancy's defense attorney has filed a motion asking the judge to dismiss her case after a mistrial was declared. The mistrial occurred when jurors were unable to reach a unanimous verdict following seven days of deliberation. The motion represents a legal attempt to prevent retrial proceedings.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/News/lindsay-clancys-attorney-asks-judge-force-guilty-finding/story?id=136345786", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウガンダ王国で秘密の息子の存在が明かされ、王位継承をめぐる激しい紛争が勃発", "title_en": "Secret Son Revelation Ignites Succession Dispute in Ugandan Kingdom", "summary_ja": "ウガンダのトロ王国でオヨ・ニイムバ・カバンバ・イグル・ルキディ4世王が癌で亡くなった後、王位継承をめぐる深刻な危機が発生している。王族は遺言に基づいて未公表の息子が王位を継ぐべきだと主張する一方、王族継承委員会は王のテレビキャスターの従兄弟を皇太子として選出した。自宅軟禁の疑惑と推定相続人の正当性についての相対立する主張により紛争は激化し、王国は伝統的慣習と法的手続の調整が必要とされている。", "summary_en": "The Tooro kingdom in Uganda faces a bitter succession crisis after King Oyo Nyimba Kabamba Iguru Rukidi IV died of cancer, with his family claiming an unknown son should inherit according to his will, while the royal succession committee selected his cousin, a TV news anchor, as crown prince. The dispute has escalated with allegations of house arrest and conflicting claims about the legitimacy of the purported heir, requiring the kingdom to reconcile traditional customs with legal procedures.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/10/uganda-king-secret-son-succession-dispute", "state_media": false, "category": "政治", "full_text": "A traditional Ugandan kingdom has become engulfed in a bitter succession dispute after the family of a king who recently died rejected the selection of a television news anchor as his successor.\nKing Oyo Nyimba Kabamba Iguru Rukidi IV, who became the world’s youngest reigning monarch when he took the throne in the kingdom of Tooro in 1995 at the age of three, died on 27 August in the US, where he was receiving cancer treatment.\nOn Wednesday, the royal clan’s succession committee announced it had chosen Oyo’s cousin Prince Edward Rukidi Kijanangoma, a news anchor and editor at the public broadcaster UBC, as crown prince.\nHowever, at a press conference held later the same day, Oyo’s sister, Princess Ruth Nsemere Komuntale, said that according to her brother’s will, a son whose existence had not been publicly known until his death should succeed him.\nThe kingdom’s spokesperson shared a section of the document, which says: “I hereby declare and direct that if, at the date of my death, I am survived by a son lawfully recognised as my biological son, I appoint him as my heir to the throne of the kingdom of Tooro.”\nIn a statement on Thursday, Oyo’s mother, Queen Mother Best Kemigisa Akiiki, denounced a “self-appointed group of clan members” who had selected a new king despite having had the will read to them hours earlier.\nShe also claimed that the royal family had been put under house arrest. Troops had “removed the royal guards without notice, and ... were deployed around the palace,” she said. “We cannot leave or receive people freely.”\nOyo was unmarried and was not known to have any children. The Tooro kingdom’s prime minister, Calvin Armstrong Rwomiire Akiiki, revealed the existence of a son in a social media post on 27 August when announcing Oyo’s death.\n“His majesty leaves behind a prince as his heir, whose identity will be formally revealed at the appropriate time, in accordance with the traditions and customs of Tooro kingdom,” he said.\nAnother contender had been Prince George Desmond-Kamurasi, who plays for the London amateur football club South East Dons. According to the committee, the goalkeeper had declined the offer of the throne because of his other responsibilities.\nThe Tooro king is selected by a succession committee appointed by the royal clan. A committee member told the local NTV station that a royal child must be officially introduced to elders in order to be considered for leadership.\nAndrew Mwenda, a prominent Ugandan journalist and relative of the royal family, wrote on X on Thursday that Oyo’s family had not been able to produce a photo of the purported son, and declined to disclose details about the family of the boy’s mother. He added that, in Tooro, a king’s son could only succeed him if he were born to a queen officially married to the king.\nThe prime minister called for restraint on Thursday. “There will be time to examine the will, to hear those advancing a different position, and to consider our customs, the applicable law and the proper institutions through which succession should be determined,” he said in a social media post.\n“That process should take place calmly and credibly, not through competing announcements, confrontation, or attempts to establish facts on the ground while our king still awaits burial.”\nEdward, a popular TV news presenter, is the son of Prince Christopher Paul Kijanangoma and a grandson of the former king George David Rukidi III.\nOyo, who was crowned after his father’s death, will be buried on Saturday at the Karambi royal tombs in the kingdom’s capital of Fort Portal in western Uganda.\nUganda has several ancient kingdoms that lack formal sovereignty, but whose leaders are revered as symbols of tradition and wield vast social influence. Tooro is one of five that are recognised by the government. Their monarchs have no political authority and are legally barred from engaging in partisan politics.\nIn 1967 Uganda’s then president, Milton Obote, abolished the kingdoms, saying he wanted to unify the country. They were restored by the current president, Yoweri Museveni, in 1993.\nThe Tooro are the latest African royal family to become mired in a succession dispute. King Misuzulu Sinqobile kaZwelithini, the reigning king of the Zulu people in South Africa, waited 15 months for his coronation after the death of his father because of a bitter feud involving accusations of forgery and poisoning.\nReuters and the Associated Press contributed reporting", "translation_ja": "", "vocab": [{"word": "succession dispute", "definition": "王位や地位の継承をめぐる法的および家族的な紛争のこと。複数の候補者が後継者としての正当性を主張する場合に発生する。"}, {"word": "engulfed", "definition": "完全に包み込まれるまたは飲み込まれるという意味の動詞。ここでは危機や問題が組織や家族全体に広がった状態を表す。"}, {"word": "heir", "definition": "相続人、後継者を意味する名詞。血統によって権利や地位を引き継ぐ人物を指す。"}, {"word": "legitimacy", "definition": "正当性、合法性を意味する名詞。ある主張や権利が法的または道徳的に正当であるかどうかを問う概念。"}, {"word": "pursuant", "definition": "〜に従って、〜に基づいてという意味の前置詞。法律文書や正式な指示に従う行為を表す。"}, {"word": "partisan", "definition": "特定の政党や派閥に強く支持する姿勢を示す形容詞。政治的中立性を失った状態を表す。"}, {"word": "mired", "definition": "泥沼に陥った、困難な状況に巻き込まれたという意味の過去分詞。複雑な問題から抜け出せない状態を表す。"}]}, {"title_ja": "ウガンダ、チャールズ国王への敬意を示すためインビクタスゲームズから撤退", "title_en": "Uganda Withdraws from Invictus Games in Show of Support for King Charles", "summary_ja": "ウガンダの軍事指導者ムホーゼ・カイネルガバ将軍は、チャールズ3世国王への敬意を示し、サセックス公爵夫妻との距離を置くため、ハリー王子のインビクタスゲームズからの撤退を発表した。この決定は、ハリーとメーガンが王室の現役メンバーではないことを明確にした公式な王室書簡の後に発表された。カイネルガバはゲームズ参加を支持する国防省内の派閥を抑制する必要があったと主張し、英国君主制への支持を改めて表明した。", "summary_en": "Uganda's military chief Gen Muhoozi Kainerugaba announced the country's withdrawal from Prince Harry's Invictus Games, stating it was to show respect for King Charles III and distance itself from the Duke and Duchess of Sussex. The decision came after an official royal letter clarified that Harry and Meghan are no longer working members of the royal family. Kainerugaba claimed he needed to suppress internal ministry factions supporting 'Harry-Meghan nonsense' and reaffirmed his support for the British monarchy.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/09/uganda-withdraws-invictus-games-out-of-respect-king-charles", "state_media": false, "category": "政治", "full_text": "Uganda is withdrawing from the Duke of Sussex’s Invictus Games, the country’s military chief has said, out of respect for King Charles amid division over the “Harry-Meghan nonsense”.\nGen Muhoozi Kainerugaba, son of the Ugandan president, made the surprise announcement in a post on X on Wednesday.\nKainerugaba wrote: “In order not to be construed as being opposed to His Majesty King Charles III of the United Kingdom, whom we deeply revere, Uganda hereby withdraws from the Invictus Games. We shall not participate in anything that does not have His Majesty’s approval.”\nThe timing of the post suggests it may be in response to an official letter to UK senior government and military officials on behalf of Charles that reiterated the Duke and Duchess of Sussex were not working royals and would not use their HRH styles.\nWhen asked by the Times about what had motivated the move, Kainerugaba is reported to have said: “I have factions in the Ministry of Defence that support that Harry-Meghan nonsense. I had to quash it straight away. I support the monarch. Period.”\nThe news, first reported by the Uganda Pulse news website, will be a blow to Harry, who two months ago stood alongside Uganda’s defence minister, Kiryowa Kiwanuka, at an Invictus Games event in London to announce that the East African nation would be the 26th country to enter the multisport event for wounded service personnel.\nAt the time, Kiwanuka praised the Ugandan president, Yoweri Museveni for his “visionary leadership” and Kainerugaba, a Sandhurst graduate, for “championing our team’s entry”, adding that their support “marks a new chapter for our servicemen and women”.\nThe Ugandan government spokesperson Alan Kasujja confirmed to the BBC: “Gen Kainerugaba decides whether or not the UPDF [Uganda People’s Defence Force] participates in the Invictus Games. What you saw is his stated position. If it changes, he will let the world know.”\nThe decision to withdraw may be an unintended consequence of the official letter, issued on Monday by the head of the royal household, the lord chamberlain, Richard Benyon, at Charles’s behest, clarifying the position of the Sussexes after their return to the UK two weeks ago.\nThe letter directed that the couple were “no longer working members of the royal family”, that their charitable work “is a personal matter for them both and undertaken in their private capacity” and “their position is akin to private citizens with commercial and charitable interests”.\nKainerugaba was appointed army chief in 2024 and is widely seen as his 81-year-old father’s successor to the presidency. He has made several provocative posts on X, including threats to invade neighbouring Kenya, demands that Jay-Z hand over his wife, Beyoncé, so he could marry her, and threats against Bobi Wine, Museveni’s principal political rival.\nThe Invictus Games and representatives for the Duke of Sussex have been approached for comment.", "translation_ja": "", "vocab": [{"word": "reiterated", "definition": "何度も同じことを繰り返して述べることを意味する。公式な声明や主張を強調するために用いられる。"}, {"word": "construed", "definition": "言葉や行動を特定の方法で解釈または理解することを意味する。文脈によって意味が変わる可能性がある。"}, {"word": "chamberlain", "definition": "王室や貴族の家計を管理する高位の職員。ここでは王妃の家計を統括する役職を指す。"}, {"word": "charitable", "definition": "慈善活動に関連する、または社会福祉を目的とすることを意味する。nonprofit organizationと関連する用語。"}, {"word": "successor", "definition": "ある地位や役職を後継する人物を意味する。組織や権力の継承を示す重要な用語。"}, {"word": "provocative", "definition": "議論や反応を意図的に引き起こすような行動や発言を表す。怒りや対立を誘発する性質を持つ。"}, {"word": "unintended consequence", "definition": "予期しない、計画されていない結果のことを指す。ある行動の副作用として生じる影響を表す。"}]}, {"title_ja": "貧血の母親から生まれた乳児は脳が小さい、研究が明らかに", "title_en": "Babies born to anaemic mothers have smaller brains, study finds", "summary_ja": "ケープタウンでの300人以上の母親と乳児を対象とした研究により、貧血の母親から生まれた乳児の脳の総体積が4%小さく、特に運動、学習、感情調整を制御する領域が影響を受けていることが判明しました。脳の違いは生後2年間で継続し、拡大し、子どもが学校に入学する際に認知的困難につながる可能性があります。研究者は妊娠中の貧血と鉄欠乏症のスクリーニングを公衆衛生の優先事項として推奨しています。", "summary_en": "A study of over 300 mothers and babies in Cape Town found that infants born to mothers with anaemia had 4% smaller total brain volume, particularly in regions controlling movement, learning, and emotion regulation. The brain differences persisted and widened over the first two years of life, potentially leading to cognitive difficulties when children enter school. Researchers recommend screening for anaemia and iron deficiency during pregnancy as a public health priority.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/sep/09/babies-born-to-anaemic-mothers-have-smaller-brains-study-finds", "state_media": false, "category": "社会", "full_text": "Babies born to mothers with anaemia have smaller brains, particularly in key regions linked to movement, learning and the regulation of emotion, according to a study.\nResearchers said the differences, first detected at the age of one, could lead to cognitive problems when children started school.\nMore than a third of pregnant women worldwide have anaemia – a condition typically caused by iron deficiency in which the number of red blood cells in the body is lower than normal. Symptoms include fatigue, shortness of breath and dizziness. Rates are highest in sub-Saharan Africa and south Asia.\nResearchers from King’s College London in the UK, and the University of Cape Town in South Africa, followed more than 300 mothers and their babies in Cape Town, scanning the brains of the infants several times between the ages of three months and two years.\nOn average, the total brain volume of babies born to anaemic mothers was 4% lower than that of babies born to non-anaemic mothers – despite all the anaemic mothers being diagnosed only with a mild version of the condition.\nDifferences were recorded in three specific regions of the brain: the putamen, caudate nucleus and corpus callosum.\n“All three of these brain regions are implicated in key neuropsychological functions,” said Jessica Ringshaw, first author and researcher at King’s Institute of Psychiatry, Psychology & Neuroscience (IoPPN) and the University of Cape Town, citing processing speed, emotion regulation and executive function as examples.\nThe gap between the groups of babies widened over the first two years of life – the corpus callosum, for instance, was about 4% smaller at 12 months in the group whose mothers had been anaemic but 6% by 24 months.\nEarlier research in South Africa looking at toddlers and school-age children found comparable differences in brain volume.\n“These aren’t children who are catching up, where the brain differences are disappearing over time,” said Ringshaw. “They are still there when the children are six years old and going to school, and when these things might then start translating into more noticeable cognitive difficulties.”\nThe findings offer a potential explanation for earlier studies showing that children born to mothers with anaemia scored less well on tests of development, she added.\nThe mothers with and without anaemia were otherwise very similar in terms of factors such as household income and food security, Ringshaw said, making her confident that maternal anaemia caused the differences the team observed.\nThe results reinforced the importance of tackling anaemia in women of reproductive age, Ringshaw said. “We should be screening for anaemia and iron deficiency, particularly during pregnancy,” she said, recommending the use of oral or even intravenous iron supplementation where appropriate.\nThe causes of anaemia were complex and could include infectious diseases, she said, with the study finding higher rates of anaemia in women living with HIV, “so having our iron interventions, but also appropriate infection management in conjunction with that [is important]”.\nWhile the World Health Organization lists reducing rates of anaemia as a priority, progress has stagnated over the past two decades.\n“Now more than ever, anaemia needs to be placed at the forefront of public health efforts if we are to ensure that children are not only surviving but thriving,” said Ringshaw.\nThe research, published in the journal Brain Communications, used special new MRI scanners that are cheaper and more portable than the conventional machines used in hospitals.\nIt compared images taken using the traditional “high-field” MRI machines with those taken by the portable “low-field” options, and found the latter were sensitive enough to detect the same differences in the brains of babies born to anaemic mothers.\nSteve Williams, professor of neuroimaging at King’s, said: “This study has proved that our novel technology can measure the impact of malnutrition on the developing brain, at scale, in some of the most challenging environments. This will provide an early, sensitive assessment of planned interventions.”", "translation_ja": "", "vocab": [{"word": "anaemia", "definition": "赤血球数が正常より少ない血液疾患。通常は鉄欠乏が原因で、疲労や息切れなどの症状を引き起こします。"}, {"word": "neuropsychological", "definition": "神経心理学的な、つまり脳の機能と心理的行動の関係に関する。認知能力や感情制御などの脳機能を評価する際に使用されます。"}, {"word": "corpus callosum", "definition": "大脳の左右の半球を繋ぐ神経線維束。情報処理と脳の両側間のコミュニケーションに重要な役割を果たします。"}, {"word": "malnutrition", "definition": "栄養不良、特に必要な栄養素が不足した状態。妊娠中の母親の栄養不良は胎児の発達に悪影響を与えます。"}, {"word": "intervention", "definition": "介入、医学的または公衆衛生的な治療や予防的な対策。この文脈では鉄補給療法などの医療的施策を指します。"}, {"word": "stagnate", "definition": "停滞する、進展しない状態。公衆衛生対策の進捗が過去20年間停滞していることを表現しています。"}]}, {"title_ja": "スペイン議会、1977年前生まれの西サハラ人への市民権付与を承認", "title_en": "Spain's Parliament Backs Citizenship for Western Saharans Born Before 1977", "summary_ja": "スペイン下院議会は、スペインが領有していた当時に生まれた西サハラ人数万人に市民権を付与する法案を承認しました。1977年9月前に生まれたサハラウイ人とその子孫が対象で、推定7万～12万人が恩恵を受ける可能性があります。この投票は、移民危機と西サハラの主権をめぐるスペインとモロッコの緊張した関係の中で実施されました。", "summary_en": "Spain's lower house of Parliament approved legislation granting citizenship to tens of thousands of Western Saharans born when Spain controlled the territory, with an estimated 70,000-120,000 people potentially benefiting. The bill, which grants nationality to Sahrawis born before September 1977 and their children, now requires Senate approval before becoming law. The vote comes amid sensitive relations between Spain and Morocco over migration crises and competing claims to Western Sahara's sovereignty.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/10/spains-parliament-backs-citizenship-for-western-saharans-born-before-1977?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Spain’s Parliament backs citizenship for Western Saharans born before 1977\nAfter lower house approval, the bill to grant tens of thousands of Sahrawis citizenship now goes to the Spanish Senate.\nSpanish lawmakers have backed legislation that would grant citizenship to tens of thousands of Western Saharans who were born when Spain ran the disputed territory now largely controlled by Morocco.\nSpain’s lower house of Parliament on Thursday approved the legislation 168-31, with 145 abstentions.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Thousands protest in Spain as Ceuta’s migration crisis festers a month on\n- list 2 of 3Morocco’s ruling allies turn on each other before election campaign begins\n- list 3 of 3Spain’s spy agency warned of mass crossings into Ceuta before border crisis\nThe bill still requires Senate approval before becoming law.\nThe text grants Spanish nationality to Sahrawis born before September 29, 1977 and to their children through naturalisation, even if they never resided in Spain.\nAlthough the exact number of beneficiaries is unknown, Sahrawi groups estimate that between 70,000 and 120,000 people could benefit from the legislation, which supporters described as addressing a “historical injustice” by colonial Spain in the Western Sahara.\nTensions with Morocco\nThe vote comes at a particularly sensitive time for Madrid’s historically delicate relations with Rabat due to the migration crisis in Spain’s north African territory of Ceuta, and the mass arrival of at least 70,000 migrants from Morocco in July.\nSpain’s leftist government has avoided blaming Morocco – which does not recognise Spanish sovereignty over Ceuta and Spain’s other North African territory of Melilla – but the right accuses Rabat of orchestrating the surge for political motives.\nMorocco claims sovereignty over Western Sahara and began asserting control over the territory after Spanish rule ended.\nThe Algerian-backed Polisario Front independence movement seeks recognition of an independent state called the Sahrawi Arab Democratic Republic.\nMany Sahrawis live in refugee camps in Tindouf in western Algeria, or elsewhere abroad, while others remain in Western Sahara.\nAgainst this backdrop, the initiative to grant Spanish nationality to Sahrawis has divided opinion in Morocco but not prompted condemnation from the government.\nMoroccan media quoted Ramadan Messaoud, a member of the Royal Advisory Council for Saharan Affairs, as saying in July that Rabat had “no problem” with Sahrawis obtaining Spanish citizenship. Others had done so “over the past few years”, noted Messaoud, who is also president of the Sahrawi Association for Human Rights.\n‘Restoring’ identity\nWestern Sahara was a Spanish colony until 1975, when Spain relinquished its administration under agreements with Morocco and Mauritania.\nSpain’s ruling Socialist Party and its junior left-wing partner Sumar, which filed the initiative, were among those who supported the bill, while the opposition conservative People’s Party abstained and far-right Vox voted against it.\n“With the adoption of this legislation, we are restoring – and I emphasise, restoring – the Spanish national identity card to those Sahrawis who once held it and from whom this state took it away,” said Tesh Sidi of the leftist Sumar coalition, the first woman of Sahrawi origin to serve in Spain’s Parliament.\nThe bill will now go to the Senate, where amendments are expected, before returning to the lower house for final approval.", "translation_ja": "", "vocab": [{"word": "legislation", "definition": "法律制定、または制定された法律そのものを指します。政治や法律の文脈で、議会が承認する法案や法令を表します。"}, {"word": "disputed territory", "definition": "領土権をめぐって複数の国や勢力が対立している地域を指します。国際紛争の対象となっている領土を表します。"}, {"word": "beneficiaries", "definition": "法律や政策の恩恵を受ける人々を指します。給付金や権利の受取人という意味で使用されます。"}, {"word": "historical injustice", "definition": "過去に起きた不正や不公正な扱いを指します。過去の過ちを正当化または改正する際に使われる表現です。"}, {"word": "orchestrating", "definition": "計画的に何かを組織・実行することを指します。複雑な事柄を巧みに調整・指揮する意味で使われます。"}, {"word": "sovereignty", "definition": "国家の主権、つまり領土支配と自治権を指します。特定の地域に対する統治権と決定権を表します。"}, {"word": "relinquished", "definition": "権利や領土などを手放す、放棄することを指します。支配権や所有権を意図的に手放す場合に使われます。"}]}, {"title_ja": "LGがスマートテレビの音声監視疑惑を否定、調査報告で論争", "title_en": "LG Denies Smart TV Audio Surveillance Claims Amid Investigation", "summary_ja": "LGは、スマートテレビがユーザーの同意なしに周囲の会話を録音し、オーディオデータを保存しているという疑惑を否定し、音声機能が明示的に有効になった場合のみ音声データがキャプチャされると述べています。Gamers Nexusによる調査報告は、テレビがローカルネットワークデータを積極的に収集し、スタンバイモード中でも音声トランスクリプトを保持していると主張し、世界中の2億1600万台のLGスマートテレビに関するプライバシーの懸念を引き起こしています。", "summary_en": "LG has denied allegations that its smart televisions record ambient conversations and store audio data without consent, stating voice data is only captured when users explicitly activate voice features. An investigative report by Gamers Nexus claimed the TVs actively harvest local network data and retain audio transcripts even during standby mode, raising privacy concerns about the 216 million LG smart TVs globally.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/10/lg-defends-smart-tv-features-amid-audio-surveillance-allegations?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "LG defends smart-TV features amid audio surveillance allegations\nRecent allegations into LG’s smart TVs have raised new questions about the nonconsensual data it harvests.\nSouth Korean consumer-electronics company LG has denied allegations that its smart televisions record ambient conversations, listen while on standby and store recordings for later transmission.\nOn Wednesday, the company told Al Jazeera that voice data is only recorded when a user presses and holds the voice button on the TV remote or activates its “Hi LG” wake word, after the user has activated the Far-Field voice recognition feature.\n“Other than these instances, the TVs do not collect or record ambient conversations,” LG said, adding that voice data is only processed via explicit user commands.\n“The audio is immediately deleted if the wake word is not recognised,” the company said.\nThe statement comes after a 135-minute investigative report released on Monday by a popular tech media outlet and YouTube channel, Gamers Nexus, with Level1Techs and independent security researchers. The investigation examined LG televisions’ data collection and security systems, raising questions about how the devices handle users’ private information.\nBy analysing network traffic and software, the researchers purport to have discovered that these televisions actively track users and harvest a glut of local network data, including audio transcripts.\nInside LG’s controversial tracking system\nGamers Nexus said its researchers were able to record audio through an LG television while it was in a state of hibernation, meaning that even if the microphone switch on the TV is turned off, other microphones exposed to the TV might not be, such as the remote.\nThe result, Gamers Nexus says, is “216,000,000 Spy TVs” in the US alone.\nOn its website, LG says it has 49 million smarts TVs in the US and 216 million globally.\nRecorded background noise in the room, including as far as 12 metres (40 feet) away from the TV, was also being archived, they said.\nYash Vekaria, a computer science researcher at the University of California, Davis, says that because TVs stay in homes for years, often past their update support, “prompt patching from LG matters”.\n“This vulnerability can allow sniffing [of] much more critical conversations … Imagine government officials discussing national security in their hotel room [next to an] LG TV”, Vekaria said.\nThe researchers further alleged that unmatched wake-word interactions or unclear sounds could remain stored locally, transcribed and preserved on the device as plain text in case the local network is disconnected and uploaded later to LG servers.\nCopies can stay in temporary storage spaces, known as buffers, without the user knowing, Vekaria said.\nPrivacy risks generally stem from poor design and selective disclosure. The more disconcerting threat lies in a compromised device, Vekaria added, which could be made to execute any command its hardware allows.\nThe researchers also said they found text transcripts derived from audio captured by the television, even after 10-15 seconds of silence after invoking “Hi LG”.\nThe claims have not been independently verified by Al Jazeera.\n“It raises a question of purpose,” says Vekaria, “a voice command is only useful in real time, so audio queued for later upload is presumably being kept for something else, such as logging, analytics or model training. LG should explain what”.\nVekaria says he is not aware of any concrete evidence that ambient audio or transcripts feed into LG’s advertising or profiling systems.\n“What we do know is that LG runs an advertising business built on household data, including the Automatic Content Recognition [ACR] tracking documented in o
