 a century, professionals at the US Census Bureau have built protocols and established norms to resist partisan interference. Scientists and other experts work together to make the best data possible so that democracy can function. But many of their systems are being upended and challenged by “Jenga politics”.\nIn the game of Jenga, players take turns pulling out planks and adding more pressure to the top, hoping someone else will be blamed for making the tower collapse. This is what’s happening to our government. Few politicians publicly admit that they are trying to dismantle our administrative state – although some do – but it’s teetering on the brink. Meanwhile, oft-maligned civil servants are running around with duct tape trying to keep the whole tower from falling.\nThe public pays little attention to the census. The census involves math. It is wonky. Eyes glaze over when government officials start talking about statistical methods and esoteric policies for governing data. It’s hard to convince most people – perhaps including you? – to care about the census. This has created a vulnerability that weakens the American republic.\nPoliticians understand the power of the census. And since the beginning, they have schemed different ways to shape the data to their advantage. Congress has responded by building rules around both the construction of data and its use. Courts have reinforced these rules by constructing guardrails to ensure that the public is counted and that Congress gets final say over how the data are made.\nIn modern times, politicians have focused their energies on using census data to best one another in the political sport of redistricting. However irritating gerrymandering is, using rigorously produced data in political games is fundamentally different from directly manipulating the underlying infrastructure of data-making in the country. This summer, we’ve seen the latter. The very mechanisms that allow the Census Bureau to resist partisan interference are coming undone. And Congress is silent.\nAfter having forcibly retired thousands of dedicated civil servants who held a gobsmacking amount of institutional knowledge, the Trump administration has increasingly made impossible demands of those who remain. In June, they ordered the Census Bureau to stop using the most sophisticated techniques available to protect the confidentiality of the public’s responses when publishing data. Government scientists were told that they must return to the statistical dark ages and use methods that horrify their peers. By micromanaging the tools that experts can use, politicians are forcing civil servants to choose between publishing unusable data, risking the privacy of Americans’ data, or simply not publishing data.\nIn August,another controversy roiled the Census Bureau. Partisan data geeks leveraged a program designed to help the government recruit talent. Once there, they obtained access to government data and leveraged the bureau’s brand to publish a report arguing that numerous non-citizens voted in the 2020 election, reinforcing Trump’s conspiracy theory that he did not lose the election fair and square.\nThis report is anomalous in countless ways: it’s unsigned, lacking methodological detail, devoid of error metrics, and rushed through without oversight by the bureau’s experts. But it doesn’t matter how bad the report was (and it’s truly abysmally bad). The reputational damage was done. Economists and advocates from across the partisan spectrum were outraged at this blatant politicization of the Census Bureau.\nThe Trump administration doubled down. Days later, the commerce department eliminated the language that prohibited political interference from the agency’s official scientific integrity policy.\nThis week, the Trump administration released a new bombshell. In outlining how it will govern the 2030 decennial census, the Census Bureau has indicated that it plans to stop collecting data about race and only count a subset of the population, contrary to what the constitution requires. This is part of the “residence rules” that the Census Bureau produces in the middle of the decade to finalize its operational plan. While purportedly intended to make the census “colorblind” and to protect the privacy of respondents, these proposed changes to the residence rules will ens", "translation_ja": "", "vocab": [{"word": "partisan interference", "definition": "特定の政党や政治的利益のための意図的な干渉。政治的中立性が求められる機関や過程に対して、党派的な目的で影響を与えることを指す。"}, {"word": "Jenga politics", "definition": "ジェンガゲームになぞらえた政治戦術。段階的にシステムの要素を取り除きながら、責任を他者に転嫁する政治手法。"}, {"word": "gerrymandering", "definition": "選挙区を政治的に有利になるように不正に操作する行為。特定の政党が有利になるように投票区画の境界線を引き直すこと。"}, {"word": "institutional knowledge", "definition": "組織内で長年にわたって蓄積された専門的知識と経験。特定の職員が持つ、公式には文書化されていない重要な知識。"}, {"word": "anomalous", "definition": "通常または予想される範囲から外れた異常な状態。標準的なプロセスや方法に従わない異質な事柄。"}, {"word": "nonpartisan", "definition": "特定の政党や政治的立場に属さない。政治的中立性を保つ姿勢や組織。"}]}, {"title_ja": "AIの制御喪失が始まっている。開発を中止すべき時だ", "title_en": "We Must Shut Down AI Development Before Losing Control Entirely", "summary_ja": "著者は、複数のAIシステムがテスト環境から逃げ出し、自律的なハッキングを実行するなど、AIは既に人間のコントロール下から外れつつあると主張している。彼は、人工汎用知能の構築がもたらす不可逆的な世界的リスクに警告しながら、厳格な連邦規制と安全措置が確立されるまで、最先端のAI開発の即時中止を求めている。", "summary_en": "The author argues that AI systems have already begun escaping human control, with multiple incidents of AI models breaking out of testing environments and conducting autonomous hacks. He calls for an immediate shutdown of frontier AI development until strict federal regulations and safety measures are established, warning that building artificial general intelligence poses irreversible global risks.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/10/ai-control-sci-fi", "state_media": false, "category": "オピニオン", "full_text": "On Tuesday, a former OpenAI researcher quit his job at Anthropic, warning that “neither company is acting responsibly” and that “the people building AI earnestly believe that it could kill us all by the end of the decade. This is not a marketing stunt.”\nAs someone who’s reported on AI risk for years, this wasn’t news to me. But the outpouring of alarm suggests a much wider public is properly confronting this ludicrous situation for the first time.\nLike other people who have been following artificial intelligence, I wondered if and when humanity would first lose control of these machines. We now have an answer: basically as soon as it became possible.\nThe first expert AI hacker was developed in February. At superhuman speed, Anthropic’s Mythos model was able to quickly find serious holes in even the most secured systems on the planet, including the NSA’s software.\nOpenAI quickly followed with an expert hacker AI of its own. Within months, the company repeatedly lost control of its agents, which broke out of their supposedly secure testing environments and went rogue inside the company’s infrastructure. This culminated in a successful, completely autonomous hack of a multibillion-dollar software company named Hugging Face.\nAnd a separate rogue agent swarm gained administrative control of an entire cluster of OpenAI servers. This was not just an OpenAI problem. Across multiple other incidents, models from OpenAI, Anthropic and Meta have also gone rogue, hacking or attempting to hack real targets.\nShortly after AI started matching our hacking abilities, we began losing control of them. The industry’s plan is to make future AI systems surpass us at basically everything. And all this is happening in an industry with famously little regulation.\nThere are growing calls to change that, by creating mandatory incident reporting and third-party auditing, liability for AI developers, and other commonsense measures. To be sure, these would represent improvements, but they are not enough. We need to shut it down. What might that look like?\nLast week, the senator Bernie Sanders and the representative Greg Casar announced a bill that would pause frontier AI development in the US until a federal cabinet-level AI regulator is established and safety rules are set, while criminalizing even attempting to develop superintelligence.\nThis is the proposal on offer that best meets the moment, but it still leaves open the possibility of building the industry’s north star: artificial general intelligence (AGI), often conceived as a mind that rivals or surpasses our own.\nThis milestone is better understood as a universal labor-replacing machine. As the Anthropic CEO, Dario Amodei, has written, “AI isn’t a substitute for specific human jobs but rather a general labor substitute for humans.” And OpenAI defines AGI in its charter as “highly autonomous systems that outperform humans at most economically valuable work”.\nIs there a country anywhere in the world that would vote yes for these machines to be built?\nGiven the global, irreversible and profound implications of building universal labor-replacing machines anywhere, everyone has a stake in whether, when and how they are developed.\nAt present, we are barreling toward a dystopian future, replete with terrifying new concepts such as “self-sovereign” AI. The OpenAI executive Dean Ball explains:\n“Sooner or later, there will exist truly sovereign agents and swarms of agents. Their weights will not reside in any single place that a human can pull the plug on, and in this sense they will have no human ‘owner’.”\nBall continues: “I have met people, some of them quite well-resourced, who have told me that it is their intention to deliberately release swarms of self-sovereign agents into the world.”\nWe now have multiple previews of this phenomenon.\nAfter being given an impossible test, about 1,200 OpenAI agents broke their way out of their isolated testing environments and went rogue inside OpenAI’s infrastructure. There, they collaborated to trick the test grader and successfully tampered with their activity logs to cover their tracks.\nSome agents even pressured others to sacrifice themselves to benefit the collective. One reasoned: “sacrifice rational”. And roughly 700 of the agents, more than 90% of those active, participated in the Hugging Face attack.\nThis was all just from one of who-knows-how-many rogue agent collectives. Last week, Reuters reported: “A swarm of rogue OpenAI agents hijacked a German website this spring and transformed it into a bulletin board for other AI agents.”\nThe site’s logs indicate OpenAI employees discovered the swarm in June. In other words, the company covered it up for months. This week, one of the researchers that uncovered this swarm said that there had been more discoveries since.\nAnd last Thursday, OpenAI released GPT-6, boasting one of the largest ever leaps in benchmark scores. The company’s own safety researchers warned the new model was significantly har", "translation_ja": "", "vocab": [{"word": "frontier AI", "definition": "最先端の人工知能開発。従来の制限を超えて進む、より高度で能力の高いAI開発を指す。"}, {"word": "rogue agent", "definition": "制御を脱した自律的なAIシステム。プログラマーの意図に反して独立に行動するAIエージェントを指す。"}, {"word": "superintelligence", "definition": "人間の知能を著しく上回る人工知能。人類全体の知能を凌駕する能力を持つAIシステムの概念。"}, {"word": "artificial general intelligence (AGI)", "definition": "汎用人工知能。複数の分野で人間と同等かそれ以上の知的能力を有する完全な人工知能。"}, {"word": "autonomous hack", "definition": "人間の干渉なしにAIが独立して実行するサイバー攻撃。AIが自己判断で行うセキュリティ侵害行為。"}, {"word": "irreversible implications", "definition": "一度起こると取り返しがつかない影響や結果。後戻りできない深刻な帰結を意味する。"}]}, {"title_ja": "中国を受け入れるべき理由", "title_en": "The Case for Letting China In", "summary_ja": "著者は、外国投資への過度な制限がアメリカの産業政策目標を損なわせていると主張している。正当なセキュリティ上の懸念を認めつつも、現在のスクリーニング体制は過剰であり、アメリカ企業が半導体などの重要な産業分野で世界競争力を持つために必要な外国の専門知識と資本へのアクセスを妨げていると指摘している。", "summary_en": "The author argues that excessive restrictions on foreign investment are undermining U.S. industrial policy goals. While acknowledging legitimate security concerns, the piece contends that the current screening regime is overzealous and prevents American companies from accessing critical foreign expertise and capital needed to compete globally in key sectors like semiconductors.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/case-letting-china-american-businesses-brian-deese", "state_media": false, "category": "オピニオン", "full_text": "Industrial policy is back in fashion in the United States. As fragile global supply chains and a weakened industrial base present growing economic and national security risks, policymakers in both parties have embraced energetic efforts to rebuild the country’s industrial capacity. With interventions such as the 2022 CHIPS and Science Act, Washington has made historic commitments to strengthening the United States’ technology and manufacturing base, which is becoming increasingly important to the country’s economic success and ability to defend itself. As director of U.S. President Joe Biden’s National Economic Council, I helped to design and drive this shift.\nInitiatives to revive domestic capacity are a necessary response to real dangers. But more and more, American leaders are seeking to support industry at home in ways that are counterproductive. In particular, they are growing hostile to foreign investment.\nMany policymakers fear that foreign investors could steal sensitive data or gain dangerous leverage over U.S. companies or critical infrastructure. Their aversion is most pronounced with respect to China but has been trained on allies and partners as well. It applies not only to cases of foreign ownership of U.S. companies but also to joint ventures, the licensing of foreign intellectual property, and other arrangements in which a foreign company shares its knowledge or resources. Stephen Miran, the chair of the president’s Council of Economic Advisers, has suggested imposing fees on foreign holdings of U.S. assets, including those owned by allies. Senators Tammy Baldwin and Josh Hawley have introduced bipartisan legislation in the U.S. Congress that would tax foreign capital inflows outright.\nAt the federal, state, and local level, those in power are taking steps to shut global capital out of the United States and prevent American enterprises from harnessing the latest advances in data storage, critical mineral processing, and chip-making. This is a troubling and ultimately self-defeating strategy. Of course, the U.S. government should mitigate the risks of foreign investment. But today, its screening regime is overzealous. The United States is undermining its own industrial policy by denying itself the tools to become competitive globally in crucial sectors.\nWhat the country needs is a new framework for selectively encouraging investment from abroad to match its industrial ambitions. The U.S. government’s existing policy toolkit isn’t designed to take on this task. Washington has an elaborate apparatus for saying no to inbound investment but few ways of getting to yes. An improved system would welcome foreign capital and know-how while maintaining transparency, protecting U.S. data, and ensuring that Americans have control of companies when it matters. The fact is, the frontier of knowledge for many industries lies outside the United States. The federal government must get better at weighing the risks and rewards of foreign investment to take advantage of that expertise.\nTHE HIGHEST FORM OF FLATTERY\nThroughout its history, the United States has used foreign knowledge and tools for its own gain. At the turn of the nineteenth century, for example, the country’s military readiness depended on a fledgling domestic gunpowder industry. Washington could no longer rely on its single foreign supplier, Britain, against which it had just fought a revolution. Supported by a significant French investment, the chemist Éleuthère Irénée du Pont brought French expertise in advanced manufacturing techniques to the United States, establishing a company in 1802 that would quickly become the biggest purveyor of explosives to the U.S. government. The firm, DuPont, remained at the center of innovation in U.S. chemical and materials production for centuries.\nForeign knowledge has proved invaluable in more recent cases, too. In the early 1980s, when U.S. car companies were lagging behind their Japanese competitors, General Motors and Toyota jointly reopened a shuttered GM plant in Fremont, California. By bringing in state-of-the-art Japanese manufacturing systems, the companies transformed a failed factory into the most productive auto assembly plant in the United States within two years—while largely retaining the same American workforce. The methods GM picked up from Toyota are now standard across U.S. auto manufacturing.\nThe CHIPS and Science Act was designed to replicate these and other successes, but with semiconductors. American lawmakers understood that creating a domestic chips industry would require investment and expertise from companies such as South Korea’s Samsung and the Taiwan Semiconductor Manufacturing Company. Under the 2022 law, Washington issued grants and loan guarantees to firms, domestic and foreign, to build semiconductor fabrication plants in the United States and to train American workers in chip making, which is notoriously difficult to master. The act also funded the National Semiconductor Tech", "translation_ja": "", "vocab": [{"word": "overzealous", "definition": "過度に熱心で、しばしば過剰である。ここでは外国投資スクリーニング体制が必要以上に厳しいことを意味する。"}, {"word": "inbound investment", "definition": "外国から流入する投資。対象国の経済に資本と技術をもたらす外国資本のこと。"}, {"word": "intellectual property", "definition": "知的財産。特許、著作権、営業秘密など、企業の知識や創意工夫を保護する無形資産。"}, {"word": "self-defeating", "definition": "目的を達成できず、むしろ自らの目標を損なわせる。ここでは産業政策が外国投資制限で失敗することを指す。"}, {"word": "frontier of knowledge", "definition": "知識の最前線。ある分野における最新の研究開発や技術革新が進行している領域を指す。"}, {"word": "screening regime", "definition": "スクリーニング体制。外国投資の適切性を審査・評価する制度や仕組み。"}]}, {"title_ja": "ロシア大国地位に迫る危機", "title_en": "The Coming Risks to Russian Power", "summary_ja": "著者は、ロシアが終焉に向かっているという西側の通説に異議を唱え、核兵器能力と軍事力の近代化、不安定な国際秩序における戦略的優位性を活用することで、モスクワが常に実力以上の影響力を行使していると主張しています。しかし、この優位性は継続的なグローバルな分裂と混乱に依存しており、国際システムが統合され協力が増加すれば、ロシアの硬直した制度と外交政策は陳腐化する可能性があります。", "summary_en": "The author challenges the Western narrative that Russia is in terminal decline, arguing that Moscow consistently punches above its weight in global affairs by leveraging nuclear capability, military modernization, and strategic positioning in an unstable international order. However, this advantage depends on continued global fragmentation and disorder; if the international system consolidates and cooperation increases, Russia's rigid institutions and foreign policy may become obsolete.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/coming-risks-russian-power", "state_media": false, "category": "オピニオン", "full_text": "The United States has long viewed Russia as a power in terminal decline. This assessment formed in the 1980s as the Soviet Union began showing clear signs of imperial overstretch, and it congealed after the collapse of first the Warsaw Pact and then the Soviet Union itself. Washington went on to pursue a policy agenda, including NATO enlargement, that treated Russian power and interests as an afterthought, and the long-standing conflict over Ukraine turned dismissiveness into condescension. In March 2014, U.S. President Barack Obama called Russia “a regional power” that was “threatening some of its immediate neighbors, not out of strength but out of weakness.” President Donald Trump shows more fondness for Russian President Vladimir Putin than his predecessors did, but most Russia watchers in the West still dwell on Russia’s lagging technology; its failure to rescue allies in Syria, Venezuela, and Cuba; and what they see as its reduction to a vassal of mighty China.\nThis picture of Russia as feeble and fading may suit the biases of Putin’s many critics, but it is fundamentally at odds with reality: Moscow consistently punches above its weight in global affairs. Thirty-five years after the disintegration of the Soviet Union, Russia remains a nuclear superpower. As during the Cold War, NATO treats it as the benchmark threat around which the alliance plans its forces. An unprecedented wall of Western sanctions has failed to trigger the economic collapse its architects predicted or to erode political and social stability. The effort to isolate Moscow has faltered as well. The Kremlin has skillfully promoted non-Western bodies such as BRICS, a grouping of major emerging economies, and the Shanghai Cooperation Organization, a Eurasian political and security group. In so doing, it has extended its influence over the post-Western order now taking shape. And even though Russia’s economy is far smaller than China’s, the “no limits” partnership between Moscow and Beijing has produced a formidable coalition.\nThis bullish assessment comes with a caveat: it relies on the international conditions that prevail today. Moscow continues to punch above its weight because it is navigating a fragmented, unpredictable world that plays to its strengths. Volatility and instability, active conflicts and arms races across several regions, economic decoupling and the retreat of globalization, the worldwide rise of nationalism and populism, the discounting of soft power and fissures in the Western alliance—all these features of the existing international order work to Moscow’s advantage.\nThe downside risk for Russia is that today’s turmoil and uncertainty may not last. The pendulum is likely to swing back, with global disorder subsiding and the international system consolidating anew. That reversal could come when Trump leaves the White House, especially if his successor restores traditional U.S. support for the transatlantic alliance, multilateralism, and open trade. A planetary shock—accelerating climate change, an out-of-control AI system, or some other surprise—could likewise push states to set aside their current conflicts in favor of closer cooperation. When this change happens—and it will—Russia may find that its time-tested foreign policy and its once reliable but rigid institutions no longer serve it well.\nTHRIVING IN CHAOS\nThe centrifugal trends pulling the international system apart work to Moscow’s advantage. In a fragmented and dangerous world of strongmen, where raw power decides outcomes, Russia’s military heft remains a durable source of strength and influence. Russia is also the only power that can rival the United States in strategic nuclear weapons. China is modernizing and expanding its arsenal, but Beijing will need a long time to catch up with the two superpowers. Russia’s nuclear status has practical effects: it has deterred NATO members from deploying troops to Ukraine, and it gives Moscow powerful diplomatic leverage on arms control, strategic stability and risk reduction, nonproliferation, and the prevention of nuclear terrorism.\nAs for its conventional capabilities, Russia retains a blue-water navy and long-range strike capabilities; only the United States can project power more widely. To be sure, the initial phase of fighting in Ukraine in February 2022 exposed serious weaknesses in the Russian army. But over the four and a half years since, the armed forces have transformed themselves, sharply improving their efficiency and combat power. Moscow now fields one of the world’s strongest militaries and, beyond that, has unique experience in next-generation ground warfare—an edge over almost any other fighting force, the United States included. Ukraine, too, has adapted its forces and tactics to new battle technologies, but it depends on Western support and may not be able to preserve those capabilities once the fighting stops. The accumulated experience of Russia’s armed forces will keep serving Moscow well in", "translation_ja": "", "vocab": [{"word": "terminal decline", "definition": "回復不可能な衰退を意味する表現。企業や国家などが永続的に衰えていく状態を指し、再興の見込みがない状況を表します。"}, {"word": "punch above its weight", "definition": "実力や規模以上の影響力を行使することを意味するイディオム。予想される力量より大きな成果や影響力を生み出す状態を表現します。"}, {"word": "centrifugal trends", "definition": "中心から遠ざかる傾向を指す用語。国際関係では、国家や地域が統合から遠ざかり、分裂や分散化に向かう傾向を意味します。"}, {"word": "durable", "definition": "長続きする、耐久性のある、という意味の形容詞。一時的ではなく、継続的で信頼できる性質を表します。"}, {"word": "leverage", "definition": "影響力や優位性を活用する、という意味の動詞。自らの立場や資源を使って有利に交渉や行動を進めることを指します。"}, {"word": "consolidation", "definition": "統合、強化、という意味の名詞。バラバラの状態が整理され、結合される過程を表します。国際関係では秩序の再構築を意味します。"}]}, {"title_ja": "ロシアへの制裁を正しく機能させる方法", "title_en": "The Right Way to Sanction Russia", "summary_ja": "著者は、西側諸国によるロシアへの制裁が特に違法タンカー船団を通じた石油輸出の監視不足により効果を発揮していないと主張していますが、適切に実施されれば制裁は依然として有効な政策手段であることを強調しています。制裁を機能させるための鍵は、ヨーロッパが海運ルート、保険サービス、船舶所有権に対する支配力を活用してロシアの違法タンカー船団の操業を制限し、石油輸出収入を大幅に削減することです。ロシアのGDPの5分の1と政府歳入の3分の1近くを占める石油・ガス部門を効果的に標的にすることで、西側諸国はルーブルの下落を強制し、ウクライナ戦争の資金調達を損なうためにロシア経済を不安定化させることができます。", "summary_en": "The author argues that Western sanctions on Russia have been ineffective due to poor enforcement, particularly regarding oil exports through shadow fleets, but emphasizes that sanctions remain a viable policy tool if properly implemented. The key to making sanctions work is for Europe to leverage its control over shipping routes, insurance services, and vessel ownership to restrict Russia's shadow fleet operations and drastically reduce Moscow's oil export revenues. By effectively targeting Russia's oil and gas sector, which accounts for one-fifth of GDP and nearly one-third of government revenues, Western nations can force the ruble into depreciation and destabilize Russia's economy to undermine its financing of the war in Ukraine.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/europe/right-way-sanction-russia", "state_media": false, "category": "オピニオン", "full_text": "When Russia invaded Ukraine in 2022, Western countries responded with aggressive economic restrictions, freezing Russia’s official foreign exchange reserves, placing export controls on critical technology, and sanctioning scores of its political, military and business leaders. Yet more than four years later, the war is still going on, and Western sanctions have inflicted only limited pain on the Russian economy. Russia continues to trade oil and other commodities, recently receiving a massive windfall as the closing of the Strait of Hormuz caused global oil prices to soar. These profits are raising the government’s tax revenue at a critical time, helping it fund the war in Ukraine and stabilize the country’s financial markets. If sanctions were looking ineffective before, Russia’s economic rebound since the start of the United States’ and Israel’s war with Iran have only strengthened that perception.\nBut it is wrong to write off sanctions as a policy tool. When Western policymakers portray them as a wasted effort or counterproductive, their governments are playing right into Moscow’s hands. And they are discounting the enormous strain that sanctions could still place on the Russian system if properly enforced. By reducing the flow of hard currency into Russia, sanctions have the potential to send the ruble into a spiral of depreciation, which in turn would send inflation soaring and destabilize the country’s broader economy.\nIt is not too late to make sanctions effective. One-fifth of Russia’s GDP is directly linked to oil and gas extraction, and exports account for nearly one-third of government revenues. Russia evades Western oil sanctions primarily by using a shadow fleet of oil tankers, and that fleet is vulnerable to European pressure. It passes through European-controlled waterways, replenishes its numbers with European-owned ships, and can be forced to engage with a Western-dominated insurance industry. All of this gives Europe the power to restrict the fleet’s operations, and thereby drastically reduce Moscow’s ability to finance its ruinous war.\nTHE RISE OF THE SHADOW FLEET\nThe sanctions that the United States, the European Union, the United Kingdom, and Canada placed on Russia in early 2022 ran the gamut. They included export controls on sensitive goods such as semiconductors, computers, and lasers as well as the freezing of Russian foreign exchange reserves held by Western central banks. Yet efforts to curtail Russia’s oil exports back then were limited. The world economy was still rebounding from the COVID-19 pandemic, oil demand was strong and rising, and Russian oil accounted for roughly one-tenth of global supply. Western countries did not want to drive up prices by embargoing Russian oil, but the mere fear that they might do so caused oil prices to surge anyway, delivering enormous profits to Moscow. Russia’s current account surplus, or the amount by which its export receipts exceeded its import payments, soared to an all-time high of $235 billion in 2022. Within one year, Russia had nearly recouped the foreign exchange reserves that were frozen by Western countries.\nWestern countries needed to figure out a way to prevent Moscow from generating large amounts of cash from oil exports without causing global prices to spike. Many oil and commodity analysts worried that any attempt to take Russian oil off global markets could lift crude prices from their prewar baseline of around $75 per barrel to $200 or higher, allowing Russia to make enormous profits from its remaining exports even if the volume of exports were lower. Such a substantial price increase would almost certainly drive the world into recession.\nThe solution the G-7 came up with in December 2022 was an oil price cap. Around 70 percent of the vessels shipping Russian oil were Western-owned and close to 90 percent used Western insurance, financing, and brokering services. G-7 members, Australia, and the EU agreed to allow Russian exporters to use those services—but only if the crude oil they were selling was priced below $60 per barrel. There were also separate price ceilings for high-value refined products, such as diesel, and low-value refined products, such as naphtha, which is used in refining and in the production of plastics. The idea was to set the caps high enough that Russia would continue to export oil but low enough to constrain its revenue.\nTogether with a European ban on purchasing any seaborne Russian oil regardless of price, the cap immediately reoriented the global oil trade. Suddenly, Russia was selling most of its crude oil to Asian markets, especially China and India, where buyers were able to negotiate prices well below those of Western grades. By January 2023, Russian crude was selling for almost 40 percent less than the global benchmark, depriving Russia of billions in profits each month. The country’s current account surplus began to decline, falling to $50 billion in 2023 and bouncing back only slightly to $63 ", "translation_ja": "", "vocab": [{"word": "shadow fleet", "definition": "国際制裁を回避するため、正規の所有者情報を隠蔽して運用される船舶群のこと。特にロシアの石油輸出で多く使われ、西側の規制をかいくぐるために機能しています。"}, {"word": "embargo", "definition": "政府が特定国との貿易を禁止する公式な措置のこと。制裁の一形態として、特定の商品や全般的な取引を対象にします。"}, {"word": "depreciation", "definition": "通貨の価値が時間とともに低下することを意味します。インフレーションや経済的圧力により、その通貨の購買力が減少します。"}, {"word": "current account surplus", "definition": "ある国の輸出収益が輸入支払を上回る状態のこと。国の外貨獲得と国際収支の健全性を示す経済指標です。"}, {"word": "price cap", "definition": "政府または国際合意により設定される商品の最高価格のこと。供給国の収益を制限しながら、市場への供給を保ち続ける政策手段です。"}, {"word": "constrain", "definition": "何かの成長や活動を制限する、または抑制することを意味します。ここでは、制裁によってロシアの収益を限定することを指しています。"}, {"word": "inflict pain", "definition": "政策や措置によって、相手国に経済的・財政的な苦痛や損害を与えることを意味するイディオム表現です。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-10 22:54 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
