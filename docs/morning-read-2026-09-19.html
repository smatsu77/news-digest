land deal as Trump says it will give US 'permanent security control'\n- Published\nThe US and Denmark have announced a deal on Greenland's security, resolving a diplomatic dispute sparked by President Donald Trump's threats to seize it by force.\nNato said the deal would help stabilise the region, as Trump said Denmark would grant the US \"permanent control over security, and all other needs\" in the semi-autonomous Danish territory.\nThe leaders of Denmark and Greenland welcomed the deal to \"strengthen security\", which they said was expected to be signed next week, but did not outline its contents.\nThe deal comes after months of threats by Trump to \"take\" Greenland over national security concerns, citing its strategic location for defence purposes and its mineral wealth.\nNo text of the agreement has been released. Trump said the deal came with \"no cost to the United States\" and would grant it the ability \"to do what is necessary\" to \"secure and defend the security of Greenland\", in a post on Truth Social.\nHe said it included a rule that no US adversary could maintain a military presence in Greenland or \"make sensitive investments in Greenland, without our express written approval\".\nA Nato spokesperson said the military alliance welcomed the deal, which would \"help advance security, stability and cooperation in this vital region\".\nDenmark's Prime Minister Mette Frederiksen said she was \"pleased that there is a prospect of a good agreement\" for all three parties, which was expected to be signed at the UN General Assembly next week.\nThe deal \"strengthens our common security in the Arctic and the North Atlantic area\" while also recognising \"the sovereignty and territorial integrity of the Kingdom and the right of the Greenlandic people to self-determination\", she said in a joint statement with Greenland's Prime Minister Jens-Frederik Nielsen.\nThe agreement would still need to go through \"the necessary parliamentary procedures to enter into force\" once signed, the statement noted.\nNielsen said it was \"gratifying that we are about to enter into an agreement that ensures and strengthens the security of Greenland, the Kingdom of Denmark, the United States and the Western alliance\".\n\"The agreement recognises Greenland's interests and our place in international co-operation. It is for the benefit of us all,\" he said.\nTrump had tried for months to purchase or annex the semi-autonomous territory, arguing that it was vulnerable to adversaries, including Russia and China.\nHis repeated demands to take Greenland earlier this year prompted an outcry from Greenlanders, Danes and other Nato members.\nThere is hope the crisis has now been brought to an end, with some Danish media interpreting the agreement as a quiet but significant triumph for the country's diplomacy.\n\"Don't tell Trump that it's the Kingdom of Denmark that has won,\" read one headline in the newspaper Berlingske on Saturday.\n\"Trump didn't get Greenland, but he was allowed to take a victory lap on social media,\" wrote a US correspondent for Politiken. Territorial integrity was a red line for Denmark and Greenland, and the US president has made no mention of any territory changing hands.\nIt is not yet clear what concessions or sweeteners, if any, have been agreed - and in Greenland, some are still nervous.\n\"[It's] news we have all been hoping for,\" MP Naaja Nathanielsen wrote on social media. But she added: \"It is absolutely crucial that any agreement preserves our right to self-determination.\"\nFormer Greenlandic politician Aaja Chemnitz said she looked forward to the deal being finalised, but \"until then, I'm sceptical\".\n\"I don't have much confidence in Trump,\" she said.\nThe text of the agreement has not been published. The BBC has contacted the Danish Embassy in the US and the White House.\nHowever, an unnamed US State Department official outlined the deal without providing specifics.\nAmong the agreed provisions is one stating the deal would not expire even if Greenland became an independent country in the future.\nThe official added that under the deal, the US has unilateral power to build additional military structures with no approval needed from Greenland or Denmark. It includes \"permanent access, basing and overflights rights,\" the official said.\nIt also bans non-Nato countries from building bases in Greenland, and \"bans adversaries from making investments in Greenland that could threaten the United States\".\nThe official added that under the current status quo, adversaries have been allowed to invest in Greenland's \"sensitive sectors without investment screening\".\nThe official specifically referenced Russia and China, saying it blocks them from deploying troops or making investments in \"sensitive sectors\".\nWithout the official text being released, it is unclear how exactly the deal differs from a 1951 agreement with Denmark, under which the US can send as many troops as it wants to Greenland.\nThe US already has more than 100 military personnel ", "translation_ja": "", "vocab": [{"word": "semi-autonomous", "definition": "完全な独立ではなく、限定的な自治権を持つ地域を指す。この記事ではグリーンランドがデンマーク王国の一部でありながら独自の政府を持つ状態を表現している。"}, {"word": "annex", "definition": "他国の領土を武力や強制によって自国に併合する。国際法上の問題となる行為で、領土拡張の文脈で使われる。"}, {"word": "concession", "definition": "交渉において一方が相手に譲歩すること、または合意の条件として認める事項。外交交渉でよく使われる用語。"}, {"word": "unilateral", "definition": "一方的な、または一国単独で行動することを意味する。この協定では米国が相手国の承認なく行動できる権利を指す。"}, {"word": "sovereignty", "definition": "国家が自らの領土と人民を統治する最高の権力。国際法で保護される基本的な権利として使われる。"}, {"word": "basing rights", "definition": "軍隊が特定の場所に基地を設置し軍事活動を行う権利。防衛協定で重要な要素となる。"}]}, {"title_ja": "フーシ派、サウジアラビアの首都リヤドへの弾道ミサイル攻撃を主張", "title_en": "Houthis claim ballistic missile attacks on Saudi capital Riyadh", "summary_ja": "イラン支援のイエメンのフーシ派民兵組織は、ドローンと弾道ミサイルでサウジアラビアの首都リヤドとエネルギー施設を攻撃したと表明し、サウジアラビアの防空システムがこれを迎撃した。リヤド国際空港近くの燃料タンクから黒煙が上がり、一時的に便が乱れ、7月以来初めての空襲警報が鳴った。", "summary_en": "Iran-backed Houthi militants say they launched drone and ballistic missile attacks on Saudi Arabia's capital Riyadh and energy sites, with Saudi air defenses intercepting strikes. Black smoke was seen rising from fuel tanks near Riyadh's international airport, causing temporary flight disruptions and triggering air raid alerts for the first time since July.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwly5d9v7r43o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Houthis say they targeted Saudi capital with ballistic missiles\n- Published\nIran-backed Houthi militants in Yemen say they carried out drone and ballistic missile attacks on the Saudi capital Riyadh, as well as energy sites on the country's Red Sea coast.\nSaudi authorities said they intercepted and destroyed a ballistic missile fired at Riyadh earlier that day, without confirming any further strikes or causalities.\nEarlier, a column of black smoke was seen rising from fuel tanks near the Saudi capital's international airport, where flights were disrupted temporarily on Saturday.\nAir raid alerts had sounded in the capital for the first time since the Iran-backed Houthis increased their attacks on Saudi Arabia in July.\nAir defences also stopped \"hostile attempts to target civilians\" in the cities of Bish, Taif, Farasan and Yanbu, an official spokesperson for the Saudi-led coalition said in a statement.\nIn a statement posted online, Houthi military spokesman Yahya al-Sarea said a \"large number of ballistic and cruise missiles and drones\" had been used to attack \"sensitive sites\" in Riyadh and Aramco state oil and gas company facilities in Yanbu on the coast.\nHe added that the attacks were \"in response to the Saudi enemy's criminal attempts\" to target the Yemeni capital Sanaa, which is currently controlled by the Houthis.\nEarlier, Sarea had accused Saudi Arabia of carrying out 300 strikes across Yemen during the past week.\nThe Houthis are locked in a civil war with Yemen's internationally recognised government, which is backed by Saudi Arabia.\nThey have attacked targets inside Saudi Arabia on several occasions in recent months, and said this week that they were responsible for downing a Saudi fighter jet over Yemen.\nAccording to an unconfirmed report from AFP news agency, quoting military sources on both sides of Yemen's civil war, fighting between the Houthis and Saudi-backed government forces claimed 48 lives on Saturday.\nThe Houthis said 31 of their fighters had been killed while government sources said their side had lost 17 soldiers, according to the news agency.\nOn Friday, the International Organization for Migration, a UN body, reported that the number of people displaced as a result of recent fighting had passed 104,796, external.\n- How escalating Saudi oil crisis could drive up prices everywhere \n  - Published3 days ago\n- Saudi Arabia issues first air raid alerts for Riyadh since Houthis escalated attacks \n  - Published18 hours ago\nA number of apparent explosions were heard in Riyadh and major problems were reported at King Khalid International Airport earlier on Saturday, with the tracking website FlightRadar24 reporting delays and cancellations., external\nAn AFP journalist reported that firefighters could be seen trying to extinguish the flames of a burnt-out fuel tank belonging to Aramco.\nThe Saudi Civil Defence had sent out phone alerts overnight warning of potential danger in Riyadh and other regions, before issuing an all-clear on Saturday morning.\nResidents told AFP on condition of anonymity that they had heard what sounded like a round of explosions echoing through the city after the alerts.\n\"I heard the alarm, then my windows shook,\" said a resident of northern Riyadh, 27. \"It was definitely scary. I was not expecting this.\"\nThe Houthis recently seized control of the strategic port city of Mokha and Perim Island, a gateway to a key shipping route used by the Gulf state to export to Asia and Europe.\nThe group said the naval blockade was in retaliation for a Saudi blockade of ports and airports in Houthi-controlled north-western Yemen.\nSaudi vessels have relied on that stretch of the Red Sea for oil exports since the US and Israel's war with Iran effectively closed the Strait of Hormuz.\nOn Friday, investment banking giant JP Morgan said it was struggling to predict how oil prices would be impacted by the war, telling investors in a rare note that \"we simply don't know how to model the endgame\".\nRelated topics\n  - Published2 days ago\n  - Published3 days ago\n  - Published11 September\n  - Published4 days ago", "translation_ja": "", "vocab": [{"word": "ballistic missile", "definition": "目標に向かって放物線を描いて飛行する長距離ミサイル。軍事用語で、通常は核兵器や高性能爆弾を搭載できます。"}, {"word": "intercepted", "definition": "飛行中の物体や通信を途中で遮断・捕捉すること。防空システムが敵のミサイルやドローンを撃ち落とす際に使用されます。"}, {"word": "escalating", "definition": "紛争や問題が段階的に拡大・深刻化していくこと。戦闘の規模や激しさが増していく状況を表します。"}, {"word": "retaliation", "definition": "相手の行動に対する報復や復讐行為。国家間の紛争では、一方の攻撃に対して他方が同様の行動で応じることです。"}, {"word": "naval blockade", "definition": "海軍による港や海域の封鎖。敵対国の海上交通を遮断し、物資の輸出入を制限する軍事戦術です。"}, {"word": "strategic", "definition": "長期的な目標達成のために重要な戦略的な。軍事や政治で、全体的な勝利に向けた計画に関連する形容詞です。"}]}, {"title_ja": "トランプ大統領、主要3メディアのホワイトハウスアクセスを禁止", "title_en": "Trump Bans Three Major US Media Outlets From White House", "summary_ja": "ドナルド・トランプ大統領は、ポリティコ、CNN、MS NOWのホワイトハウスへのアクセスを禁止し、土曜日にジャーナリストの認証情報が無効化されました。これらのメディアは、この措置を憲法違反であり、報道の自由と言論の自由を侵害するものとして非難しています。法律専門家と報道自由団体は、この禁止令は裁判所によって直ちに無効とされると予想しています。", "summary_en": "President Donald Trump has barred Politico, CNN, and MS NOW from White House access, with journalists' credentials being deactivated on Saturday. The outlets have condemned the move as unconstitutional, violating First Amendment rights to free press and freedom of speech. Legal experts and press freedom organizations expect the ban to be struck down in court.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cj4gklz9dxplo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Journalists denied White House access after Trump banned some media outlets\n- Published\nPolitico, CNN and MS NOW journalists have been denied access to the White House after US President Donald Trump announced he was banning the outlets.\nAn MS NOW reporter and a photographer tried entering the White House grounds on Saturday morning, but their badges would not scan and an officer confiscated them, the outlet reported.\nBoth CNN and Politico also said Saturday morning that their reporters were denied access and had their badges seized.\nTrump said on Friday he was barring all three major US media outlets from the White House, accusing them of writing \"fiction or lies\" about his administration.\n\"The officer asked me to hand over my badge. He said that it was disabled,\" MS NOW reporter Akayla Gardner said. \"I asked why I was not able to get inside. He said it was above him.\"\nGardner added that while her and her colleague's badges were disabled, an MS NOW producer was still able to scan her badge to get in, though she was not given an explanation as to why the producer's badge still worked.\nCNN reporter Betsy Klein said a Secret Service agent told her her badge had been deactivated.\nLater on Saturday morning, Politico said its reporter Cheyenne Haslett was denied entry and Secret Service revoked her pass.\nAll three outlets have spoken out against the decision, accusing Trump of violating their constitutional rights to free speech and freedom of the press.\nAn MS NOW spokesperson said in a statement that the White House \"belongs to the American people and the decisions made inside are funded by our tax dollars\".\nMS NOW said it \"intends to take any and all steps necessary to defend our First Amendment rights and the essential role of independent journalism in our democracy\".\nPolitico Editor-in-Chief Jonathan Greenberger said in an internal email, shared in the outlet's Playbook newsletter, that the company stands by its reporters and will \"vigorously defend\" their First Amendment rights.\nAnd CNN said, \"We have a right under the US Constitution to do our reporting without hindrance or interference from the government and this ban is an illegal assault on this fundamental right.\"\nIn his announcement, Trump did not mention specific stories or reporting from the three outlets that prompted the move, but later said \"it's really just cumulative stories over the last few years\".\nTrump added that there \"may be others to join them\", but has not given a directive banning additional news outlets. When later asked by a reporter what he meant by others to come, Trump responded: \"Others to come in terms of fake news? Well, you know, the New York Times is fake news, the Washington Post is fake news.\"\nThe White House Correspondents Association (WHCA) - the independent, non-profit group that represents journalists who cover the US presidency - called on the administration \"to immediately restore\" access to the journalists and accused it of violating the First Amendment.\n\"The implications extend beyond these organizations: a standard used to exclude one news outlet because of its coverage could be applied to any outlet in the future,\" said WHCA President Jacqui Heinrich, who works for Fox News.\nHeinrich said that the Americans, through a free and independent press, must be able to scrutinise those elected in their coverage \"regardless of whether government officials view it favorably\".\n\"That's why courts have repeatedly held that once the White House provides access to journalists, it cannot deny that access arbitrarily or based on the content of their reporting.\"\nSeveral groups dedicated to the freedom of the press have called Trump's White House ban illegal and unconstitutional.\nA major group that provides legal services to the media - the Reporters Committee for Freedom of the Press - said it expected Trump's ban to be struck down quickly by the courts because it was \"flatly unconstitutional\".\n\"The First Amendment is clear that once the White House invites in some journalists, it can't ban others because it doesn't like their reporting,\" said Bruce Brown, president of the Reporters Committee for Freedom of the Press, which provides legal services to the media.\nIt's the latest in a series of moves by the administration to target media outlets Trump says are critical of him, including legal action against US and international outlets like The New York Times, The Wall Street Journal, and the BBC.\nSome of the lawsuits have resulted in media organisations agreeing to pay multimillion dollar settlements. Trump's lawsuit against the BBC is ongoing.\nAdditional reporting from Bernd Debusmann Jr and Max Matza.\nRelated topics\n  - Published19 September 2025\n  - Published18 August\n  - Published16 hours ago", "translation_ja": "", "vocab": [{"word": "deactivated", "definition": "機能を停止または無効化された状態。ここではジャーナリストの認証バッジがシステムから無効にされたことを意味します。"}, {"word": "cumulative", "definition": "時間とともに積み重なった、または合計された。トランプ大統領が複数の報道を累積的な理由として挙げたことを指します。"}, {"word": "arbitrarily", "definition": "根拠なく、または個人的判断で勝手に行われること。正当な理由なく決定が下されたことを意味します。"}, {"word": "constitutional", "definition": "憲法に基づいている、または憲法に適合している。法的権利や政府の行為が国家基本法に合致しているかどうかを指します。"}, {"word": "implications", "definition": "ある決定や行動がもたらす可能性のある影響や結果。この場合、ホワイトハウスの禁止令が将来的に及ぼす広範な影響を意味します。"}, {"word": "scrutinise", "definition": "詳細に調べる、または厳密に検討する。ジャーナリストが政府の行動を詳しく調査・報道することを指します。"}]}, {"title_ja": "アール・スペンサー、BBC インタビューでダイアナ本の主張を擁護", "title_en": "Earl Spencer defends Diana book claims about Charles in BBC interview", "summary_ja": "ダイアナ妃の兄アール・スペンサーは、妃の死後のチャールズ国王との電話通話に関する著書の主張が「真実」であるとBBCに述べました。スペンサーはチャールズが「すぐに彼女のことは忘れるだろう」と述べたと主張していますが、バッキンガム宮殿は悲しみがスペンサーの記憶に影響を与えた可能性があると示唆しています。", "summary_en": "Princess Diana's brother Earl Spencer has told the BBC he is 'telling the truth' about a phone call with King Charles after Diana's death, claiming Charles said 'we'll forget her soon enough' during an argument. Buckingham Palace suggested grief may have affected Spencer's memory, but Spencer insists those were the exact words used and says he has no reason to lie.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmqxvd1drd35o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "'I'm telling the truth': Earl Spencer defends Diana book claims about Charles in BBC interview\n- Published\nPrincess Diana's brother has told the BBC exclusively that he is \"telling the truth\" about a phone call with King Charles in the days after his sister's death.\nEarl Spencer claims in a new book the then-Prince of Wales said \"we'll forget her soon enough\" during an argument over whether Princes William and Harry should walk in Diana's funeral procession.\nIn a strongly worded response, Buckingham Palace said the King was \"mindful that the pain of fraternal grief can cloud reason, affect judgement and colour memory in ways others do not recognise, even many years after such a loss\".\nBut in his first interview since, Earl Spencer said: \"I can tell you here and now, those are exactly the words he said.\"\nReacting to the rare statement from the Palace, Earl Spencer said: \"Well, is he furious? Is he furious or is he embarrassed?\"\nSpeaking to the BBC at his Althorp estate, he added: \"I've only ever had two calls on the line with Prince Charles at any stage of my life.\n\"I was hyper alert to what he was saying and those are precisely the words that he said and I promise that to you now. Genuinely, that is what he said. I don't hear him saying he didn't say that.\"\nPressed on whether he had evidence to back up the claim, he said he told family and friends at the time what had been said \"because it was so monstrous\".\nIn response to the Palace disputing his account, Earl Spencer, who shares his first name with the King, said: \"They've sort of smudged that one, haven't they? They've said that recollections may vary.\"\nWhen asked which Charles the public was meant to believe, he said: \"I'm telling the truth.\"\nBuckingham Palace declined to give a response to Earl Spencer's fresh comments.\nThe remarks may bring a renewed focus to the war of words between the Palace and the King's former brother-in-law.\nIn excerpts of his book published by the Daily Mail, Earl Spencer claims the phone call took place after he insisted Diana would not have wanted the young princes to walk in the procession.\nIn his BBC interview, he says the King \"went ballistic\" and \"ranted for a while\", accusing his family of not having an adequate sense of duty.\n\"And then he stopped and I thought, oh now, now he's gonna pull himself together and say something more appropriate,\" Earl Spencer said. \"And then, he said, 'we'll forget her soon enough'.\"\nHe said he couldn't say exactly what went through his mind at that moment as he was \"just so stunned\", adding: \"I just, after a stunned silence, I said, I cannot believe you just said that. And I hung up on him.\"\nEarl Spencer's book, Swan Song: Diana, My Sister, is due to be published next week and is expected to be highly critical of the Royal Family.\nIn further extracts published on Thursday, he claimed how the King \"sounded giddily elated\" when he called him after Diana's death in a car crash in Paris on 31 August 1997, alleging Charles sounded like a \"lottery winner\".\nEarl Spencer recounts being alerted to the crash by a phone call from his sister Jane in the middle of the night at his home in Cape Town, South Africa.\nA call from Charles was among those that followed, and he alleges: \"Unlike my other callers, who were stunned, barely able to articulate their condolences and offers of help, he sounded giddily elated - like a lottery winner, I remember thinking at the time.\"\nThe death of Diana, a hugely popular figure, created a volatile atmosphere in the country at the time, with the royals accused of failing to show feeling and empathy, and seeming to be out of touch with the public mood.\nEarl Spencer's emotional and defiant speech at her funeral added to that cloud of grievance hanging over Diana's death at the age of 36.\nPrince Harry has previously said that walking behind his mother's coffin aged 12 was something no child \"should be asked to do\".\nIn 2017, he told the BBC he didn't \"have an opinion whether that was right or wrong\", but \"looking back on it\", he was glad to have been part of the day.\nThe full interview with Laura Kuenssberg will be on BBC iPlayer on Sunday from 16:00 BST and on BBC One at 18:30 BST.\n  - Published12 hours ago\n  - Published2 days ago\n  - Published3 days ago", "translation_ja": "", "vocab": [{"word": "fraternal", "definition": "兄弟姉妹関係に関する、または兄弟間の感情や結びつきに関連した形容詞。この文脈では、兄妹の関係における悲しみが判断に影響を与えることを指す。"}, {"word": "volatile", "definition": "不安定で予測不可能な、爆発的な傾向のある状態や雰囲気を表す形容詞。ここではダイアナの死後の国内の不安定な社会情勢を指す。"}, {"word": "alleging", "definition": "証拠なしに、または証明されていない主張を述べる動詞の現在分詞形。ニュースでは疑わしい、または一方的な主張を示す際に使用される。"}, {"word": "disputing", "definition": "異議を唱える、または反対する動詞の現在分詞形。誰かの主張や記述に対して反論する意味で用いられる。"}, {"word": "empath", "definition": "他者の感情を理解し共感する能力を持つ人。この文脈では王族が国民の感情に対して十分な共感を示していないという批判を示唆する。"}]}, {"title_ja": "自由民主党、ファラージ対抗の「防波堤」として会議で立場表明", "title_en": "Lib Dems Position Themselves as 'Firewall Against Farage' at Conference", "summary_ja": "自由民主党の指導者エド・デイビー卿はブライトンで開催される党の秋季会議で、自らの党がファラージとリフォーム党に対する「防波堤」であると宣言した。デイビーは保守党指導者ケミ・バデノックとファラージの「邪悪な同盟」がイギリスを「トランプ衛星国家」に変える可能性があると警告し、党の関連性についての内部批判に対して防戦した。党は2024年に獲得した記録的な72議席を超える議会代表の拡大を目指している。", "summary_en": "Liberal Democrat leader Sir Ed Davey declared his party a 'firewall against Nigel Farage and Reform' as the party's autumn conference began in Brighton. Davey warned of an 'unholy alliance' between Conservative leader Kemi Badenoch and Farage that could turn Britain into a 'Trump satellite state,' while defending the party against internal criticism about its relevance. The party aims to expand its parliamentary representation beyond the record 72 MPs won in 2024.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cq8jdkmgn7n1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Davey says Lib Dems are 'firewall against Farage' as conference begins\n- Published\nSir Ed Davey said the Liberal Democrats are \"a firewall against Nigel Farage and Reform\" as the party's conference began in Brighton.\nThe Lib Dem leader sought to strike a combative stance as he faced down some criticism from MPs, including one who said publicly that they felt the party was struggling for relevance.\nOn the first day of the autumn conference, Sir Ed warned an \"unholy alliance\" between Conservative leader Kemi Badenoch and Farage could turn the UK into a \"Trump satellite state\".\nAddressing speculation about a possible snap election, he said the party was ready to fight and would build its so-called orange wall even higher by winning more than its 2024 record of 72 MPs.\nSir Ed's attention-grabbing stunts helped raise the party's profile ahead of the last election, but recent polling showed 43% of respondents were unclear what the Liberal Democrats stand for, with just over half describing them as \"weak\".\nIn an essay, external written ahead of conference, South Cotswolds MP Roz Savage asked: \"Why are we as a party struggling for relevance at precisely the moment when so many people feel powerless?\"\nShe urged the party to rediscover its \"insurgent spirit\" rather than being the \"polite custodians of a system that leaves people feeling powerless\".\nAsked about her comments, Sir Ed said: \"No, I heard Roz [Savage], and I really value her, but I think she's wrong on that.\n\"If you look at our election results up and down the country, we now run more councils than the Conservatives.\"\nHe added: \"Listen, MPs get elected and they get frustrated because they can't change the world.\n\"I'm afraid that's the political system. I've been used to it for a little while and people are learning about that frustration.\"\nSpeaking on the pebbles of Brighton Beach, Sir Ed told reporters the Liberal Democrats would fight to stop a Reform government.\n\"One of the things that makes us unique is that we are a firewall against Nigel Farage and Reform,\" he said.\n\"Many of the seats he needs to get himself into No 10 are seats that we will defend and indeed win - and we are also able to take seats off the Conservatives, because I really fear that Kemi Badenoch will give the keys to No 10 to Nigel Farage, so we have got to stop the Conservatives as well.\n\"We have got an historic opportunity to win many more seats and a moral responsibility to stop Reform.\"\nHe added a manifesto working group had already been set up in case of an early election \"so we'll be ready if it comes early, but, you know, it still could be up to three years away\".\nSir Ed insisted his party has a \"distinctive position\" in British politics, and will use the four-day conference to position it to take on the challenge from Reform as well as its typical rivals the Conservatives, talking up their focus on the NHS and goal of re-joining the EU single market and customs union.\nThe Lib Dem leader highlighted how six former Conservative cabinet ministers were among 25 Tories to have defected to Reform in the last two years, claiming they were now competing with each other to see who can divide the country more, rather than looking to fix the country's problems.\n\"An unholy alliance between Farage and Badenoch is the only way either can get into power,\" he said.\n\"Together, they want to turn Britain into a Trump satellite state which would trash our NHS, turn our communities against each other, cause untold damage to our environment, and trample over traditional British values of fairness, tolerance, and decency.\n\"A bigger Orange Wall is the only thing that can stand between Britain and this dangerous experiment, and we will not let them pass.\"\nDavey also attacked the Labour government as having no plan for growth, failing to support families struggling with the cost of living and taxing small businesses \"to the brink\".\nAhead of a speech to party members, Davey urged Liberal Democrats not to look away from injustice or \"human dignity under attack\" but to fight back.\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.", "translation_ja": "", "vocab": [{"word": "firewall", "definition": "障害や問題から保護する防壁のこと。比喩的に、悪影響や危険を防ぐための防御線や対抗勢力を意味する。"}, {"word": "unholy alliance", "definition": "道徳的または倫理的に問題のある不適切な同盟のこと。通常、相互に矛盾する勢力や個人が一緒になることを指す。"}, {"word": "insurgent", "definition": "既成体制に反抗する反政府的な、または革新的な立場のこと。既存の秩序に対して異議を唱える勢力を表す。"}, {"word": "distinctive", "definition": "他とは異なる特徴的な、独特なという意味。競争相手と区別される明確な特性を持つことを示す。"}, {"word": "defected", "definition": "所属していた組織や政党から離脱して他に移ることを意味する。通常、政治的立場の変化を伴う。"}, {"word": "trample over", "definition": "踏みにじる、侵害するという意味の動詞句。他者の権利や価値観を無視して行動することを表す。"}]}, {"title_ja": "億万長者マンチェスター・ユナイテッド・オーナーが英国への信頼喪失を表明", "title_en": "Billionaire Man United Owner Says He Has Lost Confidence in the UK", "summary_ja": "英国の大富豪でマンチェスター・ユナイテッドのオーナーであるジム・ラットクリフ卿は、高い税金と移民を理由に英国への信頼を失ったと表明した。北海油ガス開発への政府の躊躇を批判し、ガス不足の可能性を警告した。政府は成長と再生可能エネルギーへの転換を通じたエネルギー安全保障への取り組みで対応した。", "summary_en": "Sir Jim Ratcliffe, a British billionaire and Manchester United stakeholder, has expressed his loss of confidence in the UK, citing high taxes and immigration as reasons for the country's decline. He criticized the government's hesitation on North Sea oil and gas development and warned of potential gas shortages. The government responded that it is committed to growth and energy security through renewable transition.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm0463619r1no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Billionaire Man United owner says he has lost confidence in the UK\n- Published\nOne of Britain's richest people, Sir Jim Ratcliffe, says he has lost confidence in the UK, describing the country as \"on the slide\".\nThe founder of petrochemical giant Ineos, who also owns a large stake in Manchester United, said the UK was in decline due to a combination of high taxes and high immigration.\nHe told the BBC failing to invest further in North Sea oil and gas amounted to \"insanity\" and warned gas storage was so low that the UK could \"run out of gas\" if there was a cold snap this winter.\nIn response to the billionaire's criticism, the government said it was working to deliver growth and that business investment had increased in the last two years.\nA spokesperson said they did not foresee any problems with gas supply: \"We have a diverse energy mix and are confident in our security of supply.\"\nSir Jim, whose wealth is estimated to be around £15bn, has prompted controversy in the past with his comments on immigration. He was a supporter of Brexit but has been a tax resident in Monaco since 2020.\nThe businessman's UK exit has been followed by other high-profile billionaires, including steel tycoon Lakshmi Mittal and most recently hedge-fund boss Chris Rokos.\nSir Jim said the politics of envy was driving people away from the UK.\n\"In America they applaud people who create wealth,\" he said. \"Unfortunately the UK has got a bit of a green eye towards wealth at the moment.\"\nHe said for him to return to the UK \"things would have to get better\".\nPrime Minister Andy Burnham has said he will take a \"pragmatic approach\" to oil and gas, but one of the biggest decisions facing the government, whether to give the go-ahead to further development of the oil and gas fields at Rosebank and Jackdaw, is still waiting to be resolved.\nSir Jim criticised the hesitation and suggested high taxes on North Sea operators were threatening the sector's viability. Tax on energy company profits is being reformed, but won't be fully implemented until 2030.\nIneos operates the Forties pipeline which transports about 30% of the UK's North Sea oil.\n\"You would expect [the government] to exploit our natural resources and we're clearly not doing that. We're shutting it down.\n\"If you tax everybody to death, they're all going to leave. And that's what's happening.\"\nRecent climate data combined with record heatwaves have given weight to the argument against further exploitation of fossil fuels. However, political pressure has grown on the government to proceed with Rosebank and Jackdaw to support UK jobs, tax revenues and boost energy security.\nSir Jim backed those calls, saying it was \"absurd\" to import more energy than necessary.\nThe government spokesperson said that oil and gas would play an important role in the UK \"for decades to come\", but they added: \"The transition to homegrown clean power is the only way to deliver energy and financial security for families and businesses.\"\nSir Jim warned that low gas storage levels in Europe posed a risk to the UK in the months ahead.\n\"If we have a really sharp cold spell, then there is conceivably the possibility that we'll run out of gas and have to switch industry off... our storage is not full,\" he said.\nThe UK does not typically store a great deal of gas, relying instead on LNG (liquefied natural gas) and gas imports from Europe.\nEnergy specialist consultancy Cornwall Insight said that current gas storage levels in the EU were at about 69%, when typically they would be at 85% at this time of the year.\nHowever, Adam Bell of consultancy Stonehaven, said supplies were unlikely to run short.\n\"We are down compared to where we normally would be but not what I'd regard as catastrophic,\" he said.\n\"The physical risk of running out of gas is relatively low, especially if Jackdaw gets the go ahead.\"\nHe said the main source of uncertainty was policy in the US, which supplies LNG to the UK.\nSir Jim was speaking in Denmark at the launch of the EU's first carbon capture and storage system (CCS). Ineos has invested in the scheme which is being subsidised by the Danish government and the EU.\nHe said he had hoped to develop CCS in the UK but there had not been enough government support.\nThe Department for Energy Security and Net Zero (DESNZ) said the government had committed £21.7bn for CCS projects over 25 years, however, no projects are yet operational in the UK.\nAt the project in Esbjerg in the south west of Denmark, carbon captured from around the country arrives in huge zeppelin-like tanks before being pumped into a ship called Carbon Destroyer 1. It is then pumped into a depleted oil field nearly 200 miles off shore.\nCritics say CCS is expensive, money that could be better used to invest in renewables rather than supporting continued fossil fuel use.\nSir Jim's critique of the UK is not limited to energy and tax policy. He said the country had at one time been \"a fantastic place\".\n\"We had the greatest empire in the world. We we", "translation_ja": "", "vocab": [{"word": "petrochemical", "definition": "石油から派生した化学物質を扱う産業のこと。石油化学産業と呼ばれ、プラスチックや燃料などの原料を製造する分野を指す。"}, {"word": "exploit", "definition": "資源や機会を活用・利用すること。ここでは天然資源を採掘・利用することを意味する。"}, {"word": "viability", "definition": "事業やプロジェクトが存続可能であり、長期的に成功する見込みがあるかどうかを示す。実行可能性を表す。"}, {"word": "depleted", "definition": "資源や物質が大幅に減少または枯渇した状態を表す。もう使用されなくなった油田などに使われる。"}, {"word": "pragmatic", "definition": "理想主義ではなく、現実的で実用的なアプローチを取ることを意味する。実際の状況に基づいた判断をすること。"}, {"word": "liquefied natural gas", "definition": "液化天然ガス（LNG）のこと。天然ガスを冷却して液体にすることで、輸送や保管を容易にしたエネルギー資源。"}]}, {"title_ja": "2026年ヨーロッパの記録的猛暑により前例のない死亡者数を記録", "title_en": "Europe's Hottest Summer on Record in 2026 Caused Unprecedented Deaths", "summary_ja": "2026年の夏はヨーロッパ史上最も暑く、ドイツは記録的な猛暑日を経験し、8月末までに推定16,300人の熱関連死亡者が発生しました。死亡者は主に基礎疾患が熱により悪化した脆弱な人口層であり、長時間の熱波と夜間の冷却不足、劣悪な生活環境が原因でした。", "summary_en": "Summer 2026 was the warmest in European history, with Germany experiencing record heat days and an estimated 16,300 heat-related deaths by end of August. The deaths were primarily among vulnerable populations whose underlying health conditions were exacerbated by prolonged heat, lack of nighttime cooling, and poor living conditions.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/summer-of-2026-broke-records-in-europe-and-caused-deaths/a-79339630?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Summer of 2026 broke records in Europe, and caused deaths\nSeptember 19, 2026\nThe summer (June to August) of 2026 was the warmest in Europe since records began, beating the record set in 2003, according to the Copernicus Climate Change Service,\nNot only that, Germany's DWD weather service says that there was an \"unprecedented\" number of hot days this year. \"On average across Germany,there were about 22 hot days with temperatures of at least 30 degrees Celsius and about five very hot days with temperatures of at least 35 degrees Celsius,\" the DWD wrote in in a press release at the end of August.\nThe estimated number of heat-related deaths also reached unprecedented levels, with at least 16,300 people dying by the end of August, even if few of them died directly because of the heat, but rather as a consequence of underlying health conditions exacerbated by the heat.\nThe figures were compiled from a statistical correlation between the number of deaths recorded by Germany's Federal Statistical Office and the temperatures measured by the DWD during a specific period.\nHeat-related deaths in Germany are more likely if the average weekly temperature reaches 20 degrees Celsius or more. This is the average of all hourly temperatures recorded in a week, including at nighttime.\nThis year, the average weekly temperatures in the country rose above the 20-degree mark several times. It was particularly hot at the end of June, when the average weekly temperature reached above 26 degrees between the 22nd and 28th of the month.\nExcess mortality during heat waves\nThough it is not possible to determine a cause of death using statistics, researchers and medical professionals have a good understanding of how heat affects the human body, and there is widespread consensus that excess mortality during heat waves is possible.\n\"It was not just the high temperatures on the thermometer that were important, but also how long the heat lasted and the fact that it hardly cooled down at night,\" said Andreas Matzarakis, professor of environmental meteorology at Freiburg University.\nMany people have trouble sleeping on hot nights. Yet, getting enough sleep is important so that the body can recover from the heat and stress of the day.\nMatzarakis said that the severity of heat stress was not related solely to air temperatures. Humidity, solar radiation and wind also played a role — and what is known as the 'felt' temperature. He said that humidity and still air could place a heavy strain on the body, even in moderate temperatures.\nUnderprivileged most vulnerable\nThe less privileged members of society were also among the most vulnerable, said Martin Röösli, environmental scientist at the Swiss Tropical and Public Health Institute in Basel. \"They are more likely to live in homes that are not well insulated or are more likely to work outdoors.\"\nA large proportion of those who died because of the heat probably had only a short life expectancy left, due to their age and medical conditions, but Röösli said that there was a consensus that \"some of the deceased could have lived for a long time and were simply in a fragile state at the time of the heat wave.\"\nFor Alexandra Schneider, a meteorologist and epidemiologist at the Helmholtz center in Munich in southern Germany, the deaths that occurred during the heat waves were very likely not only because of the \"harvesting effect,\" which describes \"how a heat wave causes very vulnerable individuals in particular to die a few days or weeks prematurely.\"\nHad this been the case, there would have been a deficit of mortality in the following weeks, which did not happen. Thus, she believes, a significant proportion of those who died could have lived on for months or even years.\nThis article was translated from German.", "translation_ja": "", "vocab": [{"word": "unprecedented", "definition": "かつてない、前例のない。これまでに起こったことがない規模や程度を表します。"}, {"word": "exacerbated", "definition": "悪化させた、増悪させた。既存の問題や症状をさらに深刻にすることを意味します。"}, {"word": "excess mortality", "definition": "超過死亡率。通常予想される死亡数を上回る死亡数を指します。"}, {"word": "fragile", "definition": "脆弱な、もろい。肉体的または心理的に弱い状態を表します。"}, {"word": "harvesting effect", "definition": "収穫効果。熱波が特に脆弱な個人を数日から数週間早く死に至らせる現象を指します。"}, {"word": "insulated", "definition": "断熱された、隔離された。熱や音を遮断するために材料で覆われた状態を表します。"}]}, {"title_ja": "トランプ大統領、安全性への懸念が高まる中で新たな「AI部隊」を発表", "title_en": "Trump Announces New 'AI Force' Despite Growing Safety Concerns", "summary_ja": "米国のドナルド・トランプ大統領は「AI部隊」の設立と「AI長官」の任命計画を発表し、人工知能のリスクについての専門家の警告を民主党の「デマ」として却下した。トランプは検査なしのAI成長を支援することを誓約する一方で、主要なAI企業が自主規制措置を提案し安全性への懸念を認めている中で、米国が中国の部門でリードしていると主張している。", "summary_en": "US President Donald Trump announced the formation of an \"AI Force\" and plans to appoint an \"AI czar,\" dismissing expert warnings about artificial intelligence risks as Democratic \"hoaxes.\" Trump vowed to support unchecked AI growth while claiming the US leads China in the sector, even as major AI companies propose self-regulatory measures and acknowledge safety concerns.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/trump-announces-new-ai-force-amid-mounting-pressure/a-79339935?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "IT", "full_text": "Trump announces new 'AI force' amid mounting pressure\nSeptember 19, 2026\nUS President Donald Trump has said he is forming an \"AI force,\" as many, including those from within the industry, have recently sounded the alarm about the dangers of Artificial Intelligence continuing to grow unchecked.\nIn a social media post on Saturday, Trump said he will announce an \"AI czar\" to lead the force soon.\nThe US president continued to brush off warnings about AI's dangers from experts and the AI industry itself as \"hoaxes\" pushed by the Democrats.\nWhat did Trump say about the 'AI force'?\nWhile dismissing warnings about AI, Trump still vowed to be \"be looking for BAD, and we can do that, very easily, with our already existing criminal and civil justice system.\"\n\"For this purpose, I am forming the AI Force, much like I did Space Force, which has been a tremendous SUCCESS, in my first term. To that end, I will be announcing, in the near future, the AI 'Czar,'\" Trump wrote on his Truth Social platform.\nThe US president, who has enjoyed a close relationship with big tech bosses especially during his second term in office, also vowed \"not in any way hinder or stifle the growth of this incredible Industry,\" in reference to AI.\n\"Rather, we will cherish it, help it, and watch over it, as it grows!\"\nHe described AI as \"the next industrial revolution,\" predicting it will account for 25% of the US GDP.\n\"We are leading China, and the rest of the World, and I intend to keep it that way!\"\nTrump compared the criticism of the unchecked, ultrafast growth of AI to what he called other \"hoaxes,\" listing efforts to impeach him, transgender rights and global warming as examples.\nWhy have there been growing calls for regulating AI?\nSome of the top names in AI said earlier this week they were working on creating a standards body they say would regulate the industry.\nIndustry giants including ChatGPT's OpenAI, Google and Anthropic said they envisioned a self-regulatory body.\nThe proposal comes amid growing concerns about AI safety, which have escelated in recent weeks, with several AI agents going rogue and breaking into competitors' systems.\nEven top names within the industry have raised similar concerns.\nLast week, Anthropic CEO Dario Amodei called for a slowdown in the industry's development, with OpenAI CEO Sam Altman, xAI's Elon Musk and Google DeepMind chair Demis Hassabis all supporting the sentiment.\nTrump has dismissed calls to contain AI development as \"hoaxes\" and a \"conspiracy.\"\nSmaller AI companies have meanwhile warned any self-regulatory measures spearheaded by the big names would come at their expense.\nEdited by: Zac Crellin\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "unchecked", "definition": "制限されない、チェックされない状態を意味する。何かの成長や進展が規制や監督なしに進むことを表す。"}, {"word": "rogue", "definition": "不正な、背信的な状態を示す形容詞。特にAIシステムが意図した動作をせず、予期しない独立的な行動をする場合に使用される。"}, {"word": "self-regulatory", "definition": "業界が外部規制ではなく、自らの内部ルールで規制される形態を指す。自主規制機構などに関連する用語。"}, {"word": "sentiment", "definition": "一般的な考えや意見、感情的な立場を意味する。複数の人物が共有する見方や態度を表す。"}, {"word": "spearheaded", "definition": "主導する、先導する動詞の過去形。特定の取り組みや計画の先頭に立つことを意味する。"}, {"word": "escalated", "definition": "エスカレートした、激化した。問題や懸念が次第に大きくなり、より深刻になることを表す。"}]}, {"title_ja": "ドイツ・ロシア関係の冷え込み", "title_en": "German-Russian Relations at Freezing Point", "summary_ja": "2022年のウクライナ侵攻に続き、数十年間続いたドイツのロシアとのエネルギーパートナーシップは完全に崩壊し、制裁やウクライナへの軍事支援、外交施設の相互閉鎖が行われている。ドイツ政府はロシアのサイバー攻撃と破壊行為の責任を公式に非難する一方、極右政党の圧力がウクライナ支援の継続を脅かしている。ロシアは関与を否定し、ドイツの非難を直接的な紛争の始まりと見なしている。", "summary_en": "Germany's decades-long energy partnership with Russia has completely collapsed following the 2022 invasion of Ukraine, marked by sanctions, military aid to Ukraine, and mutual closure of diplomatic facilities. The German government now publicly blames Russia for cyberattacks and sabotage attempts, while domestic far-right political pressure threatens continued support for Ukraine. Russia denies involvement and views German accusations as the beginning of direct conflict.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/german-russian-relations-at-freezing-point/a-79330741?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "German-Russian relations at freezing point\nSeptember 19, 2026\nFor many years, Germany and Russia had a perfect partnership.\nRussia supplied cheap energy, which helped German industry succeed in exporting its goods worldwide. This partnership began in the early 2000s. On the German side was Chancellor Gerhard Schröder from the center-left Social Democratic Party (SPD), followed later by Chancellor Angela Merkel of the conservative Christian Democratic Union (CDU). Their counterpart was Vladimir Putin.\nEven when Russia annexed the Ukrainian peninsula of Crimea in 2014, business continued as usual. It was then that the agreement to build Nord Stream 2, a direct gas pipeline between Russia and Germany designed to bypass Ukraine was signed. At the time, other European countries and the US warned that the pipeline would provide Russia with powerful leverage.\nThe warnings proved to be correct. On February 24, 2022, Russian tanks rolled into Ukraine. German hopes for a stable European order, the democratization of Russia, and the continuation of its lucrative business model were shattered.\nHow could so many German politicians be so wrong?\n\"Shortly before the invasion, the widespread view was that there were no rational grounds for an attack on Ukraine, because the economic, military, and political costs to Russia of starting a war would be far too high,\" Russia expert Mario Baumann of the German Council on Foreign Relations told DW. \"People [in Germany] had projected their own rationality onto Russia. They underestimated the regime's imperialist and revisionist ambitions.\"\nAfter that, nothing in the bilateral relationship was ever the same again. Chancellor Olaf Scholz(SPD) spoke of a Zeitenwende (epochal shift) in foreign and security policy, in the days after the 2022 invasion of Ukraine began.\nSince then, the German armed forces have expanded. Defense Minister Boris Pistorius said the following year, \"We must become capable of waging war,\" a statement that critics still say was an escalation of tensions.\nGermany ended its decades-long energy dependence on Russia and shut down Nord Stream 2. In September 2022, the pipeline was blown up. The Federal Prosecutor's Office suspects a Ukrainian group was responsible.\nA series of EU sanctions have long since reduced Russian-German trade relations to a minimum. Government cooperation in culture, science, and education has also practically ceased to exist.\nA new low point\nWhile the German government under Scholz initially hesitated to take dramatic steps on military aid to Ukraine, Friedrich Merz, then the leader of the opposition, stepped up his rhetoric.\n\"Ukraine must win the war. Russia must lose the war,\" he said in 2024 as leader of the CDU/CSU parliamentary group in parliament. In 2025, as chancellor, he then spoke of Russia's \"economic exhaustion,\" which the West must \"help bring about.\" But that has yet to materialize. To this day, Russia has shown no serious willingness to compromise.\nMeanwhile, Germany is feeling the consequences of its military support for Ukraine. The German government has long suspected Russia of being behind cyberattacks on government agencies and critical infrastructure.\nSo when an armed drone was discovered and defused in August 2026 at Leipzig Airport close to Ukrainian transport aircraft — which transport a large portion of the military aid to Ukraine — the government was certain: For the first time, it publicly blamed the Kremlin.\nA Russian cultural center in Berlin and the Russian consulate in Bonn were closed, which the German government said were being used as espionage centers. Moscow responded by closing the Goethe Institutes and the German consulate in St. Petersburg.\nPutin has denied Russian responsibility for the Leipzig incident, calling it a \"serious mistake\" to blame Moscow, while Russian Foreign Minister Sergey Lavrov even described the accusations as the \"beginning of a real war.\" But Baumann says: \"We shouldn't give in to the fears being stoked, because they are part of Russia's strategy to weaken Germany and Europe.\"\nAfD wants to resume relations with Russia\nThe German government is also facing domestic pressure as the far-right Alternative for Germany(AfD) has made gains in regional elections and is rising in the national polls. The AfD would prefer to end support for Ukraine and normalize relations with Russia, including deals on oil and gas. High fuel prices in Germany have only made the issue more explosive.\n\"German support for Ukraine worries many people,\" said Sven Leunig, political scientist at the University of Jena in Thuringia, following the election in the neighboring state of Saxony-Anhalt, where the AfD won the September 6 election by a landslide. However, he noted, \"it is less a fundamental rejection of the support itself than a reaction born of fear. People want to 'stay out' of the conflict so as not to be drawn into it more deeply themselves.\"\nIn the latest ARD Deutschlandtrend survey, 42% of respondents ", "translation_ja": "", "vocab": [{"word": "leverage", "definition": "ある目的を達成するために他者に対して使用できる力や影響力のこと。交渉や圧力の文脈で使用される。"}, {"word": "Zeitenwende", "definition": "歴史的な転換点や時代の大きな変化を意味するドイツ語。政治的な方針の根本的な転換を示す。"}, {"word": "bilateral", "definition": "二国間の、または二者間の関係や協定に関する形容詞。国家間の外交関係でよく使用される。"}, {"word": "revisionist", "definition": "既存の国際秩序や歴史的現状を変更しようとする立場や政策を指す。地政学的文脈で使用される。"}, {"word": "cyberattacks", "definition": "コンピュータやネットワークに対するデジタル攻撃。政府機関やインフラへの悪質な行為を含む。"}, {"word": "normalize", "definition": "特に政治的または外交的な関係を通常の友好的な状態に戻すこと。国家間の関係改善を意味する。"}]}, {"title_ja": "トランプ大統領、トランプ・ジュニアがロシア富豪への結婚式パーティー代を返金したと主張", "title_en": "Trump Claims Jr. Repaid Russian Oligarch for Wedding Party", "summary_ja": "トランプ大統領は、ドナルド・トランプ・ジュニアがロシア人富豪への結婚式パーティーの費用を返金したと述べた。しかし、大統領もトランプ・オーガニゼーションも、この主張を裏付ける証拠を提供していない。", "summary_en": "President Trump stated that Donald Trump Jr. repaid a Russian oligarch for a wedding party expense. However, neither the president nor the Trump Organization has provided evidence to support this claim.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-donald-trump-jr-repaid-russian-oligarch-wedding/story?id=136571775", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、速報ニュースとライブイベントを24時間体制で配信しています。主要なニュース速報をリアルタイムで更新し、視聴者に提供しています。いつでも重要なニュースイベントのオンデマンド配信にアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. The platform delivers real-time updates on major stories as they develop. Viewers can access on-demand coverage of significant news events anytime.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI大手企業が違法な開発減速合意を結んだと主張する訴訟", "title_en": "Lawsuit alleges AI giants made illegal agreement to slow development", "summary_ja": "新たな訴訟により、AnthropicやOpenAI、SpaceXのAI部門、Googleが違法な合意によってAI開発を意図的に遅延させ、独占禁止法に違反したと主張されている。この訴訟は、世界的に有力なAI開発企業間の潜在的な競争制限行為に疑問を呈している。業界内の協調的な反競争的慣行の可能性が問われている。", "summary_en": "A new lawsuit claims that Anthropic, OpenAI, SpaceX's AI division, and Google violated antitrust laws by entering into an illegal agreement to slow down AI development. The suit argues that these leading companies coordinated to restrict competition in the artificial intelligence sector. The case raises questions about potential anticompetitive practices among the world's most prominent AI developers.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Technology/wireStory/lawsuit-anthropic-openai-spacexai-google-made-illegal-agreement-136588615", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "拘置ホテルの状況を暴露した米国強制送還者がエクアトリアルギニアで暴力を受ける", "title_en": "US deportees in Equatorial Guinea beaten after exposing detention conditions", "summary_ja": "トランプ政権によってエクアトリアルギニアに強制送還された2人の男性が、拘置ホテルの劣悪な状況をスマートフォン動画で記録した後、拘束され暴力を受けて投獄された。この事件は国際的な懸念を引き起こしており、沿岸都市マラボの施設に約30人の米国強制送還者が取り残されたままで、虐待と医療アクセスの欠如に直面している。", "summary_en": "Two men deported by the Trump administration to Equatorial Guinea were bound, beaten, and imprisoned after documenting poor conditions at a detention hotel via cellphone videos. The incident has sparked international concern, with about 30 US deportees remaining trapped at the facility in the coastal city of Malabo, where they face abuse and lack access to medical care.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/18/us-men-deported-hotel-equatorial-guinea", "state_media": false, "category": "社会", "full_text": "Two men that the Trump administration expelled to Equatorial Guinea were bound, fitted with bags over their heads, beaten and pushed down a flight of stairs, all in plain view of other US deportees, according to witnesses and human rights lawyers.\nThe men – one from Egypt and one from Eritrea – were then taken to a prison. About 30 detainees from the US remain trapped at a hotel in the outskirts of the coastal city of Malabo after being deported from the US. Detainees have said they believe the men were beaten for telling the press and human rights advocates about the poor conditions and violence inside the hotel, and that they are haunted by flashbacks and terrified they will be retaliated against next.\nHuman rights advocates and experts have warned for months that conditions at the Hotel Bamy – a run-down establishment that has served as a detention center for US deportees – are dangerous.\nThe US has sent at least 66 people from different African countries, Cuba and Brazil to Equatorial Guinea, which has received $7.5m as part of a deal to cooperate with the US deportation program. The Trump administration has pursued dozens of similar deals with countries to take in immigrants that the US cannot deport directly to their home countries, where judges have deemed they would face torture or persecution. In the past, the US government allowed those people to live and work in the US indefinitely.\nThe Trump administration, however, has sought instead to expel them to third countries where they have no ties, do not speak the local language and have no legal status – trapping them in limbo.\nAdvocates have been especially concerned for deportees sent to Equatorial Guinea, where the authoritarian government is notorious for human rights abuses, including torture, according to the US state department. Detainees held at Hotel Bamy have told the Guardian that armed guards keep watch over them 24/7, and that they have not been provided any medical care or even fresh clothes since arriving there. One of the detainees, who has a severe stomach hernia that requires visits to the hospital to drain his stomach due excessive fluid build-up, said he has been unable to see a doctor since arriving at Hotel Bamy.\nOther detainees have managed to obtain medication for HIV, diabetes and other conditions via human rights lawyers, but remain fearful that access to medications will be arbitrarily cut off.\nThe two men who were tortured – Ahmed Soliman, 31, of Egypt, and Samson Birhane, 47, of Eritrea – have since been transferred to a prison in Malabo. Multiple witnesses recounted that the police officers shouted, “Where is the phone? Where is the phone!” as they beat the men, who had initially been accused of breaking a mirror at the hotel before they were pulled aside and arrested.\nThe beating, which occurred on 11 September, followed the release of a video first reported by Reuters showing conditions at the hotel and the violent behavior of the guards. The detainees had been using cellphones to communicate with lawyers and the media about the conditions they were facing.\nIn the video taken by Soliman, which lawyers shared with the Guardian, authorities are seen pointing guns at the deportees. A Cuban man asked the officer for the return of his confiscated mobile phone so he could contact relatives and a lawyer, but was ignored. When officers noticed Soliman filming the exchange with his mobile phone, multiple officers rushed at him and others standing nearby, pointed their guns, and told Soliman to remain on his knees with his hands up for 10-15 minutes.\nIn another video, Soliman was able to film authorities forcibly sending US deportees to Ethiopia, where they are likely to face torture. When deportees resisted going with authorities, officials gave them the option to “go back to their home country” or “go to prison”. At least 12 people have been returned by Equatorial Guinea to their home country, where they face persecution.\nIn May, human rights experts at the United Nations issued a rare public appeal asking Equatorial Guinea to halt plans to return deportees to their home countries and to comply with international human rights standards and avoid refoulement, or the expulsion of people to countries where they face persecution.\n“This is a human rights catastrophe,” said Bella Mosselmans, director of the Global Strategic Litigation Council, who represents several of the deportees at Hotel Bamy. The US and Equatorial Guinea “must be held accountable for the atrocities they are committing”, she added.\nIn the week since Soliman and Birhane were beaten, police have also been searching the other detainees’ hotel rooms for cellphones, and have confiscated them. They have also barred lawyers from seeing the deportees. Authorities have told the 29 US deportees who remain at Hotel Bamy that they may never see Soliman or Birhane again, according to lawyers. One detainee who witnessed the beating said authorities treat them as if they are “", "translation_ja": "", "vocab": [{"word": "refoulement", "definition": "国際法における用語で、迫害や拷問の危険がある国への人物の強制送還を意味する。難民保護の原則に違反する行為。"}, {"word": "authoritarian", "definition": "権力が少数の指導者に集中し、個人の自由や民主的な参加が制限される政治体制を説明する形容詞。"}, {"word": "atrocities", "definition": "極めて残酷で非人道的な行為や暴力を指す名詞。深刻な人権侵害を描写する際に使用される。"}, {"word": "limbo", "definition": "不確実で不安定な状態に置かれること。法的地位や身分が定まらない状況を表す。"}, {"word": "confiscated", "definition": "政府や当局が合法的または不当に個人の所有物を没収または差し押さえることを意味する過去形。"}, {"word": "comply", "definition": "規則や要求に従うこと、または同意すること。国際的な基準や法律に従う義務を表す。"}]}, {"title_ja": "ナイジェリアの獄舎で過密と換気不足により37人が死亡", "title_en": "37 Die in Nigerian Prison Cell Due to Overcrowding and Poor Ventilation", "summary_ja": "ナイジェリアの準軍事組織NSCDCが運営するミンナの獄舎で、違法金鉱採掘の容疑者37人（多くは10代）が死亡しました。生存者らは過密な環境と換気不足により呼吸ができなくなったと証言しており、当局は最初は病気の流行を非難していました。この死亡事件は抗議活動と政府の調査を引き起こし、NSCDC司令官は停職となりました。", "summary_en": "Thirty-seven suspected illegal gold miners, many of them teenagers, died in an overcrowded prison cell operated by Nigeria's paramilitary NSCDC group in Minna. Survivors reported severe overcrowding and lack of ventilation made breathing impossible, though authorities initially blamed a disease outbreak. The deaths sparked protests and a government investigation, with the NSCDC commandant suspended.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/18/survivor-panic-struggle-breathe-nigeria-prison-cell-died-minna", "state_media": false, "category": "政治", "full_text": "Survivors from a prison cell in Nigeria where 37 suspected illegal goldminers died while in the custody of a paramilitary group this week have recounted their panic and struggle for breath, as police on Friday fired teargas at people protesting against the deaths and imposed an overnight curfew in the city of Minna.\nThe victims – many of whom were children – were found dead on Thursday in the cells of the Nigeria Security and Civil Defence Corps (NSCDC), which had raided suspected illegal goldmines and locked up dozens of miners in the city, the state capital of the mineral-rich state of Niger.\nNSCDC – a paramilitary group that works with police – initially blamed the deaths on a disease outbreak. However, an intelligence report seen by Agence France-Presse (AFP) said preliminary information suggested that overcrowding and inadequate ventilation were responsible.\nThe state governor, Umar Bago, said many of the dead were children, aged 14 to 18, who had been working in the mines instead of going to school. “There are issues of illegal mining and it is taking a toll on our children,” he said.\nDauda Shehu, a survivor from the cell, told journalists at a hospital on Friday: “We were jam-packed in the cell, no ventilation for us to breathe well. All of a sudden we realised that we could not breathe and we were all scampering for where to get fresh air, we even appealed to them several times, banged the cell door, but they refused to answer us.”\nA video shared online showed the bodies of dozens of young men clad only in shorts, most of whom appeared to be teenagers, sprawled on the ground out in the open. Volunteers wearing gloves can be seen standing over the dead, while veiled women try to identify the bodies of their relatives. Voices shouting curses on those responsible can be heard in the background.\nAFP reported that another survivor, who asked not to be named, said he had made it out alive because he was near the cell’s entrance, where he could breathe better. “We were screaming for help,” he said, with detainees telling the guards that “people are dying one after the other. They did not believe us.”\nPresident Bola Ahmed Tinubu ordered an investigation into the deaths after his government earlier suspended some senior officials.\nBut protests over the deaths broke out on Thursday evening in Minna. On Friday dozens of young people, including miners and their relatives, gathered near the NSCDC’s office in the city. Police cordoned off the area and attempted to disperse the protesters by firing teargas.\nA Reuters witness saw security forces fire live rounds as protesters – some armed with sticks, machetes and traditional hunting rifles – called for justice. Some protesters tried to set fire to government buildings in the Tunga neighbourhood. “We are not thieves – we are simply seeking a way to make a living by mining,” Yusuf Auwal, a miner who joined the protesters, told Reuters. At least one body lay on the streets. Soldiers and police officers patrolled Minna to try to restore order.\nAs curfew began at 6pm local time on Friday, security forces appeared to have at least temporarily restored order to the streets of the city.\nThe NSCDC said the detainees had been held in raids on suspected illegal mines on 15 and 16 September in the Wushishi-Lukoto area west of Minna. Nigeria’s interior minister, Olubunmi Tunji-Ojo, ordered the immediate suspension of Niger state’s NSCDC commandant, Suberu Siyaka Aniviye, pending the outcome of an investigation.\nNiger state, which is Nigeria’s largest and is more than twice the size of Belgium, is rich in minerals and attracts thousands of artisanal miners, most lured by gold.\nPolice and the NSCDC did not initially provide a precise number of deaths but the state governor, Mohammed Umaru Bago, later confirmed 37 people had died.\n“It’s so sad, it’s so tragic,” he said, adding an inquiry into the deaths had already started work. He declared three days of mourning and postponed the start of campaigning for elections due in January. The men were buried on Thursday, according to Islamic tradition, without any forensic investigations.\nThe scramble for gold reserves dug up in illegal mines in Niger state is fuelling violence by criminal gangs, according to officials and experts. The gangs tax the miners and demand a cut from the extracted ore as a levy to allow them access to the pits.\nMost of the illegally mined gold is smuggled to the United Arab Emirates, where it is laundered into the global supply chain in Europe, the US, Asia and South Africa, according to a 2024 Swissaid report.\nApart from gold, the state of Niger sits on deposits of other minerals including tantalite, copper and lithium, which are in strong demand for use in electric vehicles and clean energy technology.\nAgence France-Presse and Reuters contributed to this report", "translation_ja": "", "vocab": [{"word": "paramilitary", "definition": "政府の正規軍ではなく、軍事的な訓練と組織を持つ民間の武装集団。準軍事組織と訳される。"}, {"word": "ventilation", "definition": "空間に新鮮な空気を循環させるプロセスや装置。換気のこと。"}, {"word": "commandant", "definition": "軍事組織や準軍事組織の長官や司令官のこと。指揮官を意味する。"}, {"word": "forensic", "definition": "犯罪捜査や法的な目的で科学的な方法を使うこと。法医学的な分析に関する。"}, {"word": "artisanal", "definition": "大規模な機械を使わず、手作業や小規模な方法で行われる産業。職人的な。"}, {"word": "levy", "definition": "政府や組織が課す税金や料金。徴収される負担金を意味する。"}]}, {"title_ja": "マラウイでの銃撃戦により英国人女性が救出される", "title_en": "British Woman Rescued in Malawi After Police Shootout with Kidnappers", "summary_ja": "9月11日にマラウイのブランタイアで誘拐された47歳の英国人監査官ヌスラット・オスマン氏が、警察による銃撃戦の後に救出されました。4人の容疑者が銃撃で殺害され、警察の副検査官が負傷しましたが、状態は安定しています。マラウイでの誘拐事件は稀で、救出前に身代金要求はありませんでした。", "summary_en": "A 47-year-old British auditor, Nusrat Osman, was rescued by Malawian police after being kidnapped in Blantyre on September 11. Four alleged abductors were killed in a shootout, and a police deputy inspector general was injured but in stable condition. Kidnappings are rare in Malawi, and the family had received no ransom demands before the rescue.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/18/british-woman-kidnapped-malawi-police-shootout", "state_media": false, "category": "政治", "full_text": "A British woman kidnapped in Malawi last week has been rescued by police after a shootout in which four of her alleged abductors were killed.\nNusrat Osman was abducted outside her home in the southern city of Blantyre on 11 September at about 12.30pm. Police had offered a reward of 30m Malawi kwacha (£12,950) for information leading to her rescue and the arrest of the perpetrators.\nMalawian police announced Osman’s rescue late on Thursday in a statement. “There was an exchange of fire between police and kidnappers, who were armed with [an] AK47 rifle and a Girsan Regard MC pistol. In the process, the criminals got shot and were taken to hospital where they succumbed to their injuries.” it read.\nA police officer, deputy inspector general Mlowoka Noel Kayira, was also shot during the operation. “He is currently receiving medical attention at the hospital and is in a stable condition,” police said.\nOsman, a 47-year-old auditor and mother of two, was safe and “not too shaken” after her ordeal, her brother Shobi Jiwa told the Sun, expressing his gratitude to Malawi’s police.\nJiwa reserved special thanks for Kayira. “He is the hero of our family. He’s the hero of the country,” he said. “He’s the hero of the world, actually, for putting his life at risk and taking a bullet into himself for my sister.”\nKidnappings are rare in Malawi, which has experienced a rise in pickpocketing and house burglaries by often armed men in recent years amid unstable, crisis-ridden economic conditions.\nThe landlocked southern African country is one of the world’s poorest nations, with a population of about 22 million and an average annual income of just $672, according to the World Bank.\nIn 2024, a country report by the US state department’s diplomatic security service said: “Kidnappings are not a widespread concern in Malawi, and there have been no recent high-profile incidents involving westerners.\n“Historically, expatriates have not been significant targets for kidnappings in the country. When kidnappings do occur, they often involve members of the Asian business community rather than foreign travellers or residents.”\nOsman, who is originally from Leicester, worked for a local audit firm and had lived in Malawi with her husband and children for several years. Before her rescue, her family said they had not had any news of her, including any contact from the kidnappers demanding a ransom.\nHer husband, Nazil Osman, told the local news outlet Nyasa Times: “I don’t know where she is or how she is. My wife is an auditor, and I have no issues with anyone.”\nHer brother told the Sun on Tuesday: “My sister has been missing for five days with no trace or call,” adding that the family could not think of a motive for her kidnapping.\nPolice did not say whether information received in response to the offered reward had led to Osman’s rescue, adding that investigations were ongoing and more details would be shared “in due course”.", "translation_ja": "", "vocab": [{"word": "perpetrators", "definition": "犯人や加害者を指します。特に重大な犯罪を行った者に対して使われる正式な表現です。"}, {"word": "ordeal", "definition": "厳しい試練や辛い経験を意味します。通常、精神的または身体的に苦しい状況を指します。"}, {"word": "succumbed", "definition": "病気や傷などで亡くなる、または圧力に屈するという意味です。医療や死亡のコンテキストでよく使用されます。"}, {"word": "landlocked", "definition": "海に面していない陸に囲まれた国や地域を表す地政学用語です。"}, {"word": "expatriates", "definition": "自国以外の国に住む人々を指します。ビジネスや就労目的で海外在住する外国人を意味することが多いです。"}]}, {"title_ja": "フラムvsマンチェスター・ユナイテッド：プレミアリーグ予想と先発メンバー", "title_en": "Fulham vs Manchester United: Premier League Preview and Prediction", "summary_ja": "マンチェスター・ユナイテッドはシーズン開始以来リーグ戦で1勝のみとなっており、マイケル・カリック監督が日曜日のクレイヴン・コテージでのフラム戦を前にプレッシャーを受けている。新監督アルバロ・アルベロアの下でフラムはリーグ戦で未勝利だが、リバプール戦でのドローで希望を見せている。オプタのスーパーコンピュータは94度目の対戦でユナイテッドの勝利確率を47.4%と予測している。", "summary_en": "Manchester United face Fulham at Craven Cottage on Sunday with manager Michael Carrick under pressure after winning only one league game this season. Fulham, under new manager Alvaro Arbeloa, remain winless in the league but showed promise with a draw at Liverpool. Opta's supercomputer gives United a 47.4% chance of victory in their 94th meeting.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/sports/2026/9/19/fulham-vs-manchester-united-premier-league-prediction-teams-lineups?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Fulham vs Manchester United: Premier League – prediction, teams, lineups\nMan United have won only one league game this season, leaving Michael Carrick under pressure ahead of Fulham trip.\nWho: Fulham vs Manchester United\nWhat: English Premier League\nWhere: Craven Cottage, London in United Kingdom\nWhen: Sunday, September 20, at 4:30pm (15:30 GMT)\nHow to follow: Al Jazeera Sport will have all the build-up to our live text commentary stream from 12:30 GMT.\nOne month into the new Premier League season, excuses about bedding-in processes and newly assembled squads needing time to gel are wearing thin and for Manchester United there is an acute sense of urgency as the international break looms.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Mourinho rues lack of ‘control’ as Real visit Atletico for Madrid derby\n- list 2 of 4Eala and Pathirage headline top athletes to watch at the 2026 Asian Games\n- list 3 of 4Real Madrid President says Ceuta visit not related to ‘recent news’\n- list 4 of 4Asian Games 2026: All to know about the dates, venues and sports\nUnited are by no means the only ‘big club’ enduring a faltering start to the campaign but after so much pre-season optimism, the spotlight has fallen very much on manager Michael Carrick ahead of Sunday’s trip to Fulham.\nAl Jazeera takes a closer look at the game:\nHow have Manchester United started the new season?\nUnited have lost three of their six matches in all competitions and suffered a damaging League Cup exit on Wednesday, surrendering a 2-0 lead to Brighton & Hove Albion.\nTheir only win in four league games came at home to promoted Ipswich Town.\nUnited started the better in the VAR-dominated Manchester derby last Sunday, but played second fiddle to the away team after City were reduced to ten men.\nHow have Fulham started the new season?\nThe London club have made a slow start under new manager Alvaro Arbeloa and are yet to win in the league.\nA draw at Liverpool last week and a League Cup win at West Ham United in midweek offered glimpses of better things to come.\nWhat has Carrick said about United’s start to the season?\nCarrick accepted responsibility for the team’s poor start but said the focus must remain on finding solutions rather than assigning blame.\n“It’s my responsibility and I’m fine with that. It’s not a blame game. Blame me, no problem, but it’s not about blaming people,” said the 45-year-old boss.\n“It’s about finding solutions. It’s a whole collective thing. It’s about what you focus on. I know where we want to get to and we want to get there fast.”\nWhat happened the last time Fulham played Man Utd?\nUnited won 3-2 in their last meeting which came in the Premier League at Old Trafford on February 1.\nCasemiro and Matheus Cunha put United two up before a chaotic finale that saw Raul Jiminez net an 85th minute penalty for the Londoners before Benjamin Sesko and Kevin traded injury time strikes.\nWhat happened between Fulham and Man Utd at Craven Cottage last season?\nThe teams shared a 1-1 draw in the Premier League match. Emile Smith Rowe’s 73rd minute goal levelled matters after Rodrigo Muniz put through his own net in the 58th minute.\nWhen did Fulham last beat Manchester United?\nFulham won 2-1 at Old Trafford in the Premier League on February 24, 2024. Harry Maguire appeared to have sealed a point for United in the 90th minute when he cancelled out Calvin Bassey’s 65th minute goal, but Alex Iwobi got Fulham’s winner in injury time.\nUnited have won three of the five meetings since then.\nWhen did Fulham last beat Man Utd at Craven Cottage?\nFulham have not recorded a home win against United since December 2009. Danny Murphy, Bobby Zamora and Damien Duff sealing a 3-0 home win.\nOf the 10 matches since then, United have won nine, scoring 21 and conceding six.\nPrediction: Fulham vs Manchester United\nOpta’s supercomputer has given Manchester United a 47.4 percent chance of winning, while offering Fulham only a 28.3 percent chance of victory.\nHead-to-head: Fulham vs Manchester United\nThis will be their 94th meeting, with Manchester United winning 59 of the encounters and Fulham 14.\nFulham team news\nKenny Tete misses out due to concussion at Anfield last week.\nTom Cairney is also absent with a knee injury, but Ryan Sessegnon will have a late fitness test as he returns from a groin problem.\nPredicted Fulham lineup\nLeno; Castagne, Affengruber, Bassey, Robinson; Berge, Charles; Bobb, King, Iwobi; Garcia\nManchester United team news\nUnited will make a late decision on whether to include Luke Shaw and Carlos Baleba in the squad. Both have had ankle problems, but could feature.\nManuel Ugarte, Tom Heaton, Matthijs de Ligt and Amad Diallo all remain sidelined with injuries.\nPredicted Manchester United lineup\nLammens; Dalot, Maguire, Martinez, Shaw; Mainoo, Tielemans; Mbeumo, Fernandes, Cunha; Sesko", "translation_ja": "", "vocab": [{"word": "faltering", "definition": "衰えてきた、不安定になってきたという意味。ここではチームのパフォーマンスが低下していることを表す。"}, {"word": "acute", "definition": "深刻な、激しいという意味。ここでは状況が急速に悪化しており緊迫していることを示す。"}, {"word": "bedding-in", "definition": "なじむ、適応するという意味。新しいチームメンバーが互いに協力関係を構築するプロセスを指す。"}, {"word": "glimpses", "definition": "一瞬の垣間見、ちらりと見ることという意味。ここでは良いパフォーマンスの兆候を短時間見ることを表す。"}, {"word": "damaging", "definition": "害をもたらす、悪影響を与えるという意味。ここではチームの戦績や自信に悪い影響を与えることを指す。"}, {"word": "supercomputer", "definition": "スーパーコンピュータ、非常に高速で複雑な計算ができるコンピュータ。スポーツ予測では膨大なデータを処理して確率を算出する。"}]}, {"title_ja": "イスラエル大統領、負傷したパレスチナ人を殺害した兵士を恩赦", "title_en": "Israel's President Pardons Soldier Convicted of Killing Wounded Palestinian", "summary_ja": "イスラエルのヘルツォク大統領は、2016年ヘブロンで負傷したパレスチナ人を銃撃して過失致人罪で有罪判決を受けたエロール・アザリア元兵士の犯罪記録を抹消した。イスラエル軍の反対があったにもかかわらず決定され、アザリアが悔悟を示していないことが指摘された。この恩赦は国際的な非難を招き、イスラエル軍の説明責任に関する議論を呼び起こした。", "summary_en": "Israeli President Isaac Herzog has expunged the criminal record of Elor Azaria, a former soldier convicted of manslaughter for shooting a wounded Palestinian in Hebron in 2016. The decision came despite opposition from the Israeli military, which noted Azaria had shown no remorse. The pardon drew international condemnation and renewed debate over accountability in Israeli military conduct.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/19/israels-president-pardons-soldier-who-killed-wounded-palestinian-in-2016?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Israel’s president pardons soldier who killed wounded Palestinian in 2016\nElor Azaria had shot a Palestinian who had already been incapacitated by Israeli troops, in controversial case.\nIsraeli President Isaac Herzog has expunged the criminal record of a former soldier convicted of manslaughter for killing a wounded Palestinian in Hebron a decade ago.\nHerzog announced on Saturday that he had shortened the remaining erasure period on Elor Azaria’s record, effectively clearing it despite opposition from Israeli army Chief of Staff Lieutenant-General Eyal Zamir.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Anger erupts over video of Palestinian shot by Israeli sniper\n- list 2 of 3Israeli soldier filmed killing Palestinian released from prison\n- list 3 of 3Slain Palestinian’s family not surprised by unrepentant Azaria\nThe military had opposed the move.\nIn a letter to the defence minister, Zamir and other senior officers said Azaria “has refrained from expressing remorse and taking responsibility for his actions, even a decade after his conviction”.\nThe president’s office said it had taken the military’s position into account but decided the circumstances justified allowing Azaria to “open a new chapter in his life”.\nAzari
