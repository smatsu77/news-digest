a, an army medic at the time, was filmed shooting Abdel Fattah al-Sharif in the head in March 2016.\nAl-Sharif had stabbed and wounded a soldier but had already been shot by Israeli troops and had lain on the ground for about 11 minutes before Azaria killed him.\nAzaria was convicted by a military court in 2017 and sentenced to 18 months in prison, later reduced to 14 months. He was released in May 2018 after serving nine months.\nHerzog’s office said the decision followed a request from Defence Minister Israel Katz in July and was based on “the passage of time, the completion of his sentence, and the remorse he has expressed”.\nThe statement added that the pardon was issued “in the spirit” of Yom Kippur, the Jewish Day of Atonement, and did not challenge the original legal proceedings.\nKatz welcomed the pardon, writing on X that it “sends an important message to [Israeli army] soldiers and their families: We do not abandon our fighters”.\nFar-right National Security Minister Itamar Ben-Gvir, called the decision “deeply moving” and urged Herzog to grant a similar pardon to Prime Minister Benjamin Netanyahu, who is on trial for corruption.\nThe 2016 shooting generated intense debate in Israel and drew international condemnation at the time.\nThe Palestinian Ministry of Foreign Affairs had condemned the shooting as an “extrajudicial execution” and a “war crime”, saying the video footage “demolished all the slogans chanted by the occupation leaders about the ethics of the Israeli army”.\nThe family of al-Sharif had dismissed the legal proceedings as a “farce” aimed at improving Israel’s international image rather than delivering justice.\nThe United Nations human rights office described the original sentence as “excessively lenient” and said it risked “reinforcing the culture of impunity”.\nIn 2024, the Joe Biden administration barred Azaria and his immediate family from entering the United States, citing an “extrajudicial killing”.", "translation_ja": "", "vocab": [{"word": "expunge", "definition": "公式記録から何かを削除または消去することを意味する法律用語。刑事記録を完全に削除し、なかったものとして扱う。"}, {"word": "manslaughter", "definition": "故意ではなく過失または一時的な感情で他人を殺すことの罪。殺人よりも軽い犯罪として扱われる。"}, {"word": "impunity", "definition": "罰せられることなく悪いことをする自由のこと。特に権力者が法的責任を問われない状態を指す。"}, {"word": "extrajudicial", "definition": "裁判所の法的手続きを経ずに行われることを意味する。特に政府が法律を無視して行う行為を指す。"}, {"word": "remorse", "definition": "自分の行為に対する深い後悔や罪悪感のこと。過去の悪い行為を心から悔いる感情。"}, {"word": "condemnation", "definition": "何かまたは誰かを厳しく批判または非難すること。強い反対意見を公式に述べる行為。"}]}, {"title_ja": "戦争の破壊にもかかわらずガザの学生がテク技術を追求", "title_en": "Gaza Students Pursue Tech Skills Despite War's Destruction", "summary_ja": "戦争によるインフラの深刻な被害にもかかわらず、ガザの若い学生たちはデイル・アル・バラの「ネクストジェン」プロジェクトなどのイニシアチブを通じてロボット工学とプログラミングを学び続けています。限られた機器ながら強い決意を持つこれらの学生は、技術スキルを維持し、コミュニティの未来に貢献するために取り組んでいます。戦争はガザの教育システムと技術部門を荒廃させ、数千人の学生を殺害し、大学と訓練施設を破壊しました。", "summary_en": "Despite severe infrastructure damage from the war, Gaza's young students continue learning robotics and programming through initiatives like The Next Gen Team project in Deir el-Balah. With limited equipment but strong determination, these students work to maintain their technical skills and contribute to their community's future. The war has devastated Gaza's education system and technology sector, killing thousands of students and destroying universities and training facilities.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/features/2026/9/19/lacking-equipment-but-not-ambition-gaza-students-try-to-keep-up-with-tech?traffic_source=rss", "state_media": false, "category": "IT", "full_text": "Lacking equipment, but not ambition: Gaza students try to keep up with tech\nGaza’s IT sector was once considered the hope for enclave’s disenfranchised youth. Now, it is mostly in ruins.\nDeir el-Balah, Gaza – A handful of electronic components, a few wires and a basic programmable circuit board are enough to bring a group of curious children around a table in central Gaza to learn about robotics.\nStudents at The Next Gen Team: Rising Robotics Engineer Project in Deir el-Balah learn how to integrate sensors into alarm systems, study robotics, understand how motors and drive units work, as well as get firsthand experience with programming.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Two injured by Israeli shelling as troops advance in southern Lebanon\n- list 2 of 4Israeli strike on motorcycle kills Palestinian in Gaza City, injures child\n- list 3 of 4EU urges US to lift travel ban on Palestinian delegation for UNGA meeting\n- list 4 of 4NAZA: Why are old Gaza allegations causing new fury in Israel?\nThe children’s research could save lives in the future. The robotics and early warning systems they are working on could make way for bigger developments such as early detection of gas leaks and fires or help rescue workers access hard-to-reach areas, such as victims trapped under rubble.\nToday’s lesson will also teach students the sciences of the future and help them keep pace with technological advancements happening outside Gaza’s borders.\nBefore the war, students had access to schools, universities, incubators and training programmes to pursue an interest in technology.\nWith much of that infrastructure now destroyed or damaged during Israel’s genocidal war on Gaza, there are few places and tools for students to work with.\nBut their interest in robotics and will to learn are helping them maintain their skills and ambitions for the future, something they hope will be of benefit when the bombs stop falling on Gaza.\nLearning with limited tools\nHamza al-Atrash, 16, is a student taking part in the “Next Gen” project and learning how electronic components can be used to develop robots and early-warning systems. To do this, he is using an Arduino controller – a programmable circuit board which connects sensors – and some other electronics.\nStudents work with what they have, but a shortage of equipment and electricity outages make studying a challenge.\n“We have capabilities and aspirations that we want to develop, and we try to take advantage of every available opportunity for learning and training,” Hamza tells Al Jazeera.\nHamza hopes the skills that he and his cohort learn in class will benefit his community and provide new opportunities for young people in Gaza.\n“The lack of devices and equipment doesn’t mean we’ll stop. It pushes us to look for solutions and make the most of the simple tools we have,” he said.\nThe challenges facing these students are part of a wider disruption to Gaza’s technology and innovation sector.\nBefore the war, Gaza had several incubators that supported technology projects and startups. Bahaa al-Masri, head of the training team for the Early Warning Systems and Robotics Project, said it provided a rare bit of hope for children and young adults in the besieged enclave.\n“These incubators provided an environment for training and development. They helped innovators and entrepreneurs turn their ideas and projects into prototypes and ventures,” he told Al Jazeera.\nThe war severely damaged this ecosystem: training spaces were lost, equipment difficult to find, and students and innovators left with limited opportunities to experiment and develop their ideas.\nAlthough challenges remain, the trainers are continuing their mission of educating budding tech experts in Gaza.\n“We have a generation of students who possess genuine passion and talent in technology and digital systems,” he told Al Jazeera. “They need the environment and tools to develop these abilities and turn their ideas into projects that can serve their community and their future.”\nEducation pays the price\nThe near-collapse of Gaza’s technology sector has coincided with the widespread destruction of the education system, with schools, universities and research facilities repeatedly targeted by Israel during the war.\nPreliminary estimates from the Government Media Office in Gaza put direct losses to the education sector at approximately $4bn. Seventeen higher education institutions have been completely or partially destroyed since October 2023, preventing about 620,000 high school students and 90,000 university students from continuing their education.\nApproximately 20,228 students and 830 teachers and educational staff have also been killed, along with 194 scientists, academics and researchers.\nFor students seeking to enter technical fields, the loss of such educational facilities and teachers means fewer opportunities to gain practical experience and hone their skills.\nBefore the war, the IT industry was one of the promising sectors o", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "他の地域に囲まれた領土や地域を指す。本文ではガザが周囲の地域から分離された地域であることを示すために使われている。"}, {"word": "disenfranchised", "definition": "政治的・経済的・社会的な権利や機会から排除された状態。不利な立場にある人々を指す。"}, {"word": "incubators", "definition": "新しい事業やプロジェクトの成長を支援する施設やプログラム。起業家や革新者が発展させるための環境を提供する。"}, {"word": "ecosystem", "definition": "相互に関連し合うシステムや環境の総体。ここでは技術産業全体の構造を指す。"}, {"word": "preliminary estimates", "definition": "最終的でない初期段階の推定値や計算。より詳細な調査前の概算数値。"}, {"word": "devastated", "definition": "甚大な被害を受けた、破壊された状態。大規模な損失や荒廃を意味する。"}]}, {"title_ja": "サウジアラビア、イエメンの反政府勢力フーシ派によるリヤド弾道ミサイル攻撃を確認", "title_en": "Saudi Arabia Confirms Houthi Ballistic Missile Attack on Riyadh", "summary_ja": "サウジアラビアは2026年9月19日、イエメンの親イラン系反政府勢力フーシ派が首都リヤドに弾道ミサイルで攻撃を試みたことを確認したと発表した。サウジアラビア主導の有志連合はミサイルを迎撃したと述べているが、住民は爆発音を聞き空港付近で煙を目撃した。この事件は紛争の危険な拡大を示すもので、紅海の世界的な海上輸送路を脅かしている。", "summary_en": "Saudi Arabia reported that Yemen's Houthi rebels attempted to strike the capital Riyadh with a ballistic missile on September 19, 2026, marking the first such attack since escalations began. The Saudi-led coalition stated the missile was intercepted, though residents heard explosions and saw smoke near the airport with no casualties reported. The incident represents a dangerous escalation in the Iran-backed conflict that threatens global shipping lanes in the Red Sea.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/saudi-arabia-confirms-yemens-houthi-rebels-tried-to-attack-its-capital-with-ballistic-missile/article71486051.ece", "state_media": false, "category": "社会", "full_text": "Saudi Arabia on Saturday (September 19, 2026) confirmed that Yemen's Houthi rebels tried to attack its capital with a ballistic missile, the first targeting of Riyadh since the escalation in fighting with the Tehran-backed rebels that has opened a new front in the Iran war.\nThe statement by the Saudi-led coalition fighting the Houthis came long after the dawn attempt, which the coalition said was intercepted. Some residents in Riyadh heard an explosion.\nLater, some saw a plume of smoke near the airport. There were no reports of casualties or damage.\nThe statement also said the Houthis tried to attack civilian infrastructure in the Red Sea port city of Yanbu — where a key Saudi pipeline ends — and in Taif, Baysh and Farasan, but they were thwarted, giving no further details.\nThe Houthis earlier claimed, without providing evidence, that they had targeted “sensitive sites” in Riyadh and facilities of Saudi oil giant Aramco in Yanbu, causing “massive fires”.\nAramco, the world's largest oil company, did not respond to a request for comment.\nThe growing conflict near another important global shipping corridor has brought new pressures for markets.\nHouthi military spokesperson Brig. Gen. Yahya Saree claimed they attacked with cruise and ballistic missiles as well as drones.\nHe said Saudi Arabia had attempted to target the rebel-held city of Sanaa in neighbouring Yemen, without giving details. The Associated Press couldn't independently verify the claims.\nRecent days have seen one escalation after another. On Thursday (September 17), the first civilian casualty was reported, as the Saudi civil defence said debris from an intercepted Houthi drone killed a Yemeni resident of Saudi Arabia.\nAnd on Wednesday (September 16), Saudi Arabia said the Houthis had tried to attack Mecca, Islam's holiest city, with a drone that it said was intercepted, calling the security of the birthplace of the Prophet Muhammad a “red line”. The Houthis fiercely denied the accusation.\nThe United States, a close Saudi ally, has signalled that it has no current fight with the Houthis. Regional officials have told The Associated Press that Saudi Arabia is running low on missile interceptors and has instead asked France, Britain, Pakistan and Egypt for air defence support.\nMeanwhile, fighting has surged inside Yemen between the Houthis and the Saudi-backed, internationally recognised government.\nThe rebels raced down the country's Red Sea coast over a week ago, seizing the key port city of Mokha and islands on the Bab el-Mandeb Strait at the southern end of the Red Sea.\nThat has improved their surveillance of passing ships, though the Houthis have said they are only targeting Saudi ones.\nThe fighting in Yemen also marks a return to a devastating civil war after four years of relative calm.\nPublished - September 20, 2026 03:49 am IST", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や緊張が段階的に激化・拡大すること。国際情勢では軍事行動や対立が次第に深刻化する状況を指す。"}, {"word": "intercepted", "definition": "進行中の物体や通信を途中で遮断・捕捉すること。軍事用語では飛来するミサイルや航空機を撃墜・無力化する意味。"}, {"word": "infrastructure", "definition": "国や地域の基本的な施設システム全体を指す。電力網、橋、港湾、パイプラインなどの重要な社会基盤を含む。"}, {"word": "surveillance", "definition": "特定の対象や地域を監視・観察する行為。軍事・セキュリティ分野では敵の動きや船舶の通過を監視することを意味する。"}, {"word": "corridor", "definition": "通路や経路を意味する。国際関係では貿易ルートや重要な航行路など、経済的・戦略的に重要な通行経路を指す。"}, {"word": "thwarted", "definition": "計画や企図を挫折させる・阻止する。意図された行動や攻撃が失敗に終わることを表す。"}]}, {"title_ja": "米国はなぜ『宇宙兵器』を配備したのか？解説", "title_en": "Why has U.S. deployed 'space weapons'? Explained", "summary_ja": "米空軍は敵対的な行為に対抗するため、地球軌道に『宇宙制御』兵器を配備したことを明らかにし、ロシアと中国から批判を受けています。これらの兵器は運動エネルギー型（物理的衝撃）または非運動型（電磁干渉）の方法を使用して、敵の衛星能力を破壊することができます。宇宙条約は軌道上の核兵器を禁止していますが、通常兵器は合法であり、他国は外交的手段を通じて制約交渉を追求できます。", "summary_en": "The U.S. Air Force has disclosed the deployment of 'space control' weapons in Earth's orbit to defend against hostile adversary actions, drawing criticism from Russia and China. These weapons can employ kinetic methods (physical impact) or non-kinetic methods (electromagnetic interference) to disrupt enemy satellite capabilities. While the Outer Space Treaty prohibits nuclear weapons in orbit, conventional weapons remain legal, though other nations can pursue diplomatic avenues to negotiate restraints.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/sci-tech/technology/why-has-us-deployed-space-weapons-explained/article71485873.ece", "state_media": false, "category": "社会", "full_text": "The story so far:\nOn September 14, 2026, U.S. Air Force secretary Troy Meink said the country has “space control” weapons deployed in Earth’s orbit to defend U.S. forces against “hostile adversary action”. The disclosure drew backlash from Russia and China, among other quarters.\nWhat is a ‘space control’ weapon?\nAs per the U.S. Space Force, ‘space control’ refers to military activities required to control the space domain. In 2025, the then-Space Force chief, Gen. Chance Saltzman, said such a device could possess both “kinetic and non-kinetic” capabilities and could disrupt or degrade an adversary’s capabilities.\n‘Kinetic’ generally refers to physically damaging an object through impact, such as by smashing into it. Non-kinetic methods include electromagnetic interference that can jam or spoof a satellite’s communications, and directed energy systems that interfere with its sensors.\nIn fact, the current Space Force war-fighting framework recognises three kinds of counter-space operations: orbital, electromagnetic, and cyberspace.\nWhat has the U.S. deployed?\nWe do not know. We also do not know how many units/instances of the system exist, what they are capable of, which orbits they are in, and whether they are kinetic or non-kinetic. Mr. Meink had said that while disclosing the weapon’s (or weapons’) existence would contribute to deterrence, revealing their operational details would subtract from the deterrence. There is also no indication whether these weapons are the same as the space-based interceptors the U.S. government has planned for the ‘Golden Dome’ missile defence programme. These interceptors are still undergoing tests.\nWhat will the weapons defend against?\nMr. Meink has referred to “hostile adversary action”. Incumbent Space Force chief Gen. Douglas Schiess has also referred to “space-enabled attacks”.\nIn other instances over the years, U.S. officials have repeatedly singled out Russian and Chinese counter-space capabilities as reasons for their government to develop similar capabilities of its own, to protect its own satellites. Russia and China have also demonstrated sophisticated satellite manoeuvres in orbit.\nFor example, in 2020, two Russian satellites manoeuvred close to a U.S. government satellite, prompting the Space Command to call the behaviour potentially threatening. In 2022, the Chinese Shijian-21 satellite used a robotic arm to tow a defunct Chinese geostationary satellite into a graveyard orbit.\nHowever, we do not know the circumstances in which the U.S. will use its weapons as the government has not published the rules of engagement for orbital weapons.\nIs it legal to have weapons in orbit?\nThe relevant instrument is the Outer Space Treaty, which entered into force in 1967, during the Cold War and the nuclear arms race between the U.S. and the Soviet Union. It prohibits its party states, which include the U.S., Russia, and China today, from placing nuclear weapons or other weapons of mass destruction in orbit or stationing them elsewhere in outer space. It also obviates states from setting up military bases and conducting weapons tests on the moon and other celestial bodies.\nHowever, the treaty does not prohibit states from placing conventional weapons in orbit. The treaty also says all activities in outer space must comply with international law, which means other bodies of international law governing the use of force and armed conflicts can be applied to military operations in orbit. As the U.S. government has not disclosed what its orbital weapons are capable of, it is not possible to say whether it violates specific treaty conditions.\nCan other countries prevent unilateral action?\nThere is no international body to order the U.S. to remove its weapons from orbit. However, there are various diplomatic and legal avenues through which other countries can seek more information and negotiate restraints. For example, Article IX of the treaty requires states to have “due regard” for the interests of other parties, which a (party) state can invoke if it believes U.S. activities in orbit could harm its own peaceful use of space. States can also endeavour to draft new orbital governance rules through the United Nations process on the Prevention of an Arms Race in Outer Space, whose third substantive session is scheduled for November. Countries can also raise the issue before the UN Security Council or the General Assembly as a threat to international peace and security, under Article 35 of the UN Charter.\nPublished - September 20, 2026 02:40 am IST", "translation_ja": "", "vocab": [{"word": "kinetic", "definition": "物理的な運動や衝撃に関連する意味。この文脈では、物体を衝突させることで物理的に損傷を与える能力を指します。"}, {"word": "non-kinetic", "definition": "物理的接触を伴わない方法を指す。電磁干渉やサイバー攻撃など、直接的な衝撃によらない攻撃方法を意味します。"}, {"word": "deterrence", "definition": "抑止力を意味する用語。対方が攻撃を仕掛けないよう、報復能力を示すことで脅威を防ぐ戦略です。"}, {"word": "counter-space", "definition": "宇宙領域における敵対行為に対抗する軍事活動を指します。衛星やスペースシステムを攻撃・破壊する能力を意味します。"}, {"word": "obviate", "definition": "～を不可能にする、または不要にするという意味。この文脈では、条約が特定の行為を禁止することを表しています。"}, {"word": "unilateral", "definition": "一方的な、片側だけによるという意味。国際関係では、他国との協議なしに一国が独自に行動することを指します。"}]}, {"title_ja": "パキスタン系インフルエンサーのテロ組織、インド14州に拡大", "title_en": "Pakistani Influencer's Terror Network Spans 14 Indian States", "summary_ja": "パキスタンを拠点とするソーシャルメディアインフルエンサー、シャハザド・バッティが、インド全土で200人以上の容疑者を勧誘し、監視、恐喝、暴力活動を行ったテロ組織の指導者として指定された。UAEから活動するバッティはパキスタン諜報機関ISIの支援を受けており、ソーシャルメディアを通じて経済的に困窮した若者を勧誘し、プロパガンダ投稿から重要インフラ近くへの監視カメラ設置まで様々な任務を割り当てていた。インド内務省は2026年9月にシャハザド・バッティ・ネットワークをテロ組織として公式に指定した。", "summary_en": "Shahzad Bhatti, a Pakistan-based social media influencer, has been designated as heading a terrorist organization that recruited over 200 suspects across India to conduct surveillance, extortion, and violence. Operating from the UAE with alleged ISI backing, Bhatti targeted vulnerable youth through social media, assigning them tasks ranging from posting propaganda to installing surveillance cameras near critical infrastructure. The Union Home Ministry officially designated the Shahzad Bhatti Network as a terrorist group under India's anti-terror laws in September 2026.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/profile/the-digital-recruiter-shahzad-bhatti/article71485789.ece", "state_media": false, "category": "IT", "full_text": "Over the past two years, the name of a social-media influencer from Pakistan has been surfacing in several terror-related investigations in India.\nWhat started as a bid by the individual identified as Shahzad Bhatti to establish fear and clout in the border State of Punjab soon spread to 14 States, with several young men finding themselves behind bars under the stringent anti-terror law, the Unlawful Activities Prevention Act (UAPA), for acting on his directions. Their assigned tasks included pasting posters glorifying Bhatti and his associates, installing CCTVs near critical installations, which were being live-streamed into Pakistan, or making extortion calls.\nOn September 16, the Union Home Ministry designated the ‘Shahzad Bhatti Network’ (SBN) as a terrorist group under the UAPA. The Ministry said in a notification that through its terrorist activities, the outfit poses a “serious threat to the democratic system, communal harmony, and internal security of the country”. Over 200 suspects, linked to the SBN, were detained or arrested in a countrywide counter-terror operation ahead of Independence Day.\nBhatti, who speaks Punjabi and regularly posts video on Instagram and Facebook with a filter to enhance his looks, currently operates from the UAE. Dressed in traditional pathani suit, his videos, mostly shot while getting off an expensive car or next to a snooker table, always have boastful background music.\nLinks to the ISI\nSecurity officials said he has graduated from “organised crimes” to “terror-related activities” over the past year and was tapped by Pakistan’s Inter-Services Intelligence (ISI), considering his reach among Indians through social media. Several of his Instagram accounts, which always end in ‘333 ’, have been flagged by security agencies. Before the pre-Independence Day pan-India raids and arrests against the SBN, Delhi Police had blocked 125 Instagram accounts related to Bhatti. Since October 2025, the police have registered 15 FIRs and arrested 69 accused, two-thirds from Punjab and Uttar Pradesh. Those arrested were poorly educated, economically vulnerable individuals recruited via social media for money, lured with the promise of relocating to the Gulf, or for resolving personal issues.\nBhatti’s earliest association with criminal activities in India started in Punjab, and it soon spread to Uttar Pradesh, Haryana, Delhi, Rajasthan, Maharashtra, Uttarakhand, Karnataka, Gujarat, Bihar, Telangana, Himachal Pradesh, Jammu and Kashmir and Kerala.\nThe SBN is the 46th outfit to be designated as a “terrorist organisation” under Section 35 (I) of the UAPA, 1967, which empowers the Ministry to designate an outfit as a “terrorist organisation.”\nWithout mentioning the specific cases against the SBN, the Ministry notification listed nine categories of crimes registered under Bharatiya Nyaya Sanhita (BNS), Information Technology Act, 2000, Explosives Substances Act, UAPA, the Official Secrets Act, 1923 (OSA), the Immigration and Foreigners Act, 2025 and the Delhi Prevention of Defacement of Property Act, 2007. The Ministry said the SBN is an organisation whose objective is to involve gullible youth and local criminals to smuggle arms, explosives, and narcotics from across the border.\nA Uttar Pradesh police officer said Bhatti contacted young men who engaged with his social media posts and offered them ₹5,000-₹10,000 to put up posters carrying his images in public places to project him as a gangster and instil fear. He later recruited some of them to throw grenades or plant explosives near critical installations. The payments, often originating from Central Asian countries, were transferred directly to bank accounts.\nAfter assessing a recruit’s willingness to take risks, Bhatti allegedly assigned more serious tasks, including installing Chinese-made CCTV cameras near railway stations, air bases and arterial roads, with footage livestreamed to Pakistan. In one instance, he allegedly sent online manuals to men in Punjab on making petrol bombs and an IED. “In some cases, money was the motivation, while in others, religious sentiments were exploited,” the officer said.\nPublished - September 20, 2026 02:00 am IST", "translation_ja": "", "vocab": [{"word": "designated", "definition": "公式に指定する、任命する。政府や公式機関が特定の地位や分類を与えることを意味し、この記事ではテロ組織として公式に認定された。"}, {"word": "stringent", "definition": "厳格な、厳しい。規則や基準が非常に厳しく、厳密であることを表し、法律や規制が厳しいことを強調している。"}, {"word": "countrywide", "definition": "全国的な、全国規模の。国全体にわたって行われることを意味し、複数の州や地域に及ぶ規模の大きい作戦を指す。"}, {"word": "gullible", "definition": "だまされやすい、単純な。人が簡単に信じ込みやすく、詐欺や操作に引っかかりやすい性質を表す。"}, {"word": "exploited", "definition": "利用する、悪用する。他者の弱点や感情を意図的に利用して自分の目的を達成することを意味する。"}, {"word": "infrastructure", "definition": "インフラストラクチャー、基盤施設。鉄道、空港、道路などの国家の重要な公共施設や設備を指す。"}]}, {"title_ja": "マーク・カーニーとドナルド・トランプの関係が急速に変化している", "title_en": "Mark Carney's Evolving Relationship with Donald Trump"
