ことを表明し、インフラパートナーシップに対してより選別的なアプローチを維持している。", "summary_en": "Brazilian President Lula and Chinese President Xi Jinping signed 37 bilateral agreements during Xi's visit to Brasília, strengthening economic and diplomatic ties between the nations. However, Brazil notably declined to formally join China's Belt and Road Initiative, maintaining a more selective approach to infrastructure partnerships.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMizwFBVV95cUxPOWw3MVRSY3hFbEgyT1A1OFNaNXA4d05OVlV3ZGtPVUx5VDB1N2VMeXB1S0U0Q1BzdlppNTN0ZF9oR0ZqSmhnMlp2ellMVFpyS3ZISnlfNlNQNzg2Z1BnQzBUUUNVdDdUdVRwTzgxbGtFcVg5Yzg4S2pjNDFBUU91YU5jQTR6MkFfVkdWbE04Mno2VTAtT0FWLVNVQmZuNVpzWTI4WWV5eDVQRDM4MENndF9KM0NUbWlINlc0eDVHdXM3Q09HTExRTGZiblZGVk3SAd4BQVVfeXFMTVhOaS00d3dBNFlTZkRiOFVPWURfTWloN2NBWDk1LUNiVXNfRmRjbkFJaXBRc3BXWVBFdVk1OUJoSk95N2pNSWZYYzI3dnhpa093ZkxNWGVEN2ltTkNYc1FKSUZCTl9xYU5yVVVJV2tjS0lVbWxWdEpQWTUwYkJsMXBaT0xBX0pWRVdzaEdQcndtQVFMeXNnRFgwY24xdktQTzNYR1I4S3VRYUtGNzZPNjdxUlNPSUstQUZrcUdPZGhqcHhuN25VcjgyZEd3NVU2MEtkTlhDRTJPd3M2VHFn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "メキシコ最高のハンサムメロン：ハラパの20年伝統", "title_en": "Mexico's Most Handsome Melons: A Two-Decade Tradition in Xalapa", "summary_ja": "メキシコ東部の都市ハラパでは、友人たちの冗談から始まった毎年の恒例行事が、20年以上をかけて活気あふれる文化的伝統へと発展しました。このイベントは創意工夫と不条理さを祝い、農業と芸術の遊び心のある交差点を強調しています。", "summary_en": "In the eastern Mexican city of Xalapa, an annual melon competition has evolved from a lighthearted joke among friends into a vibrant cultural tradition. The event celebrates creativity and absurdity by showcasing remarkably handsome melons, highlighting the playful intersection of agriculture and art.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/19/world/americas/mexico-melon-contest-veracruz.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル大統領、無力化したパレスチナ人殺害の元兵士を恩赦", "title_en": "Israeli President Pardons Ex-Soldier for Killing Incapacitated Palestinian", "summary_ja": "イスラエルのヘルツォグ大統領は、2016年に負傷したパレスチナ人攻撃者を殺害した罪で有罪判決を受けていた元兵士エロル・アザリアを恩赦した。この事件はイスラエルの軍事行動と交戦規則をめぐる国内外での論争を引き起こした。", "summary_en": "Israeli President Isaac Herzog has pardoned Elor Azaria, a former soldier convicted of killing a wounded Palestinian attacker in 2016. The case sparked significant international debate and controversy over Israeli military conduct and rules of engagement.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/19/world/middleeast/israel-pardon-azaria.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウェストバンク入植地をめぐるイギリス・イスラエル関係の悪化", "title_en": "U.K.-Israel Relations Strained Over West Bank Settlement Dispute", "summary_ja": "イギリス当局はイスラエルがE1地区での建設を一時停止することに同意したと主張していますが、このエリアはパレスチナ国家の将来にとって重要な土地とみなされています。しかし、イスラエルはそのような約束をしたことを否定しており、両国間の外交関係に深刻な亀裂が生じています。", "summary_en": "British officials claimed Israel agreed to pause construction in E1, a strategically important West Bank area considered essential for a future Palestinian state. However, Israel disputes making such a commitment, creating a significant diplomatic rift between the two nations.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/19/world/europe/uk-israel-west-bank-sanctions.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルがガザ北部への通行許可、人質交渉の進展後", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Military Restrictions", "summary_ja": "イスラエルは人質解放をめぐる交渉の進展を受け、ガザを二分する軍事地帯の通過をパレスチナ難民に許可した。この措置により、移動制限期間を経て、北部地域への帰還が可能になった。この発展は、領土内の民間人の移動に対する軍事統制の方針転換を示している。", "summary_en": "Israel has allowed displaced Palestinians to cross through a military zone dividing Gaza after negotiations over hostage releases progressed. The move enables residents to return to the northern part of the enclave following a period of restricted movement. This development marks a shift in the military's control over civilian movement within the territory.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "Leading China Property Developer Reports Huge Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国最大級の不動産開発企業であるVankeが巨額の損失を報告し、不動産セクター危機の深刻化を示唆している。同社の経営難は、業界全体での景気低迷の拡大に関する懸念を引き起こしている。中国政府による市場安定化への介入の可能性について、多くの疑問が残されている。", "summary_en": "Vanke, one of China's largest property developers, has reported significant losses, signaling the deepening real-estate sector crisis. The company's troubles raise concerns about whether the property downturn will continue to spread across the industry. Questions remain about potential Chinese government intervention to stabilize the market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による怪我から回復中", "title_en": "Freed Israeli Hostages Recover From Oct. 7 Attack Injuries", "summary_ja": "最近解放されたイスラエル人人質は、10月7日の攻撃時に受けた負傷から回復中であり、一部は体内に砲弾の破片が埋め込まれたままになっている。多くの女性は長期間の隔離状態に置かれ、最大8ヶ月間トンネル内に閉じ込められていた。イスラエルの医療関係者は、身体的および心理的な負傷に対する継続的な治療を提供している。", "summary_en": "Recently released Israeli hostages are still recovering from wounds sustained during the October 7 attack, with some carrying shrapnel embedded in their bodies. Many of the women were held in isolation for extended periods and spent up to eight months confined in tunnels. Israeli medical officials are providing ongoing treatment for their physical and psychological wounds.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、グリーンランド領有要求を撤回も、損害は残存", "title_en": "Trump Drops Greenland Ownership Demands, But Damage Remains", "summary_ja": "ドナルド・トランプ大統領はグリーンランド領有の物議を醸す要求を放棄し、代わりにデンマークとグリーンランドとの改訂防衛協定を締結することになった。しかし専門家は、領有権の脅迫がすでに米国とデンマークの関係に重大な外交的・戦略的被害をもたらしていると警告している。", "summary_en": "Donald Trump has abandoned his controversial demands to acquire Greenland, instead settling for a revised defence pact with Denmark and Greenland. However, experts warn that the annexation threats have already caused significant diplomatic and strategic harm to US-Denmark relations.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/19/donald-trump-drops-demands-to-own-greenland-but-the-harm-has-been-done", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI安全化への合意は不可能かもしれない", "title_en": "Agreeing to make AI safer may be impossible", "summary_ja": "人工知能をより安全にすることは技術的には可能だが、米国のテック企業と政府当局の間、そして米国と中国の間で大きな意見の相違が存在している。これらの対立は規制アプローチと安全基準を中心としている。合意の欠如は、グローバルなAI安全合意の確立を脅かしている。", "summary_en": "While making artificial intelligence safer is technically feasible, significant disagreements persist between American tech labs and government authorities, as well as between the United States and China. These conflicts center on regulatory approaches and safety standards. The lack of consensus threatens efforts to establish global AI safety agreements.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/15/agreeing-to-make-ai-safer-may-be-impossible", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国は米国後の世界に備える準備ができていない", "title_en": "China is not ready for a post-American world", "summary_ja": "ドナルド・トランプのイラン外交危機は、中国が完全に活用するには時期尚早な地政学的な好機を生み出しました。この記事は、中国がアメリカのグローバルリーダーシップからの撤退を効果的に利用するための経済的、軍事的、外交的インフラが不足している理由を検証しています。北京は米国後の国際秩序で効果的にリードする前に、その地位を強化し続ける必要があります。", "summary_en": "Donald Trump's foreign policy crisis in Iran has created a geopolitical opening that arrives prematurely for China to fully exploit. The article examines why China lacks the economic, military, and diplomatic infrastructure to capitalize on American withdrawal from global leadership. Beijing must continue strengthening its position before it can effectively lead in a post-American international order.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/15/china-is-not-ready-for-a-post-american-world", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フェイスブックの極右AI生成投稿で稼ぐビジネス", "title_en": "Reactionary AI-Generated Posts on Facebook Fuel Far-Right Misinformation for Profit", "summary_ja": "スリランカ、ベトナム、ベネズエラを拠点とするページが、人工知能で生成した政治コンテンツをフランスの視聴者に向けて配信しており、極右を支持する内容が多く含まれている。これらの操作は主に広告収入による経済的利益を目的としている。この現象は、AI生成のミスインフォメーションがいかに国境を越えた規模で悪用されるかを明らかにしている。", "summary_en": "Pages based in Sri Lanka, Vietnam, and Venezuela are using artificial intelligence to generate political content targeting French audiences, often promoting far-right viewpoints. These operations are primarily motivated by financial gain through engagement and advertising revenue. The phenomenon reveals how AI-generated misinformation can be weaponized at scale across borders.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/pixels/article/2026/09/19/the-lucrative-business-of-reactionary-ai-generated-posts-on-facebook_6757721_13.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "キューバ、2024年末以来12回目の全国停電後に電力復旧作業を実施", "title_en": "Cuba Restores Power After 12th Nationwide Blackout Since Late 2024", "summary_ja": "キューバが2024年末以来12回目となる全国規模の停電を経験し、電力復旧作業を進めている。米国による燃料禁輸措置により、同国のエネルギーインフラが深刻な負担を強いられていることが相次ぐ停電の原因である。電力網の連鎖的な障害に対処するため、当局は困難に直面している。", "summary_en": "Cuba experienced its 12th nationwide power outage since late 2024 as the island nation works to restore electricity. The recurring blackouts are attributed to a US fuel blockade that has severely strained the country's energy infrastructure. Officials are struggling to address the cascading failures in the power grid.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/19/cuba-works-to-restore-power-after-another-blackout_6757722_4.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランスの公的債務、2027年までにGDP比120%を超える見通し", "title_en": "French public debt set to exceed 120% of GDP by 2027", "summary_ja": "フランス政府は新たな増税措置を含む予算案を提出した。この増税はプライマリー赤字削減の主要な要因となる予定だが、公的債務は継続して増加し、2027年までにGDP比120%を超える新たな記録に達すると見込まれている。", "summary_en": "France's government has submitted a draft budget bill featuring new tax increases aimed at reducing the budget deficit. Despite these measures, public debt is projected to reach a new record level, surpassing 120% of GDP by 2027.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/09/19/french-public-debt-to-reach-new-record-level-in-2027-exceeding-120-of-gdp_6757714_5.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省（Mindef）の最新情報", "title_en": "Mindef Updates", "summary_ja": "シンガポール国防省（Mindef）がニュースレターを配信しました。購読者はストレーツ・タイムズの購読管理ページから配信設定を変更できます。", "summary_en": "The Ministry of Defence (Mindef) has released a newsletter update. Subscribers can manage their newsletter preferences through The Straits Times subscription portal.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "夜間ニュース更新", "title_en": "Evening Update", "summary_ja": "ストレーツタイムズの夜間ニュース更新は毎日のニュースと情報を提供します。本号は現在の出来事と動向をカバーしています。ストレーツタイムズから定期的な更新を受け取るために購読してください。", "summary_en": "The Straits Times Evening Update provides daily news and insights. This edition covers current events and developments. Subscribe to receive regular updates from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズが購読者向けの日刊朝刊ブリーフィングを配信します。本ニュースレターは、その日の主要ニュースと情報を提供します。購読者は提供されたリンクから購読設定を管理できます。", "summary_en": "The Straits Times delivers its daily morning briefing to subscribers. This newsletter provides key news updates and information for the day ahead. Readers can manage their subscription preferences through the provided link.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル大統領、パレスチナ人襲撃者の殺害で有罪判決を受けたIDF兵士を恩赦", "title_en": "Israeli President Pardons IDF Soldier Convicted in Palestinian Death", "summary_ja": "イスラエルのアイザック・ヘルツォグ大統領が、負傷したパレスチナ人襲撃者を殺害した罪で有罪判決を受けたIDF兵士に恩赦を与えた。この恩赦は軍事行動と武力の使用に関する重要な決定を示すものである。同事件は、交戦規則とイスラエル軍の説明責任に関する問題への関心を集めていた。", "summary_en": "Israeli President Isaac Herzog has pardoned an IDF soldier who was convicted of killing a wounded Palestinian assailant. The pardon marks a significant decision regarding military conduct and use of force during security operations. The case had drawn attention to questions about rules of engagement and accountability in the Israeli military.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiowJBVV95cUxOR2dycVJrWW1ZV0RaeU9ORG55QzlVQVVxOW9lRUl0SnlqcFNILUFWc280aUZwTTNOcEJiaWdUX2UtMzZENFplYUt4TFdDRklNa25mMkVVSnJCOExfN21vcXZwaGphREhUT0c3cnMyWlh1M25nVDA2a0tDYmdOcUpHMDd0S205a1hZMDhmZ1YtY2k0UWd4eVYzVm5Qc1FzcUt1bER0dDhkSEJ2Uzl2LXRhNEV0WmhYMER0QUhKZDZDcGpzdTdMTjRjR08tZDJoR3htTkFBdVBzLVhhTk9RdUxJSzdZM3RsLVBWUUVOWG01elFWSl9EYTU1N3UwUFpRSzV5T1k3U19BWk9TTlpXQlFmTW5WamNhZDVwSWVhcEZNQVdhNkE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの攻撃前、イランは既に核兵器を保有していたのか？", "title_en": "Did Iran Already Have Nuclear Weapons Before Israeli Attack?", "summary_ja": "ハアレツは、最近のイスラエル軍事作戦の文脈におけるイランの核兵器能力に関する主張を検証している。この事実確認は、攻撃前にイランが核爆弾を保有していたかどうかを調査し、そのような主張の信頼性を評価している。", "summary_en": "Haaretz examines claims about Iran's nuclear weapons capabilities in the context of recent Israeli military operations. The reality check investigates whether Iran possessed nuclear bombs prior to the attacks and evaluates the credibility of such assertions.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxQZWI0dnNPU1NfcTBGSGxqZGVva0VlMEZjdXE2bDNEeUx1SzJvN3NUREhPV1RMd2tOOXJYajQzbGlpbTR6UmJXN1Q1UjgyR2x4cDBMeHYtblJDT2o3NTV5SmVkS01qZlgtRzdrRWh2c01tdXBiY3VyRWtsa1dDWUthVGk4a0NzQ2dyUFhXVHFkVXFwRHlFWWVrRHk0cUJpQ2FHaW92Wms4aHR2em1uRFlOOEtlUVJFVml0dHQwYVdjRlNuSlV2TWE1LWxJRXRuWHZ3enBxc3RiTnFXQ0ZPaXhPdmF1Q0YtVHhyOGNlMndfXzdiWTZocXE1dHV1MTAtbEp6OVdSSXVOQ1Y4N00?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハアレツ紙、サラ・ネタニヤフ前首相夫人の10月7日反逆罪陰謀説を否定", "title_en": "Haaretz Debunks Sara Netanyahu's October 7 Treason Conspiracy Claims", "summary_ja": "ハアレツ紙の「ファクトチェック」欄は、10月7日に関連してサラ・ネタニヤフが主張した陰謀論を検証し反論している。同記事は、イスラエルの元ファーストレディによる攻撃に関連する反逆罪疑惑についての誤情報請求に対処している。", "summary_en": "Haaretz's Reality Check column examines and refutes conspiracy theories promoted by Sara Netanyahu regarding October 7. The fact-checking article addresses misinformation claims made by Israel's former First Lady about alleged treason connected to the attack.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilwJBVV95cUxOTjBrNUVSMjJjT1AzdHhVZ25wa3Z6LUNKVWlsaW5uQ1loUjNSWFBRUUZNb0JyZ294R1NuZzhxRVU3TUhROU1ZRHpid1UzbFE3TkJDLXhIcnFJcFY3X2E4QnV2Ui16U2tFUXJkSUtfVERPRVNFQTdEcUQzTmZ6eUY3azRhSTlGem4zVkt2WklqN201d1FiVkJkdGwxRUlIdThyMFk4bnQ2aEFSY256QzIxOXNnN3I2UGhJbDY1eFg3WTRYTlVsbExRMG5lNk9WT1ZDUko2VFkwT1NrSnFTdmxveDk3clFET1VZZm9ZSUxIX0JCWWF3RVdvX2RqTTFoeFVNRkJ2Nl8wSVg2cE50dDFBbXBQdno4WDA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タイ人女友人が冷凍庫で遺体で発見、台湾人男性が拘束", "title_en": "Taiwanese Man Detained After Thai Girlfriend Found Dead in Freezer", "summary_ja": "台湾人男性が冷凍庫で発見されたタイ人女友人の遺体に関連して当局に拘束されました。警察は彼女の死亡の状況について調査を進めています。この事件はタイと台湾の両当局から大きな注目を集めています。", "summary_en": "A Taiwanese man has been held by authorities following the discovery of his Thai girlfriend's body in a freezer. Police are investigating the circumstances surrounding her death. The case has drawn significant attention from both Thai and Taiwanese authorities.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBuckJ3eTBHd09EX2dBbDZ1a1RIV19UTWlhVWlOdnZIQ3lLMkw3cHp4Y21NbnBKeHh0OWl2enp3aXRRNXdCcEhyM1BMeGQwYjl5YnhRWUpB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "iPhone 18 Proモデルが早期購入者に急速に売れ始める", "title_en": "Early Buyers Snap Up iPhone 18 Pro Models", "summary_ja": "アップルの最新iPhone 18 Proモデルが消費者からの強い初期需要を経験しています。フラッグシップデバイスは新しいプレミアムスマートフォンを購入しようとする買い手の殺到により急速に売り切れになっています。", "summary_en": "Apple's latest iPhone 18 Pro models are experiencing strong early demand from consumers. The flagship devices are quickly selling out as buyers rush to purchase the new premium smartphones.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5mTGpBcGRmRnQyRkN1QjgxUUhRV3E0a3dyV05zMDJJdS16ZWowMlVsVDFXSXdfRzZFRFdzWVhlTVNTdkdjNUNFWjAxTEJZMjZpSVJBMmR2Zw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "陸委会、入境許可批判後に台北・上海フォーラムを軽視", "title_en": "MAC Downplays Taipei-Shanghai Forum Amid Entry Permit Controversy", "summary_ja": "台湾の大陸委員会（MAC）は入境許可問題への批判を受けて、台北・上海フォーラムの重要性を軽視している。海峡を挟む文化交流プログラムの運営をめぐる監視の中で、当局は批判に直面している。", "summary_en": "Taiwan's Mainland Affairs Council (MAC) has played down the significance of the Taipei-Shanghai forum following criticism over entry permit issues. The move comes as officials face scrutiny regarding the administration of cross-strait cultural exchange programs.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE8yTFFDNmg3MFBCX1J0bGhOU1ZBTGlkWEVuZWdwUW5VbDF5SGhrQ0c5cmVoNDVoc0llamQ4NHNUVldmTy1nRU44YWVBbWVnZnZUaWdHVkhOdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "専門家：中医学の全体的哲学がグローバルヘルスケアに洞察をもたらす", "title_en": "Expert: TCM's Holistic Philosophy Offers Insights for Global Health", "summary_ja": "CGTNが報じたところによると、中国科学院のアカデミシャンである董暁林氏は、中医学の全体的かつ予防的なアプローチがグローバルなヘルスケアシステムに貴重な洞察をもたらすと主張している。専門家は、中医学の哲学が国際的な健康慣行に情報を提供する可能性があると示唆している。", "summary_en": "CGTN reports that Tong Xiaolin, an academician at the Chinese Academy of Sciences, argues that traditional Chinese medicine's holistic and preventive approach provides valuable insights for global healthcare systems. The expert suggests that TCM's philosophy could inform international health practices.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-18/Expert-TCM-s-holistic-philosophy-offers-insights-for-global-health-1QxQmBP2JhK/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "韓国大統領ホルムズ海峡への兵力展開を否定", "title_en": "South Korean President Rules Out Troop Deployment in Strait of Hormuz", "summary_ja": "CGTNが報じたところによると、韓国のイ・ジェミョン大統領はホルムズ海峡での戦闘に関与するための兵力展開を明確に否定した。この声明は戦略的な水路への潜在的な軍事関与に対する韓国の立場を反映している。この発表は中東地域の緊張が高まる中での発言となっている。", "summary_en": "CGTN reports that South Korean President Lee Jae Myung has firmly ruled out any troop deployment to engage in war in the Strait of Hormuz. The statement reflects South Korea's position on potential military involvement in the strategic waterway. This announcement comes amid regional tensions in the Middle East.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-18/South-Korean-president-rules-out-troop-deployment-in-Strait-of-Hormuz-1QxfdTou92M/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "EU、極端な夏の後に気候保険同盟を立ち上げへ", "title_en": "EU to Launch Climate Insurance Alliance Following Extreme Summer", "summary_ja": "CGTNによると、欧州連合は今夏の極端な気象現象に対応するため、気候保険同盟の設立を計画している。この取り組みは、EU加盟国とその市民を気候関連の経済的リスクからより良く保護することを目的としている。この同盟はヨーロッパ全体の保険メカニズムを調整し、増大する気候災害の影響に対処することが期待されている。", "summary_en": "CGTN reports that the European Union plans to establish a climate insurance alliance in response to this summer's extreme weather events. The initiative aims to better protect EU member states and their citizens against climate-related financial risks. The alliance is expected to coordinate insurance mechanisms across Europe to address growing climate disaster impacts.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-17/EU-to-launch-climate-insurance-alliance-after-extreme-summer-1QvkTVHghK8/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア、オンライン投票システムへの攻撃にAIとダークネットが関与と報告", "title_en": "Russia Reports AI and Darknet Involvement in Online Voting System Attacks", "summary_ja": "TASSは、ロシア当局がオンライン投票システムへの攻撃に人工知能とダークネット資源が関与していると主張していると報道している。オレグ・アルタモノフ氏によると、これらの攻撃の試みにもかかわらず、投票開始後2日間は混乱は検出されなかったとのこと。", "summary_en": "TASS reports that Russian officials claim attacks on the country's online voting system involved artificial intelligence and darknet resources. According to official Oleg Artamonov, no disruptions were detected during the first two days of voting despite these alleged attack attempts.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2190155", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア議会選挙の投票率が44.5%を超える、選挙当局が報告", "title_en": "Russian parliamentary election turnout exceeds 44.5%, election authority reports", "summary_ja": "ロシア中央選挙委員会は、グリニッジ標準時午後9時時点での議会選挙の投票率が44.5%を上回ったと報告している。当局の公式ウェブサイトに掲載されたデータによると、国営の選挙当局が投票参加率の追跡データを発表した。", "summary_en": "Russia's Central Election Commission reports that parliamentary election turnout has surpassed 44.5% as of 9:00 p.m. GMT, according to data posted on the commission's official website. The state-controlled election authority released the figure to track voter participation in the ongoing elections.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2190153", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "サウジアラビア、リヤドへのフーシ派ミサイル攻撃を撃退と発表", "title_en": "Saudi Arabia Says It Repelled Houthi Missile Attack on Riyadh", "summary_ja": "サウジアラビアの連合軍当局者は、フーシ派勢力が首都リヤドに対してミサイル攻撃を仕掛けたが、これを迎撃したと発表している。ターキ・アル・マリキ准将は、フーシ派が市内の民間人目標への攻撃試行を増加させていると述べた。", "summary_en": "Saudi coalition officials report that Houthi forces launched a missile attack on the capital Riyadh, which they say was intercepted. Brigadier General Turki al-Maliki stated that the Houthis have escalated attempts to target civilian areas in the city.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2190145", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカのAI機会", "title_en": "Africa's AI Opportunity", "summary_ja": "著者は、AI革命からのアフリカの最大の経済的機会は、最先端モデル開発ではなく、若く成長するアフリカ経済全体への実用的なAI応用にあると主張しています。アフリカは歴史的にイノベーション・チェーンの末端に位置し、他の場所で開発された高価なテクノロジーを輸入してきた傾向があり、COVID-19ワクチン不足時にこのパターンが顕著に現れました。", "summary_en": "The author argues that Africa's greatest economic opportunity from the AI revolution lies not in developing frontier models, but in deploying practical AI applications across its young and growing economies. Africa has historically been positioned at the end of the innovation chain, importing expensive technology developed elsewhere, a pattern starkly illustrated during COVID-19 vaccine shortages.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/africa-should-build-an-ai-ecosystem-focused-on-solving-practical-problems-by-yemi-osinbajo-and-alexander-tsado-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Africa’s AI Opportunity\nand\nThe global AI revolution is often portrayed as a Sino-American race to develop the most advanced frontier models. But the greatest economic prize most likely will be found in deploying practical intelligence, particularly in Africa’s young, dynamic, and fast-growing economies.\nABUJA/LAGOS—Africa has long found itself at the wrong end of the innovation chain. Breakthroughs were made and commercialized elsewhere, then imported by African countries at prices and on terms over which they had little influence. The costs of this approach were starkly apparent during the COVID-19 pandemic, when Africa struggled to gain access to vaccines developed and manufactured elsewhere.", "translation_ja": "", "vocab": [{"word": "frontier models", "definition": "最先端の技術モデル。技術革新の最前線で開発される高度なAIシステムを指します。"}, {"word": "commercialized", "definition": "商業化された、市場で販売可能な状態にされた。研究成果を実際のビジネスや製品に転換することを意味します。"}, {"word": "innovation chain", "definition": "イノベーション・チェーン。新しい技術やアイデアが開発から展開まで進む過程全体を指します。"}, {"word": "deploying", "definition": "展開する、実際に運用に置く。開発された技術やシステムを実際の場面で活用することです。"}, {"word": "starkly apparent", "definition": "明白に、顕著に明らかな状態。問題や事実がはっきりと見えることを強調する表現です。"}]}, {"title_ja": "ドイツの中国ショックがもたらす政治的激震", "title_en": "The Political Earthquake From Germany's China Shock", "summary_ja": "ドイツの戦後の政治的安定は、高付加価値製造と広範な繁栄というバーゲンに基づいていたが、中国との競争によって揺らいでいる。2026年9月のザクセン・アンハルト州選挙で極右政党AfDが43.8%に急伸し、与党キリスト教民主同盟が37.1%から17.2%へ急落したことは、ドイツの政治的合意の亀裂を示唆している。", "summary_en": "Germany's postwar political stability, built on a bargain of high-value manufacturing and broad-based prosperity, is being destabilized by Chinese competition. The far-right AfD's surge to 43.8% in Saxony-Anhalt's September 2026 election represents a dramatic shift, with the ruling Christian Democrats collapsing from 37.1% to 17.2%, signaling potential fractures in Germany's political consensus.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-shock-contributed-to-the-afd-s-rise-in-germany-by-dalia-marin-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Political Earthquake From Germany’s China Shock\nFor decades, Germany’s stability rested on an implicit bargain: high-value manufacturing would provide good jobs, strong export revenues, and broad-based prosperity, which political institutions would translate into social cohesion. Competition from China shakes that bargain to its foundations.\nMUNICH—September 6, 2026, could mark a turning point in Germany’s postwar political history. In the Saxony-Anhalt state election, the far-right Alternative für Deutschland (AfD) came within three seats of an absolute majority, winning 43.8% of the vote—more than twice its share in the 2021 election. The AfD’s gains came at the expense of the center-right Christian Democratic Union, the state’s incumbent governing party and the party of Chancellor Friedrich Merz, which won just 17.2%, down from 37.1% in 2021.", "translation_ja": "", "vocab": [{"word": "implicit bargain", "definition": "明示されない取り決めや合意を意味する。この文脈では、経済繁栄と政治的安定が相互に結びついているという暗黙の了解を指す。"}, {"word": "far-right", "definition": "政治スペクトラムの最も右翼的な立場を表す。移民制限や民族主義的政策を掲げる政治勢力を指す。"}, {"word": "postwar", "definition": "戦争後の時期を指す。通常は第二次世界大戦後の時代に言及する際に使用される。"}, {"word": "incumbent", "definition": "現在その地位にある人物や政党を意味する。選挙で現職の候補者や与党を指すことが多い。"}, {"word": "cohesion", "definition": "社会や集団が一体となっている状態、結束力を指す。政治や社会の統一性が保たれていることを意味する。"}, {"word": "turning point", "definition": "物事の方向や流れが大きく変わる重要な時点を指す。歴史的な転機や分岐点を示す表現。"}]}, {"title_ja": "極右勢力の台頭を止める", "title_en": "Stopping the Far Right's Rise", "summary_ja": "著者は、ヨーロッパと南米での極右勢力の最近の選挙での成功は、左派が主張する経済的不安定さだけでは説明できないと主張している。極右指導者たちは矛盾する経済政策を掲げても成功しており、彼らの政治的台頭には他の要因があることを示唆している。極右勢力の影響力増加に対抗するには、より深い理解が必要であると述べている。", "summary_en": "The author argues that the far right's recent electoral gains across Europe and the Americas cannot be explained solely by economic precarity, as leftists claim. Far-right leaders succeed despite advocating diverse and sometimes contradictory economic policies, suggesting other factors drive their political ascendancy. The piece suggests a more nuanced understanding is needed to counter the far right's growing influence.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/stopping-far-right-rise-requires-crime-immigration-policies-by-andres-velasco-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Stopping the Far Right’s Rise\nLeftists insist that what is behind the far right’s recent gains, from Europe to Central and South America, is economic precarity. Far-right leaders know better, winning elections or gaining support despite embracing very different economic policies.\nSANTIAGO—At an academic event in Brussels a few months ago, one of the speakers casually suggested that the next time the group met, the far right could be in power in France, Germany, and the United Kingdom. No one refuted him.", "translation_ja": "", "vocab": [{"word": "precarity", "definition": "経済的または社会的な不安定性や不確実性の状態。仕事や生活が不安定であることを指す。"}, {"word": "casually", "definition": "何気なく、軽い口調で述べること。特に重要視されない方法で言及すること。"}, {"word": "refuted", "definition": "議論や主張に対して反対の証拠を示して反論すること。否定する。"}, {"word": "electoral", "definition": "選挙に関連する、または選挙によって決定される事柄。投票と政治選挙に関する。"}, {"word": "ascendancy", "definition": "優位性や支配的な立場。権力や影響力が上昇すること。"}]}, {"title_ja": "トランプ陣営の出産推奨政策は偽善的：ICE拘束妊婦への冷遇が明かす本当の狙い", "title_en": "Trump's Pronatalism Rings Hollow When Pregnant Immigrants Face Neglect", "summary_ja": "著者は、トランプ政権が人口増加を公然と掲げながら、ICE拘束中の妊娠女性への出生前ケア不足と流産記録の欠如から、その政策が特定の出産のみを望む支配志向であることを指摘しています。生殖データの監視と流産の犯罪化と対比させることで、政権の「生命尊重」主張の偽善性を暴露しています。", "summary_en": "The author argues that while the Trump administration publicly champions population growth, their treatment of pregnant women detained by ICE—including lack of prenatal care and unrecorded miscarriages—reveals their pronatalism is selective and about control, not genuine care for all babies. The piece contrasts this with the administration's aggressive surveillance of reproductive data and criminalization of miscarriages, exposing the hypocrisy of claiming to be pro-life.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/19/maga-pro-life-miscarriages-pregnancy-ice-detention", "state_media": false, "category": "オピニオン", "full_text": "Maga men have babies on the brain. They may not all be interested in changing diapers or hands-on parenting, but they’re very keen on population growth. “[W]e want more babies, to put it very nicely,” Donald Trump said last year.\nTrump, who has called himself the “father of IVF” and joked that he will be known as the “fertilization president”, surrounds himself with people who profess a similar fondness for children. Only a few days after being sworn in as vice-president, JD Vance declared he wanted “more babies in the United States of America” and went on to make pronatalist policies a theme of his time in office.\nMeanwhile, the administration’s favourite moneyman, Elon Musk, is doing his own part to increase the population. Ashley St Clair, the mother of one of his many offspring, has claimed he once told her he wanted to have “a legion of children before the civil war”. At least one of Musk’s kids has denounced him, so I’m not sure he’s considered that they might not all be fighting on the same side.\nWhile the Trump administration may want a baby boom, it won’t shock you to hear that, when you take a closer look at their particular brand of pronatalism, they don’t actually seem to want “more babies”. What they really want, judging by the way in which pregnant immigrants are being treated, is more of the “right” type of baby.\nA Guardian investigation published this week revealed that ICE is arresting a record number of pregnant women and teenagers. These detained women are reportedly not receiving the prenatal healthcare they need and, alarmingly, ICE does not seem to have records of how many of these women have suffered miscarriages.\n“ICE recorded 18 miscarriages during the first nine months of the Trump administration,” the Guardian writes. “[B]ut the agency has no data on miscarriages after 3 October 2025.” Let me just reiterate that: we have no idea how many women in ICE detention have lost their babies over the past 11 months.\nIt’s very strange that ICE seems to have just stopped tracking miscarriage numbers; the agency, and the Trump administration, is normally very big on surveillance. Last year, the Guardian reported that pregnant immigrant women were turning up to hospitals to deliver their babies wearing location-tracking smartwatches as part of an ICE monitoring program. One of these women was diagnosed with pre-eclampsia, which can cause major swelling, and hospital staff were worried that the smartwatch would cut off her circulation. “She was in tears about [the idea of taking the surveillance device off],” a hospital staffer told the Guardian. “She had this deep fear that ICE was going to come to the hospital and take her baby.”\nSurveillance also extends to the broader pregnant population. When Dr Erica Schwartz was confirmed by the US Senate as director of the Centers for Disease Control and Prevention (CDC) earlier this year, she emphasized: “Abortion surveillance is absolutely a critical component of what the CDC is currently doing.” While the CDC doesn’t require states to collect data on abortions, 44 states plus Washington DC have some sort of mandated abortion reporting, according to the Guttmacher Institute. This isn’t necessarily sinister but, following the overturning of Roe v Wade, there has been growing concern that this data might be weaponized to punish abortion patients and providers, who are increasingly being treated like criminals.\nAnd that concern is hardly unfounded. In the first two years after Roe was overturned, prosecutors in 16 states charged more than 400 people with pregnancy-related crimes, a 2025 report by the group Pregnancy Justice found. The report also noted that there are likely far more cases of miscarriage criminalization than have made headlines.\nFunny, isn’t it? If you suffer a miscarriage in ICE detention, possibly because of systemic medical neglect, the US government will apparently shrug and look the other way. But if you have a miscarriage in a state that has fetal personhood language in its abortion laws, you may find yourself facing a police investigation and criminal charges. Once again, there is nothing pro-life about this administration. They are solely pro-control.\nFBI warned ICE agents could be targeted by fake ‘tradwife’ dating profiles\n“These profiles were incorporating imagery of a ‘traditional wife’ aesthetic and listing specific interests in an attempt to appeal to … individuals in law enforcement,” an internal FBI memo warns. “The objective was to lure affiliated law enforcement personnel into an online or in-person interaction under the guise of a date, after which the individuals would be publicly exposed and doxed online.” Oh dear, my heart bleeds for these poor ICE agents.\nTurkey is targeting LGBTQ+ activists and journalists\nStarting last Sunday, Turkish police raided the offices of LGBTQ+ rights organizations and HIV-advocacy groups. Then they arrested people protesting against the raids and journalists covering the protests. “This ", "translation_ja": "", "vocab": [{"word": "pronatalism", "definition": "人口増加を奨励・促進する政策思想。政府が国民の出産を推し進めようとする姿勢や政策体系を指します。"}, {"word": "prenatal", "definition": "妊娠中の、出産前の。医療や健康管理の文脈で、妊娠から出産までの時期に関連することを表します。"}, {"word": "fetal personhood", "definition": "胎児を法的に人間として認める概念。胎児に人権や法的保護を与える法律や政策を指します。"}, {"word": "weaponized", "definition": "本来の目的ではなく、攻撃や支配の道具として使用すること。この文脈では医療データが罰する手段として使われることを意味します。"}, {"word": "criminalization", "definition": "犯罪行為として法的に指定すること。以前は犯罪ではなかった行為を法律で犯罪とする過程を表します。"}]}, {"title_ja": "父からの願い：大学スポーツにおける予防可能な熱中症死亡の防止", "title_en": "A Father's Plea: Preventing Preventable Heat-Related Deaths in College Sports", "summary_ja": "2018年のメリーランド大学フットボール練習中に熱中症で息子ジョーダンを亡くした父親が、この予防可能な悲劇を振り返り、アリゾナ州立大学でのマシュー・マイチの崩壊など最近のケースとの類似性を指摘しています。著者は、緊急時対応計画が紙の上では存在するが、選手の命を救うには適切な訓練、実行、および20～30分の重要な冷却期間の認識が不可欠であると主張しています。著者は、苦痛の認識不足、練習されていないプロトコル、および装置の欠落など、複数のシステム的失敗が危険な脆弱性を生み出していることを強調しています。", "summary_en": "A father whose son Jordan McNair died from exertional heatstroke during a University of Maryland football practice in 2018 reflects on the preventable tragedy and draws parallels to recent cases like Matthew Mayich's collapse at Arizona State. He argues that while emergency action plans exist on paper, proper training, execution, and awareness of the critical 20-30 minute cooling window are essential to save athletes' lives. The author emphasizes that multiple systemic failures—inadequate recognition of distress, lack of practiced protocols, and missing equipment—create dangerous vulnerabilities that must be addressed.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/sport/2026/sep/18/college-sports-heatstroke-jordan-mcnair-matthew-mayich", "state_media": false, "category": "オピニオン", "full_text": "Late last month, Arizona State hockey player Matthew Mayich collapsed during a team workout. He is now fighting for his life after suffering from exertional heatstroke and, according to the Mayich family attorney, is unlikely to make a meaningful recovery. This young man was drafted by the St Louis Blues but will never get the opportunity to play in the NHL. While he is not the first young athlete severely harmed by heat-related illness in American sports, he should be the last.\nI have learned more about this preventable injury than I ever wanted to know. On 29 May 2018, my son Jordan McNair collapsed during a strenuous football practice at the University of Maryland. By the time he arrived at the hospital, he was dangerously overheated and never recovered.\nFor two weeks, as Jordan fought for his life through intensive care and an emergency liver transplant, one question kept coming: “What did we miss?”\nI think about the days before he signed with Maryland, when coaches sat at our kitchen table talking with our family about Jordan. I remember asking two questions:\n“Can Jordan get some playing time?”\nAnd, “What support do you have around mental health and substance abuse?”\nThose are the kind of questions many parents ask when they have never experienced a life-changing tragedy in collegiate sports. Jordan was going to play football at a Big Ten university. What could possibly go wrong?\nI didn’t ask:\n“If something happens to my son, what safety systems do you have in place?”\n“What is your emergency action plan?”\n“When was the last time you practiced it?”\n“Who has the authority to stop a workout when an athlete is in medical distress?”\n“What happens if my child suffers exertional heatstroke?”\n“Where is the equipment needed to save his life?”\nThose questions came in hindsight, as I walked toward the ICU every day while Jordan fought for his life. I kept asking myself:\n“What did I miss that night at the kitchen table?”\nBefore Jordan collapsed, I thought heatstroke and heat exhaustion were one and the same. I thought if someone became overheated, you moved them into the shade, gave them water, let them cool down, and everything would be fine. I didn’t know a heat-related injury could kill my son. My education came through a baptism by fire.\nSuddenly, as the Mayich family may be learning now, I had to understand medical terms I had never heard before: rhabdomyolysis. Core body temperature. Multiorgan failure. Exertional heatstroke.\nSince Jordan’s death, I’ve worked alongside medical professionals to cool athletes experiencing exertional heat illness at sporting events across the nation. I’ve seen first-hand how quickly proper recognition and response can change an outcome.\nOne of the simplest explanations of exertional heatstroke has stayed with me. When your core body temperature rises above 104F (40C), it is like putting your body inside a microwave. Your organs begin to cook.\nThere is a critical window of roughly 20 to 30 minutes to rapidly cool the athlete and avert catastrophe. Cold-water immersion can bring the body’s temperature down before the damage becomes irreversible.\nTime is everything.\nBut what happened to Jordan wasn’t only about what went wrong on the football field on 29 May 2018. What happened to Mayich in Arizona isn’t only about what happened on 20 August 2026. The tragedy began long before.\nEvery organization has layers of protection, and every layer can have weaknesses, the holes in the Swiss Cheese Model. One hole may not cause disaster because another layer can stop it. But when enough holes align, nothing remains between the athlete and tragedy.\nThere was an emergency action plan in Jordan’s case. But having an emergency action plan on paper and being prepared to execute it are two very different things. Imagine having a fire evacuation plan nobody ever practices. Then one day the building catches fire. Who knows where to go, what to do, who calls 911 and who gets people out? The middle of the fire is the worst possible time to figure out the plan. Athletic emergencies are no different.\nEvery time an athlete steps on to a field, court, track or practice facility, an emergency is possible. The systems designed to protect that athlete must be in place before it happens, and the people responsible for those systems must know exactly what to do.\nI used to say Murphy’s law was in full effect the day Jordan collapsed. While I wasn’t in Arizona for the team practice where Matthew Mayich collapsed, reports from that day reveal unsettling parallels to my son’s case.\nDuring a strenuous early-season workout, the athlete’s level of distress wasn’t properly recognized. The escalation from heat exhaustion to exertional heatstroke wasn’t appropriately addressed. The emergency action plan was not properly practiced or implemented. The lifesaving cooling response wasn’t initiated within that critical window. Necessary equipment wasn’t within immediate reach. Changes in the normal practice setting complicat", "translation_ja": "", "vocab": [{"word": "exertional heatstroke", "definition": "運動中に体温が危険なレベル（104°F/40°C以上）に上昇する症状で、内臓がダメージを受け、20～30分以内の急速な冷却が必要な医学的緊急事態。"}, {"word": "rhabdomyolysis", "definition": "筋肉組織の急速な分解により、筋肉タンパク質が血液に流出する症状で、重篤な熱中症の合併症として発生する可能性がある。"}, {"word": "multiorgan failure", "definition": "複数の臓器（心臓、肝臓、腎臓など）が同時に機能を失う症状で、治療がなければ生命を脅かす危機的な状態。"}, {"word": "cold-water immersion", "definition": "体温を急速に低下させるため、熱中症患者を冷水に浸す医学的治療法で、最初の20～30分以内に実施することが重要。"}, {"word": "Swiss Cheese Model", "definition": "安全システムの複数の層が各々の穴（弱点）を持つが、これらが一列に並ぶと防御が完全に失敗する可能性があることを説明するリスク管理モデル。"}, {"word": "escalation", "definition": "熱疲労から熱中風へなど、医学的状態が深刻化すること、または問題が悪化していくプロセス。"}]}, {"title_ja": "民主党は権威主義ではなく腐敗に焦点を当てて労働者階級の票を獲得すべき", "title_en": "Democrats Should Focus on Corruption, Not Authoritarianism, to Win Working-Class Voters", "summary_ja": "AbottとWilliamsの調査によると、労働者階級のアメリカ人は権威主義への抵抗を19位の優先事項として評価しており、大学教育を受けた民主党員の第2位よりはるかに低い。著者らは、民主党が代わりに腐敗との闘いを強調すべきだと主張しており、これは労働者階級の中で3位から6位にランクされており、民主主義を真に守るために反腐敗メッセージと中産階級の安定を回復する経済政策を組み合わせるべきとしている。", "summary_en": "According to a survey by Abbott and Williams, working-class Americans rank resisting authoritarianism as their 19th priority, far below college-educated Democrats' second-highest priority. The authors argue Democrats should emphasize fighting corruption instead, which ranks third-to-sixth among working-class voters, and pair anti-corruption messaging with economic policies that restore middle-class stability to truly defend democracy.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/18/democrats-corruption-authoritarianism", "state_media": false, "category": "オピニオン", "full_text": "Resisting authoritarianism is the second-highest priority for Democrats’ college-educated base. But for working-class Americans, it’s only the 19th priority (out of 20), we found in a new survey. The gap between these two groups was larger than on any other issues: elites prioritized resisting authoritarianism an astonishing 33 percentage points more than non-elites did.\nDemocrats’ dilemma is that their college-educated base insists they stand up to Donald Trump’s attacks on democracy, but they also need to win working-class votes. The way to thread that needle is to recognize that what’s needed to defend democracy in the short term is different from what’s needed to defend it in the long term.\nIn the short term, Democrats’ base is right: immediate action is needed in the courts, exemplified by the more than 150 lawsuits that Democracy Forward has filed against the Trump administration and the 82 filed by California attorney general Rob Bonta, contesting alleged corruption, funding cuts, election interference and more. Action in the streets is powerful, too, from the protests in Minnesota to the mobilization of more than 8 million people (chiefly highly-educated women) at No Kings rallies across the country. But while #resistance is necessary, it’s not enough. Democrats also need to take two additional steps.\nThe first is to talk about defending democracy in ways that connect with working-class voters, which our survey defines as those without college degrees in the middle 50% of US income distribution. While “resisting authoritarianism” was a low priority for working-class voters of any race, “reducing corruption in government” was the third highest priority for white working-class respondents, fourth for working-class Latinos, and sixth for working-class African Americans, our survey found.\nIn fact, reducing corruption was one of only two top working-class priorities we identified that wasn’t economic. A study out of the UK explains why. It found that working-class Britons use “corruption” not in a narrow legal sense but to express “deeply rooted feelings of injustice and unfairness”. “The whole system needs [to be] seriously looked at and reformed,” said one man, protesting MPs at the Parliament bar with their taxpayer-subsidized gin and tonics. “The government don’t care about me, they don’t care about my children,” said a working-class woman. Corruption talk is how working-class people protest against a political system that doesn’t seem to represent them – a political system that has become anti-democratic.\nOne prominent Democrat provides the template for how to respond: Jon Ossoff, the US Senator up for re-election in Georgia. “American politics is coin operated,” he said. “Money comes in, favors come out.” A former documentary film-maker, Ossoff knows how to communicate. First he adopts a catchy phrase–the “Mar-a-Lago mafia” – to describe the alliance of the Trump family and the ultra-rich that “has taken American corruption to spectacular new heights”. Then he ties corruption directly to negative impacts on ordinary people’s lives: “One point six billion of your tax dollars to fund and finance [Donald Trump’s sons’] mining project in Kazakhstan. All this, while you pay for more gas, for groceries, for healthcare.” Then, Ossoff pivots from political to economic elites: “Members of Congress live in fear of these Super Pacs. And that corruption is why insurance companies get away with denying your claim for a procedure you needed to save your life … It’s why the ultra-rich get a tax break while you pay more for everything.” Republicans have been harnessing anger against economic elites and redirecting it against political elites for decades; with an approach like Ossoff’s, Democrats can reverse the process, redirecting anger against political elites on to economic elites benefitting from a corrupt system.\nIf the first step for Democrats is to talk about corruption, not authoritarianism, the second step is to respect working-class priorities. Eight out of the top 10 working-class priorities are economic, our survey found, and while elites’ economic priorities focus tightly on prices, the working class also prioritizes higher wages and economic opportunity. Many working-class voters don’t rush to defend democracy because they feel it’s failed them for the last 40 years. American workers used to get 70% of GDP but today their share is only 54%. That helps explain why virtually all Americans earned more than their parents in the decades immediately after second world war, but only half those born in 1980 will. The only way to defend democracy in the long run is to prioritize creating an economy that delivers a stable, middle-class life for working-class Americans.\nDonald Trump is busy alienating the working-class voters who swept him into office, but Democrats are also unpopular. If they want to win elections consistently enough to build a progressive, democratic future, they first need to respect that wo", "translation_ja": "", "vocab": [{"word": "authoritarianism", "definition": "民主的な制度を制限し、権力を統治者に集中させる政治体制。政治的自由や個人の権利を抑圧することが特徴である。"}, {"word": "elites", "definition": "社会や経験において最も権力や影響力を持つ人々のグループ。一般に高学歴や富裕層を指す。"}, {"word": "mobilization", "definition": "特定の目的のために人々や資源を組織化し、行動させるプロセス。政治活動においては支持者を団結させることを意味する。"}, {"word": "corruption", "definition": "政府や組織の公職者が個人的利益のために権力を乱用する行為。金銭や利権の不正な授受を含む。"}, {"word": "pivot", "definition": "焦点や方向を別のテーマに転換すること。論理的または戦略的に議論の中心を変えることを意味する。"}, {"word": "harnessing", "definition": "力やエネルギーを捕捉して、有効に利用すること。特定の目的のために感情やリソースを活用する。"}, {"word": "alienating", "definition": "他者の支持や好感を失わせる、または距離を置かせること。政治的支援者との関係を損なわせる状態を指す。"}]}, {"title_ja": "エボラ出血熱はほんの始まりに過ぎない", "title_en": "Ebola Is Only the Beginning", "summary_ja": "著者は、コンゴ民主共和国でのエボラ出血熱の流行が、世界の保健安全保障と準備態勢の重大な弱点を明らかにしていると主張している。数十年間のエボラ対応経験があるにもかかわらず、現在の流行は史上最も致死的で広がりが速く、世界がこれからの生物学的脅威に対してますます準備不足であることを示唆している。著者は、新興感染症、AI対応の生物兵器開発、弱体化した保健システムの中で、反応的な緊急対応ではなく、実質的な構造改革が必要な危機に直面していると警告している。", "summary_en": "The author argues that the ongoing Ebola outbreak in the Democratic Republic of Congo reveals critical weaknesses in global health security and preparedness. Despite decades of experience with Ebola, the current outbreak is the deadliest and fastest-spreading in history, suggesting the world is increasingly unprepared for future biological threats. The author warns that with emerging pathogens, AI-enabled bioweapon development, and weakened health systems, humanity faces growing risks that require substantial structural reforms rather than reactive emergency responses.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/democratic-republic-congo/ebola-only-beginning", "state_media": false, "category": "オピニオン", "full_text": "The Ebola outbreak in the Democratic Republic of the Congo is a stunning indictment of the state of global health security. The epidemic should have been containable; few threats are as familiar to health officials and institutions as this one. Ebola viruses were first discovered in northern Congo (then Zaire) in 1976; since then, they have caused 16 outbreaks in that country and dozens more in the region. Ebola remains highly lethal, but over the past five decades, medical professionals and governments have learned how to diagnose the disease, detect its spread, and, when caught early, stop it. Yet the outbreak that has killed over 3,500 people across Congo since early this year is already the deadliest the country has experienced and the fastest spreading in history. Despite recent signs of progress, it is nowhere near being contained.\nThe difficulty containing this year’s Ebola outbreak does not bode well for the world’s ability to respond effectively to future biological threats. Naturally occurring viruses are emerging more frequently. There were 12 recorded outbreaks of Ebola and Marburg, another deadly disease from the same viral family, during the four years of the Biden administration, compared with five during the previous four years; the current Trump administration could well face even more, having already contended with five outbreaks in less than two years. And the risk of an accidental or deliberate release of a deadly virus is growing. A rising number of labs are handling high-risk pathogens, in part because of a research boom following the COVID-19 pandemic, and it is becoming easier and easier to engineer new viruses using artificial intelligence. Earlier this month, the American AI company Anthropic disclosed five cases in which scientists used its AI software Claude for research that could support biological weapons development, including on variants of bird flu that could evade human immunity. The report confirmed fears that AI models could help bad actors access biological weapons.\nThe global health system, meanwhile, has been weakened by the Trump administration’s cuts to disease surveillance and outbreak preparedness programs, both within the United States and abroad. But the system was shaky long before U.S. President Donald Trump arrived on the scene. Global threat monitoring processes have significant gaps, inconsistent funding models delay vaccine development, and most countries underinvest in regular, comprehensive health services. Washington and other donors often step up when a crisis emerges, but scrambling to put together an emergency response is far from the best way to handle a biological threat. That approach is struggling to contain Ebola today. When a new, lesser-known pathogen begins to spread, the world needs to be much better prepared.\nTHE CRISIS IN CONGO\nThe current outbreak in Congo likely began at least eight months ago. Residents of Mongbwalu, a small town in the northeastern part of the country, described entire families dying from a mysterious illness as early as January. The virus spread for months before the Congolese government, with help from the World Health Organization (WHO), was able to confirm the source of the outbreak in mid-May. By then, hundreds of cases had already been detected across multiple communities in Congo, and two cases had been confirmed in Uganda. Some delay in detection is to be expected, given the remote location of the earliest deaths, ongoing conflict in the area, and the rarity of this outbreak’s driver, the Bundibugyo virus. But the fact that no previous Ebola outbreak had spread as far before being detected suggests that the global health system is becoming less, not more, prepared to manage biological threats.\nFour months after the outbreak was confirmed, responders from the Congolese government, the WHO, and the Africa Centres for Disease Control and Prevention (Africa CDC) are still struggling to contain it. The death rate sits at around 50 percent, much higher than in past Bundibugyo outbreaks, and 60 percent of deaths between mid-July and late August happened outside health facilities. These two patterns suggest that the true numbers of illnesses and deaths are higher than the official figures and that the disease continues to spread beyond the reach of health officials. Although there have been some signs of progress recently, WHO Director General Tedros Adhanom Ghebreyesus has warned that, if the outbreak’s current trajectory continues, the death toll could exceed that of the world’s largest-ever Ebola outbreak, the epidemic that killed more than 11,000 people and infected nearly 30,000 across West Africa between 2014 and 2016.\nThe United States’ withdrawal from the WHO and dissolution of the U.S. Agency for International Development almost certainly weakened the capacity of both the WHO and the Congolese government to respond to the Ebola outbreak. Nicholas Enrich, a career civil servant who briefly led USAID’s global he", "translation_ja": "", "vocab": [{"word": "indictment", "definition": "厳しい非難や告発。ここでは、現在の保健システムの失敗に対する強い批判を意味する。"}, {"word": "containment", "definition": "感染症の拡大を防ぐことや封じ込め。疾病管理において、病気の広がりを制限する重要な目標。"}, {"word": "pathogen", "definition": "病気を引き起こす微生物やウイルス。医学用語で、感染症の原因となる有機体。"}, {"word": "surveillance", "definition": "継続的な監視や監視体制。疾病管理では、感染症の発生を追跡・監視するシステム。"}, {"word": "trajectory", "definition": "進行方向や経路、軌跡。ここでは、感染症の拡大パターンや進展の傾向を指す。"}, {"word": "deliberate", "definition": "意図的な、故意の。ここでは、計画的にウイルスを放出する危険性を指す。"}]}, {"title_ja": "アメリカの消耗戦の罠", "title_en": "America's Attrition Trap", "summary_ja": "著者は、ウクライナや中東での現代紛争が、決定的な勝利よりも敵の軍事力と政治的意志を消耗させることを重視する消耗戦によって定義されていると主張している。アメリカは短期決戦を好む傾向がある一方で、敵国は継続的な産業生産と資源再生を通じて紛争を長引かせる利点を持つ可能性があり、戦略的課題に直面している。記事は、名目上の軍事力と実際に展開可能な能力のギャップ、従来の戦争原則と現代の技術的防衛のギャップ、軍事手段と政治的目標のギャップという3つの重大なギャップが、国々を長期にわたる消耗戦に陥らせると指摘している。", "summary_en": "The author argues that modern conflicts, particularly in Ukraine and the Middle East, are increasingly defined by wars of attrition where victory depends on outlasting an opponent's military capacity and political will rather than achieving decisive breakthroughs. The United States faces a strategic challenge because while it prefers short, decisive operations, adversaries may have advantages in prolonging conflicts through sustained industrial production and resource regeneration. The article identifies three critical gaps—between nominal military power and deployable capacity, between traditional warfare principles and modern technological defenses, and between military means and political objectives—that trap nations in grinding, indefinite conflicts.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/americas-attrition-trap", "state_media": false, "category": "オピニオン", "full_text": "Attrition is the defining feature of today’s conflicts. The wars in Ukraine and the Middle East have become grinding contests over which side can exhaust the other’s military capacity, economic resources, and political will. They all, of course, have unique characteristics, but their similar trajectories reflect a deeper change in how wars now unfold. Throughout the war in Ukraine, artillery crews have repeatedly had guns and could locate their targets but have lacked the shells to fire. Ukrainian engineers have found that new kinds of drones are met with Russian countermeasures within weeks, undercutting any advantage they briefly had. And in Iran, the United States degraded its adversary’s military and destroyed deeply buried nuclear facilities but failed to resolve the political problem that made the weapons a threat in the first place.\nEach dynamic illustrates a different gap that helps explain why states increasingly choose strategies of attrition—or find themselves trapped in them. The first is between the military capacity that countries possess on paper and the power that they can actually deploy and sustain. The second is between traditional principles of warfare and a modern battlefield on which technology makes decisive breakthroughs increasingly difficult. The third is between military means and the political ends they are intended to achieve.\nIn combination, these mismatches push wars toward attrition. When countries cannot generate and regenerate enough military capacity to overwhelm an enemy, war becomes a test of endurance. When breakthroughs are elusive, pursuing incremental gains and the steady destruction of enemy capacity becomes attractive. And when the combatants’ political end goals are too muddy or maximalist, imposing costs indefinitely can seem like the only alternative to capitulation.\nFor the United States, this poses a particular challenge. As American leaders increasingly seek short, decisive military operations, the United States may increasingly confront adversaries that see advantages in prolonging conflicts. The United States may not choose attrition, but it must be prepared to fight and win wars in which its adversaries do.\nTHE LONG AND GRINDING ROAD\nMilitary power is traditionally measured by what countries possess—assets such as troops, weapons platforms, and munitions inventories. But recent wars have exposed the gap between nominal power and usable military capability. In his 2015 book, How the War Was Won, the historian Phillips O’Brien argued that even during World War II, winning the major battles that captured the popular imagination had actually become less important than dominating what he called the “super-battlefield,” the vast expanse of factories and supply lines over which military power is produced and transported. Since that war, the ability to generate and sustain military power has only become more important. Modern militaries consume materiel at an incredible clip, and their adversaries have become increasingly capable of disrupting the production and supply networks needed to replace it.\nWhen Russia invaded Ukraine again in early 2022, it appeared to possess overwhelming military superiority. Days before the invasion, the chairman of the U.S. Joint Chiefs of Staff told lawmakers that Kyiv could fall within 72 hours of a full-scale assault; speaking to The New York Times, Ukrainian commanders said that they believed that their forces had little chance against the more than 100,000 Russian troops that had massed on their border. Yet because it could not swiftly translate its vast resources into sustained combat power at the front, Russia failed to employ its capabilities effectively and take Kyiv.\nBut its material and manpower reserves allowed Russia to survive its early setbacks. Russia could mobilize more personnel, draw on large ammunition stocks, increase weapons production, and turn to partners such as North Korea to sustain its fight. Russia developed a theory of victory that proposed that it did not need to defeat Ukraine decisively if it could outlast it, wearing it down while waiting for Europe’s and the United States’ political commitment to weaken. Attrition gave Russia a military advantage. It also exposed a different problem among Ukraine’s powerful NATO backers: aggregate power does not necessarily translate into the capacity to sustain a prolonged, high-consumption war.\n Recent wars have exposed the gap between nominal power and military capability.\nThe United States and NATO have far greater economic and military power than Russia does. Yet a war of attrition measures power differently. GDP cannot be fired from artillery tubes. Total defense spending cannot, itself, intercept missiles. The defense industries of Ukraine’s partners were not built to replace ammunition rapidly; they were organized around peacetime production. They thus struggled to convert their latent potential quickly enough into shells, interceptors, and other usable mili", "translation_ja": "", "vocab": [{"word": "attrition", "definition": "敵の資源や人員を徐々に消耗させることで勝利を目指す戦術。継続的な損失を通じて相手を弱体化させるプロセスを指す。"}, {"word": "trajectory", "definition": "時間経過とともに何かが辿る進路や経路。ここでは戦争がどのように展開していくかの進行パターンを意味する。"}, {"word": "nominal", "definition": "名目上の、表面的な。実際の価値や能力と異なり、単に理論上または帳簿上での価値を表す。"}, {"word": "materiel", "definition": "軍事物資や装備、弾薬などの軍事用物質。兵士の個人装備ではなく、大規模な軍事物資全体を指す。"}, {"word": "latent", "definition": "潜在的な、未発揮の。現在は明らかでないが、将来発揮される可能性がある能力や力を表す。"}, {"word": "mismatch", "definition": "適合していない状態、不釣り合い。期待される結果と実際の結果が一致していない不調和を意味する。"}, {"word": "elusive", "definition": "捉えにくい、達成困難な。つかまえたり実現させたりすることが難しいことを表す。"}]}, {"title_ja": "キューバの引き返せない地点", "title_en": "Cuba's Point of No Return", "summary_ja": "著者は、体制改革の拒否と米国制裁によるキューバの加速する国家経済崩壊を論じており、政府は政治的抑圧だけに能力が限定されているという。この軌道が転換されなければ、安定した繁栄した民主的キューバを再建することは事実上不可能になり、将来の指導者は瓦礫から統治を構築することになるだろう。長期の膠着状態は不平等、人口動態の悪化、移民、犯罪増加といった構造的問題を悪化させている。", "summary_en": "The author argues that Cuba is experiencing accelerating state and economic collapse due to the regime's unwillingness to reform and U.S. sanctions, with the government now capable only of political repression. Unless reversed soon, this trajectory will make it virtually impossible to rebuild Cuba as a stable, prosperous democracy, leaving future leaders to construct governance from ruins. The prolonged impasse is calcifying structural problems—inequality, demographic decline, emigration, and rising crime—into baseline conditions that will deepen dysfunction.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/cuba/cubas-point-no-return", "state_media": false, "category": "オピニオン", "full_text": "In central Havana, a giant mound of sand-colored rubble fills an entire city block. It is all that remains of the Superior Institute of Industrial Design—a stately building that in its 166 years housed a Spanish officers’ club, U.S. occupation forces after 1898, Cuba’s health ministry, and, finally, the design school. Declared uninhabitable years ago, it suffered two partial collapses in 2025. The state never sent anyone to fix it. This past February, what remained suddenly fell, entombing several squatters. When I visited in June, skinny men scaled the craggy surface, prying loose bits of brick that they carted off to build makeshift houses.\nCuba, on its current trajectory, is headed for the fate of the design school: what lies ahead is an accelerating collapse of the state and economy. Unless this course is reversed soon, rebuilding the island as a stable, prosperous, and democratic place could become virtually impossible.\nA few months ago, a slow unraveling was not what most observers expected. Because of the tariff threat in place since February against countries supplying oil to Cuba, President Donald Trump’s warnings of military action, and reports of secret talks between Havana and Washington, many believed that either a power-sharing deal or a Venezuela-style military operation was imminent.\nBy late May, that looked less likely. By then, according to the Miami Herald, the backchannel talks had collapsed amid opposition from Florida Republicans and Havana’s rejection of Washington’s offer: U.S. investment and petroleum in exchange for President Miguel Díaz-Canel’s removal and the privatization of Cuba’s state oil company. Havana enacted 176 economic reforms in June, which expanded space for the private sector, but this did not satisfy Washington. While allowing limited U.S. fuel and food to reach the island through private distributors, the Trump administration added new sanctions against state companies and regime officials. In August, Secretary of State Marco Rubio told Axios that the policy’s timeline had shifted, saying that it would take “patience and persistence” and that the regime could survive into 2028 or beyond.\nThere are a few ways to read Rubio’s comments. One is that the administration is bluffing. It is threatening to maintain the current extraordinary sanctions pressure either to restart the stalled negotiations or to misdirect the regime ahead of a military operation. Another is that, with the United States entangled in Iran and busy managing Venezuela, Cuba has simply been demoted as a priority. The administration has put the island on life support, with just enough U.S. fuel and food allowed to reach private firms to prevent societal breakdown, but otherwise it has no new plan. Cuba policy has been set to autopilot. A third is that the administration has concluded that waiting for the one-party system to implode from within is the only viable path to regime change, even if it is long, tortuous, and uncertain.\nRegardless, what is not widely appreciated outside Cuba is how economic and state collapse—triggered by the regime’s unwillingness to reform and hastened by U.S. sanctions—is already remaking the island. The state, aside from its capacity for political repression, is rapidly weakening. The economy is contracting and growing more unequal, leaving a large underclass too poor to participate meaningfully in the new private sector. Social cohesion is fraying, and crime is rising, while plunging birth rates and emigration warp Cuba’s demographics.\nAll these trends predate the foreign oil cutoff and the newest sanctions by years, if not decades, but each now appears to be accelerating. The danger is that the longer the impasse lasts, the more they will calcify into the baseline conditions for any future transition, narrowing the chances that Cuba ever becomes a well-governed country—and increasing the likelihood of an even more dysfunctional, chaotic future instead. If nothing changes soon, a transitional government could one day find itself in the same impossible position as the men atop the ruins of the design institute: trying to build something safe, habitable, and lasting out of rubble.\nAUTHORITARIAN ANARCHY\nIn Havana, I heard a joke. “Only two things work in this country: the state security apparatus and the hospitals.” It was too generous to the hospitals. About state security, it was true. Repression is the only thing the Cuban state still does well. This owes less to any apparent abundance of resources than to the leadership’s entirely rational unity. The headquarters of the Directorate of Penal Institutions, which administers the country’s prison system, is as decrepit as any building in central Havana, with cardboard filling broken windows. But the generals and spy chiefs know how much they would lose from political liberalization. If the Trump administration has tried to convince some of them that there are off-ramps, it does not appear to have succeeded. So they stick to", "translation_ja": "", "vocab": [{"word": "trajectory", "definition": "進路や方向性を意味し、特に時間とともに進む過程の傾向を指す。政治経済分析では国家や政策の進む方向性を示すのに用いられる。"}, {"word": "impasse", "definition": "交渉や状況が膠着状態に陥り、進展がない状態を意味する。外交問題などで双方が譲歩できない状況を表す。"}, {"word": "calcify", "definition": "比喩的に、柔軟性を失い固定化・硬化することを意味する。社会的問題や慣行が永久的な構造として定着することを指す。"}, {"word": "backchannel", "definition": "正式な外交ルートを通さない秘密の交渉チャネルを意味する。公式発表されない水面下での交渉を指す。"}, {"word": "privatization", "definition": "国有企業を民間企業に移行させることを意味する。市場経済化の一部として実施される経済政策である。"}, {"word": "dysfunctional", "definition": "機能不全の状態を意味し、システムや組織が正常に機能していない状況を指す。社会や政治制度の崩壊的状態を表すのに用いられる。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-19 22:36 JST";
  renderTabs();renderList();
})();
</script>
