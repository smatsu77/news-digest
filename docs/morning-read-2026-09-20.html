ition": "抑止力となるもの、つまり他者の行動を防止するために機能する兵器や政策を指す名詞。"}, {"word": "amass", "definition": "大量に集める、蓄積するという意味の動詞。支持や同意、物質的資源などを集めることを表す。"}]}, {"title_ja": "エボラは始まりに過ぎない", "title_en": "Ebola Is Only the Beginning", "summary_ja": "著者は、既知の封じ込め方法があるにもかかわらずコンゴ民主共和国の現在のエボラ流行が世界保健安全保障システムの壊滅的な失敗を示していると主張しています。自然発生的なウイルスがより頻繁に出現し、AI技術により設計されたパトジェンのリスクが増加する中、世界の弱体化し過小資金化した疾病監視インフラは将来の生物学的脅威に対して危険なほど準備ができていません。", "summary_en": "The author argues that the Democratic Republic of Congo's current Ebola outbreak, despite known containment methods, represents a catastrophic failure of global health security systems. With naturally occurring viruses emerging more frequently and risks of engineered pathogens increasing through AI advancement, the world's weakened and underfunded disease surveillance infrastructure is dangerously unprepared for future biological threats.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/democratic-republic-congo/ebola-only-beginning", "state_media": false, "category": "オピニオン", "full_text": "The Ebola outbreak in the Democratic Republic of the Congo is a stunning indictment of the state of global health security. The epidemic should have been containable; few threats are as familiar to health officials and institutions as this one. Ebola viruses were first discovered in northern Congo (then Zaire) in 1976; since then, they have caused 16 outbreaks in that country and dozens more in the region. Ebola remains highly lethal, but over the past five decades, medical professionals and governments have learned how to diagnose the disease, detect its spread, and, when caught early, stop it. Yet the outbreak that has killed over 3,500 people across Congo since early this year is already the deadliest the country has experienced and the fastest spreading in history. Despite recent signs of progress, it is nowhere near being contained.\nThe difficulty containing this year’s Ebola outbreak does not bode well for the world’s ability to respond effectively to future biological threats. Naturally occurring viruses are emerging more frequently. There were 12 recorded outbreaks of Ebola and Marburg, another deadly disease from the same viral family, during the four years of the Biden administration, compared with five during the previous four years; the current Trump administration could well face even more, having already contended with five outbreaks in less than two years. And the risk of an accidental or deliberate release of a deadly virus is growing. A rising number of labs are handling high-risk pathogens, in part because of a research boom following the COVID-19 pandemic, and it is becoming easier and easier to engineer new viruses using artificial intelligence. Earlier this month, the American AI company Anthropic disclosed five cases in which scientists used its AI software Claude for research that could support biological weapons development, including on variants of bird flu that could evade human immunity. The report confirmed fears that AI models could help bad actors access biological weapons.\nThe global health system, meanwhile, has been weakened by the Trump administration’s cuts to disease surveillance and outbreak preparedness programs, both within the United States and abroad. But the system was shaky long before U.S. President Donald Trump arrived on the scene. Global threat monitoring processes have significant gaps, inconsistent funding models delay vaccine development, and most countries underinvest in regular, comprehensive health services. Washington and other donors often step up when a crisis emerges, but scrambling to put together an emergency response is far from the best way to handle a biological threat. That approach is struggling to contain Ebola today. When a new, lesser-known pathogen begins to spread, the world needs to be much better prepared.\nTHE CRISIS IN CONGO\nThe current outbreak in Congo likely began at least eight months ago. Residents of Mongbwalu, a small town in the northeastern part of the country, described entire families dying from a mysterious illness as early as January. The virus spread for months before the Congolese government, with help from the World Health Organization (WHO), was able to confirm the source of the outbreak in mid-May. By then, hundreds of cases had already been detected across multiple communities in Congo, and two cases had been confirmed in Uganda. Some delay in detection is to be expected, given the remote location of the earliest deaths, ongoing conflict in the area, and the rarity of this outbreak’s driver, the Bundibugyo virus. But the fact that no previous Ebola outbreak had spread as far before being detected suggests that the global health system is becoming less, not more, prepared to manage biological threats.\nFour months after the outbreak was confirmed, responders from the Congolese government, the WHO, and the Africa Centres for Disease Control and Prevention (Africa CDC) are still struggling to contain it. The death rate sits at around 50 percent, much higher than in past Bundibugyo outbreaks, and 60 percent of deaths between mid-July and late August happened outside health facilities. These two patterns suggest that the true numbers of illnesses and deaths are higher than the official figures and that the disease continues to spread beyond the reach of health officials. Although there have been some signs of progress recently, WHO Director General Tedros Adhanom Ghebreyesus has warned that, if the outbreak’s current trajectory continues, the death toll could exceed that of the world’s largest-ever Ebola outbreak, the epidemic that killed more than 11,000 people and infected nearly 30,000 across West Africa between 2014 and 2016.\nThe United States’ withdrawal from the WHO and dissolution of the U.S. Agency for International Development almost certainly weakened the capacity of both the WHO and the Congolese government to respond to the Ebola outbreak. Nicholas Enrich, a career civil servant who briefly led USAID’s global he", "translation_ja": "", "vocab": [{"word": "indictment", "definition": "批判や非難を表す言葉で、システムや組織が失敗や過失を犯したことを強く示唆する証拠や主張のこと。"}, {"word": "lethal", "definition": "死を引き起こすことができるという意味で、特に病気やウイルスなど危険な物質に対して使用される形容詞。"}, {"word": "pathogen", "definition": "病気を引き起こす病原体で、ウイルス、バクテリア、真菌などの微生物を指す医学用語。"}, {"word": "surveillance", "definition": "監視や監視活動を意味し、公衆衛生の文脈では疾病やアウトブレイクを追跡・監視するシステムを指す。"}, {"word": "trajectory", "definition": "進行方向や発展の過程を表す言葉で、感染症の広がり方や状況の進み方を示すために使用される。"}]}, {"title_ja": "アメリカの消耗戦の罠", "title_en": "America's Attrition Trap", "summary_ja": "著者は、ウクライナと中東の紛争を含む現代戦争が、決定的な軍事勝利よりも消耗戦によって特徴づけられるようになったと主張しています。アメリカは短期的で決定的な作戦を求める傾向がある一方で、敵対国は紛争を長期化させる利点を認識するようになり、名目上の軍事力、実際の配備能力、政治的目標の間に乖離が生じています。", "summary_en": "The author argues that modern conflicts, particularly in Ukraine and the Middle East, are increasingly defined by wars of attrition rather than decisive military victories. The United States faces a critical challenge because while it seeks short, decisive operations, adversaries increasingly recognize advantages in prolonging conflicts, creating gaps between nominal military power, actual deployment capacity, and political objectives.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/americas-attrition-trap", "state_media": false, "category": "オピニオン", "full_text": "Attrition is the defining feature of today’s conflicts. The wars in Ukraine and the Middle East have become grinding contests over which side can exhaust the other’s military capacity, economic resources, and political will. They all, of course, have unique characteristics, but their similar trajectories reflect a deeper change in how wars now unfold. Throughout the war in Ukraine, artillery crews have repeatedly had guns and could locate their targets but have lacked the shells to fire. Ukrainian engineers have found that new kinds of drones are met with Russian countermeasures within weeks, undercutting any advantage they briefly had. And in Iran, the United States degraded its adversary’s military and destroyed deeply buried nuclear facilities but failed to resolve the political problem that made the weapons a threat in the first place.\nEach dynamic illustrates a different gap that helps explain why states increasingly choose strategies of attrition—or find themselves trapped in them. The first is between the military capacity that countries possess on paper and the power that they can actually deploy and sustain. The second is between traditional principles of warfare and a modern battlefield on which technology makes decisive breakthroughs increasingly difficult. The third is between military means and the political ends they are intended to achieve.\nIn combination, these mismatches push wars toward attrition. When countries cannot generate and regenerate enough military capacity to overwhelm an enemy, war becomes a test of endurance. When breakthroughs are elusive, pursuing incremental gains and the steady destruction of enemy capacity becomes attractive. And when the combatants’ political end goals are too muddy or maximalist, imposing costs indefinitely can seem like the only alternative to capitulation.\nFor the United States, this poses a particular challenge. As American leaders increasingly seek short, decisive military operations, the United States may increasingly confront adversaries that see advantages in prolonging conflicts. The United States may not choose attrition, but it must be prepared to fight and win wars in which its adversaries do.\nTHE LONG AND GRINDING ROAD\nMilitary power is traditionally measured by what countries possess—assets such as troops, weapons platforms, and munitions inventories. But recent wars have exposed the gap between nominal power and usable military capability. In his 2015 book, How the War Was Won, the historian Phillips O’Brien argued that even during World War II, winning the major battles that captured the popular imagination had actually become less important than dominating what he called the “super-battlefield,” the vast expanse of factories and supply lines over which military power is produced and transported. Since that war, the ability to generate and sustain military power has only become more important. Modern militaries consume materiel at an incredible clip, and their adversaries have become increasingly capable of disrupting the production and supply networks needed to replace it.\nWhen Russia invaded Ukraine again in early 2022, it appeared to possess overwhelming military superiority. Days before the invasion, the chairman of the U.S. Joint Chiefs of Staff told lawmakers that Kyiv could fall within 72 hours of a full-scale assault; speaking to The New York Times, Ukrainian commanders said that they believed that their forces had little chance against the more than 100,000 Russian troops that had massed on their border. Yet because it could not swiftly translate its vast resources into sustained combat power at the front, Russia failed to employ its capabilities effectively and take Kyiv.\nBut its material and manpower reserves allowed Russia to survive its early setbacks. Russia could mobilize more personnel, draw on large ammunition stocks, increase weapons production, and turn to partners such as North Korea to sustain its fight. Russia developed a theory of victory that proposed that it did not need to defeat Ukraine decisively if it could outlast it, wearing it down while waiting for Europe’s and the United States’ political commitment to weaken. Attrition gave Russia a military advantage. It also exposed a different problem among Ukraine’s powerful NATO backers: aggregate power does not necessarily translate into the capacity to sustain a prolonged, high-consumption war.\n Recent wars have exposed the gap between nominal power and military capability.\nThe United States and NATO have far greater economic and military power than Russia does. Yet a war of attrition measures power differently. GDP cannot be fired from artillery tubes. Total defense spending cannot, itself, intercept missiles. The defense industries of Ukraine’s partners were not built to replace ammunition rapidly; they were organized around peacetime production. They thus struggled to convert their latent potential quickly enough into shells, interceptors, and other usable mili", "translation_ja": "", "vocab": [{"word": "attrition", "definition": "敵の人員・物資を徐々に消耗させる戦術。相手の戦力を時間をかけて削減していくプロセスを指します。"}, {"word": "nominally", "definition": "名目上は、理論上はという意味。実際の機能や効果とは異なる公式的な表示や分類を示します。"}, {"word": "materiel", "definition": "軍事用語で、武器・弾薬・装備品などの軍需物資全般を指します。兵士の人員とは区別されます。"}, {"word": "breakthroughs", "definition": "戦場での大きな進展や突破口。敵の防線を突き破る決定的な成功を意味します。"}, {"word": "elusive", "definition": "捕らえがたい、達成困難な。期待した結果が得られずに逃げ続ける状況を表します。"}, {"word": "latent", "definition": "潜在的な、隠れた。すぐには見えないが、存在する可能性のある能力や資源を指します。"}, {"word": "aggregate", "definition": "合計の、総合的な。複数の要素を合わせた全体の量や規模を意味します。"}]}, {"title_ja": "キューバの回帰不可能な地点", "title_en": "Cuba's Point of No Return", "summary_ja": "著者は、政権の改革拒否と米国制裁の強化により、キューバが加速する国家と経済の崩壊を経験していると主張する。ハバナの物理的衰退は、より深い制度的失敗を象徴しており、すぐに現在の方向を転換しなければ、島は統治不能になる危険性がある。国家能力の低下、不平等の増加、社会の分裂、人口動態の変化が恒久的な条件となりつつある。トランプ政権の一貫性のない政策は、制裁圧力を維持しながら最小限の人道支援のみを認めており、根本的な原因に対処するのではなく、これらの破壊的傾向を悪化させている。", "summary_en": "The author argues that Cuba is experiencing accelerating state and economic collapse due to the regime's refusal to reform and intensifying U.S. sanctions, with the physical decay of Havana symbolizing deeper institutional failure. Unless the current trajectory reverses immediately, the island risks becoming ungovernable, as weakening state capacity, rising inequality, social fragmentation, and demographic decline calcify into permanent conditions. The Trump administration's lack of a coherent policy—maintaining sanctions pressure while allowing minimal humanitarian aid—is allowing these destructive trends to worsen rather than addressing the fundamental causes.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/cuba/cubas-point-no-return", "state_media": false, "category": "オピニオン", "full_text": "In central Havana, a giant mound of sand-colored rubble fills an entire city block. It is all that remains of the Superior Institute of Industrial Design—a stately building that in its 166 years housed a Spanish officers’ club, U.S. occupation forces after 1898, Cuba’s health ministry, and, finally, the design school. Declared uninhabitable years ago, it suffered two partial collapses in 2025. The state never sent anyone to fix it. This past February, what remained suddenly fell, entombing several squatters. When I visited in June, skinny men scaled the craggy surface, prying loose bits of brick that they carted off to build makeshift houses.\nCuba, on its current trajectory, is headed for the fate of the design school: what lies ahead is an accelerating collapse of the state and economy. Unless this course is reversed soon, rebuilding the island as a stable, prosperous, and democratic place could become virtually impossible.\nA few months ago, a slow unraveling was not what most observers expected. Because of the tariff threat in place since February against countries supplying oil to Cuba, President Donald Trump’s warnings of military action, and reports of secret talks between Havana and Washington, many believed that either a power-sharing deal or a Venezuela-style military operation was imminent.\nBy late May, that looked less likely. By then, according to the Miami Herald, the backchannel talks had collapsed amid opposition from Florida Republicans and Havana’s rejection of Washington’s offer: U.S. investment and petroleum in exchange for President Miguel Díaz-Canel’s removal and the privatization of Cuba’s state oil company. Havana enacted 176 economic reforms in June, which expanded space for the private sector, but this did not satisfy Washington. While allowing limited U.S. fuel and food to reach the island through private distributors, the Trump administration added new sanctions against state companies and regime officials. In August, Secretary of State Marco Rubio told Axios that the policy’s timeline had shifted, saying that it would take “patience and persistence” and that the regime could survive into 2028 or beyond.\nThere are a few ways to read Rubio’s comments. One is that the administration is bluffing. It is threatening to maintain the current extraordinary sanctions pressure either to restart the stalled negotiations or to misdirect the regime ahead of a military operation. Another is that, with the United States entangled in Iran and busy managing Venezuela, Cuba has simply been demoted as a priority. The administration has put the island on life support, with just enough U.S. fuel and food allowed to reach private firms to prevent societal breakdown, but otherwise it has no new plan. Cuba policy has been set to autopilot. A third is that the administration has concluded that waiting for the one-party system to implode from within is the only viable path to regime change, even if it is long, tortuous, and uncertain.\nRegardless, what is not widely appreciated outside Cuba is how economic and state collapse—triggered by the regime’s unwillingness to reform and hastened by U.S. sanctions—is already remaking the island. The state, aside from its capacity for political repression, is rapidly weakening. The economy is contracting and growing more unequal, leaving a large underclass too poor to participate meaningfully in the new private sector. Social cohesion is fraying, and crime is rising, while plunging birth rates and emigration warp Cuba’s demographics.\nAll these trends predate the foreign oil cutoff and the newest sanctions by years, if not decades, but each now appears to be accelerating. The danger is that the longer the impasse lasts, the more they will calcify into the baseline conditions for any future transition, narrowing the chances that Cuba ever becomes a well-governed country—and increasing the likelihood of an even more dysfunctional, chaotic future instead. If nothing changes soon, a transitional government could one day find itself in the same impossible position as the men atop the ruins of the design institute: trying to build something safe, habitable, and lasting out of rubble.\nAUTHORITARIAN ANARCHY\nIn Havana, I heard a joke. “Only two things work in this country: the state security apparatus and the hospitals.” It was too generous to the hospitals. About state security, it was true. Repression is the only thing the Cuban state still does well. This owes less to any apparent abundance of resources than to the leadership’s entirely rational unity. The headquarters of the Directorate of Penal Institutions, which administers the country’s prison system, is as decrepit as any building in central Havana, with cardboard filling broken windows. But the generals and spy chiefs know how much they would lose from political liberalization. If the Trump administration has tried to convince some of them that there are off-ramps, it does not appear to have succeeded. So they stick to", "translation_ja": "", "vocab": [{"word": "impasse", "definition": "行き止まり、膠着状態。交渉や議論が進展しない停滞した状況を指す。"}, {"word": "calcify", "definition": "石灰化する、硬化する。転じて、考え方や制度が柔軟性を失い固定化されることを意味する。"}, {"word": "unraveling", "definition": "ほつれる、解き明かされる。秩序あるシステムや状況が徐々に崩壊する過程を指す。"}, {"word": "fraying", "definition": "ほつれ始める、傷む。社会結合や制度が徐々に弱まる状態を表現する。"}, {"word": "autopilot", "definition": "自動操縦。政策が能動的な方針決定なしに、慣性で進行している状態を比喩的に表す。"}, {"word": "dysfunctional", "definition": "機能不全の、正常に作動しない。組織やシステムが本来の役割を果たせない状態を指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-20 22:48 JST";
  renderTabs();renderList();
})();
</script>
