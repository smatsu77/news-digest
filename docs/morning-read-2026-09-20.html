s in Germany. Merz insists his government will push forward with economic and welfare reforms despite mounting pressure and poor approval ratings.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cvwyz29n0nn2o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "German Chancellor Merz calls state election a 'disaster' for his party but vows to stay on\n- Published\nEmbattled German Chancellor Friedrich Merz has vowed to stay on despite exit polls in two local elections suggesting damaging defeats for his centre-right Christian Democratic Union (CDU) party.\nIn the north-eastern state of Mecklenburg-Vorpommern, the party was initially projected to scrape through with its worst ever election result. But a few hours later, it dipped below the 5% threshold needed to stay in parliament. Merz called it \"a disaster\" for his party.\nMeanwhile the far-right AfD was on track to win the most votes in Mecklenburg-Vorpommern, but it is unlikely to govern as other parties refuse to work with it.\nIn Berlin, the ruling CDU was expected to be beaten by Die Linke (The Left).\nMerz is under mounting pressure, with poor approval ratings and rumours he could even be replaced mid-term in a so-called chancellor swap.\nVotes took place on Sunday, a fortnight after the CDU saw its vote halved as the Alternative for Germany (AfD) won a major victory in the state of Saxony-Anhalt.\nEchoing comments he made after that defeat, Merz told reporters at the party's Berlin headquarters on Sunday that he would forge ahead with his coalition government's plans to push through a package of economic, tax and welfare reforms.\n\"The reforms have to come,\" he insisted. \"I am taking on this responsibility, because I want to move our country forward\".\n\"What needs to be done now requires backbone, steadfastness and patience,\" Merz said. \"I will demonstrate this as CDU party chairman and, above all, as chancellor of our country. te to form new government in the federal level\".\nHe described the electorate as \"impatient\", adding that it was \"not realistic to expect that every issue has been solved within one year.\n\"He has got four years and we have to give him the four years,\" Dregger said.\nWhile his backers have argued that many of the problems the nation faces are inherited, Merz himself is deeply unpopular.\nThe former corporate lawyer's tack to the right on issues like immigration has failed to erode AfD support, while also alienating people further to the left.\n  - Published14 hours ago\n  - Published4 days ago\n  - Published7 September", "translation_ja": "", "vocab": [{"word": "embattled", "definition": "困難な状況に置かれた、四面楚歌の。政治的困難や批判に直面している人物や組織を表す。"}, {"word": "threshold", "definition": "限界値、閾値。政治選挙では議会進出に必要な最低投票率を指す。"}, {"word": "antidote", "definition": "解毒剤、対抗手段。本来は毒の治療薬だが、悪影響に対する有効な対策を意味することもある。"}, {"word": "fertile ground", "definition": "肥沃な土壌、成長に適した環境。思想やイデオロギーが根付きやすい社会状況を比喩的に表す。"}, {"word": "designate", "definition": "指定する、分類する。政府や公式機関が公式に何かを分類または認定することを指す。"}, {"word": "coveted", "definition": "熱望された、強く望まれた。多くの人が欲しいと思う地位や物を表す。"}]}, {"title_ja": "ウクライナがモスクワへの最大規模ドローン攻撃を実施、石油精製所を直撃", "title_en": "Ukraine launches largest drone attack on Moscow, hits oil refinery", "summary_ja": "ウクライナがモスクワ地域への過去最大規模のドローン攻撃を実行し、市長によると450機のドローンが撃ち落とされた。この攻撃により、地域の燃料供給の3分の1以上を供給している主要な石油精製所と住宅地が被害を受け、少なくとも2人が殺害された。ゼレンスキー大統領は、この攻撃が数十億ドル相当のロシア軍事インフラを標的にしたことを確認した。", "summary_en": "Ukraine conducted its most massive drone attack on the Moscow region, with 450 drones shot down according to the mayor. The strikes hit a major oil refinery supplying over a third of the region's fuel and damaged residential areas, killing at least two people. President Zelensky confirmed the attack targeted key Russian military infrastructure worth billions of dollars.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c34gdjk1ne8yo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Largest attack on Moscow sees Ukraine fire hundreds of drones, mayor says\n- Published\nUkraine has fired its largest drone attack on the Moscow region, the mayor has said, hitting the city's main oil refinery and a residential building.\nMayor Sergei Sobyanin said 450 drones heading for the capital had been shot down in what he called \"the most massive\" attack. The region's governor said at least two people were killed and 20 injured.\nUkraine's President Volodymyr Zelensky confirmed Kyiv had hit a \"key\" Russian oil facility and a logistics site in the region with drones and missiles, representing \"billions of dollars that sustain the war machine\".\nUkrainian officials meanwhile said nine people, including three children, had been killed in Russian attacks in the Kyiv and Sumy regions on Saturday.\nRussia and Ukraine have recently intensified their strikes, targeting energy-generating and transport facilities, as well as major logistics hubs.\nA 44-year-old woman was killed in Sofyino on Sunday after a drone hit a three-storey residential building, regional head Andrei Vorobyev said. Another five people - including two children - were injured.\nAn elderly man died after a private house was hit in the Orekhovo-Zuevo district, Governor Andrei Vorobyev added.\nVideos verified by the BBC on social media show explosions in the night skies above Moscow, and a burning warehouse.\nMayor Sobyanin said a drone had struck a building near one of the capital's boulevards and the oil refinery - where Ukrainian military officials said three key units had been damaged.\nThe site supplies more than a third of the Moscow region's fuel, according to the defence ministry in Kyiv, and some of its petrol, diesel and aviation fuel go to Russia's military.\nUkraine's defence minister said attacking such facilities \"directly undermines the enemy's ability to continue its war of aggression and supply its military formations\".\nSobyanin said the major attack was \"an attempt to disrupt\" Russia's parliamentary election, which was in its third day on Sunday. The vote is tightly controlled by the Kremlin and has been dismissed by critics as neither free, fair nor transparent.\nRussian state media reported that an election official was one of two people killed by a drone attack on a bus in a Moscow-controlled part of Kherson in Ukraine on Sunday, citing the head of Russia's election commission.\nMeanwhile, Moscow's biggest airport Sheremetyevo warned passengers \"temporary restrictions\" were in place overnight, while at the capital's Vnukovo airport all arrivals and departures were halted. Restrictions at both airports were lifted by Sunday morning but each warned some flights may still be delayed.\nIt comes after a mother and her two small children, a boy and a girl, were killed in a Russian attack in the city of Fastiv, Kyiv on Saturday, according to regional head Tymur Tkachenko.\nHe later said a child injured in a separate attack in Vyshhorod, north of Kyiv, had also died in hospital.\nIn the north-eastern Sumy region, four people were killed when a Russian drone hit the car they were travelling in, top local official Oleh Hryhorov said.\nRussia also struck a monastery in the Kherson region with a drone on Saturday, Zelensky said, killing one member of the clergy and injuring four others.\nBoth Russia and Ukraine have continued to hit energy infrastructure targets in the past week, despite US President Donald Trump claiming on social media that the two sides had agreed not to do so.\nTrump signed a sanctions bill on Friday that targets Russia's economy by implementing tariffs on the biggest buyers of the country's oil and gas which include China and India.\nThe US legislation gives the US president powers to impose 100% tariffs on major purchasers of Russian energy.\nRussian President Vladimir Putin launched a full-scale invasion of Ukraine in February 2022.\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "logistics", "definition": "物資や兵員の輸送・配置に関する活動。軍事や企業運営において、計画的に資源を移動・管理することを指す。"}, {"word": "infrastructure", "definition": "社会や経済の基盤となる施設やシステムの総称。エネルギー、交通、通信などの重要な設備を含む。"}, {"word": "undermines", "definition": "何かの基盤や能力を弱める、または損なうこと。段階的に信頼や力を失わせる過程を表す。"}, {"word": "aggression", "definition": "他国への侵略や攻撃的な行為。国際紛争において、相手国に対する武力行使や威圧的な行動を意味する。"}, {"word": "verified", "definition": "情報や事実が真実であることを確認・検証すること。ニュースメディアが信ぴょう性を証明するプロセス。"}, {"word": "transparent", "definition": "情報が隠されず明確で、誰もが内容を理解できる状態。組織や政治プロセスにおいて、公開性と説明責任があることを示す。"}]}, {"title_ja": "エド・シーランがマックルモア問題以来の初公演で「過ち」について謝罪", "title_en": "Ed Sheeran Apologizes for 'Mistakes' at First Show Since Macklemore Controversy", "summary_ja": "エド・シーランはフィラデルフィアでのコンサートでツアーの論争に対処し、マックルモアの状況での「過ち」について謝罪し、イスラエル・パレスチナ紛争に対する自身の立場を公然と議論した。ラッパーはパレスチナ支持の発言後にツアーから外されたため、すべてのサポートアクトが辞退しチケット価格が大幅に下落した。シーランは団結への取り組みを表明しながら、これを沈黙していられない人道的問題として認識していると述べた。", "summary_en": "Ed Sheeran addressed the controversy surrounding his tour at a Philadelphia concert, apologizing for 'mistakes' made during the Macklemore situation and openly discussing his stance on the Israel-Palestine conflict. The rapper was dropped from the tour after pro-Palestinian remarks, leading all support acts to quit and ticket prices to drop significantly. Sheeran stated he is committed to unity while acknowledging this as a humanitarian issue he can no longer remain silent about.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm780ll1de18o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Ed Sheeran admits 'mistakes' at first show since Macklemore controversy\n- Published\nEd Sheeran has apologised to fans for making \"mistakes\" as he opened his first show since Macklemore was dropped from his tour for making pro-Palestinian remarks on stage.\nThe singer began his concert in Philadelphia by addressing the controversy that has since engulfed the tour and prompted all of his support acts to quit.\n\"I never wanted to be an activist musician, but this has put me in the middle of an important and passionate argument about free speech and the most complex political issue on the planet,\" Sheeran said.\nHe described the 7 October 2023 Hamas-led attacks as \"horrific\" and called the situation in Gaza \"unjustifiable\".\nThe singer has said the decision to drop Macklemore was made by his promoters, not him. The row has seen ticket prices drop and sales decline for the remaining US leg of his Loop Tour.\nSheeran told the crowd that while he was used to facing criticism for his music, \"this week, the criticism was about something much more important, and I've had to take and make difficult decisions - and I am making mistakes - and I'm so, so sorry\".\nHe said he wanted to \"address the question of where I stand in the situation in Israel and Palestine, and whether my doing this concert here tonight implies where I stand\".\n\"I have tried in my career not to be a political commentator of any kind, because I want my music and shows to be about unity, not division\", he continued. \"But this is a humanitarian issue, and I cannot hide how I feel about it anymore.\"\nSheeran said what happened in Israel on 7 October was \"horrific and compounded centuries of Jewish pain\", and what was happening in Gaza was \"catastrophic and unjustifiable and disproportionate\".\n\"My heart has been broken by the scale of devastation and loss of civilian lives, of children's lives, and this systemic injustice we're seeing unfold in the West Bank cannot be overlooked.\"\nHe said he was working out how to contribute in a way that would help \"victims of these terrible times - and listening and learning, because I do not know enough\".\n- Everything we know about the Ed Sheeran and Macklemore controversy \n  - Published20 hours ago\nThe British singer became emotional as he told the crowd his concert was \"still a place where everyone is welcome, and everyone here can stand beside people that have opposing views\".\nHe said that he had not known \"whether this tour would be carrying on\" and \"whether I even wanted to be an artist at all\", but that he had returned to the stage because he was committed to his fans.\nSheeran also said he was \"deeply worried\" by the idea that venues would \"pre-approve\" content or performers, which received applause from the audience.\nHis remaining tour dates are scheduled with shows set throughout North and South America. While the mega-star's previous tour was among the highest-grossing of all time, some ticket prices for this show dropped to $32 (£24).\nSome fans reported being able to get ticket refunds, though Ticketmaster and concert promoter Messina Touring Group did not confirm they were being reimbursed.\nSome protesters waved flags outside the venue, but the concert proceeded largely unfettered.\nA protester who gave his name as Cooper said he had come out \"to support the struggle for\" the Palestinian people.\n\"We need more people like Macklemore and other artists who have a voice, who have a public platform, to be able to speak on behalf of the Palestinian people and their struggle for liberation, especially in the United States,\" he said.\nOf the handful of ticket-holders who stopped to talk to the BBC prior to the show, there was a sentiment of determination to enjoy an evening of music while at the same time supporting freedom of speech.\nReacting to Sheeran's remarks as they later left the venue, one fan said he had \"covered both sides nicely, and I think everyone leaves happy\", while another called his speech \"very sincere, and I think that's what the people wanted to hear was sincerity\".\nThe controversy began in early September, when Macklemore performed a song dedicated to pro-Palestinian protesters and referred to the death toll in Gaza as a genocide, a claim Israel rejects. The rapper also said criticism of Israel was not intended as criticism of \"my Jewish brothers and sisters\".\nMessina Touring Group said Macklemore was dropped because some venues - such as Gillette Stadium in Boston, Massachusetts - would refuse to let the concerts take place if he performed.\nBillionaire Robert Kraft who owns Gillette Stadium and the American football team the New England Patriots, confirmed he had banned Macklemore from performing during the British singer's forthcoming shows.\nKraft, who is Jewish, accused the US rapper of hate speech and said he was \"only sharing selective information and ignoring the actions of Hamas\".\nMeanwhile, support acts including Irish singer-songwriter Aaron Rowe and Danish musician Lukas Graham and his backin", "translation_ja": "", "vocab": [{"word": "activist", "definition": "政治的・社会的な変化を積極的に推し進めようとする人、または活動家的な。ここでは政治的メッセージを積極的に発信する音楽アーティストを指す。"}, {"word": "disproportionate", "definition": "不釣り合いで、過度に大きい、または不均衡な。ここでは、ガザの被害が規模や影響の程度において不相応に大きいことを意味する。"}, {"word": "systematic", "definition": "体系的で、計画的または組織的な方法で。ここでは「systemic injustice（構造的不正義）」として、システム全体に組み込まれた不公正を指す。"}, {"word": "humanitarian", "definition": "人道的な、または人間の福祉と苦しみの軽減に関わる。政治的立場を超えて、人命や苦痛を減らすことに焦点を当てた課題を指す。"}, {"word": "pre-approve", "definition": "事前に承認または認可する。ここでは、会場が講演者やパフォーマーの内容を事前に検査・承認する慣行を指す。"}, {"word": "unfettered", "definition": "制限や束縛がない、自由な状態で。ここでは、プロテスト活動の存在にも関わらずコンサートが妨害されずに続行されたことを示す。"}]}, {"title_ja": "アール・スペンサー、BBC放送でキングス・チャールズ国王に関する主張を擁護", "title_en": "Earl Spencer Defends Diana Book Claims About King Charles in BBC Interview", "summary_ja": "アール・スペンサーはBBC放送でのインタビューで、ダイアナ妃の葬儀について議論する際に、キングス・チャールズ国王が「彼女のことはすぐに忘れるだろう」と述べたと主張する回顧録『Swan Song』を擁護しました。スペンサー伯爵はダイアナの死後、チャールズ国王の声に「浮かれた調子」を感じたと述べ、国王はカミラ妃と結婚することを考えていたのではないかと示唆しました。バッキンガム宮殿はこの説明に異議を唱え、悲しみが記憶に影響を与えることを述べましたが、スペンサー伯爵は自分が真実を述べていることを主張し、ウィリアム王子とハリー王子はこれらの明らかにされた内容に驚かないだろうと述べています。", "summary_en": "Earl Spencer has defended his memoir 'Swan Song' in a BBC interview, maintaining that King Charles said 'we'll forget her soon enough' during a heated argument about Princess Diana's funeral arrangements. The earl described feeling a 'giddy tone' in Charles's voice after Diana's death and suggested the king may have been thinking about marrying Camilla. Buckingham Palace disputed the account, citing how grief can affect memory, but Spencer insisted he was telling the truth and that Princes William and Harry would not be surprised by the revelations.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cry4z1xykeleo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Key takeaways from BBC interview as Earl Spencer defends claims about King\n- Published\nEarl Spencer has told the BBC writing his book about sister Princess Diana, which has made headlines for its criticism of King Charles, was his \"duty...as an eyewitness to history\".\nIn an interview with the BBC's Laura Kuenssberg ahead of the memoir's release on Tuesday, Earl Spencer said he wanted \"to put things down once and for all that were true\".\nAmong claims made in Swan Song about the King, who was then the Prince of Wales, was that he said \"we'll forget her soon enough\" during an argument over whether Princes William and Harry should walk in Diana's funeral procession.\nIn a strongly worded response, Buckingham Palace said the King was \"mindful that the pain of fraternal grief can cloud reason, affect judgement and colour memory in ways others do not recognise, even many years after such a loss\".\nHere are the key moments from Earl Spencer's interview, which include his first account of how he was told about Diana's death and criticism of press coverage of the Duke and Duchess of Sussex.\nEarl initially told Diana's crash was 'not too serious'\nEarl Spencer was in South Africa when Princess Diana died in a Paris car crash in the early hours of 31 August 1997, along with close friend Dodi Fayed and the driver of the car.\nHe told the BBC he got a call in the middle of the night from his sister Lady Jane Fellowes, who said Princess Diana had been in a crash but \"it's not too serious\".\nBut then he \"kept getting more and more distressing calls\" from his sister.\n\"And then my sister Jane said, 'I'm afraid she's died.' It started... as a little prang, and then it became a broken leg, perhaps a head injury, and then death.\"\nCharles had 'giddy tone' after Diana's death\nDescribing the hours after her death, Earl Spencer said he took a call at his home in Cape Town from Prince Charles, who told him how he broke the news to Princes William and Harry at Balmoral Castle.\n\"I felt there was a sort of giddy tone,\" he told the BBC.\n\"I'd had a lot of calls that day from people who cared, who were stunned... and I just felt there was a lightness in his tone about Diana's death that really jarred with me.\"\nIn his book, Earl Spencer compares his tone to like a \"lottery winner\" and says he suspects the prince's reaction was based on how this event would free him to marry the woman he loved, his future wife Queen Camilla.\nWhen asked by Kuenssberg if he could be sure that is what Prince Charles was thinking, Earl Spencer said: \"I cannot be sure, I'm saying that's what I assume from the tone is a possibility.\"\nComments 'will not be a surprise' to William and Harry\nEarl Spencer told the BBC he had been discussing funeral arrangements with a palace official, who said it had been agreed Princes William and Harry should walk behind their mother's coffin. Unhappy, he said he told the official it is not what his sister would have wanted, before the conversation came to an end.\nSoon after, the earl says he took a call from Prince Charles, who asked him about his opposition to it.\n\"I said, 'Well, of course not, sir, she wouldn't want it'. And then he said, 'Well, I walked behind Lord Mountbatten's coffin.' And I said, 'Yes, but you were 30 and he wasn't your mother'.\"\nHe then claims Charles went \"ballistic... and ranted for a while\" about the Spencer's sense of duty not being adequate enough before \"he said 'We'll forget her [Diana] soon enough'.\"\n\"I really was so stunned and after a stunned silence I said 'I can not believe you just said that' and I hung up on him\", the earl told Kuenssberg during his sit down interview at his Althorp estate.\nResponding to the Palace's statement pushing back on the story, Earl Spencer said: \"I can tell you here and now, those are exactly the words he said.\n\"I've only ever had two calls on the line with Prince Charles at any stage in my life.\n\"I was hyper-alert to what he was saying, and those are precisely the words he said. And I promise that to you now. Genuinely, that is what he said.\n\"I don't hear him saying he didn't say that.\"\nThe earl said he told \"close friends and family\" about the \"monstrous\" comment.\nWhen asked if people should believe him or the King, he said: \"Well, I'm telling the truth... what else would have made me hang up on the King that day?\"\nOn what Princes William and Harry might think of the comments being brought up nearly 30 years later, he added the words \"will not be a surprise\" to the brothers.\nHe also said his renowned funeral eulogy, in which he said his sister's qualities would never be \"extinguished from our minds\", was a \"direct rebuttal\" of the prince's comments.\n'I know lots of things about the King' not in the book\nTalking about his motivations for writing the book, Earl Spencer, aged 62, said it was his \"duty... as an eyewitness to history\" and as someone in the \"final season of my life\" with his parents dying in their sixties.\n\"I'm aware of mortality and I wanted to just put thing", "translation_ja": "", "vocab": [{"word": "eyewitness to history", "definition": "歴史的な出来事を直接見聞きした人。重要な歴史的瞬間に立ち会い、第一手の情報を持つ立場を指します。"}, {"word": "memoir", "definition": "著者が自分自身の人生経験や重要な出来事について記した著作。自伝よりも特定の時期や経験に焦点を当てることが多いです。"}, {"word": "giddy", "definition": "浮かれた、ふざけた気分または態度。通常はふさわしくない状況での軽薄さを表します。"}, {"word": "hyper-alert", "definition": "非常に注意深い、警戒心が高い状態。細かい言葉や行動に極度に注意を払っている様子を指します。"}, {"word": "rebuttal", "definition": "相手の主張や意見に対する反論。議論や講演で他者の意見に対抗する声明を意味します。"}, {"word": "fraternal grief", "definition": "兄弟姉妹の死に関連する悲しみ。家族内の特定の親密な関係における喪失の感情。"}, {"word": "extinguished", "definition": "消される、なくなる。比喩的には記憶や感情などが完全に失われることを意味します。"}]}, {"title_ja": "バーナム首相、トランプ大統領との初会談を控えグリーンランド安全保障協定を称賛", "title_en": "Burnham Hails Greenland Security Deal Ahead of First Trump Meeting", "summary_ja": "英国のバーナム首相は、グリーンランドをめぐる数ヶ月の緊張の後、デンマークと米国の間で新たに合意された安全保障協定を称賛した。この協定は領土取得なしに北極圏地域における米国の強化された安全保障権限を認めるものである。バーナム首相は今週ニューヨークで開催される国連総会でトランプ大統領と初めて会談する予定である。", "summary_en": "UK Prime Minister Andy Burnham has praised a new agreement between Denmark and the US regarding security control in Greenland, following months of tensions over the territory. The deal grants the US enhanced security authority in the Arctic region without territorial acquisition. Burnham is expected to meet Trump for the first time at the UN General Assembly in New York this week.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c8207255rq5lo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Burnham hails Greenland deal ahead of expected first Trump meeting\n- Published\nAndy Burnham has hailed a deal between Denmark and the US to \"strengthen security in the Arctic\" after the two countries resolved a months-long feud over Greenland.\nThe UK prime minister and his Danish counterpart Mette Frederiksen \"welcomed the US's commitment to the region\" in a call on Sunday morning, Downing Street said.\nNato previously said the agreement would help stabilise the region, as Trump declared Denmark would grant the US \"permanent control over security, and all other needs\" in the semi-autonomous Danish territory in the Arctic.\nBurnham's comments come as he is expected to meet Trump for the first time at the UN General Assembly (UNGA) in New York this week.\nThe agreement comes after months of threats by Trump to \"take\" Greenland over national security concerns, citing its strategic location for defence purposes as well as its mineral wealth.\nNo text of the agreement has been released, but Trump said in a Truth Social post the deal came with \"no cost to the United States\" and meant it could \"do what is necessary\" to \"secure and defend the security of Greenland\".\nHe said it included a rule that no US adversary could maintain a military presence in Greenland or \"make sensitive investments in Greenland, without our express written approval\".\nIn a readout of Sunday's phone call, a No 10 spokesperson said Burnham and Frederiksen \"welcomed the US's commitment to the region and underlined the strategic and shared importance of the High North for Euro-Atlantic security\".\nThe spokesperson added: \"The Prime Minister congratulated Prime Minister Frederiksen and the Kingdom of Denmark on negotiating a deal benefiting the US, Greenland and Denmark, and said he would pass on his congratulations to President Trump.\"\nWhile Burnham praised the agreement, Liberal Democrat leader Ed Davey called it a \"pretend\" victory and a near carbon copy of the existing agreement.\n\"Donald Trump is trying to claim he's got a success in Greenland, but actually, all he's got is almost a carbon copy of the agreement that's persisted since the 1950s,\" he said at a Q&A with members at party conference.\n\"So let Donald Trump try to pretend he's had a victory. The truth is, Europe, Nato, countries like Canada stood up to him and won.\"\nTrump had tried for months to purchase or annex the semi-autonomous territory, arguing that it was vulnerable to adversaries, including Russia and China.\nIn the wake of the deal, Frederiksen said she was \"pleased that there is a prospect of a good agreement\" for all three parties, which was expected to be signed at the UN General Assembly next week.\nThe deal \"strengthens our common security in the Arctic and the North Atlantic area\" while also recognising \"the sovereignty and territorial integrity of the Kingdom and the right of the Greenlandic people to self-determination\", she said in a joint statement with Greenland's Prime Minister Jens-Frederik Nielsen.\nThe agreement would still need to go through \"the necessary parliamentary procedures to enter into force\" once signed, the statement noted.\nBurnham has spoken with Trump at least twice since entering Downing Street and No 10 said he intends to use the UNGA to \"drive forward work on issues that matter to people at home\" including the cost of living and the war in Ukraine.\nRelated topics\n  - Published21 January\n  - Published12 May\n  - Published22 January", "translation_ja": "", "vocab": [{"word": "semi-autonomous", "definition": "完全な独立ではなく、限定的な自治権を持つ状態を示す。政治的に親国家の支配下にありながらも、一定の自己統治を行う領土や地域に使用される。"}, {"word": "annex", "definition": "他国の領土を自国に併合すること。強制的に領土を奪取または吸収する行為を指す。"}, {"word": "readout", "definition": "公式な声明や報告書の概要。特に会談や交渉の結果を要約した政府発表を意味する。"}, {"word": "territorial integrity", "definition": "国家の領土の完全性と不可侵性を示す国際法の原則。領土の保全と統一を保証する。"}, {"word": "adversary", "definition": "敵対関係にある国家または勢力。対立する立場にある相手方を指す。"}, {"word": "strategic location", "definition": "地政学的に重要な位置。軍事的または経済的な優位性をもたらす地理的位置を意味する。"}]}, {"title_ja": "トム・パーカーの妻ケルシー、昨年の悲劇的な死産を経て赤ちゃんを出産", "title_en": "Kelsey Parker Welcomes Baby After Devastating Stillbirth Last Year", "summary_ja": "ザ・ウォンテッドの故シンガー、トム・パーカーの妻ケルシー・パーカーが、パートナーのウィル・リンジーとの間に新生児の娘リバーを迎えました。このニュースは、カップルが昨年6月に死産を経験した後のものです。パーカーは2022年に脳がんで亡くなったトム・パーカーとの間に2人の子どもがいます。", "summary_en": "Kelsey Parker, widow of The Wanted singer Tom Parker, has welcomed a newborn daughter named River with her partner Will Lindsay. This comes after the couple experienced a stillbirth last June. Parker has two children from her marriage to Tom Parker, who died of brain cancer in 2022.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmzxz260020qo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Kelsey Parker welcomes baby after 'devastating' stillbirth last year\n- Published\nKelsey Parker, the widow of The Wanted singer Tom Parker, has welcomed a baby after last year announcing a \"devastating\" stillbirth.\nThe podcaster and author, 35, had two children with British boy band star Tom Parker before he died in 2022, aged 33, after being diagnosed with terminal brain cancer.\nShe is now in a relationship with Will Lindsay and last June revealed the \"earth-shattering news\" that they had lost their baby Phoenix.\nOn Sunday, a post on her Instagram account showed a photo of a newborn baby's arm next to a pink sign with the word River. \"Welcome to the world, River. Our little bit of hope,\" the caption said.\nCelebrities including The Saturdays singer Rochelle Humes, TV presenter Susanna Reid and reality TV star Holly Hagan-Blyth have congratulated Kelsey Parker on social media.\n\"Congratulations angel,\" Rochelle Humes wrote.\n\"Oh my goodness – this is so wonderful – welcome River,\" Susanna Reid said.\nHagan-Blyth commented \"I am SO happy for you xxxx\".\nKelsey Parker's Instagram bio says \"turning life's hardest moments into hope\".\nLast year she posted a poem online after the loss of her stillborn baby.\nIt was called Born Sleeping, Forever Loved, and began \"the world grew quiet as you arrived, So loved, so longed for, yet not alive. Our precious boy, our angel light, Born with wings, took silent flight\".\nIn 2023, she published a book titled With And Without You, about the first year after the death of her former partner Tom.\nThe couple married in 2018 and had a daughter, Aurelia Rose, and a son, Bodhi.\nIn a post after his death she wrote \"thank you to everyone who has supported in his care throughout, he fought until the very end. I'm forever proud of you\".\nHer latest pregnancy was announced in May in an Instagram post that said \"somehow, through all the heartbreak, it feels like Tom and Phoenix have sent us another little gift from heaven, our little rainbow baby\".\nIf you have been affected by the issues raised in this article, the BBC's Action Line has details of advice and support services.\nRelated topics\n  - Published23 June 2025\n  - Published30 March 2022", "translation_ja": "", "vocab": [{"word": "stillbirth", "definition": "妊娠期間中に赤ちゃんが死亡して出産される状態。医学用語として使用され、流産とは異なり、妊娠後期に起こることが多い。"}, {"word": "earth-shattering", "definition": "非常にショッキングで、人生を大きく変えるような出来事を表す表現。極めて衝撃的なニュースや事実を強調する際に使用される。"}, {"word": "terminal", "definition": "医学的には末期の、治癒不可能な病状を意味する。ここでは末期脳がんという意味で使用されている。"}, {"word": "podcast", "definition": "インターネットで配信される音声または動画番組。リスナーが自分のペースでダウンロードして聴くことができるメディア形式。"}, {"word": "rainbow baby", "definition": "死産や流産などの悲しい出来事の後に生まれた赤ちゃんのこと。希望と喜びの象徴として使用される用語。"}, {"word": "bereaved", "definition": "死別によって家族や愛する人を失った状態。悲しみや喪失の中にある人を指す。"}]}, {"title_ja": "カナダとフランス、防衛・経済面での関係強化に合意", "title_en": "Canada, France agree to closer ties in defense, economy", "summary_ja": "フランスのマクロン大統領とカナダのカーニー首相は、セントピエール・ミクロン島での会談で防衛、エネルギー、先進技術における協力の深化を発表した。この合意は、米国との関係が悪化する中でのカナダのヨーロッパ志向の加速を反映している。カーニーはまた、フランス、カナダ、米国、中国が人工知能開発で協力することを提案した。", "summary_en": "French President Emmanuel Macron and Canadian Prime Minister Mark Carney announced deeper cooperation in defense, energy, and advanced technologies during a meeting in Saint Pierre and Miquelon. The agreement reflects Canada's accelerating turn toward Europe amid strained relations with the United States. Carney also proposed that France, Canada, the US, and China collaborate on artificial intelligence development.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/canada-france-agree-to-closer-ties-in-defense-economy/a-79348843?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Canada, France agree to closer ties in defense, economy\nSeptember 20, 2026\nFrench President Emmanuel Macron and Canadian Prime Minister Mark Carney announced deeper cooperation between their countries in many areas, including defense, energy, and business.\nThe two leaders made the announcement on Sunday from Saint Pierre and Miquelon, a small French territory just off the Atlantic coast of Canada.\nAccording to a statement from Carney's office, the leaders discussed aerospace, energy, critical minerals, and advanced technologies, such as quantum computing, satellites, and supercomputing.\nThis move is another step in Canada's accelerating turn toward Europe, as both countries are experiencing strained relations with the US.\nThe meeting between Macron and Carney follows up on Carney's visit to Brussels, during which the EU offered Canada \"associate member\" status.\nWhat did the leaders say?\n\"We both believe that our countries are two great, independent nations who want to remain so,\" Macron said at the joint news conference, adding that France and Canada would work together for closer ties on fishing, security and energy.\n\"We both believe in democracy, the rule of law, respect for free and fair trade, the science on which our decisions are based, and the strategic autonomy that we defend,\" Macron said. \"And this is what very deeply unites Canada and France, Canada and the European Union.\"\nMeanwhile, Carney said: \"The time has come to tighten our links between Canada and France, between Canada and the European Union — links based on the values we share.\"\n\"History remembers those who... defend their sovereignty, those who stay true to their values,\" Carney stressed in his speech.\nHowever, he also proposed that France, Canada, the United States and China work together on artificial intelligence.\nWhere is Saint Pierre and Miquelon?\nSaint Pierre and Miquelon, a French overseas territory, is located off the coast of Newfoundland and has a population of fewer than 6,000 people.\nIt is France's only remaining possession in North America and a remnant of its former vast territories in what are now Canada and the United States. One of Canada's provinces, Quebec, has French as its sole official language.\nMacron's three-day visit to Saint Pierre and Miquelon is the first by a French president in over a decade. Carney is the first Canadian prime minister to visit the territory.\nThe leaders' meeting comes at a time of strained relations with the US. Ottawa has strongly rejected President Donald Trump's repeated remarks about making Canada the 51st US state.\nLast Monday, Trump posted a map of North America on social media. The map depicted Canada, Greenland, Mexico, much of Central America and the Caribbean, and Iceland in the colors of the US flag.\nSeveral French overseas territories were also included in the image, such as Guadeloupe, Martinique, and Saint Pierre and Miquelon.\nHowever, upon his arrival in the territory late Saturday, Macron reaffirmed its status as French territory and dismissed \"strange ideas\" on the subject.\nEdited by: Saim Dušan Inayatullah\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "strategic autonomy", "definition": "自国の政策決定を他国に依存せず、独立して行う能力のこと。特に政治・経済・防衛分野での独立性を指す。"}, {"word": "strained relations", "definition": "二国間または団体間の関係が悪化し、緊張している状態。外交上の対立や不和を意味する。"}, {"word": "overseas territory", "definition": "母国の領土外にあり、その国に統治される領土のこと。歴史的な植民地支配の遺産として存在することが多い。"}, {"word": "critical minerals", "definition": "産業や技術開発に不可欠であり、供給が限定的である鉱物資源。半導体やバッテリー製造などに必要。"}, {"word": "associate member status", "definition": "国際機構において、完全な加盟国ではなく協力関係にある準会員の地位。限定的な権利と義務を持つ。"}, {"word": "sovereignty", "definition": "国家が自らの領土と人民に対して持つ最高の統治権。他国からの干渉を受けない独立性を意味する。"}]}, {"title_ja": "ドイツ州選挙でメルツ首相のCDUが大敗", "title_en": "German State Elections Deal Major Blow to Chancellor Merz's CDU", "summary_ja": "フリードリヒ・メルツ首相率いるキリスト教民主同盟（CDU）がベルリンとメクレンブルク＝フォアポンメルン州の選挙で大きな敗北を喫し、2週間で3度目の選挙敗北となった。極右のドイツのための選択肢（AfD）と左翼政党が大幅に支持を増やす中、メルツ首相は不人気な医療年金改革の継続を誓っている。", "summary_en": "Chancellor Friedrich Merz's Christian Democratic Union (CDU) suffered significant electoral defeats in Berlin and Mecklenburg-Western Pomerania, marking the party's third loss in two weeks. The far-right Alternative for Germany (AfD) and left-wing parties made substantial gains, while Merz vows to continue with unpopular health and pension reforms despite governing coalition losing majority support.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/german-state-elections-deal-a-blow-to-chancellor-friedrich-merz/a-79348585?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "German elections deal a blow to Chancellor Friedrich Merz\nSeptember 20, 2026\nTwo of Germany's 16 federal states, Berlin and Mecklenburg-Western Pomerania, have just elected new state legislatures. The results for Chancellor Friedrich Merz's Christian Democratic Union (CDU) represent yet another major blow in turbulent times both nationally and internationally.\nIn northeastern Germany, projections suggest that the CDU narrowly failed to clear the 5% threshold for representation in parliament, a historic first in the party's history.\nIn the German capital, the party that led the state government, lost nearly a third of its support, dropping to around 20%.\nJust minutes after the first projections were released, Merz made a statement: \"We can't sugarcoat the results in Mecklenburg-Western Pomerania — it was a disaster.\" As for the heavy losses in Berlin, he described the outcome there as \"reasonable.\"\nFor the CDU, this marks the third electoral defeat in two weeks. In the state election in Saxony-Anhalt on September 6, the party came in far behind the Alternative for Germany (AfD), which the Office for the Protection of the Constitution has classified as partially far-right extremist.\nIn the wake of this debacle, Merz, whose term began in 2025, appeared visibly shaken.\nAt the federal level, Merz governs in coalition with the center-left Social Democratic Party (SPD), which saw mixed results in Sunday's state elections.\nWith around 36% of the vote, SPD state premier Manuela Schwesig — who has been in office since 2017 — finished just behind the far-right AfD in Mecklenburg-Western Pomerania. The AfD, on the other hand, nearly doubled its share of the vote compared to state elections in 2021, coming in first at 38%.\nIn Berlin, however, the SPD's share of the vote fell by a third to 12%, while the AfD became the third-largest party, winning 16% of the vote.\nMeanwhile, the new frontrunner in the German capital is the socialist Left Party, with about 25%. It too was able to double its share of the vote, just as the AfD did in Mecklenburg-Western Pomerania. With the support of the SPD and the environmentalist Greens, the socialists — whom the CDU has labeled radical leftists and antisemites — would be able to form a coalition.\nBerlin set to get a left-wing mayor\nIf this happens, Elif Eralp would be the first person from the Left Party to serve as mayor of Berlin. Leading up to the election, Eralp, the daughter of Turkish exiles, shared her vision in an interview with DW: \"My vision for Berlin is an affordable Berlin where everyone — regardless of their background, religion, language or income — can lead a good life in dignity,\" Eralp said.\nIn Mecklenburg-Western Pomerania, a coalition of SPD, the Left Party and the Greens is the most likely outcome. State Premier Schwesig said she was committed to a \"stable democratic government.\"\nMeanwhile, AfD co-leader Alice Weidel once again declared on election night that the CDU's containment strategy of refusing to cooperate with her party had failed. Speaking on the public television network ZDF, she said: \"Our long-term goal, of course, is to hold coalition talks with the CDU.\"\nThe AfD and the Left Party are stronger than the CDU and SPD\nBoth election results reflect widespread dissatisfaction among the population with Chancellor Merz and the coalition he leads with the SPD. In nationwide opinion polls, the governing coalition no longer has a majority. Here, too, the AfD is clearly in the lead, while the SPD is only narrowly ahead of the Left Party.\nParties on the political fringes are now gaining significantly more support at both the federal and state levels than the ruling parties, which are frequently embroiled in arguments on the federal level. These disputes often arise in connection with the reform agenda announced months ago by Chancellor Merz, aimed at bringing the rapidly rising costs of health, long-term care and pension insurance under control.\nDespite yet another election setback, the German chancellor intends to stay the course: \"The reforms must go ahead. Of course, this puts us all in a difficult situation. But we will shoulder this responsibility. I will shoulder this responsibility,\" he said.\nAfter lengthy discussions, the coalition had already reached an agreement on health care reforms. Many things, like drugs and dental prosthetics, will become more expensive, while family insurance coverage will also be scaled back. These are all measures that won't win any new support for the already unpopular government. The same goes for the ongoing debate over reforms to the pension system, which is set to be supplemented by increased private retirement savings.\n'I want to move our country forward'\nMerz acknowledged that these changes would bring burdens and new uncertainties for many people. Nevertheless, he remained confident: \"I want to move our country forward. I am also firmly convinced that the success of our reforms will not only improve our society but also ", "translation_ja": "", "vocab": [{"word": "debacle", "definition": "完全な失敗や惨敗を意味する名詞。特に予想外の大きな敗北や崩壊を指す。ビジネスや政治の文脈でよく使用される。"}, {"word": "containment strategy", "definition": "敵対する勢力や悪影響の拡大を防ぐための戦略。政治やビジネスで、問題勢力の影響を抑制する方針を指す。"}, {"word": "fringe", "definition": "主流から外れた周辺的な立場や集団を表す。政治用語では極左や極右などの過激派勢力を指す。"}, {"word": "embroiled", "definition": "紛争や議論に深く巻き込まれている状態。be embroiled inで「～の中に巻き込まれている」という意味。"}, {"word": "agenda", "definition": "実現を目指す計画や行動目標の一覧。政治や組織で推し進めたい施策や改革の計画を意味する。"}, {"word": "prosthetics", "definition": "人工的に作られた身体部位の代替品。医学用語で義肢や入れ歯などの人工装具を指す。"}]}, {"title_ja": "ドイツ極右AfD党、州選挙で躍進も連立政権樹立の道閉ざされる", "title_en": "AfD Makes Gains in State Elections but Faces Coalition Barriers", "summary_ja": "ドイツの極右政党AfDは北東部の州選挙とベルリンで強い成績を収め、メクレンブルク・フォアポンメルン州で37.9%の得票率で最大政党となった。しかし他政党がAfDとの連立を拒否しているため、選挙では成功したにもかかわらず政権樹立ができない状況にある。同党の躍進は有権者の反発を招き、候補者の犯罪歴やナチス関連の問題により選挙キャンペーン中にも各種スキャンダルに見舞われた。", "summary_en": "Germany's far-right AfD party achieved strong results in northeastern state elections and Berlin, becoming the largest party in Mecklenburg-Western Pomerania with 37.9% of votes. However, other parties refuse to form coalitions with the AfD, leaving it unable to form governments despite electoral success. The party's rise has prompted voter mobilization against it and been marred by candidate scandals involving criminal records and Nazi-related controversies.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/afd-makes-gains-in-state-elections-but-has-no-government-options/a-79348308?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "AfD makes gains in elections, but has no government option\nSeptember 20, 2026\nThe Alternative for Germany (AfD) made significant gains in the elections in northeastern Germany and in the capital, Berlin, but is likely to remain in the opposition in both states.\nThe Alternative for Germany (AfD) scored another election victory on Sunday evening, becoming the strongest party in Mecklenburg-Western Pomerania with 37.9% of the vote, according to an exit poll by the polling firm infratest-dimap on election night.\nThat put the far-right party just ahead of the Social Democrats (SPD), whose dramatic comeback in the last few weeks, led by incumbent State Premier Manuela Schwesig, fell just short, with 35.7% of the vote on Sunday evening. The final results may vary as votes are counted.\nThe AfD was not short of confidence. Even before the first exit poll results were announced, AfD co-leader Tino Chrupalla told public TV network ARD, \"We clearly have a mandate to govern here,\" before adding that the party would offer coalition talks to all the other parties.\nChrupalla also said he expected Chancellor Friedrich Merz to resign now. \"That would truly be a relief for this country,\" he said.\nThe AfD also made gains in the Berlin House of Representatives — the state parliament of the German capital — but fell far short of its own expectations on election night. According to infratest-dimap, it took 16.2% of the vote, though it had been polling at 18% only last week.\nAfD: 'We are the new people's party!'\nWith Merz's center-right Christian Democrats (CDU) suffering heavy losses in both state elections, AfD party co-leader Alice Weidel said she now sees her party as the successor to the CDU.\n\"We are the new people's party in Germany,\" Weidel pronounced to public broadcaster ZDF, before criticizing the Christian Democrats for refusing to entertain the possibility of entering into a coalition with AfD: \"We are holding talks because we haven't erected any firewalls.\" But Weidel did not explain what the policy talks with other parties would look like.\nAfter the AfD's triumph in the state of Saxony-Anhalt on September 6, it has become clear that the party — some of whose members are considered a threat to Germany's constitutional order by German domestic intelligence agencies — is struggling to find political allies.\nIn that election, the AfD narrowly missed securing an absolute majority of seats in the state parliament and thus cannot elect the state premier on its own. In the struggle to form a governing majority, no party currently appears willing to enter into a coalition with the AfD.\nNo majorities for the AfD\nHowever, the AfD's leading candidate in Saxony-Anhalt, Ulrich Siegmund, had made it clear that he would only lead a \"stable\" AfD government, ruling out a minority government tolerated by representatives from other parties. During the election campaign, he had gone even further, repeatedly stating that he would only serve as state premier in a single-party AfD government.\nSince then, it has been unclear exactly what the AfD is aiming for. The AfD's national leadership appears to have a strong interest in seeing form any kind of government. This was underscored by Weidel, who said after the elections in Berlin and Mecklenburg-Western Pomerania that the AfD could take power \"even in a minority government.\"\nWeidel herself is said to have ambitions to succeed Merz as chancellor. She was already her party's chancellor candidate in the last federal election in 2025, and many top AfD officials also see her as the chancellor candidate next time round. A successfully formed AfD state government could potentially give those ambitions a boost.\nHowever, the party's rise has also been accompanied by growing protests. In the elections in Mecklenburg-Western Pomerania and Berlin, it was evident that many voters mobilized to keep the AfD's votes in check.\nAfD scandals during the campaign\nThe party also made several negative headlines during the election campaigns: In Mecklenburg-Western Pomerania, one AfD candidate had to pull out of the race when it emerged that he was a convicted bank robber. Another candidate withdrew his candidacy for the state parliament when it was revealed he had a DUI conviction and could no longer hold a driver's license.\nIn Berlin, meanwhile, drugs and Nazi memorabilia were found in the possession of a staff member of the party's lead candidate.\nIn the past, AfD politicians have repeatedly drawn criticism for making positive allusions to the Nazi era. One AfD European Parliament member posed with his hand on his heart in front of Adolf Hitler's \"Führer Bunker\" in Berlin, while one Bundestag member described himself as the \"friendly face of National Socialism.\"\nThe influential AfD state leader in Thuringia, Björn Höcke, was twice fined for using a slogan of the notorious Sturmabteilung (SA), the paramilitary organization of Adolf Hitler's NSDAP party.\nThis article was translated from German.", "translation_ja": "", "vocab": [{"word": "firewall", "definition": "政治的または社会的な結びつきを断つための方針または境界線。ここではAfDとの連立を拒否する他政党の姿勢を指す。"}, {"word": "coalition", "definition": "複数の政党が権力を共有するために形成する政治的同盟。政府樹立のため異なる政党が協力する状況。"}, {"word": "mandate", "definition": "選挙での勝利または国民の信任に基づいて、特定の政策を推し進める権限や公認。"}, {"word": "incumbent", "definition": "現在その職にある人物。ここでは現職の州首相を指す。"}, {"word": "mobilized", "definition": "特定の目標達成のために人々を組織し活動させること。ここでは有権者がAfDを阻止するために投票に参加したことを意味する。"}, {"word": "paramilitary", "definition": "軍隊ではなく民間組織でありながら、軍事的な訓練や目的を持つ組織。"}]}, {"title_ja": "ゼレンスキー大統領、トランプ大統領との会談を発表 ニューヨークでの会合予定", "title_en": "Zelenskyy Says He Spoke With Trump, Plans New York Meeting", "summary_ja": "ウクライナのゼレンスキー大統領は日曜日、ドナルド・トランプ大統領と会談したことを発表しました。両首脳はニューヨークでの会合に同意し、ゼレンスキー氏は両国間の協議に外交的な勢いがあると述べています。", "summary_en": "Ukrainian President Volodymyr Zelenskyy announced Sunday that he had a conversation with President Donald Trump. The two leaders agreed to meet in New York, with Zelenskyy noting there is diplomatic momentum in discussions between their nations.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/ukrainian-president-zelenskyy-spoke-president-trump/story?id=136603480", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ: 24時間ニュース配信", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、世界中で発生する速報ニュースとライブイベントを24時間体制でカバーしています。主要なニュースが発生した際に、最新の報道を提供するサービスです。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events happening around the world. The service delivers up-to-the-minute reporting on major stories as they develop.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "テキサス州オースティンでICE職員による銃撃事件が発生", "title_en": "Man injured in ICE shooting incident in Austin, Texas", "summary_ja": "日曜日、テキサス州オースティンで移民税関捜査局（ICE）の事件に関連して男性が銃撃を受けて負傷しました。当局の報告によると、現在も事件の詳細について調査が進められています。", "summary_en": "A man was shot and injured during an Immigration and Customs Enforcement operation in Austin, Texas on Sunday, according to police officials. The incident details are still being investigated by authorities.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/man-hospitalized-after-ice-involved-shooting-austin-officials/story?id=136604992", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国がエクアトリアルギニアに強制送還した者が拘留施設で暴力被害、弁護士が報告", "title_en": "US deportees beaten in Equatorial Guinea detention, lawyers report", "summary_ja": "トランプ政権がエクアトリアルギニアに強制送還した2人の男性が、メディアに劣悪な条件について話したことへの報復として、拘留ホテルで暴力を受けたと弁護士が報告している。マラボのホテル・バミには約30人の米国人強制送還者が閉じ込められたままで、事件後に当局は携帯電話を没収し弁護士面会を禁止している。", "summary_en": "Two men deported by the Trump administration to Equatorial Guinea were allegedly bound, beaten, and tortured at a detention hotel, reportedly in retaliation for speaking to media about poor conditions. About 30 US deportees remain trapped at Hotel Bamy in Malabo, where authorities have confiscated cellphones and prevented lawyer access following the incident.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/sep/18/us-men-deported-hotel-equatorial-guinea", "state_media": false, "category": "社会", "full_text": "Two men that the Trump administration expelled to Equatorial Guinea were bound, fitted with bags over their heads, beaten and pushed down a flight of stairs, all in plain view of other US deportees, according to witnesses and human rights lawyers.\nThe men – one from Egypt and one from Eritrea – were then taken to a prison. About 30 detainees from the US remain trapped at a hotel in the outskirts of the coastal city of Malabo after being deported from the US. Detainees have said they believe the men were beaten for telling the press and human rights advocates about the poor conditions and violence inside the hotel, and that they are haunted by flashbacks and terrified they will be retaliated against next.\nHuman rights advocates and experts have warned for months that conditions at the Hotel Bamy – a run-down establishment that has served as a detention center for US deportees – are dangerous.\nThe US has sent at least 66 people from different African countries, Cuba and Brazil to Equatorial Guinea, which has received $7.5m as part of a deal to cooperate with the US deportation program. The Trump administration has pursued dozens of similar deals with countries to take in immigrants that the US cannot deport directly to their home countries, where judges have deemed they would face torture or persecution. In the past, the US government allowed those people to live and work in the US indefinitely.\nThe Trump administration, however, has sought instead to expel them to third countries where they have no ties, do not speak the local language and have no legal status – trapping them in limbo.\nAdvocates have been especially concerned for deportees sent to Equatorial Guinea, where the authoritarian government is notorious for human rights abuses, including torture, according to the US state department. Detainees held at Hotel Bamy have told the Guardian that armed guards keep watch over them 24/7, and that they have not been provided any medical care or even fresh clothes since arriving there. One of the detainees, who has a severe stomach hernia that requires visits to the hospital to drain his stomach due to excessive fluid build-up, said he has been unable to see a doctor since arriving at Hotel Bamy.\nOther detainees have managed to obtain medication for HIV, diabetes and other conditions via human rights lawyers, but remain fearful that access to medications will be arbitrarily cut off.\nThe two men who were tortured – Ahmed Soliman, 31, of Egypt, and Samson Birhane, 47, of Eritrea – have since been transferred to a prison in Malabo. Multiple witnesses recounted that the police officers shouted, “Where is the phone? Where is the phone!” as they beat the men, who had initially been accused of breaking a mirror at the hotel before they were pulled aside and arrested.\nThe beating, which occurred on 11 September, followed the release of a video first reported by Reuters showing conditions at the hotel and the violent behavior of the guards. The detainees had been using cellphones to communicate with lawyers and the media about the conditions they were facing.\nIn the video taken by Soliman, which lawyers shared with the Guardian, authorities are seen pointing guns at the deportees. A Cuban man asked the officer for the return of his confiscated mobile phone so he could contact relatives and a lawyer, but was ignored. When officers noticed Soliman filming the exchange with his mobile phone, multiple officers rushed at him and others standing nearby, pointed their guns, and told Soliman to remain on his knees with his hands up for 10-15 minutes.\nIn another video, Soliman was able to film authorities forcibly sending US deportees to Ethiopia, where they are likely to face torture. When deportees resisted going with authorities, officials gave them the option to “go back to their home country” or “go to prison”. At least 12 people have been returned by Equatorial Guinea to their home country, where they face persecution.\nIn May, human rights experts at the United Nations issued a rare public appeal asking Equatorial Guinea to halt plans to return deportees to their home countries and to comply with international human rights standards and avoid refoulement, or the expulsion of people to countries where they face persecution.\n“This is a human rights catastrophe,” said Bella Mosselmans, director of the Global Strategic Litigation Council, who represents several of the deportees at Hotel Bamy. The US and Equatorial Guinea “must be held accountable for the atrocities they are committing”, she added.\nIn the week since Soliman and Birhane were beaten, police have also been searching the other detainees’ hotel rooms for cellphones, and have confiscated them. They have also barred lawyers from seeing the deportees. Authorities have told the 29 US deportees who remain at Hotel Bamy that they may never see Soliman or Birhane again, according to lawyers. One detainee who witnessed the beating said authorities treat them as if they ar", "translation_ja": "", "vocab": [{"word": "refoulement", "definition": "国際法で禁止された行為で、迫害や拷問の危険がある国への人の強制送還を意味する。難民保護の文脈で重要な法律用語。"}, {"word": "authoritarian", "definition": "権力が少数者（個人や小グループ）に集中した政治体制を指す。民主的プロセスを制限する政府の特徴を表現する際に使用される。"}, {"word": "deportees", "definition": "自国に強制送還された人々を指す。本国への強制退去処分を受けた外国人を表す。"}, {"word": "limbo", "definition": "不確かな状態や決定が保留されている状況を意味する。移民が法的地位なく留置されている不安定な状態を表現する際に使用。"}, {"word": "atrocities", "definition": "極度に残忍で非人道的な行為を指す。人権侵害や戦争犯罪のような重大な悪行を表現する。"}, {"word": "retaliation", "definition": "害を加えてきた者に対する報復行為を意味する。被害への復讐や仕返しの行動を指す。"}]}, {"title_ja": "ナイジェリアの獄舎で37人が死亡：過密と換気不足が原因と指摘", "title_en": "37 Dead in Nigerian Prison Cell: Overcrowding and Poor Ventilation Blamed", "summary_ja": "ナイジェリアのミンナ市でNSCDC準軍事組織が運営する獄舎で、違法採掘疑いの被拘禁者37人が死亡した。多くは10代の若者だった。生存者は過密状態と換気不足が死亡原因だと証言し、事件は抗議活動を引き起こし、当局者の職務停止につながった。", "summary_en": "Thirty-seven suspected illegal goldminers, many of them teenagers, died in a prison cell operated by Nigeria's paramilitary NSCDC in Minna. Survivors reported severe overcrowding and lack of ventilation caused the deaths. The incident sparked protests and led to the suspension of senior officials pending investigation.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/18/survivor-panic-struggle-breathe-nigeria-prison-cell-died-minna", "state_media": false, "category": "政治", "full_text": "Survivors from a prison cell in Nigeria where 37 suspected illegal goldminers died while in the custody of a paramilitary group this week have recounted their panic and struggle for breath, as police on Friday fired teargas at people protesting against the deaths and imposed an overnight curfew in the city of Minna.\nThe victims – many of whom were children – were found dead on Thursday in the cells of the Nigeria Security and Civil Defence Corps (NSCDC), which had raided suspected illegal goldmines and locked up dozens of miners in the city, the state capital of the mineral-rich state of Niger.\nNSCDC – a paramilitary group that works with police – initially blamed the deaths on a disease outbreak. However, an intelligence report seen by Agence France-Presse (AFP) said preliminary information suggested that overcrowding and inadequate ventilation were responsible.\nThe state governor, Umar Bago, said many of the dead were children, aged 14 to 18, who had been working in the mines instead of going to school. “There are issues of illegal mining and it is taking a toll on our children,” he said.\nDauda Shehu, a survivor from the cell, told journalists at a hospital on Friday: “We were jam-packed in the cell, no ventilation for us to breathe well. All of a sudden we realised that we could not breathe and we were all scampering for where to get fresh air, we even appealed to them several times, banged the cell door, but they refused to answer us.”\nA video shared online showed the bodies of dozens of young men clad only in shorts, most of whom appeared to be teenagers, sprawled on the ground out in the open. Volunteers wearing gloves can be seen standing over the dead, while veiled women try to identify the bodies of their relatives. Voices shouting curses on those responsible can be heard in the background.\nAFP reported that another survivor, who asked not to be named, said he had made it out alive because he was near the cell’s entrance, where he could breathe better. “We were screaming for help,” he said, with detainees telling the guards that “people are dying one after the other. They did not believe us.”\nPresident Bola Ahmed Tinubu ordered an investigation into the deaths after his government earlier suspended some senior officials.\nBut protests over the deaths broke out on Thursday evening in Minna. On Friday dozens of young people, including miners and their relatives, gathered near the NSCDC’s office in the city. Police cordoned off the area and attempted to disperse the protesters by firing teargas.\nA Reuters witness saw security forces fire live rounds as protesters – some armed with sticks, machetes and traditional hunting rifles – called for justice. Some protesters tried to set fire to government buildings in the Tunga neighbourhood. “We are not thieves – we are simply seeking a way to make a living by mining,” Yusuf Auwal, a miner who joined the protesters, told Reuters. At least one body lay on the streets. Soldiers and police officers patrolled Minna to try to restore order.\nAs curfew began at 6pm local time on Friday, security forces appeared to have at least temporarily restored order to the streets of the city.\nThe NSCDC said the detainees had been held in raids on suspected illegal mines on 15 and 16 September in the Wushishi-Lukoto area west of Minna. Nigeria’s interior minister, Olubunmi Tunji-Ojo, ordered the immediate suspension of Niger state’s NSCDC commandant, Suberu Siyaka Aniviye, pending the outcome of an investigation.\nNiger state, which is Nigeria’s largest and is more than twice the size of Belgium, is rich in minerals and attracts thousands of artisanal miners, most lured by gold.\nPolice and the NSCDC did not initially provide a precise number of deaths but the state governor, Mohammed Umaru Bago, later confirmed 37 people had died.\n“It’s so sad, it’s so tragic,” he said, adding an inquiry into the deaths had already started work. He declared three days of mourning and postponed the start of campaigning for elections due in January. The men were buried on Thursday, according to Islamic tradition, without any forensic investigations.\nThe scramble for gold reserves dug up in illegal mines in Niger state is fuelling violence by criminal gangs, according to officials and experts. The gangs tax the miners and demand a cut from the extracted ore as a levy to allow them access to the pits.\nMost of the illegally mined gold is smuggled to the United Arab Emirates, where it is laundered into the global supply chain in Europe, the US, Asia and South Africa, according to a 2024 Swissaid report.\nApart from gold, the state of Niger sits on deposits of other minerals including tantalite, copper and lithium, which are in strong demand for use in electric vehicles and clean energy technology.\nAgence France-Presse and Reuters contributed to this report", "translation_ja": "", "vocab": [{"word": "paramilitary", "definition": "警察や軍隊ではなく、それに準ずる組織や武装勢力のこと。政府機関と協力して活動する半軍事的な団体を指します。"}, {"word": "ventilation", "definition": "換気や空気循環のこと。建物や閉鎖された空間に新鮮な空気を供給するシステムや過程を意味します。"}, {"word": "detainees", "definition": "逮捕または拘束されている人々のこと。法的手続き中に一時的に身柄を拘束されている者を指します。"}, {"word": "artisanal", "definition": "小規模で伝統的な手工業的な方法で行われることを意味します。ここでは個人や小グループによる採掘活動を指します。"}, {"word": "forensic", "definition": "法医学的な、または犯罪捜査に関連した調査や分析のこと。事件の証拠を科学的に検査することを意味します。"}, {"word": "launder", "definition": "違法な方法で得た資金や財産を合法的に見せかけて流通させることです。マネーロンダリングの過程を指します。"}]}, {"title_ja": "マラウイで英国人女性がランサム事件から警察に救出される", "title_en": "British Woman Rescued in Malawi After Police Shootout with Kidnappers", "summary_ja": "9月11日にブラントワイヤで誘拐された47歳の英国人監査役ヌスラット・オスマンが、マラウイ警察によって救出されました。銃撃戦により4人の容疑者が殺害され、警察の副検査官が負傷しましたが、状態は安定しています。マラウイでは誘拐事件は稀ですが、経済危機により強盗などの犯罪が増加しています。", "summary_en": "A 47-year-old British auditor, Nusrat Osman, was rescued by Malawian police after being kidnapped in Blantyre on September 11. Four alleged abductors were killed during a shootout, while a police deputy inspector general was injured but remains in stable condition. Kidnappings are rare in Malawi, which has recently seen increased petty crime amid economic hardship.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/18/british-woman-kidnapped-malawi-police-shootout", "state_media": false, "category": "政治", "full_text": "A British woman kidnapped in Malawi last week has been rescued by police after a shootout in which four of her alleged abductors were killed.\nNusrat Osman was abducted outside her home in the southern city of Blantyre on 11 September at about 12.30pm. Police had offered a reward of 30m Malawi kwacha (£12,950) for information leading to her rescue and the arrest of the perpetrators.\nMalawian police announced Osman’s rescue late on Thursday in a statement. “There was an exchange of fire between police and kidnappers, who were armed with [an] AK47 rifle and a Girsan Regard MC pistol. In the process, the criminals got shot and were taken to hospital where they succumbed to their injuries.” it read.\nA police officer, deputy inspector general Mlowoka Noel Kayira, was also shot during the operation. “He is currently receiving medical attention at the hospital and is in a stable condition,” police said.\nOsman, a 47-year-old auditor and mother of two, was safe and “not too shaken” after her ordeal, her brother Shobi Jiwa told the Sun, expressing his gratitude to Malawi’s police.\nJiwa reserved special thanks for Kayira. “He is the hero of our family. He’s the hero of the country,” he said. “He’s the hero of the world, actually, for putting his life at risk and taking a bullet into himself for my sister.”\nKidnappings are rare in Malawi, which has experienced a rise in pickpocketing and house burglaries by often armed men in recent years amid unstable, crisis-ridden economic conditions.\nThe landlocked southern African country is one of the world’s poorest nations, with a population of about 22 million and an average annual income of just $672, according to the World Bank.\nIn 2024, a country report by the US state department’s diplomatic security service said: “Kidnappings are not a widespread concern in Malawi, and there have been no recent high-profile incidents involving westerners.\n“Historically, expatriates have not been significant targets for kidnappings in the country. When kidnappings do occur, they often involve members of the Asian business community rather than foreign travellers or residents.”\nOsman, who is originally from Leicester, worked for a local audit firm and had lived in Malawi with her husband and children for several years. Before her rescue, her family said they had not had any news of her, including any contact from the kidnappers demanding a ransom.\nHer husband, Nazil Osman, told the local news outlet Nyasa Times: “I don’t know where she is or how she is. My wife is an auditor, and I have no issues with anyone.”\nHer brother told the Sun on Tuesday: “My sister has been missing for five days with no trace or call,” adding that the family could not think of a motive for her kidnapping.\nPolice did not say whether information received in response to the offered reward had led to Osman’s rescue, adding that investigations were ongoing and more details would be shared “in due course”.", "translation_ja": "", "vocab": [{"word": "perpetrators", "definition": "犯人、加害者を意味します。特に重大な犯罪や違反行為を行った人々を指し、公式な文脈で使用されます。"}, {"word": "ordeal", "definition": "つらい経験、苦難を意味します。身体的・精神的な苦しみを伴う困難な状況を指します。"}, {"word": "expatriates", "definition": "外国人駐在員、海外在住者を意味します。自国以外の国に住む人々を指す正式な用語です。"}, {"word": "landlocked", "definition": "陸に囲まれた、海に接していない国を意味します。地理的特性を説明する際に使用される技術用語です。"}, {"word": "ransom", "definition": "身代金、誘拐犯が被害者の解放と引き換えに要求する金銭を意味します。"}]}, {"title_ja": "フランス、テヘランの言語センター閉鎖後にイラン大使を召喚へ", "title_en": "France to Summon Iran Envoy After Language Centre Closure in Tehran", "summary_ja": "フランスはイラン当局がテヘランのフランス大使館傘下のフランス語センターを閉鎖した後、イラン大使を召喚し「適切な措置」を講じると発表した。イランはセンターが外交慣例に違反する違法行為を行い、エリート層の人員獲得に利用されていたと主張している。この閉鎖は、フランス大使館職員への暴行事件を含む以前のインシデント後の両国間の外交的緊張の深まりを示している。", "summary_en": "France announced it will summon Iran's ambassador and take \"appropriate measures\" after Iranian authorities closed a French-language centre affiliated with the French embassy in Tehran. Iran accused the centre of conducting illegal activities that violated diplomatic conventions, claiming it was used to identify and recruit elite figures. The closure marks another diplomatic tension between the two countries following previous incidents including an assault on French embassy staff.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/20/france-to-summon-iran-envoy-after-language-centre-closure-in-tehran?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "France to summon Iran envoy after language centre closure in Tehran\nIran accuses the French language centre of conducting ‘illegal acts that violated diplomatic conventions’.\nFrance will summon Iran’s ambassador and take “appropriate measures” after Iranian authorities closed a French-language centre linked to its embassy in Tehran, according to the French Foreign Ministry.\n“This new attack against France’s cultural presence in Iran, following the assault on two staff members of the French embassy last July, is unjustifiable and unacceptable,” Foreign Ministry spokesperson Pascal Confavreux said in a statement on Sunday.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Lebanon security talks in Paris to focus on post-UNIFIL alternatives\n- list 2 of 4Macron and Aoun discuss efforts to back Lebanon’s army, end Israeli attacks\n- list 3 of 4Russia seizes assets of French firms, summons UK envoy over Ukraine support\n- list 4 of 4France’s Macron and Canada’s Carney announce plans to build stronger ties\nIran announced on Sunday the closure of the centre it accused of conducting “illegal acts that violated diplomatic conventions”.\n“Based on the Tehran prosecutor’s office, the illegal centre affiliated with the French embassy in Tehran, which has operated for years under the guise of language instruction, was closed,” the Iranian judiciary’s Mizan news website said, referring to the French Language Centre (CLF).\nIt said the centre “abused its status as a language training facility” and sought to “identify and build networks among the country’s elite figures while facilitating their departure”.\nThe French Foreign Ministry said it would “take appropriate measures to respond” and would summon Iran’s ambassador in Paris at the request of French Foreign Minister Jean-Noel Barrot.\nRelations between Tehran and Paris have been strained in recent months.\nIn August, Iran’s Intelligence Ministry said it detained two French diplomats over alleged foreign interference during a national security investigation before handing them over to the French ambassador.", "translation_ja": "", "vocab": [{"word": "summon", "definition": "外交的抗議として、ある国の大使や外交官を自国に呼び出すこと。国家間の紛争や不満を表明する正式な手段として用いられる。"}, {"word": "envoy", "definition": "特定の使命を帯びて派遣される外交官または代表者のこと。大使よりも限定的な権限を持つ場合が多い。"}, {"word": "diplomatic conventions", "definition": "国家間の外交関係を規定する国際法的なルールと慣例の総称。大使館の治外法権や外交官の免責特権などが含まれる。"}, {"word": "affiliated", "definition": "公式に関連付けられている、または結びついている状態を示す。ここでは言語センターが大使館と正式な関係にあることを意味する。"}, {"word": "unjustifiable", "definition": "正当な理由や説明がない、または弁明の余地がない状態を指す。道徳的・法的に支持できないことを強調する表現。"}, {"word": "strainedrelations", "definition": "二国間の関係が緊張している状態。信頼が低下し、対立や不信感が存在する外交的状況を指す。"}]}, {"title_ja": "カタール首相、イランを含む湾岸地域の安全保障枠組みを要求", "title_en": "Qatar PM Urges Gulf Security Framework with Iran", "summary_ja": "カタールの首相シェイク・モハンマド・ビン・アブドゥルラハマン・アル・サーニ氏は、湾岸地域の将来の紛争を防ぐためにイランを含む地域安全保障枠組みを求めた。ニューヨークでのカタール経済フォーラムでの演説で、彼は良好な外交関係が地域の安定に不可欠であることを強調した。首相は、相互的な安全保障保証を確立しなければ、湾岸地域は以前の状態に戻ることはできないと述べた。", "summary_en": "Qatar's Prime Minister Sheikh Mohammed bin Abdulrahman Al Thani called for a regional security framework that includes Iran to prevent future conflicts in the Gulf. Speaking at the Qatar Economic Forum in New York, he emphasized that good diplomatic relations are essential for the region's stability. The PM stated that the Gulf region cannot return to its previous state without establishing mutual security guarantees.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/20/qatar-pm-urges-gulf-security-framework-with-iran?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Qatar PM urges Gulf security framework with Iran\nNewsFeed\nQatar PM urges Gulf security framework with Iran\nQatar’s Prime Minister tells Bloomberg, the Gulf won’t be the same as before the war, unless there’s a security framework ensuring no one is a threat to each other. Speaking at the Qatar Economic Forum in New York, Sheikh Mohammed bin Abdulrahman Al Thani says the region needs to have good relations.\nPublished On 20 Sep 2026", "translation_ja": "", "vocab": [{"word": "framework", "definition": "複数の要素を組織的に統合した体系や枠組みのこと。国際関係では、複数の国家間の協力や合意の基本構造を指す。"}, {"word": "security", "definition": "国家や地域の安全を保証する対策や状態のこと。政治や国際関係では、軍事的脅威からの保護や安定を意味する。"}, {"word": "stability", "definition": "政治的・経済的に安定した状態のこと。変動や混乱がなく、継続的で予測可能な状況を指す。"}, {"word": "diplomatic", "definition": "国家間の公式な関係や交渉に関する形容詞。外交的手段を用いた平和的な問題解決を意味する。"}, {"word": "mutual", "definition": "二者以上が同じ立場で相互に与え合う、または共通の関係にある状態。対称的で相互的な関係を表す。"}]}, {"title_ja": "アルゼンチン左派、ミレイ大統領の緊縮策に対し『怒りの行進』を開催", "title_en": "Argentina's Left Stages 'March of Anger' Against Milei's Austerity", "summary_ja": "左翼団体が主催するデモ行進がブエノスアイレスで開催され、ミレイ大統領の緊縮財政政策に反対する数千人の抗議者が参加した。デモ参加者は、政府の予算削減が労働者階級の家族の生活に悪影響を与えていると主張している。", "summary_en": "Thousands of left-wing protesters marched through Buenos Aires to oppose President Milei's austerity policies. The demonstrators argue that the government's spending cuts are negatively impacting working-class families and their livelihoods.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/9/20/argentinas-left-stages-march-of-anger-over-mileis-austerity-measures?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Argentina’s Left stages ‘March of Anger’ over Milei’s austerity measures\nNewsFeed\nArgentina’s Left stages ‘March of Anger’ over Milei’s austerity measures\nThousands of protesters took to the streets of Buenos Aires for the ‘March of Anger’, organised largely by left-wing groups opposing the Milei government’s austerity policies. Protesters say the cuts are hurting working families.\nPublished On 20 Sep 2026", "translation_ja": "", "vocab": [{"word": "austerity", "definition": "政府が支出を削減し、緊縮財政政策を実施すること。経済危機の際に通常採用される政策。"}, {"word": "austerity measures", "definition": "支出削減、税制改革、福祉削減などの具体的な緊縮政策。経済安定化を目的とした施策の総称。"}, {"word": "demonstration", "definition": "政治的主張や抗議を表現するための大規模な集会やデモ行進。社会運動の一形態。"}, {"word": "opposition", "definition": "政府や特定の政策に対する公式な反対立場。政治的な異議唱えの形態。"}, {"word": "policies", "definition": "政府や組織が採択する公式な行動方針または計画。意思決定の指針となる原則。"}, {"word": "working families", "definition": "給与や賃金によって生計を立てる労働者階級の家族。低中所得者世帯を指すことが多い。"}]}, {"title_ja": "左翼政党Die Linkeがベルリン選挙で勝利、トルコ系候補エラルプが市長候補トップに", "title_en": "Far-left Die Linke wins Berlin election with Elif Eralp as mayoral frontrunner", "summary_ja": "2026年9月のベルリン選挙で左翼政党Die Linkeが約25%の得票率で勝利し、トルコ系移民の娘で45歳のエリフ・エラルプが市長候補のトップになった。エラルプの選挙戦は住宅危機解決のための物議を醸す不動産没収と極右AfD党の台頭への対抗を中心とした。彼女は政府を形成するために中道左派SPDと緑の党との連立交渉を進める必要がある一方で、党の一部メンバーのイスラエル批判に関する批判に対処しなければならない。", "summary_en": "The far-left Die Linke party won Berlin's September 2026 election with approximately 25% of the vote, positioning lead candidate Elif Eralp, a 45-year-old daughter of Turkish migrants, as the top contender to become mayor. Eralp's campaign focused on solving the housing crisis through controversial flat expropriations and countering the rise of the far-right AfD party. She must now negotiate a coalition with the centre-left SPD and Greens to form a government, while addressing criticism over anti-Israeli statements from some party members.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/far-left-elif-eralp-wins-berlin-vote-on-anti-afd-pro-poor-campaign/article71489095.ece", "state_media": false, "category": "社会", "full_text": "The far-left Die Linke party won Berlin elections Sunday (September 20, 2026), according to exit polls, making its lead candidate Elif Eralp the top contender to become the next mayor of Germany's capital city.\nMs. Eralp, 45, and her pro-poor party have promised dramatic steps to solve Berlin's housing crisis and bring down rents, including with a controversial pledge to expropriate flats held by large corporate landlords.\nThe daughter of Turkish migrants, Eralp has also campaigned as being the best person to counter the rise of the far-right and anti-immigration Alternative for Germany (AfD) party.\n\"I believe it would indeed send a powerful signal if someone with a migration background were to become governing mayor of Berlin,\" she said on the eve of the vote.\nCelebrating on Sunday (September 20), she exclaimed: \"In our city, love and justice have triumphed over hatred.\"\nMs. Eralp — whose party wants to reduce social inequality and the power of big business — has been compared to Zohran Mamdani, the charismatic left-wing outsider who became mayor of New York.\n\"Naturally, the success of a democratic socialist in New York — the heartland of capitalism — is a major success,\" Ms. Eralp said on Friday (September 18), calling Mr. Mamdani \"a great role model\".\nThe election win by the Die Linke, at about 25% according to exit polls, was a historic first for Berlin and dealt a blow to the centre-right CDU of embattled Chancellor Friedrich Merz, which came second with about 20%.\nIn order to govern, however, Eralp must now convince other parties — likely the centre-left SPD and the Greens — to join her in a so-called \"red-red-green coalition\".\nWest Asia conflict\nHowever, the SPD's lead candidate Steffen Krach has already made clear he opposes the expropriation idea by Die Linke, a party which traces its roots in part to communist East Germany's ruling party.\nGermany's mainstream parties have many other differences with the hard-left party, especially on security policy, where it opposes military aid for Ukraine and advocates for Germany to leave NATO.\nDie Linke has also been criticised for anti-Israeli messages from some district-level figures — an especially sensitive issue in Germany, given its dark history of Nazi rule and the Holocaust.\nMs. Eralp had repeatedly emphasised her desire to support and foster Jewish life in Berlin.\nBut fierce criticism of Israel from some local branches of Die Linke, particularly in Berlin's Neukoelln neighbourhood that is home to many Arab and Muslim immigrants, have drawn negative headlines.\nA concert in August at a local Die Linke campaign event in Neukoelln provoked scandal after a performer advocated an \"intifada\" (uprising) and chanted \"Death to the IDF!\", the Israel Defense Forces.\nMs. Eralp distanced herself from the incident, but it drew fierce criticism from the Greens and the SPD — and once again prompted the press to question whether Die Linke is fit for governing.\nPath to power\nStill, the Greens during the campaign appeared to prefer backing a coalition with Die Linke over the other obvious possibility of joining with the conservative CDU.\nBut in the SPD, which has a history of close ties to organised labour and working-class voters, there are some dissenting voices.\nThe SPD chose to break with a left-wing coalition after the previous election in 2023 and is currently junior partners with the CDU.\nMs. Eralp now has a few days or weeks to c
