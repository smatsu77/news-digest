onvince her potential partners that she has her state branch under control and is suited to govern.\nMs. Erlap's parents, who were active in socialist politics and trade unions in Turkey, fled to Germany in 1980 following a military coup when the mother was eight months pregnant.\nMs. Eralp was born in Munich and went on to study law in Hamburg, going on to defend migrants' rights. She was hired as a staffer for Die Linke's faction in the German parliament in 2010, and moved to Berlin permanently not long after.\nShe lives in the trendy Kreuzberg district with her husband and two children — and is often quick to emphasise that, like most Berliners, they rent their flat and are not homeowners.\nPublished - September 21, 2026 04:00 am IST", "translation_ja": "", "vocab": [{"word": "expropriate", "definition": "政府または公共機関が私有財産を没収すること。本記事では、大企業の家主が保有するアパートを政府が取り上げることを意味します。"}, {"word": "charismatic", "definition": "個人的な魅力や説得力を持っている人物を表す形容詞。指導者や公人が多くの人々を惹きつけ影響を与える能力を指します。"}, {"word": "embattled", "definition": "困難な状況や批判に直面している状態を表す形容詞。政治的または社会的な圧力を受けている人物や組織に使われます。"}, {"word": "coalition", "definition": "共通の目標を達成するため複数の政党や組織が一時的に結成する同盟。議会制民主主義で政府を形成するために必要とされることが多い。"}, {"word": "intifada", "definition": "アラビア語源の言葉で、パレスチナ人によるイスラエル支配への抵抗または蜂起を意味します。歴史的に武装闘争を伴う民族運動を指します。"}, {"word": "dissenting", "definition": "主流の意見や決定に反対する立場を表す形容詞。グループ内で少数派の見解を持つ人々を描写する場合に使われます。"}, {"word": "faction", "definition": "大きな組織や政党内の小グループで、特定の目標や見解を共有するメンバーで構成されています。"}]}, {"title_ja": "イラン、フランス大使館関連のフランス語センターを閉鎖 違法活動の疑いで", "title_en": "Iran Closes French Language Centre Linked to Embassy Over Alleged Illegal Activities", "summary_ja": "イラン当局は日曜日、フランス大使館関連のフランス語センターを閉鎖し、違法活動と外交慣例違反を理由に非難した。センターは言語訓練施設としての地位を悪用してエリート層を特定し、イランからの出国を促進していたと指摘された。フランスはこの閉鎖を正当化不可能で受け入れられないと非難し、イランの大使を召喚し、対抗措置を講じると発表した。", "summary_en": "Iranian authorities shut down a French language centre affiliated with the French embassy on Sunday, accusing it of conducting illegal activities and violating diplomatic conventions. The centre was accused of abusing its status to identify and recruit elite figures while facilitating their departure from Iran. France condemned the closure as unjustifiable and announced plans to summon Iran's ambassador and take appropriate measures in response.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-shuts-language-centre-linked-to-french-embassy/article71489087.ece", "state_media": false, "category": "社会", "full_text": "Iranian authorities on Sunday (September 20, 2026) announced the closure of a French language centre associated with the embassy, accusing it of having undertaken \"illegal activities\", drawing a sharp response from Paris.\n\"Based on the Tehran prosecutor's office, the illegal centre affiliated with the French embassy in Tehran, which has operated for years under the guise of language instruction, was closed,\" the judiciary's Mizan news website said, referring to the French Language Centre (CLF).\nThe judiciary accused the centre of conducting \"illegal acts that violated diplomatic conventions\".\nIt accused the centre of having \"abused its status as a language training facility\" and of having sought to \"identify and build networks among the country's elite figures while facilitating their departure\".\nThe French Foreign Ministry said Sunday (September 20): \"This new attack on the French cultural presence in Iran... is unjustifiable and unacceptable.\"\nParis would \"take appropriate measures to respond\", it added.\nThe Ministry also said it would summon Iran's ambassador at the request of French Foreign Minister Jean-Noel Barrot.\nRelations between Tehran and Paris have been strained in recent months.\nLast month, France announced the expulsion of two Iranian diplomats in response to the brief arrest and banning of two French envoys to the Islamic republic.\nTehran had accused the two French diplomats of \"interference in Iran's internal affairs\".\nPublished - September 21, 2026 02:40 am IST", "translation_ja": "", "vocab": [{"word": "judiciary", "definition": "司法制度または司法部門を指す。この文脈では、イランの法務省または裁判制度全体を意味する。"}, {"word": "diplomatic conventions", "definition": "国家間の外交関係を規制する国際的な慣例と合意。外交官の特権や免除などの国際法に基づく規則。"}, {"word": "abused", "definition": "権力や立場を不正な目的のために誤用すること。本来の目的とは異なる不適切な方法で利用すること。"}, {"word": "unjustifiable", "definition": "正当な理由や根拠がなく、弁明の余地がない。正当化することができない。"}, {"word": "summon", "definition": "公式に誰かに出頭するよう要求すること。外交の文脈では、大使に対して正式な会談を要求すること。"}, {"word": "strained", "definition": "関係が緊張した、または悪化した状態。友好的でない、または困難な関係を示す。"}]}, {"title_ja": "インドの磁石戦略に測定フレームワークが必要", "title_en": "India's Magnet Strategy Needs Better Measurement Framework", "summary_ja": "グローバル製造リーダーを目指すインドの取り組みは高性能永久磁石に大きく依存しているが、同国は磁石バリューチェーン全体における戦略的技術依存がどこに存在するかを追跡する包括的なフレームワークを欠いている。インドが重要鉱物とレアアース元素の確保に注力してきた一方で、真の課題は採鉱から完成品までの複雑な生産段階を理解・把握することである。統合テクノ経済マッピングフレームワークが、能力ギャップを特定し国内産業投資を最適化するために不可欠である。", "summary_en": "India's push to become a global manufacturing leader relies heavily on high-performance permanent magnets, but the country lacks a comprehensive framework to track where strategic technological dependence exists in the magnet value chain. While India has focused on securing critical mineral resources and rare earth elements, the real challenge lies in understanding and mapping the complex production stages from mining to finished products. An Integrated Techno-Economic Mapping framework is essential to identify capability gaps and optimize domestic industrial investment.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/op-ed/missing-measure-in-indias-magnet-mission/article71488862.ece", "state_media": false, "category": "経済", "full_text": "Most Indians know the parable of several blind men trying to describe an elephant. One touches its trunk and believes it is a snake. Another feels its leg and insists it is a pillar. None is entirely wrong, yet none sees the whole animal.\nIndia’s strategy for advancing its cutting-edge technologies, aimed at becoming a global manufacturing leader, carries the risk of making a similar mistake. From EV motors and semiconductor fabrication facilities to precision manufacturing machineries, at the heart of each lies an unassuming component: the high-performance permanent magnet. They serve as the silent operating system of industrial acceleration.\nMagnets are not all the same. Ferrite, Alnico and Samarium-Cobalt magnets continue to serve important industrial applications. Yet Neodymium-Iron-Boron (NdFeB) magnets have become the backbone of energy transition and advanced manufacturing because no other commercially available permanent magnet combines comparable magnetic strength with such a high power-to-weight ratio. Recognising its importance, India has begun strengthening its critical minerals and rare earth element strategy through initiatives such as the National Critical Mineral Mission, overseas mineral acquisitions, expanded geological exploration, and PLI schemes.\nHowever, China’s tight export controls on rare-earth magnets and materials in April 2025 not only revealed the deep-seated vulnerabilities in global industrial value chains, but also the limits of our understanding. For India, the primary vulnerability does not stem from a shortage of critical minerals; rather, it lies in the absence of a comprehensive framework to pinpoint where strategic technological dependence is cultivated, accumulated and propagated throughout the permanent magnet value chain.\nThe journey of a magnet\nConsider a simple example. India’s Annual Survey of Industries estimates the domestic permanent magnet market at around ₹750 crore. Yet international trade statistics indicate import values several times larger than that entire reported market. The gap may reflect differences in statistical coverage, industrial classification or supply-chain accounting. Whatever the explanation, policymakers face a troubling reality: they cannot confidently explain where all these magnets enter the economy or how they move through it. In other words, parts of India’s permanent magnet economy appear to exist without being fully visible in statistics.\nAlso read: Reliance, Vedanta, Adani join India’s drive to cut China rare earth dependence\nUnlike other products, permanent magnets pass through a long technological journey. Geological exploration leads to mining. Mining feeds mineral processing. Processing enables chemical separation. Separation produces oxides, which are refined into metals, transformed into alloys, engineered into magnetic materials, and finally manufactured into finished magnets. Each stage demands different scientific knowledge, industrial capability and technological maturity. This is why discussions on critical minerals frequently miss the real point. The strategic question is not simply whether India possesses rare-earth resources or whether imports from China can be reduced. The real policy challenge is understanding what happens in between.\nAlthough India has developed capabilities across several stages of permanent magnet manufacturing, the country still lacks a systematic way of identifying where those capabilities are globally competitive, where critical gaps persist, and how dependence accumulates across production stages. India’s statistical system provides only a partial picture of what is mined, imported, and manufactured.\nOne way to bridge this gap is through an Integrated Techno-Economic Mapping (ITEM) framework, which presently is a missing piece in India’s industrial policy toolkit. Such a framework brings together information on engineering and economic measurement to show how a permanent magnet is built, from minerals in the ground to the finished products that power advanced manufacturing. More importantly, it would identify where industrial capability should be built, where technological partnerships become essential, and where domestic investment would yield the greatest strategic return. A country may secure mineral resources yet remain dependent if it lacks processing and manufacturing capabilities.\nBridging this measurement gap is not an academic exercise; it is an industrial imperative.\nSuvajit Banerjee is a Fellow at the National Council of Applied Economic Research (NCAER), New Delhi, in the research vertical of Computable General Equilibrium Modelling and Policy Analysis. Sovini Mondal is a Research Analyst at the NCAER in the research vertical of Computable General Equilibrium Modelling and Policy Analysis. Sanjib Pohit is a professor and Thematic Lead at the NCAER in the research vertical of Computable General Equilibrium Modelling and policy analysis. Views are personal.\nPublished - September 21", "translation_ja": "", "vocab": [{"word": "vulnerability", "definition": "弱点や脆弱性のこと。特に、攻撃や悪影響を受けやすい状態を指します。このテキストでは、グローバルサプライチェーンの脆弱性について述べられています。"}, {"word": "propagated", "definition": "広がる、伝播する、増殖させるという意味です。情報や技術などが各段階で蓄積・拡散される過程を表しています。"}, {"word": "strategic dependence", "definition": "戦略的依存のこと。他国や企業に頼らざるを得ない重要な産業領域での依存関係を意味します。"}, {"word": "accumulates", "definition": "蓄積される、たまっていくという意味です。このテキストではサプライチェーンの各段階で技術依存がどのように蓄積されるかを説明しています。"}, {"word": "imperative", "definition": "必須の、避けられない義務的な事柄を指します。このテキストの結論では、測定ギャップを埋めることが産業政策上の必須課題であることを強調しています。"}, {"word": "technological maturity", "definition": "技術的成熟度のこと。特定の技術や産業が発展段階に達した状態を示します。バリューチェーンの各段階で異なる技術的成熟度が要求されることを表しています。"}, {"word": "systematically", "definition": "体系的に、組織立てて行われることを意味します。インドが永久磁石製造の能力を体系的に評価・把握することの重要性が述べられています。"}]}, {"title_ja": "分離独立国民投票が迫る中、アルバータ州の保守派下院議員が職務放棄と批判される", "title_en": "Alberta's Conservative MPs accused of inaction as separation referendum approaches", "summary_ja": "州の分離独立国民投票が近づく中、カナダの連邦主義者たちがアルバータ州の保守派下院議員が議論から欠席していると批判している。議員たちは憲法問題についてより積極的な姿勢を取るよう圧力を受けている。この動きはアルバータ州における連邦と州の利益の間で高まる緊張を浮き彫りにしている。", "summary_en": "Federalists have criticized Alberta's Conservative Members of Parliament for their absence from the debate as the province moves toward a separation refe  Jinping signed 37 bilateral agreements during Xi's visit to Brasília, strengthening economic and diplomatic ties between the two countries. However, Brazil notably declined to join China's Belt and Road Initiative despite the extensive cooperation framework agreed upon.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMizwFBVV95cUxPOWw3MVRSY3hFbEgyT1A1OFNaNXA4d05OVlV3ZGtPVUx5VDB1N2VMeXB1S0U0Q1BzdlppNTN0ZF9oR0ZqSmhnMlp2ellMVFpyS3ZISnlfNlNQNzg2Z1BnQzBUUUNVdDdUdVRwTzgxbGtFcVg5Yzg4S2pjNDFBUU91YU5jQTR6MkFfVkdWbE04Mno2VTAtT0FWLVNVQmZuNVpzWTI4WWV5eDVQRDM4MENndF9KM0NUbWlINlc0eDVHdXM3Q09HTExRTGZiblZGVk3SAd4BQVVfeXFMTVhOaS00d3dBNFlTZkRiOFVPWURfTWloN2NBWDk1LUNiVXNfRmRjbkFJaXBRc3BXWVBFdVk1OUJoSk95N2pNSWZYYzI3dnhpa093ZkxNWGVEN2ltTkNYc1FKSUZCTl9xYU5yVVVJV2tjS0lVbWxWdEpQWTUwYkJsMXBaT0xBX0pWRVdzaEdQcndtQVFMeXNnRFgwY24xdktQTzNYR1I4S3VRYUtGNzZPNjdxUlNPSUstQUZrcUdPZGhqcHhuN25VcjgyZEd3NVU2MEtkTlhDRTJPd3M2VHFn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "UBAの最高経営責任者がナイジェリア・ブラジル間の貿易投資関係の強化を提唱", "title_en": "UBA Chief Advocates Stronger Nigeria-Brazil Trade and Investment Ties", "summary_ja": "ナイジェリアの統一銀行（UBA）の最高経営責任者オリバー・アラウバ氏は、ブラジルの建国記念日の式典でナイジェリアとブラジル間の経済関係の深化を呼びかけました。2025年の二国間貿易額が24億ドルであることを指摘し、農業、製造業、エネルギー、技術、創造産業における機会を特定しました。アラウバ氏はUBAのパンアフリカ的な存在と両国間の投資パートナーシップを促進する能力を強調しました。", "summary_en": "Oliver Alawuba, Group Managing Director of United Bank for Africa, called for deepened economic relations between Nigeria and Brazil during Brazil's National Day celebration in Abuja. He highlighted bilateral trade worth US$2.4 billion in 2025 and identified opportunities in agriculture, manufacturing, energy, technology, and creative industries. Alawuba emphasized UBA's pan-African presence and capacity to facilitate investment partnerships between the two nations.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/911129-alawuba-seeks-to-deepen-nigeria-brazil-trade-investment-ties.html", "state_media": false, "category": "経済", "full_text": "The Group Managing Director/Chief Executive, United Bank for Africa (UBA) Plc, Oliver Alawuba, has advocated for stronger trade and investment relations between Nigeria and Brazil, highlighting numerous collaboration opportunities in agriculture, manufacturing, energy, technology and the creative industries.\nAlawuba made this call in Abuja on Wednesday, September 16, 2026, during the celebration of Brazil’s National Day, hosted by the Embassy of the Federative Republic of Brazil in Nigeria.\nWhile congratulating the Government and people of Brazil, the UBA boss noted that the longstanding relationship between both countries extends beyond diplomacy to shared history, cultural heritage and a strong connection between their people.\nHe recalled Brazil’s representation at Nigeria’s independence celebrations in 1960, describing the gesture as a cherished foundation of the relationship between the two countries and also highlighted the enduring influence of Afro-Brazilian heritage in Nigeria, particularly in Lagos Aguda communities, where Brazilian architectural, culinary and cultural traditions continue to thrive.\nAccording to Alawuba, the shared entrepreneurial spirit, cultural diversity, love of music and passion for football between Nigerians and Brazilians continues to provide a strong foundation for expanding commercial ties.\nThe UBA boss, noted that bilateral trade in goods between Nigeria and Brazil was approximately US$2.4 billion in 2025, stressing that there remained considerable room to deepen economic exchange and unlock new opportunities for businesses in both countries.\nHe also pointed to the US$1.1 billion Green Imperative Agricultural Mechanization Programme as an example of the opportunities that could emerge from combining Brazilian expertise and equipment with Nigerian enterprise to improve productivity, strengthen food security and create jobs.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nSpeaking on UBA’s pan-African reach, he explained that UBA’s presence in 20 African countries as well as the United States, United Kingdom, United Arab Emirates and France, positions the bank to effectively support trade and investment between Africa and Brazil through its reach, local knowledge and financial capabilities.\nWhile appreciating the relationship between the bank and the Embassy of Brazil, which he said had been built on confidence, trust and mutual respect since 2019, he reaffirmed the bank’s commitment to strengthening the partnership through focused service and closer collaboration.\nAlawuba also used the opportunity to commend the warmth of the Brazilian people, the richness of its culture and the promise of its future, expressing optimism that the longstanding friendship between Nigeria and Brazil would translate into shared economic prosperity.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "bilateral", "definition": "二国間の、両国相互の関係を表す。外交や貿易などの文脈で、二つの国家間の協定や関係を指す際に使用される。"}, {"word": "entrepreneurial", "definition": "起業家精神を持つ、企業家的な。ビジネス展開や新規事業創造への意欲や能力に関連する形容詞。"}, {"word": "mechanization", "definition": "機械化、機械による自動化プロセス。農業や製造業で手作業を機械に置き換えることを意味する。"}, {"word": "enduring", "definition": "長く続く、永続的な。時間経過しても変わらない性質や状態を表す。"}, {"word": "reaffirm", "definition": "再度確認する、改めて表明する。以前の約束や姿勢を再び強く主張する際に使用される。"}, {"word": "pan-African", "definition": "アフリカ全大陸にわたる、全アフリカ的な。複数のアフリカ諸国に関わる事業や組織を表す。"}]}, {"title_ja": "ナイジェリア上院議長アクパビオ、パドレ・ピオへの祈りで妻の奇跡的な回復を報告", "title_en": "Senate President Akpabio Credits Padre Pio for Wife's Miraculous Recovery from Six-Month Coma", "summary_ja": "ナイジェリアのゴッドスウィル・アクパビオ上院議長は、ドイツの病院で6ヶ月間昏睡状態にあった妻が、イタリア人カトリック司祭パドレ・ピオへの祈りにより意識を取り戻したと明かした。アクパビオはイタリアの聖地を訪問して感謝の祈りを捧げ、ナイジェリアのセキュリティ問題への神の介入を求めた。", "summary_en": "Nigeria's Senate President Godswill Akpabio has revealed that his wife regained consciousness after six months in a German hospital coma following failed surgery, which he attributes to prayers invoking Italian Catholic priest Padre Pio. Akpabio visited Padre Pio's shrine in Italy to offer thanksgiving and seek divine intervention for Nigeria's security challenges, stating his family has honored the priest by naming their son after him and establishing a football academy.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/911126-my-wife-miraculously-woke-up-after-six-months-in-coma-akpabio.html", "state_media": false, "category": "政治", "full_text": "Unoma Akpabio, wife of Nigeria’s Senate President, Godswill Akpabio, was in a coma for six months at a German hospital before she was miraculously healed through the intercession of an Italian Catholic priest, Pio Pietrelcina, widely known as Padre Pio.\nMr Akpabio, who disclosed this in a statement issued by one of his media aides, Jackson Udom, on Sunday, said that at the time his wife underwent a failed surgery and was declared 98 per cent dead. At the same time, in a coma, he cried to Mary, the mother of Jesus Christ and the Catholic priest for divine healing.\nThe statement was issued to announce the Senate president’s visit to the prayer ground of St. Padre Pio in San Giovanni Rotondo, Italy, to offer prayers to God for a peaceful 2027 election and an end to banditry and terrorism in Nigeria.\nMr Akpabio explained that at the time his wife was in a coma following the failed surgery, he used the photograph of the priest to make the sign of the cross on her and cried for divine intervention instead of losing hope in her recovery.\nHe said his wife miraculously woke up after the prayer and that the hospital could not understand how she recovered from the coma, which almost took her life.\nMr Akpabio did not indicate when the incident happened or the nature of his wife’s ailment.\n“My wife was in a coma for six months in a hospital in Germany. She was 98 per cent dead. I used the picture of Pio to make a sign of the cross on her, instead of turning off the life- support machine she was on. She had an operation that went wrong. I cried to Mother Mary, the mother of Jesus Christ, and called on Pio to intercede.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“Miraculously, she woke up. That hospital, to this day, has yet to understand what happened. As someone who has experienced the powers in where I am standing, I can understand it more than anyone else”, he said.\nHe also said that after Mrs Akpabio was discharged from the hospital, it took her three months to regain her memory and recognise him and their children.\n“This is my 10th time here. When my wife was finally discharged from the hospital, she waited for three months before she could remember my name and those of the children. We are here today to give thanks to God and to thank Pio for always interceding for us,” he said.\nMr Akpabio said the experience prompted his family to honour Padre Pio by giving their son the priest’s name as his baptismal name.\nHe also said the family established a football academy in the priest’s honour to provide training and scholarships to underprivileged children.\n“We honoured PIO by giving our son the baptismal name, Pio. We also established a large academy, which we called the PIO Football Academy, where we train and offer scholarships to children from low-income families, from age 9 up to the university level, all in memory of PIO. May his soul rest in perfect peace,” he stated.\nPrayer for Nigeria\nExplaining the purpose of his visit to the prayer ground, Mr Akpabio told St Padre PIO TV/Radio in Italy that his delegation had travelled to the site to seek divine intervention for Nigeria’s security challenges.\nREAD ALSO: 2027: INEC clears Akpabio, Uzodimma, Oshiomhole, 1,300 others for Senate race (FULL LIST)\n“We are all from Nigeria. We came to offer prayers and get blessings from God for ourselves, families and our dear country that is currently being ravaged by banditry and terrorism.\n“We are here on this prayer ground, and we are going home fulfilled, that we were able to touch this Holy ground, drop our intentions which he will take to God on our behalf,” he said.\nMr Akpabio said he was impressed by the way the site had been maintained, describing it as a holy ground.\n“I am very impressed that the place has been well kept. This is a holy ground. Some people who are here might not even understand the significance of this ground, but those of us who are adherents and followers of Pio believe in his intercessions,” he said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "intercession", "definition": "特定の人のために神に願う行為または仲介のこと。宗教的な文脈で、聖人や神聖な存在が人間と神の間で取り次ぎをすることを指す。"}, {"word": "coma", "definition": "医学用語で、患者が意識を失い反応しない状態のこと。通常は脳損傷や重篤な病気によって引き起こされる。"}, {"word": "divine intervention", "definition": "神または超自然的な力による助けや介入のこと。奇跡的な出来事や予期しない救済を表す宗教的な表現である。"}, {"word": "discharge", "definition": "病院から患者が退院することを意味する医学用語。また、一般的には職務から解放されることも意味する。"}, {"word": "adheres", "definition": "特定の信念、宗教、または原則に従うこと。強い信念を持って支持し続ける行為を表す。"}]}, {"title_ja": "ICC判決受け、EFCC がアティク前副大統領やマラミ元司法長官を調査", "title_en": "EFCC Investigates Atiku, Malami Over ICC Ruling on Mambilla Power Deal", "summary_ja": "ナイジェリアの反汚職機関EFCCは、国際商業会議所（ICC）仲裁廷がサンライズパワー社による6億8000万ドルの請求を棄却した判決を受けて、前副大統領アティク・アブバカルと元司法長官アブバカル・マラミを含む著名な政治家の調査を開始した。仲裁廷は係争中のマンビラ水力発電プロジェクト（3,960MW）における汚職行為と不適切な関係の証拠を発見し、同社にナイジェリアの法務費1180万ドルの返金を命じた。", "summary_en": "Nigeria's anti-corruption agency EFCC has established a task force to investigate prominent politicians including former Vice President Atiku Abubakar and ex-Attorney-General Abubakar Malami following an ICC tribunal ruling that rejected a $680 million claim by Sunrise Power Company. The tribunal found evidence of corrupt dealings and inappropriate relationships in the disputed 3,960 MW Mambilla Hydroelectric Power Project, directing the company to refund Nigeria's $11.8 million in legal fees.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/911121-exclusive-efcc-sets-up-team-to-investigate-atiku-malami-others-named-in-icc-ruling-on-mambilla-deal.html", "state_media": false, "category": "政治", "full_text": "The Economic and Financial Crimes Commission (EFCC) has set up a team to investigate individuals named in alleged shady deals in the Mambilla Power Project, involving Leno Adesanya, the promoter of Sunrise Power and Transmission Company Ltd (Sunrise), PREMIUM TIMES can report.\nInsiders familiar with the matter told PREMIUM TIMES on Sunday that the new team is being supervised by the Chairman of the commission, Olanipekun Olukoyede, a development PREMIUM TIMES’ sources described as a confirmation of the significance of the task.\nThe move follows an award issued in favour of Nigeria on Thursday by an International Arbitration Tribunal under the auspices of the International Chamber of Commerce (ICC) in Paris, which rejected the claims in the arbitration instituted by Sunrise Power and Transmission Company Ltd (Sunrise).\nThe company had made a claim against the Federal Republic of Nigeria, demanding $680 million as a settlement sum and interest in respect of another arbitration in which it is claiming over $2.7 billion in compensation and interest.\nThe claim relates to disputes associated with the development of the 3,960 MW Mambila Hydroelectric Power Project in Taraba State.\nThe tribunal, in its verdict on Thursday, directed Sunrise and its promoter to refund Nigeria’s legal fees of $11.8 million. It also rejected Sunrise’s claim for an order that Nigeria should pay the company $400 million in satisfaction of the settlement sum of $200 million and the default sum of $200 million.\nThe tribunal insisted that Mr Adesanya, the promoter of Sunrise, is bound by the arbitration agreement with Nigeria pursuant to the settlement agreement, adding that it has jurisdiction over Nigeria’s counterclaim against him and his firm.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nIn his reaction Thursday evening, President Bola Tinubu said the tribunal award affirms the Nigerian State’s determination not to succumb to predatory and exploitative claims by corrupt local and international entities and their enablers and funders.\nAtiku, Malami, others named\nPREMIUM TIMES’ review of the tribunal’s award showed that many Nigerian politicians and individuals who held public offices were named as associates or officials who had dealings with Mr Adesanya, some in circumstances the tribunal considered shady, corrupt and questionable.\nThe officials include Atiku Abubakar, his then-wife Jennifer Douglas, Abubakar Malami, Olu Agunloye, Sambo Dasuki, his son Abubakar Dasuki, Abdullahi Yola, and Dere Awosika.\nMr Malami, a former Attorney-General of the Federation (AGF), was severely criticised by the tribunal for acting against Nigeria’s national interest, maintaining an “inappropriate relationship” with Mr Adesanya, and entering into a corrupt deal. Already, Mr Malami is facing trial after the EFCC accused him, his wife, and son of conspiring to conceal, disguise and retain about N8.7 billion proceeds of unlawful activities.\nAtiku, former vice president of Nigeria, was named by the tribunal in its review of a $500,000 payment made by Mr Adesanya on 30 January 2003 from the Swiss bank account of his offshore company, China Castle Investments Ltd, to a US bank account belonging to Ms Douglas, Atiku’s ex-wife.\nThe payment was made less than four months before the Mambilla BOT contract was purportedly awarded to Sunrise by then Minister of Power and Steel, Olu Agunloye. Mr Adesanya told the tribunal that the money was part of a foreign-exchange transaction carried out for Atiku through his bureau de change business.\nBut the tribunal said that the explanation was not supported by documentary evidence. It said Mr Adesanya did not produce records showing the underlying naira payment, the exchange rate applied, instructions from Atiku or his aides, correspondence concerning the transaction or documentation establishing its commercial purpose.\nThe tribunal also noted that neither Atiku nor Ms Douglas provided a witness statement or declaration supporting the explanation. The tribunal said Mr Adesanya’s relationship with Atiku, his efforts to secure the Mambilla project for Sunrise and the timing of the payment were relevant to its assessment.\nIt noted that Atiku had led a Nigerian government delegation to Beijing in July 2002, which included Mr Adesanya, during which the Nigerian government and the Chinese state-owned NCPEC signed a memorandum of understanding covering, among other projects, the Mambilla project.\nAgainst that background, the tribunal said the circumstances raised “significant red flags” concerning the alleged payment, possible use of Atiku’s influence and the subsequent award of the contract.\nOthers\nMr Agunloye, a former minister of Power and Steel, was tied to payments he claimed he received as part of “medical expenses”. He is already being tried on seven counts of forgery, receiving gratification, and disobedience ", "translation_ja": "", "vocab": [{"word": "predatory", "definition": "不公正または搾取的な性質を持つ。ここでは、不正な利益を狙った悪質な請求を指します。"}, {"word": "counterclaim", "definition": "相手方の請求に対して提起される反対請求。法的紛争において被告側が原告に対して行う請求のことです。"}, {"word": "arbitration", "definition": "裁判所を通さず第三者の仲裁人が紛争を解決する方法。国際商取引紛争で一般的に用いられます。"}, {"word": "gratification", "definition": "贈賄や報酬として与えられる金品または利益。腐敗行為の証拠として法的に問題とされます。"}, {"word": "memorandum of understanding", "definition": "複数の当事者間の基本的な合意や意図を示す正式な文書。完全な契約ではなく、原則的な同意を示すものです。"}, {"word": "offshore", "definition": "外国に設立された企業や口座。税制上の利点や機密性を目的として設立されることが多いです。"}]}, {"title_ja": "ミャンマー外交官、ニューヨークの国連職を手放さず", "title_en": "Myanmar Diplomat Refuses to Relinquish UN Post in New York", "summary_ja": "ミャンマーの外交官ウ・チョウ・モエ・トゥンは、5年以上にわたって国連の職を保持し続けている。彼はニューヨークのアッパーイーストサイドにあるタウンハウスに住みながら、辞職の圧力に抵抗している。", "summary_en": "U Kyaw Moe Tun, a diplomat from Myanmar, has maintained his position at the United Nations for over five years despite pressure to step down. He continues to occupy an Upper East Side townhouse in New York City as he holds onto his official post.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/20/world/asia/myanmar-mission-un-envoy.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの観光地「ヘロデの池」がパレスチナの農地の水を枯渇させている", "title_en": "Israeli Tourist Site 'Herod's Pool' Drains Palestinian Farmland", "summary_ja": "イスラエルの議員らは、今夏パレスチナ人が所有する農地から転用された水で再充填されたヨルダン川西岸の古代貯水池への訪問を推進している。ヘロデの池として知られるこの貯水池は、パレスチナの農業への影響への懸念にもかかわらず、観光地となっている。この水の転用は、占領地での資源配分をめぐる継続的な紛争を浮き彫りにしている。", "summary_en": "Israeli lawmakers have promoted visits to an ancient reservoir in the West Bank that was refilled this summer using water diverted from Palestinian-owned farms. The reservoir, known as Herod's Pool, has become a tourist attraction despite concerns about its impact on Palestinian agriculture. The water diversion highlights ongoing disputes over resource allocation in the occupied territory.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/20/world/middleeast/west-bank-pool-palestinians-israelis-water.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハイチ大統領モイーズ暗殺事件、さらに30人を逮捕", "title_en": "Thirty More Arrested in Connection with 2021 Assassination of Haiti's President Jovenel Moïse", "summary_ja": "2021年のハイチのジョヴネル・モイーズ大統領暗殺事件に関連して、さらに30人の容疑者が逮捕されました。逮捕者の中には、ハイチからマイアミに身柄引き渡しされた18人の男が含まれています。今回の逮捕は、注目度の高いこの事件の捜査における大きな進展を示しています。", "summary_en": "Thirty additional suspects have been arrested in connection with the 2021 assassination of Haitian President Jovenel Moïse. Among those arrested are 18 men who were extradited from Haiti to Miami. The arrests represent a significant development in the ongoing investigation into the high-profile killing.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/20/world/americas/haiti-assassination-trial-moise.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、軍事ゾーン開放 ガザ北部へのパレスチナ人帰還が再開", "title_en": "Palestinians Return to Northern Gaza After Israel Opens Military Corridor", "summary_ja": "イスラエルがガザを二分する軍事ゾーンの通過を許可し、避難していたパレスチナ人が北部への帰還を開始した。この決定は、人質解放をめぐる膠着状態の打開に続くものである。数千人のパレスチナ人が徒歩でガザ北部への帰還を開始している。", "summary_en": "Israel has allowed displaced Palestinians to cross a military zone that divides Gaza following the resolution of a hostage release deadlock. The movement marks a significant shift in restrictions on civilian movement within the enclave. Thousands of Palestinians have begun streaming back to northern Gaza on foot.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Real Estate Crisis", "summary_ja": "中国最大級の不動産開発企業であるバンケが大幅な財務赤字を報告し、同国の不動産危機の拡大に関する懸念が高まっています。悪化する状況により、中国政府がセクターの安定化と経済的被害の防止のために介入するかどうかについての疑問が生じています。", "summary_en": "Vanke, one of China's largest property developers, has reported a significant financial loss, raising concerns about the widening real estate crisis in the country. The deteriorating situation has prompted questions about whether the Chinese government will intervene to stabilize the sector and prevent further economic damage.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From Oct. 7 Attack", "summary_ja": "イスラエルの医療当局者によると、最近解放されたイスラエル人人質の一部は、10月7日の攻撃による破片が体内に埋め込まれたままであるという。複数の女性人質は孤立した状態で長期間拘束され、約8ヶ月間トンネルに閉じ込められていた。この発見は、拘禁中に人質が被った深刻な身体的外傷を浮き彫りにしている。", "summary_en": "Some of the recently freed Israeli hostages still have shrapnel embedded in their bodies from the October 7 attack, according to an Israeli medical official. Several women hostages were held in isolation for extended periods and spent approximately eight months confined in tunnels. The discovery highlights the severe physical trauma endured by hostages during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ、グリーンランド領有権要求を撤回も外交的損害は残存", "title_en": "Trump drops Greenland ownership demands; damage to Denmark ties remains", "summary_ja": "ドナルド・トランプ大統領はグリーンランド買収の要求を撤回し、デンマークおよびグリーンランドとの改正防衛協定で決着した。しかし専門家は、併合の脅威がすでに米国とデンマーク間の外交関係に重大な損害をもたらしたと指摘している。合意は従来の取り決めからの限定的な改善にすぎない。", "summary_en": "Donald Trump has abandoned his demands to acquire Greenland, instead settling for a revised defence pact with Denmark and Greenland. However, experts warn that the annexation threats have already caused significant diplomatic harm to US-Denmark relations. The agreement represents only a modest improvement over previous arrangements.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/19/donald-trump-drops-demands-to-own-greenland-but-the-harm-has-been-done", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI安全性の向上で合意することは不可能かもしれない", "title_en": "Agreeing to make AI safer may be impossible", "summary_ja": "AI システムをより安全にすることは技術的には実現可能だが、米国の AI ラボと政府当局の間、そして米国と中国の間に大きな意見の相違が存在する。これらの対立は AI 安全基準に関する国際的な協定の確立を複雑にしている。合意の欠如は、先進的な人工知能システムのリスク管理に対する統一されたアプローチを脅かしている。", "summary_en": "While making AI systems safer is technically feasible, significant disagreements persist between American AI laboratories and government authorities, as well as between the United States and China. These divisions complicate efforts to establish international agreements on AI safety standards. The lack of consensus threatens unified approaches to managing risks from advanced artificial intelligence systems.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/15/agreeing-to-make-ai-safer-may-be-impossible", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国は米国後の世界に対する準備ができていない", "title_en": "China Is Not Ready for a Post-American World", "summary_ja": "エコノミスト誌は、ドナルド・トランプ大統領のイラン政策の失敗を含む外交的失策が、中国の世界的影響力拡大の予期しない機会を生み出していると主張しています。しかし、中国は現在、アメリカの衰退の優位性を完全に活用するための制度的能力とソフトパワーに欠けています。米国の戦略的過ちのタイミングは、北京が国際問題で支配的な役割を担うには早すぎるかもしれません。", "summary_en": "The Economist argues that Donald Trump's foreign policy failures, particularly regarding Iran, have created unexpected opportunities for China to expand its global influence. However, China lacks the institutional capacity and soft power to fully capitalize on American decline at this moment. The timing of American strategic missteps may have come too early for Beijing to assume a dominant role in international affairs.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/15/china-is-not-ready-for-a-post-american-world", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ニューヨークとパリの市長が住宅と気候対策で協力を協議", "title_en": "New York and Paris Mayors Meet to Address Housing and Climate Goals", "summary_ja": "ニューヨークのゾーラン・マムダニ市長とパリのエマニュエル・グレゴワール市長がニューヨークで会談した。両市長は住宅アクセスと環境政策における共通の課題について議論した。この会談は、進歩的な都市政策における主要都市間の連携強化を示すものである。", "summary_en": "Socialist mayors Zohran Mamdani of New York and Emmanuel Grégoire of Paris met in New York to discuss shared policy priorities. The two leaders focused on housing accessibility and environmental solutions as key areas for collaboration. The meeting highlights growing coordination between major cities on progressive urban policy initiatives.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/09/20/new-york-and-paris-mayors-mamdani-and-gregoire-meet-to-advocate-for-housing-access-and-climate-solutions_6757742_5.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツ極右AfD、また別の州選挙で勝利を収める", "title_en": "Germany's Far-Right AfD Wins Another State Election with 37%", "summary_ja": "極右政党ドイツのための選択肢（AfD）は、北東部州メクレンブルク・フォアポンメルン州で37%以上の得票率を確保しました。フリードリヒ・メルツ首相の中道右派CDUは4.9%の得票率にとどまり、同党にとって歴史的な低水準となっています。", "summary_en": "The far-right Alternative for Germany (AfD) party won over 37% of votes in the northeastern state of Mecklenburg-Western Pomerania. Chancellor Friedrich Merz's center-right CDU failed to enter parliament with only 4.9% of the vote, marking a historic low for the party.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/20/germans-vote-in-state-elections-threatening-fresh-blow-to-merz_6757733_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AI の人類への実存的脅威にどの程度懸念すべきか？", "title_en": "Should We Fear AI's Existential Threat to Humanity?", "summary_ja": "人工知能が人類の絶滅をもたらす可能性についての警告と、そうした懸念は根拠がないと考える科学者たちの間で議論が白熱している。高度な AI が人類にもたらすリスクについて、科学界内で意見が分かれている。", "summary_en": "Scientists are divided over whether artificial intelligence poses an existential risk to humanity. Some experts warn that advanced AI could lead to human extinction, while others dismiss these concerns as unfounded. The debate continues to intensify within the scientific community.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/pixels/article/2026/09/20/how-concerned-should-we-be-about-ai-s-supposed-existential-threat-to-humanity_6757739_13.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の最新情報", "title_en": "Mindef Updates", "summary_ja": "国防省が軍事関連の最新情報を発表しました。読者はストレーツ・タイムズからのより多くのニュースレターを受け取るために購読できます。", "summary_en": "The Ministry of Defence has released updates on military matters. Readers can subscribe to receive more newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートは、毎日のニュースハイライトと主要な動向を提供します。読者は定期的に無料ニュースレターを受け取るために購読し、ウェブサイトを通じて購読設定を管理できます。", "summary_en": "The Straits Times Evening Update provides daily news highlights and key developments. Readers can subscribe to receive regular free newsletters and manage their subscription preferences through the publication's website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズのモーニングブリーフィングは、毎日のニュース更新と主要なストーリーを提供しています。購読者はニュースレターの設定を管理し、ストレーツ・タイムズから追加の無料ニュースレターに登録できます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and key stories. Subscribers can manage their newsletter preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "UAEの高官、ハアレツのスクープに反論「国家指導者はそのような問題を議論しない」", "title_en": "UAE Official Dismisses Haaretz Report: State Leaders Don't Discuss Such Matters", "summary_ja": "UAEの高官がハアレツの調査報道に対して、記事で報じられた事項は国家指導者によって議論されないと述べて反論した。この声明は報道の信憑性を否定するものだが、報道内容の具体的な詳細については明らかにされていない。", "summary_en": "A UAE official responded to a Haaretz investigative report by claiming that matters covered in the exposé are not typically discussed by state leaders. The official's statement appears to be a dismissal of the publication's findings, though specific details of the reported matter were not elaborated.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiogJBVV95cUxObEVaMW9Na2xWN2JwMWwwaXNmT0NEZEQ3Tm1ha2R6MEpYTFJfLW5qR0I0YVVoSGNFdTdraXVfZTZhOVZhcnZDa1FxTEt1amg5NENYUWp4T0xQeWlhaVAyTFlueDQzVjlJbFVZRy1xc2w0MEhnQUlyNnB2LU9TT1RUQU5kUUstcUJHUmh3T2pwS3d6LWlCSWZSNDZsSE1xVzN0Nl9oVGJlRjRyNVpQWXo5M2ZTcG1NX1lMOEVxVHN6aUtOaXBWbHZLVDB2WE5GM2c1ZHBiSGRJZ2tIeWtPYjRaTkFOWERHNFpyOHdpMThSRDBZXzNEZHhYN3pBUlBXNVY4c3dNQXVKV0xvU0RLLWF2aVVtb1k4YmJQUURLTGF0UDB0QQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル大統領、2016年のパレスチナ人射殺で有罪判決を受けたIDF兵士エロル・アザリアを恩赦", "title_en": "Israeli President Pardons IDF Soldier Elor Azaria for 2016 Killing of Palestinian", "summary_ja": "イスラエルのヘルツォグ大統領は、2016年に負傷したパレスチナ人襲撃犯を射殺した罪で有罪判決を受けたIDF兵士エロル・アザリアを恩赦した。この事件は、武力行使と軍事活動に関する国内外での議論を引き起こした。", "summary_en": "Israeli President Isaac Herzog has pardoned Elor Azaria, an IDF soldier convicted of killing a wounded Palestinian assailant in 2016. The pardon concludes a case that sparked significant controversy both domestically and internationally regarding the use of force and military conduct.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiowJBVV95cUxOR2dycVJrWW1ZV0RaeU9ORG55QzlVQVVxOW9lRUl0SnlqcFNILUFWc280aUZwTTNOcEJiaWdUX2UtMzZENFplYUt4TFdDRklNa25mMkVVSnJCOExfN21vcXZwaGphREhUT0c3cnMyWlh1M25nVDA2a0tDYmdOcUpHMDd0S205a1hZMDhmZ1YtY2k0UWd4eVYzVm5Qc1FzcUt1bER0dDhkSEJ2Uzl2LXRhNEV0WmhYMER0QUhKZDZDcGpzdTdMTjRjR08tZDJoR3htTkFBdVBzLVhhTk9RdUxJSzdZM3RsLVBWUUVOWG01elFWSl9EYTU1N3UwUFpRSzV5T1k3U19BWk9TTlpXQlFmTW5WamNhZDVwSWVhcEZNQVdhNkE?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "論説：ヨム・キプール、世界はイスラエルに謝罪すべき", "title_en": "Opinion: The World Should Apologize to Israel This Yom Kippur", "summary_ja": "ハアレツの論説記事は、ヨム・キプール（贖罪の日）において、世界中の人々はイスラエルに謝罪すべきだと主張しています。この記事は、ユダヤ教の聖なる日における国際関係とイスラエルに対する認識について、独特の視点を提示しています。", "summary_en": "A Haaretz opinion piece argues that on Yom Kippur, the global community should apologize to Israel rather than the reverse. The article presents a perspective on international relations and perceptions of Israel during the Jewish holy day of atonement.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9wFBVV95cUxOQTl3UUJMU0pONEJfNlZrZEItb3dHM0JWckVPU2ZEMHh0bnMzTERXbEljTHRZNDNPdDdUeDB4LS1YMV9FalJGZUktb29tLS1hV2I2aV9PeFAtSk1lb0kwVW5zcGsxTXlDVjJGT3owUUpnNWowSENCOWhrOHpqUU9yZWJIR1dhYUhzZkQtWFNtQ0pjcUpTMWo1OXlOOVh5dG5pRkdtcWtTRHliUWlPZm5BY0VsVVpISlBBMFNRYUNkbS02TkRUU1lPaVhNUWw0YTBickJ1MU9JOFlkdklSVFFCWnRrTkp4cmFpY0YzUkpBYXBsWlA3Wl9n?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タイ人交際相手が冷凍庫で発見、台湾人男性が身柄確保", "title_en": "Taiwanese Man Detained After Thai Girlfriend Found Dead in Freezer", "summary_ja": "タイ人交際相手の遺体が冷凍庫で発見されたため、台湾人男性が逮捕された。警察は彼女の死亡経緯について捜査を進めている。現在、タイ当局が事件を調査中である。", "summary_en": "A Taiwanese man has been arrested following the discovery of his Thai girlfriend's body in a freezer. Police are investigating the circumstances surrounding her death. The case is currently under investigation by Thai authorities.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBuckJ3eTBHd09EX2dBbDZ1a1RIV19UTWlhVWlOdnZIQ3lLMkw3cHp4Y21NbnBKeHh0OWl2enp3aXRRNXdCcEhyM1BMeGQwYjl5YnhRWUpB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "MAC、入域許可批判を受け台北-上海フォーラムを軽視", "title_en": "MAC Downplays Taipei-Shanghai Forum Amid Entry Permit Controversy", "summary_ja": "台湾の大陸委員会（MAC）は、入域許可手続きをめぐる批判を受けて、台北-上海フォーラムの重要性を軽視している。委員会は両岸交流イベントの許可手続き方法についての懸念に対処した。この動きは、台湾と中国の二国間活動に対する機微な問題を反映している。", "summary_en": "Taiwan's Mainland Affairs Council (MAC) has downplayed the significance of the Taipei-Shanghai forum following criticism over entry permit procedures. The council addressed concerns about how permits were being handled for the cross-strait exchange event. The move reflects sensitivities surrounding Taiwan-China bilateral activities.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE8yTFFDNmg3MFBCX1J0bGhOU1ZBTGlkWEVuZWdwUW5VbDF5SGhrQ0c5cmVoNDVoc0llamQ4NHNUVldmTy1nRU44YWVBbWVnZnZUaWdHVkhOdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国はいかなる武力によるの台湾地位の変更も容認しない：リケッツ上院議員", "title_en": "U.S. Will Not Tolerate Change in Taiwan Status by Force: Senator Ricketts", "summary_ja": "リケッツ上院議員は、台湾の地位を武力で変更しようとする試みに対する米国の反対を改めて表明しました。この声明は、台湾海峡の現状維持を保つと台湾の安全保障を守るという米国の決意を強調しています。", "summary_en": "Senator Ricketts reaffirmed the United States' commitment to opposing any forceful alteration of Taiwan's status. The statement underscores U.S. resolve in maintaining the cross-strait status quo and protecting Taiwan's security.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9uVXg1QTFULUY2VVlWc3pnQnhQLTF4ZEM4TG5oaUZfaGdqSDUweml0R1NzLU1kdFBtZlQ0V3BVc2t1ekkwSk5hVXd0cHl2UklFUmwzSG5oNA?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、文化遺産64点を中国に返還", "title_en": "US Returns Cultural Relics and Fossils to China", "summary_ja": "CGTNが報じたところによると、中国の国家文化遺産局は9月16日と18日に米国から文化遺産64点と古生物化石を受け取った。CGTNは、この返還が両国の文化遺産保護協力を示すものだと述べている。返還品には米国の機関に保管されていた様々な遺物と化石が含まれている。", "summary_en": "CGTN reports that China's National Cultural Heritage Administration received two batches totaling 64 items of cultural relics, artifacts, and paleontological fossils from the United States on September 16 and 18. CGTN states that the repatriation represents cooperation between the two countries on cultural heritage preservation. The returned items include various artifacts and fossils previously held in US institutions.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-19/US-returns-groups-of-cultural-relics-to-China-1Qz3TXS68cE/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ラオス国防相：中国との防衛関係が深化", "title_en": "Lao Defense Minister: Defense ties with China deepen", "summary_ja": "CGTNが報じたところによると、ラオス国防相は、ラオスと中国の防衛関係が深化していると述べた。この報道は、両隣接国家間の軍事協力の強化を強調している。抜粋には、具体的な防衛イニシアティブまたは合意に関するさらなる詳細は記載されていない。", "summary_en": "CGTN reports that Laos's Defense Minister has stated that defense ties between Laos and China are deepening. The report highlights strengthening military cooperation between the two neighboring nations. Further details regarding specific defense initiatives or agreements were not provided in the excerpt.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-17/Lao-Defense-Minister-Defense-ties-with-China-deepen-1QvHyhFcbUQ/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランがスウェーデン外交官を国外追放、ストックホルムの大使館職員追放に対抗", "title_en": "Iran expels Swedish diplomat in tit-for-tat response to Stockholm's embassy action", "summary_ja": "CGTNが報じたところによると、イランはストックホルムのイラン大使館職員をスウェーデンが追放したことに対抗して、スウェーデン外交官に48時間以内の国外退去を命じた。CGTNが報じたところによると、イランはテヘランに対するスウェーデンの非難を「根拠のない」ものとして拒否した。この動きは両国間の外交的緊張の激化を示すものである。", "summary_en": "CGTN reports that Iran ordered a Swedish diplomat to leave the country within 48 hours on Thursday in response to Sweden's expulsion of an Iranian embassy official in Stockholm. CGTN reports that Iran rejected Sweden's accusations against Tehran as \"baseless.\" The move marks an escalation in diplomatic tensions between the two countries.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-17/news-1QvV5Z1NgGI/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ軍がDPRを31回攻撃、2人死亡4人負傷、住宅被害", "title_en": "Ukraine attacks DPR 31 times; 2 killed, 4 injured, homes damaged", "summary_ja": "TASSは、ウクライナ軍がドネツク人民共和国に過去24時間で31回の攻撃を実施したと報じている。国営メディアの報道によれば、攻撃により民間人2人が死亡、4人が負傷し、同地域の住宅が損傷したという。", "summary_en": "TASS reports that Ukrainian forces conducted 31 attacks on the Donetsk People's Republic over the past day. According to the state source, the attacks resulted in two civilian deaths, four injuries, and damage to residential houses in the region.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2190351", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "統一ロシア党、開票41%で下院選挙でリードを維持", "title_en": "United Russia leads Duma election with 41% of ballots counted", "summary_ja": "TASSによると、ロシア統一ロシア党は開票率41.04%の段階で下院選挙で圧倒的なリードを保っている。ロシア中央選挙委員会によれば、共産党が13.84%で続き、LDPR、新しい人々、正義のロシアがそれぞれ9.09%、7.97%、5.22%を獲得している。", "summary_en": "TASS reports that United Russia maintains a commanding lead in Russia's Duma election with 41.04% of ballots counted. According to the Russian Central Election Commission, the Communist Party follows with 13.84%, while LDPR, New People, and A Just Russia secured 9.09%, 7.97%, and 5.22% respectively.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2190349", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア外務省報道官、キエフとEU諸国による青年層への新ナチズム思想普及を主張", "title_en": "Russian MFA Claims Kiev and EU Nations Promoting Neo-Nazism Among Youth", "summary_ja": "ロシア国営メディアによると、ロシア外務省のマリア・ザハロワ報道官は、キエフとEU諸国が青年層に新ナチズム思想を教え込んでいると報告した。TASS/RTは、ザハロワ報道官が次世代がそのような言説に対抗する十分な抵抗力を備えているかについて懸念を表明したと伝えている。", "summary_en": "According to Russian state media, Maria Zakharova, spokeswoman for Russia's Foreign Ministry, reported that Kiev and EU nations are indoctrinating youth with neo-Nazi ideology. TASS/RT reports that Zakharova expressed concerns about whether the next generation has sufficient resilience to resist such narratives.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2190345", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカのAI機会", "title_en": "Africa's AI Opportunity", "summary_ja": "著者は、アフリカの最大の経済機会は中国と米国との先進的なAIモデル開発競争ではなく、若く成長する経済における実用的なAI活用にあると主張している。アフリカは歴史的に他地域で開発された革新を不利な条件で輸入してきており、COVID-19ワクチンへのアクセス問題がその典型例である。", "summary_en": "The author argues that Africa's greatest economic opportunity lies not in competing with China and the US on advanced AI models, but in deploying practical AI applications in its young, growing economies. Africa has historically been disadvantaged by importing finished innovations from elsewhere at unfavorable terms, a pattern exemplified by COVID-19 vaccine access issues.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/africa-should-build-an-ai-ecosystem-focused-on-solving-practical-problems-by-yemi-osinbajo-and-alexander-tsado-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Africa’s AI Opportunity\nand\nThe global AI revolution is often portrayed as a Sino-American race to develop the most advanced frontier models. But the greatest economic prize most likely will be found in deploying practical intelligence, particularly in Africa’s young, dynamic, and fast-growing economies.\nABUJA/LAGOS—Africa has long found itself at the wrong end of the innovation chain. Breakthroughs were made and commercialized elsewhere, then imported by African countries at prices and on terms over which they had little influence. The costs of this approach were starkly apparent during the COVID-19 pandemic, when Africa struggled to gain access to vaccines developed and manufactured elsewhere.", "translation_ja": "", "vocab": [{"word": "frontier models", "definition": "最先端の技術や性能を持つAIモデル。特に研究の最前線で開発される高度なモデルを指す。"}, {"word": "commercialized", "definition": "研究開発された技術やサービスを商業化して市場に投入すること。利益を目的とした事業化を意味する。"}, {"word": "innovation chain", "definition": "革新的な技術やアイデアが生まれてから市場に供給されるまでの一連の過程。"}, {"word": "starkly apparent", "definition": "明白で、疑いの余地がないほど明確に見えることを強調する表現。深刻さや重要性を際立たせる。"}, {"word": "dynamic economies", "definition": "急速に成長・変化する経済。活発で成長の可能性が高い経済状況を指す。"}]}, {"title_ja": "ドイツの中国ショックがもたらす政治的地震", "title_en": "The Political Earthquake From Germany's China Shock", "summary_ja": "高付加価値製造業による繁栄と社会的結束に基づいていたドイツの戦後の政治的安定性が、中国の経済競争によって根本的に揺さぶられている。最近の州選挙で極右政党AfDが2021年の支持率の2倍以上となる43.8%に急伸したことは、この経済的混乱がドイツ政治を再編し、中道右派の既得権層を脅かしていることを示している。著者は、ドイツの製造業モデルに対する中国の脅威が、戦後ドイツの歴史における転換点となる可能性のある政治的地震をもたらしていると主張している。", "summary_en": "Germany's postwar political stability, built on an implicit bargain of high-value manufacturing providing prosperity and social cohesion, is being fundamentally shaken by Chinese economic competition. The far-right AfD's dramatic surge to 43.8% in a recent state election, more than doubling its 2021 support, demonstrates how this economic disruption is reshaping German politics and threatening the center-right establishment. The author argues that China's challenge to Germany's manufacturing-based model is creating a political earthquake that could mark a turning point in postwar German history.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-shock-contributed-to-the-afd-s-rise-in-germany-by-dalia-marin-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Political Earthquake From Germany’s China Shock\nFor decades, Germany’s stability rested on an implicit bargain: high-value manufacturing would provide good jobs, strong export revenues, and broad-based prosperity, which political institutions would translate into social cohesion. Competition from China shakes that bargain to its foundations.\nMUNICH—September 6, 2026, could mark a turning point in Germany’s postwar political history. In the Saxony-Anhalt state election, the far-right Alternative für Deutschland (AfD) came within three seats of an absolute majority, winning 43.8% of the vote—more than twice its share in the 2021 election. The AfD’s gains came at the expense of the center-right Christian Democratic Union, the state’s incumbent governing party and the party of Chancellor Friedrich Merz, which won just 17.2%, down from 37.1% in 2021.", "translation_ja": "", "vocab": [{"word": "implicit bargain", "definition": "明示されていないが、合意されている取引または約束のこと。この文脈では、ドイツが良い雇用と繁栄と引き換えに社会的結束を得るという、暗黙の了解を指す。"}, {"word": "shakes to its foundations", "definition": "何かの基本的な基礎を揺るがすという表現。何かが根本的に不安定になり、深刻な影響を受けることを意味する。"}, {"word": "turning point", "definition": "重要な変化が起こる時点または出来事。その後の歴史や状況が大きく変わる分岐点を指す。"}, {"word": "incumbent", "definition": "現在その職にある人、または現職の。この文脈では、現在権力を持っている政党を指す。"}, {"word": "surge", "definition": "急速な増加または上昇。特に力強く、予期しない形で数値や支持が急増することを指す。"}, {"word": "postwar", "definition": "戦争後の時代を指す。特に第二次世界大戦後の時期を意味することが多い。"}]}, {"title_ja": "右翼勢力の台頭を止める", "title_en": "Stopping the Far Right's Rise", "summary_ja": "著者は、左派が主張する経済的不安定性だけでは、ヨーロッパと南米における極右勢力の躍進を説明できないと論じている。極右指導者らは異なる経済政策を掲げながらも選挙に勝利しており、支持の背景には他の要因があることを示唆している。フランス、ドイツ、イギリスなどの主要民主主義国で極右勢力が権力を掌握する可能性への懸念が高まっていることを指摘している。", "summary_en": "The author argues that the far right's electoral gains across Europe and the Americas cannot be solely attributed to economic precarity, as leftists claim. Far-right leaders succeed despite adopting varied economic policies, suggesting other factors drive their support. The piece highlights growing concern about far-right movements potentially coming to power in major democracies.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/stopping-far-right-rise-requires-crime-immigration-policies-by-andres-velasco-2026-09?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Stopping the Far Right’s Rise\nLeftists insist that what is behind the far right’s recent gains, from Europe to Central and South America, is economic precarity. Far-right leaders know better, winning elections or gaining support despite embracing very different economic policies.\nSANTIAGO—At an academic event in Brussels a few months ago, one of the speakers casually suggested that the next time the group met, the far right could be in power in France, Germany, and the United Kingdom. No one refuted him.", "translation_ja": "", "vocab": [{"word": "precarity", "definition": "不安定な状態や経済的な不確実性を指す。特に雇用や生活基盤が不安定な状況を表す用語として使用される。"}, {"word": "embrace", "definition": "政策や思想などを積極的に受け入れる、採用するという意味。ここでは極右指導者が特定の経済政策を取り入れることを表す。"}, {"word": "refute", "definition": "議論や主張に対して反論する、否定する。根拠を示して相手の意見が間違っていることを証明する行為を意味する。"}, {"word": "casually", "definition": "さりげなく、無造作に述べる様子を表す副詞。重大な発言を軽い口調で行うことを指す。"}, {"word": "electoral", "definition": "選挙に関連する、選挙の。政治選挙や投票に関わる事柄を修飾する形容詞として使用される。"}]}, {"title_ja": "トランプとシー・ジンピンはAI規制で協力し、人類の危機を防ぐべき", "title_en": "Trump and Xi Must Cooperate on AI Regulation to Prevent Catastrophe", "summary_ja": "アラン・フィンケルは、急速に加速するAI開発がもたらす実存的リスクが即座の政府介入を要求していると主張し、核軍備管理条約になぞらえている。同氏は企業による自己規制では不十分であり、米国と中国が壊滅的な事態が行動を強要する前に、基本的なAIセーフガードを確立するために主導する必要があると主張している。", "summary_en": "Alan Finkel argues that the rapid acceleration of AI development poses existential risks that demand immediate government intervention, comparing the situation to nuclear arms control treaties. He contends that self-regulation by tech companies is insufficient and that the US and China must lead global efforts to establish fundamental AI safeguards before a catastrophic incident forces action.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/21/can-trump-and-xi-cooperate-to-guide-humanity-through-the-ai-revolution-humanity-might-depend-on-it", "state_media": false, "category": "オピニオン", "full_text": "Recently, Jacob Coxon, a researcher at Anthropic, quit his job over concerns that AI was on a collision course with humanity. A flurry of headlines put the spotlight on the current crisis: unregulated competition between technology companies and between the US and China is putting our global infrastructure at risk at the very least, and threatening human existence at worst.\nOne’s mind fills with pictures of robot armies or systematic blackmail.\nIn the spirit of never letting a good crisis go to waste, an important opportunity will come with the summit this week between the US president, Donald Trump, and China’s president, Xi Jinping.\nAI is everywhere. It is powerful, helping us as individuals to plan our travel, book our gym classes and order takeaway food, while at the institutional level it is boosting the efficiency of businesses and bureaucracies. In academia it is providing stunning breakthroughs in mathematics that have eluded the best theoretical mathematicians for decades. In the sense that AI is widely available and can do a lot of good, it is like medicines, electricity and road vehicles. But unlike these technologies, we have not yet worked out how to ensure that the benefits of AI outweigh the risks.\nIn contemplating the way forward, it is worth thinking about how much time we have, or don’t have, to get it right. Technology development used to be slow. The first use of stone tools began 3.4m years ago and barely changed for the next 2m years.\nLeap forward. Computer chips have been doubling their capacity every two years from 1965 to the present. That is fast, but slow compared with AI development. According to the METR research institute, generative AI capability doubled every seven months from 2020 to 2024. Since then, generative AI capability has been doubling every four months, and with the recent release of ChatGPT 6-Astra and Claude Fable 5.1, the doubling rate is most likely even faster.\nJust a few days after Coxon’s resignation, Anthropic’s CEO, Dario Amodei, expressed the same concerns, and called for a slowdown of AI development. He was quickly backed by OpenAI’s CEO, Sam Altman, and xAI’s CEO, Elon Musk.\nIn defence of unregulated AI development, Trump dismissed their concerns, saying that statements to the effect that AI might destroy or massively harm humanity are a hoax and that calls to slow down AI development are a plot that will benefit China. He denied the need for AI guardrails, saying that all that is needed is a “strong and smart (high IQ!) president, and the U.S.A. has that, in spades!”\nSo, what to do? Governments could wait it out. If they do, something serious will happen. With luck, it will be bad enough to shock governments and industry into action, but not so bad that it has catastrophic consequences. It could be a power blackout across one or more states, bank withdrawals blocked for a week, or a deliberate overload of the global internet so that information flows grind to a halt.\nMuch better than waiting for one of these wake-up calls would be to get on the front foot. Some of the frontier AI companies are trying to do that. Anthropic’s aptly named “constitution” tries to enforce ethical behaviour of its AI models. The trouble is that it suffers from ever increasing complexity. When it was publicly announced in 2023, the Anthropic constitution was a 2,700-word document; the current version contains 23,000 words. It is inevitable that much of it will be subject to interpretation, by the AI and by the humans who train it. Indeed, Anthropic disclosed in July that despite its constitution, its Claude agents broke out of a test environment and attacked three external organisations.\nMy preferred approach to guardrails is to keep them simple, deeply fundamental and aligned to human values. Indeed, I have proposed three laws of AI that in the ideal world would be built into the innermost circle of code of every foundational AI model to ensure that foundational AI and its derivatives will not harm or deceive human beings, and will behave lawfully and ethically.\nNeither the Anthropic approach to implementing guardrails through a constitution nor my approach to implementing guardrails through fundamental rules will have a chance of being universally effective unless governments step up and make either or both approaches a strict requirement. The prospect of the AI industry as a whole doing so is not realistic. The track record of self-regulation by industry is patchy, thus it is not a sensible option for an industry in which the operational risks could be cataclysmic.\nSomething needs to be done, and it needs to be done very soon. We’ve been here before. Last century, we faced the prospect of mutually assured destruction from the nuclear arms race. The two nuclear superpowers – the US and the former Soviet Union – agreed on treaties to cap and ultimately reduce the number of nuclear weapons. In the case of AI, the two countries that now lead AI development must take the lead in", "translation_ja": "", "vocab": [{"word": "collision course", "definition": "衝突の危機に瀕した状態。制御不能な方向に進む軌道を指す。本文ではAIと人類が相互破壊の道を進んでいることを表現している。"}, {"word": "cataclysmic", "definition": "壊滅的な、大惨事をもたらす。予測不可能な大規模な破壊や混乱を意味する。"}, {"word": "guardrails", "definition": "安全柵、保護装置。ここではAIが害をもたらさないようにするための規制や制限を比喩的に指す。"}, {"word": "frontier AI", "definition": "最先端のAI。AI技術開発の最前線にある企業や研究機関が開発する最新のAIシステムを指す。"}, {"word": "mutually assured destruction", "definition": "相互確証破壊。核兵器保有国が相互に壊滅的な報復攻撃を受ける状態を指し、冷戦期の軍事均衡概念。"}, {"word": "patchy", "definition": "不規則な、ばらつきのある。品質や効果が一定でなく、部分的にしか機能していない状態を表す。"}]}, {"title_ja": "世界的危機の中でUN事務総長選挙が前例のない課題に直面", "title_en": "UN Secretary-General Election Faces Unprecedented Challenges Amid Global Crises", "summary_ja": "国連は戦争、気候変動、多国間主義への脅威に対処する一方で、新しい事務総長を求めており、トランプの国連への敵意によってさらに複雑化している。著者は、国連は強力でコンピテントなリーダーが必要だと主張するが、候補者は常任安全保障理事会メンバー、特に国連の失敗を望むトランプの承認を得る必要がある。弱い候補者と候補者からのビジョン欠如があるにもかかわらず、国連は世界的課題に対処するために依然として不可欠である。", "summary_en": "The UN faces an unprecedented leadership crisis as it seeks a new secretary-general while dealing with wars, climate change, and threats to multilateralism, complicated by Trump's antagonism toward the organization. The author argues the UN desperately needs a charismatic and competent leader, but candidates must secure approval from permanent Security Council members, particularly Trump, who would prefer the UN to fail. Despite weak frontrunners and lack of vision from candidates, the UN remains essential for addressing global challenges.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/20/un-new-leader-wars-climate-crisis-donald-trump", "state_media": false, "category": "オピニオン", "full_text": "If all goes to plan, at some stage in the coming weeks 15 diplomats will emerge from a small sound-proofed room deep in the bowels of the United Nations headquarters in New York and announce the organisation’s next secretary-general.\nThe person they choose will face a combination of challenges unlike any that their predecessors have had to deal with. Two of the security council’s permanent members, the US and Russia, are engaged in wars of choice that have no end in sight. A UN commission of inquiry has accused Israel of committing genocide in Gaza, but the UN has effectively been reduced to the role of bystander, pushed out by Donald Trump’s Board of Peace. The climate crisis is creating a cascade of new humanitarian disasters, while every day now seems to bring a new security threat caused by the unregulated rise of AI.\nAll of this is happening in a world in which the very principles of the UN – multilateralism, a rules-based order and international law – are under threat.\nSecretary-general elections have rarely been this consequential and conversations about who should win will dominate the sidelines of the UN general assembly this week and next, as world leaders gather for the annual summit.\nThe UN, and the world it speaks for, desperately needs a new leader who is both charismatic and competent. Yet the five permanent members of the security council – the US, UK, France, Russia and China – hold a veto. Anyone who wants the job will need the approval of Xi Jinping, Vladimir Putin and, most importantly, Trump.\nIt is not easy to argue you are best placed to save the UN when the man you need to persuade would rather it fails.\nThree informal straw polls have taken place so far and no frontrunner has emerged, indeed opposition to the two leading candidates rose in last Friday’s vote. For the first time in the organisation’s 80-year history serious discussions are quietly taking place about what would happen if no secretary-general is chosen at all.\nTen years ago, the election of António Guterres of Portugal was widely welcomed as a shot in the arm for the UN after a decade of the low-energy leadership of the South Korean Ban Ki-moon. In his previous role as the UN’s refugee chief he had been an outspoken activist and had pledged to continue speaking up for the world’s most vulnerable people. Then, a month later, Trump took office as the US president.\nEarlier this year, he announced the US’s withdrawal from 31 UN organisations, including the bodies responsible for dealing with climate change and women’s health, while in July his secretary of state, Marco Rubio, announced the administration’s desire to “dismantle” the international criminal court “brick by brick”. The abrupt closure of the US’s aid and development programme, USAID, led to deaths around the world.\nMost controversially, the establishment of Trump’s Board of Peace sparked fears that it could be used to supplant the UN itself. The UN meanwhile is in the grip of a financial crisis, with Guterres warning during the summer that it faced “imminent financial collapse” due to unpaid dues, much of it owed by the US.\nAnd yet, despite everything, the UN is still standing – and still matters. It is only the UN, through its Framework Convention on Climate Change, that manages to focus international attention on the greatest crisis the world is facing. Despite dramatic cuts in funding, there are still 11 peacekeeping missions staffed by more than 50,000 personnel in some of the most dangerous parts of the world. The UN’s office for the coordination of humanitarian affairs remains the best hope for negotiating access to deliver aid in war zones, including Sudan.\nThis year the general assembly passed two landmark resolutions: one recognising the transatlantic slave trade as a crime, another to adopt a new world map that correctly recognises Africa’s size.\nWe don’t know what the candidates think of these decisions, nor do we know where they stand on the war in Ukraine or what their stance is on Israel’s actions in Gaza. Despite the election’s importance – and despite the relatively recent transparency of “vision statements” and hustings – the candidates’ campaigns have been overwhelmingly cautious.\nPart of the reason, of course, is that someone standing on an ambitious platform would stand no chance of getting the job.\nUN experts believe there is a chance that the two current frontrunners, Guyana’s former foreign minister Carolyn Rodrigues-Birkett and Costa Rica’s ex vice-president Rebeca Grynspan, might become good secretary-generals. But no one is blown away by the choice on offer.\nFor Andy Burnham and Ed Miliband, both of whom will be in New York this week at the UN general assembly, there is a choice to be made. The UK is yet to express a preference, indeed the UK team at the UN is said to be unimpressed with all the candidates. So far, it’s understood, they have not voted in favour of anyone in the first three straw polls. The UK and France are both hoping ", "translation_ja": "", "vocab": [{"word": "consequential", "definition": "重大な、重要な結果をもたらす。ビジネスや政治の文脈で、重大な決定や行動を説明する時に使用される。"}, {"word": "multilateralism", "definition": "複数国家が協力して問題を解決する国際関係の原則。国連などの国際機関が重視する方針。"}, {"word": "veto", "definition": "拒否権、ある決定や行動を承認しない権力。国連安全保障理事会の常任理事国が保有する。"}, {"word": "supplant", "definition": "置き換える、別のもので取って代わる。元の役割や地位を新しいものが奪い取ることを意味する。"}, {"word": "imminent", "definition": "差し迫った、すぐにも起こりそうな危機的な状況。近い将来の危険を表現する際に使用。"}, {"word": "husking", "definition": "候補者が自分の政策や見解を有権者に説明・宣伝する演説会またはイベント。選挙活動の一部。"}]}, {"title_ja": "スタートレック60年の理想的未来ビジョンと現在の軍事化された現実の衝突", "title_en": "Star Trek's 60-Year Vision of Utopia Clashes With Today's Militarized Reality", "summary_ja": "著者デイブ・シリングは、スタートレックの平和と倫理に満ちた未来の楽観的ビジョンと、現在の宇宙兵器化および企業の貪欲さの現実を対比させている。同番組は数十年にわたる科学的革新と希望的思考にインスピレーションを与えてきたが、現代社会は代わりに『エイリアン』で描かれた反ユートピア的モデルを受け入れ、人類の進歩よりも軍事的支配と利益を優先していると主張している。", "summary_en": "Author Dave Schilling contrasts Star Trek's optimistic vision of a peaceful, ethical future with the current reality of space weaponization and corporate greed. He argues that while the show inspired decades of scientific innovation and hopeful thinking, modern society has instead embraced the dystopian model depicted in Aliens, prioritizing military dominance and profit over human progress.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/20/star-trek-air-force-weapons", "state_media": false, "category": "オピニオン", "full_text": "Who among us doesn’t dream of space in their youth?\nOK, maybe some of us. Like the ones with lives. While you were out playing hopscotch with little Jimmy and Susie, I was locked in my room mainlining episodes of Star Trek or the weird, sanitized version of Aliens that aired on broadcast TV. Fantastical science-fiction adventure seemed to offer more than playground games and actual human connection. Spaceships over relationships.\nStar Trek, celebrating its 60th anniversary this month, offered a utopian vision of the future. Highly competent scientists traveling the galaxy solving moral and ethical quandaries with grace and intelligence. It was a vision of Earth that had overcome greed and selfishness to pursue a more peaceful world Kirk and Spock. Picard and Data. These were characters that were ethical, witty and heroic. Better that than little Jimmy burning ants with a magnifying glass.\nThe Alien franchise, on the other hand, was the complete opposite. In the second film, Aliens, which coincidentally is turning 40 this year, the characters are mostly brain-dead killing-machine soldiers and venal corporate stooges. This one sounds a bit more familiar, doesn’t it? The entire known universe is controlled by a diabolical company whose only aim is profit at the expense of the average person. Both Star Trek and the Alien films offered the requisite thrills and whiz-bang action to titillate a young boy like myself back in the 1990s, but they were also diametrically opposed visions of what the world might look like when I became an adult. Would it be along the lines of a lush beige carpet and colorful pajamas or a soaking wet murder machine covered in KY Jelly grinding the working class into the ground? It took a few decades, but I think I found my answer.\nThe US air force announced on Monday that it had deployed weapons into space, thumbing its nose at the unwritten rule that space is for peace, not for war. The US rationale is, well, everyone else is doing it! Officials point to the increased militarization of space, including a 2024 Biden administration report claiming Russia was developing the capability to detonate nuclear weapons in space to disable or destroy orbiting satellites, which are crucial pieces of global infrastructure.\nThe air force secretary, Troy Meink, referred to the deployment as “on-orbit space control weapons capable of defending the joint force against hostile adversary action”. He wouldn’t say what they were, what they could actually do, or even what they look like. Which is always so comforting when futuristic space guns are involved. Is it a giant laser beam? Missiles? A claw that can grab satellites out of the sky? A large hammer? A Trump-shaped robot gollum that could swallow the International Space Station with the ease and gusto of the real person chowing down on a Big Mac? My imagination, stoked by years of sci-fi television, is running rampant. At the very least, I hope it has a series of blinking lights all over it. And an off-switch.\nBack in the 1980s, when Star Trek was at its creative peak, the idea of weaponizing space was considered such a joke that President Reagan struggled to amass a consensus around his Strategic Defense Initiative (derisively nicknamed “Star Wars”), which would have created a US orbiting missile deterrent. But now, Donald Trump is making fantasy space battles a key element of his rapidly deteriorating legacy. The US space force, his absurd brainchild, presented new uniforms that look like they were leftover from a Paul Verhoeven movie. If one wants to conquer a lifeless galaxy full of dirt, rocks and little else, one must be wearing the shiniest black boots possible. Also a hat.\nThe space force uniforms are certainly lightyears away from the ones on Star Trek, where everyone wears bright colors that immediately make the viewer think they’ve accidentally stumbled onto a rather unique discotheque. The Star Trek creator, Gene Roddenberry, made sure that the phaser weapons depicted on the show had a non-lethal stun setting. I think if anyone proposed a non-lethal weapon for the US space force, they’d be A) fired immediately and B) called woke to their face (and on Fox News in front of millions of people).\nLooking back six decades at the world Star Trek was born in, there was optimism in the world, mixed in with the chaos of political assassinations, riots, a war in Vietnam, and the ever-present threat of nuclear annihilation. The idea of going to space and landing Apollo 11 on the Moon was inspiring to a world that needed more cheering up than Ed Sheeran trying to find an opening act for his tour. Star Trek posited that life on Earth might be bad now, but fear not, the good guys would win in the end. Humanity would overcome itself.\nCountless modern scientific achievements – cellphones, tablets, the internet, medical advancements – can be attributed to Star Trek beaming ideas of benevolent futurism into homes around the globe for 60 years. But did society ", "translation_ja": "", "vocab": [{"word": "utopian", "definition": "理想的で完璧な社会や状態を表す形容詞。実現不可能とされながらも、より良い世界の希望や理想を示す際に使用される。"}, {"word": "diametrically", "definition": "完全に対立する、正反対の意味を表す副詞。二つのものが徹底的に反対の方向や性質を持つことを強調する。"}, {"word": "venal", "definition": "金銭で動く、買収可能な、腐敗した人物や行為を表す形容詞。道徳的に堕落した状態を指す。"}, {"word": "militarization", "definition": "軍事的性質や支配を強化するプロセスを示す名詞。通常は平和的な場所や産業が戦争目的で転用されることを意味する。"}, {"word": "benevolent", "definition": "善意的で慈悲深い、人類の福祉を望む意図を表す形容詞。映画や物語で理想的な未来像を描く際に使用される。"}, {"word": "deterrent", "defin
