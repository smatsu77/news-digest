inition": "世界や人生に対する無関心や退倦感。退屈で疲れた気分を表す文学的な表現です。"}, {"word": "fiscal irresponsibility", "definition": "予算や財政を無責任に管理すること。赤字を無視して支出を増やす政府の経済政策上の不誠実さを意味します。"}, {"word": "stratosphere", "definition": "本来は大気圏の一層ですが、比喩的に「極めて高い水準」を意味します。ここでは国家債務が極度に増加することを表現しています。"}, {"word": "lavish", "definition": "惜しみなく大量に与える、または豪奢な。ここでは富裕層と企業に対する大規模な税制優遇措置を指しています。"}, {"word": "rigged", "definition": "不正に操作される、または不公正な方法で設定される。政治体制が富裕層に有利に操作されていることを示唆しています。"}]}, {"title_ja": "ベン=グヴィルのパレスチナ人への非人道的扱いが世界的な沈黙に直面", "title_en": "Ben-Gvir's Dehumanizing Treatment of Palestinians Faces Global Silence", "summary_ja": "アルワ・マハダウィはイスラエルの国家安全保障大臣イタマール・ベン=グヴィルの衝撃的な言説と行動を批判し、パレスチナ人囚人が拘留キャンプで処理されている様子を描いたAI生成ビデオを指摘しています。著者は、ベン=グヴィルによる大量殺害の呼びかけ、非人道的慣行の支持、聖地協定違反が深刻な人権侵害であり、西側の人物による同様の発言と比べて国際メディアの監視が不当に少ないと主張しています。", "summary_en": "Arwa Mahdawi critiques Israeli National Security Minister Itamar Ben-Gvir's shocking rhetoric and actions toward Palestinian prisoners, including an AI-generated video depicting prisoners being processed through detention camps. The author argues that Ben-Gvir's calls for mass killings, support for dehumanizing practices, and violations of sacred site agreements represent egregious human rights abuses that receive disproportionately less international media scrutiny than comparable statements by Western figures.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/03/ben-gvir-palestinian-comments", "state_media": false, "category": "オピニオン", "full_text": "Let me introduce you to Itamar Ben-Gvir, the leader of Israel’s far-right Jewish Power (Otzma Yehudit) party, the minister of national security, and an almost cartoonishly evil man. You’ll have heard his name before: he made international news when he filmed himself taunting bound activists who had been detained trying to deliver humanitarian aid to Gaza. But you might not be familiar with many of his recent shocking comments, because they haven’t been widely covered by much of the US media.\nLet’s start with an AI-generated video that Ben-Gvir posted on Twitter/X on Sunday and then deleted. It shows portly Palestinian prisoners being loaded on to a conveyor belt and going into a detention camp, then emerging emaciated. The caption is “we promised – we delivered!” which seems to be a reference to the national security minister’s promise to worsen conditions for Palestinian prisoners. An ambitious goal, considering conditions are already hellish: Israeli human rights group B’Tselem has likened the prisons where Palestinians are kept to “torture camps”.\nI’m being diplomatic with my summary of this latest video, by the way. I suggest you go watch it yourself to fully take in how awful it is. (It may have been deleted, but it lives on online). If the podcaster Hasan Piker had tweeted something similar, with Israelis as the subject rather than Palestinians, it would be front-page news. US lawmakers, all of whom seem to be obsessed with Piker, would be demanding that the podcaster be punished.\nBen-Gvir, by the way, has some imaginative ideas for punishment. One of his sick fantasies is to put crocodiles in moats around prisons where Palestinians are held to stop prison breaks. The plan is now on hold because Israeli rights groups have said it is cruel to crocodiles.\nI can’t stress enough that, in any discussion of Palestinian “prisoners”, it’s important to remember that many of these people have not gone through any sort of due process. Thousands of prisoners, including about 200 children, are held under “administrative detention”: a technocratic name for a dystopian practice.\nTo quote the B’Tselem definition: “In administrative detention, a person is held without trial without having committed an offense, on the grounds that he or she plans to break the law in the future. As this measure is supposed to be preventive, it has no time limit. The person is detained without legal proceedings, by order of the regional military commander, based on classified evidence that is not revealed to them.”\nIn other words: if you are Palestinian, heavily armed Israeli soldiers can come into your house in the middle of the night, drag you into a de facto torture chamber despite the fact that you haven’t committed a crime, and hold you there indefinitely without telling you why you’re being held or informing your family where you are.\nWhen you hear the word “prisoner”, people like Ben-Gvir want you to think of dangerous terrorists who deserve everything they get. In reality, many are people like Layan Nasir: a 23-year-old woman who was taken away at gunpoint from her parents’ home for no clear reason and only made international news because she is a Christian.\nBut back to Ben-Gvir, who presides over prisoners. One of the minister of national security’s greatest achievements is a racist death penalty law that, because of the way it is worded, exclusively applies to Palestinians. Last month Ben-Gvir posted a video of a gallows complex where Palestinians convicted of terror offences will be hanged. For his birthday in June, he celebrated with a noose-themed cake.\nBen-Gvir doesn’t just want to hang his enemies; he wants more bloodshed in Gaza – which is still very much a killing field despite a so-called ceasefire. “I think we should be doing 30 to 40 targeted assassinations [in Gaza] per night,” Ben-Gvir recently said on a podcast. “Not just those who pose an immediate threat. There are people there who don’t deserve to live … They are not even people.”\nI could go on and on: Ben-Gvir is a busy man. He recently filmed himself entering prison cells containing Palestinian women and taunting them. On the same podcast where he urged nightly killings in Gaza, he went on to say that he thought Israel should occupy the entirety of Gaza. And, on Monday, he stormed the al-Aqsa mosque compound in East Jerusalem, accompanied by extremist settlers and with the protection of the Israeli military.\nThis is something he does regularly: it is a blatant provocation and a contravention of an agreement that gives Muslims exclusive rights to worship at al-Aqsa while Jews pray at the Western Wall.\nBen-Gvir and others like him, however, want to change the decades-old status quo and have Israel control everything. “We are in charge here in Jerusalem and all of the land of Israel,” Ben-Gvir said during a 2023 visit to the compound.\nBen-Gvir is so shameless that there is no way to spin his conduct. He has been condemned and sanctioned by politicians and governm", "translation_ja": "", "vocab": [{"word": "administrative detention", "definition": "法的手続きなしに個人を拘禁する行為。本人に対して罪状や拘禁理由を明かさず、将来の犯罪を防ぐという名目で無期限に収監される法的状態を指します。"}, {"word": "dystopian", "definition": "悪夢のような架空の社会状況を描写する形容詞。本来あるべき理想的な世界とは対照的に、極度に抑圧的で絶望的な状況を表現する際に用いられます。"}, {"word": "dehumanizing", "definition": "人間としての尊厳や価値を奪う行為や言動を表す形容詞。個人を人間ではなく物質的対象のように扱うことを意味します。"}, {"word": "contravention", "definition": "協定や法律に違反する行為のこと。特に正式な合意事項や国際条約などに対する違反行為を指す法律用語です。"}, {"word": "provocation", "definition": "意図的に相手を怒らせたり対立を招く行動のこと。特に政治的・社会的な緊張や紛争を意識的に引き起こす行為を意味します。"}, {"word": "shameless", "definition": "恥じらいや罪悪感を全く示さない様子を表す形容詞。自分の不当な行動や言動に対して一切の後悔や謝罪をしない態度を指します。"}]}, {"title_ja": "イランとの膠着状態の必要性", "title_en": "The Case for a Stalemate With Iran", "summary_ja": "著者は、米国とイランの現在の相互封鎖が双方にとって最も低コストの選択肢であると主張している。どちらも完全な勝利を達成できないため、この状況が最適だという。ワシントンはガソリン価格上昇による経済的圧力に直面しているが、封鎖によってイランの経済はより迅速に弱体化し、米国は高額な軍事的エスカレーションや完全撤退を避けられる。この膠着状態を無期限に維持することで、米国は過去の中東紛争の壊滅的コストを回避しながら地域での利益を保持できる。", "summary_en": "The author argues that the current mutual blockade between the U.S. and Iran represents the least costly option for both sides, as neither can achieve outright victory. While Washington faces economic pressures from higher oil prices, the blockade gradually weakens Iran's economy faster without requiring costly military escalation or full withdrawal. Maintaining this stalemate indefinitely allows the U.S. to preserve regional gains while avoiding the catastrophic costs of earlier Middle Eastern conflicts.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/case-stalemate-iran", "state_media": false, "category": "オピニオン", "full_text": "Six months in, the U.S. and Israeli war on Iran has settled into a stalemate. Neither Washington nor Tehran can achieve a clear military or diplomatic victory. Instead, the two sides have found themselves locked in a mutual blockade of oil and other shipments through the Strait of Hormuz and into Iranian ports, with no obvious way to change the status quo. The costs of accommodating the other side’s demands to end the stalemate are so high, and the costs of the stalemate sufficiently low, that a mutual blockade has emerged as the least bad option for both the United States and Iran for the foreseeable future.\nThis situation may not be ideal for Washington, but it avoids both defeat and escalation. It also works to the United States’ advantage over time: as the blockade drags on, Tehran’s position is likely to weaken faster than Washington’s. The United States has its own ample oil supplies to draw from, whereas nearly the entirety of Iran’s oil exports—and therefore much of its hard currency—has been cut off. An ongoing blockade that gradually ratchets up pressure on Iran could make Tehran more flexible in negotiations with the United States, leading to a compromise that Washington could accept. The challenge is to ensure that Tehran does not choose to respond to its worsening position by escalating its attacks and starting another regionwide conflict that ensnares the United States.\nU.S. policy should focus on avoiding the most disruptive contingencies, especially Iranian escalation, and settle for maintaining dual blockades indefinitely. If Iran is unwilling to concede, Washington can slowly erode the Iranian economy and military while ensuring that Tehran cannot rebuild the strong regional position it enjoyed before the Hamas attack on Israel on October 7, 2023. At this stage, maintaining the current U.S. position is the most effective way of fighting—and winning—this war.\nBEST OF THE WORST\nIn June, Washington and Tehran agreed to a memorandum of understanding to first establish a cease-fire and open the Strait of Hormuz and then to sign a permanent deal within 60 days to resolve long-term issues in the bilateral relationship, including restricting Iran’s nuclear program and removing U.S. and international sanctions and other financial penalties on Iran. But it fell apart before a final deal could be reached largely because Iran failed to fully open the strait. With diplomatic solutions going nowhere, both Washington and Tehran are now hoping that the economic pressure each can put on the other—and in the case of Iran, on the global economy—will force its counterpart back to the negotiating table on terms that will resolve the blockade in its favor.\nA blockade comes with costs for Washington. Keeping the strait closed is raising gas prices and increasing inflation in the United States, an especially sensitive issue as the November midterm elections approach. Prices could rise further if Iran finds a way to limit the millions of barrels of oil that bypass its blockade and are transported through the Strait of Hormuz daily. And the United States has already used up many critical munitions and strained its troops in the region by keeping the war going.\nBut the operation has been relatively affordable compared with past conflicts. The United States lost thousands of lives and spent trillions of dollars in Afghanistan and Iraq, whereas the ongoing conflict with Iran has resulted in 18 American service members killed and has likely cost tens of billions of dollars. (As of mid-July, estimates ranged from $37.5 billion to over $100 billion.) Most important, the mutual blockade has the advantage of being more palatable to political leaders in Washington than any of the alternative options.\nA full U.S. withdrawal from the Strait of Hormuz without gaining concessions from Iran, including ending its blockade, would be unthinkable even for the unorthodox Trump administration. It would allow Iran to tout a complete victory and give the regime in Tehran a powerful psychological boost that would undo much of the progress that the United States and Israel made in the past three years decimating Iran’s network of regional proxies. And it would probably not lead Iran to reopen the Strait of Hormuz for free passage—Tehran is likely to insist on installing some kind of tolling system in perpetuity. With Washington in retreat, Iran could also revive and rebuild its nuclear program, which would be a stunning failure for the United States.\n The United States can continue the mutual blockade at relatively low cost.\nMilitary escalation is an even less appealing option for Washington. The Iranian regime has already survived a massive bombing campaign; a new, even more aggressive offensive could take out much of Iran’s remaining military capabilities and its energy, transportation, and communications infrastructure, but such an offensive could not guarantee that Tehran would accept American terms on opening the strait or curtailing", "translation_ja": "", "vocab": [{"word": "stalemate", "definition": "両者が互いに相手を打ち負かせない状況。紛争や交渉で、どちらかが有利な位置に進めない膠着状態を指す。"}, {"word": "blockade", "definition": "軍事力を使って港湾や地域への物資の出入りを遮断する戦術。経済的圧力をかけるために用いられる。"}, {"word": "escalation", "definition": "紛争や対立の段階的な激化。軍事行動や緊張がより深刻になる段階を指す。"}, {"word": "contingencies", "definition": "予期しない事態や不測の事態。政策立案時に備えるべき可能性のある状況を意味する。"}, {"word": "erode", "definition": "徐々に減少・弱化させる意味の動詞。経済や軍事力が時間とともに衰退する過程を表す。"}, {"word": "palatable", "definition": "受け入れやすい、好ましいという意味の形容詞。政治的に支持されやすいことを表現する際に使う。"}]}, {"title_ja": "アメリカの聖域の終わり", "title_en": "The End of American Sanctuary", "summary_ja": "著者は、米国の従来の地理的隔離と軍事的優位性が、中国、ロシア、北朝鮮からの現代的脅威に対して十分な保護をもたらさなくなったと主張する。現在のホームランド防衛システムは時代遅れであり、高度な通常兵器、サイバー攻撃、ドローン攻撃に対抗するには不十分であり、9.11以降の改革と同様に国家安全保障機構の包括的な改革が必要である。", "summary_en": "The author argues that the United States' traditional geographic isolation and military dominance no longer provide adequate protection against modern threats from China, Russia, and North Korea. Current homeland defense systems are outdated and insufficient to counter advanced conventional weapons, cyber attacks, and drone strikes, requiring a comprehensive overhaul of the nation's security apparatus similar to post-9/11 reforms.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/end-american-sanctuary", "state_media": false, "category": "オピニオン", "full_text": "Among its many advantages, the United States benefits from a rare form of geographic luck: it is bracketed on the east and west by two vast moats, the Atlantic and Pacific Oceans, and on the north and south by only two neighbors, both of whom are relatively friendly. Adding to this good fortune is that, since the end of World War II, the United States has possessed a powerful nuclear arsenal and unparalleled military, economic, and technological might. Despite the 9/11 terrorist attacks, this mix of geography, deterrence, and power has led many Americans to feel almost untouchable at home. According to a 2024 Chicago Council on Global Affairs poll, just 19 percent of those surveyed expressed concern about foreign threats.\nIt is time for Americans to revise their assumptions. In fact, the U.S. homeland has never been as vulnerable to attack as it is today. China, Russia, and North Korea are building up their conventional and nuclear capabilities to strike the United States across a variety of domains—and U.S. defenses have not kept pace. A major evolution in technology and tactics, meanwhile, has increased the threat of subversion and gray-zone attacks: drones from state and nonstate actors can strike almost any target in the United States, and adversaries such as China can conduct AI-enabled offensive cyber-operations that can destroy or damage critical infrastructure.\nThe United States is not prepared. The country’s air and missile defenses are porous. Arcane domestic laws and policies prevent the necessary coordination and authority to defend against drone attacks. And energy, water, financial, health-care, and other infrastructure remain vulnerable to advanced cyberattacks. Faced with these new threats, federal, state, and local entities in the United States are caught flat-footed. The 9/11 attacks happened in part because of policymakers’ inability to grasp that the world was changing and to share information across government agencies that could have protected the country. Without an overhaul of the nation’s homeland security apparatus, Washington is in danger of making this mistake again.\nMISSILES OVER THE MOAT\nSecurity measures enacted after September 11 were designed to protect the U.S. homeland from terrorism. The U.S.A. Patriot Act and subsequent legislation enabled U.S. agencies to collect more intelligence at home and abroad. The Department of Homeland Security, the Office of the Director of National Intelligence, the National Counterterrorism Center, and the Joint Terrorism Task Forces were created or enhanced to better share intelligence about terrorism and other threats. The FBI significantly expanded the number of Joint Terrorism Task Forces across the country, coordinated with state and local law enforcement, and conducted intelligence-led operations to identify and arrest terrorists.\nThese measures were helpful at the time, when terrorism was the biggest threat to the U.S. homeland. And they were successful in preventing the vast majority of terrorist plots in the homeland. But today, some of the greatest threats to the United States come from state actors. China, Russia, and North Korea all possess intercontinental missiles capable of hitting the U.S. homeland—and all have conducted tests and exercises to show that they are capable of using them.\nThe wars in Iran and Ukraine suggest that possessing a nuclear arsenal, even one as large as the U.S. arsenal, no longer protects against conventional attacks on the homeland as it once did. Iran and its network of proxy forces have lobbed tens of thousands of rockets, missiles, and drones at major population centers in Israel. Ukraine has successfully struck Russian cities, energy infrastructure, industrial base targets, logistics nodes, and military bases without incurring a nuclear response from the Kremlin. Advanced Israeli and Russian air and missile defense systems have struggled to stop these drones and missile attacks.\nIn the event of a conventional attack on U.S. soil, American air and missile defense systems might, too. The United States lacks sufficient numbers of air defense systems and interceptors to protect against ballistic missiles. The war with Iran has reduced the military’s global supply of THAAD interceptors by as much as 80 percent and Patriot interceptors by as much as 50 percent. In addition, homeland defense against cruise missiles remains porous. Cruise missiles are difficult to defend against. They fly close to the earth in order to stay below conventional radar, and they use mountains, valleys, and hills to hide from ground-based sensors—what is called “terrain masking.” The United States does not have enough missile defense systems in enough areas to protect against cruise missiles.\nChina especially has expanded and updated its ability to strike the United States. In addition to missiles, the threat from China now extends into space. China can strike targets in the U.S. homeland using a Fractional Orbital Bombardment ", "translation_ja": "", "vocab": [{"word": "porous", "definition": "防御や管理が不完全で、簡単に突破されやすい状態を示す。セキュリティ文脈では、十分でない防御システムを表現する際に使用される。"}, {"word": "deterrence", "definition": "報復の脅威によって相手の行動を抑止する戦略。軍事・政治用語として、攻撃を防ぐために強力な防御力を示すことを意味する。"}, {"word": "subversion", "definition": "制度や体制を内部から破壊・転覆させる行為。政治・安全保障文脈では、敵対勢力による秘密工作や不安定化工作を指す。"}, {"word": "gray-zone attacks", "definition": "戦争と平時の中間領域で行われる攻撃。全面戦争には至らない、サイバー攻撃やプロキシ戦争など曖昧な形態の軍事行動を指す。"}, {"word": "interceptors", "definition": "ミサイルや航空機を撃ち落とすために発射される防御用ミサイル。防空システムの重要な構成要素で、攻撃を阻止するために使用される。"}, {"word": "terrain masking", "definition": "地形の起伏を利用してレーダー探知を回避する戦術。ミサイルが低空飛行して山や谷を利用し、防御システムから隠蔽する手法。"}]}, {"title_ja": "中国への好意的評価の上昇は米国との経済関係の選好を隠している", "title_en": "Global Favorability Toward China Masks Preference for U.S. Economic Ties", "summary_ja": "最近のピュー・リサーチセンターの調査では、世界が初めて米国よりも中国をより好意的に評価していることが示されています。しかし、経済的パートナーとしてどちらの国を選ぶかを尋ねられると、多くの調査対象国の回答者は米国を選んでいます。著者は、この矛盾により、米国のソフトパワー衰退ではなく、大国間競争への世界的な適応を示していると論じています。", "summary_en": "While recent Pew Research polling shows the world views China more favorably than the United States for the first time in two decades, this headline masks a more nuanced reality. When asked which country they would prefer as an economic partner, respondents in most surveyed nations still choose the United States, even in countries that rate China more favorably. The author argues this divergence reveals that global opinion is adjusting to great-power competition rather than indicating a fundamental shift in American soft power's decline.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/how-does-world-really-view-china", "state_media": false, "category": "オピニオン", "full_text": "In July, the Pew Research Center found that for the first time in roughly two decades of global polling, the world now views China more favorably than the United States. The sentiment was not universal, but in 25 of the 36 countries surveyed this year, the percentage of respondents who gave favorable marks to China exceeded that for the United States, including several close U.S. allies. Some analysts have taken these findings as confirmation that the golden era of American soft power is over and China is ascendant. According to them, Trump’s policies on tariffs, aid, and allies have eroded the United States’ standing, opening the door for people across the world to switch their allegiance to China.\nBut this interpretation, convenient as it may be, deserves more scrutiny. A closer examination of the data reveals that although global opinion of the United States has indeed plummeted and opinion of China has risen since 2022, most of the world still prefers the United States as an economic partner—including most of the countries that now view China in a more positive light. This is a critical distinction, since economic partnerships and interests tend to drive national policies. Indeed, it signals something more nuanced is happening than simply the end of American hegemony and an imminent age of Chinese global supremacy.\nThe world’s increasingly pro-Chinese attitude is not meaningless. That more and more people think better of Beijing than of Washington could eventually prove important as Beijing seeks to build up its soft power. For now, however, what the numbers actually show is a world adjusting to the new reality of great-power competition, feeling forced to choose one side without the luxury of liking it.\nSTILL ON TOP\nFavorability is, in essence, a feeling. When people are asked to say how favorably they view something, they are really being asked whether and how much they like it—and little else. Pew’s favorability question also asked only whether respondents hold a positive or a negative impression of China and the United States, not whether they liked one more than the other. Still, Beijing clearly came out on top in these questions. Favorable views of the United States fell significantly in 15 of the 24 countries surveyed in both 2025 and 2026. Moreover, in several U.S. ally countries, including Canada, France, Germany, Italy, South Korea, and the United Kingdom, favorability ratings are now at or near their lowest since Pew began polling in 2002. In contrast, China’s image has consistently improved in several Western countries. The percentage of Italian respondents with a favorable opinion of China, for instance, increased from 31 percent in 2022 to 51 percent in 2026. In Spain, China’s favorability rose from 37 percent in 2025 to 54 percent in 2026.\nMedia outlets and observers have fixated on these numbers, but the same Pew survey asks another, more consequential question: “Is it more important for your country to have strong economic ties with China or with the United States?” This prompt forces respondents to weigh the two powers against each other and pick one. Critically, it asks them to consider not just how they feel about each country but also which they would rather work with. In 2025, the last year for which country-by-country, individual-level data is available, more respondents in 20 out of 24 countries chose economic ties with the United States over ties with China.\nIn seven of those 20 countries, answers to the two questions diverged. More respondents in Canada, France, Greece, the Netherlands, Spain, Sweden, and Turkey rated China more favorably than the United States, yet more people chose economic ties with the United States over China, sometimes by wide margins. In Sweden, for example, respondents preferred U.S. economic ties to Chinese economic ties by 48 percentage points. Turkish respondents rated China 13 percentage points more favorably than they did the United States but preferred economic ties with the United States by ten percentage points anyway.\nAs the only country that favors Chinese economic ties but views the United States more favorably, Australia is an outlier. This is not much of a surprise given that China is already the country’s largest export destination, accounting for 30 percent of everything Australia sells to the world. But it is noteworthy that half of Australians believe China is the country that threatens Australia most, and a full third believe the United States is Australia’s most important ally, compared with seven percent who believe China is. When asked, however, whether Australia’s economy should have closer ties to China or to the United States, 54 percent picked China, compared with 43 percent that picked the United States. Favorability, it appears, cannot adequately capture the nuance of public opinion on the two countries, much less divine a shift in the balance of soft power.\nGlobally, the individual respondents who preferred China as an econom", "translation_ja": "", "vocab": [{"word": "hegemony", "definition": "ある国が他国に対して持つ圧倒的な支配力や優位性。国際関係において一国の統治的優位性を指す用語。"}, {"word": "soft power", "definition": "軍事力や経済力ではなく、文化や価値観を通じて他国に影響力を行使する力。魅力的な政策や文化による影響力。"}, {"word": "diverged", "definition": "異なる方向に向かう、または意見が分かれることを意味する。対立や相違が生じる状態を表す。"}, {"word": "nuanced", "definition": "細かい違いや複雑な側面を含む、微妙なニュアンスに富んだ。単純でなく、深い理解が必要な状態。"}, {"word": "consequential", "definition": "重大な結果や影響をもたらす、重要な。結論を導き出すために重要な質問や事項を指す。"}, {"word": "fixated", "definition": "ある事柄に過度に集中する、執着する。メディアや人々が特定の情報に注目し続けることを表す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-03 22:57 JST";
  renderTabs();renderList();
})();
</script>
