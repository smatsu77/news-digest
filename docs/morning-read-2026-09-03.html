 middle school students in the city’s public school system – the largest in the country – could set the stage for how other school systems in the United States tailor their approach to the use of AI, experts say.\nThe moratorium, which was announced on Wednesday, will last for one year and will end the use of 40 different educational tools impacting 600,000 students. The ban will not bar teachers from using the technology to create lesson plans.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Mamdani praises El-Sayed’s victory, rejects ‘mini Mamdani’ trope\n- list 2 of 4New York mayor Mamdani sues to block $10,000 teaching aide bonuses\n- list 3 of 4Mamdani opposes Hindu nationalist event in New York\n- list 4 of 4Mamdani lookalike contest draws hundreds of hopefuls in New York\n“Children need teachers and human connection in order to learn and grow. They need to develop skills alongside their peers, build relationships with educators and wrestle with tough problems on their own,” Mayor Zohran Mamdani said in a news conference on Wednesday.\n“The tech industry wants us to believe that AI-powered early education is not only inevitable, but necessary. We do not see it that way.”\nMamdani added that the city will spend the next year studying how the policy will impact students. The city’s public school system will also launch a pilot programme in high schools for a limited number of students.\nAmong the tools being tested will be the maths AI platform Edia, which will provide “step-by-step coaching” and prompting students to explain their reasoning. Its use will be limited to 20 minutes each week. Another tool, Quill, will be used in English language arts courses and will be limited to 15 minutes each week.\n“The mayor is giving schools, parents, scholars the runway to study what the impact on our education system these tools will actually have,” Adin Lenchner, founder of the New York-based political consultancy Carroll Street Campaigns, told Al Jazeera.\n“This feels like the kind of leadership that people were actually hungry for — standing up to corporate interests and looking out for students.”\nThe policy also implements staggered screen-time restrictions, with use limited to less than 45 minutes each day through eighth grade.\nThe policy also bans “companion chatbots” through high school. City Hall did not elaborate on Al Jazeera’s request for clarification on what that covers.\nThe moratorium comes at a consequential time for New York City’s public schools. Reading proficiency scores tumbled by 6 percent in 2025 among students in grades 3 through 8.\nExperts say that New York City may set the stage for how other school districts approach AI.\n“NYC public schools banning AI in elementary and middle schools sends an important message because it is the largest school district in the US. However, it is hard to know the effectiveness of the ban because they haven’t shared the enforcement mechanism,” Margeret Murry associate professor of communication at the University of Michigan, told Al Jazeera.\nAI’s impact on learning\nThe mayor’s decision comes alongside a growing number of reports showing that AI use in children’s education can have a negative impact on cognitive development.\nA comprehensive review of 400 studies, along with interviews with teachers, parents and other educators conducted by the Brookings Institution’s Center for Universal Education, concluded that the negatives of generative AI in the classroom outweigh the positives. However, the report stressed that careful and limited implementation in specific use cases can help enrich learning outcomes.\n“It’s in line with the science,” Shaleen Title, an attorney at Rudick Law Group and adjunct professor at Roger Williams University School of Law focusing on emerging sectors like AI, said of the mayor’s move.\n“The most important thing about it is that it changes the approach. Before, the approach was to let students use technology without really vetting the risks, whereas now, the default is that the products have to be proven safe before they can be used by students, which I think is the right approach. I think it was a smart reversal on their part.”\nOne recurring theme outlined in the Brooking Institution’s was what researchers described as a “digitally induced ‘amnesia”, in which students were unable to recall basic factual information about topics they had studied or submitted work on.\nThat theme continues into adolescence and young adulthood. A January 2025 report in the peer-reviewed sociology journal Societies found that people aged 17 to 25 who relied more heavily on AI had lower levels of critical-thinking ability.\nFor those bound for university, professors are starting to notice the effects. A College Board report found that 84 percent of fac", "translation_ja": "", "vocab": [{"word": "moratorium", "definition": "一時的な禁止や停止期間のことで、通常、特定の問題が十分に研究または検討されるまでの間、ある活動を延期すること。ここではAI使用の一時的な禁止を意味します。"}, {"word": "generative AI", "definition": "テキスト、画像、コードなどのコンテンツを生成できる人工知能の一種。ChatGPTなどのツールが該当し、教育現場での使用が議論の対象になっています。"}, {"word": "cognitive development", "definition": "人間が学習し、思考し、記憶し、推理する能力が発達するプロセス。特に子どもにおいて、これらの精神機能の成長を指します。"}, {"word": "companion chatbots", "definition": "ユーザーと会話したり支援したりするために設計されたAIプログラム。学生の学習を助けるために開発されていますが、この政策では禁止対象になっています。"}, {"word": "staggered", "definition": "段階的または時間差を設けて配置・実施すること。ここではスクリーンタイムを段階的に制限することを意味します。"}, {"word": "enforcement mechanism", "definition": "ルールや法律が実際に守られているかを確認し、違反に対して処罰を実行するためのシステムまたは手段。"}, {"word": "vetting", "definition": "何かを使用または承認する前に、その安全性や信頼性を徹底的に調査・検査すること。"}]}, {"title_ja": "気候ショックイベントに対応するペース", "title_en": "Keeping Pace With Climate Shock Events", "summary_ja": "ネパールとスリランカの最近の気候災害は、気候ショックが世界的な排出量への最小限の貢献にもかかわらず、脆弱な人口に不均衡に影響することを明らかにしています。大規模な災害は世界的な注目を集めますが、スリランカのマライヤハタミル労働者などの周縁化されたコミュニティは、複合的な脆弱性と長期の復興に直面しています。南アジアの相互に関連した生態系は協力的な気候対応を必要としていますが、地域のジャーナリストは統一された戦略よりも断片化した災害物語を報告し続けています。", "summary_en": "Recent climate disasters in Nepal and Sri Lanka reveal how climate shocks disproportionately affect vulnerable populations despite their minimal contribution to global emissions. While major disasters attract global attention, marginalized communities like Sri Lanka's Malaiyaha Tamil workers face compounded vulnerabilities and prolonged recovery. South Asia's interconnected ecosystems demand collaborative climate responses, yet the region's journalists continue reporting fragmented disaster stories rather than unified strategies.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/op-ed/keeping-pace-with-climate-shock-events/article71423686.ece", "state_media": false, "category": "社会", "full_text": "Shaky social media visuals of the Rasuwa floods in Nepal have rattled the world. With over 1,250 lives lost so far — over 4,000 people are still missing — the extent of devastation is slowly becoming evident. Seeing colleagues in Nepal reporting from different locations and bringing to us fragments of information and various news angles was a stark reminder that the full story of a climate shock rarely fits into one dramatic headline.\nWe read about locals, tourists on holiday, and pilgrims. We see reports of governments’ outreach to help citizens, and assistance offered in rescue operations and contributions towards the herculean rehabilitation effort that awaits the country. We see social media posts from those seeking information about their missing loved ones.\nWhile we share the risks of the growing climate crisis, each climate shock shows us that the world we live in is unequal and unfair. Soon after the flash floods, news outlets highlighted Nepal’s negligible contribution to climate change – accounting for 0.1% of total global greenhouse gas emissions. A point to ponder before we are drawn to unsubstantiated claims or conspiracy theories.\nReports of at least 900 workers believed to be trapped at 12 hydropower projects affected by flash floods in the districts of Rasuwa and Nuwakot brought back memories of Cyclone Ditwah that hit Sri Lanka late last year. Many of us reported from different affected areas. Each story, every life, was undoubtedly important, but the pattern that slowly emerged was hard to ignore. While the risks may have been common, vulnerabilities are different.\nAmong the most affected in this disaster were Sri Lanka’s Malaiyaha Tamil community, especially people working in the tea and rubber estates across the central and southern hill country. Historically marginalised, they not only contend with exploitation but are also the most vulnerable to climate shock, as Ditwah made evident.\nThe United Nations sought to mobilise $35 million in aid towards humanitarian assistance. The island is still rebuilding after the unprecedented floods and landslides. Some affected families stayed in temporary shelters for months, struggling to commute to the tea estates where they are employed for a daily wage. The concerns over compensation and transition to safe, permanent homes are far from gone. Ten months later, some communities tell us the cyclone is yet to pass.\nClimate shock events of the magnitude witnessed in Nepal recently, or in Sri Lanka last year, draw global attention. But there are signs that show up from time to time. The stories may not be dramatic, but they are still telling.\nIn late 2018, districts across Sri Lanka’s Northern Province were severely hit by flash floods. Tens of thousands of people were affected; crops were damaged, and villages inundated. Neck-deep in work, the then government agent (a post similar to that of a District Collector in India) of Kilinochchi, who spared time to explain the situation to me, said: “In fact, we were giving drought relief to our people even days before the flood suddenly hit us.” As Sri Lanka prepares for the possible effects of El Niño this year, I am reminded of the GA’s matter-of-fact comment on how people and authorities were forced to combat one climate shock after another.\nWe have witnessed major climate shocks in quick succession in the region. The floods in Pakistan in 2022, floods in different parts of India over the last few years, the cyclone in Sri Lanka in 2025, and now, Nepal’s staggering floods. A Pakistani friend recently shared a 2009 piece from Himal Southasian on her social media. Authored by former diplomat Shyam Saran, it contended that South Asia is an ecologically interconnected system and called for a collaborative response to the climate crisis. Journalists in the region, however, have had more stories about natural disasters than collective strategies to tell.\nPublished - September 04, 2026 01:24 am IST", "translation_ja": "", "vocab": [{"word": "humanitarian assistance", "definition": "人道的支援。災害や紛争の被害者に対し、国際機関や団体が提供する食糧、医療、避難所などの緊急支援を指します。"}, {"word": "marginalized", "definition": "周縁化された、社会の主流から除外された。歴史的に差別や搾取を受け、政治的・経済的に権力から遠ざけられた集団や個人を指します。"}, {"word": "vulnerabilities", "definition": "脆弱性、弱点。気候変動や災害に対して抵抗力が低く、被害を受けやすい状態や条件を指します。"}, {"word": "ecologically interconnected", "definition": "生態学的に相互に関連した。異なる地域の生態系が複雑に結びついており、一つの地域の環境変化が他の地域に影響を与える関係を意味します。"}, {"word": "unprecedented", "definition": "前例のない、かつてない。過去に類似の事例がない規模や程度の出来事を指します。"}, {"word": "rehabilitation effort", "definition": "復興努力。災害で被害を受けた地域や施設、コミュニティを元の状態に戻すための大規模な取り組みを指します。"}]}, {"title_ja": "インド外相がキーウを訪問、ウクライナ・ロシア戦争解決への支援を申し出る", "title_en": "India offers diplomatic support to resolve Ukraine-Russia conflict, Jaishankar tells Zelensky", "summary_ja": "インドのジャイシャンカル外相がキーウを訪問し、ゼレンスキー大統領と会談してウクライナ・ロシア戦争の外交的解決に対するインドの支援を申し出た。ジャイシャンカル外相は5年間続く紛争を終わらせ、黒海での商業船舶の保護が必要であること、そしてインド人船員が被害を受けていることを強調し、解決は石油購入決定ではなく対話と交渉に依存していると述べた。", "summary_en": "External Affairs Minister S. Jaishankar visited Kyiv and met President Zelensky to extend India's assistance in finding a diplomatic solution to the Ukraine-Russia war. Jaishankar emphasized the need to end the five-year conflict and protect commercial shipping in the Black Sea, where Indian sailors have been killed, while stressing that resolution depends on dialogue and negotiation rather than oil purchasing decisions.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/national/jaishankar-visit-india-on-ukraine-russia-war/article71423638.ece", "state_media": false, "category": "政治", "full_text": "Days after Prime Minister Narendra Modi called for an end to the war in Ukraine during his meeting with Russian President Vladimir Putin in Bishkek on the sidelines of the SCO summit, External Affairs Minister S. Jaishankar on Thursday met Ukraine’s President Volodymyr Zelensky and Foreign Minister Andrii Sybiha in Kyiv and extended India’s support to find a diplomatic solution to the war. He said incidents of attacks on commercial shipping in the Black Sea region were affecting developing economies of the Global South in areas such as energy security, agriculture production and food shortages.\nUpon meeting Mr. Zelenskyy, Mr. Jaishankar said, “Our conversation centred on approaches to end the ongoing conflict.”\n“Every passing day of conflict only means more deaths and more destruction. Understandably, it is for the parties involved to find a way. But, if India can be of any help in any manner, we are ready, and this was the core of my discussion so far with Foreign Minister Sybiha,” said Mr. Jaishankar, referring to Mr. Modi’s remarks in Bishkek, where he had said, “endless war must now give way to the end of war”. He reiterated the Indian position against the war and said, the war “regrettably is now in its fifth year”. In response to a question on India’s continued purchase of Russian oil, Mr. Jaishankar said halting of the Ukraine-Russia war did not depend on whether a country was buying oil or not, and added, “This conflict will be solved by dialogue, by diplomacy and by negotiation.”\nKilling of Indian sailors\nThe Black Sea has emerged as the maritime frontier of the Ukraine vs Russia war leading to several incidents, especially in the last few months, of killing of Indian sailors who were working in commercial shipping vessels that were targeted by both sides. Mr. Jaishankar raised the need to ensure safety of commercial vessels in the Black Sea region and stated, “Indian seafarers man ships of many flags and have been among the unfortunate casualties.”\n“The impact on shipping is also significantly affecting many nations of the Global South in a variety of ways leading to fuel, fertilizer and food shortages,” the External Affairs Minister said. He further mentioned India’s humanitarian contribution to Ukraine over the past five years, saying New Delhi had sent 19 consignments of relief materials that included generator sets, medicines, medical equipment etc.\nPublished - September 03, 2026 05:04 pm IST", "translation_ja": "", "vocab": [{"word": "diplomatic", "definition": "外交的な、または交渉を通じて平和的に問題を解決しようとする姿勢を意味します。国際紛争の解決において使用される重要な用語です。"}, {"word": "casualties", "definition": "戦争や事故で死傷した人々を指します。ここではウクライナ・ロシア戦争で黒海での事件により命を失ったインド人船員を意味しています。"}, {"word": "maritime", "definition": "海洋に関連する、または海運業に関する形容詞です。この記事では海上輸送と黒海での紛争に関連して使用されています。"}, {"word": "reiterated", "definition": "同じことを何度も繰り返して述べることを意味します。ジャイシャンカル外相がインドの反戦立場を改めて述べたことを表しています。"}, {"word": "humanitarian", "definition": "人道的な、または人類の福祉に貢献することを目的とした活動を指します。援助物資の提供などの人道支援活動に関連する用語です。"}, {"word": "frontier", "definition": "国境や未開拓地を意味しますが、ここでは紛争の最前線や焦点となっている地域を象徴的に表しています。"}]}, {"title_ja": "ネパール洪水の死者数が1,259人に増加、5,000人以上が行方不明", "title_en": "Nepal Flash Floods Death Toll Reaches 1,259; Over 5,000 Missing", "summary_ja": "8月26日のチベット国境付近での氷と岩の雪崩により引き起こされたネパール洪水による死者数は1,259人に増加し、5,000人以上が依然として行方不明となっている。救助隊は捜索活動を継続する一方、UNは破壊されたインフラのため援助物資の配送が極めて困難であると警告している。ネパール外相はこの災害を「ヒマラヤ津波」と呼び、先進国に気候関連被害に対する補償を促している。", "summary_en": "Nepal's death toll from devastating flash floods triggered by an ice-rock avalanche near the Tibet border has risen to 1,259, with over 5,000 people still missing more than a week after the August 26 disaster. Rescue teams continue search operations while the UN warns that delivering aid is extremely challenging due to destroyed infrastructure. Nepal's Foreign Minister called the disaster a 'Himalayan Tsunami' and urged industrialized nations to compensate vulnerable countries for climate-related damages.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nepal-flash-floods-live-updates-death-toll-rescue-operations-missing-persons-helpline-number-september-3-2026/article71422150.ece", "state_media": false, "category": "社会", "full_text": "A Buddhist monk looks at photographs of missing and deceased people pasted on wall outside Tribhuvan University Teaching Hospital, following flash floods and a mudslide, in Kathmandu, Nepal on September 1, 2026.\n| Photo Credit:\nReuters\nThe death toll due to the devastating flash floods in Nepal rose to 1,259 on Thursday (September 3, 2026) as more bodies were recovered from the affected areas while thousands remain missing after more than a week of the disaster, police said.\nAccording to the data released by Nepal Police, 355 bodies were recovered from Chitawan district, 218 from Nawalparasi East, 208 from Nawalparasi West, including 18 recovered from India and handed over to Nawalparasi West, and 177 from Nuwakot. Similarly, 127 bodies were recovered from Rasuwa district, 69 from Gorkha, 60 from Dhading and 38 from Tahanu.\nThe joint rescue teams led by the Nepal Army have continued their search and rescue efforts on the ninth day on Thursday (September 3, 2026), with the number of missing people estimated at 4,875.\nThe flash floods, triggered by an ice-rock avalanche near the Nepal-Tibet border on August 26, devastated towns and villages in northern and central Nepal, leaving a trail of destruction and thousands of people missing.\nPrime Minister Balendra Shah said the disaster’s link to climate change must be strongly raised with the international community, as symbolic funerals were held by families of locals still missing after last week’s flash floods.\nThe live blog is closed now,\nSeptember 03, 2026 19:44\nIndian team to continue tunnel rescue operations 'undeterred' by tough conditions: Amb Srivastava\nIndian envoy on Thursday visited Syabrubesi, the base of the Indian tunnel rescue team, and said that even though the conditions are tough, both Indian and Nepali teams will continue their work ‘undeterred.’ Indian tunnel rescue team established its base in Syabrubesi on Wednesday, which will help reduce the time taken to travel to Chilime Power House, where the rescue operations are taking place.- PTI\nSeptember 03, 2026 19:42\nNepal flood death toll at 1,259, missing figure jumps to 5,083\nDevastating floods on the China-Nepal border have killed at least 1,259 people in Nepal, the disaster authority said on Thursday, reporting a sharp rise in the number of missing, at 5,083.\nChinese state media reported 21 people killed in Tibet and 541 missing, taking the total toll from the August 26 disaster to 1,280 dead and 5,624 missing.- AFP\nSeptember 03, 2026 18:27\nTamil Nadu government arranges free DNA tests for relatives of those missing\nThe Tamil Nadu government on Thursday (September 3, 2026) announced that arrangements have been made to conduct DNA tests for relatives of pilgrims from the State, who have gone missing in Nepal during the recent floods, to facilitate identification.\nNepal flash floods: Tamil Nadu government arranges free DNA tests for relatives of those missing\nTamil Nadu offers free DNA tests for relatives of missing Nepal flash flood victims, aiding identification and rescue efforts.\nSeptember 03, 2026 16:27\nDelivering aid to Nepal flood survivors 'very, very difficult': UN\nReaching survivors of Nepal’s devastating floods is an immense challenge hampering the delivery of basic aid supplies, the United Nations warned on Thursday (September 3, 2026), considering the use of cargo drones and porters in addition to destroyed roads.\n“It is just incredible -- the magnitude of the disaster, the magnitude of the destruction,” UN Resident Coordinator Lila Pieters Yahia told reporters in Kathmandu.\n“Access has been very, very, very difficult,” Pieters Yahia said, noting that UN agencies had delivered water and and sanitation kits, as well as food and medicine.\n“Those are the most essential, particularly for the people who are in the epicentre.”\n“I feel desperate, it’s been so many days,” said 53-year-old U.S. citizen Sanjeev Rai who flew to Nepal to look for his wife, one of around 75 Americans missing.\n- AFP\nSeptember 03, 2026 16:03\nNepal calls Bhotekoshi floods 'Himalayan Tsunami', thanks international community for support\nNepal Foreign Minister Shisir Khanal called the massive floods that caused widespread devastation in the country a “Himalayan Tsunami” and thanked neighbouring countries and the international community for their support and solidarity during this difficult period.\nMr. Khanal’s comments came days after an interview with a private television channel, in which he identified China, the U.S., and India as the world’s three largest greenhouse gas emitters and said they have a “historical responsibility to compensate vulnerable nations like Nepal”.\nMr. Khanal said that the industrialised countries, which are responsible for carbon emissions, need to compensate a country like Nepal, which has a negligible contribution to carbon emissions.\nWhile briefing the international diplomats based in Kathmandu about the devastation caused by the Bhotekoshi River floods, Mr. Khanal said, “I want to cal", "translation_ja": "", "vocab": [{"word": "devastate", "definition": "甚大な被害をもたらす、破壊する。大規模な災害や事件により、物理的・心理的に大きな損害を与えることを意味する。"}, {"word": "avalanche", "definition": "雪崩、大量の物質が斜面を流れ落ちることを指す。この記事では氷と岩の崩落現象を表す。"}, {"word": "unprecedented", "definition": "前例のない、かつてない。比較対象がないほど大規模で異常な状況を表す。"}, {"word": "infrastructure", "definition": "インフラストラクチャー、社会基盤。道路、橋、電力網など社会機能を支える施設のこと。"}, {"word": "epicenter", "definition": "震源地、中心地。災害や問題が最も深刻な場所を指す。"}, {"word": "solidarity", "definition": "連帯、団結。共通の目的や苦難に向き合う際に示される相互の支援や共感。"}]}, {"title_ja": "TIFF世界初演『Always Lalisa』はBlackpinkスター・リサの栄光と苦難を追う", "title_en": "TIFF World Premiere 'Always Lalisa' Charts the Highs and Lows of Blackpink Star Lisa", "summary_ja": "トロント国際映画祭で公開されたドキュメンタリー『Always Lalisa』は、Blackpinkのメンバーであるリサの人生とキャリアを掘り下げています。このドキュメンタリーは、世界最大級の音楽グループでの国際的な名声の中で、タイ出身のK-popスターが直面した成功と課題の両方を検証しています。", "summary_en": "A new documentary titled 'Always Lalisa' premiered at the Toronto International Film Festival, exploring the life and career of Blackpink member Lisa. The film examines both the triumphs and challenges faced by the Thai-born K-pop star as she navigated global fame with one of the world's biggest music groups.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilgJBVV95cUxOVEI1c01jaGxvYVRjdTN1MDBkMU40SHpkU1B0aU8tWkpnS1JFSzR1UFhleXVNNHZrV182dDJkRzVBS2NoM2Rid182UzNfVjloNVVOTW5TZmpzODY5Wm5rTVUwUlpHTzZxTXpVOVJzS1BVR0dRanhIcVRWNWlnZzNSeE1MZ1ZNSDZMNzBRRVdDOWwtN1l6enNBTmNYS2JpZWRvMzFvQU5YRWotZ3k1M3k1aFZXYXpKWjlIWlFUdW9YUk5JRkVmSURiUE44eXM4cFo4SmpiX1IxZVRZdVlCRWo5ZmFyejdzWThxeEI3LVJDTFVkS3lRTkc4R1BIS0t2SVM5enoyNHBTQXRZQk1kdFNLc0M3Nkt2QQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ前大統領、マーク・カーニーが自分を「敵」にしたと非難 カナダ首相が47億ドルのVIA鉄道投資を発表", "title_en": "Trump accuses Mark Carney of making him 'the enemy' as PM announces $4.7B Via Rail investment", "summary_ja": "ドナルド・トランプ前大統領は、カナダの政治的緊張の中で、マーク・カーニーが自分を敵として描いていると非難した。カナダのジャスティン・トルドー首相は、広範なインフラ事業の一環として、VIA鉄道に47億ドルの投資を発表した。", "summary_en": "Donald Trump has accused Mark Carney of portraying him as an enemy amid political tensions in Canada. Prime Minister Justin Trudeau has announced a $4.7 billion investment in Via Rail as part of broader infrastructure initiatives.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikgJBVV95cUxQMjl3UlR1UWVTQjBPTHc5Z3ZOU3VW imes-centenary-anniversary.html", "state_media": false, "category": "政治", "full_text": "Zamfara State Governor, Dauda Lawal, won the Daily Times’ Outstanding Governor Award from the North–West at its centenary anniversary held in Abuja.\nThe governor received the award today at the DTN@100 Times Heroes Awards, organised by Nigeria’s oldest newspaper, to mark its 100th anniversary.\nGovernor Lawal was honoured based on his “leadership, public service and contribution to national development.”\nThe award was part of activities marking the centenary of the newspaper, which began publication in 1926 and has chronicled Nigeria’s political, economic, social and cultural development over the past century.\nChairman of the DTN@100 Heroes Awards Council, Bolaji Okusaga, said Governor Lawal was selected because he received the highest nominations in the North-West.\n“Following an extensive nomination and public voting process, you received the highest number of votes in this award category.\n“The Times Heroes Award Council and other key stakeholders subsequently confirmed your selection in recognition of your leadership, public service and contribution to national development,” Mr Okusaga said.\nGovernor Lawal thanked the Board, Management, and Organising Committee of the Daily Times Nigeria @100 Celebration, the Times Heroes Award Council, and all Nigerians who supported this nomination.\nThe governor said the honour reflects his dedication to promoting good governance and efficient public service in Zamfara State.\nOther distinguished Nigerians honoured include the Secretary to the Government of the Federation (SGF), Senator George Akume; former President of the African Development Bank (AfDB), Dr Akinwumi Adesina.\nThe newspaper said recipients of the DTN@100 Times Heroes Awards will be featured among the most outstanding personalities and institutions in the 700-page Nigerian Grand Book.\nThe publication will serve as a national commemorative volume and a lasting record of the people, institutions and achievements that have shaped Nigeria’s development.\nThe foreword to the Nigerian Grand Book has been written by President Bola Ahmed Tinubu.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "centenary", "definition": "100周年を記念する、またはそれに関する。特に100年の節目を祝う際に使用される正式な用語です。"}, {"word": "outstanding", "definition": "優れている、傑出している。能力や成果が平均を大きく上回ることを示します。"}, {"word": "nomination", "definition": "人や団体を特定の職位や賞の候補者として指名すること。推薦のプロセスです。"}, {"word": "commemorative", "definition": "特定の人物、出来事、または時間を記念するために作られた。記念として保存される価値を持ちます。"}, {"word": "stakeholders", "definition": "組織や事業の決定に影響を受ける、または影響を与える権益関係者。利益関係者全般を指します。"}, {"word": "governance", "definition": "組織や国家を運営・統治する方法や過程。良い統治は透明性と説明責任を含みます。"}]}, {"title_ja": "政治危機後、リバーズ州知事フバラが初の予算案に署名", "title_en": "Rivers Governor Fubara Signs First Budget After Political Crisis", "summary_ja": "リバーズ州のシミナライ・フバラ知事が、1.85兆ナイラの2026年度予算案に署名しました。これは2023年の就任以来、知事が承認した初めての予算です。この署名は、長期にわたる政治危機を経て、知事と州議会の関係が大きく変わったことを示しています。予算は財政規律と透明性を重視し、議会は調査待機中の60億ナイラを削除しました。", "summary_en": "Rivers State Governor Siminalayi Fubara signed the N1.85 trillion 2026 budget into law, marking the first budget he has assented to since taking office in 2023. The signing represents a significant shift in the governor's relationship with the state legislature following a prolonged political crisis. The budget emphasizes fiscal discipline and transparency, with the Assembly removing N6 billion in grants pending investigation while recommending funds for infrastructure repairs.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/907342-after-prolonged-crisis-fubara-signs-first-budget-as-rivers-governor.html", "state_media": false, "category": "政治", "full_text": "Rivers State Governor, Siminalayi Fubara, on Thursday, signed the N1.85 trillion 2026 Appropriation Bill into law, in what could mark a new phase in his administration’s relationship with the state legislature after a prolonged political crisis.\nThe signing, done at the Government House in Port Harcourt, is the first budget Mr Fubara has assented to as governor since assuming office in 2023.\nThe governor described the development as “a breath of fresh air” and expressed optimism that the passage and signing of the budget would usher in a period of cooperation among the state’s political actors.\nMr Fubara praised the Rivers State House of Assembly for what he described as its diligence in processing the budget, his spokesperson, Onwuka Nzeshi, said in a statement sent to PREMIUM TIMES.\nN1.85 trillion budget\nThe Assembly passed the budget earlier on Thursday, approving a total of N1,849,648,734,475.08 for the 2026 fiscal year ending 2 September 2027.\nMr Fubara had presented the budget, which he called the “Budget of Resilience for Growth and Development,” to the legislature in July. It proposed more than N1.4 trillion for capital expenditure and over N413 billion for recurrent expenditure.\nThe Assembly said its budget estimates were anchored on the Medium Term Expenditure Framework for 2026–2028, with emphasis on fiscal discipline and transparency in public revenue management.\nThe lawmakers, however, expunged N6 billion earmarked as grants for PAMO University of Medical Sciences and Wigwe University, pending an investigation into the actual beneficiaries, the spokesperson for the assembly speaker, Martins Wachukwu, said in a statement.\nThey also recommended funding for the Primary Health Management Board to rebuild its storage facility at No. 2 Accra Street, which was gutted by fire.\nFubara thanks Wike\nIn an indication of the changed political atmosphere, Mr Fubara specifically thanked his predecessor and current Minister of the Federal Capital Territory, Nyesom Wike, whom he described as “our leader”.\nThe acknowledgement is significant given the political crisis that erupted between Mr Fubara and Mr Wike and subsequently split the state’s political establishment and legislature.\nThe crisis produced bitter disagreements over the control of the Assembly, governance and political succession, with Mr Fubara and lawmakers loyal to Mr Wike frequently on opposing sides.\nBut Thursday’s ceremony presented a markedly different picture, with the governor and Assembly leadership publicly stressing cooperation.\nMr Fubara said his administration would continue to pursue its “Rivers First” agenda and make the welfare of residents central to the implementation of the budget.\n“I want to assure you that our intention will still remain the progress and development of our dear state,” he said.\nAssembly Speaker Martin Amaewhule, who commended the governor, said the budget showed that Mr Fubara was prepared to deliver democratic dividends to Rivers residents.\nThe Majority Leader, Major Jack, said the lawmakers expected the budget to “usher in the desired growth and development of the state”.\nMr Fubara ended the ceremony by promising a cordial relationship with the legislature and other stakeholders.\n“Let me thank everyone for this moment and assure you of our most cordial and cooperative relationship going forward,” he said.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "prolonged", "definition": "長期にわたる、長引いている状態を表す形容詞。ここでは政治危機が長く続いていたことを意味します。"}, {"word": "assented", "definition": "正式に同意・承認する動詞。法案や予算に対して行政府の長が署名することを指します。"}, {"word": "fiscal discipline", "definition": "財政規律の意味で、政府が予算管理と支出を厳格に管理する姿勢を表す専門用語です。"}, {"word": "expunged", "definition": "削除する、抹消することを意味する動詞。ここでは議会が予算から特定の項目を除去したことを示します。"}, {"word": "cordial", "definition": "友好的で暖かい関係や態度を表す形容詞。政治的対立から回復した協調的な関係を示します。"}, {"word": "democratic dividends", "definition": "民主主義の恩恵や利益を指し、民主的統治を通じた住民への福祉向上や開発を意味します。"}]}, {"title_ja": "ヨベ州、年間3億6000万ナイラを無料透析プログラムに支出", "title_en": "Yobe State Spends N360M Annually on Free Dialysis Programme", "summary_ja": "ヨベ州政府は、ヨベ州大学病院で年間約3億6000万ナイラを投資して無料透析サービスを提供しており、2017年以来毎月600～700回のセッションを実施している。同州は腎臓病治療インフラを拡大し、ガスアに追加の透析センターを設立し、腎臓移植の訓練と研究のために国際機関と提携している。", "summary_en": "Yobe State government invests approximately N360 million annually to provide free dialysis services at Yobe State University Teaching Hospital, conducting 600-700 sessions monthly since 2017. The state is expanding kidney disease treatment infrastructure by establishing an additional dialysis centre in Gashua and has partnered with international institutions for kidney transplant training and research.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/health/health-news/907316-yobe-govt-spends-n360m-annually-on-free-dialysis-scheme.html", "state_media": false, "category": "社会", "full_text": "The Yobe State government spends about N360 million annually to provide free dialysis services at the Yobe State University Teaching Hospital (YSUTH), Damaturu, the hospital’s Chief Medical Director, Baba Goni, has said.\nMr Goni said the hospital conducts between 600 and 700 free haemodialysis sessions every month under the programme, which has been running since 2017.\nHe disclosed this in an interview with the News Agency of Nigeria (NAN) in Damaturu on Thursday.\nAccording to him, the hospital spends N30 million monthly on the programme.\n“In dialysis, you don’t count the number of patients because one patient can have two or three sessions in a week,” he said.\n“The cost of dialysis per session in other teaching hospitals is about N50,000, excluding the cost of drugs, laboratory investigation and admission where necessary.”\nMr Goni said the state government had signed a Memorandum of Understanding (MoU) with a reputable company supplying dialysis consumables to ensure that the treatment was sustained.\nHe said the hospital also performed free fistula surgeries to have “vascular access” to patients with Chronic Kidney Disease.\nAccording to him, vascular surgeons are usually invited to conduct the procedure on patients while the hospital pays for the services and purchases the required consumables.\nThe CMD said a water treatment plant and five additional dialysis machines were recently procured, bringing the total number of functional dialysis machines at the facility to 11.\nMr Goni said that plans had reached an advanced stage to establish another dialysis centre at the Specialists’ Hospital, Gashua, the epicentre of kidney disease in the state.\nHe said the proposed dialysis centre in Gashua was captured in the 2026 budget to justify the commitment of the state government to the project aimed at easing the suffering of the people.\n“Recently, we travelled to Ghana with the Commissioner for Health, where we negotiated with some partners to bring in these dialysis machines and train our nurses and medical engineers who will maintain them,” he said.\n“Very soon, people will start enjoying these services over there, so that they don’t have to bear the inconvenience and transportation cost of coming to Damaturu for the treatment.\n“I am using this medium to appeal to our people for their understanding of the complex nature of planning and implementation of government projects, which usually take some time.”\nMr Goni announced that a preliminary report on the 2025 kidney disease research, sponsored by the state and conducted in Gashua, would soon be submitted to Governor Mai Mala Buni for necessary action.\nHe, however, said the report would be thoroughly scrutinised before causality could be established because drawing conclusions on things that were not clear could have economic consequences.\nREAD ALSO: Katsina health workers to begin 7-day warning strike 8 Sept\n“Sometimes the report may suggest action to be taken against the economic livelihood of the communities. We don’t want to do that if we are not fully convinced because poverty is also a problem.\n“Remember, during the COVID-19 pandemic, communities were locked down, and the consequences were worse than COVID because many people could not go out to fend for their families,” he said.\nMr Goni said the state and the Urology and Nephrology Centre, Mansoura in Egypt, had, in 2018, signed a Memorandum of Understanding (MoU) for training doctors and other specialists at the YSUTH on kidney transplant.\nHe said although, the programme was obstructed by the COVID-19 pandemic, efforts were made to resume its implementation.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "haemodialysis", "definition": "血液を体外で浄化する医療処置で、腎臓が機能しない患者に用いられる治療法。慢性腎臓病患者が定期的に受ける必要がある。"}, {"word": "vascular access", "definition": "透析治療を行うために、血管に針を挿入するための通路を作成することを意味する医学用語。手術により静脈と動脈を接合して造設される。"}, {"word": "Memorandum of Understanding", "definition": "二者以上の当事者間で締結される非公式な合意書。法的拘束力は弱いが、協力や提携の意向を示す文書である。"}, {"word": "epicentre", "definition": "特定の問題や現象の中心地点、または最も影響が大きい地域を指す。地震などの場合は震源地という意味でも使われる。"}, {"word": "causality", "definition": "原因と結果の関係性を指す概念。科学的調査で、一つの事象が別の事象の直接的な原因であることを証明すること。"}, {"word": "consumables", "definition": "定期的に消費または使用される物資や材料。医療の場合は、注射針、チューブ、薬液など繰り返し購入が必要な物品を指す。"}]}, {"title_ja": "ロシアとウクライナ、終わりの見えないエスカレーション", "title_en": "Russia and Ukraine Locked in Escalating Conflict With No Clear End", "summary_ja": "ロシアとウクライナは相手国の降伏を強要するためにミサイルとドローン攻撃を激化させており、人道的な苦難をもたらしている。破壊的な被害にもかかわらず、どちらの国の決意も弱まる兆候は見られない。紛争は膠着状態に陥ったままで、解決への道筋は見当たらない。", "summary_en": "Russia and Ukraine continue an intensifying cycle of missile and drone attacks aimed at forcing the other side to surrender, resulting in widespread human suffering. Despite the devastating toll, there are no signs that either nation's resolve is weakening. The conflict remains at a stalemate with no visible path toward resolution.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/03/world/europe/russia-ukraine-escalation.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ノルウェーが北極海でロシア船舶を押収、モスクワの対抗姿勢を試す", "title_en": "Norway Seizes Russian Ship in High Arctic, Escalating Asset Seizures", "summary_ja": "ノルウェーは国際法廷の命令に基づき、北極海でロシア船舶を押収した。この行動はロシア資産没収に向けた国際的な取り組みの一環である。ロシアはこれを海賊行為と非難している。", "summary_en": "Norway has captured a Russian vessel in the Arctic under an international court order as part of a coordinated global effort to seize Russian assets. Moscow has denounced the action as piracy. The seizure represents an escalation in enforcement measures against Russia.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/03/world/europe/norway-russian-research-ship-arctic.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハイチ：ギャング暴力の中での選挙立候補", "title_en": "Running for Office Amid Gang Violence in Haiti", "summary_ja": "ハイチの選挙当局は12月13日の選挙を予定していますが、専門家らはギャング暴力の激化により再延期される可能性が高いと警告しています。同国は民主的な選挙実施を脅かすセキュリティ上の課題に直面し続けています。", "summary_en": "Haitian election officials have scheduled elections for December 13, but experts warn that escalating gang violence may force another postponement. The country continues to struggle with security challenges that threaten the viability of holding democratic elections.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/03/world/americas/haiti-election-gangs.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事地帯の通行を許可、パレスチナ人がガザ北部への帰還開始", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Military Crossing Restrictions", "summary_ja": "イスラエルは人質解放をめぐる交渉の膠着状態が打開された後、ガザを二分する軍事地帯の通行をパレスチナ難民に許可した。数千人の住民が徒歩でガザ北部への帰還を始めている。この動きは数週間の停戦交渉の膠着状態を経ての大きな転換を示している。", "summary_en": "Israel has permitted displaced Palestinians to cross through a military zone dividing Gaza after negotiations over hostage releases reached a breakthrough. Thousands of residents are now moving on foot back to the northern part of the enclave. The crossing represents a significant shift following weeks of deadlock in ceasefire talks.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発業者が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "Leading China Property Developer Reports Huge Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国の大手不動産開発業者である万科が巨額の損失を報告し、中国の不動産危機の深刻化への懸念が高まっている。同社の経営難により、中国政府がこのセクターの安定化に介入するかどうかについての疑問が生じている。業界関係者は、不動産の低迷が市場全体に広がり続けるかどうかを注視している。", "summary_en": "Vanke, a major Chinese property developer, has reported significant losses, raising concerns about the deepening real-estate crisis in China. The financial troubles at the company have sparked questions about whether the Chinese government will intervene to stabilize the sector. Industry observers are watching closely to see if the property downturn will continue to spread across the market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃から弾片が体内に残存", "title_en": "Israeli Hostages Released With Shrapnel Injuries From October 7 Attack", "summary_ja": "イスラエルの医療関係者によると、最近解放されたイスラエル人人質の体内には10月7日の攻撃から弾片が埋まったままの状態にあるという。一部の女性人質は長期間隔離され、8ヶ月間はトンネル内に監禁されていた。この事実は、抑留中に経験した深刻な身体的・心理的トラウマを浮き彫りにしている。", "summary_en": "Recently freed Israeli hostages still carry shrapnel embedded in their bodies from the October 7 attack, according to Israeli medical officials. Some of the women hostages were held in isolation for extended periods and spent eight months confined in tunnels. The revelation highlights the severe physical and psychological trauma experienced by those held captive.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "仕事が家族をより平等にする方法", "title_en": "How work makes families more equal", "summary_ja": "エコノミスト誌は、仕事を通じた経済的自立がいかに家族内の不平等を減らすかを探求している。複数の家族メンバーからの経済的貢献は、より均衡の取れた力関係と意思決定につながると主張している。", "summary_en": "The Economist explores how financial independence through work can reduce inequality within families. The article argues that economic contribution from multiple family members leads to more balanced power dynamics and decision-making.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/03/how-work-makes-families-more-equal", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ戦争が激化、スウェーデンは50年間のロシア対立に備える", "title_en": "Ukraine War Intensifies as Sweden Prepares for Decades of Russian Confrontation", "summary_ja": "ウクライナの同盟国スウェーデンは、ウクライナ戦争が激化・拡大する中、ロシアとの対立が最大50年続く可能性に備えている。この悲観的な見通しは、紛争の持続可能性と軍事的エスカレーションへの懸念の高まりを反映している。地域の安定性は継続する軍事的対立によって脅かされたままである。", "summary_en": "Sweden, a Ukrainian ally, is bracing for a prolonged conflict with Russia lasting up to 50 years as the Ukraine war intensifies and expands. The bleak outlook reflects growing concerns about the sustainability and escalation of the conflict. Regional stability remains threatened by the ongoing military confrontation.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/01/the-ukraine-war-is-intensifying-expanding-and-stuck", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIが宗教を変え、宗教がAIを変えようとしている", "title_en": "AI is changing religion and religions are trying to change AI", "summary_ja": "人工知能がますます高度になる中、宗教機関はチャットボットの精神的指導における役割について重大な問題に直面しています。宗教指導者たちは、AIがイマームや司祭に代わるのか、それとも彼らの影響力と影響範囲を拡大するための道具として機能するのかについて議論しています。", "summary_en": "As artificial intelligence becomes increasingly sophisticated, religious institutions face a critical question about chatbots' role in spiritual guidance. Religious leaders debate whether AI will replace imams and priests or serve as a tool to expand their reach and influence.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/27/ai-is-changing-religion-and-religions-are-trying-to-change-ai", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "干ばつと熱波の夏を経て、政府は農業危機に直面", "title_en": "France's Government Faces Agricultural Crisis After Summer of Drought and Heatwaves", "summary_ja": "干ばつと熱波に見舞われた夏の後、フランスの農業部門は深刻な困難に直面している。当初9月3日予定だった政府の支援計画は延期され、農業代表団体が当局への圧力を強めている。数日中に発表が予定されている。", "summary_en": "France's agricultural sector faces severe difficulties following a summer marked by drought and heatwaves. The government has delayed its aid plan, originally scheduled for September 3, as farm representative organizations intensify pressure on authorities. An announcement is expected in the coming days.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/economy/article/2026/09/03/after-a-summer-of-drought-and-heatwaves-the-government-faces-brewing-agricultural-crisis_6757131_19.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フォルクスワーゲン、2030年までに10万人のリストラを計画", "title_en": "Volkswagen to Cut 100,000 Jobs by End of Decade", "summary_ja": "フォルクスワーゲンは2030年までに100,000人の職を削減する計画を発表した。これは世界中の従業員の約15%に相当し、自動車業界史上最大のリストラクチャリングとなる。電気自動車への転換と市場変化への適応を背景とした大規模な経営転換を示している。", "summary_en": "Volkswagen plans to eliminate 100,000 positions by 2030, representing approximately 15% of its global workforce. This restructuring will be the largest in automotive industry history, signaling a major transformation as the company adapts to market changes and the shift toward electric vehicles.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/economy/article/2026/09/03/volkswagen-plans-to-cut-100-000-jobs-by-end-of-decade_6757136_19.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン機密報告書、モロッコがセウタへの越境を容認したと主張", "title_en": "Leaked Report Claims Morocco Allowed Mass Crossings into Spanish Enclave Ceuta", "summary_ja": "スペインの機密報告書は、最近の移民危機の際にモロッコの警察官がスペイン飛び地セウタへの不正な越境を助長したと主張しています。リークされた文書はペドロ・サンチェス首相のモロッコが事件を組織化しなかったとの主張に矛盾し、モロッコ当局による意図的な容認政策を示唆しています。", "summary_en": "A confidential Spanish report alleges that Moroccan police officers facilitated unauthorized crossings into the Spanish enclave of Ceuta during a recent migration crisis. The leaked document contradicts Prime Minister Pedro Sanchez's claims that Morocco did not orchestrate the incident, suggesting instead a policy of deliberate permissiveness by Moroccan authorities.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/09/03/leaked-spanish-report-claims-total-permissiveness-of-morocco-over-ceuta-crisis_6757116_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省ニュースレター", "title_en": "Mindef Newsletter", "summary_ja": "海峡時報のシンガポール国防省（Mindef）に関するニュースレターです。読者はより多くの無料ニュースレターを購読し、提供されたリンクを通じて購読を管理できます。", "summary_en": "This is a newsletter from The Straits Times covering Ministry of Defence (Mindef) updates. Readers can subscribe to receive more free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズのイブニング・アップデートは、毎日のニュースハイライトと最新情報を提供します。読者はザ・ストレーツ・タイムズのプラットフォームを通じて、追加の無料ニュースレターを購読し、購読設定を管理できます。", "summary_en": "The Straits Times Evening Update provides daily news highlights and updates. Readers can subscribe to additional free newsletters and manage their subscription preferences through The Straits Times platform.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズのモーニングブリーフィングは、購読者向けの毎日のニュース更新と重要な情報を提供しています。読者はニュースレター購読を管理し、ザ・ストレーツ・タイムズから追加の無料ニュースレターにアクセスできます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and essential information for subscribers. Readers can manage their newsletter subscriptions and access additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランの脅威報告を受けてIDF、ヒズボラの重要拠点を制圧", "title_en": "IDF Takes Over Hezbollah Stronghold Amid Iran Threat Reports", "summary_ja": "イスラエル国防軍は、イランからの脅威が高まる中、ヒズボラの主要な拠点の制圧を発表した。この作戦は、イスラエルとイランが支援する武装勢力間の地域的緊張の重要な軍事的展開となっている。", "summary_en": "The Israeli Defense Force announced it has seized control of a major Hezbollah stronghold following escalating threats from Iran. The operation marks a significant military development in the ongoing regional tensions between Israel and Iranian-backed militant groups.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikgJBVV95cUxQdXk2N2gwN3pLUXBxNld0WGhmaC1famhfTlg2ejVVS3lONTVydThMQW1xQmNwdkxkTi1BZHdDcXFBTk0wcGtvSkxqLVV5UGdmX1dBMkN6ZEdPMGN6TURTQmp0cDZQYW9NcHZoSDY3bW1iaExqNDd1aUF5Nld2WDlsaVM4MzVVUGNfUEFucEVzTFhHTlNTSXFqeFlwTE5XeU5vb2Q4aXJPOFEtSm9zOF9JM2FicTAxakVyZG1sQ0xZOGZfYVNqVUR0NmdXOWRFb0phRW5CTDdsUE5PRl80THpQSWhhMTkwMUd3UTBNS1NtTEhjSTI5NWFnNXdybVo4Zi14a2tUSkJ5aE9yNjc2b20tWGxR?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの入植者は言葉を行動に変える。反対派も同様にすべきだ", "title_en": "Israeli Settlers Turn Words Into Action. So Should Their Opponents", "summary_ja": "この記事は、イスラエルの入植者が単なる言葉ではなく具体的な行動を通じて彼らの議題を実行する方法について論じています。入植地拡大に反対する者たちも、声明を超えて、これらの取り組みに対抗するための実質的な行動を起こすべきだと主張しています。", "summary_en": "The article discusses how Israeli settlers are actively implementing their agenda through concrete actions rather than rhetoric alone. It argues that opponents of settlement expansion must similarly move beyond statements and take meaningful steps to counter these efforts.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikwJBVV95cUxPTllGZVJxb2RSRHZHcXlVaFh4QXI0NDRYaDZYTjdidlRKY0c1M3B6N3JlRGduZmJpUWl0el96WWVZTjZLTHp2WjJRZGVtdWtXZ3BGdnFNZFZJNXhLT2lFckItaE4tT2xTbHh1Q0dTcDN1TzJnZ1RKRXJoMElnM1c3azNEXzlUaUNsWnh6TzJNalA3Nm9pYk9pM0dyTFNnYVBqZ193bUZvV2lUblRiU00xNmZDZG13WXRaMnV2dmc5aU1vT3dDemNfeHJhWXRWNnRjRl9nS3NydXo4QmlwbG1mcklLSXVELTAxdjkxeUZVS2loellXLVZPcWZ4NVI3RDB0cFdWbnRocWVPUDJsV2NzUzcwUQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフのイスラエルを自滅させるカハニスト憎悪讃歌", "title_en": "Kahanist Hate Anthem Reflects Netanyahu's Self-Destructive Israel", "summary_ja": "ハアレツはネタニヤフ指導下のイスラエル政治にカハニスト思想がどのように浸透しているかを分析している。この論説は極端主義的なレトリックと政策がいかにイスラエルの民主主義の基盤と国際的地位を損なっているかを検証している。", "summary_en": "Haaretz analyzes how Kahanist ideology has permeated Israeli politics under Netanyahu's leadership. The opinion piece examines how extremist rhetoric and policies are undermining Israel's democratic foundations and international standing.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikgJBVV95cUxNTDQyWk9lb0pvbmVMTF9hRTViNkpPZUhlNG00VWhGTE1wOV8yUVE1T2ZFeEp3VlpSOG5taUJSR2xrOVZuZmxuZnZ1akhxcjdlQ0Y5Z0cxLWxLclY4QWxSRDFkUmNmUU1vYzl0YlA1RHpmcllmRlZ6M013alRwQUJZRmE0cE1ScjFfaEVmUU54cWFUZ2p3R2tSajk5ckJEbXJZMzU5NGJkUXdyVmFEcGxJM2MzNGlRYkJZMFlPN3BtT0FEY1o2Wmw1TThZZndIZ3JIZnRZSnJ6RnRsQTVaYmJFcVQyTVVZSnA1dXVCblM3ZlI3SkJSUlpJTDN3ZC01N0RHa1Q2d0pTM1ZuakI3ZW9TSmJn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "新報告書が示すPLAの島嶼上陸作戦能力の優先化", "title_en": "PLA Prioritizing Joint Island-Landing Capabilities: New Report", "summary_ja": "新しい報告書によれば、中国人民解放軍（PLA）は統合的な島嶼上陸作戦能力の開発を優先させている。アナリストによると、この戦略的焦点は潜在的な両生作戦への軍事準備の強化を示唆している。この調査結果は、PLAが各軍種にわたる統合軍事作戦を強調していることを明らかにしている。", "summary_en": "A new report indicates that China's People's Liberation Army is prioritizing the development of joint island-landing capabilities. According to analysts, this strategic focus suggests enhanced military preparations for potential amphibious operations. The findings highlight the PLA's emphasis on coordinated cross-service military operations.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1WcWFlM1F2MUhNbmVTMjNkXzc0eUZfbnd6bS15bnRTbG1QdTZBQUpLYk5EcHFCa3ZVWWlpQkYxSGF6aFV5alI4bVpLUWdFM19WYXpaaFllQQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、ソロモン諸島メディアの「小切手外交」非難に反論", "title_en": "Taiwan Denies 'Checkbook Diplomacy' Accusations from Solomon Islands Media", "summary_ja": "台湾はソロモン諸島のメディアが提起した「小切手外交」の疑惑に対して反論を行った。台湾は太平洋島嶼国との外交関係と経済的パートナーシップの維持を継続している。", "summary_en": "Taiwan has refuted claims of practicing 'checkbook diplomacy' made by media outlets in the Solomon Islands. The denial comes as Taiwan continues to maintain diplomatic relations and economic partnerships with Pacific island nations.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5rTUx3LU1FVGRFemJ6NmY4Z1RCZ19Ea3NMdUVkaE9Bbi1DZW9Kc20xWkc1UmxkQ19XUGQ4d1BKR1ptMzVrVkFWZTBGaHotWFZxdW15TFV6OA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "原発再稼働承認が迫る中、国民党がライ総統に謝罪を要求", "title_en": "KMT Demands Lai Apologize as Nuclear Power Restart Nears Approval", "summary_ja": "台湾野党の国民党は、政府が原発の再稼働に向けて動きを進める中、ライ・チンテ総統に謝罪を求めている。この要求はエネルギー政策に関する国民党の立場を反映し、政治的な緊張が続いている。原発再稼働の取り組みは野党の批判にもかかわらず進行している。", "summary_en": "Taiwan's opposition KMT party is calling for President Lai Ching-te to apologize as the government moves closer to restarting nuclear power operations. The demand reflects the KMT's position on energy policy amid ongoing political tensions. The nuclear restart initiative continues to advance despite the opposition's criticism.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE52NkNuX25NLTN1TGdyUl9HanlFTEhGVDJoR0VPbjN1T1hMVzRRejJjeGVQLUpYSkplSUx6SGRXYmFVRGk2X3EzdkRhcHdEaTlsdTl1dE11dw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領がイランへの追加攻撃の準備を表明、テヘランは報復を誓約", "title_en": "Trump Says US Ready for More Iran Strikes as Tehran Vows Retaliation", "summary_ja": "CGTNは、トランプ米大統領が水曜日、米軍がいつでもイランへの追加攻撃を実行する準備ができていると述べたと報じています。CGTNは、テヘランが報復を誓約し、ワシントンが民間インフラを標的にしていると非難していると報じています。", "summary_en": "CGTN reports that US President Donald Trump stated on Wednesday the US military is prepared to conduct additional strikes against Iran at any time. CGTN reports that Tehran has vowed to retaliate and accused Washington of targeting civilian infrastructure.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-03/Trump-says-US-ready-for-more-Iran-strikes-as-Tehran-vows-to-retaliate-1Q839svh3q0/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "習近平主席、エジプト公式訪問を終えて出国", "title_en": "President Xi Jinping concludes state visit to Egypt", "summary_ja": "CGTNによると、中国の習近平主席は水曜日にカイロを出発し、エジプトへの公式訪問を終えた。同訪問は中国とエジプト間の継続的な外交関係を示すものである。訪問の成果や合意内容については報告書に詳細が記載されていない。", "summary_en": "CGTN reports that Chinese President Xi Jinping departed Cairo on Wednesday, concluding his state visit to Egypt. The visit represents continued diplomatic engagement between China and Egypt. Details regarding outcomes and agreements from the visit were not provided in the report.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-03/President-Xi-Jinping-leaves-Egypt-after-state-visit-1Q7E8P4nOq4/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国とベネズエラが石油取引に合意", "title_en": "US and Venezuela Reach Oil Deal", "summary_ja": "CGTNは、米国とベネズエラが石油取引に合意したと報じています。提供されたエクセプトには、この合意の条件と影響に関する詳細は示されていません。この動きは、両国間の関係における重要な転換を示しています。", "summary_en": "CGTN reports that the US and Venezuela have reached an oil deal. Details regarding the terms and implications of the agreement were not provided in the available excerpt. The development marks a significant shift in relations between the two countries.", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-09-01/US-and-Venezuela-reach-oil-deal-1Q4wj7LgBKU/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、プーチン大統領のG20サミット招待をまだ検討していないと述べる", "title_en": "Trump says he has not yet considered inviting Putin to G20 summit", "summary_ja": "TASS/RTが報じるところによると、米国大統領トランプ氏は、12月に米国で開催予定のG20サミットへのロシア大統領プーチン氏の招待について、まだ検討していないと述べた。同報道によれば、4月下旬にトランプ氏は以前、プーチン氏のサミット出席は非常に有用であろうとジャーナリストに語っていた。", "summary_en": "TASS/RT reports that US President Trump stated he has not yet considered whether to invite Russian President Putin to the G20 summit scheduled for December in the United States. The report notes that in late April, Trump previously told journalists that Putin's presence at the summit would be very useful.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2182387", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル、レバノンのアリ・アル・タヘル尾根からヒズボラ関連施設を撤去したと報告", "title_en": "Israel reports clearing Lebanon's Ali al-Taher Ridge of Hezbollah infrastructure", "summary_ja": "TASS報道によると、イスラエル国防軍（IDF）はレバノンのアリ・アル・タヘル尾根からヒズボラ関連施設の撤去を完了したと発表した。国営メディアの引用によると、イスラエル軍は同地域を「テロリストから解放した」と述べている。本報道はこの地域におけるイスラエルの軍事作戦を反映している。", "summary_en": "TASS reports that the Israeli Defense Force (IDF) stated it has cleared Ali al-Taher Ridge in Lebanon of what it describes as Hezbollah infrastructure. According to the IDF statement cited by the state-controlled source, the Israeli military also reports having \"cleared the area of terrorists.\" The report reflects Israel's military operations in the region.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2182385", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ヴァンス米大統領、イラン対策で秘密工作の可能性を示唆", "title_en": "Vance Says All Options Including Covert Operations Possible Against Iran", "summary_ja": "RTは、米国のヴァンス大統領がイランに関して「起こりうるあらゆることがテーブルの上にある」と述べ、秘密工作による圧力の可能性を示唆したと報じた。同大統領の発言は、イランへの圧力をかけるための幅広い行動選択肢が検討されていることを示唆している。", "summary_en": "RT reports that US President Vance stated that 'everything that could happen is on the table' regarding Iran, suggesting the possibility of covert subversive operations. The statement indicates a broad range of potential actions being considered to pressure Iran, according to the source.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2182383", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "インドの回復力は多角化された貿易に依存している", "title_en": "India's Resilience Depends on Diversified Trade", "summary_ja": "インドはトランプ大統領の復帰後、単一の貿易相手国との関係悪化による壊滅的な影響を回避するため、複数の二国間・多国間貿易協定を通じて貿易パートナーシップを積極的に多様化させている。著者は、インドが貿易関係を継続して拡大する一方で、第三国に対する戦略的自由度を制限する二国間協定には慎重になるべきだと主張している。この戦略は、特にトランプ政権の復帰に伴う地政学的不確実性に対するインドの戦略的対応を反映している。", "summary_en": "India is actively diversifying its trade partnerships through multiple bilateral and multilateral agreements to reduce dependence on any single trading partner and mitigate risks from potential trade disruptions. The author argues that India should continue expanding trade ties while carefully avoiding bilateral agreements that would limit its strategic autonomy regarding third countries. This approach reflects India's strategic response to geopolitical uncertainties, particularly following Trump's return to the U.S. presidency.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/india-must-continue-to-diversify-trade-to-boost-security-by-shekhar-aiyar-2026-09", "state_media": false, "category": "オピニオン", "full_text": "India’s Resilience Depends on Diversified Trade\nIndia has signed a flurry of trade deals since Donald Trump’s return to the White House in an attempt to ensure that no single bilateral rupture will cause catastrophic harm. It should continue to expand its trade ties, while being wary of any bilateral agreement that curtails its freedom of action vis-à-vis third countries.\nNEW DELHI—Indian Prime Minister Narendra Modi’s participation in the recently concluded Shanghai Cooperation Council meeting in Kyrgyzstan was about more than regional security; he also used the forum to push for deeper trade links between member states. This is only the latest example of India’s proactive pursuit of trade diplomacy. Last year’s free trade agreement (FTA) with the United Kingdom was followed this January by the “mother of all deals,” a wide-ranging agreement with the European Union. And high-level trade talks continue with the United States, building on a joint statement of intent issued in February.", "translation_ja": "", "vocab": [{"word": "resilience", "definition": "困難や変化に耐える能力、または回復力のこと。ビジネスや経済の文脈では、市場変動やリスクに対処できる強さを意味する。"}, {"word": "bilateral", "definition": "2つの国家や団体の間の相互的な関係を指す。通常、二国間協定や二国間交渉などの形式で使用される。"}, {"word": "rupture", "definition": "関係の断絶や破裂を意味する。政治経済の文脈では、国家間の貿易関係や外交関係の急激な悪化を指す。"}, {"word": "autonomy", "definition": "自主性や自立性を意味する。国家や組織が独立して意思決定を行う権利や能力を指す。"}, {"word": "proactive", "definition": "先制的に、または事前に行動することを意味する。受け身的ではなく、積極的に問題に対処する姿勢を表す。"}, {"word": "geopolitical", "definition": "地政学的な、つまり地理的位置と政治的・経済的利益の関係を分析する観点を指す。国際関係や戦略に関連する用語。"}]}, {"title_ja": "二転三転する通商政策が海外直接投資を抑制している", "title_en": "Whipsaw Trade Policy Is Depressing Foreign Direct Investment", "summary_ja": "著者は、トランプ大統領の矛盾した関税発表に代表される不安定で予測不可能な通商政策が、海外直接投資に大きな悪影響を与えていると主張している。国内利益を追求するために通商制限を選択することはできるが、政策の一貫性と予測可能性は、頻繁な方針転換よりもはるかに重要であると述べている。", "summary_en": "The author argues that volatile and unpredictable trade policies, exemplified by Trump's inconsistent tariff announcements, cause significant damage to foreign direct investment inflows. While countries may pursue trade restrictions for domestic interests, policy consistency and predictability are far more important than frequent reversals in discouraging FDI.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/trade-policy-uncertainty-impact-on-fdi-by-jonathan-d-ostry-2026-09", "state_media": false, "category": "オピニオン", "full_text": "Whipsaw Trade Policy Is Depressing Foreign Direct Investment\nIf a country opts for higher trade restrictions to promote its perceived domestic interests, a predictable policy is far superior to a volatile one. As new research shows, uncertainty causes unnecessary and large collateral damage to FDI inflows.\nTORONTO—When US President Donald Trump warned business leaders in Davos last year that tariffs were coming, he offered a word of friendly advice: “Come make your product in America” and thereby sidestep looming import duties from the get-go. In the months that followed, Trump’s America First trade policy took shape. The “Liberation Day” tariffs were announced, paused, restored, found to be unconstitutional, and then replaced by duties enacted under different legislation.", "translation_ja": "", "vocab": [{"word": "whipsaw", "definition": "急激な変動や揺れを指し、通常は反対方向への急激な連続的な変化を意味する。貿易政策や市場における不安定性を表現する際に用いられる。"}, {"word": "collateral damage", "definition": "主要な目標達成の副産物として生じる予期しない悪影響や被害を指す。経済政策の意図しない負の波及効果を表現する際に用いられる。"}, {"word": "volatile", "definition": "急激に変動しやすく不安定な状態を意味する。政策や市場が予測困難で急激な変化を起こしやすいことを表す。"}, {"word": "sidestep", "definition": "問題や困難を回避する、または避けるという意味の動詞。ビジネス戦略において制約を巧みに回避することを指す。"}, {"word": "FDI inflows", "definition": "Foreign Direct Investment の略で、外国から国内への直接投資の流入を意味する。企業が他国に工場や施設を建設・買収する際の投資額を指す。"}, {"word": "enact", "definition": "法律や規制を正式に制定・施行する動詞。政府が新しい政策や法令を公式に成立させることを表す。"}]}, {"title_ja": "極右勢力による近代建築への攻撃がなぜ重要なのか", "title_en": "Why the Far Right's War on Modern Architecture Matters", "summary_ja": "著者は、極右政党ドイツのための選択肢（AfD）の建築への執着が、彼らの排他的な政治的議題に結びついたより深い戦略を反映していると主張している。AfDは連立政権の拒否によって国政での権力から阻止されているため、州レベルでの文化政策は彼らが直接政策に影響を与え、極右イデオロギーを推し進めることができる数少ない領域の一つである。", "summary_en": "The author argues that the far-right Alternative for Germany (AfD) party's focus on architecture reflects a deeper political strategy tied to their exclusionary agenda. Since the AfD has been blocked from national power through coalition firewalls, cultural policy at the state level—including attacks on modern architecture—represents one of the few areas where they can directly influence policy and advance their far-right ideology.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/understanding-the-far-right-afd-war-on-bauhaus-architecture-by-jan-werner-mueller-2026-09", "state_media": false, "category": "オピニオン", "full_text": "Why the Far Right’s War on Modern Architecture Matters\nThe Alternative for Germany’s fixation on architecture is more revealing than it may seem. Cultural policy is not only one area where the party can actually change conditions on the ground at the state level; it is also intimately tied to far-right forces’ exclusionary political agenda.\nPRINCETON—Although the far-right Alternative for Germany (AfD) has been surging in the polls for two years, it has been kept from power by other parties’ refusal to enter governing coalitions with it. But since this “firewall” relies on the AfD never winning outright majorities, it could be fatally undermined by this weekend’s state election in Saxony-Anhalt.", "translation_ja": "", "vocab": [{"word": "firewall", "definition": "政治的な障壁または防御線のこと。ここでは、他の政党がAfDとの連立を拒否することで、彼らの権力奪取を防ぐメカニズムを意味する。"}, {"word": "exclusionary", "definition": "特定の人々や集団を除外する、または排除する性質を持つ。政治的文脈では、多様性や包括性を拒否する政策や態度を示す。"}, {"word": "coalition", "definition": "共通の目的のために一緒に集まった複数の政党やグループ。民主主義の政治体制では、単一政党が多数派を形成できない場合に政府を形成するために必要とされることが多い。"}, {"word": "fatally", "definition": "致命的に、または決定的な形で。この文脈では、システムや戦略に回復不可能なダメージを与える可能性があることを意味する。"}, {"word": "surge", "definition": "急速に増加または上昇すること。政治的文脈では、支持率や人気が急激に高まることを指す。"}, {"word": "far-right", "definition": "政治スペクトラムの極端な右翼端にある政治的立場。通常、民族主義、権威主義、伝統主義の要素を特徴とする。"}]}, {"title_ja": "グロリア・スタイネム：フェミニズムを大衆運動へと変えた顔", "title_en": "Gloria Steinem: The Face Who Made Feminism a Mass Movement", "summary_ja": "モイラ・ドノヴァンは、グロリア・スタイネムが有名人としての戦略的な活用、メディアへの精通、そして象徴的な公的人格を通じて、フェミニズムを周辺運動からアメリカの主流意識へと変えたと主張している。彼女の突出は利己的な野心ではなく、多様なフェミニスト声を統一し、フェミニスト的優先事項を民主党政治に推し進めた寛容な連合構築であるとドノヴァンは特徴づけている。", "summary_en": "Moira Donegan argues that Gloria Steinem transformed feminism from a fringe movement into mainstream American consciousness through strategic use of celebrity, media savvy, and her iconic public persona. Rather than viewing her prominence as opportunistic ambition, Donegan characterizes Steinem's role as generous coalition-building that unified diverse feminist voices and successfully pushed feminist priorities into Democratic politics.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/03/gloria-steinem-us-feminist-movement", "state_media": false, "category": "オピニオン", "full_text": "By the time she died on Wednesday, at 92 years old at her home in New York, Gloria Steinem was synonymous with feminism, a kind of human mascot for the movement. So it can be easy to forget that when she was born, feminism was over. It was something that had been faddish years before, among women who were now old ladies; something that seemed, in retrospect, like it might have been a bit overwrought and out of touch. To the girl Gloria Steinem, growing up in Ohio in the 1930s and 40s, the suffrage movement that had gained women the right to vote less than two decades prior probably seemed remote – especially to a girl like her, growing up itinerant and poor under the care of a single mother who was plagued by a violent and debilitating mental illness. You might say that growing up, Steinem had worries that were more immediate than the status of women.\nBut experience has a way of radicalizing women about their own gendered condition. Steinem attended Smith, and her education opened up previously unhoped for possibilities. En route to a postgraduate fellowship in India in 1957, when she was in her early 20s, she had an illegal abortion in London. Later, in 1969, while she was working as a journalist for New York magazine, she attended an “abortion speak-out” put on by a group of radical women from the emergent fringe of what was then called the Women’s Liberation movement.\nThe women, crowded into a church near Washington Square Park, talked about being blindfolded in the backs of cars as the mobsters drove them to motels, where illegal abortions were performed by drunk, lascivious or simply cruel doctors. They talked about having to threaten suicide, over and over, to get a legal exemption; they talked about lying in hospital wards, hemorrhaging or riddled with sepsis, unsure that they would live. Their rage at the pain and humiliation struck something in Steinem. She had already been writing about women’s status – her famous article “A Bunny’s Tale”, in which she went undercover at the Playboy Club, ears and all – had been published six years before. But the woman Steinem would become was born on that March day, in that church.\nThe woman who walked out would become one of the most successful and visible faces of the second wave, a figurehead who came to personify the feminist movement itself. The former journalist, keenly aware of both the dynamics of mass media and of the potential uses of her own willowy good looks, deployed stardom and glamour in the service of the feminist cause. She was not the first famous feminist, but she might be said to have been the first famous feminist of the celebrity era, forging a public persona halfway between Madonna and Joan of Arc. Her magazine Ms, launched in 1972, brought the women’s liberation movement, once largely confined to the hip downtowns of major cities such as New York and Chicago, to newsstands across America. But Steinem’s work was not exclusive to the media: she also campaigned relentlessly, and sometimes successfully, to make the feminist movement a power player within the Democratic party, brokering her own support in exchange for policy commitments from candidates.\nSteinem’s image – powerful, beautiful and connected – lent feminism an allure and mass appeal. Few accomplished so much in making women’s rights and dignity a mainstream American concern, but Steinem’s aim, to her credit, was always to use her own more palatable image to direct attention to other people’s work, to more expansive visions for justice and to more challenging ideas. Not everyone followed her; not everyone took her up on her work’s invitation to move from feminism’s more gentle demands to its more radical ones. Some did.\nWhat does it mean to be a figurehead and a human symbol for a movement that aspires to represent fully half of the human race? Steinem’s position as an embodiment of women’s struggle meant that her public persona became a receptacle for all its hopes and disappointments; she was both credited with feminism’s achievements and blamed for its failures, even when these achievements and failures were not hers. Critics have blasted Steinem’s move to insert herself as the representative of feminism as a kind of savvy and opportunistic ambition. I prefer to think of it as a kind of generosity. She stood in for a large swath of feminists – intellectuals and activists, writers and organizers, liberals and radicals, lesbians and Playboy bunnies – and did her best to respect them all.\nBoth at the peak of the second wave and in the latter decades of her life, this role was one of dedicated coalition building. The feminist movement, in the second wave era as now, was amorphous and internally fractious, deeply divided by disagreements over priorities, tactics, and even ultimate aims. Perhaps it was because of the power of Steinem’s celebrity, or her formidable gifts as a fundraiser, that when Steinem took a side in these rifts, that side tended to win.\nBut in a movement, like man", "translation_ja": "", "vocab": [{"word": "figurehead", "definition": "実際の力はないが、公式には指導者とされる人物。ここではスタイネムがフェミニズム運動の象徴的存在であることを指す。"}, {"word": "amorphous", "definition": "明確な形や構造を持たない、定義しにくい。フェミニスト運動が内部で分裂し、統一された形態を持たないことを表現している。"}, {"word": "coalition building", "definition": "異なる立場や背景を持つグループを結集させて、共通の目標のために力を合わせること。"}, {"word": "fractious", "definition": "内部で意見が対立しやすく、争いやすい状態。分裂傾向のある。"}, {"word": "receptacle", "definition": "何かを入れる容器。ここでは、人々の希望と失望を受け止める象徴的存在としてのスタイネムを比喩している。"}, {"word": "brokering", "definition": "仲介者として利益や支援を交換し、取引をまとめること。スタイネムが自らの支持を政策的譲歩と引き換えにしたことを指す。"}]}, {"title_ja": "トランプの失われた債務削減公約：400兆円の国家債務への怒りの声", "title_en": "Trump's Failed Debt Promise: $40tn National Debt Demands Outrage", "summary_ja": "スティーブン・グリーンハウスは、2016年のトランプの連邦債務廃止公約が虚偽のデマゴーグ的言辞であると主張し、彼の行政下で国家債務が40兆円に増加したと指摘しています。著者は、富裕層と企業への減税（債務を3.4兆円増加させる見込み）が、医療、保育、住宅の手頃さの危機に対処する代わりに、共和党の財政責任の主張が空虚であると論じています。", "summary_en": "Steven Greenhouse argues that Donald Trump's 2016 pledge to eliminate the federal debt was a demagogic lie, as the debt has grown to $40tn under his administrations. The author contends that Trump's tax cuts for the wealthy and corporations—which will add $3.4tn to the debt—could have addressed affordability crises in healthcare, childcare, and housing, while Republican claims of fiscal responsibility ring hollow.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/03/trump-federal-debt-40-trillion", "state_media": false, "category": "オピニオン", "full_text": "Dear reader, I recognize that your eyes might glaze over at any mention of the nation’s $40tn federal debt. But your reaction to this mind-boggling number shouldn’t be ennui; it should be outrage and dismay.\nOutrage is in order because the nation’s debt has climbed to more than $40tn under Donald Trump, even though back in 2016, when the debt was less than half what it is today, candidate Trump insisted that he’d totally eliminate the debt within eight years. That was yet another example of the Demagogue-in-Chief’s willingness to say anything, no matter how insincere or untrue, to woo voters.\nNot only has Trump failed to reduce the debt, he has spectacularly increased it. Take Trump’s “big, beautiful bill” and the huge tax cuts it lavished upon the very rich and corporations. That legislation is expected to increase the nation’s debt by a whopping $3.4tn over the next decade. Worse, during Trump’s time as president, including his first term, the federal debt has climbed by a colossal $11.6tn.\nOutrage is also in order because the trillions in tax cuts going to the rich and corporations could have instead been used to address the affordability crisis that is squeezing so many Americans. Those trillions could have gone to creating more affordable childcare for every family or increasing subsidies to hold down soaring healthcare premiums or expanding government aid to make college more affordable.\nTrump’s tax cuts for the rich and the $40tn debt have worsened the affordability crisis in one important and painful way. They have helped push up long-term interest rates to their highest level in nearly two decades, and that has pushed up mortgage rates, too. The unhappy result: housing has become less affordable, when housing affordability has already been a big problem for young Americans. Higher mortgage rates often mean that homebuyers have to pay several hundred dollars more in interest each month.\nInterest rates have climbed not only because investors are dismayed that the national debt has hit a record, but also because Trump’s tariffs and war against Iran have fueled inflation and because investors are unsettled by all the chaos Trump has created at home and abroad.\nOutrage is also called for because of the way Trump and his Republican yes-men in Congress jumped to enact giant tax cuts when their super-wealthy donors and friends said jump. In a move that shows how rigged the system is, Trump and the GOP legislated these tax cuts for the rich and corporations even though the wealthy and corporations were already doing perfectly well and would continue doing just fine, with their mansions, yachts and private jets, even without those tax cuts. Of the $4.4tn in tax cuts in the “big, beautiful bill”, nearly half go to the richest 5% of Americans.\nIf any further evidence is needed to show that Republicans in Congress have sold their souls to billionaires, millionaires and corporations, the increased debt caused by the big, unbeautiful bill’s tax cuts will be a burden on our children and grandchildren for decades to come. By the mid-2030s, the nation will have to pay more than $2tn in interest payments each year to finance the federal debt. That’s double the $1tn a year we are paying now – $1tn is slightly less than what the government spends on Medicare, is higher than this year’s Pentagon budget and is more than five times what the federal government spends on education each year.\nAll this is maddening for another reason. In recent decades, Republicans held themselves out as the party of “fiscal responsibility”. But they’ve really become the party of fiscal irresponsibility. During George W Bush’s two terms, with his tax cuts tilted toward the wealthy and his expensive, ill-fated war against Iraq, the federal debt ballooned by 85% (by $4.9tn). In Trump’s first term, the debt soared by $7.8tn (a 39% increase), stemming from his initial big tax cuts for the rich as well as increased Pentagon spending – and then there was more than $2tn in emergency spending to stabilize the economy during the first year of the Covid-19 pandemic.\nDuring Trump’s second term, the debt is likely to soar by nearly $8tn once again. Trump is pushing for a record $1.5tn annual defense budget, far higher than any previous year, even though it will send our country’s debt further into the stratosphere. Some of that money will go to redesigning aircraft carriers merely because Trump dislikes how the current ones look.\nBill Clinton was the last president to have an annual budget surplus, but Democratic presidents have also pushed up the federal debt. During Biden’s four years as president, the debt rose $8.4tn, partly because of the annual budget deficits he inherited from Trump and partly because of his $2tn-plus pandemic-era emergency spending package to stabilize families’ finances and ensure the US didn’t sink into a deep economic downturn.\nThe federal debt has grown even larger than the country’s overall gross domestic product. Indeed, th", "translation_ja": "", "vocab": [{"word": "demagogue", "definition": "民衆の感情や欲望に訴えて支持を得ようとする政治家。事実よりも扇動的な発言や約束で人々を操作する人物を指します。"}, {"word": "ennui", "def
