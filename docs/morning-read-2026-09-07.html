e_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニングアップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズのイブニングアップデートは、購読者に最新のニュースと動向を提供します。読者はサブスクリプション設定を管理し、ザ・ストレーツ・タイムズから追加の無料ニュースレターに登録できます。", "summary_en": "The Straits Times Evening Update provides subscribers with the latest news and developments. Readers can manage their subscription preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズが主要なニュースストーリーの最新情報を含む日刊モーニング・ブリーフィングを配信しています。読者はザ・ストレーツ・タイムズのウェブサイトを通じて、より多くの無料ニュースレターを購読し、購読設定を管理できます。", "summary_en": "The Straits Times delivers its daily Morning Briefing newsletter with updates on key news stories. Readers can subscribe to receive more free newsletters and manage their subscription preferences through The Straits Times website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "クシュナー氏のイスラエル選挙批評はガザ政策分析を誤る", "title_en": "Kushner's Criticism of Israel's Election Impact on Gaza Policy Misses the Mark", "summary_ja": "ジャレッド・クシュナー前大統領補佐官がイスラエルの政治不安定さがガザ政策の非合理性に影響していると主張した。ハアレツはクシュナーの分析がイスラエルの紛争に関する意思決定の実際の要因を根本的に誤解していると指摘している。", "summary_en": "Jared Kushner claimed that Israel's political instability influences its irrational approach to Gaza policy. Haaretz argues that Kushner's analysis fundamentally misunderstands the actual drivers of Israeli decision-making on the conflict.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMingJBVV95cUxORUpwN1pzZm1rWlpUcTJheDNCeHZqSzI2N0dmNUxyYlg5SEJQZC05VFFWcHF5YzVOMDhLcVFkeVV2bF9wT3NSeUxWV1FMOHVwNXVuUTJzNE5ESUU2anZranZjRVRnQXhQSGUtZmtOUjFPVTBlUW9MZy01MllRbXRKcGptTFFfR3BoX01oTG9uRUNQQjBNVXhNeVhrdWVWT2U2dm1mZThGRkhaS09TWVdNUEtnOGZzZHlpMzAtY2NfaEt3Wjh4SWlJRmhtNkZZWDR2X0xXSkVQbVVJbFpRUmtfeUhzd2hEamVoVHI5Qm1Lc3NldUktSTd3M1FYb1E0Uk5ybVkySDFIUEF6TG4zZld2WmozYmxLYkpHU0d3M2tB?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツユダヤ人がAfDの歴史的勝利に反発、イスラエルは直接的な非難を回避", "title_en": "German Jews Express Dismay Over AfD's Historic Electoral Victory", "summary_ja": "ドイツユダヤ人コミュニティは、右翼政党「ドイツのための選択肢（AfD）」の大幅な選挙成果に対して強い不満を表明している。一方、イスラエル政府はこの極右政党の躍進に対して直接的な批判を控えている。", "summary_en": "German Jews have voiced strong disapproval following the Alternative for Germany (AfD) party's significant electoral gains. Israel has notably refrained from issuing direct criticism of the far-right party's performance, contrasting with responses from Jewish communities in Germany.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilgJBVV95cUxObTBPbDFlUjhVNzZ2ZkF0OGZwUXJBaTh6N2tIMF8yU0hWQjViRG4xQkcyR25xT0dRV0d4UFJ5bWVhcUJLdDZPQlUtWU9NRHFGb1I0MmNKZmYxb3h2VEVXUm5rOTZnRnA5V3hremJidzd6VUlEWHY4ZG0yallXNXllLXVwQk9GY1l0NkptbEVROFpod0w4ZFN1S3dENVFYclZENWF6dExvZU9xVk1Wb2IweFVsS1NhbEpKWHdvdnZ0YW9zUnhzVHNQYnZJZGl4M2pJZC1iTk93SXVrZHVBMV9vaTVnakFHeF8xbXFxclVidUR1RTBPRHUyVGpFR0lGcTJhWUZ6ejhpTkZOcGltM3hnWDBXUDhaUQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "IMDbがデータベースでイスラエルを「占領下のパレスチナ領土」に置き換え", "title_en": "IMDb Replaces Israel with 'Occupied Palestinian Territories' in Database", "summary_ja": "IMDbは、データベースの記入項目でイスラエルへの言及を「占領下のパレスチナ領土」に変更しました。このプラットフォームの地政学的な命名規則に関する編集上の決定が議論を呼んでいます。", "summary_en": "IMDb has changed its database entries to replace references to Israel with 'the Occupied Palestinian Territories.' The move has sparked debate about the platform's editorial decisions regarding geopolitical naming conventions.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi_AFBVV95cUxOcjNITjlXTUZYLUppdUdtTjUtd2x0bnJXYlI2NGZfdjB2TVA1dkd6Mkc1QnNHQkJXTDJBeEwyQmxYcEZWMHp3akViYjFQWER6MWV4RVZ2LUtNekFVR1pGeWdXemtYWmpHSVlCS0E0NWVfRzNCdlI2aFBCMG9GOGo3MGxXbTZPM0kzVGtrWTljZlppakpDVm5jQUpWa2RQRVRaUDNYM3FacVFPZFlxTDI0ZGtKbXRnX0g0cWdoYnhDVmpmTUloaXAzcXQxTF8yaFN6NF96QmNsNmx6SU5hdy1YeFpYTWZnMGp1RjlkcUVaRmlQSk9VdEE3bE1IM28?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の防衛動員法は全面的な紛争への準備を示唆—専門家", "title_en": "China's Defense Mobilization Law Signals Preparations for Full-Scale Conflict", "summary_ja": "専門家らは、中国の防衛動員法を大規模な軍事紛争の可能性に対する準備の重要な指標として解釈している。この法律は、包括的な戦争シナリオに対する戦略計画と資源配分能力の強化を示している。専門家は、この立法措置が北京の潜在的な軍事衝突への懸念を反映していると示唆している。", "summary_en": "Analysts have interpreted China's defense mobilization law as a significant indicator of preparations for potential large-scale military conflict. The law appears to represent enhanced strategic planning and resource allocation capabilities for comprehensive warfare scenarios. Experts suggest this legislative move reflects Beijing's concern over potential military confrontation.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9veTFqakFBdnFxd0JkWTRrZ19MZF9TNWxCUm52VGZ3OUNkX0JZQ1M5dXM3UnV5ZDhESkVoYWdhOWw2T3paTV9ZODdMdFZrVzJ5NlgxM3E4Yw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾11月地方選挙の候補者26人が中国人配偶者であることが判明：選管委", "title_en": "26 Candidates in Taiwan's November Local Elections Are Chinese Spouses: CEC", "summary_ja": "台湾の中央選挙委員会は、11月の地方選挙に立候補している26人の候補者が中国人配偶者であることを明らかにした。この発表は、台湾の地方統治における潜在的な外国の影響力に関する疑問を生じさせている。選管委はこれらの候補者が追加の監視や制限に直面するかどうかについて示唆していない。", "summary_en": "Taiwan's Central Election Commission has identified 26 candidates running in the November local elections who are spouses of Chinese nationals. The revelation raises questions about potential foreign influence in Taiwan's local governance. The CEC has not indicated whether these candidates will face additional scrutiny or restrictions.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5EUmJLVktla3M2WnRsR3NBdWRvZEMycGNNc19TMkEyd1BSM280T1lHX0haS1B2blJyVXFEN2R1R1B1dmVKdjJkUEJ0SDB1ckpidlNmaEJhSQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ADICがボンバルディアとの20年間のパートナーシップ契約を確保", "title_en": "ADIC Secures 20-Year Partnership Agreement with Bombardier", "summary_ja": "ADICはボンバルディアとの長期20年間のパートナーシップ契約を発表しました。本契約は両社間の重要な協業を表しています。パートナーシップの具体的な範囲と利点の詳細は、今後の発表で明らかにされる予定です。", "summary_en": "ADIC has announced a long-term 20-year partnership agreement with Bombardier. The deal represents a significant collaboration between the two companies in their respective sectors. Details of the partnership's specific scope and benefits are expected to be outlined in forthcoming announcements.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE8tVWNYMDVkdEhDdnFRUEJERVVpYUtEekRmMVM3Qk5SejFQRnZsUndHOGVJenA5Xzc3Z2Yxc0JhdzZtcExSR0ctOV8zWHhfU3MwaGVzTldMVQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国連、アフリカの実際の大きさを示す地図を支持する決議を承認", "title_en": "UN approves resolution supporting map showing Africa's true size", "summary_ja": "CGTNによると、国連は金曜日、16世紀のメルカトル図法から国々の実際の大きさをより正確に反映した地図への転換に投票した。CGTNは、この決議がアフリカ大陸が周辺的であるという認識に対抗するためにアフリカ諸国が主催したと報じている。CGTNによれば、この投票は国際レベルで世界がどのように地図上で表現されるかについてのシフトを示しているという。", "summary_en": "CGTN reports that the United Nations voted Friday to move away from the 16th-century Mercator projection map toward one that more accurately reflects countries' actual sizes. CGTN notes the resolution was sponsored by African states to counter perceptions that the continent is peripheral. CGTN reports the vote represents a shift in how the world is cartographically represented at the international level.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-05/UN-approves-resolution-in-support-of-map-that-shows-Africa-s-true-size-1QbuTU5oHOE/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カタール首相兼外相、9月7～8日に中国を訪問", "title_en": "Qatari PM and FM to Visit China September 7-8", "summary_ja": "CGTNが報じたところによると、カタールの首相兼外相は9月7日から8日にかけて中国を訪問する予定である。この訪問は両国間の二国間関係を強化することが期待されている。具体的な会談内容やアジェンダの詳細は初期発表では提供されていない。", "summary_en": "CGTN reports that Qatar's Prime Minister and Foreign Minister will visit China from September 7 to 8. The visit is expected to strengthen bilateral relations between the two countries. Details regarding specific meetings and agenda items were not provided in the initial announcement.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-06/Qatari-PM-and-FM-to-visit-China-from-September-7-to-8-1QdAquXWa1W/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "物語はどこから始まるのか？", "title_en": "Where Does a Story Begin?", "summary_ja": "CGTNが物語の起源に関する哲学的かつ実践的な問題について報告している。この記事は、異なる文脈と視点において、物語がどのように枠組みされ、その出発点がどのように決定されるかを探求している。", "summary_en": "CGTN reports on the philosophical and practical question of narrative origins. The article explores how stories are framed and where their starting points are determined across different contexts and perspectives.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-09-04/Where-does-a-story-begin--1QaiaVb3was/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ検察総長が辞任提出、ロシアの指名手配リストに掲載", "title_en": "Ukraine's prosecutor general submits resignation amid Russian wanted list", "summary_ja": "TASAが報じたところによると、ウクライナの検察総長ルスラン・クラフチェンコ氏は月曜日に辞任を提出した。同氏はロシアの指名手配リストに掲載されたままであるとされている。辞任の詳細な経緯は報道されていない。", "summary_en": "TASS reports that Ruslan Kravchenko, Ukraine's prosecutor general, has submitted his resignation on Monday. The report indicates he remains on Russia's wanted list. The circumstances surrounding his resignation were not detailed in the initial report.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/society/2183859", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ軍がDPR地域の集落を過去24時間で53回砲撃", "title_en": "Ukrainian forces shell DPR settlements 53 times over past day", "summary_ja": "TASSは、ウクライナ軍がドネツク人民共和国の集落に過去24時間で53回の砲撃を行ったと報じています。同メディアによると、この攻撃で民間人14人が負傷したとのことです。ウクライナ東部での紛争をめぐるロシア国営メディアの報道です。", "summary_en": "TASS reports that Ukrainian forces conducted 53 shelling attacks on Donetsk People's Republic settlements over the past 24 hours. According to the source, fourteen civilians were injured in the attacks. The report comes from state-controlled Russian media covering the ongoing conflict in eastern Ukraine.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2183857", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "キーウへの攻撃停止期間が終了", "title_en": "Three-day moratorium on strikes in Kyiv expires", "summary_ja": "TASSは、キーウを狙った攻撃の3日間の停止期間が終了したと報じている。この停止期間は米国の交渉担当者のウクライナ訪問に合わせて導入されたと伝えられている。TASSは停止期間を実施した当事者の詳細や攻撃再開については明記していない。", "summary_en": "TASS reports that a three-day moratorium on strikes targeting Kyiv has ended. The moratorium was reportedly introduced to coincide with a visit by US negotiators to Ukraine. TASS does not specify which party implemented the moratorium or provide details on resumption of strikes.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2183855", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "デジタルウェルネス産業が女性の健康を乗っ取っている", "title_en": "The Digital Wellness Industry Is Hijacking Women's Health", "summary_ja": "本論文は、デジタルウェルネス企業とオンライン広告主が、閉経と更年期に関する医学的不確実性を悪用して、女性に不要または潜在的に有害なサプリメントとホルモン製品を販売していると主張しています。これらの企業は、アプリとチャットボットを通じて親密な健康データを採掘することで、医学界に長年軽視されてきた研究不足の状態から利益を得ています。", "summary_en": "The article argues that digital wellness companies and online advertisers are exploiting medical uncertainty around menopause and perimenopause to sell unnecessary or potentially harmful supplements and hormones to women. By mining intimate health data through apps and chatbots, these companies profit from under-researched conditions that have historically been dismissed by the medical establishment.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/health-apps-are-getting-between-women-and-their-doctors-by-danielle-keats-citron-et-al-2026-09", "state_media": false, "category": "オピニオン", "full_text": "The Digital Wellness Industry Is Hijacking Women’s Health\n, , and\nMenopause and perimenopause, long under-researched and dismissed, have become a growth industry for online advertisers and wellness companies. Mining intimate data, this lucrative digital ecosystem exploits medical uncertainty to sell women hormones and supplements they don't need, or that can even harm them.\nCHARLOTTESVILLE—Apple’s health app has a new feature that can allegedly detect whether a woman is in perimenopause. The app notifies a user of her new health status, and a chatbot is available to provide more information. The bot asks: “Are you feeling tired and uninterested in sex?” “Having night sweats?” “Are you always itchy?” After answering “yes” to all three, the bot confirms that she may be experiencing early signs of perimenopause and potentially low testosterone or estrogen.", "translation_ja": "", "vocab": [{"word": "perimenopause", "definition": "閉経前の移行期を指す医学用語。ホルモン変動により様々な身体症状が現れる時期。"}, {"word": "ecosystem", "definition": "相互に関連する組織やシステムの統合的な網。ここではデジタル企業とマーケティングの相互関係を指す。"}, {"word": "exploit", "definition": "他者の弱みや不確実性を利用して不正に利益を得る行為。悪意を持った利用を意味する。"}, {"word": "intimate", "definition": "個人的で秘密的な性質を持つ。プライベートで機密性の高いデータを指す。"}, {"word": "under-researched", "definition": "科学的研究が十分に行われていない状態。知見や証拠が限定的であることを表す。"}, {"word": "lucrative", "definition": "利益が大きく儲かる事業や活動。金銭的に有利な状況を示す。"}]}, {"title_ja": "データを支配する者が未来を支配する", "title_en": "Who Controls the Data Controls the Future", "summary_ja": "著者は、金融、防衛、医療、行政におけるAIの重要性の増加が深刻な脆弱性を生み出していると主張しています。ほとんどの政府がAIを駆動するデータと計算インフラの支配を欠いているため、各国は自らの影響力を及ぼせない民間企業による決定に依存し続けることになります。データセンターは港や電力網と同等の戦略的重要性を持つようになっています。", "summary_en": "The author argues that AI's growing importance in finance, defense, healthcare, and public administration creates a critical vulnerability: most governments lack control over the data and computing infrastructure that power AI systems. Unless countries develop independent data and computational resources, they will remain dependent on decisions made by private corporations beyond their influence, making data centers strategically as important as ports or power grids.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-sovereignty-strategies-must-cover-data-compute-and-governance-by-bijan-burnard-2026-09", "state_media": false, "category": "オピニオン", "full_text": "Who Controls the Data Controls the Future\nWhile AI is becoming increasingly central to finance, defense, health care, and public administration, it depends on resources most governments do not control: the data used to train it and the compute that processes it. Unless this changes, countries will remain subject to decisions made in boardrooms they cannot influence.\nSAN FRANCISCO—In March, Iranian drones targeted three Amazon Web Services facilities in Bahrain and the United Arab Emirates, hitting two directly and nearly hitting the third. It was the first time a commercial data center had been a military target, yet almost nobody outside specialist circles noticed. They should have. The servers holding a country’s data, and the chips running the AI models on which its economy increasingly leans, are no longer background infrastructure. They are as strategic as ports or power grids—and just as exposed.", "translation_ja": "", "vocab": [{"word": "infrastructure", "definition": "社会や経済が機能するための基本的な施設・制度。ここでは、AIシステムを支える技術的基盤を指します。"}, {"word": "strategic", "definition": "国家や組織の長期的な目標達成に重要な性質を持つ。国防やエネルギー同様、データセンターが戦略的に重要であることを意味します。"}, {"word": "boardroom", "definition": "大企業の経営幹部が集まる会議室。転じて、企業の重要な意思決定が行われる場所を指します。"}, {"word": "leverage", "definition": "てこの原理を使って影響力や力を最大限に発揮すること。ここでは、政府が持つべき支配権や影響力を意味します。"}, {"word": "vulnerability", "definition": "攻撃されやすい弱点や、外的な危機に対する防御力の欠如。国家が依存性を持つことによる弱点を指します。"}]}, {"title_ja": "ウクライナと同じように、ヨーロッパは準備不足のままなのか？", "title_en": "Will Europe Be as Unprepared as Ukraine Was?", "summary_ja": "著者らは、ロシアのハイブリッド戦争の激化に対するヨーロッパの防衛支出と準備態勢について、重要な選択に直面していると主張しています。2022年前のウクライナの自満と同様に、ヨーロッパは防衛への投資不足、外交のみへの依存、そしてアメリカの保護が永遠に続くという仮定によって、大惨事のリスクに直面しています。著者らは、ヨーロッパが信頼できる抑止力のための実質的な防衛投資にコミットするか、準備不足の結果に直面するかのいずれかを主張しています。", "summary_en": "The authors argue that Europe faces a critical choice regarding defense spending and preparedness against Russia's escalating hybrid warfare. Like Ukraine's complacency before 2022, Europe risks catastrophe by underinvesting in defense, relying on diplomacy alone, and assuming permanent US protection. The authors contend that Europe must commit to credible deterrence through substantial defense investments or face the consequences of unpreparedness.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/europe-must-establish-deterrence-russia-warning-signs-by-tatyana-deryugina-et-al-2026-09", "state_media": false, "category": "オピニオン", "full_text": "Will Europe Be as Unprepared as Ukraine Was?\n, , and\nWith Russia ramping up its hybrid war, Europe must choose. It can invest in its own defense, accept the trade-offs involved, and build credible deterrence, or it can continue to underspend, hope that diplomacy will suffice, assume that US protection will always be available, and tell itself that the war in Ukraine is a local affair.\nURBANA/BERKELEY/KYIV—Twelve years ago, Ukraine was sleepwalking toward catastrophe. Now Europe is.\n        https://prosyn.org/3tJvI6Z", "translation_ja": "", "vocab": [{"word": "sleepwalking", "definition": "危険な状況に気づかないまま、無意識的に進んでいくこと。比喩的に、重大な脅威に対して無警戒のまま行動することを意味します。"}, {"word": "hybrid war", "definition": "軍事的戦闘と非軍事的手段（サイバー攻撃、情報戦、経済的圧力など）を組み合わせた戦争形態。従来の武力紛争とは異なる複合的な脅威です。"}, {"word": "deterrence", "definition": "敵対者の攻撃や侵略を防止するための軍事力や防御能力の保有。強い防衛力を示すことで、相手の行動を抑止する戦略です。"}, {"word": "underspend", "definition": "必要とされる金額よりも少ない額を支出すること。防衛費の文脈では、安全保障に対する投資が不十分であることを意味します。"}, {"word": "credible", "definition": "信頼できる、信じられるという意味。防衛戦略の文脈では、敵対者が本気であると認識する説得力のある抑止力を指します。"}, {"word": "complacency", "definition": "自己満足、油断した状態。危険や問題が存在することに気づかず、安心しきっている態度を表します。"}]}, {"title_ja": "リンゼイ・クランシー事件が浮き彫りにする社会の歪んだ母性観", "title_en": "Lindsay Clancy Case Reveals Society's Distorted View of Motherhood", "summary_ja": "モイラ・ドノヴァンは、産後精神病に苦しみながら3人の子どもを殺害したマサチューセッツ州の母親リンゼイ・クランシーの事件が、社会がいかに母性と精神疾患を誤解しているかを明らかにしていると主張する。12人の陪審員のうち11人が彼女の心神喪失弁護を受け入れたが、1人の男性陪審員が合理的疑いを法的に適用することを拒否し、陪審員が評決に達しなかった。ドノヴァンは、クランシーの医学的ネグレクトと事件の二極化した世論が、産後の精神保健ケアのシステム的失敗と危険な性別ナラティブを浮き彫りにしていると主張する。", "summary_en": "Moira Donegan argues that the Lindsay Clancy case—where a Massachusetts mother killed her three children while suffering from postpartum psychosis—exposes how society misunderstands motherhood and mental illness. Eleven of twelve jurors accepted her insanity defense, but one juror's refusal to apply reasonable doubt resulted in a mistrial. Donegan contends that Clancy's medical neglect and the case's polarized public reception highlight systemic failures in postpartum mental healthcare and dangerous gender narratives.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/07/lindsay-clancy-case-rorschach-test", "state_media": false, "category": "オピニオン", "full_text": "Most family annihilators are men. It’s a grim fact that such incidents are common enough to have a discernible pattern. The massacre is carried out by a husband and father, often one who is on the verge of bankruptcy or divorce; typically, it forms the finale of a long reign of domestic violence terror.\nAbout half the time, the perpetrator kills himself after slaughtering his family. Gun use is common – a large number of what are termed “mass shootings” in the United States are in fact family annihilation killings, in which a man turns his weapon on his family members. Other times, the killer uses knives, or fires.\nThis kind of killing does not always make the news. When it does, news organizations often run family photos, in which the killer smiles on a beach or beside the Grand Canyon with his arm around the wife and children he will later shoot or strangle.\nIn this context of pervasive and normalized male domestic violence against women and children, the Lindsay Clancy case was always going to attract outside attention. Because in that case, when three Massachusetts children were strangled of their family home in January of 2023 – Cora, who was five, Dawson, who was three, and Callan, who was just eight months old – the killer was their mom.\nAs is fairly common for family annihilators, Clancy attempted suicide after killing her children. But Clancy survived. Injuries left her paralyzed below the waist. At her murder trial, which lasted an unusually long six weeks and concluded in a hung jury on Friday, she rolled to the defense table each morning in a wheelchair.\nThe mistrial means that Clancy – along with her children’s father, their grandparents, and everyone else who loved them, to say nothing of the state – will now face the possibility of being subjected to a second trial. All because of a hung jury.\nEleven of the 12 jurors accepted the argument put forward by Clancy’s defense, that Clancy, who does not contest that she killed her children, was suffering from an acute case of postpartum psychosis, and hence could not be held legally responsible for their deaths. But according to notes that the forewoman of the jury sent to the judge, one juror, a man, expressed “reasonable doubt” about Clancy’s culpability under the law, but refused to apply that doubt as is legally required.\nThat this lone juror who wanted to convict Clancy was male is relevant, because the Clancy case itself became, in the distorting ways that such stories tend to when they are witnessed en masse through social media, a referendum on motherhood, mental healthcare, and the status of women.\nSome mothers have expressed deep sympathy for Clancy’s postpartum mental health crises, citing resonances with their own experiences and a hope that the case can bring greater attention to the rare but acute and debilitating kind of postpartum mental suffering that Clancy seems to have experienced; others say that medical neglect of the condition, and of the experiences of postpartum women more broadly, create the conditions for tragedies like that of the Clancy family.\nSome on the misogynist right, meanwhile, have seized upon Clancy’s actions and the support she has received as evidence that women are congenitally evil, disposed to violence, untrustworthy, and unfit for public life.\nYour opinion on the Clancy case will likely largely depend on whether you believe her defense team’s claim that she was suffering from postpartum psychosis that was severe enough that she experienced the kind of delusions, hallucinations, paranoia, rapid shifts in mood, and other departures from reality that would render her not responsible for her own actions. In other words, do you think she was really ill, or do you think that she killed her children in cold blood, and is lying?\nThe facts suggest that she isn’t. Clancy had a history of postpartum psychological distress following the births of her first two children, in 2017 and 2019. She was prescribed medication after those births, and seems to have been a loving and attentive mother to them for years.\nBut following the birth of her third child, a little boy named Callan, in 2022, reports suggest that Clancy began to experience something different, and much more serious, than her previous bouts with postpartum anxiety.\nShe couldn’t sleep, wasn’t eating, and would experience bouts of sudden, acute terror. Going back to her job as a nurse in a labor and delivery unit seemed impossible; she could barely function. She sought help again and was diagnosed with anxiety.\nLater, she would speak to other mental health practitioners, too. A series of providers issued her a stunning array of psychiatric medications. As her sleeplessness continued, Clancy was prescribed increasingly powerful tranquilizers.\nMore than a month before she killed her children, Clancy reported that she had begun to hallucinate. She kept seeking help, saying that she was thinking of killing herself; she told both her mother and her husband that she ", "translation_ja": "", "vocab": [{"word": "annihilator", "definition": "完全に家族を滅ぼす者を指す。本記事では家族全員を殺害する犯人を意味する用語で、家族成員の全員が犠牲になる殺人事件の加害者を指す。"}, {"word": "postpartum psychosis", "definition": "出産後に発症する重篤な精神疾患で、幻覚、妄想、現実感覚の喪失などの症状を伴う。産後の母親に見られる稀だが深刻な精神状態。"}, {"word": "culpability", "definition": "法律上の責任や有罪性を指す。ある行為について法的に責任を問われる程度や、人が有罪と判断される可能性を表す。"}, {"word": "congenital", "definition": "生来の、先天的なという意味で使用される。この記事では女性は本来的に悪いという主張を批判する際に用いられている。"}, {"word": "misogynist", "definition": "女性嫌悪者、女性を差別・軽蔑する者を意味する。女性に対する偏見や敵意を持つ人や立場を表す。"}, {"word": "delusions", "definition": "根拠のない確信や妄想を指す。現実と異なる信念を強く持つ精神症状で、精神疾患の特徴的な症状。"}]}, {"title_ja": "野球の暗黙のルール：100年前からの人種差別が「伝統」に偽装されている", "title_en": "Baseball's Unwritten Rules: A Century-Old Racial Divide Disguised as Tradition", "summary_ja": "著者は、黒人とラテン系の選手が喜びや個性を表現することに対する最近の物議をかもしている野球の事件は、より深い問題を明らかにしていると主張している。つまり、スポーツが歴史的に白人主導の厳格な伝統を「ゲームの尊重」という名目で強制していることだ。ロナルド・アクーニャ・ジュニアの祝賀的な本塁打の走塁からアンパイアのダグ・エディングスの恣意的な帽子検査まで、これらの事件は、単なる世代間および文化的な違いではなく、色のついた選手を抑圧するために「伝統」と「敬意」を使う門番たちを示している。", "summary_en": "The author argues that recent controversies in Major League Baseball involving Black and Latino players expressing joy and individuality reveal a deeper issue: the sport's enforcement of rigid, historically white traditions under the guise of respecting the game. These incidents—from Ronald Acuña's celebratory home run trot to umpire Doug Eddings' arbitrary hat inspection—demonstrate how gatekeepers use 'tradition' and 'respect' to suppress players of color, echoing a century-old pattern of racial control rather than simply reflecting generational or cultural differences.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/sport/2026/sep/07/ronald-acuna-jr-hancel-rincon-umpire-tilted-cap-baseball", "state_media": false, "category": "オピニオン", "full_text": "Over the last several years, simultaneously lauded and paralyzed by its ironclad traditions, baseball has undergone various forays into reinvention, trying to free itself from its unwritten rules of retaliation, its seeming aversion to joy, its demand that every generation of player of every culture and background play the game with the grimness of a Dust Bowl farmer.\nThe sport even attempted to change those customs by promoting a cultural shift with an industry-wide motto: Let the Kids Play. But in a time of intense division within the aggressive backdrop of Trumpism, the result is a racial clash that is actually a generational and cultural one that predates current politics by a century.\nOn Saturday night, Braves superstar Ronald Acuña Jr hit a third-inning home run off Zack Wheeler of the Phillies and floated around the bases, arms wide, imitating an airplane, Euro-stepping past third base as if he were Manu Ginobili, and infuriating Wheeler and his manager Don Mattingly with his apparent disregard for the accepted customs of the game.\nA week before, in the midst of what would be a 16-1 rout, Yankees second baseman Jazz Chisholm swiped two meaningless bases in a blowout win over the Red Sox when the defense had conceded his presence – according to a 150-year-old custom, runners are expected to respect this courtesy by not advancing. Chisholm’s breach of protocol prompted Red Sox radio announcer Will Flemming to suggest on the air that a Yankee player drill one of Chisholm’s teammates for his insolence.\nFor the trifecta, during a Colorado-St Louis series this weekend, neither the Cardinals nor the Rockies had a problem with each other – but umpire Doug Eddings did, stopping the game to tell Cardinals rookie Hancel Rincon to adjust his hat. Eddings determined the rookie’s hat was too crooked (despite his later admission that Rincon had not violated any official rules) and Rincon would not disrespect his game on his field. Eddings then issued a time violation to the Cardinals when manager Oli Marmol complained, then ejected Marmol, and then missed an obvious call at the plate against the Cardinals.\nIn each of the incidents, the offended – Eddings, Wheeler (and to a lesser extent Mattingly), and Flemming – were white, while the alleged offenders – Acuña, Chisholm, Rincon, and Marmol – were Black or Latino. Periodically this season, baseball has found its way into the repellent culture wars, first during the World Baseball Classic earlier this year when the Americans soured the proceedings with their militia-like grimness when the rest of the world was having fun. Maybe war is all America has to offer these days.\nIn June, when participation was optional, several players decided to exercise their religious freedoms by crashing Pride Night by writing Bible passages on their hats. When the players were warned over the incident, the Department of Justice threatened to investigate whether baseball was discriminating against Christians.\nIf, however, it appears that baseball is an extension of Maga – and it very well may be – what Eddings and company have really resurfaced over the past is not exactly Trumpism per se, but what Trumpism tacitly demands: an incessant imposition of whiteness on American institutions, and an aggressiveness that emboldens the gatekeepers like Eddings to put the coloreds in their place.\nNo league forces its historical whiteness on its players like Major League Baseball. That whiteness is also known as “tradition,” of playing the game the right way. That tradition is practiced by players Black, white and Latino, who were raised in the old-school American baseball tradition with its ethnic, Depression-era seriousness. Other sports adjust to the new generations of players who enter the game. The NBA’s Nikola Jokić and Shai Gilgeous-Alexander are not expected to play like George Mikan and John Havlicek. In baseball, Bob Gibson and Pedro Martínez are proudly the spiritual extensions of Rube Waddell and Walter Johnson.\nMattingly, wasn’t happy with Acuña, but judging by his postgame comments his conflicts were not racial, or racist, but instead resigned to a baseball becoming unrecognizable to him – a carnival of bat flips and unprofessionalism masquerading as fun. Mattingly has been in the game nearly 50 years. He was teammates with the ultimate showman, Rickey Henderson, whose on-field expressions were loathed, but Mattingly knew Henderson was no clown. He also managed Yasiel Puig, who was electric but whose respect for his craft wavered. Mattingly knows the difference between being professional and not, joy and disrespect, and seemed to be lamenting the desperate blurring of the two at the encouragement of the people who run the sport.\nIn better times, when it didn’t appear umpires were looking for a fight, and when baseball especially did not appear to enlist itself in harassing players of color – Eddings might have been shrugged off as another power-tripping umpire having a bad day and taki", "translation_ja": "", "vocab": [{"word": "ironclad", "definition": "「鉄のように固い」という意味で、変更することができない厳格で揺るがない規則や伝統を表す。比喩的に使用される。"}, {"word": "aversion", "definition": "何かに対する強い嫌悪感や反対の気持ち。「喜びへの嫌悪」は、喜びを示すことに対する反感を意味する。"}, {"word": "retaliation", "definition": "相手の行動に対する報復や仕返し。野球文化では、相手選手への報復行為を指す。"}, {"word": "protocol", "definition": "正式に定められた手順や儀式、作法のこと。「プロトコルの違反」は社会的に受け入れられた規則を破ることを意味する。"}, {"word": "gatekeepers", "definition": "権力を持って何かへのアクセスや参加を制御する人々。ここではルールを強制するスポーツ関係者を指す。"}, {"word": "tacitly", "definition": "明示的ではなく、暗黙のうちに。言葉に出されずに、理解されている方法で何かが要求または実行されることを意味する。"}]}, {"title_ja": "世界中の都市が一体となって極端な熱波対策に取り組む", "title_en": "How Cities Worldwide Are Fighting Extreme Heat Together", "summary_ja": "パリ、ミラノ、フェニックスの3つの主要都市の市長らが、極端な熱波に一時的ではなく永続的な課題として適応する方法について論じています。フェニックスは数十年の熱波対策経験を専門部局、冷却センター、都市設計要件などを通じて共有し、パリやミラノなどのヨーロッパの都市は急速にクール・スペースや緑地インフラを拡大しています。著者らは、各都市が独自のアプローチを開発する代わりに、C40都市ネットワークなどを通じて熱波対策のソリューションをグローバルに共有すべきだと主張しています。", "summary_en": "Three major city mayors from Paris, Milan, and Phoenix discuss how their cities are adapting to extreme heat as a permanent challenge rather than a temporary event. Phoenix shares decades of experience with heat mitigation through dedicated offices, cooling centers, and urban design requirements, while European cities like Paris and Milan are rapidly implementing similar strategies such as expanding cool spaces and green infrastructure. The authors argue that cities must share successful heat adaptation solutions globally through networks like C40 Cities rather than each city developing its own approach.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/sep/07/heat-climate-crisis-paris-milan-phoenix", "state_media": false, "category": "オピニオン", "full_text": "This summer, mayors met in London during the heatwave that ironically threatened to derail London Climate Action Week.\nAs temperatures broke records across the UK and Europe, leading some climate talks to be suspended or cancelled, we found ourselves seeking shelter and comparing how our cities prepare for extreme heat: how we protect vulnerable residents, communicate risk, and redesign neighbourhoods for hotter summers.\nAt the same time, Paris was overseeing the city’s crisis response as another intense heatwave swept across France. Across Europe, more than 14,000 people lost their lives due to the heat.\nAs mayors, we are confronting the same question: how do you protect millions of people when extreme heat is no longer an exceptional event, but an increasingly familiar part of summer?\nFor Phoenix, that question has shaped city government for decades. For Paris and Milan, it is now becoming one of the defining challenges of urban leadership.\nIt may strike some people as unusual that two of Europe’s oldest and most prestigious cities are looking to a city in the Arizona desert for ideas. But rising temperatures are now a global challenge, and we don’t have time for each city to figure out what works on its own.\nPhoenix has learned, sometimes the hard way, that extreme heat cannot be treated as simply a weather event. It shapes decisions about transport, housing, public health, public space, and emergency planning. Preparing for summer begins long before temperatures start to rise.\nPhoenix established one of the world’s first city offices dedicated to heat response and mitigation, reflecting an approach that focuses on both immediate relief from extreme heat, especially for those most vulnerable, and building resilience in the medium-long-term by implementing cooling solutions to make the city safer and more comfortable.\nThe city’s shade plans require 75% shade coverage in new development in areas with high pedestrian activity, and programs that support schools, transit users, and those most vulnerable. To further reduce the urban heat island effect, Phoenix is applying cool surface treatment to buildings and roadways, including on more than 300 kilometers of neighborhood streets.\nThe city leads its region in heat response, including providing a 24-hour cooling center with wraparound support to connect people with resources such as housing, medical services, and even job placement. Landlords are required by law to maintain a safe indoor temperature (28C/82F or lower), and companies that contract with the city must implement heat safety plans to keep workers healthy and comfortable. These measures save lives: during the summer of 2024, which was the hottest on record in Phoenix, the city’s coordinated heat response measures contributed to a 20% year-over-year decline in heat-related 911 calls.\nParis and Milan bring different expertise as well as unique challenges.\nBoth are historic European cities where streets, buildings and public spaces were designed for a different time and a different climate. Today, both cities are adapting.\nEvery Parisian now lives within a seven-minute walk of a cool spot. The city now has more than 1,400 of these spaces where people can cool down during a heatwave, including parks, gardens and other public facilities. The city also extends opening hours for parks, swimming pools, and public baths during high temperatures. The city has mobilised a network of 27,000 climate volunteers to raise awareness within their communities of the climate crisis and heatwave adaptation strategies, alongside preventive actions.\nThe city is also planning for a future that would have been inconceivable to Parisians just a few decades ago: “Paris at 50°C” was organised in October 2023 to test the responsiveness of the municipality and its partners, as well as improve planning and coordination for future heat emergency responses. This involved the whole community, utilities, media and schools and directly inspired Barcelona to carry out the same exercise in 2027.\nNo city can simply import another’s model. Geography, history and politics are different everywhere. But every mayor owes it to their residents to gather the best ideas from cities around the world; and through the C40 Cities network, nearly 100 of the world’s biggest cities are sharing climate solutions for our residents and businesses. Cities have always learned from one another. We have adapted successful transport systems, housing policies and public health measures for generations. Heat adaptation should be no different.\nIf one city discovers a better way to protect outdoor workers, cool public spaces or communicate risk to residents, others should not spend years reinventing it. Good ideas should travel.\nInspired by Barcelona and Paris cool spaces initiatives, Milan is expanding its Piazze Aperte (Open Squares) and School Streets programme to integrate cool spaces by planting trees, replacing hard surfaces with permeable green space and c", "translation_ja": "", "vocab": [{"word": "mitigation", "definition": "被害や影響を軽減すること。環境問題では、温暖化などの悪影響を減らすための対策を指します。"}, {"word": "resilience", "definition": "困難な状況から回復する能力、あるいはストレスに耐える強さ。都市計画では、災害や環境変化に対応できる強さを意味します。"}, {"word": "urban heat island effect", "definition": "都市部が周辺地域よりも気温が高くなる現象。コンクリートやアスファルトが熱を吸収し放出することが原因です。"}, {"word": "wraparound support", "definition": "包括的で周到なサポート体制。複数の支援サービスを統合して提供することを指します。"}, {"word": "permeable", "definition": "液体や空気が通り抜けることができる性質。造園では、水が浸透できる素材を指します。"}]}, {"title_ja": "米中デタント：戦略的安定性の枠組みの出現", "title_en": "The Emerging U.S.-China Détente: A Framework for Strategic Stability", "summary_ja": "著者は、習近平とトランプの「戦略的安定性」追求合意が、10年以上ぶりに米中指導者が関係定義について初めてのコンセンサスに達したことを意味する重要な外交的転機だと主張している。すべての対立を解決するのではなく、この実用的な枠組みは競争を管理し軍事的エスカレーションを防ぐための基盤を確立することを目指している。北京が根本的な競争を認めながら関係を管理しようとする意思を示すことは、成長する自信を示唆し、両国関係がより安定した段階に入った可能性を示唆している。", "summary_en": "The author argues that the Xi-Trump agreement to pursue 'strategic stability' represents a significant diplomatic breakthrough, marking the first consensus between U.S. and Chinese leaders in over a decade on defining their relationship. Rather than seeking to resolve all conflicts, this pragmatic framework aims to establish a floor for managing competition and preventing military escalation. Beijing's willingness to acknowledge fundamental competition while pursuing managed relations signals growing confidence and suggests the relationship may have entered a more stable phase.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/emerging-us-china-detente", "state_media": false, "category": "オピニオン", "full_text": "When Chinese leader Xi Jinping and U.S. President Donald Trump met in Beijing, in May, they agreed that their two countries should build a constructive relationship of strategic stability. Although many observers in Washington responded skeptically to this new framework, dismissing it as empty words, it marks the first time in more than a decade that China and the United States established a consensus about how to define the relationship that leaders on both sides broadly recognize. Strategic stability does not refer to nuclear détente; rather, it suggests a new equilibrium in which both sides can avoid further deterioration of the relationship and even expand cooperation where interests align.\nLeaders in Beijing do not expect that this new framework can resolve most of the differences between China and the United States or that it can stop new frictions from emerging. In June, for example, the U.S. Department of Defense placed more Chinese companies—including private-sector giants Alibaba, Baidu, and BYD—on its list of firms involved in civil-military fusion activities, barring the Pentagon from contracting with them. In retaliation, China placed ten U.S. entities on its dual-use export control list, which prevents any company from supplying them with items that have the potential for both military and civilian use. But Beijing hopes that a consensus built around strategic stability can help China and the United States manage their differences more effectively and that it will prevent the worst outcomes: military conflict or a new cold war. So far, ongoing friction has not derailed the overarching consensus established in May. By keeping sanctions and countermeasures relatively limited, Beijing and Washington have avoided dangerous escalation and kept the relationship moving forward.\nThe goal of the new diplomatic framework between Beijing and Washington is a pragmatic one. It aims to build a floor under U.S.-Chinese relations rather than try to achieve an unlikely grand bargain that would resolve all conflict. It also represents a changing approach in Beijing to dealing with the United States. Unlike in the past, when China rejected U.S. frameworks focused on competition, it is now willing to recognize that the fundamental nature of U.S.-Chinese relations is competitive. Allies or partners, after all, would not set strategic stability as the overarching goal of their relationship; only competitors, or even adversaries, need to do so. Beijing’s willingness to accept a formulation to manage, rather than exclude, competition shows that it is gaining confidence and seeing itself more as an equal to Washington. Adopting this confident mindset could lead China to act with more restraint in its dealings with the United States—which could in turn bring a further degree of calm to the relationship.\nIt now appears plausible that bilateral relations have turned a corner and entered a more stable phase. Although fundamental challenges remain that could cause new turbulence, the peak tensions of the past eight years may well be receding. The upcoming leaders’ summit in late September, when Xi and Trump are scheduled to meet in Washington, is a chance to further move the relationship forward. The two leaders can now add more concrete measures to support this new framework of strategic stability, including taking steps to reduce economic friction, increase military-to-military communications, improve crisis management mechanisms, expand citizen exchanges, and offer reassurances about Taiwan, thereby defusing tensions that could escalate into potentially catastrophic military conflict. With Xi and Trump likely to meet again multiple times in the next few months, the new framework is the first chance in years to lay the groundwork for enduring stability in bilateral ties.\nBEYOND STRATEGIC COMPETITION\nFor a long time, leaders in both Beijing and Washington sought to define the bilateral relationship in terms of some kind of partnership. In 1997, when Chinese leader Jiang Zemin visited the United States, Beijing and Washington announced aims of “a constructive strategic partnership oriented toward the twenty-first century.” In 2005, the George W. Bush administration urged China “to become a responsible stakeholder” in the international system; Chinese leader Hu Jintao responded in 2006 that the two countries were not only stakeholders but “should also be constructive partners.” But between 2009, when President Barack Obama and Hu agreed to “steadily grow a partnership” to address common challenges, and the Trump-Xi summit earlier this year, the countries’ leaders were unable to reach a new consensus on how to position the relationship.\nThe United States moved away from seeing the relationship as a partnership earlier than China did. During Trump’s first term, the United States began to define U.S.-Chinese relations in terms of “strategic competition.” At first, China tried to accept the competitive element in bilateral rela", "translation_ja": "", "vocab": [{"word": "détente", "definition": "敵対国間の緊張緩和または関係改善の時期のこと。冷戦期の米ソ関係などで用いられた外交用語である。"}, {"word": "consensus", "definition": "複数の当事者が同意または合意に達したこと。外交交渉では共通の理解や方針を指す。"}, {"word": "strategic stability", "definition": "国家間が対立や競争を管理し、軍事紛争や戦争のエスカレーションを防ぐための相互理解の枠組み。"}, {"word": "pragmatic", "definition": "現実的で実用的なアプローチのこと。理想ではなく実現可能な目標や方法に基づいている。"}, {"word": "bilateral relations", "definition": "二国間の外交的および経済的関係のこと。国家間の相互作用や協力を指す。"}, {"word": "escalation", "definition": "対立や紛争が段階的に激化していくプロセスのこと。軍事衝突に至る緊張の高まりを意味する。"}]}, {"title_ja": "次の飢饉を避ける", "title_en": "Avoiding the Next Famine", "summary_ja": "著者は、21億人に影響を与えるグローバルな食糧不安が人道的危機であるだけでなく、米国の指導力に対する地政学的な必須課題であると主張している。食糧不安は政府を不安定化させ、紛争を助長し、世界経済に数兆ドルの損失をもたらすため、米国が飢饉に対処する国際的取り組みを主導することが、グローバル信頼を回復し、農業政策における中国の影響力増加に対抗するために不可欠である。", "summary_en": "The author argues that global food insecurity affecting 2.1 billion people is not merely a humanitarian crisis but a geopolitical imperative for U.S. leadership. Food insecurity destabilizes governments, fuels conflict, and costs the world economy trillions, making it essential that the U.S. lead international efforts to address hunger to rebuild global confidence and counter China's growing influence in agricultural policy.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/avoiding-next-famine", "state_media": false, "category": "オピニオン", "full_text": "In a world of great-power standoffs, climatic tipping points, and technological arms races, global hunger may not seem like a particularly significant problem. Yet last year, a total of 2.1 billion people, or more than a quarter of the planet’s population, experienced food insecurity—meaning they either ran out of food over the course of a year or were forced to reduce the quality or quantity of their diet. Over 260 million faced acute food insecurity, meaning their lives or livelihoods were in immediate danger because they could not get enough to eat. Almost a quarter of all children under the age of five were permanently stunted because of malnourishment and will likely reach lower levels of education, earn less over the course of their lives, and live with more chronic health challenges than properly fed kids. And these startling figures do not reflect the food crises that could be unleashed this year by rising energy and fertilizer prices, decreases in grain exports from Russia and Ukraine, and an intensifying El Niño weather pattern.\nFood insecurity is terrible in and of itself. But it also has disastrous political consequences. It inhibits economic growth, heightens the risk of violent conflict, and destabilizes governments. These problems, in turn, create trouble for the whole world. That means countries that are not overwhelmed by food insecurity still have strong, self-interested reasons to tackle it—the United States included.\nIn fact, a U.S.-led effort to address hunger would do more than create a healthier and more stable planet. Given the waning goodwill toward the United States, Washington needs an agenda through which it can rebuild global confidence in its leadership and demonstrate the value of international cooperation. Addressing global food security could be at the center of such a plan. Different parts of the world, after all, may have different geopolitical ambitions. But almost no government—northern or southern, democratic or autocratic—wants to see so many people go hungry. There may be no better way to rebuild confidence in the liberal world order and in the United States as a committed member of it than for Washington to address this challenge.\nFOOD, GLORIOUS FOOD\nIt is difficult to overstate just how intertwined food security is with global development, state security, and even international competition. Malnutrition leads to reduced educational attainment, compromised human capital, and lost productivity, costing the world economy $3.5 trillion a year in forgone economic growth and in added health-care costs. Food price spikes can also exacerbate grievances and lead to riots that destabilize governments; anger over hunger, for example, set the conditions for the Arab Spring protests. In rural areas, food insecurity helps armed groups recruit soldiers and causes disputes over scarce land and water resources. And it causes people to migrate to wealthier states.\nThese reasons are, by themselves, enough for Washington to helm a global campaign to reduce hunger. But so should the fact that leading on global food security means helping shape the future of the world’s entire agricultural system—something China is on a path to do. In 2019, Beijing invested significant capital in securing leadership of the Food and Agriculture Organization of the UN, a role with substantial influence over how governments work together on food-related issues. It is also quickly developing other ways to lead the world on matters of food security. China spends double what the United States spends on public agricultural research and development, and its output of agricultural patents and scientific publications has skyrocketed while U.S. output has stagnated.\nThankfully for American officials, the United States is still well positioned to lead the world when it comes to food security. The United States is among the world’s largest agricultural exporters. It was instrumental in founding the UN architecture dedicated to food security, including the Food and Agriculture Organization and the World Food Program. And for much of these institutions’ history, Washington has been their largest donor. In fact, for decades, the United States’ international development agenda was the most ambitious in the world, and it was backed by a willing public.\n Washington retains many of the tools needed to combat global hunger.\nThe country still has such a public: in early 2026 polling, a strong majority said that the United States should be a moral leader in the world. But a strong majority didn’t believe it was. Perhaps this is because the United States has been walking away from this legacy and this opportunity to lead. In mid-2025, for example, Congress clawed back nearly $8 billion in foreign assistance funds. The United States is now a reluctant international donor and a surly member of key international organizations.\nWashington, however, still retains many of the tools needed to combat global hunger. In addition to incre", "translation_ja": "", "vocab": [{"word": "acute food insecurity", "definition": "生命や生計が即座の危険にさらされるほど食料不足が深刻な状態を指す。飢饉や食料危機の最も危険な段階を表す用語。"}, {"word": "tipping points", "definition": "システムが急劇的に変わる転換点を意味する。気候変動などで小さな変化が大きな影響を引き起こす臨界点。"}, {"word": "destabilize", "definition": "政府や社会体制を不安定にする、あるいは支配力を失わせることを意味する。政治的混乱をもたらす。"}, {"word": "exacerbate", "definition": "状況や問題をさらに悪化させる、悪くなる傾向を強める意味の動詞。紛争や不安を増幅させる。"}, {"word": "liberal world order", "definition": "自由主義に基づいた国際秩序体制を指す。民主主義と市場経済を推進する国家間の協力体制。"}, {"word": "helm", "definition": "指導力を発揮して主導する、または組織や国家を統率する意味の動詞。リーダーシップを担当する。"}, {"word": "claw back", "definition": "一度与えた資金や利益を取り戻す、削減する意味の句動詞。予算や援助金を減らす際に使用される。"}]}, {"title_ja": "台湾の海軍戦略：大型艦より小型艦が優位である理由", "title_en": "Taiwan's Naval Strategy: Why Smaller Ships Beat Big Symbols", "summary_ja": "著者は、台湾が大型で高価な軍艦の建造計画を放棄し、代わりに多数の小型でステルス性を備えたコルベットを建造して台湾海峡を越えた中国の侵攻の脅威に対抗すべきだと主張している。現代的な監視技術とミサイル兵器は大型艦を脆弱な負債にしており、一方小型艦は初期攻撃に耐え効果的に両生作戦を阻止できる。歴史的な海戦は、目立ち高コストの軍艦が軍事戦略を制約し壊滅的損失を招くことを示している。", "summary_en": "The author argues Taiwan should abandon plans for large, expensive warships and instead build numerous smaller, stealthier corvettes to counter China's invasion threat across the Taiwan Strait. Modern surveillance and missile technology have made large surface ships vulnerable liabilities, while smaller vessels can survive initial strikes and effectively repel amphibious assaults. Historical naval engagements demonstrate that visible, costly warships constrain military strategy and invite devastating losses.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/taiwan/how-taiwan-can-win-strait", "state_media": false, "category": "オピニオン", "full_text": "Separated from China by a roughly 100-mile-wide strait, Taiwan relies on its navy as the first line of defense against a potential invasion. It must be able to prevent an assault by a Chinese force carried across the Taiwan Strait in large amphibious ships. Taiwan has traditionally favored large ships such as destroyers and frigates to form the core of its fleet, both as visible symbols of state power and as tools for signaling resolve in the face of Chinese coercion, and Taiwan’s current shipbuilding plans include replacing an aging surface fleet with large and expensive new ships.\nYet large surface ships are vulnerable in the narrow waters of the Taiwan Strait—a problem compounded by advances in technology that are making them easier to detect, track, and attack. China has invested in cutting-edge intelligence, surveillance, and reconnaissance (collectively known as ISR), as well as electronic warfare systems, drones, and missiles. Taiwan’s large surface ships are now a liability. But Taiwan has an advantage: these same technologies make China’s large amphibious ships more vulnerable in restricted waters, and those ships cannot be replaced by smaller, stealthier alternatives. Taipei can take advantage of this mismatch by replacing its destroyers and frigates with a greater number of smaller surface combatants that are more likely to survive an initial wave of Chinese strikes and remain capable of attacking a Chinese invasion fleet.\nThe Taiwanese navy is planning to invest heavily in large surface combatants, including a new 7,000-ton warship and as many as 12 3,000-ton light frigates. These large ships are impediments to the radical transformation of the Taiwanese navy that the Chinese threat requires. Building ships of this size with stealth features and defense systems to survive a battle in the Taiwan Strait would be prohibitively costly; without these features, they would be too vulnerable to play a major role in the navy’s primary wartime mission of denying a Chinese invasion force the use of the Taiwan Strait. Efforts elsewhere to build similarly capable ships have proved costly and difficult. The U.S. Navy’s Constellation-class frigate program, for example, budgeted roughly $1 billion per ship; the cost eventually rose to about $1.5 billion each before the Constellation program was canceled, and even at that price the ships lacked the capabilities needed to fight an advanced adversary in restricted waters. In comparison, the spending on Taiwan’s entire shipbuilding program is projected to be $1.5 billion annually.\nRather than spend resources on large ships, Taipei should build stealthy corvettes weighing between 700 and 1,000 tons, armed with missiles and drones, that are harder to detect and target but can retain enough firepower to attack Chinese ships crossing the strait. Combined with current plans to build shore-based mobile launchers, aircraft armed with antiship missiles, and eight submarines, Taiwan can create a dispersed and hard-to-destroy defense system that can withstand Chinese attacks and repel a potential amphibious assault.\nSITTING DUCKS\nLarge ships may be potent signals of national power, but they are relatively easy to target and politically costly to lose. When ships are fighting in narrow waterways under heavy surveillance, visibility quickly becomes a deadly liability. The sinking of a large ship can also have consequences beyond an immediate military setback. A highly visible and costly loss may make political and military leaders more cautious about risking additional warships as conflict continues.\nMajor naval engagements over more than the last four decades suggest that any navy expecting to fight near an enemy’s coast should be wary of building its force structure around expensive, irreplaceable hulls. The 1982 Falklands War between Argentina and the United Kingdom, for example, showed how a single successful strike on a warship can constrain an entire surface fleet. Argentina entered the Falklands conflict with powerful ships, including the cruiser General Belgrano and the aircraft carrier Veinticinco de Mayo. But after a British submarine sank the Belgrano, Argentina decided to keep much of the rest of its surface fleet, including the carrier, closer to coastal waters or in ports for the rest of the war.\nIn the Persian Gulf six years later, the U.S. Navy’s ability to combine surveillance, aircraft, ships, and precision weapons devastated Iranian naval forces during Operation Praying Mantis. In a single day, U.S. forces sank or badly damaged several Iranian surface vessels operating in the confined waters of the Gulf, including two large frigates. Whereas the Falklands War illustrated the political consequences of losing a major warship, Praying Mantis highlighted the danger for ships facing an adversary with a much more effective “kill chain”—the sensors and communications to detect, identify, track, target, and attack an opponent’s fleet. For Taiwan, the lesson is that ", "translation_ja": "", "vocab": [{"word": "amphibious", "definition": "水陸両用の、水と陸の両方で作戦可能な状態を指す。軍事用語として、海から陸への上陸作戦や両生攻撃を表す。"}, {"word": "corvette", "definition": "小型で機動力のある軍艦の一種。駆逐艦より小さく、沿岸防衛や限定的な作戦に適している。"}, {"word": "surveillance", "definition": "監視、密接な観察。軍事や安全保障の文脈では、敵の位置や活動を追跡する行為を意味する。"}, {"word": "reconnaissance", "definition": "偵察、事前調査。敵の位置や状況を把握するための軍事活動を指す。"}, {"word": "liability", "definition": "負債や責任という意味の他に、足手まといや弱点を指す。軍事用語では防御上の脆弱性を表す。"}, {"word": "constrains", "definition": "制限する、束縛する。行動や選択肢を制限して自由度を減らす意味。"}, {"word": "kill chain", "definition": "目標を検出・識別・追跡・照準・攻撃するまでの一連の軍事プロセス。監視から攻撃実行までのシステムを指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-09-07 23:08 JST";
  renderTabs();renderList();
})();
</script>
