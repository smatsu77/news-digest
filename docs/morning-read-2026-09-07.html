oes could accompany tropical cyclones. They typically occur in rain bands well away from the center of the storm.\nHawaii’s Big Island can expect as much as 100mm to 200mm (4 inches to 8 inches) of rain, with localized peaks reaching up to 305mm (12 inches).\nHurricane-force winds extended outward up to 85km (50 miles) from the centre while tropical storm-force winds extended outward up to 280km (175 miles).\nResidents prepare for the worst\nKauai’s Emergency Management Agency urged residents to fill gas tanks, charge devices, refill prescriptions and store water and food ahead of the storm. The agency also said residents should be prepared to stay home for several days.\nSwells generated from Lowell are expected to produce “life-threatening surf and rip current conditions”, according to a statement by the Kauai County government on Sunday evening. It urged visitors to stay out of the ocean and steer clear of the shoreline as coastal conditions rapidly worsen.\n“Residents should not assume conditions will be limited to areas near the storm’s center,” the government said.\nAs panic-buying emptied supermarket shelves in Lihue on Kauai, residents of the 8,000-person airport town scrambled to stock up on food and water.\nReal estate agent Lori Benkert bought an extra 4.5kg (10 pound) container of propane so that she could cook on the barbecue if power shut off. Benkert manages dozens of properties on Kauai and has boarded up two houses on the western side of the island.\n“We’ll lose some power, probably have some trees, a bunch of tree limbs coming down,” Benkert told The Associated Press. “Everybody is probably going just to hunker down”.\nMeanwhile, Category 1 Hurricane Marie churned 1,120km (695 miles) south-southwest of San Diego in southern California, bringing dangerous surf to the area and Mexico’s Baja coast. Packing 120km/h (75mph) sustained winds, the storm tracked northwest at 11km/h (7mph).\nEven without coastal watches or warnings, updrafts from Marie will hit southwest Mexico, Baja California and Southern California over the next few days, creating pounding surf and dangerous rip currents.\nThe islands of Hawaii rarely experience tornadoes, averaging about one per year. Just 42 tornadoes were reported in the state between 1950 to 2018, according to Stephen Parker, a meteorologist with the weather service office in Honolulu.", "translation_ja": "", "vocab": [{"word": "proclamation", "definition": "公式な公告や宣言のこと。市長が非常事態宣言を発令したように、権威者が重要な決定や命令を公式に発表することを意味します。"}, {"word": "trajectory", "definition": "ある物体や現象が進む経路や方向のこと。ここでは、ハリケーンの進路や進展パターンを指しています。"}, {"word": "mushroomed", "definition": "急速に拡大・成長することを意味する。ハリケーンの強度や影響範囲が急速に増大したことを表現しています。"}, {"word": "seesawed", "definition": "シーソーのように上下に揺れ動く、または変動することを意味します。ここではハリケーンの強度がカテゴリー3と5の間で変動したことを示しています。"}, {"word": "updrafts", "definition": "上昇気流のことで、空気が上向きに流れる現象。嵐に伴う垂直方向の空気の流れが地域に影響をもたらします。"}, {"word": "rip currents", "definition": "沿岸部で海から陸に向かって逆流する危険な潮流のこと。海水浴や水上活動において溺水の原因となります。"}]}, {"title_ja": "米国とイランの衝突激化に伴いホルムズ海峡の石油価格が急騰", "title_en": "Oil prices surge as US-Iran strikes intensify in Strait of Hormuz", "summary_ja": "米国とイラン間の軍事衝突がホルムズ海峡で激化する中、石油価格が6週間ぶりの高値近くまで上昇しました。この紛争によりブレント原油は1バレル97ドル前後、米国のガソリン価格は1ガロン4.15ドルに達し、米国の消費者に大きな影響を与えています。一方、中国は国内の石油源への依存を強化することで、供給途絶から身を守ろうとしています。", "summary_en": "Oil prices have risen to near six-week highs as military strikes between the US and Iran escalate in the Strait of Hormuz, a critical shipping channel for roughly a fifth of global oil supply. The conflict has driven Brent crude to around $97 per barrel and US gasoline prices to $4.15 per gallon, significantly impacting American consumers ahead of the midterm elections. Meanwhile, China is moving to insulate itself from disruptions by relying on domestic oil sources.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/economy/2026/9/7/oil-prices-surge-as-us-iran-strikes-intensify-in-strait-of-hormuz?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Oil prices surge as US-Iran strikes intensify in Strait of Hormuz\nOil prices push China towards EVs and other trading partners as Americans face higher prices ahead of the US midterm elections.\nOil prices are rising to nearly a six-week high amid a wave of strikes between the United States and Iran in the Strait of Hormuz, through which roughly a fifth of the world’s oil supply travels during peacetime.\nOn Monday, Brent oil futures, the global benchmark, rose to hover around $97 a barrel — up 9 percent over the last five days and 19 percent over the last month. Monday’s market moves are approaching the highest point since July 24th, when prices topped $97.93.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Iran war: Why US midterms could be a pivotal moment\n- list 2 of 4Diesel price hits all-time high in US amid Iran war woes\n- list 3 of 4US imposes sanctions on Turkish bank, prompting legal threat\n- list 4 of 4Iran President Pezeshkian calls for unity as US ramps up economic pressure\nUS West Texas Intermediate crude similarly rose to $92.27 a barrel, up 79 cents, also a near six-week high.\nIn recent days, strikes escalated in the Strait of Hormuz. The US hit three Iranian oil tankers on Saturday, while Iran’s Islamic Revolutionary Guard Corps (IRGC) said it had struck three tankers and three US-linked vessels in other areas.\n“This is a reflection of continued conflict and exchange of fire. The supply deficits globally are persisting, and there is little end to these shortages,” Rachel Ziemba, an adjunct senior fellow at the Center for a New American Security (CNAS), told Al Jazeera.\nOn Monday, Saudi Aramco’s Jizan facilities were struck for the second time in the last month, according to reporting from the Financial Times that cited two people familiar with the matter.\n“The fact that a Saudi refinery in Jizan was hit, possibly delaying its return to production, didn’t help,” Ziemba added.\nAmid increased strikes, there’s less traffic in the Strait of Hormuz, with an average of 10 commodity ships crossing the vital chokepoint each day over the last 10 days, according to Kpler, a data analytics platform.\n“Crude went back down to what the pre-war level was in early July. Then it increased again, and then it reduced again, and now it’s increasing again on this weekend’s exchange plus the Aramco attack,” Arif Gasilov, a partner at the Gasilov Group, an energy advisory firm, told Al Jazeera.\n“I would say that you might eventually see an inflection point, depending on how long this keeps going on, where a ceasefire doesn’t move the market at all, maybe by just a dollar or two.”\nUS consumers pinched\nUS consumers are feeling the impact of heightened oil prices at the petrol pump. The average price for a gallon (3.78 litres) of petrol has jumped 7 cents over the course of a week, reaching $4.15 nationally on Monday, up from $4.08 this time a week ago, according to the American Automobile Association (AAA), which tracks daily petrol prices.\nThat’s up from $4.04 this time a month ago and $2.98 from February 28th, when the US and Israel first struck Iran, marking a 39 percent increase since the war began.\nLast week, diesel prices hit all-time highs at $5.85 per gallon.\n“US diesel prices have never been this high, and now the countdown starts for the trickle-down to everything consumers buy… record diesel will start funnelling down into the economy,” Patrick De Haan, head of petroleum analysis at GasBuddy, said in a post on the social media platform X.\nPrices have continued to climb since, with average prices on Monday topping $5.90 per gallon.\n“Markets are pricing in longer disruptions. It continues to be in product markets where the biggest disruptions lie, though, including diesel,” Ziemba added.\nThose price gains are weighing on Americans, who have spent an average of $764.59 per household on fuel since the war began. That’s $418.82 more than usual, according to Brown University’s Watson School of International and Public Affairs.\nAhead of the US’s September 5-7 Labor Day weekend, the unofficial end of summer and a popular time for US travel, AAA forecasts showed a 20 percent increase in flight costs compared to the same weekend last year.\nAhead of the midterm elections, the economy is emerging as a key issue for US voters — and a potential warning sign for Republicans. Polls show voters souring on President Donald Trump’s handling of the economy, with his economic approval rating falling to a new low in a recent Financial Times poll. Just 17 percent of Americans approve of his handling of the economy.\nAn Economist/YouGov poll similarly found that 39 percent of Americans believe Democrats are doing a better job handling the economy, compared with 32 percent who said Republicans are.\nChina pressures\nSoutheast and East Asian markets rely more heavily on imports travelling through the Strait of Hormuz directly than the US, but Beijing has moved to insulate itself from the disruption by turning to domestic sources, incl", "translation_ja": "", "vocab": [{"word": "chokepoint", "definition": "戦略的に重要な地点であり、通過を制限または遮断できる場所。ビジネスや地政学の文脈で、サプライチェーンの脆弱性を指します。"}, {"word": "commodity", "definition": "商品取引の対象となる基本的な物質やエネルギー資源。石油、金属、穀物などが含まれます。"}, {"word": "inflection point", "definition": "変化の方向性が転換する重要な時点。経済や市場では、トレンドが逆転する時期を意味します。"}, {"word": "trickle-down", "definition": "上位レベルの変化が徐々に下位レベルに波及する現象。経済学では、高い領域での価格や政策変化が消費者に影響すること。"}, {"word": "insulate", "definition": "悪影響から保護または隔離する。経済の文脈では、外部のショックや変化から自らを守ることを意味します。"}, {"word": "disruption", "definition": "通常の機能やプロセスの中断または混乱。サプライチェーンや市場の安定性が損なわれた状態。"}]}, {"title_ja": "パリがヒンドゥー教代表団のエッフェル塔訪問時の女性職員の除外について調査", "title_en": "Paris Investigates Removal of Female Staff During Hindu Delegation's Eiffel Tower Visit", "summary_ja": "土曜日にヒンドゥー教宗教団体BAPS（ボーチャサンワシ・アクシャル・プルシュッタム・スワミナラヤン・サンスタ）の私的訪問中に、エッフェル塔の女性職員が職場から立ち去るよう求められ、職員の抗議とパリ市当局による調査が開始された。パリ市長エマニュエル・グレゴワールと国民議会議長ヤエル・ブラウン=ピヴェは事件を批判し、BAPSは不便をかけたことについて謝罪した。", "summary_en": "Female employees at the Eiffel Tower were asked to leave their workstations during a private visit by a Hindu religious delegation (BAPS) on Saturday, prompting staff protests and an investigation by Paris authorities. Paris Mayor Emmanuel Gregoire and National Assembly President Yael Braun-Pivet criticized the incident, while BAPS apologized for any inconvenience caused, stating the visit was scheduled to avoid disrupting regular operations.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/paris-investigates-claim-of-women-being-removed-during-hindu-delegation-visit-at-eiffel-tower/article71440426.ece", "state_media": false, "category": "経済", "full_text": "Female employees at the Eiffel Tower were asked to step out of sight during a visit by a Hindu religious delegation at the weekend, according to union representatives, prompting a staff protest and an investigation by Paris city authorities.\nThe monument was closed late on Monday (September 7, 2026) as employees held a meeting over the incident, which has angered staff and drawn criticism from French politicians.\nOn Saturday, a delegation of about 100 people linked to the Hindu group Bochasanwasi Akshar Purushottam Swaminarayan Sanstha, or BAPS, made a private visit to the Eiffel Tower.\n“As the delegation passed through, women were asked to leave their workstations so that men could take their places,” Diane Davoine, a union representative, told Reuters.\n“Tensions mounted over the weekend, so this morning, the employees decided to meet: first, to open a dialogue with management, and second, to ensure that women are never treated this way at the company again,” she said.\nSigns at the base of the tower on Monday read: “The opening of the Eiffel Tower is delayed for operational reasons.”\nMs. Davoine said management apologised to staff over the incident.\nParis Mayor reacts to the incident\nParis Mayor Emmanuel Gregoire said that an investigation would be launched “as soon as possible”. In a post on social media platform X, he said he was aware of the employees’ anger and agreed their dissatisfaction was legitimate.\n“It is urgent that all light be shed on the facts that led to this protest,” Mr. Gregoire wrote.\nBAPS, whose representatives were in France for festivities related to the inauguration of a Hindu temple in the Paris suburbs, said in a statement that the visit to the Eiffel Tower was arranged at the start of opening hours to avoid disrupting others, due to the size of its delegation.\n“To the best of our knowledge, at no point was anyone prevented access to the Eiffel Tower. Nevertheless, we sincerely apologise for any pain or inconvenience caused,” the statement said.\nA spokesperson for SETE, the company operating the monument, did not immediately respond to a request for comment.\nYael Braun-Pivet, the president of the National Assembly, wrote in a post on X: “Welcoming others never means giving up our values. In France, women are fully present in public life. No one tells them to become invisible.”\nPublished - September 08, 2026 04:20 am IST", "translation_ja": "", "vocab": [{"word": "delegation", "definition": "公式な目的で派遣される代表者のグループ。会議や交渉に参加するために選ばれた人々を指します。"}, {"word": "prompted", "definition": "〜の原因となった、〜を引き起こした。何かが他の行動や反応をもたらす時に使用されます。"}, {"word": "dissatisfaction", "definition": "不満、不快感。期待や要求が満たされていない状態を表します。"}, {"word": "legitimacy", "definition": "正当性、合法性。行為や主張が正当な根拠や法的根拠を持つことを示します。"}, {"word": "inconvenience", "definition": "不便、迷惑。誰かに手間やトラブルをもたらすこと、または不便な状態を意味します。"}, {"word": "inaugurate", "definition": "正式に開始する、落成式を行う。新しい建物や施設を公式に開設することを指します。"}]}, {"title_ja": "英国政府、小型ボート難民到着に対する抗議活動を非難", "title_en": "U.K. Government Condemns Protests Against Small Boat Migrant Arrivals", "summary_ja": "英国政府は、フランスからのゴムボートでの難民到着に反対するためにポーツマスに集結した数百人の抗議者を非難した。警察は暴動警察隊を配備して抗議活動に対処し、デモは早朝まで続いた。当局は国境管理への懸念が高まっていることを示していると述べているが、ほとんどの抗議者は合法的に抗議活動を行っていることを認めている。", "summary_en": "The U.K. government has condemned hundreds of protesters in Portsmouth who gathered to oppose the arrival of migrants on dinghies from France, with police deploying riot shields to manage the demonstrations. The protests, which lasted until early morning hours, represent what officials describe as an escalation of concerns over border control, though authorities acknowledge most protesters were lawfully exercising their right to demonstrate. Since Labour's election in July 2024, the government reports preventing 48,000 crossing attempts through Anglo-French cooperation agreements.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/uk-government-condemns-anti-immigrant-protests-over-channel-crossings/article71438140.ece", "state_media": false, "category": "政治", "full_text": "The U.K. government and Ministers condemned protests by hundreds of people in Portsmouth, who had gathered until the early hours of Monday (September 7, 2026) morning to protest the arrival of illegal migrants on a dinghy from France. Protesters faced off with police holding riot shields, as they sought to block buses carrying migrants for processing in Kent.\n“We condemn the intimidating and thuggish behaviour we saw in Portsmouth last night,” a Home Office spokesperson said in a statement emailed to The Hindu and other news organisations.\nThe words were echoed by government Ministers. The way the protesters behaved “crosses a line”, Treasury Secretary Emma Reynolds said.\nPolice and Crime Commissioner for Hampshire and the Isle of White, Donna Jones, who is affiliated to the Conservative Party, said 140 migrants arrived in one boat early Sunday (September 6) morning from France and arrived in the U.K. around midday on Sunday.\nThe boat had reportedly been followed by French authorities for about 10 hours, halfway across the English Channel. The Home Office declined to comment on whether any of the migrants who had arrived in Portsmouth on Sunday were Indian nationals.\nA day earlier, some 200 protesters took to the streets in the coastal port town of Dover, with visuals of masked men boarding trains and marching along the road chanting , “Whose streets? Our streets.”\nBusiness Secretary Jonathan Reynolds said: “I condemn it. I mean, peaceful protest – essential part of British life, but that’s not dressing up in costumes like this and disrupting people’s lives.”\n‘Lack of border control’\nCommissioner Jones said the U.K. government had “lost control” of the 100s of miles of British coastline in an interview with Sky News. In another interview, she said that her constituency did not have the processing facilities for migrants and that there would be “significant” issues if traffickers shift their routes from Dover to Portsmouth, which is farther west than where dinghies carrying migrants from France typically enter the U.K.\nThe number of protestors had grown to 400-500 by midnight on Sunday, and they stayed on till about 3 a.m. in Eastney, in Portsmouth, Ms. Jones said “when a legal position was agreed” and protesters agreed they had made their point.\nMs. Jones called the protests “a very worrying escalation” of the situation but said “most” protesters were lawfully protesting. She said the incidents were a “real wake up call” for the U.K. government over the lack of border control.\nSince the July 2024 election of the Labour government under Keir Starmer, 48,000 crossing attempts had been prevented as per government data. The French and U.K. governments have signed two agreements, since the election, to control irregular crossings through the English Channel.\nPublished - September 07, 2026 03:43 pm IST", "translation_ja": "", "vocab": [{"word": "intimidating", "definition": "相手を恐れさせたり、怖がらせたりする様子。ここでは抗議者の行動が脅迫的であることを指す。"}, {"word": "thuggish", "definition": "暴力的で粗暴な行動や態度のこと。犯罪的または威圧的な振る舞いを表現する。"}, {"word": "escalation", "definition": "状況や問題が段階的に悪化・激化すること。より深刻なレベルへの進展を意味する。"}, {"word": "irregular crossings", "definition": "違法または非公式な方法での国境越え。政府が規制しようとしている不正な越境を指す。"}, {"word": "constituency", "definition": "選挙区または代表される地域。政治家が代表する特定の地域社会のこと。"}, {"word": "traffickers", "definition": "密輸者や人身売買者のこと。違法に人や物を運搬する犯罪者を指す。"}]}, {"title_ja": "戦争犯罪人ムラディッチの葬儀に数千人が参列、過去の傷を再び開く", "title_en": "Funeral of Convicted War Criminal Mladic Draws Thousands, Reopens Old Wounds", "summary_ja": "ジェノサイドと戦争犯罪で有罪判決を受けたボスニア・セルビア系将軍ラトコ・ムラディッチの葬儀がベオグラードで数千人の参列者を集め、多くの人が彼をスレブレニツァ虐殺とサラエボ包囲戦での役割にもかかわらずヒーローと見なしていることが示された。このイベントは国際的な論争を引き起こし、EUはセルビアの戦争犯罪人の美化を批判し、ボスニアは抗議として大使館職員を撤退させた。葬儀は1990年代の紛争の記憶方法について、バルカン地域における深い分裂を浮き彫りにした。", "summary_en": "Thousands gathered in Belgrade for the funeral of Ratko Mladic, a former Bosnian Serb general convicted of genocide and war crimes, with many viewing him as a hero despite his role in the Srebrenica massacre and Sarajevo siege. The event sparked international controversy, leading the EU to criticize Serbia's glorification of a war criminal and Bosnia to withdraw embassy staff in protest. The funeral highlighted deep divisions in the Balkans over how to remember the 1990s conflicts.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/funeral-of-convicted-war-criminal-mladic-draws-thousands-opens-old-wounds/article71440164.ece", "state_media": false, "category": "政治", "full_text": "Thousands of people gathered in Belgrade on Monday (September) for the funeral of the former Bosnian Serb General Ratko Mladic, who died last week while serving a life sentence for genocide, war crimes and crimes against humanity.\nCrowds carrying Serbian flags and pictures of Mladic wearing a traditional Serbian military cap gathered outside the church in a Belgrade suburb where the head of the country’s Orthodox church, Serbian Patriarch Porfirije, presided over the service.\nMladic’s coffin, surrounded by armed soldiers in fatigues and accompanied by a brass band, was then paraded through streets thronged with onlookers, who chanted his name. He was buried at a nearby cemetery next to his daughter, who died in 1994.\nAlso read | Judges uphold conviction of Serb military chief Ratko Mladic\nIt was one of the biggest public funerals in Serbia since the fall of communism in 1990 and showed how revered Mladic remains among many in Serbia and in Bosnia’s autonomous Serb Republic, despite his convictions linked to his role in the 1995 Srebrenica massacre and in the siege of Sarajevo — two of the bloodiest events in post-war Europe.\n“He is a hero,” Djordje, a 34-year-old man who came from Prijepolje to pay respects to Mladic, said. “He was a great military strategist.”\nCONFLICTS TRIGGERED BY BREAK-UP OF YUGOSLAVIA\nMladic’s death has stirred up strong feelings linking back to the break-up of Yugoslavia and the ethnic conflicts that ensued in the Balkans.\nMladic was found guilty by the United Nations International Criminal Tribunal for the former Yugoslavia of genocide for his role in the 1995 Srebrenica massacre, in which about 8,000 Bosniak Muslim men and boys were killed after Bosnian Serb forces overran the UN-designated enclave.\nHe was also convicted over the 43-month siege of Sarajevo, during which about 10,000 people were killed.\nLast week, EU enlargement commissioner Marta Kos postponed her visit to Serbia, which is a candidate country to join the bloc, because of what she said was the “glorification” of Mladic after his death, including the use of a government plane to return him to Serbia.\n“The Western Balkan armed conflicts of the 1990s were among Europe’s darkest moments in its recent history,” an EU spokesperson said in a statement on Monday (September 7).\n“Any glorification of war criminals, genocide denial and revisionism contradict the most fundamental European values and have no place in the EU or in EU candidate countries.”\nSerbian President Aleksandar Vucic, who dismissed Kos’ statement last week, did not attend the funeral. However, his son Danilo attended, along with Defence Minister Bratislav Gasic and Justice Minister Nenad Vujic.\nPAINFUL REMINDER FOR THOUSANDS\nIn Sarajevo, meanwhile, the funeral rekindled painful memories of the war. Telecom companies in Bosnia’s Bosniak-Croat federation blocked the signal of the two Bosnian Serb TV stations that carried live broadcast of the funeral and procession.\nBosnia’s Foreign Minister Elmedin Konakovic said the country will withdraw all staff from its embassy in Belgrade except for the ambassador and consul in protest at Serbia’s handling of the funeral, including the military escort of the body and the attendance of government officials.\n“It is really horrible that this is taking place there [in Belgrade] because I know there are normal people who are against it,” said Zdravka Gvozdjar, a retired pharmacist whose 9-year-old son was killed during the Sarajevo siege by a grenade fired by the Mladic-led forces, one among more than 1,000 children killed in the city.\n“Mladic ... only deserved to be erased from memory for good, not to be ... promoted as a hero,” she said. “He should be remembered only as a butcher.”\nPublished - September 07, 2026 11:24 pm IST", "translation_ja": "", "vocab": [{"word": "glorification", "definition": "ある人や行為を過度に賞賛し、その重要性や価値を誇大に表現すること。通常はネガティブな文脈で使用され、戦争犯罪人など問題のある人物を英雄視することを指す。"}, {"word": "enclave", "definition": "周囲を異なる領土や勢力に囲まれた地域。特に国際紛争やジェノサイドの文脈では、保護されるべき少数民族地域を指す場合が多い。"}, {"word": "tribunal", "definition": "特定の目的で設置された裁判所または司法機関。国際犯罪や戦争犯罪を裁くために国連などが設置する特別法廷を指す。"}, {"word": "revisionism", "definition": "歴史的事実を意図的に改変または否定する行為。特に戦争犯罪やジェノサイドなどの不都合な歴史事実を否定する政治的活動。"}, {"word": "candidacy", "definition": "国際機関や組織への加盟を目指す国の立場。EUなどへの加盟候補国として認定されている状態。"}, {"word": "ethnic conflict", "definition": "異なる民族集団間で発生する武力紛争。通常は領土問題やアイデンティティをめぐる対立が原因となる。"}]}, {"title_ja": "トランプの関税がアメリカ企業のカナダ移転を促進", "title_en": "Trump's Tariffs Push U.S. Companies to Relocate to Canada", "summary_ja": "トランプ大統領の関税政策に対応するため、米国企業がカナダに事業を移転している。この動きは、関税の影響を回避するため米国外に事業を拡大するアメリカ企業の広がる傾向を反映している。複数の企業が同様の戦略的移転を行っているとトロント・スターが報じている。", "summary_en": "A U.S. 文化的な経験となるでしょう。", "summary_en": "Rio de Janeiro's iconic Copacabana beach will host a diverse New Year's Eve celebration featuring multiple music genres. The festivities will include gospel music, funk, MPB (Brazilian Popular Music), and traditional samba performances. The event promises a vibrant cultural experience as locals and tourists ring in the new year together.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi4wFBVV95cUxQdkJ5QUYtN1VFbXVPSWVvbDNnd0R0RC1rOFJ1ZnRIQXpqQm5ZeGtjaHdIQ2VQZTYtSEcwR2JTaFU2aXlZMlZxRE14SExNTEpzVXFpQV9sckpoZXFXaTZPNmhMSE1mN2Q5VlQyek5zTmJId3d6U3ZqWW9WekZqUkNqMzBBRWZ5NWRmNjJkQ3Fhd0hNUUpRMEc4TDJBcGR4ZHB4NFltcEg4NXU4OHZqQlJYc2lmaVFXalhBaUIydnBnR0RjeDJGeFRGN2t3VGoyOTgyV0hCSDdVbkc3bkRnWEdwRVFDVdIB8gFBVV95cUxPWXo1WGF3VGVqVFlPQUcyWUZNbVc3bExHQnoyZU5LXzBTeUhucDZFMU11R2laZzdCLUpaemlPOEw2MDhRSEd2dW41UWhnenV2NWZwdVFzb3JHb2l1Z2FnTVh6Yi1IRkNnUTZTcE5RbHlrTFVmRWxlejB4TEo0UmR6RjI3SE80alI0RDRxNEpGRlpXWUFCSHo3RllKQ0owVm1aQzMwcFlkMzBYbF9nRlhmT3NBZ2hUOXJUMDNxSWh6SXUwZ1ZUa1AxYllsbk5sVW9wZ09RYUlIeFZ6VGJQaE0zYkhpdUZucW4zX1VBaUhkWV9Bdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "陸軍、南東部の分離主義勢力に対する攻撃継続を表明 - 地域司令官", "title_en": "Army to Sustain Offensive Against Separatists in South-east – GOC", "summary_ja": "ナイジェリア陸軍第82師団司令官のオルレミ・ファダイロ少将は、南東部の分離主義勢力に対する継続的な軍事作戦へのコミットメントを改めて表明した。司令官は、情報主導の作戦、巡回活動、標的化された掃討作戦を通じてIPOBとESNの作戦能力を低下させ続けていると述べた。犯罪ネットワークの復活を防ぐため、オペレーション・イースタン・サニティIIの下での乾季作戦強化の準備が進行中である。", "summary_en": "Major-General Oluremi Fadairo, commander of the 82 Division Nigerian Army, reaffirmed commitment to sustained military operations against separatist groups in the South-east during an address to Army War College participants. The GOC stated that troops continue to degrade the operational capabilities of IPOB and ESN through intelligence-driven operations, patrols, and targeted clearance missions. Preparations are underway for intensified dry-season operations under Operation EASTERN SANITY II to maintain pressure and prevent resurgence of criminal networks.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/908021-army-to-sustain-offensive-against-separatists-in-south-east-goc.html", "state_media": false, "category": "政治", "full_text": "The General Officer Commanding (GOC) 82 Division, Nigerian Army, Oluremi Fadairo, has reaffirmed the division’s commitment to sustaining decisive military operations against separatist groups in the South-east.\nMr Fadairo, who is a major-general and the commander of the Joint Task Force South-East, Operation UDO KA, said the division would continue to deal decisively with criminals undermining peace and security in the South-east.\nThe GOC disclosed this while addressing participants of Army War College Nigeria Course 10/2026 during their Operational Theatre Visit to Headquarters 82 Division, Enugu on Monday.\nThe visit, which forms a critical component of the course, formally commenced on 3 September and concluded on 6 September.\nMr Fadairo noted that the security situation within the division’s area of responsibility remained relatively stable and firmly under control.\nAccording to him, this is because troops continue to degrade the operational capabilities of the Indigenous People of Biafra, Eastern Security Network and other criminal groups.\nHe highlighted that sustained intelligence-driven operations, aggressive patrols, and targeted clearance missions had dismantled criminal hideouts and disrupted their activities, significantly restricting their freedom of action across the region.\nThe GOC noted the successes recorded by troops in stabilising the South-east, while stressing that continuous operational assessment, intelligence exploitation, and adaptive security responses are essential to completely eliminate residual threats.\nHe charged the participants to leverage the knowledge and operational insights gained during the study tour to develop innovative and sustainable strategies for addressing contemporary security challenges confronting the nation.\nMr Fadairo further emphasised the importance of security forces remaining proactive, intelligence-led, and resolutely focused on protecting lives and property, while denying criminals any opportunity to establish operational footholds.\nHe disclosed that preparations are underway for intensified dry-season operations under Operation EASTERN SANITY II, with emphasis on maintaining operational pressure and preventing the resurgence of criminal networks.\n“The armed forces will continue to employ lawful and decisive measures against elements whose activities threaten national security,” he said.\nThe GOC said the division would continue to discharge its duties in close coordination with other security agencies and relevant stakeholders.\nREAD ALSO: SPECIAL REPORT: IPOB-linked attacks, killings reduce since Simon Ekpa’s jailing\nMajor highlights of the visit included tours of sectors’ areas of responsibilities, a visit to the National War Museum, wargaming exercises, and a series of presentations on the operational achievements and challenges of Joint Task Force South-East, Operation UDO KA.\nThese sessions provided participants with practical insights into the operational environment, lessons learned, and the complexities of countering asymmetric threats in the South-east.\nThey were also provided insights on ongoing peace-building processes aimed at consolidating stability in the region.\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "reaffirmed", "definition": "再度確認する、もう一度強く主張すること。以前の立場や意見をあらためて確実にすることを意味する。"}, {"word": "asymmetric threats", "definition": "非対称的脅威のこと。従来の軍事力ではなく、ゲリラ戦やテロなど予測困難な戦術による脅威を指す。"}, {"word": "degrade", "definition": "低下させる、弱体化させること。敵の能力や施設を段階的に損傷・減少させることを指す。"}, {"word": "consolidated", "definition": "統合する、強化する。分散したものをまとめ、より強固にすることを意味する。"}, {"word": "residual threats", "definition": "残存する脅威のこと。主要な作戦後に残る潜在的な危険や問題を指す。"}, {"word": "footholds", "definition": "足がかり、拠点のこと。敵が活動の基盤となる場所や支配地域を確立することを意味する。"}]}, {"title_ja": "ラゴスでの暴徒殺人疑いで4人逮捕", "title_en": "Police Arrest Four Over Alleged Mob Killing in Lagos", "summary_ja": "ラゴス島フリーマン通りでの交通事故後、バシット・コラデが暴徒に殺害された事件に関連して4人の容疑者が逮捕されました。コラデとバイク運転手の言い争いがエスカレートし、その場に居合わせた人々が凶器でコラデを攻撃しました。警察は捜査を継続しており、暴徒暴力に対する警告を発しており、この事件を殺人として扱っています。", "summary_en": "Four suspects have been arrested following the mob killing of Basit Kolade after a road accident on Freeman Street, Lagos Island. The incident occurred when an argument between Kolade and a motorcycle rider escalated, leading onlookers to attack Kolade with weapons. Police are investigating further and have warned residents against mob violence, treating the case as homicide.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/908017-police-arrest-four-over-alleged-mob-killing-in-lagos.html", "state_media": false, "category": "社会", "full_text": "Four people have been arrested in connection with the alleged mob killing of Basit Kolade after a road accident on Freeman Street, Lagos Island, the Lagos State Police Command said on Monday.\nThe incident happened at about 10:40 p.m. on Wednesday, 2 September.\nThe police spokesperson, Abimbola Adebisi, disclosed in a statement that Mr Kolade was travelling with his spouse from Ebute Metta towards Lagos Island in a black Lexus SUV when a motorcycle allegedly rammed into the vehicle from behind.\nThe statement noted that the crash led to an argument between Mr Kolade and the motorcycle rider.\nShe explained that the vehicle later reversed and hit the motorcycle, throwing the rider and the motorcycle to the ground.\nMs Adebisi revealed that people gathered at the scene following the incident. Some of them allegedly attacked Mr Kolade with dangerous weapons.\nHis spouse was rescued by some women in the area. Mr Kolade was taken to Lagos Island General Hospital, where he was confirmed dead.\nThe motorcycle rider survived and is receiving treatment in a hospital, according to the police.\nFour suspects arrested\nThe suspects arrested by the police are Khalid Rafiq, 20; Gafar Rahim, 21; Ibrahim Azeez, 33; and Samos Momoh, 21.\nThe command explained that efforts were ongoing to identify and arrest other people suspected of taking part in the attack.\nThe case has been transferred to the State Criminal Investigation Department, Panti, for further investigation and legal action.\nThe Commissioner of Police, Tijani Fatai, ordered investigators to identify everyone involved in the attack and bring them to justice.\nThe command stressed that it was treating the incident as homicide.\nIt also warned residents against mob attacks, saying no one has the right to arrest, try or punish another person outside the law.\nThe police cited Section 33 of the Nigerian Constitution, which protects the right to life, as well as provisions of the Lagos State Criminal Law dealing with unlawful killing.\nThe command said its position was consistent with a directive by the Inspector-General of Police, Olatunji Disu, that cases of mob action resulting in death should be treated as homicide.\nIt warned that anyone who takes part in, organises, incites or supports such attacks would be prosecuted.\nPrevious warnings\nThe Lagos police had issued similar warnings against mob violence in the past.\nIn 2016, the then Commissioner of Police, Fatai Owoseni, warned that people involved in mob attacks on suspected criminals would be prosecuted.\nHis warning came after several reported cases of mob violence in Lagos, including the alleged burning of two suspected kidnappers at Ajala Bus Stop, Ijaiye-Ojokoro, along the Lagos-Abeokuta Expressway.\nTwo days later, armed police officers reportedly intervened to stop a mob from lynching a suspected kidnapper at Ile-Zik, also along the expressway.\nIn another case, a man described at the time as a destitute who appeared to be mentally deranged was reportedly set ablaze after he was accused of possessing a telephone.\nREAD ALSO: Police apprehend four over alleged mob killing in Uyo\nMr Owoseni said mob attacks could destroy evidence needed by investigators and put police officers at risk when they tried to stop them.\nThe issue was also raised in the Senate in November 2016 after reports that a seven-year-old boy had been lynched in Lagos over an allegation that he stole garri.\nThe report was disputed, including the boy’s age and whether the incident occurred as reported. The Lagos police stated at the time that they had no evidence confirming the alleged killing.\nThe Senate nevertheless condemned the reported cases of jungle justice and called on the police to investigate the matter and prosecute perpetrators of mob violence.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "homicide", "definition": "人が違法に他人を殺すこと、または故意に人命を奪う犯罪行為。法的には殺人罪として扱われます。"}, {"word": "lynch", "definition": "法的手続きを経ずに、暴徒が被疑者に対して行う暴力や殺害行為。ここではmob violenceの一形態です。"}, {"word": "perpetrator", "definition": "犯罪や悪行を実行する人物。起訴や処罰の対象となる加害者を指します。"}, {"word": "incite", "definition": "他人に対して暴力や違法行為を起こすよう促す、扇動する、また鼓舞することを意味します。"}, {"word": "jungle justice", "definition": "法的制度を無視した暴力的な自力救済や私刑。組織された司法制度の外で行われる報復行為を指します。"}]}, {"title_ja": "2026年アメリカン・エキスプレスを受け付けるオンラインカジノ最高峰", "title_en": "Best Online Casinos Accepting American Express in 2026", "summary_ja": "プレミアム・タイムズが2026年にアメリカン・エキスプレスカードを受け付ける上位5つのオンラインカジノをレビューし、迅速な入金処理、詐欺防止、リワードの統合を強調しています。ワイルドカジノが豊富なゲームライブラリと信頼性の高いアメックス対応でランキングをリードし、ベットオンラインAGとスポーツベッティングAGなどの他の有力候補が異なるゲームカテゴリーで特化した強みを提供しています。この記事は、アメリカン・エキスプレスがより短い承認経路、優れた紛争保護、シームレスなリワード累積により、オンラインゲーミングの支払い方法として際立つ理由を説明しています。", "summary_en": "Premium Times reviews the top five online casinos that accept American Express cards in 2026, highlighting their fast deposit , "tier": "paper", "link": "https://www.nytimes.com/2026/09/07/world/middleeast/israel-lebanon-strikes-hezbollah.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ドイツの極右勢力に対する「防火壁」が過去最大の試練に直面", "title_en": "Germany's 'Firewall' Against Far Right Tested as AfD Gains", "summary_ja": "極右政党ドイツのための選択肢党（AfD）が州選挙で大勝利を収め、極端主義政党を孤立させるというドイツの長年の戦略に挑戦している。この結果は、極右運動を主流政治から排除するために設計された数十年前の「防火壁」戦略を維持すべきかどうかについて、ドイツ国民の間に分裂があることを明らかにした。", "summary_en": "The far-right Alternative for Germany party achieved a significant electoral victory in a state election, challenging the country's long-standing strategy of isolating extremist parties. The result has exposed divisions among German voters about whether to maintain the decades-old 'firewall' approach designed to keep far-right movements from mainstream politics.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/09/07/world/europe/germany-afd-election-saxony-anhalt-election.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが検問所を開放、パレスチナ人がガザ北部へ帰還", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "イスラエルは人質解放をめぐる膠着状態が打開された後、ガザを二分する軍事地帯の通過を許可し、避難していたパレスチナ人の帰還が始まった。この決定により、住民は一時的な移動制限の後、飛び地の北部地域への帰路が開かれた。軍による市民の移動制限が緩和されたことを示している。", "summary_en": "Israel has allowed displaced Palestinians to cross a military zone that divides Gaza following a breakthrough in hostage release negotiations. The move enables residents to return to the northern part of the enclave after a period of restricted movement. The crossing represents a shift in the military's restrictions on civilian movement through the contested territory.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の大手不動産開発企業バンケ、巨額損失を報告—不動産危機の深刻化を示唆", "title_en": "China's Leading Property Developer Reports Massive Loss Amid Real-Estate Crisis", "summary_ja": "中国最大級の不動産開発企業バンケが巨額の損失を報告し、国内の不動産危機がさらに深刻化していることが明らかになった。北京政府がセクター安定化のため介入するかどうかについて懸念が高まっている。", "summary_en": "Vanke, one of China's largest property developers, has reported a significant loss, signaling a deepening real-estate crisis in the country. The financial troubles raise concerns about whether Beijing will intervene to stabilize the sector and prevent further deterioration of the property market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From Oct. 7 Attack", "summary_ja": "イスラエルの医療関係者によると、解放された人質の一部には10月7日の攻撃による破片が体内に残っている。複数の女性は長期間隔離されて拘束され、8ヶ月間トンネル内に閉じ込められていたという。", "summary_en": "Israeli medical officials report that some of the freed hostages still have shrapnel embedded in their bodies from the October 7 attack. Several women were held in isolation for extended periods and spent eight months confined in tunnels during their captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "仕事がいかに家族をより平等にするか", "title_en": "How work makes families more equal", "summary_ja": "エコノミスト誌は、雇用を通じた経済的自立がいかに家族のダイナミクスを変革し、家庭内の不平等を減らすかを探究している。特に女性の経済参加が、家族内の権力関係と意思決定権を根本的に変えると主張している。", "summary_en": "The Economist explores how financial independence through employment transforms family dynamics and reduces inequality within households. The article argues that economic participation, particularly for women, fundamentally reshapes power relations and decision-making authority in family units.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/03/how-work-makes-families-more-equal", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ戦争が激化：スウェーデン、ロシアとの50年間の対立に備える", "title_en": "Ukraine War Intensifies: Sweden Braces for 50 Years of Russian Confrontation", "summary_ja": "ウクライナでの紛争は激化し、地理的範囲も拡大しており、軍事的には膠着状態が続いている。ウクライナの同盟国となったスウェーデンは、ロシアとの対立が数十年続く可能性に備えている。この厳しい見通しは、継続的な緊張と地域の不安定性の長期化を示唆している。", "summary_en": "The conflict in Ukraine is escalating in intensity and geographic scope while remaining militarily stalemated. Sweden, now a Ukrainian ally, is preparing for a prolonged confrontation with Russia lasting potentially five decades. The grim outlook reflects expectations of sustained tensions and ongoing regional instability.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/09/01/the-ukraine-war-is-intensifying-expanding-and-stuck", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "AIが宗教を変え、宗教がAIを変えようとしている", "title_en": "AI is Changing Religion and Religions are Trying to Change AI", "summary_ja": "チャットボットなどの人工知能は宗教実践との交差点で急速に普及しており、AIがイマームや司祭などの精神的指導者に取って代わるのか、それとも宗教的伝道を強化するツールとなるのかという問題が生じている。宗教機関はAI開発を自らの価値観と教義に合わせるための形成に奮闘している。精神的指導を民主化するAIの可能性と、本物の宗教的相談を提供する上でのAIの限界に関する懸念の間の緊張は、中心的な議論のままである。", "summary_en": "Artificial intelligence and chatbots are increasingly intersecting with religious practice, raising questions about whether they will replace spiritual advisors or become tools to enhance religious outreach. Religious institutions are grappling with how to shape AI development to align with their values and teachings. The tension between AI's potential to democratize spiritual guidance and concerns about its limitations in providing authentic religious counsel remains a central debate.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/27/ai-is-changing-religion-and-religions-are-trying-to-change-ai", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2027年フランス大統領選挙：極右と急進左派の対決が予想される中、主流政党は敗北感に支配される", "title_en": "2027 French Election: Political Paralysis as Mainstream Parties Face Far-Right and Radical Left", "summary_ja": "フランスの政治指導者たちは、2027年の大統領選が極右と急進左派の対立に陥る可能性が高いと考え、政治的な敗北感に支配されつつある。新しい政策立案能力を欠いた主流政党は、国家が直面する本質的な課題から遠く離れた政治的な駆け引きに没頭している。中道主義政党は、これらのイデオロギー的対立の中で自らの立場を確立するのに苦戦している。", "summary_en": "French political leaders appear increasingly resigned to a polarized 2027 presidential race between the far right and radical left, with mainstream parties lacking new ideas and focused on political maneuvering rather than substantive solutions. The political establishment's sense of defeat is undermining meaningful engagement with the critical issues facing the nation. Short on vision, centrist parties are struggling to position themselves amid the ideological divide.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/politics/article/2026/09/07/2027-presidential-election-the-risks-of-a-campaign-overshadowed-by-the-spirit-of-defeat_6757261_5.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス、ドイツ極右政党のザクセン・アンハルト州選挙勝利に動揺", "title_en": "France Reacts to Far-Right AfD Victory in German Regional Elections", "summary_ja": "ドイツの極右政党「ドイツのための選択肢」（AfD）がザクセン・アンハルト州の地域選挙で勝利を収め、フランスの政治勢力から素早い反応が寄せられた。フランスの極右「国民連合」は、第二次世界大戦中のナチスSS部隊の役割に関する物議を醸す発言を理由に2024年にAfDと関係を断絶した経緯から、この結果に不安を表明した。", "summary_en": "Alternative for Germany (AfD) won regional elections in Saxony-Anhalt, prompting swift responses from French political
