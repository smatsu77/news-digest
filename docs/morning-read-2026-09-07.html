, the National Transportation Safety Board (NTSB) has said.\nFive people were killed and five others seriously injured when the Boeing 767-300, operated by 21 Air, overshot the runway shortly before 14:00 local time (19:00 BST) on Sunday.\nThe plane hit two vehicles, including a white van carrying seven people within the airport perimeter, and a Toyota with three passengers.\nNTSB chairwoman Jennifer Homendy said it was too early to draw conclusions about what caused the crash, with investigators still in the \"fact finding stage\".\nSpeaking at a press conference at Miami International Airport on Monday, Homendy said the aircraft had two crew members on board and was arriving from San Juan, Puerto Rico, on its third flight of the day.\nThe plane struck navigational aids and equipment after overrunning the runway, before hitting a white Ford van owned by a contract cleaning company.\nIt then travelled through a perimeter fence and collided with a Toyota Corolla, coming to rest about 1,300ft (394m) beyond the runway.\nHomendy described the crash scene as \"devastating\", with debris from the aircraft, vehicles and airport fencing scattered across the area.\n\"It's hard to see, and I'm sure very difficult for the first responders as well,\" she said.\nShe said recovering victims' bodies was the current priority, adding: \"The investigation and access to the aircraft, as well as evidence, can wait.\"\nThe flight data recorder and cockpit voice recorder have been recovered and are being sent to NTSB headquarters for evaluation.\nHomendy said investigators could not yet say anything substantive about the cause of the crash as they were still collecting evidence at the scene.\nInvestigators will examine the flight history, crew experience and training, radar data, and aircraft performance. Separate teams will look at the plane's systems and engines, while a meteorologist will assess the weather conditions at the time of landing.\nThe NTSB will also examine whether the runway should have had an engineered materials arresting system (EMAS), which is designed to slow and stop aircraft that overrun a runway. Homendy said this would be a \"key\" part of the investigation.\nEarlier analysis by BBC Verify found there was an active thunderstorm near the airport shortly before the crash, with winds gusting up to 26 knots.\nThe NTSB has appealed for members of the public to share photographs or videos that could aid the investigation.\nHomendy said the agency would make safety recommendations at the end of its investigation. \"That's why we're here - to prevent the next tragedy,\" she said.\n\"Our recommendations must be implemented, or we'll be here again.\"\nTwo of the four runways at the airport remained closed following the crash. Passengers have been warned to expect further disruption after Sunday's cancellations affected the arrival of aircraft and flight crews.\nThe crash happened during the Labor Day holiday weekend, one of the busiest travel periods in the US.\nAmazon said it was \"heartbroken\" by the loss of life and that it was working closely with authorities.\n21 Air, the company operating the aircraft, expressed its condolences and said it was co-operating with the investigation.\n  - Published14 hours ago\n  - Published5 hours ago", "translation_ja": "", "vocab": [{"word": "overrun", "definition": "滑走路や指定された境界を超えて走り続けること。航空用語では、着陸時に航空機が滑走路の端を超えて進むことを意味します。"}, {"word": "perimeter", "definition": "囲まれた地域の外周や境界線。空港の周囲のような限定された地域の端を指します。"}, {"word": "navigational aids", "definition": "パイロットが正確な位置を判断し、安全に航行するために使用される装置やシステム。レーダーやビーコンなどが含まれます。"}, {"word": "cockpit voice recorder", "definition": "航空機のコックピット内での音声や会話を記録する装置。事故原因の究明に重要な証拠となります。"}, {"word": "arresting system", "definition": "滑走路をオーバーランする航空機を減速・停止させるための安全装置。エンジニアリング材料を使用した技術です。"}, {"word": "substantive", "definition": "実質的で重要な内容を持つこと。表面的ではなく、確かな根拠に基づいた意見や情報を指します。"}]}, {"title_ja": "入植者の暴力激化に脅かされるパレスチナの学校", "title_en": "Palestinian School Under Siege as Settler Violence Escalates in West Bank", "summary_ja": "占領下のヨルダン川西岸地区にあるアル・ムガイヤル男子校では、入植者による攻撃の激化により6人が殺害され、そのうち3人は学生です。学校は有刺鉄線フェンスと強化ゲートを設置し、救急車が駐屯し、保護者が警備に当たっています。危険にもかかわらず、家族たちは暴力の脅威に抗して子どもの教育を継続することを決意しています。", "summary_en": "Palestinian parents at al-Mughayyir boys school in the occupied West Bank fear for their children's safety as settler attacks have intensified, killing six villagers including three students this year. The school has installed barbed wire fencing and reinforced gates, with ambulance crews stationed outside and parents volunteering to stand guard. Despite the dangers, families remain determined to continue their children's education despite the threat of violence.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c3wj45g73g1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Palestinian parents fear for children's lives at school as settler attacks grow\n- Published\nOn the first day of the new Palestinian school year, the head-teacher of al-Mughayyir boys school arrived at work before dawn, walking past the freshly installed barbed wire fencing and reinforced school gates as the sun began creeping through olive trees around the village, deep inside the occupied West Bank.\n\"We are scared,\" Bassam al Assaf told me. \"The students are afraid, and their parents are afraid.\"\nSix people, including three pupils at the school, have been killed in al-Mughayyir this year, in a surge of settler-related violence against Palestinians. One of them, 14-year-old Aws al-Naasan, was shot dead by a settler outside the school gates in April.\n\"I was inside my classroom and two little students came rushing to tell me there were settlers close to the school wall,\" remembers English teacher Waheed Abu Naem, whose brother Jihad was also killed by an Israeli soldier in the same attack.\nWaheed said he was trying to move pupils to safety inside the school gate when the settler fired towards them. Mobile phone footage shows the moment Aws was shot.\n\"When I turned him onto his back, I saw lots of blood coming from his nose and mouth, and the bullet in his head,\" said Waheed. \"We lost him.\"\nHe told me that bullets continued hitting the school building, as students hid behind the walls of their classrooms, or lay on the floor.\nThe Israeli military said in a statement at the time that stones had been hurled at a car carrying \"civilians including a reservist soldier\", and that the reservist had got out of the vehicle and fired at suspects.\nIsraeli media reported the reservist was later suspended from duty and an investigation launched.\nSince that day, the casualties have grown alongside parents' fears.\nOver the summer, two more pupils were shot dead by Israeli forces during settler attacks and incursions in the village, along with a 19-year-old who had just left the school.\nIn both cases, Israel's army said its forces responded to instigators of \"a violent riot\".\nWith three empty desks in the classrooms, some parents were reluctant to send their children back for the new school year.\nThe school sits right on the edge of Al-Mughayyir, an isolated village north-east of Ramallah, increasingly surrounded by Jewish settler outposts, and regularly blocked by Israeli forces who frequently operate an ad-hoc checkpoint at the entrance.\nBassam al-Assaf has installed a long barbed-wire fence around the compound and reinforced the school gates, to try and reassure parents. Ambulance crews are now stationed on the road outside, and several parents have volunteered to wait outside the school all day as an extra layer of protection.\n- BBC tracks one week of Israeli settler violence in occupied West Bank \n  - Published28 August\n- Palestinian teens killed during settler attack on West Bank village \n  - Published4 days ago\n\"I came because it makes the children feel their parents are with them, that they are safe, it gives them a kind of security,\" said Haroon Bishara, whose boys are in the first and second grades.\n\"We fear for our children more this year,\" he told me. \"We know the situation is not safe at the school.\"\nBut he said that fear was mixed with a determination not to let the threat from settler attacks force them out.\nLined up in the playground for their first assembly, pupils heard the instructions repeated by teachers again and again throughout the day: if soldiers or settlers approach the school, don't shout, don't go near them, don't react.\nJust over an hour after classes began, settlers were spotted through the school windows: two men, driving sheep through Palestinian fields a couple of hundred metres from the school, as Israeli soldiers stood close by.\nMinutes later, another settler with a flock of sheep appeared.\n\"They have got closer to the village since April,\" said Abu Naem. They used to keep their sheep behind this [hill], but now the soldiers bring the settlers up to the village.\"\nWe asked the Israeli army for its response to all the allegations in this report, but they were unable to provide one before publication.\nAll Israeli settlements in the occupied West Bank are illegal under international law. Many of the small ad-hoc settler outposts that have mushroomed around al-Mughayyir are illegal under Israeli law too.\nBut one of the ambulance crews stationed outside the school said that, rather than remove illegal settlements, Israeli soldiers had begun supporting and enabling settler incursions into the village.\nHadi al-Naasan, an ambulance driver in the village, said there had been a shift in the behaviour of Israeli forces over the past year. And that the rise in Palestinian deaths and injuries in al-Mughayyir this year reflected that.\n\"At the beginning of 2025, settler attacks were few, due to the army's interventions,\" he said. \"In 2026, the situation changed completely: the settlers became fully protect", "translation_ja": "", "vocab": [{"word": "surge", "definition": "急激な増加または上昇。ここでは入植者による暴力事件が急速に増えていることを表します。"}, {"word": "incursion", "definition": "領土や空間への不正な侵入。この場合、入植者がパレスチナの村に侵入する行為を意味します。"}, {"word": "ad-hoc", "definition": "特定の目的のために即座に作られた、一時的な。ここではイスラエル軍が必要に応じて設置する検問所を指します。"}, {"word": "compound", "definition": "塀や柵で囲まれた一体の施設や敷地。学校の建物と周辺の敷地全体を指します。"}, {"word": "enabling", "definition": "～ができるようにする、可能にする。この場合、イスラエル軍が入植者による侵入を可能にしていることを意味します。"}, {"word": "mushroomed", "definition": "急速に増殖する、雨後の筍のように増える。ここでは違法な入植地が急速に増加していることを表します。"}]}, {"title_ja": "ドイツ極右AfD、ザクセン=アンハルト州選挙での歴史的勝利後に「民主主義は連立を求めている」と主張", "title_en": "AfD Claims 'Democracy Demands' Coalition After Historic Saxony-Anhalt Election Win", "summary_ja": "ドイツの極右政党AfDがザクセン=アンハルト州で43.8%の得票率で歴史的勝利を収め、絶対多数に3議席届かなかった。同党は他政党に連立交渉への参加を求め、民主主義が協力を要求していると主張しているが、ドイツの大政党はAfDとの協力を拒否している。メルツ首相は この結果を「激震的」と呼び、CDUの得票率がほぼ半減した後、党として「根本的な改革」が必要であることを認めた。", "summary_en": "Germany's far-right AfD achieved a historic victory in Saxony-Anhalt with 43.8% of the vote, falling three seats short of an outright majority. The party is now demanding other parties enter coalition talks, arguing democracy requires cooperation, though most German parties refuse to work with them. Chancellor Merz called the result 'seismic' and acknowledged the CDU's need for 'profound reforms' after their vote share nearly halved.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cpd0113082eo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Germany's far-right AfD says 'democracy demands' parties work with them after state election win\n- Published\nThe far-right Alternative for Germany (AfD) is \"very, very close\" to taking power in the eastern state of Saxony-Anhalt, its deputy parliamentary leader has told the BBC, after a historic victory in elections there.\nSunday's preliminary results show it fell three seats short of an outright majority, with 43.8% of the vote. It is now seeking support from other parties or individuals in order to govern.\nWhile most German political parties refuse to work with the AfD, Beatrix von Storch called for its opponents to enter talks and said: \"You cannot say, I do not accept the vote of the people\".\nGermany's Chancellor Friedrich Merz said he was \"deeply shocked\" by the result, describing it as \"seismic... not just in the country but also in my own political party and I take that very seriously\".\nHis party, the conservative CDU, saw its share of the vote almost halved to 17.2% in the state's preliminary results.\nMerz said it was not possible to return to \"business as usual\", adding that the country needed \"profound reforms\" and the CDU needed to \"reach people at an emotional level\".\nNo far-right party has controlled a German state since World War Two, and governing at state level would mean powers over policing and local education.\nVon Storch said the state's results \"were on the table and now democrats have to talk to [one] another. This is what democracy demands\".\nShe added that if parties refused to work with the AfD, \"then we might end up in severe chaos and maybe we have a new election\".\nHer comments were echoed by AfD's leader in Saxony-Anhalt, Ulrich Siegmund, who told a news conference on Monday that the party had won a \"clear mandate to govern\".\nThe state's defeated premier, the CDU's Sven Schulze, also said the mandate to govern Saxony-Anhalt \"now lies with the AfD\".\nSaxony-Anhalt has a small population of 2.1 million and the AfD in the state is assessed by domestic intelligence as \"right-wing extremist\", a classification rejected by Siegmund, 35.\nThe party's plans for Saxony-Anhalt, which include segregating child refugees into special classes and setting up a task-force to help detain and deport migrants who no longer have the right to be in the state, are highly controversial within Germany.\nThe AfD is currently heading for 39 seats in the 83-seat state parliament instead of the 42 needed for an outright majority, although the result has not yet been finalised.\nVon Storch told the BBC the AfD was talking to individuals within the CDU group - the largest party in both the state's outgoing coalition and Germany's government - because they were \"very, very unhappy with their own party\".\nWhat could happen now?\nOne idea being floated is an informal deal whereby a small party - the BSW - could give their tacit support to allow the AfD to form a minority government.\nThe left-wing populist BSW, which is set to win five seats, is also tough on immigration and backs importing Russian gas.\nSiegmund said discussions with other parties were initiated on Sunday night and could potentially take days or weeks to conclude.\n\"We reach out to everybody first, we will have consultations and then we'll see whether [there are] individual parliamentary groups or MPs who would be willing to help us,\" he added.\nAnother possibility - at least in theory - is a messy, minority coalition government led by the conservative CDU party. But that appears very unlikely.\nThere's also the prospect of another election to break the deadlock - an idea which has been mooted by Siegmund who has said he doesn't want to compromise on his policy goals.\nThe AfD leads the opinion polls nationally, ahead of the ruling conservatives of Merz and the Social Democrats, but their heartland lies in the eastern states.\nThey also won the 2024 state election in neighbouring Thuringia, but failed to secure enough seats to win power.\nMerz described the Saxony-Anhalt defeat as the worst the CDU had suffered \"in years, if not decades\", acknowledging that the results in upcoming regional elections in Mecklenburg–Western Pomerania and Berlin could have \"increasing significance\".\nAmong the AfD's policies is a highly controversial plan for \"remigration\", which is widely understood to mean mass deportations of migrants, although the party says it refers to deporting criminals and those in the country illegally.\nCommentators and political opponents called AfD's victory a watershed and break with the past.\n\"This isn't just about Saxony-Anhalt,\" Siegmund told supporters overnight. \"It's a signal for the whole of Germany - a self-confident signal.\"\nOn Sunday, US President Donald Trump posted a screenshot of the state's projected results on his Truth Social platform. Russian presidential envoy Kirill Dmitriev then took a screengrab of Trump's post and praised a \"historic win for the pragmatic AfD\".\nDmitriev had earlier praised the Russia-friendly AfD as \"the party of ", "translation_ja": "", "vocab": [{"word": "seismic", "definition": "地震的な変化を意味し、政治や社会における大きな衝撃や劇的な変動を表す。通常、非常に重要で広範な影響をもたらす事象に使用される。"}, {"word": "remigration", "definition": "移民が元の国に戻ることを意味する造語。ここでは大量の移民を国外に追放する計画を指すが、当事者は犯罪者と不法滞在者のみの強制送還と主張している。"}, {"word": "outright majority", "definition": "議会や投票において、他のすべての候補者または政党を合わせた票数より多い票を獲得すること。単独で決定権を持つに十分な支配力を意味する。"}, {"word": "deadlock", "definition": "交渉や決定が進まない膠着状態のこと。政治的には、どの党も単独で権力を掌握できず、連立が成立しない状況を指す。"}, {"word": "tacit support", "definition": "明示されない、または公式には表明されない支持のこと。暗黙の了解による協力や支援を意味する。"}, {"word": "watershed", "definition": "歴史的な転換点または分水嶺。重要な変化や事象が起こり、その後の状況が大きく異なることになる時点を指す。"}]}, {"title_ja": "移民反対デモの混乱を大臣が非難、ポーツマスで警察官が負傷", "title_en": "Minister condemns disorder at Portsmouth anti-migrant protest after police officers hurt", "summary_ja": "警察大臣サラ・ジョーンズ氏は、単一のボートで到着した120人の移民に対する抗議デモの最中に起きたポーツマスの暴力的な混乱を非難した。約200人のマスク姿の抗議者が防暴装備の警察と対峙し、イーストニー・ランディング埋立港で交通を妨害した。大臣は違法行為に手を染める者は法の厳罰に直面することになると警告した。", "summary_en": "Policing Minister Sarah Jones condemned violent disorder at an anti-migrant protest in Portsmouth on Sunday, where police officers were injured and vehicles damaged during demonstrations against the arrival of 120 migrants. Around 200 masked protesters confronted police at Eastney Landing ferry port, blocking traffic and targeting coaches carrying migrants. The minister warned that those crossing into illegality would face the full force of the law.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cqxv2335je1o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Minister condemns disorder at Portsmouth anti-migrant protest after police officers hurt\n- Published\nPolice are seeking to identify protesters after several officers were injured and vehicles damaged in Portsmouth at a demonstration sparked by the arrival of 120 migrants in a single dinghy.\nPolicing Minister Sarah Jones told the House of Commons the disorder on Sunday night was \"intimidating and thuggish\" and warned \"those who cross into illegality\" would \"face the full force of the law\".\nThe protests followed a large group of masked men holding a demonstration over small-boat crossings at the Port of Dover on Saturday, causing major disruption.\nPortsmouth City Council said the Home Office had \"serious questions to answer\" over the decision to bring the migrants, who had crossed the English Channel from France, to shore in the area.\n- What we know about anti-migrant protests and organiser Danny Thomas \n  - Published5 hours ago\n- Watch: Anti-migrant protesters block roads in Portsmouth \n  - Published17 hours ago\nCouncil leader Steve Pitt said the decision had caused \"needless disruption\".\nAround 200 people, some wearing masks, confronted police in riot gear after they descended on the Eastney Landing ferry port area, where the migrants were landed.\nPolice protected a number of coaches parked on a road leading away from Eastney Marina as protesters blocked traffic. A dispersal order was put in place, meaning anyone failing to comply with police could be arrested.\nIn a statement, Hampshire and Isle of Wight Constabulary said a handful of officers were treated at the scene for injuries, none of which were serious.\nIt said: \"Violence and criminal damage have no part in peaceful protest.\n\"No arrests have been made at this time, however an investigation to identify offenders responsible for any assaults to officers, criminal damage to vehicles or other criminal offences has been launched.\"\nSpencer Wragg, chair of Hampshire Police Federation, said: \"I've seen footage of officers being pushed off their motorbikes, I've seen pictures of police vehicles damaged. It appears that the police last night became the target for some of the protest.\"\nDaniel Thomas, known as Danny Tommo - an associate of far-right activist Tommy Robinson - was livestreaming from the scene - where he called for his supporters to \"get down to Eastney\" and stop the migrants being transported.\nThe coaches carrying the migrants were able to leave in the early hours of Monday and the Border Force confirmed \"individuals from the boat have been transported outside of Hampshire for processing\".\nFootage shared online appeared to show protesters following the convoy of coaches along a motorway after it had left.\nProtesters said they were trying to stop authorities transporting the migrants to the Manston processing centre in Kent.\nIn a statement to the House of Commons on Monday, the policing minister said: \"Peaceful protest is a fundamental part of our democracy and it must be defended But so too is the right of other citizens to go about their lives without undue interference – and there can be no excuse for threatening behavior or serious disruption.\"\nSarah Jones added: \"Let me therefore make clear to the House and to the country that disorder of any kind will never be tolerated and those who cross the line from peaceful protest into illegality will face the full force of the law.\"\nResponding, shadow home secretary Chris Philp condemned the violence in Portsmouth but added: \"This should also be a wake-up call for the government because it's not just those protesters in Dover and Portsmouth who feel so angry about large-scale illegal immigration.\n\"It is millions and millions of people up and down this country who feel angry as well.\"\nReform UK leader Nigel Farage said the country is on the edge of \"serious civil disturbance\" and called on protests to remain peaceful.\nIn a video posted to social media, he said: \"Peaceful protest: good. Uniforms and masks: bad. Voting is the only way we get a solution.\"\nConservative MP Dame Caroline Dinenage, who represents Gosport near Portsmouth, accused the Home Office of failing to provide local officials with details of Sunday's protest.\n\"As a result we weren't in a position to calm fear and tension,\" she said.\nThe Labour MP for Portsmouth North, Amanda Martin, said the \"emergence\" of the route across the Channel taken in Sunday's crossing was \"deeply worrying for my city\".\nSome 625 migrants on eight boats were brought to shore at Dover and Portsmouth on Sunday, according to Home Office figures.\nA total of 16,513 people arrived in the UK in small boats in the year to 1 September - which is 43% lower than the same period the previous year.\nUK net migration has meanwhile dropped to its lowest level outside of the Covid pandemic since 2012.\nThis weekend's disruption comes just days after Prime Minister Andy Burnham and French President Emmanuel Macron met to discuss how to \"scale up\" efforts to reduce small boat crossi", "translation_ja": "", "vocab": [{"word": "disorder", "definition": "社会や集団における秩序の乱れや混乱。特に公共の場での暴力的な混乱や不秩序を指す。"}, {"word": "intimidating", "definition": "人を怖がらせたり、脅したりする様子。相手に恐怖心や圧力を与える行為や態度を表す。"}, {"word": "thuggish", "definition": "粗暴で暴力的な行動を示す様子。粗野で威圧的な態度や振る舞いを示す形容詞。"}, {"word": "dispersal order", "definition": "警察が群衆を散開させるために発令する命令。この命令に従わない場合、逮捕される可能性がある。"}, {"word": "criminal damage", "definition": "他人の財産を意図的に破壊すること。法的には犯罪行為に該当する。"}, {"word": "facilitate", "definition": "何かが起こりやすくする、または実現させるのを助けること。プロセスをスムーズに進める。"}]}, {"title_ja": "英国政府、法的助言を受け主要な地方議会再編成計画を一時停止", "title_en": "UK Government Halts Major Council Reorganisation Plans Pending Legal Review", "summary_ja": "英国政府は新たな法的助言を受けて、複数地域における小規模議会を大規模当局に統合する計画を一時停止しました。エセックス州、ハンプシャー州、ノーフォーク州、サフォーク州に影響を与える提案は全面的に撤回され、他の14地域の再編成計画も見直しの対象となっています。地方政府担当相のアンジェラ・レイナー氏は、堅牢な法的遵守と新首相の優先事項との整合性を確保する必要があると述べました。", "summary_en": "The UK government has paused plans to merge smaller councils into larger authorities across multiple regions following new legal advice. Proposals affecting Essex, Hampshire, Norfolk, and Suffolk have been withdrawn entirely, while reorganisation plans for 14 other areas are under review. Local Government Secretary Angela Rayner cited the need to ensure robust legal compliance and alignment with the new prime minister's priorities.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cx2zkj09dy4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Plans for major overhaul of councils halted\n- Published\nPlans for a major shake-up of local government are on hold, after the government launched a review in light of new legal advice.\nProposals to merge smaller councils to form larger authorities in Essex, Hampshire, Norfolk and Suffolk have been withdrawn.\nMeanwhile, plans for 14 other areas will also be reviewed and paused.\nReorganisation in Surrey, where councillors for two new unitary authorities were elected in May, will not be affected by the review.\nThe government confirmed local elections in May 2027 would go ahead on existing council boundaries.\nConfirming the review in Parliament, Local Government Secretary Angela Rayner told MPs that \"in light of legal advice, I want to satisfy myself firstly that the right process is in place, that it is robust, and of course complies with the law\".\nShe added: \"And secondly, I want to fully test whether our proposals for local government reorganisation meet the priorities of a new administration and a new prime minister and any additional considerations.\"\nRayner acknowledged the announcement was \"disappointing\" but insisted the government was \"determined more than ever to devolve power closer to the people we represent\" - a key priority of new PM Andy Burnham.\nThe plans originated under Sir Keir Starmer's government, when Rayner was also local government secretary, before she was replaced by Steve Reed.\nThe government was already facing legal challenges over proposals to reorganise councils in Essex, Hampshire, Norfolk and Suffolk.\nIn June, Reform-led councils in Essex, Norfolk and Suffolk launched judicial reviews against the plans, while the Conservative-led administration in Hampshire did the same.\nReform UK leader Nigel Farage said: \"Reform UK not only argued that this government's plans for local government reorganisation were an unmitigated disaster, but we once again put our money where our mouth is.\"\nHe added: \"Thanks to our judicial reviews in affected Reform-led councils, the government has backed down on their plans yet again.\"\nConservative shadow local government minister David Simmonds said it was a \"humiliation\" for the government.\nHe said: \"Ministers are only backing off because they have been found out in the face of relentless Conservative opposition to their gerrymandering.\"\nLiberal Democrat local government spokeswoman Zöe Franklin said: \"This is an embarrassing and chaotic climbdown, which has resulted in already cash-strapped councils wasting huge sums on plans the government told them were legally watertight.\"\nSean Matthews, from the County Councils Network, welcomed the move, adding: \"Many of our members will be relieved that the decisions they viewed as damaging to local services and financially unsustainable have been withdrawn or are being reviewed.\"\nA spokesperson for the Local Government Association, which represents councils, said that while local authorities hold different views on the reorganisation plans \"there is no excuse for the government's mishandling of this process\".\nThe spokesperson added that Rayner's announcement \"will have caused significant uncertainty, after councils have invested scarce public money and countless hours\" in the reorganisation programme.\nLocal government in England is currently covered by a complicated patchwork of arrangements.\nIn some places, responsibility for local services is shared between county councils, which manage areas including social care and education; and district councils, which cover smaller areas and are responsible for services such as bin collections.\nSome areas, particularly larger towns and some cities, have \"unitary\" authorities responsible for both - while the regions surrounding big cities are increasingly covered by regional mayors and multi-council \"combined\" authorities, with greater powers in areas such as transport policy, planning and housing.\nIn late 2024, as local government secretary, Rayner announced plans to move towards unitary councils across all of England, with council boundaries redrawn and smaller district councils abolished.\nThe government argued the proposals would make the system simpler and produce savings by making the delivery of services more efficient, while also handing new powers from Westminster to regions across the country.\nHowever, critics said the plans would not save money, while diverting resources from front-line services and leaving councils more remote from their communities.\nUnder Sir Keir, the government had been pushing ahead with the proposals.\nIn July – just days before Burnham became prime minister – Rayner's successor as secretary of state, Reed, had announced plans for new councils in 14 areas.\nThe 14 areas where local government reorganisation is being paused while a review is carried out are:\n- Derby and Derbyshire\n- Devon, Plymouth and Torbay\n- East Sussex and Brighton\n- Gloucestershire\n- Hertfordshire\n- Kent and Medway\n- Lancashire, Blackburn with Darwen and Blackpool\n- Leicest", "translation_ja": "", "vocab": [{"word": "overhaul", "definition": "抜本的な改革や改善を意味します。システムやプロセスを根本から見直し、大幅に変更することを指します。"}, {"word": "judicial review", "definition": "裁判所が政府の決定や行動が法律に合致しているか検査するプロセスです。行政行為の合法性を争う法的手段として使用されます。"}, {"word": "unitary authority", "definition": "地域内のすべての地方行政サービスを一つの議会が担当する行政体制です。従来の県議会と地区議会の二層制ではなく、単一の統治機構で機能します。"}, {"word": "gerrymandering", "definition": "政治的利益のために選挙区の境界を恣意的に引き直す行為です。特定の政党や候補者に有利になるように区域分けを操作することを意味します。"}, {"word": "reorganisation", "definition": "組織やシステムの構造を改め、再び構成し直すことです。政治や経営の文脈では、より効率的な体制に変更することを指します。"}, {"word": "patchwork", "definition": "異なる部分や要素が不規則に組み合わさった状態を描写します。一貫性に欠ける複雑で統一されていない配置を意味します。"}]}, {"title_ja": "ジャガー・ランドローバーが今後2年間で4,000人の人員削減を実施へ", "title_en": "Jaguar Land Rover to Cut 4,000 Jobs Over Next Two Years", "summary_ja": "ジャガー・ランドローバーは、中国との競争、米国の関税、電動車への転換に対応するため、今後2年間で4,000人の職を削減すると発表しました。主に英国の本社に影響を及ぼし、17億ポンドの経費削減を目指しています。昨年のサイバー攻撃による生産停止と売上の大幅な低下が、この決定の背景にあります。", "summary_en": "Jaguar Land Rover announced plans to eliminate 4,000 positions over the next two years, primarily affecting its UK headquarters, as the company battles Chinese competition, US tariffs, and the shift to electric vehicles. The redundancies aim to save £1.7bn and will initially be offered through voluntary packages, with compulsory layoffs possible if needed. The cuts come after a cyberattack last year disrupted production and contributed to a significant sales decline.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c36lx560jjko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Jaguar Land Rover to cut 4,000 jobs over next two years\n- Published\nJaguar Land Rover (JLR) is to cut 4,000 jobs as the carmaker struggles with Chinese competition, US tariffs, and the transition to electric vehicles.\nThe cuts will happen over the next two years and will mostly affect the head office, which is based in the UK.\nJLR's long-term issues were made worse after a cyber-attack last year caused the firm, which employs 43,000 people globally, to shut down production for more than a month.\nChief executive PB Balaji said the firm was \"committed to supporting everyone with care, fairness and respect\" through the redundancy process.\n\"The automotive industry faces significant challenges, with technological change amidst intense competition and ongoing geo-political uncertainty,\" he added.\nJLR is hoping to achieve the cuts through voluntary redundancy, with a window open until 4 October, but said it would make compulsory redundancies with less generous terms if necessary. Affected staff will receive an email in the coming days.\nThe redundancies are being made in an attempt to save £1.7bn over the next two years.\nJLR is \"as strategically important as it gets for the UK economy\", according to David Bailey, business and economics professor at Birmingham University.\nHe said many UK jobs were dependent on its supply chain and the economy as a whole took a hit when the firm closed down production because of last year's cyberattack.\n\"It's the centre of our automotive industry,\" he added.\nYet, the car maker has been losing sales to rivals from China, a country which JLR initially saw as a market for growth rather than a source of competition.\nIn addition, US President Donald Trump's tariffs have hurt the company, which unlike many of its rivals does not have a factory in the US.\nIn its results for the year to the end of March, JLR said US tariffs and the cyberattack were the main reasons why its sales had slumped by a fifth to £22.9bn from £29bn in the previous two years.\nIan Robertson, former director at BMW, told the BBC's Today programme that JLR should have copied its rivals and started manufacturing in the US.\n\"The biggest operation for BMW in the world is in Spartanburg, South Carolina. Mercedes have their plant further south in Tuscaloosa. JLR didn't take that decision early enough in my view,\" he said.\nHe also said JLR had been \"somewhat late to the party\" in terms of electric vehicles.\nJaguar launched the I-PACE, a fully-electric SUV, in 2018. But the electric Range Rover announced last week will be its first electric vehicle launch since then.\nRobertson added that Brexit had hurt the firm, despite its factory in Slovakia giving it \"some flexibility\".\n- Why Jaguar Land Rover is seeking an overhaul \n  - Published7 hours ago\n- The true cost of cyber attacks - and the business weak spots that allow them to happen \n  - Published6 October 2025\n- Jaguar Land Rover posts heavy loss after cyber-attack \n  - Published14 November 2025\nThe prime minister's official spokesman said: \"We understand that this will be an uncertain and concerning time for affected workers, their families and the wider communities.\"\nThe spokesman added that Business Secretary Jonathan Reynolds \"is in close contact with JLR and he will be meeting them early this week\", but ruled out \"any form of bailout\".\nBusiness and trade committee chair Liam Byrne called the cuts a \"body blow for workers, families and communities across the West Midlands\".\n\"Whether or not these redundancies are voluntary, we now need urgent assurances that maximum support will be deployed to help everyone affected find new work,\" he added.\nUnite general secretary Sharon Graham said the union would be seeking urgent clarification over the cutbacks, and demanded called for JLR and the government to explore all options to mitigate job losses.\n\"Unite will be demanding all necessary levers are pulled to support JLR workers,\" she said.\n\"It cannot be acceptable that workers again are made to pay the price for failings not of their making.\"\nSome have blamed the issues facing JLR and the wider UK car industry on the zero emission vehicle (ZEV) mandate, which was introduced by the previous Conservative government and kept under Labour.\nIt requires that all new car and van sales in the UK must be zero emission vehicles by 2035, but it does not apply to cars sold overseas, which is where JLR makes most of its revenue.\nShadow transport secretary Richard Holden said the ZEV mandate and higher energy costs were \"crippling the British automotive industry\", pledging to scrap the mandate.\nThe UK Sustainable Investment and Finance Association has defended the ZEV mandate, previously calling it \"crucial for attracting finance into this infrastructure as it sets out a clear, predictable pathway for the growth of the electric vehicle market\".", "translation_ja": "", "vocab": [{"word": "redundancy", "definition": "雇用契約の終了、特に会社の経営難や組織再編による解雇を意味します。イギリス英語で一般的に使用される用語です。"}, {"word": "cyber-attack", "definition": "コンピュータシステムやネットワークへの悪意のある攻撃を指します。データ盗難やシステム停止などの被害をもたらします。"}, {"word": "tariff", "definition": "輸入品や輸出品に対して課される税金のことです。貿易政策の一部として、国内産業を保護するために使用されます。"}, {"word": "mitigate", "definition": "問題や悪い状況の程度を軽減または減らすことを意味します。ビジネス文脈では、リスクや被害を最小化する際に使われます。"}, {"word": "mandate", "definition": "政府や公的機関が法的に要求する指示または命令のことです。ここではゼロエミッション車の販売を義務づける政策を指します。"}, {"word": "geopolitical", "definition": "地理的位置と政治的、経済的な力関係が相互に作用する状況を示します。国家間の国際関係や紛争に関連して使用されます。"}]}, {"title_ja": "女性労働者の排除に抗議 エッフェル塔が従業員ストライキで閉鎖", "title_en": "Eiffel Tower Closes After Staff Strike Over Female Worker Exclusion", "summary_ja": "パリのエッフェル塔は、ヒンドゥー教系宗教団体の訪問中に女性職員を排除したことに抗議する従業員のストライキにより月曜日に閉鎖された。運営会社SETEは女性を除外する決定は誤りだったことを認め、パリ市長は事態を受け入れがたいと述べ、市のジェンダー平等への誓約を改めて表明した。", "summary_en": "The Eiffel Tower in Paris was closed on Monday after employees struck to protest the removal of female staff during a visit by a Hindu religious group. The tour operator SETE acknowledged the decision to exclude women was a mistake, with Paris Mayor Emmanuel Gregoire calling the incident unacceptable and reaffirming the city's commitment to gender equality.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/eiffel-tower-employees-strike-after-female-staff-removed/a-79152603?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Eiffel Tower employees strike after female staff removed\nSeptember 8, 2026\nThe Eiffel Tower in Paris, France, was closed on Monday after staff went on strike to protest the exclusion of female workers during a visit by a Hindu religious group.\nVisitors to the tower on Monday saw a message that says its opening is \"delayed for operational reasons.\"\nThe staff released a statement in which they condemned \"professional instructions that led to female employees being sidelined, replaced and made invisible because of their sex\" during the religious group's visit.\nAround 100 men from the Bochasanwasi Akshar Purushottam Swaminarayan Sanstha (BAPS) spiritual movement were visiting the landmark.\nThe company that operates the Tower, SETE, said that the group had requested a visit as part of which the \"interactions with women\" would be limited.\nEmmanuel Gregoire, Paris' Socialist mayor, called the incident \"unacceptable.\"\n\"Equality between women and men will never end at the foot of our historic monuments, nor anywhere else in this city,\" Gregoire said.\nEiffel Tower operator regrets incident\nSETE accepted that the decision was a mistake.\n\"These conditions should not have been accepted,\" SETE said.\nCompany head Ariel Weil told the AFP news agency that SETE will \"draw the necessary conclusions\" from the case. Weil himself is an elected official in Paris.\n\"No motive of a religious order could justify a distinction based on gender or any other discriminatory consideration in welcoming the public,\" Weil wrote on his X account.\nThe Eiffel Tower sees some seven million visitors a year. It was closed all day due to the strike, but will open again on Tuesday, a staff representative said.\nEdited by: Zac Crellin\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "sidelined", "definition": "重要な役割や活動から除外されること。ビジネスや社会的文脈で、誰かの貢献が無視されたり、周辺化されたりすることを意味する。"}, {"word": "discriminatory", "definition": "特定のグループに対して不公正な扱いをする、または差別的な性質を持つこと。法律やビジネス用語として、違法な区別を示す。"}, {"word": "landmark", "definition": "歴史的または文化的に重要な建造物や場所。観光地や都市のシンボルとして認識される場所を指す。"}, {"word": "operational", "definition": "実際の運営や機能に関連する。企業や組織が日々の活動を行う際に使用される用語。"}, {"word": "verification", "definition": "情報や事実が正確かつ真実であることを確認するプロセス。ジャーナリズムやビジネスで信憑性を確保するために重要。"}, {"word": "spiritual", "definition": "宗教的または精神的な性質を持つこと。物質的ではなく、信仰や内的な価値に関連する。"}]}, {"title_ja": "モロッコ地震から3年、多くの被害者が支援を待ち続ける", "title_en": "Three Years After Morocco Earthquake, Many Victims Still Await Reconstruction Aid", "summary_ja": "2023年9月のアル・ハウズ地震から3年経つモロッコでは、被災地域の復興の進捗が地域によってばらばらである。モハメド・アイト・ベレイドのように国家支援で成功裏に家を再建した住民がいる一方で、ラルビ・アイト・ジェルレらを含む数千の家族が、官僚的問題と住民登録書類の問題のために支援から除外されたままである。政府は復興に72億ディルハムを配分したが、アル・ハウズ地震被害者全国調整委員会は3,000以上の家族が支援を受けていないと報告している。", "summary_en": "Three years after the September 2023 Al Haouz earthquake in Morocco killed over 2,900 people, reconstruction progress remains uneven across affected villages. While some residents like Mohamed Ait Belaid have successfully rebuilt with state support, thousands of families including Larbi Ait Jelloulat remain excluded due to bureaucratic issues and residency documentation problems. The government has allocated 7.2 billion dirhams for reconstruction, but the National Coordination for Al Haouz Earthquake Victims reports over 3,000 families have received no assistance.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/3-years-on-morocco-earthquake-victims-still-wait-for-help/a-78874844?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "3 years on, Morocco earthquake victims still wait for help\nSeptember 7, 2026\nOn September 8, 2023, a devastating earthquake struck the Al Haouz region in Morocco, killing over 2,900 people, injuring more than 5,500 and causing widespread destruction.\nIn the village of Ighermane in the High Atlas Mountains, about 50 kilometers (30 miles) southwest of Marrakech, Mohamed Ait Belaid, 72, feels like things are actually going pretty well for him three years later.\nHe had been living in a tent after the earthquake but now resides in a newly built house, even though it's smaller than the one destroyed in the earthquake.\n\"I benefited from partial [state] support and received 80,000 dirhams [around €7,300] for rebuilding,\" he told DW. \"I added about 100,000 [€9,110] dirhams from my own pocket. And thanks to God, I like my new house and I'm comfortable in it. I'm at peace because my wife, my children and I are all healthy and I haven't lost any of them.\"\nAround 40 kilometers away, in the town of Azgour, it's a different story. Larbi Ait Jelloulat, also 72, is sitting in front of a pile of rubble that was once his house.\n\"I want to know where my rights have gone,\" he said angrily. \"Who took what's rightfully mine? For three years, I've been going from one department to another, from one complaint to another, from one petition to another, just looking for an answer. Why have I been excluded? Am I not a Moroccan citizen?\"\nAit Jelloulat was formerly a council employee and saved for years in order to build the large home that was destroyed in the 2023 earthquake. As far as he can tell, bureaucratic issues mean he must prove he was a resident in the area.\n\"My only dream was to spend the rest of my life in my own home, a rest after years of service,\" he explained. \"Now they say I'm not a resident … Where's the logic in that?\"\nWhy such different experiences?\nReconstruction seems to be happening faster in Ighermane, the village where Ait Belaid lives. About 90% of the village is rebuilt and most residents' lives are back to normal, said Omar Saeed from the Ighermane Association for Development and Solidarity.\nOf the village's around 150 families, 114 received state support of some kind, although most also had to contribute some of their own money to rebuild.\nMeanwhile, in Azgour, where Ait Jelloulat lives, there's been more to do. Azgour was the village most impacted by the earthquake in the area.\nThere, about 76 families have had help with reconstruction, Ait Jelloulat said, while 56 others are still waiting for help. \"What's more, the 76 families who rebuilt their homes in a different location are also having problems connecting to water and electricity,\" he added.\nRebuilding difficult in remote mountain villages\nAccording to a March statement from the High Atlas Development Agency, or ADHA, which was established in October 2023 to bring help to affected areas, 54,425 homes have been built or rehabilitated and more than 3,000 homes are still under construction. The government has given out more than 7.2 billion dirhams (€656 million/$770 million) to affected families. The sum includes funds to help rebuild as well as monthly emergency aid payments.\nIn terms of the pace of construction, Marrakech-based architect Mohamed Belmejjad believes the state is actually doing fairly well. \"I believe the progress so far, relative to the timeframe, to be positive,\" he told DW.\nGiven the circumstances, it would be hard for things to have gone much faster, he suggested.\nImmediately after the earthquake, it was difficult to reach affected locations, especially remote mountain villages and towns. Then rubble had to be cleared before building could begin.\nAfter that, other factors complicated reconstruction, including the distance of some villages from paved roads, the difficulty of transporting building materials in and debris out, problems with connecting water and power, and the need to relocate whole villages and construction sites to avoid dangers like landslides. There's also a need to respect local building traditions, ensuring that construction materials are solid and will last.\n\"We also lack the necessary expertise here, whether that's in terms of architects, design offices, contractors or even the labor required for construction,\" Belmejjad pointed out. Given all that has happened reconstruction could actually be considered ahead of schedule, he suggested.\n'No one has remembered us'\nDespite that, the National Coordination for Al Haouz Earthquake Victims reports receiving complaints from more than 3,000 families who haven't had any state help.\nMontasser Itri, a member of the organization, explains that some of these families were excluded because they had moved to other parts of the country to work and their national identity cards then show them as residents of places unaffected by the 2023 earthquake.\n\"The government is trying to make us, the victims of the Al Haouz earthquake, into mere statistics linked to the progress of constru", "translation_ja": "", "vocab": [{"word": "bureaucratic", "definition": "官僚的な、行政手続きに関連する。政府機関の複雑な規則や手続きプロセスを形容する際に使用される。"}, {"word": "rehabilitation", "definition": "復旧、修復。建物や地域を元の状態に戻すための再構築プロセスを指す。"}, {"word": "residency", "definition": "居住、住所登録。特定の場所に住んでいる法的な状態を表す。"}, {"word": "exclusion", "definition": "除外、排除。何かから外される状態を指す。ここでは支援対象から除外されることを意味する。"}, {"word": "relocation", "definition": "移転、再配置。建物や人々を別の場所に移すプロセスを指す。"}, {"word": "devastating", "definition": "壊滅的な、甚大な被害をもたらす。大規模な災害の影響を表現する際に使用される。"}]}, {"title_ja": "ヴェルナー・ヘルツォーク：ドイツ映画の奇才が帰ってきた", "title_en": "Werner Herzog: Germany's wild man of cinema is back", "summary_ja": "84歳の伝説的映画監督ヴェルナー・ヘルツォークが、7年ぶりのドラマ作品『バッキング・ファスタード』でヴェネツィア映画祭に出品しました。本作は同じ夢を見て同期した2人の姉妹が不可能な目標を追求する物語で、人間の極限的な達成を求めるヘルツォークの生涯の芸術哲学を体現しています。", "summary_en": "At 84, legendary filmmaker Werner Herzog returns with his first drama in seven years, \"Bucking Fastard,\" which premiered at Venice. The film tells the story of two sisters who share dreams and pursue an impossible goal, exemplifying Herzog's lifelong artistic philosophy of striving for extraordinary human achievement.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/werner-herzog-germany-s-wild-man-of-cinema-is-back/a-78949324?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Werner Herzog: Germany's wild man of cinema is back\nSeptember 7, 2026\nWhen Werner Herzog needed a title for his memoirs, he reached back to one of his own films: \"Every Man for Himself and God Against All,\" the original German title of his 1974 feature known in English as \"The Enigma of Kaspar Hauser.\" For Herzog, perhaps the last wild man of European cinema, it's less a title than a worldview.\nOver more than 60 years as a provocative, boundary-breaking filmmaker, Herzog has made films on the slopes of active volcanoes, and in the middle of the Sahara. He's filmed in the jungle and north of the Arctic Circle, telling stories of characters who live at the edges of human achievement. Often, in making these films, Herzog has pushed himself, and his collaborators, to the edge as well.\nNow 84, Werner Herzog shows no signs of slowing down. He's back with a new feature film, \"Bucking Fastard,\" his first drama in seven years, which premiered at the Venice Film Festival.\n'Bucking Fastard:' two sisters, totally in sync\nThe film is the story of Jean and Joan Holbrooke, two sisters who speak, think and move in unison. They even share the same dreams and love the same undeserving man.\nHollywood stars and real-life siblings Kate and Rooney Mara play the sisters, their performances synced up to an uncanny degree.\nThe film is loosely inspired by real-life twin sisters Freda and Greta Chaplin, who became a tabloid sensation in England in the 1980s. The film's title is a reference to an inadvertent simultaneous spoonerism the sisters made in court, when describing their former lover.\nIn Herzog's version, the Holbrooke sisters, after being rejected by their true love (played by Orlando Bloom), decamp to the wilds of Ireland and begin digging a tunnel in a cave, convinced they can dig their way to the Orkney Islands — a mythical place where true love is possible.\nReaching out for the extraordinary\nThe Holbrooke sisters are two ecstatic dreamers striving to do the impossible. Typical Herzog protagonists.\nHerzog himself sees the through-line.\n\"With 'Fitzcarraldo,' there is a great dream about opera in the jungle, and for that the protagonist moves a big ship over a mountain,\" he told DW in Venice.\nHerzog was referring to his 1982 epic adventure drama in which he had his crew actually haul a 320-ton steamship over a hill in the Peruvian jungle to tell the story of a man who dreams of building an opera house in the middle of the rainforest.\nSimilarly, added the director, \"Bucking Fastard\" is \"the dream of an ideal country, which doesn't really exist.\"\nIn the world of Werner Herzog, art imitates life, and vice versa.\nWhile filming \"Aguirre, the Wrath of God\" (1972), the story of a mad conquistador in search of El Dorado, Herzog and his crew, including star Klaus Kinski, nearly went mad themselves.\nIn his 1999 documentary on Kinski, \"My Best Fiend,\" Herzog recounts how the actor threatened to leave the film. If he did, the director told him, he would follow him and shoot him dead.\nReal people, real extremes\nHerzog is, if anything, even better known as a documentarian and his real-life protagonists are as extreme as his fictional characters.\nIn \"Grizzly Man\" (2005), he ponders the life of Timothy Treadwell, an animal rights activist who spent years getting up close and personal with bears in the wild, until one of them ate him.\n\"Little Dieter Needs to Fly\" (1997) follows the German-born American Vietnam War pilot Dieter Dengler, who survived a harrowing escape from a Laotian prison camp.\nFor \"La Soufriere\" (1977), Herzog filmed in an abandoned town in Guadeloupe, next to a volcano on the brink of eruption, to talk to the one man who refuses to evacuate.\nFilms as our 'collective dreams'\nHerzog sees little difference between his fiction and non-fiction films. He admits to inventing scenes for his documentaries, and to filming real events for his features.\nFor \"Rescue Dawn\" (2006), a feature adaptation of the Dieter Dengler story, Herzog got star Christian Bale to devour live maggots on camera (the director showed him how, gobbling up some himself) and wrestle with a real live snake for a scene.\n\"Film does not have so much to do with reality as it does with our collective dreams,\" Herzog said.\nHe thinks of himself less as a director than \"as a poet.\"\n'Just go out and do it'\nIn his often haunting tales of man's struggle with nature, Herzog aims to achieve an \"ecstatic truth\" beyond mere reality. His goal, he said, is not to depict the extreme as bizarre or extraordinary. It is to inspire everyone to be extraordinary.\n\"Every grown-up man should move a ship over a mountain. Every grown-up woman should dig a tunnel through a mountain range,\" he told DW. \"[The message] is very simple: Just go out and do it.\"\nRooney Mara agreed: \"Being willing to show up every day and dig a tunnel through a mountain for love — that's not crazy. Everyone else is crazy for not wanting to do that.\"\nA divided response in Venice\n\"Bucking Fastard\" is an odd, and od", "translation_ja": "", "vocab": [{"word": "provocative", "definition": "議論や反応を引き起こすことを意図した、あるいは物議をかもす。ここではヘルツォークが常に従来の映画製作の限界に挑戦してきたことを表現しています。"}, {"word": "ecstatic", "definition": "強い喜びや熱狂的な感情を表す。本文ではヘルツォークの登場人物たちが極端な夢を追求する姿勢を描写するために使用されています。"}, {"word": "conquistador", "definition": "16世紀にスペインがアメリカ大陸を征服した際の征服者。ヘルツォークの映画『アギーレ、神の怒り』では架空の征服者が黄金郷を探す物語が描かれています。"}, {"word": "harrowing", "definition": "極度に苦しい、または心理的に辛い経験を表す。本文では戦争捕虜の過酷な逃亡体験を描写する際に使用されています。"}, {"word": "protagonist", "definition": "物語や映画の主要人物。ヘルツォークの作品では、通常、極限状態で人間の可能性の限界に挑む人物が主人公となります。"}, {"word": "documentarian", "definition": "ドキュメンタリー映画を製作する監督や映画製作者。ヘルツォークはフィクションとノンフィクション映画の両方で高く評価されています。"}]}, {"title_ja": "FBI、9月11日が25年後もアメリカ国内のテロリストを鼓舞し続けていると警告", "title_en": "FBI Warns 9/11 Continues to Inspire Terrorists Inside America 25 Years Later", "summary_ja": "9月11日の攻撃から25年が経った現在、FBI当局は外国のテロ組織がアメリカ国家安全保障に対して依然として重大な脅威をもたらしていると警告している。当局は、アルカイダのイデオロギーがアメリカ国内の個人をラジカライズし続けていることを強調している。この警告は、数十年間の対テロ活動にもかかわらず、過激派グループからの継続的な危険性を浮き彫りにしている。", "summary_en": "Twenty-five years after the September 11 attacks, FBI officials are warning that foreign terrorist organizations remain a significant threat to U.S. national security. Authorities emphasize that al-Qaeda's ideology continues to radicalize individuals within America. The warning underscores persistent dangers from extremist groups despite decades of counterterrorism efforts.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/top-fbi-official-warns-911-inspiring-terrorists-inside/story?id=136258064", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース放送", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、速報ニュースとライブイベントの継続的な放送を提供しています。同プラットフォームは、主要なニュースが発展するにつれてリアルタイムで最新情報を配信します。視聴者はABCニュースの特派員とアンカーによる包括的なニュース報道にアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events throughout the day. The platform delivers real-time updates on major stories as they develop. Viewers can access comprehensive news reporting from ABC News correspondents and anchors.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "TSA、搭乗者以外のセキュリティ通過を認める新プログラムを開始", "title_en": "TSA Launches Program Allowing Non-Travelers Past Security", "summary_ja": "TSAは、搭乗していない人々が空港のセキュリティチェックポイントを通過することを許可する新しいプログラム「Gateside by TSA PreCheck」を導入しました。このサービスは現在、米国内の13の空港で利用可能です。このイニシアチブは、家族や友人が旅行者と一緒に空港ターミナルのさらに奥まで行くことを可能にすることを目的としています。", "summary_en": "The TSA has introduced Gateside by TSA PreCheck, a new program that permits non-passengers to pass through airport security checkpoints. The service is currently available at 13 airports across the United States. This initiative aims to allow family members and friends to accompany travelers further into the airport terminal.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Travel/tsa-launches-program-allowing-travelers-past-security/story?id=136258039", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台風サウデル、中国南東部で大規模避難を引き起こす", "title_en": "Typhoon Saudel Triggers Mass Evacuations Across South-East China", "summary_ja": "台風サウデルは先週、中国南東部に豪雨をもたらし、福建省の莆田市では24時間で416.5mm、周辺村落では500mm以上の雨量を記録した。福建省だけで約60万人が避難を余儀なくされ、洪水や土砂崩れ、インフラ被害が複数地域に広がった。台風により江西省の土砂崩れで3人が死亡し、莆田市では1,260人以上の救出が行われた。", "summary_en": "Typhoon Saudel brought torrential rainfall to south-east China last week, with Putian recording 416.5mm in 24 hours and surrounding villages exceeding 500mm. Nearly 600,000 people were evacuated in Fujian province alone, while flooding, landslips and infrastructure damage affected multiple regions. The typhoon caused casualties including three deaths in a landslip in Jiangxi province and forced the rescue of over 1,260 people.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/07/typhoon-saudel-mass-evacuations-south-east-china-weather-tracker", "state_media": false, "category": "社会", "full_text": "Typhoon Saudel brought days of torrential rain to Zhejiang, Jiangxi, Fujian and Guangdong provinces in south-east China last week. The city of Putian, in Fujian province, recorded 416.5mm of rain in a 24-hour period between Thursday and Friday, with surrounding villages recording more than 500mm in the same period. In Fujian, authorities estimate that almost 600,000 people were evacuated from high-risk, flood-prone areas. A further 128,000 people in 53 counties were also affected across Jiangxi, with emergency evacuations affecting 9,000 people.\nFlooding, landslips and infrastructure damage were reported widely in the region. More than 2,500 teachers and students were trapped in a school compound in the Zhejiang city of Wenzhou on Wednesday after extreme rainfall caused flash floods in low-lying areas. At least 1,260 people reportedly had to be rescued in Putian after a river embankment collapsed on Thursday, flattening 100 homes. On Saturday, a landslip in a village of Suichuan county, in Jiangxi province, killed three people and nine others remaining missing.\nThis is the seventh typhoon to affect China this year, and Saudel arrived shortly after Typhoon Narra dumped heavy rain on Guangdong, Hainan and Guangxi late last month.\nThe South African Weather Service implemented several thunderstorm warnings late last week, covering a large swathe of the northern and western provinces. Disruptive rainfall, damaging winds, excessive lightning and hail were all reported, with rainfall totals expected to have reached at least 75-100mm for parts of the Northern Cape and North West provinces over the weekend. In Johannesburg, eight families were evacuated from an apartment building after strong winds tore off a significant part of its roof.\nOppressive heat in the US affected states across the central-southern plains and the Mississippi valley this weekend, with maximum temperatures easily reaching the high 30s celsius (high 90s fahrenheit). However, with high humidities, the heat indices in this region have been closer to 40-43C (105–110F). The unrelenting temperatures will continue across the midwest and southern US this week, with maximum temperatures continuing to reach the high 30s.", "translation_ja": "", "vocab": [{"word": "torrential", "definition": "非常に激しく大量の、特に雨や水の流れが猛烈であることを表す形容詞。降水量が非常に多い状況を説明するのに用いられます。"}, {"word": "embankment", "definition": "洪水や川の氾濫を防ぐために堤防または土手として構築された盛り土構造。防災インフラの一種です。"}, {"word": "landslip", "definition": "山や斜面から土地や岩石が突然滑り落ちる自然現象。豪雨や地震により発生します。"}, {"word": "evacuated", "definition": "危険な地域から人々を緊急に移動・脱出させること。災害時の重要な対応措置です。"}, {"word": "disruptive", "definition": "通常の秩序や活動を乱す、または中断させるような影響を与える形容詞。気象現象が交通や生活に支障をもたらすことを表します。"}, {"word": "oppressive", "definition": "不快感や圧迫感を与える、特に気候条件が厳しく苦しい状態。高温多湿な環境を形容するのに使われます。"}]}, {"title_ja": "エジプト人気テレビ司会者、麻薬密売事件で死刑判決を受ける", "title_en": "Egyptian TV Presenter Sentenced to Death in Major Drug Trafficking Case", "summary_ja": "エジプトの裁判所は、有名なテレビ司会者サラー・ハリーファと他11名に対し、麻薬製造・密売事件で死刑判決を言い渡した。当局は750kg以上の違法薬物と原料物質を押収し、実験室として使用された2つのアパートメントを発見した。エジプト法で義務付けられているグランドムフティの宗教的意見聴取を経た判決は、控訴の対象となる。", "summary_en": "An Egyptian court sentenced well-known television presenter Sarah Khalifa and 11 others to death for manufacturing and trafficking narcotics in a sprawling drug case. Authorities seized over 750kg of drugs and raw materials, discovering two apartments used as laboratories. The verdict, which required consultation with Egypt's Grand Mufti as per law, is subject to appeal.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/05/egyptian-tv-presenter-among-12-sentenced-to-death-for-drug", "state_media": false, "category": "社会", "full_text": "An Egyptian court sentenced a well-known television presenter and 11 others to death for manufacturing and trafficking narcotics in a sprawling drug case, official media reported on Saturday.\nThe presenter, Sarah Khalifa, 39, is best known for her programme Mission Impossible, which dealt with issues concerning security and crime.\nThe state-linked Al-Ahram newspaper said a Cairo court sentenced “Khalifa and 11 other defendants to death by hanging on charges of forming an organised criminal gang specialising in procuring materials used in manufacturing narcotics, with the intent to traffic them, and possessing and carrying unlicensed firearms and ammunition”.\nThe verdict came after the court consulted the Grand Mufti of Egypt for his religious opinion, a procedure required by Egyptian law in capital cases.\nThe verdict is subject to appeal.\nKhalifa also owns a cosmetic surgery clinic and a production company that specialises in organising parties and events.\nAccording to the state-run Akhbar el-Yom newspaper, the defendants were charged with “manufacturing synthetic drugs with the intent to traffic them, by importing the materials used in manufacturing from abroad”.\nAl-Ahram reported that authorities seized more than 750kg of narcotics and raw materials, and found two apartments used as laboratories as well as unlicensed firearms and ammunition.\nThe court also sentenced Khalifa and others to five years in prison over a separate case involving the kidnapping and assault of a young man.\nEgypt applies the death penalty for premeditated murder, terrorism, some rape offences and drug trafficking.\nAccording to the Egyptian Commission for Rights and Freedoms, 541 death sentences were issued in Egypt in 2025.", "translation_ja": "", "vocab": [{"word": "sprawling", "definition": "広がりのある、複雑で広い範囲にまたがった。この文脈では、多くの容疑者と広範な証拠を含む大規模な事件を指します。"}, {"word": "narcotics", "definition": "麻薬、違法薬物。医療用語としても使用され、痛みを緩和する薬物全般を指すことがあります。"}, {"word": "premeditated", "definition": "計画的な、事前に計画された。犯罪において故意性と計画性があることを示す法律用語です。"}, {"word": "trafficking", "definition": "密売、不法な売買。特に違法物質や人身売買に関する重大な犯罪を指します。"}, {"word": "capital case", "definition": "死刑対象事件、最高刑が適用される事件。法律用語で、被告人に死刑が科される可能性のある事件を意味します。"}, {"word": "Grand Mufti", "definition": "イスラム法の最高権威者。イスラム教の宗教的・法的な問題について最高の権限を持つ指導者です。"}, {"word": "verdict", "definition": "判決、評決。裁判所が下す最終的な法的判断を指します。"}]}, {"title_ja": "国連、アフリカの真の大きさを正確に表す地図へのシフトに投票", "title_en": "UN Votes to Replace Mercator Map with More Accurate Projection of Africa", "summary_ja": "国連総会は164対1の投票で、16世紀のメルカトル図法を2018年の「Equal Earth」図法に置き換えることを正式に承認した。この拘束力のない決議は、教育カリキュラムと技術プラットフォームに影響を与えると予想されている。メルカトル図法は歴史的にアフリカの規模を縮小し、西洋中心的な認識を強化してきた。", "summary_en": "The UN General Assembly voted 164-1 to officially retire the 16th-century Mercator projection in favor of the 2018 Equal Earth design, which more accurately represents Africa's true size. The non-binding resolution is expected to influence education curricula and technology platforms, as the Mercator projection has historically minimized Africa's scale and reinforced Western-centric perceptions.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/sep/04/un-vote-world-map-mercator-equal-earth-africa", "state_media": false, "category": "政治", "full_text": "The United Nations has voted to adopt a resolution for the world to formally phase out the traditional Mercator map of the globe in favour of one that more accurately displays Africa’s size.\nIn a session at its headquarters in New York, the UN general assembly officially retired the 16th-century Mercator projection in favour of one based on the more accurate 2018 Equal Earth design.\nAt the session, 164 countries voted in favour of the resolution. Only the US voted no, with its representative saying the resolution was “superfluous”. There were six abstentions.\nUN resolutions are non-enforceable, so countries and institutions will not be mandated to use only the new projection or forbidden from using the old one. However, the outcome is expected to result in an update of classroom curriculums and everyday technology given the wide usage of the Mercator projection in education, technology and governance.\nTogo, which spearheaded a campaign for the resolution on behalf of the African Union, said the resolution “recognises and affirms that disproportionate cartographic representations, particularly those resulting from the Mercator projection, have had lasting cognitive, educational, cultural, geopolitical and socioeconomic effects, contributing to a drastic reduction in the perceived size of Africa and other regions of the world in the global collective imagination”.\nSpeaking before the resolution passed, Robert Dussey, Togo’s foreign affairs minister, said: “This discussion is not a political discussion [but] a scientific discussion, because there is scientific proof so we all have to accept the reality.”\nThe Mercator layout was introduced by the Flemish cartographer Gerardus Mercator in 1569 to help sailors navigate the seas. Almost five centuries later, it remains the global standard.\nBecause of its projection style, however, regions near the equator appear significantly smaller than they are, whereas high-latitude areas look much larger. For example, the map shows Africa as being similar in size to Greenland, but the continent is 14 times larger than the Danish territory.\n“You could fit the United States, China, India, Japan, Mexico and much of Europe into Africa and still have land to spare,” says a petition on Change.org for the #CorrectTheMap campaign, which has more than 11,000 signatures. The African Union endorsed the campaign in August 2025 and then asked Togo to spearhead its adoption.\nOn Friday, before the vote, France’s foreign minister spoke in support of the resolution. “[We] will abandon the Mercator projection in favour of map representations tailored to specific uses, more faithful to actual surface areas and in line with the recommendations of cartographers and scientists,” Jean-Noël Barrot said during a speech at the Sorbonne University in Paris, in a move seen as part of France’s push to increase goodwill among its former colonies. France will now use the Eckert IV projection, which is close to the Equal Earth projection recommended in the resolution.\nHistorians and geographers have said for years that the Mercator projection is rooted in western stereotypes. Activists have echoed this, with some coining the term “cartographic colonialism”.\nSome argue that the map has subtly shaped international power dynamics by minimising the physical presence of the global south and visually inflating northern hemisphere nations while shrinking equatorial regions. This is said to have reinforced systemic biases in international trade, development priorities and educational frameworks.\nOne of the Mercator projection’s most prominent critics was Arno Peters, a German historian, who launched the Peters world map based on the Gall–Peters projection in 1973. It has often been used as an alternative to the Mercator map.\nTogo’s #CorrectTheMap campaign promoted the use of the 2018 Equal Earth design, which was developed by an international team of cartographers. Supporters say it will help to reverse perceptions of Africa and decolonise global curriculums.\nSome analysts agree. JJ Enoch, a London-based senior associate at JS Held, a geopolitical risk advisory firm, said the Mercator projection visually diminished Africa’s true scale. He linked the campaign to a quest by African nations for “greater influence in global institutions and greater control over how the continent is represented”.\nHe said: “Adopting an equal-area map … would provide a more accurate basis for education and public understanding, while signalling that Africa’s demographic, economic and geopolitical importance should no longer be viewed through inherited and distorted conventions.”\nTogo’s government is planning an event in Lomé, the Togolese capital, with Unesco, the African Union and tech brands such as Google Maps during the first quarter of next year to map out the implementation of the resolution.\nSpeaking before the vote, Dussey said: “To those who say why now, I say: why not? When we look at the world map … it is time for us to change ", "translation_ja": "", "vocab": [{"word": "projection", "definition": "地図上で地球の球面を平面に表現する方法。異なる投影法は異なる地理的特性を強調する。"}, {"word": "disproportionate", "definition": "不均衡または相応しくない比率を示す。この文脈では、メルカトル図法がアフリカの実際の大きさと比べて不適切に小さく表示していることを指す。"}, {"word": "cartographic", "definition": "地図製作や地図表現に関連する。地図学的な問題や表現を説明する際に使用される専門用語。"}, {"word": "spearhead", "definition": "ある活動やキャンペーンの先導役となる。トーゴが決議採択のための運動を主導したことを表す。"}, {"word": "equator", "definition": "地球を北半球と南半球に分ける架空の円。赤道周辺の地域はメルカトル図法で実際より小さく表示される。"}, {"word": "enforceability", "definition": "法律や決議が強制力を持つかどうかの特性。国連決議は拘束力がないため、各国が従う義務がない。"}, {"word": "decolonise", "definition": "植民地主義の影響を除去またはその遺産から脱却する。この文脈では、西洋中心的な世界観からの解放を意味する。"}]}, {"title_ja": "ルビオ国務長官、右派指導者との関係強化でラテンアメリカを訪問", "title_en": "Rubio Visits South America to Strengthen Ties with Right-Wing Leaders", "summary_ja": "米国のマルコ・ルビオ国務長官がコロンビア、エクアドル、ペルーを訪問し、トランプ政権と関係が深い最近選出された右派指導者と会談する予定です。この訪問はラテンアメリカ全域での広範な右への政治的転換と、麻薬カルテルとの戦いにおいてワシントンがより軍事的なアプローチを取ろうとしていることを反映しています。", "summary_en": "US Secretary of State Marco Rubio is traveling to Colombia, Ecuador, and Peru to meet with recently elected right-wing leaders aligned with the Trump administration. The visit reflects a broader rightward political shift across Latin America and Washington's commitment to a more militaristic approach to combating drug cartels in the region.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/7/rubio-heads-to-ecuador-colombia-peru-after-right-wing-victories-in-region?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Rubio heads to Ecuador, Colombia, Peru after right-wing victories in region\nRightward shift in Latin America comes as Washington pledges to grow influence, take militaristic approach to cartels.\nUnited States Secretary of State Marco Rubio is travelling to three South American countries whose recently elected leaders have closely aligned with President Donald Trump’s administration.\nRubio will travel to Colombia on Tuesday to meet with newly elected President Abelardo de la Espriella. He will then visit Ecuador to meet with President Daniel Noboa before going to Peru, where he will meet with another newly elected leader, Keiko Fujimori.\nRecommended Stories\nlist of 3 items\n- list 1 of 3What’s behind the US deal to seize control of Venezuelan oil reserves?\n- list 2 of 3Honduran court drops case against ex-President Hernandez after Trump pardon\n- list 3 of 3‘Winds of change’: How Milei is stirring Falklands claim amid Trump-UK spat\nThe State Department has not yet released a more in-depth agenda for the trip, saying only that Rubio will discuss “US support for Colombia’s earthquake response; enhanced cooperation in the shared fight against narcoterrorism, which threatens our hemisphere; and the benefits of deeper commercial relationships between our countries”.\nThe trip comes amid a rightward shift in Latin America that has seen several Trump-aligned leaders take office. Beyond the three countries, Trump also backed Honduran President Nasry Asfura, who won the presidency in November, and Bolivia’s Rodrigo Paz, who won in October.\nBeyond the new leaders, Trump has also closely aligned with Argentina’s Javier Milei, who took office in 2023, and El Salvador’s Nayib Bukele, who became the leader in 2019.\nUS influence over Western Hemisphere\nRubio’s visit comes as the Trump administration has pledged to assert more influence over the Western Hemisphere in what Trump has referred to as the “Donroe Doctrine”, a reference to the 19th-century Monroe Doctrine that opposed European interference in the Americas.\nIt has shifted to a militaristic approach to security in Latin American countries, while broadly reframing efforts to combat drug trafficking as a war against “narco-terrorists”.\nIn August, Colombia’s de la Espriella upped cooperation with the US by joining the Trump administration’s so-called “Shield of the Americas”.\nThe 19 members of the group have jointly pledged a “commitment to using lethal military force to destroy the sinister cartels and terrorist networks”.\nUnlike his predecessor, leftist Gustavo Petro, de la Espriella has also praised US military strikes on alleged drug smugglers in the Caribbean and eastern Pacific. At least 227 people have been killed in those strikes, in what rights groups have condemned as extrajudicial killings.\nFamily members of those killed have charged that the targets were fishermen, not drug smugglers.\nThe US has proven a major supporter for de la Espriella in the wake of a devastating earthquake in Colombia last month in which at least 330 people were killed and thousands left homeless.\nIn March, the US military announced it was collaborating with Ecuador, under Noboa’s leadership, to target drug trafficking groups in the country.\nEcuador’s Interior Minister John Reimberg defended the US strikes on vessels allegedly carrying drugs in an interview with broadcaster Teleamazonas last week.\nPeru’s Fujimori, the daughter of former leader Alberto Fujimori, who notoriously dissolved the country’s Congress and Supreme Court to consolidate power during his government from 1990 to 2000, has also pledged closer ties with the US and a military crackdown on criminal groups.\nConservative shift\nRubio’s visit comes after the US announced a controversial agreement with Venezuela’s interim leader, Delcy Rodriguez. The deal, struck in the wake of the January 3 US abduction of Venezuela’s ex-President Nicolas Maduro, grants US companies access to 65 billion barrels of crude oil reserves over the next 100 years.\nIt also comes as Washington has continued to up its pressure campaign against Cuba, with Foreign Minister Bruno Rodriguez on Monday rejecting any talks with the US despite its ongoing fuel blockade of the island.\nBrazil and Mexico remain the only regional powers with leftist leaders. Rubio has called the region’s conservative lurch an “extraordinary achievement”.\nThe shift has accompanied the strengthening of ties between Israel and several Latin American countries since Trump took office.\nBrazilians will go to the polls in October, when Flavio Bolsonaro, a son of former right-wing leader Jair Bolsonaro, seeks to unseat Luiz Inacio Lula da Silva.\nTrump has remained a staunch ally of the elder Bolsonaro, who has been sentenced to 27 years in prison for leading a conspiracy to hold onto power.\nThe US president has also shown strong support for the younger Bolsonaro, including inviting him to the White House in May.", "translation_ja": "", "vocab": [{"word": "extrajudicial", "definition": "司法制度を通さずに行われることを意味する用語です。特に政府による違法な殺害や拷問などの人権侵害を指します。"}, {"word": "consolidate", "definition": "権力や支配を一つの手に集める、または強化することを意味します。政治的文脈では権力の集中化を表します。"}, {"word": "narco-terrorists", "definition": "麻薬密売活動と恐怖主義活動を組み合わせた犯罪ネットワークを指す造語です。政治的に麻薬カルテルを一層危険視する表現です。"}, {"word": "lurch", "definition": "急激な方向転換や変化を意味します。ここでは政治的立場が左から右へ急速に移動することを表しています。"}, {"word": "hemisphere", "definition": "地球の半分を意味する地理用語です。ここでは西半球（南米・北米地域）を指して使用されています。"}, {"word": "interim", "definition": "一時的な、仮の状態を意味します。正規の指導者ではなく、一時的に権力を握っている指導者を表します。"}]}, {"title_ja": "ハワイ、ハリケーン・ロウェルの接近に備える", "title_en": "Hawaii Braces for Hurricane Lowell as Category 3 Storm Approaches", "summary_ja": "太平洋の強力なカテゴリー3ハリケーン・ロウェルがハワイ北西部の島々に接近しており、竜巻、大規模な洪水、生命を脅かす高波の警告が発令されています。全米ハリケーンセンターは、嵐が北上してカウアイ島とニイハウ島に向かう中で緊急警報を発令し、住民は停電と最大360mmの大雨に備えています。ハリケーンは1メートルまでの沿岸洪水をもたらす可能性があり、ハワイ時間月曜夜に島々に影響を与える予想です。", "summary_en": "Hurricane Lowell, a powerful Category 3 Pacific storm, is approaching Hawaii's northwestern islands with warnings of tornadoes, severe flooding, and life-threatening surf. The National Hurricane Center has issued emergency alerts as the storm moves north toward Kauai and Niihau, with residents preparing for potential power outages and significant rainfall of up to 360mm. The hurricane could produce coastal flooding of up to 1 meter and is expected to impact the islands Monday night local time.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/9/7/hawaii-braces-for-hurricane-lowell?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Hawaii braces for Hurricane Lowell\nThreats of cyclones and deadly surf as the Category 3 storm path approaches Hawaiian islands on Monday night.\nHurricane Lowell, a major Category 3 storm in the Pacific Ocean, has crept closer to the Hawaiian islands with forecasters warning the weather systems could unleash tornadoes on the islands of Kauai and Niihau.\nOn Sunday, the United States National Hurricane Center issued emergency hurricane and tropical storm warnings for the island chain, advising residents and visitors to brace for severe windstorms and possible mudslides as early as Monday night local time. Lowell is predicted to skirt just west of Hawaii’s most northwest main islands, Niihau and Kauai, as well as portions of the vast Papahanaumokuakea Marine National Monument, tracking from south to north.\nMayor Derek Kawakami of Kauai issued an emergency proclamation in anticipation of the hurricane.\nKauai faces potential coastal flooding of up to 1 metre (3 feet) caused by rolling storm surges and unusually high tides.\nThe storm has been gradually pivoting toward the more rural islands in the Aloha state, moving north at 9 km/h (6 mph), according to the hurricane center. Lowell started as a tropical depression that formed over the Pacific Ocean on August 27. It was driven by a combination of warm ocean temperatures and an active El Nino pattern.\nLowell has seesawed between Category 3 and Category 5 intensity as its trajectory mushroomed. It first reached Category 5 intensity at 257 km/h (160 mph) on Wednesday morning local time, becoming the second Category 5 hurricane of the season. Only two other Pacific hurricanes in recorded history have regrouped to a Category 5 after losing strength mid-path: Emilia (1994) and Ioke (2006).\nIoke was the strongest ever recorded in the central Pacific, while the island of Kauai sustained billions in damage during Hurricane Inike, a 1992 Category 4 storm and the largest recorded in Hawaii’s history. Six people were killed.\nForecasters said Lowell could bring rainfall of 150mm to 250mm (6 to 10 inches), with maximum totals of 360mm (14 inches).\nLowell had maximum sustained winds of 195km/h (120 mph) and was pinpointed about 895km (about 555 miles) southwest of the state capital, Honolulu.\nLocal officials have been urging residents and visitors to prepare for a downpour of rain and fierce winds which could cause major flash flooding and hazardous mudslides.\nAccording to the National Weather Service, tornad
