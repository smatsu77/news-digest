g, Berezovska's body was discovered in the woods west of Kyiv with gunshot wounds to the head.\nBut Zhykovych insists he did not send her to kill, and nor did he kill her.\nHe was arrested and accused of her murder together with an active-duty intelligence officer from HUR called Vladyslav Reut.\nReut initially confessed to investigators, and led them to the shallow grave. But days later in court, he changed his testimony to blame Zhykovych.\nFor a long time, Zhykovych himself stayed silent.\nNow, responding to questions from the BBC, he alleges that Reut - who he refers to as \"The Boss\" - had \"proposed the operation\" in Monaco against Vadym Yermolayev.\nHe understood it was an official mission.\n\"As Reut informed me, this operation […] had been authorised and approved by Reut's superiors, who served in the Main Intelligence Directorate of the Ministry of Defence [HUR],\" he says.\nDistancing himself from the explosion itself, he alleges that Reut asked to use Berezovska for the bombing and when Zhykovych refused – he says she was not fully trained – Reut agreed to send her for reconnaissance instead.\nReut then communicated directly with Bereszovska without including him, according to Zhykovych, who alleges that Reut also provided her with the explosives.\nThe BBC asked HUR to comment on the latest claims. The agency has previously said that it is \"committed to a full investigation\" and providing \"comprehensive support\" to law enforcement bodies.\nThe SBU has described Zhykovych in a statement only as a \"former law enforcement officer\".\nYermolayev was attacked in Monaco as he and his family were returning from an evening meal on the seafront. A surveillance video shows Berezovska walking slightly in front of the group, then leaving the device in a bag on their doorstep.\nIt detonates just as they get close, apparently shocking even Berezovska with its force.\nYermolayev later said he believed that serving HUR officers, \"individuals close to the agency's current and former leadership\", were linked to the attack.\nHe called for \"the truth, protection, and justice\".\nBerezovska was quickly identified as the suspected bomber and on 2 July her image, taken from CCTV footage, was circulated by Interpol.\nShe had already fled, first driving through Italy and Germany, then taking a bus from Frankfurt to Ukraine.\nBefore she could be caught and questioned though, she was driven to the woods by Reut and Zhykovych and killed. Each blames the other for her shooting.\nThe shocking case has prompted intense speculation, including over who may have wanted Yermolayev dead and why, and whether this could have been a state-ordered assassination attempt, a rogue operation or some kind of criminal score-settling.\nThe businessman himself, who renounced his Ukrainian passport some years ago and now has Cypriot citizenship, has dismissed multiple theories.\nThey include the idea the attack might be linked to a struggle between organised crime groups involved in highly lucrative scam call-centres in Ukraine.\nEarlier this year, a court in Estonia convicted Yermolayev's son, Artur, of defrauding its citizens out of millions of euros through such \"offisy\", as the scam networks are known in Ukraine.\nVadym Yermolayev told the Ukrainska Pravda newspaper that he \"never had anything to do with anything\" in the case.\nNow Zhykovych has put forward his own theory to us.\nHe alleges that Reut told him the bombing was in retaliation for \"funding the annexation of Crimea\", which he understood to mean Yermolayev was paying taxes to Russia from businesses in Russian-occupied Crimea.\n\"In my view, this constitutes grounds for the operation,\" he communicated from prison.\nYermolayev has repeatedly denied any remaining business interests linked to Russia.\nBut might this story be even murkier?\nAt his most recent custody hearing in Kyiv, surrounded by heavily armed guards, Zhykovych spoke publicly for the first time since his arrest. The BBC were the only media present.\nAt one point Zhykovych said Reut had in fact told him the attack in Monaco was not \"authorised\".\n\"Someone h", "translation_ja": "", "vocab": [{"word": "facilitated", "definition": "仲介する、可能にする。ここでは弁護士が仲介して、獄中からのインタビューが実現したという意味で使われている。"}, {"word": "catastrophic", "definition": "壊滅的な、極めて深刻な。重大な被害や損失を伴う状況を表す。"}, {"word": "alleges", "definition": "主張する、疑惑を述べる。法的な文脈で、証拠なしに何かが事実だと言うことを意味する。"}, {"word": "reconnaissance", "definition": "偵察、下見。軍事用語で、情報を集めるために事前に目標地点を調査することを指す。"}]}, {"title_ja": "Fort Hood attacker's execution by firing squad will be livestreamed, Pentagon says", "title_en": "Fort Hood attacker's execution by firing squad will be livestreamed, Pentagon says", "summary_ja": "\"We'll make sure that people are able to watch it,\" the US Defence Secretary Pete Hegseth said on Thursday.", "summary_en": "\"We'll make sure that people are able to watch it,\" the US Defence Secretary Pete Hegseth said on Thursday.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmy0r96xygx6o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Fort Hood attacker's execution by firing squad will be livestreamed, Pentagon says\n- Published\nThe public will be able to watch the execution of a former US Army major by firing squad, US Defence Secretary Pete Hegseth has said.\nAn official from the Defense Department told the BBC the execution of Nidal Hasan, who fatally shot 13 unarmed US soldiers at Fort Hood in 2009, would be livestreamed.\nThe Pentagon had announced earlier this week that it would execute Hasan in the first military execution in more than 60 years.\n\"We'll make sure that people are able to watch it, that it's public,\" Hegseth said on Thursday. \"Because people need to understand that there's serious consequences for these types of things.\"\nHegseth said in an interview with conservative TV outlet Real America's Voice that Hasan is \"gonna get a firing squad of soldiers. As it should be\".\nAsked if Hasan had made any final requests or reached out to President Donald Trump Hegseth said: \"Don't care. We'll see him on December 3rd.\"\nPentagon spokesperson Sean Parnell had said on Monday that the defence secretary had made the recommendation and Trump approved it.\nThe BBC has contacted the White House for comment on whether Trump supports a livestreamed public execution.\nThe execution is scheduled to take place at Fort Hood in Texas on 3 December, the secretary of the US Army said on Tuesday. It will be the first military execution by firing squad since the end of World War Two.\nHasan, a US Army psychiatrist from Virginia, admitted in court that he was the gunman in the deadliest ever non-combat attack on an American military base.\nThe shooting on 5 November 2009 took place in a crowded medical building where deploying soldiers were awaiting check-ups and vaccines.\nAt court Hasan apologised for \"any mistakes\". He said during his court martial in 2013 that he believed he was protecting Muslims and the Taliban in Afghanistan.\nThere is no modern-era precedent for having a public execution, said John Mills, a lawyer who works with inmates sentenced to death.\n\"It looks to me designed to be a grotesque spectacle,\" he said. \"It's an unprecedented decision in the modern era, and so it is on uncertain legal terrain,\" he added.\nA military execution requires approval from the US president, according to military law. It also requires appellate review, where a higher court inspects the decision, and a final judgment on its legality to move forward.\nThe appellate process for Hasan is not over, Mills said, and he is likely to seek review of his conviction and sentence in federal court, which would likely stay the execution.\nAs such, Mills said that he would be surprised if the execution happened.\n\"Seeking to make it livestreamed, a firing squad execution, is little more than attention-seeking by the Trump administration and is unlikely to occur, much less deliver any semblance of justice,\" he added.\nCertain states require some form of public viewing of executions. Many states require journalists to be present, and the person due to be executed can invite people. Others also allow ordinary citizens to volunteer as witnesses.\nBut \"there hasn't ever been a livestreamed execution,\" says Deborah Denno, a law professor at Fordham University, who has studied US execution methods.\nA livestreamed execution would \"force a level of transparency that we have probably never seen before in this country\", she says.\n\"More than half of the country wants the death penalty - even though that's on the decline - an argument could be made that 'if you want the death penalty, then we are going to show you how it's conducted in this country'. And people would have to realise exactly what's happening in a way that many people ignore.\"\nDenno says there are important considerations for a livestream such as whether it would be age-redistricted and whether it would contravene the policies of the online platform that hosts the viewing.\nIt is unclear where the livestream will be available. Most major social media platforms have rules that prohibit or restrict livestreaming explicit content.\n- I've seen nearly 500 executions - but never one like Christa Pike's \n  - Published6 days ago\nWhile there were more than 2,700 executions across 17 countries last year, only two countries carried them out publicly.\nEleven public executions were known to have been carried out in Iran in 2025, and another six in Afghanistan, according to Amnesty International.\nThe countries with the highest number of executions last year were China, Iran, Saudi Arabia, Yemen and the US, in that order, Amnesty International data shows.\nWhile Trump has never publicly advocated for a public execution, he has long supported the death penalty. In 1989, for example, he took out large ads in The New York Times calling for the execution of the Central Park Five - who had been convicted of rape and assault charges but were later exonerated.\nTrump has previously condemned public executions in Iran, and has cited the Iranian governmen", "translation_ja": "", "vocab": [{"word": "livestreamed", "definition": "ライブ配信される。リアルタイムでインターネットを通じて公開放送されることを意味し、多くの人が同時にオンラインで視聴できる状態を指す。"}, {"word": "precedent", "definition": "前例、先例。過去に起きた類似の事例や判例のことで、法律や慣行の根拠となる重要な参考事例を指す。"}, {"word": "appellate", "definition": "控訴に関する、上訴審の。より高い裁判所による再審査や判決の見直しに関連する法律用語で、下級裁判所の判決の妥当性を検討するプロセスを指す。"}, {"word": "grotesque", "definition": "奇怪な、不気味な。通常の美的感覚から著しく逸脱した醜悪で不自然な外観や状況を表し、強い嫌悪感を伴うことが多い。"}, {"word": "unprecedented", "definition": "前例のない、史上初の。過去に同様の例がなく、非常に珍しいまたは新しい出来事や状況を表す。"}]}, {"title_ja": "Russian strike on buses kills at least 30, say officials, as deadly attacks on Ukraine surge", "title_en": "Russian strike on buses kills at least 30, say officials, as deadly attacks on Ukraine surge", "summary_ja": "Ukraine accused Russia of targeting two crowded vehicles in the front line city of Kramatorsk to kill as many civilians as possible.", "summary_en": "Ukraine accused Russia of targeting two crowded vehicles in the front line city of Kramatorsk to kill as many civilians as possible.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c875pwq134l3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Russian strike on buses kills at least 30, say officials, as deadly attacks on Ukraine surge\n- Published\nAt least 30 people have been killed in a Russian glide bomb attack on two civilian buses in the eastern front line city of Kramatorsk, rescue officials say.\nAuthorities said three people were also killed in the village of Bilenke, part of the Kramatorsk community.\nAnother 18 people were wounded, said Donetsk regional head Vadym Filashkin, accusing Russia of targeting buses carrying passengers to kill as many civilians as possible.\nKramatorsk and neighbouring Slovyansk are part of a so-called fortress belt that Moscow is trying to seize as part of Russian President Vladimir Putin's claim to the entire Ukrainian industrial region of Donbas.\nUkraine's President Volodymyr Zelensky said: \"This strike will not go without our response.\"\nIn a post on Telegram, he said: \"Russia is trying to destroy all life in Donbas, and the world needs to react to this. React harshly - exactly as the Russians deserve for all the deaths they have caused.\"\nImages posted by local prosecutors showed the burning metal shell of the bus along with debris and some of the victims on the road.\nMoscow is yet to comment on the latest attack. It follows a dramatic surge in Russian attacks across Ukraine and a heavy increase in civilian casualties.\nAccording to the UN, Ukraine saw more civilians killed by August this year than were killed in all of 2025.\nIn one single attack that destroyed a five-storey block of flats in Pryluky east of Kyiv early on Wednesday, 22 people were killed, including five children. Three of the children were only one year old.\nUK Foreign Secretary Ed Miliband, who together with Zelensky visited the site of the Russian strike in Pryluky, said the attack showed Putin's \"evil intent and evil strategy\".\nHe announced \"more sanctions on Russia, on the war machine of Putin, on the shadow fleet, on the oil companies, on the crypto, on the financing of the war\" and told Zelensky the UK would stand with Ukraine \"as long as it takes for you to prevail in this conflict\".\nAfter the deadly attack on Kramatorsk, Filashkin appealed to anyone who was still in the eastern front line region to move to safer parts of Ukraine.\nGiven the sharp deterioration of security in the two neighbouring cities, he said all public transport had been ordered to stop. The safety of civilians was paramount, and \"we have no right to risk the lives of passengers and drivers\", he said.\nMoscow has often cited the \"liberation\" and \"protection\" of the predominantly Russian-speaking Donbas as justification for the full-scale invasion of Ukraine launched by Putin in 2022 - a claim rejected by Ukraine and its allies as baseless.\nDonbas is made up of two regions - Luhansk and Donetsk - and with most of Luhansk under Russian control, the Kremlin is also aiming to capture remaining 20% of Donetsk territory still held by Ukraine.\nFor much of the war Kramatorsk acted as a logistics and supply hub for the Ukrainian military, however it has now come under almost daily Russian attack as its military moves closer to the east of the city.\nGlide bombs in particular have been launched at Slovyansk and Kramatorsk. The bombs are fitted with winglets so they glide towards their target rather than simply fall. In late August as many as nine glide bombs were fired at Kramatorsk in one day.\nKramatorsk city council described the strike as a \"horrific crime committed by the Russian army against the civilian population\".\n\"Once again, the Russians have struck a location where there are absolutely no military targets,\" it said.\n- Children killed while they slept as Russian missile kills 22 in block of flats \n  - Published16 hours ago\n- Civilians told to flee Ukraine's fortress cities as Russia bids to control Donbas \n  - Published11 September\nRussia has in recent weeks been launching constant air raids on the capital Kyiv, with sirens ringing virtually non-stop.\nOn Thursday, Kyiv police said four people were killed and two injured in the latest Russian attack on the city.\nThe attacks are forcing schoolchildren out of classes into underground shelters, shuttering businesses, and disrupting public transport.\nMoscow's strikes on Ukraine's key infrastructure, particularly on its energy grid, are causing power outages already and are even affecting the water supply. Local water authorities in the capital warned on Thursday that pressure was dropping across the city's right bank due to power cuts.\nKyiv's metro network - which millions of residents rely on - on Thursday briefly halted all its train traffic due to a voltage drop from \"external power centres\". Trains later started moving again - but at greater intervals, local officials said.\nZelensky offered his condolences to families and loved ones affected by the latest attack and said Ukraine's partners needed to provide \"concrete action through new defence packages for the protection of Ukraine\".\nAhead of the Pryluky attack, the Ukrain", "translation_ja": "", "vocab": [{"word": "glide bomb", "definition": "滑空爆弾のこと。誘導装置を備えた爆弾が目標に向かって滑空しながら落下する兵器で、長距離から投下できるため防御が難しい。"}, {"word": "fortress belt", "definition": "要塞地帯を意味し、軍事的に重要な防御線や堅固に守られた地域を指す。戦略的価値の高い領土を表現する際に使用される。"}, {"word": "surge", "definition": "急激な増加や高まりを意味する動詞・名詞で、攻撃や被害などが短期間に急増する状況を表す。"}, {"word": "paramount", "definition": "最も重要な、最優先されるという意味の形容詞。物事の優先順位が最も高いことを強調する際に使われる。"}, {"word": "deterioration", "definition": "状況や条件が悪化すること。安全保障や社会情勢などが低下・悪化していく過程を指す専門的な表現。"}]}, {"title_ja": "Polanski failed to show leadership over Zionism motion, ex-Green leader says", "title_en": "Polanski failed to show leadership over Zionism motion, ex-Green leader says", "summary_ja": "Caroline Lucas tells the BBC Zack Polanski should have taken part in a vote on a motion declaring Zionism a form of racism.", "summary_en": "Caroline Lucas tells the BBC Zack Polanski should have taken part in a vote on a motion declaring Zionism a form of racism.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cm2d6x11l6pko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Polanski failed to show leadership over Zionism motion, ex-Green leader says\n- Published\nZack Polanski failed to show leadership over a motion passed by Green Party members declaring Zionism a form of racism, the party's former leader Caroline Lucas has told the BBC.\nLucas told Newsnight that the party's current leader, who did not attend the debate on the motion at the Green Party's annual conference in Brighton, \"should have been there and he should have voted\".\nShe described the motion, which defined Zionism as an ideology supporting \"an ethnonationalist Jewish state\", as \"dangerous\" and \"divisive\".\nIn the wake of the vote, Polanski has said he will not accept anyone being excluded from the Green Party \"because of the religious or communal body they are part of\".\nLucas's comments came after polls closed in the Holborn and St Pancras by-election, where Polanski is standing as a candidate.\nPolanski did not vote on the motion after leaving the party's conference early to campaign in the north London constituency.\nThe Green leader has declined media interviews since the motion was passed on Sunday and did not answer questions from a BBC reporter about the motion earlier on Thursday.\nThe motion also backed a \"single democratic Palestinian state in all of historic Palestine\", which includes modern-day Israel.\nUnder Green Party rules, motions supported by members become official party policy, but will not necessarily be included in the party's manifesto at the next general election.\nLucas, who voted against the motion, said: \"I would have hoped [Polanski] would have been a very strong critic of this motion.\"\nShe added that it was \"flawed from top to bottom\".\nAsked if Polanski should stand down, she told Newsnight: \"I think let's just see what happens in the coming days and weeks. Obviously he has been completely taken up with this by-election.\n\"I want him to speak now about what's happened, I want him to show the leadership that was frankly missing on Sunday.\n\"I think the jury is out about whether he will do that - but I very much hope he will.\"\nIn response to Lucas's comments, a Green Party source said: \"There are ups and downs in politics and when people are passionate they disagree in the heat of a campaign.\n\"We do things differently - unlike Labour who use anonymous sources and resort to factionalism.\"\nThe motion has overshadowed the final days of Polanski's by-election campaign, where the Greens have been looking to overturn a substantial Labour majority in the seat vacated by former Prime Minister Sir Keir Starmer.\nIt has sparked days of controversy and exposed divisions between the party's newly enlarged membership base under Polanski and its MPs elected at the last general election.\nFour of the five Green MPs opposed the motion, while the party's co-deputy leaders were split over whether they supported it.\nThe vote also led to the resignation of the Green deputy leader in Wales and condemnation from the European Green Party.\nIn a written statement on Monday, Polanski did not specify whether he supported the motion passed by members but sought to reassure Jewish members that \"no-one will be made unwelcome because of their background, their faith, or where they worship\".\nPolanski, who is Jewish, added that \"antisemitism and criticism of the Israeli state are, and must always be, completely distinct\".\nAhead of the vote, he had backed an amendment to specify that the motion should not be used to discipline Jewish members attending synagogues that consider themselves Zionist, but this was voted down by members.\nHe had also said he wanted to see the reference to a single Palestinian state changed, arguing: \"I don't believe we as a Green Party of England and Wales, or even the British government, should be deciding what the future settlement looks like.\"\nMeanwhile, Prime Minister Andy Burnham has called on Polanski to reverse the motion and ensure it is not Green Party policy.\nIn his first comment on the row, Burnham said it was \"completely wrong\" for the party to support the motion and this showed \"terrible judgement\".\nThe PM said he felt the motion effectively ruled out a two-state solution between Israel and Palestine.\n\"For that reason, it shouldn't be supported in any way, shape or form,\" he told reporters while on a visit to Berlin.\nWhen asked if he would rule out entering into coalition with the Greens, he would not be drawn on \"any business about what might or might not happen in the future\".\nOn Thursday, a Green Party spokesperson said: \"This has been an emotive issue and is complex. It has rightly caused much discussion, and needs to be taken in the context that Israel's behaviour has had.\n\"Israel has been responsible for a genocide, ethnic cleansing and the killing of children, and we've had a political establishment which has not only turned a blind eye but provided support.\"\nThe International Court of Justice (ICJ) is currently hearing a case brought by South Africa that accuses Israeli forces of g", "translation_ja": "", "vocab": [{"word": "ethnonationalist", "definition": "民族主義的な国家主義に基づく。特定の民族グループの利益を優先する政治思想を指す。"}, {"word": "manifesto", "definition": "政党や候補者が選挙時に発表する政策綱領や公約。有権者に対する政治的立場を明示する公式文書。"}, {"word": "factionalism", "definition": "政党や組織内での派閥対立や内部分裂。一つの団体内で利益や意見の異なるグループが対立する状態。"}, {"word": "overshadowed", "definition": "より重要またはネガティブな出来事によって、他の事柄の注目度や重要性を減少させる。陰を落とす。"}, {"word": "constituency", "definition": "選挙区または特定の選挙区の有権者集団。政治家が代表する地域的な単位。"}]}, {"title_ja": "ADHD and autism at risk of over-diagnosis, says government review", "title_en": "ADHD and autism at risk of over-diagnosis, says government review", "summary_ja": "The review, which focuses on younger people, warned there was a risk society was moving from an era of under-diagnosis to over-diagnosis.", "summary_en": "The review, which focuses on younger people, warned there was a risk society was moving from an era of under-diagnosis to over-diagnosis.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crkg7n1ypj24o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "ADHD and autism at risk of over-diagnosis, says government review\n- Published\nThere is a risk of people being over-diagnosed with ADHD and autism, an official review in England has found.\nExperts said a rise in diagnoses over the past 25 years meant cases now appear to be outstripping the expected number in the population for some younger age groups.\nThe review called for tougher regulation of private firms offering assessments for the NHS, saying they had concerns about quality and consistency, and a ban on advertising.\nIt concluded economic uncertainty combined with social media was driving an increase in mental health problems among young people and said there needed to be better support in place for all conditions.\nThe review - led by leading doctors in the field - was ordered 10 months ago by Wes Streeting after the then-health secretary claimed in an interview that young people were over-diagnosed and \"written off\".\nIt looked at people of all ages, but particularly focused on young people and children who have the highest rates of diagnoses.\nIt is likely to feed into government policies on everything from NHS services and benefits to support for young people who are not in education, employment or training.\nThe experts said too often diagnoses of mental health problems and ADHD and autism were ending up as labels that defined people by their \"difficulties rather than their strengths and potential\", harming their prospects at school, in work and in relationships.\nChildren diagnosed with autism and ADHD before the age of 17 are around four times more likely to end up not in education, employment or training between 16 and 24.\nWith better support after diagnosis, they could be helped to live more fulfilling lives, the review said.\nAlongside access to therapies, this should also include support for mental health – significant numbers also struggle with conditions such as depression.\nBut the review found people were also being harmed by long waits for diagnosis for mental health and ADHD and autism.\nLong waits for diagnosis\nThe Watsons are just one family who have experience of this. Ryan and his wife knew there was something different with their son Atlas when he was around 12 to 18 months old and missing development milestones.\nBut it took three years to get an autism assessment. As time passed, his needs became increasingly clear. Now nearly seven, Atlas is non-verbal, still wears nappies and relies on others for all aspects of daily care.\nDespite this, Ryan said there was no fast-track route for children with the most complex needs. \"You basically go on the list and wait however long until you get to the top.\"\nThe wait left the family racing against time to secure support before Atlas started school. Ryan and his wife feared he would be placed in a mainstream school.\n\"We were terrified,\" Ryan says. \"Anyone who has a child like Atlas will have the same panic that they'll start in a mainstream school where it's not safe.\"\nThe strain was immense. \"It was like I had two jobs,\" Ryan says. \"I was going to work and then coming home and dealing with these things.\"\nAtlas was eventually diagnosed only months before starting school.\nTo ensure families like the Watsons get quicker assessment, the review calls for reassessment of those on waiting lists to ensure people with the highest needs are prioritised first and to look at whether some could be removed and offered other kinds of non-medical support.\nThis could include adjustments being made at school or in workplaces and lifestyle support, such as help to improve sleep or address anxiety, it said.\nToo often, access to help requires a diagnosis, with experts highlighting changes in 2014 that required parents to get a diagnosis of autism and ADHD to qualify their children for extra support in schools.\nReview chair Prof Peter Fonagy said it was clear the system was \"under immense strain\" and it was time to get away from diagnosis being a \"very narrow pathway\" to finding support.\n\"Diagnosis remains essential and must be protected - what has to change is that it is no longer the only door through which help can be reached.\"\nSuccessive governments 'have failed autistic people'\nThe review said not every difficulty required a medical response and there was a risk of blurring the lines between diagnosable ADHD and autism and what should be considered the normal human variation in brain function, cognition and behaviour.\nIt said there was a risk society was now moving from an era of under-diagnosis to over-diagnosis or mis-diagnosis, pointing to data showing more than 4% of children aged six to 17 were now diagnosed with autism, well above the 1-2% that studies suggest is the true level.\nBut it said because some of these figures date back nearly a decade it was not possible to be absolutely certain or conclude over-diagnosis was currently occurring at scale.\nMel Merritt, of the National Autistic Society, said the report shows that successive governments \"have failed aut", "translation_ja": "", "vocab": [{"word": "outstripping", "definition": "期待される数を超えて増加すること。予想や予測を上回るペースで進行することを意味し、ビジネスや統計分析の文脈でよく使用される。"}, {"word": "regulation", "definition": "規制や規則のこと。特に政府や公式機関による統制や管理を指す。業界や企業の活動に対する法的な制限や監督を意味する。"}, {"word": "consistency", "definition": "一貫性や首尾一貫していることを指す。複数の事例や行為が同じ基準や品質を保つことを意味し、品質管理の文脈で重要な概念。"}, {"word": "prospects", "definition": "将来の見通しや可能性、チャンスのこと。キャリア、教育、人生における機会や成功の可能性を指す。"}, {"word": "milestones", "definition": "重要な段階や節目のこと。発展や進歩における重要なポイントや到達点を示し、特に子どもの成長段階で使用される。"}]}, {"title_ja": "Warrants used to search Andrew's homes were unlawful, court says", "title_en": "Warrants used to search Andrew's homes were unlawful, court says", "summary_ja": "A criminal investigation into the former prince continues and police have retained material seized from his homes.", "summary_en": "A criminal investigation into the former prince continues and police have retained material seized from his homes.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr1exlvpzylvo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Warrants used to search Andrew's homes were unlawful, court says\n- Published\nThames Valley Police has accepted warrants it used to search Andrew Mountbatten-Windsor's homes at the time of his arrest in February were unlawful, the High Court has been told.\nFollowing Thursday's hearing, items seized in the raid continue to be held by the police, with a further hearing to take place in 2027 to decide whether the material can be used as evidence.\nMeanwhile, the criminal investigation into Mountbatten-Windsor is ongoing.\nThe former prince, who denies any wrongdoing, was arrested by police on 19 February on suspicion of misconduct in public office, after which he launched a legal challenge over the legality of the search warrants.\nThe force said it accepted that the \"initial court's decision to issue warrants under the specific piece of legislation used was incorrect\" before they searched the properties.\nOn Thursday at the High Court, judge Mr Justice Hilliard said Mountbatten-Windsor and the police had agreed that the search warrants had been unlawful.\nHowever, he added: \"The fact that the search warrants were quashed does not bring the investigation to an end or mean that the whole of the investigation is unlawful.\"\nMountbatten-Windsor opposes the police's bid to retain the evidence, the judge said, and another hearing is expected in 2027.\nHis lawyers have used a judicial review to challenge the actions of the force's chief constable and the Central Criminal Court in the build-up to his arrest.\nHis arrest arose after the US Department of Justice published documents which raised suspicions he had forwarded confidential information to the convicted sex offender Jeffrey Epstein when Mountbatten-Windsor was a UK trade envoy in 2010.\nHe has consistently denied any wrongdoing in relation to Epstein.\nThe court heard on Thursday that Thames Valley Police seized documents and electronic devices when they raided Mountbatten-Windsor's homes earlier this year.\nThames Valley Police's position was that they had applied for search warrants under section eight and nine of the Police and Criminal Evidence Act 1984 at a hearing at the Central Criminal Court the day before the search.\nThat court determined that only section eight search warrants were needed and they were granted on that basis - but subsequently, a legal challenge has established that the court should have issued them under the section nine.\nThe judge explained on Thursday why the police could keep hold of the former prince's items that had been seized.\nHe said: \"There would be little point in handing property back if it could then simply be lawfully seized under some other provision.\"\nA Thames Valley Police spokesperson said: \"The agreement that led to the quashing of the warrants relates specifically to a decision made by the court regarding the legal basis for these and is not a judgement on our ongoing investigation.\n\"We ensured the court was presented with all the necessary information and paperwork to inform their decision, following the correct legal processes throughout.\n\"We accept the position that the initial court's decision to issue warrants under the specific piece of legislation used was incorrect and therefore these must be legally quashed.\n\"Legal proceedings are currently ongoing to decide how material seized during the searches will be managed and whether we can lawfully retain it in support of our ongoing investigation.\"\nThe force said its \"investigation into alleged misconduct in public office by a man in his 60s from Norfolk remains ongoing, and we continue to pursue all reasonable lines of enquiry to effectively and fairly progress this investigation\".\nLegal wrangle continues over material seized from former prince\nThe next stage in this legal dispute will be a behind-closed-doors hearing over whether the police can still retain material seized from Mountbatten-Windsor's homes under alternative powers designed for situations like this.\nThe error that has led to Thames Valley Police accepting the search warrants were unlawful relates to the particular power the judge permitted the force to use when its officers raided the properties.\nStrict legal safeguards on searches bar the police from automatically seizing sensitive material without thinking through in advance the need to take it.\nExamples of that material include advice from a suspect's lawyer or material which does not really belong to them, such as copies of confidential work-related papers from an employer.\nIn practice, if the police find such material during a search, they should return it rather than use it in their investigation.\nThe category of search warrant that was granted by the court in this instance did not take into account the possibility of such protected material being seized.\nHowever, the law says police can in fact seize that kind of material - or potentially retain it in the event of an error - providing they pass some extra tests.\nThames Valley Police must now convince", "translation_ja": "", "vocab": [{"word": "unlawful", "definition": "違法な、不法な。法律に違反している状態を指し、特に公的機関や司法手続きが正当な法的根拠を欠いている場合に用いられる。"}, {"word": "judicial review", "definition": "司法審査。政府機関や公的機関の決定や行為が法律に合致しているかを裁判所が審査する法的手続き。"}, {"word": "misconduct", "definition": "非行、不正行為。特に職務上の責任を持つ人物が適切な行動規範に従わない行為を指す。"}, {"word": "quashed", "definition": "破棄する、無効にする。裁判所が判決や令状などの法的決定を取り消して無効にすること。"}, {"word": "confidential", "definition": "機密の、秘密の。外部に知られてはいけない情報や事柄に対して用いられ、特に機微な情報の厳格な取扱いが必要な状況で使われる。"}]}, {"title_ja": "Man injured after New York shooting involving ICE", "title_en": "Man injured after New York shooting involving ICE", "summary_ja": "The shooting happened in the afternoon in the Bronx, with details still emerging. New York City Mayor Zohran Mamdani condemned the incident and urged Donald Trump to end ICE actions in the city.", "summary_en": "The shooting happened in the afternoon in the Bronx, with details still emerging. New York City Mayor Zohran Mamdani condemned the incident and urged Donald Trump to end ICE actions in the city.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/man-injured-after-new-york-shooting-involving-ice/a-79606159?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Man injured after New York shooting involving ICE\nOctober 9, 2026\nA man was shot by an Immigration and Customs Enforcement (ICE) agent during an arrest, New York City metropolitan police said Thursday.\nWhat do we know so far?\nThe shooting occurred at around 4 p.m. local time (2100 GMT) in the Marble Hill neighborhood of the Bronx, which is one of New York's five boroughs.\nDetails are still emerging, but the New York Police Department has denied that its personnel were involved in the shooting.\n\"The individual who was shot is at a nearby hospital and is currently conscious and receiving medical attention,\" the NYPD said in a statement.\nUS President Donald Trump's administration has scaled up ICE raids in major US cities to detain and deport people who are in the US illegally.\nLocal media in New York said ICE was involved in the latest shooting in the Bronx, which has sparked protests.\nMamdani says he is contacting Trump to end ICE actions in NYC\nNew York City Zohran Mamdani condemned the shooting and said he contacted President Trump.\n\"This is an unconscionable and incredible serious situation,\" Mamdani said in a post on X. \"I have called the President; when we speak I will demand that he ends all ICE enforcement actions in our city. I will not stand by while ICE agent terrorize our communities.\nNew York Governor Kathy Hochul earlier said she has been briefed on the incident.\n\"We expect federal authorities to provide a full and transparent accounting of the circumstances surrounding the incident,\" Hochul said in a statement posted on X.\n\"New Yorkers deserve to know exactly what happened and why.\"\nFederal govt says man 'criminal illegal alien' now in hospital receiving treatment\nThe Department of Homeland Security is the parent agency of US Immigration and Customs Enforcement (ICE). In a post on X, DHS said the person who was shot was a \"criminal illegal alien from the Dominican Republic\" with \"associations to the Trinitarios gang.\"\nDHS said an ICE officer \"discharged his weapon\" during the incident and said ICE officers immediately rendered aid after the man was injured. \"The individual is alive and at a local hospital,\" the statement added, while mentioning that the FBI is on the scene.\nICE, CBP fatal shootings raise alarm in second Trump term\nDeadly ICE and Border Patrol shootings have drawn major controversy during Trump's second term, particularly regarding the training and oversight of the agents.\nAn ICE agent killed a 37-year-old US citizen, Renee Good, during their operations in Minnepolis in January, triggering demonstrations there and in several other US cities.\nLater that month, Alex Pretti, another US citizen, was killed by two US Customs and Border Protection officers agents in Minneapolis following an altercation.\nEdited by: Karl Sexton\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "scaled up", "definition": "活動や規模を拡大する、強化する。この場合、ICEが取締り活動を大幅に増加させたという意味で使用されている。"}, {"word": "unconscionable", "definition": "道徳的に許されない、非道な。極めて不当で悪質な行為を強く非難する際に用いられる高度な表現。"}, {"word": "transparent", "definition": "透明性のある、明確な。組織や政府機関が情報をオープンに開示することを指す。"}, {"word": "rendered aid", "definition": "援助を提供する、医療や救助を施す。フォーマルなビジネス・公式文書で用いられる表現。"}, {"word": "controversy", "definition": "議論や論争、物議を醸す状況。社会的に重大な問題や異論がある事件を指す。"}]}, {"title_ja": "US to livestream Fort Hood shooter's execution: Pentagon", "title_en": "US to livestream Fort Hood shooter's execution: Pentagon", "summary_ja": "US Pentagon chief Pete Hegseth had said that Nidal Hasan would be executed by firing squad and that it would be done \"in public.\" Hasan's execution will be the first by the US military since 1961.", "summary_en": "US Pentagon chief Pete Hegseth had said that Nidal Hasan would be executed by firing squad and that it would be done \"in public.\" Hasan's execution will be the first by the US military since 1961.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-to-livestream-fort-hood-shooter-s-execution-pentagon/a-79606395?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US to livestream Fort Hood shooter's execution: Pentagon\nOctober 9, 2026\nThe execution by firing squad of Nidal Hasan, who shot and killed 13 people at Ford Hood in 2009, will be livestreamed, the US military said Thursday.\nThe confirmation came a day after US Pentagon chief Pete Hegseth had said Hasan's execution, which is slated for December 3, would be done in \"public.\"\nPentagon officials added that more details on the execution would follow.\nWhat did Pete Hegseth say about Nidal Hasan's execution?\nIn a video posted on X by official Pentagon accounts, Hegseth had said Wednesday that Hasan would get \"a firing squad of soldiers, as it should be, and we'll make sure that people are able to watch it, that it's public.\"\nHegseth was speaking to right-wing influencer Jack Posobiec on board the USS Abraham Lincoln aircraft carrier, which ended a nearly 10-month deployment on Thursday.\n\"People need to understand that there's serious consequence for these types of things,\" Hegseth said.\nHasan's execution will be the first by the US military since 1961, and will be the first to be done by firing squad since World War II.\nHegseth added: \"I kind of like the mentality we had in World War II, which was win.\"\nWhat do we know about the Fort Hood shooter Nidal Hasan?\nUS Army psychiatrist Hasan killed 13 people and wounded 32 others at Fort Hood, Texas.\nA military court sentenced him to death in 2013.\nDuring his trial, Hasan said he had perpetrated the shooting to protect Taliban members in Afghanistan from US troops.\nThe announcement that Hasan will be executed by firing squad comes amid the fallout of the botched execution of Christa Pike.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "slated", "definition": "予定されている、計画されている。将来のある時点で何かが起こることが決まっていることを示す。"}, {"word": "deployment", "definition": "配置、展開。軍隊や兵力を戦略的な位置に配置すること、または特定の任務のための配置期間。"}, {"word": "perpetrated", "definition": "（悪いことを）行う、実行する。犯罪や悪行を実際に行うことを意味する。"}, {"word": "fallout", "definition": "（悪い）結果、余波、影響。ある事件や決定から生じる否定的な結果や波紋。"}]}, {"title_ja": "Ex-German Chancellor Schröder attends Putin's birthday bash", "title_en": "Ex-German Chancellor Schröder attends Putin's birthday bash", "summary_ja": "Former Chancellor Gerhard Schröder still maintains a friendship with Russian leader Vladimir Putin. Tensions are high between Germany and Russia as the invasion of Ukraine continues.", "summary_en": "Former Chancellor Gerhard Schröder still maintains a friendship with Russian leader Vladimir Putin. Tensions are high between Germany and Russia as the invasion of Ukraine continues.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ex-german-chancellor-schröder-attends-putin-s-birthday-bash/a-79606017?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Ex-German Chancellor Schröder attends Putin's birthday bash\nOctober 9, 2026\nFormer German Chancellor Gerhard Schröder attended Russian President Vladimir Putin's birthday party, the Kremlin said Thursday.\nPutin celebrated his 74th birthday in Moscow on Wednesday. The Kremlin said Putin learned that Schröder was on a business trip in the Russian capital via Russian media reports.\n\"The president invited his old friend to his home,\" the Kremlin said, with the Russian government releasing pictures of Schröder and Putin smiling and clasping hands.\nSchröder was visiting Hyperglobus branch after joining board\nSchröder, who is 82 years old, was in Moscow visiting one of the branches of the new Hyperglobus supermarket chain. The ex-German chancellor was named to the chain's supervisory board last week.\nHyperglobus was originally part of German retail company Globus Holding, which operates the Globus supermarkets in Germany and the Czech Republic.\nGlobus Holding also had supermarkets in Russia, but divested its stake last year, with those stores thus being spun off into seperate company Hyperglobus.\nWhat backlash has Schröder faced in Germany over his Russia ties?\nSchröder, a member of the center-left Social Democratic Party (SPD), served as Germany's chancellor from 1998 to 2005.\nSince leaving the chancellery, Schröder has worked for Russian state-owned energy firms and has also maintained personal contact with Putin.\nSchröder's fondness for Russia has drawn controversy, particularly since the Russian invasion of Ukraine in 2022.\nSchröder's tax-payer financed Berlin office was closed in 2022 over his involvement in the Russian energy sector, and he has also faced calls by fellow party members to be expelled from the SPD.\nSchröder, however, has survived the attempt to be kicked out of his party.\nEdited by: Karl Sexton\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "divested", "definition": "企業や投資家が保有する資産や株式などを売却・処分すること。ここではドイツの小売企業がロシアでの事業部門を売却したことを指す。"}, {"word": "spun off", "definition": "親会社から独立した新しい企業として分離・独立させること。ロシアの店舗が別会社として分離されたプロセスを説明している。"}, {"word": "supervisory board", "definition": "企業の経営を監視・監督する役員会のこと。企業統治の重要な機構であり、経営判断の適切性を監督する責任を持つ。"}, {"word": "backlash", "definition": "批判や反発による強い反動や反論のこと。政策や行動に対する社会的な否定的反応を意味する。"}, {"word": "expulsion", "definition": "組織や団体から除名・除外されることを意味する。政党などのメンバーシップを剥奪される処分を指す。"}]}, {"title_ja": "Hasan execution will be live-streamed, Pentagon official says", "title_en": "Hasan execution will be live-streamed, Pentagon official says", "summary_ja": "Hegseth said he would make sure \"people are able to watch it, that it's public.\"", "summary_en": "Hegseth said he would make sure \"people are able to watch it, that it's public.\"", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/hegseth-hasan-execution-public/story?id=137110734", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Christa Pike seeing 'remarkable physical recovery' but cognitive challenges: Lawyers", "title_en": "Christa Pike seeing 'remarkable physical recovery' but cognitive challenges: Lawyers", "summary_ja": "Christa Pike has made a \"remarkable physical recovery\" since she regained consciousness following her botched execution in Tennessee, her attorney told ABC News", "summary_en": "Christa Pike has made a \"remarkable physical recovery\" since she regained consciousness following her botched execution in Tennessee, her attorney told ABC News", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/christa-pike-remarkable-physical-recovery-cognitive-challenges-remain/story?id=137110736", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Scientists discover 180,000 giant tortoises on one Seychelles island", "title_en": "Scientists discover 180,000 giant tortoises on one Seychelles island", "summary_ja": "Free-roaming Aldabra population far exceeds human population of Seychelles after decades-long recovery programme A survey of the world’s largest free-roaming giant tortoise population has discovered that the once endangered species is thriving. A population of Aldabra giant tortoises lives on an isl", "summary_en": "Free-roaming Aldabra population far exceeds human population of Seychelles after decades-long recovery programme A survey of the world’s largest free-roaming giant tortoise population has discovered that the once endangered species is thriving. A population of Aldabra giant tortoises lives on an isl", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/oct/08/researchers-find-180000-giant-tortoises-living-on-island-in-seychelles", "state_media": false, "category": "社会", "full_text": "A survey of the world’s largest free-roaming giant tortoise population has discovered that the once endangered species is thriving.\nA population of Aldabra giant tortoises lives on an island in Seychelles called Aldabra Atoll.\nThe most recent survey, led by Seychelles Islands Foundation (SIF) and the University of Exeter, revealed there were approximately 180,000 tortoises living on the island. This is the highest figure ever recorded for the species and far exceeds the human population of Seychelles.\nThe new figure was obtained by a team who analysed five years of tortoise counts between 2018 and 2022. It is the first update since a widely cited figure of 100,000 tortoises from the late 1990s.\nAldabra Atoll is one of only two places in the world where giant tortoises are found in the wild, with a much smaller population living in the Galápagos.\nDr Frauke Fleischer-Dogley, the CEO of SIF, said: “More than 180,000 giant tortoises roaming freely on our atoll is proof of what long-term commitment to conservation can achieve. This is wonderful news for Seychelles, for the world, and for everyone who has worked to protect Aldabra.”\nThe study, published in the scientific journal Ecology and Evolution, found that the population was relatively stable for this period, with a best estimate of almost 183,000 adult and sub-adult tortoises.\nIn the 19th century, exploitation of the animals meant there were fewer than 1,000 Aldabra tortoises left on the island, but a recovery programme led to it becoming a strict nature reserve in 1981 and a Unesco site in 1982.\nResearchers are now saying it is one of the greatest conservation success stories of the Indian Ocean, with the new study confirming it. “Aldabra’s giant tortoise monitoring programme is one of the longest running in the region, but the atoll’s dense vegetation makes counting tortoises genuinely difficult in places,” said Dr Nancy Bunbury, one of the study’s co-authors.\n“By modelling what we didn’t see, as well as what we did, we’ve produced the most reliable baseline yet for this iconic Seychelles species, establishing a benchmark we can use to track the population for decades to come.”\nDespite the good news, the study’s authors say that vigilance is essential. Aldabra’s climate is changing, with longer and more frequent droughts predicted to reduce the shade and food available to tortoises, while rising sea levels threaten low-lying parts of the atoll.\nThe study authors say invasive mammals remain a threat including feral cats and black rats that prey on tortoise eggs and hatchlings. The planned eradication of these remaining invasive mammals, the authors say, could lift the last barriers to further growth of the population and help it withstand future climate pressures.\n“These results are great news for the tortoises and testament to the fantastic work done in the field,” said Dr Dave Hudson, a postdoctoral research associate at the University of Exeter’s Cornwall campus.\n“But it’s important to remember that the numbers provide a baseline – not an endpoint.\n“Hopefully we have provided the conservation managers the evidence they need to track future change and act early as the tortoises face increasing pressures from climate change, drought and invasive species.”", "translation_ja": "", "vocab": [{"word": "thriving", "definition": "繁栄している、栄えている。ビジネスや生物個体群などが健全に成長・発展している状態を示す。"}, {"word": "exploitation", "definition": "搾取、過度な利用。天然資源や動物などを過剰に利用・捕獲すること。"}, {"word": "vigilance", "definition": "警戒、注視。危険や問題に対して常に注意深く監視する必要性を示す。"}, {"word": "invasive", "definition": "侵略的な、外来の。生態系に悪影響を与える外来種などを指す。"}, {"word": "benchmark", "definition": "基準値、ベンチマーク。比較や評価のための標準的な測定値や基準点。"}]}, {"title_ja": "Ethiopia launches drone attack against Eritrean troops who crossed into Tigray", "title_en": "Ethiopia launches drone attack against Eritrean troops who crossed into Tigray", "summary_ja": "Government forces’ attack raises risk of internal conflict in Ethiopia that could trigger regional war Eritrean troops who crossed into Ethiopia’s Tigray region have come under drone attack from government forces, raising the risk that renewed internal conflict in Ethiopia could trigger an all-out r", "summary_en": "Government forces’ attack raises risk of internal conflict in Ethiopia that could trigger regional war Eritrean troops who crossed into Ethiopia’s Tigray region have come under drone attack from government forces, raising the risk that renewed internal conflict in Ethiopia could trigger an all-out r", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/08/ethiopia-drone-attack-against-eritrean-troops-in-tigray", "state_media": false, "category": "政治", "full_text": "Eritrean troops who crossed into Ethiopia’s Tigray region have come under drone attack from government forces, raising the risk that renewed internal conflict in Ethiopia could trigger an all-out regional war between the neighbouring countries.\nMilitary vehicles carrying soldiers drove across Eritrea’s southern border into Tigray on Wednesday, reaching the town of Adigrat 25 miles (40km) south, according to civilian witnesses, a militia commander and the conflict monitoring group Acled.\nEritrean troops were then targeted by Ethiopian government drones on Wednesday evening and Thursday morning, Acled said.\nEritrea has a historical enmity with the Tigray People’s Liberation Front (TPLF), which launched an offensive against the Ethiopian government on 23 September, but that previous hostility has been superseded by Eritrea’s desire to head off a perceived risk of Ethiopia invading it, in order to access the Red Sea.\nIn the last two weeks, the TPLF and six other armed groups in Ethiopia have fought the government in Tigray and the neighbouring regions Amhara and Afar. Ethiopia’s military pushed back and an allied militia, the Tigray Peace Force, took over Tigray’s regional capital, Mekelle, on 4 October after the TPLF withdrew from the city.\nEritrea’s information minister, Yemane Ghebremeskel, said in a statement: “We are not in the business of refuting wild allegations or narratives.” He did not explicitly confirm or deny the presence of Eritrean troops in Ethiopia.\nEthiopia’s foreign ministry said in a statement on Monday: “Ethiopia stands ready to defend its sovereignty, territorial integrity, and core national interests, while urging all regional actors to address shared challenges through constructive dialogue, partnership, and adherence to the principles of good neighbourliness rather than confrontation and zero-sum approaches.”\nThe TPLF and Ethiopia’s government fought a brutal civil war from 2020 to 2022. Between 300,000 and 800,000 civilians died, according to British government estimates. Both sides and their allies were accused of war crimes.\nEritrea intervened on the side of Ethiopia in that conflict, after a rapprochement between the two countries in 2018, which earned Ethiopia’s prime minister, Abiy Ahmed, the 2019 Nobel peace prize.\nEritrea, which gained independence from Ethiopia in 1993, has a long enmity with the TPLF, which ruled Ethiopia from 1991 to 2018. The two countries fought a war from 1998 to 2000.\nRelations between the countries have deteriorated again in recent years. Abiy has said Ethiopia needs access to the Red Sea, and state media has claimed the country has historical rights to the Eritrean port of Assab. The US-Israeli war on Iran – leading Iran to limit shipping through the strait of Hormuz – has further raised the stakes of Red Sea access.\nIn its statement on Monday, Ethiopia’s foreign ministry said: “Any serious discussion of regional maritime affairs and security architecture must account for Ethiopia’s legitimate interests and its enduring connection to the Red Sea.”\nYemane said in a post on X on Wednesday that Ethiopia was “incessantly beating the drums of war and openly stating … that it will launch a war of aggression against Eritrea to acquire what it calls ‘sovereign access to the sea’ … In recent weeks, it has tried to repackage this war agenda in terms of ‘self-defence’ by fabricating various allegations against Eritrea.”\nMagnus Taylor, Horn of Africa deputy director at the Crisis Group thinktank, said: “The big worry is that [Abiy] might try to solve all his problems at the same time, by invading Eritrea, possibly a regime change move and also a land grab for the Red Sea port, and also solving his problem with Tigray at the same time. It’s a very ambitious military agenda, though.”\nWhile the full impact of the fighting on Tigrayan civilians is not clear, reports have emerged of the TPLF forcibly recruiting boys as young as 15 to fight.\n“The civilians in these three regions [Tigray, Amhara and Afar] didn’t get healed from the first round of violence that was halted by the peace agreement [in 2022],” said Acled Ethiopia analyst Jalale Getachew Birru. “They just started healing recently.”\nAssociated Press contributed to this story", "translation_ja": "", "vocab": [{"word": "enmity", "definition": "敵意や深い恨み。二者間の長期的で根深い対立関係を指す。"}, {"word": "superseded", "definition": "より重要なもの、新しいものに置き換わる、または上回られる。前の状態が現在の状態に取って代わられることを意味する。"}, {"word": "rapprochement", "definition": "対立していた国家や勢力間の関係改善や和解。特に外交的な接近を指す。"}, {"word": "confrontation", "definition": "対立や衝突。特に政治的・軍事的な直接的な対抗関係を指す。"}, {"word": "territorial integrity", "definition": "領土主権。国家の領土が侵害されない権利や原則を意味する用語。"}]}, {"title_ja": "Kenya confirms first Ebola case as virus ‘surges’ in DR Congo province", "title_en": "Kenya confirms first Ebola case as virus ‘surges’ in DR Congo province", "summary_ja": "Health minister says 28 contacts identified after death of citizen who arrived from DRC on Saturday Kenya has reported its first-ever Ebola death, the health minister announced on Tuesday, as the disease continues to spread rapidly through the north-east of the Democratic Republic of Congo (DRC), wh", "summary_en": "Health minister says 28 contacts identified after death of citizen who arrived from DRC on Saturday Kenya has reported its first-ever Ebola death, the health minister announced on Tuesday, as the disease continues to spread rapidly through the north-east of the Democratic Republic of Congo (DRC), wh", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/06/kenya-first-ebola-case-death-drc", "state_media": false, "category": "政治", "full_text": "Kenya has reported its first-ever Ebola death, the health minister announced on Tuesday, as the disease continues to spread rapidly through the north-east of the Democratic Republic of Congo (DRC), where the outbreak was announced in May.\nThis is the 17th outbreak of the highly infectious, often deadly disease in the DRC. As of 2 October, 4,082 people had died out of 8,463 confirmed cases in the country since the emergence of the Bundibugyo strain of the Ebola virus, for which there is still no vaccine nor specific treatment.\nA Kenyan man who had been living in the DRC for seven years died after returning to Kenya, the Kenyan health minister Aden Duale told reporters.\nThe man, who has not been named, had been treated in the DRC after falling ill about a month ago. He then travelled overland to the Ugandan capital, Kampala, before flying to Nairobi on 3 October.\nKenya has previously never reported a case of Ebola, but neighbouring Uganda recorded 20 – almost all people who had travelled from the DRC – and two deaths, before being declared Ebola-free in August.\nDuale said the man was taken by a relative and a friend from Nairobi’s international airport to Nairobi hospital, where he was immediately isolated, suffering from “fever, chills, intense fatigue, weakness, muscle pain, painful swallowing, sore throat and bleeding under the skin at the injection sites”.\nHe said the man was subsequently screened and confirmed positive for the virus, but “regrettably passed on last night at around 1130” in the evening (2030 GMT).\nDuale said officials had listed 28 contacts of the deceased, including family members and healthcare workers, but that so far “only one test has turned positive and is the one that we have just discussed”.\nHe added that authorities were looking for another 23 passengers and four crew members who were on the same flight with the man and that “arrangements” for quarantine for those at risk had been prepared. “I wish to assure the public not to panic, as all systems are in place to mitigate the spread of the disease,” he said.\nDuale said a “safe and dignified burial” of the man had been planned for later in the day, in line with public health standards, but did not give further details.\nKenyans reacted furiously to government plans earlier this year to allow the US to set up an Ebola facility at Laikipia airbase, about 125 miles from Nairobi.\nAfter starting in the DRC’s north-eastern Ituri province, the current outbreak has spread to seven provinces in the country’s north and east.\nThe response to the virus in the vast central African country has been hindered by instability, including clashes between armed groups, mistrust of authorities – which has led to violence against health workers and other officials – and a lack of resources amid huge cuts in international aid.\nThe medical charity Médecins Sans Frontières warned on Monday of an “alarming surge” in cases in eastern North Kivu province, which borders Uganda. The province now accounts for 40% of all new Ebola cases, compared with 24% at the end of August, the NGO said.\n“It is like fighting a megafire,” said Stephanie Hoffmann, coordinator at MSF’s Ebola treatment centre in the city of Butembo. “Multiple outbreaks are developing at the same time, with varying intensity and in different locations.”\nThe wider Butembo health zone is home to around 2 million people and only has four Ebola treatment centres, two of which only opened recently, MSF said.\nHoffman said: “Because there are not enough beds available, we are sometimes forced to refer confirmed Ebola patients elsewhere, despite the significant risk this poses to the wider community. In addition, standards of care in some peripheral facilities do not always meet the requirements for Ebola treatment.”\nNorth Kivu is particularly affected by conflict, with 134 violent incidents there in the past month, according to tracking group Armed Conflict Location and Event Data, more than any other province.\nAgence France-Presse contributed to this report", "translation_ja": "", "vocab": [{"word": "infectious", "definition": "伝染性のある、感染力が強い。病気やウイルスが人から人へ広がりやすい性質を表す医学用語。"}, {"word": "emergence", "definition": "出現、発生。新しい病気や問題が初めて現れることを指す。"}, {"word": "screened", "definition": "検査する、スクリーニングする。医学的診断や検査の対象となることを意味する。"}, {"word": "mitigate", "definition": "軽減する、和らげる。問題や危険の程度を減らす、影響を最小限にすることを表す。"}, {"word": "quarantine", "definition": "隔離、検疫。感染の可能性がある人や物を一定期間隔離して感染拡大を防ぐ措置。"}]}, {"title_ja": "A father’s agony after an Israeli air strike hits Gaza apartment", "title_en": "A father’s agony after an Israeli air strike hits Gaza apartment", "summary_ja": "An Israeli air strike hit a building in Gaza City’s al-Sabra neighbourhood, killing several people, including children.", "summary_en": "An Israeli air strike hit a building in Gaza City’s al-Sabra neighbourhood, killing several people, including children.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/9/a-fathers-agony-after-an-israeli-air-strike-hits-gaza-apartment?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "A father’s agony after an Israeli air strike hits Gaza apartment\nNewsFeed\nA father’s agony after an Israeli air strike hits Gaza apartment\nAn Israeli air strike hit a residential building in Gaza City’s al-Sabra neighbourhood, killing several people, including children, as they slept. More than 1,400 Palestinians have been killed since a so-called ceasefire took effect in October 2025.\nPublished On 9 Oct 2026", "translation_ja": "", "vocab": [{"word": "agony", "definition": "激しい苦痛や苦悩のこと。身体的または精神的な極度の苦しみを表します。"}, {"word": "residential", "definition": "住宅用の、または住居に関連した。人々が生活する建物や地域を指します。"}, {"word": "ceasefire", "definition": "停戦、つまり敵対する両者が戦闘を中止することの合意。一時的または永続的な戦争の中断を意味します。"}, {"word": "strike", "definition": "軍事用語では攻撃、爆撃を意味します。特に航空機による急襲的な攻撃を指すことが多いです。"}]}, {"title_ja": "Will Ethiopia’s neighbours intervene as Tigray war escalates?", "title_en": "Will Ethiopia’s neighbours intervene as Tigray war escalates?", "summary_ja": "Tigray’s renewed war is testing Ethiopia’s already strained regional ties.", "summary_en": "Tigray’s renewed war is testing Ethiopia’s already strained regional ties.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/9/will-ethiopias-neighbours-intervene-as-tigray-war-escalates?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Will Ethiopia’s neighbours intervene as Tigray war escalates?\nTigray’s renewed war is testing Ethiopia’s already strained regional ties.\nAddis Ababa, Ethiopia – After nearly two weeks of fierce fighting, Ethiopian federal forces entered the Tigrayan capital of Mekelle as forces from an alliance of rebel groups, including the Tigray People’s Liberation Front (TPLF), withdrew from the city.\nThe fighting that erupted late last month has effectively ended the 2022 Pretoria ceasefire and the fragile peace that followed the devastating Tigray war.\nBut Mekelle’s capture may mark the end of conventional warfare rather than the end of the conflict. Fighting has continued elsewhere in Tigray, while reports of Eritrean troops entering northern Tigrayan towns have added a potentially more dangerous regional dimension.\nEthiopian federal forces used air power and ground forces to advance across Tigray. After suffering successive defeats around the towns of Alamata and Kobo, rebel forces withdrew into the surrounding countryside. They have pledged to continue fighting.\n“We will confront the enemy on our terms and where we choose,” TPLF leader Debretsion Gebremichael said.\nA war that may not be over\nThere are echoes of the war that began in 2020, when Prime Minister Abiy Ahmed’s government declared victory after federal forces captured Mekelle. Tigrayan forces subsequently regrouped in the mountains, retook much of the region and recaptured the capital, prolonging the war for nearly a year and a half.\nThe renewed conflict could follow a similar trajectory, particularly if the TPLF and other armed groups succeed in turning the mountainous terrain into a prolonged armed rebellion. Ethiopia is already fighting insurgencies in Amhara and Oromia, raising the prospect of its federal forces being stretched across multiple fronts.\nBut the battlefield reversals suffered by the rebels could have implications well beyond Tigray. They have raised concern in Egypt and among other Ethiopian rivals, according to Hossamaldeen Ibrahim, an African analyst at the Bloomsbury Intelligence and Security Institute.\n“Egypt views the Renaissance Dam, and any Ethiopian [army] move towards the Red Sea, as a strategic threat, so it has allied with Eritrea, Sudan and Somalia against any Ethiopian unilateralism,” Ibrahim told Al Jazeera.\n“Ethiopia is seeking a sea outlet; Eritrea sees this as an existential threat.”\nEthiopia’s Red Sea ambitions\nEthiopia has been landlocked since Eritrea won its war of independence in 1991, leaving Addis Ababa heavily dependent on neighbouring countries for access to international trade.\nAbiy has increasingly made access to the Red Sea a strategic priority since 2023, raising concerns in Eritrea over Ethiopia’s ambitions, particularly over the port of Assab.\nEthiopia currently relies heavily on Djibouti for maritime trade, while also pursuing alternative arrangements, including through Kenya and Somaliland.\nAfter being sworn in on Monday for another five-year term following his party’s victory in the June 1 election, Abiy again put the issue at the centre of his parliamentary address.\n“Based on the principle of give and take, we will work diligently to ensure that Ethiopia has an outlet to the sea,” he told parliament.\nThe issue has increasingly become part of a wider regional contest.\nA loose regional alignment\nIn recent months, Egypt, Eritrea, Sudan and Somalia have found themselves sharing concerns over Ethiopia’s regional ambitions. On October 4, the leaders of the four countries met for a quadrilateral consultative summit in New Alamein, Egypt, where they discussed regional issues and pledged to strengthen political, economic and trade cooperation as well as consultation and coordination.\nThe meeting does not amount to a formal military alliance, and the four countries have different interests in their dealings with Addis Ababa. The summit’s joint declaration also called for respect for sovereignty and territorial integrity, noninterference in internal affairs and the peaceful resolution of disputes.\nBut their concerns increasingly overlap around Ethiopia’s ambitions in the Red Sea, the Nile and the wider Horn of Africa.\nRelations between Ethiopia and Eritrea have also deteriorated sharply since the Pretoria ceasefire. Ethiopia closed its embassy in Eritrea and expelled Eritrean diplomats on October 1, accusing Asmara of hostile acts and involvement in the renewed fighting. Eritrea responded by severing diplomatic ties, while denying that it supported the opposition alliance. Egypt and Sudan have also denied Ethiopian accusations that they are backing the alliance.\nThe Ethiopian army’s advance into Tigray has added another layer to that rivalry.\n“The [Ethiopian army’s] advance in Tigray directly threatens [Eritrean President] Isaias [Afwerki] and the Eritrean state,” said Etana H Dinka, an assistant professor of African history at the University of Miami.\nEritrean forces fought alongside Ethiopian troops during the ", "translation_ja": "", "vocab": [{"word": "escalate", "definition": "状況や紛争が段階的に悪化・拡大すること。より深刻または激しくなる過程を指す。"}, {"word": "fragile", "definition": "壊れやすい、不安定な状態を表す。平和や関係が簡単に崩壊する可能性があることを意味する。"}, {"word": "dimension", "definition": "事象の側面や要素のこと。ここでは紛争が地域的な広がりを持つようになったという意味で使用されている。"}, {"word": "trajectory", "definition": "進行過程や発展の道筋のこと。物や事象がたどる経路や方向性を指す。"}, {"word": "unilateralism", "definition": "一国が単独で行動する主義や政策。他国との協調や合意なしに自国の意思だけで行動することを意味する。"}]}, {"title_ja": "Iran war live: Iranian media reports ‘massive explosions’ in Hormuz Strait", "title_en": "Iran war live: Iranian media reports ‘massive explosions’ in Hormuz Strait", "summary_ja": "Iranian media reported massive explosions in the southern Strait of Hormuz, with Fars citing unnamed military sources.", "summary_en": "Iranian media reported massive explosions in the southern Strait of Hormuz, with Fars citing unnamed military sources.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/10/9/iran-war-live-iranian-media-reports-massive-explosions-in-hormuz-strait?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: Iranian media reports ‘massive explosions’ in Hormuz Strait\nIranian media reported “massive explosions” in the southern Strait of Hormuz, with Fars citing unnamed military sources as Trump says US won’t strike Iran before midterms.\nPublished On 9 Oct 2026\n- US President Donald Trump has said Washington was having “productive discussions” with Iran and pledged not to attack the country before the November 3 midterm elections.\n- Iranian media has reported “massive explosions” in the southern Strait of Hormuz, with Fars citing unnamed military sources as saying tankers using “unauthorised” routes may have struck sea mines.", "translation_ja": "", "vocab": [{"word": "Hormuz Strait", "definition": "ホルムズ海峡のこと。ペルシャ湾とオマーン海を結ぶ戦略的に重要な海上交通路で、世界の石油輸送の大部分がここを通過する。国際政治・経済で頻出の重要な地名。"}, {"word": "productive discussions", "definition": "生産的な議論・協議を意味する表現。ビジネスや外交で、進展や成果が期待できる建設的な対話を指す。"}, {"word": "pledged", "definition": "公式に約束する・誓うという意味。政治家や企業指導者が重要な約束をする際によく使われる正式な表現。"}, {"word": "midterm elections", "definition": "中間選挙のこと。米国で大統領選挙と大統領選挙の間に行われる議会選挙。政権の支持率を測る重要な指標とされる。"}, {"word": "unauthorised routes", "definition": "未承認の・許可されていない経路を意味する。セキュリティや規制の文脈で、公式に認められていない方法や場所を指す。"}]}, {"title_ja": "Trump says U.S. will not resume military strikes on Iran before Nov. 3 midterm elections", "title_en": "Trump says U.S. will not resume military strikes on Iran before Nov. 3 midterm elections", "summary_ja": "The U.S. and Iran signed a short-lived interim agreement in June, intended to establish a 60-day ceasefire and framework for a permanent peace deal", "summary_en": "The U.S. and Iran signed a short-lived interim agreement in June, intended to establish a 60-day ceasefire and framework for a permanent peace deal", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-says-us-will-not-resume-military-strikes-on-iran-before-nov-3-midterm-elections/article71561624.ece", "state_media": false, "category": "政治", "full_text": "President Donald Trump said Thursday (October 8, 2026) that he will not order a resumption of military strikes on Iran before the November 3 midterm elections in the United States.\nMr. Trump, while stumping for Republicans this week, has hinted that he was confident that an endgame to the war could come in the days before or after the election, while also hinting that he remained open to resuming full-scale military operations against Iran.\nFor weeks, Mr. Trump has been threatening that a post-midterm election escalation in the seven-month-old war remains a viable option, despite his initial promises to Americans of a military campaign that would last a matter of weeks.\nBut Mr. Trump in a social media post on Thursday (October 8, 2026) said the U.S. “will not be attacking Iran at any time prior to the Midterm Elections to be held in the United States on November 3rd”.\nMr. Trump added that his team has been “having productive discussions with the Islamic Republic of Iran.”\nThe U.S. and Iran signed a short-lived interim agreement in June, intended to establish a 60-day ceasefire and framework for a permanent peace deal.\nThe deal signed by Mr. Trump and Iranian President Masoud Pezeshkian collapsed within weeks amid renewed military actions and disputes over control of the Strait of Hormuz, the critical water which one-fifth world's oil flowed through before the war.\nNegotiations had appeared at a standstill since Mr. Trump late last month publicly rejected Iran's proposal to reopen the strait within seven days if the U.S. met certain conditions.\nIran, however, said last week they had received a U.S. counterproposal. And Foreign Minister Abbas Araghchi earlier on Thursday said he expected Tehran would offer a formal reply within days.\nMr. Trump on Wednesday (October 7, 2026) during a campaign rally in San Antonio, Texas, said that his special envoy, Steve Witkoff, has continued indirect negotiations with Iranian officials.\nBut at the same time, Mr. Trump suggested he had mixed feelings about ending the war at this point.\n“I think the deal isn't really something that I want to do, but they're willing to offer us anything to stop,” Mr. Trump said.\nMr. Trump believes that America is gaining leverage as the U.S. military is having greater success in helping oil tankers traverse the Strait of Hormuz and get Gulf allies' oil to market, while a Navy blockade is shutting down Iran's own oil exports.\nIran has lost its near chokehold over oil flows through the vital waterway with U.S. Central Command shepherding oil tankers through the strait at night with their location systems turned off.\nThat with the help of Gulf pipelines that skirt the strait, has allowed Gulf countries to export oil at nearly prewar levels.\nBut Iran has ramped up attacks on tankers passing through the strait in recent days. And overall, ship traffic remains well below prewar levels, as are shipments of liquid natural gas and fuel products.\nTanker operators willing to risk running the gauntlet under Central Command's protection are in some cases charging rates of $1 million a day or more, shipping analysts say.\nThe situation has become further complicated as Saudi Arabia and Yemen's government have launched a military campaign aimed at driving Iran-backed Houthi rebels from the Bab el-Mandeb strait, another critical West Asia trade route for oil and other goods.\nThe Houthis, in turn, are targeting Saudi airports and key infrastructure in the kingdom with drone and missile strikes.\nMr. Trump's post comes as the military has dispatched more resources to the region. U.S. officials have said a third aircraft carrier, the USS Theodore Roosevelt, and thousands of troops aboard it and accompanying ships could arrive as early as the end of October.\nMr. Trump's announcement was made the same day the USS Abraham Lincoln was due to arrive to its home port in San Diego after a record-long deployment in support of the Iran war. There have been reports of crew stress and poor mental health, as well as supply shortages, including food and hygiene products.\nThe USS George Washington, which is usually based in Asia, relieved the Lincoln in August. The other aircraft carrier in the West Asia, the USS George HW Bush, has been deployed for about six months, but it pulled into Phuket, Thailand, for a port visit several days ago.\nPublished - October 09, 2026 05:15 am IST", "translation_ja": "", "vocab": [{"word": "stumping", "definition": "政治キャンペーンのために各地を回って演説すること。選挙運動の文脈で、候補者が有権者に直接訴えかける活動を指します。"}, {"word": "endgame", "definition": "交渉や紛争の最終段階のこと。特に複雑な状況が終局に向かうプロセスを意味し、チェスなどのゲーム用語から派生しました。"}, {"word": "escalation", "definition": "状況や紛争が段階的に激化・拡大すること。対立が次第に深刻になっていくプロセスを表します。"}, {"word": "interim", "definition": "暫定的な、一時的なという意味。正式な合意に至るまでの間に結ばれる仮の取り決めなどに使用されます。"}, {"word": "counterproposal", "definition": "相手の提案に対して提示する代替案や反論案。交渉において自分たちの条件を示すために使われます。"}]}, {"title_ja": "South African anti-migrant protests turn violent, government blames disinformation", "title_en": "South African anti-migrant protests turn violent, government blames disinformation", "summary_ja": "The unrest followed a protest by a group demanding ‌that a refugee centre stop processing asylum applications", "summary_en": "The unrest followed a protest by a group demanding ‌that a refugee centre stop processing asylum applications", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/south-african-anti-migrant-protests-turn-violent-government-blames-disinformation/article71561419.ece", "state_media": false, "category": "社会", "full_text": "Anti-migrant protests in two South African cities including Johannesburg’s Soweto township turned violent on Thursday (October 8, 2026), with the government blaming disinformation over a co
