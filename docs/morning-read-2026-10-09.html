urt ruling on asylum seekers.\nIn coastal Durban, the second city hit by protests, a Reuters reporter saw five cars in flames in the urban centre, where foreign-owned shops were also looted.\nThe unrest followed a protest by a group demanding that a refugee centre stop processing asylum applications.\nIn Soweto, a Reuters reporter saw residents carrying groceries out of a shop that they said was owned by a person from Somalia, whom they chased away. The looters fled after police arrived and made them disperse.\nGovernment spokesperson William Baloyi said the violence was triggered by people spreading deliberately false information about a constitutional court ruling in July.\nThe country’s highest court ruled that asylum seekers cannot be denied access to South Africa’s asylum system solely for procedural reasons such as having entered the country illegally.\nMr. Baloyi said the ruling had been widely misrepresented and did not automatically grant refugee status, permanent residence or other legal rights to undocumented migrants. “We are deeply concerned by what is going on now,” he added.\nPolice said in a statement that they had mobilised more officers in Durban, where they said at least 14 vehicles had been set alight while a guest house and warehouse were partially burned.\nA top police official, Lieutenant General Puleng Dimpane, planned to hold a press conference in Soweto on efforts to maintain law and order there.\nSouth Africa has seen months of anti-migrant marches this year that have drawn international criticism.\nSome of the marches have descended into violence and looting, and thousands of African foreign nationals have fled the country.\nMigrants are often blamed for taking jobs, fuelling crime and straining public services, claims that social scientists say are not supported by evidence.\nThree decades since apartheid ended, South Africa remains deeply unequal and about a third of people are out of work. Despite this, it remains Africa’s largest economy and continues to draw migrants.\nPublished - October 09, 2026 05:10 am IST", "translation_ja": "", "vocab": [{"word": "disinformation", "definition": "意図的に広められた虚偽の情報。事実ではない情報を意識的に流布して、世論や判断に悪影響を与える行為を指す。"}, {"word": "procedural", "definition": "手続きや過程に関する。形式的な方法や手順に関連していることを意味し、実質的な内容ではなく形式面に関する場合に使用される。"}, {"word": "misrepresented", "definition": "不正確または虚偽の方法で表現または説明されること。事実を歪めて伝えられた状態を指す。"}, {"word": "mobilised", "definition": "資源や人員を配置・動員する。特に緊急時に必要な人や物を集めて配置し、対応に当たることを意味する。"}, {"word": "descended into", "definition": "より悪い状態へと低下する。平穏な状況から暴力や混乱といった悪い状態へ変わることを表す。"}]}, {"title_ja": "U.K. arrest two Latvians inside perimeter of RAF base housing U.S., NATO intelligence operations", "title_en": "U.K. arrest two Latvians inside perimeter of RAF base housing U.S., NATO intelligence operations", "summary_ja": "The base, RAF Molesworth, which is 112 km north of London, is operated by the U.S. Air Force and is home to the NATO Intelligence Fusion Centre, which provides information to the Supreme Allied Commander in Europe", "summary_en": "The base, RAF Molesworth, which is 112 km north of London, is operated by the U.S. Air Force and is home to the NATO Intelligence Fusion Centre, which provides information to the Supreme Allied Commander in Europe", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/uk-arrest-two-latvians-inside-perimeter-of-raf-base-housing-us-nato-intelligence-operations/article71561623.ece", "state_media": false, "category": "政治", "full_text": "U.K. authorities arrested two Latvian men after they were discovered early Thursday inside the perimeter of an RAF base that houses U.S. and NATO intelligence operations, counterterrorism police said.\nThe base, RAF Molesworth, which is 112 km north of London, is operated by the U.S. Air Force and is home to the NATO Intelligence Fusion Centre, which provides information to the Supreme Allied Commander in Europe, as well as intelligence personnel from the U.S. Africa Command.\nOfficers from the Ministry of Defence Police and Cambridgeshire Constabulary began investigating the incident at about 10 p.m. Wednesday after an abandoned vehicle was found near the edge of the base, Counter Terrorism Policing London said in a statement.\nPolice later found a small hole in the perimeter fence, and the suspects, both U.K. residents, were arrested at about 2 a.m. Thursday.\nThe men, ages 32 and 36, were initially arrested on suspicion of trespass on a prohibited site and criminal damage. They were later arrested on charges of entering a prohibited place for a purpose prejudicial to the U.K.\nThe matter is being investigated by counterterrorism police because of the nature of the offense.\nThe breach at RAF Molesworth is the third security incident to rattle the British military community in the past month as defense and intelligence officials warn that the United Kingdom is likely to be targeted by so-called hybrid attacks by people working for foreign powers such as Russia and Iran.\nOn September 27, authorities discovered three suspicious vans near RAF Fairford, a British air base from which U.S. bombers have launched strikes against Iran, triggering a widespread investigation that has led to seven arrests. The U.S. Air Force withdrew all of its bombers from the base last weekend.\nOn Thursday, a serving member of the Royal Navy appeared in court on charges that he attempted to send sensitive information to Russia between November 2024 and May 2025.\nThere is nothing to suggest that the incident at RAF Molesworth is related to what happened at RAF Fairford, Cmdr Helen Flanagan, head of the counterterrorism unit, said in a statement.\n“Our investigation into this incident is at its very early stages,” Flanagan said. “A big part of this is looking at any potential motivation as to why the men were present at the site, but I must stress we are keeping an open mind at this stage and inquiries are very much ongoing.\"\nRAF Molesworth was founded in 1917 and was used by U.S. bombers during World War II. It housed a variety of British and US units after the war until 1990, when the RAF began building a new intelligence analysis centre for the U.S. European Command.\nThat facility has evolved into what is now known as NATO's Joint Intelligence Operations Centre Europe.\nThe U.S. European Command said that it was aware of the incident, but declined to comment on “specific force protection measures”.\n“We will continue to assess the threat environment surrounding our installations and take appropriate actions to protect our people, our platforms, and the bases where our forces operate from,” the command said in a statement. “While we assess the global security posture, US forces remain at the highest state of readiness.”\nFollowing the security alert at RAF Fairford, the U.S. Air Force last weekend brought home all of the bombers it had deployed to the base.\nUS. .President Donald Trump told reporters on Monday that he didn't want to tempt “the enemy” by having the bombers there.\nBritish officials have declined to comment on reports that the bombers were moved because of fears of a drone attack on the base.\nU.K. Defence Secretary Wes Streeting said Thursday that the government is “highly vigilant” about potential threats to its military installations.\n“The protection of our bases is multilayered, including physical barriers, patrols, surveillance, monitoring, and counter-drone capabilities,” he said in a statement.\nPublished - October 09, 2026 05:06 am IST", "translation_ja": "", "vocab": [{"word": "perimeter", "definition": "境界線、周囲。特に施設や領域の外周を示す。セキュリティ文脈では、保護対象エリアの外縁を意味する。"}, {"word": "breach", "definition": "違反、侵害、または物理的な破口。セキュリティシステムの破壊や侵入を指す。"}, {"word": "prejudicial", "definition": "害をもたらす、不利益な。法的文脈では、特定の権利や利益に悪影響を与える行為を表す。"}, {"word": "hybrid attacks", "definition": "従来型と非従来型の攻撃を組み合わせた戦術。政治的目的で複数の手段を同時に使用する攻撃方法。"}, {"word": "counterterrorism", "definition": "テロ対策、反テロ活動。テロ行為の防止と捜査に特化した法執行活動。"}]}, {" er": "paper", "link": "https://news.google.com/rss/articles/CBMizwFBVV95cUxPOWw3MVRSY3hFbEgyT1A1OFNaNXA4d05OVlV3ZGtPVUx5VDB1N2VMeXB1S0U0Q1BzdlppNTN0ZF9oR0ZqSmhnMlp2ellMVFpyS3ZISnlfNlNQNzg2Z1BnQzBUUUNVdDdUdVRwTzgxbGtFcVg5Yzg4S2pjNDFBUU91YU5jQTR6MkFfVkdWbE04Mno2VTAtT0FWLVNVQmZuNVpzWTI4WWV5eDVQRDM4MENndF9KM0NUbWlINlc0eDVHdXM3Q09HTExRTGZiblZGVk3SAd4BQVVfeXFMTVhOaS00d3dBNFlTZkRiOFVPWURfTWloN2NBWDk1LUNiVXNfRmRjbkFJaXBRc3BXWVBFdVk1OUJoSk95N2pNSWZYYzI3dnhpa093ZkxNWGVEN2ltTkNYc1FKSUZCTl9xYU5yVVVJV2tjS0lVbWxWdEpQWTUwYkJsMXBaT0xBX0pWRVdzaEdQcndtQVFMeXNnRFgwY24xdktQTzNYR1I4S3VRYUtGNzZPNjdxUlNPSUstQUZrcUdPZGhqcHhuN25VcjgyZEd3NVU2MEtkTlhDRTJPd3M2VHFn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Reps warn participating institutions against manipulating NELFUND loans", "title_en": "Reps warn participating institutions against manipulating NELFUND loans", "summary_ja": "Lawmakers said some beneficiary institutions failed to administer NELFUND funds properly, warning that deliberate non-compliance could lead to suspension from the scheme, fund recovery, and referral to law enforcement agencies. The post Reps warn participating institutions against manipulating NELFU", "summary_en": "Lawmakers said some beneficiary institutions failed to administer NELFUND funds properly, warning that deliberate non-compliance could lead to suspension from the scheme, fund recovery, and referral to law enforcement agencies. The post Reps warn participating institutions against manipulating NELFU", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/915562-reps-warn-participating-institutions-against-manipulating-nelfund-loans.html", "state_media": false, "category": "政治", "full_text": "The House of Representatives Committee on Student Loans, Scholarships and Higher Education Financing has warned universities and other beneficiary institutions against withholding funds disbursed under the Federal Government’s student loan scheme.\nThe committee said some institutions had failed to properly administer funds released by the Nigerian Education Loan Fund (NELFUND) for verified student beneficiaries.\nThe committee chairman, Ifeoluwa Ehindero (APC, Ondo), disclosed this in a statement on Thursday, following the committee’s recent monitoring activities and engagements with beneficiary institutions.\nAccording to Mr Ehindero, the committee identified instances of institutions withholding NELFUND funds meant for students, delaying refunds to students who had already paid their tuition before the fund’s disbursement, or refunding only part of the amount due to eligible beneficiaries.\nHe said these practices raised serious concerns about compliance with the rules governing the loan scheme’s administration.\n“It is important to state that such practices constitute serious compliance concerns, undermine transparency and accountability, erode students’ confidence in the system and may threaten equitable access to funding for higher education,” Mr Ehindero said.\nHe also warned that prolonged delays in processing payment notifications and refunds “may also disrupt academic progress and compound the financial hardship faced by affected students.”\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nMr Ehindero urged heads of beneficiary institutions to ensure bursars, directors of ICT, and NELFUND desk officers strictly comply with the financial and administrative requirements for managing funds released under the scheme.\nHe said institutions must ensure that funds received from NELFUND on behalf of students are promptly and fully applied for the purposes for which they were released.\nThe committee also directed institutions to refund students who had already paid their fees before NELFUND disbursed funds.\nIt warned that institutions found deliberately refusing to comply with the scheme’s requirements could face sanctions.\nAccording to the committee, Section 5.6 of the NELFUND Guidelines provides for measures including the suspension of non-compliant institutions from the scheme, recovery of funds and referral of cases to relevant law enforcement and regulatory agencies.\nThe committee said it would intensify oversight of beneficiary institutions to strengthen enforcement, improve transparency in handling student loan funds, and ensure greater accountability within the scheme.\nIt said its oversight was aimed at ensuring that the Federal Government’s efforts to make higher education more accessible and affordable were not undermined by administrative failures at the institutional level.\nThe committee’s warning comes against the backdrop of student complaints about delays in receiving refunds for tuition fees they paid before NELFUND disbursements.\nIn May, Premium Times reported that some University of Calabar students raised concerns over delayed refunds, although the institution said the process was ongoing.\nThe university’s NELFUND desk officer said refunds were being made in batches and that, at the time, about 3,000 students had been refunded.\nNELFUND is the Federal Government’s student financing scheme, established to provide eligible Nigerian students with zero-interest loans to support their education.\nThe corporate body was established under the Students Loans (Access to Higher Education) Act, 2024, to manage and disburse interest-free student loans to eligible Nigerian students.\nREAD ALSO: University students raise concerns over delayed NELFUND refunds\nIt replaced the former Nigerian Education Bank Act and is a core initiative of President Bola Tinubu’s administration, ensuring financial hurdles do not prevent young Nigerians from accessing tertiary education.\nUnder the scheme, funds are disbursed to beneficiary institutions to cover approved education-related costs for verified students.\nWhere a student has already paid the relevant fees before NELFUND makes the payment, the institution is expected to refund the student where applicable.\nThe scheme is intended to reduce the financial burden of higher education and enable more Nigerians to access tertiary education without being excluded because of their inability to pay upfront.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "disbursed", "definition": "資金が公式に支払われること。特に政府や機関から個人や団体へ金銭が配分される過程を指す。"}, {"word": "beneficiary", "definition": "利益や恩恵を受ける人、団体、機関。この文脈では学生ローン制度から資金援助を受ける対象者を意味する。"}, {"word": "compliance", "definition": "規則や法令、合意事項に従うこと。組織や個人が定められた要件を満たしているかどうかの状態を示す。"}, {"word": "erode", "definition": "徐々に弱まる、減少する、損なわれることを意味する動詞。信頼や利益などが時間をかけて減っていく様子を表す。"}, {"word": "sanctions", "definition": "規則違反に対する罰則や制裁。政治的・経済的な制限措置や懲罰を指す。"}]}, {"title_ja": "Oyebanji presents N490.74bn budget proposal for 2027 to Ekiti assembly", "title_en": "Oyebanji presents N490.74bn budget proposal for 2027 to Ekiti assembly", "summary_ja": "Mr Oyebanji presented the appropriation bill, christened the ‘Budget of Sustained Progress and Prosperity,’ at the assembly chamber in Ado-Ekiti, the state capital. The post Oyebanji presents N490.74bn budget proposal for 2027 to Ekiti assembly appeared first on Premium Times Nigeria .", "summary_en": "Mr Oyebanji presented the appropriation bill, christened the ‘Budget of Sustained Progress and Prosperity,’ at the assembly chamber in Ado-Ekiti, the state capital. The post Oyebanji presents N490.74bn budget proposal for 2027 to Ekiti assembly appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/915550-oyebanji-presents-n490-74bn-budget-proposal-for-2027-to-ekiti-assembly.html", "state_media": false, "category": "経済", "full_text": "Ekiti State Governor Biodun Oyebanji on Thursday presented a proposed N490.74 billion budget for the 2027 fiscal year to the state House of Assembly.\nMr Oyebanji presented the appropriation bill, christened the ‘Budget of Sustained Progress and Prosperity,’ at the assembly chamber in Ado-Ekiti, the state capital.\nHe said the proposal was designed to consolidate his administration’s achievements and lay a foundation for the next four years.\nThe governor said the budget also aligned with the state’s 30-year development plan covering the period from 2021 to 2051.\nHe said the proposal comprised N275.68 billion for recurrent expenditure and N215.06 billion for capital expenditure.\nMr Oyebanji said the estimates would provide a framework for sustained development and improved living standards across the state.\nThe News Agency of Nigeria (NAN) reports that the budget focuses on six pillars of his administration.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe pillars include education and healthcare; good governance and transparency; arts, culture and tourism; youth and job creation.\nOthers are infrastructure and industrialisation, as well as agriculture and rural development.\nMr Oyebanji said the proposal would consolidate gains recorded under his administration’s Shared Prosperity Agenda.\nHe added that it would strengthen ongoing programmes and create opportunities for economic growth across the state.\nEarlier, the Speaker of the House of Assembly, Adeoye Aribasoye, commended Mr Oyebanji for presenting the proposed budget.\nMr Aribasoye said the proposal reflected the aspirations and needs of residents expressed during town hall engagements across the three senatorial districts.\nHe assured that the assembly would subject the proposal to thorough legislative scrutiny before its passage.\nHe said the review would focus on constitutionality, revenue projections, stakeholder engagement and equitable distribution of projects.\nMr Aribasoye said lawmakers would also assess the balance between recurrent and capital expenditure.\n“As we receive this bill today, the assembly will approach its legislative review with patriotism, objectivity, and thoroughness,” he said.\nREAD ALSO: Governor Oyebanji dissolves boards, terminates appointments of political aides\nHe said lawmakers would ensure equitable distribution of projects across the three senatorial districts and 16 local government areas.\nHe added that the assembly would also consider the 22 local council development areas in the state.\nMr Aribasoye said the assembly would cooperate with the executive where necessary and demand accountability where required.\nHe stressed that such scrutiny was not a contradiction but “constitutional democracy at work.”\n(NAN)\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "appropriation", "definition": "予算配分、資金配分を意味する用語。政府が特定の目的のために公的資金を配分することを指します。"}, {"word": "recurrent", "definition": "反復する、繰り返される支出を意味します。通常、給与や維持管理費など継続的に発生する経費を指します。"}, {"word": "consolidate", "definition": "強化する、統合するという意味。既に達成された成果や成功をさらに強固にすることを指します。"}, {"word": "scrutiny", "definition": "綿密な調査、詳細な検査を意味します。提案された案や計画を慎重に検討・評価するプロセスです。"}, {"word": "equitable", "definition": "公平な、不公正でないという意味。資源や機会が公正かつバランスよく配分されることを指します。"}]}, {"title_ja": "Nationwide PVC collection begins Friday as voter register hits 103 million – INEC", "title_en": "Nationwide PVC collection begins Friday as voter register hits 103 million – INEC", "summary_ja": "“Nationwide PVC collection will officially commence tomorrow, Friday, 9 October 2026,” Mr Salami, a professor, said. The post Nationwide PVC collection begins Friday as voter register hits 103 million &#8211; INEC appeared first on Premium Times Nigeria .", "summary_en": "“Nationwide PVC collection will officially commence tomorrow, Friday, 9 October 2026,” Mr Salami, a professor, said. The post Nationwide PVC collection begins Friday as voter register hits 103 million &#8211; INEC appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/headlines/915551-nationwide-pvc-collection-begins-friday-as-voter-register-hits-103-million-inec.html", "state_media": false, "category": "社会", "full_text": "The Independent National Electoral Commission (INEC) says nationwide collection of Permanent Voter Cards (PVCs) will begin on Friday, as the commission steps up preparations for the 2027 general elections.\nINEC also stated that the number of registered voters had risen to more than 103 million after the completion of the three-phase Continuous Voter Registration (CVR) exercise.\nThe commission’s chairman, Joash Amupitan, disclosed this on Thursday at the 10th annual conference of the Guild of Corporate Online Publishers (GOCOP) in Lagos.\nMr Amupitan, who is a professor and Senior Advocate of Nigeria (SAN), was represented at the conference by the Lagos Resident Electoral Commissioner, Ayobami Salami, who delivered his keynote address.\n“Nationwide PVC collection will officially commence tomorrow, Friday, 9 October 2026,” Mr Salami, a professor, said.\nHe stated that 10,772,421 new voters were registered during the three phases of the CVR.\nAccording to him, the new registrations had undergone biometric verification and INEC had completed the final Automated Biometric Identification System (ABIS) cleanup of the register.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nThe commission has scheduled the preliminary display of the register from 9 to 15 October for voters to check their details and raise claims or objections where necessary.\nINEC introduces printable PVCs\nMr Amupitan explained that INEC had introduced printable PVC technology to reduce the time voters would spend waiting for their cards.\nHe said the technology would also make it easier to replace cards that had been lost or stolen.\nThe commission, he added, had audited its technological infrastructure and procured new devices ahead of the 2027 elections.\nINEC is also strengthening its cybersecurity system and deploying artificial intelligence tools to identify and respond to possible threats to the electoral process.\nThe commission had earlier announced the acquisition of 57,000 new Bimodal Voter Accreditation System (BVAS) machines for the election.\nINEC disagrees with Agbakoba on election projections\nThe INEC chairman also disagreed with the position of the conference chairman, Olisa Agbakoba, a Senior Advocate of Nigeria (SAN), on the media’s reporting of election projections and exit polls.\nMr Agbakoba had questioned whether restrictions on such reports would be consistent with the constitutional rights to freedom of expression and access to information.\nMr Amupitan noted that people and organisations were free to express opinions and make predictions, but that official election results could only be declared by the appropriate electoral officers.\n“I want to respectfully disagree with your position. The position of the law, as we understand it today, is that only the returning officer has the constitutional responsibility to declare results,” he said.\n“Opinion is free, but facts are sacred.”\nHe warned that unofficial declarations could create confusion and trigger a crisis.\nMr Amupitan urged the media to rely on verified results uploaded through INEC’s Result Viewing platform, IReV, when reporting election results.\nHe also appealed to online publishers to avoid unverified information and clickbait that could mislead voters.\nPanel questions INEC’s readiness\nThe issue of election projections also came up during a panel discussion on “2027 Elections: Trust, Transparency and Shared Responsibilities”.\nThe panel included the Commissioner of Police in charge of Election Planning, Monitoring and Evaluation, Abayomi Shogunle; Head of Mass Communication at the University of Lagos, Tayo Popoola; Creative Director of Gender Agenda and founder of WEWE Network Afrique, Adaora Sydney-Jack; and Executive Director of the International Press Centre, Lanre Arogundade.\nMr Arogundade urged INEC to give the public more information about the technology it plans to use in 2027.\nHe said journalists should scrutinise the companies supplying the technology as well as the safeguards put in place to prevent manipulation.\nHe also questioned the preparedness of political parties to monitor the technology and the wider electoral process.\nAccording to him, any interruption in the electronic transmission of results could become a problem if INEC did not communicate quickly with the public.\nHe therefore called for a 24-hour crisis communication system that would allow the commission to respond to problems as they emerge.\nOn election projections, Mr Arogundade said the media should not be prevented from analysing results where the analysis was based on verified polling-unit results already available to the public.\nMedia urged to understand election laws\nMr Popoola said journalists must understand both media and electoral laws when covering elections.\nHe noted that the constitutional right to receive and share information did not remove the responsibility of journalist", "translation_ja": "", "vocab": [{"word": "commence", "definition": "正式に開始する、着手する。特に公式な場面や重要なイベントの開始を表す。"}, {"word": "biometric", "definition": "生物学的特性（指紋、虹彩など）を用いた認証・確認方法。本人確認や登録システムで使用される。"}, {"word": "infrastructure", "definition": "基盤となる施設やシステム。組織や国家の機能を支える重要な構造全体を指す。"}, {"word": "deploy", "definition": "戦略的に配置する、展開する。リソースやツールを効果的に配置して使用することを意味する。"}, {"word": "electoral", "definition": "選挙に関する、選挙の。投票や選出のプロセスに関連する事項を表す。"}]}, {"title_ja": "French Student Protests Continue as Government Seeks Way Out of Crisis", "title_en": "French Student Protests Continue as Government Seeks Way ttps://tass.com/politics/2199613", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Skill of diplomats is to identify openings to peace in Ukraine — Kremlin spokesman", "title_en": "Skill of diplomats is to identify openings to peace in Ukraine — Kremlin spokesman", "summary_ja": "Earlier, Russian President Vladimir Putin said that Russia would like the conflict in Ukraine to be ended as quickly as possible through the process of peaceful settlement", "summary_en": "Earlier, Russian President Vladimir Putin said that Russia would like the conflict in Ukraine to be ended as quickly as possible through the process of peaceful settlement", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2199611", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "MAGA’s Self-Destructive Culture War", "title_en": "MAGA’s Self-Destructive Culture War", "summary_ja": "Polls suggest that MAGA fanaticism might not be playing so well outside US President Donald Trump’s loyal base. But if the Democrats want to retake one or both chambers of Congress, they should concentrate on the economy and not answer Republican extremism with a culture war of their own.", "summary_en": "Polls suggest that MAGA fanaticism might not be playing so well outside US President Donald Trump’s loyal base. But if the Democrats want to retake one or both chambers of Congress, they should concentrate on the economy and not answer Republican extremism with a culture war of their own.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/democrats-must-not-engage-in-maga-culture-war-to-win-midterms-by-ian-buruma-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "MAGA’s Self-Destructive Culture War\nPolls suggest that MAGA fanaticism might not be playing so well outside US President Donald Trump’s loyal base. But if the Democrats want to retake one or both chambers of Congress, they should concentrate on the economy and not answer Republican extremism with a culture war of their own.\nNEW YORK—There are many reasons why then-US Vice President and Democratic nominee Kamala Harris lost the US presidential election to Donald Trump two years ago. Her campaign started too late. She inherited a great deal of anger against US President Joe Biden. And Trump is a gifted demagogue, who knows how to exploit fear-driven rage and hostility.", "translation_ja": "", "vocab": [{"word": "fanaticism", "definition": "狂信的な信仰や支持のこと。理性的な判断を失い、特定の人物や思想に盲目的に従う状態を指す。"}, {"word": "demagogue", "definition": "大衆の感情や恐怖心をあおって、自分の利益のために支配しようとする政治家のこと。扇動政治家。"}, {"word": "exploit", "definition": "弱点や機会を巧妙に利用すること。政治文脈では、人々の感情や不安を政治的に利用することを意味する。"}, {"word": "hostility", "definition": "敵意や攻撃的な感情のこと。個人間や集団間の対立や不友好な関係を表す。"}, {"word": "inherit", "definition": "前任者や前の状況から受け継ぐこと。ここではマイナスの状況や問題を引き継ぐという意味で使われている。"}]}, {"title_ja": "How to Break the German Malaise", "title_en": "How to Break the German Malaise", "summary_ja": "For too long, Germany’s political and corporate elite coasted on the country’s postwar economic and political success story, avoiding difficult but necessary reforms that could have kept extremist populist parties at bay. Now that the barbarians are at the gates, mainstream elites must rethink every", "summary_en": "For too long, Germany’s political and corporate elite coasted on the country’s postwar economic and political success story, avoiding difficult but necessary reforms that could have kept extremist populist parties at bay. Now that the barbarians are at the gates, mainstream elites must rethink every", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/german-malaise-legacy-of-economic-social-political-complacency-and-inertia-by-helmut-k-anheier-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "How to Break the German Malaise\nFor too long, Germany’s political and corporate elite coasted on the country’s postwar economic and political success story, avoiding difficult but necessary reforms that could have kept extremist populist parties at bay. Now that the barbarians are at the gates, mainstream elites must rethink everything.\nBERLIN—Not so long ago, Germany seemed like it could do no wrong, thanks to its strong economy, excellent infrastructure, and stable political system. Yet now it seems as though Germany can do nothing right. With a sluggish economy and crumbling infrastructure, it is falling behind technologically and succumbing to extremist political parties.", "translation_ja": "", "vocab": [{"word": "malaise", "definition": "社会や経済における漠然とした不安感や停滞感のこと。特定の病気ではなく、全体的な不調や違和感を指す。"}, {"word": "coasted", "definition": "努力をせずに惰性で進むこと。過去の成功に頼って新しい工夫や改革をしないまま進み続ける状態を表す。"}, {"word": "succumbing", "definition": "抵抗できずに何かの影響に屈することや、病気などに侵されること。ここでは極端な政党の台頭に抗いきれず支配されていく様子を示している。"}, {"word": "crumbling", "definition": "徐々に崩壊・衰退していくこと。物理的または抽象的に、システムや構造が少しずつ弱くなる過程を表す。"}, {"word": "sluggish", "definition": "活動や反応が遅く、鈍い状態。経済成長が停滞していて活力がない様子を表現する際に用いられる。"}]}, {"title_ja": "Europe’s Place in the Global Redivision of Labor", "title_en": "Europe’s Place in the Global Redivision of Labor", "summary_ja": "While the US continues to lead in software, some high-tech sectors, and hydrocarbons, China is becoming increasingly competitive in many high-tech, capital-intensive sectors, not least those once dominated by Europe. The EU does have a relative advantage in this new economic order, if only its leade", "summary_en": "While the US continues to lead in software, some high-tech sectors, and hydrocarbons, China is becoming increasingly competitive in many high-tech, capital-intensive sectors, not least those once dominated by Europe. The EU does have a relative advantage in this new economic order, if only its leade", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/eu-relative-advantage-in-specialized-sectors-like-chip-making-machinery-by-daniel-gros-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Europe’s Place in the Global Redivision of Labor\nWhile the US continues to lead in software, some high-tech sectors, and hydrocarbons, China is becoming increasingly competitive in many high-tech, capital-intensive sectors, not least those once dominated by Europe. The EU does have a relative advantage in this new economic order, if only its leaders would recognize it.\nMILAN—The world’s three largest continent-sized economies are moving in different directions. Each has its own strengths and weaknesses, though the balance appears to be more favorable in the United States and China than in Europe.", "translation_ja": "", "vocab": [{"word": "redivision", "definition": "既存の分割を再度分割し直すことを意味する。特に経済や地政学的な領域における権力や資源の再配分を指す。"}, {"word": "hydrocarbons", "definition": "炭素と水素から構成される化合物の総称。石油やガスなどのエネルギー資源として経済で重要な役割を果たす。"}, {"word": "capital-intensive", "definition": "生産に多くの資本投資が必要な産業や事業を指す。自動車製造や半導体産業などが典型例である。"}, {"word": "competitive advantage", "definition": "企業や国が競争相手より優れた条件や能力を持つ状態。市場での成功に不可欠な要素である。"}, {"word": "economic order", "definition": "世界経済の構造や階層システム。国々の経済的地位や相互関係を定義する国際的な経済体制を意味する。"}]}, {"title_ja": "With no Pulisic and good results, have the USMNT moved on from their savior complex? | Leander Schaerlaeckens", "title_en": "With no Pulisic and good results, have the USMNT moved on from their savior complex? | Leander Schaerlaeckens", "summary_ja": "The US have been defined for so long by the next singular player. This past perfect window shows that era may be over Sign up for our free newsletter here In 1990, then-United States men’s national team manager Bob Gansler made a critical and somewhat controversial choice. He left three of the progr", "summary_en": "The US have been defined for so long by the next singular player. This past perfect window shows that era may be over Sign up for our free newsletter here In 1990, then-United States men’s national team manager Bob Gansler made a critical and somewhat controversial choice. He left three of the progr", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/football/2026/oct/08/usmnt-christian-pulisic-youth-movement-mauricio-pochettino", "state_media": false, "category": "オピニオン", "full_text": "In 1990, then-United States men’s national team manager Bob Gansler made a critical and somewhat controversial choice. He left three of the program’s laureled veterans at home and brought a young and little-tested team to the World Cup in Italy, the USA’s first in 40 years.\nAs Gansler recalled later: “I was thinking not only for ’90, but I was thinking about the 90s.”\nIn 1998, Steve Sampson was looking to the future as well. He had lucked into the USMNT’s managerial gig and had barely clung on to it going into that year’s World Cup, but he nevertheless made a confident proclamation. “In 10 to 15 years, we’ll win the title, there’s no doubt about it,” he told the Washington Post. “When we Americans decide to do something, we’ll see it through.”\nA sense took hold sometime during that period, while never really acknowledged or said out loud, that the USMNT were the team of the future.\nThey never really stopped being that. And this bullishness on the hazily outlined not-right-now-but-definitely-sometime-later-on tended to coalesce around one player, maybe two. The USMNT made their modern World Cup breakthrough powered by the energy and unfettered talent of 20-year-olds Landon Donovan and DaMarcus Beasley in 2002. When those two foundered at the 2006 World Cup, another young player, Clint Dempsey, emerged. That year, a 16-year-old Freddy Adu made his USMNT debut.\nAnd so a pattern formed: the US soccer community waited to be lifted to the next plane by a savior. The next kid. Or maybe the one after that. He’ll do it for us. Or else the next one will.\nDempsey outlasted Donovan and faded just as Christian Pulisic emerged. Because even as a golden-ish generation coalesced around him, Pulisic was seen as the player expected to make something happen at the 2026 World Cup, the culmination of an eight-year project of rebuilding the national team. He was expected to activate Hero Mode, the way he briefly had in Qatar in 2022, throwing himself in front of a cross at the expense of a pelvic contusion but bundling the make-or-break winner into the Iranian goal.\nHe never did it in 2026. Aside from a great first half in the tournament opener, Pulisic’s home World Cup was a bust, and the USMNT’s campaign ended with a whimper.\nOn its face, it felt odd that Mauricio Pochettino should launch a youth movement in the first camp after the World Cup. The core of his team had hardly aged out; all but defender Tim Ream are comfortably on the right side of 30. All the same, he called in 13 debutants and eight teenagers.\nIf results in the months after a World Cup count for anything at all, they have vindicated the Argentinian’s decision to freshen things up. The kids, sprinkled in among a robust base of veterans, reeled off 4-1 and 4-2 victories over Peru and Chile, respectively, before dispatching Mexico in a merciless 3-0 walloping. On Tuesday, they concluded this jumbo-sized international window with a mature 1-0 win over Canada in a scruffy, scrappy game, vanquishing a team whose fierceness and physicality had given the US a great deal of trouble in the recent past.\nWhat was startling, however, wasn’t just how much young talent is waiting down the depth chart – or now, perhaps, very much on the surface of it – but how little Pulisic, the latest savior, was missed in his absence. You easily might have forgotten that he wasn’t even there while watching a composed and polished team reel off four straight wins. The same was true for Weston McKennie, one of the USMNT’s load-bearing players for the last half decade. They both stayed with their Italian clubs, either hoping to use the time off to get back in favor with their manager (Pulisic at Milan) or to heal up an injury (McKennie at Juventus).\nIn their absence, so many players carried the load, contributing in ways big and small, taking turns coming up with the big play, that the burden was never on any one player. Cavan Sullivan may well be next in line in the succession of the USMNT’s star players – or maybe it will be Julian Hall, or Adri Mehmeti, or Zavier Gozo, or Justin Ellis, or Mathis Albert – but there was no intimation that this was his ship to propel under his own power. This was not Sullivan’s team now, as then-manager Bruce Arena told Pulisic after the US failed to reach the 2018 World Cup in Russia.\nThe big takeaway from this mega-pack of an international break – which encompassed more games than the USMNT’s run at several big tournaments – is that this team may, at long last, no longer be so dependent on one player, or even a small handful of them.\nIf this program is entering into a post-savior age – moving on from Pulisic-pendencia, as it were, or whoever-pendencia – that’s a clearer sign of progress than the emergence of some new prodigy, or indeed a cluster of them.\nWhat this team, and this soccer country writ large, appear to have grown instead, is the kind of depth US fans used to envy in other, more developed soccer nations. If at the 2030 World Cup, the US TV comme", "translation_ja": "", "vocab": [{"word": "laureled", "definition": "栄誉や賞で装飾された、実績のある。ここでは経験豊かで実績のあるベテラン選手を指す。"}, {"word": "bullishness", "definition": "強気な見方や楽観的な態度。金融用語としても使われるが、ここではポジティブで確信に満ちた姿勢を意味する。"}, {"word": "coalesce", "definition": "バラバラのものが集まって一つにまとまる、団結する。ここでは複数の要素が統合され一つの傾向になることを表す。"}, {"word": "unfettered", "definition": "束縛されない、自由な。才能や能力が制限なく発揮される状態を表す。"}, {"word": "culmination", "definition": "頂点、最高潮、最終段階。長期間の計画や過程が最終的に到達する時点を指す。"}]}, {"title_ja": "I’m the attorney general of Washington state. Here’s how we’re protecting the midterm elections | Nick Brown", "title_en": "I’m the attorney general of Washington state. Here’s how we’re protecting the midterm elections | Nick Brown", "summary_ja": "A coalition of Democratic attorneys general is working to make sure voters across the spectrum have their voices heard Elections have consequences. So do the Trump administration’s exhaustive efforts to undermine them. Voters will be confident in their choices, but less certain whose voice will coun", "summary_en": "A coalition of Democratic attorneys general is working to make sure voters across the spectrum have their voices heard Elections have consequences. So do the Trump administration’s exhaustive efforts to undermine them. Voters will be confident in their choices, but less certain whose voice will coun", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/08/washington-state-midterm-elections", "state_media": false, "category": "オピニオン", "full_text": "Elections have consequences. So do the Trump administration’s exhaustive efforts to undermine them.\nVoters will be confident in their choices, but less certain whose voice will count in the face of myriad intrusions by the executive branch. A coalition of Democratic attorneys general are working to make sure voters across the political spectrum have their say.\nLed by the attorneys general of Washington, California, Massachusetts and Nevada, 24 states sued to block President Donald Trump’s US Postal Service plot to interfere with voting by mail. Last month, the supreme court upheld our lower court victories and blocked the administration’s unconstitutional power grab, at least for this election.\nThe law says states decide who receives a mail ballot. The USPS has never had the final say and, according to the American Postal Workers Union, until this year had never in its 250-year history tried to put such arbitrary restrictions on what mail it will deliver.\nThe case we brought was an important victory in every state, and particularly Washington, where more than 99% of voters cast their ballot by mail. States such as Colorado, Hawaii and Oregon have similarly high mail voting rates. But mail voting is not confined to blue states; it is widely used in red states as well, particularly those like Nebraska and the Dakotas, with large rural populations. It’s also the president’s preferred way to cast his own ballot.\nThe case of the postal service is just part of the multi-pronged federal attack states are pushing back against. The administration has abandoned the federal government’s traditional role of supporting election security and defending voting rights, work I participated in first-hand as a US attorney.\nRecall, in 2020, Trump’s own administration – and particularly the Cybersecurity and Infrastructure Security Agency – worked to protect the vote and defend the election. Then, efforts to misuse the Department of Justice were thwarted, and Trump relied on insurrectionists to do his bidding. In return for serving honorably, many public servants were sent packing upon Trump’s return to office, and the convicted insurrectionists were pardoned.\nNow we have a US solicitor general who described the postal service’s attempt to deprive the rights of millions of eligible voters as only a “modest” use of federal authority.\nThe Trump administration is not known for its discretion or consistency. While the administration was in court purportedly concerned about election integrity, the president publicly demanded his supporters “cheat like hell” in midterm voting. I don’t think Republican voters want that any more than Democrats do.\nWe don’t doubt the administration will continue its lawless blitz against voters. Democratic state attorneys general are prepared, and have undertaken the largest multi-state effort to protect the vote in modern American history.\nRecent rulings keep state elections on track and show the law is on our side. If Trump attempts to intimidate or discourage eligible voters, or to obstruct the counting of votes or certification of the election, Democratic state attorneys general will take swift action. States have decades of experience countering these threats when lodged by private actors, and they are just as illegal when attempted by the federal government.\nVoters can do their part by exercising the right to elect their representatives. The president’s scheming benefits from public doubt and uncertainty. Democracy depends on the participation of its citizens, and every eligible voter should have the opportunity to render a verdict on their elected representatives.\nThat verdict is unlikely to favor President Trump, who ran on lowering costs, preserving peace, and economic stability, but instead delivered higher prices, hollowed out critical public services, engaged in unprecedented self-dealing, and began a globally destabilizing war with no end in sight.\nPresidents don’t decide elections. State attorneys general and the millions of eligible voters we represent will exercise our constitutional powers to help keep it that way.\n- Nick Brown is the attorney general of the state of Washington", "translation_ja": "", "vocab": [{"word": "exhaustive", "definition": "徹底的な、完全な。あらゆる側面を網羅する努力や調査を指す。ビジネスシーンで「包括的な調査」や「詳細な分析」を表現する際に使用される。"}, {"word": "myriad", "definition": "非常に多くの、無数の。「多くの問題」や「さまざまな課題」をより洗練された表現で示す。フォーマルな文書や学術的な文脈でよく用いられる。"}, {"word": "unconstitutional", "definition": "憲法違反の、違憲の。法律や政府の行為が憲法に反していることを示す法律用語。政治や法的な議論で頻出する。"}, {"word": "arbitrary", "definition": "恣意的な、根拠のない。合理的な理由がなく、個人の判断や気まぐれで決定されることを示す。ビジネスで不公正な決定を批判する際に使用される。"}, {"word": "multi-pronged", "definition": "多面的な、複数の方向からの。「多角的なアプローチ」や「複合的な戦略」を示す表現。ビジネス戦略や複雑な問題の対応を説明する際に活用される。"}]}, {"title_ja": "Trump’s latest attacks on the press exude desperation | Margaret Sullivan", "title_en": "Trump’s latest attacks on the press exude desperation | Margaret Sullivan", "summary_ja": "Trump seems to invent ugly new variations on his press-bashing theme almost every day When you hate the mainstream press as much as Donald Trump does, nothing gets in the way of the punishment fantasy. Not court rulings. Not public opinion. Not even the dreadful consequence of less media coverage. M", "summary_en": "Trump seems to invent ugly new variations on his press-bashing theme almost every day When you hate the mainstream press as much as Donald Trump does, nothing gets in the way of the punishment fantasy. Not court rulings. Not public opinion. Not even the dreadful consequence of less media coverage. M", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/08/trump-press-attacks-politico", "state_media": false, "category": "オピニオン", "full_text": "When you hate the mainstream press as much as Donald Trump does, nothing gets in the way of the punishment fantasy.\nNot court rulings. Not public opinion. Not even the dreadful consequence of less media coverage.\nAnd certainly not any awareness of how the first amendment is supposed to function in American democracy.\nThis week, his revenge tour took yet another turn.\nHe barred one of his most disfavored media organizations – Politico – from boarding Air Force One, where it was supposed to provide “pool coverage” to the rest of the press corps as Trump traveled to Nebraska for a campaign stop on Monday afternoon.\nThat move was met with a strong show of solidarity by several media outlets, who decided not to fill the Politico spot.\nAnd the White House was defiantly delusional, claiming that Trump will “continue to grant an unprecedented level of access to the press”.\nThis latest chapter came with the usual blast of venom at the mainstream media, though not specifically aimed at Politico.\n“The New York Times and many other Artificial Media Outlets should be arrested for their dishonesty and disservice to our Country,” he posted on Truth Social.\nThe episode follows Trump’s effort in mid-September to ban Politico, CNN and MS Now from the White House. Those organizations quickly sued, charging that Trump’s action was unconstitutional.\nTrump-appointed judge Timothy Kelly came down on the side of the media, issuing a temporary restraining order that ordered the White House to reinstate the press badges that had been taken away.\nAnd since then, CNN has been kept off Air Force One repeatedly, using the rationale that access to the White House is one thing, but access to the president’s plane is another.\n“The law is absolutely clear,” Ted Boutrous, the first amendment lawyer who is representing the three news organizations said in a statement. “The harm to our clients, the first amendment and the public as a whole is profound.”\nThe Trump administration’s position is that traveling with the president is a privilege not a right.\nThe fight is not over, since Kelly will conduct a hearing later this week over the media outlets’ request for a preliminary injunction – a stopgap measure to protect press access in advance of a possible trial.\nTrump, of course, has been picking fights with individual journalists and entire news outlets for years. At this very moment, there are court fights involving the Associated Press, the Wall Street Journal, the New York Times and Disney, which owns ABC News and a number of local ABC affiliates.\nSo far, there’s been a rare display of support among news organizations that are normally each other’s competition. Columbia Journalism Review called it “a striking and heartening show of solidarity from the White House Press Corps”.\nWhen the three outlets were kicked out of the White House last month, the other networks in the press pool decided not to replace CNN in the rotation, thus suspending coverage for a time.\nPeter Baker of the New York Times noted that for the first time in his 30 years covering the White House, “the president will not have a network TV camera covering his everyday official actions and travels”.\nWhat’s more, about 50 media organizations backed up the lawsuit by the three who had been singled out by filing an amicus brief.\nIt’s hard to understand exactly how less coverage and this constant squabbling benefits Trump, but apparently, he is making a different calculation.\nHis anti-press actions get a lot of attention, which is the very oxygen he requires to breathe. It doesn’t matter that much of the attention is negative.\nMeanwhile, he has entered a phase of saying and doing ever more outrageous things, like his statement this week at a rally that his war in Iran was necessary to protect the world. Trump appeared to suggest that Iran could “take out” Los Angeles and San Diego if it develops a nuclear weapon which prompted California’s Democratic governor, Gavin Newsom, to call the president “deranged and dangerous”.\nTrump exudes a sense of desperation these days, with the midterm elections only weeks away and his approval ratings underwater.\nHis war against the press is something of a reflex for him – it’s what comes naturally, especially when he doesn’t like the shape of reality.\nThe press corps’ newfound solidarity is encouraging. It’s been a long time coming from a group that, in the past, has responded to this president’s constant abuse with deference and dinner invitations.\nTrump seems to invent ugly new variations on his press-bashing theme almost every day.\nStanding together will be a necessity in the weeks and months ahead.\n- Margaret Sullivan is a Guardian US columnist writing on media, politics and culture", "translation_ja": "", "vocab": [{"word": "disfavored", "definition": "好意的でない、不利な扱いを受けている。特定の対象に対して否定的な態度や扱いが向けられている状態を表す。"}, {"word": "pool coverage", "definition": "複数のメディアが共同で取材し、その情報を全社で共有する報道体制。特に大統領など重要人物の移動時に採用される。"}, {"word": "defiantly delusional", "definition": "挑戦的に、かつ現実から目を背けた状態。事実に反する主張を堂々と述べる態度を指す。"}, {"word": "preliminary injunction", "definition": "本裁判前に発せられる仮差止命令。差し迫った危害から保護するため、速やかに発令される暫定的な司法命令。"}, {"word": "restraining order", "definition": "裁判所が発する差止命令。特定の行動を禁止し、権利侵害から被害者を保護するための法的措置。"}]}, {"title_ja": "The End of Gaza", "title_en": "The End of Gaza", "summary_ja": "A failing peace process leads to only one outcome.", "summary_en": "A failing peace process leads to only one outcome.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/palestinian-territories/end-gaza", "state_media": false, "category": "オピニオン", "full_text": "A year after the Trump administration negotiated an agreement to end the war in Gaza, Palestinians are still waiting for the “day after” to arrive. The October 2025 cease-fire plan freed the last remaining Israeli hostages and ostensibly ended hostilities, but Israel continues to constantly strike targets in Gaza, often killing civilians, including some 300 children in the past year. The deal also envisioned a phased political process that would help reconstruct the devastated territory. Jared Kushner, U.S. President Donald Trump’s son-in-law and the point person for the Middle East, promised in January this year that restoration of core services and infrastructure—including water and sewage systems, electricity networks, hospitals, and bakeries—would begin within 100 days. And yet, nine months later, Gaza has seen no reconstruction, no restoration of basic services, or even an end to daily violence. Instead, the vast majority of its inhabitants remain packed into squalid and sprawling tent cities along a tiny—and ever-shrinking—strip of coastline, plagued by disease and rodent infestations, enduring extreme shortages of food, medicine, clean water, and access to basic sanitation.\nGazans may not be in the grip of famine as they were in prior years, but the humanitarian situation remains catastrophic—and it is not sustainable. The intolerable conditions could very well lead to a further explosion of violence. They are also enabling the endgame that many Israeli leaders want: the eventual eviction of Gaza’s over two million Palestinian residents.\nIndeed, the status quo seems to suit the Israeli leadership. In a recent interview, Nikolay Mladenov, the Bulgarian diplomat serving as the high representative of Trump’s Board of Peace, which is overseeing the Gaza peace plan, revealed where the main obstacle to progress lies. On Israel’s commitments, Mladenov gently noted, is “where we are little bit stuck right now.” Kushner has also blamed Israel’s “crazy elections” later this month, which he says have made the Netanyahu government “a little irrational” in regard to Gaza.\nAlthough electoral considerations are undoubtedly a factor—Israeli Prime Minister Benjamin Netanyahu is locked in a tight and, for him, existential reelection campaign—the totality of Israeli words and actions point to something deeper and more alarming: ultimately, the Netanyahu government’s strategy has less to do with stabilizing Gaza or even disarming Hamas than with rendering the territory uninhabitable and ejecting its population.\nWhether or not the Trump administration shares this goal, its extraordinary deference to Netanyahu’s far-right government and general indifference to the plight of Palestinians is facilitating just such an outcome. Unless the United States and its allies and partners are prepared to force Israel to abide by its commitments, it may only be a matter of time before Gaza is lost forever.\nHELL ON EARTH\nIt is hard to overstate the scale of death, destruction, and suffering inflicted on Gaza and its roughly 2.2 million inhabitants over the past three years. In the wake of Hamas’s October 7, 2023, terrorist attack on Israel, Israeli military and political leaders vowed to “flatten” Gaza and turn it into a “city of tents,” promising that “Gaza will never go back to what it was.” They have delivered on those threats. The 223,000 tons of explosives dropped on Gaza—roughly equivalent to 15 times the power of the atomic bomb dropped on Hiroshima—have killed more than 74,000 Palestinians, the vast majority of them civilians, and reduced most of Gaza to rubble. Israel’s assault, over which it is currently on trial for genocide at the International Court of Justice, has wiped out some 92 percent of Gaza’s housing stock, 95 percent of its farmland, all 12 of its universities, and nearly half of its 36 hospitals—in other words, the very institutions and infrastructure that sustain life.\nAfter such devastation, last year’s cease-fire came as an undoubted relief. Under the first phase of Trump’s Gaza plan, the parties agreed to an immediate end to all military attacks, the exchange of hostages and prisoners, the restoration of basic services, and a massive surge in humanitarian aid. Apart from Hamas’s release of Israeli hostages, however, most of these commitments have been only partially fulfilled. Phase two, formally launched in January even though Israel had yet to meet its phase one obligations, envisioned the stabilization of Gaza through the deployment of an international force and the establishment of a Palestinian technocratic governing body, known as the National Committee for the Administration of Gaza, coupled with the gradual disarmament of Hamas and the phased withdrawal of Israeli forces. Those last steps together serve as prerequisites for the long-term reconstruction of the Gaza Strip as laid out in phase three.\nA full year after the cease-fire was announced, Israel continues to block the entry of Palestinian governi", "translation_ja": "", "vocab": [{"word": "ostensibly", "definition": "表面上は、見かけ上は。実際にはそうでない可能性があることを暗示しながら、公式には～という意味で使われる。"}, {"word": "phased", "definition": "段階的な、複数の段階に分けられた。時間をかけて段階的に進行することを指す。"}, {"word": "squalid", "definition": "不潔な、みすぼらしい、劣悪な環境。衛生状態が非常に悪く、貧困や汚さが特徴的な状態を描写する。"}, {"word": "endgame", "definition": "終盤、最終段階。ゲーム理論や戦略の文脈で、一連の動きや計画の最終的な目標や結果を意味する。"}, {"word": "irrational", "definition": "不合理な、非論理的な。感情的または論理的根拠なしに行動することを指す。"}]}, {"title_ja": "The Case for Economic Espionage", "title_en": "The Case for Economic Espionage", "summary_ja": "America should spy on foreign companies to help its own.", "summary_en": "America should spy on foreign companies to help its own.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/case-economic-espionage-david-cohen", "state_media": false, "category": "オピニオン", "full_text": "For decades, both adversaries and allies of Washington have spied on American companies to gain insights into innovation in the United States. During the Cold War, KGB spies routinely sought to steal trade secrets from U.S. industries. In the 1980s, French intelligence stalked American technology firms. In recent years, China has been especially aggressive on this front. The Center for Strategic and International Studies recorded 224 incidents of Chinese-sponsored espionage against the United States that occurred between 2000 and 2023, of which more than half targeted commercial technologies. Invariably, the goal of this kind of espionage is to help key sectors in the spying country rapidly replicate or surpass American advances. As the former National Security Agency director Keith Alexander memorably put it, cybertheft of U.S. technologies amounts to “the greatest transfer of wealth in history.”\nYet amid this brazen robbery, the U.S. intelligence community has long maintained a policy against spying on foreign companies to provide a commercial advantage to U.S. businesses. That self-imposed ban on economic espionage was reaffirmed repeatedly throughout the Cold War and in the decades since, including by President Barack Obama, who codified it in 2014 and tried to get China and other countries to follow suit. At the time, this made sense. U.S. economic policy had long forsworn government intervention in the private market, and providing select firms with secret intelligence would unavoidably distort the economy. In any case, through much of the Cold War and early post–Cold War era, most technological innovation important to national security emerged under government auspices rather than in the commercial market. Moreover, its lead in many technologies meant that the United States had much more to lose than to gain by legitimizing commercial spying.\nToday, these rationales no longer hold. To an ever-growing extent, U.S. national security now depends on private-sector innovations. In such disparate areas as artificial intelligence, semiconductors, quantum science, bioengineering, next-generation energy, and space, breakthroughs that are crucial to the country’s power and influence are emanating from private companies. At the same time, even as technological supremacy has become increasingly central to national security, the U.S. lead in many crucial advanced technologies is being contested or even erased by China. By abstaining from economic espionage, the United States has tilted the playing field against itself and magnified the Chinese threat.\nTo right the balance, the United States should allow U.S. intelligence agencies not only to collect commercial secrets from foreign companies but also to deliver that intelligence where it could have the greatest impact: to the firms producing the frontier technologies that will be vital to U.S. national security in the years to come. In September, the Trump administration appeared to take a step in this direction when it disclosed that the CIA and other intelligence agencies had begun to broaden their long-standing espionage efforts against China, including Chinese industry.\nBut a comprehensive strategy requires the United States to formally lift its existing prohibition on economic spying. The government must also establish robust rules and oversight to ensure that commercially valuable intelligence shared with the private sector serves the national interest, preserves competition, and, critically, is not used to advance partisan, political, or personal ambitions. Although economic espionage is not without risk, unilaterally renouncing the practice in the current global environment is far more dangerous.\nPARIS IS LISTENING\nAlthough the United States has generally avoided commercial spying, it is not without precedent in American history. During the founding period, both early states and the newly formed Republic paid bounties to private citizens to encourage the theft of crucial technology from Britain. To Alexander Hamilton, the first secretary of the treasury, obtaining pilfered industrial secrets was a crucial way to spur the country’s economic independence from its former colonial master. But as Hamilton’s economic interventionism gave way to Thomas Jefferson’s laissez-faire approach, the bounty programs faded away.\nThe first modern U.S. debates about economic espionage date to the Cold War. In the early 1970s, when Japanese manufacturers began to pose a threat to the American auto industry, the Nixon administration considered having the government provide intelligence to Detroit automakers to improve their commercial prospects. But the president’s Foreign Intelligence Advisory Board rejected the plan as “inappropriate.” During the Carter administration, Stansfield Turner, the director of the CIA, again broached the idea of economic espionage internally at the agency but also met with strong resistance. As Turner later recounted, CIA officers “did not see help", "translation_ja": "", "vocab": [{"word": "espionage", "definition": "スパイ活動や諜報活動のこと。特に政治的・軍事的・経済的目的で行われる秘密情報の収集活動を指します。"}, {"word": "invariably", "definition": "常に、必ずという意味の副詞。例外なく同じ方法や結果になることを表します。"}, {"word": "codified", "definition": "法律や規則として正式に制定・明文化すること。曖昧なものを明確な形式にすることです。"}, {"word": "forsworn", "definition": "~を放棄する、断念するという意味の過去分詞。誓って避けることや公式に放棄することを表します。"}, {"word": "auspices", "definition": "後援、庇護、支援という意味。通常は「under the auspices of」という表現で、~の支援下で、~の援助のもとでという意味になります。"}]}, {"title_ja": "The Two Africas", "title_en": "The Two Africas", "summary_ja": "Who will benefit from the continent's investment boom?", "summary_en": "Who will benefit from the continent's investment boom?", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/africa/two-africas", "state_media": false, "category": "オピニオン", "full_text": "Last year, U.S. President Donald Trump told a group of African leaders that the United States would be “shifting from aid to trade.” Washington had already begun to close USAID, the world’s biggest development agency, and many U.S. allies followed suit, cutting their own aid programs in Africa.\nAmid the humanitarian cuts, however, international business interest in Africa is growing. The continent possesses huge reserves of the critical minerals the world needs. Foreign investors are eyeing Africa’s young workforce, growing consumer base, and ports located along vital global trade routes. And competition among China, the United States, Europe, India, and the Gulf states is bringing a wider array of investors than ever before. This year, roughly half of the world’s 20 fastest-growing economies are likely to be African.\nYet these gains won’t be distributed evenly across the continent. Many countries are too unstable, underdeveloped, or corrupt to attract foreign capital and will likely stay trapped in stagnation. But the ones that attract sustained outside investment and cultivate their domestic economies could see tremendous growth—and have a chance to follow the industrialization models that turned Singapore, South Korea, and Taiwan into leading markets in the twentieth century. Those African countries that undertake sustained reforms might prosper long enough to provide vast new opportunities for their people and accrue real geopolitical power.\nAFTER AID\nAfrica remains a relatively small player in the global economy. It makes up about 20 percent of the world’s population but accounts for just three percent of GDP and three percent of global trade. Over the past quarter century, foreign direct investment across sub-Saharan Africa has remained relatively flat—around two to three percent as a share of GDP—and most of it has gone to extracting oil, diamonds, and gold and other minerals.\nBut certain countries and regions are growing quickly. Take southern Africa, which has relatively good interstate infrastructure and low barriers to trade, although many nontariff barriers still exist. Twelve countries in southern Africa have a power pool that connects their grids and allows them to buy and sell electricity among one another, leading to greater efficiency and reliability. The region is also home to the world’s oldest running customs union—made up of Botswana, Eswatini, Lesotho, Namibia, and South Africa. The five countries coordinate trade policy, share customs revenue, and implement a common external tariff. Mature freight and logistics networks increasingly connect the mineral belts in the continent’s southern center to ports on both African coasts. These institutions do not fully eliminate the difficulties of doing business across borders, but they allow investors to think in terms of regional rather than merely national markets. Reforms and efforts to connect are paying off in this part of the continent: Botswana and Zambia are set to grow by 4.7 and 4.3 percent this year, respectively.\nFurther north, Nigeria, with its vast entrepreneurial ecosystem and growing interest from investors, gives West Africa huge market scale. Kenya, Tanzania, and Uganda form an increasingly valuable East African commercial core. Some smaller African states are thriving: the island nation of Mauritius has developed into an international financial center. Botswana and Rwanda have attracted investment by providing stable policymaking environments, making up for limited scale.\nThe continent as a whole also has enormous opportunities on its horizon. Favorable demography gives many African countries a potential advantage. As advanced economies grow old in the coming decades, African countries will see much of their population mature into working age. As the demographer Nicholas Eberstadt noted in these pages in 2024, “By 2040, national cohorts of people between the ages of 15 and 49 will decrease more or less everywhere outside sub-Saharan Africa.” Urbanization presents a similar opportunity. According to the Organization for Economic Cooperation and Development, nearly two out of every three Africans will be living in cities by 2050. A richer, more urban African population would attract investment well beyond the extractive industries that have typically dominated foreign capital inflows; Africa’s young population has already made enormous advances in areas such as financial technology and the democratization of financial services.\n Foreign governments are racing to gain access to African harbors.\nAfrica also still has many of the resources that the rest of the world needs. Sub-Saharan Africa is home to 30 percent of the known reserves of critical minerals. China recognized the strategic significance of these resources early and has spent decades building a near monopoly over the critical mineral industry in many parts of Africa. Nearly all sub-Saharan African countries have signed on to Beijing’s Belt and Road Initiative, the bigge", "translation_ja": "", "vocab": [{"word": "humanitarian", "definition": "人道的な、慈善的な。ここでは援助削減が人命や福祉に悪影響を与える文脈で使用されている。"}, {"word": "stagnation", "definition": "停滞、経済成長の低迷。発展途上国が外部投資を獲得できず経済が伸び悩む状態を指す。"}, {"word": "accrue", "definition": "蓄積する、増加する。利益や権力が時間とともに増していく様子を表す。"}, {"word": "extracting", "definition": "抽出する、採掘する。石油やダイヤモンドなど天然資源を地中から取り出すことを意味する。"}, {"word": "nontariff barriers", "definition": "非関税障壁、関税以外の貿易障壁。規制や基準など、商品の流通を制限する障壁のこと。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-09 00:43 JST";
  renderTabs();renderList();
})();
</script>
