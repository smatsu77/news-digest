erbian.\nThe anti-corruption movement campaigned on a manifesto that included purging officials who broke rules cracking down on protesters, stopping party loyalists from leading public enterprises, and freeing the public broadcaster of political control.\nVučić and the SNS party have repeatedly denied corruption.\nVučić, who backed Serbia's candidacy for the European Union while refusing to impose sanctions on Russia over its full-scale invasion of Ukraine, had pledged to increase pensions and public sector salaries, and investment in state healthcare.\nKremlin spokesperson Dmitry Peskov praised Vučić's contribution to relations with Russia and hoped \"the new political force\" in Belgrade would understand that co-operation with Moscow was in Serbia's interests: \"But, as you know, it takes two to tango.\"\nHis defeat was welcomed by Hungary's prime minister, Péter Magyar, who said he was delighted to hear from the Student List's leaders \"how much strength our victory in April had given them\". Magyar's party ended 16 years of Viktor Orbán rule, while Vučić's SNS party had been in power since 2012.\nEuropean Commissioner for Enlargement Marta Kos said \"a new chapter can begin for Serbia. The door to the EU is open, and we are ready to move forward together\".\nEarlier in the day, long queues were seen outside polling stations in cities and towns across Serbia.\nThis was also the case outside booths in a number of countries with sizeable Serbian communities - including Slovenia's capital Ljubljana, Germany's Munich, and Los Angeles and Chicago in the US.\nIn France, Serbian voters waited in line in heavy rain in Paris.\nThe election was held amid high tensions across Serbia, with police sealing off stre", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権がコーメイ前FBI長官の娘を違法に解雇したと判事が判決", "title_en": "Trump administration illegally fired James Comey's daughter, judge rules", "summary_ja": "連邦判事ジェシー・ファーマン氏は、トランプ政権がトランプ批評家である前FBI長官ジェームズ・コーメイの娘であるモリーン・コーメイを違法に解雇したと判決を下しました。判事はコーメイの復職と遡及給与の支払いを命じ、その解雇は米国憲法と適正法手続きの権利に違反していると述べました。司法省は判決に異議を唱え、控訴する予定だと述べています。", "summary_en": "Maurene Comey believes she was let go from her job as a federal prosecutor because her father is the former FBI director.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ck78px6glw3lo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Trump administration illegally fired James Comey's daughter, judge rules\n- Published\nThe US justice department illegally fired Maurene Comey, the daughter of former Federal Bureau of Investigation (FBI) director James Comey, a federal judge has ruled.\nComey, who lost her job as a federal prosecutor in New York in July 2025, sued the government, arguing she was unlawfully fired because of her father, a critic of US President Donald Trump, and because of her perceived political affiliations.\nJudge Jesse Furman ruled on Monday that the Trump administration must reinstate her and that she must be given back pay.\nA spokesperson for the justice department said in a statement that it disagreed with the decision and \"will appeal in due course\".\nIn his ruling, Judge Furman said Comey's dismissal violated the US Constitution as well as her right to a fair legal process.\nHe said the US attorney general can fire federal prosecutors but only \"in a particular manner and only for certain reasons\".\nFurman noted that in Comey's role, \"she was assigned some of the country's highest profile cases and consistently received the highest accolades from supervisors and peers alike\".\nComey has worked on cases against the late sex offender Jeffrey Epstein, his accomplice Ghislaine Maxwell, and hip-hop mogul Sean \"Diddy\" Combs, who was convicted on prostitution-related charges involving his two ex-girlfriends last year.\nFurman ordered that Comey be given back pay from July until December 2025, when she accepted a new job.\nIn a statement, Comey's lawyers said: \"This hard-earned victory belongs to Ms Comey, to all civil servants, and to all fighting for the rule of law.\"\nComey had previously said the only reason she was told about her firing was that it \"came from Washington\".\nA complaint filed by her lawyers in September 2025 stated that they believed Comey had been fired \"solely or substantially because her father is former FBI Director James B Comey, or because of her perceived political affiliation and beliefs, or both\".\nThe justice department said in court filings that the decision was made by former Attorney General Pam Bondi.\nThe Trump administration has twice brought charges against James Comey, including for allegedly lying to Congress, but that case was dismissed by a judge who said the prosecutor who brought the case was unlawfully appointed.\nEarlier this year, the justice department charged Comey with knowingly and wilfully making a threat to take the life of, and to inflict bodily harm, on the president. He has denied any wrongdoing.\nThe case stems from a 2025 Instagram post shared by Comey that contained a photo of seashells on a beach arranged to read \"86 47\".\n\"Eighty-six\" is a slang term for \"get rid of\", and prosecutors allege it encourages violence against Trump.\nRelated topics\n  - Published17 July 2025", "translation_ja": "", "vocab": []}, {"title_ja": "バーナム首相に困難が山積み：予算案発表が迫る", "title_en": "Chris Mason: The Budget is imminent as tricky things pile up for Burnham", "summary_ja": "労働党のアンディ・バーナム首相の政権は100日を迎え、今週は予算案の発表など重要な決定の時期となっている。新財務相ジョン・ヒーリーは生活費支援と経済回復を軸とした予算案を水曜日に発表予定である。バーナム首相はEUとの関係改善やブレグジット協定の見直しについても積極的に議論する姿勢を示している。", "summary_en": "From Brexit debates to North Sea oil, there is plenty getting the cabinet, the Labour Party and the country talking.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c317k85r5lglo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Chris Mason: The Budget is imminent as tricky things pile up for Burnham\n- Published\nThis feels like the week where the rubber hits the road for the prime minister's new government.\nIt is now 100 days since Andy Burnham arrived in Downing Street from Buckingham Palace and began to assemble his cabinet.\nThree months later, Labour MPs are more chipper, the party's poll ratings have notched up and the tone and style of government feels very different from when Sir Keir Starmer was in charge.\nComing next, though, there are a whole series of crunchy decisions and trade offs – economic and political – some of which are inevitable and some of which Burnham has decided to lean into.\nFirst up, the Budget\nYou would be forgiven for only just clocking there is a Budget this week.\nThere are three reasons for this year's feeling like a comparatively low key affair: it is happening a month earlier than a year ago, squeezing the space available for briefings, leaks and speculation. It is considerably smaller in big picture terms – in other words the scale of tax rises – so limiting the noisy talk in advance about who might get clobbered. And the new chancellor John Healey and his team have sought to make a virtue out of not saying very much beforehand.\nBut woe betide suggesting to anyone involved in assembling this Budget that it is a steady-as-she-goes, nothing-to-see-here thing.\nEvery Budget is a big deal, goes the argument run past me by some. They don't all have to be visible from space in the way some recent ones have been – think Kwasi Kwarteng in one direction followed by Jeremy Hunt in the other four years ago, or Rachel Reeves in the last two years.\nCost of living support for some, help for entrepreneurs, more financial clout for mayors in England and an economy now recuperating will be themes for Healey on Wednesday.\nYou will be the judge of this Budget's scale – its value, or the lack of it to you – before long.\nNext, Brexit – and our relationship with the EU\nIn recent years, many but not all politicians have approached the issue of Brexit like you or I might approach an electric fence. Avoid getting too close and, if needs must, climb over it gingerly.\nBurnham has no such reservations: he has repeatedly said in the last few weeks, let's talk about Brexit. He reckons the current deal between the UK and European Union isn't good enough.\nOver the weekend he went further, suggesting he wanted an \"honest discussion\" about freedom of movement. Countries in the EU's single market have to sign up to freedom of movement, which lets people live and work in all the countries that are part of it. Given how big a deal immigration was for many in the EU referendum in 2016, even reopening the question of freedom of movement feels like a big deal.\nOn Monday morning, the prime minister appeared to add more detail, suggesting freedom of movement would only return in the UK having been sanctioned in a referendum.\nLater, though, his team wouldn't repeat that, instead emphasising that Burnham wants to start a broad based conversation – without at this point committing to any possible outcome.\nSome of his MPs felt this was a self-inflicted tangle he could have done without. Others see merit in Burnham's penchant for narrating his thoughts and possible direction publicly, thereby using his position to seek to dominate the political debate.\nWhile the Labour Party's centre of gravity tilts towards a collective instinct that a closer relationship with the EU would be preferable to the status quo, there are differences of emphasis and indeed outright disagreements about how much closer and when would be wise.\n- Healey's Budget needs to sustain the stronger economy through gathering clouds \n  - Published23 hours ago\n- Rosebank: Life on the oil field at the centre of a political storm \n  - Published1 day ago\n- No 10 appears to backtrack on PM's freedom of movement referendum suggestion \n  - Published6 hours ago\nSome Labour MPs representing seats in the north of England and Midlands, which backed Brexit, are privately nervous about anything coming across as too enthusiastic an embrace of Brussels. A nod to that scepticism appeared to come publicly from Home Secretary Shabana Mahmood who noted that a call for an honest discussion is \"not the same as settled policy\".\nShe added: \"The prime minister has also observed that there were very significant issues with freedom of movement when we were within the EU. An honest debate means actually being honest about all of the aspects of that debate and not cherry-picking.\"\nNext month, there will be a UK-EU Summit in Brussels, which was due to happen in the summer but was postponed when Sir Keir Starmer resigned.\nWe can expect both sides to talk up tweaks to the current deal and the government to also, in time, set out options for what the long term relationship might look like.\nOn the detail, there are divisions from the cabinet and down. The key thing will be what the party decides to include or not ", "translation_ja": "", "vocab": []}, {"title_ja": "ヒーリー首相、マーマレードとピクルスの値下げを公約 予算案に「日常の改善策」を盛り込む", "title_en": "Healey vows cheaper marmalade and gherkins in pre-Budget package of 'everyday fixes'", "summary_ja": "ジョン・ヒーリー財務相は、100種類以上の製品の輸入関税を撤廃し、マーマレードやピクルスを含む生活必需品の値下げを実施すると発表した。この施策により、世帯は年間最大21ポンド節約できる見通しだ。また、介護手当の受給資格の段階的廃止や自営業者向けの育児休暇制度の拡充など、日常生活を支援する複数の改革も同時に導入される。", "summary_en": "The chancellor will axe tariffs on some staples as part of plans to give households \"breathing space\".", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6d93gq1xdgno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Healey vows cheaper marmalade and gherkins in pre-Budget package of 'everyday fixes'\n- Published\nJohn Healey will remove import taxes on marmalade, gherkins and more than 100 products in a bid to give families \"breathing space\" with the cost of living at the Budget.\nThe chancellor on Wednesday will promise a fresh series of \"everyday fixes\" to ease the pressure on households.\nThe measures will also include an end to the so-called cliff-edge for those receiving carer's allowance payments and higher tax-free mileage rates being made permanent.\nBut the Conservatives said the offer of \"cheaper gherkins\" was \"an insult to families hammered by Labour's tax rises\".\nAhead of the Budget, the government said it is removing tariffs on more than 100 \"family favourite\" products, while supporting farmers facing higher fertiliser costs and households reliant on heating oil.\nThe government says the changes could save households up to £21 per year when combined with existing tariff suspensions on products including pasta, fruit juice and tuna.\n- Healey's Budget needs to sustain the stronger economy through gathering clouds \n  - Published23 hours ago\nMarmalade, for example, will see a 20% tariff, plus an additional £19 charge per 100kg imported, suspended.\nHealey said the ongoing wars in Iran and Ukraine had \"hit families here at home through higher everyday costs\".\n\"We can't control global events, but we can act where we can make a difference,\" he added.\nOther measures the government announced include:\n- Making permanent a 55p per mile tax-free mileage rate for those driving up to 10,000 miles for work, with the rate rising from 25p per mile to 35p above that\n- Allowing carers to earn more than an existing earnings limit without losing their entire allowance, replacing it with a taper mechanism instead\n- Giving two weeks of paternity pay to self-employed fathers, who have previously missed out on payments of up to £194 a week for the period\n- And rolling out hundreds of additional Post Office drop boxes to make sending parcels easier\nPrime Minister Andy Burnham said: \"We are taking on the big challenges facing the country. But that doesn't mean losing sight of the everyday problems that cost people money or simply aren't fair.\n\"If you're a nurse driving for work, a parent spending those precious first weeks with your new baby, or an unpaid carer picking up an extra shift, these changes will make life a little easier and put more money back in your pocket.\"\nBut the Conservatives said Burnham's \"everyday fixes\" have already been wiped out by higher borrowing costs, taxes and inflation.\nShadow Chancellor Andrew Griffith said: \"Shoppers face rising costs at the till and families are struggling to make ends meet, but Burnham's plan is cheaper gherkins. This is an insult to families hammered by Labour's tax rises.\"", "translation_ja": "", "vocab": []}, {"title_ja": "学生ヘンリー・ノワク殺害事件の独立調査を発表", "title_en": "Independent review announced into murder of student Henry Nowak", "summary_ja": "英国内務大臣シャバナ・マハムード氏は、昨年12月にサウサンプトンで刺殺された18歳の学生ヘンリー・ノワク氏の殺害事件に関する独立調査を発表しました。調査は前法務長官アレックス・チョーク氏が主導し、警察や保健サービス、教育機関など複数の機関における事件前後の対応と、見落とされた介入機会の有無を調査します。ノワク家は本調査発表を歓迎し、完全な真実解明と説明責任の実現に期待を示しています。", "summary_en": "\"We must get to truth of what happened before, during and after that awful night,\" the home secretary says while announcing the review.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cv70pnw784x7o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Independent review announced into murder of student Henry Nowak\n- Published\nHome Secretary Shabana Mahmood has announced an independent review into the murder of Henry Nowak.\nThe 18-year-old student was fatally stabbed in Southampton in December by Vickrum Digwa, who falsely claimed he had been racially abused and had acted in self-defence. Digwa was jailed for life on 1 June, with a minimum term of 21 years.\nFollowing the teenager's murder, police bodycam footage of him being handcuffed as he lay dying led to intense scrutiny of the Hampshire and Isle of Wight Constabulary and sparked wider debates around knife laws, race, policing and public trust.\nThe review, which was welcomed by Nowak's family, will be led by former Justice Secretary Alex Chalk KC.\n\"We must get to truth of what happened before, during and after that awful night and we must do everything in our power to ensure that no family suffers the same fate,\" Mahmood told the House of Commons on Monday.\nMahmood said the review will investigate what was known about Nowak's killer and if there were missed opportunities to intervene as well as the treatment of his family in the justice system and whether they received enough support.\nIn a statement published on Monday, the Home Office said the review will be carried out in two parts.\nPhase one will cover the police, health services, local authorities educational institutions and faith organisations, including if any concerns were raised relating to weapon possession and violent behavior, the statement said.\nIt will also look to determine if there were missed opportunities to prevent Nowak's murder.\nPhase two will follow after the Independent Office for Police Conduct (IOPC) has concluded its investigation into the actions of police officers who attended the scene.\nIt will consider the actions of the IOPC and \"if necessary\" the police, the Home Office added.\nThe IOPC launched its own investigation into the response on the night of Nowak's death after bodycam footage showed the 18-year-old was handcuffed and left dying on the floor despite informing officers of his injuries.\nThe investigation was launched despite a sentencing judge ruling Nowak would not have survived his injuries, however quickly he received treatment.\nThe Nowak family described the announcement as a \"significant moment in our fight for justice.\"\n\"We hope this review, alongside the ongoing investigations and inquest, will finally uncover the full truth and deliver the accountability and meaningful change we have fought so hard for,\" they added in a statement.\n\"Our experience of the criminal justice system has been deeply disappointing, and we are determined that no other family should have to endure what we have.\"\nConservative leader Kemi Badenoch welcomed the decision to launch the review.\n\"There must be proper accountability for those who failed Henry and his family,\" she said.\nThe review is due to report in five months.\nNowak, from Chafford Hundred in Essex, was a first-year accountancy and finance student at the University of Southampton when he was murdered.\nOn the night of Nowak's muder, it was Digwa's brother who called 999, claiming Vickrum had been attacked \"racially\".\nBodycam footage released by Hampshire and Isle of Wight Constabulary, with the permission of Nowak's family, showed officers speaking to Digwa and others while Nowak lay on the ground.\nNowak could be heard repeatedly saying that he had been stabbed and could not breathe.\nViolent disorder broke out in Southampton in the days following the release of the footage.\nAfter Digwa's sentencing, Nowak's father Mark called for a \"full, fearless and transparent\" investigation into the police response.\nBut he also urged people not to use his son's death to \"create further division, hatred or tension\".", "translation_ja": "", "vocab": []}, {"title_ja": "イングランド代表FWハリー・ケイン、バロンドール受賞 イングランド選手として25年ぶり", "title_en": "England and Bayern Munich striker Harry Kane wins Ballon d'Or", "summary_ja": "バイエルン・ミュンヘンのストライカー、ハリー・ケイン（33歳）が男性部門のバロンドールを初受賞し、2001年のマイケル・オーウェン以来、イングランド選手として初の栄誉となった。ケインは昨シーズン73試合で73得点を記録し、バイエルンのリーグカップ二冠に貢献し、イングランドをワールドカップ準決勝に導いた。", "summary_en": "The England captain ends his country's 25-year wait for the prestigious award after scoring 73 goals for club and country last season, beating competition from Lamine Yamal and Kylian Mbappe.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/england-and-bayern-munich-striker-harry-kane-wins-ballon-d-or/a-79771067?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Harry Kane: Bayern Munich striker wins Ballon d'Or\nOctober 27, 2026\nEngland captain Harry Kane won the men's Ballon d'Or for the first time on Monday, becoming the first English player to receive the prestigious football award since 2001.\nThe 33-year-old Bayern Munich striker was honored at a ceremony at the London Palladium after scoring 73 goals in 65 appearances for club and country last season.\nThe Ballon d'Or, awarded by French magazine France Football, is one of football's most prestigious individual honors, recognizing the world's best players.\nThe last English player to win the award was former Liverpool striker Michael Owen, who claimed the prize 25 years ago.\nWhy did Harry Kane win the 2026 Ballon d'Or?\nKane's remarkable goalscoring record helped Bayern Munich secure a German league and cup double last season.\nThe former Tottenham Hotspur forward also led England to the World Cup semifinals, the country's best finish since winning the tournament in 1966.\nKane has finished as the Bundesliga's leading scorer for three consecutive seasons. He was also Europe's top club goalscorer during the 2025-26 campaign.\nAt Monday's ceremony, Kane thanked his Bayern Munich teammates for their support.\n\"Without you guys (his Bayern Munich team-mates) and the rest of the team it wouldn't be possible, the way you guys push me, the way we compete. So thank you very much,\" he said.\nKane also paid tribute to his former club Tottenham Hotspur, which he joined at the age of 11, as well as his England teammates and family.\n\"To my wife Kate, my best friend. We've been through ups and downs. You are my biggest support and I felt like you wanted this more than me,\" he said.\nReflecting on his career, Kane encouraged young footballers to pursue their ambitions despite setbacks.\n\"I hope my journey, it wasn't straightforward, I didn't go straight to the top, I had to experience a lot of loan moves and fight my way to get to where I am now. I hope that can give you inspiration.\"\nKane faced strong competition from Barcelona's Spanish teenager Lamine Yamal and Real Madrid's French forward Kylian Mbappe.\nHe joins Stanley Matthews, Bobby Charlton, Kevin Keegan and Owen among the English players to have won the award.\nWho else won at the 2026 Ballon d'Or awards?\nSpain midfielder Alexia Putellas claimed the women's Ballon d'Or for the third time in her career, having previously won the award in 2021 and 2022.\nThe 32-year-old was recognized after a successful season with Barcelona, winning the treble and scoring 21 goals across all competitions.\nPutellas also played a key role in Barcelona's Champions League triumph, contributing seven goals and seven assists during the campaign.\nShe joined English club London City Lionesses in July after spending 14 years at Barcelona.\nHer victory ended a run of three consecutive Ballon d'Or wins by fellow Spaniard Aitana Bonmatí.\nBarcelona's Lamine Yamal won the Kopa Trophy for the best young male player for the third consecutive year, while his teammate Vicky Lopez claimed the women's award for the second year running.\nBarcelona coach Pere Romeu was named women's coach of the year, while Spain manager Luis de la Fuente won the men's coaching award.\nSpain goalkeeper Unai Simon received the men's Yashin Trophy, with Cata Coll winning the women's equivalent.\nBarcelona was named women's club of the year, while Paris Saint-Germain took the men's award.\nEdited by: Wesley Dockery\nIf you rely on our team for trusted reporting, please take a moment to select us as your preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "ヨルダン、シリアの教会攻撃後に「過激派の隠れ家」を空爆", "title_en": "Jordan says its military struck 'militant hideouts' in Syria after deadly church attack", "summary_ja": "ヨルダンは先週のギリシャ正教会での致命的な教会攻撃に関連した容疑者がシリア南部に隠れていることを特定した後、空軍による空爆を実施したと発表した。一方、シリアは調査を開始していると述べており、少なくとも5人の民間人が殺害されたと報告している。また、ヨルダン治安部隊は月曜朝にカラック県で容疑者3名を逮捕し、9人が殺害された教会攻撃事件の捜査を進めている。", "summary_en": "Jordanian armed forces carried out strikes on \"militant hideouts\" in Syria that it said were linked to a deadly church attack on the kingdom last week. Syria gave a different account.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/jordan-says-its-military-struck-militant-hideouts-in-syria-after-deadly-church-attack/a-79760441?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Jordan says its military struck 'militant hideouts' in Syria\nOctober 26, 2026\nJordan said late Monday that its air force has struck military hideouts in southern Syria after determining that suspects linked to last week's deadly church attack were hiding there.\nJordanian forces said the deadly attack on a funeral at a Greek Orthodox church was linked to \"terrorist groups\" hiding in Syria.\nJordan's armed forces said the strikes on southeastern Syria was carried out in coordination with Damascus.\nBut Syria gave a different account, saying it had launched an investigation into the Jordanian attacks.\nA health official told Syria's state news agency that at least five civilians, including women and children, were killed as a result of strikes carried out by Jordan, Reuters reported.\nJordanian security forces arrest 3 men in Karak province\nJordanian security forces earlier on Monday morning arrested three men in connection with last week's deadly terrorist attack at the Hammoud Church that killed nine people and injured 40 others.\nOfficials said the arrests took place following a dawn shootout with the armed men who were discovered hiding in an abandoned house in the Karak governorate, located some 120 kilometers (75 miles) southwest of the capital, Amman.\nAll three suspects were wounded in the operation, but Jordanian security forces reported no casualties.\n\"The security services have fulfilled their duties, resulting in the capture of those who carried out this terrorist act,\" said Jordanian Interior Minister Mazen Al-Faraya in a phone interview with state broadcaster Al-Mamlaka on Monday.\n\"[The suspects] put up fierce resistance but were ultimately subdued and taken into custody, having sustained severe injuries.\"\nHe added that there were \"three individuals involved\" who were \"identified early on in the wake of the terrorist incident\" and that the security services had \"employed all the means at their disposal to apprehend them.\"\nJordan's King Abdullah called for 'iron first' response\nKing Abdullah II of Jordan had ordered authorities to respond with an \"iron fist\" against anyone attempting to undermine the unity of the Jordanian people.\n\"We vowed the terrorists would not escape punishment, and no proponent of dark ideologies that divide Jordanians will be tolerated,\" he added in a statement on Monday, following the arrests, which relatives of the victims had said brought some relief.\n\"Despite the profound and immense tragedy, what happened today has eased our grief — and the grief of the Jordanian people — not just for us, the families of the martyrs,\" one relative, himself a survivor of the attack, told Al-Mamlaka.\nWho carried out the attack in Jordan?\nThere has been no claim of responsibility for Friday's deadly attack and Jordan's Public Security Directorate has not named the suspects or publicly identified possible affiliations with any Islamist militant groups.\nAttacks on Christian minorities are very rare in Jordan, a relatively stable Middle Eastern state which is a close ally of the United States and which maintains diplomatic and military relations with neighboring Israel.\nEdited by: Wesley Rahn and Wesley Dockery", "translation_ja": "", "vocab": []}, {"title_ja": "国連、イスラエルのヨルダン川西岸軍事作戦に警告を発令", "title_en": "UN sounds the alarm over Israel's West Bank military operation", "summary_ja": "国連事務総長と人権高等弁務官は、イスラエルがヨルダン川西岸のヘブロンで実施した軍事作戦を強く批判し、民族浄化の懸念を表明しました。この作戦により3,000人以上のパレスチナ人が立ち退きを命じられ、建物の破壊と住民の移動の自由が奪われたとされています。イスラエル政府はUN報告書を「プロパガンダ」として否定し、自衛権を主張しています。", "summary_en": "The UN has sounded the alarm on Israeli action in the West Bank city of Hebron after hundreds of families were displaced at the weekend. Israel has ordered the military to demolish homes after soldiers were killed there.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/un-sounds-the-alarm-over-israel-s-west-bank-military-operation/a-79770228?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "UN sounds the alarm over Israel's West Bank military operation\nOctober 26, 2026\nThe Israeli military operation in the occupied West Bank city of Hebron was met with sharp criticism from the head of the UN as well as the UN's human rights commissioner in comments made on Monday.\nThe criticism comes after an Israeli military operation was launched in the occupied West Bank in response to a shootout on Friday that left two Israeli soldiers and two Palestinian gunmen dead. Three more Israeli soldiers were also injured.\nIsraeli Prime Minister Benjamin Netanyahu ordered the military to demolish buildings in the West Bank city of Hebron and to close off the West Bank. It came just days before Israel's general election on Tuesday.\nWhat did the UN say about Israeli operation in the West Bank?\nThe United Nations Secretary General Antonio Guterres said on Monday that \"settlements are expanding, evictions are unrelenting with Palestinians driven from their lands,\" in a post on X.\n\"We are seeing an increasingly coercive environment, with the spectre of ethnic cleaning looming ever larger,\" he wrote.\nThe UN Human Rights High Commissioner Volker Türk also issued a statement condemning Israeli actions, saying the \"aggressive operation\" has resulted in the forcible displacement of thousands of Palestinians, \"demolished homes and commercial property, and deprived residents of the ability to move freely.\"\n\"Collective punishment is a grave violation of international law. Threats to empty and erase entire neighbourhoods also raise serious concerns of ethnic cleansing,\" he said.\nA UN report, also released on Monday, that accuses Israel of committing war crimes in the West Bank, was rejected by the Israeli Foreign Ministry as \"propaganda.\"\nThe ministry said that the findings were \"not a human rights report but a propaganda document detached from reality, aimed at undermining Israel's right to self-defense, delegitimizing the Jewish state, and legitimizing jihadist terrorism against its citizens.\"\nWhat is the Israeli operation in the West Bank?\nIsraeli troops entered the Deir Baha neighborhood, where the assailants lived, and ordered residents to pack up and leave.\nThe Hebron municipality said that more than 3,000 people, including 200 babies, were ordered to leave.\nThe Israeli military said at the weekend that its troops were carrying out precise, targeted and thorough searches to \"locate and dismantle terrorist infrastructure and locate weapons, alongside questioning suspects\" in Hebron.\nThe military said the operation was expected to continue \"for several days\" and would focus on Deir Baha.\nThe largescale response to the firefight in the West Bank comes in the run-up to elections in Israel on Tuesday that could bring an end to Netanyahu's premiership.\nNetanyahu has frequently painted himself as the only person who can keep Israel safe but his opponents have accused him of lacking a plan.\nEdited by: Alex Berry\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ氏、有罪判決につながる不正投票情報に100万ドルの報酬を提供", "title_en": "Trump offers $1M reward for voter fraud tips that result in conviction", "summary_ja": "トランプ氏は、有罪判決につながる投票不正の情報提供者に対して100万ドルの報酬を提供すると表明しました。この報酬の資金源については明確にされていません。", "summary_en": "It is not clear where the money for this reward would come from.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/trump-offers-1m-reward-people-report-voter-fraud/story?id=137581908", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは24時間体制で最新ニュースと生中継イベントをお届けしています。速報から深掘り報道まで、重要なニュースをリアルタイムで配信します。常に最新情報にアクセスできるABCニュースライブをご利用ください。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "終身刑受刑者がテネシー州の刑務所から脱獄", "title_en": "Inmate serving life sentence escapes prison", "summary_ja": "殺人罪で有罪判決を受けたジェイコブ・モーリーがテネシー州の刑務所から日曜日に脱獄した。テネシー州矯正局によると、モーリーは終身刑を服役中であった。当局は現在、逃亡受刑者の行方を追っている。", "summary_en": "Jacob Morley, a convicted murderer, escaped from a Tennessee prison on Sunday, according to the Tennessee Department of Correction.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/convicted-murderer-escapes-tennessee-prison-authorities/story?id=137573001", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英国、エルファシャーの「強姦キャンペーン」に関与したスーダン軍指導者に制裁を課す", "title_en": "UK sanctions Sudanese military leaders implicated in El Fasher ‘campaign of rape’", "summary_ja": "英国政府は、スーダン内戦中にエルファシャーの包囲戦で性暴力に関与した疑いのある両軍勢力の15人の指揮官に対し、渡航禁止と資産凍結の制裁を発動した。1年前、RSFによるエルファシャー占領時に数日間で数万人の民間人が殺害され、別の4万人が行方不明となっている。英国政府はこの行動により「エルファシャーで起きた恐怖が世界に知られることを望んでいる」と述べた。", "summary_en": "Commanders suspected of sexual violence during the largest and fastest slaughter of civilians in more than 30 years have been subjected to travel ban and asset freeze Senior Sudanese commanders implicated in a “campaign of rape” have been targeted by the UK on the first anniversary of a mass atrocit", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/26/uk-sanctions-sudanese-military-leaders-implicated-in-el-fasher-campaign-of", "state_media": false, "category": "政治", "full_text": "Senior Sudanese commanders implicated in a “campaign of rape” have been targeted by the UK on the first anniversary of a mass atrocity that saw tens of thousands of civilians killed over several days.\nA year after the fall of El Fasher, the British government said it had sanctioned military leaders from both sides in the country’s ongoing conflict whom it suspected of sexual violence during the siege of the city.\nA total of 15 commanders from the military groups – the Rapid Support Forces (RSF) and the Sudanese Armed Forces (SAF) – have been subjected to a travel ban and an asset freeze.\nThe Foreign Office said it hoped the action would ensure “the horrors that took place at El Fasher will be known to the world”.\nDuring the RSF’s takeover of the city, up to 10,000 men, women and children are believed to have been slaughtered over two days – the fastest and largest massacre of civilians this century. Another 40,000 remain unaccounted for.\nThe killings came at the end of an 18-month starvation siege by the RSF, which was allegedly backed by the United Arab Emirates (UAE). The UAE continues to deny supporting the RSF.\nFewer than 70,000 people are believed to remain in El Fasher, compared with a prewar population of more than 1 million. Life inside the city continues to be horrendous, with testimony indicating routine detention, torture and unlawful killings.\nIndividuals targeted by the UK’s latest sanctions include Hussein Abu Jalak, an RSF colonel linked to atrocities during the siege, which forced hundreds of thousands of civilians to live off animal feed.\nAnother is Al-Nour Ahmed Adam – also known as “Al-Qubba” – who was identified as playing a prominent role in the attack on the city.\nA Guardian investigation earlier this year revealed internal US and UK warnings were sidelined in the run-up to the RSF attack on El Fasher, and that action that might have saved lives was not taken.\nA statement to mark the anniversary of the massacre from the Coalition on Atrocity Prevention and Justice for Sudan said: “The victims will not be forgotten, survivors will be heard, and we will continue to pursue accountability for those responsible.”\nDuring the 12 months since the fall of El Fasher, Sudan’s ruinous conflict – which has forced 14 million people to flee their homes – has developed increasingly into a drone war.\nThe latest strikes saw the RSF causing mass power outages across east Sudan after targeting power stations with a coordinated drone attack.", "translation_ja": "", "vocab": []}, {"title_ja": "米軍がソマリアの洪水を「兵器化」し、エルニーニョの影響下で女性と子どもを危険地域に追い込んでいると非難", "title_en": "US forces accused of ‘weaponising’ Somalia’s floods by trapping women and children in the path of El Niño", "summary_ja": "ソマリア南部ジリブ市の住民らは、米軍が実施する空爆によって人口がジュバ川の氾濫危険地域に追い込まれていると証言している。米国アフリカ軍団は強化されるエルニーニョによる洪水シーズンを軍事戦略の一部として活用し、大規模な民間人犠牲者を引き起こす可能性があると懸念されている。2023年のエルニーニョはソマリアで1世紀ぶりの大洪水を引き起こし、120万人以上が避難した。", "summary_en": "Exclusive: Coordinated airstrikes on territory held by al-Shabaab are driving the civilian population to find refuge alongside a river where rising water levels are a threat to safety. Is it a deliberate military strategy? The water was rising rapidly. It had already reached Cayni Ali’s waist. Her h", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/26/us-forces-accused-of-weaponising-somalia-flood-el-nino", "state_media": false, "category": "政治", "full_text": "The water was rising rapidly. It had already reached Cayni Ali’s waist. Her home, five metres from the flooded River Juba in southern Somalia, never stood a chance. There was nowhere to go. Ali’s city of Jilib was under attack. Repeated airstrikes, said the mother of six, were pinning its population beside the rising river.\n“The drones come all the time,” said the 27-year-old. “We hear them constantly. They kill animals, civilians. The town is big but destruction is everywhere.”\nAsho Omar from Malenda, a village near Jilib, described “constant” airstrikes that had forced people towards the banks of the Juba.\n“The airstrikes are everywhere; it is difficult to move. So many people have been killed.”\nTheir testimony offers a rare glimpse of life inside the stronghold of al-Shabaab, the Islamist militants who control 30% of Somalia. Closed off from the outside world, residents describe a city dealing with significant civilian casualties. Bodies, some said, lay in the streets.\nThe ongoing conflict is a legally ambiguous, shadowy war coordinated by the United States in east Africa, in which there is little accountability for harm to Somali civilians.\nThe United States Africa Command (Africom) would not share “operational security” details of a seemingly accelerating campaign that has also raised questions over potential covert US strikes. But there is, perhaps, an even darker dimension to the offensive on al-Shabaab’s de facto capital.\nSources say the military strategy appears to be seeking to drown those living in al-Shabaab territory by “weaponising” a rapidly strengthening El Niño, forecast to intensify Somalia’s rainy season from this month.\n“The airstrikes are forcing people to go close to the river. It’s an extremely aggressive offensive, exploiting El Niño as a weapon of war to push the population into flood-prone areas,” said a source monitoring the Juba floodplain in southern Somalia.\nPinning the population – which includes large numbers of women and children – on the river’s floodplain has raised concerns of large-scale deaths in the months ahead.\n“The official line is that they are targeting military positions and al-Shabaab, but because al-Shabaab is embedded within the community, it’s difficult to avoid collateral damage,” added the source.\nWhen El Niño last struck Somalia in 2023, it caused the worst floods seen in the country for a century, displacing more than 1.2 million people. Analysts have questioned the ethics of the US military allegedly using mapping data from flood-prone areas – conceived to mitigate civilian casualties – to inflict harm.\nJethro Norman, a senior researcher with the Danish Institute for International Studies, said: “A weaponisation of El Niño is a reversal of process – using humanitarian remote sensing to inflict casualties rather than to mitigate harm. You capture the cumulative impact of a sustained airstrikes campaign in an El Niño flooding context.”\nUS officials deny exploiting climatic factors. A spokesperson said: “Africom does not target civilians, conduct operations for the purpose of displacing civilian populations or use weather or flooding as a method of warfare. Africom targets lawful military objectives and takes feasible measures to mitigate civilian harm.”\nNevertheless, many wonder if the opportunity to weaken al-Shabaab using the weather was too tempting to ignore, offering a catastrophic drowning event blamed on a supercharged El Niño.\nLike many cities, Jilib’s location has been found wanting in an era of extreme weather. On a low-lying plain, the city is chronically vulnerable to flooding. In 2023, vast swathes of farmland were submerged. Halimo Abdikadir from Kamsuuma, south of Jillib, described the destruction of her home, 6 miles (10km) from the river. “The waters came quickly at night – when they left, everything was mud. A lot of animals drowned.”\nArbey Famu from Ahmed Yare, another village outside Jilib, expects this El Niño to be far worse than 2023: her crops of maize and sorghum are underwater.\n“In Jilib, there is big flooding already,” said the 70-year-old.\nUS defence officials will know the early indicators of El Niño’s impact in al-Shabaab’s heartland. UN agencies say the Juba River basin is of “particular concern”. The International Committee of the Red Cross (ICRC), meanwhile, foresees “severe flooding”.\nAttacking Jilib using ground forces carries much risk. Airstrikes can yield triumphs such as the death of a senior al-Shabaab commander on 1 October, but are unable to overrun a city of 100,000.\nAli Adan Ali, the commissioner for displaced people in Jubaland, is worried. In his Kismayo office, Ali identified 327 regions prone to flooding. By October, El Niño warnings had only been issued to half.\nHis chief concern is the lack of boats. Without them, he says, thousands in al-Shabaab territory risk being trapped on the east side of the river, unable to reach help in Kismayo, at the mouth of the Juba.\nThree years ago, during the last El Niño, Al", "translation_ja": "", "vocab": []}, {"title_ja": "スーダン準軍事勢力がドローン攻撃で東部5つの発電所を破壊、大規模停電が発生", "title_en": "Sudan paramilitary drone strikes cause mass power cuts in eastern states", "summary_ja": "スーダンの準軍事勢力「ラピッド・サポート・フォース」がドローン攻撃により東部のアルジャジーラ州、ゲダレフ州、ホワイトナイル州の5つの発電所を破壊し、広範な停電が発生しました。既に飢饉危機に直面している地域で、医療サービスや電力供給が深刻な打撃を受けています。スーダンでは2023年4月からの内戦で、ドローン攻撃による被害が急速に増加しており、10月だけで300人以上が死亡しています。", "summary_en": "Rapid Support Forces strike five power stations in three states controlled by Sudanese army Sudan’s paramilitary Rapid Support Forces have launched a coordinated drone attack against five power stations, causing mass power outages across the country’s east, a government official said. The drones hit", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/26/sudan-paramilitary-drone-strikes-rapid-support-forces-power-cuts-eastern-states", "state_media": false, "category": "政治", "full_text": "Sudan’s paramilitary Rapid Support Forces have launched a coordinated drone attack against five power stations, causing mass power outages across the country’s east, a government official said.\nThe drones hit two power stations each in the states of Al-Jazira and Gedaref and one in White Nile state, “resulting in power outages across large parts of these three states”, the official said on condition of anonymity.\nAll three states are controlled by the Sudanese army, which has been at war with the RSF, its former ally, since April 2023.\nThe United Nations has repeatedly warned that regular attacks on power stations threaten health and services for millions of people who are already facing the world’s largest hunger crisis.\nBabiker Youssef, a resident of Al-Fao, in Gedaref, said the power had been out there since early morning.\n“My son is diabetic, his insulin has to be stored in the fridge,” he said over the phone, adding that he feared he would not be able to replace the medication if it spoiled. “We have no idea when the power will come back,” he said.\nElectricity has been cut for days at a time after past paramilitary drone strikes on power stations and hydroelectric dams.\nSudan’s war is currently being fought primarily via drones, with both sides launching sophisticated attacks across the country, killing dozens of civilians at a time.\nIn the first three weeks of October, drone strikes killed more than 300 people and injured hundreds more, according to a UN tally.\nAfrica’s third largest country, home to an estimated 50 million people, has been ravaged by the war, which aid workers estimate has killed more than 200,000 people.\nThe majority of Sudan’s hospitals have been forced to close, at least 8 million children are out of school and swathes of the country cannot access basic services.\nAbdelhafez Daafallah, a 54-year-old farmer, said by phone from Al-Junaid town in Al-Jazira: “The electricity had just started to improve three months ago, the power station the militia had destroyed was just repaired and we had hope our irrigation pumps would finally start running again.\n“We hoped we would be able to finally get back to farming, but now the station has been hit,” he said, frustrated after nearly four years unable to work his land.\nFarmers in Al-Jazira have struggled to rehabilitate and replant their land since the army recaptured the state from the RSF last year.\nTo the east, in Gedaref, Ibrahim Mohammed, 37, a grocer, said he was “already facing power cuts for hours before the strike”. “Now I have chicken in the fridge, we either lose our entire stock, or will be forced to sell it off at any price, which is still a loss,” he said.\nSudan is also grappling with unprecedented inflation and its currency has lost more than 25% of its value in recent weeks.", "translation_ja": "", "vocab": []}, {"title_ja": "ブラジル大統領選敗北後、ボルソナロ前大統領がパスポート没収を警察に命じられたと主張", "title_en": "Bolsonaro says police demand passports after Brazil election defeat", "summary_ja": "ボルソナロ前大統領の息子フラビオ氏がソーシャルメディアに投稿した動画で、警察がパスポートの提出を命じ、ブラジル国外への出国を禁止したと述べています。この措置は、ボルソナロ氏がルーラ現大統領との接戦の大統領選で敗北した翌日に実施されました。", "summary_en": "Flavio Bolsonaro posted a video on social media saying police ordered him to surrender his passports", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/26/bolsonaro-says-police-demand-passports-after-brazil-election-defeat?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Bolsonaro says police demand passports after Brazil election defeat\nNewsFeed\nBolsonaro says police demand passports after Brazil election defeat\nFlavio Bolsonaro posted a video on social media saying police ordered him to surrender his passports and barred him from leaving Brazil. The demand comes one day after Bolsonaro lost a tightly-contested presidential election to incumbent President Lula da Silva.\nPublished On 26 Oct 2026", "translation_ja": "", "vocab": []}, {"title_ja": "ヨルダン、教会銃撃事件に対応しシリアへ空爆を実施", "title_en": "Jordan launches air strikes in Syria in response to a fatal church shooting", "summary_ja": "ヨルダンは先週のカラク県での教会銃撃事件（9人死亡）への報復として、シリア南東部の武装勢力の拠点に対して空爆を実施し、少なくとも7人を殺害した。ヨルダン軍はシリア政府との調整を主張しているが、シリアは事前の協調を否定し、調査を開始した。空爆によってシリア南部のデラーとスウェイダー県が被害を受け、ナシブ国境検問所は一時閉鎖された。", "summary_en": "Syria denies prior coordination with Jordan after deadly air strikes hit two provinces, killing at least seven people.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/26/jordan-launches-air-strikes-in-syria-in-response-to-a-fatal-church-shooting?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Jordan launches air strikes in Syria in response to a fatal church shooting\nSyria denies prior coordination with Jordan after deadly air strikes hit two provinces, killing at least seven people.\nJordan has carried out air attacks in Syria against what it described as hideouts for armed groups, killing at least seven people, including a woman and children, according to initial reports.\nOn Monday, the country’s armed forces described the attacks as a response to an incident that saw gunmen open fire on a church last week, leaving nine dead and dozens wounded in Jordan’s Karak governorate.\nThe Jordanian operation reportedly targeted “terrorist organisations in southeastern Syria” linked to the church’s attackers.\nMonday’s strikes “resulted in the killing and wounding of many members of these terrorist groups and the destruction of a number of their vehicles”, according to the Jordanian military. It did not specify which groups were attacked, nor the precise location of the strikes.\nJordan has said that Monday’s efforts were launched in coordination with the Syrian government.\nBut Syria has denied coordinating with the Jordanian military. The country’s defence ministry said in a statement on Telegram that one Jordanian attack hit five members of the same family, including three children, a woman and a man.\nTwo other strikes reportedly killed one 60-year-old man and another who was 80 years old. The Jordanian strikes hit the southern Syrian provinces of Deraa and Suwayda.\nThe Syrian government has launched an investigation into the Jordanian attacks. In a statement, it stressed the importance of “joint field and security coordination” in border areas.\nFollowing the Jordanian strikes, the Syrian border authority announced the closure of the Nassib border crossing with Jordan, suspending traffic in both directions.\nThe Nassib crossing is Jordan’s only passenger and commercial border crossing with Syria.\nEarlier on Monday, Jordanian security forces arrested two brothers and their brother-in-law in the village of Al-Jadeeda, after a shootout with authorities. The three men are suspects in the October 23 church attack.\nA Jordanian government source told Al Jazeera that the suspects sustained serious injuries during the confrontation, which lasted for about three hours.\nMonday’s arrests and air strikes in Syria come after Jordan’s King Abdullah II pledged a stern response to the church attack.\nThe attack saw three men allegedly open fire on a Greek Orthodox church during a funeral about 90km (56 miles) south of the capital, Amman.\nKarak is home to a minority Christian population, which makes up about 300,000 of Jordan’s 11.5 million people.\nKing Abdullah said those behind the attack would face the “harshest penalties” and ordered a review of the country’s security procedures in the aftermath.", "translation_ja": "", "vocab": []}, {"title_ja": "ヨルダン、カラク教会襲撃の報復としてシリアを攻撃", "title_en": "Jordan attacks Syria in response to Karak church attack", "summary_ja": "ヨルダンの空軍は、9人が死亡したカラク教会襲撃事件への報復として、シリア南部で複数の空爆を実施しました。シリア当局によると、ダラア地方で子どもを含む複数の死傷者が出ているとのことです。この攻撃は金曜日の教会襲撃事件に対する軍事的対抗措置となります。", "summary_en": "Jordan’s air force has carried out several strikes in southern Syria in response to Friday’s church attack.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/10/26/jordan-attacks-syria-in-response-to-karak-church-attack?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Jordan attacks Syria in response to Karak church attack\nNewsFeed\nJordan attacks Syria in response to Karak church attack\nJordan’s air force has carried out several strikes in southern Syria in response to Friday’s church attack which killed nine people in Karak. Syrian authorities say several people were killed, including children, in the Deraa countryside.\nPublished On 26 Oct 2026", "translation_ja": "", "vocab": []}, {"title_ja": "ルイス・イナシオ・ルーラ・ダ・シルヴァのブラジル勝利：最後の躍進", "title_en": "A final surge: On Luiz Inácio Lula da Silva’s triumph in Brazil", "summary_ja": "ブラジルの80歳の大統領ルーラは、第1回投票でフラビオ・ボルソナーロに次点となった後、決選投票で51.7%の票を獲得して逆転勝利を収めた。経済問題への焦点転換、ソーシャルメディア・キャンペーン、民主主義への懸念の喚起により、ブラジルの歴史で初めて第1回投票で次点だった候補者が勝利した。この勝利は南米の右翼勢力の台頭に抗する動きであり、ルーラは大陸最大経済国の指導者としてトランプの帝国的野心への抵抗勢力となる可能性がある。", "summary_en": "Lula is the resistance to U.S. imperial ambitions in South America", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/editorial/a-final-surge-on-luiz-inacio-lula-da-silvas-triumph-in-brazil/article71627840.ece", "state_media": false, "category": "社会", "full_text": "At one point, it seemed almost impossible for Brazil’s 80-year-old President, Luiz Inácio Lula da Silva, to turn the tide after finishing second to Flávio Bolsonaro in the first round of elections on October 4. In Brazil’s history, no candidate who has finished second in the first round has gone on to win the presidential run-off. Most of the candidates who dropped out after the first round were from the right. Flávio’s Liberal Party cemented its position in both houses of Congress, while right-wing candidates won several provincial elections. But Lula, a former trade unionist and organiser, who lost a finger in an accident as a teenager, was not ready to give up. Lula and his Workers’ Party identified campaign weaknesses, shifted their attention to economic issues, promised growth and welfare, and persuaded more voters to turn out for Sunday’s run-off. Lula won 51.7% of the vote against Flávio’s 48.2%, a greater lead than his victory against Jair Bolsonaro, Flavio’s father, four years ago. Over the weeks, Lula turned the right-wing’s gains in the first round against it, highlighting the threats that a Bolsonaro victory could pose to democracy and civil rights. Flávio’s campaign pledge to free his father — he is serving a 27-year prison sentence for attempting to overturn Lula’s 2022 victory, and impeach Supreme Court judges — only heightened the concerns of voters outside the right wing, who rallied behind a familiar face.\nLula unleashed a social media campaign to mobilise younger voters. A WhatsApp channel called ‘Lula’s Army’ with 11 million followers spread his message of continuity. He also announced plans to expand a cash payout scheme for the poor, a new debt relief package and entrepreneur-friendly measures. In the northeast, the Workers’ Party’s stronghold, he gained nearly three million votes and made considerable gains in the working-class neighbourhoods of big cities, including São Paulo. A relatively stable economic record, marked by growth and falling unemployment over the past three and a half years, also lent credibility to Lula’s appeal. His victory bucks the recent trend in South America, where Washington-aligned right-wing and conservative forces have gained ground. While Lula offers predictable stability and social and economic inclusiveness, he could also be, as the President of South America’s largest economy, a voice of resistance to Donald Trump’s imperial ambitions. At the same time, Lula will have to work with a right-wing-controlled Congress to advance his agenda. He should seek to build legislative consensus while focusing on addressing the economic challenges of Brazil, which remains one of the most unequal major world economies.\nPublished - October 27, 2026 12:20 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ルビオ国務長官、10月30～31日にアトランタでG20外相会議を開催", "title_en": "Rubio to host G20 Foreign Ministers’ meet in Atlanta on Oct 30-31", "summary_ja": "米国のマルコ・ルビオ国務長官は、10月30～31日にアトランタでG20外相会議を開催し、共通の経済・安全保障上の課題に関する実践的協力を推進する。インドのジャイシャンカル外交担当大臣も同会議に参加予定であり、この会議は12月のトランプ大統領によるG20首脳会議（マイアミ開催予定）に向けた準備となる。", "summary_en": "U.S. President Donald Trump is scheduled to host the G20 Leaders’ Summit in Miami on December 14-15", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/rubio-to-host-g20-foreign-ministers-meet-in-atlanta-on-oct-30-31/article71628615.ece", "state_media": false, "category": "政治", "full_text": "U.S. Secretary of State Marco Rubio will host the G20 Foreign Ministers’ Meeting this weekend in Atlanta to strengthen efforts to advance practical cooperation on shared economic and security challenges, thereby setting the stage for the leaders’ meeting in December.\nExternal Affairs Minister S. Jaishankar is scheduled to attend the G20 Foreign Ministers’ Meeting in Atlanta on October 30-31.\n“Under President Trump's leadership, the United States is returning the G20 to its core economic mission of driving growth, strengthening economic security, and delivering results for the American people,” the Department of State said in a statement.\nIt said Mr. Rubio will convene Foreign Ministers from the world’s leading economies to advance practical cooperation on shared economic and security challenges.\n“Throughout the ministerial, the United States will work with G20 partners to address geopolitical crises contributing to global economic shocks, including threats to freedom of navigation, energy and food security, and supply chains,” the State Department said.\nIt said global security and economic prosperity are inextricably linked, and these discussions will set the stage for U.S. President Trump’s G20 Leaders’ Summit and the broader economic agenda that leaders will tackle.\nAs a global hub of diplomacy, connectivity, and commerce, Atlanta offers the perfect backdrop for these discussions. U.S. President Donald Trump is scheduled to host the G20 Leaders’ Summit in Miami on December 14-15.\nPublished - October 26, 2026 11:22 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "AI企業Anthropic、IPO申請 上半期の収益が143億ドルに急増", "title_en": "Anthropic files for IPO as revenue jumps 14-fold to $16.3 billion in H1", "summary_ja": "Claude開発企業のAnthropicが米国でのIPO申請を行い、ナスダックでの上場を計画しています。同社は2026年上半期の収益が163億ドルと前年同期比で14倍に急増したことを開示しました。一方で、AI開発・運用コストの高さにより80億7000万ドルの純損失を報告しており、インフラ依存やAI開発競争などのリスク要因を指摘しています。", "summary_en": "Claude maker reports $80.7 billion first-half net loss, largely due to valuation-related accounting charges; revenue from existing customers grows ninefold", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/artificial-intelligence-giant-anthropic-files-papers-to-sell-shares-to-the-public-for-the-first-time/article71627679.ece", "state_media": false, "category": "社会", "full_text": "Anthropic, the artificial intelligence company behind Claude, has filed to go public in the United States, disclosing rapid revenue growth, expanding enterprise spending and the high cost of developing and running advanced AI models.\nThe company filed a registration statement with the US Securities and Exchange Commission (SEC) on October 26. It intends to list its Class A common stock on the Nasdaq Global Select Market under the ticker symbol “ANT”. The number of shares to be offered and the price range have not yet been determined.\nThe public filing follows Anthropic’s confidential submission of a draft registration statement to the SEC on June 1, 2026. The proposed IPO remains subject to regulatory review.\nOne of the key disclosures is that revenue from a group of existing customers was about nine times higher in the three months ended September 30, 2026, than in the same period a year earlier. The calculation includes customers who generated at least $1 in revenue in the earlier period but excludes subscribers to Anthropic’s Claude Pro and Max plans.\nThe company reported more than 11,900 customers generating at least $100,000 in revenue over the preceding 12 months as of September 30, up from more than 950 a year earlier. More than 1,900 customers generated at least $1 million, while approximately 250 generated at least $10 million.\nFor the six months ended June 30, 2026, Anthropic reported revenue of $16.3 billion, up from $1.16 billion in the corresponding period a year earlier. Its net loss widened to $80.7 billion from $13 billion, largely because of accounting expenses arising from changes in the estimated value of certain financing instruments as the company’s valuation rose.\nAnthropic reported an operating loss of $693 million in the first half of 2026, compared with $2.14 billion a year earlier. However, using its own adjusted measure, which excludes certain expenses, the company reported operating income of $1.6 billion, with a margin of about 10%.\nIt reported $8.95 billion in computing and infrastructure expenses in the first half of 2026, reflecting the costs of developing and running advanced AI models. As of June 30, the company held $131.7 billion in cash, cash equivalents and short-term investments, according to the filing.\nThe prospectus flags risks including dependence on computing infrastructure providers, competition and the cost of developing increasingly capable AI models. Major cloud providers supply Anthropic with computing capacity and help distribute its products, while also developing competing AI services.\nThe filing also outlines a governance structure intended to protect Anthropic’s long-term public-benefit mission. An entity formed by its seven co-founders will hold a special share carrying 50.1% of general voting power, while the company’s Long-Term Benefit Trust will have the right to appoint a majority of the board. This would limit the ability of ordinary shareholders to influence corporate governance, even after the company lists publicly.\nAnthropic has not yet disclosed the number of shares to be offered or the proposed price range. The timing and terms of the IPO will depend on the regulatory process and market conditions.\nPublished - October 26, 2026 07:51 pm IST", "translation_ja": "", "vocab": []}, {"title_ja": "『激しいライバル関係』が再び注目を集める中、著者レイチェル・リードが激動の1年を振り返る", "title_en": "Rachel Reid has had ficant step towards modernising medical education, saying that the digital tools must complement human instruction and make learning more interactive.\nHe urged the institution to deploy technology to improve teaching, learning and research without replacing physical classroom interactions and the mentorship role of lecturers.\nHe also challenged the university’s management to translate its strategic plan into measurable improvements in academic standards, research, infrastructure and the quality of graduates.\nThe governor reaffirmed his administration’s commitment to supporting BMU’s ASPIRE Agenda, which focuses on academic excellence, sustainability, partnerships and engagement, innovation and technology, as well as research excellence among others.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe commended the Vice-Chancellor, Dimie Ogoina, and the university management for developing a roadmap for institutional growth, charging them to collaborate with the state’s Ministries of Education and Health to achieve its objectives.\nMr Diri said his administration was strengthening science, technical and vocational education to equip young people with practical skills for employment, entrepreneurship and self-reliance.\nHe expressed confidence that the science-oriented schools being established across the state would provide qualified candidates for BMU and other tertiary institutions.\nAccording to him, this will help the state to produce more doctors, nurses, pharmacists, radiologists, engineers and other professionals.\nThe governor acknowledged the late governor Diepreye Alamieyeseigha, who initiated the development of the former 500-bed hospital where the university is located, and his successor, Seriake Dickson, who revived the project and transformed it into the medical university.\nHe disclosed that the university’s campus at Sampou was nearing completion and would provide additional space for its expansion.\nMr Diri also inspected facilities at the newly established Bayelsa Medical University Teaching Hospital and expressed confidence in the institution’s capacity to provide advanced diagnostic services.\nHe said the teaching hospital was equipped to conduct x-rays and advanced scans, including Computed Tomography (CT) scans, which use x-ray technology and computer processing to produce detailed images of internal body structures.\nThe governor said the availability of such facilities would improve access to specialised diagnostic services and reduce the need for Bayelsans to travel outside the state for certain medical procedures.\nMr Diri also undertook a tour of facilities at the Bayelsa Emergency Medical Services and Ambulance System.\nMy vision for the university – VC\nEarlier, the Vice-Chancellor, Mr Ogoina, said his vision was to transform the school into a globally recognised institution for medical education, research and innovation, driven by technology and sustainability.\nHe explained that the ASPIRE Agenda was being implemented through institutional teams and initiatives designed to improve academic quality, accountability, innovation and student welfare.\nREAD ALSO: Diri calls Duke pretender, alleges presidential ambition is bid for rehabilitation\nThe vice-chancellor disclosed that the university had secured accreditation for nine academic programmes while its nursing science students recorded a 96 per cent pass rate in their professional examinations.\nHe also revealed that the university’s College of Medicine had attained full membership of the Consortium of Medical Schools of Africa while BMU was selected as one of 18 medical schools in Nigeria for a high-impact intervention programme.\nOn digital innovation, Mr Ogoina said the university had established a virtual reality, artificial intelligence and mixed-reality studio, expanded digital connectivity and introduced a “Talk to the VC” application to enable students and staff communicate directly and confidentially with the university leadership.\nHe added that the institution was strengthening simulation-based learning through its clinical skills laboratory and pursuing plans to develop a smart campus, improve internet connectivity and increase internally generated revenue.\n“The BMU is developing a Centre of Excellence for Digital Health and Biomedical Innovation, alongside the Niger Delta Centre of Excellence for Health, Environment an", "translation_ja": "", "vocab": []}, {"title_ja": "PDP、ティヌブ大統領の「野党が飢饉と貧困の原因」という主張に反発", "title_en": "PDP speaks on Tinubu’s claim opposition caused hunger, poverty", "summary_ja": "野党・人民民主党（PDP）は、ティヌブ大統領が野党政治家がナイジェリアの飢饉と貧困の責任にあると主張したことを拒否し、与党・全進歩統一党（APC）が経済危機への責任回避を試みていると非難しました。PDP報道官のジュングド・モハマドは、野党批判では生活費の上昇、食糧不安、失業などの課題には対処できないと主張し、APC政府に具体的な経済対策を求めました。", "summary_en": "The party urged Mr Tinubu and APC to focus on addressing the country’s economic challenges rather than engaging in political blame games. The post PDP speaks on Tinubu’s claim opposition caused hunger, poverty appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/920554-pdp-speaks-on-tinubus-claim-opposition-caused-hunger-poverty.html", "state_media": false, "category": "政治", "full_text": "The Peoples Democratic Party (PDP) has rejected President Bola Tinubu’s claim that opposition politicians were responsible for the hunger and poverty confronting Nigerians, accusing the ruling All Progressives Congress (APC) of attempting to evade responsibility for the country’s economic challenges.\nThe party, said blaming the opposition would not address the rising cost of living, food insecurity, unemployment and other difficulties facing Nigerians.\nJungudo Mohammed, the PDP national publicity secretary, stated this in a statement on Monday in response to remarks by Mr Tinubu and the ruling party.\n“The PDP considers these statements as attempts to evade responsibility and divert public attention from the pressing challenges facing the country under the APC-led administration,” he said.\nMr Mohammed urged the APC to focus on addressing the country’s economic challenges rather than engaging in political blame games.\n“Rather than engaging in political blame games, the APC should explain what it intends to do to make food affordable, support farmers, strengthen local food production, create jobs, improve security, fight corruption, improve electricity supply, reduce transportation costs, and restore the purchasing power of ordinary Nigerians, among other pressing concerns,” he said.\nTinubu’s allegation\nAt the flag-off of his re-election campaign in Kaduna on Saturday, Mr Tinubu accused opposition politicians of creating hunger and poverty in the country, insisting that his administration was working to eradicate both.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“I have heard the opposition talking about hunger and poverty. Who created them? They did. They created the hunger; they created the poverty. We are trying to eradicate it,” the president said.\nEarlier on Monday, the APC National Publicity Secretary, Felix Morka, made a similar argument, saying the foundations of Nigeria’s current poverty crisis were laid before Mr Tinubu assumed office in May 2023.\nMr Morka argued that former leaders should not portray the economic hardship as a problem that emerged under the current administration.\nIn his response, Mr Mohammed acknowledged some of the achievements of Mr Tinubu’s administration but rejected the arguement that the PDP’s 16 years in power provided a blanket justification for the current government’s shortcomings.\n“While the PDP acknowledges some of the achievements recorded by President Bola Ahmed Tinubu’s administration, where applicable, we firmly reject any attempt to use the PDP’s sixteen years in government as a blanket justification for the shortcomings of the present administration,” he said.\nHe added that acknowledging the administration’s achievements should not be interpreted as an endorsement of all its policies or an acceptance of attempts to transfer responsibility for current economic difficulties to previous PDP-led governments.\nMr Mohammed said that after more than a decade in power, the APC should account for its performance and explain the concrete measures it was taking to improve Nigerians’ living conditions.\n“After more than APC’s 10 years in office, Nigerians deserve answers, not excuses. The APC must tell Nigerians what it has achieved, outline the concrete measures it is taking to address the country’s present-day challenges, and demonstrate its commitment to improving the welfare of citizens rather than continually dragging the PDP into its own shortcomings,” he said.\nHe argued that although past administrations could provide historical context for the country’s economic difficulties, they could not serve as a permanent shield against accountability.\n“The PDP maintains that the economic challenges confronting Nigeria cannot be resolved by repeatedly blaming previous PDP-led administrations. While historical circumstances may provide context, they cannot serve as a permanent shield against accountability. Every administration must be judged by its policies, decisions, achievements, and, most importantly, the living conditions of the people it governs,” he added.\nPDP defends its record\nThe PDP spokesperson also defended the party’s record during its 16 years in power, from 1999 to 2015, claiming that Nigerians enjoyed a better standard of living and security under previous PDP administrations.\n“Nigerians remember the standard of living and the security situation under previous PDP administrations. Today, citizens are demanding practical solutions, affordable food, economic stability, and improved security, not endless political arguments and blame shifting,” he said.\nMr Mohammed expressed confidence that Nigerians would judge political parties by their records, policies and commitment to public welfare.\nHe also said the desire among Nigerians for a return to PDP leadership reflected their demand for better governance, improved living conditions and a more secure ", "translation_ja": "", "vocab": []}, {"title_ja": "Otti celebrates Ebitu Ukiwe at 86, urges Nigeria to recognise his contribution to democracy", "title_en": "Otti celebrates Ebitu Ukiwe at 86, urges Nigeria to recognise his contribution to democracy", "summary_ja": "Governor Otti recalled how Commodore Ukiwe resigned his exalted position as the number two citizen of the country to uphold his principles and reputation, describing him as a rare gem who should be referenced as a great example to the present generation of politicians and public office holders. The ", "summary_en": "Governor Otti recalled how Commodore Ukiwe resigned his exalted position as the number two citizen of the country to uphold his principles and reputation, describing him as a rare gem who should be referenced as a great example to the present generation of politicians and public office holders. The ", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/920547-otti-celebrates-ebitu-ukiwe-at-86-urges-nigeria-to-recognise-his-contribution-to-democracy.html", "state_media": false, "category": "政治", "full_text": "Governor Alex Otti of Abia State has felicitated with an illustrious Abia statesman and former Chief of General Staff, Commodore Ebitu Okoh Ukiwe, on the occasion of his 86th birthday.\nThe felicitation is contained in a message issued on Monday, 26 October by Ferdinand Ekeoma, the special adviser on media and publicity to Governor Otti.\nIn the goodwill birthday message, Governor Otti extolled the revered statesman, describing him as a distinguished Nigerian with sound character and a proven track record of excellence.\nAccording to the Governor: “It is a thing of joy to celebrate a father figure; a distinguished Nigerian statesman and an accomplished military professional with sound character and a proven track record of excellence.\n“Ochiagha Ebitu Okoh Ukiwe is, by all estimations, a national icon with sound principles and impeccable character. He is indeed the pride of Abia, hence we are glad and proud to celebrate him on a day like this.”\nGovernor Otti recalled how Commodore Ukiwe resigned his exalted position as the number two citizen of the country to uphold his principles and reputation, describing him as a rare gem who should be referenced as a great example to the present generation of politicians and public office holders.\nThe Abia Chief Executive also remembered the role Commodore Ukiwe played in the fight to restore democracy in Nigeria when he led other compatriots to form NADECO which fought for the restoration of the 12 June, 1993 victory of the late Chief M.K.O Abiola, and called on the nation to give him his due recognition for the exemplary roles he played for the peace of the nation and for the restoration of democracy.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nGovernor Otti disclosed that his government will roll out the drums to celebrate Commodore Ukiwe’s 86th birthday as a mark of honour and recognition of his service to the nation and humanity.\nGovernor Otti, on behalf of his family, the government and people of Abia State, thanked Commodore Ukiwe for being the pride of Abia State, and prayed God to uphold and bless him with good health to celebrate many more beautiful birthdays ahead in sound health.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "捕虜との関わりで感情を抑制するウク
