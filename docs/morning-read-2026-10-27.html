category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジョータフード会長、花蓮で車が橋から転落し死亡", "title_en": "Jota Food chairman dies after car plunges off bridge in Hualien - Focus Taiwan", "summary_ja": "台湾の食品企業ジョータフードの会長が、花蓮県で乗用車が橋から転落する事故により亡くなった。警察は現在、事故の詳細な原因について調査を進めている。この事故は地元社会に大きな衝撃を与えている。", "summary_en": "Jota Food chairman dies after car plunges off bridge in Hualien Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE10YW90LVFyUFlJa0NCdXVOZkVYT1JaNmE4MkZjWVdyQjFRemJrcldpV2Q2RFE5LXU5VC1QcEk2X0w0ZDNucXRpVE50UEJoalhXTjhRZDF3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マリ軍がマナカ地域での攻撃で54人の死亡を報告", "title_en": "Mali military reports 54 dead after attacks in northeast", "summary_ja": "CGTN報道によると、マリの武装勢力は北東部マナカ地域の軍事キャンプへの攻撃による死亡者数が54人に上昇したと発表しました。さらに6遺体が発見されたことで、死傷者数が増加しています。", "summary_en": "Mali's armed forces say the death toll from attacks on camps in the country's northeastern Menaka region has risen to 54, after six more bodies were discovered.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-10-25/Mali-military-reports-54-dead-after-attacks-in-northeast-1RwP87uK6Zi/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシアとウクライナが数百人の捕虜を交換", "title_en": "Russia, Ukraine swap hundreds of POWs", "summary_ja": "CGTNの報道によると、ロシアとウクライナが数百人の捕虜を交換したと伝えられています。この交換は両国間の継続的な紛争の中で行われたものです。詳細な交換数や条件については、報道機関によるさらなる確認が必要です。", "summary_en": "Russia, Ukraine swap hundreds of POWs", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-10-23/news-1RtLnSAusFi/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スイス外交官の妻がナイジェリア初のエボラ患者と特定", "title_en": "Swiss diplomat's wife identified as Nigeria's first Ebola patient", "summary_ja": "CGTNが報じるところによると、スイスはナイジェリア初のエボラ患者がアブジャのスイス大使館職員の妻であることを確認した。同女性はブンディブギョ株を保有しており、最近夫とともにウガンダへ渡航したが、コンゴ民主共和国は訪問していないという。", "summary_en": "Switzerland has confirmed that Nigeria's first Ebola patient is the wife of a Swiss embassy staff member in Abuja. The woman, who has the Bundibugyo strain, recently travelled to Uganda with her husband, but neither visited the Democratic Republic of Congo.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-10-23/Swiss-diplomat-s-wife-identified-as-Nigeria-s-first-Ebola-patient-1RtUFOzsB6E/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イングランド代表FWハリー・ケイン、バロンドール賞を受賞", "title_en": "England striker Harry Kane wins Ballon d'Or award", "summary_ja": "TASS/RTが報じたところによると、ハリー・ケインがバロンドール賞を受賞した。昨シーズンケインはバイエルン・ミュンヘンで61ゴールを記録し、同クラブはブンデスリーガタイトルとドイツカップを獲得したという。", "summary_en": "Kane scored 61 goals for Bayern Munich last season, and the club won the Bundesliga title and the German Cup", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/sports/2208275", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ブラジル自由党、ルーラ大統領の大統領選挙勝利を認める", "title_en": "Brazil’s Liberal Party recognizes Lula da Silva’s victory in presidential election", "summary_ja": "TASS/RTが報じたところによると、ブラジルの自由党はルイス・イナシオ・ルーラ・ダ・シルヴァの大統領選挙での勝利を認める決定を下しました。この決定は同党のワルデマル・コスタ・ネート議長によって発表されました。", "summary_en": "The decision was announced by party Chairman Valdemar Costa Neto", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2208273", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ軍が過去24時間でドネツク人民共和国の住宅地に5回の攻撃を実施", "title_en": "Ukrainian army carries out five attacks on residential areas in DPR in past day", "summary_ja": "TASS/RTは、ウクライナ軍がドネツク人民共和国(DPR)の住宅地に対して過去24時間で5回の攻撃を実施したと報じている。同報道によると、これらの攻撃により複数のトラックと自動車、および民間インフラ施設が損傷したという。", "summary_en": "The attacks damaged several trucks and cars, as well as a civilian infrastructure facility", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2208271", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ルーラがドンロー・ドクトリンを葬り去った", "title_en": "Lula Killed the Donroe Doctrine", "summary_ja": "本論考は、ドナルド・トランプ大統領の西半球戦略がブラジルの大統領選挙でルイス・イナシオ・ルーラ・ダ・シルヴァの勝利により失敗に終わったと主張している。トランプ政権は南米の従属国家との関係強化を通じて米国を世界から隔離する計画を進めていたが、ブラジルでの極右の敗北によってその戦略は瓦解した。", "summary_en": "In attempting to disentangle the United States from the rest of the world and retreat into a seemingly controllable hemispheric stronghold, Donald Trump's Latin America strategy had fared better than the rest of his foreign policy. But following a defeat for the far right in Brazil, his project now ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/donroe-doctrine-trump-latin-america-strategy-derailed-by-jeremy-adelman-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Lula Killed the Donroe Doctrine\nIn attempting to disentangle the United States from the rest of the world and retreat into a seemingly controllable hemispheric stronghold, Donald Trump's Latin America strategy had fared better than the rest of his foreign policy. But following a defeat for the far right in Brazil, his project now looks dead in the water.\nRIO DE JANEIRO—Luiz Inácio Lula da Silva’s victory in Brazil’s presidential election is a blow to Donald Trump’s plan for the Western Hemisphere. The US president was hoping to huddle with client states to the south who mimic his business and mano dura (iron fist) posturing, while further betraying liberal partners. That plan, within reach until Sunday’s vote, is now in tatters.", "translation_ja": "", "vocab": []}, {"title_ja": "経済規模の比較方法の誤り", "title_en": "The Wrong Way to Compare Economic Size", "summary_ja": "ノーベル賞経済学者ポール・クルーグマンは、「武器化された相互依存」に関して、EUは米国と中国の両国よりも強力であると主張している。しかし、名目為替レートの変動を平準化するためにPPP調整GDP依存することは、PPPデータ自体のさらに大きな変動を無視している。著者は、経済規模の比較においてこのような手法の問題点を指摘している。", "summary_en": "At the European Central Bank’s annual research conference, Paul Krugman concluded that, when it comes to “weaponized interdependence,” the EU is more powerful than both the US and China. But his reliance on PPP-adjusted GDP as a way to smooth out the volatility of nominal exchange rates ignores the ", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ppp-adjusted-gdp-wrong-way-to-measure-and-compare-economic-size-by-jeffrey-frankel-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The Wrong Way to Compare Economic Size\nAt the European Central Bank’s annual research conference, Paul Krugman concluded that, when it comes to “weaponized interdependence,” the EU is more powerful than both the US and China. But his reliance on PPP-adjusted GDP as a way to smooth out the volatility of nominal exchange rates ignores the even greater swings in PPP data.\nCAMBRIDGE—Last month, the Nobel laureate economist Paul Krugman gave a talk at the European Central Bank’s annual research conference, which focused on geoeconomics. The term refers to countries’ ability to exploit economic interactions for geopolitical ends. Think of China’s threats to cut off trading partners from its exports of rare-earth minerals.", "translation_ja": "", "vocab": []}, {"title_ja": "目的のある経済のための公的管理", "title_en": "Public Control for a Purposeful Economy", "summary_ja": "著者は、政府が経済成果に対するより大きな公的管理の必要性を認識する中で、重要なのは所有権ではなく、国家が経済活動を戦略的目標に向けて操舵する能力であると主張しています。多くの政府が赤字と債務削減を財政責任と同一視していますが、これは自己招来の危機であり、実際には弱い経済での支出削減は債務対GDP比を低下させるのではなく上昇させる可能性があると述べています。", "summary_en": "As more governments recognize the need for greater public control over economic outcomes, they must be careful to define the concept well. What ultimately matters is not ownership, but the state’s capacity to steer economic activity toward strategic objectives in the service of the common good.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/public-control-in-economy-must-be-defined-around-missions-by-mariana-mazzucato-and-anna-hope-emerson-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Public Control for a Purposeful Economy\nand\nAs more governments recognize the need for greater public control over economic outcomes, they must be careful to define the concept well. What ultimately matters is not ownership, but the state’s capacity to steer economic activity toward strategic objectives in the service of the common good.\nLONDON—Governments around the world say they have no room to act. Although inequality and the cost of living are rising, fiscal space, we are told, is tight. Yet in many cases, the squeeze is self-imposed. It follows from equating fiscal responsibility with cutting deficits and debt, rather than with building an economy’s capacity to grow, withstand shocks, and meet its obligations over time. In fact, cutting spending in a weak economy can leave the debt-to-GDP ratio higher, not lower; and when fiscal rules bite, public investment is often the first thing cut.", "translation_ja": "", "vocab": []}, {"title_ja": "Lula miraculously beat the Brazilian far right and Donald Trump. But have no doubt: the region is still in peril | Jordana Timmerman", "title_en": "Lula miraculously beat the Brazilian far right and Donald Trump. But have no doubt: the region is still in peril | Jordana Timmerman", "summary_ja": "After the rejoicing, it will be vital to learn the lessons. The rightward shift is neither inevitable nor irreversible, but progressives cannot rest for a moment The impossible happened. President Luiz Inácio Lula da Silva won a fourth term in Sunday’s runoff election in Brazil, overturning Flávio B", "summary_en": "After the rejoicing, it will be vital to learn the lessons. The rightward shift is neither inevitable nor irreversible, but progressives cannot rest for a moment The impossible happened. President Luiz Inácio Lula da Silva won a fourth term in Sunday’s runoff election in Brazil, overturning Flávio B", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/26/brazil-lula-far-right-donald-trump-election", "state_media": false, "category": "オピニオン", "full_text": "The impossible happened. President Luiz Inácio Lula da Silva won a fourth term in Sunday’s runoff election in Brazil, overturning Flávio Bolsonaro’s first-round lead in a historic comeback. No candidate has ever lost the first round and won the second, until now. Grassroots mobilisation, alongside social welfare policies, helped turn the contest into a referendum on Brazilian democracy, rallying voters against a candidate seeking to restore the legacy of his father, Jair Bolsonaro, imprisoned for plotting a coup after his 2022 defeat. Lula’s victory suggests that defending democracy can still be a powerful electoral argument against the ascendant right.\nHaving already consolidated most of the leftwing vote, Lula had limited room to attract supporters of other candidates after his first-round defeat. His best chance lay in mobilising abstainers and reconnecting with working-class voters. The Workers’ party intensified its grassroots and digital campaigns, using social media influencers and messaging networks to reach supporters. Nearly 3 million more Brazilians voted in the runoff, and Lula gained ground across the country, particularly in major cities and his north-eastern strongholds. He also appealed to voters’ immediate economic concerns, drawing on a record of reducing poverty and inequality, and increasing benefits under Bolsa Família, the landmark welfare programme he launched in 2003. Lula framed the election as a choice between protecting social gains and democratic institutions, or returning to the Bolsonaro family’s attacks on both, warning that his opponent would compromise Brazil’s sovereignty by aligning himself with Donald Trump.\nThe implications extend far beyond Brazil. Lula’s victory interrupts a regional trend: rightwing candidates have won seven presidential elections across Latin America in the past 18 months. Two decades ago, Lula was among the leaders of Latin America’s pink tide, a succession of leftwing governments that reshaped the region’s politics and sought greater autonomy from Washington. Today, he finds himself resisting a new regional wave moving in the opposite direction, without a comparable coalition of allies.\nLula’s victory is welcome, but we shouldn’t forget that Flávio Bolsonaro won more than 48% of valid votes, demonstrating the enduring strength of a movement with substantial representation in an increasingly rightwing congress. His proposals on security and the economy appealed to voters frustrated by high living costs, including working-class Brazilians who had traditionally supported Lula. This mirrors the success of authoritarian-leaning rightwing candidates across the continent. Frustration with crime, economic insecurity and established political parties has propelled a new right promising tougher security policies and attacking progressive social agendas. From Nayib Bukele in El Salvador, to Javier Milei in Argentina, to the recent election of Abelardo de la Espriella in Colombia.\nThe emerging rightwing alliance is, in many ways, the mirror image of the pink tide, developing in close alignment with Trump and his ambitions to reassert US dominance over the hemisphere. The relationship is mutually reinforcing: rightwing leaders who gained ground through domestic discontent look to Washington to consolidate their power, while the US relies on those same governments and movements to advance its strategic interests. In his victory speech, Lula said the surge of street support in recent weeks “was a demonstration that this country refuses to be anyone’s back yard”. His declaration directly challenges the so-called Donroe doctrine, which asserts an expanded US role in policing the region.\nSince returning to office, Trump has used endorsements, sanctions, tariffs and financial assistance to reward allies and put pressure on opponents. He backed rightwing candidates in Honduras and Colombia. He has turned a blind eye to Salvadoran president Bukele’s negotiations with criminal organisations (Bukele denies having made an informal pact with these organisations). And ahead of Argentina’s 2025 legislative elections, he offered Milei a $20bn financial lifeline while warning that US generosity depended on the electoral outcome.\nSecurity provides a particularly powerful instrument for this alignment. The Trump administration has invoked the fight against “narcoterrorism” to expand its military role and apply pressure on governments to accept Washington’s priorities. Terrorist designations have helped justify the operation that captured Nicolás Maduro in Venezuela, threats of unilateral strikes against Mexican cartels and joint military operations in Ecuador. Washington has also discussed similar operations with Colombia. The designations do not themselves authorise military action, but they strengthen the administration’s justifications to intervene beyond US borders.\nBrazil demonstrates how this strategy can also serve Washington’s allies outside government. The Bolsonaro fam", "translation_ja": "", "vocab": []}, {"title_ja": "ドナルド・トランプは農村アメリカにとって大惨事だった", "title_en": "Donald Trump has been a disaster for rural America | Steven Greenhouse", "summary_ja": "著者は、トランプの政策が農民に壊滅的な影響を与えたと主張している。ディーゼル燃料の価格が70%近く上昇し、農場破産が急増し、貿易戦争が農業輸出を大幅に削減した結果、農村部の有権者の支持が急落している。その結果、カンザス州やアイオワ州などの伝統的な共和党支持地域で、民主党の上院議員候補が有利になるという異例の政治変化が起きている。", "summary_en": "The president’s policies have taken such a toll on farmers that Republicans face trouble in deep-red states Donald Trump’s policies have been a disaster for the nation’s farmers, so much so that a near electoral miracle may soon happen: Kansas, one of the deepest red, most rural states, may elect it", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/26/donald-trump-policy-disaster-rural-america", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump’s policies have been a disaster for the nation’s farmers, so much so that a near electoral miracle may soon happen: Kansas, one of the deepest red, most rural states, may elect its first Democratic senator in nearly a century.\nSince Trump won farm country handily in 2024, many rural voters in Kansas, Iowa and elsewhere have soured on him because the price of diesel fuel, a key input for farming, has soared by nearly 70%, because farm bankruptcies have surged and because Trump’s trade wars have significantly reduced agricultural exports.\nRural voters are so upset with Trump that polls show that Republican Senate candidates stand a good chance of losing in Kansas, Iowa, Nebraska and Texas, even though Trump won those rural states by 13 percentage points or more in 2024. No wonder Trump is hopscotching madly across Kansas, Iowa, and other states in the midterm campaign’s final weeks.\nNo one is saying that Trump deliberately hurt farmers, but when he plunged the US into the Iran war and his many trade wars, he showed little concern about what those decisions might mean for rural America. It was nearly inevitable that Trump’s moves would batter farmers – by pushing down soybean and other farm exports and by pushing up the price of fuel, fertilizer and farm equipment. Not only that, Trump’s proudest legislative achievement, his “big, beautiful bill”, further hammered farm country with its major cuts to food assistance and its $1tn in Medicaid cuts, which will cause an estimated 1.8 million rural Americans to lose health insurance.\n“He has sold out rural America with his policies,” said Jon Tester, a third-generation Montana farmer and former US senator.\nEven the Cato Institute, a Republican-friendly, conservative thinktank, slammed Trump over what he has done to farmers. A Cato commentary stated that while Trump calls this a “golden age” for farmers, the fact is that Trump’s “tariffs are inflicting serious damage” on farmers, increasing their input prices and causing their exports to decline by billions of dollars.\nThis helps explain why farm bankruptcies have jumped by 85% over two years ago.\nLittle wonder that a recent KFF/AP poll found that roughly six in 10 rural voters disapprove of how Trump is handling the economy, while about half believe the economy is in worse shape than when Trump returned to office.\nIndeed, many rural voters have turned against Trump – while nearly two-thirds backed him in 2024, now less than half, 49%, of rural voters say they support GOP candidates this fall, according to a Fox News poll.\nAt a recent news conference in Washington, John Hansen, president of the Nebraska Farmers Union, sought to convey the pain and anger many farmers feel. “Because of the misuse of tariffs, record high agricultural input costs, soaring fertilizer costs”, and “high interest rates”, Hansen said, farmers “are facing the worst economic and financial crisis since the farm crisis of the 1980s”, when many farms went under because of sky-high interest rates.\nIn a direct slap at Trump, Hansen added: “Just when farmers need to expand markets for their products, the president seems to be at war with our nation’s top three trading partners: Mexico, Canada and China. When trade wars break out, farmer noses always bleed first and worst and longest.”\nMany rural voters backed Trump in 2024 because he promised to cut prices, including energy prices, and vowed not to plunge the US into unnecessary, expensive wars overseas. But now many feel betrayed because Trump began an unnecessary, expensive war against Iran that caused diesel fuel – which farmers rely on for their tractors and combines – to soar to a record $6.52 a gallon in late September, before declining somewhat (to $6.32). This price spike – diesel averaged $3.75 a gallon before the war – cost most farmers thousands of extra dollars when many were barely breaking even.\n“Compared to last year, our fuel bill is $50,000 higher,” Vance Ehmke, a Kansas farmer, told the Hastings (Nebraska) Tribune, while “fertilizer, that’s going to be at least another $20,000 or $40,000 increase. That’s all due to Trump and his war in Iran. We are madder than hell about it.\n“I want to tell you that I am a Republican, and I’m pissed.”\nLast month, the American Farm Bureau Federation ran a bad news article saying “the record-high input cost environment”, meaning high diesel and fertilizer prices, means that “no major row crop”, such as soybeans or corn, “is projected to clear break-even” this year”.\nIn Texas, Kansas, Nebraska and other farm states, ranchers are fuming that Trump announced plans to import roughly 660m lb of tariff-free beef with the aim of cutting beef prices by 25% – one of the many ways Trump’s tariffs angered consumers was by pushing up beef prices. The National Cattlemen’s Beef Association voiced dismay about Trump’s beef imports, saying the move would undercut the struggling industry’s stability.\nThe North Carolina farmer Matt Bell had a warning for R", "translation_ja": "", "vocab": []}, {"title_ja": "民主党が大勝利を収めた場合、彼らは勝利から正しい教訓を学ぶだろうか？", "title_en": "If Democrats win big, will they learn the right lessons from their victory? | Jan-Werner Mueller", "summary_ja": "著者は、民主党が中間選挙で大勝する可能性があるが、その勝利の意味を正しく解釈することが重要だと主張しています。単にトランプ主義への反発や生活費問題だけでなく、共和党の国家安全保障と経済管理に対する信頼のイメージを払拭する歴史的機会として捉えるべきだと述べています。さらに、民主党は外交政策の失敗や人権侵害に対する公の反感を利用して、より広い戦略的課題に取り組むべきだと主張しています。", "summary_en": "No election outcome ever interprets itself. So how will Democrats interpret these results once they are known? Whichever metaphor one prefers – landslide, earthquake, wave – it seems increasingly like the Democrats can expect a significant victory in the midterms . As the joke goes, every gas statio", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/26/democrats-win-victory-lessons", "state_media": false, "category": "オピニオン", "full_text": "Whichever metaphor one prefers – landslide, earthquake, wave – it seems increasingly like the Democrats can expect a significant victory in the midterms.\nAs the joke goes, every gas station display of prices has become an ad for Democrats; what’s more, some of them have managed to connect the relatively abstract issue of corruption to the daily misery of many Americans.\nBut, in the end, no election outcome ever interprets itself; Democrats should not rest content with the conclusion that only what moderate leaders (and consultants) like to call kitchen table issues really mattered.\nThey have a historic opportunity to dislodge the image of the Republicans as the party of national security and the party best trusted with the economy.\nAfter 2024, Republicans massively benefited from elite actors – Silicon Valley oligarchs, no less than many journalists – reading a globally important “vibe shift” into the presidential election outcome; we now know that what political scientists politely call “low-information voters” were simply fed up with inflation, as opposed to a large majority thirsting for a far-right agenda.\nBut Trumpists turned the perception to their advantage; and to be sure, successful politicians are entitled to interpret a vote as they see fit.\nDemocrats could stay relatively timid and read the outcome as simply a rejection of Donald Trump and the most egregious elements of his misrule since January 2025; they certainly should make the point that the spectacular cruelty of ICE and the incitement to hatred in which Stephen Miller and JD Vance regularly engage is deeply unpopular with the public. But it would be a mistake to see the outcome as only a referendum on Trumpism.\nTrue, the US president’s catastrophic record in foreign policy is partly explained by conduct the old Republican establishment could never have imagined: recklessly alienating allies, with the result that the US may never be trusted by Nato countries again; massively destroying soft power by mistreating foreign students and undermining the capacity of American universities to attract talent internationally; blatant interference in elections to favor the global far right.\nBut the Iran war shows continuities with the George W Bush era that neoconservatives probably find uncomfortable to contemplate: an inability to think strategically and an apparent indifference to loss of human life. In fact, a line can be drawn from the torture memos to the murders at sea and the plans for a public execution under the US secretary of defense, Pete Hegseth.\nYet the Republican party still lives off an image that the party of Ronald Reagan is supremely competent in matters of national security. The right response is not that Democrats should not enter a competition of how often they can use the word “lethality” in one sentence; they should simply point out how shameful it is that Republicans, some murmuring on the part of has-beens like Thom Tillis aside, have betrayed Ukraine; how damaging the loss of bases in the Middle East will turn out to be; and that, from the very beginning of Trump 2.0, it was a sign of deep unseriousness to put a second-rate TV host in charge of the world’s most powerful military force. There might be monuments to both Trump and Hegseth in Moscow and Beijing one day; after all, they effectively capitulated to the former and sped up the rise of the latter.\nThe Republican party has also long benefited from the notion that, as the party of business, they are best qualified to boost the economy (no doubt, some low-information voters still buy into the myth of Trump as the great entrepreneur).\nThe actual record has long shown something different: not just when it comes to Trump and his string of bankruptcies, but for the party as a whole. Since Trump engaged in policies so irrational and damaging that the old Republican establishment would never have contemplated them – tariffs being the obvious example – it is again easy to overlook continuities.\nThe party that claims to be deeply concerned about debt and deficits (one of Elon Musk’s disingenuous justifications for Doge’s chainsaw massacres) has given us Reagan, Bush and Trump – all of whom managed massively to increase the national debt. The reason is, of course, that they pushed through enormous tax cuts that overwhelmingly benefited the wealthy.\nIn the postwar period, economic growth, job creation and even stock market returns have on the whole been higher under Democratic administrations; it just seems that average gains are not enough for the uber-wealthy, who can buy themselves tax cuts by donating massively to Republicans.\nNeedless to say, as soon as Democrats are in charge, Republicans discover that the very debt they were instrumental in causing constitutes a national crisis and requires deep cuts to social security.\nConventional wisdom has it that the Biden administration overreached: too woke, too ambitious a Green New Deal, too harsh in its criticisms of Maga Republi", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナにおける新たなエネルギー膠着状態", "title_en": "The New Energy Stalemate in Ukraine", "summary_ja": "本稿は、トランプ政権がウクライナのロシア製油所への攻撃を停止するよう要求し、ロシアへの制裁を緩和する中で、ウクライナが直面する厳しいエネルギー戦の状況を分析している。しかし著者は、ウクライナがロシアのエネルギーインフラに対して効果的なドローン攻撃を続けており、ロシアの製油能力を約30%削減させるなど、革新的な適応戦略を展開していることを指摘する。同時に、ロシアもウクライナのエネルギー施設に対する攻撃を大幅に増加させており、双方が急速に進化するエネルギー戦争の中で激しく対抗している状況を描いている。", "summary_en": "Tatiana Mitrova, a fellow at Columbia University’s Center on Global Energy Policy and former energy scholar at Moscow’s Russian Academy of Sciences, and Sergey Vakulenko, an oil and gas expert at Carnegie’s Russia Eurasia Center, argue that Russia and Ukraine are locked in an energy war that has bec", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/new-energy-stalemate-ukraine", "state_media": false, "category": "オピニオン", "full_text": "In the days since U.S. President Donald Trump’s highly public falling out with Ukraine and growing rapprochement with Russia, Kyiv’s prospects going into the fifth winter of war look grim. The Trump administration has demanded that Ukraine suspend its attacks on Russian refineries, which have been one of Ukraine’s most effective means of putting pressure on Moscow. Meanwhile, Kyiv faces dangerous gaps in its air defenses against Russia’s jet-powered drones and stepped-up use of ballistic missiles. And Trump has entered into a deal with Russian President Vladimir Putin that temporarily waives U.S. sanctions on Russian diesel exports, offering Moscow a diplomatic win. Trump’s envoys have also proposed that Europe increase purchases of Russian gas as part of an effort to gain the Kremlin’s support for peace—further complicating the efforts of Ukraine and its remaining allies to squeeze Russia.\nYet missing from this bleak picture are the ways that Ukraine has already adapted to escalating attacks. Kyiv has developed innovative strategies to mitigate the impact of Russian energy strikes and keep its grid running, even amid intense bombardment. And despite the new U.S. pressure, Ukraine has continued to launch powerful drone strikes against Russia’s energy infrastructure, including successful mid-October attacks on an oil terminal in St. Petersburg and industrial gas processing plants as far away as Surgut and the Novy Urengoy, 1,800 miles from the Ukrainian border. Overall, since mid-2025, Ukrainian drone strikes have reduced Russian refinery throughput by roughly 30 percent; they have also eroded a significant share of Moscow’s excess refining capacity, resulting in a gasoline shortfall of about ten percent.\nStill, this is only one part of a rapidly evolving energy war. Moscow has developed its own ways to limit the effects of Ukrainian strikes. And it has intensified its assault on Ukrainian infrastructure, including an October 19 barrage that damaged more than ten energy facilities. DiXi Group, a Ukrainian think tank, has estimated that Russia launched 12,800 missiles and drones at Ukrainian energy facilities in 2025 and early 2026, compared with just 2,800 during the first three years of the war combined. Although these figures count launches rather than successful strikes, they show how massive and relentless the Russian campaign has become.\nMoreover, both sides are now able to target the substitutes and reserves that in the past could be used to cushion losses. Following Russian strikes on local power plants in early October, Ukrainians experienced widespread blackouts, even though Ukraine’s national grid had electricity to spare, because Russia continued hitting the lines and substations carrying the reserve power. During the summer, Ukraine hit so many of the refineries and pipelines around Moscow that Russia was forced to bring fuel by rail from as far as Lake Baikal, thousands of miles away.\nIf U.S. pressure and negotiations cannot stop the energy war, the central question for Ukraine is whether its remarkable capacity to adapt can keep pace with Russian attacks. At the same time, its fortunes this winter will depend on whether it can continue to hit Russian infrastructure in ways that challenge Moscow’s ability to repair and rebuild. Both Russia and Ukraine must now protect and repair their entire national networks around the clock; attackers can concentrate on the most vulnerable sites and strike again as soon as repairs are done. In such a war, defensive ingenuity matters as much as offensive capability. In the end, energy attacks alone are unlikely to force either side to accept the other’s terms, neither side may be able to gain a decisive advantage, even as both incur mounting costs. Recognizing the limits, as well as the power, of these strikes may be crucial not only to ending the present conflict but also to understanding the role that energy infrastructure will likely play in future wars.\nTHE RACE AGAINST ROCKETS\nFor Ukraine, international support has been especially crucial in containing Russia’s energy barrage. As of November 2025, before the worst of last winter’s attacks, Ukraine had suffered $17.1 billion in direct damage to its electricity infrastructure, according to a report by the UN, the World Bank, and the European Commission. Yet Kyiv was able to keep the electricity flowing by drawing on the country’s remaining nuclear plants; repairing thermal generation facilities; increasing electricity, gas, and diesel imports; and compensating for lost power plants with distributed generation—smaller units running on solar, wind, gas, and diesel energy that are connected to the main grid.\nEurope has also provided crucial replacement technology. In 2025, the European Commission delivered equipment from a retired Lithuanian thermal power plant to Ukraine in 149 shipments, enabling Ukraine to provide power to one million people. Such transfers have turned foreign utilities and suppliers into pa", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの選挙が変わらないもの", "title_en": "What Israel’s Election Won’t Change", "summary_ja": "本稿は、イスラエルの10月27日の選挙でネタニヤフ首相が敗北しても、パレスチナ人への対応やイランとの関係を含む外交政策はほぼ変わらないと主張しています。野党指導者アイゼンコットは民主的制度の保護ではネタニヤフと異なりますが、イスラエルの主要政党のほぼすべてがパレスチナ国家樹立に反対しており、ガザでの戦争やイラン攻撃を正当化しています。両者の主な違いは、西岸地区の入植者による攻撃への対応姿勢に限定されています。", "summary_en": "The constraints and costs of the new security consensus.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/israel/what-israels-election-wont-change", "state_media": false, "category": "オピニオン", "full_text": "When Israelis go to the polls on October 27, much of the world will be rooting for the defeat of the country’s longtime prime minister, Benjamin Netanyahu. Under his nearly two decades of rule, Israel has become steadily more aggressive. It has abandoned any pretense of supporting a two-state solution; started constructing hundreds of new Jewish settlements in the West Bank; and, following Hamas’s cross-border attack on October 7, 2023, laid waste to the Gaza Strip, occupied parts of Lebanon and Syria, and launched war against Iran, its archnemesis. Meanwhile, its democratic institutions have faced endless attacks by Netanyahu and his allies, who have proposed laws that would, among other things, greatly curtail the power of Israel’s courts. Should he return to power for an unprecedented seventh term, many fret that the country will permanently transition into a rogue theocratic actor.\nTo many voters, this election thus marks a crucial turning point in Israeli domestic policy. The prime minister’s main political opponent, former Israel Defense Forces Chief Gadi Eisenkot, holds a more liberal worldview than his competitor. He supports an independent judiciary, a free press, and a professional civil service. Should he win, he will likely try to reverse Netanyahu’s efforts to curtail each institution’s independence.\nBut an Eisenkot victory is unlikely to change Israel’s foreign policy or approach to the Palestinians. Almost all of Israel’s Jewish political parties, Eisenkot’s included, are opposed to Palestinian statehood, not just Netanyahu’s Likud. They all believe that Israel’s brutal war on Gaza was morally just and practically necessary. And almost all of them think that Israel was right to attack Iran and to establish and create what its government and military call “security zones”—occupied territory—in Lebanon and Syria. In fact, the only real disagreement between Eisenkot and Netanyahu on matters of security is whether the latter made the right tactical decisions in each of these conflicts, such as when Netanyahu rejected a cease-fire in Gaza that would have freed Israeli hostages earlier.\nThat is not to say he will follow exactly the same course. Eisenkot and Netanyahu differ in important ways on the barrage of West Bank settler attacks against helpless Palestinians, which are aimed at driving them out of their land. The prime minister, committed to his far-right allies, shrugs off the issue, whereas his competitor calls their behavior “Jewish terror.” Even if Eisenkot has little pity for the Palestinian victims, he realizes that the West Bank is on the verge of a bloody explosion and that Israel is at risk of even greater international opprobrium because of its reckless policy there. But overall, no matter what happens in the elections, Israel will continue to repress the Palestinians and strike its enemies. It will thus face diplomatic and economic costs, as the country’s frustrated partners begin cutting off aid and perhaps even enacting sanctions.\nSTYLE OVER SUBSTANCE\nThere are many issues at play in Israel’s election. Politicians, for example, have debated ultra-Orthodox exemptions from the draft, Netanyahu’s corruption charges, and what, if anything, the government should do about Jewish terrorism. But on the whole, the contest has been focused on who is to blame for failing to stop Hamas’s October 7 attack, which killed 1,200 Israelis and resulted in 251 more being taken hostage in one day. The opposition has argued that Netanyahu is responsible for the country’s worst-ever security failure, pointing out that he sustained Hamas with Qatari money, ignored intelligence warnings about Hamas plots, and then blocked an independent investigation into what happened. Eisenkot, who lost a son and two nephews to fighting in Gaza, has been particularly unsparing in his criticism, repeatedly hammering Netanyahu for refusing to take any accountability for the calamity. The prime minister and his supporters, for their part, have brushed off these accusations. Instead, they have blamed October 7 on the military and security services. They have also promoted conspiracy theories that there is what Netanyahu’s cronies and supporters call “treason from within”—or that someone inside Israel helped facilitate Hamas’s brief invasion.\nBut despite this blame game, both sides agree on the tragedy’s primary lessons: that Israel is surrounded by diehard merciless enemies and that the Palestinians can never be trusted. This attitude is, in part, a raw expression of anti-Arab racism, which is more visible in Israel’s post–October 7 Jewish society. But it is also an electoral play. If the polling is correct, Eisenkot will need the support, however tacit, of Israel’s two Arab parties to put together a government. Netanyahu is thus trying to win over voters who, much as they hate him personally, cannot stand the idea of a government propped up by Palestinians.\nThis strategy is unlikely to work on liberal Israelis, who view t", "translation_ja": "", "vocab": []}, {"title_ja": "ブラジルの経済的行き詰まり", "title_en": "Brazil’s Economic Impasse", "summary_ja": "著者は、ブラジルが債務危機と低成長に直面する中、右翼政党の躍進により市場関係者は大胆な改革への期待を高めているが、ボルソナロ候補の勝利はこの期待を満たさないと主張している。ボルソナロ政権が実施する可能性のある政策は、必要な財政再建につながらず、むしろ政治的不安定性を増す恐れがあるという。著者は、ブラジル経済が真の危機を回避するには、権威主義的な政治ではなく、責任ある経済政策が必要だと強調している。", "summary_en": "Monica de Bolle, an expert in Brazilian economic policy, makes an authoritative argument that Brazil’s economic problems will persist no matter the outcome of the country’s presidential election. A Flávio Bolsonaro administration would fare no better than Lula when it comes to reducing debt and deli", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/brazil/brazils-economic-impasse", "state_media": false, "category": "オピニオン", "full_text": "On October 5, the day after the first round of Brazil’s general elections, the country’s financial markets were euphoric. Brazil is struggling with high debt and low growth, and investors are eager for leaders to reduce budget deficits, deregulate, cut taxes, and perhaps even privatize state assets. After nearly four years under the left-wing President Luiz Inácio Lula da Silva, known as Lula, who has been slow to implement such measures, investors hope a right-wing government will create opportunities for bold reform.\nRule by the right might be exactly what Brazil gets. The far-right Liberal Party made substantial gains in the legislature, becoming the single largest party in both the Senate and the Chamber of Deputies. Its presidential candidate, Flávio Bolsonaro, the son of the notorious former President Jair Bolsonaro, led the aging incumbent, Lula, by nearly two percentage points in the first round of voting. Lula has shown himself capable of impressive political comebacks, but Flávio Bolsonaro is still the favorite in the runoff vote scheduled for October 25.\nEven if Bolsonaro wins, however, the prospects for the Brazilian economy are dim. The policies he has put forward are nothing close to the substantial fiscal consolidation program that will be necessary to bring down debt and stimulate private investment, and his determination to weaken Brazil’s political institutions creates the kind of uncertainty that scares investors away. Economic growth has been sluggish under Lula, whose administration has struggled to relieve the high debt burdens afflicting the public sector and households. What would truly doom the country to economic crisis, however, is the kind of authoritarian-inspired politics that a Bolsonaro government could usher in.\nCRISIS IN THE MAKING\nBrazil is in serious economic trouble. The country’s sovereign debt ratio has ballooned to 83 percent of GDP, fiscal deficits leave no room for additional government spending, and high interest rates are hurting consumers and investors. Meanwhile, the Iran war h let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-27 00:09 JST";
  renderTabs();renderList();
})();
</script>
</body>
