-totalenergies-deepens-support-for-vulnerable-nigerians.html", "state_media": false, "category": "社会", "full_text": "TotalEnergies has reaffirmed its commitment to supporting organisations that provide care and rehabilitation for vulnerable people in Nigeria.\nThe Country Chair of TotalEnergies Companies in Nigeria, Matthieu Bouyer, gave the assurance at the 2026 TotalEnergies Charity Golf Tournament in Port Harcourt on Sunday.\nMr Bouyer said the company’s continued investment in charitable organisations reflected its commitment to supporting communities and improving lives.\nHe also said the tournament aimed to raise funds for two organisations whose activities focused on vulnerable people.\nThe News Agency of Nigeria (NAN) reports that the beneficiaries include the Little Sisters of the Poor Home for the Elderly in Enugu and Rosaline Home Rehabilitation Centre in Ogale, Eleme, Rivers State.\nMr Bouyer said the Little Sisters of the Poor had cared for elderly people in difficult circumstances for more than five decades, irrespective of their backgrounds or religious affiliations.\n“The home provides accommodation, meals, medical attention and daily assistance to its residents,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe described Rosalie Home Rehabilitation Centre, run by the Daughters of Charity of St. Vincent de Paul, as another important beneficiary.\nHe said the centre provides care and rehabilitation for women living with mental health conditions who have experienced homelessness or abandonment.\n“One tournament cannot meet every need. But a well-directed donation makes a real difference,” he said.\nMr Bouyer said TotalEnergies would supplement the proceeds from the tournament to support the two charities, urging participants and well-wishers to contribute towards their agreed priorities.\n“The impact of the competition will be measured not only by sporting achievements but also by improvements in the lives of vulnerable people and communities,” he said.\nNAN reports that TotalEnergies donated N5 million each to the two charitable organisations to support vulnerable persons in their care.\nAppeal for further assistance for elderly people’s home\nReceiving the donation, Mary Jacinta, mother superior of the Little Sisters of the Poor Home for the Elderly, Enugu, commended TotalEnergies for its support.\nShe appealed for further assistance to improve the facilities and care provided for the home’s more than 46 residents.\nShe said the home, established in 1975, catered for elderly people, many of whom were physically challenged and battling age-related illnesses.\nREAD ALSO: Nigeria signs MoU with World’s largest pivot irrigation manufacturer to drive ‘Irrigate Nigeria Programme’\nMs Jacinta, a reverend sister, also said that most of the residents depended on others for their personal needs and required constant attention and assistance.\nShe said the home relied entirely on public charity, adding that the sisters dedicated their lives to caring for the elderly without receiving salaries.\n“We stay in the same house with the old people. We share everything with them and are available day and night to provide care.\n“Our aim is always to make the old people happy,” she said.\nMs Jacinta described TotalEnergies’ support as a welcome surprise, saying it would help the home address some of its pressing needs.\nShe added that beyond providing food, clothing, medical attention and daily care, the home was seeking funds to renovate residents’ rooms and improve their comfort.\nThe reverend sister explained that the home needed adjustable medical beds to help caregivers position residents’ heads and legs according to their medical and personal needs.\nShe identified unreliable electricity and inadequate water supply as challenges, adding that the home planned to install solar power and construct a borehole.\nShe appealed to individuals, organisations and well-wishers to support the home in improving the welfare of its elderly residents.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "NPFL速報：リバース・ユナイテッドとバラウが大勝利、レンジャーズが首位を維持", "title_en": "NPFL Roundup: Rivers, Barau record big wins as Rangers maintain lead", "summary_ja": "ナイジェリア・プレミアフットボールリーグ第14節でリバース・ユナイテッドがニジェール・トルネードを6-0で圧倒し、サムソン・オラスポが後半ハットトリックを達成しました。バラウFCもインター・ラゴスに5-0で勝利し、首位のレンジャーズ・インターナショナルは2-0でシューティング・スターズを破り、28ポイントでリードを維持しています。", "summary_en": "Rivers United and Barau FC recorded emphatic victories, while Rangers strengthened their grip on the summit with victory over 3SC. The post NPFL Roundup: Rivers, Barau record big wins as Rangers maintain lead appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/sports/football/927310-npfl-roundup-rivers-barau-record-big-wins-as-rangers-maintain-lead.html", "state_media": false, "category": "政治", "full_text": "Rivers United produced the biggest result of Matchday 14 of the Nigeria Premier Football League (NPFL), thrashing Niger Tornadoes 6-0 on Sunday, as Rangers International maintained their position at the top of the table.\nSamson Olasupo scored a second-half hat-trick at the Adokiye Amiesimaka Stadium in Port Harcourt to cap Rivers United’s dominant display, while Barau FC also recorded a convincing 5-0 victory over Inter Lagos.\nRivers United took an early lead in the 13th minute through an own goal by Moses Obioma before Temple ThankGod doubled the advantage in the 29th minute. Shola Oladunjoye added a third three minutes later to leave the visitors facing a difficult afternoon.\nOlasupo then took centre stage, scoring in the 63rd, 87th and 90+4th minutes to complete his hat-trick and hand Tornadoes their heaviest defeat of the campaign.\nThe victory moved Rivers United to fifth place with 22 points from 13 matches, keeping them within six points of leaders Rangers, who have played the same number of games.\nBarau FC were equally ruthless against Inter Lagos, securing a 5-0 win with Joseph Atule scoring three times. Atule found the net in the 34th, 66th and 87th minutes, while Ayoola Ibrahim scored before half-time and Adamu Hussain added another in the 79th minute.\nThe result lifted Barau to third place with 23 points, level with Nasarawa United but ahead on goal difference.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nRangers maintained their lead with a 2-0 home victory over Shooting Stars in Awka. James Emo opened the scoring in the 14th minute before Chidiebere Nwobodo sealed the win in the 74th minute, taking Rangers to 28 points from 13 matches.\nNasarawa United also moved into the top four after beating Warri Wolves 2-0 in Lafia. Kelechi Ogbodo headed home in the 25th minute before Jofrank Joshua converted an 83rd-minute penalty to secure the points for the hosts.\nIn Aba, the Oriental derby between Abia Warriors and Enyimba ended goalless, leaving both sides on 12 points and deep in the relegation battle.\nREAD ALSO: Former NFF Vice President Uchegbulam loses wife\nKun Khalifat FC edged Katsina United 1-0 through Innocent Arigu’s 17th-minute own goal, while Saturday’s fixtures saw Kano Pillars beat Ikorodu City and Doma United defeat Bendel Insurance by identical 1-0 margins.\nRanchers Bees drew 1-1 with Plateau United, while Sporting Lagos and Kwara United also shared the points.\nRangers remain top of the standings with 28 points from 13 games, followed by Kano Pillars on 25 points. Barau FC and Nasarawa United occupy third and fourth positions respectively with 23 points, while Rivers United are fifth on 22 points, with a game in hand. Bendel Insurance are sixth on 21 points.\nPlateau United, Doma United and Katsina United are seventh, eighth and ninth respectively, all on 20 points, while Ikorodu City and Shooting Stars occupy 10th and 11th positions with 18 points apiece. Niger Tornadoes are 12th on 17 points.\nSporting Lagos, Ranchers Bees and Kun Khalifat are 13th, 14th and 15th respectively with 16 points, although Sporting Lagos have played only 12 matches. Kwara United and Warri Wolves sit 16th and 17th on 14 points, while Enyimba and Abia Warriors occupy the bottom two positions with 12 points each. Inter Lagos remain bottom with seven points after a three-point deduction, while Warri Wolves have also been docked three points for infractions.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": []}, {"title_ja": "アクワ・イボム州警察がエノ知事、アクパビオ上院議長ら254人の警察官を表彰", "title_en": "Police in Akwa Ibom honour Gov Eno, Akpabio, 254 officers", "summary_ja": "ナイジェリア警察のアクワ・イボム州司令部は、ウモ・エノ州知事、ゴッズウィル・アクパビオ上院議長、および254人の警察官を対象に表彰式を開催し、同州の治安維持と警察活動への貢献を認めました。表彰式ではこれら受賞者に加え、22人の治安関係者や4つの関連機関の司令官も警察活動への支援と協力を評価されました。州警察司令官のババ・アザレ警視正は、献身的で多くが認識されない警察官の役割と貢献を表彰することの重要性を強調しました。", "summary_en": "The awards were presented at the Command's Award and Dinner Night held at Ibom Hall, Uyo, on Saturday, according to a statement issued on Sunday by the police spokesperson, Timfon John, a deputy superintendent of police. The post Police in Akwa Ibom honour Gov Eno, Akpabio, 254 officers appeared fir", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/south-south-regional/927307-police-in-akwa-ibom-honour-gov-eno-akpabio-254-officers.html", "state_media": false, "category": "政治", "full_text": "The Nigeria Police Force, Akwa Ibom State Command, has honoured the Governor of Akwa Ibom State Umo Eno, Senate President Godswill Akpabio and 254 police officers at an award ceremony in Uyo, recognising their contributions to security and policing in the state.\nThe awards were presented at the Command’s Award and Dinner Night held at Ibom Hall, Uyo, on Saturday, according to a statement issued on Sunday by the police spokesperson, Timfon John, a deputy superintendent of police.\nThe ceremony also recognised 22 other security stakeholders, including commanders of four sister security agencies, for their contributions to security operations and collaboration with the police.\nThe Commissioner of Police, Baba Azare, said the awards were intended to recognise officers whose dedication and sacrifices often go unnoticed despite their role in protecting lives and property.\nHe said the 254 recipients were drawn from different ranks, divisions and formations across the command, adding that the initiative was designed to promote merit, discipline and operational excellence.\nMr Azare also recognised 22 individuals and stakeholders for supporting police operations, particularly those who accompanied security personnel during operations in difficult terrains, including creeks and waterways.\nThe four commanders of sister security agencies were honoured for their contributions to inter-agency collaboration and operational coordination.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nEno, Akpabio receive awards\nMr Akpabio received an award in recognition of his contributions and support to the security sector, while Mr Eno was recognised for his leadership and support for security agencies in the state.\nIn an unusual recognition, the command also honoured Ezra Obareki, the governor’s grandson, for his affection and positive disposition towards the police.\nThe governor’s chief security officer, aide-de-camp, principal security officer and Government House camp commandant were also recognised for their services.\nPolice seek public cooperation\nMr Azare reaffirmed the command’s commitment to intelligence-led policing, professionalism, respect for huma s Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1QTkF5Slh6OGRNUnVkQmMtc0ZkX0VmU0xpNko0X3RvNF82TFcxc3RjSDBQTS1VZEs2bjNkWFVDQy13VzFocXk1SXNPS2ZPekdJdW8tNDJ0NA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、株式市場の変動性の中でさらに空売りを厳格化", "title_en": "Taiwan further tightens short-selling amid stock market volatility - Focus Taiwan", "summary_ja": "台湾は株式市場のボラティリティに対応するため、空売り規制をさらに強化している。この措置は市場の過度な変動を抑制し、投資家を保護することを目的としている。規制当局は市場の安定性を維持するため、継続的に監視と対策を強化している。", "summary_en": "Taiwan further tightens short-selling amid stock market volatility Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE5sbU9rZUZWWVU4TTBKcWxYOFdpVHZqZ2wtMVdxLS1YVnFGckJBRW1yR2s0TTV0OU92OUxuR1pvcXBtXzN1c1lFRVBCMkJlUkk1aW55a0tKSQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "2026年選挙 地方選挙1週間前、台湾の各政党が選挙活動を加速", "title_en": "2026 ELECTIONS Taiwan parties ramp up campaigning one week before local elections - Focus Taiwan", "summary_ja": "台湾の地方選挙が1週間後に迫る中、各政党は選挙活動を本格化させている。与野党が支持者獲得に向けて積極的なキャンペーンを展開しており、選挙戦は最終段階に入っている。2026年の地方選挙は台湾の政治情勢を占う重要な選挙となっている。", "summary_en": "2026 ELECTIONS Taiwan parties ramp up campaigning one week before local elections Focus Taiwan", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1CUl9pME5UUnFCQjYxc2F1ZjRCZ1VrZldQYlo0VGE1VDRObnJGamJSWUFtb295XzhUa1FkQWh5NzFoYmtWR3l5VmRRSmNjeU96OEwzd0E0VQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カラコルムからアラビア海へ 第9話：新しい道、新しい機会", "title_en": "From Karakoram to Arabian Sea, Ep. 9: New Roads, New Opportunities", "summary_ja": "CGTNは、カラコルム地域からアラビア海に至るインフラプロジェクトの進展について報告しています。本エピソードでは、新たに整備された道路がもたらす経済的機会と地域発展の可能性を紹介しています。このドキュメンタリーシリーズは、中国が進める大規模インフラ投資による地域統合の取り組みを追跡しています。", "summary_en": "From Karakoram to Arabian Sea, Ep. 9: New Roads, New Opportunities", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-21/From-Karakoram-to-Arabian-Sea-Ep-9-New-Roads-New-Opportunities-1SfIIUGLfMY/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "歴史的な3国会談が世界にもたらす意味", "title_en": "What a historic trilateral meeting means to the world", "summary_ja": "CGTNは、中国・ロシア・米国の3国会談が世界に前向きなシグナルを送っていると報じている。国際的な専門家らによれば、この会談は地域および世界的なコミュニティに対して重要な影響をもたらすとCGTNは伝えている。", "summary_en": "The China-Russia-US trilateral meeting sends a positive signal to the world and carries significant implications for the regional and broader global community, international experts say.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-21/What-a-historic-trilateral-meeting-means-to-the-world-1SfmGLCdn8s/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジョン・リー香港長官が香港の発展優先事項を明示", "title_en": "John Lee outlines Hong Kong's development priorities", "summary_ja": "CGTNが報道するところによると、ジョン・リー香港特別行政区行政長官は香港の発展における優先事項の概要を示した。同報道は、香港の今後の政策方針に関する長官の見解を伝えている。", "summary_en": "John Lee outlines Hong Kong's development priorities", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-11-19/John-Lee-outlines-Hong-Kong-s-development-priorities-1ScEFFKV0ME/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナで戦うフランス兵は身元不明のまま死亡—ロシア治安機関", "title_en": "French soldiers fighting for Ukraine die nameless — Russian security forces", "summary_ja": "ロシア治安機関の情報筋によると、外国人戦闘員が戦闘任務に派遣されると、「彼らの痕跡は消える」と報告されている。TASS/RTは、ウクライナで戦死したフランス兵の身元特定が困難になっていると主張している。ロシア側は、外国人傭兵の死亡記録が隠蔽されていると指摘している。", "summary_en": "According to a source in the law enforcement and security agencies, once foreigners are sent on a combat mission, \"their trail goes cold\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/defense/2223115", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナ経済は破壊され外部補助金のみに依存—ロシア特使", "title_en": "Ukraine’s economy destroyed and can only use external subsidies — Russian envoy", "summary_ja": "ロシアの特使ロディオン・ミロシュニク氏は、ウクライナの経済は破壊されており外部補助金にのみ頼ることができると述べたとTASS/RTが報じています。同氏は、これらの補助金が「プロジェクトを可能な限り膨張させている」と付け加えたと伝えられています。", "summary_en": "Rodion Miroshnik added that the subsidies are inflating \"the project as much as possible\"", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2223113", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "MT-Lab、年2基の民間KOEN衛星打ち上げを計画—開発企業が発表", "title_en": "MT-Lab to launch two private KOEN satellites per year — developer", "summary_ja": "TASs/RTが報じたところによると、MT-Labの企業代表は、民間向けのKOEN衛星を年間2基打ち上げる計画を明らかにした。同社は、コンソーシアム自体の施設を使用して生産を行う予定としている。", "summary_en": "A company representative said that production is planned to be carried out using the consortium’s own facilities", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/science/2223111", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジャーナリズムはAIの単なる食料以上になれる", "title_en": "Journalism Can Be More Than AI Fodder", "summary_ja": "AIが情報環境を根本的に変える中で、ニュース出版社はビッグテックのコンテンツ供給業者に成り下がるリスクに直面している。独立性を保つために、メディア企業は自らのアーカイブと専門知識を活かしてAIツールを開発し、情報の出所を検証し信頼性を判断する能力を備える必要があると著者は主張している。そうしなければ、編集方針を独立して決定し公共の利益に奉仕する能力を失うことになるだろう。", "summary_en": "As AI fundamentally alters the information environment, news publishers risk becoming little more than content suppliers for Big Tech. To avoid that fate, many are drawing on their archives and expertise to develop AI tools that allow them to operate and compete on their own terms.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-could-be-a-new-moneymaker-for-news-publishers-by-ryan-powell-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nJournalism Can Be More Than AI Fodder\nAs AI fundamentally alters the information environment, news publishers risk becoming little more than content suppliers for Big Tech. To avoid that fate, many are drawing on their archives and expertise to develop AI tools that allow them to operate and compete on their own terms.\nVIENNA—A healthy information environment depends on supply and demand for quality inputs. To remain competitive and independent in an AI-powered ecosystem, news outlets, publishers, research institutes, and NGOs will need to develop their own skills and tools for establishing where information comes from and whether it can be trusted. Otherwise, they will lose the independence they need to set their agenda in dialogue with audiences and serve the public interest.", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカ経済を現実のままで統治する", "title_en": "Governing African Economies as They Are", "summary_ja": "著者は、アフリカがその発展課題を克服するために、それらの課題を生み出した同じ知識体系と経済システムを適用することはできないと主張している。先進国の富は奴隷制度と植民地支配から構築されており、現在のデジタル・グリーン移行もこの不平等な力学を再現する危険性があるという。アフリカの現実に対応するには、特に非公式経済部門（労働者の87.6%）を認識し、各国の特定のニーズに適した発展経路を可能にするため、3つの根本的な知的転換が必要だと述べている。", "summary_en": "Africa cannot overcome its development challenges by applying the same knowledge, economic, and innovation systems that helped create them. Imagining and governing new ways forward will require three intellectual ruptures.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/development-institutions-must-abandon-outdated-assumptions-about-africa-by-geci-karuri-sebina-and-stacey-leigh-joseph-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nGoverning African Economies as They Are\nAfrica cannot overcome its development challenges by applying the same knowledge, economic, and innovation systems that helped create them. Imagining and governing new ways forward will require three intellectual ruptures.\nJOHANNESBURG—The international order is fragmenting just as cracks are widening in countries’ prevailing development model, and as climate and debt crises are leaving governments with less room to maneuver. Despite this, multilateral institutions continue to steer African countries toward the same old destination: a formal economy grounded in industrial employment, with steadily rising GDP supported by technology transfer from foreign partners.\nBut that destination was never neutral or universally available. Advanced economies’ wealth was built on slavery and colonial extraction: the appropriation of land, labor, and resources. The digital and green transitions, which require African minerals, data, and labor, risk reproducing this dynamic and deepening inequality. Already between 2000 and 2024, the richest 1% globally captured 41% of all new wealth, while the bottom half of humanity gained just 1%.\nAfrica cannot escape its development challenges by applying the same knowledge, economic, and innovation systems that helped create them. Reform risks reproducing the inequalities that we claim to oppose. Closing the gap between the economies our institutions were designed to manage and the realities they now confront will require three fundamental intellectual ruptures, with multilateral development banks, donor agencies, NGOs, and African governments abandoning outdated assumptions and enabling societies to realize pathways suited to their specific and varied needs.\nThe first rupture concerns what counts as economic and innovative value. In Sub-Saharan Africa, 87.6% of workers are informally employed—often without security, protection, or policy recognition—usually combining wage work with trading, farming, care, platform gigs, remittances, and community enterprise. These economic arrangements are not temporary. They are durable ways of surviving and creating value, and they cannot be easily absorbed by a modern formal economy.\nDevelopment institutions, however, continue to treat formal firms and salaried workers as the norm. Requirements such as formal registration, tax compliance, and conventional collateral frequently determine who can access public procurement, development finance, and business support. Instead of simplistically seeking to “formalize” people into institutions that were designed without them in mind, policymakers should extend protection without erasing hybridity; recognize cooperative, communal, and informal production; and consider not just whether innovation generates growth, but also who owns it, who benefits, and who bears its risks.\nThe second rupture pertains to knowledge and authority. Development institutions must recognize African organizing logics: the relational ways in which people on the continent already produce knowledge, coordinate resources, and exercise authority. Innovation has never been confined to multinationals, laboratories, universities, and ministries. It also emerges through apprenticeship, communal stewardship, repair cultures, civic tech groups, informal production networks, and distributed governance systems, as well as in urban agglomerations and encounters between Indigenous and scientific knowledge. Yet finance and decision-making remain concentrated in central governments and elite institutions.\nBLACK FRIDAY SALE\nSave $50 on a new subscription\nThis Black Friday, a PS subscription starts at $39.99. You can read every new commentary from the likes of Joseph Stiglitz, Claudia Goldin, Raghuram Rajan, and Mariana Mazzucato, and explore an archive of 26,000 more prescient analyses by the world’s leading thinkers. With the year ahead promising to be a volatile one, few investments will serve you better\nDevelopment institutions must recognize marginalized actors as knowledge producers and share resources and authority accordingly, rather than merely inviting them into established, imposed programs. That means financing community and informal innovators directly, supporting intermediaries who can work across different knowledge systems, and preserving locally generated knowledge.\nSudan’s Emergency Response Rooms have organized food distribution, health services, and local relief in war zones, illustrating how capacity can reside in networks that state-centered frameworks view as temporary or unreliable. Community philanthropy networks in Kenya and South Africa show how external finance can reinforce local institutions, as opposed to imposing projects designed elsewhere. Policymakers must learn to see relationships—not just firms or industries—as sites of knowledge and value. These networks effectively combine trust, knowledge, and care in ways that conventional institutional categorie", "translation_ja": "", "vocab": []}, {"title_ja": "地球を再び冷やす", "title_en": "Making Earth Cool Again", "summary_ja": "著者は、気候変動対策における多国間主義が「交渉」と「実行」の二層構造へと進化していると主張しています。COP30で提唱された「ムトゥイラン」（共同動員）の概念を通じて、気候対策を人々の日常生活や各国の開発優先事項に結びつけることが重要だと述べています。実装ギャップを埋め、Paris協定で合意された対策を実際に実行することで、1.5℃目標を達成可能にできると主張しています。", "summary_en": "Climate multilateralism is evolving into a two-tiered system in which high-level negotiations toward shared commitments and the real-world implementation of climate solutions become more mutually supportive. Only by unleashing such virtuous cycles can we keep the 1.5ºC target for global warming with", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/global-climate-processes-emphasizing-implementation-not-a-moment-too-soon-by-andre-correa-do-lago-and-tulio-andrade-2026-11?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Back to top of article\nMaking Earth Cool Again\nClimate multilateralism is evolving into a two-tiered system in which high-level negotiations toward shared commitments and the real-world implementation of climate solutions become more mutually supportive. Only by unleashing such virtuous cycles can we keep the 1.5ºC target for global warming within reach.\nSÃO PAULO—The recent confirmation by the United Nations Environment Programme that global temperatures are on track to exceed 1.5º Celsius above pre-industrial levels undoubtedly darkens the outlook for the coming years and decades. But fatalism is not an option. There is still an opportunity to make this “overshoot” temporary. By tying climate-change mitigation to people’s everyday concerns, and to countries’ development priorities, we can ensure that solutions reach the necessary scale before it is too late.\nThe pace of implementation is already picking up since last year’s UN Climate Change Conference (COP30) in Belém, in the Brazilian Amazon. Inspired by the Indigenous concept of mutirão (meaning a communal mobilization or collective effort), the COP30 Presidency urged the international community to unite around three objectives: strengthening multilateralism, connecting that process to people’s everyday lives, and accelerating implementation of the Paris climate agreement.\nThrough this mutirão, the COP30 Presidency sought to consolidate a process that had long been underway, unleashing climate strategies beyond the negotiation rooms and across different economic sectors and segments of society.\nSince the UN Framework Convention on Climate Change (UNFCCC) was opened for signatures at the 1992 Rio Earth Summit, three decades of diplomacy have created a structure that combines climate mitigation, adaptation, finance, technology sharing, capacity-building, and instruments for addressing loss and damage. By the end of 2024, the Paris agreement’s rulebook, initiated in 2016, was completed, establishing a cycle of periodic nationally determined contributions (decarbonization targets/plans) and global stocktaking (progress assessments).\nBut climate multilateralism has come to a crossroads. Even as ongoing negotiations remain necessary, the implementation gap for what has already been agreed remains abysmal. The challenge for each COP now is to deliver more than final communiqués. Each must also demonstrate how hard-won decisions, once implemented, will bring concrete improvements to peoples’ lives.\nDuring our own preparations for COP30, concerns about rising geopolitical tensions and socioeconomic challenges were aggravated by the news that the United States would withdraw once again from the Paris agreement. By the conference’s closing session, however, no other party had left the accord, and more than 50 decisions had been achieved by consensus. The collective commitment to fighting climate change was renewed: 194 countries recognized that the transition to low-carbon and climate-resilient development is not only desirable but unavoidable. Unlike the 1.5ºC overshoot, this kind of systemic change cannot be reversed.\nBLACK FRIDAY SALE\nSave $50 on a new subscription\nThis Black Friday, a PS subscription starts at $39.99. You can read every new commentary from the likes of Joseph Stiglitz, Claudia Goldin, Raghuram Rajan, and Mariana Mazzucato, and explore an archive of 26,000 more prescient analyses by the world’s leading thinkers. With the year ahead promising to be a volatile one, few investments will serve you better\nThe rise of a new development model confirms that climate multilateralism is working, even if the pace of progress remains frustrating. Under COP30’s Global Mutirão Decision, countries resolved to embark on a decade of climate-policy implementation, and signed on to a new Global Implementation Accelerator to keep 1.5°C within reach and trigger so-called “positive tipping points” (self-sustaining mitigation scenarios)—which may be our last chance to reverse the overshoot.\nAt the same time, the COP30 Global Climate Action Agenda created a new “ecology” of solutions and those pioneering them, connecting previously fragmented efforts to make the broader implementation regime more efficient and resilient. The initiative was designed to engage non-state actors and organize the implementation of the Paris agreement’s first global stocktake, as agreed by consensus at COP28 in Dubai three years ago. The Belém Action Agenda was also structured around a “Granary of Solutions” comprising 120 action plans involving hundreds of stakeholders across 30 key objectives—from renewables, transportation, and cities to agriculture, forests, culture, and AI.\nTogether, COP30’s global mobilization, negotiations, and Action Agenda revealed that the global climate regime is shifting from a negotiation track to a living system. Organically growing through the UNFCCC’s sophisticated institutional architecture, the COPs’ decision-making role among nation-states is now being co", "translation_ja": "", "vocab": []}, {"title_ja": "現実世界が崩壊する中、グランド・セフト・オートはますます魅力的に見える", "title_en": "As the real world falls apart, Grand Theft Auto looks more and more appealing | Dave Schilling", "summary_ja": "著者は、GTA VIのリリースを機に、現実世界の技術インフラの崩壊と私たちの仮想世界への依存の増加を対比させている。ハッキングや技術的障害が日常化する中で、ゲームのようなデジタル逃避がより魅力的になる一方で、すべてのデジタルコンテンツは一瞬にして消滅する可能性があることの皮肉を指摘している。現実世界が混乱に陥る中、人々がゲームの中で秩序を求める傾向を風刺的に論じている。", "summary_en": "All these tech outages are a reminder we’re at the mercy of powers beyond our comprehension. At least in GTA we have control This week marked the release of the highly anticipated video game Grand Theft Auto VI. Millions around the world checked out of their usual responsibilities in order to immers", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/22/grand-theft-auto-vi-gaming", "state_media": false, "category": "オピニオン", "full_text": "This week marked the release of the highly anticipated video game Grand Theft Auto VI. Millions around the world checked out of their usual responsibilities in order to immerse themselves in a game where you run errands for your girlfriend in between murdering people.\nI feel completely alone in not caring about GTA VI, as I famously only play video games where you get to be RoboCop – issuing public nuisance citations to graffiti taggers in between murdering people. I’m a man who knows what he likes.\nGTA VI has been over a decade in the making. The anticipation built to a fever pitch, with gaming enthusiasts practically going feral at the prospect of finally getting to schlep groceries and engage in casual bird-watching after brutally running over a pedestrian with a stolen Porsche.\nOur collective addiction to virtual mayhem is guaranteed to crash productivity all across the globe. I shudder to think what would happen if the game glitched out for everyone all at once, rendering your PS5 a slickly manufactured plastic paperweight. Would there be Paris-style riots turning every major city into a dystopian nightmare riddled with flaming trash bins and smashed shop windows?\nIn a sense, that would be a boon to fans of the game, as the world of flesh would start to resemble GTA come to blood-curdling life.\nMeanwhile, gaming is trending in the opposite direction. Most modern video game systems don’t even accept physical media anymore. The days of buying an actual disc in a little plastic box are nearly gone. Each game purchase is now just exchanging invisible digital money for the right to access the pixels and data that make virtual worlds come to life on your TV screen. It’s ephemeral, intangible, and it could all disappear in an instant.\nBut hey, that’s life in 2026, a time when hackers can turn off your refrigerator from halfway around the world. GTA VI digitally vaporizing at random would be catastrophic, but it wouldn’t be the first computer-related global inconvenience of the year, let alone the month or the week.\nFor the last seven days, the news has been dominated by outages in our tech infrastructure: grounded planes, broken email systems, bank accounts fritzing in and out of existence like a flickering lightbulb. The troubles have been blamed on software bugs, faulty patches, and outdated equipment.\nThe truly bored among us prefer to claim worldwide conspiracy theories, malicious hackers, or government manipulation that would have James Bond tossing his martini in the air and screaming: “This is all too much for me to handle.”\nMeanwhile, AI companies like Anthropic are growing exponentially as they seek to further entangle everyday life on Earth with their complex, interdependent, free-thinking computer systems.\nEven if these outages aren’t the direct result of AI, it’s all part of our brave new world. For the simple price of your money occasionally being completely inaccessible, you can have AI write a novel for you or remind you to pay your car insurance bill with the money you can’t use.\nThis plan seems to be a huge success for everyone but actual human beings with normal, non-billionaire lives. Besides tech companies, I suppose the other biggest winners in all this are bar owners, especially the ones at airports. When absolutely nothing works, the only sane response is to have a pint and laugh about it.\nIncreasingly, reality resembles a video game like GTA VI. Maybe without all the gruesome, wanton mayhem and surface-to-air missiles, but certainly with all of the other bits. As games start folding in more mundane tasks like shopping, going to the gym, or fixing a leaky roof, real life is taking on the rigid, mission-based thrill ride of the arcade.\nSorting through a health insurance claim is almost as annoying as a boss fight in a classic Sonic the Hedgehog game – repeated button-smashing, gnashed teeth, and frayed nerves. The mere notion of a shadowy cabal flipping switches to shut off various critical services makes me think of a caffeine-addled bachelor cackling as they wreak havoc in a particularly malicious game of Sim City.\nI often feel like a cuckolded non-playable game character, or NPC, watching more exciting events happen around me that I’m unable to control. If I want to be able to get on an airplane that actually leaves on time, I’m going to have to level up my XP or purchase a pay-to-win upgrade.\nIt’s not uncommon for me to imagine myself as an NPC avatar while strapped into the back of a Waymo driverless taxi, tooling from one checkpoint to another, silently praying the computer shuttling me to my destination doesn’t decide to change its mind and fly off a bridge into a river.\nWe’re all at the mercy of virtual powers beyond our comprehension. One can’t help but sink into the despairing realization that life is now a series of slights perpetuated by an algorithm with a callous disregard for the whims of corporeal beings.\nSo, what do we do when nothing works and everything is impossible? ", "translation_ja": "", "vocab": []}, {"title_ja": "数学を離れない理由：AIが数百年の難題を解く時代に", "title_en": "Why I won’t leave mathematics, despite AI solving centuries-old problems | Ken Ono", "summary_ja": "著者ケン・オノは、AIが167年前のリーマン予想を証明するなど数学の難題を次々と解く現在、数学者としてのキャリアを続けることを選んだ理由を述べている。故父の助言とAIを数学の形式化と検証の道具として捉え直すことで、人間の判断が依然として本質的に重要であることを認識し、数学の未来に希望を見出している。", "summary_en": "I believe human judgment remains essential Last year, I nearly quit mathematics. On 20 November, Levent Alpöge announced that, working with Claude, he had proved the Riemann hypothesis, a 167-year-old problem about the distribution of prime numbers. The Lean and Mathlib communities have since certif", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/22/why-i-wont-leave-mathematics-despite-ai-solving-centuries-old-problems", "state_media": false, "category": "オピニオン", "full_text": "Last year, I nearly quit mathematics. On 20 November, Levent Alpöge announced that, working with Claude, he had proved the Riemann hypothesis, a 167-year-old problem about the distribution of prime numbers. The Lean and Mathlib communities have since certified the formal proof. We are only beginning to understand the argument. What kind of future awaits someone beginning a life in mathematics?\nIn May 2025, I led the number theory team for Epoch AI’s FrontierMath project. We wrote difficult problems to test large language models. I watched an unreleased ChatGPT model compute all the moments of Tamagawa numbers of elliptic curves, drawing on work by Manjul Bhargava and Roger Heath-Brown, and on papers my father wrote in the 1960s. I was stunned.\nI earned my PhD in 1993 and built a life around research, teaching, and mentoring. I’d love to prove that Ramanujan’s tau function never vanishes, or that half of the partition numbers are even. My 25-year-old self would have been crushed by what we are witnessing today. Nothing I write can reassure someone just starting a career. I can explain why I stayed.\nMy father, a number theorist, died in January. As a boy, I learned from him about Ramanujan, whose notebooks have occupied mathematicians for generations. Ramanujan believed a Hindu goddess gave him mathematical formulas in his dreams. When I considered working on AI, I feared my father would see it as abandoning mathematics. Instead, he told me AI reminded him of Ramanujan: discoveries from an unexpected source might leave us much to understand. I do not take that comparison literally. Ramanujan was a human with an extraordinary imagination and life. My father’s response brought me to tears. It gave me permission to keep being a mathematician in a way I had not anticipated.\nToday, I am on leave from the University of Virginia and work as Founding Mathematician at Axiom Math. We use AI to formalize, verify and extend mathematical proofs in Lean, a language in which a small checking program verifies each step. This work can expose gaps and make proofs inspectable and reusable. Human judgment remains essential: we must check that the formal statement says what we intended.\nWe released the first complete Lean formalization of the classification of finite simple groups, one of mathematics’ largest proofs. Announced in 1983, the classification required decades of work by many mathematicians; a major gap was filled in 2004. Our AI helped produce 43.1 million lines of Lean code. In the process, we found a problem in a published route to a key theorem and supplied an alternative argument. Lean’s kernel checks the resulting formal proof. The mathematics belongs to the generations who developed it. Our formalizations of the classification and other bodies of math are already helping us build and check further mathematics.\nAfter 24 days of work, I watched the final milestones land on my laptop. I cried. I thought about the people who had made the classification possible, and about the father I could no longer tell. But I am 58. I’ve advised 35 PhD students, 17 postdocs, and hundreds of undergraduates. I’ve had opportunities young mathematicians cannot assume. I cannot ask a graduate student to regard uncertainty as an adventure because I have found rewarding work within it.\nAt a Berkeley colloquium two days after OpenAI announced its Navier–Stokes solution, a scheduled lecture became a town hall lasting almost two and a half hours. Students asked about credit, transparency, hiring, and how mathematicians whose work came first were treated. Some asked me what I would do to help them. Campus security was locking the building as we left.\nThe declaration A Severe Misalignment of AI in Mathematics, signed by Terry Tao and other Fields Medalists, warns about rushed announcements, inadequate attribution and the loss of mathematical understanding. I share those concerns. At a National Academies meeting, I put my position this way: hope is not a plan, and nostalgia is not mentoring.\nUniversities, journals, employers and funding agencies must decide what they support and reward. Students and younger colleagues should have a voice while those decisions are still open, as should mathematicians who choose to work without AI. In the discussions where I have a voice, I will argue for that participation.\nStudents need room to struggle with mathematics and learn to question the tools they use. In my advising, I will ask what a young mathematician understood, originated, or made possible. Access to a powerful system is no substitute for those contributions. For work I help publish, readers should know what has been proved, what remains assumed, and who contributed the ideas.\nI want my students, and their students, to develop ideas that are genuinely their own. I want them to have colleagues who listen and the material support to pursue a mathematical life. My work at Axiom is one part of how I am trying to contribute. It does not replace my o", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ・プーチン同盟はすべてのヨーロッパ諸国を脅かす—それでもポピュリストたちは歓声を上げ続けている", "title_en": "The Trump-Putin alliance threatens every European country – yet gushing populists still cheer them | Steve Bloomfield", "summary_ja": "著者は、トランプ大統領とプーチン大統領の同盟がバルト三国を含むヨーロッパ全体に深刻な脅威をもたらしていると論じている。エストニアなどの旧ソビエト支配下にあった国々は、NATOへの加盟によってのみ独立を守ることができるが、トランプとプーチンは大国が自らの勢力圏を支配すべきという危険な共通認識を持っている。西側の一部のポピュリスト指導者たちがこの同盟を支持していることは、東ヨーロッパ諸国の安全保障にとって重大な危機を意味する。", "summary_en": "Europe’s future will be fought over at the ballot box and on Ukraine’s frontline. The danger is that the two strongmen ultimately reap the benefits On the facade of Stenbock House, the Estonian prime minister’s neoclassical office building on a hill in Tallinn, sits a plaque commemorating the murder", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/nov/22/donald-trump-vladimir-putin-europe-ukraine-strongmen", "state_media": false, "category": "オピニオン", "full_text": "On the facade of Stenbock House, the Estonian prime minister’s neoclassical office building on a hill in Tallinn, sits a plaque commemorating the murder of 10 heads of government. They were all killed by Soviet forces after the USSR’s invasion of Estonia in 1940.\nFor 51 years, Estonia was occupied by its imperial neighbour; for the past 35 years it has lived independently in its shadow. For the politicians and government officials who work at Stenbock House, the plaque is a constant reminder of the risk the small Baltic nation (population 1.4 million) faces from a neighbour 100 times its size.\nNot that they have needed much of a reminder. Over the past decade, there has been interference in its politics, propaganda targeting Estonia’s Russian-speaking minority, and a host of cyber and hybrid attacks, the most recent of which was an attempted arson attack targeting an Estonian defence company last Saturday.\n“The goal is to create fear in our society,” Margus Tsahkna, Estonia’s foreign minister, told me by phone from Tallinn. The only thing protecting Estonia’s independence, he said, was membership of the EU and – most importantly – Nato. “Without Nato membership we couldn’t have this conversation. Estonia would have been 100% occupied.”\nLong before Russia’s full-scale invasion of Ukraine in February 2022, Vladimir Putin was arguing that the decision of former Soviet or Warsaw Pact states in central and eastern Europe to seek sanctuary in Nato was an act of aggression. It’s an argument that tramples on those countries’ independence, denying them the basic right to decide their own security arrangements. Countries previously invaded, occupied or controlled by Moscow want to be protected against any repeat.\nUntil recently, Putin’s case gained little support among mainstream western politicians. But since Donald Trump’s return to office in January 2025, Putin has found a valuable ally in high office. “It’s my friend!” Trump excitedly said, as he greeted Putin on the sidelines of the Apec summit in Shenzhen this week.\nTrump and Putin share the same view of Europe: a once-great Christian civilisation that has destroyed itself through migration, particularly from Muslim-majority countries. They also share the dangerous belief that great powers – and they both think they are – should be able to control their own back yards. For Trump, that means the western hemisphere is his; for Putin, that means the west should not interfere in central and eastern Europe. The trilateral summit in Shenzhen alongside Xi Jinping, combined with the genuine bonhomie between the two men, was partially aimed at cementing this idea.\nThroughout the stop-start peace talks led by Trump’s son-in-law Jared Kushner, and his former real-estate pal Steve Witkoff, Putin has pushed the idea of broadening the discussion to include Europe as a whole, not just Ukraine. He wants Nato to withdraw its troops and bases to its 1997 borders, meaning 16 nations in the alliance would have no outside support. Estonia and the other Baltic nations would, for instance, be left without air defences. Putin has also demanded that Britain and France rule out using their nuclear weapons to protect any other European nation. Any deal for Ukraine, Putin argues, must be part of a wider agreement on Europe.\nTrump seems to like the idea. Speaking to reporters in the Oval Office last week, he talked about the prospect of a grand deal. “It’s going to be very big. It’s going to involve more than Ukraine, and I could even say it might involve all of Europe. It’s going to be a big, beautiful agreement, and everyone’s going to be thrilled,” he said. Anyone who believes in a free Europe won’t be “thrilled”, but Trump doesn’t want a strong Europe, which he has long seen as an adversary. It also tallies with Trump’s other main position on Europe: that it’s a continent of freeloaders that the US has been protecting against its own national interest.\nFor more than a year, Europe has largely been excluded from the Ukraine talks. In Abu Dhabi, where a group of European national security advisers had come to meet on the sidelines, Kushner was upbeat about the continent finally having a formal role in future talks. But Europe has finally found itself at the table – only to discover that Europe itself is on the menu.\nThe Trump-Putin alliance threatens the future of Europe, not least because there are some European politicians who welcome it. In the next three years, far-right or hard-right parties could win power – or at the least join the governing coalition – in western Europe’s four biggest nations: the UK, France, Germany and Italy. The leaders of all four parties are either openly sympathetic to Putin or, at very least, critical of Ukraine’s president, Volodymyr Zelenskyy.\nMarine Le Pen, who remains favourite to win the French presidency next spring, has vowed to “end financial aid” to Ukraine within six months of taking office and has refused an offer from Zelenskyy to visit him in ", "translation_ja": "", "vocab": []}, {"title_ja": "議会と迫り来る危機", "title_en": "Congress and the Coming Crises", "summary_ja": "著者は、民主党が中間選挙で手頃な価格を公約に勝利したが、ガス価格、光熱費、借入コストの上昇は地政学的紛争、AI革命、過度な国家債務に根本的に結びついていると主張している。これらの問題は米国の経済と安全保障を脅かすため早急な対策が必要だが、トランプ政権の抵抗により実現が困難になる可能性があると述べている。", "summary_en": "How to defuse looming threats to U.S. national security.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/congress-and-coming-crises", "state_media": false, "category": "オピニオン", "full_text": "Democrats won a historic victory in the U.S. midterm elections by running on a key voter concern: affordability. They promised to lower gas and diesel prices, curb electricity and water bills, and cut borrowing costs. Now voters expect results.\nMaking progress will not be easy, given that the affordability crisis is inextricably linked to a set of thorny policy issues. Soaring gas and diesel prices stem from wars in Europe and the Middle East that have overextended the United States and provided China, Iran, North Korea, and Russia openings to exploit. Rising electricity and water bills are driven by the growing number of data centers powering an artificial intelligence revolution that is nearing a point of no return, when machines improve faster than humans can understand or control. And higher prices and borrowing costs are the result of an unsustainable U.S. national debt, now above $40 trillion, that requires exorbitant interest payments and has foreign governments questioning the safety of the dollar and U.S. Treasury bonds.\nThese problems not only strain Americans’ pocketbooks but also threaten the security and prosperity of the United States—and the world. If Beijing and Moscow try to take advantage of a weakened United States by escalating simultaneously in Taiwan and eastern Europe, those moves could be the first steps toward World War III. If AI escapes the bounds of human control, no one will be safe. And if the national debt continues to soar, Washington could trigger a fiscal crisis that devastates the American economy and leaves the United States far less able to meet the challenges it faces overseas.\nAction to address the United States’ problems therefore cannot wait. But politics may stand in the way. The White House is more likely to obstruct than to cooperate with congressional Democrats over the next two years, as President Donald Trump’s appointment of the pugilistic Stephen Miller as the new White House chief of staff underscores. Moreover, one electoral victory did not erase the country’s deep partisan and policy divisions. Going into the 2028 presidential election, Republicans know that a successful Democratic Congress would endanger their chances of keeping the White House. Trump and congressional Republicans, therefore, have considerable motivation to derail Democratic plans.\nDemocrats are not without options, however. They can pursue legislation, seeking cross-party collaboration when possible and pushing ahead even in the face of presidential vetoes. Sometimes it is the president, not Congress, who blinks. When he doesn’t, voters will know who stood in the way. Democrats can also use public hearings and the investigative powers of Congress to shed light on the threats facing the country and to build a case for change—much as the Fulbright hearings did during the Vietnam War and the Church Committee did to highlight Cold War–era intelligence abuses. They can put the defense secretary and military commanders, AI executives, and Treasury and budget officials under oath to account for how they prosecuted the Iran war, raced ahead on AI without adequate safeguards, and exploded the deficit. They can also call on economists, scientists, and strategists to explain how to steer the country away from peril.\nCongressional efforts may not be enough to meaningfully change Trump’s policies. But the risks of major war, unconstrained AI, and eroding economic competitiveness are too great to wait two more years to address. These problems, and the affordability crisis they have generated, will only get worse. If Democrats in Congress do not start advancing a serious agenda to address them now, these dangers may become impossible to contain.\nMINUTES TO MIDNIGHT\nThe first order of the new Congress’s business should be to end the Iran war. Operation Epic Fury has sent energy prices soaring and put freedom of navigation at risk. It has also highlighted the United States’ vulnerabilities in ways that could prove dangerous—and costly—in the years ahead. Iranian missiles and drones wreaked havoc on American military bases in the Persian Gulf. U.S. efforts to defeat these attacks depleted supplies of critical munitions, showing that the U.S. military has become overly reliant on very expensive, hard-to-produce high-tech weapons. The economic, diplomatic, military, and intelligence support that China and Russia have provided Iran revealed the extent to which autocracies are cooperating to stretch U.S. capabilities and undermine American power. The U.S. Navy is effectively bottled up in the Arabian Sea, limiting its presence in the Atlantic and Pacific. In theory, U.S. allies could help fill the gaps, but Trump’s decision to launch the war without consulting them and his adversarial attitude toward them have strained those relationships, weakening deterrence of a Russia and China bent on securing strategic advantage.\nPerceptions of weakness, even when they are wrong, are often why wars begin. Moscow and Bei", "translation_ja": "", "vocab": []}, {"title_ja": "ベネズエラにおけるアメリカの悪い取引", "title_en": "America’s Bad Bargain in Venezuela", "summary_ja": "トランプ政権はマドゥロ大統領を拘束したベネズエラを民主化・経済復興させる使命を掲げているが、石油部門との急速な取引交渉により経済的レンティズム体制を温存し、民主化への取り組みを後回しにしている。野党指導者マリア・コリーナ・マチャドを交渉から除外してきたことで民主化勢力の信頼を損なっており、彼女の帰国は民主的移行の正当性に大きな影響を及ぼす可能性がある。", "summary_en": "Washington’s dealmaking is strengthening the Chavista regime.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/venezuela/americas-bad-bargain-venezuela", "state_media": false, "category": "オピニオン", "full_text": "After the U.S. military captured then Venezuelan President Nicolás Maduro in January, the United States set out on a mission to fix what President Donald Trump called a “dead country.” With broad authority over Venezuela’s agenda, officials in the Trump administration promised to free the country from socialism. As Secretary of State Marco Rubio said, when he was called before the Senate in late January, the administration’s ultimate objective was to establish “a friendly, stable, prosperous Venezuela, and democratic, in which all elements of society are represented in free and fair elections.”\nRubio laid out a three-stage framework for managing this democratic transition: stabilization, economic recovery, and, finally, transition. Washington is currently focused on the second stage, recovering the economy, but it is proceeding so quickly and with such little transparency that it is jeopardizing the stated end goal entirely. U.S. dealmaking with the country’s oil sector, in particular, is reifying rather than transforming Venezuela’s economic rentism: a model of governance in which the state controls important sectors of the economy and offers business contracts and market privileges to firms that support its agenda. This is precisely the system that facilitated the Venezuelan state’s rampant corruption over the past 25 years, allowing autocratic leaders to drown out democratic forces and win elections.\nAs it pursues its economic goals with dizzying speed, the Trump administration is also slow-walking democratization efforts. For months, Washington excluded opposition leader María Corina Machado and her party, Vente Venezuela, from any direct involvement in negotiations. Machado had left the country last December to receive a Nobel Peace Prize after nearly 20 months in hiding, and after Maduro’s removal, the United States did little to help her return. Venezuela’s pro-democracy forces have thus been left feeling like they are pushing the regime in Caracas to democratize with the acquiescence, but not necessarily the full enthusiasm, of the United States.\nLast month, Machado returned to Venezuela, and now she has the potential to change the game. Machado could become the greatest asset or, possibly, the greatest disruptor to Venezuela’s democratic transition. If Machado coordinates with the faction of the opposition that is currently negotiating with the government, any outcome will be seen as legitimate. But if she opposes and speaks out against the result, Venezuelans will find themselves in a familiar and dangerous place: with a divided opposition, a government with few constraints on its power, and a transition in purgatory.\nSo far, Washington has squandered its immense leverage over Caracas. By dragging out the transition and pursuing questionable economic deals, Washington is endangering not only its own end goal but also the greatest opportunity Venezuela has had to overcome more than a quarter century of autocratic governance.\nSTANDARD OPERATING PROCEDURES\nDuring Trump’s first term, his administration centered its criticism of Maduro on the country’s socialist model. In February 2019, weeks after recognizing the opposition leader Juan Guaidó as Venezuela’s interim president, Trump promised in a speech that the “twilight hour of socialism has arrived in our hemisphere.” That campaign to oust Maduro failed, but Trump’s diagnosis of what ails Venezuela was wrong to begin with. Over the past two decades, Venezuela has not been operating primarily under a socialist model but an extractivist one. And since January 3, the United States has seemed only to reinforce it.\nVenezuela is an oil state. Under Chavismo, the ideology named for Maduro’s predecessor Hugo Chávez, the state used oil revenues as a political slush fund to reward allies. Little went toward investments in the oil sector or the rest of the economy. Secret deals with oil magnates at home and abroad guided most governance decisions. Whereas the government’s critics faced legal attacks, the well-connected received impunity. Chávez implemented elements of socialism, of course, with massive nationalizations and price controls, but the key priority was collusion and special deals. Many of the state’s allies were poor Venezuelans whose votes kept the autocrats in power, but less noticed were the economic elites. These private actors shunned opposition figures and refrained from any public criticism of the regime; in exchange, they accumulated regulatory favors, access to preferential exchange rates, or exclusive contracts with the state. This model even applied internationally; around 2007, Chávez began redirecting oil sales from the United States to China, both to reward China for being so friendly toward the regime and to preempt a possible U.S. divestment from the Venezuelan oil sector. Oil booms in the first decade of the century ing of September 25, when the group announced that it was ending the strike. For locals, Los Pachenca’s reaction was a message about who remains in charge.\nCalm has since returned to Santa Marta, but the incident may be indicative of risks to come. Colombia’s newly elected president, Abelardo de la Espriella, has promised a steep military escalation against illegal groups, which have grown precipitously in recent years. As he does so, armed and criminal organizations will undoubtedly respond. Often, their target will not be the state. Instead, they will likely direct their violence against the civilian populations, whom they have spent years coopting and coercing. That is because armed and criminal groups across the country have learned that their true leverage is their ability to govern local communities—and to intimidate and punish them into silence. Even when they do attack state forces, their use of weapons such as improvised explosives and makeshift drones means that bystanders often suffer. In one recent incident in the Pacific coast department of Valle del Cauca, four drone attacks launched by an armed group in a single day left five civilians injured.\nThese dangers are particularly acute as de la Espriella’s pledge of a zero-tolerance crackdown against armed and criminal groups has won enthusiastic support from Washington. Both countries want big and visible victories against these outfits. They triumphantly announced a new era of cooperation when the president took office in August, including a promise of upgraded military ties. (The United States has not yet publicly pledged new weapons, but it is already providing greater intelligence and logistical assistance on some operations.) After two years of tensions and threats between President Donald Trump and leftist former President Gustavo Petro, the political realignment means that Colombia is once again the United States’ closest defense ally in South America. This is likely to continue, despite major Democratic wins in the U.S. Congress, as the relationship’s focus on security has a long history of bipartisan support.\nThis week, during U.S. Defense Secretary Pete Hegseth’s visit to Bogotá, the de la Espriella administration signaled that it would seek congressional approval for joint military operations with the United States in Colombia. This cooperation will likely yield initial results. The Colombian government has said that it aims to ramp up attacks against armed and criminal groups and to go after leaders who enjoyed protection as counterparts in peace talks during the past administration.\nYet Colombia’s true challenge is not how to carry out attacks but what to do afterward. Surgical strikes, which see the military enter and exit quickly, leave civilians more vulnerable in the aftermath, as armed groups retaliate against alleged informants and tighten their grip in areas they control. Bogotá must ensure that every operation includes contingencies to anticipate criminal groups’ reactions and build on successful offensives by weakening their grasp on communities. The government will need to strengthen the police’s ability to patrol contested areas, a costly but necessary process that the United States and other partners should support.\nThe stakes are high. Bogotá has a chance to leverage its increased military pressure to open the door for the state, rewriting the story of who governs conflict areas. If the government misses this opportunity to consolidate state control, however, Colombia risks entering an escalatory spiral in which civilians pay a mounting price for a campaign intended to protect them.\nMANO DURA\nArmed and criminal groups have spent the last decad", "translation_ja": "", "vocab": []}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-11-23 01:12 JST";
  renderTabs();renderList();
})();
</script>
