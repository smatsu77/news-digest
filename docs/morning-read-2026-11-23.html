ssibility by the end of the century.\nNow, the world is likely to limit warming to about 2.8C by 2100 based on current g", "translation_ja": "", "vocab": []}, {"title_ja": "COP31気候変動交渉が合意なく終了 - 次は何か", "title_en": "What's next after no deal at COP31 climate talks?", "summary_ja": "トルコで開催されたCOP31気候サミットは、各国が新たな合意に達することができず正式に終了しました。欧州連合を含む複数の国は、化石燃料の段階的廃止に言及していない4番目の草案を拒否しました。交渉は予定より2日遅れて決裂し、サミット史上最長の交渉となりました。", "summary_en": "The talks have been the longest-running in the summit's history, with negotiations breaking down two days after they had been due to end.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/videos/cr1ewge81q4qo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "What's next after no deal at COP31 climate talks?\nThe COP31 climate summit in Turkey has officially come to an end after countries failed to come to a consensus on a new deal.\nThe European Union and some other countries rejected a fourth draft agreement over its failure to mention a need to phase out fossil fuels, the largest driver of global climate change.\nAn EU representative accuses some oil states of hijacking talks, as Russia defends opposing the inclusion of such a commitment and levels direct criticism at the EU in its speech.\nThe talks have been the longest-running in the summit's history, with negotiations breaking down two days after they had been due to end.\nBBC climate and science reporter Esme Stallard reports from Antalya, in Turkey.", "translation_ja": "", "vocab": []}, {"title_ja": "リビア港のロシア船爆発、無人機攻撃の可能性 当局が発表", "title_en": "Explosion on Russian ship at Libya port caused by suspected drone attack, officials say", "summary_ja": "リビア東部のベンガジ海軍基地に停泊していたロシア船が日曜日未明に爆発し、無人機（ドローン）による攻撃が原因と東部政府が発表しました。同港湾付近ではもう一隻の商船も被害を受け、負傷者が出ています。リビアの東西両政府は、自国がロシア・ウクライナ紛争に関与していないと強調し、主権侵害を非難しています。", "summary_en": "Libya's eastern government says the ship had stopped for fuel and supplies on its way back to Russia.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr894gjz0j0yo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Explosion on Russian ship at Libya port caused by suspected drone attack, officials say\n- Published\nAn explosion on a Russian ship docked at Benghazi naval base was caused by a suspected drone attack, Libya's eastern government has said.\nThe explosion happened at dawn on Sunday, while the ship had stopped for fuel and supplies on its way back to Russia, Libya state media reported, citing the eastern government.\nThe statement said there were no casualties. Moscow has yet to comment.\nLater on Sunday, the health ministry said it had received injured people from another vessel, a commercial ship, that was also targeted off the coast of Benghazi, state media reported. Their injuries were minor and their condition stable, the ministry said.\nVideos posted on social media and geolocated by BBC Verify show the ship that was struck in the morning engulfed in flames and smoke. Satellite imagery from Planet Labs PBC also shows a boat on fire at 05:47 GMT at the Benghazi port.\nUS-based intelligence firm Vantor collected high-resolution images that it said showed Project 20380 Steregushchiy-class corvette (Merkury) - a Russian navy ship - moored in the port on Saturday, and on Sunday showed most of the same ship capsized and sunk with only the forward bow still visible.\nThe eastern-based Government of National Stability (GNS) said the Russian ship - which it did not name or identify - was using the Benghazi port within the framework of an existing maritime agreement.\nSunday's incident is under investigation, and authorities are coordinating with their Russian counterparts to determine the source of the suspected attack and who is responsible for it, GNS added.\nGNS condemned the attack on a ship inside a Libyan port, and called it a violation of maritime safety and an attack on their sovereignty. It said Libya was not party to the Russia-Ukraine war, or any other conflict beyond its borders.\nSeparately, Libya's internationally recognised government in Tripoli - the Government of National Unity (GNU) - warned against hosting foreign forces and allowing them to use facilities in a statement published by state media.\nGNU said such activity raises \"serious fears\" about \"risks that may result from involving ports and civilian facilities in activities related to external conflicts, and the resulting threat to the lives of citizens and the safety of national facilities and assets\".\nLibya fractured into violence and instability after its leader Muammar Gaddafi was overthrown in 2011, leading to the opposing governments.\nBenghazi is more than 2,000 km (1,243 miles) away from the Russian capital Moscow.\nAlthough it has not been officially confirmed who was behind the attack, there is little doubt, according to Jalel Harchaoui, Libya specialist at the Royal United Services Institute (RUSI).\n\"Ukraine is the only actor brazen enough to pull something like that off,\" he told the BBC. \"If I were to bet my own money, I would bet that it was the Ukrainians.\"\nIf confirmed, it would not be the first time Ukrainian forces had carried out an operation of this sort. In March, Russia accused Ukraine of targeting the Russian tanker Arctic Metagaz in the Mediterranean between Libya and Malta with \"uncrewed sea drones\" launched from the Libyan coast.\nAs well as having an economic impact on Russia, hampering the ability of their so-called shadow fleet of tankers to export oil and gas, attacks like this are seen as humiliating to the Kremlin, according to Harchaoui.\nBut it is not only Moscow that will want to react to this latest incident. The ship was in the region as part of a deal with the government of eastern Libya - allied with Khalifa Haftar, commander of the Libyan National Army.\nHarchaoui said Haftar will take the attack as a personal slight. \"You're going to have a response by the Haftar family. They will ask questions about who is hosting the Ukrainians.\"\nAdditional reporting by Benedict Garman and Shayan Sardarizadeh\n  - Published7 hours ago", "translation_ja": "", "vocab": []}, {"title_ja": "英国ガス大手セントリカのボス、高騰するエネルギー料金の影響に「極度に懸念」", "title_en": "Boss of British Gas owners Centrica 'hugely concerned' over impact of soaring energy bills", "summary_ja": "英国ガス大手セントリカのクリス・オシェア最高経営責任者は、1月の電気代値上げが消費者に与える影響について「極度に懸念している」とBBCに述べました。コンサルタント企業コーンウォール・インサイトの予測では、典型的な家庭の年間電気代が443ポンド上昇する見込みです。オシェア氏は、請求書を支払えない、または支払わない人の数が増加すると予想し、英国全体の電気消費者が未払い分をカバーするため週約1.50～1.60ポンドを負担していると指摘しました。", "summary_en": "Chris O'Shea says the number of people unable or unwilling to pay their energy bills will increase when prices jump in the new year.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c6jre7gpdw13o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "経済", "full_text": "Centrica boss 'hugely concerned' over impact of soaring energy bills\n- Published\nThe boss of British Gas owner Centrica says he is \"hugely concerned\" about the impact the expected jump in energy bills in January will have on consumers.\nChris O'Shea told the BBC he thought the number of people unable or unwilling to pay their energy bills would rise when prices go up in the new year.\nThe new energy price cap to take effect from January will be announced on Wednesday and consultancy Cornwall Insight has forecast it will jump by £443 a year for a typical household.\nThe government has said some households will get £100 to help with energy bills, but Citizens Advice said it was a \"drop in the ocean\" while one pressure group called for action on \"inflated energy firm profits\".\nSpeaking to the Sunday with Laura Kuenssberg programme, O'Shea said the predictions for a \"substantial increase\" in bills from January were \"materially correct\", adding that the first quarter of the year was the time when most energy was consumed.\n\"That's right at the point where people will be paying for Christmas and the like. So I am hugely concerned,\" he said.\nO'Shea added there was a \"massive problem\" with people not paying their bills in the UK, with some not able to pay their bills and an \"increasing number of people that are choosing not to pay their bills\".\nHe said the collective impact of that was that \"every single electricity consumer, is paying about £1.50, £1.60 a week to cover the cost of people that are not paying their bills, and it's just going to get worse when bills go up\".\nThe amount owed to energy suppliers by households hit £5bn in the April to June period, according to energy regulator Ofgem.\nWholesale energy prices paid by suppliers have been rising this year as a result of the conflict in the Middle East, which has pushed up bills for households.\nCornwall Insight has predicted Ofgem's energy price cap will rise by 26% to £2,166 a year for a typical household from 1 January.\nThe price cap affects about 20 million households in England, Scotland and Wales and sets a maximum price for each unit of gas and electricity, so the actual level of bills will vary according to energy usage.\nThe government has said some households will get a £100 payment to help with energy bills, a policy which was announced in the Budget.\nThe government has also temporarily cut 5% VAT from electricity bills until the end of June next year, which is expected to save the typical household about £45 a year.\nBut consumer groups have argued the £100 payment announced in the Budget will not be enough for some.\nCitizens Advice said it was a \"drop in the ocean\" and that we would see \"cold-related deaths\" this winter.\n\"For someone in a lot of debt, who can't afford their bills, it's not going to touch the sides.\"\nThe Fuel Poverty Action Group said the government and Ofgem needed to take stronger action against energy companies.\n\"Our inflated energy prices are driven by inflated energy firm profits,\" the group said.\n\"Government and Ofgem must take stronger action against this blatant profiteering whilst we suffer in cold homes, or are forced into debt.\"\nEnergy firms operating in the UK are subject to a windfall tax that was introduced in 2022.\nWhen the windfall tax is added to other taxes levied, it means the overall tax rate on profits earned by oil and gas companies operating in the UK is 78%.", "translation_ja": "", "vocab": []}, {"title_ja": "テレーサ・メイ前首相、バーナム首相のEU復帰計画に「愕然」と述べ「ブレグジットは終わった」", "title_en": "Theresa May 'aghast' at Burnham's EU plans and says 'Brexit is done'", "summary_ja": "テレーサ・メイ前首相は、アンディ・バーナム首相がEUへの復帰を検討していることに対して「愕然としている」とBBCの独占インタビューで述べた。メイ氏は3年間のEU離脱交渉を主導した経験から、ブレグジットは完了したため「受け入れて前に進むべき」とバーナム首相に警告している。メイ氏は、別の国民投票を提案することは国民を軽視する行為だと批判し、政府はブレグジット後の経済成長に注力すべきだと主張している。", "summary_en": "\"Just accept Brexit and move on,\" the former prime minister tells BBC's Laura Kuenssberg.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cvj6l8y3x1x4o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Theresa May 'aghast' at Burnham's EU plans and says 'Brexit is done'\n- Published\nFormer Prime Minister Theresa May has warned Andy Burnham he should \"move on\" from Brexit, telling the BBC she is \"aghast\" the prime minister could be considering rejoining the EU.\nAt the Brussels summit this week the PM said he wanted to \"brainstorm\" options for the future relationship between Britain and the trading bloc.\nIn an exclusive interview with the BBC's Sunday with Laura Kuenssberg, Baroness May, who spent three years negotiating an EU exit deal, said: \"Brexit is done. Just accept Brexit and move on.\"\nMay claimed Burnham \"wants to pat people on the head\" by suggesting: \"Remember that vote? Well, you got it wrong, didn't you. So have another go and come out with the right answer.\"\nMay, who was prime minister between 2016 and 2019 urged Burnham to \"just get on with\" today's challenges rather than re-opening the conversation around being in the European Union.\nBefore becoming PM she had campaigned to stay in the EU, but when in No 10 she presided over three years of tortuous negotiations.\nThe deal she concluded was rejected by MPs. She was forced to quit and was replaced by Boris Johnson in 2019.\nTelling Burnham to \"move on\", she said: \"What I saw was that the extent of those negotiations, the hours that have to be put in - it's across the whole of government.\n\"It's not just prime ministerial time, cabinet ministers' time, officials' time, to-ing and fro-ing on those negotiations. Because you have to negotiate hard in order to make sure that you're getting out what you want.\n\"And that's one of the reasons why I look slightly aghast at what Andy Burnham is talking about, further negotiations of going into the EU. And also we, as a country, we voted for Brexit.\n\"When I was prime minister I was very clear, we should deliver on that vote. So I'm afraid my message to him really is, you know, people voted for Brexit. Brexit is done. Just accept Brexit and move on.\"\nWarning against another vote, May told the BBC's Sunday with Laura Kuenssberg: \"I almost think this is what Andy Burnham is saying to the British people, sort of patting them on the head.\n\"He wants to pat them on their head and say, you know what, remember that vote? Well, you got it wrong, didn't you? So have another go and come out with the right answer.\n\"Or what he thinks is the right answer. But as I say, let's just get on with making sure the UK is as strong economically, in security terms, and in terms of opportunities for people as it can be.\"\nSpeaking to the BBC back in 2023, she said the UK \"would have been better off if MPs had backed her deal to leave the European Union\".\nHer deal had included the prospect of a vote on holding a second referendum, and a vote on a temporary customs union, as well as promises on workers' rights and environmental protection.\nMay claimed her plan was thwarted by \"hardline\" Brexit-supporting MPs and those who wanted to remain in the EU.\n- 'Move on!' Former PMs pile in with advice for Andy Burnham, but will he listen? \n  - Published19 hours ago\n- Tories would scrap Burnham's deal with EU, deputy leader says \n  - Published11 hours ago\n- Deal with EU not dependent on tuition fees agreement, Miliband says \n  - Published1 day ago\n- UK should only rejoin EU if it innovates on technology, Blair warns \n  - Published1 day ago\nOn Saturday, Sir Tony Blair - another former prime minister - weighed in on the UK's future relationship with the EU.\nSpeaking to The Sunday Times, external, Sir Tony has said Britain should only rejoin the EU if it reforms - and allows more innovation on technology.\nSir Tony, a prominent opponent of leaving the EU, told the paper: \"I do think Brexit was a real mistake.\"\nBut he added the debate was different now than it was in 2016.\nReferencing the need for technology innovation, he said Europe could and \"probably are\" moving in the wrong direction.\nIt comes after Burnham struck a deal with the EU in Brussels on Friday, covering British food exports, emissions trading and a youth experience scheme.\nThe prime minister also said that over the coming months before the next UK-EU summit both sides will \"seek to conduct an informal brainstorming process\" to look at the options for their long-term relationship.\nHe has previously suggested potential options for the future could include rejoining the customs union, the single market or a fresh referendum on full EU membership.\nHowever, Burnham has ruled out major changes to the UK-EU relationship before the next general election, saying he will stick to Labour's 2024 manifesto pledge not to return to the single market, customs union or freedom of movement.\nRelated topics\n  - Published2 days ago", "translation_ja": "", "vocab": []}, {"title_ja": "トーリー党がバーナム首相とEUの協定を廃止すると副党首が表明", "title_en": "Tories would scrap Burnham's deal with EU, deputy leader says", "summary_ja": "保守党のアレックス・バーガート副党首は、次の総選挙でトーリー党が勝利した場合、アンディ・バーナム首相がEUと合意した協定を廃止すると述べました。同協定は青少年旅行制度、排出権取引、英国食品輸出に関するものです。バーガート副党首は、この協定は「めちゃくちゃな内容」であり、英国が独自のルールを設定する能力を失うと批判しています。", "summary_en": "Alex Burghart tells the BBC the agreement will not lead to lower prices in the shops.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr868jnlllpgo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Tories would scrap Burnham's deal with EU, deputy leader says\n- Published\nConservative deputy leader Alex Burghart has said his party would scrap the deal agreed between the UK and the European Union on Friday, if the Tories win the next general election.\nThe agreement signed by Prime Minister Andy Burnham covers a youth travel scheme, emissions trading and British food exports.\nThe government has argued scrapping most checks on British food exports will cut costs for businesses and could bring down prices for shoppers.\nBurghart told the BBC's Sunday with Laura Kuenssberg programme the deal was \"a dog's dinner\", which would not lead to lower prices in the shops and would mean the UK \"gives up our ability to set our own rules\".\nUnder the agreement, the UK will also have to follow some EU regulations.\nBurghart acknowledged the deal would reduce some trade \"friction\" but he said it would put a \"massive additional burden on the 90% of farmers that don't do any trade with the EU\".\nPressed over whether the Conservatives were committed to scrapping the deal if the party wins the next general election, Burghart said: \"I don't think that there will be positive outcomes, and yes, we would scrap it.\"\nHe added: \"I also don't think it is a good idea for a country like Britain to hand over control of its rules to another power and have no say over how those rules are created right into the future.\"\nFood retailers have welcomed the deal, saying it will cut costs, reduce bureaucracy and remove barriers to trade.\nHowever, they have not committed to cutting prices as a direct result of the changes.\nThe British Retail Consortium has said it does not expect prices on supermarket shelves to fall in response to the deal.\nIt has said upward pressures on prices remain and will not be alleviated by the agreement.\nForeign Secretary Ed Miliband insisted the deal \"reduces pressure on trading costs\", adding: \"They're the things that go into prices.\"\n\"It will reduce the costs that the retailers face, all of that Brexit red tape, millions of forms that they were having to fill in, frankly pointlessly, as a result of the bad deal that we had,\" he told the BBC.\nChallenged that the UK was also giving up some powers to set regulations itself, Miliband argued businesses were already \"rule takers\" from Brussels if they wanted to sell into the European market.\n\"So they have to abide by the rules of the European Union. But at the same time, because we are not integrated into that market for food and agricultural products, they have to fill in a whole bunch of forms... to confirm that they're observing the right standards, which is frankly crackers,\" he said.\nUnder the deal, he said the UK would \"be able to shape decisions\" for the first time.\n- 'Move on!' Former PMs pile in with advice for Andy Burnham, but will he listen? \n  - Published18 hours ago\n- Deal with EU not dependent on tuition fees agreement, Miliband says \n  - Published1 day ago\nReform UK has also criticised the UK-EU deal.\nDeputy leader Richard Tice told Sky News that while \"a few exporting food businesses may benefit\", companies that do not export to the EU will still have to align with EU rules.\n\"Divergence is now our strength. We need to be scrapping net zero so we can bring down energy bills, whereas the EU is still ideologically obsessed with it,\" he said\n\"The extra burdens of EU regulations that will be forced through dynamic alignment across all UK businesses is way more than that small net benefit.\"\nLegislation to implement the deal is expected to be introduced in the UK Parliament next week, with the food exports deal in force from 2028.\nElsewhere in the agreement, a new \"youth experience scheme\" will allow up to 100,000 18 to 31-year-olds to work, study or travel in the EU for up to three years.\nThe same number of young people from the EU will also be allowed into the UK.\nThe two sides want to ensure that opportunities under the annual scheme will be available to young people by no later than January 2030.\nA proposal from the bloc to lower the level of university tuition fees paid by EU students in the UK has not been agreed and talks on this aspect will continue. Miliband has said Friday's deal is not dependent on an agreement on tuition fees.\nThe Conservatives have also criticised the youth experience scheme, saying people from the EU will be competing with young Britons struggling to get jobs.\nThe Liberal Democrats have welcomed the scheme as \"a big step forward\" but have said \"it's nowhere near enough\".\nThe party has called for the UK to rejoin the EU single market and customs union to help cut the cost of living and grow the economy.\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.", "translation_ja": "", "vocab": []}, {"title_ja": "トルコ：批判的メディア局の閉鎖に数千人が抗議", "title_en": "Turkey: Thousands protest closure of critical media outlets", "summary_ja": "トルコのイスタンブールで数千人が野党系メディア局の閉鎖に抗議するデモを行いました。警察による急襲でSozcu TVが政府の管理下に置かれたもので、過去1年間で3番目の同様の措置です。トルコ政府による報道機関への圧力が強まる中、記者団は言論の自由と報道の自由を求めて声を上げています。", "summary_en": "Protesters gathered in Istanbul to show their support for press freedom in Turkey. The protest was called just days after the police raided Sozcu TV and arrested several senior staff members.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/turkey-thousands-protest-closure-of-critical-media-outlets/a-80015347?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Turkey: Thousands protest closure of critical media outlets\nNovember 22, 2026\nSeveral thousand people in Istanbul took to the streets on Sunday to protest the closure of several opposition-linked media outlets in Turkey.\nProtesters chanted, cheered, and whistled as they marched several kilometers through the city, calling for press freedom and freedom of expression.\nThey carried a huge banner that read: \"We want freedom of thought, freedom of the press, and freedom for journalists.\" The protesters were also carrying placards that read, \"The press cannot be silenced.\"\nWhat sparked the protests?\nTurkey's main opposition party, Yeni Parti, called for a protest just days after police raided Sozcu TV, one of the last opposition-aligned television channels.\nSenior staff members were arrested during the raid. A government-appointed trustee was installed, and the TV company was placed under compulsory administration.\nIt was the third takeover in a year following similar actions against Tele1, Halk TV, Turkey's most-watched news channel, and the leading digital news website, T24.\nTimur Soykan, a journalist who was briefly detained for criticizing the government, said that the government was doing everything in its power to silence journalists but was failing to do so.\nSoykan asked the public to support Halk TV journalists, who plan to continue broadcasting on a new YouTube channel.\nIncreasing crackdown on critical media in Turkey\nOver the past decade, press freedom has faced sustained pressure in the form of prosecutions, digital censorship, and government accusations that journalists are spreading \"fake news.\"\nIn the last two months alone, Turkey has arrested several journalists for their reporting on a multibillion-dollar investment fund scandal. At least two of the journalists remain in pretrial detention.\nAccording to the media rights group MLSA, twenty-five journalists are currently imprisoned in Turkey.\nThis year, Reporters Without Borders ranked Turkey 163rd out of 180 countries in its Press Freedom Index.", "translation_ja": "", "vocab": []}, {"title_ja": "スーダン：ドローン攻撃がハルツーム国連ビルと住宅地を直撃", "title_en": "Sudan: Drones hit UN building, residential area in Khartoum", "summary_ja": "スーダンの首都ハルツームで、国連ビルが位置する住宅地がドローン攻撃を受けました。現地時間午前2時から4時半にかけて爆発が報告され、家屋が完全に破壊されましたが、すぐに死傷者の報告はありません。スーダンの軍事筋はドローンがエチオピアから発射されたと主張していますが、アディスアベバはこの非難を否定しています。", "summary_en": "The drones targeted Khartoum, damaging a UN building in the residential area. The UN agency deemed it unacceptable that humanitarian workers were exposed to such danger.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/sudan-drones-hit-un-building-residential-area-in-khartoum/a-80015122?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Sudan: Drones strikes hit UN building in residential area of Khartoum\nNovember 22, 2026\nThe United Nations reported on Sunday a drone attack on a residential area in Khartoum, Sudan's capital.\nA UN building located in a civilian neighborhood was damaged in the attack, according to the UN Office for the Coordination of Humanitarian Affairs (OCHA).\n\"It is unacceptable that we are put at such risk,\" said the UN's Resident and Humanitarian Coordinator in Sudan, Denise Brown.\nWhat do we know about the attack?\nThe AFP news agency reported that explosions were heard around Khartoum Airport and in other parts of the city from approximately 2:00 a.m. to 4:30 a.m. local time.\nAccording to a witness, a drone strike completely destroyed a house. There were no immediate reports of casualties.\nMeanwhile, a Sudanese army source said the drones had been launched from Ethiopia.\nSudan has repeatedly accused Ethiopia of allowing attacks to be launched from its territory. However, Addis Ababa has denied these accusations.\nDrone strikes are intensifying in Sudan\nSudan has been engulfed in a civil war since April 2023. The army of de facto ruler Abdel-Fattah al-Burhan and the RSF militia led by Mohamed Hamdan Daglo have been fighting for control of the country.\nThe conflict has killed tens of thousands of people and displaced more than 14 million.\nAccording to UN data, the use of drones has dramatically altered the course of the war this year, killing more than 1,100 people in the first six months.\nThe UN also said that of the hundreds of child casualties this year, two-thirds were killed or injured by drone strikes.\nJust days ago, a Sudanese army drone strike killed 15 people, including four children, in a West Kordofan village. The army was advancing through the state and recapturing territory from the RSF.", "translation_ja": "", "vocab": []}, {"title_ja": "リビア：ベンガジでロシア船が無人機攻撃を受ける", "title_en": "Libya: Suspected drone attack hits Russian ship in Benghazi", "summary_ja": "リビア東部のベンガジにあるロシア海軍基地で、日曜日早朝にロシア艦船が無人機による攻撃を受けました。ロシア海軍コルベット艦「メルクーリー」とみられる船舶は大部分が転覆・沈没し、負傷者が報告されていますが死者はいません。東部政府はこの攻撃をリビアの主権侵害と海上安全への脅威として非難し、ロシアと共同で調査を行うと発表しました。", "summary_en": "A Russian vessel at an eastern Libyan naval base was hit by what is suspected to be a drone strike.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/libya-suspected-drone-attack-hits-russian-ship-in-benghazi/a-80014545?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Libya: Suspected drone attack hits Russian warship in Benghazi\nNovember 22, 2026\nAn explosion occurred early Sunday on a Russian ship at a naval base in Benghazi in eastern Libya due to a suspected drone attack.\n\"Initial investigations indicate that the explosion occurred on board a Russian ship docked in the port,\" the eastern-based Libyan administration said in a statement.\n\"It is suspected that the ship was attacked by drones.\"\nAccording to medical sources, injuries were reported, but no deaths.\nThe statement added that, as part of a cooperation agreement between Russia and the eastern-based Libyan government, the vessel had stopped at the Benghazi port to refuel and resupply on its way back to Russia.\nAccording to satellite imagery provider Vantor, the ship was the Merkury, a Russian Navy corvette. Imagery taken on Sunday revealed that the majority of the vessel had capsized and sunk, leaving only the bow visible above the water.\nSince the 2011 uprising that overthrew longtime dictator Moammar Gadhafi, Libya has been divided between the UN-supported government in Tripoli and a rival administration in the east backed by military commander Khalifa Haftar.\nLocal authorities condemn attack\nThe eastern-based administration said the port and naval base facilities in Benghazi, including the warehouses, were safe. They added that normal operations would resume once the fire was under control and the site was secured.\nThe authorities condemned the suspected attack as a violation of Libya's sovereignty and a threat to maritime safety. They said they would take legal and diplomatic measures against those responsible and would launch a joint investigation with Russia.\nAs of Sunday afternoon, no one has claimed responsibility for the suspected attack.\nThe administration also stressed that Libya was not a party to the war between Russia and Ukraine or to any armed conflict beyond its borders. It said that its relations with friendly countries were a sovereign matter.\nIt said it would not allow \"Libyan ports, territory or territorial waters to be turned into an arena for settling scores or exporting international conflicts.\"\nSecond vessel hit near Benghazi\nMeanwhile, later on Sunday, two Libyan military sources told Reuters that a commercial vessel had been targeted by a drone boat off the coast of Benghazi. They added that Libyan naval forces had rescued the crew\nLibyan naval and air forces intercepted more than 12 naval drones, or drone boats, off the coast of Benghazi during the Sunday evening, according to Reuters sources.\nEchoes of Russia's war in Ukraine\nThe incident in Benghazi occurred as Ukrainian forces increased their long-range attacks against Russia, extending far beyond the front lines.\nOn Saturday, a drone hit a Russian cargo ship in the eastern Baltic Sea near Finnish waters. Finland's border guard said Ukraine carried out the attack.\nIn March, a Russian tanker was attacked in the Mediterranean near Maltese waters. Libyan officials at the time believed this to be a sea drone attack.", "translation_ja": "", "vocab": []}, {"title_ja": "民主党のチャック・ハバード氏が再計票で勝利、ノースカロライナ州の下院議席を奪取", "title_en": "Democrat Chuck Hubbard wins recount, flips North Carolina US House seat", "summary_ja": "民主党のチャック・ハバード候補がノースカロライナ州第5選挙区の再計票で勝利し、下院議席を獲得することが確定しました。AP通信による予測では、同氏がこの重要な議席の奪取に成功したとされています。この結果は同州の政治情勢に大きな影響を与える可能性があります。", "summary_en": "Democratic Chuck Hubbard will win the election in North Carolina's 5th congressional district, the Associated Press projects.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/democrat-chuck-hubbard-wins-recount-north-carolina-us/story?id=138362634", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ライブ: ABCニュースライブ", "title_en": "LIVE:  ABC News Live", "summary_ja": "ABCニュースは24時間365日、速報ニュースと生中継イベントをカバーしています。最新のニュース情報をリアルタイムで提供するサービスです。世界中で起きている重要なニュースを常に監視し、視聴者に最新情報を届けています。", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "デルタ航空、機器トラブルで1,600便以上に遅延", "title_en": "Over 1,600 Delta flight delays due to equipment problems", "summary_ja": "日曜日、デルタ航空はアトランタのハーツフィールド・ジャクソン・アトランタ国際空港を発着する数百便が技術的な問題により遅延した。この機器トラブルは同空港での同社の運航に大きな影響を与えた。1,600便以上の遅延が報告されている。", "summary_en": "Hundreds of Delta Air Lines flights in and out of Atlanta's Hartsfield-Jackson Atlanta International Airport were delayed on Sunday due to a technical issue.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/equipment-outage-atlanta-causes-1300-delta-flight-delays/story?id=138360900", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナの無人艦艇攻撃と見られる襲撃でロシア軍艦がベンガジで沈没", "title_en": "Russian warship sinks in Benghazi after suspected Ukrainian drone attack", "summary_ja": "リビアの港湾都市ベンガジで、ウクライナの無人艦艇による攻撃と見られる襲撃を受けたロシア海軍のコルベット艦「マークリー」が沈没した。複数の無人艦艇が発射され、少なくとも2隻が命中して爆発が発生した。この攻撃はウクライナが黒海以外での長距離攻撃を拡大させていることを示しており、地中海での約1,000マイル離れた地点での攻撃は戦争の地理的な拡大を示唆している。", "summary_en": "No one has claimed responsibility for the strike on the vessel, which had docked on its way back to Russia A Russian warship docked in the Libyan port city of Benghazi was struck in the early hours of Sunday in a suspected Ukrainian sea drone attack, causing a dramatic night-time explosion and the s", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/nov/22/blast-russian-ship-suspected-drone-attack-benghazi-libya", "state_media": false, "category": "政治", "full_text": "A Russian warship docked in the Libyan port city of Benghazi was struck in the early hours of Sunday in a suspected Ukrainian sea drone attack, causing a dramatic night-time explosion and the sinking of the vessel.\nThe strike severely damaged the Merkury, a Russian navy corvette that had stopped to refuel and take on supplies, according to Libyan officials from the country’s eastern government.\nInitial reports said several Ukrainian sea drones were launched at the ship. At least four drones were intercepted and destroyed, while two hit the warship, triggering the explosion, the officials told the Associated Press.\nSatellite imagery showed the Merkury had sunk after the attack, which took place in the Mediterranean, more than 1,000 miles from south Ukraine, marking a notable geographic expansion of the now near five-year war.\nThough Ukraine began the war with no navy, it has developed a sea drone capability that threatened Russian warships in the Black Sea. The Russian fleet has been forced to retreat to the eastern port of Novorossiysk because Sevastopol in occupied Crimea had become unsafe.\nHours later, a Russia-linked cargo ship said to be carrying military supplies, the Ascalon, was hit by a sea drone off the coast of Benghazi. Video showed the drone heading directly towards one end of the vessel, again causing a huge explosion.\nLibyan naval forces rescued the vessel’s crew, the sources added. The health ministry said some crew members were in stable condition with minor injuries. The number of injured and their nationalities are not known.\nBenghazi is controlled by the self-styled Libyan National Army, led by Gen Khalifa Haftar, which controls eastern and southern Libya and has been aligned with Russia.\nThere was no immediate reaction from Russian authorities, and no immediate claim of responsibility for the strike, but it comes as Ukrainian forces have stepped up their long-range attacks against Russia far beyond the frontlines.\nThe eastern-based Libyan authority said port and naval base facilities, including warehouses, were safe and that normal operations would resume once the fire was brought under control and the site secured.\nIt condemned the suspected attack as a violation of Libya’s sovereignty and a threat to maritime safety, saying it would take legal and diplomatic measures against anyone found responsible.\n“The Libyan government will not allow Libyan ports, territory or territorial waters to be turned into an arena for settling scores or exporting international conflicts,” it said.\nThe specialist website Naval News earlier identified the ship attacked as the Merkury, a Russian corvette – the smallest class of warship, smaller than a frigate – and said it had almost certainly been destroyed.\nHI Sutton, a naval analyst, said the attack was probably conducted by sea drones, after a photograph of one emerged apparently taken off the Libyan coast. The drone, he said, “is also likely the type used in the subsequent attack”. Similar-looking drones were involved in the subsequent attack on the Ascalon cargo ship.\nIf it is confirmed that Ukraine has been able to blow up or seriously damage a Russian warship in Benghazi, it would represent one of its most successful naval strikes during the almost five-year war.\nBut it also represents a risky extension of the fighting far beyond eastern Europe, in an incident that could affect civilians on another continent and the working of the port.\nA small unit of Ukrainian special forces operatives has been based at Misrata, western Libya, and is believed to have coordinated drone attacks on Russian tankers and transport ships in the past year.\nRussian ships regularly make use of the port, which has a growing military importance to the Kremlin, to supply Russian mercenary forces in Africa and as a base in the Mediterranean since the country lost its bases in Syria.\nSeparately, a fire onboard a Russian cargo ship that was struck by drones in the Baltic Sea continued to smoulder on Sunday, Finland’s border guard said, with emergency services from Finland, Russia and Estonia working together to put out the blaze.\nThe Finnish military said the strike on the Sparta II on Saturday was probably carried out by Ukraine and that the vessel later drifted into Finnish waters, where it remained at anchor. The 16 crew members were evacuated on to a nearby Russian ship. One crew member was slightly injured.\nOn Sunday, visible flames had been put out, with operations focusing on cooling down the containers and stabilising the vessel, Finnish authorities said.\nThe ship, bound for the Russian exclave of Kaliningrad, had been damaged in international waters west of Russia’s Gogland Island, Finland’s defence forces said, corroborating an account by Russian officials. Kyiv has sent waves of military drones towards the Leningrad region on Russia’s north-west coast this year, including some that strayed into the airspace of nearby Baltic countries, leading to fears that the war was spi", "translation_ja": "", "vocab": []}, {"title_ja": "カリフォルニア州の沿岸コミュニティが数年ぶりの大波に警戒態勢", "title_en": "California’s coastal communities on alert as biggest waves in years hit state", "summary_ja": "カリフォルニア州沿岸部は低気圧によって発生した強力なうねりと大波の警報が発令されており、モンタレーの波高は30年ぶりに34.1フィートを記録しました。今週末までに10～22フィートの波が予想され、同時に西部全域で豪雨や山岳地帯の積雪が予測されています。さらにインドではサイクロン・アクヴァンが上陸を控えており、オディシャ州では約72,000人が避難を開始しています。", "summary_en": "Hazard warnings issued throughout week after powerful swells and waves of more than 9 metres recorded Multiple coastal hazard warnings were issued this week across California as successive areas of low pressure generated powerful swells and large breaking waves for coastal communities. Beaches and p", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/us-news/2026/nov/20/california-coastal-communities-alert-big-waves-hit-state", "state_media": false, "category": "政治", "full_text": "Multiple coastal hazard warnings were issued this week across California as successive areas of low pressure generated powerful swells and large breaking waves for coastal communities. Beaches and piers were closed last weekend as large waves crashed into California’s coastline. Offshore National Oceanic and Atmospheric Administration buoys recorded wave heights of greater than 30ft (9 metres) last Friday. The Monterey, California, buoy recorded a wave height of 34.1ft, which would make it the highest reading in 30 years.\nCoastal warnings extended from last weekend through this week, with alerts extending until Friday night. Waves of 10-18ft are expected, with local sets of 18-22ft for San Luis Obispo county beaches and Santa Barbara county central coast beaches. These Pacific storm systems are also bringing unsettled conditions across the western US, with heavy rain, mountain snow, and strong winds through the coming days. Already, record-breaking rainfall affected San Fransisco on Wednesday, with heavy rain also causing 32,000 customers to lose power in Sacramento. Into this weekend, a further area of low pressure will bring considerable amounts of moisture for southern Oregon and northern California. By Sunday night, more than 100mm (4in) of rain is expected in places, with further snowfall for areas such as Donner Pass across the northern Sierra Nevada mountains.\nNearly 72,000 people have been evacuated from areas of Odisha in eastern India as Tropical Cyclone Akvan approaches land. Akvan is expected to make landfall on Friday between Narsapur and Puri, prompting cyclone warnings from the India Meteorological Department for north Andhra Pradesh, Yanam and south Odisha coasts. Peak wind gusts are expected to reach 70mph, with rainfall totals through Friday and Saturday potentially exceeding 200mm for northern coastal Andhra Pradesh and Odisha.\nAfter a yellow level 2 severe thunderstorm warning by the South African Weather Service on Tuesday, torrential rainfall and large hail were reported across parts of Johannesburg. The storms triggered flash flooding and caused infrastructure damage in the township of Soweto. One person died, while another remains missing after the severe storms.", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカの樹齢数百年のバオバブ5本、輸出ブロック後の植え替え急ぐ", "title_en": "Race to replant five South African baobabs after export blocked", "summary_ja": "南アフリカの環境保全活動家たちが、輸出業者によって掘り起こされた樹齢数百年のバオバブ5本の植え替えを急いでいます。これらの20トンの巨木はジョージアへの輸出が認可されず、7月からダーバンの倉庫に保管されていました。専門家によると、バオバブを装飾用植物として輸出することは極めて稀で、掘り起こしと輸送、再確立が非常に困難だとされています。", "summary_en": "The trees, intended for an unnamed buyer in Georgia, were reportedly dug up without the necessary permits Environmentalists in South Africa are racing to replant five centuries-old baobabs after the 20-tonne trees were dug up by an exporter, who tried to ship them thousands of miles to Georgia. The ", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/environment/2026/nov/19/baobab-five-trees-south-africa-dug-up-export-blocked-georgia-aoe", "state_media": false, "category": "政治", "full_text": "Environmentalists in South Africa are racing to replant five centuries-old baobabs after the 20-tonne trees were dug up by an exporter, who tried to ship them thousands of miles to Georgia.\nThe baobabs arrived at a reserve in Timbavati, in north-eastern South Africa, on Wednesday, where they will be replanted and supported by cables to help them recover. The trees had been stranded at a warehouse in Durban since July, when they were intercepted by authorities who said they had been moved without the necessary permissions.\nThe department of forestry, fisheries and the environment confirmed the trees had been destined for Georgia but did not name the buyer.\nThe case echoes an episode in Kenya four years ago, when eight baobabs were uprooted to be exported to Shekvetili Dendrological Park, owned by Bidzina Ivanishvili, an influential Georgian billionaire and the country’s former prime minister. Ivanishvili has filled the park with ancient, giant trees from Georgia, transporting them by boat along the Black Sea.\nThe export of the Kenyan baobabs was initially blocked after an outcry by environmentalists, who condemned their export as biopiracy, but later allowed to go ahead.\nOtherwise, such exports are very rare, say experts. David Newton, programme office director for east and southern Africa for Traffic, an NGO that monitors the trade in wild animals and plants, said: “It is very unusual to see baobabs being used as ornamental plants … mainly because they are exceptionally difficult to dig out of the ground and transport, and then to successfully re-establish.”\nSarah Venter, founder of the Baobab Foundation, who has led efforts to replant the South African trees, said she believes they have a good chance of surviving if they are replanted quickly. The winter months of May to October, when the trees lose their leaves and are dormant, is a good time to move them.\n“As soon as spring starts [in November], the trees use their water to flush their new leaves, and that’s when we need to get them into the ground as soon as possible,” she said.\nThe rescue mission has faced delays because of the challenges associated with moving such large trees, which are transported on special trucks capable of carrying abnormal loads. The five baobabs weigh between 19 and 29 tonnes, have a diameter of up to 4.5 metres (15ft) and a height of up to 12.5 metres.\nBaobabs, known as the tree of life, are protected under South African law, which means a permit is required to cut or disturb them.\n“A baobab isn’t just part of an ecosystem, it is an ecosystem in itself,” said Wambui Ippolito, a landscape designer, lecturer and horticulturist from Kenya. “These trees are biodiversity anchors.”\nAnimals ranging from bats and bush babies, to grey-headed parrots and the southern ground hornbill shelter in its cavities, while elephants, monkeys and warthogs feast on its fruit.\nThe trees have huge cultural importance, added Ippolito. “It has always been a sacred tree in Africa. It doesn’t matter where you go: Senegal, Mali, Ghana – wherever you go, if there is a community around a baobab tree, that tree is sacred,” she said. “Somebody’s great-great-great-great-great-grandparents sat under that tree, and it is part of human history in that area.”\nBaobabs have shallow roots, which means they do not need to be planted very deeply, and these regrow fairly quickly, said Venter. Once replanted, the trees will be stabilised with cables and protected by electric fences to prevent damage from elephants.\nThe trees are thought to be between 200 and 300 years old. “Baobabs easily reach 1,000 years old, so they’ve got a few hundred years ahead of them if they survive,” said Venter.\nA criminal case has been opened against the owner of a landscaping company allegedly responsible for the illegal harvesting and transportation of the trees.\nFind more age of extinction coverage here, and follow the biodiversity reporters Rebecca Ratcliffe, Phoebe Weston and Patrick Greenfield in the Guardian app for more nature coverage.", "translation_ja": "", "vocab": []}, {"title_ja": "WHO事務局長、エボラ流行地域のコンゴ民主共和国での激しい戦闘の中での平和を呼びかけ", "title_en": "WHO chief calls for peace amid heavy fighting in Ebola-hit DR Congo region", "summary_ja": "世界保健機関(WHO)の事務局長は、コンゴ民主共和国北東部イトゥリ州の病院付近での激しい戦闘により、エボラ対応活動が中断され、保健医療従事者と援助スタッフが24時間以上分娩室に避難していると述べた。同地域ではエボラの高いレベルの感染が続いており、11月17日時点で5,678人の死亡を含む11,613例が報告されている。WHOは医療スタッフの安全な脱出と病院施設の保護を実現するため、「最良の医学は平和である」と強調している。", "summary_en": "Fighting near a DRC hospital disrupts Ebola efforts, putting patients and workers at &#039;grave risk&#039;, WHO warns.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/23/who-chief-calls-for-peace-amid-heavy-fighting-in-ebola-hit-dr-congo-region?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "WHO chief calls for peace amid heavy fighting in Ebola-hit DR Congo region\nFighting near DRC hospital disrupts Ebola efforts, putting patients and workers at ‘grave risk’, WHO warns.\nThe World Health Organization (WHO) chief has urged peace following heavy fighting in the Democratic Republic of the Congo’s (DRC) northeastern province, the epicentre of the Ebola outbreak.\nWHO Director-General Tedros Adhanom Ghebreyesus said on Sunday that fighting near a hospital in the DRC’s Ituri province disrupted Ebola response efforts and forced health workers and aid partners to shelter inside a maternity ward for more than 24 hours.\n“Heavy fighting has been ongoing since yesterday in the vicinity of a hospital in Ituri – in an area close to where the Ebola outbreak first emerged,” Tedros said on X.\n“The situation has disrupted the work of the hospital and the wider Ebola response, putting patients, families and health workers at grave risk.”\nMedical staff have been sheltering for their lives in a maternity ward in the facility for more than 24 hours, and the WHO is working to arrange a safe exit for the team and “for the hospital facilities, staff and patients to be protected,” Tedros also said.\n“The best medicine is peace,” he added.\n‘High-level transmission continues’\nAs of November 17, the WHO reported a total of 5,678 deaths out of 11,613 cases in the DRC, the largest and deadliest Ebola outbreak in the country.\nThe WHO said in a statement on Saturday that “while some areas had seen a slight decline in cases, sustained, high-level transmission continues overall in the country.”\nIturi and North Kivu, in the eastern part of the DRC, remain the most affected provinces.\nThe virus, which is transmitted through contact with bodily fluids, has spread across swaths of the DRC’s east and northeast, which have been plagued by violence for more than 30 years.\nEarlier in November, armed men thought to be linked to an ISIL (ISIS)-affiliated group raided villages and killed dozens of people in North Kivu, forcing patients with confirmed and suspected Ebola infections to flee.\nThe outbreak is also occurring amid ongoing fighting between government forces and the Rwanda-backed M23 armed group, which has seized key cities in eastern DRC, making transport of healthcare resources to remote regions difficult.", "translation_ja": "", "vocab": []}, {"title_ja": "AI バブル懸念の高まりで韓国株式市場が急落", "title_en": "South Korea’s stock market tumbles as AI bubble fears mount", "summary_ja": "韓国の総合株価指数（コスピ）は月曜日の取引開始時に3.7%以上下落し、アジア太平洋地域全体でのテクノロジー関連の売却が続いています。AI産業への巨額投資の持続可能性に対する懸念の高まりに加え、米国の規制強化の見通しとNvidiaのスキャンダルが市場の不安を増幅させています。金曜日の取引では、コスピは5.2%下落し、日経平均とTaiexもそれぞれ5.1%と6.2%の下げを記録しました。", "summary_en": "The Kospi falls more than 3 percent as markets across the region brace for losses.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/23/south-koreas-stock-market-tumbles-as-ai-bubble-fears-mount?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "South Korea’s stock market tumbles as AI bubble fears mount\nThe Kospi falls more than 3 percent as markets across the region brace for losses.\nSouth Korea’s stock market has opened to sharp losses as markets across Asia brace for volatility amid mounting concerns over the sustainability of the AI boom.\nThe Korea Composite Stock Price Index (Kospi) fell as much as 3.7 percent in early trading on Monday, continuing Friday’s tech-led sell-off across the Asia-Pacific region and in the United States.\nThe Kospi’s retreat came as investors anticipated volatile trading across the region upon the opening of key markets in Taiwan, China and Hong Kong later on Monday morning.\nOn Friday, the Kospi closed down 5.2 percent, while Japan’s Nikkei 225 and Taiwan’s Taiex tumbled 5.1 percent and 6.2 percent, respectively.\nOn Wall Street, the benchmark S&P500 closed 3.7 percent lower for its seventh straight loss, while the tech-focused Nasdaq Composite dropped 5.3 percent to erase all of its gains for 2026.\nInvestors have long been concerned that tech firms may not be able to sustain the multi-trillion-dollar investments they have poured into infrastructure to power AI.\nConcerns that the AI boom may be running out of stream have been exacerbated by expectations that the incoming Democratic-led US Congress will push for tighter regulation of the sector and the alleged spying scandal roiling chip giant Nvidia.\nMore to follow…", "translation_ja": "", "vocab": []}, {"title_ja": "カメルーンの元反政府勢力、身を隠すことと破られた約束の間で揺れる", "title_en": "Cameroon’s ex-rebels caught between hiding and broken promises", "summary_ja": "カメルーンの英語圏地域で分離独立運動に参加していた元戦闘員たちは、政府の武装解除・動員解除・社会復帰（DDR）プログラムへの参加に消極的であり、逮捕を恐れながら生活している。2016年から2020年の間に兵士を殺害したという元司令官コリンズ・ムバは、現在は伝統的な治療者として働いており、政府との関わりを完全に拒否している。2016年10月に始まった紛争は数千人を殺害し、数十万人を避難させており、カメルーン政府は軍事作戦と並行して地域対話イニシアティブを推進している。", "summary_en": "Cameroon’s former rebels face arrest fears and failed reintegration.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/11/23/cameroons-ex-rebels-caught-between-hiding-and-broken-promises?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Cameroon’s ex-rebels caught between hiding and broken promises\nCameroon’s former rebels face arrest fears and failed reintegration.\nDouala, Cameroon – Collins Mbah says he hunted down and killed several Cameroonian soldiers in the English-speaking Northwest region during his time as a separatist fighter between 2016 and 2020. Today, in the coastal city of Douala, the man in his mid-30s, who went by the name Commander No Sorrow, has taken on a different role: traditional healer, tending to lives rather than taking them.\nMbah says he abandoned the armed struggle after realising that fellow fighters were turning against the very people they had set out to protect. But he has firmly ruled out joining the government’s disarmament, demobilisation and reintegration (DDR) programme.\n“Quitting the struggle and joining the government disarmament programme would have meant I betrayed the people,” said Mbah, who dropped out of secondary school to join the revolt. “I don’t want to have anything to do with the government or the struggle any more. All I need now is peace of mind,” he told Al Jazeera.\nOctober marked a decade since protests erupted in Cameroon’s English-speaking Northwest and Southwest regions, eventually escalating into an armed conflict between separatist fighters and government forces.\nThe unrest began in late 2016 after Anglophone lawyers and teachers protested against the appointment of Francophone magistrates unfamiliar with British common law to courts in English-speaking regions, and French-speaking teachers unable to communicate fluently in English to schools there. The protests were met with a government crackdown and eventually gave rise to a separatist movement seeking independence for the two regions, which its supporters call “Ambazonia”.\nThe conflict has killed thousands of people, displaced hundreds of thousands and disrupted education across the two English-speaking regions, according to humanitarian and human rights organisations. New figures released in October by the Cameroonian nonprofit Centre for Human Rights and Democracy in Africa (CHRDA) suggest the death toll could be as high as 10,000.\nThe fighting remains deadlocked, with separatist groups continuing attacks and kidnappings while the government pursues a military campaign. Alongside its military operations, the government has launched a community dialogue initiative, after distancing itself from Swiss- and Canadian-supported peace efforts.\nPrime Minister Joseph Dion Ngute launched the initiative in Buea, the capital of Southwest, in September and in Bamenda, the capital of the Northwest, on October 15. Local leaders are being encouraged to persuade fighters to surrender and enter DDR centres. At the two events, 55 fighters – 25 in the Southwest and 30 in the Northwest – were presented as having renounced the armed struggle.\nLife beyond the battlefield\nDespite leaving the rebellion, Mbah says he remains on the government’s wanted list. Without a national identity card, the father of three struggles to move freely around Douala and occasionally ventures into the outskirts to collect traditional herbs.\n“I was initiated into traditional healing during childhood. The amulets and concoctions helped me foresee any danger when I was on the war front. Today, I use the same to heal,” he said. “But I don’t stay in a particular neighbourhood for long – I always move to the next to avoid being caught.”\nMbah is among former fighters who have chosen to reintegrate into society independently rather than enter government-run rehabilitation centres. Many say they fear arrest or poor treatment if they surrender.\nPeter Mosongo, 28, now works as a motorcycle taxi rider in Buea after leaving the struggle in 2019. He joined in 2018 to protect his family but quit after witnessing what he describes as the indiscriminate killing of civilians by fellow fighters.\n“I received threats from the fighters when I quit. They even kidnapped my father to force him to produce me,” Mosongo said. “I didn’t join DDR upon quitting out of fear that I may end up in prison. It was also being rumoured that those who surrendered were being killed silently.”\nMosongo says he also lost two cousins to the conflict.\nAnother former fighter, Richard Bende, left in 2019 because he believed the rebellion had become a “scores-settling venture”. He had fought government soldiers in Bamusso, in the Southwest, and now works as a secondary school history and geography teacher. Like Mbah and Mosongo, he avoided the DDR programme, citing concerns about the treatment of former fighters at its centres.\nBroken promises inside DDR centres\nPaul Mukete, who fought in Kumba from 2017 to 2020 under the nickname King of Vultures, chose a different path. But six years after entering the DDR programme in Tiko town, in the Southwest, he says he has little to show for it.\nApart from learning poultry and pig farming, Mukete says he has received no psychological care.\n“We gave intelligence information to ", "translation_ja": "", "vocab": []}, {"title_ja": "ウクライナの海上ドローンがリビアのベンガジ海軍基地のロシア軍艦を攻撃か、リビア当局が発表", "title_en": "Suspected Ukrainian sea drones hit Russian warship at Benghazi naval base, Libyan officials say", "summary_ja": "11月22日、リビア東部のベンガジ海軍基地でウクライナの海上ドローンとみられる攻撃によってロシア海軍のコルベット艦「マークリー」が被弾し、火災が発生したと報告されました。ウクライナ勢力が西部リビアの基地から複数のドローンを発射し、うち2機が艦を命中させたとリビア軍関係者は述べています。この攻撃はロシア・ウクライナ戦争とリビアの地政学的対立が絡む最新の事案です。", "summary_en": "The strike at the Benghazi Naval Base in eastern Libya severely damaged the Merkury, a Russian navy corvette, and ignited a fire at the facility, two Libyan military officials said", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/suspected-ukrainian-sea-drones-hit-russian-warship-at-benghazi-naval-base-libyan-officials-say/article71733178.ece", "state_media": false, "category": "政治", "full_text": "A suspected Ukrainian drone strike hit a Russian warship on Sunday (November 22, 2026) at a naval base in Libya, officials said, the latest attack in the North African nation linked to the Russia-Ukraine war.\nThe strike at the Benghazi Naval Base in eastern Libya severely damaged the Merkury, a Russian navy corvette, and ignited a fire at the facility, two Libyan military officials said.\nThey said that several Ukrainian sea drones were launched at the ship from a base run by Ukrainian forces in western Libya, according to an initial investigation into the attack. At least four drones were intercepted and destroyed, while two hit the warship, they said.\nThe officials, affiliated with the self-styled Libyan National Army, which controls eastern and southern Libya, spoke on condition of anonymity because they weren't allowed to talk with reporters.\nLibya has been divided since a NATO-backed uprising toppled longtime dictator Muammar Gaddafi, who was later killed, in 2011. A UN-supported government is based in Tripoli, and a rival administration is located in the east. The oil-rich nation remains a focal point for a long-running rivalry between Russia and the West.\nThe eastern Libya-based government said in a statement that the strike on Sunday (November 22) caused an explosion and fire at the base, which was later extinguished.\nThe Almasar satellite television channel aired footage showing a vessel erupting into flames. It said the Libyan navy rescued the crew of the Maltese-flagged ship. A corvette is a warship smaller than a frigate or destroyer and is built to patrol coastal waters and escort other ships.\nThe vessel had docked at the Libyan base for refuelling and supplies as part of a cooperation agreement between Russia and the eastern-based government in Libya, the statement said, without providing details on the vessel or its cargo.\nA joint investigation was launched with Russia to “uncover the circumstances of the attack, its source, and the party behind it,” the statement said.\nNo group immediately claimed responsibility for the attack. There was no immediate comment from either Russia or Ukraine.\nA European official said the reports of an explosion at Benghazi Port involving a Russian vessel appeared to be credible. The official, who spoke on condition of anonymity because they were not authorised to speak on the record, said the vessel has been identified as a Russian corvette, adding they had no assessment of cause at this time.\nOn Sunday (November 22) evening, local media said that another sea drone hit a Maltese-flagged commercial vessel off the port of Benghazi in a separate attack. No further details were given. Almasar said that naval and air forces destroyed at least 12 other sea drones off the Mediterranean city.\nThe western Libyan government expressed concerns about “dragging Libyan ports and civilian facilities into external conflicts,” in an apparent reference to the war in Ukraine.\n“The government reaffirms its categorical rejection of turning Libya into an arena for international conflicts or a theatre for external powers to settle scores,” it said in a statement.\nIn March, Ukrainian forces operating in western Libya under a covert deal struck a Russian tanker in the Mediterranean in a suspected sea drone attack near Maltese waters, Libyan officials said at the time.\nThe Ukrainian forces, most of them drone experts, operated mainly at an air base in the coastal city of Misrata, but also at other military facilities in the capital, Tripoli, and the coastal town of Zawiya, the officials told The Associated Press.\nPublished - November 23, 2026 06:32 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "シアトル空港でICEに拘束された父娘、家族の洗礼式に向かう途中だったと弁護士が主張", "title_en": "Father, daughter detained by ICE at Seattle airport were travelling to family baptism, says lawyer", "summary_ja": "シアトル・タコマ国際空港でICE職員に拘束された父娘は、カリフォルニアでの家族の洗礼式に向かっていたと彼らの弁護士が述べた。父親は2015年からアメリカで生活し庇護を申請しており、娘はカレッジを卒業し非営利団体で働いており、どちらも犯罪歴がないという。拘束の際に別の乗客が職員にホットコーヒーをかけたとICEは主張している。", "summary_en": "Other passengers boarding the Alaska Airlines flight used their cellphones to film the father and daughter being detained by the officers, who were wearing unmarked jackets and khaki pants", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/father-daughter-detained-by-ice-at-seattle-airport-were-travelling-to-family-baptism-says-lawyer/article71733166.ece", "state_media": false, "category": "社会", "full_text": "A father and daughter detained by masked immigration officers on an airport jet bridge in Seattle, causing chaos in front of other passengers, were heading to a family baptism ceremony in California, their lawyer said Sunday (November 22, 2026).\nAlso read | Indian-origin man detained in Texas after serving sentence for visual recording conviction\nOther passengers boarding the Alaska Airlines flight at Seattle-Tacoma International Airport on Saturday (November 21) used their cellphones to film the father and daughter being detained by the officers, who were wearing unmarked jackets and khaki pants. The recordings were widely viewed on social media.\nThe videos show the officers struggling with someone on the ground. The flight, bound for Los Angeles, was delayed.\nImmigration and Customs Enforcement said in a statement that its officers detained Ricardo Larrondo Mendoza, an immigrant from Mexico who, it said, had overstayed his visa \"in violation of our nation's laws.”\nDuring the confrontation, another passenger “hurled hot coffee on the officers,” the ICE statement said. That woman, Sofia Hernandez Mejia, was determined to be in the U.S. illegally from Mexico and to have also overstayed her visa, ICE said. She could be charged with assaulting a federal officer.\nThe father and daughter were travelling to attend a baptism ceremony in California and are seeking asylum in the U.S., where they have lived since 2015, their lawyer, Olia Catala, told The Associated Press in a telephone interview on Sunday (November 22). They have no criminal record, Ms. Catala said.\nMs. Mejia, in her mid-20s, had married a U.S. citizen and filed paperwork for adjustment of her status, the attorney said. Ms. Mejia's husband was accompanying Ms. Mejia and her father when they were detained Saturday (November 21), Ms. Catala added. The husband was not detained, the attorney said.\n“They've done everything correctly, and these are educated people,\" Ms. Catala said of the father and daughter. \"She went to college, to university; she worked for a nonprofit. No criminal history [for] any of them. So it's just heartbreaking.”\nBoth were being held at the Northwest ICE Processing Centre in Tacoma, Ms. Catala said.\nShe said Ms. Mejia was carrying a cup of coffee when the confrontation occurred.\n“When somebody's charging at you, you're going to drop a cup of coffee,\" Ms. Catala said.\n“It was just a lot of commotion, and honestly, if somebody is running at you or charging at you and they're not wearing a uniform, you don't know who they are,\" Ms. Catala said. \"There was a lot of panic, chaos, not knowing what's going on.”\nAlaska Airlines said ICE officers gave no advance notice of the enforcement action, which occurred during a busy travel weekend ahead of the Thanksgiving holiday.\nICE has stepped up arrests at airports since the summer, especially targeting people it says have overstayed visas.\nAlaska Airlines said it was working with the Port of Seattle, which manages the airport, to see if protocols were followed, and also that it has raised concerns “directly with the appropriate authorities.”\nThe Port of Seattle said in a statement that the arrest was distressing not only for the affected family but for other passengers, and that local authorities would “engage federal officials to understand more about what occurred.”\nWashington Governor Bob Ferguson, a Democrat, said ICE's tactics were “deeply un-American” and called for the agency's abolition.\n“The video is horrific, and it is chilling,” Mr. Ferguson said at a news conference Saturday (November 21) with labour leaders and local elected officials.\nPublished - November 23, 2026 05:37 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルのアイゼンコット氏、ユダヤ人入植者による放火攻撃を非難", "title_en": "Israel’s Eisenkot condemns arson attacks by Jewish settlers in West Bank", "summary_ja": "イスラエルの入植者がパレスチナ占領地区で日曜日に放火と人種差別的な落書きで攻撃を行い、政府樹立を試みるアイゼンコット氏は「ユダヤ人テロ」と非難した。イスラエル警察は調査を開始し、軍部も暴力を非難している。イスラエルの一部閣僚はこうした過激派の行為は国家の安全保障と外交関係に深刻な害をもたらしていると指摘している。", "summary_en": "Gadi Eisenkot called the attacks ‘Jewish terrorism’, saying that ‘extremist groups that set ⁠fire to vehicles and homes are undermining regional stability, putting lives at risk and doing grave damage to Israel’s national security and foreign relations’", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/israels-eisenkot-condemns-arson-attacks-by-jewish-settlers-in-west-bank/article71732544.ece", "state_media": false, "category": "経済", "full_text": "Israeli militant settlers attacked Palestinian villages in the occupied West Bank early on Sunday (November 22, 2026), starting fires and scrawling racist graffiti, residents said, prompting an accusation of “Jewish terrorism” from the man trying to form an Israeli government.\nAlso read | Israeli settlers set fire to mosque in occupied West Bank\nThe attacks come nearly a month after an inconclusive election stripped incumbent Prime Minister Benjamin Netanyahu of his majority. Opposition leader Gadi Eisenkot has been asked to form a government, though his prospects seem little better.\nReuters saw burned-out Palestinian vehicles and walls spray-painted with slogans such as “Revenge” and “Death to Arabs” in villages near Ramallah. No one immediately claimed responsibility and no injuries were reported.\nMr. Eisenkot called the attacks “Jewish terrorism”, saying that “extremist groups that set fire to vehicles and homes are undermining regional stability, putting lives at risk and doing grave damage to Israel’s national security and foreign relations”.\nHe said the policies of Itamar Ben-Gvir and Bezalel Smotrich, ultra-nationalist ministers in Mr. Netanyahu’s cabinet, had “brought the area to the brink of anarchy, and the authorities have yet to address the crisis”.\nMr. Netanyahu has not yet commented, but Foreign Minister Gideon Saar condemned the attacks by a “handful of extremists” and said they are “against our values and do not represent the law-abiding citizens of Judea and Samaria” — the biblical names for the West Bank.\n“Israeli authorities are firmly committed to enforcing the law against extremist violence,” he told the ELNET Jerusalem Summit.\nISRAELI POLICE INVESTIGATING\nUN bodies and most countries of the world deny the legality of the settlements, which make the prospect of an independent Palestinian state ever more remote, a position Israel disputes.\nIsraeli police said they opened an investigation into the attacks, while the military condemned the violence, saying soldiers and police had been dispatched to the areas of Deir as-Sudan, Deir Abu Masha’al, Kafr Malik and At-Tuwani “following reports and footage showing vehicles being set on fire and graffiti being sprayed in the area”.\nMr. Ben-Gvir replied in an X post that Mr. Eisenkot’s condemnation amounted to selling out to Arab parties, which could become part of a possible new government. Mr. Smotrich favours settlement expansion and wants Israel to annex the West Bank.\nYousef Jabareen, head of the Joint List, the largest Arab party in Israel’s parliament, said the attacks were “the direct result of the deepening occupation and a government policy under which violence against Palestinians has become an everyday occurrence”, citing encouragement from Mr. Ben-Gvir and Mr. Smotrich.\nIsrael’s parliament was sworn in on November 10 without a new government, after the election on October 27 stripped Mr. Netanyahu of his majority but left others with no clear path to power.\nPresident Isaac Herzog has tasked Mr. Eisenkot, who heads the centre-right Yashar, with forming a government, while Mr. Netanyahu remains caretaker Prime Minister.\nUnless Mr. Eisenkot forms a unity government with Mr. Netanyahu, he is likely to need support from Arab parties to be able to count on a majority of Parliament’s 120 seats.\nIf no one is able to form a government, another election will be held next year.\nPublished - November 23, 2026 05:11 am IST", "translation_ja": "", "vocab": []}, {"title_ja": "ハイウェイ407の通行料金が2027年に値上げ。ドライバーの負担増を解説", "title_en": "Highway 407 tolls are going up in 2027. Here’s how much more drivers can expect to pay - Toronto Star", "summary_ja": "トロント・スターの報道によると、ハイウェイ407の通行料金が2027年に引き上げられることが明らかになりました。この値上げにより、利用者の負担がどの程度増加するのか、具体的な金額が示されています。", "summary_en": "Highway 407 tolls are going up in 2027. Here’s how much more drivers can expect to pay Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi9wFBVV95cUxNa3dvV3dQcVp1d2hma2gxSzYwWjJlcFV2c1JaenVKdWV0Ymp1TUdNSUNCTHd4aG1lUXgxYVlFUVpOTUJyYV9mOUJncnZLVG9uQmNON2FQZTFLWmRtV21Gd0s2QlhhOFcxd1dFYWx1U1NxZGJzaW5JdGN3ZFBXeVRhTEk3UDhmb29JMUszYnNBdGtwY2Zvd1pDc3k3TU5oX2Q3cDhldG5HbFhLWDMwOFREODkycmo4N0dVeWFWQ0xReWx0anpMUmUxTDRMVk9BbmROc3lZV0ZCY3NIMzdTTE91aDNXTzltVmJScXhPbkJlOEtpLTNENjVr?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ノースヨークのコヨーテ攻撃、数ヶ月間の違法給餌と関連 - 野生動物団体が警告", "title_en": "North York coyote attack linked to months of illegal feeding, wildlife group warns - Toronto Star", "summary_ja": "トロント・スターの報道によると、ノースヨークで発生したコヨーテによる攻撃事件は、数ヶ月間にわたる違法な給餌行為が原因である可能性が高いと野生動物保護団体が警告しています。この事件は、人間がコヨーテに食料を与えることの危険性を浮き彫り
