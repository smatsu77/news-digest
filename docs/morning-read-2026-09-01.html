scued from hydropower project sites.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5ylvgq9q71o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Nepal rescuers blast hillside in search of hydropower workers as families wait anxiously\n- Published\nThe families of more than 600 workers believed to be trapped in a vast network of mud-filled tunnels along Nepal's Trishuli River are clinging to hope their loved ones can be found alive.\nRescuers continued battling to reach them on Monday, using explosives to blast into the hillside before pumping air into the Trishuli-3A site - fearing a critical window to reach survivors is closing.\n\"I wish we could find him. I wish he would come home,\" Anushila Bhandari, wife of Aurus Bhandari, a 33-year-old engineer missing on a project site, told BBC Nepali.\nIt comes as the death toll from the flood disaster on the Nepal-Tibet border reached 939, according to the country's disaster management authority.\nThe agency also revised its estimate of the number of missing to 3,925, of whom 592 are foreign nationals.\nRoughly one in seven missing people are believed to be workers at the hydropower plants. Nepalese Prime Minister Balendra Shah said on Monday that 279 people had been rescued from the sites.\nThe rescue operation is being spearheaded by an international team made up of Chinese and Nepalese military personnel, while experts from India, Korea and Australia are also involved.\n\"I still have a 50% hope that he is alive because there is an oxygen system inside,\" Sita Pandey, whose husband was working in the plant when the floods hit, told Nepalese daily Kantipur.\nNepal relies heavily on hydropower and has spent years developing the projects along its mountainous river systems. At least 11 projects either completed or under construction were damaged in the floods, authorities said.\nRescuers began pumping air into a tunnel over the weekend, but the families of those trapped say that should have been done earlier.\nA team was able to get into a tunnel leading to one hydropower plant earlier on Monday, but withdrew after finding no one there.\n\"The longer it takes, the more our hope dies. This operation must move much faster because every second is meaningful to us,\" Jiban Khadka, whose relative is also trapped inside the plant, told Kantipur.\n\"It's a frustratingly slow operation,\" Khadka added.\nNepalese leader Shah said rescue operations had been \"intensified\", noting that 11,379 people had been rescued so far.\nAnother family member anxiously awaiting news is Priya Kharel, whose brother Milan was working as an engineer in the Upper Trishuli-1 plant when the floods hit.\n\"Those who returned from the hydropower site said there were people inside the tunnel,\" she told BBC News Nepali. \"So there is hope that if the army reaches them quickly, they can be saved.\"\nAustralian engineer Arnold Dix, who has been helping Nepalese authorities with the underground search operations remotely, said rescuers had been struggling to find the tunnels.\n\"The actual signature of them has gone - everything is just missing. It looks like a lunar landscape,\" he told BBC Radio 4's World at One.\nOnce rescuers knew where the power stations were, Dix said they could then decide the best way to access them, which typically involves digging and \"blasting boulders\".\n\"There's boulders bigger than houses - I've never seen that before in my life. It's just an extraordinary operation,\" the former head of the International Tunnelling Association said.\nHe said he still has some hope for those trapped underground, given the protection the subterranean environment might have offered from the deluge above.\nMeanwhile, in Chitwan, a district far downstream from where the floods first hit, makeshift burials were taking place after the Himalayan nation's river systems brought nearly 300 dead bodies to its banks.\nThe air was thick with the smell of decay, as men wearing white Personal Protective Equipment (PPE) including masks carried unidentified corpses into trucks.\nOver the weekend, a large portion of the forest outside the city was dug up. Medical staff and volunteers worked to extract DNA from the unidentified remains.\nGanesh Aryaal, the chief district officer, told BBC Nepali that relatives will still be able to extricate the remains of their loved ones, once they are identified through DNA testing.\n\"We don't have enough freezers here... We had to choose this last alternative of temporary burial system. We are really overwhelmed,\" he said.\nIn Tibet, the official death toll is 16, with 546 reported missing, according to Chinese state media. Footage of the floods has been heavily censored in China.\nChinese authorities have imposed \"administrative penalties\" – which can range from warnings and fines to short detentions – on people speculating online that the casualty numbers are a lot higher than reported.\nIn Nepal, authorities have also ordered the removal of online content that they deem to be misinformation about the floods.\nAdditional reporting by Jugal Purohit in Chitwan and Binita Dahal, BBC Nepali", "translation_ja": "", "vocab": [{"word": "subterranean", "definition": "地下の、または地下に位置する。この文脈では、地表面下に位置する地下施設や環境を指します。"}, {"word": "deluge", "definition": "大洪水、または大量の何かが一度に押し寄せること。ここでは洪水の規模の大きさを強調しています。"}, {"word": "spearheaded", "definition": "～を先導する、または主導する。プロジェクトやキャンペーンの最前線で指導的役割を果たすことを意味します。"}, {"word": "makeshift", "definition": "一時的な、急ごしらえの。本来の設備がない場合に、利用可能なもので間に合わせることを意味します。"}, {"word": "administrative penalties", "definition": "行政処分のこと。警告や罰金から短期拘留まで、政府機関が違反者に科す処分を指します。"}, {"word": "censored", "definition": "検閲される、または公開を制限される。政府や権力者によって不適切と判断されたコンテンツを削除または非表示にすることです。"}]}, {"title_ja": "米シンガーD4vdの有名弁護士が殺人事件から撤退", "title_en": "US Singer D4vd's Celebrity Lawyers Withdraw From Murder Case", "summary_ja": "米ミュージシャンD4vdの殺人裁判を担当していた有名弁護士らが撤退し、ロサンゼルス郡公設弁護人事務所が代理人を引き継いだ。21歳の彼は14歳のセレステ・リバス・エルナンデスさんの殺害罪について無罪を主張している。検察は彼が彼女との関係が明かされることと音楽キャリアが損なわれることを防ぐため殺害したと主張している。", "summary_en": "Celebrity lawyers representing US musician D4vd have withdrawn from his murder trial, with the Los Angeles County Public Defender's Office taking over his defence. The 21-year-old pleaded not guilty to charges of murdering 14-year-old Celeste Rivas Hernandez, whose remains were found in September 2025. Prosecutors allege he killed her to prevent her from revealing their relationship and damaging his music career.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crr451lpl4no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "US singer D4vd's celebrity lawyers withdraw from murder case\n- Published\nThe celebrity lawyers hired to represent US musician D4vd in his upcoming murder trial have withdrawn from the case.\nThe star, whose legal name is David Anthony Burke, has been appointed a public defender to mount his defence against the charge of murdering Celeste Rivas Hernandez, 14, whose remains were found in September 2025 in a Tesla registered to his address.\nBurke, 21, pleaded not guilty to the murder charges in a Los Angeles court on Monday.\nA judge determined last month that he will stand trial for murder. Prosecutors have alleged he stabbed the teen after years of sexual abuse before dismembering her body.\nA pre-trial hearing is set for 19 October.\nLawyers Blair Berk, Marilyn Bednarski and Regina Peter said in a statement to the BBC that the court had granted their request to withdraw from the case and had appointed the Los Angeles County Public Defender's Office to represent the singer.\nThe statement said that D4vd \"qualified for appointed counsel\".\n\"We continue to support David and his defence against these serious charges,\" they said.\n\"We are grateful that the Los Angeles County Public Defender's Office has taken over the representation and that David has a highly capable and committed team of attorneys and investigators behind him.\"\nBerk, who led the defence team, has previously represented US actor Mel Gibson and film mogul Harvey Weinstein, as well as singer Britney Spears and actress Lindsay Lohan.\nDeputy public defender Walid Kandeel said in a statement that Burke was \"entitled to a defence that takes his circumstances seriously and carefully examines the evidence\".\n\"We are committed to providing him with that defence,\" he said.\n- US singer D4vd to go on trial for murder in death of 14-year-old \n  - Published28 July\nLos Angeles County's top prosecutor, Nathan Hochman, said outside the courtroom on Monday that his office was \"ready to proceed\" with its case against Burke.\nHe also acknowledged that the singer's change in lawyers could delay proceedings, require additional time to review the evidence, or result in the filing of a motion to dismiss the case.\nHis team was ready for \"zealous representation\" by the defence, he said.\nBurke had already entered a not guilty plea to charges of first-degree murder, mutilation of human remains and child sexual abuse.\nHe returned to court on Monday to have the charges against him formally read and re-entered the plea.\nThe murder charges include special circumstances linked to financial gain that could make Burke potentially liable for the death sentence.\nProsecutors allege Burke killed Hernandez because the teen had threatened to reveal his relationship with a minor and destroy his multi-million dollar music career.\nEvidence read in Los Angeles court during the preliminary hearing showed threats she made against him on 22 April 2025, stemming from arguments about his friendship with another girl.\n\"I swear to GOD I will kill u,\" one expletive-laden text from Hernandez read, followed by a threat to strangle him and tell her dad lies about him. \"i will end ur career and ur life I will damage anything,\" the text went on.\nThe following day, Hernandez went to Burke's Hollywood home in an Uber he had sent to pick her up.\nProsecutors alleged that Burke stabbed her once she arrived.", "translation_ja": "", "vocab": [{"word": "withdraw", "definition": "法律代理や訴訟から身を引く、代理人としての役割を辞退すること。弁護士が依頼人との関係を解除するという法的な決定を示す。"}, {"word": "appointed counsel", "definition": "裁判所によって指定された公設弁護人または法的代理人のこと。被告人が弁護士を雇う余裕がない場合に裁判所が無料で提供する法的支援。"}, {"word": "preliminary hearing", "definition": "本格的な裁判前に行われる予備的な法廷手続。検察が十分な証拠を持っているかを判断し、裁判が進むかどうかを決定する段階。"}, {"word": "mutilation", "definition": "死体や遺骨を破壊または損傷させること。この文脈では、殺人後に遺体を切断または損傷させた罪として使用されている。"}, {"word": "zealous", "definition": "非常に熱心で積極的であること。法律用語では、弁護士が依頼人の利益のために全力で取り組む姿勢を表す。"}, {"word": "motion to dismiss", "definition": "裁判所に訴訟を取り下げるよう求める法的な申し立て。弁護側が十分な証拠がないなどの理由で事件を終わらせるよう要求すること。"}, {"word": "liable", "definition": "法的に責任を持つ、負うべき義務がある状態。刑事事件では特に懲役刑や死刑を科せられる可能性があることを示す。"}]}, {"title_ja": "スイスのレイブパーティー銃撃事件で男を逮捕、女性が殺害される", "title_en": "Man arrested after Swiss rave shooting that killed woman", "summary_ja": "スイスの43歳男性がチューリッヒ近郊のアーラウで開催されたテクノレイブでの銃撃事件で逮捕された。イタリア人女性マリア・スピネッリ（22歳）が殺害され、5人が負傷した。容疑者は約24時間の逃亡の後に拘束され、警察は単独犯と考えている。スイスはヨーロッパで最も銃の所有率が高い国の一つだが、暴力的な銃撃事件は稀である。", "summary_en": "A 43-year-old Swiss man has been arrested following a shooting at a techno rave in Aarau that killed Italian woman Maria Spinelli, 22, and injured five others. The suspect was apprehended after a nearly 24-hour manhunt, with police stating he likely acted alone. Switzerland has one of Europe's highest gun ownership rates, though violent shootings remain rare.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cddv92n194vo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "IT", "full_text": "Man arrested after Swiss rave shooting that killed woman\n- Published\nA 43-year-old Swiss man has been arrested following a shooting at a rave in Switzerland in which a woman was killed.\nItalian 22-year-old Maria Spinelli was killed and several others injured at a techno rave being held at a horse racing track in Aarau, a town about 46km (29 miles) west of Zurich on Sunday.\nThe shooting initiated a nearly 24-hour manhunt before Aarau cantonal police confirmed they apprehended the suspect shortly before 01:00 local time on Monday (23:00 GMT on Sunday).\n\"The investigation into the exact sequence of events, the background and the possible motive is currently under way,\" police said in a statement. \"At this time, it is assumed that the perpetrator acted alone.\"\nPolice first received a report of shots fired at the Schachen race track at about 02:30 local time on Sunday.\nSpinelli died at the scene, while four men and a woman, aged between 24 and 27, were taken to hospital with injuries \"ranging from minor to severe\".\nAn eyewitness told Swiss news outlet Blick that he had \"suddenly heard the gunshots\" minutes after the music stopped, initially believing they were fireworks.\nHe said he was told to hide by a man and a woman, the latter of whom was shot.\nOrganisers had expected 3,500 people to attend. Aarau, home to approximately 23,000 people, is less than 40km from the border with Germany, where local media reported police were supporting Swiss forces.\nThe arrest marks a quick progression in the police investigation - on Sunday afternoon, the force in Aarau said it had no leads on the perpetrator and was unsure whether it was one person or several.\nItalian Prime Minister Giorgia Meloni previously said she was confident Swiss authorities would \"shed full light on what happened and find anyone responsible\".\nItaly's foreign ministry said in a statement that it was sending officials to Zurich \"to closely follow the investigation\".\nSwitzerland has one of the highest rates of gun ownership in Europe, although violent shootings are rare and tighter controls were introduced in recent years.\nThe last major shooting occurred in 2001, when 14 members of the parliament and local government of Zug, near Lucerne, were killed by a gunman who then took his own life.\nRelated topics\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "perpetrator", "definition": "犯人、加害者を意味する正式用語。特に重大犯罪の実行犯を指すことが多い。"}, {"word": "apprehend", "definition": "逮捕する、身柄を拘束するという意味。犯罪者を捕まえる場合に使用される。"}, {"word": "cantonal", "definition": "スイスの州に関する形容詞。スイスの地方行政区画（カントン）に属するを意味する。"}, {"word": "manhunt", "definition": "逃亡犯を探索する活動。警察が容疑者を追跡・捜索する組織的な活動を指す。"}, {"word": "eyewitness", "definition": "目撃者、現場を直接見た人。法律や報道で証言の信憑性を示す重要な証人。"}]}, {"title_ja": "保守党の大規模改造内閣：メル・ストライドとプリティ・パテルが交代", "title_en": "Mel Stride and Priti Patel replaced in major Tory reshuffle", "summary_ja": "保守党のケミ・バデノック党首が影の内閣の大規模な改造を実施し、メル・ストライドの影の財務大臣をアンドリュー・グリフィスに、プリティ・パテルの影の外務大臣をトム・トゥゲンダートに交代させた。この改造は、労働党とリフォーム・UKに次いで第3位に甘んじている保守党の人気向上を目指し、経済的信頼性と国家安全保障に焦点を当てている。", "summary_en": "Conservative Party leader Kemi Badenoch has carried out a significant reshuffle of the shadow cabinet, replacing Mel Stride as shadow chancellor with Andrew Griffith and Priti Patel as shadow foreign secretary with Tom Tugendhat. The reshuffle aims to boost the party's popularity as polls show the Conservatives in third place behind Labour and Reform UK, with a focus on economic credibility and national security.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cp8026xlm35o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Mel Stride and Priti Patel replaced in major Tory reshuffle\n- Published\nSir Mel Stride and Dame Priti Patel have left the shadow cabinet as part of a significant reshuffle of the Conservative top team by leader Kemi Badenoch.\nAndrew Griffith will replace Sir Mel as shadow chancellor, while Tom Tugendhat will take the place of Dame Priti as shadow foreign secretary.\nBadenoch is forming a new shadow cabinet before the party's conference in October.\nWith most polls putting the Conservatives in third place, lagging behind Labour and Reform UK, the Tory leader will be hoping a refreshed shadow cabinet will help boost her party's popularity.\nClaire Coutinho, previously the shadow energy secretary, after her maternity leave will replace Griffith as shadow business secretary and act as his deputy.\nBadenoch said that as shadow chancellor, Sir Mel had helped the party rebuild economic credibility and become an effective opposition.\nA senior Conservative source said: \"Kemi is changing the way the Conservative Party approaches economic policy and creating a new economic leadership team for the next phase, focused on growth, higher living standards and fiscal credibility.\"\nSir Mel, who was appointed to the role following Badenoch's leadership election in 2024, described his time in post as a \"great honour\".\nNew shadow chancellor Griffith said the Tories will deliver \"an economic revolution\" with lower taxes, Britain drilling again to bring energy costs down, slashing red tape and Labour's Employment Rights Act.\n\"The Conservatives will always back the risk-takers and wealth creators who deliver growth, investment and jobs,\" he said.\nThe Tory source described Griffith as a \"no-nonsense, pro-growth shadow chancellor with real business experience\".\nBefore he became MP for Arundel and South Downs in 2019, he served as a top executive at Sky and as chairman of Just Eat.\nAs a Treasury minister, Griffiths defended Liz Truss' 2022 mini-Budget.\nLabour Party chair Bridget Phillipson described Griffith as \"a key architect of Liz Truss's disastrous mini-Budget\" and said the shadow cabinet featured politicians \"who hammered family finances and left our public services crumbling\".\nThat message was echoed by other parties. Liberal Democrat Treasury spokesperson Daisy Cooper said: \"His appointment to shadow chancellor shows they're happy to forfeit any claim to economic credibility in their race to the bottom with Reform UK.\"\nReform UK shadow chancellor Robert Jenrick said: \"They haven't changed and still aren't sorry for the damage they inflicted on our country.\"\nDame Priti, who had been shadow foreign secretary since 2024, will return to the backbenches and will take on a new international role strengthening the Tories relationship with sister parties and centre-right movements abroad.\nBadenoch has selected Damian Hinds as the new shadow health and social care secretary after Stuart Andrew confirmed he will be returning to the backbenches.\nKatie Lam has been named as the new housing secretary, after Sir James Cleverly quit the front bench, announcing he wants to run for London mayor.\nBadenoch's reshuffle is intended to bring solutions to a number of problems.\nFirst, she wants to retire those members of her top team that have had a relatively low profile, or who have not been delivering sufficient blows to both Labour and Reform UK.\nBadenoch paid a warm tribute to Sir Mel but some recent polls suggested that Reform UK were more trusted on the economy than the Conservatives.\nAnd that is something Kemi Badenoch felt needed to change.\nSecond, while familiar faces like Dame Priti were useful to have in the top team as they brought high-level government experience, they might also remind voters of the party they decisively rejected in 2024.\nThere has been a changing of the old guard, and Badenoch is now focusing on who can take the Conservatives into the next election - faced as she is by a new Labour leader and cabinet.\nThird, she wants to focus on issues where Labour is perceived to be vulnerable.\nOne such area is defence spending and national security.\nSo as shadow foreign secretary she appointed Tom Tugendhat - a former security minister and current army reservist who served in Afghanistan and Iraq. He will work as part of a team with the shadow defence secretary.\nSome opinion polls rate the economy as the most important issue for voters, above asylum and immigration, and again the Tory leader believes the government is vulnerable here, with sluggish growth.\nSo she has announced a new Conservative economic unit headed by Griffith, with his extensive business experience.\nCoutinho as his deputy is seen as a rising Conservative star who has performed well in her previous role shadowing the former energy secretary Ed Miliband in the Commons, and as a potential future chancellor if the Conservatives were ever to recover electorally.\nBut the Tory leader has also included the former Conservative chairman and City Minister Richard Fuller in the", "translation_ja": "", "vocab": [{"word": "reshuffle", "definition": "内閣や組織の人事配置を大幅に変えること。政治の文脈では、主要なポストの配置を変え、新しいメンバーを登用する組織的な人事異動を指す。"}, {"word": "shadow cabinet", "definition": "野党が政権交代に備えて組織する影の内閣。現在の政権の各大臣に対応する議員が配置され、政策立案や批判を行う。"}, {"word": "credibility", "definition": "信頼性や信用度のこと。特に政治や経済の文脈では、政党や指導者が有権者から信頼されている程度を示す。"}, {"word": "fiscal", "definition": "政府の財政や予算に関する。税金や支出、財政政策に関わる経済用語として使用される。"}, {"word": "forfeit", "definition": "権利や立場を失うこと、または没収されること。特に政治では、行動により信用や支持を失うことを意味する。"}, {"word": "mini-budget", "definition": "通常の予算ではなく、急遽発表される小規模な財政計画。2022年のリズ・トラス首相による経済政策は市場に大きな混乱をもたらした。"}, {"word": "backbenches", "definition": "議会で指導部以外の一般議員が座る座席のこと。影の内閣から降りて通常の議員となることを指す。"}]}, {"title_ja": "マンチェスター・シナゴーグ襲撃事件の犠牲者を追悼する追悼式典に数百人が参加", "title_en": "Hundreds gather to remember victims of Manchester synagogue attack", "summary_ja": "2025年10月のヒートン・パーク・シナゴーグ襲撃事件の犠牲者と生存者を追悼する式典に、首席ラビを含む約800人が参加しました。攻撃者ジハード・アル・シャミーによって2人が殺害され3人が負傷し、演者らは急増する反ユダヤ主義と地域社会の回復力の必要性を強調しました。生存者と遺族は継続的な苦闘について述べながら、脅迫されたり共同体から追い出されたりしないという決意を強調しました。", "summary_en": "About 800 people, including Chief Rabbi Ephraim Mirvis and Communities Secretary Angela Rayner, attended a memorial service for the victims and survivors of the October 2025 Heaton Park synagogue attack in Manchester. Two people were killed and three injured when attacker Jihad al-Shamie targeted the synagogue, with speakers highlighting rising antisemitism and the need for community resilience. Survivors and bereaved families spoke of their ongoing struggle while emphasizing their determination not to be intimidated or driven from their community.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cx2z4wlxj04o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Hundreds remember synagogue attack victims\n- Published\nThe Chief Rabbi Ephraim Mirvis and Communities Secretary Angela Rayner were among about 800 people who attended a memorial event for the victims and survivors of last year's Heaton Park synagogue attack.\nMelvin Cravitz and Adrian Daulby were killed, and three others injured, as they tried to defend their place of worship from attacker Jihad al-Shamie on 2 October 2025.\nRelatives of the bereaved and some of the survivors were among the speakers at Monday's service of remembrance at the synagogue in Manchester.\nPrior to the event, Rabbi Daniel Walker said the Jewish community feels less safe now than it did immediately after the attack.\nHe said rising antisemitism, combined with a lack of action to \"deal with core problems\", had left many members of Heaton Park Hebrew Congregation – and British Jews more widely – feeling increasingly vulnerable.\nTwo seats remained empty for the service, bearing the names of Melvin Cravitz and Adrian Daulby.\nSherelle Dresner, representing the family of Melvin Cravitz, spoke of the \"lonely\" and \"overwhelming\" new world she and her family faced in the aftermath of the attack.\n\"I have heard this new existence be described by survivors and bereaved families of other terrorist attacks as a club that no-one wants to be a part of; a club that no-one would ever choose to belong to,\" she said.\nShe said she had received antisemitic abuse and \"these messages should worry us all, that there are people out there justifying his murder and blaming this on his religion\".\nDresner praised those who \"put your own lives at risk\" on the day to save others, including a woman who ran \"towards danger\" to help Melvin.\nThe chief rabbi, in his address to the service, said: \"The attacker came here feeling positive, comfortable in his ways, encouraged and inspired by a tone of deep antisemitism within our society.\n\"We know so well how hateful thoughts can be translated into hate speech which, in turn, is only one step away from hate crime.\"\nIn a message read out at the start of the service, King Charles said: \"My wife and I hold all those whose lives were so tragically disrupted by that terrible day most closely in our thoughts and prayers.\n\"Though the months have passed, the sense of shock and sorrow remains undiminished.\n\"The memory of those who lost their lives, Adrian Daulby and Melvin Cravitz, and of those who were injured, Andrew Franks, Bernard Agyemang and Yoni Finlay, remain especially vivid in my mind.\"\nHe concluded: \"Hatred can never prevail over our shared humanity.\"\nRaphi Bloom, chair of the Yom Kippur Commemoration, said the service was \"not only about remembrance\" but was also about resilience and \"honouring Melvin and Adrian by ensuring that Jewish life continues to flourish\".\nHe said \"the wounds remain, but so does our spirit\" and, together, they were sending a simple message that they would not be intimidated, defined by hatred or \"driven from the place we have called home for more than two centuries\".\n\"As Jews we will stand tall, united, proud and strong,\" he said.\nAngela Rayner referenced other \"sickening terrorist attacks\" across the world when she told the congregation: \"These acts are a crisis for us all - they reflect the increase we've seen in obsessive, intense hatred of Jews.\"\nShe said \"any attack on Jews is an attack on all of us\".\n\"Together we can overcome and defeat antisemitism – and we will never rest, until every Jewish person is safe.\"\nShe said this was \"a hatred we must stand robustly against, and root out from its very foundations\", which meant \"taking on extremists and bearing down on those who seek to divide our communities\".\n\"The only way we can root out this poison is through a whole of society approach.\"\nYoni Finlay, who was hit by a stray police bullet while helping to barricade the doors during the attack, said: \"An evil person tried to destroy us on Yom Kippur and together we have not let that evil win.\n\"When I was lying on the floor in the foyer, just through those doors, with four of my organs badly damaged by a bullet that had gone through me, I made myself a promise, that I would not die, this is not where my life was going to end.\n\"But I could not do this on my own, and neither could the shul. We could only do this with the support of the people around us.\"\nHe said he was lucky enough to have an amazing family, \"but we are also an incredible community\".\n\"I realised that maybe, just maybe, we were going to be okay, when we showed that rather than being stopped, we were more together than ever\".\nEarlier, asked by BBC Radio 4's Today programme about how the Jewish community in the UK feels almost a year on, he said: \"I don't think things feel safer, I think we certainly live behind ever increasing gates, more security than we've ever had.\n\"Jewish people are having to hide their identity. Even my own son, who's in college at the moment, has faced death threats.\"\nOther speakers at the memorial service includ", "translation_ja": "", "vocab": [{"word": "antisemitism", "definition": "ユダヤ人に対する偏見や差別的態度。本記事では、社会内での深刻な反ユダヤ主義がテロ攻撃を助長したと述べられている。"}, {"word": "bereaved", "definition": "配偶者や家族など大切な人を亡くした状態を表す形容詞。悲しみや喪失を経験している人々を指す。"}, {"word": "resilience", "definition": "困難や苦難に直面しても回復し、立ち直る能力。本記事では被害者たちの精神的な強さを示す。"}, {"word": "extremists", "definition": "過激な思想や行動を持つ人々。社会的規範を大きく逸脱した激進的なイデオロギーを持つ人を指す。"}, {"word": "barricade", "definition": "防御や遮断のために建てられた物理的な障害物。また、そのような障害物を作成する行為。"}, {"word": "foyer", "definition": "建物の入り口付近にある広間や玄関ホール。劇場や公共施設の出入口近くのスペースを指す。"}]}, {"title_ja": "英国政府、刑務所の過密化対策で1億1000万ポンドを投資して新たな独房を建設", "title_en": "UK Government Invests £110m to Build More Prison Cells and Tackle Overcrowding", "summary_ja": "英国政府は、イングランドとウェールズの既存刑務所内の未使用スペースをセルに改造することで、1億1000万ポンドを費やして追加の刑務所セルを建設しています。この施策は、深刻な刑務所過密化に対処し、2031年までに14,000の新しい刑務所スペースを作成するための70億ポンドの投資計画を補完しています。発表は、刑務所収容能力を削減するための早期釈放スキームに関する批判の中で行われました。", "summary_en": "The UK government is spending £110m to create additional prison cells in existing facilities across England and Wales by converting unused spaces like offices and storage areas. This move is part of broader efforts to address severe prison overcrowding and complements a £7bn investment plan to create 14,000 new prison places by 2031. The announcement comes amid criticism over an early release scheme designed to reduce prison capacity.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/ce8x543ddzjo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "More cells being built within prisons to help tackle overcrowding\n- Published\nThe government is spending £110m on creating more cells in existing prisons in England and Wales as part of its plans to tackle overcrowding.\nThe money, which has been \"fast-tracked from existing budgets\", will be used to speed up the construction of hundreds of new prison places, the Ministry of Justice has said.\nExisting space within prisons, such as unused office space, laundry rooms and storage areas, will be converted into cells.\nThe announcement comes at a time of crisis for the prison system, which is close to maximum capacity, with the government being criticised for its handling of an early release scheme.\nLord Chancellor and Justice Secretary Alex Norris said the government would be \"getting spades in the ground quicker to deliver thousands more places to lock up dangerous criminals and keep the public safe\".\nNorris said: \"This government is serious about fixing the broken prison system we inherited, which is why we've already delivered more than 3,200 prison places in just two years.\n\"We're now investing to boost these efforts further.\"\nInvestment to create more prison spaces was announced as part of the government's 2025 spending review, which covered plans for the period from 2024‑25 to 2029‑30.\nAs part of this, it allocated a £7bn capital investment to create 14,000 prison places by 2031.\nThe £110m announced on Monday is not a new investment, and is being drawn from money previously announced.\nThe Lord Chancellor will update Parliament on Tuesday, setting out changes to upcoming sentencing reforms which will block hundreds more dangerous offenders from earlier release.\nMeasures also include plans to remove foreign national offenders more quickly, and ending the historic injustice of Imprisonment for Public Protection (IPP) sentences in a way that balances fairness and public safety, the government has said.\nShadow justice secretary Nick Timothy said: \"It is absurd for Labour to talk about a 'prison building boom' when there are 700 fewer prison places than a year ago.\n\"In a matter of weeks thousands of dangerous criminals will be released onto our streets thanks to Andy Burnham, including perpetrators of some of the most vile crimes.\"\nAn extra £18.9m investment into vital services for victims will also be announced to Parliament.\nThe services will provide the specialist emotional and practical support needed to help victims move on with their lives, according to the Ministry of Justice (MoJ).\nThis money will be reprioritised from existing budgets and will be on top of the £550m already announced by government for this support.\nThe MoJ also announced that it had signed a contract to start building a new jail for 1,700 hundred inmates in Lancashire.\nOn Monday, the Conservatives warned that dangerous criminals could be freed under the government's early release scheme, which aims to reduce overcrowding in prisons in England and Wales.\nPrime Minister Andy Burnham said at the weekend that anyone convicted of manslaughter would be excluded from the early prisoner release scheme, following a campaign from PC Andrew Harper's family to block the release of two men convicted over his killing in 2019.\nBurnham said prison space would be found by releasing some inmates serving IPPs as well as by deporting foreign prisoners.\nSome 4,500 prisoners are now expected to start being released in tranches from October.\nThe numbers due to be released has been reduced after the government said rapists, those found guilty of serious child sex offences and grooming offences and now those found guilty of manslaughter would be excluded from the scheme.\nTimothy told the BBC that to prevent one group of dangerous criminals being released early, Burnham was \"looking at releasing a different group of dangerous prisoners\".\nVictims Minister Alex Davies-Jones told the BBC: \"We will do nothing that would risk the public or put the public at danger.\"\n  - Published13 hours ago", "translation_ja": "", "vocab": [{"word": "overcrowding", "definition": "施設や場所に許容量以上の人数が入ることで、特に刑務所などの公的施設における収容過剰の状況を指します。"}, {"word": "tranches", "definition": "大きなグループや金額を分割した各部分のことで、段階的に実施される際の各段階を指す経済用語です。"}, {"word": "fast-tracked", "definition": "通常のプロセスよりも迅速に進めることを意味し、優先的に処理されて加速される状況を表します。"}, {"word": "reprioritised", "definition": "予算や資源の優先順位を変更することで、別の目的に割り当て直すことを意味します。"}, {"word": "offenders", "definition": "犯罪を犯した人、違法行為を行った者を指す法律用語で、特定の犯罪のカテゴリーを説明する際に使用されます。"}, {"word": "injustice", "definition": "不正や不公正な状態を指し、特に法制度において不公平な扱いや不当な処遇を意味します。"}]}, {"title_ja": "米最高裁、トランプ大統領のホワイトハウス・バルルーム建設プロジェクトの継続を許可", "title_en": "US Supreme Court Allows Trump's $400M White House Ballroom Project to Proceed", "summary_ja": "米最高裁は5対4の判決で、トランプ大統領の政権がホワイトハウスに4億ドルのバルルームと軍事複合施設の建設を継続することを許可しました。保守派の5人の判事は訴訟当事者が法的に訴える権利がないと判断し、ロバーツ長官はリベラル派の判事とともに、議会の承認がないために本プロジェクトが権力分立を違反している可能性があると主張して反対しました。", "summary_en": "The US Supreme Court ruled 5-4 to allow President Trump's administration to continue construction of a $400 million ballroom and military complex at the White House. The five conservative justices determined that plaintiffs lacked legal standing to challenge the project, while Chief Justice Roberts joined liberal justices in dissent, arguing the project likely violates the separation of powers by lacking congressional approval.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/us-supreme-court-allows-trump-ballroom-project-to-proceed/a-78581275?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US Supreme Court allows Trump ballroom project to proceed\nAugust 31, 2026\nThe US Supreme Court on Monday allowed US President Donald Trump's administration to continue with the $400 million (€345 million) White House ballroom construction project for now.\nThe ruling was backed by five of the court's six conservative justices who said that the plaintiffs in the case likely didn't have the legal right to challenge the case.\nCourt votes 5-4 to lift lower court's order\n\"This Court has not found standing in circumstances like these before. To the contrary, we have repeatedly held that mere offense, disagreement, or distaste does not qualify as a concrete and particularized injury,\" under the US Constitution, the five justices wrote in their ruling.\n\"Perhaps nearly any government action or project offends someone's sensibilities,\" they added.\nChief Justice John Roberts joined the court's three liberal-leaning justices in dissenting from the latest order, calling the construction “likely unlawful\" because it hasn't been approved by Congress.\n\"Today’s decision is no victory for the separation of powers,\" Roberts wrote.\nTrump welcomes Supreme Court ruling\n\"I am pleased to report that the United States Supreme Court has just ruled in favor of the Ballroom/Military Complex being built without any further contingency, doubt, or threat,\" Trump said on his Truth Social network.\n\"We are living in the Golden Age of America, and this Building will be one of the Greatest ever constructed in Washington, D.C.\" Trump said.\nNational Trust for Historic Preservation vs. Trump\nThe nonprofit National Trust for Historic Preservation first brought the matter after the East Wing was torn down and work began on a 90,000-square-foot (8,360-square-meter) ballroom in the the biggest structural change to the White House in over 70 years.\nThe Trump administration had asked the nation's highest court to intervene after federal courts determined that the project needed to be halted on the grounds of it not having congressional approval.\nUS Justice Department lawyers previously justified the need for a secure ballroom, pointing to the July 8 missile threat against Air Force One when Trump was flown out of Turkey aboard a secret flight and other recent assassination attempts.\nEdited by: Wesley Dockery\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "standing", "definition": "法律用語で、訴訟を起こす法的権利または資格。損害を直接受けた者のみが訴える権利を有します。"}, {"word": "dissenting", "definition": "多数意見に反対する意見。特に裁判所で、少数派の判事が多数派の判決に異なる見解を示すことを指します。"}, {"word": "separation of powers", "definition": "政治体制の原則で、立法権、行政権、司法権を異なる機関に分離し、権力の集中を防ぐ仕組みです。"}, {"word": "contingency", "definition": "不測の事態または不確実な条件。予測できない状況や将来の不確定な事柄を指します。"}, {"word": "plaintiffs", "definition": "民事訴訟で損害賠償や権利侵害の救済を求めて訴えを起こした側の当事者。原告のことです。"}, {"word": "intervene", "definition": "仲介・介入する。特に法律では上位の裁判所が下級裁判所の判決に対して関与することを意味します。"}]}, {"title_ja": "ポーランド、ドローン工場火災の破壊工作調査を開始", "title_en": "Poland Launches Sabotage Probe into Drone Factory Fire", "summary_ja": "ポーランドはワルシャワ南部のドローン部品製造工場WB Electronicsの火災について、外国情報機関の関与とテロを疑い調査を開始しました。月曜日未明に発生した火災は、ポーランド軍に防衛技術を供給する施設を焼きました。ポーランドはウクライナ支援により安全保障上の脅威に直面しており、当局はロシアやベラルーシとの関連を疑っています。", "summary_en": "Poland has launched an investigation into a fire at WB Electronics, a major drone component manufacturer south of Warsaw, suspecting foreign intelligence involvement and terrorism. The fire broke out shortly after midnight Monday at the facility, which supplies key defense technologies to the Polish military. Authorities suspect the incident may be connected to Russia or Belarus, as Poland has faced increased security threats due to its support for Ukraine.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/poland-launches-sabotage-probe-in-drone-factory-fire/a-78580918?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Poland launches sabotage probe in drone factory fire\nAugust 31, 2026\nPoland launched on Monday an investigation into a fire at a drone production factory south of Warsaw, suspecting terrorism and the involvement of a foreign intelligence service.\nAccording to the prosecution statement, the probe had started \"for participation in the activities of a foreign intelligence service directed against the Republic of Poland and for a terrorist offence, consisting of deliberately causing a fire on the premises of the WB Electronics factory using a device containing flammable materials.\"\nThe WB Electronics factory in Skarzysko-Kamienna, located 150 kilometers south of Warsaw, was reported on fire shortly after midnight Monday. The facility manufactures key components for drones.\nFirefighters spent two hours containing the fire. There were no injuries in the incident.\nThe country's Internal Security Agency (ABW) is assisting the police with the investigation, officials said.\nPoland supports Ukraine in its war with Russia\nEarlier, Polish government accused Russia and Belarus of sending several agents into the country to carry out acts of sabotage.\nPoland, who has been a vocal supporter of Ukraine since Russia's full-scale invasion into the country, has been increasing its security expenditure and military capabilities due to fears of Russian attacks.\nWB Electronics, Poland's largest private defense company, is a supplier to the Polish military.\nThe company specializes in developing and manufacturing advanced defense technologies, including digital command and control systems, automated fire control systems, communications equipment, and modern unmanned strike systems.\nEdited by: Dmytro Hubenko\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "sabotage", "definition": "意図的な破壊行為。特に政治的または軍事的目的で重要な施設やプロジェクトを破壊することを指します。"}, {"word": "probe", "definition": "詳細な調査または検査。事件や問題の真相を明らかにするための公式な調査を意味します。"}, {"word": "terrorism", "definition": "政治的目的で達成するための暴力や脅迫行為。無差別に一般市民を標的にすることが特徴です。"}, {"word": "prosecution", "definition": "犯罪者を法的に訴追する行為。検察当局による公式な法的手続きを指します。"}, {"word": "unmanned strike systems", "definition": "人間が乗員として搭乗しない無人攻撃兵器システム。ドローンやミサイルなどが該当します。"}, {"word": "expenditure", "definition": "支出または費用。特に政府が国防や公共事業に費やす大規模な予算を指します。"}]}, {"title_ja": "リオネル・メッシがアルゼンチン代表からの引退を発表", "title_en": "Lionel Messi Announces Retirement From International Football", "summary_ja": "アルゼンチンのサッカー伝説、リオネル・メッシが39歳で代表チームからの引退を発表しました。2026年ワールドカップでアルゼンチンがスペインに決勝で敗れた後、メッシはこれが正しい時期だと判断しました。代表での出場数は207試合、得点は125ゴールという記録を残しています。一方、クラブではインテル・マイアミと2028年シーズンまでの契約があります。", "summary_en": "Argentina football legend Lionel Messi announced his retirement from international play at age 39 after competing in the 2026 World Cup final, where Argentina lost to Spain. Despite finishing as the second-highest goalscorer at the tournament with 8 goals, Messi decided it was the right time to step away, having earned 207 caps and 125 goals for his country. He will continue his club career with Inter Miami through the 2028 MLS season.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/lionel-messi-announces-retirement-from-international-football/a-78579502?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Lionel Messi announces international retirement\nAugust 31, 2026\nArgentina legend Lionel Messi announced his international retirement on Monday.\nThe 39-year-old, widely considered the greatest football player of all time, won the 2022 World Cup in Qatar with Argentina, bringing the title back to the country for the first time since 1986.\nThe 2026 World Cup, Messi's last appearance in the world's most well-known footballing competition, ended in disappointment for Argentina after defeat to Spain in the final.\nDespite being past his prime, the Argentina captain was the second most prolific goalscorer of the 2026 World Cup with eight goals, only being edged out by France's Kylian Mbappe with ten.\nMessi is also second in the World Cup's all-time goalscorer list, where he is one goal behind Mbappe, with both overtaking Germany striker Miroslav Klose's 16 goals during the tournament in the US, Canada and Mexico.\nRetirement comes at 'right time'\n\"It was a decision that hurt and still hurts deep in my soul,\" Messi posted on his Instagram account, adding that he wrote his international retirement message two days after the World Cup final defeat to Spain.\n\"But I understand that it is the right time,\" he added.\nMessi said he \"always gave everything, not just in the last few years,\" and that he wanted to bring Argentina fans joy and make them \"feel proud to be Argentine through football.\"\n\"I leave with the peace of mind and pride of having given you — alongside my teammates — moments we once only dreamed of,\" he wrote, before concluding with \"Vamos, Argentina!\"\n\"I leave with the peace of mind and pride of having given you — alongside my teammates — moments we once only dreamed of,\" he added.\nMiami contract until 2028\nMessi is his country's most capped player with 207 appearances, in which he scored 125 goals, another all-time record.\nWith Messi as captain, Argentina also won the Copa America in 2021 and 2024.\nHis club career will continue at current club Inter Miami, where he has a contract until the end of the 2028 MLS season, although he did voice \"serious doubts\" about continuing to play football for \"much longer\" following the death of his father Jorge in August.\nThe attacker moved to the US side in 2023 from Paris Saint-Germain and after a 15-year career with Spanish giants Barcelona, with whom he won the UEFA Champions League four times and the Spanish title ten times.\nMessi wanted to stay at Barcelona, but the club could not afford to keep him due to financial restrictions. This resulted in his move to Qatar-backed PSG, where he spent two years winning two league titles before moving to Miami.\nEdited by: Dmytro Hubenko\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "prolific", "definition": "生産的で多くの成果を上げる、特に短期間で大量に生み出す能力。ここでは得点能力が優れていることを意味します。"}, {"word": "capped", "definition": "国家代表チームのために試合に出場した回数を数える時に使う表現。各出場を「キャップ」と呼びます。"}, {"word": "overtaking", "definition": "それまでトップだった者や記録を追い抜く、超える。競争やランキングで前の位置にいた者を追い越すこと。"}, {"word": "financial restrictions", "definition": "財政上の制限や制約。組織が利用できる資金が限られていることを意味します。"}, {"word": "attacker", "definition": "サッカーやスポーツで得点を狙って相手を攻撃する選手の位置。フォワードやストライカーなどの攻撃的なポジションを指します。"}, {"word": "peace of mind", "definition": "心が安らいだ状態、精神的な満足感。心配や後悔がなく、決断に満足している心理状態。"}]}, {"title_ja": "グランドキャニオン洪水の生存者が命がけの脱出を証言", "title_en": "Grand Canyon Flood Survivor Recounts Desperate Race to Safety", "summary_ja": "週末にグランドキャニオンの谷底を襲った致命的な鉄砲水により、生存者たちは必死に逃げ出した。目撃者らは、急速に増水した中での恐怖の脱出劇を証言している。この事件は複数の死傷者を出し、人気観光地の安全性に懸念を引き起こしている。", "summary_en": "A deadly flash flood swept through the Grand Canyon floor over the weekend, forcing survivors to flee for their lives. Witnesses described a horrific escape as the floodwaters rapidly engulfed the area. The incident claimed multiple lives and raised concerns about safety in the popular tourist destination.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/survivors-deadly-grand-canyon-flash-flood-ran-lives/story?id=136088451", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、速報ニュースとライブイベントを24時間体制でカバーしています。主要なストーリーの展開をリアルタイムで追跡し、最新情報を得ることができます。世界中のABCニュース記者による最新ニュース、調査報道、詳細なレポートにアクセスしてください。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. Stay informed with real-time updates on major stories as they develop. Access the latest news, investigations, and in-depth reporting from ABC News journalists worldwide.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "陸軍長官ドリスコル、国防長官ヘグセスとの対立の中で辞任", "title_en": "Army Secretary Dan Driscoll Resigns Amid Tensions with Defense Secretary Hegseth", "summary_ja": "陸軍長官ダン・ドリスコルがドナルド・トランプ大統領に辞表を提出した。国防長官ピート・ヘグセスとの関係悪化が背景にある。トランプ政権下での国防総省の指導部に大きな変化をもたらす。", "summary_en": "Army Secretary Dan Driscoll has submitted his resignation to President Donald Trump following escalating tensions with Defense Secretary Pete Hegseth, according to sources at ABC News. The resignation marks a significant shift in the Department of Defense leadership under the Trump administration. Details regarding the specific causes of the disagreement between the two officials remain unclear.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/army-secretary-dan-driscoll-resigns-amid-tensions-hegseth/story?id=136101175", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカ航空がラグビー競技場上空の低高度飛行を擁護", "title_en": "South African Airline Defends Dramatic Low-Level Rugby Stadium Flyby", "summary_ja": "エアリンク航空が運航する2機のエンブラエル機がケープタウン・スタジアム上空わずか12～14メートルで飛行し、5万6千人の観客を沸かせたが、安全面での懸念も生じた。同航空は綿密に計画・訓練された飛行で規制に準拠していると主張した一方、航空専門家は誤差の許容範囲が危険なほど小さいと指摘している。この事件は南アフリカのプレゲーム飛行伝統を復活させると同時に、危険な先例を設定するのではないかという議論を引き起こした。", "summary_en": "Two Embraer jets operated by Airlink flew just 41-46 feet above Cape Town Stadium before a South Africa-New Zealand rugby Test match, thrilling 56,000 spectators but raising safety concerns. The airline defended the carefully planned stunt as compliant with regulations, though aviation experts questioned whether the margin for error was dangerously small. The incident revived South Africa's tradition of pre-game flybys while sparking debate about whether such low-altitude operations set a risky precedent.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/sport/2026/aug/31/south-african-airline-defends-dramatic-low-level-flyby-before-rugby-union-springboks-new-zealand", "state_media": false, "category": "IT", "full_text": "A pre-game stunt involving two passenger jets flying dramatically low over a stadium in South Africa drew huge cheers from the estimated crowd of 56,000 people, but also sparked a major debate over safety risks. The flyby by two Embraer jets, operated by the local airline Airlink, happened on Saturday before the second rugby union Test between South Africa and New Zealand in Cape Town.\nThe flight tracking service Flightradar24 estimated that the lead jet passed just 41-46 feet (12-14 metres) above the roof of Cape Town Stadium, with the crowd and the world’s top-ranked rugby teams below. The second jet, which was very close behind, flew through a cloud of pink dust that shot up from the stadium roof as part of the show.\nAirlink, a sponsor of the South Africa rugby union team, said the flyby was conducted according to safety regulations. The airline said that it was carefully planned and rehearsed, with the aircraft flying at 150 knots (172 mph), when they went over the stadium. Each jet had three senior captains on board, Airlink said, operating in the roles of a commander, a co-pilot and a safety officer. The jets were not carrying any passengers.\n“Airlink notes the concerns expressed in various social media and online forums regarding yesterday’s formation flyby over Cape Town’s DHL Stadium,” Airlink said on Sunday. “The flight demanded careful planning and rehearsal, as it required navigating at low altitude, at around 150 knots. The South African Civil Aviation Authority and Air Traffic Navigation Services provided valuable guidance, approval and support to ensure a safe flyby.”\nSouth African rugby union has a tradition of stadium flybys at big games, starting when a Boeing 747 flew over a stadium in Johannesburg before the 1995 World Cup final between the same teams, who are fierce rivals. But the flyby last weekend was especially low and dramatic, generating global interest after it was shown as part of the pre-game broadcast, and sparking a flurry of videos shot by witnesses.\nSome aviation experts questioned whether the margin for error was too small. “Basically, that lead aircraft … was kind of like dodging over the roof and climbing over the one side and dipping below and then climbing over the other side. That was a little bit uncomfortable,” Chris Martinus, president of Aircraft Owners and Pilots Association South Africa, said. “[If] something adverse happens, you just don’t have options at that kind of altitude.”\nKeith Tonkin, an Australian aviation consultant and former military and commercial pilot, said yesteron Monday that the Embraer passenger jets – which are small-to-medium jets designed for regional flights – were not designed or intended for that kind of low-level operation and warned against the precedent.\n“The bigger picture is that a benchmark has been established and others may expect to do something similar, and that’s not going to end well,” Tonkin said. He added that turbulence or a bird strike at such a low altitude could leave the pilots with too little room to manoeuvre without hitting the stadium.Airlink said flight data recorded by both aircraft confirmed their flights were performed within civil aviation safety limits for speed and altitude.", "translation_ja": "", "vocab": [{"word": "margin for error", "definition": "失敗や事故を許容できる範囲のこと。特に危険な状況では、パイロットが対応できる余裕や猶予時間を指す。"}, {"word": "precedent", "definition": "将来の判断や行動の基準となる先例のこと。一度実行されると、他の人々も同様のことをすることが期待される可能性がある。"}, {"word": "manoeuvre", "definition": "飛行機や船などを巧妙に操作・操縦すること。特に急激な方向転換や回避動作を指す。"}, {"word": "formation flyby", "definition": "複数の航空機が組織的に編隊を組んで飛行すること。通常、式典やイベントの見世物として行われる。"}, {"word": "adverse", "definition": "悪い、不利な、または望ましくない状況や出来事のことを指す。航空業界では予期しない機械的または気象上の問題を意味する。"}, {"word": "turbulence", "definition": "空気の流れが不規則になり、航空機が揺れる現象。低高度での乱気流は特に危険である。"}]}, {"title_ja": "国連委員会、奴隷制度賠償請求検討を法的義務と指摘", "title_en": "UN Committee Says Countries Legally Obliged to Consider Slavery Reparations", "summary_ja": "国連人種差別撤廃委員会は、1965年の人種差別撤廃条約に基づき、大西洋奴隷貿易に対する賠償請求を検討することが各国の法的義務であると判断した。この指針は歴史的責任についての議論から転換し、謝罪だけでなく財政補償、資料公開、真実委員会の設置などの包括的措置を各国に促している。", "summary_en": "A UN committee has ruled that countries are legally bound to consider reparations for the transatlantic slave trade under a 1965 convention on racial discrimination. The guidance represents a shift away from historical responsibility debates, urging states to implement comprehensive measures including financial compensation, archive access, and truth commissions rather than mere apologies.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/31/countries-legally-obliged-consider-slavery-reparations-un-committee", "state_media": false, "category": "政治", "full_text": "A UN committee has said countries are legally obliged to consider reparations for the transatlantic slave trade and take other measures to address the enduring legacy of racial discrimination.\nGuidance published on Monday by the committee on the elimination of racial discrimination (CERD) said the obligations arose from a legally binding 1965 convention on racial discrimination, not from the legal standards that existed when the slave trade took place.\nThe committee described the approach as a “paradigm shift” away from debates over historical responsibility that have often been used by governments to resist reparations claims.\n“States parties must implement comprehensive reparatory measures for people of African descent, covering all aspects of remedies,” said the UN document, which may be cited in courtrooms.\nAt least 12.5 million Africans were taken and sold between the 15th and 19th centuries in what CERD called the largest forced displacement in history.\nCalls for reparations – ranging from official apologies to financial compensation – have gained momentum internationally, though opponents argue states and institutions should not be held responsible for historical crimes. The EU and Britain abstained from a UN resolution on slavery in March.\nSome states have sought to dodge claims for justice in courtrooms by arguing that there were no international laws outlawing the slave trade at the time – the so-called intertemporality principle.\nBut the UN document argues that, regardless of whether slavery and the slave trade were illegal under the laws of the day, countries remain responsible under current international obligations to tackle their continuing effects.\n“Irrespective of the legal characterisation of the original historical acts, states parties remain bound by their present obligations under the convention to address structural inequalities,” the UN document says.\nFinancial compensation alone is not sufficient, it adds, urging “transformative” measures including opening archives, revising public memorials and establishing independent truth commissions.\nPela Boker Wilson, a committee expert from Liberia who helped draft the document, said she expected states to move beyond broad expressions of regret and review policies and laws.\n“We are calling on state parties to take concrete and meaningful action,” she told Reuters. “We want to affirm the dignity of those whose suffering was denied, whose suffering was minimised or forgotten.”", "translation_ja": "", "vocab": [{"word": "reparations", "definition": "過去の不正行為や被害に対する補償。金銭的賠償だけでなく、謝罪や名誉回復なども含まれる。"}, {"word": "paradigm shift", "definition": "物事の考え方や捉え方の根本的な転換。従来の枠組みから新しい枠組みへの大きな変化を意味する。"}, {"word": "intertemporality", "definition": "異なる時代の法律や基準を比較適用する原則。過去の行為を現在の法律で判断するかどうかに関わる概念。"}, {"word": "transatlantic", "definition": "大西洋を挟んでアフリカからアメリカ大陸への奴隷貿易を指す。歴史的に重要な貿易路。"}, {"word": "structural inequalities", "definition": "制度や社会体系に組み込まれた不平等。個別の差別ではなく、社会全体に根ざした格差を指す。"}, {"word": "transformative measures", "definition": "社会構造や状況を根本的に変える施策。表面的な対応ではなく深刻な改革を意味する。"}]}, {"title_ja": "スペイン首相、セウタ国境侵入でモロッコを非難しない", "title_en": "Spain's PM Says No Evidence Morocco Behind Ceuta Border Breach", "summary_ja": "スペインのペドロ・サンチェス首相は、先月のセウタ地域への大規模不正越境がモロッコ政府の仕業である証拠はないと述べた。約7万人の移民が侵入を試み、約141人の死亡が報告されている。サンチェス首相はイスラエルとロシアが社会メディアで偽情報を拡散していると非難し、両国から厳しい反発を受けた。首相は流入を犯罪組織が引き起こしたと述べ、野党政府の対応を批判している。", "summary_en": "Spanish Prime Minister Pedro Sánchez stated there is no evidence that Morocco engineered last month's mass border crossing into Ceuta that saw around 70,000 migrants attempt to enter the enclave, with approximately 141 deaths reported. Sánchez accused Israel and Russia of spreading disinformation about the crisis on social media, drawing sharp rebuttals from both countries. He attributed the influx to criminal gangs exploiting false claims about deportation rules, while opposition parties criticized his government's handling of the ongoing humanitarian emergency.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/31/morocco-ceuta-border-breach-spanish-pm-migration-pedro-sanchez", "state_media": false, "category": "政治", "full_text": "Spain’s prime minister, Pedro Sánchez, has said there is no evidence to suggest the Moroccan government was behind last month’s massive border crossing into Ceuta but accused Israel and Russia of spreading disinformation.\nAs many as 141 people are thought to have died trying to enter the Spanish enclave at the end of July. The influx of about 70,000 men, women and children unleashed a political crisis, a humanitarian emergency and reignited tensions within the EU over immigration.\nDespite speculation that Rabat may have engineered the mass crossing as a means of showing its displeasure at Spain’s rapprochement with Algeria, Sánchez said there was nothing to indicate the involvement of the Moroccan authorities.\n“There’s no information from any intelligence agency that raises doubts over the involvement of Moroccan authorities,” he told Cadena Ser radio on Monday. “Cooperation with Morocco is frankly positive. I’d like to stress that we need to be aware that this crisis can be resolved only through cooperation – and not through a lack of trust in Morocco, which would only further aggravate the already complex situation we have in Ceuta.”\nSánchez said fake news had been pumped out on social media accounts “associated with Russia, Israel and the international far right that always use migration to attack not just Spain but also Europe”.\nThe accusation drew a furious response from Israel. The country’s foreign minister, Gideon Sa’ar, called it a “brazen lie”, adding: “Continuing to spread defamatory lies will not distract from Sánchez’s disgraceful failure to manage his country’s affairs.”\nThe Kremlin rejected allegations that Russia was connected to the Ceuta migration crisis, the RBC daily reported on Monday.\nSánchez repeated his assertion that the influx was due to the activities of “criminal gangs” who had used disinformation to falsely claim that a ruling by Spain’s supreme court meant that no one who entered Ceuta by swimming could be deported back to Morocco.\nAlthough the overwhelming majority of the migrants crossed back into Morocco weeks ago, at least 5,000 people, including 1,200 minors, are still on the streets of Ceuta. Their continuing presence has led to clashes between some Ceuta residents and police, while some of the migrants have had their belongings burned while sleeping rough on beaches. On Saturday, four Moroccan migrants were arrested for throwing stones at Spanish soldiers.\nSánchez said there would soon be “sufficient capacity” to accommodate all those still in the enclave.\nSpain’s conservative People’s party has accused the government of failing to protect the people of Ceuta. “It did nothing to avoid the invasion on 30 July and it’s doing nothing to stop the public order crisis that’s getting worse every day,” the PP’s leader, Alberto Núñez Feijóo, said last week.\nSantiago Abascal, the leader of the far-right Vox party, has described events in Ceuta as “an invasion and an act of war promoted by Morocco and allowed by Sánchez, who is incapable of responding because he is subservient to Morocco”.", "translation_ja": "", "vocab": [{"word": "rapprochement", "definition": "敵対関係にあった国や団体の関係改善や和解。外交用語として使用され、特に過去の対立を乗り越えて友好関係を築くことを指す。"}, {"word": "enclave", "definition": "周囲を他の領域に囲まれた領土または地域。異なる国や地域に囲まれている飛び地を意味する。"}, {"word": "disinformation", "definition": "意図的に広められる偽りの情報。真実ではない情報を意図的に拡散させ、大衆の認識や判断を操作する行為。"}, {"word": "humanitarian emergency", "definition": "大量の人命が危険にさらされている緊急事態。食糧不足や医療の欠如など人道的危機を指す。"}, {"word": "aggravate", "definition": "問題や状況を悪化させる、より深刻にする。すでに困難な状況をさらに悪くすることを意味する。"}, {"word": "influx", "definition": "大量の人や物が短期間に流入すること。特に管理しきれないほどの人が一度に到着することを指す。"}]}, {"title_ja": "米陸軍長官ダニエル・ドリスコル、国防長官との対立を受け辞任を表明", "title_en": "US Army Secretary Daniel Driscoll Submits Resignation Amid Pentagon Tensions", "summary_ja": "米陸軍長官ダニエル・ドリスコルが、国防長官ピート・ヘグセスとの数ヶ月の対立を受けて辞任を表明したと報道されている。ホワイトハウスはウォール・ストリート・ジャーナルの報道を否定していないが、辞任が正式に受理されたかどうかは不明である。ドリスコルはヘグセス長官の下で五角形庁舎を去った最新の高官である。", "summary_en": "US Army Secretary Daniel Driscoll has submitted his resignation following months of tension with Defense Secretary Pete Hegseth, according to media reports. The White House has not denied the Wall Street Journal report, though it remains unclear if the resignation has been officially accepted. Driscoll is the latest senior Pentagon official to depart under Hegseth's leadership.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/31/us-army-secretary-daniel-driscoll-submits-resignation-media-reports-say?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "US Army Secretary Daniel Driscoll submits resignation, media reports say\nDriscoll’s resignation follows months of tensions with Defense Secretary Pete Hegseth, US media reports say.\nUnited States Army Secretary Daniel Driscoll has submitted his resignation following months of tension with Defense Secretary Pete Hegseth, according to media reports.\nAsked about a Wall Street Journal report on Driscoll’s resignation on Monday, the White House did not deny it.\nRecommended Stories\nlist of 4 items\n- list 1 of 4Trump says Iran is ‘dead’, vows to respond after renewed clashes\n- list 2 of 4Iran economy could collapse within months, US Treasury’s Bessent warns\n- list 3 of 4Vance says Trump ‘sending a message’ to Iran with AI-generated video\n- list 4 of 4Top US general says no plans to deploy troops for 2026 midterm elections\n“Secretary Driscoll has been highly effective in advancing President Trump’s agenda to Make America Strong Again at the Department of the Army by providing outstanding leadership during historic military operations, restoring an emphasis on readiness and lethality, assisting with negotiations between Russia and Ukraine, and more,” Spokeswoman Anna Kelly said in a statement.\n“The United States Army is more powerful than ever thanks to his work alongside the Commander-in-Chief and Secretary of War,” she added.\nThe Reuters news agency, citing a source familiar with the matter, said it was unclear whether the White House has accepted Driscoll’s resignation.\nThe army declined to comment.\nDriscoll, who is considered close to Vice President JD Vance, is the latest senior official to leave the Pentagon under Hegseth.\nThe defence secretary fired Army Chief of Staff Randy George in April, while the Army’s commander in Europe and Africa, General Christopher Donahue, unexpectedly stepped down in June.\nHegseth has removed several other generals and admirals, including the head of the Navy.\nThe Pentagon abruptly announced in April that Navy Secretary John Phelan was leaving the job, becoming the first head of a military service to depart during US President Donald Trump’s second term.", "translation_ja": "", "vocab": [{"word": "resignation", "definition": "職務や地位から辞めることの正式な通知。特に高位の職務から辞める場合に使用される。"}, {"word": "tensions", "definition": "人々や機関の間の不安定な関係または対立した状態。摩擦や不調和を示す。"}, {"word": "lethality", "definition": "致命的であること、または殺傷能力を持つ状態。軍事用語では、戦闘力や破壊力を意味する。"}, {"word": "abruptly", "definition": "突然に、予期せず。警告や準備なしに急に起こることを表現する。"}, {"word": "Pentagon", "definition": "米国防総省の別称。米軍の最高司令部を指し、政策決定と軍事作戦の中枢である。"}]}, {"title_ja": "コロンビア軍の武装勢力掃討作戦で未成年3人が殺害", "title_en": "Three minors killed in Colombia military airstrike on armed group", "summary_ja": "コロンビア軍が8月27日に実施した空爆作戦で、FARC反政府勢力の拠点を攻撃し、計10人が殺害され、そのうち15歳と16歳の未成年3人が含まれていた。デラエスピリェラ大統領は就任以来、武装勢力への作戦を強化し、24人の容疑者が殺害されている。人権団体は、武装グループがソーシャルメディアを通じた児童募集を急速に増やしていることに警告を発している。", "summary_en": "A Colombian military airstrike on August 27 killed 10 people, including three minors aged 15-16, in operations against FARC dissident rebels. President de la Espriella has intensified crackdowns on armed groups, with 24 suspected rebels killed since taking office. Rights groups warn that armed organizations are increasingly recruiting children through social media platforms.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/31/three-minors-killed-in-colombia-armed-group-crackdown?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Three minors killed in Colombia armed group crackdown\nRights groups warn that armed groups are increasingly recruiting children to their ranks through social media.\nThree minors were among those killed in a Colombian military air strike on cocaine-trafficking rebels last week, authorities said, as President Abelardo de la Espriella intensifies operations against armed groups.\nThe August 27 bombing in the southern Guaviare department was the deadliest military operation since de la Espriella took office earlier this month. The National Institute of Legal Medicine and Forensic Sciences said that 10 people in total were killed in the operation. The Ministry of National Defence reported that two of the victims were 15 and another was 16.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Car bomb attack rattles Colombia after inauguration of hardline president\n- list 2 of 3Colombia minister warns of ‘terrorism’ threat at presidential inauguration\n- list 3 of 3De la Espriella sworn in as Colombia’s leader, vows armed group crackdown\nThe victims allegedly belonged to a dissident faction of the defunct Revolutionary Armed Forces of Colombia, or FARC, that rejected a 2016 peace agreement with the government.\nDe la Espriella, a right-wing leader and ally of United States President Donald Trump, said on Monday that another bombing in the same area killed eight members of a FARC dissident group led by commander Ivan Mordisco. It is not known whether any minors were among the dead.\n“The bandits, who for decades have recruited minors to turn them into combatants or human shields, must pay for these crimes that violate International Humanitarian Law,” he wrote on X.\nThe Defence Ministry said on Monday that 24 suspected rebels have been killed in military operations since de la Espriella took office.\nThe strikes come as child recruitment by armed groups is again rising in Colombia, according to a Human Rights Watch (HRW) report published last week.\nAt least 1,500 children have been recruited by armed groups since 2021, with 625 cases reported in 2024, according to the report.\nThe watchdog said that criminal and rebel groups are using social media to recruit children, including to carry out increasingly dangerous tasks, such as operating drones loaded with explosives. They also reported that algorithms on platforms including Meta and TikTok “appear to have actively promoted” content encouraging children to join rebel groups.\n“Armed groups in Colombia are recruiting children with impunity,” said Juanita Goebertus, HRW’s Americas director. “Protection systems are failing, and social media platforms have become a more effective recruiting ground.”\nMeta and TikTok told HRW that they prohibit content promoting violence and had removed accounts flagged by the organisation.", "translation_ja": "", "vocab": [{"word": "dissident", "definition": "公式な方針や主流の見解に反対する人、または反政府グループを指す。政治的対立や組織内の分裂を表すときに用いられる。"}, {"word": "impunity", "definition": "罰せられないこと、または処罰を受けない状態。犯罪や不正行為が咎められない状況を表す。"}, {"word": "crackdown", "definition": "不正行為や反政府活動に対する厳しい取り締まりや弾圧。強硬な執行措置を意味する。"}, {"word": "algorithm", "definition": "コンピュータやソーシャルメディアが情報を処理・選別するための計算手順やルール。ユーザーに表示するコンテンツを決定する仕組み。"}, {"word": "humanitarian law", "definition": "武力紛争中の人道的扱いを定める国際法。民間人や捕虜の保護などを規定する。"}, {"word": "defunct", "definition": "もはや存在しない、または機能していない。解散した組織や廃止された制度を表す。"}]}, {"title_ja": "ジャーナリストが攻撃される：ヨルダン川西岸とガザの紛争激化", "title_en": "Journalists Attacked as Violence Escalates in West Bank and Gaza", "summary_ja": "イスラエル軍の作戦がヨルダン川西岸で占領地のパレスチナ人と国際ジャーナリスト（NBCクルーを含む）を標的にしている。暴力行為によって民間人の犠牲者が生じており、ガザでは3歳の子どもが空爆で殺害された。イスラエルの当局者はまた、パレスチナ人被拘禁者を描いた議論の多いAI生成コンテンツをリリースしている。", "summary_en": "Israeli military operations have targeted Palestinians and international journalists, including an NBC crew, in the occupied West Bank. The violence has resulted in civilian casualties, including a 3-year-old child killed in a Gaza airstrike. Israeli officials have also released controversial AI-generated content depicting Palestinian detainees.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/31/jerusalem-daily-journalists-attacked?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "JERUSALEM DAILY: JOURNALISTS ATTACKED\nNewsFeed\nJERUSALEM DAILY: JOURNALISTS ATTACKED\nIsraeli pogroms target Palestinians and an NBC crew in the occupied West Bank. A 3-year-old child is killed in an Israeli airstrike in Gaza. Ben-Gvir releases an AI video depicting Palestinian detainees. Al Jazeera’s Marah Rayan has the latest.\nPublished On 31 Aug 2026", "translation_ja": "", "vocab": [{"word": "pogroms", "definition": "特定の民族やグループに対する組織的な暴力や虐殺のこと。歴史的には少数民族への集団的な攻撃を指すことが多い。"}, {"word": "escalates", "definition": "問題や紛争が段階的に悪化または拡大すること。状況が緊張度を増して進展することを意味する。"}, {"word": "airstrike", "definition": "航空機から行われる爆撃または攻撃のこと。軍事作戦における空からの攻撃を指す。"}, {"word": "detainees", "definition": "拘束されている人、被拘禁者のこと。法的手続きの結果として拘留されている個人を指す。"}, {"word": "occupied", "definition": "軍事力により支配下に置かれた地域のこと。国際法では領土紛争の対象となる地域を表すことが多い。"}]}, {"title_ja": "米最高裁、トランプ大統領のホワイトハウスバルルーム計画の進行を認可", "title_en": "U.S. Supreme Court Allows Trump's White House Ballroom Project to Proceed", "summary_ja": "米最高裁は5対4の投票で、トランプ大統領のホワイトハウスバルルーム建設を中止させるという下級裁判所の命令を取り消し、同大統領に大きな勝利をもたらした。裁判所は全米歴史保存トラストが訴訟を起こす法的立場を持たないと判断したが、裁判官らはこの計画の合法性について最終的な判断を下していないことを強調した。事件は下級裁判所での審理が続く一方、建設は進められる。", "summary_en": "The U.S. Supreme Court voted 5-4 to lift a lower court order halting construction of President Trump's White House ballroom, granting him a major victory. The court ruled that the National Trust for Historic Preservation lacked legal standing to bring the lawsuit, though justices emphasized they were not making a final ruling on the project's legality. The case will continue in lower courts while construction advances.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/us-supreme-court-allows-trumps-ballroom-project-to-proceed/article71412668.ece", "state_media": false, "category": "社会", "full_text": "The U.S. Supreme Court on Monday (August 31, 2026) allowed President Donald Trump to continue construction of his White House ballroom, granting him a major victory against opponents of the project.\nThe conservative-dominated court voted 5-4 to lift a lower order demanding construction be halted, with Chief Justice John Roberts notably joining the court's three liberals in dissent.\nMr. Roberts earlier this month issued a temporary order to allow construction while the full court weighed the matter.\nThe project has roiled Washington, with critics saying Trump acted unlawfully by unilaterally ordering the demolition of the entire White House East Wing.\nThe court decision means construction will advance, while a lawsuit brought by the National Trust for Historic Preservation will play out in lower courts — a process that could take months or years.\nThe National Trust did not immediately return AFP's request for comment.\nIn its decision the court said that the government was likely to eventually win the ongoing lawsuit because the National Trust probably did not have the right to bring the claim in the first place.\nThe organization's case is grounded by one of its members, Washington resident Alison Hoagland, who claims that seeing the finished ballroom would result in damage to her \"aesthetic, cultural, and historical interests,\" due to its size.\n\"This Court has not found standing in circumstances like these before. To the contrary, we have repeatedly held that mere offense, disagreement, or distaste does not qualify as a concrete and particularized injury,\" under the US constitution, the five justices wrote in their ruling.\n\"Perhaps nearly any government action or project offends someone's sensibilities,\" they added.\nHowever, those justices made clear that they were not making a final ruling on the legality of the ballroom project, just that construction could continue while the case is argued and decided in lower courts.\nThe dissenting justices wrote that the project was \"likely unlawful,\" because \"Congress has not passed any law resembling 'express authority'\" for the administration to undertake it — despite a law requiring it to do so.\nThey also argued that Hoagland's claims \"suffices for standing.\"\nWhile the ballroom has drawn headlines, the project also includes a military bunker.\nA district court and, later, an appellate court, halted work on the ballroom while allowing construction on the military facility to continue.\nThe president has trumpeted the ballroom as necessary for hosting galas and state dinners, while also stressing the national security need for the bunker.\nPublished - September 01, 2026 03:05 am IST", "translation_ja": "", "vocab": [{"word": "roiled", "definition": "（感情や状況を）かき乱す、混乱させるという意味の動詞。ここでは政治的議論や対立で議論を巻き起こしたことを表現している。"}, {"word": "unilaterally", "definition": "一方的に、他者の同意なしに決定や行動を取るという副詞。政治的文脈では権力者が独断的に行動することを指す。"}, {"word": "standing", "definition": "法律用語で、ある人物または団体が法的に訴訟を起こす権利があるかどうかを表す。訴訟を提起する法的な利害関係を意味する。"}, {"word": "particularized", "definition": "具体的で特定の、抽象的ではない状態を表す形容詞。法律分野では一般的な被害ではなく、当事者に限定された具体的な損害を示す。"}, {"word": "dissenting", "definition": "異議を唱える、反対意見を述べるという意味の形容詞または動詞。裁判では多数派の判決に反対する裁判官の意見を指す。"}, {"word": "trumpeted", "definition": "（何かを）大々的に宣伝する、強く主張するという動詞。政治家が政策や成果を積極的に広報することを表現する。"}]}, {"title_ja": "西アジア紛争激化：米国がイラン攻撃、油価が急騰", "title_en": "West Asia Conflict Escalates: US Strikes Iran, Oil Prices Surge", "summary_ja": "米国は2026年8月30日、ホルムズ海峡のラーク島のイラン軍ロケット砲台を攻撃し、テヘランは米軍のヨルダン駐留軍への報復ミサイル攻撃で応じた。6ヶ月間の紛争が激化する中、油価は2%以上上昇し、両国は戦略的水路をめぐって膠着状態が続いている。", "summary_en": "The US attacked Iranian rocket launchers on Larak Island in the Strait of Hormuz on August 30, 2026, prompting Tehran to retaliate with missile strikes on American military targets in Jordan. Oil prices jumped over 2% as the six-month conflict intensifies, with both nations locked in an impasse over the strategic waterway.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/west-asia-war-us-attack-on-iran-live-updates-donald-trump-strait-of-hormuz-news-august-31-2026/article71409553.ece", "state_media": false, "category": "社会", "full_text": "U.S. forces struck two launchers on Iran's Larak Island in the Hormuz Strait on August 30, the first known American strikes on the Gulf nation since late July. File\n| Photo Credit:\nWANA (West Asia News Agency) via REUTERS\nOil prices jumped more than $1 a barrel on Monday (August 31, 2026) after the U.S. attacked an Iranian island in the Strait of Hormuz and drew retaliation from Tehran, as conflict in West Asia extended into its sixth month.\nThe United States said on Sunday (August 30, 2026) it had attacked Iranian rocket launchers on a small island in the Strait of Hormuz, its first strikes on Iran in a month, prompting Tehran to retaliate.\nThe U.S. strikes resulted in “casualties,” said Iran’s Revolutionary Guard Corps, which in turn attacked U.S. military targets in Jordan, state media reported.\n(With inputs from AFP, Reuters)\nSeptember 01, 2026 02:10\nOil prices surge on renewed fighting in U.S.-Iran war\nOil prices jumped more than two per cent on Monday, with the Brent international benchmark rising above $90 a barrel after a fresh flare-up in the US-Iran war.\nIn equity trading, Wall Street and Europe’s main markets dipped as investors continued to react to hawkish comments from Federal Reserve chief Kevin Warsh.\nAfter a run lower for most of last week, oil prices spiked again Monday, a day after the United States said it had attacked Iranian rocket launchers on a small island in the Strait of Hormuz, its first strikes on the country in a month.\nTehran retaliated by launching missiles at US military targets in Jordan.\n-AFP\nSeptember 01, 2026 02:09\nTrump says reviewing U.S. position on Falkland Islands\nU.S. President Donald Trump said he was reviewing the United States’ position on the Falkland Islands, the remote British-ruled archipelago in the South Atlantic.\n“I always review every position. That’s just one of many,” Mr. Trump told reporters in the Oval Office when asked about the islands’ sovereignty.\nMr. Trump did not signal whether the review would change the United States’ position on sovereignty, which has generally avoided taking sides since 1982.\nArgentina, led by Trump ally Javier Milei, has also claimed sovereignty over the islands.\n-Reuters\nAugust 31, 2026 21:26\nTrump was sending message to Iran with Kharg Island post, says Vance\nU.S. President Donald Trump was sending a message to Iran with his social media post about Iran’s energy hub of Kharg Island being blown to smithereens, Vice President J.D. Vance said on Monday (August 31).\n“The President likes to switch it up on social media a little bit. He would be the first to say he doesn’t make announcements about military actions on social media, but I think that he’s sending a message to the Iranians,” Mr. Vance said when asked about President Trump’s post.\nMr. Trump’s one-line social media post on Sunday (August 30) was accompanied by an AI-generated video clip. A U.S. official said on Monday the military had not targeted Kharg Island in overnight strikes. An Iranian official dismissed Mr. Trump’s post as “laughable”.\n- Reuters\nAugust 31, 2026 21:23\nLebanon urges Greece to help implement truce with Israel\nLebanese President Joseph Aoun asked Greece on Monday for support to help implement a ceasefire agreement with Israel and end Israeli attacks on his country, hours after Greece and Israel announced a multibillion arms deal.\nThe June 26 a
