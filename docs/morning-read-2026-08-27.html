inition": "システムやセキュリティにおける弱点や隙のこと。攻撃者に利用されやすい箇所を意味する技術用語です。"}]}, {"title_ja": "トランプ大統領「米国はカナダを必要としない」と主張、しかし経済は逆を示す", "title_en": "Trump Claims U.S. Doesn't Need Canada, but Economy Tells Different Story", "summary_ja": "トランプ大統領は米国がカナダを必要としないと主張していますが、米国はカナダからの原油、アルミニウム、カリウム肥料など米国産業と農業に不可欠な輸出品に大きく依存しています。トランプがカナダ産アルミニウムに関税を課す一方で、同時にそれらの金属の重要な必要性を認めていることは矛盾を示しています。カナダは米国の第2位の貿易相手国であり、年間約8720億ドルの商品およびサービスの交換があります。", "summary_en": "Despite President Trump's assertion that the United States does not need Canada, America relies heavily on Canadian exports including crude oil, aluminum, and potash that are essential to U.S. industries and agriculture. The contradiction is evident as Trump imposed tariffs on Canadian aluminum while simultaneously acknowledging the country's critical need for the metal. Canada remains the U.S.'s second-largest trading partner, with approximately $872 billion in annual goods and services exchange.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-says-us-doesnt-need-canada-americas-economy-says-otherwise/article71394173.ece", "state_media": false, "category": "経済", "full_text": "U.S. President Donald Trump says his country does not need Canada. But every day, roughly 4 million barrels of Canadian crude oil flow south, helping fuel American cars, trucks and airplanes and supply U.S. industry.\nAnd oil is only the beginning.\nCanada also supplies aluminum, potash to U.S. farms and parts for an auto industry built on both sides of the border.\n“WE DON'T NEED CANADA, THEY NEED US!” Mr. Trump posted this week, repeating his long-running claim.\nYet Mr. Trump has imposed a 50% tariff on Canadian aluminium while acknowledging this week that the United States badly needs the metal.\n“This country desperately needs aluminium,” Mr. Trump said. “We don't have it. We get it all from Canada for the most part, and we need it badly.” The contradiction underscores how deeply the two economies remain intertwined — and how much could be at stake if Trump's trade war reaches more of the energy, materials and supply chains that the US still relies on Canada to provide.\nCanada is the United States' second-largest trading partner after Mexico and energy is at the heart of that relationship.\nThe two countries exchanged about $872 billion in goods and services last year. Canadian crude imports equal nearly 20% of total U.S. petroleum consumption, according to the U.S. Energy Information Administration, part of the Department of Energy.\nDaniel Beland, a political science professor at McGill University, said Mr. Trump's claim that the United States does not need Canada is “absolutely false,” citing U.S. reliance on Canadian oil and natural gas and deeply integrated industries such as autos.\nMuch of Canada's crude flows to Midwest refineries built to process its heavy oil into gasoline, diesel and jet fuel.\nEnergy also explains much of the US trade deficit with Canada, which Mr. Trump frequently cites as evidence of an unfair relationship.\nThe White House this week portrayed the relationship in starkly negative terms, saying Canada had taken roughly $50 billion a year from the United States over the past decade. Much of that gap reflects U.S. purchases of Canadian energy, which helps power the U.S. economy.\nAnd Canada's heavy crude typically trades at a discount to U.S. benchmark oil, according to the U.S. Energy Information Administration.\nEnergy more than accounted for last year's $48.3 billion goods deficit. Without energy, the United States would have run a trade surplus.\nAfter trade talks collapsed last Friday (August 21, 2026), the U.S. imposed 50% tariffs on about $20 billion worth of Canadian goods. The measures cover only about 5% of Canadian exports to the United States and exclude energy.\nFor now, using oil as a weapon in trade negotiations remains a remote possibility. Alberta Premier Danielle Smith opposes restricting energy exports, arguing that doing so would hurt her province.\nBut former Alberta Premier Jason Kenney said Canada should not rule out export taxes on oil, fuel or potash if Trump escalates further.\nSuch retaliation “would affect Republicans who drive F-150s and lay fertiliser on their farm fields,” Mr. Kenney said.\n“They should be mindful that if they really want to escalate, it will not end well for the American economy two months before midterm elections,” he said.\nOntario Premier Doug Ford cited Canadian commodities as leverage, accusing Mr. Trump of “putting out fake news” about the United States not needing Canada.\nHe called potash used by U.S. farmers “one of the most powerful tools we have” and said Washington would have to turn to suppliers such as Russia if Canada redirected shipments.\nMr. Kenney stopped short of advocating an export tax, and Béland said such a move would probably be “a very divisive issue politically in provinces like Alberta and Saskatchewan”.\nThat underscores the limits of Canada's leverage: measures aimed at hurting US industries could also hurt Canadian producers and strain political unity at home.\nCanada has long been the dominant foreign source of aluminum for the United States. Smelting the metal requires enormous amounts of electricity, giving hydro-rich Canada a major advantage.\nPrime Minister Mark Carney told a New York business audience in May that Canadian aluminium exports to the U.S. are “the energy equivalent of 10 Hoover dams”.\nAmerican farmers are even more dependent on Canada for potash, a fertiliser essential to crops such as corn and soybeans. More than 80% of U.S. potash imports come from Canada.\nEven Mr. Trump's ambassador has disputed the idea that the United States needs nothing from its neighbour.\n“America has a tremendous amount of things where we have a need,” Ambassador Pete Hoekstra said in June. Pointing to Canadian fertiliser supplies, he added: “We need potash.” Then there are cars.\nCanada and the United States have built an integrated auto industry in which parts can cross the border up to six times before final assembly, according to the Canadian government.\nMr. Trump said on Monday (August 24, 2026) that his administration w", "translation_ja": "", "vocab": [{"word": "intertwined", "definition": "複雑に絡み合った、結びついた状態を表す。ここでは米国とカナダの経済が深く結びついていることを意味します。"}, {"word": "benchmark", "definition": "標準となる指標や基準値のこと。ここでは石油価格の比較基準を指します。"}, {"word": "leverage", "definition": "交渉における有利な立場や影響力のこと。ここではカナダが米国との交渉で使える武器を意味します。"}, {"word": "escalate", "definition": "段階的に悪化させる、エスカレートさせることを意味します。ここでは貿易紛争が拡大することを指します。"}, {"word": "smelting", "definition": "鉱石から金属を抽出する製錬プロセスのこと。高度な工業用語です。"}, {"word": "integrated", "definition": "統合された、一体化された状態を表す。ここでは米国とカナダの自動車産業が密接に結びついていることを意味します。"}]}, {"title_ja": "ネパール洪水災害：157人死亡、400人以上が行方不明 インドが救援物資を送付", "title_en": "Nepal Flash Floods: 157 Dead, 400+ Missing as India Sends Relief", "summary_ja": "ネパールのボテコシ川で発生した大規模な洪水により、少なくとも157人が死亡し、約133人のインド国民を含む400人以上が行方不明となった。この災害は中国チベット自治区と国境を接するラスワ地区で水曜日の朝に発生した。インド当局は複数の相談窓口を設置し、インド大使館は救援物資の輸送を開始している。", "summary_en": "A massive flash flood in Nepal's Bhotekoshi River killed at least 157 people and left over 400 missing, including approximately 133 Indians, in the Rasuwa district bordering Tibet on Wednesday. Indian authorities have established multiple helplines across various states and the Indian Embassy has mobilized relief materials. Officials warned the death toll could rise as rescue operations continue and damage assessment is ongoing.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/nepal-floods-live-updates-august-26-2026-several-missing-dead/article71392492.ece", "state_media": false, "category": "社会", "full_text": "Nepal flash floods LIVE: At least 157 dead, hundreds missing; India sends first tranche of relief materials\nFor assistance and information related to Indian nationals who have been affected by the flash floods in Nepal today, the following emergency numbers may be contacted: +977 985 131 6807, +977 970 910 7500, said a post by the Indian Embassy in Nepal\nA drone view shows mud covering properties following a flash flood at Trishuli in Nuwakot district, Nepal, August 26, 2026. REUTERS/Stringer\n| Photo Credit:\nSTRINGER\nAt least 157 people were confirmed dead and more than 400, including around 133 Indians, were missing or out of contact after a massive flash flood in Nepal’s Bhotekoshi River swept through villages in Rasuwa, a district bordering China’s Tibet region, on Wednesday morning, authorities said.\n“Several security personnel, government officials and employees of hydropower projects are also out of contact,” the PMO said. “The disaster has damaged 19 motorable bridges and 40 kilometres of road.”\nOfficials said the death toll could rise and that it would take days to assess the full extent of the damage.\nPrime Minister Balendra Shah said in a social media post that he was left with a “heavy heart”. “The entire nation has been left shocked and deeply saddened by the loss of life and damage to property,” he added, describing the disaster as “sudden” and “massive”. Stating that the government immediately mobilised all its resources for rescue operations, he vowed that rescue operations would continue through the night.\nAdministration in Marathwada provides numbers for collecting information about tourists in Nepal\nDistrict administrations in the Marathwada region have announced phone numbers where relatives of tourists who are stuck in Nepal or missing following flash floods in that country can provide information.\nThe disaster management departments of Parbhani, Latur, Hingoli, Jalna and Chhatrapati Sambhajinagar have appealed to relatives to share information about the tourists they cannot contact or who are stuck somewhere in Nepal.\nThe two numbers provided by the Latur administration are 023 82220204 and 1077 (toll free).\n- PTI\nSikkim sets up helpline for residents affected by Nepal flash flood\nThe Sikkim government today set up a helpline to assist residents whose family members or relatives may be stranded or affected by flash flood in Nepal, officials said.\nIn a press release, the Sikkim State Disaster Management Authority (SSDMA) said the helpline would facilitate information sharing, coordination of rescue and assistance, and communication with authorities.\n“People in Sikkim who have family members or relatives currently in Nepal and affected by the floods are requested to contact the helpline [03592-201145, 03592-202461 and 03592-202256] with relevant details,” the release said.\n- PTI\nRajasthan government issues helpline numbers\nRajasthan government today issued helpline numbers for those seeking information or assistance regarding people from the state currently travelling in Nepal, in the wake of the devastating floods.\nThe Disaster Management Department said families seeking information or assistance regarding any Rajasthan resident travelling in Nepal can contact the State Emergency Operation Centre on toll-free numbers 1070 and 112.\nThey can also contact the centre on 0141-2851960, 0141-2385776, 0141-2385777, 0141-2227296, 0141-2927392 and 0141-2227603, it said in a statement.\nInformation can also be shared through IP number 28888 or email at relief-rj@nic.in, it said.\n- PTI\nIndian Embassy in Beijing releases helpline numbers\nIn view of the recent flash flood in the border areas in the Tibet Autonomous Region, People’s Republic of China, Indian nationals stranded in the vicinity can seek assistance from the following contact points:\ni) Chinese officials on the ground: 0086 139 8999 0012\nii) Embassy of India, Beijing: 0086 185 1428 4905 (can also contacted through WhatsApp)\niii) Embassy of India, Kathmandu: +977 985 131 6807, +977 970 910 7500 (Both numbers can also be contacted through WhatsApp)\nKeralam opens helpdesk for Malayalis affected by Nepal flash floods\nKeralam has opened a helpdesk through state-run Norka-Roots to provide emergency assistance to Malayalis affected by the flash floods in Nepal, while Chief Minister V.D. Satheesan said the state was closely monitoring the situation amid reports that more than 100 Indians were missing.\nThe helpdesk was opened on the directions of the CMO, Norka-Roots Chief Executive Officer Rajesh Madhavan said in a statement.\nNORKA Roots is the field agency for the Department of Non-Resident Keralites Affairs under the Government of Keralam.\nPeople seeking assistance can contact the Norka Global Contact Centre at 18004253939 (toll-free) or give a missed call from abroad at +91-8802012345, the statement said.\nIt urged families unable to contact Malayalis travelling in Nepal to inform the Chief Minister’s Office at 9447111844 or 9747132147.\nThe Keral", "translation_ja": "", "vocab": [{"word": "tranche", "definition": "分割払いされる資金や物資の一部。ここでは救援物資の第一陣を意味する。"}, {"word": "stranded", "definition": "立ち往生した、動けなくなった状態。洪水などで身動きが取れない人々を指す。"}, {"word": "mobilized", "definition": "資源や人員を緊急時に集結・配置させること。政府が救助活動のために全力で対応する様子を表す。"}, {"word": "devastated", "definition": "甚大な被害を受けた、壊滅的な状態。災害の規模の大きさを強調する表現。"}, {"word": "cordial", "definition": "温かく友好的な関係。ここでは国家間の協力体制を示す。"}, {"word": "contingency", "definition": "万が一の事態への対備、緊急時の対応計画。災害時の予備的対応を意味する。"}]}, {"title_ja": "メープルリーフスのファンがチケット価格に不満表明、MLSEが対応を発表", "title_en": "Maple Leafs Fans Voice Frustration Over High Ticket Prices; MLSE Responds", "summary_ja": "トロントメープルリーフスのファンたちが試合チケットの高騰に対し、怒りと失望を表明している。メープルリーフスポーツエンターテインメント（MLSE）はファンのチケット価格に関する批判に対応を発表した。", "summary_en": "Toronto Maple Leafs fans have expressed shock and frustration over escalating ticket prices for games. Maple Leaf Sports and Entertainment (MLSE) has responded to the backlash regarding ticket affordability and accessibility for supporters.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikAJBVV95cUxPazVrX3otdEpudm9VdHBZN2YzUF9Qckh4SzdFUldmQkIxMkxUMEhyUjN1ejVzS1g1a2tqbldIZ2RWdVZYTHh6WERmTzg0aWhycGdjMjBuLVFtcTlxMGpybmpmUnZ0M oric. The commentary emphasizes the importance of treating this geopolitical challenge with both urgency and strategic clarity.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiggJBVV95cUxPR3dxOThYX04zcXRlUUYzTDZ1TVRBTFI0eXdYamo2NjlfNmlOTXZ4c0JNcWsxUkR0clgxcEQ0ei1WYWZIb1JQR29iaEJUMUpOZzlzYnhVVlVmTTFSeGJtUUVFRVJxQ2tVM28tMjlacFZpOTNhUGpYY0FTRmJCLUFMYWZham5OVVJHOWxnRTkzS3JOWGxjZTRwbmpKTWFxXzJZeUxwZHRVVWpjNFBNR3pzT01POGtlRE5xNWxjZkNwa05BWnhYQnp1Q0czTG15aTJYSUpiWHpqQlpmUnVUMHVrX1VyNjdyaEZpN3V4cmZuVG94UEhmZk5WT0tqUnZuNnI1UkE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O グローボ ニュース", "title_en": "O Globo News", "summary_ja": "O グローボはニュースカバレッジとレポーティングを提供しています。この出版物は読者に時事問題と情報を届けています。", "summary_en": "O Globo provides news coverage and reporting. The publication delivers current events and information to its readership.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE00WVFsTjVqR2xZQjFKaFZSNHBGUkpwZ2RhZXRRVUpPeHpoNXlfWENGNkN1VW9xOEtmby1oNVpYZVc2Y2huaWh2SnpvdExUbEJvZWhhc3ZXWnRFM2xIcVFiajR4UHA4NENhYXc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コパカバーナの大晦日はゴスペル、ファンク、MPB、サンバで彩られる", "title_en": "Copacabana New Year's Eve Features Gospel, Funk, MPB and Samba", "summary_ja": "リオデジャネイロの象徴的なコパカバーナビーチで、複数の音楽ジャンルを特徴とした多様な大晦日の祝賀行事が開催される予定です。このイベントでは、ゴスペル、ファンク、MPB（ブラジル・ポップ・ミュージック）、サンバのパフォーマンスが一晩中行われます。", "summary_en": "Rio de Janeiro's iconic Copacabana beach will host a diverse New Year's Eve celebration featuring multiple musical genres. The event will showcase gospel music, funk, MPB (Música Popular Brasileira), and samba performances throughout the evening.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi4wFBVV95cUxQdkJ5QUYtN1VFbXVPSWVvbDNnd0R0RC1rOFJ1ZnRIQXpqQm5ZeGtjaHdIQ2VQZTYtSEcwR2JTaFU2aXlZMlZxRE14SExNTEpzVXFpQV9sckpoZXFXaTZPNmhMSE1mN2Q5VlQyek5zTmJId3d6U3ZqWW9WekZqUkNqMzBBRWZ5NWRmNjJkQ3Fhd0hNUUpRMEc4TDJBcGR4ZHB4NFltcEg4NXU4OHZqQlJYc2lmaVFXalhBaUIydnBnR0RjeDJGeFRGN2t3VGoyOTgyV0hCSDdVbkc3bkRnWEdwRVFDVdIB8gFBVV95cUxPWXo1WGF3VGVqVFlPQUcyWUZNbVc3bExHQnoyZU5LXzBTeUhucDZFMU11R2laZzdCLUpaemlPOEw2MDhRSEd2dW41UWhnenV2NWZwdVFzb3JHb2l1Z2FnTVh6Yi1IRkNnUTZTcE5RbHlrTFVmRWxlejB4TEo0UmR6RjI3SE80alI0RDRxNEpGRlpXWUFCSHo3RllKQ0owVm1aQzMwcFlkMzBYbF9nRlhmT3NBZ2hUOXJUMDNxSWh6SXUwZ1ZUa1AxYllsbk5sVW9wZ09RYUlIeFZ6VGJQaE0zYkhpdUZucW4zX1VBaUhkWV9Bdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "オグローボ：歴史を誇りに、未来へ向かう", "title_en": "O Globo: Proud of Our History, Looking to the Future", "summary_ja": "ブラジルの新聞オグローボは、その豊かな歴史を振り返りながら、将来の成長と革新に向けて自らを位置付けている。同紙は質の高いジャーナリズムへのコミットメントと、進化するメディア環境への適応を強調している。", "summary_en": "O Globo reflects on its storied past while positioning itself for future growth and innovation. The Brazilian newspaper emphasizes its commitment to quality journalism and adapting to the evolving media landscape.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinwFBVV95cUxNdjFDaWp5QXNZZ2MteFRVZ2Fvdll6dUVrQUh0UFZSdEY0alNjWUl2VHBYNVduRE5SVWhlenVybHJYWGxzbVpiTk1YOFUtOUR4ODVmNXVlR21ib0JmWFhHZzVrUXlMYVEwc2N3bXVoY2ZDTTcybUZJNHdnZ2JDVmtQV2VTcUNwd01temJXQkJ4T0l4c1BJdTRSdWZuOHBQNUnSAa4BQVVfeXFMTUctUGJNb1Q0NFlHUnZxU2tuV09IUlRBNDJBVU9NcnRPRTNtd1BnQllBSFV2dEx6Q3VwcC03WVB5Rm1yMXRCZnlUTWowQlh1OTdJS1BSRDZfS1NkZE1seDJpREg4NDVkc0hRQXhRaGNxbmQ2X0hwal9SWk1QZzg3MWljOFl3b0I4QVNmOEtkT184bVl4MV9SWnBUVVd4c3lmYnpoZ1Buc0Y5M1FzdXp3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカは資源を活用して世界的な債務システムにおける交渉力を獲得すべき", "title_en": "Africa Must Leverage Resources to Gain Bargaining Power in Global Debt System", "summary_ja": "ナイロビで開催された債務会議でアフリカの専門家らは、大陸が天然資源、市場規模、技術を活用してグローバルな金融ルールを再構築する必要があると呼びかけた。Stop the Bleeding Campaignの黒書はアフリカの債務危機を資源採掘、違法な資金流出、医療と教育から資金を転用する過度な債務返済に関連付けた。専門家らはアフリカが国際金融においてルール受け入れ側からルール策定側へ転換する必要があると強調した。", "summary_en": "African experts convened at a debt conference in Nairobi called for the continent to use its natural resources, market size, and technology as leverage to reshape global financial rules. The Stop the Bleeding Campaign's Black Paper linked Africa's debt crisis to resource extraction, illicit financial flows, and excessive debt servicing that diverts funds from healthcare and education. Experts emphasized that Africa must transition from being a rule-taker to a rule-maker in international finance.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/905606-africa-must-turn-its-wealth-into-bargaining-power-to-rewrite-global-debt-rules-experts.html", "state_media": false, "category": "社会", "full_text": "Africa must turn its natural resources, market size and technological capacity into bargaining power to secure a stronger voice in the global financial system, experts said on Wednesday at the sixth African Conference on Debt and Development (AfCoDD VI) in Nairobi, Kenya.\nThe event was organised by the African Forum and Network on Debt and Development (AFRODAD).\nThe experts said Africa’s debt burden was not simply a question of how much governments borrow or how they repay their loans. They stated that the problem was also compounded by revenue lost through illicit financial flows, poor returns from natural resources and gaps in the information governments need to negotiate effectively with creditors.\nThe call comes months after African Union leaders adopted the Common African Position on Debt, which seeks to strengthen Africa’s collective hand in debt negotiations and push for changes to the global financial system.\nThe issue featured prominently in Nairobi as debt experts, policymakers, civil society organisations and technology specialists examined the factors limiting Africa’s ability to negotiate from a position of strength.\nDuring a session themed, “Deploying the Continent’s Strategic Assets to Rewrite the Rules of International Debt Governance,” the Stop the Bleeding Campaign launched its Black Paper, linking Africa’s debt difficulties to natural-resource extraction, illicit financial flows and debt servicing.\nPresenting the paper, Jean Marcelin Brou, a professor, stressed that Africa needed to move from being a rule-taker to a rule-maker in the international financial system.\nThe paper describes what it calls a “triple drain”: natural resources extracted without sufficient returns to African economies, illicit financial flows that weaken public revenues, and debt obligations that consume money that could otherwise finance development.\nIt estimates that African governments spend an average of 16.7 per cent of their revenue on debt servicing, while more than 30 African countries spend more on servicing debt than on healthcare.\nThe paper also cites research by Léonce Ndikumana and James Boyce estimating that about $2.4 trillion flowed out of Africa between 1970 and 2018, including imputed interest.\nThe campaign calls for governments to audit and renegotiate extraction contracts, strengthen tax systems and give communities affected by mining and other extractive activities a greater say.\nIt also advocates using resource revenues to support manufacturing and agriculture, including industries producing machinery, fertilisers and other inputs that African countries currently import.\nChenai Mukumba, executive director of Tax Justice Network Africa, noted that illicit financial flows, debt and extractive exploitation should be treated as interconnected problems.\nShe noted that negotiations for a United Nations Framework Convention on International Tax Cooperation offered African countries an opportunity to play a greater role in shaping international tax rules.\nKenyan senator, Okoiti Omtatah, who formally launched the Black Paper, said the scale of Africa’s financial outflows made collective action necessary.\nReferring to the paper’s $2.4 trillion estimate, Mr Omtatah explained that African resources were leaving the continent only to return as loans carrying interest.\nHe stated that Kenya’s debt burden was already competing with spending on universities, schools, hospitals and infrastructure.\n“These are not separate problems,” he said, describing a cycle in which lost revenues contribute to budget deficits, governments borrow to fill the gap and debt repayments then consume an increasing share of public revenue.\nThe Black Paper proposes reclaiming resource sovereignty, ending illicit financial flows through tax justice, advancing debt justice and recognising care and gender justice.\nIt also supports a UN sovereign-debt workout mechanism, greater use of local-currency financing and currency swaps, stronger African-led credit assessment institutions and an African debtors’ club.\nWomen bear the cost\nThe debate also examined the social cost of debt and austerity.\nMemory Kachambwa, executive director of the African Women’s Development and Communication Network (FEMNET), stressed that the effects of debt and austerity were not gender-neutral.\n“When public services are withdrawn, women’s unpaid labour expands,” she said.\nMs Kachambwa noted that women often became the “shock absorbers” of economic crises because they took on additional unpaid care work when governments reduced spending on healthcare, education, water and other public services.\nJanet Zhou, executive director of the African Forum and Network on Debt and Development (AFRODAD), said Africa’s debt crisis should not be viewed solely through the financial decisions of individual governments.\nShe stated that African countries remained dependent on external institutions, markets and creditors and needed stronger continental institutions and mechanisms for c", "translation_ja": "", "vocab": [{"word": "illicit financial flows", "definition": "違法な資金流出のこと。脱税やマネーロンダリングなど不正な手段で国外に流出する資金を指し、発展途上国の税収や開発資金を損なう要因となる。"}, {"word": "debt servicing", "definition": "債務返済のこと。政府や企業が借入金に対して利息と元本を定期的に返済する行為。返済が過大になると国家予算が圧迫される。"}, {"word": "extractive industries", "definition": "採掘業など天然資源を採取する産業のこと。鉱物、石油、ガスなどを生産する業界を指し、しばしば環境破壊や地域住民への不利益が問題となる。"}, {"word": "rule-taker", "definition": "ルール受け入れ側のこと。他者が決めたルールに従うしかない立場を指す。国際金融の文脈では、先進国が定めた規則に従う立場にある発展途上国を意味する。"}, {"word": "sovereignty", "definition": "主権のこと。国家が自らの領土と国民に対して持つ最高権力を指す。資源主権は国家が自国の天然資源の利用と配分を決定する権利を意味する。"}, {"word": "austerity", "definition": "緊縮政策のこと。政府が財政赤字を削減するため、支出を削減し増税する政策を指す。公共サービスの削減は国民生活に悪影響を与える。"}]}, {"title_ja": "元陸軍報道官、故ジャーナリスト・ドトゥン・オラディポ氏に追悼の意を表明", "title_en": "Former Army Spokesperson Pays Tribute to Veteran Journalist Dotun Oladipo", "summary_ja": "ナイジェリアのベテランジャーナリストで『イーグル・オンライン』の編集主幹ドトゥン・オラディポ氏がラゴスで56歳で亡くなった。元陸軍報道官S.K.ウスマン氏を含む同僚や専門家団体から、ナイジェリアのメディア産業発展に大きく貢献した献身的なプロフェッショナルとして追悼の言葉が寄せられた。", "summary_en": "Dotun Oladipo, veteran journalist and publisher of The Eagle Online, died at age 56 in Lagos. Colleagues and professional bodies, including former Army spokesperson S.K. Usman, paid tributes describing him as a committed professional who significantly contributed to Nigeria's media industry development.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/905602-former-army-spokesperson-pays-tribute-to-deceased-veteran-journalist-dotun-oladipo.html", "state_media": false, "category": "政治", "full_text": "Condolences have continued to pour in following the death of veteran journalist and publisher of The Eagle Online, Dotun Oladipo, with colleagues, professional bodies and associates describing him as a committed journalist who contributed to the growth of Nigeria’s media industry.\nMr Oladipo died on Tuesday in Lagos, aged 56.\nAmong those who have mourned him is S.K. Usman, a retired brigadier general and former Director of Army Public Relations, who described the late journalist as a close friend, dependable professional and trusted colleague.\nIn a condolence message issued on Wednesday, Mr Usman said Mr Oladipo’s death was particularly painful to him because of their longstanding friendship.\nHe described the late publisher as a man of considerable wisdom, warmth and integrity who had a strong understanding of journalism, publishing and the changing digital media landscape.\nMr Oladipo, a former president of the Guild of Corporate Online Publishers (GOCOP), led the organisation from 2017 to 2021, a period Mr Usman said was an important stage in the development of online publishing in Nigeria.\nAccording to him, Mr Oladipo used his experience and leadership to strengthen GOCOP, promote professionalism and encourage cooperation among online publishers.\n“Dotun was not only an accomplished journalist and publisher, but also a great friend, dependable professional and a man of considerable wisdom, warmth and integrity. He had a profound understanding of journalism, publishing and the evolving digital media environment.\n“He was among those who recognised the growing importance of online media in Nigeria and contributed immensely to its professional development. His contribution to the development of GOCOP and online journalism will remain an enduring part of his legacy,” Mr Usman said.\nMr Usman said his relationship with Mr Oladipo extended beyond their professional engagements.\n“During my tenure as Director Army Public Relations, he was consistently supportive, accessible and professional, demonstrating a deep understanding of the responsibilities of public communication and the demands of journalism,” he said.\nMr Usman said the friendship continued after his retirement from the Nigerian Army, with Mr Oladipo remaining a trusted colleague who was willing to share his thoughts and offer constructive advice.\nHe said the late journalist’s passion for the profession, commitment to excellence and advocacy for a vibrant online media industry would be greatly missed.\nMedia community mourns\nMr Oladipo’s death has also prompted tributes from major media organisations.\nThe International Press Institute (IPI) Nigeria described him as a committed press freedom advocate and dependable member of the organisation.\nIPI Nigeria said Mr Oladipo was appointed chairman of its Programmes Committee in 2024 and played a significant role in its activities, including the planning of its annual general meetings and conferences.\nThe Guild of Corporate Online Publishers also described his death as a loss to the organisation and the wider Nigerian media community.\nGOCOP President Danlami Nmodu said Mr Oladipo played an important role in the development of the guild during his four-year tenure.\n“Dotun played an important role in the development of GOCOP. He led the Guild for four years at a time when there was still a lot of work to be done to establish online publishers as an important part of the media,” Mr Nmodu said.\nREAD ALSO: Tinubu mourns journalist, Eagle Online publisher Dotun Oladipo\nMr Oladipo began his journalism career in the traditional media and worked with several Nigerian publications, including Newswatch, PUNCH, Nigerian Compass, Nigerian Tribune and The Sun.\nHe later moved into digital publishing and founded The Eagle Online, where he served as publisher.\nHis career spanned nearly three decades and included journalism, editing, publishing and leadership roles within professional media organisations.\nPresident Bola Tinubu has also mourned Mr Oladipo, describing his death as a painful loss to the Nigerian media industry and the country.\nThe president said the late journalist’s contributions to political journalism and digital media would not be forgotten.\nMr Oladipo’s death has left his family, colleagues at The Eagle Online and members of Nigeria’s media community mourning the loss of a journalist who spent decades working across the country’s traditional and digital news industries.\nMr Usman prayed that God would grant the deceased eternal rest and give his family and other mourners the strength to bear the loss.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "condolence", "definition": "悲しみや同情を表する言葉や行為のこと。特に、誰かの死亡時に遺族に対して述べる哀悼の意。"}, {"word": "dependable", "definition": "信頼できる、頼りになるという意味の形容詞。人や物が確実で安定している特性を表す。"}, {"word": "enduring", "definition": "長く続く、永遠的な、という意味の形容詞。時間を超えて継続する性質を指す。"}, {"word": "tenure", "definition": "特定の職位や地位を保持している期間のこと。任期、在職期間を表す。"}, {"word": "vibrant", "definition": "活気のある、生き生きとした、という意味の形容詞。エネルギーと活動に満ちた状態を表す。"}, {"word": "advocate", "definition": "支持者または支援者を意味する名詞、あるいは何かを強く支持・推進する動詞として使用される。"}]}, {"title_ja": "大統領府、アティク前副大統領の燃料補助金政策を批判し、明確な立場を要求", "title_en": "Presidency Challenges Atiku's Fuel Subsidy Stance, Demands Clarity", "summary_ja": "ナイジェリア大統領府は、2027年の選挙で当選した場合にガソリン補助金を復活させると提案した元副大統領アティク・アブバカルを批判し、その立場が政策の誤解または政治的便宜主義を示していると主張した。大統領報道官バヨ・オナンガは、1週間以内にアティクと彼の側近からの矛盾した声明を指摘し、石油市場のダイナミクスを無視した「試行錯誤」政策アプローチだと非難した。", "summary_en": "Nigeria's presidency criticized former Vice President Atiku Abubakar for proposing to restore petrol subsidies if elected in 2027, arguing his position shows either misunderstanding or political opportunism. Presidential spokesperson Bayo Onanuga highlighted contradictory statements from Atiku and his aides within one week, accusing him of a 'trial and error' policy approach that ignores petroleum market dynamics.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/905600-fuel-subsidy-presidency-tackles-atiku-again-wants-clarity-on-ex-vps-stance.html", "state_media": false, "category": "政治", "full_text": "The presidency has again faulted the position of Atiku Abubakar, the presidential candidate of the African Democratic Congress (ADC), who has pledged to restore petrol subsidy if elected president in 2027.\nPresidential spokesperson Bayo Onanuga said Atiku’s position shows that he either lacks a basic understanding of the policy he is proposing or is deliberately playing politics with the Tinubu administration’s decision to remove petrol subsidy\nMr Onanuga said the subsidy removal had significantly improved the fiscal position of the three tiers of government and helped stabilise the macroeconomic environment.\nHe stated this in a statement on Wednesday in response to Atiku’s latest position on petrol subsidy. Atiku, a former vice president, had proposed a “targeted subsidy” to make transportation more affordable and accessible to Nigerians if elected president.\nPREMIUM had earlier reported that Atiku said he believed the progress and wealth of a country should be measured by citizens’ ability to purchase goods and services, rather than by how much revenue the government collects.\nPresident Bola Tinubu, who defeated Atiku in the 2023 presidential election, announced the removal of petrol subsidy on the day he was inaugurated in May 2023.\nAtiku, who has sought Nigeria’s presidency in six election cycles since 1993, had previously supported petrol subsidy removal during some of his campaigns.\nHowever, his position has changed following widespread criticism of the Tinubu administration’s subsidy removal, which many Nigerians have blamed for worsening living conditions and increasing the prices of goods and services.\nAtiku playing politics with petrol subsidy\nThe presidential spokesperson said Atiku’s change in position on subsidy removal suggests that he is playing politics with the issue and is confused about the policy he is proposing\n“Atiku confused on petrol subsidy; third U-turn in one week shows he is simply playing politics.\n“The latest comments by former Vice-President Atiku Abubakar on petrol subsidy raise a fundamental question: is he seriously proposing an economic policy, or is he simply playing politics with the temporary discomfort Nigerians face,” he said.\nMr Onanuga said the conflicting positions attributed to Atiku and his aides over the past week showed that the former vice president’s campaign was yet to present a clear position on the issue.\n“Within a week, Nigerians have heard three different explanations of what an Atiku administration would do about petrol subsidy. The confusion has now become impossible to ignore.\n“First, Atiku’s spokesperson, Paul Ibe, said Atiku would restore petrol subsidy if elected president and later phase it out. Ibe described it as a temporary intervention intended to give Nigerians and businesses room to recover.\n“Then came a clarification from another senior aide, Phrank Shaibu, who said Ibe’s statement was an “unauthorised and misleading characterisation” of Atiku’s position. According to Shaibu, Atiku would not set a predetermined date for ending the subsidy. Instead, it would remain until domestic refining expands, supply stabilises, competition deepens, and the market can deliver affordable prices without government support.\n“But just hours later, Atiku himself intervened and effectively overruled that clarification. He insisted that his position “has not changed” and that he would restore what he called a “targeted subsidy” if elected president. He also said, “I will restore targeted subsidy and put purchasing power back in the hands of Nigerians.” This is not merely a matter of semantics. It is a serious policy contradiction.”\nThe presidential spokesperson questioned why one of Atiku’s senior spokespersons had contradicted the former vice president’s position on reversing subsidy removal.\n“If Atiku’s position has not changed, why did one of his principal aides say the subsidy would be temporary and phased out? Why did another senior aide have to publicly disown that explanation and introduce a completely different framework based on market conditions? And why did Atiku then step in to reaffirm the original position?.”\n‘Policy of trial and error’\nMr Onanuga said Nigerians deserve clarity rather than a policy of “trial and error”, arguing that Atiku appeared not to understand the dynamics of the petroleum market.\nHe said petrol would not automatically become cheaper simply because the government reinstated a subsidy, noting that international crude oil prices, exchange rates, refining costs, transportation, distribution and other market factors influence pump prices.\n“Nigerians deserve clarity, not policy by trial and error. More fundamentally, Atiku’s argument appears to misunderstand the dynamics of the petroleum market. Petrol does not become cheap simply because government orders a subsidy or because competition is expected to emerge. Several factors, including international crude oil prices, exchange rates, refining costs, transportation, distribution, ", "translation_ja": "", "vocab": [{"word": "subsidy", "definition": "政府が商品やサービスの価格を下げるために提供する金銭的援助のこと。ここではガソリン価格を低く保つための政府補助金を指す。"}, {"word": "fiscal position", "definition": "政府の財政状況や収支状態のこと。政府の収入と支出のバランスを表す経済用語。"}, {"word": "macroeconomic", "definition": "国全体の経済全体に関する、インフレーション、失業率、GDP成長などを扱う経済学の分野。"}, {"word": "semantics", "definition": "言葉や表現の意味に関する学問。ここでは単なる言葉の違いではなく実質的な政策矛盾があることを示す。"}, {"word": "dynamics", "definition": "システムや市場における変化と相互作用の力学のこと。ここでは石油市場に影響を与える複数の要因を指す。"}, {"word": "reinstate", "definition": "以前に廃止したものを再度導入または復活させること。ここでは政府がガソリン補助金を再び実施することを意味する。"}, {"word": "opportunism", "definition": "原則よりも自分の利益や有利さを優先する行為。政治的に都合の良い立場をとる機会主義的な行動。"}]}, {"title_ja": "ネパールとチベットの洪水被害で数百人が行方不明に", "title_en": "Hundreds Missing as Massive Floods Sweep Through Nepal and Tibet", "summary_ja": "ネパールと中国チベット地域の間のヒマラヤ川渓谷を襲った洪水で、当局によると少なくとも160人が死亡しました。外国人観光客を含む数百人が依然として行方不明となっています。当局は被災地での救助・復旧活動を継続しています。", "summary_en": "At least 160 people were killed when catastrophic floods tore through a Himalayan river valley between Nepal and the Tibet region of China. Hundreds of people remain missing, including foreign tourists caught in the disaster. Authorities are continuing rescue and recovery operations in the affected areas.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/08/26/world/nepal-floods", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権のガザ担当官、イスラエルの停戦危機的状況を批判", "title_en": "Trump Official: Israel's Strikes Jeopardizing Gaza Cease-Fire", "summary_ja": "平和委員会のガザ担当上級代表ニコライ・ムラデノフ氏は、ハマスの目標と称される施設への継続的な攻撃についてイスラエルを批判した。イスラエルが武装解除計画を拒否した後の批判であり、停戦合意の安定性に対する懸念が高まっている。", "summary_en": "Nickolay Mladenov, the Board of Peace's high representative for Gaza, has criticized Israel for conducting ongoing strikes against alleged Hamas targets. The criticism comes after Israel rejected a disarmament plan for the militant group, raising concerns about the stability of the cease-fire agreement.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/26/world/middleeast/trump-official-israel-jeopardizing-gaza-cease-fire.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、イランへの制裁を石油以外の金、暗号資産、航空業界に拡大", "title_en": "U.S. Expands Iran Sanctions Beyond Oil to Gold, Crypto, and Aviation", "summary_ja": "米国はイランの金、デジタル資産、航空、海運、技術産業と取引する国家・団体への制裁を発表した。この包括的なアプローチは従来の石油制裁を超えて複数の産業を対象としている。イランに対する経済的圧力を多様な経済チャネルを通じて強化することが狙いである。", "summary_en": "The United States has announced plans to impose sanctions on any country or entity engaging with Iran's gold, digital assets, aviation, shipping, and technology sectors. This broader approach targets multiple industries beyond traditional oil sanctions. The move aims to increase economic pressure on Iran across diverse economic channels.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/25/world/middleeast/iran-us-sanctions-oil-gold.html", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事ゾーン通過を許可、パレスチナ人がガザ北部へ帰還", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "人質解放交渉の膠着状態が解消された後、イスラエルはガザを二分する軍事ゾーンの通過をパレスチナ人難民に許可した。この動きは、エンクレーブ内で家族とコミュニティを分断していたアクセス制限の大きな変化を示している。この通過地点は、北部の家への帰還を試みる住民にとって重要な人道的回廊を開いている。", "summary_en": "Israel has allowed displaced Palestinians to cross a military zone that divides Gaza, following a breakthrough in hostage release negotiations. The movement marks a significant shift in access restrictions that have separated families and communities within the enclave. The crossing opens a crucial humanitarian corridor for residents attempting to return to their homes in the north.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発業者が巨額損失を報告、不動産危機の深刻化が明らかに", "title_en": "China's Top Property Developer Reports Massive Loss Amid Deepening Real Estate Crisis", "summary_ja": "中国最大手の不動産開発企業である万科が巨額の損失を報告し、同国の不動産セクター危機がさらに広がっていることを示唆しています。同社の経営難は、中国政府が市場の安定化と不動産業界のさらなる悪化を防ぐために介入するかどうかについての懸念を引き起こしています。", "summary_en": "Vanke, China's leading property developer, has reported a significant loss, signaling the widening scope of the country's property sector crisis. The company's struggles raise concerns about whether the Chinese government will intervene to stabilize the market and prevent further deterioration in the real estate industry.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による砲弾片が体内に残存", "title_en": "Israeli Hostages Released Still Bearing Physical Wounds From October 7 Attack", "summary_ja": "イスラエル当局の医療関係者によると、数ヶ月間の拘束から解放されたイスラエル人人質の体内には、10月7日の攻撃による砲弾片がまだ埋め込まれたままである。一部の女性は長期間孤立した状態で拘束され、約8ヶ月間地下のトンネルに閉じ込められていた。この報告は、拘束された者たちが経験した重大な身体的および心理的トラウマを明らかにしている。", "summary_en": "Freed Israeli hostages who spent months in captivity still have shrapnel embedded in their bodies from the October 7 attack, according to Israeli medical officials. Some women were held in isolation for extended periods and spent approximately eight months confined in underground tunnels. The revelation highlights the severe physical and psychological trauma experienced by those held captive.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領の求心力低下で、より危険性が増す", "title_en": "As Trump's Presidency Flounders, He Becomes More Dangerous", "summary_ja": "ドナルド・トランプ大統領の求心力が低下する中、権力と支配力を維持するため、より攻撃的な戦術を採用している。この記事は彼の行動を領土を守うために必死の老いたゴリラに例え、彼の予測不可能性がアメリカの制度に重大なリスクをもたらす可能性があると示唆している。", "summary_en": "As Donald Trump's presidency weakens, he is adopting increasingly aggressive tactics to maintain power and dominance. The article compares his behavior to an aging silverback gorilla defending its territory, suggesting his unpredictability poses significant risks to American institutions.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/25/as-his-presidency-flounders-donald-trump-is-more-dangerous-than-ever", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "迎撃ミサイル不足がウクライナなど各地でパニックを引き起こす", "title_en": "Interceptor Missile Shortage Sparks Concerns in Ukraine and Beyond", "summary_ja": "迎撃ミサイルの不足が深刻化し、ウクライナを含む各国で懸念が広がっている。この供給不足は防空能力に対する脅威となっている。専門家は供給が補充されない場合、戦略的な脆弱性が生じる可能性があると警告している。", "summary_en": "As interceptor missiles become increasingly scarce, Ukraine and other nations face growing anxiety over air defense capabilities. The shortage threatens to undermine critical defense systems at a crucial time. Experts warn of potential strategic vulnerabilities if supplies are not replenished.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エコノミスト、パーソナライズされたニュースレターサービスを開始", "title_en": "The Economist Launches Personalized Newsletter Service", "summary_ja": "エコノミスト誌が新しいパーソナライズされたニュースレター「The Economist for You」を導入しました。このサービスは購読者の個人的な好みや関心に基づいてカスタマイズされた記事リストを直接インボックスに配信します。このイニシアティブは、各購読者に関連した厳選された記事を提供することで読者エンゲージメントの向上を目指しています。", "summary_en": "The Economist has introduced a new personalized newsletter called 'The Economist for You,' delivering customized reading lists directly to subscribers' inboxes. The service tailors content based on individual reader preferences and interests. This initiative aims to enhance reader engagement by providing curated articles relevant to each subscriber.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/introducing-our-latest-newsletter-the-economist-for-you", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "パリ・モンパルナスタワーの改築計画、共有者の対立で危機的状況に", "title_en": "Paris Tour Montparnasse transformation stalled as co-owners clash", "summary_ja": "パリの象徴的なモンパルナスタワーの改修プロジェクトが、共有者らの対立により不確実な状況に陥っている。建築許可の期限まであと3ヶ月しか残されていない。パリ市長エマニュエル・グレゴワールは対立者らの解決を促している。", "summary_en": "The renovation project of Paris's iconic Tour Montparnasse faces uncertainty as co-owners dispute terms with only three months remaining on the building permit. Mayor Emmanuel Grégoire has called for the parties to resolve their differences. Le Monde examines the complex negotiations behind the decade-long project.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/economy/article/2026/08/26/the-future-of-paris-s-tour-montparnasse-hangs-in-the-balance-as-co-owners-feud_6756883_19.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ガザ人質エヴィアター・ダヴィド：「悪夢が昼夜を問わず私を苦しめている」", "title_en": "Gaza Hostage Evyatar David: 'Nightmares Haunt Me Day and Night'", "summary_ja": "2025年10月に738日間のハマス人質生活から解放されたエヴィアター・ダヴィドは、捕虜時代の深刻な心理的トラウマについて語った。CNNとのインタビューで彼は、自分の墓を掘るよう強制された映像を含め、繰り返す悪夢と持続する心的外傷について述べた。彼の証言は、紛争から解放された人質の精神的健康への長期的な影響を浮き彫りにしている。", "summary_en": "Evyatar David, released in October 2025 after 738 days as a Hamas hostage in Gaza, has spoken about the severe psychological trauma from his captivity. In a CNN interview, he described recurring nightmares and persistent haunting memories, including footage of him being forced to dig his own grave. His account highlights the lasting mental health toll on hostages freed from the conflict.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/27/evyatar-david-former-hostage-in-gaza-i-wake-up-at-night-with-nightmares-and-it-haunts-me-all-day-long_6756887_4.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネパールの村が壊滅的な洪水で押し流される", "title_en": "Nepal villages swept away by devastating floods", "summary_ja": "ネパールで壊滅的な洪水が村々を襲い、大きな被害をもたらしている。地元当局によると、米国、英国、マレーシアなど複数国から約400人の観光客が行方不明になっているという。", "summary_en": "Devastating floods have swept through villages in Nepal, causing significant destruction. Approximately 400 tourists from the US, UK, Malaysia and other countries are reported missing according to local authorities.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/video/2026/08/26/video-nepal-villages-swept-away-by-devastating-floods_6756879_4.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省の最新情報", "title_en": "Ministry of Defence Update", "summary_ja": "国防省（Mindef）は2026年8月27日に最新情報を発表しました。読者は防衛関連のニュースや更新情報についてさらに詳しく知るため、ストレーツ・タイムズのニュースレターを購読することができます。", "summary_en": "The Ministry of Defence (Mindef) has released an update on August 27, 2026. Readers can subscribe to The Straits Times newsletters for more defence-related news and updates.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ザ・ストレーツ・タイムズのイブニング・アップデートは、毎日のニュース報道と最新情報を提供しています。読者は出版社のポータルを通じて無料ニュースレターに登録し、購読を管理できます。", "summary_en": "The Straits Times Evening Update provides daily news coverage and updates. Readers can subscribe to free newsletters and manage their subscriptions through the publication's portal.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズのモーニングブリーフィングは、毎日のニュース更新と主要な記事を提供しています。購読者はニュースレターの設定を管理し、ストレーツ・タイムズの追加の無料ニュースレターに登録できます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and key stories. Subscribers can manage their newsletter preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "英国の前代未聞のイスラエル制裁が迫る：英国ユダヤ人コミュニティの対応", "title_en": "Unprecedented UK Sanctions on Israel Expected: British Jewish Community Response", "summary_ja": "英国はイスラエルに対する前代未聞の制裁措置を課す予定であり、英国の外交政策の大きな転換を示唆している。本分析は、英国ユダヤ人コミュニティがこれらの新たな措置にどのように対応する可能性があるかを検証している。", "summary_en": "The UK is poised to impose unprecedented sanctions against Israel, marking a significant shift in British foreign policy. The analysis examines how British Jewish communities are likely to respond to these new measures and their potential political implications.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimgJBVV95cUxOX1ZDZUI4VnZvdUE2ZkE2eHYxN0x5NlNEQXZxQXRMT3ZJYS1PcXF3cDd5eGcxeVAxa2pYUGxxQkNHTE9kdW1DQzg5b3VrWS1mWjR1U0lTcmNneG1lXy13a0p5Mk1nTmhIU2lJdmdaYVZnZ21sRXpTdkVmQS1Pb0lpTE9VZ180WHZ6NEN3U1hxRVBtbXdiOWlVWC1ZUDVSV1ZrQkVlMERMWDY1a0lUWTJubVZXcDg3ejhPdGJHZEUxNnhpSWgyd01ET1ktU1lYLU9oMDJlcDJLZjQ4ekQtcmpMYmtCbTR1azhQdXI0VUpGVEdtaTZGeGVhdVI0UVhUdmFSOFlKVV9lNFhibmR6UnBOTmhOd2NqV1BMSkE?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル当局者、ガザの武装民兵勢力による戦争犯罪の保護を強いられていると主張", "title_en": "Israeli Official Claims Military Deploying Armed Gaza Militias for War Crimes", "summary_ja": "ハアレツの報道によると、イスラエル当局者がイスラエル軍によってガザに配置されたとされる武装パレスチナ民兵勢力を保護するよう圧力をかけられていると述べています。当局者は保護職務を通じて潜在的な戦争犯罪に加担することへの懸念を表明しています。", "summary_en": "A report from Haaretz features statements from an Israeli official describing pressure to protect armed Palestinian militias allegedly deployed by Israel in Gaza. The official expresses concern about being complicit in potential war crimes through their protective duties.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMipwJBVV95cUxNVlJyVlZVeXo4eW5GVU05RGV0Vkd3am9xbDRxQVE4VURpU3F1VG5FTS1jLVBfMG15VVAtNWk0d0YzNlJRelduWlNSZWNrT1ptUnFEYjBrVVoxNkZPNnVyeFdPeHNNaUpob0ZqVzVDMWxVVlFVYnE1MS02S0ZFNVNMdExVbTU5YXdOajE0dVB0Y3lQSFRLNVgyR2dzZUo1WWFyNElqQjRfVWJZREtKX2NrVVc3MWpzclRqUHZGMnI0Vk5sM2xuZmlYUGxIc1ktaXdmcEtvRFQtbm5OeVhwRFAtYm5NLVBvWExVaXNXM1dqU1NjUzZUNWZ1ZlAxa19vaS1TY2J1NmdTTUU1VTRHNlE2c3BGZ1ljZ1o4TGFwVWRHUkQtajU0aGVZ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル左派の青年グループ、ヨルダン川西岸へのキブツ型入植地建設を計画", "title_en": "Israeli leftist youth group plans kibbutz-style settlement in West Bank", "summary_ja": "イスラエルの左派系青年団体が、ヨルダン川西岸へのキブツ型コミュニティ建設計画を発表した。パレスチナ領土への入植地拡大に通常反対する立場を取るイスラエル左派の団体による異例のイニシアチブである。", "summary_en": "An Israeli leftist youth organization has announced plans to establish a kibbutz-style community in the West Bank. The initiative represents an unusual move from the Israeli left, which typically opposes settlement expansion in Palestinian territories.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMioAJBVV95cUxNSzR5bTNvcXhKeXFRNXZSazJGM1BnUmM2S29UQk5CYkhhTjFLN29KaG4tT0JPQ2djc05iY1ZHUndpcUgzd2Z5N09MVVhQZlJWLU02NjhPMUtqclZPbEhuRGxZMDRfSHdET2I1UjZXSERfQzU5aDZSaFdWX1g0Ym1Ma0R1RGQ0OFZrQXEyZXp2VzVqWGdQT3JQbEdJbEJyRHFJSDEyLWJSeDRUZUZUVnhJbnlUUk5CaFk5OUE5eUtnMnZubzluUnZyR09CaUVzbWdtTUFZbkVSR0ZjeUtucGtMYUtRVlJwV1JNSEVORzFQZUMyMnhkdWVtQUltWDV5NzlWalllMlVQMWxZQ2hkNkM5NEVlYUdFMXM1NWN0ZzFJRTY?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Nvidiaサーバーの違法な中国輸出で8人起訴", "title_en": "8 Indicted for Illegally Exporting Nvidia Servers to China", "summary_ja": "米国の輸出規制に違反してNvidiaサーバー機器を中国に違法輸出した8人が起訴されました。本事件は技術密輸と先端コンピューティング機器の規制強化に関する当局の懸念を浮き彫りにしています。米国当局は中国への機密技術の無認可移転を防ぐための取り締まり強化に力を入れています。", "summary_en": "Eight individuals have been indicted for illegally exporting Nvidia server equipment to China in violation of U.S. export control regulations. The case highlights ongoing concerns about technology smuggling and enforcement of restrictions on advanced computing hardware. Authorities are intensifying efforts to prevent unauthorized transfers of sensitive technologies to China.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1VbWhuX25RbTUyZlJOb2dJUE1aUzItU2NzUFhSNGdtbkszMlI1QlNKYkE5QmNhVWpjNDl5anhlcnJ2LUNhX0ZFR3IwNll6RHdoak5VZFp3?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾向け初のF-16V戦闘機2機が輸送中", "title_en": "First Two F-16V Fighter Jets En Route to Taiwan", "summary_ja": "台湾が防衛力近代化の一環として初のF-16V戦闘機2機を受け取ることになった。この最新鋭航空機は、地域の安全保障上の懸念が高まる中、台湾空軍の能力を大幅に強化するものである。", "summary_en": "Taiwan is receiving its first two F-16V fighter jets as part of a defense modernization effort. The advanced aircraft represent a significant upgrade to Taiwan's air force capabilities amid regional security concerns.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE9iLTFXZ0JxaTNsWDJ3SE1YVlFjbHZfdUtZZzJXempfUlA0RVFkN0VQQWRPN2FLeFdKanRpTmhFOFdmN2x4c1VJOUdfbE9UMHJndVlKSnVCaw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フォーカス台湾 - CNA英語ニュース", "title_en": "Focus Taiwan - CNA English News", "summary_ja": "フォーカス台湾は、台湾の公式通信社である中央通信社（CNA）の英語ニュースサービスです。国際的な読者向けに、台湾からのニュースと時事情報を幅広く提供しています。", "summary_en": "Focus Taiwan is the English news service of the Central News Agency (CNA), Taiwan's official news organization. It provides comprehensive coverage of news and events from Taiwan in English for international audiences.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiO0FVX3lxTE9aU2ljbTc1d0Y3alZIY005T0hWTmZOTGpod3pXQU9zbm4yYjhoOXAzdy1WNGlxemk1bVU0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "北海道沖でマグニチュード6.0の地震が発生", "title_en": "M6.0 Earthquake Strikes off Japan's Hokkaido", "summary_ja": "CGTNが報じたところによると、日本の北海道沖でマグニチュード6.0の地震が発生しました。この地震は地震活動が活発な地域で発生しました。深さ、正確な位置、およびその後の影響についての詳細は監視されています。", "summary_en": "CGTN reports that a magnitude 6.0 earthquake hit off the coast of Hokkaido, Japan. The seismic event occurred in a region known for tectonic activity. Details regarding the depth, exact location, and any resulting impacts are being monitored.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-23/news-1PQIO8JHpss/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナミビア、洋上リン鉱石採掘プロジェクトを承認", "title_en": "Namibia Approves Offshore Phosphate Mining Project", "summary_ja": "CGTNによると、ナミビアは議論の多い洋上リン鉱石採掘プロジェクトに環境認可を付与したと報じています。この承認により、世界初の商業的な海底浚渫によるリン採掘事業が実現する可能性が開かれました。このプロジェクトは海洋生態系への環境への懸念と影響に関して大きな議論を生んでいます。", "summary_en": "CGTN reports that Namibia has granted environmental clearance for a controversial offshore phosphate mining project. The approval paves the way for what could become the world's first commercial seabed-dredging operation for phosphate extraction. The project has generated significant debate regarding environmental concerns and impacts on marine ecosystems.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-25/Namibia-clears-way-for-offshore-phosphate-mining-project-1PTBzzBPUgE/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国が支援するがん治療センターがチュニジアで着工", "title_en": "China-aided cancer treatment center breaks ground in Tunisia", "summary_ja": "CGTNによると、中国が支援するがん治療センタープロジェクトが日曜日にチュニジア南東部のガベスで開始されました。このプロジェクトは同地域のがん治療能力の拡大を目指しています。この発展は、北アフリカ全域でのヘルスケアインフラへの中国の継続的な投資を示しています。", "summary_en": "CGTN reports that a China-aided Cancer Treatment Center project was launched on Sunday in Gabes, southeastern Tunisia. The project aims to expand cancer treatment capabilities in the region. This development marks China's continued investment in healthcare infrastructure across North Africa.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-24/China-aided-cancer-treatment-center-breaks-ground-in-Tunisia-1PRwg5ELnXO/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "IAEA事務局長グロッシ、国連は主要ドナーとの信頼を再構築する必要があると述べる", "title_en": "UN Must Rebuild Trust with Major Donors, Says IAEA Chief Grossi", "summary_ja": "TASSが報道したところによると、IAEA事務局長ラファエル・グロッシは国連が主要ドナーとの信頼を再構築する必要があると述べた。グロッシは、米国からの拠出金がなければ国連が効果的に機能を果たすことができないとし、組織に対するドナーの信頼に関する懸念を強調した。", "summary_en": "TASS reports that IAEA Director General Rafael Grossi stated the UN needs to rebuild trust with its major donors. Grossi noted that the UN cannot effectively perform its functions without contributions from the United States, highlighting concerns about donor confidence in the organization.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2178101", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グロッシ氏、国連事務総長に選出されればロシアとの関係は重要になると述べる", "title_en": "Grossi Says Relations with Russia Would Be Serious If Elected UN Secretary-General", "summary_ja": "TASS/RTは、国際原子力機関（IAEA）事務局長ラファエル・グロッシ氏が、国連事務総長に選出された場合、ロシアとの関係は重要になると述べたと報じている。同報道では、グロッシ氏がIAEA在任中にロシアとの良好な協力関係を構築したと主張していることが記されている。", "summary_en": "TASS/RT reports that IAEA Director General Rafael Grossi stated he would maintain serious relations with Russia if elected UN secretary-general. The report notes that Grossi claims to have developed a strong working relationship with Russia during his tenure at the International Atomic Energy Agency.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2178099", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネパールの洪水による死者数が157人に到達", "title_en": "Death toll from Nepal flooding reaches 157", "summary_ja": "TASSは、ネパールの洪水により157人が死亡したと報じています。国営メディアが引用した報道によると、南部のチトワン地区が災害による最多の死者数を記録しています。", "summary_en": "TASS reports that flooding in Nepal has resulted in 157 deaths. According to reporting cited by the state source, Chitwan District in southern Nepal has recorded the highest number of fatalities from the disaster.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2178097", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "『エコノミスト』誌によるアセモグルのAI政策研究への不誠実な批判", "title_en": "The Economist's Flawed Attack on Acemoglu's AI Policy Research", "summary_ja": "著者は、ノーベル賞経済学者ダロン・アセモグルの制度と経済成長に関する研究、およびAI政策への懸念を切り捨てる記事を掲載した『エコノミスト』誌を批判している。同誌は、アセモグルの主張と誠実に対峙する代わりに、カジュアルな会話中の匿名経済学者による無名の批判に依拠しており、不誠実なジャーナリズムを示している。", "summary_en": "The author criticizes The Economist magazine for publishing an article that dismisses Nobel laureate Daron Acemoglu's research on institutions and economic growth, as well as his concerns about AI policy. Rather than engaging substantively with Acemoglu's arguments, the magazine relies on unnamed economists' anonymous criticisms made during casual conversations, demonstrating bad faith journalism.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/economist-attack-on-acemoglu-effort-to-discredit-not-engage-by-eran-yashiv-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Economist’s Embarrassing Proxy War Over AI Policy\nThe disagreements between the Nobel laureate economist Daron Acemoglu and his opponents are consequential—and so are the opponents. But rather than engage in good faith with Acemoglu's arguments, the venerable British news magazine recently stooped to bibulous calumny by unnamed critics of his work.\nTEL AVIV—By publishing a recent article smearing the Nobel laureate economist Daron Acemoglu, The Economist has demonstrated bad judgment, overweening arrogance, and bad faith. The magazine engages with Acemoglu’s academic work disingenuously, quoting the snarky comments of unnamed economists interviewed over drinks to support its argument that his influential research makes sweeping, unfounded claims. Acemoglu’s research linking institutions to long-run prosperity—the work that the Nobel committee honored two years ago—supposedly is little better than glib. And Acemoglu’s pessimism about AI and his preference for steering technological change through public policy rest on dubious assumptions and underestimate AI’s potential economic benefits.", "translation_ja": "", "vocab": [{"word": "bibulous calumny", "definition": "飲酒時の会話から生まれた中傷的な発言。『bibulous』は飲酒関連の、『calumny』は根拠のない悪評を意味する複合表現で、著者がカジュアルな飲食時の発言に基づく批判の信頼性を疑っている。"}, {"word": "disingenuously", "definition": "不誠実に、ごまかして。表面上は正直に見えるが、実は欺瞞的に行為することを示す副詞で、ここでは『エコノミスト』がアセモグルの研究を故意に歪曲して紹介している状況を表現している。"}, {"word": "overweening arrogance", "definition": "過度で傲慢な態度。『overweening』は分不相応で高慢な、『arrogance』は傲慢さを意味し、出版社の自信過剰な編集判断を強く非難する表現。"}, {"word": "glib", "definition": "浅薄で、思慮が浅い。表面的な巧言や誤解を招く簡潔さを指し、アセモグルの学術研究が『エコノミスト』によって過度に単純化されていることを示唆している。"}, {"word": "venerable", "definition": "歴史が古く尊敬される。長年の評判や権威を持つことを示す形容詞で、『エコノミスト』のような由緒あるメディアがかえって不誠実な行動を取ったことを強調するために使用。"}]}, {"title_ja": "民主主義国家は産業政策に真摯に取り組まなければならない", "title_en": "Democracies Must Get Serious About Industrial Policy", "summary_ja": "著者は、西側民主主義国家が経済の戦略的方向性を市場に委ねてしまい、積極的な政府の経済計画に関わる国々との競争で不利な立場にあると主張しています。将来の産業で競争するために、民主主義政府は歴史的に成功してきた制度的専門知識と規律ある産業政策のアプローチを復活させなければならないと述べています。", "summary_en": "The author argues that Western democracies have abandoned strategic economic direction to market forces, putting them at a competitive disadvantage against nations with active government involvement in economic planning. To compete in future industries, democratic governments must revive institutional expertise and disciplined industrial policy approaches that have proven successful historically.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/case-for-democratic-industrial-policy-by-ngaire-woods-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Democracies Must Get Serious About Industrial Policy\nFor decades, Western governments have ceded the strategic direction of their economies to the market. To dominate the industries of the future, they must learn from their own history and rebuild the institutions, expertise, and discipline that effective industrial policy demands.\nOXFORD—Many democratically elected leaders grew up in a world where they were expected simply to referee markets and trust that their country’s firms would prevail. But countries whose leaders still think this way are now losing ground to those where governments play a more strategic economic role.", "translation_ja": "", "vocab": [{"word": "ceded", "definition": "権利や権力を意図的に他者に譲り渡すこと。ここでは西側政府が経済の方向性を市場に譲った状況を表す。"}, {"word": "strategic", "definition": "長期的な目標達成のための計画的で重要な、という意味。経済政策やビジネスにおいて戦略的な決定や方向性を指す。"}, {"word": "prevail", "definition": "競争や争いに勝つこと、優位に立つこと。ここでは国際競争の中で企業が成功することを意味する。"}, {"word": "discipline", "definition": "規律や秩序を保つこと。産業政策において一貫性のある管理や統制を実行する能力を指す。"}, {"word": "dominate", "definition": "特定の分野や市場で支配的な立場を占めること。ここでは将来の産業で優位性を持つことを意味する。"}]}, {"title_ja": "AI ゴールドラッシュにおいて、クラウドが勝者となる", "title_en": "In the AI Gold Rush, the Cloud Wins", "summary_ja": "著者は、AI投資ブームがバブルに終わったとしても、アマゾン、マイクロソフト、グーグルなどの主要クラウドインフラ企業はより強力になると主張している。これらの企業はクラウド市場を独占し、他のテック大手やまだ利益を出していないAI企業に対して競争優位性を保っている。クラウド部門の好調な業績は、AIブームの本当の勝者はAI企業ではなく、インフラストラクチャ提供者であることを示唆している。", "summary_en": "The author argues that despite potential AI investment bubbles, major cloud infrastructure providers like Amazon, Microsoft, and Google will emerge stronger than ever. These companies have cornered the cloud market and maintain competitive advantages over other tech giants and AI startups that are still unprofitable. The cloud division's extraordinary performance demonstrates that the real winners in the AI boom are the infrastructure providers, not necessarily the AI companies themselves.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/cloud-giants-real-winners-of-ai-gold-rush-by-cecilia-rikap-2026-08", "state_media": false, "category": "オピニオン", "full_text": "In the AI Gold Rush, the Cloud Wins\nEven if the AI investment boom turns out to have been a bubble, the Big Tech companies that have cornered the cloud infrastructure market will emerge as strong as ever, or even stronger. That is why Amazon, Microsoft, and Google are in a league of their own, even compared to other giants like Meta and Nvidia.\nLONDON—When Google (Alphabet) reported its latest quarterly results on July 22, investors balked at its negative free cash flow and increased capital expenditures on data centers. But Google is not like OpenAI or Anthropic, which are both still trying to find a profitable business model as they burn through cash. It remains a cloud-computing giant, and its cloud division’s results for the second quarter were nothing short of extraordinary.", "translation_ja": "", "vocab": [{"word": "cornered", "definition": "市場や資源を独占または支配すること。競争相手を排除して市場を支配する戦略的立場を示す。"}, {"word": "capital expenditures", "definition": "企業が施設や設備などの長期資産に投資する支出。将来の収益を生み出すための投資を指す。"}, {"word": "cash flow", "definition": "企業に出入りする現金の流れ。ビジネスの財務健全性を示す重要な指標である。"}, {"word": "bubble", "definition": "実質的な価値に基づかず、投機熱で急速に膨らんだ市場の異常な状態。やがて崩壊する傾向がある。"}, {"word": "infrastructure", "definition": "ビジネスやサービスが機能するために必要な基本的な施設やシステム。クラウドコンピューティングではサーバーやデータセンターを指す。"}, {"word": "extraordinary", "definition": "通常の範囲を大きく超えた、非常に優れた、または驚くべき状態。期待を大幅に上回る成果を表現する。"}]}, {"title_ja": "民主党員が問うべき質問：あなたはこの大統領就任前より良い生活をしていますか？", "title_en": "Democrats Should Ask: Are You Better Off Than Before This Presidency?", "summary_ja": "ロバート・ライヒは、民主党候補者がロナルド・レーガンの有名な1980年の質問を使用して、トランプの政策がいかに関税、エネルギーコストの上昇、医療保険の削減、企業減税を通じて一般的なアメリカ人に害をもたらしたかを強調すべきだと主張しています。彼は、ウォール街の利益が急増する一方で、メインストリートの家族が必需品のインフレに苦しんでいると述べています。", "summary_en": "Robert Reich argues that Democratic candidates should use Ronald Reagan's famous 1980 question to highlight how Trump's policies have harmed average Americans through tariffs, rising energy costs, healthcare cuts, and corporate tax benefits. He contends that while Wall Street profits soar, Main Street families struggle with inflation in essential goods, making the economic case against the Trump administration clear.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/26/democrats-voters-november-elections", "state_media": false, "category": "オピニオン", "full_text": "The midterm elections are already upon us, and every Democrat and independent running against a Republican should ask voters the question Ronald Reagan asked on 28 October 1980, at the end of his televised debate against Jimmy Carter: “Are you better off now than you were before this presidency?”\nUnless you’re very, very rich, the answer is obviously: “No, I’m worse off.”\nStart with his tariffs, which are costing every American household an average of $1,100 annually, according to the Yale Budget Lab. (If you don’t trust Yale, the conservative Tax Foundation estimated last year’s tab to be $1,000 a household.)\nEven cleaning supplies and toilet paper are up at least 5%. Household furnishings, up at least 8%. Clothing, up at least 14%. Trump’s tariffs have also increased the costs of big-ticket items such as cars and made it more expensive to build new homes.\nOther studies find that the tariffs have added as much as 0.7 and 0.5 percentage points to the consumer price index and the personal consumption expenditures price index, respectively.\nThen there’s Trump’s war in Iran, which is driving up energy and food prices, as oil tankers remain stranded in the strait of Hormuz.\nThe war is costing more at the gas pump – about $670 more a household since the war began. Americans face what the Century Foundation and Protect Borrowers describe as “a worsening utility debt crisis”. The groups wrote in an analysis published last month:\n Energy bills have increased three times faster than the rate of inflation while Trump has been president. The national average monthly utility bill reached $280 in early 2026, a 12% increase since the end of 2024, just before the second Trump administration took office.\nWhat’s the Republican response to soaring energy utility prices? Eliminate billions in clean energy subsidies and tilt the scales toward costlier, dirtier fossil fuels.\nAlso driving up the cost of electricity are AI datacenters. They’re also using up huge amounts of water and creating noise pollution. And who’s been pushing these datacenters? Trump and, before recent backlash, many Republicans.\nTrump’s war and the blockage of the strait are also causing fertilizer shortages, which are sending food prices upward. Millions of Americans are now struggling to afford groceries.\nMeanwhile, Trump’s huge tax cuts – which mostly benefited big corporations and the super-wealthy – are being paid for, in part, by Republican cuts to Medicaid and Medicare.\nTrump announced last month that he is ending Medicare subsidies that have kept drug prices low for seniors; Republican cuts to the Affordable Care Act have deprived millions of Americans of health insurance.\nHell, even Trump’s executive order to divide the measles, mumps, rubella vaccine into three shots instead of one is adding burdens to the typical American family.\nAs the Republican senator Bill Cassidy said on ABC’s This Week: “This is why the president’s poll numbers are down, because you’ve lost sight of affordability for the parent. You’ve lost sight of the convenience for the American family. You’ve lost sight of that which is driving higher costs in healthcare – for example, more doctor’s visits … for something which has no rationale in science.”\nTrump’s obsession with gutting the Consumer Financial Protection Bureau has denied Americans billions in foregone rebates and settlements.\nThe regime spent $464m of taxpayer dollars in a no-bid contract for a special fleet of jets intended to deport immigrants. The planes have almost never been used.\nOn and on it goes.\nTrump says the US economy is “doing unbelievably from the standpoint of Wall Street”.\nMaybe, but most Americans live on Main Street and own few if any shares of stock. The richest 1% holds more than half of the value of stocks listed on US stock exchanges; the richest 10%, 92%. Even including retirement accounts, only 16% of adult Americans have assets exceeding $100,000.\nThe stock market boom reflects a boom in corporate profits. The pharmaceutical industry, big oil, and other sectors are posting banner earnings. Second quarter earnings for S&P 500 companies are on pace to rise a remarkable 50% year over year, the highest growth rate since the second quarter of 2021.\nBut average working Americans are struggling to keep their heads above water.\nTrump’s comments about the roaring stock market came the same day that new data showed US consumer sentiment dropped in August. Americans’ outlook on the country’s economic conditions have worsened among Republicans as well as among Democrats.\nThe July jobs report showed the US economy shedding 23,000 jobs, wage growth slowing, and the unemployment rate falling because more people left the workforce.\nMy humble advice to Democratic candidates in the midterms: don’t be distracted. Don’t take the bait and discuss socialism, “wokeism”, or anything else.\nJust ask this simple question: are you better off now than you were before this presidency? And explain how badly Trump and congres", "translation_ja": "", "vocab": [{"word": "tariff", "definition": "政府が輸入品や輸出品に課す税金のこと。国内産業を保護したり、収入を増やすために使われます。"}, {"word": "subsidy", "definition": "政府が特定の産業や事業に与える経済的支援や助成金のこと。通常、政策目標を達成するために使われます。"}, {"word": "consumer sentiment", "definition": "消費者が経済状況や将来の見通しについて感じる心理状態や信頼度のこと。経済の健全性を示す重要な指標です。"}, {"word": "foregone", "definition": "本来得られるはずだった利益やお金を失うこと、または得られずに終わることを意味します。"}, {"word": "no-bid contract", "definition": "競争入札を行わずに、政府が特定の企業と直接契約する取り決めのこと。通常、透明性に関する懸念があります。"}, {"word": "regime", "definition": "政治的な統治体制や政府のこと。この文脈ではトランプ政権を指しています。"}]}, {"title_ja": "マーク・カーニーの冷静な演説がアメリカの権威に異議を唱える", "title_en": "Mark Carney's Measured Speeches Challenge US Authority", "summary_ja": "テッド・ウィドマーは、カナダのマーク・カーニー首相が2026年に2つの重要な演説を行ったと主張し、これは世界政治における根本的な変化を示しているとしている。ダボス演説ではアメリカ主導の世界秩序の終わりを宣言し、8月の演説ではカナダがトランプ政権との貿易交渉からの撤退を静かに発表した。これは、理性的で事実に基づいたリーダーシップがワシントンからの感情的な虚勢に効果的に対抗できることを示している。", "summary_en": "Ted Widmer argues that Canadian Prime Minister Mark Carney has delivered two pivotal speeches in 2026 that signal a fundamental shift in global politics. Carney's Davos speech declared an end to US-led world order, while his August address calmly announced Canada's withdrawal from trade talks with the Trump administration, demonstrating that rational, fact-based leadership can effectively counter emotional bluster from Washington.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/26/mark-carney-speeches-trump", "state_media": false, "category": "オピニオン", "full_text": "Is it perhaps a sign of the times that Mark Carney, the prime minister of Canada, has become a thrilling orator? A sober banker, he speaks calmly, without many vocal inflections. We expect Canadians to be somewhat flat; even a little boring, and yet Carney has already delivered two remarkable speeches in 2026, and the year is far from over.\nThe first, at Davos, described a “rupture in the world order”, and “the end of a pleasant fiction”. By that, he meant that the world could no longer depend on the United States to lead the Pax Americana that has largely kept the peace since the end of the second world war.\nCarney called for a new “geometry”, allowing nations with shared values to align, and asking middle-sized powers to act together, “because if we’re not at the table, we’re on the menu”. The United States, traditionally the leader of the west, was not invited to join. Ironically, the speech was delivered on 20 January, the first anniversary of Donald Trump’s second inauguration.\nThe second speech was a 23-minute address, delivered last Saturday, on 22 August, from a drab government interior in Ottawa. The backdrop was unexceptional, a set of eight Canadian flags, behind a wooden lectern (carved with a maple leaf). There were few rhetorical fireworks. He hardly ever raised his voice.\nYet the speech signaled an earthquake. The news, as widely reported, was that Carney was calling off the trade talks that many expected to resolve or reduce the trade frictions that have been in place ever since Trump slapped his first round of tariffs on Canada, shortly after assuming office.\nThe failure of the talks surely came as a surprise to Donald Trump, who had announced that a deal was imminent. But as is so often the case, US negotiators had undermined their own position with a series of last-minute power moves, bullying the other side.\nIn this way, the failure was reminiscent of the way the Trump administration continues to blow up its own peace deals in the Middle East, by adding new conditions at the 11th hour and making false statements afterwards.\nCarney’s words stung, too. We expect student activists to speak truth to power; it’s a surprise when a former executive of Goldman Sachs and a former governor of the Bank of England takes on the role.\nHe is no bomb-thrower. But no one can deny that his message reached the world; nothing confirms it so much as Trump’s frenzied counterattack on social media. Reading the flurry of puerile insults posted on Truth Social was like watching a punch-drunk boxer throwing sprawling haymakers at an adversary too nimble to be hit.\nIn contrast to Carney’s sober tone, Trump has threatened to rename Lake Ontario “Lake America”, called Canadian officials “clowns”, and dismissed Carney as a “governor” instead of a prime minister, as if contemptuous of Canada’s sovereignty. Of course, he laid the groundwork for Canada’s refusal to cave in as soon as he began his second term with a flurry of claims that Canada should become the 51st state.\nUnlike the easily-rattled president, the prime minister does not traffic in emotion. His speech was notable for its control of the facts and its unshakable moral authority. This was an economist’s speech, full of accounting.\nHe began with greetings in both English and French – a subtle reminder that US attempts to strong-arm Canada into relaxing its protections of the French language were never going to work. He promised to update Canadians on the issues behind the talks, then did just that.\nCarney furnished precise statistics, revealing just how intertwined the US and Canadian economies are (Canada buys more American cars than the UK, Japan and China combined, and supplies 99% of our natural gas imports). In all of these ways, the speech was like a quaint relic from a different era, when leaders were expected to convey the real truth to their people.\nThere was also some solid rhetoric, as the speech gained intensity, and grew positively elbows up by the end. Carney referred to “the storm blowing in from Washington”, in a possible reference to the recent forest fires that darkened the relationship some more.\nThen he announced that Canada would be seeking to diversify its relationships abroad, in what is obviously a new policy, based on a near-total lack of trust in the United States, a nation that blusters so unpredictably on the world stage that it is as if “its signature was written in pencil”.\nCanada is far from perfect; it has faced a threat of secession from Francophone Quebec for generations; and there are new murmurs of secession-talk in Alberta. For centuries it was a “dominion” of the British empire, and not clearly a sovereign nation. But its graveyards are filled with tens of thousands of soldiers who served in the first and second world wars; Canadian resolve should never be underestimated.\nThe loser in this negotiation is, of course, the United States. It’s not just the financial benefits that would have accrued from a successful deal (an", "translation_ja": "", "vocab": [{"word": "rupture", "definition": "断絶や大きな亀裂のこと。国家間の関係や世界秩序における根本的な破裂を指す。"}, {"word": "g
