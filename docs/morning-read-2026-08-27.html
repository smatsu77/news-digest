eometry", "definition": "ここでは国家間の配置や関係の構造を意味する。従来の二項対立ではない新しい国際関係の枠組みを示唆する。"}, {"word": "inflection", "definition": "声の抑揚や調子の変化のこと。話し手の感情や強調を表現する音声の上下動を指す。"}, {"word": "orator", "definition": "説得力のある優れた演説者のこと。公式な場面で効果的に話す能力に長けた人物を示す。"}, {"word": "undermine", "definition": "地道に弱体化させる、信用を失わせるという意味。交渉での自分たちの立場を傷つけることを指す。"}, {"word": "intertwined", "definition": "複雑に絡み合った状態。2つ以上の事柄が深く結びついて分離不可能な状態を表現する。"}, {"word": "moral authority", "definition": "道徳的正当性や説得力。事実と正義に基づく発言者の信頼性と影響力を指す。"}]}, {"title_ja": "ジェド・ヨークの逮捕が露呈するアメリカの不平等", "title_en": "Jed York's Arrest Exposes America's Inequality in Sex Work Laws", "summary_ja": "著者リー・エスコベドは、NFL オーナーのジェド・ヨークが売春勧誘で逮捕された事件が、売春がどのように犯罪化されているかの不平等を明らかにしていると主張している。ヨークは法的代理人を通じて寛容な扱いを受けたが、売春婦、特に女性はより厳しい罰と警察からの暴力に直面している。エスコベドは、差別的な取り締まりを続けるのではなく、脆弱な集団を保護するために売春の完全な非犯罪化を主張している。", "summary_en": "Author Lee Escobedo argues that NFL owner Jed York's arrest for soliciting prostitution reveals systemic inequality in how sex work is criminalized. While York received lenient treatment through legal representation, sex workers—particularly women—face harsher penalties and greater police violence. Escobedo advocates for full decriminalization of sex work to protect vulnerable populations rather than perpetuating discriminatory enforcement.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/sport/2026/aug/26/jed-york-trailer-park-arrest-inequality", "state_media": false, "category": "オピニオン", "full_text": "The Wheat Hill Mobile Home Community sits off state Route 170, on the edge of East Palestine, Ohio, a town most Americans only learned about because a train derailed there in February 2023 and released toxic chemicals into the creek. I grew up in a trailer park like this one, and know the sights. The grid of aluminum boxes in rows. Skirting the color of old teeth, some of it buckled, some patched with a piece of lattice. The window units huff and puff in August, dripping dark condensation on to the gravel.\nI’m sure there were drugs on my street. I’m sure somebody was selling sex. I never saw it. What I saw were families raising kids in 800 square feet and people the country had already written off, living next to each other and mostly getting along.\nThat’s the kind of place where police arrested San Francisco 49ers owner Jed York on the morning of 23 August.\nAgents with the Mahoning Valley Human Trafficking Task Force posted an undercover ad on a website known for prostitution. York answered it and agreed to pay a woman just $160 for sex, according to court records. There was no woman waiting for York. Dan Haueter, an East Palestine detective on the taskforce, described the method to the Ohio attorney general’s office in 2024: post an advertisement for sex online, negotiate a price with a prospective customer and arrange to meet in East Palestine. The sting worked because it’s based on real life. York carried the glowing phone he used to set the bargain to the trailer park, where officers took him into custody.\nPolice booked York on two counts: engaging in prostitution – which was later reduced to disorderly conduct – and possessing criminal tools (in this case, his cellphone). York pleaded no contest to the charges and was sentenced to two days in jail to be served concurrently and fined $1,150.\nOhio charges buying sex from an adult as a first-degree misdemeanor and sends the buyer to an education program. Selling is a third-degree misdemeanor. So the statute is harder on the buyer. But it helps a buyer like York if he can pay a high-powered lawyer to work on his case. York ended up pleading the count down to disorderly conduct.\nYork is not the first NFL owner to find themselves in a situation like this. Florida prosecutors charged New England Patriots owner Robert Kraft in 2019 with soliciting prostitution at the Orchids of Asia spa in Jupiter, part of what police billed as a major human trafficking investigation. His lawyers challenged the hidden-camera warrants and won, and the state dropped the charges in September 2020. By then, an assistant state attorney had already told the court the investigation turned up no human trafficking. Prosecutors pressed ahead against four Chinese women who worked at Orchids of Asia instead. The women didn’t receive the same breaks. Instead, they received criminal records and about $45,000 in fines.\nNationwide, women account for nearly 64% of adult prostitution arrests. Rebecca Pfeffer, assistant professor of criminal justice at the University of Houston – Downtown, studied about 23,000 prostitution cases in Harris County, Texas, and found that police arrested and jailed men less often than women. The women who landed in jail stayed there longer.\nMy mom could support us because nothing on her record stopped her. Put a prostitution conviction on a woman two lots down, and the background check keeps her unemployed and desperate.\nThe NFL’s personal conduct policy is blunt about how owners should conduct themselves. The policy claims to hold owners to a higher standard than anyone else in the league, with stiffer consequences to match. A league spokesperson says York’s case will be reviewed under that policy. Kraft drew no discipline from the NFL after Florida dropped his charges in 2020. Owners write the rules, and the NFL commissioner they hire and pay enforces them. A standard like that lasts exactly as long as the owners want it to.\nBut expecting those owners to hold themselves accountable is wishful thinking. The York situation would be less absurd if the US decriminalized the entire transaction for all parties.\nThe ACLU reviewed the empirical research on how criminalization affects sex workers and found that police are a bigger threat to sex workers than clients are. Additionally, researchers from the Johns Hopkins Bloomberg School of Public Health surveyed 250 women and found that 22% had suffered violence from a client in the previous three months, while 78% had endured at least one abusive encounter with police. The numbers cover different time spans, so they aren’t a clean comp. But they make the same point. The police sent to protect women are also a danger to them. In that same cohort of women, 70% had been locked up for more than three days, an average of 15 incarcerations apiece.\nKate Shannon, associate professor of medicine at the University of British Columbia, and her colleagues looked at 87 studies and concluded that over the course of a decade, decriminali", "translation_ja": "", "vocab": [{"word": "decriminalize", "definition": "犯罪として扱うことをやめること、または法律から違法性を削除すること。特に特定の行為や物質に対して使用される。"}, {"word": "misdemeanor", "definition": "重罪よりも軽い犯罪行為。通常は懲役1年以下の刑罰が科される。"}, {"word": "empirical", "definition": "実験や観察などの経験的証拠に基づいた、理論ではなく実際の事実に基づいた。"}, {"word": "soliciting", "definition": "特定の行動や応答を求めたり、勧誘すること。法律では違法な行為を誘い込むことを指すこともある。"}, {"word": "enforcement", "definition": "法律や規則を実施し、それが遵守されるようにすること。"}, {"word": "cohort", "definition": "統計調査や研究で、同じ時期に同じ経験をした一群の人々。"}]}, {"title_ja": "アメリカはより多くの核兵器を必要としない", "title_en": "America Doesn't Need More Nuclear Weapons", "summary_ja": "著者は、中国の核兵器増強とロシアの戦術核兵器の優位性にもかかわらず、米国の核兵器増強に反対する立場を示している。新しい兵器導入の代わりに、危険な軍拡競争とエスカレーション動態を引き起こす可能性のある核兵器よりも、既存の戦略的核戦力と通常兵器能力の近代化に焦点を当てるべきだと主張している。", "summary_en": "The author argues against expanding the U.S. nuclear arsenal despite China's weapons buildup and Russia's theater nuclear advantage. Instead, the U.S. should focus on modernizing existing strategic forces and conventional capabilities rather than introducing new weapons that could trigger dangerous arms races and escalation dynamics.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/america-doesnt-need-more-nuclear-weapons", "state_media": false, "category": "オピニオン", "full_text": "How many nuclear weapons is enough? The question has haunted policymakers and scholars for 80 years. Early in the Cold War, the United States expanded its nuclear arsenal rapidly in response to the Soviet threat. But beginning in the 1980s, as the two nuclear powers sought ways to reduce nuclear risks, arms treaties helped cut the size of those arsenals significantly, and stockpiles decreased by 80 percent. Now, circumstances are pushing the United States to consider the size of its nuclear arsenal once again. Over the past six years, China has nearly tripled the number of nuclear weapons it has, and according to the U.S. Defense Department, the country is on track to have over 1,000 by 2030. China is not yet a nuclear peer to Russia and the United States, which each deploy roughly 1,550 nuclear weapons in keeping with the limit set by the 2010 New Strategic Arms Reduction Treaty, but parity may be Beijing’s goal. Meanwhile, the last formal barrier to a U.S.-Russian arms race fell away when New START expired earlier this year.\nFaced with these rising dangers, the Trump administration announced in March that it would conduct what it called a “nuclear strategy review.” Some strategists recommend that the review include a call for a larger and more diverse nuclear arsenal. A larger arsenal, proponents of expansion argue, would provide the United States with a wider array of choices, especially for an in-kind response to low-yield theater nuclear attacks. Although Russia and the United States have nearly the same number of weapons, Russia possesses a greater number of theater nuclear weapons, which, unlike strategic nuclear forces, are designed for tactical use on the battlefield. China may also be developing more of these types of weapons. Advocates of expansion propose that if Washington can match any nuclear attack blow for blow, Beijing and Moscow will be less likely to initiate a nuclear exchange. According to Trump administration officials, the nuclear review will look at this “theater nuclear forces issue” to “identify where there may need to be changes or additions made.”\nThe United States should take additions to its nuclear forces off the table. The country already has a vast and diverse enough supply of nuclear weapons to unleash devastation on an adversary in the case of a nuclear attack. The purpose of nuclear deterrence is not to have an answer for every weapon in an adversary’s arsenal, but to avoid crossing the nuclear threshold in the first place. Moreover, introducing new theater weapons could provoke an arms race for which the United States is ill equipped and invite risks of inadvertent escalation that would only make the country more vulnerable. Rather than focus on expanding and diversifying the U.S. nuclear arsenal, Washington’s deterrence strategy should attend to the modernization of its existing strategic forces, which is behind schedule, and of its conventional arms, which are not fit to deter the United States’ greatest military threats, especially Chinese military aggression in the Western Pacific.\nMAXED OUT\nWhen the foundations of U.S. nuclear doctrine were laid early in the Cold War, escalation was understood as a ladder. When states encountered crises, their retaliatory actions would follow a vertical climb to more dangerous “rungs.” But escalation is unlikely to follow such a neat path, as Undersecretary of Defense for Policy Elbridge Colby argued in May; instead, as he said, there are ways that nuclear powers can shape “the limits of a conflict” and influence how their opponents respond. The goal for modern U.S. nuclear doctrine, therefore, should not be an abstract conception of superiority at all levels of the escalation ladder but practical options to constrain and deter the adversary. The proposal to introduce new theater nuclear forces in Asia or Europe follows the outdated logic that escalation will progress in a rational, orderly way with increasing levels of violence and harm. It does not follow modern reality.\nWithout arms controls in place, Washington does need to modernize its strategic nuclear forces—high-yield weapons whose purpose is to hold valuable targets at risk—to deter and defend against a nuclear attack on the American homeland or on U.S. allies’ territory. It has been trying to do so for years, since the U.S. Senate ratified New START in 2010, but with mixed results. As part of a deal to gain Senate support for the treaty, U.S. President Barack Obama approved a multidecade program to upgrade the existing nuclear arsenal and delivery systems that is now costing at least $1 trillion. The decision paved the way for defense contractors and national laboratories to begin replacing bombers, ground-based intercontinental ballistic missiles, submarines, warheads, and military communications systems.\nMore than 15 years later, most of the United States’ nuclear modernization efforts are over budget and behind schedule, despite significant investments in workforce, i", "translation_ja": "", "vocab": [{"word": "parity", "definition": "同等の状態または力の均衡。特に国家間の軍事力や兵器数の同等性を指す。この文脈では中国がロシアと米国と同等の核戦力を持つことを意味する。"}, {"word": "deterrence", "definition": "抑止または防止の政策。特に軍事用語として、敵が攻撃を仕掛けないように強力な報復能力を示すこと。"}, {"word": "escalation", "definition": "段階的な増加または拡大。紛争の文脈では、衝突がより危険または暴力的な段階へ進むことを指す。"}, {"word": "arsenal", "definition": "兵器や弾薬の貯蔵庫、または保有する兵器の総称。国が保有する核兵器などの総合的な戦力を表す。"}, {"word": "doctrine", "definition": "政策や戦略の基本となる原則や教義。国家の軍事政策や行動の根拠となる考え方の体系。"}, {"word": "modernization", "definition": "近代化または最新の技術を取り入れること。既存の兵器システムを最新技術で更新・改善するプロセス。"}]}, {"title_ja": "ウクライナの「ドローン民主主義」の未来", "title_en": "The Future of Ukraine's Drone Democracy", "summary_ja": "ウクライナのドローン中心戦への転換により、市民社会が予期せず権限を持つようになり、新たな政治的ダイナミクスが生まれた。これはゼレンスキー大統領による国防相フェドロフの解任に対する大規模な抗議デモで実証されている。分散型の技術駆動型防衛戦略により、より多くの民間人が国家安全保障問題に参加する機会を得て、戦時中であってもリーダーシップと有権者の関係を根本的に変えた。この転換は従来のウクライナ政治から大きく逸脱し、継続的な紛争下であっても民主的説明責任に長期的な影響を与える可能性を持っている。", "summary_en": "Ukraine's transition to drone-centered warfare has unexpectedly empowered civil society and created new political dynamics, as demonstrated by recent mass protests against President Zelensky's firing of Defense Minister Fedorov. The decentralized, technology-driven defense strategy has expanded civilian participation in national security matters, fundamentally altering the relationship between leadership and electorate during wartime. This shift represents a significant departure from previous Ukrainian politics, with potential long-term implications for democratic accountability even amid ongoing conflict.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/future-ukraines-drone-democracy", "state_media": false, "category": "オピニオン", "full_text": "On August 19, the Ukrainian parliament voted overwhelmingly to confirm Ukraine’s new defense minister, ending weeks of uncertainty at a crucial phase of the war. For more than a month, Ukrainians had taken to the streets of Kyiv and other cities to protest President Volodymyr Zelensky’s firing of Defense Minister Mykhailo Fedorov. His successor, Yevhenii Khmara, is a special operations officer, best known for leading Operation Spider’s Web, the successful attack on Russian strategic bombers deep inside Russia.\nBut the political fallout from this summer’s upheaval is not over. The removal of Fedorov, whom many Ukrainians considered highly effective, set off a series of decisions by Zelensky to reshuffle the cabinet, and more consequentially, the heads of military and law enforcement agencies. Shortly after dismissing his defense minister, Zelensky sought to quell the public backlash by also firing Oleksandr Syrsky, the unpopular commander of the armed forces. As a result, the president was simultaneously replacing the two figures—the defense minister and the head of the military—officially responsible for Ukraine’s defense against Russia. That this was happening at the very moment Ukraine was gaining the advantage on the battlefield has made the changes all the more fraught.\nFor one thing, the large-scale protests themselves mark a new stage in Zelensky’s relationship to the electorate. Unlike any previous protests since the full-scale invasion, Ukrainians directly challenged the president’s handling of the war, introducing a dynamic that is unlikely to go away. Perhaps even more consequential, on the eve of the parliament’s vote on Fedorov’s successor, Fedorov released a controversial video address in which he declared that Ukraine needed a “system reboot” and called for wartime elections—the first time that not merely a prominent Ukrainian figure but a member of Zelensky’s inner circle and one of his former closest allies had done so. Until now, most Ukrainians have dismissed the prospect, since elections cannot be held while the country is under martial law.\nAmid these developments, something else has become increasingly clear: one of the unforeseen consequences of Ukraine’s transition to drone-centered warfare has been the expansion of civil society in new ways. The embrace of a decentralized, technology-driven defense strategy has required new forms of cooperation between military and civilians, giving far more people a stake in matters of national security and military strategy. And that has created a new reality for the country’s leadership.\nA DIFFERENT WAR\nA crucial factor driving the events of this summer is the evolution of the military confrontation with Russia into a drone war. This reality, which began to take hold in 2024, has accelerated Ukraine’s transition from foreign-supplied to domestically produced weapons: some 95 percent of drones are now assembled inside the country. Moreover, although Ukraine remains heavily reliant on its scarce supply of American interceptors to defend against ballistic missile attacks, it is far less dependent on foreign systems and intelligence than it was at the start of the war. The shift to a drone-centered battle space has fundamentally altered combat tactics, the expertise required of soldiers, and the way arms are purchased. It has also rendered some kinds of legacy systems, such as armored vehicles and short-range artillery, increasingly obsolete.\nYet it is not the drones themselves that have made the shift so dramatic. To exploit the full potential of unmanned warfare, Ukraine has adopted an integrated digital architecture linking unmanned platforms with situational inputs and intelligence. It has also pursued an unprecedented level of digital coordination, as well as decentralized production and procurement of weapons and of digital technologies themselves. Fedorov was one of the key architects behind the deployment of this drone infrastructure. Unlike many other officials or military leaders, he not only possessed an acute understanding of the battlefield, the weapons deployed in it, and the data streaming from it, but he also had the ability to build, coordinate, and continually upgrade a comprehensive digital system to manage it.\nAlthough he served as defense minister for only six months, Fedorov had driven this shift as the head of the Ministry of Digital Transformation, a government agency he created in 2019 and ran until 2026. Drawing on a team of specialists, the agency had set out to replace traditional bureaucratic procedures across government with more efficient digital platforms; a secondary goal was reducing corruption. After Russia’s full-scale invasion, Fedorov’s team became a driving force within the government for Ukraine’s drone program. Since the acquisition of drones initially fell outside formal procurement, the agency was able to largely run the process through its own “Drone Line” initiative. At the same time, it began building a ne", "translation_ja": "", "vocab": [{"word": "decentralized", "definition": "中央集権的でなく、分散された権力や管理体制のこと。複数の拠点や個人が独立して機能する仕組みを指す。"}, {"word": "procurement", "definition": "必要な物資や兵器などを調達・購入すること。特に政府や軍が物資を正式に取得するプロセスを意味する。"}, {"word": "fraught", "definition": "困難や危険性を多く含んだ状態。緊張や不安に満ちた状況を表す形容詞。"}, {"word": "integrated", "definition": "異なる要素や部分が統合され、一つのシステムとしてまとまっている状態。"}, {"word": "unprecedented", "definition": "これまでに例がない、前代未聞の状況やレベル。新しい形式や規模を示す。"}, {"word": "martial law", "definition": "戦争や非常事態時に軍隊が統治権を行使する法制度。通常の法律の代わりに軍事法が適用される。"}]}, {"title_ja": "トランプ後の新右翼の大戦略", "title_en": "The New Right's Grand Strategy After Trump", "summary_ja": "新右翼の知識人グループは、普遍的原則ではなく地理的領土、共通の祖先、キリスト教に基づいて西欧を定義する「文明主義」を新しい米国の大戦略として推し進めている。このアプローチは米国を西欧の覇権国として位置付け、自由主義的国際主義と従来の抑制主義の両方に反発している。トランプの現在の外交政策は純粋な文明主義から逸脱しているが、人口動態とイラク戦争への反対が今後の共和党政権で新右翼の影響力を強める可能性がある。", "summary_en": "The New Right intellectual movement is advancing 'civilizationism' as a new U.S. grand strategy that defines the West by geographic territory, shared ancestry, and Christianity—rather than universal principles. This approach aims to establish bounded civilizational spheres with the U.S. as Western hegemon, rejecting both liberal internationalism's universal ambitions and traditional restraint doctrine. While Trump's current foreign policy diverges from pure civilizationism, demographic trends and opposition to Middle East interventions position the New Right to gain influence in future Republican administrations.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/new-rights-grand-strategy-after-trump", "state_media": false, "category": "オピニオン", "full_text": "The debate about American grand strategy has long been shaped by familiar schools of thought: restraint, liberal internationalism, and primacy. But the intellectual movement that provided the ideological fuel for U.S. President Donald Trump’s rise to power, the New Right, is forging a new contender: call it “civilizationism.” References to Western civilization permeate strategy documents and speeches by key members of the administration. Vice President JD Vance set the tone in his February 2025 speech at the Munich Security Conference, stressing the “threat from within” to the fundamental values that characterize “our shared civilization.” The Trump administration’s National Security Strategy warned of “civilizational erasure.” This January, at Davos, Trump emphasized “the bonds we share with Europe as a civilization”; the next month, Secretary of State Marco Rubio called on the United States’ transatlantic partners to “renew the greatest civilization in human history.”\nThe notion that there is a Western civilization and that it is superior is, of course, not new. But the concept of the West espoused by the New Right—and how that concept ought to guide U.S. grand strategy—is fundamentally different from how most had previously understood it. It is not based on a creedal understanding of Western identity as rooted in a shared set of principles that anyone, regardless of origin, can espouse, such as constitutional democracy, liberty, and equality. Instead, for thinkers on the New Right, the West is defined by a specific geographic territory, a shared ancestry, and Christianity.\nExtended to the realm of foreign policy, this reimagination of the foundations of Western civilization demands a new and distinct grand strategy. Civilizationism is still a work in progress. Writings on foreign policy by New Right thinkers are limited, and the camp is internally divided. But by examining those texts and following the movement’s domestic ideas to their logical conclusion, it is possible to discern a distinct worldview. Civilizationists would aim to structure the world along bounded civilizational spaces, each dominated by a hegemon. They believe the United States is rightfully the hegemon of the West, dedicated to defending the civilization’s borders, urging Europe to uphold purported Western values, and pursuing coexistence with other civilizations, such as the Chinese, rather than aspiring to global leadership. They reject the universal ambitions of primacy and the constraints imposed on U.S. sovereignty by liberal internationalism. Civilizationism also differs from restraint, requiring dominance over the Western Hemisphere, by military intervention if necessary. And unlike realist visions that justify a great power’s control over its backyard by pointing to its legitimate security interests, civilizationism offers an ideological justification for spheres of influence and their boundaries.\nDespite the Trump administration’s embrace of civilizational rhetoric, in practice its foreign policy diverges from what civilizationism would advocate and many of Trump’s own backers hoped he would pursue. Even if Republicans win the White House again in 2028, that would not mean civilizationism will become U.S. grand strategy; the New Right would also have to prevail over the party’s establishment faction. But at least two factors seem to favor the New Right in the intraparty battle. One is demographic: most polling shows a generational divide among Republicans, with younger voters more supportive of positions such as scaling back the U.S. role in the Middle East and retreating from viewing China as a major threat. The other is Trump’s war on Iran. As the consequences of this strategically catastrophic campaign become ever more apparent, the New Right’s clout is set to grow, having opposed the war from the start.\nA NEW BLOB IN TOWN\nFor decades, Washington’s foreign policy establishment advocated for different varieties of liberal hegemony. Even during Trump’s first term, traditional foreign policy elites exercised great influence and maintained relative policy continuity abroad. But Trump’s second term has fundamentally disrupted the intellectual consensus that long governed foreign policy debates, bringing the New Right into the discussions that shape U.S. strategy. This movement is composed of various factions, as Laura Field has distilled in her authoritative work Furious Minds. The postliberals want to enforce a Catholic conception of the common good and morality. Idolizing the American founding, the Claremonters propose radical, counterrevolutionary action to restore government by consent, shatter the administrative state, and cultivate civic virtue. The national conservatives embrace Christian nationalism and seek to bulwark the homogeneous nation-state from threats from liberalism.\nWhat unites these disparate camps is a rejection of core tenets of traditional conservatism, such as limited government, neoliberal economics, a", "translation_ja": "", "vocab": [{"word": "civilizationism", "definition": "文明主義。特定の文明（地理的境界、共通の祖先、宗教で定義される）を基盤に国家の外交政策を展開する戦略的枠組み。"}, {"word": "hegemon", "definition": "覇権国。特定の地域や国際システムにおいて支配的な力を持つ国家。文脈では米国が西欧の指導的立場を保つことを指す。"}, {"word": "creedal", "definition": "信条に基づいた。特定の共有された信念や原則（例：民主主義、自由）に基づいているという意味。"}, {"word": "primacy", "definition": "優位性。国際関係において一国が他国より優れた地位や影響力を持つ状態。米国の世界的指導力を指すことが多い。"}, {"word": "intraparty", "definition": "党内の。同じ政党内における派閥や勢力間の対立や競争。ここでは共和党内の新右翼と主流派の争いを指す。"}, {"word": "intellectual consensus", "definition": "知識的合意。外交政策分野の専門家や指導者の間に長年存在していた共通の見方や戦略的方針。"}, {"word": "spheres of influence", "definition": "勢力圏。ある国が政治的・経済的・軍事的に支配的な影響力を持つ地理的領域。文明主義では各文明の覇権国が支配する地域を指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-27 00:22 JST";
  renderTabs();renderList();
})();
</script>
