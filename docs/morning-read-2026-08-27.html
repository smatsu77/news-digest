gory": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "チベット・ギロン地域で土砂崩れによる大量の死傷者を報告", "title_en": "Tibet's Gyirong Region Reports Major Casualties From Mudslide", "summary_ja": "中国国営通信社新華社によると、チベット・ギロン地域で発生した土砂崩れにより大量の死傷者が出ている。同山岳地域における重大な災害である。被害者数と影響を受けた地域の詳細は、救助活動が続く中で明らかになる見通し。", "summary_en": "A mudslide in Tibet's Gyirong region has caused major casualties, according to reports from China's state news agency Xinhua. The incident represents a significant disaster in the mountainous area. Further details about the number of victims and affected areas are expected as rescue operations continue.", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMisAFBVV95cUxPVVV5M1FBbWFmZlRFcGxHdkJPVFVwSFJ6RXNmYldLU0JQazdDZlVtZlY3UnlaX3JwQ2wtczBGQ1VnekRXMWtqNzg5Q1ZuMzM4ZDd6SVFGMTFEbFFiZWJWdDlURk9veWJKdXZJaDM3U3draktOdTBqSmtBM21lcVA0SnVXOW90X2pMR1psUUdRTDBuS0poWVVjd1FQcVhKVGsxendNaHVFLWdSX1dhcklLeA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "心、希望、そして鋼のような決意：ドリー・パートンの音楽的遺産", "title_en": "Heart, Hope and Steely Determination: Dolly Parton's Musical Legacy", "summary_ja": "ドリー・パートンの象徴的な1980年のヒット曲『9 To 5』は彼女の唯一のアメリカ・ナンバーワン・ソロ曲となり、働く女性たちの賛歌となりましたが、彼女の陽気な歌唱スタイルのため企業文化への強力な批評はしばしば見落とされています。キャリアを通じて、パートンはビジネスの手腕を示し、特にエルビス・プレスリーの出版権要求を拒否し、後にホイットニー・ヒューストンのバージョンから莫大な利益を得ました。彼女の音楽を大切にし、自分の権利のために立ち上がるという揺るがぬ決意は、テイラー・スウィフトのような未来のアーティストにクリエイティブな権利を守るよう影響を与えています。", "summary_en": "Dolly Parton's iconic 1980 hit '9 To 5' became her only US number one solo song and an anthem for working women, though her powerful critique of corporate culture is often overlooked due to her cheerful delivery. Throughout her career, Parton demonstrated fierce business acumen, notably refusing to surrender publishing rights to Elvis Presley and later profiting enormously from Whitney Houston's version of 'I Will Always Love You.' Her steadfast determination to value her music and stand up for herself has inspired future artists like Taylor Swift to protect their creative rights.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c74k8zwvez0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Heart, hope and a steely determination: Dolly Parton's musical legacy\n- Published\nIn 1980, Dolly Parton was filming her first Hollywood movie, 9 To 5, and between scenes she had an idea for the tune that would become the movie's theme song.\nBut her guitar was banned from the set - so she made the beat by strumming her acrylic nails together.\nThe sound, she realised, was just like the typewriter used by her character, a married secretary who is constantly belittled and sexually harassed by her boss.\nExcited, she ran over and sang the song to her co-stars Lily Tomlin and Jane Fonda, who was also the film's producer.\n\"Lily and I looked at each other and we had goosebumps,\" Fonda said. \"And we knew, this is not just a movie song, this is an anthem.\"\n- How Dolly Parton told her life story through six iconic songs \n  - Published1 day ago\nReleased in November 1980, 9 To 5 became Parton's only US number one as a solo artist, and earned her an Oscar nomination for best song.\nShe loved to tell the fingernail story, but 9 To 5 has another legacy - for its powerful statements about working life and women's place in the corporate world.\nYou can probably sing the hook off the top of your head. \"Working 9 To 5 / What a way to make a living!\" It's jaunty and catchy. The sentiment is universal. Work sucks.\nBut dig deeper and Dolly's expressing real fury.\n\"It's a rich man's game, no matter what they call it / And you spend your life putting money in his wallet,\" she sings. \"They just use your mind and they never give you credit.\"\nThe lyrics tapped into real frustrations and gave working women a voice.\nBut there's a reason why you might not have noticed the anger that fuels Dolly's song. She simply doesn't sing it that way - even though she had every right to, having navigated the sexism of the music industry from the age of 13.\nHer early breakthrough came in 1967 when she was hired as the \"girl singer\" on The Porter Wagoner Show, a TV showcase for country singer Porter Wagoner that reached millions of viewers each week.\nTogether, they released 21 hit duets including Just Someone I Used to Know, If Teardrops Were Pennies and Please Don't Stop Loving Me.\nBut as Parton's star rose, she began to outshine her co-star. Eventually, she realised she needed to strike out as a solo artist – writing I Will Always Love You as a letter of apology to her former mentor. He responded by suing her for breach of contract in 1979, demanding $3m (£2,2m).\nWanting to avoid a lengthy court battle, Parton settled for about $1m.\n\"I made up my mind that if he could live with it, I could live without it,\" she wrote in her autobiography. \"I suppose Porter has done all right with it. I am neither his conscience nor his accountant.\"\nIt was typical of the star's ability to radiate cheery goodwill that she never held a grudge against Wagoner, always crediting him with giving her a crucial career break, even after their relationship fell apart.\nNobody's fool\nBut she was nobody's fool. Take, for example, the battle over the rights to I Will Always Love You.\nAfter it hit number one in the country charts, Elvis Presley called – he loved the song and wanted to record a cover.\n\"You cannot imagine how excited I am about this,\" she told him. \"This is the greatest thing that's ever happened to me as a songwriter.\"\nBut the night before the recording session, his notoriously hard-nosed manager, Colonel Tom Parker, called Parton and told her Elvis wouldn't record the song unless she handed over half of the lucrative publishing rights.\n\"I said, 'Well, that throws a new light on this. Because I can't give you half the publishing. I'm gonna leave that to my family,'\" Parton told Reba McEntire's podcast in 2020.\n\"And he said, 'Well, then we can't do it.' And I cried all night.\"\n\"I mean, it was like the worst thing,\" she told Country Music Television. \"People were saying, 'You're nuts. It's Elvis Presley. Hell, I'd give him all of it.'\n\"I said, 'I can't.' I always wondered what it would sound like. I know he would have killed it [in a good way].\"\nBut Parton had the last laugh.\nWhen Whitney Houston recorded her blockbuster version of I Will Always Love You for The Bodyguard soundtrack in 1992, the country star still owned the rights and earned \"enough money to buy Graceland\", Presley's mansion.\nInstead, she invested the money in a black neighbourhood in Nashville, Tennessee, saying she thought it was an apt way to honour Houston's legacy.\nThat determination to stand up for herself, and to value her music as more than just a commodity, is an essential part of Parton's legacy.\nWithout her example, would Taylor Swift have stood up to the hedge funds who bought her back catalogue, re-recording her biggest hits to rob them of royalties?\nPerhaps not – but either way, Dolly approved.\n\"Smart!\" she said when asked about Swift's masterplan. \"She's so smart, she's so great, she's genius. I mean really, look at what she's doing! That's amazing!\"\nMourning Parton's death, Swift acknowled", "translation_ja": "", "vocab": [{"word": "breach of contract", "definition": "契約違反。契約で定められた義務を果たさないこと。法的な訴訟の根拠となる。"}, {"word": "publishing rights", "definition": "出版権・著作権。著作物の出版や販売による利益を得る権利。音楽業界では著作権料の配分に重要。"}, {"word": "lucrative", "definition": "利益が大きい、儲かる。金銭的に魅力的で収益性が高いことを表す。"}, {"word": "radiate", "definition": "放出する、発散する。ここでは好意や善意が自然に周囲に伝わることを意味する。"}, {"word": "acumen", "definition": "洞察力、才能。特にビジネス面での鋭い判断力と実務的な能力を指す。"}, {"word": "commodity", "definition": "商品、日用品。商業的価値を持つ交換可能な物質やサービス。"}]}, {"title_ja": "パキスタンの病院火災で14人の乳児が死亡、目撃者が扉がロックされていたと証言", "title_en": "Door was locked at Pakistan hospital where fire killed 14 babies, witnesses say", "summary_ja": "パキスタンの首都イスラマバードの大型病院の産婦人科病棟で火災が発生し、現場にいた15人の乳児のうち14人が死亡した。目撃者らは病棟の扉がロックされており、火災発生から数時間後に救助隊が到着したと主張しており、安全対策と職員の対応について疑問が生じている。", "summary_en": "A fire broke out in the maternity ward of a major hospital in Islamabad, Pakistan, killing 14 infants out of 15 present. Witnesses claim the ward door was locked and rescue teams arrived hours after the blaze started, raising questions about safety protocols and staff response.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/czdz13elezlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Door was locked at Pakistan hospital where fire killed 14 babies, witnesses say\n- Published\nIt was just after dawn on Wednesday morning at a maternity ward in the Pakistani capital when a horrific blaze erupted.\nIt would go on to kill 14 infants as parents say they waited hours for help to arrive.\nHivsa Walid was near the room at the Pakistan Institute of Medical Sciences (PIMS) hospital with her sister-in-law, who had given birth days earlier. She initially heard a shout and thought a patient had died - but then she saw smoke.\nThe pair fled with the baby, who is so small she does not yet have a name.\n\"We didn't even think about our belongings. We just grabbed the baby and rushed downstairs.\n\"Some patients had delivered their babies just that night. I don't even know how we managed to get down - it was all a blur.\"\nThe fire broke out in an air-conditioning unit on the third floor of the mother and child unit at PIMS, one of the main state-run hospitals in Islamabad. Only one of the 15 babies present was saved.\nKhurram Mehmood, 40, told AFP news agency there was a long wait for rescue workers. \"I lost my daughter. She was only three days old,\" he said.\nJaweria, the mother of another victim, told AFP news agency the door to the maternity ward was locked.\n\"For two hours I kept crying and wailing,\" she said. \"Police arrived after four hours and said they are here to investigate.\"\n\"Why did the doctors leave the children there?\" she asks.\n\"To hell with you, rescue team and police. Babies burnt to death there, but nobody could save them.\"\nRana Imran Sikander, the hospital's executive director, told the BBC the ward's door was not locked but was manned. He cited the need to protect babies from being stolen, something that has happened before at government hospitals.\nWalid suggested PIMS's safety protocols were inadequate, despite it being a major hospital. \"There should have been fire extinguishers and protocols, but no one was doing anything - everyone was just running.\"\nThe father of a baby who died told Reuters he had been visiting the ward for eight days and the building had \"no fire security, no proper exits\".\n\"All doors were closed, only one door was for us to visit our children. They kept the other doors locked because they feared we would come to see our children too often.\"\nSeveral eyewitnesses have claimed duty staff were not around.\nPeople had to \"break the door down\" and rescue teams were forced to smash the windows to control the flames, a witness who did not give her name told AFP.\nAbdul Ghafoor, another witness, told AFP he tried to get into the building to rescue patients but couldn't reach the maternity ward.\n\"There was thick black smoke inside and patients were trapped,\" he said. \"Rescue teams arrived after almost two hours.\"\nIslamabad's Chief Commissioner Sohail Ashraf said rescue teams reached the scene \"immediately\" after the emergency call was first made, according to AFP.\nPIMS is one of the biggest hospitals in Pakistan's capital, with 156 beds in its maternal and child health unit.\nThe country has dealt with a number of major fires in recent years, with poor safety laws, building codes and lax enforcement often blamed for steep death tolls.\nSurvivors of a fire which killed dozens at a Karachi shopping mall in January this year said locked exits probably contributed to the high number of fatalities.\nPrime Minister Shehbaz Sharif has expressed his \"deep sorrow and heartfelt regret\" over the latest blaze, and instructed authorities to \"conduct an immediate investigation\", according to a statement from his office.\nHe has also suspended Federal Health Secretary Aslam Ghauri, a top official in the health department.\n\"Such a situation with children is irreparable,\" the statement said.\n  - Published12 hours ago", "translation_ja": "", "vocab": [{"word": "maternity ward", "definition": "妊婦・出産・授乳女性とその乳児のための病院部門。新生児ケアと出産サービスが提供される専門的医療施設を指す。"}, {"word": "lax enforcement", "definition": "法律や規則の厳格でない実行。基準の緩い適用または監督の不十分さを示す。"}, {"word": "fatalities", "definition": "死亡事件や死傷者。特に事故や災害における死者数を指す。"}, {"word": "irreparable", "definition": "修復不可能な、回復できない状態。深刻な損害や失ってしまった状況を表す。"}, {"word": "duty staff", "definition": "勤務中の職員。特定の時間帯に配置され、職務を遂行する責任のある人員を指す。"}, {"word": "protocols", "definition": "標準的な手順や規則。特に安全や医療などの分野で遵守すべき公式な実行手順。"}]}, {"title_ja": "トランプ政権、改修工事が認められない場合はケネディセンターの解体を脅迫", "title_en": "Trump administration threatens Kennedy Center demolition over renovation dispute", "summary_ja": "トランプ政権は、計画されている改修工事が進められない場合、ケネディセンターを解体すると脅迫している。司法省の弁護士らは、改修がなければ建物が危険で老朽化した構造に悪化し、取り壊しが必要になると主張している。この脅迫は、トランプ大統領の名前が違法に追加されたという連邦判事の判決に続くものである。", "summary_en": "The Trump administration has threatened to demolish the Kennedy Center if court-ordered renovations cannot proceed, with justice department lawyers arguing the building will deteriorate into an unsafe structure. The threat follows a federal judge's ruling that Trump's name was unlawfully added to the venue, which is legally designated as a memorial to President John F. Kennedy.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c62mr97n936o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Trump officials threaten Kennedy Center demolition if court blocks renovations\n- Published\nThe Trump administration has threatened to demolish the Kennedy Center if planned renovations for the performing arts venue are not allowed to be carried out, court documents show.\nAttorneys from the justice department have also asked for President Donald Trump's name to be put back on the building after it was removed in June following a court order.\n\"An order blocking the Board from appropriately recognising President Trump,\" the lawyers argued, \"will cause donors to flee, financial contributions to dry up, and structural rehabilitation to stop\".\nThe venue has been among the storied sites in Washington that Trump has sought to renovate since he returned to the White House in 2025.\nTrump's lawyers have argued that without the renovations the venue \"will deteriorate further into an unsafe, decrepit structure that will be required to be taken down\".\nThey also called the venue \"embarrassing to the Nation's Capital\".\nAfter the \"decrepit structure\" is taken down, justice department attorney Brantley Mayers wrote, a determination of what to build on the site will follow, including the option of a large outdoor amphitheatre overlooking the Potomac River.\nThe threat to demolish the building comes just weeks after the Kennedy Center board voted to add Trump's name back to the facade of the venue and to proceed with a two-year closure for proposed renovations.\nMany of the board members who voted are Trump allies who were appointed by the president.\nIn late May, a US judge ruled that the president's name had been added to the venue unlawfully, as it cannot be renamed without congressional approval.\nThe judge ordered that the name be removed, and so it was taken down in June.\nThe case stemmed from a broader legal dispute over the renaming of the cultural institution, which US law designates as a memorial to President John F Kennedy.\nIt is the latest in series of projects that Trump has taken on since returning to Washington.\nHe has been renovating the reflecting pool on the National Mall, he wants to construct a 250-foot victory arch, has demolished the White House East Wing to build a ballroom, and has added his name to institutions such as the Kennedy Center and US Institute of Peace.\nRelated topics\n  - Published13 August\n  - Published13 June", "translation_ja": "", "vocab": [{"word": "deteriorate", "definition": "悪化する、衰退する。時間とともに品質や状態が悪くなることを意味し、特に建物や物理的な状態の低下に用いられる。"}, {"word": "facade", "definition": "建物の正面、外観。また、見せかけや外部からは見えない本当の意図を隠すという比喩的な意味でも使われる。"}, {"word": "designated", "definition": "指定された、任命された。公式に特定の目的や機能を与えられた状態を表す。"}, {"word": "stipulate", "definition": "規定する、条件として要求する。契約や法律で特定の条件や要件を明確に定めることを意味する。"}, {"word": "stemmed from", "definition": "～に起因する、～から生じる。特定の原因や出来事から起こった状況を説明する表現。"}]}, {"title_ja": "ネパール・チベット国境付近の洪水で英国人33人が行方不明", "title_en": "33 UK Nationals Missing After Flash Floods Near Nepal-Tibet Border", "summary_ja": "ネパール・チベット国境近くのラスワ地域で水曜日に激しい洪水が発生し、ネパールで少なくとも157人、チベットで3人が死亡しました。行方不明の33人の英国人を含む579人の観光客が行方不明になっており、28カ国から466人の外国人が消息を絶っています。英国当局はネパール当局と協力して行方不明の英国人の捜索と支援に当たっています。", "summary_en": "A devastating flash flood struck the Rasuwa region near the Nepal-Tibet border on Wednesday, killing at least 157 people in Nepal and 3 in Tibet. Thirty-three UK nationals are among 579 tourists reported missing, with 466 foreign nationals from 28 countries unaccounted for. UK authorities are working with Nepalese officials to locate missing British citizens and provide support.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cnvlde5075no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Nepalese authorities say 33 UK nationals missing after flash floods\n- Published\nThirty-three people from the UK are among hundreds feared missing following a deadly flash flood near the Nepal-Tibet border.\nFlooding and mud slides hit the Rasuaw region in the morning on Wednesday, killing at least 157 people in Nepal and three in Tibet, according to Chinese state media.\nNepal police said 579 tourists are missing - including 466 who are foreign nationals, from 28 different countries.\nPrime Minister Andy Burnham said he is in touch with local authorities and \"will do everything we can\" to support British nationals affected, urging those in the region \"to follow guidance from the local authorities and follow our travel advice\".\nThe UK Foreign Office said it is working closely with Nepalese authorities \"following concerning reports of British nationals who are missing\" and has encouraged Brits to follow local guidance and \"remain alert to the changing situation\".\nAccording to Nepal police, 113 of the missing tourists are Nepalese, and 54 are from the US.\nExcursion company Alpine Eco Trek, which offers guided expeditions and tours in Nepal, confirmed to the BBC that it has not been able to establish contact with a group of 12 Britons who were booked on a tour to Mount Kailash, and were in the region when the flash floods struck.\nThe company said it had made attempts to charter a rescue helicopter but were unable to fly due to poor conditions, and will continue to help with ongoing rescue efforts on Thursday.\nAccording to the company's travel logs, shared with the Press Association, the age of the missing British citizens ranges from 13 to 65.\nFour of the firm's Nepali tour guides are also missing, PA reported.\nThe company's manager Kumar Adhikari said he was in contact with the guides until 08:40 when they were expected to be at Tibet's immigration office, but their phones were disconnected.\n\"We were hoping that inside it was safe,\" he told PA, \"but later the video came from China's government which [showed] even Tibet's side was hit by the flood.\"\nAdhikari said he was \"slowly responding to\" the families of the Britons but has been unable to give them any updates, adding he has been in contact with the British consulate and forwarded them copies of the clients' passports.\n\"I feel so sad. We are just thinking about what to do next...We are in pain at the moment, deep pain.\"\nForeign Secretary Ed Miliband said he is \"deeply concerned\" by news of the flash flooding, and wrote on social media: \"All my thoughts are with those affected and with British nationals in the area and their relatives here at home\".\nIn a joint statement with Australia, the EU, Finland, France, Norway and Switzerland, the UK embassy in Nepal urged British nationals in Nepal to \"exercise caution in affected areas\".\nThe flood hit early on Wednesday in Rasuwa, just north of Nepal's capital Kathmandu, triggering a landslide.\nPreliminary information suggested it was caused by an earthquake, but the US Geological Survey said additional analysis indicated \"the seismic energy was instead generated by a landslide.\"\nIt said a magnitude 5.2 seismic event caused by a \"glacial collapse and debris flow\" occurred near the border at 08:37 local time on Wednesday.\nDramatic CCTV footage showed a wall of water and mud hitting buildings near a border crossing and video filmed from inside a bus in Trishuli captured dozens of people trying to flee a flood surge that was surging through the valley.\nMeanwhile Chinese state media outlet CCTV said a mudslide in Tibet's Gyirong killed three people and left 265 missing, with rescue efforts under way.\nGet in touch\nAre you affected?\nRelated topics\n  - Published3 hours ago\n  - Published11 hours ago\n  - Published12 hours ago\n  - Published3 hours ago", "translation_ja": "", "vocab": [{"word": "flash flood", "definition": "突然の大量の水が流れ込む現象。通常は集中豪雨や急激な地形の変化が原因で、予測困難で危険度が高い。"}, {"word": "unaccounted for", "definition": "行方不明である、または説明がつかない状態を示す。紛失、失踪、または説明のない状態を指す。"}, {"word": "preliminary information", "definition": "調査開始時点での初期的な情報。最終確認前の暫定的なデータを指し、後に修正される可能性がある。"}, {"word": "glacial collapse", "definition": "氷河が崩壊する現象。大量の氷と岩石が急速に落下し、洪水や土砂災害を引き起こす。"}, {"word": "debris flow", "definition": "土砂や岩石、木などが水とともに急速に流れ下る現象。山岳地域で特に危険な自然災害である。"}, {"word": "magnitude", "definition": "地震の強さを表す数値。数字が大きいほど揺れが強く、被害が大きい傾向がある。"}]}, {"title_ja": "火災で子どもを含む2人が死亡、殺人容疑で2人を逮捕", "title_en": "Two arrested on murder suspicion after house fire kills child and adult", "summary_ja": "ミドルズブラ近郊のグランジタウンで発生した火災により、子どもを含む2人が死亡し、23歳と31歳の男2人が殺人容疑で逮捕されました。48歳の女性は重篤な状態で入院中であり、3人がその他の軽傷を負っています。警察は組織犯罪との関連性の調査を進めています。", "summary_en": "Two men aged 23 and 31 have been arrested on suspicion of murder following a house fire in Grangetown near Middlesbrough that killed two people including a child. A 48-year-old woman remains in critical condition and three others suffered non-life threatening injuries. Police are investigating potential links to organised crime.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4gmrz8d31mo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Murder arrests after fire kills two including child\n- Published\nTwo men have been arrested on suspicion of murder after two people died in a house fire including a child, police have confirmed.\nThe blaze in Grangetown, near Middlesbrough, broke out just before 05:30 BST and also left a 48-year-old woman in hospital in a critical condition, alongside a further three people who suffered non-life threatening injuries.\nCleveland Police said the two victims were yet to be formally identified.\nThe men, aged 23 and 31, had been arrested on suspicion of murder and were in police custody, the force said.\nCleveland Police said it was \"keeping an open mind and cannot rule out any links to wider organised crime at this time\".\nThe fire happened about two miles from the A66 crash that killed five young men and two police officers on Saturday morning.\nRedcar and Cleveland Local Policing Commander Supt Emily Harrison said the force was working to \"establish the circumstances of exactly what has happened\".\n\"We will have a high visibility presence in the Grangetown area and encourage anyone who has concerns, or who may have information, to approach our officers.\"\nPatrols had been increased in the local area to \"reassure the local community\", the force said earlier.\nFirefighters damped down the smoking roof of the home, which has been wrecked, and a ladder was propped against a rear upstairs window.\nA 20-year-old neighbour described how local residents had tried to rescue the occupants.\nEllie, who did not want to give her surname, said: \"The entire house was scorching.\n\"I couldn't get near the front of the house, it was that hot.\"\nShe described holding the hand of a crying woman who had jumped from an upstairs window, staying with her until paramedics arrived.\nA neighbour, who asked not to be named, said: \"My daughter heard shouting and screaming this morning. The dogs were barking.\"\nPolice officers guarded a cordon around the scene and Northern Powergrid staff were also on site.\nCleveland Fire Brigade said it had sent six fire engines and the Incident Command Unit.\nAt 13:30 BST it confirmed the fire had been extinguished, but one engine remained on \"proactive standby\".\nA spokesperson said road closures were in place and asked members of the public to avoid the area where possible.\nThey also said the \"tragic incident\" was being jointly investigated by the fire service and Cleveland Police.\n'Tragic loss'\nRedcar MP Anna Turley said the community had faced a \"profound amount of heartbreak over the past few weeks\".\nShe said: \"I am devastated to hear of the tragic loss of life following this morning's fire in Grangetown.\n\"My deepest condolences are with the families, friends and loved ones of those who have died, and my thoughts are also with those injured and receiving treatment.\"\nGrangetown councillor Adam Brook urged people not to speculate.\nHe said: \"Many residents have been in touch with me throughout the morning, and I know there is understandably a great deal of concern.\n\"However, I would urge people not to speculate or share unconfirmed information.\"\nThe families of the people involved have been informed and are being supported by specialist officers.\nFollow BBC Tees on X,, external Facebook, external, Nextdoor and Instagram, external and listen to Radio Tees on BBC Sounds.\nGet in touch\nDo you have a story suggestion for BBC Tees?", "translation_ja": "", "vocab": [{"word": "custody", "definition": "警察による拘束状態。容疑者が警察に逮捕・拘留されている状況を指します。"}, {"word": "cordon", "definition": "警察や当局が危険区域を隔離するために設置する境界線やロープ。立ち入り禁止区域を作ります。"}, {"word": "proactive", "definition": "積極的に問題に対応する姿勢。先制的に行動を起こすことを意味します。"}, {"word": "ruled out", "definition": "除外する、可能性を排除する。ある事柄が起こりえないと判断することです。"}, {"word": "incident", "definition": "事件や出来事。特に突発的な重大な事柄を指します。"}, {"word": "speculate", "definition": "推測する、憶測で語る。確実な証拠なしに仮説を立てることです。"}]}, {"title_ja": "ハリー王子とメーガン妃が引っ越し発表後、英国に到着", "title_en": "Prince Harry and Meghan Land in UK After Announcing Relocation", "summary_ja": "ハリー王子とメーガン妃、そして彼らの子どもたちがカリフォルニアから英国に到着し、コッツウォルズ地域に非公務王族として引っ越すことが予想されている。2020年に王妃職から退いた一家は、ロンドン郊外の私有地に拠点を置き、子どもたちは地元の学校に入学する。この転居はチャールズ国王とウェールズ皇太子夫妻に事前に知らされている。", "summary_en": "Prince Harry, Meghan, and their children have arrived in the UK from California and are expected to relocate to the Cotswolds area as non-working royals. The family, who stepped back from royal duties in 2020, will base themselves at a private property outside London with their children enrolled in local schools. The move comes after King Charles and the Prince and Princess of Wales were informed of their plans.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/czrzm6p6zxeo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Prince Harry and Meghan land in UK days after announcing move\n- Published\nThe Duke and Duchess of Sussex have arrived back in the UK, BBC News understands.\nPrince Harry, Meghan and their children Archie and Lilibet are believed to have flown into the country privately from California, and landed in Birmingham shortly before midday.\nA spokesman for the Duke and Duchess of Sussex said \"this is not something we would comment on\".\nThere did not appear to be a police presence as Harry and his family left the airport, a source told the BBC.\nLast week, it was reported that the couple would be relocating to the UK in August. They will not return to official duties but will live in Britain as non-working royals.\nIt is thought the family will base themselves at a private property outside of London in the Cotswolds area.\nArchie and Lilibet have been enrolled in school and the new term is due to start next week.\nThough not confirming the family's arrival in the UK, a spokesman for the Sussexes did say their chickens were staying in California, but they were bringing their dogs Mia and Pula with them.\nThe chickens, which the couple rescued, have regularly featured on Meghan's Instagram account and also appeared in her Netflix programme.\nThe Sussexes left the UK and stepped back from their royal duties in early 2020, before settling in California in March that year.\nKing Charles was told of the move earlier this month. The family visited the King at his Highgrove home in July this year, but it is understood the move was not discussed.\nBefore that visit, Prince Harry and Meghan had not been in the UK together since they attended the funeral of Queen Elizabeth II in 2022.\nThe Prince and Princess of Wales have also been informed of their plans.\nThe Sussexes' security in the UK has been the subject of debate since the news of their return broke.\nLast year, Prince Harry lost a legal challenge over the levels of security he and his family are entitled to while in the country.\nThe duke had sought to overturn a decision that had downgraded his security after he stopped being a working royal and moved to the US.\nIt is unclear what provisions will be made for their security in the UK and who will pay for it.\nAfter the announcement of the Sussexes' intended return, a Home Office spokesperson said decisions on the security of royals were taken by the Executive Committee for the Protection of Royalty and Public Figures (Ravec), and the UK government's protective security system was \"rigorous and proportionate\".\nPrince Harry has previously said that worries about safety have prevented him from coming to the UK and bringing his wife and children.\nLast month, the duke and six other public figures lost their High Court privacy case against the publisher of the Daily Mail and Mail.\nThey face paying up to £34.5m to Associated Newspapers in legal costs.\nAdditional reporting by Ella Kipling and Thomas Spencer\nRelated topics\n  - Published6 days ago\n  - Published3 May 2025", "translation_ja": "", "vocab": [{"word": "step back", "definition": "公の職務や責任から身を引く、または後退する。ここでは王族としての公務から退くことを意味する。"}, {"word": "proportionate", "definition": "適切な規模や量である、釣り合っている。文脈では セキュリティ対策が適切かつバランスの取れていることを指す。"}, {"word": "downgrade", "definition": "ランクや水準を低下させる、格を下げる。ここではセキュリティレベルが引き下げられたことを意味する。"}, {"word": "provisions", "definition": "設けられた対策や準備。文脈ではセキュリティなどの具体的な手配を指す。"}, {"word": "overturn", "definition": "判決や決定を破棄する、覆す。法的な決定を変更することを意味する。"}, {"word": "rigorous", "definition": "厳密で念入りな、徹底的な。文脈では入念で厳格なセキュリティシステムを指す。"}]}, {"title_ja": "フランス・カンの駅近くで車が群衆に突っ込む、複数の犠牲者", "title_en": "Car Rams Crowd at Bus Stop in Caen, France; Multiple Casualties Reported", "summary_ja": "フランス北西部のカン市の駅近くのバス停で、車が群衆に突入し、少なくとも1人が死亡、約12人が負傷した。警察は現場から逃げた容疑者を20キロ離れた地点で逮捕した。当局は、この事件が意図的であるか、あるいは現場での先行する口論に関連しているかについて調査している。", "summary_en": "A vehicle drove into a crowd near Caen train station in northwestern France on Wednesday evening, killing at least one person and injuring about a dozen others. Police arrested a suspect who fled the scene and was apprehended 20 kilometers away. Authorities are investigating whether the incident was intentional or related to a prior altercation in the area.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/france-car-rams-crowd-at-bus-stop-in-caen/a-78518309?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "France: Car rams crowd at bus stop in Caen\nAugust 27, 2026\nA person drove a car into a crowd in the northwestern French city of Caen on Wednesday, killing at least one person and injuring about a dozen others, firefighters and police said, according to the AFP news agency and BFM TV.\nA police source said the driver rammed the car into the crowd near the city's train station after a fight in the area, and one suspect was arrested, AFP reported.\nBFM TV reported that two people had been killed in the incident.\nThe driver fled and was later arrested 20 kilometers (12 miles) away, a source told AFP.\nThe incident occurred around 10:00 p.m. local time (2000 UTC/GMT) near a bus stop close to the Caen train station. According to initial reports, a black vehicle drove into several people who were in the area.\nPolice cordoned off the area while emergency services attended to the victims.\nAuthorities are investigating the circumstances of the incident and trying to determine whether the attack was intentional.\nEdited by: Kieran Burke\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "cordoned off", "definition": "ロープやフェンスで区域を閉鎖・隔離すること。警察や当局が事件現場や危険区域へのアクセスを制限する際に使用される。"}, {"word": "rammed", "definition": "勢いよく衝突させること、または意図的に何かに突進すること。特に車が他の物体や人に激しく衝突する場合に用いられる。"}, {"word": "circumstances", "definition": "事件や状況が起きた経緯や条件のこと。調査において、事象の背景や関連する事実を指す。"}, {"word": "intentional", "definition": "意図的な、故意の。行動が計画的で意識的に行われたことを示す。過失による場合と区別される。"}, {"word": "apprehended", "definition": "逮捕する、身柄を確保すること。容疑者を警察が捕捉し拘束する行為を指す。"}]}, {"title_ja": "ウクライナ軍の空爆がロシア占領下のルハンシク州でバスを襲撃、9人が死亡", "title_en": "Ukrainian airstrike kills 9 on bus in Russian-occupied Luhansk", "summary_ja": "ロシア占領軍によると、ウクライナ軍の空爆が水曜日にロシア占領下のルハンシク州のバスを襲撃し、9人が死亡した。同時にウクライナは、ロシアの物流インフラへの攻撃を続け、タンボフ州の大手ワイルドベリーズの倉庫を破壊した。ウクライナのドローン攻撃は、ここ数週間でロシアのオンライン小売業者の倉庫159万平方メートル以上にダメージを与えている。", "summary_en": "A Ukrainian airstrike on a bus in Russian-occupied Luhansk killed nine people on Wednesday, according to Russian occupation officials. Meanwhile, Ukraine continued its campaign against Russian logistics infrastructure, destroying a major Wildberries warehouse in Tambov region. Ukrainian drone attacks have damaged at least 1.9 million square meters of warehouse space at Russian online retailers in recent weeks.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-airstrike-on-bus-in-russian-occupied-luhansk-kills-9/a-78516673?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Ukraine airstrike on bus in Russian-occupied Luhansk kills 9\nAugust 26, 2026\nA Ukrainian airstrike killed nine people in Ukraine's eastern, Russian-occupied Luhansk region on Wednesday, according to Leonid Pasechnik, leader of Russia's occupying forces there.\nPasechnik labeled the strike \"a war crime,\" saying it had killed eight people on the spot and that another person, a 20-year-old woman, died of her injuries shortly thereafter.\nThe bus was said to have been carrying 15 people, with five more reported injured.\nUkraine keeps up strikes in Russia, destroys another major warehouse\nWith US-brokered peace talks failing to get off the ground and the Kremlin sticking to its maximalist demands before agreeing to end its four-and-a-half-year invasion, Kyiv and Moscow have continued to escalate their air campaigns.\nKyiv again targeted logistics infrastructure on Wednesday, using drones to destroy another Wildberries warehouse, this one in Russia's Tambov region, southeast of Moscow.\nTambov's governor said the 100,000 square-meter (1.1 million square-foot) facility — an area roughly the size of 14 soccer fields — had been \"completely destroyed by fire.\"\nWildberries is Russia's biggest online retailer.\nUkrainian strikes on its facilities not only disrupt the Kremlin's military logistics — Kyiv says Wildberries aids the military war effort — they also strike at Russia's civilian economy and thus touch everyday Russians.\nThis week, Kyiv expanded its target list to include Russia's number two online retailer, Ozon.\nIn an analysis of satellite imagery, Reuters news agency estimated that at least 1.9 million square meters of warehouse space had been severely damaged in Ukrainian drone attacks on more than 20 Wildberries and Ozon facilities in recent weeks.\nEdited by: Rana Taha\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "escalate", "definition": "状況や紛争が段階的に激化すること。対立や危機的状況がより深刻になることを意味する。"}, {"word": "logistics", "definition": "軍隊や組織が物資や人員を運搬・配置するための組織的な計画と実行。供給チェーン管理を含む。"}, {"word": "maximalist", "definition": "妥協を許さず、要求や目標を最大限まで押し通そうとする立場や行動。交渉において全ての要求を満たすまで譲歩しないこと。"}, {"word": "disrupted", "definition": "システムや活動が中断または乱されること。通常の機能や運用が阻害されることを意味する。"}, {"word": "brokered", "definition": "第三者が当事者間の合意や取引を仲介して成立させること。外交交渉などで調停役を務めることを指す。"}, {"word": "facility", "definition": "特定の目的のために建設された建物や施設。通常、製造、貯蔵、またはサービス提供用に設計されている。"}]}, {"title_ja": "2026年の夏は「通常通り」ではない：気候科学者が極右の否定論を反論", "title_en": "Summer 2026 Was Not Normal: Climate Scientists Refute Far-Right Denial", "summary_ja": "ヨーロッパは2026年に異常な高温を経験し、ドイツだけで約14,000人の熱関連死亡者が出て、EUの経済損失は推定1,800億ユーロに達した。NASAやNOAAなどの組織からの圧倒的な科学的証拠にもかかわらず、ヨーロッパとアメリカの極右政治家らは危機の深刻さを否定し続けている。帰属科学により、気候変動はスペインの壊滅的な山火事を20倍、フランスの山火事を2倍可能性が高くしたことが実証された。", "summary_en": "Europe experienced an exceptionally hot summer in 2026, causing approximately 14,000 heat-related deaths in Germany alone and an estimated €180 billion in EU economic losses. Despite overwhelming scientific evidence from NASA, NOAA, and other organizations confirming human-caused climate change, far-right politicians across Europe and the US continue to deny the severity of the crisis. Attribution science demonstrates that climate change made Spain's devastating wildfires 20 times more likely and France's fires twice as probable.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/no-this-wasn-t-a-completely-normal-summer-despite-far-right-climate-denial/a-78513682?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "This summer wasn't normal, despite climate denial\nAugust 26, 2026\nAs a summer of European extreme heat draws to a close, politicians are looking back at the toll. Germany recordedaround 14,000 heat-related deaths, almost two-thirds in one scorching week of June alone. A Dutch bank estimated summer heat will cost the EU €180 billion in lost GDP. And in June, European farmers lostapproximately nine million tons in grain crops.\nClimate change, long a politically charged topic, has become a daily reality for people around the world. These effects and more are making it increasingly difficult to challenge what people are seeing with their own eyes.\nYet that hasn’t stopped the global populist right from trying. Richard Tice, deputy leader of the UK’s far-right Reform Party said\"climate change has always happened, it always will,\" adding that it was arrogant to try to stop it. He encouraged the British public to enjoy the heat.\nIn the US, Harriet Hageman, a Republican politician and potentially Wyoming’s next senator, told far-right channel Real America’s Voice that Europe’s heatwave was business as usual. \"It's called summer. Some years are hotter than others and some years are colder than others,\" she said. \"But that's just the cyclical nature of weather.\"\nAnd Tino Chrupalla, co-leader of Germany’s far-right AfD party tolda journalist in recent days that it’s been a \"completely normal summer.\" He dismissed climate change as \"hype.\" \n \nBut claims like these don’t stand up to scientific scrutiny.  \nAs NASA statesplainly: \"Scientific evidence continues to show that human activities (primarily the human burning of fossil fuels) have warmed Earth’s surface and its ocean basins, which in turn have continued to impact Earth’s climate.\"\nThis was not 'a completely normal summer'\nThis summer has been historically hot. Independent climate monitoring bodies, including the National Oceanic and Atmospheric Administration(NOAA) in the US, the Copernicus Climate Change Service in the European Union and the Japan Meterological Agency, all called last month either the joint-warmest or joint-second warmest month on record.\nThe conditions have led energy plants to halt production, outdated concrete motorways blowing up, and older buildings overheating during the day and barely cooling down at night — threatening inhabitants with exposure to heat stress.\nThe extreme heat was felt almost everywhere on the globe. According to NOAA’s data, it was the warmest July ever for North America, Africa and Asia.\nThe continental United States just surpassedits warmest July records. They were previously set in 1936, during the infamous Dust Bowl that scorched the US Great Plains with extreme temperatures, and in 2012, when North America suffered an extreme heatwave.\nAnd the daily average sea surface temperature hitits highest level since records began in 1979 — reaching 21.1 degrees Celsius (70 degrees Fahrenheit) this month. That’s a result of both human-driven warming as well as El Nino, a climate cycle that weakens trade winds and warms tropical Pacific surface temperatures.\nHow climate change supercharged this summer's fires\nIn Spain, the far-right Vox party saidfires — which burned more than 254,000 hectares of land across the country this season — were not connected to climate change.\nYet experts agree rising global temperatures played a major role in the intense wildfire season that also scorched large parts of France and Canada. That’s because extreme heat creates ideal conditions for wildfires to start and spread.\nA field of climate research called attribution science explores the extent to which climate change exacerbates extreme weather events like this summer’s wildfires. Using models, researchers compare the likelihood and intensity of an event in today's climate with a simulated world in which there is no human-caused warming.\nAnalyses done this summer showthat hotter global temperatures created conditions that made the wildfires in Spain 20 times more likely to happen, and twice as probable in France.\nThis is due to a phenomenon known as weather whiplash, where ecosystems swing dramatically between wet and dry conditions.\nWhen the planet warms, the atmosphere holds more moisture, rainfall is intensified, and plants grow. Then, in summer, that same warm atmosphere draws water from soil and plants, worsening drought and drying out vegetation, turning it into the perfect fuel for fires.\n\"We know — and this is mathematically proven — that the probability of having fire weather that can sustain and create this kind of event has been altered by climate change,\" Francesca Di Giuseppe, a fire forecast project coordinator at the European Centre for Medium-Range Weather Forecasts, told DW about this summer’s fires in Spain and France.\nClimate change’s ripple effects\nOverall, this summer has left its mark in numerous ways that are impossible to ignore.\nBodies of water across Europe are drying out under the intense heat. Parts of the Rhine, Da", "translation_ja": "", "vocab": [{"word": "attribution science", "definition": "気候変動が特定の極端な気象現象の発生確率や強度にどの程度影響しているかを定量的に分析する科学分野。統計モデルを使用して、人為的な温暖化がない場合の仮想世界と現在の気候を比較する。"}, {"word": "exacerbate", "definition": "問題や状況を悪化させる、より深刻にさせることを意味する。例えば、気候変動が山火事のような極端な気象現象を悪化させるという場合に使用される。"}, {"word": "weather whiplash", "definition": "生態系が急激に湿潤と乾燥の条件を繰り返す現象。気温上昇により降水量が増加した後、同じ温暖な大気が土壌から水分を奪い、干ばつを悪化させる。"}, {"word": "scorched", "definition": "過度な熱によって焼かれる、焦げるという意味。干ばつや極端な高温によって土地や植生が深刻なダメージを受けた状況を表現する際に使われる。"}, {"word": "scrutiny", "definition": "綿密な調査、厳密な検査を意味する。科学的根拠に基づいて主張や証拠を厳しく検証することを指す。"}, {"word": "refute", "definition": "議論や主張が間違っていることを論理的に証明する。科学的証拠を用いて他者の否定論や主張に反論することを表す。"}]}, {"title_ja": "ネパール洪水で数百人が行方不明、米国人47人を含む", "title_en": "Hundreds Missing in Deadly Nepal Floods, Including 47 Americans", "summary_ja": "ネパール南部での深刻な洪水により、少なくとも384人が行方不明になっており、地元当局による予備的な報告では米国人47人が含まれているとされています。救助活動が被災地全域で行われており、正確な死傷者数はまだ調査中です。", "summary_en": "At least 384 people are missing following severe flash flooding in Nepal, with preliminary reports indicating at least 47 Americans among those unaccounted for. Local officials are conducting search and rescue operations across affected areas. The exact cause and extent of casualties remain under investigation.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/americans-reported-missing-nepal-floods-tourism-board/story?id=135964282", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュース ライブは、ニュース速報と生放送イベントを24時間体制でカバーしています。プラットフォームは、主要なストーリーが展開する際のリアルタイム更新を提供します。視聴者は、国内および国際ニュースの包括的なレポートにアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. The platform delivers real-time updates on major stories as they develop. Viewers can access comprehensive reporting on national and international news.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "9/11テロ事件の主謀者とされるモハンマドの裁判が2028年に予定される", "title_en": "9/11 Alleged Mastermind Khalid Sheikh Mohammed Trial Set for June 2028", "summary_ja": "米軍事裁判所の判事は、9/11テロ事件の自称主謀者であるハリド・シェイク・モハンマドの裁判を2028年6月に開催することを決定した。この判決は、注目度の高い被告人に対する長年の法的手続きにおける重要な進展を示している。モハンマドの裁判は2003年の逮捕以来、数度の延期に直面している。", "summary_en": "A military judge has scheduled the trial of Khalid Sheikh Mohammed, the self-proclaimed mastermind of the 9/11 attacks, for June 2028. The ruling marks a significant milestone in the long-delayed legal proceedings against the high-profile detainee. Mohammed's trial has faced numerous postponements since his capture in 2003.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/alleged-911-masterminds-long-awaited-trial-scheduled-2028/story?id=135987518", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "南アフリカ警察、絶滅危惧種オウムの卵密輸で2人のタイ人を逮捕", "title_en": "South African Police Arrest Two Thai Men for Smuggling Endangered Parrot Eggs", "summary_ja": "南アフリカ当局がヨハネスブルグのOR Tambo国際空港で、絶滅危惧種のオウムの卵を違法輸出しようとしたタイ人2名を別々の事件で逮捕した。8月20日に逮捕された容疑者は50個の卵を手作りの孵化器に入れて持っていたのに対し、7月に逮捕された別の容疑者は418個の卵を所持していた。押収された卵は国立動物園で孵化させられており、すでに複数のヒナが孵化し獣医学的ケアを受けている。", "summary_en": "South African authorities have arrested two Thai nationals in separate incidents at Johannesburg's OR Tambo airport for attempting to illegally export endangered parrot eggs. The first suspect was caught on August 20 carrying 50 eggs in a homemade incubator, while another was arrested in July with 418 eggs. Seized eggs are being incubated at a national zoo, with several chicks already hatching and receiving veterinary care.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/26/south-african-police-arrest-two-thai-men-smuggling-parrot-eggs", "state_media": false, "category": "社会", "full_text": "South African police have arrested two Thai nationals in separate incidents for allegedly attempting to smuggle endangered parrot eggs out of the country as authorities try to stem the tide of wildlife trafficking.\nA 50-year-old Thai national was arrested at OR Tambo international airport in Johannesburg on 20 August, carrying 50 bird eggs in a homemade incubator in a hand-luggage bag, South Africa’s environment ministry said in a statement.\nThe ministry said preliminary investigations indicated that the eggs were from parrot species listed under the Convention on International Trade in Endangered Species of Wild Fauna and Flora (Cites), which regulates international trade in wild animals and plants to ensure species do not become extinct. It did not specify which species.\nAnother Thai national, a 23-year-old, was arrested at the same airport on 16 July, allegedly trying to smuggle 418 parrot eggs in two homemade incubator bags. Thailand’s embassy in South Africa did not immediately respond to a request for comment.\nSouth Africa is battling wildlife smuggling on several fronts, from poached rhino horns and the bones of illegally farmed tigers to abalone shellfish and succulent plants.\nThe environment ministry said: “The illegal collection and trafficking of parrot eggs pose a serious threat to wild bird populations and animal welfare. Eggs are often concealed in improvised incubation devices and transported under conditions that significantly compromise their viability and endanger the welfare of developing embryos and hatchlings.”\nStaff at the National Zoological Garden in Pretoria are incubating the seized eggs, the ministry said. “Several of the rescued eggs have successfully hatched and the chicks are receiving intensive veterinary and husbandry care to maximise their chances of survival,” the statement added.\nThe ministry said the arrests were carried out after a “joint intelligence-driven operation” led by its Environmental Management Inspectorate, known as the “Green Scorpions”, and police intelligence, border and endangered species units.\nSouth Africa punishes the illegal export of Cites-listed species with a fine of 10m rand (£460,000), up to 10 years in prison or both.", "translation_ja": "", "vocab": [{"word": "smuggling", "definition": "違法に物品を国境を越えて密かに運ぶこと。この文脈では、保護された野生動物や生産物を秘密裏に輸出入することを意味する。"}, {"word": "endangered species", "definition": "絶滅の危機に瀕している生物種のこと。国際条約により、その捕獲や取引が規制されている。"}, {"word": "Cites", "definition": "ワシントン条約（絶滅のおそれのある野生動植物の種の国際取引に関する条約）の略称。野生生物の過度な商取引を規制する国際条約である。"}, {"word": "incubator", "definition": "卵を温かく保ち、ふ化させるための装置。この記事では、容疑者らが手作りの孵化器を使って卵を運搬していた。"}, {"word": "viability", "definition": "生存可能性、または生存するための能力のこと。この文脈では、卵が正常に発育し孵化する可能性を指す。"}, {"word": "intelligence-driven", "definition": "情報収集に基づいた作戦や活動のこと。警察活動では、事前に集めた情報に基づいて計画・実行される作戦を指す。"}, {"word": "trafficking", "definition": "違法な物品の取引や流通のこと。特に野生動物や麻薬などの密売を指す。"}]}, {"title_ja": "サル痘が新たな国々に拡大、特に子どもが危険にさらされている", "title_en": "Mpox Outbreak Spreads to New Countries; Children Particularly Vulnerable", "summary_ja": "ギニアビサウでの新たなサル痘の発生により、ウイルスが再び注目を集めています。2022年以来、145カ国で約19万件の確認感染例が報告されています。2024年にコンゴ民主共和国で発見されたクレードIの新変異株はより容易に人から人へ伝播し、最新の発生では15歳未満の子どもが重症および死亡の最も高いリスクを示しています。", "summary_en": "A fresh mpox outbreak in Guinea Bissau marks the virus's return to headlines, with nearly 190,000 confirmed cases reported across 145 countries since 2022. A new variant of clade I mpox, discovered in the Democratic Republic of Congo in 2024, spreads more easily between people, with children under 15 showing the highest risk of severe disease and death in the latest outbreak.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/aug/26/global-health-mpox-outbreak-explainer-children", "state_media": false, "category": "社会", "full_text": "A man infected with mpox at a hospital in Burundi. Photograph: Tchandrou Nitanga/AFP/Getty ImagesView image in fullscreenA man infected with mpox at a hospital in Burundi. Photograph: Tchandrou Nitanga/AFP/Getty ImagesMpox is back – and in new countries. How can this outbreak be contained?The public health emergencies in 2022 and 2024 saw the virus reported in 145 countries, but in the new cases children appear particularly affectedA fresh outbreak of mpox in Guinea Bissau – the country’s first – means the virus formerly known as monkey pox is back in the headlines. So what has changed?Since 2022, there have been almost 190,000 lab-confirmed cases of mpox reported worldwide in 145 countries. Before then, outbreaks of mpox tended to be relatively small and in a handful of African countries, where the viral infection was known to be endemic.What is mpox?Mpox is an infectious disease that typically starts with flu-like symptoms, including fever, chills and aching muscles. These are followed by a distinctive rash, beginning as raised spots that turn into blisters filled with fluid before forming scabs.View image in fullscreenA colourised electron microscope image shows Mpox virus particles, represented in green, found within infected cultured cells, represented in blue. The virus particles are in various stages of maturity, which accounts for their differences in shape. Photograph: APIt used to be called monkeypox, because the virus was first discovered in captive monkeys in 1958. But during an international outbreak in 2022, there were concerns that the name was fuelling racist and stigmatising language on and offline, prompting the World Health Organization (WHO) to recommend changing it to mpox.It is endemic to many parts of Africa, with outbreaks historically starting when people ate meat from infected wild animals. But in recent years it has spread beyond the usual areas, with sustained chains of human-to-human transmission. The Atlanta-based Centers for Disease Control and Prevention said this month that mpox was on course to become endemic in the US.Why is it spreading to new countries?There are, broadly, two types of mpox, known as “clades”. Clade I was once called the “Congo Basin clade” and clade II the “West African clade”.The latter sparked a major global outbreak in 2022 when it appeared to undergo some changes that allowed it to spread more efficiently from person to person. It is passed on via close contact – in that outbreak, mostly by sexual contact, with men who have sex with men at the highest risk.View image in fullscreenA Red Cross worker disinfects a tent in the Don Bosco camps for internally displaced people in Goma, in the Democratic Republic of Congo. Photograph: Moise Kasereka/EPAIn June 2024, researchers raised the alarm about a new variant of clade I in the Democratic Republic of the Congo (DRC), which also appeared to be spreading more easily between people. That grew into another major international outbreak, which was declared a public health emergency of international concern by the WHO on 14 August 2024.“Emergence of mpox in more countries in west Africa is to be expected,” said Prof Michael Marks, of the London School of Hygiene & Tropical Medicine and University College London hospital. “Mpox outbreaks have now been declared in a number of countries in the region, including Guinea and Sierra Leone within the last 12 months.“Mpox spreads by close physical contact. This makes it suitable to spread in a variety of different contexts, such as in close sexual networks, as was seen during the 2022 global pandemic, or areas where many people are living closely together such as settings with refugees and internally displaced people, as was seen in the DRC outbreak over the last few years,” Marks said.What happened to those two big outbreaks?The 2022 outbreak was declared a public health emergency in July that year. After contact-tracing and mass vaccination programmes, the status was lifted in May 2023. There had been about 90,000 infections.View image in fullscreenA passenger passes mpox alerts at Chennai airport in India. Photograph: R Satish Babu/AFPThe 2024 outbreak had its international public health emergency status lifted in September 2025, not because the disease had disappeared but because numbers of cases and deaths were declining and officials felt the situation had become better controlled.If genetic testing reveales a new variant, or surveillance suggested an outbreak was spreading particularly fast, making people particularly sick or proving more deadly, global health authorities would be likely to step in again.How worrying is the new outbreak?Cases had not been reported in Guinea Bissau before this outbreak. Unicef said it was concerned that of 46 suspected cases, 23 were children aged under 15 and most of those were aged under four.“The concern about children is that they are at the highest risk of severe disease and death from mpox,” said Dr Aula Abbara, a senior lec", "translation_ja": "", "vocab": [{"word": "endemic", "definition": "特定の地域や人口集団に常在する病気や現象のこと。ここではサル痘がアフリカの多くの地域に常に存在していることを意味します。"}, {"word": "sustained chains of transmission", "definition": "継続的な感染経路のこと。病気が人から人へ次々と伝播し続けることを指します。"}, {"word": "clade", "definition": "共通の祖先を持つ生物の系統や亜種のこと。ウイルス学では特定の遺伝的特性を持つウイルスの分類に使われます。"}, {"word": "contact-tracing", "definition": "感染者と接触した人々を特定し、監視する疫学的手法のこと。感染拡大を防ぐために重要です。"}, {"word": "variant", "definition": "ウイルスや細菌の遺伝子が変異した種類のこと。元の形から異なる特性を持つようになったバージョンです。"}, {"word": "surveillance", "definition": "疾病の発生状況を継続的に監視・観察する活動のこと。公衆衛生上の危険を早期に発見するために行われます。"}]}, {"title_ja": "ガーナ食料運動が地域の食文化を取り戻す：モリンガラテとトライガーナッツケバブ", "title_en": "Ghana Food Movement Champions Indigenous Cuisine to Reclaim Food Sovereignty", "summary_ja": "ガーナの草の根運動が、モリンガやトライガーナッツなどの伝統的な食材を推進し、輸入品への依存と西洋料理の影響に対抗している。2019年に設立されたガーナ食料運動は、ポップアップイベントや調理教室を開催し、ガーナ料理への国民的誇りを育みながら地域産食材の経済的価値を示している。この取り組みは、植民地時代の遺産がアフリカの食料システムに与え続ける影響に対処し、食料主権を政治的・経済的力の表現として提唱している。", "summary_en": "A grassroots movement in Ghana is promoting traditional indigenous foods like moringa and tigernut to counter the country's heavy reliance on imports and Western culinary influence. Founded in 2019, the Ghana Food Movement runs pop-ups, cooking events, and educational programs to instill national pride in Ghanaian cuisine and demonstrate the economic viability of local ingredients. The initiative addresses how colonial legacies continue to shape African food systems and advocates for food sovereignty as a form of political and economic power.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/aug/26/moringa-lattes-and-tigernut-kebabs-the-young-ghanaians-taking-back-the-power-of-their-food", "state_media": false, "category": "経済", "full_text": "After three years at catering school in Accra, Abiro Wisdom was certain of one thing – he did not want to go into catering. At least not the route that he might be expected to take. His course had prepared students for working in international hotels, focusing on French, Italian and Mexican cuisine. The nutritious, homegrown food that Wisdom had eaten while growing up in Bolgatanga, northern Ghana, did not feature at all.\n“I didn’t see myself there,” he says of the big chain hotels. “I felt I wouldn’t be myself working there – I wouldn’t be able to talk about the food from where I come from.”\nWisdom instead joined the Ghana Food Movement (GFM), which was founded in 2019 – the year he graduated – and quickly became a champion for Indigenous foods. He says: “We’re a community of food lovers, of believers in the potential of Ghanaian food.”\nGhana imports at least half of its food and is heavily influenced by foreign cuisine and ingredients, but Wisdom believes northern Ghana, the country’s agricultural heartland with its huge variety of nutritious and climate-resilient crops and vegetables, could be the secret to the country’s broken food system.\nThe GFM was initially a network of volunteers interested in food systems – chefs, farmers, entrepreneurs and experts in food security. In the early days they met in cafes and set up events in whatever space they could find to deliver three-course meals highlighting a single crop and the diverse ways it can be used.\n“[Traditionally] we make tigernut milk, but you can make so many different things, for example tigernut burgers and tigernut kebabs,” says Aimee Wallin, the group’s Malian-Swedish co-managing director. “We want people to taste what we are about, not just talk about what we are about.”\nThe group has been registered as a non-profit organisation for the past five years and now has its own kitchen where it brainstorms new recipes, many of them thought up by Wisdom. It runs monthly pop-ups and dine-and-dance nights, as well as panel discussions and recipe testing events for chefs and local businesses. Wisdom says: “We might brainstorm ideas around a single food, such as moringa leaves, to show how it’s possible to sell – and make a profit from – dishes and drinks using Indigenous ingredients.”\nThe GFM has started working with schools, helping children appreciate local ingredients.\nWisdom hopes this multi-pronged approach will help instil more national pride in Ghanaian food. “My goal is that we have a generation of chefs who believe in Ghanaian food and its own identity,” he says.\n“I’ve come to understand how food contributes to politics, to the economy, how it contributes to self-identity. [Now I can] trace the impact of food on our society, on our land, to the sea, to the farmer, down to how the food gets to the market, then to our plates. As chefs, we have to be able to tell the story of the food.”\nThis month the group won a Champions of Change title in the 50 Best Restaurants Awards in recognition of the transformational work it is doing.\nForeign, colonial influence has played a heavy role on African food systems, when ruling powers dictated land should be used for cash crops for export, such as cocoa or peanuts, at the expense of food for local consumption.\nAt the same time, they put more value on imported ingredients such as rice, disrupting the sustainability of countries’ food systems. The impact has continued to modern times, making African countries heavily reliant on imports and vulnerable to price shocks when wars or other crises disrupt shipping.\nBut, as Wisdom discovered at university, there is also a lingering cultural influence, with western food still taught in culinary institutes and sought after in restaurants.\n“The narrative has always been that our practices are wrong and the west’s practices are right. It’s just super-stupid. Why would you do that when you can just grow your own food?” says Wallin.\n“Part of the postcolonial agenda is for us to still have to depend on other countries. If it’s not to buy their products, to buy their vegetables, then at least we need to buy their seeds and their pesticides and their fertilisers,” says Wallin, who points out that many of the local ingredients they champion do not need extra agricultural inputs because they are adapted to the local environment.\n“The one who feeds us will control us and that’s how it is today. So, if we want to control ourselves, we also need to feed ourselves. It’s power. Taking back the power of our foods and using it to our advantage.”\nFor younger Ghanaians there is a new international pull towards heavily advertised trends and social media fads such as matcha lattes, bubble tea and smash burgers.\nWallin says that also offers a culinary opportunity – to earn the interest of young people, by offering alternatives, replacing matcha with moringa lattes or making shawarma out of tigernut instead of meat.\nBoth Wallin and Wisdom believe that their movement has the urgent task of sav", "translation_ja": "", "vocab": [{"word": "indigenous", "definition": "その地域に昔から住んでいる人々の、またはその土地に本来自生していることを意味する。この記事では、ガーナの伝統的な農作物や食べ物を指すために使われている。"}, {"word": "sovereignty", "definition": "政治的または経済的に独立していること、自分たちの力で自らを支配・運営できる状態を意味する。ここでは食料に関する自給自足と自決権を指す。"}, {"word": "postcolonial", "definition": "植民地支配が終わった後の時代や状況を指す。この記事では、植民地主義の影響が現在も続いていることを説明するために使われている。"}, {"word": "resilient", "definition": "困難な状況でも耐えることができ、回復力のあることを意味する。ここでは、地元の気候や環境に適応できる農作物を説明するために使われている。"}, {"word": "transformational", "definition": "根本的な変化をもたらす、劇的に何かを変えることを意味する形容詞。この記事では、食料システムに大きな影響を与える取り組みを表現している。"}, {"word": "vulnerability", "definition": "危険や損害を受けやすい状態、弱点があることを意味する。この記事では、輸入に依存する国が価格変動や危機に曝される脆弱性を説明するために使われている。"}]}, {"title_ja": "ロッキー・ホラー・ピクチャー・ショーのスター、ティム・カリー氏が80歳で逝去", "title_en": "Tim Curry, Rocky Horror Picture Show Star, Dies at 80", "summary_ja": "ロサンゼルスで亡くなったティム・カリー氏は、カルト的名作ミュージカル『ロッキー・ホラー・ピクチャー・ショー』でドクター・フランク・N・ファーターを演じた英国の俳優で、80歳でした。3度のトニー賞ノミネートを受けたカリー氏は、10年以上前の脳卒中後、健康上の問題と格闘していました。劇場、映画、声優としてのキャリアは数十年に及び、デイタイム・エミー賞を受賞しました。", "summary_en": "Tim Curry, the British actor celebrated for his iconic role as Dr Frank-N-Furter in the cult classic musical The Rocky Horror Picture Show, has died at age 80 in Los Angeles. Curry, a three-time Tony nominee, had struggled with health issues following a stroke over a decade ago. His career spanned decades across theater, film, and voice acting, earning him a Daytime Emmy Award.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/27/tim-curry-star-of-the-rocky-horror-picture-show-dies-at-age-80?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Tim Curry, star of The Rocky Horror Picture Show, dies at age 80\nCurry, a three-time Tony nominee, was best known for his portrayal of Dr Frank-N-Furter in the cult classic musical.\nTim Curry, the British actor best known for his star turn as Dr Frank-N-Furter in the cult classic musical The Rocky Horror Picture Show, has died at age 80.\nCurry, who had struggled with his health for more than a decade after a debilitating stroke, died peacefully at his home in Los Angeles, California, according to a statement released by his longtime manager, Marcia Hurwitz, on Wednesday. No cause of death was disclosed.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Iconic Palestinian artist Sliman Mansour passes away at age 79\n- list 2 of 3‘The shining star of our family’: R&B singer D’Angelo passes away at age 51\n- list 3 of 3Dolly Parton, beloved US country music icon, dies at 80\nThe actor appeared in numerous movies, often as a hammy villain. He was nominated at the annual Tony Awards three times for Broadway roles and performed voice work in several animated films and television shows.\nBut his most iconic role was as Frank-N-Furter, a cross-dressing scientist in the rock musical The Rocky Horror Show, which premiered in 1973 at the Royal Court Theatre in London.\nHe took the show-stopping role to Broadway and then reprised his turn as Frank-N-Furter in the 1975 film adaptation, alongside Barry Bostwick, Meat Loaf and Susan Sarandon.\n“I’m not much of a man by the light of day. But by night, I’m one hell of a lover. I’m just a sweet transvestite from transsexual Transylvania,” Curry sang in one scene, dressed in garish eye shadow, black corsetry and stockings topped with a garter belt.\nIn a 1975 television interview, Curry noted the risk of having his career defined by the role.\n“When I read it, I just thought it was very, very witty and funny,” Curry said of the script, although he confessed to some initial reluctance to star in the role.\n“I mean, I was hesitant in that, if it worked, it might be a difficult thing to shake off. But, really, I’ve always thought that [a part] wasn’t worth doing unless you took a risk.”\nHe later starred as the child-killing monster in the 1990 miniseries It, an adaptation of Stephen King’s horror novel.\nThat same year, he performed as a Soviet medical officer in the film The Hunt for Red October, based on the Cold War-era novel by Tom Clancy.\nLater, he lent sneering gravitas to the role of the double-dealing Cardinal Richelieu in the 1993 adventure movie The Three Musketeers, with Kiefer Sutherland, Charlie Sheen and Chris O’Donnell.\n“Tim Curry was someone I cared deeply about, he was someone I loved working with and I am so lucky to have these memories,” Sutherland said in a statement on Wednesday.\nRich baritone voice\nBorn in the English village of Grappenhall, Cheshire, Curry studied drama at Birmingham University.\nCritics argue he did much of his best work on stage. His first Tony nomination came in 1981 for his performance in the title role of Amadeus, a play fictionalising the great composer Mozart’s interactions with his rival, Antonio Salieri.\nA second Tony nod came in 1993 for his leading role in the musical My Favorite Year. In 2005, he scooped up a third nomination for his portrayal of King Arthur in the zany musical Monty Python’s Spamalot.\nHaving a rich baritone voice, he was also in demand as a voice actor for animated films and television shows. He won a Daytime Emmy Award in 1991 for his voice work on the animated series Peter Pan and the Pirates.\nCurry withdrew from a British stage production in 2011 due to ill health. In 2013, his agent said that he had suffered a stroke but was recovering “in great humor”.\nFrom then on, he used a wheelchair and reduced his workload. In 2024, however, he returned to the big screen, appearing in the horror film Stream.\nCurry, who lived in Los Angeles, never married and had no children. A composer and a singer, Curry also performed with his own rock band and released a handful of albums.", "translation_ja": "", "vocab": [{"word": "cult classic", "definition": "熱心なファンに支持されている映画や作品で、一般的には当初、商業的成功を収めなかったが、時間とともに愛好家の間で高く評価されるようになったもの。"}, {"word": "debilitating", "definition": "身体や精神を弱める、または機能を大きく低下させる状態を表す形容詞。深刻な悪影響を与える。"}, {"word": "hammy", "definition": "演技が大げさで、過度に表現的または劇的な様子を表す形容詞。本来より大きく誇張した表現。"}, {"word": "iconic", "definition": "ある時代や文化を象徴する、または代表する人物や事柄を表す形容詞。広く認識され尊敬される。"}, {"word": "gravitas", "definition": "重厚さ、威厳、落ち着きを持つ様子を示す名詞。舞台人や指導者が備えるべき重大な存在感。"}, {"word": "baritone", "definition": "男性の声の種類で、テノール（高音）とバスト（低音）の中間の音域を持つ声。またはそのような声を持つ歌手。"}]}, {"title_ja": "カタール首相がテヘラン訪問、トランプ大統領はイラン交渉に急がず", "title_en": "Qatar PM to Visit Tehran as Trump Says He's Not Rushing Iran Talks", "summary_ja": "カタールの首相がテヘランを訪問し、イラン当局者と地域の緊張緩和について協議する予定です。トランプ米大統領はアルジャジーラに対し、イランとの交渉を急いでいないと述べており、米国とイスラエルによる対イラン紛争において経済的および軍事的行動の両方が選択肢として残されていることを示唆しています。", "summary_en": "Qatar's Prime Minister will travel to Tehran to meet Iranian officials and discuss regional de-escalation efforts. US President Trump stated to Al Jazeera that he is not in a hurry to negotiate with Iran, indicating both economic and military actions remain options in the ongoing US-Israel conflict with Iran.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/8/27/iran-war-live-trump-not-in-hurry-over-talks-tehran-defends-us-dialogue?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nIran war live: Qatar PM to visit Tehran; Trump ‘not in a hurry’ over talks\nQatar’s PM will meet Iranian officials to discuss ways to de-escalate tensions in the region, foreign ministry says.\nPublished On 27 Aug 2026\n- Qatar’s Prime Minister and Minister of Foreign Affairs Sheikh Mohammed bin Abdulrahman bin Jassim Al Thani will arrive in Tehran on Thursday, where he will meet Iranian officials.\n- US President Donald Trump has told Al Jazeera that both economic and military action “are effective” and he is “not in a hurry” in negotiations with Tehran to end the US-Israel war on Iran.", "translation_ja": "", "vocab": [{"word": "de-escalate", "definition": "緊張や対立の度合いを低下させることを意味します。外交や紛争の文脈で、敵対関係を和らげるために使用される重要な表現です。"}, {"word": "negotiations", "definition": "二者以上が合意に達するために行う正式な議論や協議を指します。ビジネスや国際関係における重要な外交用語です。"}, {"word": "tensions", "definition": "国家間や集団間の緊張した関係や対立状態を示します。政治・国際ニュースで頻出する用語で、警戒感や敵意を含む状況を描写します。"}, {"word": "escalation", "definition": "紛争や対立が段階的に悪化・拡大することを意味します。軍事や政治の文脈で、状況の悪化の進行を表現する際に用いられます。"}, {"word": "ministry", "definition": "国家の行政機関の一部門で、特定の分野を担当する省庁を指します。外務省や防衛省などの政府機関を表す公式用語です。"}]}, {"title_ja": "WHO、42日間の新規感染者ゼロでウガンダのエボラ熱終息を宣言", "title_en": "WHO Declares Uganda Ebola-Free After 42 Days Without New Cases", "summary_ja": "世界保健機関（WHO）は、ウガンダが義務付けられた42日間の監視期間を新規感染者なしで完了したため、エボラ熱の終息を正式に宣言しました。ウガンダは6月後半に感染が終わるまで、合計20人の感染者と2人の死亡者を報告しました。一方、コンゴ民主共和国での症例は増加し続けており、5,600件以上の確認症例があり、ウガンダは現在国境を越えた治療センターを支援しています。", "summary_en": "The World Health Organization has officially declared Uganda free of Ebola after the country completed a mandatory 42-day monitoring period without any new transmissions. Uganda reported 20 total infections with 2 deaths before the outbreak ended in late June. Meanwhile, cases in the Democratic Republic of Congo continue to surge, with over 5,600 confirmed cases and Uganda now supporting treatment centers across the border.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/26/world-health-organization-says-ebola-outbreak-in-uganda-is-over?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "World Health Organization says Ebola outbreak in Uganda is over\nThe international body declared Uganda Ebola-free after 42 days without any new transmission, though cases are rising in DR Congo.\nUganda has been declared free of Ebola, with the World Health Organization (WHO) confirming that the East African country had passed the mandatory 42-day monitoring period without any new cases.\nWHO made the announcement at a joint news conference on Tuesday with Uganda’s Ministry of Health.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Uganda declares end to Ebola outbreak\n- list 2 of 3How the deadliest Bundibugyo Ebola outbreak can be stopped\n- list 3 of 3Ebola cases in DRC hit 5,515 as Pope Leo urges global action to save lives\nBut the declaration came roughly a month after Uganda had declared that the local outbreak was over, based on its own analysis of the virus’s spread.\n“We had assessed the risk, we had assessed the whole chain of transmission and the dynamics of importation of the virus in the country, and we knew that we were free from Ebola,” Diana Atwine, the permanent secretary for Uganda’s Health Ministry, told national broadcaster NTV.\n“However, WHO had to wait because that’s the process. That’s the guideline.”\nAtwine called on countries that had imposed travel restrictions on Uganda during the outbreak to lift them.\n“Unless they have other reasons, they should definitely lift the restrictions off the country, and Ugandans should be free to travel to any country,” she said.\nUganda reported 20 Ebola infections in total, with its last confirmed case recorded on June 21. Two people died from the virus during the outbreak.\nThe last patient was discharged from Mulago National Referral Isolation Centre on July 16, and the Health Ministry formally declared the outbreak over on July 28.\nThe outbreak in the Democratic Republic of the Congo (DRC), by contrast, is accelerating.\nConfirmed cases in the DRC reached 5,656 as of August 25, an increase of 72 from a report released one day prior. A total of 2,715 deaths have been recorded, according to the latest government data cited by the European Centre for Disease Prevention and Control.\nIturi province, in the northeast of the country, remains the epicentre of the outbreak, with more than 4,700 people infected.\nUganda shares a border with the northeast part of the DRC, stretching more than 877km (500 miles).\nKasonde Mwinga, the WHO’s representative for Uganda, said in Wednesday’s news conference that the country was supporting treatment and laboratory capacity at two sites across the border, in Aru and Kasenyi, both part of the Ituri province.\nMwinga added that the model for cross-border collaboration could be expanded regionally.\nAlready, Uganda has announced it would open two additional Ebola treatment centres in the DRC, bringing the total to four.\nOn Monday, Ugandan and Congolese officials also met in Kampala to review a bilateral memorandum of understanding on cross-border health security.\nKenneth Akiiri, the undersecretary for Uganda’s Health Ministry, called for the WHO and the Africa Centres for Disease Control and Prevention (CDC) to mobilise further resources.\n“When you are vulnerable and you have littler resources, you are supposed to raise an alarm for help,” Akiiri said in a joint statement.\nFor his part, DRC delegation head Adelard Lufungula urged strong action to combat the virus. “We want to fight Ebola like a war,” he said.", "translation_ja": "", "vocab": [{"word": "mandatory", "definition": "法律や規則によって必ず従わなければならない、強制的な。ここでは「義務付けられた42日間の監視期間」という意味で使用されています。"}, {"word": "transmission", "definition": "病気やウイルスが人から人へ、または動物から人へ移ること。感染の伝播を意味します。"}, {"word": "epicentre", "definition": "問題や流行の中心地点。ここではエボラ熱感染が最も多く発生している地域を指します。"}, {"word": "bilateral", "definition": "二つの国や組織の間で結ばれた、相互的な。両国間の協力や合意を意味します。"}, {"word": "mobilise", "definition": "資源や人員などを集結させて活動できるようにする、動員する。ここでは援助資源を集めることを意味します。"}, {"word": "vulnerable", "definition": "攻撃や被害を受けやすい状態にある。経済的・社会的に弱い立場を表します。"}]}, {"title_ja": "トランプ大統領が米電力網の外国製機器を巡り非常事態を宣言", "title_en": "Trump Declares National Emergency Over Foreign Equipment in U.S. Power Grid", "summary_ja": "トランプ大統領は2026年8月26日、米国の広域電力系統における外国製機器の購入・設置をブロックする非常事態を宣言し、国家安全保障上の懸念を理由として挙げました。この命令は米国の制裁下にある国々または敵対的と判断された国々からの機器を対象とし、外国政府がインフラを破壊する可能性のあるデジタルバックドアに関する懸念が特に強くなっています。このような動きは、AIデータセンターと高度な技術が米国の電力安定供給への依存度を高めるにつれて、電力網の脆弱性に対する不安の増大を反映しています。", "summary_en": "President Trump declared a national emergency on August 26, 2026, blocking the purchase and installation of foreign-made equipment in America's bulk-power system, citing national security concerns. The order targets equipment from countries under U.S. sanctions or those deemed hostile, with particular concern about potential digital backdoors that could allow foreign governments to sabotage critical infrastructure. The move reflects growing anxiety over grid vulnerability as AI data centers and advanced technology increase U.S. dependence on stable electricity.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-declares-emergency-over-foreign-equipment-in-us-power-grid/article71394176.ece", "state_media": false, "category": "政治", "full_text": "U.S. President Donald Trump declared a national emergency on Wednesday (August 26, 2026) over foreign-made equipment inside the country’s electric grid, saying the growing need for power has made the system a target for hostile governments.\nThe executive order blocks companies from buying, importing or installing certain foreign-made parts used in what the government calls the bulk-power system.\nA bulk-power system is the network of high-voltage lines, substations and power plants that transmits electricity across the country.\nIn the order, Mr. Trump said the boom in AI data centres and other advanced technology projects has left the United States more dependent on stable electricity than ever.\nIf the grid went down, he argued, the damage would be far worse than in the past.\nThe order also warns that foreign-built equipment could contain hidden digital “backdoors” in its software — secret access points that would let another country control or shut off the equipment.\nThe order applies to countries under U.S. arms embargoes or sanctions, or governments the administration decides are working against American interests.\nChina is not named, but Chinese-made grid parts have worried U.S. security officials for years.\nWashington has used a similar playbook before, pressing allies to keep Huawei and fellow Chinese telecom supplier ZTE out of new mobile phone networks and arguing that Beijing could force the companies to spy or sabotage.\nBoth were later blacklisted by U.S. regulators.\nPublished - August 27, 2026 04:22 am IST", "translation_ja": "", "vocab": [{"word": "bulk-power system", "definition": "高電圧線、変電所、発電所のネットワークで、全国に電気を送電するシステムのこと。電力インフラの中核部分を指す技術用語です。"}, {"word": "backdoor", "definition": "ソフトウェアやシステムに組み込まれた秘密のアクセスポイントで、認可されていないユーザーが不正にアクセスできるようにするもの。サイバーセキュリティの文脈でよく使用されます。"}, {"word": "embargo", "definition": "政治的・経済的理由から、特定の国との貿易や商取引を禁止する政府の措置。国家間の紛争解決の手段として機能します。"}, {"word": "sabotage", "definition": "敵対行為や破壊活動として、意図的に機器やシステムを破壊または妨害すること。スパイ活動や テロ対策の文脈で使われます。"}, {"word": "playbook", "definition": "繰り返し使用される戦略や方法の集合。ビジネスや政治で、過去に成功した対応パターンを指します。"}, {"word": "vulnerability", "def
