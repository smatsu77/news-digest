who had, at any point in their life, made a mistake that was perceived as injurious to women or people of color, the inflexible and frequently impractical notions of what can be said, taught and legislated raised the specter of a dictatorial left that devalued individual liberties and threatened our freedom of speech almost (though not quite) as much as the extreme right.\nIn the current issue of the Atlantic, there’s an eloquent and terrifying essay by Tyler Austin Harper, explaining why the absurd and damaging policies regarding the need to root our racism in the college curriculum and in the larger society made him decide that he – a Black scholar with a tenure-track appointment to teach interdisciplinary humanities in an environmental-studies program – had no choice but to abandon academia forever.\nIn 2021, it was decided that every department at Bates College, where Harper worked, must offer two courses that would “identify areas where white supremacy, ‘colonial’ frameworks, and other forms of bias might be lurking in curricula and major requirements”. This would include the science classes, taught by faculty who often had no idea how to address these complex topics.\nSuch courses might include a math class aimed to help students understand “the role of mathematics as a gatekeeper and driver of injustice”. A colleague suggested that when a student or teacher made a remark perceived to be insensitive, another student should call out “oops” or “ouch” as a helpful corrective.\nThough some of the more extreme policies were eventually rescinded, the final effect was to make Harper decide that he no longer felt capable of functioning with any degree of personal freedom and integrity on a college campus.\nThe policies implemented at Bates were, I assume, typical of the Woke 1.0 ideology to which AOC was referring. Policies like those, which were heavy-handed interventions in curricula and teaching norms – and the headlines they generated – made it all too easy for the far right to ridicule the ideals of the more moderate and left-leaning Americans, and to use that ridicule as a tool to make sure that the old-fashioned, constitutionally guaranteed aspects of our democracy – including freedom of speech and assembly – could be characterized as “radical” and even “communist”.\nThe infighting and mutual recrimination that this inspired between progressive and centrist Democrats made it all too easy for the right to dismiss the worthiest of ideals – freely available healthcare, childcare and education, an end to inflation and to the profiteering that has enabled billionaires to widen the income disparity so harmful to average US families – as the kind of folly that allowed the Bates community to describe an argument between white and Black students as a “lynching”.\nSo once again, I agree with AOC. We need to focus on what’s politically viable, on what is attainable, on what the American people so desperately need. Censorship and repression are not only counterproductive but destructive, regardless of whether those efforts come from the right or the left.\nThe midterms are approaching. Our country sta", "translation_ja": "", "vocab": [{"word": "weaponized", "definition": "本来の目的とは異なる形で、特に政治的または社会的攻撃の手段として意図的に利用されること。ここでは「ウォーク」という言葉が右翼によって進歩派を批判するための道具として使われることを指す。"}, {"word": "inflexible", "definition": "柔軟性がなく、変更や調整ができない状態。融通の利かない、厳格であることを意味し、対応力に欠けている様子を表す。"}, {"word": "devalued", "definition": "価値を低下させること、軽視すること。ここでは個人の自由が軽んじられたことを示している。"}, {"word": "tenure-track", "definition": "大学で終身職につながるキャリアパス。教授職の安定した地位を目指す職位のこと。"}, {"word": "curricula", "definition": "複数のカリキュラム、つまり教育機関が提供する全体的な教育内容や授業科目計画を指す。"}, {"word": "recrimination", "definition": "相互に非難し合うこと、報復的な非難。グループ内での対立や責任の押し付けを表す。"}]}, {"title_ja": "アフガニスタン女性との連帯：外国政府が支持すべき理由", "title_en": "Standing With Afghan Women: Why Foreign Governments Must Support Their Resistance", "summary_ja": "著者は、ほとんどの外国政府がこれを支援していないにもかかわらず、アフガニスタン女性がタリバン弾圧に対する執拗な抵抗運動を構築していると主張しています。彼女は、外国政府がタリバンとの外交正常化を再検討し、代わりにアフガニスタン女性に投資すべきだと主張しており、彼女たちは多元的なアフガニスタンの将来の再建のための基礎を保護できる最も組織的な勢力です。", "summary_en": "The author argues that Afghan women have built a tenacious resistance movement against Taliban repression despite extraordinary threats, organizing underground schools and documenting abuses while most foreign governments have failed to support them. She contends that foreign governments should reconsider diplomatic normalization with the Taliban and instead invest in Afghan women, who represent the most organized constituency capable of preserving the foundations for a pluralistic Afghanistan's future reconstruction.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/afghanistan/standing-afghan-women", "state_media": false, "category": "オピニオン", "full_text": "In the five years since the Taliban seized power in Kabul on August 15, 2021, Afghan women have become the most persistent source of resistance to the group’s efforts to transform Afghanistan. The exclusion of women and girls from public space is at the center of the Taliban’s extremist state-building project—a project that has also included dismantling institutions, subordinating the judiciary to religious authority, eliminating political opposition and civic activity, silencing independent media, and diverting male and young female students from schools with broad-based formal curricula to madrasahs that instill the Taliban’s ideology.\nMany Afghan women are refusing to accept this radical transformation of Afghanistan’s social and political order. Some are protesting in the streets despite the extraordinary threats they face. Others are organizing underground schools to fill gaps in education and collaborating closely with Afghans in exile to prepare legal action against the Taliban’s abuses. Against the odds, Afghan women have built a tenacious resistance movement, inside and outside the country, that is working to alleviate conditions and provide opportunities, however limited, for women and girls.\nYet most foreign governments, including those who have publicly condemned the Taliban’s swift and sweeping repression of women since 2021, have done little to support Afghan women’s efforts. Indeed, many are expanding their diplomatic engagement with the Taliban, which may further embolden the group to tighten its repression and advance its extreme policies. The Taliban’s odious treatment of women should in itself be sufficient to compel foreign countries to reconsider their approach. But the strides the Afghan women’s movement has made offers them another reason to resist normalization and instead to invest directly in Afghan people. Afghan women are the most organized constituency resisting the Taliban’s hardline agenda—and they are preserving the human capital, institutions, and political networks with which a stable and pluralistic Afghanistan could one day be rebuilt.\nSTILL IN THE FIGHT\nAfghan women had received education and participated in professional life—if unevenly—for decades before the Taliban first seized power in 1996 and imposed oppressive policies that dismantled women’s rights and opportunities. After the Taliban regime fell in 2001, Afghanistan, with the support of the United States and other international partners, made remarkable strides in restoring and advancing the rights of the country’s women and girls. By 2021, an entire generation of women had grown up with some access to education. Women, especially in urban centers, worked as doctors, lawyers, judges, journalists, and public servants. They became a significant presence in political life, filling more than a quarter of the seats in Afghanistan’s parliament and serving as ministers and diplomats.\nAfter the Taliban returned to power in 2021, the group swiftly imposed policies that reversed decades of progress for women and girls. In addition to barring women’s access to education, employment, and public services, it dismantled key institutions such as the Ministry of Women’s Affairs, the Afghan Independent Human Rights Commission, and the High Commission to Eliminate Violence Against Women. The regime also closed women’s shelters, imposed a strict dress code, and restricted women’s access to public spaces. Every year, these measures have become more expansive and entrenched, reinforced by the 2024 Law on the Promotion of Virtue and the Prevention of Vice and the promulgation of more than a hundred decrees that touch on nearly every aspect of women’s lives. More than 3,000 morality inspectors have been deployed across the country to enforce the Taliban’s decrees in public spaces and to pressure male family members to ensure women’s compliance within the home. One former civil society worker described the suffocating effect of these laws in testimony related to the UN Security Council, commenting, “I am afraid that they will ban women from breathing without a man’s permission.” Another Afghan woman compared living under the Taliban to “being buried alive.”\nYet even in these draconian conditions, Afghan women have continued to fight for their rights, meeting the Taliban’s repression with extraordinary acts of courage. Within weeks of the group’s return to power, scores of women marched through the streets of Kabul, Herat, Mazar-i-Sharif, and other cities to demand that the Taliban reverse their newly introduced restrictions. The UN has documented the Taliban’s brutal response to these demonstrations, which has included arbitrary arrests of protesters and their families, enforced disappearances, rape, torture, and other forms of intimidation and violence. Yet women activists have remained defiant, and at times they have drawn support from men. In June of this year, women and men in Herat took to the streets to protest the detention of a", "translation_ja": "", "vocab": [{"word": "tenacious", "definition": "強固で粘り強いという意味。何度の困難や圧力を受けても決不放棄する態度や運動を描写する際に用いられます。"}, {"word": "normalization", "definition": "国際関係において正常な外交関係の確立を意味します。特に対立関係にあった国との関係を通常に戻すプロセスを指します。"}, {"word": "draconian", "definition": "極めて厳しく、酷い法律や政策を表現する言葉です。人道的配慮を欠く極端な統制措置を示します。"}, {"word": "constituent", "definition": "選挙区の有権者、または政治的グループを構成する部分を意味します。特定の利益や立場を代表する集団を指します。"}, {"word": "embolden", "definition": "人や団体に自信や勇気を与えるという意味。ここでは、外国の弱い対応がタリバンに更なる強硬政策を取らせると述べています。"}, {"word": "entrenched", "definition": "堅く確立された、根深い状態を表します。政策や権力がしっかりと定着し、簡単には変わらない様子を示します。"}]}, {"title_ja": "イラン危機の長く影を落とす影響", "title_en": "The Long Shadow of the Iran Shock", "summary_ja": "ホルムズ海峡の閉鎖は深刻な世界的エネルギー危機をもたらす可能性がありましたが、市場条件と以前のエネルギー安全保障への投資により、石油価格の急騰を防ぎました。しかし著者は、世界の回復力は一時的であり衰退しており、エネルギー安全保障対策を強化する新たな取り組みがなければ、将来の供給途絶はより大きな損害をもたらす可能性があると警告しています。", "summary_en": "While the closure of the Strait of Hormuz could have triggered a severe global energy crisis, market conditions and prior investments in energy security prevented catastrophic oil price spikes. However, the author warns that the world's resilience is temporary and eroding; without renewed efforts to strengthen energy security measures, a future disruption could prove far more damaging as inventories deplete and vulnerabilities mount.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/long-shadow-iran-shock", "state_media": false, "category": "オピニオン", "full_text": "By almost any measure, the world should be suffering a far more severe energy crisis. The Strait of Hormuz, through which roughly one-fifth of global oil and liquefied natural gas supplies normally passes, has been largely closed for months. Yet when considered against the nightmare scenarios contemplated at the war’s outset, oil prices have remained low and natural gas markets have proved resilient. The global economy has so far avoided the kind of recession that many past energy shocks produced.\nIt would be tempting to conclude that the dangers of energy supply disruptions have been overstated, but such complacency would be misguided. The Hormuz crisis has so far led to only modest oil price spikes thanks to an unusual combination of favorable market conditions and years of investment in energy security measures. Before the war began, oil markets were oversupplied, inventories were relatively high, Saudi Arabia and the United Arab Emirates had built pipelines around the strait, and governments and companies had amassed emergency and commercial stocks. In addition, China helped stabilize the global oil balance by reducing its imports, drawing on its immense capacity to curb how much oil it buys for stocks, holds in inventory, refines for export, and consumes domestically.\nThese conditions may not endure. If the conflict enters a new phase of intense fighting that threatens to spill across borders and continues to block the strait, oil markets, now stressed by shortages of refined products such as diesel and jet fuel, could see crude oil prices surge higher. But even if hostilities in the region de-escalate, a persistent risk to traffic through the strait will likely remain, with passage either outright controlled by Iran or, at the very least, subject to Iranian disruption at any time. A more optimistic scenario in the next several months seems a chimera, barring major and unlikely change in Tehran.\nIn preparing for these scenarios, as well as new crises in the more distant future, the world should not take solace in the relatively benign outcome of the last five months for energy markets. The cushions that helped the world manage those months are now more threadbare: inventories have been depleted, demand is recovering, alternative routes are becoming more vulnerable, and infrastructure continues to come under fire and, in some cases, will take years to repair. A second phase of the Hormuz crisis could prove substantially more damaging than the first.\nMoreover, the first phase of the crisis was not as painless as headline global oil prices suggested. The relatively modest movement in global benchmark prices concealed a strikingly uneven distribution of pain, as countries in Asia and Europe endured high prices, shortages, rationing, fiscal strain, and forced reductions in consumption, while the United States and China demonstrated newfound levels of insulation and influence. Delayed effects also loom on the horizon. Because of the crunch in refining, diesel and other crude products are priced much higher than they normally would be at current headline oil prices. And the shock is making it harder and more costly for Europe to replenish its natural gas inventories, leaving the continent with lower-than-usual storage levels and more vulnerable to energy and geopolitical coercion in the coming winter.\nThe past five months have revealed not that the world has become immune to energy crises but that market forces, policy, and government investments in energy security have paid off. Without renewed efforts to rebuild, in today’s geopolitically fractured world that resilience will quickly erode. Before a next phase of this crisis unfolds, therefore, policymakers must analyze how this resilience came to be. Moreover, they must acknowledge that, as the energy system has changed since the 1970s, so too has the way energy shocks reverberate around the world, and the measures needed to safeguard against them. Understanding these dynamics will better position the world for the next inevitable energy shock.\nWHAT COULD HAVE BEEN\nWhen Tehran closed the Strait of Hormuz days after U.S. and Israeli attacks in late February, the head of the International Energy Agency (IEA) called it the “the largest supply disruption in the history of the global oil market.” But even as the strait remained almost entirely closed for nearly four months—until Washington and Tehran signed a memorandum of understanding in mid-June—Brent crude averaged just over $100 per barrel, up from around $70 per barrel when the war began. The peak of $126 per barrel, in April, was far below the $200 per barrel that veteran analysts had warned was possible. Even after Tehran closed the strait to oil traffic again in July, after the cease-fire collapsed, the barrel price fell into the $80 range.\nMany factors contributed to this relatively muted price response. As would be expected, oil demand was forced to decrease, to match available supply. It fell by roug", "translation_ja": "", "vocab": [{"word": "complacency", "definition": "危機感の欠如や警戒心の低下を指します。安心しきって油断している状態を示す言葉として、特にビジネスやリスク管理の文脈で使用されます。"}, {"word": "resilience", "definition": "困難や障害から回復する能力を意味します。エネルギー市場や経済が外的なショックに耐える力を指します。"}, {"word": "threadbare", "definition": "元々は布がすり減って薄くなった状態を指しますが、比喩的に資源や対策が著しく枯渇している状態を表します。"}, {"word": "disruption", "definition": "供給や流通などの正常な機能が中断・妨害される状況を指します。ビジネスやエネルギー市場での中断を示します。"}, {"word": "coercion", "definition": "強制や圧力によって行動を強いることを意味します。地政学的な影響力を行使して国家に意思を押し付ける状況を指します。"}, {"word": "benchmark", "definition": "比較や評価の基準となる指標を意味します。石油価格などの市場指標として参照される代表値を示します。"}]}, {"title_ja": "ウクライナの平和仲介方法", "title_en": "How to Broker Peace in Ukraine", "summary_ja": "著者は、ロシア・ウクライナ戦争終結に向けた米国の外交努力は活動を示しているが、戦略的組織化に欠け、成果を生んでいないと主張している。数十年の国際仲介経験に基づき、成功する平和交渉には、綿密に設計されたプロセス、多国間の関与、当事者による明確な所有権、そして継続的な専門的仲介が必要であるが、これらはウクライナ交渉では現在のところ欠けていると論じている。", "summary_en": "The author argues that while U.S. diplomatic efforts to end the Russia-Ukraine war show activity, they lack strategic organization and have produced no results. Drawing from decades of international mediation experience, the piece contends that successful peace negotiations require well-designed processes, multi-party involvement, clear ownership by parties, and sustained professional mediation—conditions currently absent in Ukraine talks.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/how-broker-peace-ukraine", "state_media": false, "category": "オピニオン", "full_text": "Since early 2025, the United States has made significant diplomatic efforts to end the war between Russia and Ukraine. Negotiators have met in Abu Dhabi, Berlin, Geneva, Istanbul, Paris, and Riyadh; envoys have shuttled to Moscow and Miami. Those efforts deserve credit. But activity is not strategy—and, as demonstrated by the massive strikes across Ukraine and Russia in recent weeks, it has yet to produce results.\nTo make real progress toward peace, Washington should apply lessons from decades of international mediation experience. Although all conflicts are unique, past negotiations show that getting the process right is essential, and they offer insights about which approaches tend to work and which do not. If talks are well organized and parties have a sense of ownership, agree on the process, and build personal relationships, negotiations are more likely to succeed. Without those conditions, efforts to end the fighting are apt to falter, and the strategic, economic, and human costs will continue to mount.\nFor any process even to begin, the parties must, of course, be willing to engage. Although Kyiv has said it wants a cease-fire and negotiations, Russian President Vladimir Putin’s recent rhetoric—he called Ukraine’s government a “junta” in May—and the intensifying attacks on Ukrainian cities suggest that he is not in a talking mood.\nYet Putin is under the most significant economic, military, and political pressure since he launched the full-scale invasion in February 2022. His forces advanced by less than half a square mile per day in June 2026—a reduction of more than 90 percent from their rate of gain in June 2025. Meanwhile, Ukraine’s increasingly effective long-range drone strikes are disrupting Russia’s energy sector and reducing state revenues. Kyiv’s attacks on refineries and logistics infrastructure are affecting everyday life in major cities. With public sentiment showing signs of strain, the Kremlin faces a more difficult task in delivering a strong result for the ruling party in September’s Duma elections. None of this means that Putin will choose negotiations over fighting. But given the pressure he is now under, that possibility should at least be tested.\nA well-designed process is the best way to gauge Putin’s intentions—and to shape them. That is because leaders pursue negotiations not only when they are struggling to achieve their military objectives but also when they see a credible alternative to war. A serious process can help the parties envision how a negotiated outcome could address their core interests and concerns. Without one, peace is a distant abstraction.\nNOT A SOLO ACT\nMediating a full-scale war is among the hardest undertakings in international affairs. When hostilities intensify and become protracted, hatred, resentment, and the desire for revenge make war self-sustaining. Leaders typically come to see themselves as locked in an existential struggle against a malign and implacable enemy. They tend to treat negotiations as a futile distraction or a step that could undermine their political standing at home.\nTo even have a chance at overcoming such obstacles, mediation requires sustained and continuous efforts by a highly capable team. That means assembling a group of individuals whose primary job is ending the conflict and who have professional expertise and deep knowledge of its history and dynamics. Mediation also often involves more than one third party. Successful processes have featured a lead mediator working alongside supporting states or organizations. France, Germany, Italy, Russia, and the United Kingdom formed the contact group that backed the U.S.-led negotiations that ended the Bosnian war in 1995. Chile, Cuba, Norway, and Venezuela all played a role in the 2016 talks that concluded the Colombian government’s half-century war with the Revolutionary Armed Forces of Colombia (known by its Spanish acronym, FARC). In Ukraine, by contrast, Washington has largely gone it alone. European allies, Gulf partners, and Turkey have been involved, but only at the margins.\nAt minimum, European governments, as major stakeholders in both Ukraine’s future and the security of the continent, should be involved as parties to the talks. Given their deep mediation expertise, they should cosponsor the process alongside Washington. Europe is not short of officials with relevant experience. Jonathan Powell, the British government’s chief negotiator during the Good Friday talks, now serves as the British national security adviser. Washington could enable European participation by establishing a contact group—perhaps modeled on the body that supported the Bosnian peace agreement—in which key European governments hold defined roles and responsibilities, not merely observer status. Such a structure would achieve greater diplomatic coherence and help marshal resources, expertise, and political support as required.\nDESIGN MATTERS\nThere is no standard template for a successful negotiation. Bu", "translation_ja": "", "vocab": [{"word": "mediation", "definition": "紛争当事者間に仲介者が入り、交渉を促進して解決を支援するプロセス。国際紛争や労働紛争などで用いられる。"}, {"word": "protracted", "definition": "長期間続く、引き延ばされた状態を示す形容詞。終わりが見えない継続的な状況に対して使用される。"}, {"word": "coherence", "definition": "統一性、一貫性、または明確な関連性を示す名詞。複数の要素がまとまって効果的に機能する状態を指す。"}, {"word": "implacable", "definition": "和解できない、譲歩しない、または厳しい性質を表す形容詞。対立や敵意が根深く変わりようがないことを示す。"}, {"word": "sustaining", "definition": "継続させる、支え続けるという意味の動詞。ある状態や活動を維持し続けることを表す。"}, {"word": "cosponsor", "definition": "複数の主体が共同で提案者となること。国際協力や公式プロセスにおいて複数国が等しく責任を負うことを指す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-16 21:06 JST";
  renderTabs();renderList();
})();
</script>
</body>
</html>
