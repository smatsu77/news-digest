ussian army.\nUkraine's defence ministry said the latest attack meant that seven out of 10 of the largest Wildberries logistics centres had been \"disabled\".\nBoth warring sides accuse each other of targeting civilians.\nIn Ukraine, a 66-year-old man and 64-year-old woman died after a private house was hit by a guided aerial bomb in the Zaporizhzhia region, officials said.\nTwo more people were killed in Kryvyi Rih, a city in Dnipropetrovsk.\nOfficials in Sumy, Donetsk and Kherson also reported one death in each region, including a 51-year-old killed in a drone strike in Sumy.\nIn Kyiv, air-raid sirens sounded four times overnight as the Ukrainian capital came under Russian attack. At least six people, including a child, were reportedly injured, Mayor Vitali Klitschko said.\nRussia said its attacks on Kyiv on Saturday night targeted a FirePoint facility producing parts for Ukrainian Flamingo missiles and a factory making components for drones.\nA book market in the city's Pochayna district was damaged in the strikes. Burnt books could be seen lying on the ground, while firefighters continue to douse the flames.\nSixty-nine-year-old Valentina's husband owned a market stall.\nLooking through the rubble, she told the BBC: \"All these books in the street were from my husband's stall in the market - I recognise them on the floor.\"\nShe added: \"You never think that it will happen to you.\"\nVinyl store owner Luba, 42, said she has lost 500,000 hryvnias (£8,262) worth of stock.\n\"This business was my baby - many of the vinyls destroyed were rare and irreplaceable,\" she told the BBC. \"I want Russia to disappear from this Earth.\"\nUkrainian President Volodymyr Zelensky said 13 regions had come under attack this week, with Russia launching more than 1,550 attack drones, nearly 1,560 guided aerial bombs and 62 missiles.\n\"Wherever the Russians can reach with their ballistic missiles, they strike civilian infrastructure,\" he said.\nFor years, Ukraine has relied on US supplies of Patriot interceptor missiles to shoot down Russian ballistic missiles.\nBut the US has used many of its stockpiles during its war with Iran and is reluctant to give up more.\nAfter initially offering Ukraine the licence to make Patriots in early July, President Donald Trump later denied the US had agreed to \"give away that kind of technology\".\nThroughout the war, as well as relying on Western partners, Ukraine has had to innovate - its home-made drones are responsible for the attacks deep into Russian territory.\nAnd it will be able to strike Russia with domestically-made ballistic missiles within three to six months, the former Ukrainian Defence Minister Mykhailo Fedorov told CBS News, the BBC's US partner.\nRussia launched its full-scale invasion of Ukraine in February 2022, and currently controls approximately a fifth of Ukrainian territory.\nWith marginal gains being made by either side in an attritional ground battle along a lengthy front line, the war has predominantly become an aerial one, with exchanges of missiles and drones aimed at degrading each country's warfighting ability.\nRelated topics\n  - Published3 days ago\n  - Published5 days ago\n  - Published2 days ago", "translation_ja": "", "vocab": [{"word": "attritional", "definition": "消耗戦的な、損耗を伴う。戦争において、継続的な損失によって相手方を弱体化させることを目的とする戦術を指す。"}, {"word": "degrading", "definition": "低下させる、機能を損なわせる。軍事用語として、敵の戦闘能力を段階的に削弱することを意味する。"}, {"word": "logistics", "definition": "後方支援、兵站。軍需物資や装備品の調達、輸送、供給に関わる戦争遂行の基盤となる活動。"}, {"word": "reluctant", "definition": "嫌々ながらの、進んでない。何かをするのに抵抗や不本意な感情を示すことを表す。"}, {"word": "interceptor", "definition": "迎撃ミサイル、防空ミサイル。飛来する航空機やミサイルを撃ち落とすために設計された兵器システム。"}, {"word": "ballistic", "definition": "弾道の、弾道ミサイル。発射後は自由落下の軌道を描くロケット推進式の兵器を指す。"}]}, {"title_ja": "ギリシャの島で双子火災が発生、2人死亡、数百人が避難", "title_en": "Twin fires kill two and evacuate hundreds on Greek island near Athens", "summary_ja": "日曜日の午後、アテネ近くのサラミナ島で2つの火災がほぼ同時に発生し、2人が死亡し、約500人の住民が避難した。約200人の消防隊員が航空機、消防車、給水タンカーを配置して、2つの火災が1つの大きな火災に合体することを防いだ。1つの火災は日曜日の夜までにコントロール下に入ったが、影響を受けた地域では散発的な火災が燃え続けた。", "summary_en": "Two people died and approximately 500 residents were evacuated from the island of Salamina near Athens after twin fires broke out almost simultaneously on Sunday afternoon. About 200 firefighters deployed aircraft, fire engines, and water tankers to prevent the two blazes from converging into a single larger fire. One fire was brought under control by Sunday evening, though scattered blazes continued to burn in the affected areas.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c87nnwlpe5no?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Two dead and hundreds evacuated after twin fires break out on Greek island\n- Published\nTwo people died and and hundreds were evacuated after two fires broke out \"almost simultaneously\" on a Greek island near Athens on Sunday afternoon, officials said.\nAbout 200 firefighters were deployed to keep the twin fires from converging on the island of Salamina, which was under a high wildfire risk on Sunday.\nThe first blaze was reported at 14:40 local time (11:40 GMT) near the island's south coast and spread rapidly due to high winds, followed by a separate fire some 20 minutes later in the east. Their cause is not yet known.\nOne of the fires had been brought under control and evacuations completed by Sunday evening, Greek media report, with 500 people having left the island by sea.\nThe first blaze broke out in a forested residential area in Peristeria, a southern city on the island, fire official Vasilios Vathrakoyannis said in a statement.\nFirefighters attending the blaze found two bodies at the scene, he said. The city's mayor told Greek media they were believed to have been a couple.\nOfficials continued to battle scattered blazes there late on Sunday, while the second fire which began in the eastern town of Selinia was said to have \"no active front\".\nTwo coast guard vessels and a fire department vessel will remain in the area for surveillance and assistance.\nAt least 10 other people suffered burns or showed \"symptoms of smoke inhalation\", five of whom had been taken for treatment locally, Greek Health Minister Adonis Georgiades said on X.\nA number of aircraft and 50 fire engines, assisted by water tankers and construction machinery, were deployed to try and tackle the two fires.\nSalamina Deputy Mayor Thodoris Zannis earlier said this was to keep the fires from burning over a mountain on the island and meeting to form a single blaze.\nFive patrol boats and several other private vessels were sent to the area for assistance.\nSalamina sits just west of Athens and has some 37,000 residents, many of them elderly.\nFirefighters across Europe have been facing a series of wildfires this weekend, including officers in Belgium spending a third day beating back flames in the country's largest nature reserve, Hautes Fagnes.\nThe wildfire - described as the largest in the country's recent history - has more than doubled in size in 24 hours.\nMeanwhile, at least one person died and dozens were injured in a wildfire that tore through Croatia's coastline overnight on Friday.\nIt was described by Croatia's fire chief Slavko Tucakovic as \"one of the worst\" blazes in the country's history and saw around 1,200 residents and tourists evacuated.\nThe EU's climate monitoring service, Copernicus, has confirmed that western Europe experienced its hottest June-to-July period on record.\n  - Published55 minutes ago\n  - Published2 days ago\n  - Published1 day ago", "translation_ja": "", "vocab": [{"word": "converging", "definition": "複数の事柄や物が1つの点に向かって集まること、または合わさること。この記事では、2つの火災が1つになることを防ぐという意味で使用されている。"}, {"word": "deployed", "definition": "人員や資源を特定の目的のために配置すること。軍事や緊急対応の場面でよく使われる。"}, {"word": "simultaneously", "definition": "2つ以上のことが同じ時間に起こること。ほぼ同時に、という意味で使用される。"}, {"word": "blaze", "definition": "激しく燃える火、または大規模な火災のこと。通常、野火や建物火災などの大火を指す。"}, {"word": "surveillance", "definition": "特定の地域や状況を監視・観察すること。警察や警備活動でよく用いられる用語。"}, {"word": "inhalation", "definition": "気体や煙を鼻や口から吸い込むこと。医学用語としても使われる。"}]}, {"title_ja": "ストーリーブリッジの火災生存者が家への帰宅を開始", "title_en": "Stourbridge Fire Survivors Begin Returning Home After Devastating Blazes", "summary_ja": "ストーリーブリッジの壊滅的な火災で19軒の家屋が完全に破壊された後、住民たちが帰宅を始めました。消防士たちは死者がいなかったことは奇跡的だと述べています。避難した96世帯のうち85世帯が帰宅を許可され、火災による被害を受けた13世帯も帰宅しました。カウンセリング、仮設住宅、8万ポンド以上の募金などの支援体制が構築されています。", "summary_en": "Residents of Stourbridge are returning home after devastating fires destroyed 19 properties across five streets, with firefighters calling it miraculous that no deaths occurred. Of 96 evacuated households, 85 families have been cleared to return, while 13 others with fire damage have also gone back home. Support services including counseling, temporary accommodation, and fundraising efforts totaling over £80,000 have been mobilized to help affected families rebuild.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cr49932qrqno?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "People who fled Stourbridge fires start to return home\n- Published\nPeople who had to flee their houses during the devastating Stourbridge fires are starting to return home, as a firefighter said it was \"a miracle no one has died\".\nMany families are only just discovering the extent of damage to their homes as West Midlands Fire Service allowed some behind the cordon after three days.\nNineteen properties across five streets have been fully destroyed. Eight households have been able to view the shells of their former homes.\nAerial images of the scene appear to show some houses have remained entirely intact while those next to them have been burnt to the ground.\nResidents of Brunswick Gate, Landsgate, Ounty John Lane, Quarry Park Road and Racecourse Lane were asked to gather to speak to fire chiefs one by one.\nThey then learned if it was safe to return or if their home needed significant repairs or had been lost entirely.\nEarlier, Dudley Council's chief executive Balvinder Heran said 96 evacuated houses had escaped damage with 85 families able to return.\nThirteen households whose properties were damaged by fire have also been able to go back home.\nPraying for rain\nA firefighter who wished to remain anonymous told the BBC he had \"never prayed for rain so much\".\n\"All I can say is in 23 years I've never seen anything like it,\" he said.\n\"We have not stopped - no food, no rest, it's onto the next [fire].\n\"Fire spreads so, so fast and it's a miracle that no one has died.\"\nThe blaze in Stourbridge was one of several that broke out across England and Wales on Thursday, the hottest day of the year so far. Many fires were in the West Midlands.\nPritpal Boyal said his in-laws discovered their house on Brunswick Gate was unscathed.\n\"It was a miracle because a lot of the houses opposite had all gone,\" he said.\n\"It's quite soul-destroying because you've grown up with these people, there's a lot of elderly there as well.\n\"There was an instance where two children came up to me asking what they're going to do, where they're going to live.\n\"They're definitely going to need some counselling out there for the families that have lost their homes completely.\"\nAmong those who have been able to return home are the Abdullah family, who fled as they were preparing to head to a local Wetherspoons pub to celebrate 18-year-old Dominic's A-level results.\nDominic said being evacuated had been \"complete chaos\", but his family were grateful their house had been unaffected.\n\"We are so so lucky and endlessly grateful for the brave firefighters,\" he said.\n\"We're hoping for the best for the people who have been affected and their families, all the firefighters and all our friends.\"\nHe told the BBC nothing could describe the feeling of watching his neighbours' houses burn.\n\"Seeing the houses go down, seeing neighbours we know - their rooftops just burning, the whole street covered in smoke,\" he said.\nHis mother said they smelt smoke and ran for their lives when they saw their neighbours leaving their homes.\nSpeaking about the community rallying around the people affected, Dominic said: \"It really has inspired a lot of hope for us, it's really helped us get through this, seeing the way our community's come together.\"\nWhile the fire has died down, Dominic said the atmosphere was \"not entirely peaceful\".\n\"Even just seeing our house from the outside when we're going in, the air is different,\" he said.\n\"Everyone has been affected ... there is no doubt in my mind that this will have an impact way beyond just these coming days.\"\nDavid Price said he was feeling \"very grateful\" that his house had survived the inferno.\nAcross the street, however, his neighbours' homes have been gutted.\n\"I haven't seen the people who live over the road, because their houses are completely gone and I haven't been able to see them,\" he told BBC 5 Live.\n\"We'll do whatever we can for them - but I don't know what we can do, they're just shells of houses.\"\nCouncillor Ed Lawrence, responsible for emergency planning at Dudley Council, said residents had returned home to find \"no electricity in the houses, gas or water\".\n\"The fridge was full of rotting food. And it's little things like that, so we've sent a team out today with a refuse truck so that residents can clear out that food, start to rebuild,\" he said.\nThere are four fire engines remaining in Stourbridge, with crews patrolling the area and identifying hotspots to prevent reignition.\nA fundraiser created by Dudley Council to help residents \"rebuild their lives\" has surpassed £31,000.\nAnother by the Heart of England Community Foundation to help families impacted by fires across the West Midlands has hit £50,000.\nStourbridge MP Cat Eccles urged anyone who needed additional support to reach out for help.\n\"I'm on hand to support however I can, the Town Hall remains open for food, clothes, pet supplies, phone chargers, general inquiries,\" she said.\n\"Counselling is available and being offered by several local professionals free of ch", "translation_ja": "", "vocab": [{"word": "devastating", "definition": "極めて破壊的で、大きな被害をもたらす。ここでは火災による甚大な損害を表現するのに用いられています。"}, {"word": "inferno", "definition": "大火災や激しい炎を意味する文語的表現。通常、制御不能な大規模な火事を指します。"}, {"word": "cordon", "definition": "安全のため人や車が立ち入らないようにする境界線やロープ。ここでは火災現場の立ち入り禁止区域を指します。"}, {"word": "reignition", "definition": "再び火がつくこと、再発火。消火後の火災再発生のリスクを指します。"}, {"word": "gutted", "definition": "建物の内部が完全に焼け落ちた状態。ここでは家が外殻だけ残った状態を表します。"}, {"word": "soul-destroying", "definition": "心理的に極めてつらい、精神的な打撃を与える状況。ここでは近所の家が焼けた悲しみを表現しています。"}]}, {"title_ja": "英国製ドローンがロシア領内の目標を攻撃", "title_en": "UK-made drones strike targets inside Russia", "summary_ja": "英国製ドローンが初めてロシア国内の軍事・産業施設を攻撃し、350億ポンド以上の経済的損害をもたらした。精製所や倉庫、兵站拠点が攻撃対象となり、英国によるウクライナ支援が大幅にエスカレートしている。国防省はウクライナの防衛を支援するため、今年15万機以上のドローンを供給することを確認した。", "summary_en": "British-made drones are being used to strike military and industrial targets within Russia for the first time, causing over £35bn in economic damage. The strikes target refineries, warehouses, and logistics hubs, marking a significant escalation in UK support for Ukraine. The Ministry of Defence confirmed it is supplying Ukraine with over 150,000 drones this year as part of its commitment to help the country defend itself.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5ywwv2pp44o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK-made drones strike targets inside Russia\n- Published\nBritish-made drones are being used to strike targets in Russia for the first time.\nThe drones, built by two separate British companies, have been used in mainland Russia in widespread and successful targeting of military and industrial targets, including refineries and warehouses of online retailer Wildberries.\nThe strikes, first reported by the Sunday Times, external, are said to have caused more than £35bn in economic damage. A well-placed military source confirmed to the BBC the UK drones had been used.\nBritish manufactured Storm Shadow missiles had earlier been used in the conflict, although this new phase is having a far more decisive impact.\nRussian Foreign Ministry spokeswoman Maria Zakharova has previously said drones using UK components and configurations have been used to attack Russian territory, including a fuel depot in the Kamensky District of the Rostov Region.\nIn April, the Ministry of Defence (MoD) announced it would supply Ukraine tens of thousands of drones, including long-range strike devices, in its biggest ever package.\nThe MoD said its support for Ukraine is \"unwavering\" and would stand by its ally \"until it wins\".\nA spokesperson said: \"We are committed to providing the equipment Ukraine needs to defend itself against Putin's illegal invasion.\n\"This includes over 150,000 drones this year, cutting-edge Stone Cloak devices that hinder Russian air defences and innovative low-cost cruise missiles.\"\nOn Sunday, Moscow's mayor said about 600 Ukrainian drones were launched towards the city overnight, with roughly a third of the drones being destroyed, and three people were injured.\nA warehouse belonging to Russian online retailer Wildberries was hit.\nWildberries, known as Russia's version of Amazon, has been repeatedly targeted since July.\nKyiv said at the time it was targeting logistics hubs used by Russians to buy military equipment and disrupting supplies to the Russian army.", "translation_ja": "", "vocab": [{"word": "decisive", "definition": "結果に大きな影響を与える、決定的な。戦争や競争などで勝敗を左右する重要な効果をもたらすことを意味します。"}, {"word": "logistics hubs", "definition": "物資や機器の輸送・配送を管理・中継する拠点。軍事用語では補給線上の重要な中継地点を指します。"}, {"word": "unwavering", "definition": "揺るがない、一貫した。決意や支持などが変わることなく継続することを表します。"}, {"word": "escalation", "definition": "エスカレート、段階的な拡大・激化。紛争や対立が徐々に深刻化・拡大していく過程を指します。"}, {"word": "alleged", "definition": "疑惑の、言われている。確実ではなく、報告や主張されているが証明されていない事柄に用いられます。"}, {"word": "depleted", "definition": "枯渇した、減少した。資源や物資が大幅に減少し、残りが少なくなった状態を表します。"}]}, {"title_ja": "緊急電話アラートが家庭内暴力被害者を危険にさらす可能性があると活動家が指摘", "title_en": "Emergency Phone Alert Criticized for Putting Domestic Abuse Victims at Risk", "summary_ja": "イングランドとウェールズの山火事警告に関する政府の緊急アラートが、被害者が支援を受けるために隠された電話を使用しているため、家庭内暴力被害者を危険にさらす可能性があると慈善団体が述べている。アラートは事前警告がほとんどないまま送信され、虐待者が秘密の電話を発見する機会を与えた。活動家たちは、今後のアラート前に家庭内暴力支援機関とのより良い協議を求めている。", "summary_en": "A government emergency alert warning of wildfires across England and Wales put domestic abuse victims at risk, charities say, because victims often use hidden phones to seek support. The alert was sent with minimal advance warning, giving abusers the chance to discover secret phones when they alarmed. Campaigners are calling for better consultation with domestic abuse organizations before future alerts.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwyllkz80dlo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Emergency phone alert put domestic abuse victims at risk, campaigners say\n- Published\nAn emergency government phone alert warning of wildfires across England and Wales put domestic abuse victims at risk, campaigners have told the BBC.\nMillions of people's mobile phones lit up and bleeped with a \"severe alert\" notification on Friday which said there was a \"very high risk of wildfires nationally\".\nBut charities and survivors have criticised how a lack of advance warning meant there was little chance to protect those hiding secret phones in domestic abuse situations.\nA government spokesperson said the alert was sent \"after a direct request from fire and rescue services\" and it was working closely with domestic abuse charities for tests of the system.\n- What is causing the summer wildfires? \n  - Published25 July\n- People who fled Stourbridge fires start to return home \n  - Published2 hours ago\nMost people received the blaring alert at 19:00 BST on Friday - and it came as a surprise given the government had not told people it was coming, as it has done for tests of the system.\nThe notification, which cautioned against the use of disposable barbecues, naked flames or fireworks, was the biggest use yet of the emergency alert system and Prime Minister Andy Burnham urged the public to take it \"seriously\".\nA Cabinet Office press release, posted to their website at about 18:45 on Friday, was missed by many in the media, which meant there was little warning to the public.\nThis potentially jeopardised domestic abuse victims trying to hide secret phones they use to seek support and try to escape abusers, some campaigners have said.\nWomen's Aid, the national charity aiming to end domestic abuse, is calling for more forewarning of alerts wherever possible.\nVeronica Oakeshott, the charity's head of external affairs, told BBC News: \"Survivors of domestic abuse frequently turn to second phones to help them access lifesaving support or flee from abuse.\"\nIt is vital the devices stay hidden, she said, before adding: \"We would urge the government to forewarn the public that alerts might be issued, when possible.\"\nIt has been reported that senior government figures were discussing whether or not to send the alert hours before, on Friday morning.\nThe alert came after a spate of wildfires including one that destroyed 19 homes in Stourbridge, West Midlands, on Thursday.\n'Heart dropped' when alert arrived\nPadua Eaton, 29, a survivor of domestic abuse who set up support group The Harborough Doves, said her \"heart dropped\" when she received the alert.\n\"My first thought was anxiety at the alarm - many people in domestic abuse relationships have a secret second phone in order to keep communication with friends or professionals and this alarm would have alerted abusers immediately,\" she told BBC News.\n\"The government should have been more upfront about the alarm - telling the press 15 minutes before it went off is poor planning in my opinion.\n\"Other measures should have been put in place to inform people without resorting to the alarm at such short notice.\"\nShe urged ministers to look into a silent notifications, warning that \"if alarms become frequent, victims may no longer feel safe keeping these phones\".\nHer concern was echoed by Maggie Evans, director of frontline services at abuse prevention charity Hourglass.\nShe called for ministers to consult organisations supporting the most vulnerable before future alerts.\n\"Domestic abuse victims should never be put at risk by the very systems meant to keep us all safe,\" she said.\nEvans said there had been \"no meaningful advance warning to frontline domestic abuse charities\" and \"no targeted safety guidance for victims\".\n\"Effective public safety must always be built on proper safeguarding.\"\nSome have questioned whether the alert was necessary.\nJulian Jessop, fellow at the Institute of Economic Affairs, told BBC Radio 4's Broadcasting House on Sunday he felt the \"very high\" threshold for sending one \"hasn't been reached - I don't think there's an immediate risk to life everywhere\".\nOne of the system's architects Frazer Rhodes said the latest alert \"really has divided opinion\" and the government should set out the criteria for when it will and will not be used.\nA government spokesperson added: \"On Friday alone, crews were tackling 43 wildfires across the country and had declared 11 major incidents, stretching resources to the very limit and requiring military support... we urge everyone to follow fire safety advice to help protect people and property.\"\nMinisters said in 2023 that the alert system would cost up to £25.3m in its first three years.\nHow to opt out of emergency alerts if needed\nThe government advises people to keep emergency alerts switched on as they \"contain life-saving information\".\nThey override silent or \"do not disturb\" settings on your phone. But for those who need to opt out, such as to conceal secret phones, advice for iPhones, Androids and other devices is listed on the govern", "translation_ja": "", "vocab": [{"word": "jeopardised", "definition": "危険にさらした、危険な目にあわせたという意味。securityやsafetyが脅かされる状態を表す。"}, {"word": "forewarn", "definition": "あらかじめ警告する、前もって知らせるという意味。preventive actionを取るために事前に情報を提供すること。"}, {"word": "threshold", "definition": "基準値、境界線という意味。ある状態や条件が満たされるために必要な最小限のレベルを指す。"}, {"word": "charities", "definition": "慈善団体という意味。社会的課題解決のために非営利で活動する組織を指す。"}, {"word": "vulnerability", "definition": "脆弱性、傷つきやすさという意味。社会的に保護や支援が必要な状態や立場を示す。"}, {"word": "override", "definition": "優先させる、無視して実行するという意味。システムの設定を無視して強制的に動作させること。"}]}, {"title_ja": "シチリアでルネサンス時代の重要な絵画が盗難被害に", "title_en": "Thieves steal key Renaissance paintings in Sicily", "summary_ja": "メッシーナ地域美術館のセキュリティシステムを突破した窃盗犯が、ルネサンスの巨匠アントネッロ・ダ・メッシーナの複数のパネルを盗み出しました。1473年作の『サン・グレゴリオ多翼祭壇画』から現存する5枚中3枚を含む盗難品の価値は推定7000万～8000万ユーロであり、シチリアの文化遺産に対する極めて大きな損失となっています。", "summary_en": "Robbers bypassed security systems at Messina's Regional Museum and stole several panels by Renaissance master Antonello da Messina, including three of five surviving panels from his 1473 San Gregorio Polyptych. The theft, valued at an estimated €70-80 million, occurred during the city's Ferragosto summer holiday celebration and represents an enormous loss for Sicily's cultural heritage.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/italy-thieves-steal-key-renaissance-paintings-in-sicily/a-78389559?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Italy: Thieves steal key Renaissance paintings in Sicily\nAugust 16, 2026\nCriminals have once again targeted a small regional museum to steal priceless artworks on public display, this time in Messina, Sicily.\nLocal authorities say robbers bypassed alarm and security systems at the Regional Museum of Messina (MuMe), Italy, around 10:00 p.m. (2000 GMT) on Saturday evening as the city celebrated the high point of its \"Ferragosto\" summer holiday, the Catholic Feast of the Assumption of the Blessed Virgin Mary.\nThieves were able to make off with several panels painted by Renaissance artist Antonello da Messina, the most important artist ever born on the island of Sicily.\nThree of the five surviving panels from Antonello's 1473 \"San Gregorio Polyptych\" were taken in the robbery as well as a smaller, double-sided panel locked in an armored display case.\n\"We are devastated by what happened. They were some of Antonello da Messina's most important and best-known works. It is a tremendous loss for the museum, the city, the community and the art world,\" MuMe Director Marisa Mercurio told Italy's ANSA news agency.\nMessina Mayor Federico Basile called the theft \"deeply reprehensible,\" saying it was \"even more painful\" for having taken place as the city celebrated the Assumption of the Virgin.\nThe museum remained closed Sunday as investigators searched for evidence.\nWorks of 'enormous cultural, artistic and symbolic importance'\n\"It is an extremely serious and significant loss,\" said Mercurio, \"They have stolen works of enormous cultural, artistic and symbolic importance, not only for Messina but for Sicily as a whole. All we can do now is hope they are recovered as soon as possible.\"\nThough the sum financial loss has not been made public — initial estimates range from €70-€80 million ($81-$92 million) — Antonello's market value increased considerably in March of this year when the Italian state laid out $14.9 million (€13 million) for the purchase of another panel that he painted around 1460.\nA moving two-sided panel in oil with an \"Ecce Homo\" portrayal of Christ (recto) and \"Saint Jerome in the Desert\" (verso), the purchase and news that the painting would soon return to Italy was greeted with enthusiasm.\nMessina was among the cities hoping to display the newly returned work.\nAntonello was born around 1430 and trained first in Naples before studying Provencal and Flemish painting and ultimately returning to Messina in 1457, where he would work until his death in 1474.\nSeen as a key figure in what was an early example of technology transfer, Antonello is largely credited with bringing revolutionary new Flemish oil painting techniques to southern Europe while at the same time spreading knowledge of Italian perspective drawing among his colleagues north of the Alps.\nThe return of Antonello's painting to his hometown, went the argument, would have huge symbolic value for a city that lost most of its cultural heritage, including what remained of Antonello's life and work, on December 28, 1908 — when an earthquake flattened Messina and killed nearly 60% of its population in a matter of seconds.\nWhat paintings were stolen in Sicily?\nThe paintings stolen on Saturday belonged to an altarpiece installed at Messina's Monastero San Gregorio until it was destroyed in the 1908 quake.\nReferred to as the \"San Gregorio Polyptych\" in its post-quake state, it consisted of six tempera paintings on wooden panels.\nThe five pieces in the museum portrayed the \"Annunciation of the Virgin\" in two upper panels, and the larger \"Madonna of the Rosary Enthroned\" flanked by full-length portraits of Saints Gregory and Benedict below.\nThe works were the only by Antonello never to have left Messina.\nAuthorities say the thieves left two panels leaning against the exterior of the museum despite having removed them from the wall and gotten them outside.\nAnother work, the small, two-sided oil painting on wood taken from the armored case, bore the image of Christ on one side and a Franciscan monk with the Virgin and Child on the other.\nWhat will happen to the paintings now?\nSaturday's robbery comes just days after Italian authorities announced the recovery of three stolen artworks by Auguste Renoir, Paul Cezanne and Henri Matisse worth about €10 million.\nThose works were stolen from a regional museum, too, the Magnani Rocca Foundation in Parma, on March 22.\nFive people — allegedly Moldavan gangsters — have been detained in connection with the theft.\nDespite having (often outdated) alarm systems, museums present soft targets for criminals.\nBrazen thefts at museums around the world have highlighted this problem — most dramatically in Paris, where gangsters stole priceless historic jewels from the famous Louvre in broad daylight on October 19, 2025.\nExperts say the fact that stolen artworks are often instantly recognizable makes them impossible to sell via reputable channels. Instead, such objects are used as collateral among crime bosses.\nIn Germany, members of", "translation_ja": "", "vocab": [{"word": "polyptych", "definition": "複数のパネルから構成される一つの宗教絵画作品。中世やルネサンス時代に祭壇に設置された多翼祭壇画を指し、各パネルが開閉できる構造になっていることもあります。"}, {"word": "tempera", "definition": "顔料を卵の黄身または水に混ぜて作られた絵具、またはそれを使用した絵画技法。油絵が普及する前のヨーロッパ美術では主流の技法でした。"}, {"word": "collateral", "definition": "ローンや債務の担保として提供される資産。犯罪組織間では盗まれた美術品が金銭取引の担保として使用されることがあります。"}, {"word": "brazen", "definition": "厚かましい、大胆不敵な。特に犯罪行為が公然と、恐れることなく実行される様子を表します。"}, {"word": "reputable", "definition": "信頼できる、名高い。盗まれた美術品は名高い正規の販売チャネルでは売却できないという文脈で使用されています。"}, {"word": "altarpiece", "definition": "教会の祭壇の後ろに置かれる宗教的な装飾画。複数のパネルで構成されることが多く、重要な宗教美術作品です。"}]}, {"title_ja": "UAEとサウジアラビア、イスラエルのトランプ・ガザ和平案拒否を非難", "title_en": "UAE, Saudi Arabia condemn Israel's rejection of Trump Gaza peace plan", "summary_ja": "UAEとサウジアラビアを含む8つの中東諸国が、イスラエルによるトランプ大統領のガザ和平案15項目の拒否を非難した。イスラエルのネタニヤフ首相は、ハマスが完全に武装解除されるまで軍隊を撤退させないと述べ、トランプの提案ロードマップに矛盾している。外相たちは、米国に対し和平案の実施を妨害する当事者を阻止するための具体的措置を講じるよう求めた。", "summary_en": "Eight Middle Eastern countries, including the UAE and Saudi Arabia, have condemned Israel's rejection of President Trump's 15-point Gaza peace plan. Israeli Prime Minister Netanyahu stated that Israel will not withdraw military forces until Hamas is fully disarmed, contradicting Trump's proposed roadmap. The foreign ministers called on the US to take concrete measures to prevent any party from obstructing the peace plan's implementation.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/uae-saudi-arabia-others-condemn-israel-s-rejection-of-trump-gaza-plan/a-78389399?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Regional powers condemn Israel's rejection of Gaza plan\nAugust 16, 2026\nThe United Arab Emirates and seven other countries on Sunday condemned Israel's rejection of President Donald Trump's plan to end the war in the Gaza Strip.\nIt comes a week after Israeli Prime Minister Benjamin Netanyahu rejected the 15-point plan for Gaza, stating that no military pullout will happen until Hamas is \"genuinely\" disarmed.\nTrump's Board of Peace said last month that it had reached a deal for the complete disarmament of Hamas and other armed groups in Gaza.\nThe foreign ministers of the UAE, Qatar, Jordan, Indonesia, Pakistan, Turkey, Saudi Arabia and Egypt issued their joint statement as Trump's envoy and son-in-law, Jared Kushner, and Nickolay Mladenov, Trump's Board of Peace envoy for Gaza, were in Egypt for Gaza ceasefire-related talks.\nCountries back Trump Gaza peace road map\nTrump announced last month that there had been a breakthrough on a 15-point road map aimed at ending the war in the Gaza Strip.\nThe plan drawn up by his Board of Peace calls for Israeli troops to withdraw as Hamas gives up its weapons. An international stabilization force would then work alongside a new Palestinian police force to secure Gaza.\n\"Rejecting the Road Map constitutes an explicit refusal to proceed with the implementation of the Comprehensive Plan, and directly threatens to derail the extensive efforts exerted by US President Trump to bring an end to the war in Gaza and establish the conditions for lasting peace,\" the foreign ministers said in their Sunday statement.\n\"Such rejection confirms that Israel now bears responsibility for obstructing the efforts to bring peace in Gaza and the rest of the Occupied Palestinian Territory,\" they added.\nThey called on the Board of Peace and the US \"to take immediate and concrete measures within its mandate to uphold the integrity of the Comprehensive Plan and prevent any party from obstructing its implementation.\"\nHamas delegation joins ceasefire talks in Cairo\nKushner met Hamas chief, Khalil al-Hayya, on Sunday according to several news agencies citing unnamed sources.\nKushner and Mladenov were in Egypt and met with mediators from Egypt, Qatar and Turkey to discuss implementation of the deal.\nHe is due to meet Netanyahu on Monday.\nHamas on July 30 avoided using the term \"disarmament,\" but said it would hand over its weapons to a new Palestinian governing body that would govern Gaza under the supervision of the Board of Peace.\nThe group, which is designated as a terrorist organization by several countries and the EU, called on mediators and the Board of Peace to \"compel\" Israel to approve the road map for next steps.\nNetanyahu previously said Israel remained in talks with Washington despite its objections to the peace plan.\n\"They have ideas; some of them are acceptable to us and some are not, and we know how to stand our ground on these matters,\" said the Israeli prime minister.\nEdited by: Kieran Burke\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "disarmament", "definition": "武装解除のこと。紛争地域での兵器や軍事力の放棄を指します。この記事では、ハマスが武器を手放すことを意味しています。"}, {"word": "roadmap", "definition": "計画や目標達成のための段階的な道筋を示す計画書。ビジネスや外交交渉で、実現のための具体的なステップを示す際に使用されます。"}, {"word": "obstruct", "definition": "妨害する、阻止するという意味の動詞。進行中のプロセスや計画の実行を阻むことを指します。"}, {"word": "mandate", "definition": "権限、使命、または指示を意味します。国際機関や政府が特定の任務を遂行する権限を与えられていることを示します。"}, {"word": "envoy", "definition": "特使、使者という意味の名詞。政府や指導者から特定の交渉や任務を担当するために派遣される外交官を指します。"}, {"word": "designated", "definition": "指定された、認定されたという意味の形容詞。公式に特定のカテゴリーまたはリストに分類されることを意味します。"}]}, {"title_ja": "ウクライナがロシア最大のオンラインマーケット「ワイルドベリーズ」を攻撃", "title_en": "Ukraine Targets Wildberries, Russia's Largest E-commerce Platform", "summary_ja": "ウクライナ軍はロシア最大のオンラインマーケット「ワイルドベリーズ」に対するドローン攻撃を継続展開し、数十億ルーブル相当の商品と倉庫スペースを破壊している。ウクライナはこの小売業者がロシア軍に軍事装備を供給していると主張しているが、モスクワはこれを否定している一方、独立系メディアはプラットフォーム上で軍事関連商品を発見している。この攻撃はロシア経済を混乱させ、国営銀行に負担をかけ、プーチン側近に関連する資産を弱体化させることを目的としている。", "summary_en": "Ukrainian forces have launched a sustained campaign of drone attacks against Wildberries, Russia's dominant online marketplace, destroying billions of rubles worth of goods and warehouse space. Ukraine claims the retailer supplies military equipment to Russian forces, while Moscow denies this, though independent analysis has found military-related goods on the platform. The attacks aim to disrupt Russia's economy, strain state-owned banks, and weaken assets connected to Putin's inner circle.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/ukraine-attacks-wildberries-russia-s-biggest-online-market/a-78384605?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "経済", "full_text": "Ukraine attacks Wildberries, Russia's biggest online market\nAugust 16, 2026\nEarly Sunday, a fire broke out in a warehouse belonging to Russia's largest online marketplace, Wildberries, in the town of Podolsk, about 40 kilometers (25 miles) south of Moscow. The fire was the result of a large-scale overnight attack by Ukrainian drones, most of which were intercepted by Russian air defenses.\nOn Friday, Ukraine struck a different Wildberries warehouse, in Tver, north of Moscow. The day before, it had set fire to another warehouse in Salavat, further east.\nAbout 20 Wildberries logistics hubs have been under near-daily attack in the past few weeks. At least nine employees have been confirmed dead, and scores injured, while a handful of the storehouses have halted operations.\nThe Moscow-based e-commerce consultancy Data Insight estimates Wildberries has lost as much as 480 billion rubles worth of goods ($5.7 billion/€4.9 billion) and about a third of its warehouse space. Combined damaged to the company and its sellers are estimated as high as 800 billion rubles ($9.5 billion).\nWhile Kyiv argues the retailer helps supply Russia's military, Moscow maintains it serves only civilian purposes. Either way, the attacks have been placing an increased strain on Russia's economy.\n\"I think [Ukraine is] going after a choke point,\" Fabrice Pothier, CEO of the geopolitical consultancy firm Rasmussen Global, told DW. \"Wildberries is, in a way, a choke point of Russian society and the Russian economy.\"\nWildberries: Russia's Amazon\nWildberries is often described as Russia's answer to the Amazon marketplace.\nFollowing Russia's full-scale invasion of Ukraine in 2022 and the ensuing sanctions on Russian trade, many online e-commerce platforms such as Amazon withdrew from the region. In response, Russian authorities permitted so-called parallel imports, essentially allowing Russian companies to sidestep sanctions by importing goods without the consent of the original rights holders.\nThese companies drastically undercut conventional prices, allowing their sales volume to skyrocket. In the case of Wildberries, for example, revenue increased sevenfold between 2021 and 2025. Its competitor, Ozon, offers similarly staggering numbers, with a reported $49.3 million revenue and 59% growth in 2025.\nToday, Wildberries is the largest e-commerce platform in the country, controlling about half of the respective market. Ozon dominates about 30% of the market. Together, they handle goods and services equivalent to about 8.5% of the Russia's gross domestic product (GDP).\nWhy is Ukraine targeting warehouses?\nFollowing the initial attacks in mid-July, Ukrainian President Volodymyr Zelenskyy argued that the warehouses struck were \"elements of Russian logistics [...] used to distribute equipment for the war: navigation systems, components for drone production, and other supplies for the Russian army.\"\nThe Kremlin has consistently rejected this claim. But an analysis by the independent outlet Verska identified \"tens of thousands of military and dual-use goods\" on the platform between May and August this year, amounting in sales worth hundred of millions of rubles.\nMykhailo Podolyak, adviser to the head of Zelenskyy's office, said interrupting the flow of military goods to the front lines was just one reason for attacking the company's storage space. Disrupting a business with around 6 trillion rubels in turnover, he told DW, would also affect its creditors, including Sverbank and VTB, both of which are majority state-owned.\nNot only could this drain state coffers, \"if [the company] were to go bankrupt, it will probably have a domino-effect on the economy,\" as Pothier explained.\nAnd \"there is a bigger objective at play,\" the consultant added, \"which is to bring back war to its sender\" by disrupting civilian life. As many as 400,000 sellers have been affected by the attacks, the Russian Association of Electronic Trading Platforms reported. As a result, civilians are losing sources of income, access to goods and services, and, increasingly, a sense of normality.\nThe platform hosts over 1 million sellers — most of them small- and medium-sized — and reaches some 80 million users each month.\nBut targeting Wildberries was also meant to send a message to Russian elites, according to Podolyak. These include the billionaire Suleiman Kerimov, the diplomat Anton Vaino or politician Alexey Gromov, all of whom are counted in Putin's inner circle, and possibly have varying degrees of involvement with the Wildberries company.\nWhat makes Wildberries a target?\nWildberries has been investing in massive logistics hubs. The largest span the size of several dozen soccer fields, making them fairly easy — and highly flammable — targets.\nThe company is also said to have incurred substantial debt, with some questioning whether it is still able to service them. According to financial reporting of its main operating entity, RWB LLC, short-term borrowing spiked nearly eightfold betwe", "translation_ja": "", "vocab": [{"word": "choke point", "definition": "経済やシステムにおいて、流通が集中し、それが遮断されると全体に大きな影響を与える重要な地点のこと。ビジネスやロジスティクスの文脈で使用される。"}, {"word": "parallel imports", "definition": "正規販売代理店を通さず、別のルートから合法的に輸入する商品のこと。制裁回避に使われることもある経済用語。"}, {"word": "logistics hub", "definition": "商品や物資の集配・仕分けを行う中心的な拠点のこと。サプライチェーンにおいて重要な流通機能を持つ施設。"}, {"word": "domino effect", "definition": "最初の出来事が次々と連鎖的に影響を与えていく現象のこと。経済や社会問題の波及効果を説明する際に用いられる表現。"}, {"word": "incur", "definition": "（負債や損失などを）被る、負わされるという意味の動詞。ビジネス文脈では「融資を受ける」や「赤字を出す」という意味で使われることが多い。"}, {"word": "creditor", "definition": "債権者、すなわち企業や個人に対して貸付金がある者や金融機関のこと。財務・金融分野の重要な用語。"}]}, {"title_ja": "ギャレゴ議員、リンカーン艦の状況についてトランプ政権を非難", "title_en": "Gallego blames Trump administration for Lincoln conditions", "summary_ja": "アリゾナ州のマーク・ギャレゴ議員は、USS エイブラハム・リンカーン艦の状況に対するトランプ政権の対応を批判し、「真の指導力の欠如」と述べました。マレン提督は、艦が帰港することを知った乗組員の士気が向上したと報告しています。", "summary_en": "Arizona Senator Mark Gallego has criticized the Trump administration's handling of conditions aboard the USS Abraham Lincoln, calling it a 'true lack of leadership.' Admiral Mullen reported that crew morale has improved since learning the ship will be returning home.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/gallego-blames-trump-administration-uss-lincoln-conditions-true/story?id=135685345", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース放送", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースと生放送イベントを24時間体制でカバーしています。プラットフォームは主要なニュース速報をリアルタイムで配信します。視聴者は国内外の重要なニュースについて包括的なレポートにアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. The platform delivers real-time updates on major news stories as they develop. Viewers can access comprehensive reporting on national and international events.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "共和党カッシディ上院議員、トランプの予防接種大統領令を「愚かな行為」と批判", "title_en": "GOP Senator Cassidy Criticizes Trump's Vaccine Executive Order as 'Stupid'", "summary_ja": "共和党のビル・カッシディ上院議員はABCニュースの『This Week』に出演し、トランプ大統領の予防接種に関する大統領令を「愚かな行為」と批判した。カッシディの批判は、政権のワクチン政策アプローチに対する共和党内での懸念の高まりを浮き彫りにしている。", "summary_en": "Republican Senator Bill Cassidy condemned President Trump's executive order on vaccines during an appearance on ABC News' 'This Week,' calling it a 'stupid thing to do.' Cassidy's criticism highlights growing concerns within the GOP about the administration's vaccine policy approach.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/gop-sen-bill-cassidy-trumps-vaccine-executive-order/story?id=135685348", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジンバブエの船舶事故の死者数が68人に達する", "title_en": "Zimbabwe boat accident death toll reaches 68 as recovery continues", "summary_ja": "ザンビアとの国境にあるカリバ湖で火曜日にフェリーが転覆し、68人が死亡しました。これはジンバブエの海難事故として最も深刻とみられています。定員90人の船に119人が乗船していたため過積載状態にあり、強風により転覆しました。当局は残る遺体の回収に自信を示しています。", "summary_en": "A ferry capsized on Lake Kariba on Tuesday, killing 68 people including 18 children in what is believed to be Zimbabwe's deadliest maritime disaster. The vessel was carrying 119 passengers and crew members, exceeding its 90-person capacity, when it overturned during heavy winds. Recovery efforts continue with authorities confident of retrieving remaining bodies.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/15/more-bodies-recovered-after-zimbabwe-boat-accident", "state_media": false, "category": "経済", "full_text": "Twenty-two more bodies have been recovered after a boat accident in Zimbabwe, taking the death toll to 68, police said on Saturday.\nThe ferry capsized on Tuesday on Lake Kariba, on the border with Zambia. An investigation has suggested it was overloaded when it turned over during heavy winds.\nEighteen children were among the people killed, Zimbabwe’s police said, in what is believed to be the country’s deadliest such disaster.\nMost of the passengers are believed to be villagers and fish traders who lived around the lake.\nOfficials said the vessel was authorised to carry 90 people but was packed with 114 adults, five crew members and an unspecified number of children.\nLt Col Joseph Muchechesi, commander of the boat regiment involved in the search operation, said: “So far today we have managed to take 22 bodies. We are confident that we will manage to retrieve all the bodies.”\nThe civil protection unit said on Wednesday that 77 people had been rescued.\nHundreds of people gathered at the district hospital in the lakeside town of Kariba to identify the bodies of their relatives and loved ones.\nA public memorial service was held in Kariba, nearly 280km (175 miles) north-west of the capital Harare, on Thursday before the burials started.\nSurvivors said they pleaded with the ferry driver to turn back as the vessel had begun taking on water soon after departing.\nChance Siyamavhu, 45, told Agence France-Presse: “Thank God that a wave pushed the sinking vessel and we managed to climb on top.\n“When the boat capsized, most of the people scrambled to get the lifejackets but most of them did not even know how to use them.\n“Most people could not make it.”\nLake Kariba is the world’s largest manmade lake by volume. It stretches more than 200km (124 miles) and is up to 40km (25 miles) wide in places.\nIt was created in the 1950s during British colonial rule, when the Zambezi River was dammed, displacing about 57,000 people.\nIn 2014, 26 people, 24 of them children, drowned in Zambia’s part of the lake, when the boat meant to transport them to independence day celebrations capsized.\nOn the Zimbabwean side, five passengers drowned in a 2021 incident.", "translation_ja": "", "vocab": [{"word": "capsized", "definition": "船舶が転覆して逆さまになることを意味します。通常、船が悪天候や不安定な積み荷によって横転する状況で使用されます。"}, {"word": "overloaded", "definition": "制限を超えて過度に荷物や乗客を積むことを意味します。安全基準を超える状態を指します。"}, {"word": "retrieve", "definition": "失われたものや取り残されたものを探して取り戻すことを意味します。ここでは遺体の回収を指しています。"}, {"word": "civil protection unit", "definition": "市民の安全と防災を担当する公的機関を意味します。災害時の救助活動や対応を統括します。"}, {"word": "maritime disaster", "definition": "海上や湖上での船舶事故による大規模な災害を意味します。多くの人命喪失を伴う水上の重大事故です。"}, {"word": "manmade", "definition": "人工的に造られたものを意味します。人間が設計・建設した構造物に対して使用されます。"}]}, {"title_ja": "モロッコ警察、セウタへの進入を試みた移民111人を逮捕", "title_en": "Moroccan police arrest 111 migrants attempting to enter Spanish territory of Ceuta", "summary_ja": "モロッコ当局は土曜日、スペイン領セウタへの越境を試みたサハラ砂漠以南のアフリカ移民を含む111人を逮捕した。この作戦は大量越境を呼びかけるソーシャルメディア投稿の後に行われ、2週間前に72,000人以上の移民がセウタに殺到し、少なくとも96人が死亡した事態に続くものである。スペインは警察官の追加配備と海上障壁を設けて、不正な進入をさらに防止している。", "summary_en": "Moroccan authorities arrested 111 people, mostly sub-Saharan African migrants, as they attempted to cross into Spain's Ceuta enclave on Saturday. The operation followed social media calls for mass crossings and came two weeks after over 72,000 migrants surged into the territory, resulting in at least 96 deaths. Spain has reinforced security with additional police and maritime barriers to prevent further unauthorized entries.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/15/moroccan-police-arrest-more-than-100-people-as-they-attempt-to-enter-ceuta", "state_media": false, "category": "社会", "full_text": "Moroccan police have arrested 111 people as they tried to enter Spain’s north African territory of Ceuta, amid tightened security on both sides after social media posts called for another mass crossing.\nThe attempted crossing on Saturday came two weeks after more than 72,000 migrants surged into Ceuta, causing tensions within the EU and prompting anti-immigration rhetoric among far-right parties worldwide. At least 96 people died trying to reach European soil.\nA source in Morocco’s interior ministry told news agency Reuters that those detained included 109 migrants from sub-Saharan Africa and two Moroccan citizens arrested in or around Fnideq, the Moroccan city near Ceuta.\nMoroccan police used teargas to disperse groups of migrants gathered on hills about 1.9 miles (3km) from the border, according to Spanish news agency EFE. Reuters later saw hundreds of police officers, some in riot gear and others in plainclothes, returning from the hills outside Fnideq.\nEFE and Spanish state broadcaster TVE said Morocco’s interior ministry ordered their journalists to leave Fnideq immediately, without providing an explanation.\nIn Ceuta, Spanish soldiers guarded supermarkets while police patrolled the main streets. The city was calmer than in the days after the deadly crossing attempt on 30 July.\nMadrid has since installed a maritime barrier and deployed more than 500 additional police officers from mainland Spain, raising the total in Ceuta to more than 1,600. The interior ministry said the reinforcements would remain for as long as needed.\n“We’ll continue to deploy whatever personnel are necessary to restore normality as soon as possible and prevent events like those of 30 July from happening again,” Spain’s interior minister, Fernando Grande-Marlaska, said on Thursday.\nAbout 5,000 migrants remained in Ceuta, the minister added. Reuters saw hundreds sheltering from scorching heat under makeshift bamboo shelters on the urban beach of El Trampolin.\nGrande-Marlaska said migrants who entered irregularly would not be allowed to stay in the territory, travel to mainland Spain or obtain legal status, except in rare cases involving extreme vulnerability. Those without a right to remain would be returned to Morocco, he added.\nEarlier this week, Rabat said it was monitoring “the circulation of social media posts and messages of unknown origin” calling for a mass crossing on 15 August, warning it would prosecute organisers and participants.\nA Reuters witness saw reinforced security near the border, including police vans with wire shields and road checkpoints. Local media reported similar measures near Melilla, another Spanish territory in north Africa.\nAuthorities prevented several groups from boarding trains and buses to northern Morocco in cities such as Casablanca, Fez and Kenitra. However, witnesses told Reuters that some migrants from sub-Saharan Africa were bypassing security checkpoints by taking mountain routes towards Fnideq.\nOne witness said the schools in Fnideq had been turned into accommodation for security forces deployed near the border.", "translation_ja": "", "vocab": [{"word": "reinforcements", "definition": "追加的に派遣された人員や物資のこと。軍事や警察活動において、対応能力を強化するために送られる補強部隊や装備を指します。"}, {"word": "maritime barrier", "definition": "海上に設置された物理的な障壁や柵のこと。不正な海からのアクセスや越境を防ぐために使用される防御施設です。"}, {"word": "disperse", "definition": "群衆や集団を四散させる、散らす、という意味です。警察が催涙ガスなどを使って人々を追い散らす行為を表します。"}, {"word": "makeshift", "definition": "急場をしのぐために一時的に作られた、または即興的に用意されたもの。本来の材料や施設の代わりに応急的に使用されるものを指します。"}, {"word": "irregular migrants", "definition": "不正な手段で入国した移民のこと。適切な査証やドキュメントなしに国境を越えた人々を指す法的な用語です。"}, {"word": "enclave", "definition": "周囲を別の領土に囲まれた領土のこと。セウタのようにモロッコに囲まれたスペイン領土を指します。"}]}, {"title_ja": "ニジェールで誘拐されたアメリカ人宣教師が9ヶ月後に解放される", "title_en": "American missionary kidnapped in Niger freed after nine months", "summary_ja": "50歳のアメリカ人宣教師パイロット、ケビン・ライダウトが10月にニジェールの首都ニアメで誘拐された後、解放されました。トランプ大統領は彼の解放の実現を主張しています。ライダウトは誘拐される前、19年間ニジェールで宣教師として働いていました。", "summary_en": "Kevin Rideout, a 50-year-old American missionary pilot, has been released after being kidnapped in Niger's capital Niamey in October. President Trump claimed credit for securing his release. Rideout had been working as a missionary in Niger for 19 years before his abduction by three armed individuals.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/14/american-missionary-kevin-rideout-niger-released-kidnapping", "state_media": false, "category": "社会", "full_text": "An American missionary who was kidnapped in Niger in October has been released, his organisation has said.\nServing in Mission International said Kevin Rideout “is in good health in the care of US officials” and would soon be reunited with his extended family.\nDonald Trump, who claimed to have helped secure Rideout’s release, later said he was “back in United States Custody” on Friday.\nThe 50-year-old missionary pilot was kidnapped in the west African country’s capital, Niamey, on 21 October by three armed individuals and was probably driven out of town, according to a security official at the time. No armed group claimed responsibility for the abduction. Other details about his rescue remain unknown.\nThe US president’s administration had made the release of Rideout a priority in its latest strategy on African Sahel states, after years of fighting extremism found limited success. Rideout had been working in Niger for 19 years as a missionary before the incident.\n“I am proud to announce that Kevin Rideout, a wonderful Christian Missionary, is back in United States Custody,” Trump wrote on his Truth Social platform on Friday. “Kevin, the United States of America looks forward to welcoming you HOME. Glad to have helped!”\nNiger has long been the target of attacks by armed groups, including jihadis linked to al-Qaida and Islamic State. A “continually deteriorating security situation” across the country was cited by the military junta that took power in 2023 when deposing the democratically elected president, Mohamed Bazoum.\nThe new authorities ousted western partners, including the US, which had soldiers in Niger, and forged a new security and diplomatic alliance with Russia. One former US base has since been occupied by Russian soldiers.\nTrump described the broader region of west Africa as “the epicenter of Islamist terrorism” in his social media post on Friday, claiming there had been “more deadly attacks in the past year” there than anywhere else on Earth.\nWashington has since shifted its focus to coastal west African states including Benin, Côte d’Ivoire and Ghana, sharing intelligence with local security personnel to prevent extremist threats from spilling southwards from the arid Sahel.\nHowever, the insurgency continues to escalate in the region. In Niger, data from Acled, the armed conflict data aggregator, shows that civilian fatalities rose by nearly 50% in the year after Bazoum was ousted.\nCities and urban centres in the Sahel region have also been increasingly targeted by armed non-state actors as the crisis reaches new dimensions.\nThe US embassy in Niamey issued a security alert a day after Rideout’s abduction, warning that American citizens “remain at a heightened risk of kidnapping throughout Niger, including in the capital city”.\nIn June, more than 30 people were killed when gunmen attacked the main airport in Niamey. It was the second attack this year at the airport, a strategic hub that serves as the ruling military’s command, hosting its air force base and most of its drones and aircraft. It is also the headquarters of the Alliance of Sahel States, the regional alliance that brings together troops from Niger, Mali and Burkina Faso.\nIn April, Mali’s defence minister, Gen Sadio Camara, was killed in his home on the outskirts of the capital Bamako during coordinated assaults staged by insurgents including the west African affiliate of al-Qaida.\nAssociated Press and Agence France-Presse contributed reporting", "translation_ja": "", "vocab": [{"word": "junta", "definition": "クーデターにより権力を掌握した軍事政権のグループを指します。通常、民主的プロセスを無視して政権を担当する集団を意味します。"}, {"word": "insurgency", "definition": "政府や支配層に対する武装反乱や反抗活動を指します。組織的な反政府勢力による暴力的な運動を意味します。"}, {"word": "deteriorating", "definition": "状況や条件が悪化していくプロセスを示します。時間とともに品質や状態が低下することを意味します。"}, {"word": "escalate", "definition": "紛争や問題が段階的に深刻化または拡大することを指します。強度や規模が増加することを意味します。"}, {"word": "strategic hub", "definition": "戦略的に重要な中心地や拠点を指します。地政学的または軍事的に重要な位置にある場所を意味します。"}]}, {"title_ja": "米海軍提督、報告された心理健康上の懸念の中でリンカーン号乗組員を称賛", "title_en": "US Admiral Praises USS Lincoln Crew Amid Mental Health Concerns", "summary_ja": "米中央軍のブラッド・クーパー提督は、250日以上の航海で寄港がない状態での心理健康上の問題が報告されたエイブラハム・リンカーン航空母艦を訪問し、乗組員を称賛しました。クーパーは、米海軍11隻の活動中の航空母艦の中でリンカーン号が最も低い心理健康関連の事例数を有していると述べましたが、長期海上勤務の独特な課題を認めました。この状況により連邦議会の懸念を促し、米国は別の航空母艦の配備転換を行っています。", "summary_en": "US Admiral Brad Cooper visited the USS Abraham Lincoln aircraft carrier after reports of mental health struggles among its 5,000-member crew, who have been at sea for over 250 days without port calls. Cooper stated the carrier has among the lowest mental health cases in the US Navy, though he acknowledged the unique challenges of extended sea service. The situation has prompted Congress to voice concerns and the US to redeploy another carrier as a replacement.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/16/us-admiral-praises-uss-lincoln-crew-amid-reported-mental-health-concerns?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "US admiral praises USS Lincoln crew amid reported mental health concerns\nPoliticians voiced alarm over mental health struggles on carrier, with reports of sailors attempting to jump overboard.\nUS Admiral Brad Cooper has visited the USS Abraham Lincoln aircraft carrier after reports of mental health and supply issues and described the crew as “awe-inspiring”.\n“Of the US Navy’s 11 active aircraft carriers, the Lincoln currently has among the lowest number of cases related to mental health,” the commander of US Central Command said in a statement shared on X.\n“This doesn’t mean that all is perfect…service at sea for long periods isn’t for everyone. It is uniquely challenging and tough, and every single one of us, including me, reacts to stressors in different ways,” he added.\nCooper’s visit comes amid reports that the crew were suffering from the unusually long time spent at sea without a port call – more than 250 days. The ship is an integral part of the US war on Iran and lawmakers in Congress have raised concerns about the mental and physical health of the 5,000-strong crew, several of whom have reportedly attempted to jump overboard.\nThe US is redeploying another carrier, the USS George Washington, from near Japan, to replace the USS Lincoln. Asked by a reporter on Friday if the USS Lincoln had been deployed for too long, President Donald Trump responded: “No, not nearly long enough”.", "translation_ja": "", "vocab": [{"word": "integral", "definition": "欠かせない、不可欠な意味で、全体の一部として重要な役割を果たしている状態を指します。"}, {"word": "redeploy", "definition": "軍隊や資源を別の場所に再配置すること。元の配置場所から新しい任務地へ移動させることを意味します。"}, {"word": "amid", "definition": "〜の最中に、〜のさなかに、という意味の前置詞。困難な状況などの中で何かが起こることを表現します。"}, {"word": "vouch for", "definition": "〜を保証する、〜が確かであることを証言する意味。ここでは政治家が懸念を表明することを指します。"}, {"word": "stressor", "definition": "ストレスの原因となるもの。心理的または身体的な負荷をもたらす要因や状況を指します。"}]}, {"title_ja": "ブラジル大統領選：ルーラとボルソナーロが支持基盤で選挙活動を開始", "title_en": "Brazil's Lula and Bolsonaro Launch Presidential Campaigns in Political Strongholds", "summary_ja": "ブラジルの2大大統領候補者であるルーラとボルソナーロが、10月の選挙を前に支持基盤で選挙活動を開始しました。両候補はブラジルで記録的な高さに達している女性殺人と性暴力への対策を約束することで、女性有権者にアピールしています。この選挙は外国干渉と貿易政策をめぐる緊張の中で、国の方向性を決定します。", "summary_en": "Brazil's two main presidential candidates, Lula and Bolsonaro, have launched their campaigns ahead of the October election by rallying supporters in their political strongholds. Both candidates are appealing to women voters by pledging to combat rising femicide and gender violence, which has reached record levels in Brazil. The election will determine the country's direction amid tensions over foreign interference and trade policy.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/16/brazil-lula-bolsonaro-return-to-strongholds-to-launch-runs-for-president?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Brazil: Lula, Bolsonaro return to strongholds to launch runs for president\nCandidates Lula and Bolsonaro appeal to Brazil’s women voters with promises to combat rising femicide and gender violence.\nBrazil’s two main presidential candidates have inaugurated their campaigns by mustering supporters in their political strongholds ahead of what is expected to be a fierce October election.\nPresident Luiz Inacio Lula da Silva spoke with nostalgia to more than 10,000 supporters on Sunday at the Vila Euclides Stadium outside Sao Paulo – a city where he rose to political fame 47 years ago as a metalworkers’ union leader during the country’s 1964-1985 military dictatorship.\nThe 80-year-old, wearing a hat after a skin cancer diagnosis, insisted Brazil needs more of his policies.\nSenator Flavio Bolsonaro, age 45 and one of the sons of former President Jair Bolsonaro, gathered with thousands of voters on Copacabana Beach in Rio de Janeiro. His father, under house arrest following his conviction for an attempted coup, did not attend the rally.\nLula echoed his own earlier comments denouncing foreign interference in Brazil’s politics. His allies have accused the United States government of seeking to boost Flavio Bolsonaro’s bid with measures such as raising tariffs on Brazilian exports and revoking the visa of Brazil’s ambassador to Washington.\nSpeaking about Brazil’s vast reserves of rare minerals, Lula said, “No one [abroad] will tap our minerals. We are going to tap them for the benefit of the Brazilian people.”\nBolsonaro argued that he is “the only one who can sit with the United States, with China, with Israel, with the Middle East, with India and with Argentina to make the best and biggest trade deals for our nation.”\nHis party’s convention was attended by Argentina’s President Javier Milei. Israeli Prime Minister Benjamin Netanyahu and several members of the Trump administration have expressed support for him.\nBoth top candidates appeal to women voters\nWomen account for nearly 53 percent of Brazil’s 158 million eligible voters, according to the country’s electoral court.\nBoth Lula, who is seeking his fourth nonconsecutive term, and right-wing challenger Bolsonaro have used the fight against gender violence to appeal to voters.\nBrazil registered nearly 400 femicides (the killing of a female because of her gender) in the first quarter of 2026, the highest number for the period since the country first began tracking the crime 11 years ago, according to Brazil’s Justice and Public Security Ministry’s database.\n“Men need to learn from childhood that they are no better than women. We need to be equal,” said Lula, as First Lady Rosangela da Silva stood by his side, nodding. She was one of the event’s main speakers in Sao Bernardo do Campo, where Lula lived for many years.\nThe rally wasn’t the first time the president has confronted this heavily entrenched crisis. During his Workers’ Party convention to launch his re-election bid in early August, Lula had said that men who commit acts of domestic or gender-based violence must choose between supporting him or hitting a woman, declaring that if they choose violence, “they don’t need to vote for me”.\nLula said he would launch a platform within 10 days, noting that more details are still to come on his gender-responsive policies, including education initiatives and laws to further thwart and punish violence against women.\nFemicide laws and legal protections for women in Brazil have only sluggishly improved over time. In 2024, femicide stopped being classified as an aggravated form of homicide and finally became a separate crime, punishable by 20 to 40 years in prison. Still, the grim trend has not abated.\nMeanwhile, with his mother and wife by his side, Bolsonaro promised his supporters that he would also work to fight violence against women.\nBrazilians will vote in the presidential election on October 4.", "translation_ja": "", "vocab": [{"word": "femicide", "definition": "女性であることを理由に女性を殺害する犯罪。ジェンダーに基づく殺人の一形態であり、一般的な殺人より重大な犯罪として扱われることが多い。"}, {"word": "stronghold", "definition": "政治的または経済的に支配または支配力が強い地域。ある政治家や政党が伝統的に強い支持を持つ地域を指す。"}, {"word": "nonconsecutive", "definition": "連続していない、間隔を置いた。複数の任期が行われるが、その間に他の人物の任期が挟まる場合に使用される。"}, {"word": "aggravated", "definition": "より重大または深刻にされた。犯罪の場合、基本的な罪の形態よりも悪い状況や条件がある場合に使用される。"}, {"word": "entrenched", "definition": "しっかりと確立された、根深い。ある状況や習慣が長く続いており、変更が難しい状態を表す。"}, {"word": "tariff", "definition": "輸入品または輸出品に課される税金。国家間の貿易に影響を与える政策手段として機能する。"}]}, {"title_ja": "米イラン覚書の期限切れ：延長の見込みはほぼない", "title_en": "US-Iran Memorandum of Understanding Set to Expire with No Extension in Sight", "summary_ja": "6月に両国間の軍事作戦を終わらせるために署名された米イラン覚書は、月曜日に期限を迎えるが、双方が延長する見込みはほとんどない。両国は相互に協定違反を非難しており、制裁緩和、海上封鎖、ホルムズ海峡の再開など基本的な実施問題をめぐる紛争が生じている。イラン当局者は米国の非遵守により停戦は既に時代遅れになったと主張している一方、カタールとパキスタンからの仲介努力が続いている。", "summary_en": "The US-Iran Memorandum of Understanding, signed in June to end military operations between the two nations, is set to expire on Monday with little indication either side will extend it. Both nations have accused each other of violating the agreement, with disputes over basic implementation issues including sanctions relief, naval blockades, and the reopening of the Strait of Hormuz. Iranian officials assert the ceasefire has already become obsolete due to US non-compliance, while the future remains uncertain as mediation efforts from Qatar and Pakistan continue.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/16/us-iran-mou-is-set-to-expire-what-to-know?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "US-Iran MoU is set to expire: What to know\nThe Memorandum of Understanding aimed at ending fighting between the US and Iran is set to expire on Monday, with little sign that either side is willing to extend the agreement, which both sides have accused the other of violating for weeks.\n“We have not yet made a decision to restart negotiations with the United States,” Iranian Foreign Minister Abbas Araghchi said in a post on Telegram on Saturday.\nMeanwhile, mediators from Qatar and Pakistan continued to exchange messages with Iran. Araghchi added that Iran was working on a separate agreement with Oman to hash out new shipping routes for the Strait of Hormuz, but emphasised that this was only possible if a political solution was reached.\nOn the US side, President Donald Trump told supporters in New York on Friday that the US would soon claim the critically important waterway for itself.\nHere’s what you need to know as the MoU expires.\nWhat is the MoU?\nThe agreement, signed on June 17 by Trump and Iranian President Masoud Pezeshkian, followed rare high-level talks hosted by Pakistan. It was meant to bring an end to more than three months of war that had killed thousands and crippled commercial movement in the Gulf, especially of oil and gas exports relied on globally.\nLeaving complex issues such as Iran’s nuclear programme to be dealt with later, the agreement sought not only to find an immediate diplomatic solution to halt the war with Tehran, but also to find an end to conflict in Lebanon.\nIran and the US, the agreement said, “declare the immediate and permanent termination of military operations” and that a “final deal” would “confirm the permanent termination of the war on all fronts.” The agreement said this “final deal” would be endorsed by the UN Security Council and would be reached in a maximum of 60 days, which could be extended by mutual consent.\nThe US was to end its naval blockade within 30 days, remove its forces from near Iran after the “final deal” was reached and begin work on a reconstruction and development package for Iran of at least $300bn. Washington also agreed to terminate sanctions against Iran, issue waivers for Iranian oil exports and allow Tehran to access frozen funds. Iran, for its part, was to clear mines from the Strait of Hormuz and allow ships to pass “with no charge” for 60 days.\nTehran also reaffirmed it would not seek nuclear weapons and would negotiate on issues such as enrichment, the details of which would be laid out in a “final deal” to be backed by the UN.\nWas the MoU successful?\nAlthough the US and Iranian versions of the agreement differed slightly, much of the dispute since its signing has centred on more basic issues, such as whether it was a ceasefire or a more permanent agreement and what each side was supposed to do.\nWhether the entire agreement was still in effect soon became disputed, and by June 27 , Trump was calling Iranian strikes in the region “a foolish violation” of the deal. Iran said US strikes “violate Article 1 of the Memorandum of Understanding”.\nOn July 7 , Trump said the agreement was “over,” and the US continued launching attacks on Iran, including on what Tehran called civilian infrastructure, killing at least 50 people. Iranian officials said the US had “violated and suspended” all its commitments and Tehran had “likewise suspended all our own commitments”.\nSince then, the US has not fully lifted sanctions on Iran and Trump has scoffed at the idea of paying Iran for reconstruction, suggesting instead that Tehran pay compensation to families of protesters it had killed “over the last 50 years” as well as “all the people they have killed and gravely wounded with their roadside bombs and many conflicts”.\nReopening Hormuz has not materialised either, with Iranian and US officials continuing to insist their side controls the strait. Earlier this week, the Pentagon said it had fired on a Panama-flagged cargo vessel in the strait because it “violated the US blockade against Iran.”\n“The ceasefire stopped and was rendered obsolete after the US didn’t comply with the terms of the agreement, or the MoU,” Mostafa Khoshcheshm, professor at the University of Applied Sciences in Tehran, told Al Jazeera.\nIn particular, he added, Tehran views the US as having failed on its promises of releasing Iranian assets, lifting sanctions, removing its naval blockade and having Israel withdraw from southern Lebanon. “Now, formally, on paper, it is said the deadline has ended,” Khoshcheshm said.\nWhat happens next?\nAlthough the MoU is set to expire on Monday, what that means exactly depends on which side you ask.\nIran’s Araghchi said on Friday that what was in the Islamabad MoU was “the end of the war, not a ceasefire”, according to the Iranian Students’ News Agency (ISNA). He added that since the US violated the MoU and continued attacks, “there was no 60-day ceasefire that needed to be extended”.\nThe recent reshuffle in Iran’s national security apparatus suggests a tough", "translation_ja": "", "vocab": [{"word": "Memorandum of Understanding", "definition": "正式な合意や協定を意味する法律用語で、両当事者が合意した基本原則や条件を記載した書面。日本語では「覚書」や「了解覚書」と呼ばれ、国家間や組織間の基本的な合意事項を示す重要な文書である。"}, {"word": "crippled", "definition": "機能や能力を著しく損なわせる、または機能不全にさせることを意味する動詞。ここでは湾岸地域の商業活動が深刻に阻害されたことを表現している。"}, {"word": "naval blockade", "definition": "軍事用語で、海軍による港や海域の遮断を意味する。特定の国への物資輸送を制限する戦略的手段として使用される。"}, {"word": "obsolete", "definition": "時代遅れになった、または機能しなくなった状態を意味する形容詞。ここでは覚書がもはや有効ではなくなったことを表現している。"}, {"word": "sanctions", "definition": "政治的目的で特定国に対して課される経済的制限措置を意味する。輸出入禁止や資産凍結などが含まれる国際的な罰則制度である。"}, {"word": "mediation", "definition": "紛争や対立している当事者間の合意を促進する第三者による仲介活動を意味する。外交交渉において重要な役割を果たす。"}]}, {"title_ja": "サウジアラビア、イエメン国境のジャザン州への警告を発令", "title_en": "Saudi Warns of Danger in Jazan Province as Houthi Attacks Continue", "summary_ja": "サウジアラビアの民間防衛機関は、フーシ派による繰り返される攻撃を受けてイエメン国境沿いのジャザン州に警告を発令した。イスラエルは上級司令官の殺害につながった攻撃に続いてヒズボラへの再度の攻撃を誓い、イランは米兵に対する30,000ドルの懸賞金を発表した。", "summary_en": "Saudi civil defence issued a warning for Jazan province along the Yemen border after repeated Houthi attacks on energy installations. Israel vowed to strike Hezbollah again following strikes that killed a senior commander, while Iran announced a $30,000 bounty for U.S. soldiers.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-us-west-asia-war-strait-of-hormuz-donald-trump-live-updates-on-august-16-2026/article71351835.ece", "state_media": false, "category": "政治", "full_text": "Saudi soldiers are seen near the border with Yemen. Representational file image.\n| Photo Credit:\nAP\nThis live blog is closed.\nThe Saudi civil defence agency issued an alert on Sunday (August 16, 2026) warning of “potential danger” in southern Jazan province along the border with Yemen that has been targeted by Yemeni rebels recently.\nThe Tehran-backed Houthi rebels in Yemen have repeatedly targeted energy and petroleum installations in Jazan in recent weeks.\nIsrael vowed Sunday (August 16, 2026) it would hit Hezbollah again if threatened, as it identified what it described as a commander killed in strikes a day earlier that also left several children dead. The Israeli military identified one of those killed on Saturday as Abu Hassan Alaa, saying he was a senior commander of Hezbollah’s Badr unit who had been involved in firing drones at Israeli troops.\nIsraeli strikes killed 11 people in southern Lebanon, according to authorities, in the deadliest attacks since a deal was reached in June aimed at ending hostilities.\nIran’s military announced on Sunday (August 16, 2026) that it was offering a bounty equivalent to $30,000 for killing or capturing U.S. soldiers, with the reward doubled if carried out by a woman. Army chief Amir Hatami said the plan had been drawn up following “the large number of requests” to participate in the financial support, according to the IRNA state news agency.\nAugust 16, 2026 23:12\nIranian Parliament advances bill to curb foreign influence\nIran’s Parliament approved on Sunday (August 16, 2026) the general principles of a bill that would criminalise interviews and other communications with media deemed hostile to the Islamic Republic, including U.S. or Israeli media and outlets financed by either country, Iran’s Shargh newspaper reported. Osman Salari, a member of parliament’s judicial and legal commission, said the individual provisions of the bill, which is aimed at countering foreign intelligence influence, have yet to be debated and approved. Reports about the bill’s details should not yet be considered final, Salari told the Mizan news agency.\nUnder the proposed bill, interviews or participation in discussions with such media would be banned and violations would carry six months to two years in prison.\n- Reuters\nAugust 16, 2026 23:11\nIran offers $30,000 bounty for killing, capturing U.S. soldiers\nIran’s military announced on Sunday (August 16, 2026) that it was offering a bounty equivalent to $30,000 for killing or capturing U.S. soldiers, with the reward doubled if carried out by a woman.\nArmy chief Amir Hatami said the plan had been drawn up following a “large number of requests” to participate, according to the IRNA state news agency.\nThere has been no known deployment of U.S. ground forces in Iran during the West Asia war, with the exception of a rescue mission in April for a downed American airman.\n- AFP\nAugust 16, 2026 18:53\nSaudi authorities issue warning for Jazan province along Yemen border\nThe Saudi civil defence agency issued an alert on Sunday (August 16, 2026) warning of “potential danger” in southern Jazan province along the border with Yemen that has been targeted by Yemeni rebels recently.\n“A warning has been issued by the National Early Warning Platform in the Jazan Province to alert of a potential danger,” read the statement by the agency, with similar alerts usually issued ahead of potential strikes targeting an area.\nThe Tehran-backed Houthi rebels in Yemen have repeatedly targeted energy and petroleum installations in Jazan in recent weeks.\n- AFP\nAugust 16, 2026 18:52\nTrump envoy Kushner discusses Gaza with Egypt's Sisi: presidency\nU.S. President Donald Trump’s envoy and son-in-law Jared Kushner talked with Egyptian President Abdel Fattah al-Sisi on Sunday (August 16, 2026) about the implementation of the Gaza ceasefire, Mr. Sisi’s spokesperson said.\nThe meeting in the Mediterranean city of El-Alamein “emphasised the need for all parties to fulfill their obligations under the Gaza Strip ceasefire agreement”, spokesperson Mohamed El-Shennawy said in a statement.\n- AFP\nAugust 16, 2026 18:44\nPope calls for an end to West Bank violence against Palestinians\nPope Leo called on Sunday (August 16, 2026) for an end to violence against Palestinians in the occupied West Bank, amid a surge of attacks by militant settlers and a siege in the territory’s village of Qusra.\nIsraeli settlers encircled houses after cutting off water and electricity, in what rights groups have said is a concerted effort to seize more land, and further eat into territory where Palestinians aim to establish a state.\n“I renew my appeal for an end to the repeated violence against the Palestinian civilian population in the West Bank,” the Pope said, without mentioning specific confrontations or attacks.\n“I urgently ask the international community to take action so as to advance the two-state solution, for a fair and lasting peace,” the Pope added after noon prayers at his Castel Gandolfo residence ou", "translation_ja": "", "vocab": [{"word": "Tehran-backed", "definition": "テヘラン（イランの首都）によって支援される、または資金提供される。政治的・軍事的な背後関係を示す表現。"}, {"word": "installations", "definition": "設置された施設や構造物。特にエネルギー施設や軍事施設など、重要なインフラを指す。"}, {"word": "bounty", "definition": "報奨金。特定の行動や目標達成に対して提供される金銭的報酬。"}, {"word": "criminalise", "definition": "（行為や活動を）犯罪化する、違法にする。法律によって禁止される対象にする。"}, {"word": "hostilities", "definition
