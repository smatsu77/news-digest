": "敵対行為。紛争や戦闘による対立や攻撃行為の総称。"}, {"word": "siege", "definition": "包囲。軍事的に地域を取り囲んで孤立させ、補給路を遮断する作戦。"}]}, {"title_ja": "ロシア・ウクライナでの攻撃で19人が死亡、無人機とミサイル攻撃が激化", "title_en": "Strikes Kill 19 in Russia and Ukraine as Drone and Missile Attacks Intensify", "summary_ja": "2026年8月16日、ロシアとウクライナ全域での無人機とミサイル攻撃により19人が死亡し、両国は民間インフラへの長距離攻撃を大幅に強化している。ウクライナはロシアによるアルセロール・ミタル製鉄所とキエフの書籍市場への攻撃を報告し、ロシアはウクライナの無人機数百機を撃墜した。前線での戦闘が膠着し、和平交渉が凍結される中、民間人の犠牲者数は2022年の戦争初期以来、最高水準に達している。", "summary_en": "Waves of drones and missiles killed 19 people across Russia and Ukraine on August 16, 2026, with both nations escalating long-range attacks on civilian infrastructure. Ukraine reported Russian strikes on the ArcelorMittal steel plant and a Kyiv book market, while Russia intercepted hundreds of Ukrainian drones. With front-line fighting stalled and peace talks frozen, civilian casualties have reached their highest levels since the war's opening months in 2022.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/strikes-kill-several-people-in-russia-and-ukraine/article71353917.ece", "state_media": false, "category": "政治", "full_text": "Strikes killed 19 people in Russia and Ukraine, authorities said Sunday (August 16, 2026), as waves of drones and missiles pummelled civilian infrastructure on both sides.\nWith fighting at the front at a near standstill and talks frozen, the warring countries have significantly stepped up long-range attacks deep behind each other’s lines, pushing the civilian death toll to its highest levels since the war’s first months in 2022.\nIn Russia, swarms of Ukrainian drones killed five people in a residential area of the southern Rostov region, regional governor Yuri Slusar said.\nThree more people were killed in the Belgorod, Kursk and Moscow regions, along with four others in parts of Ukraine occupied by Russia.\nMoscow’s regional governor Andrey Vorobyov described the assault as “one of the most massive drone attacks in recent memory”. Russia’s defence ministry said it had intercepted 822 drones across the country overnight.\nKyiv market hit\nIn Ukraine, a barrage of Russian drones and missiles killed two people and wounded 14 at ArcelorMittal’s steel plant in Kryvyi Rih, President Volodymyr Zelenskyy’s hometown.\nThe plant, one of Ukraine’s biggest steel producers, said it partially halted operations after the strike damaged its core production facilities.\nAnother strike hit Kryvyi Rih on Sunday evening (August 16, 2026), killing one person.\nStrikes also hit other regions, killing two people in the southeastern Zaporizhzhia region, one in the border region of Sumy and another in Donetsk in the east.\nIn Kyiv, a popular outdoor book market at Pochaina, long the place to find rare and antiquarian volumes, was struck. Bookseller Dmytro Semenukha saw all four of his stalls burn to the ground.\n“There used to be a store. And books, and flags of all the countries, all the countries. Tonnes of everything. And that’s it,” the 45-year-old told AFP.\nIn a social media post on the overnight raid, Mr. Zelenskyy said that “wherever the Russians can reach with their ballistic missiles, they strike civilian infrastructure”.\nOver the past week, he said, Ukrainian cities had been pummelled by “more than 1,550 attack drones, nearly 1,560 guided aerial bombs, and 62 missiles”, as he renewed his appeal to allies for more air defence.\nRussia has carried out near-daily missile and drone strikes across Ukraine since launching its full-scale invasion in early 2022.\nIt has recently intensified attacks using hard-to-intercept ballistic missiles, exploiting Ukraine’s air defence shortages after the U.S.-Israeli war against Iran diverted supplies.\n“When North Korean ballistic missiles destroy infrastructure and claim lives here in Europe, European interceptors cannot simply be allowed to sit in storage,” Mr. Zelenskyy said.\nPublished - August 17, 2026 02:22 am IST", "translation_ja": "", "vocab": [{"word": "pummelled", "definition": "繰り返し激しく打つ、攻撃する。ここでは無人機やミサイルが民間インフラに何度も激しく攻撃を加える様子を表します。"}, {"word": "barrage", "definition": "大量の砲撃または一連の激しい攻撃。短時間に多数の兵器が同時に発射される状況を指します。"}, {"word": "intercepted", "definition": "遮断する、捕捉する。飛来する無人機やミサイルを途中で撃ち落とす、防御する意味で使用されます。"}, {"word": "ballistic missiles", "definition": "弾道ミサイル。計算された軌道に沿って飛行し、防御が難しい攻撃型ミサイルの総称です。"}, {"word": "exploiting", "definition": "利用する、活用する。弱点や不利な状況を戦略的に活用することを意味します。"}, {"word": "antiquarian", "definition": "古書の、古い本に関する。稀少本や歴史的価値のある古い書物に関わる専門分野を指します。"}]}, {"title_ja": "イスラエル、ヘズボラへの追撃を誓約 致命的な攻撃後", "title_en": "Israel Vows Further Action Against Hezbollah After Deadly Strikes", "summary_ja": "イスラエルは8月15日、イスラエル兵に損害を与えたドローン攻撃への報復として、レバノン南部で11人を殺害する攻撃を実施しました。この攻撃は6月の停戦合意以来最も深刻なもので、民間人を含む子どもたちも殺害されました。イスラエルの国防相は脅威があれば軍事行動を継続すると誓約し、国際機関とヘズボラは民間人被害を非難しました。", "summary_en": "Israel conducted strikes in southern Lebanon on August 15, killing 11 people including Hezbollah commanders, in response to drone attacks that injured Israeli troops. The strikes, which killed civilians including children, mark the deadliest attacks since a ceasefire agreement in June. Israel's defense minister pledged to continue military action if threatened, while international observers and Hezbollah condemned the civilian casualties.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/israel-vows-to-go-after-hezbollah-as-it-names-another-killed/article71353742.ece", "state_media": false, "category": "政治", "full_text": "Israel vowed Sunday (August 16, 2026) it would hit Hezbollah again if threatened, as it identified what it described as a commander killed in strikes a day earlier that also left several children dead.\nIsraeli strikes on Saturday (August 16) killed 11 people in southern Lebanon, according to authorities, in the deadliest attacks since a deal was reached in June aimed at ending hostilities.\nIsrael said the strikes were a response to Hezbollah setting off explosive drones inside a so-called \"security zone\" in southern Lebanon, seriously injuring three Israeli troops including an officer.\n\"No score will be left unsettled in any arena. We'll defend our soldiers and our civilians with full power,\" Defence Minister Israel Katz wrote on X.\nThe Israeli military identified one of those killed on Saturday (August 16) as Abu Hassan Alaa, saying he was a senior commander of Hezbollah's Badr unit who had been involved in firing drones at Israeli troops.\nIsrael earlier said that the strike killed a commander in Hezbollah's elite Radwan Force, Ali Samir Al-Haj Hassan.\nThe Israeli military acknowledged that Hassan's family was present but defended the strike by saying they were not the target.\nLebanese President Joseph Aoun said a \"whole family\" had been killed in the strike in the village of Ansar, with Lebanon's health ministry reporting that three children and two women died.\nImran Riza, the UN humanitarian coordinator for Lebanon, condemned the strike.\n\"Children and civilians continue to pay an unacceptable price. International humanitarian law is clear: civilians must be protected at all times,\" he said.\nPrime Minister Benjamin Netanyahu's office accused Hezbollah of deliberately placing civilians in harm's way.\nHezbollah denied the account, saying that \"another entire family has been wiped out following orders issued by Mr. Netanyahu\".\n\"Netanyahu, who is the subject of proceedings before the International Criminal Court over war crimes and crimes against humanity committed in Gaza, is once again presiding over the killing of Lebanese civilians,\" Hezbollah said in a statement.\nHezbollah pulled Lebanon into the regional war in March by firing rockets at Israel in support of Iran, after U.S.-Israeli strikes there sparked war in late February.\nLebanon and Israel signed a U.S.-brokered deal in which Lebanon's army will gradually take over security in southern areas occupied by Israel, but Hezbollah has refused to disarm.\nPublished - August 16, 2026 10:44 pm IST", "translation_ja": "", "vocab": [{"word": "vow", "definition": "固く約束する、誓う。政治家や組織が重要な行動や方針について公式に約束することを指します。"}, {"word": "commander", "definition": "指揮官、司令官。軍事組織やテロ組織において部隊や作戦を統率する上級職を意味します。"}, {"word": "hostilities", "definition": "敵対行為、戦闘。国家や組織間の武力紛争や対立を指す正式な表現です。"}, {"word": "humanitarian", "definition": "人道的な、人道支援関連の。民間人の苦痛を軽減し保護することを目的とする活動や組織を表します。"}, {"word": "disarm", "definition": "武装解除する、兵器を放棄する。武装勢力が武器を手放すことを意味します。"}, {"word": "brokered", "definition": "仲介した、仲立ちした。第三者が紛争解決のための合意や取引を成立させることを指します。"}]}, {"title_ja": "カナダ中央銀行の代替労働者使用について沈黙するカーニー政権を労働組合が批判", "title_en": "Unions criticize Carney government for silence on Bank of Canada's use of replacement workers", "summary_ja": "労働組合はカナダ中央銀行の代替労働者採用問題に対してカーニー政権が沈黙していることを強く批判している。労働組合は政府の対応の欠如が労働者の権利支援の失敗を示していると主張している。この沈黙は組織された労働勢力と現政権間の対立の焦点となっている。", "summary_en": "Labor unions have voiced strong criticism of the Carney government for not addressing the Bank of Canada's employment of replacement workers. The unions argue that the government's lack of response to this practice represents a failure to support workers' rights. This silence has become a focal point of contention between organized labor and the current administration.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxQdE9EMDFncDQzYTBUNzFSYnRpck1mQndmS3NhNDdOV1RYQnl4TVl4Q0YxZENLU29pQkVCUWNwUmhyUGtRUjBhNWZ3eDNrT3V0WHhTY01RUUVBYUZOUktVTGhTMWxUVHZCYktlaUhzZWp6THExVFphNDJrZXJocnpITjlqR2Z2V21ud01fcm5YVXpCY2ptTE1KNjR2UkdUNGhjcmtpaWFHN3cxMWpoX1liNThxSWU2WnFKc2hWZ1dXekRFTXFaejFrNlJkWXV5aERIcGh4eW82cTVyUDI3Ukk1Nkd3T2RRd3czdFJhb2tOWXFTOF9yeTNxdTFQaU9BMkZWMVhqRExvbnlhUms?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "保健大臣、アルバータ州の民間医療拡大計画は連邦法違反の可能性があると警告", "title_en": "Health Minister Warns Alberta's Private Care Expansion May Violate Federal Law", "summary_ja": "カナダの保健大臣は、アルバータ州が民間医療サービスの拡大を計画していることが連邦法に違反する可能性があると警告した。この警告は、州の医療政策と国家的規制要件の間の緊張関係を浮き彫りにしている。アルバータ州の民間医療構想は、既存の連邦医療枠組みに基づく法的課題に直面している。", "summary_en": "Canada's Health Minister has cautioned that Alberta's plan to expand private healthcare services could breach federal legislation. The warning highlights tensions between provincial healthcare policy and national regulatory requirements. Alberta's private care initiative faces potential legal challenges under existing federal healthcare frameworks.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi-AFBVV95cUxPVHdwakZUZXNoZUFzcG8zMG51dUdjMF9veC1iOUhzdXU1ekdyNmNXOFcyRThUYUtNYzdLVzgwTVNnemdmNmpod3BRRkgyWkEyV1QwNjBhTlZOMWo5X1BwT29FcE1DcWhVc1ZJemFHeWNwR1hLbHo2UFhrQk45bXpiUlZvaVd2RlYtcTNXVjdBZUxCaHJtSUZLUUEzYTBRYS1uZGoyME0zVUNRMWg2YmhEZ204RW9Yb05sWFBJcFhDV05NTld2ZDlYQVB0c0JNVmJNRTJ3SDRJM0prTjllZWZmZExhRFRWT0dQZm8xdFNPSDNtR0l0bHR5aQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ダグ・フォード、トロント中心部の自転車レーンの撤去で裁判に勝利", "title_en": "Doug Ford Wins Court Battle to Remove Toronto's Downtown Bike Lanes", "summary_ja": "オンタリオ州のダグ・フォード首相は、トロント中心部の主要な自転車レーンの撤去を認める重大な法的勝利を獲得した。この裁判所の判断により、同州はこれらの自転車インフラの整備を市の中心部から廃止することが可能になった。", "summary_en": "Ontario Premier Doug Ford has won a significant legal victory that will allow the removal of Toronto's main downtown bicycle lanes. The court decision clears the way for the province to proceed with eliminating these bike infrastructure features in the city's core.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi-AFBVV95cUxOa2ZTM0xrSnZaU3BDdUtaVGctSHRHWnQ4MXVyaTNTUG9zWU9EcVU0ZDBOLTU1dHRjc21LYmFoMnVaeHNCcDg1ekJEVUtoZnJhZGMtRk8tS2o0djhJSGFTenVOWXlrUmVHYWJEcDk3TmdkNm1ETDdtTUNPTDhuX00tVUdrZ0I3YTZ1d0duVmwwR25rSXptamUtWkNnUjlHUGhBV0Zicy1ySkJTT3VOU2l1UDkwVFdzQ1pzUUhHMTJDODlOMUxMZnFCZjVtRm9pWmk1ME00WXRySlFlYnVybmhzMWNSNTJTeDhWM0VqVXRJMUpnamhTRDZKWA?oc=5", "state_media": false, "category": "社会", "full_text": "", "transl nema. This nomination places the film among an elite group of only five Brazilian feature films to receive this honor in Oscar history. The article reviews the previous Brazilian films that have achieved this prestigious recognition.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxNN20zQ0dhNkNSR0R2alRBX3R6OC1wZ2R3SFJTVDRCS21ocUlGRUVFZ3RJV3BRS2h1ZE9IQUhVV1ZrUXd4TDlBeVlaMGptMFdLNG1zMkg0M0Fxa2ZXODhzT1Z1UEtfUzMzNDNsUEY2VDNpX0dRemU2R2t2UTBlRXgxd2RPNTV5anNtaFQ5V2tUMm9ONTdyV3VVYjY2SDA0Y3d1QUI1V0VHTk04aThfRmxFNnJRY0g5VXNHbl9PMHc3Y0NkZkJtMEtrUmc1aFgwSm8yMW1FWmZqcy01TThXa0Eyam40Mml1ZDljQlZzUFprOEREZkozNWxXZlFfWFhhR3FGWHowZWp1SVpYQkXSAZoCQVVfeXFMTm5adThzODkxWGFUb1J0aUpId0FwTjVZRWM5bVJOQVNjOVl3WlhIY0Y0U0pGVGFHVkxDU0w3b2xTclBRR04yVFYxWmJQS0lvcUZrRnRoMXBRZllWTndPR1VVd25DX0U2VWRjcmZ4cnBpZVM1RENwQzlIU0diYVRtX1lESjZYRm5SSmlqMEpDcFVyT0hDYlBKWEZabXFfZ0U5LXMybjNURjJLeXJHZU5DSnVPRUEyUVJtOUZDQUdYVnk1Yks4Mm9aNnhZWFlSbXFBZllhU0tSb0NlbWxzMVBhMF84RnB0SlNDMFh2ZGRaRENZY0EtT1d3SzB4UDZ2S1NJNGRvTl90SW5CSFA1elNTaXFqeFpMbjdiRGF3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グルーポ・グローボ、創立100周年に向けた企画を準備", "title_en": "Grupo Globo Prepares Initiatives for Centennial Year", "summary_ja": "メディア大手のグルーポ・グローボは、創立100周年を記念した特別な企画を計画しています。同社は同社の歴史におけるこのマイルストーンを祝うため、様々なプロジェクトとプログラムを準備しています。", "summary_en": "Grupo Globo is planning special initiatives to commemorate its 100th anniversary. The media conglomerate is preparing various projects and programs to celebrate this milestone in its history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "望む安息のための個人的責任を取ること", "title_en": "Taking Personal Responsibility for Your Desired Rest", "summary_ja": "本記事は、神の介入を受け身に待つのではなく、実践的な責任を取ることで初めて安息と成功が達成されると主張しています。成功した信仰者（CEOのデイビッドや不動産開発業者のサラなど）と失敗した者（ジョナサンやサミュエルなど）の対比例を通じて、信仰と意図的な行動、適切なインフラストラクチャーの組み合わせが苦難のサイクルを断ち切るために不可欠であることを示しています。", "summary_en": "This article argues that achieving rest and success requires taking practical responsibility rather than passively waiting for divine intervention. Through contrasting examples of believers who succeeded (like CEO David and developer Sarah) and those who failed (like Jonathan and Samuel), the author demonstrates that combining faith with deliberate action and proper infrastructure is essential for breaking cycles of struggle.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/903465-taking-personal-responsibility-for-your-desired-rest-3-by-ayo-akerele.html", "state_media": false, "category": "社会", "full_text": "Arise today and step out of the Egyptian cycle of endless, fruitless toil. Take up your yoke, learn the mechanics of the Kingdom, build the structures required to support the blessing, and watch the Lord of the Sabbath transform your regular labour into an enduring, multi-dimensional season of supernatural rest.\nContemporary Believers Who Took Responsibility and Found Rest\nThe Corporate Turnaround Architect\nConsider the story of a senior executive named David, who was appointed as the CEO of a failing manufacturing conglomerate. The company was deeply in debt, labor unions were striking, and market share was evaporating. David spent his first week fasting and praying, asking God for a miracle. During his prayers, he felt a strong impression that God would not drop money from heaven to balance the books; rather, David had to fix the broken operational structure.\nDavid took responsibility. He audited the company’s finances, eliminated redundant processes, transparently renegotiated union contracts, and invested in upgrading their outdated technology. He arrived at the office at 5:00 AM every day, leading by example. Concurrently, he established a voluntary prayer group that met before working hours to anchor the company’s corporate strategy in the wisdom of God. Within eighteen months, the company completely turned around, cleared its debts, and became highly profitable. The constant crises vanished, replaced by a stable work environment. David triggered operational and financial rest for thousands of families because he chose to lead with practical, faith-infused responsibility.\nThe Real Estate Expansion\nThink of a real estate developer named Sarah. For years, her business was stuck in a cycle of small, low-margin residential renovations that kept her under immense financial strain. She constantly prayed for a breakthrough, asking God to bring high-net-worth clients to her doorstep. One day, she realized she had never prepared her business infrastructure for large-scale operations. She lacked institutional financial reporting, a standardized legal framework, and a scalable project management system.\nSarah took responsibility for her business development. She invested her limited savings to hire a certified public accountant, retained a top-tier corporate legal counsel to draft ironclad contracts, and formalized her corporate branding. She actively pitched for a major commercial project that was considered far out of her league. Because her business infrastructure was now excellent and fully compliant, she won the contract against much larger competitors. That single project repositioned her company financially, moving her into a realm of business security where she no longer had to chase clients. Her rest was born out of her willingness to build a structure that could hold the blessing.\nContemporary Believers Who Avoided Responsibility and Missed Their Rest\nThe Unemployed Mystic\nContrast these turnarounds with the story of Jonathan, a brilliant computer science graduate who fell into a deep state of spiritual passivity. After losing his initial job during a corporate downsizing, Jonathan convinced himself that finding another position was solely up to God. He decided he would not submit resumes, network, or upgrade his coding skills. Instead, he spent eight hours a day watching prophetic broadcasts, waiting for a miraculous phone call from an employer who had supposedly tracked down his details by divine revelation.\nMonths turned into years. His savings dried up, his landlord evicted him, and his relationships fell apart under the strain of his financial dependency. Whenever mentors urged him to build a professional portfolio or apply for open positions, he would dismiss their advice, stating, “I am trusting God; if it’s His will, the job will find me.” Jonathan remained trapped in a cycle of poverty and mental unrest, not because God was unfaithful, but because he refused to take the practical responsibility of knocking on doors and sharpening his skills.\nThe Dysfunctional Business Owner\nAnother clear example is Samuel, a passionate believer who owned a retail distribution business. Samuel loved God deeply, closed his store early on Wednesdays to attend church services, and gave generously to ministries. However, he refused to take responsibility for managing his business operations. He kept no inventory records, left cash management entirely unmonitored, and hired employees based solely on church attendance rather than competence. When money went missing or inventory spoiled due to poor storage, Samuel would declare, “The devil is fighting my business, but I plead the blood of Jesus over my losses.”\nDespite his frequent fasting and prayers against the “spirit of lack,” the business slowly collapsed into bankruptcy. Samuel grew bitter, wondering why his heavy spiritual investments did not produce financial rest. The truth was simple: he wanted God to be his manager while he remained a careless owner. He fai", "translation_ja": "", "vocab": [{"word": "conglomerate", "definition": "複数の事業部門や企業が統合された大規模企業グループ。ビジネス用語として、多様な産業に関与する企業体を指します。"}, {"word": "redundant", "definition": "不要な、過剰な、または重複している状態。ビジネスや組織の効率化においては、削除可能な無駄なプロセスを意味します。"}, {"word": "infrastructure", "definition": "ビジネスや組織が機能するために必要な基本的な体系や施設。財務管理、法的枠組み、システムなどの基盤構造を指します。"}, {"word": "margin", "definition": "収益から費用を差し引いた利益率。低利幅ビジネスは利益が限定的であることを意味します。"}, {"word": "compliant", "definition": "法律、規則、基準に従順であり適合している状態。ビジネスにおいては法的要件や業界標準を満たしていることを指します。"}, {"word": "passivity", "definition": "受動的で無行動な状態。積極的な行動を取らず、外部の力や運命に身を委ねる態度を表します。"}]}, {"title_ja": "選挙的背信者：ナイジェリアの宗教指導者の政治的分裂への役割を検証する", "title_en": "Electoral Infidels: Examining Religious Leaders' Role in Nigeria's Political Divisiveness", "summary_ja": "この記事は、シェイク・ヤハヤ・ジンギルとフランシス・ファダフンシ上院議員が選挙での分裂を煽るために宗教的修辞を使用していることを批判しています。著者は、両者とも宗教間の対立を助長し、民主主義原則と国家統一を支持する代わりに宗教的路線での投票を推奨していると主張しています。", "summary_en": "The article critiques Sheikh Yahaya Jingir and Senator Francis Fadahunsi for using religious rhetoric to incite electoral division in Nigeria. The author argues that both figures promote sectarian conflict and advocate for voting along religious lines rather than supporting democratic principles and national unity.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/903462-electoral-infidels-by-wole-olaoye.html", "state_media": false, "category": "政治", "full_text": "There have been calls for the prosecution of both Jingir and Fadahunsi. Unlikely as that eventuality may be, let us at least do what grown-ups do: introspect. The ultimate test of an elder’s relevance is not how much religious divisiveness or political violence he can incite but how he inspires the younger generation — permit me to paraphrase Oscar Hammerstein II — to climb every mountain, ford every stream, and follow every rainbow till they find their dream.\nAnyone against the universal brotherhood of humankind and the secularism of multicultural Nigeria is an infidel. So is anyone who canvasses for bloodletting as a campaign tool or the required red carpet to line the route to gory electoral victory. In my books, both Sheikh Yahaya Jingir and Senator Francis Fadahunsi fit the bill.\nFirst, let’s look at Sheikh Yahaya Jingir.\nSeventy-six-year-old Sheikh Sani Yahaya Jingir is the National Chairman of the Council of Ulama of Jama’atu Izalatil Bid’ah Wa Iqamatis Sunnah (JIBWIS) headquartered in Jos, Plateau State. As the leader of one of Northern Nigeria’s largest Salafi Islamic organisations, his sermons and public declarations hold significant influence among millions of followers.\nHowever, his decades-long public career has also been marked by frequent controversies surrounding sectarian dogma, political ethno-religious mobilisation, and polarising rhetoric. As a prominent Salafi cleric, Jingir’s preaching has historically targeted Sufi orders (such as Tijaniyyah and Qadiriyyah) and Shia Muslims. He has repeatedly issued strict fatwas (theological rulings), declaring certain practices or venerations as acts of takfir (unbelief).\nDivisive Rhetorics\nWith the finality of a religious potentate, he interprets empirical reality from a decidedly narrow lens as if he alone has the private number of the Unmade Maker. These uncompromising theological stances have historically heightened intra-religious friction, leading to theological rivalries among Muslim sects in Northern Nigeria. During election cycles, his sermons often advocate for Muslims to vote strictly along religious lines to maintain political advantage.\nHis base in Jos is burdened with a delicate history of ethno-religious conflicts. Yet, there’s no holding Jingir back when he wants to play his divisive card. Admittedly, his speeches carry significant local weight among his followers. But if the leader is blurry-eyed, what hope do the followers have?\nHis most tendentious habit is his use of exclusionary and derogatory language (e.g., ‘Kafir’) when referencing non-Muslims. Human rights organisations, including the National Human Rights Commission (NHRC), have explicitly labelled such electoral sermons as hate speech and incitement, which violates constitutional guarantees against religious discrimination.\nI don’t have the competence to access his brilliance in Islamic theology, but I recall that he has exposed his ignorance on global issues on several occasions, notably during the COVID-19 pandemic in early 2020, when he publicly dismissed the virus as a foreign conspiracy designed to stop Muslim congregational prayers and prevent pilgrimage. He eventually recanted his stance after government reined him in.\nRecently, he stirred the hornet’s nest when he made some controversial remarks at a political gathering organised by the Jama’atu Izalatil Bid’ah Wa Iqamatus Sunnah in the presence of the Kano State Governor, Abba Yusuf, and his Jigawa State counterpart, Umar Namadi, among other political bigwigs. (You can’t miss the irony!)\nIn a video circulating on social media, Jingir renewed his support for Muslim-Muslim presidential tickets, commending President Bola Tinubu for adopting the arrangement in the 2023 presidential election. “Special thanks to my (political) hero, Bola Tinubu… I am among the staunch advocates of the Muslim-Muslim ticket, and I call on you to come together for a Muslim-Muslim ticket,” Jingir added.\nThe Islamic cleric advised anyone uncomfortable with his preaching to broadcast their own version. “Have I stopped the Christians from their own slogans? Have I stopped traditionalists from a similar campaign? … I urge all of us here to go and get our voters’ cards ready. Let’s show the infidels, who claim they are more populous than us in Nigeria, their limit.”\nChristian clerics and groups have roundly condemned the unprovoked attack. Some prominent Muslim politicians, including Senator Rabiu Musa Kwankwaso, have also spoken against the medieval worldview of Jingir. “Let it be clearly stated: the good people of Kano do not endorse or support these divisive remarks,” argued Kwankwaso.\nSay what you will, Jingir’s supporters view him as a steadfast defender of orthodox Sunni doctrine (Sunnah) and a key voice in promoting Islamic literacy and moral discipline in Northern Nigeria.\nThe truth, as far as I’m concerned, is that Jingir is an electoral infidel. He does not believe in democracy. His allegiance is not to the Federal Republic of Nigeria.", "translation_ja": "", "vocab": [{"word": "introspect", "definition": "自分の行動や態度を深く反省し、内省することを意味します。個人的または集団的に自分たちの行動を評価する際に使用されます。"}, {"word": "sectarian", "definition": "特定の宗教グループや宗派に基づいた対立や偏見を指します。異なる宗教的グループ間の分裂や紛争に関連して使われます。"}, {"word": "fatwa", "definition": "イスラム法学者が発する宗教的判断や法的意見のことです。イスラム教徒の行動についての正当性を判断する公式な宗教的ルーリングです。"}, {"word": "takfir", "definition": "イスラム教において、あるムスリムまたは行為を不信心であると宣言することです。宗教的に異なる実践を非難する際に使用される用語です。"}, {"word": "potentate", "definition": "絶大な権力を持つ支配者または権威者を意味します。この文脈では、独裁的または専制的な支配力を持つ宗教指導者を指します。"}, {"word": "exclusionary", "definition": "特定のグループを意図的に除外または排除する性質を持つことを意味します。差別的またはいくつかの人々を排斥する言語や行動を指します。"}, {"word": "tendentious", "definition": "主張が偏った、党派的である、または特定の議論を支持するように意図的に傾いていることを意味します。公平性を欠いた傾向のある行動を示します。"}]}, {"title_ja": "ナイジェリア、3年間で26,272件の土地証明書に署名、13年間の記録を上回る", "title_en": "Nigeria signs 26,272 land certificates in 3 years, surpassing 13-year record", "summary_ja": "ティヌブ大統領の政権はアブジャで26,272件の占有証明書に署名し、過去13年間に発行された8,697件の証明書を合わせた数を上回りました。FCT大臣ニェソム・ワイク氏は手続きを合理化し、不動産所有者が2週間以内に書類を受け取れるようにし、事業ローンと住宅ローンへのアクセスを促進しました。", "summary_en": "President Tinubu's administration has signed 26,272 Certificates of Occupancy in Abuja since taking office, exceeding the 8,697 certificates issued over the previous 13 years combined. The FCT Minister Nyesom Wike streamlined the process to enable property owners to receive documents within two weeks, facilitating access to business loans and mortgages.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/903460-wike-signs-26272-certificates-of-occupancy-in-abuja-in-three-years.html", "state_media": false, "category": "政治", "full_text": "President Bola Tinubu’s administration has signed 26,272 Certificates of Occupancy (C-of-O) in the Federal Capital Territory, Abuja, since assuming power three years ago.\nThe figure is 17,575 more than the number of signatures collected in 13 years in the federal capital.\nLere Olayinka, media aide to the Minister of FCT, Nyesom Wike, disclosed this in a statement on Sunday in Abuja.\nHe said Mr Wike signed the certificates to ease doing business in the territory, in line with President Tinubu’s Renewed Hope Agenda.\n“To aid the ease of doing business in the Federal Capital Territory (FCT), and in line with President Bola Ahmed Tinubu’s Renewed Hope Agenda, a total of 26,272 Certificates of Occupancy (C-of-O) have been signed by the FCT Minister, Nyesom Wike, since the President assumed office.\n“This is against a total of 8,697 produced and signed between 2010 and 2023,” the statement said.\nOlayinka said that during the five and a half years of President Goodluck Jonathan’s administration, 5,500 Certificates of Occupancy were issued and signed, while 3,197 were issued and signed during the eight years of President Muhammadu Buhari’s administration.\nHe stated that many of the allottees who are beneficiaries of the 26,272 certificates produced and signed by the FCT Administration under Wike got their allocations more than 10 years ago.\nRead the full statement:\nFCT: Tinubu’s govt signs 26,272 Certificates of Occupancy to aid businesses, 17,575 more than [the number] signed in 13 years\nTo aid the ease of doing business in the Federal Capital Territory (FCT), and in line with President Bola Ahmed Tinubu’s Renewed Hope Agenda, a total of 26,272 Certificates of Occupancy (C-of-O) have been signed by the FCT Minister, Nyesom Wike, since the President assumed office.\nThis is against a total of 8,697 produced and signed between 2010 and 2023.\nDuring the five and a half years of President Goodluck Jonathan’s administration, a total of 5,500 Certificates of Occupancy were issued and signed, while 3,197 were issued and signed during the eight years of President Muhammadu Buhari’s administration.\nMany of the allottees who are beneficiaries of the 26,272 Certificates of Occupancy produced and signed by the FCT Administration under Wike received their allocations more than 10 years ago.\nA Certificate of Occupancy serves as trusted collateral for commercial loans, mortgages, or business expansion capital.\nThe inability of property owners to obtain Certificates of Occupancy when needed is a challenge for small and medium businesses, as it restricts access to funding.\nSenior Special Assistant to the FCT Minister on Public Communications and Social Media, Lere Olayinka, said in a statement on Sunday that the FCT Administration under the present Government of President Tinubu has streamlined the process to enable land allottees to receive their documents within two weeks of completing payments.\n“The moment necessary payments are made, land allottees can now get their C-of-O within two weeks.\n“Also, automated notifications have been introduced to ensure that land allottees are informed when their documents are ready for collection,” Olayinka said.\nHe attributed the delays under previous administrations to inefficiencies that discouraged landowners from completing payments.\nALSO READ: Wike signs 5,481 certificates of occupancy\nApart from producing and signing 26,272 Certificates of Occupancy, a total of 2,521 Consents to Assign were granted. In contrast, 177 Consents to Mortgage were granted in the last three years of President Tinubu’s administration, by the FCT Administration under Nyesom Wike.\nThis is against 753 Consents to assign and 180 Consents to Mortgage granted by the administration of President Jonathan, as well as 684 Consents to assign and 164 Consents to Mortgage granted during the eight-year government of President Buhari.\nA consent to assign is a legal document required when selling a property or transferring loan agreements. In contrast, a consent to mortgage is official approval required before a property can be used as collateral for a loan.\nLere Olayinka\nSenior Special Assistant\nPublic Communications and Social Media\nAugust 16, 2026\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "Certificates of Occupancy", "definition": "不動産所有権を法的に証明する公式文書。銀行ローンや住宅ローンの担保として機能し、ビジネス展開の資金調達に重要な役割を果たします。"}, {"word": "collateral", "definition": "ローンの返済が不可能な場合に貸し手に没収される可能性のある資産または担保。信用担保として機能します。"}, {"word": "streamlined", "definition": "プロセスをより効率的で簡潔にすること。官僚的な手続きを削減し、迅速な処理を実現することを意味します。"}, {"word": "Consents to Assign", "definition": "不動産の売却または譲渡契約の変更時に必要な法的許可。財産権の移転を正式に認可する文書です。"}, {"word": "Consents to Mortgage", "definition": "不動産をローンの担保として使用することを認める公式な許可。金融機関がこの同意を要求します。"}, {"word": "inefficiencies", "definition": "システムやプロセスが非効率であり、時間や資源の無駄が生じている状態。行政の遅延や手続きの複雑さを指します。"}]}, {"title_ja": "米国とイランが核交渉期限を逃す、経済戦争が激化", "title_en": "U.S. and Iran Miss Nuclear Deadline as Economic Conflict Intensifies", "summary_ja": "米国とイランが自主設定した平和協定および核合意に関する交渉の期限を逃した。紛争は軍事的対立ではなく経済的措置へとシフトしている。米国の新たな戦略は過去の国際紛争で採用された手法に類似している。", "summary_en": "The United States and Iran have failed to meet their self-imposed deadline for negotiating a peace agreement and nuclear terms. The conflict is increasingly shifting toward economic measures rather than military confrontation. The new U.S. approach echoes strategies employed in previous international disputes.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/16/world/middleeast/iran-war-us-trump.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ政権のアメリカ大陸での別の支配手段：ビザ", "title_en": "Trump's Other Hold on the Americas: The Visa", "summary_ja": "トランプ政権は米国ビザ政策をツールとして、西半球におけるアメリカの支配力を再確認しようとしている。ビザアクセスを管理することで、より広い拡張戦略の一環として米国はアメリカ大陸への影響力を拡大しようとしている。", "summary_en": "The Trump administration is using U.S. visa policy as a tool to reassert American dominance in the Western Hemisphere. By controlling visa access, the administration seeks to extend its influence over the Americas as part of a broader expansionist strategy.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/16/world/americas/trump-americas-visas.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シチリアからアントネッロ・ダ・メッシーナの絵画4点が盗難", "title_en": "Four Antonello da Messina Paintings Stolen in Sicily Art Heist", "summary_ja": "ルネサンスの巨匠アントネッロ・ダ・メッシーナの絵画4点がシチリアのメッシーナ市で宗教的祝典が行われている最中に盗まれた。盗難はメッシーナが祭りに集中している間に発生し、盗難犯にとって好機となった。盗まれた作品はこの地域にとって重大な文化的および芸術的損失を意味している。", "summary_en": "Four paintings by Renaissance master Antonello da Messina were stolen from Sicily during a religious celebration in the city of Messina. The theft occurred while the Sicilian city was focused on festivities, making it an opportune moment for the heist. The stolen works represent significant cultural and artistic losses for the region.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/16/world/europe/italy-renaissance-art-heist.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが軍事回廊を開放、パレスチナ人がガザ北部への帰還を開始", "title_en": "Palestinians Return to Northern Gaza as Israel Opens Military Corridor", "summary_ja": "イスラエルは人質解放交渉の膠着状態が打開された後、ガザを二分する軍事地帯を通過するパレスチナ難民の往来を許可した。この回廊の開放は、長期間の交渉停滞後の大きな転換を意味している。現在、数千人のガザ住民が徒歩で北部地域の自宅への帰還を進めている。", "summary_en": "Israel has allowed displaced Palestinians to begin crossing back through a military zone that divides Gaza following a breakthrough in hostage release negotiations. The opening of this corridor marks a significant shift after a prolonged deadlock in talks. Thousands of Gazans are now moving on foot to return to their homes in the northern region.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額赤字を報告、業界危機の深刻化を示唆", "title_en": "China's Top Property Developer Reports Massive Loss Amid Real Estate Crisis", "summary_ja": "中国の大手不動産開発企業である万科が巨額の赤字を報告し、中国の不動産危機が深刻化していることへの懸念が高まっている。同社の経営危機により、中国政府が不安定な不動産セクターを安定させるために介入するかどうかについての疑問が生じている。", "summary_en": "Leading Chinese property developer Vanke has reported a significant loss, raising concerns about the deepening real estate crisis in China. The financial troubles at the major developer have sparked questions about whether the Chinese government will intervene to stabilize the troubled sector.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃の破片が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel From Oct. 7 Attack", "summary_ja": "イスラエルの医療当局者によると、最近解放された人質の一部は、10月7日の攻撃による破片が体内に埋め込まれたままであると報告している。何人かの女性は長期間隔離された状態で拘束され、8ヶ月間トンネルに閉じ込められていた。この調査結果は、捕虜となった者たちが経験した深刻な身体的トラウマを浮き彫りにしている。", "summary_en": "Israeli medical officials report that some of the recently freed hostages still have shrapnel embedded in their bodies from the October 7 attack. Several women were held in isolation for extended periods and spent eight months confined in tunnels. The findings highlight the severe physical trauma experienced by those held captive.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブームがアメリカの慈善事業を再構成", "title_en": "Silicon Valley's AI Boom Reshapes American Charity", "summary_ja": "AI起業家たちが慈善事業に数千億ドルの寄付を約束し、慈善活動の景観に大きな変化をもたらしています。この記事は、これらの巨額の寄付がどのように配分され、様々な社会部門に影響を与えるかを検証しています。テック主導の慈善活動の波の有効性と方向性については、多くの疑問が残っています。", "summary_en": "AI entrepreneurs are pledging hundreds of billions of dollars to charitable causes, marking a significant shift in philanthropic landscape. The article examines how these massive commitments will be allocated and the potential impact on various social sectors. Questions remain about the effectiveness and direction of this tech-driven charity wave.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾の民主主義が人質に", "title_en": "Taking Taiwan's democracy hostage", "summary_ja": "利己的な台湾の政治家たちが民主的統治を損なわせ、国の統治を著しく困難にしている。台湾の内部的な政治的混乱と制度的麻痺から最も利益を得るのは中国である。", "summary_en": "Self-interested Taiwanese politicians are undermining democratic governance, making the country increasingly difficult to govern effectively. China stands to benefit most from Taiwan's internal political dysfunction and institutional paralysis.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/11/taking-taiwans-democracy-hostage", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "将軍は優れた政治家になるのか？イスラエルの軍から政治への転身を検証する", "title_en": "Do generals make good politicians? Examining Israel's military-to-politics pipeline", "summary_ja": "エコノミスト誌のイスラエル特派員が、軍事的な経歴を持ちながらも政治的成功を達成することが稀なイスラエルの元将軍たちについて調査している。この分析は、軍事指導者が民間政治生活への転換時に直面する課題を探っている。", "summary_en": "The Economist's Israel correspondent investigates why former Israeli generals rarely achieve political success despite their military credentials. The analysis explores the challenges these military leaders face when transitioning to civilian political life.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/10/the-war-room-newsletter-do-generals-make-good-politicians", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タリバン支配下のアフガニスタン女性：恐怖と奪われた夢の5年間", "title_en": "Afghan Women Under Taliban Rule: Five Years of Fear and Lost Dreams", "summary_ja": "タリバンの政権奪還から5年、アフガニスタンの女性たちは厳格なシャリーア法の下での日常的な抑圧に直面している。ル・モンド特派員によるカブールでのインタビューで、女性たちは恐怖、家族からの支配、強制結婚、そして組織的な抱負の消滅について述べている。本報告はタリバン統治下のアフガニスタン女性の見えない生活を検証するシリーズの第一弾である。", "summary_en": "Five years after the Taliban's return to power, Afghan women face daily oppression under strict Sharia law implementation. In interviews with Le Monde's correspondent in Kabul, women describe living in fear, enduring family control, forced marriages, and the systematic erasure of their aspirations. This report is the first in a series examining the invisible lives of Afghan women under Taliban governance.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/summer-reads/article/2026/08/16/we-were-petrified-afghan-women-on-the-tragic-day-the-taliban-came-back_6756566_183.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランの指導部内の分裂が米国との交渉に影響", "title_en": "Iran's Internal Power Struggles Complicate US Negotiations", "summary_ja": "イランの革命防衛隊は軍事作戦以上に広い権限を持ち、大統領と交渉担当者に対して要求を強要している。歴史家ジャン＝ピエール・フィリウ氏によると、イラン政府内のこうした権力の分裂は米国との核交渉に直接的な��悪影響を与えている。文民指導部と軍事指導部の間の権力関係は、生産的な外交交渉の大きな障害となっている。", "summary_en": "Iran's Revolutionary Guards exercise significant control over the country's political leadership and nuclear negotiations with the United States, extending their influence far beyond military matters. According to historian Jean-Pierre Filiu, these internal divisions within Iran's government directly impact the president and negotiating teams. The power dynamics between civilian and military leadership present a major obstacle to productive diplomatic talks.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/16/divisions-within-iran-s-leadership-weigh-on-talks-with-the-us_6756559_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マルセイユ研究機関、2,700件の研究で倫理的懸念が指摘", "title_en": "Marseille Research Institute Under Scrutiny for Ethical Concerns in 2,700 Studies", "summary_ja": "マルセイユの地中海感染大学病院研究所が発表した約2,700件の科学論文の審査で、約850件に倫理的懸念が指摘された。同研究所は物議を醸した研究者ディディエ・ラウルトと以前関係があった。この調査結果は同施設の研究倫理に関する疑問を提起している。", "summary_en": "A review of nearly 2,700 scientific articles from the Mediterranean Infection University Hospital Institute in Marseille found ethical concerns in approximately 850 publications. The institute was previously associated with controversial researcher Didier Raoult. The findings raise questions about research integrity at the facility.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/science/article/2026/08/16/review-finds-ethical-concerns-in-studies-from-marseille-research-institute_6756567_10.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国防省", "title_en": "Mindef", "summary_ja": "要約を生成できません。提供されたテキストは、実質的な記事内容を含まず、海峡時報のニュースレターのヘッダーとナビゲーション情報のみです。", "summary_en": "Unable to generate summary. The provided excerpt contains only header and navigation information from The Straits Times newsletter without substantive article content about the Ministry of Defence topic.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートニュースレターは、読者に最新のニュースと更新情報を提供します。購読者はニュースレターの設定を管理し、ストレーツ・タイムズから追加の無料ニュースレターに登録できます。", "summary_en": "The Straits Times Evening Update newsletter provides readers with the latest news and updates. Subscribers can manage their newsletter preferences and sign up for additional free newsletters from The Straits Times.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズが毎日のモーニングブリーフィングニュースレターを配信しています。読者は提供されたリンクから無料ニュースレターを購読し、購読を管理できます。", "summary_en": "The Straits Times presents its daily morning briefing newsletter. Readers can subscribe to receive free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相、新たなキャンペーンでマムダーニをイスラエルの敵と同列視", "title_en": "Netanyahu Equates Mamdani with Israel's Wartime Enemies in Campaign", "summary_ja": "ネタニヤフ首相は、批評家マムダーニをイスラエルの戦時中の敵と比較するキャンペーンを展開した。この動きは政府方針への批判をめぐるイスラエル国内の政治的緊張の高まりを反映している。ネタニヤフのキャンペーン戦略は、進行中の紛争中に野党勢力の正当性を損なおうとするものである。", "summary_en": "Prime Minister Netanyahu has launched a campaign comparing critic Mamdani to Israel's wartime adversaries. The move reflects escalating political tensions within Israel over criticism of government policies. Netanyahu's campaign strategy aims to delegitimize opposition voices during the ongoing conflict.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinAJBVV95cUxPN0RCTUtEbm9nNmMxVmZNZ3NZTm5TRzhSQnJqXzIydjhpMDJ5WG5FTkJFcVc2UUQ1OUNaeUdiZ0ZUcW1VeWE2SktZSkRLRVJHQ0dCa0k2dkJtZFdDanNleEMyVzhPX1VfZXJaamZYSGF6NUNCM2tsdlZwejdzWXRhNWFjTWVPa1NFSHNLVGZoeFFyQnBqeUdod094WFo1alRyZFJoMFBXM3ZtN0pPT2lSa3R1SVVUM2hHSDJSZlRPS1dMeV9IWFF6NFdZRUFEanloRTRPTk9TTUdheFdXQXhYSDdOZEJodVA2RWNuNHpuSG1VbW5YVDlPNEp6OW5kMWMtT3JET01MdFdfWnlfbFZ6NjF5MmlvNjJET2FkaQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル人が見つけた新しい悪役：ゾーラン・マムダニ", "title_en": "Israelis Found a New Villain: Zohran Mamdani", "summary_ja": "米国の政治家ゾーラン・マムダニがイスラエル国内で批判の対象となり、ハマスやヒズボラといった従来の敵と同列視されている。マムダニをめぐる論争は、イスラエル・パレスチナ問題に関する政治的立場をめぐるより広範な緊張を反映している。ハアレツの記事は、マムダニの発言と立場がいかにしてイスラエルの言論において分裂的な人物となったかを検証している。", "summary_en": "Zohran Mamdani, a U.S. politician, has become a focal point of criticism among Israelis, joining the ranks of traditional adversaries like Hamas and Hezbollah. The controversy surrounding Mamdani reflects broader tensions over political positions on Israeli-Palestinian issues. The Haaretz article examines how Mamdani's statements and positions have made him a polarizing figure in Israeli discourse.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxOeGJ0aWJUbHI5bVpnMk04MVRwcTN5ckEtZ1BiMU5QcE50dnp4aTl0QV9zTGhsZkcxRERJTUxRSmRMTWVIRXpQX2piRmpxcVRyZ3YwbjZEbnM5NkU2SDF2d0pNV09taE5PZ1VsRkxNUlFpUmloSkw5Mk5zak9rOGo3eml4LWxjbjEtOGRvRWhoT29Bd0xhMlpUSnVld2RqMHl6cTBrbTFRVUV2bkxwc0p1V2lJQ0VjRFViemxINDMxWjhINEEwcVRneVo4dmhOLUdTVTVjRmNTS25TcmtBWXJaalJlaDRqbzRuQ2lwdnloSVRrT1VPenBQc1A5aDZQMGt5bktrQTB5QjUzZDg?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル警察、神殿の丘でのユダヤ教礼拝制限を緩和", "title_en": "Israel Police Ease Prayer Restrictions at Temple Mount", "summary_ja": "イスラエル警察は、イスラム教徒からはアル・アクサとも呼ばれる神殿の丘でのユダヤ教礼拝に関する制限を緩和した。この政策変更は、係争中の聖地への宗教的アクセスを管理する方法における当局の姿勢の転換を示している。", "summary_en": "Israeli police have relaxed restrictions on Jewish prayer at the Temple Mount, also known as Al-Aqsa to Muslims. The policy change represents a shift in how authorities manage religious access to the disputed holy site.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMinAJBVV95cUxPZS1MQ2poZWlsZ2pyZEVFU1BpWFltOEpHNHhkNVFXUldubE5CNHJFZFFHR2oyTU9WUVdCUEVnZEtxSEdqSWNwb1dndVhFLUhHQmZsT0tXUnlQbWtxTlhfUUhjZTF6MDU3WWhSMEZac2RmX19wLWhSQXVWeXNDWWdnZmVxeEpHU3JxT3ZjWF96dzJncmZkZEtfX1VrRmVELXRXN0paUHpYcnlwSVVvZnVIT0g2SExQdUJ2Q1ZUZlVLbEh3SndDdGJXcFA2TGx3X0daQzR2ZTVXR3hVeHZJem1ra3lTdlR4NWVISkRDa0lmTlFPYWdSVFZmNzBodTVpTXNJeUk1TkEwbnNlSHhvUzFvSVZtcy05eXJMckM1cg?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾新幹線、2027年に運賃見直しを実施へ", "title_en": "Taiwan High Speed Rail to Review Fares in 2027", "summary_ja": "台湾高速鉄道は2027年に乗車券の運賃を包括的に見直す計画を発表した。この見直しは現在の料金体系を評価し、サービス品質と財務の持続可能性を維持するための調整が必要かどうかを判断することを目的としている。", "summary_en": "Taiwan High Speed Rail Corporation announced plans to conduct a comprehensive review of its ticket fares in 2027. The review aims to assess current pricing structures and determine whether adjustments are necessary to maintain service quality and financial sustainability.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE5rMmZ0OEozTE9lVXdteHB1RmJHSEd0SkxDdXZfYWxLenhLZ3FBSGlfTEJXWDZpT3E4TmlZYlphVmZsUURITnNYVF9GaFpXVUtTTTFNb05B?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、医療能力削減とインターネット遅延を含む民間防衛訓練を完了", "title_en": "Taiwan Concludes Civil Resilience Drills with Medical and Internet Disruptions", "summary_ja": "台湾は医療能力の低下とインターネット速度低下をシミュレートした民間防衛訓練を完了した。この訓練は、インフラ障害時に重要なサービスと公共の安全を維持する能力を評価した。この演習は、台湾の民間防衛能力強化に向けた広範な取り組みの一部を示している。", "summary_en": "Taiwan has completed civil resilience exercises that simulated reduced medical capacity and internet slowdowns to test emergency preparedness. The drills assessed the nation's ability to maintain critical services and public safety during infrastructure disruptions. The exercises represent part of Taiwan's broader efforts to strengthen civilian defense capabilities.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFAwSEN0d1BEdjV1Sng0N1g4bDk0Q3ZyTjlPUWh2c09FZW1tM1diaENvNUxLc1Y0bmlfOEpVMWRQZEZlSTJXejlYQzg0YWl6NWtKYl9rWEZpbw?oc=5", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、中国が発表した共同海軍演習についてインドネシアに説明を要求", "title_en": "Taiwan Seeks Indonesia Clarification Over China's Announced Joint Naval Exercise", "summary_ja": "台湾は、インドネシア領海を含む共同海軍演習を中国が発表したことについて、インドネシアに説明を求めている。この発表は東南アジア地域の軍事活動と海上安全保障への潜在的な影響について懸念を raise している。台湾は、報告された軍事演習に対するインドネシアの立場と関与を理解しようとしている。", "summary_en": "Taiwan has requested clarification from Indonesia regarding a joint naval exercise announced by China involving Indonesian waters. The announcement raises concerns about regional military activities and potential impacts on maritime security in Southeast Asia. Taiwan is seeking to understand Indonesia's position and involvement in the reported military drills.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE80WXVLWnBHWWlJUTdUZi1YbzVwX0UxaFhIWmlUUVhhWm85Q0oxN1hweVJKcFVzdGNjMUwtSXUzRmt4ZE0wdXVmOGRUaTBrVnBBbXZxUFpsdw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "靖国神社参拝に日本と韓国で反発の声", "title_en": "Yasukuni Shrine visits spark opposition in Japan, South Korea", "summary_ja": "CGTNによると、日本の平和活動家と韓国の議員らは、日本の敗戦81周年を迎えた土曜日に、日本の政治家による靖国神社への参拝と献金に強い反発と遺憾の意を表明した。同神社は日本の軍国主義と戦時中の侵略の象徴と見なされている。今回の参拝は、歴史的懸案事項をめぐる日韓間の緊張を再び高めることになった。", "summary_en": "CGTN reports that Japanese peace advocates and South Korean lawmakers expressed strong opposition to monetary offerings and visits by Japanese politicians to Yasukuni Shrine on the 81st anniversary of Japan's unconditional surrender in World War II. The shrine is viewed as a symbol of Japanese militarism and wartime aggression. The visits have renewed tensions between Japan and South Korea over historical grievances.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-15/Yasukuni-Shrine-visits-spark-opposition-in-Japan-South-Korea-1PCXrMqw956/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカの新興スーパーエルニーニョ脅威の理解", "title_en": "Understanding the Emerging Super El Niño Threat in Africa", "summary_ja": "CGTNは、エルニーニョが中央および東部熱帯太平洋の海面水温が異常に温暖化する際に発生すると報じています。この温暖化は大気循環を変化させ、数千キロ離れた地域の天気パターンを乱す可能性があります。", "summary_en": "CGTN reports that El Niño occurs when sea surface temperatures in the central and eastern tropical Pacific Ocean become unusually warm. The warming can alter atmospheric circulation and disrupt weather patterns thousands of kilometers away, with potential impacts on African regions.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-12/Understanding-the-emerging-super-El-nino-threat-in-Africa-1Py9Mr9UqM8/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "地震後、救助隊とボランティアが生存者の捜索に全力で当たる", "title_en": "Rescue teams and volunteers race to find survivors after earthquake", "summary_ja": "CGTNは、地震後に救助隊とボランティアが生存者の捜索に緊急で取り組んでいると報じています。この報道は、被災地での捜索救助活動の進行状況に焦点を当てています。利用可能な抜粋には、地震の震源地、マグニチュード、および死傷者数に関する詳細は記載されていません。", "summary_en": "CGTN reports that rescue teams and volunteers are working urgently to locate survivors following an earthquake. The report focuses on ongoing search and rescue operations in the affected areas. Details about the earthquake's location, magnitude, and casualty figures were not specified in the available excerpt.", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-08-14/Rescue-teams-and-volunteers-race-to-find-survivors-after-earthquake-1PAHA0DF1yo/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ハマス、仲介者にイスラエルの停戦順守を強制するよう要請", "title_en": "Hamas calls on mediators to enforce Israel ceasefire compliance", "summary_ja": "TASS/RTによると、ハマスは国際仲介者と平和委員会に対し、イスラエルに停戦協定を遵守させるよう要請した。同組織は提案されたロードマップを受け入れると述べたが、計画の具体的な詳細は明かさなかった。", "summary_en": "TASS/RT reports that Hamas has called on international mediators and a Board of Peace to compel Israel to observe a ceasefire agreement. The organization stated it accepts a proposed roadmap but did not disclose specific details of the plan.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2173929", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン軍司令官が米軍兵士への報奨金提供を報告", "title_en": "Iranian Army Commander Reports Reward Offer for US Troops", "summary_ja": "TASS/RTによると、イラン軍のアミル・ハタミ司令官は、イランが米軍兵士の殺害または捕虜化に対する報奨金を提供していると述べたと報じられています。報道では、ハタミ司令官がこのような行為に参加する女性は報奨金の2倍を受け取ると述べたことが伝えられています。", "summary_en": "TASS/RT reports that Iranian Army Commander Amir Hatami stated that Iran is offering rewards for killing or capturing US troops. According to the report, Hatami indicated that women who participate in such actions would receive double the reward amount.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2173925", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ロシア選手団が2026年欧州水泳選手権で金メダルを獲得", "title_en": "Russian swimmers win gold at 2026 European Aquatics Championships", "summary_ja": "TASSの報道によると、ロシアの水泳選手クリメント・コレスニコフ、イワン・コジャキン、アンドレイ・ミナコフ、エゴール・コルネフが2026年欧州水泳選手権で金メダルを獲得した。国営メディアの報道では、チームは3分28秒67で距離を完走したという。", "summary_en": "TASS reports that Russian swimmers Kliment Kolesnikov, Ivan Kozhakin, Andrey Minakov, and Egor Kornev won gold at the 2026 European Aquatics Championships. According to the state-controlled source, the team completed the distance in 3 minutes and 28.67 seconds.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/sports/2173923", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アジアの過小評価された通貨にどう対処すべきか", "title_en": "What Should Be Done About Asia's Undervalued Currencies?", "summary_ja": "著者は、人民元、円、ウォンなどのアジア通貨が過小評価されているという懸念は大きな貿易黒字によって正当化されることが多いが、基礎的な経済ファンダメンタルズに対処しない限り、協調的な外国為替介入は効果がないと主張しています。通貨操作を解決策として重視するのではなく、政策立案者はこれらの貿易不均衡を引き起こしている構造的問題に取り組むべきだと述べています。", "summary_en": "The author argues that while concerns about undervalued Asian currencies like the renminbi, yen, and won are often justified by large trade surpluses, coordinated foreign-exchange intervention would be ineffective without addressing the underlying economic fundamentals. Rather than focusing on currency manipulation as a solution, policymakers should tackle the structural imbalances driving these trade disparities.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/foreign-exchange-interventions-to-strengthen-renminbi-yen-and-won-will-not-solve-global-imbalances-by-jeffrey-frankel-2026-08", "state_media": false, "category": "オピニオン", "full_text": "What Should Be Done About Asia’s Undervalued Currencies?\nThose who worry that the renminbi, yen, and won are undervalued vis-à-vis the dollar are usually focused on the large trade and current-account surpluses that China, Japan, and Korea run with the US. But coordinated intervention in currency markets will not address the fundamentals underlying these imbalances.\nCAMBRIDGE—Major Asian currencies’ exchange rates are again at the center of debates in international monetary economics. With China, Japan, and South Korea all running trade and current-account surpluses, and the United States running corresponding deficits, some argue that the renminbi, yen, and won are undervalued. But given the fundamentals underlying these imbalances, foreign-exchange intervention is unlikely to do much good.", "translation_ja": "", "vocab": [{"word": "undervalued", "definition": "本来の価値より低く評価されている状態を示します。為替相場が適切な価値より低い場合に使用される経済用語です。"}, {"word": "current-account surplus", "definition": "経常収支黒字のことで、商品やサービスの輸出が輸入を上回る状態を指す国際経済用語です。"}, {"word": "foreign-exchange intervention", "definition": "中央銀行が為替相場に影響を与えるため、外国為替市場に直接介入することを意味します。"}, {"word": "fundamentals", "definition": "基礎的な経済要因や構造的な基盤を指し、政策や相場変動の根本的な原因となる要素です。"}, {"word": "imbalances", "definition": "不均衡や不釣り合いを意味し、国際収支や貿易における収支の差を指す経済用語です。"}]}, {"title_ja": "企業はいかにしてAIによる失業危機を緩和できるか", "title_en": "How Corporations Can Mitigate an AI Jobocalypse", "summary_ja": "著者は、AI関連の雇用喪失が発生する可能性があるが、企業と政府は政策と企業責任を通じてその影響を最小化するために協力すべきだと主張している。小規模企業よりも速くAIを導入している大企業は、潜在的な労働力の混乱に対処する際に長期的な社会的利益を考慮すべきである。", "summary_en": "The author argues that while AI-related job displacement may occur, corporations and governments must work together to minimize its impact through proactive policies and corporate responsibility. Large employers, who are adopting AI faster than smaller firms, should consider their long-term social interests in addressing potential workforce disruption.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/corporations-can-mitigate-ai-jobs-apocalypse-by-raghuram-g-rajan-2026-08", "state_media": false, "category": "オピニオン", "full_text": "How Corporations Can Mitigate an AI Jobocalypse\nEven if AI-related job displacement is less severe than many feared, corporations will need to be enlisted in minimizing its effects in the name of social solidarity. To that end, governments should consider what policy incentives are in place, and large employers should consider their own long-term interests.\nCHICAGO—AI-related job displacement is coming, though no one knows how fast it will proceed, how far it will go, and which sectors it will affect most. Much depends on the pace at which individual firms apply the technology to their operations. A recent US Census Bureau Business Trends and Outlook Survey indicates that only 20% of firms with fewer than 20 employees currently use AI, compared to 37% of businesses with at least 250 employees. While larger firms are doing more with the technology, 37% is still quite meager considering the survey’s low threshold for answering in the affirmative (whether AI is used “in any business function”).", "translation_ja": "", "vocab": [{"word": "displacement", "definition": "ある者が別の者によって置き換えられること、または仕事や住居から追い出されることを意味する。特に労働市場の文脈では、労働者が技術やビジネス上の理由により職を失うことを指す。"}, {"word": "mitigate", "definition": "何かの悪い影響や厳しさを減らすまたは軽くすることを意味する。問題をより対処しやすいレベルに緩和することを表す。"}, {"word": "enlist", "definition": "誰かを援助や支援のために参加させることを意味する。協力を求めて特定の目的に人を関与させることを指す。"}, {"word": "meager", "definition": "量や程度が不十分であること、または十分ではないことを意味する。期待以下の限定的な規模や量を表す。"}, {"word": "affirmative", "definition": "肯定的であること、または同意や承認を表すことを意味する。アンケートや調査では「はい」という肯定的な回答を指す。"}, {"word": "threshold", "definition": "ある状態や条件が変わる境界線または最小水準を意味する。その値に達することで何かが起動または変化を始める限界点を表す。"}]}, {"title_ja": "中国全体主義の形成と再構築", "title_en": "The Making and Remaking of Chinese Totalitarianism", "summary_ja": "西側諸国は経済成長が中国の政治体制を自由化させると期待してきたが、中国の全体主義的制度は改革の数十年を経ても弾力性を保ち続けている。習近平指導下で、これらの権威主義的構造は強く再び台頭している。この論文は、韓国と台湾で起きたように発展が自動的に民主化につながるという西側の仮定に対して、中国の弾力性が異議を唱えていると主張している。", "summary_en": "Western expectations that China's economic growth would liberalize its political system have proven wrong, as the country's totalitarian institutions have remained resilient despite decades of reform. Under Xi Jinping's leadership, these authoritarian structures have reasserted themselves strongly. The article argues that China's resilience challenges the Western assumption that development automatically leads to democratic opening, as occurred in South Korea and Taiwan.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/onpoint/institutional-genes-explain-how-china-totalitarian-institutions-survived-reform-era-by-chenggang-xu-2026-08", "state_media": false, "category": "オピニオン", "full_text": "OnPoint Subscriber Exclusive\nLonger Reads provide in-depth analysis of the ideas and forces shaping politics, economics, international affairs, and more.\nThe Making and Remaking of Chinese Totalitarianism\nFor decades, the West assumed that economic growth would turn China into a more open, liberal society, much as it did South Korea and Taiwan. Instead, China’s totalitarian institutions proved remarkably resilient, surviving decades of reform and reasserting themselves under President Xi Jinping.\nSTANFORD—The Thucydides Trap has become a popular lens for understanding US-China relations. Its logic is simple: when a rising power challenges an established one, fear and mistrust grow, making conflict increasingly difficult to avoid. Over the past decade, Chinese President Xi Jinping has repeatedly invoked this distinctly American concept to frame his country’s rivalry with the United States.", "translation_ja": "", "vocab": [{"word": "totalitarian", "definition": "政治権力が個人の自由をすべて支配する独裁的な政治体制。市民の生活のあらゆる側面を統制しようとする政府を指す。"}, {"word": "resilient", "definition": "困難や変化に直面しても回復力を持ち、強い状態を保つ能力。圧力にも関わらず形態を保つ、または素早く回復する特性。"}, {"word": "liberalize", "definition": "政治的・経済的な規制を緩和し、より開放的で自由な体制へ転換させることを意味する。民主化や規制緩和の文脈で使用される。"}, {"word": "reassert", "definition": "以前の力や影響力を再び強く主張または発揮すること。一度弱まったものが再び強くなることを表す。"}, {"word": "Thucydides Trap", "definition": "新興勢力が既存の大国に挑戦する際に、恐怖と不信が増し紛争が避けられなくなる国際関係の概念。米中関係の分析に用いられる用語。"}]}, {"title_ja": "ルビオ国務長官は平和のための力を持ちながら帝国的支配を選択している", "title_en": "Rubio Has Power for Peace but Chooses Imperial Dominance Instead", "summary_ja": "シモン・ティズドール氏は、国務長官マルコ・ルビオが世界的な危機解決に前例のない機会を持ちながら、本物の外交ではなく属国としての従属を要求する新帝国主義的アプローチを追求していると主張している。ティズドール氏はルビオの経歴が、信念のない政治的日和見主義者であり、原則的な平和構築ではなくトランプの気まぐれな外交政策を単に実行していることを明かしていると指摘している。", "summary_en": "Simon Tisdall argues that Secretary of State Marco Rubio, despite having unprecedented opportunity to resolve global crises like the Ukraine and Iran conflicts, instead pursues a neo-imperialist approach that demands client-state compliance rather than genuine diplomacy. Tisdall contends Rubio's record reveals a political opportunist without firm principles who simply executes Trump's erratic foreign policy rather than advocating for principled peacemaking.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/16/marco-rubio-power-peace-world-us-diplomat", "state_media": false, "category": "オピニオン", "full_text": "Viewed from the state department in Washington DC, the world is on fire – but record heatwaves are not to blame. The unresolved Iran war has badly burned Donald Trump. His military campaign conclusively failed, energy and food prices are still rising, and a Republican rout in November’s midterm elections looms. Humiliatingly, Israel this week flatly rejected his latest Gaza peace proposals, days after Trump congratulated himself on a “historic breakthrough”. In Europe, Russia’s attacks on Nato allies grow increasingly brazen, threatening a wider escalation. The Ukraine war, which Trump vowed to end, is now well into its fifth year, with civilians on both sides caught in the killing fields. And these are just the bigger firestorms. There are plenty more.\nRarely has the need for effective, professional diplomacy been more pressing. So step forward Marco Rubio, US secretary of state and chief American diplomat. These are challenges that, if successfully tackled, could propel the 55-year-old son of Cuban immigrants and the former US senator for Florida into pole position in the 2028 Republican presidential nomination race. Here is a chance for Rubio to defy critics who dismiss him as a lickspittle and Trump dogsbody, and transform himself into respected global statesman. His boss mocked him as “little Marco” and a “loser” when they were election rivals in 2016. (Rubio called him a conman.) Now is Rubio’s opportunity to go big, be brave and prove he’s a winner.\nOr maybe not.\nRubio is unlike recent US secretaries of state – heavyweights such as Hillary Clinton and Antony Blinken, or John Kerry, famed for his high-energy shuttle diplomacy. Rubio has little time for “peace processes”. Instead, he projects brute US power to impose take-it-or-leave-it “solutions” that advance US interests, as defined by Trump. It’s a modern form of imperialism. Target countries have a choice: become client states, like Venezuela and, prospectively, Cuba and Greenland, or be crushed. In Iran, the policy is not regime change, let alone democratic renewal. It’s regime compliance. Rubio behaves less like a peace-broker, more like a pith-helmeted colonial viceroy demanding fealty from obsequious satraps.\nSpeaking in Munich in February, Rubio aired his hawkishly retro doctrine of US primacy. He lamented the decline of “the great western empires … accelerated by godless communist revolutions and anti-colonial uprisings” and warned Europe faced “civilisational erasure”. The US didn’t want milksop allies “shackled by guilt and shame” about their imperial past, he said. “We want allies who are proud of their culture and heritage … and who, together with us, are willing and able to defend it.” Here was a familiar assertion of US hegemony, but one stripped of bogus altruism and pretence. It sounded a death knell for diplomacy. Trump has attacked eight countries in the past year. Cuba, Rubio’s obsession, could be next.\nRubio’s reluctance to get personally involved in peacemaking may be partly explained by his other, contradictory role, as Trump’s national security adviser. He has accepted the White House’s outsourcing of negotiations over Ukraine and Palestine to amateur envoys of limited ability – namely Trump’s son-in-law, Jared Kushner, and business crony Steve Witkoff. Broadly speaking, Rubio has steered clear of direct involvement in the Iran talks, too, leaving JD Vance, the vice-president and his main potential rival in 2028, to take the flak. Rubio’s arm’s length approach smacks of calculation. Or maybe he’s just out of his depth. Maybe he has no clear idea what he, Marco, really thinks about any of these issues and simply does Trump’s erratic bidding.\nThis perception of a political chameleon lacking firm principles, consistent opinions and a strong moral compass is reinforced by his record. His biographer, Manuel Roig-Franzia, believes Rubio’s personal and political slipperiness – he once became a Mormon, then reverted to Catholicism – is rooted in a childhood need to belong, to be on the winning side, no matter the price. Senator Rubio was a China hawk. Now he toes Trump’s ingratiating line on Beijing. He used to castigate Russia; now he’s an appeaser. He championed overseas assistance but, in office, has gutted USAID and seeks to dismantle the international criminal court, a keystone of global order. He blasted Barack Obama’s Iran nuclear deal. Now he backs an accord that would offer additional concessions to Tehran. Accused by the Vatican of waging an immoral, unjust war, he travelled to Rome and set the pope straight.\nThe irony, or tragedy, of the Rubio conundrum is he has the power to do great good, if only he would stand up and be counted. Russia’s Vladimir Putin, losing on the battlefield and at home, is weaker than at any time since 2022. Ukraine’s Volodymyr Zelenskyy is short of missile interceptors, soldiers and political support. A ceasefire deal freezing the conflict is there for the making by the only country – the US – that", "translation_ja": "", "vocab": [{"word": "imperialism", "definition": "帝国主義。強大な国が他国を支配し、自国の利益を優先させる政治体制や政策。現代では経済的・政治的支配を指すことが多い。"}, {"word": "hegemony", "definition": "覇権。特定の国や勢力が国際関係において優位性を持ち、他国に影響力を行使する状態。"}, {"word": "satraps", "definition": "属国の統治者や従属的な支配者。古代帝国の配下領土の行政官を指す用語で、ここでは従属国の指導者を揶揄する意味で使用されている。"}, {"word": "lickspittle", "definition": "へつらう人、取り巻き。権力者に過度に従い、阿諛追従する人物を指す侮蔑的な表現。"}, {"word": "obsequious", "definition": "卑屈な、へりくだった。過度に他者に従うことで好意を得ようとする様子。"}, {"word": "chameleon", "definition": "日和見主義者、状況に応じて態度を変える人。原義のカメレオン（トカゲの一種）が環境に合わせて色を変えることから転じて使われる。"}]}, {"title_ja": "「ウォーク1.0」には問題があったが、今は更に深刻な危機を抱えている", "title_en": "Woke 1.0 Had Issues, But We Face Bigger Crises Now", "summary_ja": "著者アルワ・マハダウィは、進歩派政治家による「ウォーク1.0」（2018～2021年の社会正義運動）の否定が保守派の思惑に乗じており、大統領の汚職、中絶制限、移民法執行などの緊迫した現代的課題を軽視していると主張している。その時代の一部の過剰さは恥ずかしいことを認める一方で、過去の進歩派の失敗に焦点を当てることは民主主義と人権への深刻な脅威から目を逸らすものだと述べている。", "summary_en": "Author Arwa Mahdawi argues that progressive politicians' dismissal of 'Woke 1.0' (2018-2021 social justice period) plays into conservative hands while ignoring urgent contemporary issues like presidential corruption, abortion restrictions, and immigration enforcement. While acknowledging some excesses from that era were embarrassing, Mahdawi contends that focusing on past progressive missteps distracts from severe current threats to democracy and human rights.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/15/woke-1-aoc-progressives", "state_media": false, "category": "オピニオン", "full_text": "There is probably no word that has been more used and abused in the last decade than “woke”. It has been rendered completely meaningless, but it refuses to die. Indeed, it has now taken on new life: in the past week, there’s been a flurry of headlines about “Woke 1.0” or “Woke One”. If you haven’t seen the phrase pop up in your newsfeed yet, it will soon.\nSo what is this cursed phrase? There’s no official definition, but the term is largely being used to refer to the period between 2018 and 2021 when social justice language was at its peak in mainstream culture. Certain progressives, including Alexandria Ocasio-Cortez, have started to use “Woke 1” disparagingly, as a way to distance themselves from that period and signal that they stand for a new form of left-leaning politics that is more palatable to centrist Democrats. “Woke 2”, I suppose.\nWe can blame the New York City councilmember Chi Ossé for coining the phrase. Back in May, he wrote on X: “Woke 1 was crazyyyy.” This was in response to someone reminding him that, in 2021, he’d said: “A cis white man should not be the next speaker of the Council.”\nNot that many people paid attention to the May post. But then Alexandria Ocasio-Cortez quoted it on a recent appearance on ABC News’s This Week when she was asked about some statements the Wisconsin gubernatorial candidate Francesca Hong had made. In 2020, Hong, who lost this week’s gubernatorial primary, tweeted that Thanksgiving should be cancelled. She also posted about defunding the police. AOC responded to a question about these “controversial” tweets by saying Hong had moved away from these positions.\nThe congresswoman then noted: “I have a local city councilman that has this saying: ‘Woke 1.0 was crazy.’” After laughing at the phrase, Ocasio-Cortez went on to add: “During the pandemic, the doors were really open in trying to entertain any and every policy that was going to get us to a better place. And I actually think that the discussions that were had in that time were quite fruitful … I think that, you know, during lockdown, of course, rhetoric in that time is not rhetoric that we would use today.”\nWhen you look at AOC’s full quote about Woke 1.0, it’s pretty reasonable. However, it has been ripped out of context and is being willfully misinterpreted by some people to suggest that Ocasio-Cortez thinks the excesses of that period were funny.\nStephen Miller, for example, almost exploded on air after Fox News’s Will Cain played a clip of AOC talking about Woke 1 to him on air. Miller ranted for almost five minutes about how woke policies resulted in a “historic increase in murders”. (Gun violence surged in the US during Covid, but that wasn’t because of protests or because some people wanted you to say “folx” instead of “guys”. It was for myriad reasons that we are still trying to understand but include school closures in low-income areas.)\nMiller added: “We’re all going to have a good laugh about that? ‘Sorry your husband was murdered.’ ‘Sorry your mom was killed.’ ‘Sorry your loved ones are six feet under the ground now.’ We’re going to have a good laugh about that? It’s sickening, it’s disgusting and the thing is, [Woke 1.0] never stopped.”\nThe Atlantic, meanwhile, published a piece headlined “The Democrats Can’t Just Laugh Off ‘Woke 1’”, which argued: “Republicans have no incentive to let them forget past excesses.”\nMaybe not, but progressives also shouldn’t play into their hands by talking about Woke 1.0 instead of focusing on the dire state of the country right now. This isn’t to say we can’t learn from past mistakes. I think we can all agree that there were some embarrassing excesses between 2018-2020. There was the time, for example, when a Mexican American San Diego Gas and Electric employee got fired because someone thought he was doing the White Power symbol with his hand. All he was doing was hanging his arm out of his truck and cracking his knuckle. There was no evidence to prove he held white supremacist views, there was just a baying mob on Twitter.\nWas that incident bad? Yes, of course! Was some of the earnest discourse from the time cringe? Absolutely! But just take a minute and look around, why don’t you? The president of the US is monetizing his position in an unprecedented way. Pregnant women are dying preventable deaths because they can’t get access to safe abortions, and immigrants are being snatched off the street by masked thugs. Freedom of speech is under attack, and you can get deported for talking about the ongoing genocide in Gaza. Getting upset right now about Woke 1 is crazyyyy.\nICE is locking people up for things their grandmother did\nDo take the time to read this shocking piece in the Nation by Maryam Tahmasebi, who is currently in ICE detention with her family because her mother-in-law was a translator for the Iranian hostage takers back in 1979. Tahmasebi and her husband are both professors and legal residents without so much as a traffic ticket on their records. They’", "translation_ja": "", "vocab": [{"word": "rendered", "definition": "～を(～の状態に)する、～を無意味にするという意味。ここでは「『ウォーク』という言葉が完全に無意味にされてしまった」という文脈で使用されている。"}, {"word": "disparagingly", "definition": "軽蔑的に、見下すように扱う態度で。否定的な文脈で言及すること。"}, {"word": "palatable", "definition": "受け入れやすい、好ましい、歓迎される（考え方や方針が）。より広い支持を得られるという意味。"}, {"word": "ripped out of context", "definition": "文脈から抜き出される、本来の意味や背景を無視して引用されることを指す表現。"}, {"word": "willfully", "definition": "意図的に、故意に、知りながら。ここでは誤解を招くよう意図的に解釈することを意味する。"}, {"word": "excesses", "definition": "過度、過剰、行き過ぎ。その時期の社会正義運動における極端な事例や行動を指す。"}, {"word": "unprecedented", "definition": "前例のない、かつてない。大統領の行為がこれまでにない規模であることを強調している。"}]}, {"title_ja": "AOC「ウォーク1.0」批評：正しい目標、間違った方法", "title_en": "AOC's Critique of 'Woke 1.0': Right Goals, Wrong Methods", "summary_ja": "フランシーン・プローズはアレクサンドリア・オカシオ・コルテスのCOVID期間中の進歩的活動批評に同意しているが、「ウォーク」という言葉の使用に疑問を呈している。医療や経済的平等などの進歩的理想を支持しつつ、言葉の厳格な監視、キャンセル文化、非現実的な政策が左翼の信頼性を弱め、保守派が正当な進歩的目標を却下しやすくしたと論じている。", "summary_en": "Francine Prose agrees with Alexandria Ocasio-Cortez's criticism that progressive activism during COVID became overly rigid and counterproductive, though she questions using the term \"woke.\" While supporting progressive ideals like healthcare and economic equity, Prose argues that excessive language policing, cancel culture, and impractical policies have weakened the left's credibility and made it easy for conservatives to dismiss legitimate progressive goals.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/15/aoc-woke-1", "state_media": false, "category": "オピニオン", "full_text": "Full confession: I am one of those who have come to think that Alexandria Ocasio-Cortez can essentially do no wrong. At times when I most fear for the future of our country, I watch her videos and am consoled and cheered by her clarity, her honesty, her intelligence, her simple common sense. So I was a little surprised to hear that on a recent interview on ABC This Week, she quoted a political ally as having remarked: “Woke 1.0 was crazy.”\nWhat surprised me was not that she called for some moderation of the radical positions – the call to defund the police and the military, for example – that have, at times, been an aspect of progressive politics. But I was frankly a little unnerved to hear her use the word “woke”.\nThe term has its roots in Black slang. “Stay woke” was originally a warning to keep alert to the dangers posed by prejudice and white supremacy. But its meaning has changed to become a synonym for what used to be referred to, also derogatorily, as “PC” – politically correct.\nI’ve politely asked my colleagues at the college where I teach to avoid the word because it has so effectively been weaponized by the far right to mock and discredit anyone who supports racial justice, economic equity, universal healthcare, and many of the issues in which I too believe.\nIn the ABC interview, AOC explained the ways in which, during the Covid lockdown, “There was a huge opening. The doors were really open to entertain any and every policy that was trying to get us to a better place. But the rhetoric we used at that time is not the rhetoric we use today.” She went on to explain that her primary goal – improving the life of every American – has remain unchanged.\nEven though I wish she’d used different language for it, I understand her suggestion that Woke 1.0 was crazy. The strict policing of language, the “cancellation” of anyone
