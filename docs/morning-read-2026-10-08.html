Spain's housing protests, has died", "title_en": "Evicted Spanish octogenarian Maricarmen Abascal, heart of Spain's housing protests, has died", "summary_ja": "Ms. Abascal had been in hospital since her eviction on September 23 from her home of more than 70 ‌years, when police and social workers removed her by stretcher", "summary_en": "Ms. Abascal had been in hospital since her eviction on September 23 from her home of more than 70 ‌years, when police and social workers removed her by stretcher", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/evicted-spanish-octogenarian-maricarmen-abascal-heart-of-spains-housing-protests-has-died/article71557243.ece", "state_media": false, "category": "社会", "full_text": "Maricarmen Abascal, the 87-year-old woman whose dramatic eviction last month sparked mass housing protests in Spain that ultimately led to an early election, has died, Madrid’s tenants’ union said on Wednesday (October 7, 2026), provoking an outpouring of grief and anger on the streets of the capital.\nMs. Abascal had been in hospital since her eviction on September 23 from her home of more than 70 years, when police and social workers removed her by stretcher.\nSince then, protests have included activists camping out on one of Madrid’s main squares and calls for action over a mounting housing crisis including a shortage of homes and surging rents.\nFollowing the news of Ms. Abascal’s death, thousands marched from the square, Puerta del Sol, towards parliament, chanting: “This is not a death. It’s a murder!” A cause of death was not announced.\nTrade unions on Wednesday (October 7, 2026) announced there will be a nationwide general strike over housing issues on November 11.\nThe protests, along with parliament’s rejection last week of decrees aimed at curbing evictions and limiting rent pressures, prompted Prime Minister Pedro Sanchez to call an early election for November 29.\nMr. Sanchez is seeking to shift the political narrative from his government’s handling of a migrant crisis in Spain’s North African enclave of Ceuta and a series of corruption cases involving his Socialist Party and his family to the housing crisis, an area in which he can harness growing resentment about rising rents.\n“Now, following her passing, we are left with the example of the fight she waged and the legacy Maricarmen has left behind. And, above all, we will honor what she always asked of us: ‘Fight, keep fighting for what is yours,’” the tenants’ union said in a statement.\nMr. Sanchez posted on X, lamenting Ms. Abascal’s death. “A hug as well to all of us who feel this loss as our own today,” he wrote. Angel Victor Torres, Spain’s territorial policy minister, said Abascal had become a symbol of what was happening to many families as elderly and young people struggled to obtain their own homes or stay in them.\nPublished - October 08, 2026 02:53 am IST", "translation_ja": "", "vocab": [{"word": "sparked", "definition": "引き起こした、きっかけを作った。ここでは、マリカルメンの強制退去が大規模な住宅抗議運動の発火点となったことを表現している。"}, {"word": "mounting", "definition": "増加し続ける、深刻になる。住宅危機が時間とともに悪化していく状況を示す。"}, {"word": "prompted", "definition": "～をするよう促した、～の原因となった。抗議活動や議会の決定がサンチェス首相に選挙を呼び出させたきっかけを説明している。"}, {"word": "harness", "definition": "～を有効活用する、～を活かす。政治家が国民の怒りや不満を政治的に利用することを意味する。"}, {"word": "resentment", "definition": "不満、憤慨。家賃上昇に対する国民の深い怒りや反発の感情を表している。"}]}, {"title_ja": "Court documents reveal alleged online plotting behind Tumbler Ridge mass shooting - Toronto Star", "title_en": "Court documents reveal alleged online plotting behind Tumbler Ridge mass shooting - Toronto Star", "summary_ja": "Court documents reveal alleged online plotting behind Tumbler Ridge mass shooting Toronto Star", "summary_en": "Court documents reveal alleged online plotting behind Tumbler Ridge mass shooting Toronto Star", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi5AFBVV95cUxNak0xbGNGX29LcFNzak5WbG1Ca3d3bTdVNzNfc3BKVWcybE VcjgyZEd3NVU2MEtkTlhDRTJPd3M2VHFn?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Economic expert seeks redesign of FG’s cash transfer programme", "title_en": "Economic expert seeks redesign of FG’s cash transfer programme", "summary_ja": "Mr Uwaleke, a professor and the President, Capital Market Academics of Nigeria (CMAN), made the call in an interview with the News Agency of Nigeria (NAN) in Abuja The post Economic expert seeks redesign of FG’s cash transfer programme appeared first on Premium Times Nigeria .", "summary_en": "Mr Uwaleke, a professor and the President, Capital Market Academics of Nigeria (CMAN), made the call in an interview with the News Agency of Nigeria (NAN) in Abuja The post Economic expert seeks redesign of FG’s cash transfer programme appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/business/business-news/915352-economic-expert-seeks-redesign-of-fgs-cash-transfer-programme.html", "state_media": false, "category": "経済", "full_text": "Uche Uwaleke, an economy and capital market expert, has urged the Federal Government to redesign its conditional cash transfer programme.\nMr Uwaleke, a professor and the President, Capital Market Academics of Nigeria (CMAN), made the call in an interview with the News Agency of Nigeria (NAN) in Abuja.\nHe said the cash transfer programme, one of President Bola Tinubu’s administration’s principal poverty reduction interventions, required fundamental redesign to improve transparency and public confidence.\nThe expert said the programme could provide temporary relief and protect vulnerable households from severe economic shocks.\nHe, however, said its effectiveness would depend on credible beneficiary identification, payment integrity, adequate transfer amounts and the ability to monitor outcomes.\nMr Uwaleke said a programme whose beneficiaries could not be independently verified risked excluding deserving households, creating opportunities for abuse and weakening public trust.\n“I recommend that the government should replace the existing approach with a more transparent, independently verifiable and better targeted social protection framework.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“A strengthened social register should be regularly updated and linked, with appropriate privacy safeguards, to credible data from relevant government institutions.\nAccess services\n“Community-based verification should complement digital identification to ensure that people in remote and underserved communities are not excluded,” he said.\nHe also recommended a payment architecture that allowed traceability, alongside accessible grievance redress mechanisms and periodic impact assessments.\nSpeaking on food production, Mr Uwaleke called for the revival of the Directorate of Food, Roads and Rural Infrastructure (DFRRI) programme.\nHe said the revival would help address challenges affecting food production, rural access and basic infrastructure across the country.\nMr Uwaleke said national development could not be achieved by concentrating investment in major urban centres.\nHe noted that rural communities where much of the country’s agricultural production took place, needed stronger links to markets and essential services.\nAccording to him, the underlying logic of the programme is to bring development closer to rural communities by addressing food production, rural access and basic infrastructure.\nMr Uwaleke said a renewed DFRRI-type programme should not reproduce past institutional arrangements but be redesigned as a community-centred rural productivity and infrastructure initiative.\nHe said the initiative should be jointly implemented by the federal, state and local governments, with clear accountability mechanisms and measurable outcomes.\nAccording to him, these commitments must be translated into a coordinated national agricultural productivity programme with measurable targets, clear institutional responsibilities and adequate funding.\n“Its priorities should include feeder roads, small-scale irrigation, rural electrification, water supply, produce aggregation centres, storage facilities, primary healthcare access and market infrastructure.\n“Such a programme can accelerate grassroots development by connecting farming communities to markets, reducing transportation costs, improving access to agricultural inputs and creating employment through rural infrastructure projects.\n“The emphasis should be on raising output per hectare, increasing multiple cropping, improving yields, reducing post-harvest losses and strengthening linkages between farmers, agro-processors and domestic markets,” he said.\nMr Uwaleke said the programme would provide a practical means of ensuring that economic recovery reached communities that had remained disconnected from the benefits of national growth.\n“The emphasis must be on functional infrastructure and productive assets rather than politically distributed projects that have little lasting economic value,” he said.\nMr Uwaleke noted that beyond agriculture, the cost of energy remained a major constraint on domestic production.\nHe said manufacturers, small businesses and service providers continued to face high operating costs because of unreliable electricity supply and dependence on alternative energy sources.\nThe CMAN president said expansion of gas infrastructure, renewable energy, embedded generation and reliable grid supply must become integral components of the government’s prosperity agenda.\nHe said reducing energy costs would improve industrial competitiveness, encourage domestic production, reduce dependence on imported goods and create employment opportunities.\n“The same logic applies to transportation and logistics.\n“The completion of strategic roads, railways, ports and inland logistics infrastructure should be prioritised according to their economic returns and capacity to reduc", "translation_ja": "", "vocab": [{"word": "conditional cash transfer", "definition": "条件付きの現金給付プログラム。特定の条件（例：子どもの就学や健康診断）を満たす世帯に対して政府が直接現金を支給する貧困削減政策。"}, {"word": "interventions", "definition": "介入、干渉、あるいは対策的措置のこと。政策や問題解決のための積極的な対応や施策を指す。"}, {"word": "traceability", "definition": "追跡可能性、透明性のこと。取引や資金の流れが明確に記録され、どの段階でも追跡できる状態を表す。"}, {"word": "redress mechanisms", "definition": "救済メカニズム、苦情処理制度。不公正や問題が生じた場合に、それを是正・改善するための制度や手続き。"}, {"word": "underserved communities", "definition": "サービスが行き届いていない地域社会。十分なインフラストラクチャーや公共サービスへのアクセスが限定されている地域を指す。"}]}, {"title_ja": "Poor record-keeping caused confusion over NAF crash manifest – Ex-SSS director", "title_en": "Poor record-keeping caused confusion over NAF crash manifest – Ex-SSS director", "summary_ja": "NAF released the names of 25 people aboard the aircraft, rather than the 32 earlier reported by government officials. The post Poor record-keeping caused confusion over NAF crash manifest &#8211; Ex-SSS director appeared first on Premium Times Nigeria .", "summary_en": "NAF released the names of 25 people aboard the aircraft, rather than the 32 earlier reported by government officials. The post Poor record-keeping caused confusion over NAF crash manifest &#8211; Ex-SSS director appeared first on Premium Times Nigeria .", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/915348-poor-record-keeping-caused-confusion-over-naf-crash-manifest-ex-sss-director.html", "state_media": false, "category": "政治", "full_text": "A former Director of the State Security Service (SSS), Mike Ejiofor, has attributed the conflicting figures surrounding the number and identities of people aboard the Nigerian Air Force (NAF) aircraft that crashed in Ondo State to poor record-keeping.\nMr Ejiofor said proper documentation of passengers and crew members aboard the aircraft would have made it easier to establish the exact number of people on board and identify the casualties.\nThe NAF released the names of 25 people aboard the aircraft, rather than the 32 earlier reported by government officials.\nMr Ejiofor spoke on Arise Television’s Daybreak programme on Wednesday.\nCommenting on the conflicting figures, he said the authorities should have been able to rely on the aircraft’s manifest to establish the identities of everyone on board.\n“It goes again to the issue of data keeping; it would have been easier to get the manifest,” he said.\nHe said there was a possibility that some people aboard the aircraft might not have been included in the available manifest.\n“I think they should rely more on the manifest of the aircraft if it was actually compiled from the people in the aircraft and their names were contained in a manifest,” he said.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\n“It’s a sad situation that this simple record-keeping can just be having conflicts.”\nNAF recent aircraft crash\nThe NAF aircraft crashed on 5 October in a riverine swamp in the Igbokoda area of Ondo State.\nAccording to the information provided by the authorities, the ATR-42 military aircraft, with tail number NAF 931, was on a routine maritime patrol and transport mission from Benin City to Lagos when air traffic controllers lost contact with it.\nThe NAF said all 25 people on board – 20 passengers, mostly military personnel, and five crew members, died in the crash.\nThe wreckage was located in a dense, muddy swamp opposite a local naval base. Recovery efforts have reportedly been hampered by the terrain and the fact that much of the wreckage became submerged in water and mud.\nPresident Bola Tinubu declared three days of national mourning and ordered an investigation into the cause of the crash.\nThe incident has also renewed concerns over the safety and maintenance of military aircraft in the country.\n‘Investigate NAF aircraft operations’\nMr Ejiofor said the crash should prompt a broader examination of the Nigerian Air Force’s aircraft fleet, including the maintenance history and operational condition of its aircraft.\nHe described the frequency of military aircraft crashes as a concern that should be investigated thoroughly.\n“What is the state of maintenance of all these aircraft? How long have they been serviced? From records we have, there have been over 10 crashes in the last 10 years,” he said.\n“We should look into the general operations of the Air Force.”\nHe also cited the 21 May 2021 crash in which Ibrahim Attahiru, then chief of army staff, and other military personnel were killed.\nMr Ejiofor said the recurring incidents warranted a comprehensive review of military aviation operations rather than investigations being limited to individual crashes.\nCrash site poses rescue challenge\nOn the search and rescue operation following the latest crash, Mr Ejiofor said the difficult terrain had posed a significant challenge to rescuers.\nHe said the proximity of the crash site to military and police facilities would ordinarily have raised expectations of a swift response, but the swampy terrain complicated the operation.\n“The terrain posed a very serious challenge, and as we speak, the forces of the aircraft have not been recovered yet. So, there’s no hope that there will be any life,” he said.\nHe, however, cautioned against blaming those involved in the rescue operation, given the conditions at the crash site.\nREAD ALSO: Plane Crash: Aiyedatiwa visits site, says aircraft’s main body yet to surface, human parts recovered\nMr Ejiofor also cautioned against drawing conclusions about what caused the loud sound reportedly heard before the aircraft crashed.\nHe said it was too early to determine whether the aircraft exploded before hitting the ground or whether the impact itself produced the sound.\n“For me, these are speculations,” he said.\n“It’s possible the impact on crashing was the deafening noise, it might not.”\nHe added that an explosion could also have occurred before impact, potentially contributing to the scattering of debris and body parts.\n“It’s also possible that there was an explosion before the impact, which led to the dissemination and finding of body parts,” he said.\nHe stressed that the cause of the crash could only be established after a proper investigation.\n“So, until the investigation is complete, we can’t be specific about whether it was an explosion in the air or the impact on the ground,” he said.\nDiscover more from Premium Times Nigeria\nSubscrib", "translation_ja": "", "vocab": [{"word": "attributed", "definition": "~の原因を~に帰する、~のせいにする。ある結果や状態がどの要因によって生じたかを説明する際に使用される。"}, {"word": "manifest", "definition": "航空機や船舶の乗客・積荷を記載した公式文書。また、明白に示す、明らかにするという意味の動詞としても使用される。"}, {"word": "conflicting", "definition": "互いに矛盾する、相反する。複数の情報や意見が異なっており、調和していない状態を表す。"}, {"word": "hampered", "definition": "妨害する、阻止する。何かの進行や達成を困難にする障害を生じさせる。"}]}, {"title_ja": "Plane Crash: Aiyedatiwa visits site, says aircraft’s main body yet to surface, human parts recovered", "title_en": "Plane Crash: Aiyedatiwa visits site, says aircraft’s main body yet to surface, human parts recovered", "summary_ja": "Governor Aiyedatiwa told journalists that no survivor had been found, noting that only parts of victims' bodies, clothes and jackets, as well as broken aircraft parts were recovered and preserved for further investigation. The post Plane Crash: Aiyedatiwa visits site, says aircraft’s main body yet t", "summary_en": "Governor Aiyedatiwa told journalists that no survivor had been found, noting that only parts of victims' bodies, clothes and jackets, as well as broken aircraft parts were recovered and preserved for further investigation. The post Plane Crash: Aiyedatiwa visits site, says aircraft’s main body yet t", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/915338-plane-crash-aiyedatiwa-visits-site-says-aircrafts-main-body-yet-to-surface-human-parts-recovered.html", "state_media": false, "category": "経済", "full_text": "Search operations continued on Wednesday at the site of the crash of the Nigerian Air Force plane at Igbokoda, headquarters of Ilaje Local Government Area of Ondo State. Still, divers could not locate the main body of the aircraft.\nThe divers, comprising the Police, Navy and locals, including members of the National Emergency Management Agency (NEMA), only managed to bring out some human body parts as well as pieces of the aircraft.\nOndo State Governor Lucky Aiyedatiwa disclosed this to journalists during an assessment visit to the crash site.\nMr Aiyedatiwa visited the site alongside personnel of the Nigerian Navy and Nigerian Air Force, divers, the South-west Director of the National Emergency Management Agency (NEMA), the Director of the State Emergency Management Agency and residents who had participated in rescue efforts since Monday.\nThe ill-fated ATR-42 aircraft, which was carrying Nigerian Air Force personnel on a special mission from Benin to Lagos, crashed at Igbokoda on Monday morning.\nNAF authorities said 26 people were on board the aircraft at the time it crashed.\nAccording to the governor, no survivors had been found, noting that only parts of bodies, clothes and jackets belonging to Air Force personnel and broken aircraft parts were recovered and preserved for further investigation.\nStay Ahead with Premium Times\nFollow us on Google News and never miss breaking stories, investigations, and in-depth reporting.\nAdd as a preferred source on Google\nHe said the main body of the aircraft had not been sighted as it was believed to be submerged in the swamp.\nMr Aiyedatiwa, from the local government area where the crash occurred, explained that the difficulty of accessing the site prompted him to direct the Ministry of Works to deploy two amphibious machines, popularly known as swamp buggies, to open wider access through the waterways.\nHe said the machines had enabled rescue teams to move bigger boats closer to the crash site and were being used to excavate the soil in search of other parts of the wreckage or the main body of the aircraft.\nThe governor further said the aircraft had still not been sighted as of the time of his visit. At the same time, Navy personnel and local divers continued searching the deeper sections of the area for possible bodies and the cockpit.\nMr Aiyedatiwa said only the pilot could have explained the cause of the crash, adding that the occupants were believed to have died.\nHe said the swamp’s nature and depth could have caused the aircraft to become deeply submerged in the mud.\n“From construction experience and analysis of this area, for you to get to refusal level, it’ll get to about 30 metres deep,” he said, adding that the aircraft could have gone completely into the mud.\nHe said jet fuel was flowing into the water, polluting the area with aviation fuel.\nHe said he was grateful the aircraft did not crash in the middle of the community, adding that it would have been a major catastrophe.\nAccording to him, residents who witnessed the incident said the aircraft appeared to be coming down with a sound suggesting a bad engine and was almost landing within the community.\nHe said the pilot managed to manoeuvre the aircraft away from the community before it landed about 200 metres away and went straight into the swamp.\nThe governor said only the pilot could have explained the effort made to manoeuvre the aircraft away from the community.\nMr Aiyedatiwa also sympathised with the families of the deceased and the Nigerian Air Force, describing the victims as able and young Nigerians who had signed up to defend and protect the territorial integrity of the country.\nREAD ALSO: NAF Plane Crash: Newlywed loses husband 20 years after father died in NAF air crash\nHe, however, said that based on what had been seen at the crash site, he doubted whether any of the victims could return to life.\n“May their souls rest in peace,” he prayed.\nMr Aiyedatiwa, however, urged the search and rescue teams to intensify efforts to get out the remaining parts of the aircraft and the bodies of the victims.\nEarlier, the Commander of the Nigerian Navy Forward Operating Base, Igbokoda, Andy Alemongwa, briefed the governor on the progress of the search-and-rescue operation.\nAlso on Wednesday, the Flag Officer Commanding, Western Naval Command, Abubakar Mustapha, and the Air Officer Commanding, Logistics Command, Nigerian Air Force, Abubakar Suleh, inspected the crash site of the Nigerian Air Force ATR-42.\nMr Mustapha, a rear admiral, conveyed the appreciation of the Chief of Defence Staff, Olufemi Oluyede, a general, and the service chiefs to the Ondo State Government, communities, emergency agencies and other stakeholders for their support since the incident occurred.\nHe urged stakeholders to remain calm and continue to cooperate with the various agencies involved in the recovery operation.\nAt the site, the team assessed the situation and provided technical guidance to facilitate the timely recovery of the submerg", "translation_ja": "", "vocab": [{"word": "ill-fated", "definition": "不幸な運命にある、悲劇的な結末を迎けることが定められている。この場合、墜落した航空機を指す。"}, {"word": "submerged", "definition": "水中に沈んでいる、水に浸かっている状態。ここでは航空機の主要部分が沼地の水中に沈んでいることを意味する。"}, {"word": "amphibious", "definition": "水と陸地の両方で活動できる性質を持つ。この場合、沼地のような湿った地形でも走行できる機械を指す。"}, {"word": "wreckage", "definition": "破壊や事故によって残された残骸や破片。航空機の墜落事故の場合、散乱した破片全体を意味する。"}, {"word": "excavate", "definition": "土地を掘り出す、発掘する。ここでは沼地の土を掘り起こして航空機の部品や機体を探索することを指す。"}]}, {"title_ja": "‘Maricarmen,’ Whose Eviction Enraged Spaniards, Dies at 87", "title_en": "‘Maricarmen,’ Whose Eviction Enraged Spaniards, Dies at 87", "summary_ja": "María del Carmen Abascal, aged and ailing, became a symbol of the country’s housing crisis wh ", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2199027", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "How Africa Can Leverage the US-China Thaw", "title_en": "How Africa Can Leverage the US-China Thaw", "summary_ja": "As dollar borrowing costs soar, Chinese rates are approaching record lows. This divergence, combined with the US-China thaw, creates an opportunity for African governments: partner with the US on gas and with China on solar and storage, and tap lower-cost Asian capital markets to finance investments", "summary_en": "As dollar borrowing costs soar, Chinese rates are approaching record lows. This divergence, combined with the US-China thaw, creates an opportunity for African governments: partner with the US on gas and with China on solar and storage, and tap lower-cost Asian capital markets to finance investments", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/africa-can-leverage-us-china-thaw-to-improve-financing-conditions-for-energy-investment-by-prasad-ananthakrishnan-and-vera-songwe-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "How Africa Can Leverage the US-China Thaw\nand\nAs dollar borrowing costs soar, Chinese rates are approaching record lows. This divergence, combined with the US-China thaw, creates an opportunity for African governments: partner with the US on gas and with China on solar and storage, and tap lower-cost Asian capital markets to finance investments in both.\nWASHINGTON, DC—Chinese President Xi Jinping’s state visit to the US produced a two-month extension of the current bilateral trade truce—and little else. Nonetheless, both leaders signaled that they want a more stable relationship ahead of the Asia-Pacific Economic Cooperation summit in Shenzhen in November and the G20 in Miami in December. This creates an opportunity for emerging and developing economies in Africa and elsewhere.", "translation_ja": "", "vocab": [{"word": "leverage", "definition": "何かを有利に利用して、より大きな効果や利益を得ること。ビジネスや外交の文脈では、既存の資源や状況を戦略的に活用することを意味する。"}, {"word": "divergence", "definition": "2つ以上のもの、特に経済指標や政策が異なる方向に進むこと。この記事では米国と中国の金利が相反する傾向を示している。"}, {"word": "thaw", "definition": "冷え込んだ国際関係が改善され、対話や協力が増加すること。字義的には「融解」だが、政治的文脈では緊張緩和を意味する。"}, {"word": "bilateral", "definition": "2つの国や団体の間の相互的な関係や協定のこと。通常、国家間の外交や貿易交渉を指す。"}, {"word": "truce", "definition": "紛争や対立を一時的に中止する合意。戦争や貿易摩擦など、対立状態を一時的に休止させることを意味する。"}]}, {"title_ja": "Closing NATO’s Deterrence Gap", "title_en": "Closing NATO’s Deterrence Gap", "summary_ja": "With Russian provocations against NATO member states growing more frequent, the alliance urgently needs to develop a credible doctrine of punitive deterrence to guide its response to acts of aggression that fall below the threshold of war. Mere territorial defense is not enough.", "summary_en": "With Russian provocations against NATO member states growing more frequent, the alliance urgently needs to develop a credible doctrine of punitive deterrence to guide its response to acts of aggression that fall below the threshold of war. Mere territorial defense is not enough.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/nato-deterrence-gap-russia-yet-to-face-real-punishment-by-agnia-grigas-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "Closing NATO’s Deterrence Gap\nWith Russian provocations against NATO member states growing more frequent, the alliance urgently needs to develop a credible doctrine of punitive deterrence to guide its response to acts of aggression that fall below the threshold of war. Mere territorial defense is not enough.\nVILNIUS—On September 23, just a week after NATO aircraft shot down a drone that had entered Lithuanian air space from Belarus, a Russian military helicopter flying out of Kaliningrad briefly breached Polish airspace. Neither intrusion was an isolated episode. A growing catalogue of security incidents shows that the Kremlin’s war of aggression against Ukraine is pressing ever more ominously on NATO’s borders.", "translation_ja": "", "vocab": [{"word": "deterrence", "definition": "攻撃を抑止するための威嚇や脅迫戦略のこと。軍事や外交の文脈で、相手が攻撃を仕掛けないよう事前に防止することを意味します。"}, {"word": "provocations", "definition": "意図的に相手を怒らせたり、反応を引き出そうとする挑発行為のこと。国家間の関係では、軍事的または政治的な緊張を高める行動を指します。"}, {"word": "threshold", "definition": "ある状態から別の状態へ移行する境界線や限界点のこと。ここでは戦争と呼べる程度の深刻さに至らない段階を意味します。"}, {"word": "intrusion", "definition": "許可なく他国の領空や領土に侵入する行為のこと。国際法違反となる領域侵犯を指す正式な用語です。"}, {"word": "catalogue", "definition": "系統的にまとめられた一覧や記録のこと。ビジネス文書では製品リストだけでなく、事件や出来事の詳細な記録を意味することもあります。"}]}, {"title_ja": "The India-Pakistan Cold War", "title_en": "The India-Pakistan Cold War", "summary_ja": "The current stalemate between India and Pakistan should be viewed not as a pause between rounds of negotiation, but rather as part of a deliberate Indian strategy of disengagement. India will return to the negotiating table only after Pakistan dismantles, comprehensively and verifiably, its state-su", "summary_en": "The current stalemate between India and Pakistan should be viewed not as a pause between rounds of negotiation, but rather as part of a deliberate Indian strategy of disengagement. India will return to the negotiating table only after Pakistan dismantles, comprehensively and verifiably, its state-su", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/india-pakistan-diplomatic-freeze-will-not-end-any-time-soon-by-shashi-tharoor-2026-10?utm_source=rss&utm_medium=feed&utm_campaign=main&utm_content=en", "state_media": false, "category": "オピニオン", "full_text": "The India-Pakistan Cold War\nThe current stalemate between India and Pakistan should be viewed not as a pause between rounds of negotiation, but rather as part of a deliberate Indian strategy of disengagement. India will return to the negotiating table only after Pakistan dismantles, comprehensively and verifiably, its state-supported terrorist networks.\nNEW DELHI—For decades, South Asia was locked in a perpetual cycle of conflict management: brief military clashes between India and Pakistan would be followed by de-escalation and the resumption of formal peace talks, which eventually gave way to another bout of conflict. But this pattern has now been broken. No high-level dialogue has taken place since 2016. Rather than some temporary diplomatic tantrum, this reflects a paradigm shift in Indian foreign policy, permanently altering the subcontinent’s security architecture.", "translation_ja": "", "vocab": [{"word": "stalemate", "definition": "交渉や対立が進展せず膠着した状態。互いに動けない状況を指す外交・ビジネス用語。"}, {"word": "disengagement", "definition": "関係を断つ、縁を切る行為。政治的・外交的な関係から意図的に身を引くことを意味する。"}, {"word": "perpetual", "definition": "永遠に続く、途絶えない状態。時間的な制限がなく継続する事柄を描写する際に用いられる。"}, {"word": "paradigm shift", "definition": "既存の考え方や枠組みが根本的に変わること。社会や組織における基本的な価値観や理解方式の転換を指す。"}, {"word": "architecture", "definition": "本来は建築を意味するが、転じてシステムや構造全体の枠組みを指す。政治・技術領域で基本構造を表現する際に使用される。"}]}, {"title_ja": "The Guardian view on the US midterms: the cost of living is on the ballot, but this is about democracy too | Editorial", "title_en": "The Guardian view on the US midterms: the cost of living is on the ballot, but this is about democracy too | Editorial", "summary_ja": "Donald Trump’s unpopularity and the economic struggles of voters have boosted Democrats. But with less than a month to go, there is no complacency For once, Democrats and Donald Trump might be in agreement: “Pretend I’m on the ticket,” the historically unpopular president has instructed supporters .", "summary_en": "Donald Trump’s unpopularity and the economic struggles of voters have boosted Democrats. But with less than a month to go, there is no complacency For once, Democrats and Donald Trump might be in agreement: “Pretend I’m on the ticket,” the historically unpopular president has instructed supporters .", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/07/the-guardian-view-on-the-us-midterms-the-cost-of-living-is-on-the-ballot-but-this-is-about-democracy-too", "state_media": false, "category": "オピニオン", "full_text": "For once, Democrats and Donald Trump might be in agreement: “Pretend I’m on the ticket,” the historically unpopular president has instructed supporters. Midterms are in large part a referendum on the incumbent, and Trump’s war on Iran and its impact on the cost of living have boosted support for Democrats. With less than a month to go, they have reason to be upbeat. The party has a mountain to climb after the devastating defeats of 2024, and the gerrymandering of Republicans, but surveys give it a lead of about nine points on the generic ballot, which measures preference for parties rather than specific candidates.\nAttention has turned from the prospects of seizing the House, where Democrats are forecast a clear majority, to what once seemed like the highly optimistic possibility of taking the Senate too. That would require flipping four seats, with 35 in play. Remarkably, Democrats are prospering in red states from Texas to Alaska. In Kansas – which Mr Trump carried by 16 points, and which has not elected a Democratic senator since 1932 – the race is neck and neck.\nEven putting aside the ongoing questions about polling accuracy, there are very good reasons for caution. The first and most glaring is that the Democrats remain unpopular. Voters are being turned off the Republicans rather than drawn towards their rivals; pundits talk of a red undertow rather than a blue wave.\nSecond, the picture is extremely patchy. Democrats’ striking progress in key races where few had favoured them is tied to standout candidates and especially unpopular opponents – notably in Texas, where the Christian pastor and economic populist James Talarico is leading Ken Paxton, viewed unfavourably by a third of his own party’s supporters. Yet Democrats are struggling in some places where they initially had good reason for optimism, such as Maine. Third, the huge Republican spending advantage is now materialising – with $700m of advertising booked since the start of September.\nMr Trump, who has fared better than his party in elections, is hitting the campaign trail. He may make sure his base turns out. But candidates – including those who benefited from his endorsement – are increasingly distancing themselves from the president because he alienates others. He is visibly more energised by his construction projects than how his voters can pay their bills. His war on Iran looks not only reckless and ineffectual, but is pushing up prices. Strikingly, voters are now more likely to identify Republicans than Democrats as “elitist”. Latino voters who swung to him are changing their minds, with Immigration and Customs Enforcement excesses contributing.\nOutrageously, Mr Trump has used taxpayer-funded adverts to laud his presidency. It goes without saying that he cannot be expected to respect the midterm results. The supreme court rejected his efforts to restrict mail-in voting – used by almost a third of the electorate – but he continues to smear it.\nJust as he disrupts the electoral process, in office he rejects the norms and restraints that his predecessors recognised, and relies more and more on executive orders – seeking to avoid checks on issues ranging from war to vaccines. But should Democrats manage to take both House and Senate, they would regain both legislative control and investigative powers. In these elections, most votes will be driven by economic stress rather than democratic peril. But their outcome will be critical to the defence of American democracy – or its continued erosion.", "translation_ja": "", "vocab": [{"word": "incumbent", "definition": "現職の政治家または公務員。選挙の際に、すでにその職にある人物を指す。"}, {"word": "gerrymandering", "definition": "政治的に有利になるよう選挙区の境界を意図的に変更する行為。民主的プロセスを歪める不正な慣行とされている。"}, {"word": "referendum", "definition": "特定の政策や決定について国民投票を通じて国民の意見を直接問う仕組み。ここでは比喩的に、中間選挙が現政権への評価投票として機能することを指す。"}, {"word": "undertow", "definition": "本来の流れとは異なる潜在的な流れや傾向。政治的には、表面上の見た目とは異なる根底にある有権者の動きを意味する。"}, {"word": "ineffectual", "definition": "期待された効果や成果を生み出せない、または無効である。目標達成に失敗している状態を表す。"}]}, {"title_ja": "‘Take out’ Los Angeles and San Diego? Trump is beyond irresponsible | Ted Widmer", "title_en": "‘Take out’ Los Angeles and San Diego? Trump is beyond irresponsible | Ted Widmer", "summary_ja": "We appear to be entering a new era, in which political desperation at home leads to increasingly unhinged threats abroad Donald Trump was in Nebraska on Monday, and though his long rally speech had elements of a performance, this was no Bruce Springsteen album. He offered another dark meditation on ", "summary_en": "We appear to be entering a new era, in which political desperation at home leads to increasingly unhinged threats abroad Donald Trump was in Nebraska on Monday, and though his long rally speech had elements of a performance, this was no Bruce Springsteen album. He offered another dark meditation on ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/07/trump-speech-los-angeles-san-diego", "state_media": false, "category": "オピニオン", "full_text": "Donald Trump was in Nebraska on Monday, and though his long rally speech had elements of a performance, this was no Bruce Springsteen album. He offered another dark meditation on a world spiraling out of control, one in which the destruction of American cities is increasingly a possibility, unless Americans trust him to use the vast powers of the presidency to annihilate his foes.\nThe president drew fury when he suggested that Iran could launch a nuclear attack and “take out” Los Angeles or San Diego. California leaders reacted with scorn at Trump’s alarmism.\nGovernor Gavin Newsom denounced Trump as “deranged and dangerous”, while the mayors of Los Angeles and San Diego, Karen Bass and Todd Gloria, objected strenuously to putting their cities in harm’s way, even if only in his feverish imagination.\nPerhaps the worst problem with Trump’s speech – and there were many – was not that it vividly daydreamed about Armageddon-on-the-Pacific. It was just so delusional that it had almost no basis in fact at all.\nIt is inherently destabilizing when a nation’s leader cannot be trusted to make an accurate statement, and the situation is especially troubling when the nation is the United States, the defender of the rules-based order since 1945.\nFirst, the claim itself. When read inside the transcript, the words don’t make a great deal of sense. It’s almost like scat singing as the president goes into his famous “weave”, his word for the way he lurches from one half-formed thought to another, like a rodeo clown on a bucking bronco.\n“[Kamala] stole a lot of things that didn’t work out too well. But I want, I wanna see, I wanna see a tremendous victory. You wanna see a tremendous victory, because it verifies all the things we did. And again, remember, with the word, it’s just artificial, it’s a little bit high. It’s a small price to pay for keeping the world safe, keeping our country safe.\n“They can take out a city. Let them take, let it, let them take out Los Angeles. Let them take out San Diego. That’s, this is a very small price to pay, and it’s gonna be over very soon. It’s essentially almost over with.”\nIf he was talking about the war as being “almost over with”, then he’s certainly wrong, as the conflict drags into its eighth month with no sign of resolution. But if he was talking about the midterms, then he’s correct that it will end soon, and not well for him.\nIn effect, he now has to go into the reddest part of a red state to sustain his vanishing popularity. Monday night’s rally was held at the Nebraska State Fairgrounds, in Hall county, Nebraska, which had a population of 62,895 in 2020. Even farmers are wary of this war, which has raised the price of fertilizers and diesel.\nThe language about LA and San Diego was to be fair, quite vague. Presumably, he was worried that Iran’s nuclear program might be able to target LA or San Diego. But by saying “let them …” it almost sounded like he was encouraging them to, as when John F Kennedy, in Berlin, held up that city as a model of courage and said: “Let them come to Berlin,” in both English and German).\nIn either case, there is no possibility of it happening, as his military advisers know, and as even he must know at some level. Iran does not have a nuclear weapon, nor can its missiles reach the United States, on either the east or west coast.\nFurthermore, it is the height of irresponsibility to even discuss such an unimaginable threat. All foreign leaders understand that any attack on the United States with a nuclear weapon would result in an overwhelming counterattack. It’s called deterrence.\nIt is that knowledge – and the cautious way in which previous American presidents have talked about nuclear weapons – that has helped to preserve the peace all these years. We appear to be entering a new era, in which political desperation at home leads to increasingly unhinged threats abroad.\nThe rest of the speech was also a mess. There was a lot of red-baiting, despite the fact that the cold war ended in 1991. There were the usual schoolyard insults, in this case lobbed toward the Texas Democratic Senate candidate James Talarico (“I call him Alfred E Neuman”) and Georgia senator Jon Ossoff (“he looks like Pee-wee Herman to me”).\nAnd more pot-stirring, with no basis in fact. Often, his claims undermined each other, as Trump claimed both that Iran has been rendered toothless (“we’re kicking Iran’s ass”) and that it remains a lethal threat, capable of destroying our second- and eighth-largest cities. Which one is it? Over and over, we have heard that Iran’s nuclear program has been “obliterated”. But if so, why are we still at war?\nThe rest of the speech was the usual farrago of distortions and lies, as the most casual effort to factcheck shows. “We want honest,” Trump said at one point, confusingly. Yes, we do.\nBut whether we are going to get it, is another question entirely.\n- Ted Widmer, a former White House speechwriter, is the editor of American Speeches, and the recently p", "translation_ja": "", "vocab": [{"word": "meditation", "definition": "深い思考や瞑想のこと。ここでは政治家が世界情勢について行う深刻な考察を指す。"}, {"word": "annihilate", "definition": "完全に破壊する、絶滅させるという意味。政治的なライバルを排除することを示唆している。"}, {"word": "alarmism", "definition": "不安や恐怖を過度に表現する傾向。事実以上に脅威を大げさに宣伝することを指す。"}, {"word": "delusional", "definition": "現実離れした、幻想的な状態。事実に基づかない妄想的な発言や思考を表す。"}, {"word": "destabilizing", "definition": "不安定にする、安定を損なうという意味。国家の信頼性が失われることで生じる悪影響を指す。"}]}, {"title_ja": "Why are the Democratic Socialists of America so successful? | Akin Olla", "title_en": "Why are the Democratic Socialists of America so successful? | Akin Olla", "summary_ja": "There’s an unsung reason for the organization’s success even as other leftwing groups face a bumpy road A lot has been written recently in an effort to understand the Democratic Socialists of America (DSA) and how we’ve risen to such prominence in a short time. It is clear that we reflect a growing ", "summary_en": "There’s an unsung reason for the organization’s success even as other leftwing groups face a bumpy road A lot has been written recently in an effort to understand the Democratic Socialists of America (DSA) and how we’ve risen to such prominence in a short time. It is clear that we reflect a growing ", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/oct/07/democratic-socialists-of-america", "state_media": false, "category": "オピニオン", "full_text": "A lot has been written recently in an effort to understand the Democratic Socialists of America (DSA) and how we’ve risen to such prominence in a short time.\nIt is clear that we reflect a growing disillusionment with the Democratic party, and a further radicalization of the American population. But many leftwing social movement organizations, such as Black Lives Matter and the Women’s March, have risen in the last decade or so, and many groups, from MoveOn to the Sunrise Movement, have attempted to absorb large numbers of people, influence the Democratic party and enter the public consciousness with lower levels of success.\nIt may just be that we happened to be the organization that had the name closest to the ideology of Bernie Sanders, the man arguably most responsible for reintroducing democratic socialism to the popular American lexicon. But name recognition alone can’t explain both our rapid growth and the ability to sustain that growth. Sanders has also talked about the need for a “political revolution” – but his own organization, Our Revolution, is politically irrelevant.\nWhat is missing from the discussion is the DSA’s structure.\nUnlike all of the groups I’ve named, it is a thoroughly democratically run organization that allows its members to set its goals, elect its leaders and amend its constitution. None of the other organizations even have constitutions to be altered. Instead, they have corporate bylaws and unelected executive boards to maintain their tax status with the IRS.\nWhile the DSA is primarily operated and funded by its growing membership, the other organizations rely on foundation funding and have a deeper reliance on professional staff. While local chapters of most of these groups have almost no control over the national structure, the DSA functions as a federation in which the national office is beholden to its constituent parts.\nThe DSA is not succeeding because of a good name. It is growing because it treats its members like adults capable of managing their own affairs and that of the organization, and they reward it with monthly dues and a long commitment that supersedes the natural highs and lows of uprisings.\nThis idea isn’t new; in fact it is foundational to the success of the American project (well, OK, success is a bit of a stretch, isn’t it?). Writing in the early 19th century, the French philosopher Alexis de Tocqueville described these kinds of membership-driven organizations as the “free schools” of democracy that serve as the bedrock of America’s political system.\nThey prepare Americans to lead and give them the political vehicles in which they can work with their neighbors to steer the country. This model is dying, but we still see it alive through organizations like the NAACP and the US Student Association, which I was a member of in my youth.\nThe NAACP is more than a hundred years old and the US Student Association will be 80 next year. While the DSA was created in 1982, it can trace its full history as a faction within larger organizations going back well over a century.\nIt is doubtful that the conflict-ridden Black Lives Global Network Foundation, the 501(c)3 organization that took the reins of the BLM movement, will survive the decade.\nBLM chapters have dissolved, broken away or become relatively dormant across the country. The network helped oversee the largest protest in US history, but it is doubtful that there are more than a handful of chapters functioning in the country. The Minneapolis chapter, arguably its most successful, reconstituted itself as Black Visions, and then sunsetted after years of misalignment and the forcing out of its original leadership.\nThe Green New Deal-championing Sunrise Movement has fared better, but not by much. It too has faced internal power struggles between leadership, who are paid staff members, and its base.\nAccording to one former member, the organization went from having more than 500 chapters in 2021 to probably fewer than 90 by 2023. It has made efforts to become more democratic but could only muster 700 votes for an internal decision, despite counting more than 80,000 members years prior.\nWhile some of this must be the natural attrition of social movements – the DSA’s membership also ebbs and flows – founders of the Sunrise Movement have publicly recognized the internal conflict built into their model.\nAnd this is why the DSA will continue to succeed where most groups fail. It has clear mechanisms for its membership to change the direction of the organization without engaging in backroom schemes and internal coups. Clashes still happen, but they are facilitated by clear guidelines that allow factions – called caucuses – to vie for power, and leaders have clear term limits.\nI joined the US Student Association (USSA) with a desire to learn from it and steal members for my own organization, in the vein of the Québécois student unions. But the USSA was so democratic and full of meaningful deliberation that I realized I could c", "translation_ja": "", "vocab": [{"word": "disillusionment", "definition": "期待や信念が裏切られたことによる失望感や幻滅。政治や組織に対する信頼が失われた状態を指す。"}, {"word": "radicalization", "definition": "思想や立場がより極端または革命的になるプロセス。主流から離れた急進的なイデオロギーへの転換。"}, {"word": "lexicon", "definition": "特定の分野や言語で使用される語彙の総体。ある集団や文化が日常的に使用する言葉や用語の体系。"}, {"word": "beholden", "definition": "義務や責任を負っている状態。誰かに対して責任がある、または従う必要がある立場にあること。"}, {"word": "foundational", "definition": "基盤となる、または本質的な。システムや理論の根本的な基礎をなしている重要な要素。"}]}, {"title_ja": "The Two Africas", "title_en": "The Two Africas", "summary_ja": "Who will benefit from the continent's investment boom?", "summary_en": "Who will benefit from the continent's investment boom?", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/africa/two-africas", "state_media": false, "category": "オピニオン", "full_text": "Last year, U.S. President Donald Trump told a group of African leaders that the United States would be “shifting from aid to trade.” Washington had already begun to close USAID, the world’s biggest development agency, and many U.S. allies followed suit, cutting their own aid programs in Africa.\nAmid the humanitarian cuts, however, international business interest in Africa is growing. The continent possesses huge reserves of the critical minerals the world needs. Foreign investors are eyeing Africa’s young workforce, growing consumer base, and ports located along vital global trade routes. And competition among China, the United States, Europe, India, and the Gulf states is bringing a wider array of investors than ever before. This year, roughly half of the world’s 20 fastest-growing economies are likely to be African.\nYet these gains won’t be distributed evenly across the continent. Many countries are too unstable, underdeveloped, or corrupt to attract foreign capital and will likely stay trapped in stagnation. But the ones that attract sustained outside investment and cultivate their domestic economies could see tremendous growth—and have a chance to follow the industrialization models that turned Singapore, South Korea, and Taiwan into leading markets in the twentieth century. Those African countries that undertake sustained reforms might prosper long enough to provide vast new opportunities for their people and accrue real geopolitical power.\nAFTER AID\nAfrica remains a relatively small player in the global economy. It makes up about 20 percent of the world’s population but accounts for just three percent of GDP and three percent of global trade. Over the past quarter century, foreign direct investment across sub-Saharan Africa has remained relatively flat—around two to three percent as a share of GDP—and most of it has gone to extracting oil, diamonds, and gold and other minerals.\nBut certain countries and regions are growing quickly. Take southern Africa, which has relatively good interstate infrastructure and low barriers to trade, although many nontariff barriers still exist. Twelve countries in southern Africa have a power pool that connects their grids and allows them to buy and sell electricity among one another, leading to greater efficiency and reliability. The region is also home to the world’s oldest running customs union—made up of Botswana, Eswatini, Lesotho, Namibia, and South Africa. The five countries coordinate trade policy, share customs revenue, and implement a common external tariff. Mature freight and logistics networks increasingly connect the mineral belts in the continent’s southern center to ports on both African coasts. These institutions do not fully eliminate the difficulties of doing business across borders, but they allow investors to think in terms of regional rather than merely national markets. Reforms and efforts to connect are paying off in this part of the continent: Botswana and Zambia are set to grow by 4.7 and 4.3 percent this year, respectively.\nFurther north, Nigeria, with its vast entrepreneurial ecosystem and growing interest from investors, gives West Africa huge market scale. Kenya, Tanzania, and Uganda form an increasingly valuable East African commercial core. Some smaller African states are thriving: the island nation of Mauritius has developed into an international financial center. Botswana and Rwanda have attracted investment by providing stable policymaking environments, making up for limited scale.\nThe continent as a whole also has enormous opportunities on its horizon. Favorable demography gives many African countries a potential advantage. As advanced economies grow old in the coming decades, African countries will see much of their population mature into working age. As the demographer Nicholas Eberstadt noted in these pages in 2024, “By 2040, national cohorts of people between the ages of 15 and 49 will decrease more or less everywhere outside sub-Saharan Africa.” Urbanization presents a similar opportunity. According to the Organization for Economic Cooperation and Development, nearly two out of every three Africans will be living in cities by 2050. A richer, more urban African population would attract investment well beyond the extractive industries that have typically dominated foreign capital inflows; Africa’s young population has already made enormous advances in areas such as financial technology and the democratization of financial services.\n Foreign governments are racing to gain access to African harbors.\nAfrica also still has many of the resources that the rest of the world needs. Sub-Saharan Africa is home to 30 percent of the known reserves of critical minerals. China recognized the strategic significance of these resources early and has spent decades building a near monopoly over the critical mineral industry in many parts of Africa. Nearly all sub-Saharan African countries have signed on to Beijing’s Belt and Road Initiative, the bigge", "translation_ja": "", "vocab": [{"word": "humanitarian", "definition": "人道的な、人命救助に関する。ここでは援助削減が人道的な観点から問題であることを指し、人間の福祉に関連する政策や行動を表す。"}, {"word": "stagnation", "definition": "停滞、経済成長の鈍化。発展が止まった状態を意味し、ビジネスや経済における進展の欠如を表す。"}, {"word": "geopolitical", "definition": "地政学的な、国家間の権力関係に基づく。地理的位置や資源が国家の政治力や国際的な影響力にどう関わるかを示す。"}, {"word": "extracting", "definition": "抽出する、採掘する。天然資源や鉱物を地中から採取すること、またはある物質から特定の成分を取り出すことを意味する。"}, {"word": "nontariff barriers", "definition": "非関税障壁、関税以外の貿易障壁。輸入品に対する規制や基準など、関税以外の方法で貿易を制限する手段を指す。"}]}, {"title_ja": "Russia’s Hybrid War Has Entered a Dangerous New Phase", "title_en": "Russia’s Hybrid War Has Entered a Dangerous New Phase", "summary_ja": "Julianne Smith, who represented the United States at NATO during the Biden administration, argues that Russian hybrid warfare in Europe is escalating quickly, and NATO is not doing enough to deter it. Putin is attempting to discourage support for Ukraine and undermine faith in Article 5, and NATO is", "summary_en": "Julianne Smith, who represented the United States at NATO during the Biden administration, argues that Russian hybrid warfare in Europe is escalating quickly, and NATO is not doing enough to deter it. Putin is attempting to discourage support for Ukraine and undermine faith in Article 5, and NATO is", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/russia/russias-hybrid-war-has-entered-dangerous-new-phase", "state_media": false, "category": "オピニオン", "full_text": "For the first few years of the war in Ukraine, Russia’s hybrid warfare attacks in Europe remained just below the threshold that might trigger a collective response. As the United States’ permanent representative to NATO from 2021 to 2024, I watched the campaign develop: undersea cables cut, incendiary devices hidden in cargo packages, and arson attacks on weapons factories and depots across Europe. To address the threat, allies reinforced critical infrastructure, increased patrols in the Baltic Sea, and expanded intelligence sharing. But NATO’s approach remained largely defensive: these attacks were scattered, small in scale, and just deniable enough that Moscow could wave them away.\nToday, that is no longer the case. In late July, a Russian cruise missile crashed into Polish territory. Days later, three explosive-laden drones were found at and near an airport in Leipzig, Germany. Two weeks after that, Romanian F-16s scrambled to intercept three Russian drones over Romanian airspace, and a Spanish jet shot down a fourth near the Moldovan border. If someone had described this state of affairs two years ago as where NATO would be now—drones over allied airspace, a Russian cruise missile in Polish territory, explosives at a German airport—without any meaningful collective response from the alliance, it would have sounded unbelievable.\nThere is little ambiguity about Russian President Vladimir Putin’s aims. These attacks are designed to fracture the alliance’s unity, test the strength of members’ commitment to Article 5—the principle that an attack on one member is an attack on all—and raise the cost of supporting Ukraine. Less expected, however, has been the speed with which his deniable campaign has become undeniable.\nNATO has not looked away. The alliance tracks these incidents, investigates them, and sometimes intercepts attacks. But a response built incident by incident is not deterrence, and Putin knows the difference. As long as each provocation costs Moscow nothing more than a downed drone, Putin has every reason to keep escalating. And every escalation in turn increases the risk that one of these incidents will end in catastrophic loss of life. Mobilizing collective action to impose costs is the best chance the alliance has of preventing such a scenario.\nMASK OFF\nFor Russia, hybrid tactics are far from a new tradecraft. As early as the 1920s and continuing throughout the Cold War, the Soviets relied on what they called “active measures”: the use of local proxies, front groups, and irregular forces to achieve political aims. Today, Putin follows essentially the same model, seeking to erode allies’ confidence in NATO’s Article 5 by relying on tactics that fall below the threshold of a conventional warfare and leave unaffected members hesitant to respond. Plausible deniability has always been a critical part of these operations. Whatever the method, whether it be severing undersea fiber-optic cables in the Baltic Sea, a coordinated cyberattack, or an explosion at a plant in eastern Europe that produces artillery shells for Ukraine, Russia is quick to deny its direct involvement. Often, it flips the script, accusing NATO members of “Russophobia” and directing blame at Ukrainian or rogue actors.\nNATO members have long been familiar with this Russian playbook. Most European members have experienced multiple hybrid attacks over the past two decades. But since its 2022 invasion of Ukraine, Russia has changed its strategy in two meaningful ways. First, it has significantly increased the frequency of attacks; during the first year of the war, the number of Russian incursions in Europe quadrupled, according to the Center for Strategic and International Studies. It has also diversified its tactics. In addition to familiar disinformation campaigns, airspace violations, and cyberattacks, actors linked to Moscow have sabotaged railways, placed incendiary packages on cargo planes, and paid criminal networks inside Europe to burn down weapons depots.\nBy early 2023, in response to these trends, NATO stepped up the seriousness and urgency of its discussions on Russian hybrid activity. The 2023 NATO summit’s communiqué, which sets out the alliance’s shared positions and priorities, stated that Russia had “intensified” its attacks against allies and mentioned Russia’s use of proxies for the first time. The alliance also rolled out an array of new initiatives to counter hybrid activity: heads of state adopted new goals for protecting critical infrastructure and supply chains from strategic shocks across alliance territory. They also agreed to establish the NATO Maritime Centre for the Security of Critical Undersea Infrastructure and the Virtual Cyber Incident Support Capability, a coordination platform to help members respond to cyberattacks. What was missing was any measure to impose costs on Russia. Although NATO condemned Moscow’s hybrid warfare, it was not prepared to talk explicitly about consequences, such as targeted", "translation_ja": "", "vocab": [{"word": "hybrid warfare", "definition": "従来の軍事戦闘と非軍事的な攻撃手段を組み合わせた戦争戦術。サイバー攻撃、破壊活動、情報操作など複数の方法を同時に用いる戦略を指す。"}, {"word": "deniable", "definition": "否定可能な、否認できる状態を意味する。政府が関与を否定したり責任を回避できるような行為や作戦に対して使用される。"}, {"word": "fracture", "definition": "同盟や団結を分裂させる、亀裂を入れるという意味の動詞。組織やグループの結束を弱める、内部分裂を引き起こす行為を指す。"}, {"word": "deterrence", "definition": "抑止力、報復の脅威によって相手の行動を防止する戦略。攻撃や違反行為に対して相応の代償があることを示すことで、相手の行動を思いとどまらせる効果。"}, {"word": "tradecraft", "definition": "特定の職業や分野における実践的な技術や方法論。特にスパイ活動や諜報機関が使用する秘密工作の技術や手法を意味する。"}]}, {"title_ja": "The New Red Sea Wars", "title_en": "The New Red Sea Wars", "summary_ja": "Conflicts in the Middle East and the Horn of Africa have become inseparable.", "summary_en": "Conflicts in the Middle East and the Horn of Africa have become inseparable.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/middle-east/new-red-sea-wars", "state_media": false, "category": "オピニオン", "full_text": "On June 3, U.S. Secretary of State Marco Rubio told the U.S. Congress that the fighting that had raged for three years in Sudan was now a “proxy war” and blamed Saudi Arabia and the United Arab Emirates (UAE) for frustrating American efforts to bring the conflict to an end. Rubio was saying out loud what many observers already knew: what started as a domestic power struggle has morphed into a wider regional war, drawing in outside powers and spilling across Sudan’s borders.\nThe spread of the conflict in Sudan is part of a larger geopolitical transformation. For much of the past century, policymakers have treated the Horn of Africa and the Arabian Peninsula as separate strategic regions divided by the Red Sea. That distinction is now evaporating. Wars on one side of the sea increasingly alter the military calculations on the other. This entanglement is only deepening in the wake of the United States’ and Israel’s decision in February to launch a war on Iran, driving a deeper wedge between Abu Dhabi and Riyadh (which were already at odds), weakening the American-anchored security order in the region, and underscoring the importance of securing the Red Sea for shipping.\nFor the past decade, the UAE has been the most aggressive outside player in the Horn of Africa, establishing ports and military bases, offering large financial packages to key allies, and involving itself extensively in Sudan’s civil war. But the recent war in Iran, along with the breakdown of the Emirati-Saudi security partnership in Yemen last December, made Riyadh less confident of Washington’s protection, more anxious about the UAE’s security ties to Israel, and more intent on controlling the Red Sea’s security picture. And so as Saudi Arabia has leaned into an alignment with Egypt, Turkey, and Pakistan, it has also brought that alignment to bear to strengthen key partnerships in the Horn. It is trying to counter factions in the Horn that are backed by the UAE or Israel even as it struggles to manage threats from Iran and its allies—including the Houthis, who have seized control of Yemen’s Red Sea coast.\nAt the same time, the risk of conflict is increasing between the Sudanese armed forces (SAF), backed by Saudi Arabia and its allies, and Ethiopia, an ally of the emirates, as well as the chance that another direct war could erupt between Ethiopia and Eritrea. A new war between Ethiopia and Eritrea on the Red Sea would likely turn into a regional conflict that overlaps with the one in Sudan. And it would not only be aggravated by the existing Emirati-Saudi rift—it might well deepen that divide.\nSome Middle Eastern governments once saw the Horn of Africa as a low-stakes theater in which they could compete for leverage at relatively little cost. But as wars in the Middle East and the Horn become inextricably linked, a single security sphere is coalescing. Unless leaders in both the Middle East and the Horn recognize how interconnected their security dilemmas have become, instability will continue to ricochet in both directions, and the overlapping conflicts and disputes will become harder to resolve.\nseparation of powers\nIn some respects, the growing entanglement between the Horn of Africa and the Middle East is a return to a historical norm. Over millennia, the sea connected present-day Djibouti, Eritrea, Ethiopia, and Yemen, and people, goods, and cultural trends moved regularly among them. Amharic, Ethiopia’s dominant language, and Tigrinya, widely spoken in Eritrea and northern Ethiopia, are both Semitic tongues. Christianity spread early to what is now northern Ethiopia, making it home to one of the world’s oldest Christi let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_en)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-10-08 00:28 JST";
  renderTabs();renderList();
})();
</script>
