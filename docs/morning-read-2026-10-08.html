s\".\nA cause of death was not announced.\nAbascal's death was received in Puerta del Sol with a big collective gasp, then followed by a minute of silence.\nIt is in this square in the centre of Madrid where thousands have been camping since Abascal's eviction last month to demand more affordable housing.\nOn Wednesday, it became the place to pay tribute to her.\nPeople lit dozens of candles around the square in a small improvised vigil that glowed with a warm light on a dry and warm autumn night.\nOther candles formed an altar to Abascal in front of the headquarters of the Community of Madrid government.\nMessages on cardboard banners next to the candles read \"it's not a death, it's a killing\", \"the fight will continue\" and \"Mari Carmen, the grandmother of the whole country\", among others.\nA few hundred people then took to the streets that connect Puerta del Sol with the Spanish Congress, just 500m away, in an improvised protest.\nDuring the march people chanted: \"We will not tolerate a single eviction more\" and \"the fight will continue, Mari Carmen is still alive\". There were other chants against fascism and against the police.\nThe police had set up barriers to block the march. There was not a big police presence, and there was the tension that protests sometimes have.\nMany protesters seemed to feel the police have been complicit in the evictions, as under court orders they have to remove tenants who have been served eviction notices.\nAfter a couple of hours, the chants near Congress gave way to another minute of silence. Then, a big collective shout of \"murderers\".\nWednesday night's march has finished, but the camping, already on its 12th night, will continue \"as long as necessary\" one of the protesters told the BBC.\nAbascal became a symbol for Spain's housing crisis following her eviction.\nHer father first rented the property in 1956 and she continued as the tenant after her parents died, during which time there was a cap on the rent.\nHowever, Urbagestión, which bought the property in 2018, increased the rent from €500 per month (£428; $572) to €2,650 (£2,280; $3,020).\nThe company later offered to reduce this to €1,650 - still €300 more than Abascal's monthly pension.\nThree previous attempts to evict her were blocked by the courts and the case has received increasing media attention.\nAnger over the situation grew, leading to protests and putting pressure on the coalition government to approve emergency housing legislation - but it was rejected in Congress last week.\nThat led to further protests, with tens of thousands of people taking to the streets in cities across the country over the weekend.\nReferring to the rejected bills, the Madrid Tenants' Union said: \"While a historic agreement was reached that would have allowed her to return to her home, this solution has come too late. An absolutely avoidable situation after a torturing process.\"\nIt said the events surrounding her eviction represented a turning point in the country's history, but added that the cost to get to this point had been \"too high\".\n\"Above all, we will fulfil what she always asked of us: 'fight, keep fighting for what is yours',\" it said.\nIn a video recorded from her hospital bed following her eviction, Maricarmen said: \"I haven't managed to defend my home, but I have fought so that others can learn to fight for what's theirs.\"\n\"All my love goes to Maricarmen's family and loved ones,\" Spanish Prime Minister Pedro Sánchez said. \"A hug as well to everyone who today feels this loss as their own.\"\nOpposition People's Party leader Alberto Núñez Feijóo also sent his condolences to Maricarmen's loved ones, as he said on X: \"No campaign, no parties, no self-interested exploitation. No more stones in the wall.\n\"In the face of a person's death, only respect is in order,\" he added.\nEarlier on Wednesday, unions had called a general strike to take place on 11 November, demanding housing reforms.\nThe public outcry over Abascal's situation has led to political turmoil in Spain.\nOn Monday Sánchez, who leads a leftist coali", "translation_ja": "", "vocab": [{"word": "eviction", "definition": "立ち退き、強制退去。賃貸住宅から借主を法的に立ち退かせる行為。"}, {"word": "rentierism", "definition": "レンティア主義、不労所得による搾取システム。投資や所有による利益追求だけを目的とする経済体制。"}, {"word": "tenants union", "definition": "借家人組合、借主の権利を守るための組織。労働組合と似た役割で住宅問題に取り組む。"}, {"word": "complicit", "definition": "共謀的な、共犯的な。意図的または認識しながら不正行為に加担している状態。"}, {"word": "improvised", "definition": "即興の、にわかに作られた。計画なしに急いで対応したもの。"}]}, {"title_ja": "Israelis mourn 7 October attack victims three years after deadly Hamas raid", "title_en": "Israelis mourn 7 October attack victims three years after deadly Hamas raid", "summary_ja": "Memorial events have taken place in Israel on the third anniversary of the Hamas-led attack that sparked the devastating Gaza war.", "summary_en": "Memorial events have taken place in Israel on the third anniversary of the Hamas-led attack that sparked the devastating Gaza war.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwkgj0g30m5jo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Israelis mourn 7 October attack victims three years after deadly Hamas raid\n- Published\nMemorial events have taken place in Israel on the third anniversary of the devastating Hamas-led attack there that sparked the war in Gaza.\nFamilies paid tribute to their loved ones at some of the sites where about 1,200 people were killed in the assault and 251 were taken hostage.\n\"The nation unites on this day in the longing for our dear ones,\" said Israeli Prime Minister Benjamin Netanyahu, who faced calls from protesters for an independent state inquiry into security failures that day.\nIn response to the attack, Israel launched a military offensive in Gaza which has killed more than 74,200 people, according to the Hamas-run health ministry, whose figures are seen as reliable by the UN.\nViolence has continued in Gaza despite a ceasefire agreed almost a year ago and living conditions for the 2.1 million people living there remain dire.\nOn Wednesday morning, bereaved families and survivors gathered at a memorial for the 378 people who were killed at the Nova dance festival in southern Israel on 7 October 2023.\nThe festival site was near Kibbutz Re'im and not far from the border with Gaza, from where Hamas-led gunmen launched their dawn attack.\nWitnesses have described how festival-goers were shot, sexually abused and tortured by gunmen during the raid.\nForty-four people were kidnapped, of whom 25 were brought back from Gaza alive.\nAhuva Yavin Mayze, whose 21-year-old daughter Adi was shot and killed at Nova, told the BBC what happened at the site was \"dystopic, unimaginable\".\n\"Today is a difficult day, not only for me but for a large part of the nation,\" said Shlomo Sharf, a former Israeli footballer, in comments reported by Channel 12.\nHe paid tribute to his granddaughter, May Naim, 24, who was also killed at the festival.\nFormer hostage Yarden Bibas, whose wife and two young sons were kidnapped from their home in Kibbutz Nir Oz and later killed in captivity in Gaza, was quoted by the Times of Israel as saying: \"Shiri, Ariel and Kfir. Sorry. Sorry that you are up there and I am here.\"\nCrowds also filed into the small cemetery at Kibbutz Kfar Aza, where 64 residents were killed and 19 were taken hostage on 7 October.\nZion Regev, a community leader, said most surviving residents had yet to return to their homes because of the trauma of what happened.\n\"This is the first time we are doing all the things here in the kibbutz,\" he told Reuters news agency. \"It's a very emotional day, it's a very difficult day for our community, three years after 7 October.\"\nA man who reportedly helped to fend off Hamas attackers at Kibbutz Magen praised IDF troops who \"fought so bravely\" during the raid.\nSpeaking to crowds at the national memorial event at Tel Aviv's Yarkon Park on Wednesday evening, Ido Yakir said Israel would remember everyone \"who knew that they had to give their lives in order to save others\".\nIn a statement released by his office on Wednesday afternoon, Netanyahu said he had lit a memorial candle commemorating every victim of 7 October.\n\"We will complete the mission: we have settled the score and will continue settling the score with all the murderers,\" he added.\nAt a ceremony on Monday marking the Jewish calendar's anniversary of the attack, the prime minister said Israel had killed 4,000 out of the 6,000 Palestinians who infiltrated Israel from Gaza that day.\nIn Tel Aviv's Dizengoff Square, Israeli anti-government protesters dyed the fountain red to mark the anniversary of the attack.\nThe fountain has been used as a memorial site for those killed, with pictures, flowers and messages laid around the basin wall.\nProtesters also briefly blocked one of the main highways in the city to hold a moment of silence on Wednesday morning.\nThey held banners that read, \"the people will remember their sons and daughters\", along with others that said \"a complete failure\" and \"guilty\" next to an image of Netanyahu.\nMany senior Israeli defence and security officials have resigned or been fired since the attack took place. But there has not been an independent commission of inquiry into Israel's worst security failure.\nThe prime minister has rejected any personal responsibility and has refused to establish a state inquiry led by Israel's Supreme Court, arguing recently that the country's judiciary would be biased against him.\nEinav Zangauker became an outspoken critic of the Netanyahu government while her son, Matan, was in captivity in Gaza. He was released last October as part of the ceasefire agreement.\n\"They're trying to make us forget what happened on 7 October,\" she told Army Radio. \"We won't forget, we will demand the truth.\"\nMemorial events were organised in other countries around the world, including in Germany, where the Jewish students' union held a vigil at Berlin's Brandenburg Gate.\nGerman Chancellor Friedrich Merz said the Hamas-led attack marked a \"profound rupture\".\n\"We commemorate the victims, we share their pain,\" he sa", "translation_ja": "", "vocab": [{"word": "devastating", "definition": "壊滅的な、甚大な被害をもたらす。深刻な悪影響や損失を表現する際に使用される。"}, {"word": "bereaved", "definition": "配偶者や家族など身近な人を失った状態を指す。特に死別した悲しみの中にある人々を表現する。"}, {"word": "tribute", "definition": "敬意や感謝の気持ちを示すための表現や行為。故人を偲ぶ際の献花や言葉などを指す。"}, {"word": "dire", "definition": "極めて深刻で危機的な状況。生活条件や環境が非常に悪い状態を表す。"}, {"word": "dystopic", "definition": "ユートピアの対概念で、理想と反対の暗く絶望的な状況。悪夢のような現実を描写する際に使用される。"}]}, {"title_ja": "Israelis demand accountability over 7 October failures three years after attacks", "title_en": "Israelis demand accountability over 7 October failures three years after attacks", "summary_ja": "Prime Minister Benjamin Netanyahu has refused to take any personal responsibility for what happened or order a state inquiry.", "summary_en": "Prime Minister Benjamin Netanyahu has refused to take any personal responsibility for what happened or order a state inquiry.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5zjx7xx3487o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Israelis demand accountability over 7 October failures three years after attacks\n- Published\nAs the sky began to lighten over Israel's border with Gaza on Wednesday, the people of Kfar Aza moved silently towards the armoury at the centre of the kibbutz.\nIt was there, shortly after 07:00 on 7 October 2023, that Hamas-led attackers killed half the community's 14-member civil defence squad. They were among 64 killed and 19 kidnapped from the community that day.\nThe pain of those attacks is still fresh here. But three years on, there are questions about who else should pay the price for Israel's security failure.\n\"I need my country to take responsibility,\" said Inbar Goldstein, whose brother and niece were killed, and four other relatives kidnapped from Kfar Aza.\nThe 7 October attack was the deadliest Israel had suffered since its creation in 1948. About 1,200 people were killed across southern Israel by gunmen who broke through the border fence and attacked communities there. Another 251 people were taken back to Gaza as hostages.\nThree years on from Israel's biggest security failure, there is still no independent state inquiry into how it was allowed to happen.\nAnd the man in charge at the time of that failure - Prime Minister Benjamin Netanyahu - is running for election again, with the same campaign promise: to be stronger and tougher than anyone else in protecting Israel from its enemies.\n\"Nobody investigated the roots [of the attack]. It didn't start or end on October 7th - it's a long process of abandonment,\" Goldstein said.\nAside from Hamas's responsibility for the attack itself, there are growing questions in Israel around what caused the country's intelligence failure, what information was passed to military and political leaders in the run-up to the attacks, and what Netanyahu himself knew.\nFor months beforehand, young female soldiers posted at bases along the Gaza border to watch for suspicious activity had warned their superiors about possible preparations for an attack.\nAmong them was Roni Eshel. She was killed with 14 other members of her unit when gunmen overran their base at Nahal Oz, just next to Kfar Aza.\n\"There are so many questions,\" her uncle Elad Levy told me. \"Were the Egyptians warning the prime minister? The Emiratis? Were there no other warnings Netanyahu ignored? We need to find out what happened – not just on the day, but the year before, and five years before that.\"\n\"The truth should be clear,\" he continued. \"If we don't inquire into this, it will happen again and again.\"\n- They were Israel's 'eyes on the border' - their warnings went unheard \n  - Published15 January 2024\nOver the past three years, there have been mounting reports of warnings being given to Netanyahu - by his own security chief, as well as by regional neighbours – which he denies.\nLast month, Israel's Haaretz newspaper published extracts from a new book, alleging that the leader of the United Arab Emirates had called Netanyahu 10 days before the attack to warn of Hamas plans for a major operation.\nNetanyahu's office has dismissed the report as \"an absolute lie\" and has said he will sue the newspaper.\nAmir Ohana, a member of Netanyahu's Likud party, said in a social media video last month that it was \"preposterous and absurd\" to suggest that Netanyahu could have known about the attack when the former Hamas leader in Gaza, Yahya Sinwar, had only told a handful of people.\nIsrael's prime minister, he said, had since reshaped the Middle East and did not give up, \"even when voices inside and outside Israel called on him to stop\".\nNetanyahu has blamed his own security chiefs for the failures that led to the 7 October attacks, accusing them of deliberately choosing not to wake him in the hours beforehand, for fear that he would order a massive deployment of the Israel Defense Forces (IDF) and escalate the situation.\n\"God forbid we wake up the prime minister and he says, 'Wake up the entire IDF immediately, scramble the air force!'\" he told Israel's right-wing Channel 14 television network.\n\"What would have happened if they had woken me? This would not have happened,\" he said, suggesting that his response would have better protected Israel from the attacks.\nYaakov Katz, a journalist and author of several books on Israel's defence, has written about the growing concerns over Hamas activity that emerged in the hours leading up to the assault.\nIn his book, While Israel Slept, he describes calls between senior military figures and intelligence chiefs in the early hours of the morning, the sudden recall of commanders from leave, and the dispatch of an elite intelligence unit to the border.\nHe told me their expectation was, at worst, a small, limited incursion by Hamas fighters.\n\"So why would [Netanyahu] order a massive pre-emptive strike by the IDF, if every security chief is telling him this is not what this is going to be? Waking him would not have made a difference.\"\nBut he said Netanyahu faced other questions about his failur", "translation_ja": "", "vocab": [{"word": "accountability", "definition": "責任を問われること、説明責任。政治家や組織が自らの行動や決定に対して責任を持ち、その結果について説明する義務を指す。"}, {"word": "armoury", "definition": "武器庫、兵器廠。銃火器や弾薬などの軍事用装備が保管・管理される施設のこと。"}, {"word": "intelligence failure", "definition": "情報機関の失敗。敵の意図や行動を事前に察知できず、国家安全保障が脅かされることを意味する。"}, {"word": "overran", "definition": "圧倒的な勢いで占領する、押し流す。軍事的に敵の防衛線を突破して支配下に置くことを指す。"}, {"word": "inquiry", "definition": "公式な調査、審問。事実を明らかにするために行われる組織的で詳細な調べのこと。"}]}, {"title_ja": "Burnham to hold security talks with German chancellor in Berlin", "title_en": "Burnham to hold security talks with German chancellor in Berlin", "summary_ja": "Downing Street said deeper co-operation in the face of rising hybrid threats from Russia would be high on the agenda during Burnham's first official visit to Germany.", "summary_en": "Downing Street said deeper co-operation in the face of rising hybrid threats from Russia would be high on the agenda during Burnham's first official visit to Germany.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmwyq34qexdzo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Burnham to hold security talks with German chancellor in Berlin\n- Published\nPrime Minister Andy Burnham will hold talks on tackling cyber-security threats and sabotage with German Chancellor Friedrich Merz on Thursday.\nDowning Street said deeper co-operation in the face of rising hybrid threats from Russia would be high on the agenda during Burnham's first official visit to Germany.\nIntelligence services in both countries have warned of rising threats, including last month when Germany accused Russia of launching a drone fitted with explosives at Leipzig/Halle Airport.\nThe Berlin talks come days after Burnham told the Labour Party's conference he wanted to set out options for a closer relationship with the EU later this year, including the prospect of eventually rejoining the bloc.\nA German government spokesman has said any future in-out referendum would be primarily a question for Britain, but that Berlin supports stronger ties between the UK and the EU.\nBurnham is set to be greeted with military honours at the German capital's Chancellery ahead of his first face-to-face meeting with the chancellor.\nOn Thursday, the two leaders will formally ratify the 2025 Kensington Treaty, a partnership committing both countries to tackle hostile activity through deeper cooperation on science, technology, defence, security and growth.\nSpeaking ahead of the visit, Burnham said the UK and Germany were \"joining forces to find, expose and disrupt\" threats.\nHe continued: \"Attacks on our infrastructure, our businesses and our democracies are not a distant threat.\n\"They reach into people's homes and workplaces, and they are designed to make us weaker and more divided.\"\nThe talks come during a period in which Merz's own political future has come under intense scrutiny.\nBurnham replaced Prime Minister Sir Keir Starmer in July after the former leader was forced out by his own MPs just two years after winning a landslide election victory.\nSimilarly, Merz has faced persistent rumours he could be replaced by his party due to his poor approval ratings and following setbacks in regional elections.\nAlthough the chancellor appears to have overcome an immediate crisis in his leadership, questions remain over his future.\nThe security talks also come in a week when questions have been raised about Germany's reliability as an intelligence partner, following the bombshell arrest of a former spy chief on suspicion of espionage.\nAugust Hanning has been accused of espionage, treason and obtaining classified information for a foreign power, the German Federal Prosecutor's Office says.\nHe ran the Federal Intelligence Service (BND) from 1998 to 2005 and has since been working as a private consultant.\n- Merz vows to keep coalition together for Germany's 'democratic future' \n  - Published21 September\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.", "translation_ja": "", "vocab": [{"word": "cyber-security", "definition": "サイバー攻撃から情報システムやデータを守る技術や対策のこと。デジタル時代の国家安全保障において最優先課題となっている。"}, {"word": "hybrid threats", "definition": "従来の軍事的脅威と非軍事的な攻撃（サイバー攻撃、偽情報など）を組み合わせた複合的な脅威。現代の安全保障の主要な課題である。"}, {"word": "ratify", "definition": "条約や協定を正式に批准・承認すること。国家間の合意を法的に有効にするための公式な手続きを指す。"}, {"word": "disrupt", "definition": "システムや組織の正常な動作を妨害・中断させること。テロ対策やサイバー防御の文脈では、脅威の活動を阻止することを意味する。"}, {"word": "espionage", "definition": "他国や競争相手のために秘密情報を盗んだり集めたりする行為。国家安全保障に関わる重大犯罪である。"}]}, {"title_ja": "Badenoch says Tories would scrap inheritance tax on family homes", "title_en": "Badenoch says Tories would scrap inheritance tax on family homes", "summary_ja": "Tory leader says her party is \"coming back\", as she aims to convince voters it has changed after 2024 election defeat.", "summary_en": "Tory leader says her party is \"coming back\", as she aims to convince voters it has changed after 2024 election defeat.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmn5vw05l0q3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Badenoch says Tories would scrap inheritance tax on family homes\n- Published\nConservative Party leader Kemi Badenoch has pledged to scrap inheritance tax (IHT) on family homes while also allowing couples to leave £1m tax-free, in her keynote speech at the party's conference in Birmingham.\nBadenoch added her ambition would be for a Conservative government to abolish IHT \"as soon as we can afford it\", but said she could not currently propose this due to spending commitments on defence, prisons and the economy.\nBadenoch also used her speech to try to make clear how the Tories differed to Labour and Reform UK.\nShe pitched them as the \"no-nonsense party\" compared to the Reform UK \"circus\" and accused Prime Minister Andy Burnham of wanting to \"live in the past\".\n- Tories united behind Badenoch - but party still needs to win over voters \n  - Published7 hours ago\n- Why Tories are talking about winning the next election \n  - Published1 day ago\n- What's in the Conservatives' inheritance tax plan and who benefits? \n  - Published7 hours ago\nRival parties hit back and said the proposals for IHT, which is levied on the value of someone's estate when they die, would prioritise support for wealthier people in the country.\nBadenoch arrived in Birmingham's Symphony Hall with a message to Conservative Party members that they face a \"battle for the soul of the this nation\".\nShe argued her party is \"renewed\" and \"coming back\" as she continued efforts to convince voters that it has changed following an historic defeat at the 2024 general election.\nIn a nod to those who have defected to Nigel Farage's party, Badenoch said: \"The Conservatives have had an export boom of drama queens going to Reform.\n\"This party is now the no drama party, we are the no-nonsense party.\"\nWith the party trailing Labour and Reform in the polls, Badenoch acknowledged that people are \"looking through the shop window\", they \"like what they see\" but \"not enough of them are buying yet, we need to fix that\".\nHer inspiration for how to revive a long-standing brand was Marks and Spencer (M&S), saying they have \"adapted their style for today's market and people are flooding back\".\nBadenoch added: \"Just like M&S, we must learn from our mistakes, win back trust and make people feel good about our party again.\"\nOne of the biggest responses in the room from members came as Badenoch made clear she did not want to do an election deal with Reform.\nShe described many Reform voters as \"our people\", adding: \"We let them down and we want them to come back home.\"\nFollowing a section of the speech mocking some of Reform's senior figures, Badenoch said: \"To those who say 'unite the right', we are not uniting with that.\n\"People deserve better than that and we are going to give them better than that. Character, conduct, and standards matter.\"\nShe also said she did not want to live in a country run by people who \"debate whether my mixed-race children are English\".\nIn one of many jibes aimed at Burnham, Badenoch labelled him a \"Paddington Bear prime minister\" who was \"hoping that the problems will just go away\".\nIn the days ahead of Wednesday's speech, there was widespread speculation that Badenoch would announce changes to IHT.\nAs the opposition leader neared the end of her 66-minute speech, she said IHT was \"supposed to be a tax on the super wealthy\" but it is \"now a tax on ordinary middle-class families in every corner of our country\".\nShe said: \"The next Conservative government will legislate so nobody will ever pay inheritance tax on their family home.\n\"On top of that, couples would be able to leave an additional £1m tax-free and these changes mean every inheritance tax bill will be cut and the number of families paying inheritance tax will fall by more than half.\"\nThe Conservatives have estimated the policy would cost around £6bn a year and believe they have identified £71bn of savings that can be made to government spending, including welfare cuts.\nUnder the current rules, estates worth more than £325,000, or £500,000 if a home is left to children or grandchildren, can face a 40% tax rate on assets above the threshold.\nMarried or civil partners can also transfer assets between each other.\nIn 2023-24, 4.72% of UK deaths resulted in an IHT charge and raised around £7bn for the government.\nBadenoch also said her \"ambition is to abolish inheritance tax altogether, as soon as we can afford it\".\nLabour Party chairwoman Bridget Phillipson said: \"The Tories haven't changed.\n\"Kemi Badenoch has shown that the Tories' choice is to do nothing to help ordinary families struggling with the cost of social care, prioritising the wealthiest instead.\"\nReform UK economy spokesman Robert Jenrick said Badenoch had \"chickened out of doing anything big\" and is \"for the 2%\".\nThe former Tory MP said: \"While the Tory Party is offering handouts to multi-millionaires, Reform will give everyone a £500 tax cut by raising the tax-free personal allowance to £15,000.\n\"The Tory Party is looking after its o", "translation_ja": "", "vocab": [{"word": "pledged", "definition": "公式に約束する、誓約する。政治家や団体が将来の政策や行動を正式に約束することを意味します。"}, {"word": "levied", "definition": "税金や料金を徴収する、課す。政府が国民に対して法的に課税することを指します。"}, {"word": "defected", "definition": "所属していた政党や組織から離脱する、背く。政治的な立場の変更を意味します。"}, {"word": "trailing", "definition": "後ろに位置する、遅れている。競争や選挙で相手より劣った状態にあることを示します。"}, {"word": "revive", "definition": "復活させる、再生させる。衰退したブランドやビジネスを新たに活性化させることを意味します。"}]}, {"title_ja": "Family tribute to 'kind and loving' GP found dead at home", "title_en": "Family tribute to 'kind and loving' GP found dead at home", "summary_ja": "Hannah Cain's family say they have been \"devastated\" by her death on Sunday.", "summary_en": "Hannah Cain's family say they have been \"devastated\" by her death on Sunday.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cmewexlqyj2zo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Family tribute to 'kind and loving' GP found dead at home\n- Published\nThe family of a GP who was found dead at her home say they have been \"devastated\" by her death.\nPolice discovered the body of Hannah Cain, known to her patients as Dr Hannah Terry, at her home in Dersingham, Norfolk, on Sunday morning.\n\"She was kind, generous and loving; a beloved mother, daughter, sister, auntie, daughter-in-law and friend,\" the 45-year-old's family said in a statement.\nHer husband, Mark Cain, 45, of Fern Hill in Dersingham, appeared before magistrates in Norwich earlier, accused of her murder.\nHe did not enter a plea during the hearing and will return before a judge on Thursday.\n\"We are devastated by the loss of our beautiful Hannah,\" the family said.\nThey added: \"We are incredibly proud of the woman she was and of the great care she took of all her patients who knew her as Dr Terry.\n\"We would ask people to respect our privacy at this difficult time.\"\nHannah Cain was listed as a member of the practice team at Grimston Medical Centre, which reopened on Wednesday after two days of closure.\nShe also served in a pool of doctors who were regularly on call for members of the Royal Family, The Sun newspaper reported.\nDersingham is on the edge of the royal Sandringham estate in west Norfolk, while Grimston is to the south.\nSpeaking at Norwich Magistrates' Court earlier, prosecutor Jacqui Hanlon said paramedics were called to Hannah Cain's home, on Fern Hill, at 02:25 BST on Sunday.\nThe GP was \"found in an upstairs bedroom not breathing, not conscious\", she said.\nHanlon said a post-mortem examination noted a \"blunt force injury\" to the right side of Hannah Cain's head, as well as an injury \"that could be suggestive of compression of the neck\".\nDistrict judge Matthew Bone remanded Mark Cain in custody to appear at King's Lynn Crown Court on Thursday.\nAfter reopening on Wednesday, Grimston Medical Centre said it would not be commenting \"on the circumstances surrounding the tragic death\" of Hannah Cain.", "translation_ja": "", "vocab": [{"word": "devastated", "definition": "深刻なショックを受けた、非常に悲しい状態。感情的に大きなダメージを受けたことを表す。"}, {"word": "prosecutor", "definition": "検察官、公訴を提起する法的立場の人物。刑事事件で国家側を代表する。"}, {"word": "post-mortem examination", "definition": "死後検査、死因を特定するために遺体に行われる医学的検査。autopsy（解剖）とも呼ばれる。"}, {"word": "remanded", "definition": "被告人を再度拘束命令される、保釈なしで留置される。法廷が被告を監禁状態に置くこと。"}, {"word": "blunt force injury", "definition": "鈍的外傷、鋭くない物体による損傷。切り傷ではなく打撲や打撲傷を指す医学用語。"}]}, {"title_ja": "Christa Pike 'angry and confused' after botched execution", "title_en": "Christa Pike 'angry and confused' after botched execution", "summary_ja": "Pike's lawyers have said she was very aware of Tennessee's failed execution effort. A judge has ordered state officials to preserve all evidence from the botched execution.", "summary_en": "Pike's lawyers have said she was very aware of Tennessee's failed execution effort. A judge has ordered state officials to preserve all evidence from the botched execution.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/christa-pike-angry-and-confused-after-botched-execution/a-79586250?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Christa Pike 'angry and confused' after botched execution\nOctober 7, 2026\nA US judge told the state of Tennessee to preserve all evidence related to the failed attempt to execute Christa Pike, whom lawyers say is \"angry and confused\" after waking up in hospital nearly a week after the ordeal.\nPike, who was sentenced to death for torturing and killing classmate Colleen Slemmer in 1995, survived despite being given two lethal doses of pentobarbital, a lethal injection drug.\nWhat do we know about Christa Pike's current state?\nOne of her attorneys spoke about the 50-year-old's state after the failed execution.\n\"She is angry and confused about everything right now,\" Randy Spivey said during a news conference, adding Pike is \"very aware\" of what was done to her.\n\"She cannot move either of her arms, both of her arms and hands are tremendously swollen, and we do not know what, if any, function she will regain in her arms,\" Spivey said, adding that \"there's a long road ahead\" for her recovery.\nPike is the only person known to have survived after receiving lethal injection drugs, according to the Death Penalty Information Center.\nLuke Ihnen, another lawyer for Pike, said that \"medical staff have asked that the shackles be removed and have been denied that request.\"\nHer lawyers continue to demand that Tennessee Governor Bill Lee commute Pike's sentence to life in prison and never reattempt her execution. The Republican governor had denied a clemency appeal two days before the failed execution.\nPike's recovery period unclear\nExperts say it is possible that the failed execution was due to a problem with the IV line that caused the injection to pool in her tissue rather than enter her bloodstream.\n\"Apparently at no point did any member of the execution team realize that the IV lines were not correctly placed or that the veins had blown,\" her attorneys wrote in their court filing.\nPike's arms were burned and blistered due to the injection, according to her legal team, who are demanding that the prison authority holds all information from the attempted execution, including needles and execution logs.\nIt is not yet clear how Pike's recovery might unfold and whether she will be subjected to another execution attempt.\nEdited by: Rana Taha\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "botched", "definition": "失敗した、やり損なった。計画や実行が不完全または不正確に行われたことを意味する。医療や手術の文脈ではしばしば深刻な結果をもたらす。"}, {"word": "ordeal", "definition": "非常に困難または苦痛に満ちた経験。辛く耐え難い試練や出来事を指す。"}, {"word": "commute", "definition": "（刑罰を）減刑する、軽減する。死刑などの厳しい刑罰をより軽い刑罰に変更することを意味する。"}, {"word": "clemency", "definition": "寛容、情け。特に司法の文脈では、死刑囚や受刑者に対する刑罰の免除または軽減を指す。"}]}, {"title_ja": "As US midterm elections loom, Trump's campaign tactics are becoming increasingly unusual, and expensive", "title_en": "As US midterm elections loom, Trump's campaign tactics are becoming increasingly unusual, and expensive", "summary_ja": "Despite not being on the ballot, Trump is campaigning hard ahead of the upcoming midterm elections. His tactics and promises have mostly been at the expense of US taypayers. Experts say some might violate federal law.", "summary_en": "Despite not being on the ballot, Trump is campaigning hard ahead of the upcoming midterm elections. His tactics and promises have mostly been at the expense of US taypayers. Experts say some might violate federal law.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/as-us-midterm-elections-loom-trump-s-campaign-tactics-are-becoming-increasingly-unusual-and-expensive/a-79585673?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "US midterms: Is Trump campaigning at taxpayers' expense?\nOctober 7, 2026\nIt's neither a joke nor fake news but a real report from earlier this week: Donald Trump has backed down. On Monday, the US president announced that a series of advertisements aired in September promoting him and his administration would no longer be funded with taxpayer money.\n\"The radical Left is upset with the fact that I am taking ads, which I consider to be a positive promotion for our great USA, and paying for them with USA money,\" Trump wrote on his platform Truth Social.\nHe went on to claim that funding partisan ads with public money was a \"rather standard thing to do,\" before adding that future ads would be paid with money raised from donations.\nThe ads themselves have caused some controversy in the United States. They ran in September between popular shows such as Saturday Night Live and football games, marked with the line: \"paid for by the US government\" — that is, paid with tax dollars.\nThe commercials showed scenes such as when US troops captured Venezuelan President Nicolas Maduro earlier this year but they mostly consisted of images and videos of Trump himself, along with combative messages that he would \"expel the warmongers\" or \"throw off the sick political class,\" and ensure that the US did not become a communist state.\nPublic funds for personal praise\nPolitical opponents and a series of NGOs responded to the campaign with sharp criticism. Not only does US law prohibit the use of taypayer funds for political advertisements, but the ads also appeared shortly before the midterms — elections held near the midpoint of a president's four-year term.\nOn Tuesday, the US broadcasting network CBS reported that, according to contracting records, the US Department of Homeland Security had paid an agency $20 million (€17.9 million) for a \"national media campaign.\"\nThe \"rather standard\" practice that Trump referred to actually applies to public service announcements, but this is not what the campaign ads are, argued the US non-profit consumer advocacy group Public Citizen.\n\"Federal law explicitly prohibits using appropriated public funds for government propaganda, self-aggrandizement, or partisan political advertising,\" the organization wrote in a public complaint to the Federal Communications Commission (FCC) .\"Yet, that is exactly the nature of Trump's recent campaign ads.\"\nIndependent experts have also voiced concerns. Patrick Malone, a professor in the department of Public Administration and Policy at American University in Washington DC, said the timing of the videos was problematic.\n\"You're not supposed to use taxpayer dollars to pay for anything that's campaign-related,\" he told DW. \"Technically, [Trump] is not campaigning. He's not saying 'Vote for me!' The thing that's created the challenge here is the timing. Weeks before the midterms, this is a real big issue.\"\nWill the Republicans keep their majority after midterms?\nVoters do not choose presidents in the midterm elections but members of Congres, which comprises the Senate and the House of Representatives and is the legislative branch of the federal government. On November 3, those eligible to vote will cast their ballots for all the seats in the House of Representatives, and roughly a third of the seats in the Senate. Some states will also be choosing governors.\nRepublicans have not been faring well in recent polls, which may be why Trump has been trying to promote his party's achievements. The Republicans currently hold a majority in both houses, with 53 of 100 seats in the Senate, and 219 of 435 seats in the House of Representatives. This has enabled Trump to pass a large number of his proposals fairly easily.\nBut a Reuters/Ipsos poll released on Monday indicates that this could soon change. \"Voters age 50 or older preferred Trump's party over the Democratic Party by just 2 percentage points — 44% to 42% — compared to an 8-point Republican advantage in December,\" it found. This age bracket \"is particularly important for midterm elections, when older Americans historically have made up large shares of the electorate.\"\nMeanwhile, among voters under the age of 50, \"Democrats led by 18 points,\" the survey showed.\nThe poll also found that opinions on Trump himself were low, with \"32% of Americans giving a thumbs up to Trump's presidency.\" This level of approval, the study highlighted, was unchanged from an earlier poll \"that saw the leader's rating at the lowest of his political career.\"\nRepublicans shy away from Trump's support\nThis could also be one of the reasons why Republican candidates do not seem so keen on making public appearances with the president, usually a highlight of a campaign trail.\nMany US citizens associate Trump with high living costs, or the war with Iran, which has dragged on for over half a year now.\nOne Republican operative told the news website Politico on condition of anonymity that if the the president were to visit a battleground state — where ", "translation_ja": "", "vocab": [{"word": "partisan", "definition": "特定の政党や派閥に偏った、または支持する立場を示す。政治的に一方の側に味方する性質を持つ。"}, {"word": "appropriated", "definition": "公式に割り当てられた、または公費として確保された。特に政府予算から特定の目的のために配分されたお金を指す。"}, {"word": "self-aggrandizement", "definition": "自分自身の重要性や権力を過度に高めようとする行為。自己賞賛や自己宣伝を通じて自分を大きく見せようとすること。"}, {"word": "contracting records", "definition": "契約に関する公式な記録や文書。政府機関や企業が交わした契約の詳細が記載された公開情報。"}, {"word": "propagand", "definition": "特定の考えや見方を広めるために意図的に流す情報や宣伝。真実性よりも説得力に重点を置いたメッセージ。"}]}, {"title_ja": "Evicted Spanish pensioner who sparked housing protests has died, Madrid tenant union says", "title_en": "Evicted Spanish pensioner who sparked housing protests has died, Madrid tenant union says", "summary_ja": "Maricarmen ⁠Abascal, the octogenarian woman whose eviction set off housing protests across Spain, has died, a tenants' union in Madrid has said. Unions are now calling for a nationwide general strike on November 11.", "summary_en": "Maricarmen ⁠Abascal, the octogenarian woman whose eviction set off housing protests across Spain, has died, a tenants' union in Madrid has said. Unions are now calling for a nationwide general strike on November 11.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/evicted-spanish-pensioner-who-sparked-housing-protests-has-died-madrid-tenant-union-says/a-78184386?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Evicted Spanish woman who sparked housing protests has died\nOctober 7, 2026\nMaricarmen Abascal, the 87-year-old woman at the center of the nationwide protests in Spain due to her eviction from her Madrid home, has died, the local tenants' union said.\n\"We are sorry to announce that Maricarmen passed away today,\" the Madrid Tenants' Union said in a statement, adding that Abascal's cause marked \"a turning point in the history of this country.\"\nWho is Abascal and how did she spark Spain's protests?\nAbascal was evicted from the home where she lived her whole life on a stretcher after the company owning the apartment drastically increased the rent.\nShe had been hospitalized after the eviction took place due to exhaustion as an agreement with her home's owners was reached.\nThe Madrid Tenants' Union said the solution came \"too late,\" labeling the ordeal \"totally avoidable\" and \"torturous\" for the 87-year-old.\nPrime Minister Pedro Sanchez sent his condolences to Abascal's family after learning of her death.\n\"I send hugs to all of those who mourn this loss as if it was their own,\" Sanchez posted on his X account.\nVoicing his sadness over Abascal's death, Spanish Minister for Territorial Policy Angel Victor Torres said she symbolized the plight of many people struggling with the country's housing crisis.\nSpain's unions call for general strike\nSpain's trade unions called on Wednesday for a nationwide general strike on November 11 over housing issues.\nThe UGT and CCOO unions urged the population to \"mobilize for better salaries, for decent housing and for price controls in the face of inflation that undermines our purchasing power.\"\nThe strike \"is the response to the insatiable real estate greed that speculates with one of the public's main rights, making access to a decent home practically impossible,\", they said in a statement.\nThe nationwide protests triggered by Abascal's eviction and lawmakers' rejection of housing reforms intended to help tenants led Sanchez to call for early elections on November 29.\nSanchez, of the Socialist Party, is looking for a shift in the public narrative after his government's handling of the migrant crisis in Ceuta, as well as alleged corruption among his party's ranks.\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.\nEdited by: Sean Sinicם", "translation_ja": "", "vocab": [{"word": "eviction", "definition": "強制退去のこと。家主または所有者が法的手段を通じて住人を住居から追い出すプロセスを指します。"}, {"word": "drastic", "definition": "劇的で極端な変化や措置を意味する形容詞。この記事では家賃が大幅に値上げされたことを表現しています。"}, {"word": "ordeal", "definition": "苦しい経験や試練のこと。困難で辛い状況を指す名詞として使われます。"}, {"word": "insatiable", "definition": "満足できない、飽くことのない状態を表す形容詞。不動産業者の利益追求の姿勢が尽きることのない貪欲さであることを強調しています。"}, {"word": "speculate", "definition": "投機的な目的で資産を買売りすること。この文脈では、利益を目的に不動産を扱う行為を指しています。"}]}, {"title_ja": "What Jane Doe told Cornell hearing panel about alleged 2024 gang rape", "title_en": "What Jane Doe told Cornell hearing panel about alleged 2024 gang rape", "summary_ja": "Seven months after the Cornell student known as Jane Doe said she was gang raped in a frat house, she gave her account of the incident to a hearing panel, records show.", "summary_en": "Seven months after the Cornell student known as Jane Doe said she was gang raped in a frat house, she gave her account of the incident to a hearing panel, records show.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/jane-doe-told-cornell-hearing-panel-alleged-2024/story?id=137062506", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "LIVE:  ABC News Live", "title_en": "LIVE:  ABC News Live", "summary_ja": "24/7 coverage of breaking news and live events", "summary_en": "24/7 coverage of breaking news and live events", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Hegseth greets USS Abraham Lincoln near the end of record long deployment", "title_en": "Hegseth greets USS Abraham Lincoln near the end of record long deployment", "summary_ja": "USS Lincoln carrier strike group will return to its homeport of San Diego on Thursday, concluding a 10-month deployment where it played a key role in the war with Iran.", "summary_en": "USS Lincoln carrier strike group will return to its homeport of San Diego on Thursday, concluding a 10-month deployment where it played a key role in the war with Iran.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/hegseth-greets-uss-abraham-lincoln-end-record-long/story?id=137067054", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Kenya confirms first Ebola case as virus ‘surges’ in DR Congo province", "title_en": "Kenya confirms first Ebola case as virus ‘surges’ in DR Congo province", "summary_ja": "Health minister says 28 contacts identified after death of citizen who arrived from DRC on Saturday Kenya has reported its first-ever Ebola death, the health minister announced on Tuesday, as the disease continues to spread rapidly through the north-east of the Democratic Republic of Congo (DRC), wh", "summary_en": "Health minister says 28 contacts identified after death of citizen who arrived from DRC on Saturday Kenya has reported its first-ever Ebola death, the health minister announced on Tuesday, as the disease continues to spread rapidly through the north-east of the Democratic Republic of Congo (DRC), wh", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/oct/06/kenya-first-ebola-case-death-drc", "state_media": false, "category": "政治", "full_text": "Kenya has reported its first-ever Ebola death, the health minister announced on Tuesday, as the disease continues to spread rapidly through the north-east of the Democratic Republic of Congo (DRC), where the outbreak was announced in May.\nThis is the 17th outbreak of the highly infectious, often deadly disease in the DRC. As of 2 October, 4,082 people had died out of 8,463 confirmed cases in the country since the emergence of the Bundibugyo strain of the Ebola virus, for which there is still no vaccine nor specific treatment.\nA Kenyan man who had been living in the DRC for seven years died after returning to Kenya, the Kenyan health minister Aden Duale told reporters.\nThe man, who has not been named, had been treated in the DRC after falling ill about a month ago. He then travelled overland to the Ugandan capital, Kampala, before flying to Nairobi on 3 October.\nKenya has previously never reported a case of Ebola, but neighbouring Uganda recorded 20 – almost all people who had travelled from the DRC – and two deaths, before being declared Ebola-free in August.\nDuale said the man was taken by a relative and a friend from Nairobi’s international airport to Nairobi hospital, where he was immediately isolated, suffering from “fever, chills, intense fatigue, weakness, muscle pain, painful swallowing, sore throat and bleeding under the skin at the injection sites”.\nHe said the man was subsequently screened and confirmed positive for the virus, but “regrettably passed on last night at around 1130” in the evening (2030 GMT).\nDuale said officials had listed 28 contacts of the deceased, including family members and healthcare workers, but that so far “only one test has turned positive and is the one that we have just discussed”.\nHe added that authorities were looking for another 23 passengers and four crew members who were on the same flight with the man and that “arrangements” for quarantine for those at risk had been prepared. “I wish to assure the public not to panic, as all systems are in place to mitigate the spread of the disease,” he said.\nDuale said a “safe and dignified burial” of the man had been planned for later in the day, in line with public health standards, but did not give further details.\nKenyans reacted furiously to government plans earlier this year to allow the US to set up an Ebola facility at Laikipia airbase, about 125 miles from Nairobi.\nAfter starting in the DRC’s north-eastern Ituri province, the current outbreak has spread to seven provinces in the country’s north and east.\nThe response to the virus in the vast central African country has been hindered by instability, including clashes between armed groups, mistrust of authorities – which has led to violence against health workers and other officials – and a lack of resources amid huge cuts in international aid.\nThe medical charity Médecins Sans Frontières warned on Monday of an “alarming surge” in cases in eastern North Kivu province, which borders Uganda. The province now accounts for 40% of all new Ebola cases, compared with 24% at the end of August, the NGO said.\n“It is like fighting a megafire,” said Stephanie Hoffmann, coordinator at MSF’s Ebola treatment centre in the city of Butembo. “Multiple outbreaks are developing at the same time, with varying intensity and in different locations.”\nThe wider Butembo health zone is home to around 2 million people and only has four Ebola treatment centres, two of which only opened recently, MSF said.\nHoffman said: “Because there are not enough beds available, we are sometimes forced to refer confirmed Ebola patients elsewhere, despite the significant risk this poses to the wider community. In addition, standards of care in some peripheral facilities do not always meet the requirements for Ebola treatment.”\nNorth Kivu is particularly affected by conflict, with 134 violent incidents there in the past month, according to tracking group Armed Conflict Location and Event Data, more than any other province.\nAgence France-Presse contributed to this report", "translation_ja": "", "vocab": [{"word": "emergence", "definition": "新たに現れること、出現。ここでは病気や新しい株が初めて現れることを指す。"}, {"word": "screened", "definition": "検査される、審査される。医療文脈では病気や異常がないか調べられることを意味する。"}, {"word": "mitigate", "definition": "緩和する、軽減する。被害や問題の程度を減らすための対策を講じることを指す。"}, {"word": "dignified", "definition": "尊厳のある、高潔な。人格や扱いに対して尊重と敬意が含まれていることを表す。"}, {"word": "quarantine", "definition": "隔離、検疫。感染症の拡大を防ぐため、人や物を一定期間隔離することを意味する。"}]}, {"title_ja": "Tigray rebel groups ‘forcibly recruiting boys as young as 15’ as fighting spreads", "title_en": "Tigray rebel groups ‘forcibly recruiting boys as young as 15’ as fighting spreads", "summary_ja": "Civilians try to flee as men and boys rounded up on streets by new alliance as Ethiopia conflict erupts again As renewed fighting has threatened a fresh humanitarian crisis in the northern region of Ethiopia, reports are emerging that a new alliance of armed groups in Tigray has been forcibly recrui", "summary_en": "Civilians try to flee as men and boys rounded up on streets by new alliance as Ethiopia conflict erupts again As renewed fighting has threatened a fresh humanitarian crisis in the northern region of Ethiopia, reports are emerging that a new alliance of armed groups in Tigray has been forcibly recrui", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/06/ethiopia-tigray-conflict-tplf-rebels-forcibly-recruit-boys-war-crimes", "state_media": false, "category": "政治", "full_text": "As renewed fighting has threatened a fresh humanitarian crisis in the northern region of Ethiopia, reports are emerging that a new alliance of armed groups in Tigray has been forcibly recruiting men and boys to its ranks.\nRenewed conflict erupted on 23 September between Ethiopia’s federal government and the Tigray People’s Liberation Front (TPLF), which rules the region, shattering the fragile Pretoria peace agreement signed between the two sides in November 2022.\nThe latest fighting started after months of escalating tensions when the TPLF launched an attack in what it claims was a response to drone strikes by the federal government.\nWitnesses who spoke to the Guardian described a broad campaign of forced recruitment in Tigray, targeting men and boys between the ages of 15 and 65.\nThe Eritrean Defence Forces and Amhara militias, which committed war crimes and crimes against humanity during the 2020-22 conflict, have switched allegiance and are now fighting in support of the TPLF.\nAlong with this new alliance, testimonies of forced recruitment, child soldiers and fresh humanitarian crises are emerging out of the already battered region.\nGezu*, 34, who fought with the Tigrayan forces in the 2020-22 war, lost many of his friends on the battlefield and was grateful to survive the deadly conflict. He was planning to start a family when he received a call from the TPLF authorities to join their armed group after the latest outbreak of hostilities.\n“I refused to join the war,” he said. “I responded to them to kill me rather than ever force me back to the horrors of the battlefield.\n“When they saw no one would join their army willingly, and people fleeing to the capital city, they started rounding up people from the streets. I didn’t want to leave my home town until things started getting worse.”\nIn the past few months, Tigrayans with the means to leave have been heading for the capital, Addis Ababa, fearing that war was coming. But on 23 September, Ethiopian Airlines suspended flights to and from the Tigray region, stranding many people, after Tigrayan forces seized the airport in Mekelle, the capital of Tigray region.\nSolomon*, a 52-year-old man who was able to flee to Addis Ababa, said: “The main targets are those between the ages of 15 and 40. I have seen the armed group of the TPLF rounding up people as young as 15 and 16 at gunpoint from the streets and public transportation areas.\n“I know parents who tried to save their children by showing medical certificates. The officers don’t care whatever internal disease you have; they forcefully recruit anyone whose hands, eyes and feet work.”\nEphrem, 40, is a father of three who, fearing conscription, was planning to leave the region weeks before the fresh fighting erupted. “Every time I go outside the house, my wife and the kids are anxious. The kids cry fearing that I will be rounded up from the street.\n“People who have money protect themselves and their children from the forced recruitment by bribing the officers. It is devastating; no one wants to join the war,” he said.\nThe Tigray region has been under siege for the past week, when citizens’ bank accounts were abruptly frozen by the federal government, leaving people unable to withdraw their money. The banks have since reopened with a daily withdrawal limit of 2,000 birr (£9) and with long queues forming outside.\nNegus*, an elderly man in Mekelle, said: “We don’t know for how long the siege and the war are going to stay. A daily withdrawal limit of 2,000 birr can hardly afford to buy the skyrocketing food prices. It is impossible to leave this embattled region. There is no way for relatives outside to send medicine or cash. I am just hoping it all ends soon.”\nInternet and phone communications were also cut off on the orders of the TPLF until this week, leaving families desperate for news of relatives in the region.\nMeanwhile, the Ethiopian government has been accused of carrying out indiscriminate drone airstrikes and there have been reports of attacks by the opposition forces coming close to Addis Ababa.\nAn estimated 300,000 to 800,000 civilians died during the Tigray conflict, according to the British government. The Ethiopian army, Eritrean forces and Amhara nationalist “fano” militias, have previously committed grave atrocities against the Tigrayan population that amount to war crimes and crimes against humanity, according to the UN International Commission of Human Rights Experts on Ethiopia. Tigrayan forces were also accused in an Amnesty report of committing atrocities during the war.\n* Names have been changed to protect their identities", "translation_ja": "", "vocab": [{"word": "humanitarian", "definition": "人道的な、人命救助に関する。戦争や災害などで苦しむ人々を助けることに関連した用語で、国際紛争や危機的状況での援助活動を指すことが多い。"}, {"word": "fragile", "definition": "もろい、壊れやすい。脆弱で不安定な状態を表し、特に平和協定や政治的合意など、容易に破綻する可能性がある状況に用いられる。"}, {"word": "allegiance", "definition": "忠誠、忠誠心。個人や団体が特定の勢力や指導者に対して示す忠実さや支持のことで、政治的・軍事的文脈で頻繁に使用される。"}, {"word": "escalating", "definition": "エスカレートする、段階的に悪化する。紛争や緊張が徐々に高まり、より深刻になっていくプロセスを表す。"}, {"word": "testimonies", "definition": "証言、目撃証言。法的文脈で個人が経験した事実について述べる公式な証拠や陳述のことを指す。"}]}, {"title_ja": "Guardian readers fund life-changing surgery for Somali boy injured in US airstrike", "title_en": "Guardian readers fund life-changing surgery for Somali boy injured in US airstrike", "summary_ja": "After Guardian investigation uncovered drone strike that killed 12 civilians and injured many more, seven-year-old Abdiqadir Salah underwent vital operation in Mogadishu On the rickshaw ride to the hospital, Marian Haji Abdi Guled felt a mixture of joy and apprehension: the day they had been waiting", "summary_en": "After Guardian investigation uncovered drone strike that killed 12 civilians and injured many more, seven-year-old Abdiqadir Salah underwent vital operation in Mogadishu On the rickshaw ride to the hospital, Marian Haji Abdi Guled felt a mixture of joy and apprehension: the day they had been waiting", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/oct/05/guardian-readers-fundraising-somalian-boy-injured-in-us-strike-surgery-abdiqadir-salah", "state_media": false, "category": "経済", "full_text": "On the rickshaw ride to the hospital, Marian Haji Abdi Guled felt a mixture of joy and apprehension: the day they had been waiting for had finally arrived.\nAlmost a year earlier, her then seven-year-old son, Abdiqadir Salah, had been seriously injured, alongside his two siblings, in what a Guardian investigation found was a US drone strike on the village of Jamaame in Somalia that killed at least 12 civilians, including eight children.\nAbdiqadir’s small body had been impaled by shrapnel in the attack, and several chunks remained embedded in his back.\nDoctors feared that without an operation to remove them, the boy would lose his ability to walk, but Guled had no money for an operation. For 10 months, the family had languished in Mogadishu with growing expenses and no income – unable to afford surgery, but unwilling to let the boy return to the village without it.\nAfter the investigation, which told the story of Guled and other civilians affected by the attack, a group of Guardian readers from across the globe fundraised for Abdiqadir’s surgery and recovery.\nWithin a few hours, enough money was raised to cover his treatment and rehabilitation, as well as any medical expenses and treatment for her other two children, who sustained less extensive injuries.\n“I was so happy when I found out that Guardian readers raised the money needed for my son’s surgery. I didn’t know people like this existed,” Guled said.\n“The people who contributed to the surgery – I really appreciate their support and how they stood by our family when we needed it the most.”\nOn a Saturday morning in September, Guled waited anxiously as Abdiqadir was finally taken for surgery at Kaafi hospital in Mogadishu.\n“Other patients were taken into surgery after him and came out before him – so I worried maybe something went wrong,” she said. “I got to a point where I knocked on the operating room door asking if my son was still alive, then was held back by other patients.”\nFinally, her son emerged. Doctors told Guled the surgery had been successful, but complex. While the first two pieces of shrapnel from the missile had been successfully removed, taking out the final piece was considered too risky, possibly resulting in paralysis, so they concluded that it was safer to leave it and monitor his condition.\nWhen the Guardian visited Abdiqadir a few weeks later, he appeared bright, energised and visibly happy. “I have one piece of metal still in me, and if they touch it, I might become paralysed,” the seven-year-old said. “[But] I don’t have any problem with the last piece of metal in my body, because I’m no longer in pain.”\nThe Guardian investigation into the US airstrikes that injured Abduqadir raised myriad questions about US military intelligence, such as how the targets were selected and why children were hit while they were clearly visible and out in the open. The US has not responded to any questions about the Jamaame attack.\nIn the months since then, US attacks on the area have continued: from December 2025 to July 2026, it carried out at least three airstrikes around Jamaame, according to research by New America, a security thinktank that documents US military operations abroad. Residents say drones continue to fly above the town.\n“We cannot return to Jamaame because what caused my children to be hurt is still there,” Guled said. “I fled Jamaame with my wounded children because of the drones, and the drones are still [flying].”\nWith the remaining financial support she received from Guardian readers, Guled plans to relocate with her children to the government-controlled port city of Kismayo, which has not been the target of drone strikes, and where Abdiqadir can receive further surgery if needed.\nShe still wants answers from the US government, nearly a year after they were bombed. “My son has been left scarred for life,” she said.\n“I want the US government be held accountable for what they did to my family and for the US to stop bombing our community.”", "translation_ja": "", "vocab": [{"word": "apprehension", "definition": "不安や懸念の感情。ここでは、手術という重大な出来事を控えた母親の心理状態を表しており、期待と不安が入り混じった複雑な感情を指します。"}, {"word": "embedded", "definition": "深く埋め込まれた、食い込んだという意味。医学的文脈で、破片が体組織に深く入り込んでいる状態を描写しており、除去が困難であることを示唆しています。"}, {"word": "languished", "definition": "苦しみながら長く続く、衰弱する。ここでは家族が経済的困窮と医療難民の状態で長期間苦しんでいた状況を表現しており、深刻な困窮状態を強調しています。"}, {"word": "rehabilitation", "definition": "リハビリテーション、回復治療。医療分野で、手術後に機能を回復させるための治療プログラムを指し、単なる手術ではなく長期的な回復プロセスを含みます。"}, {"word": "paralysis", "definition": "麻痺、運動能力の喪失。医学用語として、神経や脊髄の損傷により身体の一部が動かなくなる状態を意味し、極めて深刻な後遺症を表現しています。"}]}, {"title_ja": "Yemen war live: Yemeni forces claim key heights as Houthi attacks go on", "title_en": "Yemen war live: Yemeni forces claim key heights as Houthi attacks go on", "summary_ja": "Saudi-backed Yemeni forces claim advances in western Taiz&#039;s mountain belt overlooking the coast.", "summary_en": "Saudi-backed Yemeni forces claim advances in western Taiz&#039;s mountain belt overlooking the coast.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/liveblog/2026/10/8/yemen-war-live-yemeni-forces-claim-key-heights-as-houthi-attacks-go-on?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Live updatesLive updates, \nYemen war live: Yemeni forces claim key heights as Houthi attacks go on\nSaudi civil aviation authorities say Houthi attacks on Abha and King Khalid International airports have killed three civilians, including two women, and injured 36 others.\nlive\nThis video may contain light patterns or images that could trigger seizures or cause discomfort for people with visual sensitivities.\nPublished On 8 Oct 2026\n- Saudi-backed Yemeni forces claim advances in western Taiz’s mountain belt overlooking the coast as part of the “Dawn of Yemen” operation.\n- Saudi civil aviation authorities say Houthi attacks on Abha and King Khalid international airports have killed three civilians and injured 36 others on Tuesday and Wednesday.", "translation_ja": "", "vocab": [{"word": "claim", "definition": "〜だと主張する、〜を獲得したと述べる。ここではイエメン軍が特定の領土を占領したと発表していることを示す。"}, {"word": "advances", "definition": "軍事的な前進や領土の進出。戦闘において敵陣地に向かって進むことを意味する。"}, {"word": "overlook", "definition": "〜を見下ろす、〜の上に位置する。地理的に高い位置から下の地域を見渡すことができる状態を示す。"}, {"word": "authorities", "definition": "公的な権力を持つ機関や当局。ここではサウジアラビアの民間航空を管理する政府機関を指す。"}, {"word": "casualties", "definition": "戦闘や攻撃による死傷者。死亡者と負傷者の両方を含む人的被害を意味する用語。"}]}, {"title_ja": "EU-China trade talks begin in Beijing amid escalating pressure", "title_en": "EU-China trade talks begin in Beijing amid escalating pressure", "summary_ja": "Talks will focus on the €1bn daily deficit and rare earth export restrictions.", "summary_en": "Talks will focus on the €1bn daily deficit and rare earth export restrictions.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/economy/2026/10/7/eu-china-trade-talks-begin-in-beijing-amid-escalating-pressure?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "EU-China trade talks begin in Beijing amid escalating pressure\nTalks will focus on the €1 billion daily deficit and rare earth export restrictions.\nEuropean Trade Commissioner Maros Sefcovic has arrived in Beijing for talks on the European Union’s (EU) growing trade deficit with China.\nSefcovic will meet Chinese Commerce Minister Wang Wentao on Thursday and Friday after months of discussions over the EU’s trade deficit of more than €1bn ($1.12bn) daily, as well as Chinese curbs on exports of rare earths and other critical minerals.\nMeanwhile, Chinese companies are increasingly challenging Europe’s top car brands. China rejected the EU request for voluntary curbs on Chinese hybrid car exports as the two sides enter negotiations, the Financial Times reported on Wednesday. The European Commission now hopes to get Beijing to accept a unilateral EU measure to cap hybrid imports instead, the outlet said, citing two diplomats briefed on the plan.\nThe two days of discussions come just as a majority of EU lawmakers called for a more assertive trade policy towards Beijing in a non-binding resolution on Wednesday. China vowed a “resolute response” to safeguard its industries if the European Union goes ahead with restrictions against Chinese companies or products, according to its commerce ministry.\nGermany and France propose rapid EU measure\nFrench President Emmanuel Macron and German Chancellor Friedrich Merz, leaders of the bloc’s two biggest powers, on Tuesday urged the EU to prepare a “credible instrument” that could be quickly activated to strike back against countries that harm the bloc economically.\nThe new measure would not target any specific country. German officials said the EU needed a tool as powerful as the Section 301 tariffs imposed by the United States or China’s restrictions on critical-mineral exports.\nThe proposed weapon – to be discussed at an EU leaders’ summit next week – would give the European Commission the power to respond to a trade aggression within days.\nChina responded to the letter by urging Paris and Berlin to steer clear of “protectionist” measures.\n“We hope that France and Germany, as major economies in the world, will uphold openness, cooperation and free trade,” the commerce ministry said in a statement.\n“They should avoid going down the wrong path in the wrong way, only to ultimately suffer the consequences themselves.”\nG20 finance leaders, except China’s, agreed in September to act against “non-market” distortions that exacerbate imbalances. Beijing says that hyping up issues such as economic imbalances and overcapacity is a form of protectionism designed to exert pressure on and restrict China.\nOngoing trade talks\nEU and Chinese officials have been discussing trade imbalances since June. Sefcovic said he wanted “tangible results by October” as well as some form of commitment that can be put to EU leaders meeting in Brussels.\nTrade relations with China top the summit’s agenda next week, as ballooning debt has prompted auditors to warn about the next seven-year EU budget and has spurred protests in France.\nEuropean Commission President Ursula von der Leyen told the European Parliament last month that the trade imbalance had reached a tipping point and that Europe would use every tool at its disposal to rebalance the relationship.", "translation_ja": "", "vocab": [{"word": "escalating", "definition": "段階的に増加・悪化していること。紛争や問題が徐々に深刻になる状況を表す。"}, {"word": "curbs", "definition": "制限や抑制措置のこと。政府が特定の行為や取引を制御するための規制を意味する。"}, {"word": "assertive", "definition": "積極的で強気な姿勢を示すこと。ビジネスや交渉で主張を強く押し出す態度を指す。"}, {"word": "credible", "definition": "信頼できる、信憑性のあること。提案や政策が実現可能で説得力があることを示す。"}, {"word": "exacerbate", "definition": "悪化させる、より深刻にすること。問題や状況をさらに悪い方向へ進める。"}]}, {"title_ja": "UN peacekeeping force in Lebanon says shots fired at Israeli border post", "title_en": "UN peacekeeping force in Lebanon says shots fired at Israeli border post", "summary_ja": "The United Nations Interim Force in Lebanon said there were no casualties after small arms fire targeted a border post.", "summary_en": "The United Nations Interim Force in Lebanon said there were no casualties after small arms fire targeted a border post.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/10/7/un-peacekeeping-force-in-lebanon-says-shots-fired-at-israeli-border-post?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "UN peacekeeping force in Lebanon says shots fired at Israeli border post\nThe United Nations Interim Force in Lebanon said there were no casualties after small arms fire targeted a border post.\nThe United Nations Interim Force in Lebanon (UNIFIL) says one of its posts on the Lebanon-Israel border was targeted by small arms fire, with no casualties reported.\nThe UN force said the incident occurred on Wednesday morning with several rounds of small arms fire targeting a UNIFIL position near Kfar Shouba along the UN-drawn border with Israel, known as the Blue Line.\n“Such deliberate attacks gravely endanger the lives of peacekeepers,” UNIFIL said in a statement, adding that it was investigating the incident.\nUnder pressure from the United States and Israel, the UN Security Council decided earlier this year to set December 31 as the end of the mandate for the UN peacekeeping force in Lebanon.\nUNIFIL was initially created to oversee the withdrawal of Israeli troops from southern Lebanon after Israel’s 1978 invasion, and its mandate has been renewed annually since then.\nThe mission was expanded after the 2006 war between Israel and Hezbollah. Proponents say it remains important to maintaining a demilitarised buffer between the two sides along the volatile Israeli and Lebanese border.\nIsrael has long accused UNIFIL of failing to prevent threats posed by Hezbollah and has increasingly pushed for the end of its mission since cross-border fighting escalated in the wake of the October 7, 2023, Hamas-led attacks on Israel and the start of Israel’s war on Gaza.\nUNIFIL currently has 7,500 peacekeepers from around 50 countries operating in Southern Lebanon.\nLast month, Lebanon’s Prime Minister Nawaf Salam pressed the UN on the need to “avert the vacuum” that would be caused by withdrawing the mission from the country’s south without a viable replacement.\nViolence has decreased since a ceasefire following a June memorandum of understanding in the US-Iran war. Lebanon and Israel concluded a US-sponsored framework agreement later that month.\nThe Israel-Lebanon deal involves the disarmament of Hezbollah, a gradual withdrawal of Israeli forces from Lebanon’s south and the deployment of the Lebanese army to the region, starting in test areas known as “pilot zones”.", "translation_ja": "", "vocab": [{"word": "mandate", "definition": "国際機関や政府が与えられた権限や責務のこと。ここではUN平和維持軍に与えられた活動期間と権限を指す。"}, {"word": "demilitarised", "definition": "軍事施設や軍隊を撤去して非武装化された地域のこと。紛争地域の緊張緩和のために設置される。"}, {"word": "escalated", "definition": "紛争や問題が段階的に悪化・激化すること。ここでは国境を越えた戦闘が拡大したことを指す。"}, {"word": "viable", "definition": "実行可能で機能する見込みがあること。ここでは機能する代替案という意味で使われている。"}, {"word": "framework agreement", "definition": "今後の交渉や実行の基礎となる基本的な合意や枠組みのこと。細部は後で詰められる。"}]}, {"title_ja": "Tanker off Qatar reports hits from multiple projectiles: U.K. maritime agency", "title_en": "Tanker off Qatar reports hits from multiple projectiles: U.K. maritime agency", "summary_ja": "The reported attack on Wednesday (October 7, 2026) was around 500 kilometres (300 miles) from the Strait of Hormuz", "summary_en": "The reported attack on Wednesday (October 7, 2026) was around 500 kilometres (300 miles) from the Strait of Hormuz", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/oil-tanker-off-qatar-reports-hits-from-multiple-projectiles-hormuz-strait-october-7-2026/article71558152.ece", "state_media": false, "category": "社会", "full_text": "A tanker sailing off the north coast of Qatar reported being struck \"by multiple projectiles\", causing an unspecified number of casualties, the UKMTO maritime agency said on Wednesday (October 7, 2026).\nThe incident took place 51 nautical miles (94 kilometres) off the coast of the tiny Gulf state, the British agency said, adding that authorities were investigating. It did not specify the origin of the ship.\nThe reported attack on Wednesday (October 7, 2026) was around 500 kilometres (300 miles) from the Strait of Hormuz.\nShips in the Gulf and those attempting to transit the strait, the only way in or out of the oil-rich region for vessels, have come under repeated attack since the U.S. and Israel sparked the West Asia war in late February.\nIran has blockaded the strait ever since and fired on vessels it accuses of unauthorised crossings.\nThe United States has set up its own counterblockade of Iranian ports and occasionally fires on vessels linked to Tehran.\nIt has also bombed Iranian targets in retaliation for Tehran's attacks on ships, although there have been no such reported strikes since September 1.\nSome vessels continue to ply the strait and U.S. media has reported on American efforts to protect ships on a route hugging the coast of Oman.\nDiplomatic efforts to resolve the war, which began with a massive wave of surprise U.S.-Israeli strikes against Iran, have been deadlocked for months.\nHormuz is vital to the world economy, with around a fifth of the planet's oil and liquefied natural gas passing through the strait before the war began.\nPublished - October 08, 2026 05:50 am IST", "translation_ja": "", "vocab": [{"word": "projectiles", "definition": "発射された物体や弾丸のこと。軍事用語として、砲弾やミサイルなど飛行する武器を指す。"}, {"word": "blockade", "definition": "港や地域を軍事的に封鎖し、物資や人の出入りを遮断する戦術。経済的・軍事的な圧力手段として使用される。"}, {"word": "counterblockade", "definition": "相手の封鎖に対抗する逆の封鎖。敵の封鎖に対して、こちらも同様に相手の港や地域を封鎖する報復措置。"}, {"word": "transit", "definition": "通過や輸送を意味し、人や物が特定の場所を通って移動すること。特に国際的な移動時に使われる。"}, {"word": "deadlocked", "definition": "膠着状態にある、進展がない状態。交渉や紛争が解決に向けて進まず、完全に行き止まっている。"}]}, {"title_ja": "Cornell students stage sit-in to protest university’s handling of alleged 2024 gang rape", "title_en": "Cornell students stage sit-in to protest university’s handling of alleged 2024 gang rape", "summary_ja": "Some Cornell students have staged a sit-in at a dining hall and vowed not to spend money on campus to protest sexual violence and how the university has handled complaints", "summary_en": "Some Cornell students have staged a sit-in at a dining hall and vowed not to spend money on campus to protest sexual violence and how the university has handled complaints", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/cornell-students-stage-sit-in-to-protest-universitys-handling-of-alleged-2024-gang-rape/article71557283.ece", "state_media": false, "category": "社会", "full_text": "Some Cornell students staged a sit-in at a dining hall and vowed not to spend money on campus on Wednesday (October 7, 2026) to protest sexual violence and how the university has handled complaints, in the latest expression of outrage over an alleged 2024 gang rape at a fraternity house.\nA handwritten sign reading “Justice for Jane Doe ” — the name under which the accuser is suing — was propped on an empty table in the dining hall in the afternoon. Some students sat around the room without eating, while others lunched. Another small group sat outside holding signs with messages such as “we are Jane Doe.”\nGroups organising the demonstration intended to keep the sit-in going for seven hours.\nThe demonstrations were meant to spotlight complaints that the university is slow to respond to reports of sexual assault while quick to protect its reputation. Among other demands, the groups want the university to retool disciplinary procedures for addressing complaints and expel or revoke the degrees of anyone involved in the alleged October 2024 sexual assault.\nJane Doe, who was a student then, alleges that Chi Phi members plied her with alcohol and drugs and several sexually assaulted her. One man sent others a message inviting them to participate, according to a lawsuit she filed last month against Cornell, the fraternity, seven men who were Chi Phi brothers and others.\nLawyers for two of the men have denied they participated in a sexual assault. Attempts by The Associated Press to reach the others or their representatives have been unsuccessful. Some of the men who underwent a university disciplinary hearing in 2024 told investigators that the sexual activity was consensual or said they were not involved.\nThe woman went to Cornell police in November 2024, though no criminal charges resulted. In the wake of her lawsuit, the state attorney general is conducting a renewed criminal investigation.\nCornell closed down the Chi Phi campus chapter in 2024 and says it expelled some students and suspended others after an investigation under the federal Title IX law.\nThis week Cornell trustees brought in former U.S. Deputy Attorney General Sally Yates to review how the school investigates sexual assault and sexual harassment, how the disciplinary process works, campus police response and more.\nPublished - October 08, 2026 03:32 am IST", "translation_ja": "", "vocab": [{"word": "alleged", "definition": "主張されているが、まだ証明されていない。法的文脈で、犯罪や不正行為が起訴されているが有罪判決を受けていない状態を指す。"}, {"word": "disciplinary", "definition": "規則違反や非行に対する懲罰や処分に関する。組織が不適切な行動に対して取る正式な手続きを意味する。"}, {"word": "plied", "definition": "（酒や薬などを）しきりに勧める、飲ませ続ける。相手に何度も何度も物を与え続ける行為を指す。"}, {"word": "Title IX", "definition": "米国の教育法上の重要な条項で、教育機関における性的差別や性的ハラスメント防止に関する法律。"}, {"word": "retool", "definition": "再構成する、改善する。既存のシステムや手続きを新しい目的や要件に合わせて改める。"}]}, {"title_ja": "Evicted Spanish octogenarian Maricarmen Abascal, heart of
