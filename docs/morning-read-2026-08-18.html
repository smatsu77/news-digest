な信念に反して、中国のレアアース独占は数十年にわたる意図的な戦略ではなく、国内利益と世界経済の変化への対応の進化的な混合の結果である。鄧小平の有名な発言はしばしば戦略的意図の証拠とされているが、著者は北京がレアアースを地政学的な道具として認識したのは2010年以降であり、米国の制裁戦術から学んだと主張している。現在のサプライチェーン緊張は、計算された中国の戦略というより、ワシントンと北京の間の相互作用と反応の螺旋を反映している。", "summary_en": "Contrary to popular belief, China's rare-earth monopoly is not the result of a deliberate decades-long master plan, but rather an evolving mix of domestic interests and responses to global economic changes. While Deng Xiaoping's famous statement about rare earths as China's 'weapon' is often cited as evidence of strategic intent, the author argues that Beijing only recognized rare earths as a geoeconomic tool after 2010, learning from U.S. sanctions tactics. The current supply chain tensions reflect an action-reaction spiral between Washington and Beijing rather than a calculated Chinese strategy.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/how-china-found-most-potent-weapon-xiong-weiss", "state_media": false, "category": "オピニオン", "full_text": "This article has been edited to reflect a dispute about whether Deng Xiaoping made his observation about oil and rare-earth elements in 1991 or 1992.\n“The Middle East has oil, China has rare-earth elements,” Chinese leader Deng Xiaoping declared in the early 1990s. This quote has been repeated a lot lately as Beijing has used its near monopoly on the rare-earth industry to effectively push back against U.S. President Donald Trump’s latest trade war. It is often cited as evidence that implicit in Deng’s statement was a coercive threat: just as Arab oil states weaponized their petroleum exports in 1973—cutting off the West to punish it for backing Israel in the Yom Kippur War—China would one day do the same with rare earths.\nThe events of the past year have only deepened that conviction. Last November, for instance, after China had announced its licensing regime for rare-earth exports, the bipartisan U.S. House Select Committee on China said that Chinese leader Xi Jinping was “actualizing Deng’s vision.” Trump posted on social media that it was “obviously a plan devised by [China] years ago.” And Miles Yu, who served as chief China policy adviser to Secretary of State Mike Pompeo during the first Trump administration, wrote that “Beijing’s rare earths monopoly is no accident of geology. It is the product of a deliberate, decadeslong strategy to control the extraction and refining of the elements that make up the modern world.”\nThere is no doubt today that China’s control of rare earths represents a powerful weapon—one that has provoked worldwide alarm and a race to secure alternatives. China not only sits on the world’s largest known reserve of rare-earth elements but also dominates approximately 85 percent of global processing. Despite being a small industry, the role of rare earths in modern technologies is mighty. Because these 17 elements—especially the scarcer heavy rare-earth elements—are so essential to semiconductor production, defense technologies, automobiles, and clean energy, China’s role in their supply chain represents a significant chokepoint in the global economy.\nBut even though China has sought to take advantage of its position, its dominance is not the result of a grand, far-sighted scheme to hold the world hostage. In reality, it is the result of an idiosyncratic and evolving mix of domestic interests set against a backdrop of broader global economic and technological change. When Deng spoke, for instance, the United States had just concluded the first Gulf War. From Beijing’s perspective, the American-led campaign was a visceral reminder of China’s vulnerabilities in both the conduct of modern warfare and the role that key resources could play in inciting conflict. As Deng pointed out around the same time, “We haven’t paid enough attention to how to use this treasure. We must protect rare-earth resources.”\nThis was easier said than done. Early efforts to consolidate China’s market position began as an effort to rein in unruly domestic competition that kept prices low and risked depleting Chinese resources. They did not originate in a strategic effort to weaponize supply chains in a geopolitical fight. In fact, China’s rare-earth industry remained so loose and ad hoc that it’s not even clear Beijing had full control over it 20 years later, during the infamous 2010 incident over the island chain known as the Diaoyu in China and the Senkaku in Japan. After China and Japan skirmished over the disputed islands, rare-earth exports to Japan were indeed temporarily restricted—causing the Deng quote to go viral for the first time—but research suggests it might not have been a carefully designed plan to punish Japan. As is the case with many of China’s policies, there is often a large gulf between words and deeds, and studying China’s history with rare earths reveals the amalgam of competing priorities that have shaped its policy.\nBeijing has recognized rare earths as a geoeconomic weapon only since 2010—and, in the process, learned how to wield such an arsenal from the United States’ sanctions and export controls. The current rare-earth standoff and ongoing supply chain weaponization do indeed pose a grave threat to global stability and prosperity. But it is less a Chinese master plan coming to fruition than the result of two powers locked in an action-reaction spiral that neither set out to start—and that neither fully controls.\nCorrecting this narrative and understanding how China came to dominate the rare-earth market matters because it helps illuminate the current security dilemma between Beijing and Washington: when one country takes actions to increase its own security, the other feels threatened, precipitating its own actions and furthering the escalatory spiral. But as China and the United States now race to gain future leverage over each other, the risks are not limited to economic warfare. Fears of future economic and supply chain weaponization have fostered a growing estrangement betwee", "translation_ja": "", "vocab": [{"word": "idiosyncratic", "definition": "特異的で、一般的ではない個性的な特徴を持つ。ここでは、中国のレアアース産業の発展が、計画的なものではなく、独自の事情による進化の過程であることを表現している。"}, {"word": "chokepoint", "definition": "供給チェーンにおいて流れを制御できる重要な地点。一国が産業全体に大きな影響力を持つ位置を指す。"}, {"word": "weaponization", "definition": "経済的資源や政策を国家間の対立における兵器として利用すること。特に貿易制限やサプライチェーン制御を政治的目的に使うことを意味する。"}, {"word": "estrangement", "definition": "関係の疎遠化や関係悪化。二国間の経済的・政治的な結びつきが弱まる状態を指す。"}, {"word": "security dilemma", "definition": "一国が自国の安全を強化する行動が、他国に脅威と認識され、報復行動を招き、結果として両国の安全が低下する矛盾した状況。"}, {"word": "precipitate", "definition": "行動や出来事をもたらす、引き起こす。ここでは一方の行動が他方の対抗行動を招くことを表現している。"}, {"word": "escalatory spiral", "definition": "相互に報復を繰り返すことで、紛争がエスカレートしていく悪循環。各側の行動が相手をさらに過激な行動へと駆り立てる状況。"}]}, {"title_ja": "同盟がいかに生き残るか：トランプショックがNATOを破壊しない理由", "title_en": "How Alliances Survive: Why Trump's Shocks Won't Destroy NATO", "summary_ja": "トランプ第2期政権による現在の緊張にもかかわらず、著者は米国同盟が生き残ると主張している。その理由は、中国とロシアからの脅威が強まり、経済・軍事的結びつきが強いままで、制度的力が機能し続けるからである。同盟体制は新たな課題に対応するため変革が必要だが、その崩壊予測は過度な悲観論であり、自己実現的な預言となるリスクを招く。", "summary_en": "Despite current tensions from Trump's second administration, the author argues U.S. alliances will survive because shared threats from China and Russia have intensified, economic and military ties remain strong, and institutional forces continue functioning. While the alliance system must transform to meet new challenges, predictions of its collapse are overstated pessimism that risks becoming self-fulfilling.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/how-alliances-survive-campbell-doshi", "state_media": false, "category": "オピニオン", "full_text": "In 1984, months after the Reagan administration’s decision to deploy Pershing II intermediate-range nuclear missiles to Western Europe brought hundreds of thousands of protesters into the streets of Europe’s major cities, a clutch of senior French, German, and Italian officials cornered NATO Secretary-General Peter Carrington outside his Brussels office. Tensions were still running high, and the Americans, they complained, were rude, reckless, and dismissive of allied counsel. Carrington heard them out. Then he shrugged and offered his usual verdict on why American indispensability demanded allied forbearance: “Alas, they are the only Americans we have.”\nToday, that forbearance is being severely tested. In less than two years, the second Trump administration has threatened to seize Greenland and leave NATO, withdrawn troops from Germany, meddled in allies’ elections, and levied tariffs on friends—all while lavishing summitry and flattery on Beijing and Moscow. Allies have responded with understandable alarm. “The old relationship we had with the United States,” declared Canadian Prime Minister Mark Carney, “is over.” A “deep rift” was forming, warned German Chancellor Friedrich Merz. “The West as we knew it no longer exists,” declared European Commission President Ursula von der Leyen. Ng Eng, Singapore’s defense minister, lamented that the United States had gone from a partner to a “landlord seeking rent.”\nIn the United States, a growing consensus holds that the alliances are unlikely to recover. Former House Foreign Affairs Committee Chair Greg Meeks has questioned “whether or not our friends and allies will ever trust the United States again.” The scholar Robert Kagan, in a eulogy for an era in which U.S. allies stuck with Washington, declared that “those days are now over and will not soon return.”\nThis pessimism is understandable—but significantly overstated. The grievance in allied capitals, while heartfelt, is not a lasting guide to what comes next. Dire as the moment appears, the United States’ alliances will survive the Trump shock for reasons the headlines miss. First, the alliance system has weathered now forgotten shocks at least as serious as these, and the present ones owe more to presidential personality than to durable new politics. Second, the threats that gave rise to the alliances have not faded but intensified and converged, as allied perceptions of China and Russia align as never before. Third, powerful gravitational forces continue to pull allies together economically, technologically, and militarily, overcoming efforts to “de-risk” from Washington, while professional bureaucracies quietly advance cooperation far from the glare of politics.\nAllowed to harden into conventional wisdom, pessimism risks becoming a self-fulfilling prophecy, as policymakers, convinced the alliances cannot be saved, stop doing the work to ensure they endure. But together, these uniting forces will carry the alliances through the Trump moment and set them up—should allied capitals seize the opportunity—for the transformation required to meet the challenge of a China, backed by a newly aggressive Russia, that can outscale every other country on the metrics of power that matter most. The current anxieties, however inadvertently, may even strengthen the alliance system: as they have in the past, tensions can spur reforms that create tomorrow’s capability. Allies could be transformed from dependents into co-creators of power, pooling capacity into what we have previously called “allied scale.” The Trump administration has called on allies to do more so that the United States can do less; in fact, in the future, both the allies and the United States will need to do more, creating two-way flows of capacity and interdependence that make the whole greater than the sum of its parts.\nIt is true that as French President Emmanuel Macron and other allied leaders have argued, “there is no going back.” That does not, however, mean the end of the alliance system. It means reforging the alliance system for a new era.\nTHE NEW FATALISM\nThe damage that U.S. President Donald Trump has done to U.S. alliances so far in his second term exceeds that done in the entire four years of his first term. That is in part because the internationalist staff that imposed guardrails the last time is gone. But the growing concern over the future of American alliances is not just about Trump. It is driven by a belief that longer-standing corrosive forces compounded by Trumpian attacks on trust are eroding the system to the point that it will be beyond salvation.\nThe first set of corrosive forces is within the United States. As senior Biden administration officials Phil Gordon and Mara Karlin observed in these pages, a generation of failed interventions, economic challenges, and inward-looking politics have left Americans more reluctant to underwrite global order than at any time since before World War II. Trump, the argument goes, is as much a symp", "translation_ja": "", "vocab": [{"word": "forbearance", "definition": "我慢強さ、寛容さを意味する。同盟国が米国の行動に対して示すべき忍耐と寛容の態度を指す。"}, {"word": "corrosive", "definition": "腐食的な、蝕む意味。ここでは同盟制度を徐々に弱める負の要因を表現するために使われている。"}, {"word": "gravitational forces", "definition": "引力的な力、引きつける力。同盟国を経済的・軍事的に結びつける強い相互の結合力を比喩的に表す。"}, {"word": "self-fulfilling prophecy", "definition": "自己実現的な預言。最初の信念や予想が、その後の行動を通じて実際に実現される現象を指す。"}, {"word": "de-risk", "definition": "リスクを軽減する、依存を減らす。ここでは同盟国が米国への依存を減らそうとする試みを意味する。"}, {"word": "inward-looking", "definition": "内向的な、国内志向の。米国が国際秩序の維持より国内問題に関心を向ける傾向を描写する。"}]}, {"title_ja": "テロリズムの戦略", "title_en": "The Strategy of Terrorism", "summary_ja": "著者は、テロリズムは弱者の戦略であり、標的がテロリストの望む通りに応じる場合にのみ成功すると主張しています。テロに対抗する究極の力はテロリストではなく標的側にあるため、被害者は常にテロリストの要求に従うことを拒否できます。しかし、技術が益々致命的な攻撃を可能にする中で、社会はテロと戦うために自由と権利を制限するプレッシャーに直面しており、著者はこのプレッシャーに抵抗すべきだと警告しています。", "summary_en": "The author argues that terrorism is fundamentally a strategy of the weak that succeeds only when targets respond as terrorists desire. Since the ultimate power to defeat terrorism lies with those targeted, not the terrorists themselves, victims can always refuse to comply with terrorist demands. However, as technology enables increasingly deadly attacks, societies face growing pressure to restrict freedoms and liberties to combat terrorism—a pressure the author warns should be resisted.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/the-back-page/strategy-terrorism", "state_media": false, "category": "オピニオン", "full_text": "A quarter century before 9/11, an upsurge in global terrorism prompted the historian David Fromkin to examine its purpose and method. Terrorism was a strategy of the weak, Fromkin wrote in these pages, but modern technology had enabled it “to enter the political arena on a new scale.” And its surprising success seemed to be due, in large part, “to a miscomprehension of the strategy by its opponents.”\nThose who are the targets of terrorism—and who are prepared to defend themselves by doing whatever is necessary in order to beat it—start with a major advantage. The advantage is that success or failure depends upon them alone. Terrorism wins only if you respond to it in the way that the terrorists want you to; which means that its fate is in your hands and not in theirs. If you choose not to respond at all, or else to respond in a way different from that which they desire, they will fail to achieve their objectives.\nThe important point is that the choice is yours. That is the ultimate weakness of terrorism as a strategy. It means that, though terrorism cannot always be prevented, it can always be defeated. You can always refuse to do what they want you to do.\nWhether to pay the price of defeating terrorism is increasingly going to be a major question in our time. The answer is relatively easy in most kidnapping and ransom situations: experience has shown that blackmailers and extortionists usually are encouraged to try it again if you give in to their demands the first time. So, if you can do so, you should accept the consequences, however terrible, of standing firm in order to avoid an infinite sequence of painful events.\nBut the price of doing so is constantly rising, as technology increases the range and magnitude of horrible possibilities. Terrorist outrages, when they occur, are bound to become more deadly. Increasingly, we will be under pressure to abridge our laws and liberties in order to suppress the terrorists. It is a pressure that should be resisted.", "translation_ja": "", "vocab": [{"word": "upsurge", "definition": "急激な増加や上昇を意味します。特に否定的な出来事や現象が一時的に大幅に増加する状況で使用されます。"}, {"word": "miscomprehension", "definition": "誤った理解や誤解を指します。相手の意図や戦略を正しく把握できていない状態を表します。"}, {"word": "extortionists", "definition": "脅迫によってお金や物を無理やり奪う人々を指します。恐喝犯人や強要者とも訳されます。"}, {"word": "abridge", "definition": "権利や自由を短縮・制限する、あるいは文章などを省略・要約することを意味します。"}, {"word": "outrages", "definition": "極めて悪質で不道徳な行為、特に甚大な被害をもたらす暴力的な事件を指します。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-18 21:09 JST";
  renderTabs();renderList();
})();
</script>
