lockade of its ports remains in force.\n“There are no talks or conversations going on, or scheduled, with the Islamic Republic of Iran. The Naval Blockade remains in full force and effect. The Hormuz Strait is open and operating. All water mines have been removed or detonated,” Mr. Trump wrote on Truth Social.\n-AFP\nAugust 18, 2026 19:30\nTrump posts map showing Strait of Hormuz as U.S. territory\nU.S. President Donald Trump on Tuesday posted a map on his Truth Social platform showing the Strait of Hormuz as “NEW U.S. Territory,” pressing his threat to claim sovereignty over the vital waterway.\nIran has effectively shut down the chokepoint, through which a fifth of the world’s oil transits, in retaliation for the war Mr. Trump started along with Israel in late February.\nMr. Trump first raised the idea of a U.S. takeover on Friday, saying in a jovial-sounding tone he would soon declare it to be U.S. territory -- prompting Iran to retort that the strait “will remain Iranian.”\nMr. Trump revisited the idea again Monday in comments to reporters in the Oval Office, suggesting it would be a good idea.\nThis is not the first time that Mr. Trump, faced with a foreign policy obstacle, has threatened to annex foreign territory.\n-AFP\nAugust 18, 2026 18:00\nMediator Qatar says Hormuz agreement crucial for U.S.-Iran talks to resume\nQatar, a key mediator in the stalled U.S.-Iran talks, said Tuesday that an agreement between Iran and Oman over the Strait of Hormuz would make it easier to resume negotiations to end the Middle East war.\nAfter war broke out between the Untied States and Iran in late February, Tehran effectively shut the strait, which normally carries one fifth of the world’s LNG and oil during peacetime.\nIran and Oman, both coastal states bordering the strait, have for weeks been discussing the future of navigation through the waterway, with Tehran saying the geographical coordinates of the route envisaged by both countries “have been agreed upon”.\n“We are also awaiting an agreement between the Sultanate of Oman and Iran regarding the Strait, which would enable us to return to the framework of negotiations,” Qatari Foreign Ministry spokesman Majed Al Ansari told reporters.\n“The agreement over the Strait of Hormuz would make it much easier for us to resume the talks between the United States and Iran,” he added.\n-AFP\nAugust 18, 2026 15:47\nHouthis target Saudi refinery\nYemen’s Iran-backed Houthis targeted an oil refinery on Saudi Arabia’s southern Red Sea coast on Tuesday (August 18, 2026), rebel media reported, as the rebels ramp up attacks on the kingdom.\nThe Houthis “targeted the Aramco refinery in Jazan with a number of drones in response to airspace violations over the governorates of Saada and Hajjah” in Yemen, Houthi news agency Saba said, citing a military source. - AFP\nAugust 18, 2026 15:45\nVessel struck in Strait of Hormuz\nAn “unknown projectile” struck a vessel transiting the Strait of Hormuz, causing a crew casualty, a British maritime agency reported on Tuesday (August 18, 2026).", "translation_ja": "", "vocab": [{"word": "barrage", "definition": "連続した砲撃や一連の激しい攻撃を意味する。ここでは複数のミサイルの集中的な発射を指す。"}, {"word": "blockade", "definition": "軍事的に港や地域を封鎖し、物資やアクセスを遮断する戦略。外交的圧力の手段として使用される。"}, {"word": "chokepoint", "definition": "地政学的に重要な通路で、交通や貿易が一点に集中し、支配されやすい場所。ホルムズ海峡のような戦略的要所を指す。"}, {"word": "annex", "definition": "他国の領土を武力または権力で自国に併合する行為。国際法違反とされることが多い。"}, {"word": "mediator", "definition": "紛争や交渉の仲裁者として、対立する当事者間の合意を仲介する第三者。"}, {"word": "escalate", "definition": "状況や紛争の程度が段階的に高まること。緊張や対立がさらに深刻化する過程を指す。"}]}, {"title_ja": "UAEがイランから2発の弾道ミサイルが領土に向けて発射されたと発表", "title_en": "UAE Says Iran Fired Two Ballistic Missiles at Its Territory", "summary_ja": "アラブ首長国連邦国防省は、2026年8月18日にイランが領土に向けて2発の弾道ミサイルを発射したと報告し、1発は領海外に落下し、もう1発は領海内に落下した。この事件は数ヶ月ぶりに検出されたミサイル攻撃であり、UAE住民向けの民間防衛警報を引き起こした。この攻撃は、6月に両国間で結ばれた覚書が崩壊した後に発生した。", "summary_en": "The United Arab Emirates Defence Ministry reported that Iran launched two ballistic missiles toward the country on August 18, 2026, with one falling outside territorial waters and the other within them. The incident marked the first missile attack detected in months and triggered a civil defense alert for UAE residents. The attack came after a June memorandum of understanding between the two parties had collapsed.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/uae-accuses-iran-of-firing-ballistic-missiles-at-its-territory/article71362169.ece", "state_media": false, "category": "政治", "full_text": "The United Arab Emirates on Tuesday (August 18, 2026) accused Iran of firing two ballistic missiles at its territory, marking the first time the Defence Ministry detected a barrage aimed at the country in months.\nAlso read: West Asia war updates on August 18, 2026\n“UAE air defences detected two ballistic missiles launched from Iran toward the country, with the first falling outside the country’s territorial waters, while the second fell within the territorial waters,” said a statement posted by the Defence Ministry on X.\nThe statement came nearly two hours after a brief phone alert warned UAE residents of a “potential missile threat”.\n“Due to the current situation and potential missile threats, immediately seek a safe place in the closest secure building,” the Interior Ministry said in the phone alert, which was lifted shortly after.\nIt was the first such alert since a false alarm in June and an alert in July for an attack that ultimately did not enter UAE territory. Before that, the last missile warning came in early May.\nTankers belonging to state-owned oil company ADNOC have been repeatedly targeted in the past few weeks.\nWhen the war in West Asia began on February 28, the UAE bore the brunt of Iran’s attacks, with nearly 3,000 missiles and drones directed at the country — more than anywhere else in the region.\nAfter a memorandum of understanding came into effect in June between the two parties, which has since collapsed, the UAE reported no attacks, unlike other Gulf states.\nPublished - August 18, 2026 11:59 pm IST", "translation_ja": "", "vocab": [{"word": "barrage", "definition": "短時間に大量に発射または発動されること。ここではイランが多数のミサイルを連続して発射した状況を表現している。"}, {"word": "territorial waters", "definition": "国家が主権を行使する海域。通常、海岸から12海里（約22km）までの範囲を指す。"}, {"word": "memorandum of understanding", "definition": "2つ以上の当事者間の合意や協力の意図を示す非公式な文書。法的拘束力を持つ条約より緩い性質。"}, {"word": "civil defense alert", "definition": "国民に危険を知らせ、安全な場所へ避難するよう促す公式な警告。"}, {"word": "brunt", "definition": "攻撃や困難の主な力や影響を受けること。最初に厳しい状況に直面することを意味する。"}]}, {"title_ja": "メープルリーフスのスター選手ジョン・タバレス、800万ドルの税務請求をめぐりCRAと法廷で争う", "title_en": "Maple Leafs Star John Tavares Fights CRA Over $8M Tax Bill in Court", "summary_ja": "トロント・メープルリーフスのキャプテン、ジョン・タバレスは、カナダ歳入庁（CRA）から発行された800万ドルの税務請求に異議を唱えるため、本日法廷に出廷しました。この法的手続きはNHLの最も著名な選手の一人が関わる重要な税務紛争を示しています。事件の詳細とタバレスのCRAの請求に対する対応は、法廷手続きから明らかになると予想されています。", "summary_en": "Toronto Maple Leafs captain John Tavares appeared in court today to dispute an $8 million tax bill issued by the Canada Revenue Agency. The legal proceedings mark a significant tax dispute involving one of the NHL's most prominent players. Details of the case and Tavares's response to the CRA's claims are expected to emerge from the court proceedings.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi7gFBVV95cUxONEt3djRrVHlZZFlic09jVUVPazlrUjRSUE1SRTVzc1htQU9yU04wMnJtMFc2dDZxVklTVWRybXhwOHJFcnBxRGZMaUNQdXFFWUMyb2xVNU13dTh6Qklkdk4wbzdPdG1uRUM2WFZfSktWN0dScnp6NjFRRHE1R3plcnBISmVHN2dwU2Y3T3hOemRETGwzOTVfYmljR0FoYUZJTVRTbWhNd1UwZm1JLWFGM3BGcnMxUExtaWJaclJTTmN0S0xkWVlEVjNnclBqeHM4VXRWLVB0TzJYSlhYcjRGcFR3ZG52Q2JnLTJqY2dB?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領のカナダ大使を追放する請願書が20万署名を超える", "title_en": "Petition to Expel Trump's Ambassador to Canada Surpasses 200,000 Signatures", "summary_ja": "ドナルド・トランプ大統領のカナダ大使の追放を求める請願書が20万以上の署名を集めました。この請願書はトランプ政権下でのカナダと米国の関係の緊張の高まりを反映しています。この動きは両国間の外交代表に関する国民の懸念の増大を示しています。", "summary_en": "A petition calling for the expulsion of Donald Trump's ambassador to Canada has garnered over 200,000 signatures. The petition reflects growing tensions in Canada-US relations under the Trump administration. The move indicates significant public concern about diplomatic representation between the two countries.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihwJBVV95cUxPNTk5Z25zOVpEMm51bHZVWEdfZnRka05mRDkydzg1U1hoakNsT2xTMC1qX3Q0RFBtRXNleHRHcU9KODNTRGw2QWJzV3dDVGxYb2dSWTdkUG93bEJDRzFDZmRpME1QLXRPWUlDbEUxRkNGVzhtRzZHSklhdEZReXh5TTc5a0wtbno5aEI3aHo2RURyNkxKSWhwY01HS0ZaTlhVM3I2blJqOFppMlZQTHJwTVZTc0NKaGItZFN4NTZWbXdqUU5kUVdqaFlocGk4bVg2WkRBZWUzVkVDSWFmQmVTdFFabnQ1QUJCS3poWHFpVjZ1RDlmMUQ2SHM4LWRjUWFHaDJhbTItbw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプとの貿易交渉におけるマーク・カーニーのシンプルな戦略", "title_en": "Mark Carney's Simple Strategy for Trump Trade Negotiations", "summary_ja": "ジャスティン・リングは、マーク・カーニーがドナルド・トランプとの貿易交渉における最も効果的なアプローチは驚くほど単純で印象的であると主張しています。その戦略はバンパーステッカーに収まるほどシンプルで、複雑な貿易交渉に対する明確で直接的なメッセージング・アプローチを示唆しています。", "summary_en": "Justin Ling argues that Mark Carney's most effective approach in trade negotiations with Donald Trump is surprisingly straightforward and memorable. The strategy is so simple it could fit on a bumper sticker, suggesting a clear and direct messaging approach to complex trade discussions.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimAJBVV95cUxNRk5sS3VRbFdPalNRNGNRUm1FSlYxMkFJSUNHSVdZT3dPTFY2QkR6enMwalFjVUxYQ3RrMmVTNFFnSldDeE1rdWlHd0M3NGtyR2d5MjdrSDVteVY5TjBPWHVWdUNPSHUzMXNxS1hXcms3OHpoZFhBTU44aXZKUDhZVGgzcjVrOGU3NGwzR0JiVU9udmtUUlNNU3RQanV5OEM2UzN0ekRoZWlSUWx6dzZfbEthcGRvOTh1cHkzM01zY1NqMFJ0MmFCVTBnakZGZmNYX2p3dDdjTVllc2FuS25jX0NDMUZPMUxVLWpRWjc0blhLRjduM016bUxoMXJ2N1YwVENlTkRORmxFRHVQMzN3aVREU25 ": "Grupo Globo, one of Brazil's largest media conglomerates, is organizing special initiatives to celebrate its 100th anniversary. The company is planning commemorative projects and events to mark this significant milestone in its history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジョアン・フォンセカ：2025年に注目すべきブラジルのテニス新星", "title_en": "João Fonseca: Brazil's Tennis Star to Watch in 2025", "summary_ja": "O Globoはジョアン・フォンセカをブラジルの最も有望なテニス選手として取り上げています。2025年に国際的なテニス界での大きな飛躍が期待されています。", "summary_en": "O Globo highlights João Fonseca as Brazil's most promising tennis talent heading into 2025. The young player is expected to make significant strides on the international circuit this year.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE1MNWptTnpaTlFMQTc3WmpTYXdqMVluczNiTHhZQUotNnJoRWZydHZtdm1HdjJqOGVQXzFNT0t6cUZzODBVV3F0TmZDNTNCQVdrUmRQWDdtR1ZYLXMtMURzUnU5Y0RnS3U3eWc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ティヌブ大統領夫人が食糧不安対策の国家コミュニティ食料銀行を開設", "title_en": "First Lady Tinubu Launches National Community Food Bank to Combat Food Insecurity", "summary_ja": "ナイジェリアのオルレミ・ティヌブ大統領夫人が、オグン州で南西部地域の国家コミュニティ食料銀行を開設した。このプログラムは6歳未満の子ども、妊婦、授乳中の母親など脆弱層を対象としている。ティヌブ大統領の「希望の更新」アジェンダの一環として、食糧安全保障と人間資本開発を推進する取り組みである。", "summary_en": "Nigeria's First Lady Oluremi Tinubu inaugurated the South-West Zonal National Community Food Bank in Ogun State, targeting vulnerable populations including children under six, pregnant women, and lactating mothers. The program aims to ensure sustained access to nutritious food and aligns with President Tinubu's Renewed Hope Agenda focused on food security and human capital development. State governors in the South-West are encouraged to replicate the initiative in partnership with the National Primary Health Care Development Agency.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/903898-oluremi-tinubu-flags-off-national-community-food-bank-commissions-pmb-estate-in-ogun.html", "state_media": false, "category": "政治", "full_text": "The First Lady of Nigeria, Mrs Oluremi Tinubu, on Tuesday launched the South-West Zonal National Community Food Bank in Ogun State, urging state governments across the region to replicate the initiative to strengthen the fight against food insecurity and malnutrition.\nSpeaking at the launch held at the June 12 Cultural Centre, Kuto, Abeokuta, Mrs Tinubu said the programme was designed to ensure that vulnerable Nigerians, particularly children and pregnant and lactating women, have sustained access to nutritious food.\nShe called on governors in the South-West to establish community food banks in their respective states in partnership with the National Primary Health Care Development Agency (NPHCDA), stressing that such collaboration would facilitate the supply of food items and provide the operational support needed to sustain the initiative.\nThe First Lady described the National Community Food Bank Programme as a deliberate and sustainable response to food insecurity and malnutrition among vulnerable households, noting that it specifically targets children under six years of age, pregnant women and lactating mothers.\nShe expressed optimism that the programme would be sustained, saying its ultimate objective was to ensure that every Nigerian child is adequately nourished and given a healthy foundation for the future.\nAccording to her, the initiative is consistent with the Renewed Hope Agenda of President Bola Ahmed Tinubu’s administration, particularly its commitment to food security, improved healthcare, social protection and human capital development.\nMrs Tinubu commended Ogun State Governor, Prince Dapo Abiodun, for his commitment to the welfare and development of the people, citing the newly commissioned Gateway Medical Centre of Excellence and the President Muhammadu Buhari Estate as examples of projects that directly impact citizens’ lives.\nShe also clarified the distinction between a food bank and a food hub, explaining that the food bank is specifically designed to serve disadvantaged and vulnerable persons, with services provided free of charge.\nShe stressed that state governments were expected to take ownership of the facilities, adding that the Federal Government’s vision extended beyond the establishment of the initial food banks.\nThe First Lady further advocated locating food banks close to Primary Healthcare Centres to make them easily accessible to vulnerable families.\nIn his remarks, the chief host, Governor Dapo Abiodun, said the programme demonstrated the shared vision and common purpose of the Federal Government and Ogun State in building a more prosperous and inclusive Nigeria.\nHe said the President Muhammadu Buhari Estate and the Gateway Medical Centre of Excellence were in keeping with the Renewed Hope Agenda, which, he noted, was not merely about formulating policies but translating government intentions into tangible improvements in the lives of citizens through housing, healthcare, nutrition, social protection and human capital development.\nGovernor Abiodun said the philosophy underpinning his administration’s Building Our Future Together agenda was founded on the belief that government must create an environment where citizens can live with dignity, access essential services, pursue legitimate aspirations and face the future with confidence.\nHe maintained that development loses its moral value when economic growth rises while the basic needs of the people remain unmet.\nAccording to him, the true measure of government is not only the number of projects commissioned but the number of lives positively transformed by such projects.\n“The hospitals become useful when they save lives; the houses fulfil their purpose when they shelter families,” he said.\nGovernor Abiodun also said locating food banks within Primary Healthcare Centres would enable government to identify vulnerable households more effectively, support children at risk of malnutrition, assist pregnant women and nursing mothers, and ensure that interventions reached those who needed them most.\nIn his goodwill message, the Minister of Agriculture and Food Security, Abubakar Kyari, said the National Community Food Bank Programme would not only provide food to vulnerable Nigerians but also create a sustainable link between farmers and consumers.\nHe said the initiative reflected the commitment of the Tinubu administration to tackling food insecurity while protecting the dignity of vulnerable families.\nMr Kyari noted that food security was no longer being treated as a sectoral issue under the present administration, recalling that President Tinubu had declared a state of emergency on food security and placed the issue at the centre of the Renewed Hope Agenda.\nHe explained that the significance of the Community Food Bank Programme went beyond food distribution, as the initiative was also designed to strengthen agricultural production through structured procurement and distribution.\n“A food bank that hands out food solves a meal. A fo", "translation_ja": "", "vocab": [{"word": "vulnerable", "definition": "傷つきやすい、弱い立場にある人々を指す。社会的・経済的に支援が必要な層を表現する際に使用される。"}, {"word": "sustain", "definition": "継続させる、維持する。長期的に支援や供給を継続することを意味する。"}, {"word": "facilitate", "definition": "容易にする、促進する。プロセスやサービスの提供をスムーズに進めることを指す。"}, {"word": "replicate", "definition": "複製する、繰り返す。他の地域や機関が同じモデルやプログラムを導入することを意味する。"}, {"word": "tangible", "definition": "具体的な、実際に触れられる。政策や計画が実際の結果や改善をもたらすことを表す。"}, {"word": "procurement", "definition": "調達、購入。必要な物資や食料を計画的に入手するプロセスを指す。"}, {"word": "malnutrition", "definition": "栄養不良、栄養失調。十分な栄養を摂取できていない状態を医学的に表現する用語。"}]}, {"title_ja": "ミンナでの殺人事件で4人逮捕—30歳男性が刺殺される", "title_en": "Four arrested over killing of 30-year-old man in Minna", "summary_ja": "ナイジェリア警察は、8月10日にニジェール州ミンナで起きた30歳のサンデー・パダさんの刺殺事件に関連して4人の容疑者を逮捕した。被害者が窃盗犯と誤認される警報がきっかけで襲撃が発生した。容疑者らは刑事共謀および過失致死罪で調査されている。", "summary_en": "Nigerian police arrested four suspects in connection with the stabbing death of Sunday Pada, 30, in Minna, Niger State on August 10. An alarm falsely accusing the victim of theft allegedly triggered the attack. The suspects are being investigated for criminal conspiracy and culpable homicide.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/regional/north-central/903888-four-arrested-over-killing-of-man-30-in-minna.html", "state_media": false, "category": "社会", "full_text": "The police have arrested four suspects in connection with the alleged killing of a 30-year-old man, Sunday Pada, in the Korokpan area of Minna, Niger State.\nPada, a resident of Gogala village in Shiroro Local Government Area, was allegedly attacked and stabbed to death on 10 August, according to the police.\nThe Police Public Relations Officer in the state, Wasiu Abiodun, disclosed this in a crime bulletin issued on Tuesday.\nAbiodun said the incident occurred at about 6:30 a.m. when some persons in the Korokpan area allegedly attacked the victim.\n“Police operatives attached to Paiko Division moved to the scene, but the suspects had escaped before their arrival,” he said.\nThe victim was subsequently rushed to a nearby hospital, where he was confirmed dead.\nFour suspects arrested\nThe police said the suspects were later identified after three of them were found in the custody of the National Drug Law Enforcement Agency (NDLEA) following a sting operation conducted in the area.\nThe three suspects were released to the police, while another was arrested.\nThey were identified as Ibrahim Abubakar, Aliyu Onah, Godwin Musa, and Aminu Bawa, all residents of Korokpan, Minna.\nThe command said preliminary investigation revealed that the deceased was returning from a friend’s house when an alarm was raised, allegedly accusing him of being a thief.\nThe suspects reportedly intercepted him, beat him severely and subsequently stabbed him.\nThe four suspects are currently being investigated at the State Criminal Investigation Department (SCID), Minna, for alleged criminal conspiracy and culpable homicide.\nThe police said the investigation was ongoing.\nMob action raises concern\nThe incident has again drawn attention to the dangers of mob action and the growing concern over residents taking the law into their own hands following unverified allegations of criminality.\nThe police urged members of the public to report suspected criminality to law enforcement agencies rather than resorting to violence against alleged offenders.\nThe command said the suspects would be prosecuted upon completion of the investigation if sufficient evidence was established against them.\nThe suspects, however, remain presumed innocent until proven guilty by a court.\nOther arrests and recoveries\nThe case was among several incidents highlighted by the police command in its latest crime bulletin.\nIn a separate operation, the command said its operatives recovered an AK-47 rifle and ammunition along a suspected bandit route near Krusha-Genu village in Rijau Local Government Area.\nThe recovery was made on August 15 at about 7:30 p.m. following intelligence that firearms and ammunition had been concealed in the bush.\nPolice tactical operatives led by the divisional police officer in Rijau recovered the rifle, a magazine containing 19 rounds of live ammunition, another empty magazine and 55 rounds of GPMG anti-aircraft ammunition.\nThe command said the recovered weapons were in police custody and undergoing forensic analysis, while joint clearance operations against banditry had been intensified.\nSuspected animal thieves arrested\nThe police also reported the arrest of three suspects in connection with an alleged criminal conspiracy and the theft of animals in Gidan-Kwano, Minna.\nThe suspects — Danlami Ali, 45; Sabastine Masangu, 49; and Masaud Abdullahi, 35 — were arrested on 11 August after police operatives and vigilantes intercepted a black, tinted Volkswagen vehicle suspected to have been used by a criminal syndicate.\nAnimal skins suspected of having been obtained from stolen animals were allegedly recovered from the vehicle.\nAccording to the police, preliminary investigation indicated that the suspects allegedly specialised in stealing goats and other animals within the community.\nFour arrested over alleged fake online investment scheme\nFour other suspects were arrested in Farm Centre, Minna, over alleged criminal conspiracy, extortion and fraud involving a purported QNET online investment scheme.\nThe suspects were identified as Ringim Magaji, Umar Laduwa, Bashir Abdullahi, and Ibrahim Bello.\nThe police said the victim had travelled from Kano to Minna for an alleged job offer.\nUpon arrival, the suspects allegedly took him to a house in Farm Centre and demanded ₦200,000 for an online investment.\nThe victim reportedly insisted that he had travelled to Minna for employment, not for investment.\nThe police alleged that the suspects intimidated him and compelled him to transfer ₦200,000 to an account belonging to one Aminu Bello.\nThey allegedly demanded an additional ₦200,000, but the victim refused and was reportedly slapped.\nThe victim later escaped from the house during prayer time and was intercepted by police operatives, who subsequently took his statement.\nThe suspects are being investigated at the SCID, Minna.\nSuspected highway thieves arrested\nThe command also reported the arrest of two suspects over alleged theft from articulated vehicles along the Mokwa-Jeb", "translation_ja": "", "vocab": [{"word": "culpable homicide", "definition": "法的には故意ではない殺人。過失や軽率な行為により人を死亡させた罪で、謀殺より軽い犯罪。"}, {"word": "sting operation", "definition": "警察が囮を使って違法行為を誘発・摘発する作戦。犯人を現行犯で逮捕するための戦術。"}, {"word": "forensic analysis", "definition": "法廷科学に基づく分析。証拠物の科学的調査により犯罪解明に用いられる技術。"}, {"word": "mob action", "definition": "群集による無秩序で暴力的な行動。法制度を無視して大衆が自力救済する行為。"}, {"word": "tactical operatives", "definition": "特定の作戦目標達成のために訓練された警察や軍の特殊部隊員。戦術的に重要な任務を遂行する要員。"}, {"word": "presumed innocent", "definition": "被告人が有罪と証明されるまでは無罪と推定される原則。法治国家における基本的人権。"}]}, {"title_ja": "ゼニス銀行、ナイジェリアの非石油輸出の可能性を解き放つテーマで第10回国際貿易セミナーを開催", "title_en": "Zenith Bank Hosts 10th International Trade Seminar on Nigeria's Non-Oil Exports", "summary_ja": "ゼニス銀行は2026年8月25日に第10回国際貿易セミナーを開催し、政策立案者、輸出業者、投資家が集まってナイジェリアの非石油輸出の可能性を引き出すための戦略を議論します。このバーチャルイベントにはAfCFTA事務局長を含むスピーカーが登壇し、競争力のあるバリューチェーンの構築、市場アクセスの拡大、アフリカ大陸自由貿易地域の活用に焦点を当てます。貿易円滑化、輸出ファイナンス、税関効率性、およびナイジェリア企業が地域統合の機会をいかに活用できるかについて議論されます。", "summary_en": "Zenith Bank will host its 10th International Trade Seminar on August 25, 2026, bringing together policymakers, exporters, and investors to discuss strategies for unlocking Nigeria's non-oil export potential. The virtual event will feature speakers including the AfCFTA Secretary-General and focus on building competitive value chains, expanding market access, and leveraging the African Continental Free Trade Area. Discussions will address trade facilitation, export financing, customs efficiency, and how Nigerian businesses can capitalize on regional integration opportunities.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/promoted/903886-zenith-bank-to-host-10th-international-trade-seminar-on-unlocking-nigerias-non-oil-export-potential.html", "state_media": false, "category": "経済", "full_text": "Zenith Bank Plc will host the 10th edition of its International Trade Seminar on Non-Oil Export on Tuesday, 25 August 2026, bringing together leading policymakers, regulators, exporters, manufacturers, investors and other key stakeholders to explore practical strategies for unlocking value and accelerating growth in Nigeria’s non-oil export sector.\nThemed “Unlocking Value and Harnessing Growth in Non-Oil Export”, the virtual seminar will examine how Nigeria can move beyond exporting raw commodities to build globally competitive value chains, expand market access, strengthen trade infrastructure and financing, and deepen the contribution of non-oil exports to sustainable economic growth.\nThe high-level event will feature an impressive line-up of guest speakers, including the Secretary-General of the African Continental Free Trade Area (AfCFTA) Secretariat, H E Wamkele Mene; the Chief Executive Officer of Plot Enterprise Ghana Limited, Mrs Patricia Poku-Diaby; and the immediate past President and Chairman of the Board of Directors of the African Export-Import Bank (Afreximbank), Professor Benedict Oramah.\nThe seminar will also convene leading voices from the public and private sectors in two panel discussions. The first panel, dedicated to public sector perspectives, will bring together key stakeholders driving Nigeria’s trade, export, investment and economic development agenda. It will feature the Managing Director/Chief Executive of the Nigerian Export-Import Bank (NEXIM Bank), Mr Abba Bello; the Comptroller-General of the Nigeria Customs Service, Mr Adewale Adeniyi; the Director, Trade and Exchange Department, Central Bank of Nigeria, Ms Aderinola Shonekan; the Executive Secretary/Chief Executive Officer of the Nigerian Investment Promotion Commission (NIPC), Mrs Aisha Rimi; and the Executive Director/Chief Executive Officer of the Nigerian Export Promotion Council (NEPC), Mrs Nonye Ayeni.\nThe second panel, focused on private sector perspectives, will feature the Managing Director/Chief Executive Officer of Starlink Global & Ideal Limited, Mr Adeniji Adeyemi; the Group Executive Director, Dangote Group, Mr Sada Ladan-Baki; Senior Consultant at 3T Impex Trade Centre, Mr Bamidele Ayemibo; the Managing Director of Terra Aqua Environmental Consultancy Nigeria Limited, Mr Mobolaji Salako; the Managing Director/Chief Executive Officer of RMM Global, Mr Ramzi Taher; and the Managing Director/Chief Executive Officer of Lelook Nigeria Limited, Mrs Chinwe Ezenwa.\nThe discussions will offer practical perspectives on trade facilitation, export financing, customs and port efficiency, regulation, market access, and the competitiveness of Nigerian businesses in regional and global markets.\nA key focus of the seminar will be the African Continental Free Trade Area and its potential to open up a larger market for Nigerian goods and services while deepening intra-African trade. With the AfCFTA offering businesses access to a market of more than one billion people, the discussions will examine how Nigerian enterprises can leverage regional integration, build competitive value chains and seize emerging opportunities across the continent.\nZenith Bank has consistently championed conversations around trade and economic development. It remains at the forefront of efforts to support businesses seeking to participate more effectively in regional and international commerce. The Bank has also partnered with the AfCFTA Secretariat on initiatives to facilitate cross-border trade and expand access to opportunities across Africa.\nNow in its 10th edition, the Zenith Bank International Trade Seminar has evolved into a leading platform for high-level dialogue on Nigeria’s trade and export ecosystem. Over the years, the seminar has brought together government, regulators, businesses, financial institutions, and other stakeholders to examine emerging trends, identify challenges, and proffer practical solutions to strengthen Nigeria’s position in global commerce.\nThe 2026 edition will build on this legacy, convening some of the most influential voices shaping Nigeria’s trade, investment and economic landscape around one critical question: how can Nigeria unlock greater value from its non-oil exports and translate its vast productive potential into sustainable economic growth?\nThe seminar will be held virtually and streamed live on Zoom, YouTube, Instagram, Facebook, X, and TikTok, enabling participants in Nigeria and around the world to join the conversation. Interested participants can register at our WEBSITE.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "non-oil export", "definition": "石油以外の商品やサービスの輸出。経済を石油依存から多様化させることを目的とした貿易活動を指す。"}, {"word": "value chain", "definition": "製品やサービスが生産から消費者に到達するまでのすべてのプロセスと活動の連鎖。グローバルな競争力を高めるために最適化される。"}, {"word": "trade facilitation", "definition": "税関手続きの簡素化や国境での効率化を通じて、国際貿易をスムーズにするための政策と施策。"}, {"word": "intra-African trade", "definition": "アフリカ大陸内の国々間における商品やサービスの交易。地域経済統合と発展を促進する。"}, {"word": "competitiveness", "definition": "企業や国が国際市場で他の競争相手と比較して製品やサービスの価値を提供する能力。"}, {"word": "leverage", "definition": "特定の資源や状況を有利に活用して、最大の利益や成果を得ること。"}]}, {"title_ja": "ロシア占領下ウクライナから息子を救い出そうとする母親の闘い", "title_en": "A Mother's Quest to Rescue Her Son From Russian-Occupied Ukraine", "summary_ja": "母親は東ウクライナの戦争により3年間の離別を経た息子との再会を目指し、危険な任務に挑む。彼らの苦難は紛争によって引き裂かれた数千の家族の苦しみを反映している。この物語は、ロシア占領地からの脱出を求める人々の絶望と決意を映し出している。", "summary_en": "A mother undertakes a risky journey to reunite with her son after three years of separation caused by the war in eastern Ukraine. Their ordeal reflects the struggles of thousands of families torn apart by the conflict. The story captures the desperation and determination of those seeking to escape Russian-occupied territories.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/18/world/europe/ukraine-russia-rescue.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの経済的制限がパレスチナ自治区の経済を圧迫", "title_en": "Israel's Financial Restrictions Threaten West Bank Economy and Palestinian Authority", "summary_ja": "イスラエルがパレスチナ自治区に対する経済的制限を強化しており、領土の経済活動のあらゆる側面に影響を与えている。この措置はパレスチナ自治政府の財政健全性維持と機能継続能力について懸念を招いている。", "summary_en": "Israel has intensified financial restrictions on the West Bank that are affecting all aspects of the territory's economic activities. The measures are raising concerns about the Palestinian Authority's ability to maintain solvency and continue functioning.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/18/world/middleeast/west-bank-economy.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コロンビア・チョコ州、地震後さらに深刻な困難に直面", "title_en": "Chocó, Colombia Faces Deeper Hardship After Earthquake", "summary_ja": "コロンビアの辺境地域チョコ州は先週の地震の深刻な影響に苦しんでおり、州知事によれば生存者は痛み、飢饉、そして家を失う危機に直面している。シャキーラなどの著名人が被災地を訪問し、影響を受けたコミュニティの人道的支援の必要性に対する国際的な関心が高まっている。", "summary_en": "The remote Chocó region in Colombia is struggling with severe aftermath following last week's earthquake, with survivors facing pain, hunger, and homelessness according to the governor. International attention has been drawn to the crisis, with notable figures like Shakira visiting to raise awareness about the humanitarian needs of affected communities.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/18/world/americas/colombia-earthquake-choco.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが人質解放問題の打開後、ガザ北部への通路を開放", "title_en": "Palestinians Return to Northern Gaza After Military Crossing Reopens", "summary_ja": "イスラエルは人質解放をめぐる行き詰まりが解決された後、ガザを二分する軍事地帯を横切ることを許可し、避難していたパレスチナ人の帰還が始まった。数千人のガザ住民が徒歩で自分たちの家に戻ることができるようになっている。この決定は飛び地内の人道状況における重要な展開を示している。", "summary_en": "Israel has permitted displaced Palestinians to cross through a military zone that divides Gaza following a resolution to the hostage release deadlock. This marks a significant development in the humanitarian situation within the enclave. Thousands of Gazans are now able to return to their homes on foot.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の拡大を示唆", "title_en": "Leading China Property Developer Reports Huge Loss Amid Widening Real-Estate Crisis", "summary_ja": "中国最大級の不動産開発企業である万科が巨額の損失を報告し、不動産セクター危機の深刻化への懸念が高まっている。経営上の課題は、中国政府が問題を抱える業界の安定化に介入するかどうかについての疑問を浮き彫りにしている。万科の経営難は、より広範な不動産市場全体への波及効果の可能性を示唆している。", "summary_en": "Vanke, one of China's largest property developers, has reported significant losses, raising concerns about the deepening real-estate sector crisis. The financial troubles highlight questions about whether the Chinese government will intervene to stabilize the troubled industry. Vanke's struggles signal potential contagion effects across the broader property market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、依然として10月7日の攻撃による破片を体内に保持", "title_en": "Freed Israeli Hostages Recover From Wounds and Months in Captivity", "summary_ja": "ガザから解放されたイスラエル人人質は、イスラエル医療当局者によると、依然として10月7日の攻撃による破片を体内に保持している。一部の女性は長期間孤立した状態で拘束され、地下トンネル内で最大8ヶ月間閉じ込められていた。人質たちは苦難からの回復のため医療治療を受けている。", "summary_en": "Released Israeli hostages freed from Gaza still carry shrapnel from the October 7 attack in their bodies, according to Israeli medical officials. Some women were held in isolation for extended periods and spent up to eight months confined in underground tunnels. The hostages are receiving medical treatment as they recover from their ordeal.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "迎撃ミサイルが枯渇したときに何が起こるか", "title_en": "What Happens When Interceptor Missiles Run Out", "summary_ja": "ウクライナおよび他国は迎撃ミサイルの深刻な不足に直面しており、防空能力に関する懸念が生じている。需要が生産を上回る中、供給の減少がパニックを引き起こしている。この不足は空中攻撃に対する防衛作戦を大幅に弱体化させる脅威となっている。", "summary_en": "Ukraine and other nations face a critical shortage of interceptor missiles, raising concerns about air defense capabilities. The dwindling supply is creating panic as demand for these weapons outpaces production. This shortage threatens to significantly weaken defensive operations against aerial attacks.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/what-happens-when-interceptor-missiles-run-out", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エコノミスト、パーソナライズされた新しいニュースレターを導入", "title_en": "The Economist Launches Personalized Newsletter for Subscribers", "summary_ja": "エコノミスト誌は、購読者の受信箱に直接カスタマイズされた読書リストを配信する新しいパーソナライズニュースレター「The Economist for You」を開始しました。このサービスは個々の関心と読書の好みに基づいてコンテンツの推奨事項を調整します。この取り組みは、より適切で関連性の高いニュース体験を提供することで読者エンゲージメントの向上を目指しています。", "summary_en": "The Economist has introduced a new personalized newsletter called \"The Economist for You\" that delivers customized reading lists directly to subscribers' inboxes. The service tailors content recommendations based on individual interests and reading preferences. This initiative aims to enhance reader engagement by providing a more curated and relevant news experience.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/18/introducing-our-latest-newsletter-the-economist-for-you", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "シリコンバレーのAIブームがアメリカ慈善事業を変革", "title_en": "Silicon Valley's AI Boom Reshapes American Charity", "summary_ja": "シリコンバレーのAI起業家たちが数千億ドルの慈善寄付を約束し、アメリカの慈善事業の風景が大きく変わろうとしている。本記事は、これらの巨額の寄付がどのように配分され、社会にどのような影響を与えるのかを検証している。新たなテック業界による寄付の有効性と優先事項について、重要な疑問が残されている。", "summary_en": "AI founders in Silicon Valley have pledged to donate hundreds of billions of dollars to charitable causes, marking a significant shift in philanthropic landscapes. The article examines how these massive commitments will be allocated and what impact they may have on American society. Key questions remain about the effectiveness and priorities of this new wave of tech-driven giving.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/08/13/silicon-valleys-ai-boom-is-remaking-american-charity", "state_media": false, "category": "IT", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ラジオ局と秘密学校：タリバン統治下のアフガン女性の生存戦略", "title_en": "Afghan Women Survive Through Radio Station and Underground Schools", "summary_ja": "女性によって運営されるラジオ・ベグムは、タリバン政権下で孤立するアフガン女性にとって重要な情報源となっている。この放送局と秘密学校は、厳しい制限に直面する少女たちに教育と外部世界との繋がりを提供する草の根的な取り組みを代表している。", "summary_en": "Radio Begum, a women-run radio station, serves as a vital lifeline for Afghan women isolated under Taliban rule. The station and underground schools represent grassroots efforts to provide education and connection to the outside world for young girls facing severe restrictions.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/summer-reads/article/2026/08/18/afghan-women-fight-and-invent-strategies-to-survive-a-women-s-radio-station-and-underground-schools-offer-glimmers-of-hope_6756645_183.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、ICC事務局長と上級法廷弁護士に制裁を課す", "title_en": "US Imposes Sanctions on ICC President and Senior Trial Lawyer", "summary_ja": "米国は国際刑事裁判所（ICC）のトモコ・アカネ事務局長と上級法廷弁護士のアブドゥラエ・セイ氏に制裁を課しました。この措置はハーグを拠点とする国際刑事裁判所に対するワシントンの最新の行動です。制裁は米国とICCの間の継続的な緊張関係を反映しています。", "summary_en": "The United States has sanctioned International Criminal Court President Tomoko Akane of Japan and ICC Senior Trial Lawyer Abdoulaye Seye of Senegal. This move represents Washington's latest action against the Hague-based court. The sanctions reflect ongoing tensions between the US and the ICC.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/18/us-imposes-sanctions-on-icc-president_6756646_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、北朝鮮への融和姿勢を示唆し韓国との合同軍事演習を削減指示", "title_en": "Trump Signals Openness to North Korea, Orders Reduction of Joint South Korea Exercises", "summary_ja": "トランプ大統領は、北朝鮮の金正恩指導者との「非常に良好な関係」を理由に、国防長官ピート・ヘグセスに韓国との合同軍事演習を大幅に削減するよう指示した。この動きは北朝鮮との外交的関与の再開に向けた米国政策の転換を示しており、ソウルとの同盟関係の約束が損なわれる可能性がある。", "summary_en": "President Trump has instructed Defense Secretary Pete Hegseth to substantially reduce joint military exercises with South Korea, citing his 'very good relationship' with North Korean leader Kim Jong Un. The move represents a shift in U.S. policy toward renewed diplomatic engagement with North Korea, potentially at the expense of alliance commitments to Seoul.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/international/article/2026/08/18/trump-berates-ally-south-korea-and-signals-renewed-openness-to-kim-jong-un_6756623_4.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省", "title_en": "Mindef", "summary_ja": "提供されたエクセプトには、防衛省の発表またはニュース項目に関する実質的な内容が不十分です。正確な要約のため、完全な記事テキストを提供してください。", "summary_en": "Unable to generate summary. The provided excerpt contains insufficient substantive content about the Ministry of Defence announcement or news item. Please provide the complete article text for accurate summarization.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートは、毎日のニュースハイライトと主要な展開を提供します。購読者は提供されたリンクを通じてニュースレター登録を管理できます。", "summary_en": "The Straits Times Evening Update provides daily news highlights and key developments. Readers can manage their newsletter subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ストレーツ・タイムズのモーニング・ブリーフィングは、毎日のニュース更新と主要なストーリーを提供しています。読者は提供されたリンクを通じて、追加の無料ニュースレターを購読し、購読を管理できます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and key stories. Readers can subscribe to additional free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル軍、西岸地区での作戦拡大に伴い拘束されたパレスチナ人に番号を付与", "title_en": "IDF marks detained Palestinians with numbers as West Bank raids expand", "summary_ja": "イスラエル国防軍は、西岸北部での軍事作戦拡大に伴い、拘束されたパレスチナ人に番号を付与している。この慣行は、地域での強化された捜査中における被拘束者の扱いと身元確認について懸念を引き起こしている。", "summary_en": "The Israeli Defense Forces have been marking detained Palestinians with numbers during expanded military operations in the northern West Bank. The practice has raised concerns about the treatment and identification of detainees during the intensified raids in the region.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijwJBVV95cUxPa3loeG5MaE9ER0lrZ0g4a09QdFpyUDlBUEpBbWZMMUpWU0RYYzRfdkFlbzhuWGg5VlVxeFptZlNfQlNzMExBNzM0M2EwV0NRRFJpdzI4M3pwc2tGd0RYR2ZWZW50STE4dUUyVTU4ZzNMS19FekFaSkd2czh6LUpKQ1hDSUxIWjhvUDZYdEh5WHctT2ZJaFVKSzBYMU95SFdsUnE3REY4MnFST0Izb004OVdBVFlpYVl3Zm00aVE3WjlvOS1WbUJ0bUsxTjBzZm9NVTVleHBFeTlGeURqVmU0RDhhSWVtb2cyd1RuSTZRZVJUUUtuVDVoTmktZks5LVNKVDZIMTRMYndTSDg2VHhF?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルの改革派シナゴーグ「コル・ハネシャマ」が最悪の落書き被害", "title_en": "Israeli Reform Synagogue Kol Haneshama Vandalized in 'Worst Attack Yet'", "summary_ja": "イスラエルの有力な改革派シナゴーグ「コル・ハネシャマ」が、同施設における過去最悪の落書き被害を受けました。この事件は、国内の宗教宗派とコミュニティをめぐる継続的な緊張を浮き彫りにしています。", "summary_en": "Kol Haneshama, a leading Reform synagogue in Israel, has been vandalized in what authorities are describing as the worst attack on the institution to date. The incident highlights ongoing tensions surrounding religious denominations and communities in the country.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMijgJBVV95cUxPLVRobndSeU0wemthc2xLT3gzSmFXaW9OY2xuR0h1bFhLTTdQR1V1R3VBMlJRRjR6SEtPSm85WHc0clpYTndDSkpKaklmVDYza2ZjTHFWNGVZNFFZTTRkY1p1TXRGQl9VblRqM2p4TlBpMVI5VF91ME50WWlmd1l6ZTVXZFkzZ0xYY1JqajR2eXVSV3NZWDdTdi1qcjNVVUprNzg5U0RvZHQxbFRMYjNaZ1ZxUWhUa21tZmxHNlY2a1ppQ1VuQXBhb1JZVmZxV3FjV0Zzc1Z3Y2RleXJ4cXpYRHlhSnRLYzZvY0ItcGpfOUFUUEdDbjVJUDZBSnVyZlFTNlRhOWE0bWJHbHVfWlE?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエル警察、パレスチナ自治区からアオザルを没収", "title_en": "Israeli Police Confiscate Green Monkey From Palestinian-Controlled West Bank", "summary_ja": "イスラエル警察がパレスチナ自治区のヨルダン川西岸から飼育されていたアオザルを没収した。この事件は紛争地域における継続的な緊張と執行作戦を浮き彫りにしている。没収の経緯とサルの処遇に関する詳細は明らかになっていない。", "summary_en": "Israeli police have confiscated a green monkey that was being held in the Palestinian-controlled West Bank. The incident highlights ongoing tensions and enforcement operations in the disputed territory. Details regarding the circumstances of the confiscation and the monkey's fate remain unclear.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikwJBVV95cUxPdWpDTTk5Zlo1NVZ5cDYtdUp4Rm4tOEdWZ1dJZ2VTTVI3UnpmRTkwR0s0N2ZOdDZNZVdsTDNYeDhMdVRUOVZLV1BFWjBCM2cyU1hrY3p4UTlJaHpCNW1YTW1GQllyRDNWeTNDck9oMXJnVzBoaXRlVldmenFGcWJpTk16M1BGT1BhM2FPeWNyMjhHdUx0N0pvbmxXSDllQzlIY19zbVU4bGF6eEg1LUhZam1FbmlNTHdwNEYxazg2OWJtZlVrTFcySWVhcEM0b3N3VVlRaWxLMWVWNE1SR3NEMWMtcGdWY19KbzRULWRxRlZQdlJ0WFoxamxQa3lDRnVKTUQ3Z3lSWjBHVFdQS3ZIT2RZOA?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、2027年度予算に全国民向け1万台湾ドル給付金を盛り込む方針", "title_en": "Taiwan to Include Universal NT$10,000 Cash Handout in 2027 Budget", "summary_ja": "台湾の頼清徳総統は、2027年度の政府予算に全国民向けの1万台湾ドル給付金を盛り込む計画を発表した。この現金給付制度は世帯の支援と消費喚起を目的としている。適格性と実施時期の詳細は予算策定プロセス中に確定予定である。", "summary_en": "Taiwan President Lai Ching-te announced plans to include a universal NT$10,000 cash handout for all citizens in the 2027 government budget. The cash distribution initiative aims to support households and boost consumer spending. Details regarding eligibility and implementation timeline are expected to be finalized during the budget planning process.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE05XzRjUDdhQzJtSTNnVkJTdllxbHUxbkpHbXNIYUROOFJya08xcWRQdWVWcU9UTkd3bHVnYWR5ZjAxazZxYTdlUXlldFdIZkFPNTRmdHJkQQ?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "国民党がNT$10,000現金給付をめぐりライ総統の「二重基準」を非難", "title_en": "KMT Accuses Lai of 'Double Standard' Over NT$10,000 Cash Handout", "summary_ja": "台湾の野党である国民党は、ライ清徳総統がNT$10,000の現金給付プログラムに関して二重基準を適用していると批判している。野党は、この政策実施が政府の財政配分へのアプローチに矛盾があることを主張している。", "summary_en": "Taiwan's KMT party has criticized President Lai Ching-te for applying double standards regarding a NT$10,000 cash handout program. The opposition party claims the policy implementation shows inconsistency in the government's approach to fiscal distribution.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE15X05tSHNKeU51ZWlSZjVkeFZiYzZ4S2FCaXVMVllrWVlUMkpuVEtTM0VnT1ZnMm0zeTExSE1PS0J1dElXVWZFa3Y4MjZ4V3BOWi1Rb0YyZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フォーカス台湾 - CNA英語ニュース", "title_en": "Focus Taiwan - CNA English News", "summary_ja": "フォーカス台湾は、台湾の公式通信社である中央通信社（CNA）の英語ニュースサービスです。台湾およびアジア太平洋地域の時事、政治、ビジネス、文化に関する包括的なニュースカバレッジを提供しています。", "summary_en": "Focus Taiwan is the English news service of the Central News Agency (CNA), Taiwan's official news organization. It provides comprehensive coverage of current events, politics, business, and culture in Taiwan and across the Asia-Pacific region.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiO0FVX3lxTE9aU2ljbTc1d0Y3alZIY005T0hWTmZOTGpod3pXQU9zbm4yYjhoOXAzdy1WNGlxemk1bVU0?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "タンカー攻撃後、ホルムズ海峡の海運が減速", "title_en": "Shipping slows through Strait of Hormuz after tanker attacks", "summary_ja": "CGTNは、最近の地域内でのタンカー攻撃を受けて、ホルムズ海峡を通じた海運トラフィックが減少していると報じています。CGTNによれば、この事件は世界で最も重要な海運ルートの一つにおけるセキュリティについて、海運事業者の懸念を高めています。報道機関は、この減速が攻撃への警戒の高まりを反映していることを示しています。", "summary_en": "CGTN reports that shipping traffic through the Strait of Hormuz has decreased following recent tanker attacks in the region. The incidents have raised concerns among maritime operators about security in one of the world's most critical shipping routes. CGTN indicates that the slowdown reflects heightened caution in response to the attacks.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-17/news-1PFLiWyHYjK/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フィリピン南部の学校での銃撃事件で2人が殺害", "title_en": "Two killed in shooting at school in southern Philippines", "summary_ja": "CGTNは、フィリピン南部の学校での銃撃事件で2人が殺害されたと報じています。国営放送局は現時点では事件の詳細についての情報は限定的です。当局は銃撃事件の状況について調査を進めています。", "summary_en": "CGTN reports that two people were killed in a shooting incident at a school in southern Philippines. The state-controlled broadcaster provided limited details about the incident at this time. Authorities are investigating the circumstances surrounding the shooting.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-18/news-1PHAXdayWPe/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エクアドル大統領のノボア氏が中国を訪問、戦略的パートナーシップを強化", "title_en": "Ecuador's President Noboa to Visit China, Deepening Strategic Partnership", "summary_ja": "CGTNが報じるところによると、エクアドルのダニエル・ノボア大統領は今月中国への初の国賓訪問を予定している。この訪問は両国が包括的戦略的パートナーシップの10周年を迎える中で行われ、成長する貿易関係をより広範な協力へと発展させることを目指している。", "summary_en": "CGTN reports that Ecuadorian President Daniel Noboa is set to make his first state visit to China this month. The visit comes as the two countries mark a decade of their comprehensive strategic partnership and seek to expand their growing trade ties into broader cooperation.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-08-15/Noboa-s-China-visit-to-deepen-Ecuador-China-ties-1PD9CKiB1rW/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "大統領特使が議会への年次演説の一時停止を説明", "title_en": "Presidential Envoy Explains Pause in Annual Parliamentary Addresses", "summary_ja": "TASSが報じたところによると、大統領特使は議会への年次演説の中止について複数の理由を挙げており、即座の対応の必要性を強調している。同報道機関によれば、現在の状況は長期的な戦略計画よりも速やかな行動を要求しているという。", "summary_en": "TASS reports that a presidential envoy has cited multiple reasons for the suspension of annual addresses to parliament, with emphasis on immediate response requirements. According to the source, the current situation demands prompt action rather than long-term strategic planning approaches.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/politics/2174873", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "UAEがイランとの貿易・金融取引を停止", "title_en": "UAE Halts Trade and Financial Transactions with Iran", "summary_ja": "TASSの報道によると、アラブ首長国連邦はイランからの2発の弾道ミサイル発射をUAEの防空システムが検知したことを受けて、イランとの貿易・金融取引を停止した。UAE外務省によるこの決定は、セキュリティ上の脅威に対応したものとされている。この措置は両国間の緊張のエスカレーションを示すものである。", "summary_en": "TASS reports that the United Arab Emirates has suspended trade and financial transactions with Iran following the detection of two ballistic missile launches from Iranian territory by UAE air defense systems. The decision comes in response to what the UAE Foreign Ministry describes as a security threat. The move marks a significant escalation in tensions between the two nations.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/economy/2174871", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コロンビア地震の死者数が300人を超える", "title_en": "Death toll from Colombia earthquake exceeds 300", "summary_ja": "TASSの報道によると、コロンビアで発生した壊滅的な地震により300人以上が死亡し、426人が行方不明となっているとのこと。この災害は影響を受けた地域全体で多くの死傷者と避難者を出しているとされている。捜索・復旧作業が進行中と報じられている。", "summary_en": "TASS reports that a devastating earthquake in Colombia has resulted in over 300 deaths, with 426 people reported missing. The disaster has caused significant casualties and displaced numerous residents across affected regions. Rescue and recovery operations are reportedly ongoing.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2174869", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国的特色を持つ未来", "title_en": "A Future With Chinese Characteristics", "summary_ja": "著者は、米国の文化と輸出品がかつて戦後のヨーロッパ人に近代性を象徴していたのと同様に、中国が現在、アフリカ、ラテンアメリカ、さらにはアメリカの青年にとって未来のモデルとなっていると主張しています。世界は歴史的かつ文化的な断裂を経験しており、中国の影響力はハリウッドに代わる新たな未来像を提供しています。", "summary_en": "The author argues that China is replacing the United States as the global model for the future, similar to how American culture and exports once shaped post-WWII perceptions worldwide. Just as Hollywood and American consumer goods represented modernity to 20th-century Western Europeans, Chinese influence now provides a vision of the future to youth in Africa, Latin America, and even America itself.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/china-replacing-west-in-worlds-understanding-of-the-future-by-mark-leonard-2026-08", "state_media": false, "category": "オピニオン", "full_text": "A Future With Chinese Characteristics\nThe world is undergoing a historical and cultural rupture. Just as Hollywood and other American exports once gave the rest of the world a glimpse of modern life and the future that awaited them, China is now doing the same for African, Latin American, and even American young people.\nBERLIN—For much of the 20th century, the United States represented not just a place on the map. It was also a point in time. When Western Europeans looked at images of America after World War II—depictions of Hollywood’s glamor, American cars, and newfangled labor-saving devices—they thought they were looking into the future.", "translation_ja": "", "vocab": [{"word": "rupture", "definition": "急激な分裂や断絶のこと。政治的、文化的、または社会的な関係が突然に破綻する状況を指します。"}, {"word": "exports", "definition": "国外に販売・送出される商品やサービス、または一国の文化的影響力のこと。ここでは米国の映画や製品など文化的な発信を意味します。"}, {"word": "depictions", "definition": "物事を描写したり表現したりする方法。写真や映像、文学などを通じた表現形式を指します。"}, {"word": "glamor", "definition": "魅力的で洗練された美しさ。特に映画やファッション業界で使用され、華やかで憧れを抱かせる要素を表します。"}, {"word": "newfangled", "definition": "新しく発明されたばかりの、または新奇な物事。時に古い価値観を持つ人からは懐疑的に見られる新しい技術や方法を指します。"}]}, {"title_ja": "プーチン大統領は打つ手がなくなった", "title_en": "Putin Has Run Out of Moves", "summary_ja": "ロシアは成長率1%未満、インフレ率6%以上の長期的なスタグフレーションに直面しており、ウクライナの無人機によるエネルギーインフラへの攻撃によって悪化している。経済的困難にもかかわらず、プーチンは予算赤字を対GDP比2.8%まで膨らませ、財政規律を放棄した。著者は、ウクライナとの戦争を終わらせることが経済回復への唯一の実行可能な道であると主張しているが、プーチンがそれを追求する可能性は低い。", "summary_en": "Russia faces prolonged stagflation with growth below 1% and inflation above 6%, compounded by Ukrainian drone strikes on energy infrastructure. Despite economic hardship, Putin has allowed the budget deficit to balloon to 2.8% of GDP, abandoning fiscal prudence. The author argues that ending the war in Ukraine is the only viable path to economic recovery, but Putin is unlikely to pursue it.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/russian-economy-facing-stagflation-fiscal-and-financial-instability-by-anders-aslund-2026-08", "state_media": false, "category": "オピニオン", "full_text": "Putin Has Run Out of Moves\nEven with the Russian economy suffering from low growth, high inflation, and relentless Ukrainian long-range drone strikes on energy infrastructure, President Vladimir Putin has thrown fiscal caution to the wind and allowed the government’s budget deficit to balloon to 2.8% of GDP. It isn’t likely to end well.\nMUNICH—The broad consensus among Russia-watchers is that the country is facing a prolonged bout of stagflation. Growth this year is unlikely to exceed 1%, and inflation is still stuck at 6% (or more). Moreover, the most promising option for reviving the economy is the least likely to be pursued, because it requires President Vladimir Putin’s willingness to end the war on Ukraine.", "translation_ja": "", "vocab": [{"word": "stagflation", "definition": "経済成長の鈍化とインフレーションが同時に起きる現象。通常は相反する経済指標が同時に悪化する異常な状態を指す。"}, {"word": "fiscal caution", "definition": "政府支出や赤字の増加を慎重に抑える財政政策。健全な財政管理の姿勢を表す。"}, {"word": "budget deficit", "definition": "政府収入が支出を下回る状態。マイナスの予算バランスで、通常は経済的な課題とされる。"}, {"word": "relentless", "definition": "絶え間ない、容赦ない状態を表す。継続的で弱まることのない勢いを意味する。"}, {"word": "reviving", "definition": "衰退した状態から回復させること。経済や産業などの再興や蘇生を指す。"}, {"word": "consensus", "definition": "複数の人々や専門家による一般的な意見や合意。広く認められている見方を表す。"}]}, {"title_ja": "AI統治への地政学的な足かせ", "title_en": "The Geopolitical Drag on AI Governance", "summary_ja": "トランプ政権が多国間協力よりも国家競争力を優先する決定により、グローバルなAI統治が分断化され、中国が WAICO を通じて独自の AI 協力枠組みを確立する余地が広がった。しかし、中国のイニシアチブは真の国際協力ではなく、地政学的野心によって等しく駆動されており、進歩ではなく懸念すべき転換を示している。", "summary_en": "The Trump administration's focus on national competitiveness over multilateral cooperation has fragmented global AI governance, creating space for China to establish its own AI cooperation framework through WAICO. However, China's initiative is equally driven by geopolitical ambitions rather than genuine international collaboration, representing a concerning shift rather than progress.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-and-china-view-ai-governance-through-geopolitical-lens-by-gabriela-ramos-2026-08", "state_media": false, "category": "オピニオン", "full_text": "The Geopolitical Drag on AI Governance\nThe Trump administration’s decision to prioritize national competitiveness over multilateral frameworks has deepened the fragmentation of AI governance—and expanded the opening for China to organize its own system. But China's approach is similarly shaped primarily by its own geopolitical ambitions.\nPARIS—Last month, China announced the creation of the World Artificial Intelligence Cooperation Organization, a 38-country platform focused on AI cooperation, bridging the AI divide by supporting innovation and deployment in developing countries. WAICO marks a turning point, but not the one the world needs.", "translation_ja": "", "vocab": [{"word": "fragmentation", "definition": "システムや組織が分割・分断される状態。ここでは、AI統治の世界的な一体性が失われ、複数の独立した枠組みに分かれることを意味する。"}, {"word": "multilateral", "definition": "複数の国や団体が関わる。単一国ではなく、多くの国が対等に参加する枠組みや協力を指す。"}, {"word": "geopolitical", "definition": "地政学的な、つまり国家間の権力関係や地理的利益に基づいた政治戦略に関わる。国際関係における力学を扱う。"}, {"word": "ambitions", "definition": "野心、または達成したいという強い欲望。政治的文脈では、国家が権力や影響力を拡大しようとする目標を指す。"}, {"word": "cooperation organization", "definition": "協力を目的とした国際的な組織。複数国が共通の目標に向けて協働するための制度的な枠組みを指す。"}, {"word": "deployment", "definition": "システムやリソースを配置・展開する。技術文脈では、開発された技術を実際の環境で運用することを意味する。"}]}, {"title_ja": "デート費用があなたを愛から遠ざけるべきではない理由", "title_en": "Don't Let Dating Costs Stop You From Finding Love", "summary_ja": "Dave Schillingは、Z世代にとってデートが高額になっているが、経済的な懸念のために関係を避けるべきではないと主張しています。彼は低予算のデートの代替案を勧め、完璧な状況よりも本物のつながりの方が価値があることを強調し、経済的困難にもかかわらず誠実に愛を追求することを促しています。", "summary_en": "Dave Schilling argues that while dating has become expensive for Gen Z, people shouldn't avoid relationships due to financial concerns. Instead, he recommends affordable date alternatives and emphasizes that genuine connection is more valuable than perfect circumstances, encouraging people to pursue love honestly despite economic hardship.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/17/dating-gen-z-romance-expensive", "state_media": false, "category": "オピニオン", "full_text": "A couple of months ago, I wrote a column imploring young people to keep trying to find love, to not become cynical about romance and avoid the temptation of the accursed “loneliness influencers” peddling antisocial behavior as some sort of newfangled experiment that no one had thought of before. I stand here today saying, hey, I can’t be right all the time. Maybe it is better to be alone, since it costs a hell of a lot less.\nApparently, young people across the country are forgoing dating because it’s too damn expensive. Or at least, I think they are, based on the multiple newspaper articles saying so that came out in the last two weeks. As the New York Times put it, the “prospect of a tab of $150 or more for two entrées, two drinks, an appetizer and tip” is too pricey for many gen Z singles. I say, only $150? Where are you going, Chili’s? I went on a date with (shameful brag incoming) a very famous political figure from the late 90s and spent twice that amount, sending my bank account into cardiac arrest. I practically begged her to get dessert, even though it was clear our decade of age difference and general lack of chemistry meant I was better off going home and journaling about it. I paid for the whole thing, and in return, I got an amazing story to tell at parties.\nDating is akin to gambling, in that it costs a lot and there’s no guarantee you’ll get anything out of it. I’m not suggesting that the money one spends on a date should entitle that person to love. That’s absurd and antithetical to the entire modern conception of romance as a mutual experience shared by two people with equal agency. Rather, I’m saying that you’re better off enjoying the meal than worrying about the outcome. At least you’ll feel like you got your money’s worth.\nAnd anyway, in a huge city like mine, there’s no need to go for the $150 dinner. Numerous affordable date options exist: free museums, art galleries, parks, the beach. You can make anything a date, as long as it affords you the opportunity to assess compatibility. Sitting in traffic on the 10 freeway at rush hour could be a date if you wanted it to be. You could stand outside a restaurant for 30 minutes and never go in. You could ride an elevator in a large building up and down, then see if sparks fly. If so, just hit the emergency button and spend the time waiting for the fire department, doing as you please.\nThe real problem isn’t if you’re both broke, though. In that scenario, both participants in the relationship can agree to be thrifty. The trouble comes when one person is doing significantly better financially. In my last relationship, I was the broke writer and she was, well … not. Self-employed creative types sometimes have down months (or in my case, years). What started as a pairing of equals quickly turned into me wincing every time the check came.\nSome think you absolutely shouldn’t date if you’re unemployed, that you should lock yourself in a cage and wear a chastity belt if you have to leave the house. I suppose that would at least save people the embarrassment I went through, as my savings dwindled and my girlfriend tried to reassure me that it was actually fine that she was paying for everything. Better, then, to wait until your life is more settled and you can go back to blowing your money on extravagant evenings again.\nI see the wisdom in that. Dating can be a huge distraction. A whole other human being requires not just your money, but your time and emotional support. With the economy as troubled as it is, more and more people are having to decide if they can actually afford to be in love, or if they’ll end up like me, a freeloader happy to take what he can get. Maybe I’m being a bit hard on myself here, but guilt is kind of my thing.\nBut there’s never a good time to date. There’s no more convenient time to love and be loved. At no point do people become perfect and wonderful and without actual problems. If you wait for a signal that you’ve got it all figured out, life will pass you by. Love just happens, if you open yourself up to it. It might seem like gambling when you add up how much it costs to try, but it’s healthier to think about it as a part of the personal growth process. It’s possible to meet someone who likes you, despite your having more fingers on your hands than dollars in your bank account. Isn’t that the ideal we’re all searching for anyway? You aren’t a social pariah. This current moment is perilous for millions of people. It’d be a lot easier with someone else to go through it with.\nSo, try not to despair. Ignore the trend pieces and influencers. Go on the cheap date, be honest about your situation, and leave the chastity belt at home.\n- \n  Dave Schilling is a Los Angeles-based writer and humorist", "translation_ja": "", "vocab": [{"word": "antithetical", "definition": "～と正反対の、矛盾する。基本的な原理や価値観と相反することを表します。"}, {"word": "compatibility", "definition": "相性、適合性。二人の人間関係において、価値観や性格が合致する程度を指します。"}, {"word": "thrifty", "definition": "倹約的な、無駄を避ける。お金を節約し、効率的に使うことを意味します。"}, {"word": "freeloader", "definition": "タダ乗りする人、他人に寄生する人。他人の好意を利用して費用を負担してもらう人を指します。"}, {"word": "perilous", "definition": "危険な、困難な。リスクが高く、不安定な状況を表す語です。"}, {"word": "pariah", "definition": "のけ者、社会的に排除された人。社会から受け入れられない立場にある人を指します。"}]}, {"title_ja": "トランプ大統領の強気なイメージが自らの行動で台無しに", "title_en": "Trump's Tough-Guy Image Undermined by His Own Actions", "summary_ja": "モハマド・バッジ氏は、イラン暗殺脅威を避けるため、トランプ大統領が密かに空港の給食トラックを使ってトルコから軍用機で逃げたという最近の暴露により、彼が慎重に構築した強国指導者のイメージが損なわれたと主張しています。著者は、このエピソードがトランプのイラン戦争の弱さと失敗を露呈させ、彼の公的な強さのペルソナと矛盾していると指摘しています。バッジ氏は、これを議会や裁判所に抑制されないトランプの広範な帝国主義的な無謀さのパターンの象徴として位置付けています。", "summary_en": "Mohamad Bazzi argues that Donald Trump's carefully cultivated strongman image has been damaged by recent revelations that he secretly fled Turkey in a military aircraft via an airport catering truck to avoid an Iranian assassination threat. The author contends this incident exposes the weakness and failure underlying Trump's aggressive war against Iran, contradicting his public persona of strength and dominance. Bazzi frames this as emblematic of Trump's broader pattern of reckless imperial overreach unchecked by Congress or the courts.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/17/trump-tough-guy-image-catering-truck", "state_media": false, "category": "オピニオン", "full_text": "For decades, Donald Trump cultivated a public image based on strength and dominance. He was a brash New York real estate mogul; a reality TV star who deployed his signature phrase: “You’re fired!” to eliminate contestants from The Apprentice; and eventually US president and undisputed leader of the Republican party.\nIn recent months, Trump has taken his boastfulness to an extreme, reportedly telling confidants that he’s “the most powerful person to ever live” and comparing himself with some of history’s most feared leaders, including Genghis Khan, Napoleon, Hitler, Stalin and Mao.\nBut recent revelations have threatened to shatter Trump’s image as a strongman: the US president departed on a secret military flight out of Turkey after attending a Nato summit, while the White House told the public he was flying onboard Air Force One. The operation involved an elaborate ruse in which Trump boarded his jumbo jet in view of TV cameras, and then was hustled out by the Secret Service through an airport catering truck. Trump was taken to an alternate military aircraft, which flew him to Britain – all unbeknown to journalists and several White House staff members who stayed on Air Force One and thought they were on the same plane as the president.\nThe embarrassing necessity was a result of Trump’s unnecessary war against Iran. US officials used such levels of subterfuge because they were worried about an Iranian assassination attempt against Trump, according to reports in the Washington Post and New York Times. On 11 August, Trump confirmed that he had secretly switched planes in Turkey, and attributed the decision to his protective detail and military advisers. “I go by Secret Service and the military,” Trump told reporters who asked why US officials had used such an intricate ploy and kept the public in the dark about it until the story was leaked. “They wanted me to go on a different flight, a different plane. Equal safety. But they wanted me to do it, so I do it. I do what they say.”\nTrump tried to evade criticism that the decision left several cabinet members and senior White House officials – including Marco Rubio, the secretary of state; Scott Bessent, the treasury secretary; Stephen Miller, Trump’s top domestic adviser; and Steven Cheung, the White House communications director – on Air Force One to serve as decoys, along with other Trump staffers and journalists. To deflect more questions, Trump claimed, without providing evidence, that the secret military plane he flew on was actually at “greater risk” than the Air Force One jet that the world saw him board after the Nato summit. “I think it was at greater risk because that would be the plane I think that they would be more likely to go for,” he said.\nIt’s easy to see why Trump and his administration did not want to publicly share details of the ruse after the danger had passed, as past presidents had done when they used subterfuge to visit war zones and other hazardous locations. The image of Trump hiding in an airport catering container to avoid a potential Iranian assassination attempt is a stark contrast to the tough guy brand he spent years cultivating. It’s also an antithesis to the image Trump projected after he survived an assassination attempt at a presidential campaign rally in Butler, Pennsylvania, in July 2024. In a series of photos captured by news photographers at the scene, Trump raised his fist in the air and mouthed the words: “Fight, fight, fight” to supporters as he was rushed off stage by Secret Service agents, bleeding from his ear. One image in particular, showing a bloodied Trump pumping his fist with a US flag in the background, became iconic – and his campaign quickly tried to monetize it by using the photo on the cover of a book and to sell $299 Trump-branded sneakers.\nBeyond the dueling imagery, the fact that Trump took refuge in a catering truck has deeper political implications. It encapsulates Trump’s failure in his war on Iran: a president who constantly boasts about US military prowess and tries to project personal strength instead appears weak in front of the world as he hides from the consequences of his own actions. Nearly six months ago, Trump launched his reckless war against Iran as an act of imperial hubris – and a culmination of a series of lawless acts since he returned to office in 2025.\nWith little resistance from the Republican-controlled Congress or the US supreme court, Trump was able to gut government agencies, use federal law enforcement to target his political enemies, appoint his loyalists as top prosecutors, deploy national guard troops into US cities, and weaken decades-old anti-corruption laws designed to constrain presidential power after the Watergate scandal. He also steamrolled over Congress and its authority to declare war.\nIn late February, when the US and Israel launched a series of devastating airstrikes against Iran, Trump had expansive goals: to destroy Tehran’s military capabilities and nuclear ", "translation_ja": "", "vocab": [{"word": "boastfulness", "definition": "自慢や誇大広告の傾向。特に自分の成功や力を過度に自画自賛する行為を指す。"}, {"word": "subterfuge", "definition": "目的を達成するためのごまかしやトリック。欺きや詐術によって真実を隠すこと。"}, {"word": "imperial hubris", "definition": "帝国的な傲慢さ。国家指導者が自らの力を過度に信じて危険な決定をする傲慢な態度。"}, {"word": "encapsulates", "definition": "何かの本質や重要な特性を包含または象徴する。複雑な事柄をコンパクトに表現する。"}, {"word": "reckless", "definition": "危険や結果を無視した無責任な行為。慎重さを欠いた向こう見ずな行動。"}, {"word": "antithesis", "definition": "対比や正反対。二つの相反する物事や概念の対照的な関係を指す。"}, {"word": "emanated", "definition": "源から発出する、起源する。ある場所や原因から流れ出ること。"}]}, {"title_ja": "ルビオが外交を追求しないことはトランプと同じくらい有害である", "title_en": "Rubio's Failure to Pursue Diplomacy Makes Him Nearly as Harmful as Trump", "summary_ja": "シモン・ティズドールは、米国務長官マルコ・ルビオが世界的危機の最中に平和を促進するユニークな機会を無駄にしたと主張している。従来の外交を追求する代わりに、ルビオは帝国的権力を投影し、複雑な交渉をトランプの不適格な側近に委ねており、原則ではなく政治的計算に駆られた矛盾した政策を追求している。", "summary_en": "Simon Tisdall argues that Marco Rubio, as US Secretary of State, has squandered a unique opportunity to promote peace during global crises. Instead of pursuing traditional diplomacy, Rubio projects imperial power and defers complex negotiations to unqualified Trump cronies, while pursuing contradictory policies driven by political calculation rather than principle.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/16/marco-rubio-power-peace-world-us-diplomat", "state_media": false, "category": "オピニオン", "full_text": "Viewed from the state department in Washington DC, the world is on fire – but record heatwaves are not to blame. The unresolved Iran war has badly burned Donald Trump. His military campaign conclusively failed, energy and food prices are still rising, and a Republican rout in November’s midterm elections looms. Humiliatingly, Israel this week flatly rejected his latest Gaza peace proposals, days after Trump congratulated himself on a “historic breakthrough”. In Europe, Russia’s attacks on Nato allies grow increasingly brazen, threatening a wider escalation. The Ukraine war, which Trump vowed to end, is now well into its fifth year, with civilians on both sides caught in the killing fields. And these are just the bigger firestorms. There are plenty more.\nRarely has the need for effective, professional diplomacy been more pressing. So step forward Marco Rubio, US secretary of state and chief American diplomat. These are challenges that, if successfully tackled, could propel the 55-year-old son of Cuban immigrants and the former US senator for Florida into pole position in the 2028 Republican presidential nomination race. Here is a chance for Rubio to defy critics who dismiss him as a lickspittle and Trump dogsbody, and transform himself into respected global statesman. His boss mocked him as “little Marco” and a “loser” when they were election rivals in 2016. (Rubio called him a conman.) Now is Rubio’s opportunity to go big, be brave and prove he’s a winner.\nOr maybe not.\nRubio is unlike recent US secretaries of state – heavyweights such as Hillary Clinton and Antony Blinken, or John Kerry, famed for his high-energy shuttle diplomacy. Rubio has little time for “peace processes”. Instead, he projects brute US power to impose take-it-or-leave-it “solutions” that advance US interests, as defined by Trump. It’s a modern form of imperialism. Target countries have a choice: become client states, like Venezuela and, prospectively, Cuba and Greenland, or be crushed. In Iran, the policy is not regime change, let alone democratic renewal. It’s regime compliance. Rubio behaves less like a peace-broker, more like a pith-helmeted colonial viceroy demanding fealty from obsequious satraps.\nSpeaking in Munich in February, Rubio aired his hawkishly retro doctrine of US primacy. He lamented the decline of “the great western empires … accelerated by godless communist revolutions and anti-colonial uprisings” and warned Europe faced “civilisational erasure”. The US didn’t want milksop allies “shackled by guilt and shame” about their imperial past, he said. “We want allies who are proud of their culture and heritage … and who, together with us, are willing and able to defend it.” Here was a familiar assertion of US hegemony, but one stripped of bogus altruism and pretence. It sounded a death knell for diplomacy. Trump has attacked eight countries in the past year. Cuba, Rubio’s obsession, could be next.\nRubio’s reluctance to get personally involved in peacemaking may be partly explained by his other, contradictory role, as Trump’s national security adviser. He has accepted the White House’s outsourcing of negotiations over Ukraine and Palestine to amateur envoys of limited ability – namely Trump’s son-in-law, Jared Kushner, and business crony Steve Witkoff. Broadly speaking, Rubio has steered clear of direct involvement in the Iran talks, too, leaving JD Vance, the vice-president and his main potential rival in 2028, to take the flak. Rubio’s arm’s length approach smacks of calculation. Or maybe he’s just out of his depth. Maybe he has no clear idea what he, Marco, really thinks about any of these issues and simply does Trump’s erratic bidding.\nThis perception of a political chameleon lacking firm principles, consistent opinions and a strong moral compass is reinforced by his record. His biographer, Manuel Roig-Franzia, believes Rubio’s personal and political slipperiness – he once became a Mormon, then reverted to Catholicism – is rooted in a childhood need to belong, to be on the winning side, no matter the price. Senator Rubio was a China hawk. Now he toes Trump’s ingratiating line on Beijing. He used to castigate Russia; now he’s an appeaser. He championed overseas assistance but, in office, has gutted USAID and seeks to dismantle the international criminal court, a keystone of global order. He blasted Barack Obama’s Iran nuclear deal. Now he backs an accord that would offer additional concessions to Tehran. Accused by the Vatican of waging an immoral, unjust war, he travelled to Rome and set the pope straight.\nThe irony, or tragedy, of the Rubio conundrum is he has the power to do great good, if only he would stand up and be counted. Russia’s Vladimir Putin, losing on the battlefield and at home, is weaker than at any time since 2022. Ukraine’s Volodymyr Zelenskyy is short of missile interceptors, soldiers and political support. A ceasefire deal freezing the conflict is there for the making by the only country – the US – that", "translation_ja": "", "vocab": [{"word": "lickspittle", "definition": "へつらい者、ご機嫌取り。権力者に追従し、言いなりになる人物を指す軽蔑的な表現。"}, {"word": "imperialism", "definition": "帝国主義。強大国が他国を支配・統制して自国の利益を拡大する政策や体制。"}, {"word": "satraps", "definition": "属国の総督や傀儡支配者。大国に従属させられた地域の統治者を指す。"}, {"word": "hegemony", "definition": "覇権、支配。特に強大国が国際秩序において優位性と支配力を持つ状態。"}, {"word": "hawkishly", "definition": "好戦的に、強硬に。武力行使や軍事的圧力を重視する立場から。"}, {"word": "ceasefire", "definition": "停戦。紛争当事者が戦闘を一時的に中止することで合意した状態。"}]}, {"title_ja": "中国のレアアース支配：戦略か偶然か？", "title_en": "China's Rare-Earth Dominance: Strategy or Accident?", "summary_ja": "一般的
