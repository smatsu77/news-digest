ing oil refineries. The conflict has caused over £35 billion in economic damage to Russia and resulted in mounting civilian casualties on both sides.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy5dz0kkn0wo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK 'supports Ukraine 100%', Burnham says, after Russia's drone warning\n- Published\nUK Prime Minister Andy Burnham has said London will continue \"to support Ukraine 100%\", after Moscow warned of \"consequences\" following confirmation that British-made drones were used in recent Ukrainian strikes in Russia.\n\"We are not fair-weather friends, we will be there in Ukraine's hour of need and that won't change,\" he said.\nThe Russian embassy in the UK earlier accused Britain of \"deliberately opting for an escalation of the Ukraine crisis\", saying \"the deeper its involvement in the conflict... the higher the price it will pay\".\nKyiv has stepped up long-range attacks on Moscow and other Russian regions, targeting oil refineries and warehouses of the largest online retailer Wildberries.\nAsked on Tuesday about the Russian threat, Burnham maintained that the UK was \"providing support so that Ukraine can defend itself and that's been the British position all the way through this conflict, by previous prime ministers - it remains the case with me\".\nThis is not the first time that Russia has warned the UK over its role in providing Ukraine with drone technology and Storm Shadow missiles.\nThe Russian embassy said \"London's actions will inevitably carry consequences for which it will have to answer\", but did not elaborate on the type of threat Moscow was considering.\nThe latest phase of the war has directly affected Russia's domestic fuel supplies and dented the Russian economy.\nThe UK has been one of Ukraine's biggest international supporters since Russia launched its full-scale invasion in February 2022. The Ministry of Defence said the UK was \"committed to providing the equipment Ukraine needs to defend itself against [Russian President Vladimir] Putin's illegal invasion\".\nTwo British companies are known to have built drones supplied to Kyiv. A military source confirmed to the BBC that UK drones had been used in recent attacks on Russia that reportedly caused more than £35bn in economic damage.\nThe Kremlin has regularly singled out the UK - along with the US - for its role in arming and backing Kyiv politically and financially since the start of the war.\nIt was London - then under Boris Johnson's leadership - that supplied Ukraine with very effective anti-tank weapons that helped to stop Moscow's advance on Kyiv in the first few weeks of the war.\nThe UK has since provided more modern weaponry and has also been actively training Ukrainian soldiers. In July, Burnham showed that Britain's support would continue by making his first international visit as prime minister to Kyiv.\nOn Russia's state TV channels, the anti-UK rhetoric has intensified in recent weeks, with invited experts and lawmakers regularly calling for strikes against the UK.\nRussia currently controls approximately a fifth of Ukrainian territory but its forces have had very little success on the front line for months.\nNevertheless, casualties have continued to mount.\nUN officials say last month's civilian death toll of 437 people in Ukraine was the highest since May 2022. In Russia, a foreign ministry spokesman told the Tass news agency on Tuesday that in the past week 69 people including three children had been killed.\nIn the latest Russian attacks on Ukraine, 17 people were killed, including 10 in the village of Pechenihy in north-eastern Ukraine early on Tuesday.\nPrivate homes, a cafe and post office were hit, as two missiles claimed the lives of 10 villagers. Elsewhere, three Ukrainians died in Sumy, two in Zaporizhzhia and two in Kherson.\nMoscow's warning to the UK comes after a wave of Ukrainian strikes on Russia. Five people were killed in a residential area of Rostov region in the south of the country at the weekend.\nHundreds of drones have been launched by Ukrainian forces towards the Moscow region in the past two days alone. Regional governor Andrey Vorobyov said on Tuesday that a 10-year-old girl was hurt and a Wildberries warehouse was damaged.\nAs well as deploying imported drones, Ukraine has been able to use home-grown drone and missile technology in recent weeks, including its FP-5 Flamingo cruise missile.\nIn a separate development on Tuesday, the UN nuclear watchdog, the IAEA, said it had been informed that \"a drone exploded at a bus stop used by staff\" travelling to the Zaporizhzhia nuclear power plant in the Russian-occupied southern Ukraine.\nThe IAEA said it had been told by the Moscow-installed plant director that one person was killed and another three seriously injured. It did not say who carried out the attack.\n\"No nuclear safety or security damage was reported,\" the watchdog added.\nMonday night saw heavy Ukrainian strikes, with Russian officials reporting that some 620 drones had been flown towards the region surrounding Moscow. Russian air defences destroyed more than 180 of them, but several people were wounded, the officials added.\nOn Saturday night, Ukraine fired some 822 drones towards Russia, with 600 aiming for Moscow, according to ", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や問題が段階的に激化していくこと。軍事衝突や政治危機において、より深刻な段階へ進むことを意味します。"}, {"word": "rhetoric", "definition": "特定の目的のために用いられる説得力のある話し方や言葉遣い。政治的なメッセージや宣伝活動で使われることが多いです。"}, {"word": "casualties", "definition": "戦闘や事故などで死傷した人々。軍事的な文脈では、戦死者や負傷者の総数を指します。"}, {"word": "dented", "definition": "悪影響を与える、傷つける。経済や評判などに対して、ネガティブな影響を与えた状態を表します。"}, {"word": "singled out", "definition": "他から取り上げて特に注目または非難する。複数の中から特定のものを選んで指摘する表現です。"}, {"word": "illegality", "definition": "法律違反であること、違法性。国際法や国内法に違反する行為の性質を指します。"}]}, {"title_ja": "スペイン・グラナダ付近でマグニチュード4.8の地震が発生、3人が負傷", "title_en": "Magnitude 4.8 Earthquake Strikes Granada, Spain, Injuring Three", "summary_ja": "スペイン南部の歴史的都市グラナダ近郊で火曜日朝にマグニチュード4.8の地震が発生し、少なくとも3人が軽傷を負い、複数の建物が損傷しました。震源地はグラナダの約10km南のアルエンディン町付近で、先週金曜日から始まった一連の浅い地震の最新のものです。ユネスコ世界遺産のアルハンブラ宮殿や複数の美術館が閉鎖され、地下鉄は安全対策として列車速度を低下させました。", "summary_en": "A 4.8 magnitude earthquake hit southern Spain near the historic city of Granada on Tuesday morning, injuring at least three people and damaging multiple buildings. The tremor, centered about 10km south of Granada near the town of Alhendín, was part of a series of shallow earthquakes that began last Friday. Notable closures include the UNESCO World Heritage Alhambra palace and several museums, while the metro reduced train speeds as a precaution.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cdx755dyy1yo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Earthquake rocks Spain's historic Granada, injuring three\n- Published\nAt least three people have been lightly injured and a number of buildings damaged after an earthquake rocked southern Spain.\nThe epicentre of the magnitude 4.8 tremor on Tuesday morning was about 10km (six miles) south of the historic city of Granada, the country's National Geographic Institute (IGN) said.\nMany local residents were seen rushing out of their homes into the streets, fearing strong aftershocks. A number of vehicles were damaged by falling debris. Some museums, administrative buildings and sports centres have been forced to close.\nThe IGN said it was the latest in a series of very shallow tremors in the area that started last Friday and were widely felt.\nThe tremor struck at 10:37 local time (08:37 GMT) near the town of Alhendín, the IGN said. It was recorded at the depth of under 10km.\nAlfonso Malpica said he felt his ground floor flat in Granada shaking, telling El País newspaper that the quake was \"stronger than the ones that happen from time to time, the ones we're used to\".\n\"Everything came crashing down. It was terrifying,\" Cristina Ruiz Lopez, a lab worker who was at a supermarket in Granada, was quoted as saying by the AFP news agency.\nGranada's famous Alhambra palace - a Unesco World Heritage Site of medieval Islamic architecture - \"will remain closed this afternoon\", the site administrators said.\nThe palace is visited every year by millions of tourists from around the world.\nMeanwhile, Granada's metro network said it was reducing the speed of its trains to 30km/h (19mph) for \"safety reasons\" and warned that this may cause delays.", "translation_ja": "", "vocab": [{"word": "epicentre", "definition": "地震の震源地（地表面上の点）を意味します。地震が最も強く感じられる場所として使用されます。"}, {"word": "tremor", "definition": "地震または地面の揺れを指します。通常、地震よりも小さい規模の揺れに対して使用されることもあります。"}, {"word": "aftershocks", "definition": "大きな地震の後に続く一連の小さな地震を意味します。本震の後に発生する余震のことです。"}, {"word": "debris", "definition": "建物の倒壊や破壊によって生じた破片や瓦礫のことを指します。"}, {"word": "heritage", "definition": "文化的・歴史的に重要な資産や遺産を意味します。通常、UNESCO World Heritage Siteなどの文脈で使用されます。"}, {"word": "magnitude", "definition": "地震の規模や強さを数値で表す指標です。通常1～9のスケールで測定されます。"}]}, {"title_ja": "ブラジルのルーラ大統領、アマゾン川近郊の石油発見を称賛", "title_en": "Brazil's President Lula Hails Oil Discovery Near Amazon River", "summary_ja": "ブラジルのルーラ大統領は、アマゾン川河口近くでの石油発見を祝い、それが同国の将来への「パスポート」になる可能性があると述べました。国営石油会社ペトロブラスが深さ2,886メートルで発見したものですが、商業的実現可能性はまだ不明です。ルーラ大統領は化石燃料の段階的廃止への公約を保ち続けていますが、環境保護団体はこの生物多様性に富んだ地域での石油流出による生態系破壊の危険性について懸念を表明しています。", "summary_en": "Brazilian President Lula da Silva has celebrated the discovery of oil near the Amazon river mouth, calling it a potential passport to the country's future. The find was made by state-run oil company Petrobras at a depth of 2,886 meters, though commercial viability remains uncertain. While Lula maintains his commitment to phasing out fossil fuels, environmentalists have raised serious concerns about potential ecosystem devastation from oil spills in this biodiverse region.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c4gd7xd8e8lo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Brazil's President Lula hails oil discovery near Amazon river\n- Published\nBrazilian President Luiz Inácio Lula da Silva has hailed the discovery of oil near the mouth of the Amazon river.\nSpeaking after the find was announced by Brazil's state-run oil company Petrobras, he said it could be \"a passport to the country's future\".\nHis decision to allow exploratory drilling in the area known as the Brazilian Equatorial Margin was heavily criticised by environmentalists, who raised concerns that any potential oil spills could devastate its ecosystem.\nLula, who is running for another four-year term in elections scheduled for October, stressed that he was still committed to eventually phasing out fossil fuels to curb climate change.\nThe oil discovery was made in the sea about 175km (110 miles) off the Amazon coast but the size of the field is not yet clear.\nIt is also still unknown whether extracting the oil, which is located at a depth of 2,886m (9,469ft), would be commercially viable.\nConservationists have warned that the area where the exploratory drilling is taking place is very biodiverse.\nThey fear that any accidents could threaten not just the nearby reefs but that currents could carry spilled oil to coastal wetlands teeming with wildlife.\nLula has in the past rejected criticism by conservationists as \"meddling\" and on Monday he again said that he would not accept any foreign interference.\n\"This means national sovereignty. Any country which has oil of this quality won't allow anyone to butt in,\" he said.\nPetrobras started the exploratory deep-water drilling operation in the area in October 2025.\nThe company's chief executive Magda Chambriard said that the discovery confirmed that Petrobras's \"optimism\" of finding oil in the Brazilian Equatorial Margin had been warranted.\nShe added that the company was committed to \"ensuring the country's energy security\".\nPresident Lula has argued that oil revenues are needed to help fund Brazil's transition to non-fossil fuels.\nSpeaking on Monday, he insisted: \"I'm not denying my commitment to the fight for a day when we no longer need fossil fuels, because Brazil will continue to be the king of biofuel innovation and will remain a major player in renewable energy.\"\nEnvironmentalists were aghast when Lula announced he had given Petrobras the green light to start the exploratory drilling just weeks before the COP30 climate conference hosted by Brazil last November.\nIn his remarks on Monday, the president made a reference to the anger at the time, singling out opposition in Europe in particular.\n\"Many people didn't want me to announce that Petrobras had won the licence because they said that the Europeans would be annoyed,\" he said.\n\"I took the decision to announce that people wanted to do exploratory drilling there before COP because the interests of our country and our company were at stake.\"\nThe prospect of oil discovery off the coast has already given a boost to the nearest town.\nIn Oiapoque, in Amapá state, the hope of jobs and opportunities has led to an influx of people, according to the local housing authorities.\nWith less than two months to go before the presidential election, Lula will be trying to attract voters hoping for economic development in this remote part of Brazil without alienating those concerned about the potential impacts on the environment.\nRelated topics\n  - Published20 October 2025\n  - Published23 November 2025", "translation_ja": "", "vocab": [{"word": "exploratory drilling", "definition": "採掘可能性を調査するために行われる試験的な掘削作業。実際の採掘前に資源の存在や量、質を確認するために行われます。"}, {"word": "commercially viable", "definition": "経済的に利益を生む可能性がある状態。採掘や事業展開が収益性を持つかどうかを判断する際に使用される表現です。"}, {"word": "biodiverse", "definition": "多種多様な生物が生息している状態。生態系の豊かさを示す形容詞で、環境保全の議論でよく使われます。"}, {"word": "conservationists", "definition": "自然環境や野生動物の保護を目指す活動家や専門家。環境問題に関する記事で頻出の用語です。"}, {"word": "fossil fuels", "definition": "石炭、石油、天然ガスなど、化石から生成される燃料。気候変動の議論で頻繁に言及されます。"}, {"word": "renewable energy", "definition": "太陽光、風力、水力など、自然資源から繰り返し得られるエネルギー。持続可能な開発の文脈で重要な概念です。"}]}, {"title_ja": "ウクライナ支援に「100%コミット」 バーナム英首相、ロシアのドローン警告後に表明", "title_en": "UK 'Supports Ukraine 100%', PM Burnham Says After Russia's Drone Warning", "summary_ja": "アンディ・バーナム英首相は、英製ドローンがウクライナの対ロシア攻撃に使用されたことが確認された後も、ウクライナへの揺るがぬ支援を改めて表明した。ロシアは英国が紛争の意図的なエスカレーションを選択していると非難する一方、ウクライナは石油精製所やインフラへの長距離攻撃を激化させており、350億ポンド以上の経済的損害をもたらしている。", "summary_en": "UK Prime Minister Andy Burnham reaffirmed Britain's unwavering support for Ukraine despite Russia's warnings of 'consequences' following confirmation that British-made drones were used in recent Ukrainian strikes. Russia accused the UK of deliberately escalating the conflict, while Ukraine has intensified long-range attacks on Russian oil refineries and infrastructure, causing significant economic damage estimated at over £35 billion.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy5dz0kkn0wo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "UK 'supports Ukraine 100%', Burnham says, after Russia's drone warning\n- Published\nUK Prime Minister Andy Burnham has said London will continue \"to support Ukraine 100%\", after Moscow warned of \"consequences\" following confirmation that British-made drones were used in recent Ukrainian strikes in Russia.\n\"We are not fair-weather friends, we will be there in Ukraine's hour of need and that won't change,\" he said.\nThe Russian embassy in the UK earlier accused Britain of \"deliberately opting for an escalation of the Ukraine crisis\", saying \"the deeper its involvement in the conflict... the higher the price it will pay\".\nKyiv has stepped up long-range attacks on Moscow and other Russian regions, targeting oil refineries and warehouses of the largest online retailer Wildberries.\nAsked on Tuesday about the Russian threat, Burnham maintained that the UK was \"providing support so that Ukraine can defend itself and that's been the British position all the way through this conflict, by previous prime ministers - it remains the case with me\".\nThis is not the first time that Russia has warned the UK over its role in providing Ukraine with drone technology and Storm Shadow missiles.\nThe Russian embassy said \"London's actions will inevitably carry consequences for which it will have to answer\", but did not elaborate on the type of threat Moscow was considering.\nThe latest phase of the war has directly affected Russia's domestic fuel supplies and dented the Russian economy.\nThe UK has been one of Ukraine's biggest international supporters since Russia launched its full-scale invasion in February 2022. The Ministry of Defence said the UK was \"committed to providing the equipment Ukraine needs to defend itself against [Russian President Vladimir] Putin's illegal invasion\".\nTwo British companies are known to have built drones supplied to Kyiv. A military source confirmed to the BBC that UK drones had been used in recent attacks on Russia that reportedly caused more than £35bn in economic damage.\nThe Kremlin has regularly singled out the UK - along with the US - for its role in arming and backing Kyiv politically and financially since the start of the war.\nIt was London - then under Boris Johnson's leadership - that supplied Ukraine with very effective anti-tank weapons that helped to stop Moscow's advance on Kyiv in the first few weeks of the war.\nThe UK has since provided more modern weaponry and has also been actively training Ukrainian soldiers. In July, Burnham showed that Britain's support would continue by making his first international visit as prime minister to Kyiv.\nOn Russia's state TV channels, the anti-UK rhetoric has intensified in recent weeks, with invited experts and lawmakers regularly calling for strikes against the UK.\nRussia currently controls approximately a fifth of Ukrainian territory but its forces have had very little success on the front line for months.\nNevertheless, casualties have continued to mount.\nUN officials say last month's civilian death toll of 437 people in Ukraine was the highest since May 2022. In Russia, a foreign ministry spokesman told the Tass news agency on Tuesday that in the past week 69 people including three children had been killed.\nIn the latest Russian attacks on Ukraine, 17 people were killed, including 10 in the village of Pechenihy in north-eastern Ukraine early on Tuesday.\nPrivate homes, a cafe and post office were hit, as two missiles claimed the lives of 10 villagers. Elsewhere, three Ukrainians died in Sumy, two in Zaporizhzhia and two in Kherson.\nMoscow's warning to the UK comes after a wave of Ukrainian strikes on Russia. Five people were killed in a residential area of Rostov region in the south of the country at the weekend.\nHundreds of drones have been launched by Ukrainian forces towards the Moscow region in the past two days alone. Regional governor Andrey Vorobyov said on Tuesday that a 10-year-old girl was hurt and a Wildberries warehouse was damaged.\nAs well as deploying imported drones, Ukraine has been able to use home-grown drone and missile technology in recent weeks, including its FP-5 Flamingo cruise missile.\nIn a separate development on Tuesday, the UN nuclear watchdog, the IAEA, said it had been informed that \"a drone exploded at a bus stop used by staff\" travelling to the Zaporizhzhia nuclear power plant in the Russian-occupied southern Ukraine.\nThe IAEA said it had been told by the Moscow-installed plant director that one person was killed and another three seriously injured. It did not say who carried out the attack.\n\"No nuclear safety or security damage was reported,\" the watchdog added.\nMonday night saw heavy Ukrainian strikes, with Russian officials reporting that some 620 drones had been flown towards the region surrounding Moscow. Russian air defences destroyed more than 180 of them, but several people were wounded, the officials added.\nOn Saturday night, Ukraine fired some 822 drones towards Russia, with 600 aiming for Moscow, according to ", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や対立が段階的に激しくなること。より深刻または危険な状態へと進むプロセスを指す。"}, {"word": "singled out", "definition": "複数のもの・人の中から特定のものを選び出すこと。特に批判や注目の対象として選ぶという意味で使われる。"}, {"word": "dwindled", "definition": "徐々に減少したり、小さくなったりすること。特に量や勢力が着実に低下する様子を表す。"}, {"word": "rhetoric", "definition": "説得力のある言語や主張。政治的メッセージや宣伝目的で使用される表現や論法を指す。"}, {"word": "mounted", "definition": "量や程度が増加すること。特に問題や被害などが累積・増加する状況で用いられる。"}, {"word": "illegally", "definition": "法律に違反して行われる行動。合法的でない方法や権限なく実行されることを意味する。"}]}, {"title_ja": "ギリシャの島でのヘリコプター墜落で新婚のイギリス人カップルが死亡", "title_en": "British honeymoon couple killed in Greek helicopter crash", "summary_ja": "イギリス人の新婚カップル、アレクサンダー・クロミーとマリー・エバートは、月曜日にギリシャのシフノス島でプライベートヘリコプターが墜落した際、パイロットとともに殺害されました。ベル206型ヘリコプターは着陸予定時刻直前に着陸地点からわずか数メートルの場所で墜落しました。ギリシャの航空安全当局が事故の調査を開始しています。", "summary_en": "A British couple, Alexander Cromie and Marie Ebert, were killed along with their pilot when their private helicopter crashed on the Greek island of Sifnos on Monday. The Bell 206 helicopter crashed just metres from its landing pad shortly before its scheduled arrival time. Greece's aviation safety authority has launched an investigation into the incident.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cx2lzj91d84o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "British couple on honeymoon killed in helicopter crash on Greek island\n- Published\nA young British couple and their pilot were killed in a helicopter crash on the Greek island of Sifnos on Monday, Greek police have said.\nThey have been named as newlyweds Alexander Cromie and Marie Ebert, who were in Greece on their honeymoon.\nThe private Bell 206 helicopter crashed just metres from a landing pad, killing the pair and their pilot, a Greek national.\nThe couple are said to have taken the helicopter from the village of Markopoulo near Athens to the popular holiday island, Kathimerini reported.\nGreece's aviation safety authority told the BBC it was investigating the crash and that its investigators were heading to the scene on Tuesday to gather evidence and speak to witnesses.\nA Foreign Office spokesperson told the BBC: \"Our thoughts are with the families during this difficult time. We are providing consular support and in contact with the Greek authorities.\"\nThe BBC has contacted Greek authorities and the aviation company for comment.\nAsset management firm Blackstone, where Cromie worked, said in a statement: \"We are shocked by the tragic passing of three people including our colleague Alex Cromie and his wife Marie Ebert, who were celebrating their honeymoon.\n\"Alex was beloved by everyone who knew and worked with him at Blackstone, and our thoughts and prayers are with his loved ones.\"\nEbert worked as a senior specialist at consultancy brand Bain & Company.\nIn a statement, the company said: \"We are shocked to read reports of a tragic accident in Greece regarding one of our colleagues and her husband.\n\"Our thoughts and support are with the families involved at this very difficult time.\"\nA senior police official told the Times that the crash came just before the helicopter's scheduled landing time of 18:15 local time (16:15 GMT).\nSifnos' Deputy Mayor, Manolis Foundoulakis, arrived at the scene shortly after the incident and told local news site Newsit there was almost \"nothing left\" of the aircraft.\nHe said locals saw the helicopter crash within metres of their homes and had described a \"bizarre engine noise coming from the aircraft\" as it was about to land.\nThe island's Vice Mayor for tourism Yiannis Rafeletos told the BBC the people of Sifnos are \"devastated\" and \"deeply shocked\".\n\"So much happiness has turned into sorrow,\" he added.\nHe said two of the victims were found in the wreckage, while the third was a short distance away.\nFirefighters worked to tackle a blaze which broke out after the crash, and the flames had been extinguished by Monday evening.", "translation_ja": "", "vocab": [{"word": "consular support", "definition": "大使館または領事館が国民に対して提供する外交的支援および援助。外国で問題が発生した際に政府が市民を助けるために行う。"}, {"word": "aviation safety authority", "definition": "航空機の安全性を監督し、事故を調査する政府機関。航空業界の規制と安全基準を管理する。"}, {"word": "wreckage", "definition": "破壊または崩壊した機械や建造物の残骸。特に航空機や車両の事故後に残る破片を指す。"}, {"word": "incident", "definition": "予期しない出来事や事故。通常は問題または不幸な状況を表す正式な用語。"}, {"word": "devastating", "definition": "非常に悲しい、ショックを受けた状態を表す形容詞。大きな損失や悲劇によって深く影響を受けていることを意味する。"}, {"word": "evidence", "definition": "調査や裁判で事実を証明するために使用される情報または物質。真実を明らかにするための証拠。"}]}, {"title_ja": "バーナム首相、トランプ補佐官になりすまし詐欺メッセージ交換の対応を擁護", "title_en": "Burnham Defends Handling of Hoax Message Exchange with Trump Official Imposter", "summary_ja": "英国のアンディ・バーナム首相は、ドナルド・トランプ大統領の補佐官スーシー・ワイルズになりすまし人物とメッセージを交換したことについて、恥ずかしくないと述べた。バーナム首相は、迅速に報告することでセキュリティ侵害を正しく対応したと主張しており、一方、自由民主党下院議員は議会調査委員会による調査を要求している。", "summary_en": "UK Prime Minister Andy Burnham says he is not embarrassed about exchanging messages with someone impersonating Donald Trump's chief of staff Susie Wiles. Burnham claims he handled the security breach correctly by quickly reporting it, though a Liberal Democrat MP has called for a parliamentary investigation into what he termed an 'egregious security breach.'", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5y34zrg668o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Burnham says he's not embarrassed about hoax message exchange\n- Published\nAndy Burnham says he is not embarrassed that he exchanged messages with a person posing as US President Donald Trump's chief of staff.\nThe prime minister added all politicians face \"these challenges\" but insisted he did \"everything right\" in how he handled the security breach.\nNews website Politico first reported, external that Burnham communicated with a person claiming to be Susie Wiles. Burnham said there was a \"minimal exchange of information of zero consequence\".\nLiberal Democrat MP James MacCleary has written to Parliament's Intelligence and Security Committee (ISC) to ask them to consider investigating what he called an \"egregious security breach\".\nIt is understood the communication between Burnham and the person posing as Wiles was in the form of messages and there was no conversation between the two.\nAsked if he was embarrassed about the incident, Burnham told broadcasters: \"No, I am not because there was a minimal exchange, nothing of consequence and quickly I realised that this needed to be reported and I did so.\n\"So I handled it in the right way. All politicians are receiving these pressures and these challenges, but I did everything right.\"\nPressed on what action is being taken to find out who was behind the incident and to improve systems, Burnham said the \"correct action\" had been taken both in the UK and the US, without providing further details.\nMacCleary, in his letter to ISC chairman Lord Beamish, said the security of the prime minister's communications \"ought to be an absolute priority\".\nHe added: \"We need to understand how this breach could occur, or else risk it being repeated.\"\nOn Monday, Downing Street did not say when the messages were exchanged, or how many there were, nor whether they were over WhatsApp or another system.\nA White House official told the BBC on Monday that the latest incident \"had nothing to do\" with Wiles' phone being hacked.\nThe BBC previously reported an FBI probe into Wiles' personal phone being hacked in May last year.\nWiles, a key Trump ally, told people at the time that her phone had been hacked after an impersonator - or impersonators - used her contacts file to message other top US officials.\nBurnham is not the first high-profile UK political figure to have come into contact with an imposter.\nIn 2024, the Foreign Office confirmed then-foreign secretary Lord Cameron had been the victim of a hoax call in which someone pretended to be former Ukrainian President Petro Poroshenko.\nFormer Prime Minister Lord Cameron also exchanged some text messages with the impersonator pretending to be Poroshenko, who was president of Ukraine between 2014 and 2019.\nThe Foreign Office said it released details of the exchange publicly over fears it could be \"manipulated\".\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.", "translation_ja": "", "vocab": [{"word": "egregious", "definition": "極めて悪い、ひどい、顕著な不正行為を意味する上級語。特に道徳的に許されない行為や重大な過ちを表現する際に使用される。"}, {"word": "imposter", "definition": "他人になりすまして詐欺や不正を行う人物。本人と偽って接触する詐欺師のことを指す。"}, {"word": "breach", "definition": "契約や規則の違反、またはセキュリティシステムの侵害を意味する。セキュリティや信頼の破壊を表す。"}, {"word": "hoax", "definition": "他者を欺く目的で作られた詐欺的な企画や偽の情報。意図的な詐欺行為を指す。"}, {"word": "impersonator", "definition": "他人のふりをして詐欺や悪事を働く人物。なりすましで信頼や利益を奪う人を表す。"}]}, {"title_ja": "セウタの付き添いのない未成年者が虐待と危険な状況に直面", "title_en": "Unaccompanied Minors in Ceuta Face Abuse and Unsafe Conditions", "summary_ja": "2026年7月にモロッコからスペインのセウタに渡った3,000～5,000人の付き添いのない未成年者が、過密な施設に収容されず路上生活をしている。警察は最低15件のレイプ容疑事件を調査しており、特に少女が被害に遭っているとみられている。地元当局者は、危機的な生活環境にもかかわらず帰国を拒否する傷つきやすい未成年者を保護するため、政府の支援と警察配置の増加を要求している。", "summary_en": "Between 3,000 and 5,000 unaccompanied minors are living on the streets of Ceuta, Spain, after crossing from Morocco in July 2026, unable to find shelter in overcrowded facilities. Police are investigating at least 15 suspected rape cases, with authorities believing the actual number is much higher, particularly affecting young girls. Local officials have called for increased government support and police presence to protect vulnerable minors who refuse to return to their home countries despite dire living conditions.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/minors-living-alone-on-ceuta-s-streets-at-risk-of-abuse/a-78416604?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Minors living alone on Ceuta's streets at risk of abuse\nAugust 18, 2026\nIt's 8 a.m. at the Tarajal industrial park in the autonomous city of Ceuta. But there are no workers and truck drivers to be seen near the warehouses today. Instead, there are makeshift tents, some of them made out of cardboard, with mainly children and teenagers sleeping under dirty blankets.\nAccording to certain estimates, there could be between 3,000 and 5,000 unaccompanied minors in Ceuta. Some are living on the streets because they cannot find a spot in one of the already overcrowded reception facilities in the enclave.\nAmina (not her real name), a 14-year-old Moroccan girl, and her brother were among the 80,000 people who crossed the border into Spain from Morocco in late July. Though most of these have since left Ceuta, some 9,000 remain, according to the local authorities — and many are minors. \"\nWhat's worst is that we don't have toilets,\" said Amina. \"We have to go somewhere in the bushes, but I don't dare go alone.\"\nClose by is a Moroccan woman called Malika (also not her real name) who has spread out several blankets for herself and her four children. She told DW she was not making enough as a cleaning lady in Morocco, adding that she earned the equivalent of €7 ($8) per day.\n\"That's just not enough to provide for everyone,\" she said. \"School will start again soon, and I don't have any money for books, nor even decent clothes for the children.\"\nThat's why she decided to take part in the mass crossing of the Spanish border last month when she read about it on social media. But now she doesn't know what to do.\n\"One child got sick. He had a high fever, but I couldn't get help anywhere,\" she said. In the end, she made compresses with water and vinegar to see if that would help.\nBut now she is particularly worried about her 12-and 14-year-old daughters, because the number of sexual assaults has risen sharply in the past week. Police are currently investigating at least 15 suspected cases of rape. The local authorities suspect the actual number of cases to be much higher.\nConditions particularly difficult for girls\nSusana Ascaso, an emergency doctor at Ceuta University Hospital, said she had treated several young girls in recent days.\n\"Just yesterday, another 12-year-old came to the emergency room,\" she said. \"She said that other migrants had harassed her and touched her inappropriately. She arrived here completely terrified and in tears. She was with a woman who had found her on the street. That woman saved the girl.\"\nAscaso said conditions were particularly difficult for \"girls under 18\" who were \"particularly at risk.\" She added that there was a major imbalance in the numbers of male and female migrants. \"That doesn't help, of course.\"\nSeveral high-ranking politicians in Ceuta have called for more support from the central government in the Spanish capital, Madrid. Nabila Benzina, the regional minister for health and social affairs, told DW that the current crisis was the \"worst moment in Ceuta's history\" and said more police officers were needed in the enclave. \"Especially to protect young women, but also for the general protection of the population.\"\nCeuta's president, Juan Jesus Vivas, spoke of a \"high-risk situation,\" in which it was increasingly difficult to maintain public services. \"As far as minors are concerned, we are currently 5,000% over capacity,\" he said. \"That means nobody can look after them adequately.\"\n'I'd like to be an architect one day'\nThe Spanish government has announced plans to transfer unaccompanied minors to the mainland but there is no concrete timeline. Several regions, in which the far-right Vox party is part of the government, have said they refuse to take in any migrants.\nVivas told DW that the minors should be \"reunited with their families. Otherwise, the Moroccan social services should assume responsibility for them.\" He said this was the only solution, adding that Madrid should put the \"appropriate legal proceedings\" in motion.\nMany of the minors in Ceuta said they do not want to go back to Morocco or elsewhere in Africa despite the conditions in Ceuta.\nIbrahim, a 7-year-old child from Sudan, said he would not give up until he could provide \"a better life for his parents back home.\" Amina, 14, also said she would not go back to Morocco.\n\"The schools here are really bad. I want a different future for myself. I'd like to become an architect someday,\" she said.\nThis article was originally written in German.", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "他の領土に囲まれた地域または領土を指します。本記事ではセウタはスペイン領土内のモロッコに囲まれた自治都市として機能しています。"}, {"word": "makeshift", "definition": "一時的または急場しのぎで作られたものを意味します。記事では段ボール製の仮のテントを説明するために使用されています。"}, {"word": "unaccompanied", "definition": "付き添う大人がいない、または監督者がいない状態を意味します。本記事では親や保護者のいない未成年者を指しています。"}, {"word": "capacity", "definition": "施設やシステムが収容または処理できる最大量を意味します。記事では受入施設が定員をはるかに超えていることを示しています。"}, {"word": "proceedings", "definition": "法的または公式な手続きやプロセスを指します。記事では移民関連の法的措置を実施することを意味しています。"}, {"word": "imbalance", "definition": "一方が他方よりも多い、不均等な状態を意味します。記事では男性移民と女性移民の数の不均等性を説明しています。"}]}, {"title_ja": "ナイジェリア：プラトー州での武装攻撃で数十人が殺害される", "title_en": "Dozens killed in armed attack on Nigerian village", "summary_ja": "月曜夜、ナイジェリア北中部プラトー州のビン・ペル村で武装勢力が襲撃し、少なくとも25人が殺害されました。犯人たちはナタを使って住民を殺害しました。この虐殺は、中央ナイジェリアの中帯地域での土地と資源をめぐる遊牧民と農民の暴力の悪循環の一部です。", "summary_en": "At least 25 people were murdered in Plateau state's Bin-Per village on Monday night when armed men attacked residents with machetes. The massacre is part of an escalating cycle of violence between herders and farmers over land and resources in central Nigeria's Middle Belt region. Amnesty International reports that over 2,600 people have been killed in Plateau state alone since President Tinubu took office.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/nigeria-dozens-killed-in-plateau-state-attack/a-78419529?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Nigeria: Dozens killed in Plateau state attack\nAugust 18, 2026\nLocal officials say at least 25 people were murdered on Monday night by armed men who stormed the village of Bin-Per, in the Mangu local government area of Nigeria's Plateau state.\nPerpetrators reportedly moved from house to house, killing residents with machetes.\nWomen and children accounted for most of the victims.\nResident Muftwan Yamput told France's AFP news agency that he and his family \"survived by a whisker.\"\n\"But,\" he added, \"my neighbors were attacked. Two people killed in their house.\"\nCycle of reprisals in Nigeria attacks\nMonday night's massacre followed the killing of two herders last week.\nThose were in turn followed by a suspected reprisal targeting the nearby village of Maitimbe, where multiple houses were torched.\nThe Mwaghavul Youth Movement, a local advocacy group, has accused authorities of failing to protect vulnerable communities.\n\"The recurring destruction of communities, killing of innocent citizens, burning of homes and destruction of farmlands cannot continue to be treated as ordinary incidents,\" said the group's spokesperson on Sunday while calling for a review of security in the area.\nMatthew Kwarpo, a representative in the Plateau state assembly, called on authorities to, \"deploy proactive measures in preventing or mitigating unnecessary attacks before they occur,\" especially in Mangu.\n\"The incident underscores the urgent need for concerted efforts to address the underlying grievances and prevent further escalation of violence in the affected communities,\" said Kwarpo.\nAmnesty says President Tinubu not fulfilling promise to 'enhance security'\nThe incidents of the last week are the continuation of years of spiraling violence between nomadic Muslim ethnic Fulani herders and mainly Christian farmers over access to increasingly scarce land and resources in central Nigeria's Middle Belt region.\nLand grabbing over mineral and mining resources, political and economic tensions between locals and outsiders, and the influx of hardline Muslim and Christian preachers have all fueled divisions.\nPlateau has also seen hundreds killed in urban riots between religious groups in recent years.\nIn May 2025, rights group Amnesty International (AI) estimated that at least 2,630 people had been killed in Plateau state alone in the two years since President Bola Tinubu had taken office on the promise of enhancing security.\nThe group said authorities had instead failed \"to protect the rights to life, physical integrity, liberty and the security of tens of thousands of people across the country.\"\nEdited by: Saim Dušan Inayatullah\nIf you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "perpetrators", "definition": "犯罪や悪行を行った人々のこと。ここでは村を襲撃して住民を殺害した武装した男たちを指しています。"}, {"word": "reprisals", "definition": "報復や反撃のこと。一つの暴力的な事件に対する応報としての別の暴力行為を意味します。"}, {"word": "escalation", "definition": "紛争や暴力が拡大・激化していくプロセス。状況がより深刻になることを示します。"}, {"word": "underlying grievances", "definition": "表面に現れた問題の根底にある不満や不平。深い原因となっている苦情を指します。"}, {"word": "Middle Belt", "definition": "ナイジェリア中央部の地域。イスラム教徒の北部とキリスト教徒の南部の間に位置する紛争多発地帯です。"}, {"word": "influx", "definition": "大量の流入や急激な増加。ここでは過激な説教者が地域に流入していることを示します。"}]}, {"title_ja": "トランプ大統領がイラン交渉の中止を表明、中東情勢が悪化", "title_en": "Trump Says No Iran Talks as Middle East Tensions Rise", "summary_ja": "トランプ米大統領はイランとの交渉が行われておらず、今後も予定されていないと表明した。中東地域ではガザでのイスラエルの空爆、UAEによるイランの弾道ミサイル発射の告発、レバノンでの国連平和維持活動の継続要求など、複数の危機が生じている。", "summary_en": "US President Trump stated there are no ongoing or scheduled talks with Iran as tensions escalate in the Middle East. The region faces multiple crises including Israeli strikes in Gaza, UAE accusations of Iranian ballistic missiles, and calls for continued UN peacekeeping efforts in Lebanon.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/middle-east-no-talks-or-conversations-with-iran-trump-says/live-78419518?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "Middle East: No talks or conversations with Iran, Trump says\nPublished August 18, 2026last updated August 18, 2026\nWhat you need to know\n- Trump says 'no talks or conversations' between the US and Iran are held or scheduled\n- Syria, US, Turkey condemn Israeli strikes in Idlib\n- HRW says UN peacekeepers must remain in Lebanon\nRead below for a roundup of the latest headlines on the Iran war and other developments in the Middle East region on Tuesday, August 18, 2026.\nTired of missing our real-time updates? Click here to add us as a Preferred Source on Google. Then tap the \"Star\" or \"Preferred\" to keep DW News at the top of your feed.\nWATCH: Can Pakistan still help end the US-Iran war?\nPakistan made headlines when it helped create the diplomatic opening between Washington and Tehran.\nAs the US and Iran take tougher positions over the Strait of Hormuz, can Pakistan still play the role of mediator?\n6 killed in Israeli strike on Gaza, Palestinian officials say\nAn Israeli airstrike on a cafe in Gaza City on Tuesday killed six people and wounded a dozen more, Palestinian officials said, while the Israeli military said it carried out an attack targeting Hamas commanders.\nMahmoud Bassal, a spokesperson for Gaza's civil defence agency, told AFP that at least six were killed, \"including a child, and a large number were wounded, as a result of an Israeli raid on tents of displaced people in Gaza port.\"\nAn eyewitness told AFP Israeli war planes fired two missiles at the \"Sweet and Bitter\" cafe on the fishermen's port.\nThe Reuters news agency cited Palestinian medics as saying 14 others were wounded in the missile attack on the small cafe.\nThe Israeli army said it carried out a \"precise aerial strike\" against \"several Hamas commanders\" who \"planned to carry out terror attacks against [Israeli military] troops operating in the Gaza Strip\" and that \"steps were taken to mitigate harm to civilians.\"\nStrike comes as Trump pushes for Gaza peace\nThe strikes came just one day after US President Donald Trump's envoy Jared Kushner was in Israel and met with Prime Minister Benjamin Netanyahu.\nIsrael has insisted it will not withdraw from the areas it still controls in Gaza, some 60% of the Palestinian enclave, until Hamas has fully disarmed.\nHamas, which Israel, the US and other countries designate as a terrorist organization, has expressed its intention to disarm, but sticking points remain including over where the arms would then go.\nAfter the Tuesday attack, Hamas said it exemplified Israel's \"blatant disregard for all calls for a ceasefire issued by mediators and guarantor states.\"\nUAE accuses Iran of firing ballistic missiles\nThe United Arab Emirates said on Tuesday it has detected two ballistic missiles fired at its territory, for which it blamed Iran.\n\"UAE air defenses detected two ballistic missiles launched from Iran toward the country, with the first falling outside the country's territorial waters, while the second fell within the territorial waters,\" said a statement posted by the UAE Defense Ministry on X.\nEarlier on Tuesday, the Interior Ministry had warned residents against \"potential missile threats.\"\nIran did not immediately respond to the UAE's accusations.\nIsraeli military acknowledges marking detained Palestinians with numbers\nThe Israeli military on Tuesday acknowledged that soldiers carrying out a raid in the northern West Bank on Monday had marked detained Palestinians with numbers.\nIn a statement to The Times of Israel newspaper, the military said the seriousness of the conduct had been stressed to the troops involved and that \"lessons have been learned.\"\nFootage emerged on Monday showing a Palestinian man speaking to local media after being questioned by Israeli soldiers, with the number 44 written across his forehead.\nThe man said the troops had marked others who were questioned.\nThe measure has long been considered taboo in Israel, as it is reminiscent of the numbered tattoos which Germany's Nazi regime used to identify concentration and death camp inmates during the Holocaust.\nEarlier in April, footage showed Palestinian women with numbers written on their hands after they were briefly allowed to enter the Israeli military-controlled Jenin refugee camp to collect their belongings.\nIn response to the footage, the Israeli military acknowledged the incident and said \"lessons have been learned,\" echoing a similar statement to the one issued on Tuesday.\nHRW calls on UN to keep international force in Lebanon\nHuman Rights Watch has called on the United Nations to keep its international peacekeepers' force in Lebanon, whose mandate ends this year.\nThe UNIFIL in southern Lebanon has been in place since 1978 to confirm Israeli withdrawal from the Arab country. It has some 7,500 personnel from nearly 50 countries.\nDespite its presence, Lebanon has seen various wars between Israel and the pro-Iranian Hezbollah group, as well as Israeli ground invasions.\nIn August last year, the UN Security Council decided to end UNIF", "translation_ja": "", "vocab": [{"word": "mediator", "definition": "紛争当事者間の調停者、仲介者のこと。外交交渉において、対立する国や団体の間に立って解決を図る役割を果たす人物や国を指す。"}, {"word": "mitigate", "definition": "害や悪影響を軽減する、緩和するという意味。軍事作戦において民間人被害を減らすための対策を講じることを指す。"}, {"word": "enclave", "definition": "周囲を異なる地域に囲まれた領土、飛び地のこと。ガザはイスラエルとエジプトに囲まれた地域を指す場合に使用される。"}, {"word": "designate", "definition": "公式に指定する、認定するという意味。特にテロ組織などを政府が正式に認定・指定することを指す。"}, {"word": "taboo", "definition": "社会的に禁止されている、避けるべき行為や話題のこと。文化的・歴史的に非常に不適切と見なされることを意味する。"}, {"word": "mandate", "definition": "国際機関や軍事組織に与えられた権限や使命のこと。国連などが特定の期間、特定の地域で活動する権限を指す。"}]}, {"title_ja": "ヘイデン・パネッティーアの元交際相手が死亡現場に立ち会っていた：警察", "title_en": "Hayden Panettiere's Ex-Boyfriend Present at Death Scene: Police", "summary_ja": "警察は、女優ヘイデン・パネッティーアが死亡した際に、彼女の元交際相手が現場に立ち会っていたことを確認しました。パネッティーアは「ヒーローズ」や「ナッシュビル」などの人気テレビシリーズでの役で広く認識されていました。", "summary_en": "Police have confirmed that Hayden Panettiere's ex-boyfriend was present at the scene when the actress died. Panettiere was widely recognized for her roles in popular television series including \"Heroes\" and \"Nashville.\"", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/GMA/Culture/police-report-details-scene-hayden-panettiere-died/story?id=135745247", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、速報ニュースとライブイベントの24時間継続的なカバレッジを提供します。主要なストーリーの進展に応じてリアルタイムで最新情報を配信します。視聴者は世界中のABCニュース特派員による詳細なレポートと分析にアクセスできます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and live events around the clock. The service delivers real-time updates on major stories as they develop. Viewers can access in-depth reporting and analysis from ABC News correspondents worldwide.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ大統領、イラン情勢の緊迫化の中でホルムズ海峡を米国領土と主張", "title_en": "Trump Claims Strait of Hormuz as US Territory Amid Iran Tensions", "summary_ja": "ドナルド・トランプ大統領は2月28日、イランに対する大規模な戦闘作戦を発表し、米国とイスラエルの大規模な合同軍事攻撃が実施された。トランプ氏はホルムズ海峡を「新しい」米国領土と表記した地図を投稿し、地域の緊張を深刻化させている。", "summary_en": "President Donald Trump announced major combat operations against Iran on February 28, accompanied by massive joint U.S.-Israeli military strikes. Trump posted a map labeling the Strait of Hormuz as 'new' U.S. territory, escalating tensions in the region.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/live-updates/iran-live-updates-tehran-adopt-offensive-aspect-irgc/?id=135700072", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コンゴ民主共和国のエボラ出血熱流行、同国史上最悪に", "title_en": "DRC's Ebola Outbreak Becomes Deadliest in Country's History", "summary_ja": "コンゴ民主共和国のエボラ出血熱流行は2,325人以上の死亡者を記録し、同国史上最悪となり、記録されたエボラ出血熱の中で最も急速に拡大している。稀なブンディブギョ株が6つの州に影響を及ぼし、治療法とワクチンの臨床試験が進行中である。医療施設への攻撃、誤った情報、および患者の遅い特定により対応が妨げられている。", "summary_en": "The Ebola outbreak in the Democratic Republic of the Congo has surpassed 2,325 deaths, making it the deadliest in the country's history and the fastest-growing Ebola outbreak on record. The rare Bundibugyo strain has affected six provinces, with clinical trials of treatments and vaccines now underway. The response has been hindered by healthcare facility attacks, misinformation, and late patient identification.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/17/ebola-outbreak-drc-democratic-republic-of-congo-deadliest-in-history", "state_media": false, "category": "政治", "full_text": "The Ebola outbreak in the Democratic Republic of the Congo is now the deadliest in the country’s history, with at least 2,325 people dead, according to government data, surpassing the toll from the 2018-20 outbreak.\nThe DRC’s public health institute said confirmed cases had risen to 4,945, including 101 detected in the previous 24 hours.\nThe World Health Organization has said the outbreak is on track to surpass west Africa’s 2014-16 Ebola outbreak as the biggest in history. The 2014-16 outbreak resulted in 28,616 cases and 11,325 deaths across Guinea, Liberia and Sierra Leone, according to WHO data.\nOn Friday, the UN said Ebola “is winning in the Democratic Republic of the Congo” and said the epidemic was killing one person every 30 minutes.\nSix of DRC’s 26 provinces have been affected, mainly those along the country’s north-eastern border. More than 3,400 of the cases have been recorded in Ituri province, where the outbreak was first reported.\nThe latest numbers of confirmed cases of Ebola in the DRC have made this outbreak – the 17th in the country’s history – the fastest-growing in the known history of the virus. It took almost five months for the 2014-16 west Africa outbreak to reach 1,000 deaths, compared with more than 2,000 deaths in less than three months in this outbreak.\nThere are no approved vaccines or treatments yet for the rare Bundibugyo strain of the virus that is responsible for the current surge in cases. Nonetheless, 1,000 people in the DRC have recovered from the infection, with 730 still in healthcare or isolation facilities.\nClinical trials of two possible treatments for the strain began last month in Ituri. Tedros Adhanom Ghebreyesus, the WHO director general, said last week that two vaccines developed specifically for Bundibugyo were now being tested on people.\nThomas Parisch, a public health specialist recently deployed to the DRC with Médecins Sans Frontières, said: “Normally, as an outbreak progresses, the case fatality ratio should fall as contact tracing improves and patients are identified and treated earlier. Instead, we’re still seeing many cases detected very late, when treatment is less likely to succeed, with many identified only after they die in the community.”\nUganda has reported at least 20 cases, all in the capital, Kampala. The last case reported there was on 21 June and no community transmission has been recorded. The government declared the country Ebola-free on 28 July after the last Ebola patient, a Congolese national, was discharged on 16 July.\nIn May, the WHO declared the outbreak in the DRC and Uganda as a public health emergency of international concern. It said sequencing showed the outbreak had started months earlier, in February.\nEbola is transmitted to people from wild animals and then spreads in the human population through direct contact with the blood, secretions, organs or other body fluids of infected people, including dead bodies, and with contaminated surfaces and materials such as bedding or clothing.\nAccording to the WHO, symptoms can include fever, fatigue, malaise, muscle pain, headache and sore throat. These are followed by vomiting, diarrhoea, abdominal pain, rash and symptoms of impaired kidney and liver functions.\nThe response to this outbreak has been hampered by attacks on healthcare facilities, often fuelled by misinformation about safe burial practices, as well as strikes by some unpaid health workers. Decades of unrest and outside interference on traumatised communities, as well as poor health and road infrastructure have also complicated the picture.\nMore than 70% of people die in the community and not in health centres, said Mohamed Janabi, the WHO’s regional Africa director.\nJean-Paul Malo Lotsima, a civil society official in the Djugu area of Ituri, told the AFP news agency: “People prefer to be treated at home, thinking it is a case of poisoning or some other illness.”\nHe added: “It’s often at the last minute, when the family realises that the situation is getting worse, that patients are taken to hospital. And sometimes, they die on the way.”\nFlavier Ngurima, who lives in Nizi, one of the hotspots of the outbreak in Ituri, said his brother died before reaching the treatment centre. “We had called on a nurse from the family to treat him at home because the patient and the family members were afraid to go to the ETC [treatment centre],” he said. “They said that over there, a lot of people die.”", "translation_ja": "", "vocab": [{"word": "surpass", "definition": "～を上回る、超える。数量や記録などが以前のものより大きくなることを表す。"}, {"word": "sequencing", "definition": "配列決定、系統立てること。遺伝子やDNAの配列を特定するプロセス、または出来事を時系列に並べることを意味する。"}, {"word": "hamper", "definition": "～を妨害する、邪魔をする。進捗や活動を困難にすることを表す。"}, {"word": "misinformation", "definition": "誤った情報、虚偽の情報。不正確または意図的に誤った情報が広がることを指す。"}, {"word": "fatality ratio", "definition": "致命率、死亡率。感染者のうち死亡に至った人の割合を表す。"}, {"word": "deployment", "definition": "配置、展開。人員や資源を特定の場所や任務に配置すること。"}]}, {"title_ja": "ジンバブエ船舶事故の死者数が68人に、捜索続行中", "title_en": "Zimbabwe boat accident death toll reaches 68 as search continues", "summary_ja": "火曜日にカリバ湖で渡し船が転覆し、子ども18人を含む68人が死亡しました。ジンバブエ史上最悪の海難事故と考えられています。定員90人の船舶が119人の乗客を乗せていた状態で強風中に転覆しました。当局は全遺体の回収に自信を示しています。", "summary_en": "A ferry capsized on Lake Kariba on Tuesday, killing 68 people including 18 children in what is believed to be Zimbabwe's deadliest maritime disaster. The vessel was overloaded with 119 passengers when it capsized during heavy winds, despite being authorized to carry only 90 people. Recovery efforts continue with officials confident all bodies will be retrieved.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/15/more-bodies-recovered-after-zimbabwe-boat-accident", "state_media": false, "category": "経済", "full_text": "Twenty-two more bodies have been recovered after a boat accident in Zimbabwe, taking the death toll to 68, police said on Saturday.\nThe ferry capsized on Tuesday on Lake Kariba, on the border with Zambia. An investigation has suggested it was overloaded when it turned over during heavy winds.\nEighteen children were among the people killed, Zimbabwe’s police said, in what is believed to be the country’s deadliest such disaster.\nMost of the passengers are believed to be villagers and fish traders who lived around the lake.\nOfficials said the vessel was authorised to carry 90 people but was packed with 114 adults, five crew members and an unspecified number of children.\nLt Col Joseph Muchechesi, commander of the boat regiment involved in the search operation, said: “So far today we have managed to take 22 bodies. We are confident that we will manage to retrieve all the bodies.”\nThe civil protection unit said on Wednesday that 77 people had been rescued.\nHundreds of people gathered at the district hospital in the lakeside town of Kariba to identify the bodies of their relatives and loved ones.\nA public memorial service was held in Kariba, nearly 280km (175 miles) north-west of the capital Harare, on Thursday before the burials started.\nSurvivors said they pleaded with the ferry driver to turn back as the vessel had begun taking on water soon after departing.\nChance Siyamavhu, 45, told Agence France-Presse: “Thank God that a wave pushed the sinking vessel and we managed to climb on top.\n“When the boat capsized, most of the people scrambled to get the lifejackets but most of them did not even know how to use them.\n“Most people could not make it.”\nLake Kariba is the world’s largest manmade lake by volume. It stretches more than 200km (124 miles) and is up to 40km (25 miles) wide in places.\nIt was created in the 1950s during British colonial rule, when the Zambezi River was dammed, displacing about 57,000 people.\nIn 2014, 26 people, 24 of them children, drowned in Zambia’s part of the lake, when the boat meant to transport them to independence day celebrations capsized.\nOn the Zimbabwean side, five passengers drowned in a 2021 incident.", "translation_ja": "", "vocab": [{"word": "capsized", "definition": "船舶が転覆すること。「The ferry capsized during heavy winds」のように、悪天候により船が横転して沈没する状況を説明する際に使用されます。"}, {"word": "overloaded", "definition": "定員を超えて荷物や人員を積むこと。「The vessel was overloaded with 119 passengers」のように、許可された容量を超える状態を表現します。"}, {"word": "displacement", "definition": "強制的な移動や移住。歴史的文脈で「displacing about 57,000 people」のように、大規模なプロジェクトにより人々が土地から移動させられることを指します。"}, {"word": "manmade", "definition": "人工的に作られたもの。「the world's largest manmade lake」のように、自然ではなく人間によって構築された施設や構造物を説明します。"}, {"word": "maritime", "definition": "海または船舶に関連すること。「maritime disaster」のように、海上での事故や海運業に関する用語として使用されます。"}, {"word": "scrambled", "definition": "急いで這いずり回る、必死に動く。「scrambled to get the lifejackets」のように、緊急事態で人々が無秩序に急速に行動する様子を表現します。"}]}, {"title_ja": "モロッコ警察、セウタへの侵入を試みた111人を逮捕", "title_en": "Moroccan police arrest 111 migrants attempting to cross into Spanish territory Ceuta", "summary_ja": "モロッコ当局は、スペイン領北アフリカの飛び地セウタへの侵入を試みたサハラ砂漠以南のアフリカ移民111人を逮捕した。この作戦は催涙ガスの使用と国境両側のセキュリティ強化を伴い、7万2000人以上の移民がこの領土に殺到した2週間後に発生した。スペインは追加の警察配備と海上障壁により態勢を強化し、違法な越境を阻止しモロッコへの移民送還を誓約している。", "summary_en": "Moroccan authorities arrested 111 people, mostly sub-Saharan African migrants, as they attempted to enter Spain's north African enclave of Ceuta following social media calls for mass crossings. The operation involved teargas dispersal and heightened security measures on both sides of the border, occurring two weeks after over 72,000 migrants surged into the territory. Spain has reinforced its presence with additional police and maritime barriers, vowing to prevent further unauthorized crossings and return irregular migrants to Morocco.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/15/moroccan-police-arrest-more-than-100-people-as-they-attempt-to-enter-ceuta", "state_media": false, "category": "社会", "full_text": "Moroccan police have arrested 111 people as they tried to enter Spain’s north African territory of Ceuta, amid tightened security on both sides after social media posts called for another mass crossing.\nThe attempted crossing on Saturday came two weeks after more than 72,000 migrants surged into Ceuta, causing tensions within the EU and prompting anti-immigration rhetoric among far-right parties worldwide. At least 96 people died trying to reach European soil.\nA source in Morocco’s interior ministry told news agency Reuters that those detained included 109 migrants from sub-Saharan Africa and two Moroccan citizens arrested in or around Fnideq, the Moroccan city near Ceuta.\nMoroccan police used teargas to disperse groups of migrants gathered on hills about 1.9 miles (3km) from the border, according to Spanish news agency EFE. Reuters later saw hundreds of police officers, some in riot gear and others in plainclothes, returning from the hills outside Fnideq.\nEFE and Spanish state broadcaster TVE said Morocco’s interior ministry ordered their journalists to leave Fnideq immediately, without providing an explanation.\nIn Ceuta, Spanish soldiers guarded supermarkets while police patrolled the main streets. The city was calmer than in the days after the deadly crossing attempt on 30 July.\nMadrid has since installed a maritime barrier and deployed more than 500 additional police officers from mainland Spain, raising the total in Ceuta to more than 1,600. The interior ministry said the reinforcements would remain for as long as needed.\n“We’ll continue to deploy whatever personnel are necessary to restore normality as soon as possible and prevent events like those of 30 July from happening again,” Spain’s interior minister, Fernando Grande-Marlaska, said on Thursday.\nAbout 5,000 migrants remained in Ceuta, the minister added. Reuters saw hundreds sheltering from scorching heat under makeshift bamboo shelters on the urban beach of El Trampolin.\nGrande-Marlaska said migrants who entered irregularly would not be allowed to stay in the territory, travel to mainland Spain or obtain legal status, except in rare cases involving extreme vulnerability. Those without a right to remain would be returned to Morocco, he added.\nEarlier this week, Rabat said it was monitoring “the circulation of social media posts and messages of unknown origin” calling for a mass crossing on 15 August, warning it would prosecute organisers and participants.\nA Reuters witness saw reinforced security near the border, including police vans with wire shields and road checkpoints. Local media reported similar measures near Melilla, another Spanish territory in north Africa.\nAuthorities prevented several groups from boarding trains and buses to northern Morocco in cities such as Casablanca, Fez and Kenitra. However, witnesses told Reuters that some migrants from sub-Saharan Africa were bypassing security checkpoints by taking mountain routes towards Fnideq.\nOne witness said the schools in Fnideq had been turned into accommodation for security forces deployed near the border.", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "周囲を別の領土に囲まれた領土、特に政治的に独立した地域。この記事ではセウタがスペイン領の飛び地であることを示します。"}, {"word": "surge", "definition": "急速で突然の増加または流入。ここでは大量の移民がある地域に押し寄せることを表します。"}, {"word": "disperse", "definition": "集まった人々や物を四方八方に散らす、または分散させる。警察が群衆を催涙ガスで散らすことを指します。"}, {"word": "reinforcements", "definition": "追加の人員や物資による強化。軍隊や警察の人数増加など、力を強める支援を意味します。"}, {"word": "maritime", "definition": "海や船舶に関連する。ここでは海上での境界管理や防御システムを指します。"}, {"word": "irregular", "definition": "規則的でない、または不正な。ここでは法的な手続きを経ずに国に入った移民を意味します。"}, {"word": "prosecute", "definition": "犯罪人を法廷に訴える、または訴追する。法的責任を追及し処罰することを表します。"}]}, {"title_ja": "ロシア、ザポリージャ原子力発電所近くでのウクライナ無人機攻撃を報告", "title_en": "Russia Reports Ukrainian Drone Strike Near Zaporizhzhia Nuclear Plant", "summary_ja": "占領下のウクライナにあるヨーロッパ最大の原子力発電所近くでの無人機攻撃により、ロシアの報告によると1人の専門家が殺害され17人が負傷した。国際原子力機関はバス停で職員が被撃されたことを確認したが、原子力の安全性被害は報告されなかった。ただし、原子力施設への攻撃の中止を強く求めた。この事件はIAEA事務局長による原子力安全評価のための予定訪問の直前に発生した。", "summary_en": "A drone strike near Europe's largest nuclear power plant in occupied Ukraine killed one specialist and wounded 17 others, according to Russian reports. The International Atomic Energy Agency confirmed the strike hit staff at a bus stop but reported no nuclear safety damage, though it urged an end to attacks on nuclear facilities. The incident occurred ahead of a scheduled visit by the IAEA director to assess nuclear safety at the Russian-controlled plant.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/18/russia-reports-ukrainian-drone-strike-near-zaporizhzhia-nuclear-plant?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Russia reports Ukrainian drone strike near Zaporizhzhia nuclear plant\nConcern over the security of Europe’s largest nuclear plant has been rife since Russia launched its full-scale war on Ukraine nearly five years ago.\nA drone strike close to the Zaporizhzhia Nuclear Power Plant in occupied southeastern Ukraine has killed one nuclear specialist and wounded 17, according to Russian reports.\nMoscow asserted on Tuesday that the drone was launched by Ukraine. The security of Europe’s biggest nuclear plant has provoked significant global concern amid the full-scale war on Ukraine that Russia launched in February 2022.\nMost of those injured by the strike were employees of the plant, according to a Telegram update by the Russian management of the nuclear facility. It asserted that the attack constituted one of the most serious incidents in the plant’s history.\nThe International Atomic Energy Agency (IAEA) earlier confirmed reports that the strike hit staff members at a bus stop.\n“No nuclear safety or security damage was reported,” the IAEA, the United Nations’ nuclear watchdog, said on social media.\nHowever, it called “on military commanders responsible for these actions as well as all others aiming on nuclear power plants and/or their staff to put an immediate stop to these unacceptable actions”, citing the “great risks to nuclear safety”.\nThe Zaporizhzhia plant was seized by Russian forces a month after Moscow launched its invasion. The facility has been under Russian management since.\nThe safety of the plant – and the potential consequences of a hit amid the hostilities – have been a concern since the start of the war.\nZaporizhzhia’s six reactors can produce nearly six gigawatts of electricity, and the plant was crucial to supplying power to Ukraine’s national grid. All of the reactors have been shut down since Russia captured the plant, but a strike could cause damage and potentially cause serious leaks of radioactive material.\nTuesday’s strike came ahead of a scheduled visit by IAEA Director-General Rafael Grossi to assess nuclear safety. It’s not clear if that visit will still take place.\nA Russian strike on a thermal power plant was reported in central Ukraine a few hours later, forcing a halt to operations, according to DTEK, Ukraine’s largest energy provider and the company that operates the plant.\nNo casualties were reported, but DTEK stated on social media that the attack caused “significant damage to equipment”.\nRussia has attacked the company’s thermal plants 230 times since the start of the war, according to DTEK’s Telegram channel, as it wages a campaign to destroy Ukraine’s energy infrastructure.", "translation_ja": "", "vocab": [{"word": "provoked", "definition": "~を引き起こした、招いたという意味。ここでは世界的な懸念を生じさせたことを表している。cause or give rise to (a reaction or emotion) という用法。"}, {"word": "casualties", "definition": "死傷者、被害者という意味。戦争や事故における死亡・負傷者の総称。a person killed or injured in a war or accident という定義。"}, {"word": "radioactive", "definition": "放射能を帯びた、放射性のという意味。原子力関連の技術用語で、放射線を放出する物質の特性を示す。containing or consisting of radium, plutonium, or other radioactive substances という用法。"}, {"word": "infrastructure", "definition": "社会基盤、インフラストラクチャーという意味。発電所、道路、通信網などの基本的な施設を総称する。the basic physical systems needed for a country or organization to operate efficiently という定義。"}, {"word": "unprecedented", "definition": "前例のない、かつてないという意味。新しい、比較対象がない状況を表す。never done or known before という用法。"}, {"word": "seized", "definition": "掌握した、奪取したという意味。ここでは軍事力により支配下に置いたことを表している。take forcible possession of という定義。"}]}, {"title_ja": "ホセ・モウリーニョがレアル・マドリーの監督として13年ぶりに復帰", "title_en": "Jose Mourinho Returns to Real Madrid as Manager in Private Ceremony", "summary_ja": "ホセ・モウリーニョがクローズドな式典でレアル・マドリーの監督として2度目の就任を正式に開始した。13年前の退任から戻ってくる彼の契約は2029年6月まで有効である。この異例に限定的な式典は、期待されていた彼の復帰の控えめな船出を示している。", "summary_en": "Jose Mourinho has officially begun his second tenure as Real Madrid manager in a closed-door ceremony, returning to the club 13 years after his first departure. His contract will keep him with the club through June 2029. The unusually private nature of the event marks an understated beginning to his highly anticipated return.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/18/jose-mourinho-returns-to-real-madrid-in-closed-door-ceremony?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "Jose Mourinho returns to Real Madrid in closed-door ceremony\nNewsFeed\nJose Mourinho returns to Real Madrid in closed-door ceremony\nIn an unusually private ceremony, Jose Mourinho has officially begun his second spell as Real Madrid manager, 13 years after leaving the club. He will be with Real through June 2029.\nPublished On 18 Aug 2026", "translation_ja": "", "vocab": [{"word": "tenure", "definition": "職務や地位を保持する期間のこと。特に管理職や公式な立場における任期を指す。"}, {"word": "closed-door", "definition": "公開されない、非公開の形式での実施を意味する。メディアや一般人に対して秘密裏に行われることを示す。"}, {"word": "underscore", "definition": "強調する、際立たせるという意味。ここでは式典の特徴的な性質を強く印象付けるという使われ方。"}, {"word": "spell", "definition": "一定期間の職務経歴や滞在期間を指す。\"first spell\"で最初の任期、\"second spell\"で2度目の任期を意味する。"}, {"word": "departure", "definition": "去ること、退職することを意味する。特に職務から離れることを指す。"}]}, {"title_ja": "リベリア、米国からの強制送還者1,200人を受け入れへ", "title_en": "Liberia to Accept 1,200 US Deportees in Largest Third-Country Deal", "summary_ja": "リベリアは米国から最大1,200人の強制送還者を受け入れることに合意し、最初のグループ20人は間もなく到着する予定である。これはトランプ政権が35カ国以上との間で結んだ第三国強制送還協定の中で最大規模である。2026年3月に公表された協定には、強制送還者がゲストとして滞在し、自由に出国できる条項が含まれている。", "summary_en": "Liberia has agreed to accept up to 1,200 deportees from the United States, with the first group of 20 expected to arrive soon. This represents the largest number of third-country deportees under Trump administration agreements with 35+ countries. The deal, made public in March 2026, includes provisions allowing deportees to remain as guests and depart freely.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/18/liberia-to-take-1200-deportees-from-the-us?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Liberia to take 1,200 deportees from the US\nThe first group of 20 deportees is expected to arrive in the coming days.\nLiberia will accept up to 1,200 third-country deportees from the United States, the country’s Information Minister Jerolinmek Piah told reporters in the capital, Monrovia.\nThe first group of 20 deportees is expected to arrive on Thursday, Piah told reporters on Tuesday. The country would be taking nationals from Africa, North and South America and the Caribbean.\nRecommended Stories\nlist of 3 items\n- list 1 of 3Most Americans say Trump has gone too far on US immigration: Poll\n- list 2 of 3Salvadoran man dies in ICE custody at New Jersey detention centre\n- list 3 of 3US seeks to revive criminal case against Kilmar Abrego Garcia\n“The government wants to emphasise that those being brought to Liberia are being received as guests of the Republic,” Piah said, adding they would “remain free to depart the country when they so desire.”\nThe Trump administration has made agreements with at least 35 countries for accepting third-country deportees, according to Refugees International and Human Rights First, two groups tracking the deals.\nThe Liberian deal would be for the largest number of deportees under those arrangements so far.\nThe US has sent approximately 22,000 people to 26 countries they did not originate from as of early August 2026, according to the rights groups.\nLiberia and the US entered an agreement in 2025 that was made public in March 2026, and would ensure that asylum seekers and others needing protection would be able to stay in the country if deported there.\nThe US has tried to convince courts to let it send Kilmar Abrego Garcia, an El Salvador native whose case has drawn national attention, to Liberia. As a reward for agreeing to accept Garcia in 2025, the Trump administration at one point extended the validity of certain visas for Liberians from 12 to 36 months, and committed $124m for the country’s health services.\nThe Liberia deportations agreement is being challenged by several lawsuits in the US.", "translation_ja": "", "vocab": [{"word": "deportees", "definition": "強制送還された人々、または強制送還の対象となる人々を指す。移民法執行の文脈で用いられる。"}, {"word": "third-country nationals", "definition": "出身国でも受け入れ予定国でもない第三国の国籍を持つ人物。難民・移民政策で使用される技術用語。"}, {"word": "asylum seekers", "definition": "保護と庇護を求めて他国に申請した人々。国際難民法に関連する重要な用語。"}, {"word": "arrangements", "definition": "国家間の協定や合意のこと。公式な取り決めや制度を意味する。"}, {"word": "validity", "definition": "有効期間、効力の期間。ビザや契約の有効性を指す際に用いられる。"}, {"word": "challenged", "definition": "法的に異議を唱えられている、訴訟の対象となっている状態を表す。"}]}, {"title_ja": "アメリカを超えて：アラブ諸国とその安全保障ニーズについて", "title_en": "Beyond America: On the Arab states, their security needs", "summary_ja": "トランプ大統領のオマーンへの脅迫はイラン交渉の停滞と中東地域でのアメリカの影響力低下を反映している。アメリカの軍事基地がイランの攻撃で被害を受け、地域の同盟国がアメリカの関与を疑問視する中、湾岸諸国は新たな戦略的現実に直面している。アラブ諸国はアメリカの安全保障への依存を再考し、イランとの独立した地域安定を追求すべきである。", "summary_en": "Trump's threats against Oman reflect U.S. frustration with stalled Iran negotiations and America's declining influence in the Persian Gulf. With American military bases damaged by Iranian strikes and regional allies questioning U.S. commitment, Gulf countries face a new strategic reality. Arab states should reconsider their reliance on American security and pursue independent regional stability with Iran.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/opinion/editorial/beyond-america-on-the-arab-states-their-security-needs/article71360986.ece", "state_media": false, "category": "社会", "full_text": "Donald Trump’s threat to bomb Oman, a long-standing American ally in the Persian Gulf, reflects both his administration’s deepening frustration with the war against Iran and Washington’s declining influence in the region. This is the second time that the U.S. leader has threatened to attack Oman, which hosted talks between Washington and Tehran before he launched the war on February 28. When Mr. Trump backed down from a threatened escalation after 13 days of bombing on Iran in July, he said the U.S. and Iran were close to a deal on reopening the Strait of Hormuz, which was closed by Iran after it was attacked. But Iran never said that it had agreed to a deal with the U.S. over the Strait and instead issued several demands, including releasing frozen funds and issuing sanctions relief, as preconditions for any agreement. Ever since, Oman, under U.S. influence, has been talking to Iran seeking a settlement. As Iran, which survived two rounds of U.S. bombings, refused to offer major concessions, the U.S.’s frustration with Oman has deepened. Mr. Trump has repeatedly claimed that the Strait of Hormuz was open, but traffic through the waterway, through which one-fifth of the world’s seaborne oil passed before the war, is nowhere near its pre-war levels.\nThe war has raised questions about America’s regional security strategy and its commitment to the security of its allies. Over the years the U.S. had built military bases across the Persian Gulf. However, Tehran has turned these bases into a liability by repeatedly striking them and their host countries. At least 15 American bases, including the Fifth Fleet Headquarters in Bahrain, are either damaged or destroyed, which has substantially reduced the U.S.’s strategic presence. But Mr. Trump does not seem to grasp the seriousness of the situation. Instead of reassuring the allies, he is now threatening to bomb them because they are not able to deliver on his push for a face-saving deal with Iran. From day one of the war, his threats and rhetoric did little to advance America’s strategic goals or deter Iran. But Mr. Trump, stuck deep in the Persian sands, appears unable to change tack. Whether he acknowledges America’s growing limitations in West Asia or not, countries in the region confront a new strategic reality: the foundations of the old security architecture have been shaken. In their hour of need, American bases have turned out to be a liability. They should also recognise that the decades-old policy of containing Iran has failed. To ensure their own security and regional stability, the Persian Gulf countries need to look beyond the American security umbrella and lay the foundations for a new regional order, shaped by a cold peace between the Arab states and Iran.\nPublished - August 19, 2026 12:10 am IST", "translation_ja": "", "vocab": [{"word": "liability", "definition": "負債、あるいは責任を伴う不利な存在や状況を指す。ここでは軍事基地がむしろ国を危険にさらす要素となっていることを意味する。"}, {"word": "escalation", "definition": "紛争や危機が段階的に拡大・悪化することを意味する。国際関係や軍事用語として頻繁に使用される。"}, {"word": "deter", "definition": "恐れや懸念により、ある行動を思いとどまらせることを意味する。安全保障政策において重要な概念である。"}, {"word": "precondition", "definition": "合意や交渉が成立する前に満たされるべき条件を指す。交渉で相手が要求する基本的な条件をいう。"}, {"word": "containment", "definition": "特定の国や勢力の影響力の拡大を抑制する政策戦略を意味する。冷戦期のアメリカの対ソ戦略として有名である。"}, {"word": "strategic", "definition": "長期的な目標達成のために計画された重要な戦略に関する。政治や軍事の文脈で広く使われる形容詞である。"}]}, {"title_ja": "UAEがイランの弾道ミサイル発射を非難、トランプ大統領がホルムズ海峡の併合を脅迫", "title_en": "UAE Accuses Iran of Firing Ballistic Missiles; Trump Threatens Hormuz Annexation", "summary_ja": "UAEは2026年8月18日、イランが領土に向けて2発の弾道ミサイルを発射したと報告し、1発は領海内に落下した。一方、米国のトランプ大統領は、ホルムズ海峡を新しい米国領土として示す地図を投稿し、イランとの交渉は計画されていないと述べて緊張を エスカレートさせた。", "summary_en": "The UAE reported that Iran launched two ballistic missiles at its territory on August 18, 2026, with one falling in territorial waters. Meanwhile, U.S. President Trump escalated tensions by posting a map claiming the Strait of Hormuz as new American territory and stated no talks with Iran are planned.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-us-west-asia-war-strait-of-hormuz-news-donald-trump-live-updates-on-august-18-2026/article71358724.ece", "state_media": false, "category": "政治", "full_text": "“Due to the current situation, potential missile threats, immediately seek a safe place in the closest secure building,” the UAE’s Interior Ministry said in the phone alert. Representational file image.\n| Photo Credit:\nGetty Images/iStockphoto\nThe United Arab Emirates on Tuesday (August 18, 2026) accused Iran of firing two ballistic missiles at its territory, marking the first time the Defence Ministry detected a barrage aimed at the country in months.\n“UAE air defences detected two ballistic missiles launched from Iran toward the country, with the first falling outside the country’s territorial waters, while the second fell within the territorial waters,” said a statement posted by the Defence Ministry on X.\nThe statement came nearly two hours after a brief phone alert warned UAE residents of a “potential missile threat”.\nEarlier, U.S. President Donald Trump said on Tuesday (August 18, 2026) that no talks with Iran are under way or scheduled, as he posted a map showing the Strait of Hormuz as a new American territory in a fresh jibe at Tehran.\nFollow the LIVE updates below:\nAugust 18, 2026 23:28\nUAE accuses Iran of firing ballistic missiles at its territory\nThe United Arab Emirates on Tuesday (August 18, 2026) accused Iran of firing two ballistic missiles at its territory, marking the first time the Defence Ministry detected a barrage aimed at the country in months.\n“UAE air defenses detected two ballistic missiles launched from Iran toward the country, with the first falling outside the country’s territorial waters, while the second fell within the territorial waters,” said a statement posted by the Defence Ministry on X.\nThe statement came nearly two hours after a brief phone alert warned UAE residents of a “potential missile threat”.\n- AFP\nAugust 18, 2026 19:30\nTrump says no talks taking place or planned with Iran\nU.S. President Donald Trump said Tuesday that no U.S. talks with Iran are under way or planned and insisted the b
