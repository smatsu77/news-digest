or flights and prepare for potential travel disruptions.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/iran-us-war-live-updates-donald-trump-tehran-mojtaba-khamenei-fresh-strikes-irgc-strait-of-hormuz-ceasefire-deal/article71293385.ece", "state_media": false, "category": "政治", "full_text": "West Asia war LIVE: U.S. embassies urge citizens to ‘consider departing’ from West Asia\nThere were no U.S. strikes on Iran overnight, but Iran’s paramilitary Revolutionary Guard said on Friday (July 31, 2026) it had struck another two tankers in the Strait of Hormuz, and Kuwait said it intercepted drones\nPeople walk past a mural depicting the late leader of the Islamic Revolution, Ayatollah Ruhollah Khomeini, and Iran's late Supreme Leader Ayatollah Ali Khamenei, on a street in Tehran, Iran, on July 30, 2026. Photo: Majid Asgaripour/WANA (West Asia News Agency) via Reuters\nThis LIVE is now closed\nIran’s military accused the United States of “escalating tensions” in West Asia on Saturday (August 1, 2026) and warned countries in the region against cooperating with Washington during the ongoing conflict.\nThe remarks came after US President Donald Trump reiterated threats to hit Iran “very hard”. The White House signalled that U.S. President Donald Trump is weighing carrying out new strikes on Iran as the U.S. presses for Tehran to reopen the Strait of Hormuz and abide by terms set out in a truce agreement the two sides forged last month, only to quickly collapse.\nU.S. embassies in several capitals in West Asia warned American citizens to beware an “unforeseen escalation” in the regional conflict and urged them to be ready to leave.\nAugust 02, 2026 00:07\nTrump threatens more strikes on Iran; Tensions from Hormuz to Kuwait, Gaza lead to more warnings\nU.S. President Donald Trump threatened more strikes on Iran as the United States presses for the reopening of the Strait of Hormuz.\nHours later on Saturday (August 1, 2026), Kuwait said it responded to a new round of drone attacks from Iran while a tanker was struck in the strategic waterway.\nMeanwhile, Israel carried out heavy strikes on the Gaza Strip after the Palestinian militant group Hamas agreed to disarm.\n-AP\nAugust 01, 2026 23:26\nYemen's Houthis deny wanting to charge Bab el-Mandeb Strait tolls\nYemen’s Iran-backed Houthi rebels on Saturday (August 1) denied seeking to charge ships for passage of the vital Bab al-Mandeb strait.\nIt came after a minister in Yemen’s internationally recognised government claimed they were doing so.\nThe Houthi-aligned Saba news agency published a statement from the group’s HOCC agency which denied the accuracy of the reports.\n“The HOCC further emphasises that transit through the Bab al-Mandeb Strait is free of charge,” the Houthi-backed administrative agency said.\n-AFP\nAugust 01, 2026 21:38\nUN says Israeli demolitions in Lebanon ‘deeply concerning’\nU.S. embassies in several capitals in West Asia warned American citizens to beware an “unforeseen escalation” in the regional conflict and urged them to be ready to leave.\n“Americans in the region should consider departing, or be prepared to depart should there be escalation,” said a security alert, versions of which were posted on social media by the U.S. missions in Amman, Jerusalem, Muscat, Baghdad and Beirut.\nThe messages urged citizens to check flight details and to follow safety advice from local authorities.\n“Americans currently in the Middle East should exercise caution and heightened vigilance and should be prepared for flight cancellations, periodic airspace closures, and potential travel disruptions,” it said.\n- AFP\nAugust 01, 2026 18:45\nIsraeli soldier injured in ‘close-quarters encounter’ with Hezbollah in Lebanon: Army\nThe Israeli military said one of its soldiers was moderately injured during a “close-quarters encounter” with Hezbollah militants in southern Lebanon overnight on Saturday (August 1, 2026), despite a ceasefire.\n“Overnight (Saturday), an IDF officer was moderately injured during operational activity in southern Lebanon,” the military said in a statement, specifying to AFP that the soldier was “injured during a close-quarters encounter with terrorists” in the area.\nWhen contacted by AFP journalists in Beirut, Hezbollah did not comment. The militant group has not claimed any attacks since June 20.\n- AFP\nAugust 01, 2026 18:40\nU.S. embassies urge citizens to ‘consider departing’ from West Asia regions\nU.S. embassies in several West Asian capitals warned American citizens to beware an “unforeseen escalation” in the regional conflict and urged them to be ready to leave.\n“Americans in the region should consider departing, or be prepared to depart should there be escalation,” said a security alert, versions of which were posted on social media by the U.S. missions in Amman, Jerusalem and Baghdad.\n- AFP\nAugust 01, 2026 16:09\n\"Unacceptable\": Araghchi issues stern warning to U.K. over military base access to U.S.\nIran has warned the U.K. against allowing the United States to use British military bases for attacks against Iran, stating that it constitutes an act of aggression that entitles Tehran to resort to “self-defence.”\nAccording to Press TV, Iranian Foreign Minister Seyyed Abbas Araghchi made the remarks during a telephone conversation with his British counterpart", "translation_ja": "", "vocab": [{"word": "escalation", "definition": "紛争や問題が段階的に悪化・拡大していくこと。軍事や政治の文脈で使用されることが多い。"}, {"word": "paramilitary", "definition": "正規軍ではなく、政府や政治組織に属する準軍事的な武装組織を指す。"}, {"word": "Strait of Hormuz", "definition": "ペルシャ湾とオマーン湾の間の重要な海峡で、世界の石油輸送の大部分が通過する戦略的に重要な地点。"}, {"word": "vigilance", "definition": "細心の注意や警戒心を持つこと。危険な状況で周囲に注意を払う態度を示す。"}, {"word": "reiterate", "definition": "同じことを繰り返して述べること。強調や確認のために何度も言う。"}, {"word": "unforeseen", "definition": "予見できない、予想外の出来事や状況を意味する。"}]}, {"title_ja": "ペルーのナスカ地上絵観光飛行で観光客飛行機が墜落、13人死亡", "title_en": "Tourist plane crashes in Peru during Nazca Lines sightseeing flight, 13 killed", "summary_ja": "ペルーの航空会社アエロディアーナが運航するセスナ機がナスカ近郊の畑に墜落し、機上の13人全員が死亡しました。この飛行機は古代の地上絵ナスカ・ラインズの観光飛行を実施していました。ペルー当局は事故の調査を開始しています。", "summary_en": "A Cessna aircraft operated by Peruvian airline Aerodiana crashed in a field near Nazca, Peru on Saturday, killing all 13 people on board. The plane was conducting a scenic flight over the famous Nazca Lines, ancient geoglyphs that can only be fully viewed from the air. Peruvian authorities have launched an investigation into the accident.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/tourist-plane-crashes-in-peru-killing-13-on-nazca-lines-sightseeing-flight/article71295978.ece", "state_media": false, "category": "政治", "full_text": "A plane carrying tourists crashed into a field in Peru outside the city of Nazca killing 13 people, local authorities said.\nIn a statement on Facebook, Nazca's municipal government said the plane on Saturday (August 1, 2026) was taking tourists on a sightseeing flight of the Nazca Lines, a group of extensive geoglyphs scraped into the desert around Nazca hundreds of years ago by Peru's Indigenous inhabitants. The lines form images of animals that can only be fully appreciated from planes or viewing towers.\nNazca's government said the plane departed from the nearby city of Ica and was operated by Peruvian company Aerodiana. On its website, the airline says that it has offered scenic flights over the Nazca lines for the past 14 years, using Cessna Grand Caravan planes.\nPeruvian authorities said the accident is under investigation. Aerodiana was not immediately available for comment.\nPublished - August 02, 2026 02:14 am IST", "translation_ja": "", "vocab": [{"word": "geoglyphs", "definition": "地表に描かれた巨大な図形や絵。古代の人々が大地に刻んだ芸術作品で、通常は空から見ることで完全に認識できます。"}, {"word": "sightseeing", "definition": "観光目的で景勝地や名所を訪問・見学すること。観光飛行は飛行機から景色を見て楽しむツアーです。"}, {"word": "scenic", "definition": "風景や眺望が美しい、または風景を楽しむ目的の。観光飛行は景観を見ることに特化した飛行を指します。"}, {"word": "operated", "definition": "事業・機器などを運営・操作・管理すること。航空会社が飛行機を運行するという意味で使われます。"}, {"word": "authorities", "definition": "公式な権限を持つ機関または組織。通常は政府機関や官公庁を指し、調査や統制を行う立場にあります。"}]}, {"title_ja": "モスクワのレストラン爆発で3人死亡、15人負傷", "title_en": "3 killed, 15 wounded in Moscow restaurant explosion", "summary_ja": "2026年8月1日土曜日、ロシア・モスクワ中心部のクドリンスカヤ広場にあるレストランで爆発が発生し、少なくとも3人が殺害され、15人が負傷した。ロシア国営メディアが報じたところによると、調査官、鑑識専門家、緊急対応チームが現場で活動し、事件の詳細と死傷者数を確認している。モスクワ捜査委員会は爆発の完全な詳細を調査中である。", "summary_en": "An explosion at a restaurant in central Moscow's Kudrinskaya Square killed at least three people and injured 15 others on Saturday, August 1, 2026. Russian state media reported that investigators, forensic experts, and emergency services are working at the scene to establish the exact death toll and circumstances of the incident. The Moscow Investigative Committee is still determining complete details of the explosion.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/moscow-restaurant-explosion-in-russia-kills-people-injures-more-than-a-dozen/article71295966.ece", "state_media": false, "category": "経済", "full_text": "An explosion at a restaurant in central Moscow killed at least three people, Russian state media said on Saturday (August 1, 2026), citing local officials.\nAt least 15 people were injured in the explosion and investigators, forensic experts and emergency services were working at the scene, Russian state news agency RIA Novosti reported.\nThe exact number of dead and injured, as well as the circumstances of the incident on Moscow's Kudrinskaya Square, are being established, the Moscow Investigative Committee told the news agency.\nPublished - August 02, 2026 01:43 am IST", "translation_ja": "", "vocab": [{"word": "forensic", "definition": "犯罪や事件の証拠を科学的に分析・調査することに関連する。法医学的な、または司法的な調査に用いられる専門用語。"}, {"word": "investigative committee", "definition": "事件や犯罪を調査する公式な政府機関。ロシアではМВД（内務省）の下部組織として機能する。"}, {"word": "circumstances", "definition": "事件や出来事が発生した状況や背景。文脈や条件を指す正式な表現。"}, {"word": "casualties", "definition": "事故や災害で死傷した人々。死亡者と負傷者の両方を含む統計用語。"}, {"word": "incident", "definition": "予期しない出来事や事件。特に事故や問題となる事柄を指す。"}]}, {"title_ja": "トロント大学教授が数学の最高栄誉を受賞、OpenAIに参加するため休職", "title_en": "U of T Professor Wins Math's Highest Honour, Takes Leave to Join OpenAI", "summary_ja": "トロント大学の数学教授がフィールズ賞（数学における最も権威ある賞の一つ）を受賞し、OpenAIに参加するために休職を取得します。この決定は、学問的卓越性と人工知能開発の交差点が拡大していることを示しています。教授の決断は、一流研究者がアカデミアからAI企業へ移動する広範な傾向を反映しています。", "summary_en": "A University of Toronto mathematics professor has won the Fields Medal, one of the most prestigious awards in mathematics, and is taking a leave of absence to join OpenAI. The decision highlights the growing intersection between academic excellence and artificial intelligence development. The professor's move reflects broader trends of top researchers moving from academia to AI companies.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMikwJBVV95cUxQbkMwYXJhMTZCOWhEV2RFZ1RvVDJOMlNLNTJsUGV6NGdDWWo4TGVwSEtPLWhJSHRYRDAtenhHM2NFVFdRSWdSaG4weEZRTzQ0ejl5em0tM3ZsaXNEeGtKOFNsVnNfUm5BYktMLUlMTUxJY2lKeG1xYy1wUlAyQk1tQlF4TGxtZFpIajZDVE5EaGw3aGFVRmRrcnExRjI3NmxOUlREaW5zTUtvcThEMk5sTDF1LXAzZUk1N0lra3NxLWdfdFJJeWxmVWxvQzBhX2ZqbkJUZkl1dGcyNHlpTWhibmZkdDcwSzY1ZWJUYXpHenh5WXJEV094WDVra2Z5bXRmYjJlaWFITTJFVllyeFlPUHpwZw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カナダが木製キャビネット・洗面台輸入品に一時的25%関税を課す", "title_en": "Canada to impose temporary 25% tariff on wood cabinet and vanity imports", "summary_ja": "カナダは輸入木製キャビネットと洗面台に対して一時的な25%の関税を導入することを発表した。本措置はこれらの建設資材の輸入に影響を与える見込みだが、期間と具体的な対象製品カテゴリーについては現在検討中である。この関税措置はカナダのより広範な通商政策対応の一部である。", "summary_en": "Canada has announced plans to implement a temporary 25% tariff on imported wood cabinets and vanities. The measure is expected to affect imports of these building materials, though the duration and specific product categories remain under review. Th 周年を記念する特別企画の準備を進めている。同社は、この歴史的な節目を祝うため、複数のプロジェクトとプログラムを開発している。", "summary_en": "Grupo Globo, Brazil's largest media conglomerate, is planning special initiatives to mark its 100th anniversary. The company is developing projects and programs to commemorate this milestone in its history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グラスゴー2026：ナイジェリア、最終日にリレーチームとウソロが銀メダル獲得", "title_en": "Nigeria Claims Two Silver Medals at Glasgow 2026 Commonwealth Games", "summary_ja": "2026年コモンウェルスゲームズでナイジェリア陸上チームが好成績を続け、走り幅跳び選手ルース・ウソロと男子4×100mリレーチームを通じて2つの銀メダルを獲得しました。リレーチームは38.12秒の季節最高記録を出してオーストラリアに次ぐ2位でゴールし、当初3位だったカナダは後に失格となりました。これらのメダルはアフリカ最高ランクの国としてのナイジェリアの地位をさらに固めました。", "summary_en": "Nigeria's athletics team continued its strong performance at the 2026 Commonwealth Games in Glasgow, winning two silver medals through long jumper Ruth Usoro and the men's 4x100m relay team. The relay quartet clocked a season's best time of 38.12 seconds, finishing behind Australia, with Canada initially ahead but later disqualified. These medals further solidified Nigeria's position as Africa's highest-ranked nation on the medals table.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/900118-glasgow-2026-nigeria-adds-two-silvers-as-relay-team-usoro-shine-on-penultimate-day.html", "state_media": false, "category": "社会", "full_text": "Team Nigeria continued its impressive athletics campaign at the 2026 Commonwealth Games on Saturday, winning two silver medals through long jumper Ruth Usoro and the men’s 4x100m relay team.\nThe two podium finishes further strengthened Nigeria’s position as Africa’s highest-ranked nation on the medals table and capped another productive day for the country’s athletics team in Glasgow.\nUsoro produced one of her best performances of the season to claim silver in the women’s long jump.\nThe Nigerian took an early lead with a season’s best leap of 6.87 metres on her opening attempt, immediately putting herself in contention for the gold medal. Although she fouled her next two jumps, her opening mark kept her among the leaders throughout the competition before she eventually settled for silver.\nThe medal added another highlight to an outstanding Commonwealth Games campaign for Team Nigeria, whose athletics team has steadily increased the country’s medal tally in the closing stages of the competition.\nNigeria’s men’s 4x100m relay quartet also delivered under pressure, finishing second in a thrilling final.\nThe team of Favour Ashe, Kayinsola Ajayi, Nicholas Fakorede and Udodi Onwuzurike clocked a season’s best time of 38.12 seconds to cross the line behind Australia, who won gold in 38.07 seconds.\nCanada initially finished ahead of Nigeria, but the North Americans were later disqualified, officially promoting the Nigerian quartet to the silver medal position.\nALSO READ: Glasgow 2026 Day Eight Review: Nathaniel shines as Team Nigeria strengthens grip as Africa’s best\nThe relay medal rewarded a sprint squad that had shown consistency throughout the Games. Earlier in the competition, Kayinsola Ajayi won bronze in the men’s 100m, ending Nigeria’s 20-year wait for a Commonwealth Games medal in the event, while Udodi Onwuzurike also claimed silver in the men’s 200m.\nWith the latest silver medals, Team Nigeria continued to enjoy one of its most successful Commonwealth Games outings in recent years, with athletics joining weightlifting and para-athletics as major contributors to the country’s impressive medal haul in Glasgow.\nDiscover more from Premium Times Nigeria\nSubscribe to get the latest posts sent to your email.", "translation_ja": "", "vocab": [{"word": "podium finish", "definition": "表彰台に上がること、つまりメダルを獲得して3位以内に入賞することを意味します。競技会で優れた成績を収めたことを示す表現です。"}, {"word": "contention", "definition": "競争や争いの状態、または議論の対象となること。ここでは金メダルの可能性がある状態を示しています。"}, {"word": "fouled", "definition": "スポーツで規則違反をすること。走り幅跳びでは助走やジャンプが規則に違反することを意味します。"}, {"word": "disqualified", "definition": "競技から失格にされることで、ルール違反などの理由で競技資格を失うことです。"}, {"word": "consistency", "definition": "一貫性や安定性を示すことで、繰り返して良い成績を出し続けることを意味します。"}, {"word": "haul", "definition": "獲得したもの全体の量を指します。ここでは複数の競技を通じて獲得したメダルの総数を意味しています。"}]}, {"title_ja": "オゴリ先住民の時間計測：4日間のカレンダーシステム", "title_en": "Ogori Indigenous Timekeeping: A Four-Day Calendar System", "summary_ja": "ナイジェリアのオゴリ民族は、グレゴリオ暦とは独立した洗練された4日間の先住民カレンダー（エビナ、オファジ、オヌメジ、オコト）を維持している。このシステムは市場に特定の日を指定し、他の日を結婚式や葬儀などの共同体の儀式に充てることで、伝統的な時間計測がいかに集団活動の調整の枠組みとして機能するかを示す。8月の第2エビナに行われる年次オゴリ新年祭は、この先住民知識体系を今後の世代のために記録・保存する重要な機会となる。", "summary_en": "The Ogori people of Nigeria maintain a sophisticated four-day indigenous calendar (Ebina, Ofaji, Onumeji, Okoto) that organizes economic and social life independently from the Gregorian calendar. This system designates specific days for markets and others for communal ceremonies like weddings and burials, demonstrating how traditional timekeeping serves as a framework for coordinating collective activities. The annual Ogori New Year celebration on the second Ebina in August represents an important opportunity to document and preserve this indigenous knowledge system for future generations.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/opinion/900108-the-ogori-indigenous-timekeeping-economic-order-and-the-new-year-by-petra-akinti-onyegbule.html", "state_media": false, "category": "経済", "full_text": "As Ogori prepares to celebrate its New Year on Thursday, 6 August, the second Ebina, this article examines the indigenous four-day calendar through which generations of our people have reckoned with time, organised economic life and coordinated communal obligations. Beyond the annual celebration and the much-anticipated Ewe-eji market, the Ogori New Year offers an important window into an indigenous knowledge system that has survived alongside the Gregorian calendar and deserves deliberate documentation and transmission to future generations.\nIntroduction\nAcross Africa, communities developed indigenous systems for measuring time and organising social and economic life long before the widespread adoption of the Gregorian calendar. These systems emerged from the lived realities of the societies that created them and reflected their understanding of seasons, agriculture, commerce, communal obligations and the recurring rhythms of collective existence. In Ogori, we maintain such a system, structured around a four-day week that continues to shape markets, ceremonies and communal life. The annual Ogori New Year, observed on the second Ebina in the Gregorian month of August, remains one of its most visible expressions and presents an important opportunity for cultural reflection, education and documentation.\nIt is against this background that the Communications Directorate of the Ogori Descendants Union, ODU, has adopted “Counting Time the Ogori Way” as the theme for its 2026 Ogori New Year publicity campaign. The theme seeks to move the conversation beyond the announcement of a date towards a fuller understanding of the indigenous system by which generations of our people reckoned time. To count time the Ogori way is not simply to attach indigenous names to days; it is to encounter a distinct architecture of time in which commerce, communal obligations and social participation are ordered within a recurring cycle.\nThe Indigenous Ogori Week: Ebina, Ofaji, Onumeji and Okoto\nAt the heart of our traditional system of reckoning time is a four-day week comprising Ebina, Ofaji, Onumeji and Okoto, occurring continuously in that sequence. Of these four days, Ebina and Onumeji are market days, while Ofaji and Okoto are non-market days. This distinction is fundamental to understanding the indigenous Ogori calendar because the days are more than simple markers of the passage of time; they form part of a larger structure for organising communal life. In a society in which markets provide essential opportunities for farmers to sell produce, traders to exchange goods and households to obtain necessities, the regular recurrence of designated market days creates predictability and order. Economic activities can be planned around a cycle understood by the entire community, enabling production, movement, exchange and other obligations to be coordinated accordingly.\nThe usefulness of this system rests upon shared knowledge. The significance of Ebina as a market day, for example, depends upon the collective expectation that traders and buyers will gather on that day. In this sense, the calendar establishes a common temporal order through which members of the community can anticipate one another’s activities and organise their own. It therefore serves not merely as a method of counting days but as a framework for collective coordination, demonstrating how an apparently simple calendar can carry within it a sophisticated system for ordering social and economic life.\nMarket Days and the Organisation of Communal Life\nOne of the clearest illustrations of this relationship between time and economic organisation is the practice of not holding weddings and burials on Ebina and Onumeji. This should not be mistaken for a taboo or religious prohibition. The reasoning is practical: major social events would interfere with the seamless conduct of economic activities. In a close-knit communal society such as ours, a wedding or burial is rarely a private affair involving only an immediate family. Such occasions mobilise extended families, neighbours, friends and significant sections of the community. Scheduling them on market days would therefore create a direct conflict between social obligation and economic necessity, compelling people to choose between participating in an important communal event and attending to their livelihoods.\nBy leaving Ofaji and Okoto available for major social obligations, the community developed an effective mechanism for managing competing demands on communal time. Markets could operate without the disruption caused by major ceremonies, while weddings and burials could receive the participation expected of the community. Viewed through a contemporary lens, this may be understood as a form of indigenous economic governance and social coordination, maintained not through written legislation or administrative enforcement but through collective understanding and convention.\nThe practice also cautions against interpreting e", "translation_ja": "", "vocab": [{"word": "reckoned", "definition": "時間や数などを計算する、または見積もる。ここでは先住民の時間計測システムを使って時間を数えることを意味する。"}, {"word": "indigenous", "definition": "ある地域や国に本来から存在する、固有の。この文脈では、植民地化や外部文化の影響を受ける前から存在する先住民の知識体系を指す。"}, {"word": "coordination", "definition": "複数の要素やグループを組織化し、協力させること。この文脈では共同体の経済活動と社会行事を調和させることを意味する。"}, {"word": "mechanism", "definition": "物事が機能する仕組みや方法。ここでは競合する時間的要求を管理するための体系的な方法を指す。"}, {"word": "governance", "definition": "管理、統治、支配。この文脈では法律ではなく慣例を通じて社会的秩序を維持する方法を意味する。"}, {"word": "seamless", "definition": "継ぎ目がない、滑らかな。ここでは妨害や中断なく経済活動が継続することを意味する。"}]}, {"title_ja": "アティク前副大統領、オバサンジョ前大統領に反論「個人的な忠誠より国家と民主主義を選んだ」", "title_en": "Atiku Responds to Obasanjo: 'I Chose Nigeria and Democracy Over Personal Loyalty'", "summary_ja": "アティク前副大統領はオバサンジョ前大統領からの批判に対して、ナイジェリアの憲法と民主主義原則を個人的な関係より優先させたと主張した。彼は、地位や成果がどうであれ、いかなる個人もナイジェリア連邦共和国とその憲法枠組みより大きくはないと強調している。", "summary_en": "Atiku has responded to criticism from former President Obasanjo, asserting that he prioritized Nigeria's constitution and democratic principles over personal relationships. He emphasized that no individual, regardless of status or accomplishments, is greater than the Federal Republic of Nigeria and its constitutional framework.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/headlines/900103-atiku-hits-back-at-obasanjo-says-i-chose-nigeria-democracy-over-personal-loyalty.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イランが代理勢力を利用した大規模戦争計画を策定", "title_en": "Iran Plotted Wider War With Help of Its Proxies", "summary_ja": "一時的な休戦中にイラン指導部は、米国が攻撃を再開した場合に代理勢力を活用して紛争を拡大させる秘密計画を立案していた。この戦略はトランプ大統領に対する軍事的コストを増加させ、直接対決を超えた戦争規模の拡大能力を示すことを意図していた。", "summary_en": "During a temporary ceasefire, Iranian officials secretly developed plans to escalate military conflict by leveraging proxy forces if the U.S. resumed attacks. The strategy was designed to increase costs for President Trump and demonstrate Iran's ability to expand the scope of warfare beyond direct confrontation.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/08/01/world/middleeast/iran-proxies-war-oil.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペイン、移民流入受けセウタに浮遊バリア設置", "title_en": "Spain Installs Floating Barrier in Ceuta Amid Migration Crisis", "summary_ja": "スペインはアフリカの飛び地セウタで移民の急増を受け、浮遊バリアを配置した。到着した移民の大多数はモロッコへ戻ったが、領土への進入を試みて少なくとも67人が死亡したと当局は発表した。このバリアは不正な国境越えを制御するための当局の取り組みを示している。", "summary_en": "Spain has deployed a floating barrier in Ceuta, its North African enclave, following a surge in migrant arrivals. Most migrants have returned to Morocco, though at least 67 people died attempting to enter the territory. The barrier represents authorities' effort to control unauthorized border crossings.", "source": "N
