 "translation_ja": "", "vocab": []}, {"title_ja": "フランスの大規模火災、首相が「制御下にある」と発表", "title_en": "France's Devastating Wildfires Now 'Under Control,' Says PM", "summary_ja": "フランスは致命的な熱波による河川の干上がりや植生の乾燥に続き、数週間にわたって大規模な野火と闘ってきた。首相はこれらの火災が現在制御下にあると発表した。科学者らはこれらの極端な気象現象を人為的な気候変動に関連付けている。", "summary_en": "France has been battling widespread wildfires for weeks following a series of deadly heatwaves that have dried up riverbeds and vegetation across the country. The Prime Minister announced that the fires are now under control. Scientists have linked these extreme weather events to human-made climate change.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/environment/article/2026/08/01/france-wildfires-stop-spreading-but-still-not-under-control_6756061_114.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省ニュースレター", "title_en": "Mindef Newsletter", "summary_ja": "海峡タイムズの国防省（Mindef）セクションからのニュースレター案内です。読者は提供されたリンクを通じて無料ニュースレターに登録し、購読を管理できます。", "summary_en": "This is a newsletter announcement from The Straits Times Ministry of Defence (Mindef) section. Readers can sign up for free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イブニング・アップデート", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズのイブニング・アップデートニュースレターは、日次のニュースブリーフィングと最新情報を提供しています。読者は提供されたリンクを通じて追加の無料ニュースレターを購読し、購読を管理できます。", "summary_en": "The Straits Times Evening Update newsletter provides daily news briefing and updates. Readers can subscribe to additional free newsletters and manage their subscriptions through the provided links.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニング・ブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズは読者に最新情報を提供するデイリーモーニング・ブリーフィングニュースレターを配信しています。購読者は自分のニュースレター設定を管理し、出版社から追加の無料コンテンツにサインアップできます。", "summary_en": "The Straits Times delivers its daily Morning Briefing newsletter to keep readers informed on current events. Subscribers can manage their newsletter preferences and sign up for additional free content from the publication.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国、イラン・ミサイルからのイスラエル防衛に不十分な兵力と将軍が警告", "title_en": "U.S. Lacks Forces to Defend Israel From Iranian Missiles, General Warns", "summary_ja": "米軍の将軍が、イランのミサイル攻撃からイスラエルを防衛するための米国の兵力が不十分だと警告している。この報告は、地域の緊張が高まる中で、中東における米国の軍事能力に懸念を示している。", "summary_en": "A U.S. military general has warned that the United States does not have sufficient forces to defend Israel against Iranian missile attacks. The report raises concerns about America's military capacity in the Middle East amid escalating regional tensions.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMilgJBVV95cUxObTE3ZkF5dXRVR0MwSWpucmlDWEZDREwxYTNNTzNhRkFkRURVbFVLNU9uZnRjNnRJWmVEMW13V3RKX0F6ZXJOZVU0YVpOS3RzX3ZKWDQxZUdTb2tpeDdxQ1JIODNKRThhcERSdGhuc3VXRWFkZlllcHY0X1BKN3BESFNMdHg5QXBwTXVlYlpEaXNFamEwZDhycGhBcW0ybmpsbE5vQXVDbklGRlI4RV94ZzBOSUFEVlJ1eEpMeWEwRWt2QlNoSTN6NkNzUXdzUTFtSTlHZ3N5NHgzVDJIM3FuV3NuZHZfaXpCSE5SM1laQUZ5UC1SbVlSYmx0OF9WX3BPNmVPX0NSWE9peGVnNGFocEtnLUVYUQ?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "IDF予備役兵が自殺で死亡、1週間で3件目の事例", "title_en": "IDF Reservist Dies by Suicide in Third Case This Week", "summary_ja": "イスラエル国防軍（IDF）の予備役兵が自殺で亡くなり、過去1週間で3件目となりました。この事件は、最近の作戦によるトラウマに対処している予備兵の間で深刻化する精神衛生上の懸念を浮き彫りにしています。", "summary_en": "An IDF reservist has died by suicide, marking the third such case in the past week among Israeli military personnel. The incident highlights growing mental health concerns among reserve soldiers, particularly those dealing with trauma from recent operations.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi-AFBVV95cUxPZ2tGTUtpSzRjY0xpSmhGNTJwdUQ3TjlLdXgza1BvVTh6X0tRNWVndi1BRTdPcVV1cUJPRms4Y0RMc0JVTTVPMWlQQWRXdG81d1VBdDlaZWxOemVBWXFvZ05wRjJPVzhJVFNLRFMzaThlMFlCQ0V1cEtaSmxjSGcxRVdIUGFRZktzd09lOC11LXpKeDRobnFKV3RCVGZiY3ZIV2F0ai1JVFM0T29rM2d0Ujc0V2pVR29VZEtId3RlTVB2ZDFVSm9iYWY5eVN2LUdkVGtnblFwY0RuX2t1OVJYelczMllGelJ2SVJxLVF0Z3hDWGFQT0xoRw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "Andy Levin、AIPAC圧力後にEl-Sayedを全面支持", "title_en": "Andy Levin Backs El-Sayed After AIPAC Opposition", "summary_ja": "前米下院議員Andy Levinは、自身の選挙活動がAIPAC（イスラエル支持ロビー団体）の反対で失敗に終わったとして、ラシーダ・タラブ下院議員の同盟者をミシガン州の政治選挙で支持することを表明した。Levinの支持表明は、中東政策とイスラエル支持擁護をめぐる民主党内の緊張の高まりを示している。", "summary_en": "Former U.S. Congressman Andy Levin has thrown his support behind Congresswoman Rashida Tlaib's ally in a Michigan political race, citing his own unsuccessful bid that he attributes to opposition from AIPAC, the pro-Israel lobbying group. Levin's endorsement signals growing tension within Democratic politics over Middle East policy and pro-Israel advocacy.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMigwJBVV95cUxNODhjUzZsSUNsSmhiUHpZMDI4SVdWTnZyejhhdG9oZ1VLV2tNeWpacDFMcnp4OEdxU3FNV3QycHVaeml6RUNISGVaMmtuTkQtNzBQdGh6eDdnMkRBSVk0QkdLZzlWMVFVVU44eXoycThNdjdWZmRwZ1p5OU0yYzR1dDl6SFd6UEJKYXZtb1c0NGx0MHVHTkVFTzhyMlZYQ3hYTUJNbEZfVzdBeUNwdW5YYU1zaEY3dnNLcEFBUmZMX25xRHFLcUtCb1N4TkJfZXhLN0U5RUlET29vLW53SG80aFN3N29fR2Y1N2dtMWJ5MkVfdlFjV0xqdE5fREFEbmo3Vmtr?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾内政部、親中政党の解散を求める", "title_en": "Taiwan Ministry of Interior Seeks Dissolution of Pro-China Party", "summary_ja": "台湾の内政部が親中政治政党の解散を求める計画を発表した。この措置は、不適切な外国政治的提携を持つとみなされる組織に対する政府行動の継続を示している。解散の具体的な根拠と法的根拠に関する詳細は今後明らかになる見込みである。", "summary_en": "Taiwan's Ministry of the Interior has announced plans to seek the dissolution of a pro-China political party. The move represents continued government action against organizations deemed to have inappropriate foreign political affiliations. Details regarding the specific party and legal grounds for dissolution are expected to follow.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBVUFBQNnBXWGF4dnlaLXk1Y3paWUhGdWR3N3UzX2REZkRBbjVQaTVPY1FneXNhWnNnOEswblRBVFBPem9BejdrWjNvRkszOXNodTdHd3czTQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、強制労働に関連する輸入品をブロックするメカニズムを開始", "title_en": "Taiwan Launches Mechanism to Block Imports Tied to Forced Labor", "summary_ja": "台湾は強制労働慣行を通じて生産された商品の輸入を防ぐための新しいメカニズムを確立しました。この取り組みは国際基準との調和を目指し、労働者の権利を保護しながら倫理的なサプライチェーンを確保することを目的としています。この措置は、グローバル貿易における労働搾取との戦いに対する台湾のコミットメントを反映しています。", "summary_en": "Taiwan has established a new mechanism to prevent the importation of goods produced through forced labor practices. This initiative aims to align with international standards and protect workers' rights while ensuring ethical supply chains. The measure reflects Taiwan's commitment to combating labor exploitation in global trade.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBqeDF3cjRyc0pnSFF4UWxWRlZFQzdMY3YzYU5mT1BUd3Q5YXRPQjFTOVpxcEo3S3RzSURzRFZvajBLbVJ6b19lVFBVbzZ0RVZ2T09wdFowNA?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "外交的報復としてモロッコ国民の台湾ビザ申請を禁止", "title_en": "Taiwan Bars Moroccan Visa Applications in Diplomatic Dispute", "summary_ja": "台湾は二国間の外交的問題への対抗措置として、モロッコ国民のビザ申請を停止した。この措置は、報復的な応酬の激化を示唆している。紛争の具体的な原因は報告書に詳しく記載されていない。", "summary_en": "Taiwan has suspended visa applications from Moroccan citizens in response to a diplomatic disagreement between the two nations. The move represents an escalation in tensions in what appears to be a tit-for-tat exchange. The exact cause of the dispute has not been detailed in the report.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE1GWWZYQ19KNVpXQmliMENxckMzVkYta0dzRXg1VzlQQ1dZUHJ3NWxrcF9RaEtGME5kSl95LXhkTml3UE5NMHJJcFBNZ2pNZ2ZCcDBxb01Qcw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国武術ウーシュがアフリカの若者の間で人気を集める", "title_en": "Chinese Martial Art Wushu Gains Popularity Among African Youth", "summary_ja": "CGTNは、中国の武術ウーシュがアフリカ、特にケニアの若者の間で人気が高まっていると報じています。国営メディアによると、実践者らはウーシュを競技スポーツとしてだけでなく、規律と自制心を養い、文化交流を促進する手段として受け入れているとのことです。", "summary_en": "CGTN reports that Chinese martial art Wushu is experiencing growing interest among young people in Africa, particularly in Kenya. According to the state-controlled outlet, practitioners are embracing Wushu as both a competitive sport and as a means to develop discipline, self-control, and foster cultural exchange.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-07-31/Chinese-martial-art-Wushu-gains-popularity-among-Africa-s-youth-1Pe94P0KjRK/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セウタ越境事件の死傷者数が増加", "title_en": "Death toll rises in Ceuta crossing incident", "summary_ja": "CGTNは、スペインがセウタの飛び地に国家警察官、市民警備隊要員および軍部隊を追加配備してセキュリティを強化したと報じている。報道によると、当局が事件に対応する中、緊急受け入れ施設は大きな圧力下にあるという。", "summary_en": "CGTN reports that Spain has reinforced security in the enclave of Ceuta by deploying additional National Police officers, Civil Guard personnel and military units. According to the report, emergency reception facilities remain under heavy pressure as authorities respond to the incident.", "source": "CGTN", "tier": "state", "link": "https://newsaf.cgtn.com/news/2026-08-01/Ceuta-crossing-death-toll-climbs-1PeB8TCEW3u/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国の最高議員がスロバキア大統領と会談", "title_en": "China's Top Legislator Meets Slovak President in Beijing", "summary_ja": "CGTNによると、全国人民代表大会常務委員会の趙楽際主席は水曜日に北京でスロバキアのペーター・ペレグリーニ大統領と会談した。この会談は、中国の立法指導部とスロバキアの行政府との間の外交的関係を示している。初期報告では、会談のテーマについてのさらなる詳細は明かされていない。", "summary_en": "CGTN reports that Zhao Leji, chairman of the Standing Committee of the National People's Congress (NPC), met with Slovak President Peter Pellegrini in Beijing on Wednesday. The meeting represents diplomatic engagement between China's legislative leadership and Slovakia's executive branch. Further details regarding the topics discussed were not disclosed in the initial report.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-07-29/China-s-top-legislator-meets-Slovak-president-1PbbD3tChTG/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ペルーでの飛行機墜落で観光客13人が死亡", "title_en": "Plane crash in Peru kills 13 tourists", "summary_ja": "TASSは、ペルーでの飛行機墜落により観光客13人が死亡したと報じています。報道によれば、墜落の原因は現在調査中です。事件に関する詳細情報は限定的です。", "summary_en": "TASS reports that a plane crash in Peru has resulted in 13 tourist deaths. According to the report, the cause of the crash is currently under investigation. Additional details about the incident remain limited.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2168039", "state_media": true, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モスクワのカフェ爆発で21人負傷 女性が爆発装置を持ち込んだ疑い", "title_en": "Moscow Cafe Blast Injures 21; Woman Suspected of Bringing IED", "summary_ja": "TASS/ロシア国家反テロ委員会によると、モスクワのカフェで爆発が起き21人が負傷したと報告されている。報道によれば、女性が即席爆発装置をこの飲食店に持ち込んだと伝えられている。同事件はテロ攻撃に分類されている。", "summary_en": "TASS/National Anti-Terrorism Committee reports that 21 people were wounded in an explosion at a Moscow cafe. According to the report, a woman brought an improvised explosive device to the eatery. The incident has been classified as a terrorist attack.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2168033", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モスクワ中心部のカフェで爆発、3人死亡、15人負傷", "title_en": "Explosion at Moscow café kills three, injures 15", "summary_ja": "TASSは、モスクワ中心部のクドリンスカヤ広場のカフェで爆発が発生し、3人が死亡、15人が負傷したと伝えている。爆発が発生した集合住宅の周辺への立ち入りをロシアの警察と国家親衛隊が制限した。初期報告では爆発の原因は明かされていない。", "summary_en": "TASS reports that an explosion occurred at a café in central Moscow on Kudrinskaya Square, resulting in three deaths and 15 injuries. Russian police and the National Guard restricted access to the area around the residential high-rise where the blast took place. The cause of the explosion has not been disclosed in initial reports.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2168031", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "アフリカのエネルギー呪いは政治的選択である", "title_en": "Africa's Energy Curse Is a Political Choice", "summary_ja": "アフリカは膨大な石油・天然ガス資源を保有する一方で、6億人の国民が電力へのアクセスを欠いているが、この矛盾は地質学的制約ではなく政治的決定に由来する。著者らは、汚職、エネルギー補助金、最近の地政学的圧力がアフリカ政府に炭化水素輸出を促す一方、収益を電力基盤整備に投資することが同等の国富をもたらすことを示す証拠があると主張している。", "summary_en": "Africa possesses vast oil and gas reserves while 600 million citizens lack electricity access, yet this paradox stems from political decisions rather than geological constraints. The authors argue that corruption, energy subsidies, and recent geopolitical pressures incentivize African governments to export hydrocarbons rather than use them for domestic electrification, despite evidence that investing revenues in power infrastructure would produce equivalent national wealth.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/africa-energy-abundance-alongside-deprivation-is-a-choice-by-rabah-arezki-and-michael-l-ross-2026-07", "state_media": false, "category": "オピニオン", "full_text": "Africa’s Energy Curse Is a Political Choice\nRabah Arezki and Michael L. Ross\nLIBREVILLE/LOS ANGELES—Africa is facing one of the world’s great energy windfalls. The continent holds roughly 125 billion barrels of confirmed oil reserves and more than 620 trillion cubic feet of natural gas, implying vast additional deposits still waiting to be discovered. At the same time, some 600 million Africans have no electricity at home, and this figure has not fallen since the COVID-19 pandemic. On current trends, it will still exceed a half-billion in 2030.\nThe problem is not geological, but political. Every barrel of oil shipped from an African port to a European or Chinese terminal is a barrel not converted into kilowatts for an African household. Every long-term liquefied natural gas (LNG) contract signed with a foreign utility commits gas that could be powering an African hospital, school, or factory. The choice between exporting hydrocarbons and using them to electrify the continent is highly consequential yet almost never debated openly. That needs to change.\nThe case for energy exports is clear enough. The continent depends heavily on imported food, medicines, capital equipment, and manufactured goods that it does not yet produce at scale. For many producer countries, oil and gas exports are the only reliable source of foreign exchange, without which they cannot pay for those imports, service sovereign debt, or maintain enough fiscal space to function.\nBut the case for domestic use is equally compelling. Nigeria holds enough natural gas to achieve 100% electrification within its borders, and gas-to-power projects across the continent have long demonstrated technical viability. The International Energy Agency estimates that achieving universal electricity access in Africa would require annual investments of $15 billion for ten years, and though only $2.5 billion is currently being committed each year, domestically deployed hydrocarbons could help bridge the gap.\nIn theory, these two options are economically equivalent. A government could export oil, invest the proceeds well, and use the returns to finance power infrastructure. A barrel exported at world prices and a barrel converted into electricity should produce the same national wealth if governance is sound and pricing is free.\nIn reality, neither condition has been met. One major distortion is corruption. Rather than being invested in electrification, hydrocarbon revenues in most African producer states are regularly captured. Nigeria has generated more than $600 billion in oil revenues since the 1960s while also recording one of the world’s highest rates of extreme poverty. During oil-boom years, Equatorial Guinea has achieved the continent’s highest per capita GDP even as over half of its population lives below the poverty line.\nPS Deep Dive: Oligarchy\nA collection of PS commentaries examining how a few individuals amassed unprecedented wealth—and how they are using it to dismantle democracy. Featuring insights from Cristina Enache, Brooke Harrington, James Livingston, Michael Madowitz, Ann Pettifor, Matt Simonton, and Quinn Slobodian.\nSubscribe and save 30%\nAll told, research tracking offshore bank accounts has found that around 15% of windfall gains flowing to petroleum-producing countries with weak institutional safeguards ends up in the pockets of those in power. This easy money then becomes easy spending—but on elite luxury consumption, not public investment.\nDomestic energy subsidies are a second distortion. In many African producer states, consumers pay far less for fuel and electricity than the actual cost. Angola has the world’s fourth-cheapest retail gasoline. Nigeria’s domestic gas prices have historically been held so low that building a gas-fired power plant is commercially pointless.\nThese subsidies are not accidents. They are core instruments of the petrostate political economy: a diffuse benefit handed to populations who otherwise see little of the wealth nominally being extracted on their behalf. But subsidies also send a false signal to investors and governments, making energy exports appear economically superior to domestic use, even when the welfare arithmetic says otherwise.\nRecent geopolitical shocks are a third factor. Russia’s full-scale invasion of Ukraine severed some 80 billion cubic meters of annual gas supplies to Europe, and this year’s Middle East war tightened LNG markets further. Suddenly, European governments were in Algiers, Dakar, and Maputo pleading for more supply. Algeria became the European Union’s second-largest pipeline gas supplier in 2023, providing 20% of pipeline imports, behind Norway at 54% and ahead of Russia at 17%. Angola has directed LNG cargoes westward. And a new project off Mauritania and Senegal shipped its first cargo to Atlantic markets in 2025.\nFor African producers, the windfall has come in the form of both revenues and political cover. Governments now have internationally legitimized reasons to de", "translation_ja": "", "vocab": [{"word": "windfall", "definition": "予期しない幸運な利益。特に大規模で突然の金銭的利益を指す。"}, {"word": "hydrocarbon", "definition": "石油や天然ガスなどの炭素と水素から成る化学物質の総称。エネルギー資源として重要。"}, {"word": "distortion", "definition": "本来の形や事実が歪められた状態。経済学では市場メカニズムを妨害する要因を指す。"}, {"word": "petrostate", "definition": "石油輸出に経済的に大きく依存する国家。石油が政治経済の中心となっている。"}, {"word": "commercially pointless", "definition": "商業的に利益を生まない、経済的に成り立たない状態。ビジネス観点から無意味である。"}, {"word": "subsidy", "definition": "政府が企業や消費者に与える財政的支援。製品価格を低く抑えるために使われることが多い。"}]}, {"title_ja": "EUの急速に縮小する銀行セクター", "title_en": "The EU's Incredible Shrinking Banking Sector", "summary_ja": "著者は過去25年間の銀行業界における劇的な力関係の逆転を検証している。2000年には欧州最大手5行がいずれも米最大手銀行を上回る時価総額を持っていたが、現在ではJPモルガン・チェース1行が欧州トップ5行の合計を超えている。この記事は何がこの変化をもたらしたのかを問い、欧州の政策立案者がこの競争上の不利に対処するための戦略を求めている。", "summary_en": "The author examines a dramatic reversal in banking power over the past 25 years: in 2000, each of the five largest European banks had greater market capitalization than the largest US bank, but today JPMorgan Chase alone exceeds the combined value of the top five EU banks. The piece questions what caused this shift and calls for European policymakers to develop strategies to address this competitive disadvantage.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/top-five-eu-banks-lower-combined-market-capitalization-than-largest-us-bank-by-howard-davies-2026-07", "state_media": false, "category": "オピニオン", "full_text": "The EU’s Incredible Shrinking Banking Sector\n                        At the start of the millennium, all five of the largest European banks had a higher market capitalization than the largest US bank. What explains the fact that a quarter-century later, the largest US bank has a higher capitalization than all five top EU banks combined, and how can European policymakers address this dramatic reversal?\n                    \n                        LONDON—A quarter-century ago, each of the five biggest European Union banks had a market capitalization larger than that of the biggest US bank. Now the market capitalization of the biggest US bank, JPMorganChase, is higher than that of the top five EU banks combined. (The EU is coy about names, but we can presume that the EU banks include France’s BNP Paribas, Germany’s Deutsche Bank, and Spain’s Santander).\n        https://prosyn.org/vwp7ljZ", "translation_ja": "", "vocab": [{"word": "market capitalization", "definition": "企業の時価総額を指し、株価に発行済み株式数を掛けた値である。企業規模や価値を測る主要な指標として使用される。"}, {"word": "reversal", "definition": "状況や傾向が逆転することを意味する。ビジネス文脈では市場での立場や優位性の急激な変化を指す。"}, {"word": "competitive disadvantage", "definition": "競争において他社より劣っている状況を指す。市場での相対的な弱さや戦略的な弱点を意味する。"}, {"word": "policymakers", "definition": "政策や規制を決定する政府や機関の責任者を指す。経済や金融政策の実行権を持つ人々。"}, {"word": "dramatic", "definition": "急劇的で印象的な変化や結果を表現する形容詞。ビジネスニュースでは大きな変動や衝撃的な事態を強調する際に使用される。"}, {"word": "address", "definition": "問題や課題に対して取り組む、対処することを意味する。ビジネス文脈では具体的な解決策を講じることを指す。"}]}, {"title_ja": "AIは経済を拡大すべき、分裂させるべきではない", "title_en": "AI Must Enlarge the Economy, Not Divide It", "summary_ja": "ノーベル賞受賞者16人を含む200人以上の経済学者とAI研究者が、AIが産業革命よりも大規模かつ迅速に世界経済を再構築する可能性があると警告する声明に署名した。著者らは、AIを人間労働者を置き換えるのではなく補完するように開発すべきだと主張しており、この区別は経済的利益を広く享受するために極めて重要だと考えている。", "summary_en": "Over 200 economists and AI researchers, including 16 Nobel laureates, have signed a statement warning that AI could reshape the global economy faster and on a larger scale than the Industrial Revolution. The authors argue that AI should be developed to complement human workers rather than replace them, a distinction they consider crucial for ensuring broad economic benefits rather than creating inequality.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-revolution-does-not-have-to-replace-human-work-by-mark-esposito-and-aurelie-jean-1-2026-07", "state_media": false, "category": "オピニオン", "full_text": "AI Must Enlarge the Economy, Not Divide It\nand\nCAMBRIDGE/PARIS—More than 200 economists and AI researchers, including 16 Nobel laureates, have signed the We Must Act Now statement, warning that AI could reshape the global economy on a scale larger than the Industrial Revolution—and far more quickly. We were among the signatories, but recognizing the stakes does not settle the question of how AI should be developed. One of the statement’s central claims is that AI should be steered toward complementing humans rather than imitating them. That distinction is more consequential than it may seem.", "translation_ja": "", "vocab": [{"word": "signatories", "definition": "声明や契約書に署名した人々を指す。特に複数の著名人や専門家が公式な宣言に同意したことを表す際に使用される。"}, {"word": "reshape", "definition": "根本的に形を変える、再構成する意味。経済や社会の構造が大きく変わることを指す。"}, {"word": "complement", "definition": "何かを補完する、完全にする意味。ここではAIが人間の能力を補助・強化する役割を果たすことを指す。"}, {"word": "consequential", "definition": "重要な結果をもたらす、重大な意味。影響力が大きく無視できない状況を表す。"}, {"word": "steered", "definition": "方向付ける、導く意味。政策や開発方針が特定の目標に向かうよう意図的に管理されることを指す。"}]}, {"title_ja": "バイオハッカー、ガールフレンドの月経血を冷凍保存—女性の健康研究か、単なるマーケティングか", "title_en": "Bryan Johnson's Biohacking Goes Too Far: Freezing Girlfriend's Menstrual Blood", "summary_ja": "テック起業家ブライアン・ジョンソンがガールフレンドのケイト・トロの月経血を研究用に冷凍保存している。医学研究における月経の過小研究という正当な問題に対処する一方で、著者はジョンソンとトロが医学的資格を持たず、このプロジェクトがサプリメント会社のマーケティング戦略である可能性があると警告している。", "summary_en": "Tech entrepreneur Bryan Johnson has collected his girlfriend Kate Tolo's menstrual blood for study, claiming it will advance women's health research. While the initiative addresses legitimate gaps in medical research on menstruation, the author warns that Johnson and Tolo lack medical credentials and the project may be a marketing scheme for their supplement company.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/01/biohacker-bryan-johnson-girlfriend-menstrual-blood", "state_media": false, "category": "オピニオン", "full_text": "The tech entrepreneur Bryan Johnson has devoted his life to dodging death. The 48-year-old is obsessed with becoming the healthiest person in the world and is on a quixotic quest to reverse his biological age and live forever. As such, Johnson is disciplined about what he eats, takes dozens of supplements a day, and measures every single biomarker possible, boasting that he is “certainly the most biologically measured person ever”.\nIn short: good luck finding any ice cream in his freezer. But you know what you will find? His girlfriend’s menstrual blood. On Thursday, Johnson, a chronic oversharer, posted a photo of his 30-year-old girlfriend, Kate Tolo, on X with the caption: “Kate’s period blood is in my -80 °C freezer. Around 10 mL.”\nThis isn’t the first time Johnson has collected a loved one’s bodily fluids: a few years ago he boasted about infusing himself with a liter of his “blood boy’s” plasma. What in God’s name is a blood boy? Oh, that’s just what Johnson calls his son Talmage, who was 17 at the time. Johnson also donated a liter of his own blood to his own father.\nThis also isn’t the first time Johnson has taken it upon himself to share personal information about his loved ones on the internet. Last year, he posted data comparing his and his teenage son’s nocturnal erection metrics. “Nighttime erection data from my 19-year-old son ... and me,” he wrote on X, tagging Talmage. “His duration is two minutes longer than mine. Raise children to stand tall, be firm, and be upright.”\nOnce we’ve all taken a moment to recover from that, we can move on to the menstrual blood in the freezer. What is Johnson planning to do with it? Study it, apparently. “Menstrual blood is valuable and underutilized … It’s a non-invasive look into the uterus,” Johnson explained on X. Tolo and Johnson intend to examine the blood for everything from endocrine disruptors to microplastics. “I like that Kate is a science experiment with me,” he added.\nOK. But does she like it? Well, she hasn’t said she doesn’t. Rather she replied to his post with a message saying: “Thanks for looking after me bby.”\nTolo hasn’t just given a one-off blood sample. Johnson has said that she is collecting “14 million data points on her menstrual cycle”, which he touts as a “world first for female health”. Her protocol involves “100+ tasks a day” and “50+ devices”, all of which is being monitored by a “12 person medical team”. Tolo has to take regular urine samples, swallow a temperature pill, and blow into a metabolism tracker. At exactly 9.42 pm, he writes, she has to “insert techno tampon device”. When the Independent asked for more information about the techno tampon, Johnson said: “We will be sharing more on that soon.”\nTolo has done some sharing of her own. In mid-July, she was featured in a Wall Street Journal piece titled: “Bryan Johnson’s girlfriend wants to share her body with the world,” where she explained that she’s doing all this data-tracking for the good of womankind. “I’m really doing it because I think that this is our path toward women being understood in the world and being seen,” Tolo told the Journal. On a personal level, Tolo has said she has polyendocrine metabolic ovarian syndrome, and is hoping to find treatments that might help her symptoms. Helping her out with that is the famous techno tampon: the Journal’s piece features a photo of Tolo looking very intently at a small tampon-shaped device which will track her blood-flow variations.\nAs Johnson has said: “Women are not well understood medically.” It wasn’t until 1993, when US Congress passed a law requiring that women and minorities be included in clinical research, that we began to be properly represented in medical trials. Menstruation has also been understudied. Indeed, until 2023 there hadn’t been a published study testing period products like tampons using human blood. They’d used saline solution instead. This sort of “medical misogyny” has impacted the quality of care that women get, and resulted in women’s pain not being taken as seriously as men’s.\nIn many ways, then, Johnson and Tolo’s new women’s health initiative is to be applauded. It’s helping break down the stigma attached to menstruation, and it’s raising awareness about women’s health.\nAll that said, I think a smidgen of skepticism is warranted. It’s important to remember that Tolo (who has a background in fashion) and Johnson (whose background is in tech) are not exactly highly credentialled medical researchers. They own a company called Immortals that sells supplements. And guess what? According to the Journal: “The company is on the verge of launching products for women.” Which makes all of this feel a lot like a marketing campaign. I don’t know if the techno tampon will end up being a giant step forward for womankind, but it might well provide a healthy boost to the Immortals balance sheet.\nElon Musk’s xAI is challenging Minnesota over its ban on ‘nudification’ technology\nMinnesota is implementing a first-", "translation_ja": "", "vocab": [{"word": "quixotic", "definition": "現実的でない、実現不可能な理想に基づいた。ドン・キホーテから由来し、非現実的で理想主義的な追求を表す。"}, {"word": "biomarker", "definition": "生物学的な状態や疾患の存在を示す測定可能な物質または特性。医学検査で健康状態を判定するために使われる。"}, {"word": "chronic oversharer", "definition": "習慣的に個人情報を過度に公開する人。慢性的に、継続的にプライベートな情報をオンラインで共有する傾向がある。"}, {"word": "credentialed", "definition": "公式な資格や認定を持っている。医師や研究者などが適切な学位や免許を有していることを示す。"}, {"word": "medical misogyny", "definition": "医学分野における女性に対する差別や軽視。女性の健康が十分に研究されず、医療で女性が軽んじられる現象。"}, {"word": "stigma", "definition": "社会的に不名誉とされる特性や状況。月経のような生理現象に対する負のイメージや偏見。"}]}, {"title_ja": "ロボット教師が生徒の尊敬を得ることはできない理由", "title_en": "Why Robot Teachers Will Never Command Student Respect", "summary_ja": "デイブ・シリングは、学区がアンドロイド教育補助員を配置しようとする計画は根本的に誤った判断であり、子どもたちがどのように学び、関わるかについての理解不足を示していると主張しています。彼は、ロボットに費やされた6万ドルは本物の教師に投資される方がはるかに良いと主張し、スマートフォンやインターネットにアクセスできる生徒が一般的なヒューマノイドロボットを決して尊敬することはないと述べています。", "summary_en": "Dave Schilling argues that a school district's plan to deploy an android teacher's aide is fundamentally misguided and demonstrates a lack of understanding about how children actually learn and engage. He contends that the $60,000 spent on the robot would be better invested in real teachers, and that students will never respect a generic humanoid robot when they have smartphones and the internet at their disposal.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/01/new-york-salamanca-school-robot-teacher-plan", "state_media": false, "category": "オピニオン", "full_text": "What’s more harrowing than sending your child to school? Maybe getting stuck on a city bus that can’t drop below 55 miles per hour or it will explode, but that’s about it. Once your kid hits school age, you have to decide (if you’re lucky) between public and private education, vet the teachers, and neurotically worry about whether they’re learning enough and are socializing effectively. For seven hours a day, someone who’s practically a stranger is responsible for the wellbeing of one of the most important people in your life.\nIt’s a stressful situation, but maybe it would be less so if your kid’s teacher was a humanoid robot.\nOr not. Upstate New York’s Salamanca city central school district recently paused a $60,000 program to install an android teacher’s aide from the company Realbotix, named Sally, to assist their actual instructors. Sally was to have specifically been deployed into high school classrooms for students studying technology and robotics. As the superintendent of Salamanca school district said: “The robot also provides opportunities for students to learn how the robot is maintained, how it is updated with new approved content, and how to troubleshoot issues.” As you can imagine, Sally was chosen by the students of Salamanca to be a perky brunette rather than other options, like “bald middle-aged man” or “aspiring author struggling to finish their novel during lunch break”. I shudder to think what crude jokes teenage boys would come up with regarding their artificial teacher.\nFortunately, public outcry caused the district (which boasts a municipal population of only 6,000 people) to pause their dystopian plans. As bad as this idea was, at least it didn’t involve a robot disciplinarian issuing hall passes and assigning detention to unruly students. All we need is RoboCop chucking kids through a plate-glass window for being tardy to third period. Sally was programmed with working arms and hands, but not legs, which would prevent any random acts of violent retribution.\nI wish any of this made sense. The superintendent said Sally would give a small town, rural student body a chance to interact with high-level technology they’d otherwise have to “travel 1-2 hours” to see. Students could ask it questions about pertinent topics related to their classes. You know, like they could with the smartphones they probably have in their pockets with access to the internet – repository of all information known to humanity. But see, the difference is, this smartphone is shaped like a pretty lady.\nTeenagers are already skeptical or even outright annoyed by their teachers, with their pedantic rules and insistence that learning is fundamental. Teaching can be a thankless job, because of lack of resources, even in large metropolitan areas, let alone small towns. Public school teachers are often underpaid, making it harder to earn a decent living in a taxing profession. Why not take that $60,000 for a robot and divide it up amongst your instructors? Or just buy every student a laptop? Is having an uncanny valley android gesticulating about Arduino boards going to change anyone’s lives besides the upper management at Realbotix? No teenager is going to take this thing seriously or do anything except throw erasers at it while their real teacher isn’t looking.\nAnd anyway, if society is going to thoughtlessly usher in an age of synthetic learning through artificial intelligence, why go with a generic humanoid? We should at least make our robots something kids would like. We could start with a self-aware Super Mario. I’d absolutely stop whatever I was doing to talk to a robo-Mario if I could, and I’m sure teens would do the same. Why is silicon the best material for building microprocessors? How does cloud storage work? What’s the easiest way to beat the Rainbow Ride level in Super Mario 64? Are Princess Peach and Princess Daisy sisters or just good friends?\nIt doesn’t have to be just Mario. What about a robot Pikachu? Could Salamanca school district license the likeness of Logan Paul or MrBeast to teach algebra? We could have android Blippis running preschools, holographic Robin Williamses from Dead Poets Society in universities, and fake Sydney Sweeneys teaching acting. What if the Paw Patrol could work as crossing guards?\nOnce again, the people we’ve put in charge of raising our children show a lack of understanding of actual children. Kids don’t want nondescript robots answering questions a search engine could do just as fast. They want to play Roblox and drink Mountain Dew. And maybe, just maybe, a real, flesh-and-blood human being could inspire them to want more than that. We’ll never find out if we try to outsource education to tech companies.\n- \n  Dave Schilling is a Los Angeles-based writer and humorist", "translation_ja": "", "vocab": [{"word": "harrowing", "definition": "極度に不安や恐怖を感じさせる、ひどく苦しめる。ここでは子どもを学校に送り出すことの親としての心理的な苦痛を表現しています。"}, {"word": "android", "definition": "人間の形をした機械あるいはロボット。人工知能と機械工学を組み合わせた存在を指します。"}, {"word": "uncanny valley", "definition": "人間に非常に似ているが完全には人間ではないもの（ロボットなど）を見たときに感じる違和感や不気味さ。計算機工学の概念です。"}, {"word": "pedantic", "definition": "過度に細かい規則や細部にこだわる、融通性に欠ける態度。教師が杓子定規的に教えることを批判しています。"}, {"word": "thoughtlessly", "definition": "深く考えずに、無分別に行うこと。ここでは人工知能を教育に導入することへの批判です。"}, {"word": "outsource", "definition": "本来は企業内で行うべき業務を外部の企業や組織に委託すること。教育を技術企業に丸投げすることを指します。"}]}, {"title_ja": "米国とイランの戦争が制御不能に陥っている", "title_en": "The US War on Iran Is Spinning Out of Control", "summary_ja": "著者モハマド・バッジは、トランプが開始した米国・イラン紛争が5つの中東諸国に広がる危険な地域紛争へと拡大し、世界的なエネルギー供給と経済安定を脅かしていると主張している。サウジアラビアの関与、イラク政府の複雑な状況、紅海の海運ルートを妨害する可能性のあるフーシ派の活動を含む拡大が、世界的な景気後退を含む深刻な経済的結果のリスクをもたらしている。", "summary_en": "Author Mohamad Bazzi argues that the US-Iran conflict initiated by Trump has escalated into a dangerous regional war spanning five Middle East countries, threatening global energy supplies and economic stability. The expansion includes Saudi Arabia's involvement, Iraqi government complications, and potential Houthi disruptions to Red Sea shipping routes, risking severe economic consequences including potential global recession.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/aug/01/us-iran-war-trump-recession", "state_media": false, "category": "オピニオン", "full_text": "The US war against Iran is spiraling out of control. Over the past week, the conflict has expanded across the Middle East, with attacks and counterattacks in at least five other countries. Instead of a quick war that sought to topple Iran’s regime, Donald Trump has started a regional conflict that risks severely disrupting energy supplies and prices – and triggering a global recession.\nAfter a few days of relative calm, the conflict resumed with the Pentagon carrying out almost nightly strikes against Iran, and Tehran retaliating against US military bases in the region. The conflict also extended to attacks in Saudi Arabia, Iraq, Yemen, Jordan and Egypt. And there’s little sign that peace negotiations between the US and Iran, which are being brokered by Pakistan and Qatar, are making much progress.\nThe most serious escalation took place on Wednesday, when Saudi Arabia announced it had joined the US in carrying out a series of airstrikes inside Iraq, against the Iranian-backed Popular Mobilization Forces (PMF), killing at least 20 fighters. Saudi officials had blamed the Iraqi-based militias for launching drone attacks against Saudi oil facilities on 27 July, and warned that the kingdom would retaliate if the Iraqi government did not restrain the groups. The PMF is a network of mostly Shia Muslim militias that was created, with Tehran’s support, in 2014 to fight the Islamic State terror group that had taken control of large parts of Iraq.\nTrump said the US and Saudi militaries coordinated with the Iraqi government before carrying out airstrikes, but Iraqi leaders quickly denied having any prior knowledge. That denial highlighted the fact that many regional leaders don’t want to be associated with Trump’s expanding regional war. And the attacks threatened to undermine a fragile power balance within Iraq, which has struggled to stop the US-Iran war from spilling over its borders and to maintain a good relationship with both sides.\nAfter the US invaded Iraq in 2003, it ousted Tehran’s enemy, Saddam Hussein, and his Sunni-dominated regime from power. Washington then helped install a Shia-led government for the first time in Iraq’s modern history, opening the door for Iran to extend its influence over its neighbor and cultivate powerful Shia militias. Iran’s efforts were largely overseen by Qassem Suleimani, a general who headed the foreign operations wing of Iran’s Islamic Revolutionary Guard Corps. Suleimani was assassinated by a US drone strike in Baghdad in January 2020, on Trump’s orders – an attack that helped set the stage for the current war and fueled further animosity between the US and Iraq’s PMF coalition, whose deputy chief, Abu Mahdi al-Muhandis, was killed alongside Suleimani.\nBeyond drawing Iraq’s Shia militias further into the regional conflict, the US and Saudi Arabia risk expanding the war in even more dangerous directions. The kingdom is reportedly planning for a major military offensive against the Houthi militia, another Iranian ally, which controls large areas of Yemen.\nAfter Trump launched his war in late February, Iran effectively shut the strait of Hormuz, through which a fifth of the world’s oil and liquid gas supplies passed each day. As a result, some oil producers, especially Saudi Arabia, shifted their exports to the Red Sea. But the Houthis are able to disrupt international shipping through the Red Sea, as they did after Israel’s invasion of Gaza in 2023, when the Yemeni militia began firing missiles and drones at ships near the Bab el-Mandab strait. That caused insurance premiums to soar and forced companies to reroute vessels around Africa, adding weeks to a typical journey and increasing the cost of goods in Europe and elsewhere.\nSo far, the Houthis have not tried to disrupt ships passing through the Red Sea on a large scale, via the Bab el-Mandab chokepoint, which comes closest to Yemeni territory. But on 20 July, the militia declared a blockade on Saudi vessels transiting the Red Sea, claiming it was in retaliation for an air and naval blockade that the kingdom had imposed years ago against Houthi-controlled areas of Yemen. The Houthis have since attacked several ships in the Red Sea, forcing Saudi Arabia to reroute nearly half of its oil exports through a longer and more expensive journey around the southern tip of Africa. On 25 July, the Houthis claimed to have struck “sensitive” oil infrastructure sites inside Saudi Arabia with missiles and drones, disrupting the kingdom’s Red Sea export hub of Yanbu. The Saudis have retaliated with air strikes against Houthi targets in Yemen.\nLike Iran’s other neighbors in the Persian Gulf, the Saudi economy has been hit hard by the war, especially Tehran’s closure of the strait of Hormuz and its attacks against energy infrastructure in the Gulf. Saudi Arabia’s GDP decreased by nearly 5% in the second quarter of 2026, compared with the same period last year.\nSaudi leaders are blaming Iran for the latest Houthi escalation, and they’ve vowed", "translation_ja": "", "vocab": [{"word": "spiral out of control", "definition": "制御できないほど急速に悪化・拡大する状態。もともと制御されていた状況が、次々と予期しない展開を見せ、管理不能になることを意味するイディオム。"}, {"word": "escalation", "definition": "紛争や対立が段階的に激化・拡大すること。軍事用語としても使用され、衝突の規模や強度が増していく過程を指す。"}, {"word": "broker", "definition": "交渉や仲介を行う仲介者。外交的な文脈では、対立する2者間の合意を成立させるため仲介役を務める人または国を指す。"}, {"word": "chokepoint", "definition": "国際貿易や物流の中で、限定された通路により通行が制限される戦略的に重要な場所。海峡や運河など、迂回が困難で支配されやすい地点。"}, {"word": "retaliate", "definition": "相手の攻撃や危害に対して報復・復讐を行うこと。国家間の紛争では、相手の行動に対する対抗措置を講じることを意味する。"}, {"word": "fragile", "definition": "壊れやすく不安定な状態。政治的な文脈では、均衡が容易に崩壊する可能性を持つ脆弱な状況を示す。"}]}, {"title_ja": "弱体化するロシアが戦い続ける理由", "title_en": "Why a Weaker Russia Keeps Fighting", "summary_ja": "プーチンのウクライナ戦争勝利のための3つの戦略はすべて失敗した。トランプとの外交交渉は崩壊し、米国の支援削減はヨーロッパの支援で相殺され、ロシアはもはやウクライナを長期戦で圧倒できない。しかし、兵員損失の増加、戦場での停滞、経済的困難という悪化する状況にもかかわらず、プーチンは交渉の兆候を示さず、紛争は無期限に続くことが確実である。", "summary_en": "Putin's three strategies to win the Ukraine war have all failed: diplomacy with Trump collapsed, U.S. aid cuts were offset by European support, and Russia can no longer outlast Ukraine militarily. Yet despite deteriorating conditions—mounting casualties, stalled battlefield gains, and economic strain—Putin shows no sign of negotiating, ensuring the conflict will continue indefinitely.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/ukraine/why-weaker-russia-keeps-fighting", "state_media": false, "category": "オピニオン", "full_text": "At the end of June, Russian President Vladimir Putin gave an interview in which he declared, once again, that Russia would win its war against Ukraine. The Russian army, he said, was advancing along the roughly 800-mile frontline and occupying more Ukrainian land every day. Kyiv, by contrast, was flailing. He acknowledged that the Ukrainian drone strikes torching Russian oil refineries and other critical infrastructure deep behind the frontlines were “creating problems.” But Russians would adapt and persevere. “These terrorist attacks have no impact whatsoever on the situation,” he said.\nIf this were 20 months ago, Putin’s confidence would have been warranted. At the time, recently elected U.S. President Donald Trump was praising Moscow and criticizing Kyiv. Russian troops were making slow but steady gains on the battlefield. Putin could thus follow three strategies, as we argued in a March 2025 Foreign Affairs essay. Under Plan A, the Kremlin would work with the White House to make Kyiv accept a deal written in Moscow. Under Plan B, Putin would simply hold out until Trump pulled U.S. support for Ukraine, allowing Russian troops to roll to victory. Failing that, Putin could pivot to Plan C: continuing to fight and ultimately prevailing on the battlefield.\nToday, however, Russia’s position has deteriorated. Plan A—winning over Trump—failed; Putin didn’t even mention the U.S. president in his recent interview. Plan B also went awry. Although the White House stopped providing Ukraine with many types of assistance, the United States has continued to supply vital intelligence to Kyiv and enforce sanctions against Russia. Meanwhile, Kyiv has been able to turn to its European backers to make up for the lost aid. In fact, Ukraine is now better positioned militarily than it was last year. Russia, by contrast, is losing more soldiers than it can recruit and stalling out on the battlefield. Its economy is facing increasing trouble. Thus, Plan C, in which Russia would win by outlasting Ukraine, is also not working.\nBut that does not mean Putin will change course. Russia’s problems are real, but the country is nonetheless capable of sustaining the conflict. Its economy remains functional enough, and it has the manpower and weaponry needed to keep battling. Moscow is also devising new ways to regain the initiative. The Kremlin’s insistence on continuing to fight will make life worse for Russians, and so there are elites in Moscow calling for a negotiated resolution. But there is no indication that Putin is listening. The war, then, is almost certain to drag on.\nGREAT EXPECTATIONS\nWhen Trump took office in 2025, the Kremlin believed it could achieve a diplomatic coup. During the 2024 campaign, Trump had pledged to end the war in Ukraine “within 24 hours.” Upon taking office, he moved to pressure Ukraine’s leaders to accede to some of Russia’s demands. In February 2025, he insisted that Ukrainian President Volodymyr Zelensky agree to an immediate cease-fire with Russia and insinuated that Kyiv was responsible for the war. When Zelensky refused, Trump temporarily suspended intelligence sharing and military aid to Ukraine. Vice President JD Vance delivered a speech at the 2025 Munich Security Conference in which he declared that the United States was pulling back from Europe. And in August 2025, Trump and Putin held an amiable summit in Alaska. Afterward, the U.S. president said, again, that Zelensky was the reason the conflict wasn’t finished.\nThe trajectory of the Russian economy and the dynamics of the battlefield further boosted Putin’s confidence. In 2024, Russia’s GDP grew by 4.3 percent, fueled by military production and domestic consumption. Inflation was high but manageable. The Russian armed forces were recruiting more men than they were losing, whereas the Ukrainian army was losing more soldiers than it was gaining. The creeping occupation of the Donbas was costing Russia tens of thousands of troops, but these losses were tolerated as the country continued to advance. In 2024, Putin captured around 1,600 square miles of Ukrainian territory. Russia was producing nearly as many drones as Ukraine and using them in increasingly creative ways. It was producing far more traditional weapons, such as artillery shells and missiles, than was Ukraine or its Western partners. From the Kremlin’s viewpoint, a Russian victory was inevitable.\nBut not for the first time, Putin’s complacency led to overconfidence. He continued to push for conditions that Trump either could not accept or could not deliver—including that Kyiv surrender parts of the Donbas it still controlled and sign away much of its sovereignty. Trump’s two main envoys to Moscow, his friend Steve Witkoff and his son-in-law Jared Kushner, were amateurs in international diplomacy and proved unable to start a proper negotiating process. In Moscow, attitudes toward both men soured. Plan A failed.\nFor a time, Putin could still hope that Plan B, in which Trump would simpl", "translation_ja": "", "vocab": [{"word": "complacency", "definition": "自己満足や過度な自信のこと。警戒心を失い、危険を過小評価する状態を指す。"}, {"word": "deteriorate", "definition": "悪化する、衰える、という意味。状況や状態が段々と悪くなることを表す。"}, {"word": "coup", "definition": "外交上の大成功や巧妙な成果のこと。元々はクーデターを意味するが、ここでは外交的勝利を指す。"}, {"word": "trajectory", "definition": "進行方向や進展の過程を指す。グラフ上の軌跡や、事象の展開経路を表す。"}, {"word": "insinuate", "definition": "婉曲に示唆する、ほのめかすという意味。直接的ではなく、間接的に何かを暗に伝える。"}, {"word": "creeping", "definition": "じわじわと進む、段々と侵食するという意味。緩やかだが継続的な進展を表す。"}]}, {"title_ja": "イランにおける曖昧性の悪循環：米国の矛盾したメッセージが紛争を激化させる方法", "title_en": "The Ambiguity Spiral in Iran: How Mixed U.S. Messaging Escalates Conflict", "summary_ja": "著者は、トランプ政権のイランにおける戦争目的に関する曖昧で矛盾したメッセージが逆効果をもたらし、テヘランが米国の意図を実存的脅威と解釈し、大規模にエスカレートさせたと主張している。この曖昧性は緊張緩和を支援するのではなく、6月の了解覚書の失敗に見られるように平和努力を損なっており、不明確な文言によって両側がホルムズ海峡条項を異なる方法で解釈した。この論説は、持続可能な休戦を達成するには、米国の目標についてより明確で一貫性のあるコミュニケーションが不可欠であると主張している。", "summary_en": "The author argues that the Trump administration's vague and inconsistent messaging about its war objectives in Iran has backfired, causing Tehran to interpret U.S. intentions as existential threats and escalate dramatically. Rather than helping de-escalate, this ambiguity has undermined peace efforts, as seen in the failed June memorandum of understanding, where unclear wording led both sides to interpret the Strait of Hormuz clause differently. The piece contends that clearer, more consistent communication about U.S. goals is essential for achieving a durable truce.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/united-states/ambiguity-spiral-iran", "state_media": false, "category": "オピニオン", "full_text": "Ambiguity—vague language, mixed messaging, frequent policy shifts—has been a hallmark of the United States’ approach to the war in Iran. From almost the moment the conflict began, U.S. President Donald Trump has vacillated over its purpose, what risks he might be willing to take, and what the United States would consider victory. He has threatened to destroy Iranian civilization, then promptly signed a cease-fire agreement. He has floated the possibility of taking Kharg Island, the hub of Iran’s oil industry, only to quickly walk it back. And he has discussed imposing a 20 percent toll on shipping through the Strait of Hormuz, only to declare that the waterway must be free to everyone.\nIn some cases, ambiguity can help countries settle wars. Leaders, for example, can leverage uncertainty to de-escalate a conflict or reach a stable peace agreement by letting both sides claim victory. If governments avoid drawing clear redlines, they can avoid pressure to escalate in response to attacks, creating space to cool tensions.\nBut Washington’s mixed messaging about the war in Iran has done more harm than good. Trump’s spectrum of threats, for example, prompted Tehran to see the war in existential terms and maximally fight back. The lack of clarity over the status of the Strait of Hormuz made the June memorandum of understanding negotiated by the two countries impossibly frail. To reach a more durable truce, the Trump administration needs to be clearer about its goals and more consistent in pursuing them. Otherwise, Iran and the United States will continue to get their wires crossed—and the next cease-fire could again collapse.\nCAN’T GET A READ\nWhen coercing a rival, a government must decide how to convey intent, capabilities, and redlines. One option is to be clear: explicitly and consistently defining a goal, identifying consequences for noncompliance, and articulating what the other side can count on if demands are met. Such clarity can let a rival state know what is at stake and encourage it to limit its response. But too much of it can do the opposite. If the rival knows just how far it can go toward a threshold without triggering retaliation, it will often escalate all the way to that point.\nThe other option is to be vague. Yet this can also have mixed consequences. If a state does not know how its adversary will respond to a certain action, it might hold back for fear of triggering painful counterattacks. But too many mixed signals can throw off an opponent’s risk calculus, giving rise to misunderstandings that can produce or worsen a crisis.\nThis is what happened with the United States’ Operation Epic Fury—its military operation against Iran. Trump has variously said, at different times, that the goal of the campaign is to degrade Iran’s missile capabilities and navy, prevent the country from obtaining nuclear weapons, and end Iran’s support of its regional proxy network. On the first day of the conflict, he even suggested he wanted to dismantle the Islamic Republic. (On February 28, Trump encouraged Iranians to “take over” their government, and Israeli Prime Minister Benjamin Netanyahu, who has carried out military strikes alongside Trump, echoed that sentiment.) Other Trump administration officials, meanwhile, avoided explicit mention of a political transformation for Iran, focusing on narrower military objectives.\nFor Iran, this mixed messaging was the opposite of reassuring. Uncertain of U.S. intentions, its officials assumed the worst—particularly given that airstrikes killed Supreme Leader Ali Khamenei in the conflict’s opening hours. The country thus escalated massively, unleashing thousands of missiles and drones at infrastructure and U.S. military bases across the Middle East. If the United States had been clear from the outset that it was not gunning for regime change, Iran might have responded with more restraint and the conflict might have stayed more limited, as it had after U.S.-Israeli airstrikes on Iran in June 2025.\nAmbiguity has not only ramped up the conflict. It has also undermined efforts at ending it. The June memorandum of understanding was meant to pause fighting, open the Strait of Hormuz, and start a 60-day period for further negotiations. But it failed, in part because of its unclear wording. The memorandum obliged Iran to “make arrangements using its best efforts for the safe passage of commercial vessels.” The Americans interpreted this clause to mean that Iran would let all traffic through, as it did before the war. The Iranians, on the other hand, took it as a confirmation that they had authority over the waterway and only needed to open parts of it. (Iran wants shipping to pass through the part of the strait closest to its territory). At the end of June, Iran began shooting at commercial vessels for taking what it deemed to be unauthorized routes through the channel. As these attacks unfolded, Iran’s deputy foreign minister took to social media to announce that safe passage was", "translation_ja": "", "vocab": [{"word": "vacillate", "definition": "揺らぐ、ぐらつく、決断や意見が定まらず何度も変わることを意味する。政策や立場が一貫性を欠く状況で使用される。"}, {"word": "redlines", "definition": "越えてはならない限界線、譲歩できない最低限の条件を指す。国際交渉や紛争の文脈で重要な概念。"}, {"word": "coerce", "definition": "力や圧力を使って強制する、威力をもって行動を促すことを意味する。外交や交渉の場で用いられる。"}, {"word": "risk calculus", "definition": "リスク計算、利益と損失を天秤にかけて行動を判断するプロセスを指す。意思決定分析において重要な用語。"}, {"word": "durable", "definition": "耐久性のある、長く続く、持続可能なという意味。協定や平和合意などが安定して継続することを表す。"}, {"word": "escalate", "definition": "段階的に増加する、深刻化する、紛争や問題が激化することを指す。外交や軍事用語として頻繁に使用される。"}, {"word": "ambiguity", "definition": "曖昧性、不明確さ、解釈が複数可能な状態を意味する。外交交渉やメッセージング戦略の文脈で重要。"}]}, {"title_ja": "中国の少数民族への文化同化強制への転換", "title_en": "China's Shift to Forced Cultural Assimilation of Minorities", "summary_ja": "7月1日に制定された「民族団結と進歩促進法」は、中国が領土自治から少数民族への強制的な文化同化への転換を正式に表明したもので、習近平のビジョンに基づいている。本法制は10年以上にわたるチベット語やウイグル語教育をマンダリン中国語に置き換え、宗教統制を強化する政策を統合し、これらを制度的構造に深く組み込み、撤回が困難にしている。", "summary_en": "China's new Law on Promoting Ethnic Unity and Progress, enacted July 1, marks a formal pivot from territorial autonomy to forced cultural assimilation of minority groups under Xi Jinping's vision of a unified Chinese identity. The legislation consolidates over a decade of policies replacing minority-language education with Mandarin and increasing state control over religion, embedding these practices deeply into institutional structures that will be difficult to reverse.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/china/next-phase-chinas-minority-crackdown", "state_media": false, "category": "オピニオン", "full_text": "When the People’s Republic of China was founded, in 1949, it was explicitly a multinational state. Although Han Chinese make up more than 90 percent of the country’s population, China’s constitution and subsequent laws grant minority nationalities autonomy in specific regions and promise them collective agency as “masters of their own homes.” For decades, the party-state’s official bargain—honored unevenly and often violated—was that national unity would be best secured by recognizing difference and granting minorities limited territorial, linguistic, and political autonomy within China, rather than by forcing them to be absorbed into Han culture.\nAs of July 1, however, national integration through forced cultural assimilation is the law of the land. The constitution still defines the country as a multinational state, but the passage of the Law on Promoting Ethnic Unity and Progress marks a decisive turn away from the promise of territorial autonomy. It codifies the coercive project to create a Chinese national community in which minority peoples can exist only insofar as they serve Chinese leader Xi Jinping’s vision of China—a vision rooted in the belief that commonality is better than diversity and that national cohesion requires a single shared Chinese cultural and linguistic identity.\nThe new ethnic unity law did not introduce the policy of assimilation; for more than a decade, Xi has been replacing minority-language education with Mandarin Chinese instruction, increasing the party’s control over religion, and recasting minority histories as strands of one continuous Chinese civilization. But this approach is now consolidated in national legislation enacted by the full National People’s Congress, signaling that Beijing regards it as a matter of fundamental state importance and enshrining it with the highest legal authority. And the law distributes responsibility for implementing these policies across all levels of the state and throughout society.\nBeijing’s campaign of cultural dispossession will now become more deeply embedded in bureaucratic practices and institutional structures, which are difficult to dislodge or change. Even if a more liberal leader were to one day succeed Xi, reviving autonomy would require a complete bureaucratic, political, and cultural overhaul. For the foreseeable future, therefore, Beijing has closed the door on peaceful coexistence, locking itself instead into a more hostile and zero-sum relationship with the minority groups whose cultures and languages it once accommodated.\nASSIMILATION NATION\nChina’s official policy, inspired by the Soviet model of national-territorial autonomy, recognizes 56 formally equal nationalities within the country. Its constitution promises to protect the rights and interests of all minority nationalities and grants them territorial autonomy in areas where they live in concentrated communities. A 1984 law formalized the protections and accommodations granted to minority groups as part of this territorial autonomy. In areas as varied as Xinjiang in the far northwest and Yunnan in the country’s southwest, minority groups were entitled to use their own languages as the medium of instruction in schools and maintain their own traditions, cultures, and religious practices. Even when these protections were violated, the law maintained the principle of collective rights for China’s non-Han nationalities.\nBut Xi began systematically dismantling the foundations of this system soon after he became general secretary of the Chinese Communist Party in 2012. His move to dismantle territorial autonomy is often explained as a response to episodes of unrest that broke out in minority regions shortly before he took power. In 2008, protests that began in Lhasa, the capital of Tibet, escalated into a full-blown uprising across the plateau. And in 2009, a Uyghur protest in Urumqi, in Xinjiang, descended into rioting and retaliatory violence that killed nearly 200 people, according to official figures.\nThe roots of Xi’s campaign, however, go back much further. The collapse of the Soviet Union in the 1990s prompted some leading Chinese scholars and officials to reconsider granting territorial autonomy to minority nationalities. Starting around the first decade of the twenty-first century, advocates of a so-called second-generation ethnic policy argued that China’s Soviet-inspired approach had hardened ethnic boundaries and created the conditions for separatism. They warned that minority groups’ distinct identities, institutions, and languages were impeding China’s attempt to construct a cohesive nation. Although the situation in Beijing is fundamentally different than it was in Moscow—China’s autonomous regions are much more tightly controlled by the central government and possess neither sovereignty nor a legal route to independence, as federal republics in the Soviet Union did—these powerful voices warned that even limited autonomy was dangerous. China’s existing polic", "translation_ja": "", "vocab": [{"word": "codifies", "definition": "法律や規則として正式に定める、条文化する。政策や慣行を公式な法律文書に含める行為を指す。"}, {"word": "assimilation", "definition": "少数民族が主流の文化や言語を同化・吸収して一体化すること。異なる文化的背景を持つグループが支配的な文化に統合されるプロセス。"}, {"word": "dispossession", "definition": "財産や権利、文化的資産を奪い取ること。ここでは少数民族の文化や言語を剥奪する行為を意味する。"}, {"word": "territorial autonomy", "definition": "特定の地域が独自の行政権や統治権を持つ自治制度。少数民族が集中する地域での自治権を指す。"}, {"word": "dismantling", "definition": "システムや制度を段階的に解体・廃止すること。確立された構造や組織を段々と取り除く過程。"}, {"word": "hardened", "definition": "より厳しく、より固くなることを意味し、ここでは民族的違いがより深刻化・固定化されたことを示す。"}]}];

let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-08-01 21:44 JST";
  renderTabs();renderList();
})();
</script>
