: "https://www.bbc.co.uk/news/articles/cz7d17r455go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "EU calls emergency meeting to discuss Ceuta migrant crossings\n- Published\nThe European Union will hold emergency talks on Tuesday to discuss the migration crisis in Ceuta after tense exchanges between Spain and other member states.\nTwenty-two member states issued a joint letter calling for co-ordinated action and the strengthening of the EU's external borders, after some 60,000 migrants entered the Spanish enclave from Morocco.\nSpain condemned \"selfish, polarising and unlawful\" reaction to the crisis after Italy suspended the EU's border-free Schengen arrangement with Spain - a move backed by Finland and Denmark.\nOfficials say almost all those who reached Ceuta on 30 July have returned, while deaths from the surge in crossings had risen to at least 67.\nThe EU members' letter addresses concerns around \"hybrid threats to create the perception that illegal entry into the European Union is possible,\" adding that the perception \"would encourage further attempts, undermine confidence in our common migration policy and have repercussions for all Member States\".\nLeaders of the Netherlands, Finland and Belgium are among 22 signatures on the letter, addressed to EU President Antonio Costa, president of the European Commission Ursula von der Leyen and Taoiseach Michael Martin, as Ireland currently holds the presidency of the Council of the European Union.\nIn a separate letter to von der Leyen, Spanish Prime Minister Pedro Sánchez said he had \"serious concerns\" about some European governments.\nHe said the Spanish government had fully restored control over the border and prevented any \"unauthorised onward movement towards continental Europe\" in less than 48 hours.\nWhile most had shown \"support and solidarity\", Sánchez said other European governments had chosen to attack Spain, \"driven by prejudice, fake news, ignorance, or political interest\", and pointed out that Ceuta was not part of the Schengen area.\nOn Friday, Sánchez accused migrant traffickers of exploiting a decision recently made by the country's supreme court which constrained the government's right to immediately deport people who had arrived by sea.\nThe country's Interior Minister, Fernando Grande-Marlaska, said in a news conference on Saturday that the situation had almost returned to normal and the country was working on inflatable barrier to prevent illegal migration via the water.\n\"Almost all of [the migrants] have already left Ceuta,\" he said adding that businesses there had now reopened.\n- Influx of migrants to Ceuta gives Spain diplomatic headache \n  - Published1 day ago\nSome criticism of the situation has involved concerns over the Schengen Area - an agreement which eliminates border checks and now encompasses more than 450 million people and 29 countries in Europe.\nIn addition to Italian Prime Minister Giorgia Meloni suspending Italy's Schengen agreement with Spain for a month, Finland, France and Portugal have all said they were either looking at, or considering, border checks.\nDanish Prime Minister Mette Frederiksen urged the EU to \"consider all options, including a suspension of Schengen co-operation\".\nVon der Leyen said the images from Ceuta were \"unacceptable\". Writing on social media, she said: \"We cannot allow anyone to come to our Union without abiding by our rules.\"\nGerman Chancellor Friedrich Merz demanded that Morocco \"take back illegal migrants immediately\", while on Saturday, UK Prime Minister Andy Burnham said he had spoken to Sánchez and the UK was \"providing what help we can\".\nMorocco witnessed several Gen Z anti-government protests last year, with young people demanding better opportunities and improvements to public services.\nTogether with Melilla, Ceuta forms the European Union's only land borders with Africa. Migrants can enter the enclave by swimming several kilometres.\nWhile the surge of migrants this year is extraordinary, Ceuta has long been a focal point for migrants attempting to reach Europe. During the summer months, there is often a big push to reach Ceuta, typically organised over social media.\nIn 2021, about 8,000 people entered Ceuta over a matter of days, exacerbating Spain's diplomatic tensions with Morocco.\nSpain has a relatively friendly approach to immigration. In April, the government approved plans to give legal status to 500,000 undocumented migrants, allowing them to be formally integrated into the workforce.\n  - Published18 May 2023\n  - Published5 June 2021", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "周囲を他国や地域に囲まれた領土や地域を指します。セウタはスペイン領ですがモロッコに囲まれた飛び地です。"}, {"word": "hybrid threats", "definition": "複数の手段（軍事的、政治的、経済的など）を組み合わせた脅威を意味します。ここでは組織的な移民渡航の演出を指しています。"}, {"word": "polarising", "definition": "人々や国を対立させ、意見を分裂させることを意味します。スペイン政府の対応が各国の見解を分かつという文脈で使用されています。"}, {"word": "exacerbate", "definition": "問題や対立を悪化させることを指します。2021年の移民増加がスペインとモロッコの外交関係を悪化させたという意味で使われています。"}, {"word": "focal point", "definition": "注目や関心が集中する中心地点を意味します。セウタはヨーロッパを目指す移民の主要な入口となっています。"}, {"word": "surge", "definition": "急速な増加や高まりを指します。ここでは短期間での移民数の急増を意味しています。"}]}, {"title_ja": "インファンティーノ会長への圧力が高まる、欧州連盟が指導力の見直しを要求", "title_en": "Pressure Mounts on Infantino as European Bodies Demand Leadership Review", "summary_ja": "ウェフアとコンカカフは、民間投資家への権益売却計画を廃止したFIFAのジャンニ・インファンティーノ会長を公開批判した。両統治機関は彼の指導力に疑問を呈し、3月の再選を控えて説明責任を要求している。カタールサッカー協会のみが物議を醸した投資計画の廃止を歓迎しながらもインファンティーノを公開支持している。", "summary_en": "Uefa and Concacaf have publicly criticized Fifa president Gianni Infantino following his decision to scrap plans to sell stakes in competitions to private investors. Both governing bodies have questioned his leadership and called for accountability, with Concacaf demanding a full review ahead of his re-election bid in March. Only Qatar's football association has publicly supported Infantino despite welcoming the withdrawal of the controversial investment proposal.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/sport/football/articles/c04kr2nv3v3o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Call for 'full review' as pressure grows on Infantino\n- Published\nGianni Infantino's leadership of Fifa has been publicly questioned by football's governing bodies in Europe, North and Central America and the Caribbean.\nUefa and Concacaf both released statements on Saturday criticising the leadership at the world governing body after Infantino said Fifa would no longer proceed with the proposal to sell stakes in their competitions to private investors.\nUefa, which governs European football, welcomed the decision to withdraw the plan, describing it as a \"victory for the whole game\".\nThe body accused of Infantino of failing to deliver on promises, quoting a speech he gave when campaigning to become Fifa president in 2016.\nConcacaf, which oversees football in North, Central America and the Caribbean, followed Uefa in criticising the plans, saying \"unity had prevailed\" and that the proposals were a \"symptom of leadership that has stopped putting football first\".\n\"This recent unilateral and egregious act of poor governance and leadership follows a pattern of missteps and similar behaviour. A full review of this leadership must now take place,\" a Concacaf statement read.\nUnlike Uefa, Concacaf did not mention Infantino by name.\nInfantino under pressure ahead of re-election bid\nThe fallout from the plans means Infantino is now under immense pressure as he seeks re-election for a fourth term as president at the Fifa Congress in March.\nUefa were the first major governing body to react to Infantino's decision to drop the investment plans, saying the Swiss had failed to deliver on his promises.\n\"The current Fifa leadership has not only lost Uefa's confidence but also that of many other members of the football family,\" Uefa's statement read.\n\"When Gianni Infantino asked for the trust and the votes of Fifa's member associations to elect him as their president in 2016, he said, 'Of course we have to be transparent'.\n\"He told the assembled stakeholders, 'The money of Fifa is your money. It's not the money of the Fifa president. You are the national associations and the money of Fifa has to serve for the development of football and not for anything else'.\n\"On both these promises, he has failed to deliver. The shabby, back room, opaque deal he hatched and tried to force through was anything but transparent.\"\nLater on Saturday, Concacaf joined Uefa in criticising Fifa leadership and said \"accountability cannot be optional\".\n\"When people entrusted with protecting the game conclude they can no longer do so from within, the football family is entitled to ask how such a proposal was allowed to proceed and who bears responsibility for it,\" a Concacaf statement read.\nUK Prime Minister Andy Burnham - the first leader of a major country to call on Infantino to resign - said Fifa made \"the right decision\" to back down.\nQatar's football association became the first body to publicly back Infantino, despite welcoming his decision to scrap the investment plans.\n\"While the proposal had merit, we applaud the wisdom behind prioritising unity among member associations,\" said Sheikh Hamad bin Khalifa bin Ahmed Al Thani, president of the Qatar FA.\n\"The Qatar FA fully supports president Infantino's efforts to continue growing and strengthening the game globally.\"\nThe decision to host the 2022 World Cup in Qatar was controversial given the country's human rights record and treatment of LGBTQ+ people.\nOn the eve of the tournament four years, Infantino defended Qatar and said European countries should apologise for acts committed in their own histories, rather than focusing on migrant workers' issues in Qatar.\n- Four reasons why Fifa's World Cup plan never stacked up \n  - Published8 hours ago\n- Courting controversy and befriending Trump - the story of Fifa boss Infantino \n  - Published11 hours ago\n- Infantino on the brink? Who might replace him if he goes? \n  - Published11 hours ago\nWhat did Uefa's statement say?\nUefa had been highly critical of the proposals since they were first reported in the media on Tuesday.\nIn a powerful, lengthy statement released several hours after Fifa announced it had scrapped the plans, Uefa said:\n- it \"cannot keep going on\" with \"secret schemes of fast-track timescales cooked up by faceless individuals and of dubious benefit to the game\".\n- those responsible for the plan should be identified and held to account.\n- it would devise a plan \"with its associations and in close co-operation with other confederations\" to make sure this \"cannot occur again\".\n- it would work with partners to \"propose a new way of distributing resources through the existing Fifa Forward programme\".\nIt also accused Infantino of \"failing to use associations' money for the benefit of the game\".\n\"We must start to use some of that money that is sat idle in Fifa's bank account to deliver the kick-start that the grassroots and the wider game need,\" the statement added.\n\"But we don't need to sell off the family silver to pay for it.\n\"This is a victory ", "translation_ja": "", "vocab": [{"word": "unilateral", "definition": "一方的な、片側のみからの行動。ここではインファンティーノが他の関係者との協議なく決定を下したことを意味する。"}, {"word": "egregious", "definition": "極めて悪質な、ひどい。通常の悪さをはるかに超えた不当な行為に対して用いられる。"}, {"word": "opaque", "definition": "不透明な、不明瞭な。本来は光を通さない意味だが、ここでは情報公開の不足や隠蔽された決定プロセスを指す。"}, {"word": "accountability", "definition": "説明責任、責任を負うこと。権力を持つ者が行動と決定について説明し、その責任を問われることを意味する。"}, {"word": "confederations", "definition": "連合、同盟。ここではサッカーの各大陸連盟（欧州、北米など）を指す複数の独立した組織の集合体。"}, {"word": "dubious", "definition": "疑わしい、怪しい。信頼性や妥当性が不確かで、疑問の余地がある状態を表す。"}]}, {"title_ja": "ペルーで観光飛行機が墜落、乗員乗客13人全員が死亡", "title_en": "Tourist plane crashes in Peru, killing all 13 on board", "summary_ja": "ペルー南部のナスカ地上絵近くで、乗客11人と操縦士2人を乗せた小型航空機が土曜日に墜落し、乗員乗客全員が亡くなった。同機はピスコ空港を出発し、現地時間午後1時頃にプエブロ・ビエホ地域で墜落した。墜落の原因は調査中である。", "summary_en": "A small aircraft carrying 11 passengers and 2 pilots crashed near the Nazca Lines archaeological site in Peru on Saturday, resulting in no survivors. The plane departed from Pisco airport and went down in the Pueblo Viejo region around 13:00 local time. The cause of the crash remains under investigation.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c70g132erlko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Tourist plane crashes in Peru, killing 13\n- Published\nA small plane carrying tourists has crashed in Peru, killing all 13 people on board, according to local news reports and Peruvian officials.\nThe aircraft had been flying over Nazca Lines archaeological site when it went down on Saturday. Eleven passengers and two pilots were on board.\nThe cause of the crash and the identity of the passengers is not yet clear.\nNazca Lines is a popular tourist attraction and UNESCO World Heritage site in southern Peru that features ancient drawings in desert sand.\n\"Given the severity of the accident, there are no survivors. We have recovered four bodies so far,\" Police Major Jorge Andrade said, according to AFP.\nThe crash happened around 13:00 local time (19:00 BST) in the Pueblo Viejo region after the plane departed from an airport in Pisco, Peru.\nIn a statement in Spanish posted online by the Municipalidad Provincial de Nasca, officials expressed \"deep sorrow\" for the accident and extended \"heartfelt condolences to the families of the deceased\".\nThe statement said the plane belonged to local Peruvian airline Aerodiana.\nThe BBC has contacted the airline for comment.\nThis isn't the first plane to crash over the famed site in the last few decades.\nIn 2022, another small tourist plane crashed during a flight over the Nazca Lines site, killing seven on board.\nAnd in 2010, a tourist plane went down over the site, killing six people on board.", "translation_ja": "", "vocab": [{"word": "archaeological", "definition": "考古学的な、遺跡に関連する。歴史的な遺物や遺跡を科学的に研究することに関する。"}, {"word": "severity", "definition": "事態や状況の深刻さ、重大さの程度。問題や損害の激しさを表す名詞。"}, {"word": "survivors", "definition": "災害や事故から生き残った人々。危機的な状況を切り抜けた者。"}, {"word": "condolences", "definition": "故人の死に対して遺族に示す哀悼の意や同情。お悔やみの言葉。"}, {"word": "famed", "definition": "有名な、著名な。広く知られている。通常は肯定的な文脈で使用される。"}, {"word": "deceased", "definition": "死亡した者、故人。法律や公式文書でよく使用される形式的な表現。"}]}, {"title_ja": "グレーター・マンチェスターの新市長ベブ・クレイグが権限委譲の活用を誓約", "title_en": "Greater Manchester's New Mayor Bev Craig Pledges to Use Devolved Powers", "summary_ja": "ベブ・クレイグがグレーター・マンチェスターの新市長に選出され、現在首相のアンディ・バーナムの後任となった。クレイグは309,525票で勝利し、ウェストミンスターから新たに委譲された権限を使って、住宅、交通、地域ビジネスを改善することを誓った。彼女はバスと路面電車の運賃凍結、若者への無料乗車の拡大、そして15年間で50,000戸の新築住宅建設を約束している。", "summary_en": "Bev Craig has been elected as Greater Manchester's new mayor, succeeding Andy Burnham who is now Prime Minister. Craig won with 309,525 votes and pledged to use newly devolved powers from Westminster to improve housing, transport, and local businesses. She promised to freeze bus and Metrolink fares, extend free travel to younger people, and build 50,000 new homes over 15 years.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cddj3j50rmpo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Mayor says Burnham's new powers will change lives\n- Published\nGreater Manchester's new Mayor Bev Craig has said Prime Minister Andy Burnham's move to give the regions more power could \"change our lives\".\nThe Labour candidate claimed victory in Thursday's by-election after securing 309,525 votes over Reform's Sian Astley, who won 157,178.\nThe 41-year-old will succeed Burnham as mayor, after he stood down to run in the Makerfield by-election in June. The pair appeared together at a Labour rally in Manchester after Craig's election win.\nCraig said: \"For a prime minister two weeks in, to start giving powers out of Whitehall and putting it in the places that can make a difference - that can change our lives.\"\nShe added: \"I will rise to his challenge about taking the power and control that he is offering mayors like me to make our regions better.\n\"Because that is what it is all about.\"\n- Who is Greater Manchester's new Mayor Bev Craig? \n  - Published22 hours ago\nBurnham has said he would give all mayors of city regions in England a share of income tax revenue for the first time, as part of his drive to transfer power from Westminster to local leaders.\nOpposition parties said the plans lacked detail and could lead to areas with weaker economies losing out on funding.\nBur Craig said she was \"excited\" about the challenge and would not \"stop at the levels of growth that we have achieved\".\nShe said she wanted to make \"every kid\" in Greater Manchester \"feel they can succeed\".\nThe prime minister said Manchesterism was about \"devolution\" and \"taking control of things that affect people's daily lives, such as housing, building more homes that people can truly afford and the buses\".\n\"We want everyone in Greater Manchester facing the same way, pulling in the same way,\" he said.\n\"It is a different way of doing things.\"\nBurnham told Craig \"go further and do more\" as he dubbed her the \"queen of the north\".\nHe added: \"You are the right person to lead this great city region forward into its best decade ever, because that is what the next decade is going to be.\"\nMore than two million people across Greater Manchester's 10 boroughs were eligible to vote in the mayoral contest but turnout was just under 25%.\nReform's Astley said after her defeat: \"I'm really proud of our campaign, of getting out there, working with all the branches and councillors to try and get people motivated to get out and vote.\"\nShe added \"we'll be watching to see if all those pledges made during the campaign are delivered\".\nCraig grew up on a council estate in Belfast, but moved to Manchester in 2003 at the age of 18 to study politics and modern history at the University of Manchester.\nWhat has she promised?\nAfter she was announced as Labour's candidate to succeed Westminster-bound Burnham, Craig said she was ready to \"deliver the next chapter for the region\".\nHer headline campaign pledges have been to freeze Metrolink and bus fares on the Bee Network and extend free bus travel to 11 to 18-year-olds.\nCurrently, only 16 to 18-year-olds benefit from the scheme.\nShe said she was committed to delivering 50,000 new homes in a mix of council properties and genuinely affordable housing over the next 15 years.\nCraig said she would also launch a new £20m high street scheme, promising it would support small businesses, revitalise empty units and invest in town-centre regeneration.\nGet in touch\nTell us which stories we should cover in Greater Manchester\nListen to the best of BBC Radio Manchester on Sounds and follow BBC Manchester on Facebook, external, X, external, and Instagram, external. You can also send story ideas via Whatsapp to 0808 100 2230.\nRelated topics\n  - Published1 day ago\n  - Published24 July", "translation_ja": "", "vocab": [{"word": "devolution", "definition": "中央政府から地方自治体への権限や権力の移譲のこと。特に英国の政治において、議会から地方議会への統治権の委譲を指す。"}, {"word": "pledge", "definition": "正式な約束や誓約をすること。政治的な文脈では、政治家が実現を約束する政策や計画を指す。"}, {"word": "incumbent", "definition": "現在その職にある人物を指す。例えば現職の市長や知事などを意味する。"}, {"word": "revenue", "definition": "政府や組織が税金や手数料などから得る収入。特に財政的な収益全般を指す。"}, {"word": "constituency", "definition": "選挙区域のこと。または、その地域の有権者全体を指す。"}, {"word": "regeneration", "definition": "経済的に衰退した地域を復興させることや再開発のプロセス。都市開発や地域活性化を意味する。"}]}, {"title_ja": "著名な登山家ニルマル・プルジャ、パキスタンの雪崩で死亡", "title_en": "Renowned mountaineer Nirmal Purja killed in Pakistan avalanche", "summary_ja": "英国籍ネパール人登山家ニルマル・プルジャ氏（43歳）がパキスタンのブロードピークの雪崩で9人とともに死亡しました。プルジャ氏は2019年にわずか6ヶ月以上で世界最高峰14座すべてを登頂し、その功績はNetflixドキュメンタリーで記録されました。英国軍で16年間服務し、登山業績でMBEを受勲していました。", "summary_en": "British-Nepali mountaineer Nirmal Purja, 43, was killed in an avalanche on Broad Peak in Pakistan alongside nine others. Purja gained international fame in 2019 for climbing all 14 of the world's highest peaks in just over six months, a feat documented in a Netflix film. He served 16 years in the British military and was awarded an MBE for his mountaineering achievements.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/clyljq79kdko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Mountaineer Nirmal Purja killed in Pakistan avalanche, his company says\n- Published\nRenowned British-Nepali mountaineer Nirmal Purja is among 10 people killed in an avalanche on Broad Peak in Pakistan, his company has said.\nElite Expeditions said it confirmed with \"profound sadness and immense heartbreak\" that Purja, 43, had died in Thursday's avalanche. His brother Kamal later wrote: \"We will miss you every single day\".\nPurja, who was born in Nepal and later served in the British army, was known for scaling the world's 14 highest peaks in just over six months in 2019.\nPakistani officials earlier said the bodies of three climbers from his expedition - American Mallory Geis, Nadhira Ahmed Abdullah Al Harthy from Oman and Pur Bahadur Gurung from Nepal - had been recovered.\nPurja's death was also confirmed by Nepal's Prime Minister Balendra Shah, who said that \"the tragic death of six Nepalese and four other foreign climbers, including world record holder Nirmal Purja, in the Karakoram mountain range of Pakistan, has shocked us\".\n\"The history of their courage, dedication, and contributions will always remain inspiring,\" the prime minister added.\nIn a statement, Purja's older brother Kamal wrote: \"It is with the heaviest heart that I share the devastating news that my beloved younger brother, Nirmal 'Nimsdai' Purja, and the other climbers are no longer with us.\n\"Although our hearts are broken, we are incredibly proud of you. Your legacy will live forever,\" he added.\nUK Defence Secretary Wes Streeting said in a post on X: \"Incredibly sad to learn of the passing of Nirmal (Nims) Purja and those he was climbing with.\n\"He was an inspirational man who served in our Armed Forces for many years - and whose incredible mountaineering adventures are known the world over.\"\nNaila Kiani, a spokesperson for the Alpine Club of Pakistan which is involved in the rescue efforts, told BBC's Newshour programme that Purja had led many expeditions that she was on.\nPraising his leadership skills, she described him as a \"very experienced climber and fearless\".\nKiani said the Alpine Club would only announce his death once the body has been recovered - but she added that \"we are fearing them all dead\".\nShe also said rescuers had seen some bodies - but were yet to reach them.\nTeams in Pakistan have been searching for the climbers on the world's 12th-highest summit after an avalanche on the 8,047m (26,400ft) peak in the Karakoram range.\nThe multinational climbing group was being led by Purja. Also known as Nims, he rose to prominence in 2019 when he climbed all 14 of the world's mountains with peaks above 8,000m in 189 days - smashing the previous record by more than seven years.\nHe became widely known following a Netflix documentary chronicling his journey, 14 Peaks: Nothing Is Impossible, released two years later.\nAt the time, he said: \"It has been a gruelling but humbling six months, and I hope to have proven that anything is possible with some determination, self-belief and positivity.\"\nPurja served in the British military for 16 years, 10 of which were spent in the special forces, and he was awarded an MBE by the late Queen in 2018 for his achievement in extreme high-altitude mountaineering.\nPurja, who lived with his wife and three-year-old daughter in Hampshire in southern England, said he was also the first Gurkha to climb Everest while serving in the British military.\nIn his last post on X, published on Monday, he said he had not intended to climb Broad Peak.\n\"Initially, the plan was to climb just G2,\" Purja wrote, referring to Gasherbrum II, another peak in the Karakoram mountain range.\nBut right before he set off for Pakistan, he realised that if he also managed to climb Broad Peak while he was there, he would have only one more mountain to conquer before becoming the \"first person in history to climb all 14 eight-thousanders twice. Without oxygen.\"\nAn eight-thousander is a mountain that rises more than 8,000m above sea level.\n\"This wasn't planned,\" Purja wrote. \"But opportunities don't scream: they whisper to those already working in silence.\"\n\"Broad Peak, I ask for nothing but safe passage up and back down. I take zero mountains for granted,\" he wrote.\nBroad Peak is regarded as one of the more challenging mountains for climbers. The first successful ascent was in 1957, when an Austrian expedition reached the summit.\nSince then, many more have climbed the mountain, but dozens have lost their lives.\nOne of Broad Peak's deadliest years was 2013, when at least six fatalities were recorded.", "translation_ja": "", "vocab": [{"word": "avalanche", "definition": "急激に山から流れ落ちる大量の雪。山岳地帯で登山者にとって危険な自然現象です。"}, {"word": "multinational", "definition": "複数の国の人々から構成される、または複数の国にまたがっている状態を表します。この場合、異なる国籍の登山者のグループを指しています。"}, {"word": "prominence", "definition": "著名性や注目度の高さを意味します。プルジャ氏が登山業界で知名度を得たことを表現しています。"}, {"word": "gruelling", "definition": "非常に大変で疲労困憊させる、という意味の形容詞です。困難で過酷な経験を表します。"}, {"word": "eight-thousander", "definition": "標高8000メートル以上の山を指す登山用語です。世界で最も高く、登頂が極めて困難な山々を指します。"}, {"word": "fatalities", "definition": "死亡事故や死亡者を指す名詞です。特に災害や事故による死傷者数を表します。"}]}, {"title_ja": "ウィリアム皇太子とケイト妃がコモンウェルスゲームズにお子さんたちを連れて来場", "title_en": "William and Kate bring children to Commonwealth Games in Glasgow", "summary_ja": "ウェールズ皇太子夫妻はグラスゴーで開催されているコモンウェルスゲームズの第二日目最終日に、3人のお子さんたちを伴って来場し、ネットボールの準決勝観戦とサイクリング競技場の視察を行いました。夫妻はOVOハイドロ会場で選手、スタッフ、ボランティアと面会しました。ゲームズは日曜日の閉会式で終了し、シンプル・マインズなどのスコットランドアーティストが出演予定です。", "summary_en": "The Prince and Princess of Wales attended the second-to-last day of the Commonwealth Games in Glasgow with their three children, watching netball semi-finals and visiting the cycling velodrome. The family met with athletes, staff and volunteers during their visit to the OVO Hydro venue. The Games conclude Sunday with a closing ceremony featuring performances by Simple Minds and other Scottish artists.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cz7d1xpn5e8o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "William and Kate bring children to second last day of Commonwealth Games\n- Published\nThe Prince and Princess of Wales have brought their three children to watch some of the final sporting events at the Commonwealth Games in Glasgow.\nCheering crowds at the city's OVO Hydro were treated to exhilarating performances in the netball semi-finals where the family watched New Zealand's 61-54 win over England.\nKnown as the Duke and Duchess of Rothesay while in Scotland, the couple also spent time meeting athletes, staff and volunteers during a slightly blustery visit to the venue on the River Clyde.\nThey then made their way to the Sir Chris Hoy Velodrome - where they chatted to British cyclist Laura Kenny and sat one row behind Olympic cycling champion, Sir Chris.\nAfter leaving the netball, the family met gold medal-winning para powerlifter Mark Swan and gymnast Reuben Ward on the concourse.\nPrincess Catherine and Charlotte also took the time to take photos with the Team Scotland netball players - who lost to Uganda on Thursday, missing their chance to finish third.\nSaturday's netball results mean Jamaica and New Zealand will battle it out for the gold on Sunday during some of the final medal awards of the tournament.\nEngland will also try to deny Australia a consolation bronze, before teams transform the Hydro from a netball court back to a gig venue for the closing ceremony on Sunday night.\nThe venue will be turned around in just six hours.\nIt has been a scaled-down version of the Games, with 215 medals awarded across 10 sports, however it has hosted a record 47 para-sports events.\nGlasgow stepped in to host the tournament - for the second time in eight years - when Australian state Victoria pulled out due to soaring costs.\nKing Charles and Queen Camilla emerged from a Tardis during the spectacular opening ceremony last Thursday.\nFlags from 74 nations and territories were carried into the arena during the event, which also featured the Loch Ness monster and performances from Nathan Evans, Tom Walker and KT Tunstall.\nSimple Minds are due to perform at the closing ceremony alongside Scottish performers Cammy Barnes, BEMZ and Sandi Thom.\nOrganisers say it will \"highlight the people who made the Games possible, the pride of the host city and the iconic sporting triumphs\".\nThe curtain call will also be played out by Highland folk and electronic band Elephant Sessions, while Scottish singer Shereen Cutkelvin will mark the ceremonial flag handover.\nAhmedabad in the west of India is set to host the centenary Commonwealth Games in 2030.\nShankar Mahadevan, one of Bollywood's greatest vocalists, and actress Rashmika Mandanna are set to take to the stage as the baton is passed over.\nAustralian artist Delta Goodrem will perform a homage to Scotland at the closing ceremony 20 years after she sang in Melbourne 2006.\nCommunity groups and cultural organisations will also be involved.", "translation_ja": "", "vocab": [{"word": "exhilarating", "definition": "非常に興奮させる、爽快感を与える。スポーツやイベントなどで観客を盛り上げるようなダイナミックな表現に使われます。"}, {"word": "scaled-down", "definition": "より小規模に縮小された、規模を減らした。元の計画より小さい規模で実施することを意味します。"}, {"word": "concourse", "definition": "大きな公共建築物内の広い通路やホール。駅や競技場などで人々が集まる中央の空間を指します。"}, {"word": "centenary", "definition": "100周年、百年紀念。特定の出来事や組織が100年経過したことを記念する時期や行事を表します。"}, {"word": "curtain call", "definition": "カーテンコール、謝幕。演技やパフォーマンス終了後に出演者が観客の拍手に応える場面を指します。"}, {"word": "homage", "definition": "敬意の表現、賞賛。特定の人物や事柄に対して尊敬や感謝を示すパフォーマンスや作品を意味します。"}]}, {"title_ja": "ペルーの観光飛行機墜落、13人が死亡", "title_en": "13 Dead After Small Tourist Plane Crashes in Peru", "summary_ja": "2026年8月1日、ペルーの有名なナスカの地上絵を見に向かう観光客を乗せた小型飛行機が南部ペルーで墜落し、乗客11人と乗員2人の計13人全員が死亡した。飛行機はピスコ空港の離陸直後に管制塔との連絡を失った。当局は現在墜落原因を調査しており、これまでに4体が回収されている。", "summary_en": "A small aircraft carrying tourists to Peru's Nazca Lines archaeological site crashed in southern Peru on August 1, 2026, killing all 13 people on board, including 11 passengers and 2 crew members. The plane lost contact with the control tower shortly after taking off from Pisco airport. The crash is under investigation, and authorities have recovered four bodies so far.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/13-dead-after-small-tourist-plane-crashes-in-peru/a-78204342?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "13 dead after small tourist plane crashes in Peru\nAugust 1, 2026\nA small plane carrying tourists to see Peru's famed Nazca Lines archaeological site crashed, killing 13 people, authorities in Nazca province said on Saturday.\n\"We have information that 11 passengers and two crew members have died,\" said Police Major Jorge Andrade at the crash site in southern Peru.\nAndrade also said that \"given the severity of the accident, there are no survivors,\" adding that four bodies have been recovered so far.\nThe plane crashed shortly after 1:00 p.m. local time (1800 GMT) after taking off from the airport in the city of Pisco, located about 240 kilometers (150 miles) south of the capital, Lima.\nWhat else do we know about tourist plane crash over Peru's Nazca Lines?\nLocal news outlet RPP reported that the small plane lost contact with the control tower minutes after takeoff.\nThe crash occurred in the area of Pueblo Viejo, about six kilometers from the city of Nazca and around 12 kilometers from the Nazca Lines site, according to local authorities.\nNazca's government said the plane was operated by local Peruvian company Aerodiana.\nThe airline was not immediately available for comment. However, on its website, Aerodiana says it has operated scenic flights over the Nazca lines for the past 14 years.\nThe reasons behind the plane crash are still unknown. Peruvian authorities said the incident is under investigation.\nPlane crashes during flights over Peru's Nazca Lines\nStretching across the desert near the city of Nazca, the Nazca Lines are a vast collection of geoglyphs created hundreds of years ago by Peru's Indigenous inhabitants.\nThe famous desert geoglyphs, many depicting animals, can only be fully appreciated from the air or elevated viewing platforms.\nThe latest incident is not the first plane to crash near the site in recent decades.\nIn 2022, a plane crash killed seven people on board, including two Chileans and three Dutch nationals.\nIn 2010, another fatal crash killed four British tourists and two Peruvian crew members.\nEdited by: Roshni Majumdar\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "geoglyphs", "definition": "地表に描かれた大規模な図形やパターンのこと。通常、航空写真や高い位置からしか全体像を見ることができない古代の芸術作品を指す。"}, {"word": "scenic", "definition": "風景が美しい、または風景を見ることを目的とした観光飛行などを意味する。景観や眺めを楽しむための活動に使われる。"}, {"word": "incident", "definition": "事件や事故などの出来事を指す。通常は好ましくない、または注目すべき事象を意味する用語。"}, {"word": "authorities", "definition": "公的機関や政府機関など、権限を持つ公式な組織や役人のこと。ニュースでは警察や政府官員を指すことが多い。"}, {"word": "severity", "definition": "事柄の程度が深刻である、または重大である状態を表す。事故や問題の重さを説明する際に使われる。"}]}, {"title_ja": "東欧におけるロマ・ホロコーストの追悼", "title_en": "Eastern Europe's Commemoration of the Roma Holocaust", "summary_ja": "東欧諸国は8月2日を欧州ロマ・ホロコースト追悼日として、第二次世界大戦中にナチスに虐殺された50万人のロマ・シンティを追悼している。ポーランド、チェコ、スロバキア、ハンガリー、ルーマニアはそれぞれ強制収容所跡地で公式の追悼式典を開催し、同時にロマ社会への継続的な差別問題に対する意識啓発も行っている。", "summary_en": "Eastern European countries observe August 2 as European Roma Holocaust Memorial Day to remember the Nazi genocide of 500,000 Roma and Sinti during World War II. Poland, Czechia, Slovakia, Hungary, and Romania each hold official commemorations at memorial sites and concentration camp locations, while also raising awareness about ongoing discrimination against Roma communities.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/how-does-eastern-europe-commemorate-the-roma-holocaust/a-78183503?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "社会", "full_text": "How does eastern Europe commemorate the Roma Holocaust?\nAugust 1, 2026\nIt took decades before Germany recognized the Romani Holocaust — the Nazi genocide of 500,000 European Roma and Sinti during World War II. Several more decades passed before the European Holocaust Memorial Day for Sinti and Roma became an official German and European day of remembrance, celebrated each year on August 2.\nBased on initiatives by Polish Roma groups, the Nazi liquidation of the so-called \"Gypsy Family Camp\" in the Auschwitz-Birkenau Concentration and Extermination Camp on the evening of August 2-3, 1944, was first commemorated half a century later, in 1994.\nThousands of deported Roma and Sinti had already been killed as a result of malnutrition and disease. That evening, thousands more were forced into gas chambers, shot and beaten to death by Nazi henchmen.\nIn 2015, the European Parliament declared this date the European Roma Holocaust Memorial Day. In Germany and other European countries, the genocide is commemorated by officials with the participation of government representatives. In some cases, representatives of European governments travel to the memorial site in Auschwitz.\nIn most cases, however, countries hold their own memorial services — particularly in central and southeastern Europe, where Nazi extermination commonly targeted Romani peoples. These days, such memorial days also take the opportunity to raise awareness for ongoing Antiziganism and the consequences it has.\nPoland: 15 years of commemoration\nPoland, home to an estimated 30,000 Roma, has been observing August 2 since 2011. The ceremony routinely includes a visit by parliamentary and governmental representatives to the Auschwitz Memorial.\nAnother important day of remembrance is observed each year in the village of Szczurowa, east of Krakow, on July 3. It honors the memory of Polish Roma massacred by German troops in 1943. In 1956, Szczurowa became the first site of a European memorial for victims of the Romani Holocaust.\nOther small towns and villages across southeastern Poland also commemorate the killing of Polish Roma during Nazi German occupation.\nCzechia: A former pig farm turned memorial site\nIn the Czech Republic, where nearly 250,000 Roma live, August 2 has been an official day of remembrance since 2015. The most important ceremony is held in Lety, south of Prague, where Roma organizations have been commemorating the genocide for decades. This is the site where German Nazis established a concentration camp in 1940, and began deporting and imprisoning Romani families from occupied Bohemia from 1942 onward.\nAfter the war, the site was used as a pig farm. It was closed in 2018, following a long controversy, and transformed into a place of remembrance.\nCzech President Petr Pavel and then-Prime Minister Petr Fiala both attended the opening ceremony in April 2024.\nAnother memorial site is located in Hodonin north of Brno, at the location of a further Nazi concentration camp which imprisoned Romani people from Bohemia and Moravia. Here, one of the atrocities commemorated includes the mass deportation of Roma and Sinti to Auschwitz on August 21, 1943.\nSlovakia: Memorial Day established in 2005\nAround half a million Roma live in Slovakia. Here, the Romani Holocaust Memorial Day has been observed on August 2 since 2005. The main ceremony is held at the Slovak National Uprising (SNU) museum in Banska Bystrica in central Slovakia.\nThe museum honors the 1944 armed uprising against Nazi occupation. It was one of the largest anti-fascist movements in Europe during World War II.\nThe memorial ceremony is organized by the government's Plenipotentiary for Romani Communities and non-governmental Roma initiatives. Other representatives of the state or the presidential office also take part.\nHungary: Antiziganism yesterday and today\nAround 600,000 Roma call Hungary home. Here, since 2005, various sites have been observing the Romani Holocaust Memorial Day on August 2, following a parliamentary resolution. In Budapest alone, there are three places of remembering for the Roma murdered during the Holocaust where commemorative events are held. The reason for these and numerous other memorial sites is that Hungarian Roma were the target of deportations and killings particularly following German occupation in 1944 and under the rule of the Arrow Cross, Hungary's fascist regime.\nHistorical remembrance in Hungary is also deeply intertwined with the racist murdering spree directed at Roma people between 2008 and 2009. In this time, four Hungarian neo-Nazis killed a total of six people and injured 55 others, some of them severely. They planned their final hate crime for the night of August 2, in the eastern village of Kisleta.\nRomania: Deportation to Transnistria\nRomania, where around 2 million Roma live, Roma Holocaust Memorial Day has officially been observed since 2020. The main event is held at the Holocaust Memorial in Bucharest, which was inaugurated in 2009. Under the di", "translation_ja": "", "vocab": [{"word": "genocide", "definition": "特定の民族や宗教集団を意図的かつ組織的に抹殺する大量虐殺行為。歴史的に極めて深刻な人権侵害を指す。"}, {"word": "commemorate", "definition": "重要な歴史的出来事や亡くなった人々を公式に記念して思い出すこと。式典やモニュメントを通じて行われることが多い。"}, {"word": "extermination", "definition": "組織的な完全破壊や絶滅。特にナチスによる大量虐殺政策を指す際に使用される。"}, {"word": "Antiziganism", "definition": "ロマやシンティ民族に対する差別や偏見。歴史的および現代的な人種主義的态度や実践を指す。"}, {"word": "deportation", "definition": "政府権限により人々を強制的に別の場所へ移送すること。ホロコースト期間中、多くのロマが強制収容所に運ばれた。"}, {"word": "fascist", "definition": "独裁的で国家至上主義的なイデオロギーを持つ政治体制または支持者。ナチスやハンガリーの矢十字党などが該当する。"}]}, {"title_ja": "ドイツの同性カップル平等への長い道のり", "title_en": "Germany's Long Road to Equality for Same-Sex Couples", "summary_ja": "ドイツの同性婚平等への道のりは2001年の市民パートナーシップ法で始まりました。この法律は法的認識を提供しましたが、多くの分野では依然として差別的でした。16年間の段階的な進展を経て、2017年に連邦議会が「すべての人への結婚」法案を可決し、完全な同性婚平等が実現されました。", "summary_en": "Germany's journey toward same-sex marriage equality began with the Civil Partnership Act in 2001, which provided legal recognition but remained discriminatory in many areas. After 16 years of incremental progress through court rulings and legislative changes, full marriage equality was achieved in 2017 when the Bundestag passed 'marriage for all' legislation.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/germany-s-long-road-to-equality-for-same-sex-couples/a-78193914?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Germany's long road to equality for same-sex couples\nAugust 1, 2026\nAugust 1, 2001, marked a turning point: with the Civil Partnership Act, same-sex couples in Germany gained a legal framework for the registration of their partnerships. However, another 16 years would pass before marriage itself became an option.\n\"The Civil Partnership Act was a milestone for the legal recognition of same-sex couples in Germany and laid the foundation for opening up marriage,\" Alexander Vogt of the national board of \"Queere Vielfalt e.V.\" (Queer diversity) told DW.\n\"It introduced a legally secure partnership with rights similar to those of marriage — such as inheritance, maintenance, and residency rights — though it remained discriminatory in many areas – like adoption or tax law. Nevertheless, it gave us a foot in the door — a solid base from which further rights could be secured, usually by appealing to the Federal Constitutional Court.\"\nPublic opinion was ahead of the political establishment\nThe legislation was preceded by a fierce political debate. The opposition bloc of conservative parties, the Christian Democratic Union and the Christian Social Union (CDU/CSU), denounced it as an \"unconstitutional attack on marriage and the family.\" Lawmakers from the ruling center-left Social Democratic Party (SPD), however, described the law as \"a long-overdue act of redress.\"\n\"There was strong conservative opposition, for instance from churches and civic groups,\" Alexander Vogt noted. \"The debate reflected the classic culture war between traditional and progressive values.\"\nBacked by the governing coalition of Social Democrats and Greens, the majority of Bundestag lawmakers voted in favor of the Civil Partnership Act in November 2000, despite opposition from the CDU/CSU and the neoliberal Free Democrats (FDP).\nGerman public opinion was already a step ahead: A 1999 survey showed that 55% of respondents were already in favor of the Civil Partnership Act.\nHowever, Germany was by no means a pioneer. Denmark was the first country in the world to introduce civil partnerships for same-sex couples, doing so as early as 1989. Norway, Sweden, and Iceland followed in the mid-1990s, with France following in 1999.\n'We simply wanted equal treatment'\nTwenty-five years ago, Reinhard Lüschow and his husband Heinz-Friedrich Harre — who has since passed away — became the first same-sex couple in Germany to tie the knot at a registry office under the new Civil Partnership Act. They had spent the preceding decade fighting for legal recognition as a couple.\nAs early as 1992, they had made a public statement by applying to register their marriage — in a coordinated move by 250 male and female same-sex couples across Germany. When their application was rejected, they took the case all the way to the Federal Constitutional Court. \"We simply wanted to be treated equally,\" Lüschow recently told the Protestant Press Service (epd).\nAlthough the court ruled at the time that marriage was a union between a man and a woman, it also mandated that the legislature ensure same-sex partnerships were not discriminated against. When the Bundestag implemented this requirement through the Civil Partnership Act, Lüschow and Harre reacted immediately.\nHard-won changes\nThe Civil Partnership Act regulates matters such as the use of surnames, mutual financial support, and inheritance rights. In the years that followed, the scope of civil partnerships was gradually expanded — first in 2004 to include stepchild adoption, and later to achieve tax equality following several rulings by the Federal Constitutional Court.\nThe Civil Partnership Act was merely the first step toward equality. The decisive step did not come until October 1, 2017, with legislation that introduced so-called \"marriage for all.\"\nThis, too, was a hard-won victory. The conservative parties had come to power again in 2005. They blocked the legislation until Chancellor Angela Merkel authorized a vote free from party-line constraints, meaning lawmakers were to follow only their consciences; this is how the majority was secured in 2017. Angela Merkel and current Chancellor Friedrich Merz voted against the legislation.\nBodo Mende and Karl Kreile were the first same-sex couple to marry. Reflecting on the 2001 Civil Partnership Act, Mende later told DW: \"It was a second-class partnership.\" Although there were few legal restrictions, the status lacked the standing of a conventional marriage.\nMarried partners enjoy more rights — for instance, regarding naming laws, child adoption, and the equalization of pension rights. Marriage also carries greater recognition internationally.\nAccording to the Federal Statistical Office, around 108,000 couples had availed themselves of this new option by 2025. At the same time, approximately 24,000 registered civil partnerships remain in existence; these can be converted into marriages upon application.\n'Marriage for all' does not amount to full equality\nDifferences remain between same", "translation_ja": "", "vocab": [{"word": "milestone", "definition": "大きな進展や転機となる重要な出来事。また、距離を測る標識も意味します。"}, {"word": "discriminatory", "definition": "ある集団や個人に対して不公正な扱いをする、または差別的な性質を持つ形容詞。"}, {"word": "neoliberal", "definition": "経済的自由主義を重視する政治イデオロギー。市場主導のアプローチを支持します。"}, {"word": "mandate", "definition": "公式な命令または権限を与えること。また、政治的支持や選挙による権限も意味します。"}, {"word": "incrementally", "definition": "段階的に、少しずつ増加しながら進むこと。段階的な進展を表します。"}, {"word": "availed", "definition": "利用する、活用するという意味の動詞の過去形。機会や権利を利用することを指します。"}]}, {"title_ja": "モスクワでの爆発 少なくとも3人死亡、21人負傷", "title_en": "Explosion in Moscow Kills at Least 3, Injures 21 Near Kudrinskaya Square", "summary_ja": "モスクワのクドリンスカヤ広場近くで爆発が発生し、少なくとも3人が死亡、21人が負傷した。ロシアの首都でインシデントに対応した緊急サービス。爆発の原因は調査中である。", "summary_en": "An explosion occurred near Kudrinskaya Square in Moscow, resulting in at least 3 deaths and 21 injuries. Emergency services responded to the incident in the Russian capital. The cause of the explosion is under investigation.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/International/explosion-moscow-leaves-3-dead-15-injured/story?id=135294336", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュース ライブ：速報とライブイベント", "title_en": "ABC News Live: Breaking News and Live Events Coverage", "summary_ja": "ABCニュース ライブは、世界中の速報とライブイベントを24時間体制でカバーしています。このプラットフォームは、主要なニュースが展開する際にリアルタイムで継続的な更新を提供し、視聴者に最新情報をお知らせします。", "summary_en": "ABC News Live provides 24/7 coverage of breaking news and live events from around the world. The platform delivers continuous updates on major stories as they develop, keeping viewers informed in real-time.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "プエルトリコ祭後の銃撃事件で女性が殺害、ロチェスター警察が容疑者捜査", "title_en": "Police Search for Suspects After Woman Killed in Shooting Following Puerto Rican Festival", "summary_ja": "ニューヨーク州ロチェスターでプエルトリコ祭の後に銃撃事件が発生し、女性1人が殺害され、2人が負傷した。警察は事件の容疑者特定のための捜査と証拠収集を進めている。この銃撃事件はニューヨーク州北部の都市で刑事捜査を引き起こしている。", "summary_en": "A woman was fatally shot and two others were injured in a shooting that occurred after a Puerto Rican festival in Rochester, New York. Police are actively investigating the incident and searching for clues to identify the suspects responsible. The shooting has prompted an ongoing criminal investigation in the upstate New York city.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/rochester-police-searching-clues-after-woman-fatally-shot/story?id=135290808", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "セウタ危機をめぐるEU内部分裂の中、緊急会合が火曜日に開催予定", "title_en": "EU to Hold Urgent Meeting on Ceuta Migration Crisis Amid Internal Divisions", "summary_ja": "EUは、スペイン領セウタへの5万人以上の移民到着をめぐる加盟国間の分裂に対処するため、火曜日に内務大臣の緊急会合を召集する予定である。スペイン首相は他のEU加盟国による「フェイクニュース」と批判を非難し、イタリアやデンマークはシェンゲン圏からの除外を含むより強硬な対応を求めている。", "summary_en": "The EU will convene an emergency meeting of interior ministers on Tuesday to address divisions over the arrival of over 50,000 migrants in Spain's Ceuta territory, where at least 67 people died attempting to cross. Spain's prime minister criticized fellow EU members for spreading \"fake news\" and attacking Spain, while countries like Italy and Denmark called for stronger action including potential Schengen suspension.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/aug/01/spain-pedro-sanchez-calls-for-eu-meeting-ceuta-border-crossing", "state_media": false, "category": "政治", "full_text": "The EU is to hold an urgent meeting of interior ministers on Tuesday amid continued divisions in the bloc over the arrival of more than 50,000 migrants in the Spanish territory of Ceuta in north Africa.\nThe decision was taken by officials representing EU member states and Frontex border agency experts at what was described as a “sobering” meeting on Saturday.\nSpain confirmed at least 67 people had died in the attempted crossing. Some drowned, while others were crushed as they tried to cross a breakwater barrier.\nThe decision to call a summit of ministers was unanimous as EU leaders seek to heal divisions in the bloc and restore a unified approach to migration.\nSpain said migrant crossings into Ceuta had stopped overnight, as police began installing a 500-metre (1,640ft) floating barrier off its border with Morocco.\nAndy Burnham, the British prime minister, said on Saturday: “I have been in touch with the Spanish prime minister and [we are] providing what help we can.”\nItaly and Denmark, with some support from Poland and Sweden, used the meeting on Saturday to criticise Spain for what had happened.\nIn a furious letter on Saturday, Spain’s prime minister Pedro Sánchez hit out against “fake news” and “disinformation”, pointing out that “virtually all” migrants had been returned to Morocco after the army intervened on Friday, “preventing any unauthorised onward movement towards continental Europe”.\nIt is understood suspected Russian attempts to spread disinformation to sow dissent within the EU was also discussed at the meeting on Saturday.\nThere is frustration in Spain that previous incidents of this scale, such as mass arrival of migrants on the border of Belarus and Poland or Russia and Finland, were labelled as “hybrid attacks” , and met with solidarity from the rest of the EU.\nAlthough more than 48,000 people had voluntarily returned to Morocco by 6pm on Friday, the influx triggered a political crisis for the Madrid government and led some fellow EU countries to call for Spain to be suspended from the Schengen free-movement zone.\nJuan Jesús Vivas, the president of Ceuta, said that while many people had returned to Morocco, not all those who had crossed into the city had left.\n“We’re not back to normal because there are several thousand people who need to be returned, and there is still an atmosphere marked by unease and concern,” he said. He also called for “all the security measures deployed” in Ceuta to remain in place to guarantee the safety of the population.\nSánchez asked for the meeting after what appeared to be a breakdown of EU unity on external border policy, with Italy attacking Spain.\nItaly announced on Friday evening that it would suspend its Schengen arrangements with Spain for a month, even though Ceuta – and Spain’s other north African territory, Melilla – are subject to special Schengen rules that prevent onward movement within the zone.\nItaly’s foreign minister, Antonio Tajani, blamed the situation in Ceuta on the Sánchez government’s decision to offer a now-closed scheme to regularise the status of more than 1 million undocumented migrants and asylum seekers. He said the programme had incentivised human trafficking and was “profoundly wrong”.\nSánchez was forthright in a letter sent to the European Commission president, Ursula von der Leyen, the European Council president, António Costa, and Micheál Martin, the prime minister of Ireland, which holds the EU presidency.\nSánchez said that while most EU countries had expressed support and solidarity over events in Ceuta, others had chosen to attack Spain.\n“Such an attitude – driven by prejudice, fake news, ignorance or political interest – is … contrary to European law, humanitarian law and the principles of solidarity that bind us together,” he said.\nIn a pointed rebuke to Italy, he noted that Spain was “according to Frontex, one of the least porous external borders of the European Union, with a number of irregular entries that is half that recorded, for example, in Italy in recent years (2021–26)”.\nSenior EU officials met on Saturday in a “political crisis response team” convened by Ireland’s presidency.\nIreland’s prime minister, Micheál Martin, said on Saturday that, as the holders of the EU presidency, “Ireland will convene a meeting on Tuesday of the EU Justice and Home Affairs Council, chaired by Jim O’Callaghan [justice minister], to discuss developments in Ceuta.\n“We remain in close contact with all member states and the institutions and continue to monitor the situation,” he said in a social media post.\nO’Callaghan, who is leading the meetings on behalf of the EU, said he had been in touch with Spain’s interior minister, Fernando Grande-Marlaska, to express his solidarity and support.\nIn remarks that appeared to respond to Sánchez’s criticisms, von der Leyen said she welcomed his suggestion of a video conference “to take stock of what has happened”, adding: “Fighting illegal migration requires solidarity and a united European response", "translation_ja": "", "vocab": [{"word": "porous", "definition": "簡単に通り抜けられる、穴の多い状態のこと。国境管理の文脈では、多くの違法入国を許している境界線を指す。"}, {"word": "solidarity", "definition": "共通の目標や利益を持つグループ内での一体感や相互支援のこと。政治的な文脈では、困難な状況にある国や地域への統一した支持を意味する。"}, {"word": "disinformation", "definition": "意図的に広められた誤った情報や嘘のこと。フェイクニュースと同義で、特に政治目的で使用される情報操作を指す。"}, {"word": "influx", "definition": "大量に流入すること、殺到のこと。特に人口や物資が短時間に大量に押し寄せる状況を表現する。"}, {"word": "hybrid attack", "definition": "軍事、サイバー、情報戦争など複数の手段を組み合わせた攻撃のこと。政府や社会の不安定化を目的とした多層的な攻撃戦略を指す。"}, {"word": "sobering", "definition": "思わず真剣になる、冷静にさせるような状況のこと。深刻で落ち着きを要する状況を表現する。"}]}, {"title_ja": "スペイン飛び地セウタへの移民急増で57人以上が死亡、モロッコから5万人が殺到", "title_en": "57 dead as 50,000 migrants surge into Spanish enclave Ceuta from Morocco", "summary_ja": "モロッコからスペイン領北アフリカ飛び地セウタへの大規模移民殺到で少なくとも57人が死亡し、わずか24時間で数万人が越境した。スペインのサンチェス首相は、最近の司法判断を悪用した人身売買ネットワークが原因だと指摘し、領土主権侵害と主張した。この危機はEUの政治的対応を引き起こし、2021年の同様だがより小規模な事件と比較された。", "summary_en": "At least 57 people died during a massive migration surge into Spain's North African enclave of Ceuta, with tens of thousands crossing from Morocco in just 24 hours. Spanish PM Pedro Sánchez attributed the influx to human trafficking networks exploiting a recent court ruling, while calling it a violation of territorial integrity. The crisis triggered an EU political response and comparisons to a similar but smaller 2021 incident.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/jul/31/ceuta-spain-morocco-border-deaths", "state_media": false, "category": "政治", "full_text": "At least 57 people have died trying to reach the Spanish enclave of Ceuta after as many as 50,000 migrants entered the tiny territory from Morocco in what Spain’s prime minister, Pedro Sánchez, called “a violation of Spain’s territorial integrity”.\nThe huge influx, which took place over the course of just 24 hours, overwhelmed the city of 85,000 people, triggered a political crisis for Madrid and led to a mixed reaction from other EU countries, including calls for Spain to be suspended from the Schengen free-movement zone.\nSánchez, who arrived in Ceuta on Friday morning, said he would use all the resources at his disposal to guarantee the safety of the city’s population.\nHe attributed the mass crossing to “human trafficking mafias” that had taken advantage of a decision by Spain’s supreme court, which recently ruled that those intercepted at sea while trying to enter Ceuta, or Spain’s other north African enclave of Melilla, could not be summarily returned under special rules.\nSánchez said: “That has spread like wildfire during these last few hours through the networks of mafias that traffic in human beings and has produced an avalanche of the characteristics and dimension that we experienced yesterday.”\nSánchez said a temporary reception centre would be established to facilitate the documentation, registration, triage and “expedited” expulsion of people with no legal claim to be in Spain.\nHe also said the government would erect a visible barrier – a line of buoys – near the breakwater at Ceuta’s Tarajal beach to make it clear where the border was, and to legally comply with the court’s ruling.\nAlthough the Spanish government said about 50,000 people had crossed the border on Thursday and in the early hours of Friday, the president of Ceuta put the figure at about 60,000.\nSpain’s interior ministry, which has deployed additional police officers and soldiers to the enclave, said more than 48,300 people had voluntarily returned to Morocco by 6pm on Friday.\nThe Irish presidency of the EU has convened a meeting of member states on Saturday, under the Integrated Political Crisis Response mechanism.\nEU sources said this will provide experts from member states with an opportunity “to discuss the movements into Ceuta over the last two days, the numbers of people who have returned to Morocco today, the supports being provided by the EU to Spain and diplomatic engagement with Morocco”.\nA further meeting of EU ambassadors has been called in Brussels on Monday.\nThe latest incident dwarfs the last mass border crossing in May 2021, when Morocco loosened its border controls, allowing about 10,000 people to enter the territory over the course of two days.\nThat crossing came amid heightened tensions between Madrid and Rabat over Spain’s decision to allow the leader of the Western Sahara independence movement, the Polisario Front, to be treated for Covid-19 in Spain. Morocco and the Polisario Front both lay claim to Western Sahara, which was under Spanish rule until 1975, when colonial authorities handed over the territory to Morocco and Mauritania.\nThat diplomatic crisis ended in 2022 when Madrid reversed its longstanding policy of neutrality and backed Morocco’s plan for Western Sahara – a move that had caused a diplomatic rift between Spain and Algeria, which had supported the Polisario group.\nSánchez visited Algiers on 20 July – the first such visit by a Spanish head of government in four years – marking a thaw in relations with Algeria.\nMoroccan government sources told the Europa Press news agency that the surge of people entering Ceuta was down to “criminal organisations” and insisted that Rabat’s cooperation with Spain remained “exemplary”.\nMorocco’s ambassador to Spain, Karima Benyaich, was quoted by the Associated Press as saying that “we have always prioritized legal, orderly and safe migration for all” and indicated that the situation had developed against Rabat’s wishes.\nRachid Sbihi, who leads a local workers’ association representing officers of the Spanish Guardia Civil – which patrols Spain’s borders – described the situation as a “serious humanitarian crisis”.\nWithout shelter, thousands of people, including unaccompanied children, had been left sleeping in parks and on pavements, while others roamed the streets aimlessly. “It’s chaotic,” said Sbihi.\nAmong those who died, many drowned, but some were killed in a crush to cross the breakwater fence at Tarajal beach, Sbihi said.\nVideo footage on Thursday showed crowds of people walking around the breakwaters at Tarajal beach on to local roads. While most appeared to be young men, there were also families with women and small children.\nCeuta and Melilla have the EU’s only land border with Africa. Both cities periodically experience surges in attempted crossings by people seeking to reach Europe.\nThe events in Ceuta led some EU countries to issue strong threats or rebukes.\nSpain’s foreign minister, José Manuel Albares, summoned Italy’s ambassador to Madrid on Friday", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "周囲を他国に囲まれた領土のこと。セウタはモロッコに囲まれたスペイン領。"}, {"word": "territorial integrity", "definition": "国家の領土を侵害されない権利のこと。国家主権の重要な側面として国際法で保護される概念。"}, {"word": "expedited", "definition": "通常より迅速に進められることを意味する形容詞。迅速な、急速な手続きを指す。"}, {"word": "Schengen zone", "definition": "欧州26ヶ国が加盟し、内部国境での出入国検査を廃止した自由移動地域。"}, {"word": "dwarfs", "definition": "動詞で、比較対象をはるかに大きさや重要性で上回ることを意味する。ここでは規模が大きく上回ることを表現。"}, {"word": "diplomatic crisis", "definition": "国家間の外交関係が悪化し、深刻な対立や緊張状態に陥った状況のこと。"}]}, {"title_ja": "カンタベリー大主教、奴隷制度の影響を受けたコミュニティ向けに1億ポンド基金を誓約", "title_en": "Archbishop of Canterbury Pledges £100m Fund for Communities Affected by Slavery", "summary_ja": "イングランド国教会の大主教サラ・マローリーは、ガーナのケープコースト城を訪問し、大西洋奴隷貿易への教会の関与に対する「悲しみ」を表明し、影響を受けたコミュニティを支援する1億ポンド基金への支持を改めて表明した。ガーナとカメルーンの10日間の視察中に、マローリーは大西洋を横断する前に数千人の奴隷アフリカ人が収容されていた歴史的な要塞を訪問した。彼女の前任者は3年前に教会の関与について正式に謝罪したが、批評家は基金の額が奴隷制度の世代的損害に対処するには不十分だと主張している。", "summary_en": "The Archbishop of Canterbury, Sarah Mullally, visited Cape Coast Castle in Ghana to express the Church of England's \"lament\" for its role in transatlantic slavery and reaffirmed commitment to a £100m fund supporting affected communities. During her 10-day tour of Ghana and Cameroon, Mullally toured the historic fortress where thousands of enslaved Africans were held before being shipped across the Atlantic. Her predecessor formally apologized for the church's involvement three years ago, though critics argue the fund amount is insufficient to address slavery's generational damage.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/news/2026/jul/31/archbishop-of-canterbury-support-pledge-helping-communities-enslavement", "state_media": false, "category": "経済", "full_text": "At a former British castle where thousands of enslaved Africans were held before being shipped across the Atlantic, the archbishop of Canterbury expressed “lament” for the Church of England’s involvement in transatlantic chattel slavery and reaffirmed her commitment to a controversial £100m fund for affected communities.\nSarah Mullally made the comments during a visit to the Cape Coast castle, a 17th-century fortress built by Swedish traders, but occupied by the Danish and the Dutch, before the British seized it in 1664.\nIt was part of a 10-day tour of Ghana and Cameroon at the invitation of the head of the Anglican church’s west Africa province, the archbishop Cyril Kobina Ben-Smith.\n“Being at Cape Coast castle today and seeing the horrific conditions that thousands of people were kept in, it is impossible not to feel the weight of the immense evil that drove the transatlantic slave trade,” Mullally said on Thursday.\nShe was shown the dungeons used to keep enslaved people, before praying in a former Anglican chapel above them. She also visited the “Door of No Return”, where enslaved people were loaded on to ships and ferried across the Atlantic. It has since been renamed the “Door of Return”.\nHer trip began in the Ghanaian capital of Accra, about 90 miles (145km) east of Cape Coast on Sunday. There, Mullally visited four local parishes and delivered the sermon at a special Eucharistic service at St Joseph the Worker Anglican church in the Kaneshie area. According to local reports, the service was officiated by an all-female clergy from the Anglican church of Ghana.\nMullally, who in March became the 106th head of the 492-year-old denomination and the only woman to do so, also met the Ghanaian president, John Mahama, earlier in the tour, along with her husband, Eamonn Mullally.\nSince the government launched the Year of Return scheme in 2019 to help Africans and their descendants in the diaspora reconnect with their roots, Ghana has had a surge in visitors. As part of Mullally’s visit, she laid a foundation stone for a hostel belonging to the local church’s culture resort initiative, to accommodate pilgrims from the diaspora wanting to engage in the scheme.\nThe archbishop also preached at a service of more than 1,000 nurses in the town of Mampong, where she commissioned a new campus clinic named after her. On Friday, she was heading to Yaoundé, the Cameroonian capital, and will then proceed to Douala and the English-speaking cities of Buea and Limbe.\nGhana has been spearheading a global campaign to seek reparative justice and last month hosted a landmark conference attended by more than 80 heads of state.\nThe archbishop’s visit comes three years after her predecessor Justin Welby formally apologised for the church’s role in the transatlantic slave trade, including using a fund for poor clergy to invest in enslaving Africans. “It is a stain on the wider church that some Christians did not see their brothers and sisters as created in the image of God, but as objects to be exploited,” he said.\nThe church set up a £100m fund committed to “a programme of investment, research and engagement” in communities affected by slavery, prompting diverse reactions. At the time, an independent oversight group argued that the amount was insufficient to address the generational damage slavery had caused and urged the church to expand that commitment to £1bn. Upon Mullally’s ascension to the role of archbishop, a committee of Conservative MPs urged her to spend the money on wages for the church’s clergy.\nHowever, on Thursday, the archbishop reaffirmed her commitment to the fund. “We played a part in the transatlantic slave trade … part of the Christian belief in repentance is about action, so we are putting in place action to support those communities that feel the legacy of the slave trade,” she said.\nAcross Ghana, the mood has largely been celebratory. On a visit to the palace of the Asantehene, the traditional ruler of the Asante people, in the city of Kumasi on Wednesday, Mullally wore a special cassock and cape lined with kente cloth that pleased palace chiefs.\nAmong the less enthused was Accra-based accountant Kenneth Mordzro, who said he believes the church can play a greater role in reparation efforts. “They should bring back the gold and artefacts they stole from our ancestors during the colonial days,” he said, referring to items looted by the British government during the Anglo-Asante wars of the 19th century.", "translation_ja": "", "vocab": [{"word": "transatlantic", "definition": "大西洋の両岸に関わる、あるいは大西洋を横断する。ここでは奴隷貿易がアフリカからアメリカ大陸へ進行したことを指す。"}, {"word": "chattel slavery", "definition": "奴隷を動産として扱う奴隷制度。人間を所有可能な財産とみなす法的・経済的体制。"}, {"word": "reaffirmed", "definition": "以前の約束や立場をもう一度確認して表明する。再び強く支持を表明すること。"}, {"word": "reparative justice", "definition": "過去の不正行為に対して損害賠償や補償を通じて正義を回復しようとする概念。"}, {"word": "generational damage", "definition": "複数の世代にわたって続く悪影響や損害。親から子へと受け継がれる社会的・経済的な害。"}, {"word": "eucharistic", "definition": "キリスト教の聖餐式に関する。パンとぶどう酒を用いた宗教儀式。"}]}, {"title_ja": "セウタからの移民大量出発、スペインが自発的な離去を報告", "title_en": "Migrants Depart Ceuta as Spain Reports Mass Voluntary Exit", "summary_ja": "スペインは、最近北アフリカの飛び地セウタに流入した約6万人の移民がほぼ全員自発的に既に去ったと報告している。アルジャジーラの特派員ジョナ・ハルが現地からの報道を報告した。", "summary_en": "Spain reports that virtually all 60,000 migrants who recently entered its North African enclave of Ceuta have already left voluntarily. Al Jazeera correspondent Jonah Hull filed a report from the scene documenting the mass departure.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/8/1/al-jazeera-reports-from-ceuta-as-migrants-leave-the-enclave?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Al Jazeera reports from Ceuta as migrants leave the enclave\nSpain says “virtually all” of the estimated 60,000 migrants who stormed its North African enclave of Ceuta by land and sea in recent days have already left voluntarily. Al Jazeera’s Jonah Hull is in Ceuta and filed the following report.\nPublished On 1 Aug 2026", "translation_ja": "", "vocab": [{"word": "enclave", "definition": "周囲を別の領域に囲まれた領土または地域。セウタはスペイン領の北アフリカの飛び地を指します。"}, {"word": "voluntarily", "definition": "自分の意思で自発的に行動すること。強制されずに選択して行うことを意味します。"}, {"word": "stormed", "definition": "激しく、勢いよく押し寄せること。大勢が一気に流入することを表します。"}, {"word": "correspondent", "definition": "特定の地域から定期的に報道する新聞やテレビの記者。現地の情報を本社に送ります。"}, {"word": "filed", "definition": "報告書や記事を公式に提出すること。ジャーナリストが報道をニュース機関に送ることを意味します。"}]}, {"title_ja": "ペルーのナスカの地上絵を見学中の小型飛行機が墜落、13人が死亡", "title_en": "13 killed as small plane crashes over Peru's Nazca Lines", "summary_ja": "土曜日、ペルー南部で有名なナスカの地上絵を見学するため観光客を乗せていた小型飛行機が墜落し、乗客11人とパイロット2人を含む13人が死亡しました。墜落現場は急速に炎に包まれ、救助活動ができませんでした。アエロディアナ社が運航していた飛行機はイカ州ピスコから出発していました。", "summary_en": "A small aircraft carrying tourists to view the famous Nazca Lines archeological site crashed in southern Peru on Saturday, killing 13 people including 11 passengers and 2 pilots. The crash site was quickly engulfed in flames, preventing any rescue operations. The plane, operated by sightseeing company Aerodiana, had departed from Pisco in the Ica region.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/1/police-say-13-killed-as-small-plane-viewing-nazca-lines-in-peru-crashes?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Police say 13 killed as small plane viewing Nazca Lines in Peru crashes\nThose killed included 11 passengers and two pilots flying over the famous archeological site, recognised by UNESCO.\nAt least 13 people have been killed in a small plane that crashed in Peru, according to police.\nThe crash on Saturday came as the plane was carrying passengers, described by authorities as mostly tourists, to view the famous Nazca Lines, a series of archeological sites comprised of monumental geoglyphs carved into the soil.\nRecommended Stories\nlist of 3 items\n- list 1 of 3From first lady to president? Inside the rise of Peru’s Keiko Fujimori\n- list 2 of 3At least 14 dead after minibus rolls off mountain road in Peru\n- list 3 of 3Twin earthquakes strike Peru killing at least five\n“We have information that 11 passengers and two crew members have died,” Police Major Jorge Andrade told reporters from the crash site in the country’s south.\nLocal media reports indicate that the crash site was quickly engulfed in flames, preventing any rescues. The plane reportedly departed from Pisco, in the department of Ica. Further details were not immediately available.\nPeru is a major tourist destination, with visitors regularly travelling to visit the country’s historical sites, like the Incan ruins of Machu Picchu or the giant Indigenous stone walls of Cusco.\nMore than 4.1 million tourists visited the country of just under 35 million in 2025, according to Peru’s Ministry of Foreign Trade and Tourism.\nThe Nazca Lines are located in the desert near the country’s southern coastal regions, along the Andean mountain range.\nThey date back to between 500BC and 500AD, and have been designated as a World Heritage Site by the United Nations Educational, Scientific and Cultural Organization (UNESCO), in recognition of their value to global culture.\nUNESCO describes the site as “among archaeology’s greatest enigmas because of their quantity, nature, size and continuity”.\n“The geoglyphs depict living creatures, stylised plants and imaginary beings, as well as geometric figures several kilometres long,” according to UNESCO. “They are believed to have had ritual astronomical functions.”\nBecause of their enormous scale, the Nazca lines are often viewed from the air, where the drawings of animals like monkeys, hummingbirds and cats can be seen more clearly.\nSaturday’s crash involved a plane from the fleet of the Peruvian sightseeing company Aerodiana, according to reports.", "translation_ja": "", "vocab": [{"word": "geoglyphs", "definition": "地面や岩盤に刻まれた巨大な図形や絵のこと。ナスカの地上絵のような考古学的遺産を指します。"}, {"word": "monumental", "definition": "非常に大きく印象的で、歴史的に重要な意味を持つことを表します。建造物や遺跡などの規模や重要性を強調するのに使われます。"}, {"word": "engulfed", "definition": "完全に包み込まれたり、飲み込まれたりする状態を示します。炎や水などが何かを完全に覆う場合に使われます。"}, {"word": "designated", "definition": "公式に指定された、または任命されたことを意味します。世界遺産として選ばれるなど、正式な認定を受けた状態を表します。"}, {"word": "enigmas", "definition": "謎や不可解なもの、謎めいた問題を指します。その真の目的や意味が十分に理解されていない対象に用いられます。"}, {"word": "ritual", "definition": "儀式的な、宗教的な儀式に関連することを意味します。古代の人々が行った儀式的な目的や機能を説明する際に使われます。"}]}, {"title_ja": "エチオピアとTPLF、ティグレイ西部での戦闘をめぐって非難の応酬", "title_en": "Fighting Erupts in Western Tigray as Ethiopia and TPLF Clash Over Peace Deal", "summary_ja": "エチオピア連邦政府と北部ティグレイ人民解放戦線（TPLF）の間で、西部ティグレイのシェラロ近辺で武力衝突が発生しました。これは2022年のプレトリア平和協定における最も深刻な違反であり、両者は相手が戦闘を開始したと主張しています。解除や TPLF の法的地位をめぐる根本的な対立が解決されないまま、国際的な介入がなければより大規模な戦争に発展する可能性があると分析家は警告しています。", "summary_en": "Armed clashes broke out in western Tigray near Sheraro, marking the most serious breach of the 2022 Pretoria peace agreement between Ethiopia's federal government and the TPLF. Both sides accused each other of starting the conflict, with tensions escalating over failed implementation of the peace deal and unresolved disputes over disarmament and the TPLF's legal status. Analysts warn the fighting could escalate into a larger conflict without strong international intervention.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/8/1/fighting-breaks-out-in-western-tigray-as-ethiopia-and-tplf-trade-blame?traffic_source=rss", "state_media": false, "category": "経済", "full_text": "Fighting breaks out in western Tigray as Ethiopia and TPLF trade blame\nClashes near Sheraro mark one of the most serious threats yet to the fragile 2022 Pretoria peace deal.\nFighting has broken out in western Tigray, in one of the most serious breaches yet of the three-year-old peace deal between Ethiopia’s federal government and fighters in the northern region.\nTigray’s regional government said in a statement from Mekelle, the Tigrayan capital, that federal forces opened the assault at dawn on Saturday, advancing from the direction of Sheraro, near the Sudanese border.\nRecommended Stories\nlist of 3 items\n- list 1 of 3US government mislabels countries on map of Africa at global conference\n- list 2 of 3Who is driving diplomacy in the Horn of Africa and the Red Sea, and why?\n- list 3 of 3Why is Uganda experiencing a food crisis?\nAbraham Belay, a government minister who led Tigray’s transitional government during the war, confirmed the clashes but accused Tigray People’s Liberation Front (TPLF) chairman Debretsion Gebremichael’s forces of starting them.\n“Enough war! Let us resolve our differences through dialogue,” he said in a post on Facebook.\nThe fighting follows months of deteriorating relations between Addis Ababa and the TPLF, the party that ruled Ethiopia for nearly three decades before Prime Minister Abiy Ahmed came to power in 2018.\nBoth sides have accused each other of failing to implement the provisions of the 2022 peace agreement.\nTigrayan authorities said Ethiopia’s ruling Prosperity Party has waged a long blockade and drone campaign against the region, adding that this had now escalated into full-scale war.\nThe regional government urged Tigrayan forces, civil society and religious institutions to prepare for a struggle it called one of national survival, using the slogan “No to National Destruction”.\nGetachew Reda, a former TPLF spokesman who now advises Abiy, separately urged the Tigray Defence Forces commanders to abandon Debretsion, accusing him of relying on Eritrea and Amhara’s Fano militia to force his way back to power.\nReda and Redwan Hussein, Ethiopia’s intelligence chief, who signed the Pretoria deal for TPLF and the federal government respectively in 2022, co-wrote an Al Jazeera op-ed in June warning that war was imminent.\nKjetil Tronvoll, an Ethiopia specialist at Oslo New University College, told Al Jazeera that the fighting marked the “most serious incident” since the 2022 peace deal. The deal, Tronvoll added, halted the war between the two parties but left “the core reasons of conflict between Mekelle and Addis” unresolved.\nIn the days running up to the armed clashes, Ethiopian state media ran a campaign accusing Debretsion by name of rallying Tigrayans toward war.\nThe fighting caps months of escalating confrontation since the Pretoria Agreement of November 2022, which ended a war that began two years earlier and killed hundreds of thousands, but left unresolved deeper disputes over disarmament and the TPLF’s legal status.\nIn June, the United States imposed visa restrictions on what it said were TPLF “hardliners” accused of blocking peace. The TPLF described it as being based on an “incomplete and imbalanced” picture of the standoff.\nBy mid-July, TPLF had declared the Pretoria agreement “effectively dead”, even as US Ambassador Ervin Massinga travelled to Mekelle to try to preserve the deal.\nFaisal Roble, a regional analyst, told Al Jazeera that the beginning of the fighting was a sign that efforts to resolve the dispute between the parties by the US had not succeeded.\n“Without a powerful international intervention,” he said, “we could be heading to a much larger war.”", "translation_ja": "", "vocab": [{"word": "breach", "definition": "合意や約束などを破ること。ここでは平和協定が守られていない状況を指します。"}, {"word": "deteriorating", "definition": "状況が悪くなること。関係や条件が段々と悪い方向に向かう過程を表現します。"}, {"word": "provisions", "definition": "契約や法律の条項や規定。合意書に含まれた具体的な約束事項を意味します。"}, {"word": "escalated", "definition": "問題や紛争が段階的に大きくなること。小さな対立がより深刻になっていく過程です。"}, {"word": "imminent", "definition": "すぐに起こりそうなこと。近い将来に避けられないことが起きようとしている状態です。"}, {"word": "disarmament", "definition": "武器を放棄し軍備を縮小すること。紛争終結後の平和維持のために重要な取り組みです。"}]}, {"title_ja": "米国大使館がイラン情勢の悪化を受け西アジア地域からの退避を呼びかけ", "title_en": "U.S. Embassies Urge Citizens to Leave West Asia as Tensions Escalate", "summary_ja": "米国の複数の中東大使館が、イランとの緊張が高まる中で米国市民に地域からの退避を検討するよう警告を発しました。トランプ大統領のイランへの新たな攻撃の脅迫と、ホルムズ海峡での無人機攻撃やタンカー攻撃などの最近の軍事衝突の後の警告です。アンマン、エルサレム、バグダッド、ベイルート、マスカットの複数の大使館が市民に対し便の監視と旅行混乱への準備を促しました。", "summary_en": "U.S. embassies across West Asia have warned American citizens to consider departing the region due to escalating tensions between the U.S. and Iran. The warning follows Trump's threats of new strikes on Iran and recent military incidents including drone attacks and tanker strikes in the Strait of Hormuz. Multiple missions in Amman, Jerusalem, Baghdad, Beirut, and Muscat urged citizens to monit
