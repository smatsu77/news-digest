p the climate crisis – offenses such as reckless endangerment, causing or risking catastrophe, and involuntary manslaughter.\nMost states have a reckless endangerment offense. These laws criminalize reckless conduct that creates a substantial risk of injuring another person. Recklessness means knowing something is dangerous – eg predicting your pollution would cause “more violent weather” – and engaging in that conduct anyway. That’s exactly what big oil did, and the resulting climate crisis is now creating a substantial risk of injuring people across the country.\nSome jurisdictions also criminalize conduct that creates a risk of catastrophe, meaning “widespread injury or damage”. Pennsylvania and New Jersey both have these laws on the books, and were two of the states hit hardest by the Fourth of July heatwave, with dozens killed and thousands more hospitalized. Case law shows that these catastrophe laws in particular have been used to prosecute actors for exacerbating a danger by lying about it. In one such case, the operators of a pier in Philadelphia were warned by engineers that the structure was in danger of collapsing. Rather than addressing the problem, they covered it up. When the pier collapsed, the operators were charged with risking catastrophe, and the Pennsylvania supreme court agreed, writing: “After having been made specifically aware of the imminent danger that the pier posed to human life, [they] took affirmative measures to keep that knowledge to themselves and took affirmative steps that exposed others to the risk.” Swap out the word “pier” for “climate change” and that ruling applies perfectly to big oil.\nFinally, there’s involuntary manslaughter – the crime of recklessly causing (or, in many states, substantially contributing to) the death of another person. Clearly, climate-caused deaths are accelerating – a recent analysis found that extreme heat from climate change may have caused more than 20,000 deaths in Europe last month alone. Already, there are victims and survivors who are connecting the dots to big oil. Earlier this month, a Washington state court ruled that a lawsuit against the fossil fuel industry for the wrongful death of the plaintiff’s mother in a climate-induced heatwave will proceed toward discovery and trial. Prosecutors could follow suit and begin charging big oil companies in rela", "translation_ja": "", "vocab": [{"word": "orchestrated", "definition": "計画的に組織・実行した、という意味。複数の要素を調整して意図的に何かを実現させることを指す。企業や団体が戦略的に活動を展開する際に使われる。"}, {"word": "proscribe", "definition": "禁止する、違法とする、という意味。法律や規則で特定の行為を禁じることを指す。prescribeと異なり、否定的な行為を制限する文脈で用いられる。"}, {"word": "reckless", "definition": "無謀な、無分別な、という意味。危険性を認識しながらそれでも危険な行為をすることを指す。法的文脈では過失責任を問う際の重要な要件である。"}, {"word": "exacerbate", "definition": "悪化させる、増悪する、という意味。既に存在する問題や状況をさらに深刻にすることを指す。医学や政治の文脈でもよく使われる。"}, {"word": "jurisdiction", "definition": "管轄権、司法管轄区域、という意味。特定の裁判所や政府が法的権限を持つ地域や範囲を指す。法律がどの地域で適用されるかを示す重要な概念である。"}, {"word": "involuntary", "definition": "非自発的な、意図しない、という意味。自分の意志や選択ではなく、強制されたり不本意に行われることを指す。法的には責任と意思の問題と関連している。"}]}, {"title_ja": "トランプ一族とテイト兄弟の関係は議会の精査を必要とする", "title_en": "Trump Family's Ties to Tate Brothers Demand Congressional Scrutiny", "summary_ja": "ガーディアンのコラムニスト、アルワ・マハダウィは、バロン・トランプが重大な犯罪容疑に直面している有害なインフルエンサー、テイト兄弟との関係について議会で証言すべきだと主張している。彼女は、現在成人したバロンが2024年の選挙戦略に影響を与え、その見返りとしてトランプ政権がルーマニア当局に圧力をかけてテイト兄弟の旅行制限を解除した可能性があると主張している。", "summary_en": "Guardian columnist Arwa Mahdawi argues that Barron Trump should testify before Congress about his alleged connections to the Tate brothers, toxic influencers facing serious criminal charges. She contends that Barron, now an adult, influenced his father's 2024 election strategy by promoting manosphere influencers, and the Trump administration may have helped the Tates in return by intervening with Romanian authorities to lift travel restrictions.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/jul/28/barron-trump-tate-brothers-congress", "state_media": false, "category": "オピニオン", "full_text": "Unlike his garrulous father, Barron Trump seems to be a man of few words. The president’s youngest son has been busy flogging energy drinks and making millions from cryptocurrency schemes, but he’s not big on public speaking. Indeed, the best-known clip of him talking is probably from when he was four years old and said “I like my suitcase” in a Slovenian accent.\nStill, while 20-year-old Barron Trump might prefer to stay behind the scenes, he may find himself hauled in front of Congress and forced to answer some difficult questions. Last week, Yassamin Ansari, a Democratic congresswoman and a member of the House oversight committee, called for Barron to testify about his alleged connections to the toxic influencers Andrew and Tristan Tate. The Tate brothers, who have become household names by monetising misogyny, were recently arrested in Miami, just before Andrew was due to co-host a bare-knuckle boxing event. They’re now fighting extradition to the UK, and face allegations of rape, assault, trafficking and offences relating to “indecent images of a child and extreme pornography”. They deny these charges.\nWhat’s Barron got to do with all this? Over the years, the Trumps and the Tates seem to have forged a mutually beneficial alliance. Donald Trump Jr has been friendly with Andrew since 2016 and, while I wouldn’t go so far as to call Barron and Andrew besties, the New York Times has reported that a teenage Barron admired the influencer and had a Zoom call with him. According to the New Yorker, Barron also spent a lot of time with Justin Waller, who has called himself the Tates’ “third brother”, and gave Barron dating advice. Barron, in turn, gave his dad a political steer: he is widely credited, including by the president himself, for pushing Trump to tap into manosphere influencers such as Tate during the 2024 election in order to mobilise young male voters.\nIn return for their help with the election, the Tates got friends in high places. “The Tates will be free, Trump is the president,” Andrew posted after the inauguration. And that prediction was partly correct: it has been widely reported that the Trump administration intervened in 2025 to get the Romanian government to lift travel restrictions on the Tates, who were under house arrest in the country for trafficking charges. (Romania’s foreign minister has said he did not face any pressure from the US regarding the Tates. The Trump administration has said it had no insight into the matter.)\nWill the Trump administration help the brothers when it comes to this new extradition request? Press secretary Karoline Leavitt has said the White House won’t get involved. Secretary of state Marco Rubio has also dismissed the idea. Whether you should believe this is debatable, but it’s certainly possible the Tates have outlived their usefulness to the ever-transactional Trumps.\nStill, the Trump family can’t sever ties with the Tate brothers that easily. As congresswoman Ansari notes, there are plenty of questions that remain unanswered about the Tate-Trump relationship. In a letter to the House oversight committee chair, Ansari said: “The committee must investigate whether back-channel communications between the Tate brothers, presidential advisors, and members of the First Family such as Barron Trump influenced official actions or administration policy regarding criminal prosecution and investigation of the brothers or international law enforcement cooperation.” The letter specifically recommends a subpoena for Barron to see if he had “any involvement” in relation to the Tate brothers’ alleged crimes. Over the weekend, Ansari reiterated her calls for an investigation on the MeidasTouch podcast, noting that Barron “is a full-blown adult, and he is very influential in the Trump White House orbit”.\nRepublicans have a slight majority in the House, so it’s highly unlikely that Ansari’s request will go anywhere. I don’t need to tell you that we still don’t have real answers about Trump’s ties to Jeffrey Epstein. Nor do I need to tell you that Trump is an adjudicated sexual abuser. This isn’t an administration that takes violence against women seriously. That said, if the Democrats win the House in the midterms, as they are expected to do, the situation might shift and Barron might find himself with some explaining to do.\nAnd if the US government won’t demand answers from Barron, then the media should. As Ansari notes, Barron is very much an adult now. He may not have chosen to be born a Trump but he has chosen to profit from his name and connections. He’s not some little kid who needs protecting. But there are a lot of vulnerable young kids out there who do need protecting from the bigotry and hate that men like the Tates peddle.\nArwa Mahdawi is a Guardian columnist", "translation_ja": "", "vocab": [{"word": "garrulous", "definition": "おしゃべりな、話好きなという意味。頻繁に話す傾向がある人や行動を表す正式な表現。"}, {"word": "monetising", "definition": "金銭的利益を得るために利用するという意味。特に無形資産や人気を商業的に活用する行為を指す。"}, {"word": "manosphere", "definition": "男性支配的なオンラインコミュニティの総称。女性嫌悪的な思想を持つ男性グループを指すインターネット用語。"}, {"word": "transactional", "definition": "取引的な、利益計算に基づくという意味。人間関係が経済的利益によってのみ成り立つ特性を表す。"}, {"word": "extradition", "definition": "犯人引き渡し条約に基づいて、ある国から別の国に被告人を送還する法的プロセス。"}, {"word": "adjudicated", "definition": "法廷で正式に判断・判決されたという意味。法律上確定した状態を表す過去分詞。"}, {"word": "subpoena", "definition": "召喚状、証人喚問命令という意味。法廷での証言やその他の証拠提供を強制する法的文書。"}]}, {"title_ja": "インファンティーノのInstagram大暴露: スポーツ幹部がコンテンツクリエイターになる時代", "title_en": "Infantino's Instagram Rant: When Sports Bosses Think They're Content Creators", "summary_ja": "マリーナ・ハイドはFIFA会長ジャンニ・インファンティーノのワールドカップについての防御的な15ページのInstagram投稿を風刺し、現代の企業指導者が実際の職務よりも個人的なコンテンツ作成と公開の可視性を優先する幅広いトレンドを例示していると主張している。彼女はインファンティーノをイーロン・マスクなどの他の誇大妄想的な投稿者と比較し、現代の指導者はますます自分たちを管理者というより娯楽家・個人ブランドと見なすようになっていると示唆している。", "summary_en": "Marina Hyde satirizes FIFA president Gianni Infantino's defensive 15-page Instagram post about the World Cup, arguing it exemplifies a broader corporate trend where executives prioritize personal content creation and public visibility over actual job duties. She compares Infantino to other megalomaniacal posters like Elon Musk, suggesting modern leaders increasingly see themselves as entertainers and personal brands rather than administrators.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/jul/28/gianni-infantino-world-cup-fifa-instagram", "state_media": false, "category": "オピニオン", "full_text": "I hope you have found time to enjoy Fifa president Gianni Infantino’s 15-page Instagram meltdown about his World Cup. The last time I saw this many defiant words, they were inked on someone sitting cross-legged on the floor of a Salvadoran supermax prison.\nInfantino has been clapping back at his haters – putting them on blast, in the parlance of our times – and on this evidence seems mesmerisingly close to picking out a Chicano script font and getting STILL I RISE needled across his corporate clavicles. Right next to the ones reading THROUGH THE FIRE, UNBREAKABLE and BUILT DIFFERENT.\n“Sorry that the matches are now over and sorry that you missed all that joy and togetherness. Sorry that you were so consumed by hate and criticism that you missed it all,” the Fifa president – reportedly a 56-year-old man – posted yesterday. “To those behind their pens and papers, behind their screens spreading hate and false rumours, I want to say that while you are sitting behind, we at Fifa are on the frontlines organising, working hard, and delivering the best show in the world.” The frontlines of cheating because a fellow presidential shitposter told you to? Hey – it’s a living. Of course, I should say that Infantino denies caving to the repeated interference from Donald Trump over the decision to make the red-carded Folarin Balogun available for the US’s last-16 tie. But I see the top Democrat on the House judiciary committee has launched an investigation into the Fifa president and his ties with the actual president, so ideally Gianni will have the chance to say all this and more in an interview with the committee in due course.\nBut for now, back to his rant. “To those spending their time and energy hating us,” ran a later, time-consumingly energetic section of the Insta-treatise, “please take a moment to reflect, meditate, pray or watch a football match …” Pray? This, takes us firmly into ONLY GOD CAN JUDGE ME territory, with Infantino now presenting as the Tupac of the Switzerland-based sporting governance class.\nA few years ago I would have said that the Fifa president has forgotten one of the golden rules of modern life – that it’s always fine not to post. You could always, quite simply, just not post. And yet, can that really be said to be the case any more? A fascinating report last week by Luminate, the entertainment data analysts, found that 39% of Americans identified as content creators, while Goldman Sachs’s own last look at the subject forecast well over 100 million people globally placing themselves in this class over the next few years.\nPsychically speaking, Infantino seems to be inching ever-closer to the conviction that he invented the product – football – and that his primary job is not administrating it, but being “out there” on his public channels, forever outlining his philosophy, or stoking geopolitical online beef, or embodying it all in some ineffable, excruciating-to-watch sort of way. In this he shares a kinship with posting megalodons like Elon Musk, as well as tireless minnows like the take-me-back founder of BrewDog, James Watt.\nYet the tendency is reflected all the way down the levels of bosses. These days, founders of companies, whom Infantino would no doubt see as his peer group, report being expected to constantly document their thinking publicly and stay permanently visible to attract customers and investors. What was once an optional marketing activity is now a core part of the job, which, for significant chunks of the day, takes them away from such devalued tasks as building the product or running the company. They have discovered, if only subconsciously, that their actual job is posting – that they have to be an always-on personal content creator.\nIn a way football was ahead on all this, as were various other sports. The game’s owners and exploiters have long seen the matches themselves as mere 90-minute sections of legacy content, which would be far better relegated to the second, third or even fourth tier behind such always-on output as branded content, shareable clips, behind-the-scenes footage, lifestyle and commerce.\nAnd, of course, viral moments, which is presumably what Infantino was going for with his 15-page algorithm frotting. Here is the promoter as creator – a vibe also embodied by, say, Ultimate Fighting Championships’s Dana White. In fact, in retrospect, Infantino’s main character glow-up been under way for some time. In a mad, hour-long soliloquy ahead of the previous World Cup in Qatar, Infantino addressed the world: “You want to criticise someone, come to me. Criticise me. Here I am. Crucify me,” he went on, standing to extend his arms out wide. “Don’t criticise Qatar. Don’t criticise the players. Don’t criticise anyone. Criticise Fifa. Criticise me, if you want. Because I’m responsible for everything.” Fifa itself has long been a supranational body, a travelling parasitic nation-state. But under Infantino, the situation has seemingly evolved into Infantino himself be", "translation_ja": "", "vocab": [{"word": "meltdown", "definition": "感情的な崩壊や激怒の発作。ここではインファンティーノの防御的で怒りっぽいSNS投稿を指す。"}, {"word": "supranational", "definition": "国家を超えた、複数の国家を統合する組織や権力のこと。国連やFIFAのような機関を形容する。"}, {"word": "parasitic", "definition": "寄生的な、他者に依存して利益を得る性質。ここではFIFAが各国から搾取するという批評。"}, {"word": "megalomaniac", "definition": "自分の重要性や力を過度に信じる人。誇大妄想的で自己中心的な指導者を指す。"}, {"word": "algorithm frotting", "definition": "SNSアルゴリズムを意識した露骨なコンテンツ投稿行為。バイラル効果を狙った不適切な投稿。"}, {"word": "soliloquy", "definition": "独白、自分一人で話し続けること。ここではインファンティーノの長時間の一方的な演説を指す。"}]}, {"title_ja": "イランの体制転換への隠れた道", "title_en": "The Hidden Path to Regime Change in Iran", "summary_ja": "著者は、米国とイランの軍事的激化にもかかわらず、イラン体制は生き残る可能性が高く、外交的解決はイラン民主主義の見通しを実際に改善するだろうと主張しています。経済制裁と軍事攻撃は体制を強化し社会を弱体化させるという米国政策の仮定に反して、政治的動員は不可能になります。これらの圧力を取り除くことで、政府の失敗と腐敗が国民に露呈されるでしょう。", "summary_en": "The author argues that despite military escalation between the U.S. and Iran, the regime will likely survive and a diplomatic resolution would actually improve prospects for Iranian democracy. Contrary to U.S. policy assumptions, economic sanctions and military strikes strengthen the regime and weaken society, making political mobilization impossible; lifting these pressures would expose the government's failures and corruption to its population.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/iran/hidden-path-regime-change-iran", "state_media": false, "category": "オピニオン", "full_text": "With the prospects for diplomacy between the United States and Iran uncertain, it may seem premature to contemplate the postwar future. After all, following the June 17 memorandum of understanding, the war between the two sides escalated again, leaving the document in tatters. Both sides began launching major strikes, and Iranian President Masoud Pezeshkian said that Iran was once again in a “full-scale war.” On July 27, after a two-week bombing campaign, the Trump administration announced a cease-fire and Iran responded in kind, but a resumption of military hostilities remained high.\nBut regardless of the course of fighting, the endgame is unlikely to change. According to a new intelligence assessment reported in The Washington Post, Iran is “unlikely to feel significant impact or soften its negotiating position as a result of new rounds of U.S. military strikes.” An unavoidable reality thus confronts the United States and its allies: that they will not topple the Islamic Republic.\nGiven that the regime will very likely survive the war, the urgent question is what a grand bargain to end the conflict will mean for the future of Iranian politics. A commonly held view is that reaching a new deal will simply entrench the existing hard-line leadership. But this overlooks important dynamics at play inside the country. In fact, a deal would significantly increase the prospects for democracy in Iran. These effects would not be seen immediately or felt in the short term, but under the right circumstances they are likely to appear in the near future. The crucial question, then, becomes how best to set the postwar conditions under which democratic forces have more, rather than less, potential to grow.\nFLAWS OF WAR\nIt is clear that a diplomatic conclusion of the war with Iran, should it happen, will involve some kind of grand bargain. The broad contours of such a deal will likely approximate the terms outlined in the June memorandum. Of course, getting a deal that sticks will not be easy, and key parts of it will likely be deferred to future negotiations. Low-level hostilities may continue for some time to come. This time around, once a cease-fire is reached, it will be essential to institute a deconfliction mechanism to prevent further rounds of escalation and a return to war.\nBut the deal will have some provisions that take effect immediately, and so it will affect Iranian politics—and in an overall positive direction. More generally, democratization in Iran is fundamentally incompatible with crippling sanctions and war. The expansion of poverty and economic misery fueled by Western sanctions and the bombing of civilian infrastructure during the war have served to strengthen the state while weakening society. Put simply, it is impossible to mobilize for political change while people are starving and bombs are falling. The idea that impoverishing Iran economically and punishing it militarily will produce a popular uprising was always a fanciful notion. The war has proved that point.\nThe Islamic Republic faces a crisis of legitimacy. Although the war has produced a surge of nationalism and temporarily reaffirmed the leadership’s legitimacy, the core grievances that produced deep discontent and massive public protests in January remain. This is especially true of Iran’s very large urban youth population. A future Iran that no longer faces war or the threat of war and for which economic misery can no longer be blamed on foreign sanctions will inevitably bring into focus the regime’s accountability for the country’s ills, its extreme disconnect from the will of the people, and its pervasive corruption.\nIt is impossible to mobilize for political change while people are starving and bombs are falling.\nThis analysis may come as a surprise for U.S. policymakers, who have long argued that economic strangulation backed by military pressure will create a democratic opening. Much of this misunderstanding reflects the official war rationales offered by Israel and the United States. Both governments have paid lip service to the idea that military intervention can produce regime change. During the 12-day war in June 2025, Israeli Prime Minister Benjamin Netanyahu told the Iranian people that Israel was “clearing the path for you to achieve your freedom.” In January, when the country was engulfed in protests, Trump encouraged Iranians to “keep protesting, take over your institutions” and assured them that “help is on the way.” After the 2026 war began, Netanyahu wrote, “We are waging a historic war for liberty,” and Trump told Iranians as the bombs began to fall that “the hour of your freedom is at hand.”\nBut the ferocious bombing campaign has had the opposite effect. The regime has survived the assassination of its Supreme Leader Ali Khamenei and many other senior political and military officials. It has also consolidated power internally, weathered an expanding economic crisis, and, by shutting down the Strait of Hormuz, fought Is", "translation_ja": "", "vocab": [{"word": "entrench", "definition": "強固にする、根付かせる。既存の権力や立場をさらに固くして、変化に対して強い抵抗を生じさせることを意味します。"}, {"word": "deconfliction", "definition": "紛争回避メカニズム。異なる勢力や軍事行動が相互に干渉しないよう調整する手段を指します。"}, {"word": "crippling", "definition": "機能を失わせるほどの障害を与える。経済制裁や軍事攻撃が国家の機能を著しく損なうことを表現します。"}, {"word": "legitimacy", "definition": "正当性、統治の正当な根拠。政府が国民に支持される権利を持つかどうかを示す概念です。"}, {"word": "mobilize", "definition": "組織化する、動員する。社会的または政治的な行動のために人々を組織し活動させることを意味します。"}, {"word": "fanciful", "definition": "現実性に欠ける、根拠のない想像。実現の可能性が低い理想的または非現実的な考えを指します。"}]}, {"title_ja": "再生可能エネルギーはアフリカを工業化できるか？", "title_en": "Can Renewables Industrialize Africa?", "summary_ja": "著者は、化石燃料価格の変動と太陽光・風力技術のコスト削減によって駆動されるアフリカの再生可能エネルギーへのシフトが、工業化のための重要な機会を提示していると主張する。中国は大規模なインフラ投資を通じてアフリカの主要なクリーンエネルギーパートナーとしての地位を戦略的に確立しており、一方米国はアフリカ諸国の再生可能エネルギー優先政策に合わせるのではなく化石燃料を推進し続けることで地政学的影響力と経済機会を失うリスクがある。", "summary_en": "The author argues that Africa's shift toward renewable energy, driven by fossil fuel price volatility and cost reductions in solar and wind technology, presents a critical opportunity for industrialization. China is strategically positioning itself as Africa's primary clean energy partner through massive infrastructure investments, while the U.S. risks losing geopolitical influence and economic opportunities by continuing to promote fossil fuels instead of aligning with African nations' renewable energy priorities.", "source": "Foreign Affairs", "tier": "opinion", "link": "https://www.foreignaffairs.com/africa/can-renewables-industrialize-africa", "state_media": false, "category": "オピニオン", "full_text": "The war on Iran, launched in late February by the United States and Israel, is doing more than rattling oil markets. It is accelerating a determination among African countries to reduce their dependence on imported fossil fuels and to turn toward renewable power. Africa has extraordinary solar, wind, and geothermal resources, but until the early 2010s, much of this potential had gone untapped. Most African states had long generated electricity from fossil fuels and hydropower, because these technologies were already well established, whereas solar and wind were the new, expensive kids on the block.\nThat calculus began to change around 2022, when Russia’s invasion of Ukraine exposed the vulnerability of fossil fuel dependence. In sub-Saharan Africa, the cost of imported diesel and other fuels surged, with import bills rising by more than 35 percent in many countries over the course of a year, squeezing public finances and raising electricity bills for homes and businesses. The recent instability across the Middle East is only reinforcing that sense of vulnerability. And so African countries are now leaning toward the “electro-state” development model advanced by China, in which abundant, low-cost electricity from renewables underpins industrialization and economic growth. China is electrifying Africa through large-scale investment in renewable power generation, building electricity transmission and distribution infrastructure, and making electrified transport more accessible by financing electric-vehicle assembly lines, battery-swapping networks, and charging infrastructure.\nAfrica is now at the center of the world’s clean energy push, no longer at its periphery. And by embedding itself deeply into Africa’s energy infrastructure, China is positioning itself as a long-term strategic partner for industrializing the world’s youngest and fastest-growing continent. The United States under President Donald Trump, however, simply appears not to understand the appeal of renewables on the continent. (For instance, Washington has approved a $4.7 billion U.S. export-import bank loan to try to revive a liquefied natural gas project in Mozambique.) The truth is that infrastructure creates path dependence: countries tend to build future systems around the technologies, financing structures, and supply chains they already have.\nIf the United States cedes a role in Africa’s clean energy transition to China, it risks losing more than commercial opportunities. Beijing would deepen its diplomatic influence both in Africa and worldwide, shape the standards and supply chains underpinning the global energy transition, and strengthen its access to critical minerals essential for low-carbon technologies. And many African governments now prioritizing renewable energy are likely to view external partners that continue to emphasize fossil-fuel investments with growing skepticism. Rather than pushing hydrocarbons, the United States should partner with African countries on clean energy in ways that align with those countries’ development priorities. Doing so would not only expand Africa’s access to reliable and affordable energy; it would shore up American economic and geopolitical interests.\nHERE COMES THE SUN\nNearly 600 million people in sub-Saharan Africa still lack access to electricity in their homes, roughly 80 percent of the world’s unelectrified population. Throughout much of the twentieth century, electrification relied on large, centralized fossil fuel and hydropower plants designed to serve cities, mines, and industry. Dispersed rural populations remained beyond the reach of these expensive transmission networks, leaving the continent with the world’s largest electricity access gap despite decades of investments in infrastructure.\nBut over the past 15 years, Africa’s energy transition began to accelerate as renewable sources became far cheaper. In 2024 alone, the International Energy Agency (IEA) estimated that Africa would attract around $110 billion in total energy investments, of which nearly $40 billion would go to clean energy, almost double the proportion of the total directed toward renewables in 2020.\nThe driver of this pivot is economic. Worldwide, solar costs have fallen by roughly 90 percent since 2010, while battery prices have dropped by 93 hat it can provide is the only check that these states have against Chinese dominance. They are willing to take unequal deals from Washington because they know that taking orders from Beijing is far worse. Countries in western Europe, by contrast, have been outwardly disdainful of American power and culture, unwilling to recognize that many of the changes in Washington are the product of shifting structural realities rather than the president’s whim. It no longer makes sense for the United States to allow western Europe’s outsize role in defining the rules and norms of the global order because rising powers such as China are exploiting these rules and norms at the United States’ expense.\nThe divergence in attitudes between Asia and Europe has shaped the two continents’ respective abilities to handle Trump and the world he has wrought. Major allies in western Europe—especially Belgium, France, Germany, Italy, the Netherlands, Portugal, and Spain—were caught flat-footed when the United States turned away from a selfless and benign internationalism. Washington’s Asian allies, in contrast, were ready. Asian governments are looking at the world as it is, whereas western European ones still see the world as it once was—or how they wish it were. In a world increasingly shaped by Chinese power, the willingness of U.S. allies in Asia to deal with Washington is likely to make them stronger and more secure than European powers will be.\nTOO CLOSE TO COMFORT\nSince the collapse of the Soviet Union and the end of the Cold War, western Europe has enjoyed a peace dividend. Countries in this region have acted as though they do not have any serious security or existential threats. Even after Russian President Vladimir Putin embarked on his westward expansion, beginning with the annexation of Crimea from Ukraine, in 2014, major powers in western Europe were reluctant to invest in their own security. From 2014 to 2019, according to data collected by the Stockholm International Peace Research Institute, defense spending as a share of GDP in the four largest military spenders in continental western Europe—Germany, France, Italy, and Spain—remained largely stagnant. Spending grew slowly after 2019; only after the 2022 Russian invasion of Ukraine did these countries start to seriously address the need to build up their defenses.\nInstead of investing in their militaries, western European countries have prioritized their vast welfare states. They spend more than many other countries on programs such as pensions, health care, unemployment benefits, and disability payments. In 2024, according to estimates from the Organization for Economic Cooperation and Development, Germany, France, Italy, and Spain spent 27.9 percent, 30.6 percent, 27.6 percent, and 25.9 percent of GDP, respectively, on public social spending. The average among members of the OECD, which includes 38 high- and middle-income countries committed to democracy and free markets, was 21.2 percent of GDP. If leading western European powers are to meet their defense commitments—Germany plans to spend 3.5 percent of its GDP on defense by 2029—they will need to reduce their social spending. But there is no clear evidence yet that they are planning to do so.\nWestern European countries have been able to prioritize welfare over security because they are insulated from direct threats. They are shielded by the territorial buffer of eastern Europe and ", "translation_ja": "", "vocab": [{"word": "transactionalism", "definition": "取引主義。相互利益に基づく具体的な取引や契約を重視し、感情的な関係や歴史的な結びつきを軽視する政治姿勢を意味する。"}, {"word": "unilateralism", "definition": "一国主義。国際協調よりも一国の利益を優先し、他国の同意を得ずに独自に行動する外交政策のこと。"}, {"word": "preeminence", "definition": "優位、卓越。特定の分野や地域において他者より優れた地位や支配力を持つことを意味する。"}, {"word": "disdainful", "definition": "軽蔑的な。他者や対象を見下し、尊重しない態度を示すことを表す形容詞。"}, {"word": "stagnant", "definition": "停滞した。成長や進展がなく、同じ水準に留まっている状態を示す。経済や発展の文脈で頻出。"}, {"word": "existential threat", "definition": "存在的脅威。国家や組織の存続そのものを危険にさらす根本的な脅威を意味す let curCat = "全て";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildFocusHtml(){
  if(!FOCUS)return"";
  const cards=FOCUS.coverages.map(c=>{
    const sc=c.state_media?" state-media":"";
    const sb=c.state_media?` <span style="color:var(--danger);font-size:.65rem">[国営]</span>`:"";
    return `<div class="cov-card${sc}"><div class="cov-header"><span class="cov-region">${esc(c.region)}</span><span class="cov-name">${esc(c.name)}${sb}</span></div><div class="cov-summary">${esc(c.summary_ja)}</div><div class="cov-perspective">${esc(c.perspective_ja)}</div><a class="cov-link" href="${esc(c.link)}" target="_blank" rel="noopener">元記事 →</a></div>`;
  }).join("");
  return `<div class="focus-section"><div class="focus-label">&#127919; 今日の焦点 — 5社の報道比較</div><div class="focus-topic">${esc(FOCUS.topic_ja)}</div><div class="focus-analysis">${esc(FOCUS.analysis_ja)}</div><div class="cov-list">${cards}</div></div>`;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=CATS.map(c=>`<button class="tab${c===curCat?" active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function filteredArts(){
  return curCat==="全て"?DATA:DATA.filter(a=>a.category===curCat);
}

function renderList(){
  const arts=filteredArts();
  const el=document.getElementById("list-view");
  let html=(curCat==="政治"||curCat==="社会")?buildFocusHtml():"";
  if(!arts.length){el.innerHTML=html+'<p style="padding:1rem;color:var(--muted)">記事なし</p>';return;}
  html+=arts.map((a,i)=>{
    const sm=a.state_media;
    return `<div class="art-item${sm?" state":""}" onclick="showDetail(${i})">
      <span class="bullet${sm?" st":""}">${sm?"[!]":"•"}</span>
      <span class="art-hed">${esc(a.title_ja)}</span>
      <span class="art-src">${esc(a.source)}</span>
    </div>`;
  }).join("");
  el.innerHTML=html;
}

function setCat(cat){
  curCat=cat;
  history.pushState({view:"list",cat:cat},"","?tab="+encodeURIComponent(cat));
  renderTabs();renderList();
  document.getElementById("list-view").style.display="block";
  document.getElementById("detail-view").style.display="none";
  window.scrollTo(0,0);
}

function showDetailInternal(idx){
  const a=filteredArts()[idx];
  if(!a)return;
  document.getElementById("d-link").href=a.link;
  document.getElementById("d-state").style.display=a.state_media?"block":"none";
  document.getElementById("d-title-ja").textContent=a.title_ja;
  document.getElementById("d-summ-ja").textContent=a.summary_ja;
  document.getElementById("d-title-en").textContent=a.title_en;
  document.getElementById("d-summ-en").textContent=a.summary_en;
  const fts=document.getElementById("d-fulltext-section");
  if(a.full_text){
    document.getElementById("d-fulltext-en").textContent=a.full_text;
    fts.style.display="block";
  }else{fts.style.display="none";}
  const vs=document.getElementById("d-vocab-section");
  if(a.vocab&&a.vocab.length){
    document.getElementById("d-vocab-list").innerHTML=a.vocab.map(v=>
      `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`
    ).join("");
    vs.style.display="block";
  }else{vs.style.display="none";}
  document.getElementById("d-source").textContent=a.source+" / "+a.tier;
  document.getElementById("list-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  window.scrollTo(0,0);
}

function showDetail(idx){
  history.pushState({view:"detail",cat:curCat,idx:idx},"","?tab="+encodeURIComponent(curCat)+"&art="+idx);
  showDetailInternal(idx);
}

function backToList(){history.back();}

window.addEventListener("popstate",function(e){
  const s=e.state||{view:"list",cat:"全て"};
  curCat=s.cat||"全て";
  renderTabs();
  if(s.view==="detail"){
    showDetailInternal(s.idx);
  }else{
    renderList();
    document.getElementById("list-view").style.display="block";
    document.getElementById("detail-view").style.display="none";
    window.scrollTo(0,0);
  }
});

function shareUrl(){
  const url=location.href;
  if(navigator.share){navigator.share({title:"Morning Read",url:url});}
  else{navigator.clipboard.writeText(url).then(()=>alert("URLをコピーしました")).catch(()=>prompt("このURLをコピーしてください:",url));}
}

(function init(){
  const p=new URLSearchParams(location.search);
  const tab=p.get("tab")||"全て";
  curCat=tab;
  history.replaceState({view:"list",cat:tab},"",location.href);
  document.getElementById("footer").textContent="Generated 2026-07-28 21:54 JST";
  renderTabs();renderList();
})();
</script>
