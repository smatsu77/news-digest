 Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/trump-and-netanyahu-meet-for-the-first-time-since-launching-the-iran-war/article71278622.ece", "state_media": false, "category": "政治", "full_text": "Israeli Prime Minister Benjamin Netanyahu and U.S. President Donald Trump met at the White House on Tuesday (July 28, 2026) for the first time since they launched a joint war against Iran, offering a chance for Netanyahu to smooth out strains in their relationship.\nThe closed-door meeting lasted nearly an hour and a half and was “positive and productive,\" according to White House press secretary Karoline Leavitt. The White House and the Prime Minister's office did not immediately offer more details.\nIt comes as both face growing pressures at home. Mr. Netanyahu is up for re-election and is embattled in part because of his deteriorating relationship with Mr. Trump. Mr. Trump is under pressure to end an unpopular war that has wreaked economic havoc and driven prices higher ahead of midterm elections this November.\nMr. Trump revealed some tension with Mr. Netanyahu ahead of their meeting, complaining about reports that the Israeli leader plans to discuss intelligence on Iranian activities at Pickaxe Mountain, a potential nuclear site that the U.S. President has threatened repeatedly to bomb.\n“I know exactly what's going on at Pickaxe,” Mr. Trump told “Fox & Friends.” He insisted that whatever Iran is doing is “not a big problem” and that “Bibi's telling me that because he wants me to stay involved.”\n“Why do you have to announce to the world?” Mr. Trump added, flashing his frustrations with his ally.\nNear the White House where the public was able to gather near fencing, a small group of protesters chanted, “Netanyahu, you're a tyrant” and “Bibi, you're not welcome here,” referencing the Prime Minister's nickname.\nThe two leaders also planned to discuss the framework agreement the U.S. and Israel signed with Lebanon over the Israel-Hezbollah war and the expansion of the Abraham Accords, according to a White House official, who spoke on condition of anonymity to preview the meeting.\n“We have a little difference,” Mr. Trump said Monday (July 27, 2026) when asked by reporters if he and Netanyahu were on the same page on Iran. “But pretty close, yeah.”\nTrump and Netanyahu's relationship has ebbed before\nMr. Trump has had a hot-and-cold history with Mr. Netanyahu over the years, but upon his return to the White House last year, their alliance seemed stronger than ever. When they started the war together in February, it was with a united front, touting their respective militaries as acting in lockstep to take out Iran's leadership and pave the way for a government more friendly to the West.\nBut as Iran fought back — sending drones and missiles slamming into Uy.S. bases and high-rises in cities in the Gulf, and choking off the Strait of Hormuz — Mr. Trump came under immense pressure both at home and by allies in the region to end the conflict.\nSince then, Mr. Netanyahu, who wanted to continue the fighting in Iran and against its ally, Hezbollah, in Lebanon, has been sidelined as Mr. Trump sought a deal with Tehran. His visit to the White House this week comes as the disagreements with Mr. Trump and Vice-President J.D. Vance have burst into the open over the war in Iran and more.\n“The Americans are making it clear to the Israelis they are the ones who are running the war,” Israeli journalist and political analyst Amit Segal wrote Monday (July 27, 2026) in the daily newspaper, Israel Hayom. “It is clear to everyone that Israel has been put in the back seat.”\nNetanyahu keeping focus on Iran's nuclear programme\nWith U.S.-Iran tensions flaring again in recent weeks, Mr. Netanyahu planned to share with Mr. Trump Israeli intelligence on Tehran's nuclear program, according to a person familiar with Mr. Netanyahu's visit, who spoke on the condition of anonymity because they were not authorised to speak to the media.\nIsrael's United Nations Ambassador Danny Danon told reporters in New York on Tuesday (July 28, 2026) that Mr. Netanyahu wants to hear what Mr. Trump would like to see over the coming days and weeks.\n“I cannot tell you which direction it will go. There are different options,” he said. “We are prepared for all scenarios, and we will discuss it with the president.” Mr. Netanyahu said Sunday (July 26, 2026) that he hoped to sit down with Mr. Trump “to hear what he has in mind” for Iran.\n“Because I think, in many ways, it's his decision” on how to move forward, Mr. Netanyahu told Maria Bartiromo on Fox News Channel's “Sunday Morning Futures.” “If he can do so without returning to intense military fighting, that's fine. Why not? \"But one way or the other, they have to end their nuclear program,” he said of Iran.\nSteps to allow other forces in Gaza and in Lebanon\nBut even as Mr. Netanyahu sees an opportunity, he also needs to persuade Mr. Trump that he won't play spoiler to U.S. diplomatic and reconstruction efforts in Gaza and in Lebanon, where the President has previously complained that “too many people are being killed” by Israeli strikes.\nIsrael has taken recent steps in both places.\nIn Lebanon, where the Israeli mili", "translation_ja": "", "vocab": [{"word": "embattled", "definition": "困難な状況にある、四面楚歌の状態。政治的または社会的な批判や問題に直面している人や組織を表す。"}, {"word": "ebbed", "definition": "減少する、衰える。潮が引くという意味から派生し、関係や影響力などが徐々に弱まることを表す。"}, {"word": "pave the way", "definition": "道を整える、条件を整える。何かが起こりやすいようにするための準備や基礎作りを意味する。"}, {"word": "sidelined", "definition": "脇に追いやられた、重要性を失った。本来の役割や影響力から外されることを表す。"}, {"word": "spoiler", "definition": "台無しにする者、邪魔する者。計画や努力を妨害または失敗させる可能性のある人や行動。"}]}, {"title_ja": "インドがネパール首相バレンドラ・シャーを正式に招待", "title_en": "India Formally Invites Nepal PM Balendra Shah for New Delhi Visit", "summary_ja": "インド外務省は火曜日、ネパール首相バレンドラ・シャーをニューデリー訪問に正式に招待したことを確認した。この招待は7月初旬にシャーの顧問とインドの国家安全保障顧問との予備的な協議の後に続き、シャーの政党が3月の選挙で圧勝した後のものである。シャーは当初、国内の優先事項に焦点を当てていたにもかかわらず、この訪問は両隣国間の重要な外交的関与を表している。", "summary_en": "India's Ministry of External Affairs confirmed on Tuesday that it has formally invited Nepal's Prime Minister Balendra Shah to visit New Delhi through proper diplomatic channels. The invitation follows preliminary discussions between Shah's advisor and India's National Security Advisor in early July, and comes after Shah's Rastriya Swatantra Party swept elections in March. Despite Shah's initial focus on domestic priorities, the visit represents a significant diplomatic engagement between the two neighboring nations.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/national/india-has-sent-formal-invite-to-nepal-pm-balendra-shah-mea/article71277419.ece", "state_media": false, "category": "政治", "full_text": "India has ‘formally’ invited Nepal’s new Prime Minister Balendra Shah to visit New Delhi, the Ministry of External Affairs said on Tuesday (July 28, 2026).\nThis official confirmation comes days after sections of the Nepali media reported that Mr. Shah’s advisor Kumar Ben visited New Delhi in early July and discussed the Nepali PM’s visit with National Security Advisor Ajit Doval.\nPrime Minister Narendra Modi had congratulated the newly elected PM of Nepal on social media soon after Mr. Shah swept the polls in March. In his message, Mr. Modi had said, “Your appointment reflects the trust reposed in your leadership by the people of Nepal. I look forward to working closely with you to take India-Nepal friendship and cooperation to even greater heights for the mutual benefit of our two peoples.”\n“We have invited Nepal Prime Minister Balendra Shah formally,” MEA spokesperson Randhir Jaiswal said, in response to a question from The Hindu on Tuesday (July 28, 2026). Officials said that Mr. Modi’s remark was the beginning of the process and the formal invitation was subsequently sent to Mr. Shah through proper diplomatic channels.\nEvolving relationship\nFollowing the victory of Mr. Shah’s Rastriya Swatantra Party, there were reports that Foreign Secretary Vikram Misri was expected to visit Kathmandu in May but the visit did not take place as Mr. Shah had declined to engage with visiting high level foreign bureaucrats, insisting that he would meet his political counterparts in other countries.\nThe first high-profile visit was by Nepal’s Foreign Minister Sisir Khanal on June 6 and 7. Mr. Khanal had been scheduled to attend the Big Cat Alliance meeting planned to be held in Delhi on the sidelines of the India-Africa Forum Summit. After that meeting was postponed due to an Ebola virus outbreak in Africa, however, Mr. Khanal stayed for a bilateral visit. India also hosted Rabi Lamichhane, chairman of the ruling Rastriya Swatantra Party, in the first week of June.\nReports from Kathmandu had earlier suggested that Mr. Shah had taken a vow not to visit foreign destinations after coming to power, saying his focus would be limited to domestic priorities in the initial phase of his government’s tenure.\nwoAt the same time, however, he raised the Kalapani-Lipulekh-Limpiyadhura territorial dispute with India in a statement in the Nepali parliament, saying that Nepal is in talks with the United Kingdom regarding the historical documents necessary to research the dispute. He also sought talks with China on that issue.\nPublished - July 28, 2026 11:26 pm IST", "translation_ja": "", "vocab": [{"word": "diplomatic channels", "definition": "公式な外交ルートや関係機関を通じた公式なコミュニケーション経路。国家間の正式な取引や協議に使用される。"}, {"word": "counterparts", "definition": "同じ職務や地位にある相手国の人物を指す。例えば、ある国の大臣と別の国の大臣は相互の職務上の相手方である。"}, {"word": "bilateral", "definition": "2国間の、または2者間の関係や協定を意味する。国家間の相互関係や取引に関する正式な用語。"}, {"word": "territorial dispute", "definition": "領土の所有権や境界線について対立する2つ以上の国家間の紛争。国際法で解決される法的な問題。"}, {"word": "tenure", "definition": "職務や地位を保持している期間を指す。政治的な権力を保有している期間や政権期間を表す。"}, {"word": "high-profile", "definition": "公に広く知られている、または重要性や注目度が高い人物や事象のこと。メディアの関心が高い。"}]}, {"title_ja": "オマーンがイランにホルムズ海峡使用料の任意徴収計画を提示", "title_en": "Oman presents Iran with Gulf-backed plan for voluntary fees to use Hormuz Strait", "summary_ja": "オマーンはペルシャ湾岸諸国の支持を受け、ホルムズ海峡の通航に対する任意の使用料徴収を通じて同海峡を管理するための計画をイランに提示した。トランプ大統領は爆撃キャンペーンを一時停止し、交渉が失敗すれば再開すると警告した。同提案はマラッカ海峡の任意拠出制度に類似しており、自由通航を求めるワシントンとの対立を浮き彫りにしている。", "summary_en": "Oman has presented Iran with a Gulf-state-backed proposal to manage the Strait of Hormuz through voluntary fees for ships using the waterway, potentially resolving trade disruptions from the U.S.-Israeli conflict with Iran. President Trump suspended a bombing campaign and warned of renewed strikes if negotiations fail, while oil prices fell sharply following the ceasefire announcement. The proposal mirrors the voluntary contribution system used in the Strait of Malacca, contrasting with Washington's preference for free passage.", "source": "The Hindu", "tier": "paper", "link": "https://www.thehindu.com/news/international/oman-presents-iran-with-gulf-backed-plan-for-voluntary-fees-to-use-hormuz/article71278494.ece", "state_media": false, "category": "社会", "full_text": "Oman has presented Iran with a plan backed by Gulf states to manage the Strait of Hormuz, including collecting voluntary fees for using it, a Gulf source and a Western diplomat told Reuters on Tuesday (July 28, 2026). The plan could serve as a basis to end the disruption to trade through the strait caused by the U.S.-Israeli war on Iran.\nAlso read | Iran says deal to end West Asia war ‘declaration of U.S. defeat’\nPresident Donald Trump, who abruptly called off a two-week U.S. bombing campaign over the weekend in his latest strategic U-turn, said there were \"good talks\" under way with Iran but threatened to restart strikes unless negotiations deliver. Iran denies seeking to resume talks with the United States. Washington launched its renewed bombing campaign earlier this month to break Iran's grip on the strait, through which about a fifth of global oil and liquefied natural gas flowed before the war.\nIran effectively shut the strait to ships other than its own after the United States and Israel attacked on February 28. A deal last month between the United States and Iran partially reopened it, but the agreement collapsed in early July after Iran fired on ships using a channel it does not approve.\nIran has said it wants to manage the strait alongside Oman, which controls the opposite shore, and charge service fees to ships that use it. Washington wants to return to the status quo before the war, when ships were able to pass freely with no payments, and says charging mandatory fees would be illegal. Under the Omani proposal, Iran would not exercise sole control and fees would be voluntary, the Gulf source and Western diplomat briefed on the matter told Reuters.\nThe system would be analogous to one in place on Asia's Strait of Malacca, where Indonesia, Malaysia and Singapore ask ships to pay voluntary contributions to fund navigation, environmental protection and search-and-rescue operations.\nThe Western diplomat compared it to a voluntary carbon tax for flights, where anyone buying a plane ticket can choose to tick a box if they want to pay to offset their emissions.\nThe Gulf source said that as of Monday (July 27) evening there had been no formal response from Iran to the proposal. Omani officials met Iranians in Tehran over the weekend.\nIran's Foreign Minister Abbas Araqchi discussed the Strait of Hormuz with his Omani and Saudi counterparts on Monday (July 27) and stressed the need for regional cooperation, an Iranian Foreign Ministry statement said.\nTRUMP WARNS OF MORE STRIKES\nMr. Trump called off his latest campaign of air strikes after receiving advice from military commanders that the strategy had run its course. The 13 nights of renewed U.S. bombing killed scores in Iran and destroyed bridges and tunnels across the south as well as military targets.\nIran had responded with attacks on U.S. bases in neighbouring countries that killed four service members, and strikes on civil infrastructure in Gulf states that it said were in response to U.S. strikes on civilian targets.\nIran has said it would hold fire as long as Washington does. But drone attacks were reported in Jordan, Saudi Arabia and northern Iran on Monday (July 27), and Jordan reported another drone being downed on Tuesday.\nSpeaking on Monday (July 27), Mr. Trump expressed optimism for a deal to end the five-month conflict, while warning that U.S. strikes would resume if negotiations failed to deliver.\n\"I think there's a good chance that something could happen, and if it does, good, if it doesn't, we go back to doing what we were doing two days ago.\"\nIran says it has not sought any new negotiations with the United States, which it accuses of violating the agreement reached last month on a framework for talks to end the war. The U.S. President is scheduled to meet Israeli Prime Minister Benjamin Netanyahu in Washington on Tuesday (July 28). Although Israel was involved in the initial bombing campaign, it has not been part of subsequent peace talks, and recent relations between the two leaders have been strained.\nMr. Trump has had to rein in the Israeli leader from attacking targets in Lebanon to try to weaken Iran-backed Hezbollah militants, complicating peace talks with Tehran.\nThe end of the U.S. bombing campaign over the weekend sent oil prices tumbling by around 8% on Monday, and the fall continued on Tuesday. Brent crude futures were down more than 2.5% at around $86 a barrel by mid-morning on Tuesday.\nWashington and Tehran reached an agreement in June on a framework for talks meant to take place by the end of August to resolve major issues such as Iran's nuclear programme. But they have disputed the meaning of the memorandum's language about the strait, with Washington insisting it requires Tehran to allow free travel, while Iran says it grants it the authority to supervise transit.\nPublished - July 28, 2026 11:12 pm IST", "translation_ja": "", "vocab": [{"word": "disruption", "definition": "事業や活動の中断または妨害。ここでは米国とイランの紛争によるホルムズ海峡を通じた貿易の混乱を指す。"}, {"word": "analogous", "definition": "別の状況に類似した、または相当するものであること。マラッカ海峡の制度と比較される場合に使用される。"}, {"word": "voluntary", "definition": "強制ではなく、自発的または任意の選択に基づくこと。強制的な料金ではなく、船舶が支払いを選択できることを示す。"}, {"word": "status quo", "definition": "現在の状態または現状を維持すること。ワシントンが戦前の海峡の自由通航状態に戻すことを望んでいることを指す。"}, {"word": "strains", "definition": "関係や状況における緊張または困難。トランプとネタニヤフ間の関係悪化を示す。"}, {"word": "disputed", "definition": "意見の相違や合意の不一致。米国とイランが海峡に関する覚書の意味について異なる解釈をしていることを示す。"}]}, {"title_ja": "デリー援助制度、3人を超える子どもを持つ女性への現金給付を否定", "title_en": "Delhi assistance scheme denies cash aid to women with more than 3 children", "summary_ja": "デリーの女性援助プログラムは、3人以下の子どもを持つ女性のみを現金援助の対象とする制限を導入しました。この政策は給付金の配分を管理することを目的としていますが、より多くの子どもを持つ家族を経済的支援から除外することについて懸念が生じています。", "summary_en": "Delhi's women assistance program has implemented a restriction limiting cash aid eligibility to women with three or fewer children. The policy aims to control benefit distribution but has raised concerns about excluding larger families from financial support.", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/cities/delhi/no-cash-in-hand-aid-for-women-with-over-3-children-in-delhi-assistance-scheme-10808114/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "最高裁判所志願者が違法拘禁とハラスメントで最高裁に請願", "title_en": "CJP volunteer alleges illegal detention and harassment in Supreme Court petition", "summary_ja": "首席判事事務所に関連するボランティアが、違法拘禁とハラスメントの疑いで最高裁判所に請願を提出しました。この請願は基本的人権と適正手続きの潜在的な侵害について懸念を提起しています。", "summary_en": "A volunteer associated with the Chief Justice's office has moved the Supreme Court with allegations of illegal detention and harassment. The petition raises concerns about potential violations of fundamental rights and due process.", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/india/cjp-volunteer-moves-supreme-court-alleging-illegal-detention-harassment-10808111/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "試験問題漏洩防止法案：政府の若者の未来保護への先見的取り組み", "title_en": "Anti-Paper Leak Bill: Government's Visionary Step to Protect Youth Future", "summary_ja": "インド政府は試験問題の漏洩を防止し、若者の将来を保護することを目的とした試験問題漏洩防止法案を導入しました。この法案は教育試験の完全性を維持し、全学生に公平な機会を確保するための重要な措置として見られています。当局は組織的なカンニング・ネットワークに対抗する先見的なアプローチとしてこの措置を説明しています。", "summary_en": "The Indian government has introduced an anti-paper leak bill aimed at preventing examination paper leaks and safeguarding the future of youth. The legislation is viewed as a crucial step to maintain the integrity of educational examinations and ensure fair opportunities for all students. Officials describe the measure as visionary in its approach to combating organized cheating networks.", "source": "Indian Express", "tier": "paper", "link": "https://indianexpress.com/article/india/anti-paper-leak-bill-a-visionary-step-towards-safeguarding-youths-future-govt-10808107/", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トロント・ビジネス界、ビリー・ビショップ空港のジェット拡張計画の中止に落胆", "title_en": "Toronto business community disappointed by Billy Bishop jet expansion delay", "summary_ja": "トロント・ビジネス・コミュニティは、ビリー・ビショップ・トロント・シティ空港のジェット・サービス事業の拡張計画の中止決定に落胆を表明している。ビジネス・リーダーらは空港の商用ジェット機能の成長を期待していた。この挫折は地域の経済発展における逸失機会を意味している。", "summary_en": "The Toronto business community has expressed disappointment over the decision to halt expansion plans at Billy Bishop Toronto City Airport's jet service operations. Business leaders had anticipated growth in the airport's commercial jet capabilities. The setback represents a missed opportunity for economic development in the region.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMi_gFBVV95cUxPbTJubkl5WFBYcE9GLWlrR0RqT0UzSFYtWE9QMmQzYlAyWGgyYWcyczlNb0loa25mWk5Fd3BWOGxBa19sdktlWWotYng3eURVMThZcFdOczBqTUN2b1RnemZsUWRWY0luTlZpZ1VQUkk5ZGRBcXh4LWxKSUJCd1EyY2VIaFRUdzRRTDlLWGdnaE94RXV4VmpMLXBNaExMM3Jfb0o2bWRCclFHa2RuNlNJSlQ1QldZYmlIVFR6QkpUbHVPb19Jc1BhYjF4OE5JNXNKSmx4amRKN0tiM0VIdEJWQ3hpR1Y0QXlLRzlMencyRGw3bFphM2xxT3BmUngyZw?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カナダは毎年増加する山火事と煙に対する準備が必要", "title_en": "Canada Must Prepare for Larger Annual Wildfires and Smoke", "summary_ja": "気候変動により、カナダは毎夏、ますます深刻な山火事と煙に直面する未来を迎えようとしている。同国は、これらの繰り返される環境課題に対応し、管理するための包括的な戦略とインフラを開発する必要がある。専門家は、このパターンが数十年続くと警告している。", "summary_en": "Canada faces a future of increasingly severe wildfires and smoke every summer due to climate change. The country needs to develop comprehensive strategies and infrastructure to prepare for and manage these recurring environmental challenges. Experts warn that this pattern will persist for decades to come.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMihwJBVV95cUxNVVY5WGtCMGdPTTc3bHloTzNtYm55akV5dFJ5R1VqRW5UcW5TSEJiWWU1a2d1OS1HVDJzR3cwbHllMXctUWtBcnZIQ1pQeUhmUXV1cDNvUXhoM18xV21lLWJGRXdwbnRCUHVMYTZJbThvazdXeWdlM01xOG5GUmtJR0s3V3dqdVFaUkVGUm1hT1E0d1VrVlltY05Vb1lwQ2tjVHN2bFdYd2hoVGJJSk9WVTdzNjRZenlQVWF4bUs1MEF0ZUFxeHJLX3FCSkxRY21OcG13UU9WZkhwQmk1dmZlQWVBdTFuWUdFYzZZbDk5V0ExOUpvV0pvZjhhOEtmaDVPREJTWHpWUQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ビリー・ビショップ空港拡張を阻止する決定を受け、フォード州首相がカーニー運輸相と私的に会談", "title_en": "Ford expressed disappointment to Carney over Billy Bishop expansion block", "summary_ja": "オンタリオ州のダグ・フォード首相は、ビリー・ビショップ・トロント・シティ・エアポートの拡張計画を阻止する決定を受けて、連邦運輸大臣マーク・カーニー氏と私的に会談した。フォード首相は、空港の計画された成長を阻止した連邦政府の決定に失望を表明したとされている。", "summary_en": "Ontario Premier Doug Ford spoke privately with federal Transport Minister Mark Carney following a decision to block expansion of Billy Bishop Toronto City Airport. Ford reportedly expressed his disappointment with the federal government's decision that prevented the airport's planned growth.", "source": "The Star", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiogJBVV95cUxPYVlMbVY5VVVLT1AzRk5DTWdYYlFQejIyMWx3RmZDZWwtdVhkYndyU25LNHlHX05qZ2R6aXVGTlR0Mmd5b0h1Z0F3cVJON0JIUDdkYW5hUHZvMXlQenVWWVkxWEpyU0FzUGs1SnVSLVA5NW50ckx3SGZ5MTZDZG9NUzVNOU5tTTdvZXdsVXkxVzl4Wkg5V2lNeElydEw0Z3VTcjd0bjZGQ2tMOWgxUW5OdTM0bGRzRW9UOHNjOEs1b0x0cVdIUVRpMlNSbFhvM0RDNkQxdl92c0IxSmQtcHZmWGJURGh5TVVBQ2xIa0F4cURNYXdydF9mOFlld3pGVkZuUUxVZnN2NmhhV2RLRE9rVW41b3M1dFBTMFNyRTB3aTE5Zw?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "O グロボ英語ニュース", "title_en": "O Globo English News", "summary_ja": "O Globoは国際的な読者向けに英語でニュースを提供しています。この出版物は、政治、ビジネス、文化、社会にわたるブラジルと世界のイベントについてのレポートを配信しています。", "summary_en": "O Globo provides news coverage in English for international audiences. The publication delivers reports on Brazilian and global events across politics, business, culture, and society.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiakFVX3lxTE00WVFsTjVqR2xZQjFKaFZSNHBGUkpwZ2RhZXRRVUpPeHpoNXlfWENGNkN1VW9xOEtmby1oNVpYZVc2Y2huaWh2SnpvdExUbEJvZWhhc3ZXWnRFM2xIcVFiajR4UHA4NENhYXc?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "『私はまだここにいる』がアカデミー賞国際長編映画賞にノミネートされたブラジル映画として5作目に", "title_en": "'I'm Still Here' Becomes Fifth Brazilian Film Nominated for Best International Feature Oscar", "summary_ja": "『私はまだここにいる』がアカデミー賞国際長編映画賞にノミネートされ、ブラジル映画にとって重要な成果となりました。この映画は、オスカーの歴史を通じてこのプレスティジな賞にノミネートされた他のブラジル映画4作と並びます。O Globoはこのカテゴリーで競争したブラジル映画の完全なリストをレビューしています。", "summary_en": "'I'm Still Here' has been nominated for the Academy Award for Best International Feature, marking a significant achievement for Brazilian cinema. The film joins four other Brazilian productions that have received this prestigious nomination throughout Oscar history. O Globo reviews the complete list of Brazilian films that have competed in this category.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxNN20zQ0dhNkNSR0R2alRBX3R6OC1wZ2R3SFJTVDRCS21ocUlGRUVFZ3RJV3BRS2h1ZE9IQUhVV1ZrUXd4TDlBeVlaMGptMFdLNG1zMkg0M0Fxa2ZXODhzT1Z1UEtfUzMzNDNsUEY2VDNpX0dRemU2R2t2UTBlRXgxd2RPNTV5anNtaFQ5V2tUMm9ONTdyV3VVYjY2SDA0Y3d1QUI1V0VHTk04aThfRmxFNnJRY0g5VXNHbl9PMHc3Y0NkZkJtMEtrUmc1aFgwSm8yMW1FWmZqcy01TThXa0Eyam40Mml1ZDljQlZzUFprOEREZkozNWxXZlFfWFhhR3FGWHowZWp1SVpYQkXSAZoCQVVfeXFMTm5adThzODkxWGFUb1J0aUpId0FwTjVZRWM5bVJOQVNjOVl3WlhIY0Y0U0pGVGFHVkxDU0w3b2xTclBRR04yVFYxWmJQS0lvcUZrRnRoMXBRZllWTndPR1VVd25DX0U2VWRjcmZ4cnBpZVM1RENwQzlIU0diYVRtX1lESjZYRm5SSmlqMEpDcFVyT0hDYlBKWEZabXFfZ0U5LXMybjNURjJLeXJHZU5DSnVPRUEyUVJtOUZDQUdYVnk1Yks4Mm9aNnhZWFlSbXFBZllhU0tSb0NlbWxzMVBhMF84RnB0SlNDMFh2ZGRaRENZY0EtT1d3SzB4UDZ2S1NJNGRvTl90SW5CSFA1elNTaXFqeFpMbjdiRGF3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "グルーポ・グローボ、創立100周年に向けた企画を準備中", "title_en": "Grupo Globo Prepares Major Initiatives for Centennial Year", "summary_ja": "ブラジル最大のメディア企業グループであるグルーポ・グローボが、創立100周年を記念した特別企画の準備を進めている。同社は各メディアプラットフォームを通じて、この歴史的なマイルストーンを祝う記念プロジェクトを計画している。", "summary_en": "Grupo Globo, Brazil's largest media conglomerate, is planning special initiatives to mark its 100th anniversary. The company is preparing commemorative projects across its various media platforms to celebrate this milestone in its history.", "source": "O Globo", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxPMVZRN2RsM0EtZWt6dlpuR0tvNElsSkhsaDdsd0lYalpqS285YlBna1RjbUdxWkFZOXotLWxJV3ZUczBZMGVPeUl0X0FLYXZXYy1ILTBqN3E1XzJVVTFrUXo0Y29RamNyanhVcUF6U2ZpUEdITV9ubk1oMF82c3FjM2ljZUZVbmZ0UG5sY0hkRTNvNGVqTnpuNlR2N21sYUZybkJHeVBHUkF2MUlUSFlpREtOQTFXaVJVUmfSAcgBQVVfeXFMUDJCRm16ZDU5bjViV21mdm1KMzJ5c3JnVjBEcVpJUGF2b0tnZ1JkRGhVVDVYM1pyMFNKQUNIdDVGQWRkTjNhR0dSai1kQS1nLVFwUFlDYm1aMjFaNEx2Y1YzWjVRWlNfN3lPWC1ERF9ZcVFhOFpTY3VVX0w2bmNyR2Rick9VLXRDemFydWFXOHhaSFhLai1PSmdfUlhDT0NiY0Z0TGJFUGZxLVhDdmxmZ25hcHl0T3dhWm9VeHZaWTRPa252QVNQdkM?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ナイジェリア、薪調理廃止を目指すガス普及イニシアティブを開始", "title_en": "Nigeria Launches Gas Initiative to End Firewood Cooking in Households", "summary_ja": "ナイジェリアの石油資源大臣がバイエルサ州で「全国草の根LPG普及プログラム」を開始し、全国の家庭でのガスアクセス拡大を目指している。石油大手企業に支援されたこのイニシアティブは、家庭での薪調理をより清潔で安全な液化石油ガス(LPG)に置き換えることを目的としている。ナイジェリアは215兆立方フィート以上の天然ガス埋蔵量を保有しており、政府はこれらの資源を国民の具体的な利益に変換することに取り組んでいる。", "summary_en": "Nigeria's Minister of Petroleum Resources launched the National Grassroots LPG Penetration Programme in Bayelsa State to expand access to cooking gas across the nation. The initiative, backed by major energy companies, aims to replace firewood cooking with cleaner, safer liquefied petroleum gas (LPG) in households nationwide. Nigeria possesses over 215 trillion cubic feet of natural gas reserves, and the government is committed to converting these resources into tangible benefits for citizens.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/898971-nigeria-blessed-with-gas-no-family-should-use-firewood-for-cooking-minister.html", "state_media": false, "category": "政治", "full_text": "The Minister of State for Petroleum Resources (Gas), Ekperikpe Ekpo, has said that it is not okay for Nigerians to use firewood for cooking when the country is blessed with abundant gas resources.\nMr Ekpo spoke on Tuesday in Yenagoa, Bayelsa State, at the launch of a federal initiative to expand nationwide access to Liquefied Petroleum Gas (LPG), commonly known as cooking gas.\n“At the heart of this programme lies a simple but powerful conviction: that the promise of Nigeria’s abundant natural gas must translate into dignity, safety, and improved wellbeing for our people,” Mr Ekpo said.\n“No mother should be compelled to choose between feeding her family and protecting her health. No child should inhale harmful smoke because cleaner energy remains beyond reach. No family should spend valuable hours searching for firewood when our nation is richly endowed with gas resources capable of powering safer and more dignified lives.”\nThe initiative, called the National Grassroots LPG Penetration Programme, falls under Nigeria’s Decade of Gas Initiative and is executed in partnership with several private firms, including Seplat Energy, ExxonMobil, NNPC, NLNG, Dangote Group, SPDC, and TotalEnergies, according to a statement on the Decade of Gas website.\nThe programme aims to expand access to LPG and encourage households to adopt cleaner, safer, and more efficient cooking fuel.\nAccording to the Decade of Gas Initiative, the Bayelsa activation signals the start of a state-by-state rollout that will bring the benefits of clean cooking energy to communities across the country.\nThe minister said Nigeria is blessed with over 215 trillion cubic feet of proven natural gas reserves, making it one of the foremost gas-endowed nations in the world.\n“Our solemn responsibility is to ensure that this national endowment is converted into tangible benefits for our citizens. This is the driving philosophy behind the Decade of Gas Initiative and our commitment to making natural gas the fuel that powers Nigeria’s industrialisation, energy security, and shared economic prosperity,” he said.\nMr Ekpo said the launch of the initiative is a journey towards cleaner energy, healthier homes, and a more prosperous nation. He said Bayelsa has “earned a distinguished place in history as the launch state for this transformative national initiative”.\n“This state-level rollout builds on the successful zonal phase previously implemented by the Federal Government, through the Ministry of Petroleum Resources (Gas), across the six geopolitical zones, with one state representing each zone.\n“Those rollouts gave us valuable lessons, deepened stakeholder collaboration, and strengthened our resolve that access to clean cooking energy must be expanded with urgency, purpose, and compassion to every Nigerian household.\n“With Bayelsa State as the starting point, we are now moving from regional implementation to a broader state-by-state deployment designed to reach households more directly and more effectively.\n“This marks a decisive step towards ensuring that the benefits of clean cooking are felt where they matter most: in our homes, our communities, and the daily lives of our citizens,” Mr Ekpo said.\nThe minister said President Bola Tinubu’s administration is committed to unlocking Nigeria’s gas resources for national development.\n‘It’s time to think about the Niger Delta people’ – Gov Diri\nGovernor Douye Diri of Bayelsa State flagged off the free distribution of the LPG cylinders.\nHe commended the federal government and its partners for the initiative, saying that the people of Bayelsa will benefit immensely from it.\n“We have cried, we have fought against environmental degradation and the abandonment of our people. While the cities are built with money from our soil, we languish in poverty. We use firewood to cook, while they use gas from our land to cook,” Mr Diri said.\n“But today, the story is changing.\n“It is time for us to think about the people of the Niger Delta and give back to the people of the Niger Delta. That is what we are witnessing today.”\nThe governor said he had been thinking about how to get Bayelsa residents to switch from firewood to cooking gas, and that the launch of the initiative came at the right time.\n“This will be the beginning of getting our women and our people out of firewood cooking,” he said.\nPREMIUM TIMES recently reported how global supply disruptions and longstanding domestic bottlenecks combined to drive up the cost of LPG, leaving consumers and businesses under severe pressure.", "translation_ja": "", "vocab": [{"word": "endowed", "definition": "豊富に備えられている、恵まれている。特に自然資源や才能などについて使用される。"}, {"word": "penetration", "definition": "市場への浸透、または何かが広く普及すること。ビジネスや開発分野で特に使われる用語。"}, {"word": "tangible", "definition": "具体的で明確な、実際に感じることができる。抽象的ではなく現実的な利益や成果を指す。"}, {"word": "deployment", "definition": "配置、展開。軍事用語から転じて、資源やサービスを戦略的に配置・展開すること。"}, {"word": "solemn", "definition": "厳粛で真摯な態度。重要で真面目な責任や約束を強調するときに使われる。"}, {"word": "degradation", "definition": "低下、劣化、または品質の低下。環境問題では環境の悪化を指す。"}]}, {"title_ja": "下院が燃料輸入業者と国内精製業者間の停戦を模索", "title_en": "House of Representatives Seeks Peace Between Fuel Importers and Local Refiners", "summary_ja": "ナイジェリアの下院は石油輸入業者と国内精製業者間の対話を仲介し、下流セクターを強化して安定した燃料供給を確保しようとしている。石油資源委員会は主要な業界団体との協議を開き、国内精製拡大と石油製品の手頃な価格と利用可能性のバランスに焦点を当てた。委員会は石油流通チェーンに影響する法律および規制決定に利害関係者を関与させることを約束した。", "summary_en": "Nigeria's House of Representatives is facilitating dialogue between petroleum importers and domestic refiners to strengthen the downstream sector and ensure stable fuel supply. The House Committee on Petroleum Resources held consultations with major industry associations, focusing on balancing domestic refining expansion with affordability and availability of petroleum products. The committee promised to involve stakeholders in legislation and regulatory decisions affecting the petroleum distribution chain.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/more-news/898969-reps-seek-truce-between-fuel-importers-local-refiners-over-supply-security.html", "state_media": false, "category": "経済", "full_text": "The House of Representatives is seeking to reduce tensions between petroleum importers and domestic refiners as it begins consultations with operators to strengthen Nigeria’s downstream petroleum sector and ensure a steady fuel supply.\nThe House Committee on Petroleum Resources (Downstream), led by Ikenga Ugochinyere (APP, Imo), held an interactive session with major players in the sector on Tuesday at the National Assembly.\nRepresentatives of the Depot and Petroleum Products Marketers Association of Nigeria (DAPPMAN), Independent Petroleum Marketers Association of Nigeria (IPMAN), and Major Energies Marketers Association of Nigeria (MEMAN) attended the meeting.\nThe discussions focused largely on how to support the expansion of domestic refining capacity without compromising the availability and affordability of petroleum products nationwide.\nMr Ugochinyere said the engagement was part of the committee’s efforts to ensure that legislation and regulatory interventions in the downstream sector reflect the realities faced by businesses and consumers.\nHe said the House was seeking dialogue rather than confrontation in addressing disagreements within the industry.\n“We are here not to interrogate, not to accuse and not to put anyone on trial. We are here to listen. We are here to talk to one another as partners who share one common destiny, a Nigeria where energy is affordable, supply is stable, and no citizen suffers because petroleum products are out of reach,” he said.\nThe committee chairman assured industry operators that the House would not support policies affecting the downstream sector without consulting the businesses and institutions responsible for maintaining the petroleum distribution chain.\nHe said the country was at a critical point in its energy transition, with domestic refining capacity expanding alongside changes in petroleum importation and renewed efforts to improve pipeline security and distribution infrastructure.\n“The marketers, depot owners, independent operators and major marketers remain the bridge between government policy and the pump. When that bridge is strong, Nigerians enjoy stable prices and a reliable supply. When it is weak, the entire nation feels the consequences,” he said.\nMr Ugochinyere said the committee would consider the recommendations submitted by the various associations before proposing legislative measures to attract investment, expand domestic refining, promote competition, and ensure a reliable supply of affordable petroleum products.\nHe also reiterated the committee’s commitment to maintaining engagement with industry players as part of its oversight and legislative functions.\nDAPPMAN seeks clearer stockholding rules\nPresenting DAPPMAN’s position, its Executive Secretary, Olufemi Adewole, called on the Nigerian Midstream and Downstream Petroleum Regulatory Authority (NMDPRA) to establish clear guidelines for operating stock under Section 182 of the Petroleum Industry Act (PIA).\nMr Adewole said the guidelines should provide clear requirements for measuring, reporting, and assessing the quality of petroleum stocks, and for ensuring their quality.\nHe argued that strategic stockholding should not be assessed solely on the quantity of products held.\nAccording to him, operators’ ability to rapidly finance, transport, and release petroleum products during emergencies or supply disruptions should also be part of the assessment.\nDAPPMAN also proposed a joint market-monitoring mechanism involving the NMDPRA and the Federal Competition and Consumer Protection Commission (FCCPC).\nThe framework, it said, should monitor supply concentration, product availability, allocation practices, treatment of operators and other indicators that could signal emerging stress in the petroleum market.\nThe association further urged the federal government to increase investment in roads, railways, inland waterways, pipelines and petroleum depots.\nIt said improved infrastructure would reduce the industry’s dependence on transporting petroleum products over long distances by road from a limited number of coastal supply points.\nDAPPMAN also called for a permanent consultation platform involving regulators, marketers, refiners, NNPC Limited, transport agencies and security institutions.\nThe platform, according to the association, would provide an avenue for stakeholders to regularly assess supply conditions, infrastructure deficiencies and emerging threats to the downstream sector.\nIPMAN highlights cost, infrastructure challenges\nIPMAN described the downstream petroleum industry as a strategic component of the Nigerian economy, noting that petroleum products remain essential to households, manufacturing, agriculture, transportation, healthcare and national security.\nThe National President, Abubakar Shettima, said that the implementation of the PIA, the deregulation of petroleum prices, efforts to revive government-owned refineries, and the emergence of large private refineries had created an opport", "translation_ja": "", "vocab": [{"word": "downstream", "definition": "石油産業において精製後の段階を指す。採掘・輸送の上流段階に対し、精製・販売・流通などの後工程を意味する。"}, {"word": "stockholding", "definition": "戦略的な在庫保有を指す。供給途絶時に対応するため、事前に製品を保管・保有する行為。"}, {"word": "infrastructure", "definition": "社会経済活動の基盤となる道路、鉄道、パイプラインなどの基本的施設。産業発展に必須の物理的基盤。"}, {"word": "deregulation", "definition": "政府による規制を撤廃または緩和すること。市場競争を促進するための政策手段。"}, {"word": "concentration", "definition": "市場において特定の企業や機能が一部に集中した状態。供給源が限定されることで競争が阻害される懸念。"}, {"word": "stakeholder", "definition": "事業や意思決定に利害関係を持つすべての関係者。政府、企業、消費者など複数の主体を含む。"}]}, {"title_ja": "APC、オスン州キャンペーン委員会を発足、2027年選挙に向け準備体制を整備", "title_en": "APC Inaugurates Osun Campaign Council, Eyes 2027 Readiness", "summary_ja": "全進歩会議（APC）は2026年8月のオスン州知事選挙向けの全国キャンペーン委員会を発足させ、党議長イルワッダが2027年総選挙を控えた党の政治力を測る重要なテストと位置づけた。委員会は知事、国会議員、実業家を含む経験豊富な政治指導者で構成され、イモ州知事ウゾディンマが委員長を務める。APCは大統領府の成果に焦点を当てた政策中心のキャンペーンと草の根動員を計画している。", "summary_en": "The All Progressives Congress inaugurated its National Campaign Council for the August 2026 Osun State governorship election, with party chairman Yilwatda describing it as a critical test of the party's strength ahead of the 2027 general election. The council comprises experienced political leaders including governors, lawmakers, and business leaders, with Imo State Governor Hope Uzodimma chairing the body. The APC plans an issue-based campaign focused on grassroots mobilization and the federal government's achievements under President Tinubu.", "source": "Premium Times", "tier": "paper", "link": "https://www.premiumtimesng.com/news/top-news/898963-osun-2026-yilwatda-inaugurates-campaign-council-says-poll-litmus-test-for-apc.html", "state_media": false, "category": "政治", "full_text": "The All Progressives Congress (APC), on Tuesday, inaugurated its National Campaign Council for the Osun State governorship election, describing the poll as a major test of the party’s political strength and preparedness ahead of the 2027 general election.\nSpeaking at the inauguration of the council in Abuja, the APC National Chairman, Nentawe Yilwatda, said the party had assembled experienced political leaders and stakeholders from across the country to coordinate its campaign and secure victory for its governorship candidate, Munirudeen Oyebamiji, popularly known as AMBO.\nMr Yilwatda said the council comprised serving and former governors, members of the National Assembly, members of the Federal Executive Council, deputy governors, party leaders, business leaders and other political stakeholders.\nHe said the composition of the council reflected the depth of political experience and organisational capacity available to the ruling party.\n“If there is any political party in Nigeria that has human resources in abundance, it is the APC. If there is any political party that has the most experienced politicians in Nigeria, it is the APC,” Mr Yilwatda said.\nHe said the APC had the political structure and manpower to compete successfully at every level, from councillorship and local government elections to governorship and presidential contests.\nMr Yilwatda said the Osun election, which holds on 15 August, would serve as the APC’s final major electoral test before the 2027 general election.\nHe described the contest as an opportunity to measure the party’s preparedness and test the political machinery being developed for the next general election.\n“This will be our litmus test. It will measure our level of preparedness for 2027. This will be our practice ground. It will be our rehearsal for the political machine we are preparing for 2027,” he said.\nThe APC chairman said winning Osun was a major priority for the party, adding that its governors, lawmakers, local government chairmen, councillors and other political leaders would be deployed for intensive grassroots mobilisation.\nHe said the campaign would focus on direct engagement with voters through person-to-person and house-to-house mobilisation across communities.\nAccording to him, the mobilisation would extend across the state irrespective of ethnicity, language or place of origin.\nMr Yilwatda also assigned a prominent role to the party’s women’s wing, stressing that women would be central to the APC’s grassroots campaign and voter mobilisation strategy.\nHe expressed confidence that the calibre of political leaders appointed to the council would strengthen the party’s chances at the polls.\n“The people standing here are men and women of great political strength who can withstand any political party in Osun State,” he said before formally inaugurating the council.\nUzodimma pledges issue-based campaign\nImo State Governor, Hope Uzodimma, who chairs the campaign council, said its members accepted the assignment with humility and a determination to justify the confidence placed in them by the party leadership.\nMr Uzodimma described the responsibility as an obligation to the APC, to Nigeria’s democracy, and to the people of Osun State.\nHe said every party leader and stakeholder had a role to play in securing victory for the APC.\n“This is a collective responsibility. Every member of this council, every leader, every member of our party and every progressive stakeholder has a vital role to play. There can be no spectator in a mission of this importance,” he said.\nThe governor said the APC would run an issue-based, evidence-driven and respectful campaign focused on engaging the people of Osun and presenting Mr Oyebamiji as a competent and people-centred leader.\nHe said the campaign would be anchored on the achievements of the APC-led federal government under President Bola Tinubu as well as the party’s record of governance across the country.\nMr Uzodimma described Mr Tinubu as a courageous leader whose Renewed Hope Agenda was laying the foundation for a stronger and more prosperous Nigeria.\nHe said the campaign council would engage workers, farmers, market women, artisans, professionals, young people, traditional and religious leaders and persons with disabilities across communities, local government areas, wards and polling units.\nThe governor said the APC would not be distracted by criticism from opposition parties, misinformation or social media campaigns.\nHe said the party would counter what it considered false claims with facts and focus on its record of performance.\n“We will answer falsehood with facts. We will respond to insults with discipline, propaganda with performance and provocation with peace,” he said.\nMr Uzodimma also pledged that the APC would support a peaceful, free and credible election, stressing that no political ambition was worth the blood of any Nigerian.\n“Our campaign will be vigorous without violence, competitive without bitterness and confident", "translation_ja": "", "vocab": [{"word": "litmus test", "definition": "ある物事や組織の真の能力や準備状況を測るための試験的指標。政治的成功の可能性を判定するために使用される。"}, {"word": "mobilization", "definition": "特定の目的（選挙キャンペーンなど）に向けて人材や資源を組織的に動員すること。政治活動において有権者を組織して支持を集める行動。"}, {"word": "stakeholder", "definition": "特定の事業や組織の決定や成果に関心を持つ関係者や当事者。政治や経営の文脈では利害関係者を指す。"}, {"word": "incumbent", "definition": "現在その地位にある人、特に現職の政治家を指す。前回選挙で当選した現職の政治指導者。"}, {"word": "grassroots", "definition": "地域社会の基層や基本的な構成員を指す。政治活動において地域住民への直接的な働きかけや基層からの支持形成を意味する。"}, {"word": "caliber", "definition": "人物の能力、資質、または品質のレベルを表す。高い水準の人材や才能を評価する際に使用される。"}]}, {"title_ja": "熊本県の強い地震で建物倒壊、日本が救助活動を展開", "title_en": "Japan Launches Rescue Operations in Buildings Collapsed by 6.8 Magnitude Earthquake", "summary_ja": "日本の南西部に位置する熊本県を襲った6.8マグニチュードの大地震により、緊急対応チームが救助活動を行っている。倒壊した建物に取り残された人々の発見と火災消火に向けて、救急隊員らが急ピッチで活動を進めている。この地震により地域全体で多大な構造物の損害が発生し、即座の緊急対応が必要とされている。", "summary_en": "Emergency workers are conducting urgent rescue operations in Kumamoto prefecture in southwestern Japan following a powerful 6.8 magnitude earthquake. Responders are racing to locate survivors trapped in collapsed buildings and extinguish fires across the affected region. The quake has caused significant structural damage requiring immediate emergency response.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/live/2026/07/28/world/japan-earthquake-kumamoto-tsunami", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "米国が攻撃を一時停止、イランは停戦交渉再開に急がず", "title_en": "U.S. Pauses Strikes as Iran Shows No Rush to Resume Cease-Fire Talks", "summary_ja": "戦闘が一時的に沈静化する中、イラン指導部はトランプ大統領よりも長く圧力に耐えられると判断しているとアナリストは指摘する。イランはホルムズ海峡という重要な海上航路を支配する戦略的優位性を保持している。軍事行動の一時停止はイランの交渉復帰につながっていない。", "summary_en": "As fighting subsides, Iranian leaders believe they can withstand more pressure than President Trump, according to analysts. Iran maintains strategic leverage over the Strait of Hormuz, a critical global shipping route. The pause in military action has not prompted Iran to return to negotiations.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/07/28/world/middleeast/iran-war-us-trump.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "マドリード近郊で大規模山火事が急速に拡大", "title_en": "Massive Wildfires Draw Close to Madrid", "summary_ja": "マドリードは文化的・経済的な繁栄を遂げている一方で、首都から近い距離で猛威を振るう大規模な山火事が現実的な危機をもたらしている。繁栄する都市圏であっても自然災害の脅威にさらされていることが浮き彫りになった。", "summary_en": "Madrid is experiencing rapid cultural and economic growth, but devastating wildfires burning within a short distance of the capital have served as a stark reminder of environmental threats. The proximity of these fires to Spain's thriving metropolis highlights the vulnerability of even prosperous urban centers to natural disasters.", "source": "New York Times", "tier": "paper", "link": "https://www.nytimes.com/2026/07/28/world/europe/spain-wildfires-madrid.html", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルが検問所解放、パレスチナ人がガザ北部への帰還開始", "title_en": "Palestinians Return to Northern Gaza After Israel Lifts Crossing Restrictions", "summary_ja": "イスラエルは人質解放交渉の膠着状態が打開された後、ガザを二分する軍事地帯の横断を認め、避難していたパレスチナ人の帰還を開始した。この措置は、市民の北部と南部間の移動を制限していた規制の大きな転換を示している。検問所の再開は、武装勢力が保持する人質の釈放をめぐる交渉における膠着状態の打開に続くものである。", "summary_en": "Israel has allowed displaced Palestinians to resume crossing through a military zone that divides Gaza, following a breakthrough in hostage release negotiations. The movement marks a significant shift in restrictions that had prevented civilians from traveling between the northern and southern parts of the enclave. The crossing reopening comes after a deadlock in talks over the release of hostages held by militant groups.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "中国大手不動産開発企業が巨額損失を報告、不動産危機の深刻化を示唆", "title_en": "Leading China Property Developer Reports Huge Loss Amid Real-Estate Crisis", "summary_ja": "中国の大手不動産開発企業である万科が巨額の損失を報告し、中国の不動産危機の深刻化への懸念が高まっている。同社の経営難は業界全体の潜在的なシステミックな問題を示唆しており、中国政府が市場の安定化に介入するかどうかについての疑問を引き起こしている。", "summary_en": "Vanke, a major Chinese property developer, has reported substantial losses, raising concerns about the deepening real-estate crisis in China. The company's financial troubles signal potential systemic issues across the sector and prompt questions about whether the Chinese government will intervene to stabilize the market.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "解放されたイスラエル人人質、10月7日の攻撃による砲弾が体内に残存", "title_en": "Freed Israeli Hostages Still Carry Shrapnel from Oct. 7 Attack", "summary_ja": "イスラエルの医療関係者によると、最近解放されたイスラエル人人質の体内には10月7日の攻撃による砲弾の破片が埋め込まれたままになっていた。一部の女性は長期間隔離されて過ごし、8ヶ月間をトンネルの中で過ごした。この発見は、人質が長期間の拘束中に被った身体的外傷の深刻さを浮き彫りにしている。", "summary_en": "Recently released Israeli hostages retained shrapnel embedded in their bodies from the October 7 attack, according to Israeli medical officials. Some women were held in isolation for extended periods and spent eight months confined in tunnels. The discovery highlights the physical trauma endured by hostages during their prolonged captivity.", "source": "Wall Street Journal", "tier": "paper", "link": "https://www.wsj.com/articles/freed-israeli-hostages-still-had-shrapnel-in-their-bodies-from-oct-7-attack-3de8cd1e", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "エアコンの地政学", "title_en": "The Geopolitics of Air-Conditioning", "summary_ja": "世界的な熱波の激化に伴い、エアコンへのアクセスが世界中で重要な政治問題として浮上している。冷房技術の不平等な配分は社会的不平等を悪化させ、特に開発途上国のエネルギー資源に負担をかけている。政府は気候変動への適応ニーズと経済・環境的制約のバランスを取ることを余儀なくされている。", "summary_en": "As global heatwaves intensify, access to air-conditioning has emerged as a critical political issue worldwide. The unequal distribution of cooling technology exacerbates social inequalities and strains energy resources, particularly in developing nations. Governments face mounting pressure to balance climate adaptation needs with economic and environmental constraints.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/23/the-geopolitics-of-air-conditioning", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン戦争がトランプ大統領職を消費している", "title_en": "The Iran War Is Consuming the Trump Presidency", "summary_ja": "イランとの緊張がエスカレートし、トランプ政権の大統領職の中心を占める大きな紛争となっている。この状況はバラク・オバマの無分別な軍事介入に対する警告的姿勢を反映しており、トランプが過去の戦略的誤りを繰り返している可能性を示唆している。", "summary_en": "Donald Trump's administration faces significant challenges as tensions with Iran escalate into a major conflict that dominates his presidency. The situation echoes Barack Obama's cautionary stance against ill-advised military interventions, suggesting Trump may be repeating past strategic mistakes.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/21/the-iran-war-is-consuming-the-trump-presidency", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スペインのチームワークはメッシの天才を上回ることができるか？", "title_en": "Can Spain's Teamwork Overcome Messi's Genius?", "summary_ja": "ワールドカップ決勝進出国のスペインとアルゼンチンは、対照的なサッカーの哲学を体現している。アルゼンチンはリオネル・メッシの個人的な才能に大きく依存している一方、スペインは集団的なチームワークと戦術的な規律を重視している。この対戦は、現代サッカーにおける天才とシステムの永遠の議論を浮き彫りにしている。", "summary_en": "Spain and Argentina, both World Cup finalists, represent contrasting football philosophies. While Argentina relies heavily on Lionel Messi's individual brilliance, Spain emphasizes collective teamwork and tactical discipline. The matchup highlights the eternal debate between genius and system in modern football.", "source": "The Economist", "tier": "paper", "link": "https://www.economist.com/international/2026/07/18/can-spains-teamwork-overcome-lionel-messis-genius", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランスの防衛施設を脅かす大規模山火事", "title_en": "Massive wildfires threaten defense sites in France", "summary_ja": "ボルドー西部のスージュ軍事基地を含むフランス西部の軍事防衛施設が大規模な山火事の脅威にさらされている。当局はこれらの戦略的施設を火災から守るため、陸上および航空資源を広く動員している。", "summary_en": "Large-scale wildfires are threatening military defense facilities in western France, including the Souge military camp near Bordeaux. Authorities have mobilized extensive ground and aerial resources to protect these strategic installations from the spreading flames.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/france/article/2026/07/28/massive-wildfires-threaten-defense-sites-in-france_6755930_7.html", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "仏南西部の消防士、森林火災対策に向けて樹木を伐採し防火帯を造成", "title_en": "French Firefighters Create Firebreaks by Cutting Trees to Combat Forest Fires", "summary_ja": "フランス南西部の消防士たちは、森林火災に対抗するための緊急戦略として、樹木を伐採し土壌を耕して数メートル幅の防火帯を造成している。この保護帯は、炎が森林地帯に広がるのを遅くまたは止めるために設計されている。この技法は、フランスが深刻な森林火災の脅威に直面する中での重要な防御措置である。", "summary_en": "Firefighters in southwestern France are implementing an emergency strategy to combat raging wildfires by cutting down trees and turning soil to create firebreaks several meters wide. These protective barriers are designed to slow or stop the spread of flames through forested areas. The technique is a critical defensive measure as France faces severe forest fire threats.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/environment/article/2026/07/28/france-fires-why-firefighters-are-cutting-down-trees-to-create-firebreaks_6755915_114.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ジネディーヌ・ジダン、フランス代表の新監督に就任", "title_en": "Zinédine Zidane Named New France Coach After Deschamps Era", "summary_ja": "フランス代表の新監督にジネディーヌ・ジダンが任命されました。彼は14年間フランス代表を率いたディディエ・デシャンの後任です。伝説的な元選手であるジダンは、このポジションのために他の機会をすべて断ったと報じられています。この人事はデシャンの長期統治後、フランスサッカーの大きな転機となります。", "summary_en": "Zinédine Zidane has been appointed as the new head coach of the French national football team, replacing Didier Deschamps who managed Les Bleus for 14 years. The legendary former player, known for his patience and commitment, reportedly turned down other opportunities to take the position. Zidane's appointment marks a significant transition for French football following Deschamps' long tenure.", "source": "Le Monde", "tier": "paper", "link": "https://www.lemonde.fr/en/sports/article/2026/07/28/zinedine-zidane-the-patient-new-coach-who-turned-down-everything-for-the-french-national-team_6755927_9.html", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "防衛省", "title_en": "Mindef", "summary_ja": "提供されたテキストはニュース記事ではなくニュースレターのヘッダーであるため、要約を生成することができません。購読情報とメタデータのみが含まれており、実質的なニュースコンテンツが不足しています。", "summary_en": "Unable to generate summary from provided excerpt. The source material appears to be a newsletter header rather than article content, containing only publication metadata and subscription information without substantive news content.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1367071", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "夕刊ニュース速報", "title_en": "Evening Update", "summary_ja": "ストレーツ・タイムズの夕刊ニュース速報は、毎日のニュースハイライトと最新情報を提供します。読者はウェブサイトを通じてニュースレターの購読登録と管理ができます。", "summary_en": "The Straits Times Evening Update newsletter provides daily news highlights and updates. Readers can subscribe to receive more free newsletters and manage their subscriptions through The Straits Times website.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179898", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "モーニングブリーフィング", "title_en": "Morning Briefing", "summary_ja": "ザ・ストレーツ・タイムズのモーニングブリーフィングは、毎日のニュース更新と主要なニュースを提供しています。読者は出版社のプラットフォームを通じて、追加の無料ニュースレターを購読し、購読設定を管理できます。", "summary_en": "The Straits Times Morning Briefing provides daily news updates and key stories. Readers can subscribe to additional free newsletters and manage their subscription preferences through the publication's platform.", "source": "The Straits Times", "tier": "paper", "link": "https://www.straitstimes.com/node/1179656", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イスラエルのデファクト戦略、ウェストバンク入植者暴力で露呈", "title_en": "Israel's De Facto Strategy Exposed in West Bank Settler Violence", "summary_ja": "ウェストバンクでの最近の入植者による暴力事件は、パレスチナ領土に対するイスラエルの潜在的な戦略を反映していることが分析で明らかになった。エスカレートする攻撃は、紛争地域における国家政策と民間人の行動の関係を浮き彫りにしている。これらの事象は地域の緊張の深刻化を示している。", "summary_en": "Analysis reveals that recent incidents of settler violence in the West Bank reflect Israel's underlying strategy toward Palestinian territories. The escalating attacks highlight the relationship between state policies and civilian actions in contested areas. These events underscore deepening tensions in the region.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMimAJBVV95cUxNaElvMkhoRWZveHA0RzFZREdDZ0h6OGs0dDZNTVBwMVlicUtfMDF0Y3dvQjRjRzV4NDVsbTdvOVdYN05TN2ZRZmEwRnRwQmEzWXJiVmwyUVk3b0JkZmpJQXJEaENtbFpNdUNpXzY3dUpZUG9tNnYzMnFhS2JJYVhKY2hvWUtRTGstTmhpZE5MQXJ1VHgzVG55UEQ1Y21NMjRUYldpU0FVdm5MM05rNWtCNG9GUmpKT0w3XzFsNXJrRWtWbjZrUXdOdS1kZEl3X1JNZU5qb2E3aHZ3b0NVYjIzemJsWU5HejdzUHFZVHFEaWQ4b1R0dzZMb3duQUhqaXhWYlpHNE9YWjNWY1E3b0dOUV9zX2pYYVE5?oc=5", "state_media": false, "category": "経済", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ネタニヤフ首相、米国訪問中のゼレンスキー大統領との会談を拒否", "title_en": "Netanyahu Declined to Meet Zelenskyy During U.S. Visit", "summary_ja": "ウクライナの情報筋によると、イスラエルのベンヤミン・ネタニヤフ首相は最近の米国訪問中にウクライナのボロディミル・ゼレンスキー大統領との会談を拒否したとされています。この拒否は、ロシアの侵攻に対するウクライナ支援に関する国際的な外交努力の最中での注目すべき外交的冷遇を示しています。", "summary_en": "Israeli Prime Minister Benjamin Netanyahu reportedly declined a meeting with Ukrainian President Volodymyr Zelenskyy during Netanyahu's recent visit to the United States, according to Ukrainian sources. The refusal marks a notable diplomatic snub amid ongoing international efforts to support Ukraine against Russian aggression.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxOdWlzdXQ5cFJXMzJhR0RmaVZGU0NGWTBsWlhOczdPUDZ0cS03TnRZQlVmUFJvcXhYOEZoZnVOckNlLUlSTDVjVVF4ZDIwcUdBYi1scEZTZlg4TmhjR3I0MGNXa0JieFZBNzhUZUJlcjU0OEJnc0V4RjJpSUxzNmlyRXh3aUEwa25GZjd6bC04d0MxMzRnNUk0TkFwVmhuM2lsaC1mT0pWVzItOGVPSlN4NHZTQ192ZHVWVnk4U0NLbXBXQV92RnQteGdISUFNejBmbDQtY2VmMTltazFjbl93ZU56R0trY3JDcmp4VVVkbzdaQV9Vb0tsOHRnR0haekxlSFBidTY5TjJkalU?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ボーイ・ジョージ、新曲でイスラエルのガザ戦争を擁護", "title_en": "Boy George Defends Israel's Gaza War in New Song", "summary_ja": "ボーイ・ジョージが10月7日の攻撃後のイスラエルによるガザ軍事作戦を擁護する新曲をリリースした。歌詞では、紛争をジェノサイドとして特徴づけることと戦争としての彼の見方を対比させている。この曲はガザ紛争の性質と実行に関する国際的な議論を反映している。", "summary_en": "Boy George has released a new song defending Israel's military operations in Gaza following the October 7 attacks, with lyrics that contrast the characterization of the conflict as genocide with his view of it as war. The song reflects the ongoing international debate over the nature and conduct of the Gaza conflict.", "source": "Haaretz", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiowJBVV95cUxQTlQtT2N2NXNVZnFjTXoyVXBfcDllRXVudnUwUlRWUk8tdGtLMDR1RHpHTllEMUt5UGZSUE4wLU1YcWJzcEdTeWtOUW9xbEpGRGY4MGhiM3c5M2lPTktGUGVrVFdmYVFTanVYamI3N1B2eWpXanItOW9QcFFoalNOc2tFb0trQWU5T0dxNjRuTUdJVU93d0N0d3NBT2JZaUZhdkl0aXFWaVBFak5EU0dHcDVSRWRPZklqVEY5UnhROXd4VUY4aHN5OWx0cmt3T2JIdVB2dlY0WFhwZEtGUjJacWZfZWFpVHE1UWpQc2JFQzZYVUlWOV9OUFVRZTJVNHFCWWxEeVVWalRqUXJHd0Jocng5emMtSTFpd05LSE5NZFJyYlk?oc=5", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "台湾、中国の海上作戦について北京と懸念を共有", "title_en": "Taiwan raises concerns over Chinese sea operations with Beijing", "summary_ja": "台湾は中国の海上活動に関する懸念を正式に北京に伝えた。この懸念は地域における海軍活動をめぐる緊張を浮き彫りにし、領海と軍事活動をめぐる継続的な紛争を強調している。", "summary_en": "Taiwan has formally expressed concerns to Beijing regarding Chinese maritime activities in the region. The concerns highlight tensions over sea operations and underscore ongoing disputes over territorial waters and military activities in the area.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE44MUphXzdMcG1SQTRuUDg4RmJoNUczVnY3S0V1SktFSG1DZVZYMWNkcXBoQmVHeGE5U2ZKSzhoMjlka1FqVkhRaDNoOTluZmIwS3E1TDNyNA?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "椿油の複数ロットが発がん性物質検査に不合格、販売中止", "title_en": "Additional camellia oil batches fail carcinogen test; sales halted", "summary_ja": "椿油の複数ロットが発がん性物質の安全検査に不合格となり、当局が販売を中止した。この汚染発見は食用油市場の製品安全と品質管理に対する懸念を引き起こしている。消費者には詳細な調査が完了するまで、該当製品の使用を避けるよう勧告されている。", "summary_en": "Multiple batches of camellia oil have failed safety tests for carcinogenic substances, prompting authorities to suspend their sales. The contamination discovery raises concerns about product safety and quality control in the edible oil market. Consumers are advised to avoid affected products pending further investigation.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE51OUM5WFZYTWZDOU1wSVJWZVlVVUxlNDU3dThrV3ZRUGllTVR2YW9rZktzNG1hYkJZWGFNQnNSVTF0VFFwVENHVXlrRk81amdPbUtvUXZ3?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "スパイダーマンが台北の夏祭りで新たな「親友の街」に", "title_en": "Spider-Man Brings Summer Festival Fun to Taipei", "summary_ja": "スパイダーマンが台北の夏祭りの中心的存在となり、街を親友の街へと変えている。このスーパーヒーローをテーマにしたイベントは、あらゆる年代の住民と訪問者に娯楽とアクティビティを提供している。これは台湾の首都に国際的な魅力をもたらす大型ポップカルチャーアトラクションの一例である。", "summary_en": "Spider-Man has become the centerpiece of a summer festival in Taipei, transforming the city into his friendly neighborhood. The superhero-themed event offers entertainment and activities for residents and visitors of all ages. This marks another major pop culture attraction bringing international appeal to Taiwan's capital city.", "source": "Focus Taiwan", "tier": "paper", "link": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE1aRWFna0lhbzRVdWtudGhKdWh3eGZMaTlDcExWVDF1ckhmZ2F4eWd5ajNFclkzMWlFcnI5SXJZVnVLRTFwQWI1Y2Z0MkZ1b3BZTkduejhR?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "FAA、数百機のボーイング737 MAX機の座席検査が必要になる可能性があると報告", "title_en": "FAA Reports Seats on Hundreds of Boeing 737 MAX Jets May Need Inspections", "summary_ja": "FAA報道によると、数百機のボーイング737 MAX航空機の座席に潜在的な安全上の懸念があり、検査が必要になる可能性があるという。同機関の指令は、運航事業者が737 MAX機群の座席構成を調査すべきことを示唆している。この動きは、ボーイングが737 MAXプログラムに影響を与える様々な安全と品質の問題に対処し続けている中での展開である。", "summary_en": "The FAA reports that seats on hundreds of Boeing 737 MAX aircraft may require inspections due to potential safety concerns. The agency's directive suggests that operators should examine seat configurations across their 737 MAX fleets. This development comes as Boeing continues addressing various safety and quality issues affecting the 737 MAX program.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-07-28/news-1P8AG5h69S8/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "抗議デモ中の発砲でインド警察官が停職処分", "title_en": "Indian Police Officer Suspended for Opening Fire During Protest", "summary_ja": "CGTNが報じるところによると、抗議デモ中に発砲したインド警察官が停職処分を受けたという。当局はデモ中での銃器使用の状況について調査を進めている。負傷者の有無や抗議デモの性質など、詳細については明かされていない。", "summary_en": "CGTN reports that an Indian police officer has been suspended following an incident in which he opened fire during a protest. The suspension comes as authorities investigate the circumstances surrounding the use of firearms at the demonstration. Details regarding casualties or the nature of the protest have not been fully disclosed.", "source": "CGTN", "tier": "state", "link": "https://newsus.cgtn.com/news/2026-07-28/Indian-police-officer-suspended-for-opening-fire-during-protest-1P8aX18xWgw/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ブラジル、アルゼンチン大統領の批判を受けて駐アルゼンチン大使を召還", "title_en": "Brazil Recalls Ambassador to Argentina After Presidential Criticism", "summary_ja": "CGTNの報道によれば、ブラジル外務省は日曜日にアルゼンチン駐在大使フリオ・ビテッリ氏を両国の関係について協議するために召還した。この動きはアルゼンチン指導部によるブラジルのルーラ大統領への批判に続いたものである。CGTNは、この召還は南米の両国間の緊張を示していると報道している。", "summary_en": "CGTN reports that Brazil's Foreign Ministry recalled its ambassador to Argentina, Julio Bitelli, on Sunday for consultations regarding bilateral relations. The move follows criticism of Brazilian President Lula from Argentine leadership. CGTN reports the recall signals tensions between the two South American neighbors.", "source": "CGTN", "tier": "state", "link": "https://news.cgtn.com/news/2026-07-27/news-1P6THcrM8WA/p.html?UTM_Source=cgtn&UTM_Medium=rss&UTM_Campaign=World", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "イラン、米国が停戦と対話を提案したと報告", "title_en": "Iran Reports US Initiated Ceasefire and Dialogue Proposal", "summary_ja": "TASSによると、イランのカゼム・ガリババディ外務副大臣は、アメリカがイラン側に交渉提案をもたらしたと述べた。イラン当局者によれば、米国は敵対行為の停止と対話開始を目指した協議を開始したと報じられている。TASAは提案の具体的な詳細については追加情報を提供していない。", "summary_en": "TASS reports that Iranian Deputy Foreign Minister Kazem Gharibabadi stated the United States approached Tehran with a proposal for negotiations. According to the Iranian official, the Americans initiated discussions aimed at cessation of hostilities and the beginning of dialogue. TASS does not provide additional details on the specifics of the reported proposal.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/world/2166597", "state_media": true, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カムチャッカのシベルチ火山が再び灰を噴出", "title_en": "Kamchatka's Shiveluch volcano erupts, ash plume reaches 7,500 meters", "summary_ja": "タス通信によると、ロシアのカムチャッカ地域にあるシベルチ火山が大気中に灰を放出したと報告されている。同国営通信社が引用した地震データによれば、灰柱は海抜7,500メートルまで上昇したという。カムチャッカ半島に位置するこの火山はロシア最活発な火山システムの一つである。", "summary_en": "TASS reports that Russia's Shiveluch volcano in Kamchatka has expelled ash into the atmosphere. According to seismic data cited by the state source, the ash plume rose to an altitude of 7,500 meters above sea level. The volcano, located on the Kamchatka Peninsula, is one of Russia's most active volcanic systems.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2166595", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "カムチャツカ半島シベルチ火山、灰を9km上空に噴出", "title_en": "Kamchatka's Shiveluch volcano erupts with ash column reaching 9 km", "summary_ja": "TASSによると、ロシア・カムチャツカ半島の最北端に位置する活火山シベルチ火山が噴火し、火山灰が約9キロメートルの高さに達したと報じられている。ロシア当局がこの火山活動を監視している。シベルチ火山はカムチャツカ地域で最も活動的な火山の一つである。", "summary_en": "TASS reports that Shiveluch, the northernmost active volcano on Russia's Kamchatka Peninsula, has erupted with an ash plume reaching approximately 9 kilometers in height. The volcano's activity continues to be monitored by Russian authorities. Shiveluch remains one of the most active volcanoes in the Kamchatka region.", "source": "TASS/RT", "tier": "state", "link": "https://tass.com/emergencies/2166593", "state_media": true, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "金融安定性に対するAIの脅威", "title_en": "The AI Threat to Financial Stability", "summary_ja": "著者は、米国の金融システムがAIに対して危険なほど過度に集中投資されており、鉄道ブームやドットコムバブルのような歴史的バブルと同様のリスクを抱えていると主張している。連邦準備制度理事会の新しいAIタスクフォースは金融安定性のリスクに対処せず、雇用とインフレの委任事項のみに焦点を当てている。AI投資が現実的なリターンを上回った場合、債権者と株主が被害を受ける壊滅的な結果をもたらす可能性がある。", "summary_en": "The author argues that the US financial system has become dangerously overexposed to AI as a one-way bet, similar to historical bubbles like the railroad boom and dot-com crash. The Federal Reserve's new AI task force fails to address financial stability risks, focusing only on employment and inflation mandates. This oversight could lead to catastrophic consequences if AI investment outpaces realistic returns, wiping out creditors and shareholders.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/ai-bubble-threatens-financial-stability-by-brian-judge-2026-07", "state_media": false, "category": "オピニオン", "full_text": "The AI Threat to Financial Stability\nIn episodes like the railroad boom and the dot-com bubble, creditors and shareholders were wiped out, because investment in a genuinely transformative technology outpaced any plausible near-term return. With the US financial system and asset markets having become a one-way bet on AI, such an outcome today could be catastrophic.\nBERKELEY—US Federal Reserve Chair Kevin Warsh recently announced a new task force that will “survey the pace, the reach, [and] the economic impact of new general-purpose technologies, including AI, and explore the implications for the Fed” as it pursues its “employment and inflation mandates.” Notably absent from Warsh’s statement was any mention of the impact of AI on financial stability, the Fed’s de facto third mandate.", "translation_ja": "", "vocab": [{"word": "creditors", "definition": "債権者のこと。融資や信用を供与した側の人や団体を指す。金融危機では債権者が投資額を失うことが多い。"}, {"word": "transformative", "definition": "根本的な変化や転換をもたらす性質を持つ。ここでは業界や経済に大きな影響を与える技術を指す。"}, {"word": "de facto", "definition": "実際上、事実上という意味のラテン語。公式には定められていないが実質的に機能している状態を指す。"}, {"word": "outpaced", "definition": "~を上回る、~より速く進む。ここでは投資成長が実現可能なリターンを超えることを意味する。"}, {"word": "mandate", "definition": "職務や権限として与えられた任務。特に公式機関が果たすべき責務を指す。"}, {"word": "catastrophic", "definition": "破滅的な、壊滅的な。非常に大きな悪影響をもたらす状況を表す。"}]}, {"title_ja": "韓国が産業政策に再び賭ける", "title_en": "South Korea Bets on Industrial Policy Again", "summary_ja": "韓国政府は半導体、AI、ロボット工学などを振興する野心的な産業政策を復活させている。著者は、政府介入の成功の鍵は「方向性のある即興」、つまり事前に勝者を選別するのではなく実験の条件を整えることだと主張している。産業政策が世界的に流行している一方で、成果が不確実な中での効果的な実施が課題である。", "summary_en": "South Korea's government is reviving industrial policy to promote semiconductors, AI, and robotics as part of an ambitious strategy for future growth. The author argues that the key to successful government intervention lies in 'directed improvisation'—creating conditions for experimentation rather than attempting to pick winners in advance. While industrial policy is now globally fashionable, the challenge remains in implementing it effectively when outcomes are uncertain.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/south-korea-industrial-policy-necessary-but-difficult-to-succeed-by-lee-jong-wha-2026-07", "state_media": false, "category": "オピニオン", "full_text": "South Korea Bets on Industrial Policy Again\nWith industrial policy back in fashion worldwide, the question is not whether governments should intervene (they already do), but how they should proceed when they do not know in advance what will work. The answer lies in directed improvisation: creating the conditions for experimentation where it counts.\nSEOUL—Around the world, governments are again using the tools of industrial policy—subsidies, tax incentives, public finance, trade measures, and strategic regulation—to shape their economies. South Korea is no exception. President Lee Jae-myung’s government has launched an ambitious strategy to promote semiconductors, AI infrastructure, robotics, and other frontier industries, with the goal of bolstering future growth and competitiveness. But the path ahead is littered with obstacles.", "translation_ja": "", "vocab": [{"word": "industrial policy", "definition": "政府が特定の産業や企業を支援・育成するために実施する経済政策。補助金や税制優遇などの手段を用いて経済構造を意図的に形成する戦略。"}, {"word": "directed improvisation", "definition": "明確な方向性を持ちながらも柔軟に対応する戦略的なアプローチ。事前に完全な計画を立てるのではなく、実験を通じて学習・調整していく手法。"}, {"word": "subsidies", "definition": "政府が特定の産業や企業に対して提供する資金援助。競争力強化や産業発展を目的として給付される補助金。"}, {"word": "frontier industries", "definition": "最先端技術を用いた新興産業。AI、半導体、バイオテクノロジーなど、将来の経済成長を牽引すると期待される産業分野。"}, {"word": "strategic regulation", "definition": "政府が経済目標を達成するために特定の産業や市場に対して実施する戦略的な規制。経済成長や産業発展を意図した政策的介入。"}]}, {"title_ja": "アメリカは国際法に賭けをしている", "title_en": "America Is Betting Against International Law", "summary_ja": "米国はロシアのプーチン大統領の戦争犯罪で起訴するためICCと協力することから、イスラエルを保護するためにICCに対する激しいキャンペーンを展開することへと矛盾した転換をした。この一貫性の欠如は国際法に関する米国の立場を損なわせ、他国による世界的な法的機関の強化努力を加速させる可能性がある。", "summary_en": "The US hypocritically shifted from cooperating with the ICC to indict Putin for war crimes to launching an aggressive campaign against the ICC to protect Israel. This inconsistency undermines the US position on international law while potentially accelerating other nations' efforts to strengthen global legal institutions.", "source": "Project Syndicate", "tier": "opinion", "link": "https://www.project-syndicate.org/commentary/us-sanctions-icc-officials-bet-against-international-law-by-eric-alter-2026-07", "state_media": false, "category": "オピニオン", "full_text": "America Is Betting Against International Law\nAfter cooperating with the International Criminal Court to indict Russian President Vladimir Putin for war crimes, the US has shifted to waging a scorched-earth campaign against the ICC in the name of protecting Israel. But rather than halting international law’s progress, the US is merely handing the pen to other countries.\nABU DHABI—In 2023, US President Joe Bidenordered US intelligence agencies to share evidence of Russian war crimes with the International Criminal Court, with the goal of indicting Russian President Vladimir Putin. This marked a sharp break from precedent, as the United States had long insisted that the ICC could not exercise jurisdiction over citizens from countries that had not ratified the Rome Statute establishing the Court—a group that includes Russia and the US.", "translation_ja": "", "vocab": [{"word": "scorched-earth campaign", "definition": "徹底的で容赦のない作戦。相手に甚大な損害を与えるために、すべてを破壊する戦略のこと。"}, {"word": "ratified", "definition": "正式に承認または批准すること。政府や国家が国際条約や法律に正式に同意して実施すること。"}, {"word": "jurisdiction", "definition": "管轄権のこと。特定の裁判所や機関が法的権限を行使できる範囲や地域を指す。"}, {"word": "precedent", "definition": "先例や過去の事例のこと。将来の同様の状況の判断基準となる過去の決定や行動を意味する。"}, {"word": "halt", "definition": "停止させることや中止すること。進行中のプロセスや活動を一時的または永続的に止める。"}]}, {"title_ja": "新しい法廷ではなく既存法を使用して気候犯罪を起訴せよ", "title_en": "Prosecute Climate Crimes Using Existing Laws, Not New Tribunals", "summary_ja": "著者アーロン・レゲンバーグは、石油大手企業が気候危機を意図的に引き起こしながら一般大衆を欺いたと主張し、新しい国際法廷ではなく既存の刑事法（無謀危害罪や過失致死罪など）に基づいて起訴されるべきだと述べている。化石燃料企業は数十年前に壊滅的な害を予測していながら、気候変動否定を積極的に推進し、気候関連の死亡事故と災害に対して刑事責任を負うべきだと主張している。", "summary_en": "Author Aaron Regunberg argues that big oil companies knowingly caused the climate crisis while deceiving the public, and should be prosecuted under existing criminal laws like reckless endangerment and involuntary manslaughter rather than requiring new international tribunals. He contends that fossil fuel companies predicted catastrophic harms decades ago but actively promoted climate denial while protecting their own infrastructure, making them criminally liable for climate-related deaths and disasters.", "source": "Guardian Opinion", "tier": "opinion", "link": "https://www.theguardian.com/commentisfree/2026/jul/28/prosecute-climate-crimes-big-oil", "state_media": false, "category": "オピニオン", "full_text": "The sky outside is hazy orange, and my five-year-old son is screaming bloody murder. “Sorry, buddy, we have to stay inside,” I say. “It’s not safe to breathe out there.” I had told him we’d be going to the beach today. Something inside me tears a little as I wonder how many promises he’ll see similarly broken in the coming years.\nFar too many parents were forced to have some version of this conversation with their children this month, as smoke from record-breaking wildfires poured across the midwest and north-east. Some of them already had to tell their kids that their Fourth of July festivities were canceled because of the lethal heatwave that caused numerous mass casualty events earlier this month.\nAccording to scientists, these extreme weather events are not “natural” disasters. A team of researchers already published a study finding that the Fourth of July heat wave would have been “virtually impossible” but for the climate crisis. Other studies – using methods recently validated by the National Academy of Sciences, the country’s top scientific advisory body – found that the pollution from individual big oil companies such as ExxonMobil, Chevron, Shell and BP made some past climate-exacerbated heatwaves at least 10,000 times more likely compared with preindustrial levels.\nBig oil’s role in these disasters was no accident. Decades ago, these companies were predicting that their fossil fuels would cause, in their own words, “globally catastrophic” climate harms that would create “more violent weather” and cause “suffering and death due to thermal extremes”. Even as they used this knowledge to protect their own infrastructure, they orchestrated fraudulent campaigns of climate denial and deception to lock us into the disasters we are currently experiencing.\nIt’s no wonder, then, that climate harms are increasingly being interpreted not just as tragedies but as crimes. “We need Nuremberg trials for Big Oil,” wrote one climate advocacy group in a recent post that received tens of thousands of likes – and the sentiment has been echoed by many others.\nThe desire for an extraordinary tribunal is understandable given the scale of the harm. The Nazis were responsible for approximately 40m deaths; some analyses estimate that climate change will cause more than 1bn preventable deaths this century.\nBut we actually don’t need any special new legal innovations like the Nuremberg trials to begin to prosecute these climate crimes. In jurisdictions across the country, there are already criminal laws on the books that describe and proscribe big oil’s conduct in knowingly driving and deceptively covering u
