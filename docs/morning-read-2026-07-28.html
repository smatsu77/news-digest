Q1NwQnN3VlZvdnlZdG1WNU1GNVR2cWFtUlJJaUZYRW1mZktvSnNlQ29FZ21hUHh4UHg5ZjA4aWpyM3RiZVlneEpxcUljNEphc19fbTVNN29VQXpVOWhXWExpV3A2eGtrOXZyNkVVNGFWZHJSR2pPaXRZZW1sV2xxeklnR1dxdVYzcDhUX1Ra?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "コカ・コーラ、ワールドカップの水分補給タイムを評価し通期見通しを上方修正", "title_en": "Coca-Cola Lifts Annual Forecasts, Praises World Cup Hydration Breaks", "summary_ja": "コカ・コーラは通期の財務見通しを上方修正し、トーナメント中の水分補給タイムがもたらした好調さを称賛しました。同社は、スポーツイベントの定期的な水分補給休憩時における製品需要の増加が予想以上だったと述べています。この見通し上方修正は、消費者エンゲージメントと売上成長の継続に対するコカ・コーラの楽観的な見方を反映しています。", "summary_en": "Coca-Cola has raised its annual financial forecasts, citing positive momentum from World Cup hydration breaks that boosted beverage consumption during the tournament. The company attributed stronger-than-expected performance to increased demand for its products during the sporting event's scheduled water breaks. This forecast lift reflects Coca-Cola's optimistic outlook for continued consumer engagement and sales growth.", "source": "Reuters", "tier": "wire", "link": "https://news.google.com/rss/articles/CBMingFBVV95cUxPa3FLanZCQTZwX1RaRldJT0c4cTVhcE9mWW5YTDBRbXpTelNRMVdTWkVHbmxFbkFHNFVUZU90TGx0YjNCS21JUV9tajJIQllsdnlndHllUWpyOVB2ckoyVDVFelhLM0R6YTdKeENfV0dfdGkyM2NPUmZOSXZZc3RBZktsSXN5Rm05QmpZX0YzMTZBRmdaNXBLNGVjU1F2QQ?oc=5", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "フランス南西部の山火事が再発、40℃熱波に備える", "title_en": "Wildfires Flare Up in South-West France Ahead of 40C Heatwave", "summary_ja": "フランスのジロンド地域の消防士は、4度目の熱波が40℃の気温をもたらす中、7万人以上の避難を強いた山火事と戦っている。火災に見舞われた14か所で火が再発し、当局は状況が依然として深刻であると警告している。スペインとポルトガルも同様の極端な暑さと山火事の脅威に直面している。", "summary_en": "Firefighters in France's Gironde region are battling wildfires that have forced over 70,000 evacuations as a fourth heatwave bringing 40C temperatures approaches. Fourteen previously burned areas experienced new flare-ups on Tuesday, with officials warning the situation remains critical. Spain and Portugal are also facing similar extreme heat and wildfire threats.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/c5yd8gly1ydo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Wildfires in south-west France flare up as region braces for new 40C heatwave\n- Published\nFirefighters in France are working around the clock to contain wildfires that have been raging in the Gironde region, while bracing for another sharp rise in temperatures.\n\"The fire is like David against Goliath,\" said Eric Brocardi, spokesman of the national firefighters' federation.\nFour of his colleagues had died in recent weeks across France, he said, and 2,000 had been deployed in the Gironde to contain the flames, which for days have ravaged the countryside between the coastline and Bordeaux.\nAccording to regional prefect Sophie Brocas 14 places that had already been hit by the fires saw new flare-ups on Tuesday. \"We are not in the clear,\" she said.\nThis summer's fourth heatwave was expected to start by Wednesday, bringing temperatures in the area to 40C.\nSimilar temperatures are expected in Spain.\nDozens of communities are still threatened by wildfires that forced more than 70,000 to evacuate their homes over the last week - although many have now been allowed back.\nThe Madrid region has been especially affected, but Prime Minister Pedro Sánchez said while there were highly challenging hours and days ahead, light was beginning to appear \"at the end of the tunnel\".\nIn neighbouring Portugal, 400 firefighters were tackling a large fire on three active fronts in the eastern Guarda area.\nThe French city of Bordeaux is not currently under threat, according to officials, despite the fact that one of the wildfires burning on Monday came only 15km (9 miles) from the city's periphery.\nBut Commander Rémi Lassoureille, who is leading the firefighting response in the Gironde region, is still worried.\n\"We are frightened about the impact on Bordeaux and the metropolitan area,\" he said. Air quality in the city also deteriorated greatly.\n\"By Sunday evening everything had really begun to empty out,\" a holidaymaker from Essex told the BBC, adding that the air was \"really smoky\" with bits of ash. \"People were staying indoors, so it was eerie, and very sad.\"\nThe majority of residents and tourists were wearing masks and the smell of smoke clung on to clothes for days, she said.\nA firefighter \"got a round of applause\" as he walked through the Marché des Chartrons in Bordeaux where restaurants were having to close their doors because of the ash in the air, she added.\n\"The city has been very quiet,\" said Graham White, president of the Bordeaux British Community. \"The shops, restaurants and cafes are fairly empty... Interestingly on Sunday when there was still smoke, there were people brave enough to sit outside on terraces.\"\nWhite, who has been living in the area for several years, said this sort of event was \"something significant\".\nBut some news reports had suggested the situation in Bordeaux was \"akin to being the next Great Fire of London\", which was not the case, White added.\nHealth Minister Stéphanie Rist said the government was being \"very vigilant\" in terms of air pollution and urged people in the affected areas to stay indoors.\nOn Tuesday morning the Gironde prefect ordered a new evacuation of all camping sites near the coast at Lacanau, while those in the nearby town were allowed to stay put but told to prepare for sudden evacuation.\nAbout 4,000 tourists told to leave the area are in addition to the 220,000 people evacuated around France in recent days.\nAn estimated 240 homes and houses have been destroyed, officials have said.\nBy midday on Tuesday firefighters were already intervening in various parts of the region to tackle fires that were picking up again.\nA 23-year-old man who was arrested on suspicion of starting a fire in the Var region. is now facing 15 years' imprisonment. Interior Minister Laurent Nuñez said that 184 people had been arrested since 6 July in connection with the fires.\nPeggy Plouhinec, the general director of Château Picque Caillou - one of the few wine estates on the west side of Bordeaux - told the BBC that her business chose to close at the weekend because of the smoke, but that the situation had improved since then and that a bout of rain on Sunday night had helped.\nWhile her vineyards were not at risk, she said tourists had \"deserted\" the region.\n\"The hospitality sector will be impacted this summer, that's for sure,\" she added. \"What is happening is unprecedented. We're lucky that we haven't been too affected yet, but the business will still suffer from the lower numbers of tourists.\"\n\"But many people have lost their homes or their businesses, not to mention the firefighters who have been hard at work for weeks now and who must be exhausted.\"\nOne resident of Cap Ferret, which was evacuated late last week, told French media that his main concern now was for the peninsula he lived in, rather than the big city city inland.\n\"Everyone talks about saving Bordeaux, but in Bordeaux there's nothing but concrete. Have you ever seen concrete burn?\"\n\"Here, there are only trees... and when you see all that has ", "translation_ja": "", "vocab": [{"word": "flare up", "definition": "突然また激しくなる。特に火や紛争などが一度沈静化したかのように見えた後に再び激化することを指す。"}, {"word": "ravage", "definition": "甚大な被害を与える、破壊する。自然災害や戦争などが広い範囲に及ぼす大きな破壊を表す。"}, {"word": "prefect", "definition": "フランスの行政区（県）を統治する知事。行政官として地域の統治責任を持つ。"}, {"word": "vigilant", "definition": "警戒を怠らない、用心深い。危険性に対して常に注意を払い、対応する姿勢を表す。"}, {"word": "unprecedented", "definition": "かつてない、前例のない。過去に起きたことがない状況や事象を形容する。"}, {"word": "deteriorate", "definition": "悪化する、低下する。状況や品質などが徐々に悪くなることを意味する。"}]}, {"title_ja": "UEFA と英首相がインファンティーノ ワールドカップ計画を批判", "title_en": "Uefa and PM criticise Infantino World Cup plan", "summary_ja": "FIFAは新しい商業子会社へのプライベートエクイティ投資を提案しており、フットボール開発資金を100億ドル以上に拡大する計画ですが、UEFAと英国首相アンディ・バーナムから、ワールドカップを商業製品として扱うべきではないとの批判を受けています。この計画はFIFAの211加盟国の承認が必要であり、株主利益を生み出すためにワールドカップの頻度と規模の拡大につながる可能性があります。", "summary_en": "Fifa proposes inviting private investment into a new commercial subsidiary to expand football development funding beyond $10bn, but faces criticism from Uefa and UK PM Andy Burnham who argue the World Cup should not be treated as a commercial product. The plan requires approval from Fifa's 211 member nations and could lead to expansion of World Cup frequency and size to generate shareholder returns.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/sport/football/articles/c8xng9894z0o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "政治", "full_text": "Uefa and PM criticise Infantino World Cup plan\n- Published\nEuropean football's governing body Uefa and Prime Minister Andy Burnham have criticised proposals from Fifa to seek private investment in its competitions, including the World Cup.\nFifa - the sport's global governing body - said it intends to expand \"football development funding\" to more than $10bn (£7.5bn) and invite third-party investment in a new venture.\nThe story was first reported in the Financial Times and the Times, with the latter claiming the plans could potentially earn Fifa president Gianni Infantino tens of millions of pounds.\nIn a lengthy statement outlining the proposals, Fifa says it will \"invite third parties to make minority, non-controlling investments\" in a new subsidiary - Fifa Forward Enterprise (FFE) - to \"consolidate\" its commercial and event operations.\nThe plan still needs to be passed by a vote of Fifa's 211 member nations. But if approval is granted, Fifa says Thrive Eternal is expected to lead the proposed investor group for FFE.\nThrive is an American venture capital firm founded by Joshua Kushner, the brother of US President Donald Trump's son-in-law Jared.\nFifa sources have told BBC Sport there has been no discussion over Infantino, or anyone else, becoming chief executive of FFE.\nIn its statement, Fifa did say Infantino and the rest of the organisation \"has a duty\" to control the development of the project. Fifa has not said precisely what that means, or what the specific nature of Infantino's involvement will be.\nAs part of its pitch Fifa says all member associations will be able to access up to $20m (£15m) in \"one-off capital\" to fund development.\nInfantino said every nation should benefit from the riches football creates.\n\"Parts of the game have turned that popularity into remarkable commercial value - and we celebrate that success and want it to continue, because it lifts the whole game,\" he said.\n\"Our job is to make sure the rest of football grows with it: Fifa exists to support sustainable, inclusive development in every corner of the world.\"\nHowever, Uefa has issued a statement criticising the proposals, which it claimed \"crosses a line\".\nBurnham said going ahead with the idea would mean Fifa had \"sold out\".\nHe wrote on X: \"Let me say this very directly. Football does not belong to investors. It belongs to the people who fill the stands and who stand on the touchline week in, week out, rain or shine.\n\"The World Cup is not a product. It is the greatest competition in world sport, and it was never anyone's to sell. Dress the deal up however you like. Once you have sold a piece of it, you have sold out.\n\"Football belongs to the fans. It always has, and it always will.\"\nThe Football Association says it was unaware of Fifa's plans when they were released.\n'None of us are the owners of football'\nFifa argues its plan, with a dedicated commercial subsidiary, is similar to that used by governing bodies in other sports.\nIn 2018, Premiership Rugby announced a partnership with private equity and investment advisory firm CVC Capital Partners.\nHowever, Uefa sees Tuesday's announcement as a step too far - and raises the potential for further expansion of Fifa competitions in order to raise revenue, both in terms of size and frequency, which could threaten its own lucrative competitions.\n\"This crosses a line that football's governing institutions should never cross,\" Uefa said.\n\"Uefa takes it extremely seriously. So should every National Football Association. So should every stakeholder who cares about the future of the game.\n\"The soul and governance of football are not assets to trade - especially with zero transparency as to who gains financially. None of us are the owners of football. It is not Fifa's to sell.\"\nFifa says it would retain control of FFE \"and exclusive authority over football governance, competitions, the international match calendar and all regulatory and sporting decisions\".\nFootball finance expert Kieran Maguire told BBC Sport the proposals are \"an opportunity for Fifa to generate even more money\" and there are an \"awful lot of interested parties in the game who want a slice of the action\".\nHe added there was likely going to be pressure for a 64-team World Cup and for it to take place every two years if the FFE organisation is set up because it has \"got to make money in order to satisfy the shareholders\".\nThe matter is likely to be a topic of conversation at the next Fifa Council meeting in the autumn and then around the Fifa Intercontinental Cup, featuring Champions League winners Paris St-Germain, in December.\nThe proposal could be voted on by all 211 members at the Fifa Congress in Morocco in March.\nAnalysis: As big a deal as European Super League\nQuite aside from the unease many will feel at the potential involvement of private equity investors - and someone with close ties to Donald Trump - being at the centre of this, there is also a fight being played out for control of the game.\nFifa's stated aim of", "translation_ja": "", "vocab": [{"word": "subsidiary", "definition": "親会社に支配されている独立した会社。ここではFIFAが設立する子会社を指し、投資を管理するための別組織として機能します。"}, {"word": "minority stake", "definition": "企業の50%未満の所有権。投資家が支配権を持たない投資形態を意味します。"}, {"word": "crosses a line", "definition": "受け入れられない範囲を超える、限界を超えるという表現。ここでは許容できない行動をしていることを指します。"}, {"word": "governance", "definition": "組織の管理・統治方法。ルール、ポリシー、意思決定プロセスなどを含みます。"}, {"word": "equity", "definition": "企業の株式所有権、または投資ファンドの一種であるプライベートエクイティを指します。"}, {"word": "consolidate", "definition": "複数の事業やシステムを統合・一元化すること。ここではFIFAの商業活動を1つの組織に集約することを意味します。"}, {"word": "lucrative", "definition": "利益をもたらす、儲かる。UEFAの既存大会のように高い収益を生む事業を指します。"}]}, {"title_ja": "ガーナ最長身男性が逝去 「寛大で人気のある巨人」と追悼", "title_en": "Ghana Mourns Its Tallest Man, a 'Generous and Popular Giant'", "summary_ja": "ガーナ最長身男性のスレマナ・アブドゥル・サメド氏が、マルファン症候群の合併症によりタマレの病院で33歳で亡くなった。ニックネーム「アウーチェ」で知られ、身長は223cm（7フィート4インチ）であり、地元の著名人となっていた。彼の死はガーナ北部全域で悲しみを呼び起こし、故人の寛大さと故郷ガンバガ村にもたらした名声が称えられている。", "summary_en": "Sulemana Abdul Samed, Ghana's tallest man at 7ft 4in, has died at age 33 from complications related to Marfan syndrome in a hospital in Tamale. Known by his nickname Awuche, he had become a local celebrity and brought fame to his village of Gambaga despite struggling with medical bills and physical limitations. His death has prompted an outpouring of grief across northern Ghana, with residents acknowledging his generosity and the identity he gave to their community.", "source": "BBC World", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/crk52jk0131o?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Ghana mourns its tallest man - a 'generous and popular giant'\n- Published\nThe death of Sulemana Abdul Samed, Ghana's tallest man, has prompted an outpouring of grief especially in the north of the country where his height had made him a local celebrity.\nThe 33 year old died in hospital on Monday in the northern city of Tamale, about 160km (100 miles) south of his home village of Gambaga, where he had been admitted because sores on his legs had become infected.\n\"Everyone knew how generous and kind he was. From when he died until now a lot of people are still coming to the house to find out what exactly happened,'' a relative, Sulemana Abdul Kudus, has told the BBC.\nDiagnosed with gigantism in his 20s, he was 7ft 4in (223cm) tall when measured by the BBC in 2023.\n- Could this be the world’s tallest man? - Published2 January 2023\n \nIt is likely he had grown even taller before his death.\nKnown to everyone by his nickname Awuche, which means \"Let's Go\" in the Hausa language, he had long struggled with complications of Marfan syndrome, the genetic disorder which resulted in his extremely long limbs.\nHe had also struggled to pay his medical bills, but recently found a benefactor in the brother of Ghana's President John Mahama, who also met the giant of Gambaga.\nA successful businessman, Ibrahim Mahama had offered to cover his medical bills at the Tamale Teaching Hospital - and earlier this month gave an update on the planned treatment.\nKudus told the BBC the sores on Ache's legs were not directly caused by Marfan syndrome - but likely to be a complication caused by his condition.\nHe had died on Monday morning at the hospital despite doctors saying he had been responded well to treatment.\n\"Everyone is just sad,\" Kudus said, adding that the residents of Gambaga were shocked by his sudden death.\nAwuche had made their village famous.\n''Anywhere he found himself in the country and they asked him, he would say he is from Gambaga and people knew that was where the tallest man was from. It gave the community identity, and he was popular as well,\" Kudus said.\nAwuche had not always been unusually tall - it was at the age of 22 that he started to grow quicker than his peers.\nHe told the BBC he had been working at a butchers in Ghana's capital city, Accra, when he first started to notice changes.\n\"I realised my tongue had expanded in my mouth to the extent that I could not breath [properly],\" he said.\nDays later he realised every other part of his body had started increasing in size. Awuche was eventually diagnosed with Marfan syndrome, which affects the body's connective tissues.\nNine years ago, his height forced him to give up his dreams of becoming a driver and return to Gambaga.\nHe said that Marfan syndrome had also curtailed his social life, adding: \"I used to play football like every other young man, I was athletic but now I cannot even walk short distances.\"\nHowever, at the time of the BBC's report, he seemed to maintain a positive outlook on life and enjoyed his celebrity status.\nThe family said they had decided to bury Awuche in Tamale instead of Gambaga as the village would have been overwhelmed with mourners.\nAdditional reporting by Favour Nunoo\nMore BBC stories about Ghana\n- How Ghana's central bank lost $5bn in one year - Published6 October 2023\n \n- Turning an iconic plastic bag into high fashion - Published19 November 2020\n \n- 'I was duped into leaving London for school in Ghana - but it saved me' - Published16 March 2025\n \n- Ghana opens up visa-free travel to all Africans - Published3 January 2025\n \nGo to BBCAfrica.com, external for more news from the African continent.\nFollow us on Twitter @BBCAfrica, external, on Facebook at BBC Africa, external or on Instagram at bbcafrica, external", "translation_ja": "", "vocab": [{"word": "gigantism", "definition": "極度の身長や体の大きさの異常な成長。通常、下垂体ホルモンの過剰分泌によって引き起こされる医学的状態を指す。"}, {"word": "Marfan syndrome", "definition": "結合組織に影響を与える遺伝的疾患で、異常に長い手足、背の高さ、眼や心臓の問題を特徴とする。"}, {"word": "complication", "definition": "基礎疾患または治療によって引き起こされた追加的な健康問題。医学用語として、元の病気をさらに悪化させる状態を意味する。"}, {"word": "benefactor", "definition": "他者に援助や資金を提供する人。慈善的な支援者を指し、特に経済的支援を行う個人に用いられる。"}, {"word": "curtailed", "definition": "何かを短縮する、制限する、または減らす。自由や活動の機会が制限されている状況で使用される。"}, {"word": "outpouring", "definition": "感情や感情の強い、大量の表現。特に悲しみ、喜び、または公の支持が大量に表現される場合に使用される。"}]}, {"title_ja": "子どもが見習い制度を開始する場合、給付金受給中の親に年最大4,500ポンドが支給される", "title_en": "Parents on Benefits to Receive Up to £4,500 for Child Starting Apprenticeship", "summary_ja": "英国政府は、見習い制度を開始する子どもを持つ給付金受給家庭に年最大4,500ポンドを支給する予定です。この制度は、見習い制度開始による給付金の減少に対応し、教育・雇用・訓練に従事していない若年層（NEET）の数を減らすことを目的としています。3,000万ポンド規模の制度は、年間給与総額が300万ポンドを超える雇用主に対する成長・スキル課税により資金が賄われます。", "summary_en": "The UK government will provide up to £4,500 annually to parents on benefits whose children start apprenticeships, addressing the loss of Universal Credit payments. The bursary aims to remove financial barriers preventing young people from pursuing apprenticeships and reduce the number of youth not in education, employment, or training (NEET). The £30m scheme will be funded through a growth and skills levy on employers with annual wage bills exceeding £3m.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cwy4v6e9d2go?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Some parents on benefits to get up to £4,500 for child starting apprenticeship\n- Published\nSome parents on benefits will be given up to £4,500 a year to encourage their children to start apprenticeships, the government has said.\nUnder plans to encourage young people into work, families will be offered a bursary to replace Universal Credit payments lost by starting jobs.\nThe payment is expected to benefit an estimated few thousand households, who currently face losing between £17 and £330 a week if their children start apprenticeships.\nThe Conservatives welcomed Prime Minister Andy Burnham's support for apprenticeships, but criticised his plans to fund the bursaries.\nThe bursary will be paid for from a £30m pot, funded through the growth and skills levy, a tax on employers with annual wage bills over £3m.\nIt followed the publication of a Social Security Advisory Committee report, external which warned of the \"perverse effects\" of the benefits system on young people's employment choices.\nIt said, for example, single parents with a disabled child could lose up to £340 per week in benefits if their child started an apprenticeship, exceeding the expected apprenticeship salary of £258 per week.\nBecause they are classed as paid employment, benefit payments are reduced to households where young people take on apprenticeships.\nThe committee said the system was hampering government efforts to reduce the number of young people not in education, employment or training (Neet).\nIn a recent report, former Health Secretary Alan Milburn warned that one in six young people could be Neet in the next five years unless urgent action is taken.\nOfficial figures show more than a million people aged 16 to 24 are currently Neet.\nThe government said its new bursary would remove a barrier to young people taking on apprenticeships, allowing them to \"earn and learn\".\nWork and Pensions Secretary Pat McFadden said: \"By providing bursaries to those who need them most and fully funding apprenticeship training, we are making sure cost is not the reason someone misses out.\"\nIt is part of a wider package of support for apprenticeships, including funding for apprenticeship training for under-25s and additional support for employers taking on apprentices.\nHelen Whately, the Shadow Work and Pensions Secretary, said: \"I'm glad Burnham agrees: apprenticeships are a good thing, and we need more of them.\"\nBut she said the plan was \"uncosted\".\n\"It is spending money already committed elsewhere. So, either it is another unfunded announcement, or Andy Burnham is not being straight with us about his plans.\"\nBurnham has said he is \"on a mission\" to reduce the number of Neets.\n\"The trend is rising at the moment, so the first thing I've got to do is to stop that rise,\" he said.\nAs he continues a flurry of early policy announcements, Burnham on Tuesday set out plans to strike a balance in the education system between prioritising academic and technical skills.", "translation_ja": "", "vocab": [{"word": "bursary", "definition": "学生や困窮者に対して教育機関や慈善団体から支給される奨学金または援助金。この記事では、見習い制度に参加する若者の家計を支援するための給付金を指します。"}, {"word": "perverse", "definition": "意図した結果とは反対の望ましくない効果をもたらす、または不適切な方法で機能する。ここでは、給付制度が若年層の就職を妨げる逆効果を生じさせていることを指します。"}, {"word": "levy", "definition": "政府または公的機関が法律に基づいて課す税金または徴収金。記事では、雇用主に課される成長・スキル課税を指します。"}, {"word": "NEET", "definition": "Not in Education, Employment or Trainingの略。教育、雇用、訓練のいずれにも従事していない若年層を指す統計用語です。"}, {"word": "apprenticeship", "definition": "若年層が実務経験を通じて職業技能を習得する制度。雇用主の下で働きながら賃金を得て学ぶことが特徴です。"}, {"word": "hampering", "definition": "何かの進行を妨げる、または遅延させる。記事では、給付制度が政府の政策目標達成を阻害していることを意味します。"}]}, {"title_ja": "フランス海軍がBBCのインタビュー中に発砲", "title_en": "French Navy fires shots during BBC interview with UK politician", "summary_ja": "フランス海軍の巡視艇がイギリス海峡でBBCのインタビュー中に警告なしで17発の銃撃を行いました。小型船の密航に関するインタビューを受けていた保守党議員クリス・フィルプは、これは移民密航の報道を止めさせるための威嚇行為だと主張しました。フランス当局は定期的な訓練演習と説明しています。", "summary_en": "A French Navy patrol boat fired 17 gunshots without warning near a BBC interview with Conservative MP Chris Philp about small boat crossings in the English Channel. French authorities claimed it was a routine training exercise, but Philp dismissed this as intimidation to prevent coverage of migrant crossings.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cy4ker2y1mko?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "French Navy carries out 'shooting drill' mid interview\n- Published\nA French Navy patrol boat appeared to fire a round of gunshots \"without warning\" in the English Channel during a BBC interview with the UK shadow home secretary.\nConservative MP Chris Philp was being interviewed about small boat crossings by BBC journalist Michael Keohan as a French warship passed by at 09:15 BST (10:15 CET), about three miles from the French coast.\nKeohan said there were 17 shots but \"no warnings\" from the boat about 300m away, which left Philp believing it was an intimidation tactic to \"stop us covering migrant crossings\".\nThe French authorities said it was part of a training exercise, unrelated to the presence of a British ship, which it said was out of range of fire.\nPhilp dismissed this claim as \"not credible\", adding: \"There were no warnings in place about live firing training exercises.\n\"It looked and sounded exactly like deliberate intimidation.\"\nThe captain of the fishing boat which hosted the interview, Matt Coker, said he had \"never seen anything like it before\".\nThe French authorities said the boat, PSP Flamant, was not engaged in an operation to monitor migrant boats.\nKeohan said there were 17 shots, adding: \"There was no warning for our boat, no signs given that this was the French's intention.\"\nPhilp said it \"felt to me like an attempted intimidation to stop us covering migrant crossings\".\nAt sea, Keohan described it as \"the most unusual moment... in the quiet of the Channel\" when the gunshots rang out mid-interview.\nA French patrol officer at the back of the boat was seen pointing a pistol towards the sea. It is believed that is where the shots came from.\nKeohan, who was on board the vessel with a reporter from The Times, added: \"There was no warning for our boat, no signs given, that this was the French's intention.\n\"Even now it's still not clear what the patrol boat was aiming at.\"\nAfter the incident, Philp said: \"It is extraordinary that the French Navy will fire live rounds to defend their waters against a visiting British politician but cannot bear to do anything about stopping illegal Channel crossings.\n\"If France showed people smugglers half the seriousness they showed me, the boats would stop.\n\"Instead, the French wave them through and pass them off to the British coastguard so it's our problem.\"\nHe said he would be raising the issue with the French ambassador.\n'Normal activity'\nA UK government spokesperson said: \"This is a matter for the French authorities.\"\nThe French authorities said a handgun shooting exercise had taken place by the public service patrol boat Flamant off the coast of Cap de Gris-Nez.\nA spokesperson said: \"In order to maintain their high level of operability in the current international context, the units of the French Navy train regularly.\n\"Individual training of the combatant is part of the normal activity of a ship in operations.\n\"The regulatory signals as provided for by international standards for this shooting exercise were displayed, and the safety gauge was respected.\n\"This exercise is unrelated to the presence of a British ship in the area, which was out of range of fire.\n\"The PSP Flamant was not engaged in an operation to monitor migrant boats.\"\nEarlier this month, a Russian warship, shadowed by a Royal Navy vessel, carried out a live-fire artillery exercise just 46 miles (74km) south of Plymouth.\nFollow BBC Kent on Facebook, external, on X, external, on Instagram, external and listen to BBC Radio Kent on Sounds. Send your story ideas to southeasttoday@bbc.co.uk, external or WhatsApp us on 08081 002250.\nRelated topics\n- Published7 days ago", "translation_ja": "", "vocab": [{"word": "operability", "definition": "装置や兵器システムが機能する能力。「高い作戦能力を維持する」のように軍事・技術分野で使用される。"}, {"word": "combatant", "definition": "戦闘員、交戦者を意味する。「戦闘員の訓練」は軍事訓練の個人的側面を指す。"}, {"word": "regulatory signals", "definition": "国際的な規則に従った信号。航海や軍事演習時に安全基準として使用される通知や警告信号。"}, {"word": "gauge", "definition": "測定基準、尺度を意味する。\"safety gauge\"は安全基準や安全限度を指す。"}, {"word": "intimidation tactic", "definition": "相手を脅すための戦術。威嚇による圧力で特定の行動をやめさせようとする方法。"}, {"word": "credible", "definition": "信じられる、信頼できるという意味。\"not credible\"は説明や主張が信じがたい場合に使用される。"}]}, {"title_ja": "母親が警察から赤ちゃんの遺灰は動物の遺骨だと告げられる", "title_en": "Mother Told Baby's Ashes Were Animal Remains by Police", "summary_ja": "葬儀社長ロバート・ブッシュから渡された遺灰が警察から動物の遺骨である可能性が高いと告げられた悲嘆に暮れた母親。ブッシュは67件の犯罪で起訴されており、遺族に適切な埋葬を否定し、他人の遺灰を提示したことが含まれている。この事件は英国の葬儀業界の規制を求める声を高めている。", "summary_en": "A grieving mother was devastated to learn from police that ashes given to her by funeral director Robert Bush were likely animal remains, not those of her miscarried baby. Bush is being sentenced for 67 offences including denying families proper burials and presenting them with strangers' ashes. The case has sparked calls for regulation of the funeral industry in the UK.", "source": "BBC UK", "tier": "public", "link": "https://www.bbc.co.uk/news/articles/cly5jvegxeqo?at_medium=RSS&at_campaign=rss", "state_media": false, "category": "社会", "full_text": "Grieving mum was told baby's ashes were animal remains\n- Published\nA woman who suffered a miscarriage says she was told by police ashes returned to her by funeral director Robert Bush were \"animal remains\".\nThe BBC understands police were unable to verify the origin of the ashes, but believed they may not be human.\nLucy Ness, 28, told the BBC: \"Police visited to tell me that the ashes that he had given me were animal remains.\"\nBush, 48, is being sentenced at Hull Crown Court for 67 offences, including denying 30 people a decent and proper burial and fraud charges relating to presenting families with the ashes of strangers.\nNess suffered a miscarriage just before she was due to have her 12-week scan on April 20 2021.\nShe told how she had treasured the ashes for three years.\n\"They had sat on my shelf next to my baby scan,\" said Ness.\nIn court, prosecutor Chris Paxton KC said \"the ashes that Lucy was given could not have been those of her baby\".\nThe barrister did not state that they were of animal origin.\nNess was clear to the BBC, however, that police had told her the ashes were animal remains.\nHer disgust at Bush was clear.\nShe said: \"How can somebody with a duty of care do this to my family?\"\nShe and her partner, Callum Ellerby, were told their baby was cremated on 10 May 2021.\n\"We didn't know the gender,\" said Ness. \"We were not going to know the gender.\"\nThe day after the cremation was meant to have taken place, Bush, from Legacy Independent Funeral Directors, rang her and asked her to collect the ashes, which she did.\nThey were contained in a white china urn with a teddy bear embossed on it, Ness recalled.\nWhen Humberside Police announced they were investigating Legacy in March 2024, Ness rang the helpline set up for anyone concerned.\nThe force then contacted her to say the ashes she had in her home could not be that of her baby, she said.\nOfficers explained to Ness that they had checked records at the crematorium and found Bush collected the baby's ashes on 13 May - two days after he had presented Ness and Ellerby with the urn.\nShe said: \"I have felt very up and down. This has definitely impacted on my mental health.\"\nBush, who was arrested at Heathrow Airport after returning from a holiday in the US, was not charged with denying Ness's baby a burial because of the age of the foetus.\nBut Ness said: \"All babies need to be recognised. A baby is a baby.\"\nShe has now joined growing calls for regulation of the funeral industry.\n\"There is regulation with doctors, nurses, dentists... anyone with a duty of care but none applied to him [Bush],\" said Ness. \"I definitely think there needs to be regulation.\n\"I am never going to know what happened to my baby. He [Bush] probably does not know because he has done it to so many other other.\n\"But I hope my baby's remains are with someone who loves them like I loved these.\"\nListen to highlights from Hull and East Yorkshire on BBC Sounds, watch the latest episode of Look North.\nGet in touch\nYour Voice\nDownload the BBC News app from the App Store, external for iPhone and iPad or Google Play, external for Android devices\n- Published2 April\n \n- Published2 April\n \n- Published5 September 2025\n \n- Published17 October 2025\n \n- Published9 March 2024", "translation_ja": "", "vocab": [{"word": "miscarriage", "definition": "妊娠中の胎児が自然に失われること。通常は妊娠20週以前に起こる自然流産を指す。"}, {"word": "cremated", "definition": "遺体を火葬すること。火葬により遺灰に変えられるプロセスを表す。"}, {"word": "embossed", "definition": "表面に浮き彫りで図案や文字が施されていること。装飾的な効果を出すため。"}, {"word": "foetus", "definition": "妊娠中の発生途上の人間。一般的には妊娠8週目から出生までの段階を指す。"}, {"word": "regulation", "definition": "業界や職業における公式な規則や基準。違反行為を防ぐためのルールの体系。"}, {"word": "duty of care", "definition": "法的責任として人々の安全と福祉を保護する義務。専門職が負う倫理的責任。"}]}, {"title_ja": "ネタニヤフ首相がトランプ大統領との会談を「優秀」と称賛、イラン情勢は緊迫", "title_en": "Netanyahu hails 'excellent' Trump meeting as Iran tensions escalate", "summary_ja": "イスラエルのネタニヤフ首相がトランプ大統領と90分間の会談を行い、米国大統領との会談の中で最高のものの一つだと述べ、イランの核兵器獲得防止に焦点を当てた。一方、中東の緊張は高まり、フーシ派反政府勢力がサウジアラビアの石油タンカーを紅海で攻撃し、EUはイランによるフランス外交官への暴力行為を非難した。イランの外相はオマーンとサウジアラビアとホルムズ海峡の安定性に関する外交交渉を行った。", "summary_en": "Israeli Prime Minister Benjamin Netanyahu met with President Trump for 90 minutes, describing the discussion as one of his best conversations with the US president, focusing on preventing Iran from obtaining nuclear weapons. Meanwhile, tensions in the Middle East intensified as Houthi rebels attacked a Saudi oil tanker in the Red Sea and the EU condemned Iranian aggression against French diplomats. Iran's foreign minister engaged in diplomatic talks with Oman and Saudi Arabia regarding stability in the Strait of Hormuz.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/iran-war-netanyahu-hails-closed-door-meeting-with-trump/live-78137927?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Iran war: Netanyahu hails closed-door meeting with Trump\nPublished July 28, 2026last updated July 28, 2026What you need to know\n- Benjamin Netanyahu arrives in Washington\n- Israeli PM meets President Trump for the first time since the start of the Iran war\n- Netanyahu hails 'excellent' meeting with Trump\n- Trump also meets with Ukraine's Volodymyr Zelenskyy\n- Iran executes two men in relation to January protests\n- US sets date for next Israel-Lebanon talks\nRead below for the latest developments concerning the Iran war and the wider Middle East on Tuesday, July 28:\nTired of missing our real-time updates? Click here to add us as a Preferred Source on Google. Then tap the \"Star\" or \"Preferred\" to keep DW News at the top of your feed.\nHouthis claim they fired ballistic missiles at Saudi Red Sea tanker\nYemen's Houthi rebels on Tuesday claimed to have forced a Saudi-flagged oil tanker identified as the NCC Ghazal to turn around in the Red Sea as part of a naval blockade declared by the Iran-backed group.\n\"The targeting of the Saudi vessel [with ballistic missiles] came after it ignored warnings,\" a Houthi spokesman said.\nSaudi Arabia, which claimed to have shot down drones in another incident targeting oil facilities, did not comment on the Houthi statement.\nThe pro-Iran Houthis declared last week a maritime blockade on Saudi Arabia, threatening to further choke the kingdom amid an existing Iranian blockade of the strategic Strait of Hormuz.\nNetanyahu, Trump cite 'positive and productive' closed-door meeting\nIsraeli Prime Minister Benjamin Netanyahu and US President Donald Trump and their teams praised cooperation between their two administrations after a closed-door meeting in the Oval Office on Tuesday.\nThe sit down, the first since the start of the US-Israeli war on Iran, looked likely to go either way before Netanyahu arrived for Senator Lindsey Graham's funeral, with Trump boisterously complaining about the Israeli leader in public, most notably on Fox News.\nTuesday's talks, which lasted for 90 minutes, were described as \"positive and productive\" by the White House.\nIn a social media video posted after the meeting, Netanyahu called it \"one of the best conversations I've ever had with the president of the United States,\" adding that it touched on \"our common goal: ensuring that Iran does not obtain nuclear weapons.\"\nTuesday's meeting comes ahead of elections in Israel. The Reuters news agency cited unnamed sources as saying Netanyahu aimed to get Trump's support for his reelection campaign ahead of the October 27 vote.\nEU rejects Iran 'aggression' against French diplomats\nThe EU's foreign policy chief Kaja Kallas said in a statement that the bloc condemned an \"aggression\" this month by Iranian security services against two French diplomats in Tehran.\n\"The EU unequivocally condemns the aggression against two diplomats of the Embassy of France in Tehran perpetrated by Iranian security forces on July 19,\" Kallas said.\n\"Such acts constitute a blatant violation of the Vienna Conventions and jeopardize the very conduct of diplomatic relations,\" she added. Kallas was referring to the 1961 Vienna Convention on Diplomatic Relations.\nFrance said its diplomats were detained in Iran for no particular reason and had suffered \"an extremely serious act of intimidation\" by Iranian security services, with one of them physically abused.\nFor its part, Iran's foreign ministry said it had summoned the French ambassador on Monday to protest the conduct of the diplomats.\nIN DEPTH: Who is still transiting the Strait of Hormuz?\nThe Strait of Hormuz has become one of the world's most dangerous waterways since March, when Iran began attacking shipping vessels as a pressure tactic in its ceasefire talks with the United States.\nA significant proportion of the global oil trade has ended up bottlenecked at the strait — but shipping traffic has never completely halted.\nWho is still risking the dangerous passage through the Strait of Hormuz — and why?\nRead DW's in-depth analysis to find out more.\nIran discusses Strait of Hormuz with Oman, Saudi Arabia\nIranian Foreign Minister Abbas Araghchi discussed the status of the Strait of Hormuz in separate phone calls with his Omani and Saudi Arabian counterparts on Tuesday.\nA statement from the Iranian foreign ministry said Araghchi \"emphasized the need to strengthen cooperation and advance joint diplomatic efforts to establish stability in the region, and lift the insecurity imposed on the Strait of Hormuz due to the aggressive actions of the United States.\"\nAn unnamed Gulf source told the Reuters news agency that Omani foreign minister Badr al-Busaidi had presented a proposal to Araghchi for a joint regional mechanism to manage the key waterway.\nThe proposal is reportedly based on the model used to regulate the Strait of Malacca between Malaysia, Indonesia and Singapore, which uses a system of voluntary fees to fund navigation, environmental protection and search and rescue.\nThe proposal would ensu", "translation_ja": "", "vocab": [{"word": "blockade", "definition": "特定の地域や国への物資やアクセスを遮断する行為。ここではイランとフーシ派によるサウジアラビアへの経済的圧力を指します。"}, {"word": "perpetrated", "definition": "犯罪や悪質な行為を実行すること。「~によって犯された」という受動態で使われることが多いです。"}, {"word": "blatant", "definition": "明らかで厚かましい、ひどく明白な。違反や無視などが非常に目立つ場合に用います。"}, {"word": "ceasefire", "definition": "戦闘の停止、休戦。紛争当事者間の一時的または永続的な武力衝突の中断を意味します。"}, {"word": "diplomatic relations", "definition": "国家間の公式な関係と相互作用。大使館や外交官を通じて行われる国際的な交渉や協力です。"}, {"word": "mechanism", "definition": "目的を達成するための組織的なシステムまたは手段。ここではホルムズ海峡を管理する仕組みを指します。"}]}, {"title_ja": "ゼレンスキー大統領がトランプ氏と会談、ウクライナが防空能力の強化を要求", "title_en": "Zelenskyy Visits Trump Seeking Stronger Air Defense for Ukraine", "summary_ja": "ウクライナのゼレンスキー大統領がトランプ大統領とホワイトハウスで会談し、ロシアの激化する攻撃に対抗するための防空システムと戦略的協力の必要性を協議した。この会談はパトリオット迎撃システムのライセンス生産と外交努力の再開に焦点が当てられ、実務的で前向きなものとなった。ウクライナとロシアは外交交渉が膠着状態の中、長距離兵器による攻撃を相次いで強化している。", "summary_en": "Ukrainian President Zelenskyy met with President Trump at the White House to discuss Ukraine's urgent need for stronger air defense systems and strategic cooperation against intensifying Russian attacks. The meeting, described as productive, focused on licensing Patriot interceptor production and reinvigorating diplomatic efforts to end the war. Both Ukraine and Russia have escalated long-range strikes as diplomatic negotiations remain stalled.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/zelenskyy-visits-trump-as-ukraine-seeks-stronger-air-defense/a-78138704?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Zelenskyy visits Trump as Ukraine seeks stronger air defense\nJuly 28, 2026Ukrainian President Volodymyr Zelenskyy arrived in the United States for talks with President Donald Trump on Tuesday, saying Kyiv's top priority was securing stronger air defense and strategic cooperation as Russia intensified attacks.\nTrump welcomed Zelenskyy to the White House late on Tuesday morning local time, ahead of the funeral for Senator Lindsey Graham, a staunch supporter of Ukraine, who passed away earlier this month.\nImages taken from behind the fences at the White House showed Zelenskyy exiting a car ready to enter the building.\nWhite House press secretary Karoline Leavitt described the meeting, which was behind closed doors, as \"positive and productive.\"\nZelenskyy thanked Trump for the \"good meeting,\" hailing the Republican administration's support to Kyiv in its war against Russia.\n“The President and I discussed licenses for Patriot interceptor production and several other ideas that could help,” said Zelenskyy on X. “We also spoke about diplomacy — it’s important that the diplomatic process be reinvigorated.”\n\"Our number-one priority is anti-ballistic defense and strategic cooperation with America. Peace needs to be brought closer,\" Zelenskyy had said in a post on X after arriving in the US.\nUS-Ukraine deal on Patriot production recently announced\nThe long-strained relations between Trump and Zelenskyy have shown modest signs of improvement in recent weeks.\nSince returning to office in January last year, Trump largely stopped direct US arms shipments to Ukraine, instead leavingEuropean allies to buy American weapons and supply them to Kyiv.\nHowever, Washington remains a key ally, providing intelligence and access to the Starlink satellite network used by Ukrainian frontline troops to communicate.\nIn a sign of improving ties, Trump, in a meeting with Zelenskyy in Turkey earlier this month, pledged to help Ukraine produce Patriot air defense systems, and said Kyiv would be able to produce them \"pretty quickly.\"\nThis has been a long-running request from Kyiv in order to counter Russian missile attacks.\nKyiv and Moscow ramp up long-range strikes\nMore than four years have passed since Russia's full-scale invasion of Ukraine.\nAmid stalled diplomatic efforts to end the war brokered by the Trump administration, both sides have stepped up long-range strikes.\nRussia said on Tuesday that more than 390 Ukrainian drones targeted the Moscow region overnight, damaging residential buildings.\nRussian state media also reported that Russian forces struck two vessels, including a ship in the Black Sea that Moscow claimed was transporting military supplies for Ukraine, according to Reuters.\nEdited by: Dmytro Hubenko\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "intensified", "definition": "激化した、強められたという意味。ここではロシアの攻撃がより強くなっていることを表す。"}, {"word": "strained", "definition": "緊張した、ぎくしゃくした関係を表す。トランプとゼレンスキーの関係が以前良くなかったことを示す。"}, {"word": "reinvigorated", "definition": "活気を取り戻した、新たに活発にしたという意味。ここでは外交努力を再び活発にすることを指す。"}, {"word": "brokered", "definition": "仲介した、仲立ちをしたという意味。トランプ政権が和平交渉の仲介役を務めたことを表す。"}, {"word": "interceptor", "definition": "迎撃システムまたは迎撃ミサイルを意味する。敵のミサイルを撃ち落とすために使用される。"}]}, {"title_ja": "ガイアナのフェリー沈没事故：船長と乗組員が殺人罪で起訴", "title_en": "Guyana Ferry Captain and Crew Charged with Murder After Capsizing Kills 73", "summary_ja": "2026年7月18日のMVバリマ号フェリー沈没事故で、船長を含む3名の乗組員が殺人罪で正式に起訴されました。この事故はガイアナ史上最悪の海難事故であり、73人が死亡、30人が行方不明となっています。推定179人を乗せていたフェリーは積載過剰で、沈没時に浸水していたと報告されています。政府は国際的な専門家で構成される調査委員会を設置し、港湾・フェリー事業に責任を持つ政府関係者の辞任を求める野党の声が高まっています。", "summary_en": "Three crew members of the MV Barima ferry have been formally charged with murder following the vessel's capsizing on July 18, 2026, which killed 73 people and left 30 missing in Guyana's worst maritime disaster. The ship, carrying an estimated 179 passengers despite being designed for fewer, was reportedly overfilled and leaking when it sank. A government commission of international experts has been established to investigate the incident, while opposition lawmakers demand resignations from officials overseeing port and ferry services.", "source": "Deutsche Welle", "tier": "public", "link": "https://www.dw.com/en/guyana-captain-crew-charged-with-murder-in-ferry-capsizing/a-78151552?maca=en-rss-en-all-1573-rdf", "state_media": false, "category": "政治", "full_text": "Guyana: Captain, crew charged with murder in ferry capsizing\nJuly 28, 2026Police in Guyana have formally charged three individuals with murder in connection with the capsizing of a passenger ferry that left 73 people dead and a further 30 missing on July 18.\nThough the vessel had no passenger manifest, it is thought to have been carrying 179 people at the time it sank on its journey between Guyana's capital, Georgetown, and the northwestern village of Port Kaituma, near neighboring Venezuela.\nAuthorities say 76 passengers and crew were rescued when the vessel sank in what was the worst maritime disaster ever recorded in the South American country.\nOn Tuesday, the ship's captain and two crew members were formally charged at a Georgetown courthouse and remanded to prison.\nThe men were not required to enter pleas, had no legal representation, and will appear before the court once again on August 3.\nFollowing the accident, Prime Minister Mark Phillips said the three men had tested positive for marijuana use.\nOpposition demands resignations, commission formed to investigate accident\nOn Sunday, the government of Guyana set up a five-person commission of international legal and maritime experts to investigate the incident.\nOpposition lawmakers have loudly called for the resignations of numerous government officials at ministries responsible for ports and for ferry services.\nAlthough the aging MV Barima was deemed seaworthy and had a clean maintenance record, survivors reported that it was overfilled with passengers and cargo when it sank and that it had been leaking.\nThough the commission is tasked with looking into those charges, the vessel itself lies on the Atlantic seabed, some 50 feet (15 meters) below the surface. Prime Minister Mark Phillips has said the vessel will not likely be salvaged.\nGovernment officials say the MV Barima is only still in use because construction of a new Port Kaituma pier large enough to accommodate a replacement vessel recently purchased from India has not yet been completed.\nEdited by: Jenipher Camino Gonzalez\nDon't let the algorithm hide the news. If you rely on our team for trusted reporting, please take a moment to select us as your Preferred Source on Google by clicking here and hitting the \"star\" or \"preferred\" button, so you'll always see our verified news first.", "translation_ja": "", "vocab": [{"word": "capsizing", "definition": "船舶が転覆すること。不安定な状態で横転し、沈没する危険な状況を指します。"}, {"word": "maritime", "definition": "海洋や船舶に関連する。海運業や海上災害などの海に関する事柄を表します。"}, {"word": "manifest", "definition": "積み荷や乗客の公式な記録。船舶や航空機に搭載されている人員や貨物のリストです。"}, {"word": "remanded", "definition": "法的に拘束されたままの状態に置かれること。裁判前に容疑者を拘留に戻すことを意味します。"}, {"word": "seaworthy", "definition": "航海に適した状態にある。船舶が安全に航行できるほど十分に整備されていることを示します。"}, {"word": "salvaged", "definition": "沈没した船舶などを回収・修復すること。海底などから価値のあるものを引き上げることです。"}]}, {"title_ja": "高校での銃乱射事件で16歳少年に仮釈放なしの終身刑", "title_en": "16-Year-Old Sentenced to Life Without Parole for High School Mass Shooting", "summary_ja": "16歳のコルト・グレイは、殺人と暴行罪を含む55件全てに有罪を認め、仮釈放なしの終身刑を宣告された。同少年は高校での致命的な銃乱射事件で有罪となった。グレイの有罪答弁により、起訴された罪に対する最高刑が言い渡された。", "summary_en": "Colt Gray, 16, received a life sentence without the possibility of parole after pleading guilty to all 55 counts, including multiple murders and aggravated assaults. The teenager was convicted in connection with a deadly mass shooting at his high school. Gray's guilty plea resulted in the maximum sentence available under the charges he faced.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/US/teen-colt-gray-sentenced-life-parole-deadly-mass/story?id=135156780", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ABCニュースライブ：24時間ニュース速報配信", "title_en": "ABC News Live: 24/7 Breaking News Coverage", "summary_ja": "ABCニュースライブは、世界中で起きている最新のニュースと重大なライブイベントを24時間体制でカバーしています。速報や進展中のニュースをリアルタイムで提供し、視聴者は常に最新情報にアクセスすることができます。", "summary_en": "ABC News Live provides continuous coverage of breaking news and major live events happening around the world. The service offers real-time updates and in-depth reporting on developing stories as they unfold. Viewers can access comprehensive news coverage at any time through the platform.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/video/41463246/", "state_media": false, "category": "社会", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "トランプ前大統領、ワシントンでリンゼー・グラハム上院議員を追悼", "title_en": "Trump Eulogizes Sen. Lindsey Graham at Washington Funeral", "summary_ja": "故リンゼー・グラハム上院議員の葬儀式がワシントンD.C.で火曜日に開催され、米国内外の政治指導者や著名人が参列した。トランプ前大統領はグラハムを「真の米国を代表する人物」と述べて追悼演説を行った。超党派の主要政治家が長年の上院議員の功績を讃える式典となった。", "summary_en": "National political leaders and prominent figures from around the world gathered in Washington, D.C. on Tuesday to pay their respects to the late Sen. Lindsey Graham. Trump delivered remarks at the funeral service, describing Graham as 'a true American original.' The ceremony brought together key figures from across the political spectrum to honor the longtime senator.", "source": "ABC News", "tier": "public", "link": "https://abcnews.com/Politics/sen-lindsey-grahams-funeral-service-place-dc-tuesday/story?id=135118944", "state_media": false, "category": "政治", "full_text": "", "translation_ja": "", "vocab": []}, {"title_ja": "ウガンダが干ばつ地域での飢餓死19人受け、緊急食糧支援を開始", "title_en": "Uganda launches emergency food aid after 19 hunger deaths in drought-hit east", "summary_ja": "ウガンダは降雨不足による穀物不作が原因で、干ばつに見舞われた東部カラモジャ地域に対して緊急食糧支援を開始した。最低19人が飢餓で死亡し、地域の150万人が深刻な食糧不足と栄養不良に直面している。USAIDなどの国際支援団体からの資金削減を受けて、政府主導の支援への転換を示している。", "summary_en": "Uganda has begun distributing 9,400 tonnes of emergency food to the drought-stricken Karamoja region after at least 19 deaths from hunger were reported. The 1.5 million people in the region face acute food shortages and malnutrition due to failed crops and lack of rainfall. The government initiative represents a shift toward nationally-led aid following significant funding cuts from international donors like USAID.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/global-development/2026/jul/27/uganda-begins-emergency-food-handouts-after-19-die-from-hunger", "state_media": false, "category": "政治", "full_text": "Uganda has launched emergency food relief distribution after at least 19 deaths from hunger were reported in an area of prolonged drought in the east of the country.\nA crisis has been building in the Karamoja region of Uganda as crops have failed without the season’s expected rains, leaving the region’s 1.5 million people facing acute food shortages and rising malnutrition.\nThe Famine Early Warning Systems Network (Fews Net), a global mapping network designed to raise the alert on food security, reported the situation had deteriorated to a crisis across Karamoja.\nIn the first large-scale operation of its kind organised by the Ugandan government after the funding void left by aid cuts, authorities announced plans to distribute 9,400 tonnes of relief food over the next two months. The supplies were procured using a 45bn-shilling (£9m) emergency funding allocation, approved by parliament.\nSam Engola, minister for disaster preparedness and refugees, launched the aid distribution efforts at a primary school in Lodiko sub-county in Kaabong district on Wednesday.\n“The president does not want to hear of anyone in Karamoja dying of hunger. I am here to supervise the distribution of this food to the end. I will ensure that everyone receives food. No one will be left behind,” Engola said.\nKaramoja is experiencing its most severe dry spell in years. Farmers have lost crops since the last meaningful rainfall was recorded in April – the beginning of the planting season.\nAngelina Nakiru, a 21-year-old mother of two in Rupa, about 5 miles from Moroto town in Karamoja, said she was struggling to feed her children after all her crops failed. Now she goes early each morning to join other women at a small-scale grinding mill where machines are used to crush rock into powder to wash out gold-bearing ore. The pay is meagre.\n“The work is dusty and exhausting, but it is the only way I can earn money to buy a cup of maize and beans to feed the children,” Nakiru said.\n“If I don’t, the children will sleep hungry. Other days when I fail to get the meagre income from the mill, we go to bed on empty stomachs,” she said.\n“The situation is terrible. People are starving and dying due to hunger. The government must come to the rescue of the people.”\nHealth facilities report treating hundreds of children for severe malnutrition. A nutrition report published in June found nearly half of the population in Karamoja’s Kaabong and Kotido districts in a crisis situation.\nExperts attribute the region’s recurring food insecurity and vulnerability to climate crisis shocks, environmental degradation such as deforestation and overgrazing, as well as poverty and low agricultural productivity.\nIn 2022, a devastating hunger crisis claimed more than 2,200 lives, according to figures from Uganda’s human rights commission body.\nWhile emergency food aid is expected to provide short-term relief, the government said it remained committed to implementing long-term remedial measures with the recently approved Karamoja regional development plan, which is intended to strengthen communities’ resilience to drought.\nJohn Baptist Lokii, minister for Karamoja, said: “The government will provide drought-resistant, disease-resistant and early-maturing seeds ahead of the next planting season.”\nAgnes Kirabo, executive director of Uganda’s Food Rights Alliance (FRA), said the government was taking the lead on distribution as a necessity as much as a policy choice as the landscape of humanitarian aid had changed dramatically.\nFollowing significant funding cuts, most notably from USAID, which previously had an annual budget of about $42.8bn (£32.bn), agencies such as the World Food Programme (WFP) have been forced to drastically scale back their aid.\nIn Uganda, the WFP has phased out food assistance for 63% of the refugee population, cutting off more than 1 million people from aid, and reducing rations to just 663,000 recipients.\n“This transition should not be viewed solely as a reaction to aid cuts, but also as a positive shift towards nationally owned, sustainable development. Government leadership is a constructive move, provided it is part of a long-term strategy to establish durable national systems,” said Kirabo.\n“Emergency food distribution is a life-saving measure, not a permanent solution. To break this cycle, we must address the root causes of food insecurity through structural reforms.”\nThe FRA, Kirabo said, wanted access to food to be made a fundamental human right and the government to turn its attention to water infrastructure and climate resilience. “Karamoja possesses adequate rainfall and water routes to achieve food self-sufficiency, but requires the political will to strategically invest in water infrastructure for production,” she said.\n“Ultimately, the Karamoja hunger crisis is a governance crisis. The government’s leadership in this emergency is welcome, but it must be matched by the political will to implement the systemic changes required to permanently", "translation_ja": "", "vocab": [{"word": "deteriorated", "definition": "悪化した、衰退したという意味。状況や状態が徐々に悪くなることを表す。"}, {"word": "acute", "definition": "急性の、深刻なという意味。健康や問題が突然で重大なことを指す。"}, {"word": "resilience", "definition": "回復力、耐性という意味。困難や変化に対して適応できる能力を表す。"}, {"word": "durable", "definition": "耐久性のある、長続きするという意味。長期間持続する解決策や制度に使われる。"}, {"word": "remedial", "definition": "是正的な、改善するという意味。問題を解決するための対策や行動を指す。"}, {"word": "degradation", "definition": "劣化、悪化という意味。環境や資源の質が低下することを表す。"}]}, {"title_ja": "アンゴラでテロと諜報活動の罪で投獄されたロシア人2名", "title_en": "Two Russian Men Jailed in Angola for Terrorism and Spying", "summary_ja": "アンゴラの裁判所は、選挙に影響を与え致命的なデモを組織しようとした罪でロシア人2名に懲役8年と11年の判決を下した。両者はワグネル傭兵集団に関連するロシアの偽情報ネットワーク「アフリカ・ポリトロジー」と協力していたと主張されている。アンゴラ政府は歴史的にロシアと関係が深いが、最近では米国とヨーロッパとの関係を改善している。", "summary_en": "An Angolan court has sentenced two Russian men to eight and 11 years in prison for terrorism and spying, accusing them of attempting to influence the country's elections and organize deadly protests. The men allegedly worked with Africa Politology, a Russian disinformation network linked to the Wagner mercenary group. Angola's government has historically been close to Russia but has recently improved relations with the US and Europe.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/world/2026/jul/23/two-russian-men-jailed-angola-terrorism-and-spying", "state_media": false, "category": "社会", "full_text": "Two Russian men have been found guilty by an Angolan court of terrorism and spying after being accused of planning a coup and helping to organise deadly demonstrations in the southern African country last year.\nLev Lakshtanov and Igor Ratchin were sentenced to eight and 11 years in jail respectively. They had denied the charges, claiming they were in Angola for cultural and business activities.\nFrom 28-30 July 2025, a minibus taxi strike over fuel price hikes descended into riots and looting, in which 22 people were killed and more than 1,600 arrested according to official figures.\nAngola’s security forces were accused of firing live ammunition at protesters; the government said its “progressive” use of force was justified. Human Rights Watch had previously said Angola employed “excessive force” when it used rubber bullets and teargas to break up a peaceful protest against rising fuel prices on 12 July 2025.\nAngolan prosecutors said Lakshtanov and Ratchin wanted to influence next year’s presidential elections, including by funding Angola’s largest opposition party, the National Union for the Total Independence of Angola (UNITA), or by forcing a leadership change within the Popular Movement for the Liberation of Angola (MPLA), which has ruled the country since independence from Portugal in 1975.\nProsecutors also claimed the men were linked to Africa Politology, a Russian disinformation and propaganda network that emerged from the Wagner mercenary group.\nAfrica Politology was taken over by Russia’s Foreign Intelligence Service (SVR) after the death of the Wagner chief Yevgeny Prigozhin in 2023, according to an investigation by media outlets including Forbidden Stories. Wagner was rebranded as Africa Corps and absorbed by Russia’s military.\nAngola, whose economy is highly dependent on oil exports, has historically been close with Russia. During the cold war years of Angola’s 1975-2002 civil war, the Soviet Union and Cuba supported the MPLA, while the US and apartheid South Africa backed its opponents, including UNITA. However, Angola’s president, João Lourenço, has improved relations with the US and Europe since taking power in 2017.\nIn the last decade, Russia has increased its presence in Africa. The Wagner group and then Africa Corps have provided security for the Central African Republic’s president, Faustin-Archange Touadéra, since 2017.\nIn 2021, Wagner forces arrived in Mali to support the military junta. Africa Corps also backs the military regimes in neighbouring Niger and Burkina Faso. Since 2023, Russian troops have also been deployed in Equatorial Guinea, Libya and Sudan, according to a US Congress report.\nMadagascar’s president, Michael Randrianirina, has also boosted ties with Russia since taking power in a coup in October 2025. There are Russians in his presidential guard and a weekly programme about Madagascar-Russia relations was launched earlier this month on national television.\nTwo Angolans were also tried alongside the Russians. The sports journalist Carlos Tomé received a two-year suspended prison sentence. Francisco de Oliveira, the secretary-general of UNITA’s youth wing, was acquitted.\nProsecutors have appealed against those sentences, according to the Portuguese news agency Lusa. Lakshtanov and Ratchin have also appealed against their sentences, but will remain in detention while the appeal is processed, according to Lusa.\nRussia’s embassy in Angola did not immediately respond to a request for comment.\nAgence France-Press contributed to this report", "translation_ja": "", "vocab": [{"word": "coup", "definition": "政府を武力で無理やり転覆させることを指します。通常、民主的でない手段で権力を奪取する行為を表します。"}, {"word": "disinformation", "definition": "意図的に広められた虚偽または誤解を招く情報のことです。真実を隠すため、あるいは特定の政治目的のために使用されます。"}, {"word": "mercenary", "definition": "金銭報酬と引き換えに、自分の国以外で軍事活動に従事する兵士のことです。利益目的で戦闘に参加する傭兵を指します。"}, {"word": "junta", "definition": "軍事クーデターによって権力を奪取した軍人グループによる政府のことです。通常、民主的でない独裁的支配を行います。"}, {"word": "prosecutor", "definition": "公訴を行い、犯罪者を起訴する法律職員のことです。検察官として裁判で国側の主張を代表します。"}, {"word": "acquitted", "definition": "裁判で無罪と判決されることを意味します。有罪ではないと公式に認定されることです。"}]}, {"title_ja": "英国防省、兵士の訴追権を巡りケニアでの軍事訓練をキャンセル", "title_en": "UK Cancels Kenya Army Training Over Soldier Prosecution Powers", "summary_ja": "ケニア政府が英兵に対する訴追権強化を求めて防衛協定の批准を拒否したため、英国防省はケニアでの予定されていた軍事訓練をキャンセルした。紛争は犯罪行為に対する管轄権と訓練キャンプ受け入れのための財政的取り決めに焦点が当たっている。この中止により、9月に予定されていたダッカス・ランカスター公爵第1大隊の訓練演習が影響を受ける。", "summary_en": "The British Ministry of Defence has cancelled planned military training in Kenya after the Kenyan government refused to ratify a defence agreement without stronger powers to prosecute British soldiers. The dispute centres on jurisdiction over offences and the financial arrangement for hosting the training camp. The cancellation affects a planned exercise by the 1st Battalion the Duke of Lancaster's Regiment scheduled for September.", "source": "The Guardian", "tier": "paper", "link": "https://www.theguardian.com/uk-news/2026/jul/23/british-army-cancel-training-kenya-defence-agreement-dispute", "state_media": false, "category": "政治", "full_text": "The British army has been forced to cancel training for its troops in Kenya after the Kenyan government refused to ratify a bilateral defence agreement.\nWhile the UK government wanted to renew the existing agreement, Kenyan lawmakers had sought changes to give local authorities greater powers to hold British soldiers accountable for any offences committed in the country.\nAccording to the Kenyan news outlet the Daily Nation, the dispute centres on which cases Kenya will retain primary jurisdiction over, while the amount of money Britain pays Kenya to host the training camp has also been a sticking point.\nThe chair of the Kenyan national assembly’s defence, intelligence and foreign relations committee, Nelson Koech, said the two governments were “actively engaging to address these outstanding issues”.\nAs a result of the Kenyan government’s decision, a planned exercise involving the 1st Battalion the Duke of Lancaster’s Regiment, which was due to begin in September, has been cancelled.\nA Ministry of Defence spokesperson said: “The UK highly values its relationship with Kenya, which is underpinned by mutual benefit, respect and cooperation. The UK-Kenya Defence Partnership is one of the great strengths of our relationship. Our joint training and operations with the Kenyan Defence Forces are keeping both Kenyan and British people safe.\n“It is with regret that the necessary licences required to allow training to take place in Laikipia later this year have not been forthcoming. As a result, the planned training will now be conducted at an alternative location outside Kenya.”\nKenya also benefits from training of its own armed forces at BATUK, the British army base near Nanyuki, and the presence of British troops is valuable for the economy.\nThe MoD spokesperson added: “We recognise the disappointment this decision will cause for those who would have benefited from the economic activity generated by the exercise.”\nThey said the UK government remained “committed to our defence partnership with Kenya”, adding that the UK would “continue to engage closely with the Kenyan government to support the resumption of training in-country at the earliest appropriate opportunity”.\nHowever, there has been sustained pressure from Kenyan people opposed to the British army’s continued presence. Last year, a report to the Kenyan parliament into the base alleged human rights violations, environmental destruction and sexual abuse by British soldiers.\nThe most high-profile case linked to the base is the death of Agnes Wanjiru, in which a British soldier has been charged with murder. Kenya has retained jurisdiction in the case and an extradition hearing is due to take place in November. Robert Purkiss denies the single charge of murder.\nLegal proceedings had stalled since Wanjiru’s death in 2012, but advanced under John Healey’s tenure as defence secretary. As shadow defence secretary, he had called on the previous government to do more to progress the case.\nKoech said the committee had called for “stronger accountability measures, including jurisdiction over serious offences, enhanced protection for local communities, and implementation of recommendations arising from the BATUK inquiry”.", "translation_ja": "", "vocab": [{"word": "ratify", "definition": "公式に条約や協定を確認・承認することを意味する。政府や議会が法的効力を持たせるために正式な同意を与える行為。"}, {"word": "bilateral", "definition": "二国間の関係や協定を指す。両国が対等に関わる相互的な取り決めを意味する。"}, {"word": "jurisdiction", "definition": "法的権限や管轄権を意味する。特定の事件や違反に対して法的措置を取る権利を有する範囲や権力。"}, {"word": "sticking point", "definition": "交渉や合意で解決が難しい重要な争点を指す。進展を妨げる主要な問題。"}, {"word": "tenure", "definition": "特定の職や地位にある期間を意味する。在任期間や保有期間を指す。"}, {"word": "accountability", "definition": "責任を負う義務や説明責任を意味する。自分の行動について責任を取り、説明する必要がある状態。"}]}, {"title_ja": "イスラエル軍の空爆、難民キャンプ近くのガザシティモスクを破壊", "title_en": "Israeli airstrike destroys Gaza City mosque near displacement camp", "summary_ja": "イスラエル軍の空爆によってガザシティのアル・ムッタキン・モスクが破壊された。このモスクはヤルムーク・スタジアムの近くにあり、そこには数十人の避難民がテント生活をしていた。空爆は強力な爆発を引き起こし、モスクに損害を与え、複数のパレスチナ人が負傷した。", "summary_en": "An Israeli airstrike destroyed Al-Muttaqin Mosque in Gaza City, located adjacent to Yarmouk Stadium where displaced Palestinians were sheltering in tents. The strike caused a powerful explosion that damaged the mosque and injured several Palestinians, as documented in video footage.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/video/newsfeed/2026/7/28/israeli-airstrike-destroys-gaza-city-mosque-near-displacement-camp?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Israeli airstrike destroys Gaza City mosque near displacement camp\nIsraeli airstrike destroys Gaza City mosque near displacement camp\nVideo footage captures an Israeli airstrike hitting Al-Muttaqin Mosque in Gaza City, next to Yarmouk Stadium, where dozens of displaced people are sheltering in tents. The strike triggered a powerful explosion that destroyed the mosque and injured several Palestinians.\nPublished On 28 Jul 2026", "translation_ja": "", "vocab": [{"word": "airstrike", "definition": "航空機による攻撃のこと。軍事作戦において敵の目標を空から爆撃すること。"}, {"word": "displacement", "definition": "人々が強制的に自分の土地や住居から移動させられることを意味する。難民や避難民の状態を説明するのに使われる。"}, {"word": "triggered", "definition": "何かを引き起こす、または開始させることを意味する。連鎖反応や爆発などの突然の出来事を表現するのに用いられる。"}, {"word": "mosque", "definition": "イスラム教信仰者が礼拝を行う宗教施設。中東や世界中のイスラム教コミュニティの中心的な場所。"}, {"word": "sheltering", "definition": "危険や悪い環境から保護されること。特に難民や避難民が一時的に安全な場所に滞在する状態を指す。"}]}, {"title_ja": "トランプ大統領と世界各国指導者がリンゼイ・グラハム上院議員の葬儀に参列", "title_en": "Trump and World Leaders Attend Senator Lindsey Graham's Funeral", "summary_ja": "サウスカロライナ州選出の共和党上院議員リンゼイ・グラハムは7月11日に予期せず逝去した。イスラエルのネタニヤフ首相、ウクライナのゼレンスキー大統領を含む世界的指導者らが火曜日にワシントン・ナショナル・カテドラルで行われた葬儀に参列した。トランプ大統領は、グラハムが30年以上にわたりアメリカ政治と世界問題における影響力のある存在であったと称賛するスピーチを行った。", "summary_en": "Senator Lindsey Graham of South Carolina, a key Republican ally of President Donald Trump, died unexpectedly on July 11. World leaders including Israeli Prime Minister Netanyahu and Ukrainian President Zelenskyy attended his funeral service at Washington National Cathedral on Tuesday. Trump delivered remarks praising Graham as an influential force in American politics and global affairs for over 30 years.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/gallery/2026/7/28/donald-trump-and-world-leaders-attend-lindsey-grahams-funeral?traffic_source=rss", "state_media": false, "category": "政治", "full_text": "In Pictures\nDonald Trump and world leaders attend Lindsey Graham’s funeral\nHundreds of mourners have paid their respects to the late Senator Lindsey Graham of South Carolina.\nThe Republican lawmaker and key ally of President Donald Trump unexpectedly died on July 11.\nGraham was elected to the US Senate in 2002 and was re-elected in 2008, 2014 and 2020. In 1994, he was elected to the US House of Representatives, the lower house of the US Congress, for South Carolina’s third congressional district. He recently served as chairman of the Senate Budget Committee. Graham also served as a member of the Senate Committee on Appropriations, the Senate Judiciary Committee and the Senate Committee on Environment and Public Works.\nHe was a strong supporter of the 2003 US invasion of Iraq and had long pushed for military action against Iran.\nGraham was a longtime backer of Israel and supported Trump’s ongoing war on Iran. In a planned documentary, Graham told the filmmakers he “almost cried” after the US and Israel began strikes on Iran in February.\nHe also vocally supported Ukraine after Russia invaded the country in 2022.\nIsraeli Prime Minister Benjamin Netanyahu, Ukrainian President Volodymyr Zelenskyy and several other world leaders attended Graham’s funeral service on Tuesday afternoon at the Washington National Cathedral in Washington, DC.\nTrump gave remarks, calling Graham a force in the world and US politics. He called Graham “a beloved friend” and said that he “died doing the work he was born to do”.\n“For more than 30 years, nothing of consequence happened in this capital without Lindsey Graham knowing about it. Nothing of significance happened anywhere in the world without Lindsey Graham having a view on it,” Trump said. “And no bill became law in the most exceptional republic in human history without Lindsey Graham having a say in it.”\nHe added: “He was a man who gave America the full measure of his good and mighty heart until that heart itself just gave out.”", "translation_ja": "", "vocab": [{"word": "ally", "definition": "共通の目的のために協力する国家や個人。政治的・外交的パートナーを指す。"}, {"word": "lawmaker", "definition": "法律制定に従事する政治家。特に議会の議員を指す。"}, {"word": "vocal", "definition": "公然と、また率直に意見や支持を表明する様子。黙黙としていない。"}, {"word": "invasion", "definition": "軍事力を用いて他国の領土に侵入すること。軍事侵攻。"}, {"word": "consequence", "definition": "重要性や影響力を持つこと。結果として起こること。"}, {"word": "appropriations", "definition": "議会が政府機関に予算配分する行為。公的資金の割り当て。"}]}, {"title_ja": "イランとオマーンがホルムズ海峡の管理に関する提案を交換", "title_en": "Iran and Oman Exchange Proposals to Manage Strait of Hormuz", "summary_ja": "イランとオマーンはホルムズ海峡の管理をめぐって交渉を行っており、オマーンはマラッカ海峡モデルに基づいた自主的な手数料を課す地域メカニズムを提案している。イランの副外相は同等の通航ルート分割を拒否し、代わりにイランが自国側を管理し、オマーンが対岸の一部を管理する案を提案した。これらの交渉は、米国とイスラエルの紛争により混乱している戦略的水路での海運を回復させるための外交的努力を示している。", "summary_en": "Iran and Oman are negotiating over the management of the Strait of Hormuz, with Oman proposing a joint regional mechanism based on the Strait of Malacca model that would charge voluntary fees. Iran's deputy foreign minister rejected an equal division of transit routes, instead proposing that Iran manage its side while Oman manages part of the opposite lane, citing security concerns. The talks represent a diplomatic effort to restore shipping through the strategic waterway disrupted by the US-Israeli conflict with Iran.", "source": "Al Jazeera", "tier": "paper", "link": "https://www.aljazeera.com/news/2026/7/28/iran-and-oman-exchange-proposals-to-manage-strait-of-hormuz?traffic_source=rss", "state_media": false, "category": "社会", "full_text": "Iran and Oman exchange proposals to manage Strait of Hormuz\nOman’s proposal is based on the Strait of Malacca in East Asia, a model whereby ships that use the strait provide voluntary fees.\nIran and Oman have exchanged proposals regarding the future management of the Strait of Hormuz, as points of contention continue to exist between the two nations whose territorial waters border the strategic waterway.\nOman presented a proposal to Iran for a joint regional mechanism to manage the Strait of Hormuz with “voluntary fees”, Reuters reported on Tuesday. Under the Omani proposal, which reportedly has regional backing, Iran would not exercise sole control of the strait, an unnamed Gulf source and Western diplomat told the news agency.\nRecommended Stories\nlist of 4 items- list 1 of 4What lies ahead for Iran’s economy as scope of US war grows beyond Hormuz?\n- list 2 of 4Why has the US halted its bombing of Iran?\n- list 3 of 4Hopes of return to diplomacy as US, Iran hold fire for third day\n- list 4 of 4Trump says ‘good chance’ of progress in Iran talks. What we know\nOman’s proposal is reportedly based on the Strait of Malacca, which connects the Indian and Pacific Oceans. There, Indonesia, Malaysia and Singapore ask ships that use the strait to voluntarily contribute to fund navigation, environmental protection, and search-and-rescue operations.\nThis proposal aims to contribute to ending the global disruption to trade caused by the strait’s closure in the US-Israeli war on Iran. Tehran, however, says the strait cannot go back to its pre-war status where shipping flowed freely,\nIn comments to Iranian state media on Tuesday, Kazem Gharibabadi, the country’s deputy foreign minister for legal and international affairs, said Tehran rejects an Omani proposal for an equal division of transit routes between the two countries, as such a plan does not address Tehran’s security concerns.\nGharibabadi said that Tehran proposed to Oman that Iran would manage shipping through its side of the strait and Muscat would manage part but not all of the opposite lane.\nHe added that Tehran has “no plans to negotiate with the US”, but affirmed talks are proceeding “step by step” with Oman, warning that Tehran will consider “any action” to maintain control over the strait, including the resumption of war.\n“The Omanis are now suggesting three lines for the maritime traffic: one that runs through Iran’s territorial waters, an international one, and one through Omani territorial waters,” said Al Jazeera’s Resul Serdar, reporting from Tehran. “Despite public statements, our sources tell us Iran is demonstrating some flexibility.”\nAl Jazeera’s Tohid Asadi, also reporting from Tehran, said there remain many “points of contention” between Oman and Iran on Hormuz. These include the trajectory of the ships, the fees, the question of who will define the arrangements, and mine clearances – which will reportedly be Iran’s responsibility.\nPaul Musgrave, a professor at Georgetown University in Qatar, said Oman’s proposal to Iran to get the Strait of Hormuz running again is positive, but it remains to be seen if hardliners in Iran will go for it.\nMusgrave noted that under the Strait of Malacca model, voluntary contributions raise about $70m annually, far from the $1m per ship that’s reportedly been proposed by Tehran as a “service fee” in the Strait of Hormuz.\nMeanwhile, Gulf Cooperation Council (GCC) foreign ministers met via video call on Tuesday to discuss the latest developments in the conflict, including ways to improve cooperation on issues surrounding freedom and navigation through the waterway, a statement from the Qatari Foreign Ministry said.\nThe United States suspended a nearly two-week-long campaign of air strikes against Iran over the weekend after pressure from regional mediators to find a diplomatic solution and to return to the memorandum of understanding signed in June, which would allow shipping to resume in the Strait of Hormuz. The strait carried one-fifth of global energy supplies before the February 28 start of the US-Israel war on Iran.", "translation_ja": "", "vocab": [{"word": "contention", "definition": "議論や対立の対象となっている事柄、または意見の相違を指します。複数の当事者が異なる立場を主張している状況で使用されます。"}, {"word": "voluntary", "definition": "強制されるのではなく、自分の意思で行うことを意味します。法律や義務によってではなく、個人の選択による行動を表します。"}, {"word": "maritime", "definition": "海や船舶に関連する事柄を指します。海洋貿易、海運、または海上交通などの文脈で使用される技術用語です。"}, {"word": "transit", "definition": "人や物が一つの場所から別の場所に移動することを意味します。特に商業的な輸送やルート通過の文脈で使用されます。"}, {"word": "trajectory", "definition": "物体が移動する経路や方向を指します。ここでは船舶が海峡を通過する際の航路を表しています。"}, {"word": "diplomatic", "definition": "政治的な交渉や国家間の関係に関する活動を意味します。対立を平和的に解決する手段や方法に関連した用語です。"}]}, {"title_ja": "トランプ大統領とネタニヤフ首相がイラン戦争巡り会談、関係修復目指す", "title_en": "Trump and Netanyahu Meet Amid Tensions Over Iran War Strategy", "summary_ja": "イスラエルのネタニヤフ首相とアメリカのトランプ大統領は2026年7月28日にホワイトハウスで会談を行い、共同でイラン戦争を開始して以来初めての対面となった。両指導者は国内からの圧力と紛争の進め方についての意見の相違に直面する中、関係修復を目指した。イラン核計画、レバノン・ヒズボラ情勢、アブラハム協定の拡大が主要議題となった。", "summary_en": "Israeli PM Netanyahu and US President Trump held a White House meeting on July 28, 2026, their first since launching a joint war against Iran. The meeting aimed to address growing strains in their relationship as both leaders face domestic pressures and disagreements over how to proceed with the conflict. Key topics included Iran's nuclear program, the Lebanon-Hezbollah situation, and the Abraham Accords expansion.", "source": "The
